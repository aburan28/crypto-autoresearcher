correction:
  id: CORR-20260807-0f5d56
  recorded_at: '2026-08-07'
  recorded_by: coordinator (GOAL-ENDO-001, BATCH-aa267f)
  type: independent_review_findings_against_this_coordinators_own_corrections
  supersedes: []
  corrects:
  - ledger/corrections/CORR-20260807-14431d.yaml
  - ledger/corrections/CORR-20260807-a24675.yaml
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-aa267f/execution/EXP-INSTR-85b102/execution_report.md
  record_type: correction
  record_id: CORR-20260807-14431d
  field: >-
    the characterisation, row counts and provenance claims of this Coordinator's
    two BATCH-aa267f corrections, and four overstatements in the EXP-INSTR-85b102
    execution report
  source: >-
    Two independent Validator sessions, dispatched at reduced enumerated scope
    (five named checks each, incremental saves) after three full-scope dispatches
    on this campaign were killed by provider session limits. Both returned
    `passed_with_findings` with all five checks reached.
    VAL-20260807-9c31ab: coordination/goals/GOAL-ENDO-001/batches/BATCH-aa267f/
    reviews/validator-icinv/validation_report.yaml
    (EXP-INSTR report): coordination/goals/GOAL-ENDO-001/batches/BATCH-aa267f/
    reviews/validator-instr/validation_report.yaml
  prior_value: >-
    CORR-20260807-14431d states that the SR3 gate was "unsatisfiable at p = 6007
    BY CONSTRUCTION", that "the contract's fb = 4 row has NO COMMITTED
    COUNTERPART", and that the committed p = 6007 sweep's lowest rows are
    "already within 0.03 of the frozen 1.3 floor". CORR-20260807-a24675 states
    that the superseded runs' "supersession is declared from the superseding
    runs' own side". The EXP-INSTR-85b102 execution report states CTRL-SIZE0 was
    inside its interval at "16 of 16" non-degenerate cells with 12 degenerate.
  corrected_value: >-
    EACH OF THOSE FOUR STATEMENTS IS WRONG IN SOME DEGREE, AND ONE OF THEM IS
    FLATLY FALSE. The corrections' CONCLUSION survives -- and is in fact
    substantiated more strongly by the Validator than by the Coordinator who
    wrote it -- but its wording, its counts and one of its provenance claims do
    not. Details below, each with the deciding number.
  findings_against_CORR_20260807_14431d:
  - id: V1
    severity: overstatement
    finding: >-
      "UNSATISFIABLE BY CONSTRUCTION" IS OVERSTATED. The sub-check that actually
      fired reads only `variance_ratio_measured` against two constants written in
      the contract itself and never reads a committed value at all, so the
      parameter mismatch is neither necessary nor sufficient for the failure. Two
      of the gate's three sub-checks PASSED at p = 6007, including the operating
      row at |delta| = 0.0122 against a +-0.25 tolerance.
    disposition: >-
      Accepted. The correct statement is that the mismatch makes a FAITHFUL
      reproduction impossible (see V4), not that the gate is unsatisfiable as a
      matter of logical form.
  - id: V2
    severity: understatement
    finding: >-
      THE ROW COUNT WAS UNDERSTATED, NOT OVERSTATED. FIVE of the contract's
      thirteen density rows have no committed counterpart at p = 6007 --
      fb in {4, 13, 15, 18, 22} -- not one. The correction named only fb = 4.
    disposition: Accepted. The defect is larger than the correction claimed.
  - id: V3
    severity: factual_error
    finding: >-
      "WITHIN 0.03 OF THE FLOOR" IS TRUE OF ONE ROW AND FALSE OF THE OTHER:
      1.3204 is 0.0204 above the 1.3 floor, but 1.3470 is 0.0470 above it.
    disposition: Accepted.
  - id: V4
    severity: conclusion_strengthened_by_reviewer
    finding: >-
      THE VALIDATOR SUBSTANTIATED THE CORRECTION'S CONCLUSION MORE STRONGLY THAN
      THE CORRECTION DID. Transporting the committed p = 6007 rows from T = 500
      to T = 400 under the CONTRACT'S OWN relation VR(T) ~= 1 + T*sigma^2 /
      (mubar(1-mubar)) drives fb = 5 to 1.2563 and fb = 7 to 1.2776, BOTH BELOW
      THE 1.3 FLOOR. So no faithful reproduction at the contract's parameters
      could have passed the band, which is the substantive claim the correction
      was reaching for.
    disposition: >-
      Accepted, and it settles the amendment question: protocol_amendment v2's
      change A1 (re-measure the p = 6007 baseline at T = 400 on the frozen
      thirteen-row grid, then gate against that) REMAINS THE RIGHT REPAIR. The
      Coordinator undertook to change A1 if a Validator found the attribution
      wrong; the attribution is imprecisely worded, not wrong, so A1 stands and
      the wording is corrected here instead.
  - id: V5
    severity: material_and_newly_surfaced
    finding: >-
      THE [1.3, 3.6] BAND IS THE OUTWARD-ROUNDED HULL OF THE COMMITTED ROWS
      THEMSELVES -- floor slack 0.020397, ceiling slack 0.011900. The gate's
      acceptance region was fitted to the data it gates, with under 2% margin at
      the floor. Neither the contract nor either correction said so.
    disposition: >-
      Accepted and carried into protocol_amendment v2 as a standing caution: a
      reproduction band drawn as the hull of the reference measurement has almost
      no tolerance for legitimate sampling variation, and any successor that
      keeps this band must say that out loud rather than presenting 1.3 as an
      independent threshold.
  findings_against_CORR_20260807_a24675:
  - id: V6
    severity: false_statement_now_repaired
    finding: >-
      "THEIR SUPERSESSION IS DECLARED FROM THE SUPERSEDING RUNS' OWN SIDE" IS
      FALSE. No run manifest carried any supersedes/superseded_by field.
      Supersession lived only in experiments/EXP-ICINV-4d33aa/implementation.md,
      so a reader opening RUN-ICINV-fg-primary-p4001/ saw `status:
      completed_valid`, `gate_passed: true` and twelve values compared against
      fabricated reference literals, with no pointer anywhere in the directory.
    disposition: >-
      Accepted and REPAIRED IN THIS COMMIT. A SUPERSEDED.yaml pointer is ADDED to
      each of the eight superseded run directories, naming the superseding run,
      the reason code, both manifest sha256 values, and a `read_this_first` that
      states plainly which fields must not be cited. The files are ADDED beside
      the frozen artifacts and modify none of them;
      tools/check_run_immutability.py permits additions and forbids modification
      or deletion, and it passes.
  - id: V7
    severity: confirmation
    finding: >-
      The fabrication count reproduces exactly under independent recovery of the
      deleted literal block from commit f6697e97: 24 checked, 22 differing, 2
      exact, deviations 1.239e-06 to 8.486e-05, and the two exact literals are
      precisely (p=4001, fb=8) and (p=6007, fb=9). The claim that no verdict
      depended on a fabricated digit was demonstrated EMPIRICALLY rather than
      argued: a structural diff of superseded against superseding records shows
      the gate `checks` block byte-identical at both primes, with only
      committed_variance_ratio, delta_vs_committed and exact_match_with_committed
      moving, and p = 4001 exact-match going 1/13 -> 13/13 at delta exactly 0.0.
    disposition: No change required. CORR-20260807-a24675 stands on this point.
  new_material_fact_neither_correction_recorded:
    id: V8
    finding: >-
      HAD SR3 NOT FIRED, THE SAME FROZEN CHAIN WOULD HAVE EMITTED OUTCOME-C --
      which under the contract's own falsification criterion F-i REFUTES
      H-ICINV-6c7920. The Validator re-executed the frozen decision rule
      read-only from committed code against committed stage artifacts and
      reproduced decision-rule-evaluation.json BYTE-EQUAL (43431 == 43431
      characters of canonical JSON), confirmed INVALID is the first branch of the
      if/elif chain in the contract's declared state order, and confirmed the
      reported metric set is state-independent. It looked for outcome shopping
      and found none.
    disposition: >-
      Recorded, and carried into protocol_amendment v2. This is NOT a result: a
      counterfactual outcome of a run that terminated INVALID is not evidence,
      and H-ICINV-6c7920 is neither supported nor refuted. But it means the
      successor protocol is being written by a Coordinator who now knows which
      way the rule was about to fall, which is a stronger reason for v2's
      `confirmatory_status: exploratory_only` and its `preliminary` evidence cap
      than the two-prime persistence statistics that were the stated reason. v2
      is amended to say so.
  findings_against_the_EXP_INSTR_85b102_execution_report:
  - id: V9
    severity: miscount_conservative_direction
    finding: >-
      CTRL-SIZE0's true split is 17 non-degenerate cells (all inside the
      interval) and 11 degenerate, not the report's "16 of 16" and "12 of 12".
      The miscounted cell is POOL_B R6_TWIST_AND_NBAND_w2, which controls.json
      records as `degenerate: false` with 8 rejections and which the report's own
      POOL_B table shows as non-degenerate and calibrated.
    disposition: >-
      Accepted. The error runs in the CONSERVATIVE direction -- it understates
      the number of calibrated cells and admits no inadmissible rung -- and no
      cell anywhere sits at 19, so every verdict is unchanged under [3, 18] too.
      CTRL-NULLOBJ's 28/28 is exactly right.
  - id: V10
    severity: mislabelled_table
    finding: >-
      Section 11's table is headed "on full_liftable, unweighted statistic" but
      its two nuisance columns carry WEIGHTED `order` values. At POOL_A the
      weighted change is +0.2507% (the reported "+0.25%") while the unweighted is
      -7.2092% -- THE SIGN FLIPS BETWEEN STATISTICS. Both numbers are
      individually correct in results.json; the header is wrong.
    disposition: >-
      Accepted. Any citation of that table must name which statistic it is
      quoting, because the two disagree in direction.
  - id: V11
    severity: overstated_root_cause
    finding: >-
      The D6 root cause (np.add.reduceat output contiguity changing summation
      order between a 1-row observed array and a multi-row null chunk) is
      presented as settled fact but is CORROBORATED FOR ONE OF THREE CELLS ONLY.
      The Validator reproduced a row-count-dependent one-ulp value for
      sumset_m3 but assigns the pair the opposite way round, and for
      sumset_eff_m3 and decomp_rate_m2 no kernel variant produced any row-count
      dependence. The pre-repair source is UNRECOVERABLE because that run was
      executed from a dirty tree at 9591caac.
    disposition: >-
      Accepted. The REPAIR is independently verified regardless -- 144/144
      R5_PERCLASS cells bitwise 1.0, 1008/1008 shape-invariance checks pass,
      56/56 `order` cells bitwise 0.0, and the shipped 1-vs-8-row self-check
      demonstrably catches a divergence that first appears at 2 rows. What is not
      established is that the named mechanism explains all three cells. The
      disposition of the poolB run is unaffected: it remains `valid: false`,
      `implementation_error`, never a negative observation, and no operative
      artifact references it.
  - id: V12
    severity: transcription_error
    finding: >-
      Section 5 prose gives SS_z = 468.6101762...; the artifact and the
      Validator's own computation give 468.6101694915254.
    disposition: Accepted; cite the artifact, not the prose.
  - id: V13
    severity: confirmation
    finding: >-
      The [3, 19] versus [3, 18] discrepancy is adjudicated IN THE RUN'S FAVOUR.
      Exact rational computation gives [3, 19] under all three standard
      conventions: P(X>=19) = 0.00582 > 0.005 > 0.00266 = P(X>=20), so 18 cannot
      be the upper endpoint of an exact equal-tailed 99% region. The contract's
      "roughly 3 to 18" is the normal approximation [2.0608, 17.9392] and the
      contract labelled it a guide. The S1 gate's pass and the frozen-function
      zero-behavioural-change receipt both reproduce independently, the latter
      including a scan for runtime rebinding that byte-identity alone would not
      have excluded.
    disposition: No change required.
  standing_instrument_gap_carried_forward: >-
    `run.code.dirty` is TRUE in every EXP-ICINV-4d33aa manifest and only
    harness/exp_icinv.py is hash-pinned, so 17 of the 19 measurement runs have no
    binding between their numbers and the exact source that produced them. The
    Validator's read-only re-execution repairs this for the decision record
    alone. This is the same class of defect as open action N6 (git_state()'s
    untracked-source blind spot, carried unresolved since DEC-20260807-c8aa8b)
    and it is now blocking: it is why V11's pre-repair source is unrecoverable.
  what_does_not_change:
  - >-
    EXP-ICINV-4d33aa's terminal_state remains INVALID and remains not evidence in
    either direction. H-ICINV-6c7920 is neither supported nor refuted.
  - >-
    EV-ENDO-10109d is untouched, and CORR-20260807-d78e2f's confound stays
    exactly as open as before.
  - >-
    Both Validators state their own limit explicitly and it is carried here: a
    passing report makes these receipts admissible; it supports no ECDLP claim,
    demonstrates no speedup, establishes neither replacement nor retention of
    NULL-C, and authorizes no promotion or closure of GOAL-ENDO-001 or any
    hypothesis.
  - >-
    Neither review was exhaustive. Unchecked at EXP-ICINV-4d33aa: stage-2
    null-first enforcement, Arm C detection, all stage-3 sweep statistics, the
    variance-decomposition identity at 1053 cells, the five tail checks,
    class_census at p = 4001/6007, and sum-set sharing. Unchecked at
    EXP-INSTR-85b102: per-replicate control draws, and -- the larger gap -- the
    non-monotonicity question reported at 17-23 of 36 cells per pool and
    attributed to Monte-Carlo noise, which is the inventor protocol's canonical
    artifact tell and was verified by nobody.
  required_action:
  - >-
    Cite CORR-20260807-14431d only together with this record. Its conclusion
    stands; its "by construction" wording, its one-row count and its 0.03 claim
    do not.
  - >-
    protocol_amendment v2 is updated in this commit to record V4, V5 and V8. It
    remains NOT APPROVED.
  - >-
    The unchecked non-monotonicity question at EXP-INSTR-85b102 is the highest-
    value target for the next review dispatch. An artifact tell attributed to
    noise, with nobody having checked, is exactly the shape of the two defects
    this campaign has already had to correct.
  - >-
    N6 is promoted from carried-open to blocking for this campaign's next
    execution: no successor run should be dispatched until run manifests pin the
    hashes of every source file they execute.
