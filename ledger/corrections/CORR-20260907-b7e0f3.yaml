  prior_value: >-
    source_statements.md states the held transcription "k = lambda_triv ~
    #{split p <= m} ~ pi(m)/2 [Sec 4.3]" and reads the "/2" factor as: "a
    split prime contributes ONE generator to the set S, so the count of
    usable split primes <= m is approximately half the count of all primes
    <= m (the other half being inert or ramified primes ... which do not
    contribute a generator under this reading)." cost_model.md's E2
    written reconciliation (section 1) restates the identical mechanism:
    "a split prime contributes ONE generator to the set S ... (the other
    half being inert or ramified primes, which do not split and so do not
    contribute a generator under this reading)." constants_table.csv's
    "degree convention for k" row cites this same "one generator per split
    prime" justification and does not mention any unit-count constant.
    Neither file contains the symbol "e" or "unit count" anywhere
    (confirmed by VAL-20260907-b0832b via grep of both files).

  corrected_value: >-
    Per VAL-20260907-b0832b's independent digit-level check against
    arXiv:math/0411378v3 page 15 (Section "4.3 Eigenvalue Separation under
    the Generalized Riemann Hypothesis") and page 13-14 (Section 4.2's
    definition of e): the source's actual formula is "lambda_chi = (1/e)
    sum_{p<=m} a_p(chi) = (1/e) sum_{p<=m} sum_{integral ideals a subset K,
    Na=p} chi(a)" (equation 4.4), and for the trivial character, "Since
    roughly half of rational primes p split in K, AND THOSE WHICH DO
    SPLIT INTO TWO IDEALS OF NORM p, lambda_triv is roughly pi(m)/e ~
    m/(e log m)". "e is the number of units in O (which always equals 2
    for disc(O) > 4)" (page 13-14). The source's own mechanism is
    therefore: a split prime contributes TWO ideals of norm p (not one
    generator) to the sum in (4.4); the eventual factor of 2 in
    "pi(m)/2" comes from dividing the resulting ~pi(m)-sized sum by the
    unit-count constant e (which is 2 whenever |disc(O)| > 4), NOT from
    "a split prime contributes one generator, so half the primes are
    excluded" as source_statements.md and cost_model.md currently state.
    The two derivations happen to produce the identical asymptotic numeric
    value (~pi(m)/2) ONLY because e=2 in the generic case; this run's own
    |D|=4q convention makes disc(O)=-4q, so |disc(O)|=4q>4 for every
    q>=2^64 in this run's grid, which always satisfies the source's own
    stated condition for e=2. The held "one generator per split prime"
    story is this program's own invented (and, per the source's own text,
    incorrect) mechanism, not the source's stated reasoning -- it is
    numerically inert here only by coincidence of this run's own parameter
    choice, not because it is the correct derivation. constants_table.csv
    should carry "e" as an explicit, cited, traceable constant (source:
    arXiv:math/0411378v3, page 13-14, "the number of units in O"; value 2
    whenever |disc(O)| > 4, per the source's own stated condition) in any
    future run reusing this cost model, rather than leaving it invisibly
    folded into a bare "/2".

  reason: >-
