  items:
    - id: B1
      field: criterion_readings.EXP-CZLIFT-bdae69.unexpected_observation, fourth sentence
      prior_value: >-
        "This is the integer section being multiplicative below p, not a
        p-adic effect; it has no elliptic analogue because point addition
        always reduces."
      corrected_value: >-
        This is the integer section being multiplicative below p, not a p-adic
        effect. The exact criterion is g^d mod p^2 < p (Eisenstein's
        logarithmic property of the Fermat quotient; analysis.md D-1 to D-3):
        all 24 pairs with g^d < p succeed, no pair with p <= g^d < p^2 can, and
        the other 9 match the exact conditional null. An elliptic analogue
        EXISTS: on a small-coefficient global model, an integral (or
        small-height) section recovers d exactly at the integral multiples
        [d]P~ of a small global lift P~ of P (review-side: 37a1 short model
        y^2 = x^3 - 16x + 16, P~ = (0, 4), 1420 of 1420 rows at d in {2..6};
        y^2 = x^3 + 17, P~ = (-2, 3), 287 of 287 at d = 2). That set is
        Siegel-finite and independent of p; it applies only to instances
        where P lifts to a small global point, and it carries no discrete-log
        leverage. It is model- and lift-convention-dependent (37a1 minimal
        model: d in {1, 2, 3, 4, 6}). The claim "point addition always
        reduces" is false for integral multiples of a small global point.
      basis: [DEC-20261023-039ddf next_actions and R1, EV-CZLIFT-f2a401 OBS-6/OBS-9/B-4/B-5, red-team O1 of RT-20261023-2411b8]
    - id: B2
      field: criterion_readings.EXP-CZLIFT-bdae69.reading, first sentence
      prior_value: >-
        "The Teichmuller section is homomorphic and log_p-vanishing on every
        pair, and the random-digit Hensel section's ratio equals d at the 1/p
        rate (|z| < 1) on both seeds."
      corrected_value: >-
        The Teichmuller section is homomorphic on every sampled pair, and
        log_p(s(x)^{p-1}) vanishes on every sampled point (recorded at 40
        distinct points s(g) per seed; full-row coverage 3200 of 3200 is the
        validator's), so the ratio is never defined. The random-Hensel
        section's ratio equals d on 3 of 3200 pairs against 5.39 expected at
        mean 1/p (ratio 0.56, CI 0.12 to 1.63): consistent with 1/p and
        supported only to a pooled upper bound of 1.63x of 1/p.
      basis: [DEC-20261023-039ddf scoped_claim, EV-CZLIFT-f2a401 OBS-2/B-7]
    - id: F1
      field: criterion_readings.EXP-CZLIFT-f5e06c.reading
      prior_value: >-
        "At 10^4 <= p <= 10^5 the canonical-lift rule, Smart's recovery on
        non-split lifts, and every torsion-section identity hold exactly as at
        toy scale; success rates of the non-canonical sections stay at 1/p."
      corrected_value: >-
        At 10^4 <= p <= 10^5 (still toy tier) the j-distance rule (0
        disagreements in 164 curve x lift-class cells), Smart's recovery on
        pert_p lifts (1152 of 1152) and the five torsion-section rates and the
        tau-ratio identity (576 of 576 pairs, same-code evidence) hold exactly.
        Non-canonical sections succeeded 0 times in 3456 anomalous-degenerate
        rows and 0 times in 576 rows per torsion section; the design has no
        power against 1/p (P(all zero | 1/p) = 0.850, likelihood ratio 0.85),
        so these rows give only 95 percent upper bounds of 8.7e-4 per
        anomalous row and 5.2e-3 per row per torsion section. "Stay at 1/p" is
        not established.
      basis: [DEC-20261023-9de83a rationale and scoped_claim, EV-CZLIFT-e9a7cf]
    - id: F2
      field: criterion_readings.EXP-CZLIFT-f5e06c.claim_boundary
      prior_value: >-
        "CM curves (and random lifts on the non-anomalous arm) sampled between
        10^4 and 10^5; medium tier."
      corrected_value: >-
        CM curves (and random lifts on the non-anomalous arm) sampled between
        10^4 and 10^5; TOY tier: the largest field is F_p with p = 97813
        < 2^17, and the mechanical rule of docs/claims-and-verification.md
        makes it toy. The working ring Z/p^8 is not a larger field. No CZLIFT
        clause has medium-tier evidence.
      basis: [DEC-20261023-9de83a, EV-CZLIFT-e9a7cf claim_tier_note]
    - id: R1
      field: criterion_readings.EXP-CZLIFT-14f6d5.reading
      prior_value: >-
        "The retrieved rank-record curves carry far fewer small points than
        the rank-7 minimal-conductor curve; what points exist reduce like
        uniform points; no half-coverage is reached at any prime above 1000."
      corrected_value: >-
        Already superseded at clause level by DEC-20261023-6931ab; restated
        here. In the three named reduced minimal models, the record curves
        carry fewer points of naive x-height <= H than the rank-7 curve (5 and
        215 against 1155 at H = 1e5; 11 and 311 against 1559 at 3e5). That is
        an observation about those models in that window, not about rank or
        c_E: N_E(H) at finite H is model-dependent, a single-H count is
        rank-blind, and across seven rank >= 7 curves the counts order by
        discriminant. "Reduce like uniform points" is contradicted as stated
        (post hoc: median 1.0424 against a nested uniform null of 1.0008 +-
        0.0017), and the frozen coverage edge it rests on cannot fail upward.
        "No half-coverage at p > 1000" cannot fail given the counts
        (distinct <= 311 < N_p/2 for p >= 1000).
      basis: [DEC-20261023-6931ab, EV-CZLIFT-b6fe48, experiments/EXP-CZLIFT-14f6d5/analysis.md D1-D4]
    - id: L1
      field: criterion_readings.EXP-CZLIFT-7c8d73 and criterion_readings.EXP-CZLIFT-8c50ea (pointer only)
      prior_value: >-
        EXP-CZLIFT-7c8d73 reading "The formal-series instrument agrees with
        the j-distance rule on every sample, and on every split sample the
        explicitly constructed p-torsion lift verifies by curve arithmetic;
        non-split lifts never admit one." EXP-CZLIFT-8c50ea reading "Over
        Q(2^{1/3}) the small points exceed the rational ones by a bounded
        factor and reduce to E(F_p) at split primes like uniform points."
      corrected_value: >-
        No new value. Both run sets are inadmissible as evidence and were
