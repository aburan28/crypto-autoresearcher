correction:
  id: CORR-20260727-006
  recorded_at: '2026-07-27'
  record_type: claim
  record_id: EXP-IC-001-AMENDMENT-v2-to-v3
  field: confirmatory_status (and, consequentially, affected_runs)
  prior_value: >-
    experiments/EXP-IC-001/amendments/v2_to_v3.yaml records
    "confirmatory_status: preserved" and "affected_runs: []". Downstream,
    ledger/evidence/EV-IC-001.yaml observations report the revised criterion as
    "SUCCESS CRITERION MET", and ledger/decisions/DEC-20260726-005.yaml
    rationale item 1 is "The revised (v3) success criterion is MET: 4/4
    instances where sqrt(N) > T_desc_gops have finite K*."
  corrected_value: >-
    confirmatory_status: exploratory_only. affected_runs should record that ALL
    748 committed EXP-IC-001 runs predate this amendment - not that no run
    needs re-execution, which is true but is not the point the field carries.
    Consequentially: the v3 outcome may NOT be reported as a satisfied
    confirmatory pre-registered criterion. EV-IC-001's "SUCCESS CRITERION MET"
    and DEC-20260726-005 rationale item 1 must be read as an EXPLORATORY
    outcome, and DEC-20260726-005's support verdict loses that ground.
  reason: >-
    docs/task-lifecycle.md section 5 states: "Protocol changes after approval
    require a versioned amendment. Exploratory changes must be labeled
    exploratory and cannot be evaluated against the original confirmatory
    criterion." The v2_to_v3 amendment's own reason field cites observed
    outcomes as its justification - "At 36-bit with 13 seeds, only 4/13 (31%)
    have finite K*" and "4/4 instances with N > 10^9 have finite K*" - so the
    criterion was revised after the original was observed to fail, using the
    observed outcome to select the replacement. experiments/EXP-IC-001/
    analysis.md lines 51-54 independently record that the v2 criterion was NOT
    met and "The result is inconclusive", and that text was written BEFORE the
    amendment. By the plain text of the rule this is an exploratory change, and
    "preserved" is the one status the rule excludes.
    A second, independent defect compounds it, adjudicated by RT-20260727-001
    (TASK-20260727-004) and concurred in by the Coordinator: the replacement
    criterion is near-tautological. From EXP-IC-001/specification.yaml
    metrics.crossover_K_star, K* is finite exactly when
    sqrt(N) > T_desc_gops + T_verify with T_verify frozen at 2 group
    operations, while the v3 criterion conditions on sqrt(N) > T_desc_gops.
    The criterion can fail only inside a two-group-operation window against a
    T_desc_gops of roughly 32,000, and the narrowest actual margin across the
    four conditioning-set members is 23,982. The reported 4/4 is therefore an
    arithmetic consequence of the conditioning rather than a measurement.
  contrast_preserved_deliberately: >-
    experiments/EXP-IC-001/amendments/v1_to_v2.yaml records
    confirmatory_status: preserved and that IS defensible: it repaired five
    blocking review objections before execution, with no outcome observed.
    Nothing about v1_to_v2 is corrected here.
  scope_of_this_correction: >-
    experiments/EXP-IC-001/amendments/v2_to_v3.yaml, ledger/evidence/
    EV-IC-001.yaml and ledger/decisions/DEC-20260726-005.yaml are immutable
    committed records and are NOT edited by this correction. Per AGENTS.md
    rule 4 they are corrected by this superseding record. This correction
    changes no experiment result: the 748 runs, their certificates and the
    measured T_desc_gops values stand exactly as recorded. It changes only what
    the v3 outcome may be CALLED. No hypothesis status is changed by this
    record; the H-IC-001 transition is made by DEC-20260727-008.
  what_this_correction_does_not_assert: >-
    It does not assert that H-IC-001's prediction is false. Against the matched
    single-target Pollard rho baseline that EXP-IC-001 itself declared,
    T_desc_gops < sqrt(N) at 4 of 34 instances remains arithmetically true on
    the committed numbers, and H-IC-001's own falsification condition is not
    met. What is corrected is the evidentiary STATUS of that outcome, not the
    arithmetic.
  evidence_artifacts:
    - ledger/corrections/CORR-20260727-006.yaml
    - ledger/evidence/EV-IC-002.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-006/reviews/TASK-20260727-004/review_report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-006/reviews/TASK-20260727-004/adversarial_notes.md
    - experiments/EXP-IC-001/amendments/v2_to_v3.yaml
    - experiments/EXP-IC-001/analysis.md
    - docs/task-lifecycle.md
  affects:
    - experiments/EXP-IC-001/amendments/v2_to_v3.yaml confirmatory_status and affected_runs (read as corrected_value after this record)
    - ledger/evidence/EV-IC-001.yaml observations items 5 and 6, and its inference paragraph
    - ledger/decisions/DEC-20260726-005.yaml rationale items 1 and 5, and context
    - ledger/goals/GOAL-ECDLP-001.yaml integrity note INT-BATCH006-008, which raised this point and left it open pending TASK-20260727-004; it is now adjudicated
  decided_by: coordinator
