correction:
  id: CORR-20260802-a7146b
  recorded_at: 2026-08-02
  record_type: claim
  record_id: EV-AES-d33b1c
  field: hypothesis_id
  prior_value: >-
    EV-AES-d33b1c set `hypothesis_id: null`, with a hypothesis_note explaining
    that RQ-AES-003 is an execution-and-certification question, that this batch
    tested three named objects directly rather than a registered hypothesis, and
    that null was recorded "rather than invented".
  corrected_value: >-
    Superseded by EV-AES-d8a13e, which sets `hypothesis_id: RQ-AES-003` and keeps
    the explanatory note. Every observation, limit, boundary, confound and
    inference block is byte-identical; no claim is added, removed or altered.
  reason: >-
    A SCHEMA DEFECT OF MINE, CAUGHT BY CI RATHER THAN BY A REVIEWER. The ledger
    schema lists hypothesis_id as required for evidence records, and a null value
    reads as missing, so EV-AES-d33b1c raised the repository's new-error count
    from 182 to 183. The campaign's OWN convention, established by EV-AES-001
    through EV-AES-005, is to carry the QUESTION id in that field when no
    hypothesis record is bound, with a note saying exactly that. The convention
    was already there and already right; I deviated from it while trying to avoid
    asserting a hypothesis that does not exist, and produced an invalid record
    instead.
    WHY SUPERSESSION RATHER THAN AN IN-PLACE EDIT, STATED CORRECTLY AT THE
    SECOND ATTEMPT. My first draft of this correction claimed that editing
    EV-AES-d33b1c would break the dispatcher verification of the ledger archive
    TASK-20260802-c90b58, because the file is bound by sha256 there. THAT
    REASONING IS FALSE AND I HAD ALREADY DEMONSTRATED IT FALSE EARLIER IN THIS
    SAME BATCH: the dispatcher verifies an archive against its COMMIT, not
    against the working tree. When seven segment-3 paths diverged from their
    c1ff4665 digests, research_dispatch.py still accepted the snapshot archive,
    and that fact is recorded in SEGMENT-3-SCOPE-NOTE.md. An edit in a LATER
    commit would leave commit 2b894d1e untouched and the archive would still
    verify. I reached for a technical justification that sounded stronger than
    the real one and did not check it against a result I had produced myself an
    hour before.
    THE REAL REASON IS THE PLAIN ONE. AGENTS.md makes ledger records IMMUTABLE:
    corrections supersede, they never overwrite. That rule does not have a
    hash-integrity exception, and it does not need one to apply here. The cost of
    honouring it is visible and is stated rather than hidden: EV-AES-d33b1c
    remains in the tree, unedited and schema-invalid, so the repository's
    new-error count stays at 183 against the base branch's 182 rather than
    returning to parity. That +1 is the accepted price of not overwriting a
    published record, and anyone auditing the CI delta should attribute it to
    this correction and to nothing else.
    A reader who reaches EV-AES-d33b1c via the archive receipt finds the record
    the reviewers' package produced; a reader who wants the schema-valid record
    follows this correction to EV-AES-d8a13e.
  evidence_artifacts:
    - ledger/evidence/EV-AES-d33b1c.yaml
    - ledger/evidence/EV-AES-d8a13e.yaml
    - coordination/goals/GOAL-AES-003/batches/BATCH-002/archives/TASK-20260802-c90b58/ledger-receipt.json
  supersedes: null
  superseded_by: null
