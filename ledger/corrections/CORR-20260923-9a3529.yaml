  items:
    - id: H1
      field: statement clause (i), "F_V is pi-stable ... exactly when V is sigma-stable"
      prior_value: >-
        (i) F_V is pi-stable, for pi(x,y) = (x^q, y^q), exactly when V is
        sigma-stable, and the sigma-stable subspaces are exactly the ideals of
        F_q[T]/(T^n - 1), so the attainable l are exactly the subset sums of the
        degrees of the irreducible factors of T^n - 1;
      corrected_value: >-
        (i) If V is sigma-stable then F_V is pi-stable. The converse holds for
        the SET OF x-COORDINATES of F_V: F_V is pi-stable iff that set is
        sigma-stable, equivalently iff F_V = F_W for the sigma-stable W spanned
        by those x-coordinates. So V itself is sigma-stable whenever the
        x-coordinates of F_V span V. The sigma-stable F_q-subspaces of F_{q^n}
        are exactly the submodules of F_{q^n} as an F_q[T]-module with T acting
        as sigma, which correspond one-to-one to the monic divisors of T^n - 1;
        the attainable dimensions are exactly the subset sums of the degrees of
        the irreducible factors of T^n - 1, counted with multiplicity when
        p | n.
      found_by: >-
        TASK-20260923-69e71b F-J1-5. Certificate: on the run's own curve
        y^2 + xy = x^3 + 1 over F_{2^7}, 182 of 11,809 non-stable 3-dim V' and
        462 of 2,667 non-stable 2-dim V' have pi-stable F_{V'}; similar at (2,5)
        and (3,5). Every such F_{V'} has 1 to 3 points, all pi-fixed, with no
        orbit content (validator computations.json, j1_clause_i).
      effect_on_values: none. Counts, spectra and every orbit-bearing factor base are untouched.

    - id: H2
      field: statement clause (iii), "so the orbit gain is exactly n asymptotically and never more"
      prior_value: >-
        (iii) for n an odd prime the number of pi-orbits on F_V is exactly
        f + (|F_V| - f)/n with f = #(E(F_q) affine points in F_V), so the orbit
        gain is exactly n asymptotically and never more;
      corrected_value: >-
        (iii) Let n be an odd prime with gcd(q, n) = 1, pi the q-power
        Frobenius, and E/F_q ordinary with a Weierstrass model (the model from
        which x(P) is read) whose coefficients do NOT all lie in a proper
        subfield of F_q (automatic for q prime). Then every pi-orbit on F_V has
        length 1 or n, the length-1 orbits being exactly the affine points of
        E(F_q) in F_V, so the number of pi-orbits is f + (|F_V| - f)/n. The
        pi-quotient therefore divides the number of factor-base classes by the
        mean orbit size g = |F_V| / (f + (|F_V| - f)/n) <= n, which tends to n
        only as |F_V|/f grows. The bound is on the pi-quotient ALONE. Larger
        symmetry groups acting on the same F_V are not bounded by it: the group
        generated by pi and negation gives classes of size 2n; extra
        automorphisms at special j give more (classes of size 4n on the run's
        own (q, n, dim) = (5, 3, 2) panel curve with j = 1728); and if E has a
        model over F_{q0} with q = q0^k, the q0-power Frobenius pi_{q0} is an
        endomorphism of E of order kn on E(F_{q^n}), a sigma_{q0}-stable V gives
        a pi_{q0}-stable F_V, and the Frobenius gain is then measured against
        kn = [F_{q^n} : F_{q0}], not against n. The case of E merely ISOMORPHIC
        to a curve with a model over a proper subfield (a twist) was not
        examined and is not asserted either way.
      found_by: >-
        TASK-20260923-33a48b J3(ii), PTM-6 and PTM-7 (computations.json
        COMP-PTM6, COMP-PTM7, COMP-SFSEARCH). The PTM-7 object (E with F_2
        coefficients viewed over F_8, n = 5, the producer's trace-zero
        sigma_8-stable V, which is also sigma_2-stable) was independently
        reproduced by the dispatching session with its own Sage code sharing
        nothing with the red team's script: 4071 affine points, pi_8 orbits
        {1: 1, 5: 814}, pi_2 orbits {1: 1, 5: 4, 15: 270}. That reproduction is
        provenance, not a review finding (DEC-20260923-e6cd5d PD-C4).
      basis_of_the_classical_fact: >-
        Elementary derivation: a model over F_{q0} makes pi_{q0}(x,y) =
        (x^{q0}, y^{q0}) an endomorphism; pi_{q0}^{kn} fixes E(F_{q^n}); orbit
        lengths divide kn. Checked instance: COMP-PTM7. Literature: KN-LIT-796
        (Galbraith, Granger, Merz, Petit 2020, "On Index Calculus Algorithms for
        Subfield Curves"), provenance retrieved, verified_by TASK-20260923-33a48b,
        which treats curves defined over F_q with ECDLP in F_{q^n} under that
        field's Frobenius. Recalled pointers only, not relied on: Wiener and
        Zuccherato 1998 and Gallant, Lambert and Vanstone 2000 on the Pollard rho
        Frobenius speed-up measured by the extension degree over the field of
        definition.
      effect_on_values: >-
        none. Every run curve lies inside the restated scope: the q = 2, 3, 5
        curves are over prime fields, and the q = 4 panel curves have j in
        {b, b + 1}, outside F_2.

    - id: H3
      field: statement clause (iv), and proof_search_map.quantifier_order
      prior_value: >-
        (iv) against the unconstrained optimum l* = ceil(n/m), stability forces
        l' = min{attainable faithful l >= l*} and the orbit trick is a net win
        if and only if q^(l' - l*) < n. / quantifier_order: "... there EXISTS a
        faithful sigma-stable V with dim V >= ceil(n/m) and
        q^(dim V - ceil(n/m)) < n IF AND ONLY IF the orbit trick is a net win at
        that (q, n, m)."
      corrected_value: >-
        (iv) Under four numbered MODEL ASSUMPTIONS, which are assumptions of the
        comparison and not facts about the object:
          MA-1 the baseline is pinned at l* = ceil(n/m) (this is NOT in general
               the unconstrained optimum of the stated cost model);
          MA-2 the orbit pipeline sits at l' = the least faithful attainable
               l >= l* (rounding up only);
          MA-3 the per-relation cost (per-attempt cost times inverse success
               probability) is the same at l' and at l*;
          MA-4 relation collection is proportional to the number of factor-base
               classes and sparse linear algebra to its square;
        the pi-quotient is a net win in BOTH stages if and only if
        q^(l' - l*) < g(l'), with g(l') the exact mean pi-orbit size on the
        chosen F_V (clause iii), NOT n. The implementation already decides it
        this way (q^pen < mean_orbit_size); the literal "< n" misdecides
        (q, n) = (2, 7) for m = 7..12, where g = 4. Outside MA-1 to MA-4 no
        direction is asserted in general: the verdict at the enumerated cells
        other than q = 2, n in {131, 163} depends on the cost model (listed in
        TASK-20260923-33a48b per_cell_classification). The one model-robust
        direction established is the net LOSS at q = 2, n in {131, 163},
        m in {2, 3, 4, 5}, which holds in every cost model the red team examined
        (pinned model under both decomposition-probability variants and both
        per-attempt cost classes; rebalanced model over per-attempt cost 1 to
        2^40). quantifier_order is restated to match: the existential over V
        ranges over faithful sigma-stable V at fixed (q, n, m), and the iff is
        conditional on MA-1 to MA-4 with g in place of n.
      found_by: TASK-20260923-33a48b J3(i), COMP-J3-COST, COMP-J3-TABLE, COMP-J3-N-VS-G.
      heuristic_inventory_note: >-
        H-FROB-6774fb heuristic_assumptions is [] and stays as written.
        MA-1 to MA-4 are MODEL assumptions of a cost comparison, now numbered
        here as the red team's HA-HD asked. They are not heuristics about a
        random object, and the promotion gates for asymptotic-complexity claims
        do not apply (claim_kind constant_factor, null exponents).

    - id: H4
      field: title
      prior_value: >-
        The Frobenius-orbit factor base is available only on an arithmetic
        lattice of dimensions, its gain is exactly n and never more, and the two
        facts together decide it by a single inequality
      corrected_value: >-
        In the linear Gaudry/Diem family, q-power-Frobenius-stable factor bases
        F_V come from the sigma-stable V, which exist only at the dimensions cut
        by divisors of T^n - 1; the pi-quotient alone gains the mean orbit size,
        at most n; and under numbered pinned-dimension cost assumptions one
        inequality in q^(l' - l*) and that mean orbit size decides the trade
      found_by: TASK-20260923-33a48b S4; TASK-20260923-69e71b F-J1-5 (degenerate F_V off the lattice).

    - id: H5
      field: mechanism, "a coarse lattice of spacing d, NOT an interval"
      prior_value: "so the attainable dimensions are exactly {a + b*d : a in {0,1}, 0 <= b <= s}: a coarse lattice of spacing d, NOT an interval."
      corrected_value: "a lattice of spacing d = ord_n(q), which is the full interval [0, n] exactly when q = 1 mod n (d = 1)."
      found_by: TASK-20260923-33a48b S9 and PTM-1 (13 cells; the code handles it correctly; prose only).

    - id: H6
      field: proof_search_map.observation_collision.observable
      prior_value: "The pair (attainable dimension spectrum, mean orbit size), which is a function of (q, n) alone -- not of the curve, the basis, or the solver."
      corrected_value: >-
        The attainable dimension spectrum is a function of (q, n) alone. The
        mean pi-orbit size on a given F_V depends on the curve through f; the
        mean size of the orbits of the Frobenius actually available on E depends
        on E's field of definition (H2); and for a curve over F_{q^n} lying over
        no proper subfield there is no pi-action at all.
      found_by: TASK-20260923-33a48b S10, PA-1, PTM-4.

    - id: H7
      field: asymptotic_claim.prior_best
      prior_value: "Pollard rho with the sqrt(n) Frobenius-class speedup as the matched baseline"
      corrected_value: >-
        Pollard rho on Frobenius AND negation classes, a sqrt(2n) speed-up, as
        RQ-FROB-7d8dd4 constraints require. H-FROB-6774fb makes no comparison
        with rho, so no conclusion changes.
      found_by: TASK-20260923-33a48b S11.

    - id: H8
      field: test_boundary
      prior_value: >-
        "10 curve cells, ordinary subfield curves, up to two distinct j per
        cell"; "16 target degrees including the nine real binary ECC extension
        degrees"; parameters.n includes 89, 101, 103, 107, 109.
      corrected_value: >-
        10 (q, n, dim) curve cells carrying 14 (cell, curve) rows, 12 of which
        contain an orbit of length n; the six q = 2 rows all use the one curve
        y^2 + xy = x^3 + 1 (the generator de-duplicates on j, so its quadratic
        twist is never used). 16 target (q, n) rows over 13 distinct n. The
        values n in {89, 101, 103, 107, 109} appear in no trial plan,
        specification or run artifact and are not part of the tested boundary.
      found_by: TASK-20260923-69e71b F-J2-4, F-J2-5, F-J5-4; TASK-20260923-33a48b PTM-3 note.

    - id: H9
      field: IDEA-20260918-9abf42 title (the upstream source of the proposed KN-FIND wording)
      prior_value: >-
        "... so no Frobenius-stable factor base of index-calculus dimension
        exists at the ECC2K-130 target ..."
      corrected_value: >-
        No sigma-stable F_2-SUBSPACE of dimension in [2, 129] exists at
        (q, n) = (2, 131); the linear factor base of dimension 130 exists and is
        pi-stable. Non-linear pi-stable factor bases (unions of Frobenius orbits)
        of index-calculus size exist at n = 131 (field-level witness:
        TASK-20260923-33a48b COMP-PTM5). The proposal's body ("Frobenius-stable
        F_2-subspaces") is correctly worded; only the title slides from subspace
        to factor base.
      found_by: TASK-20260923-33a48b S12, PTM-5.

