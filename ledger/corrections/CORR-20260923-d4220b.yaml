    experiments/EXP-GFPN-05ff43/corrections/RUN-GFPN-bbed6f.v2.yaml.

  reason: >-
    The run's own raw-result.json records returncode -11 for targets 0-4, D
    null, f4_ops_proxy 0.0 and max_matrix null for each, and every
    anchor_t0..t4.ms.log ends immediately after the header line of the
    degree-9 F4 round with no further solver output; the 0.013-0.015 s
    per-target figures are times to crash. The producer disclosed that its
    status logic "counted a target as timed successfully whenever it had not
    timed out", fixed it (outcome in {ok, timeout, memory_exhausted,
    crashed}), and asked that the record be superseded
    (experiments/EXP-GFPN-05ff43/implementation.md section 4). A crash is an
    infrastructure outcome and is never evidence about an ideal degree, a
    decomposition or a solver cost (AGENTS.md core rule 5).

    ROUTE, AND THE ROUTE DECLINED. The producer requested that RUN-GFPN-bbed6f
    be registered as "superseded by RUN-GFPN-61bba9". That was declined:
    tools/run_supersession_registry.yaml binds a run only to a corrected
    record OF THE SAME RUN, and tools/test_run_supersession.py
    (test_superseding_record_declares_the_supersession_from_its_own_side,
    _is_experiment_correction) asserts that the superseding record's run.id
    equals the entry's run_id and that it sits in the same run directory or
    under experiments/<EXP>/corrections/. A cross-run entry would add a
    failing test to an already-red check (S6 of TASK-20260923-e9ddd2). The
    correction therefore takes the same-run corrections route modelled on
    experiments/EXP-PFDR-845d33/corrections/*.v2.yaml, and the registry
    receives exactly one appended entry whose superseding_sha256 is the
    literal DISPATCHER_FILLS, to be replaced by the dispatching session with
    the file's sha256 before commit (this Coordinator had no shell).

    SEPARATE FACT, RECORDED HERE AND NOT IN THE REGISTRY: the valid n=4-anchor
    run of EXP-GFPN-05ff43 is RUN-GFPN-61bba9 (25-bit rung, median 7.995 s
    against a published 17.01 s, ratio 0.470, completed_valid). Whether that
    run satisfies the frozen n4_published_timing_anchor control is NOT decided
    here; it is joint K4 of the review plan on TASK-20260923-fe27e4.

    OBSERVATION FOR THE REVIEW ROUND, NOT A FINDING: the five crashes occurred
    in msolve's -g 1 mode (F4 Groebner basis plus leading ideal, no
    parametrization), during the degree-9 F4 round. Deviation D-3 of
    implementation.md characterises the host's msolve crash in this prime
    range as a crash "in its rational-parametrization step" and reports that
    "-g 1 leading-ideal output succeeds at 65551" on a two-variable toy
    system. Those two statements and this run's logs are not obviously
    consistent. The discrepancy does not change this correction (the run
    measured nothing either way); it is routed to joint K4. Every stderr
    block of the five logs also carries "ulimit: virtual memory: cannot
    modify limit: Operation not permitted", which bears on how the
    deviation D-1 memory cap was applied; routed to joint K1.

