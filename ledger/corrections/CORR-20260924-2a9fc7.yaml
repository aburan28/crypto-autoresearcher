# =============================================================================
# CORR-20260924-2a9fc7 -- SUPPLEMENTS AN INCOMPLETE RULE STATEMENT, EDITS NO
# FILE: the repaired gate's ADMISSION rule, as approved and as implemented,
# reads only a gate package's recorded run_status and gate_pass. It omits the
# package's completion-gate checker verdict, which the same lineage's run card
# makes decisive for whether the package is evidence.
#   Implemented: r3_run_wrapper.r7_gate_packages (lines 173-181) and
#   r7_controls_a1_image (lines 190-196) read raw-result.json run_status and
#   gate_pass only. So RUN-GFPN-596fb2 would pass R-7 although G4
#   (RUN-GFPN-bfe956) failed its checker (execution report
#   gate_outcome.flag_for_dispatcher).
#   Worded: DEC-20260924-e52eec VA-9 RQ''-5 and RQ''-7, and
#   TASK-20260924-4351ac R3P-2 and objective (4), word the gate on the same two
#   fields and REG-1; the card's completion_gate says a package whose checker
#   fails "is not read as evidence".
# Found by the Executor (flag_for_dispatcher) and ruled by the Coordinator
# under TASK-20260924-f6f2ef (DEC-20260924-1ce186 R-1, R-3). WRITE-ONCE.
# Archived by TASK-20260924-9c617a.
# =============================================================================
