      prior_value: >-
        The repaired gate is established when G1..G4 each record run_status
        completed_valid with gate_pass true and REG-1 passed; R-7 enforces
        exactly that.
      corrected_value: >-
        The two recorded fields and REG-1 are NECESSARY and not SUFFICIENT.
        The same lineage makes each package's completion-gate checker verdict
        decisive for whether the package is evidence (TASK-20260924-4351ac
        completion_gate, line 359), and R3P-2's CC-3 clause (lines 127-130)
        shows that a frozen-checker failure of a gate package was foreseen as
        a gate failure that stops the lineage. A gate package that is recorded
        with its checker failure and not read as evidence cannot establish the
        gate. From DEC-20260924-1ce186 on, the repaired-gate condition of
        protocol 2-r3 reads: G1..G4 each record run_status completed_valid
        with gate_pass true, AND the r3 checker (the frozen v2_check_run in
        its own process plus the r3 checks) exits 0 on each of G1..G4, AND
        REG-1 passed. Equally for the controls_a1 image of the a1 plan.
        The implemented R-7 does not test the checker verdict; it is phase-A
        bound and is not edited. For 2-r3 the gap has no further consequence:
        TASK-20260924-4351ac is ruled failed at the gate, every unused 2-r3
        and 2-a1-r3 id is retired, and the r3 wrapper is never invoked again
        (DEC-20260924-1ce186 R-5). The successor DRAFT
        AMD-EXP-GFPN-05ff43-20260924-readbackcover (RB-4) puts the checker
        verdict into the admission code of any successor layer.
      why_this_is_not_a_changed_criterion: >-
        It adds no threshold, field, exclusion or tolerance to any
        measurement and relaxes nothing. It reads two texts that were both
        committed before R2'' ran (the admission fields and the completion
        gate of the same card) together, taking the stricter. The looser
        reading would have admitted packages on a gate package that the card
        itself says is not evidence.
      evidence: >-
