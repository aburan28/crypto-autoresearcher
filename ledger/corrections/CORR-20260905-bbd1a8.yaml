correction:
  id: CORR-20260905-bbd1a8
  recorded_at: '2026-09-05'
  record_type: claim
  corrected_record: ledger/goals/GOAL-PATH-001.yaml
  field: next_action
  goal_id: GOAL-PATH-001
  raised_by: >-
    The orchestrating session, while selecting the next ECC goal from the
    portfolio sweep's `batch_complete` bucket. GOAL-PATH-001 was chosen because it
    is the prioritizer GOAL-RELN-001 and GOAL-SDEG-001 are both explicitly waiting
    on ("Protocol design PASS. Defer ... until PATH prioritizes"), so a stale
    premise here propagates to two other ECC goals. All three findings below were
    read out of the committed records directly, not inferred.
  prior_value: >-
    From GOAL-PATH-001's current next_action: option (c) of the three-way choice is
    refused because "GOAL-MONO-001 is paused with maximum_batches 3 exhausted", and
    defect CD-1 is described as this goal's superseded next_action AND
    DEC-20260802-505759 both attributing the DREG CTRL-B PASS to DEC-20260731-014.
  corrected_value: >-
    CD-1 IS CONFIRMED. TWO OF THE REFUSAL'S PREMISES ARE NO LONGER TRUE.
    (1) CD-1 holds and is now verified rather than alleged: DEC-20260731-014 is a
    GOAL-ECDLP-001 BATCH-021 residual-control theater repair decision. Its
    target_ids are EXP-DS-001, H-DS-001, GOAL-ECDLP-001, BATCH-021,
    PA-DS-001-v2-ctrl-theater-repair and three CTRL-RT025 controls; the file
    contains ZERO occurrences of "DREG", four of "ECDLP" and five of "BATCH-021".
    It cannot be the source of a DREG CTRL-B admission.
    (2) GOAL-MONO-001 IS NOT PAUSED. Its status is `active`. `paused` and
    `blocked` are no longer permitted goal statuses at all
    (CLAUDE.md rule 10 / AGENTS.md "Goals are never paused", user instruction
    2026-09-04); tools/validate_ledger.py refuses both by name, and MONO-001 was
    migrated to `active` with its blocker recorded under `impediments`.
    (3) GOAL-MONO-001'S BUDGET IS NOT EXHAUSTED. `maximum_batches` is null and
    `total_wall_clock_seconds` is null, because MONO is an ECC goal and every ECC
    goal now carries an unlimited campaign budget (CLAUDE.md rule 11, user
    instruction 2026-09-04, enforced by tools/ecc_priority.py --budget-violations,
    which reports the whole active portfolio clean).
  independently_verified_here: >-
    Read directly by the orchestrating session before recording:
    `ledger/decisions/DEC-20260731-014.yaml` parsed and its target_ids and
    substring counts taken from the file; GOAL-MONO-001's status and
    campaign_budget read from its committed goal record; and
    `python3 tools/ecc_priority.py --budget-violations` run over the portfolio,
    returning "OK: every active/draft ECC goal has an unlimited campaign budget."
    `python3 tools/ecc_priority.py --classify` confirms GOAL-PATH-001 and
    GOAL-DREG-001 are both ECC.
  what_is_not_corrected:
    - >-
      THE THREE-WAY CHOICE IS NOT RE-MADE HERE, AND OPTION (c) IS NOT SELECTED.
      This record corrects two premises of the stated refusal; whether option (c)
      is now reachable, and whether it should be preferred to option (a), is a
      Coordinator prioritization decision on the evidence, not a consequence of
      this correction. Option (b)'s refusal is untouched: it rests on
      GOAL-ECDLP-001's committed authorization under DEC-20260809-d5ff80, which
      this record does not examine.
    - >-
      THE STANDING NEXT ACTION IS UNCHANGED. TASK-20260810-9e7f4c, the
      coordinator-only zero-run reconciliation of GOAL-DREG-001's head against its
      committed BATCH-004 and BATCH-005 archives, remains the single next action
      and is if anything better motivated: CD-1 is now a verified misattribution
      rather than a suspected one.
    - >-
      NO MATHEMATICAL CLAIM IS AFFECTED. No measurement is authorized, no DREG
      batch is opened, no hypothesis or goal status changes, and no claim tier
      moves. The DREG CTRL-B admission recorded in EV-DREG-008 is not disturbed by
      this record -- what is corrected is which decision is cited as admitting it.
    - >-
      SF-1 IS NOT DISTURBED. This goal's primary completion route still runs
      through GOAL-ICEX-001, and PATH still cannot unblock the upstream artifact
      set GOAL-ECDLP-001 owns.
  consequences:
    - >-
      THE RECONCILIATION TASK SHOULD NOW ALSO RECONCILE THE REFUSAL. Whoever runs
      TASK-20260810-9e7f4c should re-derive option (c)'s reachability against
      MONO-001 as it now stands, rather than against a paused, budget-exhausted
      goal that no longer exists in that form.
    - >-
      TWO OTHER ECC GOALS ARE WAITING ON THIS PRIORITIZATION. GOAL-RELN-001 and
      GOAL-SDEG-001 both record "Protocol design PASS ... defer until PATH
      prioritizes". A prioritization resting on a stale premise defers them on a
      stale premise too.
    - >-
      A GENERAL LESSON, AND THE SECOND INSTANCE THIS SESSION. A policy change that
      is enforced going forward -- here, no paused goals and unlimited ECC budgets
      -- does not reach the PROSE of already-committed records that reasoned about
      the old regime. The validator refuses a `paused` status; it cannot refuse a
      sentence asserting that some other goal is paused. Records that reason about
      another goal's status or budget should cite it by locator so a reader can
      re-check it, rather than restating it.
