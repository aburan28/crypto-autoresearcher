correction:
  id: CORR-20260802-015
  recorded_at: "2026-08-02"
  authorizing_decision: DEC-20260802-008
  amended_by: DEC-20260802-009
  record_type: claim
  record_id: DUPLICATE-RUN-IDS-FCP-IC
  field: run_id uniqueness across experiments

  # =========================================================================
  # WHAT IS WRONG
  # =========================================================================
  defect:
    summary: >-
      221 run IDs occur under more than one experiment, across 456 committed
      manifests, producing 235 `duplicate ID` lines from
      tools/validate_ledger.py. The collisions are between EXP-FCP-001,
      EXP-FCP-002 and EXP-IC-001. The colliding manifests are NOT copies:
      RUN-FCP-fixed-b16-s1-t0 has three different sha256 under three
      experiments. These are distinct runs that were named after their
      parameters rather than their experiment.
    why_it_was_possible: >-
      RUN_ID is the one open identifier pattern (^RUN-[A-Za-z0-9._-]+$), and
      runs are physically namespaced under their experiment directory, so
      nothing at write time forced global uniqueness.

  # =========================================================================
  # WHY IT IS NOT REPAIRED
  # =========================================================================
  not_repaired:
    reason: >-
      Renumbering requires editing committed run manifests.
      tools/check_run_immutability.py fails on any modification or deletion of
      a committed run artifact, by design. Repair and the immutability gate are
      in direct conflict, and the gate is the more important of the two.
    rejected_alternative: >-
      Relaxing or bypassing the immutability gate to permit the renumber was
      rejected outright. A gate that can be opened to fix a validator error is
      not a gate.

  # =========================================================================
  # THE LIVE CONSEQUENCE
  # =========================================================================
  consequence:
    mechanism: >-
      In tools/validate_ledger.py check_run, `ctx.run_params[rec_id]` is
      assigned unconditionally and `ctx.register(rec_id, ...)` keeps only the
      FIRST manifest globbed for a given id. So for a colliding id, ctx.ids
      points at the first manifest while ctx.run_params holds the LAST. The
      claim-tier ceiling in check_cross_refs reads ctx.run_params.
    risk: >-
      An evidence record citing a colliding run id has its claim_tier ceiling
      evaluated against whichever manifest was globbed last, which need not be
      the run the record meant. If two same-named runs disagreed on field_bits,
      a toy result could satisfy a medium or crypto ceiling. That is precisely
      the AGENTS.md rule 7 failure the ceiling exists to prevent.
    measured_exposure:
      tier_divergent_collisions: 0
      basis: >-
        All 221 collisions were checked. Every manifest sharing an id agrees on
        its claim tier (all toy), so no evidence record's ceiling is currently
        mis-evaluated. The risk is latent, not realised.
      citations_of_colliding_ids: 47
      citations_ambiguous: 0
      citation_basis: >-
        All 47 existing citations already name exactly one owning experiment in
        their experiment_ids, so each resolves today.
    honest_statement_of_limits: >-
      Both measurements are of the CURRENT tree. They say the defect has not
      yet caused a wrong claim; they do not say it cannot. That is why the
      controls below are enforcing rather than advisory.

  # =========================================================================
  # COMPENSATING CONTROLS
  # =========================================================================
  controls:
    - id: C1
      artifact: tools/duplicate_run_ids.yaml
      does: >-
        Freezes every colliding id with each occurrence's path, experiment,
        field_bits and derived tier, and a tier_divergent flag. Generated by
        reading the tree; no manifest is modified.
    - id: C2
      artifact: tools/test_duplicate_run_ids.py
      does: >-
        Holds the map to shrink-only. A NEW collision fails the suite, so the
        remedy for one is a distinct run id, not a map regeneration. Also fails
        if any collision becomes tier-divergent, which is the moment the latent
        risk becomes live.
    - id: C3
      artifact: tools/validate_ledger.py check_cross_refs
      does: >-
        An evidence record citing a colliding run id must name exactly one
        owning experiment in experiment_ids. An unqualified citation is a new
        validator error and is explicitly excluded from the baseline amendment.
    - id: C4
      artifact: this record
      does: Carries the claim boundary below.

  # =========================================================================
  # CLAIM BOUNDARY  (recorded verbatim as required by DEC-20260802-008)
  # =========================================================================
  claim_boundary:
    - >-
      For any evidence record citing a colliding run ID, provenance is
      ambiguous and its claim tier was validated against an arbitrary manifest;
      that tier is UNVERIFIED and the record may not support a hypothesis
      transition until qualified.
    - >-
      This says nothing about whether the runs are sound. It says the
      repository cannot tell which run a citation means.
    - >-
      The 47 citations measured as already experiment-qualified satisfy the
      qualification requirement, but their tiers were still computed from
      ctx.run_params under the collision, so the boundary applies to them until
      the follow-up re-derives each one.

  changes_no_hypothesis_status: true
  changes_no_evidence_strength: true
  is_not_a_cryptanalytic_result: true

  follow_ups:
    - >-
      Experiment-qualify every evidence citation of a colliding run id and
      re-derive its tier from the named manifest, lifting this boundary record
      by record.
    - >-
      Consider requiring experiment-qualified run ids at write time so the
      collision class cannot recur.
