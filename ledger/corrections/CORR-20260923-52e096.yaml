  prior_value: >-
    All three ecgfp5_shaped rungs of the v2 ladder (4111, 262151, 16777291)
    have b a non-square in F_q and are double-odd. So the DC-3 construction
    (b = lam^2 beta with beta a non-square in F_{p'}, factor base
    {P : x(P)/lam in F_{p'}}) applies to the primary shape at every v2 rung.

  corrected_value: >-
    The premise holds at 4111 and 262151 only.
    - At p' = 16777291 the ecgfp5_shaped curve is y^2 = x(x^2 + 2x + 59z) over
      F_{16777291}[z]/(z^5 - 2). ladder.json records
      "b_is_square_in_Fq": true (experiments/EXP-GFPN-05ff43/implementation/ladder.json
      line 350). It records order
      1329257706611493023876109494255635172 = 2^2 * prime, "cofactor": 4
      (lines 353-365).
    - So b is a square in F_q, the order is divisible by 4, and the curve is
      NOT double-odd.
    - DC-3's definition requires b to be a non-square at odd n. The v2 code
      therefore records a `b-square class mismatch` refusal (DC-6 R-6) for
      torsion_S5_rq and S5_rescaled on that curve
      (implementation-v2.md lines 360-373; trial-plan-v2.json known_issue_flags
      KI-1 and package RUN-GFPN-3be8a4 expected_refusal).
    - On EcGFp5-shaped curves, arm iii' can then reach only the 13- and 19-bit
      rungs (span 6 bits), below the frozen 3-prime / 12-bit ladder rule
      (specification lines 97-98). HEUR-GFPN-DFLAT for arm iii' on the
      primary shape is not_applicable under v2 as approved, by construction.

  reason: >-
    Checked by the Coordinator under TASK-20260923-242cd0 from committed bytes
    and by hand; nothing was run.
    (1) ladder.json lines 350 and 353-365, read directly.
    (2) Order mod 4 read from the recorded orders' last two digits. It is 0
        at 16777291 (...172) and 2 at 4111 (...626), 262151 (...166),
        65551 (...298) and 1073741831 (...022).
    (3) The norm criterion. For b in F_q, b is a square iff N(b) is a square
        mod p'. This holds because N(b)^{(p'-1)/2} = b^{(q-1)/2} and the norm
        is onto F_{p'}^*. For b = c z with z^5 = cmod, N(b) = c^5 * cmod,
        whose quadratic class is that of c * cmod. By quadratic reciprocity,
        by hand:
        - 16777291 = 3 mod 8 gives (2|p') = -1.
        - 16777291 = 51 = -8 mod 59 gives (p'|59) = (-1|59)(2|59)^3
          = (-1)(-1) = +1. Both primes are 3 mod 4, so (59|p') = -1.
        - Hence (59 * 2 | p') = +1: N(b) IS A SQUARE.
        The same computation gives a non-square at 4111 (c 63, cmod 2),
        262151 (c 84, cmod 3), 65551 (c 223, cmod 2) and 1073741831 (c 372,
        cmod 2). This agrees with ladder.json at every rung.
    (4) Pornin, inputs/PORNIN-2022-274-ECGFP5/paper_fulltext.md lines 871-874:
        a curve y^2 = x(x^2 + ax + b) "may be double-odd (i.e. order 2n for an
        odd integer n) only if neither b nor a^2 - 4b is a quadratic residue".
        A square b therefore rules out double-odd, consistent with (1) and (2).
    (5) The executor rechecked the fact independently in stage 1
        (implementation-v2.md lines 365 and 430).

