              context: '"Lane B fixes a unit that every Frobenius row consumes, and lowers a claimed gain."'
            - lines: 139-143 (portfolio_ranking.ranks rank 1, evidence_it_beats_doing_nothing)
              context: '"Lane B decides the relation-yield unit of every Koblitz and subfield row and gates IDEA-20260922-1a081a C3 and IDEA-20260922-c48e7d Saving-B."'
      prior_reading: >-
        Lane B's design settles the unit for every Frobenius, Koblitz and
        subfield row, and lowers a claimed gain.
      corrected_reading: >-
        Lane B's contract, if approved and run, decides the unit ROW BY ROW, on
        rows whose parameters are primary-sourced, under item 1 (a) and (b).
        Whether any claimed gain is lowered is a result that no run has
        produced, and so is which record's gain. Any record that states it must
        name the record whose gain it corrects (DEC-20260924-286589 R-J4). The
        gating of IDEA-20260922-1a081a C3 and IDEA-20260922-c48e7d Saving-B is
        unchanged. It is a dependency, not a direction.

