      what: two restatements of the framing in the BATCH-7d29e8 opening decision
      records:
        - id: DEC-20260924-f0a9c7
          path: ledger/decisions/DEC-20260924-f0a9c7.yaml
          sha256: null
          sha256_note: Not computed; bound by TASK-20260924-083fd4's receipt, which this act did not read.
          locations:
