      prior_reading: >-
        Adopting the per-orbit unit moves every Koblitz and subfield
        index-calculus margin by log2 k bits against the attacker.
      corrected_reading: >-
        (a) CONDITIONAL. The sentence describes what the per-orbit unit WOULD
        change if an approved, reviewed lane-B contract's Part 1 and Part 2
        establish it. Nothing is moved by the selection, by the v1 or v2 design,
        or by any review of them. (b) PER ROW, NOT "EACH". A movement can apply
        only on a row where two things hold. First, a NAMED record's
        relation-yield column counts k relations per solve. Second, the row's k,
        r and the k | r - 1 verdict are primary-sourced in an approved contract.
        A row the lane-B contract records as NOT COMPUTED carries no movement:
        the five c2pnb rows under IMP-X962 (DEC-20260924-286589 R-J5 and RL-C5).
        So does a row whose column already counts per orbit. (c) ATTRIBUTION.
        The two parenthetical figures are IDEA-20260922-261004's sota_delta
        design figures and are not program figures. One of them is on a c2pnb
        label, and DEC-20260924-286589 RL-C5 leaves the mapping of that
        standard's curve names to the program's labels to the revision. (d) NOT
        AUTHORITY FOR SCOPE. The sentence does not license any scope sentence in
        a lane-B contract. Version 2 of EXP-BINSTD-178742 and the version_2
        block of H-BINSTD-ce4f38 are held to their own review plan's scope
        joint (REVIEW-BINSTD-20260925-b67954), which re-attacks the
        DEC-20260924-286589 R-J4 objections. Citing DEC-20260924-99ce20 does not
        make an unqualified restatement of this framing in-scope.
