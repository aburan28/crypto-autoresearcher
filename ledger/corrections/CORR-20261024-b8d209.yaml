# =============================================================================
# CORR-20261024-b8d209 -- EXP-CZLIFT-ed8113 frozen specification v1: the
# undeclared point sampler, the r = 2-only height metric, the conflict between
# preregistered_prediction and success_criterion, the misattributed source,
# and the decision_impact.on_positive branch that review blocks.
#
# APPEND-ONLY. experiments/EXP-CZLIFT-ed8113/specification.yaml stays frozen
# and byte-for-byte unchanged, as do the trial plan, hash-pinned sources and
# both run records. Nothing here changes a frozen success, falsification or
# invalidation criterion, and nothing is re-scored: the success criterion
# reads met on both seeds and the falsification criterion did not fire, as
# DEC-20261009-6aef7a and DEC-20261023-488023 record. It is not a protocol
# amendment. It writes into the record what the hash-pinned protocol did.
# =============================================================================
correction:
  id: CORR-20261024-b8d209
  recorded_at: '2026-10-24'
  recorded_by: coordinator
  authorizing_decision: DEC-20261024-23d64d
  goal_id: GOAL-CZLIFT-1516d5
  record_type: specification
  record_id: EXP-CZLIFT-ed8113
  field: >-
    title / objective / out_of_scope (E1 sampler and object), metrics.secondary
    height_ratio_point_over_log_p (E2), preregistered_prediction against
    success_criterion (E3), preregistered_prediction.source and
    scale_relevance.justification (E4), controls[2] (E5) and
    decision_impact.on_positive (E6). One correction: one record, one review
    round.
  prior_value: Quoted verbatim per item in items[].prior_value.
  corrected_value: Per item in items[].corrected_value.

  items:
    - id: E1
      field: title and objective (point sampler and object under test)
      prior_value: >-
        title: "Lift r in {2, 3} random points of random curves at 8 primes to
        symmetric integer representatives, fit the curve, and search exactly
        for relations with coefficients up to 6; planted-dependence controls";
        objective: "Measure the dependence rate of xedni lifts with an exact
        bounded relation search, ..."
      corrected_value: >-
        The points are drawn by the frozen, hash-pinned harness/czlift.py
        random_point, which samples uniformly from the affine points of
        E(F_p) with y != 0 (2-torsion points are never drawn), and the r points
        have pairwise distinct x. The lifted curve is the unique zero-freedom
        rational Weierstrass model through the symmetric lifts (r = 2:
        Y^2 = X^3 + A X + B; r = 3: Y^2 = X^3 + A2 X^2 + A4 X + A6), with no
        discriminant minimization and no reverse-Mestre conditions. "Xedni
        lifts" names a nearby object, not xedni proper (2 <= r <= 9,
        discriminant minimization, reverse-Mestre conditions). The literal
        reading "random points of E(F_p)" was not run; under it 2-torsion
        draws predict about 9.77 dependent trials per seed (rate about
        0.0061).
      found_by: VAL-20261022-b08129 F1; RT-20261023-d796bb R1-B2, O6, SC2
    - id: E2
      field: metrics.secondary height_ratio_point_over_log_p
      prior_value: >-
        "height_ratio_point_over_log_p"
      corrected_value: >-
        As implemented, the producer's r = 2 cell mean naive log-height of a
        lifted point divided by ln p; r = 3 points are not included (largest
        difference from a pooled definition 0.0159). Recorded values 0.632 to
        0.810 and 0.655 to 0.831, rising with p, following
        1 - (1 + ln 2)/ln p.
      found_by: VAL-20261022-b08129 F2; CORR-20261023-4ffd7e S1
    - id: E3
      field: preregistered_prediction.formula against success_criterion
      prior_value: >-
        preregistered_prediction.formula: "0 of 1600 valid trials per seed
        (upper 95 percent bound 0.0019); control_detection_rate = 1.0";
        success_criterion: "On both seeds: dependence_rate_overall <= 0.002
        and control_detection_rate = 1.0."
      corrected_value: >-
        The two frozen texts disagree on seed 20261009 (1 of 1600). Ruled by
        CORR-20261023-4ffd7e: the success and falsification criteria govern
        the experiment-level reading (met; not fired), and the hypothesis'
        point prediction governs its status (failed; H-CZLIFT-cb95b8
        weakened by DEC-20261023-488023). Successor contracts state a
        calibrated null prediction (for example JKSST section 5.1.2's law with
        its transfer caveat) instead of a point zero.
      found_by: RT-20261023-d796bb R1-B1; VAL-20261022-b08129 F4
    - id: E4
      field: preregistered_prediction.source and scale_relevance.justification
      prior_value: >-
        source: "H-CZLIFT-cb95b8 predictions; KR-IC-cd159a (JKSST analysis)";
        justification: "p <= 12809 and relation bound 6; the obstruction is a
        count at the scale where dependence would be cheapest."
      corrected_value: >-
        JKSST 2000 (Des. Codes Cryptogr. 20, 41-64; retrieved, read in full by
        TASK-20261023-62eb31) does not predict zero or negligible dependence at
        this scale: its Theorem 4.1 is conditional and vacuous at p <= 12809,
        and it measures frequent dependence at small discriminants. KR-IC-cd159a
        overstates it (CORR-20261024-63d682). The bound 6 is not where the
        attack would need dependence: an attacker's relations have
        coefficients of order p^(1/r), above 6 in every r = 2 cell with
        p >= 211 and every r = 3 cell with p >= 3203, and a Q-relation within
        the bound reduces to the same relation mod p, so the measured rate is
        at most the mod-p bounded-relation rate (about (13^r - 1)/(2p)). The
        count measures the regime an attacker cannot use and cannot certify
        independence.
      found_by: RT-20261023-d796bb R1-B3, R2, PTM-1; CORR-20261023-4ffd7e S3
    - id: E5
      field: controls[2]
      prior_value: >-
        "Trials whose fit is singular mod p are counted and excluded, never
        silently dropped."
      corrected_value: >-
        The control is vacuous by construction on this sampler and fit, and
        the planted control exercises only max|m| = 2 with r = 2; the
        validator's edge probe (|m| = 6, r = 3) found no defect. No run is
        invalidated.
      found_by: VAL-20261022-b08129 F3
    - id: E6
      field: decision_impact.on_positive
      prior_value: >-
        "H-CZLIFT-cb95b8 moves to supported at toy tier after review; the
        measured rate and heights are promoted as the counting form of the
        xedni obstruction (KR-IC-cd159a gains a measured row)."
      corrected_value: >-
        Not invoked. The branch is conditional on review, and review blocks
        both parts: the hypothesis' own prediction failed (weakened, not
        supported), and the count is not the counting form of the xedni
        obstruction (red-team O8). KR-IC-cd159a gains no measured row from
        this experiment.
      found_by: DEC-20261023-488023 criterion_reading; RT-20261023-d796bb O8

  reason: >-
    CORR-20261023-4ffd7e restated the hypothesis as tested and left the
    specification to the synthesis task; DEC-20261023-488023 N-4(a) lists E1,
