correction:
  id: CORR-20260929-12a50e
  recorded_at: '2026-09-29'
  recorded_by: top-level session (user instruction, 2026-09-29)
  record_type: claim
  record_id: EV-ICPERF-784b25

  field: >-
    observations[0] (the headline, including "No solver, however good, removes
    a term that is paid before the solver is called"), observations[1] (the
    crossover "lies strictly inside (283, 409]"), and every downstream
    quotation of them, including Finding 1 of papers/blog-binary-ic-DRAFT.md.

  prior_value: >-
    Below n about 300 the binding obstruction is that the descended system is
    too large to write down inside the whole rho budget: +6.3 bits at
    n = 233, +18.8 at 283, +24.2 at 113, +25.6 at 127, +40.8 at 131 and +37.4
    at 163. The crossover lies strictly inside (283, 409].

  corrected_value: >-
    The table is correct FOR THE EXPANDED ENCODING it prices: S_{m+1} in the
    m*l Boolean unknowns of x_1..x_m, Boolean degree m*min(m-1, l). It is not
    a charge every method pays. Two standard encodings that also materialise a
    system -- the FPPR 2012 symmetrization with auxiliary e_k unknowns and
    linking equations, and the Semaev 2015 chain of S_3 with auxiliary u_i --
    descend to Boolean degree 4 and 3 at m = 4 instead of 12. Priced on the
    SAME (m, l, R) cells and the SAME budget, the best-arity deficit becomes:
    n = 113: -1.2 / -9.7; 127: -2.4 / -11.0; 131: +14.3 / +7.3;
    163: +8.0 / +0.6; 233: -27.6 / -37.2; 239: -8.0 / -16.2;
    283: -17.7 / -26.2; 409: -45.9 / -55.0 (symmetrized / chained, block
    bounds, Frobenius arm on). The write-down barrier therefore survives only
    at n = 131 and 163, by 0.6 to 14.3 bits, and the sign change lies in
    (163, 233], not (283, 409]. At 233 to 283 the obstruction is the solver:
    at n = 233, m = 4 a degree-4 system in 994 Boolean unknowns within 2^59.2
    operations, a required exponent of 0.06 in the variable count. The
    record's other observations (Q1, Q2, Q3, Q4, Q6, the m = 4 cost cell and
    the Frobenius-quotient reading) are unaffected.

  reason: >-
    The record's own scope_and_limits says the ANF charge "does not bind a
    method that never materialises it". The symmetrized and chained encodings
    are the two methods the literature and this program's own SEMBIN lane
    actually use, and they materialise a much smaller system. The headline
    sentence generalised past that scope. Measured in
    analysis/symmetrized-anf-20260929: symmetrized degree 2 at m = 3 and 4 at
    m = 4 on 11 of 11 toy descents (n = 11 to 41); symmetrized monomial count
    within 0.7 to 2.4 percent of the block bound used in the table; Semaev
    polynomials verified on 20 of 20 true point sums and 20 of 20 wrong
    targets per arity over GF(2^17).

  scope_of_correction: >-
    Binary fields, Gaudry/Diem subspace factor bases, the cost model of
    EXP-ICPERF-783e9e unchanged. For Frobenius-stable V the symmetrized e_k
    with k >= 2 are charged the whole field, which can only overstate the size.
    The chained bound is a rigorous upper bound that was not calibrated by
    measurement. The m = 5 symmetrized support was not computed, so the
    auxiliary columns cover m <= 4. No curve is claimed attackable; writing the
    system down is necessary, not sufficient.

  effect_on_dependent_records: >-
    papers/blog-binary-ic-DRAFT.md Finding 1 and its headline table must not
    be published as written; a note pointing here is added to the draft.
    docs/ecdlp-literature-review-20260926.md section 5 item I3 ("plausibly new
    as a quantitative statement") is read through this correction: the
    quantitative statement holds for the expanded encoding only.

