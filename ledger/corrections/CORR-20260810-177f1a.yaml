    - >-
      IT DOES NOT LIFT THE 17947 QUARANTINE. The raw headline formula
      sr_pred - rank_sem remains raw_headline_status: quarantined_confounded,
      exactly as EV-DREG-008 and the goal head both record. Nothing about
