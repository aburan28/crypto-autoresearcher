  prior_value: >-
    As written, both artifacts declare that GOAL-DREG-001 BATCH-005's ledger
    archive carried a Coordinator decision at the path
    ledger/decisions/DEC-20260731-014.yaml, with content digest
    6093f111f4b1f7eef4c5da8e067a9f8e8cb14984c1885cbdff88414ba1a0a81b. The
    receipt lists record_ids [EV-DREG-008, DEC-20260731-014, GOAL-DREG-001] and
