    - >-
      IT ASSERTS NO FAULT AND NAMES NO CULPRIT. It does not establish who minted
      or remapped which identifier, in what order, in which worktree, or with
      what intent. Those questions are not answered by the artifacts read, are
      not needed for the remedy, and are not guessed at.
    - >-
      IT DOES NOT ESTABLISH THAT EITHER OCCUPYING RECORD IS WRONG.
      DEC-20260731-014 is correct as written for GOAL-ECDLP-001 BATCH-021 and
      DEC-20260731-002 is correct as written for GOAL-CRYPTO-001 BATCH-013.
      Neither campaign is criticised, implicated, or asked to do anything.
    - >-
      IT DOES NOT RETROACTIVELY VALIDATE THE 2026-07-31 ARCHIVE. That archive's
      receipt binds a path that was empty at its own commit, and under CLAUDE.md
      "Concurrency" archive receipts bind to CONTENT first with a mismatch
      treated as fatal. Establishing that the commit exists and is an ancestor
      of origin/main does NOT make that receipt content-verifiable, and this
      correction does not claim it does.
    - >-
      IT AUTHORIZES NOTHING AND CLOSES NOTHING. No experiment, run, measurement,
      or implementation is authorized; no batch, question, direction, or goal is
      closed, paused, or retired; no knowledge entry is created; no claim tier is
      relaxed. GOAL-DREG-001 stays `active`.
    - >-
      IT IS NOT ADMISSIBLE TOWARD ANY CLOSURE QUORUM. No attestation was
      obtained, is claimed, or could be synthesised from it. AGENTS.md's "never
      record an attestation you did not obtain" binds regardless of the quorum's
      suspension.

