    "pending_post_commit". The dispatch queue's archive block for the same task
    lists record_ids [EV-DREG-008, DEC-20260731-014] and carries commit_sha
    "bee3b3d8be35feb41bdd9af64cd43a9f6ce69d12" and parent_sha
    "2e1920121e533a2c97812526675426944e1d1cf3".

    A reader following that pointer today lands on GOAL-ECDLP-001 BATCH-021's
    decision record and would reasonably conclude either that GOAL-DREG-001's
    campaign decided something it did not, or that its BATCH-005 decision was
    never authored at all.

  corrected_value: >-
    NEITHER READING IS RIGHT. THE POINTER IS WRONG BY IDENTIFIER DISPLACEMENT
    ACROSS TWO SEPARATE REUSES, AND THE DECISION IT WAS MEANT TO NAME WAS
    GENUINELY AUTHORED AND GENUINELY COMMITTED.

    (1) WHAT THE ARCHIVE ACTUALLY CARRIED. GOAL-DREG-001 BATCH-005's closing
    Coordinator decision was authored and committed on 2026-07-31 under the
    identifier DEC-20260731-002, in commit
    bee3b3d8be35feb41bdd9af64cd43a9f6ce69d12 (2026-07-31 13:28:59 -0700), whose
    subject line reads "archive TASK-20260731-014 TASK-20260731-013 EV-DREG-008
    DEC-20260731-002 GOAL-DREG-001 ledger PASS" and which changed exactly six
    paths:
    coordination/goals/GOAL-DREG-001/batches/BATCH-005/archives/TASK-20260731-014/ledger-receipt.json,
    coordination/goals/GOAL-DREG-001/batches/BATCH-005/tasks/TASK-20260731-013/falsification_review.md,
    coordination/goals/GOAL-DREG-001/batches/BATCH-005/tasks/TASK-20260731-013/red_team_report.yaml,
    ledger/decisions/DEC-20260731-002.yaml, ledger/evidence/EV-DREG-008.yaml,
    and ledger/goals/GOAL-DREG-001.yaml. At that commit the decision's context
    read "GOAL-DREG-001 BATCH-005: admitted CTRL-B run
    RUN-DREG-001-CTRLB-N12-D6-BATCH005 under verified snapshot 2f7771fa0124 and
    red-team RT-20260731-013 (PASS)." with decision verb `expand` and target_ids
    [GOAL-DREG-001, H-DREG-001, EXP-DREG-001, TASK-20260731-011,
    TASK-20260731-013]. THAT COMMIT IS AN ANCESTOR OF origin/main. The archive
    landed.

    (2) CITE IT ONLY WITH ITS COMMIT QUALIFIER. `DEC-20260731-002` @
    `bee3b3d8be35feb41bdd9af64cd43a9f6ce69d12` is the only correct form. The
    bare identifier now resolves to a DIFFERENT campaign's record:
    ledger/decisions/DEC-20260731-002.yaml in the current tree is
    GOAL-CRYPTO-001 BATCH-013's decision (decision:
    final_no_candidate_keep_active; target_ids GOAL-CRYPTO-001, EV-CRYPTO-013,
    DEC-20260730-004; decided_at 2026-07-31), and the GOAL-DREG-001 text is not
    in it. A bare citation would therefore be wrong, not merely imprecise.

    (3) THE RECEIPT'S OWN POINTER NAMES A PATH THAT WAS EMPTY WHEN IT WAS
    WRITTEN. At bee3b3d8, ledger/decisions/DEC-20260731-014.yaml hashes to
    e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855 -- the
    SHA-256 of the empty string. The receipt nonetheless declares that path at
    digest 6093f111..., which is the digest of GOAL-ECDLP-001 BATCH-021's
    record, itself already occupying that identifier. So the pointer was
    remapped onto an identifier that was ALREADY TAKEN, and the archive's
    declared content set never matched the tree it was declared against for
    that one path.

    (4) THE NET EFFECT: TWO REUSES, AND THE DREG TEXT FELL OUT BETWEEN THEM. The
    decision was written as -002; -002 was later reused by GOAL-CRYPTO-001
    BATCH-013; the receipt's pointer was remapped to -014; and -014 was already
    GOAL-ECDLP-001 BATCH-021's. No committed file in the current tree holds
    GOAL-DREG-001 BATCH-005's closing decision text.

    (5) WHAT CARRIES THE DISPOSITION NOW. `DEC-20260810-3c851d`
    (ledger/decisions/DEC-20260810-3c851d.yaml) is the record that carries
    GOAL-DREG-001 BATCH-005's disposition in the current tree. It closes the
    batch on EV-DREG-008 at that record's own strength (`preliminary`) and tier
    (`toy`), reconciles its verb against the displaced original's `expand`
    explicitly rather than silently, and carries forward the original's
    independence caveat and its expansion direction as a recorded, unexercised
    option with a revisit condition.

  reason: >-
    THIS IS THE FAILURE MODE CLAUDE.md's ID-MINTING RULE AND AGENTS.md RULE 15
    EXIST TO PREVENT, OBSERVED IN THE WILD, AND IT IS RECORDED AS A MECHANISM
    RATHER THAN AS A FAULT.

    Sequential three-digit identifiers were allocated by asking committed state
    for its maximum and adding one. Every concurrent worktree asks that question
    of the same state, gets the same answer, and mints the same identifier for
    different records -- discovered only at merge time, when both records are
    already immutable and neither can be renamed without breaking whatever
    archive binds it. That is exactly what happened across GOAL-DREG-001,
    GOAL-CRYPTO-001 and GOAL-ECDLP-001 on 2026-07-31, and it is why new records
    mint a random 6-hex token that scans no state and cannot converge.

    A CORRECTION IS THE ONLY AVAILABLE REMEDY, NOT A PREFERENCE. AGENTS.md
    rule 15 states that renaming a record which a COMPLETED archive names in its
    binding fields breaks that archive permanently, because the commit is
    immutable and its declared set can never afterwards be reconciled with the
    live tree. DEC-20260731-014 appears in exactly such fields
    (archive.record_ids and archive.path_sha256 in the dispatch queue;
    record_ids and artifact_sha256 in the receipt), so a remap is forbidden and
    the remedy is supersession by a new record that names the broken pointer.
    AGENTS.md rule 4 and CLAUDE.md non-negotiable rule 2 say the same generally:
    corrections supersede, never overwrite.

    RECORDED BECAUSE A FUTURE READER WOULD OTHERWISE DRAW A FALSE CONCLUSION.
    Without this record, the goal head's earlier diagnosis -- an identifier
    collision on -014, and therefore no BATCH-005 decision -- reads as the whole
    story, and a later session could conclude that BATCH-005's review was never
    dispositioned, or could re-derive a disposition without knowing one already
    existed and what it said. Both would be worse than the truth, which is that
    the work was done, committed, and then lost its name.

