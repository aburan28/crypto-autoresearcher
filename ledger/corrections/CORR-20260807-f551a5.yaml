correction:
  id: CORR-20260807-f551a5
  recorded_at: '2026-08-07'
  recorded_by: coordinator (GOAL-ENDO-001, BATCH-aa267f)
  type: partially_circular_control_arm_and_a_refuted_localization
  supersedes: []
  corrects:
  - experiments/EXP-INSTR-85b102/amendments/v2.yaml
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-aa267f/reviews/red-team-nonmonotonicity/report.yaml
  record_type: experiment
  record_id: EXP-INSTR-85b102
  field: >-
    the reading of CTRL-VALUESHUFFLE's terminal state STRUCTURE_PRESENT, and
    RT-20260807-743198 item 3f's localization of the residue to the m = 3
    sum-set family
  what_the_control_returned: >-
    Terminal state STRUCTURE_PRESENT, emitted from inside the run per the rule
    frozen before any replicate existed. SR-B1's blocking reproduction gate
    PASSED: the observed type-A residue re-derived at exactly 50 of 144 under
    three independent derivations, per pool 10/10/16/14. Null over 200
    replicates: min 89, median 108, max 123, mean 107.635, sd 5.632. Observed 50,
    zero replicates at least as extreme, two-sided empirical p = 1/201 =
    0.004975124378109453.
  coordinator_verification: >-
    INDEPENDENTLY RE-DERIVED FROM THE COMMITTED ARTIFACTS, not accepted on the
    Executor's word. Recomputing the null summary and the two-sided p-value from
    valueshuffle-null.json reproduces min 89 / median 108 / max 123 / mean
    107.635 / sd 5.632, zero at-least-as-extreme replicates, and p =
    0.004975124378109453 exactly. The per-functional decomposition below is the
    Coordinator's own and was not in the Executor's report.
  finding_1_the_direction_is_the_opposite_of_what_the_state_name_suggests:
    fact: >-
      THE OBSERVED VALUE LIES BELOW THE ENTIRE NULL SUPPORT (null minimum 89
      against an observed 50). The real functional values produce FAR FEWER
      type-A reversals than an arbitrary value multiset does on the identical
      blocking geometry -- 50 against a null median of 108.
    why_it_matters: >-
      "STRUCTURE_PRESENT" reads naturally as "structure creates the reversals".
      It does not. The N-band blocking geometry acting on shuffled values
      generates reversals ABUNDANTLY -- a median of 108 of 144 cells -- and the
      actual value assignment SUPPRESSES them. Any future citation that reads
      this state as excess non-monotonicity attributable to arithmetic structure
      inverts the measurement. The frozen rule is two-sided and fired correctly;
      it is the label that is easy to misread, and the direction must be quoted
      with it every time.
  finding_2_one_third_of_the_effect_is_mechanically_forced_by_the_control_i_approved:
    fact: >-
      Decomposing the 57.64-cell gap between observed (50) and null mean (107.64)
      by functional: the four N-COUPLED functionals -- `order`, `full_liftable`,
      and `liftable_density` at W = p (W4001, W6007) -- contribute 19.12 cells,
      or 33.2%. Their observed residue is ZERO and their null mean is 19.12.
    why_it_is_circular: >-
      RT-20260807-743198 item 3b established that functionals which are exact or
      affine in N are monotone in 24 OF 24 cells, BECAUSE they are coupled to N,
      the variable the ladder blocks on. CTRL-VALUESHUFFLE destroys value-N
      association BY CONSTRUCTION. So it necessarily destroys the very property
      that made those functionals monotone, and their reversal under the shuffle
      is a mechanical consequence of the control's design rather than an
      independent observation. A third of the measured effect is therefore
      guaranteed before any data is drawn.
    whose_defect_this_is: >-
      THE COORDINATOR'S. This Coordinator wrote and approved amendment v2 from
      RT-20260807-743198's item-4 specification and did not notice that its
      item-3b finding made one arm of that specification partly circular. The
      two findings are three paragraphs apart in the same report.
    what_survives: >-
      The remaining 38.51 cells, 66.8% of the gap, come from functionals with no
      such mechanical guarantee, and that residue is NOT explained by the
      circularity. The control is weakened, not void. A successor should report
      the statistic with N-coupled functionals EXCLUDED as its primary measure,
      which is a cheap re-analysis of the committed artifacts and needs no new
      draw.
  finding_3_the_red_teams_localization_is_not_supported:
    fact: >-
      RT-20260807-743198 item 3f named the m = 3 sum-set family as the object to
      chase if the residue proved non-null. It is NOT separated from the shuffled
      null: `sumset_m3` observed 8 of 8 against a null mean of 6.12, two-sided
      p = 0.263682; `sumset_eff_m3` observed 8 of 8 against 6.37, p = 0.258706.
      Neither enters the terminal state, by the contract's own design.
    note: >-
      The m = 3 family is also the ONLY family whose observed residue EXCEEDS its
      null mean, and it does so by under two cells against a null sd that makes
      that unremarkable. So the one direction in which "structure creates
      reversals" would have been the right reading is exactly the direction that
      failed to reach significance.
    disposition: >-
      The localization is WITHDRAWN as unsupported at 200 replicates. This is not
      a refutation of the family being special -- the design's power against a
      2-cell shift is not characterised -- but nothing may be built on it.
  finding_4_the_p_value_is_at_the_resolution_floor:
    fact: >-
      p = 1/201 is the smallest value 200 replicates can produce. It is a bound,
      not an estimate of the tail probability, and must never be quoted as though
      the true p were known to be near 0.005.
    note: >-
      The observed value lying below the null minimum means more replicates would
      push the bound lower, not that the finding is marginal. But the number as
      written is a floor.
  what_this_does_not_establish: >-
    NOTHING ABOUT ISOGENY-CLASS STRUCTURE, NOTHING ABOUT ECDLP COST. This is an
    instrument characterisation at p in {4001, 6007}: it says the ladder's
    non-monotonicity is not Monte-Carlo noise (CORR-20260807-732541) and not a
    pure function of blocking geometry on an arbitrary multiset, and it says the
    dependence runs in the direction of SUPPRESSED reversals. It identifies no
    mechanism, and its one named candidate mechanism failed to separate.
  what_is_untouched:
  - >-
    Every version-1 result of EXP-INSTR-85b102 and both Validators' ten passed
    checks stand. No run is re-scored; no raw artifact is altered.
  - >-
    Nothing here bears on EXP-ICINV-4d33aa, EV-ENDO-10109d, or
    CORR-20260807-d78e2f's confound.
  - >-
    The contract's `what_non_decay_means` clause is NOT vindicated. The
    CONTROLLED_NULL branch, which would have required restricting it, did not
    fire -- but the clause's premise that Delta_max(N) orders the null means of
    N-uncoupled functionals was independently refuted by RT-20260807-743198 item
    3e and stands refuted regardless of this control's outcome.
  required_action:
  - >-
    Quote the terminal state STRUCTURE_PRESENT only together with its DIRECTION
    (observed 50 below a null median of 108) and with finding 2's 33.2%
    mechanical component. The state name alone is misleading.
  - >-
    Re-analyse the committed artifacts with N-coupled functionals excluded, and
    report that as the primary statistic. No new draw is required; it is a read
    of valueshuffle-null.json and reproduction-gate.json.
  - >-
    Do NOT chase the m = 3 family on the strength of this run. Its localization
    is withdrawn.
  - >-
    NO EVIDENCE RECORD may be written from this line without further independent
    review at `review-breakthrough`. AGENTS.md rule 12 governs: this is a
    contradiction between a validated execution report and two independent
    reviews, now compounded by a Coordinator-identified defect in the control
    design.
  - >-
    Add to the campaign's control-design obligations: a control that destroys an
    association must be checked against every finding that association explains.
    Here the check was three paragraphs away in the same report and was not made.
