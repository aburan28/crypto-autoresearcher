correction:
  id: CORR-20260727-005
  recorded_at: '2026-07-27'
  record_type: claim
  record_id: EV-IC-001
  field: boundaries[2] ("B=14, m=2 only; all Groebner solves on trivial ideals (no decompositions)")
  prior_value: >-
    "B=14, m=2 only; all Groebner solves on trivial ideals (no decompositions)."
    (ledger/evidence/EV-IC-001.yaml, boundaries.) The identical claim is echoed
    verbatim in ledger/decisions/DEC-20260726-005.yaml limitations as "B=14,
    m=2 only; all Groebner solves on trivial ideals", in
    experiments/EXP-IC-001/analysis.md Limitation as "B=14, m=2 only; all
    Groebner solves return trivial ideals (no decompositions)", and in
    ledger/evidence/EV-IC-001.yaml certificate_refs as "All decomposition runs
    found no decompositions; certificate kind=none, verified=true."
  corrected_value: >-
    "B = 14, m = 2 only. All Groebner solves at field_bits >= 20 ran on trivial
    ideals: no decomposition occurred at any instance with N >= 1e9, including
    the four instances DEC-20260726-005 rests on (36-bit seeds 2, 5, 10, 11),
    across all 500 committed runs at field_bits >= 20. However, 68 of the 748
    committed runs, at 7 of the 34 instances with N between 5 and 2377, DID
    decompose, with independently verified certificates of kind
    'decomposition' and metrics.is_trivial_ideal false. Certificate census over
    the 748 runs: {none: 646, decomposition: 68, discrete_log: 34}. Trivial
    ideals: 612. Decompositions by field_bits: 8 -> 56 of 60 runs, 12 -> 10 of
    60, 16 -> 2 of 60, and 0 at 20, 24, 28, 32 and 36 bits and among the 68
    runs carrying no field_bits. Fixed-mode per instance: 9, 9, 10, 1, 2, 2
    and 1 of 10 targets at (field_bits, seed) = (8,1), (8,2), (8,3), (12,1),
    (12,2), (12,3) and (16,3); 0 at the other 27 instances. Naive-mode counts
    are identical at every instance. The corresponding certificate_refs entry
    should read: 68 runs carry a verified certificate of kind 'decomposition',
    646 carry kind 'none', and 34 rho baselines carry kind 'discrete_log'."
  reason: >-
    The prior statement is FALSE as an absolute claim about the EXP-IC-001 run
    set, and TRUE exactly in the regime field_bits >= 20. A census of every
    experiments/EXP-IC-001/runs/*/raw-result.json file has now been performed
    four times by four non-originating parties, in exact agreement: by
    RT-20260727-001 (TASK-20260727-004), by RT-20260727-002 (TASK-20260727-012,
    which re-derived it from committed blobs via `git show` and was directed
    not to trust either prior reading), by the dispatching orchestrator, and by
    the Coordinator session executing TASK-20260727-009, which enumerated the
    raw-result.json files containing "decomposition_found": true and recovered
    the same 68 identifiers. The correction removes a false absolute framing;
    it does NOT rescue the crossover, because the confound the framing was
    describing survives intact across the entire decision-bearing regime
    (every instance with N >= 1e9 has zero decompositions). It also supplies,
    for free, the per-instance yield observation EXP-IC-002 was dispatched to
    obtain.
  scope_of_this_correction: >-
    ledger/evidence/EV-IC-001.yaml, ledger/decisions/DEC-20260726-005.yaml and
    experiments/EXP-IC-001/analysis.md are immutable committed records and are
    NOT edited by this correction. Per AGENTS.md rule 4 they are corrected by
    this superseding record. Any future reading of the three passages listed in
    prior_value must apply corrected_value. The one record that may be edited
    in place, ledger/goals/GOAL-ECDLP-001.yaml integrity note
    INT-BATCH006-003, was corrected in place on 2026-07-27 by TASK-20260727-010
    and already carries the corrected reading; the BATCH-006 dispatch queue,
    which is coordination history, carries it as integrity note
    AMEND-2026-07-27-A.
  what_is_NOT_corrected_here: >-
    Nothing about ledger/evidence/EV-STR-002.yaml, H-STR-002 or
    DEC-20260726-006 is corrected. EV-STR-002 records the parallel statement
    "All Groebner solves on trivial ideals (no decompositions at B >= 27)" and
    that census has NOT been run. Its status is unchanged and carried forward
    as an open confound. No hypothesis status is changed by this correction
    record; the H-IC-001 transition is made by DEC-20260727-008.
  evidence_artifacts:
    - ledger/corrections/CORR-20260727-005.yaml
    - ledger/evidence/EV-IC-002.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-006/reviews/TASK-20260727-004/review_report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-006/reviews/TASK-20260727-012/review_report.yaml
    - experiments/EXP-IC-001/runs/*/raw-result.json
  affects:
    - ledger/evidence/EV-IC-001.yaml boundaries and certificate_refs (read as corrected_value after this record)
    - ledger/decisions/DEC-20260726-005.yaml limitations item 2 (read as corrected_value after this record)
    - experiments/EXP-IC-001/analysis.md Limitation item 2 (read as corrected_value after this record)
    - ledger/goals/GOAL-ECDLP-001.yaml BATCH-005 checkpoint claim_boundary, which quotes the prior EV-IC-001 wording
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-006/dispatch_queue.json objective and batch_opening_decision (coordination history; see AMEND-2026-07-27-A)
  decided_by: coordinator
