  field: 'specification controls[0] (11a1 constant at 5 points) and invalidation_rules[2] (11a1 height-dependent
    count): scope of application'
  prior_value: As written, the control demands N_E(H) = 5 at every H on the grid, and rule 3 invalidates on any
    height-dependent count. The grid starts at H = 10, where the correct count is 3 (O, (5,5), (5,-6)); the two
    torsion points with x = 16 have naive height 16.
  corrected_value: 'The control and rule apply for H >= 16, where every torsion point of 11a1 is inside the height
    bound: N_E(H) must equal the torsion count 5 there and must not grow. On both runs N_E(H) = 5 for every grid
    H >= 30, and the H = 10 value 3 is the arithmetically correct count (verified by the validator blind search
    and a group-law enumeration). Neither run is invalidated.'
  reason: The control exists to catch a search that manufactures or loses points; no correct search satisfies the
    literal text at H = 10, so the literal text tests the grid, not the search. The scope is fixed by the curve
    (torsion heights), not by the outcome, and the validator named this exact remedy. Ruling requested by validation
    VAL-20261022-9ab683 (TASK-20261022-3aca4b). The separate finding that the coverage instrument cannot detect
    spread excess is not corrected here; it goes to the review.
