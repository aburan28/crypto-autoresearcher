correction:
  id: CORR-20260802-d07c1e
  recorded_at: '2026-08-02'
  record_type: harness_environment
  record_id: CORR-20260802-1a713e
  field: scope_of_the_claim_that_scholarly_egress_is_closed
  supersedes: CORR-20260802-1a713e
  detected_by: >-
    The same session that authored CORR-20260802-1a713e, during the
    goal-discovery step of /launch-research-harness, on reading
    GOAL-MLKEM-003.next_action.

  prior_value:
    claim_as_written: >-
      "SCHOLARLY EGRESS IS CLOSED FOR THE WHOLE ENVIRONMENT, NOT FOR ONE
      SESSION OR FOUR URLS. No session running in this Claude Code remote
      execution environment can discharge a primary-literature verification
      task, regardless of model, effort, or retry." Derived from a probe of
      eight scholarly hosts, all refused at the agent proxy.
    what_is_wrong_with_it: >-
      The probe was sound; the generalisation from it was not. Eight refusals
      in ONE session establish that THIS session has no scholarly egress. They
      do not establish a property of the environment as a class, and the
      ledger already contained a counterexample the author had not read.

  disconfirming_evidence_already_in_the_ledger:
    record: DEC-20260802-002 (GOAL-MLKEM-003, resume_from_budget_pause_on_restored_source_access)
    what_it_records: >-
      "the network policy that blocked every primary source has been lifted:
      this session verified reachability directly, receiving HTTP 200 from
      https://eprint.iacr.org/2022/1750 (17539 bytes) and HTTP 200 from
      https://csrc.nist.gov/pubs/fips/203/final (45732 bytes) before authoring
      this decision."
    date_of_that_verification: '2026-08-02'
    note: >-
      Same date as the refusals below. That decision's evidence is not
      disputed here; it is taken at face value, and it is precisely what makes
      the superseded claim too strong.

  reverification_performed_here:
    performed_at: '2026-08-02'
    method: curl with a 20 s timeout against the two exact URLs DEC-20260802-002 names, plus two controls.
    results:
      - {url: "https://eprint.iacr.org/2022/1750", result: "CONNECT tunnel failed, response 403"}
      - {url: "https://csrc.nist.gov/pubs/fips/203/final", result: "CONNECT tunnel failed, response 403"}
      - {url: "https://eprint.iacr.org/2026/384", result: "CONNECT tunnel failed, response 403"}
      - {url: "https://eprint.iacr.org", result: "CONNECT tunnel failed, response 403"}

  corrected_value:
    determination: >-
      SCHOLARLY EGRESS IS SESSION-SCOPED AND VARIES BETWEEN SESSIONS OF THIS
      HARNESS, INCLUDING ON THE SAME DAY. One session obtained HTTP 200 from
      eprint.iacr.org and csrc.nist.gov and recorded the byte counts; this
      session is refused at the proxy on those same two URLs and on every one
      of eight scholarly hosts probed. Both observations stand. Neither
      generalises to the environment as a class.
    operational_rule_that_replaces_the_superseded_one: >-
      A primary-source task is NOT permanently undischargeable and must NOT be
      treated as futile to retry. The correct procedure is: at the start of any
      batch carrying a "check the primary source" gate, run a cheap
      reachability probe against the specific sources that batch needs, and
      record the result with the URL and the observed status in the task
      record. Dispatch if reachable; route or defer if not. The probe costs one
      request and settles the question for that session, which is the only
      scope in which it can be settled.
    what_survives_from_the_superseded_record: >-
      The observation that THIS session cannot reach any of eight scholarly
      hosts, the eight-host result list, and the consequence that
      TASK-20260802-dce621 cannot be executed BY THIS SESSION. All of that is
      unchanged and remains accurate as a session-scoped statement.
    what_does_not_survive: >-
      The words "for the whole environment", "no session ... regardless of
      model, effort, or retry", and "retrying here is futile". Those are
      withdrawn.

  effect_on_research_state:
    dispositions_changed: 0
    statuses_changed: 0
    hypotheses_moved: []
    goal_status_changed: false
    claim_tier: none
    effect_on_BATCH_028_correction: >-
      None. CORR-20260802-6a1b0c and the theorem_row_corrections artifact
      already scoped their limitation correctly, as "this session could not
      refetch", and never asserted the environment-wide claim. Only the later
      widening record overreached.

  process_note: >-
    Recorded rather than quietly fixed because the failure mode is worth
    naming: a probe that returns a uniform negative invites a generalisation
    one step wider than the probe supports, and the ledger is exactly where a
    counterexample to such a generalisation is likely to already exist. The
    goal-discovery step of the harness surfaced it within minutes of the
    record being written. Reading the ledger BEFORE generalising from a probe
    is the cheaper order.

  inference:
    requested_policy: coordinator-orchestration-code
    resolved_model_id: claude-opus-5
    model_verified: false
    fallback_used: true
    fallback_reason: >-
      Run under the Claude Code harness, which cannot resolve the GPT-5.6
      family policy aliases in orchestration/model-policies.yaml. The actual
      resolved model is recorded directly per the CLAUDE.md model policy note.
    degraded_requirements: []
