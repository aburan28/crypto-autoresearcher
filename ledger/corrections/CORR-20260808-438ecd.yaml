correction:
  id: CORR-20260808-438ecd
  recorded_at: '2026-08-08'
  recorded_by: >-
    top-level session running RQ-FALSIFY-a2c501 (NOT an independent Coordinator
    subagent, NOT independently reviewed). Narrows this session's own evidence
    record. Raises nothing.
  type: misattributed_quotation
  supersedes: []
  corrects:
    - ledger/evidence/EV-FALSIFY-896f80.yaml
    - docs/falsification-program.md
  record_type: evidence
  record_id: EV-FALSIFY-896f80

  field: EV-FALSIFY-896f80 observation O-3
  prior_value: >-
    "AGENTS.md rule 14 states 'A random token scans no state and so CANNOT
    CONVERGE', and CLAUDE.md repeats it verbatim."
  corrected_value: >-
    THE AGENTS.md HALF IS CORRECT AND THE CLAUDE.md HALF IS FALSE.

    AGENTS.md rule 14 does contain "A random token scans no state and so cannot
    converge", verbatim and unchanged as of origin/main a65a6044. That is a
    universal negative about a randomised algorithm and the objection to it
    stands exactly as filed.

    CLAUDE.md contains no such sentence. `grep -c "cannot converge" CLAUDE.md`
    returns 0. What it actually says is: mint "with python3 tools/allocate_id.py
    --next <type> [--area X | --date YYYYMMDD], which draws a token **without
    scanning state**, then `--check` it before use."

    That wording is ACCURATE. It makes no impossibility claim, and it names the
    --check step in the same sentence as the mint -- which is precisely the
    mitigation EV-FALSIFY-896f80 O-6 identifies as the thing that actually
    catches collisions against committed state. CLAUDE.md gets this right.

  effect_on_the_finding: >-
    NARROWER AND SHARPER, not withdrawn. Exactly ONE document overstates the
    fix, not two, and it is the one that states a rule rather than the one that
    gives the procedure. Every number in EV-FALSIFY-896f80 is unaffected: the
    16^6 namespace, 1,275 tokens in use, worst family 181, P(collision) 1.08e-05,
    the birthday figures at N=1000/5000/20000, the family analysis, and both
    controls. The proposed correction there -- replace "cannot converge" with the
    allocator's own formulation plus the number -- now applies to AGENTS.md rule
    14 alone.

  cause: >-
    The two documents were read together and the shared claim was attributed to
    both without grepping the second. The same class of error as
    CORR-20260808-733115 item 1, where a verdict true of KN-FIND-d4f820 was
    applied to KN-FIND-e7a3b1 as well: a property checked on one object asserted
    of a second that merely resembles it. Third correction this session has filed
    against its own records, and the seventh occasion on which checking before
    asserting prevented or repaired a false claim.

  preventive_action: >-
    Quote-level claims about a document must be grepped against that document,
    per document, before filing. This costs one command and would have caught it.

  what_still_stands: >-
    Everything in EV-FALSIFY-896f80 except the four words "and CLAUDE.md repeats
    it verbatim". The docs/falsification-program.md F-10c entry carries the same
    error in the phrase "AGENTS.md rule 14 and CLAUDE.md both say" and is
    corrected in the same commit.
