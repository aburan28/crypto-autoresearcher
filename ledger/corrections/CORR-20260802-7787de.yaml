correction:
  id: CORR-20260802-7787de
  recorded_at: '2026-08-02'
  record_type: claim
  record_type_note: >-
    claim is the closest permitted token, as in CORR-20260724-001,
    CORR-20260802-008 and CORR-20260802-a1f151. The corrected artifact is a goal
    record's provenance binding.

  corrected_record: ledger/goals/GOAL-PATH-001.yaml
  field: latest_verified_commit
  goal_id: GOAL-PATH-001
  batch_id: BATCH-003
  raised_by: >-
    CORR-20260802-a1f151 open item OI-1, which named GOAL-PATH-001 as one of
    three goals carrying a latest_verified_commit that does not resolve, and
    deliberately did not repair it because "repairing another goal's binding is
    that goal's Coordinator's call". DEC-20260802-505759 makes this session that
    Coordinator for this batch, so the repair is now in scope.

  prior_value: 9f80eebbef2df9a521a9cce8da66391cfcb63e73
  corrected_value: 67c2e5bf27c3b014e25829554130199d7918ae2b

  why_it_had_to_be_repaired_before_anything_else: >-
    GOAL-PATH-001 is the prioritization goal that GOAL-ICEX-001, GOAL-MONO-001
    and GOAL-RELN-001 all defer to. A driver resuming the index-calculus chain
    could not verify the checkpoint it was building on. This is the blocker
    CORR-20260802-a1f151 reported and did not clear.

  measurements:
    method: >-
      git cat-file -e <sha>^{commit} for each recorded sha; then, for each
      candidate rebind target, git show <ref>:<path> for all 61 paths in the
      BATCH-001 receipt's source_path_sha256 map, hashed and compared.
    recorded_commit_9f80eebb: DOES_NOT_RESOLVE
    recorded_parent_14a73002: RESOLVES
    recorded_parent_note: >-
      The PARENT survived and the ARCHIVE COMMIT did not. That is the exact
      signature of a branch tip replaced by a squash or rebase, and it is the
      mechanism CORR-20260802-a1f151 documented.
    candidate_rebind_targets_tested:
      - ref: e8832002a122e75c4be6a711295b91d5b3e1cf61
        what: the commit on main that first introduces the BATCH-001 archive artifacts
        paths_matching_receipt: 50
        paths_mismatching: 11
        paths_absent: 0
      - ref: 14a7300275c055bc3eaeeda2421fec7b6a490bb2
        what: the parent sha the receipt itself records
        paths_matching_receipt: 0
        paths_mismatching: 2
        paths_absent: 59
    conclusion_of_the_search: >-
      NO COMMIT IN THIS REPOSITORY REPRODUCES THE 61 DECLARED PATH HASHES. The
      BATCH-001 archive commit is genuinely gone, not merely renamed. Nothing is
      gained by pointing the field at a near-miss and calling it the archive
      commit, so this record does not do that.

  what_the_corrected_value_is_and_is_not:
    what_it_is: >-
      67c2e5bf is the commit on this branch that introduces
      ledger/decisions/DEC-20260802-505759.yaml - GOAL-PATH-001's own next
      verified checkpoint, the decision that resolves its pending three-way
      prioritization choice. It resolves, it is reachable from this branch's
      HEAD, and its content is checkable.
    what_it_is_not: >-
      IT IS NOT A RECONSTRUCTION OF THE LOST BATCH-001 ARCHIVE COMMIT. The
      BATCH-001 checkpoint's snapshot_commit field still records 9f80eebb and is
      NOT edited, because that checkpoint is immutable and recorded what was true
      when written. A reader of that checkpoint must consult this record.
    known_fragility_declared_up_front: >-
      67c2e5bf IS A BRANCH COMMIT. IF THIS BRANCH IS SQUASH-MERGED IT WILL STOP
      RESOLVING FROM MAIN, EXACTLY AS 9f80eebb DID. That is not a reason to
      withhold the repair - an unresolvable sha is strictly worse than one that
      resolves today - but it is a reason to record the durable binding as well.
    durable_content_binding: >-
      sha256 of ledger/decisions/DEC-20260802-505759.yaml is
      376b655378ccc437ab2e85b3a5fb52a3d0e343c77fb7e7ee3e13eef175b7c0a8. THIS
      SURVIVES ANY MERGE STRATEGY. A reviewer who cannot resolve the commit can
      still verify the checkpoint's content from this hash.

  scope_of_this_repair:
    repaired_here: [GOAL-PATH-001]
    NOT_repaired_here: [GOAL-FIND-001, GOAL-MLKEM-001]
    why_not: >-
      Same reason CORR-20260802-a1f151 gave for not repairing this one: each is
      that goal's Coordinator's call, and no decision in this campaign makes this
      session their Coordinator. CORR-20260802-a1f151 OI-1 is therefore PARTLY
      DISCHARGED - one of three - and stays open for the other two.
    also_still_open: >-
      GOAL-ICLIFT-001's latest_verified_commit is prose rather than a sha
      (CORR-20260802-a1f151 OI-2), and tools/validate_ledger.py still does not
      check this field's form. A schema check rejecting non-sha values would have
      caught that one, the GOAL-HAWK-001 placeholder, and this one at write time.

  what_is_and_is_not_wrong:
    receipt_was_true_when_written: >-
      The BATCH-001 receipt was verified at write time against the commit it
      named. The defect is that the reference class is not durable across a
      squash merge, not that anyone recorded a falsehood.
    no_research_claim_is_affected: >-
      No evidence record, hypothesis, experiment or cryptanalytic statement
      depends on GOAL-PATH-001's commit binding. Nothing about ECDLP, index
      calculus, monodromy or relation rates changes by one word.
    changes_no_hypothesis_status: true
    is_not_a_cryptanalytic_result: true
    admissible_toward_closure_quorum: false

  open_items:
    - id: OI-1
      item: >-
        GOAL-FIND-001 (80238727042d) and GOAL-MLKEM-001
        (e487652127433e4cb1f0c1de173dfa197ca23c1f) still carry unresolvable
        latest_verified_commit values. Each needs its own Coordinator. NOT DONE HERE.
    - id: OI-2
      item: >-
        The general fix for squash-merge receipt breakage remains a harness-design
        decision, unmade. CORR-20260802-a1f151 OI-3 states three alternatives and
        chooses none; this record adds one datum in favour of the third - binding
        to content rather than to commits - namely that the content hash above is
        the only part of this repair guaranteed to survive the merge.

  recorded_by: coordinator
  authority_note: >-
    Written from claude/algebraic-number-theory-kb-zpmu0c under
    DEC-20260802-505759, which makes this session GOAL-PATH-001's Coordinator for
    BATCH-003. It edits one mutable provenance field, leaves the immutable
    BATCH-001 checkpoint untouched, changes no status, and makes no decision about
    the two other affected goals.
