correction:
  id: CORR-20260904-b9f9c1
  recorded_at: '2026-09-04'
  recorded_by: coordinator
  type: supersedes_prior_correction_upgrades_severity_and_replaces_the_proposed_fix_with_an_independently_proven_tight_condition
  severity: medium_this_is_a_recurrence_of_a_previously_identified_and_fixed_degeneracy_pattern_in_the_same_sub_thread_not_an_isolated_oversight
  supersedes:
    - CORR-20260904-e526e0
  corrects:
    - experiments/EXP-MONO-98abb2/specification.yaml
    - ledger/hypotheses/H-MONO-1297d7.yaml
    - ledger/corrections/CORR-20260904-e526e0.yaml

  why_this_supersedes_rather_than_amends: >-
    CORR-20260904-e526e0 correctly identified the coincidence and its
    immediate cause, but independent review (TASK-20260904-f8c4dd) found
    it incomplete in two ways that change its own conclusions, not merely
    add detail: (1) its severity call and (2) its proposed fix. Per
    AGENTS.md rule 4, the original record is immutable and stands as
    written; this record supersedes it with the corrected, independently
    verified analysis.

  finding_1_severity_should_be_medium_not_low: >-
    Per Red Team's own independent review: this is the SECOND time this
    exact three-experiment sub-thread's search-then-compare design has
    landed on the least-discriminating point available. The FIRST time
    was EXP-MONO-4e6faa's own h_-=1 curve, which is exactly why
    EXP-MONO-ee06e2 had to be designed at all (h_-=1 could not
    discriminate the linear-vs-quadratic functional form). EXP-MONO-ee06e2
    fixed that specific instance (requiring h_->=2), but the fix was NOT
    generalized when EXP-MONO-98abb2's own bivariate filter was written --
    "h_+ >= 1 AND h_- >= 1" reintroduces exactly the same class of
    minimal-value degeneracy in the new, joint dimension. This is a
    recurring, previously-identified-and-fixed-once-already pattern, not
    an isolated oversight: an unweighted "first hit, ascending order"
    search over a filter is biased toward the numerically smallest
    admissible values, and those are disproportionately likely to be
    exactly the boundary/degenerate case of whatever comparison the
    experiment exists to make. This mechanism -- "Stage-2 comparator
    degeneracy at a Stage-0 filter's own minimal threshold" -- should be
    named explicitly and checked for on every future experiment in this
    sub-thread, not merely patched instance-by-instance.

  finding_2_the_proposed_fix_h_plus_not_equal_h_minus_is_sufficient_but_not_tight: >-
    Both independent reviewers derived the exact characterization. Red
    Team's closed-form identity, valid for ALL non-negative integers
    h_+, h_-, n_+, n_-:
        D_prod - D_sum = h_-(h_+ - 1) n_+  +  h_+(h_- - 1) n_-
    Over the admissible domain of EXP-MONO-98abb2's own filter (h_+ >= 1,
    h_- >= 1, and n_+, n_- > 0 guaranteed by the Hasse bound at every
    prime in the toy range), both terms are non-negative, and the sum is
    exactly zero if and only if h_+ = h_- = 1 -- a SINGLE point, not the
    entire diagonal h_+ = h_-. In particular h_+ = h_- = 2 does NOT
    coincide (D_prod - D_sum = 2(n_+ + n_-) > 0). The Validator
    independently confirmed, by case analysis plus an exhaustive
    39-million-point bounded search, that h_+ != h_- is sufficient (given
    n_+, n_- > 0) -- consistent with, but weaker than, Red Team's full
    characterization. CORR-20260904-e526e0's own proposed fix
    ("require h_+ != h_-") is therefore CORRECT but not TIGHT: it would
    needlessly exclude perfectly good discriminating curves such as
    h_+ = h_- = 2. The exact, necessary-and-sufficient replacement,
    independently proven by both reviewers:
        REQUIRE max(h_+, h_-) >= 2   (equivalently: exclude exactly (1,1))

  finding_3_scope_of_error_claim_confirmed_but_undercited: >-
    Red Team independently re-derived that EV-MONO-91bca2's rival
    ("#E[4]-alone", h_--blind) cannot coincide with D_sum whenever h_->0
    and n_+>0 (it can only match a nonzero D_sum by itself being zero,
    which requires h_-=0, excluded by that experiment's own filter), and
    that EV-MONO-fae201's rival (D_quad) was deliberately tested at
    h_-=3 specifically BECAUSE the h_-=1 degeneracy had already been
    identified one experiment earlier -- i.e. that sub-thread's own design
    already correctly anticipated and avoided this exact failure mode.
    CORR-20260904-e526e0's claim that those two records are unaffected is
    NUMERICALLY CORRECT but did not cite this directly relevant precedent
    explicitly, which is part of why finding_1's own severity point (this
    is a recurrence, not a first occurrence) was under-weighted in the
    original record.

  disposition: >-
    RUN-MONO-98abb2-1 remains valid, non-discriminating confirming
    evidence for the additive form, exactly as CORR-20260904-e526e0
    already established -- that part is unchanged. What changes here is
    severity (low -> medium) and the corrected follow-up's own required
    Stage-0 filter (max(h_+,h_-) >= 2, not merely h_+ != h_-).

  next_action: >-
    Design the corrected follow-up (H-MONO-1297d7's successor) with
    Stage-0 filter "Z=3 AND max(h_+,h_-) >= 2" -- proven, not merely
    hoped, to guarantee D_sum != D_prod on whatever curve the search
    finds. Name the general "comparator degeneracy at the filter's own
    minimal threshold" pattern explicitly in that record's own design
    rationale, and check it BEFORE freezing any future rival-discrimination
    specification in this sub-thread, not only after a run exposes it.

  reported_by: red-team (J3/J4, TASK-20260904-f8c4dd), corroborated by validator (J2)
  acknowledged_by: coordinator
