  field: EV-FALSIFY-f14d8c observations O-5 and O-6
  prior_value: >-
    O-5 reported that KN-FIND-013's implied conversion rate (gap divided by
    Delta) is 0.37 / 0.83 / 0.83 CC bits per Delta bit, with Kyber-512 differing
    from the other two by a factor of 2.2, and that this "wants an explanation".
    O-6 stated it "CANNOT BE RESOLVED FROM THE RECORD" because the Theorem 4.1
    cost expression is not reproduced, and recommended searching coordination/
    and inputs/ as a follow-up.
  corrected_value: >-
    RESOLVED, AND KN-FIND-013 IS CORRECT. The follow-up O-6 recommended was
    carried out. The Case A model is stated in
    coordination/goals/GOAL-MLKEM-003/batches/BATCH-004/tasks/TASK-20260731-010/
    validation_notes.md:

        cost(Delta) = log2( 2^Tsample + 2^(second_term + Delta) )

    with per-set parameters second_term / Tsample of 133.41 / 139.51
    (Kyber-512), 192.64 / 194.81 (Kyber-768) and 257.24 / 259.35 (Kyber-1024).
    Solving cost(Delta) = the NIST cutoff reproduces every value to four decimal
    places: 9.4555, 14.3597, 14.7598, matching the validation notes exactly and
    KN-FIND-013's rounded 9.5 / 14.4 / 14.8.

    THE KYBER-512 ANOMALY IS A REAL REGIME DIFFERENCE, not an error. The cost is
    a log-sum-exp in which only the SECOND term receives +Delta, so Delta moves
    the total only insofar as it lifts that term past the sampling term. The gap
    Tsample - second_term is 6.10 bits at Kyber-512 against 2.17 and 2.11 at
    Kyber-768 and Kyber-1024. At Kyber-512 far more of Delta is absorbed
    overcoming a dominant Tsample, which is exactly why its conversion rate is
    0.37 rather than 0.83. The rate SHOULD differ, and the two sets whose gaps
    are nearly equal (2.17, 2.11) have nearly equal rates (0.83, 0.83), which is
    the consistency check the earlier observation was missing.

  effect_on_the_finding: >-
    EV-FALSIFY-f14d8c's O-5 and O-6 are withdrawn as an open question. Nothing
    else in that record changes: KN-FIND-015's 12-of-12 arithmetic check, the
    note that its lattice-estimator measurements are unverifiable in this
    environment, the cross-record consistency in O-7, and the scoping praise in
    O-8 all stand. The proposed correction for KN-FIND-013 is also withdrawn:
    its Delta column is recomputable, from an artifact the record does not cite
    but which exists. What remains, and is a much weaker point, is that a reader
    of KN-FIND-013 alone cannot recompute Delta without finding that validation
    note; citing it would help and is the only change worth suggesting.

  cause: >-
    O-6 declared a question unresolvable after searching only the finding
    itself, while simultaneously naming the search that would resolve it. The
    honest options were to run that search before filing, or to file with the
    question explicitly deferred. Filing "cannot be resolved" when the resolution
    was one grep away overstates the limit. This is the same shape as
    CORR-20260808-733115: a conclusion drawn from the record in hand rather than
    from the repository.

  what_still_stands: >-
    Every arithmetic figure in EV-FALSIFY-f14d8c, including the 0.37 / 0.83 /
    0.83 rates themselves, which are correctly computed -- what was wrong was
    treating their difference as unexplained rather than as a consequence of the
    model. KN-FIND-013 required no correction and gets none.
