correction:
  id: CORR-20260819-7c4e19
  recorded_at: '2026-08-19'
  record_type: claim
  record_id: ICEX-AUTHORIZATION-DEFECT-DIAGNOSIS-20260819
  field: goal_icex_001_measurement_authorization_status
  prior_value:
    source: >-
      ICEX-DOSSIER-READ-ME-FIRST.md at the root of worktree
      claude/icex-001-authorization-audit-20260819, prepared 2026-08-19 by the
      dispatching Coordinator session. Not a ledger record; no ledger write was
      made by it. Reproduced here because this correction supersedes its
      diagnosis and the diagnosis must remain readable.
    claims:
      - >-
        D1. "ledger/goals/GOAL-ICEX-001.yaml:59 asserts: MEASUREMENT AUTHORIZED
        (DEC-20260731-015 / EV-ICEX-001)", and that this sentence "is the
        authorization its batch work rests on".
      - >-
        D2. "An active goal is therefore running on an authorization sentence
        whose two supporting IDs are both other goals' records, one of which is
        a pause. This is not a broken reference - it is an authorization that
        was never issued."
      - >-
        D3. "The receipt has no content binding": the ledger receipt at
        coordination/goals/GOAL-ICEX-001/batches/BATCH-001/archives/TASK-20260731-024/ledger-receipt.json
        has "path_sha256: {} - empty", so "the archive-receipts-bind-to-content-first
        rule has nothing to bind. This is why the defect survived: there was no
        hash to fail."
      - >-
        D4. "Three mutually inconsistent IDs are in play ... No two agree. None
        is an ICEX decision", listing DEC-20260731-015, DEC-20260731-003 and
        DEC-20260725-015 as competing candidates for ICEX's authorization.
      - >-
        D5. DEC-20260802-a51c82, the goal head's other cited decision, belongs
        to GOAL-MONO-001, offered as further evidence of mis-citation.
      - >-
        D6. "No decision record in the ledger belonging to GOAL-ICEX-001. Not
        one."
      - >-
        D7. Sub-class (B), "declared IDs mutated after the binding write", with
        ICEX and GOAL-SIG-001 as instances, and with AES-001 TASK-20260801-808
        and MCE-001 C-2 making "four confirmed instances across four goals - a
        systemic pattern, not four accidents".
      - >-
        D8. Recommended status for GOAL-ICEX-001: paused, "pending either the
        discovery of a real authorization record or the issuance of a new one".
  corrected_value:
    summary: >-
      The central claim is inverted. GOAL-ICEX-001 does not assert that ICEX
      measurement is authorized; it asserts, in the same sentence the dossier
      quotes, that it is NOT. The goal is recorded as deliberately
      non-executing, and the absence of an ICEX measurement authorization is the
      intended and repeatedly re-affirmed state of this goal, not a defect in
      it. Two of the dossier's supporting findings are wrong on the artifacts
      (D1, D3), two are true as facts but do not support the conclusion drawn
      from them (D4, D5), and two are confirmed (the DEC-20260731-015 fields,
      and the absence of any decision carrying goal_id GOAL-ICEX-001). A real
      but different defect exists and is recorded below as N1-N4.
    refuted:
      - id: D1
        finding: REFUTED
        detail: >-
          next_action on ledger/goals/GOAL-ICEX-001.yaml is a folded block
          scalar spanning lines 56-71. Read as a whole it begins "UNCHANGED IN
          SUBSTANCE - remain non-executing until charged SDEG/MONO/RELN
          measurement packages exist; optionally tighten RT023-O1/O2 at seal.
          NO ICEX MEASUREMENT AUTHORIZED (DEC-20260731-015 / EV-ICEX-001)."
          The words "NO ICEX" terminate line 58; line 59 alone begins
          "MEASUREMENT AUTHORIZED". A line-scoped citation of ":59" drops the
          negation and inverts the sentence. This is the same failure mode as
          the separator-free grep that produced the "441,350 not found" incident
          this week: a line-oriented or token-oriented read of a value that
          spans the boundary the reader chose.
      - id: D3
        finding: REFUTED
        detail: >-
          The ledger receipt declares schema
          crypto.autoresearch.archive_receipt.v1 and contains NO key named
          path_sha256 at all. Its content-binding field is artifact_sha256, and
          it is populated with five SHA-256 values covering the red-team report,
          the falsification review, EV-ICEX-001.yaml, DEC-20260731-015.yaml and
          GOAL-ICEX-001.yaml. Separately, the binding that tools/research_dispatch.py
          actually reads is the dispatch queue's
          tasks[TASK-20260731-024].archive.path_sha256 (the tool reads
          archive["path_sha256"] at lines 429, 637, 1111 and 1268 of
          tools/research_dispatch.py), and that object carries six populated
          SHA-256 values. The two artifacts agree byte-for-byte on all five
          shared paths. The archive is content-bound twice over. "There was no
          hash to fail" is false; the hashes exist and were never checked.
      - id: D4
        finding: REFUTED as a set of competing authorizations
        detail: >-
          DEC-20260725-015 is not a third candidate ICEX authorization.
          EV-ICEX-001 observations[1] cites it as one of three feed pins -
          "SDEG/MONO/RELN feeds hard-pinned to DEC-20260725-015/027/017" - which
          is what a feed pin from another goal is supposed to look like. Reading
          it as a rival authorization ID requires discarding the sentence it
          appears in.
      - id: D5
        finding: REFUTED as evidence of defect
        detail: >-
          DEC-20260802-a51c82 does carry goal_id GOAL-MONO-001 and decision
          support (confirmed). GOAL-ICEX-001 cites it as "ONE MANDATORY READ IS
          ADDED: BEFORE CONSUMING ANY MONO FEED, READ DEC-20260802-a51c82". A
          MONO decision is exactly the record a mandatory-read-before-consuming-a-MONO-feed
          instruction should name. Its belonging to another goal is the point of
          the citation, not a flaw in it.
      - id: D8
        finding: REFUTED as to its stated premise
        detail: >-
          The recommendation rests on the premise that ICEX "must not keep
          running on an authorization that does not exist". ICEX is not running.
          coordination/goals/GOAL-ICEX-001/batches/BATCH-641950/SCOPE-DECISION.md
          section 6 records "Budget consumed. Zero against
          total_wall_clock_seconds: 43200. No Executor, Validator, or Red Team
          session dispatched." The premise for the status change is absent. See
          DEC-20260819-3fb8a2 for the status determination.
    confirmed:
      - id: D2-partial
        finding: CONFIRMED as to fields, REFUTED as to inference
        detail: >-
          ledger/decisions/DEC-20260731-015.yaml carries goal_id
          GOAL-ECDLP-001, batch_id BATCH-021, recorded_by_task
          TASK-20260731-057, decision pause. Confirmed verbatim. The inference
          "on both counts it cannot authorize ICEX measurement" is correct but
          irrelevant: the goal head cites it for a NON-authorization, and a
          record whose decision_vocabulary_note says "No Executor run is
          authorized" is directionally consistent with the sentence citing it.
          What remains a genuine defect is narrower - the record's subject
          matter is a GOAL-ECDLP-001 BATCH-021 control-theater repair and has no
          ICEX content, so it is the wrong record for the citation even in the
          negative direction. See N2.
      - id: D6
        finding: CONFIRMED
        detail: >-
          No record under ledger/decisions/ carries goal_id GOAL-ICEX-001. See
          searches_performed S4.
    new_findings:
      - id: N1
        detail: >-
          The declared-ID change the dossier reads as silent drift is a
          documented, authorized supersession. ledger/corrections/CORR-20260731-005.yaml
          records an add/add merge ID collision on
          cursor/ecdlp-tier-path-goals for PR #82, remapping the tier-path
          campaign's decisions DEC-20260731-001..003 to 009..011 and then, after
          PR #75 put FAEST/AES decisions on main at 009..012, to
          DEC-20260731-013..015. Its reference_updates list names
          ledger/goals/GOAL-ICEX-001.yaml, ledger/decisions/DEC-20260731-015.yaml
          and ledger/evidence/EV-ICEX-001.yaml explicitly, and its
          also_reissued list names EV-SIG-009 and EV-SIG-010. The queue's
          declared ID was therefore changed under a committed correction, which
          is the prescribed repair, while the immutable commit e948de55 kept the
          pre-remap path ledger/decisions/DEC-20260731-003.yaml. The dispatcher's
          missing/extra complaint is the expected consequence of an authorized
          remap that cannot reach back into a pushed commit - not evidence of an
          unauthorized edit.
      - id: N2
        detail: >-
          The remap target was subsequently re-occupied, and this was never
          corrected. ledger/decisions/DEC-20260731-013.yaml is a GOAL-ECTD-001
          BATCH-002 experiment approval; -014 and -015 are GOAL-ECDLP-001
          BATCH-021 records recorded_by_task TASK-20260731-054 and -057. None of
          the three is the GOAL-ICEX-001 BATCH-001 ledger decision that
          CORR-20260731-005 assigned an ID in that range. The consequence is
          that the GOAL-ICEX-001 BATCH-001 governing decision is not reachable
          by any identifier in the working tree.
      - id: N3
        detail: >-
          The orphaned decision's CONTENT is not lost and is content-bound. Both
          the queue archive block and the ledger receipt independently declare
          ledger/decisions/DEC-20260731-015.yaml at SHA-256
          05627e11dac0014ec866683d349942d07682f0a3d1f9e2a0a68917a2e3beeebc, and
          the queue records the archive commit as
          e948de55e0590f9c8ccbeed4f13996039e8353db (parent
          35e8d4e2fbadd14302515bc9d0e104a90a37086a) where the record stood at
          its pre-remap path ledger/decisions/DEC-20260731-003.yaml. This
          session has no shell, ran no git command, and computed no hash; it
          therefore asserts nothing about that record's text and does not claim
          to have recovered it. It records only that a recovery target exists
          and is identified by hash.
      - id: N4
        detail: >-
          The genuine unrepaired defect in this archive is a missing post-commit
          verification, not a missing content binding. The ledger receipt
          records commit_sha null, parent_sha null, and verification.status
          "pending_post_commit", while the dispatch queue's archive block for
          the same task records commit_sha
          e948de55e0590f9c8ccbeed4f13996039e8353db. Under AGENTS.md rule 7 the
          ledger transition this archive carried was therefore never made
          official by an accepted verifier run.
    authorization_status:
      icex_measurement_authorization: >-
        DOES NOT EXIST, AND IS NOT SUPPOSED TO. EV-ICEX-001 inference reads "Do
        not authorize implementation or measurement until charged SDEG/MONO/RELN
        measurement packages exist and a separate Coordinator ledger
        authorization is issued." Its observations record "present-tense
        non-authorization" surviving independent red team RT-20260731-023, and
        "No ICEX measurement or solver campaign was executed."
        coordination/goals/GOAL-ICEX-001/batches/BATCH-641950/SCOPE-DECISION.md
        R-4 states that separate authorization "has never been issued", and
        experiments/EXP-ICEX-146ff5/specification.yaml carries
        execution_authorization.granted false. Four independent artifacts agree.
        The absence is deliberate, consistent, and correctly recorded.
      icex_batch_001_governing_decision: >-
        EXISTED, IS CONTENT-BOUND, AND IS CURRENTLY UNREACHABLE BY ID. See N2
        and N3. This is the defect that needs repair.
  reason: >-
    The dossier's load-bearing quotation was taken at a line boundary inside a
    folded YAML block scalar and dropped the negation "NO ICEX", inverting the
    claim under audit from a non-authorization into an authorization. Its
    receipt finding queried a key (path_sha256) that the receipt schema does not
    define, and read the absent key as an empty binding rather than as a wrong
    key. Correcting the record matters in both directions: the program must not
    pause a goal for running on a fabricated authorization it never claimed, and
    must not let the real defect - an ID-remap target re-occupied by another
    campaign, plus an unverified archive - be closed out as though it were the
    diagnosed one.
  searches_performed:
    - id: S1
      note: >-
        R-10 requires the exact search behind any absence assertion, and
        requires that the method be varied. Every search below was run with the
        Grep tool against the worktree at
        /private/tmp/claude-501/-Volumes-SSD990-crypto-autoresearcher/c016eeee-1f89-4348-9809-2b92fafafa85/scratchpad/icex-wt
        on 2026-08-19. No git command was run and no hash was computed by this
        session.
    - id: S2
      method: whole-file read, not line-scoped grep
      target: ledger/goals/GOAL-ICEX-001.yaml
      result: >-
        85 lines read in full. next_action is a folded block scalar at lines
        56-71 whose text is "... remain non-executing ... NO ICEX MEASUREMENT
        AUTHORIZED (DEC-20260731-015 / EV-ICEX-001) ...". Refutes D1.
    - id: S3
      method: free-text token search, area-scoped by filename glob
      pattern: 'ICEX|index-calculus'
      paths: ledger/decisions/ with glob DEC-20260731-*.yaml
      matches: 0 occurrences across 0 files, out of 40 DEC-20260731-*.yaml files
      result: >-
        No decision dated 2026-07-31 mentions ICEX or index calculus anywhere in
        its text. Supports N2.
    - id: S4
      method: exact field search, whole ledger tree rather than one directory
      pattern: 'goal_id: GOAL-ICEX-001'
      paths: ledger/
      matches: >-
        2 matches, both in ledger/proposals/ (IDEA-20260808-2ef5c8.yaml line 7,
        IDEA-20260808-bfa0b9.yaml line 7). 0 matches in ledger/decisions/.
      result: Confirms D6, and extends it - the field appears nowhere else in the ledger either.
    - id: S5
      method: ID-shaped search across the whole ledger, not just decisions
      pattern: 'TASK-20260731-02[1-4]|EV-ICEX-001|RQ-ICEX-001|EXP-ICEX'
      paths: ledger/
      matches: 56 files
      result: >-
        No decision record among them is a GOAL-ICEX-001 BATCH-001 decision.
        Also surfaced that GOAL-ECDLP-001 has its own TASK-20260731-021, i.e.
        legacy numeric task IDs collide across goals.
    - id: S6
      method: commit-sha token search over the whole worktree
      pattern: a1d6ec1d
      paths: repository root
      matches: >-
        9 matches across 5 files - the dispatch queue, the red-team report (x3),
        the falsification review (x2), the goal record, and EV-ICEX-001.
      result: >-
        The BATCH-001 producer snapshot is coherently cross-referenced. Nothing
        else in the repository claims that commit.
    - id: S7
      method: directory enumeration rather than content search
      paths: coordination/goals/GOAL-ICEX-001/**
      matches: 8 files
      result: >-
        Surfaced coordination/goals/GOAL-ICEX-001/batches/BATCH-641950/SCOPE-DECISION.md,
        which the dossier does not cite. It is the ICEX Coordinator's own
        committed reading of the non-authorization, quotes the next_action
        verbatim WITH the "NO ICEX" negation intact, and states at R-4 that the
        separate ledger authorization has never been issued.
    - id: S8
      method: source read of the consuming tool
      pattern: 'path_sha256|artifact_sha256'
      paths: tools/research_dispatch.py
      matches: 14 lines, all path_sha256, none artifact_sha256
      result: >-
        The dispatcher reads archive["path_sha256"] from the dispatch queue. It
        never reads the receipt file's artifact_sha256. Establishes that the
        dossier queried a key in a file that does not use it. Refutes D3.
    - id: S9
      method: cross-goal check of the sibling instance named by the dossier
      pattern: 'EV-SIG-010|EV-SIG-007|fed33c09'
      paths: coordination/goals/GOAL-SIG-001
      matches: 10 lines across 4 files
      result: >-
        GOAL-SIG-001 BATCH-002 declares EV-SIG-010 at SHA-256
        fca156654bbfa3fd0839576454cbd184c074d08ef0882b31c54bde65258232f9 in BOTH
        its dispatch queue and its ledger receipt, and EV-SIG-009/EV-SIG-010 are
        named in CORR-20260731-005 also_reissued. Consistent with the same
        authorized remap as ICEX rather than with silent drift. Stated as
        consistency, not as proof: no git command was run.
  class_assessment: >-
    The dossier proposes one systemic class of four instances. On this session's
    verification that grouping is not supported for the two instances checked.
    ICEX and SIG both trace to ONE documented event - the CORR-20260731-005
    merge-collision remap - and are better described as a single correction
    whose downstream receipts were never reissued, than as two independent
    drifts. GOAL-FAEST-001 sub-class (A), "wrong sha recorded", was NOT checked
    by this session and is neither confirmed nor denied here. AES-001
    TASK-20260801-808 and MCE-001 C-2 were NOT checked by this session. The
    honest statement available on the evidence gathered is: one documented
    ID-remap event with unreissued receipts (ICEX, and consistent with SIG), and
    one unchecked distinct signature (FAEST). "Four confirmed instances across
    four goals - a systemic pattern" is not established by anything this
    correction verified.
  not_corrected:
    - >-
      ledger/goals/GOAL-ICEX-001.yaml is not edited. status stays active,
      current_batch_id stays BATCH-001, dispatch_queue_path is unchanged, and
      the single next_action is preserved verbatim.
    - >-
      The BATCH-001 dispatch queue's declared record IDs and paths are not
      edited. The queue stays unrenderable until a superseding record repairs it
      properly; editing declared IDs after a binding write is the act that
      creates this defect class.
    - >-
      No existing archive, receipt, evidence, decision or correction record is
      edited or overwritten.
    - >-
      No commit was made. All files written by this session are left in the
      working tree.
  evidence_artifacts:
    - ledger/goals/GOAL-ICEX-001.yaml
    - ledger/evidence/EV-ICEX-001.yaml
    - ledger/decisions/DEC-20260731-015.yaml
    - ledger/decisions/DEC-20260731-014.yaml
    - ledger/decisions/DEC-20260731-013.yaml
    - ledger/decisions/DEC-20260731-003.yaml
    - ledger/decisions/DEC-20260802-a51c82.yaml
    - ledger/corrections/CORR-20260731-005.yaml
    - coordination/goals/GOAL-ICEX-001/batches/BATCH-001/dispatch_queue.json
    - coordination/goals/GOAL-ICEX-001/batches/BATCH-001/archives/TASK-20260731-024/ledger-receipt.json
    - coordination/goals/GOAL-ICEX-001/batches/BATCH-641950/SCOPE-DECISION.md
    - coordination/goals/GOAL-SIG-001/batches/BATCH-002/dispatch_queue.json
    - coordination/goals/GOAL-SIG-001/batches/BATCH-002/archives/TASK-20260725-712/ledger-receipt.json
    - tools/research_dispatch.py
    - tools/allocate_id.py
    - ICEX-DOSSIER-READ-ME-FIRST.md
  supersedes_decision: DEC-20260819-3fb8a2
  decided_by: coordinator
  id_provenance:
    minted_by_tool: false
    tool: tools/allocate_id.py
    reason_tool_not_run: >-
      This Coordinator subagent session has no shell or Bash tool. It could not
      execute "python3 tools/allocate_id.py --next correction --date 20260819"
      or "--check", and under AGENTS.md rule 5 it will not report a command it
      did not run.
    substitute_procedure: >-
      tools/allocate_id.py random_token draws a 6-hex suffix from
      random.SystemRandom over "0123456789abcdef" and, in its own words, "NO
      STATE IS SCANNED, WHICH IS THE ENTIRE POINT" - so any 6-hex token is an
      admissible draw and the only substantive requirement is that it be unused.
      The token 7c4e19 was drawn by this session and the --check equivalent was
      performed with the Grep tool - pattern "CORR-20260819-7c4e19|DEC-20260819-3fb8a2"
      over the whole worktree, 0 matches - together with a broader pattern
      "7c4e19|3fb8a2|CORR-20260819|DEC-20260819" whose only 4 hits were hex
      substrings inside JSON manifests and per-arm binding files, none of them
      identifiers.
    verification_owed: >-
      The driving session should run "python3 tools/allocate_id.py --check
      CORR-20260819-7c4e19" before this record is committed. If it collides,
      this record is reissued under a fresh token; its content is unaffected.
