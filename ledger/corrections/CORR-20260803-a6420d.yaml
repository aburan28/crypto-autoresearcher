correction:
  id: CORR-20260803-a6420d
  recorded_at: '2026-08-03'
  record_type: false_precondition_in_a_committed_decision
  record_id: DEC-20260803-155a86
  field: preconditions_verified
  recorded_by_task: TASK-20260803-30e21a
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-038
  supersedes_nothing: true

  what_the_decision_asserts: >-
    DEC-20260803-155a86.preconditions_verified states "tools/check_merge_hygiene.py
    PASSES on the batch-opening tree."
  what_was_true: >-
    FALSE at commit d1b6952c, the batch-opening snapshot that decision was
    committed in. ledger/corrections/CORR-20260803-a1c41e.yaml was committed
    UNPARSEABLE - an unquoted colon-space in a plain YAML scalar at line 54 -
    so check_merge_hygiene.py FAILED on that tree.

  root_cause: >-
    The Coordinator ran check_merge_hygiene.py BEFORE `git add`, while the file
    was still untracked. The tool inspects the files a branch touched, so an
    untracked file is invisible to it and it reported PASS. The gate was not
    defective; it was run at the wrong moment. Correct order is stage, then
    gate.

  aggravating_detail: >-
    The defect was an unquoted colon-space in a plain scalar - EXACTLY the class
    the same batch's SCOPE-DECISION documents in five upstream records. The
    Coordinator reproduced the bug while documenting it.

  who_caught_it: >-
    The Executor of TASK-20260803-fa7476, which found the unparseable file at
    HEAD, correctly refused to touch a path outside its write scope, and
    reported it. The review chain worked on the Coordinator's own output.

  what_was_repaired_and_what_was_not:
    repaired_in_b72b120a: >-
      The unparseable record itself (punctuation on four lines, no assertion
      altered) and the batch INPUT-CAPSULE's identical false claim, corrected in
      place with the correction marked.
    NOT_repaired_and_why_this_record_exists: >-
      The same false assertion also sits in DEC-20260803-155a86.preconditions_verified,
      a committed ledger decision that may NOT be edited under AGENTS.md core
      rule 4. The Coordinator repaired the cheap instances and left the binding
      one. Found by RT-20260803-51fb7d, which named this as the larger defect
      going unflagged. This correction is the required remedy.

  standing_of_the_decision: >-
    DEC-20260803-155a86 STANDS. Its authorization holding was independently
    ruled SUFFICIENT by RT-20260803-51fb7d. Only the quoted precondition is
    false, and it was not load-bearing for the authorization: the tree defect
    was a YAML syntax error in a correction record, not a defect of the frozen
    contract, the freeze receipt, or the hypothesis binding, all three of which
    were and remain verified.

  claim_ceiling: >-
    Records a false precondition. No cost saving, no exponent, no crypto-scale
    claim, no hypothesis status change follows.
