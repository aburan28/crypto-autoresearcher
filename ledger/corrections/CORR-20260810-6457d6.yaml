  corrected_value: >-
    FOUR OF THE FIVE DECLARED DIGESTS DO NOT MATCH THE BYTES AT THEIR OWN
    DECLARED PATHS. Established this session by direct hash comparison against
    the working tree at the branch point above. Actual values are recorded as
    their LEADING 16 HEX CHARACTERS, which is what the comparison produced and
    carried into this record; the remaining characters were not carried and are
    NOT guessed (AGENTS.md rule 5).

    (1) .../tasks/TASK-20260731-026/red_team_report.yaml - declared
    c6d06ab2cec25840..., actual 77e9b87825805678... MISMATCH.
    (2) .../tasks/TASK-20260731-026/falsification_review.md - declared
    e216f781c07fad36..., actual 6f3c3e4b294951c2... MISMATCH.
    (3) ledger/decisions/DEC-20260731-014.yaml - declared 6093f111...,
    actual 20f9353438399a7c... MISMATCH.
    (4) ledger/goals/GOAL-DREG-001.yaml - declared b5bebf73...,
    actual fede43493a999cf5... MISMATCH.
    (5) ledger/evidence/EV-DREG-008.yaml - declared
    8b1a9985399a565d2635848a2cad8708f4ddcb22d1f4c4d9be3f3d2a852cc49f, and the
    committed file MATCHES it exactly. This is the ONLY declared path in the
    receipt whose digest still binds.

    CAUSE OF (1) AND (2), ESTABLISHED FROM GIT HISTORY. Merge commit b1dfd9865
    ("merge origin/main into cursor/ecdlp-tier-path-goals; remap colliding
    ledger IDs"), whose parent is e0838e844, REMAPPED the BATCH-005 task
    identifiers: TASK-20260731-011 to -016, -012 to -025, -013 to -026, -014 to
    -027. That merge rewrote the receipt's path KEYS to the new identifiers, and
    rewrote identifier references inside the artifacts themselves, while leaving
    the OLD (pre-remap) content digests in place as the declared values.

    PROOF THAT THE DECLARED DIGESTS ARE PRE-REMAP RATHER THAN CORRUPT, AND THAT
    THE ARTIFACTS ARE AUTHENTIC. At the parent commit e0838e844 the files
    coordination/goals/GOAL-DREG-001/batches/BATCH-005/tasks/TASK-20260731-013/falsification_review.md
    and
    coordination/goals/GOAL-DREG-001/batches/BATCH-005/tasks/TASK-20260731-013/red_team_report.yaml
    hash to e216f781c07fad36... and c6d06ab2cec25840... respectively - EXACTLY
    the values the receipt declares. The declared digests therefore describe
    real, committed, pre-remap bytes at the pre-remap paths. What broke is the
    receipt's PATH-TO-DIGEST BINDING, not the artifacts. Corroborating this
    independently of git: EV-DREG-008's own observations cite the red team as
    "RT-20260731-013", the pre-remap identifier, and the red team report's own
    id field is RT-20260731-013 while its task_id field carries the post-remap
    TASK-20260731-026.

    (3) AND (4) ARE NOT ATTRIBUTED TO THE REMAP AND EACH HAS ITS OWN ACCOUNT,
    STATED SEPARATELY SO THAT NOTHING IS OVERCLAIMED.
    For (3): ledger/decisions/DEC-20260731-014.yaml today is a GOAL-ECDLP-001 /
    BATCH-021 approve decision belonging to ANOTHER campaign - an identifier
    collision, recorded and handled by DEC-20260810-d4a0a4, which supersedes the
    receipt's reference to that id and mints the GOAL-DREG-001 BATCH-005
    decision under a fresh random-suffix id. This correction establishes only
    that the declared digest does not match the bytes now at that path; it does
    NOT establish what content the declared digest corresponded to, and does not
    guess.
    For (4): ledger/goals/GOAL-DREG-001.yaml is the one record in this set whose
    bookkeeping fields are legitimately mutable, and it has been edited since
    2026-07-31 by later sessions - the record itself carries a
    head_correction_20260810 block attributing one such edit to
    TASK-20260810-2b1c3b. Its digest therefore necessarily moved for ordinary
    reasons, and moves again with the BATCH-004/BATCH-005 checkpoint append made
    alongside this correction. No wrongdoing is implied by (4); it is recorded
    because the receipt asserts a digest that a mutable record cannot keep.

    CONSEQUENCE, WHICH IS THE OPERATIVE POINT OF THIS RECORD. The BATCH-005
    ledger archive receipt carries commit_sha null and verification.status
    "pending_post_commit", and it can NEVER be content-verified at its declared
    paths: the bytes that would satisfy four of its five declarations no longer
    live at those paths and cannot be put back without editing immutable
    artifacts. The archive is therefore PERMANENTLY UNVERIFIABLE AS WRITTEN.
    Under CLAUDE.md's "archive receipts bind to CONTENT first", a content
    mismatch is fatal to that receipt's verification; it is not fatal to the
    artifacts, which verify on their own terms.

  reason: >-
    THIS IS A PROVENANCE AND BOOKKEEPING CORRECTION. IT IS NOT A FINDING THAT
    ANY REVIEW WAS FABRICATED, THAT THE MEASUREMENT IS WRONG, OR THAT
    EV-DREG-008 IS UNRELIABLE. The red team review happened, its bytes are
    committed, and its pre-remap digests are exactly what the receipt recorded -
    which is affirmative evidence of authenticity, not doubt about it.
    EV-DREG-008's own digest still matches the receipt, so the batch's evidence
    record binds to its archive without qualification.

    It is recorded because GOAL-DREG-001's next_action item (2) directed the
    Coordinator to "land and verify that ledger archive ... then append the
    BATCH-004 and BATCH-005 checkpoints entries this record still lacks and
    advance latest_verified_commit - in that order, verification before the
    checkpoint". That instruction cannot be carried out as written: the
    verification it makes a precondition is unreachable for this receipt, now
    and permanently. Recording that plainly, and leaving latest_verified_commit
    where it is, is the only honest disposition. Advancing it would assert a
    verification that did not occur (AGENTS.md rule 5); silently skipping the
    advance without saying why would leave a reader unable to tell a considered
    refusal from an oversight.

    Recorded as a CORRECTION rather than as an edit because archive receipts and
    ledger records are immutable (AGENTS.md rule 4). The receipt is NOT edited,
    NOT regenerated, and NOT deleted. This record is the durable gloss that must
    be read alongside it from now on. It is also why AGENTS.md rule 15 says an
    identifier remap is a last resort rather than a repair: renaming records that
    a completed archive names in its binding fields breaks that archive
    permanently, and this receipt is a worked example of exactly that failure.

