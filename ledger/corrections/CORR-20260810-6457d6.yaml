    - >-
      IT DOES NOT ESTABLISH WHAT CONTENT THE DECLARED DIGEST FOR
      ledger/decisions/DEC-20260731-014.yaml CORRESPONDED TO. That was not
      determined and is not guessed.
    - >-
      IT DOES NOT REPAIR THE ARCHIVE AND DOES NOT CLAIM THE BATCH-005 LEDGER
      ARCHIVE IS VERIFIED. It records the opposite: that archive is permanently
      unverifiable at its declared paths.
    - >-
      IT DOES NOT INVALIDATE THE BATCH-005 SNAPSHOT ARCHIVE. The producer
