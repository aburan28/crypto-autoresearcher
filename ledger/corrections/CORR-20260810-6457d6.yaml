    - >-
      IT IS NOT A FINDING OF FABRICATION OR MISCONDUCT. The evidence points the
      other way: the declared digests match real pre-remap bytes at the
      pre-remap paths, which is what an authentic, mechanically-generated
      receipt looks like after its subjects were renamed underneath it.
    - >-
      IT ASSERTS NOTHING ABOUT ANY OTHER CAMPAIGN'S RECORDS. The committed
      ledger/decisions/DEC-20260731-014.yaml is a GOAL-ECDLP-001 / BATCH-021
      decision; it is untouched, unedited, and remains fully valid for its own
