correction:
  id: CORR-20260802-007
  recorded_at: '2026-08-02'
  record_type: schema
  record_id: KNOWLEDGE-CORPUS-SCHEMA-REPAIR-FINDINGS-AND-TAGS
  field: frontmatter_of_seven_findings_and_fiftyone_literature_entries
  reason: >-
    Two long-standing gaps in the knowledge corpus. Seven internal findings
    carried frontmatter keys the schema does not define, so their references
    were never cross-checked and their proof level was never stated. Fifty-one
    literature entries carried `tags: []`, which the corpus treats as missing:
    an untagged entry is invisible to every tag-based retrieval path, so the
    curation was recorded but not usable.
  findings_repaired:
    KN-FIND-002: >-
      Committed as type `finding` with a `source_refs` key. Set to
      internal_finding; source_refs split into internal_refs (ledger records,
      which are cross-checked) and knowledge_refs (KN-* are not ledger ids).
      proof_status `derivation` -- the level this record's own body and
      EV-GGM-001 already state.
    KN-FIND-003, KN-FIND-004, KN-FIND-005, KN-FIND-010, KN-FIND-011: >-
      Committed with `evidence:`/`decision:` keys. Both records are carried in
      internal_refs alongside the hypothesis and experiment the evidence record
      itself names, so nothing is dropped and nothing is inferred. proof_status
      is the conservative `empirical_only`; proof_refs cite the evidence record
      and the experiment's own execution report, analysis and specification.
    KN-FIND-009: >-
      internal_refs carried REF-20260728-002, VAL-20260728-001 and
      RT-20260728-002 -- dispatch-queue review-artifact ids under coordination/,
      not ledger records, so the cross-check could never resolve them. Moved to
      coordination_refs; the reports are already cited by path in proof_refs.
  literature_tagged: >-
    51 entries from the bulk ePrint gathers. Tags are derived from each paper's
    own title and recorded subject matter, preferring terms already in the
    corpus vocabulary (provable-security, foundations, complexity-theory, mpc,
    survey, multilinear-maps, verifiability, leakage, public-key, symmetric,
    implementation, machine-learning, side-channel). New terms were introduced
    only where the corpus had no equivalent, because these entries cover
    obfuscation, functional encryption and MPC/game-theory areas the previously
    ECDLP-centred vocabulary did not reach.
  substantive_delta: >-
    None. No claim, scope, strength, proof level, exponent or verdict asserted
    by any finding body is changed; the repairs restate existing references
    under the field names the schema checks. Tags are retrieval metadata and
    assert nothing about a paper's correctness or relevance.
  status_effects:
    hypothesis_status_changed: false
    note: >-
      These findings now enter reference cross-checking for the first time, so
      genuine reference gaps they always had may surface as new, separately
      recorded findings. That is the point of the repair.
  supersedes: null
  superseded_by: null
