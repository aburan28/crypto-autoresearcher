correction:
  id: CORR-20260802-007
  id_remap_note: >-
    AUTHORED AS CORR-20260802-002 AND REISSUED. The merge of origin/main at
    e7262ace brought main's own CORR-20260802-002, an identifier alias map for
    the PR #92 BATCH-020 collision. Main published that ID first, so under
    first-author-owns-the-ID it keeps it and this record is reissued at the
    next free number. No content changed apart from the identifier. This is the
    THIRD ID collision this campaign has hit with main and it is the same
    defect each time: ID allocation by local directory scan is not
    concurrency-safe (KN-FIND-030).
  recorded_at: 2026-08-02
  record_type: claim
  record_id: TASK-20260802-903
  field: results.r5_residue and controls_NOT_run
  prior_value: >-
    Receipt TASK-20260802-903 assigned the r=5 mod-8 residue claim tier
    `analyzed`, justified it by "a residue mod 8 read on a small number of
    trials has a 1-in-8 per-trial probability under the uniform null", and
    listed "MATCHED RANDOM-PERMUTATION NULL on the mod-8 statistic" under
    `controls_NOT_run` with the words "THIS IS THE LOAD-BEARING GAP".
  corrected_value: >-
    Both halves of that statement are wrong against the package's own
    committed data, and they are wrong in OPPOSITE directions, so the receipt
    understated the evidence while also misreporting which control existed.
    (1) THE ARM COUNT. count5/results_summary.json records the aes_r5 arm at
    trials: 6, with residue_mod8 [0, 0, 0, 0, 0, 0], every trial at the full
    N = 4294967296 coset, status valid, under distinct key schedules. Six
    independent full-coset arms all reading 0 is p = 8^-6 = 3.8e-6 under the
    uniform null, not the 1-in-8 the receipt cited. The 1-in-8 figure is the
    correct reading for a SINGLE trial and was the correct basis for ruling
    the r=6 near-miss a coincidence; carrying it over to the six-arm r=5
    evidence was my error.
    (2) THE CONTROL. A random-permutation-style null WAS run and IS in the
    committed data: arm null_randperm_aes10, r = 10, N = 4294967296, status
    valid, residue_mod8 = 2. A second discriminating null was also run:
    null_sibling_fwd_diag at r = 5, which negates the projection geometry and
    reads residue_mod8 = 2. Listing the control as NOT RUN was false.
    The honest statement of the gap is therefore a POWER gap, not an EXISTENCE
    gap: one null arm at one round count is thin, and the r=10 arm is AES
    rather than an independent permutation family, so it does not fully
    discharge the artifact hypothesis. The claim tier `analyzed` is
    nevertheless RETAINED pending the independent validator (TASK-20260802-907),
    because the arm count that would settle it is a matter for a session that
    did not produce the data.
  reason: >-
    Found by the independent red team (TASK-20260802-908) against the snapshot
    archived at 54ee869b, and confirmed by the Coordinator directly against
    count5/results_summary.json before being recorded. The receipt is immutable
    and is NOT edited; this correction supersedes the two fields named above.
    Recorded in full because an error that UNDERSTATES evidence is the same
    class of defect as one that overstates it: both misreport what the
    measurements say, and a false claim that a control was not run is exactly
    the kind of statement a later batch would act on.
  evidence_artifacts:
    - coordination/goals/GOAL-AES-003/batches/BATCH-001/tasks/count5/results_summary.json
    - coordination/goals/GOAL-AES-003/batches/BATCH-001/tasks/receipts/TASK-20260802-903/receipt.json
    - coordination/goals/GOAL-AES-003/batches/BATCH-001/tasks/TASK-REDTEAM-001/red_team_report.yaml
    - coordination/goals/GOAL-AES-003/batches/BATCH-001/archives/TASK-20260802-906/snapshot-receipt.json
