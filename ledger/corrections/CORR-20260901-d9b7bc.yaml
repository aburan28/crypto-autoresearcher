    run/measurement receipt -- not a `ledger/evidence/` claim record and not a
    run manifest registered in tools/run_supersession_registry.yaml's purview.
    This mechanism (a plain correction record) is the deliberate choice over
    schema-supersession, per this task's card: the schema-supersession
