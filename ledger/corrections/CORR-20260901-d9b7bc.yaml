  record_id: MEAS-TASK-20260810-2a0a37-002
  corrected_record_path: coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/tasks/TASK-20260810-2a0a37/envelope-receipt.json
  field: items.vi_ceiling.value.per_task_14_core_linear_assumed_aes_evals_decimal

  prior_value: 488600000000
  corrected_value: 247770709.76

  reason: >-
    The receipt's own field items.vi_ceiling.value.per_task_14_core_linear_assumed_aes_evals_decimal
    was recorded as 488600000000, which is arithmetically inconsistent with the
    SAME receipt's own correctly-derived log2 figure for the identical
    quantity (items.vi_ceiling.value.per_task_14_core_linear_assumed_log2_aes_evals
    = 27.884; 2^27.884 = 247,770,710, not 488,600,000,000 -- a discrepancy of a
    factor of ~1972, i.e. ~2^10.95). The receipt's own stated derivation basis
    (items.vi_ceiling.basis and .derivation_shown) is "11061.1924 AES-128
    evaluations/s/core (measured, item iv, pure-Python fresh-key throughput,
    cross-checked 4/4 against the openssl CLI) x 1600 s per-task wall-clock
    budget x 14 cores (linear-scaling assumption, NOT measured for any valid
    implementation in this task)". Recomputing that product directly from the
    receipt's own preserved inputs gives 11061.1924 x 1600 x 14 =
    247,770,709.76, which matches the receipt's own log2 figure to the stated
    precision (log2(247770709.76) = 27.884007..., matching the declared
    27.884) and does not match the committed decimal value.

    This defect was located and independently re-derived by the BATCH-2b0fd1
    Validator, VAL-20260831-9fc65d (TASK-20260810-9fc65d), as finding F1
    (validation-report.yaml, section `findings`, id F1, severity MEDIUM; the
    underlying recomputation is recorded in
    `envelope_receipt_rederivation.item_vi_ceiling.fourteen_core_decimal`:
    formula "11061.1924 * 1600 * 14", recomputed 247770709.76, declared
    488600000000, agreement: DISAGREE). This executor independently
    re-performed the same multiplication before authoring this record and
    obtained the identical value, 247,770,709.76, matching the Validator's
    figure to the last decimal digit shown.

    RT-20260831-1166f2 (TASK-20260810-1166f2), the BATCH-2b0fd1 red-team
    report, is named in this record's evidence_artifacts per this task's card,
    and is read in full as part of this batch's package. Disclosed rather than
    silently assumed: RT-20260831-1166f2's own claim_under_review is CM-1 and
    protocol-amendment-GOAL-AES-002-001, not envelope-receipt.json, and its
    text contains no independent recomputation of this field (no occurrence of
    "envelope", "vi_ceiling", "247770709", "488600000000", or "14061.1924" in
    that report). The independent re-derivation and confirmation of this
    specific numeric defect is established by VAL-20260831-9fc65d and by this
    task's own recomputation; it is not separately corroborated by
    RT-20260831-1166f2's own text. This is recorded as a deviation from this
    task's card, which described the fix as confirmed by "BOTH the BATCH-2b0fd1
    red team and validator" -- the available red-team report's reviewed scope
    does not in fact cover this field, and that gap is reported here rather
    than papered over by a citation that would overstate what the named report
    supports.

    This is an arithmetic/instrumentation correction only. It asserts nothing
    about AES at any round count, claims no cryptanalytic result, and changes
    no hypothesis, research-question, experiment, or goal status.

