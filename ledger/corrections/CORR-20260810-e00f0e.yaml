    The entry occurs 0 times at origin/main today.

    `batch_checkpoints` on origin/main today holds 9 entries: BATCH-713991,
    BATCH-014, BATCH-013, BATCH-012, BATCH-011, BATCH-010, BATCH-009,
    BATCH-003, BATCH-001. BATCH-b41ba9 is not among them.

    NO AUTHOR REMOVED IT AND NO DECISION RETIRED IT. Its absence is a merge
    artifact, and any reader who takes the absence as a statement about
    BATCH-b41ba9 -- that it did not happen, was not closed, or was withdrawn --
    is reading a defect as a claim.

  consequence: >-
    THE GOAL RECORD TODAY NARRATES A BATCH IN PROSE WHILE CARRYING NO
    STRUCTURED CHECKPOINT FOR IT. The same merge 232659d3c preserved its own
    PROSE: the `next_action` THIRD-MERGE ADDENDUM naming BATCH-b41ba9 is on
    main. So GOAL-AES-003 simultaneously (a) tells a reader in free text that
    BATCH-b41ba9 executed the identity/affine S-box arm and that a
    SECOND-MERGE-ADDENDUM item is therefore DONE, and (b) offers that reader no
    entry for BATCH-b41ba9 in the one structured list a checkpoint is supposed
    to live in.

    THIS IS DIRECTLY WHY A CONTENTS-ONLY SESSION COULD NOT SETTLE THE HEAD.
    TASK-20260810-2b1c3b (RECON-20260810-002) had no shell and reasoned from
    record contents alone. Under this state, BATCH-b41ba9 is visible as prose
    and as a batch directory but has no checkpoint entry to test against the
    goal's own head convention ("the most recent FULLY VERIFIED checkpoint on
    either lineage"), and the only structured trace of its archive commits --
    the entry commit 8098bb98e wrote, including snapshot commit 74e33ea35 --
    had been removed from the record that session was reading. Its verdict
    UNRESOLVED is a correct report of that state, not a failure of the session.

  recurrence_note: >-
    THIS IS A RECURRENCE OF A DEFECT CLASS THIS GOAL RECORD ALREADY DISCLOSES,
    ON THE SAME FIELD OF THE SAME RECORD. GOAL-AES-003's own
    `current_batch_id_note` describes, for the BATCH-003 backfill, "the
    disclosed environment defect that silently dropped it from this branch's
    FIRST merge of origin/main"; the BATCH-713991 checkpoint's
    `merge_provenance_note` carries the same disclosure. What happened to
    BATCH-003 at the first merge happened to BATCH-b41ba9 at a later merge.

    RECORDED AS A RECURRENCE RATHER THAN AS A FRESH SURPRISE SO THAT A LATER
    SESSION TREATS `research_goal.batch_checkpoints` ON THIS GOAL AS KNOWN
    MERGE-FRAGILE. Two independent instances on one list is the point of this
    record; without it a third session would rediscover the same shape a third
    time. CLAUDE.md's own guidance -- goal checkpoints belong in one file per
    batch under ledger/goals/GOAL-X/checkpoints/, converted by
    tools/shard_goal.py, precisely because appending to a shared YAML list
    conflicts where there is no semantic conflict -- names the structural
    remedy; this correction observes that the remedy has not been applied to
    GOAL-AES-003 and does not itself apply it.

  what_this_correction_does_and_does_not_do: >-
    THIS CORRECTION RECORDS THE DROP. IT DOES NOT RESTORE THE ENTRY.

    research_goal.batch_checkpoints is NOT edited by this act, and no
    BATCH-b41ba9 entry is written back into GOAL-AES-003.yaml here. Restoring
    it is a CONTENT CHANGE TO A HEAVILY CONTENDED SHARED RECORD -- the one
    ledger file many concurrent campaigns write -- and it belongs together with
    the archive-binding repair, because the entry that should be restored is
    incomplete as it stood (its ledger_archive.commit was null even at
    8098bb98e, where the true value 8098bb98e was not yet knowable to the
    commit writing it). Restoring the stale entry alone would reinstate a
    checkpoint that still fails the goal's own verification gate.

    THE RESTORATION IS THEREFORE ASSIGNED TO TASK-20260810-724383, together
    with the superseding content binding for BATCH-b41ba9's two archives. Until
    that task runs, this correction record IS the durable trace of the dropped
    entry, and GOAL-AES-003.batch_checkpoints must be read alongside it.

