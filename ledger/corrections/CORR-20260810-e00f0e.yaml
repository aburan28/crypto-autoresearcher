  corrected_value: >-
    THE ENTRY IS ABSENT FROM 232659d3c ONWARD AND IS ABSENT FROM origin/main
    TODAY, AND A MERGE IS WHAT REMOVED IT.

    Merge commit 232659d3c has parents exactly 350632006 and c6f5d9e9f, and
    subject "merge origin/main: fold BATCH-004..BATCH-015 line; third-merge
    addendum records identity-arm DONE (NO-NONLINEARITY-REQUIRED)". The
