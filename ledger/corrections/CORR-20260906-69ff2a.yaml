    setting the other four sources address). stage0-disposition.md's list
    of sources checked omits KN-LIT-1744 entirely and gives no indication
    it was seen and set aside versus never located.
  corrected_value: >-
    The independently-dispatched red-team review (same report,
    MLKEM-RT2-OBJ-5 detail) itself performed the missing check: it live-fetched
    eprint.iacr.org/2026/155 and confirmed the paper's abstract states the
    MLWE <=> IP-M-EDCP equivalence for power-of-two cyclotomic rings at
    constant module rank (exactly ML-KEM's setting) and a qualitative
    noise-rate-to-extrapolation-parameter dependency, but does NOT provide
    an explicit formula connecting noise rate to an extrapolation parameter
    or faulty-sample rate at the abstract level -- the full paper text
    would be needed for precise equations, and no local copy of that full
    text (PDF or extracted text) exists anywhere in this repository (a
    targeted filesystem search for "2026-155" found nothing, despite
    KN-LIT-1744's own record naming a local-copy path). Given this, the
    "NOT COMPUTED" bottom-line disposition very likely still stands on
    currently available (abstract-only) evidence, and the Executor role's
    own tool surface (no WebFetch/WebSearch/crypto-kb MCP) genuinely cannot
    fetch the full text live. The correction is therefore narrow: the
    disposition's OUTCOME is not disturbed, but its CHARACTERIZATION of the
    search as covering "all... sources... currently available" is corrected
    to: four sources were checked in full; a fifth, specifically relevant,
    already-staged knowledge-base entry (KN-LIT-1744) naming a Module-LWE-specific
    result was not checked at design or execution time, was subsequently
    located and its abstract checked by the independent red-team review
    (result: qualitative relationship confirmed, no explicit formula at
    abstract level, full text unstaged and unfetchable from the Executor's
    tool surface), and remains a candidate resource for a future attempt at
    both this experiment's disclosed open gaps.
  reason: >-
