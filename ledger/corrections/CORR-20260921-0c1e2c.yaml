# Correction record. Pre-merge schema repair on an unmerged PR branch.
# Adds the missing verified_by fields that validate_ledger requires for
# provenance: internal citations. No scientific field is changed.
correction:
  id: CORR-20260921-0c1e2c
  recorded_at: '2026-09-21'
  recorded_by: coordinator
  goal_id: GOAL-SEMBIN-5078bc
  batch_id: BATCH-457504
  produced_by: >-
    Cursor automation reviewing PR #1349 (ready_for_review), which found that
    CI's ledger-and-harness gate failed on two citation schema errors introduced
    by this PR's DEC-20260921-2c62d7 — not on an orthogonal QSP registry debt.
  archived_by: >-
    This session, in its own commit on cursor/semaev-2015-audit-program-5b8b,
    before merge. The decision was already filed and hash-bound; this correction
    documents the additive schema fields and the rebind.
  nature: citation_verified_by_omission_schema_gate

  what_was_broken:
    symptom: >-
      `python3 tools/ci_ledger_gate.py` / validate_ledger reported:
      ledger/decisions/DEC-20260921-2c62d7.yaml citations[0] and citations[1]
      have provenance 'internal' and require verified_by naming the agent that
      read the source.
    consequence: >-
      PR #1349's ledger-and-harness check FAILED with two validation errors
      introduced by this PR. The PR was otherwise MERGEABLE with no path
      conflicts against origin/main.
    what_it_was_NOT: >-
      Not a scientific defect, not a changed transition, not a rewritten
      rationale. The citations' notes already stated that the session opened
      the corpus entry / EV-DREG-008; only the required verified_by field was
      missing. Not the EXP-QSP-33b442 supersession registry failure class.

  root_cause:
    schema_rule: >-
      tools/validate_ledger.check_citations requires verified_by whenever
      provenance is retrieved|kb|internal (recalled is the exception, and is
      forbidden on coordinator decisions). Sibling SEMBIN decisions
      (DEC-20260916-59921c, DEC-20260916-6ce039) already carry verified_by.
    composition_gap: >-
      TASK-20260921-a9f304's decision-draft.yaml filled provenance and a note
      but omitted verified_by. The ledger archive transcribed the draft
      byte-for-byte, so the official record inherited the omission. The
      archiving session's validate_ledger run reported no error naming this
      DEC — either the gate was not exercised on the new file or standing
      debt masked it — and CI's PR-introduced-error comparison caught it.

  what_was_changed:
    paths:
      - ledger/decisions/DEC-20260921-2c62d7.yaml
      - coordination/goals/GOAL-SEMBIN-5078bc/batches/BATCH-457504/TASK-20260921-a9f304/decision-draft.yaml
      - coordination/goals/GOAL-SEMBIN-5078bc/batches/BATCH-457504/archives/TASK-20260921-bd5f2e/ledger-receipt.json
      - coordination/goals/GOAL-SEMBIN-5078bc/batches/BATCH-457504/dispatch_queue.json
      - coordination/goals/GOAL-SEMBIN-5078bc/batches/BATCH-457504/build_queue.py
    prior_value:
      citations_0_and_1: provenance internal with note, no verified_by
      path_sha256_DEC: eda1fa6018a8740933d4fe5c0ccf2cd1164a6a42ccb549da73a711bb86143136
    corrected_value:
      citations_0_verified_by: >-
        coordinator session authoring DEC-20260921-2c62d7 via TASK-20260921-a9f304,
        which opened KN-LIT-fa346d and H-SEMBIN-112e2e's quotation of section 4.4
      citations_1_verified_by: >-
        coordinator session authoring DEC-20260921-2c62d7 via TASK-20260921-a9f304,
        which read ledger/evidence/EV-DREG-008.yaml directly
      path_sha256_DEC: 8394e85d5adb5560ffbd9abf9cb2e4aa18d332f5b8ee6742517b4c66bcfe0957
    why_both_draft_and_official: >-
      The archive's zero-divergence claim rests on draft and official being
      byte-identical. Repairing only the official path would invent a divergence
      the composition never had. Both received the same verified_by text.
    what_was_NOT_edited: >-
      Claim-release files TASK-20260921-a9f304.1.release.json and
      TASK-20260921-bd5f2e.1.release.json retain their pre-repair artifact_sha256
      values as write-once historical testimony of what was released at that
      moment. EV-SEMBIN-c6e9ad, analysis.md, scored-priors, and the scientific
      body of the decision are untouched.
    receipt_disclosure: >-
      ledger-receipt.json gained a post_archive_schema_repair note under
      divergences_from_the_draft naming this CORR; its own path_sha256 in the
      queue was rebound accordingly.

  asserts_nothing_about: >-
    Semaev's Assumption 1 or 2, any d_reg or d_F4 value, GOAL-DREG-001's
    conclusions, any elliptic curve, or the security of any deployed parameter
    set. The inconclusive transition, the unmet completion criterion, and the
    unmoved hypothesis status are unchanged.

  reason: >-
    Pre-merge schema gate repair so PR #1349 does not land a decision the
    ledger validator rejects. Additive verified_by fields only; scientific
    content and claim-release history preserved.
