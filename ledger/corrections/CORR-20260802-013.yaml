correction:
  id: CORR-20260802-013
  recorded_at: '2026-08-02'
  record_type: identifier_alias
  record_id: P13-IDENTIFIER-REISSUE-AND-CONTRACT-NESTING
  field: identifiers of the P13 (Wesolowski 2026) records; EXP-P13VOW-001 contract shape
  reason: >-
    Three records carried digit-bearing area codes, which the identifier
    patterns forbid -- the defect CORR-20260728-001 recorded when
    EXP-RT1476-001 shipped. EXP-P13VOW-001's contract was additionally a FLAT
    mapping with `experiment_id:` at the top level and no `experiment:` key, so
    it never registered and every record citing it reported an unresolved
    reference. CORR-20260802-011 deferred this rename while GOAL-P13-001 was
    dispatching batches; it is carried out here.
  alias_map:
    H-P13-001: H-WESO-001
    EV-P13-001: EV-WESO-001
    EXP-P13VOW-001: EXP-WESOVOW-001
    RUN-P13VOW-001: RUN-WESOVOW-001
  naming: >-
    WESO for the Wesolowski 2026 result the line analyses, WESOVOW for the
    van Oorschot-Wiener middle-memory cost model built on it. The digits
    encoded "paper 13", an internal intake label that the records already carry
    explicitly as frozen_source SRC-P13-WESOLOWSKI-2026, so no information is
    lost.
  not_renamed:
    GOAL-P13-001: >-
      GOAL identifiers have no enforced pattern (the allocator reports CORR,
      GOAL and KN prefixes as "NOT checked"), so this one is not a defect.
      Renaming it would touch 67 files of dispatch state for no validation
      gain. It keeps its identifier and continues to name the campaign.
    SRC-P13-WESOLOWSKI-2026 and inputs/P13-WESOLOWSKI-2026/: >-
      A source label and an input directory, not ledger identifiers. Untouched.
      Verified by count before and after: 67 files naming GOAL-P13-001 and 14
      naming SRC-P13-WESOLOWSKI-2026, unchanged.
  frozen_run_records_keep_the_historical_id:
    what: >-
      The committed run records under EXP-PEC-49c773 and EXP-PEC-6be870, and
      the reproduction archive under coordination/tasks/TASK-20260724-P13-VAL/,
      name the hypothesis by its historical id H-P13-001. THEY ARE NOT EDITED.
    why: >-
      AGENTS.md rule 4 makes a committed run record append-only, and no
      identifier repair outranks that: a run record is the artifact an
      independent party re-derives, so editing one to tidy a reference would
      make it disagree with the archive it was reviewed as. Nothing validates a
      run manifest's hypothesis_id against the ledger, so the reference costs
      no build error either. This alias map is how the historical id stays
      resolvable for a reader of those frozen records.
    scope: >-
      The EXP-PEC-* experiment SPECIFICATIONS are contracts rather than run
      artifacts and were updated to the new id; only files under runs/ and the
      repro archive keep the old one.
  the_p13vow_run_moved_and_is_verified:
    what: >-
      Renaming the experiment moved its committed run directory, which the
      immutability gate correctly refuses on its own.
    how: >-
      Declared in tools/run_id_remaps.yaml. That schema gained an optional
      from_experiment plus an also_substitute list, because a run manifest names
      its own experiment and a run-id-only substitution could not describe this
      move honestly. Both substitutions are verified byte for byte across all
      five files in the directory; a manifest altered by one extra byte is
      rejected, verified by test.
  contract_nesting: >-
    experiments/EXP-WESOVOW-001/specification.yaml is nested under an
    `experiment:` key. Field renames only: experiment_id -> id, state ->
    status, budgets -> budget. version 1 and approved_by coordinator are added
    (AGENTS.md rule 1 permits no other approver). hypothesis_id,
    success_criterion and falsification_criterion are explicit documented nulls
    per CORR-20260802-009 and -011: the contract states it "records
    OBSERVATIONS ONLY; it does not promote, weaken, or reject any hypothesis",
    and its nearest gate, control C1-sanity-paper-pairs, carries a 3-bit
    tolerance and feeds a stopping rule about implementation error rather than
    a verdict. No objective, model definition, scenario, control, metric,
    budget, stopping rule or honesty constraint is added, removed or reworded.
  still_open:
    H-WESO-001.question_id: >-
      No research question exists for this line. source_ref is a paper source
      and GOAL-P13-001 names no RQ, so the field stays reported rather than
      bound to an invented question. Unchanged by this correction.
  substantive_delta: >-
    Identifier substitution and contract nesting only. No measurement,
    parameter, timing, result, claim, direction, strength, claim tier, proof
    status or hypothesis status is created, altered or withdrawn. H-WESO-001
    remains `analyzed` and EV-WESO-001 remains conditional on Heuristic 1.
  status_effects:
    hypothesis_status_changed: false
  supersedes: null
  superseded_by: null
