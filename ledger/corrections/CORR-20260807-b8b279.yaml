correction:
  id: CORR-20260807-b8b279
  recorded_at: '2026-08-07'
  recorded_by: >-
    top-level session, acting on an independent validator review
    (`experiments/_reviews/validator-report-20260807-followups.yaml`, id VAL-20260807-4ce796)
    and an independent red-team review
    (`experiments/_reviews/redteam-report-20260807-followups.yaml`, id RT-20260807-f01b3c).
    Not a Coordinator action; not the AGENTS.md rule-12 review this chain still lacks.
  type: prose_overstatement_and_understated_stakes
  supersedes: []
  corrects:
    - ledger/corrections/CORR-20260807-0021c7.yaml
    - ledger/evidence/EV-HPSC-a23ace.yaml
  record_type: claim
  record_id: CORR-20260807-0021c7

  # ---------------------------------------------------------------- item 1 (validator)
  field: >-
    EV-HPSC-a23ace.yaml OBS-3 and CORR-20260807-0021c7's model-comparison summary,
    "The first three [models] are separated by under 0.002 RMS on seven points"
  prior_value: >-
    Stated as a single bound covering both C_mean and C_max.
  corrected_value: >-
    HOLDS FOR C_MEAN, NOT FOR C_MAX. Independently recomputed by the validator (own
    script, not the repo's) and reproduced here: C_mean RMS spread across log/sqrt-log/
    power = 0.10075 - 0.09926 = 0.00149 (under 0.002, as stated). C_max RMS spread =
    0.14083 - 0.13628 = 0.00455, more than double the stated bound. Every individual RMS
    number in the raw JSON and in EV-HPSC-a23ace is correct and independently
    reproduced; only the single "under 0.002" headline, read as covering both
    statistics, is an overstatement of tightness for C_max. The qualitative conclusion is
    UNCHANGED: three non-constant models remain 1.8-2x closer to each other than to the
    constant model for both statistics, and their 2^256 extrapolations still diverge by
    orders of magnitude regardless of which bound is quoted. Corrected figure: "under
    0.0015 RMS for the mean, under 0.0046 for the max."

  # ---------------------------------------------------------------- items 2-5 (red-team)
  additional_corrections:
    - field: >-
        CORR-20260807-0021c7's attribution: "as do KN-FIND-5c1a03 and KN-FIND-f8c290 when
        they conclude that the yield error term is negligible at crypto scale"
      prior_value: >-
        Attached this specific numeric-negligibility conclusion to both KN-FIND-5c1a03
        and KN-FIND-f8c290.
      corrected_value: >-
        NOT TEXTUALLY SUPPORTED FOR EITHER, AND WITHDRAWN AS STATED. Independently
        re-read by red-team: KN-FIND-5c1a03 is a structural three-way-convergence claim
        (Fourier flatness / Betti-Yield duality / quaternion structure) with no numeric
        yield-error language anywhere. KN-FIND-f8c290 is a toy-scale (p=1009)
        achievability/tightness claim about a complexity CLASS,
        exp(c*sqrt(log N * log log N)), not a crypto-scale numeric assertion. Their cited
        decision records (DEC-20260804-425827, -4f7da7, -bfbb09, -db75bb) were also
        grepped for "negligible|crypto.scale|2^256|2^-110" with zero hits. The sentence
        that DOES say this verbatim ("Yield error O(C^(m-2)*sqrt(m!)/sqrt(N)) is
        negligible at crypto scale") is in KN-FIND-e7a3b1, which CORR-20260807-0021c7
        already lists under its `corrects:` field -- no field on either KN-FIND-5c1a03 or
        KN-FIND-f8c290 was actually altered by that correction, so this fixes only
        overreaching PROSE, not a formal record change.
    - field: >-
        CORR-20260807-0021c7's characterization of its own significance ("may well be
        correct... corpus does not have evidence for it")
      prior_value: >-
        Framed the unresolved functional-form question as a matter of missing evidence
        for a possibly-fine complexity claim.
      corrected_value: >-
        UNDERSTATES THE STAKES; A STRONGER, VERIFIED STRUCTURAL RISK EXISTS. KN-FIND-d4f820's
        own yield-error formula is O(C(p)^(m-2) * B^(m/2) / N^(m/2+1/2)) -- C(p) enters
        raised to the power (m-2), where m is the Semaev arity. The subexponential
        complexity claim KN-FIND-f8c290 asserts, exp(c*sqrt(ln N * ln ln N)), is reached
        by letting m grow with N (intrinsic to how these index-calculus schedules are
        built, not incidental -- the standard choice is m(N) ~ sqrt(ln N / ln ln N)).
        Under a genuine power law C(p) ~ p^epsilon for ANY fixed epsilon > 0, the yield
        term's exponent grows as epsilon*m(N)*ln N ~ epsilon*(ln N)^{3/2}/sqrt(ln ln N),
        which grows strictly faster than the complexity claim's own exponent
        sqrt(ln N * ln ln N) ~ (ln N)^{1/2}*sqrt(ln ln N) -- the RATIO of the two exponents
        diverges as N -> infinity (independently verified here numerically: at
        N = 10^300 the ratio already exceeds 1 for epsilon = 0.01, and grows past 60 by
        N = 10^30000, matching the algebraic prediction that it scales as
        ln N / ln ln N). This is NOT "the yield error is bigger than we'd like at
        2^256" -- it is that, if C(p) genuinely is a power law, the entire
        heuristic-conditional subexponential-complexity claim in KN-FIND-f8c290 may not be
        asymptotically well-posed AT ALL under that schedule, regardless of how small
        epsilon is. Under the log(p) or sqrt(log p) forms this failure mode does not
        arise, which is exactly why the functional-form question (not merely the point
        exponent) is the load-bearing one -- CORR-20260807-0021c7 said this in substance
        but hedged it more softly than the mechanism it itself cites supports.
      verified_independently: >-
        The dominance claim was re-derived and checked numerically by the top-level
        session before this correction was filed (not taken on the red-team report's word
        alone): for m(N) = sqrt(ln N / ln ln N) and epsilon = 0.01, the ratio of the yield
        exponent to the complexity exponent is 0.036 at N=1e3, crosses 1.0 near N=1e300,
        and reaches ~62 by N=1e30000 -- monotonically increasing without bound, consistent
        with the (ln N)^{3/2} versus (ln N)^{1/2} growth-rate comparison. This is
        elementary asymptotic analysis, not a numerical artifact.
    - field: >-
        CORR-20260807-0021c7's model-fitting methodology (undisclosed asymmetry)
      prior_value: >-
        Presented the four-model RMS comparison without noting how each model was fit.
      corrected_value: >-
        THE COMPARISON IS NOT FIT-SYMMETRIC, THOUGH THIS DOES NOT UNDERMINE THE
        CONCLUSION. `hpseudo_scaling.py`'s `compare_models()` fits the power law by
        log-log OLS (minimizing log-space residual) but fits log/sqrt-log/constant by
        linear-space least squares, then reports all four models' RMS in the same linear
        C-space -- comparing a log-space-optimal fit against three linear-space-optimal
        fits is not apples-to-apples. Refitting the power law in linear space (e.g.
        nonlinear least squares) would very likely tighten its RMS further and REINFORCE
        indistinguishability from the other models, not undermine it, so this does not
        threaten the qualitative "these models are not separated" conclusion -- but the
        correction should have disclosed the asymmetry rather than presenting the 0.002/
        0.0046 figures as a clean, symmetric comparison.
    - field: CORR-20260807-0021c7's evidentiary basis (missing control)
      prior_value: >-
        Argued the four-model comparison shows the toy-scale data cannot resolve C(p)'s
        functional form, without a control confirming the pipeline COULD resolve a known
        form if one were present.
      corrected_value: >-
        NO RANDOM-MODEL-TRANSFER / NULL-OBJECT CONTROL WAS RUN. F_t = {P : x(P) < t} is a
        coordinate-structured, non-random subset of Z/N, not a genuinely random one --
        the same non-algebraic obstruction KN-FIND-e7a3b1's own proof-attempts table
        names. Neither the original measurement nor this correction runs the identical
        four-model pipeline against a truly UNIFORM RANDOM B-subset of Z/N (independent
        of curve arithmetic) at the same seven (p,B) pairs, to confirm the pipeline
        recovers the textbook sqrt(B log N) law when that IS the ground truth -- rather
        than failing to discriminate anything at this range regardless of what generates
        the data. Recorded as an unmet control, not run here; the concrete next step is
        named below.

  reason: >-
    Two independent reviews of the same correction found five distinct, real issues
    within it -- an overstated precision claim, an unsupported attribution, an
    understated risk with a verifiable derivation behind it, an undisclosed fitting
    asymmetry, and a missing control. None of the five contradicts the correction's core
    finding (the recorded exponent 0.079 is not reproduced, and the functional form of
    C(p) is not determined by toy-scale data); all five sharpen or qualify it. Recording
    them together, rather than letting either review's findings sit unintegrated,
    completes the loop this session's decision to commission independent review was for.

