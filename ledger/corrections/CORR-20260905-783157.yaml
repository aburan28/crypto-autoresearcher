  finding_1_the_coordinators_own_3x_redundancy_defect: >-
    EXP-MONO-d4840b's own frozen specification declared a root-pair
    enumeration order (r1 ascending, then r2 ascending, r1<r2, with
    r3=-(r1+r2) forced) intended to visit each Z=3 curve's own (A,B)
    exactly once. This is WRONG: because a short-Weierstrass cubic's
    three roots always sum to zero, for ANY genuine curve with distinct
    roots {ra,rb,rc}, EACH of its own three unordered sub-pairs
    ({ra,rb},{ra,rc},{rb,rc}) independently derives the SAME third root
    (since ra+rb+rc=0 forces r3=-(r1+r2)=the remaining root regardless
    of which two are chosen) and hence computes the IDENTICAL (A,B).
    The declared enumeration therefore visits every genuine curve
    EXACTLY THREE TIMES, not once. This is confirmed exactly by
    RUN-MONO-d4840b-1's own data: candidates_examined_total (6,149,265)
    / 3 = 2,049,755.0 exactly. The Coordinator independently re-derived
    this from the root-sum-to-zero identity (not merely accepted the
    Executor's own claim) and confirms it is a necessary mathematical
    consequence of the chosen parameterization, not an implementation
    bug. Effect: the specification's own anticipated speedup did not
    materialize -- corrected throughput analysis (in
    execution_report.yaml) shows this run's own DISTINCT-curve
    throughput (2,380/sec) is approximately 1.75x SLOWER than
    EXP-MONO-8ec0e5's own prior fast-splitting-test attempt
    (4,154/sec), not faster.

  finding_2_CANDIDATE_not_yet_verified_the_qualifying_filter_may_be_mathematically_unsatisfiable: >-
    THIS IS A FLAGGED CANDIDATE FINDING, NOT YET ACCEPTED AS ESTABLISHED
    -- see the companion review-plan handoff for the required
    independent verification before any decision record treats this as
    fact. The Coordinator's own case analysis of
    `h_pair_from_characters`'s exact logic (the already-validated
    character-classification function used throughout this sub-thread)
    suggests that, for a Z=3 curve, the achievable (h_+, h_-) pairs are
    STRICTLY LIMITED by p mod 4:
      p ≡ 1 (mod 4): (h_+, h_-) ∈ {(0,1), (0,3), (1,0), (3,0)} -- h_+
        and h_- are NEVER both nonzero simultaneously.
      p ≡ 3 (mod 4): (h_+, h_-) ∈ {(0,0), (1,1)} -- the ONLY way both
        are nonzero is EXACTLY (1,1).
    If this is correct, then "h_+ >= 1 AND h_- >= 1 AND
    max(h_+,h_-) >= 2" is UNSATISFIABLE FOR EVERY PRIME: under p≡1mod4,
    h_+ and h_- can never both be >=1; under p≡3mod4, the only way both
    are >=1 is (1,1), whose max is 1, failing the >=2 requirement. This
    would fully and rigorously explain why THREE independent, correctly
    implemented, independently-audited search algorithms
    (EXP-MONO-8ec0e5 x2, EXP-MONO-d4840b) found ZERO qualifying curves
    after examining tens of millions of genuine Z=3 candidates -- not
    because the target is rare, but because it does not exist.
    CROSS-CHECK AGAINST EVERY (h_+,h_-) PAIR OBSERVED IN THIS ENTIRE
    SESSION: (0,1) at p=101 (EXP-MONO-4e6faa, 101≡1mod4: matches the
    p≡1mod4 achievable set); (0,3) at p=101 (EXP-MONO-ee06e2: matches);
    (1,1) at p=103 (EXP-MONO-98abb2/EXP-MONO-8ec0e5's own coincidence
    point, 103≡3mod4: matches EXACTLY the unique p≡3mod4 nonzero-both
    case). EVERY SINGLE OBSERVED DATA POINT IN THIS SESSION IS CONSISTENT
    WITH THIS DERIVED ACHIEVABLE SET, with no counterexample found.

  who_is_flagging_this: >-
    The Coordinator, prompted by the dispatched Executor's own final
    report noting (without full derivation) that "h_+ + h_- <= 3 always"
    and that only (h_+,h_-)=(1,2) or (2,1) could satisfy the filter --
    a claim the Coordinator found to be ITSELF incomplete or possibly
    incorrect (h_+, h_- individually take values only in {0,1,3} per a
    separate, already-established #E(F_p)[4]-group-structure argument
    used throughout this sub-thread, meaning 2 is not an achievable
    individual value at all) and worked out independently via direct
    case analysis of the three-point character classification, arriving
    at the STRICTER, p-mod-4-dependent achievable sets stated above,
    confirmed by an independent exhaustive computer enumeration of all
    8 sign patterns for each residue class.

  disposition: >-
    NONE OF EXP-MONO-d4840b's, EXP-MONO-8ec0e5's, or any prior run's own
    archived numbers are affected or re-scored by this correction --
    finding_2 above is offered as an EXPLANATION for the pattern of
    resource_exhaustions and near-misses already observed, not a new
    measurement. Finding_1 (the redundancy) is accepted in full as an
    established design defect. Finding_2 (the unsatisfiability
    candidate) is NOT YET accepted or acted upon as established fact --
    see the companion review-plan handoff (dispatched alongside this
    correction) for the required independent, from-scratch verification.
    If confirmed, this would mean H-MONO-dd666a's own search-based test
    design was pursuing a genuinely unreachable object from the start,
    and CORR-20260904-b9f9c1's own "necessary and sufficient" analysis
    of the max(h_+,h_-)>=2 condition -- while correct on its own narrow
    terms (that condition IS necessary and sufficient to avoid the
    D_sum=D_prod coincidence, GIVEN that a curve with both h_+,h_->=1 and
    max>=2 exists) -- never checked whether such a curve exists at all.

  next_action: >-
    URGENT, HIGH PRIORITY: independent Validator + Red Team verification
    of finding_2 (see companion review-plan handoff), specifically: (a)
    an independent, blind re-derivation of the achievable (h_+,h_-) sets
