correction:
  id: CORR-20260916-4f842d
  recorded_at: '2026-09-16'
  record_type: literature
  record_id: KN-LIT-7605
  field: key_claims_and_bibliographic_fields
  prior_value:
    authors: '[] (empty; record discloses they were not established)'
    year: 'null (empty; record discloses it was not established)'
    key_claim_1: >-
      The last fall degree is bounded independently of n, the field extension
      degree. The complexity measure therefore does not grow with system size.
    key_claim_2: >-
      Bounded-fall-degree results are stated for summation-polynomial systems
      over F_2 specifically.
  corrected_value:
    authors: '["Huang, Ming-Deh"]'
    year: 2021
    key_claim_1: >-
      NOT SUPPORTED BY THE SOURCE ABSTRACT. arXiv:2103.07282 proves a theorem
      RELATING the last fall degrees of F_1 and F'_1, where F' is the Weil
      descent of F over a subfield, for systems NOT necessarily of dimension
      zero. The abstract asserts no independence from the extension degree n.
    key_claim_2: >-
      NOT SUPPORTED BY THE SOURCE ABSTRACT. Summation polynomials and Semaev
      polynomials are not named anywhere in the abstract. The application the
      abstract names is upper bounds on the last fall degree of F'_1 in the
      case where F is a set of LINEARIZED polynomials.
  reason: >-
    KN-LIT-7605 discloses that its full text was not read, that its claims came
    from "a fetched summary of the PDF", and that authors, year and venue were
    not established. The discrepancy was surfaced during the RQ-DREG-bd6c86
    ideation batch and then verified independently at the top level by fetching
    https://arxiv.org/abs/2103.07282 on 2026-09-16 and reading the abstract
    verbatim. The title in KN-LIT-7605 is correct; the bibliographic fields are
    fillable; the two key claims are not what the source says.

    This is load-bearing rather than cosmetic. KN-LIT-7605 is cited in this
    corpus as "direct prior art for KN-FIND-006" and as establishing IN PROVED
    FORM what KN-FIND-006 reports as a measurement, and KN-LIT-7607 carries a
    standing rule requiring both records before any claim that the deficit is
    bounded in system size. On the corrected reading the corpus has no record
    proving the last fall degree of summation-polynomial systems is bounded in
    n, so KN-FIND-006's measurement is not a numerical corroboration of a
    proved statement and must not be presented as one.

    Per AGENTS.md rule 2 the record is NOT edited and is NOT marked superseded:
    this correction supersedes the two key claims and fills the two empty
    bibliographic fields, and the discrepancy is fully resolvable only by
    reading the 2103.07282 body, which no session has done.
  scope_of_this_correction: >-
    The abstract was read; the BODY WAS NOT. This correction establishes what
    the source abstract does and does not say. It does not assert that the
    body lacks a bound independent of n, nor that summation polynomials are
    absent from the body. A later session that reads the body may narrow or
    overturn this correction additively.
  evidence_artifacts:
    - knowledge/literature/KN-LIT-a2f7b3.md
    - https://arxiv.org/abs/2103.07282
  affects:
    - >-
      KN-FIND-006 framing: its bounded-deficit measurement loses its claimed
      proved-form prior art until the 2103.07282 body is read.
    - >-
      KN-LIT-7607's standing citation rule, whose second required record no
      longer supports the proposition it was required for.
    - >-
      research/THM_SEMAEV_FALL1.md Remark 1 and gap G2, corrected additively in
      that note's own correction section rather than by rewriting the text.
    - >-
      IDEA-20260916-{4b7c1e,9d2fa6,c38e50,71ab94,e6540d} citation blocks, which
      already flag the discrepancy and lean on no claim from KN-LIT-7605.
  decided_by: coordinator
