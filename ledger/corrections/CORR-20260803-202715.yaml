  recorded_at: 2026-08-03
  record_type: claim
  record_id: GOAL-ECDLP-001-BATCH-029
  field: batch identifier occupancy
  prior_value: >-
    This branch opened GOAL-ECDLP-001 BATCH-029 for the EXP-SMTH-e932e8 successor
    work (tasks TASK-20260802-979fae, -e2f66c, -2bf627, -8c84fe, -1839a9, -ee4276,
    -3949e8) and pushed it. Independently and in parallel, another line opened its
    OWN BATCH-029 for the same goal with entirely different tasks
    (TASK-20260802-db286e, -2dbdff, -4ea237, -7ee93d) and reached main first.
  corrected_value: >-
    BATCH-029 HOLDS BOTH LINES, DISTINGUISHED BY TASK ID. This follows the
    precedent CORR-20260802-002 set for BATCH-020, which was likewise left
    unremapped because renumbering it would misdescribe when the work happened.
    The two task sets are DISJOINT, so no artifact collides; the only genuine
    conflict was the batch's living dispatch documents, which cannot both occupy
    one filename.
    RESOLUTION: main's line keeps dispatch_queue.json and its plan files. This
    branch's line is republished as dispatch_queue.smth-e932e8.json with matching
    plan files, named for the experiment it dispatches. Both queues validate under
    research_dispatch.py. No task was renumbered, no artifact moved, and no
    hash-bound path changed.
  reason: >-
    A rename was considered and REFUSED on the repository's own stated grounds.
    CLAUDE.md warns that remapping an id a completed archive names in its binding
    fields breaks that archive permanently, because the commit is immutable and
    its declared path set can never again agree with the live tree. This line's
    BATCH-029 snapshot receipt binds nine paths under BATCH-029/ by sha256 and is
    pushed. Moving them to BATCH-030 would have destroyed that binding to satisfy
    a numbering convention, when the numbering carries no research meaning and the
    task ids already disambiguate.
    THIS IS THE FIFTH IDENTIFIER COLLISION THIS SESSION and the first at BATCH
    granularity rather than record granularity. The earlier four were record ids
    remapped under first-author-owns-the-id. Batch directories are different in
    kind: they are PATHS, and paths are what archives bind. The allocator repair
    in main #106 covers record identifiers and does not cover batch numbers, which
    are still chosen by looking at what exists -- the same scan-based method that
    KN-FIND-030 recorded as not concurrency-safe. That gap is now demonstrated
    rather than theorised.
  evidence_artifacts:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-029/dispatch_queue.json
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-029/dispatch_queue.smth-e932e8.json
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-029/archives/TASK-20260802-8c84fe/snapshot-receipt.json
    - ledger/corrections/CORR-20260802-002.yaml
  supersedes: null
  superseded_by: null
