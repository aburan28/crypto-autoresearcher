  record_id: GOAL-MCE-001
  field: >-
    research_goal.objective -- specifically its closing sentence "A break is not
    an objective and is not expected", together with the framing in the same
    paragraph that the reachable work of this goal is (a) a correctly-scoped
    reading of someone else's attack frontier and (b) a memory-charged ISD
    baseline at Classic McEliece's parameters. The same premise is restated in
    RQ-MCE-e65b3c.claim_tier_ceiling ("The realistic best outcome of this goal
    is a correctly-scoped reading of someone else's attack plus an
    honestly-charged baseline -- not a break"); that record is NOT edited and
    NOT superseded by this correction, which touches only the goal's scoping
    premise and leaves the TOY claim-tier ceiling fully in force.

  prior_value: >-
    From GOAL-MCE-001.objective, verbatim: "Attack Classic McEliece where it is
    actually attackable by this program: not by attempting a break, but by
    determining precisely what the 2026 heuristic subexponential attack
    (KN-LIT-7c4620, iacr:2026/1232) claims, which code families and rates it
    reaches, and how far that regime sits from Classic McEliece's parameters --
    then building a memory-charged ISD baseline at those parameters. The
    deliverable is a correctly-scoped reading of the current attack frontier
    plus an honestly-charged baseline. A break is not an objective and is not
    expected." The operative premise being corrected is the last sentence read
    together with the two-item deliverable framing: that the attack frontier in
    this goal's own target regime is something this program can only READ ABOUT,
    and that nothing in that regime is reachable as work.

  corrected_value: >-
    THAT PREMISE IS NO LONGER SUPPORTABLE AS WRITTEN, AND THE GOAL'S SCOPE MUST
    BE REOPENED ACCORDINGLY.

    A third party now claims a PROVABLE quasipolynomial-time distinguisher for
    Goppa--McEliece in the ASYMPTOTIC "CLASSIC McELIECE" REGIME -- extension
    degree m = Theta(log n), Goppa degree t = Theta(n/log n), public-code
    dimension k = Theta(n), running time n^O(log n), advantage 1-o(1) --
    together with a heuristic n^O(log n) ciphertext-decryption (message
    recovery) extension. That is iacr:2026/1630, filed in this corpus as
    KN-LIT-7baf07. The regime named is this goal's own target, not an adjacent
    one: KN-LIT-7baf07's "Position relative to what this program already filed"
    section records the reading that the filed distinguisher line
    (KN-LIT-13a01d, superseded on tags by KN-LIT-3c9f21) is confined to HIGH
    RATE, whereas the relayed asymptotics here give redundancy n-k = m*t =
    Theta(n) and therefore a rate bounded away from 1 -- a different regime,
    which is exactly why the filed line does not already cover the claim.

    THE CORRECTED SCOPE. GOAL-MCE-001's scope is reopened to include ASSESSING
    AND INDEPENDENTLY REPRODUCING A DISTINGUISHER IN THAT REGIME: acquiring and
    reading iacr:2026/1630's primary text, stating what it actually claims and
    on what heuristics, and establishing this program's own baseline and null
    controls for distinguishing statistics at the ISO-scoped Classic McEliece
    parameter sets. "A break is not an objective and is not expected" survives
    only in the narrow sense that THIS PROGRAM still does not set out to break
    Classic McEliece and still expects not to; it does NOT survive as the
    premise that the reachable work in this regime is confined to reading
    someone else's frontier.

    WHAT THE CORRECTED SCOPE IS NOT. It is not a claim that a break exists, that
    2026/1630 is correct, or that Classic McEliece is weakened. A
    quasipolynomial distinguisher whose own authors call its concrete estimates
    "not yet practical" is not a practical break of any deployed parameter set,
    and no record of this program may report it as one.

  reason: >-
    THIS IS A REVISIT CONDITION FIRING, NOT A FINDING THAT THE ORIGINAL SCOPING
    WAS MADE IN BAD FAITH.

    AGENTS.md "Research-direction integrity and auditability" (rule 9 in
    CLAUDE.md's summary) permits deprioritizing a lead only when the record
    names its evidence, budget, test boundary, remaining uncertainty, and A
    CONCRETE SUCCESSOR OR REVISIT CONDITION. GOAL-MCE-001 did that: it declined
    to pursue a break, said why (the corpus was broad and unread, the primary
    target's text was unobtained, the claim-tier ceiling is TOY), and scoped the
    reachable deliverable to frontier-reading plus a charged baseline. That was
    a DEFENSIBLE BET on the state of the field as of 2026-08-03, made with its
    reasoning written down, and this correction does not withdraw the reasoning
    or impugn the session that made it.

    An external result has now moved the state that bet was placed against. The
    revisit condition implicit in "a break is not expected" is precisely
    "unless somebody publishes an attack in this regime", and on 2026-08-10
    somebody claims to have. Recording the premise as superseded is what rule 9
    requires when that happens; leaving the objective's dismissal-side sentence
    standing unqualified, while a claimed distinguisher in the goal's own target
    regime sits in the corpus, would be the steering failure rule 9 exists to
    prevent. This is the same class of hazard GOAL-MCE-001's own known_hazards
    records four times over: a defensible statement carried forward past the
    point where it was still true.

    Recorded as a CORRECTION rather than as an edit because ledger records are
    immutable (AGENTS.md rule 4): GOAL-MCE-001.objective is NOT rewritten. The
    goal's mutable next_action is separately updated by DEC-20260810-4eae48 to
    carry the new lane alongside the fix DEC-20260809-769359 already required;
    the objective text itself must be read only alongside this correction from
    now on.

  what_this_does_not_establish:
    - >-
      IT ASSERTS NOTHING ABOUT WHETHER iacr:2026/1630 IS CORRECT. This program
      has not read the paper. Its full text was not obtained (three recorded
      fetch failures; see KN-LIT-7baf07's citation_verified_note) and the
      abstract this correction relies on is a TOOL RELAY through a summarizing
      model, not a transcription this program can re-verify.
    - >-
      It establishes nothing about Classic McEliece's security in either
      direction, and in particular does not establish that any deployed or
      standardized parameter set is weakened. "Quasipolynomial" is
      superpolynomial and the relayed abstract's own concrete estimates are
      "not yet practical".
    - >-
      It changes NO hypothesis status. GOAL-MCE-001.active_hypothesis_ids stays
      EMPTY (there is nothing to move) and no hypothesis record is created,
      touched, or implied.
    - >-
      It files NO evidence. No EV-* record exists for 2026/1630 and none may be
      synthesised from an abstract; KN-LIT-7baf07 is a literature entry whose
      CITATION ONLY is verified.
    - >-
      It moves NO claim tier. RQ-MCE-e65b3c's TOY ceiling is untouched and is
      not relaxed by this correction or by anything downstream of it.
    - >-
      It does not establish that the filed distinguisher line is wrong,
      incomplete, or superseded. KN-LIT-13a01d/KN-LIT-3c9f21 remain a correct
      high-rate result and KN-LIT-c41d8b remains a correct generic-alternant
      result with its own qualified, conjectured-to-fall Goppa exclusion.
    - >-
      It does not establish any relationship between iacr:2026/1630 and
      iacr:2026/1232 (KN-LIT-7c4620). Both are unread by this program; whether
      either bears on the other is unknown and is not guessed at.
    - >-
      It does not retire, pause, or reprioritise GOAL-MCE-001's existing
      completion criteria. They stand as written; the correction ADDS scope
      rather than replacing it.

