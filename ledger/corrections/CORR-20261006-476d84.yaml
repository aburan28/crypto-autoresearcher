  record_id: "REVIEW-SSI-EVALUATOR-20261006-9b6db4"
  also_affects:
    - "TASK-20261006-7c9a40"
    - "BATCH-bad7f5"
  field: "joint-label and review-attestation serialization"
  prior_value: >-
    The immutable BATCH-bad7f5 plan stores `joint:` as prose beginning after
    the labels kept separately in `id:`. The checker reads `joint:` first, so
    the original J1/J2 attestations cannot claim those prose labels. The blind
    attestation uses `canonical_verdicts`, and the red attestation uses
    `review_id`, `jurisdiction`, and PASS/FAIL. The raw checker therefore emits
    exactly eight failures and the composer writes nothing.
  corrected_value: >-
    BATCH-6f7b59 uses a new standalone review plan whose five `joint:` values
    begin literally `J1 --` through `J5 --`. Fresh attestations carry top-level
    `review_attestation.task_id`, `joints_owned`, `sources_read`, and `verdicts`
    keyed by J1--J5 with only lowercase `holds`, `breaks`, or `inconclusive`.
    The fresh composer runs the unmodified checker with `--no-addenda` and no
    metadata projection, repair, or original-verdict import.
  reason: >-
    Immutable historical records cannot be edited to make a past round appear
    compliant. As in CORR-20261005-9cc4c3/BATCH-65a9e0, a fresh plan and fresh
    independent reports are the smallest honest correction.
  temporal_independence_limit: >-
    The original outputs already exist and are known to the Coordinator. Fresh
    fork-none reviewers are mutually blind and forbidden from reading those
    outputs, but the correction cannot recreate the earlier time boundary or
    count as additional scientific corroboration merely because it repeats the
    joint coverage.
  evidence_artifacts:
    - "coordination/goals/GOAL-SSI-2fa82a/batches/BATCH-bad7f5/claims/TASK-20261006-7c9a40.1.release.json"
    - "coordination/design/TASK-20261006-9b6db4/reviews/TASK-20261006-a9050f/review-attestation.yaml"
    - "coordination/design/TASK-20261006-9b6db4/reviews/TASK-20261006-7f90d3/review-attestation.yaml"
    - "tools/check_review_independence.py"
    - "ledger/corrections/CORR-20261005-9cc4c3.yaml"
  scope_note: >-
    Procedure and serialization only. No original statement, source reading,
    derivation, verdict, or review is changed, repaired, inherited, invalidated,
    or treated as composed. The failed composer release remains authoritative
    history, and the eventual archive preserves all seven original files.
