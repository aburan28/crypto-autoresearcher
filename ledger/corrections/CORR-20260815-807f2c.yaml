correction:
  id: CORR-20260815-807f2c
  recorded_at: '2026-08-15'
  record_type: claim
  record_type_note: >-
    "claim" is the closest permitted token (record_type: candidate | claim |
    run per templates/research-records.md), following CORR-20260724-001,
    CORR-20260802-a1f151 and CORR-20260815-092c9f precedent. The corrected
    artifact is a numeric batch-accounting figure asserted in committed,
    immutable goal and checkpoint records, not a candidate or a run. Those
    records are committed and therefore are NOT edited by this correction; it
    supersedes the figure by a new record, per AGENTS.md rule 2 and the
    CLAUDE.md rule that a defect or conflict inside an immutable record is
    never resolved by editing it.

  record_id: GOAL-ECDLP-001
  goal_id: GOAL-ECDLP-001
  corrected_records:
    - ledger/goals/GOAL-ECDLP-001/goal.yaml
    - ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-8c58a3.yaml
  attributed_to: >-
    TASK-20260815-c35910, the BATCH-8c58a3 ledger archive, which moved
    GOAL-ECDLP-001 from active to paused and recorded
    campaign_budget.maximum_batches = 51 as CONSUMED.

  field: >-
    The ordinal characterization of checkpoint BATCH-8c58a3 as the 51st batch
    of GOAL-ECDLP-001, as asserted in the goal record's
    status_note_amendment_20260815_batch8c58a3_close, its campaign_budget
    consumption note, its current_batch_id/next_action blocks, and the
    BATCH-8c58a3 checkpoint that archive committed.

  prior_value: >-
    Quoted from the goal record's next_action as set by TASK-20260815-c35910:
    "this checkpoint, BATCH-8c58a3, is the 51st under a
    one-checkpoint-per-batch reading". On that figure
    campaign_budget.maximum_batches = 51 was recorded CONSUMED and the goal
    was moved active -> paused.

  corrected_value: >-
    The figure 51 is the checkpoint-FILE count on origin/main, not a count of
    distinct batches. The goal's own stated basis is
    "one-checkpoint-per-batch", and that basis is falsified by the BATCH-ef31ab
    pair -- two checkpoint files, BATCH-ef31ab.yaml and
    BATCH-ef31ab-close-20260808.yaml, both carrying internal batch_id
    BATCH-ef31ab, i.e. two files for one batch. On its own stated basis the
    file count therefore overcounts distinct batches by exactly one, making
    BATCH-8c58a3 the 50TH distinct batch on origin/main, not the 51st. After
    the merge of BATCH-a723af there are 51 distinct batches, so under that
    same basis BATCH-a723af is the 51st.

  reason: >-
    The ordinal was read off the number of files in
    ledger/goals/GOAL-ECDLP-001/checkpoints/ and asserted as a batch count
    without checking the one-checkpoint-per-batch premise it was stated to
    rest on. The premise does not hold on the committed tree.

  measured_counts:
    measured_on: >-
      origin/main, GOAL-ECDLP-001, all figures verified this session on
      2026-08-15.
    checkpoint_files: 51
    distinct_filename_derived_batch_ids: 50
    distinct_internal_batch_id_values: 34
    checkpoint_files_with_no_internal_batch_id_field: 16
    checkpoint_files_with_no_internal_batch_id_field_note: >-
      Includes BATCH-8c58a3 itself.
    only_internal_batch_id_appearing_in_two_files: 'BATCH-ef31ab'
    only_internal_batch_id_appearing_in_two_files_note: >-
      Files ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-ef31ab.yaml and
      ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-ef31ab-close-20260808.yaml;
      both carry batch_id BATCH-ef31ab.
    coordination_batch_directories: 149
    coordination_batch_directories_path: >-
      coordination/goals/GOAL-ECDLP-001/batches/
    batch_a723af_presence: >-
      BATCH-a723af is ABSENT from origin/main. It exists only on branch
      claude/ecc-challenge-ideas-gixt3r.

  unreconciled_counting_bases:
    statement: >-
      This is a separate and larger uncertainty than the off-by-one above, and
      this record does NOT resolve it. Four available counting bases disagree
      by roughly a factor of four: 51 checkpoint files, 50 filename-derived
      batch ids, 34 distinct internal batch_id values, 149 coordination batch
      directories.
    internal_id_count_is_a_floor: >-
      16 checkpoint files carry no internal batch_id field at all, so 34 is a
      floor and not a count.
    directories_note: >-
      149 batch directories vastly exceeds the cap of 51 under any reading in
      which a directory is a batch. This record does NOT assert that reading,
      and does NOT assert any other reading.
    what_is_asserted: >-
      GOAL-ECDLP-001 has no single reconciled definition of "a batch
      consumed", and its budget counter has therefore never been auditable
      against its cap.
    what_is_not_asserted: >-
      This record does not assert which counting basis is correct, and does
      not assert how many batches GOAL-ECDLP-001 has actually consumed.

  concurrency_collision:
    what_happened: >-
      Two sessions worked GOAL-ECDLP-001 concurrently in separate branches on
      2026-08-15, and neither branch could see the other's batch. A concurrent
      session recorded checkpoint BATCH-8c58a3, moved the goal active ->
      paused, and recorded campaign_budget.maximum_batches = 51 as CONSUMED.
      This session independently ran BATCH-a723af to a closed dual-REVISE,
      whose checkpoint
      ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-a723af.yaml records
      goal_status active. Both checkpoints are committed and immutable.
    batch_a723af_goal_status_disposition: >-
      The BATCH-a723af checkpoint's goal_status active is
      STALE-BY-CONCURRENCY, not a competing claim. It was true on branch
      claude/ecc-challenge-ideas-gixt3r when written, and it is superseded by
      BATCH-8c58a3's paused on the merged history.
    batch_a723af_next_action_disposition: >-
      The BATCH-a723af checkpoint's next_action MUST NOT be dispatched.
    neither_session_erred: >-
      The concurrent session could not see BATCH-a723af. Its count was not
      negligent.
    root_cause_is_structural: >-
      The root cause is structural, not a mistake by either session. A batch
      COUNTER is a single shared scalar and cannot be sharded, so it is the
      one piece of goal state that concurrent worktrees cannot safely both
      advance. The write-once checkpoint shards, by contrast, merged cleanly
      here. That is the generalizable lesson: sharding makes concurrent
      checkpoint writes safe and does nothing at all for a shared scalar
      budget counter.

  authorizes_nothing:
    statement: >-
      THIS RECORD AUTHORIZES NOTHING. It does not authorize a further batch on
      GOAL-ECDLP-001, does not raise campaign_budget.maximum_batches, and is
      not a budget amendment.
    only_path_to_a_raise: >-
      Only a Coordinator decision resting on fresh explicit USER authorization
      can raise that cap, exactly as every prior raise in this goal's history
      was made.
    goal_status_unchanged: >-
      GOAL-ECDLP-001 REMAINS paused. This record does not change its status
      and no status transition is claimed.
    no_headroom_is_created: >-
      EVERY available counting basis places the campaign at or beyond its cap.
      The off-by-one therefore changes NO operational conclusion whatsoever.
      This correction is recorded because the erroneous "51st" figure is
      load-bearing for any FUTURE budget amendment that would read it as
      established fact -- not because it creates headroom. A reader must not
      mine this record for permission; there is none in it.
    no_resume_is_proposed_or_implied: true

  nothing_is_retracted:
    statement: >-
      NOTHING IS RETRACTED. The BATCH-8c58a3 checkpoint, its pause-condition
      firing, and the closing Coordinator's refusal to self-grant a further
      batch all STAND UNRETRACTED, and were correct on the facts available to
      that session.
    correction_is_by_supersession: >-
      Correction is BY SUPERSESSION, never by edit. No committed checkpoint,
      goal record, or decision is edited by this record, and no edit to any
      record is recommended.
    no_research_state_moves: >-
      No evidence, hypothesis, experiment, or claim-tier movement is claimed
      or implied. Nothing here is a cryptanalytic result.

  successor_action:
    scoping: >-
      Recorded as a RECOMMENDATION, not as authorization for anything.
    recommendation: >-
      Before any future budget amendment on GOAL-ECDLP-001, a reconciled
      definition of "batch consumed" must be fixed and the counter recomputed
      under it. An amendment written against an unreconciled counter cannot
      state what it is raising the cap FROM.

  cited_ids:
    - GOAL-ECDLP-001
    - BATCH-8c58a3
    - BATCH-a723af
    - BATCH-ef31ab
    - TASK-20260815-c35910
  cited_branch: 'claude/ecc-challenge-ideas-gixt3r'

  evidence_artifacts:
    - ledger/goals/GOAL-ECDLP-001/goal.yaml
    - ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-8c58a3.yaml
    - ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-a723af.yaml
    - ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-ef31ab.yaml
    - ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-ef31ab-close-20260808.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/

  recorded_by: coordinator
  authority_note: >-
    Written by the Coordinator into ledger/corrections/ under an exclusive
    write scope covering this file alone. It changes no hypothesis,
    experiment, or goal status, edits no immutable record body, grants no
    budget, and makes no scientific decision. Its whole content is a
    disclosure of a batch-accounting defect, an unreconciled counting basis,
    and a concurrency collision on GOAL-ECDLP-001.
