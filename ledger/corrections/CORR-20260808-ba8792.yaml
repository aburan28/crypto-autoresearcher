  record_type: claim
  record_id: EV-ICINV-c68f13
  field: >-
    Multiple. Enumerated field by field under `items` below. The single-field
    header fields of the template are filled from item C1, the most consequential
    of them; every other item carries its own record / field / prior_value /
    corrected_value triple and is equally binding.
  prior_value: >-
    EV-ICINV-c68f13 OBS-8: "A SMALL-m FAMILY EXISTS AND IS EXACTLY CHARACTERISED
    ... Every m = 1 instance in the T1 small-order tail at k12 and k14 has u = 1,
    v = -1, lambda = 1 with t in {1, 2}; the m = 2 instances have lambda = d - 1
    at t = -1. The family is: ordinary E/F_p with |t| <= 2 ... the trace-density
    of |t| <= 2 is O(1/sqrt p) -> 0 and a density-zero exceptional set is exactly
    what H1 asserts exists."
  corrected_value: >-
    The small-m set of the corpus contains AT LEAST TWO families and the |t| <= 2
    characterisation covers neither of them exactly. Family A (202 of the 256
    instances with m <= 2): |t| <= 3, m = 1 members all (u, v, lambda) =
    (1, -1, 1), m = 2 members all (u, v) = (-1, -1) with lambda = d - 1. NINE
    m = 1 instances have |t| = 3 (8 at k12, 1 at k14), so "t in {1, 2}" is wrong
    as written. Family B (54 instances, 21% of the small-m set): v = -1,
    u = t/2 EXACTLY, lambda = u, p == 1 (mod d), m = 2, |t| in {122, 126, 254,
    362, 418, 502, 2042}, present at k12 (23), k14 (7), k16 (23), k20 (1), with
    54/54 matching and 0 exceptions. OBS-8's O(1/sqrt p) trace-density argument
    does not cover Family B, which is defined by a congruence and not by a trace
    bound. Whether Family B is density-zero WAS NOT MEASURED and is not asserted
    here in either direction. Separately (RT-7) the small-m tail also contains a
    LARGE-CONDUCTOR branch in which d << sqrt p and it is d, not m, that is
    small -- example from the committed table, RUN-ICINV-kf-stage3-k12: p = 4093,
    t = 127, u = 63, v = -1, d = 61, lambda == 2 (mod 61), m = 60. On that branch
    |lambda| <= sqrt p + 1 holds only in the signed-lift sense and the stored
    residue is not the signed representative.
  reason: >-
    Two independent reviews of EXP-ICINV-fcb497, both archived and unedited,
    found defects in records this Coordinator wrote:
    experiments/EXP-ICINV-fcb497/validation-report.md (VAL-20260807-ICINV-fcb497,
    verdict `incomplete`, "validated with defects") and
    experiments/EXP-ICINV-fcb497/red-team-report.md (RT-20260807-257239). NO
    MEASURED QUANTITY MOVES. The validator recomputed all 42 primary statistics
    bit-exactly from per-instance-measurements.json, regenerated both seeded
    streams over all 21000 instances with 0 mismatches, and reproduced the frozen
    decision rule from a clean-room reimplementation including the dissenting
    seed. What is wrong is a handed-forward CHARACTERISATION (OBS-8), a
    traceability claim (OBS-2), the stated confound (CONFOUND-1) and the
    pre-registered NEXT ACTION (N3). Corrections supersede; nothing is edited.

  items:
    - id: C1
      source: V-2 (validation-report.md sec. 10), RT-7 (red-team-report.md)
      record: EV-ICINV-c68f13
      field: observations[OBS-8]
      also_corrects:
        - DEC-20260807-4261e3.rationale, item "A SMALL-m FAMILY WAS FOUND AND IS EXACTLY CHARACTERISED"
        - experiments/EXP-ICINV-fcb497/analysis.md, the corresponding small-m passage
        - KN-OPEN-2c095b, section "Related, and deliberately not merged into this entry", first bullet
      prior_value: see correction.prior_value above
      corrected_value: see correction.corrected_value above
      what_does_not_change: >-
        No falsification condition moves. F-ii requires OUTCOME_FAMILY_small_m at
        >= 2 seeds and fired at 1; F-vi concerns action-step and fixture
        instances, not stage-3 curves. No median, KS statistic, terminal state,
        seed vote, evidence strength or claim tier is affected. The DISMISSAL of
        the family as non-threatening also survives, but the order of its two
        arguments is corrected per C1b.
    - id: C1b
      source: RT-7
      record: EV-ICINV-c68f13
      field: observations[OBS-8], order of argument
      prior_value: >-
        The density argument leads: "the trace-density of |t| <= 2 is
        O(1/sqrt p) -> 0".
      corrected_value: >-
        MECHANISM STEP 4 LEADS AND THE DENSITY ARGUMENT IS SECONDARY. STEP 4
        (H-ENDO-001, used here ONLY as an admissibility filter and NOT re-tested,
        which nothing in this correction may be read as implying otherwise) makes
        the endomorphism act on the prime-order subgroup as a scalar, so no
        small-m family is an attack AT ANY DENSITY. The density argument is an
        asymptotic claim that seven decades below 2^24 cannot see, and it is now
        known not to cover Family B; the STEP 4 argument is unconditional on
        density and is the one that carries the dismissal.
    - id: C2
      source: V-3
      record: EV-ICINV-c68f13
      field: observations[OBS-2]
      also_corrects:
        - DEC-20260807-4261e3.rationale, item "THE EXECUTOR'S REFUSAL TO PROMOTE THE ABSTRACT PASSAGE IS ENDORSED"
        - experiments/EXP-ICINV-fcb497/analysis.md line 91
      prior_value: >-
        "At byte offset 1160 of the pinned 2020/341 LANDING-PAGE text ...
        verified_exact_substring true, both the windowed and the document-aware
        classifier label it kernel_field ... the dispatching session
        independently recomputed the hash and re-tested the substring at offset
        1160 before archiving."
      corrected_value: >-
        NO QUOTATION IN EITHER stage0-verdict.json HAS byte_start == 1160. The
        ten recorded 2020/341 offsets are {474, 542, 785, 799, 944, 986, 987,
        1001, 1015, 1445}. Byte 1160 is the start of a sentence fragment that IS
        an exact byte substring of the pinned text at that offset, but it is not
        a pinned recorded quotation. The five recorded passages whose window
        covers the square-root operation count (byte_start 944, 986, 987, 1001,
        1015) are labelled `base_field` by the WINDOWED classifier and
        `kernel_field` only by the DOCUMENT-AWARE one. The only two passages
        labelled kernel_field by BOTH classifiers are at 785 and 799, and their
        term matches sit on the CLASSICAL Velu Otilde(ell) sentence, not on the
        square-root count. The direction of the overstatement is the one that
        keeps cost corollary CC alive.
      what_does_not_change: >-
        The STAGE-0 verdict is AMBIGUOUS under BOTH classifiers and in BOTH runs,
        because it is gated on full-text retrieval and not on labels. No cost
        statement is made in either direction. CC stays UNDETERMINED.
    - id: C2b
      source: V-3, dispatching session self-report
      record: coordination
      field: >-
        the dispatching session's own corroboration claim, made in the PR body
        for PR #231 and to the user
      prior_value: >-
        The offset-1160 substring re-test was reported as independent
        corroboration of the recorded STAGE-0 quotation tail.
      corrected_value: >-
        IT WAS A WEAKER CHECK THAN PRESENTED. It confirmed that a string quoted
        in the execution report exists as a byte substring of the pinned
        artifact; it did NOT confirm that the string was one of the pinned
        recorded quotations, and it was not. THE ERROR IS THE DISPATCHING
        SESSION'S, NOT THE EXECUTOR'S. It is recorded here plainly because a
        corroboration claim that overstates its own strength is exactly the
        failure this campaign's byte-verification discipline exists to prevent,
        and because the next reader would otherwise have no way to tell that the
        re-test was not the check it was described as.
    - id: C3
      source: RT-1 (CRITICAL)
      record: EV-ICINV-c68f13
      field: unresolved_confounds[CONFOUND-1], and inference item (4)(B)
      also_corrects:
        - DEC-20260807-4261e3.rationale, item "(B) A MISMATCH BETWEEN THE NULL AND THE OBJECT"
        - KN-OPEN-2c095b, section "Statement" (the CM-reading / integer-reading dichotomy)
      prior_value: >-
        "The observed deficit is therefore ambiguous between a fact about CM
        arithmetic and a fact about the multiplicative orders of small integers.
        NO null over small integers of matched magnitude was drawn, so these 13
        runs cannot separate them."
      corrected_value: >-
        THE INTEGER READING IS COMPUTABLE FROM THE ARCHIVED TABLES AND IS FALSE
        AT EVERY TESTED DECADE. Red Team probe, small-integer null a uniform in
        [2, floor(sqrt d)] with gcd(a, d) = 1, identical order code path, 3
        decades x 3 data seeds x 3 RNG draws, ks_crit 0.0607:
        KS(small-int, uniform-unit) in [0.015, 0.045] -- ALL 27 CELLS
        SUB-CRITICAL; KS(curve, small-int) in [0.066, 0.142] -- ALL
        SUPER-CRITICAL, equal to or larger than the reported
        curve-vs-uniform-unit deficit. CONFOUND-1 names a true structural fact
        (lambda = +/- round(t/2), hence |lambda| <= sqrt p + 1, which the
        Validator confirmed on 21000 of 21000 instances with max ratio
        0.9970745956678385) and attaches the WRONG CONSEQUENCE to it. The
        smallness of lambda is not the confound.
      status_of_the_figures: >-
        The bracketed KS ranges above are RED-TEAM PROBES, not evidence: no run
        record, no pre-registration, no manifest, no certificate. They are cited
        as the reason the pre-registered N3 discriminator must be withdrawn, and
        they must be re-derived inside a pre-registered successor contract before
        any record cites them as a measurement.
    - id: C4
      source: RT-2 (CRITICAL)
      record: EV-ICINV-c68f13
      field: inference item (4), the three-way split (A) / (B) / (C)
      also_corrects:
        - DEC-20260807-4261e3.rationale, item "THE DEFICIT ANOMALY IS UNRESOLVED"
        - KN-OPEN-2c095b, section "Why the question exists"
      prior_value: >-
        Three explanations were enumerated: (A) small-d arithmetic artefact,
        (B) null/object support mismatch (smallness of lambda), (C) noise at the
        floor. (D) was absent.
      corrected_value: >-
        A FOURTH EXPLANATION EXISTS AND THE ARCHIVED TABLES SUPPORT IT: (D) THE
        ALGEBRAIC COUPLING. From T3 and the frozen lambda-rule, d = p - lambda^2
        - eps*lambda exactly as integers with eps in {0, +/-1}, hence
        lambda^2 == p (mod d): the curve-derived lambda is not merely a small
        integer, it is a SQUARE ROOT OF p MODULO d, and d is a deterministic
        function of (p, lambda). Red Team probe: drawing lambda' uniform in
        [2, floor(sqrt p)], setting d' = p - lambda'^2 and comparing
        ord_{d'}(lambda') to a uniform unit mod the SAME d' reproduces the
        deficit with NO ELLIPTIC CURVE IN IT -- 0.107, 0.162, 0.113, 0.035,
        0.086, 0.088, 0.035 across k12..k24, same sign, comparable or larger
        magnitude, same non-monotone failure to decay. Explanation (B) as stated
        is refuted (C3); explanation (A) is weakened, since the curve-free
        deficit persists at k20 and k22 where atomicity is already mild.
        The identity holds on 21000 of 21000 archived instances subject to the
        mod-d caveat on the large-conductor rows of C1.
      caveat_carried: >-
        The same RT-probe status as C3 applies to every number in this item.
    - id: C5
      source: RT-1, RT-2
      record: DEC-20260807-4261e3
      field: next_actions[N3]
      prior_value: >-
        N3 as pre-registered: add ONE second null drawn from small integers of
        matched magnitude, with the two-branch discriminator "curve
        indistinguishable from the small-integer null -> integer reading;
        curve below the small-integer null too -> CM reading, that is the
        interesting signal".
      corrected_value: >-
        N3 AS PRE-REGISTERED IS WITHDRAWN AND MUST NOT BE DISPATCHED. Its second
        branch is the branch the archived data already show would fire, so as
        written it would have recorded a FALSE POSITIVE ("CM reading; that is the
        interesting signal") and laundered it through SR7's
        no-re-scoring-after-the-fact protection. A pre-registered rule guaranteed
        to produce a false positive is worse than no rule. THE REPLACEMENT is the
        Red Team's THREE-ARM design: A = curve-derived (already archived),
        B = curve-free (lambda' uniform in the Hasse window, d' = p - lambda'^2),
        C = uniform-unit null on the matched d, PRE-REGISTERED ON KS(A, B), not
        on KS(A, C). The small-integer arm is DEMOTED to an already-answered
        recorded control. A FOURTH ARM IS EXPLICITLY EXCLUDED AS DEGENERATE:
        "another square root of lambda^2 mod d" differs from lambda by 2-torsion
        of (Z/d)*, so orders differ by at most a factor 2 and the arm returns
        KS ~ 0.01 by construction. It is named here precisely because it is the
        arm a reader of lambda^2 == p (mod d) reaches for first.
      sequencing: >-
        The successor contract for the replacement N3 is NOT written yet and is
        NOT authorised by this correction. Per the Red Team's single named next
        action, the STAGE-0 re-run (N4, re-approved as DEC-20260808-e75211)
        RUNS FIRST, because what it returns changes what the replication should
        ask before that replication is designed.
    - id: C6
      source: RT-1, RT-2
      record: KN-OPEN-2c095b
      field: >-
        sections "Statement" (the dichotomy), "Why the question exists",
        "Cheapest discriminating test", "What would close this", and the first
        bullet of "Related, and deliberately not merged into this entry"
      prior_value: >-
        The entry frames the open question as a two-way choice between a CM
        reading and an integer reading, and names as its cheapest discriminating
        test the addition of a single small-integer null with the two-branch
        rule now withdrawn under C5.
      corrected_value: >-
        SUPERSEDED THROUGH THIS CORRECTION, NOT EDITED. The knowledge entry file
        is a committed immutable artifact and is left byte-unchanged. Any citation
        of KN-OPEN-2c095b must be read together with this record. Specifically:
        (i) the CM/integer dichotomy is superseded by the three-way frame of C4 --
        curve-derived vs curve-free vs uniform-unit -- with the integer arm
        already answered; (ii) the "Cheapest discriminating test" section is
        KNOWN-WRONG as a design and must not be implemented as written; (iii) the
        restated open question is: DOES THE CURVE-DERIVED SAMPLE DIFFER FROM THE
        CURVE-FREE (lambda, p - lambda^2 - eps*lambda) FAMILY AT ALL, once both
        are compared against their own matched uniform-unit null -- i.e. does the
        class-number weighting on t contribute anything? That is the only place
        an elliptic curve can still enter; (iv) the "What would close this"
        section's option (i) is replaced by the three-arm design of C5, and its
        option (ii) (a derivation on orders of small integers) is now known to
        answer a question that is not the live one; (v) the first "Related"
        bullet's |t| <= 2 characterisation is corrected by C1 and its argument
        order by C1b. A superseding knowledge entry, if written, is a
        /curate-knowledge task under a NEW KN id and is not authorised here.
    - id: C7
      source: RT-5
      record: EV-ICINV-c68f13
      field: unresolved_confounds[CONFOUND-2]
      prior_value: >-
        "Whether this makes the nominal threshold conservative or
        anti-conservative under this replicated-atom structure is NOT settled by
        these data."
      corrected_value: >-
        IT IS SETTLEABLE FROM THE COMMITTED DATA AND THE ANSWER IS MORE
        FAVOURABLE TO THE RECORD THAN THE RECORD ASSUMED. Same-population KS
        (seed A curve sample vs seed B curve sample, all three pairs per decade)
        is 0.021-0.070 across the ladder, and the null-vs-null figures run
        0.029-0.089. Reading: the nominal 0.0607 is approximately calibrated at
        k12-k18 (same-population KS <= 0.054 there) and MILDLY ANTI-CONSERVATIVE
        at k20-k22, where identical populations reach 0.070-0.089. Two effects,
        opposite in direction: it SUPPORTS the record's discounting of the
        dissenting seed 20260807, whose k20 (0.081) and k22 (0.061) deficits sit
        inside the same-population spread, now on a measured basis rather than an
        assumption; and it DOES NOT touch k14, where the same-population KS is
        <= 0.038 against an observed 0.104-0.121, so the k14 deficit is a genuine
        population difference. What population it is a difference OF is the
        subject of C4.
      caveat_carried: >-
        RT-probe status as in C3. This is recorded as a correction of an
        overstated uncertainty, not as a measurement of record.
    - id: C8
      source: V-4, D1
      record: experiments/EXP-ICINV-fcb497/amendments/
      field: protocol-freeze state at the time of the v2 re-runs
      prior_value: >-
        D1 (13 runs against a frozen maximum_runs: 12) was settled in
        DEC-20260807-4261e3 as a disclosed, non-retroactively-authorised
        deviation, without reference to what the two headroom runs contained.
      corrected_value: >-
        D1 AND V-4 ARE ONE EVENT AND ARE RECORDED TOGETHER. The two runs that
        consumed the headroom were the v2 re-runs, and RUN-ICINV-kf-stage0-v2
        added a DOCUMENT-AWARE classifier beside the frozen 400-character window
        label AFTER v1's output had been seen, with
        experiments/EXP-ICINV-fcb497/amendments/ containing only .gitkeep. The
        change was declared honestly in the run's supersession_note rather than
        hidden, SR5's frozen grid did not move, the search terms are identical in
        both runs, and the verdict is AMBIGUOUS in both. It is nonetheless a
        change to how a frozen primary metric's supporting evidence is labelled,
        made after seeing output, moving five passages in the direction
        favourable to the hypothesis (C2). It should have been a versioned
        protocol_amendment and was not. The disposition on D1 is UNCHANGED and
        the Validator concurs with it; what changes is that the record now states
        what the headroom bought.
    - id: C9
      source: V-5
      record: EV-ICINV-c68f13
      field: inference item (2); and, by dependence, strength_note
      prior_value: >-
        "The dissent rests entirely on deficits at k20 (0.081) and k22 (0.061),
        BOTH BELOW the design's declared resolvable floor of 0.10."
      corrected_value: >-
        TRUE BUT UNDERSTATED, IN THE CONSERVATIVE DIRECTION. The binding cell is
        k22 at seed 20260807, where ks_D = 0.0610 against
        ks_crit = 0.060731606268894296 -- a margin of 0.00027, while at
        n = m = 1000 the KS statistic is quantised in steps of 0.001. 0.061 is
        the smallest attainable value strictly above the critical value: a
        displacement of a single instance's worth of ECDF would give 0.060 < crit,
        would make ks_below_critical_at_least_2_of_3 true, would fire
        OUTCOME_NULL at seed 20260807, and would under the frozen
        evidence_strength_calibration have permitted `replicated` rather than
        `preliminary`. The whole dissenting-seed narrative, and hence the
        `preliminary` cap, turns on one ECDF step at one decade of one seed. THE
        CAP IS NOT LOOSENED HERE -- loosening a threshold after seeing it bind is
        precisely the move the campaign's rules forbid -- but any successor
        record citing the cap must cite this fragility with it.
    - id: C10
      source: RT-4
      record: experiments/EXP-ICINV-fcb497/runs/RUN-ICINV-kf-decide/concrete-cost-table.json
      field: modeled_cost_rows[PS-P256] and [PS-P384], m_exponent_used
      also_corrects:
        - EV-ICINV-c68f13.observations[OBS-11]
      prior_value: >-
        m_exponent_used: 1.0, justified as "MODELED ONLY under H1 (m ~ d ~ p)",
        giving PS-P256 = 2^384 and PS-P384 = 2^576, in a table whose PS-TOY-24
        row correctly uses the MEASURED exponent 0.7923947341131429.
      corrected_value: >-
        THE ROW'S BASIS IS UNDER-DISCLOSED AND ITS SENSITIVITY UNTESTED. m is
        precisely the quantity this experiment measured, and the measured medians
        of log m / log d are 0.687, 0.615, 0.647, 0.802, 0.724, 0.723, 0.792
        across k12..k24 -- near 0.72 with no visible trend toward 1. At the
        measured exponent PS-P256 is 2^330, not 2^384: a 54-bit swing taken by
        substituting an asymptotic assumption for a measurement. This is NOT a
        claim that 1.0 is wrong asymptotically; log ord_d(a)/log d -> 1 slowly is
        the standard expectation and the o(1) at d = 2^24 is plausibly ~0.2. It
        is a claim that AGENTS rule 7 applies to an exponent as well as to a
        conclusion. Second, the rows report memory equal to time with no
        time-memory interpolation and carry no `not_an_attack_cost: true` flag on
        the row itself -- the condition is stated in `conditional_on`, in OBS-11,
        in DEC-20260807-4261e3 limitations and in KN-OPEN-2c095b Scope, but the
        NUMBER is the thing that travels.
      required_action: >-
        The run artifact is immutable and is NOT edited. Until a successor
        contract carries a sensitivity row at the measured exponent and a
        `not_an_attack_cost` flag, NO citation of PS-P256 or PS-P384 may quote
        the figure without quoting the exponent assumption beside it. Both rows
        remain, as before, conditional on a KERNEL_FIELD verdict that was not
        obtained, so neither is citable as a cost claim at all.
    - id: C11
      source: RT-6
      record: EV-ICINV-c68f13
      field: observations[OBS-9]
      also_corrects:
        - DEC-20260807-4261e3.rationale, item "AUDIT-Z IS NOT CONFIRMED"
      prior_value: >-
        "177 rows, M4_exponent_changed_count 0, M4_undetermined_count 127 ...
        among the 50 rows the audit could classify, none changes its exponent."
      corrected_value: >-
        ARITHMETICALLY CORRECT AND RHETORICALLY MISLEADING IN THE DIRECTION OF
        UNDERSTATEMENT. "127 of 177 undetermined" reads as an instrument that
        mostly could not decide, on 127 separate grounds. All 127 carry ONE
        IDENTICAL reason string keyed to a SINGLE blocking gate -- the STAGE-0
        AMBIGUOUS verdict -- and the 48 determined rows are determined by a
        STAGE-0-INDEPENDENT argument (R1-counts-evaluations) and therefore hold in
        BOTH branches of that gate. The honest phrasing: 48 rows are settled
        unconditionally, 127 are pending ONE retrievable fact, and 0 change their
        exponent in either group. AUDIT-Z REMAINS NOT CONFIRMED and this
        correction does not confirm it; what is corrected is an understatement of
        how close it is to being dischargeable, which under the program's own
        symmetry between premature closure and overclaiming is the mirror-image
        error to the one the record was carefully avoiding.
    - id: C12
      source: V-6
      record: EV-ICINV-c68f13
      field: observations[OBS-7]
      prior_value: >-
        "the curve-derived median at k12 is bit-identical across all three seeds
