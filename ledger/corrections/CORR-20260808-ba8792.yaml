    - id: C14
      source: RT-3 (HIGH), re-confirmed by the dispatching session
      record: experiments/EXP-ICINV-fcb497/specification.yaml
      field: stage0_retrieval_frozen.primary_source.urls_in_order
      also_corrects:
        - EV-ICINV-c68f13.observations[OBS-1], framing only
        - DEC-20260807-4261e3.next_actions[N4], framing only
        - KN-OPEN-2c095b, section "Related", second bullet
      prior_value: >-
        The frozen retrieval list pins ALL FOUR urls to eprint.iacr.org, whose
        PDFs return HTTP 403 behind a Cloudflare interstitial. The records
        describe STAGE 0 as blocked by that infrastructure failure.
      corrected_value: >-
        THE 403s REMAIN AN INFRASTRUCTURE OUTCOME AND ARE NEVER NEGATIVE
        MATHEMATICAL EVIDENCE -- that is unchanged and is restated here so it is
        not lost. What is corrected is the diagnosis: the paper is not
