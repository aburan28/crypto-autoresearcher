    - id: C13
      source: V-1
      record: experiments/EXP-ICINV-fcb497/runs/RUN-ICINV-kf-stage0{,-v2}/sources/*.raw
      field: archival state of a BLOCKING contract-required artifact class
      prior_value: >-
        Ten pinned raw byte streams -- including BOTH HTTP 403 response bodies,
