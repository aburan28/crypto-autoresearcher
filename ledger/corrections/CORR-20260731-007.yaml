correction:
  id: CORR-20260731-007
  recorded_at: '2026-08-02'
  record_type: claim
  record_id: ID-REMAP-AES-BRANCH-MERGE-2-TWELVE-WAY-COLLISION
  field: decision_knowledge_and_correction_id_allocation
  # Dated 2026-08-02, the actual date this correction was authored. The remapped
  # records keep their own 2026-07-31 allocation dates in their IDs; the
  # divergence is preserved rather than smoothed over, exactly as
  # CORR-20260731-005 preserved its own.

  # =====================================================================
  # SCOPE OF THIS RECORD, STATED FIRST BECAUSE IT IS LOAD-BEARING
  # =====================================================================
  scope_statement: >-
    REPRESENTATIONAL / ARCHIVAL METADATA ONLY. This correction concerns
    IDENTIFIERS AND FILE PATHS AND NOTHING ELSE. It asserts no research content.
    It reviews no evidence, creates no hypothesis, changes no hypothesis status,
    approves no experiment, promotes no claim, and closes no goal. It asserts
    NOTHING ABOUT AES at any round count, nothing about full-round or deployed
    AES, nothing about ECDLP, and nothing about any other cryptosystem. Every
    record named below is the SAME record after the remap as before it: no
    decision content, rationale, disposition, target_ids, claim, claim tier,
    scope, success criterion, falsification criterion, completion criterion,
    pause condition, budget, authority, evidence strength or status is altered
    by renumbering. Only identifiers move.

  # =====================================================================
  # THE IRONY, RECORDED DELIBERATELY
  # =====================================================================
  recurrence_note: >-
    THIS IS THE SECOND OCCURRENCE OF THIS FAILURE, AND CORR-20260731-005 —
    THE RECORD OF THE FIRST OCCURRENCE — IS ITSELF AMONG THE COLLIDED RECORDS.
    The record whose entire purpose was to document an ID collision was
    allocated by the same unsafe mechanism it documented, and collided in the
    same way on the next merge. It is renumbered here, by this correction,
    under the same principle it established. That is not a curiosity: it is the
    clearest available demonstration that the defect is in the ALLOCATOR and not
    in any individual act of allocation. Care at the point of writing cannot fix
    it, because CORR-20260731-005 was written with exactly that care — it
    verified its ID free by directory listing, and the listing was of the wrong
    universe. See knowledge/findings/KN-FIND-030.md.

  # =====================================================================
  # PRIOR / CORRECTED VALUE
  # =====================================================================
  prior_value:
    id_allocation: >-
      The AES working branch allocated ledger/decisions/DEC-20260731-013 through
      DEC-20260731-020 (eight coordinator decisions of the GOAL-AES-001/-002/-003
      campaigns), knowledge/findings/KN-FIND-017 and KN-FIND-018 (the two AES
      knowledge promotions), and ledger/corrections/CORR-20260731-005 (the record
      of the FIRST ID collision), each verified free by directory scan of the
      LOCAL WORKING TREE at authoring time. Every one of those twelve identifiers
      had also been allocated, independently and concurrently, to a DIFFERENT
      record on origin/main. knowledge/INDEX.md diverged as the derived
      consequence of the two KN-FIND collisions.

  corrected_value:
    id_allocation: >-
      Main's records keep their identifiers unchanged and untouched. This
      branch's twelve records move to the identifiers listed in `remap` below —
      DEC-20260731-013..020 -> DEC-20260731-025..032, KN-FIND-017 -> KN-FIND-028,
      KN-FIND-018 -> KN-FIND-029, CORR-20260731-005 -> CORR-20260731-008 — and
      knowledge/INDEX.md is REGENERATED from the merged corpus rather than
      resolved by hand. All references enumerated in `reference_sites` are
      updated in the classes marked `rewrite`, and deliberately NOT updated in
      the classes marked `do_not_edit`, where this record plus `reader_rule` is
      the pointer.

  # =====================================================================
  # THE COLLISION
  # =====================================================================
  collision:
    detected_at: '2026-08-02'
    detected_by: >-
      The session driving the Coordinator, merging origin/main into the AES
      working branch per the pre-generation merge duty (agents/coordinator.md,
      "Branch and PR discipline", step 1). The merge was ABORTED, not resolved;
      the tree was clean and nothing staged when this correction was authored.
    conflicting_paths_count: 12
    conflicting_paths:
      - ledger/decisions/DEC-20260731-013.yaml
      - ledger/decisions/DEC-20260731-014.yaml
      - ledger/decisions/DEC-20260731-015.yaml
      - ledger/decisions/DEC-20260731-016.yaml
      - ledger/decisions/DEC-20260731-017.yaml
      - ledger/decisions/DEC-20260731-018.yaml
      - ledger/decisions/DEC-20260731-019.yaml
      - ledger/decisions/DEC-20260731-020.yaml
      - ledger/corrections/CORR-20260731-005.yaml
      - knowledge/findings/KN-FIND-017.md
      - knowledge/findings/KN-FIND-018.md
      - knowledge/INDEX.md
    conflict_kind: >-
      ADD/ADD ID COLLISION, on all twelve paths. This is NOT a content
      disagreement and NOT a disputed edit to a shared record: no record on
      either side was modified by the other side. Each path names two records
      that were independently authored, about different subject matter, by
      different campaigns, and that happen to have been given the same
      identifier by two directory scans of two different working trees. There is
      no merge in which one side's text is the "right" version of the other
      side's record, because they are not versions of one record. Eleven of the
      twelve are genuine record collisions; knowledge/INDEX.md is a DERIVED
      index whose conflict is a downstream consequence of the two KN-FIND
      collisions and is not itself a record collision.
    examples_reported_by_detecting_session:
      - >-
        DEC-20260731-014: this branch's is `decision: revise`, the GOAL-AES-001
        BATCH-003 close-out on EV-AES-003. Main's is `decision: expand`. Two
        different decisions, one number.
      - >-
        Several of main's DEC-20260731-016..019 carry `goal_id: GOAL-ECDLP-001`,
        i.e. a different campaign entirely from this branch's AES records at the
        same numbers.
    not_a_research_disagreement: >-
      NOTHING IN THIS CONFLICT IS A DISAGREEMENT ABOUT MATHEMATICS, EVIDENCE,
      SCOPE OR INTERPRETATION. No claim on either side contradicts a claim on the
      other side. Reading this conflict as a research dispute, or resolving it by
      judging one side's content better, would be a category error and a contract
      violation (AGENTS.md, "Durable research commits": a sync conflict inside a
      ledger record, run artifact or knowledge entry is resolved by a new
      superseding record under a new id and NEVER by an edit that picks a side).

  resolution_principle: >-
    FIRST AUTHOR OWNS THE ID — the same principle the CORR-20260731-005 remap
    used. Records published on main keep their identifiers; this branch's
    records move. The principle is chosen because it is mechanical, decidable
    without judging content, and stable: main is the single serialization point,
    so "already on main" is a fact both branches can compute the same way, while
    "authored first by wall clock" is not. It carries NO implication that main's
    records are better, more important, or more correct than this branch's. It
    is a tie-break on identifiers, nothing more.

  # =====================================================================
  # THE REMAP
  # =====================================================================
  allocation_basis:
    computed_by: >-
      The detecting session, over the UNION of this working tree and origin/main
      — which is the correct universe, and the one the failed allocations did not
      consult.
    reported_first_free:
      DEC-20260731-NNN: '025'
      KN-FIND-NNN: '028'
      CORR-20260731-NNN: '007'
    coordinator_independent_verification: >-
      PARTIAL, AND DECLARED AS SUCH. This Coordinator independently verified the
      LOCAL half only, by directory listing: ledger/decisions holds
      DEC-20260731-001..020 with no gaps and nothing above 020; ledger/
      corrections holds CORR-20260731-001..005 and nothing above; knowledge/
      findings holds KN-FIND-001..018 and nothing above. The Coordinator DID NOT
      independently verify the origin/main half (no shell access in this
      session), and does not assert it. Under AGENTS.md core rule 9 the
      unverified half is reported as unverified rather than presented as checked.
    mandatory_reverification_gate: >-
      BEFORE APPLYING THIS REMAP, the applying session MUST re-verify the target
      IDs free over the union — e.g. `git ls-tree -r --name-only origin/main --
      ledger/decisions ledger/corrections knowledge/findings` compared against
      the local tree — for DEC-20260731-025..032, KN-FIND-028..030 and
      CORR-20260731-007 and -008. If any target is taken, DO NOT SHIFT THE
      MAPPING SILENTLY: stop and record a further correction. Applying a remap
      whose targets were assumed free would reproduce, for a third time, the
      exact defect this record documents.

