  # =====================================================================
  # RULING ON KNOWLEDGE PROMOTION
  # =====================================================================
  ruling_on_knowledge_promotion:
    question: >-
      Does the concurrency defect behind this collision warrant a KN-FIND entry,
      or is it an operational annoyance to be fixed and forgotten?
    ruling: >-
      IT WARRANTS AN ENTRY. Authored at knowledge/findings/KN-FIND-030.md.
    grounds:
      - >-
        REPRODUCIBLE AND RECURRENT, WITH THE SECOND INSTANCE PREDICTED BY THE
        FIRST'S MECHANISM. n=2 in this repository, seven days apart, same
        mechanism, and the second instance struck the very record that documented
        the first. That is a failure mode with a demonstrated recurrence, not a
        one-off.
      - >-
        THE MECHANISM IS UNDERSTOOD AND THE FIX IS A DESIGN CHANGE, NOT A REPAIR.
        Directory-scan allocation computes `max(local) + 1`, which is correct
        only if the local tree is the whole universe of allocations. Under
        concurrent branches it is not. No amount of care at the point of writing
        fixes it — CORR-20260731-005 exercised exactly that care and collided
        anyway — so the entry records a design constraint, which is the kind of
        content the corpus exists to carry forward.
      - >-
        IT BEARS ON EVIDENCE INTEGRITY, NOT MERELY ON TIDINESS. The first
        occurrence was caught one step before a task wrote over another
        campaign's decision and knowledge entry. The failure mode's bad ending is
        silent overwrite of another campaign's record, which is an
        evidence-integrity failure under AGENTS.md core rule 4.
      - >-
        IN-KIND PRECEDENT EXISTS. KN-FIND-018 (-> -029) is a harness-methodology
        finding about an instrument rather than about a cipher, promoted on the
        same reasoning: the pattern is not specific to one campaign and a reader
        who has not yet made the error would plausibly make it. The corpus
        already carries findings of this type.
      - >-
        THE COUNTER-ARGUMENT, CONSIDERED AND REJECTED. "It is an operational
        annoyance; just fix the allocator" would be right if the fix were
        obvious and free. It is not: the three candidate designs
        (branch-scoped prefixes, allocation against origin/main, reservation
        before use) have materially different failure modes and costs, and the
        entry's job is to carry that analysis rather than to relitigate it at the
        third collision.
    honesty_constraints_on_the_entry:
      - >-
        n=2 in ONE repository. The entry claims a mechanism and two instances,
        NOT a general law about multi-agent research systems.
      - >-
        The entry asserts nothing cryptographic. It is not evidence for or
        against any hypothesis, and it must never be cited in support of one.
      - >-
        The entry recommends a design change; IT DOES NOT ENACT ONE. Adopting a
        new allocator is a program change requiring its own coordinator decision
        under a new DEC id. None is taken here.
    promotion_basis_note: >-
      This promotion is NOT an evidence-review promotion and does not arise from
      a `support`/`reject_scoped` decision on `replicated`/`strong` evidence. Its
      basis is two recorded operational incidents (CORR-20260731-008 and this
      record). The Coordinator is the only role permitted to promote internal
      findings (knowledge/README.md, agents/coordinator.md resp. 11), and the
      basis is declared here rather than left implicit so that no reader mistakes
      it for evidence-backed research content.

  # =====================================================================
  # WHY THIS IS A CORRECTION AND NOT A DECISION
  # =====================================================================
  reason: >-
    A merge of origin/main into the AES working branch conflicted on twelve
    paths, every one an add/add ID collision produced by two concurrent
    directory-scan allocations rather than by any disagreement about content. The
    merge was aborted and NOT resolved by picking a side, per AGENTS.md
    ("Durable research commits") and agents/coordinator.md ("Branch and PR
    discipline"). This record supersedes the colliding identifiers on this
    branch's side under new ids, leaves main's records untouched, and enumerates
    every reference site the remap must follow. It is recorded as a CORRECTION
    and not as a coordinator_decision because it effects no state transition and
    asserts no research judgement: a decision record whose only content is that a
    merge renumbered files would dilute the decision series rather than document
    it. That reasoning is inherited verbatim from CORR-20260731-005 (-> -008).

  # =====================================================================
  # NON-CLAIMS
  # =====================================================================
  non_claims:
    - >-
      NO research content changes. No claim, scope, claim tier, success
      criterion, falsification criterion, completion criterion, pause condition,
      budget, authority or evidence strength is altered by anything in this
      record.
    - >-
      NO hypothesis status changes. NO experiment is approved. NO goal advances,
      pauses or closes. GOAL-AES-001, GOAL-AES-002 and GOAL-AES-003 all remain
      `active`, none has an open BATCH queue, and nothing here opens one.
    - >-
      NO evidence is created, reinterpreted, re-scored, promoted or demoted. No
      run record, receipt, manifest or digest is altered; the archived artifacts
      listed under `do_not_edit` must continue to verify against their recorded
      hashes after the remap.
    - >-
      NOTHING HERE IS ABOUT AES, at any round count, nor about ECDLP, nor about
      any other cryptosystem. It concerns identifiers only. The toy /
      reduced-round claim-tier ceilings of RQ-AES-001/-002/-003 stand untouched.
    - >-
      NO judgement is made about the merits of main's colliding records. "First
      author owns the id" is a mechanical tie-break on identifiers and carries no
      view on content, priority or quality.
    - >-
      NO RECORD ON MAIN IS EDITED BY THIS CORRECTION, and none may be edited when
      applying it.
    - >-
      THE ORIGIN/MAIN HALF OF THE FREE-ID COMPUTATION IS NOT INDEPENDENTLY
      VERIFIED BY THIS COORDINATOR. See allocation_basis.

  # =====================================================================
  # APPLICATION AND VERIFICATION
  # =====================================================================
  application_sequence:
    - Re-verify all target IDs free over the union (allocation_basis.mandatory_reverification_gate).
    - Re-run the merge of origin/main; expect the same twelve conflicts.
    - >-
      Take BOTH sides for each conflicted path: main's file keeps its path, this
      branch's content is written to its NEW path, and the old path holds main's
      version. This is not "picking a side" — both records survive, under
      distinct ids.
    - Update the `id:` field inside each of the eleven moved records to match its new path.
    - Apply the rewrite-class reference substitutions in reference_sites, and only those.
    - Regenerate knowledge/INDEX.md (tools/build_knowledge_index.py) and the dispatch plans (tools/research_dispatch.py).
    - Write knowledge/findings/KN-FIND-030.md into the corpus and regenerate INDEX.md again if ordering requires.
    - Re-run tools/validate_ledger.py on the merged tree and record the error-count delta.
    - >-
      Re-run the twelve ID searches and confirm zero residual references outside
      the do_not_edit and regenerate classes.
    - >-
      Archive, push, and open/refresh the PR naming CORR-20260731-007,
      CORR-20260731-008, KN-FIND-028, KN-FIND-029, KN-FIND-030 and
      DEC-20260731-025..032. Until pushed with an open PR these records are
      unpublished, not durable evidence.
  verification_expectation: >-
    A residual reference to DEC-20260731-013..020, KN-FIND-017/-018 or
    CORR-20260731-005 in a REWRITE-class file after application is a DEFECT and
    must be fixed before the archive. The same reference in a DO_NOT_EDIT-class
    file is EXPECTED and correct, governed by reader_rule. A validator flagging
    the latter is reporting the reader_rule, not a fault.

