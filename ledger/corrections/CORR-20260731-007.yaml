  # =====================================================================
  # REFERENCE SITES
  # =====================================================================
  reference_site_policy:
    principle: >-
      LIVE RECORDS ARE REWRITTEN; ARCHIVED ARTIFACTS ARE NOT. A stale ID in a
      record that still steers work is DANGEROUS in a specific, demonstrated way:
      it resolves to another campaign's record and can cause a write over it —
      the failure CORR-20260731-005/-008 caught one step before it happened. A
      stale ID in an archived receipt or review report is INERT: nothing reads it
      to decide what to write. Under AGENTS.md core rule 4 (results are
      immutable; corrections create new records) the second class is not edited,
      and this correction is the pointer.
    class_rewrite:
      definition: >-
        Live, forward-read, hand-authored records: the twelve moved records
        themselves, goal records, question records, evidence records, handoffs,
        open dispatch queues, and PUBLICATION-CANDIDATES.md. Apply the exact
        substitutions in `remap` and nothing else.
      important_constraint: >-
        SUBSTITUTE ONLY THE EIGHT DEC IDS, TWO KN-FIND IDS AND ONE CORR ID NAMED
        IN `remap`. DEC-20260731-001..012, KN-FIND-001..016 and
        CORR-20260731-001..004 and -006 are NOT in the remap: on the merged tree
        they belong to the MLKEM/CRYPTO/FAEST/ECDLP campaigns or were already
        settled by the first remap, and every reference to them is CORRECT AS IT
        STANDS. A blanket search-and-replace over the DEC-20260731 series would
        corrupt them.
    class_do_not_edit:
      definition: >-
        Immutable archived artifacts: snapshot receipts, producer run outputs,
        validator and red-team reports, and versioned protocol-amendment files
        already in force. These are not edited, are not restaged, and their
        recorded digests must continue to verify.
      regenerate_instead:
        - >-
          coordination/goals/GOAL-AES-001/batches/BATCH-00{2,3,4}/dispatch_plan.json
          and dispatch_plan.md are REGENERATED artifacts, not hand-authored
          records. Regenerate them from the repaired queues with
          tools/research_dispatch.py; do not hand-edit. (Same disposition as the
          CORR-20260731-005/-008 precedent.)
        - knowledge/INDEX.md — regenerate, per `remap.derived_artifacts`.
    reader_rule: >-
      IN ANY ARTIFACT UNDER coordination/**/archives/, coordination/**/tasks/, or
      coordination/goals/GOAL-AES-001/amendments/, A REFERENCE TO
      DEC-20260731-013..020, KN-FIND-017 or KN-FIND-018, OR CORR-20260731-005
      MEANS THIS BRANCH'S RECORD UNDER ITS NEW ID PER `remap`, AND NEVER MAIN'S
      RECORD AT THAT NUMBER. Those artifacts were authored before main's records
      existed on this tree and cannot refer to them. This rule is the reason the
      artifacts need no edit, and it is the durable record of the supersession.

