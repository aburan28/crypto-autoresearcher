  nature: >-
    SUPERSEDES IN SCOPE, NEVER OVERWRITES. CORR-20260913-53739b's arithmetic was
    re-derived blind by TASK-20260913-25da8c (VAL-20260913-353848, passed): every cell
    the producer computed matches to all displayed digits, and no conclusion it names
    as safe moves. This record carries the four SCOPE defects the validator found --
    two wording bounds that hold on the producer's grid and not over the stated range,
    and two figures propagated into records the correction did not name. Every number
    below is the validator's, from independent-figures.json, and is NOT re-derived by
    the Coordinator.

  corrections:
    - id: S1
      what: >-
        CORR-20260913-53739b's linearisation control states log2 lambda "at most
        -10.47" and "< 0.001 bits at every n tested ... safe over the whole tested
        range", read as covering n in [100, 1000]. The producer evaluated six n values.
      corrected_to: >-
        Over n in [100, 1000] the validator finds max log2 lambda = -2.91 and an
        unlinearised-charge shift of the total of up to 0.084 bits (both at n = 126),
        with 67 values of n exceeding 0.001 bits. The control's CONCLUSION survives: no
        argmin and no crossover changes anywhere in the range. Only the stated bounds
        are grid-specific.
    - id: S2
      what: >-
        "namely n in [281, 302]" for the faithful-charge d_sat = 4 crossover set.
      corrected_to: >-
        The set is non-monotone: Nagao/Semaev beats at 281-282, fails at 283-286,
        beats at >= 287. The bracket names 22 integers for a set of 18. First-n is 281;
        stable-from is 287.
    - id: S3
      what: >-
        IDEA-20260913-9c54f9 (named in CORR-20260913-53739b correction_4 but absent
        from its `corrects`) mixes eq. (11) stage-1 figures (181.7, 175.1) with
        m!-only crossovers (303/347/400), and states that integer k moves the
        threshold 302 -> 303.
      corrected_to: >-
        Under the faithful charge the direction reverses: 302 -> 281 (first-n) or 287
        (stable). The proposal record is immutable; this correction is the record to
        read beside it.
    - id: S4
      what: >-
        Two figures implied by CORR-20260913-53739b's authoritative cells but never
        stated, and one figure propagated unlabeled into four records.
      corrected_to: >-
        (a) IDEA-20260913-191ed2's "+0.5 bits at n = 571 per extra degree" is 3.75
        bits under the authoritative cells, and the dominant stage-1 arm at d_sat = 5,
        omega = 3 flips from unsatisfiable to satisfiable (threshold 1.05 -> 0.87).
        (b) The correction's "about five times larger" compares a superseded m!-only
        4-in-n shift with a cross-charge 22-in-n; the faithful-charge one-degree shift
        is 14 (first-n) or 8 (stable). (c) The "n ~ 3400" floor-reaches-4 figure in
        DEC-20260913-cb5ee2, EXP-SEMBIN-92724f, H-SEMBIN-c59e50 and IDEA-20260913-8138a0
        is the m = 2 value (4.0126); at the route those records name it is n = 11518.
        It is correct as an envelope over m and is unlabeled as such -- the same defect
        CORR-20260913-53739b correction_2 diagnoses, propagated into records it does
        not name. Those four records are immutable; readers take the m-label from here.

  no_conclusion_changes: >-
    None of S1-S4 moves a hypothesis status, an argmin, a crossover set's existence, or
    any downstream conclusion CORR-20260913-53739b names as safe. IDEA-20260913-191ed2's
