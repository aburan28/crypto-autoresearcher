correction:
  id: CORR-20260813-1a06db
  recorded_at: '2026-08-13'
  record_type: goal
  record_id: GOAL-QRE-001
  field: next_action (as it stood at 2026-08-09, and as propagated into BATCH-973b49)
  prior_value: >-
    "Produce those counts and their validation before any paper is acquired ...
    Acquisition then supplies only the fault-tolerance parameters and the
    published totals to reproduce against." Operationally read, and stated
    explicitly in all five BATCH-973b49 handoffs and in the Coordinator's
    dispatch report, as: NO RESOURCE-ESTIMATION PAPER HAS BEEN FILED FOR THIS
    GOAL, therefore every constant must be derived and there is nothing to
    compare against.
  corrected_value: >-
    A DIRECTLY RELEVANT PRIMARY SOURCE WAS ALREADY FILED BEFORE THE GOAL WAS
    WRITTEN. knowledge/literature/KN-LIT-099.md -- Roetteler, Naehrig, Svore and
    Lauter, "Quantum Resource Estimates for Computing Elliptic Curve Discrete
    Logarithms", ASIACRYPT 2017, eprint iacr:2017/598 -- is filed with
    citation_verified: read and added: 2026-07-24, and
    knowledge/techniques/KN-TECH-037.md reads its resource table directly from
    the ePrint text (KN-TECH-037 source_refs: [KN-LIT-098, KN-LIT-099,
    KN-TECH-005]). A published elliptic-curve point-addition cost model was
    therefore available to this goal from its first day.
  reason: >-
    The claim was false and it was load-bearing. It set the producer's
    instruction to derive every constant and cite none, it justified running
    the arithmetic layer before acquisition, and it was repeated to the user.
    The Red Team found it (TASK-20260813-312e93) and the Coordinator verified it
    independently before recording this correction rather than accepting the
    finding on report.

    RESPONSIBILITY. The error originated in the goal record of 2026-08-09 and
    was propagated without checking by the Coordinator when authoring
    BATCH-973b49. THE PRODUCER IS NOT AT FAULT: TASK-20260813-c99166 was
    instructed to cite nothing and derive everything, did exactly that, and
    disclosed what it could not derive.

    WHAT IT COST, AND WHAT IT DID NOT. It did not corrupt the counts: those are
    exact enumerations of a stated construction and stand on their own
    (EV-QRE-45dfe1). It did deprive the batch of the comparison that would have
    shown, at dispatch time, that the constructed point addition is far from the
    published one -- and that comparison bears directly on completion criteria 1
    and 4. Deriving rather than citing remains the right instruction for
    criterion 2; what was wrong was believing no comparison existed.

    A SECOND, PROCEDURAL DEFECT IS RECORDED HERE RATHER THAN SEPARATELY. The
    knowledge corpus was not searched before the batch was dispatched.
    AGENTS.md "Knowledge retrieval policy" requires search_knowledge before
    claiming an avenue is untested or a source unavailable. The retrieval server
    was intermittently unavailable during this session, which is a reason the
    search was not run and is NOT a licence to assert the negative; the correct
    action under an unavailable index is to state that the corpus was not
    searched, not to assert it is empty.
  evidence_artifacts:
    - knowledge/literature/KN-LIT-099.md
    - knowledge/techniques/KN-TECH-037.md
    - coordination/goals/GOAL-QRE-001/batches/BATCH-973b49/tasks/TASK-20260813-312e93/red_team_report.yaml
  superseded_records: []
  supersedes: null
  does_not_invalidate:
    - >-
      EV-QRE-45dfe1 and the counts it records. They are enumerations of a
      declared construction under a frozen convention and do not depend on the
      false premise.
    - >-
      The BATCH-973b49 snapshot (commit d931391c2) and its 17 bound hashes.
      Artifacts are immutable and are not edited by this correction.
  recorded_by: coordinator
