  field: >-
    The primary-shape membership of the ecgfp5_shaped curve at p' = 16777291.
    It appears in:
    - implementation.md section 5. The ladder table (line 239) lists the curve
      with order "4 · prime" and cofactor 4 and does not flag it. Line 242
