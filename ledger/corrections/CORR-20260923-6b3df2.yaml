      "EcGFp5-SHAPED double-odd toy curves y^2 = x(x^2 + 2x + c z) at p' in
      {4111, 262151, 16777291}".
    - DEC-20260923-d86ff2 limitations (line 364): "EcGFp5-SHAPED toy curves at
      p' in {4111, 262151, 16777291}".

  prior_value: >-
    The curve y^2 = x(x^2 + 2x + 59z) at p' = 16777291 is a primary-shape
    (EcGFp5-shaped double-odd) rung of the v1 ladder. v1's primary-shape
    ladder is {4111, 262151, 16777291}, spanning 12 bits over three primes.

  corrected_value: >-
    - The curve has order 1329257706611493023876109494255635172 = 2^2 * prime,
      cofactor 4 (ladder.json lines 353-365). It has b_is_square_in_Fq true
      (line 350). It is NOT double-odd: Pornin's definition is "order 2n for
      an odd integer n", and a square b rules double-odd out
      (inputs/PORNIN-2022-274-ECGFP5/paper_fulltext.md lines 871-874).
    - It is therefore outside the frozen primary shape, specification.yaml
      lines 100-103: "EcGFp5-shaped double-odd y^2 = x(x^2 + 2x + c z) with c
      chosen so the group order is 2 · prime (or 2 · nearly-prime with
      recorded cofactor)".
    - READING OF THE PARENTHETICAL, ruled by DEC-20260923-034ba0. The head
      term "double-odd" controls. "2 · nearly-prime with recorded cofactor"
      admits an ODD nearly-prime part with a small odd cofactor recorded. It
      does not admit an even part, which would contradict "double-odd" in the
      same sentence. Pornin's own selection process accepts only "order 2n
      with n prime" (paper_fulltext.md lines 857-869). The curve is an
      EcGFp5-MODEL curve (same equation family), not an EcGFp5-SHAPED one.
    - Its label from now on is `off_shape_non_double_odd`.
    - v1's primary-shape ladder therefore had two conforming rungs, 4111 and
      262151: 13 and 19 bits, a span of 6. That is below the frozen floor of
      3 primes spanning 12 bits (specification lines 97-98). The v1 ladder
      met the floor only by counting the off-shape rung.

