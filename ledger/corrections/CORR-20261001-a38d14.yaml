# =============================================================================
# CORR-20261001-a38d14 -- false or overstated claims in the RUN-SEMBIN-c68773
# manifest and in the snapshot commit message 3c97c0d40.
#
# WHAT THIS IS: the corrected values for statements the review round
# REVIEW-SEMBIN-20260928-04ec3c found false, unsupported by the run's own raw
# result, or outside the contract's binding language ceiling. Both values are
# kept; neither the manifest nor the commit is edited (AGENTS.md core rule 4).
#
# WHAT IT IS NOT: it is not a correction of the run's ARITHMETIC. raw-result.json
# reproduces byte for byte (J1, J2) and its cells are reproduced by two
# independent implementations (J1 S0; blind re-derivation). What is corrected is
# what the receipt SAYS its numbers mean.
#
# SOURCE OF THE COMMIT-MESSAGE QUOTATIONS: the Coordinator writing this record
# had no shell and did not read the 3c97c0d40 message directly. Every commit
# quotation below is as quoted by VAL-20260930-ea7f96 (J4), which read it with
# git, and is marked so. The manifest quotations were read directly.
# =============================================================================
correction:
  id: CORR-20261001-a38d14
  recorded_at: '2026-10-01'
  recorded_under: DEC-20261001-5c9e7a
  archived_by: TASK-20261001-7d04c9
  record_type: run
  record_id: RUN-SEMBIN-c68773
  also_affects:
    - commit 3c97c0d40 (snapshot of TASK-20260928-9e14ac's artifacts; on main via PR 1470), message title and body
    - experiments/EXP-SEMBIN-04ec3c/runs/RUN-SEMBIN-c68773/manifest.yaml
  field: multiple -- see items C1 to C13
  prior_value: >-
    The manifest and commit present RUN-SEMBIN-c68773 as a valid, control-passing
    pricing of the decomposition-oracle family with the oracle's memory "charged",
    finding 14 sub-rho cells under the charge against 720 without it, a minimum
    store "to beat rho" of 2^85.4 to 2^375.9 by degree, P2/P4/P5 "CONFIRMED",
    `protocol_deviations: []`, and a title stating that the family "cannot buy its
    way below rho".
  corrected_value: >-
    RUN-SEMBIN-c68773 is a faithful computation of a model that never charges the
    construction of the oracle's |F|^s table. Every sub-rho cell it reports needs
    fewer than one oracle call and a table holding more entries than rho performs
    operations in total; with construction charged at one operation per entry no
    cell is below either baseline column at any store, any degree, any m. The run
    tripped its A1 stop rule and did not stop. It is evidence-inadmissible
    (DEC-20261001-5c9e7a R2, R4). Item-level corrections follow.
  reason: >-
    Four independent reviewer artifacts (J1 S6; J2 section 3; J3 section 1; blind
    re-derivation S2/V3, identity I1) locate the uncharged construction; J2 and J4
    locate the untriggered stop; J4 quotes each overstatement with corrected
    wording. See evidence_artifacts.

  items:
    - id: C1
      field: >-
        manifest result.metrics.min_store_to_beat_rho_by_degree,
        store_exceeds_baseline_work_at_every_degree, excess_range_bits; commit
        paragraph "THE RESULT"
      prior_value: >-
        min_store_to_beat_rho_by_degree, e.g. 131 -> {m 8, log2_store 106.8,
        log2_total 64.20, excess_over_baseline_bits 42.5}; "the store must exceed
        rho's ENTIRE WORK at every degree tested" (commit, as quoted by J4).
      corrected_value: >-
        These are the stores at which PROBE-ONLY work first crosses the vOW
        column, not stores that beat rho. At n 131, m 8 the oracle is invoked
        2^-42.6 times and its 2^106.8-entry table is never built in the reported
        total; building it alone costs at least 2^106.8 operations. Read correctly
        the quantity is a proof inside the model that no cell is sub-rho at any
        store (J1 analytic_floor: total >= (log2 N + log2 m! + d)/2 > log2 N / 2).
        Suggested key name: min_store_where_probe_only_work_crosses_vow_by_degree.
        The 42.5-bit "excess" compares log2 entries with log2 operations under no
        declared unit.
      evidence: [J1 S6 and cost_model_checks, J3 section 1 table, blind S2 and I1, J4-7 and J4-9]
    - id: C2
      field: >-
        manifest subrho_cells_store_free 720, subrho_cells_memory_charged 14,
        cells_removed_by_the_memory_charge 706, surviving_cells_confined_to_degrees,
        C-NULL-NO-MEMORY-CHARGE_detail; commit "THE CHARGE IS WHAT DOES THE WORK ...
        with the store free 720 cells fall below the baseline; with it charged, 14
        do" (as quoted by J4)
      prior_value: 720 store-free sub-rho cells, 14 under the charge, 706 removed by it; "DECISIVE".
      corrected_value: >-
        720 is 90 distinct (degree, m) store-free cells counted once per budget
        label, labels which do not apply to the store-free treatment (J1 S0; J4-4,
        fact F3). In all 90 and all 14 the table holds more entries than the
        reported total operation count, by at least 41.9 bits; counting
        construction, both sets are EMPTY, so the store budget does no work that
        the time accounting does not already do. Under amendment A4's genuine null
        the verdict is the same store-free and store-budgeted, which is the branch
        A4 says REFUTES the premise that the oracle's unpriced store was the
        asymmetry; the unpriced asymmetry was build TIME. A4 also forbade reading
        this diagnostic as decisive.
      evidence: [J1 control_checks, J2 section 3, blind S2, J4-4]
    - id: C3
      field: manifest preregistered_prediction_detail, P2 paragraph
      prior_value: >-
        "P2 CONFIRMED: the first summand count strictly below the published
        ECC2K-130 reference under a store-free MITM oracle is m = 8, exactly as
        predicted."
      corrected_value: >-
        P2's first clause reproduces in the probe-only accounting at n 131 (m 8 at
        2^58.69 against the published 2^60.8090). Its second clause, "m = 6 landing
        near it", was not reported and fails: m 6 lands at 2^70.27, 9.46 bits
        above. The m 8 cell's table holds 2^116.0 entries, so with construction
        counted it is below neither column. The answer is also fragile under
        conventions (0.018-bit margin with K = |F| and the LA row weight m
        restored; m 10 with a Wiedemann constant of 3; blind D2). P2 is
        `model_consequence_with_sweep_selection` (A2) and its confirmation is not
        support for H-SEMBIN-8e7ae3. Nothing is asserted about ECC2K-130.
      evidence: [J1 S2, J4-7, blind D2]
    - id: C4
      field: manifest preregistered_prediction_detail, P4 paragraph
      prior_value: >-
        "P4 CONFIRMED within its stated band: the minimising summand count is 8 ...
        and the minimum store is 2^106.8 ... exceeding the baseline's total work by
        42.5 bits (predicted more than 40)."
      corrected_value: >-
        P4 as authored mixes columns (its 2^108 is solved against 2^(n/2), its
        "about 2^61" is the published reference) and cannot be scored as written.
        Per column at n 131, probe-only: against vOW 0.886 sqrt(r) = 2^64.33 the
        crossing store is 2^106.8 at m 8 (excess 42.5 bits); against the published
        2^60.8090 it is 2^111.4 (excess 50.6 bits; computed by the J4 reviewer, not
        by the run). The minimising m is a property of the frozen cap
        s <= floor(m/2) (with s = ceil(m/2) it moves to m 7 at 2^102.6; J1 S5b) and
        is rounding-sensitive for n >= 191 (blind D3). None of these is a store
        that beats rho once construction is counted.
      evidence: [J4-2, J1 S5b, blind D3]
    - id: C5
      field: manifest preregistered_prediction_detail, P5 paragraph
      prior_value: '"P5 CONFIRMED: no cell at a store budget of 2^80 or below falls below either baseline at any listed degree."'
      corrected_value: >-
        True in the probe-only model at the ten listed degrees under the m!
        relation-cost convention, and it stays true under cofactor 2 or 4 (J1 S7).
        It is convention-dependent: under the truncated-MITM s! convention it flips
        at n 97 (store 2^70) and n 109 (store 2^77) (blind V4/S1). It is moot under
        construction charging, where no cell at any budget is sub-rho. The
        hypothesis's own prediction 4 ("any binary degree the program tracks") is
        false in the probe-only model at tracked degrees n 79 and n 89 (J4-6).
      evidence: [J1 S7, blind S1 and V4, J4-6]
    - id: C6
      field: >-
        manifest controls.C-FLOOR-REPRO_detail, result.halted,
        protocol_deviations
      prior_value: >-
        "Max absolute offset 2.78 bits, growing monotonically in m as the
        amendment's declared signature requires."; halted: null;
        protocol_deviations: []
      corrected_value: >-
        The signature's third clause ("within 1.5 bits of 2 log2 m") FAILED at
        m = 4, 5, 6, 8 by 2.02, 2.44, 2.76 and 3.22 bits in A1's sign convention
        (committed minus recomputed); the driver's own offset_bits field carries the
        opposite sign throughout. A1 and TASK-20260928-9e14ac's constraints required
        that "a departure over 1.5 bits stops the run for Coordinator adjudication
        rather than proceeding". The run should have halted and
        protocol_deviations should have listed the departure. Adjudicated in
        DEC-20261001-5c9e7a R2: a false alarm about the implementation caused by a
        miscalibrated signature, with the stop NOT lifted retroactively.
      evidence: [J1 out_of_joint_observations, J2 section 1.2 item 4 and OBJ-2, J4-7]
    - id: C7
      field: manifest result.controls (controls_reported 4) and the completion gate of TASK-20260928-9e14ac
      prior_value: controls_reported 4; C-FLOOR-REPRO pass; valid true
      corrected_value: >-
        raw-result.json carries three controls. C-BOUND-PROBE (A3),
        C-BASELINE-CONSISTENCY (A7) and the A6 step-3 / step-4 realisation table
        were not implemented or reported, although the producer card's completion
        gate required each. A7's own pass criterion would fail at n 131 by 1.000
        bit, and A7's 4.52-bit attribution is itself wrong (3.52 bits of <pi> plus
        1.00 bit of cofactor; J4-3). The C-FLOOR-REPRO "pass" is a pass of a gate
        shown to accept a wrong (m!-free) implementation (J2). The producer
        deliverable RESULTS.md was never written. `valid: true` is not supported as
        a statement of protocol compliance.
      evidence: [J1 control_checks, J4-3, J2 OBJ-1 and OBJ-3]
    - id: C8
      field: >-
        manifest purpose ("Charge the decomposition oracle's MEMORY"), metric keys
        subrho_cells_memory_charged and cells_removed_by_the_memory_charge,
        C-NULL detail ("the memory charge is doing the work")
      prior_value: memory described as charged into a cost
      corrected_value: >-
        Breaches amendment A5's binding language ceiling, which forbids any derived
        record to state that memory was charged into a cost. Permitted wording: the
        oracle's store is budget-constrained and reported symmetrically with the
        baseline's, neither side adding store to its operation count. Under
        AMD-20261001-e61f2b the permitted wording becomes: the table's construction
        is charged as operations at one per entry; memory is reported, not charged.
      evidence: [J4-4, specification.yaml A5]
    - id: C9
      field: manifest result.metrics.enum_d_independent
      prior_value: 'enum_d_independent: true'
      corrected_value: >-
        raw-result.json summary.enum_d_independent_everywhere is false under the
        driver's own < 1e-6 test; the maximum spread is 0.0014 bits, from the
        linear-algebra term entering the log-sum at large d.
      evidence: [J4-7 fact F5]
    - id: C10
      field: manifest preregistered_prediction_detail, P3 paragraph
      prior_value: >-
        "The reported minimum-store curve at n = 131 confirms the withdrawal was
        right: it falls to m = 8 and rises after."
      corrected_value: >-
        Contradicted by raw-result.json: m = 2..7 are unreachable at any store,
        because the linear-algebra term exceeds the baseline; from m = 8 the
        minimum store alternates with parity (106.8, 111.0, 108.25, 112.5, 112.5,
        116.7, 117.95, 122.5, 124.8) and its even-m values rise monotonically, which
        is what the withdrawn P3b clause said. There is no falling limb; A2b's 140.2
        and 112.5 at m = 4 and 6 are realised by no cell. P3b STAYS withdrawn: its
        withdrawal was a pre-data act and reinstating it after seeing the data would
        be post hoc; the ground given for the withdrawal is recorded as mistaken.
      evidence: [J1 S3 domain_defect, J4-7 fact F4]
    - id: C11
      field: manifest inputs.parameters.degrees_note and scope.what_it_does_not_touch
      prior_value: >-
        "All prime, which is what blocks Weil descent and cover attacks on every
        listed target."
      corrected_value: >-
        Every listed degree is prime, so F_(2^n) has no subfield other than F_2.
        Descent-to-a-subfield-curve attacks are outside this contract's scope, and
        this run asserts nothing about any attack's applicability to any listed
        curve. (The prior sentence is an uncited security assertion; Weil
        restriction to F_2 is the step this program's own Semaev-binary family uses
        at prime n.)
      evidence: [J4-8(a)]
    - id: C12
      field: commit 3c97c0d40 message (as quoted by J4; not read directly by this Coordinator)
      sub_items:
        - quoted_prior: '"sembin: the decomposition-oracle family cannot buy its way below rho" (title)'
          corrected: >-
            sembin: GIVEN generic m-SUM, no decomposition-oracle cell falls below
            rho in the cost model at the ten swept degrees; with the oracle table's
            construction charged this holds at any store; non-generic oracles remain
            the open route. (The title is unconditioned and reads as a lane closure,
            which the claim_ceiling forbids; the conditional appears only in the
            last paragraph.)
        - quoted_prior: >-
            "On ECC2K-130 the cheapest entry costs 2^106.8 of store to reach a
            2^64.2 attack, against a baseline whose total work is 2^64.3."
          corrected: >-
            At the degree label n 131, with N set to ECC2K-130's subgroup order
            r ~ 2^129, the probe-only accounting first crosses the vOW column
            0.886 sqrt(r) = 2^64.33 at m 8, where the oracle's table holds 2^106.8
            entries; building it takes at least 2^106.8 operations. The published
            ECC2K-130 reference 2^60.8090 is a separate column (crossing store
            2^111.4). No cell in this model is below either column once
            construction is counted. Nothing is asserted about ECC2K-130. (The
            prior sentence names a curve, gives it the vOW column although A7
            permits only the published column at that curve, and quotes a
            probe-only total as an attack.)
        - quoted_prior: '"THE CHARGE IS WHAT DOES THE WORK ... with the store free 720 cells fall below the baseline; with it charged, 14 do."'
          corrected: See C2 and C8.
        - quoted_prior: >-
            "Those 14 survivors sit only at n=97 and n=109, need 2^90 of store or
            more, and both those curves were solved by rho in 1998 and 1999."
          corrected: >-
            The 14 store-budgeted probe-only cells sit at degree LABELS 97 and 109,
            each of which carries two Certicom challenges: ECC2K-95 and ECC2-97
            (broken 1998, 1999) and ECC2K-108 and ECC2-109 (broken 2000, 2004), per
            the frozen input inputs/BAILEY-2009-541-ECC2K130/talk-35minutes_text.md
            lines 179-183 (read by this Coordinator). They are cost-model rows, not
            statements about those curves, and with construction counted none is
            below rho.
      remedy: >-
        The commit is immutable and is not amended or rewritten. The scoped
        wording above is what any EV record, KN-FIND title, PR text or synthesis
        must carry.
    - id: C13
      field: manifest authorization_note
      prior_value: >-
        "APPROVAL PRECEDED EXECUTION IN FACT ... the contract and hypothesis were
        committed ... with no implementation; the Coordinator then approved ...; the
        approval archive was committed at e56b0a215; and only then did this run
        execute."
      corrected_value: >-
        Approval preceded EXECUTION (run at 3c97c0d40 after e56b0a215). The driver
        memory_charged_family.py was itself added in the approval archive commit
        e56b0a215, so git does not show approval preceding IMPLEMENTATION, and the
        approval archive may have staged paths it did not declare. Open recheck
        DEC-20261001-5c9e7a PD-4; until it is done the ordering claim is limited to
        execution.
      evidence: [J1 artifact_checks commit binding, J4 out_of_joint F8]

  what_this_does_not_withdraw: >-
