      prior_value: >-
        Every consumer of any value the consumercover draft disposes of is
        covered by that value's disposition.
      corrected_value: >-
        Only V-2, V-3, V-4 and V-5 ("ANY consumer") and the alpha class ("a
        value copied or derived from" the wrapper's returned result) are
        value-level. V-1 is disposed of per direct consumer; V-6 names its
        consumers and puts every other E1-E4 consumer "outside this table".
        The SE-3 wrapper body and the SE-2 event record (solver-events.json
        and the values derived from it) have no disposition: the class rule's
        one exception is the frozen solve() / run_system() bodies. So a reader
        of V-1 that is not K-1..K-5, or a reader of a non-recorded attempt's
        result, is NOT covered by construction. The archived census found:
        - 4 V-1 consumers NOT COVERED: a1_driver.phase_b_check line 268
          (whole-file sha256 of v2 raw-result.json files, which carry V-1
          through the K-4 copies, against the phase-B archive receipt) and
          cmd_aggregate_a1 lines 371-373, which set run_status and
          failure_class from its status (consumer-census.md lines 396-398,
          419; receipt CU2_b_S3_not_covered);
        - 10 S-1 consumers OUTSIDE THE CLASS RULE: nine reads inside the
          SE-3 wrapper (r2_resolve.py lines 140, 176, 193, 227 x2, 263, 275,
          276, 278) and the SE-4 / SC-11 check r2_check_run.py line 213,
          which compares the manifest's solver_events sha256 with
          solver-events.json (consumer-census.md lines 429-438; receipt
          CU2_c_outside_class_rule).
        By this act's own reading (not a census result), r2_check_run.py lines
        205 and 207-212 also read solver-events.json (its consistency flag
        and counters) at effect E2. The census did not enumerate them: those
        values are written under tests on attempt fields, and its method M-7
        does not propagate control-dependent writes (consumer-census.md line
        340). They are readers of the same event record.
      evidence: >-
        consumer-census.md lines 310-522 (CU-2) and the ad3f9a receipt lines
        58-366; the Coordinator's reading of a1_driver.py lines 238-298 and
        371-389, r2_resolve.py lines 121-280, r2_check_run.py lines 197-218,
        and the aggregate_a1 package of trial-plan-v2-a1-r2.json (lines
        1191-1202).
      why_it_matters: >-
        The census was designed so that only an UNCOVERED GATING reader could
        bar the draft. It found such readers because two classes of value had
        no value-level disposition, not because a disposed value had a new
        reader. The successor DRAFT AMD-EXP-GFPN-05ff43-20260924-valueclose
        adds exactly those value-level dispositions (the wrapper body as a
        permitted exception, the event record as a value class, V-1 row K-6
        and the integrity-hash value V-7) and removes none. None of the 14
        consumers is evidence of a fault: phase_b_check's verdict is invariant
        to every field value a file carries (it fails only if bytes changed
        after archiving), and the wrapper's reads are the approved SE-2
        mechanism. The draft's own reading makes them a bar anyway.
