# =============================================================================
# CORR-20260924-838ff2 -- SUPERSEDES A COVERAGE PRESUMPTION AND TWO
# QUOTATIONS, NOT ANY FILE: what the consumercover dispositions cover.
#   (1) DEC-20260924-a7453e and the DRAFT
#       AMD-EXP-GFPN-05ff43-20260924-consumercover say its dispositions are
#       stated PER DERIVED VALUE, so that any reader of an already-disposed
#       value is "covered by construction". That is true of V-2..V-5 (each
#       says "ANY consumer") and of the S-1 / S-2 alpha class. It is NOT true
#       of V-1, which is disposed of per direct consumer (rows K-1..K-5, no
#       value-level row), nor of the SE-3 wrapper body or its event record,
#       for which the class rule names no disposition at all. The archived
#       consumer census found 4 V-1 consumers outside K-1..K-5 and 10 S-1
#       consumers outside the class rule (CU-2 (b), (c)).
#   (2) DEC-20260924-a7453e line 625 and the census card TASK-20260924-5dfbfd
#       line 125 abbreviate lp_check.py's sha256 as "f386c863...0b5c". The
#       bound value ends "...0c5c".
#   (3) consumer-census.md lines 38868 and 38896 (and the json's
#       partial_script_record.decision, per the dispatching session) say the
#       partial script was "repaired and completed (C1-C11)", while the same
#       section lists thirteen changes C1-C13 (C10 reverted).
# Found by the consumer census TASK-20260924-5dfbfd (item 1), by the census
# and the dispatching session (items 2 and 3), and confirmed by the
# Coordinator reading the code and records under TASK-20260924-7a8167.
# WRITE-ONCE. Written by the Coordinator under TASK-20260924-7a8167 (ruled in
# DEC-20260924-e6638d), archived by TASK-20260924-4de205. No existing file is
# edited.
# =============================================================================
