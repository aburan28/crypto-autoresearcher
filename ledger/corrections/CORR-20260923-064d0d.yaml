    (|G| = 2^{m-1} m!), a "cruder realisation" of FHJRV that "quotients by the
    same group".

  corrected_value: >-
    As built, arm (iii) is the NORM Q = A^2 - w^2 B^2 of the G2-invariant
    summation polynomial S = A(sigma(t)) + w B(sigma(t)), with
    w = prod (x_i - b/x_i). The facts:
    - It is invariant under x_i -> b/x_i for EACH i separately, i.e. under
      (Z/2)^m x| S_m (order 2^m m!). It is not (Z/2)^{m-1} x| S_m. It squares
      away exactly the anti-invariant generator that FHJRV's invariant ring
      keeps.
    - Its interpolated support equals arm (ii)'s: 20349 = 20349 monomials at
      m = 5, 495 = 495 at m = 4, and 35 = 35 at m = 3 (committed builds
      RUN-GFPN-42a000, RUN-GFPN-c16d20, RUN-GFPN-405554). Its Bezout and
      mixed-volume bounds are therefore arm (ii)'s.
    - In the red team's square analogues its ideal degree equals arm (ii)'s:
      64 = 64 at n = m = 3 at p = 4111 and p = 16777291, two targets each, with
      Singular and msolve agreeing; 4096 = 4096 at n = m = 4 (b a square).
    - The committed m = 4 F4 traces of S4 and torsion_S4 are identical round
      by round. The committed m = 5 traces of arms (ii) and (iii) are identical
      from degree 17 to degree 32.
    - On the phi-base, accepting R or R + T, its decomposition probability is
      about 2^{m-1} times LOWER than arm (ii)'s (red team's count, consistent
      with FHJRV lines 345-347 and 854). So as built, arm (iii) is dominated
      by arm (ii).
    - FHJRV's Prop. 8(i) / Prop. 13 polynomial-ring form requires b to be a
      square in F_q, or full 2-torsion (Remark 9). EcGFp5-shaped double-odd
      curves have b a non-square (Pornin frozen text lines 871-875;
      ladder.json b_is_square_in_Fq false). That form is therefore unavailable
      for them.
    - A construction that DOES realise (Z/2)^{m-1} x| S_m exists for odd
      extension degree. The red team derived it; it is not in FHJRV's text.
      Write b = lam^2 beta with beta in F_p* a non-square. The factor base is
      {P : x(P)/lam in F_p}. The unknowns are sigma(u_i + beta/u_i) and
      w = prod(u_i - beta/u_i). In the square analogues it gives
      D = 2^{(m-1)^2}: 16 at n = m = 3 and 512 at n = m = 4.
    Consequently no artifact of EXP-GFPN-05ff43 bears on the 2-torsion
    symmetrization H-GFPN-9a29be names. The m = 5 exhaustion of arm (iii)
    (RUN-GFPN-805701, RUN-GFPN-61a67b) is a property of a 20349-term
    S_5-shaped system.

  reason: >-
    Red team TASK-20260923-404bf9, joint K5 (breaks). The basis has three
    parts.
    (1) A checkable derivation of the invariance group. The Coordinator
    re-derived its key step: by the pair identity S(b/y_1, b/y_2, y_3..) ~
    S(y), a single flip x_2 -> b/x_2 exchanges the two factors of Q up to a
    Laurent monomial, so every single flip leaves Q invariant.
    (2) Committed build records with identical supports, and committed F4
    traces with identical shapes.
    (3) Computed square analogues
    (scratch/k5k7/square_analogue_n3.json and square_analogue_n4.json;
    predictions written in the script before the runs). Dispatcher
    verification (2026-09-23) REPRODUCED the n = m = 3 degrees by re-running
    the red team's own square_analogue.py in a scratch copy: raw 384, S3 64,
    product 64 with the same support as S3, and D3-type 16, at both primes and
    both targets, with Singular and msolve agreeing. That re-run is a
    REPRODUCTION, NOT AN INDEPENDENT DERIVATION. The n = m = 4 degrees rest on
    the red team's computation alone.

