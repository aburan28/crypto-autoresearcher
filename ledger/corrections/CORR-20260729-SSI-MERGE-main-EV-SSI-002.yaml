  observations:
    - >-
      MITM full-cost exponent p^{2/3} for F_{p^2} confirmed correct by
      independent red-team review: table of p^{1/2} entries, clock cycle
      p^{1/6}, hardware p^{1/2}, full cost p^{1/2} * p^{1/6} = p^{2/3}.
      Matches Wiener BSGS result with group order n = |V| ~ p.
    - >-
      Delfs-Galbraith full-cost exponent p^{1/3} for F_p confirmed correct:
      DG is MITM on the F_p subgraph of |V^{F_p}| ~ sqrt(p) vertices, giving
      full cost p^{1/4} * p^{1/12} = p^{1/3}.
    - >-
      Low-memory van Oorschot-Wiener distinguished-point collision search
      on the supersingular isogeny graph is well-defined in mechanism: walk
      model (random l-isogeny steps with hash-based edge selection),
      distinguished predicate (leading-zero-bits on j-invariant), and
      collision-to-path reconstruction (distinguished-point segmenting +
      Velu dual composition). No uncharged oracles identified by review.
    - >-
      FATAL OBJECTION (F1): VW parallelization as specified fails. With a
      fixed deterministic walk function, all walks from E_0 follow the same
      path and all walks from E_1 follow the same path — only 2 useful walks
      exist, not P = p^{1/4}. Walks from random curves produce paths between
      random curves, not E_0 -> E_1. With P=2, full cost is O~(p^{3/4}),
      worse than MITM's p^{2/3}. Fix: assign P/2 distinct hash functions to
      walks from E_0 and P/2 to walks from E_1, so each processor explores a
      different path from its endpoint.
    - >-
      F_p mixing conditional is correctly scoped: G_l^{F_p} is not known to
      be Ramanujan; VW on F_p requires unproven mixing; DG at p^{1/3} full
      cost is the correct fallback. Consistent with AGENTS.md rule 2
      (heuristic-conditional claim with falsification condition and fallback).
    - >-
      Nonfatal objection N1: clock-cycle reasoning is inconsistent between
      MITM table (tau = S^{1/3}) and VW (should be set by per-processor
      storage O(1), not shared table, because table is accessed only at
      distinguished points). Result (full cost p^{1/2}) is correct by
      Wiener's theorem; reasoning needs reconciliation.
    - >-
      Nonfatal objection N2: YAML phrasing "Velu duals from stored kernels"
      could imply non-polynomial storage; derivation note correctly describes
      recomputation during reconstruction. Phrasing should be corrected.
  inference: >-
    The MITM and Delfs-Galbraith full-cost exponents are confirmed correct
    and decision-relevant: they raise the bar for novelty screening (future
    candidates must beat p^{2/3} MITM or p^{1/3} DG full cost, not the easier
    step-count p^{1/2} or p^{1/4}). The VW collision-search analogue is
    well-defined in mechanism but its parallelization specification has a
    fatal error (F1) that must be fixed before the VW full-cost exponents and
    matched-baseline recommendation can be promoted. Partial knowledge
    promotion: MITM/DG full-cost exponents are warranted now; VW analogue
    and matched-baseline recommendation require the F1 fix.
  boundaries:
    - Derivation and literature review only; no isogeny or curve computation was performed.
    - No surviving scheme was attacked or solved.
    - MITM/DG full-cost exponents are confirmed; VW full-cost exponents are conditional on F1 fix.
    - F_p VW variant is additionally conditional on unproven F_p subgraph mixing.
    - This does not close KN-OPEN-013, KN-OPEN-014, or KN-OPEN-015.
    - This is not a sub-p^{1/4} break or a cryptanalytic mechanism toward completion criteria.
  unresolved_confounds:
    - VW parallelization fix (per-processor walk-function variation) not yet applied to derivation.
    - Clock-cycle reasoning inconsistency (N1) not yet reconciled.
    - F_p subgraph mixing assumption unproven.
    - Full-cost constants from KN-LIT-094 are asymptotic with unextracted o(1) terms.
  reviewed_by: coordinator
