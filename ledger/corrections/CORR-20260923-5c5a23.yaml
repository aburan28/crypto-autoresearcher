# =============================================================================
# CORR-20260923-5c5a23 -- sentences in the opening-round records of BATCH-ba0b0d
# and in the goal text that mis-state what the auxiliary-input census can
# express, found false or incomplete by REVIEW-AUXIN-20260922-fd1edc.
#
# WHAT THIS CORRECTS: claims about the METHOD'S CEILING and about the goal's
# closure route. No measured value changes. The immutable records keep their
# text; this record supplies the corrected reading beside it.
# =============================================================================
correction:
  id: CORR-20260923-5c5a23
  recorded_at: '2026-09-23'
  recorded_by: coordinator
  authorizing_decision: DEC-20260923-ce06a6
  archived_by: TASK-20260923-888d90
  written_by_task: TASK-20260922-a05e72
  goal_id: GOAL-AUXIN-a93442
  batch_id: BATCH-ba0b0d

  record_type: claim
  record_type_note: >-
    claim, the closest of the three values the template permits (candidate |
    claim | run). The objects corrected are statements in a decision, a review
    plan and a goal record, not a run or a candidate mechanism.
  record_id: DEC-20260922-19b645
  also_concerns:
    - REVIEW-AUXIN-20260922-fd1edc (coordination/review/auxin-20260922-fd1edc/review-plan.yaml)
    - GOAL-AUXIN-a93442 (ledger/goals/GOAL-AUXIN-a93442.yaml, objective (1) and completion criterion 1; text not edited)

  items:
    - id: S1
      where: >-
        DEC-20260922-19b645 what_E_r_is.the_floor ("The census therefore CANNOT
        express an exponent below known prior art; the best any row can do is
        reach the floor") and review_tier_ruling.basis (1) ("the quantity is
        bounded below by Cheon's published exponent, so the package can only
        re-express known prior art at specific integers"). Review plan header
        ("Nothing in this package measures, or could measure, an exponent below
        Cheon's") and composition.rule_12_status basis (a) ("the census cannot
        express anything beyond known prior art").
      prior_value: The frozen quantity is bounded below by known prior art on every row.
      corrected_value: >-
        TRUE FOR THE r - 1 BRANCH ONLY. There the frozen expression is Cheon's
        Theorem 1 cost, and its floor (1 + log2(m)/4)/log2(r), about 0.25 +
        1/log2(r), is his balanced exponent. FALSE FOR THE r + 1 BRANCH: the
        contract applies the same sqrt(m/d) + sqrt(d) there, but Cheon's
        published d | r + 1 cost (EUROCRYPT 2006 Theorem 2) is sqrt((r+1)/d) + d
        with floor about r^(1/3), about 0.337 at 256 bits. So frozen-expression
        r + 1 values CAN and DO fall below every published r + 1 cost in the
        sources read: brainpoolP256r1 at 0.2556 and BN254-r r + 1 at 0.25394.
        They are not attainable costs (CORR-20260923-187ea3).
      consequence_for_the_tier_ruling: >-
        None in effect. The tier stayed review-adversarial with four
        pre-declared tripwires. No reviewer reported T1-T4, and nobody asserts
        the r + 1 values as attainable, so the "implementation-error class"
        reading applies and T2 did not fire (RT-20260923-ca6b7c tripwires). The
        stated BASIS was over-broad; the ruling it supported stands on basis (2)
        and (3) and on the fact that no record claims a break. A later assertion
        of an r + 1 frozen value as a real cost routes to review-breakthrough.
    - id: S2
      where: >-
        Review plan coordinator_prior.what_the_escalate_is ("brainpoolP256r1 at
        0.2556 is about a factor 1.35 above it", measured against the Cheon
        floor) and coordinator_prior.escalate_set (the typed r - 1 set
        {NIST-P-256, secp256k1, BN254-r, BLS12-381-r, brainpoolP384r1}).
      prior_value: brainpoolP256r1's flagged value is near the Cheon floor; the typed r - 1 set has five members.
      corrected_value: >-
        brainpoolP256r1's flagged value is an r + 1 frozen-expression value, so
        its distance to the r - 1 floor is not a statement about Cheon's cost.
        Its r - 1 branch is 0.4918, and its Theorem-2-typed r + 1 minimum is
        0.3401. The typed r - 1 set as the prior wrote it CONTAINS A VOID ROW:
        brainpoolP384r1 was computed on the field prime (CORR-20260923-64ee17
        C1). On valid rows the census's typed r - 1 set is NIST-P-256,
        secp256k1, BN254-r, BLS12-381-r, with NIST-P-384, NIST-P-521 and
        Ed25519-L undetermined.
    - id: S3
      where: >-
        GOAL-AUXIN-a93442 objective (1): "if the standardized orders carry no
        divisor near sqrt(r), the whole attack class is inert at deployed
        parameters regardless of any protocol, and the lane closes on a
        certificate."
      prior_value: '"No divisor near sqrt(r)" is the inert condition, and it closes "the whole attack class".'
      corrected_value: >-
        (i) Inertness at the frozen 0.49 floor needs NO divisor of r - 1 or r + 1
        in about [r^0.02, r^0.98], which is far stronger than "none near
        sqrt(r)": a divisor near r^0.3 already gives about 0.35.
        (ii) "The whole attack class" exceeds the cost model. A certificate
        closure would be scoped to the Cheon d | r +/- 1 family and its declared
        input models (one power on r - 1; Theta(d) consecutive powers on r + 1).
        (iii) At 256 bits this closure route has near-zero prior probability:
        0 of 32 random primes and 0 of 59 fully factored random branches were
        inert (PTM-1, a review computation). The route is not deleted. It is
        recorded as practically unreachable at deployed sizes, not as a live
        branch of the design (RT-20260923-ca6b7c closure_challenges CL1).
    - id: S4
      where: >-
        GOAL-AUXIN-a93442 completion criterion 1: "... the best achievable
        exponent min over admissible d of the Cheon cost tabulated per curve
        against the sqrt(r) rho baseline at identical accounting."
      prior_value: Criterion text as written, with no supply condition.
      corrected_value: >-
        READING FIXED, TEXT NOT EDITED (changing a completion criterion after
        seeing outcomes needs a versioned amendment, and this is a reading, not
        a change). Read literally, the criterion survives the no-supply null
        (PTM-3), i.e. it proves too much. It is read as: "the Cheon cost exponent
        per curve, per branch, typed by the auxiliary input it presupposes,
        tabulated beside the ordinary-input rho exponent 0.5 in the same
        group-operation unit, as a different problem". Any record that
        discharges the criterion states that condition.
    - id: S5
      where: DEC-20260922-19b645 plain_answer_to_the_question_put.
      prior_value: E(r) about 0.254 on NIST-P-256, secp256k1 and BLS12-381-r is the known Cheon exponent, conditional on [x^d]P for that d.
      corrected_value: >-
        NOT CORRECTED -- confirmed. All three are r - 1 minimizers, the
        statement is explicitly conditional on supply, and the red team found it
        correct as written (RT-20260923-ca6b7c J6 part_i). It is listed so a
        reader does not take this correction to withdraw it.

  reason: >-
    The review round was asked what the escalate means. Its red team found the
    ceiling sentences above false on r + 1 (RT-CA6B7C-J5-O3), the closure route
    mis-stated (CL1), and the completion criterion's wording over-broad (PTM-3).
    The validator's J1 break voided one member of the prior's typed set. The
    records carrying those sentences are immutable, so the correction is
    additive. The dispatching session reports that the same ceiling sentence in
    the text of PR #1381 has already been corrected there. PR text is not a
    ledger record and is not governed by this correction.

  what_is_NOT_corrected:
    - The tier ruling itself, the tripwires, the joint ownership and the blind re-derivation design of REVIEW-AUXIN-20260922-fd1edc.
    - The goal's completion criteria and objective text (readings fixed here; any text change is a separate versioned act).
    - DEC-20260922-19b645's plain_answer (S5).

  evidence_artifacts:
