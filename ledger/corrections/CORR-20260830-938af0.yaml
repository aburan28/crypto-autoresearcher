        silently edited. The error mattered: it caused this Coordinator's
        initial reading of the Executor's DEV-1 anomaly to treat it as an
        independent convergence between the Executor's own judgment and an
        unrelated later edit, when in fact the Executor was working from
        already-corrected specification text and its own execution_report.yaml
