        per the correction above): "FORCED exactly 0 four-cycles, with every
        realized type in {1^4, 2.1.1, 2^2}"
        (experiments/EXP-MONO-4c7479/specification.yaml,
        `arms_and_controls.matched_ordered_base_control`, line ~353 as
        currently committed). Every cell reports zero four-cycles and every
        realized type drawn from exactly {1^4, 2.1.1, 2^2} -- this MATCHES
        the current forced value exactly. The `matches_forced_value: false`
        field and the "DOES NOT MATCH" prose in execution_report.yaml compare
        against the SUPERSEDED "exactly two types {1^4,2^2}" wording (likely
        inherited from this Coordinator's own handoff TASK-20260830-25b8c3,
        which was authored before 5f0d0dec1 landed and was never updated --
        see `limitations` below), not the specification text actually in
        force at run time. DEV-1 is RESOLVED: it is a stale-comparison
        artifact in the Executor's own reporting, not a genuine deviation
        from the frozen (as-executed) contract, and not evidence against
