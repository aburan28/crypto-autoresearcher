        start commit). This finding is the independent Validator's
        (TASK unspecified, review under experiments/EXP-MONO-4c7479/reviews/
        validator/) Finding F1, confirmed here by this Coordinator via direct
        git forensics (`git log`, `git show -s --format`, `git merge-base
        --is-ancestor`), not accepted on the Validator's word alone.
      reason: >-
        AGENTS.md rule 4 (records are immutable, corrections supersede) and
        this record's own commitment to disclosing out-of-band edits
        accurately (see the CORR-20260830-778068 precedent for GOAL-ENDO-001)
