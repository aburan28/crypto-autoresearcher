        THERE WERE TWO out-of-band commits by the same external git identity
        ("Cursor Agent <cursoragent@cursor.com>", no task/decision reference),
        not one: 5f0d0dec1 (2026-08-30 12:36:59 -0700) and a1269ac26
        (2026-08-30 12:43:19 -0700). Independently verified by this
        Coordinator via `git merge-base --is-ancestor 5f0d0dec1 d810634a6`:
        TRUE. 5f0d0dec1 is an ancestor of d810634a6, the commit the Executor's
        own run manifests record as its start. The specification text the
        Executor actually built against was THEREFORE ALREADY 5f0d0dec1's
        edited version -- not the original, pre-edit text as the receipt
        claimed. 5f0d0dec1 is the commit that introduces the F_p^4-Frobenius
