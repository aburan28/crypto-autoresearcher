        proposal's own S5 citation conflated the two. Neither
        `execution_report.yaml` nor `specification.yaml` is edited in place
        by this correction; both stand as committed, with this record
        providing the correct reading.
      reason: >-
        An anomaly report that compares data against a forced value the
        contract no longer asserts is not a finding about H-MONO-0b3def; left
