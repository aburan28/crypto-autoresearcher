correction:
  id: CORR-20260802-d8ba0e
  recorded_at: '2026-08-02'
  record_type: duplicate_batch_execution
  record_id: DUPLICATE-EXECUTION-GOAL-MLKEM-003-BATCH-007
  field: authoritative_record_for_BATCH-007
  recorded_by: coordinator

  summary: >-
    GOAL-MLKEM-003 BATCH-007 was executed TWICE, independently, by two sessions
    that each held DEC-20260802-002 and neither of which knew the other existed.
    Both produced TASK-20260802-101/103/104 artifacts and a ledger archive under
    TASK-20260802-105. origin/main's execution is authoritative. This branch's
    execution is retained as an independent replication.

  how_it_happened: >-
    This session authored and committed the BATCH-007 launch records
    (DEC-20260802-002, the five frozen handoffs, the dispatch queue). Those were
    merged to origin/main as PR #101. A second session then picked the batch up
    from main and executed it end to end. This session, unaware, executed the
    same batch on its own branch. The collision surfaced only at the next
    origin/main merge, as an add/add conflict on ledger/evidence/EV-MLKEM-017.
    NOTE THE MECHANISM: this is NOT the identifier-allocation failure of
    KN-FIND-030 and CORR-20260802-655085. Random 6-hex identifiers would not have
    prevented it. The duplicated thing was the WORK, not the name -- a launch
    record published to main is an invitation any session may accept, and nothing
    in the harness marks a dispatched batch as claimed.

  authoritative:
    evidence: EV-MLKEM-017
    decision: DEC-20260802-15cadd
    location: origin/main
    basis: >-
      Published to main first. Consistent with the standing precedent that the
      party discovering a collision yields (DEC-20260801-003,
      CORR-20260801-001), and with the user's explicit direction on 2026-08-02.

  retained_as_replication:
    evidence:
      was: EV-MLKEM-017
      now: EV-MLKEM-5a8ec5
    decision: DEC-20260802-735e6a
    rationale: >-
      An independent execution that reaches the same verdicts is stronger
      evidence than either execution alone, and discarding it would destroy that.
      It is marked record_status: independent_replication_not_authoritative so no
      reader mistakes it for a second official evidence record for one batch.

  what_replicated:
    - >-
      Q1 verdict confirmed_in_current_source in both executions, on the same
      vendored artifact sha256
      083b142256eecaebfa72dfccf847151b2175666a3979cef4e7383376757b8005, with the
      same declared limitation that ePrint-hosted bytes were never retrieved
      (HTTP 403, Cloudflare challenge) so the HAL/ePrint-revision-3 identity is
      inferred rather than byte-proven.
    - >-
      The counting-resolution identity log2(4000 * 241^3) = 35.7045 against
      KN-FIND-012's recorded Pwrong floor of -35.70 was derived INDEPENDENTLY by
      both executions' red teams. Two adversarial passes converging on it is
      materially stronger than the single derivation this branch recorded.
    - >-
      The other execution additionally pinned the revision with an OAI-PMH
      record datestamp (2025-06-11T13:35:08Z) that this execution did not obtain.

  what_diverged_and_who_was_right: >-
    KNOWLEDGE PROMOTION, AND THIS BRANCH WAS WRONG. DEC-20260802-735e6a promoted
    the counting-resolution identity as KN-FIND-031. DEC-20260802-15cadd declined
    to promote, recording that the result would supersede coverage statistics
    carried by KN-FIND-012 and KN-FIND-014, which makes it a CONTRADICTION
    BETWEEN VALIDATED EVIDENCE RECORDS, and that AGENTS.md rule 12 gates such a
    claim behind an independent review-breakthrough review at max effort. That
    reading is correct. This branch's contrary argument -- that the entry "only
    qualifies the reading of the floor value" and "supersedes nothing" -- is
    thinner than the rule, and promoting through an ordinary batch decision
    accomplished by ledger commit what rule 12 requires a max-effort independent
    review to authorise.

  action_taken:
    - >-
      KN-FIND-031 is WITHDRAWN. Its frontmatter carries status
      WITHDRAWN_PENDING_RULE_12_REVIEW, confidence lowered to unverified, and a
      banner stating it holds no official standing. The entry is retained rather
      than deleted so the audit trail survives.
    - >-
      The arithmetic is NOT retracted. log2(4000 * 241^3) = 35.7045 is exact and
      was reproduced twice independently. Only its promotion to official
      knowledge standing is gated, and with it any authority to qualify
      KN-FIND-012's or KN-FIND-014's official reading.
    - >-
      Restoring KN-FIND-031 requires the rule-12 review-breakthrough pass at max
      effort in an independent session, not a further batch decision.

  stale_references_deliberately_left_unedited:
    - path: ledger/decisions/DEC-20260802-735e6a.yaml
      note: >-
        Committed and pushed at 1c917a11. It still names EV-MLKEM-017 and still
        records knowledge_promotion.promoted: [KN-FIND-031]. Both references are
        now stale and are corrected HERE rather than by editing the record. This
        is the same discipline applied in CORR-20260802-655085.
    - path: knowledge/findings/KN-FIND-031.md internal_refs
      note: >-
        Still names EV-MLKEM-017, which now resolves to the authoritative record
        on main rather than to this branch's replication. Left as-is; the
        mapping is here.

  what_this_does_not_change: >-
    No observation, verdict, control outcome or measurement is altered. Both
    executions stand as written. ML-KEM is not broken. KN-OPEN-016 remains open.
    No closure quorum is asserted.

  process_gap_exposed: >-
    A batch launch record published to main can be executed by any session, and
    the harness has no claim, lease, or in-flight marker on a dispatched batch.
    Two sessions therefore duplicated a full batch of work -- four subagent
    executions and two independent review passes -- without either detecting it
    until merge. Random identifiers do not address this; only a claim mechanism
    on the dispatch queue would. Recorded here as an observation about the
    harness, not promoted, and not evidence about any hypothesis.

  references:
    - EV-MLKEM-017
    - DEC-20260802-15cadd
    - EV-MLKEM-5a8ec5
    - DEC-20260802-735e6a
    - DEC-20260802-002
    - KN-FIND-031
    - KN-FIND-012
    - KN-FIND-014
    - KN-FIND-030
    - CORR-20260802-655085
    - GOAL-MLKEM-003
