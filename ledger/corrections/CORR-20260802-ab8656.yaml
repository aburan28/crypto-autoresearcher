correction:
  id: CORR-20260802-ab8656
  id_remap_note: >-
    AUTHORED AS CORR-20260802-ab8656 AND REISSUED; main's own CORR-20260802-ab8656
    arrived first in the 7c3cce2c merge and keeps the identifier. Content
    unchanged apart from the id. Minted as a random 6-hex suffix by hand
    because tools/allocate_id.py --next does not cover the correction record
    type: its PREFIX_TYPE map has coordinator_decision, evidence, experiment,
    handoff, hypothesis, idea and research_question, and no CORR. That is a
    real residual gap in the main #106 repair and is reported here rather than
    worked around silently.
  recorded_at: 2026-08-02
  record_type: run
  record_id: TASK-20260802-909
  field: dispatch_queue.tasks[TASK-20260802-909].state and archive.commit_sha
  prior_value: >-
    The GOAL-AES-003 BATCH-001 ledger archive was intended to be a
    dispatcher-verified archive at state `completed`, with archive.commit_sha and
    archive.parent_sha bound and every declared path digest checked against the
    committed blob, exactly as the BATCH-001 snapshot archive TASK-20260802-906
    was at 54ee869b.
  corrected_value: >-
    IT STAYS AT `queued` WITH A NULL commit_sha, AND THE LEDGER COMMIT IT WOULD
    HAVE STAMPED EXISTS AND IS PUSHED. What is missing is a machine stamp, not a
    result. EV-AES-005, DEC-20260802-9bda5c, the GOAL-AES-003 BATCH-001 checkpoint
    and the archive receipt are all committed and pushed.
    WHY THE STAMP CANNOT BE OBTAINED. tools/research_dispatch.py verifies an
    archive by requiring its commit to change EXACTLY the archive's own artifacts
    plus every source task's artifacts. An archive can therefore only bind
    content it INTRODUCES. The two review artifacts this archive would bind --
    TASK-20260802-908's red_team_report.yaml and most of TASK-20260802-907's
    supporting files -- were already committed before the archive was authored,
    so the archive commit does not change them and verification fails as
    "missing".
    WHOSE FAULT AND WHICH COMMITS. The Coordinator's, in two `git add -A`
    invocations run while review tasks were still executing:
      a7d9437f  swept in TASK-20260802-908/red_team_report.yaml
      f398c0ab  swept in TASK-20260802-907's val_count.c, mini.c, val_aes.py,
                runA.sh, runA.log, runB.sh, fresh_key.txt, val_targets_r5.json
                and four compiled binaries
    Neither commit was an archive and neither declared those paths. `git add -A`
    stages whatever a concurrently-running agent happens to have written, which
    is precisely the failure mode the declared-write-scope discipline exists to
    prevent.
    WHY IT IS NOT REPAIRED BY REWRITING. Both commits are pushed and both carry
    review artifacts. AGENTS.md forbids rewriting history over pushed run
    records without qualification, and a review artifact is exactly the kind of
    record that rule protects -- rewriting it would destroy the ordering
    guarantee that makes an independent review worth anything. A defect in how a
    result was stamped does not license destroying the record of the result.
  reason: >-
    Recorded so that no later batch reads a `queued` ledger archive as unfinished
    research, and so the process defect is fixed rather than repeated. This is
    the SECOND ordering defect in the same batch and they share a root: BATCH-001
    ran producers before it had a queue (recorded in the snapshot receipt at
    54ee869b), and then staged review artifacts before it had an archive. Both
    come from acting first and recording second.
    THE REPAIR IS A PROCESS CHANGE IN BATCH-002, NOT A HISTORY REWRITE. While any
    review task is live, the Coordinator stages declared paths explicitly and
    never runs `git add -A`. Proposed as a completion gate on every BATCH-002
    archival card.
  evidence_artifacts:
    - coordination/goals/GOAL-AES-003/batches/BATCH-001/dispatch_queue.json
    - coordination/goals/GOAL-AES-003/batches/BATCH-001/archives/TASK-20260802-909/ledger-receipt.json
    - coordination/goals/GOAL-AES-003/batches/BATCH-001/archives/TASK-20260802-906/snapshot-receipt.json
    - ledger/evidence/EV-AES-005.yaml
    - ledger/decisions/DEC-20260802-9bda5c.yaml
