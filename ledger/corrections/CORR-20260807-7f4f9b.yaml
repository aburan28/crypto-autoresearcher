correction:
  id: CORR-20260807-7f4f9b
  recorded_at: '2026-08-07'
  recorded_by: >-
    top-level session, acting on an independent validator review
    (`experiments/_reviews/validator-report-20260807-followups.yaml`, id VAL-20260807-4ce796).
    Not a Coordinator action.
  type: archived_command_does_not_reproduce_own_reported_number
  supersedes: []
  corrects:
    - experiments/EXP-KDUAL-8f0b69/runs/RUN-KDUAL-8f0b69-001/command.txt
    - ledger/evidence/EV-KDUAL-bd9750.yaml
  record_type: run
  record_id: RUN-KDUAL-8f0b69-001

  field: >-
    RUN-KDUAL-8f0b69-001/command.txt's archived negative-control command, and the FFT hit
    count it is meant to reproduce (raw-result.json `fft_terms_negative_control: 54`;
    EV-KDUAL-bd9750 OBS-5, "54 FFT hits")
  prior_value: >-
    command.txt records the literal invocation `grep -ciE 'fft' source/*.py` as the
    negative-control command, alongside a reported count of 54 for le_lwe_dual.py.
  corrected_value: >-
    THE ARCHIVED COMMAND, EXECUTED LITERALLY, DOES NOT REPRODUCE THE REPORTED NUMBER.
    `grep -ciE 'fft' source/*.py` counts MATCHING LINES per file (the `-c` flag counts
    lines, not occurrences), and returns 46 for le_lwe_dual.py, not 54. Independently
    traced by the validator: 8 lines in le_lwe_dual.py contain 2 occurrences of "fft"
    each (e.g. `T_fftf(k_fft, p)`), so line-counting (46) and occurrence-counting
    (`grep -io 'fft' file | wc -l` = 54) diverge by exactly 8. The 54 figure IS real and
    independently reproduced under occurrence-counting; the qualitative negative-control
    conclusion (a large, easily detected count versus zero for decoding) holds under
    EITHER convention, and the headline determination of EXP-KDUAL-8f0b69 (no coded/
    decoding stage modelled) is UNAFFECTED. But the actual generation process used
    occurrence-counting while the archived "exact command" artifact records
    line-counting -- a genuine artifact-fidelity defect, not a fabricated statistic (the
    validator independently confirmed 19/19 decod|polar|syndrome hits reproduce exactly
    under EITHER convention, since no line in the relevant file contains more than one
    match, so this specific discrepancy affects only the FFT negative control, not the
    headline finding).

  reason: >-
    A run manifest whose archived command does not reproduce its own reported number,
    even when the qualitative conclusion survives either way, is exactly the kind of
    reproducibility gap an independent check exists to catch. Recording it plainly rather
    than quietly editing command.txt to match preserves the fact that the original
    generation process and the archived reproduction instructions diverged.

  evidence_artifacts:
    - experiments/_reviews/validator-report-20260807-followups.yaml
    - experiments/EXP-KDUAL-8f0b69/runs/RUN-KDUAL-8f0b69-001/source/le_lwe_dual.py

  corrected_command: >-
    The occurrence-counting command that actually reproduces 54:
    `grep -oiE 'fft' source/le_lwe_dual.py | wc -l`. Both this and the original
    line-counting command (`grep -ciE 'fft' source/*.py`, giving 46) are legitimate ways
    to run a negative control and both discriminate correctly (large count vs. zero); a
    future revision of command.txt should record whichever one was actually used, or
    report both conventions explicitly as this correction now does.
