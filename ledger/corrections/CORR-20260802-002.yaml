  reason: >-
    Two independent continuations of the shared BATCH-020 were authored in
    parallel and both spent the same identifiers. The line on branch
    feat/ecdlp-harness-experiments-54a06f reached main first as PR #84 and is
    published under its original ids. The line on branch
    codex/ecdlp-breakthrough-20260801 (PR #92) was authored earlier
    (snapshot 59dbd8fd033c7fe66b4111f4b5563dfbd6da995e, 2026-08-01 12:19) but
    merged later, and collided with 46 already-published records.
    tools/check_merge_hygiene.py forbids resolving such a collision by choosing
    a side: the incoming record must be reissued under the next free id with a
    CORR recording the alias. This record is that alias map. No published
    identifier was reassigned; no record content was edited apart from the
    identifier substitution recorded below.
  divergence_point: >-
    Both lines share BATCH-020 through TASK-20260731-043 at merge base
    c74594cfc168008f86b033fd573e360a607b3939. They diverge at the execution
    task, TASK-20260731-044, and produced two different executions of the
    CTRL-RT025-UNPLANTED control with different measured values and opposite
    admissibility verdicts. Both executions stand; neither supersedes the other.
  substantive_delta: >-
    Identifier substitution only. Every remapped record keeps the bytes of its
    source blob apart from the identifier strings listed in alias_map, and the
    paths derived from them.
