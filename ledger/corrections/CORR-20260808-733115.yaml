correction:
  id: CORR-20260808-733115
  recorded_at: '2026-08-08'
  recorded_by: >-
    top-level session running RQ-FALSIFY-a2c501 (NOT an independent Coordinator
    subagent, and NOT independently reviewed). This correction NARROWS this same
    session's own evidence record and withdraws a novelty claim. It raises
    nothing.
  type: overstated_scope_and_overstated_novelty
  supersedes: []
  corrects:
    - ledger/evidence/EV-FALSIFY-40291d.yaml
  record_type: evidence
  record_id: EV-FALSIFY-40291d

  # ---------------------------------------------------------------- item 1
  field: EV-FALSIFY-40291d "interpretation"
  prior_value: >-
    "The recorded exponents in KN-FIND-d4f820 and KN-FIND-e7a3b1 are fitting
    artifacts of a 4-point design spanning less than one decade with per-point
    noise of the same order as the total effect."
  corrected_value: >-
    TRUE OF KN-FIND-d4f820, NOT ESTABLISHED FOR KN-FIND-e7a3b1.

    KN-FIND-d4f820 describes its own basis as a "4-point scaling" and its title
    scopes it to p = 1009..9001, a range of 8.92x. The identifiability argument
    in O-2 was computed against that range and stands for that record.

    KN-FIND-e7a3b1 states a DIFFERENT basis: "C(p) ~ p^{0.079} measured at
    p=1009..100003 (BATCH-073..079, full k-range DFT)". That is a range of about
    99x, roughly two decades, over which p^0.079 predicts 1.438x total variation
    and p^0.055 predicts 1.288x. Against the 10.8% per-point scatter measured in
    RUN-FALSIFY-d770c1-002, an effect of 1.4x over two decades is NOT obviously
    unresolvable -- it is a far more favourable design than the one tested.

    RUN-FALSIFY-d770c1-002 measured only to p = 9001. It therefore says nothing
    about whether the exponent is identifiable from e7a3b1's wider design, and
    EV-FALSIFY-40291d should not have swept both records into one verdict. The
    finding-level disagreement it reports (a power law versus O(1)) is unaffected
    and still stands; what is withdrawn is the diagnosis applied to e7a3b1.

  # ---------------------------------------------------------------- item 2
  additional_corrections:
    - field: EV-FALSIFY-40291d novelty, implicit throughout
      prior_value: >-
        The record presents the finite-size-artifact diagnosis as this program's
        own finding, and its O-1 states the three-way disagreement is
        "UNRESOLVED".
      corrected_value: >-
        THE DIAGNOSIS WAS ALREADY IN THE REPOSITORY. coordination/goals/
        GOAL-ECDLP-001/batches/BATCH-086/tasks/TASK-20260804-112/
        diagnostic file diagonal_analysis.md, dated 2026-08-04, sets out the same
        argument: it compares p^0.079 (1.65 at p=1009 rising to 2.46 at
        p=100003) against log p (6.9 to 11.5) and concludes "This is numerically
        consistent with 0.079 being a finite-size artifact", further noting that
        at p ~ 2^256 the two diverge to 10^6 versus 177. That is the same
        conclusion RUN-FALSIFY-d770c1-002 reached independently four days later
        by a different route (replicate scatter and a structureless null).
        Independent corroboration is worth having and the null-object evidence is
        new; the DIAGNOSIS is not.
    - field: EV-FALSIFY-40291d "knowledge_promotion"
      prior_value: 'warranted'
      corrected_value: >-
        Unchanged as a disposition -- the design rule is still worth promoting --
        but the promotion text must credit BATCH-086/TASK-20260804-112 as prior
        art within this repository rather than presenting the diagnosis as new.
        Only the Coordinator promotes; this correction narrows what may be
        claimed if it does.

  # ---------------------------------------------------------------- cause
  cause: >-
    Two distinct failures of the same kind, both of reading too narrowly.

    (1) SCOPE. The probe read KN-FIND-d4f820's stated range and applied its
    verdict to KN-FIND-e7a3b1, which states a different and much wider one, in
    the same record. Two findings quoting the same quantity do not thereby share
    a design, and the difference was visible in e7a3b1's own text.

    (2) NOVELTY. Program rule 2 requires a currency sweep of ledger/corrections/
    and the finding front matter before probing. It does NOT reach
    coordination/**, where this repository's actual reasoning lives -- task
    analyses, red-team notes, batch syntheses. The corpus's own analysis of this
    exact question sat in a batch task document that no rule-2 check reads. This
    is the second time under RQ-FALSIFY-a2c501 that a "finding" of this program
    was already recorded elsewhere in the repository; CORR-20260808-3d4031 was
    the first.

  preventive_action: >-
    Rule 2 in docs/falsification-program.md is extended: before probing, grep
    coordination/** for the target identifier and for the quantity by name, not
    only ledger/corrections/ and the finding front matter. A probe may not
    present a diagnosis as new without that sweep. falsify/check_currency.py is
    extended to report coordination/ hits as a separate, explicitly advisory
    signal -- those documents are working notes, not authoritative records, so a
    hit means READ IT, not "the record is stale".

  what_still_stands: >-
    Every measurement in RUN-FALSIFY-d770c1-002, unchanged: the per-prime means
    and standard deviations, the 1.494x within-prime spread at p=1009 exceeding
    the 1.213x across-prime variation over the range TESTED, the fit moving from
    p^0.032 to p^0.097 under resampling, the structureless null fitting p^0.069,
    and the stable 1.300x factor-base-over-null offset that no finding records.
    The null-object result in particular is not anticipated by BATCH-086 and
    remains this program's own contribution. Also unchanged: the corpus does
    carry three different characterisations of C(p) in three live findings, and
    EV-FALSIFY-40291d's caution that the design "cannot distinguish O(1) from
    p^0.08 in EITHER direction" was correct and is now more clearly the right
    reading.
