  record_id: EXP-PMA-001
  corrected_record_path:
  - experiments/EXP-PMA-001/analysis.md (fields: measured comparison statistics table, instance count reconciliation, scope and transfer-assumption disclosure)
  - experiments/EXP-PMA-001/execution-report.yaml (fields: runs.completed[RUN-PMA4-001-{b,d}].result, observations)
  - experiments/EXP-PMA-001/implementation/grid_data.py (field: widening_instance -- behavior clarified, not edited)

  field: >-
    predicate_bruteforce_agreement, n_decided, n_agreement,
    nonvacuous_obstruction_count, false_compatibility_count (all reported
    only on a per-labeled-instance basis in the committed record), and the
    undisclosed box-collision structure of grid_data.py's
    allowed_values(field_label) for F_5 and F_7 (disclosed only for F_3).

  prior_value: >-
    execution-report.yaml and analysis.md report predicate_bruteforce_agreement
    = 34/52 = 0.6538461538461539 (n_decided=52, n_agreement=34),
    nonvacuous_obstruction_count = 16, false_compatibility_count = 18,
    treating each of F_3's 18, F_5's 18, and F_7's 10 labeled instances
    (`grid`/`perturbed`/`widened_grid`) as an independent observation.
    analysis.md's "Scope and transfer-assumption disclosure" section
    discloses that F_3's box collapses to a single element (all 18 F_3
    "instances" are one repeated table) but makes no equivalent disclosure
    for F_5 or F_7, and states no equivalent discount for F_5's or F_7's
    contribution to the numerator/denominator. Neither document mentions
    that grid_data.py's widening_instance(field_label, m) calls the
    identical grid_instance(field_label, m) -- the same parameter box, not
    an enlarged one -- so the "+8 widened instances" specification.yaml's
    widening_fallback describes cannot, as implemented, sample any value
    unreachable by the base grid for a field whose box is smaller than the
    15-subset assignment stride's period.

  corrected_value: >-
    (1) DISTINCT-INSTANCE RECOUNT, computed directly from the already-
    committed RUN-PMA4-001-b/raw-result.json and RUN-PMA4-001-c/raw-result.json
    (grouping each instance's full d_values dict; no rerun) and independently
    verified twice by this Coordinator (matching RT-20260907-0df70c's figures
    exactly both times):

    | field | labeled instances | distinct tables | per-table repeat counts | classification |
    |---|---|---|---|---|
    | F_3 | 18 | 1 | [18] | agreement_compatible_confirmed (already disclosed) |
    | F_5 | 18 | 5 | [6,5,5,1,1] | false_compatibility (NOT previously disclosed) |
    | F_7 | 10 | 3 | [8,1,1] | agreement_obstructed_confirmed (NOT previously disclosed) |
    | Q | 6 | 5 | [2,1,1,1,1] | agreement_obstructed_confirmed (NOT previously disclosed; Q's 45-element box is largely, not fully, unaffected) |

    Root cause (confirmed by reading experiments/EXP-PMA-001/implementation/grid_data.py
    directly): `allowed_values(field_label) = list(range(2, q))` has exactly
    q-2 elements for a finite field F_q (3 for F_5, 5 for F_7; Q's box has 45
    elements from a different construction), while 15 subsets each need a
    d_S value, so by pigeonhole every finite-field instance can realize at
    most q-2 distinct d_S values across those 15 subsets, cyclically
    repeated. This is the SAME defect class already disclosed for F_3 (whose
    q-2=1 collapses all the way to a single table); it was never generalized
    to F_5 (q-2=3) or F_7 (q-2=5), which collapse partially rather than
    completely and so were not flagged by the same "identical table" check
    that caught F_3.

    Recomputed on this distinct-instance basis: n_decided = 1 (F_3) + 5
    (F_5) + 3 (F_7) + 5 (Q) = 14 (not 52). n_agreement = 1 (F_3) + 3 (F_7) +
    5 (Q) = 9 (not 34). predicate_bruteforce_agreement_distinct = 9/14 =
    0.6428571428571429 (close in numeric value to the labeled-basis
    0.6538461538461539 -- a coincidence of this dataset, not evidence the
    distinction is immaterial). false_compatibility_count_distinct = 5 (not
    18), all from F_5's 5 distinct tables. nonvacuous_obstruction_count_distinct
    = 3 (F_7) + 5 (Q) = 8 (not 16). false_obstruction_count is unaffected
    (0 under both bases: no obstruction verdict was ever wrong).

    Both bases must be cited going forward: the labeled-instance basis
    (34/52 etc.) as originally computed, exactly as specification.yaml's
    metric formula defines it over "instances" (a term the frozen contract
    never restricts to distinct tables), and the distinct-instance basis
    (9/14 etc.) as the honest measure of independent mathematical
    observations. Citing 34/52, 18/18, or "the entirety of the F_5 grid" as
    evidentiary weight without this correction's context overstates
    independent sample size by 3.7x on the decided-instance count.

    (2) NARROW STRUCTURAL FAMILY (disclosure, not a new finding beyond
    RT-20260907-0df70c's OBJ-2): all 5 distinct F_5 tables share the
    identical shape forced by the 3-element box -- built from exactly three
    rational functions (t+1)/(t+2), (t+1)/(t+3), (t+1)/(t+4), each repeated
    across 5 of 15 subsets. The direction-2 falsification is scoped to this
    specific repeated-value corner of F_5(t)'s reciprocal-minor instance
    space, not to "F_5" as a whole; whether it holds for a generic
    (non-repeating) F_5(t) table, or for any table outside this corner at
    any field, is untested by this run and is not claimed.

    (3) WIDENING FALLBACK IS A NO-OP FOR F_3 AND F_5: confirmed directly
    from grid_data.py's source --
    `def widening_instance(field_label, m): return grid_instance(field_label, m)`
    -- calls the identical box-construction function used by the base grid.
    For any field whose box has fewer elements than the 15-subset
    assignment stride's period (F_3: box size 1; F_5: box size 3), every
    "widened" instance is mathematically guaranteed to reproduce a table
    already reachable by the base grid; it cannot access a new parameter
    value. Confirmed concretely for F_5: its 8 widened instances collapse
    into the same 5 distinct tables already present among the 10
    base+perturbed instances (no 6th table appears). specification.yaml's
    widening_fallback text ("+8 instances" implying 8 new samples) is not
    delivered as implemented for F_3 or F_5; this is now stated plainly
    rather than left for a reader to infer. This correction does not modify
    grid_data.py: a genuine fix (lifting d_S into a field extension, or
    relaxing the box's excluded-value set) is a design decision affecting
    future runs, not a disclosure fact about the four already-archived ones,
    and is left as a candidate follow-up experiment (see next_action below)
    rather than made unilaterally inside a correction record.

    (4) GROEBNER CONTROL GAP ON F_5 IS NOW CLOSED, as a disclosed, committed,
    first-class artifact: RT-20260907-0df70c.yaml's `independent_verification.
    method_4_groebner_no_normalization` ran an unconstrained (no WLOG
    diagonal-conjugation reduction), 12-unknown, 11-equation Groebner basis
    computation over GF(5).frac_field(t) directly from specification.yaml's
    formulas, on RUN-PMA4-001-b's F_5 instance 0 -- the exact check
    CTRL-PMA4-GROEBNER's pre-declared subsample structurally never reached
    (it covered only F_3 and F_7). Result: basis = [1] (trivial ideal), i.e.
    no 4x4 matrix realization exists even over the algebraic closure of
    F_5(t) -- independently confirming Module B's NOT_EXISTS verdict by a
    method that shares no code with either Module A or Module B. This
    Coordinator additionally spot-checked the review's method_1 factorization
    claim directly (`sympy.factor_list(t**2+1, modulus=5)` returns
    `(t+2)(t-2)`, matching parity_predicate.py's own reported factors
    exactly) rather than trusting the report's prose.

  reason: >-
