correction:
  id: CORR-20260805-9d2e17
  recorded_at: '2026-08-05'
  recorded_by: dispatching-session
  type: proposal_defect_record
  supersedes: []
  corrects:
  - ledger/proposals/IDEA-20260803-202a15.yaml
  authority:
    found_by: coordinator
    found_in: >-
      Conversion of IDEA-20260803-202a15 into H-SDEG-0dd021 / EXP-SDEG-f7faa8 under
      /design-experiment, 2026-08-05.
    independently_verified_by: >-
      dispatching-session, at source, before this record was written. The load-bearing
      finding (D1) was checked against
      coordination/goals/GOAL-DREG-001/batches/BATCH-005/tasks/TASK-20260731-016/results.json
      and ledger/evidence/EV-DREG-008.yaml directly, not against the auditor's
      quotation of them.
  summary: >-
    IDEA-20260803-202a15 IS NOT WITHDRAWN AND IS NOT OVERWRITTEN; it remains committed
    exactly as filed on 2026-08-03 (AGENTS.md rule 4). ITS HEADLINE GATE FRAMING IS
    WRONG. The proposal's central design device - "one closed form must predict BOTH
    committed n=12 deficits (7,110 and 17,947)" - rests on reading 17,947 as a second
    NULL deficit from a second null family. It is not. The frozen contract
    EXP-SDEG-f7faa8 does not inherit the defect: it restates the gate on the two
    genuinely independent null numbers and adds two exact zero-compute controls.
  defects:
  - id: D1
    record: IDEA-20260803-202a15
    field: claim / predictions[two_number_point_prediction] / assumptions
    severity: fatal_to_the_gate_framing
    statement: >-
      17,947 IS NOT A NULL DEFICIT. The committed record shows
      anchors.sr_pred = 156520 and rank_null_restricted = 156520 - IDENTICAL - so the
      support-restricted CTRL-B null's own defect against the semi-regular prediction is
      EXACTLY ZERO. The committed formula is
      deficit_genuine_formula = "rank(null|sem_support) - 138573" with
      anchors.rank_sem = 138573, i.e. 17,947 is the SEM's deficit measured against that
      null as a validating baseline. EV-DREG-008 says so in its own words: the numerical
      equality is "the upper-interval case rank(null|sem_support)=sr_pred". The proposal
      pairs a null deficit (7,110) with a sem deficit (17,947) and calls them two
      measurements of one phenomenon under two null families. They are measurements of
      two different things.
    consequence: >-
      The proposal's stated justification for the two-number design - "a model that
      produces 7,110 under one null family and 17,947 under another, at the same n and D,
      with no parameter tuned to either, is a mechanism" - does not hold as written, and a
      contract built literally on it would have required the model to fit a quantity of a
      different kind.
    repair_adopted: >-
      EXP-SDEG-f7faa8 gates on 7,110 (arm R, EV-SIG-008) and 0 (arm P,
      TASK-20260731-016) - the two genuinely independent NULL numbers - and adds
      G3 (n=9 D6 full-support null = ncols - |V| = 31,179, exactly) and G5 (n=12 D5 arm R
      deficit = 0, exactly). Three of the four gates are EXACT rather than +-5 per cent,
      on the reasoning that a 5 per cent band on G2 admits +-7,826, which is larger than
      the entire G1 effect being measured. 17,947 is retained as a NON-GATING derived
      check with its disposition fixed before the gate, and IR13 makes reporting it as a
      null deficit or as an independent second prediction an invalidation condition.
  - id: D2
    record: IDEA-20260803-202a15
    field: claim / mechanism
    severity: material
    statement: >-
      17,947 CARRIES NO INDEPENDENT INFORMATION. rank_sem = 138573 was already the
      committed BATCH-002 anchor (admission metric
      rank_sem_anchor_138573_unchanged: true) and sr_pred = 156520 was already committed.
      The only new bit in the measurement is that the arm-P null's deficit is 0. The
      proposal presents it as a second independent point target; it is a difference of two
      previously committed numbers.
    repair_adopted: >-
      The contract's gate publishes all three candidate predictions at all nine cells
      including failures, and reports a pass as "1 of 3 pre-declared candidates", so
      information content is stated rather than assumed.
  - id: D3
    record: IDEA-20260803-202a15
    field: confounders / predictions[two_number_point_prediction]
    severity: material
    statement: >-
      TWO COMMITTED SEM READINGS AT n=12 D6 ARE UNRECONCILED AND NEITHER RECORD CITES THE
      OTHER. EV-SIG-008 (seed 2): deficit 17,950, rank_sem 138,570, ncols 174,033, deleted
      16,018. EV-DREG-008 / TASK-20260731-016 (seed 2026): deficit 17,947, rank_sem
      138,573, ncols 174,035, deleted 16,016. The proposal treats the n=12 D6 cell as
      having one committed sem value and does not surface the disagreement.
    repair_adopted: >-
      Carried into the contract as a live HEUR-BF-1 datum. Stage 1 must first verify
      BUILDER IDENTITY between the two producers before any part of the difference is
      attributed to seed spread - a builder difference and a seed effect are not the same
      finding and the contract forbids conflating them.
  - id: D4
    record: IDEA-20260803-202a15
    field: minimal_test.controls (known-shape control)
    severity: minor
    statement: >-
      THE CONTROL'S ANCHOR IS DRAWN FROM A SELF-CONTRADICTORY SOURCE. EV-SIG-006's
      inference states that "every histogram-matched generic null saturates to
      rank = ncols - |V|", but its own observations record N1 at n=9 D6 with rank 28,939
      against ncols - |V| = 29,332 - 393 below. The proposal quotes the inference and not
      the observation.
    repair_adopted: >-
      The known-shape control is anchored to N0 only, where the saturation is actually
      recorded; N1 is reported and non-gating.
  - id: D5
    record: IDEA-20260803-202a15
    field: minimal_test.design (the ladder), estimated_cost
    severity: material
    statement: >-
      THE LADDER FAMILY WAS MIS-SPECIFIED. The proposal assumes an n-ladder without
      pinning the builder's shape. The pinned builder gives nb(n) = n + 3*ceil(n/3),
      i.e. nb = 22/23/28/29 at n = 10/11/13/14, not an nb = 2n family. n=13 is
      constructible (nb=28, 499,178 columns) and does dominate the budget as the proposal
      assumed, but off-lattice constructibility at n = 10, 11, 13, 14 is not automatic.
    repair_adopted: >-
      Contract adds a Stage-2 constructibility check L0 before any off-lattice cell is
      attempted, and retains n=14 as optional and outside the completion gate.
  - id: D6
    record: IDEA-20260803-202a15
    field: assumptions (provenance)
    severity: material
    statement: >-
      THE 7,110 ANCHOR IS THE WEAKEST-PROVENANCE NUMBER IN THE GATE AND THE PROPOSAL DOES
      NOT SAY SO. EV-SIG-008's own artifact_absence_statement records that no claim in it
      is bound to a frozen protocol or a reproducible receipt; it survives via transcript
      and branch exp-sig-008-artifacts d1d36dd.
    repair_adopted: >-
      Carried explicitly in the contract, and IR11 makes citing EV-SIG-008's
      destroyed/unregistrable receipts as a reproduction an invalidation condition. Stage
      2 must re-measure that cell.
  what_this_does_not_do:
  - >-
    It does NOT withdraw IDEA-20260803-202a15, edit it, or change its status. The
    proposal's underlying observation - that the D6 below-freeze collapse is the ECDLP
    line's one live unexplained positive-signal measurement, and that SDEG/DREG/SIG are
    deferring against a model falsified at exactly D6 - stands unrefuted, and is what
    EXP-SDEG-f7faa8 was built to test.
  - >-
    It does NOT assert that the closed form is right or wrong. Stage 1 has not been run.
  - >-
    It moves no exponent, no cost, and no claim tier, and says nothing about ECDLP or
    supersingular-isogeny hardness in either direction. Claim ceiling toy.
