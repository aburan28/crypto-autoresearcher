correction:
  id: CORR-20260905-547849
  recorded_at: '2026-09-05'
  record_type: process
  corrected_record: coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/batch.yaml
  field: blind_phase_hygiene
  goal_id: GOAL-SSI-001
  raised_by: >-
    The Validator executing TASK-20260904-82665d, which interrupted its own
    review to report the hazard rather than holding it until its report was
    finished -- correctly, because the hazard was live and the next dispatch
    would have consumed it. It declined to recommend a remedy, treating that as
    a Coordinator decision, and directed the orchestrating session to read the
    offending commit itself rather than take its word. The orchestrating session
    then verified the leak directly before recording this correction.
  prior_value: >-
    blind_phase_hygiene.rule: "No control-plane artifact of this batch --
    batch.yaml, dispatch_queue.json, any task card, or any ledger handoff copy --
    restates any of the ten PAPER_PAIRS values ... They are named by LOCATOR
    only." With blind_phase_hygiene.why: "This rule is what makes the blind phase
    real rather than declared."
  corrected_value: >-
    THE RULE IS TRUE AS WRITTEN AND DID NOT DO WHAT IT WAS FOR. It enumerates
    FILES, and its guarantee was defeated by something that is not a file: a git
    COMMIT MESSAGE. The corrected statement of the rule is that no artifact
    REACHABLE FROM THE WORKING TREE A BLIND AGENT IS GIVEN -- control-plane file,
    ledger record, OR commit message, tag or note in its reachable history --
    may restate the protected values. A blind phase is bounded by what the agent
    can see, not by what the batch enumerated.
  what_went_wrong: >-
    The orchestrating session committed the six RC-1 producer artifacts alone in
    6eacc1fdf, whose message states all ten values laid out per field size, the
    composed RC-1 verdict, and the "occurs exactly once in the document" finding.
    That commit was then reverted in f8c09984e to satisfy the archive task's
    completion gate. GIT REVERTED THE FILES; A COMMIT MESSAGE CANNOT BE REVERTED.
    6eacc1fdf remains reachable from HEAD, and f8c09984e's own subject line quotes
    the reverted subject verbatim, so `git log --oneline` alone displays the
    composed verdict TWICE -- on the branch TASK-20260904-c8675d was to have been
    run in, before its re-transcription began.
  independently_verified_here: >-
    Confirmed by the orchestrating session, not relayed:
    `git merge-base --is-ancestor 6eacc1fdf HEAD` succeeds; `git log --format=%B
    -1 6eacc1fdf` contains "COMPOSED VERDICT: literals_faithful", the per-field
    pair listing, and the once-only sentence; and `git log --oneline -8` matches
    "FAITHFUL" on two lines. The accepted archive commit 98e3945a5 is clean and
    explicitly affirms no verdict; the defect is confined to 6eacc1fdf and to
    f8c09984e's subject.
  why_no_declared_check_caught_it: >-
    THIS IS THE PART WORTH CARRYING FORWARD. The review plan's `blind_from` is a
    list of file paths and tools/check_review_independence.py can only check
    declared FILE reads. `git log` is not a file read, is not in blind_from, is a
    routine orientation command that any agent may run without suspecting it is
    reading protected content, and displays the answer. No declared check in this
    program could have detected the contamination, and nothing downstream could
    have detected it after the fact either: a re-transcription that agrees
    because it was told the answer is indistinguishable from one that agrees
    because the answer is right. That is precisely the failure the rule existed
    to prevent.
  mitigation_applied: >-
    TASK-20260904-c8675d was dispatched into a DETACHED GIT WORKTREE checked out
    at origin/main, not the working branch. origin/main carries everything the
    task needs -- the frozen paper, the frozen specification, cost_model.py, and
    the whole BATCH-dc1424 control plane, all merged in PR #737 -- and has never
    carried the producer package or the working branch's commit messages. Verified
    before dispatch: 200 commits of the worktree's reachable history contain zero
    statements of the verdict; the producer directory there holds only its task
    card; every declared input resolves. The two occurrences of "106.5" on
    origin/main are coincidental numerics in unrelated GOAL-AES-002 and
    GOAL-ECQ-002 records. Blindness is thereby restored by CONSTRUCTION rather
    than by declaration, which is the same standard the rule's own `why` sets.
  what_is_not_corrected:
    - >-
      HISTORY IS NOT REWRITTEN AND WILL NOT BE. 6eacc1fdf sits beneath an archived
      run record; the remedy for a disclosure defect is never to erase the
      evidence of it, and CLAUDE.md forbids rewriting history over pushed run
      records. The leaky commit and its revert both remain in the branch.
    - >-
      NO SCIENTIFIC CLAIM IS AFFECTED. The RC-1 package itself is unchanged and
      bit-identical (bound at 98e3945a5 by sha256 over all seven paths). Nothing
      here says whether its verdict is right; that is what the two reviews are for.
    - >-
      THE VALIDATOR REVIEW (TASK-20260904-82665d) IS NOT AFFECTED. It is an audit
      of the producer package and is supposed to read it; blindness was never
      asserted for that task in this direction.
    - >-
      THIS DOES NOT ESTABLISH THAT ANY PRIOR BLIND PHASE IN THIS PROGRAM WAS
      CONTAMINATED. It was not checked here, and an unchecked worry is not a
      finding. It does establish that no existing check would have found one.
  consequences:
    - >-
      A BLIND TASK MUST BE GIVEN A WORKING TREE, NOT A RULE. Any future batch
      declaring a blind phase should either dispatch the blind agent into a
      worktree at a base predating the protected result, or verify the reachable
      commit-message history of the tree it hands over. A declaration that
      enumerates file types is not sufficient and now has a worked counterexample.
    - >-
      A COMMIT MESSAGE IS A PUBLISHED ARTIFACT WITH NO UNDO. Writing a result into
      one commits it as durably as writing it into a record, and reverting the
      commit does not retract it. Summary commit messages on producer snapshots in
      a batch with a blind phase should carry locators, under the same PD-2 rule
      the control-plane files already follow.
    - >-
      tools/check_review_independence.py CANNOT SEE THIS CLASS OF LEAK and should
      not be read as evidence of blindness on its own. Extending it to inspect the
      reachable history of the tree a blind agent is given is a concrete,
      cheap successor; it is named here and NOT implemented as part of this
      correction.
