        command writes none, so the 8 attempts are neither accounted nor
        listed as "without retained output". The segment total of 72 SC-4
        rows (36 G1, 36 G2) therefore covers 72 of the 80 wrapped S-1
        attempts of segment 1 (report line 6611), not all of them. Whether
        the SC-3 invariant holds on the 8 G4 outputs is NOT KNOWN; it is not
        computed here and is not inferred.
      evidence: >-
