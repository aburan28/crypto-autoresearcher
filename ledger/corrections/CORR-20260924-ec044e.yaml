          rlimit_as_child_getrlimit {soft 10737418240, hard 10737418240}
          (read directly for ctl_S3.meta.json lines 83-86; all 11 per the
          execution report gate_outcome.g4_checker_failure and the dispatching
          session's reproduction, receipt dispatcher_checks line 1267).
        - 8 wrapped msolve solves (solver/ctl_identity_random,
          ctl_rawx_random, ctl_identity_planted, ctl_rawx_planted,
          ctl_planted_S3, ctl_planted_S3_rescaled, ctl_planted_torsion_S3_rq,
          ctl_planted_torsion_S3_norm; solver-events.json counters
          wrapped_calls 8, attempts_total 8): their read-back pairs are
          RECORDED NOWHERE in the package. The frozen solve() puts the pair
          into its returned result (v2_driver.py lines 166-169, _slim lines
          150-154), and the frozen cmd_controls keeps only D, outcome and
          solution sets of that result in its checks block (v2_driver.py
          lines 786-795, 841), so raw-result.json carries no
          rlimit_as_child_getrlimit key (dispatching session, receipt line
          1267) and one "threads" key only (raw-result.json line 516, not a
          per-child record). The msolve child's stdout and stderr go to
          .ms.log and .ms.err, and the read-back travels by a pipe to the
          parent (v2_solver.py lines 188-227), so the log files do not carry
          it (read for ctl_planted_S3.ms.log and .ms.err; the other seven not
          opened). ctl_planted_S3.ms.err shows "#threads 1" (line 15).
        - The r3 collector builds the manifest lists only from
          rlimit_as_child_getrlimit and threads_executed keys in
          raw-result.json (r3_run_wrapper.py lines 510-511); it reads neither
          child/*.meta.json nor solver-events.json.
        WHAT CAN BE SAID OF THE 8 SOLVES' ENVELOPE, AND ON WHAT BASIS: the
        frozen run_child sets RLIMIT_AS in the child and exits the child
        before exec if the read-back soft or hard limit differs from the
        requested cap (v2_solver.py lines 193-201), and the parent refuses to
        start it on a soft mismatch (lines 228-232). Each of the 8 solves has
        a retained .ms.out, so each child exec'd msolve. That the cap held for
        them is therefore an INFERENCE FROM FROZEN CODE, not a recorded
        observation, and it is labelled so wherever it is used.
