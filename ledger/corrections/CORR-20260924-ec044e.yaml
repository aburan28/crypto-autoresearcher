      corrected_value: >-
        19 capped children ran; the lists are empty because of WHERE the
        read-backs are, not because none exists or none was taken:
        - 11 BUILDER children (child/ctl_identity_n3, ctl_raw_random,
          ctl_raw_planted, ctl_identity_n5_m3, ctl_raw_n5_m3,
