correction:
  id: CORR-20260809-b1c790
  recorded_at: "2026-08-09"
  record_type: claim
  record_id: ID-COLLISION-AES-DECISION-BLOCK-THIRD-OCCURRENCE-DEC-20260731-025-032
  field: decision_record_reachability_on_main

  scope_statement: >-
    REPRESENTATIONAL / ARCHIVAL METADATA ONLY, exactly as CORR-20260731-007 was.
    This correction concerns WHICH RECORD IS REACHABLE AT WHICH IDENTIFIER ON
    main AND NOTHING ELSE. It asserts no research content. It reviews no
    evidence, creates no hypothesis, changes no hypothesis status, approves no
    experiment, promotes no claim, and closes no goal. It asserts NOTHING about
    AES at any round count, nothing about full-round or deployed AES, nothing
    about ECDLP, and nothing about any other cryptosystem. No decision content,
    rationale, disposition, target_ids, claim, claim tier, scope, success
    criterion, falsification criterion, completion criterion, pause condition,
    budget, authority, evidence strength or status is altered by this record.
    IT MOVES NOTHING AND EDITS NOTHING; it records a loss of reachability and
    supplies the rule by which an existing citation is read.

  recurrence_note: >-
    THIS IS THE THIRD OCCURRENCE OF THE SAME ALLOCATOR FAILURE ON THE SAME BLOCK
    OF RECORDS, and the second time the AES campaign's decision block has been
    displaced. CORR-20260731-008 recorded the first occurrence (GOAL-AES-001
    BATCH-002 remap). CORR-20260731-007 recorded the second, a twelve-way add/add
    collision, and resolved it by moving this branch's DEC-20260731-013..020 to
    DEC-20260731-025..032 under "first author owns the id". THE REMAP TARGET
    RANGE HAD ITSELF ALREADY BEEN ALLOCATED, independently and concurrently, to
    GOAL-ECDLP-001 records. The remap was therefore correct in principle and
    landed on occupied ground in fact, for precisely the reason CORR-20260731-007
    itself named: a directory scan answers about the wrong universe. This is
    further evidence for the finding in knowledge/findings/KN-FIND-030.md that
    the defect is in the ALLOCATOR and not in any individual act of allocation,
    and it is the case that AGENTS.md rule 14 (random 6-hex tokens, minted
    without scanning state) exists to make impossible. Every identifier minted by
    this correction uses that allocator.

  prior_value:
    reachable_at_the_eight_paths: >-
      At commit a042c5b18e3f82e072dda806dfd341ad5eefca63 (2026-08-01, "Merge PRs
      #90-#93 with identifier remaps and CI repairs"), main's tree carried the
      GOAL-AES-001/-002/-003 coordinator decisions at
      ledger/decisions/DEC-20260731-025.yaml through DEC-20260731-032.yaml. Those
      eight records were published to main by commit
      e19dd974aaa04ac9f65472b0febb2e17b78ebdaf (PR #96, 2026-08-01, "research:
      AES campaigns GOAL-AES-001/002/003 - reduced-round attacks, distinguishers,
      and an ID-allocator finding"), which added all eight paths, under the remap
      declared by CORR-20260731-007.

  corrected_value:
    reachable_at_the_eight_paths: >-
      At origin/main b31a3f47ff0bdcdf379d52c1fb54e7efe6a38d5a (2026-08-09, the
      base commit of the session recording this correction), all eight paths
      carry `goal_id: GOAL-ECDLP-001` records. The change was made by commit
      fdf3a9fba1dcace5b366c61ea9fed87580f0f822 (2026-08-02, "Merge pull request
      #118 from aburan28/cursor/ecdlp-batch-034-036-continue"), whose diff status
      for each of the eight paths is `M` (modify), not `A` (add). THE EIGHT AES
      DECISION RECORDS ARE THEREFORE NOT REACHABLE FROM main's TREE. Their bytes
      are not destroyed: they remain in the tree objects of e19dd974a and
      a042c5b18 and are recoverable verbatim with
      `git show e19dd974a:ledger/decisions/DEC-20260731-0NN.yaml`.

  verification:
    method: >-
      Blob-level comparison of the same eight paths across four named commits,
      plus `git diff --name-status` of the replacing merge. No figure below is
      estimated, relayed, or inferred from a commit message; each was read from a
      git object in the worktree at
      /Volumes/SSD990/crypto-autoresearcher/.claude/worktrees/practical-mahavira-c4d298
      with HEAD at b31a3f47ff0bdcdf379d52c1fb54e7efe6a38d5a.
    commands_run:
      - "git show <rev>:ledger/decisions/DEC-20260731-0NN.yaml  (NN = 25..32; rev in {a042c5b18, fdf3a9fba, e19dd974a, origin/main})"
      - "git diff --name-status fdf3a9fba^1 fdf3a9fba -- ledger/decisions/"
      - "git merge-base --is-ancestor e19dd974a origin/main   (exit 0: PR #96 IS an ancestor of main)"
      - "git log --first-parent --format='%H %ad %s' --date=short origin/main -- ledger/decisions/DEC-20260731-030.yaml"
    per_path_result: >-
      All eight of DEC-20260731-025..032 read AES at a042c5b18 and ECDLP at
      fdf3a9fba. The flip is uniform across the block; there is no path where the
      AES record survived and none where the ECDLP record was displaced instead.

