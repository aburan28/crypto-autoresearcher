    descriptions_source: >-
      The eight one-line descriptions above are quoted from CORR-20260731-007's
      own `remap.decisions` table, which is committed and reachable on main. They
      are NOT re-derived from the lost records and are NOT a summary of their
      content; the records themselves are recoverable at e19dd974a for any reader
      who needs their text.
    survived_on_main:
      - "knowledge/findings/KN-FIND-028.md and KN-FIND-029.md (the two AES knowledge promotions) are present on main with AES content."
      - "ledger/corrections/CORR-20260731-007.yaml and CORR-20260731-008.yaml are present on main with AES content."
      - "The GOAL-ECDLP-001 records now occupying DEC-20260731-025..032 are valid, are owned by that campaign, and are bound by EXP-DS-001 archives. NOTHING IN THIS CORRECTION TOUCHES THEM."

  additional_exposure_not_claimed_as_loss: >-
    THE BLAST RADIUS OF fdf3a9fba IS WIDER THAN THE EIGHT RECORDS ABOVE AND IS
    STATED HERE RATHER THAN OMITTED. That merge carries diff status `M` on 22
    decision paths in total, including DEC-20260730-002, DEC-20260731-011..020,
    DEC-20260731-022..024, and DEC-20260801-001..002. For the fourteen paths
    outside the AES block THIS CORRECTION ESTABLISHES NOTHING: it was verified
    only that the blob changed, NOT what the pre-image record was, NOT whether
    the pre-image belonged to a different campaign, and NOT whether the change
    displaced a distinct record or was a same-campaign edit. A modify on an
    immutable record path is on its face inconsistent with AGENTS.md core rule 4
    ("Results are immutable records. Corrections create new records"), but
    inconsistency-on-its-face is not a finding of loss, and none is asserted.
    NO COUNT OF LOST RECORDS BEYOND EIGHT IS CLAIMED HERE. Auditing those
    fourteen paths requires reading each pre-image and is named as an open item
    below.

  consequence_for_live_citations: >-
    Three live goal records cite decisions in the affected block as their own
    authority, and on main's tree those citations resolve to a different
    campaign's records:
    (i) ledger/goals/GOAL-AES-001.yaml `next_action` states that the BATCH-005
    ranked shape is bound "IN THE RANKED SHAPE DEC-20260731-030 BINDS ON ITS
    AUTHOR";
    (ii) ledger/goals/GOAL-AES-001.yaml `budget_accounting.standing_limit` states
    that protocol-amendment-GOAL-AES-001-005 "was authored and APPROVED in
    DEC-20260731-030", which is what holds the campaign at `active` rather than
    `paused` and what carries the 20000 -> 34500 s ceiling;
    (iii) coordination/goals/GOAL-AES-001/amendments/protocol-amendment-GOAL-AES-001-005.yaml
    carries `decision_ref: DEC-20260731-030`.
    GOAL-AES-002 and GOAL-AES-003 were opened by DEC-20260731-031 and -032
    respectively and are affected the same way. The dispatch queues at
    coordination/goals/GOAL-AES-001/batches/BATCH-002,003,004/dispatch_queue.json
    and coordination/goals/GOAL-AES-003/batches/BATCH-001/dispatch_queue.json
    also reference identifiers in the range.

  reader_rule: >-
    THIS IS THE OPERATIVE OUTPUT OF THIS CORRECTION. A citation of
    DEC-20260731-025 through DEC-20260731-032 is disambiguated BY CAMPAIGN
    CONTEXT, not by path:
    - Cited from a GOAL-AES-001, GOAL-AES-002, GOAL-AES-003, RQ-AES-*, EV-AES-*,
      H-AES-*, KN-FIND-028/029, or coordination/goals/GOAL-AES-* record, the
      citation means THE AES RECORD, whose verbatim text is at
      `git show e19dd974a:ledger/decisions/DEC-20260731-0NN.yaml`.
    - Cited from a GOAL-ECDLP-001, SG-ECDLP-001, EXP-DS-001, EXP-IT-001 or other
      ECDLP record, the citation means THE ECDLP RECORD, which is the one at that
      path on main.
    This rule binds READING ONLY. It confers no authority that the cited record
    did not already carry, and it does not make a recovered record a substitute
    for one that main can serve: a reader who cannot run git against e19dd974a
    cannot read the AES records at all, and that is the actual cost being
    recorded here.

  what_was_not_done_and_why:
    no_third_remap: >-
      The AES records were NOT re-minted at fresh identifiers by this correction.
      AGENTS.md rule 15 makes a remap a last resort and requires checking whether
      the identifier appears in a completed archive's binding fields before one is
      attempted. IT DOES, ON BOTH SIDES: the AES BATCH-002/003/004 dispatch queues
      and the GOAL-AES-003 BATCH-001 queue name identifiers in this range, and the
      GOAL-ECDLP-001 side is bound by EXP-DS-001 amendments, controls, runs and
      results. A third remap of a block that has already been remapped twice, in
      a session that cannot obtain independent review, is the change most likely
      to make the next reader's problem worse. The repair is named as an open item
      and deliberately left to a session that can obtain review.
    no_edit_to_the_ecdlp_records: >-
      The GOAL-ECDLP-001 records at these paths are untouched. Editing them would
      be resolving an add/add identifier collision by picking a side, which
      AGENTS.md "Durable research commits" forbids and which CORR-20260731-007
      already ruled a category error.
    no_history_rewrite: >-
      Nothing is rebased, force-pushed, or reverted. fdf3a9fba is pushed history
      and stays exactly as it is.

  open_items:
    - "REPAIR OPTION A (republish): re-mint the eight AES decisions at fresh random-token identifiers with content recovered verbatim from e19dd974a, annotated with their original identifier and recovery commit, and record the mapping. Cost: the AES dispatch queues and archive receipts that name DEC-20260731-025..032 then name identifiers no live record carries, which is the exact breakage AGENTS.md rule 15 warns a remap creates. Benefit: main can serve the records."
    - "REPAIR OPTION B (reader rule only): leave the identifiers as they are and rely on the rule recorded above. Cost: the AES records stay unreachable from main's tree and every future reader needs git archaeology. Benefit: no archive's binding fields are invalidated. THIS CORRECTION ENACTS OPTION B AS THE INTERIM STATE; it does not rule out Option A."
    - "AUDIT the fourteen non-AES paths modified by fdf3a9fba (DEC-20260730-002, DEC-20260731-011..020, -022..024, DEC-20260801-001..002): read each pre-image at fdf3a9fba^1, determine whether a distinct record was displaced, and record the result. NOT PERFORMED HERE and no result is assumed."
    - "The choice between Option A and Option B, and the audit above, both warrant an independent reviewer. The session recording this correction was a coordinator-only scheduled run and could not obtain one; that limitation is stated rather than worked around."

  reason: >-
    Recorded so that the loss is visible in the ledger rather than discovered
    again by the next session that tries to act on GOAL-AES-001's next_action and
    finds its binding authority pointing at another campaign's record. The
    immediate trigger was a scheduled coordinator run that selected GOAL-AES-001
    to draft its BATCH-005 queue and could not honestly cite DEC-20260731-030 to
    do it.

