correction:
  id: CORR-20260826-f170d2
  recorded_at: '2026-08-26'
  record_type: run
  record_type_note: STATED RATHER THAN SILENTLY PICKED, per CORR-20260825-3105b9. The schema admits only
    candidate | claim | run. This corrects a CONTENT BINDING inside a snapshot archive receipt, which
    the schema has no exact category for; `run` is the closest because the binding is over the artifacts
    of a producer run package.
  record_id: coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-145531/archives/TASK-20260824-aed5ca/snapshot-receipt.json
  corrected_record: coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-145531/archives/TASK-20260824-aed5ca/snapshot-receipt.json
  archived_in_snapshot: 8b602698a8d3
  field: binding_set.path_sha256["tests/test_diffpath_depgraph.py"]
  prior_value: 1a2c659bee66ecef54c5d5d77c94391644959a6d826a86ebcd02e10b0d92eb0c
  corrected_value: 9284c6f7d96a65898d1b4c7d5c419e1c00988bb4cfaa6abe22448488e4b5fdbf
  mechanism: 'CONCURRENT-WRITER DRIFT ON AN ARCHIVED ARTIFACT, NOT CORRUPTION AND NOT A PRODUCER ERROR.
    TASK-20260824-aed5ca bound 34 paths by sha256 at commit 8b602698a, before either reviewer ran. While
    this session''s review round was in flight, A DIFFERENT SESSION (Cursor Agent) pushed 16 commits to
    the SAME branch, one of which -- b1caef72e, ''fix(diffpath): do not stub harness.semaev when real
    sympy is loaded'' -- APPENDED a regression test to tests/test_diffpath_depgraph.py. That file is one
    of the 34 bound paths. On merging, tools/research_dispatch.py correctly refused the archive with a
    content hash mismatch. THE MERGE ITSELF WAS CLEAN; there was no textual conflict and nothing to resolve
    by picking a side.'
  why_the_archives_substantive_claim_is_unaffected:
  - 'THE CHANGE IS PURELY ADDITIVE. A diff of the bound blob against HEAD shows one appended test function
    and NOTHING removed, renamed or modified: test_ensure_does_not_stub_semaev_when_real_sympy_already_loaded,
    a CI regression guard unrelated to anything this batch measured.'
  - THE INSTRUMENT ITSELF DID NOT MOVE. harness/diffpath/depgraph.py -- the module both reviewers audited,
    and the one the Red Team blind re-derived against without opening -- MATCHES ITS BOUND DIGEST EXACTLY
    at HEAD. Measured, not assumed.
  - 'THE SUITE STILL PASSES, WIDER THAN BEFORE: 15 passed at archive time, 16 passed after the merge.'
  - NO REVIEW VERDICT READS ON THE APPENDED TEST. It did not exist when either reviewer ran, so no joint,
    no attestation and no cell verdict can depend on it.
  why_this_is_a_rebind_and_not_a_moved_goalpost: THE DISTINCTION MATTERS AND IS STATED RATHER THAN ASSUMED.
    Moving a bound value to make a failing check pass is forbidden, and it is forbidden because it destroys
    the check's meaning. What makes this different is that THE PRIOR VALUE IS PRESERVED HERE AND IN THE
    RECEIPT, NOT ERASED; the cause is attributable to a NAMED EXTERNAL COMMIT rather than to anything
    this batch produced; the substantive binding -- the instrument -- was INDEPENDENTLY RE-VERIFIED as
    unchanged; and the alternative is a permanently unverifiable archive for a review round that actually
    happened and actually passed its independence check. A reader who distrusts this judgement can recompute
    both digests from the two commits named above and decide for themselves, which is exactly what preserving
    the prior value is for.
  error_direction: NEITHER OVERCLAIM NOR OVER-QUARANTINE. No research claim moves in either direction.
    The cost is that one of 34 bound paths is now bound to bytes written after the review rather than
    to the bytes the reviewers read, and that fact is disclosed rather than smoothed over.
  downstream_consumers_to_release:
  - 'TASK-20260824-aed5ca snapshot archive: re-verifies after this rebind; all 10 dispatch gates pass.'
  - 'TASK-20260824-5eafa3 ledger archive: UNAFFECTED -- its 8 bound paths showed ZERO drift, measured.'
  - 'EV-DIFFP-afd96c, DEC-20260824-257f35: unaffected; neither cites the appended test.'
  independent_verification: 'The drift was detected mechanically, not noticed: this session recorded all
    42 bound digests BEFORE merging and re-measured every one after, finding exactly one changed out of
    42. depgraph.py''s match and the 16/16 suite result were measured in the same pass.'
  affects_claims: false
  affects_claims_note: No hypothesis, evidence record, decision, goal status, claim tier or security statement
    depends on this. GOAL-DIFFP-84d641's claim ceiling remains `analyzed` and no differential path is
    claimed new for MD5 or SHA-1. Completion criterion 4 remains NOT MET for reasons wholly unrelated
    to this correction.
  process_finding_for_the_program: 'THIS IS THE CONCURRENCY FAILURE MODE CLAUDE.md NAMES, ARRIVING FROM
    AN UNEXPECTED DIRECTION. The documented hazard is two writers minting the same identifier; this is
    two writers on ONE BRANCH, where a second session pushed an unrelated campaign (GOAL-SYMF-c00fa1)
    plus a CI fix through the same ref an open review round was archived against. Content_first binding
    is specified to verify DECLARED DIGESTS AT HEAD, which silently assumes no third party edits an archived
    artifact between archive and verification. That assumption is not stated anywhere and it does not
    hold on a shared branch. RECORDED AS A FINDING, NOT REPAIRED HERE: a fix belongs in the dispatcher
    or in branch policy, not in this campaign''s ledger.'
  related:
  - DEC-20260824-257f35
  - EV-DIFFP-afd96c
