  id: CORR-20261010-db44b4
  recorded_at: '2026-10-10'
  recorded_by: coordinator
  goal_id: GOAL-GFPN-380702
  batch_id: BATCH-e409ca
  archived_by: TASK-20261010-7e1601
  record_type: archive_procedure
  record_id: TASK-20260925-0ed1be
  corrects:
    - TASK-20260925-0ed1be
  field: phase_b archival method and completion state
  prior_value: >-
    TASK-20260925-0ed1be phase_b requires a single new Phase-B commit
    changing every returned R2-r5 run-package file, the execution report,
    and post-run-receipt.json. Its verifier_standard compares that commit's
    changed paths to the declared staged paths. The card's Phase-A receipt
    exists; its Phase-B post-run receipt does not.
  actual_state: >-
    The producer had already committed the four returned R2-r5 run
    directories and execution-report-v2-r5.yaml in five separate commits,
    all tracked on current main. G1 RUN-GFPN-4d1ac0 was introduced by
    7d7ca64dfb6eadccc234bdbf3e3aeff0435d5898 (337 changed paths);
    G2 RUN-GFPN-d98707 by
    fbd12d5b9284dd849ed1806b3d4d811809e089e0 (319);
    G3 RUN-GFPN-347fde by
    61004685f4750553a59bc4ee7a776cb5e69754f2 (13);
    G4 RUN-GFPN-0037fb by
    fdf9aa1c942050d77ead194dbe3878cde054d17f (101);
    the execution report by
    bc3abe8e463b2b23c9a20725ad955b29f7c2b3ac (1).
    These are 771 tracked paths in total. The successor receipt must
    verify every path and
    byte count independently, and report any discrepancy. A clean current
    tree and the presence of those files do not themselves complete Phase B.
  corrected_value: >-
    The old task's Phase B remains incomplete and its required one-commit
    path-diff method cannot be performed honestly on already committed,
    immutable producer artifacts. DEC-20261010-fb6792 authorizes the
    separate content-first custody task TASK-20261010-0fda2f to bind the
    existing five commits and the exact returned file inventory in a new
    receipt commit. This supersedes only Phase B's archival method, never
    the original scientific protocol, the run records, the Phase-A receipt,
    or the Phase-B checks and outcome gates. No old record is edited.
  reason: >-
    A receipt-only commit under the old card would not have the changed-path
    set its completion_gate and verifier_standard require. Rewriting or
    re-adding the run files solely to manufacture such a diff would conceal
    their producer provenance and violate immutable-result handling.
    AGENTS.md permits the run entry point to commit its own records and
    requires archive receipts to bind content first; an additive custody
    record can test those existing commits without changing their bytes.
  preserved_observations:
    - >-
      The executor report says G1, G2, and G4 completed_valid; G3 failed
      at the comparator because /opt/conda-sage/envs/sage/bin/python was
      absent on that host. This is infrastructure, not hypothesis evidence.
    - >-
      G4 was launched about two seconds after G3 had ended failed, contrary
      to the stated stop-after-gate rule. Preserve G4 and the disclosed
      sequencing deviation; do not silently accept it as an admissible
      post-gate package.
  evidence_artifacts:
    - ledger/handoffs/TASK-20260925-0ed1be.yaml
    - coordination/goals/GOAL-GFPN-380702/archives/TASK-20260925-0ed1be/snapshot-receipt.json
    - coordination/goals/GOAL-GFPN-380702/batches/BATCH-e409ca/claims/TASK-20260925-480d02.2.release.json
    - experiments/EXP-GFPN-05ff43/trial-plan-v2-r5.json
    - experiments/EXP-GFPN-05ff43/execution-report-v2-r5.yaml
    - experiments/EXP-GFPN-05ff43/runs/RUN-GFPN-4d1ac0/
    - experiments/EXP-GFPN-05ff43/runs/RUN-GFPN-d98707/
    - experiments/EXP-GFPN-05ff43/runs/RUN-GFPN-347fde/
    - experiments/EXP-GFPN-05ff43/runs/RUN-GFPN-0037fb/
  interpretation_limits:
