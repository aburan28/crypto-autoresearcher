  finding_1_this_coordinators_own_m3_design_defect: >-
    EXP-MONO-0e6e8f's own frozen contract specified M3 (a chi-square
    goodness-of-fit test against the ASYMPTOTIC S_4 Chebotarev density)
    without accounting for a confounder IDEA-20260904-ad63fe's OWN text
    already named in advance: "STRATUM POOLING" -- pooling two O(1/p)
    exact-combinatorics strata (the g-splits-completely case's own
    sub-classification into 1^4 vs 2+2) into a test whose null assumed the
    infinite-p asymptotic density. The Red Team independently derived the
    EXACT finite-p law for this sub-split (a closed form in the curve's
    own trace t and admissible-point count N=p-Z, using the character-sum
    identity Sum_t chi(f(t)) = -t exactly, a consequence of Hasse's bound)
    and showed a three-term exact model (that law, plus the non-squarefree-g
    stratum, plus a 2-torsion leakage term) reproduces the exhaustive
    censuses ESSENTIALLY INTEGER-FOR-INTEGER. Against this exact null,
    the chi-square statistics collapse dramatically: C2's 1765.88 falls to
    0.23; C4's 12.13 falls to 0.73; C1's 1175.81 falls to 171.67 (with a
    specifically identified residual 2,459-instance stratum explaining
    most of the remainder). M3, as specified, was GUARANTEED to be of
    order 10^3 at p=101 with n~10^6 regardless of whether full S_4
    monodromy actually holds -- a genuine contract defect, not a finding
    about the monodromy.
  finding_1_disposition: >-
    M3's own reported value (2447.84) is NOT carried forward as evidence
    of any kind (neither "consistent with S_4" nor "an open anomaly") --
    it tested the wrong null and its own reported significance is an
    artifact of that defect. The genuinely diagnostic statistics are the
    RECOMPUTED chi-squares against the Red Team's own exact model
    (0.23-171.67, the residual on C1 traced to an identified stratum, not
    an open question).

  finding_2_this_coordinators_own_speculative_mechanism_was_wrong_even_though_its_conclusion_was_right: >-
    This Coordinator's own recorded prior (in TASK-20260904-5fcc1a)
    speculated the M3 excess was "consistent with an ordinary O(1/sqrt(p))
    finite-field correction," citing the deviation's own 3-7x shrinkage
    from p=101 to p=1009 as supporting evidence. The Red Team's own exact
    derivation shows this MECHANISM IS WRONG: the g-splits-or-not step has
    EXACT O(1/p) (not O(1/sqrt(p))) combinatorial corrections with no Weil-
    type term at all, and the observed shrinkage ratios (2.27-10.22 across
    different curve pairs) do NOT fit a single O(1/sqrt(p)) power law --
    they fit the Red Team's own exact, curve-dependent (trace-dependent)
    formula precisely, pair by pair. The bottom-line conclusion (the
    excess is benign, not a structural monodromy deviation) was correct;
    the specific reasoning offered for it was not, and is corrected here
    rather than silently left standing.
  finding_2_disposition: >-
    This Coordinator's own "3-7x, consistent with O(1/sqrt(p))" reasoning
    is WITHDRAWN and replaced by the Red Team's own exact derivation. This
    is recorded as a genuine instance of this lane's own established
    discipline: a plausible-sounding post-hoc explanation for an anomaly
    must still be independently verified, even when its bottom-line
    conclusion turns out to be correct.

  finding_3_new_lead_the_matched_tz_control_reveals_the_same_hash4_invariant_this_session_already_found_elsewhere: >-
    The Red Team independently ran the matched-(t,Z) control
    IDEA-20260904-ad63fe's own text deferred, and found it HOLDS on the
    admissible stratum but FAILS on this experiment's own reported pooled
    counts: two curves over F_101 with IDENTICAL (t,Z)=(-10,3) give
    materially different class-count distributions ({1^4: 38180, 2+2:
    107184, 2+1+1: 6732} vs {38092, 107008, 6996}). The separating
    invariant is #E(F_p)[4] = 16 vs 8 -- INVISIBLE TO (t,Z). This is the
    SAME invariant (#E[4], beyond (N,tau)) this session's own H-MONO-93bc4d/
    H-MONO-1d50ac chain independently established as the missing term in
    H-MONO-45183a Part B's own m=4 collision-rate closed form -- an
    entirely DIFFERENT experimental question (root-multiplicity collision
    rate, not symmetric-base monodromy census), now showing the SAME
    hidden variable governs finer structure than (N,tau)/(t,Z) captures.
    The Red Team is explicit and correctly scoped: this is "a spawned lead
    for RQ-MONO-001's exceptional-locus half, not evidence" -- disclosed
    here as a genuinely valuable, convergent, cross-experiment structural
    theme, not as a new claim.
  finding_3_disposition: >-
    Recorded as a named open lead, not evidence. Given #E[4] has now
    appeared as the operative finer invariant in TWO independent m=4
    investigations this session (collision rate, and now symmetric-base
    monodromy structure), this is worth a dedicated, properly pre-
    registered follow-up in a future batch, cross-referencing both
    precedents explicitly.

