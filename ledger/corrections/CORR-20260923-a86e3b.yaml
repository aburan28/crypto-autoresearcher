# =============================================================================
# CORR-20260923-a86e3b -- procedural nonconformances in the production and
# archiving of RUN-CERTBIN-3b7e05 (EXP-CERTBIN-4e92d7 v1, TASK-20260923-6f1ad4),
# disclosed as defects D-1..D-5 in the TASK-20260923-c2e57b snapshot receipt.
#
# WHAT THIS CORRECTS: the procedural record of how the run was produced and
# archived. No measured value, seed, count, threshold, verdict or artifact byte
# changes. The immutable records keep their text; this record supplies the
# corrected reading beside them. Rulings on consequences are
# DEC-20260923-4d7a19's (R-1..R-5); this record states the facts.
#
# ID PROVENANCE (disclosed): minted without a shell (random 6-hex token, checked
# free by path glob and ledger grep only). TASK-20260923-e3b590 SC-1 runs
# `tools/allocate_id.py --check` before commit.
# =============================================================================
correction:
  id: CORR-20260923-a86e3b
  recorded_at: '2026-09-23'
  recorded_by: coordinator
  authorizing_decision: DEC-20260923-4d7a19
  archived_by: TASK-20260923-e3b590

  record_type: run
  record_id: RUN-CERTBIN-3b7e05
  also_concerns:
    - TASK-20260923-6f1ad4 (executor card; inference block, write_scope)
    - TASK-20260923-c2e57b (run snapshot archive; its receipt's sc1_defects)
    - DEC-20260923-b85c30 (approved the executor card with an inference block this runtime could not serve)
    - tools/run_supersession_registry.yaml (entry for RUN-CERTBIN-3b7e05, task_id TASK-20260923-c2e57b)

  items:
    - id: C1
      receipt_defect: D-1
      field: manifest.yaml run.artifacts (list of artifact hashes)
      prior_value: The manifest's artifacts list omits runs/RUN-CERTBIN-3b7e05/implementation.md.
      corrected_value: >-
        implementation.md was written after phase 8. The manifest does not bind
        it, but it IS bound by sha256 54f6c3a4...a488 in the TASK-20260923-c2e57b
        snapshot receipt (path_sha256), which is the durable binding.
        manifest.yaml and manifest_v2.yaml are NOT amended for it. It is a
        producer note written after the run. Reviewers read it as producer
        narrative, not as a run output, and it is in the blind re-deriver's
        blind_from.
    - id: C2
      receipt_defect: D-2
      field: TASK-20260923-6f1ad4 write_scope
      prior_value: >-
        The executor wrote only within experiments/EXP-CERTBIN-4e92d7/impl/,
        trial-plan-v1.json and runs/RUN-CERTBIN-3b7e05/.
      corrected_value: >-
        The executor also ran three development executions of its
        implementation. They used non-declared seeds (777000.., 555000..) and 30
        or 130 targets, and wrote to /home/user/certbin-dev/, which is outside
        the repository and outside write_scope. This is disclosed in
        implementation.md, "Development testing". By the executor's account,
        no frozen seed stream except S_selftest was drawn before the frozen
        run, and the development outputs were used only to fix plumbing. The
        development directory is not archived and is not evidence. No reviewer
        reads it. Its account is unverifiable from archived bytes.
    - id: C3
      receipt_defect: D-3
      field: execution environment (outside write_scope)
      prior_value: The run used the machine's existing Python environment.
      corrected_value: >-
        The system python3 had no numpy. The executor installed numpy 2.4.6
        with `pip install --user numpy` into /root/.local before any run. This
        is recorded in environment.json and in the manifest (numpy_version
        2.4.6). Reproduction from seeds is bound to numpy 2.4.6.
    - id: C4
      receipt_defect: D-4
      field: TASK-20260923-6f1ad4 inference.fallback_allowed / RUN-CERTBIN-3b7e05 manifest inference
      prior_value: >-
        The card requested executor-implementation with fallback_allowed: false.
        On the anthropic backend that binds to claude-sonnet-5.
      corrected_value: >-
        The executor subagent was served by the session model claude-opus-5-5.
        Claude Code subagents run with `model: inherit`, and per-role model
        selection on this runtime is process-level (CLAUDE.md, model policy
        note). So a substitution the card did not permit occurred. The
        manifest records it openly: fallback_used true, a stated reason,
        degraded_requirements [] and model_verified false. It was not a silent
        substitution. The root cause is that the Coordinator wrote the card
        (DEC-20260923-b85c30) with fallback_allowed: false for a same-session
        subagent launch, which this runtime cannot honour. The executor did not
        cause it. Every requirement of executor-implementation (effort floor
        medium, tool use, structured output, context and output size) is met by
        the serving model, so no capability gap exists. The nonconformance is
        procedural.
    - id: C5
      receipt_defect: D-5
      field: manifest.yaml run.code.command; archival ownership of commit 5016669
      prior_value: >-
        (a) manifest.yaml lacks the singular run.code.command key that
        tools/validate_ledger.py reads. (b) The additive supersession
        manifest_v2.yaml and its tools/run_supersession_registry.yaml entry
        were committed at 5016669 under task_id TASK-20260923-c2e57b, with no
        correction or decision record.
      corrected_value: >-
        (a) The commands were captured under run.code.commands and
        run.code.command_file (command.txt). Only the key differs.
        manifest_v2.yaml adds run.code.command derived from them, plus a
        supersedes block binding manifest.yaml by sha256
        (1ed4bd67...9bda). It changes no measurement, status, artifact or
        provenance field. TASK-20260923-b8f163 J2 verifies that by a
        YAML-level diff.
        (b) TASK-20260923-c2e57b's receipt binds only commit 64cba9f's declared
        paths. Commit 5016669 touched a run-directory file and a tools/ file
        that are outside that task's write_scope, and it has no receipt of its
        own. The registry entry's task_id attribution is therefore not an
        archival binding. The CONTENT of the supersession is ratified by
        DEC-20260923-4d7a19 R-5. The archival binding is supplied by
        TASK-20260923-e3b590, whose receipt records the sha256 of
        manifest_v2.yaml (expected b801901e...162c) and of
        tools/run_supersession_registry.yaml as previously committed at
        5016669. It does not re-stage or edit them. The registry entry is left
        as written, and this record is the pointer beside it.

  reason: >-
    The snapshot receipt of TASK-20260923-c2e57b disclosed D-1..D-5 and routed
    them onward without a correction record. Each is a departure from a
    committed card or a committed schema, and the records carrying the
    original text are immutable. The account is therefore additive.
    DEC-20260923-4d7a19 decides what each departure does to the run's
    admissibility. This record fixes what happened.

  what_is_NOT_corrected:
    - Any byte of the run package, the specification, the trial plan, or impl/.
    - The manifest's fallback_used/fallback_reason, which were already truthful.
    - The registry entry text (left as written; this record is the pointer).
    - TASK-20260923-6f1ad4 and DEC-20260923-b85c30 (immutable; their inference text stands as the historical record).

  evidence_artifacts:
    - coordination/design/certbin-trace-20260923-5d0b8e/archives/TASK-20260923-c2e57b/snapshot-receipt.json
    - experiments/EXP-CERTBIN-4e92d7/runs/RUN-CERTBIN-3b7e05/manifest.yaml
    - experiments/EXP-CERTBIN-4e92d7/runs/RUN-CERTBIN-3b7e05/manifest_v2.yaml
    - experiments/EXP-CERTBIN-4e92d7/runs/RUN-CERTBIN-3b7e05/implementation.md
    - experiments/EXP-CERTBIN-4e92d7/runs/RUN-CERTBIN-3b7e05/environment.json
    - tools/run_supersession_registry.yaml
    - ledger/handoffs/TASK-20260923-6f1ad4.yaml
    - orchestration/model-bindings.yaml (anthropic executor-implementation -> claude-sonnet-5; review-adversarial -> claude-opus-5)
    - orchestration/model-policies.yaml (executor-implementation requires)

  asserts_nothing_about: The measurements, H-CERTBIN-a73f1c, P-GPU, or any curve.

