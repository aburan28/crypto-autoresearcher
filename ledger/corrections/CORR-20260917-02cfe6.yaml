# =============================================================================
# CORR-20260917-02cfe6 -- the absorbed-cofactor "crossover" in RUN-SEMBIN-aa5161
# is a search-floor artifact, and the "+52 upward shift" derived from it is
# therefore unsupported.
#
# RUN-SEMBIN-aa5161 IS IMMUTABLE AND IS NOT EDITED. This record supersedes two
# of its derived figures and leaves every raw value, and the whole raw-result
# file, exactly as archived.
#
# WHAT IS NOT WRONG, stated first so the correction is not read wider than it
# is: the charged crossover of n = 302 STANDS and is floor-independent, the
# Table 3 reproduction control stands (36/36 cells), the joint-optimum result
# t* = m* stands, and the preregistered-outcome refutation stands. The defect
# is confined to the absorbed COMPARATOR and the one difference derived from it.
# =============================================================================
correction:
  id: CORR-20260917-02cfe6
  recorded_at: '2026-09-17'
  record_type: run
  record_id: RUN-SEMBIN-aa5161
  field: >-
    correction_2_charged_cofactor.crossover_cofactor_absorbed, and the figure
    derived from it, correction_2_charged_cofactor.shift_upward_from_charging
  prior_value: >-
    crossover_cofactor_absorbed: 250; shift_upward_from_charging: 52
    (reported as the number of places in n by which charging the n^{4 omega}
    cofactor moves the crossover upward).
  corrected_value: >-
    crossover_cofactor_absorbed: NOT DEFINED IN RANGE -- the absorbed reading is
    below 2^{n/2} at every n tested from 20 upward, so no crossover exists to
    report. shift_upward_from_charging: WITHDRAWN, because it is a difference
    taken against a quantity that does not exist. The charged crossover of 302
    is unchanged and is the surviving figure.
  reason: >-
    The absorbed model sets charge_cofactor=False, and stage_costs() reads that
    flag as `solve = 0.0` -- it does not merely absorb a polynomial factor into
    an asymptotic constant, it prices the entire solving stage at zero. Its
    stage-1 cost is consequently below 2^{n/2} throughout the range, so the
    first n that crossover() examines already has margin < 0 and is returned as
    the crossover. The returned value is therefore whatever n_lo happens to be.

    This was verified directly rather than argued: calling crossover() on the
    absorbed model with n_lo = 20, 100 and 250 returns 20, 100 and 250
    respectively, and at n_lo = 250 the very first cell carries a margin of
    -78.7531 bits. The same probe on the CHARGED model returns 302 for both
    n_lo = 20 and n_lo = 250, which is what a real crossover looks like and is
    why the charged figure survives.

    The honest statement the withdrawn figure was reaching for is available and
    is stronger for being exact: charging the cofactor is not a shift of the
    crossover, because the absorbed reading has no crossover to shift from. It
    prices no solving at all, so it is a lower bound on the model rather than a
    comparator for it. What can be said is that the crossover under the
    charged reading is n = 302 under Section 4.5.2's own stage-1, t = m
    convention.

    NOT A REPORTING LAPSE BY THE PRODUCING SESSION, and worth naming as a
    mechanism rather than a mistake: crossover() returns the first n meeting
    the condition and has no way to signal that the condition already held at
    the search floor. Any caller that passes a floor above the true crossover
    gets a plausible integer back. A `crossover_n_at_search_floor: true` flag
    on the return, refused by the caller, would have made this uncatchable
    figure self-reporting.
  evidence_artifacts:
    - experiments/EXP-SEMBIN-81dc96/code/joint_balance.py
    - experiments/EXP-SEMBIN-81dc96/runs/RUN-SEMBIN-aa5161/raw-result.json
    - experiments/EXP-SEMBIN-992e73/runs/RUN-SEMBIN-a7a2f3/raw-result.json
  evidence_artifacts_note: >-
    The third path is the run that found this. Its
    `defect_found_in_frozen_derived_figure` block carries the three-floor probe
    and the charged-model control, and its
    `reproduction_check_against_frozen_run` block shows the same code
    reproducing five cells of the frozen curve_charged to within 1e-3 before
    any of this was claimed -- which is what makes the probe a finding about the
    figure rather than about a re-implementation.
