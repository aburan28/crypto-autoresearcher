  prior_value: >-
    The factor is constant at fixed m and fixed W_eff and moves no exponent
    HERE, but a per-fibre factor of 2 compounds as 2^{n-1} in a Gaudry/Diem-
    style decomposition over F_{q^n} with n growing, where it would.

  corrected_value: >-
    The factor of 2 is the size of an ERROR IN THE ICEX PROTOCOL'S OWN
    RELATION-RATE PROXY, not a surplus over the standard heuristic. The
    protocol's relation_rate_input multiplied by chebotarev_S2_split ~ 1/2 as
    if the last summation fibre were a coin flip; on the factor-base locus it
    splits with probability exactly 1 because P +/- Q are rational whenever P
    and Q are (EV-MONO-a0a89c OBS-4 and OBS-5). The standard Gaudry/Diem and
    Joux-Vitse count, |F|^m / (m! N) with |F| counted in points, never
    contained that 1/2. Removing it therefore brings the ICEX model INTO
    AGREEMENT with the literature estimate; it gives nothing beyond it. The
    "2^{n-1}" figure is how large the old proxy's error would have grown at
    m = n, not an exponent available to an attacker. The operational
    instruction in the same next_action -- use the formula
    (1 - 1/W_eff)/freq_split, not the number 1.5 -- is unaffected and stays
    binding for any consumer of the MONO feed.

  reason: >-
    EV-MONO-a0a89c OBS-4 states "this is a MIS-SPECIFICATION OF THE
    PROTOCOL'S PROXY, not a discovery", upheld by TASK-20260802-1b4130 O-8a,
    and names the mechanism as the group law, not monodromy. The goal's
    next_action carries the observation forward with an added clause that
    reads it as a latent exponent in extension-field decompositions. That
    reading does not follow: the heuristic every published Gaudry/Diem
    analysis uses already counts decompositions as point sums, so the
    complete splitting on the factor-base locus is built into it. A downstream
    ranking that treated the clause as an unexplored lead would be chasing an
    instrument repair. The clause was so read in a cross-portfolio synthesis
    on 2026-09-28, which is why this is recorded.

  effect_on_dependent_records: >-
    None edited. KN-FIND-c41ea9 and KN-FIND-a8990a are unaffected: both
    already state that complete splitting on the factor-base locus gives
    relation search no leverage. Any future ICEX or ICPERF proposal that cites
    the 2^{n-1} clause as motivation must cite this correction beside it.

