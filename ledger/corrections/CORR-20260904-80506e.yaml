  recorded_at: '2026-09-04'
  recorded_by: coordinator
  type: pooled_headline_statistic_refuted_by_independent_breakthrough_tier_review_via_two_disjoint_methods
  severity: critical_headline_result_reversed
  supersedes: []
  corrects:
    - ledger/evidence/EV-MONO-afcb01.yaml
    - ledger/decisions/DEC-20260904-ffaebb.yaml
    - ledger/hypotheses/H-MONO-1d50ac.yaml (status_note_2026_09_04_b)

  incident_summary: >-
    The two-cell inverse-variance-weighted pooled log-ratio estimate
    (z=2.3139, p=0.020673, EV-MONO-afcb01) was escalated to
    review-breakthrough tier per DEC-20260904-ffaebb. Both breakthrough
    reviewers, working fully independently (each disclosed never reading
    the other's directory; the Red Team ran on claude-opus-5, materially
    reducing this lane's own repeatedly-disclosed model-correlation
    confound), converged on rejecting the pooled result as unreliable
    evidence -- via two DISJOINT arguments, neither of which depends on
    the other.

  finding_1_exact_computation_shows_cell_1_is_mathematically_degenerate: >-
    The Red Team derived exact closed forms for the collision rate under
    both sampling arms as a function of (N, tau, #E(F_p)[4]) alone --
    verified against brute-force enumeration to <1e-14 on 20 curves and
    calibrated against 145 archived curve-measurements (mean z=-0.010,
    sd=0.915). At cell 1 (p=617, N=580, tau=4), N=580 requires n1^2 | 580
    with n1 even for full 2-torsion; since 580 = 2^2*5*29, n1=2 is the
    ONLY solution, forcing group structure Z/2 x Z/290 and #E[4]=4 for
    ANY curve at this cell, regardless of which specific curve. THIS
    COORDINATOR INDEPENDENTLY VERIFIED THIS SPECIFIC CLAIM via elementary
    number theory (not by running the reviewer's code): 580's
    factorization admits exactly one n1 satisfying n1^2 | 580 and n1 even,
    confirming the group structure -- and hence #E[4] -- is forced
    identical for both curves. Since the exact rate depends only on
    (N, tau, #E[4]), cell 1's true P3 is EXACTLY 1.00000000, not
    approximately -- the two curves cannot differ by construction. Cell 1
    carries 87.0% of the pooled weight and can carry no effect of any
    size. At cell 2, the true effect is real but is 0.042% and points in
    the OPPOSITE direction from the measured +11.2%. 63.3% of the entire
    pooled signal traces to a single +2.18-sigma excursion in one count
    (the p=617 CM transversal count, 681 against an exact expectation of
    627.18) measured ONCE in RUN-MONO-64aaa4-1 and reused verbatim in
    every subsequent analysis in this chain -- it is EXP-MONO-64aaa4's
    own original p=0.066 finding, restated, not new evidence.

  finding_2_the_statistical_procedure_itself_has_an_inflated_error_rate: >-
    Independently, and without relying on finding 1, the Validator
    formally simulated the actual six-look decision procedure this lane
    executed (not a worst-case "re-test until significant" model, which
    the evidence does not support) under a genuine null, using the
    archive's own pairs-vs-tuples counts to bound the true overdispersion
    (phi >= 1.49 on all four group-uniform arms, understated by the
    delta-method's Poisson assumption). Most-defensible estimate: true
    false-positive rate approximately 10.3% (MC 95% CI [10.16%,10.36%]),
    range 6.6%-23% across faithful alternative models; the reported
    headline's procedure-adjusted p-value is 0.0478 -- on the alpha=0.05
    boundary, not safely inside it. Two objective, checkable defects drive
    this regardless of any assumption about intent: (a) the delta-method
    variance formula ignores real within-tuple clustering, understating
    the pooled SE by a factor of at least 1.0664 (moving p from 0.0207 to
    at least 0.0299 on this term alone); (b) the terminal combination rule
    (inverse-variance pooling vs. Fisher's method) was selected, per
    TASK-20260904-904394's own joint J4, from a menu of two named AFTER
    both cell results were known, and the two rules straddle alpha=0.05
    (0.0207 vs 0.0713) -- the significant one was adopted.

  proves_too_much_controls_both_passed: >-
    Both reviewers ran adversarial controls confirming their own methods
    discriminate rather than debunk indiscriminately. The Red Team's exact
    machinery CONFIRMS the corrected v2 sampler's uniformity (predicts
    233.31 vs 233 observed), CORRECTLY FLAGS the v1 sampler's known bias,
    and REPAIRS (rather than dismisses) Part B's closed form. The
    Validator's simulation shows the false-positive rate rising
    monotonically as synthetic "looks" are added (0.065->0.086->0.143->
    0.172->0.192->0.224->0.226) and returns ~0.05 for correctly-specified
    unadjusted tests within the same machinery.

  disposition: >-
    The pooled 2-cell estimate (z=2.3139, p=0.020673) is NOT adopted as
    evidence for or against H-MONO-1d50ac's endomorphism-ring-linked
    reading. It is refuted as unreliable by two independent, disjoint
    lines of argument. This does NOT mean nothing was learned: see the
    companion evidence record EV-MONO-9c760b and decision
    DEC-20260904-d79f75 for the genuine positive residue (Part B's closed
    form has a real, small, exactly-characterized gap explained by missing
    #E(F_p)[4]-dependence, mean +0.60% bias) and for why no third cell
    should be commissioned (both reviewers explicitly recommend against
    it: a 20,000-tuple cell's own standard error is roughly 8x the largest
    true effect anywhere in the archive).

  reason: >-
    AGENTS.md rule 4 (corrections supersede, never overwrite) requires
    this filed as a correction: EV-MONO-afcb01 and DEC-20260904-ffaebb's
    own escalated pooled headline is now independently refuted and must
    not be cited as evidence in either direction going forward. This is
    the deepest and most consequential correction this lane has produced,
    and it worked exactly as the review-breakthrough tier is designed to:
    a result contradicting prior validated evidence was escalated, and
    the escalation caught what four prior review rounds at ordinary tier
    (each individually careful and each independently re-verified) did
    not -- that the underlying question was answerable exactly, in
    seconds, without sampling at all.

