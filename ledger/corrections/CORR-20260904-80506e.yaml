  independent_reverification_by_coordinator: >-
    Verified via elementary number theory (not the reviewer's code) that
    N=580 admits exactly one factorization n1*n2 with n1 even and
    n1^2 | N -- n1=2, n2=290 -- since 580 = 2^2*5*29 and 4^2=16 does not
    divide 580. This independently confirms cell 1's group structure
    (Z/2 x Z/290) and #E[4]=gcd(4,2)*gcd(4,290)=4 are forced identical for
    any curve at this cell, the single most load-bearing specific claim
    underlying the Red Team's refutation.

