correction:
  id: CORR-20260728-001
  id_allocation_note: >-
    Allocated on a NEW date, strictly above the maximum of the union, never into a gap. The
    maximum existing CORR identifier is CORR-20260727-003 (ledger/corrections/), and
    CORR-20260727-004 is REFERENCED BY DEC-20260727-005 without a file behind it, so the -004 slot
    is treated as reserved and is deliberately NOT reused. A repository-wide search for the string
    CORR-20260728 returned no match before this record was written, in either the root namespace
    ledger/*.yaml or the typed subdirectory ledger/corrections/.
  placement_note: >-
    Filed in the typed subdirectory ledger/corrections/, matching CORR-20260727-001..003. The root
    namespace is legacy-only: tools/validate_ledger.py check_legacy_ledger rejects a new
    root-level ledger record outright. Note that ledger/corrections/ is not walked by
    tools/validate_ledger.py, so this record introduces no new validator error and grants no
    suppression to anything.
  recorded_at: '2026-07-28'
  recorded_at_precision: >-
    Date only. The authoring Coordinator session has no clock and no shell: it ran no git command,
    computed no SHA-256, staged nothing, made no commit and asserts that none happened.
  authorizing_decision: DEC-20260728-003
  authorizing_decision_note: >-
    This correction is issued under the same Coordinator authority that closed BATCH-010. It
    changes NO status, NO verdict, NO criterion disposition and NO claim boundary. If a later
    reader finds any research statement altered here, that is a defect in this record, not a
    ruling.

  record_type: claim
  record_type_note: >-
    The template's record_type enum is candidate | claim | run and none of the three fits an
    identifier repair across a hypothesis, an experiment contract and an evidence record. `claim`
    is chosen as the closest available value and this note states plainly that the enum is being
    stretched rather than silently satisfied. A future schema revision should add
    `identifier` to the enum; that is a tooling change and is not made here.
  record_id: [EXP-RT1476-001, H-RT1476-001, EV-RT1476-001]
  field: 'id (and every structured pointer field naming these three ids)'

  # =========================================================================
  # WHAT WAS WRONG
  # =========================================================================
  defect:
    summary: >-
      THREE IDENTIFIERS CREATED BY BATCH-010 ARE MALFORMED AND WERE PUBLISHED. tools/validate_ledger.py
      ID_PATTERNS require a LETTERS-ONLY area code - ^H-[A-Z]+-\d{3}$, ^EXP-[A-Z]+-\d{3}$,
      ^EV-[A-Z]+-\d{3}$ - and the area code RT1476 contains digits. The ids were carried from the
      research gate name RT-1476-SUBRES-A1, whose "1476" is an idea-catalogue number, and no
      session checked the resulting identifier against the pattern that governs it.
    consequences_measured_by_the_reporting_session:
      error_count_before: 1108
      error_count_after: 1115
      new_errors: 7
      breakdown:
        - "experiments/EXP-RT1476-001/specification.yaml: bad experiment id 'EXP-RT1476-001'"
        - 'ledger/hypotheses/H-RT1476-001.yaml: ID H-RT1476-001 does not match hypothesis format'
        - 'ledger/evidence/EV-RT1476-001.yaml: ID EV-RT1476-001 does not match evidence format'
        - "ledger/evidence/EV-RT1476-001.yaml: evidence references unknown experiment 'EXP-RT1476-001'"
        - "ledger/decisions/DEC-20260728-001.yaml: decision references unknown target 'EXP-RT1476-001'"
        - 'the same dangling-target error on DEC-20260728-002 and DEC-20260728-003 (the reported "+2 more")'
    why_one_defect_produced_seven_errors: >-
      check_experiment (tools/validate_ledger.py line 212) emits "bad experiment id" and RETURNS
      BEFORE ctx.register. The experiment is therefore absent from ctx.ids, and every cross-reference
      to it - evidence.experiment_ids and three decisions' target_ids - fails in check_cross_refs.
      FOUR OF THE SEVEN ERRORS ARE DOWNSTREAM OF ONE MALFORMED FIELD. The hypothesis and evidence
      records, by contrast, DO register despite their id errors (no early return), which is why
      evidence.hypothesis_id resolved and produced no additional error.
    attribution: >-
      RECORDED WITHOUT SOFTENING. The malformed ids were allocated by the Coordinator session that
      opened BATCH-010, reconfirmed as "free" by the Coordinator session that closed it, and passed
      by the executing session's post-commit verification. Freedom was checked; FORM WAS NEVER
      CHECKED. Three separate identifier-discipline gates - the DEC-20260727-005 union rule, the
      phase-1 reconfirmation and the archive verifier - all test whether an id is TAKEN and none
      tests whether it is WELL-FORMED, in a batch whose spine was identifier discipline. That gap is
      the finding here, and the process fix is named below.

  # =========================================================================
  # WHAT CHANGED
  # =========================================================================
  prior_value:
    experiment: EXP-RT1476-001
    hypothesis: H-RT1476-001
    evidence: EV-RT1476-001
  corrected_value:
    experiment: EXP-SUBRES-001
    hypothesis: H-SUBRES-001
    evidence: EV-SUBRES-001
  retirement_rule: >-
    EXP-RT1476-001, H-RT1476-001 and EV-RT1476-001 are RETIRED AND NEVER REUSED. Each denoted
    exactly these records in published history - the experiment and hypothesis from commit
    e1847fc8, all three from the verified BATCH-010 close at 8f408cdf - and may never denote
    anything else. This is the DEC-20260727-005 / CORR-20260727-001 idiom, under which
    DEC-20260726-007 was renumbered to DEC-20260726-009 and the retired string kept its historical
    meaning.

  area_code_ruling:
    chosen: SUBRES
    pattern_conformance: 'SUBRES matches [A-Z]+ (six letters, no digits), so all three ids now satisfy their patterns.'
    collision_check: >-
      FREE ACROSS THE UNION. No EXP-SUBRES-*, H-SUBRES-*, EV-SUBRES-* or RQ-SUBRES-* record exists
      in ledger/*.yaml (root) or in any typed ledger subdirectory, and no experiments/EXP-SUBRES-001/
      directory exists. Every occurrence of the token SUBRES under ledger/ before this correction
      belonged either to the gate name RT-1476-SUBRES-A1 or to the three records being renumbered.
    why_SUBRES: >-
      It names the mechanism - the subresultant-PRS backward-state meter - and it shares its
      distinctive token with the gate of record RT-1476-SUBRES-A1, so the link between the ledger
      records and the gate survives the renumber without encoding a catalogue number in an
      identifier.
    why_not_RT: >-
      REJECTED ON COLLISION-ADJACENCY, NOT AESTHETICS. RT- is already the prefix of this program's
      red-team report ids (RT-20260726-001, RT-20260727-001) and of the gate name itself
      (RT-1476-SUBRES-A1). EXP-RT-001 and H-RT-001 would sit one hyphen away from a different record
      class in every grep and every human reading, which is how the present defect happened.
    what_is_deliberately_lost: >-
      The "1476" provenance - the idea-catalogue number the gate is named for - no longer appears in
      any identifier. That is intended. An identifier is a stable handle, not a metadata carrier;
      trying to make it carry provenance is exactly what put digits in the area code. The
      provenance is preserved in prose, in this correction, and in the gate name itself, which is
      unchanged.

  # =========================================================================
  # WHAT WAS EDITED, AND WHAT WAS DELIBERATELY NOT
  # =========================================================================
  reconciliation_rule: >-
    THE LINE IS DRAWN AT MACHINE-CHECKED STRUCTURE. A structured pointer field that
    tools/validate_ledger.py resolves - an id, hypothesis_id, experiment_ids, target_ids,
    evidence_refs, related_records - IS EDITED. Narrative prose, immutable producer and reviewer
    outputs, hash-bound receipts and run records ARE NOT EDITED and are covered by the alias
    declaration below. NO BLANKET SEARCH-AND-REPLACE WAS PERFORMED - forbidden by the
    CORR-20260727-002 precedent - and every edit below was made field by field.
  edited:
    - path: experiments/EXP-RT1476-001/specification.yaml
      fields: [id, hypothesis_id, identifier_renumber_note]
      note: >-
        The FROZEN protocol. Only the two identifier fields change; no metric, control, criterion,
        invalidation rule, stopping rule, budget, deviation or interpretation limit is touched, and
        this is NOT a version 2. The file's SHA-256 changes as a consequence, which is why the
        hash-binding statement below is explicit that prior bindings remain true of their commits.
    - path: ledger/hypotheses/H-RT1476-001.yaml -> ledger/hypotheses/H-SUBRES-001.yaml
      fields: [id, related_records.experiment_ids, identifier_renumber_note]
      note: 'RENAMED. The validator requires the filename stem to equal the id (line 163). status stays `weakened`.'
    - path: ledger/evidence/EV-RT1476-001.yaml -> ledger/evidence/EV-SUBRES-001.yaml
      fields: [id, hypothesis_id, experiment_ids, related_records, identifier_renumber_note]
      note: 'RENAMED, same reason. run_ids, certificate_refs, proof_refs, observations, boundaries and confounds are byte-unchanged.'
    - path: ledger/decisions/DEC-20260728-001.yaml
      fields: [target_ids, identifier_renumber_note]
      note: 'reserved_identifiers is left verbatim: it records what was reserved on the day, under the retired ids.'
    - path: ledger/decisions/DEC-20260728-002.yaml
      fields: [target_ids, approval.experiment_id, identifier_renumber_note]
      note: 'approval.specification_path is left pointing at experiments/EXP-RT1476-001/specification.yaml, which is correct: the directory does not move.'
    - path: ledger/decisions/DEC-20260728-003.yaml
      fields: [target_ids, hypothesis_transition.id, evidence_refs, related_records, identifier_renumber_note]
      note: 'Rationale, limitations and next_actions prose left verbatim. The decision stays `weaken`; S1 stays not met; S2 stays struck as unreachable.'
    - path: ledger/goals/GOAL-ECDLP-001.yaml
      fields: ['batch_checkpoints[BATCH-010].evidence_id', 'batch_checkpoints[BATCH-010].correction_id', 'batch_checkpoints[BATCH-010].identifier_renumber_note']
      note: >-
        The goal is the one record this system updates in place, so its pointer must be right. Its
        checkpoint prose keeps the retired ids on purpose, as the historical account of what was
        published.
  not_edited_covered_by_this_alias_declaration:
    - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/validation/TASK-20260728-003/validation_report.yaml and adversarial_notes.md
      reason: >-
        AN INDEPENDENT REVIEWER'S OUTPUT. VAL-20260728-001 is another agent's report, hash-bound and
        already relied upon by a published decision. Editing another session's findings to match a
        later identifier is not a correction; it is a rewrite of testimony.
    - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/archives/TASK-20260728-002/snapshot_commit_receipt.json and archives/TASK-20260728-004/ledger_commit_receipt.json
      reason: >-
        RECEIPTS BIND COMMITS AND PATHS. They state what was staged, at which sha, with which
        SHA-256. Every statement in them remains TRUE of the commit it names - 777b1e43 and
        8f408cdf - and rewriting them to name later identifiers would falsify the exact thing they
        exist to record. The ledger receipt's record_ids naming EV-RT1476-001 and H-RT1476-001 is
        correct for that commit and stays.
    - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/tasks/TASK-20260728-001/execution_report.yaml
      reason: 'Executor output, hash-bound in the 777b1e43 snapshot. Observations only; immutable.'
    - path: 'ledger/handoffs/TASK-20260728-001.yaml, -002, -003, -004'
      reason: >-
        IMMUTABLE HANDOFFS, on the standing precedent that TASK-20260727-006's handoff named a stale
        decision id and was amended by DEC-20260727-007 rather than edited. No handoff field is
        machine-resolved against the ledger, so no error follows.
    - path: 'experiments/EXP-RT1476-001/runs/ - all 27 run directories, 189 files, INDEX.json'
      reason: >-
        IMMUTABLE RUN RECORDS, and NOT DEFECTIVE. RUN_ID is ^RUN-[A-Za-z0-9._-]+$, so every
        RUN-RT1476-* id is well-formed and registers. check_run validates no experiment_id or
        hypothesis_id field, so the manifests' "H-RT1476-001" strings produce no error. They keep
        the retired area token; that is recorded, not repaired.
    - path: 'experiments/EXP-RT1476-001/analysis.md, implementation_notes.md, results_summary.json, subresultant_meter.py'
      reason: 'Producer artifacts, hash-bound in the snapshot receipt and re-verified by the validator. Superseded when wrong, never overwritten.'
    - path: 'coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/batch.yaml, dispatch_queue.json, decisions/TASK-20260728-004/determination.yaml'
      reason: >-
        CLOSED-BATCH COORDINATION RECORDS. coordination/ is not walked by tools/validate_ledger.py,
        the batch is closed and the goal is paused, so no live process reads them for routing. They
        are the account of what was done under the retired ids.
  alias_declaration: >-
    WHEREVER THE STRINGS EXP-RT1476-001, H-RT1476-001 AND EV-RT1476-001 APPEAR IN ANY ARTIFACT NOT
    LISTED UNDER `edited`, THEY DENOTE EXP-SUBRES-001, H-SUBRES-001 AND EV-SUBRES-001 RESPECTIVELY.
    They are retired aliases, never re-allocated, and a reader encountering them is reading correct
    history under a superseded name.

  # =========================================================================
  # WHAT WAS CONSIDERED AND REJECTED
  # =========================================================================
  rejected_repairs:
    - option: 'Relax ID_PATTERNS to ^[A-Z][A-Z0-9]*$ so the existing ids validate.'
      rejected_because: >-
        IT IS THE ANTIPATTERN. Editing a build gate so that one's own fresh violation disappears is
        the same move as amending a success criterion after seeing the result. It would also
        silently absolve EXP-R6-001, which sits in tools/validate_ledger_baseline.txt as declared
        debt at exactly this error, converting a recorded debt into a retroactive permission.
        RECORDED HONESTLY: the tool IS stricter than CLAUDE.md's prose convention "H-<AREA>-NNN",
        and GOAL_ID already permits [A-Z0-9]+ (GOAL-P13-001 exists), so a genuine
        pattern-versus-practice inconsistency exists in this repository. THAT QUESTION IS REAL AND
        IS NOT SETTLED HERE, because settling it in our own favour, in the same session that needs
        the answer, is not adjudication. It needs its own decision, on its own evidence, when
        nothing turns on the outcome.
    - option: 'Add the seven lines to tools/validate_ledger_baseline.txt.'
      rejected_because: >-
        EXPLICITLY FORBIDDEN by the tool's own contract: "Entries may only ever be removed from the
        baseline, never added - regenerating it to absorb a new violation defeats the check."
    - option: 'Register the ids in tools/legacy_ledger_inventory.yaml (remapped_ids or the legacy path set).'
      rejected_because: >-
        That mechanism grandfathers records that PREDATE the validator. These were created
        yesterday, under the current schema, by the current process. Growing an exemption set to
        cover a fresh mistake is the same defect as growing the baseline.
    - option: 'Leave the malformed ids and accept seven errors.'
      rejected_because: >-
        The errors are ours, they are new, and they make three of this batch's records
        unresolvable to the tool that enforces reference integrity. A close that leaves its own
        evidence record unregistered has not finished closing.
    - option: 'Rename the directory experiments/EXP-RT1476-001/ to match the new id.'
      rejected_because: 'See directory_ruling.'

  directory_ruling:
    ruling: 'THE DIRECTORY DOES NOT MOVE. It stays experiments/EXP-RT1476-001/.'
    reasons:
      - >-
        IT BUYS NOTHING MECHANICALLY. tools/validate_ledger.py discovers experiments by globbing
        experiments/*/specification.yaml and reads the id from INSIDE the file; it never compares
        the directory name to the id. Renaming clears zero errors.
      - >-
        IT COSTS INTEGRITY. A rename moves 189 hash-bound run files plus INDEX.json, so the exact
        path lists in the committed TASK-20260728-002 snapshot receipt (195 paths) and the
        TASK-20260728-004 ledger receipt would no longer resolve at HEAD. Receipts exist to bind
        exact paths; breaking them to tidy a name is a bad trade.
      - >-
        IT WOULD STILL NOT MATCH. The 27 RUN-RT1476-* ids inside are valid and immutable, so the
        directory would carry a name matching neither its own runs nor its published receipts.
    cost_recorded: >-
      A reader who greps for experiments/EXP-SUBRES-001/ finds nothing. That is the price, it is
      named rather than hidden, and the mitigations are this record, the specification's own
      storage-path note, and DEC-20260728-002's unchanged specification_path.

  # =========================================================================
  # PROCESS FIX
  # =========================================================================
  process_fix_named_not_implemented: >-
    EVERY IDENTIFIER ALLOCATION MUST BE CHECKED FOR FORM AS WELL AS FOR FREEDOM. The three gates
    this program already runs - the DEC-20260727-005 union search, the phase-1 reconfirmation at
    HEAD, and the archive verifier - all ask "is this id taken?" and none asks "does this id match
    its pattern?". The concrete fix is to match every proposed id against ID_PATTERNS in
    tools/validate_ledger.py at allocation time, before it is written into any record, and to state
    that check in the allocation note beside the freedom check. NOT IMPLEMENTED HERE: this
    correction changes no tool. It is assigned to the same successor queue as
    DEC-20260728-003 SUCC-1..SUCC-6 and needs its own task.

  hash_binding_statement: >-
    THIS CORRECTION INVALIDATES NO PRIOR HASH BINDING. Every SHA-256 recorded in
    VAL-20260728-001, in the TASK-20260728-002 snapshot receipt and in the TASK-20260728-004 ledger
    receipt binds a path AT A NAMED COMMIT - e1847fc8, 777b1e43 or 8f408cdf - and Git preserves
    those blobs forever, so each statement remains exactly as true as when it was made. What
    changes is only which content those paths hold at HEAD after this repair. Any receipt for the
    repair commit itself is computed by the executing session from Git object content; this
    authoring session computed none.

  evidence_artifacts:
    - tools/validate_ledger.py
    - tools/validate_ledger_baseline.txt
    - experiments/EXP-RT1476-001/specification.yaml
    - ledger/evidence/EV-SUBRES-001.yaml
    - ledger/hypotheses/H-SUBRES-001.yaml
    - ledger/decisions/DEC-20260728-003.yaml
  scope_statement: >-
    IDENTIFIER REPAIR ONLY. No status, verdict, criterion disposition, evidence strength, claim
    tier, proof status or claim boundary is changed by this record. H-SUBRES-001 remains `weakened`
    on the tested scope; EV-SUBRES-001 remains preliminary, toy, empirical_only; S1 remains not
    met; S2 remains struck as unreachable; RT-1476-SUBRES-A1 remains closed on the tested scope
    only with AGENTS.md rule 12 undischarged for any program-level reading; GOAL-ECDLP-001 remains
    paused with no quorum and no attestation. Nothing here is evidence for or against ECDLP
    hardness.
  recorded_by: coordinator
