  corrected_value:
    comparison_exponent: "t*dim - s_p = sum_{k>=1}|M_k|  (Howgrave-Graham: det L < p^(t*dim))"
    full_box_limit: "2/(d(n+1))"
    identity: "eps_HG = eps_TOOL / n as t -> infinity (shift sets nested)"
    eps_S3_extended: 0.2803
    eps_S4_extended: 0.1034
    best_margin_at_m4: "-0.6086 at (4,2); (4,0) is -0.6187"
    best_margin_over_m_le_32: "-0.5161 at (32,0)"
    eps_required: unchanged
  reason: >-
    The committed comparison exponent omits t*dim. It coincides with the correct
    one at n = 1 (all that tests/test_smallroot_reach.py checks against a theorem)
    and is wrong for n >= 2. Discriminating checks, all passing in
    tests/test_smallroot_reach_hg.py: hand instance n=1,d=2,t=1 gives X < p^(1/3)
    (committed tool: p^(2/3)); one equation never exceeds the information bound
    eps <= 1 over n,d in 1..8 (committed closed form gives 4/3 at n=2,d=1);
    Boneh-Durfee with x-shifts only gives delta < 1/4 (committed convention
    accepts delta ~ 0.74). S_3 measured directly at t=8,16: 0.278, within 1% of
    the identity value. The defect was first flagged by the Coordinator in
    DEC-20260929-821525 (design_time_finding) and pre-registered as
    EXP-ECDLP-64fa3d PRED-1/PRED-2; those predictions are reproduced here by
    closed-form and small-t exact arithmetic.
  claims_that_change:
    - "CLOSURE.md s1: reach rises toward 1 as n grows -- false; eps_HG = 2/(d(n+1)) falls with n"
    - "CLOSURE.md s4: margin widens monotonically in every direction -- false; w=0 margin improves with m toward -1/2"
    - "CLOSURE.md s5: gap 0.0481 -- about 0.6 at m=4, >= 0.5 for every m <= 32"
    - "CLOSURE.md s6.1: rank-r GAP rationale (n/(n+1) -> 1) -- no longer holds"
    - "CLOSURE.md s6.3: margin to beat is 0.048 -- about 0.6, roughly a 3x gain in reach"
  does_not_change:
    - Pollard rho remains the best known; sota_delta zero
    - eps_required (demand side) and block_inputs accounting
    - optimal-shift is not formally closed (Jochemsz-May extended is one strategy)
  not_an_experimental_run: >-
    A computation by one agent. EXP-ECDLP-64fa3d has produced no run and is not
    substituted for. Rule 12 independent review-breakthrough at max is still owed.
