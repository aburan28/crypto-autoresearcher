  field: success condition of the Jochemsz-May shift-lattice reach and every number derived from it
  prior_value:
    comparison_exponent: "s_p = sum_k (t-k)|M_k \\ M_{k+1}|  (the p-exponent of det L)"
    full_box_limit: "2n/(d(n+1))"
    eps_S3_extended: 0.8408
    eps_S4_extended: 0.4137
