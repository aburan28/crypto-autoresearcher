  record_id: RQ-CZLIFT-b9f765
  field: >-
    scope.curve_families (S1, S2), scope.methods (S3, S4), motivation (M1 to
    M3) and constraints (K1 replaced; K2 to K6 added). Grouped because every
    item is a wording fix to one record raised by one review round; the
    load-bearing closure field has its own record (CORR-20261023-6e10a2).
  prior_value: Quoted verbatim per item in items[].prior_value.
  corrected_value: Per item in items[].corrected_value.

  items:
    - id: S1
      field: scope.curve_families[2]
      prior_value: >-
        "elliptic curves over Q of literature rank 0 to 7 (the
        minimal-conductor ladder 11a1, 37a1, 389a1, 5077a1, 234446a1, 19047851,
        5187563742, 382623908456) and their quadratic twists, as the global
        lifting targets"
      corrected_value: >-
        Elliptic curves over Q of literature rank 0 to 7 (the ladder as
        listed) and their quadratic twists, plus the two retrieved 1977
        rank-record curves of EXP-CZLIFT-14f6d5 (Grunewald-Zimmert
        [1,-1,1,-6494556985832,6351402068900282539], rank >= 8; Brumer-Kramer
        [1,-1,1,-1608154463,25555312501831], rank >= 9). Every rank label is a
        lower bound certified by independent points, including the rank-7
        Elkies-Watkins curve 382623908456a1 (Elkies-Watkins footnote 3); no
        rank upper bound is established. LMFDB covers EC/Q to conductor
        299,996,953 with maximum rank 5 (stats page, retrieved 2026-10-23 by
        TASK-20261023-7b5dc6), so it holds no curve of rank >= 6.
      requested_by: DEC-20261023-6931ab synthesis items 1 and 7
    - id: S2
      field: scope.curve_families[1], and every "random point(s)" in the RQ
      prior_value: >-
        "random ordinary curves y^2 = x^3 + a x + b over F_p (no CM
        structure)"; motivation: "a random point's lift has height about log p"
      corrected_value: >-
        Each family names its point distribution. The distribution tested by
        EXP-CZLIFT-ed8113 is uniform over the affine points of E(F_p) with
        y != 0, r points with pairwise distinct x (harness/czlift.py
        random_point, hash-pinned); 2-torsion points are never drawn. The
        attack-relevant distribution is a large prime-order subgroup. The
        literal reading "random points of E(F_p)" was not tested by any
        producer run. Lifted-point heights are read per stated sampler and
        lift (symmetric representatives give naive log-height ratio
        1 - (1 + ln 2)/ln p, 0.63 to 0.83 over p = 101..12809, r = 2 cells
        only).
      requested_by: DEC-20261023-488023 N-3(iii); CORR-20261023-4ffd7e S1
    - id: S3
      field: scope.methods[1]
      prior_value: >-
        "the prime-to-p torsion section E(Q_p)[n] -> E(F_p)[n] as the
        canonical point section"
      corrected_value: >-
        The prime-to-p torsion section s_tor: E(F_p)[n] -> E^(Q_p)[n] as the
        canonical point section, with the Weierstrass model of the lift and
        the digit map named (the i-th p-adic digit a_i of the affine
        coordinate x or y at precision p^k), because digit functions of s_tor
        are model-dependent and only the group-theoretic readout is
        model-free.
      requested_by: DEC-20261023-2e7447 NA-5(iv)
    - id: S4
      field: scope.methods[3]
      prior_value: >-
        "rational-point census of bounded naive height, reduction mod p, and
        the uniform-reduction coverage model (the Silverman-Suzuki /
        Huang-Kueh-Tan / xedni-calculus obstruction stated as a count)"
      corrected_value: >-
        (a) Rational-point census of bounded naive height IN A NAMED MODEL,
        with the model-invariant canonical-height count N(T) as the primary
        count: N_E(H) at finite H is not an isomorphism invariant (the
        translation x -> x + 10^6 of the rank-7 curve moves N_E(1e5) from 1155
        to 3 at unchanged discriminant, rank and regulator). (b) Reduction mod
        p read against calibrated nulls (a seeded same-shape uniform null and
        the structured kernel-floor or same-height-rationals null), with the
        per-cell cap min(x,1)/(1 - e^-x) reported and cap-bound edges declared
        uninformative; "uniform reduction" is contradicted as stated on both
        census lanes (post hoc). (c) The parenthetical is replaced: the census
        quantifies the counting ingredient (the N(B) point-count estimate)
        that Jacobson-Koblitz-Silverman-Stein-Teske use in Lemma 4.1 and
        Theorem 4.1, not their obstruction; the bounded-relation count of
        EXP-CZLIFT-ed8113 is the downstream consequence of JKSST Lemma 4.1 (a
        relation-coefficient bound conditional on Lang's canonical-height
        conjecture and on log|D| >= C1 max hhat(P_i)) followed by pigeonhole,
        not the obstruction. JKSST 2000 = M. J. Jacobson, N. Koblitz, J. H.
        Silverman, A. Stein, E. Teske, "Analysis of the xedni calculus
        attack", Des. Codes Cryptogr. 20 (2000) 41-64, provenance retrieved
        (read in full by TASK-20261023-62eb31). Silverman-Suzuki (ASIACRYPT
        '98, LNCS 1514, 110-125) and Huang-Kueh-Tan (ANTS 2000) are recalled
        pointers only: not retrieved in primary form (red-team
        citations_checked), never support. (d) "xedni" in this RQ means xedni
        proper (2 <= r <= 9, most likely 4 to 6; discriminant minimization;
        reverse-Mestre conditions mod small l). The zero-freedom r <= 3 fits
        of EXP-CZLIFT-ed8113 are a nearby object, not xedni.
      requested_by: DEC-20261023-6931ab synthesis item 3; DEC-20261023-26a6de synthesis item 3; DEC-20261023-488023 N-3(i), (v), (vi)
    - id: M1
      field: motivation, H2 canonical-section sentences
      prior_value: >-
        "Serre-Tate gives a canonical lift of the curve but no canonical lift
        of points; a computable canonical section of E(Q_p) -> E(F_p) would be
        a full break"
      corrected_value: >-
        User H2 stays quoted verbatim. Qualifier beside it: on prime-to-p
        torsion a canonical section exists on every good-reduction Z_p-lift
        without Serre-Tate. s_tor is computable in at most
        2(bits(n) + bits(p^k)) + 1 additions and is a group isomorphism onto
        its image (KN-TECH-73630e; EV-CZLIFT-ad28f5, derivation uniform in p).
        On the canonical lift it is also the unique Frobenius-fixed section,
        and on anomalous split lifts the canonical point lift is the p-torsion
        lift. So the "full break" clause is false under every reading in which
        "canonical" constrains the section, and circular under the remaining
        reading (a section whose Smart residue recovers d is a discrete-log
        oracle). Any break must come from the encoding of the section's
        coordinates (KN-OPEN-d3a6f0, KN-OPEN-3417fc), not from the existence
        of a section.
      requested_by: DEC-20261023-2e7447 NA-5(i); DEC-20261023-36b4f0 N-3(iii) (red-team O4)
    - id: M2
      field: motivation, global-lift sentence
      prior_value: >-
        "lifting to E(Q) or E(K) fails for a different reason, namely rank is
        small and points of height <= H number about H^{r/2} while a random
        point's lift has height about log p"
      corrected_value: >-
        User H2 stays quoted. Qualifiers: (i) "about H^{r/2}" holds when H
        bounds the canonical (logarithmic) height; for naive height <= H the
        count is c_E (log H)^{r/2}, c_E = V_r/sqrt(Reg) (Lang 1983,
        Fundamentals of Diophantine Geometry, Ch. 5 Thm 7.4, as cited by
        DEC-20261023-26a6de; recalled pointer, not retrieved in this round),
        confirmed at toy scope on the ladder (EV-CZLIFT-376eee C1). (ii) "Rank
        is small" is not what the obstruction needs: the counting bound (half
        coverage needs >= N_p/2 distinct global points) holds at EVERY fixed
        rank, and weakens only for lifts whose rank grows with p (about
        r*(p) = 2 log p / log(2 log p): 34.3 at 2^128, 60.4 at 2^256; transfer
        assumption T1). Record curves are not a counterexample to it. (iii)
        Statements about record curves speak of counts in named models within
        a height window, never of "the Neron constant collapsing".
      requested_by: DEC-20261023-26a6de synthesis item 2; DEC-20261023-6931ab synthesis items 5 and 6
    - id: M3
      field: motivation, measurement (iii)
      prior_value: >-
        "(iii) the coverage of E(F_p) by small global points against the
        uniform-reduction model"
      corrected_value: >-
        (iii) the coverage of E(F_p) by small global points against calibrated
        same-shape uniform and structured nulls, with the instrument's per-cell
        cap stated; the distinct-residue ratio cannot exceed
        min(x,1)/(1 - e^-x), so an excess is detectable only below the cap.
      requested_by: DEC-20261023-26a6de; DEC-20261023-6931ab; DEC-20261023-fdc4af D7
    - id: K1
      field: constraints[2] (replaced)
      prior_value: >-
        "Rank labels of global curves are recalled literature values and are
        consistency-checked by the measured growth exponent, never asserted."
      corrected_value: >-
        Rank labels of global curves are lower bounds certified by independent
        points; upper bounds are unverified unless a 2-descent (or equivalent)
        is recorded, which is required wherever a rank label is load-bearing.
        The measured growth exponent is informative only in the asymptotic
        window: it fails on record curves at H <= 3e5 (Grunewald-Zimmert local
        exponent 17.3 against r = 8; Brumer-Kramer slope 8.3 against
        r/2 = 4.5).
      requested_by: DEC-20261023-6931ab synthesis item 2
    - id: K2
      field: constraints (added)
      prior_value: (none; new constraint)
      corrected_value: >-
        Every spectral or correlation instrument reports its per-record
        detection floor and blind zone, and only records with power count as
        evidence.
      requested_by: DEC-20261023-2e7447 NA-5(iii)
    - id: K3
      field: constraints (added)
      prior_value: (none; new constraint)
      corrected_value: >-
        A point-sampler restriction is stated in the specification text, not
        only in hash-pinned code.
      requested_by: DEC-20261023-488023 N-3(iii)
    - id: K4
      field: constraints (added)
      prior_value: (none; new constraint)
      corrected_value: >-
        A bounded relation search reports the mod-p null (the same bounded
        search on the residues) and the lift-survival fraction; the raw
        Q-rate is never read alone, and "independent" is asserted only from an
        unbounded certificate (Neron-Tate height-pairing determinant at a
        stated precision, or a descent).
      requested_by: DEC-20261023-488023 N-3(iv) and N-5
    - id: K5
      field: constraints (added)
      prior_value: (none; new constraint)
      corrected_value: >-
        Every success-rate statistic states, before the run, the null that
        matches its metric definition (per definition, and exact per lift and
        section for deterministic sections), and no elliptic Smart-style
        statistic on a naive, integral or small-height section is read as a
        random rate until it is split into the integral multiples of the
        global lift of P and the rest.
      requested_by: DEC-20261023-147f9f (contract requirements); DEC-20261023-039ddf (control C1)
    - id: K6
      field: constraints (added)
      prior_value: (none; new constraint)
      corrected_value: >-
        A coverage instrument reports its per-cell cap min(x,1)/(1 - e^-x),
        and any criterion edge the cap makes unreachable is declared
        uninformative before the run.
      requested_by: DEC-20261023-26a6de; DEC-20261023-6931ab; DEC-20261023-fdc4af superseding_contract_must

