correction:
  id: CORR-20260802-655085
  recorded_at: '2026-08-02'
  record_type: identifier_allocation
  record_id: MERGE-ID-COLLISION-BATCH007-DEC-20260802-003-004
  field: coordinator_decision_identifiers_for_GOAL-MLKEM-003_BATCH-007
  recorded_by: coordinator

  summary: >-
    The GOAL-MLKEM-003 BATCH-007 session minted DEC-20260802-003 and
    DEC-20260802-004 by sequential max+1 allocation. Both identifiers were
    concurrently minted on origin/main by a different campaign for DIFFERENT
    records. Ours are renamed; theirs are untouched.

  prior_value:
    ours_as_committed:
      - id: DEC-20260802-003
        path: ledger/decisions/DEC-20260802-003.yaml
        content: >-
          GOAL-MLKEM-003 BATCH-007 ledger decision (refine) -- source
          adjudication admissible with defects.
        committed_in: 1c917a11f46022a2e78b3c65c696ec1d0b668c55
      - id: DEC-20260802-004
        path: ledger/decisions/DEC-20260802-004.yaml
        content: >-
          GOAL-MLKEM-003 campaign budget cap removal on user authorization.
        committed_in: 1c917a11f46022a2e78b3c65c696ec1d0b668c55

  colliding_value:
    theirs_on_origin_main:
      - id: DEC-20260802-003
        goal_id: GOAL-ECDLP-001
        batch_id: BATCH-026
        recorded_by_task: TASK-20260802-015
      - id: DEC-20260802-004
        goal_id: GOAL-ECDLP-001
        batch_id: BATCH-027
        recorded_by_task: TASK-20260802-019

  new_value:
    mapping:
      DEC-20260802-003: DEC-20260802-735e6a
      DEC-20260802-004: DEC-20260802-0c6eb4
    rationale: >-
      OURS ARE RENAMED, NEVER THEIRS. This follows the resolution precedent set
      by DEC-20260801-003 and CORR-20260801-001: the party that discovers the
      collision renames its own record, because the other party's record is
      immutable, published, and outside this session's scope to touch.

  allocation_scheme_change: >-
    The new identifiers use the RANDOM 6-HEX form mandated by commit b7140326
    ("identifiers: allocate random 6-hex suffixes instead of max+1", PR #106),
    which landed on origin/main after this branch diverged. That commit exists
    precisely because sequential allocation manufactures this collision: it asks
    committed state for a maximum, every concurrent worktree gets the same
    answer, and they mint the same identifier for different records. This
    incident is a further instance of the failure class already recorded as
    KN-FIND-030, and it occurred because this branch was still running the
    pre-b7140326 allocator, whose tools/allocate_id.py --next returned
    DEC-20260802-005 -- itself already taken on main.

  suffixes_minted_from: >-
    The union of DEC/CORR identifiers across origin/main, this branch's HEAD, and
    the working tree (217 existing identifiers scanned), so the new tokens are
    free on either side of the pending merge.

  stale_forward_references_deliberately_left_unedited:
    - path: ledger/decisions/DEC-20260802-002.yaml
      occurrences: 2
      note: >-
        This record is published on origin/main (via PR #101) and is immutable.
        Its next_actions and knowledge_promotion fields still name
        DEC-20260802-003. That reference is now stale and is corrected HERE, not
        by editing the record. An edit was made in error during this repair and
        was reverted to the committed bytes before any commit.
    - path: ledger/handoffs/TASK-20260802-105.yaml
      occurrences: 4
      note: >-
        Frozen handoff, also published via PR #101. Immutable for the same
        reason; the same erroneous edit was made and reverted.

  updated_references:
    - knowledge/findings/KN-FIND-031.md
    - ledger/goals/GOAL-MLKEM-003.yaml
    - coordination/goals/GOAL-MLKEM-003/batches/BATCH-007/dispatch_queue.json
    - >-
      coordination/goals/GOAL-MLKEM-003/batches/BATCH-007/archives/TASK-20260802-105/ledger_commit_receipt.json
  updated_references_note: >-
    The goal record is a living checkpoint and the two coordination records are
    coordination state, not evidence (AGENTS.md "Dynamic dispatch"), so updating
    their references is permitted. KN-FIND-031 had not been published outside
    this branch when it was updated.

  what_this_does_not_change: >-
    No evidence, observation, verdict, review finding, or conclusion is altered
    by this correction. It is an identifier repair only. EV-MLKEM-017 and
    KN-FIND-031 keep their identifiers, which did not collide. The ledger archive
    commit 1c917a11 is not rewritten: it stands as the historical record of what
    was committed under the old identifiers, and this correction is the mapping
    a reader needs to follow it.

  references:
