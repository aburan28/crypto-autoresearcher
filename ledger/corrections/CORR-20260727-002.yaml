  hash_binding_note: >-
    The path_sha256 entries in the two archive receipts named above bind Git object content
    at the commits that produced them and remain valid for those commits. After this repair
    the working-tree content at ledger/decisions/DEC-20260724-007.yaml,
    ledger/decisions/DEC-20260724-008.yaml, knowledge/findings/KN-FIND-001.md,
    knowledge/findings/KN-FIND-002.md and knowledge/INDEX.md will intentionally no longer
