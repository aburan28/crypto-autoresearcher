    the GOAL-ECDLP-001, GOAL-MLKEM-001, GOAL-MLKEM-002, GOAL-SSI-001 or root-remap lineages
    continue to mean the retained identifier and are unaffected. This alias is what makes
    the historical strings readable without tampering with immutable artifacts.

