correction:
  id: CORR-20260727-002
  recorded_at: '2026-07-27'
  record_type: claim
  record_type_note: >-
    The template enumeration for record_type is candidate | claim | run and has no value
    for a bulk ID collision. claim is used as the closest permitted token, exactly as
    CORR-20260724-001 and CORR-20260727-001 did for merge remaps. No new enum value is
    invented silently. The corrected records are 5 coordinator_decision records, 10
    handoff records, and 2 internal_finding records, enumerated in resolution_table.
  record_id: MERGE-CONFLICT-304df00c-PARTIAL-RESOLUTION
  field: id
  prior_value: >-
    Seventeen record identifiers were simultaneously claimed by two distinct published
    records each, because merge commit 304df00c committed a partially resolved merge in
    which the conflicted paths retained literal <<<<<<< HEAD / ======= / >>>>>>>
    origin/main markers instead of a resolution. The colliding identifiers are
    DEC-20260724-007, DEC-20260724-008, DEC-20260724-009, DEC-20260725-001,
    DEC-20260725-002, TASK-20260724-226, TASK-20260724-228, TASK-20260724-229,
    TASK-20260724-232, TASK-20260724-233, TASK-20260724-234, TASK-20260724-235,
    TASK-20260724-237, TASK-20260724-239, TASK-20260725-001, KN-FIND-001, KN-FIND-002.
  corrected_value: >-
    At every one of the seventeen identifiers the origin/main record (merge parent P2 =
    eca384c7) retains the identifier and the branch record (merge parent P1 = 5cd208c1,
    labelled HEAD by the committed conflict markers) is reissued at the next free
    identifier. The full old -> new mapping is in id_remap below. knowledge/INDEX.md, the
    eighteenth conflicted file, is not an identifier collision and is not corrected by
    renumbering: it is a generated artifact and is regenerated.
  reason: >-
    AGENTS.md forbids ID reuse and makes ledger records immutable, so one of each pair had
    to move. ESC-20260727-001 section D_id_collision ruled, and DEC-20260727-001 and
    CORR-20260727-001 executed, that the published trunk record keeps the identifier and
    the branch record renumbers, because that touches no published trunk history and costs
    less integrity than any alternative. The committed conflict markers name the two sides
    directly: the losing hunk terminator in every one of the eighteen files reads
    ">>>>>>> origin/main", so P2 = eca384c7 is the trunk side and P1 = 5cd208c1 is the
    branch side as a matter of what git itself wrote into the files, not of topology
    inference. Twelve of the seventeen determinations are independently corroborated by
    record-internal evidence listed per row in resolution_table; two rest on the
    section D precedent with a measured tie in citation cost, and are marked as such.
  determination_rule: >-
    Applied uniformly and stated before the rows were filled: (R1) the trunk-side record
    retains the identifier, per ESC-20260727-001 section D; (R2) where record-internal
    evidence exists - a committed remap table, an uncontested neighbouring record in the
    same identifier series, or a closed archived_by chain - it is reported and must agree
    with R1 or the row is escalated rather than forced; (R3) where R2 is silent or split,
    the least-integrity-cost reading of section D governs and the tie is recorded rather
    than concealed. No row was decided by byte size, by which parent sounds newer, or by
    which campaign is judged more valuable.

  id_remap:
    decisions:
      DEC-20260724-007: DEC-20260724-020
      DEC-20260724-008: DEC-20260724-021
      DEC-20260724-009: DEC-20260724-022
      DEC-20260725-001: DEC-20260725-003
      DEC-20260725-002: DEC-20260725-004
    handoffs:
      TASK-20260724-226: TASK-20260724-243
      TASK-20260724-228: TASK-20260724-244
      TASK-20260724-229: TASK-20260724-245
      TASK-20260724-232: TASK-20260724-246
      TASK-20260724-233: TASK-20260724-247
      TASK-20260724-234: TASK-20260724-248
      TASK-20260724-235: TASK-20260724-249
      TASK-20260724-237: TASK-20260724-250
      TASK-20260724-239: TASK-20260724-251
      TASK-20260725-001: TASK-20260725-009
    findings:
      KN-FIND-001: KN-FIND-007
      KN-FIND-002: KN-FIND-008
    remap_direction_note: >-
      Every key above is the identifier as used by the P1 / 5cd208c1 record ONLY. The
      identically named P2 / eca384c7 records are NOT remapped and keep their identifiers.
      A bare string such as DEC-20260724-008 is therefore ambiguous without lineage; the
      alias_declaration below is what disambiguates it in existing artifacts.
    new_id_allocation_rule: >-
      New identifiers are allocated strictly above the current maximum on the same date,
      never into a gap. The date component is retained because the record's decided_at
      date is part of record identity and not a filing timestamp, per DEC-20260727-001.
      Observed gaps at ledger/decisions/DEC-20260724-005.yaml and
      ledger/handoffs/TASK-20260725-005/006/007.yaml are deliberately NOT reused; their
      provenance is undetermined and is logged as residual_defects RES-4.
    allocation_must_be_reverified: >-
      The authoring session has no shell. Before applying, the executing session must
      confirm at HEAD that DEC-20260724-020/021/022, DEC-20260725-003/004,
      TASK-20260724-243..251, TASK-20260725-009, KN-FIND-007 and KN-FIND-008 are all free,
      and must stop and escalate rather than shift the mapping if any is taken.

  resolution_table:
    - path: knowledge/INDEX.md
      retains_id: not_applicable
      restore_from: REGENERATE
      basis: >-
        Not an editorial choice. tools/build_knowledge_index.py declares in its own
        docstring that "the index is a derived artifact: entries under
        knowledge/{literature,techniques,findings,open-problems}/ are the source of truth",
        emits the header "do not hand-edit facts here", and ships a --check staleness mode.
        Neither the 28,894-byte P1 rendering nor the 1,262,076-byte P2 rendering is
        authoritative; both are stale outputs of the same generator, and DEC-20260727-002
        already records that the two committed tables declare 128 and 7638 entries, which
        cannot both describe this corpus. Byte size is evidence about staleness, not
        authority.
      evidence_grade: determined_by_tool_authority
    - path: knowledge/findings/KN-FIND-001.md
      retains_id: P2_eca384c7
      retained_record: >-
        Byte-complete differential probing of the ML-KEM comparison primitive discriminates
        incomplete re-encryption comparisons at fix boundaries (added 2026-07-24,
        internal_refs EV-MLKEM-005 / DEC-20260724-018 / H-MLKEM-002 / EXP-MLKEM-002)
      reissued_record: >-
        Decomposition-yield conservation - factor-base geometry cannot change mean yield,
        only redistribute it -> KN-FIND-007
      basis: >-
        R1 plus a decisive citation-cost margin. Ten uncontested, marker-free records cite
        KN-FIND-001 in the ML-KEM sense, four of them binding it into hypothesis or
        question evidence_basis fields: RQ-MLKEM-002, H-MLKEM-004, H-MLKEM-005,
        H-MLKEM-006, GOAL-MLKEM-001, GOAL-MLKEM-002, DEC-20260724-017, DEC-20260724-018,
        DEC-20260724-019, and the GOAL-MLKEM-002 BATCH-003 TASK-20260724-931 design report.
        Four cite it in the conservation sense: RQ-FBG-001, GOAL-ICLIFT-001, and the
        GOAL-ICLIFT-001 BATCH-001 dispatch queue and ledger receipt, of which the last two
        are hash-bound and alias-covered rather than editable. Renumbering the conservation
        finding is the cheaper move by 10 to 4, and its promoting decision (P1
        DEC-20260724-007) is being reissued under this same correction, so its
        knowledge_promotion field absorbs the new identifier natively at zero alias cost.
      evidence_grade: determined_strong
    - path: knowledge/findings/KN-FIND-002.md
      retains_id: P2_eca384c7
      retained_record: >-
        Jet and endomorphism ECDLP oracles are GGM-simulable with O(1) overhead (added
        2026-07-26, source_refs EV-GGM-001 / DEC-20260726-007 / EXP-GGM-001)
      reissued_record: >-
        Rare-event density gates are settled exactly by fibering over solutions - and
        exactness does not protect against formalisation error -> KN-FIND-008
      basis: >-
        R1 applied to exactly the case ESC-20260727-001 section D adjudicated for
        DEC-20260726-007. The GGM finding's promoting record is origin/main's published
        DEC-20260726-007, whose knowledge_promotion names KN-FIND-002; that decision is
        immutable, is present marker-free at HEAD, was itself restored under
        CORR-20260727-001 after the same bot deleted it, and section D already ruled that
        it keeps its own identifier. Moving KN-FIND-002 away from the record that decision
        promotes would leave an immutable published trunk decision pointing at nothing and
        would require an alias against it. The rare-event finding's promoting record is P1
        DEC-20260724-008, which is being reissued here anyway, so its reissue carries
        KN-FIND-008 natively. A contiguity argument runs the other way and is recorded so
        the reader can weigh it: uncontested KN-FIND-003, -004 and -005 are the XEDN
        findings promoted by the P1 decision spine, so P1's 001 and 002 would have made
        001-005 one lineage block. That argument was considered and outweighed: identifier
        blocks are not required to be lineage-contiguous, KN-FIND-006 already breaks the
        block from above with a third lineage, and contiguity does not price integrity cost
        the way section D's stated reasoning does.
      evidence_grade: determined_by_precedent
      explicitly_not_decided_here: >-
        This row assigns an identifier. It ratifies nothing about the GGM finding's
        substance. ESC-20260727-001 section A ruled that origin/main's EXP-GGM-001 archive
        must not be treated as having promoted that finding, and section C requires a
        separate correction or superseding entry for it on its own merits. Retaining the
        identifier neither performs nor prejudges that. Equally, renumbering the rare-event
        finding says nothing against it.
