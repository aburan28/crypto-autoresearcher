  integrity_event:
    what_happened: >-
      Commit 304df00c, "merge: begin resolving conflicts with origin/main", authored by
      copilot-swe-agent[bot] on 2026-07-27 with parents 5cd208c1 and eca384c7, committed a
      partially resolved merge. Eighteen files were committed still carrying literal
      <<<<<<< HEAD / ======= / >>>>>>> origin/main markers. The commit is live on
      origin/main.
    why_it_matters: >-
      Fifteen of the eighteen are ledger records and none of them parses as YAML in the
      committed state. They are unreadable, not merely untidy: no validator registers them,
      no tool can resolve them, and every record that cites them cites a broken record.
      Five are coordinator decisions, two of which carry hypothesis and experiment status
      transitions; ten are handoffs, which are the authorization records for executed work.
      A ledger whose decision records cannot be parsed cannot support any official state,
      and AGENTS.md makes the durability of a research state depend on a verified commit of
      readable records.
    second_incident_from_the_same_actor: >-
      This is the second integrity event from copilot-swe-agent[bot] inside two days. The
      first deleted the published trunk decision DEC-20260726-007 during the PR #42 merge
      and was repaired under CORR-20260727-001 and DEC-20260727-001. Both incidents share
      one mechanism: an automated agent resolving add/add ledger conflicts without a
      Coordinator ruling. A merge resolution over ledger records IS an identifier
      adjudication, and identifier adjudication is reserved to the Coordinator. The
      recurrence is recorded as a process finding and carries a control, stated in
      DEC-20260727-003 limitations, not as a judgement about any campaign's science.
    status: ruled_repair_authorized_not_yet_applied
    not_adjudicated_here:
      - >-
        No hypothesis, experiment, evidence, goal or knowledge STATUS is changed. H-GGM-001
        still reads supported, EXP-GGM-001 still reads review_required with approved_by
        null, GOAL-ECDLP-001 still reads paused, and every H-XEDN-*, H-FBG-* and H-MLKEM-*
        status is untouched. Restoring bytes and assigning free identifiers are not state
        transitions and none is smuggled in here.
      - >-
        Nothing in this record ratifies origin/main's DEC-20260726-007, EV-GGM-001, the
        H-GGM-001 supported status, or the GGM closure claim. ESC-20260727-001 sections A
        and C hold in full and require their own superseding decision.
      - >-
        Nothing in this record is evidence for or against ECDLP hardness, prime-field
        ECDLP, index calculus, factor-base geometry, function-field xedni lifting,
        generic-group simulability, ML-KEM security, or any attack. It is corruption
        repair and bookkeeping only. KN-OPEN-001 is untouched.

  residual_defects:
    - id: RES-1
      status: CANNOT_DETERMINE
      statement: >-
        DEC-20260724-007 and DEC-20260724-008 have a third claimant that is present in
        neither merge parent. CORR-20260724-003 and tools/legacy_ledger_inventory.yaml both
        assign those two identifiers to the canonical copies of root records
        DEC-20260722-001 and DEC-20260722-002, and CORR-20260724-004 (recorded 2026-07-26)
        restates that main held those canonical copies there. Neither P1 nor P2 contains
        them. The record set is additionally self-inconsistent independently of this
        incident: ledger/decisions/DEC-20260724-002.yaml carries remapped_from
        DEC-20260722-002 and ledger/decisions/DEC-20260722-007.yaml carries remapped_from
        DEC-20260722-004, contradicting CORR-20260724-003's table, which maps -002 to -008
        and -004 to -010. Where the DEC-20260722-001 and -002 canonical copies now live,
        and under which identifier, is undetermined from the artifacts available to this
        session.
      severity_downgraded_on_further_inspection: >-
        No published record was lost. The ORIGINALS survive intact in the root ledger
        namespace at ledger/DEC-20260722-001.yaml and ledger/DEC-20260722-002.yaml, verified
        present by direct inspection while ruling RES-5. CORR-20260724-003 created
        "canonical copies" of those originals under parseable identifiers purely so that
        machine-checked reference fields could resolve them; it is those derived COPIES,
        not the records, that were displaced when DEC-20260724-007 and -008 were later
        reoccupied. RES-1 is therefore a broken derived-reference defect, not a deletion,
        and is materially less serious than first recorded here.
      why_it_does_not_block: >-
        It is a pre-existing defect that predates 304df00c and is orthogonal to it.
        Restoring the two paths to readable YAML is strictly better than leaving
        unparseable files, and no version of this repair could recover a copy neither
        parent contains. The underlying records remain readable at their root paths.
      what_would_settle_it: >-
        git log --all --follow --diff-filter=AM -p -- ledger/decisions/DEC-20260724-007.yaml
        ledger/decisions/DEC-20260724-008.yaml, comparing each historical blob's
        remapped_from field against CORR-20260724-003's table; plus git log --all -S
        "remapped_from: DEC-20260722-001" to locate the canonical copy wherever it now
        lives. If the copies exist under some other identifier, a further correction records
        that identifier and supersedes CORR-20260724-003's table. If they exist nowhere, the
        remedy is to reissue them at free identifiers from the surviving root originals and
        supersede CORR-20260724-003's table; that is repairable and is not an integrity
        event, because the originals were never lost.
    - id: RES-2
      status: CANNOT_DETERMINE
      statement: >-
        The GGM closure finding occupied KN-FIND-001 at origin/main commit 3a59a207, as
        recorded verbatim in ESC-20260727-001 sections A and D and in CORR-20260727-001's
        affects block, but occupies KN-FIND-002 at merge parent eca384c7 with the ML-KEM
        finding at KN-FIND-001. The commit that moved it, and the correction record that
        authorized the move, are not identified by this session.
      why_it_does_not_block: >-
        This ruling assigns KN-FIND-002 to the GGM finding, which is where eca384c7 already
        has it and where origin/main's published DEC-20260726-007 already points. The
