      what_would_settle_it: >-
        A separate ledger-hygiene task that either creates the missing GOAL-ICLIFT-001
        archival handoff records at free identifiers with an explicit reconstruction
        provenance note, or records permanently that those archival tasks were executed
        without ledger handoff records. Do not back-fill a handoff and present it as
