    - id: RES-4
      status: partially_resolved_remainder_recorded
      statement: >-
        ledger/decisions/DEC-20260724-005.yaml and ledger/handoffs/TASK-20260725-005.yaml,
        -006.yaml and -007.yaml are absent from an otherwise contiguous run of
        identifiers. This correction allocates strictly above the maximum on each date and
        does not reuse any of them.
      resolved_part: >-
        DEC-20260724-005 is NOT a lost record. The identifier is occupied in the root
        ledger namespace at ledger/DEC-20260724-005.yaml, verified present by direct
        inspection while ruling RES-5. The apparent gap was an artifact of listing only
        ledger/decisions/, which is precisely the allocation error RES-5 names. This is
        independent confirmation that the two directories are one identifier space.
      remaining_part: >-
        TASK-20260725-005, -006 and -007 remain unexplained. The root ledger namespace
        contains no TASK-*.yaml records at all, so those three cannot be hiding there.
        Whether they were never allocated or were allocated and lost is undetermined.
      what_would_settle_it: >-
        git log --all --diff-filter=D -- ledger/handoffs/TASK-20260725-005.yaml
        ledger/handoffs/TASK-20260725-006.yaml ledger/handoffs/TASK-20260725-007.yaml.
        A deletion hit is a further integrity event. Note that P1's DEC-20260725-001 cites
        TASK-20260725-005 and -006 as its validation and red-team tasks, so the identifiers
        were at least intended.
    - id: RES-5
      status: ruled_allocation_rule_binding_ownership_question_open
      statement: >-
        ledger/ has TWO directory conventions for the same identifier space and neither is
        a subset of the other. The root namespace ledger/*.yaml holds DEC, EV, H, RQ and one
        CORR record; the typed namespace holds ledger/decisions/, ledger/evidence/,
        ledger/hypotheses/, ledger/questions/, ledger/corrections/, ledger/handoffs/ and
        ledger/goals/. Root holds no TASK, GOAL or KN records, so the handoff, goal and
        knowledge identifier spaces are single. DEC-20260727-001, -002 and -003 are each
        DOUBLY OCCUPIED by two entirely different published records: root -001 is the
        EXP-SIG-007 n=21 D5 completion, root -002 the EXP-SIG-008 n=12 D6 gates, root -003
        the EXP-GPS-002 GPS-2 test, all dated 2026-07-27 and cross-referencing each other,
        while ledger/decisions/-001 is the ESC-20260727-001 section D execution and -002 the
        BATCH-009 budget extension. CORR-20260724-002 is likewise doubly occupied.
      cause: >-
        Not a merge. Two writers allocating from partial views of one identifier space, each
        globbing only its own directory. It is the same failure class as the collisions this
        correction repairs, from a different cause, and it is the reason this correction's
        own identifiers were themselves reallocated before commit.
      binding_rule_from_now_on: >-
        Identifier allocation resolves the IDENTIFIER across the whole repository, never a
        single directory listing. Before allocating any DEC, EV, RQ, H, CORR, TASK or KN
        identifier, check the union of every location that holds records of that type - at
        minimum ledger/*.yaml AND the typed subdirectory - and allocate strictly above the
        maximum of that union, never into a gap in either. Globbing one directory is
        prohibited and is what produced every collision recorded here.
      what_is_NOT_ruled_here: >-
        Whether the root namespace is closed to new records, and which of the doubly
        occupied DEC-20260727-001/-002/-003 and CORR-20260724-002 pairs renumbers. Both
        sides of every pair are published and same-dated, so ESC-20260727-001 section D's
        published-versus-unpublished test ties and cannot decide it. Root records are NOT
        declared legacy by this correction: tools/legacy_ledger_inventory.yaml froze 95 root
        records at a past merge boundary, but records dated today are being written there, so
        "legacy" is not a true description of the namespace. No root record is moved, renamed
        or deleted by this correction; moving one would break the frozen inventory hashes and
        every citation that resolves to its path.
      assigned_to: >-
        Its own decision DEC-20260727-006 and correction CORR-20260727-004, allocated and
        reserved here and deliberately NOT absorbed into this repair, because it has a
        different cause, a different remedy, and affects a concurrent co-driver's records.

