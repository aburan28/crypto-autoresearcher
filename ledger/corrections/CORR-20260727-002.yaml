    - id: RES-3
      status: recorded_not_repaired
      statement: >-
        TASK-20260724-227, -230, -231, -236, -238 and -240 are cited as archival tasks by
        GOAL-ICLIFT-001 lineage records but have no ledger handoff file in that lineage;
        the first five identifiers are held at HEAD by GOAL-MLKEM-001 handoffs and -240
