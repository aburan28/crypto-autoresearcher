correction:
  id: CORR-20260929-616d03
  id_provenance: >-
    Minted by the top-level session with tools/allocate_id.py --next
    correction --date 20260929 and --check verified ("well-formed and free
    across the union"), 2026-09-29.
  recorded_at: '2026-09-29'
  record_type: claim
  record_id: EXP-SEMBIN-e76704
  field: >-
    Instrument product m*f in the Macaulay-row construction, which is the
    implementation of the declared observable (EXP-SEMBIN-e76704
    inputs.observable; H-SEMBIN-934774 statement and assumptions[0]). The
    same code is in research/verification/ffd_semaev_core.py.
  prior_value: >-
    OR-row product. m*f is computed as the SET of OR-ed monomials,
    prod = {mm | m for mm in f} (fastfall.py: r |= 1 << idx[mm | m]). Two
    terms of f that map to the same monomial collapse into one instead of
    cancelling. Example in the Boolean ring over F_2: u0u1 * (u0 + u1) ->
    {u0u1}, i.e. u0u1.
  corrected_value: >-
    XOR (cancelling) Boolean-ring product. m*f = XOR over mm in f of the
    monomial (mm | m), i.e. coefficients summed mod 2 after reducing
    u_j^2 = u_j. The same example gives u0u1 * (u0 + u1) = u0u1 + u0u1 = 0.
    Fast-kernel form: r ^= 1 << idx[mm | m].
  reason: >-
    Independent validation VAL-20260929-sembine76704 (definitional audit
    FAIL, DA-1/DA-2) found that every instrument used by EXP-SEMBIN-e76704
    implements the OR-row product. The top-level session independently
    confirmed the u0u1 * (u0 + u1) case. At (6,3), 270 of 320 rows differ
    from the true product. The fast kernel XORs OR-rows when it recombines,
    which matches neither convention. The quantity these instruments
    compute is therefore not the Boolean-ring d'_ff (definition #4) that
    the records declare. This is an implementation error. It is never
    negative mathematical evidence (AGENTS.md).
  defect_locations:
    - experiments/EXP-SEMBIN-e76704/src/ffd_semaev.py:95 (prod={mm|m for mm in f})
    - experiments/EXP-SEMBIN-e76704/src/recomb_search.py:31 (prod = {mm | m for mm in f})
    - experiments/EXP-SEMBIN-e76704/src/fastfall.py:25 (r |= 1 << self.idx[mm | m])
    - research/verification/ffd_semaev_core.py:95 (prod={mm|m for mm in f}; on main at e681f140e5, session report)
  defect_locations_note: >-
    Not affected: coordination/reviews/.../proves_too_much.py:87 accumulates
    additively in a mod-p dict (session finding). The Coordinator also read,
    without modifying anything, the unarchived scratchpad copies that the
    exploratory scripts imported:
    /tmp/claude-0/-home-user/2da6bcd8-2965-5cb4-a4db-701bb987902e/scratchpad/{ffd_semaev.py:95, recomb_search.py:31, fastfall.py:25}.
    They carry the same three OR lines. Those copies are not archived, so
    this observation is not durable evidence.

