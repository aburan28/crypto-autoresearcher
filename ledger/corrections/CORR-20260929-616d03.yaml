  scope_of_effect:
    identity_presentations: >-
      Per the validator, identity-presentation d'_ff is UNCHANGED under the
      true product in all 10 C1 cells, (n, n') in {3..7} x {2, 3}, Semaev
      systems (def1_all_and_c1.py; console output not preserved as a file).
      At the T3 and T4 identity presentations the value is 2 under both
      products (recount_T3.json, recount_T4.json).
    recombined_and_null_systems: >-
      Recombined presentations ARE affected, including the degree-matched
      random null. T2 Semaev (6,3) upward drops from 1,612,800 (OR) to
      1,355,520 (true product). T4 null (4,2) upward drops from 5,424 (OR) to
      4,824 (true product). Neither null draws nor recombinations were checked
      beyond these cells.
    precision_note: >-
      In this session's brief the null effect was stated as "T4 identity 2
      under OR vs 3 true". The preserved outputs do not support that
      wording. Under the Boolean-ring definition the T4 identity is 2 under
      BOTH products (recount_T4.json). The identity value 3 for the T4 null
      appears only under Nagao 2013/549 Definition 1 with trivial-syzygy
      adjustment (VAL-20260929-sembine76704 DA-9), which is a different
      definition, not a different product. The null IS affected, through
      the upward count.
    ffd_semaev_measurement1: >-
      The "Semaev d_ff pinned at 2 versus null d_ff climbing to 3 and 4"
      comparison of research/FFD_SEMAEV_MEASUREMENT1.md section 2 (10
      Semaev and 25 null draws per cell, n in {4..7}, n' in {3, 4},
      N <= 8) was produced by ffd_semaev_core.py and must be treated as
      UNVERIFIED until it is re-measured with the corrected product. The
      identity-invariance above was checked only on the 10 C1 Semaev cells
      and at the T3/T4 identities. None of the random null draws in
      MEASUREMENT1 and none of its n' = 4 cells was re-checked. The Semaev
      side has an independent reason to sit at 2, the constant-coefficient
      witness of section 3a. The null side depends on products m*f with
      non-constant m, which is where the defect acts.
    session_scope_claims_corrected:
      - claim: >-
          "Generic, not descent-specific: the degree-matched null separates
          too (T4)" (EXP-SEMBIN-e76704 interpretation_limits;
          H-SEMBIN-934774 interpretation_limits; DEC-20260929-79ba35
          rationale; IDEA-20260929-0238ee)
        status: >-
          Rests on the defective instrument. Under Definition 1 with
          trivial-syzygy adjustment the null does NOT separate
          (T4 upward 0 of 20,160; VAL-20260929-sembine76704 DA-9). Under the
          true Boolean product the validator's non-blind kernel gives 4,824.
          Withdrawn as stated. No reading about genericity may be made until
          a corrected instrument, which names both the definition and the
          field-equation convention, re-measures it.
      - claim: >-
          "Not automatic: of five Semaev cells with a recorded linear degree
          drop, four did not separate (three under a 400-sample search, one
          exhaustively)" (EXP-SEMBIN-e76704 interpretation_limits;
          H-SEMBIN-934774 interpretation_limits)
        status: >-
          Rests on nullcontrol_results.json and recomb2_results.json, both
          produced by the OR-row instrument. Unverified; withdrawn as stated.
          The (4,2) exhaustive case is structurally forced (1 in the
          generator span; DA-10).
      - claim: >-
          "A degree-drop absorption reading ... is not supported"
          (H-SEMBIN-934774 mechanism)
        status: >-
          Contradicted at (6,3). Separation occurs exactly for the M whose
          generators include h4, the unique span element of degree <= 1
          (DA-5).

