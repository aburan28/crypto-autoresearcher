# =============================================================================
# CORR-20260924-432f43 -- SUPERSEDES A CLASSIFICATION PRESUMPTION, NOT ANY
# FILE: the callgrind child of the EXP-GFPN-05ff43 repair lineage.
#   (1) The DRAFT AMD-EXP-GFPN-05ff43-20260924-healthresolve expects the
#       callgrind launch (v2_driver.py line 209 -> v2_solver.py lines 516-517)
#       to be an UNCLASSIFIED msolve launch (CN-1 reading, lines 493-501; HR-9
#       DV-11, lines 330-333). Under that draft's own definition of CLASSIFIED
#       (lines 462-465) it is CLASSIFIED: its non-cost record fields are
#       compared by REG-1 (b), which gates every package after G1.
#   (2) solverevent SE-2 (6), as the approved seedresolve draft incorporates
#       it, says the callgrind child's "output is never classified". That is
#       true only in the narrow sense that its msolve output file is never
#       parsed or passed to classify_solve. This is a reading note: no rule
#       text changes, and SE-2 (6) (the callgrind child is never re-solved)
#       stands.
#   (3) The preserved r2 layer's static inventory calls the callgrind site
#       "output never classified" (r2_devchecks_more.py line 530, per the
#       census). Same narrow sense; recorded so that no r3 file copies it
#       without the distinction.
# Found by the census TASK-20260924-1039eb (census.md lines 320-341) and
# confirmed by the Coordinator reading the frozen and preserved code.
# WRITE-ONCE. Written by the Coordinator under TASK-20260924-71ccd9 (ruled in
# DEC-20260924-afdc3b), archived by TASK-20260924-b2b59a. No existing file is
# edited.
# =============================================================================
correction:
  id: CORR-20260924-432f43
  recorded_at: '2026-09-24'
  recorded_by: coordinator
  goal_id: GOAL-GFPN-380702
  batch_id: BATCH-e409ca
  task_id: TASK-20260924-71ccd9
  decision_id: DEC-20260924-afdc3b
  archived_by: TASK-20260924-b2b59a

  record_type: amendment
  record_id: AMD-EXP-GFPN-05ff43-20260924-healthresolve
  record_path: experiments/EXP-GFPN-05ff43/amendments/v2_addendum_healthresolve.yaml
  record_sha256: ccb55334c542c809b8526e54a2985627a44c435e5ca68a14ef5f6a779291a70d
  record_note: >-
    The primary record is the healthresolve draft, whose CN-1 reading expected
    the callgrind launch to be unclassified. Items 2 and 3 concern other
    records, each named with its path and bound hash below.
  field: >-
    a classification expectation (item 1) and two reading notes on the phrase
    "never classified" (items 2 and 3), at the locations below

  items:
    - item: 1
      what: the classification of the callgrind msolve launch under the healthresolve definition
      records:
        - id: AMD-EXP-GFPN-05ff43-20260924-healthresolve
          path: experiments/EXP-GFPN-05ff43/amendments/v2_addendum_healthresolve.yaml
          sha256: ccb55334c542c809b8526e54a2985627a44c435e5ca68a14ef5f6a779291a70d
          locations:
            - lines: 462-465
              context: definition, "A launch is CLASSIFIED if its output or log enters v2_solver.classify_solve, any pass / fail check, a gate, an outcome class, or any recorded result field other than a cost measurement (wall, cpu or instruction counts)."
            - lines: 493-501
              context: CN-1 reading, "every other reachable msolve launch is unclassified (the callgrind child, v2_driver.py line 209 and v2_solver.py line 517, is expected)"
            - lines: 330-333
              context: HR-9 DV-11, "Callgrind and gb_only launches are listed separately"
      prior_value: >-
        The callgrind launch is a reachable msolve launch that is NOT
        classified, so the reachable classified sites are exactly two
        (v2_driver.py lines 165-166 and a1_health.py line 147).
      corrected_value: >-
        The callgrind launch is CLASSIFIED under the definition at lines
        462-465. Its record res["instructions_callgrind"] (v2_solver.py lines
        519-547) holds recorded result fields that are not cost measurements:
        child.outcome, child.returncode, child.rlimit_as_child_getrlimit,
        method, label, f4_core_function, f4_core_note and, when the child is
        not ok, reason. v2_driver.py copies the record into fixture and cell
        target rows (lines 358-360, 1174-1180). REG-1 (b) compares every
        fixture target entry of G1 with RUN-GFPN-ac4487 minus X1..X17
        (r2_reg1.py lines 256-262). X14-X17 exclude only child.wall_seconds,
        child.peak_vm_bytes, instructions_user and f4_core_inclusive_Ir
        (reg1-exclusion-list.json lines 35-42). A difference in any other
        field fails REG-1, and REG-1 gates every package after G1
        (r2_run_wrapper.py lines 21-24, 221-225). The reachable classified
        msolve launch sites are therefore THREE: v2_driver.py lines 165-166,
        a1_health.py line 147, and v2_driver.py line 209 -> v2_solver.py lines
        516-517.
      evidence: >-
        The census (census.md lines 310-315, 320-341, 343-354; receipt
        census_values_verbatim.CN1_reading lists all three reachable sites as
        classified by the literal definition) and the Coordinator's own
        reading under TASK-20260924-71ccd9 of v2_driver.py lines 158-214,
        v2_solver.py lines 512-552, r2_reg1.py lines 244-266,
        reg1-exclusion-list.json lines 1-44 and r2_run_wrapper.py lines
        210-234.
      why_it_matters: >-
        The draft's CN-1 reading makes it not approvable as written when a
        third reachable classified site exists (DEC-20260924-afdc3b). The
        exposure is real, although narrow. The callgrind child re-runs the
        same msolve argv (except the output path) under the same clock-seeded
        FGLM, so G1's REG-1 comparison of its non-cost fields is a comparison
        whose inputs include an independent draw of the clock second.
    - item: 2
      what: the phrase "whose output is never classified" in SE-2 (6)
      records:
        - id: AMD-EXP-GFPN-05ff43-20260923-solverevent
          path: experiments/EXP-GFPN-05ff43/amendments/v2_addendum_solverevent.yaml
          sha256: 011d4b2c11f99d696281ccfdd4d65ece4fefcc6ae71de3de813049bbeb2d9b7f
          locations:
            - lines: 272-275
              context: SE-2 (6), "NEVER ... for the callgrind child (whose output is never classified)"
        - id: AMD-EXP-GFPN-05ff43-20260924-seedresolve
          path: experiments/EXP-GFPN-05ff43/amendments/v2_addendum_seedresolve.yaml
          sha256: dc714a446a22a99fd6762196d4e6ad1b8c9e7eb3920d64cf26036f95ecadee81
          locations:
            - lines: 73-104
              context: incorporates SE-2 items (1)-(7) unchanged
      prior_value: >-
        No rule value is wrong. SE-2 (6) forbids re-solving the callgrind
        child, and the parenthesis gives the reason.
      corrected_value: >-
        A reading note, not a value change. "Never classified" is true in the
        narrow sense: the callgrind child's msolve output file
        (<tag>.cg.ms.out) is removed unread (v2_driver.py lines 210-213) and
        never reaches classify_solve. It is NOT true in the broader sense of
        the healthresolve definition, because the child's exit status and the
        callgrind_annotate-derived fields are recorded and compared (item 1).
        SE-2 (6) stands as approved: the callgrind child is never re-solved.
      evidence: The two records as cited; v2_driver.py and v2_solver.py as in item 1.
    - item: 3
      what: the preserved r2 static inventory's description of the callgrind site
      records:
        - id: TASK-20260923-de3a7d (stage r2 code, preserved)
          path: experiments/EXP-GFPN-05ff43/implementation-v2-r2/r2_devchecks_more.py
          sha256: be7b332df0fbcd881846ff03bf6ae27c3f248db855ced0db88b119bab7e59bab
          locations:
            - line: 530
              context: '"output never classified" (as the census quotes it, census.md line 341; this act did not open the file at that line)'
      prior_value: The callgrind site's output is never classified.
      corrected_value: >-
        Same narrow sense as item 2. An r3 file that starts from a copy of
        r2_devchecks_more.py must not carry that description into the r3
        DV-11 inventory without the distinction. The successor draft's
        callgrind disposition governs the r3 inventory.
      evidence: census.md line 341; the TASK-20260924-5ca2a5 preservation receipt binds the file at the sha256 above (census.md table row 49).

  nothing_else_changes: >-
    No file changes. The healthresolve draft stays ccb55334...291a70d (status
    draft, approved_by null). The solverevent draft stays 011d4b2c...9b7f and
    the seedresolve draft stays dc714a44...ee81 (both status draft,
    approved_by null). r2_devchecks_more.py stays be7b332d...9bab. No approved
    rule text changes: SE-2, SE-3, SF-1..SF-8, SC-1..SC-11, K = 5, the SF-2 (c)
    cap, the d-parsed branch, REG-1 and the exclusion list X1..X17 stand as
    approved. The remedy is the successor DRAFT
    AMD-EXP-GFPN-05ff43-20260924-launchcover, decided later by a separate act
    on archived bytes.

  cause: >-
    The phrase "never classified" entered with the solverevent draft (Act 5,
    SE-2 (6)) in the narrow classify_solve sense. The healthresolve draft (Act
    8) then defined CLASSIFIED broadly, to include any non-cost recorded field,
    so that the census could not miss a site again. It carried the narrow-sense
    expectation for the callgrind child into its own CN-1 reading without
    checking it against its new definition and REG-1's field list. No data,
    run or measurement is implicated.

  what_it_is_not:
    - NOT A CHANGE TO ANY FILE OR APPROVED RULE.
    - NOT A CHANGE TO ANY PRE-DECLARED READING OR ITS OUTCOME. The census applied the literal definition, and DEC-20260924-afdc3b applies the reading as written.
    - NOT EVIDENCE about D, the quotient, H-GFPN-9a29be or HEUR-GFPN-DFLAT.
    - NOT A FINDING THAT the callgrind measurement, REG-1 or the exclusion list is wrong. They are frozen and correct as approved. The defect is the draft's coverage expectation.

