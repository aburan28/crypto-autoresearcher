  limitations:
    - TOY TIER, ABSOLUTELY. Two toy curve instances (p = 62897 and p = 1045963, FIELD primes) from seed 4403, factor base 512, one host, one unreplicated run, sympy 1.14.0. No crypto-scale, medium-scale, affected-scheme or asymptotic claim follows from anything in this report.
    - This validation supplies session and implementation independence but NOT MODEL independence (both producer and validator resolved to claude-opus-5) and NOT host independence (same container, same scratchpad tree). Nothing here counts toward a closure quorum under standing basis 0137a051eb5828789eb267fa83c8278086578d4c.
    - THE DEEP-SMOOTH REGIME IS NOT TESTED. The nominal u=6 rung was unpowered at both cells (k_null = 18 and 10 against the floor of 30). V-CONSISTENT does not cover it.
    - LIMB (b) OF HEUR-DS-1 IS NOT TESTED. rho is a labelled diagnostic with zero decision weight. HEUR-DS-1's own falsification condition, which is phrased against rho, was not exercised.
    - The measured object is the ENCODED INTEGER N = e_1*p + e_2 + 1, not e_1, e_2 or any relation-yield quantity. No index-calculus consequence follows.
    - DR-3 as frozen is a blunt tail instrument (fire at T>=26 against an expectation of 9-10). A modest tail excess is invisible to it by design.
    - The exclusion / timeout / n_eff-reduction machinery was never exercised (zero exclusions), so it is untested at parameters where factorization can actually fail.
    - The analysis implementation was authored after the treatment data existed. That gap is closed by this validator's independent recomputation and by nothing else in the package.
    - The snapshot receipt's self-digest is not reproducible as recorded.
    - I did not run the orchestration adapter probe, so `model_verified` is false and the resolved model identifier below is unverified runtime-reported configuration.
    - Budget: 4800 s wall / 8 GB granted; approximately 1500 s and 0.2 GB used. NO WORK WAS DROPPED FOR BUDGET REASONS. No timeout, crash or resource exhaustion occurred; had one occurred it would have been recorded as resource exhaustion and never as negative mathematical evidence.

