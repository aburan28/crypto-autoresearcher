        CELL-20: mine D_power=0.6415805406066536, reported identical -> POWER-OK.
        verdict: CONFIRMED. The instrument demonstrably has power to reject in this very run, so the DR-1 not-reject is informative rather than vacuous.
      DR-6_apparatus_identity:
        CELL-16: mine D_ident=0.003309992661448158, reported identical; 52% of threshold -> IDENT-OK (does not reject, as required).
        CELL-20: mine D_ident=0.005687377690802298, reported identical; 89% of threshold -> IDENT-OK, but see the note in observations - this is a narrow pass on an arm that is the SAME distribution by derivation.
        verdict: CONFIRMED
      poisson_thresholds_in_the_frozen_contract:
        P_T_ge_26_given_Poisson_10: contract 1.768e-05, my direct summation 1.7680272e-05 MATCH
        P_T_le_1_given_Poisson_10: contract 4.994e-04, my direct summation 4.9939923e-04 MATCH
        verdict: CONFIRMED - these are properties of the frozen thresholds, computed before any datum, and they check out.
      verdict_map_application:
        result: >-
          I re-applied the map by hand at both cells. Instrument gate: POWER-OK
          and IDENT-OK and A-NULL DECAY-clean and INTEG-1..5 pass and exclusions
          0 -> PASSES. n_powered = 4, so the M-UNPOWERED branch (n_powered < 2)
          does not fire. DR-1 NOT-REJECT, DR-3 TAIL-CLEAN, no powered DR-2 FAIL,
          A-REAL DECAY-clean -> V-CONSISTENT. Identical at both cells.
        code_check: analyze.py lines 257-268 implement the branches in the contract's own order and terms; no rule was silently substituted, relaxed, tightened or dropped.
        verdict: CONFIRMED
    summary_of_recomputation: >-
      EVERY reported number in RESULTS.json and null_calibration.json that I
      recomputed reproduced EXACTLY, to the last floating-point bit, from an
      independent implementation. I found ZERO numerical discrepancies. The
      defects listed below are governance, labelling and scope defects, not
      arithmetic ones.

  # =====================================================================
  # 4. THE SPECIFIC CHECKS THE TASK CARD DEMANDED
  # =====================================================================
  targeted_checks:
    i_lt_j_by_construction:
      what_i_read: >-
        driver.py arm_integers(), the actual generator used by the treatment
        arms: "`for i in range(FB_SIZE): for j in range(i + 1, FB_SIZE):`. The"
        inner loop begins at i+1, so no pair with i == j is ever CONSTRUCTED.
        There is no filter, no skip, no continue, and no removal step anywhere
        in the pair path. (driver.py also carries a build_pairs() helper with
        the same bounds; it is not on the executed path, which uses the inline
        loop - noted for completeness, the bounds are identical.)
      verdict: CONFIRMED BY CONSTRUCTION, from the code, not from the claim.
      would_a_c2_zero_have_been_caught: >-
        YES, and fatally, which is what the contract requires. pair_e1_e2()
        raises SystemExit("INTEG-2 FAILURE: c2==0 ...") BEFORE computing the
        modular inverse. A single occurrence would have aborted the arm, not
        skipped a sample. The path is a hard gate, exactly as INTEG-2 specifies.
      occurrences: >-
        ZERO, independently confirmed: my own enumeration computed c_2 for all
        130816 pairs at both cells and found 0 zeros, and independently
        confirmed the 512 factor-base x-coordinates are pairwise distinct, which
        is why c_2 = (x_i - x_j)^2 cannot vanish.
      also_confirmed: pair count exactly 130816 = C(512,2) at both cells, and the (i,j) sequence strictly increasing in lexicographic order.
    null_ordering:
      verdict: CONFIRMED - see section 1.1, verified four ways including two that do not depend on any producer assertion.
    DR1_and_DR2_re_derivation:
      verdict: CONFIRMED - see section 3. Threshold formula 1.63*sqrt(2/130816) = 0.006373414579727891 recomputed exactly; every rate band recomputed at every rung of both cells.
      on_the_narrow_margin: >-
        CELL-16's D = 0.004808 is 75.4% of threshold. The producer flagged this
        itself as OBS-3 rather than burying it, which is correct conduct. See
        observations for the material point the package DOES NOT make about it.
    DR3_tau_committed_before_treatment:
      verdict: CONFIRMED. tau is a pure function of A-NULL; A-NULL's arm files predate null_calibration.json which predates every treatment file; and I regenerated tau independently to the exact bit.
    DR5_DR6_instrument_gate:
      verdict: CONFIRMED. The ENC-A power arm REJECTS at ~98x threshold at both cells; the identity arm DOES NOT reject at either cell. The gate behaved as claimed, so the treatment reading is not vacuous and M-INSTR correctly did not fire.
      caveat_recorded: IDENT-OK at CELL-20 is a narrow pass (89% of threshold) on an arm that is the same distribution BY DERIVATION. See observations.
    sample_accounting:
      claim: 1046528 factorization calls, zero exclusions, zero timeouts, zero errors, zero N==1 records.
      my_determination: >-
        EXCELLENT HYGIENE IS NOT THE EXPLANATION, AND NEITHER IS UNDETECTED
        FAILURE. Zero exclusions is the MATHEMATICALLY EXPECTED outcome at this
        size and I established that by measurement: my own re-run factored all
        1046528 integers - every one below 2^40 - with NO timeout guard at all,
        in 181 s single-threaded, with zero failures. There is nothing here for a
        5 s per-integer timeout to catch.
      is_the_detection_path_real: >-
        YES. factor_record() wraps each factorint in signal.setitimer(ITIMER_REAL, 5),
        returns status "timeout" or "error", and the caller records the index in
        a failures list and marks status 2/3, which feeds exclusions and n_eff.
        It also verifies each certificate by reconstruction (every base prime
        under isprime, every exponent >= 1, prod(q**e) == N) and returns "error"
        on any failure. The path is correct in code.
      honest_qualification: >-
        BUT IT WAS NEVER EXERCISED IN THIS RUN. Zero exclusions means the
        exclusion, imputation-refusal and n_eff-reduction machinery is UNTESTED
        here, and the contract's 0.1%-exclusion M-INSTR branch never fired. That
        is not a defect; it is an untested error path, and a successor at a size
        where factorization can actually fail should not assume it works because
        it was silent here.
      certificate_verification: >-
        1046528 records verified by reconstruction, 0 failures; INTEG-4
        re-factored a deterministic 1-in-1000 subsample (131 per arm, 1048 total)
        with an independent trial-division + Pollard-rho routine that does not
        call sympy.factorint - 0 disagreements. I read that routine; it is
        genuinely independent of the sympy path.
      verdict: CONFIRMED, with the untested-error-path qualification recorded.

  # =====================================================================
  # 5. CONTROL CHECKS
  # =====================================================================
  control_checks:
    - control: A-NULL, the measured null object (uniform integers on the SAME range [1, p^2], identical pipeline, only the integer source differs).
      required_by: docs/inventor-protocol.md section 3 - a statistical signal without a null object of the same shape is not evidence.
      present: true
      measured_at_the_actual_X: true - X = p^2 exactly, not the modeled bound D = 2^(2*bits). The contract forbids the D-range substitution explicitly and the code honours it.
      independently_regenerated: true - identical N-sequence sha256 at both cells.
      verdict: "CONFIRMED. This is the design's central virtue: the calibration is a measured null, not an asymptotic model."
    - control: A-POWER (ENC-A), the positive control / power certificate.
      expected_in_advance: must REJECT, because a product of two integers below p is derivably smoother than a uniform integer below p^2.
      measured: D_power = 0.6279 (CELL-16) and 0.6416 (CELL-20) against threshold 0.006373 - rejects at ~98x and ~101x threshold.
      verdict: CONFIRMED. The apparatus demonstrably rejects a derivably-different sample in the same run.
    - control: A-IDENT (ENC-B on uniform (e_1,e_2)), the apparatus-identity / negative control.
      expected_in_advance: must NOT reject, because ENC-B is a bijection [0,p)x[0,p) -> [1,p^2], so A-IDENT and A-NULL are the same law by derivation.
      measured: D_ident = 0.003310 (CELL-16, 52% of threshold) and 0.005687 (CELL-20, 89% of threshold) - does not reject at either cell.
      verdict: CONFIRMED, with the CELL-20 narrowness recorded in observations.
      correctly_not_treated_as_corroboration: the contract, null_calibration.json and RESULTS.json all state in advance and in place that IDENT-OK corroborates nothing. Correct.
    - control: the decay / artifact-tell check (DR-4).
      what_the_measured_quantity_SHOULD_do: the smooth fraction must fall as the smoothness bound Bsm falls (as the nominal u rises). A flat or non-decaying smooth fraction is the canonical artifact tell that the sampled quantity is not the intended object.
      does_the_report_state_this: YES - the contract states it as DR-4 and H-SMTH-001 states the stronger quantitative version.
      measured: >-
        It decays, and steeply. Recomputed decay ratio p(deepest rung)/p(shallowest rung):
        CELL-16 A-NULL 4.13e-4, A-REAL 3.94e-4, A-IDENT 2.78e-4;
        CELL-20 A-NULL 2.35e-4, A-REAL 3.07e-4, A-IDENT 4.07e-4.
      verdict: CONFIRMED. The canonical artifact tell is ABSENT. No arm shows a quantity that fails to decay when it should.
    - control: null-object discrimination of the decay tell itself.
      finding: >-
        I additionally applied H-SMTH-001's stronger frozen decay predicate
        (ratio must not exceed 100*rho(6)/rho(2) = 0.006404). A-REAL, A-NULL and
        A-IDENT pass it by more than an order of magnitude at both cells;
        A-POWER FAILS it at CELL-16 (0.00767 > 0.006404) and sits just under at
        CELL-20 (0.00544). The tell therefore discriminates the derivably
        different arm and does not fire on the treatment - a control on the
        control.
      status: REPORTED-ONLY by me. This predicate is in H-SMTH-001, NOT in the frozen EXP-SMTH-4403c4 rule set, so it carries no decision weight here and I do not score the run against it. Recorded because it points the same way as DR-4.

  # =====================================================================
  # 6. HEURISTIC-VALIDATION CHECKS
  # =====================================================================
  heuristic_validation_checks:
    - check: Pre-registered prediction recorded before or independently of sampling.
      finding: >-
        CONFIRMED for the rules that decide. Every threshold (KS constant 1.63,
        rate-band constant 3.09, powered floor k_null>=30, tau rank 10, fire
        range T>=26 / T<=1, the ladder, n=130816) is in the contract whose
        sha256 was recorded by a task that produced no datum. The data-dependent
        quantities (tau, powered set, half-widths) are functions of the MEASURED
        NULL, committed and hashed before the first treatment integer.
      qualification: the analysis IMPLEMENTATION was authored post-treatment (section 1.1) - closed by my reproduction, not by pre-registration.
    - check: Was the Dickman-de Bruijn rho model itself pre-registered as the prediction?
      finding: >-
        NO, AND DELIBERATELY SO, AND THIS IS A STRENGTH RATHER THAN A GAP. The
        contract decides limb (a) only - "behaves like uniform random integers
        of the same size" - against a MEASURED null at the actual X, and demotes
        rho to a labelled reported-only diagnostic. Its stated reason is exactly
        the one the validator contract warns about: at X = p^2 with p < 2^20 the
        finite-X smooth density differs from asymptotic rho by an unmeasured
        amount, and scoring against rho would attribute a model error to the
        object under test.
      consequence_that_must_be_recorded: >-
        THIS RUN THEREFORE DOES NOT TEST HEUR-DS-1'S OWN STATED FALSIFICATION
        CONDITION, which in H-DS-001 is phrased as a KS distance from Dickman
        rho(u). Limb (b) is untested. No deliverable may say HEUR-DS-1's
        falsification condition was exercised.
    - check: Did rho enter any rule anywhere? (Priority 3)
      finding: >-
        CONFIRMED IT DID NOT. I traced every use of dickman_rho() in analyze.py:
        exactly two call sites, both inside the field
        MODELED_dickman_rho_u_DIAGNOSTIC_ZERO_DECISION_WEIGHT (the value, and
        the reported rho/p_null ratio). No verdict, threshold, gate, powered-rung
        determination, tau, half-width or branch reads it. null_calibration.json
        contains no rho at all. The verdict map never references it.
      verdict: CONFIRMED
    - check: Sample size, seeds and sampling procedure in the manifest; ECDF and tail statistics recomputed from raw samples.
      finding: >-
        CONFIRMED. n = 130816 per arm, 8 arms, 1046528 total; master seed 4403;
        stream objects NULL-UNIF and NULL-SYNTH; sampler fully specified
        (rejection, k = X.bit_length() bits, modulo reduction forbidden). The
        treatment arm carries NO seed because it is exhaustive over all
        C(512,2) pairs - reproducible from (p,a,b,FB) alone, which I verified by
        reproducing it. I recomputed the ECDF-based statistics (D, D_power,
        D_ident) and the tail statistics (tau, T) from raw samples I generated
        and factored myself. Exact agreement.
      caveat: >-
        Per-record certificates are not retained as a file (declared D8). What
        IS retained - per-arm N-sequence sha256 - proved sufficient: it let me
        prove my regenerated sequences are the SAME integers, which is a
        stronger binding than a certificate dump would have given for the same
        bytes. Recorded as adequate.
    - check: Correspondence validity - does a substitute sampler stand in for the object of interest?
      finding: >-
        YES, AND THIS IS THE MOST IMPORTANT SCOPE ITEM IN THE PACKAGE. Two
        substitutions are in play, both inherited from H-SMTH-001/EXP-SMTH-001
        and both declared:
        (i) HEUR-DS-1 speaks of intermediates "on uniform random targets"; this
        run enumerates all i<j FACTOR-BASE PAIRS exhaustively, with no target
        point in the construction at all;
        (ii) the measured object is not e_1, e_2 or the intermediate itself but
        the ENCODED INTEGER N = e_1*p + e_2 + 1, and it is the smoothness OF
        THAT ENCODING that is measured.
      is_a_theorem_cited_for_the_substitution: >-
        For (ii) the contract cites a derivable fact - ENC-B is a bijection
        [0,p)x[0,p) -> [1,p^2] - and it CONTROLS the encoding with A-IDENT,
        which is the correct control and it passed. For (i) NO theorem is cited
        connecting exhaustive factor-base-pair enumeration to the "uniform
        random targets" of HEUR-DS-1's sentence; the connection is definitional,
        inherited from INT-1.
      what_is_NOT_established_and_must_not_be_implied: >-
        That the smoothness of N_ij bears on relation yield in an index-calculus
        search. A relation search needs the underlying quantities to be smooth,
        not their bijective packing into a single integer of twice the size. A
        bijection preserves the LAW of the pair but NOT the smoothness of its
        parts. The contract concedes the near neighbourhood of this in its
        interpretation_limits ("A different faithful encoding of the same fibre
        could carry a different smoothness law"), which is honest, but it never
        says the plainer thing, so I say it here: NOTHING MEASURED IN THIS RUN
        IS A RELATION-YIELD QUANTITY, and V-CONSISTENT is a statement about a
        constructed integer, not about index calculus.
      verdict_on_the_substitution: DECLARED AND CONTROLLED for the encoding; DEFINITIONAL AND UNCITED for the target model. Neither is concealed; the second deserves a sentence in the evidence record.
    - check: Scale binding - do the parameter sizes match the claimed scale?
      finding: >-
        CONFIRMED AND CORRECTLY LIMITED. p = 62897 (16-bit FIELD) and
        p = 1045963 (20-bit FIELD); X = p^2 at 32 and 40 bits. The claim tier is
        `toy` in every artifact, and toy-scale validation is recorded as a
        limitation in the contract, the manifest scope_statement and the
        snapshot receipt. AGENTS.md rule 7 satisfied. No crypto-scale or
        asymptotic reading is offered anywhere in the package.
    - check: Would the claimed improvement need the section-6 scaled-down ladder of docs/inventor-protocol.md?
      finding: >-
        NOT APPLICABLE, and I checked rather than assumed. NO IMPROVEMENT, NO
        SPEEDUP AND NO COMPLEXITY CLAIM IS MADE ANYWHERE IN THIS PACKAGE. The
        contract states "No cost saving, no exponent, no early-abort licence, no
        ECDLP consequence" and records knowledge_scope.dominated_by "Pollard rho
        at generic exact-ECDLP exponent 1/2" with sota_delta 0. There is
        therefore no speedup for a step-2 measured ratio to attach to, and the
        absence of one is NOT a `failed` finding here.
      warning_for_successors: >-
        If any successor converts a V-CONSISTENT reading into an early-abort or
        cost argument, the section-6 ladder applies in full at that moment, and
        this run supplies NONE of its rungs - in particular no baseline, no
        measured ratio, and no cost measurement of the abort test itself (the
        contract says so: "the cost of the abort test is not measured here and R
        is not measured at all").

  # =====================================================================
  # 7. COST-MODEL CHECKS
  # =====================================================================
  cost_model_checks:
    - check: Is a concrete cost table presented?
      finding: NO. The package presents no cost table, no cost unit, no per-attempt cost and no success probability. Nothing to audit for unit honesty.
      verdict: NOT APPLICABLE - and correctly so, since the contract forbids any cost consequence from any outcome.
    - check: Resource accounting of the run itself (which IS reported and IS auditable).
      finding: >-
        Reported with unit and with memory beside time: 859 s wall of a 5400 s
        ceiling; peak process-tree RSS 629436416 bytes = 0.59 GB of an 8 GB
        ceiling, obtained by an actual re-execution under resource.getrusage
        rather than by estimate; 20 python invocations of 30; 1046528
        factorization calls exactly equal to the declared ceiling; per-arm
        factorization seconds reported individually. halted_on_budget false,
        dropped_work NONE.
      verdict: CONFIRMED. Memory is reported alongside time and was measured, not asserted.
    - check: Was the substituted throughput figure (defect D2) load-bearing on any measured quantity?
      finding: NO - see section 8.

  # =====================================================================
  # 8. PRIORITY 4 - RULING ON D2
  # =====================================================================
  D2_ruling:
    defect: >-
      The frozen contract's budget_feasibility_statement directs the executor to
      read experiments/EXP-SMTH-002/results/feasibility_report.json, which does
      not exist. I confirmed the absence independently.
    what_the_executor_did: >-
      It did not improvise silently and it did not fabricate a figure. It
      substituted the MEASURED throughput from the real EXP-SMTH-002 run record
      (RUN-SMTH-PILOT-002 manifest cell_resources: 1046528 factorizations in
      245.31 wall s), added its own live budget probe (8587/s at 16-bit,
      8168/s at 20-bit, on python-random integers explicitly marked NOT
      EXPERIMENT DATA), and recorded the substitution in three places: the
      budget stamp, protocol_deviations D2, and checks_that_did_not_run.
    my_ruling_on_the_handling: >-
      CORRECT, and it is the best available branch. The contract is frozen and
      cannot be edited; the required input is a MEASURED throughput, and the
      executor obtained a measured throughput from the real artifact the missing
      report would have summarised, plus a fresh direct measurement. It named
      the substitution instead of hiding it. The alternative branches were worse:
      halting on a missing feasibility summary would have converted a stale
      cross-reference into a non-measurement, and inventing a number would have
      violated AGENTS.md rule 5.
    does_it_affect_anything_measured: >-
      NO, and I verified this rather than assuming it. The throughput figure
      feeds ONLY the go/no-go budget planning and the cell-ordering rule. It
      enters no arm, no statistic, no threshold and no verdict. The probe
      integers come from a separate python random.Random(999999) stream that
      never touches an arm. The budget was not binding in any case: 859 s used
      of 5400 s, and 4954 s remained at CELL-16 completion against the 2400 s
      threshold for authorising CELL-20, so the cell-ordering decision was not
      close and would not flip under any plausible throughput estimate.
    verdict: CONFIRMED - correct handling, zero effect on any measured quantity.
    residual: The dangling reference stays in a frozen file. A successor contract must fix it; it cannot be repaired in place, and the Coordinator has already said so.

  # =====================================================================
  # 9. PRIORITY 3 - WHAT IS NOT TESTED, AND WHETHER THE PACKAGE SAYS SO CLEARLY ENOUGH
  # =====================================================================
  not_tested_and_clarity_ruling:
    limb_b_dickman_rho:
      status: NOT TESTED.
      does_rho_enter_any_rule: NO - traced to two diagnostic call sites, confirmed in section 6.
      is_it_stated_clearly: >-
        YES, EXCEPTIONALLY SO. Stated in the contract's heuristic_under_test,
        in why_limb_b_is_not_the_calibration (which declares any run scoring a
        rule against rho to be invalid_measurement), in the deliberate-change
        list, in the manifest's checks_that_did_not_run and scope_statement,
        and in the snapshot receipt's NOT_TESTED field. Every rho field in
        RESULTS.json is NAMED
        MODELED_dickman_rho_u_DIAGNOSTIC_ZERO_DECISION_WEIGHT, so the label
        travels with the value into any downstream copy-paste. This is the
        strongest form of the safeguard.
      verdict: CONFIRMED CLEAR.
    deep_smooth_regime:
      status: NOT TESTED. The nominal u=6 rung is UNPOWERED at both cells (k_null = 18 at CELL-16, 10 at CELL-20, against the pre-registered floor of 30, which I recomputed and confirmed).
      the_distinction_that_matters: >-
        M-UNPOWERED did NOT fire because FOUR of five rungs were powered - the
        contract's stated precondition is "FEWER THAN TWO ladder rungs POWERED".
        It did not fire because the deep tail was covered. It was never going to
        fire on this data, and the contract predicted exactly that before any
        datum.
      is_it_stated_clearly_enough: RULING - CLEARLY IN THE CONTRACT AND THE MANIFEST; NOT CLEARLY ENOUGH IN RESULTS.json, WHICH IS THE ARTIFACT A FUTURE READER WILL CITE.
      evidence_for_that_ruling:
        where_it_IS_said_well:
          - contract reach_and_power (c) - "THE CONSTANT-FACTOR CLAIM OF HEUR-DS-1 IN THE DEEP-SMOOTH REGIME IS THEREFORE NOT TESTED BY THIS EXPERIMENT", written before any datum, and it names the exact rungs.
          - contract is_this_contract_designed_to_be_inconclusive - "if the only deviation HEUR-DS-1 has is in the deep tail, this contract will return V-CONSISTENT or M-UNPOWERED and will have said nothing about it".
          - run_manifest checks_that_did_not_run and scope_statement.
          - snapshot receipt NOT_TESTED, which states the M-UNPOWERED distinction explicitly.
        where_it_is_NOT_said: >-
          RESULTS.json. Its top level carries schema, ids, hashes, cells and
          inference - and NO scope, limitation or not-tested block of any kind.
          Its cell objects end with `powered_rung_count: 4` and
          `verdict_id: V-CONSISTENT`. The ONLY trace of the untested deep tail
          inside RESULTS.json is the per-row string "NOT SCORED (rung
          UNPOWERED, reported only)" buried in the DR-2 table, and the strings
          "not tested", "deep-smooth" and "limitation" appear ZERO times in the
          whole file. A reader who opens the results artifact, reads
          `verdict_id: V-CONSISTENT` and cites it has to reconstruct the gap
          from a table row.
      required_mitigation: >-
        The evidence record must place the not-tested statement ADJACENT TO the
        V-CONSISTENT label, not in a separate section, and must say in the same
        breath that V-CONSISTENT covers four powered rungs and the bulk
        distribution and covers NEITHER the deep-smooth tail NOR limb (b). The
        Coordinator's snapshot receipt already does this correctly and is the
        model to copy.
      severity: MODERATE. This is exactly the place a toy-scale reading could be over-read, and the mitigation is one sentence.
    additional_untested_reach_limit_i_am_adding:
      finding: >-
        DR-3 AS FROZEN IS A VERY BLUNT TAIL INSTRUMENT, and the package does not
        say so. Its fire range is T>=26 or T<=1 against an empirical null
        expectation of 9-10, i.e. nominal one-sided alpha ~1.8e-5. I computed
        the implied sensitivity: at CELL-20 the measured T = 15 against an
        observed null exceedance of 9 corresponds to P(Poisson(10) >= 15) ~ 0.083
        - a factor 1.5 tail excess that a conventional test would call
        unremarkable but not nothing, and that DR-3 as frozen could not have
        flagged at any level short of a 2.6x excess.
      status: >-
        REPORTED-ONLY BY ME. The rule was applied EXACTLY as written and T = 15
        is squarely inside the pre-registered non-fire range; post-hoc rescoring
        is forbidden by the contract and I am not doing it. This is a statement
        about the instrument's reach, not about the result, and it reinforces
        rather than contradicts the deep-tail limitation above.
    OBS_2_rho_over_p_null_falling_to_0.10_and_0.18:
      does_it_deserve_its_own_experiment: NO, ON THIS EVIDENCE - but it deserves to be recorded as an observation and to bind any successor that uses rho.
      reasoning_from_the_artifacts_only: >-
        The ratio is computed on the A-NULL arm, i.e. on UNIFORM RANDOM INTEGERS
        drawn on [1, p^2]. It is therefore a measured property of uniform
        integers at this X and this ladder, and CONTAINS NO INFORMATION ABOUT THE
        OBJECT UNDER TEST. It cannot become a signal about Semaev structure no
        matter how large it gets, because the treatment arm does not enter it.
        Recomputed independently: the ratio falls monotonically across the
        ladder at both cells, and the fall is driven by the deep rungs where the
        counts are 151, 18 and 84, 10 - i.e. precisely the rungs the contract
        declared unpowered.
      what_it_IS_good_for: >-
        It quantifies the size of the substitution error that this batch existed
        to avoid. It is direct measured evidence that scoring a finite-X sample
        against asymptotic rho at these parameters would have misattributed up
        to a factor ~10 of model error to the object. That is a real, if modest,
        knowledge candidate about the INSTRUMENT.
      binding_recommendation: >-
        Any successor contract that reintroduces rho into a decision rule at
        finite X must first measure this correction at its own X. This run shows
        the correction is not small.
      i_did_not_use_literature: >-
        Per DEC-20260731-019 ruling 3 I neither promote nor dismiss this
        observation by recollection of the smoothness literature. Everything
        above is derived from the arms in this package.

  # =====================================================================
  # 10. DEFECTS AND FINDINGS, WITH PER-CLAIM VERDICTS
  # =====================================================================
  defects_found:
    - id: D1
      already_declared_by: the executor (protocol_deviations D1) and the Coordinator (APPROVAL-DETERMINATION.md).
      severity: GOVERNANCE, HIGH.
      finding: The AGENTS.md experiment lifecycle draft -> review_required -> approved -> running was violated; the contract ran at status frozen_pending_approval with approved_by null.
      my_disposition: See section 1. Admissible at reduced standing with the defect permanently on the face of any citing record. Not curable retroactively.
    - id: D1b
      newly_named_by_this_validation: true
      severity: LOW-MODERATE.
      finding: >-
        The frozen contract sets `evidence_eligible: true` in its own header
        while simultaneously setting `approved_by: null` and status
        frozen_pending_approval, and its status_note asserts that the executing
        task "is authorized by its dispatch card and by the freeze receipt hash
        check". A contract asserting its own evidence-eligibility and its own
        execution authorisation is the authoring task granting itself a
        permission AGENTS.md reserves to the Coordinator. This is a second,
        independent route by which the approval gate was bypassed, and it is
        inside the frozen file rather than in the queue.
      my_disposition: >-
        I gave that field ZERO weight and ruled eligibility independently of it.
        The field is frozen and must not be edited. A successor contract must
        not carry an `evidence_eligible` field at all; eligibility is the
        Coordinator's determination, recorded outside the contract.
    - id: D2
      severity: LOW.
      finding: dangling contract reference to a non-existent feasibility_report.json.
      my_disposition: Handling CONFIRMED correct; zero effect on anything measured. Section 8.
    - id: V1
      newly_named_by_this_validation: true
      severity: LOW (reporting), but it is a WRONG STATEMENT IN A CONTRACT-REQUIRED FIELD.
      finding: >-
        DR-1's `direction_recorded` field is a HARDCODED STRING. analyze.py
        lines 117-119 emit "real SMOOTHER than null (F_real above F_null is at
        low z; ...)" regardless of the sign, interpolating only the number. At
        CELL-16 the signed deviation is +0.004808, which by the very next field
        (`direction_plain`) means "A-REAL has MORE mass at small z (rougher)".
        SO THE TWO ADJACENT FIELDS IN RESULTS.json CONTRADICT EACH OTHER AT
        CELL-16, and direction_recorded is the one that is wrong. It happens to
        be right at CELL-20 only because the sign there is negative.
      corroboration: >-
        At CELL-16 k_real < k_null at ALL FIVE ladder rungs (43140<43566,
        7624<7942, 967<987, 137<151, 17<18), i.e. the treatment is uniformly
        ROUGHER at that cell, confirming direction_plain and refuting
        direction_recorded.
      decision_weight: NONE. The contract states the direction "carries no threshold of its own; it is a descriptive field". No verdict depends on it.
      required_mitigation: The evidence record must NOT quote CELL-16's direction_recorded string. If direction is reported at all, report the signed deviation and direction_plain.
    - id: V2
      newly_named_by_this_validation: true
      severity: LOW.
      finding: >-
        run_manifest.json's per_arm_records for 20/A-REAL reports
        factorization_seconds 10.219 and generation_seconds 0.3347, but
        RESULTS.json (written earlier, and the file that was actually scored)
        reports 9.644 and 0.3232 for the same arm. The manifest's numbers come
        from the command-18 RE-EXECUTION, not from the scored run, and the
        manifest does not say so. I confirmed this from the surviving
        arm-20-A-REAL.json.orig backup: the pre-rerun and post-rerun records
        differ in EXACTLY those two timing fields and in nothing else - same
        N_sequence_sha256, same counts, same integrity results.
      decision_weight: NONE. Timings enter no rule. The data are bit-identical, which is itself a positive reproduction result.
      required_mitigation: "One sentence in any successor manifest: which execution a reported timing came from."
    - id: V3
      newly_named_by_this_validation: true
      severity: LOW.
      finding: >-
        H-SMTH-001's test_boundary names "one curve instance per field size from
        master seed 2201". EXP-SMTH-4403c4 uses master seed 4403 and does not
        declare this as a departure, although it does explicitly declare its
        other departures (Bfb 512 vs H-DS-001's {64,128,256}; i<j vs i<=j;
        measured null vs rho; CELL-20 conditional).
      consequence: >-
        The run tests H-SMTH-001 on a DIFFERENT curve instance than that
        hypothesis's declared test boundary names. It remains inside the
        boundary's family ("toy prime fields at bits in {16,20}, one curve
        instance per field size"), so nothing is invalidated, but the departure
        should be named rather than inferred.
      required_mitigation: Name it in the evidence record's test-boundary field.
    - id: V4
      newly_named_by_this_validation: true
      severity: LOW (an incompleteness in the AGENTS.md artifact policy, not in the science).
      finding: stdout/stderr are retained for 5 of 18 commands; the eight arm commands and the analysis command have none. The substance is preserved in run_manifest.per_arm_records, so nothing measured is lost.
    - id: V5
      newly_named_by_this_validation: true
      severity: INFORMATIONAL.
      finding: >-
        The producer's ks2() (analyze.py lines 23-46) does not process
        thresholds after ONE sample is exhausted, so in principle it could
        UNDERSTATE D when the maximal deviation lies in the extreme upper tail -
        a bias in the direction that makes NOT-REJECT more likely and therefore
        favours V-CONSISTENT. I implemented the tail explicitly and got
        BIT-IDENTICAL D at all six comparisons across both cells, so THE BIAS
        DID NOT MATERIALISE HERE. Recorded so a successor does not inherit the
        omission at parameters where the tail could bind.

  understated_claims_found:
    preamble: >-
      Audited in both directions as instructed. The package is, on the whole,
      MORE conservative than its own data require. Three understatements follow.
    items:
    - id: U1
      finding: >-
        The package flags OBS-3 (CELL-16's D at 75% of threshold) as a caution
        but NEVER NOTES THAT THE TWO CELLS DEVIATE IN OPPOSITE DIRECTIONS.
        CELL-16's signed deviation is +0.004808 (treatment ROUGHER than null;
        k_real < k_null at all five rungs). CELL-20's is -0.002408 (treatment
        SMOOTHER; k_real > k_null at four of five rungs). A structural effect
        would not flip sign between two cells of the same construction. The sign
        flip is material evidence that the CELL-16 near-miss is sampling noise
        rather than a suppressed signal - and it makes the not-reject STRONGER
        than the package presents it.
      why_this_matters: A future reader given only OBS-3 could reasonably suspect a real effect hiding just under threshold at CELL-16. The second cell argues against that, and the package does not say so.
      caution_i_attach: This is a two-cell observation on one unreplicated run. It weakens a worry; it does not establish anything, and it must not be reported as replication.
    - id: U2
      finding: >-
        The package reports DR-4 only as a monotonicity check ("no violations").
        It does not report the QUANTITATIVE decay ratio, even though
        H-SMTH-001's own frozen prediction supplies a threshold for it
        (100*rho(6)/rho(2) = 0.006404) and the treatment arm beats that
        threshold by more than an order of magnitude at both cells (3.94e-4 and
        3.07e-4), while the deliberately-different A-POWER arm FAILS it at
        CELL-16. The canonical artifact tell is not merely absent; it is
        absent with margin, and the check discriminates.
      status: I report this as reported-only. It is not in the frozen rule set of THIS contract and scores nothing here.
    - id: U3
      finding: >-
        The manifest describes the command-18 rerun mainly as a resource
        measurement. It is also a genuine bit-exact in-run reproduction of a
        full treatment arm (identical N_sequence_sha256, identical counts,
        identical integrity results - I verified this from the .orig backup),
        which is a stronger reproducibility claim than the package makes for
        itself.

