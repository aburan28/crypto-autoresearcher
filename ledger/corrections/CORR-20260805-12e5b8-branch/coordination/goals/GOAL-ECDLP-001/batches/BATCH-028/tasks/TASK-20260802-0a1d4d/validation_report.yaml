  # =====================================================================
  # 0. WHAT THIS REPORT IS AND IS NOT
  # =====================================================================
  scope_of_this_report:
    what_it_is: >-
      An independent check of whether the BATCH-028 receipt is admissible
      evidence, and a bit-exact independent recomputation of every reported
      statistic from first principles.
    what_it_is_not: >-
      It assigns NO official state, NO evidence strength, and recommends NO
      promotion. It does not support any ECDLP claim, does not demonstrate any
      speedup, and authorizes no promotion of any hypothesis. TOY TIER: no
      crypto-scale, medium-scale, affected-scheme or asymptotic claim is made
      or supported under any outcome recorded here.
    independence_supplied:
      session_independence: true
      implementation_independence: true
      model_independence: false
    independence_statement: >-
      THIS SESSION SUPPLIES SESSION AND IMPLEMENTATION INDEPENDENCE BUT NOT
      MODEL INDEPENDENCE under standing basis
      0137a051eb5828789eb267fa83c8278086578d4c. The producer and this validator
      both resolved to claude-opus-5. NOTHING HERE COUNTS TOWARD A CLOSURE
      QUORUM. A further caveat, recorded rather than smoothed over: the
      producer's scratchpad and this validator's scratchpad are the SAME
      session directory
      (/tmp/claude-0/-home-user-crypto-autoresearcher/42d1537b-.../scratchpad),
      so this is not host independence either. Implementation independence is
      real - the re-implementation below shares no line of producer code - but
      it is single-host, single-model.

  # =====================================================================
  # 1. PRIORITY 1 - THE ADMISSIBILITY RULING
  # =====================================================================
  admissibility_ruling:
    question_put: >-
      GIVEN that pre-registration integrity is claimed to be independently
      verifiable from the hash chain, and GIVEN that no prospective Coordinator
      approval exists, is this run admissible as evidence, and at what
      standing?
    ruling: ADMISSIBLE AS A MEASUREMENT RECEIPT, AT REDUCED STANDING, WITH DEFECT D1 RECORDED PERMANENTLY ON THE FACE OF ANY EVIDENCE RECORD THAT CITES IT.
    ruling_is_conditional_on_two_things_i_verified_myself:
      - The integrity property approval protects was verified by me from artifacts, file timestamps and code - not accepted on assertion. Detail in section 1.1.
      - The ENTIRE measurement was independently re-derived bit-exactly by a re-implementation written from the frozen contract text alone. Detail in section 3.
    if_either_had_failed: >-
      I would have ruled INADMISSIBLE. Neither is a formality. The ruling is
      therefore NOT a general holding that approval is optional when a hash
      chain looks clean; it is a holding that in THIS case the specific thing
      approval would have protected was independently established by other
      means that a reviewer could check, and the numbers were reproduced from
      scratch.

    '1.1_integrity_property_tested_by_me_not_accepted_on_assertion':
      contract_sha256_recomputed_by_this_task: 664e37a3752b984f6b213dde21c9d7c26e891708325185c785f36c5d6462eb6f
      matches_freeze_receipt: true
      matches_snapshot_receipt: true
      matches_committed_blob_at_f846c8dd: true
      matches_current_worktree_bytes: true
      freeze_task_produced_no_datum:
        verdict: CONFIRMED, and confirmed by evidence beyond the freeze receipt's own assertion.
        how: >-
          The freeze task's budget stamps span 21:08:18Z-21:18:52Z. The driver
          script did not exist until 21:24:59Z and the earliest data file of any
          kind in the producer scratchpad (setup-16.json) is 21:25:08Z. No
          instance, factor base, sample, arm file or factorization artifact
          exists with an mtime anywhere in the freeze window. The contract file
          itself has mtime 21:17:24Z, before the executor's clock start at
          21:20:49Z, and its bytes are unchanged since.
      recomputation_before_first_datum:
        verdict: CONFIRMED with one honest qualification.
        detail: >-
          run_manifest.json records the recomputation at command seq 3, bounded
          by the C2_CLOCK_START stamp (21:20:49Z) and the
          SETUP_AND_BUDGET_PROBE_COMPLETE stamp (21:25:36Z), i.e. before
          setup-16.json (21:25:08Z), which is the first artifact of any kind.
          QUALIFICATION: seq 3 is not individually timestamped, so its exact
          position inside that window rests on the manifest. This does not
          matter to the integrity property, because the contract file predates
          the executor entirely and is byte-identical now to the frozen hash -
          no datum could have influenced it whatever moment the executor hashed
          it.
      null_written_and_hashed_before_the_first_treatment_integer:
        verdict: CONFIRMED THREE INDEPENDENT WAYS. This is the load-bearing check and it holds.
        way_1_budget_stamps: >-
          PHASE1_COMPLETE_NULL_COMMITTED 21:27:35Z carrying
          null_calibration_sha256 5982d004...ef3026; PHASE2_START_CELL16
          21:27:48Z.
        way_2_filesystem_mtimes_which_the_producer_did_not_author: >-
          Phase-1 arm files arm-16-A-NULL 21:25:48Z, arm-16-A-IDENT 21:25:54Z,
          arm-20-A-NULL 21:26:04Z, arm-20-A-IDENT 21:26:15Z; null_calibration.json
          21:27:22.918Z; FIRST treatment file arm-16-A-REAL.pkl 21:27:54Z. Every
          treatment artifact postdates the committed null.
        way_3_the_calibration_code_cannot_see_the_treatment: >-
          calibrate.py opens only arm-<bits>-A-NULL.pkl and
          arm-<bits>-A-IDENT.pkl. At 21:27:22Z no A-REAL or A-POWER file existed
          on disk at all. The string "A-REAL" and the string "A-POWER" occur
          ZERO times in null_calibration.json.
        way_4_structural_and_strongest: >-
          There was no tunable degree of freedom left outside the frozen file.
          tau, the powered-rung set and the rate-band half-widths are
          deterministic functions of a null stream whose definition
          (SHA-256("EXP-SMTH-4403c4/v1":object:bits:counter), rejection
          sampling, modulo reduction forbidden) is fixed in the frozen contract.
          I regenerated that null independently and got the identical N-sequence
          sha256 and the identical tau to the last bit. A post-hoc null is not
          merely unevidenced here; it is not constructible without changing the
          contract, whose hash was recorded by a task that had produced nothing.
      one_ordering_link_that_is_genuinely_weaker_and_i_am_naming_it:
        finding: >-
          analyze.py - the script that APPLIES DR-1..DR-6 and emits the verdict
          - has mtime 21:30:15Z, i.e. it was authored AFTER all eight arms
          existed. Pre-registration covers the RULES (frozen in the contract at
          21:17:24Z); it does not cover the analysis IMPLEMENTATION, which was
          written with the data on disk.
        why_it_does_not_change_the_ruling: >-
          Because I did not trust it. I re-derived D, D_power, D_ident, tau, T,
          every ladder count and every verdict with my own code and got exact
          agreement (section 3). Any tuning inside analyze.py would have
          surfaced as a discrepancy. It did not. THIS IS THE GAP MY
          RECOMPUTATION CLOSES, and it is the reason my ruling is conditional on
          having performed it.

    '1.2_can_verifiable_integrity_substitute_for_an_approval_that_never_happened':
      analysis: >-
        Approval carries two separable functions, and only one of them is a
        hash-checkable property. (i) INTEGRITY - the contract was fixed before
        any datum. That is a factual property of artifacts, it is verifiable
        without trusting anyone, and I verified it. A hash CAN substitute here,
        and did. (ii) JUDGEMENT - that the design was worth the budget, that
        its scope is right, that its rules can answer the question. NO HASH CAN
        REPLACE THAT, and no amount of integrity supplies it.
      so_what_carries_the_judgement_function_here: >-
        Not the Coordinator's retrospective note. Independent review does -
        this report and the concurrent red team - and it does so from a
        WEAKER position than a prospective approver, because we read the design
        already knowing the answer came back clean, and a reviewer in that
        position can rationalise. I mitigated that in the only way available:
        by scoring the design against text that provably predates the data.
      the_mitigation_that_actually_worked: >-
        The frozen contract's reach_and_power section PREDICTED, before any
        datum, that "the deep rungs (nominal u = 5 and u = 6) are expected to
        fall in that regime" and that the deep-smooth constant-factor claim
        "IS THEREFORE NOT TESTED BY THIS EXPERIMENT". The measured k_null at the
        deepest rung came out 18 (CELL-16) and 10 (CELL-20), against the
        pre-registered floor of 30. A contract that had been reverse-engineered
        to flatter its own result would not have pre-declared the exact
        limitation that then materialised. That is real, checkable evidence of
        good-faith prospective design, and it is the strongest thing standing in
        for the judgement function.
      residue_that_is_not_repaired: >-
        The AGENTS.md experiment state machine
        (draft -> review_required -> approved -> running) was violated: the
        contract went frozen_pending_approval -> running. That violation is
        permanent, cannot be cured retroactively, and must travel with the
        evidence record. Admitting the measurement does not admit the process.

    '1.3_weight_of_the_coordinators_retrospective_i_would_have_approved_it':
      weight_i_gave_it: NONE. I did not rely on it at any point in this ruling.
      reason: >-
        It was written after the results were known to be clean, by the party
        whose defect it is, about its own counterfactual conduct. The
        Coordinator says so itself and discounts it itself, which is to its
        credit as disclosure, but disclosure does not convert a
        post-hoc counterfactual into evidence. My ruling would be unchanged if
        that paragraph did not exist. What I DID rely on is section 1.1's
        artifact evidence and section 3's reproduction, neither of which
        depends on any Coordinator statement.
      i_note_for_the_record: >-
        The Coordinator's decision NOT to rule on its own defect was correct
        and is the reason this question could be answered at arm's length.

    '1.4_arguments_for_INADMISSIBLE_that_i_considered_and_why_they_did_not_prevail':
      - argument: >-
          AGENTS.md rule 1 reserves approval to the Coordinator. Admitting a run
          that skipped it makes the gate optional whenever the hashes look good,
          and precedent is how gates die.
        weight: SERIOUS. This is the strongest argument against my ruling.
        why_it_did_not_prevail: >-
          Because the ruling is expressly narrow and expressly conditional
          (section 1 "ruling_is_conditional_on_two_things"), because the defect
          stays on the face of the evidence record permanently rather than being
          discharged, and because the Coordinator has already bound the
          structural repair for every future batch. A precedent that says
          "admissible only where an independent party verified the integrity
          chain AND reproduced every number from scratch" is not a precedent
          that approval is optional.
      - argument: >-
          Declaring it inadmissible is the clean, incentive-correct answer and
          the cost is only 1046528 factorizations, which are cheap.
        weight: REAL but it points the wrong way.
        why_it_did_not_prevail: >-
          The party that would be punished is the executor, which flagged the
          Coordinator's defect itself, declared it as D1, and correctly stated
          it could not cure it. Converting a Coordinator process defect into a
          verdict about a producer's mathematics inverts the responsibility. It
          is also the mirror image of AGENTS.md rule 3's principle: an
          infrastructure or process failure is not mathematical evidence in
          either direction, and a process defect that provably could not have
          touched the numbers should not be laundered into a mathematical
          verdict either.
      - argument: "The contract self-declares `evidence_eligible: true` while `approved_by` is null."
        weight: A REAL DEFECT, newly named here (see D1b in defects).
        why_it_did_not_prevail: >-
          It is an authoring defect in a frozen file, not a contamination of the
          measurement. I give that field zero weight and rule eligibility
          independently of it.
    standing_granted:
      admissible_as: A toy-tier measurement receipt for OPEN-BATCH023-A. The measured quantities are reproducible, correctly computed, and were produced under a verifiably-frozen protocol.
      not_admissible_as: >-
        A governance-clean evidence record. Any evidence or decision record
        citing this run must state D1 on its face and must not present the run
        as having passed the approval gate.
      does_not_by_itself: >-
        Change any hypothesis status, close any promotion gate, license any
        early abort, or support any statement about ECDLP, cost, exponents or
        crypto scale. Those dispositions are the Coordinator's and are outside a
        validator's remit.
      effect_on_OPEN_BATCH023_A: >-
        On this ruling the item is ATTEMPTED-AND-MEASURED for limb (a) at two
        toy cells, NOT discharged for the deep-smooth regime or for limb (b).
        The disposition itself is the Coordinator's to record.

