        reusing no producer code. Three deliberate points of independence:
        (1) the Semaev coefficients c_2, c_1, c_0 are recovered by Lagrange
        interpolation of harness.semaev.s3_eval at Z in {0,1,2} rather than by
        transcribing the closed-form formula, so the driver's algebraic
        transcription is checked rather than copied;
        (2) the SHA-256 bit stream and rejection sampler were re-derived from
        the contract's prose;
        (3) the two-sample KS statistic uses my own merge, INCLUDING the tail
        past the exhaustion of one sample, which the producer's ks2 omits.
