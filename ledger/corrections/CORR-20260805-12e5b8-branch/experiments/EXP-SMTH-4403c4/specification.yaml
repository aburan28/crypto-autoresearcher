experiment:
  id: EXP-SMTH-4403c4
  title: >-
    Direct measurement of HEUR-DS-1 on half-arity Semaev partial-map
    intermediates against a MEASURED null at the actual X, with i < j
    enumeration excluding the diagonal by construction
  version: 1
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-001
  question_id: RQ-ECDLP-002
  batch_id: BATCH-028
  hypothesis_id: H-SMTH-001
  authoring_task: TASK-20260802-80f5e9
  authored_at: '2026-08-02'
  authorizing_open_item: OPEN-BATCH023-A
  authorizing_decision_id: DEC-20260801-011
  status: frozen_pending_approval
  status_note: >-
    FROZEN, NOT APPROVED. This task freezes the contract and produces NO
    measurement of any kind. `approved_by` is null and remains null until the
    Coordinator records an approval determination in its snapshot receipt.
    The executing task TASK-20260802-6a39f8 is authorized by its dispatch card
    and by the freeze receipt hash check, and it must halt if the sha256 of
    this file differs from the one recorded in
    coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/tasks/TASK-20260802-80f5e9/freeze_receipt.json.
  approved_by: null
  execution_authorized_by: dispatch_card TASK-20260802-6a39f8 (BATCH-028)
  evidence_eligible: true
  claim_tier: toy

  # ==================================================================
  provenance_and_scope:
    why_this_experiment_exists: >-
      DEC-20260801-011 closed BATCH-024 as revise_nonexecution and records, in
      its own words under what_this_decision_explicitly_does_not_say: "No
      integer was factored and HEUR-DS-1 was neither validated nor refuted."
      Its rank-1 next action is OPEN-BATCH023-A - a fresh, frozen direct
      smoothness measurement of HEUR-DS-1 with measured-null calibration at the
      actual X and i<j enumeration excluding the diagonal by construction.
      This contract is that experiment. It is a NEW contract under a NEW id; it
      is not EXP-SMTH-001, whose contract DEC-20260801-011 rank 1 forbids
      reusing and which remains UNAPPROVED and frozen.
    what_this_experiment_can_conclude: >-
      A toy-tier, single-host, unreplicated distributional status report about
      one computable object at two toy field sizes. Nothing else.
    what_this_experiment_can_never_conclude:
      - No crypto-scale, medium-scale, affected-scheme or asymptotic claim, under any outcome.
      - No cost saving, no exponent, no early-abort licence, no ECDLP consequence.
      - >-
        No discrete logarithm is computed, no relation is harvested, no live key
        is touched. certificate.kind for the smoothness pipeline is
        `factorization_reconstruction`, defined below; there is no dlog
        certificate because there is no dlog.
      - >-
        A pass is at most `consistent with HEUR-DS-1 at the tested toy cell`.
        The word "validated" may not appear in any deliverable. The word
        "refuted" may not appear unqualified; the adverse reading is
        "failed at toy scale, scoped to the parameters below".
      - >-
        The judgment of whether the heuristic is supported or refuted belongs to
        the Reviewer and Coordinator. The Executor records the measured
        quantities beside the pre-registered rules and states the mechanical
        verdict label only.

  # ==================================================================
  # 1. WHAT HEUR-DS-1 ACTUALLY ASSERTS
  heuristic_under_test:
    id: HEUR-DS-1
    located_in:
      primary_source: ledger/hypotheses/H-DS-001.yaml (heuristic_assumptions[0].formal_statement)
      restatement_source: ledger/hypotheses/H-SMTH-001.yaml (heuristic_assumptions[0])
      instantiation_source: experiments/EXP-SMTH-001/specification.yaml (intermediate_generation INT-1, ENC-B, ENC-A)
    formal_statement_quoted_verbatim_from_H_DS_001: >-
      "Intermediate degrees arising from half-arity Semaev partial maps on
      uniform random targets behave, for B-smoothness purposes, like uniform
      random integers of the same bitlength: the probability an intermediate is
      B-smooth is within a constant factor of Dickman rho(u) with
      u = log D / log B, where D bounds the intermediate degree."
    operational_reading_taken_here: >-
      The statement has two limbs. Limb (a) is a COMPARATIVE claim - the
      intermediates behave like uniform random integers of the same size for
      B-smoothness purposes. Limb (b) is a MODEL claim - that this common
      behaviour is Dickman rho(u) within a constant factor.
      THIS EXPERIMENT DECIDES LIMB (a) AND ONLY LIMB (a), because limb (a) is
      the limb that is decidable at finite X by measurement, and because limb
      (b) at finite X is exactly the substitution this batch exists to avoid.
      Limb (a) is decided against a MEASURED sample of uniform random integers
      on the same range, drawn and factored by the identical pipeline. Dickman
      rho is computed and reported as a DIAGNOSTIC ONLY and carries no decision
      weight anywhere in this contract.
    why_limb_b_is_not_the_calibration: >-
      Dickman rho(u) is an asymptotic density. At the actual X of this
      experiment (X = p**2 with p below 2**20) the finite-X smooth density
      differs from rho(u) by an amount that is not known here and that this
      experiment does not measure. Scoring a finite-X sample against rho and
      calling the residual a property of Semaev structure would attribute a
      finite-X model error to the object under test. THE ASYMPTOTIC DICKMAN RHO
      IS NOT THE CALIBRATION OF THIS EXPERIMENT AND MAY NOT BE SUBSTITUTED FOR
      THE MEASURED NULL AT ANY POINT, IN ANY RULE, UNDER ANY BUDGET PRESSURE.
      Any run that scores a decision rule against rho instead of against the
      measured null is invalid_measurement, not a result.
    prior_validation_status: >-
      NEVER VALIDATED AND NEVER REFUTED AT ANY SCALE. Per
      H-DS-001.mechanism_test_status and H-SMTH-001.mechanism_test_status:
      is_B_smooth was never invoked anywhere in the EXP-DS-001 series, and the
      single HEUR-DS-1 sampling ever performed (EV-DS-002 finding F3) sampled an
      identity-encoded curve x-coordinate below 2**20 rather than a half-arity
      intermediate (RT047-H2, RT048-H1). DEC-20260801-011 records that BATCH-024
      factored no integer.

  # ==================================================================
  # 2. THE EXACT SMOOTHNESS QUANTITY, STATED DIRECTLY
  measured_quantity:
    id: QTY-4403c4
    statement_without_reference: >-
      Fix a prime p and an elliptic curve E: y**2 = x**3 + a*x + b over F_p.
      Fix an ordered list FB = [x_0, ..., x_511] of 512 DISTINCT x-coordinates
      of points of E(F_p). For each index pair (i, j) with 0 <= i < j < 512,
      form the univariate polynomial in Z
        f_ij(Z) = S_3(x_i, x_j, Z)
                = (x_i - x_j)**2 * Z**2
                  - 2*((x_i + x_j)*(x_i*x_j + a) + 2*b) * Z
                  + ((x_i*x_j - a)**2 - 4*b*(x_i + x_j))            (mod p)
      writing it as c_2*Z**2 + c_1*Z + c_0 with
        c_2 = (x_i - x_j)**2 mod p
        c_1 = -2*((x_i + x_j)*(x_i*x_j + a) + 2*b) mod p
        c_0 = ((x_i*x_j - a)**2 - 4*b*(x_i + x_j)) mod p.
      Form the two elementary symmetric functions of the root multiset of
      f_ij in an algebraic closure of F_p:
        e_1 = (-c_1) * c_2**(-1) mod p
        e_2 = c_0   * c_2**(-1) mod p,
      each lifted to its representative in [0, p). Encode the pair as the
      single integer
        N_ij = e_1 * p + e_2 + 1,   so that N_ij lies in [1, p**2].
      THE MEASURED QUANTITY IS THE MULTISET { N_ij : 0 <= i < j < 512 } AND
      THE B-SMOOTHNESS STATISTICS OF ITS ELEMENTS, namely, for each N_ij:
        (i) its complete prime factorization,
        (ii) its largest prime factor LPF(N_ij),
        (iii) the derived value z_ij = ln(N_ij) / ln(LPF(N_ij)) for N_ij > 1,
        (iv) for each smoothness bound Bsm on the frozen ladder, the indicator
             [ LPF(N_ij) <= Bsm ].
      The reported statistics are the empirical CDF of z, the smooth fraction
      at each ladder rung, and the extreme-z tail count defined in the decision
      rules below.
    S_3_source_of_truth: >-
      The S_3 coefficients above are the third Semaev summation polynomial for
      the short Weierstrass curve y**2 = x**3 + a*x + b, matching
      harness/semaev.py::s3_expr / s3_eval character-for-character in algebraic
      content. The executor MUST cross-check its implementation against
      harness.semaev.s3_eval on every pair it evaluates (INTEG-3 below) rather
      than trusting either transcription.
    encoding_ids:
      ENC-B: N_ij = e_1 * p + e_2 + 1, the PRIMARY DECISION ENCODING; a bijection from [0,p) x [0,p) onto [1, p**2].
      ENC-A: M_ij = max(e_1, 1) * max(e_2, 1), POWER CERTIFICATE ONLY, never a decision variable about HEUR-DS-1.
    the_actual_X: >-
      X = p**2 exactly. Every arm - real, null, power certificate, apparatus
      identity - lives on the SAME range [1, p**2]. The bound
      D = 2**(2*bits) is used for NOTHING in any decision rule of this
      contract; it appears only in the reported-only rho diagnostic, and it is
      recorded there as a modeled quantity. Drawing a null on [1, D] instead of
      [1, X] would introduce a range mismatch unrelated to Semaev structure.

  # ==================================================================
  # 3. THE ENUMERATION: DIAGONAL EXCLUDED BY CONSTRUCTION
  enumeration:
    id: ENUM-LT
    rule_as_code: |
      # THE ONLY ADMISSIBLE ENUMERATION. No filter, no skip, no continue.
      pairs = []
      for i in range(512):
          for j in range(i + 1, 512):     # j starts strictly above i
              pairs.append((i, j))
      assert len(pairs) == 130816         # C(512, 2)
    why_the_diagonal_cannot_appear: >-
      The inner loop begins at i + 1, so j > i holds for every emitted pair by
      the loop bounds themselves. No pair with i == j is ever constructed, so
      none can be filtered out, mis-filtered, or silently retained. A reviewer
      verifies this by reading the loop bounds, not by auditing a removal step.
      NO POST-HOC FILTER OF ANY KIND MAY BE APPLIED TO THE PAIR SET. If an
      implementation constructs i <= j and then removes the diagonal, THAT
      IMPLEMENTATION VIOLATES THIS CONTRACT and its run is invalid_measurement.
    exact_pair_count: 130816
    pair_count_derivation: C(512, 2) = 512 * 511 / 2 = 130816
    contrast_with_EXP_SMTH_001: >-
      EXP-SMTH-001 enumerated i <= j, giving C(513, 2) = 131328 pairs including
      512 diagonal pairs. On the diagonal x_i == x_j, so c_2 = (x_i - x_j)**2 =
      0 and f_ij degenerates from degree 2 to degree <= 1: the root multiset is
      not a degree-2 fibre, e_1 and e_2 are undefined (c_2 has no inverse), and
      the intermediate that HEUR-DS-1 is about does not exist there. The
      diagonal is not a nuisance sample to be down-weighted; it is a different
      object. Excluding it by construction is the repair
      DEC-20260801-011 names.
    degeneracy_is_therefore_impossible_here: >-
      Because FB holds 512 DISTINCT x-coordinates and j > i, x_i != x_j for
      every emitted pair, hence c_2 != 0 mod p for every emitted pair and e_1,
      e_2 are always defined. INTEG-2 below turns this into a hard check: if
      the run observes even ONE pair with c_2 == 0, the factor base contains a
      duplicate and the whole run is invalid_measurement (integrity), never a
      partial result.

  # ==================================================================
  # 4. THE CURVE / PARAMETER FAMILY
  instances:
    construction: >-
      harness.toycurve.generate_instance(seed=4403, field_bits=bits) for bits in
      {16, 20}, giving p, a, b deterministically. Only p, a, b are used; the base
      point, subgroup order and secret k of the instance are IGNORED and no
      discrete logarithm is computed.
    bits_names_the_field: >-
      RT047-B5 discipline. `bits` names the FIELD prime p and nothing else. The
      prime-order subgroup order is irrelevant to this experiment, which touches
      no group-order-sensitive quantity. No sentence in any deliverable may say
      "at 20 bits" without saying it is the FIELD.
    factor_base:
      construction: harness.semaev.build_factor_base(inst, size=512, seed=4403)
      size_Bfb: 512
      policy: frozen deterministic subset of x-coordinates of E(F_p), pairwise distinct by construction of the builder
      integrity_check: the run asserts len(set(FB)) == 512 before any pair is formed (INTEG-1)
      why_512: >-
        C(512, 2) = 130816 pairs. Bfb in {64, 128, 256} would give 2016, 8128 and
        32640 pairs, all below the 10**5 sample floor that H-DS-001's own
        falsification_condition names. This is a declared departure from
        H-DS-001's factor-base sizes and it alters no clause of H-DS-001.
    cells:
      - id: CELL-16
        bits: 16
        role: PRIMARY. Executed first after the null phase. The verdict of this experiment is read at this cell.
      - id: CELL-20
        bits: 20
        role: >-
          SECONDARY / replication-direction. Executed only if CELL-16 completes
          within budget. If it does not run, it is recorded as NOT RUN with the
          budget stamp that stopped it; a non-executed cell is never reported as
          a null result, a partial result, or evidence in either direction.
    X_per_cell: X = p**2, with the exact integer p and the exact integer X recorded in the run manifest.

  # ==================================================================
  # 5. THE MEASURED NULL - COMMITTED BEFORE THE TREATMENT ARM
  measured_null:
    id: NULL-UNIF-X-MEASURED
    definition: >-
      n_null integers drawn uniformly at random from [1, X] with X = p**2, the
      ACTUAL X of the cell, and pushed through the IDENTICAL factorization,
      LPF, z, ladder-indicator, CDF and statistic pipeline as the treatment arm,
      with no code path differing anywhere except the source of the integers.
      The pipeline function is one shared function; the arms differ by their
      input iterator only.
    n_null: 130816
    n_null_note: matched exactly to the treatment pair count so that the two-sample KS threshold below is the equal-sample-size one.
    sampler: >-
      Rejection sampling of unbiased integers in [1, X] from SHA-256-derived
      bit strings. Draw k = X.bit_length() bits per attempt from the stream,
      interpret big-endian as v, accept iff 1 <= v <= X, else discard and
      redraw. MODULO REDUCTION IS FORBIDDEN - it biases the low end of the
      range and that bias is in the smooth direction.
    stream: >-
      Bytes are SHA-256(domain || ":" || object || ":" || bits || ":" ||
      counter) with domain = "EXP-SMTH-4403c4/v1", counter a decimal
      uint64 starting at 0, incremented per 32-byte block. UTF-8, ":" separated,
      no padding.
    seeds:
      master_seed: 4403
      curve_and_factor_base_seed: 4403
      null_stream_object: "NULL-UNIF"
      identity_control_stream_object: "NULL-SYNTH"
      note: >-
        The treatment arm carries NO SEED AND NO SAMPLING NOISE: it is
        EXHAUSTIVE over all 130816 pairs and is reproducible from (p, a, b, FB)
        alone.
    ordering_requirement_binding: >-
      PHASE 1 (null phase) runs FIRST and completes FIRST: NULL-UNIF-X-MEASURED
      and the apparatus-identity control NULL-SYNTH. The executor then writes
      null_calibration.json containing the full measured null summary - sample
      size, seeds, the empirical z-CDF at the reporting grid, the smooth counts
      and fractions at every ladder rung, the ordered top-64 z values, the
      derived threshold tau of DR-3, and the powered-rung set of DR-2 - and
      records its sha256 in run_manifest.json BEFORE the first treatment
      integer is generated. PHASE 2 (treatment phase) then runs OBJ-REAL under
      ENC-B and the ENC-A power certificate.
    why_the_order_is_binding: >-
      A null calibrated after seeing the treatment is not a null. Every
      data-dependent quantity in the decision rules (the powered-rung set, the
      tail threshold tau, the rate-band half-widths) is a function of the
      MEASURED NULL ALONE and is therefore fixed by the committed
      null_calibration.json before any treatment datum exists. If the executor
      cannot commit the null before the treatment arm, it must halt; running
      out of order is invalid_measurement.
    what_the_null_is_not: >-
      It is not Dickman rho. It is not a rho-derived expectation. It is not a
      literature value. It is 130816 integers this run drew and this run
      factored, at this X.

  # ==================================================================
  # 6. ARMS
  arms:
    - id: A-NULL
      phase: 1
      object: NULL-UNIF-X-MEASURED
      n: 130816
      role: THE CALIBRATION. Every decision rule below is stated against this arm.
    - id: A-IDENT
      phase: 1
      object: >-
        ENC-B applied to pairs (e_1, e_2) drawn uniformly and independently from
        [0, p) x [0, p) by the same rejection sampler on stream object
        "NULL-SYNTH", i.e. N = e_1*p + e_2 + 1.
      n: 130816
      role: >-
        APPARATUS IDENTITY CONTROL, NOT AN INTERPRETIVE NULL. ENC-B is a
        bijection from [0,p) x [0,p) onto [1, p**2], so A-IDENT and A-NULL are
        the SAME distribution BY DERIVATION. Disagreement beyond the two-sample
        threshold is an implementation defect in the encoder or the sampler,
        never a mathematical result. Stated in advance so that agreement can
        never be presented as corroboration.
    - id: A-REAL
      phase: 2
      object: QTY-4403c4 under ENC-B over ENUM-LT
      n: 130816
      role: THE TREATMENT. The quantity HEUR-DS-1 is about.
    - id: A-POWER
      phase: 2
      object: QTY-4403c4 under ENC-A over ENUM-LT (same pairs, same e_1/e_2, different encoding)
      n: 130816
      role: >-
        POWER CERTIFICATE ONLY. A product of two integers each below p is
        substantially smoother than a uniform integer below p**2, so its
        rejection against A-NULL is expected in advance and certifies that the
        two-sample statistic AS IMPLEMENTED has power to reject at all. NEVER
        cited as evidence for or against HEUR-DS-1.
  arms_execution_order_binding: A-NULL, A-IDENT, commit null_calibration.json, then A-REAL, then A-POWER.

  # ==================================================================
  # 7. FACTORING BACKEND AND CERTIFICATE
  factoring_backend:
    library: sympy
    version_pinned: 1.14.0
    version_policy: >-
      The runtime-observed sympy.__version__ and sys.version are recorded in
      run_manifest.json. If the observed sympy version differs from 1.14.0 the
      run proceeds and RECORDS THE DEVIATION; it does not silently substitute.
    calls: sympy.factorint(N) for the factorization; sympy.isprime(q) for every returned base q.
    why_this_backend: >-
      X <= 2**40, so every N factors by sympy's small-number path in
      predictable time; no ECM, no GNFS, no external tool, no network. Cost is
      therefore predictable and identical across arms by construction.
    forbidden: >-
      No alternate backend, no probabilistic early exit, no partial
      factorization, no cached factor table shared across arms, no
      precomputed smooth-number list.
  certificate:
    kind: factorization_reconstruction
    per_record_fields: [arm, cell_bits, sequential_index, i, j, N, factors, LPF, reconstruction_ok]
    verification_rule: >-
      For every integer in every arm the run asserts, with code that does not
      call factorint again: every returned base is prime under sympy.isprime,
      every exponent is >= 1, and prod(q**e) == N exactly as Python integers.
      LPF is max(bases) with LPF(1) := 1.
    independence_requirement: >-
      The reconstruction check multiplies and compares; it does not re-derive
      the factorization from the same routine that produced it. In addition,
      INTEG-4 re-verifies a deterministic 1-in-1000 subsample (indices where
      sequential_index mod 1000 == 0) with an INDEPENDENT trial-division +
      Pollard-rho routine written in the driver and not importing sympy's
      factorization path.
    failure_handling: >-
      A factorization that fails, errors, or exceeds its per-integer timeout is
      RECORDED as failed with its index and EXCLUDED from that arm's statistics.
      It is NEVER imputed, never replaced by a redraw, and never silently
      dropped. If total exclusions in any arm exceed 0.1 percent of that arm's
      n, the cell is INCONCLUSIVE-INSTRUMENT (M-INSTR below).
    n_eff_definition: >-
      n_eff for a cell is min over arms of (n - exclusions - unit records with
      N == 1). All two-sample statistics at that cell use the first n_eff
      records by sequential_index in each arm, so sample sizes are matched by a
      deterministic rule fixed here and not chosen after seeing data.

  # ==================================================================
  # 8. THE SMOOTHNESS LADDER
  smoothness_ladder:
    policy: >-
      REUSED UNCHANGED from H-SMTH-001.test_boundary.parameters, which reuses
      EXP-DS-001's frozen ladder. Not redrafted, not relaxed, not tightened.
      The nominal u labels come from u = ln(D)/ln(Bsm) with D = 2**(2*bits);
      THE u LABELS ARE NAMES ONLY. No decision rule in this contract is a
      function of u or of rho(u).
    bits_16_Bsm: [65536, 1626, 256, 84, 40]
    bits_20_Bsm: [1048576, 10321, 1024, 256, 102]
    nominal_u_labels: [2, 3, 4, 5, 6]

  # ==================================================================
  # 9. DECISION RULES - PRE-REGISTERED, NUMERIC, AND STATED AGAINST THE MEASURED NULL
  decision_rules_binding_note: >-
      Every rule below is either a literal number or a closed-form function of
      the MEASURED NULL committed at the end of Phase 1. No rule is a function
      of the treatment arm. No rule may be chosen, tuned, re-parameterized or
      re-read after any treatment datum exists. If a rule turns out to be
      ill-defined on the data, the executor reports it as ill-defined AND
      reports the raw quantity, and does not substitute a different rule.

  decision_rules:
    - id: DR-1
      name: KS2-PRIMARY - two-sample Kolmogorov-Smirnov, A-REAL (ENC-B) versus A-NULL
      statistic: D = sup_t | F_real(t) - F_null(t) | over the pooled z sample
      threshold_formula: T_KS2 = 1.63 * sqrt(2 / n_eff)
      threshold_value_at_n_eff_130816: 0.006373
      threshold_constant_provenance: >-
        1.63 is the two-sided KS critical constant at alpha = 0.01 already
        frozen in EXP-DS-001 and quoted in EXP-SMTH-001 rule KS-DS-1 and in
        H-SMTH-001.predictions. It is reused, not redrafted.
      verdict: REJECT iff D > T_KS2. Otherwise NOT-REJECT.
      direction_recorded: >-
        The sign of the maximal deviation is recorded (real smoother than null,
        or real rougher than null). It carries no threshold of its own; it is a
        descriptive field.
      this_is_the_direct_test: >-
        This is limb (a) of HEUR-DS-1's own sentence - do the intermediates
        behave like uniform random integers of the same size for smoothness
        purposes - tested against a measured sample of exactly those integers.

    - id: DR-2
      name: RATE-BAND at each ladder rung, against the measured null's own rate
      powered_rung_definition: >-
        A rung Bsm is POWERED iff the MEASURED NULL's smooth count at that rung,
        k_null(Bsm), satisfies k_null >= 30. The powered set is fixed by
        null_calibration.json before any treatment datum exists. Unpowered rungs
        are REPORTED with their raw counts and are EXCLUDED from pass/fail.
      statistic: p_real(Bsm) = k_real / n_eff and p_null(Bsm) = k_null / n_eff
      pass_rule: >-
        PASS at a powered rung iff
          | p_real - p_null | <= 3.09 * sqrt( 2 * p_null * (1 - p_null) / n_eff ).
        FAIL otherwise.
      threshold_constant_provenance: >-
        3.09 is the two-sided standard-normal critical value at nominal
        alpha = 0.002 per rung; with at most 5 rungs this is a Bonferroni
        allocation whose family-wise nominal level is at most 0.01, matching the
        alpha already fixed by the KS constant above. The half-width is a
        function of p_null - the MEASURED null rate - and of nothing else.
      reported_only_diagnostic: >-
        The ratio p_real / p_null and the legacy factor-8 band [1/8, 8] from
        EXP-DS-001's RATE-DS-1 are COMPUTED AND REPORTED for comparability with
        the frozen legacy rule. THEY ARE NOT A DECISION RULE HERE. Likewise
        rho(u) may be computed numerically (Dickman ODE) and reported beside
        p_null as a MODELED quantity clearly labelled modeled; it decides
        nothing, and the difference between p_null and rho(u) is itself a
        reported finite-X observation, not an error of the object.

    - id: DR-3
      name: TAIL - extreme-smoothness excess against the measured null's own quantile
      threshold_construction: >-
        Let tau be the 10th largest z value in the MEASURED NULL arm (rank 10
        from the top of A-NULL's z sample, ties broken by taking the larger
        rank so that at least 10 null records satisfy z >= tau). tau is
        committed in null_calibration.json before Phase 2.
      statistic: T = #{ records in A-REAL with z > tau }
      null_expectation: >-
        Under the hypothesis that A-REAL and A-NULL are exchangeable, T is
        approximately Poisson with mean 10.
      fire_rules:
        excess_fires: T >= 26
        deficit_fires: T <= 1
      nominal_probabilities_computed_here:
        P_T_ge_26_given_Poisson_10: 1.768e-05
        P_T_le_1_given_Poisson_10: 4.994e-04
        computation_note: >-
          Both probabilities were computed in this task from the Poisson(10) pmf
          by direct summation as part of writing this contract. They are
          properties of the frozen thresholds, not measurements of any sample.
      verdict: >-
        TAIL-FIRED iff excess_fires or deficit_fires. Otherwise TAIL-CLEAN. The
        direction (excess = real has more extremely smooth records than the
        null; deficit = fewer) is recorded.

    - id: DR-4
      name: DECAY - artifact tell, an INSTRUMENT check and never a statement about the heuristic
      rule: >-
        Across the ladder in order of DECREASING Bsm, the smooth fraction must
        be non-increasing in each arm:
        p(Bsm_k+1) <= p(Bsm_k) for every consecutive pair, in A-REAL and in
        A-NULL separately.
      verdict: >-
        DECAY-FAIL at an arm iff any consecutive pair violates the inequality by
        more than the sampling allowance
        3.09 * sqrt(2 * p_null(Bsm_k) * (1 - p_null(Bsm_k)) / n_eff).
        DECAY-FAIL on A-REAL while A-NULL is clean means the sampled quantity is
        not behaving like an integer of size X and the instrument, not the
        heuristic, is implicated.

    - id: DR-5
      name: POWER CERTIFICATE - KS2 between A-POWER (ENC-A) and A-NULL
      statistic: D_power, computed identically to DR-1
      required_outcome: D_power > T_KS2, i.e. the apparatus MUST reject here.
      verdict: >-
        POWER-OK iff D_power > T_KS2. POWER-FAIL otherwise. POWER-FAIL means the
        two-sample statistic as implemented cannot reject even a derivably
        different sample, so a NOT-REJECT at DR-1 carries no information. A
        POWER-FAIL run is INCONCLUSIVE-INSTRUMENT regardless of every other
        reading.

    - id: DR-6
      name: APPARATUS IDENTITY - KS2 between A-IDENT and A-NULL
      statistic: D_ident, computed identically to DR-1
      required_outcome: D_ident <= T_KS2, i.e. the apparatus MUST NOT reject here.
      verdict: >-
        IDENT-OK iff D_ident <= T_KS2. IDENT-FAIL otherwise. IDENT-FAIL is an
        implementation defect in the encoder or the sampler and makes the run
        INCONCLUSIVE-INSTRUMENT. IDENT-OK is NOT corroboration of anything; the
        two arms are the same distribution by derivation.

  # ==================================================================
  # 10. SYMMETRIC FALSIFICATION - THE COMPLETE, MUTUALLY EXCLUSIVE VERDICT MAP
  verdict_map:
    read_at: CELL-16 (primary). CELL-20, if it ran, is read by the identical map and reported as a separate, independent cell reading.
    instrument_gate: >-
      A cell reading is ADMISSIBLE only if POWER-OK (DR-5) and IDENT-OK (DR-6)
      and A-NULL is DECAY-clean (DR-4) and INTEG-1..INTEG-5 all pass and
      exclusions are within tolerance. If the gate fails, the verdict is
      M-INSTR and NOTHING is said about HEUR-DS-1 in either direction.
    verdicts:
      - id: V-CONSISTENT
        label: consistent with HEUR-DS-1 at this toy cell
        fires_iff: >-
          instrument gate passes AND DR-1 = NOT-REJECT AND DR-3 = TAIL-CLEAN AND
          DR-2 PASSES at every powered rung AND DR-4 clean on A-REAL.
        what_it_means: >-
          At this cell, the half-arity Semaev intermediates under ENC-B were not
          distinguishable from measured uniform integers on the same range by
          any pre-registered rule, on an apparatus demonstrated in the same run
          to have power to reject. This is a distributional status report at one
          toy cell. It is `replicate`, never `support`, and never validation.
      - id: V-FAILED-TOY
        label: HEUR-DS-1 failed at toy scale, scoped exactly to the parameters below
        fires_iff: >-
          instrument gate passes AND DR-4 clean on A-REAL AND at least one of:
          DR-1 = REJECT, DR-3 = TAIL-FIRED, DR-2 = FAIL at a powered rung.
        what_it_means: >-
          At this cell the intermediates are distinguishable from measured
          uniform integers of the same size, which contradicts limb (a) of
          HEUR-DS-1's own sentence. Scoped exactly to: the tested curve instance
          from seed 4403 at this field size, INT-1/ENC-B, Bfb = 512, m = 4, the
          frozen ladder, sympy 1.14.0, one host, one unreplicated run. This is a
          `weaken` at most; reject_scoped on one unreplicated run is forbidden,
          and a crypto-scale refutation is forbidden absolutely.
        recorded_direction: whether the intermediates were SMOOTHER or ROUGHER than the measured null.
      - id: M-INSTR
        label: INCONCLUSIVE - instrument
        fires_iff: instrument gate fails, or DR-4 fails on A-REAL while A-NULL is clean.
        what_it_means: >-
          The apparatus did not demonstrate that it works in this run. No
          disposition about HEUR-DS-1 in either direction. AGENTS.md rule 5.
      - id: M-BUDGET
        label: INCONCLUSIVE - budget or infrastructure
        fires_iff: any budget ceiling, timeout, crash, or resource exhaustion stops the run before a cell's arms complete.
        what_it_means: >-
          Resource exhaustion. NOT negative evidence about HEUR-DS-1, not a
          negative_observation, and never reported as one. The completed portion
          is reported as completed and the incomplete portion as not run.
      - id: M-UNPOWERED
        label: INCONCLUSIVE - underpowered rule set
        fires_iff: >-
          instrument gate passes but FEWER THAN TWO ladder rungs are POWERED
          under DR-2's k_null >= 30 rule, AND DR-1 = NOT-REJECT AND
          DR-3 = TAIL-CLEAN.
        what_it_means: >-
          A not-reject on a rule set that could barely have rejected is not a
          pass. This branch exists so that a thin reading cannot be dressed as
          V-CONSISTENT. It is an expected and legitimate outcome.
    inconclusive_is_a_legitimate_outcome: >-
      DECLARED IN ADVANCE. M-INSTR, M-BUDGET and M-UNPOWERED are legitimate
      terminal outcomes of this experiment. Each closes OPEN-BATCH023-A as
      ATTEMPTED-AND-INCONCLUSIVE with a named repair. None may be reported,
      summarized or cited as support or as refutation, and no deliverable may
      round an inconclusive reading toward either.

  # ==================================================================
  # 11. HONEST REACH - WHAT THIS BUDGET CAN AND CANNOT DISCRIMINATE
  reach_and_power:
    stated_plainly: >-
      THIS CONTRACT IS WELL POWERED FOR THE BULK OF THE DISTRIBUTION AND IS NOT
      POWERED FOR THE DEEP-SMOOTH TAIL. That is a limitation of n, and n is
      capped by the exhaustive enumeration.
      (a) DR-1 at n_eff = 130816 detects CDF separations above 0.006373. A
      smaller separation is invisible to this contract and a NOT-REJECT does not
      exclude one.
      (b) DR-2's half-width at a rung with null rate p_null is
      3.09*sqrt(2*p_null*(1-p_null)/n_eff). At p_null near 0.3 that is about
      0.0055 absolute, i.e. roughly a 2 percent relative deviation - so at the
      shallow rungs this contract can detect deviations FAR SMALLER than
      HEUR-DS-1's own "constant factor" language. At a rung with p_null near
      1e-3 the half-width is about 0.00038 absolute, i.e. about 38 percent
      relative, still inside a factor 8.
      (c) THE BINDING LIMIT: a rung is powered only if the measured null yields
      at least 30 smooth records, i.e. p_null >= 30/130816 = 2.294e-4. Rungs
      whose true rate is below that are UNPOWERED BY CONSTRUCTION and this
      contract CANNOT discriminate even a factor-8 deviation there. On the
      nominal u labels, the deep rungs (nominal u = 5 and u = 6) are expected to
      fall in that regime. THE CONSTANT-FACTOR CLAIM OF HEUR-DS-1 IN THE
      DEEP-SMOOTH REGIME IS THEREFORE NOT TESTED BY THIS EXPERIMENT.
    what_would_be_needed_to_test_the_deep_rungs: >-
      To power a rung at true rate r to the same standard requires
      n >= 30 / r. Reaching r near 1e-5 needs n on the order of 3e6 per arm,
      about 23 times this contract's n, and reaching r near 1e-6 needs about 230
      times. Since the treatment arm is EXHAUSTIVE, n cannot be raised by
      sampling longer: it is raised only by enlarging the factor base, since
      n = C(Bfb, 2). Bfb = 2048 gives 2096128 pairs (about 16x) and Bfb = 8192
      gives 33550336 pairs (about 256x). The factorization cost scales linearly
      in n per arm across four arms. A deep-tail contract is therefore a
      SEPARATE, LARGER experiment under a NEW id, and the Coordinator should
      decide whether to fund it rather than discover the gap after this run.
    is_this_contract_designed_to_be_inconclusive: >-
      No, and here is the honest statement of why. DR-1 and DR-3 are computed on
      the full samples and are well powered; DR-2 is well powered at the shallow
      rungs. A real distributional difference of the size that would matter to
      an early-abort argument at the shallow rungs WILL be visible. But if the
      only deviation HEUR-DS-1 has is in the deep tail, this contract will
      return V-CONSISTENT or M-UNPOWERED and will have said nothing about it.
      That reach limit is declared here, before any datum, so that no reader can
      mistake this experiment's silence for evidence.
    budget_feasibility_statement: >-
      DECLARED REASONING, NOT A MEASUREMENT. This task performed NO
      factorization and reports no timing. The design factors at most
      4 arms x 130816 = 523264 integers below 2**32 at CELL-16 and the same
      count below 2**40 at CELL-20, i.e. at most 1046528 integer
      factorizations for both cells. EXP-SMTH-002's frozen pilot design declares
      a ceiling of 4186112 factorizations of integers of the same sizes within a
      7200 s wall ceiling and a 4 GB RSS ceiling; the executing card here has
      5400 s and 8 GB. The executor MUST read
      experiments/EXP-SMTH-002/results/feasibility_report.json and its run
      records for the measured throughput before starting, and MUST apply the
      cell ordering rule below rather than assuming both cells fit.
    cell_ordering_rule_under_budget: >-
      CELL-16 (all four arms, smaller integers, faster) runs to completion
      first. CELL-20 starts only if the elapsed budget stamp at CELL-16
      completion leaves more than 2400 s before the binding stop. If CELL-20
      cannot start or cannot finish, it is recorded as NOT RUN or as M-BUDGET
      with the stamp; no partial CELL-20 arm is read against any rule.

  # ==================================================================
  # 12. INTEGRITY CHECKS - ALL ARE HARD GATES
  integrity_checks:
    - id: INTEG-1
      check: len(FB) == 512 and len(set(FB)) == 512, and every x in FB lifts to a point of E(F_p).
      on_failure: invalid_measurement, run halts before any pair is formed.
    - id: INTEG-2
      check: c_2 != 0 mod p for every emitted pair.
      on_failure: >-
        invalid_measurement for the whole cell. Under ENUM-LT with a distinct
        factor base this is impossible, so an occurrence means the factor base
        or the enumeration is defective. It is NOT handled by skipping the pair.
    - id: INTEG-3
      check: >-
        For every pair, the driver's own c_2, c_1, c_0 satisfy
        harness.semaev.s3_eval(a, b, x_i, x_j, Z, p) ==
        (c_2*Z**2 + c_1*Z + c_0) mod p at Z in {0, 1, 2}, and both roots of
        f_ij, when they exist in F_p, satisfy s3_eval(...) == 0.
      on_failure: invalid_measurement.
    - id: INTEG-4
      check: >-
        Independent re-factorization of every record with
        sequential_index mod 1000 == 0 by a trial-division + Pollard-rho routine
        that does not call sympy.factorint, agreeing on the full factorization.
      on_failure: invalid_measurement.
    - id: INTEG-5
      check: >-
        Exact arm counts: 130816 pairs, 130816 null draws, 130816 identity
        draws, 130816 ENC-A records; the pair list is strictly increasing in
        (i, j) lexicographic order; and no pair has i == j.
      on_failure: invalid_measurement.
    - id: INTEG-6
      check: >-
        sha256 of this specification file, recomputed by the executing task,
        equals contract_sha256 in the freeze receipt.
      on_failure: HALT before the first datum. The run does not start.

  # ==================================================================
  # 13. WHAT WAS TAKEN FROM EXP-SMTH-001 / EXP-SMTH-002, AND WHAT WAS DELIBERATELY CHANGED
  relation_to_prior_contracts:
    neither_is_edited: >-
      experiments/EXP-SMTH-001 and experiments/EXP-SMTH-002 are frozen and were
      READ ONLY. So are EXP-DEP-001, EXP-EQD-001 and EXP-DS-001. Nothing in any
      of them was modified by this task. This contract is a fresh id and
      supersedes none of them by edit; it is a new record standing beside them.
    taken_from_EXP_SMTH_001:
      - The object definition INT-1 - the S_3 specialization, the (e_1, e_2) complete invariant of the degree-2 fibre.
      - The primary encoding ENC-B and the fact that it is a bijection onto [1, p**2].
      - The power-certificate encoding ENC-A and the argument that its rejection is derivable in advance.
      - The apparatus-identity control construction.
      - The frozen smoothness ladders and the range-matching decision to work on [1, p**2] rather than [1, D].
      - The RT047-B5 discipline that `bits` names the field.
      - The z = ln(N)/ln(LPF(N)) statistic rather than a CDF of raw degrees.
    taken_from_EXP_SMTH_002:
      - The SHA-256 stream and rejection sampler with modulo reduction forbidden.
      - The certificate record shape and the reconstruct-and-verify requirement.
      - The i < j pair set of exactly 130816 and its use as the arm size.
      - The stop-at-record-boundary semantics for budget ceilings.
    deliberately_done_differently_and_why:
      - change: ENUMERATION IS i < j, NOT i <= j.
        why: >-
          EXP-SMTH-001 enumerated C(513,2) = 131328 including 512 diagonal pairs
          where c_2 = 0 and the intermediate is undefined. DEC-20260801-011
          names this explicitly. Here the diagonal cannot be constructed, so it
          cannot be filtered, mis-filtered or retained. n drops to 130816 and
          every threshold above is recomputed at that n.
      - change: THE CALIBRATION IS A MEASURED NULL AT THE ACTUAL X, NOT DICKMAN RHO.
        why: >-
          EXP-SMTH-001's RATE-DS-1 and TAIL-DS-1 score the sample against
          rho(u), an asymptotic density, at a finite X where the finite-X error
          is unknown and unmeasured. That substitution is the specific defect
          this batch exists to avoid. Here rho is a labelled reported-only
          diagnostic with no decision weight, and every rule is a function of
          the measured null.
      - change: THE NULL IS COMMITTED BEFORE THE TREATMENT ARM, BY PHASE ORDER AND BY A HASH.
        why: >-
          Every data-dependent threshold (powered-rung set, tau, rate-band
          half-widths) is a function of the null alone and is written to
          null_calibration.json and hashed before Phase 2 begins. This makes
          "the null was not tuned to the treatment" checkable rather than
          asserted.
      - change: THE TAIL RULE IS AN EMPIRICAL-QUANTILE EXCEEDANCE COUNT, NOT A rho-BASED p_ext.
        why: >-
          TAIL-DS-1's p_ext is computed under rho and inherits the same
          finite-X model error. DR-3 compares the treatment's extremes to the
          null's OWN 10th-largest z, which needs no model at all, and its
          firing thresholds are Poisson probabilities of the frozen counts.
      - change: A SEPARATE M-UNPOWERED VERDICT EXISTS.
        why: >-
          EXP-SMTH-001's pass condition could be met by a rule set with almost
          no rungs powered. Declaring M-UNPOWERED in advance prevents a thin
          not-reject from being read as a pass.
      - change: CELL-16 IS PRIMARY AND CELL-20 IS CONDITIONAL ON BUDGET.
        why: >-
          EXP-SMTH-001 required both field sizes for its pass condition. Under a
          5400 s execution card, requiring both risks an all-or-nothing budget
          failure; making CELL-16 primary guarantees a readable cell or an
          honest M-BUDGET.
      - change: THIS CONTRACT DECIDES LIMB (a) OF HEUR-DS-1 ONLY, AND SAYS SO.
        why: >-
          Limb (b), agreement with rho within a constant factor, is not
          decidable at finite X without a finite-X correction this experiment
          does not measure. Claiming to decide it would be the same substitution
          in a different place.
    what_is_NOT_reused: >-
      No EXP-DS-001 driver, module, control, amendment or run artifact is
      imported, executed or staged. EXP-SMTH-001's contract text is not reused
      as a template; it is cited as an input. The anti-pattern of flipping
      smoothness_abort = true on existing EXP-DS-001 arms and calling the
      mechanism exercised remains EXPRESSLY FORBIDDEN.

  # ==================================================================
  # 14. FREEZE RULE
  freeze_rule:
    statement: >-
      THIS CONTRACT IS FROZEN AT THE sha256 RECORDED IN
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/tasks/TASK-20260802-80f5e9/freeze_receipt.json.
      ANY NEEDED CHANGE - to the quantity, the enumeration, the null, a
      threshold, the ladder, the sample size, the seeds, the backend, or the
      verdict map - IS A SUPERSEDING CONTRACT UNDER A NEW EXPERIMENT ID, NEVER
      AN EDIT TO THIS FILE. There is no in-place amendment path. A file whose
      hash differs from the receipt is not this contract and no run against it
      is a run of this experiment.
    executor_obligation: >-
      The executing task recomputes the sha256 of this file before generating
      its first integer, records the computed value in run_manifest.json, and
      HALTS if it differs from the receipt.
    post_hoc_rescoring_forbidden: >-
      No completed run of this contract may be re-scored against any later
      contract, threshold or rule. If a rule is later judged wrong, that
      judgment produces a new experiment; it does not re-read this one.

  # ==================================================================
  # 15. BUDGET AND STOPPING RULES FOR THE EXECUTING RUN
  budget:
    wall_clock_seconds: 5400
    memory_gb: 8
    maximum_runs: 30
    maximum_factorization_calls: 1046528
    per_integer_factorization_timeout_seconds: 5
    no_network: true
    maximum_workers: 4
    stop_semantics: >-
      Crossing any ceiling stops at the next record boundary and yields
      M-BUDGET for the affected cell. It is never evidence about smoothness,
      HEUR-DS-1, H-SMTH-001, H-DS-001 or ECDLP.
    stopping_rule_order: >-
      Phase 1 must complete for a cell before Phase 2 of that cell begins. If
      Phase 1 cannot complete within the cell's share of budget, the cell is
      M-BUDGET and Phase 2 is not started.

  # ==================================================================
  # 16. REQUIRED ARTIFACTS OF THE EXECUTING RUN
  required_artifacts:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/tasks/TASK-20260802-6a39f8/null_calibration.json
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/tasks/TASK-20260802-6a39f8/RESULTS.json
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/tasks/TASK-20260802-6a39f8/run_manifest.json
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/tasks/TASK-20260802-6a39f8/budget_stamps.jsonl
  required_result_fields:
    - contract_sha256_recomputed and its comparison outcome
    - exact p, a, b, X = p**2 and the 512 factor-base x-coordinates (or their sha256) per cell
    - exact pair count, with the assertion that it equals 130816 and that no pair has i == j
    - per-arm raw counts: records, exclusions, failed factorizations with indices, N == 1 records, n_eff
    - per-arm smooth COUNTS (not only fractions) at every ladder rung, powered and unpowered alike
    - the measured null's z-CDF grid, its top-64 z values, and tau
    - D (DR-1), D_power (DR-5), D_ident (DR-6), T (DR-3), and the DR-2 table
    - each rule's verdict beside its pre-registered threshold, including any rule the data made ill-defined
    - the rho diagnostic, explicitly labelled MODELED, beside the measured null rate
    - the verdict id from the verdict map, and nothing beyond it
    - every check that did not run, with its reason
    - sympy version, python version, host, git commit and dirty-tree state, seeds, and every command with exit status

  # ==================================================================
  interpretation_limits:
    - Toy scale only. One curve instance per field size, one seed, one host, one unreplicated run.
    - >-
      Scoped to INT-1 as instantiated above and to ENC-B. A different faithful
      encoding of the same fibre could carry a different smoothness law, and
      this experiment does not rule that out.
    - >-
      No cost consequence follows from any outcome. Even V-CONSISTENT licenses
      no early abort, no charged saving and no exponent, because the cost of the
      abort test is not measured here and R is not measured at all.
    - >-
      This experiment does not bear on whether Semaev or multihomogeneous
      structure yields any claw advantage beyond generic meet-in-the-middle.
      That question is entirely open after BATCH-021 and is untouched here.
    - H-DS-001 remains `weakened` with its status_scope; this contract does not reopen or re-score it, or any EV-DS-* record.
    - H-IC-001 and H-STR-002 remain weakened and are not reopened.
    - All four asymptotic-claim promotion gates remain OPEN and no outcome here moves any of them.
    - >-
      A recollection of the literature may be used neither to promote nor to
      dismiss any reading (DEC-20260731-019 ruling 3). The only smoothness
      calibration admissible in a decision rule here is the null this run
      measures.
  knowledge_scope:
    dominated_by: Pollard rho at generic exact-ECDLP exponent 1/2
    sota_delta: 0

  inference:
    policy: executor-implementation
    requested_policy: executor-implementation
    resolved_model_id: claude-opus-5
    reasoning_effort: null
    fallback_used: true
    fallback_reason: >-
      This Claude Code harness cannot resolve the GPT-5.6-family policy aliases
      in orchestration/model-policies.yaml; subagent frontmatter supports only
      Claude models, so the session ran on the inherited Claude backend.
      Recorded, never silently substituted.
    model_verified: false
    model_verified_reason: >-
      The adapter probe `python3 -m orchestration.adapter doctor --probe` was
      not run in this task. The identifier is unverified runtime-reported
      configuration.
    standing_basis: 0137a051eb5828789eb267fa83c8278086578d4c
