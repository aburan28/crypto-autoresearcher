coordinator_decision:
  id: DEC-20260802-446a54
  context: >-
    GOAL-ECDLP-001 BATCH-028 close. OPEN-BATCH023-A, the direct smoothness
    measurement of HEUR-DS-1, was ranked first by DEC-20260801-011 and had been
    owed across several batches; that decision recorded in its own words that
    BATCH-024 closed without factoring a single integer. This batch factored
    1046528 of them.
  decision: inconclusive
  target_ids: [GOAL-ECDLP-001, H-DS-001, EXP-SMTH-4403c4, EV-DS-84d006]
  rationale:
    - >-
      THE MEASUREMENT HAPPENED AND IT WAS DONE WELL. An independent validator
      re-implemented from the contract text alone and reproduced every arm digest,
      all 40 ladder counts and every statistic BIT-EXACTLY, with zero numerical
      discrepancies. The pre-registration integrity chain was verified four ways,
      two of which rest on filesystem evidence the producer did not author.
    - >-
      THE HEADLINE LABEL DOES NOT SURVIVE ADJUDICATION, AND THE REASON REQUIRED
      BOTH REVIEWERS. The red team found that the contract's own description of
      the treatment arm as EXHAUSTIVE implies a one-sample KS threshold of
      0.004507, which CELL-16's D = 0.004808 EXCEEDS -- so V-CONSISTENT sits in
      the gap between two defensible calibrations. The validator, separately,
      found that the two cells deviate in OPPOSITE directions: CELL-16 rougher,
      CELL-20 smoother. Neither reviewer held both facts. Together they say the
      primary cell is neither a clean pass nor a real rejection -- a genuine
      systematic departure would not flip sign between field sizes -- so the
      honest reading is INCONCLUSIVE.
    - >-
      THE PART OF HEUR-DS-1 THAT MATTERS WAS NOT REACHED. The deep-smooth regime
      was unpowered at both cells by the contract's own floor. M-UNPOWERED did not
      fire only because four of five rungs were powered. The heuristic's role here
      is asymptotic; the batch measured the shallow regime because that is what
      the budget reached, and the contract said so in advance rather than
      discovering it afterwards.
    - >-
      ADMISSIBILITY: THE REVIEWERS SPLIT AND I ADOPT THE NARROWER READING. The
      validator ruled admissible at reduced standing, conditioned expressly on the
      integrity chain verifying AND on its own from-scratch reproduction, and gave
      my retrospective determination zero weight -- correctly. The red team ruled
      the run admissible as an instrument and provenance record but NOT as a
      pre-registered decision reading. I ADOPT THE RED TEAM'S NARROWER READING,
      because D1b makes it unavoidable: the frozen contract self-declares
      evidence_eligible: true while approved_by is null, so the artifact answers
      the eligibility question inside itself and no external determination can
      repair that. Taking the more favourable of two reviews on a defect I created
      would be the wrong instinct here.
    - >-
      THE APPROVAL DEFECT IS MINE AND IS RECORDED AS SUCH. The BATCH-028 queue I
      wrote had no approval task between the freeze and the execution. The
      executor did not slip a gate; it ran on the authority my dispatch card gave
      it and flagged the gap in its own report. This is the second Coordinator
      defect a producer has caught in this session.
  evidence_refs: [EV-DS-84d006, CORR-20260802-757677]

  open_item_disposition:
    id: OPEN-BATCH023-A
    status: ATTEMPTED_AND_INCONCLUSIVE
    note: >-
      NOT CLOSED AS DONE. The measurement was performed, reproduced and archived,
      and that is real progress on an item that had been owed for several batches.
      But the primary cell's label is calibration-fragile, the deep-smooth regime
      -- where the heuristic's load-bearing content lives -- was not reached, and
      the run is admissible only as an instrument and provenance record. HEUR-DS-1
      is neither validated nor refuted, which is the same sentence DEC-20260801-011
      had to write, for a different and better reason: last time nothing was
      measured, this time something was.

  limitations:
    - Toy tier. Two cells at 16 and 20 bits, one seed, one host, unreplicated.
    - Bears on limb (a) of HEUR-DS-1 only, in the shallow regime.
    - No hypothesis status changes. H-DS-001 is untouched.
    - Session and implementation independence only; NOT model independence, so nothing counts toward a closure quorum.
    - dominated_by and sota_delta are not applicable: this is a measurement of a heuristic, not a construction competing against a baseline.

  next_actions:
    - >-
      SINGLE NEXT ACTION: a SUCCESSOR CONTRACT under a new id, with a
      COORDINATOR APPROVAL TASK BETWEEN FREEZE AND EXECUTION, whose first two
      phases are the two cheap arms both reviewers independently converged on.
      (1) Enlarge ONLY the null arm 8x at CELL-16: if D decays as n^(-1/2) the
      CELL-16 near-miss is noise and the calibration question dissolves; if it
      does not, the separation is real and the one-sample reading wins. (2) The
      SUPPORT-MATCHED null implied by RT028-B3 -- all 130816 discriminants were
      square, so the treatment occupies half the support the null samples, and no
      rule noticed. Both are minutes of compute and either can falsify the
      headline. Only after those: a deep-tail contract with a larger factor base,
      costed and funded explicitly rather than hoped for.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      An inconclusive measurement of one limb of one heuristic, in the shallow
      regime, at toy scale, admissible only as an instrument record, is not a
      durable finding. The reusable asset is the INSTRUMENT and the calibration
      question it exposed, and both belong in the successor contract rather than
      in the knowledge corpus. Revisit after the two falsification arms above.

  decided_by: coordinator
  decided_at: 2026-08-02
