evidence:
  id: EV-DS-84d006
  hypothesis_id: H-DS-001
  hypothesis_note: >-
    Bears on HEUR-DS-1, heuristic_assumptions[0] of H-DS-001, and on LIMB (a) of
    that assumption only. It does not bear on the hypothesis as a whole and does
    not change its status.
  experiment_ids: [EXP-SMTH-4403c4]
  run_ids: []
  task_ids:
    - TASK-20260802-80f5e9
    - TASK-20260802-6a39f8
    - TASK-20260802-d34ac4
    - TASK-20260802-0a1d4d
    - TASK-20260802-411037
    - TASK-20260802-268ec9
  type: measurement
  direction: inconclusive
  strength: weak
  strength_basis: >-
    WEAK, AND THE REASON IS NOT THE QUALITY OF THE EXECUTION. The measurement was
    reproduced BIT-EXACTLY by an independent validator that re-implemented from
    the contract text alone -- all eight arm N-sequence digests, all 40 ladder
    counts, D, D_power, D_ident, tau, T and every threshold, with zero numerical
    discrepancies. What holds the strength down is scope and calibration
    ambiguity, recorded in the observations below, not execution defects.
    Session and implementation independence only; NOT model independence under
    standing basis 0137a051eb5828789eb267fa83c8278086578d4c, so nothing here
    counts toward a closure quorum.
  claim_tier: toy
  claim_tier_basis: >-
    Two toy cells, FIELD sizes 16 and 20 bits (p = 62897 and 1045963), one seed,
    Bfb = 512, ENC-B, one host, one unreplicated run. No crypto-scale,
    medium-scale, affected-scheme or asymptotic claim is made or implied.
  certificate_refs: []
  proof_status: empirical_only
  proof_refs: []

  observations:
    - id: OBS-DS28-1
      statement: >-
        THE MEASUREMENT WAS PERFORMED. 1046528 integers were factored across
        eight arms at two cells, with zero exclusions, zero timeouts and zero
        failed factorizations. OPEN-BATCH023-A asked for exactly this and
        DEC-20260801-011 recorded that BATCH-024 had closed without doing it.
      status: CONFIRMED by independent re-execution
    - id: OBS-DS28-2
      statement: >-
        THE PRE-REGISTRATION INTEGRITY CHAIN HOLDS, and it holds on evidence that
        does not depend on any producer assertion. The contract digest matches
        across freeze receipt, snapshot receipt, committed blob and worktree. The
        freeze task provably produced no datum: its driver did not exist until
        after the freeze window closed. The null preceded the treatment by
        filesystem mtimes the producer did not author, and the calibration script
        reads only the two phase-1 arm files that were the sole arm files on disk
        at the time it ran.
      status: CONFIRMED by the validator's own four-way check
    - id: OBS-DS28-3
      statement: >-
        THE HEADLINE LABEL IS CALIBRATION-FRAGILE AT THE PRIMARY CELL. The
        contract applied a TWO-sample KS threshold, 1.63*sqrt(2/n_eff) = 0.006373,
        and CELL-16 returned D = 0.004808, a not-reject at 75% of threshold. But
        the contract's own text says the treatment arm "carries NO SEED AND NO
        SAMPLING NOISE: it is EXHAUSTIVE over all 130816 pairs". Read that way the
        correct critical value is the ONE-sample 1.63/sqrt(n_eff) = 0.004507,
        WHICH THE OBSERVED D EXCEEDS. The label V-CONSISTENT at CELL-16 therefore
        lives inside the gap between two defensible calibrations, and the
        contract's own prose argues for the stricter one.
      status: >-
        Red team finding RT028-B1, independently arithmetic-checked by the
        Coordinator. The validator reproduced the two-sample computation exactly
        but did not rule on which calibration is correct.
    - id: OBS-DS28-4
      statement: >-
        AND YET THE TWO CELLS DEVIATE IN OPPOSITE DIRECTIONS. CELL-16's treatment
        arm is ROUGHER than its null ("A-REAL has MORE mass at small z"); CELL-20's
        is SMOOTHER ("A-REAL has LESS mass at small z"). A real systematic
        departure from "intermediates behave like uniform random integers of the
        same bitlength" would not flip sign between two field sizes. That is the
        signature of noise, and it argues the CELL-16 near-miss is not a real
        effect even under the stricter calibration.
      status: >-
        Validator understatement U1, verified directly by the Coordinator against
        the two direction_plain fields in RESULTS.json.
      why_this_is_the_load_bearing_synthesis: >-
        NEITHER REVIEWER HELD BOTH HALVES. The red team found the calibration
        fragility and did not have the sign flip; the validator found the sign
        flip and did not rule on the calibration. Together they say the primary
        cell is neither a clean pass nor a real rejection, which is why the
        direction of this record is INCONCLUSIVE rather than either.
    - id: OBS-DS28-5
      statement: >-
        THE DEEP-SMOOTH REGIME WAS NOT TESTED, AND THAT IS WHERE HEUR-DS-1'S
        LOAD-BEARING CONTENT LIVES. The nominal u = 6 rung was UNPOWERED at both
        cells, k_null = 18 and 10 against the contract's own floor of 30.
        M-UNPOWERED did NOT fire, because four of five rungs were powered, which
        is the contract's stated precondition -- NOT because the deep tail was
        covered. The heuristic's role in this campaign is asymptotic; this batch
        measured the shallow regime because that is what the budget reached.
      status: CONFIRMED by both reviewers
    - id: OBS-DS28-6
      statement: >-
        LIMB (b), the Dickman rho model, WAS NOT TESTED. Rho carries zero decision
        weight and the validator traced it to two diagnostic call sites, entering
        no rule. The reported rho/p_null divergence to 0.10 and 0.18 at the
        deepest rungs is measured on the NULL arm only, so it carries no
        information about the object under test; it is recorded as a constraint on
        any successor that reintroduces rho, not as evidence about HEUR-DS-1.
      status: CONFIRMED by the validator; the red team's contrary reading that the
        divergence impugns rho's finite-X fidelity is recorded and NOT adopted,
        because a null-arm measurement cannot speak about the treatment object.

  defects_carried:
    - id: D1
      statement: >-
        The contract executed while carrying approved_by: null. No prospective
        Coordinator approval existed, because the queue the Coordinator wrote had
        no approval task between freeze and execution.
    - id: D1b
      statement: >-
        The frozen contract ALSO self-declares evidence_eligible: true at line 28
        while approved_by is null at line 26 -- a second bypass route inside the
        immutable artifact, which no external determination can repair. Found
        independently by both reviewers.
    - id: V1
      statement: >-
        direction_recorded is a hardcoded "real SMOOTHER than null" string emitted
        for every nonzero deviation, and at CELL-16 it CONTRADICTS the adjacent
        direction_plain field. A reporting defect, not a numerical one; found
        independently by both reviewers and confirmed in the embedded script by
        the Coordinator.
    - id: RT028-B3
      statement: >-
        All 130816 discriminants were square at both cells, so the treatment
        occupies half the support the null samples, and no decision rule observed
        this. Recorded as a support-matching defect for the successor.
    - id: RT028-B4
      statement: >-
        DR-3's stated tail probabilities are wrong by 169x and 11.7x; the correct
        marginal is NegBin(10, 1/2). The verdict is unaffected, but the frozen
        threshold's recorded property is not what the contract claimed.
    - id: V3
      statement: Undeclared seed departure from H-SMTH-001's stated 2201.

  boundaries:
    - >-
      This record bears on LIMB (a) of HEUR-DS-1 -- the comparative claim -- at two
      toy field sizes in the SHALLOW smoothness regime. It does not bear on limb
      (b), on the deep-smooth regime, or on HEUR-DS-1 as a whole.
    - >-
      HEUR-DS-1 carries six quantifiers; this run touches two, partially, and
      substitutes on object and ensemble. It moves the heuristic from NEVER
      MEASURED to MEASURED ONCE, in a proxy representation, at toy scale, in the
      shallow regime. That is a real advance and it is not more than that.
    - >-
      Nothing here supports, weakens or rejects H-DS-001, and no status changes.
      Eight steps stand between this reading and anything cryptographically
      relevant, all of them unfunded.

  unresolved_confounds:
    - The one-sample versus two-sample calibration question at CELL-16 is unresolved and is the successor's first job.
    - Null and treatment share the apparatus; DR-5 is the only power guard and one power arm may not suffice.
    - The exclusion path was never exercised, so its reachability is untested.
    - Pair dependence (each of 512 factor-base elements appears in 511 pairs) is unmodelled; it inflates variance, which the red team argues makes the frozen threshold conservative rather than anti-conservative, and which damages the reach claim rather than the not-reject.

  reviewed_by:
    - TASK-20260802-0a1d4d (independent validator; verdict passed, admissible at reduced standing; full bit-exact reproduction)
    - TASK-20260802-411037 (independent red team; admissible as instrument and provenance record, not as a pre-registered decision reading)
  reviewed_at: 2026-08-02

  inference:
    policy: coordinator-orchestration-code
    requested_policy: coordinator-orchestration-code
    resolved_model: claude-opus-5
    fallback_used: true
    model_verified: false
    standing_basis: 0137a051eb5828789eb267fa83c8278086578d4c
