correction:
  id: CORR-20260906-34357d
  recorded_at: '2026-09-06'
  record_type: process
  supersedes: CORR-20260906-72f696
  corrected_record: ledger/corrections/CORR-20260906-72f696.yaml
  field: what_this_correction_leaves_open_and_who_owns_it
  goal_id: GOAL-ECRANK-002
  corrected_by_lane: GOAL-SSI-001
  raised_by: >-
    GitHub Actions check `ledger-and-harness` on PR #791 (run 34016248524, job
    101440415857), head a3fb31c4b, at 2026-09-06T06:27Z, reporting: "FAIL: 1
    validation error(s) introduced by this PR: ledger/decisions/
    DEC-20260905-01a1b4.yaml: expected top-level key 'coordinator_decision'".
  prior_value: >-
    CORR-20260906-72f696 stated that the repair "adds none" of the validator's
    errors, on the evidence that tools/validate_ledger.py reported THE SAME FOUR
    ERRORS before and after, and concluded that the remaining legacy-envelope
    defect belonged to GOAL-ECRANK-002 and was deliberately left unrepaired.
  corrected_value: >-
    THAT REASONING WAS WRONG, AND CI WAS RIGHT. The count was equal but the SET
    was not: the repair moved ledger/decisions/DEC-20260905-01a1b4.yaml from
    "invalid YAML" to "expected top-level key 'coordinator_decision'", and
    `ledger-and-harness` compares errors by IDENTITY against the base branch, not
    by count. By that comparison -- which is the correct one -- the parse repair
    INTRODUCED an error: it moved the path from known-unparseable, where the base
    tolerated it, to newly schema-invalid, where it did not. A half-repair that
    converts one failure mode into another is a regression even when the total is
    unchanged, and "the same four errors before and after" was the wrong measure
    to have reassured myself with.
  what_went_wrong: >-
    The v2 replacement fixed the two YAML syntax defects and stopped, because
    this lane judged the envelope defect to require content judgment it had no
    standing to exercise. The judgment about standing was sound; the decision to
    SHIP A PARTIAL REPAIR ANYWAY was not. Repairing parseability alone is
    precisely the change that exposes the next defect, so the choice was never
    "fix the syntax or leave it alone" -- it was "complete the repair or make no
    change at all", and that framing was not recognised until CI made it.
  the_completed_repair: >-
    A v3 replacement at ledger/corrections/schema-supersessions/20260906/
    ledger__decisions__DEC-20260905-01a1b4.v3.yaml, which the registry entry now
    points at with its hash re-pinned. The v2 is retained immutably beside it and
    is not deleted or rewritten; the registry rejects duplicate superseded_path
    entries, so completing the repair meant repointing the single entry, and that
    lineage is recorded in the v3 header. The v3 keeps the v2's parse fix
    unchanged, wraps the record under `coordinator_decision`, and adds the four
    schema-required fields it lacked.
  how_the_added_fields_avoided_content_judgment: >-
    Each added value is copied from a field the archived record already carries,
    or records an absence the archived record itself asserts, and each is marked
    in the replacement as ADDED BY CORRECTION rather than presented as the
    author's. target_ids comes from the record's own goal_id and batch_id;
    decided_by is copied verbatim from its own recorded_by, which is retained
    unchanged; knowledge_promotion.promoted is empty with a not_warranted reason
    that quotes the record's own statement that no artifact of the batch exists
    and that NO RANK OVER Q IS ASSERTED ANYWHERE BY THIS RECORD. No research
    content was interpreted, reworded, judged, or promoted, and the correction
    takes no position on the C1-closure candidate the archived record leaves to
    BATCH-52b70c.
  verification:
    - >-
      tools/validate_ledger.py now reports 3 errors, down from 4, and
      DEC-20260905-01a1b4.yaml is no longer among them.
    - >-
      The three that remain -- DEC-20260905-36847f, DEC-20260905-e140ee and
      TASK-20260905-2c383f -- are byte-identical on origin/main, carry the same
      legacy-envelope defect, are NOT touched by this correction, and remain
      GOAL-ECRANK-002's to repair. That boundary claim is unchanged and is the
      part of CORR-20260906-72f696 that survives.
    - >-
      CI's exact kb command still reports 15 passed, so completing the envelope
      repair did not regress the corpus check that motivated the original fix.
  scope_and_limits: >-
    PARSEABILITY AND SCHEMA CONFORMANCE ONLY. Not evidence, in either direction,
    about any mathematical or cryptanalytic claim; an infrastructure defect is
    never negative mathematical evidence. Lifts no citation prohibition, changes
    no status, and neither endorses nor disputes the cancellation the archived
    record states.
  citations:
    - ledger/corrections/CORR-20260906-72f696.yaml
    - ledger/decisions/DEC-20260905-01a1b4.yaml
    - ledger/corrections/schema-supersessions/20260906/ledger__decisions__DEC-20260905-01a1b4.v3.yaml
    - tools/schema_supersession_registry.yaml
