correction:
  id: CORR-20260803-4e91da
  recorded_at: '2026-08-03'
  record_type: claim
  record_id: RC-8-PRESERVING-FRACTION-TARGET-REACHABILITY
  field: distance_from_the_measured_bound_to_the_0_90_target_and_the_cost_of_closing_it
  decided_by: coordinator
  supersedes: CORR-20260803-2cefa6
  superseded_by: null

  prior_value:
    corr_2cefa6_statement: "the 0.90 criterion was NOT met, and was missed BY TWO DRAWS"
    batch_007_receipt_statement: "two draws separating 0.78 from 0.90"
    goal_record_rank_3_next_action: >-
      Draw two further RC-8 instances; two ALIVE outcomes would carry the
      preserving-fraction bound to the 0.90 the criterion asks for.

  corrected_value:
    the_0_90_target_was_UNREACHABLE_AT_n_27_UNDER_ANY_OUTCOME: true
    supremum_of_the_bound_at_n_27: 0.8949807698236557
    supremum_arithmetic: >-
      The Clopper-Pearson one-sided 95% lower bound at k = n is 0.05^(1/n).
      At n = 27 that is 0.05^(1/27) = 0.89498, which is BELOW 0.90. A PERFECT
      RECORD OF 27 ALIVE DRAWS OUT OF 27 WOULD STILL HAVE MISSED THE TARGET.
      The criterion was not missed by two draws or by any number of draws at
      that sample size; it was arithmetically out of reach before the first
      draw was taken.
    measured_bound_at_25_of_27: 0.784700038857546
    bound_after_two_further_alive_draws_27_of_29: 0.798439412078496
    smallest_n_reaching_0_90_carrying_the_two_observed_failures: 61
    further_alive_draws_required_from_the_current_record: 34

  why_the_prior_value_was_wrong: >-
    "MISSED BY TWO DRAWS" CONFLATED TWO DIFFERENT QUANTITIES. 0.7847 is a
    confidence bound; 0.90 is a target on the same scale; and the gap between
    them was read as though the bound moved one draw at a time toward it. It
    does not. The bound is a function of BOTH the successes and the sample
    size, and at n = 27 its ceiling is 0.89498 no matter what the draws say.
    The two failures are not what put 0.90 out of reach at this sample size --
    the sample size did.

  the_consequence_that_matters_most: >-
    GOAL-AES-003'S RANK 3 NEXT ACTION CANNOT DO WHAT IT SAYS, AND IT IS THE
    RANKING THIS CAMPAIGN WOULD HAVE SPENT ITS NEXT BUDGET ON. Two further
    ALIVE draws move the record to 27 of 29 and the bound to 0.798439 -- which
    is the pooled figure ALREADY ON RECORD. The action as written would consume
    two draws to arrive at a number the campaign already has, while its stated
    purpose, reaching 0.90, would remain 32 draws away. Rank 3 is therefore
    struck and replaced in the same ledger commit that carries this correction.

  what_does_not_change: >-
    NO MEASUREMENT CHANGES AND NO EVIDENCE WEAKENS. The 27 RC-8 draws stand
    exactly as measured and were independently replicated field-by-field from
    the raw files with zero mismatches, including byte-identical S-box tables.
    The bound 0.784700038857546 stands and was recomputed independently to
    twelve decimal places. The finding that both NOT_ALIVE draws fail only the
    Poisson conjunct stands. What changes is the DISTANCE-TO-TARGET arithmetic
    and the cost of closing it, both of which this campaign had understated by
    an order of magnitude in effort: 34 further draws, not 2.

  how_it_was_caught: >-
    By the BATCH-007 independent validator (TASK-20260803-cddc64), which
    computed the supremum rather than accepting the campaign's distance
    statement, and which flagged that the goal's own ranked next action was
    incapable of its stated purpose. The Coordinator then recomputed every
    figure here independently by bisection on the exact binomial tail --
    0.05^(1/27), the 25-of-27 bound to twelve decimals, the 27-of-29 bound, and
    the n = 61 threshold -- before adopting any of them. This correction is
    adopted on that recomputation, not on the validator's authority.

  pattern_this_belongs_to: >-
    THIS IS THE THIRD TIME IN TWO DAYS A STATED GAP OR ABSENCE IN THIS CAMPAIGN
    HAS PROVED FALSE ON INSPECTION -- CORR-20260803-c92db5 (the PRP null said
    never measured, refuted by arm_A3), CORR-20260803-7d41c8 (RC-9 said never
    run, refuted by BATCH-006 A2-R4-K1), and now a target said to be two draws
    away that no number of draws at that sample size could reach. All three
    were claims ABOUT THE STATE OF THE EVIDENCE rather than claims about the
    mathematics, and none of them was checked by the reproduction machinery,
    because reproducing a measurement cannot test an assertion that a different
    measurement is missing or that a target is near. The standing rule added by
    CORR-20260803-7d41c8 -- absence claims must cite the directories actually
    searched -- is extended here: a distance-to-target claim must state the
    target's reachability at the sample size in hand.

  status_effects:
    hypothesis_status_changed: false
    evidence_strength_changed: false
    claim_tier_changed: false
  edits_are_additive_or_schema_only: true
  affects:
    - CORR-20260803-2cefa6 distance statement only; its NOT-MET ruling is unaffected and stands
    - GOAL-AES-003 next_action rank 3
    - BATCH-007 snapshot receipt summary line
  verification: >-
    Recompute the Clopper-Pearson one-sided 95% lower bound by bisection on the
    exact binomial upper tail: cp_lower(27,27) = 0.8949807698236556 against
    0.05**(1/27) = 0.8949807698236557; cp_lower(25,27) = 0.784700038857546;
    cp_lower(27,29) = 0.798439412078496; and the least n with n-2 successes
    whose bound reaches 0.90 is n = 61 at 0.9003651198057675.

  inference:
    policy: coordinator-orchestration-code
    requested_policy: coordinator-orchestration-code
    resolved_model: claude-opus-5
    fallback_used: true
    model_verified: false
    standing_basis: 0137a051eb5828789eb267fa83c8278086578d4c
