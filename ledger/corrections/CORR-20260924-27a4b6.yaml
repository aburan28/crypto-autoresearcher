  items:
    - item: 1
      what: whether the archived consumer census enumerated every consumer
      records:
        - id: DEC-20260924-e6638d
          path: ledger/decisions/DEC-20260924-e6638d.yaml
          sha256: 520f121806eef53c8b169c879496a2e35d49a6c56bad2b0638d4dab44a11b191
          locations:
            - lines: 890-896
              context: >-
                "THE CENSUS CLOSED THE SEARCH. ... This census enumerated every
                consumer by eight access modes to a fixpoint, and what it found
                is not a new reader of a disposed value but two value classes
                the draft never disposed of at value level. That is a finite,
                named gap, fixed by adding dispositions, not by another search."
      prior_value: >-
        The census enumerated every consumer of every S-1, S-2 and S-3 value.
      corrected_value: >-
        The census enumerated every consumer its eight access-mode METHODS
        reach (consumer-census.md lines 321-353). Those methods define m5 over
        a serialization of an in-memory structure (line 327), m8 over paths
        that NAME the solver/ directory or a site file (line 330), and m4 /
        M-16 over comparisons and hashing calls (lines 326, 349). They do not
        reach a byte read of files found by a directory walk. So the census
        has no row for the frozen r2 checker's sweep at r2_check_run.py lines
        228-233:
          for root, _d, files in os.walk(rd):
              for f in files:
                  b = open(os.path.join(root, f), "rb").read()
                  for t in R.FORBIDDEN_TASK_IDS:
                      if t.encode() in b:
                          errs.append(...)
        It reads every file of a run package, including raw-result.json (S-1
        values, which are alpha; and V-1 in fixture and m = 4 cell packages,
        through the K-4 copies), manifest.yaml (V-3, and the epsilon
        solver_events block), solver-events.json (epsilon), renamed attempt
        files (epsilon), <tag>.ms.* under their original names (beta), and
        solver/<tag>.callgrind.stdout and .stderr (V-6). Its effect is E2 (a
        checker error). It implements an APPROVED checker requirement
        (paristack lines 617-618: "no file of any r1 package carries
        TASK-20260923-cd932c or TASK-20260923-6c7f55 as a task id", re-pointed
        to r2 and, by healthresolve HR-10, to r3).
        Under the valueclose draft (CC-2 with VC-1): its reads of alpha,
        beta, epsilon and V-3 values are covered by those dispositions; its
        reads of V-1 are NOT covered (it is none of K-1..K-6 and not a
        comparison against a recorded hash of the same file, VC-1 (e)); its
        reads of V-6 fall "outside this table" (consumercover lines 375-378).
        The in-wrapper counterpart, r2_resolve.py lines 139-141, IS in the
        census (row R-6).
      evidence: >-
        r2_check_run.py lines 228-233 (read directly); r2_common.py line 96
        (FORBIDDEN_TASK_IDS); consumer-census.md lines 321-353 (methods) and a
        search of the hit table for r2_check_run.py lines 225-234 (rows at
        line 225 only; none at 228-233).
      why_it_matters: >-
        It does not change any pre-declared reading or its outcome:
        - DEC-20260924-e6638d's CU-2 (a) ruling ("complete, as the reading
          words it") stands, because (a) asks whether every mode was searched
          in every scanned file and whether any hit is unclassified;
        - the valueclose reading VR-2 concerns the 14 rows the census lists,
          and names method limits of this kind NOT A BAR (valueclose lines
          521-524), relying on value-level dispositions and on VC-3 for r3;
        - the valueclose transfer assumption (7) already states that V-1
          direct consumers depend on enumeration and that VC-3 backstops them
          for r3 code (lines 573-579).
        The r2 code never runs again (DEC-20260924-bea197 R-8). The practical
        consequence is for r3: an r3 checker that kept the byte sweep would
        be an r3 consumer of V-1 and V-6 with effect E2 that CC-2 with VC-1
        does not cover, and so a DV-11 STOP under VC-3. DEC-20260924-e52eec
        VA-7 therefore fixes, before the r3 stage is written, how the approved
        forbidden-id requirement is met in r3 without a byte reader of a
        site-carrying file.

  nothing_else_changes: >-
    No file changes. DEC-20260924-e6638d, the valueclose and consumercover
    drafts, the census files and the r2 code are unchanged. No approved rule
