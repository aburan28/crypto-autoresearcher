# =============================================================================
# CORR-20260924-27a4b6 -- SUPERSEDES ONE STATEMENT, NOT ANY FILE: what the
# archived consumer census enumerated.
#   DEC-20260924-e6638d says the consumer census "enumerated every consumer by
#   eight access modes to a fixpoint" (rationale, lines 890-896). That is true
#   of every consumer its eight stated METHODS reach. It is not true of one
#   generic reader the methods cannot reach: the frozen r2 checker's
#   forbidden-task-id sweep, experiments/EXP-GFPN-05ff43/implementation-v2-r2/
#   r2_check_run.py lines 228-233, which walks the run directory (os.walk), reads
#   every file's bytes and appends a checker error when a forbidden task id
#   occurs in them (effect E2). The census's hit table has no row for lines
#   228-233.
# Found by the Coordinator reading the code under TASK-20260924-20444a (ruled
# in DEC-20260924-e52eec). WRITE-ONCE. Archived by TASK-20260924-c817ee. No
# existing file is edited.
# =============================================================================
