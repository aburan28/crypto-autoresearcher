  cause: >-
    A statement of reach that generalized from the census's method list to
    "every consumer". The census's own method notes (M-10, transfer assumption
    (6)) disclose that it is static; they do not name generic directory-walk
    reads. This is the same class as CORR-20260924-5b83a1, -432f43, -e78b7a
    and -838ff2 (a reader not found by the search that was run), found here by
    reading rather than by a stage stop. No data, run or measurement is
    implicated.

  what_it_is_not:
    - NOT A CHANGE TO ANY FILE OR APPROVED RULE.
    - NOT A CHANGE TO ANY PRE-DECLARED READING OR ITS OUTCOME.
    - NOT A FINDING THAT the r2 checker, the census method or the paristack forbidden-id requirement is wrong.
    - NOT EVIDENCE about D, the quotient, H-GFPN-9a29be or HEUR-GFPN-DFLAT.

  evidence_artifacts:
