correction:
  id: CORR-20260825-c29738
  recorded_at: '2026-08-25'
  record_type: claim
  record_type_note: 'STATED RATHER THAN SILENTLY PICKED, following CORR-20260825-3105b9 and CORR-20260824-e0088c.
    templates/research-records.md admits only candidate | claim | run, and none names "a set of archived
    parameter capsules". `claim` is the closest true value: what is corrected is a class of CLAIMS ABOUT
    CORROBORATION STRENGTH made across ten dossiers, not a candidate object and not a run. The schema
    gap is offered to whoever owns the template; it is not fixed here.'
  record_id: coordination/goals/GOAL-SCURVE-*/batches/*/tasks/*/parameter-capsule.yaml (10 archived
    dossiers)
  corrected_record: the ten archived GOAL-SCURVE-* producer dossiers listed under scope below
  field: every assertion that two or more retrieved sources INDEPENDENTLY corroborate a value
  prior_value: 'Ten dossiers recorded agreement between two or more retrieved sources as independent
    corroboration -- e.g. "INDEPENDENT SECOND WITNESS", "agreement: exact_between_two_independent_retrieved_sources",
    "two independent retrieved witnesses agree" -- and in several cases cashed that downstream, most
    consequentially in NIST P-224''s honest_accounting.sota_delta as "the parameter tuple moved from
    1 unverified user-supplied source to 2 independent retrieved sources".'
  corrected_value: 'THOSE VALUES ARE CORRECT AND THE INDEPENDENCE CLAIM IS NOT. Every such reading passed
    through the WebFetch tool, which in this environment returns a small-model SUMMARY of the page rather
    than the page. Two WebFetch reads of different URLs are ONE INSTRUMENT SAMPLED TWICE; host diversity
    is not instrument diversity. Two calls on the SAME url have been observed to disagree in both value
    and length, so cross-call agreement is weaker still, and agreement between two summarised reads
    is the exact pattern that would CONCEAL a corruption rather than expose it. A separate and independent
    defect affects NIST P-224 specifically: RFC 5114 is a self-declared restatement of NIST and the
    second witness was an aggregator, so both are downstream of the same X9.62/NIST parameter set and
    are not independent derivations either.'
  binding_invariant: AGREEMENT BETWEEN TWO WEBFETCH READS CARRIES NO CORROBORATIVE WEIGHT IN THIS PROGRAM.
    Corroboration requires either two genuinely distinct instruments, or a raw-byte witness. A raw-byte
    witness is a file staged into a hash-pinned mirror by curl and verified against its recorded sha256
    -- never another WebFetch.
  sweep_result:
    note: The retraction above is a reasoning correction, NOT a data correction. The sweep that found
      it also tested the data, and this is the load-bearing positive result.
    dossiers_swept: 10
    sweep_agents_failed: []
    values_examined: 274
    values_byte_verified_against_raw_mirror: 195
    confirmed_wrong_parameters: 0
    producer_self_disclosed_quarantines_before_the_sweep: 116
    plain_statement: 274 values examined across all ten dossiers, 195 verified character-identical against
      raw mirror bytes, and ZERO curve parameters found wrong. Not one hex digit, decimal, cofactor
      or seed. The known-corrupting channel had the opportunity to damage roughly two hundred digit
      strings and damaged none of them. Every finding is a defect in reasoning, provenance marking or
      serialization -- none in data.
  quarantines_discharged: Producers quarantined values in good faith when the mirror did not yet exist.
    The mirror now supplies raw-byte witnesses for the large majority. THE CORRECT PRESENT-TENSE STATEMENT
    IS THAT THOSE VALUES WERE UNVERIFIED AND ARE NOW VERIFIED. A successor must not spend budget re-fetching
    what inputs/SAFECURVES-20260825/ already answers.
  residual_genuinely_unverifiable: 'Not everything is discharged, and the correct verdict on each of
    these is UNVERIFIABLE HERE -- neither wrong nor right: NIST P-224 aggregator aliases and the RFC
    5114 attribution; secp256k1''s BIP-340 note; the Anomalous BL-2024 thresholds, LMVV-2004 prime families
    and Semaev bound; the ANSSI OID and its seed length; BN(2,254) alt_bn128 p and b, the exTNFS figure
    and BN462 h. No mirrored copy of the underlying document exists for any of them.'
  credit: 'Recorded because good conduct should be as legible as error. brainpoolP256t1''s producer
    found and retracted this defect in its own work unprompted, graded it HIGH, and explicitly refused
    to let the correct outcome excuse the void argument. Curve25519''s producer stated the general rule
    verbatim. Producers dispatched after the retrieval briefing transcribed zero WebFetch digits at
    all. No producer could have taken raw bytes even had it known: orchestration/roles.yaml gives idea-generator
    no run_commands capability. THE REMEDY IS A CHANNEL CHANGE, NOT A CONDUCT CHANGE.'
  disclosed_debt_parseability:
    measured_here_not_quoted: true
    unparseable: 33
    of_total: 103
    statement: '33 of 103 archived coordination YAML artifacts in this campaign fail yaml.safe_load.
      Consequence, stated plainly: a downstream executor asked to consume one of these audit plans cannot
      load it, and Curve25519''s WebFetch quarantine -- which its own task report directs a reader to
      consult FIRST -- is unreachable by machine.'
    failure_families: 'Unquoted scalars containing ": " (e.g. a source note carrying an equation); values
      beginning "|" read as block-scalar indicators (e.g. `metric: |D|`); flow mappings with unquoted
      colons; and continuation-indentation errors. `metric: |D|` is the SAME defect class repaired earlier
      in this session in experiments/EXP-SSI-697354-v2/specification.yaml, and it recurred because nothing
      was watching this path.'
    why_not_repaired_here: These artifacts are archived and bound by path_sha256 under content_first
      binding in their snapshot receipts and queue cards. Editing one breaks its archive binding, and
      a content mismatch is fatal by design. They can only be superseded, never edited.
    why_not_baselined: tools/merge_hygiene_baseline.txt is APPEND-FORBIDDEN by its own header -- "Lines
      may only ever be REMOVED" -- because a growing baseline hides exactly the masking failure the
      gate exists to catch. Adding 33 lines to silence this would be the prohibited move.
    open_question_for_the_coordinator: 'tools/check_merge_hygiene.py PARSE_RULES covers coordination/**/*.json
      but not coordination/**/*.yaml. The sweep called that a hole. The code calls its own narrowness
      DELIBERATE ("these are the record types other records resolve references against"), and producer
      deliverables are arguably not that. NOT DECIDED HERE, because widening the rule would permanently
      fail this branch against files that cannot be repaired, leaving only the two forbidden escapes
      above. The decidable part is forward-looking: require a parse check before an artifact is accepted
      into an archive, which prevents recurrence without touching immutable history.'
  scope:
  - NIST P-224
  - Ed448-Goldilocks
  - secp256k1
  - Anomalous
  - Curve25519
  - ANSSI FRP256v1
  - NIST P-256
  - NIST P-384
  - BN(2,254)
  - brainpoolP256t1
  affects_claims: false
  affects_claims_note: No hypothesis, evidence, decision, goal status, safety or vulnerability statement
    depends on any of this. These dossiers adjudicated no criterion cell and asserted nothing about
    any curve. What is corrected is how strongly their sourcing was described.
