  prior_value: >-
    CORR-20260923-5c5a23 S4 reads completion criterion 1 as "the Cheon cost
    exponent per curve, per branch, typed by the auxiliary input it
    presupposes, tabulated beside the ordinary-input rho exponent 0.5 in the
    same group-operation unit, as a different problem", and requires that any
    record that discharges the criterion state that condition.

  corrected_value: >-
    READING FIXED, TEXT NOT EDITED. Completion criterion 1 is read as "the
    Cheon cost exponent per curve, per branch, typed by the auxiliary input it
    presupposes, tabulated beside the ordinary-input rho exponent 0.5 as a
    different problem, with the difference in cost unit stated beside the rho
    column". The required unit statement is as follows. The typed exponents are
    exponents of the leading step-count expressions of Cheon's Theorems 1 and 2.
    Each step is an exponentiation: the theorems carry an O(log p)
    group-operation factor (EUROCRYPT 2006) or an Exp_G(p) factor (J.
    Cryptology 2010). The typed exponents omit that factor and the O()
    constants, so they understate group-operation counts. The rho exponent
    counts group operations. The two units differ by a factor Theta(log r). Any
    record that discharges the criterion states the supply condition of
    CORR-20260923-5c5a23 S4 and this unit statement. No record states that the
    typed exponents and the rho exponent are in the same unit.

  what_stands_unchanged:
    - >-
      Every other part of CORR-20260923-5c5a23 S4: the reading is fixed and the
      criterion text is not edited; the criterion is read per branch, typed by
      the auxiliary input it presupposes, beside rho as a different problem; the
      supply condition is stated by any discharging record.
    - CORR-20260923-5c5a23 items S1, S2, S3 and S5, and its what_is_NOT_corrected list.
    - >-
      CORR-20260923-187ea3 labelling_rule_for_any_citing_record (column names,
      input models, bits of d, B032-C7/C8 citation, supply condition, and no
      unqualified "identical accounting"). This record adds the unit statement
      to it and removes nothing.

  reason: >-
    In REVIEW-AUXIN-20260923-09aadd the red team TASK-20260923-635c5c retrieved
    and read both the EUROCRYPT 2006 archive copy and the J. Cryptology 2010
    author manuscript. Its report RT-20260923-38bbbf, objection O1 and sentence
    audit S1, finds that a labelling rule annotating the rho column "in the
    same group-operation unit" as the typed exponents is contradicted by both
    sources once the log factor is dropped. Its cross-joint note X4 traces the
    phrase to CORR-20260923-5c5a23 S4 and notes that any wording fix is a
    Coordinator record. DEC-20260923-a4c3d5 composes that finding as the
    decisive J5 break (key K-revise-defect) and files this correction so that
    a revised design is not bound by S4 to repeat the defective sentence. The
    record corrected is immutable, so the correction is additive.

  scope_of_the_correction: >-
    A cost-unit labelling reading only. No measured value changes, no
    exponent is re-stated, and no conclusion about any curve follows from it.

