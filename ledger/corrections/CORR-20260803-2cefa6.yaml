correction:
  id: CORR-20260803-2cefa6
  recorded_at: 2026-08-03
  record_type: claim
  record_id: GOAL-AES-003-RC-8-BOUND-AND-BATCH-006-ARCHIVE
  field: the preserving-fraction lower bound, and the BATCH-006 archive commit message
  prior_value: >-
    (1) The Coordinator reported that RC-8's 27 draws moved the campaign's
    preserving-fraction lower bound "from 0.224 to approximately 0.90", citing
    27/27 ALIVE under a "BATCH-005 form" of the criterion alongside 25/27 under
    the strict BATCH-004 rule, and stated the 0.90 target was met under two
    readings.
    (2) The commit that landed the BATCH-006 snapshot content carries the message
    "record the VERIFIED BATCH-006 snapshot archive".
  corrected_value: >-
    (1) THE 0.90 TARGET IS NOT MET. THE GOVERNING BOUND IS 0.7847 UNPOOLED AND
    0.7984 POOLED. The independent validator ruled on the question the producer
    correctly declined to answer, and the ruling is that THE STRICT BATCH-004
    RULE GOVERNS -- X/v >= 5 AND a Poisson tail below 1e-6. There is no second
    frozen criterion: BATCH-005's "at least 5x" form presents itself IN ITS OWN
    TEXT as a QUOTATION of BATCH-004's rule and drops the Poisson conjunct in the
    act of quoting. A defective restatement does not create a rule, and adopting
    it after the data are in would be CHOOSING THE CRITERION ON THE DATA. Under
    the rule that was actually frozen, 25 of 27 draws are ALIVE and two are
    INDETERMINATE, the target is missed BY TWO DRAWS, and the honest headline is
    that the bound rose from 0.224 to 0.78, which is a large real gain and is not
    0.90. All five bound figures recompute exactly.
    (2) THE COMMIT MESSAGE IS FALSE OF ITS OWN COMMIT. That commit's archive is
    NOT dispatcher-verified, for the reason recorded in the snapshot receipt: a
    shell quoting error left the intended archive message unwritten and the
    files landed under the message meant for the queue update. The word VERIFIED
    in it is wrong. The receipt's DISPATCHER_VERIFICATION_STATUS block, which
    states the failure, was added in the FOLLOWING commit -- honest, but post-hoc,
    so a reader at that commit sees an archive asserting a verification it does
    not have.
  also_corrected_by_the_same_validator:
    monotone_overstated: >-
      The Coordinator and producer described the yoyo round-profile as MONOTONE
      DECREASING. r=10 is not below r=6. The accurate description is that the
      profile DECREASES TO THE NULL AND THEN FLUCTUATES AROUND IT. "r=5 is the
      last sub-saturated above-null round" is CONFIRMED; "peak at r=5" was already
      refuted; "monotone" is the third framing in a row to outrun the data.
    producers_own_absence_claim: >-
      The producer, three paragraphs after correctly catching the Coordinator
      making an unverified absence claim, made one itself: that no r=4 arm had
      ever been PAIRED to an r=5 arm on key and stream. BATCH-001's r=4 and r=5
      arms share master seed 20260802 and its yoyo2.c derives key and stream
      independently of `rounds` -- the same structural argument the producer used
      for its own arms. No search was named for that sub-claim. Recorded because
      the failure mode is evidently not personal to the Coordinator.
    active_word_not_index_zero: >-
      The structural anomaly was reported as "word 0 is never preserved". The
      never-preserved index TRACKS THE ACTIVE WORD, not index 0: under amask=2
      the pattern is [N,0,N,N]. The validator also ran the null-object control the
      batch lacked -- amask=15 drives the statistic from rate 1.0 to W=0 on every
      trial -- establishing the anomaly is not a counting artifact. Still
      unexplained; no mechanism is offered.
  reason: >-
    The bound error is the Coordinator's: two readings were reported side by side
    as if both were live, when only one criterion was ever frozen, and the more
    favourable one was the one that reached the target. Reporting both looked
    even-handed and was not, because the campaign had already frozen a rule and
    the second "reading" was a corrupted quotation of it. The producer was right
    to decline the judgement; the Coordinator was wrong to relay the ambiguity to
    the user as though 0.90 had been reached under a legitimate alternative.
    THE ARCHIVE-MESSAGE DEFECT IS THE SIXTH INSTANCE THIS SESSION of asserting a
    state without checking it, and the validator caught the sharpest form of it:
    a commit that calls itself VERIFIED while being the reason verification is
    impossible.
  evidence_artifacts:
    - coordination/goals/GOAL-AES-003/batches/BATCH-006/tasks/TASK-20260803-a13de8/validation_report.yaml
    - coordination/goals/GOAL-AES-003/batches/BATCH-006/tasks/TASK-20260803-0764fc/RESULTS.json
    - coordination/goals/GOAL-AES-003/batches/BATCH-006/archives/TASK-20260803-cd2b5e/snapshot-receipt.json
    - ledger/corrections/CORR-20260803-9a67de.yaml
  supersedes: null
  superseded_by: null
