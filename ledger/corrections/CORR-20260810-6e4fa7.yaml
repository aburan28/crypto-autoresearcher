    RQ-CANL-63098f, open across four batches)."
  corrected_value: >-
    `grep -l "^  question_id: RQ-CANL-63098f$" ledger/proposals/*.yaml`, run
    directly against the committed corpus at the time of this correction,
    returns TEN files (IDEA-20260807-{11b93d,13c821,44ba75,6533fd,761a8c,
    cfe576,dbb250,ee6ef7,fd5a24}, IDEA-20260808-5158fa), not five. The same
    query run across all fourteen GOAL-ENDO-001 lanes today shows RQ-CANL-63098f
    at 10, squarely inside the 9-12 range every sibling lane sits in
    (RQ-EQIC-8cb959, RQ-EQLA-0d3f40, RQ-EWALK-8fa147, RQ-TORS-8c7b79,
    RQ-MODEL-e61cb2, RQ-GGMB-6eaabc, RQ-MTGT-2cabee at 9; RQ-VOLC-f6253b,
    RQ-JINV-8fc13a, RQ-PAIR-21313f at 10; RQ-ICINV-475b5e, RQ-CLGP-b99df5 at
    11; RQ-INSTR-f8faa0 at 12). RQ-CANL-63098f is AT PARITY with its siblings,
    not the outlier "5 against 8-9" four decision records described it as.
    Nine of the ten proposals are dated 2026-08-07 (the same day as both
    DEC-20260807-c8aa8b and DEC-20260807-41c173) and the tenth,
    IDEA-20260808-5158fa, was added 2026-08-08 by commit 6e000e0f ("ideas: +6
    endomorphism/CM proposals (E3 slice), 110 total") -- a cross-lane
    ideation pass that touched several RQs, CANL among them, and was never
    connected back to N7 by any later decision record. Day-granularity
    timestamps make it impossible to state whether c8aa8b's "5" was accurate
    at the exact moment it was written or already stale; what is verifiable
    is that by DEC-20260807-41c173 (same day) the figure was being repeated
    without a fresh count, and every record since has carried the resulting
    RE-DISPATCH-IDEATION instruction forward without ever re-running the
    one-line check that settles it.
  why_the_underlying_lane_status_is_unaffected_but_the_next_action_is_not: >-
    Nothing here bears on RQ-CANL-63098f's substance. No hypothesis exists
    for this lane, no experiment is approved, and the seven mechanically
    RENDERED draft contracts under experiments/EXP-CANL-*/specification.yaml
    (status: draft, approved_by: null, zero runs, all produced by
    tools/derive_experiment_contracts.py directly from proposal text --
    "Fields are rendered from the proposal, never invented," per each
    contract's own derivation_provenance block, NOT a Coordinator design
    pass) remain exactly what they were: unreviewed scaffolding, not
    evidence of quality or of readiness. What changes is which lifecycle
    stage is next. Four decision records pointed at ideation
    (`/propose-ideas`) because the stated count was below the campaign's own
    observed 8-9 parity benchmark. The count has been at or above that
    benchmark since at least 2026-08-08, so the correct next action was, and
    is, `/design-experiment`: review the ten proposals against
    RQ-CANL-63098f's own decision_target bar ("a proposal must state how CM
    changes [the canonical-height-of-order-N quantity], or it is closed on
    arrival"), select the strongest live claim, and produce a real frozen,
    Coordinator-designed contract -- not another idea-generator dispatch
    against a gap that closed two days ago.
  required_action:
  - >-
    Do not re-dispatch the idea-generator for RQ-CANL-63098f on the strength
