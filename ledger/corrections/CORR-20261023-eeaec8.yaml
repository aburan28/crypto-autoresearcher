  items:
    - id: P1
      field: criterion_readings.EXP-CZLIFT-1a3453.reading
      prior_value: >-
        "No digit of x or y of the torsion section, at either index 0..4, on
        either arm, has a character pair above ln N + 12 on either seed; the
        maxima sit where the Exp(1) null puts them, as do the shuffled and
        uniform controls."
      corrected_value: >-
        Only 42 of the 72 records are power-bearing; the 30 records with
        n <= 41 are blind by the trivial bound (h = (n-1)/2 <= T) and carry no
        information. On the 42 power-bearing records, no single-digit function
        a_i(x(s_tor([k]P))) or a_i(y(s_tor([k]P))), i = 0..4, has half-range
        normalised correlation tau >= rho_min(p,n) with any single pair
        (nontrivial additive character of F_p, character of Z/n); rho_min is
        0.28 to 0.98 (median 0.50) and the planted floor(pk/n) leak spikes on
        42 of 42. The statistic cannot test "no digit correlates with the
        discrete log": digit 0 determines k up to sign and is white on 72 of
        72, and the CHIRP, INV and LEGMSB leaks pass the frozen rule on 72 of
        72. The pre-registered Exp(1) per-pair null is an unnumbered
        random-model heuristic that the CM D = -3 y-digits, digit 0 and the
        shuffled series violate; the real higher-digit spectra match the
        seeded uniform and symmetry-matched nulls within resolution. The
        shuffled control is contaminated by the same non-discrete-log
        structure as the signal and biased toward the hypothesis: its recorded
        zero had probability about 0.47. "Exactly as for the same digits
        re-indexed by a random permutation" is not established.
      basis: [DEC-20261023-2e7447 rationale a-c and scoped_claim, EV-CZLIFT-764f54]
    - id: P2
      field: criterion_readings.EXP-CZLIFT-1a3453.claim_boundary
      prior_value: >-
        "p <= 600, n <= 600, precision 5, additive characters of F_p against
        characters of Z/n, half-range sums."
      corrected_value: >-
        53 <= p <= 571 and 47 <= n <= 613 on the 42 power-bearing records (33
        CM-canonical class-number-one integer models and 9 random curves with
        one naive integer lift); one random generator per record; precision 5;
        single (additive character of F_p, character of Z/n) pairs; half-range
        sums. Nothing follows for nonlinear or pseudorandom encodings,
        multiplicative characters, weaker or sparser leaks, other models,
        lifts or generators, or larger n.
      basis: [DEC-20261023-2e7447 scoped_claim, EV-CZLIFT-764f54]
    - id: X1
      field: criterion_readings.EXP-CZLIFT-ed8113.reading
      prior_value: >-
        "Seed 20261009: exactly one dependence in 1600 valid trials, at the
        smallest prime p = 101 with r = 2, the relation -2 P~_1 - P~_2 = O
        (the second lifted point happened to be -[2] of the first on the
        fitted curve; rate 0.000625, within the pre-registered bound 0.002).
        Seed 20261010: none in 1600. Every planted dependence was detected on
        both seeds. Lifted points have naive log-height 0.63 to 0.83 log p,
        rising with p."
      corrected_value: >-
        The counts stand. Two readings change. (i) "Within the pre-registered
        bound 0.002" refers to the specification's success criterion, which is
        met on both seeds. The hypothesis' own pre-registered prediction
        ("exactly 0 on 1600 valid trials per seed") FAILED on seed 20261009,
        by an exact counterexample: the line Y = -15 is tangent at P~1 =
        (-24, -15) on Y^2 = X^3 - 1728 X - 27423, so 2 P~1 + P~2 = O with P~2
        = (48, -15) (CORR-20261023-4ffd7e S1; EV-CZLIFT-ee9b23 proof_status
        certificate). The specification criteria govern the experiment-level
        reading and the hypothesis' predictions govern its status (weakened,
        DEC-20261023-488023). (ii) The height figures are the r = 2 cell means
        only (validator F2), and they follow 1 - (1 + ln 2)/ln p, the value
        for a uniform symmetric residue; they are not a constant 0.7. The
        rate is pigeonhole-dominated: the bound 6 lies below the attacker's
        coefficient regime p^(1/r) in every r = 2 cell with p >= 211, and the
        bounded search cannot certify independence.
      basis: [CORR-20261023-4ffd7e, DEC-20261023-488023, EV-CZLIFT-ee9b23]
    - id: X2
      field: criterion_readings.EXP-CZLIFT-ed8113.claim_boundary
      prior_value: >-
        "p <= 12809, r <= 3, relation bound 6, symmetric integer lifts."
      corrected_value: >-
        p in {101, 211, 401, 809, 1601, 3203, 6421, 12809}, r in {2, 3},
        relation bound 6, the y != 0 sampler with pairwise distinct x
        (harness/czlift.py random_point), symmetric integer lifts and the
        zero-freedom Weierstrass fit through them (no discriminant
        minimization, no reverse-Mestre conditions). This is a nearby object,
        not xedni proper; nothing follows for the literal all-points sampler,
        coefficients above 6, r >= 4, index calculus on E(Q), cost, or any
        deployed curve.
      basis: [CORR-20261023-4ffd7e, DEC-20261023-488023 decision_scope and limitations]

