  clears_when: >-
    TASK-20260918-7d15e6 returns a verdict on J1. On `holds`, a superseding
    record LIFTS this quarantine and the entry stands. On `breaks`, a corrected
    corpus entry supersedes KN-FIND-9cba50 with a title that does not name
    GOAL-DREG-001, and the quarantine becomes permanent. On `undetermined`, the
    quarantine stands and is itself recorded as an impediment -- an unresolved
    review is never a finding in either direction.

  asserts_nothing_about: >-
    The mathematics. Nothing here bears on whether d_reg tracks the semi-regular
    null, on whether Semaev's Assumption 1 holds at any n, on the difference
