# =============================================================================
# CORR-20260918-3e91d7 -- KN-FIND-9cba50's headline attribution is QUARANTINED
# pending TASK-20260918-7d15e6. The corpus entry is not edited and not deleted.
#
# WHY A CORRECTION AND NOT A NOTE. DEC-20260918-4b7e21 blocked
# EV-ICPERF-a8080e's ladder finding from propagating to GOAL-DREG-001. That
# block was written without knowing a corpus entry had ALREADY carried the
# attribution into knowledge/findings/, where the retrieval index serves it to
# every future agent as a curated internal finding. A block that does not reach
# the corpus does not reach the readers it was written for.
#
# WHAT IS QUARANTINED IS ONE CLAIM, NOT THE ENTRY. The measured content -- first
# fall degree 3.00 flat against a shape-matched null at 4.00, and the d_F4 <= 4
# predicate reproducing at n <= 21 -- is untouched by this record, and so is the
# entry's candour about its own limits. What may not be cited is the sentence in
# its TITLE that names GOAL-DREG-001.
# =============================================================================
correction:
  id: CORR-20260918-3e91d7
  recorded_at: '2026-09-18'
  record_type: claim
  record_id: KN-FIND-9cba50
  recorded_by_decision: DEC-20260918-4b7e21
  archived_by: TASK-20260918-c93f0a

  field: >-
    The title claim, and the `sibling_findings_note` that restates it: that the
    subspace ladder whose object family is at issue is "GOAL-DREG-001's", and
    that "any GOAL-DREG-001 degree number taken through
    koblitz_bench::subspace_ladder" is thereby qualified.

  prior_value: >-
    "GOAL-DREG-001's subspace ladder measures a different object family from the
    one Semaev 2015 Assumption 1 quantifies over" (title), and
    "any GOAL-DREG-001 degree number taken through koblitz_bench::subspace_ladder
    is a statement about Frobenius-invariant subspaces of dimension ord_n(2), and
    cannot be read as evidence for or against Assumption 1 without being redone
    on the diagonal" (sibling_findings_note).

  corrected_value: >-
    QUARANTINED, NOT WITHDRAWN AND NOT AFFIRMED. The attribution of the ladder
    to GOAL-DREG-001 is UNESTABLISHED. Until TASK-20260918-7d15e6 returns,
    KN-FIND-9cba50 may not be cited for any claim about GOAL-DREG-001, about its
    instruments, or about the admissibility or informativeness of its
    accumulated degree measurements. It may still be cited for what it measured
    on the family it names -- first fall degree 3.00 flat for n = 7..63 against
    a shape-matched random null at 4.00, and the d_F4 <= 4 refutation predicate
    reproducing at every cell n = 5..21 -- with the record's own toy-tier and
    external-provenance caveats attached, and with the standing caveat that
    first fall degree is not d_F4 (KN-OPEN-d218ec).

  reason: >-
    THREE FACTS, EACH CHECKABLE, NONE OF WHICH SETTLES THE QUESTION ON ITS OWN.

    (1) ARITY. GOAL-DREG-001's own objective, read directly off the goal head,
    is "the boolean chained Semaev (m=3, t=3) solving degree d_reg(n)". The
    ladder count is at m = 2, where the entry reports 0 coincidences of 23; at
    m = 3 the same entry reports the dimensions coinciding TWICE, so the
    mismatch is weaker precisely at the arity the campaign uses. The entry's
    headline is stated at the campaign's name and its support is at a different
    arity.

    (2) ADMISSIBILITY. The same objective declares: "Evidence is admissible ONLY
    from full-column exact ranks, the graded pivot-degree Hilbert function, or
    the q->s (solution-count) collapse". First fall degree obtained through a
    subspace ladder is none of those three. So even if the ladder were this
    program's, its output was never admissible evidence under this goal, and the
    entry's claim to be QUALIFYING a body of GOAL-DREG-001 measurement would
    still need to identify which admissible measurements it qualifies.

    (3) PRESENCE. `koblitz_bench` appears nowhere in this repository, which
    contains no Rust source file of any kind. The instrument name matches only
    records authored by the same work stream that produced this entry --
    EV-ICPERF-a8080e, EXP-ICPERF-5fd141, this entry, and the two records opening
    the review round. No pre-existing record of this program cites that
    instrument. AN ABSENCE IS NOT A PROOF: the instrument could have been
    removed, or have lived only in a worktree, and this Coordinator had no shell
    and could not search git history. That unresolved possibility is exactly why
    this is a quarantine rather than a withdrawal.

    A FOURTH THING IS NOT A REASON AND IS RECORDED SO IT CANNOT LATER BE READ AS
    ONE. The entry's author has stated, in an inter-agent message, that the
    attribution was its error. A MESSAGE IS NOT EVIDENCE (AGENTS.md,
    "Inter-agent messaging"), and a concession obtained that way may not carry a
    correction any more than it could carry an approval. It is noted, it is
    welcome, and it changes nothing about the basis above -- which is why this
    record rests on three facts read from committed artifacts and not on the
    author's account of its own work.

  promotion_gate_finding: >-
    RECORDED BECAUSE IT IS THE REUSABLE PART. KN-FIND-9cba50 and its sibling
    KN-FIND-aa2efc were both promoted from evidence records that carry
    `review_refs: []` and that state in their own text that no reviewer in this
    program has read their artifacts. Under agents/coordinator.md the
    promotion gate fires on `replicated`/`strong` evidence; EV-ICPERF-a8080e is
    `strength: preliminary`, which does not reach it, and EV-ICPERF-10c5fc's
    `replicated` is ruled unconferred by DEC-20260918-4b7e21. Neither promotion
    should have occurred on the gate as written. This is a process finding about
    two entries, not an accusation about their contents, and the remedy for
    KN-FIND-aa2efc is lighter (see below) because its headline makes no claim
    about this program's own instruments or goals.

  affected_records:
    - id: KN-FIND-9cba50
      how: >-
        QUARANTINED as above. Not edited, not deleted, `superseded_by` left
        null -- a quarantine is provisional and supersession is not, so writing
        one now would assert a disposition the review has not reached.
    - id: KN-FIND-aa2efc
      how: >-
        NOT QUARANTINED. Flagged only. Its headline is a claim about the
        external work's own object (the ECC2K-130 decomposition-oracle family)
        and about arithmetic (the product law), and it attributes nothing to any
        instrument or goal of this program, so the failure mode this record
        exists to stop does not apply to it. What does apply: it was promoted
        from EV-ICPERF-10c5fc, whose `replicated` grade DEC-20260918-4b7e21
        rules unconferred, so it may not be cited as a replicated finding OF
        THIS PROGRAM. Its grade is reviewed under J4 of TASK-20260918-7d15e6.
    - id: EV-ICPERF-a8080e
      how: >-
        NOT corrected by this record. Its propagation to GOAL-DREG-001 is
        already blocked by DEC-20260918-4b7e21, and whether its attribution
        language needs a correction of its own is J1's question. Filing that
        correction now would pre-empt the round.
    - id: GOAL-DREG-001
      how: >-
        UNTOUCHED. No impediment, no correction, no next_action, no status
        change. Stays `active`. This record exists precisely so that a corpus
        entry does not do to that goal what this Coordinator declined to do
        directly.
    - id: knowledge/INDEX.md
      how: >-
        Regenerated on demand and never committed, so nothing is owed there.
        Noted because a reader may expect an index edit and its absence is
        correct rather than an omission.

  evidence_artifacts:
    - knowledge/findings/KN-FIND-9cba50.md
    - knowledge/findings/KN-FIND-aa2efc.md
    - ledger/evidence/EV-ICPERF-a8080e.yaml
    - ledger/evidence/EV-ICPERF-10c5fc.yaml
    - ledger/goals/GOAL-DREG-001.yaml
  evidence_artifacts_note: >-
    The goal record is the load-bearing one: facts (1) and (2) of `reason` are
