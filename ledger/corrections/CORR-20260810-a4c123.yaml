correction:
  id: CORR-20260810-a4c123
  recorded_at: '2026-08-10'
  recorded_by: coordinator (GOAL-ENDO-001, BATCH-74ebef)
  type: independent_review_found_the_evidentiary_weight_narrower_than_the_execution_report_conveyed
  supersedes: []
  corrects:
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-74ebef/execution/EXP-ICINV-4d33aa-v3/execution_report.md
  - experiments/EXP-ICINV-4d33aa/amendments/v3.yaml
  record_type: run
  record_id: RUN-ICINV-849d1d
  field: >-
    the execution report's framing of "closest to blind" for p=2003 (§3b);
    the report's Deviations section (D-v3-1, D-v3-2) as a complete account
    of every departure from the frozen contract; and amendment v3.yaml's own
    non-vacuousness argument for change A7 (`v3-verification.py`) as a
    sufficient characterisation of the redesigned gate's discriminating
    power.
  prior_value: >-
    Amendment v3.yaml's `confirmatory_status_note` states p=2003 is "the
    closest this experiment has to" a genuinely blind prime. The execution
    report treats `RUN-ICINV-4bf6c8` as "a fresh Stage 3 measurement" and
    lists only two deviations (D-v3-1, a self-caught `KeyError`; D-v3-2, the
    amendment's candidate list omitting the short-id p=2003 records).
    Amendment v3's `v3-verification.py` establishes the redesigned CI-overlap
    check is not vacuous by probing that it still rejects `ratio=1.00` and
    `ratio=4.50` at `n=140`, and this Coordinator's own N10-v3 dispatch
    message described the run's `gate_passed: True` at p=6007 without further
    qualification.
  corrected_value: >-
    TWO INDEPENDENT REVIEWS (VALIDATOR, dispatched to re-derive every
    numbered check from raw artifacts; RED TEAM, dispatched to challenge the
    interpretation) EACH FOUND A MATERIAL GAP, NEITHER OF WHICH THIS
    COORDINATOR CAUGHT ON ITS OWN FIRST PASS. Both reports are committed in
    full at coordination/goals/GOAL-ENDO-001/batches/BATCH-74ebef/execution/EXP-ICINV-4d33aa-v3/{validation_report.md,redteam_report.md};
    this record states their findings, independently spot-checked by this
    Coordinator before being accepted (not taken on either report's word
    alone), and does not repeat their full derivations.

    FINDING 1 (Validator F1, MAJOR): "closest to blind" is not supportable.
    `RUN-ICINV-4bf6c8`'s thirteen `VR_pooled` rows, its `F_p`, and its
    `S_prime_positive` are BIT-FOR-BIT IDENTICAL to the pre-existing,
    version-1 run `RUN-ICINV-fg-primary-p2003` (executed 2026-08-07T17:44,
    two days before amendment v3 was even filed) -- this Coordinator
    independently re-confirmed the identity with a fresh `diff` of both
    runs' `baseline-reproduction.json` files, which differ ONLY in metadata
    fields the v3 code path adds (new CI-related keys, changed note text);
    every `variance_ratio_measured` value matches to full float precision.
    Worse: amendment v2.yaml's OWN `confirmatory_status_note`, filed
    2026-08-07 and cited in v3.yaml's own `refs`, already states "F_p =
    0.6923 at p = 2003 and p = 4001, PERSISTS at both" -- meaning p=2003's
    persistence result was disclosed in this campaign's own written record
    THREE DAYS before v3's "closest to blind" language was drafted. Zero of
    the three primes in the reported 2-1 majority represent information
    that was unknown before amendment v3 existed.

    FINDING 2 (Validator F2, MODERATE): every version-3 run's `manifest.yaml`
    self-identifies as `contract_version: 2` / `handoff_id:
    TASK-20260809-caa93e` (version 2's own values), because
    `harness/run_fullgroup.py`'s `HANDOFF_ID_V3`/`CONTRACT_VERSION_V3`
    constants are defined but never wired into the shared
    `write_run_package` function -- dead code. Independently confirmed by
    this Coordinator via `grep` on all five version-3 run manifests. Does
    NOT corrupt the terminal-state computation or the source-provenance
    check (both key off `code.commit`, captured live, not off the stale
    constant), but is a real, previously undisclosed deviation, and this
    campaign's own A9 audit methodology is built around trusting exactly
    this field for OTHER runs -- a future auditor trusting it here would
    misclassify all five version-3 runs as version-2 artifacts.

    FINDING 3 (Red Team, MAJOR): amendment v3's non-vacuousness check asked
    the wrong question. It confirmed the redesigned gate still rejects two
    arbitrary extreme ratios; it never computed the gate's FALSE-PASS RATE
    under a genuine null (true ratio = 1, i.e. NULL-B's own binomial null).
    This Coordinator independently re-derived the gate's exact acceptance
    region (closed form: linear in the observed ratio at fixed df, since
    the Wilson-Hilferty bounds do not depend on the observed statistic) and
    confirmed the Red Team's false-pass calculation via the regularized
    incomplete gamma function against `chi2(df)/df`: **44.3% at df=139
    (p=6007), 45.0% at df=137 (p=4001)** -- a 40-50x inflation over the
    ~1-2% false-pass rate of the literal `[1.3,3.6]` check it replaced.
    `gate_passed: True` at p=6007 therefore certifies "not statistically
    excludable from [1.3,3.6]", a standard a genuinely null object clears
    roughly half the time at this sample size -- not "consistent with
    reproducing [1.3,3.6]" in any strong sense. This does not mean the
    redesign was wrong to admit this run (see next paragraph), but it means
    the earlier characterisation of the redesign as "not vacuous, therefore
    adequate" understated how much discriminating power was traded away.

    FINDING 4 (Red Team, informative, not a defect): discarding p=6007
    entirely (the one leg carrying both the gate-engineering taint and the
    weak-gate admission) leaves p=2003 and p=4001 agreeing 2-for-2
    `PERSISTS` without it. The aggregate direction of `OUTCOME-C` does not
    depend on the weakly-admitted prime; if anything the redesign let in a
    DISSENTING vote, not a manufactured majority.

    FINDING 5 (Red Team, MAJOR, independently re-derived by this
    Coordinator with a fresh regression, not merely re-read): "density-
    independent" overstates what the raw data shows. Regressing each
    prime's pooled `VR` against `mean_density_3V_over_order` (Arm B,
    `RUN-ICINV-849d1d`'s own rows) gives R^2 = 0.50 (p=2003), 0.93 (p=4001),
    0.88 (p=6007) -- a substantial, consistent, positive density trend, NOT
    a flat line. The SAME trend is present in Arm A0's own already-committed
    baseline (R^2 = 0.83 at p=6007, 0.82 at p=4001 against the identical
    density variable), so this is not an artifact of anything version 3
    introduced -- it has been sitting in data this campaign has held since
    before EXP-ICINV-4d33aa existed. By contrast, this Coordinator computed
    how much of the SAME pooled excess the r-split explains, using the
    already-computed `VR_within/VR_pooled` ratio the contract's own S2 check
    reports: mean 1.0067 (p=2003), 0.9990 (p=4001), 0.9919 (p=6007) -- i.e.
    the r-split explains approximately 0% (noise-level, occasionally
    negative) of the pooled excess at every prime, while density explains
    50-93%. This is a genuinely new, quantitative, previously-undisclosed
    contrast, computed freshly for this correction from already-committed
    artifacts (zero new runs), and it names a specific, previously-unnamed
    candidate mechanism: `factor_base_fixed_size`'s deterministic
    "first-liftable-x" construction, not sampler coverage and not r.
  why_this_does_not_reverse_outcome_c_but_narrows_its_meaning: >-
    `terminal_state: OUTCOME-C` is mechanically correct -- both independent
    reviews confirmed it, and this Coordinator re-confirmed it a third time
    directly from `decision-rule-evaluation.json` before either review was
    dispatched. Nothing here disputes that the frozen decision rule, applied
    to its actual inputs, computed exactly this state. What is corrected is
    the SURROUNDING CHARACTERISATION: the run does not add fresh evidence
    beyond what the campaign already possessed (Finding 1), the admissibility
    gate that let it proceed is far weaker than described (Finding 3, though
    Finding 4 shows this does not flip the result's direction), and the
    "density-independent" framing this campaign has repeated since
    EV-ENDO-10109d is not supported by the campaign's own data (Finding 5).
  required_action:
  - >-
    Any future citation of `RUN-ICINV-849d1d`'s `OUTCOME-C` must state
    plainly that zero of the three primes represent a measurement taken
    after amendment v3's gate redesign that was not already knowable from
    records predating it.
  - >-
    A protocol_amendment (v4) to EXP-ICINV-4d33aa is required before any
    further dispatch under the CI-overlap SR3 gate: it must, at minimum,
    report the gate's own false-pass probability under NULL-B's true-null
    model alongside `gate_passed` at every row (the standing disclosure
    Finding 3 shows is missing), and should consider whether a tighter
    confidence level or an equivalence-test formulation (rather than an
    overlap test) restores more of the discriminating power the literal
    check had without reintroducing the [1.3,3.6]-vs-sampling-noise defect
    v3 was built to fix. Not drafted by this correction.
  - >-
    A scoped code fix to `harness/run_fullgroup.py:write_run_package` is
    required (wire `HANDOFF_ID_V3`/`CONTRACT_VERSION_V3`/`AMENDMENT_PATH_V3`
    through, or pass an explicit version parameter) before any further
    version-3 run is dispatched, so `manifest.yaml` self-identification is
    trustworthy again.
  - >-
    "Density-independent" must not be used to describe EV-ENDO-10109d's or
    this run's own finding without qualification going forward; "does not
    decay to 1 at high density" (which IS supported) is the accurate
    substitute. A free re-analysis (already performed in this correction)
    and a cheap follow-up experiment (one arm with a randomized, not
    first-liftable, factor-base construction) are named as this lane's next
    action in the accompanying Coordinator decision.
  - >-
    "Attack" / "strengthened" language inherited from the frozen contract's
    `state_4_OUTCOME_C_neither` block must not be quoted in any future
    record without an adjacent, explicit restatement that this is an attack
    on a hypothesis's own coverage mechanism, not a cryptographic attack,
    and that nothing here reduces the difficulty of any ECDLP instance.
