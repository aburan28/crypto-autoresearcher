    - item: 2
      what: the premise of RG-1 (e) that an escaped child neither execs nor reaches a frozen exit code
      records:
        - id: AMD-EXP-GFPN-05ff43-20260924-childend
          path: experiments/EXP-GFPN-05ff43/amendments/v2_addendum_childend.yaml
          locations:
            - lines: 315-320
              context: RG-1 (e) ("Such a child neither execs nor reaches a frozen os._exit")
            - lines: 558-567
              context: RGL-2 (names only the exit-code half as a DV-18 (h) closure item)
      prior_value: >-
        A created child that leaves the frozen child path by an exception
        neither execs nor reaches a frozen os._exit; RGL-2 makes the absence of
        SystemExit(97), (98), (99) on unwinding paths a closure item.
      corrected_value: >-
        Both halves hold on the repository's code as the review scanned it
        (review CJ-1 X1 268-285: the only exits 97, 98 and 99 are os._exit at
        v2_solver.py 196, 201, 208; X10 325-331: the only os.exec* calls are at
        v2_solver.py 204-205 on the child path). They rest on third-party code
        on the unwinding path (flint, numpy, cypari2 and its signal layer,
        yaml) and on interpreter shutdown, which the review did not read
        (282-285, 952-958); and RGL-2 names only the exit-code half as a
        closure item (OB-F, 893-895). The statement is a premise verified on
        repository code, not an unconditional fact.
      consequence: >-
        None on RFR-1 (no counterexample is named). The successor gapattr RH-5
        (a)-(c) adds the exec half and the live-child condition to the DV-18
        (h) closure and lists the third-party modules; RGL-6 states what stays
        unshown.
      evidence: review-report.yaml 268-285, 325-331, 893-895, 952-958.
    - item: 3
      what: the neutrality of the RG-1 callback under a signal
      records:
        - id: AMD-EXP-GFPN-05ff43-20260924-childend
          path: experiments/EXP-GFPN-05ff43/amendments/v2_addendum_childend.yaml
          locations:
            - lines: 330-336
              context: RG-1 (f) ("they change no ... order of its steps")
            - lines: 274-275
              context: RG-1 (a) ("It catches every exception its own code raises and records the type")
      prior_value: >-
        The callback and the counter change no argument of the frozen call and
        no order of its steps.
      corrected_value: >-
        That holds absent a signal delivered while the callback's bytecode
        runs. A Python-level signal handler that raises during the callback
        raises inside it; the callback catches the exception (RG-1 (a)), or
        CPython discards an exception escaping an at-fork callback as
        unraisable (recalled CPython behaviour), so a KeyboardInterrupt that
        without the callback would surface at v2_solver.py 181 in the parent
        (P-16: raise, FAIL) is consumed and the parent continues (review CJ-6,
        614-624; OB-C). Not a FAIL-OPEN (the child is recorded and its pair
        read); a control-flow change of the frozen parent that RG-1 (f) does
        not name.
      consequence: >-
        The successor gapattr RH-4 makes any exception the callback catches
        mark the call, so child_end is `undetermined` and the package FAILs.
      evidence: review-report.yaml 614-624, 874, 903-909, 918-923.
    - item: 4
      what: RG-4 (b) as the repair of FC-7, and its effect on ordinary outputs and on DV-18
      records:
        - id: AMD-EXP-GFPN-05ff43-20260924-childend
          path: experiments/EXP-GFPN-05ff43/amendments/v2_addendum_childend.yaml
          locations:
            - lines: 423-437
              context: RG-4 (b) attribution sentence and its parenthetical (FC-7; OB-6)
            - lines: 503-504
              context: RG-7 (i) (17) ("the RG-4 attribution on DV-18 (e) controls-a1 and on DV-18 (b) anchor-identity - no recorder gap")
        - id: DEC-20260924-844896
          path: ledger/decisions/DEC-20260924-844896.yaml
          locations:
            - lines: 633-640
              context: fail_closed_findings_ruled FC-7 ("REPAIRED in childend RG-4 ...")
            - lines: 673-676
              context: observations_ruled OB-6 ("under childend RG-4 they are attributed as that launch's stdout_path and stderr_path")
            - lines: 814
              context: named_defects G-6 ("Remedy - childend RG-4")
      prior_value: >-
        RG-4 (b) repairs FC-7 by attributing each file to its launch through
        stdout_path, stderr_path and argv, with a closed non-launch list, so
        that no ordinary output is a recorder gap and DV-18's development
        packages show none.
      corrected_value: >-
        As worded, RG-4 (b) attributes no child-job output: the build and
        raw-grid children write <out>.npz and <out>.meta.json, where out is
        named inside the spec file the argv names (v2_driver.py 92-107;
        v2_child.py 38-42, 100, 104), so these files are recorder gaps and
        cells m = 4, controls_a1, the gate packages and F-4 FAIL by design
        (review PB-2, 637-724); the attempt files the approved SE-3 / HR-3
        rule renames (r3_resolve.py 224-238) are recorder gaps too (PB-3,
        726-766); DV-18 (a), (b) and (e) STOP by construction (FC-A, 801-809),
        so RG-7 (i) (17)'s expectation cannot be met; and a non-ok callgrind
        child's <tag>.callgrind.out is attributed only under a reading of
        "argv names exactly" (FC-D, 829-838). The callgrind stdout and stderr
        files are attributed as OB-6 states; the out file is not.
      consequence: >-
        RFR-2 fails on PB-2 and PB-3 (DEC-20260924-61b22c). The successor
        gapattr RH-1 replaces the attribution sentence by positive clauses
        (spec-file outputs, renamed attempt files, the callgrind out file) and
        RH-6 (i) (18) replaces RG-7 (i) (17)'s expectation.
      evidence: review-report.yaml 541-597, 637-766, 800-838; v2_driver.py 92-147; v2_child.py 37-42, 96-104; r3_resolve.py 224-238 (read by DEC-20260924-61b22c).
