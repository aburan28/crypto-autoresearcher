  reason: 'SELF-REPORTED BY THE COORDINATOR THAT COMMITTED THEM, AFTER INDEPENDENT VALIDATION FINDING
    OBS-E3858F-1 (VAL-20260901-e3858f, TASK-20260901-e3858f) SURFACED IT. Two distinct defects, both this
    Coordinator''s, stated plainly:


    (1) PLACEHOLDER HASHES IN A DURABLE ARTIFACT. The archived receipt is the standalone, human-readable
    record of what an archive bound. Committing it with ''PENDING'' in every non-self slot makes that
    artifact carry no binding at all; the real digests existed only in dispatch_queue.json, which is DELIBERATELY
    never hash-pinned because it is a living state tracker. This is a REGRESSION AGAINST THIS GOAL''S
    OWN PRIOR PRACTICE: BATCH-286bcd''s receipts (e.g. TASK-20260901-a5374b) carry real digests at their
    archive commits. The 16 or 21 non-self digests were knowable BEFORE the commit -- only the receipt''s
    own hash is a genuine unclosable self-reference -- so the placeholders were avoidable, not necessary.


    (2) OVERWRITE INSTEAD OF SUPERSESSION. Filling those values in by editing the committed receipts violates
    AGENTS.md rule 2 (corrections supersede, never overwrite). It also makes each receipt''s bytes at
    HEAD differ from its bytes at its own archive commit, so anyone verifying a pin against HEAD rather
    than against the archived commit sees a mismatch.


    WHAT IS NOT WRONG, STATED SO THE DEFECT IS NOT OVERSTATED: the BINDING ITSELF IS SOUND. All 22 + 17
    = 39 authoritative path_sha256 values in dispatch_queue.json were independently re-verified for this
    correction against their own archive commits via `git show <commit>:<path>` -- 39 of 39 match, zero
    mismatches -- and tools/research_dispatch.py accepts both archives with all eleven gates passing.
    VAL-20260901-e3858f independently confirms all 17 snapshot pins verify byte-exactly at ee80ce456 and
    states the observation changes none of its four verdicts. No producer artifact, evidence record or
    research claim is affected.


    THIS IS F-VAL4c225b-1''S OWN DEFECT CLASS RECURRING INSIDE THE BATCH CONVENED TO REPAIR IT, which
    is the honest framing and the reason it is recorded here rather than quietly patched.'
