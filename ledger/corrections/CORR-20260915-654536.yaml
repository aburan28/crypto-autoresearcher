  id: CORR-20260915-654536
  recorded_at: '2026-09-15'
  recorded_by: coordinator
  goal_id: GOAL-ICPERF-e6b6a4
  batch_id: null
  batch_id_note: >-
    No batch. This is a disclosure written by the same session that authored
    the corrected record, committed on the research branch; it opens no lane
    and touches no dispatch queue.
  archived_by: null
  archived_by_note: >-
    Snapshot commit on the research branch. It changes no research status, so
    it needs no ledger archive of its own.

  record_type: candidate
  record_id: IDEA-20260915-9191ed
  corrects:
    - IDEA-20260915-9191ed

  nature: >-
    SELF-CORRECTION OF A FALSE FACTUAL PREMISE IN A COST ESTIMATE. The
    corrected record claims two of its three arms are nearly free because they
    reuse relation sets that the in-flight ICPERF batch already produces. That
    premise is false. It was caught during the /coordinate ranking pass on
    2026-09-15 (DEC-20260915-674299), where it was the stated reason
    IDEA-20260915-9191ed lost the top rank to IDEA-20260915-5c407a -- "on input
    availability, not taste". The ranking recorded the finding; this record is
    the correction the immutability rule requires, so a later reader of the
    IDEA does not re-inherit the false premise from the record itself.

  field: estimated_cost.note, and the same premise where it recurs in
    `mechanism` [M0] and `test_boundary.budget.new_decomposition_solves`

  prior_value: >-
    estimated_cost.note (lines 348-355): "Arms 0 and 2 consume NO new
    decomposition solves -- they reuse relation sets the ICPERF batch already
    produces -- which is why this is among the cheapest live proposals in the
    area." Supported in the record by budget line
    `new_decomposition_solves: 0    # arms 0 and 2 reuse existing relations`
    and by the mechanism's closing sentence that H is "a different reading of
    a matrix the ICPERF pipeline already produces".

  corrected_value: >-
    The ICPERF batch produces no such relation set, so arms 0 and 2 have no
    inputs and the "cheapest live proposal" conclusion does not follow from
    the stated reason. EXP-ICPERF-66fd51 (the contract BATCH-51e2aa is
    executing) is titled "PDP boundary row 1: every installed engine on
    Trimoska's 60 shipped S_4 Weil-descent instances (n,l) in
    {(15,5),(17,6),(19,6)}". Its declared metrics are per-instance SOLVER COST
    -- SAT conflicts, Groebner CPU seconds, basis size, maximal basis degree,
    unit-ideal flag -- on 60 INDEPENDENT point-decomposition instances spread
    across THREE DISTINCT (n,l) parameter cells. Each solved instance is one
    decomposition, but a relation hypergraph requires many relations over ONE
    SHARED factor base, in number exceeding |F|; 60 independent targets split
    across three cells is neither shared nor sufficient. The arms therefore
    need a relation-collection campaign that must be costed, not a free
    re-reading of an existing matrix.

  what_is_NOT_claimed_here: >-
    This record does NOT claim that no experiment in this program produces a
    usable relation set. A grep of experiments/*/specification.yaml finds
    relation-set, relation-store or relation-matrix language in several
    contracts, including EXP-RELN-* (GOAL-RELN-001, the factor-base
    decomposition probability audit) and several EXP-ECDLP-*; none of these
    were read for this record and none is asserted to be suitable. A stronger
    formulation considered and REJECTED as overreach was "no batch in this
    program has produced relation sets" -- that is not established, and
    asserting it would trade one unchecked premise for another. Whether an
    existing corpus can supply arms 0 and 2 is OPEN, and is the first thing a
    revision of this idea should check.

  reason: >-
    The false premise was mine, introduced when the record was authored, and
    it is load-bearing: it is the entire argument for the recommended_priority
    and for the record's claim to be the cheapest proposal in its area. Left
    uncorrected it would misprice the idea at every future selection point,
    which under the ECC priority rule is a selection this program makes often.
    Per AGENTS.md rule 2 a correction supersedes and never overwrites, so the
    IDEA record is untouched and both values stand side by side.

  effect_on_the_corrected_record:
    status_unchanged: >-
      IDEA-20260915-9191ed remains `status: proposed`, `novelty_status:
      unverified`. This correction is not a rejection and does not close it.
    what_survives: >-
      The substance is unaffected. The hypergraph framing, the argument that
      classical NFS filtering DEGENERATES on an (n+1)-uniform ECDLP relation
      hypergraph, the stratified factor base as the only live variant, the
      three numbered predictions and the degree-matched configuration-model
      null object all stand on their own and are untouched by this correction.
    what_must_be_redone_before_it_is_ranked_again: >-
      (1) Name a concrete relation-set source and verify it supplies relations
      over ONE shared factor base in number exceeding |F|, or (2) cost the
      relation-collection campaign the arms actually require and restate
      estimated_cost accordingly. Until one of those is done, the record's
      cost line is unsupported and `recommended_priority: medium-high` should
      not be read as costed.

  evidence_artifacts:
    - experiments/EXP-ICPERF-66fd51/specification.yaml
    - ledger/decisions/DEC-20260915-674299.yaml
    - ledger/ideas/IDEA-20260915-9191ed.yaml

  interpretation_limits:
    - >-
      This is a correction to a COST PREMISE, not mathematical evidence in
      either direction about the hypergraph framing, and it must never be
      cited as evidence against it.
    - >-
      The reading of EXP-ICPERF-66fd51 is from its frozen specification's
      title and declared metrics, not from its run outputs, which do not exist
      yet -- BATCH-51e2aa had not released TASK-20260913-6c5729 or
      TASK-20260915-5ba08b when this was written. If that contract is later
      amended additively to emit a shared-factor-base relation corpus, this
      correction is superseded by that amendment rather than by an edit here.
