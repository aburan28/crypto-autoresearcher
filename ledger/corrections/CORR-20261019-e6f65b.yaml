correction:
  id: CORR-20261019-e6f65b
  recorded_at: '2026-10-19'
  recorded_by: coordinator
  goal_id: GOAL-ECDLP-001
  record_type: experiment_specification
  record_id: EXP-ECDLP-502ae2
  corrects:
    - EXP-ECDLP-502ae2
    - experiments/EXP-ECDLP-502ae2/reports/run-20261015T1634Z/report.typ
    - DEC-20261015-ab6f23
  field: >-
    stated cause of the msolve 0.6.5 segmentation fault on the dense m = 2,
    L = 8 system, and the resulting "m = 2 out of scope" reasoning
  prior_value: >-
    The EXP-ECDLP-502ae2 specification (instrument.known_limits) says msolve
    0.6.5 segfaults on the dense m = 2, L = 8 system "(degree-256 univariates;
    likely an exponent-width limit)", so m = 2 is out of scope. The run report
    states the same cause as a fact. The review report and PR #2201 repeat that
    msolve cannot handle the m = 2, L = 8 system.
  actual_state: >-
    The cause was a guess and is wrong. msolve 0.6.5 segfaults on systems over
    primes with exactly 17 bits (2^16 < p < 2^17), independent of polynomial
    degree and of the number of variables. Reproduced on the same dense systems
    (EXP-ECDLP-8c41d7 AMD-03): p = 65551 (m = 4, L = 4), p = 70039 (m = 3, L = 3
    and m = 4, L = 3), and p = 66047 (the m = 2, L = 8 case, 17 bits). The same
    systems read fine over 15-bit (20023), 16-bit (60103), 19-bit (300007,
    262271) and 23-bit (5000087) primes. The m = 2, L = 8 prime is 66047.
  corrected_value: >-
    Keep every recorded EXP-ECDLP-502ae2 observation: no completed msolve
    result used a 17-bit prime (m = 3 used 10, 13, 16, 19 and 22 bits), so no
    reported value changes. Replace the explanation: the crash is a prime-size
    defect, and m = 2 is NOT out of scope for msolve in principle; it can be
    run with a prime outside 2^16..2^17 (a prime-selection change that needs
    its own protocol). The statements "degree-256 univariates" and "exponent-width
    limit" are withdrawn.
  reason: >-
    New evidence from the 17-bit-prime reproduction (EXP-ECDLP-8c41d7, run
    RUN-ECDLP-8c41d7-03 and AMD-03), found when the m = 4, L = 4 cell crashed.
  evidence_artifacts:
    - experiments/EXP-ECDLP-8c41d7/amendments/AMD-03.yaml
    - experiments/EXP-ECDLP-8c41d7/runs/RUN-ECDLP-8c41d7-03/raw-result.jsonl
  approved_by: coordinator
