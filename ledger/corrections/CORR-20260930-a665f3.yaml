correction:
  id: CORR-20260930-a665f3
  id_provenance: >-
    Minted with tools/allocate_id.py --next correction --date 20260930 and
    --check verified ("well-formed and free across the union"), 2026-09-30.
  recorded_at: '2026-09-30'
  authority: coordinator
  record_type: coordination
  record_type_note: >-
    The corrected fields are embedded handoff envelopes inside two dispatch
    queues under coordination/, not ledger records. No evidence, decision,
    hypothesis or knowledge record is corrected, and no research claim changes.
  record_id: >-
    Repair-snapshot handoffs TASK-20260929-8428ad, TASK-20260929-c0b8b3,
    TASK-20260929-a7f89b (GOAL-ICEX-001 BATCH-227e0d) and TASK-20260929-3f7b98,
    TASK-20260929-a68d0c (GOAL-RELN-001 BATCH-229ce4)
  corrected_record_path:
    - coordination/goals/GOAL-ICEX-001/batches/BATCH-227e0d/dispatch_queue.json
    - coordination/goals/GOAL-RELN-001/batches/BATCH-229ce4/dispatch_queue.json
  field: tasks[<id>].handoff.artifact_paths and tasks[<id>].handoff.archived_by
  prior_value: >-
    Each repair-snapshot handoff was copied from its batch's first snapshot
    card and still names that first snapshot's receipt as its artifact and
    that first task as archived_by. The ICEX cards name
    archives/TASK-20260929-d04f29/snapshot-receipt.json and
    archived_by TASK-20260929-d04f29. The RELN cards name
    archives/TASK-20260929-03d6bf/snapshot-receipt.json and
    archived_by TASK-20260929-03d6bf.
  corrected_value: >-
    For each listed task <id>, handoff.artifact_paths is
    [<batch>/archives/<id>/snapshot-receipt.json] and handoff.archived_by is
    <id>. These are the values already carried by the same task's top-level
    artifact_paths and write_scope.
  reason: >-
    Copy defect in the Coordinator's queue authoring, reported by Cursor
    Bugbot on PR #1471 (thread on BATCH-227e0d dispatch_queue.json lines
    382-386). The defect never took effect. Each task ran under its own
    top-level write_scope (<batch>/archives/<id>), wrote only its own
    snapshot-receipt.json, and left the earlier pinned receipts
    (TASK-20260929-d04f29, TASK-20260929-03d6bf) untouched. Those receipts
    still verify as content_at_commit under research_dispatch.py. The queue
    cards are left as committed, per AGENTS.md "Never edit a card to make a
    past dispatch look compliant", and this record supplies the correct
    values.
  forward_guidance: >-
    Any further repair snapshot on either batch takes its handoff
    artifact_paths and archived_by from its own task id, never from a copied
    card.
  asserts_nothing_about: the science
