  recorded_at: '2026-09-05'
  recorded_by: coordinator
  type: candidate_finding_confirmed_the_bivariate_qualifying_filter_is_mathematically_unsatisfiable_for_every_prime_not_merely_search_infeasible
  severity: >-
    high_this_retroactively_reclassifies_three_prior_resource_exhaustions_from_infrastructure_outcomes_into_a_correctly_understood_impossibility_no_scientific_conclusion_is_reversed_the_additive_forms_own_univariate_support_KN_FIND_edd62c_is_unaffected
  supersedes:
    - CORR-20260905-783157
  corrects:
    - ledger/hypotheses/H-MONO-dd666a.yaml
    - ledger/decisions/DEC-20260904-826703.yaml
    - ledger/goals/GOAL-MONO-001/goal.yaml

  what_this_confirms: >-
    CORR-20260905-783157's own finding_2 (there flagged explicitly as an
    unverified candidate) is now CONFIRMED by independent review
    (TASK-20260905-495a4c): for a curve with full rational 2-torsion
    (Z=3), the achievable (h_+,h_-) pairs are STRICTLY:
      p = 1 (mod 4): (h_+,h_-) in {(0,1),(0,3),(1,0),(3,0)}
      p = 3 (mod 4): (h_+,h_-) in {(0,0),(1,1)}
    Consequently, "h_+ >= 1 AND h_- >= 1 AND max(h_+,h_-) >= 2" -- the
    qualifying filter used throughout EXP-MONO-98abb2, EXP-MONO-8ec0e5
    (both runs), and EXP-MONO-d4840b -- is MATHEMATICALLY UNSATISFIABLE
    for every prime. This is not a rarity or a budget problem: the
    target object does not exist for any Z=3 curve at any prime. This
    fully and completely explains all three resource_exhaustions
    (RUN-MONO-8ec0e5-1, RUN-MONO-8ec0e5-2, RUN-MONO-d4840b-1), which
    together examined tens of millions of genuine Z=3 candidates and
    correctly found zero qualifying curves -- because none exist.

  independent_verification_summary: >-
    VALIDATOR (J1/J2/J3, all held): confirmed the Legendre-symbol sign
    relation chi(-x)=chi(-1)chi(x) from scratch; performed a BLIND case
    analysis (by hand AND by an independently-written script, before
    reading any Coordinator claim) of the exact, unmodified
    `h_pair_from_characters` code, arriving at IDENTICAL achievable sets;
    then EXHAUSTIVELY enumerated (via fresh curve arithmetic, no reused
    code) every single curve at p=101 (1650 curves) and p=103 (1717
    curves), confirming the OBSERVED sets match exactly, with zero
    counterexamples. Also refuted, via both a pigeonhole argument and
    the exhaustive scan, an overhedge in the Coordinator's own task
    instructions (that (0,0) might also be achievable at p=101) --
    independent review catching an imprecision in the REVIEW PLAN itself,
    not just the underlying claim.
    RED TEAM (J4/J5, plus a voluntary supplementary check): independently
    reimplemented `h_pair_from_characters` from scratch and exhaustively
    verified the achievable sets across 16 FURTHER primes (up to
    p=2003), zero counterexamples across 18 primes total between both
    reviewers. Symbolically proved (by hand and via sympy) that
    D_prod - D_sum, evaluated at the only achievable joint-nonzero point
    (h_+,h_-)=(1,1), is the IDENTICALLY ZERO polynomial in n_+, n_- (both
    coefficients vanish) -- confirming the EXP-MONO-98abb2 coincidence
    was forced by algebra, not an accident of that specific curve's own
    n_+, n_- values, and that this holds for ANY curve landing on (1,1),
    not just the one tested.

  consequence_1_the_interaction_term_is_permanently_untestable_via_z3_curves: >-
    Per Red Team's own J4(c): given the achievable (h_+,h_-) sets, NO
    curve with Z=3, at ANY prime, can ever provide a genuine test of
    whether the additive form D_sum=h_+n_-+h_-n_+ correctly combines a
    non-degenerate interaction between h_+ and h_- -- the only point
    where both are simultaneously nonzero, (1,1), is EXACTLY the point
    where D_sum and D_prod (and, per Red Team's own generalization, ANY
    rival formula agreeing with D_sum at h_+=h_-=1) coincide. This is a
    closed loop, not a rarity: no larger budget, no faster algorithm, no
    wider prime range could ever change this outcome for the Z=3
    stratum. The only named, plausible avenue to test the interaction
    term at all would be the non-split (Z<3) strata -- explicitly out of
    scope for every specification in this sub-thread to date, requiring
    a materially different construction (the classification code and
    the h_+/h_- definition are intrinsically Z=3-specific) and NOT
    pursued or committed to by this correction.

  consequence_2_does_not_affect_the_already_promoted_univariate_result: >-
    KN-FIND-edd62c (the h_-, h_+=0 slice of the additive form, promoted
    per DEC-20260904-e9df3f) is COMPLETELY UNAFFECTED: that promotion
    rests on curves with h_+=0 specifically (achievable and tested
    twice, at h_-=1 and h_-=3), which this finding does not touch. What
    is now understood differently is only the JOINT (h_+>=1 AND h_->=1)
    regime, which was always a SEPARATE, not-yet-promoted extension
    (H-MONO-1297d7, H-MONO-dd666a).

  next_action: >-
    See DEC-20260905-021e6e for the full disposition: H-MONO-dd666a's
    own status is corrected to reflect provable unsatisfiability (not
    search infeasibility); GOAL-MONO-001's own IMP-2 impediment is
    corrected in the same round (its own `clears_when` field shared this
    correction's identical defect, per Red Team's own flag); NO FURTHER
    SEARCH ATTEMPT of any kind should be dispatched for this specific
    joint regime. The Z<3 stratum is named as a genuinely distinct,
    wholly unsolved candidate future direction, not committed to here.

  reported_by: >-
    coordinator (CORR-20260905-783157's own flagged candidate),
    confirmed by validator and red-team (TASK-20260905-495a4c)
  acknowledged_by: coordinator
