        read as a malformed mapping and the enclosing document failed to load.
      unparseable_files:
        - ledger/evidence/EV-DS-003.yaml
        - ledger/decisions/DEC-20260801-003.yaml
        - >-
          coordination/goals/GOAL-ECDLP-001/batches/BATCH-020/reviews/TASK-20260731-047/red_team_report.yaml
      defective_items:
        - file: ledger/evidence/EV-DS-003.yaml
          sequence: boundaries
          item_opening_text: 'Toy tier only, one cell: p = 752627 ...'
        - file: ledger/evidence/EV-DS-003.yaml
          sequence: boundaries
          item_opening_text: >-
            Single unreplicated empirical_only set: reject_scoped is forbidden
            ...
        - file: ledger/decisions/DEC-20260801-003.yaml
          item_opening_text: 'PD-2 blob drift re-bound at EV-DS-003 O-9: ...'
        - file: ledger/decisions/DEC-20260801-003.yaml
          item_opening_text: >-
            Inference fallback: requested coordinator-orchestration-code, ...
        - file: >-
            coordination/goals/GOAL-ECDLP-001/batches/BATCH-020/reviews/TASK-20260731-047/red_team_report.yaml
          item_opening_text: >-
            matched-rho calibration: CTRL_NULL_RHO rho_calib_ratio_real and ...
