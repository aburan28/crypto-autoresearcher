        - >-
          tools/validate_ledger.py reported "invalid YAML: while scanning a
          simple key" for ledger/evidence/EV-DS-003.yaml and
          ledger/decisions/DEC-20260801-003.yaml.
  corrected_value:
    repair_kind: syntax_only
    repair_commit_relationship: >-
      NEW commit applied on top of the archive commit. Commit
      7ae492d7c8af5226f9209dc95b457e6718619cb2 is NOT rewritten, amended,
