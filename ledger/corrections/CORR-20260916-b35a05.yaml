correction:
  id: CORR-20260916-b35a05
  recorded_at: '2026-09-16'
  recorded_by: coordinator
  goal_id: GOAL-ICPERF-e6b6a4
  batch_id: BATCH-a33cda
  produced_by: top-level coordinator session, cursor/semaev-2015-audit-program-5b8b
  archived_by: TASK-20260916-9e4d21
  corrects:
    - experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/manifest.yaml (field `hypothesis_id`; superseded, NOT edited)
  found_by: >-
    The epoch 2 executor of TASK-20260915-4f4027, which reported it under `anomalies` in its
    execution report and set `hypothesis_id: null` in its own manifest with the contract's note
    quoted beside it. The Coordinator wrote the defective field and confirms the defect. Recorded
    here rather than left in a producer's anomaly list because the party that made the error is
    not the party best placed to have it filed away.
  nature: >-
    A RUN MANIFEST ATTACHED AN INSTRUMENT-ACCEPTANCE RUN TO A HYPOTHESIS ITS OWN CONTRACT
    DELIBERATELY DETACHED IT FROM.

    RUN-ICPERF-a4a24b's manifest.yaml, written by the Coordinator from the interrupted executor's
    on-disk artifacts, records `hypothesis_id: H-ICPERF-2c57cc` at line 4. The frozen contract
    EXP-ICPERF-e21835 records `hypothesis_id: null` with an explicit `hypothesis_id_note`:

      "DELIBERATELY NULL. This contract repairs and independently accepts an INSTRUMENT; it tests
      no prediction of any hypothesis and its outcome supports and refutes nothing. ... The
      hypothesis this instrument will later serve is H-ICPERF-2c57cc, through EXP-ICPERF-13f001;
      reading any result of THIS contract as evidence for or against H-ICPERF-2c57cc or
      H-ICPERF-cc4847 would be a category error."

    So the field does not merely disagree with the contract. It is the specific invitation to the
    specific category error the contract's author wrote that note to prevent, and it names the
    exact identifier the note names. H-ICPERF-2c57cc is the right identifier for a DIFFERENT
    field of a DIFFERENT experiment: the hypothesis this instrument will serve later, through
    EXP-ICPERF-13f001.
  why_it_matters_more_than_a_field_mismatch: >-
    A run manifest's `hypothesis_id` is what a downstream reader, a ledger query, or a future
    evidence record follows to decide what a run bears on. With H-ICPERF-2c57cc in that field, a
    reader assembling support for or against that hypothesis would collect an acceptance run whose
    every number is a property of a measuring instrument on one host -- A1's basis size, A3's peak
    RSS, A6's leaf-difference count -- none of which is evidence about summation polynomials,
    point decomposition cost, or any elliptic curve. The error direction is towards OVERSTATING
    what the campaign has established, which is why it is corrected promptly rather than noted.
  corrected_value:
    field: run.hypothesis_id
    as_written: H-ICPERF-2c57cc
    correct_value: null
    correct_value_basis: >-
      EXP-ICPERF-e21835's own `hypothesis_id: null` and its `hypothesis_id_note`. The contract is
      frozen and approved (DEC-20260915-428a17); the manifest is the record that departed from it,
      not the other way round.
    where_the_corrected_value_now_lives: >-
      experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/manifest-epoch2.yaml, which carries
      `hypothesis_id: null` with a `hypothesis_id_note` quoting the contract, and which supersedes
      manifest.yaml by reference.
  why_the_record_is_not_edited: >-
    manifest.yaml is committed at ecdd3bffd and is an immutable run artifact. Editing it would also
    invalidate the A6 evidence banked against the byte state of that commit, and it is hash-bound by
    the TASK-20260915-7da7f1 archive. It stays exactly as written and is superseded by reference.
  how_the_error_was_made: >-
    The Coordinator authored the manifest after the epoch 1 executor was interrupted by a model
    billing quota, working from artifacts rather than from the contract, and filled `hypothesis_id`
    from the batch's context -- where H-ICPERF-2c57cc is genuinely the campaign's active hypothesis
    and appears throughout the opening decision and the goal head. The contract's deliberate null
    is the one field in that neighbourhood that does NOT take the campaign's hypothesis, and the
    Coordinator did not re-read the contract while transcribing.
    The general shape is worth naming: a manifest reconstructed from artifacts inherits the
    reconstructor's context, and context is exactly what a frozen contract exists to override.
  forward_guidance:
    - >-
      A MANIFEST'S IDENTITY FIELDS ARE COPIED FROM THE CONTRACT, NEVER FROM THE BATCH. `experiment_id`,
      `hypothesis_id` and the acceptance references are the contract's to state. Where a contract
      records a DELIBERATE null with a note explaining it, that note is load-bearing and filling the
      field is a substantive change, not a completeness improvement.
    - >-
      WHEN A COORDINATOR RECONSTRUCTS A PRODUCER'S RECORD, THE RECONSTRUCTION IS REVIEWED AS THE
      COORDINATOR'S. This defect is exactly the custody weakness ADD1-e predicted R5 would object to,
      recorded before the reviewer ran and before this defect was known -- and it was found by a
      producer rather than by the reviewer or the author. That is a point in favour of keeping the
      objection.
  what_this_correction_does_not_assert:
    - >-
      NOT that any measurement in RUN-ICPERF-a4a24b is wrong. Every value in manifest.yaml other than
      this field was read from an artifact whose path is named beside it, and the four criteria that
      passed at epoch 1 are unaffected.
    - >-
      NOT that H-ICPERF-2c57cc is unaffected by anything ever. The instrument this run accepts will
      serve that hypothesis later, through EXP-ICPERF-13f001, which is drafted and sits at
      `approved_by: null`. What is corrected is the claim that THIS run bears on it.
    - >-
      NOT an acceptance verdict, and not a status change of any kind. The acceptance composition
      awaits both validator reports.
  citations:
    - claim: >-
        The contract's hypothesis_id is deliberately null and its note names reading any result of
        this contract as evidence about H-ICPERF-2c57cc or H-ICPERF-cc4847 a category error.
      source: experiments/EXP-ICPERF-e21835/specification.yaml lines 3-13
      provenance: internal
      verified_by: coordinator, this session, which read the frozen contract field directly.
    - claim: >-
        manifest.yaml line 4 records hypothesis_id H-ICPERF-2c57cc, and manifest-epoch2.yaml lines
        4-6 record null with the contract's note.
      source: experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/
      provenance: internal
      verified_by: coordinator, this session, by reading both committed manifests.
    - claim: The defect was found and reported by the epoch 2 executor.
      source: experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/manifest-epoch2.yaml (anomalies)
      provenance: internal
      verified_by: coordinator, this session.
