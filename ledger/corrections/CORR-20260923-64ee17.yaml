    - coordination/design/BATCH-5149d8/archives/TASK-20260916-89f8c7/snapshot.json
    - EXP-AUXIN-7e2e3d
  field: >-
    SEVEN self-descriptions of one run record, listed as items C1-C7 below.
    They are one correction and not seven because they share one record, one
    review round, one remedy (the run is not citable as evidence; a re-run under
    an amended protocol is the repair, DEC-20260923-ce06a6) and one composition.

  items:
    - id: C1
      field: orders.json / e_table.json / factorizations.json row brainpoolP384r1 -- the integer r and its r_pin_source label
      prior_value: >-
        r_hex 8CB91E82A3386D280F5D6F7E50E641DF152F7109ED5456B412B1DA197FB71123ACD3A729901D1A71874700133107EC53,
        r_pin_source "RFC 5639 brainpoolP384r1 order".
      corrected_value: >-
        That integer is RFC 5639 section 3.6 brainpoolP384r1 "p", the FIELD
        PRIME (inputs/SAFECURVES-20260825/specs/rfc5639.txt lines 683-684). The
        base-point order "q" is
        8CB91E82A3386D280F5D6F7E50E641DF152F7109ED5456B31F166E6CAC0425A7CF3AB6AF6B7FC3103B883202E9046565
        (lines 698-699). The label is false. Every number on the row -- both
        branch factorizations, the E_bound and its minimizing d -- describes
        p - 1 and p + 1, not q - 1 and q + 1. Under the specification's
        invalidation_rules ("Using a field prime as r => invalid_measurement")
        the ROW IS VOID: not negative, not inert, not escalating, not a bound on
        anything about brainpoolP384r1. The run's r-value sha256_commitment
        (8f08ab89...) commits to the field-prime value. The same wrong literal
        sits in driver.py CURVE_PINS at code commit 846a4e07 and in the already
        void RUN-AUXIN-6117d3; the prior review round did not flag it. The
        red team's diagnostic D1c on the true q is a REVIEW DIAGNOSTIC and fills
        no census row.
      found_by: >-
        TASK-20260922-ba2fac (J1 owner; VAL-20260923-d1a41c J1, pinned from the
        primary text before reading orders.json) and, independently,
        TASK-20260922-0e10d1 (RT-20260923-ca6b7c cross_joint_finding_row_validity,
        exposed by a literature cross-check against Jacobson-Kushwaha 2020).
    - id: C2
      field: which text of AMD-EXP-AUXIN-7e2e3d-20260916-bands governs RUN-AUXIN-fd1edc
      prior_value: >-
        Implied by the file at HEAD under the amendment id:
        experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260916-bands.yaml, sha256
        8dcd725a316ab61c216dacba3b2575c86fb7830a0941316f74e7bb3b9f339372
        (commit bef8ce95, committed 09:51:02Z on 2026-09-16), with q-search
        starts 2^52 / 2^50 and populated supersedes_fields.
      corrected_value: >-
        The run was launched under the FIRST version (commit ab103bfb, 09:37:56Z),
        whose sha256 179ea99bb454b5375985c8bba4b8a1e2814a3f2d198086dd9b0724ff2279b564
        is the amendment_sha256 bound in the verifier-bound
        implementation/trial-plan.json (written 09:43:02Z). The second version
        REWROTE THE AMENDMENT IN PLACE under the same id about eight minutes
        after the controls were constructed (09:43:12Z-09:43:19Z). Its commit
        message states it was written so the producer task "can meet its
        completion gate without an unauthorized construction". It neither
        describes nor authorizes the controls the run built (C3). An in-place
        rewrite of a frozen protocol text is an evidence-integrity failure in
        the sense of the specification's invalidation_rules ("Overwriting this
        specification or a prior run receipt") and of CLAUDE.md ("Changing a
        frozen scientific protocol uses an additive amendment; never rewrite
        historical records"). Both versions stay in git history; neither is
        edited or restored here. Any later record that cites the amendment names
        the version by commit and hash.
      found_by: TASK-20260922-ba2fac (VAL-20260923-d1a41c J3 chronology, J4 (a)).
    - id: C3
      field: controls_receipt.json -- how the planted and safe-prime control integers were constructed
      prior_value: >-
        Implied: constructed from their seeds (2026091301, 2026091302) by the
        amended recipe, with only the even-k deviation declared in
        execution-report protocol_deviations.
      corrected_value: >-
        Constructed by an UNDECLARED driver recipe: search start 2^62 + (seed mod
        2^20), a choice in driver.py whose own comments give the reason as
        margin inside the bands. No version of the amendment contains it. Under
        the version the run was launched under (C2) the planted control is not
        constructible inside its [104, 128]-bit window, and the safe-prime
        control has no start rule at its size. The construction IS
        deterministic from the seeds under the driver's recipe (the validator
        reproduced both integers and both trial counts exactly), and every
        numeric gate recomputes and passes; controls built by the second
        version's literal text would also pass (a review diagnostic, not a
        substitute control). Under the frozen plan's composition key J3_breaks
        these controls are INADMISSIBLE, so the census has no admissible
        controls. No control exercises the r + 1 branch at a known answer.
      found_by: TASK-20260922-ba2fac (VAL-20260923-d1a41c J3).
    - id: C4
      field: orders.json orders_json_sha256 and the stdout line "orders.json file sha256"
      prior_value: be181bea21776962cf644685c1e0dc736ad8d859e410a475c14d668ac4c4c38d, presented as the hash of orders.json committed before factoring.
      corrected_value: >-
        That is the hash of a DELETED pre-image: stage0_pin writes the file,
        hashes it, unlinks it and rewrites it with the hash inserted (the
        validator reconstructed the pre-image exactly). The committed orders.json
        hashes to 5f0540d39a48089c42915693eb213cd85d1282b29df6fa844d03ca0eb800b291.
        The launch gate's "hash-committed before any factoring" therefore binds
        bytes that are not the committed file. The r-value sha256_commitment is
        unaffected.
      found_by: TASK-20260922-ba2fac (VAL-20260923-d1a41c J4 (c)).
    - id: C5
      field: manifest.yaml factoring_seconds_per_integer_cap and the protocol_deviation "deep_factor_attempt_capped_at_300.0s_and_bit_cap_260"
      prior_value: >-
        factoring_seconds_per_integer_cap 3600.0; deviation names a 300 s deep
        cap and a 260-bit cap.
      corrected_value: >-
        The effective per-integer budget was 360 s (min(3600, 300 + 60)), and a
        deep attempt was made only on cofactors of at most 260 bits. Seven of the
        eight unfactored branches (cofactors of 302-488 bits on NIST-P-384,
        NIST-P-521 and the void brainpoolP384r1 row) received NO deep attempt:
        only sympy.factorint(n, limit=10**7), 50-86 s each, 1.4-2.4 % of the
        frozen 3600 s. Only Ed25519-L r - 1 (245 bits) got a deep attempt,
        stopped at 321.1 s. Every E_bound row is therefore "the budget was not
        used", not "the budget was spent". An upper bound stays honest, so this
        is not a validity defect of those values; it is a disclosure defect and
        a resource limit, never negative evidence. (The red team's GMP-ECM/PARI
        diagnostic D1 split four r - 1 cofactors in 9-90 s; those are review
        diagnostics and replace no census value.)
      found_by: TASK-20260922-ba2fac (VAL-20260923-d1a41c J2 (vi), J4 (iv)).
    - id: C6
      field: the custody claim of snapshot TASK-20260916-89f8c7 over the run package ("Admissible for independent escalate review")
      prior_value: >-
        snapshot.json lists run_artifacts_sha256 for 14 run files and
        source_sha256 for implementation modules; its scope sentence reads as
        custody of the package.
      corrected_value: >-
        All 14 run files DO match the recorded hashes (the bytes hold). But
        tools/research_dispatch.py contains no reference to run_artifacts_sha256
        or source_sha256; its content_first verification binds only the queue's
        path_sha256 (implementation/trial-plan.json and snapshot.json), read from
        HEAD. So the run files and implementation modules are hash-RECORDED, not
        verifier-BOUND. The bound snapshot.json value is the version rewritten
        after the fact by commit 933458f7, not the bytes at the snapshot commit
        845a8e84, and the producing queue's archive record_ids omit
        RUN-AUXIN-fd1edc. Under plan key J4_breaks no evidence record may cite
        this run until a superseding snapshot binds the run files (and the
        recoverable implementation) by path_sha256. The implementation is
        recoverable (trial-plan source_sha256 plus four stdout fingerprints);
        what was dirty at code.commit 846a4e07 is not on record.
      found_by: >-
        TASK-20260922-ba2fac (VAL-20260923-d1a41c J4 (ii), (iii)); the absence of
        both field names in research_dispatch.py was also confirmed by the
        dispatching session before staging (provenance note, not a review
        finding).
    - id: C7
      field: factorizations.json primality_certificates method strings and the contract's "BPSW plus a second check"
      prior_value: '"sympy.isprime (BPSW / deterministic Miller-Rabin for this size)" on every factor, both arithmetic paths.'
      corrected_value: >-
        For every factor above 2^64 the producer's verdict is a PROBABLE-PRIME
        (BPSW) verdict, which covers all six complete-lattice rows and Ed25519-L
        r + 1. The "second check" is a second call to the same sympy.isprime, so
        it is not independent. Only the three E_bound rows, whose reported primes
        all lie below 2^64, carry definitive verdicts. Review re-proof, recorded
        at its actual strength: every one of the 83 distinct reported primes was
        proven by FLINT 3.6.0 fmpz_is_prime, a LIBRARY verdict with no exported
        certificate (TASK-20260922-ba2fac). For NIST-P-256 and brainpoolP256r1,
        both branches, every prime carries an exported Pocklington or ECPP
        certificate checked by a pure-Python verifier that shares no code with
        any library (TASK-20260922-09522c). Wording for any record citing these
        values: "probable prime (BPSW) as produced; library-proven by FLINT on
        review", and "checkable certificate" only for the two J8 curves.
      found_by: TASK-20260922-ba2fac (VAL-20260923-d1a41c J2 (ii)); TASK-20260922-09522c (J8 certificates).

  reason: >-
    REVIEW-AUXIN-20260922-fd1edc was frozen before any reviewer ran, with
    composition keys stating what each joint's break does. Its validator broke
    all four validity joints, every one on an instrument, pin or provenance
    defect. DEC-20260923-ce06a6 composes that result, and this record puts the
    corrected self-descriptions beside the originals so that no later reader
    takes the run package's own statements at face value.

  what_is_NOT_corrected:
    - >-
      NO ARITHMETIC VALUE IS WITHDRAWN AS WRONG. All 20 branch products,
      divisor counts, minimizers and exponents were reproduced to at least
      2.45e-80 by the validator and to 2.4e-80 by the red team, each with its
      own enumeration and arithmetic library. The blind re-derivation matched
      NIST-P-256 and brainpoolP256r1 on exact factorization multisets,
      minimizers and exponents to at least 59 significant digits. That
      correctness does not make the run CITABLE; C3 and C6 decide that.
    - The run directory, both amendment versions, the snapshot, the specification and the implementation are not edited, restored or deleted.
    - RUN-AUXIN-6117d3 stays void; nothing here rehabilitates it.
    - No hypothesis, experiment, question or goal status moves on this record.

  evidence_artifacts:
