# (pins, governing protocol text, control construction, self-hashes, factoring
# budget, binding, certificate wording) versus what the review round
# REVIEW-AUXIN-20260922-fd1edc established.
#
# WHAT THIS CORRECTS: provenance and instrument statements of one run record.
# It withdraws no arithmetic value as wrong -- every reported product,
# factorization and exponent was reproduced by independent reviewers -- and it
# asserts nothing mathematical in either direction. One row is VOID because it
# was computed on the wrong integer. Under AGENTS.md core rule 5 none of this is
# negative evidence about any curve.
