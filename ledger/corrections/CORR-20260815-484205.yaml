correction:
  id: CORR-20260815-484205
  recorded_at: '2026-08-15'
  type: archival_metadata_correction
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-a723af
  corrects_task: TASK-20260815-a943bf
  corrects_commit: f64b0841a305e18cfde82bd9da5d4aeb270adf22
  supersedes_nothing_substantive: true
  what_was_wrong: 'The BATCH-a723af ledger archive commit f64b0841 names six of the seven record
    IDs its archive block declares and omits EXP-SYC-75f7d2 - the static successor the batch exists
    to dispose. tools/research_dispatch.py requires an archive commit message to name its task id
    and every declared record id, and that requirement is deliberate: the comment at the content_first
    branch states that a real reachable commit, its declared parent, and the archival message IDs
    all remain mandatory.'
  who_erred: The dispatching session, when drafting the commit message. Not the authoring Coordinator
    TASK-20260815-a943bf, whose four records and receipt were correct and complete.
  why_not_repaired_by_rewrite: f64b0841 is pushed and carries three immutable ledger records (EV-ECDLP-cb151c,
    DEC-20260815-5d8044 and the BATCH-a723af checkpoint). CLAUDE.md forbids rewriting history over
    pushed run records, and AGENTS.md rule 2 requires corrections to supersede rather than overwrite.
    Amending the message would have been a force-push over committed ledger state to satisfy a checker,
    which is precisely the shortcut the rule exists to prevent.
  remedy: A superseding archival commit carries this correction record and a message naming the
    task id and all seven declared record ids. Its tree contains all eight archived paths at byte-identical
    hashes, so the content-first binding CLAUDE.md requires verifies against it unchanged. The dispatch
    queue's archive.commit_sha for TASK-20260815-a943bf is repointed to that commit; f64b0841 remains
    reachable, unmodified, and is the commit that actually introduced the three ledger records.
  substantive_effect: NONE. No record content changes. No hypothesis, experiment or goal status
    moves. No evidence is promoted, no claim tier moves, no cap is raised. The dual-REVISE disposition,
    every finding and every disclosed residual stand exactly as archived.
  related_defect_same_class: 'This is the second archival-metadata defect by the dispatching session
    in this batch. The first, raised as validator OBS-V1 and recorded in EV-ECDLP-cb151c, is the
    snapshot receipt at dd84e57d retaining path_sha256_state EMPTY_BY_CONSTRUCTION while carrying
    real hashes. Both are conservative, non-blocking and metadata-only; both are recorded rather
    than edited. Common cause: the dispatching session performs the mechanical half of archive tasks
    because the Coordinator role has no command surface, and that half has had no independent check.'
  prevention: Before committing an archive, assert mechanically that the drafted message contains
    the task id and every declared record id, and that any receipt state fields match the data actually
    filled.
  recorded_by: dispatching session (launch-research-harness)
