correction:
  id: CORR-20260806-d86487
  recorded_at: '2026-08-06'
  recorded_by: coordinator
  goal_id: GOAL-MLKEM-003
  kind: parallel_execution_collision
  supersedes: null
  supersedes_note: >-
    This correction SUPERSEDES NOTHING and DELETES NOTHING. Both executions'
    records are immutable and both remain in the repository. It records what
    collided, which line is authoritative for future work, and on whose
    authority.

  what_happened: >-
    Two independent executions of GOAL-MLKEM-003 ran in parallel and diverged.
    The execution on `main` ran its own BATCH-007 through BATCH-012 and CLOSED
    the goal with status `closed_at_budget`, its stated reason being the campaign
    budget's `maximum_batches: 12`. The execution on
    `claude/harness-findings-repo-yyzt1x` ran a DIFFERENT BATCH-007 through
    BATCH-012 and continued through BATCH-017, remaining `active`. The two lines
    share batch identifiers 007 through 012 while carrying different content
    under them, so the identifiers no longer denote a single object.

  how_it_was_discovered: >-
    By `git merge origin/main` at the start of BATCH-018, performed under the
    coordinate-research-goal skill's requirement to merge main before each batch.
    The merge raised eight conflicting paths, every one a GOAL-MLKEM-003
    artifact. The skill directs that a conflicting merge must NOT be resolved by
    picking a side, so the merge was aborted and the divergence reported before
    anything was written.

  colliding_paths:
    - ledger/goals/GOAL-MLKEM-003.yaml
    - ledger/evidence/EV-MLKEM-019.yaml
    - ledger/decisions/DEC-20260802-359eca.yaml
    - coordination/goals/GOAL-MLKEM-003/batches/BATCH-009/dispatch_queue.json
    - coordination/goals/GOAL-MLKEM-003/batches/BATCH-009/archives/TASK-20260802-43e5e4/ledger_commit_receipt.json
    - coordination/goals/GOAL-MLKEM-003/batches/BATCH-010/dispatch_queue.json
    - coordination/goals/GOAL-MLKEM-003/batches/BATCH-011/dispatch_queue.json
    - coordination/goals/GOAL-MLKEM-003/batches/BATCH-012/dispatch_queue.json

  resolution: >-
    The user, who has directed this campaign throughout the session, decided that
    `claude/harness-findings-repo-yyzt1x` is AUTHORITATIVE for GOAL-MLKEM-003.
    Every colliding path was restored byte-for-byte from the pre-merge tip
    4e71e8de81694fb1407d0c98975c57d6ba33b52a and verified identical to it before
    the merge commit was written; all non-colliding content from main was taken.
    The worktree was swept for conflict markers and for unmerged entries, both
    clear. Merge commit 578de859d.

  why_this_line: >-
    NOT because this line is longer or newer. Because main's stated closure
    reason is the exact condition the user lifted. Main closed on
    `campaign_budget_maximum_batches_exhausted` with `maximum_batches: 12`; the
    user removed budget limits for this campaign, recorded on this branch as
    DEC-20260802-0c6eb4. Main's execution never received that instruction and
    closed correctly under the budget it knew about. The closure is superseded by
    the instruction, not by the other execution's length. Recorded separately as
    DEC-20260806-884ec2.

  what_is_NOT_claimed:
    - >-
      Main's records are NOT wrong, NOT withdrawn, and NOT deleted. Main's
      BATCH-007..012 remain a valid parallel execution of the same questions and
      remain in the repository and in main's history.
    - >-
      Neither execution's findings are corroborated by the other. The two lines
      ran different tasks under colliding identifiers; agreement between them has
      NOT been checked and must not be assumed or asserted anywhere.
    - >-
      No mathematical claim of either line changes because of this correction.
      This is a bookkeeping and authority record only.

  precedent: >-
    CORR-20260802-d8ba0e recorded the same failure mode at BATCH-007, where the
    user chose main as authoritative and this branch's work was preserved as a
    replication under
    coordination/goals/GOAL-MLKEM-003/batches/BATCH-007/replication-claude-yyzt1x/.
    That precedent points the other way on authority, and the difference is not
    inconsistency: at BATCH-007 there was no user instruction distinguishing the
    lines, and here there is one.

  standing_defect_this_exposes: >-
    The harness still has NO CLAIM OR LEASE on a dispatched goal or batch. Two
    sessions can take the same GOAL-* record and mint the same BATCH-NNN
    identifiers for different work, and nothing detects it until a merge. Random
    6-hex identifiers (KN-FIND-030, tools/allocate_id.py) would NOT have
    prevented this: the collision is in the WORK, not in the token. This is the
    second occurrence in one campaign. It is recorded here as an open harness
    defect, not fixed, because fixing it is a harness change and not a research
    result.

  merged_tree_validation: >-
    tools/validate_ledger.py falls from 119 errors to 56 across the merge, main
    carrying fixes for legacy ECDLP-era records. Six of the remaining errors name
    ledger/evidence/EV-MLKEM-4a9cfe.yaml, which belongs to GOAL-MLKEM-004, came
    from main, and is schema-noncompliant on main itself; it is another session's
    immutable record and is deliberately left untouched. GOAL-MLKEM-003
    contributes zero errors. tools/check_merge_hygiene.py reports two unparseable
    specifications, EXP-P13-NC2b and EXP-P13-NC2d, both from main.

  references:
    - GOAL-MLKEM-003
    - DEC-20260806-884ec2
    - DEC-20260802-0c6eb4
    - CORR-20260802-d8ba0e
    - KN-FIND-030
    - EV-MLKEM-019
    - DEC-20260802-359eca
