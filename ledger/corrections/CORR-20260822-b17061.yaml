correction:
  id: CORR-20260822-b17061
  id_minted_by: >-
    python3 tools/allocate_id.py --next correction --date 20260822, verified
    free with --check before use (driving Coordinator session, 2026-08-22).
  recorded_at: '2026-08-22'
  recorded_by: >-
    Driving Coordinator session (OpenCode harness session on
    /Volumes/SSD990/crypto-autoresearcher, branch goal-md5-001-batch6-20260822,
    worktree /Volumes/SSD990/llm/tmp/opencode/md5-batch6). Session model per
    the runtime; this session held shell access and performed the merge, the
    adjudication recorded here, and the commit it is filed in.
  kind: merge_conflict_resolution
  supersedes: >-
    Nothing by content. This record documents a MERGE RESOLUTION under
    AGENTS.md "Durable research commits" (sync conflicts inside ledger records
    are resolved by a new superseding record under a new id, never by an edit
    that picks one side), filed in the same commit as the resolved tree.
  context: >-
    The branch goal-md5-001-batch6-20260822 (created 2026-08-22 from
    a8835beed, the head of the PR #505 branch md5-001-927ab5-archive-20260819,
    18 commits ahead of origin/main at the time) merged origin/main at
    3911cb942 (62 commits) before opening GOAL-MD5-001 batch 6
    (BATCH-ebac02). The merge auto-merged all files except two, which
    conflicted: ledger/goals/GOAL-MD5-001.yaml (two content hunks) and
    tests/test_harness.py (one content hunk).
  conflicts:
    - path: ledger/goals/GOAL-MD5-001.yaml
      sides:
        ours: >-
          a8835beed (PR #505 branch): the batch-4-fork state. status: paused;
          current_batch_id: null; latest_verified_commit: 47768b80333e0234e93a9a
          db4f5e9a16365f1d39 (lineage A BATCH-04272f closing ledger archive,
          TASK-20260821-5b74dc); latest_verified_commit_note adjudicating the
          fork in DEC-20260822-d0b1d3 and recording the pre-registered budget
          stop (DEC-20260821-ddaa33) at 18000 s cumulative DECLARED, with
          resume conditioned on user budget authorization; 236 lines total.
        theirs: >-
          3911cb942 (origin/main): the batch-5-closed state. status: active;
          current_batch_id: BATCH-7215fa; latest_verified_commit:
          PENDING_POST_COMMIT_TASK_20260821_6ce8a8 (sentinel left by the no-
          shell closing subagent); batch_7215fa_closing_refs block; the full
          batch-5 result text (GATE-PO2 passed, CTL-PO5(b) failed at 8 raw
          candidates against a declared ceiling of 4, halt downstream);
          next_action directing batch 6 to open only after user authorization
          of a total_wall_clock_seconds amendment, with RC-1+RC-4 as phase 1;
          478 lines total.
      resolution: >-
        COMPOSED STATE, NOT A SIDE PICK. The composed head (filed in this
        commit) takes the theirs side as the structural base (it is the
        further-advanced record: it contains batch_7215fa_closing_refs and the
        full batch-5 result text that the ours side cannot contain, because
        batch 5 ran only on the main lineage after the fork), and carries over
        the ours side's substantive content that theirs does not have: the
        fork adjudication (DEC-20260822-d0b1d3), the lineage A close
        (DEC-20260821-117817, archive 47768b803) and the lineage B archive sha
        (9ca1d8054), and the batch-af29f6 queue discrepancy that both sides
        carry forward. The composed fields: status active (the pause is
        SUPERSEDED, not ignored -- its resume condition, user budget
        authorization, is now satisfied and recorded in DEC-20260822-85784e,
        so the pause's own terms release it); current_batch_id BATCH-ebac02
        with a current_batch_note naming both lineages' closures and the
        opening decision; latest_verified_commit d54afa5f8, MEASURED in this
        pass by `git log --oneline origin/main --
        ledger/decisions/DEC-20260822-40bf14.yaml`, which RESOLVES the
        PENDING_POST_COMMIT sentinel the theirs side left dangling;
        campaign_budget.total_wall_clock_seconds 18000 per the user
        authorization recorded in DEC-20260822-85784e (the theirs-side value
        10800 is carried in total_wall_clock_history_20260822); next_action
        replaced by the post-opening single ready task (TASK-20260822-767bb1)
        with an explicit supersession note, while the authorization-trigger
        analysis and the batch-5 result/citation text are RETAINED.
      nothing_discarded: >-
        No substantive content of either side was dropped. The only ours-side
        text not verbatim carried is the paused-state framing ("THE GOAL IS
        PAUSED at the pre-registered budget stop ... NO BATCH-5 OPENING IS
        PERMITTED BEFORE USER BUDGET AUTHORIZATION ... RESUME ACTION ..."),
        which is superseded in fact: its precondition (user authorization) is
        met and the batch-5 it gated never happened on that branch because
        batch 5 ran on the main lineage; the underlying budget figures it
        recorded (21990 s combined declared across the fork's two batch-4
        lineages; ~11000 s actual through batch 4) remain of record in
        DEC-20260822-d0b1d3 and DEC-20260821-1215e5 F-9, which this record
        does not restate.
    - path: tests/test_harness.py
      sides: >-
        Single hunk: ours adds nothing at that position; theirs adds the
        additive test block for harness/run_md4_ceiling.py and
        harness/run_md4_ceiling_v2.py (RFC 1320 vectors, HEUR-H2 backward-
        inversion fixture, caveat_refs manifest checks) from the main lineage's
        batch 4/5 work.
      resolution: >-
        Took the theirs side (union; the hunk was one-sided). No code content
        of either side discarded. The merged file's new tests exercise
        harness modules that exist in the merged tree (harness/ came over with
        the merge).
    - path: (silent) 109 committed records present on origin/main, absent from the merge result
      sides: >-
        NOT a two-sided content conflict. The git merge accepted 109 deletions
        silently under delete/unchanged semantics: every one of the 109 paths
        exists in the merge base (76b860c1) and in origin/main (3911cb942) with
        UNCHANGED bytes, and none of the 18 commits on this branch modified or
        deliberately deleted any of them. The absence on our side is a
        topology artifact of the batch-4 fork: our lineage's history carries a
        single-parent "merge" commit (3b342d3c5, "Merge origin/main into
        codex/reconcile-ecdlp-b30", one parent, no actual merge of main's
        tree) whose tree predates and lacks lineage B's batch-4 records, and a
        later merge into this branch accepted the resulting deletion set
        silently. The 109 paths are, in full: the complete
        coordination/goals/GOAL-MD5-001/batches/BATCH-af29f6/ directory (batch
        4 lineage B's control plane, inputs, reviews, run directories,
        archives), the two lineage-B ledger records
        ledger/evidence/EV-MDFIVE-ab007d.yaml and
        ledger/hypotheses/H-MDFIVE-bf7767.yaml, four
        coordination/events/main/*.yaml files, 34 lineage-B
        ledger/proposals/IDEA-20260821-*.yaml records, 8
        ledger/handoffs/TASK-20260821-*.yaml envelopes, 4
        ledger/decisions/DEC-*.yaml decisions (DEC-20260819-3e25ef,
        DEC-20260821-1215e5, DEC-20260821-5ab6a1, DEC-20260821-b1a7b4),
        experiments/EXP-MDFIVE-88f7d1/specification.yaml, and
        harness/run_md4_ceiling.py. Count: 55 + 34 + 8 + 4 + 4 + 4 = 109.
        Every one of the 109 was verified byte-identical between the merge
        base and origin/main before restoration (blob-hash comparison, 109
        checked, 0 differing).
      resolution: >-
        ALL 109 RESTORED from origin/main (git checkout 3911cb942 -- <paths>),
        byte-identical to the committed state. Rationale: (1) origin/main is
        the committed authority and its records were never superseded,
        retracted, or moved; (2) results are immutable records and superseded
        material is never deleted (AGENTS.md core rules 4 and the
        knowledge-retrieval policy), and no record-owning task on either
        lineage ever deleted them; (3) committed records on BOTH lineages
        reference them -- tools/validate_ledger.py reported four "decision
        references unknown target" errors (DEC-20260821-84a8f1 and
        DEC-20260822-d0b1d3 citing EV-MDFIVE-ab007d and H-MDFIVE-bf7767) in
        the pre-restore merge tree, and all four cleared after the restore,
        which is the mechanical confirmation that the tree is now consistent
        with its own citations. No bytes were altered; no path was dropped.
