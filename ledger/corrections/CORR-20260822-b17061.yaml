      remains the committed record of it. This record therefore carries the
      correction FORWARD BY REFERENCE rather than reconstructing a file whose
      bytes no committed record contains; no file is fabricated. The
      underlying field edit it concerns is verified applied:
      ledger/hypotheses/H-MDFIVE-0ca596.yaml line 1117 carries
      `status: weakened` on origin/main.
    - >-
      The batch-5 closing ledger receipt
      (coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/archives/
      TASK-20260821-6ce8a8/ledger-receipt.json) still carries the
