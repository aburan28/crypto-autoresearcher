correction:
  id: CORR-20260802-011
  recorded_at: '2026-08-02'
  record_type: schema
  record_id: DOCUMENTED-NULL-CRITERIA-AND-H-P13-STATUS-ALIAS
  field: validate_ledger null handling; H-WESO-001 status field name
  reason: >-
    Two further cases of the same pattern already recorded in
    CORR-20260802-009: a rule that was stricter than the records it governs, and
    a field carrying an older name.
  documented_null_criteria:
    what: >-
      EXP-YIELD-003 declares success_criterion and falsification_criterion
      explicitly null, with sibling notes and a whole block titled
      `there_is_no_success_criterion_and_that_is_the_design`. The contract is an
      observation-only replication: "NOTHING IN THIS CONTRACT SUCCEEDS OR FAILS
      ON A MEASURED VALUE."
    why_the_record_is_right_and_the_rule_was_wrong: >-
      The record anticipates this exact check and states the distinction it
      wanted the validator to make: "The schema field is present and explicitly
      null rather than absent, so that a reader cannot mistake an omitted field
      for an overlooked one." That is precisely what field_is_satisfied
      implements. The rule was demanding a criterion from a contract that
      deliberately has none.
    resolution: >-
      success_criterion and falsification_criterion join hypothesis_id in
      DOCUMENTED_NULL_OK: an explicit null passes only when a sibling
      *_note documents it. The approved-experiment check uses the same helper.
    approved_by_deliberately_excluded: >-
      approved_by remains non-nullable under every path. AGENTS.md rule 1 gives
      it exactly one legitimate value, so a null there is always a defect.
      Verified: a null approved_by with a note still fails.
  h_p13_001_status_alias:
    what: >-
      H-WESO-001 carried `official_status: analyzed` and no `status`. It is the
      only hypothesis in the ledger that does so, and no hypothesis carries
      both, so the two are the same field under an older name.
    resolution: >-
      Renamed to `status`. The value `analyzed` is unchanged; no status
      transition occurs and none is implied.
  still_reported_deliberately:
    H-WESO-001.question_id: >-
      No research question exists for the P13 line. The record's source_ref is
      SRC-P13-WESOLOWSKI-2026, a paper source rather than an RQ, and
      GOAL-P13-001 names no RQ anywhere in its dispatch state. Binding it to an
      invented or unrelated question would be fabrication, so the missing field
      stays reported until an RQ is authored or the record is bound to one.
    H-WESO-001_and_EV-WESO-001_identifier_format: >-
      Both carry a digit-bearing area code, the defect CORR-20260728-001
      recorded. NOT reissued here, unlike the PMA cluster: the P13 identifiers
      have 30-35 references across an actively dispatched campaign
      (GOAL-P13-001 BATCH-002 and BATCH-003 landed the same day), and
      EXP-WESOVOW-001's committed run directory carries the identifier, so the
      rename would move a frozen run record. Reissuing under a campaign in
      flight risks colliding with work in progress. It should be done as a
      dedicated change when the campaign checkpoints.
  substantive_delta: >-
    None. No claim, direction, strength, scope, proof level or hypothesis status
    is created, altered or withdrawn.
  status_effects:
    hypothesis_status_changed: false
    note: >-
      H-WESO-001 stays `analyzed`; only the field name holding that value changed.
  supersedes: null
  superseded_by: null
