correction:
  id: CORR-20260802-003
  recorded_at: '2026-08-02'
  record_type: identifier_alias
  record_id: ROOT-LEDGER-DECISION-ID-COLLISIONS-20260724-20260727
  field: identifiers_of_seven_root_level_coordinator_decisions
  reason: >-
    Seven decisions committed at the repository root spend identifiers that
    ledger/decisions/ already spends on different decisions. The root record
    and the canonical record are unrelated pieces of work in each case: for
    example ledger/DEC-20260724-001.yaml records the THM_INCBARRIER2 method
    barrier for H-INCB-001, while ledger/decisions/DEC-20260724-001.yaml
    records a GOAL-CRYPTO-001 BATCH-009 Newton saturation proof packet. Neither
    may be overwritten.
  resolution: >-
    The canonical ledger/decisions/ record keeps the identifier it published.
    The root record's content is reissued under the next free identifier of the
    same date, and legacy_ledger_inventory.remapped_ids records the alias so
    the historical identifier still resolves. This follows the precedent set by
    ledger/DEC-20260722-001..005, remapped to DEC-20260724-007..011.
  substantive_delta: >-
    Identifier substitution only. Each reissued record carries the source
    record's fields unchanged, plus a reissued_from_frozen_root_record block
    naming the source path, the historical identifier and this correction. A
    knowledge_promotion block asserting no promotion was added where the
    pre-schema source lacked the field; it re-scores nothing.
  alias_map:
    ledger/DEC-20260724-001.yaml: DEC-20260724-023
    ledger/DEC-20260724-002.yaml: DEC-20260724-024
    ledger/DEC-20260724-003.yaml: DEC-20260724-025
    ledger/DEC-20260724-004.yaml: DEC-20260724-026
    ledger/DEC-20260727-001.yaml: DEC-20260727-011
    ledger/DEC-20260727-002.yaml: DEC-20260727-012
    ledger/DEC-20260727-003.yaml: DEC-20260727-013
  not_remapped:
    - id: ledger/DEC-20260724-005.yaml, ledger/DEC-20260727-004.yaml
      why: >-
        Root records whose identifiers are not spent anywhere else. They are
        frozen by hash in legacy_ledger_inventory.records and keep their ids.
  source_records_unchanged: >-
    No root record was edited. All seven remain byte-identical and are frozen
    by sha256 in tools/legacy_ledger_inventory.yaml, so this correction cannot
    be used to alter them later.
  status_effects:
    hypothesis_status_changed: false
    note: >-
      Identifier hygiene only. No hypothesis status, evidence direction,
      claim tier or cryptanalytic assertion is created, altered or withdrawn.
  supersedes: null
  superseded_by: null
