  corrected_value: Per item in items[].corrected_value; to be carried by a superseding row.

  items:
    - id: K1
      field: claim
      prior_value: >-
        "Silverman's xedni calculus (lift points to Q and look for
        rank-deficient lifts) was shown by
        Jacobson-Koblitz-Silverman-Stein-Teske to succeed with negligible
        probability; lifting-based ECDLP approaches inherit this obstruction."
      corrected_value: >-
        Jacobson, Koblitz, Silverman, Stein and Teske (Des. Codes Cryptogr. 20
        (2000) 41-64), Theorem 4.1: under "certain plausible assumptions",
        namely Lang's lower-bound conjecture for the canonical height and
        Lemma 4.1's assumption log|D| >= C1 max hhat(P_i), a xedni round
        succeeds with probability below C0/p; the mechanism is an absolute
        bound C2 on relation coefficients followed by pigeonhole. The bound is
        asymptotic and conditional: with the paper's estimates C0 ~ 1e4
        (r = 2) and ~ 1e12 (r = 3) it is vacuous at small p, and the same paper
        measures frequent dependence at small discriminants (sections 5.1 and
        5.2). So xedni fails asymptotically under those conjectures, needing
        on the order of p repetitions. The second sentence is narrowed: the
        row does not establish that lifting-based approaches in general
        inherit this obstruction. The p-adic formal-logarithm route has its
        own obstruction (Hom(Z/n, E^(pZ_p)) = 0 for n != p: the functional
        vanishes on the unique homomorphic section; EV-CZLIFT-ad28f5,
        KN-TECH-73630e, KN-FIND-7e2b94), global-lift coverage has the
        fixed-rank counting obstruction (EV-CZLIFT-376eee D7, conditional on
        T1 to T4 beyond toy scale), and the bounded-relation count on
        zero-freedom r <= 3 fits (EXP-CZLIFT-ed8113) is a nearby object that
        measures neither.
      found_by: RT-20261023-d796bb R1-B3 and citations_checked; DEC-20261023-488023 N-4(b)
    - id: K2
      field: status
      prior_value: '"proven"'
      corrected_value: >-
        heuristic: Theorem 4.1 is proven conditionally on Lang's canonical-height
        conjecture and Lemma 4.1's assumption, neither of which is proven; the
        row names both. (Allowed statuses per
        knowledge/frontiers/ecdlp/README.md: proven | heuristic | conjectured |
        disputed | refuted | measured | reported.)
      found_by: DEC-20261023-488023 N-4(b); RT-20261023-d796bb HC1
    - id: K3
      field: sources
      prior_value: >-
        "KN-LIT-020 locator abstract, verification_state abstract_read;
        KN-LIT-021 locator abstract, verification_state abstract_read"
      corrected_value: >-
        The primary of KN-LIT-021 (JKSST 2000) was read in full by
        TASK-20261023-62eb31 (and by TASK-20261023-326d39). The superseding row
        cites a curated KN-LIT entry for it with locators "Thm 4.1, p. 49;
        Lemma 4.1, p. 50; section 4.1, p. 53; sections 5.1-5.2" and
        verification_state full_text_read. Silverman 2000 (KN-LIT-020) stays
        abstract_read; its algorithm description was checked only through
        JKSST section 3 (secondary_source).
      found_by: RT-20261023-d796bb citations_checked
    - id: K4
      field: forecloses
      prior_value: >-
        "xedni; lift to characteristic zero; canonical lift for ECDLP; rank of
        lifted curve"
      corrected_value: >-
        "xedni" stays (asymptotically, conditionally, for xedni proper).
        "Lift to characteristic zero" and "canonical lift for ECDLP" are not
        foreclosed by JKSST; where the program forecloses them, the basis is
        its own derivations (EV-CZLIFT-ad28f5 for the formal-logarithm readout
        on non-anomalous curves, EV-CZLIFT-712fe4 and KN-FIND-3c7e19 for the
        canonical lift and Smart on anomalous curves), each with its scope, and
        coordinate or digit encodings of the canonical section remain open
        (KN-OPEN-d3a6f0). "Rank of lifted curve" is foreclosed only in the
        fixed-rank counting sense of EV-CZLIFT-376eee, not for lifts whose rank
        grows with p.
      found_by: DEC-20261023-488023 N-4(b); DEC-20261023-36b4f0 canonical_graphs_checked; DEC-20261023-26a6de

  reason: >-
    DEC-20261023-488023 N-4(b) and its canonical_graphs_checked route this row
