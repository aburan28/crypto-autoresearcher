correction:
  id: CORR-20260802-46b73b
  recorded_at: 2026-08-02
  record_type: claim
  record_id: EV-AES-005
  field: boundaries[0] — the no-zero-entry condition on the mixing layer
  prior_value: >-
    EV-AES-005's material scoping boundary states that the r=4 bijection and the
    r=5 mod-8 forcing follow from round geometry alone: "any bijective S-box, any
    column-preserving mixing layer WITH NO ZERO IN THE RELEVANT ENTRIES,
    ShiftRows-style row rotations, and a full diagonal coset." The underlying
    derivation, BATCH-001 count5/PREREGISTRATION.md section 3.5 fact 2, asserts
    the same condition as a hypothesis of the r=5 result: "MC has no zero entry,
    and v_col[t] != 0, so g_col = 0 with a != a' is impossible."
  corrected_value: >-
    THE CONDITION IS SPLIT BY ROUND COUNT. It is dispensable at r=5 and
    load-bearing at r=4, and a single verdict either way would be wrong at one of
    them. This split is the validator's ruling (TASK-20260802-98bdb8) and it is
    adopted here in preference to the producer's original blanket framing.

    AT r=5 THE CONDITION IS DROPPED. The correct hypothesis is a NON-SINGULAR
    COLUMN-PRESERVING MIXING LAYER; no constraint on zero entries is needed. Two
    independent lines support this and they are of different kinds:
      (a) ANALYTIC, AND REVIEWED. The validator independently verified that fact
          2's only job is to empty the k=1 class, and that this class contributes
          256^3 * N/2 -- a multiple of 2^24 and hence of 8 -- whether or not it is
          empty. The k=2,3 classes carry 256^{4-k}; the k=4 class rests on fact 1,
          which uses no property of the mixing matrix. The mod-8 conclusion
          therefore survives DELETING fact 2 outright.
      (b) MEASURED, AND NOT YET REVIEWED. See the scope statement below.

    AT r=4 THE CONDITION IS KEPT, AND IN EXACT FORM. It is measurably
    load-bearing, but the precise requirement is narrower than "no zero entries
    anywhere": only the four entries M[(-c-j0) mod 4][c] for c = 0..3 must be
    non-zero, and WHICH four depends on j0. Under one zero-entry matrix, with key
    and base held fixed and only j0 varying, the count is 547608330240 at the
    critical j0 and exactly 0 at a non-critical one. Both readings were
    reproduced independently by the validator on its own engine. "No zero entries
    anywhere" is SUFFICIENT, NOT NECESSARY.

    WHAT IS AND IS NOT CALLED WRONG. Fact 2 read as a statement about AES's own
    MixColumns is TRUE; it is NON-MINIMAL, not false. What is false is the
    ASSERTION that the no-zero-entry condition is a hypothesis OF THE r=5 RESULT.
    That distinction is the validator's and is adopted verbatim; the producer's
    original label, "the derivation is WRONG", was ruled DOES NOT FOLLOW and is
    not used.

    THE r=5 CONCLUSION ITSELF IS UNTOUCHED AND IS NOT WEAKENED. Every AES arm in
    this campaign used AES_MC, which satisfies the dropped condition anyway, and
    widening a sufficient hypothesis never weakens the conclusion it supports.
  scope_of_the_evidence_supporting_this:
    reviewed_and_load_bearing: >-
      The analytic line (a) and the r=4 j0-paired measurement. Both were
      reviewed: the validator re-executed the r=4 pair on its own engine and
      independently verified the k=1 class arithmetic; the red team supplied the
      constraint-counting argument showing that a single zero entry relaxes only
      one of four constraints for one column.
    measured_but_NOT_reviewed_and_carrying_no_weight: >-
      Two further arms under a four-zero matrix, in which fact 2 is FALSE for
      every j0 rather than merely unnecessary, both read n mod 8 = 0. THESE ARMS
      ARE SEGMENT-3 PRODUCER OUTPUT THAT NO REVIEWER HAS SEEN. They are named
      here for completeness and they support nothing in this correction. This
      correction would read identically had they not been run, because it is
      written from the reviewed analysis. They carry to BATCH-003 for their own
      snapshot and independent review.
  reason: >-
    The producer proposed a blanket supersession asserting the derivation was
    wrong. BOTH independent reviewers rejected that framing, on different and
    complementary grounds, and the Coordinator HELD the supersession rather than
    minting it. The red team named the specific hazard: because this batch
    anticipated minting corrections, the failure mode was not a missing result
    but A FALSE CORRECTION WRITTEN PERMANENTLY INTO THE LEDGER. A blanket
    supersession would have introduced a NEW error at r=4, where the condition is
    real. Recording the narrower, split, exactly-stated version is the whole
    value of having held it.
  evidence_artifacts:
    - coordination/goals/GOAL-AES-003/batches/BATCH-002/tasks/TASK-20260802-98bdb8/validation_report.yaml
    - coordination/goals/GOAL-AES-003/batches/BATCH-002/tasks/TASK-20260802-958bac/red_team_report.yaml
    - coordination/goals/GOAL-AES-003/batches/BATCH-002/tasks/TASK-20260802-142a4b/RESULTS.json
    - coordination/goals/GOAL-AES-003/batches/BATCH-002/archives/TASK-20260802-f92a96/snapshot-receipt.json
  supersedes: null
  superseded_by: null
