      is a reference label only. No receipt, claim, release, manifest, report
      or session-receipt byte of attempt B is changed to carry it, so attempt
      B's own files still say RUN-ECDLP-18d26b and epoch 1, and the custody
      directory name keeps the original run id plus the owner. The alias is
      never a run directory, never a run id in a trial plan or queue, and is
      never allocated to a new run.
    placement_rule: >-
      No byte of attempt B is written at any path attempt A occupies. Attempt
      B lands on main only inside the custody directory named above. PR #2388
      may merge only in that shape.
