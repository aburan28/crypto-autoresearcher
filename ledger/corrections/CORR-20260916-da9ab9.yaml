      provenance: internal
      what: >-
        establishes that RUN-SEMBIN-8eda8e, DEC-20260913-4f44a7, DEC-20260913-2f07ee and
        BATCH-efea59's dispatch queue do not exist; quotes the fabricated string at its
        line 29
      verified_by: coordinator, this session, which read the file
    - id: GOAL-SEMBIN-fcb7a2
      provenance: internal
      what: the committed head carrying the residual pointer in two clauses of one recheck field
      verified_by: coordinator, this session, which read the file in full before editing it
    - id: DEC-20260916-59921c
      provenance: internal
      what: opens BATCH-cbb416 and creates the queue path the corrected recheck names
      verified_by: coordinator, this session, which authored it
