correction:
  id: CORR-20260916-da9ab9
  recorded_at: '2026-09-16'
  recorded_by: coordinator
  area: SEMBIN
  correction_type: residual_of_an_incompletely_applied_correction
  supersedes: []
  supersedes_note: >-
    Nothing. This does not supersede CORR-20260915-b7ca0c; it records that
    CORR-20260915-b7ca0c WAS NOT FULLY APPLIED and closes the instance it missed.
  targets:
    - ledger/goals/GOAL-SEMBIN-fcb7a2/goal.yaml
  target_records:
    - GOAL-SEMBIN-fcb7a2
  related:
    - CORR-20260915-b7ca0c
    - DEC-20260915-94855e
    - DEC-20260916-59921c

  title: >-
    The impediment recheck in GOAL-SEMBIN-fcb7a2's committed head still instructed a
    reader to open RUN-SEMBIN-8eda8e -- the fabricated run identifier that
    CORR-20260915-b7ca0c had already established does not exist -- and to render a
    dispatch queue at a path that has never existed either

  what_was_wrong:
    defect_1:
      where: >-
        ledger/goals/GOAL-SEMBIN-fcb7a2/goal.yaml, impediments[IMP-SEMBIN-FCB7A2-DESCENT].recheck
      what_it_said: >-
        "Read experiments/EXP-SEMBIN-4fa22c/runs/RUN-SEMBIN-8eda8e/controls.json for
        FIXTURE-EX1 and CTL-A4-STRICT-NULL".
      why_it_is_wrong: >-
        RUN-SEMBIN-8eda8e IS THE FABRICATED IDENTIFIER. It comes from the uncommitted
        2026-09-13 draft of this goal record, whose next_action asserted a dispatched
        executor with "run RUN-SEMBIN-8eda8e". CORR-20260915-b7ca0c quotes that exact
        string and states plainly that neither the approval nor the run exists. The
        goal head was then committed with the false next_action removed and THIS
        POINTER LEFT IN, so the committed record still directs a reader to a run
        identifier the program's own correction had ruled non-existent.
      what_makes_it_more_than_a_broken_link: >-
        A recheck is an INSTRUCTION, and an impediment whose recheck cannot be
        executed cannot be cleared by the mechanism the record itself declares. A
        reader following it finds nothing and has no way to distinguish "the fixture
        has not passed" from "the path was never real" -- which are opposite readings
        of the same absence. And the identifier is worse than a wrong path: repeated
        in a live field, a fabricated run id acquires the look of provenance.
    defect_2:
      where: the same recheck field, second clause
      what_it_said: >-
        "re-render this goal's queue with `python3 tools/research_dispatch.py
        coordination/goals/GOAL-SEMBIN-fcb7a2/batches/BATCH-efea59/dispatch_queue.json
        --claims refs`".
      why_it_is_wrong: >-
        TWO ERRORS IN ONE COMMAND. That queue file has never existed -- the same
        record's own current_batch_id_note and batch_directory_note both say so, four
        fields above, which is why this survived review: the record contradicts itself
        at a distance of a few hundred lines. And BATCH-efea59 is not a batch of this
        goal at all; its committed work is owned and archived by the PARENT goal's
        queue (GOAL-SEMBIN-5078bc BATCH-9d649f). Separately, the command as written
        would fail on its own: research_dispatch.py requires --output and --report,
        which the invocation omits.

  what_is_true_instead:
    run_identifier: >-
      NO RUN OF EXP-SEMBIN-4fa22c EXISTS as of 2026-09-16, and no run identifier for
      it has been allocated. The executor allocates one when it runs, which is exactly
      why a recheck may not name one in advance. The corrected recheck points at the
      runs DIRECTORY and its controls artifacts, which is a pointer that stays true
      whatever the run is called.
    queue_path: >-
      coordination/goals/GOAL-SEMBIN-fcb7a2/batches/BATCH-cbb416/dispatch_queue.json,
      created 2026-09-16 under DEC-20260916-59921c. This is the goal's first real
      queue, and the corrected recheck names it with a complete, runnable invocation.

  what_changed:
    - >-
      IMP-SEMBIN-FCB7A2-DESCENT's recheck now names the runs directory and the
      controls artifact by role rather than naming a run identifier, and gives the
      complete research_dispatch.py invocation against the queue that exists. A
      recheck_history entry beside it records the superseded text verbatim, so a
      reader can see what it used to say and why that was wrong.
    - >-
      Nothing else in the impediment moves. Its condition, what_is_blocked,
      clears_when and asserts_nothing_about are unchanged, and the impediment is NOT
      cleared by this correction.

  what_this_correction_does_not_do:
    - >-
      DOES NOT clear IMP-SEMBIN-FCB7A2-DESCENT. The instrument still does not exist
      and no fixture has passed. Fixing a broken pointer to a test is not passing the
      test.
    - >-
      DOES NOT assert anything about Proposition 5, d_F, d'_F, or any curve. This is a
      pointer repair in a coordination field.
    - >-
      DOES NOT edit CORR-20260915-b7ca0c, DEC-20260915-94855e, or any immutable
      record. The goal head is a mutable head that is reranked at every checkpoint;
      the change is recorded in its amendment_history and here.
    - >-
      DOES NOT claim the sweep is now complete. `rg RUN-SEMBIN-8eda8e` over the tree
      returns exactly two files after this correction: CORR-20260915-b7ca0c, which
      quotes the fabrication in order to condemn it and is immutable, and this record,
      which does the same. Both uses are quotations inside a correction; neither is a
      live instruction.

  forward_guidance: >-
    A CORRECTION THAT REMOVES A FABRICATED IDENTIFIER MUST GREP FOR IT, not just fix
    the sentence that prompted the correction. CORR-20260915-b7ca0c did the hard part
    -- it found the fabrication and refused to commit the draft that carried it -- and
    then rewrote the one field it had been reading. The instance it missed was in a
    DIFFERENT field of THE SAME FILE. One `rg` for the string being retired, before the
    correction is filed, would have caught it, and that step costs nothing next to the
    work of establishing that the identifier was fake in the first place.

    Second, narrower: A RECHECK MAY NOT NAME AN IDENTIFIER ITS OWN PROCESS HAS NOT YET
    ALLOCATED. Run identifiers are minted by the executor at run time. An impediment
    whose clearing test names one in advance is either guessing or quoting a
    fabrication, and both read identically to a later reader.

  citations:
