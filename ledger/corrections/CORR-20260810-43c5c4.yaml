correction:
  id: CORR-20260810-43c5c4
  recorded_at: '2026-08-10'
  recorded_by: coordinator (GOAL-ENDO-001, BATCH-d7e255)
  type: dual_summation_order_row_mean_defect_in_the_reference_driver
  severity: documentation_only_no_repair_authorized_no_measurement_invalidated
  supersedes: []
  corrects:
  - harness/run_saturation.py
  - harness/exp_icinv.py
  record_type: run
  record_id: RUN-INSTR-36c8cf-phaseA-v2-57ca9a
  record_note: >-
    The corrected artifact is a DEFECT IN TWO REFERENCE DRIVER SOURCE FILES,
    named as DEC-20260810-5aeeaa also_recorded.defect_found_in_the_reference_driver
    directs. No ledger evidence record, decision, or run verdict is corrected by
    this entry; RUN-INSTR-36c8cf-phaseA-v2-57ca9a's own artifacts are unaffected
    because that run's faithfulness check tests the variance ratio, not either
    site's row mean, and reports both means with their difference
    (sr3v3-self-consistency.json).

  field: >-
    The row-mean computation used by the reference measurement path.
    harness/run_saturation.py:89 computes `mean_rate = statistics.mean(rates)`.
    harness/exp_icinv.py:422 computes the same quantity as `rbar = sum(rates) / n`.
    Both are read as authoritative row means for the same row by different
    consumers of the reference driver.

  prior_value: >-
    NOT A PRIOR VALUE IN THE USUAL SENSE -- THIS IS A LATENT DUAL-PATH DEFECT,
    NOT A CORRECTED FIGURE. Before this record, no committed artifact stated
    that the two sites can disagree; the discrepancy was discovered only when
    RUN-INSTR-36c8cf-phaseA-v2-57ca9a's original faithfulness check demanded
    bit-exact row MEANS and one attempt (suffix
    36c8cf-phaseA-v2-479dc9) aborted before any run directory was created,
    consuming no run identifier, with its checkpoints retained as deviation D2.

  corrected_value: >-
    THE TWO SITES DIFFER AT FLOAT ULP LEVEL AT TWO OF THE THIRTEEN DENSITY
    ROWS IN THE COMMITTED REPRODUCTION: fb = 7 and fb = 18. The run's own
    sr3v3-self-consistency.json records the pair per row; the fb = 7 difference
    is measured as 1.3877787807814457e-17. `statistics.mean()` and
    `sum(rates) / n` are mathematically the same quantity computed by different
    summation orders (Python's `statistics.mean` uses exact-fraction summation
    internally; plain `sum()/n` accumulates in floating point left to right), so
    the two can and do diverge in the last bits whenever floating-point addition
    is non-associative for the given input, which it generically is. The
    corrected reading for any successor faithfulness check: DO NOT demand
    bit-exact row MEANS across these two call sites, because that demand is
    not achievable by construction, not a property of any curve, class, or
    sampler, and not a defect in the variance-ratio statistic itself, which
    IS the quantity being characterised and which the corrected check tests
    for bit-exact equality successfully (13 of 13 rows at two seeds).

  what_happened: >-
    A REFERENCE-DRIVER DEFECT DISCOVERED DURING EXECUTION OF
    RUN-INSTR-36c8cf-phaseA-v2-57ca9a AND NAMED AS SUCH IN THE ADJUDICATING
    DECISION. The same row-mean quantity is computed twice, in two different
    modules that both feed the SR3 v3 characterisation, by two different
    floating-point summation orders. One attempt at this run aborted at a
    faithfulness check that (incorrectly) demanded bit-exact row MEANS between
    the two paths; the check was corrected, IN THE SUCCEEDING ATTEMPT, TO TEST
    BIT-EXACT EQUALITY OF THE VARIANCE RATIO INSTEAD, and to report both mean
    values with their difference rather than gate on their equality. NO
    MEASUREMENT CODE IN EITHER harness/run_saturation.py OR harness/exp_icinv.py
    WAS CHANGED, by that run or by this correction.

  scope_of_impact: >-
    NO REPAIR IS AUTHORIZED BY THIS RECORD AND NONE IS PERFORMED. Both
    harness/run_saturation.py and harness/exp_icinv.py are READ-ONLY under
    EXP-INSTR-36c8cf's frozen contract (and harness/exp_icinv.py is read-only
    under every contract in this campaign that cites it, including
    EXP-ICINV-4d33aa). EDITING EITHER SITE WOULD PERTURB THE LAST BITS OF
    EVERY COMMITTED REPRODUCTION THAT DEPENDS ON THE UNMODIFIED REFERENCE
    DRIVER, including RUN-INSTR-36c8cf-phaseA-v2-57ca9a's own cross-platform
    agreement figures (max 1.5595266860918942e-14 relative over the thirteen
    rows against the committed reference). A repair, if ever undertaken, is
    a SEPARATE Coordinator decision with its own reproducibility analysis
    across every dependent committed run, and is explicitly not authorized
    here. This record's only authorized effect is DOCUMENTATION: it exists so
    a future executor writing a faithfulness check involving both call sites
    does not lose an attempt to the same cause, as attempt
    36c8cf-phaseA-v2-479dc9 did.

  independent_verification: >-
    NOT YET INDEPENDENTLY VERIFIED. This defect was found by the Executor
    session that produced RUN-INSTR-36c8cf-phaseA-v2-57ca9a, during its own
    aborted attempt and its corrected succeeding attempt, and was named for a
    correction record by this Coordinator's adjudicating decision
    DEC-20260810-5aeeaa (also_recorded.defect_found_in_the_reference_driver).
    This Coordinator read sr3v3-self-consistency.json directly and confirms
    the fb = 7 and fb = 18 pairs and the fb = 7 difference figure quoted
    above are present in that committed file. No validator or red-team
    session has yet reviewed this specific finding; V1 and V2 dispatched
    alongside this record (TASK-20260810-c9655a, TASK-20260810-854c12) review
    the nested-ladder noise arithmetic and the freeze question, not this
    driver defect, and neither is asked to re-verify it.

  why_this_is_recorded_rather_than_quietly_fixed: >-
    The two source files are committed, shared infrastructure that many
    already-committed runs depend on for their reported reproduction figures,
    and AGENTS.md rule 2 forbids silently repairing shared state that other
    evidence already cites. Recording the defect, its exact location, its
    exact magnitude at the two affected rows, and the explicit non-authorization
    of a repair is the only way a later reader or a future executor can avoid
    re-deriving it from scratch or, worse, silently patching a read-only file
    and perturbing every committed reproduction that depends on it.

  required_action:
  - >-
    ANY SUCCESSOR FAITHFULNESS OR REPRODUCTION CHECK THAT COMPARES A ROW MEAN
    COMPUTED VIA harness/run_saturation.py AGAINST ONE COMPUTED VIA
    harness/exp_icinv.py MUST NOT DEMAND BIT-EXACT EQUALITY OF THE TWO MEANS.
    Test the variance ratio (or whatever downstream statistic is the object of
    characterisation) for bit-exact equality instead, and report both mean
    values with their difference as a diagnostic, never as a gate.
  - >-
    NEITHER harness/run_saturation.py:89 NOR harness/exp_icinv.py:422 MAY BE
    EDITED under any contract of this campaign without a separate Coordinator
    decision that names every already-committed run whose reported figures
    depend on the unmodified reference driver and states the reproducibility
    impact on each.
  - >-
    A successor that needs a single canonical row mean should pick one call
    site explicitly and cite this record for why the two are not
    interchangeable at bit precision, rather than assuming they agree.

