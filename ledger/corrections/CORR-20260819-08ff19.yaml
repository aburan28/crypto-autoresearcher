        The head-regression failure mode itself (a merge resolving a
        goal.yaml conflict by taking a stale side) is a standing risk for
        every future merge of a long-lived goal branch into or from
        main. A durable guard (e.g. a CI check that the goal head's
        updated_at never moves backward across a merge) is a
        harness-design decision outside this correction's scope.

