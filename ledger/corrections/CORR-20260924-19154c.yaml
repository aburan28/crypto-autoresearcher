  field: >-
    Statements of method limits (RGL-10), of a value class justification
    (RJ-3) and of a WHY sentence (RJ-2); no normative rule

  items:
    - item: 1
      what: the undetected class RGL-10 declares
      records:
        - id: AMD-EXP-GFPN-05ff43-20260924-launchkind
          path: experiments/EXP-GFPN-05ff43/amendments/v2_addendum_launchkind.yaml
          locations:
            - lines: 534-544
              context: RGL-10 ("A loss that removes a launch record AND every detector bound to it consistently is not detected by the detectors. It FAILs anyway whenever the launch left a file in the five directories ..., so the undetected class is the consistent loss of a launch that left no file (LN-6 meets no definition; LN-7b meets (ii)).")
      prior_value: >-
        For every launch kind, the consistent loss of a launch that left no
        file is undetected.
      corrected_value: >-
        The statement is a SUPERSET of the undetected class (conservative). Per
        launch kind (review-report.yaml 344-467, 972-981): the class is
        non-empty at LK-2 (msolve at S-1: LN-6, LN-7b) and LK-5 (msolve at
        S-2: its analogue), and at LK-1 (child job) and LK-6 (gp) only if the
        spec file or gp script is also removed after the frozen code wrote it;
        it is EMPTY at LK-3 (callgrind), because the S-1 attempt record binds
        both the msolve launch and the callgrind launch and callgrind follows
        an ok msolve that always leaves files, and at LK-4 (comparator),
        because a no-file comparator failure ends the package with no collected
        pair (v2_check_run.py 66-67). The residual-premise objects are RP-1..RP-5
        (review 838-863).
      consequence: None on any rule or verdict. The declared limit stays as a limit; its extent is stated here.
      evidence: review-report.yaml 344-467, 612-619 (LJ-3), 838-863, 972-981 (OB-1).
    - item: 2
      what: RGL-10's sentence on alterations of solver-events.json
      records:
        - id: AMD-EXP-GFPN-05ff43-20260924-launchkind
          path: experiments/EXP-GFPN-05ff43/amendments/v2_addendum_launchkind.yaml
          locations:
            - lines: 547-550
              context: RGL-10 ("An alteration of solver-events.json after the manifest records its hash FAILs the carried V-7 item; one between the launch and the manifest write is not detected by V-7 and is visible after the fact only through RL-3's listing hashes (OB-3; RGL-7).")
      prior_value: >-
        An alteration between the launch and the manifest write is visible
        after the fact through RL-3's listing hashes.
      corrected_value: >-
        RL-3's listing is the wrapper's POST-COMPLETION listing (gapattr RGL-7,
        470-476), so an alteration made before it is RECORDED INTO the listing
        hashes, not revealed by them. Such an alteration is detected by the
        counts and detectors unless it is consistent, and a consistent one is
        not visible. The writer of such an alteration is a premise (RGL-7:
        "not known on any path").
      consequence: None on any rule or verdict; wording only.
      evidence: review-report.yaml 982-992 (OB-2).
    - item: 3
      what: RJ-3's value class justification
      records:
        - id: AMD-EXP-GFPN-05ff43-20260924-launchkind
          path: experiments/EXP-GFPN-05ff43/amendments/v2_addendum_launchkind.yaml
          locations:
            - lines: 354-355
              context: RJ-3 ("Reads raw-result.json read-only after the driver has exited (class epsilon), as RB-2 (a) reads it.")
      prior_value: RJ-3's read of raw-result.json is class epsilon as RB-2 (a)'s read is.
      corrected_value: >-
        RB-7 classes the RB-2 collector as a K-2 derivative with effect E5
        (readbackcover 337-338), whereas RJ-3's read feeds a named gap with
        effect E2 through RF-3 (a). The class assigned to RJ-3's read,
        epsilon, is still exactly one, and it is an E2 consistency reader of
        an epsilon value as VC-1 (b) allows. DEC-20260924-daf670 LKA-8 lists it
        in DV-11 with that class.
      consequence: None on any rule or verdict; DV-11 lists RJ-3 as LKA-8 states.
      evidence: review-report.yaml 811-816, 1015-1017 (OB-5).
    - item: 4
      what: RJ-2's WHY statement about argv in every run_child record
      records:
        - id: AMD-EXP-GFPN-05ff43-20260924-launchkind
          path: experiments/EXP-GFPN-05ff43/amendments/v2_addendum_launchkind.yaml
          locations:
            - lines: 332-334
              context: RJ-2 ("It is attributed only as RH-1 (ii) attributes it, to the gp launch record whose argv names it; every run_child record carries argv from its first line (v2_solver.py 152), a refusal before fork included.")
      prior_value: Every launch record carries argv, so RH-1 (ii) can always attribute the gp script to its launch.
      corrected_value: >-
        True of the frozen rec and of every RETURNED record. On a RAISE out of
        run_child, readbackclose RK-1 (b) copies from the frame's rec only
        rlimit_as_child_getrlimit, child_rlimit_report, outcome,
        refusal_reason and returncode, and readbackfull RL-1 (c) copies argv
        as the returned record carries it, so a raise-path launch record may
        carry no argv; pari/<tag>.gp (and child/<tag>.spec.json) is then a
        recorder gap. Likewise gp_script raising after open() created
        pari/<tag>.gp (a1_pari.py 92-93) leaves a script with no launch. Each
        adds a gap only to a package that already FAILs (a raise ends it).
      consequence: None on any verdict (FC-8; an added gap on a failed package).
      evidence: review-report.yaml 956-968 (FC-8), 1021-1027 (OB-7).

