correction:
  id: CORR-20260805-527ffc
  title: >-
    Merge collision note — origin/main into cursor/ecdlp-batch-047-rc45-proper-controls
    (GOAL-MLKEM-004 divergent lineage; GOAL-SSI-001 shard conversion)
  recorded_at: '2026-08-05'
  recorded_by: coordinator
  context: >-
    PR #159 (cursor/ecdlp-batch-047-rc45-proper-controls into main) was
    unmergeable. Bringing origin/main into the branch produced five conflicts.
    Three were structural and one was clerical; the fourth is a genuine
    divergence in which the same goal was closed twice, independently, under
    different decisions, and the same record identifiers were minted twice for
    different bodies.
  resolution:
    - >-
      GOAL-SSI-001: main had converted the goal to the sharded layout
      (ledger/goals/GOAL-SSI-001/{goal.yaml,checkpoints/*}) through BATCH-042
      while the branch continued to append to the monolithic file through
      BATCH-045. Adopted main's sharded layout, wrote the branch's BATCH-043,
      BATCH-044 and BATCH-045 checkpoints as new write-once shards, and carried
      the branch's mutable head fields (current_batch_id BATCH-046,
      dispatch_queue_path, latest_verified_commit, next_action, notes,
      updated_at) into goal.yaml. No checkpoint was edited, reordered or
      dropped; the branch and main checkpoint sets agreed byte-for-byte on
      every batch both carried.
    - >-
      GOAL-ECDLP-001: main sharded it; the branch had not modified the
      monolithic file since the merge base, and main's thirteen shards carry the
      identical head fields and checkpoint set. Accepted main's conversion with
      nothing to preserve.
    - >-
      GOAL-MLKEM-004: the branch and main each closed this goal at a 6-batch
      budget with disjoint batch lineages — the branch under DEC-20260804-bcdecb
      / EV-MLKEM-4a9cfe (batch_log BATCH-d2a728, BATCH-e87ab3; named obstruction,
      bgj1-specific excess variance under QEMU requiring native x86_64 to settle),
      main under DEC-20260805-0b3e11 / EV-MLKEM-2cd08b (batch_log BATCH-d2a728,
      BATCH-f75059, BATCH-c45baf, BATCH-d3a45a, BATCH-a2bb63, BATCH-4bc9bc; closed
      at budget with NO named obstruction). Main's lineage is live: it is the
      shared-trunk record, it is later, and it carries the terminal batch. The
      branch's divergent goal fields are preserved verbatim in
      ledger/corrections/CORR-20260805-527ffc-branch-GOAL-MLKEM-004.yaml.
    - >-
      DEC-20260803-d810d0 and EV-MLKEM-da9e3b are identifier collisions: both
      branches minted them for BATCH-d2a728 of GOAL-MLKEM-004 with different
      bodies, different decision vocabulary (`expand` vs `continue`), different
      review task IDs, and snapshot_commit values that agree only on their first
      ten hex digits (8cc51677f7202e9f9b85efdf834860254798abf4 on the branch,
      8cc51677f7205d8b6b2f66e5ba31f0d8bbb84c9e on main). Main's bodies are live
      at the canonical paths; the branch bodies are preserved verbatim under
      CORR-20260805-527ffc-branch-DEC-20260803-d810d0.yaml and
      CORR-20260805-527ffc-branch-EV-MLKEM-da9e3b.yaml.
    - >-
      coordination/goals/GOAL-MLKEM-004/batches/BATCH-d2a728/dispatch_queue.json:
      task TASK-20260803-586a7f state `running` on the branch versus `completed`
      on main. Took `completed`; the ledger archive that task performs is
      committed on both sides.
  live_goal_authority:
    - ledger/goals/GOAL-SSI-001/goal.yaml
    - ledger/goals/GOAL-ECDLP-001/goal.yaml
    - ledger/goals/GOAL-MLKEM-004.yaml
  does_not_rewrite_history: true
  limitations:
    - >-
      THIS RECORD ADJUDICATES NOTHING ABOUT THE SCIENCE. Whether GOAL-MLKEM-004
      closed with a named obstruction (branch) or without one (main) is an open
      Coordinator question, and the answer bears directly on whether a successor
      goal should open. This merge only ensures neither closure was lost.
    - >-
      DEC-20260804-bcdecb and EV-MLKEM-4a9cfe remain in the ledger after the
      merge with no live GOAL-MLKEM-004 batch_log entry referencing them. They
      are reachable only through this correction and through the branch archive
      above.
    - >-
      The two BATCH-d2a728 bodies declare different snapshot commits for the
      same batch. At most one can be the archived snapshot; this merge does not
      determine which, and does not verify either against the repository.
    - >-
      The GOAL-MLKEM-004 batch_log entries on both sides were authored by
      Coordinators in separate worktrees. No attestation, review, or verification
      was obtained for this merge, and none is recorded.
  recorded_by_note: >-
    Recorded during conflict resolution for PR #159 at the user's request, not
    as part of a dispatched batch. No hypothesis status changed and no
    experiment was approved.
