    next free decision IDs for that date. This supersedes the sentence in
    CORR-20260730-001 stating that DEC-20260730-002/003 did not collide with
    main and keep their IDs: that was accurate at the earlier merge point and
    is no longer accurate for DEC-20260730-002. CORR-20260730-001 is not
    rewritten. DEC-20260730-003 (rescind pause, GOAL-MLKEM-002) and
    DEC-20260730-004 (rescind pause, GOAL-CRYPTO-001) do not collide and keep
    their IDs; DEC-20260730-003's citations of the rescinded decision now point
    at DEC-20260730-006. Historical snapshot commits remain authoritative for
    pre-remap paths and content hashes; BATCH-003 and BATCH-004 ledger receipts
    carry remapped path keys and record_ids with hashes recomputed after
    ID-string updates only. No runs were re-executed, no evidence was
    reinterpreted, and no attestation was fabricated.
