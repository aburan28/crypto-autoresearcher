  hash_binding_note: >-
    The path_sha256 entries in
    coordination/goals/GOAL-ECDLP-001/batches/BATCH-006/archives/TASK-20260726-008/ledger_commit_receipt.json
    bind Git object content at commit 747eb6bf678d3eed3016bccdc316d862edc69d32 and remain
    valid for that commit. Two of the artifacts updated above, ledger/goals/GOAL-ECDLP-001.yaml
    and coordination/goals/GOAL-ECDLP-001/batches/BATCH-004/dispatch_queue.json, are among
    those bound paths, so their post-correction working-tree content intentionally no longer
    matches the recorded hashes. That is by design and is not a verification failure: the
    receipt attests the content AS COMMITTED at 747eb6bf, never the current worktree. No
    receipt was edited by this correction, and no SHA-256 was computed by the authoring
    session, which has no shell access.
  integrity_event:
    what_happened: >-
      A Copilot bot pushed merge commit c2beba80 to branch
      feat/launch-research-harness-78c286. It resolved the add/add conflict at
      ledger/decisions/DEC-20260726-007.yaml backwards relative to ESC-20260727-001
      section D: it kept the branch integrity-repair decision at that ID and DELETED main
      published EXP-GGM-001 archive decision from the merged tree.
    why_it_matters: >-
      Deletion of a published ledger record is an integrity event under AGENTS.md, which
      makes ledger records immutable and permits supersession but never deletion. It was
      unauthorized: no decision record authorized removing main published record, and an
      automated merge resolution is not a Coordinator decision. While the deletion stood,
      EV-GGM-001 and H-GGM-001 (status supported as merged from main) were carried on this
      branch with their authorizing decision record destroyed, so the branch asserted a
      supported hypothesis whose authority could not be read.
    repair: >-
      The executing session restored ledger/decisions/DEC-20260726-007.yaml byte-identical
      to the origin/main version and reports that it verified the restoration. This
      authoring session has no shell access, computed no hash, and asserts the restoration
      only as reported and verified by that session.
    status: repaired_and_recorded
    not_adjudicated_here:
      - >-
        This correction does not ratify main published DEC-20260726-007, EV-GGM-001, or
        the H-GGM-001 supported status. ESC-20260727-001 section A ruled that archive
        process-invalid as an official transition, and section C rules the honest status
        of H-GGM-001 to be specified; both require their own superseding ledger decision
        and are not performed by a renumber.
      - >-
        H-GGM-001 status is deliberately left as merged in this correction. Changing it by
        hand during an ID repair would be exactly the kind of merge-artifact state
        transition ESC-20260727-001 section F forbids.
      - >-
        Nothing in this record is evidence for or against ECDLP hardness, prime-field
        ECDLP, generic-group simulability, or any attack. It is bookkeeping and integrity
        work only.
  evidence_artifacts:
    - ledger/corrections/CORR-20260727-001.yaml
    - ledger/decisions/DEC-20260727-001.yaml
    - ledger/decisions/DEC-20260726-009.yaml
    - coordination/goals/GOAL-ECDLP-001/escalations/ESC-20260727-001/ruling.yaml
    - ledger/decisions/DEC-20260726-007.yaml
  affects:
    - >-
      Citations of DEC-20260726-007 in branch artifacts dated on or before 2026-07-26
      read as DEC-20260726-009 under the alias declaration above.
    - >-
      Historical snapshot and ledger commits remain authoritative for the paths and
      hashes they recorded; only HEAD navigation uses the renumbered ID.
    - >-
      knowledge/findings/KN-FIND-001.md cites DEC-20260726-007 and is a main-authored
      artifact, so its citation correctly resolves to main published record and is NOT
      covered by the alias. It is untouched here; ESC-20260727-001 section C requires a
      separate correction or superseding entry for that finding on its own merits.
  decided_by: coordinator
