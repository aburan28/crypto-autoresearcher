correction:
  id: CORR-20260727-001
  recorded_at: '2026-07-27'
  record_type: claim
  record_type_note: >-
    The template enumeration for record_type is candidate | claim | run and has no
    decision value. claim is used as the closest permitted token, exactly as
    CORR-20260724-001 did for a merge remap. The corrected record is a
    coordinator_decision: ledger/decisions/DEC-20260726-007.yaml as authored on branch
    feat/launch-research-harness-78c286. No new enum value is invented silently.
  record_id: DEC-20260726-007
  record_id_disambiguation: >-
    OURS. This correction is about the integrity-repair / BATCH-006 opening decision
    authored on branch feat/launch-research-harness-78c286 and committed there as
    ledger/decisions/DEC-20260726-007.yaml. It is NOT about the record of the same ID
    published on origin/main (the EXP-GGM-001 archive decision, support / strong), which
    is untouched by this correction and keeps its ID.
  field: id
  prior_value: DEC-20260726-007
  corrected_value: DEC-20260726-009
  reason: >-
    Collision with the published main record of the same ID. origin/main published a
    different coordinator_decision at ledger/decisions/DEC-20260726-007.yaml in commit
    3a59a2079e7d24fa877828dc4766d4ca1c1cc9cb (EXP-GGM-001 archive, support / strong on
    H-GGM-001), while an unmerged branch record of ours occupied the same ID. AGENTS.md
    forbids ID reuse, so one of the two must renumber. Under ESC-20260727-001 section
    D_id_collision the published trunk record keeps the ID and the unpublished branch
    record renumbers, because that costs less integrity than any alternative and touches
    no published history. DEC-20260726-008 was already ours, so 009 is the next free
    number on the same date; the 20260726 date component is retained because the
    corrected record decided_at is 2026-07-26 and the date is part of record identity,
    not a filing timestamp. IDs are immutable, so the renumber is itself a deviation and
    is recorded here rather than performed silently.
  authority: >-
    coordination/goals/GOAL-ECDLP-001/escalations/ESC-20260727-001/ruling.yaml, section
    D_id_collision, ruling OURS_RENUMBERS_TO_DEC-20260726-009. That ruling lives in
    coordination/ and is Coordinator direction, not itself an official state transition.
    The ledger entry that carries it is DEC-20260727-001, which authorizes this correction,
    the reissue at DEC-20260726-009, and the five cleared citation updates listed below.
  alias_declaration: >-
    Every occurrence of the string DEC-20260726-007 in an artifact authored on branch
    feat/launch-research-harness-78c286 on or before 2026-07-26 refers to
    DEC-20260726-009, NOT to main published DEC-20260726-007. This alias is what makes
    the historical strings readable without tampering with immutable artifacts.
