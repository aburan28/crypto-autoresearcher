    - id: K13
      source: JV-1 breaking_artifact and bounded_consequence (VAL-20261002-2e4fd7)
      field: >-
        AMD-20261001-e61f2b C-1 and header block ("FILL = s*d ... one operation
        per table entry written"); TASK-20261001-41f6b3 review_plan JV-1 text
        ("FILL = s d is a LOWER bound on building the table"); RESULTS T5
        "log2 table entries"; manifest n131_min log2_table_entries; every v2
        TOTAL wherever it is quoted as a construction-charged cost
      prior_value: >-
        FILL = s d is the cost of building the oracle's table, read as a lower
        bound. log2 table entries = s d (82.0 at n = 131). The v2 TOTALs are
        construction-charged costs.
      corrected_value: >-
        FILL = s d counts |F|^s ORDERED s-tuples. The table is keyed by a sum,
        which is symmetric in its tuple, so a table of s-multiset sums with
        binom(2^d + s - 1, s) ~ |F|^s / s! entries serves the same probe law
        with identical success. It is built at about one group addition plus
        one write per entry. FILL is therefore an UPPER bound on the table's
        construction, over-charging by about log2 s! (1 bit at s = 2 to 15.30
        bits at s = 8). log2_table_entries is overstated by the same amount.
        The v2 TOTALs are UPPER bounds on the construction-charged cost of
        their own oracle and may NOT be quoted as lower bounds. In domain
        PROBE >= FILL holds exactly, so no in-domain TOTAL moves by 1 bit or
        more (max 0.968) with the budget law unchanged. Per-degree minimum
        margins against VOW with distinct-entry FILL: +15.857, +16.781, +18.508,
        +21.244, +23.244, +25.474, +26.264, +28.472, +34.761, +42.012 (n = 97
        ... 571; 0.25 grid). With the budget law applied to distinct entries,
        per-budget minima drop by up to 3.508 bits (n = 233, B = 2^100) and the
        smallest per-budget margin stays +15.857. The sub-rho count stays 0
        under every variant. The clause in the plan's JV-1 joint, "FILL is a
        lower bound", is false as written. It was the Coordinator's wording.
