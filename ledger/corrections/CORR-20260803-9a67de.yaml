    - coordination/goals/GOAL-AES-003/batches/BATCH-004/tasks/TASK-20260803-367b1b/RESULTS.json
    - coordination/goals/GOAL-AES-003/batches/BATCH-005/tasks/TASK-20260803-48a239/RESULTS.json
