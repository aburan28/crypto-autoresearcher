correction:
  id: CORR-20260803-9a67de
  recorded_at: 2026-08-03
  record_type: claim
  record_id: GOAL-AES-003-RC-8-COSTING
  field: the cost of the 27-draw S-box independence control
  prior_value: >-
    RC-8, the control that would raise the campaign's 0.224 lower bound on
    preserving bijections to 0.90, was costed at "about 75 minutes at 2^30 per
    arm" and DECLINED TWICE on that figure -- once in the BATCH-005 queue and
    once in the ranking that followed.
  corrected_value: >-
    MISPRICED BY ROUGHLY 28x. The campaign's own recorded timings in BATCH-004
    and BATCH-005 are 155 to 159 SECONDS per 2^30 arm. Twenty-seven draws cost
    ABOUT 71 MINUTES IN TOTAL, not 75 minutes each. The single control that would
    convert the campaign's central scoping claim from a 0.224 lower bound to a
    0.90 one was refused twice on a number contradicted by the campaign's own
    measured timings.
  reason: >-
    Found by the BATCH-005 red team, which checked the estimate against the
    recorded per-arm wall times instead of accepting it. The Coordinator carried
    the producer's figure into a ranking decision without that check -- the same
    unverified-repetition failure as CORR-20260803-c92db5, here costing a
    decision rather than a claim.
    WHAT IT COST, STATED PLAINLY: the campaign has repeatedly recorded that three
    drawn S-boxes leave the independence reading bounded at 0.224 and that 27
    draws are needed for 0.90. It then declined the 27 draws twice as
    unaffordable. They were affordable the whole time, at roughly the cost of one
    ordinary producer task.
