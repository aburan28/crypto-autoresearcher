correction:
  id: CORR-20260803-791ca7
  recorded_at: 2026-08-03
  record_type: claim
  record_id: TASK-20260803-9b1482
  field: three summary statements written by the Coordinator across the BATCH-004 dispatch card and snapshot receipt
  prior_value: >-
    (1) The BATCH-004 dispatch objective stated: "Under M0 and M1 every fiber
    size is a multiple of 256; under AES MixColumns the histogram is
    Poisson-shaped with max_occ 12."
    (2) The BATCH-004 snapshot receipt headlined: "DECAY TRACKS ROUND COUNT, NOT
    ZERO ENTRIES."
    (3) The same receipt, and the Coordinator's reports, headlined: "NOTHING THIS
    CAMPAIGN HAS FOUND IS SPECIFIC TO AES."
  corrected_value: >-
    (1) FALSE FOR M0 AT r=5, and the error reassigns credit. BATCH-002's
    GF(2^8) arms under M0 at r=5 carry max_occ 12 -- Poisson-shaped, no
    divisibility -- and still read n mod 8 = 0. OBS-B3-4 is worded precisely
    ("under M1 at r=5 ... exactly as under M0 at r=4"); the dispatch card
    GENERALISED it. The consequence: rank 1's self-declared strongest
    contribution, that Z1 at r=5 forces the residue with no degeneracy, ALREADY
    HAD A BYTE-WIDTH COUNTERPART. What the nibble arm genuinely adds is the
    r=6/r=7 decay direction, which exists nowhere at byte width.
    (2) TOO STRONG. The decay half is CONFIRMED in both engines -- all three
    layers forced at r=5, at chance by r=6. But zero entries are NOT INERT: at
    r=4 they change the MECHANISM. The exact-zero result holds 40/40 under the
    no-zero control and 0/40 under both zero-entry layers, the residue is instead
    forced through fiber divisibility, and under Z4 at r=4 the entire 2^16 coset
    collapses to a single projection value. The accurate statement is that zero
    entries change the ROUTE by which the residue is forced at low round counts,
    but not WHETHER it decays.
    (3) OVERSTATED AS A HEADLINE. The correct scope is that the signal survived
    THE TWO S-BOXES ACTUALLY DRAWN at the round count measured. Two draws give a
    95% lower bound of 0.224 on the fraction of preserving bijections; 29
    consecutive draws would be needed for 0.90. Nothing measured is retracted.
  reason: >-
    All three found by BATCH-004's independent reviewers -- (1) by the red team,
    (2) and (3) by the validator, which classified (2) explicitly as "a
    COORDINATOR receipt defect, not a producer one."
    THE PATTERN IS THE POINT AND IT IS RECORDED AS SUCH. In every one of the
    three cases the PRODUCER'S RECORD WAS ACCURATE AND MY COMPRESSION OF IT WAS
    NOT. The producer's own M-2, M-4 and M-5 state the r=4 mechanism change
    correctly; its RESULTS.json carries a what_this_cannot_establish block that
    states the 256! limit explicitly; OBS-B3-4 was worded precisely before I
    generalised it. The validator says so directly: a reader of the full artifact
    is not misled, a reader of the headline is.
    This is the same failure mode as three earlier Coordinator defects this
    session -- marking a validator FAILED without opening its directory,
    reporting a check_merge_hygiene PASS from a pipeline whose output was never
    read, and propagating "fact 2 false for every j0" without checking four
    matrix entries. Each is an assertion made about material I had but did not
    examine closely enough. COMPRESSION IS WHERE THIS COORDINATOR INTRODUCES
    CLAIMS THE EVIDENCE DOES NOT CARRY, and that is now on the record rather than
    in a pattern only a reader could notice.
  binding_on_future_summaries: >-
    A Coordinator summary line that compresses a producer's scoped claim must
    either carry the scope or defer to the artifact. Where a one-line headline
    cannot carry the scope, the correct act is to quote the producer's own
    sentence rather than to write a shorter one.
