correction:
  id: CORR-20260904-e526e0
  recorded_at: '2026-09-04'
  recorded_by: coordinator
  type: coordinators_own_pre_registered_prediction_defect_untested_algebraic_coincidence_at_the_minimal_joint_point
  severity: low_the_run_is_still_valid_evidence_for_the_additive_form_it_simply_fails_to_discriminate_against_the_named_rival_as_the_specification_claimed_it_would
  supersedes: []
  corrects:
    - experiments/EXP-MONO-98abb2/specification.yaml
    - ledger/hypotheses/H-MONO-1297d7.yaml

  finding_this_coordinators_own_design_defect: >-
    EXP-MONO-98abb2's own frozen specification (`preregistered_prediction`
    M3, and H-MONO-1297d7's own outcome (I) text) asserted, before any
    run: "D_sum != D_prod whenever both h_+, h_- >= 1 and n_+, n_- > 0" --
    stated as a general fact about the two named formulas
    (D_sum = h_+ n_- + h_- n_+, D_prod = h_+ h_- (n_+ + n_-)). This is
    FALSE at h_+ = h_- = 1 specifically: substituting h_+=h_-=h gives
    D_sum = h(n_++n_-) and D_prod = h^2(n_++n_-), which are equal exactly
    when h^2 = h, i.e. h in {0, 1}. Since the Stage-0 filter this
    Coordinator itself specified was "h_+ >= 1 AND h_- >= 1" -- the
    minimal admissible joint values are exactly h_+=h_-=1 -- and the
    declared fixed search order (same as the two prior experiments in
    this sub-thread) happened to land on a curve at exactly that point
    (p=103, A=1, B=11), the two "competing" predictions coincided
    (D_sum=D_prod=100) and the run could not discriminate between them,
    despite satisfying the letter of the Stage-0 filter and the letter of
    the falsification condition. This Coordinator did not check the
    pre-registered claim against the boundary case of its own search
    filter before freezing the specification -- an oversight of the same
    general kind (a design choice that looks generous but is blind to the
    discrimination the test exists to perform) named repeatedly in this
    program's own "conditioning trap" pattern, here applied to a
    pre-registered CLAIM rather than a sampling locus.

  who_caught_it: >-
    THE EXECUTOR ITSELF, self-disclosed in `experiments/EXP-MONO-98abb2/
    execution_report.yaml` and `implementation.md`, proactively and
    without prompting, at the moment of computing D_sum and D_prod for
    the found curve -- before any Coordinator or reviewer read the
    result. This is recorded explicitly because it is a genuinely good
    outcome of this program's own discipline (report plainly, don't
    explain away): a mechanical, judgment-light dispatch nonetheless
    caught a Coordinator-authored specification defect that a less
    careful execution could have silently absorbed by reporting only
    "R1_sum=R2_sum=0, confirmed" and omitting the coincidence.

  disposition: >-
    RUN-MONO-98abb2-1 remains valid, evidence-eligible data: the additive
    D3 form DOES match exactly on this curve (a real, if non-
    discriminating, confirmation that the formula continues to hold when
    both h_+ and h_- are nonzero simultaneously -- a genuinely new fact
    the pure h_-, h_+=0 slice could not establish). What is corrected is
    the INTERPRETATION: this run does NOT exclude the multiplicative
    rival D_prod, contrary to the specification's own stated expectation,
    because the two coincide identically at this specific (h_+,h_-)
    point. H-MONO-1297d7's own outcome (I) ("matches D_sum and NOT
    D_prod... completing the picture") is only PARTIALLY earned: the
    "matches D_sum" half holds; the "and NOT D_prod" half does not apply
    here and must be tested on a curve where the two rivals are
    guaranteed to differ (e.g. requiring h_+ != h_- and/or max(h_+,h_-)
    >= 2, checked algebraically before the specification is frozen this
    time, not merely asserted).

  scope_of_error: >-
    Confined to this specification's own pre-registered CLAIM about which
    outcomes would be discriminating; does NOT affect KN-FIND-edd62c
    (the h_-, h_+=0 slice, tested and reviewed separately and unaffected
    by this finding) or either prior experiment's own results
    (EXP-MONO-4e6faa, EXP-MONO-ee06e2), both of which independently
    verified D_sum != D_prod-style rivals actually differed on their own
    tested curves before drawing a conclusion.

  next_action: >-
    A corrected follow-up experiment must explicitly verify, ALGEBRAICALLY
    and BEFORE freezing the specification, that its own named rival
    prediction differs from the frozen D3 formula on every curve its own
    Stage-0 filter can produce -- not merely on a hoped-for "generic"
    case. Concretely: require the Stage-0 filter to additionally exclude
    h_+ = h_- (or otherwise a value pair where the named rival degenerates
    to the tested formula), and re-verify this exclusion is sufficient
    before dispatch, not merely plausible.

  reported_by: executor (self-disclosed, unprompted)
  acknowledged_by: coordinator
