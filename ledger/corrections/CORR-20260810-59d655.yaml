    exactly the trap.

    What is true across the union of open branches. FOUR separate hourly
    coordinator runs, each of which forked from the same stale main head and each
    of which read that directive, have each independently minted a DIFFERENT
    closing decision for this ONE batch. None is merged into origin/main
    (verified with `git merge-base --is-ancestor`; all four report NOT an
    ancestor). All four have open pull requests:

    (a) DEC-20260810-d62bc4, decision `supersede`, decided_at 2026-08-10, on
    branch coord/harness-hourly-20260810-0609 (PR 310); target_ids
    [GOAL-DREG-001, H-DREG-001, EV-DREG-008, BATCH-004, BATCH-005]; that branch
    also adds CORR-20260810-d018d2 and TASK-20260810-13ff25.

    (b) DEC-20260810-da7513, decision `supersede`, decided_at 2026-08-10, on
    branch coord/harness-hourly-20260810-1010 (PR 316); target_ids
    [GOAL-DREG-001, RQ-DREG-001, H-DREG-001, EV-DREG-008, TASK-20260731-016,
    TASK-20260731-025, TASK-20260731-026, TASK-20260731-027, TASK-20260810-9dac9a];
    that branch also adds TASK-20260810-9dac9a, additionally rewrote the goal
    head, appended BATCH-004 and BATCH-005 checkpoints, and added a
    "no-second-decision guard" to next_action.

    (c) DEC-20260810-d4a0a4, decision `support`, decided_at 2026-08-10, on branch
    coord/harness-hourly-20260810-1310 (PR 320); target_ids [GOAL-DREG-001,
    H-DREG-001, RQ-DREG-001, EV-DREG-008, TASK-20260731-016, TASK-20260731-025,
    TASK-20260731-026, TASK-20260731-027]; that branch also adds
    CORR-20260810-6457d6.

    (d) DEC-20260810-3c851d, decision `support`, decided_at 2026-08-10, on branch
    coord/harness-hourly-20260810-1410 (PR 322); target_ids [GOAL-DREG-001,
    BATCH-005, EV-DREG-008, H-DREG-001, RQ-DREG-001, TASK-20260731-016,
    TASK-20260731-025, TASK-20260731-026, TASK-20260731-027]; that branch also
    adds CORR-20260810-177f1a.

    THE VERDICTS DISAGREE 2-2 ON THE SAME EVIDENCE RECORD AND THE SAME BATCH.
    d62bc4 and da7513 record `supersede`; d4a0a4 and 3c851d record `support`.
    These are not the same kind of act: `support` is a claim-bearing verdict that
    touches H-DREG-001, whereas `supersede` is a records-hygiene verdict. All
    four cite EV-DREG-008 and NONE references any of the other three -- each was
    authored believing itself to be the first and only closure.

    THE ONE POINT OF AGREEMENT. All four report knowledge_promotion as not
    warranted, and all four give the same reason: EV-DREG-008 is strength
    `preliminary` / claim_tier `toy`. That agreement is recorded here because it
    is the only part of the four-way divergence that needs no adjudication.

    CONSEQUENCE IF ALL FOUR PRs MERGE. Main uses merge commits and never squash
    (CLAUDE.md, "Concurrency"), so every one of these records lands intact.
    GOAL-DREG-001 BATCH-005 would then carry FOUR mutually-unaware immutable
    closing decisions that disagree 2-2 on verdict. Under AGENTS.md rule 4 none
    of them can be renamed, edited or deleted; the disagreement can then be
    resolved only by a further superseding decision.

    THE CORRECTED READING OF THE DIRECTIVE. "Mint a fresh decision id and close
    BATCH-005" is DISCHARGED, four times over, and must not be executed a fifth
    time. What remains owed is not a closure but a RECONCILIATION, and its
    precondition has not yet occurred (see disposition below).

  disposition: >-
    WHAT THIS CORRECTION DOES AND, DELIBERATELY, DOES NOT DO.

    IT DOES NOT CLOSE BATCH-005 AND DOES NOT ITSELF ADJUDICATE EV-DREG-008. This
    is deliberate, not an omission: a fifth record asserting a verdict on
    BATCH-005 is precisely the thing that is going wrong, and adding one would
    reproduce the failure this record exists to stop.

    IT DOES NOT RANK THE FOUR DECISIONS AND DOES NOT DECLARE ANY ONE OF THEM
    CANONICAL. That adjudication belongs to whichever Coordinator session next
    holds all four records in ONE COMMITTED TREE. No session has yet held them;
    this one has not either -- it read them across four unmerged branches. Saying
    which verdict is right from that vantage would be an adjudication made
    without the artifacts in hand, and it is explicitly declined here.

    IT DOES BIND THE NEXT SESSION THAT READS IT. Do not mint a fifth closing
    decision for GOAL-DREG-001 BATCH-005, whatever GOAL-DREG-001.next_action
    still says on whatever main head you forked from. The remaining act is a
    SINGLE RECONCILING DECISION, authored only AFTER at least one of PR 310, PR
    316, PR 320 or PR 322 has merged, which names the merged record as the
    OPERATIVE closure of BATCH-005 and supersedes the others BY REFERENCE without
    editing them. Until such a merge lands there is nothing to reconcile against
    and the correct act is to do nothing further to BATCH-005.

  reason: >-
    THE MECHANISM, STATED PLAINLY, BECAUSE THE MECHANISM IS THE GENERALIZABLE
    PART AND IT IS NOT SPECIFIC TO THIS GOAL.

    The hourly coordinator harness forks from origin/main on each run. Work
    committed on an unmerged branch is INVISIBLE to the next fork. An instruction
    of the form "mint a fresh ID and close X", left standing in a goal's
    next_action, therefore RE-FIRES EVERY HOUR: each run reads the same stale
    head, sees the same apparently-unclosed batch, and correctly follows the
    directive it was given -- minting a NEW IMMUTABLE IDENTIFIER each time.

    The identifier allocator is working exactly as designed. It draws a random
    token without scanning state, which is why the four ids never collided with
    one another (CLAUDE.md, "Conventions"; AGENTS.md rule 14). But that is
    PRECISELY WHY NOTHING STOPPED THE FOURTH DUPLICATE: a minting scheme that
    scans no state cannot notice that the record it is about to create already
    exists under three other names. The defect is not in the allocator and not in
    any of the four authoring sessions, each of which acted correctly on the
    information its fork made available. The defect is a MUTABLE DIRECTIVE THAT
    OUTLIVED ITS OWN DISCHARGE across a fork boundary.

    THIS IS THE SAME FAILURE CLASS AS THE DEC-20260731-014 COLLISION THE
    NEXT_ACTION WAS WRITTEN TO REPAIR, ARRIVING FROM THE OPPOSITE DIRECTION: not
    two records sharing one identifier, but ONE BATCH ACQUIRING FOUR
    IDENTIFIERS. Both are failures of custody, and both were produced by a writer
    reasoning from state it could not see.

    Recorded as a correction rather than as an edit for two independent reasons.
    First, AGENTS.md rule 4: ledger records are immutable and corrections
    supersede rather than overwrite. Second, and specific to this hazard,
    GOAL-DREG-001.research_goal.next_action is a CONTENDED FIELD currently
    rewritten by at least one of the four unmerged branches (PR 316), so a fifth
    in-place edit would create exactly the unresolvable merge conflict inside an
    immutable record that AGENTS.md "Durable research commits" forbids resolving
    by picking a side. The next_action text therefore stands unedited and must
    from now on be read only alongside this correction.

