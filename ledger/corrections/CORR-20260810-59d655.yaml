  corrected_value: >-
    THAT PREMISE WAS TRUE WHEN WRITTEN AND IS NOW FALSE. BATCH-005 DOES NOT LACK
    A CLOSING DECISION; IT HAS FOUR, EACH ON A SEPARATE UNMERGED BRANCH, AND THEY
