correction:
  id: CORR-20261023-9f2176
  recorded_at: '2026-10-23'
  record_type: run
  record_id: RUN-CZLIFT-041d05, RUN-CZLIFT-6709c9 (EXP-CZLIFT-17b7eb), as restated by CORR-20261023-1869c3
  supersedes: CORR-20261023-1869c3
  supersedes_scope: >-
    Only the reference null that CORR-20261023-1869c3 pairs with its governing
    definition. Its definition ruling (every sample with v_p(z([p]P^)) >= 2,
    5256 rows per seed, governs) and its recomputed counts (93/5256 and
    87/5256) stand unchanged.
  field: >-
    Reference null attached to the governing degenerate-rate definition
    (metrics.degenerate_reference_inv_p and metrics.degenerate_z_score as
    restated by CORR-20261023-1869c3).
  prior_value: >-
    CORR-20261023-1869c3: governing definition all v_p >= 2 rows, paired with
    reference 1/p averaged over those rows = 0.0177289 (expected 93.183
    successes per seed). Seed 20261009: 93/5256 = 0.0176941, z = -0.0191.
    Seed 20261010: 87/5256 = 0.0165525, z = -0.6463 (pooled binomial SE
    sqrt(n ref (1 - ref)), validator VAL-20261022-3232db).
  corrected_value: >-
    Under the random-section model on a split lift (tau = P^ - P~ in E_1,
    v(tau) - 1 geometric with parameter 1/p, leading digits uniform and
    independent; RT-20261023-0b2a4f R2), the null that matches each
    definition is:
    (a) all v_p >= 2 rows (the governing definition of CORR-20261023-1869c3):
        1/(p+1); expected 86.838 per seed.
        Seed 20261009: 93 observed, z = +0.684.
        Seed 20261010: 87 observed, z = +0.018.
    (b) producer code definition, vQ >= vP rows: 1/p.
        Seed 20261009: 93/5178, expected 87.677, z = +0.591.
        Seed 20261010: 87/5175, expected 87.953, z = -0.106.
    (c) symmetric definition, vQ = vP rows: 1/(p-1).
        Seed 20261009: 93/5105, expected 90.465, z = +0.279.
        Seed 20261010: 87/5103, expected 90.119, z = -0.343.
    (d) literal reading "read at precision p^3", all v_p >= 2 rows: (p-1)/p^2.
        Seed 20261009: 88 successes, expected 86.161, z = +0.205.
        Seed 20261010: 87 successes, expected 86.161, z = +0.093.
    (e) exact null conditioned on the actual lifts (per lift and section,
        exhaustive over (P, d in [2, p-2]); all v_p >= 2 rows).
        Seed 20261009: 93, expected 79.96, z = +1.539.
        Seed 20261010: 87, expected 80.61, z = +0.751.
    The red-team z values use the heterogeneous binomial SE
    sqrt(sum_i r_i (1 - r_i)). Under that form, the CORR-20261023-1869c3
    pairing (governing definition with 1/p) reads z = -0.02 and -0.666. The
    validator's pooled-SE values for that pairing are -0.0191 and -0.6463. The
    two forms differ only in the SE and are both retained.
  criterion_reading: >-
    No success or falsification criterion is changed, and this record is not a
    protocol amendment. The frozen criterion (|degenerate_z_score| <= 4 on both
    seeds against the preregistered 1/p reference) is read as preregistered
    and holds. It also holds under every definition-and-null pairing listed
    above (max |z| = 1.539), so no outcome depends on this correction. The
    matching null is stated so that no later record pairs the governing
    definition with a mismatched reference.
  reason: >-
    CORR-20261023-1869c3 adopted the all-v_p >= 2 definition and kept the 1/p
    reference. 1/p is the matching null only for the producer's vQ >= vP
    subset. Over all v_p >= 2 rows the random-section model gives
    P(vQ = vP) = (p-1)/(p+1) and a uniform leading-digit ratio, so
    P(success) = 1/(p+1). Red-team objection O2 and required control 1
    (RT-20261023-0b2a4f, TASK-20261023-856638). The randomized section
    confirms the model: hensel_random's exact rate is 0.98 to 1.01 x 1/(p+1)
    for p <= 43 (rt_r2_actual_lifts_output.json). The deterministic sections
    (naive, Teichmuller) have lift-specific exact rates. For them the
    per-definition null holds only pooled, and conditioned tests use (e).
    Recorded under DEC-20261023-147f9f.
