correction:
  id: CORR-20260810-7cf0e9
  recorded_at: '2026-08-10'
  recorded_by: coordinator (GOAL-ENDO-001, BATCH-d7e255)
  type: unsourced_figure_in_a_narrative_artifact
  severity: rule_5_violation_minor_but_of_the_prohibited_class
  supersedes: []
  corrects:
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/execution/EXP-ICINV-e0cd8f/execution_report.md
  record_type: run
  record_id: EXP-ICINV-e0cd8f
  record_note: >-
    The corrected artifact is the execution report for TASK-20260810-ab0a07,
    which narrates RUN-ICINV-e0cd8f-s0 and RUN-ICINV-e0cd8f-s1. No run artifact
    of either run is corrected; both are internally consistent and were
    independently reproduced.
  field: >-
    execution_report.md section 5 (Budget), line 217 -- the host load-average
    triple attributed to environment.json at the s0 probe.
  prior_value: >-
    "Host load averages recorded at run time in `environment.json`
    (`[52.7, 49.9, 48.0]` on 14 cores at the s0 probe)."
  corrected_value: >-
    THAT TRIPLE APPEARS IN NO ARTIFACT. The recorded values are, read directly
    from the committed files by this Coordinator: RUN-ICINV-e0cd8f-s0
    environment.json load_average_1_5_15 = [51.0830078125, 50.052734375,
    48.09521484375]; RUN-ICINV-e0cd8f-s1 environment.json load_average_1_5_15 =
    [43.7744140625, 47.1513671875, 47.15087890625]. Both manifests carry the same
    values in resources.load_average_1_5_15. The cpu_count 14 in the same
    sentence is correct. Any citation of this campaign's host load at
    TASK-20260810-ab0a07 must use the two triples above and this record, never
    [52.7, 49.9, 48.0].
  what_happened: >-
    A figure presented as a quotation from a committed artifact is not in that
    artifact and is not a rounding of it. The quoted values are not the s0
    triple, not the s1 triple, and not any rounding, truncation or average of
    either. AGENTS.md rule 5 prohibits fabricated timings and has NO
    does-not-matter exemption, and this campaign's own no-transcription rule
    (CORR-20260807-a24675) requires a value quoted from a record to be READ FROM
    THAT RECORD, because a transcription cannot be distinguished from a
    measurement by any later reader.
  independent_verification: >-
    FOUND BY THE INDEPENDENT VALIDATING SESSION, NOT BY THE PRODUCER AND NOT BY
    THIS COORDINATOR. VAL-20260810-dc8bd8 check R6 records the defect, states
    both true triples, and reports that a grep of the whole run package and batch
    directory finds "52.7" nowhere but that line. This Coordinator then read
    both environment.json files directly and confirms the corrected values above
    byte for byte. The same validator check confirms that EVERY OTHER figure in
    the report's budget table is exact against the manifests -- s0 27.3 s wall /
    7.20 s CPU / 90.8 MB, s1 18.0 s / 7.52 s / 91.8 MB, total 45.3 s / 14.7 s --
    so this is an isolated defect and not a pattern.
  impact_assessment:
    measurements_affected: >-
      NONE. Host load average is a covariate of the execution environment; it
      enters no invariant, no gate and no verdict. Every output of both runs is
      an exact symbolic invariant over F_p that contention cannot corrupt, and
      the gate that fired (SR3) is a backend-inventory result independent of
      load.
    verdicts_changed: >-
      NONE. No frozen verdict was emitted by either run, and the SR3 outcome
      does not depend on any timing figure.
    evidence_affected: >-
      NONE. EV-ICINV-6b6264 states no load figure sourced from the report; where
      load is cited in DEC-20260810-d70ece next action NA6 it is cited from the
      two environment.json files and from this record.
    direction_of_error: >-
      The fabricated triple OVERSTATES the one-minute load at s0 (52.7 against
      the recorded 51.08) and understates it at s1 by a wide margin (the report
      quotes one triple where two different ones exist). No self-serving
      direction is discernible and none is alleged; the likelier mechanism is a
      figure written from memory rather than read from the file.
  why_this_is_recorded_rather_than_quietly_fixed: >-
    The committed report is immutable and is not edited (AGENTS.md rule 4). More
    to the point, a fabricated figure that changes no verdict is still a
    fabricated figure, and this campaign's credibility rests on the claim that
    its numbers are read rather than written -- the same claim CORR-20260807-a24675
    was written to defend, in a case where the fabrication also changed no
    verdict. Recording it is the only way a later reader can tell which of the
    report's figures survived checking.
  required_action:
  - >-
    Any citation of host load at TASK-20260810-ab0a07 uses the two recorded
    triples together with this record.
  - >-
    Execution reports state resource covariates by reading them from
    environment.json or the manifest at write time, per run, and never quote a
    single triple to stand for two runs.
  evidence_artifacts:
