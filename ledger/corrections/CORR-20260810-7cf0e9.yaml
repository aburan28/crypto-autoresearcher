  - experiments/EXP-ICINV-e0cd8f/runs/RUN-ICINV-e0cd8f-s1/environment.json
  - experiments/EXP-ICINV-e0cd8f/runs/RUN-ICINV-e0cd8f-s0/manifest.yaml
  - experiments/EXP-ICINV-e0cd8f/runs/RUN-ICINV-e0cd8f-s1/manifest.yaml
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/reviews/TASK-20260810-ab0a07/validation_report.yaml
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/execution/EXP-ICINV-e0cd8f/execution_report.md
