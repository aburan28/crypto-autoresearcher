  corrected_value: >-
    THE PLAN WAS A CATEGORY ERROR, NOT MERELY UNFINISHED. Line 171's
    sentence describes GOAL-P13-001's own Wesolowski-vs-Delfs-Galbraith
    margin bracket ([8.3498, 13.1544] bits, c-bracket [1.327077,1.576444]),
    a claim this correction and CORR-20260808-c792f8 never touched and
    never derived. It is NOT a copy of, and was never intended to state,
    the SQIsign NIST-I/III/V growing-gap figures (9.5387/21.9537/38.8387
    bits) that DEC-20260808-7ed316's next_actions assumed it should be
    rewritten to say. Rewriting line 171 to state the SQIsign figures, as
    planned, would have overwritten a correct-as-far-as-verified
    GOAL-P13-001 claim with an unrelated GOAL-SSI-001 number -- a new
    defect, not a repair. The conflation traces further upstream, to
    DEC-20260806-a00a28's own corrections_owed_not_made wording, and was
    carried forward uncritically through EV-SSI-455241, DEC-20260808-7ed316,
    and BATCH-5a3d0a/closeout.md without anyone re-reading the actual
    sentence at line 171 before queuing its rewrite. The real gap --
    Section 2 (GOAL-SSI-001's own section) having no NIST-margin statement
    at all -- was independently identified and discharged by a concurrent
    Coordinator session via DEC-20260807-f360f9 and DEC-20260808-0de8b2
    (an Addendum added to Section 2, not an edit to Section 3's line 171).
    This item is CLOSED as of that concurrent work, not queued. Section
    3's own line-171 claim about GOAL-P13-001's margin remains a distinct,
    genuinely open, unverified claim that neither branch has checked on
    its own terms -- it may be worth a future task, under GOAL-P13-001
    rather than GOAL-SSI-001, but nobody has committed to it and it is not
    queued by this record.
