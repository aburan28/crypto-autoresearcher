    alone conflated in it. (3) ledger/evidence/EV-SSI-455241.yaml line 124
    is where 9.5387/21.9537/38.8387 actually originate, confirmed by
    direct read. What Branch B's DEC-20260807-f360f9 and DEC-20260808-0de8b2
