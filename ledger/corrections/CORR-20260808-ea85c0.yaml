    analysis/SSI-ECDLP-SYNTHESIS-20260803.md. Section 2 (GOAL-SSI-001's own
    section of that document) carried no NIST-margin statement of any kind
    prior to the concurrent branch's fix.
  independent_verification_by_the_coordinator: >-
    RE-VERIFIED DIRECTLY AGAINST LIVE FILES IN THIS WORKTREE, NOT ACCEPTED
