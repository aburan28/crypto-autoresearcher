correction:
  id: CORR-20260916-0c9c0a
  recorded_at: '2026-09-16'
  record_type: framing_claim
  record_id: RQ-DREG-bd6c86
  field: motivation_and_decision_target_framing
  prior_value:
    rq_motivation: >-
      "Huang-Kosters-Petit-Yeo replaced the heuristic invariant with the LAST
      fall degree, which provably bounds the solving degree." and "(a) the last
      fall degree, which is a rigorous bound and is computable on small
      instances".
    thm_semaev_fall1_section_0: >-
      "the last fall degree (Huang-Kosters-Petit-Yeo) as the rigorous bound"
    also_asserted_in:
      - PR #1219 and #1220 descriptions
      - ledger/questions/RQ-DREG-bd6c86.yaml scope.methods and motivation
  corrected_value:
    direction: >-
      THE INEQUALITY RUNS THE OTHER WAY. The last fall degree d_F is a LOWER
      bound for the Groebner solving degree, proved by Gorla-Mueller-Petit
      ("Stronger bounds on the cost of computing Groebner bases for HFE
      systems", cited as [15] by Caminata-Gorla). The UPPER bound in
      Huang-Kosters-Yeo is on the complexity of THEIR OWN linear-algebra
      solving algorithm, not on the Groebner solving degree of the system.
    exact_relation: >-
      Caminata-Gorla Theorem 3.1: for any degree-compatible term order sigma,
      sd_sigma(F) = max{ d_F , max.GB.deg_sigma(F) }. This is an EQUALITY. The
      last fall degree is one of two maximands, not a bound on the whole.
      d_F is independent of the term order and of the coordinates; sd_sigma and
      max.GB.deg_sigma are not (Remark 3.2).
    first_fall_degree: >-
      Caminata-Gorla section 4 shows by explicit example that the first fall
      degree may be ARBITRARILY LARGER OR SMALLER than the solving degree, the
      last fall degree and the degree of regularity. Its relation to the
      solving degree is heuristic only. Any text in this program treating d_ff
      as an approximation with a known error direction is unsupported.
  reason: >-
    RQ-DREG-bd6c86 and research/THM_SEMAEV_FALL1.md were written before this
    program had read any primary source defining the last fall degree. Every
    proposal in the 2026-09-16 batch records that the definition "was not
    obtained". The framing sentence was inferred from secondary summaries,
    including KN-LIT-7605, which CORR-20260916-4f842d has separately shown does
    not say what the corpus recorded.

    Caminata-Gorla ePrint 2021/1611 was retrieved and read IN FULL BODY on
    2026-09-16 (16 pages, text extracted from the PDF, not the abstract). Its
    Definition 1.5, Theorem 2.8, Theorem 2.9 and Theorem 3.1 are transcribed in
    research/THM_FALLDEG_INVARIANTS1.md with their hypotheses.
  research_consequence_is_favourable_not_damaging: >-
    A lower bound is the useful direction for this program's actual goal. The
    first-fall-degree assumption is what the subexponential claims rest on, and
    an assumption is refuted from below: by Caminata-Gorla Theorem 2.8 the last
    fall degree IS the largest degree at which a degree fall occurs, and by
    equation (1) of that paper V_{F,d} = rowsp(M_d) for a degree-compatible
    order, so a per-degree Macaulay rank profile measures exactly the object in
    the definition. Any fall exhibited at degree D therefore certifies
    sd >= D. IDEA-20260916-4b7c1e's observable survives unchanged and is now
    underwritten by a theorem rather than by an analogy.
  scope_of_this_correction: >-
    Corrects the DIRECTION of a cited inequality and the status of the first
    fall degree. It does not retract the research question, whose decision
    target (a growth deficit against a support-matched null) is unaffected, and
    it does not touch Lemma 1, Corollary 1, Lemma 2 or Lemma 3 of
    THM_SEMAEV_FALL1, which stand on their own proofs and cite none of this.
  evidence_artifacts:
    - research/THM_FALLDEG_INVARIANTS1.md
    - knowledge/literature/KN-LIT-4e8513.md
    - knowledge/literature/KN-LIT-f37b9a.md
    - https://eprint.iacr.org/2021/1611
  affects:
    - RQ-DREG-bd6c86 motivation and scope.methods wording
    - research/THM_SEMAEV_FALL1.md section 0 and gap G2
    - >-
      Any future evidence record that cites the last fall degree as an upper
      bound on solving cost. It is not one.
  decided_by: coordinator
