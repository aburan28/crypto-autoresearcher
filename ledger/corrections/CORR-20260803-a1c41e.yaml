correction:
  id: CORR-20260803-a1c41e
  recorded_at: '2026-08-03'
  record_type: contract_freeze_receipt_defects
  record_id: EXP-SMTH-71b1b0
  field: freeze_rule_and_supersession_receipt
  recorded_by_task: TASK-20260803-bc2e31
  supersedes_nothing: true
  companion_records: [CORR-20260803-77d5da, CORR-20260803-b3d7f1, CORR-20260803-ff53c0]
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-038

  scope_of_this_correction: >-
    This corrects TWO RECEIPT DEFECTS of the freezing task TASK-20260802-80f5e9.
    It corrects NOTHING about the measured quantity, the metrics, the decision
    rules, the controls, the budget or the success criterion of
    EXP-SMTH-71b1b0, all of which stand unedited. No datum exists for this
    experiment and none is asserted here.

  defect_1_missing_freeze_receipt:
    what_the_contract_declares: >-
      EXP-SMTH-71b1b0 freeze_rule states "Its sha256 is recorded in
      freeze_receipt.json and is re-hashed by the measurement task, which HALTS
      if the digest differs."
    what_is_true: >-
      No freeze_receipt.json existed anywhere in the repository.
      experiments/EXP-SMTH-71b1b0/ contained specification.yaml and nothing
      else.
    verified_by: >-
      `find . -name freeze_receipt.json -not -path './.git/*'` returned nothing
      on branch claude/implementation-p9dqz3 at merge commit 5fbc8b8c.
    consequence: >-
      The contract's declared halt mechanism referenced a file that did not
      exist. An Executor following freeze_rule literally would have had nothing
      to compare its re-hash against, and the protection the rule describes was
      not in force.
    repair: >-
      experiments/EXP-SMTH-71b1b0/freeze_receipt.json is written by
      TASK-20260803-bc2e31 from the committed bytes of specification.yaml
      (sha256 e193a1966b264804b17976c1575f7bded858936005cab393f31763fef8a0e432,
      17950 bytes). It records written_late: true. The specification itself is
      NOT edited.

  defect_2_unverifiable_supersession_receipt:
    what_the_contract_declares: >-
      EXP-SMTH-71b1b0 supersession_reason states that EXP-SMTH-4403c4 "is left
      unedited with its sha256
      80b75c415b3456772acf09901a67ea0644d984dae84f8ad01946fc8afeb5b801
      standing."
    what_is_true:
      - experiments/EXP-SMTH-4403c4/specification.yaml is ABSENT from the
        working tree.
      - The file has EXACTLY ONE version in the entire git history, at commit
        f846c8dd, whose commit message names TASK-20260802-d34ac4 and the
        BATCH-028 producer snapshot archive, and whose sha256 is
        664e37a3752b984f6b213dde21c9d7c26e891708325185c785f36c5d6462eb6f.
      - The declared digest 80b75c41... matches NO committed version of that
        file, at any commit, on any branch.
    verified_by: >-
      Every commit returned by `git log --all -- experiments/EXP-SMTH-4403c4/specification.yaml`
      was hashed with `git show <commit>:<path> | sha256sum`. One commit, one
      digest, no match.
    what_this_does_and_does_not_mean:
      does_not_mean: >-
        This is NOT an assertion of fabrication. The most likely benign
        explanation is that the digest was computed from a working-tree state
        that was edited again before the snapshot archive committed it. The
        record simply cannot be verified as written.
      does_mean: >-
        The supersession receipt of EXP-SMTH-71b1b0 is UNVERIFIABLE AS RECORDED.
        An archive receipt whose digest matches nothing in history establishes
        nothing about what was superseded, which is the property such a receipt
        exists to provide.
    probable_cause_context: >-
      CORR-20260803-77d5da records that BATCH-028's dispatch queue on main was
      REPLACED WHOLESALE, orphaning six task cards. The disappearance of
      EXP-SMTH-4403c4 from the tree is consistent with that same event.
    consequence_for_the_measurement: NONE.
    consequence_rationale: >-
      EXP-SMTH-71b1b0 states under reuses_nothing_unapproved that "The measured
      quantity is stated directly below rather than by reference to either."
      The contract is self-contained: the supersession claim is metadata about
      provenance, not an input to the measurement. BATCH-038 therefore proceeds
      on EXP-SMTH-71b1b0 with this defect recorded and unresolved.

  what_is_still_owed:
    claim: >-
      OPEN-BATCH023-A, the direct B-smoothness measurement of HEUR-DS-1, has
      STILL not been performed. This correction does not perform it.
    evidence: >-
      experiments/EXP-SMTH-002/runs contains only RUN-SMTH-PILOT-001 and
      RUN-SMTH-PILOT-002, the null-only feasibility pilot and its
      RSS-terminated successor. experiments/EXP-SMTH-001 and
      experiments/EXP-SMTH-71b1b0 have no runs directory at all.
    status: >-
      BATCH-038 is opened to perform it under EXP-SMTH-71b1b0. Until a run
      package exists and is reviewed, HEUR-DS-1 has no direct measurement and
      no evidence record may assert one.

  self_repair_note_2026_08_03: >-
    THIS RECORD WAS COMMITTED UNPARSEABLE IN d1b6952c AND IS REPAIRED HERE.
    Line 54 read `f846c8dd ("TASK-20260802-d34ac4: BATCH-028 producer snapshot
    archive")` -- an unquoted colon-space inside a plain YAML scalar, which the
    parser reads as a mapping key. That is EXACTLY the defect class this batch's
    own SCOPE-DECISION documents in the five upstream records, reproduced by the
    Coordinator while documenting it.
    HOW IT ESCAPED THE GATE. tools/check_merge_hygiene.py was run BEFORE
    `git add`, while this file was still untracked. The tool inspects the files
    a branch touched, so an untracked file is invisible to it and it reported
    PASS. The gate was not defective; it was run at the wrong moment. Run it
    AFTER staging, never before.
    WHO CAUGHT IT. The Executor of TASK-20260803-fa7476, which flagged the
    unparseable file at HEAD as outside its own write scope and refused to touch
    it. The independent-review chain worked as designed on the Coordinator's own
    output.
    WHAT CHANGED. Punctuation on lines 53-56 only. No assertion, digest, finding
    or scope in this record is altered; the semantic content is identical. The
    repair is recorded here rather than in a new CORR id because the record was
    never parseable, is cited by no other record, and belongs to a batch still
    open. A reviewer who holds that an unparseable committed record must instead
    be superseded under a new id should say so and it will be.

  claim_ceiling: >-
    This correction records receipt defects only. It licenses no cost saving,
    no exponent, no crypto-scale claim, and no change to any hypothesis status.
