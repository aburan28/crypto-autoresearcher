  authority:
    produced_by: >-
      CTRL-20260805-histograms, authorised by DEC-20260805-cc2b32 next_actions[2], which
      states the control needs no ladder authorisation. Zero rank computation; pure
      combinatorics over a committed artifact.
    method: >-
      experiments/EXP-SIG-008/work/n1_ms.json holds the descended boolean system itself
      (n=12, seed 2, nb=24, 24 equations) with each equation a list of integer bitmasks
      over the 24 variables. Monomial degree is popcount and boolean monomial product is
      bitwise OR, so the Macaulay column set is reconstructible with no Sage. Rows: for
      each f_i of degree d_i and each multiplier m with deg(m) <= D - d_i, support is
      {mask | m} restricted to popcount <= D. Columns are the union of row supports.
  summary: >-
    THREE CORRECTIONS, ONE OF WHICH RETIRES AN OBJECTION THIS SESSION ITSELF RAISED.
    (1) The 7,110 anchor DOES have a committed, internally consistent receipt; the
    "no reproducible receipt" statement carried through EV-SIG-008, EXP-SDEG-f7faa8, the
    Red Team report and this session's own PR text is wrong on the committed tree.
    (2) EXP-SIG-008/summary.json is a stale mid-run snapshot whose "censored" gate status
    is contradicted by the completed run beside it, and that is how the provenance came to
    be mis-stated in both directions. (3) Blocking defect B3 is DISCHARGED at D=6 by
    independent reconstruction and the D5 inconsistency is sharpened rather than resolved.
    NO RECORD IS EDITED; corrections supersede (AGENTS.md rule 4).
  corrections:
  - id: P1
    severity: retires_an_objection
    corrects_statement: >-
      EV-SIG-008's artifact_absence_statement, that no claim in it is bound to a frozen
      protocol or reproducible receipt and that 7,110 survives via transcript and the
      unreachable branch exp-sig-008-artifacts d1d36dd. Carried forward verbatim into
      EXP-SDEG-f7faa8, into Red Team OBJ-3, and into this session's PR #171 body.
    finding: >-
      A committed receipt exists and is internally consistent.
      experiments/EXP-SIG-008/work/null_rank6/state.json records tag null_n12_s2,
      nrows 183312, ncols 174033, next_col 174033, rank_acc 149410, done true,
      secs_total 1182.6, with 22 carry files each carrying a distinct sha256.
      runs/RUN-EXP-SIG-008-n/raw.json records seed 2, status completed_valid,
      sr_pred 156520, rank 149410, deficit 7110, extra 7110. stdout.txt records
      "completed_valid rank_acc=149410 cols=174033/174033 work=1183s".
    integrity_checks_run:
    - 11 units, contiguous 0 -> 174033, covering ncols exactly once
    - sum(unit k) = 149410, equal to the reported rank_acc
    - sum(carry npiv) = 149410, a second independent decomposition agreeing
    - 22 distinct carry sha256 values
    consequence: >-
      The provenance objection against G1 is RETIRED. The Red Team was right to flag
      raw.json as uncited (its non-blocking objection); the stronger statement is that the
      receipt exists, is doubly self-consistent, and reproduces nrows and ncols that this
      control derived independently from the system itself. This does NOT revive
      EXP-SDEG-f7faa8: DEC-20260805-cc2b32's ground for revise was that P(pass G1) = 0 on
      the whole partial-sum lattice, which is untouched by provenance.
  - id: P2
    severity: material
    corrects_statement: >-
      experiments/EXP-SIG-008/summary.json gate1_null_D6_baseline.status =
      censored_budget_checkpointed, with checkpoint.next_col 138000, rank_acc 124719,
      fraction 0.793, cumulative_prefix_shortfall 13281.
    finding: >-
      STALE MID-RUN SNAPSHOT, NEVER REFRESHED. The state.json in the same experiment
      directory records next_col 174033, rank_acc 149410, done true, and the unit
      trajectory passes straight through the 138000 boundary - reading rank_acc 124719
      exactly there, matching the summary - before continuing to completion. summary.json
      also carries dirty_tree true.
    consequence: >-
      A reader consulting summary.json alone concludes the D6 null baseline was never
      finished. That is the mechanism by which P1's mis-statement propagated into four
      downstream records. The summary is not corrected in place; this record supersedes
      its reading.
  - id: P3
    severity: partial_discharge_plus_sharpened_conflict
    corrects_statement: >-
      Validator finding F-4 / contract blocking defect B3: the blanket "u_k = 0 for k < D,
      VERIFIED PER CELL" is undischargeable at CELL-D and is contradicted by a committed
      histogram giving u_4 = 2.
    finding: >-
      INDEPENDENT RECONSTRUCTION AT D=6 REPRODUCES EVERY COMMITTED STRUCTURAL NUMBER
      EXACTLY - nrows 183312, ncols 174033, deleted 16018, against N(24,6) = 190051 - and
      gives u_4 = u_5 = 0 with all mass at u_6 = 16018. B3 IS THEREFORE DISCHARGED AT D=6.
      At D=5 the same reconstruction gives nrows 31512 (matching the committed value) but
      ncols 46694, deleted 8761, u_4 = 0, u_5 = 8761.
    conflict: >-
      THAT MATCHES NO COMMITTED D5 PAIR. BATCH-003 RT-CTRLB.md gives {5: 8736, 4: 2}
      (deleted 8738, ncols 46717); a third reported pair is 46709 / 8746. All three
      partition N(24,5) = 55455 consistently and differ only in the number of degree-5
      monomials present: 33743 here, against 33758 and 33766. So there are three mutually
      inconsistent D5 column readings in this lineage and an independent reconstruction
      from the committed seed-2 system agrees with none - while agreeing exactly with
      every D=6 number.
    consequence: >-
      The D5 inconsistency is real and is now sharply localised to the degree-5 column
      count. It is NOT explained by this control and must not be reported as resolved. It
      does not touch G5, whose outcome the Validator showed is invariant under all these
      histograms. hist[5] rising 33743 -> 42504 between D=5 and D=6 is expected (more
      multipliers at D=6) and is not part of the conflict.
  infrastructure_outcome:
    statement: >-
      THE REBUILD HALF OF THE CONTROL IS UNRUN, AND UNDER AGENTS.md RULE 5 THAT IS AN
      INFRASTRUCTURE OUTCOME AND NEVER MATHEMATICAL EVIDENCE. src/semaev_tree.py (sha256
      e9f1681b4e422f7a..., identical to the EXP-SIG-005 copy) imports sage.all for GF,
      EllipticCurve, BooleanPolynomialRing and PolynomialRing. Sage is absent: import
      fails, no binary, apt reports no candidate, pip install sagemath-standard fails to
      build. tools/sage_free_estimator/shim/sage/ does not help - it is scoped to the
      lattice-estimator's elementary math names and supplies none of these constructors.
    deliberate_non_substitution: >-
      A reimplementation was deliberately NOT attempted. The control's purpose is builder
      identity, and a reimplementation cannot distinguish "the two lineages used different
      builders" from "my reimplementation differs from both" - the exact failure
      tools/sage_free_estimator/README.md records this campaign losing three batches to.
    unresolved: >-
      BUILDER IDENTITY REMAINS UNRESOLVED. Only seed 2 has a committed system artifact;
      nothing here touches seed 2026, so the two unreconciled n=12 readings
      (174033 / 16018 against 174035 / 16016) remain unexplained and HEUR-BF-1 remains
      untestable on that pair. Resolving it requires a Sage-capable environment.
  what_this_does_not_do:
  - >-
    It does NOT revive or repair EXP-SDEG-f7faa8. The contract stays review_required with
    approved_by null. Blocking defects B1, B2, B4 and B5 are untouched; B3 is discharged
    at D=6 only. DEC-20260805-cc2b32 stands unchanged - its ground was P(pass G1) = 0 over
    the whole partial-sum lattice, which provenance does not affect.
  - >-
    It does NOT explain the 7,110 deficit. The D6 below-freeze mechanism remains fully
    open.
  - >-
    It does NOT resolve the D5 inconsistency, and it adds a third reading to it.
  - >-
    It asserts nothing about ECDLP or supersingular-isogeny hardness. Boolean systems are
    not prime-field systems; KN-OPEN-002 is untouched, no exponent is moved, sota_delta is
    zero, and Pollard rho remains the ECDLP baseline. Claim tier toy.
