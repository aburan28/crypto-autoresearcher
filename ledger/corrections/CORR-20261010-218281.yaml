# =============================================================================
# CORR-20261010-218281 -- IDEA-20261009-b6d31b states the P-384 Solinas shape
# with the wrong sign on the t^3 term.
#
# WHAT THIS CORRECTS: one polynomial in the mechanism field of a merged
# proposal, and the same text in the intake addendum it was mapped from. The
# fault is the design session's own: the shape was recalled, not checked,
# when the proposal was filed.
#
# NOTHING IS EDITED. IDEA-20261009-b6d31b, source-addendum.yaml, the intake
# manifest and audit stay byte-for-byte as merged. The remedy is a superseding
# proposal under a new id. Zero runs. No status moves.
# =============================================================================
correction:
  id: CORR-20261010-218281
  id_provenance: >-
    Minted in the design session with tools/allocate_id.py --next correction
    --date 20261010 and checked free with --check.
  recorded_at: '2026-10-10'
  recorded_by: coordinator-design-session-20261009-G
  goal_id: GOAL-ECDLP-001
  batch_id: null
  archived_by: null
  record_type: proposal
  record_id: IDEA-20261009-b6d31b
  record_location: ledger/proposals/IDEA-20261009-b6d31b.yaml (merged to main in PR #2027)
  corrects:
    - IDEA-20261009-b6d31b
  also_concerns:
    - coordination/intakes/20261009-snfs-ecdlp-ledger/source-addendum.yaml (mechanism of SNFS-G3, same text; the source stays as written)
  field: idea.mechanism, the P-384 entry of the list of NIST shapes
  defect:
    prior_value: "P-384: t^12 - t^4 + t^3 + t - 1 at 2^32"
    correct_value: "P-384: t^12 - t^4 - t^3 + t - 1 at 2^32"
    check: >-
      2^384 - 2^128 - 2^96 + 2^32 - 1 (FIPS 186-4, D.1.2) at t = 2^32 is
      t^12 - t^4 - t^3 + t - 1; the stated shape evaluates to a different
      composite number. With the stated sign the shape has no prime value
      f(2^k) for 4 <= k <= 80; with the correct sign k = 6 gives a 72-bit toy
      prime and k = 32 gives P-384 itself.
    found_by: >-
      CTRL-SHAPE of experiments/EXP-ECDLP-4c6a09/implementation (each shape
      evaluated at its deployed k must equal the public NIST prime, else the
      run aborts), in the design session, after PR #2027 had merged.
    how_it_entered: >-
      The four shapes were recalled from memory when the addendum was written
      and were not evaluated against the public constants at intake time.
  what_follows:
    superseding_record: IDEA-20261010-478721
    superseding_note: >-
      Identical to IDEA-20261009-b6d31b except for the one sign, with
      `supersedes` and `supersession_note` set. H-ECDLP-4da36f and
      EXP-ECDLP-4c6a09 (both unmerged at the time of this correction) now
      derive from the superseding record and carry the correct shape; the
      runner's CTRL-SHAPE makes a recurrence impossible to run.
    other_shapes_checked: >-
      P-192 (t^3 - t - 1 at 2^64), P-224 (t^7 - t^3 + 1 at 2^32) and P-256
      (t^8 - t^7 + t^6 + t^3 - 1 at 2^32) evaluate to the public primes; only
      P-384 was wrong.
  what_this_does_and_does_not_change:
    the_hypothesis_stands: >-
      The claim, mechanism, predictions and minimal test of SNFS-G3 do not
      depend on which low-weight f is P-384; only the identity of one of the
      four tested shapes changes.
    no_evidence_affected: no run existed; nothing measured used the wrong shape.
  refs:
    - IDEA-20261009-b6d31b
    - IDEA-20261010-478721
    - H-ECDLP-4da36f
    - EXP-ECDLP-4c6a09
    - SR-20261010-ba371e
  runs_launched: 0
  status_transitions: none
  records_edited: none
