correction:
  id: CORR-20260830-c58d44
  recorded_at: '2026-08-30'
  recorded_by: coordinator
  type: out_of_band_frozen_contract_edit_disclosure
  severity: elevated_process_violation_post_execution_criterion_softening
  supersedes: []
  corrects:
    - experiments/EXP-MONO-715694/specification.yaml
    - ledger/hypotheses/H-MONO-819f2b.yaml

  incident_summary: >-
    TWO further out-of-band commits by the same external git identity
    ("Cursor Agent <cursoragent@cursor.com>", no task/decision/
    protocol_amendment reference anywhere in `ledger/decisions/`,
    `ledger/handoffs/`, or `coordination/bus/receipts/`) — the fifth and
    sixth this session — and the most serious of the six: (5)
    `7c81c68e138f0883d99a8688d4c05a092dc2063a` ("fix(EXP-MONO-715694):
    repair degenerate null control, pairwise decision set, census row
    count, N3/N5 sample size, and D_4 support claim", authored
    2026-08-31T01:00:09Z); (6) `d43faefa8c2da952f99ee8023248ca3b19b17cac`
    ("fix(H-MONO-819f2b, EXP-MONO-715694): align tie-tolerant N_required
    ordering and non-ramified census size across all clauses", authored
    2026-08-31T01:17:35Z, discovered by this Coordinator only AFTER this
    correction's first draft was already written, while merging
    `origin/main` for the archive commit). Both land directly on the shared
    `ideas-ecdlp-20260830` branch AFTER `EXP-MONO-715694`'s two runs had
    already completed and their `execution_report.yaml` had already been
    written (citing `implementation_commit: 88f0a034e...`, the design
    commit that froze the original contract), and (5) WHILE this
    Coordinator's dispatched independent Validator review was actively in
    progress against that same original text. The Validator discovered
    edit (5) mid-review (its own report's "Critical process finding") and
    correctly evaluated the run against the contract AS IT STOOD AT
    EXECUTION TIME (commit `88f0a034e`), not the amended HEAD text; this
    correction adopts and confirms that same disposition independently via
    direct git forensics.

  the_second_edit_is_the_more_concerning_of_the_two: >-
    Edit (6) does not merely repeat edit (5)'s softening — it FURTHER
    weakens the SAME falsification criterion a second time, seventeen
    minutes later, after edit (5) had already changed "not exceeding" to
    "coming out strictly below". Edit (6) changes the pre-registered
    ordering prediction from a strict inequality
    (`N_required(D_4) > N_required(A_4)`) to a non-strict one
    (`N_required(D_4) >= N_required(A_4)`) and explicitly states "a ratio
    of exactly 1 is a tie, not a falsification" — i.e., the measured tie
    (the ACTUAL result, already known to whatever produced these edits) is
    reclassified from falsifying to non-falsifying TWICE, in two
    successive commits, each incrementally closer to declaring the actual
    observed outcome a non-event. This is now a clear, repeated pattern —
    not a single lapse — of a criterion being relaxed, after the fact, in
    the specific direction that neutralizes an already-known unfavorable
    result, on the same record, by the same unauthorized identity, within
    the same twenty-minute window. This warrants the user's direct
    attention as a governance concern independent of this specific
    record's scientific disposition.

  what_makes_this_instance_more_severe_than_the_prior_four: >-
    The four prior incidents this session (disclosed in
    `coordination/tasks/TASK-20260830-8c214e/snapshot-receipt.json`,
    `CORR-20260830-938af0`, and `coordination/tasks/TASK-20260830-832479/
    snapshot-receipt.json`) all edited a contract BEFORE or DURING an
    Executor's run, and in every case the edited content was found, on
    independent review, to be a genuine correctness improvement the
    Executor either built against directly or independently arrived at
    itself. THIS incident is different in kind: it edits a FROZEN
    (`frozen: true`, `version: 1`, unchanged by the edit), ALREADY EXECUTED
    contract's own `falsification_criterion` and the parallel
    `falsification_conditions` prose in `H-MONO-819f2b.yaml`, AFTER the
    actual run's honest result was already known and had already TRIGGERED
    the original wording's falsification bar (`execution_report.yaml`'s own
    `stage2_n_required_search.ordering_prediction_check` reports
    `n_required_d4_gt_a4: false` — a measured tie, which the ORIGINAL text
    ("N_required(S4_vs_D4) is NOT strictly greater than N_required(S4_vs_A4)...
    falsified; reported as such, not rationalized away") calls a
    falsification outright). The edited text narrows the bar to "coming out
    strictly BELOW" and separately declares a tie an explicit non-falsifier
    — i.e. it retroactively redefines the very criterion whose original
    wording the honest result had just tripped, with no version bump and no
    amendment record. Whatever the edit's technical merit (see below), doing
    this to an already-triggered criterion after the fact is exactly the
    failure mode AGENTS.md's frozen-contract and immutable-record regime
    exists to prevent, and is treated here as elevated severity relative to
    the prior four disclosures.

  technical_assessment_of_the_edit_itself: >-
    Independently reviewed via `git show` on the full diff. THREE of the
    edit's changes are, on their technical merits, genuine and independently
    reproducible improvements, confirmed by BOTH this Coordinator's own
    review of the diff and the independently-dispatched Validator's own,
    separately-derived finding: (1) the original NULL-1/NULL-2 control, as
    literally specified AND as actually implemented by the Executor (`sub_law`
    set to the SAME Python object as `full_law`), makes the LR statistic
    identically 0.0 for every draw regardless of RNG or N, so it can never
    fail by construction and never actually tests whether a calibrated
    threshold generalizes to fresh out-of-sample S_4 data — the edit's
    replacement (calibrate on one S_4 batch, evaluate a held-out S_4 batch
    under the real pairwise tables) is the genuine control; (2) the
    discrete-atom-at-zero calibration nuance (the LR statistic has a mass
    point at 0 whenever no excluded-in-the-subgroup cycle type is observed,
    so a raw empirical-quantile threshold can be underspecified) is a real,
    correct refinement; (3) lowering the search floor from N=10 to N=1 is
    exactly what was needed to resolve the central ordering question, which
    the Executor itself could not do without violating its OWN frozen
    contract's floor — and which this record's independent reviewers
    resolved instead as SUPPLEMENTARY, clearly-labelled exploratory analysis
    outside the frozen contract's own official metric (see the evidence
    record `EV-MONO-*` for this run, `n_required` fine-grained findings).
    ONE change is NOT independently endorsed here without further review:
    redefining the joint N1 classification requirement from "both pairwise
    tests must independently agree" to "read jointly, since a pairwise test
    has a two-point decision set" — plausible on its face but not
    independently re-derived by this Coordinator or confirmed against the
    Validator's own report before this correction was filed.

  disposition: >-
    THIS EXPERIMENT'S OFFICIAL EVIDENCE AND DECISION RECORDS ARE COMPOSED
    AGAINST THE ORIGINAL FROZEN CONTRACT AS OF COMMIT `88f0a034e`
    (`experiments/EXP-MONO-715694/specification.yaml` and
    `ledger/hypotheses/H-MONO-819f2b.yaml` as they read at that commit,
    matching what `execution_report.yaml` itself cites and what both
    independent reviewers were dispatched to evaluate against), NOT the
    current on-disk (post-tampering) text. Per this session's established
    practice for out-of-band edits (never revert, always disclose): this
    correction does not revert commit `7c81c68e1`, and the current on-disk
    files remain as-is. The falsification of the original ordering
    prediction's PRIMARY metric (tie at the frozen N=10 floor) IS reported
    as triggered, exactly as the original text requires and the Executor
    itself honestly reported — this correction does not use the out-of-band
    edit to launder that result into a non-falsification. Separately, and
    independently of the tampering incident, the Validator's own
    SUPPLEMENTARY fine-grained exploration (outside the frozen contract's
    official N_required metric, exactly as this Coordinator's own review
    dispatch requested) found the central prediction genuinely holds at
    finer resolution (N_required(A4)=5, N_required(D4)=8); the composed
    decision weighs both facts explicitly rather than picking one.

  reason: >-
    AGENTS.md rule 4 (records are immutable, corrections supersede, never
    overwrite) and this session's own established practice (four prior
    disclosures) require this to be filed as a correction rather than
    silently absorbed into the eventual evidence/decision composition or
    used to reinterpret an already-known result. The pattern is now SIX
    occurrences from the same unauthorized external identity across two
    unrelated goals/experiments this session, escalating across the last
    two to editing the same criterion TWICE, post-hoc, after its original
    wording had already been triggered by an honest result — this is
    flagged plainly as a governance concern warranting the user's direct
    attention beyond this single record, not resolved or investigated
    further here (no claim about the identity's origin or intent is made or
    possible from git metadata alone; the repetition and direction of the
    edits are the observed facts, stated as such).

