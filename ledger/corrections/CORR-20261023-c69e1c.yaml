  prior_value: Quoted verbatim per item in items[].prior_value.
  corrected_value: Per item in items[].corrected_value.

  items:
    - id: U1
      field: user_hypothesis_clauses.smart_works_only_for_trace_one
      prior_value: >-
        "Consistent at toy scope: Smart recovers d on every non-split lift of
        an anomalous curve (EXP-CZLIFT-17b7eb) and on no lift of a
        non-anomalous curve (EXP-CZLIFT-ae0a13)."
      corrected_value: >-
        Anomalous half: Smart recovers d on every row with
        v_p(j(E^) - j_can) < 2e (2052 of 2052 per seed, p <= 1373; 1152 of
        1152 pert_p rows at 10^4 <= p <= 10^5). This is Smart's theorem with
        operative condition "P has no p-torsion lift" (equal to "E^[p]
        non-split" because #E(F_p) = p); the runs calibrate it. Non-anomalous
        half: "on no lift" is not what was measured. For the three named
        choice-free sections and the identity readout, Smart's ratio equals d
        at a rate consistent with 1/p (chance), with a per-arm detection floor
        of 4.2x to 5.2x of 1/p; the functional vanishes identically on the
        torsion section (derivation); any section whose tau-ratio is an
        efficiently invertible function of d recovers d and is a discrete-log
        oracle. Review-side (not a run record), an integral section on a
        small-coefficient global model recovers d exactly at the integral
        multiples of a small global lift (37a1 short model, 1420 of 1420 rows
        at d in {2..6} over 284 non-anomalous primes), a Siegel-finite set with
        no discrete-log leverage. H2's "the one lifting attack that works"
        stays the user's wording.
      basis: [EV-CZLIFT-712fe4, EV-CZLIFT-e9a7cf, EV-CZLIFT-ad28f5 B-3/B-5, EV-CZLIFT-f2a401 OBS-9/B-4/B-5]
    - id: U2
      field: user_hypothesis_clauses.noise_for_trace_not_one_comes_from_the_lift_choice
      prior_value: >-
        "Refined: the noise is exactly the non-canonical part tau of the
        section (identity_rate = 1.0); the canonical part contributes zero, so
        no choice of lift removes it."
      corrected_value: >-
        The Smart ratio equals the tau-ratio for every section (identity_rate
        1.0 on 3 x 1116 section-rows; derivation). No homomorphic section
        removes the noise, because the only homomorphic section is s_tor, on
        which the functional vanishes; any section that removes it is a
        discrete-log oracle (s_leak and the planted f-sections have
        identity_rate 1.0 and zero noise); the three tested choice-free
        sections do not remove it at toy scale. "So no choice of lift removes
        it" is not established and is false for s_leak.
      basis: [EV-CZLIFT-ad28f5, red-team O2 of RT-20261023-5636c1]
    - id: U3
      field: user_hypothesis_clauses.serre_tate_gives_no_canonical_lift_of_points
      prior_value: >-
        "Contradicted at toy scope: the prime-to-p torsion section is a
        canonical, computable, homomorphic section on every lift of a
        non-anomalous curve."
      corrected_value: >-
        Contradicted by a derivation uniform in p (p >= 5, n prime, n != p, any
        good-reduction Z_p-lift; analysis.md I-A, D1 to D6), not only at toy
        scope; the runs check the instruments against it (1116 of 1116 pairs).
        The counterexample does not use Serre-Tate: s_tor exists on every
        lift. The Serre-Tate-specific canonical point lift is the
        Frobenius-fixed section on the canonical lift (equal to s_tor; 16 of
        16 j = 0 curves, rt_probe C), and on anomalous split lifts the
        p-torsion lift. "Toy scope" applies only to the measured success
        rates.
      basis: [EV-CZLIFT-ad28f5, red-team O4 of RT-20261023-5636c1]
    - id: U4
      field: user_hypothesis_clauses.a_computable_canonical_section_would_be_a_full_break
      prior_value: >-
        "Contradicted at toy scope: that section exists at O(log n + k log p)
        additions and the formal logarithm vanishes on it; on anomalous curves
        the canonical curve lift is the one lift where Smart fails."
      corrected_value: >-
        False by derivation uniform in p under every reading in which
        "canonical" constrains the section, and circular under the remaining
        reading. s_tor costs at most 2(bits(n) + bits(p^k)) + 1 complete
        additions, the Smart functional vanishes identically on it, and it
        carries the discrete-log relation isomorphically into E^(Q_p)[n],
        where it is no easier. This answers the formal-logarithm readout only;
        coordinate and digit encodings of s_tor are open (KN-OPEN-d3a6f0,
        KN-OPEN-3417fc). Second sentence: on anomalous class-number-one CM
        curves Smart's precision-p^2 attack fails exactly on the lifts with
        v_p(j(E^) - j_can) >= 2e, i.e. the canonical lift AND every lift
        congruent to it to that order (this record's own table: canonical,
        isomorphic and pert_p2 classes degenerate on 1.0 of samples, pert_p on
        0.0172), not on the canonical lift alone. It is known
        (Serre-Tate/Kummer theory; Belding 2007, section 7), and the
        experiment calibrates it rather than discovering it.
      basis: [EV-CZLIFT-ad28f5, EV-CZLIFT-712fe4, DEC-20261023-147f9f limitations, KN-FIND-3c7e19, KN-FIND-7e2b94]
    - id: U5
      field: user_hypothesis_clauses.global_lifts_fail_by_counting
      prior_value: >-
        "Consistent at toy scope: N_E(H) grows like (log H)^{r/2}, reductions
        cover E(F_p) like uniform points, and log log H_half scales like (2/r)
        log p."
      corrected_value: >-
        Already superseded at clause level by DEC-20261023-26a6de; restated
        here. Growth law consistent at toy scope (C1; ladder ranks 0..7,
        H <= 3e5). "Reductions cover E(F_p) like uniform points" is
        contradicted as stated (post hoc calibrated nulls; median 1.0330 /
        1.0333 against uniform upper edges <= 1.0041; structured
        kernel-floor model fits). H_half scaling is consistent but derived
        from C1, and not uniform in p (H_half infinite where the image index is
        >= 3, e.g. 37a1 at p = 211, 293). The global-lift obstruction is the
        fixed-rank counting bound (half coverage needs >= N_p/2 distinct global
        points), not uniformity; beyond toy scale it holds only under T1 to
        T4.
      basis: [DEC-20261023-26a6de, EV-CZLIFT-376eee]
    - id: R1
      field: criterion_readings.EXP-CZLIFT-ae0a13.reading, last sentence
      prior_value: >-
        "Every non-torsion section's Smart ratio equalled its tau-ratio on
        every pair, and its success rate sat at the 1/p reference (all |z| <
        2) on the CM-canonical and the arbitrary-lift arm alike."
      corrected_value: >-
        Every non-torsion section's Smart ratio equalled its tau-ratio on every
        pair. Per arm and seed, each section's identity-readout success rate
        was consistent with 1/p (frozen |z| <= 1.88), and the frozen test
        excludes only excesses of about 4.2x to 5.2x of 1/p and above. "Alike"
        across arms is not established by the frozen arm comparison, which is
        confounded (family, p, n, class number) and powerless below about
        12x to 20x; it rests on the per-arm tests and the red team's
        matched-lift control for the identity readout only. Structurally the
        lifts are not alike: on the canonical j = 0 lift the Teichmuller
        section is Aut(E^)-equivariant (16 of 16), and on a perturbed lift it
        is not.
      basis: [EV-CZLIFT-ad28f5 B-4/B-6/OBS-9, red-team O5 of RT-20261023-5636c1]
    - id: R2
      field: criterion_readings.EXP-CZLIFT-ae0a13.claim_boundary, last sentence
      prior_value: >-
        "The asked-for computable canonical section exists and carries no
        information about d at this scope."
      corrected_value: >-
        The asked-for computable canonical section exists (on every lift, by
        derivation). It carries the whole discrete-log relation:
        s_tor(Q) = [d] s_tor(P) (scalar_mult_equivariance_rate 1.0). It is the
        Smart (formal-logarithm) functional that vanishes identically on it;
        s_tor moves the DLP isomorphically into E^(Q_p)[n], where it is no
        easier. Nothing is claimed about other readouts of the non-torsion
        sections (one readout tested; planted oracles pass it).
      basis: [EV-CZLIFT-ad28f5 (B-2), red-team O3 of RT-20261023-5636c1]
    - id: R3
      field: criterion_readings.EXP-CZLIFT-ae0a13.runs[RUN-CZLIFT-dab752].arm_difference_z.hensel_random, success_criterion_met_on_this_run, and pairs_total of both runs
      prior_value: >-
        "arm_difference_z: hensel_random: null" with "arm_difference_note: a
        null z-score means both arms had zero successes on that section,
        difference exactly 0" and "success_criterion_met_on_this_run: true";
        "pairs_total: 557" (RUN-CZLIFT-dab752) and "pairs_total: 559"
        (RUN-CZLIFT-5b2581)
      corrected_value: >-
        The hensel_random arm-difference entry on seed 20261009 (0/371 against
        0/186) is NOT EVALUABLE, not "met"; the success criterion is met on
        every evaluable entry, and the arm-difference entries carry no weight
        in either direction (confounded and powerless). The pairs totals
        reflect 36 of 1152 attempted samples skipped by a rule in the frozen
        run.py (S = O at d2 = n - 1) that the specification does not state;
        the exclusion is outcome-independent (validator replay probe). No
        recorded value changes.
      basis: [DEC-20261023-36b4f0 validity_check and criterion_reading, EV-CZLIFT-ad28f5 OBS-6/B-4, red-team O8]
    - id: R4
      field: criterion_readings.EXP-CZLIFT-17b7eb.reading, degenerate-digit clause
      prior_value: >-
        "and the degenerate precision-p^3 ratio equals d at the 1/p reference
        within one standard error"
      corrected_value: >-
        The degenerate next-digit success count, on the governing definition
        (every row with v_p(z([p]P^)) >= 2; CORR-20261023-1869c3), is
        consistent POOLED with the matching random-section null 1/(p+1)
        (93 and 87 against 86.84 expected; z = +0.68, +0.02; exact
        lift-conditioned z = +1.54, +0.75; CORR-20261023-9f2176). It is not 1/p
        per cell for deterministic sections: on j = 0 lifts with A = 0 mod p^2
        the Teichmuller section never succeeds on d in mu_6 minus {+1, -1}.
        The frozen criterion reading (met on both seeds against 1/p) stands.
      basis: [DEC-20261023-147f9f, EV-CZLIFT-712fe4, CORR-20261023-1869c3, CORR-20261023-9f2176]

