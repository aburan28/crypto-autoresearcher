  prior_value: >-
    experiments/EXP-IC-002/specification.yaml reads `status: approved`,
    `approved_by: coordinator`, and carries an `execution_authorization`
    clause stating: "Execution is authorized only after TASK-20260727-004
    returns PASS in a non-originating independent session. A REVISE or FAIL
    verdict blocks TASK-20260727-005 and requires a versioned
    protocol_amendment before any run." Read in isolation, this field set
    describes an experiment that is APPROVED AND CONDITIONALLY EXECUTABLE
    pending a passing review of its (now-existing) v1_to_v2 amendment --
    which is exactly how this session initially read it, dispatching an
    independent validator review of that amendment under the working
    assumption that a PASS verdict would clear EXP-IC-002 for dispatch.
  corrected_value: >-
    This premise is superseded by ledger/decisions/DEC-20260727-008.yaml
    (decided_by: coordinator, decided_at: 2026-07-27), the later and
    authoritative ruling on this exact contract, which states verbatim: "It
    does not authorize execution of EXP-IC-002 or of any successor. Both
    independent reviews withheld execution authorization and neither is
    overridden here; EXP-IC-002 is closed unexecuted rather than approved."
    This decision also moved H-IC-001 to status: weakened (citing EV-IC-002),
    a status ledger/hypotheses/H-IC-001.yaml still carries. DEC-20260727-008
    is dated the same day as EXP-IC-002's own approved_at and postdates it as
    the governing word: the specification's own execution_authorization
    clause was never updated to reflect that the conditional path it
    describes was subsequently closed off entirely, not merely left pending.
    EXP-IC-002 is therefore not an approved contract awaiting one more
    passing review -- it is a deliberately, permanently closed contract by
    explicit prior user/Coordinator direction, and no amendment, however
    well-drafted, reopens it without a new Coordinator decision that
    explicitly supersedes DEC-20260727-008 on the record.
  reason: >-
    Discovered by this session while acting on the (session-dispatched,
    independent) validator review of amendments/v1_to_v2.yaml
    (coordination/goals/GOAL-ECDLP-001/reviews/TASK-run-experiment-ic002-amendment-review/review_report.yaml,
    verdict: REVISE). That review's own critical_premise_correction field
    flagged the DEC-20260727-008 closure -- this session had not itself
    checked ledger/decisions/ for a governing ruling on EXP-IC-002 before
    dispatching the review, trusting specification.yaml's plain approved
    status and execution_authorization clause instead, the same failure
    class already documented for six other contracts in
    DEC-20260807-5adc24 and for EXP-SSI-697354 in CORR-20260906-6c3f35. No
    run was dispatched or produced against EXP-IC-002 by this session --
    the review gate this session itself invoked (never execute without a
    passing independent review) caught the problem one step before it would
    have caused real harm, but the premise under which the review was
    requested was still wrong and is corrected here so no future session
    repeats it from the same stale field.
  evidence_artifacts:
