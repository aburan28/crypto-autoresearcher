      DEC-20261002-3ba55f is first contained in first-parent main commit
      6eabad25a8 (2026-10-02T07:39:23-07:00). There are 134 decisions with
      goal_id GOAL-ECDLP2M-001 that are present at origin/main
      3e05e9d159092d47651e72142a8065a669c05613 and absent at 6eabad25a8.
    the_case_that_matters: >-
      DEC-20261002-08c3f8 (goal_id GOAL-ECDLP2M-001, decision approve, both
      fields read in this checkout). Its adding commit is 9a7849e443, dated
