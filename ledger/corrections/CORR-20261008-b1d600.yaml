      date method left it out. It reached main by first-parent merge
      630bcb3930 at 2026-10-02T10:15:12-07:00 (17:15:12Z), after 6eabad25a8
      (14:39:23Z). It is line 48 of the presence list. The commit hashes and
      dates are the session's and were not re-checked here, because this agent
      has no shell.
