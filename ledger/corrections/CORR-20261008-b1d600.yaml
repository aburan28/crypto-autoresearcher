  # ---------------------------------------------------------------------------
  defect:
    what_the_session_did: >-
      To answer the card's dispatch precondition ("which later decisions on
      this goal are on origin/main after git fetch"), the session listed the
      DEC records with goal_id GOAL-ECDLP2M-001 whose ADDING COMMIT was dated
      after the adding commit of DEC-20261002-3ba55f (2026-10-02T14:00:44+00:00).
      It listed 64.
    why_that_is_wrong: >-
      The date of a record's adding commit is when the record was authored on
      some branch. It is not when the record reached main. A decision written
      before 3ba55f's adding commit but merged into main after it is absent from
      such a list. The correct test is tree membership. A record is "later on
      origin/main" when it is present in the tree at origin/main and absent
      from the tree at the first first-parent main commit that contains
      DEC-20261002-3ba55f.
