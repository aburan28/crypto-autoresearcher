  run_ids: [RUN-DREG-001-VALIDATE-N12-A, RUN-DREG-001-VALIDATE-N15-A, RUN-DREG-001-VALIDATE-N18-A,
    RUN-DREG-001-VALIDATE-N12-NULL, RUN-DREG-001-VALIDATE-N15-NULL,
    RUN-DREG-001-CONTROL-N12-DET, RUN-DREG-001-CONTROL-N12-PARTB,
    RUN-DREG-001-DFF-N12-SEM-c, RUN-DREG-001-DFF-N12-SEM, RUN-DREG-001-DFF-N12-SEM-b]
  type: empirical
  direction: neutral
  strength: preliminary
  observations:
    - "INSTRUMENT VALIDATION PHASE COMPLETE — these are the specification's
       validation anchors and controls, gating any past-wall measurement; they
       are not by themselves hypothesis evidence."
    - "Anchor 1 PASS: block-m4ri rank at n=12 sem D5 = 28,096 (deficit 1,322
       vs sr_pred 29,418) — exact match to the h012 series; completed_valid,
       28.2 s work, system_hash c47d17c3."
    - "Anchor 2 PASS: block-m4ri rank at n=15 sem D5 = 69,073 (deficit 1,862
       vs sr_pred 70,935) — exact match to the independent one-call m4ri cell
       (inputs/h100_session/h012b_denseT_n15f.json); completed_valid, 316.7 s
       work, 5 units, system_hash 23c234ed."
    - "Anchor 3 PASS (executor completion, 2026-07-18T20:01:29Z): block-m4ri
       rank at n=18 sem D5 = 143,882 (deficit 1,999 vs sr_pred 145,881) —
       exact match to the two prior engines (peel+core and dense m4ri, H100);
       completed_valid, 3,212.0 s work, 15 units, wall 3,775.0 s, peak RSS
