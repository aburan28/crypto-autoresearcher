    - "Controls PASS: same-seed re-run reproduces n=12 sem 28,096 with
       identical system_hash (determinism); chunk 8,000 vs 12,000 partition
       reproduces 28,096 (checkpoint-partition consistency at mechanism
       level); block-m4ri matches dense-m4ri cells at n=15 and n=18 (engine
       cross-validation)."
    - "Deficit series reproduced bit-identical by the new instrument:
       1,322 / 1,862 / 1,999 at n = 12 / 15 / 18 (full exact, sem arm, D=5).
       Increments +540 then +137: decelerating relative to rank growth within
       the wall; the growth clause past n=18 remains untested."
    - "d_ff (sem, ic_first_fall algorithm, max_D=6): n=12 d_ff = 3 at ti=0
       and 2 at ti=1 (2 of 8 targets; cell then censored). Single samples;
       no distribution claim. Prior series had flat 2 where resolved."
    - "Unexpected observation (recorded per AGENTS rule 8): sem Macaulay
       column support covers 84.2% / 82.2% / 80.8% of C(nb,<=5) at
       n = 12 / 15 / 18, decreasing with n, while the support-matched null
       covers 100%. A structural signature distinct from the rank deficit."
    - "CENSORING (stopping rules; not evidence, AGENTS rule 5): n=17 sem and
       n=17 null full-rank cells (incl. review correction C1: sr_pred_D =
       126,922 unverified), n=21 and n=24 cells, d_ff ladders past n=12, and
       null-arm d_ff were not run — coordinator handoff budget (3,000 s wall,
       12 runs, 600 s kill rule) was consumed by the anchors; measured cost
       model: n=17 ~1,300-2,000 s, n=21 ~7-9 h, n=24 ~2-3 days per cell."
    - "d_ff n=12 sem cell censored mid-run at ti=2: non-preemptible C-level
       sparse echelon defeated the SIGALRM cap; executor killed the cell at
       1,027 s per the stopping rule. Two failed_infrastructure driver-debug
       runs (Sage preparser Integer/RealDoubleElement JSON serialization)
       preserved with manifests."
    - "Artifact discipline verified: manifests carry commit, dirty-tree status
       hash, per-dependency sha256, system_hash per system, timing, peak RSS,
       and per-file artifact checksums — full compliance with
       docs/evidence-and-reproducibility.md. See
       experiments/EXP-DREG-001/analysis.md for the full censoring table,
       deviations D1-D7, and the resume cost model."
  inference: >-
    All five validation anchors and all controls pass, so the checkpointable
    block-m4ri instrument is validated for the n=17..24 ladder that decides
    RQ-DREG-001 (the honest ledger's D6), and the within-wall deficit series
    1,322 / 1,862 / 1,999 plus null == sr_pred at n<=15 are reproduced
    bit-identically. No past-wall cell was measured within the session budget,
    so the hypothesis itself is untouched: none of the success or falsification
    clauses of H-DREG-001 is evaluable from this data. The decisive cells
    (n=17 sem/null first) are costed and resumable from the preserved
    checkpoints.
  boundaries:
    - "Measured cells are n <= 18, D = 5, ti = 0 (plus d_ff ti = 0..1 at
       n=12): at/below the old wall except the n=18 anchor, which re-measures
       a known cell rather than new territory."
    - "The n=17 null full-rank cell (review correction C1) remains unmeasured;
       sr_pred_D = 126,922 still rests on prediction only."
    - "Timings carry a contention caveat (foreign-session h012c probes on the
       same host); ranks are exact integers and unaffected."
  unresolved_confounds:
    - "Past-wall behaviour of the deficit (growth vs deceleration) is exactly
       what remains unmeasured; the deceleration inside the wall cannot be
       extrapolated (phase-transition question)."
    - "d_ff distribution needs >=8 targets per n; only 2 resolved at n=12
       (values 3 and 2)."
    - "Checkpoint-partition consistency is demonstrated at n=12 only; the
       per-cell two-partition control for past-wall cells has not yet been
       exercisable."
  reviewed_by: coordinator
