    - "Null-arm anchors PASS (executor, this session): n=12 null rank = 29,418
       == sr_pred exactly (RUN-DREG-001-VALIDATE-N12-NULL); n=15 null rank =
       70,935 == sr_pred exactly (RUN-DREG-001-VALIDATE-N15-NULL, two
