research_question:
  id: RQ-JET-001
  title: "Does the first-jet (dual-number F_p[eps]/eps^2) split of the m-point summation relation buy a per-relation cost/survival trade over the serial-S3 harvester - i.e., is C_lin < (1-sigma)*C_nonlin at equal hit probability?"
  scope:
    curve_families: ["ordinary prime-field short-Weierstrass, prime-order group (cofactor 1); anomalous, singular, supersingular, char 2/3 excluded"]
    field_types: [F_p]
    bit_sizes: ["toy p in {101, 211, 431} plus 1009 stress (~2^10)"]
    methods: ["m=3 chained Semaev S3 resultant harvester", "first-jet eps-block linear screen", "instrumented F_p-op counting"]
  motivation: "Candidate A1 (research_directions_20260717.md). The eps-component of the EC addition law over F_p[eps]/eps^2 is F_p-linear in the jet coordinates (formal-group linearization). If an a-priori linear tangent screen could reject candidates below the exact zeroth-order S_m test's cost, per-relation cost would drop below the serial-S3 state-growth cost (ledger NR-1477 context). Nearest ledger entries ECFG-NR-1477 (serial-S3 state growth), P1480 (SMT backend), ECFG-NR-1399/1400 (x-only S3 quotients), PO-004/NR-022 (Weil pullback) all keep the equation set fixed or remove information; A1 adds the infinitesimal direction."
  decision_target: "Whether the tangent screen has measured survival sigma < 1 with C_lin + sigma*C_nonlin < C_nonlin at equal p_m, sufficient to cross the candidate's quantitative promotion gate."
  status: active
  owner: coordinator
