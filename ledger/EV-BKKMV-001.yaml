  inference: "On the tested range the sectioned Semaev family is box-saturated: MV_m = (m-1)!*2^((m-1)(m-2)) exactly, strictly and increasingly below the total-degree Bézout order (ratio (m-1)!/(m-1)^(m-1), Stirling decay e^-(m-1)*sqrt(2 pi (m-1)) if the pattern persists), and exactly equal to the multi-graded box Bézout number. Whether this is a B2 opening or barrier depends on the Bézout convention the program charges; both numbers are on record."
  boundaries:
    - "Toy prime fields: counts at p in {101,431,1009} (m=5: p=101 only), certification at p ~ 2^20 + QQ cross-check at m<=4; no crypto-scale claim (rule 7)."
