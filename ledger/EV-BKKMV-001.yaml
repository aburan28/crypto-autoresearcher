    d2_gate: "3-point-certified growth law with exponent statement: MV_m = (m-1)!*2^((m-1)(m-2)) exactly at m = 3,4,5 on 3 curves x 2 cert primes (+QQ at m<=4); increments strictly below Bézout_total's at both measured steps; MV/Bézout_total = 0.5, 2/9, 3/32 (decreasing, exact Stirling form); MV/Bézout_box = 1.0 exactly. Not an asymptotic proof for m >= 6; CI language inapplicable (exact integer values, no statistical noise)."
