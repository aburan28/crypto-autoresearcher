  hypothesis_id: H-SIG-001
  experiment_ids: [EXP-SIG-005]
  run_ids:
    - RUN-EXP-SIG-005-a   # gate: C1/C2/C3/C4a PASS, n=24 filter probe
    - RUN-EXP-SIG-005-b   # P1: n=24 sem seeds 1,2,3
    - RUN-EXP-SIG-005-c   # P1: n=24 null seeds 1,2,3
    - RUN-EXP-SIG-005-d   # P1: n=24 s1 determinism repeat
    - RUN-EXP-SIG-005-e   # P1: determinism compare (identical)
    - RUN-EXP-SIG-005-f   # P2 n=12 D6 attempt (pre-fix, killed mid-D6, invalid)
    - RUN-EXP-SIG-005-g   # P2 n=12 D6 attempt (killed mid-D6, invalid)
    - RUN-EXP-SIG-005-h   # P2 n=9 sem full D6 (residual_6 measured)
    - RUN-EXP-SIG-005-i   # P2 n=12 sem residual_6 (killed: invalid-by-control, telemetry)
    - RUN-EXP-SIG-005-j   # residual_5 extension n=18 seed 1 (D6 skipped)
    - RUN-EXP-SIG-005-k   # P2 n=9 NULL D6 control -> FAIL (C5)
    - RUN-EXP-SIG-005-l   # n=12 NULL: D3/D4/D5 clean; D6 count ENOSPC-censored
    - RUN-EXP-SIG-005-m   # residual_5 replication n=18 seed 2 (D6 skipped)
    - RUN-EXP-SIG-005-n   # n=21 residual_5: killed after D4 (memory); relaunch ENOSPC'd; infra-censored
  type: empirical
  direction: supports          # for D<=5; the D6 extension is invalid (see below)
  strength: replicated
  claim_tier: toy
  observations:
    - "P1 (2n/3+1 D4-residual law at n=24) CONFIRMED. On n=24 sem seeds 1,2,3
       (RUN-b), zero within-size variance: D3 non-Koszul count = 1; D4 deficit =
       64 = 8n/3; D4 residual = 17 (BOTH pinned early-break and canonical
       full_reduce; delta 0) = 2n/3+1; union cross-check rank 47 == canonical.
       Null arm (RUN-c) all-zero (deficit 0, residual 0) on all 3 seeds;
       determinism repeat (RUN-d) and formal compare (RUN-e) identical modulo
       timing. The canonical D4 residual series 9/11/13/15/17 at n=12/15/18/21/24
       is exactly 2n/3+1 across SIX on-lattice sizes; linear growth in n."
    - "residual_5 (D5-born non-rewritable component = extra_5 - A4_5) EXTENDED and
       found NON-MONOTONE in n. Values: 344 (n=9, anomalous size), 878 (n=12,
       reproduces EV-SIG-003), 1158 (n=15, reproduces EV-SIG-003), 974 (n=18).
       The n=18 value 974 is REPLICATED across two seeds (RUN-j seed 1 = 974;
       RUN-m seed 2 = 974; zero seed variance). Increments +534/+280/-184: the
       component rises through n=15 then DROPS at n=18 -- it does not grow
       monotonically in n. Each cell is null-validated (D5 null extra=0,
       rank==sr_pred: RUN-l n=12 null D5 deficit 0; EV-SIG-003 nulls)."
    - "Cross-instrument continuity: the SIG D5 Macaulay deficit equals the
       independent EXP-DREG-001 block-m4ri deficit at every shared n: 1321/1322
       (n=12 instance var), 1862 (n=15), 1999 (n=18, RUN-j/RUN-m). The two
       instruments agree exactly. On-lattice (n=0 mod 3) D5 deficit series:
       909 (n=9, RUN-h) / 1322 (n=12) / 1862 (n=15) / 1999 (n=18), increments
       +413/+540/+137 -- monotone increasing, sharply decelerating at n=18."
    - "P2 D6 BIRTH-LAW MEASUREMENT INVALIDATED BY ITS OWN NULL CONTROL (C5).
       At n=9 the support-matched NULL fails at D6 (RUN-k): the null D6 Macaulay
       has ncols=31180 (vs the sem's 29332 -- the two arms are NOT the same
       size at D6), rank=31179 (near-saturating its own columns), against the
       shared prediction sr_pred=28068 which matches NEITHER arm -- the null
       OVERSHOOTS by 3111 (deficit=-3111), giving extra=4986 and residual_6=4986,
       all of which must be 0 for a semi-regular null. C5 controls report
       c5_null_zero_d6_extra_and_rank=False, c5_null_residual6_zero=False. The
       null is exactly semi-regular through D3/D4/D5 (extra=0, rank==sr_pred at
       every lower degree) and breaks ONLY at D6."
    - "CONSEQUENCE: the sem D6 quantities from RUN-h (residual_6=2615,
       extra_6=8897, deficit_6=776) are NOT admissible as evidence -- they are
       computed against the same broken D6 baseline (sr_pred miscalibrated;
       arms not comparable). This is the 'miscalibrated D6 null' pre-excluded in
       H-DREG-001 assumptions, now directly demonstrated. The residual_D birth
       law and the whole cascade characterization are trustworthy ONLY for D<=5."
    - "Controls: GATE (RUN-a) PASS (C1 null residual 0 both reductions n=9,12;
       C2 injected 3-generator syzygy detected; C3 T2 anchor n=15 s1 D3 def1/D4
       def40/pinned res10/canon11; C4a in-run determinism identical; n=24 filter
       probe all standard). C9 continuity: RUN-h/RUN-j reproduce the EXP-SIG-003
       n=12/n=18 anchors exactly (residual_5=878 at n=12; residual_4=13, D5
       deficit=1999 at n=18). D6 cross-checks WITHIN RUN-h all pass internally
       (A3<=A4<=A5<=extra_6, union==merged==independent) but are moot given the
       C5 null failure that invalidates the D6 baseline."
    - "INFRASTRUCTURE CENSORING (AGENTS rule 5, NOT evidence): (i) the n=21
       residual_5 point is unmeasured -- RUN-n was killed after D4 to relieve
       memory pressure, and its relaunch hit the host root disk at 100% (ENOSPC)
       and never created a directory, so n=21 D5/residual_5 was not reached; (ii)
       RUN-l (n=12 null) completed D3/D4/D5 (all clean, extra=0) but its D6 count
       stage was killed by the same ENOSPC before flushing, so the n=12 null D6
       replication of the C5 failure is not recorded; (iii) RUN-i (n=12 sem
       residual_6) was deliberately killed once RUN-k proved the D6 stage invalid
       (no point spending ~30-60 min on an invalid cell); its partial is retained
       as telemetry. RUN-f/RUN-g (prior-session n=12 D6 attempts) were killed
       mid-D6 and are invalid. The disk pressure originates from unrelated
       host data, not this experiment."
  inference: >-
    Numbers only (the status decision belongs to the Coordinator). At D<=5, where
    the support-matched null is exactly semi-regular, the evidence SHARPENS
    H-SIG-001: the D4 non-rewritable residual law residual=2n/3+1 is confirmed at
    n=24 (six on-lattice sizes, linear in n), and the D5-born component residual_5
    is now measured to n=18 and found NON-MONOTONE (344/878/1158/974 at
    n=9/12/15/18, the n=18 drop replicated on two seeds). At D=6 the measurement
    is INVALID: the null control fails (arms differ in column count; sr_pred
    matches neither; null extra/residual != 0), so neither the sem residual_6
    'birth-law explosion' nor the sem deficit_6 can be read -- the degree axis is
    not validly measured past D=5. The cascade driving the DREG deficit is real
    and confirmed through D=5, but its n-growth is weak (linear D4, non-monotone
    D5) and its degree-axis continuation is currently unmeasurable with this
    instrument.
  boundaries:
    - "Toy scale: boolean chained Semaev m=3, t=3, ti=0. P1 n=24, seeds 1-3.
       residual_5 n in {9,12,15,18}, D=5. D6 attempted only at n=9 (invalid) and
       n=12 (censored). Single curve family; rank/count arguments only, no
       solver-impact or d_reg claim."
    - "n=9 is the documented anomalous size (residual_4=24 vs law 7; deficit_4=41
       vs 8n/3=24); the only complete D6 column is at n=9 AND is invalid."
    - "The D5 deficit deceleration (+413/+540/+137) is a 4-point on-lattice
       observation; n=21 (which would test whether the +137 deceleration
       continues) is ENOSPC-censored, not measured."
    - "sr_pred is cross-validated by the null only through D=5; at D=6 it is
       demonstrably miscalibrated (null overshoot). No CI methodology beyond
       zero-variance seed replication."
  unresolved_confounds:
    - "Whether the residual_5 n=18 drop (1158->974) is the onset of decline or a
       lattice fluctuation -- n=21+ residual_5 needed (ENOSPC-blocked here)."
    - "Whether the on-lattice D5 deficit deceleration continues at n=21/24 or the
       deficit resumes climbing (the EV-DREG-002 phase-transition confound)."
    - "The correct D6 semi-regular baseline: the null must be re-derived so its
       D6 support matches the sem (equal ncols) and sr_pred is recalibrated,
       before any D6 non-rewritability, deficit, or birth-law claim is admissible."
    - "Whether d_reg(sem) < d_reg(null): unevaluable -- no cell reaches full row
       rank at its top computed degree (fixed-degree proxies only)."
  reviewed_by: coordinator
