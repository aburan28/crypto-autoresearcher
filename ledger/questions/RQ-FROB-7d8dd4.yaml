research_question:
  id: RQ-FROB-7d8dd4
  added: '2026-09-06'
  title: >-
    Frobenius exploitation in subfield-curve index calculus. For an elliptic curve
    E defined over F_q and attacked over the extension F_{q^n}, does the q-power
    Frobenius endomorphism reduce the fully charged cost of index calculus on
    E(F_{q^n}) (factor base, relation collection, decomposition system, linear
    algebra, descent) by more than the trivial n-fold factor-base symmetry, and
    does the residual cost still exceed Pollard rho with the matching sqrt(n)
    Frobenius-class speedup?
  scope:
    curve_families:
      - >-
        subfield curves: ordinary curves E/F_q with q a small prime or prime power,
        considered over F_{q^n} with n prime, in the subgroup of prime order not
        contained in any proper subfield (the object)
      - >-
        curves defined over F_{q^n} only, of the same field size and subgroup
        order magnitude, as the null object (no Frobenius endomorphism beyond the
        q^n-power identity on rational points)
      - >-
        characteristic-two Koblitz-shaped toy curves and odd-characteristic
        subfield curves; deployed Koblitz parameters are never instances
    field_types: [binary, small-characteristic, odd-characteristic extension]
    bit_sizes:
      - >-
        toy: q^n from about 2^16 to about 2^40, n prime between 5 and 41, chosen
        so that matched index-calculus and rho pipelines both complete
      - symbolic work for the Frobenius-invariant decomposition systems at all n
    methods:
      - >-
        index calculus with a Frobenius-invariant factor base (orbits of size n),
        Semaev summation polynomials and Weil descent to F_q (Gaudry, Diem,
        Joux-Vitse style; KN-LIT-010 as the ledger's experimental exemplar), with
        Frobenius-orbit relation multiplication
      - >-
        symmetry reduction of the decomposition system by the Frobenius action
        (invariant-ring rewriting) and its effect on solving degree and
        first-fall degree
      - >-
        GHS Weil descent as the classical subfield-curve attack family (KN-LIT-007,
        KN-LIT-090, KN-LIT-6987, KN-LIT-449) named as prior art and as the
        comparison row where it applies
      - >-
        Pollard rho on Frobenius equivalence classes (the sqrt(n) speedup) as the
        matched baseline; the baseline must exploit the same symmetry the attack
        exploits
  motivation: >-
    User-supplied target (2026-09-06, verbatim): 'Frobenius exploitation in
    subfield-curve index calculus'. Named by the user as a tractable target with a
    sound verifier. On subfield curves the q-power Frobenius acts on E(F_{q^n}) as
    an endomorphism of small norm, which is exactly what makes them fast for
    implementers and is a known lever for attackers: Pollard rho on Frobenius
    classes gains sqrt(n), and in index calculus a Frobenius-invariant factor base
    turns one relation into n and shrinks the linear-algebra dimension by n. Those
    two gains are constant-factor. The open content is whether the Frobenius
    structure can be pushed into the expensive step -- point decomposition through
    summation polynomials after Weil descent -- where an invariant rewriting could
    lower the solving degree or the number of variables and so move the exponent
    of the relation-collection step rather than its constant, and whether the
    fully charged pipeline then beats the Frobenius-accelerated rho at any toy
    scale. The ledger has extensive prime-field Semaev work that explicitly
    excludes Weil descent (RQ-PFDR-ae2fba, RQ-SBRG-f31cb2, RQ-SATIC-1ae57a,
    RQ-ECDLP-f0a7b0, GOAL-RELN-001), the GHS literature records above, KN-LIT-010
    (Semaev polynomials with Weil descent and Groebner bases, experimental study),
    KN-LIT-1402 (subfield curve search) and KN-LIT-3685 (endomorphisms for faster
    scalar multiplication on a large class of curves), and the trapdoor question
    RQ-ECTD-001. No question, hypothesis or proposal on the ledger measures the
    Frobenius gain in index calculus on a subfield curve against a matched
    non-subfield null object. The sound verifier: the object and the null object
    differ in exactly one property (defined over F_q or not) at matched field size,
    subgroup order and factor-base size, every relation is a checkable identity in
    the group, every solved logarithm carries a certificate [x]P = Q, and the
    charged cost of each pipeline stage is measured on both arms, so the Frobenius
    gain is a difference of two measured numbers, stage by stage.
  decision_target: >-
    Either (a) a measured, stage-by-stage Frobenius gain on the object versus the
    null object across the toy ladder, with the factor-base and linear-algebra
    gains reported as constants (and checked against the predicted factor n) and
    the decomposition-step gain reported as an exponent or degree difference with
    its interval; a gain confined to the constant factor n on the factor base and
    n^2 on linear algebra, with no change in decomposition degree or relation
    yield per attempt, closes the question negatively for the tested constructions
    and is recorded as such; or (b) a Frobenius-invariant decomposition system
    with a measured lower solving degree or fewer variables than the plain system
    at the same (q, n, m), replicated on at least two curves and absent on the
    null object, together with the fully charged pipeline cost compared to
    Frobenius-class rho at the same instances; a pipeline that beats rho at toy
    scale triggers replication and independent review before any scaling claim.
    Toy-scale evidence authorizes scaling work only. Nothing here bears on
    prime-field curves or on GOAL-ECDLP-001.
  constraints:
    - >-
      The null object is mandatory in every measurement: a curve over F_{q^n} not
      defined over any proper subfield, at matched size, run through the identical
      pipeline with the identical factor-base size.
    - >-
      The rho baseline must exploit Frobenius classes (and the negation map) on
      the object; comparing an accelerated index calculus to an unaccelerated rho
      is a charging error.
    - >-
      Every stage is charged: factor-base construction, decomposition attempts
      (successful and failed), Frobenius-orbit expansion, linear algebra at the
      reduced dimension, descent of the target, verification.
    - >-
      Published exponents and degree bounds (Gaudry, Diem, GHS) are treated as
      reported until reproduced on this instrument; the GHS applicability
      conditions are checked per curve and recorded.
    - >-
      Deployed curves (NIST Koblitz K-163 and its siblings, sect-family curves) are
      never instances; toy subfield curves are self-generated with the recipe
      recorded.
    - >-
      Every claimed relation and solve carries an independently re-verifiable
      certificate; a relation count without checked identities is not a
      measurement.
    - >-
      Timeouts, crashes and memory exhaustion are infrastructure outcomes, never
      negative mathematical evidence (AGENTS.md).
    - Claim tier toy until a medium-scale replication exists.
  related_questions: [RQ-PFDR-ae2fba, RQ-SBRG-f31cb2, RQ-ECTD-001, RQ-RELN-001, RQ-ICEX-001]
  goal_ids: []
  status: active
  owner: coordinator
