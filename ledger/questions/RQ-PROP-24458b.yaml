research_question:
  id: RQ-PROP-24458b
  title: >-
    What is the quantitative ceiling on PROBABILISTIC propagation for a tracked
    object on a prime-order elliptic-curve subgroup, and which objects attain it?
  scope:
    curve_families: [generic prime-field short-Weierstrass, prime-order subgroups only]
    field_types: [prime]
    bit_sizes:
      - exhaustive toy sizes where the full subgroup is enumerable (N <= 2^14)
      - symbolic/asymptotic argument for the general statement
    methods:
      - additive combinatorics in Z/N (Cauchy-Davenport, Vosper, Kneser)
      - Fourier analysis on Z/N and Weil-type character-sum bounds
      - exhaustive enumeration of fiber partitions at toy N
      - matched random-partition and random-function null controls
  motivation: >-
    IDEA-20260807-df906f proved the PRIME-ORDER CONGRUENCE RIGIDITY THEOREM: on a
    group of prime order every EXACTLY propagating projection is injective or
    constant, so no lossy exactly-propagating tracked object exists there at all.
    That theorem redirects rather than closes KN-OPEN-019, and it names four
    escapes. Escape E1 -- PROBABILISTIC PROPAGATION -- is stated by that record as
    the one it measures, but only for a single declared object family (the
    psi_ell division-polynomial residue ladder) on one toy family. The record's
    own interpretation_limits say plainly: "Theorem (A) is a statement about EXACT
    propagation only. It does not bound probabilistic propagation, and nothing in
    this record may be cited as closing the probabilistic regime."

    So the program owns a strong exact-regime theorem and has NO bound at all on
    the regime that the theorem forces every surviving candidate into. That gap is
    this question. Symmetric-key cryptanalysis lives entirely at propagation
    probability q < 1; if q can be pushed close to 1 by some efficiently
    computable statistic on E(F_p), that is an attack primitive, and if it
    provably cannot, the largest named escape from the program's central
    structural fact is closed at the docs/inventor-protocol.md section 4 standard
    rather than by fatigue.
  decision_target: >-
    A scoped, derivation-level answer to: (a) is there a ceiling on q for
    arbitrary s-valued statistics on a prime-order subgroup; (b) which fiber
    partitions attain or approach it; and (c) does any EFFICIENTLY COMPUTABLE
    statistic approach the ceiling, or are the near-extremal objects exactly the
    ones whose evaluation already requires a discrete logarithm.
  constraints:
    - >-
      Prime-order subgroups only. The rigidity theorem needs prime order and the
      Cauchy-Davenport route needs it too; composite-order groups are a DIFFERENT
      question and belong to RQ-ECDLP-002 or the cofactor lane.
    - >-
      No crypto-scale claim. Toy exhaustive enumeration plus symbolic argument;
      any asymptotic statement is a `derivation` under
      docs/claims-and-verification.md, never "proved".
    - >-
      Every measured propagation rate carries a matched random-partition null and
      a matched random-function null. An excess without both is an artifact per
      docs/inventor-protocol.md section 3.
    - >-
      A statistic is EFFICIENTLY COMPUTABLE only if evaluating it on a point R
      given (E, R) costs poly(log p) WITHOUT knowing the discrete logarithm of R.
      This distinction is the whole question and must be enforced mechanically,
      not editorially.
  status: active
  owner: coordinator
  added: '2026-08-15'
  source_refs:
    - KN-OPEN-019
    - KN-TECH-056
    - IDEA-20260807-df906f
    - docs/inventor-protocol.md
    - docs/target-result-profile.md
