# RQ-SSI-1946c9 -- opened with GOAL-SSI-2fa82a by DEC-20261004-23eb8d.
research_question:
  id: RQ-SSI-1946c9
  title: >-
    Can a correct public-key encryption candidate be specified whose auditable
    one-way or trapdoor dependency is the supersingular endomorphism-ring
    problem rather than an unstated stronger auxiliary assumption?
  scope:
    primitive: >-
      Public-key encryption with explicit KeyGen, Encrypt, and Decrypt
      algorithms. A sender uses only the public key and public parameters;
      decryption uses the recipient secret key. KEX, NIKE, AKE, signatures,
      generic KEM combiners, and deployed protocols are excluded.
    mathematical_objects: >-
      Supersingular elliptic curves over F_{p^2}, their endomorphism rings as
      maximal orders in B_{p,infinity}, and isogenies or ideals only where the
      specification states their encodings and algorithms. The EndRing input
      distribution and all auxiliary information must be explicit.
    security_target: >-
      No security claim is made by this question. A later candidate must name
      its first game, expected to be a one-way or IND-CPA target, and expose
      every reduction hop. IND-CCA, KEM security, concrete security levels, and
      post-quantum deployment claims require separate later contracts and are
      not inherited from the phrase based on EndRing.
    test_boundary: >-
      Initial implementation evidence, if later approved, is toy-only and
      locally generated. It may check syntax, correctness, failure behavior,
      and controls; it cannot establish cryptographic security or extrapolate
      to deployed parameter sizes.
  motivation: >-
    The user explicitly requested a goal to build PKE from the supersingular
    endomorphism-ring problem. KN-OPEN-013 records that hardness problem, while
    KN-LIT-074 and KN-TECH-028 record the conditional EndRing/isogeny-path
    relationship and Deuring/KLPT context. The corpus also contains prior
    supersingular PKE pointers (KN-LIT-6572, KN-LIT-6628, KN-LIT-827, and
    KN-LIT-1260). A useful campaign must therefore separate a genuinely new
    encryption interface from these constructions before it proposes an
    experiment or claims a reduction.
  decision_target: >-
    Decide whether there is a well-typed, non-duplicative PKE mechanism whose
    correctness can be checked and whose security dependency can be written as
    a precise reduction to supersingular EndRing, or whether every examined
    mechanism has a named interface, auxiliary-assumption, or duplication
    obstruction. Only the former can advance to a candidate specification;
    neither outcome establishes hardness or security.
  constraints:
    - >-
      Read and compare primary specifications before novelty classification.
      Corpus summaries are pointers, not proof that a scheme has or lacks a
      feature.
    - >-
      Define the EndRing problem instance distribution, output equivalence,
      auxiliary data, and conditional assumptions. Do not use EndRing as an
      informal label for generic isogeny hardness.
    - >-
      The encryption algorithm receives no secret witness. Any mechanism that
      requires the endomorphism ring to encrypt is circular as ordinary PKE
      unless a distinct public evaluation procedure is specified and checked.
    - >-
      Every intermediate assumption is named separately. Auxiliary torsion
      images, orientations, trusted setup, hidden isogenies, or special-curve
      distributions are not silently implied by the plain EndRing problem.
    - >-
      A correctness test, failed attack, or lack of a distinguisher is not a
      security result. No artifact is described as secure, deployable, or
      recommended for use without later claim-tier-correct evidence and review.
    - >-
      Negative or duplicate mechanisms are retained with their exact
      obstruction and forward guidance; search fatigue is not a closure.
