research_question:
  id: RQ-SNOVA-001
  title: >-
    What is SNOVA's true security level as a function of (v, o, ell, q)
    under the wedge-product and group-action-stability attacks, and can
    any Round-3 tweak restore the claim without giving up the key-size
    advantage?
  scope:
    scheme: "SNOVA"
    family: "multivariate (UOV over a noncommutative ring / simple matrix structure)"
    assumption: >-
      oil-space recovery for a noncommutative-ring UOV variant
    process_status: >-
      NIST Additional Digital Signatures, advanced to Round 3 on 2026-05-14;
      team tweaks due 2026-08-14. Round-3 specification not yet read by this
      program.
    targets:
      - >-
          the wedge-product attack and the rank of the ER matrix it
          turns on
      - >-
          stability of the public map under the relevant group action
      - >-
          weak-key density as a function of (v, o, ell, q)
      - >-
          whether any Round-3 parameter choice restores the claim at
          acceptable key size
    methods:
      - >-
          independent reimplementation of the reported attacks at
          reduced parameters
      - >-
          certified key recovery / universal forgery (forged signature
          verifies under the public key)
      - >-
          weak-key density measurement over sampled keys, with the
          sampling model stated
      - >-
          Pareto statement: security level versus public-key and
          signature size against matched UOV variants
    claim_tier_ceiling: >-
      Toy-tier until a certified instance at or above the scheme's own
      parameter scale exists. AGENTS.md rule 7 applies: no toy-scale result is
      reported as a statement about deployed parameters.
  motivation: >-
    SNOVA is the most actively falling target in the Round-3 field,
    which makes it the one where an independent, certificate-backed
    security map is worth the most. Reported cryptanalysis includes
    attacks exploiting stability under a group action, attacks reducing
    the security margin of proposed parameter sets by factors between
    2^8 and 2^39, a weak-key family in which roughly one public key in
    500 for SNOVA-37-17-2 admits universal forgery at bit complexity
    2^97 and roughly one in 143000 breaks in minutes, and a February
    2026 wedge-product result claiming all Round-2 parameter sets are
    broken, taking SNOVA-I (v=24, o=5, ell=4) from a previous 160-bit
    attack down to 94 bits. Every one of those figures is secondhand
    here and must be reproduced before it is relied on. The deliverable
    that outlives any single attack is a parameter-to-security map with
    a certified anchor point and an honest weak-key density measurement.
  decision_target: >-
    The true (v, o, ell, q) -> security-level map for SNOVA, and whether
    any point on it simultaneously meets a NIST category and beats plain
    UOV on size.
  provenance: >-
    Candidate list taken from the NIST announcement of 2026-05-14 that
    nine schemes advance to Round 3 of the Additional Digital Signatures
    process. csrc.nist.gov and nist.gov are unreachable from this
    harness's network policy (proxy CONNECT 403), so the roster and
    elimination list were confirmed from secondary reporting rather than
    read from the primary page; the Round-3 specification bundle (team
    tweaks due 2026-08-14) has NOT been read. Every per-scheme technical
    claim below is a research target to be verified against primary
    sources before any experiment is designed, not an established
    result.
  constraints:
    - >-
      Every per-scheme technical claim in this record is sourced from
      secondary reporting or from memory of the literature and is UNVERIFIED.
      No experiment may be designed until the relevant primary sources are
      filed as KN-LIT entries.
    - >-
      Matched-baseline discipline: no attack cost is reported without the
      best-known baseline at identical parameters, with memory, preprocessing,
      and verification charged.
    - >-
      Any claimed break carries a certificate (recovered key annihilates the
      public map, or a forged signature verifies) that the run wrapper
      re-verifies independently. See docs/claims-and-verification.md.
  status: active
  owner: coordinator
  created_at: '2026-07-29'
