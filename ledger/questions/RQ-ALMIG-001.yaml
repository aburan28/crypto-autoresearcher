research_question:
  id: RQ-ALMIG-001
  title: Can the Autolab task and result corpus be preserved byte-for-byte in the harness?
  scope:
    curve_families: [not_applicable]
    field_types: [mixed_historical_corpus]
    bit_sizes: [as_sourced]
    methods: [content_addressed_migration, sha256_manifest, historical_import]
  motivation: >-
    Preserve runnable Autolab task packages and retained results in the
    crypto-autoresearcher repository without laundering historical observations
    into new scientific claims.
  decision_target: >-
    Establish a complete local mirror, deterministic task catalog, and
    content-addressed file manifest that later harness experiments can cite.
  constraints:
    - The source repository is dirty; the Git commit is a base pointer, not a complete byte identity.
    - Per-file SHA-256 values bind both tracked and untracked source bytes.
    - Migration does not re-run tasks or raise any scientific claim tier.
  status: active
  owner: coordinator
