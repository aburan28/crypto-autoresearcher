research_question:
  id: RQ-EDDSA-9b8473
  title: >-
    Ed25519/EdDSA: the "same" signature scheme has several inequivalent
    verification equations in the fielded specifications and libraries — which
    (key, message, signature) triples separate them, and which separations are
    reachable by an adversary who only supplies public data?
  scope:
    scheme: "Ed25519 and Ed25519ph/ctx (RFC 8032), FIPS 186-5 EdDSA, Ristretto255 as a nearby object"
    family: "Schnorr-type signatures over a prime-order-subgroup-of-a-cofactor-8 curve"
    standardization_status: >-
      RECALLED, UNVERIFIED: RFC 8032 specifies EdDSA and permits both the
      cofactored equation [8][S]B = [8]R + [8][k]A and the cofactorless
      equation; FIPS 186-5 admits EdDSA into the US federal suite. Deployments
      include SSH host and user keys, TLS certificates, package signing,
      blockchain consensus and consensus-critical validation.
    targets:
      - >-
        THE DIVERGENCE MATRIX, THE PRIMARY DELIVERABLE: one row per verification
        decision point (cofactored vs cofactorless equation, canonical vs
        non-canonical encoding of A and R, small-order A, small-order R,
        S in [0, L) vs S < 2^256, mixed-order points, batch vs single
        verification), one column per named published specification, and a cell
        stating what that specification requires. Cells that the specification
        does not determine are the finding.
      - >-
        A LITERAL CERTIFICATE PER REACHABLE DIVERGENCE: a triple (A, M, sig)
        accepted under one admissible reading and rejected under another,
        emitted as bytes and re-verified by two independent implementations
        written from the specification text. This is the strongest evidence
        tier this program can produce and it costs milliseconds.
      - >-
        THE ADVERSARY-REACHABILITY QUESTION, POSED PRECISELY: a divergence
        matters only if some party can produce the separating triple from data
        it is permitted to choose. Classify each certificate by what the
        producer must control (signing key, public key only, signature only,
        nothing), because that classification — not the existence of the
        divergence — is the security-relevant statement.
      - >-
        BATCH VERIFICATION: whether the batch equation's acceptance set equals
        the single-verification acceptance set for every admissible reading,
        with a certificate for each inequality found.
    methods:
      - Exhaustive enumeration over the finite torsion structure (the eight-element torsion subgroup and the non-canonical encoding classes are both small, finite, and completely enumerable).
      - Two clean-room implementations of each admissible verification reading, cross-checked on the official test vectors before any certificate is minted.
      - Differential testing between readings over enumerated and randomly sampled triples with declared seeds.
    claim_tier_ceiling: >-
      SPECIFICATION-SEMANTICS AND CERTIFICATE CLAIMS ONLY. Nothing here is an
      attack on Ed25519's underlying hardness assumption, and no record may
      state one. A divergence is a statement about verification semantics.
      Statements about any third-party library, product, chain or service are
      OUT OF SCOPE ENTIRELY: this goal analyses specification text and its own
      implementations, and never a deployed system.
  motivation: >-
    Ed25519 is deployed on the assumption that a signature either verifies or
    does not — an assumption consensus protocols, certificate transparency,
    package managers and reproducible-build systems all depend on. The
    specification permits inequivalent verification equations, and the
    difference is invisible in the test vectors that everyone checks against.
    The separating objects live in a finite torsion subgroup that can be
    enumerated exhaustively in seconds, which makes this the rare
    security-relevant question that admits a complete answer rather than a
    bounded search. The program's recurring pattern applies: the uniqueness
    property is inherited from folklore rather than computed.
  decision_target: >-
    Which verification decision points admit inequivalent readings under the
    named specifications, which of those are witnessed by a literal certificate,
    and what an adversary must control to produce each one.
  provenance: >-
    RECALLED FROM MODEL MEMORY ON 2026-08-09. NOT WEB-SEARCHED, NOT READ IN
    PRIMARY TEXT BY THIS PROGRAM, NOT FILED AS KN-LIT. Research targets to be
    re-read, not facts on record here: RFC 8032 (EdDSA), FIPS 186-5, the
    Chalkias-Garillot-Nikolaenko taxonomy of Ed25519 verification variants
    (RECALLED as reporting divergence across widely used libraries and
    proposing a strict verification definition), and the Ristretto/decaf line
    of work as the designed-away nearby object. Every figure and every claim
    about what a specification says is UNVERIFIED until acquired.
  constraints:
    - >-
      No certificate may be minted until RFC 8032 and FIPS 186-5 are filed as
      KN-LIT entries. A divergence claim is a claim about two documents and is
      meaningless with neither of them read.
    - >-
      Every implementation used to verify a certificate must pass the official
      test vectors first; a certificate produced by an implementation that
      fails the vectors is an implementation bug, not a finding, and this is
      the single most likely way to manufacture a false result here.
    - >-
      Two independent implementations, written from the text rather than
      derived from one another, verify every certificate before it is recorded.
    - >-
      No third-party library, service, device, chain or repository is probed,
      collected, named as vulnerable, or analysed. All keys and signatures are
      self-generated.
    - >-
      A divergence is never written as "scheme X is broken". Its admissible
      statement names the two readings and the triple that separates them.
  status: active
  owner: coordinator
  created_at: '2026-08-09'
