research_question:
  id: RQ-MCE-e65b3c
  title: >-
    Does the 2026 heuristic subexponential attack line against McEliece
    actually reach Classic McEliece's standardized parameters, and what
    is the memory-charged concrete ISD cost at those parameters?
  scope:
    scheme: "Classic McEliece"
    family: >-
      code-based KEM (binary Goppa codes, Niederreiter form, deterministic
      one-way PKE wrapped in an FO-style CCA transform)
    assumption: >-
      TWO assumptions, and this question is mostly about the second.
      (1) Syndrome decoding of a random-looking binary linear code is hard.
      (2) A scrambled binary Goppa generator/parity-check matrix is
      indistinguishable from a random one. Sixty-four years of ISD work
      (KN-LIT-6a786b through KN-LIT-47b29b) has moved (1) very little; every
      break in the McEliece family has come through (2).
    standardization_status: >-
      NOT a NIST selected algorithm. Classic McEliece is on the ISO track and
      is the conservative code-based KEM the NIST process did not select,
      which makes its parameters durable rather than provisional. This status
      claim is transcribed from the Classic McEliece project's own site
      structure (a "NIST" and an "ISO" page are listed at
      https://classic.mceliece.org/) and is UNVERIFIED here — neither page was
      fetched. It must be checked against primary text before any deliverable
      characterises the algorithm's standardization state.
    targets:
      - >-
        PRIMARY: what KN-LIT-7c4620 (Briaud-Lemoine-Randriambololona-Tillich,
        "A heuristic subexponential attack on the McEliece cryptosystem",
        iacr:2026/1232) actually claims — its complexity statement, its
        numbered heuristics, the code families and rates it applies to, and
        the distance between its regime and Classic McEliece's parameters.
      - >-
        The rate-threshold structure of the alternant/Goppa distinguisher
        line — KN-LIT-13a01d (high-rate distinguisher), KN-LIT-4c8135
        (polynomial-time key recovery, high-rate alternant), KN-LIT-71d1a0
        (syzygy distinguisher), KN-LIT-7ee1a9 (degree-2 alternant) — stated
        as a quantitative distance from Classic McEliece's actual rates.
      - >-
        Memory-charged concrete ISD cost at Classic McEliece's parameter sets,
        under the same costing convention GOAL-HQC-001 and GOAL-SDITH-001 bind
        to. Not a separate convention.
      - >-
        The side-channel and fault line as a SEPARATE claim class that says
        nothing about the mathematics (KN-LIT-f1eb40, f50ab3, e800e6, and 13
        others filed 2026-08-03).
    methods:
      - >-
        Primary-source transcription before assessment. Every claim in this
        record and in the 137 KN-LIT entries filed 2026-08-03 is at
        confidence: reported and NONE of those papers has been read.
      - >-
        Rate/parameter arithmetic against transcribed thresholds, in exact
        rationals, with the transcription itself controlled — the
        transcription-fidelity discipline GOAL-HQC-001 BATCH-001 established
        after its own RS-S3 minimum-distance error.
      - >-
        Matched baseline at identical parameters with memory and memory
        access charged, per KN-LIT-5677ae and KN-LIT-b8a8be.
      - >-
        Any claimed solve or relation carries a certificate the run wrapper
        re-verifies independently (docs/claims-and-verification.md).
  claim_tier_ceiling: >-
    TOY. AGENTS.md rule 7 is binding and this question does not authorize its
    relaxation. No result of this program is reported as a statement about
    Classic McEliece's standardized parameter sets unless a certified instance
    at that scale exists, and none will. The realistic best outcome of this
    goal is a correctly-scoped reading of someone else's attack plus an
    honestly-charged baseline — not a break.
  motivation: >-
    Two things make Classic McEliece worth a goal rather than a note, and one
    thing makes it dangerous to open.

    WORTH IT. First, KN-LIT-7c4620 exists. A claimed heuristic subexponential
    attack on McEliece appeared four months ago (iacr:2026/1232), from four
    authors with standing in exactly this area, and it is the closest published
    analogue to docs/target-result-profile.md's canonical exemplar that this
    corpus holds: an exponent-moving claim on a central hard problem, stated
    conditionally on heuristics, with the qualifier in the title rather than a
    footnote. Whether it reaches Classic McEliece's parameters is unknown to
    this program and is the single highest-value question available here.
    Second, McEliece is the cleanest calibration target in cryptography: the
    1978 construction (KN-LIT-141bac) stands after 48 years and 162 papers,
    while every structured variant proposed for efficiency was broken
    (KN-LIT-19cf36, 2395, 495e7f, 2d9edb, 5792). A program whose taste is set
    by docs/target-result-profile.md should be able to say precisely why that
    asymmetry holds.

    DANGEROUS. The corpus gained 137 McEliece KN-LIT entries on 2026-08-03 and
    NOT ONE was read. A corpus that is broad and unread is exactly the
    condition under which a novelty check returns a confident wrong answer. The
    first batch of this goal exists to convert a small, decisive part of that
    breadth into read primary text, and the question forbids designing any
    experiment before it does.
  decision_target: >-
    Whether the 2026 subexponential line is a live threat to Classic
    McEliece's parameters, a rate-restricted result at a distance that can be
    stated, or something this program has misread; and whether the
    memory-charged ISD cost at those parameters matches the claimed
    categories.
  provenance: >-
    The bibliographic map for this question is GATHER-20260803: 162 entries
    transcribed from https://classic.mceliece.org/papers.html (page version
    2026.06.13, retrieved 2026-08-03, HTTP 200), 137 filed as new KN-LIT
    records, 25 already held. 118 of the 137 citations were verified against a
    primary index (IACR ePrint 75/75, Crossref 99 accepted at >=0.90, arXiv
    4/4); 19 could not be verified in any open index and carry
    citation_verified: false.

    NETWORK PRECONDITION, MEASURED NOT ASSUMED: eprint.iacr.org ABSTRACT pages
    returned HTTP 200 for 75 of 75 requests on 2026-08-03 from this harness.
    That is a materially better starting position than GOAL-HQC-001 had. It is
    NOT a claim that PDF retrieval works: GOAL-HQC-001 BATCH-001's red team
    established that the eprint PDF endpoint still returns 403 and that a
    contrary Coordinator claim was FALSE because only HTML endpoints had been
    tested. This question inherits that correction and does not re-make the
    error. classic.mceliece.org returned HTTP 200 (46,093 bytes).
  constraints:
    - >-
      NO EXPERIMENT MAY BE DESIGNED until KN-LIT-7c4620's primary text is
      obtained and transcribed, or its unavailability is recorded with the
      routes tried. The 137 entries filed 2026-08-03 are a map, not a
      foundation: every one states that the full text was not read and that no
      complexity figure in it has been reproduced.
    - >-
      Corpus-provenance caution, inherited from KN-OPEN-3f7a21: 7457 of 7666
      literature entries carried citation_verified: read against a downloads/
      tree that is absent and was never git-tracked. Treat any pre-2026-08-03
      McEliece entry's `read` provenance as unconfirmed. The 137 entries filed
      2026-08-03 deliberately use `web` or `false` and never `read`.
    - >-
      Matched-baseline discipline: no attack cost is reported without the
      best-known baseline at identical parameters, with memory, preprocessing
      and verification charged. Bind to the costing convention produced under
      GOAL-HQC-001 TASK-20260802-0100a5; do NOT derive a competing one.
    - >-
      Distinguisher is not break. KN-LIT-13a01d distinguishes and does not
      recover keys; docs/claims-and-verification.md forbids promoting one to
      the other. Any deliverable naming a distinguisher states which it is.
    - >-
      Rate-scoping is load-bearing, not decoration. KN-LIT-4c8135 is
      polynomial-time key recovery for HIGH-RATE random alternant codes; the
      threshold is the practically decisive number and no deliverable may
      state the headline without it.
    - >-
      A negative result is not a completion criterion and an infrastructure
      blocker is never negative mathematical evidence (AGENTS.md rule 5).
  status: active
  owner: coordinator
  created_at: '2026-08-03'
