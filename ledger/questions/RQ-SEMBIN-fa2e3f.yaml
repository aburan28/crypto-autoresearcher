research_question:
  id: RQ-SEMBIN-fa2e3f
  title: >-
    Where in (n, m, t, k) does Semaev 2015's Assumption 1 (d_F4 <= 4) actually
    fail, is the d_F4 it bounds the same quantity GOAL-DREG-001 has been
    measuring on the same Boolean system, and does the "four FIPS binary curves
    are theoretically broken" conclusion survive a comparison that charges the
    memory axis the paper omits?
  scope:
    curve_families:
      - E/F_{2^n}: Y^2 + XY = X^3 + A X^2 + B, the form KN-LIT-fa346d Section 4.5
          uses, with B = 1 and with B random (its Table 1 and Table 2 respectively)
      - the four FIPS PUB 186-4 binary curves (n = 233, 283, 409, 571) as the
          concrete-cost parameter sets only -- no curve arithmetic at those n
    field_types:
      - binary extension fields F_{2^n}, n prime, Weil-descended over F_2
      - V an F_2-subspace of dimension k; both V = {polynomials in alpha of
          degree < k} and a random k-dimensional subspace, since KN-LIT-fa346d
          Table 1's starred rows report the two differ
    bit_sizes:
      - 'reproduction of the published cells: n in {12,13,14,15,16,17,19,21} at
        m in {3,4,5,6}, and n = 40 at m = t = 2, k = 20 (KN-LIT-fa346d Tables 1-2)'
      - 'boundary search: the m = 2 window n in [40, 45] first, then t >= 3 at
        the largest n each certificate route can reach'
      - 'concrete cost only (no execution): n = 233, 283, 409, 571 at the
        paper''s own optimal m = 8, 9, 11, 12'
    methods:
      - chained S_3 Boolean systems from KN-LIT-fa346d eq. (5) at 2 <= t <= m
          (technique abstract KN-TECH-b18366)
      - >-
        both degree definitions instrumented on identical instances: Semaev's
        d_F4 (Section 4.4 -- maximal total degree of polynomials occurring
        strictly BEFORE F4 terminates, excluding the degree 5/6/7 "No pairs to
        reduce" tail steps he reports and excludes), and the Macaulay-rank
        d_reg/D statistic of GOAL-DREG-001's block-m4ri instrument
      - open-source Gröbner / linear-algebra engines only; this program has no
          MAGMA licence, so a calibration control against the paper's timings is
          part of the question rather than an assumption
      - degree-4 Macaulay rank certificates as a substitute for completing a
          Gröbner basis, where completion is out of machine reach
      - concrete-cost derivation from published formulas, against van
          Oorschot-Wiener parallel rho with distinguished points
  motivation: >-
    KN-LIT-fa346d (Semaev, ePrint 2015/310, frozen at inputs/SEMAEV-2015-310/ and
    read for the first time in this program on 2026-09-13) derives
    2^{1.6986 sqrt(n ln n)} for ECDLP over F_{2^n} and concludes that four FIPS
    PUB 186-4 binary curves are theoretically broken. Everything downstream of
    that rests on Assumption 1, whose entire experimental support is 2300 MAGMA
    systems confined to n <= 21 and m <= 6, plus one cell at n = 40, m = t = 2 --
    against a conclusion needing n = 409, 571 at m = 11, 12. The paper itself
    reports, at the end of Section 4.5.1, that the regularity degree "generally
    exceeds 4 when k > ceil(n/m) though the first fall degree is still 4", so it
    exhibits the d_reg > d_ff gap that Assumption 1 assumes away. Unreproduced
    counter-data in the KN-LIT-e77232 comment thread (Kosters: step degree 5 at
    n = 45, m = t = 2 and at n = 25, m = t = 3) would put the m = 2 boundary
    between n = 40 and n = 45, five apart, on the very diagonal where the
    assumption is asserted.
    Two things make this question this program's business rather than a matter of
    literature commentary. First, GOAL-DREG-001 has been measuring a degree
    quantity on THIS system since 2026-07 and reports work at Macaulay degrees 5
    and 6 (EV-DREG-008) -- either that is in direct tension with Assumption 1 or
    the two campaigns are measuring different quantities, and nothing in this
    repository establishes which. Second, the frozen GOAL-RELN-001 and
    GOAL-ICEX-001 protocols carry a reference curve named HEUR-SEMAEV-2015-4.3
    which is this paper's Section 4.3, cited while the paper was recorded unread.
    Separately, the claim's comparison is time-only: stage 2 stores Theta(2^k)
    relations (2^38 at n = 409, 2^48 at n = 571) while Pollard rho stores
    essentially nothing, and no memory-charged crossover has been computed by
    anyone, in the paper or since.
  decision_target: >-
    A committed Coordinator decision that (a) states the map between Semaev's
    d_F4 and GOAL-DREG-001's d_reg/D on identical instances, so that campaign's
    existing measurements can be read as bearing on Assumption 1 or explicitly as
    not bearing on it; (b) reports the reproduction status of KN-LIT-fa346d
    Tables 1-2 on an open-source solver, cell by cell, with the calibration
    control; (c) reports the located boundary surface, or the exact certificate
    that is missing, for d_F4 = 4 versus d_F4 >= 5 in (n, m, t, k); and (d)
    carries a COST-* record giving time AND memory for the chained-S_3 index
    calculus against van Oorschot-Wiener parallel rho at n = 233, 283, 409, 571,
    with every optimistic assumption flagged on both sides.
  constraints:
    - >-
      Assumption 1 and Assumption 2 are DIFFERENT claims and must never be
      refuted as one. Assumption 2 (d_F4 = o(sqrt(n/ln n)), Section 4.6) leaves
      the asymptotic bound standing while the Table 3 concrete estimates and the
      FIPS conclusion do not survive under it. A result about Assumption 1 is
      scoped to Assumption 1.
    - >-
      Kosters' two figures are blog-comment data with no published artifact.
      Their status in this program is a pointer until an agent here measures
      them; they may motivate a cell and may not support a conclusion
      (AGENTS.md rule 9, citation provenance).
    - >-
      Reproduce before extending. A cell where the paper reports d_F4 = 4 and
      this program's instrument also reports 4 is the control that gives any
      later disagreement meaning; without it a disagreement is equally
      explicable as an engine difference, and the paper's engine was MAGMA F4 on
      hardware nobody here has.
    - >-
      Machine reality: roughly 8-16 GB usable, no MAGMA. Kosters' cells are
      recorded at 111-126 GB. Prefer certificate routes over Gröbner completion;
      where neither is affordable, record an impediment with its recheck. A
      resource exhaustion is never negative mathematical evidence (AGENTS.md
      rule 5), and GOAL-DREG-001's own n = 15 attempt already failed this way at
      11.73 GiB in the prepare phase alone.
    - >-
      A large memory requirement is a cost, not an impossibility. The memory
      question is answered with a tradeoff curve in m and an explicit cost
      metric, against PARALLEL rho with distinguished points -- not against
      textbook rho -- or it is not answered.
    - >-
      No claim about the security of any deployed curve, in either direction,
      from anything in this question. The FIPS curves are parameter sets for a
      cost table here and nothing more.
