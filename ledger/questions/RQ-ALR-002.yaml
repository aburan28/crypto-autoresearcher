research_question:
  id: RQ-ALR-002
  title: Can nested projector moments expose the ECDLP candidate locator without represented nN state?
  scope:
    curve_families:
      - p98561_j0_q16427_h6_u2_v3
      - p100129_j1728_q16687_h6_u3_v2
      - p99527_generic_q14219_h7_u2_v1
    field_types:
      - prime
    bit_sizes:
      - toy
    methods:
      - elliptic_target_divisor
      - fermat_projector
      - power_projection
      - berlekamp_massey
      - straight_line_program
  motivation: >-
    Preserve and continue the exact AutoLab R183 investigation inside the
    crypto-autoresearcher evidence system, with immutable provenance, charged
    output costs, source-label controls, and explicit claim ceilings.
  decision_target: >-
    Construct or refute an SLP-direct nested projector-moment operator that
    emits 2c weighted source moments in softly O(n+N+c) work.
  constraints:
    - Finite projector and locator controls do not establish an asymptotic nonlinear-trace or circuit lower bound
    - Toy curves do not support crypto-scale attack credit
    - Source-blind target traces must preserve source labels or be rejected
    - Every represented projector, Krylov output, candidate verification, and compact setup cost is charged
    - Pollard-rho and Shoup improvement flags remain false until a complete generic-prime attack is supplied
  status: active
  owner: coordinator
