research_question:
  id: RQ-CERTBIN-836ce2
  title: >-
    Index calculus on the Certicom ECC2 / ECC2K binary challenges, where every field
    degree is prime and no subfield exists: how should the factor-base subspace V
    be chosen, what does a fully charged decomposition cost as m grows, and is
    there any route that beats the m-charged Pollard rho at the sizes that remain
    open?
  scope:
    curve_families:
      - >-
        Certicom Level I: ECC2K-130 (Koblitz) and ECC2-131 (random) over F_{2^131},
        both open per the 2009 document; ECC2K-108 and ECC2-109 over F_{2^109},
        both solved, retained as calibration endpoints.
      - >-
        Certicom Level II: ECC2K-163 / ECC2-163 over F_{2^163}; ECC2-191 over
        F_{2^191}; ECC2K-238 / ECC2-238 over F_{2^239}; ECC2K-358 / ECC2-353 over
        F_{2^359}.
      - >-
        Scaled-down siblings for measurement: random and Koblitz curves over
        F_{2^m} for PRIME m this machine can decompose, so every measured cell has
        the same "no subfield" structure as the targets.
    field_types:
      - >-
        F_{2^m} with m PRIME: 109, 131, 163, 191, 239, 359. Verified from the frozen
        document and by computation in inputs/CERTICOM-CHALLENGE-2009/. No proper
        subfield other than F_2 exists for any target.
    bit_sizes:
      - 'targets: 131 (open Level I), 163, 191, 239, 359 (Level II)'
      - 'calibration: 109 (solved)'
      - 'measurable: prime m in roughly [17, 61], to be fixed per contract'
    methods:
      - >-
        Semaev / Diem index calculus with factor base F_V = {P : x(P) in V} for an
        F_2-linear subspace V of dimension l, decomposing R into n' points with
        S_{n'+1} Weil-descended to l*n' Boolean unknowns; the CHOICE OF V is the
        primary independent variable -- coordinate subspaces, Frobenius-stable
        subspaces (on ECC2K), trace-structured and random V at matched dimension.
      - >-
        Solvers: Groebner (F4 via msolve or equivalent), SAT over the Boolean
        descent (WDSat with XOR reasoning and symmetry breaking; a CDCL+XOR
        control), and the chained-S_3 Boolean formulation this program instruments.
      - >-
        Frobenius exploitation on ECC2K: orbit-aware factor bases and the
        sqrt(m)-class savings the challenge document itself credits to Koblitz
        structure, measured against size-matched non-orbit controls.
      - >-
        Scaling: measured per-relation cost as a function of m at fixed (n', l)
        policy, its exponent, and the crossover against the m-charged parallel rho
        the document names as the benchmark attack -- extended by declared,
        numbered heuristics toward the open sizes, never by silent extrapolation.
      - >-
        Larger-size routes proposed by ideation and not presupposed here: e.g.
        higher n' with symmetrisation, hybrid partial-guess plus SAT, relation
        recycling across V-orbits, or any mechanism that changes the exponent
        rather than the constant. Each is a candidate to be falsified, not a plan.
  motivation: >-
    The program has spent a campaign on ECC2K-130 (GOAL-ECDLP2M-001's QSP lane), a
    campaign on whether WDSat can see factor-base subspace structure
    (GOAL-FROB-6333a9), a SAT-correctness campaign on summation systems
    (GOAL-SATIC-c49b77), and a deep audit of Semaev 2015 -- and it has never posed
    the question ON THE CHALLENGE FAMILY as such, with the one structural fact that
    unifies it stated: every field degree is prime, so the subfield factor base that
    makes Gaudry-Diem natural on the Oakley curves does not exist here, and the
    subspace V is a free parameter of the attack. That is the setting in which "a
    more performant choice of V" is the entire question rather than a refinement,
    and in which SAT formulations have been proposed precisely because Groebner
    decomposition at the needed n' is expensive. Posed beside RQ-OAKLEY-264353, the
    pair makes subfield-versus-subspace factor bases a controlled comparison across
    two deployed-or-challenged object families. The user also asked whether index
    calculus can be done better at LARGER sizes than the program has measured; this
    question is where that has to be answered honestly, because the open challenges
    are the sizes at which the benchmark attack is known and costed.
  decision_target: >-
    A committed Coordinator decision stating, on prime-m scaled-down siblings with
    the Certicom challenges as declared endpoints, (1) the fully charged per-relation
    cost under a Groebner baseline as a function of m at a fixed (n', l) policy, with
    its measured exponent and the largest m reached here; (2) for factor-base
    subspace choice, whether ANY non-coordinate V changes decomposition probability
    or solver cost by a factor that survives size-matched random-V and shape-matched
    null controls, or explicitly does not -- and for ECC2K, whether Frobenius-stable
    V does so beyond the sqrt(m) rho-side saving; (3) for SAT formulation, whether
    it moves the per-relation cost against Groebner on identical instance bytes; (4)
    the crossover, if any, against m-charged parallel rho at the measured sizes; and
    (5) an explicit extrapolation boundary naming which of these, under which
    numbered heuristics, transfer toward m = 131 and above. Either direction on
    (2)-(4) satisfies the target; an unmeasured comparison does not.
  constraints:
    - >-
      OBJECT FIRST. Every contract names the challenge or the prime-m sibling it
      measures, with m, the curve equation and whether it is Koblitz; no cell is a
      composite-degree curve, because none of the targets is.
    - >-
      Scale is disclosed, never laundered. A cost at m = 37 is a cost at m = 37;
      any statement about m = 131 names the heuristic it rides on and that
      heuristic's validation route.
    - >-
      Controls before belief. Every claimed subspace or solver advantage is measured
      against size-matched random V, a shape-matched random Boolean system, and the
      identity of Groebner and SAT answers on the same instance bytes; a signal that
      fails to decay when the parameter meant to destroy it increases is an artifact.
    - >-
      Charge everything: failed decompositions, solver time-outs, preprocessing and
      symmetry-breaking setup, memory, and -- for the rho comparator -- the actual
      per-step cost on this machine, not a literature figure.
    - >-
      Do not duplicate. The ECC2K-130 QSP lane, the FROB dimension tables and
      HEUR-FROB-WDSAT-NULL, the SATIC instruments, the WDSat vendored source and
      ICPERF regression gate, and KN-FIND-936151's fake-versus-true first-fall-degree
      boundary all exist; reuse by reference and state what is added.
    - >-
      A timeout, memory cap, or solver crash is an infrastructure fact and never
      evidence about the curve (AGENTS.md rule 5).
    - >-
      Nothing here asserts anything about the security of any deployed system. The
      challenges exist to be attacked; the interest is the object.
  status: active
  owner: coordinator
  provenance:
    posed_at: '2026-09-22'
    posed_by: coordinator, on user direction of 2026-09-22
    object_source: SRC-CERTICOM-CHALLENGE-2009 (inputs/CERTICOM-CHALLENGE-2009/)
    sibling: RQ-OAKLEY-264353
    rolls_up_to: GOAL-ECDLP2M-001
    rolls_up_note: >-
      Posed under a letters-only sibling area for the same allocate_id.py reason
      recorded beside OAKLEY in orchestration/research-priority.yaml. The goal head
      is not edited here; another session holds its QSP lane.
    the_number_the_user_gave: >-
      The user wrote "ecc 263". No Certicom challenge carries that number; the
      frozen document's binary challenges are at 109, 131, 163, 191, 239 and 359
      bits. This question covers the whole binary family and names the nearest
      members, ECC2-238 and ECC2K-238 at 239 bits, explicitly rather than guessing
      at the intended one.
