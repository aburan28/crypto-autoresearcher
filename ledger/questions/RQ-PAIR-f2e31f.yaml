research_question:
  id: RQ-PAIR-f2e31f
  title: >-
    BLS12-381 and BN254: the "128-bit" and "100-bit" labels that the entire
    pairing-based deployment stack quotes are the output of one family of
    exTNFS estimates — what does the cost model give when this program runs the
    polynomial selection and charges memory itself?
  scope:
    scheme: "BLS12-381 (deployed in Ethereum consensus, BLS aggregate signatures, several proof systems) and BN254/alt-bn128 as the nearby object"
    family: "pairing-friendly elliptic curves; discrete logarithms in GF(p^12) via the extended tower number field sieve"
    standardization_status: >-
      RECALLED, UNVERIFIED: BLS12-381 is a de facto standard rather than a NIST
      one, adopted after the Kim-Barbulescu exTNFS results reduced the estimated
      security of BN254 from the previously quoted 128 bits to roughly 100.
      Draft standardization of BLS signatures and pairing-friendly curves exists
      at the IETF/CFRG level.
    targets:
      - >-
        THE RECOMPUTATION: run polynomial selection for the specific target
        field GF(p^12) at the deployed prime, with the tower structure the
        curve actually has, and produce a cost curve rather than a single
        number. The published bit levels are a small number of evaluations of a
        model with named free choices; this program has never made those
        choices itself.
      - >-
        THE MEMORY CHARGE: linear algebra on the exTNFS relation matrix is the
        step whose memory is routinely quoted as feasible without being costed.
        State the matrix dimension and weight the model implies at deployment
        parameters and charge memory explicitly, as GOAL-RSA-001 does for
        factoring.
      - >-
        THE CALIBRATION: a fully executed discrete-logarithm computation in a
        small GF(p^k) of the same tower shape, emitted as a certificate (the
        exponent, re-verified independently), so the cost model is anchored to
        something this program actually ran rather than only to literature.
      - >-
        THE SENSITIVITY TABLE: for each modelling choice (polynomial selection
        method, sieving region shape, smoothness bound, filtering assumptions,
        the constant in the L-notation, descent cost), how many bits does the
        headline number move? A choice that moves the answer by ten bits and is
        made by convention is the finding.
    methods:
      - Direct implementation of the tower polynomial selection for the deployed parameters, with every choice recorded.
      - Small-scale end-to-end DL computations in GF(p^k) with certificates, used to calibrate the constants that the asymptotic model leaves free.
      - Explicit accounting of relation-collection and linear-algebra costs in operations AND memory, reported as a pair, never as a single scalar.
    claim_tier_ceiling: >-
      COST-MODEL AND CALIBRATION CLAIMS ONLY. No discrete logarithm in a
      deployment-sized field is attempted or claimed, and no statement that any
      deployed curve is broken or safe may be recorded. The admissible output is
      "under assumptions A1..An, which this program states and varies, the
      target-field cost is X, and the published figure corresponds to choices
      C1..Cn."
  motivation: >-
    Every zero-knowledge rollup, BLS aggregate signature deployment and
    pairing-based accumulator in production quotes a security level for its
    curve. Those levels come from a handful of estimation papers whose
    polynomial selection and cost conventions almost nobody downstream has
    re-run. The BN254 precedent is the reason this matters: a curve deployed at
    a quoted 128 bits was re-estimated at roughly 100 after exTNFS, without any
    change to the curve. That is precisely a quantity computed once and
    inherited since — the pattern this program targets — and the recomputation
    is arithmetic and search, not a break.
  decision_target: >-
    What the exTNFS cost model gives for GF(p^12) at the deployed BLS12-381
    prime when this program selects polynomials and charges memory itself, and
    which modelling choices the published figure is most sensitive to.
  provenance: >-
    RECALLED FROM MODEL MEMORY ON 2026-08-09. NOT WEB-SEARCHED, NOT READ IN
    PRIMARY TEXT, NOT FILED AS KN-LIT. Research targets: Kim-Barbulescu exTNFS
    (RECALLED as the result that lowered BN254 estimates), Barbulescu-Duquesne
    "Updating key size estimations for pairings" (RECALLED as the standard
    reference for post-exTNFS pairing curve security levels), Guillevic's
    surveys and estimation tooling (RECALLED), and the CFRG pairing-friendly
    curves draft (RECALLED). The specific bit figures named above are RECALLED
    and UNVERIFIED and must be replaced by primary reads before use.
  constraints:
    - No cost claim may be recorded before the exTNFS reference and at least one pairing-curve key-size estimation paper are filed as KN-LIT entries.
    - Every cost figure is reported as an (operations, memory) pair with the machine model named; a scalar "bit level" with no memory statement is not admissible output of this goal.
    - The calibration DL must be certified — the recovered exponent re-verified by an independent checker — before any extrapolated figure is recorded.
    - Extrapolation to deployment parameters is reported with the extrapolation's own uncertainty, and never as a security level assertion about a deployed system.
    - A failed or incomplete computation is a budget outcome about a solver and never evidence about the curve (AGENTS.md rule 3).
  status: active
  owner: coordinator
  created_at: '2026-08-09'
