research_question:
  id: RQ-XEDN-002
  title: >-
    On a non-isotrivial (a(t) ≠ 0) rational elliptic surface family over F_p(t),
    do Mordell-Weil relations among low-degree free-x integral sections still
    have absolutely bounded coefficients, or does max_|coeff| grow with p once
    the μ₃ automorphism is removed?
  scope:
    curve_families:
      - >-
        non-isotrivial Weierstrass surfaces y^2 = x^3 + a(t) x + b(t) over F_p(t)
        with a ≠ 0, deg a ≤ 2, deg b = 6 exactly, and non-constant j-invariant
    field_types: [prime field F_p, rational function field F_p(t)]
    bit_sizes: ["p in {7, 13, 19, 31}"]
    methods:
      - free-x section enumeration under an explicit square predicate
      - group-law verified relation extraction (specialisation control)
      - polarisation / Shioda height Gram as a diagnostic secondary metric only
  motivation: >-
    GOAL-ICLIFT-001 / EXP-XEDN-003 found max_|coeff|=1 on the frozen a(t)=0
    family, but every tested p was ≡1 mod 3 and the bound was saturated by μ₃
    orbit sums S+wS+w²S=O (KN-FIND-003, RT-XEDN-003-02). That does not test
    coefficient growth for the non-isotrivial class that candidate B2 actually
    names. This question is the cheapest control that can force withdrawal of
    any transfer of the coefficient-bound closure beyond the isotrivial window.
  decision_target: >-
    Whether H-XEDN-003 is supported (bounded coefficients without μ₃ inside
    the tested non-isotrivial window) or rejected (growth / inf-norm ≥4 on a
    verified shortest relation), with an explicit claim boundary that does not
    over-claim crypto scale or B2 closure.
  constraints:
    - Toy scale only; generated surfaces only; no attack or crypto-scale claim.
    - >-
      The family must be non-isotrivial: a(t) ≠ 0 and j non-constant on every
      surface admitted to the Gram/trend arms.
    - >-
      Coefficient claims rest on group-law-verified relations; height-Gram rank
      is diagnostic only (lesson of VAL-XEDN-003-01 / KN-FIND-003).
    - Negative evidence closes only the exact tested scope (AGENTS.md rule 6).
  status: active
  owner: coordinator
