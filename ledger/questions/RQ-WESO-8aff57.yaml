research_question:
  id: RQ-WESO-8aff57
  title: >-
    Assess the Wesolowski 2026 p^{1/3+o(1)} supersingular isogeny attack:
    conditional validity, heuristic status, and concrete threat at
    cryptographic parameters.
  scope:
    source: SRC-P13-WESOLOWSKI-2026
    problems: [OneEnd, EndRing, Isogeny]
    curve_families: ["supersingular over F_{p^2}"]
    methods:
      - conditional asymptotic complexity audit
      - heuristic validation and falsification
      - van Oorschot-Wiener middle-memory cost versus Delfs-Galbraith
      - per-entry table-build cost calibration
  motivation: >-
    Wesolowski's 2026 result is the programme's canonical target-profile
    exemplar: an exponent-moving conditional theorem with explicit heuristics
    and a concrete threat question at NIST-scale parameters. The harness must
    independently verify or falsify both the mathematics and the cost model.
  decision_target: >-
    Whether the conditional theorem, Heuristic 1, and concrete NIST-I threat
    assessment are supported, weakened, or remain inconclusive under honest
    scope and promotion gates.
  constraints:
    - asymptotic claims require archived proof decomposition and promotion gates
    - toy-scale measurements never presented as crypto-scale validation
    - every conditional dependence carries a validation plan or evidence
  status: active
  owner: coordinator
  related_goals: [GOAL-P13-001]
  related_hypotheses: [H-WESO-001, H-P13-001]
