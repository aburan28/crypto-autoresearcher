research_question:
  id: RQ-MCEQ-fcb504
  title: Does Matrix Code Equivalence inherit the known weaknesses of permutation/monomial
    code equivalence, or does the two-sided action block them?
  owner: coordinator
  added: '2026-08-08'
  status: open
  question: Does the Matrix Code Equivalence (MCE) problem inherit the structural weaknesses
    known for permutation and monomial code equivalence, or do the two-sided action A*X*B
    and the rank-stratum geometry block the standard invariant-based distinguishers?
  motivation: Raised while filing the 2026-08-08 bulk ideation round. Two proposals in that
    round (see linked_proposals) target matrix code equivalence directly, but no research-question
    record existed to bind them to. This record is created solely so those proposals have
    a well-formed question_id; it is NOT attached to any active GOAL-* campaign.
  provenance_note: NOT a renaming or reinterpretation of GOAL-MCE-001. That goal was verified
    on 2026-08-08 to be about CLASSIC MCELIECE ("does the 2026 heuristic subexponential line
    reach the standardized parameters, and what is the charged ISD cost there?"), bound to
    RQ-MCE-e65b3c. The Coordinator's generator brief for that ideation round mistakenly glossed
    the "MCE" acronym as "matrix code equivalence"; the idea-generator flagged the discrepancy
    rather than silently resolving it, and covered both readings. The Classic McEliece ideas
    were filed against RQ-MCE-e65b3c; the two genuine matrix-code-equivalence ideas are filed
    here.
  scope:
    in_scope:
    - MCE hardness relative to permutation/monomial code equivalence
    - hull-based and support-splitting-style invariants under the two-sided action
    - rank-stratum counting arguments as an obstruction to Leon-style matching
    out_of_scope:
    - Classic McEliece / binary Goppa parameter security (that is RQ-MCE-e65b3c)
  status_note: No campaign is opened against this question by its creation. It is parked as
    an open question until a Coordinator decision ranks it.
  linked_proposals: []
  created_by: coordinator
