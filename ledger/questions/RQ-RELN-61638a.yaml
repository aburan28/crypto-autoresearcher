research_question:
  id: RQ-RELN-61638a
  id_allocation_provenance: >-
    Token minted 2026-09-06 with `python3 tools/allocate_id.py --next
    research_question --area RELN` and confirmed free with `--check`. Not
    derived by scanning state.
  added: '2026-09-06'
  goal_id: null
  goal_id_note: >-
    Not yet bound to a GOAL record. GOAL-RELN-001 (factor-base decomposition
    probability audit) is the natural host: this question studies the
    DISTRIBUTION of the decomposition-count vector that goal's mean audits,
    and the same certificate contract applies. Binding it to GOAL-RELN-001
    (appending to question_ids) is a Coordinator ledger-archive act recorded
    separately; a message or this record does not perform it.
  user_instruction_verbatim: >-
    "Plz add some ideas and experiments for this graph neural nets where
    points and relations form a graph, and see if there are clusters of
    easier decompositions. And if compute is no issue maybe reinforcement
    learning to guide a search policy, but the gold standard for me would be
    symbolic regression. Try to spit out candidate invariants you could
    actually try to prove." (user, 2026-09-06)
  title: >-
    Learned structure discovery on the point-relation hypergraph of
    prime-field point decomposition: (i) do targets with many or easy
    factor-base decompositions CLUSTER in any sense decidable from the
    target's representation, as a graph neural network over the
    point-relation incidence structure would detect; (ii) can a learned
    (reinforcement) search policy lower the fully charged cost per certified
    relation against a fixed-strategy baseline, and on which channel; and
    (iii) which closed-form invariants of the decomposition-count vector
    c_D(r) does symbolic regression recover from exhaustive toy data and the
    ledger's committed tables, stated so that each can be proved or refuted?
  scope:
    curve_families:
      - >-
        generic prime-field short-Weierstrass curves E/F_p of prime order N
        (at least 3 curves per cell), factor bases defined on the x-line
        (intervals, quadratic-residue classes, images of low-degree maps)
        and matched uniformly random bases of the same size
      - >-
        the additive group Z/N with an interval base [1, B] as the
        KNOWN-STRUCTURED positive control (its m-fold sumset is an interval
        and its additive energy is maximal) and Z/N with a random base as the
        structure-free null; Bose-Chowla B_m (Sidon-of-order-m) bases as the
        KNOWN-MINIMUM-ENERGY control
      - >-
        the object under study is the decomposition-count vector
        c_D : G -> Z_{>=0}, c_D(r) = number of size-m multisets from the base
        D summing to r, and the incidence hypergraph it defines (vertices =
        group elements and base elements; a hyperedge per decomposition)
    field_types:
      - prime field F_p
      - the abstract cyclic group Z/N as control
    bit_sizes:
      - "exhaustive: N from 2^14 to 2^22 where c_D is computed exactly for
        every target (M = C(B+m-1, m) multisets, M ~ N at the m = 3 index-
        calculus base size B ~ (6N)^{1/3})"
      - "sampled: N from 2^24 to 2^32 with c_D estimated on a fixed target
        sample; certificates on every claimed decomposition"
      - "symbolic: identities and bounds stated for all (N, B, m)"
    methods:
      - >-
        exact enumeration of the decomposition-count vector and its second
        moment (multiset additive energy E_m(D)), dispersion index, k-rich
        target counts, and pushforwards along representation-decidable
        partitions, with the exchangeable (affine-invariant) random-base null
      - >-
        inductive graph-neural / feature-learned decomposability prediction
        with coordinates-only node features, train/test split by target, the
        four-arm control panel (E with x-line base, E with random base, Z/N
        with interval base, Z/N with random base), a label-permutation null,
        and a growth arm in N; scored by the precision lift lambda and yield
        lift rho of IDEA-20260830-c5c614 against their selection null
      - >-
        learned search policies (bandit or reinforcement learning) for the
        target-selection, solve (Groebner / hybrid-guess selection), and
        linear-algebra-ordering channels, each measured against a fixed
        default strategy AND against a structure-free null system of the same
        shape (semi-regular random system; relabelled Z/N), charged end to
        end
      - >-
        symbolic regression over exhaustive toy tables and committed ledger
        tables with pre-registered RECOVERY CONTROLS (laws already proved:
        the conservation mean of KN-FIND-007, the m = 2 exact law of
        IDEA-20260906-86cd30, the semi-regular solving-degree formula) and a
        held-out N rung; every recovered expression becomes a proof
        obligation or a counterexample search, never a result by itself
  motivation: >-
    The program has proved that the MEAN decomposition yield is geometry-
    invariant (KN-FIND-007: sum_r c_D(r) = C(B+m-1, m) exactly), that the
    coverage and rank channels are constant-bounded (IDEA-20260830-772cff),
    and that the one door conservation leaves open is a target set decidable
    from the representation x(R) (IDEA-20260830-c5c614, red-team objection
    RT-4 of the FB3 battery). IDEA-20260815-f9e978 asks for the distribution
    of P(decomp | target) rather than its mean and IDEA-20260726-003 proposes
    a per-target difficulty predictor from Semaev fibre geometry;
    IDEA-20260805-a25f11 identifies the m = 2 collision deficit with the
    additive energy of the base; IDEA-20260906-86cd30 shows the m = 2
    decomposition graph is a path with an exact random-base law and the m = 3
    structure is a 3-uniform hypergraph with a Janson bracket. What no record
    does is (a) ask whether the count vector has STRUCTURE visible from the
    representation -- clusters of easy targets -- using a function class
    larger than a frozen predicate grammar, with the controls that make a
    positive answer believable; (b) state the second-moment identity
    sum_r c_D(r)^2 = E_m(D) at general m and read the cluster question as
    the additive-energy question it is, with its provable regime (character
    sums, only for B far above the index-calculus base size) and its open
    regime; (c) use a learned model as an INSTRUMENT whose output is then
    compressed by symbolic regression into a formula that can be proved.
    The user's stated gold standard is (c): candidate invariants that can
    actually be proved. The learned components are instruments for finding
    them; a learned model's accuracy is never itself a result of this
    question.
  decision_target: >-
    Either (a) a measured, control-matched finding that decomposable targets
    on x-line-defined bases carry NO representation-decidable structure
    beyond the exchangeable null at the tested scale (every learned
    predictor's precision lift decays toward 1 with N at a stated rate; the
    dispersion index tracks the random-base value; recovered symbolic
    expressions reproduce only the proved laws), recorded with the measured
    obstruction (the energy excess with its interval) and forward guidance;
    or (b) a replicated, null-separated structure (a predictor whose lift
    does not decay, an energy excess that grows with N, or a recovered
    closed form that predicts a held-out rung) that becomes a stated
    invariant with a proof attempt and a nearby-object control; either way,
    a list of candidate invariants each marked proved / open / refuted with
    the record that settles it. Toy-scale evidence authorizes scaling work
    and proof work only; nothing here is an ECDLP speedup claim.
  constraints:
    - >-
      Every learned model is trained and evaluated with coordinates-only
      features for unseen targets; no feature may depend on a discrete
      logarithm, and the exhaustive labels are computed by a code path the
      model never sees (leak audit mandatory).
    - >-
      The four-arm control panel and a label-permutation null are mandatory
      in every learned-predictor cell; a model that fails to find the
      Z/N-interval positive control is uninformative and no negative result
      may be reported from it.
    - >-
      Any learned-policy gain is reported as the difference between the gain
      on the object and the gain on the structure-free null of the same
      shape; a gain that does not grow with N is a constant and is reported
      as such (IDEA-20260830-772cff channel ledger).
    - >-
      Symbolic regression must recover the pre-registered proved laws before
      any new expression is reported; expression complexity is reported with
      every fit; a recovered expression is a candidate invariant, never
      evidence.
    - >-
      Conservation (KN-FIND-007) is a whole-group identity; every claimed
      lift or cluster is measured on a PROPER subset selected without a
      discrete logarithm, against the exchangeable selection null.
    - >-
      Toy scale only for exhaustive cells; no crypto-scale claim regardless of
      outcome (AGENTS.md rules 4 and 6); every cell states its curves, p, N,
      base, arity, solver and budget.
    - >-
      Timeouts, out-of-memory events, solver crashes and training failures
      are failed_infrastructure, never evidence (AGENTS.md rule 3).
    - >-
      Every claimed decomposition carries an independently re-verified
      certificate (docs/claims-and-verification.md); a count without checked
      identities is not a measurement.
    - >-
      Compute is not a stop (docs/research-budget-policy.md); memory and
      worker limits remain machine protection.
