research_question:
  id: RQ-FNDSA-001
  title: >-
    Does FN-DSA's signature distribution deviate from its ideal discrete
    Gaussian by enough to leak the NTRU trapdoor — from floating-point
    or integer-reformulated sampler behaviour, not merely from timing —
    and how many signatures does a deviation of a given size cost?
  scope:
    scheme: "FN-DSA (draft FIPS 206, formerly FALCON)"
    family: "lattice signature (NTRU hash-and-sign with Gaussian sampling)"
    assumption: >-
      NTRU trapdoor hardness plus exactness of the discrete Gaussian
      sampler
    standardization_status: >-
      Not yet final. Reported: draft submitted for approval 2025-08-28
      and in final review, with publication expected late 2026 or early
      2027 — unverified here. This goal therefore has a live window in
      which findings can still reach the standard.
    targets:
      - >-
          distributional exactness of the standardized sampler,
          independent of timing
      - >-
          any integer-only or reformulated sampler in the draft versus
          the floating-point original
      - >-
          the deviation-size to required-signature-count curve for
          trapdoor recovery
      - >-
          NTRU trapdoor hardness at FN-DSA parameters and distance from
          the overstretched regime
    methods:
      - >-
          statistical testing of sampled signature distributions against
          the ideal, with a pre-registered test and alpha
      - >-
          null-object control: the same test against an exactly-sampled
          reference implementation
      - >-
          deliberately biased sampler as a positive control, to
          calibrate detection power
      - >-
          any claimed recovery carries a certificate: the recovered
          trapdoor must reproduce valid signatures
    claim_tier_ceiling: >-
      Toy-tier until a certified instance at or above the standardized
      parameter scale exists. AGENTS.md rule 7 applies: no toy-scale result is
      reported as a statement about a standardized parameter set. A
      standardized algorithm makes this rule more binding, not less.
  motivation: >-
    FN-DSA's compactness comes from hash-and-sign over an NTRU trapdoor,
    and the entire security argument depends on signatures being
    distributed as an exact discrete Gaussian over the lattice coset:
    any bias is a direct statistical channel to the trapdoor, which is
    how NTRUSign died. The community focus has been on timing — the
    sampler's floating-point arithmetic and rejection counts leak,
    implementations have been patched, and the draft standard reportedly
    requires constant-time execution. Timing is the easier half. The
    harder and more durable question is *distributional exactness*: a
    perfectly constant-time sampler with a slightly wrong distribution
    leaks anyway, and no amount of constant-time discipline detects it.
    The measurable object is the deviation-to-signature-count curve.
    These are the algorithms already being deployed, so the cost of a
    wrong security estimate is different in kind from a Round-3
    candidate's: migration schedules are being set against them
    (reported June 2026 US federal deadlines of 2030 for key
    establishment and 2031 for signatures — unverified here), and a
    parameter set that is standardized is a parameter set nobody will
    re-derive on their own.
  decision_target: >-
    Whether the standardized FN-DSA sampler is distributionally exact
    enough that trapdoor recovery stays out of reach at realistic
    signature counts, independent of timing behaviour.
  provenance: >-
    Algorithm roster taken from the NIST PQC standardization 'selected
    algorithms' page. csrc.nist.gov and nist.gov are unreachable from
    this harness's network policy (proxy CONNECT 403), so the roster and
    status dates were confirmed from secondary reporting rather than
    read from the primary page, and no FIPS text has been read by this
    program. Every per-algorithm technical claim below is a research
    target to be verified against the primary standard and against
    primary attack literature before any experiment is designed, not an
    established result.
  constraints:
    - >-
      Every per-algorithm technical claim in this record is sourced from
      secondary reporting or from memory of the literature and is UNVERIFIED.
      No experiment may be designed until the relevant primary sources are
      filed as KN-LIT entries.
    - >-
      Matched-baseline discipline: no attack cost is reported without the
      best-known baseline at identical parameters, with memory, preprocessing,
      and verification charged.
    - >-
      Any claimed break carries a certificate that the run wrapper re-verifies
      independently. See docs/claims-and-verification.md.
    - >-
      These algorithms are deployed or near-deployment. A claim about a
      standardized parameter set carries operational consequences, so no
      result leaves this program at a claim tier above the one its evidence
      supports, and no toy-scale finding is phrased as a statement about
      fielded systems.
  status: active
  owner: coordinator
  created_at: '2026-07-29'
