research_question:
  id: RQ-KEX-b8be01
  title: >-
    Can a key-exchange candidate be constructed whose every flatness assumption
    is one this program measures itself — and if not, which named obstruction
    kills it, at the closure standard that treats "we could not break it" as
    unverified?
  scope:
    curve_families:
      - ordinary elliptic curves over prime fields F_p (p > 3), taken with their
        full F_p-isogeny class and both volcano coordinates
      - supersingular curves over F_p and F_{p^2} ONLY as the reproduction
        baseline of lane L2 (CSIDH, OSIDH, SIDH), never as the novel object
      - imaginary quadratic orders O_f and their class groups Cl(O_f), as the
        acting object on the ordinary crater
    field_types:
      - prime field F_p
      - quadratic extension F_{p^2} (lane L2 baselines only)
    bit_sizes:
      - "toy only: log2 p <= 32 for every metered claim (docs/claims-and-verification.md
         derives `toy` mechanically at <= 32 bits); 40-bit N appears only where an
         existing record (EV-ECTD-8c098d) is cited at its own tier"
      - "no medium- or crypto-tier parameter set is authorized under this goal;
         a candidate reaching that scale requires a successor goal"
    methods:
      - object-first candidate generation against a declared off-limits list
        (docs/inventor-protocol.md section 1)
      - >-
        the lossy-projection test run in the constructive direction
        (section 2) — a public key that discards nothing is a broken scheme, and
        a public invariant that determines the secret is the cheapest possible kill
      - null-object controls before belief (section 3), instantiated as
        random-instance and public-invariant nulls over the public-key space
      - exhaustive metering over a certified-complete public-key set, using the
        program's existing attack meters (Semaev/Groebner d_reg, factor-base
        yield, matched Pollard rho/BSGS baselines, ICINV cost functionals)
      - baseline reproduction of the incumbent scheme AND of its best published
        attack before any novelty is claimed (section 8 proof_search_map)
  motivation: >-
    Every goal in this program attacks a scheme somebody else built. That has
    produced a body of measurements whose consistent finding is an ABSENCE: no
    confirmed attack-cost outlier inside an ordinary isogeny class at 40-bit N
    (EV-ECTD-8c098d, preliminary, weakens, five classes, single unreplicated
    batch); no distortion map on an ordinary prime-field curve, because every
    geometric endomorphism commutes with Frobenius and acts on a prime-order
    subgroup as a scalar (EXP-PAIR-21437a, frozen draft contract, UNRUN); no
    discrete-logarithm leverage in Elkies torsion transport, whose data
    D_ell(E,P,Q) = (E', phi(P), phi(Q)) is publicly computable without any
    discrete logarithm (EXP-TORS-328b59, frozen draft contract, UNRUN).
    Read as cryptanalysis these are failures. Read as design they are exactly
    the flatness properties a group-action key exchange must ASSUME and that no
    scheme designer has ever measured directly — they assume them from the
    absence of a published attack. This program can instead measure them, over
    a certified-complete public-key set, at toy scale, exhaustively. That is a
    contribution available to this repository and to almost nobody else, and it
    is worth making whether or not a viable construction survives.
    The question is asked in full awareness that the likely answer is negative.
    A negative answer at the section 4 standard — a named obstruction, an
    argument, and forward guidance — is the expected and acceptable deliverable.
  decision_target: >-
    Whether to open a successor goal carrying a specified key-exchange candidate
    toward larger parameters, or to record a per-lane closure naming the
    obstruction that kills the constructive route and the classes it leaves open.
    The decision explicitly does NOT include any recommendation to implement or
    deploy anything: no artifact produced under this question is a deployment
    recommendation, and no candidate may be described as secure.
  constraints:
    - >-
      NOVELTY IS GATED ON REPRODUCTION. No candidate is admitted as novel until
      lane L2 has reproduced, in-repo and at toy scale, both the incumbent
      construction and its best published attack (CSIDH class-group action;
      OSIDH descending chains and the Dartois-De Feo attack; SIDH and the
      Kani-based torsion-point break). A design goal that cannot break the
      schemes it means to improve on has not earned the word "new".
    - >-
      "WE COULD NOT BREAK IT" IS A FATIGUE REPORT, NOT A SECURITY CLAIM. The
      inventor-protocol section 4 closure standard applies to construction
      exactly as it applies to cryptanalysis: survival of an attack campaign is
      `unverified`. The security deliverable is a named obstruction argument for
      why a stated attack CLASS cannot apply, not a count of attacks attempted.
    - >-
      Toy tier only, on every claim, with no exception. No metered claim above
      log2 p = 32. Extrapolation to any deployed parameter size is forbidden
      even as commentary; where transfer is discussed it is labelled as an
      untested assumption and carries no evidence weight.
    - >-
      EV-ICINV-c68f13 IS GATED AND MAY NOT BE USED AS A FOUNDATION.
      DEC-20260807-4261e3 blocks its citation outside the ICINV lane until
      independent Validator and Red Team review exists (`independently_reviewed:
      false`, promotion gate 4 unmet). It may be named as a DEPENDENCY whose
      discharge would strengthen lane L4; it may not be cited as support.
    - >-
      Scope separation from adjacent goals, binding: GOAL-ECTD-001 owns
      elliptic-curve TRAPDOORS (secret advantage for the constructor) and
      GOAL-HYBRID-001 owns KEM COMBINERS; GOAL-CSIDH-001 owns CSIDH quantum cost
      models. This question owns none of those. Where a lane touches them it
      cites their records and defers, and it never re-opens their questions.
    - >-
      No universal impossibility claim, per docs/claims-and-verification.md.
      A closure names an obstruction within a stated class; it never asserts
      that no key exchange of a general shape can exist.
    - >-
      Every deliverable carries `dominated_by` and `sota_delta` (inventor
      protocol section 5). A candidate dominated by X25519 or ML-KEM on every
      cost axis is recorded as dominated. `dominated_by: null` is admissible
      only after checking every frontier row and is otherwise a rule-5 fabrication.
    - >-
      Section 1 of the inventor protocol runs at reduced strength here, and the
      record must say so: the ECDLP tracked-object enumeration is KN-OPEN-019
      and is still open, so any family list this question produces is a sketch,
      not a taxonomy, and no closure may rest on the list being complete.
  status: active
  owner: coordinator
