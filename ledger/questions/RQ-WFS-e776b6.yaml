research_question:
  id: RQ-WFS-e776b6
  title: >-
    Weak Fiat-Shamir keeps producing the same vulnerability class in
    multi-round arguments — is transcript completeness a decidable property,
    and what is the concrete grinding cost that separates round-by-round
    soundness from the bit levels proof systems quote?
  scope:
    scheme: "the Fiat-Shamir transform applied to multi-round public-coin arguments: sumcheck-based protocols, FRI-based low-degree tests, and a reference PLONK-like and STARK-like pipeline built for this goal"
    family: "interactive arguments, Fiat-Shamir, round-by-round and state-restoration soundness"
    standardization_status: >-
      RECALLED, UNVERIFIED: no standardized proof system, but multi-round
      Fiat-Shamir arguments secure billions of dollars of value in rollups and
      bridges, and several NIST-adjacent efforts on zero-knowledge proof
      standardization exist.
    targets:
      - >-
        A CERTIFICATE PER OMISSION CLASS: a reference multi-round argument with
        a parameterized Fiat-Shamir transform in which each transcript element
        (public statement, public parameters, each prior prover message, the
        round index, the domain separator) can be omitted, and for each
        omission a LITERAL FORGED PROOF accepted by the honest verifier for a
        false statement. This is a complete, decidable enumeration over a small
        set, not a search.
      - >-
        THE DECIDABLE CRITERION: a static check over an implementation's
        transcript construction that accepts exactly the instantiations for
        which no certificate exists in the enumeration. Whether such a check
        exists at all — and what it must inspect — is the research content.
      - >-
        THE GRINDING CURVE: for a FRI-like protocol, the measured cost of
        state-restoration/grinding attacks as a function of round count,
        challenge entropy, and repetition parameter, set against the bit level
        the parameters are chosen to give. Quoted security for these systems
        commonly assumes a soundness conjecture; the measured curve is what the
        parameters actually buy against the attack that is implemented here.
      - >-
        THE CONJECTURE SURFACE: which quoted security levels depend on a
        proximity or soundness conjecture rather than a proven bound, stated as
        a table over the reference pipeline's parameter sets.
    methods:
      - Reference implementations of each protocol with a switchable transcript, built for this goal and used only here.
      - Complete enumeration over omission classes with a forgery attempt per class and a declared budget per attempt.
      - Direct implementation of grinding attacks with measured cost, seeds declared, at parameter sets small enough to complete and swept to expose scaling.
    claim_tier_ceiling: >-
      REFERENCE-IMPLEMENTATION CLAIMS ONLY. A forgery against this program's
      deliberately weakened reference protocol is a statement about that
      instantiation. NO THIRD-PARTY PROOF SYSTEM, LIBRARY, CIRCUIT, CONTRACT OR
      DEPLOYMENT IS EXAMINED, TESTED, NAMED OR CHARACTERIZED UNDER THIS
      QUESTION, and no record may assert or imply that any deployed system has
      any of the properties studied here.
  motivation: >-
    The weak-Fiat-Shamir class is unusual: the underlying mistake is simple,
    completely understood, published repeatedly, and it keeps recurring, because
    the correctness condition lives in an implementation detail that no test
    vector exercises. That is exactly the shape of a property that should be
    made decidable and checked mechanically rather than reviewed by eye. The
    grinding question is the same shape one level up: parameters are chosen from
    a formula, and the attack the formula is protecting against is rarely run.
    Both produce literal certificates, and neither requires touching anyone's
    deployed system.
  decision_target: >-
    Whether transcript completeness admits a decidable static criterion that
    matches the certificate enumeration, and what the measured grinding curve
    is for a FRI-like reference protocol.
  provenance: >-
    RECALLED FROM MODEL MEMORY ON 2026-08-09. NOT WEB-SEARCHED, NOT PRIMARY-READ,
    NOT FILED AS KN-LIT. Research targets: the "Frozen Heart" vulnerability
    disclosures on weak Fiat-Shamir (RECALLED), Ben-Sasson-Chiesa-Spooner on
    interactive oracle proofs (RECALLED), Canetti et al. and Holmgren on
    Fiat-Shamir soundness (RECALLED), round-by-round soundness (RECALLED as due
    to Canetti-Chen-Holmgren-Lombardi-Rothblum-Rothblum-Wichs), and the FRI
    soundness conjecture line. All UNVERIFIED.
  constraints:
    - No certificate is recorded before at least one primary weak-Fiat-Shamir reference and the protocol specifications under test are filed as KN-LIT entries.
    - Every forged proof is re-verified by an independently written verifier and accompanied by the exact omission that enabled it.
    - No third-party proof system, library, circuit, deployment or repository is examined, fetched, tested or named as having any property.
    - A forgery against a deliberately weakened reference implementation is labelled as such in the record's title.
    - Grinding costs are reported with the machine model and seed; an unreproducible timing is not admissible evidence.
  status: active
  owner: coordinator
  created_at: '2026-08-09'
