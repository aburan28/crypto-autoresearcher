research_question:
  id: RQ-ECQ-e9b361
  goal_id: GOAL-ECQ-2298dc

  title: >-
    Can this program exhibit an elliptic curve over Q of Mordell-Weil rank at least 32 -- and if
    not, exactly which quantity blocks it?

  scope:
    curve_families:
    - elliptic curves over Q, given by explicit integral Weierstrass models
    - elliptic surfaces over Q(t) and their specialisations at rational t
    - quadratic twists of a fixed curve over Q
    - quadratic base changes of a fixed family over Q(t)
    field_types:
    - Q -- the base field, NON-NEGOTIABLE for this question
    - Q(t), admissible as a CONSTRUCTION DEVICE ONLY, never as the field a rank is reported over
    - >-
      number fields of any degree, including quadratic and multiquadratic, EXPLICITLY OUT OF SCOPE.
      A rank over a number field does not answer this question and may not be presented as if it
      did. A previous campaign's rank->=31 result over multiquadratic fields was rejected for exactly
      this reason, and that rejection binds every record under this question.
    bit_sizes:
    - not applicable; the parameter of this question is the RANK itself, not a security parameter
    methods:
    - exact certification of independence by reduction at good primes and mod-l linear algebra
    - exhibited-point search over frozen, pre-declared height boxes
    - Mestre-Nagao style triage of candidate specialisations and twists
    - specialisation of families of high generic rank over Q(t)
    - Shioda-Tate ceiling computation from a family's own fibre configuration
    - lattice-theoretic enumeration of elliptic fibrations on a fixed surface

  motivation: >-
    RANK >= 31 OVER Q IS THE LIVE WORLD RECORD AND IT IS CLAIMED. ICARM curve no. 302 posted rank
    >= 31 on 2026-08-23, three days after curve no. 273 took 30 on 2026-08-20; before that pair the
    record moved by +1 in EIGHTEEN YEARS (28, Elkies 2006; 29, Elkies-Klagsbrun 2024). Two
    increments in three days after eighteen years for one is the signature of an active, well
    resourced effort holding the frontier right now. THE USER DIRECTIVE IS THE LITERAL TARGET: an
    elliptic curve over Q of Mordell-Weil rank >= 32. This question exists to pursue that target
    honestly rather than to restate it, and its honest situation, taken from the eight committed
    IDEA-20260824-* records, is: out-sieving the current holders is NOT PLAUSIBLE with this
    program's resources; the only structural route the idea set identifies is a Q(t) family of
    generic rank >= 32, and no such family exists in the literature or in the idea set, where the
    standing record for generic rank over Q(t) is 18 (Elkies 2006); and the nearest genuinely
    reachable world record is generic rank >= 19 over Q(t), which is thirteen short of the target
    and is an ADJACENT record, not this one. A question that quietly aimed at the adjacent record
    and reported it as the target would be dishonest by construction, so both are named, ranked and
    kept apart here and in GOAL-ECQ-2298dc's completion criteria.
    THE SECOND HALF OF THE QUESTION IS THE HALF MOST LIKELY TO BE ANSWERABLE. If 32 is not reached,
    what blocks it should come back as a MEASURED QUANTITY over a stated scope -- the base rank
    available over Q(t), the descent index between geometric and arithmetic rank, the tail of the
    `extra` distribution, the coverage a fixed budget buys -- and not as a verdict. An obstruction
    recorded as prose is a fatigue report; recorded as a number with error bars and a scope it is an
    object the program can act on, including by reading it the other way round.

  decision_target: >-
    Which of the two levers the campaign should spend on -- the BASE RANK over Q(t), untouched at 18
    since 2006, or the `extra` bought by sieving specialisations, where the published ladder has
    moved from 11 to at least 14 since 2006 -- together with a certified statement of what this
    program's own instrument can and cannot certify at record scale. The first dispatched
    experiment, EXP-ECQ-f5af06, answers the instrument half directly: if the 31 published witness
    points of ICARM no. 302 cannot be certified independent in exact arithmetic within budget, then
    32 is not claimable by this program at this scale, and that is a capability finding that
    reprioritises everything downstream.

  constraints:
  - >-
    EVERY CLAIM IS OVER Q. A result over a number field, or a generic rank over Q(t) without an
    exhibited specialisation over Q, does not answer this question and may not be presented as if it
    did.
  - >-
    RANK LOWER BOUNDS ARE UNCONDITIONAL AND FROM EXHIBITED POINTS ONLY. Never an analytic rank,
    never a Selmer upper bound, never a bound resting on BSD or GRH. Rank equality is never claimed.
  - >-
    NO FLOATING POINT ANYWHERE IN A CERTIFICATION. Not in a torsion bound, not in a point count, not
    in the linear algebra, and no Neron-Tate regulator, whose positive-definiteness cannot be decided
    in floating point.
  - >-
    RANK >= 31 OVER Q IS THE LIVE RECORD AND IS CLAIMED. No record under this question may describe
    it as unclaimed or unbeaten-at-31; an earlier session in this program made exactly that error and
    the correction binds here.
  - >-
    THE WORLD RECORD IS NOT THIS PROGRAM'S TO RESTATE AS ITS OWN RESULT. Independently certifying
    someone else's curve is an EXTERNAL POSITIVE CONTROL and is reported as a confirmation of their
    result.
  - >-
    EVERY SEARCH RANGE, THRESHOLD AND SELECTION RULE IS FROZEN IN A COMMITTED CONTRACT BEFORE THE
    RUN THAT USES IT, and every coverage figure is reported as numerator over denominator with the
    denominator recorded before any candidate is tested. A range or threshold chosen after the
    survivors are known makes both figures functions of the outcome.
  - >-
    EVERY CITATION CARRIES ITS PROVENANCE with a verified_by naming the agent that read the source.
    A `recalled` citation is a pointer for a reviewer and never support (AGENTS.md rule 9).

