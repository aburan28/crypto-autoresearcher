research_question:
  id: RQ-PEXT-7c3e91
  title: >-
    For an elliptic curve E over K = F_{q^n} with n prime (no field strictly between F_q and K), what
    governs the smallest genus of a curve C over F_q that a Weil-restriction / GHS-type cover attaches to
    E, in every characteristic: which structures (F_q-structures tau on the x-line, choice of degree-2
    function), which isomorphism and isogeny classes (#E(K) 2-adically, the Galois type of E[2], j(E) in
    a subfield or not) admit a low-genus cover, and why does the floor grow with n?
  scope:
    curve_families:
      - "E/F_{q^n}, n prime, generic short-Weierstrass models y^2 = x^3 + a2 x^2 + a4 x + a6 in odd
        characteristic (every K-isomorphism class at the smallest q, fixed-seed samples above it)"
      - "characteristic 2: E: y^2 + xy = x^3 + a x^2 + b over F_{2^n}, n prime, as the cross-characteristic
        arm (classical GHS magic number and Hess's generalisation)"
      - "isogeny classes of the above (2-isogeny neighbours and full classes where enumerable)"
    field_types:
      - "prime-degree extension fields F_{q^n}, q odd (p >= 3) or q = 2^l, n in {3, 5, 7} measured, n >= 11
        symbolic only"
    bit_sizes: [11, 16, 20, 22]
    methods:
      - "(2,...,2) GHS compositum of the n conjugate double covers of the x-line, genus
        g = 2^(m-2)(r-4)+1 from the branch data (r points, span dimension m), enumerated over every
        F_q-structure (Lang: tau = M sigma M^-1, one per coset of PGL2(F_q) in PGL2(K))"
      - "constructive enumeration of the low-genus branch configurations directly (cyclic-code patterns
        inside one sigma-orbit), instead of a full structure scan, where the scan is infeasible"
      - "paper derivations of floors and spectra by 2-torsion type (the F_2[x]/(x^n - 1)-module structure
        of the span; orbit lemmas; cross-ratio class), with the finite combinatorial steps kernel-checked
        in Lean"
      - "characteristic-2 magic-number computation (dimension of the F_2-span of the Frobenius conjugates)
        as a nearby-object control against the published n = 7 values"
  motivation: >-
    The sibling repository aburan28/crypto has three exact, bounded studies of odd-characteristic GHS cover
    genus at prime n (research/ghs_cubic_cover_census_20261012, research/ghs_cover_census_n5_20261013,
    research/odd_char_descent_genus3_20261014) and one consequence (research/cover_descent_genus_floor_20261015,
    floors 9 / 49 / 41 at k = 6 / 10 / 14 for F_p(j) = GF(p^k), no cover exhibited). At n = 3 the
    isogeny-class minimum is 13 / 5 / 3 for #E(K) odd / 2 mod 4 / 0 mod 4 (odd and 2 mod 4 floors proved,
    trace-zero class an unexplained exception); at n = 5 it is governed by the 2-torsion type with derived
    floors 33 / 33 / 25 / 5 and spectrum m in {1, 4, 5}. In both cases the admissible m are the dimensions of
    cyclic submodules of F_2[x]/(x^n - 1), which for n = 3, 5 has only the trivial and the full nontrivial
    factor because 2 is a primitive root mod 3 and mod 5. n = 7 is the first prime where it is not
    (x^7 - 1 = (x+1)(x^3+x+1)(x^3+x^2+1) over F_2, ord_7(2) = 3), so intermediate spans m in {3, 4} become
    possible, and the published characteristic-2 picture (KR-IC-791cb7: Hess genus-7 family at N = 7l,
    "potentially partially weak") has an n = 7 low-genus family the odd-characteristic census has never
    looked for. Iijima-Momose-Chao (KN-LIT-bf1772, abstract only) report a complete odd-characteristic
    classification for d in {2, 3, 5, 7}; nobody in this program has read it, so its content is a pointer.
    The program has no record that holds the general mechanism: which algebraic quantity sets the floor at
    prime n, across characteristics. This question holds it. It is a structural question about descent,
    not an attack question.
  decision_target: >-
    For each prime n reached (n = 7 first), a table of floor genus by class (2-torsion Galois type, v_2 of
    #E(K), j in F_q or not), each entry tagged derived (paper proof, finite steps kernel-checked) or measured
    (exact census with its coverage) or open, with the structures that attain it; and a decision on whether
    the floor is governed by the factorisation of x^n - 1 over F_2 (the multiplicative order of 2 mod n)
    together with the 2-torsion type, in both odd characteristic and characteristic 2 (alive: state and
    prove the general-n spectrum lemma and test it at the next prime with ord_n(2) < n - 1), or whether some
    other invariant is needed (record the counterexample structure and the invariant it points to).
  constraints:
    - >-
      Structural, exact, toy-scale. No deployed or standardized curve, no key, no discrete logarithm solved,
      no cost or speedup claim. Cost context (published asymptotics such as Diem's q^(2-2/g)) may be quoted
      as context only, labelled as not measured.
    - >-
      Every result carries its claim boundary: tested n, q, characteristic, coverage (exhaustive or
      fixed-seed sample with seed), cover construction ((2,...,2) compositum of a degree-2 function, or
      the characteristic-2 Artin-Schreier analogue), and whether the cover descends to F_q with a transfer
      injective on the large prime subgroup (not established by a genus count; recorded as open unless
      separately checked).
    - >-
      A bounded census proves nothing for all q. A floor is a theorem only with a written proof; the census
      tests it and may refute it with a counterexample certificate (curve, structure, branch data).
    - >-
      The existing n = 3 and n = 5 census records are a regression fixture: any new tool reproduces them
      exactly before an n = 7 panel is read.
    - >-
      Timeouts, OOM and crashes are failed_infrastructure, never evidence about a floor (AGENTS.md rule 5).
    - >-
      Scope boundary against other goals is recorded on GOAL-PEXT-4a1d6b; in particular the deployed
      F_{p^5} curves stay with GOAL-GFPN-380702 and binary-field index calculus and descent cost with
      GOAL-ECDLP2M-001.
