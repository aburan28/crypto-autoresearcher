research_question:
  id: RQ-QLWE-d2d713
  title: >-
    The hardness proof for LWE is itself a quantum algorithm. Can Regev's
    quantum step, or its ring/module analogues and the LWE-to-dihedral-coset
    equivalence, be run as an ATTACK subroutine rather than as a security
    proof — and if not, what precisely is the obstruction, stated with its
    quantifiers?
  scope:
    curve_families: []
    field_types:
      - >-
        The quantum step inside the worst-case-to-average-case reduction for
        plain LWE: the transformation of a bounded-distance-decoding oracle into
        a sampler of the dual lattice, and its inverse direction
      - >-
        The ring and module analogues of that reduction, and whether the quantum
        step's requirements tighten, loosen, or change shape when the lattice
        carries a ring or module structure
      - >-
        The recorded quantum-polynomial-time EQUIVALENCE between LWE and an
        extrapolated dihedral coset problem, and the structured extrapolated
        variants that would carry it to module instances
      - >-
        The dihedral hidden subgroup / hidden shift machinery reached through
        that equivalence, treated strictly as an algorithmic object over the
        relevant group and NEVER as the isogeny class-group action, which is a
        different group owned by a different question
    bit_sizes:
      - >-
        Asymptotic only for the reduction analysis, indexed by (n, q, alpha) with
        the normalisation convention for alpha stated explicitly per statement —
        the corpus already records that a stated alpha of sqrt(n)polylog(n) does
        not parse under the usual ratio convention, and an unpinned convention
        makes every downstream regime claim meaningless
      - >-
        Any simulation is at toy dimension and is an instrument check on the
        reduction's own mechanics, not an attack
    methods:
      - >-
        Transcribe the quantum step and its hypotheses from primary text with
        every quantifier and uniformity condition written out, then ask
        mechanically which hypothesis fails when the reduction is read in the
        attack direction. The whole question is whether the failure is a
        DEFINITIONAL asymmetry (the reduction consumes an oracle the attacker
        does not have) or a QUANTITATIVE one (the attacker has a weaker version
        of that oracle and the gap is a measurable number).
      - >-
        Cost the extrapolated-dihedral-coset route end to end under a declared
        quantum cost model: the number of coherent samples, the noise or
        extrapolation tolerance actually required, and what each is at concrete
        rather than asymptotic parameters. The corpus already contains a worked
        example of why this matters — a sample count polynomial in n and
        astronomically impractical at once — and the discipline is to report
        both facts and conflate neither.
      - >-
        Obstruction-first writing: for each route, the deliverable is a
        theorem-shaped sentence naming what would have to be true, so a
        successor can attack that sentence rather than re-reading the same
        papers. "No obvious way to do this" is not an obstruction and is not
        recordable as one.
    explicitly_not_in_scope:
      - >-
        Whether Simon 2026's DCP algorithm is correct. That adjudication is
        RQ-QLWE-1c4a3b's, and this question neither presumes nor anticipates its
        verdict. This question studies the REDUCTION MACHINERY connecting LWE to
        DCP — machinery that predates the claim, is independently recorded, and
        remains interesting whichever way the claim resolves.
      - >-
        Whether the reduction chain reaches ML-KEM's deployed parameters
        granting that claim. That conditional reach map is H-MLKEM-7f3a2c under
        RQ-MLKEM-001 and is not re-derived, extended, or contradicted here.
      - >-
        The dihedral-HSP lane against the CSIDH abelian isogeny group action,
        which is RQ-QALG-74bf20's. Shared machinery is not a shared result: a
        cost figure or mechanism established there does not transfer here, or
        the reverse, without an explicit cited reduction between the groups.
    claim_tier_ceiling: >-
      DERIVATION AND OBSTRUCTION MAPPING ONLY, with toy-scale instrument checks.
      Admissible: "the quantum step requires hypothesis H, which an attacker
      does not have, and the gap is exactly G"; "the extrapolated route needs S
      coherent samples at these parameters"; "the two directions differ
      definitionally, here". Inadmissible: any claim that LWE is broken or
      unbreakable, any verdict on a deployed scheme, and any restatement of an
      unverified external claim as established.
  motivation: >-
    LWE's worst-case hardness argument is unusual among the assumptions this
    program studies: the reduction that supports it is a QUANTUM algorithm, so
    the assumption's own foundation contains quantum machinery that a
    cryptanalyst is already permitted to run. That is an object-first observation
    rather than an attack, and it is the natural place to look for a mechanism
    that is not simply amplified lattice reduction — because it is the one place
    in the family where a genuinely quantum step is known to do something no
    classical step does.
    The published direction of that machinery is understood and the asymmetry is
    probably definitional: a reduction consumes an oracle that solves the
    worst-case problem, and an attacker has no such oracle. But "probably
    definitional" is a belief, not a recorded obstruction, and the difference
    between the two is the difference between a lane that is closed and a lane
    that everyone assumes is closed. Writing the obstruction down with its
    quantifiers is cheap, is falsifiable, and either closes the lane properly or
    exposes that nobody had.
    The same applies to the recorded quantum-polynomial-time equivalence between
    LWE and an extrapolated dihedral coset problem. An equivalence is a
    two-directional object; it says the quantum complexity of LWE is the quantum
    complexity of eDCP at a matching extrapolation rate. What that rate is at
    cryptographic noise, and what it would take to move it, is a concrete
    question with a concrete answer that this program has never computed for
    itself.
  decision_target: >-
    A committed obstruction map for the reduction-machinery lane: per route
    (Regev's quantum step in the attack direction; its ring and module analogues;
    the eDCP equivalence at cryptographic noise rates), either a stated,
    quantified obstruction with the boundary at which it holds and the condition
    under which a successor should reopen it, or — if no obstruction is found —
    a specified, costed mechanism handed to RQ-QLWE-9108dc for object-first
    development under its null-object controls. An obstruction map is the
    expected deliverable.
  constraints:
    - >-
      Every statement transcribed from a reduction carries its full quantifier
      order and uniformity conditions. A reduction quoted without them is not
      admissible as a premise, because reading a reduction backwards is exactly
      the operation that quantifier order forbids or permits.
    - >-
      Every alpha, gamma, noise rate, and sample count is recorded with its
      normalisation convention. Where a source's convention is ambiguous, BOTH
      readings are carried forward as separate rows until primary text settles
      it; picking one silently is inadmissible.
    - >-
      An obstruction is recordable only if it is a statement that could be
      false: it names the hypothesis that fails and what would have to be true
      for it not to. "No known way", "seems hard", and "this is well known" are
      not obstructions and never close a lane.
    - >-
      Proposals under this question are proof-oriented and require a
      `proof_search_map` per docs/inventor-protocol.md section 8 /
      knowledge/techniques/KN-TECH-080.md before any implementation is approved.
    - >-
      Any quantum cost is stated under a declared cost model with QRAM/QRACM
      assumptions named and charged; a polynomial asymptotic and an impractical
      concrete cost are reported as two separate facts and neither is used to
      soften the other.
    - >-
      No unverified external claim is restated as fact, before or after
      RQ-QLWE-1c4a3b adjudicates it, and no goal's threat model moves on one
      (KN-OPEN-8a5965, "record, do not re-plan").
    - >-
      No result, mechanism, or cost figure transfers between this question and
      RQ-QALG-74bf20, RQ-QALG-457b41, RQ-MLKEM-001, or RQ-MLKEM-003 in either
      direction without an explicit, cited reduction.
    - >-
      Timeouts, crashes, and resource exhaustion are infrastructure outcomes and
      are never evidence that a route is obstructed (AGENTS.md rule 3).
  provenance: >-
    The machinery named above is read from THIS REPOSITORY's committed corpus on
    2026-08-30 and is a set of research targets, not verified facts:
    KN-LIT-050 (Regev, on lattices, learning with errors, random linear codes,
    and cryptography), KN-LIT-21383c (Regev 2004, quantum computation and
    lattice problems), KN-LIT-053 / KN-LIT-5355 and KN-LIT-2264 (Ring-LWE and
    its toolkit), KN-LIT-054 (worst-case to average-case reductions for module
    lattices), KN-LIT-4706 (Brakerski-Kirshanova-Stehle-Wen, LWE and
    extrapolated dihedral cosets, recorded as establishing a quantum-polynomial-
    time equivalence between LWE and an extrapolated DCP whose extrapolation
    varies with the noise rate), KN-LIT-1744 (recorded in KN-OPEN-8a5965 as the
    structured extrapolated variant IP-M-EDCP), KN-LIT-2c8264 (Kuperberg 2005,
    subexponential-time quantum algorithm for the dihedral HSP), KN-LIT-6072
    (quantum algorithms for variants of average-case lattice problems via
    filtering), and KN-LIT-6842 (structural lattice reduction, generalized
    worst-case to average-case reductions). The alpha-normalisation ambiguity
    and the concrete-sample-count example in the motivation are taken from
    KN-OPEN-8a5965's own Q2 analysis, which flags both as unresolved there.
    Nothing named here is asserted as verified by this question; each is a
    primary-text target under the constraints above.
  status: active
  owner: coordinator
  created_at: '2026-08-30'
