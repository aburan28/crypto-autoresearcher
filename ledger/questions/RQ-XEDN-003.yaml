research_question:
  id: RQ-XEDN-003
  title: >-
    On non-isotrivial surfaces with a≠0 and deg b=6, does raising deg a from ≤2
    to ≤4 force Mordell-Weil free-x relation coefficients to grow (inf-norm ≥4),
    or do they remain in {1,2,3} at p∈{7,13,19,31}?
  scope:
    curve_families:
      - >-
        non-isotrivial Weierstrass surfaces y^2 = x^3 + a(t)x + b(t) over F_p(t)
        with a≠0, deg a≤4, deg b=6, j non-constant
    field_types: [prime field F_p, rational function field F_p(t)]
    bit_sizes: ["p in {7, 13, 19, 31}"]
    methods:
      - free-x section enumeration (deg x≤2, deg y≤3) under the frozen square predicate
      - group-law verified short-relation extraction
      - polarisation Gram as diagnostic only
  motivation: >-
    GOAL-XEDN-001 / EXP-XEDN-004 found max_|coeff|=1 without μ₃ for deg a≤2.
    RT-XEDN-004 named raising free-x degree or the deg-a window. Raising free-x
    to deg x≤3 on deg-b=6 is empty (deg(x³+ax+b)=9 is odd, hence not a polynomial
    square). The executable cheapest control is therefore the deg-a raise to ≤4,
    with a thickened p=31 eligibility target.
  decision_target: >-
    Whether H-XEDN-004 is supported (bounded coeffs in the raised deg-a window)
    or rejected (growth / inf-norm ≥4), with an explicit claim boundary that does
    not claim B2 or crypto-scale closure.
  constraints:
    - Toy scale only; generated surfaces only; no attack claim.
    - a≠0 and j non-constant on every Gram/trend surface.
    - Coefficient claims rest on group-law-verified relations; Gram diagnostic only.
    - Negative evidence closes only the exact tested scope (AGENTS.md rule 6).
  status: active
  owner: coordinator
