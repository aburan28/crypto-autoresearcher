research_question:
  id: RQ-SEMBIN-9fa4ba
  title: >-
    Worked forward rather than audited: which of the choices Semaev 2015 made and
    did not revisit -- chain length t = m, path chaining topology, low-degree
    subspace V, and the absorbed n^{4 omega} cofactor -- actually carry the
    2^{1.6986 sqrt(n ln n)} exponent, and does re-optimizing any of them move a
    cost that matters?
  scope:
    curve_families:
      - E/F_{2^n}: Y^2 + XY = X^3 + A X^2 + B, so that
          S_3(x_1,x_2,x_3) = (x_1x_2 + x_1x_3 + x_2x_3)^2 + x_1x_2x_3 + B
          (KN-LIT-fa346d Contribution; the form all of Tables 1-2 uses)
      - the same curve family under the odd-characteristic extension the paper
          sketches, F_{p^n} for fixed p in {3, 5} and growing n, where the paper
          states the analogue of Assumption 1 is unverified
    field_types:
      - binary extension fields F_{2^n}, n prime, Weil-descended over F_2
      - F_{p^n} for fixed small odd p, n growing, as the paper's own extension
    bit_sizes:
      - 'stage-0 exact finite checks: n <= 21, where Tables 1-2 give published
        cells to calibrate against'
      - 'topology and subspace comparisons: matched pairs at equal (n, m, k),
        n <= 21, since the comparison is between two systems and not against an
        absolute scale'
      - 'derivation only, no execution: n = 233, 283, 409, 571 for any statement
        about where a re-optimized crossover lands'
    methods:
      - chained S_3 Boolean systems from KN-LIT-fa346d eq. (5), the technique
          abstracted in KN-TECH-b18366, at 2 <= t <= m rather than only t = m
      - joint re-optimization of the two-stage balance (eqs. 15-17) over (m, t)
          instead of over m at t = m fixed
      - alternative binary-tree chaining topologies over the same t factor-base
          points, built from the same S_3 block
      - matched subspace-choice comparisons (low-degree polynomial V versus random
          k-dimensional V, at equal k) with a variable-permutation control
      - degree-bounded Macaulay rank certificates and first-fall-degree derivation;
          open-source Groebner engines only, no MAGMA licence in this program
      - honest cofactor accounting: n^{4 omega} charged rather than absorbed
  motivation: >-
    Reading KN-LIT-fa346d in full (paper frozen at inputs/SEMAEV-2015-310/,
    2026-09-13) turns up four decisions the paper makes, records as choices, and
    then does not revisit -- each of which is a forward research object rather
    than a defect.
    First, Section 3 step 3 states that for t < m "the solving running time ...
    drops dramatically and the probability of solving is relatively lower ... the
    trade off may be positive", and declines it because it "does not affect the
    asymptotical running time estimates". That reason is exactly right about the
    exponent and exactly silent about the crossover n, which is what the FIPS
    claim in Section 4.5.2 turns on. The balance in eqs. (15)-(17) was optimized
    over m with t = m held fixed; optimizing over (m, t) jointly is a different
    optimization, and whether its optimum is interior is unknown
    (KN-OPEN-94f456).
    Second, Table 1's starred rows measure a low-degree polynomial V beating a
    random k-dimensional subspace at equal k -- 11.41 s / 364 MB against
    27.08 s / 378 MB at n = 17, m = t = 3, k = 6 -- attributed to the Groebner
    input being "simpler" and not pursued. A 2.4x factor at equal k is either a
    structural property of the descended system or an artifact of the variable
    ordering the basis induces, and the two are cheaply separable.
    Third, the chaining is a PATH: S_3(u_1,x_1,x_2), then S_3(u_i,u_{i+1},x_{i+2}),
    then S_3(u_{t-2},x_t,R_X). A path is one binary tree over t points. A balanced
    tree is another presentation of the same decomposition from the same S_3
    block, with a different auxiliary-variable count and a different first-fall
    analysis. The paper does not ask which topology minimizes what.
    Fourth, the cofactor. Stage 1 carries n^{4 omega}, which at omega = 3 is
    n^{12}; at n = 571 that is about 2^{109}, larger than the 2^{2n/m} stage-2
    term the balance is struck against. The asymptotic statement is untouched by
    a polynomial factor by construction, and every concrete number in Table 3 is
    not.
    This question is the forward lane. It deliberately does not litigate
    Assumption 1, which RQ-SEMBIN-fa2e3f owns.
  decision_target: >-
    A committed Coordinator decision that, for each of the four choices, either
    (a) records a measured matched-pair comparison with its control, stating
    whether the effect is structural or an ordering/shape artifact, or (b) records
    the exact certificate or derivation that is missing and why it was out of
    reach. For the short-chain trade specifically, the decision states whether the
    joint (m, t) optimum of the paper's own balance is interior or on the t = m
    boundary, as a derivation from the published formulas -- a result that needs
    no execution and settles whether KN-OPEN-94f456 is a live lane. Every
    statement carries the assumption it inherits, named as Semaev's Assumption 1,
    his Assumption 2, or a new numbered heuristic authored here.
  constraints:
    - >-
      A mechanism result that silently inherits Assumption 1 is unfalsifiable.
      Any cost claim resting on a degree bound must name which assumption supplies
      it and carry that assumption as a numbered heuristic with a falsification
      condition. Making the dependence explicit is worth more here than making the
      claim large.
    - >-
      A trade that leaves the exponent alone is still a result, and must be
      reported as what it is. Moving a concrete crossover is not an exponent
      improvement; presenting it as one would violate the target-result profile's
      cost-honesty clause as surely as understating it would waste the finding.
    - >-
      Matched pairs, not absolute scales. The subspace and topology comparisons
      are between two systems at equal (n, m, k) on the same engine and machine;
      this program cannot reproduce the paper's MAGMA timings and does not need
      to in order to compare two of its own.
    - >-
      The subspace effect has a named confound: the low-degree basis induces a
      variable ordering, and a Groebner engine is sensitive to ordering. A
      matched permutation control is required before any structural reading.
    - >-
      Machine reality: roughly 8-16 GB usable, no MAGMA. Every proposal in this
      lane needs a stage-0 exact finite check that fits in seconds; a first check
      costing a Groebner basis at n = 45 is not actionable. A memory or time stop
      is an impediment with a recheck, never negative mathematical evidence
      (AGENTS.md rule 5).
    - >-
      Lemma 2's equivalence is conditional -- on the lower-t systems being
      unsatisfiable, with the y_i in F_{q^2}\F_q case handled by an order-2
      argument. Any variant that changes t, the topology, or the subspace must say
      what happens to that condition, because a relation the algorithm outputs
      when it fails is not a relation.
    - >-
      The odd-characteristic extension rests on Hodges-Petit-Schlather first-fall
      bounds and the paper itself calls the analogue of Assumption 1 unverified
      there. Any p > 2 statement is scoped to the p actually computed, and the
      n-versus-log p bookkeeping in c = 2/(2 ln p)^{1/2} is stated explicitly or
      declared unresolved.
    - >-
      No claim about the security of any deployed curve, in either direction. The
      FIPS binary curves are parameter sets in a cost derivation here.
