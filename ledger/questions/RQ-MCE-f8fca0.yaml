  # ---------------------------------------------------------------------
  # WHY THIS RECORD EXISTS
  # ---------------------------------------------------------------------
  the_defect_being_completed:
    what: >-
      RQ-MCE-3f7c02 quoted arXiv:2304.14757's Goppa-exclusion sentence AND
      STOPPED AT THE FULL STOP. Every affirmative statement it made is verbatim
      correct against the source -- the validator checked all four quotations
      character for character against a byte-identical PDF -- but the sentence
      immediately following, and three further passages, all run the other way.
      The paper does not present the Goppa exclusion as a structural boundary of
      its result. It presents it as a PRESENT-TENSE obstruction to ONE PHASE of
      the attack, explicitly not proved, which the authors conjecture will fall.
    why_it_is_not_a_completeness_quibble: >-
      DEC-20260808-a67816 D-5, three reasons, each checkable. (1) The omission
      runs in ONE DIRECTION on the axis this campaign turns on -- toward
      dismissal of the structural line -- and BATCH-001-OPENING.md section 7
      defines that direction as this campaign's failure condition, "symmetric
      with alarm". (2) One of the four omitted passages was ALREADY IN THIS
      PROGRAM'S OWN COMMITTED RECORDS, in a sibling file of the one the
      correction re-quoted from, so the omission was not caused by any inability
      to read the PDF. (3) RQ-MCE-3f7c02's replacement_constraint is BINDING ON
      EVERY DELIVERABLE OF THIS GOAL, so the defect is not historical -- it
      propagates by design into whatever comes next.
    error_family: >-
      FOURTH occurrence of the family GOAL-MCE-001.known_hazards already records
      three times: a Coordinator statement about what a prior record or source
      says, wrong in ONE direction, caught only by the independent check. This
      time the statement was itself the correction of the third occurrence. The
      lesson recorded is a CHECK, not a caution: read past the end of the
      sentence you are quoting, and make it a gate item. BATCH-73a1b7 carries it
      as GATE-B.

  # ---------------------------------------------------------------------
  # THE SOURCE'S OWN QUALIFICATION, VERBATIM
  # ---------------------------------------------------------------------
  the_sources_own_qualification:
    source: "arXiv:2304.14757, Bardet, Mora, Tillich; journal version IEEE-IT 2024"
    source_version: >-
      arXiv v3. The PDF's own left-margin stamp at the bound sha256 reads
      "arXiv:2304.14757v3 [cs.IT] 29 May 2023", recovered first-hand by
      VAL-20260808-71bdb1 S-1a. This CLOSES a gap that correction_report.md
      section 6 item 4 and KN-LIT-c41d8b's "Not verified here" both declared
      open; those two artifacts are immutable, are NOT edited, and their
      declaration is superseded here for the passages this record carries.
    source_sha256: ebbd94ac3cd00b0f0e723aeab56fd3b0820c89d47072fc8241f12c5f93c564b8
    passage_provenance: >-
      FIRST-HAND BY THE VALIDATOR, RE-QUOTED HERE -- NOT READ BY THIS
      COORDINATOR. All four passages were located and transcribed by validator
      session TASK-20260808-ea7bed (VAL-20260808-71bdb1, section S-1,
      material_omission_found) from arXiv:2304.14757v3 re-fetched at the sha256
      above, which that session reports as byte-identical to the hash bound by
      BATCH-001. The Coordinator writing this record has no fetch and no execute
      capability, did not open the PDF, computed no hash, and ran no command.
      Recorded as a chain of custody rather than as a first-hand read.
    yaml_folding_note: >-
      Each passage below is stored in a FOLDED block scalar. The line breaks are
      YAML formatting and are not in the source; each passage is one continuous
      run of text as printed. Nothing is paraphrased, normalised, re-punctuated
      or corrected.

    passages:

      - id: Q-1
        locus: >-
          PDF page 7, the sentence IMMEDIATELY AFTER the Goppa-exclusion
          sentence that RQ-MCE-3f7c02 quotes, in the same paragraph.
        text: >-
          However this work could open the road for also attacking this subcase,
          in which case we could hope to break the CFS scheme [CFS01] which
          operates precisely in the high rate regime where the square of the
          dual of the Goppa code behaves abnormally.
        what_it_establishes: >-
          The authors treat the Goppa subcase as a target their own work "could
          open the road for also attacking", not as a case their result excludes
          on structural grounds. The paragraph's own run-in heading is "Opening
          the road for attacking the CFS scheme"; RQ-MCE-3f7c02 quotes the
          heading and the preceding sentence and omits the sentence that
          explains why the heading says "opening the road".

      - id: Q-2
        locus: "PDF page 32, concluding remarks."
        text: >-
          Therefore it is tempting to conjecture that Goppa codes, at least in
          the regime where they are distinguishable from random codes (which
          applies in particular to the CFS scheme [CFS01]) should eventually be
          attacked in polynomial by some variation the attack that has been
          given here.
        transcription_note: >-
          TRANSCRIBED AS PRINTED, INCLUDING THE SOURCE'S OWN MISSING "of" in
          "attacked in polynomial by some variation the attack". The omission is
          the source's, not this program's, and it is preserved rather than
          silently repaired -- the same handling BATCH-a68f79's transcription
          convention applies to extraction artifacts. VAL-20260808-71bdb1
          records verifying this passage twice, by poppler text extraction and
          by reading a 150 dpi render of page 32 directly.
        what_it_establishes: >-
          The authors CONJECTURE that Goppa codes should eventually fall to a
          variation of this very attack. The exclusion is the current state of
          their method, not a claimed property of Goppa codes.

      - id: Q-3
        locus: >-
          PDF page 32, concluding remarks, under "Understanding the Gröbner
          basis approach".
        text: >-
          However, unlike the case of the filtration where right now this part
          of the attack does not work at all, it seems that here even if the
          Gröbner basis computation consists of more steps, solving the whole
          system should still be polynomial.
        transcription_note: >-
          Transcribed exactly as printed, including the diacritic in "Gröbner".
          The authoritative transcription is VAL-20260808-71bdb1 S-1
          material_omission_found, third passage.
        what_it_establishes: >-
          THIS IS THE PASSAGE THAT PHASE-SCOPES THE EXCLUSION, and it is the
          single most load-bearing of the four. "Does not work at all" is scoped
          to the FILTRATION phase, and it is scoped in TIME -- "right now". The
          authors expect the Gröbner-basis phase to remain polynomial. The
          exclusion is therefore an obstruction to one step of one attack at one
          moment, not a boundary of the result.

      - id: Q-4
        locus: "PDF page 15, section 3.2, opening. Section 3.2 is headed \"What is wrong with Goppa codes?\""
        text: >-
          The discussion below does not represent a proof that computing a
          filtration is impossible for Goppa codes, but rather an intuition
          about what hampers it.
        also_in_this_programs_own_records: >-
          coordination/goals/GOAL-MCE-001/batches/BATCH-001/tasks/TASK-20260803-292b99/heuristics_enumerated.md
          line 332 transcribes this passage verbatim, and line 348 flags
          Heuristic 23 as explicitly "does not represent a proof". RE-VERIFIED
          IN THE COMMITTED TREE ON 2026-08-09 by the dispatching session, which
          reports the passage present at that line; this Coordinator did not run
          the check itself and attributes it. That file is a SIBLING of the one
          RQ-MCE-3f7c02 re-quoted from, in the same task directory.
        what_it_establishes: >-
          The authors state, before giving the argument, that the argument is
          NOT A PROOF. Any deliverable that presents the exclusion as settled
          has upgraded an intuition the source declines to upgrade.

  # ---------------------------------------------------------------------
  # EXACTLY WHICH CLAUSES OF RQ-MCE-3f7c02 ARE SUPERSEDED
  # ---------------------------------------------------------------------
  superseded_clauses:
    method_note: >-
      Each clause is pinned by field path and by the superseded text quoted
      verbatim from the committed record, which is checkable by string match.
      NO SHA256 IS RECORDED: the role writing this record has no execute
      capability (orchestration/roles.yaml, may_execute_experiments: false) and
      could not compute one. Recorded as a gap rather than left implicit -- the
      same disclosure RQ-MCE-3f7c02 made for the same reason.
    originals_edited: false

    items:

      - clause: C-1
        field: RQ-MCE-3f7c02.replacement_constraint
        superseded_text: >-
          "No deliverable of this goal may state that result's headline without
          the FAMILY EXCLUSION, and no deliverable may present the rate
          threshold as the boundary or as the discriminator between that result
          and Classic McEliece: the family exclusion already settles
          applicability to binary Goppa codes."
        why: >-
          The first half is UPHELD and is carried forward unchanged into
          completed_constraint. The defect is the words "already settles
          applicability to binary Goppa codes", which state as settled what
          Q-3 scopes to one phase and to "right now", what Q-4 declares is not a
          proof, and what Q-2 conjectures will fall. As written the clause binds
          every deliverable of this goal to the dismissal-side reading.
        replaced_by: this record, field completed_constraint

      - clause: C-2
        field: RQ-MCE-3f7c02.corrected_boundary.boundary_is, first item (CONJUNCT 1)
        superseded_text: >-
          "CONJUNCT 1 -- CODE FAMILY, and this is the decisive one for
          GOAL-MCE-001"
        why: >-
          "The decisive one" is a strength claim the source does not make. The
          conjunct is real and correctly identified -- the exclusion IS in the
          paper, in its Table 1 restriction column, and in section 3.2 -- but
          calling it decisive for this goal converts a phase-scoped,
          present-tense, unproved obstruction into a settled discriminator. The
          REST of that bullet, including the paper's stated reason (Goppa codes
          are counterexamples to its Heuristic 18) and the observation that the
          exclusion carves out the subfamily Classic McEliece uses, STANDS.
        replaced_by: this record, field completed_conjunct_1

      - clause: C-3
        field: RQ-MCE-3f7c02.corrected_boundary.what_changed
        superseded_text: >-
          "For any question about the family Classic McEliece uses, conjunct 1
          settles applicability before any rate arithmetic is performed."
        why: >-
          Same defect as C-1, in the gloss that a reader is most likely to
          quote. The first half of what_changed -- "Not 'the rate condition is
          gone' but 'the rate condition is one of three conjuncts and is not the
          discriminator for binary Goppa codes'" -- is UPHELD and is NOT
          superseded.
        replaced_by: this record, field completed_what_changed

      - clause: C-4
        field: RQ-MCE-3f7c02.title, the single word "STRUCTURAL"
        superseded_text: >-
          "the boundary of arXiv:2304.14757 (KN-LIT-4c8135) is STRUCTURAL"
        why: >-
          "STRUCTURAL" asserts that the exclusion is a property of the code
          family that bounds the result. The source's own account is that it is
          a property of the CURRENT STATE OF THE AUTHORS' METHOD at one phase.
          The rest of the title -- "generic/random alternant codes with Goppa
          codes EXPLICITLY EXCLUDED -- and not a rate threshold" -- is UPHELD,
          and the "not a rate threshold" half is the correction D-4 praises and
          preserves.
        replaced_by: >-
          The title of this record. The supportable one-line description is
          "family-scoped in the source's statement of its own applicability,
          with that scoping phase-limited, present-tense and unproved by the
          source's own account" -- NOT "structural".

  # ---------------------------------------------------------------------
  # THE COMPLETED CONSTRAINT -- BINDING ON EVERY DELIVERABLE OF THIS GOAL
  # ---------------------------------------------------------------------
  completed_constraint: >-
    The scoping of arXiv:2304.14757 (KN-LIT-4c8135, superseded by
    KN-LIT-c41d8b) is load-bearing, and it is a CONJUNCTION: generic / random
    alternant codes -- Goppa codes EXPLICITLY EXCLUDED -- over F_2 or F_3, with
    m arbitrary, at high rate per the paper's condition (6). No deliverable of
    this goal may state that result's headline without the FAMILY EXCLUSION,
    and no deliverable may present the rate threshold as the boundary or as the
    discriminator between that result and Classic McEliece.

    AND -- THIS IS THE COMPLETION -- THE EXCLUSION MAY NOT BE INVOKED BARE. Any
    deliverable of GOAL-MCE-001 that cites the Goppa exclusion must ALSO carry
    the source's own qualification of it, on all four points, with at minimum
    Q-2 and Q-4 quoted rather than summarised:
      (i)   PHASE-SCOPED -- it is the FILTRATION step that fails; the authors
            expect the Gröbner-basis step to remain polynomial (Q-3);
      (ii)  PRESENT-TENSE -- "right now this part of the attack does not work
            at all" (Q-3);
      (iii) EXPLICITLY NOT A PROOF -- "does not represent a proof that computing
            a filtration is impossible for Goppa codes, but rather an intuition
            about what hampers it" (Q-4);
      (iv)  CONJECTURED TO FALL -- Goppa codes "should eventually be attacked in
            polynomial by some variation the attack that has been given here"
            (Q-2), and the authors describe their work as possibly "opening the
            road" to attacking that subcase (Q-1).
    A deliverable that cites the exclusion without all four is DEFECTIVE under
    this record and under DEC-20260808-a67816 D-5.

    Condition (6) is extraction-damaged and untranscribed; any deliverable
    needing it must transcribe it from the PDF at sha256
    ebbd94ac3cd00b0f0e723aeab56fd3b0820c89d47072fc8241f12c5f93c564b8 and may not
    reconstruct it. Unchanged from RQ-MCE-3f7c02 and not superseded.

  completed_conjunct_1: >-
    CONJUNCT 1 -- CODE FAMILY. Generic / random alternant codes, with Goppa
    codes EXPLICITLY EXCLUDED. The paper's stated reason is that Goppa codes are
    counterexamples to its Heuristic 18, and section 3.2 is headed "What is
    wrong with Goppa codes?". The exclusion carves out exactly the subfamily
    Classic McEliece uses, which is why it matters to this goal. IT IS NOT
    CALLED "THE DECISIVE ONE": by the source's own account the exclusion is
    phase-scoped to the filtration, holds "right now", is explicitly not a
    proof, and is conjectured to fall. What conjunct 1 decides is that THIS
    PAPER'S ATTACK, AS IT STANDS, IS NOT CLAIMED AGAINST BINARY GOPPA CODES.
    What it does not decide is whether binary Goppa codes resist the method.

  completed_what_changed: >-
    Not "the rate condition is gone" but "the rate condition is one of three
    conjuncts and is not the discriminator for binary Goppa codes" -- UPHELD
    from RQ-MCE-3f7c02 and unchanged. AND: the family conjunct does not settle
    the underlying question either. It settles what THIS PAPER CLAIMS. The
    source's own concluding remarks conjecture the opposite of settlement, so a
    deliverable that reads conjunct 1 as closing the question about binary Goppa
    codes has drawn a conclusion the source declines to draw.

  what_this_does_not_establish:
    - >-
      NOT A SECURITY STATEMENT ABOUT CLASSIC McELIECE IN EITHER DIRECTION, and
      this cuts BOTH WAYS. "Our attack does not work at all" is these authors'
      statement about THEIR attack, not a theorem that Goppa codes resist
      algebraic attacks. Equally, "it is tempting to conjecture that Goppa codes
      ... should eventually be attacked in polynomial" is A CONJECTURE IN A
      CONCLUDING REMARK, not a result, not a complexity claim, and not evidence
      that Classic McEliece is threatened. Reading Q-2 as a threat is the
      ALARM-SIDE error, exactly symmetric with the dismissal-side error this
      record corrects, and BATCH-001-OPENING.md section 7 defines both as this
      campaign's failure condition.
    - >-
      NOTHING ABOUT KN-LIT-7c4620 / iacr:2026/1232, whose abstract states binary
      Goppa codes explicitly and whose BODY WAS NOT OBTAINED (403, path-scoped,
      reproducible, not circumvented; AGENTS.md rule 5 makes it a recorded
      outcome and never negative evidence). Neither the exclusion nor its
      qualification transfers to that paper.
    - >-
      NOTHING ABOUT THE CFS SCHEME. Q-1 and Q-2 both name CFS [CFS01] as the
      high-rate target the authors hope to reach. This program has read nothing
      about CFS, holds no CFS parameters, and asserts nothing about it. It is
      recorded only because it is inside the quoted text.
    - >-
      NO CLAIM TIER ABOVE TOY, no hypothesis status change, no goal criterion
      met or approached, and no distance computed between any attack regime and
      Classic McEliece's parameters.
    - >-
      NOTHING ABOUT THE IEEE JOURNAL VERSION. Every passage here is from arXiv
      v3. KN-LIT-c41d8b's frontmatter carries the journal version (2024, IEEE
      Trans. IT, doi 10.1109/tit.2023.3334592) while every quotation is from v3
      (VAL-20260808-71bdb1 S-1c). Nobody in this program has read the journal
      version and a journal version may differ. Recorded as a provenance seam.

