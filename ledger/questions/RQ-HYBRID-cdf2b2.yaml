research_question:
  id: RQ-HYBRID-cdf2b2
  title: >-
    Hybrid KEM combiners now carry most new TLS key exchange, and their binding
    properties are exactly the ones ML-KEM does not provide on its own — which
    binding properties does each deployed combiner actually have, with a
    certificate for each failure?
  scope:
    scheme: "X25519MLKEM768 and related TLS hybrid groups, X-Wing, and generic KEM combiners; ML-KEM alone as the component under study"
    family: "KEM combiners; binding properties (X-BIND-P-Q taxonomy) and IND-CCA composition"
    standardization_status: >-
      RECALLED, UNVERIFIED: hybrid post-quantum key exchange is deployed by
      default in major browsers and TLS stacks and is the subject of active
      IETF drafts; X-Wing is a specific proposed combiner with its own security
      argument. ML-KEM is FIPS 203.
    targets:
      - >-
        THE BINDING TABLE, WHICH IS THE PRIMARY DELIVERABLE: rows are binding
        properties in the published taxonomy (binding the shared secret to the
        ciphertext, to the public key, to both, under honest versus malicious
        key generation), columns are the deployed and proposed combiners, and
        each cell is either a derivation from the combiner's own key-derivation
        input list or a LITERAL CERTIFICATE of failure — two distinct
        (key, ciphertext) pairs yielding the same shared secret.
      - >-
        THE COMPONENT BEHAVIOUR: ML-KEM's own binding behaviour under
        adversarially generated keys, established here with certificates, since
        every combiner's table depends on what its component does and this is
        the cheapest measurable input.
      - >-
        THE INPUT-LIST SENSITIVITY: each combiner hashes some subset of
        (traditional shared secret, PQ shared secret, PQ ciphertext, PQ public
        key, traditional public keys, label). Enumerate the subsets, and for
        each, which binding properties survive. This is a small finite lattice
        and the deployed choices are points in it.
      - >-
        THE PROTOCOL-LEVEL RESCUE ARGUMENT: TLS binds the transcript
        separately, which is often cited as making combiner-level binding moot.
        State that argument precisely and identify what it requires, so the set
        of protocols for which it does NOT apply is explicit rather than
        implied.
    methods:
      - Implementation of each named combiner from its specification, validated against published test vectors before use.
      - Certificate construction using ML-KEM's known behaviours under adversarial key generation, re-verified by an independent implementation.
      - Exhaustive enumeration over the finite lattice of key-derivation input subsets, with the binding consequences derived and, where a failure is claimed, witnessed.
    claim_tier_ceiling: >-
      BINDING-PROPERTY AND CERTIFICATE CLAIMS ONLY. A binding failure is not a
      confidentiality break and no record may present it as one. Nothing here is
      a statement about any deployed TLS implementation, browser, or service; the
      analysis is of specification-level combiners implemented by this program.
      All key material is self-generated.
  motivation: >-
    Hybrid key exchange went from proposal to default in a very short time, and
    the combiners' binding properties are precisely the class of property that
    composition arguments elsewhere in a protocol are assumed to cover. The
    taxonomy exists, the component's behaviour is known, the combiners are
    short, and the certificates are cheap — a few hundred bytes verified
    instantly. What does not exist in one place is the filled table, and the
    finite lattice of key-derivation input choices makes it completable rather
    than open-ended. This is also directly adjacent to this program's ML-KEM
    lane without duplicating it: no lattice, no cost model, no core-SVP.
  decision_target: >-
    Which binding properties each named combiner has, which it lacks with a
    certificate, and what the protocol-level transcript-binding argument
    requires in order to substitute for them.
  provenance: >-
    RECALLED FROM MODEL MEMORY ON 2026-08-09. NOT WEB-SEARCHED, NOT PRIMARY-READ,
    NOT FILED AS KN-LIT. Research targets: FIPS 203, the IETF hybrid design
    drafts for TLS (RECALLED as specifying X25519MLKEM768 and its key schedule),
    the X-Wing combiner and its security argument (RECALLED), Cremers et al. and
    the X-BIND/MAL-BIND binding taxonomy for KEMs (RECALLED), and Schmieg's
    analysis of ML-KEM binding behaviour (RECALLED). Every property name and
    attribution is UNVERIFIED.
  constraints:
    - No binding claim is recorded before FIPS 203, the relevant hybrid draft, and one primary binding-taxonomy reference are filed as KN-LIT entries; the taxonomy's exact definitions decide every cell in the table.
    - Every combiner implementation passes its specification's test vectors before any certificate is minted against it.
    - Every certificate is re-verified by a second independent implementation.
    - No third-party TLS implementation, browser, service or capture is tested, probed or named. All keys are self-generated.
    - A binding failure is never written as a confidentiality or authentication break, and where the protocol-level transcript argument applies, the record states so in the same place as the certificate.
  status: active
  owner: coordinator
  created_at: '2026-08-09'
