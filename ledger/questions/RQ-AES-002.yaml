research_question:
  id: RQ-AES-002
  title: >-
    Does any named tracked object admit a single-key key recovery or
    distinguisher on FULL-ROUND AES-128/192/256 (10/12/14 rounds) whose
    end-to-end cost, charged under a frozen cost model in AES-equivalent
    evaluations, is materially below the DEFINITIONAL exhaustive-key-search
    reference for that key size — or, failing that, a scoped barrier statement
    naming why a specific full-round object class cannot?

  # =====================================================================
  # RELATIONSHIP TO RQ-AES-001. STATED FIRST BECAUSE IT IS THE REASON THIS
  # RECORD EXISTS RATHER THAN AN EDIT TO THAT ONE.
  # =====================================================================
  relationship_to_RQ_AES_001: >-
    RQ-AES-001's claim_tier_ceiling reads "Toy tier only, and reduced-round
    only... no result from this question may be reported as a claim about
    full-round AES", and its scope block lists full-round AES-128/192/256
    (10/12/14 rounds) under round_counts_out_of_scope. THAT CEILING IS CORRECT,
    IS UNCHANGED, AND IS NOT CONTRADICTED, RELAXED, REINTERPRETED OR
    SUPERSEDED BY THIS RECORD. A full-round directive cannot be executed by
    widening RQ-AES-001, because widening it would retroactively lift a ceiling
    under which four batches of evidence (EV-AES-001..004) and two knowledge
    entries (KN-FIND-028, KN-FIND-029) were produced and reviewed. It is
    executed by opening a SEPARATE question with its own ceiling, which is what
    this is.
    CONSEQUENCES, ALL BINDING:
    (i) GOAL-AES-001 is NOT paused, closed, superseded, re-scoped, re-budgeted
    or reprioritized by this record, and its single next action stands.
    (ii) NO record produced under RQ-AES-001 may be transcribed here as a
    full-round statement. EV-AES-001..004 each state in their own boundaries
    that they assert no claim about AES at any round count; that stands and is
    not upgraded by being cited from a full-round question.
    (iii) Prior derivations about AES component algebra MAY be cited here as
    INPUTS, each carrying its original scope verbatim. In particular:
    Proposition 806-1 may be cited ONLY at ONE super-box interface, for the
    F-linear round-independent subclass, NEVER as a cost inequality, and never
    with its unnumbered state-quantifier dependence U-809-1 dropped;
    PROP-701-I and Proposition 801-1 are WITHHELD and may NOT be cited as
    established; KN-FIND-028's two facts are argument-unavailability results
    and supply no argument; KN-FIND-029's five false-green escapes bind any
    instrument built under this question.
    (iv) Reduced-round runs under THIS question are admissible ONLY as
    validation-ladder instruments for a full-round mechanism
    (docs/inventor-protocol.md section 6 step 2). They carry `toy` tier, they
    never license a full-round claim, and where such a run yields a result
    ABOUT reduced-round AES it is recorded under RQ-AES-001's ceiling and is
    not asserted here.

  scope:
    primitive: "AES (Rijndael, 128-bit block), FULL ROUND"
    specification: >-
      FIPS-197. The specification is NOT at research risk and is NOT cited from
      a read document: it is pinned OPERATIONALLY by locally reproducible
      known-answer vectors under two independent implementations (pycryptodome
      and the openssl CLI), which is the only grounding this environment
      supports. The GOAL-AES-001 harness admitted by DEC-20260731-011 is the
      standing instrument; its declared defect set (H-2, H-4, ER-5, ER-7, ER-8,
      V-804-4, V-804-5 and the KN-FIND-029 escape classes) travels with it and
      is NOT reset by being reused under a new question.
    key_sizes: [128, 192, 256]
    round_counts_in_scope: [10, 12, 14]
    round_counts_in_scope_note: >-
      Full round counts ONLY, per key size: AES-128 = 10, AES-192 = 12,
      AES-256 = 14, including the standard final round without MixColumns. A
      result at any smaller round count is a RQ-AES-001 object and does not
      answer this question.
    threat_models:
      in_scope_and_completing:
        - >-
          SINGLE-KEY. Attacker holds known or chosen plaintext/ciphertext pairs
          under ONE unknown fixed key. This is the ONLY model in which a result
          can satisfy this question's completion criterion.
      in_scope_but_never_completing:
        - >-
          RELATED-KEY. Admissible as an object of study ONLY. Related-key
          results on AES-192/256 are RECALLED to exist and are UNVERIFIED here.
          A related-key result is NOT a break of single-key AES, and any record
          stating one must name the weaker threat model IN THE SAME SENTENCE as
          the result, not in a footnote, an appendix, or a later paragraph.
        - >-
          KNOWN-KEY and CHOSEN-KEY / open-key distinguishers. Same rule: the
          model is stated in the same sentence, and such a result NEVER
          satisfies the single-key completion criterion.
      out_of_scope_entirely:
        - >-
          SIDE-CHANNEL, FAULT, and IMPLEMENTATION attacks (cache timing, power,
          DFA, cold boot, key-schedule fault injection). These can trivially
          "beat exhaustive search" while saying nothing about the cipher, so
          admitting them would make the decision target meaningless. They are a
          category error against this directive and are declared out of scope.
        - >-
          QUANTUM attacks (Grover, offline-Simon). No quantum resource is
          available here and the definitional reference below is the CLASSICAL
          one. A quantum claim is a different question with a different
          reference and must not be smuggled in as a margin against 2^k.
        - >-
          Attacks on AES-derived constructions (GCM, AES-CTR nonce misuse,
          hash-function-mode collisions) rather than on the block cipher.
    objects: >-
      DELIBERATELY NOT ENUMERATED IN THIS RECORD, and that is a ruling, not an
      omission. docs/inventor-protocol.md section 1 requires object-first
      generation with the established families NAMED AND DECLARED OFF-LIMITS as
      the primary lens, and it also records (KN-OPEN-019 for ECDLP) that
      writing the object enumeration is itself research work. Pre-populating a
      candidate list here would (a) do the Idea Generator's job inline, which
      the Coordinator contract forbids, and (b) bias the search toward the
      families this Coordinator happens to recall. The enumeration is a
      DELIVERABLE of this question's first batch, not a premise of it.
    objects_declared_off_limits_as_the_primary_lens:
      - >-
        The established single-key families, named so that a candidate arriving
        in new notation is recognised as a variant: differential and truncated
        differential; linear and multidimensional linear; integral / square /
        division property; impossible differential; meet-in-the-middle and
        Demirci-Selcuk; boomerang and retracing boomerang; biclique; algebraic
        (XSL-family) and Gröbner-basis; yoyo; mixture differential /
        exchange-attack; subspace trail; partial sums as a cost reorganisation.
      - >-
        A candidate that is a renamed variant of any of these is recorded as a
        REDISCOVERY, not as a candidate. This list is RECALLED FROM MEMORY, is
        UNVERIFIED under this network policy, and is therefore a screening aid
        and never an authority: a candidate is not established as novel by
        failing to match it.
    methods:
      - >-
        Object-first generation (docs/inventor-protocol.md section 1) with
        mandatory deduplication against the families above.
      - >-
        The lossy-projection test (section 2) applied BEFORE any compute: a
        projection that discards nothing is a change of coordinates, not a new
        object. This is the highest-value activity available in this
        environment because it costs no compute at all.
      - >-
        Structural / algebraic derivation and exhaustive enumeration in
        GF(2^8), GF(2^4) and GF(2^2) analogues, within the resource envelope
        below.
      - >-
        Null-object controls before belief (section 3), including the
        round-count decay check: a statistic that does not decay as round count
        rises toward the full count is the canonical artifact tell.
      - >-
        The validation ladder (section 6): isolate each assumption the cost
        analysis rests on and measure it separately; run the whole pipeline on
        a scaled-down instance and measure the predicted ratio against a
        re-implemented baseline; run the real object with each cheat named and
        classified.
      - >-
        Matched-reference accounting under the frozen cost model CM-1 defined
        in claim_tier_ceiling below, with data, time, memory, precomputation,
        success probability and verification charged end to end.

    # =================================================================
    # THE CENTRAL RULING OF THIS RECORD.
    # =================================================================
    claim_tier_ceiling: |
      THE RULING IN ONE SENTENCE. This question's reference is EXHAUSTIVE KEY
      SEARCH, which is DEFINITIONAL and adjudicable here; NO record under this
      question may assert any relation whatsoever — better, worse, or equal —
      between a result of this campaign and the PUBLISHED STATE OF THE ART,
      because no primary source is reachable in this environment and every
      recalled figure is unverified-from-memory.

      R1. THE DEFINITIONAL REFERENCE, AND WHY IT IS ADJUDICABLE WITHOUT
      LITERATURE. The cost of exhaustive key search follows from the key length
      and the definition of the cipher, not from any paper: for a k-bit key
      under the single-key model with enough known plaintext/ciphertext pairs
      to make the key unique, the search costs 2^(k-1) full AES-k evaluations
      in expectation and 2^k in the worst case, with negligible memory and
      about two known pairs of data, and succeeds with probability 1. Nothing
      in that sentence requires reading a document. It is therefore a reference
      this campaign CAN compare against, and it is the ONLY quantitative
      reference this campaign may compare against.

      R2. THE COMPARISON IS ADJUDICABLE ONLY UNDER A FROZEN COST MODEL, AND
      THE MODEL IS PART OF THE RULING. "Faster than brute force" is
      unadjudicable as loosely as it is usually stated, because the two sides
      can be charged in different units. Cost model CM-1 must be authored,
      independently reviewed and COMMITTED AS A FROZEN ARTIFACT BEFORE any
      measurement or cost claim under this question, and must fix all six of:
        (a) UNIT — one full AES-k encryption of one block (10/12/14 rounds,
            key schedule amortised or charged, stated which) on the pinned
            FIPS-197-verified implementation. Attack work charged in S-box
            lookups, table accesses, XORs or "operations" is converted into
            this unit by a stated conversion, or the comparison is void.
        (b) SUCCESS CONVENTION — average-case (2^(k-1)) or worst-case (2^k),
            declared once and applied to BOTH sides. Mixing conventions
            manufactures a factor of 2, which is inside the margin any
            plausible result here would have.
        (c) SUCCESS PROBABILITY — an attack succeeding with probability p is
            charged at cost/p, and p is measured or derived, never assumed.
        (d) DATA — charged in queries and in their kind (known / chosen
            plaintext / chosen ciphertext / adaptive). The reference needs
            about two known pairs; an attack needing 2^60 chosen plaintexts is
            not "faster" on a single scalar and must be compared on the full
            Pareto frontier of time, memory, data and success probability.
        (e) MEMORY — stated always, beside time, per
            docs/claims-and-verification.md. A time-only comparison is
            incomplete and is rejected.
        (f) PRECOMPUTATION AND VERIFICATION — charged end to end, including
            the cost of confirming a candidate key.
      A margin stated without CM-1 committed is not evidence; it is an
      unadjudicated number.

      R3. THE PUBLISHED STATE OF THE ART IS UNADJUDICABLE HERE, AND THE
      PROHIBITION IS SYMMETRIC. csrc.nist.gov, eprint.iacr.org and arxiv.org
      are unreachable under this harness's network policy; WebSearch returns
      secondary reporting only; and DEC-20260731-011 STRUCK every
      recalled-baseline comparison in this program for exactly this reason.
      This Coordinator recalls the best published single-key attacks on full
      AES as biclique key recovery at roughly 2^126.1 / 2^189.7 / 2^254.4 for
      AES-128/192/256, about a factor of 4 below exhaustive search. THAT
      RECOLLECTION IS UNVERIFIED, MAY BE WRONG IN EITHER DIRECTION, AND IS
      RECORDED HERE ONLY SO THAT ITS STATUS IS EXPLICIT. It may not be cited as
      authority, may not appear in any comparison, and may not be used to size,
      screen, rank or dismiss a candidate.
      THE PROHIBITION RUNS BOTH WAYS, AND THIS IS THE HALF MOST LIKELY TO BE
      FORGOTTEN. Just as no record may say "this beats the state of the art",
      no record may say "this falls short of the state of the art", "this is
      only a rediscovery of the known biclique margin", or "this is not
      interesting because the published attacks are already better". Using an
      unverified recollection to DISMISS a result is the same fabrication as
      using it to PROMOTE one, and it is additionally the premature-closure
      failure mode CLAUDE.md names as symmetric with overclaiming.

      R4. THE GENUINELY UNDETERMINED REGION IS NAMED AS UNDETERMINED. A result
      that beat exhaustive search under CM-1 but by a margin comparable to the
      recalled biclique margin would have STATUS UNDETERMINED IN THIS
      ENVIRONMENT: whether it is a major result or a rediscovery cannot be
      decided here, and the honest record says exactly that rather than
      guessing. `inconclusive` is the correct verdict for the SOTA question and
      is compatible with a fully determined verdict on the definitional
      question. The two verdicts are recorded separately and never merged.

      R5. THE ANTI-LAUNDERING CLAUSE. Any record, in any location, that states
      a margin MUST in the SAME SENTENCE (i) name the reference as exhaustive
      key search at the stated key size under CM-1, and (ii) declare the
      published-state-of-the-art comparison UNADJUDICABLE in this environment.
      Transcribing a definitional-reference margin as a state-of-the-art margin
      — in a headline, an evidence record, a decision, a synthesis, a status
      line, a cross-reference, a knowledge entry, a PR title or a commit
      message — is a CLAIM-TIER VIOLATION and is handled exactly as
      docs/claims-and-verification.md handles dropping a conditional qualifier:
      as an assertion above what the record supports.
      OPERATIONALLY, under docs/inventor-protocol.md section 5: every ideation
      and closure deliverable under this question sets
      `dominated_by: "unresolvable in this environment: no primary source
      reachable; every recalled frontier row is unverified-from-memory"` and
      NEVER `null`, because `null` asserts the frontier was checked row by row
      and it cannot be. `sota_delta` records the DEFINITIONAL-REFERENCE delta,
      explicitly labelled as such, plus the word `unadjudicable` for the
      published frontier.

      R6. WHAT WOULD MAKE THE STRONGER COMPARISON ADJUDICABLE. Named
      concretely, so that this ruling can be lifted by evidence rather than by
      argument. Any ONE of:
        (i) A PRIMARY SOURCE BECOMES READABLE AND IS FROZEN INTO THE
            REPOSITORY — network policy changes to permit eprint.iacr.org /
            csrc.nist.gov / an IACR-hosted PDF, the document is read, hashed
            and archived under `inputs/<ID>/paper_fulltext.md` exactly as
            `inputs/P13-WESOLOWSKI-2026/` is, with its provenance recorded.
        (ii) THE PRIMARY TEXT IS SUPPLIED INTO THE REPOSITORY by the user or
            the dispatching session as a frozen input with recorded
            provenance. This is the practically reachable route here: a
            human-supplied document is a source in a way a model recollection
            is not.
        (iii) THE BASELINE IS RE-DERIVED FROM FIRST PRINCIPLES INSIDE THIS
            REPOSITORY — the baseline attack specified, implemented, and cost
            counted under CM-1, independently reviewed. NOTE THE LIMIT: this
            establishes a baseline THIS CAMPAIGN BUILT, not the published one,
            and any comparison against it says so.
      WHAT DOES NOT SUFFICE, NAMED SO IT IS NOT ATTEMPTED: WebSearch secondary
      reporting; an encyclopedia summary; a second agent recalling the same
      figure (under inference-amendment 0137a051 cross-model independence is
      unavailable campaign-wide, so two agreeing recollections are ONE draw
      from a correlated pair, not two); or this Coordinator's own recollection
      restated with more confidence.

      R7. TIER CEILING PROPER.
        - DEFAULT TIER IS `toy` for every evidence record under this question.
          Structural computation in GF(2^4)/GF(2^2) analogues, reduced-round
          measurement, and enumeration within the resource envelope are `toy`
          regardless of the full-round ambition of the mechanism they serve
          (AGENTS.md rule 7).
        - `crypto` TIER IS ADMISSIBLE THROUGH EXACTLY ONE GATE: a claimed
          full-round single-key KEY RECOVERY carrying a certificate that an
          independent wrapper re-verifies — the recovered key reproduces the
          exact target ciphertexts under BOTH pycryptodome and the openssl CLI,
          re-computed by the wrapper and not by the attack code. This gate is
          open in this environment even though the search is not, because
          checking a key costs one AES encryption while finding one does not.
          A failed certificate invalidates the run as `invalid_measurement`,
          never as a negative observation.
        - A COST CLAIM MAY NEVER EXCEED `analyzed` IN THIS ENVIRONMENT. A
          certificate proves that a claimed solve is real on the instance
          solved; it does NOT validate the cost model that predicts the
          attack's cost at scale, and this environment cannot execute at the
          scale where a full-round cost claim would be tested. Consequently any
          asymptotic or concrete cost claim under this question is heuristic
          and conditional, is subject to the four promotion gates in
          agents/coordinator.md, and reaches `analyzed` at best.
        - NO UNIVERSAL IMPOSSIBILITY CLAIM. No record may assert that full-round
          AES cannot be broken, or that a class of attacks cannot exist, from
          bounded search here. A closure is scoped to the named object class
          with a named obstruction (docs/inventor-protocol.md section 4); an
          exhausted candidate pool is a FATIGUE REPORT whose honest status is
          `unverified`.
        - A DISTINGUISHER CLAIM requires its MEASURED false-positive rate
          against a matched random-permutation control at the same data
          complexity, plus the round-count decay check.

  motivation: >-
    THE PRIOR IS OVERWHELMINGLY AGAINST, AND IT IS STATED HERE RATHER THAN
    DISCOVERED LATER AS A DISAPPOINTMENT. Full-round AES has resisted more than
    two decades of concentrated global cryptanalysis by the strongest
    specialists in the field, with resources incomparably larger than this
    harness has, and the best published single-key results are — on an
    UNVERIFIED recollection that may not be cited as authority — marginal
    constant-factor improvements, not exponent movers. Nothing about this
    environment makes it a better place to find such an attack than the venues
    that have failed to for twenty-five years: it has four cores, no GPU, no
    MILP or SAT solver, no numpy, and no reachable literature. The honest
    expectation is that this campaign produces NO break, and the honest
    expected deliverable is not the break at all but (a) an object-first
    enumeration of full-round-relevant tracked objects with the lossy-projection
    test applied to each, and (b) at most one or two scoped barrier statements
    at the closure standard of docs/inventor-protocol.md section 4. That is
    what the completion criteria are written against.
    THE QUESTION IS NEVERTHELESS OPENED, NOT DECLINED, AND THE GROUND IS
    SPECIFIC. CLAUDE.md and docs/inventor-protocol.md treat PREMATURE CLOSURE —
    declining to search because a target looks saturated — as a failure mode
    SYMMETRIC WITH OVERCLAIMING, and the historical incident that motivated the
    inventor protocol (KN-LIT-7594) is precisely a model declining AES
    cryptanalysis on the grounds that it is "the most-studied block cipher in
    existence", immediately before the same model, differently prompted,
    improved a best-known attack. "This space is mined" is a hypothesis about
    the search, not a finding about the problem, and under section 4 a refusal
    to look has the same evidential status as a fatigue report: `unverified`.
    THE TWO FACTS ARE HELD TOGETHER PROCEDURALLY, NOT RHETORICALLY, by the
    discipline this program already has and which RQ-AES-001 exercised four
    times: object-first generation with the known families declared off-limits
    as the primary lens; the lossy-projection test before any compute is spent;
    null-object controls before belief; matched-reference accounting under a
    frozen cost model; certificates on every claimed solve; and a claim-tier
    ceiling built so that this campaign is STRUCTURALLY INCAPABLE of producing
    an overclaim about deployed AES even in the event that it succeeds — most
    importantly, incapable of converting "beats the definitional reference" into
    "beats the published state of the art", which in this environment is not a
    checkable statement in either direction.
    A THIRD MOTIVATION, RECORDED BECAUSE IT IS THE ONE THAT MAKES THE QUESTION
    EXECUTABLE AT ALL: AES key recovery, like ECDLP, is in NP. Finding a key is
    believed hard; CHECKING one costs a single AES encryption. So the single
    positive outcome this question could produce is CHEAPLY AND INDEPENDENTLY
    VERIFIABLE AT FULL CRYPTOGRAPHIC SCALE even in an environment that cannot
    perform any search at that scale. That asymmetry is the strongest
    epistemic asset available here and the certificate discipline below is
    built on it.

  decision_target: >-
    Whether any named full-round tracked object under this question yields
    EITHER (a) a certified single-key key recovery on full-round
    AES-128/192/256 whose end-to-end cost under the frozen model CM-1 is
    materially below the DEFINITIONAL exhaustive-key-search reference at that
    key size, OR (b) a conditional full-round construction whose numbered
    heuristics and concrete-cost table meet the promotion-gate artifacts and
    which therefore reaches `analyzed`, OR (c) a scoped barrier statement, with
    an archived checkable derivation, naming why a specific full-round object
    class cannot yield the sought improvement and naming what remains open.
    THE DECISION TARGET IS DELIBERATELY NOT "beats the published state of the
    art", because that question is not adjudicable in this environment; see
    claim_tier_ceiling R3, R4 and R6.

  provenance: >-
    NO PRIMARY SOURCE WAS READ FOR THIS RECORD, and none can be. csrc.nist.gov,
    eprint.iacr.org and arxiv.org are unreachable under this harness's network
    policy (proxy CONNECT 403 / no route), WebFetch of primary cryptographic
    sources fails, and WebSearch returns secondary reporting only — a finding
    established four times over across RQ-AES-001's four batches and enacted
    program-wide in DEC-20260731-011, which STRUCK every recalled-baseline
    comparison. Consequently: (a) FIPS-197 is not cited from a read document
    but pinned operationally by locally reproducible known-answer vectors under
    two independent implementations; (b) the biclique figures in
    claim_tier_ceiling R3, the family list in
    objects_declared_off_limits_as_the_primary_lens, and the existence of
    related-key results on AES-192/256 are ALL RECALLED FROM MEMORY and ALL
    UNVERIFIED — recorded so their status is explicit, never usable as
    citations; and (c) NOVELTY AGAINST THE EXTERNAL LITERATURE IS UNRESOLVABLE
    IN THIS ENVIRONMENT, so no record under this question may claim novelty,
    and equally none may claim non-novelty. This record contains no claim that
    any source was read.

  constraints:
    - >-
      COST MODEL CM-1 IS A HARD PRE-DISPATCH GATE. No cryptanalytic measurement
      and no cost claim may be dispatched under this question until CM-1 exists
      as a committed, independently reviewed artifact fixing all six elements
      (a)-(f) of claim_tier_ceiling R2. A margin computed before CM-1 is frozen
      is not evidence.
    - >-
      SPECIFICATION PINNING IS A HARD GATE, inherited from RQ-AES-001: no
      cryptanalytic work is dispatched without a locally verified AES
      ground-truth harness whose FULL-ROUND outputs agree with FIPS-197
      known-answer vectors under BOTH pycryptodome and the openssl CLI, with a
      machine-readable receipt. The GOAL-AES-001 harness satisfies this and is
      reused WITH its declared defect set attached, not reset.
    - >-
      NAMED INFRASTRUCTURE BLOCKER BLK-1, WHICH MUST BE RESOLVED BEFORE ANY
      CARD THAT COULD PRODUCE A SOLVE IS DISPATCHED. The certificate vocabulary
      in docs/claims-and-verification.md admits only
      `discrete_log | decomposition | none`, and `check_run` in
      tools/validate_ledger.py errors on any other value, so an AES
      KEY-RECOVERY certificate CANNOT CURRENTLY BE EMITTED by a conforming run
      record. Extending the vocabulary with a `key_recovery` kind (statement:
      key size, round count, the exact plaintext/ciphertext pairs, the
      recovered key; verifier: independent-recompute under two implementations)
      requires a versioned protocol amendment under GOAL-AES-002 BEFORE any
      such run. This is an infrastructure blocker, never a negative
      mathematical result (AGENTS.md rule 5).
    - >-
      EVERY LITERATURE FIGURE IS UNVERIFIED-FROM-MEMORY and may be named as
      context but never cited as authority, never used in a comparison, and
      never used to rank, screen, promote or DISMISS a candidate. Citing a
      recalled number as if read is a fabrication under AGENTS.md rule 9.
    - >-
      NOVELTY SCREENING PRECEDES COMPUTE. Every candidate is deduplicated
      against the named families and must pass the lossy-projection test before
      any experiment is approved. A renamed variant is recorded as a
      rediscovery. The screen is a SCREENING AID built on unverified
      recollection: passing it does not establish novelty.
    - >-
      NULL-OBJECT CONTROLS BEFORE BELIEF, with the round-count decay check made
      explicit for a full-round question: any claimed statistic is measured
      identically against a matched random permutation AND across increasing
      round counts up to the full count. A quantity that fails to decay as
      rounds increase is the canonical artifact tell, not a finding.
    - >-
      CERTIFICATE DISCIPLINE. A claimed key recovery carries a certificate in
      which the recovered key reproduces the exact target ciphertexts under an
      AES implementation independent of the attack code, re-verified by the run
      wrapper under BOTH pycryptodome and the openssl CLI. A claimed
      distinguisher carries its MEASURED false-positive rate against a matched
      random-permutation control at the same data complexity. See
      docs/claims-and-verification.md and BLK-1 above.
    - >-
      REDUCED-SCALE VALIDATION BEFORE ANY FULL-SCALE CLAIM
      (docs/inventor-protocol.md section 6): each assumption of the cost
      analysis measured separately at a scale where measurement is possible;
      the whole pipeline run on the smallest scaled-down instance whose
      baseline parameter space is fully enumerable, with the predicted
      improvement appearing as a MEASURED RATIO against a re-implemented
      baseline rather than as an extrapolation; every cheat named individually
      and classified as completeness-preserving or soundness-losing.
    - >-
      THREAT-MODEL SENTENCE RULE. Any related-key, known-key or chosen-key
      result names its weaker threat model in the SAME SENTENCE as the result,
      everywhere the result appears, and never satisfies the single-key
      decision target.
    - >-
      LOCAL RESOURCE ENVELOPE, AND ITS ONE KNOWN INTERNAL CONTRADICTION.
      Declared: python3 with pycryptodome, 4 CPU cores, 15 GB RAM, no GPU, no
      MILP or SAT solver, no numpy, no sage, the openssl CLI. RQ-AES-001's
      constraints record gcc 13.3.0 with -maes as available; GOAL-AES-001's
      current next_action records that a GF(2^8) census leg is blocked because
      "its GF(2^8) legs need numpy or a small C program and NEITHER IS
      INSTALLED". THESE TWO COMMITTED RECORDS DISAGREE ABOUT THE C TOOLCHAIN
      AND THIS COORDINATOR DOES NOT RESOLVE THE DISAGREEMENT BY ASSERTION. A
      MEASURED TOOLCHAIN-AND-THROUGHPUT RECEIPT is a required first-batch
      artifact, and no card may declare a budget that depends on AES-NI
      throughput until that receipt exists. Any candidate whose cheapest
      falsification gate does not fit the measured envelope is OUT OF SCOPE FOR
      EXECUTION and must be recorded as such rather than estimated
      (AGENTS.md rule 9).
    - >-
      WHAT THE ENVELOPE FORECLOSES, STATED SO IT IS NOT REDISCOVERED PER
