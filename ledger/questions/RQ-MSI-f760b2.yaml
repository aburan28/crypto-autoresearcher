research_question:
  id: RQ-MSI-f760b2
  title: >-
    Is Modular Symbol Inversion (MSI) a sound new hardness assumption, or does
    the truncated l-adic period encoding of an oriented supersingular curve leak
    enough structure to invert it?
  scope:
    curve_families:
      - >-
        O-oriented supersingular elliptic curves over F_{p^2}, O an imaginary
        quadratic order, in the sense of the orientation literature
        (KN-TECH-027, KN-OPEN-014)
      - >-
        the modular curve X_0(N) and its relative homology H(X_0(N), C, Z),
        i.e. modular symbols, carrying the Hecke action
    field_types:
      - "F_{p^2} for the curves"
      - "Z/l^m Z for the truncated period vectors"
      - "Q_l and C_l for Coleman integration against weight-2 cusp forms"
    bit_sizes:
      - >-
        toy first: small N with explicit modular-symbol bases, small l, small
        truncation exponent m, dimension d = dim S_2(Gamma_0(N))
      - >-
        cryptographic scale only if a toy-scale inversion gap survives; no
        parameter set is proposed or endorsed by this record
    methods:
      - modular symbols and the Hecke action on H(X_0(N), C, Z)
      - Coleman integration of weight-2 cusp forms to l-adic periods
      - >-
        lattice reduction against the truncated period map, treating short
        homology representatives as short vectors in a known lattice
      - >-
        path problems on supersingular isogeny graphs and on Bruhat-Tits trees,
        as the paper's own stated point of contact
  motivation: >-
    Colo, "From Orientations to l-adic Period Vectors" (arXiv:2603.29789,
    2026-03-31, math.NT; ingested as KN-LIT-1662) constructs an explicit
    computable map from short combinatorial homology representatives of
    O-oriented supersingular curves to truncated vectors in (Z/l^m Z)^d, and
    formulates the Modular Symbol Inversion problem: recover a short homology
    representative from its truncated l-adic period data. The paper proposes MSI
    and discusses its arithmetic structure and potential cryptographic
    applications; it does not, on the evidence of its abstract, claim a hardness
    result.
    This program has 128 literature entries touching moduli spaces and modular
    curves and 8 ledger records, all of the latter negative-result closures. The
    terms "modular symbol", "Bruhat-Tits", "Coleman integration" and "MSI"
    return zero hits across ledger/, knowledge/techniques/, knowledge/findings/
    and knowledge/open-problems/, and nothing cites KN-LIT-1662. This is an
    unmined corpus rather than a searched-and-empty one, which is the
    premature-closure failure mode named in docs/inventor-protocol.md.
  decision_target: >-
    Decide which of three states MSI is in, and commit the program accordingly:
    (A) MSI is a lattice problem in disguise -- the truncated period map is
    linear over Z/l^m Z on a lattice whose basis is computable from public data,
    so "short representative" recovery is CVP/BDD in a known lattice and MSI
    inherits its cost with no new hardness; (B) MSI is a relabelling of an
    isogeny path problem already in KN-OPEN-013, contributing an encoding but no
    new assumption; or (C) the truncation to (Z/l^m Z)^d genuinely destroys the
    linear-algebraic handle and MSI is a distinct assumption worth analysing.
    The decision must name which of A, B or C holds and at what parameters, and
    must state the boundary rather than a global verdict.
  constraints:
    - >-
      MSI is a newly proposed problem with no published cryptanalysis known to
      this program. Any hardness statement is unverified by default; absence of
      an attack in this program's toy range is not evidence of hardness and must
      never be recorded as such.
    - >-
      Do NOT pitch this as a route into prime-field ECDLP. KN-TECH-3b593f closes
      the genus-1 applicability boundary for post-SIDH higher-dimensional
      isogeny mechanisms by counting, and KN-TECH-06bb4e records the
      lifting-obstruction taxonomy. A proposal that re-enters either is closed
      on arrival.
    - >-
      Do NOT re-open the CM canonical-lift lane. DEC-20260810-2c7e3c closed
      RQ-CANL-63098f as reject_scoped on 2026-08-10: any lane variant must state
      what CM does to the canonical height of the lifted points or it is closed
      on arrival. Coleman integration is p-adic analysis on the modular curve,
      not a canonical lift of the ECDLP instance, and the distinction must be
      stated explicitly in any proposal that touches it.
    - >-
      The zero-bit closure H-MOD-e9d87e concerns diamond-invariant functions on
      a SINGLE X_1(N) fibre for a rational ECDLP instance. It does not bear on
      MSI, which is about relative homology of X_0(N) and oriented supersingular
      curves. A proposal must say why it is not caught by that closure rather
      than ignoring it.
    - >-
      RETRACTED BEFORE THIS RECORD BECAME OFFICIAL, and recorded here because
      the retraction is load-bearing. An earlier draft of this constraint
      asserted that KN-LIT-1662 mis-transcribes the abstract, saying "arithmetic
      topology of modular curves" where the published abstract says "arithmetic
      of modular curves". THAT ASSERTION WAS WRONG AND KN-LIT-1662 IS CORRECT.
      The paper itself -- both the PDF and the arXiv LaTeXML HTML rendering of
      arXiv:2603.29789v1 -- reads "the arithmetic topology of modular curves".
      Only the arXiv ABS-PAGE metadata field reads "the arithmetic of modular
      curves"; author-submitted metadata and the LaTeX abstract differ, and the
      earlier draft had read the abs page alone. The lesson generalises: for
      this program an abs page is metadata, not the paper, and the paper is the
      PDF or the full-text rendering.
    - >-
      Stage 0 IS NOW DISCHARGED for the paper body. The full text of
      arXiv:2603.29789v1 was read on 2026-08-12. The definitions previously
      taken from the abstract alone are now sourced: Proposition 3 gives
      rk_Z H_1(X_0(N), C; Z) = 2g(X_0(N)) + (c - 1); Definition 7 gives the
      truncated period vector and states that Pi_m is Z-LINEAR; section 6.3
      gives the matrix form A x = y mod l^m; Definitions 8 and 9 give the MSI
      relation and problem, both quantified over valid paths gamma in W_L;
      section 7.3 gives the parameter regime. Any record that still carries an
      undischarged Stage 0 gate for the BODY is stale on that point; gates for
      claims the body does not settle remain open.
  status: active
  owner: coordinator
