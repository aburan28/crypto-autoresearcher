research_question:
  id: RQ-PMA-001
  title: >-
    Does divisor parity obstruct ordinary 4x4 principal-minor assignment over
    rational function fields k(t) with char k != 2, and is the obstruction
    predicate an exact existence classifier at toy scale?
  scope:
    curve_families: []
    field_types: ["rational function field k(t), char k ≠ 2"]
    bit_sizes: []
    methods:
      - ordinary PMA4 anchored orientation quadratics (q_ij, c_ijk, Delta_ijk)
      - exact square-class and divisor-parity certificates over k(t), including the valuation at infinity and the residual constant class
      - independent constructive brute-force matrix-existence solving with reverified witnesses
      - groebner consistency cross-checks over k(t)
  motivation: >-
    IDEA-20260726-012 proposes that ordinary PMA4 reconstruction over k(t)
    (char k != 2) turns prescribed reciprocal-minor data p_emptyset = 1,
    p_S = (t+1)/(t+d_S) into three quadratic orientation equations whose
    discriminants must be squares in k(t), and that an odd valuation of any
    canonically reduced discriminant at a finite irreducible divisor or at
    infinity is a fatal obstruction to an ordinary 4x4 matrix over k(t)
    having the prescribed principal minors. The proposal arrived with no
    research-question record; this intake repair records the question so the
    mechanism predicate can be validated against independent brute-force
    existence at toy scale before any generic-family symbolic derivation is
    considered.
  decision_target: >-
    Whether the divisor-parity obstruction predicate agrees exactly with
    independent brute-force matrix existence on the tested small-instance
    grid over k = F_q (small odd q) and k = Q, with at least one non-vacuous
    parity obstruction -- in which case a scoped symbolic derivation track
    may be proposed -- or exhibits a disagreement, in which case the
    predicate (soundness direction) or its exact-classifier framing
    (sufficiency direction) must be revised first.
  constraints:
    - characteristic 2 is out of scope (a separate Artin-Schreier / linearized-quadratic problem); the predicate must refuse or flag char-2 inputs
    - divisor parity plus residual constant class is necessary, not sufficient: shared orientation consistency, every size-at-most-three minor, and the full four-minor gate remain independent requirements; NOT_OBSTRUCTED_BY_THIS_GATE is never a compatibility claim outside the frozen grid agreement test
    - degenerate loci (q_ij = 0, degree drops, zero discriminants, pole collisions d_S = d_T, cancellation at t = -1) are branched and classified separately, never counted as obstructions
    - toy-scale mechanism validation only; no ECDLP, relation campaign, source-to-scalar, or cryptographic claim
  status: active
  owner: coordinator
