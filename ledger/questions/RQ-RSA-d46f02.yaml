research_question:
  id: RQ-RSA-d46f02
  title: >-
    RSA under partial information: how far is the achievable Coppersmith
    frontier from the asymptotic one once lattice dimension, reduction quality
    and memory are charged at deployed modulus sizes?
  scope:
    scheme: "RSA (partial key exposure, small private exponent, structured primes, short-pad and related-message settings)"
    family: "Coppersmith small-root methods over lattices; LLL/BKZ reduction"
    assumption: >-
      The inherited object is a family of ASYMPTOTIC BOUNDS, each carrying an
      unquantified "for sufficiently large lattice dimension" clause. Every
      practical judgement about how much RSA leakage is fatal — side-channel
      severity, fault-attack triage, partial-key-recovery risk — is an
      application of one of these bounds, and the clause that makes them true
      is exactly the term nobody charges.
    standardization_status: >-
      RSA is deployed at scale and on a published migration path away. The
      partial-information bounds are cited in vulnerability assessments far
      more often than they are re-derived at the sizes being assessed.
    targets:
      - >-
          THE GAP, WHICH IS THE WHOLE QUESTION: for each attack family, the
          asymptotic bound against the bound actually ACHIEVED at 1024/2048-bit
          moduli within a declared lattice dimension and reduction budget. The
          claim "knowing this fraction of the bits breaks RSA" is true in a
          limit; the operative quantity is what fraction breaks it on a real
          machine, and the two are not the same number.
      - >-
          CHARGING THE LATTICE: reduction time, PEAK MEMORY, and the achieved
          root-Hermite factor per lattice dimension, so that a leakage
          frontier reports memory beside time in the same convention
          GOAL-RSA-001 and GOAL-ECDSA-001 use. A leakage bound quoted without
          the dimension that reaches it is incomplete.
      - >-
          GROUND TRUTH THAT COSTS NOTHING: unlike almost every other question
          in this program, instances here can be CONSTRUCTED WITH KNOWN
          ANSWERS. Generate moduli with a chosen amount of leaked structure and
          the factorization known in advance; success and failure are then
          decidable facts rather than inferences, and a false positive is
          impossible to mistake for a result.
      - >-
          THE CROSS-SETTING CONTROL: ECDSA nonce leakage and RSA partial key
          exposure are the same lattice question posed in two settings. A
          reduction-quality model calibrated in one should predict the other,
          and a model that fits only where it was fitted is caught by a control
          this program already has open in GOAL-ECDSA-001.
    methods:
      - >-
          Re-implementation of the small-root constructions from primary text,
          with lattice dimension, shift-polynomial choice, and reduction
          parameters declared before the run rather than tuned until something
          works.
      - >-
          Known-answer instance generation across a declared leakage grid, with
          seeds recorded, so every cell has decidable ground truth.
      - >-
          Reduction-quality measurement (achieved root-Hermite factor against
          dimension and block size) rather than assumed reduction behaviour.
      - >-
          Charged-cost bookkeeping per docs/target-result-profile.md, in the
          convention shared with GOAL-RSA-001 and GOAL-ECDSA-001.
    claim_tier_ceiling: >-
      NO FACTORIZATION OF ANY DEPLOYED MODULUS IS IN SCOPE. Every claim is
      conditional on ASSUMED LEAKAGE that the campaign supplies to itself by
      construction, and a recovery under assumed leakage is a statement about
      the LEAKAGE MODEL, never about RSA's hardness and never about any
      deployed key. Certificates are exact: a claimed recovery emits the
      factorization and it is verified by multiplication. Failure to reach a
      bound within a declared budget is a statement about that budget and that
      implementation, not a proof the bound is wrong.
  motivation: >-
    GOAL-RSA-001 opened the cost lane for breaking RSA with no information.
    This is the other half of the same primitive and the half that governs
    almost every real-world RSA decision: what happens when the adversary knows
    something. Side-channel severity ratings, fault-attack triage, and
    structured-prime advisories all resolve to "is the leaked fraction above or
    below the Coppersmith bound", and that comparison is made against an
    asymptotic statement whose enabling condition — sufficiently large lattice
    dimension — is precisely what a real attacker cannot always afford. The
    question is unusually tractable for this program: the instances can be
    manufactured with known answers, so there is no inference step between
    running the attack and knowing whether it worked, and the sizes that matter
    are reachable. It is also the natural companion to the ECDSA nonce-leakage
    frontier already open here, and running the two in one charging convention
    turns each into a control on the other's reduction-quality model.
  decision_target: >-
    Whether this program can hold a memory-charged leakage frontier for RSA
    that states, at deployed modulus sizes and declared lattice budgets, how
    far the achievable partial-information bounds sit from the asymptotic ones.
  provenance: >-
    NOT OBTAINED BY SEARCH IN THIS SESSION AND NOT FILED AS KN-LIT. The attack
    families named in this record — Coppersmith small-root methods, partial key
    exposure from known most- or least-significant bits of a prime,
    small-private-exponent attacks in the Wiener and Boneh-Durfee lines,
    structured-prime generation of the ROCA type, and short-pad/related-message
    attacks — are named as RESEARCH TARGETS TO BE LOCATED AND FILED, not as
    results on record. NO BOUND, EXPONENT, OR COMPLEXITY FIGURE IS QUOTED
    ANYWHERE IN THIS RECORD, deliberately: this program has not read the
    primary sources in this session and will not carry remembered constants
    into a record that later work would cite. Every numeric bound enters the
    ledger for the first time through a KN-LIT entry read from primary text.
  constraints:
    - >-
      No experiment may be designed until the specific small-root constructions
      to be reproduced are filed as KN-LIT entries at stated provenance levels,
      WITH THEIR BOUNDS TAKEN FROM PRIMARY TEXT. This record deliberately
      contains no numbers to inherit.
    - >-
      Memory beside time in every reported figure, in the convention shared
      with GOAL-RSA-001 and GOAL-ECDSA-001. A leakage bound without the lattice
      dimension and reduction budget that achieved it may not be carried into
      any comparison.
    - >-
      Every cell of the leakage grid uses KNOWN-ANSWER INSTANCES with recorded
      seeds. A run whose ground truth is not known in advance is not admissible
      evidence in this question.
    - >-
      A failed recovery is a BUDGET AND IMPLEMENTATION OUTCOME, never evidence
      that a published bound is wrong (AGENTS.md rule 3). Contradicting a
      published bound requires reproducing the construction faithfully first
      and saying so explicitly.
    - >-
      NOTHING HERE MAY BE REPORTED AS A STATEMENT ABOUT ANY DEPLOYED RSA KEY,
      VENDOR, LIBRARY, OR DEVICE. Structured-prime work uses self-generated
      keys exclusively; no third-party key material is collected, probed, or
      analysed.
    - >-
      A recovery under assumed leakage is a statement about the leakage model.
      Writing it as a statement about RSA's hardness is a claim-tier violation.
  status: active
  owner: coordinator
  created_at: '2026-08-09'
