research_question:
  id: RQ-ALR-001
  title: Can a compact elliptic target-divisor resultant avoid the represented nN body?
  scope:
    curve_families:
      - p98561_j0_q16427_h6_u2_v3
      - p100129_j1728_q16687_h6_u3_v2
      - p99527_generic_q14219_h7_u2_v1
    field_types:
      - prime
    bit_sizes:
      - toy
    methods:
      - elliptic_target_divisor
      - subresultant
      - modular_composition
      - power_projection
      - straight_line_program
  motivation: >-
    Preserve and continue the exact AutoLab R182 investigation inside the
    crypto-autoresearcher evidence system, with explicit provenance, costs,
    finite controls, and claim ceilings.
  decision_target: >-
    Construct or refute an SLP-direct determinant-zero or resultant-mod-U
    algorithm that emits only the candidate factor G_1 in softly O(n+N) work.
  constraints:
    - Finite controls do not establish an asymptotic circuit or resultant lower bound
    - Toy curves do not support crypto-scale attack credit
    - Every represented remainder, trace, inverse, norm, gcd, and verification cost is charged
    - Pollard-rho and Shoup improvement flags remain false until a complete generic-prime attack is supplied
  status: active
  owner: coordinator
