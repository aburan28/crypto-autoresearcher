research_question:
  id: RQ-HAWK-001
  title: >-
    Does the reported polynomial-time module-LIP key recovery against
    HAWK hold at HAWK's actual parameter sets, and under exactly which
    numbered heuristics does it succeed or fail?
  scope:
    scheme: "HAWK"
    family: "lattice (the only lattice-based Round-3 candidate)"
    assumption: >-
      search module Lattice Isomorphism Problem (smLIP) over rank-2
      modules
    process_status: >-
      NIST Additional Digital Signatures, advanced to Round 3 on 2026-05-14;
      team tweaks due 2026-08-14. Round-3 specification not yet read by this
      program.
    targets:
      - >-
          the rank-2 module-LIP instance actually induced by HAWK key
          generation
      - >-
          the claimed automorphism and the smLIP -> nrdPIP reduction
      - >-
          each of the reported heuristics, individually falsifiable
      - >-
          the concrete (not asymptotic) cost at HAWK-512 / HAWK-1024
          analogues
    methods:
      - >-
          primary-source reading of the disclosed attack and of van
          Gent-Pulles (2025)
      - >-
          independent reimplementation at toy module ranks and small
          cyclotomic degrees
      - >-
          heuristic-by-heuristic falsification: hold three, stress the
          fourth
      - >-
          key-recovery certificate: recovered secret basis must verify
          against the public form
    claim_tier_ceiling: >-
      Toy-tier until a certified instance at or above the scheme's own
      parameter scale exists. AGENTS.md rule 7 applies: no toy-scale result is
      reported as a statement about deployed parameters.
  motivation: >-
    This is the most time-critical target in the Round-3 field. Reported
    2026 cryptanalysis claims a classical probabilistic-polynomial-time
    recovery of the HAWK secret key, resting on four number-theoretic
    heuristics and on a reduction from HAWK's rank-2 module-LIP
    instances to nrdPIP, enabled by an automorphism whose existence van
    Gent and Pulles (2025) showed would halve the effective rank but
    which was not known at the time. Two further 2026 preprints attack
    definite and indefinite LIP with stated application to HAWK. Whether
    NIST revises parameters, security claims, or HAWK's standing was
    still open as of 2026-07-28. A conditional-on-numbered-heuristics
    exponent-moving result on a central hard problem is precisely the
    target profile in docs/target-result-profile.md, and here the
    question is whether the claimed one is real at deployed parameters.
  decision_target: >-
    Whether HAWK key recovery is genuinely polynomial-time at deployed
    parameters (and under which heuristics), is polynomial only in a
    regime HAWK avoids, or fails outright.
  provenance: >-
    Candidate list taken from the NIST announcement of 2026-05-14 that
    nine schemes advance to Round 3 of the Additional Digital Signatures
    process. csrc.nist.gov and nist.gov are unreachable from this
    harness's network policy (proxy CONNECT 403), so the roster and
    elimination list were confirmed from secondary reporting rather than
    read from the primary page; the Round-3 specification bundle (team
    tweaks due 2026-08-14) has NOT been read. Every per-scheme technical
    claim below is a research target to be verified against primary
    sources before any experiment is designed, not an established
    result.
  constraints:
    - >-
      Every per-scheme technical claim in this record is sourced from
      secondary reporting or from memory of the literature and is UNVERIFIED.
      No experiment may be designed until the relevant primary sources are
      filed as KN-LIT entries.
    - >-
      Matched-baseline discipline: no attack cost is reported without the
      best-known baseline at identical parameters, with memory, preprocessing,
      and verification charged.
    - >-
      Any claimed break carries a certificate (recovered key annihilates the
      public map, or a forged signature verifies) that the run wrapper
      re-verifies independently. See docs/claims-and-verification.md.
  status: active
  owner: coordinator
  created_at: '2026-07-29'
