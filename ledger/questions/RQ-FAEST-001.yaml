research_question:
  id: RQ-FAEST-001
  title: >-
    Does FAEST's concrete forgery cost actually track AES one-wayness,
    or does the VOLE-in-the-Head / Fiat-Shamir instantiation admit a
    forgery cheaper than key recovery at its Round-3 parameter sets?
  scope:
    scheme: "FAEST"
    family: "symmetric / VOLE-in-the-Head (MPCitH family)"
    assumption: >-
      one-wayness of AES (no structured algebraic assumption)
    process_status: >-
      NIST Additional Digital Signatures, advanced to Round 3 on 2026-05-14;
      team tweaks due 2026-08-14. Round-3 specification not yet read by this
      program.
    targets:
      - >-
          VOLEitH consistency-check soundness error at the deployed
          field sizes
      - >-
          Fiat-Shamir / grinding parameter trade-off (multi-round
          forgery cost)
      - >-
          QROM reduction slack versus the claimed security category
      - >-
          algebraic attacks on the proven AES constraint system given
          partial VOLE openings
    methods:
      - >-
          re-derivation of the soundness bound from the Round-3
          specification
      - >-
          concrete multi-round forgery cost model with charged
          hash/grinding work
      - >-
          matched baseline: best known AES key recovery + best known
          VOLEitH soundness attack
      - >-
          toy-parameter reproduction with a forgery certificate before
          any extrapolation
    claim_tier_ceiling: >-
      Toy-tier until a certified instance at or above the scheme's own
      parameter scale exists. AGENTS.md rule 7 applies: no toy-scale result is
      reported as a statement about deployed parameters.
  motivation: >-
    FAEST is the only Round-3 candidate whose security rests solely on
    symmetric primitives, so it is the field's conservative fallback and
    the one whose failure would be most surprising. That makes the gap
    between the headline assumption (AES one-wayness) and the actual
    attack surface (VOLEitH soundness, Fiat-Shamir tightness in the
    ROM/QROM, grinding trade-offs, small-field VOLE consistency checks)
    the interesting object. Reported 2026 work retightens FAEST's QROM
    analysis via Renyi-divergence arguments, which implies the
    previously claimed bound was not tight in at least one direction; a
    bound that moved once can move again.
  decision_target: >-
    Whether FAEST's claimed security category is supported by a tight
    chain from AES one-wayness, or whether a charged forgery path exists
    that is cheaper than the matched AES baseline.
  provenance: >-
    Candidate list taken from the NIST announcement of 2026-05-14 that
    nine schemes advance to Round 3 of the Additional Digital Signatures
    process. csrc.nist.gov and nist.gov are unreachable from this
    harness's network policy (proxy CONNECT 403), so the roster and
    elimination list were confirmed from secondary reporting rather than
    read from the primary page; the Round-3 specification bundle (team
    tweaks due 2026-08-14) has NOT been read. Every per-scheme technical
    claim below is a research target to be verified against primary
    sources before any experiment is designed, not an established
    result.
  constraints:
    - >-
      Every per-scheme technical claim in this record is sourced from
      secondary reporting or from memory of the literature and is UNVERIFIED.
      No experiment may be designed until the relevant primary sources are
      filed as KN-LIT entries.
    - >-
      Matched-baseline discipline: no attack cost is reported without the
      best-known baseline at identical parameters, with memory, preprocessing,
      and verification charged.
    - >-
      Any claimed break carries a certificate (recovered key annihilates the
      public map, or a forged signature verifies) that the run wrapper
      re-verifies independently. See docs/claims-and-verification.md.
  status: active
  owner: coordinator
  created_at: '2026-07-29'
