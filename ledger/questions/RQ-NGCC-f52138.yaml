# RQ-NGCC-f52138 -- opened by DEC-20260930-713445 with GOAL-NGCC-6c8a52,
# on the user's 2026-09-30 instruction to make the Chinese NGCC round-1
# algorithms targets.
research_question:
  id: RQ-NGCC-f52138
  title: >-
    For each of the 119 NGCC round-1 candidates, what is the cheapest
    attack that violates a primary security claim or an NGCC call target,
    and which published claims of such an attack reproduce?
  scope:
    population: >-
      The 119 first-round candidates in
      inputs/ngcc-round1-20260920/candidates.yaml: 34 signatures (sign-01
      through sign-34), 41 KEMs (kem-01 through kem-41), 9 key-exchange
      protocols (kex-01 through kex-09), and 35 hash functions (hash-01
      through hash-35). Official names, submitters, and package URLs are
      that file. A parameter set is a separate instance of its candidate,
      not a new target id.
    security_targets: >-
      The ICCS call's classical levels 128, 256, and 512 bits, with quantum
      levels at least 80, 128, and 256 bits, and the hash targets of
      collision resistance h/2 and preimage resistance h. Signature games
      are EUF-CMA or SUF-CMA. KEM games are IND-CCA2. A KEM or key-exchange
      shared secret shorter than its classical level is a target shortfall.
      Placeholder pseudohash and pseudoXOF are assumed to be ideal
      replacements of the same external length: a finding that exists only
      against the placeholder is out of scope.
    out_of_scope: >-
      Deployed systems, live networks, and any candidate that is not on the
      round-1 roster. NIST ML-KEM, ML-DSA, SLH-DSA, and FN-DSA stay with
      their existing goals. An attack on the supersingular-isogeny problem
      as a problem, rather than on an NGCC submission's parameters and
      claims, stays with GOAL-SQISIGN-001, GOAL-SQISIGN-002, GOAL-SSI-001,
      and GOAL-CSIDH-001.
  motivation: >-
    On 2026-09-30 the user directed that the Chinese NGCC algorithms be
    made targets. ICCS published 119 first-round candidates on 2026-09-20.
    Saarinen's ePrint 2026/2266 reports 191 active public findings on 89 of
    them after seven days, including design-level key recovery and forgery.
    This program has no NGCC campaign. The published findings are leads to
    reproduce or refute. They are not evidence until an experiment here
    produces its own witness.
  decision_target: >-
    For a selected candidate and parameter set, either an independently
    checked witness that a primary claim or NGCC target fails, scoped to
    the tested instance, or a recorded obstruction that names what was
    tested, what it cost, and what remains open. A population-wide
    "no finding" is not a security certificate.
  constraints:
    - >-
      Nothing shipped inside a submission archive is executed or linked.
      Reference code is compiled by this program from sources, or the run
      is refused.
    - >-
      A published finding is a literature pointer until this program
      re-executes a witness or re-derives the argument. ePrint 2026/2266
      and ngcc.dev do not discharge that duty.
    - >-
      Severity, evidence status, and layer are assigned independently.
      No Critical label without a candidate-specific recovery, forgery,
      collision, or target-shortfall argument. Practicality is not required
      when a claimed security bound is violated.
    - >-
      Placeholder hashes are ideal replacements. A result that vanishes
      when the placeholder is replaced is not a result about the scheme.
    - >-
      Every claimed solve, forgery, collision, or key recovery carries a
      certificate the run wrapper re-verifies. Timeouts and build failures
      are infrastructure, not negative mathematical evidence.
    - >-
      Isogeny-problem attacks that are not about an NGCC parameter set are
      handed to the existing ECC goals named in scope.out_of_scope.
  citations:
    - ref: https://eprint.iacr.org/2026/2266
      provenance: retrieved
      claim: >-
        The paper reports the NGCC round-1 population (34 signatures, 41
        KEMs, 9 key-exchange protocols, 35 hashes) and a first-week public
        finding snapshot. This question uses that snapshot as a lead list,
        not as evidence.
      verified_by: >-
        Session of 2026-09-30 fetched the ePrint landing page. The paper
        text used for paper_mentions.yaml was the text supplied with the
        user's request.
    - ref: inputs/ngcc-round1-20260920/candidates.yaml
      provenance: retrieved
      claim: >-
        Official candidate ids, names, submitters, and package URLs, joined
        from the public ngcc-dev harness CSVs retrieved 2026-09-30.
      verified_by: >-
        This session downloaded the five CSVs, checked their git blob ids
        against the GitHub contents API, and joined them. Counts are 34,
        41, 9, 35, total 119.
