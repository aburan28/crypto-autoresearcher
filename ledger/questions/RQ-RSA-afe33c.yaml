research_question:
  id: RQ-RSA-afe33c
  title: >-
    What does RSA cost when the number field sieve's memory and communication
    are charged rather than assumed free — and does any published cost model
    reproduce the record computations it is extrapolated from?
  scope:
    scheme: "RSA (integer factorization of balanced semiprimes)"
    family: "number field sieve; general NFS, with special NFS as a control"
    assumption: >-
      Not a hardness assumption but a COST MODEL. Every statement of the form
      "RSA-3072 is comparable to category 1", or "RSA-2048 is safe through
      year Y", is an extrapolation of NFS cost from record computations,
      through a model whose memory and communication terms are the least
      charged part of the estimate.
    standardization_status: >-
      Deployed everywhere and on a published migration path away. Reported
      2026 US federal deadlines of 2030 for key establishment and 2031 for
      signatures are cited elsewhere in this ledger as motivation and remain
      UNVERIFIED here.
    targets:
      - >-
          Exact baseline reproduction: does an independently re-implemented
          NFS cost model predict the PUBLISHED measurements of the record
          computations — RSA-240, RSA-250, and the 795-bit DLP-240 record —
          within a declared factor, for both running time and matrix size?
      - >-
          Charging the linear algebra: block Wiedemann over a sparse matrix
          (405M rows at density 252 after merge, for RSA-250, per the excerpt
          obtained) has a memory footprint and an interconnect requirement
          that a core-year figure does not express. State the memory and
          communication terms and the parallel scaling law.
      - >-
          Adjudicating a standing disagreement in the literature: core-year
          extrapolations against area-time and batch-NFS costing
          (KN-LIT-2663). These give different answers about what large-scale
          factoring costs, and this program currently inherits neither.
      - >-
          A concrete cost table at RSA-1024 / 2048 / 3072 with memory beside
          time, every optimistic assumption flagged, the time-memory tradeoff
          stated, and an explicit affected-versus-safe scope.
    methods:
      - >-
          Re-implementation of the published NFS simulation methodology, which
          predicts phase running times and matrix size from parameters before
          a computation is run, then validation against the record data.
      - >-
          A BUILT-IN CONTROL THE LITERATURE ALREADY SET UP: factorization and
          prime-field discrete logarithm were run at the SAME 240-digit size
          in a single 2020 experiment. A cost model that reproduces one and
          not the other is caught by a control that costs nothing to use.
      - >-
          Small-but-real end-to-end runs at sizes this harness can actually
          reach, used to calibrate the model rather than to set records.
      - >-
          Charged-cost bookkeeping per docs/target-result-profile.md: memory
          beside time, disclosure of what hides in the o(1), and parallel and
          communication forms stated rather than implied.
    claim_tier_ceiling: >-
      NO FACTORIZATION RECORD IS IN SCOPE AND NO BREAK IS CLAIMED. The
      deliverable is a baseline, and the strongest admissible conclusion is a
      statement about a COST MODEL: that it does or does not reproduce
      published measurements, and what it predicts under stated assumptions.
      Model agreement is never evidence that an extrapolation to RSA-2048 is
      correct; the extrapolation remains conditional on numbered heuristics
      and is reported as such.
  motivation: >-
    This program holds KN-TECH-057 as its exemplar of a matched full-cost
    baseline: supersingular path-finding costed properly, with memory, so that
    any later claim has something honest to be compared against. It has no
    analogue for integer factorization. That gap is not academic. Two of the
    five goals opened in this batch (this one and RQ-ECDSA-87625f) concern
    primitives whose retirement schedules are set by cost extrapolations, and
    a program that cannot cost NFS cannot check any of the equivalences those
    schedules rest on — nor its own, if an ECDLP or lattice result is ever
    compared against "the RSA line". The published record data makes this
    tractable rather than speculative: RSA-250 was reported at roughly 2700
    core-years on a named CPU, split into polynomial selection, 2450 for
    sieving and 250 for linear algebra, with the post-merge matrix at 405M
    rows and density 252, and the authors published a simulation methodology
    that predicts these quantities from parameters in advance. That is an
    exact-baseline-reproduction audit in the sense of KN-TECH-080, available
    off the shelf. It also has a real failure mode worth finding: core-years
    on a reference core is a TIME-ONLY metric, and the quantity it omits —
    the memory and interconnect the 405M-row matrix demands — is exactly what
    Bernstein-Lange's area-time analysis of batch NFS (KN-LIT-2663) argues
    changes the picture. Those two costings are not reconciled in this
    program's corpus, and the honest first move is to build the model and see
    which one the record data supports. Under docs/inventor-protocol.md,
    declining to work on factoring because it is the most-studied problem in
    the field is premature closure; building the baseline is not an attack on
    RSA and does not pretend to be one.
  decision_target: >-
    Whether this program can hold a memory- and communication-charged NFS
    cost baseline that reproduces the published record computations, and what
    that baseline says about the RSA parameter equivalences currently taken on
    inheritance.
  provenance: >-
    OBTAINED BY SEARCH-TOOL EXCERPT ON 2026-08-04, NOT FILED AS KN-LIT. The
    documents seen in excerpt were the CADO-NFS RSA-250 announcement
    (caramba.inria.fr/rsa250.txt), the PRACE talk "Factoring RSA-250"
    (members.loria.fr/PZimmermann/talks/rsa250-prace.pdf), the merge/filtering
    paper at inria.hal.science/hal-02098114, and "Comparing the Difficulty of
    Factorization and Discrete Logarithm: a 240-digit Experiment"
    (eprint 2020/697). The figures repeated above — 829 bits, roughly 2700
    core-years total, 130 / 2450 / 250 core-years for polynomial selection /
    sieving / linear algebra on Intel Xeon Gold 6130 at 2.1GHz, 8.7G raw and
    6.1G unique relations, 405M rows at density 252 after merge — are
    RESEARCH TARGETS TO BE RE-READ FROM PRIMARY TEXT. Note in particular that
    the phase figures as quoted sum to 2830 rather than the headline 2700,
    which may be a rounding convention, a hardware difference between the
    announcement and the talk, or an extraction error; this program has not
    determined which, and that is exactly the kind of detail the baseline
    reproduction has to settle rather than inherit.
  constraints:
    - >-
      Every technical figure in this record is UNVERIFIED and was read from a
      search excerpt. No experiment may be designed until the record
      announcements and the NFS simulation methodology are filed as KN-LIT
      entries at stated provenance levels.
    - >-
      No factorization record is attempted. A campaign that finds itself
      trying to set one has misread this question, and the compute would in
      any case exceed the campaign budget by many orders of magnitude.
    - >-
      Memory beside time in every reported figure, per
      docs/target-result-profile.md. A cost stated in core-years alone is
      incomplete and may not be carried into a comparison.
    - >-
      Every optimistic assumption in the concrete cost table is flagged
      individually. A cost table without that list is invalid under
      templates/research-records.md.
    - >-
      The DLP-240 control is not optional. A model validated against
      factorization records alone has one fewer degree of freedom checked
      than the literature makes freely available.
    - >-
      Nothing in this question may be reported as a statement about the
      security of deployed RSA keys. A cost model is a cost model.
  status: active
  owner: coordinator
  created_at: '2026-08-04'
