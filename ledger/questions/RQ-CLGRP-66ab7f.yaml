research_question:
  id: RQ-CLGRP-66ab7f
  title: >-
    Class groups of imaginary quadratic fields are deployed as trustless
    hidden-order groups on the strength of an index-calculus cost model with
    very few anchoring computations — what does the measured curve give, and
    how far do the deployed discriminant sizes sit from it?
  scope:
    scheme: "class groups of imaginary quadratic orders as used in verifiable delay functions, RSA-free accumulators, and hidden-order-group commitments"
    family: "index calculus for imaginary quadratic class groups; low-order and adaptive root assumptions"
    standardization_status: >-
      RECALLED, UNVERIFIED: not standardized. Deployed in at least one
      production consensus system's proof-of-time construction and in several
      accumulator designs, chosen specifically because it avoids the trusted
      setup that an RSA modulus requires.
    targets:
      - >-
        THE MEASURED COST CURVE: class group order and structure computations
        run to completion at a sweep of discriminant sizes, each emitting a
        CERTIFICATE (generators, relations, and a verifiable structure
        statement) re-verified independently, with the observed cost fitted and
        reported with confidence intervals.
      - >-
        THE EXTRAPOLATION AND ITS HONESTY: the fitted curve extended to
        deployed discriminant sizes, with the extrapolation's uncertainty
        stated. The interesting output is the width of that interval, since
        the deployment argument treats the estimate as tight.
      - >-
        THE ASSUMPTION AUDIT: the low-order assumption and the adaptive root
        assumption both fail in the presence of known structure — RECALLED:
        ambiguous forms give elements of order two, so the constructions work in
        a quotient or impose conditions. Enumerate the known structural
        sub-cases exhaustively and verify that each named countermeasure removes
        each one, with a certificate where it does not.
      - >-
        THE PARAMETER-CHOICE PROVENANCE: where each deployed discriminant size
        came from, and whether it is a translation of an RSA-modulus estimate
        under a rule that this program can restate and check.
    methods:
      - Full class group computations at small and moderate discriminants with certified output, using an implementation validated against known small-discriminant class numbers.
      - Direct enumeration of the known structural sub-cases (two-torsion from ambiguous forms and any other genus-theory-visible structure) and construction of an explicit witness for each.
      - Cost fitting with declared model form, residuals reported, and a stated extrapolation interval.
    claim_tier_ceiling: >-
      MEASUREMENT AND EXTRAPOLATION CLAIMS ONLY. No computation at a deployed
      discriminant size is attempted and no statement that a deployed parameter
      is inadequate or adequate may be recorded. Structural witnesses are
      statements about the group, not about any system that uses it.
  motivation: >-
    Hidden-order groups without trusted setup are the reason class groups
    re-entered deployment, and their parameter sizes rest on a cost model with
    far fewer anchoring record computations than the RSA model it replaced.
    That is the program's recurring pattern in a setting where the measurement
    is genuinely runnable: class group computations at small discriminants
    complete quickly, they produce certificates, and the curve can be swept.
    The two-torsion structure question is the same discipline applied to the
    assumptions rather than to the parameters, and it is finite.
  decision_target: >-
    The measured cost curve for class group computation and its extrapolation
    interval at deployed sizes, plus a verified map of which structural
    sub-cases each named countermeasure removes.
  provenance: >-
    RECALLED FROM MODEL MEMORY ON 2026-08-09. NOT WEB-SEARCHED, NOT PRIMARY-READ,
    NOT FILED AS KN-LIT. Research targets: Hafner-McCurley (RECALLED as the
    subexponential class group algorithm), Jacobson's improvements and record
    computations (RECALLED), Buchmann-Vollmer and the class group computation
    literature, Wesolowski and Pietrzak VDFs (RECALLED as the constructions that
    put class groups into deployment), Boneh-Bunz-Fisch on accumulators and the
    adaptive root assumption (RECALLED), and the observation that ambiguous
    forms give low-order elements (RECALLED). All UNVERIFIED.
  constraints:
    - No cost claim is recorded before at least one primary class group algorithm reference and one hidden-order-group construction are filed as KN-LIT entries.
    - Every class group computation emits a certificate re-verified by an independent checker; an uncertified structure computation is not evidence.
    - Extrapolations state their model form and interval; a point estimate at deployed size without an interval is not admissible.
    - No record may state that any deployed parameter choice is adequate or inadequate.
    - A failed or budget-exhausted computation is a statement about this program's solver and never about the hardness of the problem (AGENTS.md rule 3).
  status: active
  owner: coordinator
  created_at: '2026-08-09'
