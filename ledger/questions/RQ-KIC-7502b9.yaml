research_question:
  id: RQ-KIC-7502b9
  title: Can co-designed binary factor bases and exact point-decomposition constraints
    lower charged decomposition cost without losing useful relation yield?
  scope:
    curve_families:
    - Public-synthetic ordinary binary curves, initially Koblitz K1 with explicit
      finite field and group-order checks
    field_types:
    - binary extension
    bit_sizes:
    - Small exhaustive correctness rungs, then frozen finite decision panels; no scaling
      claim inferred
    methods:
    - factor-base construction
    - SAT/XOR point decomposition
    - exact meet-in-the-middle control
    - Frobenius and two-torsion coordinate representations
    - partial-assignment pruning measurement
  motivation: User explicitly requested a golden factor base and corresponding easy
    point decomposition, potentially SAT. Existing cold IC improvement does not yet
    beat matched rho, and compact membership or support alone does not establish efficient
    extraction.
  decision_target: Select or reject a precisely scoped base/decomposition candidate
    using exact membership and group correctness, coverage and full construction/encoding/search/verification
    memory costs against matched direct and null controls. No broader closure or exponent
    claim.
  constraints:
  - Public synthetic point decomposition only; no imported, unknown or private targets
    and no key recovery.
  - Every nominal SAT model must satisfy all CNF/XOR rows and the exact group equation;
    TRUE UNSAT requires a complete oracle or valid solver conclusion. Caps are censored.
  - Charge target-independent and target-dependent preprocessing, domain construction,
    coordinate conversion, lifting and exceptional branches.
  - Record selector/calibration and independent confirmation boundaries; do not optimize
    on confirmation targets.
  - A membership encoding change of the same point set cannot change actual sumset
    coverage.
  - New measurements do not change the scope/status of prior preliminary or validated
    results.
  status: active
  owner: coordinator
