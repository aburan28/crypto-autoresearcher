research_question:
  id: RQ-RAYCL-3985f4
  title: >-
    Does the ray-class fusion of curves and points carry computational content,
    or is it a faithful restatement of ECDLP? The coordinate map psi: E(F_p) ->
    O/m, its partial computability beyond Pohlig-Hellman, and whether
    Cl_m(O)-level structure changes any cost functional
  scope:
    curve_families:
    - ordinary elliptic curves over prime fields
    - toy isogeny classes with maximal order O and small class number h(O)
    - curves stratified by cofactor c = #E(F_p)/N, including c = 1
    field_types:
    - prime field F_p
    bit_sizes:
    - toy only (p up to ~32 bits) for every measurement under this question
    methods:
    - ray class group Cl_m(O) with m = (pi - 1)O
    - torsor / level-structure enumeration and the counting identity
    - explicit reduction construction with quantifier order frozen
    - generic-group simulability audit of any oracle this question invents
  motivation: >-
    OPENED 2026-08-11 FROM A LEAD, NOT FROM A FINDING. IDEA-20260811-319a07
    (axis A2 of BATCH-aeeb17, GOAL-ENDO-001) argues that because
    E(F_p) = ker(pi - 1) = E[m] for m = (pi - 1)O, pairs (curve, rational
    point) in one ordinary isogeny class carry (pi - 1)-level structure acted
    on by the ray class group Cl_m(O), and that the extension
    1 -> (O/m)^*/image(O^*) -> Cl_m(O) -> Cl(O) -> 1 splits ray-class
    vectorization exactly into ECDLP (kernel) and Cl(O)-vectorization
    (quotient).

    IF THAT HOLDS, it corrects a stated obstruction in the campaign's own
    decomposition. analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md
    lane L10 (RQ-CLGP-b99df5) names the obstruction as "the two problems live
    on different objects (curves vs. points)", and every prior closure in that
    lane leans on it. The lead says that statement is false as a categorical
    claim: the objects DO fuse, and exactly one arrow of the resulting diagram
    -- the coordinate map psi from points to O/m -- fails to be computable,
    with computing it BEING the ECDLP.

    THE REASON THIS IS A QUESTION AND NOT A RESULT. The same observation
    admits a deflationary reading that the lead does not rule out: if psi is
    the only non-computable arrow and computing psi is exactly ECDLP, then the
    fusion may be a faithful RESTATEMENT of ECDLP in class-field-theoretic
    vocabulary, carrying no computational content and licensing no new attack
    surface. A reduction that exists but is trivial is not a lead. This
    question exists to decide between the two readings on evidence, and the
    deflationary outcome is an accepted and intended deliverable.

    PROVENANCE AND ITS LIMITS, STATED UP FRONT. The seed record is a single
    idea-generator's output, filed at snapshot c3127ebfd and NOT yet
    adjudicated: the independent validator (TASK-20260811-845cc4) and red team
    (TASK-20260811-029a6c) commissioned for BATCH-aeeb17 had not returned when
    this question was opened. Within the seed itself, simple transitivity of
    the Cl_m(O)-action on X_m is marked [open] and carried as a proof
    obligation, NOT asserted; the exact sequence is marked [recall-confident]
    because WebSearch and WebFetch failed on every call in that session
    (Bedrock-routed, access denied) and the crypto-kb index is empty, so NO
    external source was verified. Nothing in this question may cite the seed
    as established, and the first obligation of any work here is to verify the
    two facts the seed relays rather than derives.
  decision_target: >-
    Decide, on evidence and with the tested boundary stated, which of these
    three holds:

    (T1) DEFLATIONARY. The ray-class fusion is a faithful restatement of
    ECDLP: every arrow but psi is computable, psi is exactly as hard as ECDLP
    with no partial computability beyond the Pohlig-Hellman content of the
    cofactor, and no cost functional measured anywhere in GOAL-ENDO-001 moves
    when a curve is equipped with (pi - 1)-level structure. Under T1 the
    correct output is a closure that (a) repairs DECOMPOSITION.md L10's
    obstruction text, replacing a false categorical claim with the true
    one-arrow statement, and (b) records that the repair changes no cost.
    THIS IS THE EXPECTED OUTCOME and it is a legitimate, citable deliverable.

    (T2) PARTIAL CONTENT. psi admits publicly computable partial information
    strictly beyond the log2(c) bits the cofactor already yields by
    Pohlig-Hellman -- on some identifiable family of curves, at some
    identifiable level structure. Under T2 the deliverable is the family, the
    exact bit count, and a generic-group audit (RQ-GGMB-6eaabc) of the oracle
    that partial computation defines.

    (T3) COST CONTENT. Equipping curves with (pi - 1)-level structure changes
    a measured attack-cost functional, or the Cl_m(O)-torsor admits an
    algorithmic operation its Cl(O) quotient does not. Under T3 the campaign's
    pause condition P3 applies before any record states an excess.
  constraints:
  - >-
    THE HARD GATE COMES FIRST AND IS ELEMENTARY. Before any reduction claim is
    believed, the counting identity #X_m = #Cl_m(O) must be checked by
    independent enumeration on toy ordinary classes -- #X_m by enumerating the
    class and, per curve, the O-module generators of E'[m] up to isomorphism;
    #Cl_m(O) from h(O) * #(O/m)^* / #image(O^*). A mismatch falsifies simple
    transitivity as implemented and HALTS this line. Because the identity is
    elementary, a mismatch is an implementation bug until independently
    replicated -- it is not a mathematical finding and must not be recorded as
    one.
  - >-
    THE TWO RELAYED FACTS ARE VERIFIED BEFORE USE, NOT ASSUMED. E(F_p) is
    isomorphic to O/m as an O-module (attributed in the seed to Lenstra 1996)
    and the ray-class exact sequence are both carried in the seed as recall
    and were NOT externally verified. Verify each -- computationally at toy
    scale where possible, and against a primary source once literature access
    is restored -- before any record leans on it. Until then every downstream
    claim inherits their unverified status and says so.
  - >-
    A REDUCTION IS NOT A RESULT UNTIL ITS QUANTIFIER ORDER IS FROZEN AND ITS
    TRIVIALITY IS ADDRESSED. Every reduction record here writes out its
    quantifier prefix explicitly, and separately answers the deflationary
    question: does this reduction move any cost, or does it restate the
    problem? A reduction whose only content is that ECDLP equals ECDLP is
    reported as such.
  - >-
    STANDING CONSTRAINTS OF GOAL-ENDO-001 BIND UNCHANGED. H-ENDO-001 is the
    admissibility filter and is not retested -- every endomorphism acts on the
    prime-order subgroup as a scalar, so a mechanism that only applies phi to
    points of G is inadmissible on its face. KN-FIND-b7e091's generic-group
    closure is BINDING and is extended, never revisited. H-STR-002 is
    `weakened` with DEFER-BATCH009-001 OPEN, so pause condition P2 fires on
    any result bearing on it in either direction. Pause condition P3 means a
    candidate appearing to exceed the automorphism-discounted rho baseline is
    FLAGGED AND STOPPED, never stated; sqrt(6) (KN-TECH-018) is baseline
    calibration and never an exponent.
  - >-
    CLAIM DISCIPLINE. claim_tier stays `toy` and sota_delta stays zero for
    every record under this question until and unless a Coordinator decision
    says otherwise on cited evidence. As an attack, everything here is
    dominated by parallel Pollard rho at 0.886*sqrt(N) group operations with
    O(1) memory.
  - >-
    THIS QUESTION DOES NOT REOPEN RQ-CLGP-b99df5. Lane L10's committed
    closures stand as recorded. What this question may do is establish that
    L10's stated OBSTRUCTION TEXT is wrong while its closures remain correct
    on other grounds -- a documentation repair, adjudicated by the Coordinator,
    not a reopening. Any record here that would reopen an L10 closure is routed
    to the Coordinator instead of filed.
