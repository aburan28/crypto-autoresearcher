  constraints:
    - >-
      NAMED INFRASTRUCTURE BLOCKER BLK-1, WHICH IS LOAD-BEARING FOR THIS QUESTION
      RATHER THAN HYPOTHETICAL, AND WHICH GATES THE PRIMARY SUCCESS MODE. The
      certificate vocabulary in docs/claims-and-verification.md admits only
      `discrete_log | decomposition | none`, and `check_run` in
      tools/validate_ledger.py errors on any other `kind`, so AN AES KEY-RECOVERY
      CERTIFICATE CANNOT CURRENTLY BE EMITTED BY A CONFORMING RUN RECORD. Under
      RQ-AES-002 that blocker gates an outcome the campaign does not expect to
      reach; HERE IT GATES THE OUTCOME THE CAMPAIGN IS BUILT TO PRODUCE. It must
      be resolved by a versioned protocol amendment adding a `key_recovery` kind
      — statement: key size, ROUND COUNT, the exact plaintext/ciphertext pairs,
      the recovered key; verifier: independent-recompute under pycryptodome and,
      where the round count admits it, the openssl CLI — together with the
      matching `check_run` change, AUTHORED, APPROVED AND COMMITTED BEFORE ANY
      CARD IS ISSUED THAT COULD PRODUCE A SOLVE. A gate uncommitted when the card
      is issued is the retroactive enforcement this program refuses. THE ROUND
      COUNT FIELD IS MANDATORY AND IS THIS QUESTION'S ADDITION: a key-recovery
      certificate that does not state r is transcribable as a full-round claim.
      NON-DUPLICATION RULING: GOAL-AES-002's next action already ranks an
      equivalent amendment first. BLK-1's resolution is a REPOSITORY-LEVEL change
      to shared files. Whichever campaign authors it first OWNS it; the other
      ADOPTS IT BY EXPLICIT REFERENCE and does not author a second amendment to
      the same clause. If GOAL-AES-002 has already committed one WITHOUT the
      round-count field, this question's amendment is a narrow ADDITIVE
      supersession of that clause alone, under a new id, never an edit.
      BLK-1 IS AN INFRASTRUCTURE BLOCKER, NEVER A NEGATIVE MATHEMATICAL RESULT
      (AGENTS.md rule 5).
    - >-
      COST MODEL CM-3 IS A HARD PRE-DISPATCH GATE. No cost claim may be
      dispatched until CM-3 exists as a committed, independently reviewed
      artifact fixing all seven elements (a)-(g) of claim_tier_ceiling R2. A
      margin computed before CM-3 is frozen is not evidence.
    - >-
      SPECIFICATION PINNING IS A HARD GATE, inherited from RQ-AES-001 and
      EXTENDED. The GOAL-AES-001 pure-Python harness satisfies it and is reused
      WITH its declared defect set attached. THE AES-NI C PATH IS A SECOND
      INSTRUMENT AND IS NOT YET PINNED: no measurement may be charged to it until
      its r-round outputs agree with the pinned harness across the full round
      range 3-7 and with FIPS-197 known-answer vectors at full round, with a
      machine-readable receipt. The 53 s / 2^32 sweep figure and the 7.555e7
      enc/s figure are measurements of a program whose round-count convention is
      declared but not re-verified.
    - >-
      MEASURED, NOT MODELLED. A completion criterion is satisfied only by an
      EXECUTED run with an instrumented counter, measured wall clock, MEASURED
      peak RSS, counted queries and a MEASURED success probability over declared
      independent seeds. A derived, extrapolated or modelled cost is an estimate,
      is labelled one, and satisfies nothing. THIS IS THE CONSTRAINT THE WHOLE
      QUESTION TURNS ON.
    - >-
      THE ATTACK CODE MAY NOT READ THE TARGET KEY, and the run wrapper must be
      able to demonstrate it. The target instance is generated by a separate
      process from a declared seed; the attack receives plaintext/ciphertext
      pairs or oracle access only; and the certificate is re-verified by code the
      attack does not share. A failed certificate invalidates the run as
      `invalid_measurement`, NEVER as a negative observation
      (docs/claims-and-verification.md).
    - >-
      NULL-OBJECT CONTROLS BEFORE BELIEF, WITH THE SIBLING NULL. Any claimed
      statistic is measured identically against a matched random permutation AND
      across increasing round counts. A quantity that fails to decay as rounds
      increase is the canonical artifact tell, not a finding. A null built by
      negating a SUFFICIENT hypothesis is not automatically discriminating
      (KN-FIND-028), and a control that discriminates without ISOLATING the
      property it names is not an instrument for that property — build the
      SIBLING null before believing the label (KN-FIND-029 practice rule 6;
      V-804-1, undischarged for three consecutive batches). A STATISTIC WITH NO
      POWER BY CONSTRUCTION IS THE FAILURE THIS CAMPAIGN HAS ALREADY MADE ONCE
      (R4(1)): every proposed statistic must be shown to separate a structured
      object from a structureless null of the same shape BEFORE it is used to
      close anything.
    - >-
      THE PRODUCER'S OWN FALSIFICATION GATE IS PRE-REGISTERED, with its
      predictions bound to a committed digest recorded in the results artifact
