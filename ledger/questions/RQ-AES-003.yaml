research_question:
  id: RQ-AES-003
  title: >-
    Can an attack on reduced-round AES be CONSTRUCTED, EXECUTED END TO END, and
    CERTIFIED in this repository at a stated round count r, with its cost
    MEASURED rather than modelled, so that it beats (i) the DEFINITIONAL
    exhaustive-key-search reference at that r, or (ii) a generic baseline this
    campaign itself implements and measures at the same r — or, for a
    distinguisher, so that it SURVIVES PAST THE ROUND COUNT AT WHICH THIS
    PROGRAM'S OWN MEASURED OBJECTS DIE, with a measured false-positive rate
    against a matched random-permutation control?

  # =====================================================================
  # WHY THIS RECORD EXISTS RATHER THAN AN EDIT TO RQ-AES-001, AND WHY IT IS
  # NOT A DUPLICATE OF IT. STATED FIRST BECAUSE IT IS THE LOAD-BEARING RULING.
  # =====================================================================
  relationship_to_RQ_AES_001: >-
    RQ-AES-001 ALREADY COVERS REDUCED-ROUND AES AT ROUNDS 3-7 AND THAT IS NOT
    IN DISPUTE. This record does NOT widen it, contradict it, relax it,
    reinterpret it or supersede it, and it does NOT duplicate it. The boundary
    is drawn on the DECISION TARGET and on the MODE OF WORK, not on the
    primitive or the round range, and it is drawn here so that no future batch
    has to guess.

    (i) RQ-AES-001 IS A SCREENING-AND-DERIVATION QUESTION ABOUT NAMED
    PROPAGATION OBJECTS. Its title asks "which named propagation object ...
    admits a certified distinguisher or key recovery whose end-to-end cost
    matches or beats A NAMED BASELINE MECHANISM at that same round count", and
    its enumerated objects are five propagation objects (integral /
    division-property set, key-schedule differential relation, Demirci-Selcuk
    matching object, partial-sum cost term, impossible-differential
    contradiction). Its methods are object-first ideation, the lossy-projection
    test, novelty screening, and matched-baseline accounting. Four batches under
    it (EV-AES-001..004) spent ZERO cryptanalytic compute on AES and produced no
    claim about AES at any round count.

    (ii) RQ-AES-003 IS AN EXECUTION-AND-CERTIFICATION QUESTION. Its unit of work
    is a WORKING ATTACK PROGRAM in this repository, run to completion against a
    target instance whose key the attack code does not hold, emitting a
    certificate an independent wrapper re-verifies, and reporting an INSTRUMENTED
    MEASURED cost. Its references are the three named in claim_tier_ceiling R1
    below, none of which is "a named baseline mechanism" in RQ-AES-001's sense
    and all of which are adjudicable inside this repository.

    (iii) THE REFERENCE IS THE REASON A SEPARATE QUESTION IS NECESSARY AND NOT
    MERELY TIDY. RQ-AES-001's decision target is bound to a comparison against a
    NAMED BASELINE MECHANISM whose figures are, in this environment,
    unverified-from-memory — the exact comparison DEC-20260731-011 STRUCK
    program-wide and DEC-20260731-031 ruling 3 ruled unadjudicable in BOTH
    directions. Answering the present directive requires REPLACING that
    reference with references this environment can adjudicate. Replacing the
    reference of a committed question under which four batches of reviewed
    evidence and two knowledge entries were produced is exactly the retroactive
    act DEC-20260731-031 refused when it opened RQ-AES-002 instead of widening
    RQ-AES-001. The same reasoning produces the same answer here, in the
    opposite direction of scope.

    (iv) NOTHING OF RQ-AES-001 IS TOUCHED. Its claim_tier_ceiling, scope,
    constraints, decision target, status and owner are unchanged. GOAL-AES-001
    is not paused, closed, superseded, re-scoped, re-budgeted or reprioritized,
    and its single next action — draft, commit and dispatch the BATCH-005 queue
    in the DEC-20260731-030 ranked shape — STANDS UNCHANGED AND IS NOT
    REORDERED, DEFERRED OR ABSORBED. EV-AES-001..004 keep their direction,
    strength, tier and scope. KN-FIND-028 and KN-FIND-029 are not re-read.

    (v) THE CLAIM-TIER CEILING IS ADOPTED FROM RQ-AES-001 VERBATIM AND IS NOT
    WEAKENED BY ONE WORD. See claim_tier_ceiling R7. This question is capable of
    producing a stronger EVIDENTIAL STATUS than RQ-AES-001 has produced, and it
    is INCAPABLE of producing a wider CLAIM. Those are different axes and the
    distinction is the entire design of this record.

  relationship_to_RQ_AES_002: >-
    RQ-AES-002 is the FULL-ROUND question and this is not it. Its
    non_completion_criteria (iii) already rules that a reduced-round result is
    NOT a full-round completion and "belongs to RQ-AES-001's ceiling and is
    cross-filed there". THAT ROUTING IS PRESERVED AND MADE OPERABLE: RQ-AES-003
    adopts RQ-AES-001's ceiling verbatim, so a reduced-round finding cross-filed
    "under RQ-AES-001's ceiling" may be filed under RQ-AES-003 without any
    change of ceiling. Where the finding is a SCREENING or DERIVATION result
    about a named propagation object it files under RQ-AES-001; where it is an
    EXECUTED, CERTIFIED, MEASURED result it files here. In particular the
    open direction the GOAL-AES-002 second ideation pass named as
    "(ii-sharpened) / open direction 4" — real-key-schedule versus
    independent-round-keys differential probability at r = 2,3,4, whose null is
    literally the Markov model and whose round-count decay check is built in —
    is an executable measurement and is admissible HERE.
    NO record under this question may assert anything about full-round AES.
    RQ-AES-002's claim_tier_ceiling R1-R7 are not inherited, not restated, and
    not needed: the reference machinery below is this question's own.

  scope:
    primitive: "AES (Rijndael, 128-bit block)"
    specification: >-
      FIPS-197, pinned OPERATIONALLY and not cited from a read document: the
      GOAL-AES-001 harness (aes_reduced.py, sha256
      2c76f3e5db83ec2500ce1010a392a135869d8b9dd1a534af817e06f15babb447) agrees
      with FIPS-197 known-answer vectors under BOTH pycryptodome and the openssl
      CLI, admitted by DEC-20260731-011 and re-verified in BATCH-002. IT IS
      REUSED WITH ITS DECLARED DEFECT SET ATTACHED AND NOT RESET: H-2, H-4
      (irreducible), ER-5, ER-7, ER-8, V-804-4, V-804-5 and the KN-FIND-029
      escape classes travel with it. The AES-NI C path
      (coordination/goals/GOAL-AES-002/integral_depth_probe.c, throughput_bench.c,
      gcc 13.3.0 -O3 -maes -msse4.1) is a SECOND instrument and MUST be pinned
      against the same FIPS-197 vectors before any measurement is charged to it;
      the round-count convention it uses ((r-1) x AESENC then AESENCLAST, final
      round without MixColumns) is the convention pinned in GOAL-AES-001
      BATCH-001 and must be re-verified, not assumed.
    key_sizes: [128, 192, 256]
    round_counts_in_scope: [3, 4, 5, 6, 7]
    round_counts_out_of_scope: >-
      Full-round AES-128/192/256 (10/12/14 rounds). NO result from this question
      may be phrased as a statement about full-round or deployed AES, regardless
      of outcome. A full-round question exists (RQ-AES-002) and this is not it.
    threat_model:
      in_scope_and_completing:
        - >-
          SINGLE-KEY. Known-plaintext, chosen-plaintext, chosen-ciphertext and
          adaptive access under ONE unknown fixed key, with the data charged in
          queries AND in kind. This is the only model in which a result can
          satisfy a completion criterion.
      in_scope_but_never_completing:
        - >-
          RELATED-KEY, KNOWN-KEY and CHOSEN-KEY / open-key. Admissible as objects
          of study only. The weaker threat model is named IN THE SAME SENTENCE as
          the result, everywhere the result appears — not in a footnote, an
          appendix or a later paragraph — and such a result NEVER satisfies a
          completion criterion.
      out_of_scope_entirely:
        - >-
          SIDE-CHANNEL, FAULT and IMPLEMENTATION attacks (cache timing, power,
          DFA, key-schedule fault injection). They can trivially beat a search
          reference while saying nothing about the cipher, which would make the
          decision target meaningless. Category error against this directive.
        - >-
          QUANTUM. No quantum resource exists here and R1's references are the
          CLASSICAL ones.
        - >-
          Attacks on AES-derived constructions (GCM, CTR nonce misuse,
          hash-mode collisions) rather than on the reduced-round block cipher.
    what_is_tracked: >-
      DELIBERATELY NOT PRE-ENUMERATED AS A CANDIDATE LIST, and that is a ruling
      rather than an omission — the same ruling RQ-AES-002 took and for the same
      reason: pre-populating candidates does the Idea Generator's job inline,
      which the Coordinator contract forbids, and biases the search toward the
      families this Coordinator happens to recall. What IS fixed here is the
      DELIVERABLE SHAPE: every candidate must name (a) the object it tracks, (b)
      the round count r at which it is claimed to work, (c) the reference from R1
      it is measured against, (d) its cheapest EXECUTABLE falsification gate and
      the measured cost of running that gate inside the envelope in R6, and (e)
      the certificate or the control it will emit. A candidate that cannot name
      (d) is OUT OF SCOPE FOR EXECUTION and is recorded as such rather than
      estimated (AGENTS.md rule 9).
    objects_declared_off_limits_as_the_primary_lens: >-
      The established single-key families, named so that a candidate arriving in
      new notation is recognised as a variant: differential and truncated
      differential; linear and multidimensional linear; integral / square /
      division property; impossible differential; meet-in-the-middle and
      Demirci-Selcuk; boomerang and retracing boomerang; biclique; algebraic
      (XSL-family) and Groebner; yoyo; mixture differential / exchange;
      subspace trail; partial sums as a cost reorganisation. THIS LIST IS
      RECALLED FROM MEMORY, IS UNVERIFIED, AND IS THEREFORE A SCREENING AID AND
      NEVER AN AUTHORITY: a candidate is not established as novel by failing to
      match it, and a candidate is not established as worthless by matching it.
      CRITICAL EXCEPTION, AND IT IS WHAT MAKES THIS QUESTION DIFFERENT FROM
      RQ-AES-001 AND RQ-AES-002: a KNOWN family is fully admissible here as the
      BASELINE ARM of a comparison under R1(ii) and as the IMPLEMENTATION TARGET
      of a first executed attack under R1(i). Under RQ-AES-001 a rediscovery is
      screened OUT as a non-candidate; under this question, BUILDING AND RUNNING
      A KNOWN ATTACK IS PRODUCTIVE WORK, because a baseline that is built and
      measured here is the only comparative reference this environment can
      adjudicate at all (DEC-20260731-031 ruling 6(iii)). The off-limits list
      binds the NOVEL arm, never the baseline arm.
    methods:
      - >-
        Attack CONSTRUCTION: implement the attack in this repository against the
        pinned harness, with a declared seed, a declared target instance, and the
        attack code structurally unable to read the target key.
      - >-
        EXECUTION to completion inside the measured envelope, with an
        instrumented operation counter, measured peak RSS, counted queries, and
        the success probability MEASURED over independent seeds — never assumed
        and never derived.
      - >-
        CERTIFICATION: an independently re-verified key-recovery certificate, or
        a distinguisher's measured false-positive rate against a matched
        random-permutation control at the same data complexity.
      - >-
        BASELINE CONSTRUCTION: a generic reference attack implemented and
        measured in this repository, with its parameters frozen before the
        candidate's cost is measured.
      - >-
        NULL-OBJECT CONTROLS BEFORE BELIEF, with the round-count decay check and
        the SIBLING-NULL discipline (KN-FIND-029 practice rule 6): a control that
        discriminates but does not ISOLATE the property it names is not an
        instrument for that property (V-804-1, undischarged for three batches).
      - >-
        The lossy-projection test (docs/inventor-protocol.md section 2) before
        any compute is requested for a NOVEL object; it costs nothing and it is
        the cheapest available answer to "is this actually new".

    # =================================================================
    # THE CENTRAL RULING OF THIS RECORD: WHAT COUNTS, AND AGAINST WHAT.
    # =================================================================
    claim_tier_ceiling: |
      R1. THE THREE ADJUDICABLE REFERENCES, AND THERE ARE EXACTLY THREE. Each is
      checkable INSIDE this repository with no primary source. No fourth
      reference exists for this question and none may be introduced without a
      versioned amendment.

        REF-A — THE DEFINITIONAL REFERENCE AT ROUND COUNT r. For a k-bit key,
        r-round AES-k, single-key, with enough known plaintext/ciphertext pairs
        to make the key unique, exhaustive key search costs 2^(k-1) r-ROUND
        AES-k evaluations in expectation and 2^k in the worst case, with
        negligible memory, about two known pairs, and success probability 1.
        That follows from the key length and the definition of the cipher and
        requires no document. NOTE THE ONE THING THAT DOES NOT CHANGE WITH r:
        THE KEY LENGTH. Reducing the round count reduces the cost of ONE trial,
        not the number of trials, so REF-A at r = 5 for AES-128 is 2^127 5-round
        encryptions. An executed attack beating it therefore beats it by a very
        large margin or not at all, and that is exactly why the comparison is
        decidable here despite a measured machine reach of 2^42.6.

        REF-B — A GENERIC BASELINE THIS CAMPAIGN IMPLEMENTS AND MEASURES ITSELF,
        AT THE SAME r, ON THE SAME MACHINE, IN THE SAME UNIT. This is the
        DEC-20260731-031 ruling 6(iii) route, which is merely conceivable at
        full round and is ACTUALLY AFFORDABLE at reduced rounds. IT ESTABLISHES A
        BASELINE THIS CAMPAIGN BUILT AND NOT THE PUBLISHED ONE, and every
        comparison against it says so in the same sentence.

        REF-C — THIS CAMPAIGN'S OWN MEASURED DEATH ROUNDS, for distinguishers.
        Not recalled, measured on this machine:
          * the raw 1-byte delta-set integral balance holds EXACTLY through 3
            rounds and is at the random null from round 4
            (MEAS-GOAL-AES-002-002, 40 trials/round, seed 20260801);
          * the FULL-DIAGONAL 2^32 delta-set integral holds EXACTLY through 4
            rounds (16/16 balanced, all-zero accumulator) and is DEAD at 5
            (0/16 for two independent keys, full-entropy accumulators)
            (MEAS-GOAL-AES-002-002 measurement_2, AES-NI, 53 s per sweep);
          * the key-indexed influence object is at the null from round 4 by
            per-cell BIAS (+43.84 sd from null at r=3), NOT from round 3 by
            support density — see the correction carried in R4 below;
          * CAND-FR-2 (linear-structure set) measured dead at rounds 2-4 for
            AES-128 and 3-5 for AES-256 at a 5-sigma floor of 2^-7.18 relative,
            N = 2^19 (RUN-FRGATES-20260801-001 / gate_results.json).
        A distinguisher surviving BEYOND these is a result AT THIS SCALE by this
        program's own measured standard, adjudicated with no literature.

      R2. THE COMPARISON IS ADJUDICABLE ONLY UNDER A FROZEN COST MODEL, AND THE
      MODEL IS PART OF THE RULING. Cost model CM-3 must be authored,
      independently reviewed and COMMITTED AS A FROZEN ARTIFACT BEFORE any cost
      claim under this question, and must fix all seven of:
        (a) UNIT — one r-round AES-k encryption of one block on the pinned
            FIPS-197-verified implementation, with the key schedule amortised or
            charged and which one stated. Attack work counted in S-box lookups,
            table accesses, XORs or "operations" is converted into this unit by a
            MEASURED conversion (the harness's own measured r-round throughput),
            or the comparison is void.
        (b) MEASURED, NOT MODELLED. THIS IS THE CLAUSE THAT DISTINGUISHES THIS
            QUESTION FROM EVERY PRIOR AES CAMPAIGN HERE. The attack's cost is
            taken from an INSTRUMENTED COUNTER IN THE EXECUTED RUN plus measured
            wall clock plus measured peak RSS. A cost figure that was computed
            rather than observed is an ESTIMATE, is labelled one, and does not
            satisfy any completion criterion. GOAL-AES-001's only cost model was
            voided by its first red-team pass (RT-1, RT-2, RT-3) precisely
            because every entry in it was modelled; peak RSS was NOT MEASURED
            there and every memory figure was therefore modelled. Not again.
        (c) SUCCESS CONVENTION — average-case (2^(k-1)) or worst-case (2^k),
            declared once and applied to BOTH sides. Mixing conventions
            manufactures a factor of 2.
        (d) SUCCESS PROBABILITY — MEASURED over a declared number of independent
            (key, plaintext-set, seed) instances; an attack succeeding with
            measured probability p is charged at cost/p. p is never assumed and
            never derived from the construction.
        (e) DATA — charged in queries and in kind (known / chosen plaintext /
            chosen ciphertext / adaptive), with REF-A's requirement of about two
            known pairs stated beside it. The comparison is a PARETO comparison
            across time, memory, data and success probability, never a scalar.
        (f) MEMORY — MEASURED peak RSS, stated always, beside time. A time-only
            comparison is incomplete and is rejected.
        (g) PRECOMPUTATION AND VERIFICATION — charged end to end, including the
            cost of confirming a candidate key and including any table build.
      A margin stated without CM-3 committed is not evidence; it is an
      unadjudicated number.

      R3. THE PUBLISHED STATE OF THE ART REMAINS UNADJUDICABLE HERE, AND
      DEC-20260731-031 RULING 3 IS CARRIED FORWARD BY REFERENCE IN FULL AND IN
      BOTH DIRECTIONS. No record under this question may say "this beats the
      published reduced-round frontier". EQUALLY AND WITH THE SAME FORCE, no
      record may say "this falls short of the published frontier", "this is only
      a rediscovery of the classical square attack", "this is not worth pursuing
      because the published 5-round and 6-round attacks are already better", or
      "our r=6 distinguisher is uninteresting because one is known". Using an
      unverified recollection to DISMISS is the same fabrication under AGENTS.md
      rule 9 as using it to PROMOTE, and it is additionally the premature-closure
      failure CLAUDE.md names as symmetric with overclaiming. A campaign that may
      not overclaim against the frontier also may not screen against it. THE ONE
      PLACE THIS BITES HARDEST HERE, NAMED SO IT IS NOT MISSED: an executed
      certified attack meeting REF-A at r = 4 or 5 is, on this Coordinator's
      UNVERIFIED recollection, very likely a rediscovery — AND THAT RECOLLECTION
      MAY NOT BE USED TO DOWNGRADE IT, ANY MORE THAN ITS ABSENCE COULD BE USED TO
      UPGRADE IT. The verdict on the reference is DETERMINATE; the verdict on
      novelty is INCONCLUSIVE; they are recorded separately and NEVER merged.

      R4. CORRECTIONS CARRIED FORWARD, SO THIS QUESTION DOES NOT INHERIT BROKEN
      REASONING. Three, each binding.
        (1) THE INFLUENCE-DENSITY CLOSURE IS WITHDRAWN AS STATED.
            MEAS-GOAL-AES-002-004 reported influence-support density 0.4996 at
            r = 3 and read it as the key-indexed object being dead at round 3.
            THE STATISTIC HAS NO POWER BY CONSTRUCTION: any function with
            balanced output bits has expected density exactly 1/2, and a PURE
            RANDOM FUNCTION with zero structure measures 0.4995 on the same
            probe. A CONTROLLED NULL WAS READ AS A CLOSURE. The object is dead
            ONE ROUND LATER (r = 4) and BY A DIFFERENT STATISTIC (per-cell bias,
            +43.84 sd from null at r = 3). Recorded in
            CORRECTION-influence-and-O3.json (MEAS-GOAL-AES-002-006); the
            original receipt is NOT edited. RESIDUAL HONESTY, WHICH BINDS EVERY
            DISTINGUISHER CLAIM UNDER THIS QUESTION: the bias probe resolves to
            ~2^-8.8 per cell while the relevant threshold is 2^-40, so "at the
            null" means "below an instrument about 30 bits too blunt". EVERY
            DISTINGUISHER CLAIM AND EVERY DEATH-ROUND CLAIM MUST STATE ITS
            INSTRUMENT'S RESOLUTION IN BITS IN THE SAME SENTENCE.
        (2) THE O-3 CEILING'S PREMISE IS MEASURABLY FALSE AND ITS CONCLUSION
            SURVIVES ON DIFFERENT, MEASURED GROUNDS. O-3 assumed at least one
            S-box per candidate; measured mu (distinct S-box computations per
            candidate over an affine master-key coset) FALLS 194.4 -> 125.2 ->
            12.3 at d = 4, 8, 12 against a pre-registered discriminator that it
            should RISE, and is analytically capped at 200 x 256 = 2^15.64 total,
            hence below 1 for every d > 15.64 (MEAS-GOAL-AES-002-006). THE
            CONCLUSION SURVIVES ON MEASURED GROUNDS: full 16-byte intermediate
            states are FULLY DISTINCT across the coset at every round 1-10 at
            d = 8 and d = 12 with zero collisions, so non-S-box work does not
            amortize (MEAS-GOAL-AES-002-007); and sharing exists ONLY at byte
            granularity — 1 column, 1 diagonal and 8 bytes are all fully distinct
            at every round — so no test on a projection wider than a byte can
            share work (MEAS-GOAL-AES-002-008). NO RECORD UNDER THIS QUESTION MAY
            CITE THE 7.64-BIT FIGURE AS THE JUSTIFICATION FOR THE BOUND. The
            bound may be cited only with its corrected mechanism, and only as
            measured on affine master-key cosets at d <= 12 with four fixed
            coordinate projections; other structured families and non-coordinate
            projections are UNMEASURED.
        (3) PROMOTION GATE (4)'s INDEPENDENT-CONFIRMATION HALF IS STRUCTURALLY
            UNSATISFIABLE UNDER THIS HARNESS and NO PROMOTION UNDER THIS QUESTION
            MAY REST ON IT. DEC-20260731-029 recorded it, DEC-20260731-030
            declined to re-scope it, and RT-13 is its origin. Under
            inference-amendment 0137a051 (commit
            0137a051eb5828789eb267fa83c8278086578d4c) every role resolves to one
            model, so a validator CONCUR plus a red-team CONCUR is ONE DRAW FROM
            A CORRELATED PAIR, NOT TWO. The gate is NOT re-scoped by this record
            — re-scoping a review requirement is a separate amendment on its own
            rationale — and the operative consequence is that MECHANICAL
            re-execution (recompute the digest, re-run the certificate verifier,
            re-derive the count) carries evidential weight here in a way
            JUDGEMENTAL concurrence does not.
      A FOURTH, RECORDED BECAUSE IT IS THIS COORDINATOR'S OWN AND WAS RAISED
      AGAINST THIS CAMPAIGN: RT-9's ruling that a pre-screen verdict of "no upper
      bound exhibited" REPORTS A FACT ABOUT THE PRODUCER UNDER A LABEL THAT IS A
      PREDICATE ON THE CANDIDATE — i.e. a fatigue report — binds every screen
      under this question. DEFERRED_UNBOUNDED is the correct verdict and it is
      KEPT OUT of any count of rulings (DEC-20260731-029 structural ruling).

      R5. THE ANTI-LAUNDERING CLAUSE, ADAPTED TO THIS QUESTION'S REFERENCES. Any
      record, anywhere, that states a margin MUST in the SAME SENTENCE (i) name
      which of REF-A / REF-B / REF-C it is measured against, (ii) name the round
      count r and key size k actually tested, and (iii) declare the
      published-state-of-the-art comparison UNADJUDICABLE in this environment.
      Transcribing a REF-A or REF-B margin as a published-frontier margin — in a
      headline, evidence record, decision, synthesis, status line,
      cross-reference, knowledge entry, PR title or commit message — is a
      CLAIM-TIER VIOLATION handled exactly as docs/claims-and-verification.md
      handles dropping a conditional qualifier. TRANSCRIBING A REDUCED-ROUND
      MARGIN AS A FULL-ROUND ONE IS THE SAME VIOLATION AND IS THE ONE THIS
      QUESTION IS MOST EXPOSED TO. Under docs/inventor-protocol.md section 5
      every deliverable sets `dominated_by` to
      "unresolvable in this environment: no primary source reachable; every
      recalled frontier row is unverified-from-memory" and NEVER to `null`, and
      `sota_delta` records the REF-A / REF-B / REF-C delta explicitly labelled as
      such, plus the word `unadjudicable` for the published frontier.

      R6. TIER CEILING PROPER — ADOPTED FROM RQ-AES-001 AND NOT WEAKENED.
        - `toy` TIER FOR EVERY EVIDENCE RECORD UNDER THIS QUESTION, without
          exception and regardless of outcome, exactly as RQ-AES-001 binds. A
          certified 5-round AES-128 key recovery is `toy`-tier evidence about
          5-round AES-128 and is NOT `crypto`-tier and is NOT a statement about
          AES. RQ-AES-002's single `crypto` gate is a FULL-ROUND gate and is NOT
          available here.
        - NO STATEMENT ABOUT FULL-ROUND OR DEPLOYED AES, ever, in any record,
          under any outcome.
        - NO UNIVERSAL IMPOSSIBILITY CLAIM. A closure is scoped to the named
          executed construction with a named obstruction
          (docs/inventor-protocol.md section 4); an exhausted candidate pool is a
          FATIGUE REPORT whose honest status is `unverified`.
        - WHAT THE CEILING DOES NOT CAP, AND THIS IS THE POINT OF THE QUESTION:
          the ceiling bounds WHAT MAY BE ASSERTED, not the EVIDENTIAL STATUS a
          hypothesis may reach. RQ-AES-002 caps every cost claim at `analyzed`
          because this environment cannot execute at the scale where a full-round
          cost claim would be tested (its R7, DEC-20260731-031 ruling 8). THAT
          CAP DOES NOT APPLY HERE AND THE REASON IS SPECIFIC: at r = 4-6 the
          attack RUNS, the recovered key is CHECKED against the target
          ciphertexts under an independent implementation, and the cost is
          MEASURED on the machine that ran it. A hypothesis under this question
          may therefore reach `replicated` and `supported`, scoped strictly to
          the tested rounds, key sizes, implementation, seeds and budget. A COST
          CLAIM THAT IS MODELLED RATHER THAN MEASURED IS STILL CAPPED AT
          `analyzed` HERE, and asymptotic-complexity claims still face all four
          promotion gates in agents/coordinator.md.
        - A DISTINGUISHER CLAIM requires its MEASURED false-positive rate against
          a matched random-permutation control AT THE SAME DATA COMPLEXITY, the
          round-count decay check, the instrument's RESOLUTION IN BITS, and a
          SIBLING NULL that isolates the property named.
        - A KEY-RECOVERY CLAIM requires a certificate in which the recovered key
          reproduces the EXACT target ciphertexts under an AES implementation
          INDEPENDENT OF THE ATTACK CODE, re-verified by the run wrapper and not
          by the attack code, at the same round count and under BOTH pycryptodome
          and the openssl CLI where the round count admits it. SEE THE BLOCKER IN
          constraints: THIS CANNOT CURRENTLY BE EMITTED BY A CONFORMING RUN
          RECORD.

  motivation: >-
    THE PRIOR IS AGAINST, AND IT IS STATED HERE RATHER THAN DISCOVERED LATER AS A
    DISAPPOINTMENT. Reduced-round AES is heavily studied and the 4-6 round
    frontier is a mature literature; the odds that this campaign produces a
    genuine improvement on it are low, and the odds that a first executed attack
    here is a rediscovery are high. Nothing about four cores, no GPU, no MILP or
    SAT solver, no numpy and no reachable literature makes this a better place to
    find a reduced-round improvement than the venues that have worked on it for
    two and a half decades.
    THE PRIOR IS NEVERTHELESS FAR BETTER THAN THE FULL-ROUND ONE, AND THE
    DIFFERENCE IS NOT RHETORICAL. Improvements at 5-7 rounds are still published;
    the round range is where structure demonstrably still exists rather than
    where it demonstrably does not; and — decisively — THIS ENVIRONMENT CAN
    ACTUALLY EXECUTE AND CERTIFY AT THESE ROUND COUNTS. The measured reach is
    2^38.8 AES evaluations in a single 1600 s producer task and 2^42.6 across a
    whole campaign budget (MEAS-GOAL-AES-002-001, 7.555e7 enc/s single core,
    gcc -O3 -maes), and a full-diagonal 2^32 integral sweep costs 53 s. That
    reach is 2^85 short of anything full-round and is COMFORTABLY SUFFICIENT to
    build, run and certify a 4-, 5- or 6-round key recovery.
    THAT IS WHY THIS QUESTION EXISTS AND WHY IT IS NOT GOAL-AES-002 AGAIN.
    GOAL-AES-002 is capped at `analyzed` FOREVER, by construction, because no
    full-round cost claim can be tested at 2^42.6 of reach. Here the ceiling
    lifts: an attack can be run end to end, its recovered key checked against
    target ciphertexts under an independent implementation, and its cost measured
    rather than modelled. This is the ONLY AES question in this program under
    which a hypothesis can honestly reach `supported`, and the completion
    criteria are written to demand exactly that and to accept nothing weaker.
    THE SECOND REASON, AND IT IS THIS PROGRAM'S OWN RECORD RATHER THAN A
    PRINCIPLE: GOAL-AES-001 has run FOUR BATCHES ON REDUCED-ROUND AES AND SPENT
    ZERO CRYPTANALYTIC COMPUTE ON AES ITSELF, producing derivations about a proof
    machine, a repaired mutation control, two knowledge entries about
    instruments, and NO CLAIM ABOUT AES AT ANY ROUND COUNT. That is not a
    criticism of that campaign, whose work is real and whose outcomes are
    honestly recorded; it is a diagnosis of a MODE. Screening and derivation
    without execution has been tried here at length. Building and running the
    attack has not been tried at all.
    PREMATURE CLOSURE REMAINS A FAILURE MODE SYMMETRIC WITH OVERCLAIMING
    (CLAUDE.md; docs/inventor-protocol.md section 4), and the incident that
    motivated the inventor protocol (KN-LIT-7594) is a model declining AES
    cryptanalysis on saturation grounds immediately before improving a best-known
    attack. "The 4-6 round space is mined" is a hypothesis about the search, and
    under section 4 its honest status is `unverified`. BOTH FACTS ARE HELD
    PROCEDURALLY, NOT RHETORICALLY: the off-limits list binds the novel arm while
    the baseline arm is deliberately built from known constructions; every
    reported signal faces a matched null and a sibling null before belief; every
    cost is measured rather than modelled; every solve carries an independently
    re-verified certificate; and the claim-tier ceiling makes this question
    STRUCTURALLY INCAPABLE of producing a statement about full-round or deployed
    AES even if it succeeds.

  decision_target: >-
    Whether any attack or distinguisher CONSTRUCTED AND EXECUTED in this
    repository at a round count r in 3-7 yields EITHER
    (a) a certified single-key key recovery whose MEASURED end-to-end cost under
    the committed CM-3 is strictly below REF-A at that r and key size, OR
    (b) a certified single-key key recovery whose MEASURED end-to-end cost is
    strictly below the MEASURED cost of REF-B — a generic baseline this campaign
    implemented, froze and ran itself at the same r on the same machine in the
    same unit, OR
    (c) a distinguisher surviving strictly beyond REF-C — this campaign's own
    measured death rounds — with a measured false-positive rate against a matched
    random-permutation control at the same data complexity, its instrument's
    resolution stated in bits, a round-count decay check, and a sibling null that
    isolates the property named, OR
    (d) failing all three, a scoped barrier statement at the
    docs/inventor-protocol.md section 4 standard about a NAMED CONSTRUCTION THAT
    WAS ACTUALLY BUILT AND RUN — named obstruction, checkable archived argument,
    and forward guidance naming what remains open.
    THE DECISION TARGET IS DELIBERATELY NOT "beats the published reduced-round
    cryptanalysis", because that comparison is not adjudicable in this
    environment in either direction; see claim_tier_ceiling R3.

