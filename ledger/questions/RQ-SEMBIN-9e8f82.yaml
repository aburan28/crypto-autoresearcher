research_question:
  id: RQ-SEMBIN-9e8f82
  title: >-
    Nagao 2015/984 claims that disjoint coset factor bases turn Semaev's
    subexponential chained-S_3 algorithm into a POLYNOMIAL one, O(n^{8w+1}) over
    F_{2^n}, and rests the whole claim on one proposition it states without
    proof: that the first-fall-degree bound d_F <= 4 survives the affine coset
    shift. Does it? And if it does, what does O(n^{8w+1}) cost at a curve
    anybody uses, once the o(1) the author calls HUGE is written down?
  scope:
    curve_families:
      - >-
        E/F_{2^n}: y^2 + xy = x^3 + A x^2 + B, with
        S_3(x_1,x_2,x_3) = (x_1x_2 + x_1x_3 + x_2x_3)^2 + x_1x_2x_3 + B --
        the same family and the same S_3 as KN-LIT-fa346d and Nagao's
        Definition 1, so the two papers' systems are comparable cell by cell
      - >-
        E/F_{p^n}: y^2 = x^3 + A_4 x + A_6 for fixed small odd p in {3, 5},
        n growing -- Nagao's Definition 1 second case, where his Proposition 2
        gives d_F <= 3p+1 rather than Semaev's 4. This is a NEARBY-OBJECT
        CONTROL for the characteristic-2 claims, not a separate target
    field_types:
      - binary extension fields F_{2^n}, Weil-descended to F_2 (Nagao Def. 3-4)
      - F_{p^n} for fixed small odd p, Weil-descended to F_p
    bit_sizes:
      - >-
        exact finite algebra: n <= 24 at m = t small, where a degree-4 Macaulay
        rank over GF(2) is computable in pure Python (the sizing in
        coordination/goals/GOAL-SEMBIN-5078bc/batches/BATCH-9d649f/coordinator-engine-sizing/
        and DEC-20260913-47bbb7 established the block shapes fit)
      - >-
        matched pairs at equal (n, m, k): the SAME system with v = 0 (Nagao
        EQS2) and with v_i != 0 (Nagao EQS4), since Proposition 5 is exactly the
        claim that these two have the same first fall degree
      - >-
        arithmetic only, no execution: n = 163, 233, 283, 409, 571 for any
        statement about what Theorem 1 costs at a standardised curve
    methods:
      - >-
        first-fall-degree and fake-first-fall-degree computation on the coset-
        shifted descent, from Nagao Definitions 5 and 6 -- which are DIFFERENT
        quantities, a distinction this program has not previously drawn
      - >-
        degree-4 Macaulay rank certificates over GF(2) on matched (v = 0,
        v != 0) pairs; no Groebner engine required, so this is not blocked by
        IMP-SEMBIN-ENGINE as narrowed by DEC-20260913-47bbb7
      - >-
        explicit constant-factor accounting for Theorem 1: write out every term
        Nagao's o(1) and O(.) absorb -- C_0, p^{C_0}/C_0, the linear-algebra
        constant w, the monomial count C(N+4,4) rather than N^4, the O(1) yield
        that is not 1 -- and tabulate against vOW parallel rho at FIPS labels
      - >-
        yield accounting for the disjoint construction: Nagao's own estimate
        prod_i #Fb_i ~ p^n ~ #E gives an expected solution count ~1, which is a
        constant success probability and NOT probability 1
  motivation: >-
    On 2026-09-13 this program's entry for Nagao ePrint 2015/984 was KN-LIT-456,
    which contained a title and the sentence "No abstract was extractable from
    the first two pages of the local PDF; contribution recorded from the title
    only." The paper was fetched and read (frozen at inputs/NAGAO-2015-984/,
    KN-LIT-71b758), and it is not a peripheral citation: it is a commentary on
    inputs/SEMAEV-2015-310/, the exact frozen source GOAL-SEMBIN-5078bc exists
    to audit, and it reaches a qualitatively stronger conclusion from the same
    assumption.

    Three things make this a research question rather than a reading note.

    FIRST, IT IS THE PRIOR ART FOR THIS PROGRAM'S OWN MECHANISM LANE. The
    mechanism lane's coset-typed-factor-base hypothesis -- disjoint cosets
    applied to Semaev's chained system to remove the m! yield factor -- is the
    composition Nagao published in 2015. His Section 7 states the mechanism, the
    m! removal, and the consequence, and its opening sentence credits the idea to
    his own 2013/548 while saying Galbraith-Gebregiyorgis 2014/806 "recently
    re-discovered it". Whatever that lane's novelty_status was, it now has to be
    stated against this record. That is not a reason to stop: Nagao's own
    execution of the idea has an unproven step at precisely the point this
    program was independently worried about.

    SECOND, THE UNPROVEN STEP IS THE ONE WORTH ATTACKING, AND IT IS CHEAP.
    Theorem 1 needs the first fall degree of the coset-shifted Weil descent
    EQS4 to stay <= 4 while the variable count grows to n(m-1) ~ n^2/C_0.
    Proposition 5 asserts this and omits the proof -- footnote 6, verbatim: "The
    situation is the same as the Semaev's case. So, we omit the proof." It is not
    obviously the same case. The shift makes the descent AFFINE rather than
    linear, which the paper's own footnote 1 half-acknowledges ("the values
    v_1,...,v_N must be needed"), and Semaev's Section 4.4 separately records
    that d_F4 generally exceeds 4 once k > ceil(n/m). Whether a degree bound is
    invariant under an affine change of variables is decidable on small matched
    pairs by degree-4 Macaulay rank, needs no Groebner engine, and answers a
    question this program's mechanism lane needs answered anyway. A NEGATIVE
    result here is as valuable as a positive one, because Theorem 1 has no other
    support.

    THIRD, THE PAPER ITSELF SAYS ITS CONSTANTS ARE BAD AND GIVES NO NUMBERS. In
    the author's own words and capitalisation (Section 6): "we adopt the easy and
    rough estimation ... Many complicated terms are included into the o(1) term
    and so for normal size input n, o(1) has HUGE value although
    lim_{n->infinity} o(1) = 0." Eight pages, zero tables, zero measurements.
    So "polynomial time algorithm" -- the author's own ePrint keyword -- is an
    asymptotic statement with no concrete content, and the question of what
    n^{8w+1} costs at B-283 or B-571 against van Oorschot-Wiener rho is
    unanswered and answerable by arithmetic alone. That arithmetic is the same
    machinery BATCH-9d649f already built and validated for Semaev's bound, so
    the marginal cost is low and the comparison is apples to apples.

    A fourth item is smaller but has a wide blast radius: Definitions 5 and 6
    separate the TRUE first fall degree from a "Fake first fall degree" taken
    modulo the field equations, and Nagao says plainly that "many researchers
    misunderstand the definition ... and use the FAKE version". This program
    measures a first-fall-degree quantity in GOAL-DREG-001 and cites Semaev's
    Assumption 1 throughout GOAL-SEMBIN-5078bc without ever distinguishing the
    two. Lemma 4 shows d_F <= d'_F, so the confusion is safe in the direction it
    is usually made -- but which quantity each of this program's records means is
    now a checkable question, and it has not been checked.
  decision_target: >-
    Whether the disjoint/coset construction is a live route to a better ECDLP
    exponent over F_{2^n} or an unsupported one, decided on (a) whether the
    degree-4 bound is affine-invariant on matched pairs at the largest n this
    program can compute exactly, and (b) whether Theorem 1's constant-explicit
    cost beats van Oorschot-Wiener at any FIPS binary label. Either answer
    redirects the mechanism lane: invariance holding makes the coset route the
    ranked successor to the chain-length lane closed by KN-FIND-9643e7, and
    invariance failing localises the defect in Nagao's Theorem 1 to a named
    proposition and turns the failure into the measured obstruction that lane
    needs.
  constraints:
    - >-
      NO CLAIM ABOUT ANY CURVE'S SECURITY, at any outcome. A polynomial
      asymptotic with unwritten constants is not an attack, and this program
      will not report one. Every conclusion is scoped to the tested n, m, k,
      characteristic and degree bound, and states its transfer assumptions.
    - >-
      Nagao's Theorem 1 is a POLYNOMIAL-TIME claim against a central hard
      problem. Any finding of this program that appears to CORROBORATE it is a
      claimed breakthrough under core rule 12 and requires independent
      review-breakthrough at max effort, which may not be degraded. A finding
      that FAILS to corroborate it is an ordinary scoped negative result and
      takes review-adversarial.
    - >-
      References [10] (Nagao ePrint 2013/548) and [11] (ePrint 2013/549) carry
      Lemma 3, Lemma 5 and the disjoint-factor-base priority claim, and neither
      is frozen in this repository. Their provenance is `recalled` and they may
      not support any decision until an agent reads them. In particular the
      priority question -- Nagao 2013/548 versus Galbraith-Gebregiyorgis
      2014/806 -- is NOT settled by this paper asserting it.
    - >-
      Concrete-cost work is arithmetic and is not blocked. Algebraic work is
      bounded by what pure Python can do over GF(2) at degree 4 (see
      DEC-20260913-47bbb7 and the sizing under BATCH-9d649f); an n it cannot
      reach is recorded as a scope limit, never as evidence about the bound.
    - >-
      A matched pair is the unit of evidence for affine invariance: the same
      (n, m, k) with v = 0 and with v_i != 0, same seeds, same monomial order,
      same rank routine. An unmatched comparison measures the implementation.
    - >-
      Every reported degree must say WHICH degree -- Nagao's Definition 5 true
      first fall degree, his Definition 6 fake one, Semaev's d_F4, or a Macaulay
      rank fall -- and a record that does not distinguish them is incomplete.
