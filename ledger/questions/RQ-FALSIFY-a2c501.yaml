research_question:
  id: RQ-FALSIFY-a2c501
  area: FALSIFY
  status: open
  owner: coordinator
  scope: >-
    The 58 records in knowledge/findings/, with priority on the 24 carrying
    proof_status: derivation and on any finding whose recorded confidence is
    `proved`, `established` or `proved_negative`. In scope: the correctness of
    what a finding asserts, whether its cited evidence measures the quantity it
    claims, and whether its stated confidence is supported by anything
    independent of the reasoning that produced it. Out of scope: generating new
    mathematical results, and any change to a finding's recorded status, which
    is Coordinator authority alone.
  title: >-
    Which knowledge-corpus findings fail when someone actively tries to break
    them, and which of the corpus's recorded confidence levels are supported by
    something other than the reasoning that produced them?
  added: '2026-08-08'

  framing: >-
    The corpus is treated here as a set of claims under suspicion, not as
    accumulated fact. The program's own contract already forbids assuming a
    result is true because it is recorded (AGENTS.md rules 4, 6, 10;
    docs/inventor-protocol.md "controls before belief"), but nothing in the
    harness has so far been pointed AT the corpus. This question points it
    there.

  motivating_observation: >-
    Of 58 records in knowledge/findings, 24 carry proof_status: derivation, and
    several of those carry confidence: proved with evidence_level: theorem. A
    derivation is an argument. No computer-algebra system is installed in this
    harness -- no sympy, numpy, scipy, sage, pari, cypari2, flint or galois --
    so no derivation-tier finding in this corpus has been checked by any
    process independent of the one that wrote it. Independence of review is
    recorded in the ledger, but independent REVIEW of an argument is not the
    same as independent EXECUTION of the arithmetic it asserts, and the corpus
    has had a great deal of the former and none of the latter.

  sub_questions:
    - id: SQ-1
      text: >-
        Do the corpus's universally quantified claims ("for EVERY curve", "no
        exceptional locus", "all six methods are closed") survive a direct
        counterexample search? Universal claims are the cheapest to refute:
        one witness suffices.
      status: partially_answered
      answered_by: [EV-FALSIFY-440677]
    - id: SQ-2
      text: >-
        Where a finding derives a quantity AND reports an empirical table
        confirming it, does the table actually measure the quantity derived?
      status: partially_answered
      answered_by: [EV-FALSIFY-2a5e46]
    - id: SQ-3
      text: >-
        Where a finding explains a residual by naming a mechanism, does a null
        object lacking that mechanism reproduce the residual?
      status: partially_answered
      answered_by: [EV-FALSIFY-2a5e46]
    - id: SQ-4
      text: >-
        Do toy-scale measurements presented with crypto-scale extrapolations
        survive variation of the parameter the extrapolation holds fixed?
      status: open
      planned_by: docs/falsification-program.md F-4
    - id: SQ-5
      text: >-
        Are the corpus's negative closures ("this lane is dead") supported by a
        named obstruction, or are they fatigue reports? The inventor protocol
        already says a screened-and-rejected count is `unverified`; that rule
        has not been applied to the standing closures themselves.
      status: open
      planned_by: docs/falsification-program.md F-6

  falsification_of_the_question_itself: >-
    This question would be answered NEGATIVELY -- that is, the corpus would be
    vindicated -- if a sustained adversarial program of the kind specified in
    docs/falsification-program.md ran to completion and found no defect beyond
    presentation-level ones. That is a real possible outcome and the first two
    probes already show it partially realised: KN-FIND-a1f3c2 survived a
    serious attempt to break it.

  anti_bias_note: >-
    A falsification program has its own failure mode, symmetric with the one it
    hunts: manufacturing refutations. RUN-FALSIFY-d770c1-001 recorded exactly
    that, and caught it only because every probe carries a null object. Any
    refutation produced under this question that is not accompanied by a passing
    null control is inadmissible, and is to be treated as a harness bug until
    shown otherwise.

  related:
    findings_under_test: [KN-FIND-a1f3c2, KN-FIND-c7d31e]
    experiments: [EXP-FALSIFY-d770c1]
    docs: [docs/falsification-program.md]
