research_question:
  id: RQ-SYMF-5ab172
  title: >-
    As of 2026-08-25, what are the Pareto-frontier cryptanalytic results for
    tier-1 hash functions, permutations, AES, and deployed block ciphers under
    exactly matched notions, models, round conventions, and cost axes?
  scope:
    primitive_classes: [hash_function, compression_function, cryptographic_permutation, block_cipher]
    result_kinds:
      - differential_trail
      - linear_trail
      - differential_linear_trail
      - boomerang_or_rectangle
      - impossible_differential
      - integral_or_division_property
      - zero_correlation
      - distinguisher
      - collision
      - chosen_prefix_collision
      - semi_free_start_collision
      - preimage
      - second_preimage
      - key_recovery
      - related_key_key_recovery
    cost_axes: [time, data, memory, preprocessing, queries, success_probability]
    as_of: '2026-08-25'
  motivation: >-
    The corpus has strong technique notes and several primitive-specific goals,
    but it does not have one normalized ledger against which a proposed attack
    can compute `sota_delta`.  A scalar such as "SHA-1 is about 2^61" is not a
    usable frontier unless the collision notion, cost unit, success probability,
    memory, and demonstration status are fixed.
  decision_target: >-
    Produce an authoritative baseline that lets the Coordinator select the
    narrowest high-value frontier row for improvement and reject comparisons
    that win only by changing the notion, attacker model, or hidden cost axis.
  constraints:
    - Primary sources first; secondary surveys locate sources but do not support authoritative rows.
    - Every citation uses recalled, retrieved, kb, or internal provenance exactly as AGENTS.md requires.
    - Author-reported and independently reproduced are separate verification states.
    - Full and reduced-round results, trails and end-to-end attacks, and single-key and related-key models never share a comparison key.
    - Unknown or unstated costs remain explicit nulls and prevent a dominance claim where the missing axis matters.
    - The MD5 collision-path content firewall of GOAL-MD5-001 binds every task and every retrieval route.
    - No cryptanalytic search or attack execution is authorized by this question.
  status: active
  owner: coordinator
