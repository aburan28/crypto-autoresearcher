research_question:
  id: RQ-UOV-001
  title: >-
    Is UOV's concrete security at its Round-3 parameters correctly
    modeled by the intersection-attack family, and do the compressed-key
    variants leave that model unchanged?
  scope:
    scheme: "UOV"
    family: "multivariate (foundational Unbalanced Oil and Vinegar)"
    assumption: >-
      oil-space recovery for a random UOV public map
    process_status: >-
      NIST Additional Digital Signatures, advanced to Round 3 on 2026-05-14;
      team tweaks due 2026-08-14. Round-3 specification not yet read by this
      program.
    targets:
      - >-
          the intersection attack and its solving-degree assumptions at
          Round-3 parameters
      - >-
          Kipnis-Shamir and reconciliation as cross-checks on the same
          parameters
      - >-
          seed-based / compressed public-key variants and any structure
          they expose
      - >-
          the calibration gap between measured toy solving degrees and
          the extrapolated model
    methods:
      - >-
          measured solving-degree census at toy (q, v, m), reusing this
          program's d_reg instrumentation
      - >-
          independent reimplementation of the intersection-attack
          complexity model
      - >-
          certified toy key recoveries anchoring the extrapolation at a
          real data point
      - >-
          explicit statement of every extrapolation assumption as a
          numbered heuristic
    claim_tier_ceiling: >-
      Toy-tier until a certified instance at or above the scheme's own
      parameter scale exists. AGENTS.md rule 7 applies: no toy-scale result is
      reported as a statement about deployed parameters.
  motivation: >-
    NIST advanced UOV as the foundational multivariate design, valued
    for extremely small signatures and fast verification despite very
    large public keys — and it is the reference against which MAYO,
    QR-UOV, and SNOVA must be measured. That makes the accuracy of the
    plain-UOV cost model a shared dependency of four Round-3 goals: if
    the intersection-attack model is off, every derived scheme's claimed
    margin moves with it. Two flanks matter. First, the model itself is
    an extrapolation from solving-degree behaviour, and this program has
    an unusually well-documented record of such extrapolations failing
    under measurement. Second, the seed-based key-compression variants
    trade public-key size for structure, and structure is what UOV
    attacks consume.
  decision_target: >-
    Whether the published plain-UOV security model is calibrated by
    measurement at its own parameters, and whether key compression
    changes it.
  provenance: >-
    Candidate list taken from the NIST announcement of 2026-05-14 that
    nine schemes advance to Round 3 of the Additional Digital Signatures
    process. csrc.nist.gov and nist.gov are unreachable from this
    harness's network policy (proxy CONNECT 403), so the roster and
    elimination list were confirmed from secondary reporting rather than
    read from the primary page; the Round-3 specification bundle (team
    tweaks due 2026-08-14) has NOT been read. Every per-scheme technical
    claim below is a research target to be verified against primary
    sources before any experiment is designed, not an established
    result.
  constraints:
    - >-
      Every per-scheme technical claim in this record is sourced from
      secondary reporting or from memory of the literature and is UNVERIFIED.
      No experiment may be designed until the relevant primary sources are
      filed as KN-LIT entries.
    - >-
      Matched-baseline discipline: no attack cost is reported without the
      best-known baseline at identical parameters, with memory, preprocessing,
      and verification charged.
    - >-
      Any claimed break carries a certificate (recovered key annihilates the
      public map, or a forged signature verifies) that the run wrapper
      re-verifies independently. See docs/claims-and-verification.md.
  status: active
  owner: coordinator
  created_at: '2026-07-29'
