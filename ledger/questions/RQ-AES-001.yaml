research_question:
  id: RQ-AES-001
  title: >-
    Which named propagation object inside reduced-round AES — a division
    property / integral set at a stated round count, a key-schedule
    differential relation, a Demirci-Selcuk meet-in-the-middle matching
    object, or a partial-sum key-guessing cost term — admits a certified
    distinguisher or key recovery whose end-to-end data/time/memory cost
    matches or beats a named baseline mechanism at that same round count?
  scope:
    primitive: "AES (Rijndael, 128-bit block)"
    specification: >-
      FIPS-197. The specification itself is NOT at research risk here: it is
      pinned locally by FIPS-197 known-answer test vectors reproduced under
      two independent implementations (pycryptodome and the openssl CLI). No
      network access to csrc.nist.gov is required or available.
    key_sizes: [128, 192, 256]
    round_counts_in_scope: [3, 4, 5, 6, 7]
    round_counts_out_of_scope: >-
      Full-round AES-128/192/256 (10/12/14 rounds). No result from this
      question may be phrased as a statement about full-round or deployed
      AES.
    objects:
      - >-
          integral / division-property set at a named round count: the exact
          set being tracked, the balanced coordinate claimed, and the round
          at which the property is asserted to die
      - >-
          the AES key schedule as a differential/algebraic object: which
          relation between subkey words is claimed, and which round pair it
          couples
      - >-
          the Demirci-Selcuk meet-in-the-middle matching object: the
          multiset/table being matched, its declared size, and the exact
          memory charged for it
      - >-
          the partial-sum cost term: which key-guess aggregation step is
          claimed to be reorganizable, and the exact operation count before
          and after
      - >-
          impossible-differential contradiction object: the exact pair of
          truncated differentials and the round at which they are claimed to
          be incompatible
    methods:
      - >-
          object-first ideation with mandatory deduplication against the
          known attack families (integral/square, impossible differential,
          meet-in-the-middle / Demirci-Selcuk, boomerang, biclique,
          division property)
      - >-
          the lossy-projection test (docs/inventor-protocol.md §2) applied
          before any compute is spent: a projection that discards nothing is
          a change of coordinates, not a new object
      - >-
          local reduced-round experimentation against a FIPS-197-pinned
          ground-truth AES implementation with parameterisable round count
          and deterministic seeds
      - >-
          null-object controls: every claimed distinguisher measured
          identically against a random permutation and/or AES with the
          exploited component randomized, before any positive claim
      - >-
          matched-baseline accounting: data, time, memory, and verification
          charged end to end at the same round count as the named baseline
    claim_tier_ceiling: >-
      Toy tier only, and reduced-round only. AGENTS.md rules 4 and 7 apply
      in full: no result from this question may be reported as a claim about
      full-round AES, about AES-NI-deployed AES, or about the security of
      any system that uses AES. A distinguisher claim requires its measured
      false-positive rate against a matched random-permutation control; a
      key-recovery claim requires a certificate in which the recovered key
      reproduces the target ciphertexts under an AES implementation
      independent of the attack code (docs/claims-and-verification.md).
  motivation: >-
    AES is the most-studied block cipher in existence, and the honest prior
    is overwhelmingly that this campaign finds no improvement: two and a
    half decades of concentrated public cryptanalysis have left full-round
    AES with no attack materially better than exhaustive search, and the
    reduced-round frontier has been stable for years. That prior is stated
    plainly here rather than discovered later as a disappointment. The
    campaign nevertheless proceeds because CLAUDE.md and
    docs/inventor-protocol.md treat premature closure — declining to search
    because a target looks saturated — as a failure mode symmetric with
    overclaiming, and because the specific historical incident that motivated
    the inventor protocol (KN-LIT-7594) was a model declining AES
    cryptanalysis on saturation grounds immediately before improving a
    best-known attack. The way to hold both facts at once is procedural, not
    rhetorical: a hard novelty-screening and matched-baseline gate, so that
    any candidate mechanism must survive deduplication against the known
    attack families and the lossy-projection test before it earns any
    compute, and a claim-tier ceiling that makes the campaign incapable of
    producing an overclaim about deployed AES even if it succeeds.
    A second, independent motivation: unlike this program's paused
    document-acquisition campaigns, AES needs no primary-source acquisition.
    Its specification is checkable locally against ground-truth test vectors,
    so the campaign is executable under the current network policy.
  decision_target: >-
    Whether any named reduced-round AES propagation object under this
    question yields a certified distinguisher or key recovery that matches or
    beats a named baseline mechanism at a stated round count and charged
    cost — or, failing that, a scoped barrier statement, with an archived
    derivation, naming why the specific object cannot yield the sought
    improvement and what remains open.
  provenance: >-
    No primary source was read for this record. csrc.nist.gov,
    eprint.iacr.org, arxiv.org, faest.info, and ietf.org are all unreachable
    under this harness's network policy (proxy CONNECT 403 / no route), this
    session's GitHub scope is bound to this repository only, and WebFetch of
    primary cryptographic sources fails; WebSearch returns secondary
    reporting only. Consequently: (a) the FIPS-197 specification is not
    cited from a read document — it is pinned operationally by locally
    reproducible known-answer vectors under two independent implementations,
    which is the only form of grounding this environment supports; and (b)
    every literature baseline number this campaign will compare against
    (biclique key recovery on full AES-128, impossible-differential and
    meet-in-the-middle results on 7-round AES, integral/square attacks on
    4-6 rounds, and the partial-sum technique) is RECALLED FROM MEMORY and
    is UNVERIFIED. Those recollections are working targets to be re-derived
    or re-sourced, never citations. This record contains no claim that a
    source was read.
  constraints:
    - >-
      Specification pinning is a hard gate: no cryptanalytic work may be
      dispatched until a locally verified AES ground-truth harness exists
      whose full-round outputs agree with FIPS-197 known-answer vectors under
      BOTH pycryptodome and the openssl CLI, with a machine-readable receipt.
    - >-
      Every literature baseline used for comparison is recorded as
      unverified-from-memory. It may be named as a target to beat, but any
      comparison against it must state in the same sentence that the baseline
      is unverified under this network policy. Citing a recalled number as if
      it had been read is a fabrication under AGENTS.md rule 9.
    - >-
      Novelty screening precedes compute: every candidate mechanism is
      deduplicated against the known attack families (integral/square,
      impossible differential, meet-in-the-middle / Demirci-Selcuk,
      boomerang, biclique, division property) and must pass the
      lossy-projection test before any experiment is approved. A candidate
      that is a renamed variant of a known family is recorded as a
      rediscovery, not as a candidate.
    - >-
      Null-object controls before belief: any proposed distinguisher is run
      against a control in which the structure it claims to exploit is
      absent (random permutation, or AES with the relevant component
      randomized), with the identical measurement, before any positive claim
      is recorded. A quantity that fails to decay as round count increases is
      treated as the canonical artifact tell, not as a finding.
    - >-
      Certificate discipline: a claimed key recovery must carry a
      certificate in which the recovered key reproduces the exact target
      ciphertexts under an independent AES implementation, re-verified by
      the run wrapper and not by the attack code; a claimed distinguisher
      must carry its measured false-positive rate against a matched
      random-permutation control. See docs/claims-and-verification.md.
    - >-
      Matched-baseline discipline: no attack cost is reported without the
      named baseline mechanism at the identical round count, with data,
      memory, precomputation, and verification charged end to end.
    - >-
      Scope ceiling: no record under this question asserts anything about
      full-round AES or about deployed AES security, regardless of outcome.
    - >-
      Local resource envelope: 4 CPU cores, 15 GB RAM, no GPU, no sage.
      gcc 13.3.0 with -maes, python3 with pycryptodome 3.23.0, and the
      openssl CLI are available. Any candidate whose cheapest falsification
      gate does not fit this envelope is out of scope for execution and must
      say so rather than being estimated.
  status: active
  owner: coordinator
  created_at: '2026-07-31'
