research_question:
  id: RQ-QLWE-1c4a3b
  title: >-
    What is the best currently known QUANTUM algorithm against each of plain
    LWE, Ring-LWE, and Module-LWE, stated at matched parameters under one
    declared quantum cost model — and of the standing polynomial-time quantum
    claims against the family, which survives a read of its own load-bearing
    step?
  scope:
    curve_families: []
    field_types:
      - >-
        plain (unstructured) LWE over Z_q — the null object of the family and
        the control against which any structure-exploiting mechanism is judged
      - >-
        Ring-LWE over R_q = Z_q[x]/(f), power-of-two cyclotomic and
        non-power-of-two / large-Galois-group ring shapes kept as separate
        cells, never merged
      - >-
        Module-LWE of rank k over a degree-d ring, with (k, d) tracked as two
        axes rather than collapsed into the single product kd
    bit_sizes:
      - >-
        Asymptotic regimes indexed by (n, q, alpha) with the normalisation
        convention for alpha written out per row; a row whose convention is
        unstated is not admissible
      - >-
        Concrete parameter sets are recorded ONLY as citation targets for
        published estimates. This question performs no attack and asserts no
        verdict at any deployed parameter set.
    methods:
      - >-
        Structured transcription of published quantum algorithms and quantum
        cost estimates against LWE/RLWE/MLWE from primary sources into one
        frozen comparison schema, in the discipline GOAL-SYMF-c00fa1 applies to
        symmetric primitives: comparison key fixed BEFORE any two rows are
        compared, and dominance checked only within an identical key.
      - >-
        Load-bearing-step adjudication of standing polynomial-time quantum
        claims against the family. Per KN-OPEN-8a5965's own "cheapest next
        step", the unit of work is one identified step, not a full re-derivation
        of a paper.
      - >-
        Explicit STRUCTURE-BLINDNESS classification of every admitted row: does
        the algorithm's claimed exponent depend on the ring or the module rank
        at all, or does it apply verbatim to plain LWE of the same total
        dimension? A row that is structure-blind is recorded as such.
    standing_claims_in_scope:
      - >-
        KN-OPEN-8a5965 Q1 — is Simon 2026 (KN-LIT-e204ab) correct? Q1 is
        EXPLICITLY OUT OF SCOPE for the two existing ledger hypotheses that
        touch this preprint (H-MLKEM-36f511 under RQ-QALG-457b41 evaluates its
        stated constants at ML-KEM parameters; H-MLKEM-7f3a2c under
        RQ-MLKEM-001 is a conditional reach map that grants Q1 without
        adjudicating it). No ledger record owns Q1. This question does. The
        open-problem entry already ranks six checkable sub-questions and names
        sub-question 1 (the signed-C_{z*} cancellation in Lemma 3) as "the
        entire game"; that ranking is inherited, not re-derived.
      - >-
        KN-LIT-1743 (Luo 2026, "Module Lattice Security (Part IV)") — a claimed
        probabilistic polynomial quantum attack on Module-LWE over 2-power
        cyclotomics via a tower decomposition of the Principal Ideal Problem,
        asserting ML-KEM, Falcon, Hawk, NTRU-HPS and NTRU-HRSS are broken at
        all standardized parameter sets. As of this question's creation NO
        ledger record references it at all: the entry was bulk-seeded on
        2026-07-24 from a local PDF's first two pages, is flagged in its own
        text as heuristically parsed and independently unverified, and has
        never been adjudicated by this program. Recording an unread claim of
        this magnitude and then never reading it is the failure mode this
        question exists to close.
      - >-
        Any successor claim of the same shape that appears while this question
        is open. The base rate is KN-LIT-52ce4c (Chen 2024): a credentialed
        author, a specific checkable algorithm, and a fatal defect in a single
        step found by readers within ten days. That precedent is the governing
        prior in BOTH directions — it is a reason to read the load-bearing step
        rather than to dismiss the claim, and a reason never to restate an
        unverified claim as fact.
    claim_tier_ceiling: >-
      LITERATURE AND DERIVATION ONLY. This question runs no attack, breaks
      nothing, and produces no cryptanalytic evidence. Its outputs are (i) a
      transcribed, provenance-tagged frontier of published quantum results
      against the three assumptions and (ii) per-claim adjudication verdicts
      about a named step of a named document. "Lemma 3's cancellation step is
      not established by the text as written" is admissible; "LWE is hard",
      "LWE is broken", and any verdict about a deployed parameter set are all
      inadmissible. A finding that a step does not go through refutes THAT
      DOCUMENT'S ARGUMENT, never the underlying possibility.
  motivation: >-
    A goal whose object is to DEVELOP a quantum algorithm cannot state a
    sota_delta until it knows, per assumption and under a matched cost model,
    what the current best quantum algorithm actually is — and the honest answer
    is likely to be uncomfortable and useful: that for all three assumptions the
    best known quantum attack is Grover- or quantum-walk-amplified classical
    lattice reduction whose exponent does not depend on the ring or the module
    rank at all. If that is what the transcription shows, then the entire
    published quantum frontier is structure-blind, and the structure lane
    (RQ-QLWE-9108dc) is searching genuinely open ground rather than re-treading
    someone's result. That is a precondition for honest work, not a survey for
    its own sake.
    The second half is a debt the corpus is already carrying. Three claims of
    polynomial-time quantum attacks reaching this family sit in the knowledge
    base in three different states — one retracted (KN-LIT-52ce4c), one recorded
    with a ranked list of checkable gaps and explicitly deferred (KN-OPEN-8a5965
    on KN-LIT-e204ab), one bulk-seeded from two pages and never read at all
    (KN-LIT-1743) — and no ledger record owns deciding any of them. The corpus
    rule that governs them, "record, do not re-plan", was the right posture on
    the day each was filed. It is not a permanent substitute for reading one
    step.
  decision_target: >-
    (1) A committed, schema-validated frontier of published quantum algorithms
    and quantum cost estimates against plain LWE, RLWE, and MLWE, every row
    carrying its comparison key, cost model, oracle/QRAM assumptions,
    normalisation convention, provenance, and a structure-blind / structure-
    dependent classification — so that any later proposal under GOAL-QLWE-291164
    has a real baseline to beat and cannot beat an unstated one.
    (2) Per standing claim, one of exactly three recorded verdicts on a NAMED
    step: the step is established as written; the step is not established as
    written (with the precise gap); or the step was not reached within the
    declared budget (a budget outcome, never a verdict — AGENTS.md rule 3).
  constraints:
    - >-
      No row enters the frontier from memory. A row is admissible only with
      provenance `retrieved`, `kb`, or `internal` and a verified citation; a
      `recalled` pointer may be listed as a research target and is never marked
      verified and never placed on the authoritative frontier.
    - >-
      Every row states its quantum cost model explicitly — gate count vs circuit
      depth vs T-count, QRAM/QRACM assumptions, and whether the quoted figure is
      an upper bound, a lower bound, or a heuristic estimate. Two rows with
      different cost models are INCOMPARABLE and are never collapsed into one
      number, in either direction.
    - >-
      Adjudication of a standing claim is scoped to a named step of a named
      document and produces a verdict about that step only. It never produces a
      verdict about the underlying problem's hardness, about any scheme, or
      about the author. A refutation and a confirmation are equally valuable
      outcomes and are recorded with equal care.
    - >-
      An unverified preprint is never restated as fact and never used to re-plan
      any goal's threat model, before or after adjudication, except through a
      committed Coordinator decision that cites the adjudication record.
      KN-OPEN-8a5965's "record, do not re-plan" stands until Q1 resolves under
      this question.
    - >-
      No conclusion, cost figure, or mechanism transfers from this question to
      RQ-QALG-457b41, RQ-QALG-122b59, RQ-QALG-74bf20, RQ-MLKEM-001,
      RQ-MLKEM-003, RQ-FRODO-*, or RQ-NTRU-9015ee, nor in the reverse direction.
      Where this question needs a quantum-sieve baseline number that
      RQ-QALG-457b41 owns, it CITES that record rather than re-deriving it.
    - >-
      Timeouts, retrieval failures, paywalls, and infrastructure faults are
      recorded as budget and access outcomes. "The primary source could not be
      obtained" is a coverage state, never evidence about a claim's correctness
      and never a licence to fall back on the abstract (AGENTS.md rules 3 and 5).
    - >-
      The corpus already contains at least one duplicated entry pair for this
      subject area (KN-LIT-7667 and KN-LIT-7c2620 record the same 2026 paper,
      "Careful with the Ring"). Duplicates are reported as disclosed corpus
      debt with exact IDs; entries are never overwritten or deleted, and a
      correction supersedes (AGENTS.md rule 2).
  provenance: >-
    The standing claims and their status are read from THIS REPOSITORY's own
    committed knowledge corpus on 2026-08-30, not from model memory:
    KN-LIT-52ce4c (Chen 2024, retraction relayed from search results, primary
    ePrint page not fetched — its own "Not verified here" section says so),
    KN-LIT-e204ab (Simon 2026, `citation_verified: read`,
    `source_freeze: SRC-DCP-SIMON-2026`), KN-OPEN-8a5965 (the six ranked
    sub-questions and the Q1/Q2 ordering), KN-LIT-1743 (Luo 2026,
    bulk-seeded 2026-07-24, self-flagged as heuristically parsed). The ledger
    ownership gap — that Q1 is out of scope for H-MLKEM-36f511 and
    H-MLKEM-7f3a2c, and that KN-LIT-1743 is referenced by no ledger record — was
    established by direct inspection of those records and a repository-wide
    search on the same date. Everything each cited entry itself marks unverified
    remains unverified here; recording a claim's existence is not endorsing it.
  status: active
  owner: coordinator
  created_at: '2026-08-30'
