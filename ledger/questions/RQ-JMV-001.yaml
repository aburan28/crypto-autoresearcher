research_question:
  id: RQ-JMV-001
  title: >-
    What are the concrete constants, and the concrete field-operation cost, of the
    Jao-Miller-Venkatesan (2005) GRH-conditional isogeny-expander random self-reduction
    for elliptic curve dlog, and is dlog cost actually constant within a level or only
    equal up to that reduction's overhead?
  scope:
    curve_families:
      - ordinary prime-field short-Weierstrass curves, horizontal l-isogeny graphs on a single level
      - NIST P-192/224/256/384/521, K-163/233/283/409/571, B-*, IPSec OG curves (arithmetic audit only)
    field_types: [prime field F_p]
    bit_sizes:
      - "toy: p ~ 2^20 (full level enumerable) for the cost-spread census"
      - "medium: q ~ 2^40..2^80 for the c_pi distribution study"
      - "crypto: named standards curves, arithmetic (conductor) audit only"
      - "analytic: q ~ 2^64..2^512 as parameters of a deterministic cost model, not as instances"
    methods:
      - exact 2-adic/l-adic valuation of d_pi = t^2 - 4q; partial and full factorization of d_pi
      - abelian Cayley graph on Cl(O) with prime-ideal generators of norm <= m; eigenvalues as Hecke character sums
      - random walks on Cl(O); total-variation and hitting-probability measurement
      - deterministic cost model: Prop 3.1 walk length x O(l^3) per-step modular-polynomial cost vs rho sqrt(n)
      - per-curve dlog cost proxies (fixed-partition Pollard rho iteration count; m=3 Semaev decomposition yield)
  motivation: >-
    JMV is the standard justification for selecting curves by order alone, but it is an
    asymptotic, GRH-conditional result whose implied constants are never computed. Three
    things are measurable without new mathematics and are absent from the literature:
    (G1) the empirical spectral gap and therefore the concrete cost, in field operations,
    of one random self-reduction at cryptographic sizes, versus the sqrt(n) cost of simply
    solving the instance; (G2) whether dlog cost is genuinely constant across a level or
    merely equal up to the reduction's polylog overhead, which the theorem does not settle;
    (G3) the cross-level case, which the paper explicitly does not cover. The program's
    end-to-end cost discipline has been applied to attacks but never to a reduction.
    Scouting (unreviewed) also indicates Figure 1 of the paper misreports c_pi for P-256.
  decision_target: >-
    Whether the JMV reduction is concretely, not merely asymptotically, cheap at
    cryptographic sizes; whether its proven eigenvalue separation is non-vacuous there;
    and whether any level-internal dlog cost spread exceeds measurement noise at toy scale.
  constraints:
    - No experiment under this question can produce an ECDLP attack or an attack-cost improvement.
    - GRH is assumed by the paper; nothing measured here confirms or disconfirms GRH.
    - Cost-model results are scoped to the stated model (Prop 3.1 walk length, O(l^3) per step), not to real attack cost.
    - Full c_pi for crypto-size curves requires factoring a ~q-sized integer; unresolved factorizations are reported as censored, never as c_pi = 1.
    - Level-census evidence is toy tier and says nothing about P-256.
  related_records:
    - RQ-ISO-001 / H-ISO-001 (rejected_scoped) / EV-ISO-001 - 3-neighbour PDP probe; EXP-JMV-006 is the full-level strengthening
    - ISOWALK-C1 (proposed, unscheduled) - asks whether the gap beats the birthday exponent; disjoint, would consume EXP-JMV-003's constant
    - EXP-ISADV-001 - planted-advice transfer across isogenous curves; no advice here
    - KN-TECH-024 / KN-TECH-029 / KN-OPEN-013 - supersingular F_{p^2}; JMV is ordinary prime-field
  knowledge_gap: >-
    JMV 2005 (arXiv:math/0411378) has no KN-LIT entry despite five other Jao papers in the
    corpus. Ingest via /curate-knowledge independently of whether these experiments run.
    Ingestion APPROVED under DEC-20260726-003 at the next free id (currently KN-LIT-082),
    subject to the four constraints in that record.
  status: active
  admitted_by: DEC-20260726-001
  goal_attachment: >-
    NONE. Standalone track. This question is explicitly NOT attached to GOAL-ECDLP-001
    (paused, three-batch campaign budget exhausted, next_action forbids activating attempts)
    and NOT attached to GOAL-CRYPTO-001. Reason is structural, not merely budgetary: this
    question's own constraints state that no experiment under it can produce an ECDLP attack
    or an attack-cost improvement, so it cannot in principle satisfy either goal's completion
    criteria. See DEC-20260726-001 rationale.
  track_budget:
    total_cpu_hours: 2
    maximum_runs: 10
    scope: EXP-JMV-001 plus EXP-JMV-004 branch (a) only; consumes no goal campaign budget.
  approved_experiments:
    - EXP-JMV-001 (hypothesis H-JMV-001; claim tier crypto; conditions C1-C2, D1-D3 of DEC-20260726-001)
    - EXP-JMV-004 branch (a) only (hypothesis H-JMV-002; analytic derivation, NOT crypto tier; conditions C1-C2, E1-E4 of DEC-20260726-001)
  unapproved_experiments:
    - EXP-JMV-002 (revise - sampling-measure confound plus literature gate; see DEC-20260726-002)
    - EXP-JMV-003 (revise - GRH-conditionality declaration, normalization, downscope to pilot; see DEC-20260726-002)
    - EXP-JMV-005 (revise - standalone Monte Carlo scope closed as dominated by exact Fourier computation; see DEC-20260726-002)
    - EXP-JMV-006 (revise and defer - partition-rule confound, level-completeness control, unstated power; see DEC-20260726-002)
    - EXP-JMV-007 (design only; not before the Coordinator; not approved by omission)
  owner: coordinator
