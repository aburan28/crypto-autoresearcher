research_question:
  id: RQ-SDITH-001
  title: >-
    Does the d-split / hypercube structure SDitH actually instantiates
    admit an information-set-decoding attack below the plain random-SD
    baseline at its parameter sets?
  scope:
    scheme: "SDitH"
    family: "code-based MPC-in-the-Head (Syndrome Decoding in the Head)"
    assumption: >-
      syndrome decoding for random linear codes (d-split variant)
    process_status: >-
      NIST Additional Digital Signatures, advanced to Round 3 on 2026-05-14;
      team tweaks due 2026-08-14. Round-3 specification not yet read by this
      program.
    targets:
      - >-
          the d-split syndrome-decoding instance as distinct from plain
          random SD
      - >-
          MPCitH/hypercube soundness and multi-round grinding cost
      - >-
          modern ISD (BJMM/MMT/May-Ozerov-style) with memory fully
          charged
      - >-
          the gap between asymptotic ISD exponents and concrete cost at
          SDitH sizes
    methods:
      - >-
          matched baseline: best concrete ISD cost at SDitH's (n, k, w),
          memory charged
      - >-
          structure-aware ISD variants exploiting the d-split
          decomposition
      - >-
          toy-scale decoding with a certificate (recovered error vector
          reproduces the syndrome)
      - >-
          explicit memory-access cost model, since ISD comparisons are
          routinely won by ignoring it
    claim_tier_ceiling: >-
      Toy-tier until a certified instance at or above the scheme's own
      parameter scale exists. AGENTS.md rule 7 applies: no toy-scale result is
      reported as a statement about deployed parameters.
  motivation: >-
    NIST advanced SDitH on the strength of its assumption — syndrome
    decoding for random linear codes is among the longest-studied hard
    problems in the field — while acknowledging relatively high
    computational cost and a complex design evolution. Conservative
    assumption plus complex instantiation is the classic place for a
    gap: the security claim is inherited from plain random SD, but the
    object the scheme hands the attacker is the d-split variant inside
    an MPCitH transform. The research question is whether the variant is
    still worth the plain-SD security estimate, measured against a
    properly charged modern ISD baseline (memory included, not just
    operation counts).
  decision_target: >-
    Whether SDitH's effective security equals the charged plain-SD ISD
    baseline, or the d-split structure lowers it.
  provenance: >-
    Candidate list taken from the NIST announcement of 2026-05-14 that
    nine schemes advance to Round 3 of the Additional Digital Signatures
    process. csrc.nist.gov and nist.gov are unreachable from this
    harness's network policy (proxy CONNECT 403), so the roster and
    elimination list were confirmed from secondary reporting rather than
    read from the primary page; the Round-3 specification bundle (team
    tweaks due 2026-08-14) has NOT been read. Every per-scheme technical
    claim below is a research target to be verified against primary
    sources before any experiment is designed, not an established
    result.
  constraints:
    - >-
      Every per-scheme technical claim in this record is sourced from
      secondary reporting or from memory of the literature and is UNVERIFIED.
      No experiment may be designed until the relevant primary sources are
      filed as KN-LIT entries.
    - >-
      Matched-baseline discipline: no attack cost is reported without the
      best-known baseline at identical parameters, with memory, preprocessing,
      and verification charged.
    - >-
      Any claimed break carries a certificate (recovered key annihilates the
      public map, or a forged signature verifies) that the run wrapper
      re-verifies independently. See docs/claims-and-verification.md.
  status: active
  owner: coordinator
  created_at: '2026-07-29'
