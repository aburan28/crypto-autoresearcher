research_question:
  id: RQ-ASCON-2dfd8b
  title: >-
    Ascon: the standardized algorithms are not the submission that was analysed
    for a decade — which published cryptanalysis actually transfers to SP
    800-232, and what covers the modes that were added at standardization?
  scope:
    scheme: "Ascon-AEAD128, Ascon-Hash256, Ascon-XOF128, Ascon-CXOF128 (NIST SP 800-232)"
    family: "sponge/duplex AEAD and hashing over the Ascon permutation"
    assumption: >-
      The confidence in Ascon is inherited from a competition: roughly a decade
      of third-party cryptanalysis against the SUBMITTED specification. The
      standardized specification differs from it — reported changes include a
      selected subset of schemes with new names and new IV constants, a switch
      to little-endian bit ordering, a permutation defined for more rounds, an
      increased round count between data blocks, and an entirely NEW customized
      XOF mode. Each published result applies to the standard only if the
      property it exploits survived those changes, and nobody in this program's
      corpus has checked that item by item.
    standardization_status: >-
      NIST SP 800-232, reported final on 2025-08-13, targeting constrained
      devices — the deployment setting where a later break is hardest to patch,
      because the devices are cheap, numerous, long-lived, and frequently not
      field-updatable.
    targets:
      - >-
          THE APPLICABILITY AUDIT, WHICH IS THE PRIMARY DELIVERABLE: build the
          table nobody has. One row per published cryptanalytic result against
          Ascon, one column per difference between the submission and SP
          800-232, and a determination per cell — does this result still apply,
          apply with modified constants, or not apply? THE ROWS THAT COME BACK
          "UNDETERMINED" ARE THE FINDING, because each is a piece of the
          standard's confidence that is currently carried rather than checked.
      - >-
          THE NEWEST SURFACE: the customized XOF was added at standardization
          and therefore has the least third-party analysis of anything in the
          standard. Its customization string must be domain-separated from
          message data totally. Enumerate that surface exhaustively within a
          declared class — the same finite audit RQ-BLAKE poses for tree-mode
          flags, in a setting where the mode is newer and the deployment target
          less patchable.
      - >-
          THE ROUND-COUNT QUESTION, POSED PRECISELY: the standard applies a
          reduced permutation between data blocks and the full permutation at
          initialization and finalization. Published attacks on the permutation
          reach some number of rounds; the operative question is not whether
          that number is below twelve but what it is relative to the REDUCED
          count actually applied between blocks, under the mode's own
          constraints on what an adversary can inject and observe.
      - >-
          THE DATA-LIMIT BOUNDARY: sponge AEAD security bounds degrade with data
          processed per key, and constrained devices are exactly where rekeying
          is least likely to be implemented correctly. State the bound, then
          state what it implies at realistic device lifetimes.
    methods:
      - >-
          Differential-and-of-record audit: each published result read from
          primary text, its exploited property named, and that property checked
          against the standardized specification directly rather than inferred
          from the paper's abstract.
      - >-
          Exhaustive enumeration of the customization-string and domain-
          separation surface within a declared class, with any unenumerated
          region named.
      - >-
          Automated characteristic search against the standardized permutation,
          using the instrument calibrated under RQ-MDFIVE, with encoding,
          solver, seed, and ceiling declared before the run.
      - >-
          Exact re-derivation of the mode's security bound at the standardized
          parameters, with constants tracked rather than asymptotic.
    claim_tier_ceiling: >-
      REDUCED-ROUND AND STRUCTURAL ONLY. No attack on the full standardized
      construction is in scope and none is claimed. THE APPLICABILITY AUDIT'S
      OUTPUT IS A STATEMENT ABOUT COVERAGE OF THE LITERATURE, NOT ABOUT
      SECURITY: "this program could not determine that result X transfers" means
      exactly that, and must never be written as "Ascon is weak in respect X".
      Symmetrically, a fully transferring table is not a security proof. If a
      domain-separation gap is found in the customized XOF it is disclosed to
      NIST and the designers before publication.
  motivation: >-
    Ascon is the newest fielded symmetric standard and the one whose deployment
    setting is least able to absorb a later break: constrained devices are
    cheap, numerous, long-lived and often not field-updatable, so the cost of
    finding a problem late is higher here than for any other primitive in this
    set. Against that, its confidence comes almost entirely from a competition
    process that analysed a DIFFERENT DOCUMENT. The changes made at
    standardization are individually reasonable and collectively unaudited with
    respect to the existing literature, and the resulting gap is invisible
    precisely because everyone can point to a decade of analysis. This is the
    program's recurring pattern — a quantity computed once and inherited ever
    since — in its most consequential current instance, and the audit that
    closes it is reading and enumeration rather than compute. The customized XOF
    sharpens it further: a mode added at the end of a process gets the scrutiny
    of neither the competition nor the years of follow-up work.
  decision_target: >-
    Which published Ascon cryptanalysis transfers to SP 800-232 item by item,
    what remains undetermined, and whether the customized XOF's domain
    separation is total within an enumerated class.
  provenance: >-
    OBTAINED BY WEB-SEARCH EXCERPT ON 2026-08-09, NOT FILED AS KN-LIT AND NOT
    READ IN PRIMARY TEXT BY THIS PROGRAM. RESEARCH TARGETS TO BE RE-READ, not
    facts on record here: NIST SP 800-232 reported final on 2025-08-13,
    specifying Ascon-AEAD128 (128-bit key, nonce and tag, with a reported
    optional nonce-masking variant supporting 256-bit keys), Ascon-Hash256,
    Ascon-XOF128 and Ascon-CXOF128, each at a reported 128-bit security
    strength; a core permutation applied with a reduced round count after each
    injected block and with twelve rounds at initialization and finalization,
    with the specification reported to define permutations up to sixteen rounds;
    and reported differences from the submission comprising a selected subset of
    schemes with new names and IV constants, a switch to little-endian bit
    order, an added customizable hash variant, and further implementation
    options. THE SUBMITTED SPECIFICATION IS REPORTED TO HAVE USED A SMALLER
    INTER-BLOCK ROUND COUNT THAN THE STANDARD, WHICH THIS PROGRAM HAS NOT
    CONFIRMED and which is a specific acquisition target because the direction
    of that change matters to the audit. Sources seen in excerpt only:
    nvlpubs.nist.gov SP 800-232 final and initial public draft,
    ascon.isec.tugraz.at, the round-1 and round-2 submission documents on
    csrc.nist.gov, and a 2026 NIST presentation on symmetric-key standards.
    Every figure above is UNVERIFIED.
  constraints:
    - >-
      No experiment may be designed until SP 800-232 and the submission
      specification are BOTH filed as KN-LIT entries at stated provenance
      levels. The applicability audit is a comparison of two documents and is
      meaningless with only one of them.
    - >-
      Implementations of every standardized algorithm must be pinned and
      validated against the standard's test vectors before any audit or search,
      INCLUDING the customized XOF and the little-endian convention, which is
      exactly where a subtly wrong implementation would manufacture a false
      finding.
    - >-
      Each audit cell records its determination and its EVIDENCE — the property
      the published result exploits and where the standardized specification
      preserves or breaks it. A cell marked "applies" without that chain is
      recorded as undetermined.
    - >-
      "Undetermined" is a first-class outcome and is never rounded to either
      "applies" or "does not apply" for tidiness. The undetermined rows are the
      deliverable.
    - >-
      A failed search is a BUDGET OUTCOME about a solver, never evidence of
      absence (AGENTS.md rule 3).
    - >-
      No attack on the full standardized construction is attempted or claimed,
      and nothing here may be reported as a statement about any deployed device.
      A domain-separation gap, if found, is disclosed before publication.
  status: active
  owner: coordinator
  created_at: '2026-08-09'
