research_question:
  id: RQ-MQOM-001
  title: >-
    Are MQOM's ROM/QROM soundness bounds tight at its parameter sets,
    and is the underlying random MQ instance solvable below claim by
    hybrid/crossbred/XL methods at those exact field sizes?
  scope:
    scheme: "MQOM"
    family: "MPC-in-the-Head (Threshold Computation in the Head) over the MQ problem"
    assumption: >-
      hardness of random multivariate quadratic systems over small
      fields
    process_status: >-
      NIST Additional Digital Signatures, advanced to Round 3 on 2026-05-14;
      team tweaks due 2026-08-14. Round-3 specification not yet read by this
      program.
    targets:
      - >-
          TCitH soundness error and the concrete multi-round forgery
          cost
      - >-
          ROM-to-QROM gap for the Fiat-Shamir instantiation
      - >-
          solving degree / first-fall degree of random MQ at MQOM's (q,
          n, m)
      - >-
          hybrid and crossbred trade-offs at small q, with memory
          charged
    methods:
      - >-
          re-derivation of the forgery bound from the Round-3
          specification
      - >-
          solving-degree census reusing this program's d_reg
          instrumentation
      - >-
          matched baseline: best published MQ solver complexity at
          identical (q, n, m)
      - >-
          toy-scale solves with a certificate (recovered assignment
          satisfies the system)
    claim_tier_ceiling: >-
      Toy-tier until a certified instance at or above the scheme's own
      parameter scale exists. AGENTS.md rule 7 applies: no toy-scale result is
      reported as a statement about deployed parameters.
  motivation: >-
    MQOM has the smallest combined public-key-plus-signature size in the
    MPCitH category at all three levels, and NIST's stated reservation
    is not the MQ assumption but the maturity of the ROM and QROM
    security proofs. That makes MQOM two research targets in one record:
    a proof target (is the soundness/forgery bound tight, and what does
    a multi-round grinding attacker actually pay?) and an algebraic
    target (is random MQ at MQOM's specific small fields as hard as the
    extrapolated model says?). The second connects directly to this
    program's existing degree-of-regularity instrumentation
    (RQ-DREG-001, EV-DREG-001..004): the same first-fall/solving-degree
    measurement machinery applies to MQOM's systems, and the program's
    own record of extrapolation failures applies as a warning.
  decision_target: >-
    Whether MQOM's claimed levels survive both a tight forgery-bound
    re-derivation and a measured (not extrapolated) MQ hardness
    calibration at its field sizes.
  provenance: >-
    Candidate list taken from the NIST announcement of 2026-05-14 that
    nine schemes advance to Round 3 of the Additional Digital Signatures
    process. csrc.nist.gov and nist.gov are unreachable from this
    harness's network policy (proxy CONNECT 403), so the roster and
    elimination list were confirmed from secondary reporting rather than
    read from the primary page; the Round-3 specification bundle (team
    tweaks due 2026-08-14) has NOT been read. Every per-scheme technical
    claim below is a research target to be verified against primary
    sources before any experiment is designed, not an established
    result.
  constraints:
    - >-
      Every per-scheme technical claim in this record is sourced from
      secondary reporting or from memory of the literature and is UNVERIFIED.
      No experiment may be designed until the relevant primary sources are
      filed as KN-LIT entries.
    - >-
      Matched-baseline discipline: no attack cost is reported without the
      best-known baseline at identical parameters, with memory, preprocessing,
      and verification charged.
    - >-
      Any claimed break carries a certificate (recovered key annihilates the
      public map, or a forged signature verifies) that the run wrapper
      re-verifies independently. See docs/claims-and-verification.md.
  status: active
  owner: coordinator
  created_at: '2026-07-29'
