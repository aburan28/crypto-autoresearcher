research_question:
  id: RQ-SHATWO-f196c7
  title: >-
    Reduced-round SHA-256: where exactly does the step-reduced attack frontier
    stall, and is the stall a property of the search instrument or of the
    message schedule's degrees of freedom?
  scope:
    scheme: "SHA-256 (FIPS 180-4; SHA-512 as the paired nearby-object control)"
    family: "Merkle-Damgard, Davies-Meyer compression, ARX + Boolean round function"
    assumption: >-
      Not a hardness assumption but an EMPIRICAL FRONTIER. Every statement of
      the form "SHA-256 has a large security margin" is a statement that the
      best published attack reaches s of 64 steps and no further. That number
      is inherited, and what stops it from moving is nowhere stated as a
      measurable quantity in this program's corpus.
    standardization_status: >-
      FIPS 180-4. The most widely deployed hash in the world, and the
      collision-resistance root of TLS certificate chains, code signing,
      Bitcoin, and HMAC-SHA-256. It is NOT on a migration path.
    targets:
      - >-
          EXACT BASELINE REPRODUCTION (KN-TECH-080 audit 1): re-derive and
          re-execute a published step-reduced SHA-256 collision as a literal
          message pair, verified by an independent FIPS 180-4 implementation.
          This program has never produced a certificate of this kind and does
          not know whether it can.
      - >-
          THE TRACKED OBJECT: the degrees-of-freedom versus conditions ledger.
          For each step count s, count (a) the free message-schedule bits
          usable by message modification in the covered rounds, and (b) the
          number of bit conditions the best characteristic found at s imposes
          outside that coverage. The frontier hypothesis is that the published
          stall is where (b) - (a) crosses zero. That difference is a
          COMPUTABLE INTEGER, not an estimate, and it is the exact bottleneck
          in the sense of docs/inventor-protocol.md section 8.
      - >-
          INSTRUMENT VERSUS OBJECT: determine whether the frontier is set by
          the search instrument (SAT/CP/MILP encoding, solver budget,
          characteristic search heuristics) or by the deficit above. These
          make DIFFERENT predictions: an instrument-limited frontier moves
          with solver budget and encoding; a deficit-limited one does not.
          Nobody in this program has run that discrimination.
      - >-
          THE FREE CONTROL: SHA-512 has the same structure with different word
          size, rotation constants, and round count. The published frontier
          gap between SHA-256 and SHA-512 is a nearby-object control the
          literature set up at no cost. A deficit model that explains one and
          not the other is caught before any claim is built on it.
    methods:
      - >-
          Automated differential-characteristic search over the step-reduced
          compression function, with the encoding, solver, seed, and budget
          all declared before the run, and negative search results reported as
          budget outcomes rather than as absence of characteristics
          (AGENTS.md rule 3).
      - >-
          Message-modification / neutral-bit accounting implemented as an
          explicit counter over the schedule, not inferred from attack prose.
      - >-
          Certificate-first execution: any claimed collision, semi-free-start
          collision, or preimage is emitted as the literal input pair or
          preimage and re-verified by a second independent implementation
          before it is recorded, per docs/claims-and-verification.md.
    claim_tier_ceiling: >-
      REDUCED-ROUND ONLY. NOTHING IN THIS QUESTION MAY BE READ AS A STATEMENT
      ABOUT FULL 64-STEP SHA-256, ABOUT HMAC-SHA-256, ABOUT ANY CERTIFICATE
      CHAIN, OR ABOUT BITCOIN. A collision on s steps is a collision on s
      steps. The deficit model, if it holds, predicts where the frontier is;
      a prediction is not an attack, and an extrapolation of the deficit curve
      to s = 64 is explicitly forbidden as a claim and admissible only as a
      clearly labelled conditional projection.
  motivation: >-
    This program has no symmetric-cryptanalysis lane at all, and SHA-256 is
    the primitive whose margin the largest number of deployed systems inherit
    without re-derivation. The lane is also, uniquely for this program, one
    where GROUND TRUTH IS COMPUTABLE AND CERTIFICATES ARE LITERAL: a collision
    is a pair of messages any reader can check in microseconds, which is the
    strongest claim tier this program can ever produce about anything. Against
    that, the ECDLP and lattice lanes deal only in extrapolation. The specific
    opportunity here is that the published margin is a NUMBER OF STEPS with no
    accompanying account of what stops it, while the quantity that plausibly
    does stop it — degrees of freedom against conditions — is a finite integer
    computation at the real parameter set. Under docs/inventor-protocol.md,
    "SHA-2 is thoroughly analysed" is a hypothesis about the search, and the
    honest test of it is to measure the bottleneck rather than to assume the
    frontier is where it is for a good reason.
  decision_target: >-
    Whether the published step-reduced SHA-256 frontier is instrument-limited
    or degrees-of-freedom-limited, backed by a reproduced certificate and a
    deficit ledger that also explains SHA-512.
  provenance: >-
    OBTAINED BY WEB-SEARCH EXCERPT ON 2026-08-09, NOT FILED AS KN-LIT AND NOT
    READ IN PRIMARY TEXT BY THIS PROGRAM. The following are RESEARCH TARGETS
    TO BE RE-READ, not facts on record here: semi-free-start collisions
    reported on the SHA-256 compression function up to 38 steps; a two-block
    31-step collision quoted at roughly 2^99.5 compression function
    evaluations built from a single semi-free-start collision; an early
    preimage attack on 24 of 64 steps attributed to Isobe and Shibutani; a
    2024 arXiv preprint on SHA-256 collision attacks using programmatic SAT;
    and 2021/2025 quantum semi-free-start work reaching 39 steps. Sources seen
    in excerpt only: eprint 2015/350, eprint 2021/292, arXiv 2406.20072, and
    a 2025 Quantum Information Processing article. EVERY STEP COUNT AND
    COMPLEXITY FIGURE ABOVE IS UNVERIFIED.
  constraints:
    - >-
      No experiment may be designed until the specific step-reduced attack
      this program intends to reproduce is filed as a KN-LIT entry at a stated
      provenance level, with its claimed step count, complexity, and
      certificate format taken from primary text.
    - >-
      A FIPS 180-4 ground-truth implementation must be pinned and validated
      against the published NIST test vectors before any characteristic search
      runs. An attack against a wrong SHA-256 is the cheapest way to waste a
      campaign, and the check costs seconds.
    - >-
      The search instrument used here is the same instrument RQ-SHATHREE,
      RQ-BLAKE, RQ-ASCON and RQ-SIMSPK depend on. It is calibrated first under
      RQ-MDFIVE, where ground truth is fully known and reachable, and this
      question does not re-derive that calibration.
    - >-
      A failed characteristic search is a BUDGET OUTCOME about a solver, never
      evidence that no characteristic exists (AGENTS.md rule 3). Records must
      state the encoding, solver version, seed, and wall-clock ceiling.
    - >-
      Every claimed collision carries the literal colliding pair and an
      independent re-verification. A complexity estimate without a certificate
      is not admissible above the tier that docs/claims-and-verification.md
      assigns to an unverified claim.
    - >-
      Nothing in this question may be reported as a statement about deployed
      SHA-256, HMAC-SHA-256, or any certificate chain.
  status: active
  owner: coordinator
  created_at: '2026-08-09'
