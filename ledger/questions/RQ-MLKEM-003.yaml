research_question:
  id: RQ-MLKEM-003
  title: >-
    How much of ML-KEM's claimed security margin is model rather than
    measurement — what is the gap between the core-SVP cost convention
    underpinning its parameter choice and the cost a real sieve pays at
    FIPS 203 dimensions, with memory and memory access charged?
  scope:
    scheme: "ML-KEM (FIPS 203, formerly CRYSTALS-Kyber)"
    family: "lattice KEM (module learning with errors)"
    assumption: >-
      module-LWE at the FIPS 203 parameter sets, plus the FO transform
    standardization_status: >-
      Finalized 2024-08-13 as FIPS 203. Deployed at scale; the most
      widely fielded PQC primitive.
    targets:
      - >-
          the core-SVP convention versus a memory-charged concrete sieve
          cost at ML-KEM dimensions
      - >-
          lattice-estimator reproducibility: does an independent run
          reproduce the submitted numbers
      - >-
          dual-attack and hybrid variants at these exact parameters,
          with all costs charged
      - >-
          decapsulation-failure and FO-transform assumptions as a
          separate flank from the lattice cost
    methods:
      - >-
          independent re-derivation of the parameter-set security
          estimates from primary text
      - >-
          measured sieve behaviour at reduced dimensions to calibrate,
          not replace, the model
      - >-
          explicit memory and memory-access cost model, stated as
          numbered assumptions
      - >-
          conditional extrapolation only; no toy dimension is reported
          as a statement about FIPS 203
    claim_tier_ceiling: >-
      Toy-tier until a certified instance at or above the standardized
      parameter scale exists. AGENTS.md rule 7 applies: no toy-scale result is
      reported as a statement about a standardized parameter set. A
      standardized algorithm makes this rule more binding, not less.
  motivation: >-
    This program already holds two ML-KEM goals, and both are defensive
    implementation work: GOAL-MLKEM-001 and GOAL-MLKEM-002 ask whether
    an incomplete re-encryption comparison class is isolated or systemic
    across optimized implementations. Neither touches the parameter
    question, and the parameter question is the one nobody re-derives:
    ML-KEM's category assignments rest on a core-SVP cost convention
    that deliberately ignores sieve memory, memory access cost, and
    lower-order terms, on the stated grounds that the omission is
    conservative. Whether it is conservative at FIPS 203's exact
    dimensions, and by how much in each direction, is a measurable
    question this program is unusually well set up to ask honestly — its
    entire documented failure history is partial wins that died once
    memory and preprocessing were charged. These are the algorithms
    already being deployed, so the cost of a wrong security estimate is
    different in kind from a Round-3 candidate's: migration schedules
    are being set against them (reported June 2026 US federal deadlines
    of 2030 for key establishment and 2031 for signatures — unverified
    here), and a parameter set that is standardized is a parameter set
    nobody will re-derive on their own.
  decision_target: >-
    Whether ML-KEM's claimed categories hold under a memory-charged
    concrete cost model, and in which direction the core-SVP convention
    errs at its actual dimensions.
  provenance: >-
    Algorithm roster taken from the NIST PQC standardization 'selected
    algorithms' page. csrc.nist.gov and nist.gov are unreachable from
    this harness's network policy (proxy CONNECT 403), so the roster and
    status dates were confirmed from secondary reporting rather than
    read from the primary page, and no FIPS text has been read by this
    program. Every per-algorithm technical claim below is a research
    target to be verified against the primary standard and against
    primary attack literature before any experiment is designed, not an
    established result.
  constraints:
    - >-
      Every per-algorithm technical claim in this record is sourced from
      secondary reporting or from memory of the literature and is UNVERIFIED.
      No experiment may be designed until the relevant primary sources are
      filed as KN-LIT entries.
    - >-
      Matched-baseline discipline: no attack cost is reported without the
      best-known baseline at identical parameters, with memory, preprocessing,
      and verification charged.
    - >-
      Any claimed break carries a certificate that the run wrapper re-verifies
      independently. See docs/claims-and-verification.md.
    - >-
      These algorithms are deployed or near-deployment. A claim about a
      standardized parameter set carries operational consequences, so no
      result leaves this program at a claim tier above the one its evidence
      supports, and no toy-scale finding is phrased as a statement about
      fielded systems.
  status: active
  owner: coordinator
  created_at: '2026-07-29'
