research_question:
  id: RQ-ARGON-141710
  title: >-
    Argon2's recommended parameters are chosen from a table whose safety
    argument is an asymptotic depth-robustness bound — what does the tradeoff
    attack actually cost at those exact parameters, and where is the frontier
    at which it stops helping?
  scope:
    scheme: "Argon2i, Argon2d and Argon2id at RFC 9106 recommended parameter sets; scrypt and bcrypt as nearby objects"
    family: "memory-hard functions; depth-robustness and time-memory (AT) tradeoff attacks"
    standardization_status: >-
      RECALLED, UNVERIFIED: RFC 9106 specifies Argon2 and gives recommended
      parameter sets; Argon2id is the common default in password-hashing
      guidance. Password hashing is one of the few cryptographic parameter
      choices routinely made by application developers from a published table.
    targets:
      - >-
        THE MEASURED AT-COST REDUCTION at the exact recommended parameter sets,
        not asymptotically: implement the ranking/tradeoff attack against the
        actual indexing functions and measure the achieved cost reduction as
        computation-memory pairs, with the machine model declared.
      - >-
        THE DIRECT GRAPH MEASUREMENT: the memory-access DAG for concrete (t, m,
        p) is a finite graph. Depth-robustness parameters can be measured on it
        directly rather than bounded asymptotically — attacker-relevant
        quantities such as the size of a depth-reducing set can be computed or
        tightly bounded for the actual graph the recommended parameters induce.
      - >-
        THE FRONTIER: the parameter region where the tradeoff stops paying,
        expressed as a boundary in (t, m, p), which is the practically useful
        output because it is stated in the same coordinates the RFC's table is.
      - >-
        THE DATA-DEPENDENCE COMPARISON: Argon2i (data-independent), Argon2d
        (data-dependent) and Argon2id (hybrid) sit at different points of the
        tradeoff-versus-side-channel exchange. Measure the tradeoff for each
        under one harness so the exchange is visible as numbers.
    methods:
      - Implementation of the published tradeoff/ranking attack against the real indexing functions, with declared seeds and machine model.
      - Direct construction and analysis of the memory-access DAG at the recommended parameters, with graph statistics computed exactly where feasible and bounded with declared method where not.
      - Cost reported always as a (computation, memory) pair, never as a single scalar, matching the AT metric the security argument uses.
    claim_tier_ceiling: >-
      MEASUREMENT CLAIMS ABOUT COST AT DECLARED PARAMETERS ONLY. No claim that
      any recommended parameter set is unsafe may be recorded, and no password,
      credential, corpus or third-party dataset is used anywhere. All inputs are
      synthetic.
  motivation: >-
    Password hashing is where cryptographic parameter selection is most often
    performed by non-specialists from a published table, and the table's
    justification is asymptotic while the choice is concrete. The published
    tradeoff attacks on the data-independent mode were significant enough to
    reshape the recommendation toward the hybrid mode, which makes the concrete
    cost at today's recommended parameters a directly deployment-relevant number
    that is not published in the coordinates practitioners use. The measurement
    is a finite graph computation plus an implemented attack: no new theory, and
    the deliverable is a boundary in the same coordinates as the RFC's table.
  decision_target: >-
    The measured AT-cost reduction achievable at the recommended parameter sets
    for each Argon2 variant, and the boundary in (t, m, p) beyond which the
    tradeoff no longer reduces cost.
  provenance: >-
    RECALLED FROM MODEL MEMORY ON 2026-08-09. NOT WEB-SEARCHED, NOT PRIMARY-READ,
    NOT FILED AS KN-LIT. Research targets: RFC 9106 (RECALLED as specifying
    Argon2 and giving recommended parameter sets), the Argon2 specification and
    Password Hashing Competition report, Alwen-Blocki on the tradeoff attack
    against data-independent memory-hard functions (RECALLED), Alwen-Blocki-Pietrzak
    on depth-robust graphs (RECALLED), and Percival's scrypt. All UNVERIFIED.
  constraints:
    - No measurement is recorded before RFC 9106 and at least one primary tradeoff-attack reference are filed as KN-LIT entries; the recommended parameter sets must be read, not recalled.
    - Every cost is reported as a (computation, memory) pair with the machine model, compiler and repetition count declared; a wall-clock number alone is not admissible.
    - No real password, credential, leaked corpus or third-party dataset is used at any point. All inputs are synthetic and generated in-run.
    - A tradeoff that fails to reduce cost within budget is a budget outcome about this implementation and is recorded as such, never as proof that no tradeoff exists (AGENTS.md rule 3).
    - No record may recommend or deprecate a parameter set for any deployment; the output is a measured boundary, and the choice belongs to whoever owns the threat model.
  status: active
  owner: coordinator
  created_at: '2026-08-09'
