research_question:
  id: RQ-FBG-001
  title: >-
    Does ANY structured factor-base geometry (high-bit intervals, small canonical
    height, mixed two-base, multiplicative cosets, greedy-optimized, asymmetric
    sizing) produce a decomposition yield whose advantage over a matched random
    base GROWS with N — an exponent-relevant channel rather than a constant?
  transcription:
    supersedes: RQ-FB3-001
    supersedes_path: ledger/RQ-FB3-001.yaml
    supersedes_sha256: 8d76123e8d8e779afc9810a4a79a299b558adb3d8d731495ebe9206d34c88aa8
    reason: >-
      ledger/RQ-FB3-001.yaml is not machine-parseable YAML (unquoted multi-line
      scalars containing colons inside list items), so no record can
      machine-reference it and the ledger validator cannot register its ID. Its
      ID also predates the current `RQ-[A-Z]+-NNN` format, which forbids a digit
      inside the area code. The frozen file is immutable and is NOT edited; this
      record is a faithful transcription in the current schema, created so that
      EV-FBG-001, DEC-20260724-007, and KN-FIND-001 can cite a resolvable ID.
    content_changes: >-
      None of substance. The title, scope, motivation, decision target, and
      constraints are carried over from the frozen record. No criterion, bound,
      or claim was added, removed, or relaxed in transcription.
    created_by: TASK-20260724-236
  scope:
    curve_families: ["generic prime-field curves E/F_p, >=4 curves"]
    field_types: [prime field F_p]
    bit_sizes: ["N ~ 2^14, 2^16, 2^18 (growth arm mandatory)"]
    methods:
      - m=3 decomposition counting per typed base, matched random base control
      - permutation null on the base labeling; single Holm family across all cells
  motivation: >-
    The F3 factor-base family (HYPOTHESES_100 H004, H018-H022) comprises six
    near-identical cheap cells, each a relabeling of the H016/H017-killed
    pattern. Run separately they would produce six isolated point estimates with
    family-wise multiple-comparison blindness; run as one battery with one Holm
    correction and a mandatory growth arm, they retire the family decisively.
    H016/H017 are included in the family accounting as already-run cells, not
    re-run.
  decision_target: >-
    Whether any structured base geometry shows a yield effect that grows with N
    (alive — feeds base selection for EXP-R6-001) or all effects are ~1 /
    constant-only (scoped kill of the F3 family as exponent-relevant).
  constraints:
    - One battery, one pre-registered cell list, one Holm-Bonferroni correction.
    - >-
      A win requires growth with N, not a constant yield ratio (the growth
      clause; H028 and H032 both died on exactly this clause).
    - Toy scale; AGENTS.md rule 7 applies.
  status: active
  owner: coordinator
