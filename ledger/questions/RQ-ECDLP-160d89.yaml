research_question:
  id: RQ-ECDLP-160d89
  title: >-
    Can a prime-order ECDLP four-list search admit a source-resolved,
    output-sensitive partial verifier that gives Wagner's N^(1/3+o(1))
    end-to-end cost without hiding pair enumeration, retries, or a DLP oracle?
  scope:
    groups:
      - prime-order subgroups of prime-field elliptic curves
      - prime cyclic groups as negative controls
      - XOR vector spaces as nearby positive controls only
    algorithm_family:
      - four-list generalized-birthday joins
      - source-labelled leaves aP+bQ
      - coordinate-derived approximate join keys
    claim_boundary: >-
      Static theorem and certificate architecture only. No implementation,
      experiment, curve generation, run, or ECDLP result is authorized.
  motivation: >-
    Existing records reduce the lane to a scalar pruning ratio, but equal
    pruning can hide either L^2 pair enumeration or insufficient collision
    concentration. The decision-relevant object is the complete join
    certificate: decomposability, output-sensitive enumeration, conditional
    collision entropy, source replay, success probability, retries, time, and
    memory.
  decision_target: >-
    Either state a certificate whose conditions genuinely imply a sub-rho
    end-to-end route and name the first condition not yet supplied by any
    coordinate projection, or falsify the proposed certificate family with a
    minimal counterexample. A negative result closes only that exact family.
  constraints:
    - No live keys, deployed targets, or secret data.
    - Pollard rho and BSGS remain mandatory Pareto controls.
    - A post-hoc predicate that requires examining all L squared pairs is not a join.
    - Source labels must be replayable to a final scalar relation without inversion.
    - An exact nontrivial quotient of a prime-order group may not be assumed.
    - A surviving sub-rho mechanism requires later review-breakthrough at max effort.
  status: active
  owner: coordinator
