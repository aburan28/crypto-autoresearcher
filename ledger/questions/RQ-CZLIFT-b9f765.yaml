research_question:
  id: RQ-CZLIFT-b9f765
  added: '2026-10-09'
  title: >-
    Characteristic-zero lifts of the prime-field ECDLP. Does any lift of
    (E, P, Q) from F_p to characteristic zero -- the p-adic lift E(Q_p) with a
    canonical point section, or a global lift to E(Q) or E(K) for a number
    field K -- turn the discrete logarithm into a linear (formal-group) or a
    small-height (Mordell-Weil) problem on a non-anomalous curve?
  scope:
    curve_families:
      - >-
        ordinary curves E/F_p with class-number-one CM (D in {-3, -7, -8, -11,
        -19, -43, -67, -163}), whose Serre-Tate canonical lift is an explicit
        integral model over Z; anomalous (#E = p) and non-anomalous reductions
      - random ordinary curves y^2 = x^3 + a x + b over F_p (no CM structure)
      - >-
        elliptic curves over Q of literature rank 0 to 7 (the minimal-conductor
        ladder 11a1, 37a1, 389a1, 5077a1, 234446a1, 19047851, 5187563742,
        382623908456) and their quadratic twists, as the global lifting
        targets
    field_types: [prime]
    bit_sizes:
      - 'toy: p below 2000 for the p-adic instruments, p below 20000 for reductions of global points'
    methods:
      - >-
        Smart's anomalous-curve attack (formal-group logarithm after
        multiplication by #E) and its lift-dependence on non-anomalous curves
      - the prime-to-p torsion section E(Q_p)[n] -> E(F_p)[n] as the canonical point section
      - >-
        Serre-Tate canonical lift of the curve (CM model) versus arbitrary
        Z_p-lifts, read through the valuation of the formal parameter of [p]P^
      - >-
        rational-point census of bounded naive height, reduction mod p, and
        the uniform-reduction coverage model (the Silverman-Suzuki /
        Huang-Kueh-Tan / xedni-calculus obstruction stated as a count)
  motivation: >-
    User hypothesis H2 (2026-10-09, verbatim in H-CZLIFT-889c9d,
    H-CZLIFT-6d4ed1 and H-CZLIFT-9a32e9): Smart's anomalous attack is the one
    lifting attack that works, because multiplication by p pushes everything
    into the formal group where the p-adic log is a homomorphism; for trace
    t != 1 the residue in E^ depends on the chosen lift and gives noise;
    Serre-Tate gives a canonical lift of the curve but no canonical lift of
    points; a computable canonical section of E(Q_p) -> E(F_p) would be a full
    break; lifting to E(Q) or E(K) fails for a different reason, namely rank
    is small and points of height <= H number about H^{r/2} while a random
    point's lift has height about log p. The ledger carries the p-adic
    coordinate-profile measurements H-ECDLP-a40416 and H-ECDLP-f1e714 and the
    xedni census GOAL-XEDN-001..003, but no record measures (i) the
    lift-dependence of Smart's residue against the Serre-Tate canonical lift,
    (ii) the torsion section as an explicit, computable canonical point
    section and what the formal logarithm does to it, or (iii) the coverage of
    E(F_p) by small global points against the uniform-reduction model. The
    sound verifier for all three is exact: every p-adic identity is checked at
    fixed precision by independent arithmetic, every rational point is
    verified on its curve, every count is re-derivable.
  decision_target: >-
    Either (a) the measured obstruction: on the canonical curve lift Smart's
    residue is degenerate for every point lift; the canonical point section
    exists, is computable in O(log n + k log p) curve additions, and kills the
    formal logarithm; every non-canonical section recovers d at the random
    rate 1/p; small global points cover E(F_p) no better than uniform
    reductions -- in which case the question closes negatively for the tested
    constructions and the exact obstructions are promoted as findings; or (b)
    a section family or a global point family whose success or coverage
    exceeds the random model with replicated significance, which triggers
    independent review and a scaling experiment before any claim. Toy-scale
    evidence authorizes scaling work only; nothing here bears on a deployed
    curve.
  constraints:
    - Every p-adic identity is checked by exact arithmetic at a stated precision; no floating point.
    - 'd = +-1 is excluded from every recovery test: negation-equivariant sections recover it by symmetry.'
    - Rank labels of global curves are recalled literature values and are consistency-checked by the measured growth exponent, never asserted.
    - A timeout or crash is an infrastructure outcome, never negative mathematical evidence.
    - Claim tier toy; no transfer to cryptographic sizes without a scaling experiment.
  related_questions: [RQ-ECDLP-002, RQ-XEDN-001]
  goal_ids: [GOAL-CZLIFT-1516d5]
  status: active
  owner: coordinator
