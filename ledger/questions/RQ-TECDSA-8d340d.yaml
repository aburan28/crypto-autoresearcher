research_question:
  id: RQ-TECDSA-8d340d
  title: >-
    Threshold ECDSA protocols have repeatedly leaked whole signing keys through
    omitted or mis-parameterized zero-knowledge proofs — reconstruct each
    published attack class as a certificate against a reference implementation,
    and map exactly which precondition each published fix removes.
  scope:
    scheme: "GG18/GG20-style and CGGMP-style threshold ECDSA over secp256k1 and NIST curves, at toy and standard parameters as separately declared"
    family: "multiparty ECDSA with Paillier or oblivious-transfer based multiplication; range proofs and modulus well-formedness proofs"
    standardization_status: >-
      RECALLED, UNVERIFIED: NIST has an active multi-party threshold
      cryptography effort; threshold ECDSA itself is deployed in custody and
      wallet infrastructure ahead of any standard, which is the usual and
      dangerous ordering.
    targets:
      - >-
        A KEY-EXTRACTION CERTIFICATE PER ATTACK CLASS: against a reference
        implementation with a switchable proof set, an actual recovered signing
        key, verified by producing a valid signature under the honest
        verification equation. One per published class (RECALLED: omitted or
        weak range proofs, unproven Paillier modulus well-formedness with small
        prime factors, and the class of attacks exploiting the interaction
        between the two).
      - >-
        THE SESSION-COUNT CURVE: how many signing sessions each attack needs as
        a function of the parameterization (bit-length of the range proof
        challenge, number of small factors, curve size). This is the quantity
        that decides whether a defect is exploitable in practice, and it is
        rarely published as a curve.
      - >-
        THE FIX MAP: for each published countermeasure, which precondition it
        removes, verified by re-running the corresponding attack against the
        fixed reference and recording the failure.
      - >-
        THE PROOF-SET COMPLETENESS QUESTION: whether the set of proofs in each
        published protocol version is sufficient for every one of the
        preconditions enumerated here, or whether an enumerated precondition
        has no corresponding proof.
    methods:
      - A reference implementation of each protocol shape with every zero-knowledge proof independently switchable and parameterizable.
      - Attack implementations that emit the recovered key and a signature under it as the certificate.
      - Toy-parameter sweeps to obtain curves, plus standard-parameter confirmation only where the attack completes within budget.
    claim_tier_ceiling: >-
      REFERENCE-IMPLEMENTATION CLAIMS ONLY. Every certificate is against this
      program's own implementation with a declared, deliberately chosen proof
      set. NO THIRD-PARTY WALLET, CUSTODIAN, LIBRARY, SERVICE OR CHAIN IS
      EXAMINED, PROBED, TESTED OR NAMED, and no record may assert that any
      deployed system has any of the properties studied here. All key material
      is self-generated.
  motivation: >-
    Threshold ECDSA is the clearest case in current deployment of protocols
    reaching production ahead of their standardization, with a history of
    complete key extraction from small omissions in an auxiliary proof. The
    published attacks share a structure — a proof that is present in the paper
    and optional, weakened, or mis-parameterized in an instantiation — and that
    structure is exactly what a switchable reference implementation makes
    enumerable. The deliverable is a fix map that does not exist in one place,
    built from certificates rather than from reading.
  decision_target: >-
    A certificate per published attack class against a reference implementation,
    the session-count curve for each, and a verified map from countermeasure to
    the precondition it removes.
  provenance: >-
    RECALLED FROM MODEL MEMORY ON 2026-08-09. NOT WEB-SEARCHED, NOT PRIMARY-READ,
    NOT FILED AS KN-LIT. Research targets: Gennaro-Goldfeder GG18 and GG20
    (RECALLED), Canetti-Gennaro-Goldfeder-Makriyannis-Peled CGGMP (RECALLED),
    the Tibouchi et al. line of attacks on threshold ECDSA implementations
    (RECALLED as including attacks exploiting range-proof and Paillier-modulus
    issues), and the NIST multi-party threshold cryptography project (RECALLED).
    Attack names, attributions and preconditions are UNVERIFIED and must be
    replaced by primary reads.
  constraints:
    - No attack is implemented before the corresponding protocol specification and attack paper are filed as KN-LIT entries; reconstructing an attack from memory is how a false precondition enters the fix map.
    - Every key-extraction certificate is verified by producing a valid signature under the recovered key, checked by an independent verifier.
    - All key material, sessions and transcripts are self-generated. No third-party system is contacted, probed, tested or named.
    - Every record states the exact proof set of the reference instantiation attacked; an attack against an unnamed instantiation is not admissible.
    - If any finding appears to affect a current published protocol version rather than a deliberately weakened instantiation, it is disclosed to the protocol authors before any publication and this precedence is recorded.
  status: active
  owner: coordinator
  created_at: '2026-08-09'
