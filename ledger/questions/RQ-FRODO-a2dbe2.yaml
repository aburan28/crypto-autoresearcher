research_question:
  id: RQ-FRODO-a2dbe2
  title: >-
    FrodoKEM's IND-CCA claim is produced by a Fujisaki-Okamoto reduction that
    consumes the decryption failure rate and the random-oracle query count as
    inputs. Taking the published failure rates as given, does the claimed
    category-level bit security survive the reduction being charged concretely
    — at the query, salt, and multi-user counts a deployment actually reaches?
  scope:
    scheme: "FrodoKEM (Frodo-640 / Frodo-976 / Frodo-1344), eFrodoKEM variants"
    family: >-
      unstructured (plain) LWE key encapsulation, IND-CCA via a
      Fujisaki-Okamoto transform with implicit rejection
    assumption: >-
      Plain LWE at Frodo's dimensions, taken as given and NOT re-estimated
      here, plus the concrete security statement layered on top of it: an
      IND-CCA bound obtained from an IND-CPA/OW-CPA bound by an FO-style
      transform whose loss depends on the number of hash queries, on the
      correctness error, and on whether the analysis is in the ROM or the
      QROM.
    standardization_status: >-
      Not a NIST selection. ISO/CFRG track: a standard proposal is published
      at frodokem.org and an IETF CFRG Internet-Draft exists
      (draft-longa-cfrg-frodokem). The 2025 proposal revision introduced a
      per-ciphertext salt, which changes the multi-target bookkeeping this
      question asks about. Status as described here is UNVERIFIED by this
      program; see provenance.
    targets:
      - >-
          The reduction ledger itself: state the FrodoKEM IND-CCA bound as an
          explicit inequality, with every additive and multiplicative term
          named, and identify which term dominates at each parameter set.
      - >-
          Query-count sensitivity. A ROM FO bound typically carries a factor
          linear in the number of hash queries and a QROM bound a square-root
          or quadratic loss; the question is what bit security the stated
          bound yields as the query budget is swept over the range a category
          claim is supposed to cover, and at what query count the claimed
          category floor is crossed, if it is.
      - >-
          The delta term. How the decryption failure rate enters the bound
          (additively, and multiplied by what), so that a discrepancy in the
          failure rate of a stated size can be converted into a bit-security
          movement. This is the seam with RQ-FRODO-3260cc and is the reason
          the two questions are worth holding separately: that question asks
          whether the number is right, this one asks what the number is worth.
      - >-
          Multi-user and multi-ciphertext amortization: whether the bound is
          stated per-key or per-target, what an attacker facing U users and C
          ciphertexts pays, and what the 2025 salt actually buys in that
          accounting.
      - >-
          Whether any step in the chain is non-tight in a way the published
          category assignment does not charge, stated as a named term rather
          than as a verdict.
    methods:
      - >-
          Transcription before analysis. Reproduce the bound as written in the
          primary text, with each symbol bound to its definition and each
          quantifier order recorded, before any number is substituted.
      - >-
          Exact evaluation of the stated inequality over a swept parameter
          grid (query count, user count, ciphertext count, failure rate),
          producing a table rather than a single figure, in exact or interval
          arithmetic so that a reported crossing point is not a rounding
          artifact.
      - >-
          Baseline reproduction control: recompute the published bit-security
          figure from the published bound at the published assumptions, and
          report agreement or disagreement, BEFORE reporting any swept
          result. A pipeline that cannot reproduce the paper's own number at
          the paper's own inputs cannot be trusted when it disagrees.
      - >-
          Nearby-object control: run the identical evaluation on a second
          FO-based lattice KEM whose bound and category assignment are
          published independently, to establish that the pipeline
          distinguishes schemes rather than reporting a fixed answer.
      - >-
          Mutation control: perturb one exponent in the transcribed bound and
          confirm the evaluation registers it, before any agreement is
          reported as a verification.
    claim_tier_ceiling: >-
      SPLIT, and the split is load-bearing. The BOOKKEEPING claim — that a
      published inequality, evaluated at stated inputs, does or does not yield
      the published bit-security figure, and where it crosses a threshold — is
      reachable at crypto tier, because it is finite arithmetic over a stated
      formula at the real parameter sets. Every claim ABOUT FRODOKEM'S ACTUAL
      SECURITY is bounded well below that: a loose reduction is not an attack,
      a crossed bound is not a break, and none of this is evidence about the
      hardness of LWE at Frodo's dimensions or about any concrete adversary.
      A proof-tightness observation constrains what the PROOF establishes, not
      what an attacker can do. A record that reports a bookkeeping result as a
      security result has failed regardless of the arithmetic.
  motivation: >-
    RQ-FRODO-3260cc takes FrodoKEM's two computed numbers and asks whether
    they reproduce. It deliberately stops there: it treats the security
    reading as out of reach and forbids itself from making one. But the
    numbers are not the end of the chain — they are inputs to a
    Fujisaki-Okamoto reduction that turns an IND-CPA statement into the
    IND-CCA claim the standard actually asserts, and that reduction is where a
    correct number can still buy less than the document implies. This is the
    least examined link precisely because it is a formula rather than a
    figure: nobody checks a printed inequality the way they might check a
    printed table entry, and the loss it carries is usually quoted as
    asymptotically-tight-enough rather than evaluated. Two further reasons to
    ask now rather than later. First, FrodoKEM is on a LIVE standardization
    track, and the 2025 proposal revision changed the multi-target picture by
    adding a per-ciphertext salt — so the bookkeeping question has a moving
    answer and a defect found now can still reach the text. Second, this is
    the same reachability argument that selected FrodoKEM in the first place:
    evaluating a stated inequality at the standardized parameters is finite
    work, so the program gets a crypto-tier arithmetic claim rather than a
    toy-scale one, on the one condition that it does not let the arithmetic
    claim be read as a security claim.
  provenance: >-
    NO PRIMARY SOURCE HAS BEEN ACQUIRED OR FILED FOR THIS QUESTION. It is
    formulated from the structure of FO-transform security arguments in
    general and from the same 2026-08-04 search excerpts recorded under
    RQ-FRODO-3260cc.provenance, which are visibly extraction-damaged. In
    particular: the existence of a per-ciphertext salt in the 2025 standard
    proposal, whether the published analysis is stated in the ROM, the QROM,
    or both, the form of the query-count loss, and whether the bound is
    per-key or multi-target are ALL UNVERIFIED RESEARCH TARGETS, not
    established facts. The corpus holds FrodoKEM material that is adjacent but
    not this: KN-LIT-2541 (anonymity of Round-3 KEMs, including FrodoKEM, in
    the QROM), KN-LIT-2088 and KN-LIT-3859 (implementation attacks on the FO
    equality test), KN-LIT-118 and KN-TECH-047 (hint-integrated primal
    attacks), KN-LIT-be0bfd (multiplication strategies). None of these states
    FrodoKEM's concrete IND-CCA bound. No figure appears in this record
    because none has been read; introducing one before filing would repeat the
    error RQ-FRODO-3260cc.constraints[0] exists to prevent.
  constraints:
    - >-
      NO EXPERIMENT MAY BE DESIGNED BEFORE THE PRIMARY SOURCES ARE FILED. The
      FrodoKEM specification's security-argument section and the primary
      FO-transform analyses it depends on must be acquired and filed as KN-LIT
      entries at stated provenance levels, with extraction damage marked, and
      the bound transcribed with every symbol defined and every quantifier
      order recorded. This is the GOAL-HQC-001 BATCH-001-to-BATCH-002
      sequence, whose lesson was that acquisition does not discharge filing.
    - >-
      THE HARDNESS LANE IS NOT THIS QUESTION'S. GOAL-MLKEM-003 and
      GOAL-MLKEM-004 own core-SVP conventions and memory-charged sieve cost.
      This question takes the IND-CPA/LWE hardness figure as a GIVEN INPUT to
      the reduction and re-estimates nothing; a batch deriving a sieve cost
      has left its lane and must hand off.
    - >-
      THE FAILURE-RATE VALUE IS NOT THIS QUESTION'S. RQ-FRODO-3260cc owns
      whether the published failure rate reproduces. This question treats it
      as a symbol, sweeps it, and reports sensitivity. It must not assert that
      a failure rate is wrong, and it must not assume it is right; both would
      poach a conclusion the other question is set up to earn.
    - >-
      A tightness gap is a statement about a PROOF, never about an attacker.
      No deliverable may describe a crossed bound, a non-tight step, or a
      query threshold as an attack, a break, a weakness of deployed
      FrodoKEM, or evidence that any parameter set should change, absent a
      charged concrete attacker cost and an independent review.
    - >-
      Baseline reproduction gates everything downstream. If the transcribed
      bound at the published inputs does not reproduce the published
      bit-security figure, that discrepancy is the result to report and to
      resolve; no swept table may be published on top of an unreproduced
      baseline.
    - >-
      AGENTS.md rule 7 separation. The implementation-side FrodoKEM results in
      the corpus (KN-LIT-2088, KN-LIT-3859, KN-LIT-118, KN-TECH-047) concern
      implementations of the FO transform, not the bound over it, and may not
      be scored as evidence here in either direction.
