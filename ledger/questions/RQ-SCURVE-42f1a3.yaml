research_question:
  id: RQ-SCURVE-42f1a3
  title: Can smooth principal CM relations expose a fully costed weakness in the P-192 isogeny class?
  scope:
    curve_families:
      - NIST P-192 / secp192r1 and curves reached by certified F_p-rational isogenies
    field_types:
      - prime field F_p
    bit_sizes:
      - 192
    methods:
      - deterministic centered principal-element norm sieve
      - one- and two-large-prime relation recombination
      - weighted relation-lattice reduction
      - explicit isogeny-map and subgroup-preservation replay
      - matched end-to-end ECDLP cost comparison
  motivation: >-
    A blind breadth-first isogeny walk spends its budget on nearby vertices and
    does not target cheap principal loops.  The proposed search instead scans
    canonical alpha=u+v*pi elements, uses the exact norm equation to find
    smooth or partial principal ideals, cancels large primes exactly, and asks
    whether any resulting loop is cheaper after every construction, transport,
    verification, and endpoint cost is charged.
  decision_target: >-
    Decide whether a certified non-scalar loop in the valid P-192 isogeny class
    yields a reproducible end-to-end advantage over a matched generic-rho
    baseline, or only a scoped no-weakness/incomplete result for the frozen
    boxes.
  constraints:
    - Public named-curve parameters, generated controls, and planted public points only; no live keys.
    - Algebraic relations are candidates, not weaknesses, until explicit maps and the prime-order subgroup transfer replay.
    - Deterministic search membership is independent of empirical timing weights.
    - Timeouts, unavailable maps, and solver exhaustion are incomplete outcomes, never evidence of strength.
    - The earlier archive experiment EXP-SCURVE-647ade is not extended, rerun, or reused as this experiment family.
  status: active
  owner: coordinator
