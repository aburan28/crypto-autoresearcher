research_question:
  id: RQ-SLHDSA-001
  title: >-
    Is SLH-DSA's security bound tight at FIPS 205 parameters — how much
    slack sits between the interleaved-target-subset-resilience proof
    and the best concrete multi-target attack, classically and quantumly
    — and does the stateless design's fault surface fall outside the
    model entirely?
  scope:
    scheme: "SLH-DSA (FIPS 205, formerly SPHINCS+)"
    family: "stateless hash-based signature"
    assumption: >-
      properties of the underlying hash function only (no structured
      algebraic assumption)
    standardization_status: >-
      Finalized 2024-08-13 as FIPS 205. The conservative fallback of the
      standardized set.
    targets:
      - >-
          tightness of the interleaved-target-subset-resilience bound at
          FIPS 205 parameters
      - >-
          concrete classical and quantum multi-target attack cost on the
          FORS layer
      - >-
          the quantum cost convention used for generic hash attacks, and
          its sensitivity
      - >-
          fault and memory-corruption chains against the stateless
          construction, as a separate claim class
    methods:
      - >-
          re-derivation of the security bound from primary text with
          every constant tracked
      - >-
          concrete multi-target attack cost model at reduced hash output
          sizes, certified
      - >-
          sensitivity analysis over the quantum cost convention rather
          than a single quoted number
      - >-
          explicit separation of assumption-level from deployment-level
          failure in every claim
    claim_tier_ceiling: >-
      Toy-tier until a certified instance at or above the standardized
      parameter scale exists. AGENTS.md rule 7 applies: no toy-scale result is
      reported as a statement about a standardized parameter set. A
      standardized algorithm makes this rule more binding, not less.
  motivation: >-
    SLH-DSA is the standardized set's insurance policy: if lattices
    fall, it is what remains, and its assumption is the one this program
    has the least reason to doubt. That makes the *bound*, not the
    assumption, the interesting object. The parameter sets are chosen
    against a multi-target security notion whose proof has known slack,
    and quantum generic attacks on the few-time-signature layer are
    costed by conventions that are themselves debatable. Meanwhile the
    practical record shows the real risk is elsewhere: reported work
    breaks SLH-DSA end-to-end with a Rowhammer framework, and 2026 work
    proposes scalable fault countermeasures trading memory against fault
    resilience — both attacking the stateless construction rather than
    the hash. A hash-based scheme that fails to a memory-fault chain is
    a failure of the deployment model, not of the assumption, and the
    two must not be reported in the same sentence. These are the
    algorithms already being deployed, so the cost of a wrong security
    estimate is different in kind from a Round-3 candidate's: migration
    schedules are being set against them (reported June 2026 US federal
    deadlines of 2030 for key establishment and 2031 for signatures —
    unverified here), and a parameter set that is standardized is a
    parameter set nobody will re-derive on their own.
  decision_target: >-
    How much slack sits between SLH-DSA's proof and the best concrete
    attack at each category, and whether any parameter set's margin is
    thinner than the headline suggests.
  provenance: >-
    Algorithm roster taken from the NIST PQC standardization 'selected
    algorithms' page. csrc.nist.gov and nist.gov are unreachable from
    this harness's network policy (proxy CONNECT 403), so the roster and
    status dates were confirmed from secondary reporting rather than
    read from the primary page, and no FIPS text has been read by this
    program. Every per-algorithm technical claim below is a research
    target to be verified against the primary standard and against
    primary attack literature before any experiment is designed, not an
    established result.
  constraints:
    - >-
      Every per-algorithm technical claim in this record is sourced from
      secondary reporting or from memory of the literature and is UNVERIFIED.
      No experiment may be designed until the relevant primary sources are
      filed as KN-LIT entries.
    - >-
      Matched-baseline discipline: no attack cost is reported without the
      best-known baseline at identical parameters, with memory, preprocessing,
      and verification charged.
    - >-
      Any claimed break carries a certificate that the run wrapper re-verifies
      independently. See docs/claims-and-verification.md.
    - >-
      These algorithms are deployed or near-deployment. A claim about a
      standardized parameter set carries operational consequences, so no
      result leaves this program at a claim tier above the one its evidence
      supports, and no toy-scale finding is phrased as a statement about
      fielded systems.
  status: active
  owner: coordinator
  created_at: '2026-07-29'
