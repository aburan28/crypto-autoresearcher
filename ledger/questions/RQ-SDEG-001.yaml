research_question:
  id: RQ-SDEG-001
  title: >-
    What is a certificate-backed toy-to-medium scaling law for Semaev S_3/S_4
    Groebner solving degree and charged decomposition cost over prime fields?
  scope:
    curve_families: [short_weierstrass generic ordinary]
    field_types: [prime]
    bit_sizes: [toy ladder first; medium only after G1 protocol approval]
    methods: [semaev_summation_polynomial, groebner_degree_profile, matched_pollard_rho_controls]
  motivation: >-
    KN-OPEN-002 and RQ-ECDLP-001 require a stable C_decomp(p,m) model before any
    end-to-end index-calculus exponent (GOAL-ICEX-001) can be honest. Prior
    Semaev toy work exists but is not yet bound to the Tier path full-cost contract.
  decision_target: >-
    Whether a frozen scaling protocol under the GOAL-ECDLP-001 certificate
    contract yields a scoped cost model with CIs suitable as the numerator of
    an IC-vs-rho comparison — without claiming asymptotic advantage.
  constraints:
    - No implementation or experiment until the protocol passes independent review.
    - Toy scale only in the first batch; AGENTS rules 6-7 apply.
    - Matched rho/BSGS controls and certificates are mandatory.
  status: active
  owner: coordinator
