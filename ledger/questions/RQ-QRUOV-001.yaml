research_question:
  id: RQ-QRUOV-001
  title: >-
    Is QR-UOV's roughly threefold public-key reduction paid for in
    security — does the quotient-ring structure admit an attack strictly
    cheaper than the known reduction to plain UOV over the extension
    field?
  scope:
    scheme: "QR-UOV"
    family: "multivariate (Unbalanced Oil and Vinegar over a quotient ring)"
    assumption: >-
      UOV oil-space recovery for keys carrying quotient-ring structure
    process_status: >-
      NIST Additional Digital Signatures, advanced to Round 3 on 2026-05-14;
      team tweaks due 2026-08-14. Round-3 specification not yet read by this
      program.
    targets:
      - >-
          the descent/lift between QR-UOV keys and plain UOV over
          F_{q^ell}
      - >-
          dependence of security on the quotient polynomial's
          factorization type
      - >-
          rectangular MinRank and its structure-aware refinements
      - >-
          whether any weak-quotient-polynomial family exists, and its
          density
    methods:
      - >-
          explicit cost model for the extension-field reduction as the
          matched baseline
      - >-
          structure-aware attack search at toy (q, v, m, ell) with
          certified recoveries
      - >-
          sweep over quotient polynomial factorization types, including
          the reducible case
      - >-
          conditional extrapolation with every model assumption numbered
    claim_tier_ceiling: >-
      Toy-tier until a certified instance at or above the scheme's own
      parameter scale exists. AGENTS.md rule 7 applies: no toy-scale result is
      reported as a statement about deployed parameters.
  motivation: >-
    QR-UOV solves UOV's one real engineering weakness — hundreds of
    kilobytes of public key — by representing the key as block matrices
    whose entries are polynomials in a quotient ring, and its own
    specification already acknowledges the central question by
    discussing the reduction of QR-UOV keys to plain UOV over an
    extension field, the role of the quotient polynomial's
    irreducibility, and the applicability of rectangular MinRank
    attacks. The structure that buys the compression is exactly the
    structure an attacker gets for free. The honest object is the gap
    between the extension-field-UOV cost and the best structure-aware
    cost, as a function of (q, v, m, ell) and the choice of quotient
    polynomial.
  decision_target: >-
    Whether QR-UOV's effective security equals the extension-field-UOV
    baseline at its parameters, or the quotient-ring representation
    leaks a cheaper key-recovery route.
  provenance: >-
    Candidate list taken from the NIST announcement of 2026-05-14 that
    nine schemes advance to Round 3 of the Additional Digital Signatures
    process. csrc.nist.gov and nist.gov are unreachable from this
    harness's network policy (proxy CONNECT 403), so the roster and
    elimination list were confirmed from secondary reporting rather than
    read from the primary page; the Round-3 specification bundle (team
    tweaks due 2026-08-14) has NOT been read. Every per-scheme technical
    claim below is a research target to be verified against primary
    sources before any experiment is designed, not an established
    result.
  constraints:
    - >-
      Every per-scheme technical claim in this record is sourced from
      secondary reporting or from memory of the literature and is UNVERIFIED.
      No experiment may be designed until the relevant primary sources are
      filed as KN-LIT entries.
    - >-
      Matched-baseline discipline: no attack cost is reported without the
      best-known baseline at identical parameters, with memory, preprocessing,
      and verification charged.
    - >-
      Any claimed break carries a certificate (recovered key annihilates the
      public map, or a forged signature verifies) that the run wrapper
      re-verifies independently. See docs/claims-and-verification.md.
  status: active
  owner: coordinator
  created_at: '2026-07-29'
