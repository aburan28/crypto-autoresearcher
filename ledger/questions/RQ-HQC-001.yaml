research_question:
  id: RQ-HQC-001
  title: >-
    Is HQC's decoding-failure-rate model — the analytic claim its
    IND-CCA security rests on — correct at its selected parameters under
    independent measurement, and what is the memory-charged concrete ISD
    cost at those parameters?
  scope:
    scheme: "HQC"
    family: "code-based KEM (quasi-cyclic Hamming, concatenated Reed-Muller / Reed-Solomon decoder)"
    assumption: >-
      quasi-cyclic syndrome decoding, plus a decoding-failure-rate model
      underpinning IND-CCA
    standardization_status: >-
      Selected 2025 as the code-based backup KEM alongside ML-KEM; the
      standard is not yet published as of this record. Like FN-DSA, it
      has a live pre-standardization window.
    targets:
      - >-
          the analytic DFR model for the concatenated RM/RS decoder
          versus measured failure rates
      - >-
          sensitivity of the IND-CCA argument to a DFR that is wrong by
          k orders of magnitude
      - >-
          memory-charged concrete ISD cost at HQC's selected parameters
      - >-
          the timing / single-trace key-recovery line, as a separate
          claim class
    methods:
      - >-
          direct DFR measurement at reduced parameters where failures
          are observable, with extrapolation stated as numbered
          heuristics
      - >-
          independent re-derivation of the analytic DFR model from
          primary text
      - >-
          matched ISD baseline at identical parameters with memory and
          memory access charged
      - >-
          any chosen-ciphertext attack claim carries a certificate:
          recovered key must decapsulate correctly
    claim_tier_ceiling: >-
      Toy-tier until a certified instance at or above the standardized
      parameter scale exists. AGENTS.md rule 7 applies: no toy-scale result is
      reported as a statement about a standardized parameter set. A
      standardized algorithm makes this rule more binding, not less.
  motivation: >-
    HQC's distinguishing pitch is precisely-characterized decryption
    failure rates, and that is also its single point of failure: the
    IND-CCA argument depends on an analytic DFR model for a concatenated
    Reed-Muller / Reed-Solomon decoder, and a DFR model that is
    optimistic by a few orders of magnitude turns into a
    chosen-ciphertext attack rather than a rounding error. This is a
    rare case where the load-bearing claim is a *measurable probability*
    — the kind of object this program can actually attack with
    instrumentation rather than argument, at reduced parameters where
    failures are observable. The second flank is the concrete ISD cost
    with memory charged, the same discipline as GOAL-SDITH-001. Third,
    HQC has an unusually long implementation-attack record — a 2019/2021
    timing attack line exploiting non-constant-time rejection sampling
    during re-encryption, power and chosen-ciphertext key-recovery
    attacks, and reported 2026 single-trace key recovery using valid and
    invalid ciphertexts — which belongs in a separate claim class. These
    are the algorithms already being deployed, so the cost of a wrong
    security estimate is different in kind from a Round-3 candidate's:
    migration schedules are being set against them (reported June 2026
    US federal deadlines of 2030 for key establishment and 2031 for
    signatures — unverified here), and a parameter set that is
    standardized is a parameter set nobody will re-derive on their own.
  decision_target: >-
    Whether HQC's DFR model is accurate enough at its selected
    parameters to carry the IND-CCA argument, and whether its charged
    ISD cost matches the claimed categories.
  provenance: >-
    Algorithm roster taken from the NIST PQC standardization 'selected
    algorithms' page. csrc.nist.gov and nist.gov are unreachable from
    this harness's network policy (proxy CONNECT 403), so the roster and
    status dates were confirmed from secondary reporting rather than
    read from the primary page, and no FIPS text has been read by this
    program. Every per-algorithm technical claim below is a research
    target to be verified against the primary standard and against
    primary attack literature before any experiment is designed, not an
    established result.
  constraints:
    - >-
      Every per-algorithm technical claim in this record is sourced from
      secondary reporting or from memory of the literature and is UNVERIFIED.
      No experiment may be designed until the relevant primary sources are
      filed as KN-LIT entries.
    - >-
      Matched-baseline discipline: no attack cost is reported without the
      best-known baseline at identical parameters, with memory, preprocessing,
      and verification charged.
    - >-
      Any claimed break carries a certificate that the run wrapper re-verifies
      independently. See docs/claims-and-verification.md.
    - >-
      These algorithms are deployed or near-deployment. A claim about a
      standardized parameter set carries operational consequences, so no
      result leaves this program at a claim tier above the one its evidence
      supports, and no toy-scale finding is phrased as a statement about
      fielded systems.
  status: active
  owner: coordinator
  created_at: '2026-07-29'
