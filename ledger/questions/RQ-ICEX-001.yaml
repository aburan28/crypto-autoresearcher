research_question:
  id: RQ-ICEX-001
  title: >-
    Under full charging against matched Pollard rho/BSGS, does any toy-scale
    prime-field index-calculus pipeline achieve an operation exponent alpha
    whose confidence interval excludes 1/2?
  scope:
    curve_families: [generic prime-field short-Weierstrass]
    field_types: [prime]
    bit_sizes: [toy fixtures only until medium-scale gate]
    methods: [end_to_end_index_calculus, full_cost_accounting, certificates]
  motivation: >-
    KN-OPEN-001 is the program's central question. Tier 2 aggregates G4-G6 into
    one charged exponent comparison. A negative closes the current IC pipeline
    scope; a positive only authorizes medium-scale trend tests, never crypto claims.
  decision_target: >-
    A committed Coordinator decision on whether the charged toy IC exponent
    excludes 1/2 within its declared scope — after G4-G6 prerequisites deliver
    admissible cost and relation-rate inputs.
  constraints:
    - Blocked until GOAL-SDEG-001, GOAL-MONO-001, and GOAL-RELN-001 each have a
      committed protocol or scoped measurement decision.
    - Full charging (preprocess, relations, LA, descent, memory, multitarget).
    - Independent review-xhigh required before any advantage language.
  status: active
  owner: coordinator
