research_question:
  id: RQ-SHATWO-f340ac
  title: >-
    Can the Li–Zhang–Li–Liu–Qian–Zhu refined SAT/SMT search plus memory-efficient
    meet-in-the-middle framework for SHA-2 collisions be independently
    reproduced at 36–39 steps, and where does the uncontrolled-part probability
    stop further step gains?
  scope:
    scheme: >-
      SHA-256 and SHA-512 (FIPS 180-4), step-reduced compression only; full
      64/80-step hashes explicitly out of claim scope
    family: Merkle-Damgard / Davies-Meyer, ARX + Boolean round function
    targets:
      - >-
          CERTIFICATE GATE: independently re-verify the paper's stated
          36-step SHA-256 colliding message pair (Table 2 in the supplied
          text) with a second FIPS 180-4 implementation truncated to 36
          steps. A verification FAILURE with pinned encoding is a complete
          result about this program's instrument, not about SHA-2.
      - >-
          CHARACTERISTIC VALIDITY: re-check the paper's SFS colliding pairs
          for the stated 36/37/38/39-step differential characteristics as
          validity controls on those characteristics.
      - >-
          COST-MODEL AUDIT: re-derive the stated time/memory accounts for
          36–39-step SHA-256/SHA-512 under the memory-efficient on-the-fly
          MITM framework, with explicit condition counts and degrees of
          freedom in (W14, W15) and early matching words.
      - >-
          FRONTIER OBSTRUCTION: measure, on the paper's own 39-step
          characteristics, the uncontrolled-part probability that makes
          39-step SHA-256 ineffective while 39-step SHA-512 remains under
          the birthday bound — stated only for those characteristics.
      - >-
          EXTENSION GATE (only after the above): ask whether a further
          search-procedure refinement can push an effective collision past
          39 steps for SHA-512 or make 39-step SHA-256 effective; premature
          search before certificate and cost-model gates is forbidden.
    methods:
      - Independent FIPS 180-4 reference implementation with NIST test-vector pin
      - Condition counting and MITM cost arithmetic as finite checks before solver spend
      - SAT/SMT characteristic search only under a frozen protocol citing the paper's staged objectives
      - Certificate-first recording of any claimed collision or SFS pair
    claim_tier_ceiling: >-
      REDUCED-ROUND ONLY. Nothing here may be read as a statement about full
      SHA-256/SHA-512, HMAC, TLS certificate chains, Bitcoin, or any deployed
      integrity mechanism. A collision on s steps is a collision on s steps.
  motivation: >-
    The supplied 2026 paper claims the first practical 36-step SHA-256
    collision, first theoretical 38-step collisions on both SHA-256 and
    SHA-512, and the first effective 39-step collision on SHA-512, via a
    refined staged Hamming-weight search and a nearly memoryless MITM
    condition-fulfillment framework. This program's draft GOAL-SHA2-001 still
    waits on a primary-text baseline and a literal certificate; this question
    owns independent reproduction and cost-model audit of that exact attack
    line, without absorbing the deficit-ledger discrimination that
    GOAL-SHA2-001 already owns.
  decision_target: >-
    Whether the paper's stated 36–39-step collision results and complexities
    survive independent certificate checks and cost-model re-derivation in
    this repository, and what named obstruction (if any) bounds further
    step gains under the same local-collision injection family.
  provenance: >-
    USER-SUPPLIED FULL PAPER TEXT on 2026-09-09, frozen under
    inputs/SHA2-LI-39STEPS-2026/. Every complexity figure and message pair is
    user_supplied until an independent PDF retrieval upgrades the provenance.
    Related recalled lineage cited in the paper (and not yet re-read here):
    [LLWS26], [ZMLM26], [LLW+24b], [LLW24a], [DEM15], [MNS13].
  constraints:
    - >-
      No characteristic search may run until (a) a FIPS 180-4 implementation is
      pinned against NIST vectors and (b) the 36-step SHA-256 Table-2 pair has
      been checked or its failure recorded with exact commands.
    - >-
      A timeout, solver abort, or missing PDF is infrastructure, never negative
      mathematical evidence about SHA-2 (AGENTS.md rule 3).
    - >-
      GOAL-SHA2-001 retains ownership of the degrees-of-freedom versus
      conditions deficit ledger and the instrument-versus-deficit
      discrimination. This question may cite those results when they exist; it
      does not redo them.
    - >-
      GOAL-SYMF-c00fa1 owns frontier-census rows; a verified complexity here may
      be proposed as a SYMF update but cannot silently rewrite the census.
    - >-
      Every claimed collision or SFS pair carries the literal words and an
      independent re-verification before any evidence record cites it.
  status: active
  owner: coordinator
  created_at: '2026-09-09'
