research_question:
  id: RQ-MLKEM-002
  title: >-
    Can a hardened multi-class differential gate decide whether incomplete
    ML-KEM re-encryption comparison is isolated or systemic, under a protocol
    that makes both answers reachable?
  scope:
    curve_families: []
    field_types:
      - module lattices over cyclotomic polynomial rings
    bit_sizes:
      - ML-KEM-512
      - ML-KEM-768
      - ML-KEM-1024
    methods:
      - differential conformance testing of re-encryption comparison
      - multi-class mutation generators
      - Algorithm-18 decapsulation-boundary attestation
      - cross-implementation comparison of fixed-bound vector comparison tails
  motivation: >-
    GOAL-MLKEM-001 closed at budget without a cryptanalytic mechanism, having
    converged on defensive comparison-conformance. EXP-MLKEM-003 then showed that
    the isolation question is undecidable under a precedence list that ranks
    "instrument added nothing" above the target conclusion when the positive
    control is fully visible to the baseline generator (KN-TECH-054,
    EV-MLKEM-006, DEC-20260724-019). The remaining uncertainty is whether a
    repaired protocol — with a baseline-invisible synthetic control and a
    second implementation that actually stresses fixed-bound hand-written
    comparison tails — can reach a licensed isolation or systemic verdict.
  decision_target: >-
    Decide, under a repaired hardened gate, whether the incomplete-comparison
    class is isolated to the audited wolfSSL pre-fix routines or appears in at
    least one additional implementation whose comparison routine is in the same
    defect-mechanism neighborhood.
  constraints:
    - Laboratory builds from public source only; no deployed system, network peer, or third-party key.
    - No key recovery, oracle construction, exploitation path, disclosure, or attack-cost estimation.
    - Functional comparison completeness only; no timing, power, EM, cache, or fault measurement.
    - Toy-scale and laboratory conformance evidence is never presented as crypto-scale or MLWE evidence.
    - A null under a finite generator is not a correctness proof.
    - Any newly observed conformance defect escalates to the coordinator and is not published by any agent.
  status: active
  owner: coordinator
  supersedes_line_of_work: GOAL-MLKEM-001
  evidence_basis: [EV-MLKEM-005, EV-MLKEM-006, DEC-20260724-019, KN-FIND-001, KN-TECH-054]
