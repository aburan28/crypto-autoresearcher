research_question:
  id: RQ-SNFS-005666
  title: >-
    Special number field sieve: is "detecting the trapdoor seems out of reach"
    a measured statement or an inherited one, and where does the SNFS/GNFS
    crossover actually sit for structured moduli?
  scope:
    scheme: "SNFS applied to integer moduli and prime-field discrete logarithm parameters"
    family: "number field sieve with a special polynomial; GNFS as the matched baseline"
    assumption: >-
      The load-bearing claim is a NEGATIVE DETECTABILITY CLAIM: that a
      deliberately trapdoored prime, constructed so that the special number
      field sieve applies, cannot be distinguished from an honestly generated
      one. Negative detectability claims are the hardest kind to hold and the
      easiest kind to inherit, and this one is repeated as a settled fact
      wherever parameter provenance is discussed.
    standardization_status: >-
      Fixed prime-field groups remain in deployed protocols and long-lived
      configurations. Some published groups carry a verifiable derivation from
      a stated nothing-up-my-sleeve construction; others, as far as this
      program's corpus shows, do not, and the inventory of which is which is
      not held here.
    targets:
      - >-
          THE DETECTABILITY QUESTION, POSED SO IT CAN BE ANSWERED: generate both
          classes — honest primes and SNFS-trapdoored primes matched on every
          public criterion a verifier checks — at sizes this harness can reach,
          and run every computable statistic against them. GROUND TRUTH IS
          KNOWN BY CONSTRUCTION, so any separation is decidable and any
          non-separation is a measured non-separation rather than an assumption.
      - >-
          IF NOTHING SEPARATES THEM, SAY WHY: a named obstruction with an
          argument, per docs/inventor-protocol.md's closure standard. "We tried
          several statistics and found nothing" is a fatigue report and its
          honest status is `unverified`. The useful form is a statement about
          what the trapdoor construction leaves invariant and why every public
          check is blind to it.
      - >-
          THE CROSSOVER, MEASURED: at what modulus size and polynomial degree
          does SNFS actually beat GNFS on the SAME hardware and the SAME
          implementation? The asymptotic separation is textbook; the crossover
          for realistic structured parameters is an empirical quantity, and
          this program holds no measurement of it.
      - >-
          A PROVENANCE-VERIFIABILITY INVENTORY of published fixed groups: for
          each, whether a stated derivation exists and whether this program can
          RE-DERIVE the published value from it. This is a reproducibility
          audit with a binary outcome per group, not an assessment of anyone's
          conduct.
    methods:
      - >-
          Construction of both prime classes at reachable sizes with recorded
          seeds, matched on the public criteria a verifier would apply.
      - >-
          A pre-declared battery of candidate distinguishing statistics, fixed
          BEFORE the classes are generated, so that no statistic is selected
          after seeing which one happens to separate.
      - >-
          Matched SNFS-versus-GNFS runs on one implementation and one machine
          for the crossover measurement, in the charging convention
          GOAL-RSA-001 establishes.
      - >-
          Re-derivation of published group values from their stated
          constructions, where such a construction is published.
    claim_tier_ceiling: >-
      NO KILOBIT COMPUTATION IS IN SCOPE; the compute exceeds this campaign by
      orders of magnitude. Detectability results are scoped to the SIZES,
      CONSTRUCTIONS, AND STATISTICS ACTUALLY RUN, and a non-separation at toy
      sizes is NOT evidence that trapdoored kilobit primes are undetectable —
      it is evidence about the statistics tested. THE PROVENANCE INVENTORY IS A
      REPRODUCIBILITY RESULT AND NOTHING MORE: "this program could not
      re-derive this group from a published construction" is a statement about
      documentation and about this program's reach. IT IS NOT AN ALLEGATION
      THAT A GROUP IS TRAPDOORED, and no record produced here may be written as
      though it were.
  motivation: >-
    The kilobit hidden-SNFS computation established that trapdooring a
    1024-bit prime is feasible for an academic-scale adversary while the
    resulting prime passes the checks a verifier performs. What everyone has
    carried since is the SECOND half of that result — that detection "seems out
    of reach" — and a negative detectability claim is exactly the kind that
    calcifies without anyone re-testing it. This program is unusually well
    placed to test it, because the question has a property almost nothing else
    here does: BOTH CLASSES CAN BE MANUFACTURED, so the experiment has decidable
    ground truth and a real null by construction rather than by argument. The
    likely outcome is a confirmed non-separation, and that is a worthwhile
    result if and only if it comes with a named obstruction rather than a count
    of statistics tried. The crossover measurement is the second deliverable and
    the one that makes the first one honest: a trapdoor matters only where SNFS
    actually wins, and this program does not know where that is on its own
    hardware. Under docs/inventor-protocol.md, declining this because the 2016
    result "settled it" is premature closure of a question that was never posed
    as a measurement.
  decision_target: >-
    Whether any computable statistic separates SNFS-trapdoored from honest
    parameters at reachable sizes — and if not, what named property of the
    construction makes every public check blind to it — together with a measured
    SNFS/GNFS crossover on one implementation.
  provenance: >-
    OBTAINED BY WEB-SEARCH EXCERPT ON 2026-08-09, NOT FILED AS KN-LIT AND NOT
    READ IN PRIMARY TEXT BY THIS PROGRAM. RESEARCH TARGETS TO BE RE-READ, not
    facts on record here: "A kilobit hidden SNFS discrete logarithm computation"
    by Fried, Gaudry, Heninger and Thome (eprint 2016/961, arXiv 1610.02874,
    Eurocrypt 2017), reported as the first kilobit-sized discrete logarithm
    computation for prime fields, taking a little over two months of calendar
    time on an academic cluster using CADO-NFS, with a chosen prime described as
    looking random and having a 160-bit prime factor of p-1 in line with DSA
    parameters, while being trapdoored so the special number field sieve
    applies, and with the excerpt stating that detecting the trapdoor "seems out
    of reach"; also seen in excerpt only, "Indiscreet Logs: Diffie-Hellman
    Backdoors in TLS", "Safety in Numbers: On the Need for Robust Diffie-Hellman
    Parameter Validation", and "Prime and Prejudice: Primality Testing Under
    Adversarial Conditions". EVERY FIGURE AND CHARACTERISATION ABOVE IS
    UNVERIFIED.
  constraints:
    - >-
      No experiment may be designed until the kilobit hidden-SNFS paper and the
      parameter-validation literature are filed as KN-LIT entries at stated
      provenance levels. The trapdoor construction in particular cannot be
      reimplemented from a remembered description.
    - >-
      THE STATISTIC BATTERY IS PRE-DECLARED AND FROZEN BEFORE THE PRIME CLASSES
      ARE GENERATED. Selecting a statistic after seeing which one separates is
      the failure this constraint exists to prevent, and a record that cannot
      demonstrate the freeze order is invalid rather than weakened.
    - >-
      Matched generation: the honest and trapdoored classes must agree on every
      public criterion a verifier applies, or the separation measured is a
      separation of the generators and not of the trapdoor.
    - >-
      A non-separation at reachable sizes is scoped to those sizes and those
      statistics. Extrapolating it to kilobit parameters is forbidden as a
      claim and admissible only as a clearly labelled conditional projection.
    - >-
      NO RECORD PRODUCED UNDER THIS QUESTION MAY ALLEGE THAT ANY REAL, PUBLISHED,
      OR DEPLOYED PARAMETER SET IS TRAPDOORED, OR ATTRIBUTE INTENT TO ANY PARTY.
      The provenance inventory reports re-derivability and nothing else. Where
      re-derivation fails, the record states that this program could not
      re-derive it and names what would be needed to.
    - >-
      No kilobit or record-scale computation is attempted.
  status: active
  owner: coordinator
  created_at: '2026-08-09'
