# RQ-BND-58fe60 -- measured bounds (area BND): does the standing-challenge
# protocol of aburan28/crypto docs/bounds/README.md, applied to the committed
# toy incumbents, produce admissible paired verdicts that move the measured
# frontier, and what does each verdict say about constants at toy scale?
# Opened by DEC-20261006-bee0ec. The question is asked of sealed artifacts
# that already exist (commit 031811fb80958a2efa9a75d0793a8d9f136fdee9); this
# record carries them into the ledger, it does not pre-date them.
research_question:
  id: RQ-BND-58fe60
  id_provenance: >-
    Pre-minted and confirmed free with `python3 tools/allocate_id.py --check`
    by the orchestrating session on 2026-10-06 (facts file). Not re-minted
    here; the Coordinator subagent writing this record had no shell.
  title: >-
    Does the standing-challenge protocol (aburan28/crypto docs/bounds/README.md
    sections 5-6), applied to the committed toy incumbents with the best
    already-measured alternative as candidate, produce admissible paired
    verdicts that move the measured frontier, and what does each verdict say
    about method constants at toy scale?
  scope:
    curve_families:
      - prime (prime_search curves, prime-order groups, A = 2 automorphisms)
      - koblitz (anomalous binary curves over F_{2^n}, A = 2n automorphisms)
    field_types:
      - prime field F_p, 18 to 24 bits
      - binary field F_{2^n}, n in {17, 19, 23, 29}
    bit_sizes:
      - prime: log2 r in [17.70, 23.97] (r = 212437, 562427, 2435809, 16482251)
      - koblitz: log2 r in [15.37, 21.00] (r = 42457, 65587, 130873, 2095853)
    methods:
      - rho.negation (incumbent, prime toy; bound ECBND1h7b69b9787056)
      - bsgs.negation (candidate, prime toy)
      - rho.signed_frobenius_strong (incumbent, koblitz toy; bound ECBND1h1573ea580e89)
      - rho.signed_frobenius with cap_multiple=64 (candidate, koblitz toy)
    tier: toy
    unit: ecbench.gae (group-addition equivalents; counted, never a clock)
    problem: ecdlp.single_target, planted targets, one thread, no precomputation
  motivation: >-
    docs/bounds-and-frontiers.md makes a sealed verdict from a frozen, paired
    challenge the only way a cost claim moves a frontier in this program, and
    AGENTS.md "Measured bounds and frontiers" makes the Coordinator's decision,
    not the verdict, the thing that changes research state. Until 2026-10-06
    no challenge had ever been run to a verdict, so the ledger had no example
    of the pipeline end to end: challenge -> epoch spec -> session -> replay-all
    audit -> verdict -> new bound -> frontier rebuild -> evidence record ->
    decision -> known-results row. The two reference challenges
    (ECCH1h904625668686 prime toy, ECCH1h76d71da2a89c koblitz toy) are the
    natural first ones: each is the question every later candidate on its
    domain is asked first, and the best already-measured alternative on each
    domain was already visible as an unpaired frontier entry.
  decision_target: >-
    Decide (a) whether each epoch-1 verdict is admissible and, if so, which of
    advances | trade | matches | regresses it reads; (b) whether the ledger
    adopts the resulting bound figures as measured known-results rows; and (c)
    what the next epoch and the next tier of each standing challenge should be.
    Neither verdict can establish anything about medium or cryptographic
    sizes, about index calculus, or about any exponent; a verdict here is a
    statement about constants on four toy curves per domain and nothing more.
  constraints:
    - >-
      Every figure carried into the ledger is read back from the sealed
      artifact (verdict, bound, challenge, spec, session, audit) at commit
      031811fb80958a2efa9a75d0793a8d9f136fdee9 of aburan28/crypto; a report
      or a chat summary is a pointer, never the source of record.
    - >-
      claim_tier equals the sealed domain tier (toy). No record asserts above
      it, and a toy figure never speaks for medium.
    - >-
      The unit is ecbench.gae. Wall time appears nowhere as a bound; every
      measured run in both sessions was isolation level L0, which gates only
      wall-clock figures and leaves operation counts untouched.
    - >-
      One epoch is `preliminary` evidence on the bounds ladder
      (docs/bounds-and-frontiers.md section 2); a second epoch or an
      independent replay on another host class is what makes it `replicated`.
    - >-
      `inadmissible` would be infrastructure signal, never negative evidence
      (AGENTS.md rule 3); neither verdict here is inadmissible.
    - >-
      Records in this area are written after execution. The pre-execution
      freeze is the sealed challenge document plus the nonce-derived epoch
      spec in the measuring repository, not any ledger record; every record
      says so rather than back-dating.
  status: active
  owner: coordinator
  goal_ids: []
  related_question_ids: []
  source_refs:
    - docs/bounds-and-frontiers.md
    - docs/claims-and-verification.md
    - knowledge/frontiers/ecdlp/README.md
    - aburan28/crypto@031811fb80958a2efa9a75d0793a8d9f136fdee9:docs/bounds/README.md
    - aburan28/crypto@031811fb80958a2efa9a75d0793a8d9f136fdee9:research/ecbench_bounds_challenges_20261006/README.md
  created_at: '2026-10-06'
