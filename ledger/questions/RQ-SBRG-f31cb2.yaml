research_question:
  id: RQ-SBRG-f31cb2
  title: >-
    Can reusable algebraic dependencies in Semaev point-decomposition systems
    reduce the fully charged cost of elliptic-curve relation generation?
  scope:
    curve_families:
      - ordinary binary elliptic curves
      - low-degree extension-field elliptic curves
      - trace-zero or symmetry-rich families
      - prime-field curves only after the extension-field structural gates
    field_types: [binary_extension, low_degree_extension, prime]
    bit_sizes:
      - toy instances for falsification and instrumentation
      - scaling studies only after validated toy gates
    methods:
      - Semaev summation polynomials
      - Weil descent
      - syzygies and Macaulay rank profiles
      - Hilbert/Betti diagnostics
      - target-independent preprocessing
      - sparse linear algebra and block Wiedemann
      - full relation-collection cost accounting
  motivation: >-
    Existing Semaev work shows unusually low-degree behavior in descended
    systems but first-fall degree is not, by itself, a reliable proxy for
    Gröbner solving degree. The open question is whether target-independent
    algebraic structure can be isolated, measured against matched controls,
    and amortized across relation attempts strongly enough to survive the full
    ECDLP cost model.
  decision_target: >-
    Advance only mechanisms whose structural signal persists under scaling and
    representation changes, then survives an actual solver gate, empirical
    relation probability, relation-matrix costs, and a matched Pollard-rho
    baseline. Negative results close only the tested representation/parameter
    cells.
  constraints:
    - Defensive research on public/toy curves only; no live private keys or deployed targets.
    - First-fall degree may be recorded but may not be equated with degree of regularity without direct evidence.
    - Precomputation is charged and amortized over an explicit measured batch size.
    - Pollard rho, BSGS where relevant, and matched random polynomial systems are mandatory controls before any attack-cost claim.
    - Timeouts and resource guards are infrastructure outcomes, not mathematical negatives.
  status: active
  owner: coordinator
