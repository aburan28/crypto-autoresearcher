research_question:
  id: RQ-MLKEM-001
  title: Can an algorithmic mechanism materially improve cryptanalysis of standardized ML-KEM?
  scope:
    curve_families: []
    field_types:
      - module lattices over cyclotomic polynomial rings
    bit_sizes:
      - ML-KEM-512
      - ML-KEM-768
      - ML-KEM-1024
    methods:
      - primal and dual lattice attacks
      - hybrid and decoding attacks
      - module and ring structure exploitation
      - decryption-failure and side-information amplification
      - combinatorial and algebraic attacks
      - quantum and classical cost models
  motivation: >-
    ML-KEM is standardized and its security estimates depend on the best known
    attacks against structured noisy linear systems. A useful exploration must
    distinguish genuine algorithmic improvements from estimator tuning,
    implementation leakage, unrealistic oracle access, and toy-only effects.
  decision_target: >-
    Select the cheapest decisive derivation or experiment for any mechanism
    that survives baseline, novelty, and full-cost screening.
  constraints:
    - No claim may exceed the exact parameter sets, oracle model, and cost model analyzed.
    - Implementation side channels and chosen-ciphertext oracles must be labeled separately from core algorithmic cryptanalysis.
    - All sample, preprocessing, memory, lattice-reduction, decoding, and verification costs must be charged.
    - Toy-instance improvements are hypothesis-generating only.
    - Timeouts, crashes, and resource exhaustion are infrastructure outcomes, not cryptanalytic evidence.
  status: active
  owner: coordinator
