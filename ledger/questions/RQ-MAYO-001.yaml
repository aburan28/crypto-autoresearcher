research_question:
  id: RQ-MAYO-001
  title: >-
    Does MAYO's whipping (emulsification) map introduce structure that
    makes oil-space recovery cheaper than the matched plain-UOV attack
    at equal claimed security?
  scope:
    scheme: "MAYO"
    family: "multivariate (whipped Unbalanced Oil and Vinegar)"
    assumption: >-
      multivariate quadratic / oil-space recovery for a whipped UOV map
    process_status: >-
      NIST Additional Digital Signatures, advanced to Round 3 on 2026-05-14;
      team tweaks due 2026-08-14. Round-3 specification not yet read by this
      program.
    targets:
      - >-
          the whipping/emulsification map and any invariant it preserves
      - >-
          oil-space intersection structure across the k whipped copies
      - >-
          vinegar-seed derandomization: key recovery from repeated or
          fixed seeds
      - >-
          fault and side-channel assumptions, stated as an explicit
          attacker model
    methods:
      - >-
          matched-baseline cost model: plain UOV attacks against the
          underlying small-oil map
      - >-
          structural search for whipping-induced invariants at toy (q,
          n, m, k)
      - >-
          toy-scale key recovery with a certificate: recovered oil space
          must annihilate the public map
      - >-
          explicit separation of mathematical attacks from
          fault/side-channel attacks in every claim
    claim_tier_ceiling: >-
      Toy-tier until a certified instance at or above the scheme's own
      parameter scale exists. AGENTS.md rule 7 applies: no toy-scale result is
      reported as a statement about deployed parameters.
  motivation: >-
    MAYO buys its compact keys (1168-byte public key, 321-byte signature
    at category I) by starting from a UOV map whose oil space is too
    small to sign with, then whipping k copies together. The whole
    security question is whether that k-fold structure is free. The
    matched baseline is the best known plain-UOV attack family
    (Kipnis-Shamir, reconciliation, and the intersection attack) applied
    to the underlying small-oil map, and the object to attack is the
    whipping map E itself. Separately, MAYO's implementation surface is
    already known to be sharp: fault attacks that fix or disturb the
    vinegar seed recover the secret key, and a fault-assisted
    man-in-the-middle on key generation is reported to recover the oil
    matrix from a single faulty execution plus public-key correction.
  decision_target: >-
    Whether MAYO's effective security equals the matched plain-UOV
    baseline at its parameters, or the whipping construction (or its
    mandated randomness handling) opens a cheaper path.
  provenance: >-
    Candidate list taken from the NIST announcement of 2026-05-14 that
    nine schemes advance to Round 3 of the Additional Digital Signatures
    process. csrc.nist.gov and nist.gov are unreachable from this
    harness's network policy (proxy CONNECT 403), so the roster and
    elimination list were confirmed from secondary reporting rather than
    read from the primary page; the Round-3 specification bundle (team
    tweaks due 2026-08-14) has NOT been read. Every per-scheme technical
    claim below is a research target to be verified against primary
    sources before any experiment is designed, not an established
    result.
  constraints:
    - >-
      Every per-scheme technical claim in this record is sourced from
      secondary reporting or from memory of the literature and is UNVERIFIED.
      No experiment may be designed until the relevant primary sources are
      filed as KN-LIT entries.
    - >-
      Matched-baseline discipline: no attack cost is reported without the
      best-known baseline at identical parameters, with memory, preprocessing,
      and verification charged.
    - >-
      Any claimed break carries a certificate (recovered key annihilates the
      public map, or a forged signature verifies) that the run wrapper
      re-verifies independently. See docs/claims-and-verification.md.
  status: active
  owner: coordinator
  created_at: '2026-07-29'
