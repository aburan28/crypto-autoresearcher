research_question:
  id: RQ-ECQ-80f23c
  title: How high a Mordell-Weil rank over Q can this program certify from scratch, and what exactly
    separates it from the world record?
  scope:
    curve_families:
    - elliptic curves over Q
    - elliptic surfaces over Q(t) and their specialisations
    - pencils of plane cubics through 8 rational points
    field_types:
    - Q (the base field, non-negotiable for this question)
    - Q(t) as a construction device only
    bit_sizes:
    - not applicable; the parameter is the rank itself
    methods:
    - pencil-of-cubics construction of rational elliptic surfaces
    - Mestre-style constructions
    - Mestre-Nagao sieving of specialisations
    - two-descent (PARI ellrank) and explicit point search
    - Neron-Tate height regulator for independence
  motivation: 'RANK >= 31 OVER Q IS AN OPEN WORLD RECORD. The largest rank known for an explicit
    curve over Q is 30 (Alpoge-Howell 2026), following 29 (Elkies-Klagsbrun 2024) and 28 (Elkies
    2006) -- roughly one increment per decade, each backed by search at a scale this program does
    not have. A campaign that quietly aims at 31 and reports whatever it finds would be dishonest
    by construction. The honest question is the one that has an answer: build the real pipeline,
    certify the best rank it actually reaches over Q, and MEASURE the distance to the record in the
    terms the record is actually made of -- the rank of the Q(t) base curve and the sieve volume.'
  decision_target: 'A certified best-rank-over-Q with a committed witness, plus a quantified gap:
    the base rank over Q(t) this pipeline achieved versus what the published records used, and the
    sieve volume reached versus what would be needed.'
  constraints:
  - 'Rank lower bounds must be UNCONDITIONAL: exhibited points only, never analytic rank, never a
    Selmer upper bound.'
  - Every claim is over Q. A result over a number field does not answer this question and may not
    be presented as if it did.
  - The world record is not this program's to restate as its own result.
  status: active
  owner: coordinator
