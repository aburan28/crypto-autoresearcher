research_question:
  id: RQ-XEDN-004
  title: >-
    On non-isotrivial a≠0 surfaces with deg b=10, do free-x sections of deg x≤3
    still have Mordell-Weil relation coefficients in {1,2,3} at p∈{7,13,19,31},
    or does the joint degree raise force inf-norm ≥4?
  scope:
    curve_families:
      - >-
        non-isotrivial Weierstrass surfaces y^2 = x^3 + a(t)x + b(t) over F_p(t)
        with a≠0, deg a≤2, deg b=10, j non-constant
    field_types: [prime field F_p, rational function field F_p(t)]
    bit_sizes: ["p in {7, 13, 19, 31}"]
    methods:
      - free-x enumeration (deg x≤3, deg y≤5) under the frozen square predicate
      - group-law verified short-relation extraction
      - polarisation Gram as diagnostic only
  motivation: >-
    GOAL-XEDN-002 supported a deg-a raise but left the free-x degree raise
    untested because deg x≤3 on deg-b=6 yields odd-degree f. Raising deg b to
    10 makes deg f=10 when deg x=3, restoring an executable free-x degree-shape
    control (RT-XEDN-005).
  decision_target: >-
    Whether H-XEDN-005 is supported (bounded coeffs under the joint raise) or
    rejected (growth / inf-norm ≥4), without claiming B2 or crypto-scale closure.
  constraints:
    - Toy scale only; no attack claim.
    - a≠0 and j non-constant on every trend surface.
    - Coefficient claims rest on group-law-verified relations; Gram diagnostic only.
    - Negative evidence closes only the exact tested scope.
  status: active
  owner: coordinator
