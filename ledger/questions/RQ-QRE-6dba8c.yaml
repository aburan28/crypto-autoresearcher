research_question:
  id: RQ-QRE-6dba8c
  title: >-
    The quantum resource estimates that drive migration policy are the output
    of a pipeline with a dozen named inputs — reproduce the pipeline, and
    measure how many of the headline number's orders of magnitude each single
    assumption is responsible for.
  scope:
    scheme: "RSA-2048 factoring and 256-bit prime-field ECDLP under Shor's algorithm; surface-code fault tolerance"
    family: "quantum resource estimation: logical circuit synthesis, error correction, magic state distillation, layout and routing"
    standardization_status: >-
      RECALLED, UNVERIFIED: published estimates of this kind are cited in
      national migration timelines and in standards-body risk statements. They
      are not themselves standards, which is exactly why their inputs are
      rarely re-derived downstream.
    targets:
      - >-
        THE REPRODUCED PIPELINE: an auditable cost function from (algorithm
        parameters, physical error rate, cycle time, code distance, distillation
        scheme, connectivity) to (physical qubits, wall-clock time), which
        reproduces at least two published headline totals from their own stated
        inputs, within a declared tolerance. Reproduction failure is a
        first-class result and is reported as such.
      - >-
        THE SENSITIVITY TABLE, WHICH IS THE PRIMARY DELIVERABLE: partial
        derivatives — in practice, one-at-a-time and joint sweeps — of the
        outputs with respect to every input. Which single assumption moves the
        qubit count by an order of magnitude? Which moves it by a factor of
        two? The answer decides where any real reduction would have to come
        from, and it is arithmetic.
      - >-
        THE ARITHMETIC-LAYER COUNT: Toffoli/T counts for modular exponentiation
        and for elliptic-curve point addition, recomputed here rather than
        cited, since every downstream number is linear in them.
      - >-
        THE ECDLP-VERSUS-RSA COMPARISON UNDER ONE MODEL: the two are routinely
        costed in different papers under different assumptions and then
        compared. Cost them under one pipeline with identical assumptions and
        report the ratio.
    methods:
      - Reimplementation of the costing pipeline as executable code with every constant named and sourced, and with published inputs as fixtures.
      - Reversible-circuit resource counting for the arithmetic layer, verified against small classical simulations of the same circuits.
      - Global and one-at-a-time sensitivity analysis with declared ranges for each input.
    claim_tier_ceiling: >-
      COSTING AND SENSITIVITY CLAIMS ONLY. No quantum hardware is used, no
      quantum advantage is claimed, and NO TIMELINE, FORECAST OR PREDICTION
      ABOUT WHEN A CRYPTOGRAPHICALLY RELEVANT QUANTUM COMPUTER MIGHT EXIST MAY
      BE RECORDED. The admissible output is "under these stated physical
      assumptions the pipeline gives X", plus how X moves when an assumption
      moves.
  motivation: >-
    This program's central lane is the classical hardness of ECDLP, and every
    argument about the urgency of that work — and about the cost of migration
    across the whole field — routes through a small number of quantum resource
    estimates. Those estimates are careful, but they are single evaluations of
    a pipeline, quoted downstream as constants. Recomputing them is pure
    arithmetic and circuit counting: no hardware, no new theory, and a
    completely decidable reproduction criterion. The sensitivity table is the
    thing nobody publishes and everybody needs, because it says which
    assumption the headline number is actually about.
  decision_target: >-
    Whether the published totals reproduce from their own stated inputs, and
    which inputs the totals are actually sensitive to.
  provenance: >-
    RECALLED FROM MODEL MEMORY ON 2026-08-09. NOT WEB-SEARCHED, NOT PRIMARY-READ,
    NOT FILED AS KN-LIT. Research targets: Gidney-Ekera (RECALLED as estimating
    RSA-2048 factoring at roughly twenty million noisy physical qubits in of
    order hours under stated surface-code assumptions), Gidney's later reduced
    estimate (RECALLED as reducing the qubit count substantially under revised
    assumptions), Roetteler-Naehrig-Svore-Lauter (RECALLED as the standard
    elliptic-curve Shor resource estimate), and Litinski on magic state
    distillation cost (RECALLED). EVERY NUMBER NAMED HERE IS UNVERIFIED AND
    MUST BE REPLACED BY A PRIMARY READ.
  constraints:
    - No pipeline output is recorded before at least two primary resource-estimation papers are filed as KN-LIT entries with their input tables extracted.
    - Reproduction is scored against the paper's own inputs, and a reproduction gap is reported with its magnitude rather than tuned away.
    - Every constant in the pipeline is either derived in the record or cited to a filed source; an unsourced constant fails review.
    - No record produced under this question may contain a date, timeline, probability of arrival, or policy recommendation.
    - Sensitivity results are reported over declared input ranges; a single-point estimate quoted without its range is not admissible.
  status: active
  owner: coordinator
  created_at: '2026-08-09'
