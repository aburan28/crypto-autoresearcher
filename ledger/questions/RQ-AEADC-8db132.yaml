research_question:
  id: RQ-AEADC-8db132
  title: >-
    Key-committing AEAD: the fielded AEADs are known not to commit, the fixes
    are published, and nobody in this program has produced the certificates —
    which committing constructions actually remove which precondition, at
    standard parameters, with the colliding objects emitted as bytes?
  scope:
    scheme: "AES-GCM, ChaCha20-Poly1305, AES-GCM-SIV, and the committing wrappers (RECALLED: UtC/RtC, CTX, and padding-based fixes) as the repair set"
    family: "authenticated encryption with associated data; key-commitment and context-commitment security"
    standardization_status: >-
      RECALLED, UNVERIFIED: AES-GCM and ChaCha20-Poly1305 are the fielded TLS
      1.3 AEADs; committing AEAD has been the subject of a CFRG work item and
      of NIST discussion of a GCM successor, without a fielded standard at the
      time of writing.
    targets:
      - >-
        THE CERTIFICATES, WHICH ARE THE CHEAPEST STRONG EVIDENCE THIS PROGRAM
        CAN PRODUCE: one ciphertext, two keys, two distinct valid decryptions,
        at FULL standard parameters — not reduced, not toy. Any reader verifies
        it in microseconds. Produce them for GCM and for ChaCha20-Poly1305 and
        record exactly what each construction's arithmetic makes cheap.
      - >-
        THE k-WAY COST CURVE: extend from two keys to k and measure the cost as
        a function of k. The partitioning-oracle attack's efficiency is
        governed by this curve, and it is measured here rather than assumed.
      - >-
        THE REPAIR AUDIT: for each published committing construction, the
        precondition it removes, the overhead it costs measured on this
        program's own implementations, and whether it commits to the key only
        or to the full context (key, nonce, associated data). The distinction
        is where deployed reasoning most often slips.
      - >-
        THE INTERFACE QUESTION: which deployed usage patterns (password-based
        encryption, envelope encryption with many wrapping keys, subscription
        or multi-recipient formats) actually instantiate the precondition. This
        is answered as a description of patterns, never as a claim about any
        specific product.
    methods:
      - Direct construction of colliding-key ciphertexts using the polynomial structure of the authenticator, implemented from the specification.
      - Independent re-verification of every certificate by a second implementation and by a stock library used only as a checker.
      - Overhead measurement of each committing construction under a fixed harness with declared machine and repetition count.
    claim_tier_ceiling: >-
      CERTIFICATE AND CONSTRUCTION CLAIMS ONLY. A key-commitment certificate is
      not a break of confidentiality or of authenticity under a single key, and
      no record may present it as one. Nothing here is a statement about any
      deployed product, protocol implementation or service; where a pattern is
      described, it is described generically.
  motivation: >-
    Key commitment is the clearest current example of a security property that
    the fielded primitives never had, that the literature has already
    established they lack, and whose absence keeps producing real attacks in
    higher-level protocols. It is also the single cheapest place in this entire
    program to produce top-tier evidence: the certificate is a handful of bytes
    and verification is instant. The audit that does not exist is not "does GCM
    commit" — it does not — but "which repair removes which precondition, and
    what does it cost", which is a finite table this harness can fill.
  decision_target: >-
    The certificates for the fielded AEADs at standard parameters, the k-way
    cost curve, and a filled table mapping each published committing
    construction to the precondition it removes and the overhead it costs.
  provenance: >-
    RECALLED FROM MODEL MEMORY ON 2026-08-09. NOT WEB-SEARCHED, NOT PRIMARY-READ,
    NOT FILED AS KN-LIT. Research targets: Dodis-Grubbs-Ristenpart-Woodage on
    fast message franking / "invisible salamanders" (RECALLED as the origin of
    the GCM key-collision technique), Len-Grubbs-Ristenpart on partitioning
    oracles (RECALLED), Bellare-Hoang on committing AEAD and the UtC/RtC
    transforms (RECALLED), Chan-Rogaway CTX (RECALLED), and the CFRG committing
    AEAD work item (RECALLED). Every attribution is UNVERIFIED.
  constraints:
    - No certificate is recorded before the AEAD specifications and at least one committing-AEAD reference are filed as KN-LIT entries.
    - Every certificate is re-verified by two independent implementations, at least one of which was not used to construct it.
    - All key material, plaintexts and ciphertexts are self-generated. No third-party service, product, capture or repository is probed, tested or named.
    - No record may describe a key-commitment certificate as a confidentiality or single-key forgery break.
    - Where a fielded usage pattern is described as instantiating a precondition, it is described as a pattern; naming a specific product as vulnerable is out of scope and prohibited.
  status: active
  owner: coordinator
  created_at: '2026-08-09'
