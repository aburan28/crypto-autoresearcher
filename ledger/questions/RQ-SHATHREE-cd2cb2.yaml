research_question:
  id: RQ-SHATHREE-cd2cb2
  title: >-
    SHA-3: the internal-differential collision frontier stalls around six of
    twenty-four rounds — is that stall a measurable property of how fast the
    round function destroys translation symmetry, or an artifact of search
    budget?
  scope:
    scheme: "SHA-3 / Keccak-f[1600] (FIPS 202), all standard digest sizes"
    family: "sponge construction over an iterated permutation; internal-differential and conditional-internal-differential cryptanalysis"
    assumption: >-
      SHA-3 carries the largest margin of any fielded hash standard, and that
      margin is expressed the same inherited way as every other: the best
      published attack reaches r of 24 rounds. What stops it at r is nowhere
      stated as a measurable quantity, and for SHA-3 there is an unusually
      specific candidate — the internal-differential method exploits the
      round function's symmetry under translation along the lane axis, so the
      method's reach should be governed by HOW FAST THAT SYMMETRY DECAYS.
    standardization_status: >-
      FIPS 202, a fielded standard with the largest published margin in the
      family and, partly because of that margin, the least commercial pressure
      driving third-party analysis.
    targets:
      - >-
          EXACT BASELINE REPRODUCTION (KN-TECH-080 audit 1): reproduce a
          published round-reduced SHA-3 collision as a literal message pair,
          verified independently. Practical collisions in this family are
          reported at round counts this harness can plausibly reach, which makes
          SHA-3 one of the few places where a published attack can be re-run
          rather than merely re-read.
      - >-
          THE TRACKED OBJECT: the symmetry-decay curve. Measure, per round, the
          dimension of the translation-invariant subspace that survives theta,
          rho, pi, chi and iota, and the cost of maintaining internal-differential
          structure across it. The frontier hypothesis is that the published
          stall sits where maintenance cost crosses the birthday bound. That is
          a COMPUTABLE QUANTITY over a fixed permutation, requiring no search at
          all, and it predicts the frontier before any solver runs.
      - >-
          INSTRUMENT VERSUS OBJECT, the same discrimination RQ-SHATWO poses in a
          different mechanism: vary solver budget with everything else fixed and
          report whether the reachable round count moves. Budget-limited and
          structure-limited frontiers predict differently here.
      - >-
          THE FREE CONTROL FAMILY: the standard fixes several digest sizes over
          the SAME permutation with different capacities. Published attack reach
          differs across them, which is a nearby-object control the standard set
          up at no cost — a decay model that explains one digest size but not
          the others is caught before anything is built on it.
      - >-
          A PUBLIC SCOREBOARD IS BELIEVED TO EXIST for round-reduced Keccak
          collision and preimage challenges, with verifiable published targets.
          IT MUST BE LOCATED DURING ACQUISITION: an external frontier with
          machine-checkable answers is the strongest form of baseline this
          program can obtain, and proceeding without checking for one would
          waste it.
    methods:
      - >-
          Exact linear-algebra computation of the surviving symmetric subspace
          per round over the fixed permutation, which needs no solver and is
          reproducible to the bit.
      - >-
          Automated internal-differential search with encoding, solver version,
          seed, and wall-clock ceiling declared before the run.
      - >-
          Certificate-first execution: any claimed collision is emitted as the
          literal message pair and re-verified by a second independent FIPS 202
          implementation.
    claim_tier_ceiling: >-
      ROUND-REDUCED ONLY. NOTHING HERE MAY BE READ AS A STATEMENT ABOUT FULL
      24-ROUND SHA-3 OR ANY DEPLOYED USE OF IT. The decay model, if it holds,
      predicts where the frontier sits; a prediction is not an attack, and
      extrapolating the decay curve to 24 rounds is forbidden as a claim and
      admissible only as a clearly labelled conditional projection.
  motivation: >-
    SHA-3 is where premature closure is most likely and least examined. Its
    margin is so large that nobody expects movement, which means the frontier
    receives less scrutiny per unit of deployment than any other standardized
    hash — the exact inversion docs/inventor-protocol.md warns about, and the
    reason "this space is saturated" has to be treated as a hypothesis about the
    search. There is also a concrete technical reason to look here rather than
    anywhere else in the family: SHA-3's leading attack method has a NAMED
    STRUCTURAL RESOURCE, the translation symmetry of the round function, and
    resources that can be named can be counted. Where SHA-2's bottleneck is a
    degrees-of-freedom ledger over a message schedule, SHA-3's is a decay rate
    over a fixed permutation — computable exactly, by linear algebra, with no
    solver and no heuristic. Very little in this program's portfolio has that
    property. And unlike almost every other target here, published attacks sit
    at round counts a modest budget can actually re-run, so the baseline
    reproduction is real rather than aspirational.
  decision_target: >-
    Whether the published round-reduced SHA-3 collision frontier is predicted by
    the symmetry-decay curve of the round function, or is set by search budget —
    with the decay model required to explain the reach differences across digest
    sizes.
  provenance: >-
    OBTAINED BY WEB-SEARCH EXCERPT ON 2026-08-09, NOT FILED AS KN-LIT AND NOT
    READ IN PRIMARY TEXT BY THIS PROGRAM. RESEARCH TARGETS TO BE RE-READ, not
    facts on record here: "Practical Collision Attacks against Round-Reduced
    SHA-3" (eprint 2019/147, Journal of Cryptology); "Collision Attacks on
    Round-Reduced SHA-3 Using Conditional Internal Differentials" (Eurocrypt
    2023); "Probabilistic Linearization: Internal Differential Collisions in up
    to 6 Rounds of SHA-3" (eprint 2024/1136, attributed in excerpt to Zhang,
    Zhou and Liu at CRYPTO 2024); and a CT-RSA 2026 item titled "Improved
    Collision Attacks on 4-round SHA3-384", with an excerpt claim that a
    4-round SHA3-384 collision attack was lowered from 2^59.64 to 2^56.11.
    A PUBLIC ROUND-REDUCED KECCAK CHALLENGE SCOREBOARD WAS SEARCHED FOR AND NOT
    FOUND IN THE EXCERPTS OBTAINED; this program believes one exists and records
    that belief as an acquisition target rather than as a fact. Every round
    count and complexity above is UNVERIFIED.
  constraints:
    - >-
      No experiment may be designed until the specific round-reduced attack to
      be reproduced is filed as a KN-LIT entry at a stated provenance level,
      with its round count, complexity, and certificate format from primary
      text, and until the existence or non-existence of a public challenge
      scoreboard has been checked and recorded either way.
    - >-
      A FIPS 202 implementation must be pinned and validated against the
      published test vectors, across every digest size under test, before any
      search runs.
    - >-
      The symmetry-decay computation is exact linear algebra and must be
      reported with its full derivation, not as a fitted curve. A decay model
      obtained by fitting to the published frontier would assume the very thing
      the question asks.
    - >-
      A failed search is a BUDGET OUTCOME about a solver, never evidence that no
      internal differential exists (AGENTS.md rule 3).
    - >-
      Every claimed collision carries the literal message pair and an
      independent re-verification.
    - >-
      Nothing here may be reported as a statement about deployed SHA-3, SHAKE,
      or any protocol using them.
  status: active
  owner: coordinator
  created_at: '2026-08-09'
