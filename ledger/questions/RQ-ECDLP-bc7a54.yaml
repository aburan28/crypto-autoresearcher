research_question:
  id: RQ-ECDLP-bc7a54
  id_allocation_provenance: >-
    Minted by the top-level session with `python3 tools/allocate_id.py --next
    research_question --area ECDLP` and confirmed free with `--check`
    (0 occurrences across 25530 identifier-bearing paths) on 2026-09-20.
    Not derived by scanning state.
  added: '2026-09-20'
  title: >-
    THE INVERTIBLE HALF. Is there a subset D of a prime-order E(F_p) that is
    simultaneously dense (|D| >= n^alpha, alpha > 1/2), cheaply decidable from
    coordinates, and cheaply INVERTIBLE -- log_g Q computable from the
    coordinates of Q for every Q in D -- and if not, is the
    recognizable/invertible duality itself provable, so that P*T = n is a
    theorem about every filter-built advice rather than a property of the
    Bernstein-Lange construction?
  motivation: >-
    Koblitz and Menezes (ePrint 2015/1018, section 3.2) ask whether an
    n^{1/3} ECDLP algorithm could exist "that requires far less
    precomputation". docs/n13-ecdlp-hint-family.md (merged 2026-09-20)
    reduces that question to a single object and this record asks the half of
    it the portfolio does not already own.

    THE ACCOUNTING THAT FORCES THE QUESTION. The Mihalcik / Lee-Cheon-Hong /
    Bernstein-Lange family (KN-LIT-5230) satisfies P*T = n, not only
    S*T^2 = n (KN-LIT-013). Hence T < sqrt(n) <=> P > sqrt(n): that kind of
    preprocessing never lowers TOTAL cost below the rho bound for a single
    target; it relocates cost off the online path. At n = 2^256 the balanced
    table is also ~10^4 times all storage ever manufactured. Both walls
    together leave only S = O(polylog) and P = O(polylog), at which point the
    advice is no longer data but a decision procedure -- a triple
    (D, chi, omega): dense, decidable by chi from coordinates, invertible by
    omega from coordinates. Given such a triple of density n^{alpha-1}, a
    memoryless walk that tests chi at every step and returns omega on a hit
    solves ECDLP in n^{1-alpha} group operations with O(1) storage and zero
    precomputation (alpha = 2/3 gives n^{1/3}).

    WHY THIS IS NOT RQ-ECDLP-4fcbd3. That question owns the RECOGNIZABILITY
    half: whether a coordinate bias carries discrete-log information and
    whether it concentrates p^{1/4} above the Weil level so a distinguisher
    leaks into key recovery through bit-security reductions. A distinguisher
    is not an omega. No amount of bias on D supplies the discrete log of a
    member of D, and it is omega, not chi, that converts a dense set into an
    algorithm -- chi for the two natural dense sets is already free. The two
    questions are complementary halves of one object and neither subsumes the
    other.

    THE DUALITY, WHICH IS THE REAL CONTENT. Two subsets of size exactly
    n^{2/3} are available at no cost. D_x = {Q : x(Q) < p^{2/3}} is dense and
    decidable by one comparison, with no known omega. D_w = {g^k : k of low
    Hamming weight} is dense and trivially invertible, with no known chi --
    deciding membership is itself a discrete-log problem. Every candidate the
    note examined lands strictly on one side. This also RE-DERIVES P*T = n
    without reference to walks: Bernstein-Lange precomputation is exactly
    "enumerate an invertible set and filter it for a recognizable one", whose
    cost is the size of the invertible set enumerated, n/T. If the duality is
    a theorem, P*T = n is a theorem about every filter-built advice, and
    section 3.2's algorithm is impossible by that route rather than merely
    undiscovered. If it is breakable, the break is the algorithm.
  decision_target: >-
    Either (a) record the invertible-half lane as closed with a MEASURED or
    PROVED obstruction -- a duality statement with its scope, or a measured
    cost curve showing the small-x promise buys nothing -- so that every
    future "cheap advice" or "more representations" proposal can be priced
    against it; or (b) identify one candidate (D, chi, omega) whose omega is
    cheap on a dense decidable set, in which case the deliverable is a toy
    replication, an independent validation and a red-team pass before any
    exponent is modelled. Toy-scale evidence authorizes scaling work only and
    never satisfies GOAL-ECDLP-001 or GOAL-CRYPTO-001.
  scope:
    curve_families:
      - ordinary prime-order short-Weierstrass curves over F_p (primary object)
      - matched random curves and random-relabelled cyclic groups of the same
        order as null objects (a relabelled Z/nZ is literally a generic group
        and is the mandatory control for any claimed chi or omega)
      - special-j / CM curves with an F_p-rational automorphism as a
        known-true positive control, where the beta-orbit structure makes a
        constant-factor density gain real and MUST be recovered by any
        instrument that claims to detect a hint family
    field_types:
      - prime
    bit_sizes:
      - toy instances (n from ~2^16 to ~2^32) with exhaustive discrete-log
        tabulation, for executable falsification of any claimed omega
      - symbolic P*T / S*T^2 models for scope statements, never extrapolated
        to a cryptographic claim
    methods:
      - >-
        hint-family search: candidate (D, chi, omega) triples with both halves
        charged from coordinates
      - >-
        promised-input DLP measurement: cost of log_g Q as a function of an
        x(Q) < p^beta promise, against matched rho and the program's existing
        small-x index-calculus library (ICPERF)
      - >-
        duality arguments: attempts to prove, or to break, "dense + cheaply
        decidable => not cheaply invertible" over a stated class of chi/omega
      - >-
        generic-group accounting: whether P*T = Omega(n) is provable where
        Corrigan-Gibbs-Kogan bound only (S, T)
      - >-
        density accounting for representation multiplicity (isogeny classes,
        orbit quotients), as a reusable obstruction
  constraints:
    - Lawful defensive cryptanalysis on self-generated toy curves only; no
      live keys, wallets, or deployed parameters are targeted.
    - Discrete logs are tabulated at toy scale to COMPUTE observables; no chi
      may take the logarithm as an input, and every chi and omega must be
      evaluable from coordinates at charged cost. An omega that consults a
      table built by enumeration is the Bernstein-Lange construction and must
      be charged as P, not reported as a hint family.
    - Every claimed signal is an artifact until the identical measurement has
      run on a random-relabelled null (a generic group) and passed a decay
      test in n, per docs/inventor-protocol.md section 3.
    - The known symmetries x(-Q) = x(Q) and the special-j beta-orbits must be
      quotiented out BEFORE any claim, or they will be rediscovered and
      reported as a hint family.
    - Pollard rho remains the mandatory cost baseline. Preprocessing-based
      comparisons must charge P, S and T together; a comparison that omits P
      reproduces the error this question exists to correct.
    - Every claimed solve or relation carries a certificate re-verified
      independently of the producer (docs/claims-and-verification.md).
    - Timeouts, crashes and memory exhaustion are infrastructure outcomes,
      never negative mathematical evidence (AGENTS.md rule 3).
    - Evidence from this lane is capped at claim_tier toy until a
      medium-scale replication exists. Even total success here leaves P-256
      standing (n^{1/3} = 2^85) and would be a security-margin result, not a
      break; no deliverable may be phrased otherwise.
