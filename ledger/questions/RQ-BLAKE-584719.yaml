research_question:
  id: RQ-BLAKE-584719
  title: >-
    BLAKE3: the seven-round choice rests on cryptanalysis of a different
    permutation — does that transfer argument hold when measured, and is the
    tree mode's domain separation total?
  scope:
    scheme: "BLAKE3, with BLAKE2s as the matched baseline and ChaCha as the nearby-object control"
    family: "ARX permutation (ChaCha lineage), Merkle-tree hash mode with domain-separation flags"
    assumption: >-
      TWO ASSUMPTIONS, AND THE FIRST IS A TRANSFER ARGUMENT. BLAKE3 uses seven
      rounds where BLAKE2 used ten or twelve, and the published justification is
      that cryptanalysis of BLAKE2 showed seven rounds to be a comfortable
      margin. That reasoning imports a margin measured on ONE permutation and
      message schedule into a design that changed both. The second assumption is
      structural: the tree mode's security rests on flag-based domain separation
      being TOTAL — no two semantically distinct inputs reaching the compression
      function in the same state.
    standardization_status: >-
      Not standardized by NIST. Widely deployed regardless — content addressing,
      integrity checking, build systems, and file synchronisation — on the
      strength of speed and of the transfer argument above.
    targets:
      - >-
          MEASURE THE TRANSFER, DO NOT ARGUE ABOUT IT: run the identical
          characteristic search against BLAKE3's permutation and schedule and
          against BLAKE2s's, and compare the bound-per-round curves directly. If
          the curves coincide, the transfer argument is supported by a
          measurement this program made rather than by an assertion it
          inherited. If they diverge, the divergence is the result, and its size
          is the quantity the seven-round choice actually depends on.
      - >-
          ISOLATE WHAT CHANGED: BLAKE3 altered the message schedule, the round
          count, and the finalization relative to BLAKE2s. Score each change
          separately where the design permits, so a divergence is attributed to
          a mechanism rather than to the pair of names.
      - >-
          THE TREE MODE AS A FINITE AUDIT: enumerate the domain-separation
          surface — chunk-start, chunk-end, parent, root, keyed and
          key-derivation modes, chunk counters, and the input length encoding —
          and check exhaustively within a stated class whether two semantically
          distinct inputs can present identically to the compression function.
          This is a FINITE CHECK ON A FIELDED DESIGN and needs no solver.
      - >-
          THE FREE NEARBY-OBJECT CONTROL: BLAKE's round function is ChaCha's
          quarter-round with message injection. The published differential-linear
          frontier on reduced-round ChaCha is therefore a control the literature
          set up at no cost — an instrument that cannot reproduce the ChaCha
          frontier has not earned the right to a claim about BLAKE3's.
    methods:
      - >-
          Automated characteristic and differential-linear search with encoding,
          solver version, seed, and wall-clock ceiling declared before the run,
          using the instrument calibrated under RQ-MDFIVE.
      - >-
          Identical pipelines across BLAKE3, BLAKE2s, and reduced-round ChaCha,
          so that any difference reported is a difference between primitives
          rather than between analyses.
      - >-
          Exhaustive enumeration of the flag/counter/length surface within a
          declared class, with any region left unenumerated named explicitly.
      - >-
          Certificate-first execution: any claimed distinguisher or collision is
          emitted as a literal input pair and re-verified independently.
    claim_tier_ceiling: >-
      REDUCED-ROUND AND STRUCTURAL ONLY. NOTHING HERE MAY BE READ AS A STATEMENT
      ABOUT FULL SEVEN-ROUND BLAKE3 OR ABOUT ANY DEPLOYED SYSTEM USING IT. A
      divergence between bound-per-round curves is a divergence between curves;
      converting it into a margin claim requires an extrapolation that is
      forbidden here as a claim and admissible only as a clearly labelled
      conditional projection. A domain-separation gap, if one is found, is a
      statement about the mode within the enumerated class, and it is reported
      to maintainers as a defect rather than exercised against anything.
  motivation: >-
    BLAKE3 is the most widely deployed unstandardized hash function of the last
    decade, and the single design decision that its security most visibly rests
    on — seven rounds instead of ten or twelve — is justified by transferring a
    margin measured on a different permutation with a different message
    schedule. The transfer may well be sound. But it is an ARGUMENT rather than
    a MEASUREMENT, and it is exactly the kind of inherited quantity this program
    was built to re-derive: cheap to test, load-bearing if wrong, and untested
    for the specific reason that BLAKE3's lineage makes the answer feel obvious.
    The tree mode is the second target and is cheaper still: domain separation
    is a finite property over a small flag space, and finite properties of
    fielded designs are where an error survives longest because nobody re-checks
    what a proof sketch already covered. Both objects are reachable inside a
    campaign budget, and ChaCha supplies a control that costs nothing.
  decision_target: >-
    Whether the BLAKE2-to-BLAKE3 margin transfer holds under a like-for-like
    measurement of bound-per-round curves, and whether BLAKE3's tree-mode domain
    separation is total within an enumerated class.
  provenance: >-
    OBTAINED BY WEB-SEARCH EXCERPT ON 2026-08-09, NOT FILED AS KN-LIT AND NOT
    READ IN PRIMARY TEXT BY THIS PROGRAM. RESEARCH TARGETS TO BE RE-READ, not
    facts on record here: BLAKE3 described as using seven rounds against ten to
    twelve for BLAKE2, giving a tighter margin; the design team's stated
    justification that cryptanalysis of BLAKE2 showed seven rounds to be a
    comfortable margin and that the reduction gives a substantial speed boost;
    excerpt claims that after five-plus years of public scrutiny no attack has
    approached the seven-round design and that published cryptanalysis reaches
    only a fraction of the full round count. The excerpts obtained contained NO
    SPECIFIC ATTACK, ROUND COUNT, OR COMPLEXITY for either BLAKE2 or BLAKE3, and
    several were vendor or blog material rather than primary sources. THE
    SPECIFIC BLAKE2 CRYPTANALYSIS THAT THE TRANSFER ARGUMENT RESTS ON MUST BE
    LOCATED AND FILED; without it there is no baseline to measure the transfer
    against and this question cannot proceed past acquisition.
  constraints:
    - >-
      No experiment may be designed until the BLAKE3 specification, the BLAKE2
      cryptanalysis the transfer argument cites, and a reduced-round ChaCha
      differential-linear result are filed as KN-LIT entries at stated
      provenance levels.
    - >-
      Reference implementations of BLAKE3 and BLAKE2s must be pinned and
      validated against published test vectors, INCLUDING the keyed and
      key-derivation modes and multi-chunk inputs, before any audit runs. A
      domain-separation audit against a subtly wrong implementation would
      produce a spurious finding of exactly the kind hardest to retract.
    - >-
      The instrument is the one calibrated under RQ-MDFIVE and must reproduce
      the published reduced-round ChaCha frontier before any BLAKE3 claim is
      recorded.
    - >-
      A failed search is a BUDGET OUTCOME about a solver, never evidence of
      absence (AGENTS.md rule 3).
    - >-
      Bound-per-round curves are compared only where the two pipelines are
      demonstrably identical. A comparison across differing encodings or budgets
      measures the encodings.
    - >-
      If a domain-separation gap is found it is disclosed to the maintainers
      before publication, and no record produced here may be written as a
      statement about the security of any deployed system using BLAKE3.
  status: active
  owner: coordinator
  created_at: '2026-08-09'
