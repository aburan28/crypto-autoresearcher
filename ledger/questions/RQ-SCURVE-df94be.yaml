research_question:
  id: RQ-SCURVE-df94be
  goal_id: GOAL-SCURVE-3e3cb4
  title: What concrete, independently checkable weaknesses exist around P-192 and its valid isogeny class?
  scope:
    curve_families:
      - NIST P-192 / secp192r1
      - same-a singular invalid-input companion y^2=x^3-3x-2
      - valid ordinary curves in the P-192 F_p-isogeny class
    field_types:
      - prime field F_p
    bit_sizes:
      - 192
    methods:
      - invalid-curve and singular-companion scalar-multiplication misuse
      - x-only confirmation-oracle key recovery
      - adaptive prime-power and composite-order residue recovery
      - legitimate-curve interval baby-step giant-step
      - exact binary-quadratic-form class relations
      - Frobenius-oriented isogeny construction and charged map evaluation
  motivation: >-
    Replace blind isogeny walking with two sharply separated tests: a realistic
    unchecked-interface exploit against a singular input, and a bounded exact
    search for useful relations inside the valid isogeny class.
  decision_target: >-
    Classify each tested mechanism as implementation weak, valid-isogeny weak,
    candidate only, or no weakness found within its exact frozen scope.
  constraints:
    - Public and synthetic fixed-seed material only; no live-key targeting.
    - Native Rust execution and native arithmetic verification; Python is not an experiment engine.
    - Exact algebraic certificates take precedence over statistical rhetoric.
    - Wall time is reported but is not the primary security-cost unit.
    - The singular companion must never be described as isogenous to P-192.
  status: active
  owner: coordinator
  created_at: '2026-10-06'
  first_batch:
    id: BATCH-00628c
    path: coordination/goals/GOAL-SCURVE-3e3cb4/batches/BATCH-00628c/batch.yaml
