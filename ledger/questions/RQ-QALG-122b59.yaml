research_question:
  id: RQ-QALG-122b59
  title: >-
    Does a quantum algorithmic mechanism exist that moves the exponent of the
    best currently known quantum attack against quasi-cyclic syndrome
    decoding, the hardness assumption underlying HQC?
  scope:
    curve_families: []
    field_types:
      - quasi-cyclic Hamming codes; syndrome decoding over F_2 (code-based)
    bit_sizes:
      - HQC-128
      - HQC-192
      - HQC-256
    methods:
      - quantum-accelerated Information Set Decoding (e.g. Grover/amplitude
        amplification layered on classical ISD variants -- Prange, Stern,
        Dumer, BJMM -- following the Bernstein / Kachigar-Tillich line)
      - quantum walk approaches to ISD subroutines
      - any other quantum mechanism proposed against quasi-cyclic syndrome
        decoding specifically as a QUANTUM algorithm, not a classical
        decoding-failure-rate or ISD cost-model estimate
  motivation: >-
    The best publicly known quantum attack against quasi-cyclic syndrome
    decoding is Grover/quantum-walk-accelerated ISD: a polynomial-in-the-square-
    root speedup layered on the same classical ISD search structure, with no
    known BQP structural algorithm that changes the exponent of the underlying
    decoding problem itself. This question searches in good faith for a
    mechanism that would move that exponent -- an exponent-moving target per
    docs/target-result-profile.md -- while treating a rigorous, documented null
    result (a completed falsification search per docs/inventor-protocol.md) as
    a fully legitimate and likely outcome. This question is DISTINCT from
    RQ-HQC-001 (GOAL-HQC-001, active): that goal's target is HQC's analytic
    decoding-failure-rate (DFR) model -- whether the model that carries the
    IND-CCA argument is correct under direct measurement at reduced parameters
    -- plus a memory-charged CLASSICAL ISD baseline at HQC's selected
    parameters, and a separate timing/side-channel claim class. GOAL-HQC-001
    does not search for a quantum algorithmic mechanism, and its DFR-model and
    classical-ISD-cost results do not bear on whether a better QUANTUM
    decoding algorithm exists; conversely, nothing found under this question
    bears on the correctness of HQC's DFR model or its classical ISD baseline.
    No cost figure, mechanism, or conclusion transfers between this question
    and RQ-HQC-001, or between this question and the two sibling questions
    under GOAL-QALG-001 (RQ-QALG-457b41 for ML-KEM, RQ-QALG-74bf20 for CSIDH):
    the three target unrelated hard-problem families and a result on one says
    nothing about the others.
  decision_target: >-
    Whether a specific quantum mechanism reaches a fully charged, independently
    reviewed asymptotic-complexity claim against quasi-cyclic syndrome decoding
    that improves on the Grover/quantum-walk-ISD baseline for at least one
    standardized HQC parameter set, or whether a rigorous falsification search
    closes the searched lanes with a named obstruction.
  constraints:
    - No claim may exceed the exact parameter sets, quantum cost model
      (gate count, circuit depth, QRAM/QRACM assumptions), and oracle model
      analyzed.
    - The comparison baseline is the best currently known QUANTUM attack
      (Grover/quantum-walk-accelerated ISD), stated explicitly and matched on
      cost accounting; a claim that only beats a weaker or unstated baseline
      is not admissible.
    - Any proposal under this question requires a proof_search_map (exact
      bottleneck, baseline reproduction, observation-collision search,
      quantifier order, method ceiling, nearby-object control per
      docs/inventor-protocol.md section 8 / knowledge/techniques/KN-TECH-080.md)
      before the Coordinator approves implementation or expensive experiments.
    - This question does not adjudicate, restate, or depend on HQC's
      decoding-failure-rate model correctness (RQ-HQC-001's subject); a
      quantum-decoding mechanism proposal must not assume the DFR model is
      correct beyond what is published, and must not cite GOAL-HQC-001
      measurement results as load-bearing.
    - Toy-instance or small-parameter improvements are hypothesis-generating
      only and are not reported as statements about standardized HQC.
    - Timeouts, crashes, and resource exhaustion are infrastructure outcomes,
      not cryptanalytic evidence (AGENTS.md rule 3 / CLAUDE.md rule 3).
    - No result, mechanism, or cost figure transfers between this question and
      RQ-HQC-001, RQ-QALG-457b41, or RQ-QALG-74bf20.
  status: active
  owner: coordinator
  created_at: '2026-08-11'
