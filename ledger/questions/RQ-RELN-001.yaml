research_question:
  id: RQ-RELN-001
  title: >-
    What is the measured decomposition probability versus factor-base size for
    contested prime-field Semaev/Petit-Kosters-Messeng constructions under
    matched controls?
  scope:
    curve_families: [generic prime-field short-Weierstrass]
    field_types: [prime]
    bit_sizes: [toy only until charged protocol approval]
    methods: [factor_base_design, decomposition_probability, sparse_linear_algebra_budgeting]
  motivation: >-
    KN-LIT-009 complexity claims are contested; KN-LIT-025 is the direct prior art
    for prime-field algebraic ECDLP. Relation probability is the other half of
    any IC-vs-rho exponent (with G4 solving cost).
  decision_target: >-
    A frozen measurement protocol for P(decomp) vs base size with explicit
    controls and certificate obligations, or a scoped no-go against honest
    measurement under the Tier path cost contract.
  constraints:
    - Treat published heuristic exponents as reported until reproduced.
    - First batch is review-only protocol design.
  status: active
  owner: coordinator
