research_question:
  id: RQ-NISTBIN-06157b
  title: >-
    Index calculus on the FIPS 186-4 binary curves B-/K-{163, 233, 283, 409, 571}:
    with every field degree prime and the standardised sizes reaching 571 bits,
    where does a fully charged subspace-factor-base decomposition stand against
    Pollard rho, what does the Koblitz structure of the K-curves buy the attacker
    beyond the rho-side saving, and is there any mechanism whose measured scaling
    exponent would matter at these sizes?
  scope:
    curve_families:
      - >-
        Pseudo-random B-curves: y^2 + xy = x^3 + x^2 + b over F_{2^m}, cofactor 2,
        m in {163, 233, 283, 409, 571}.
      - >-
        Koblitz K-curves: y^2 + xy = x^3 + a x^2 + 1 over F_{2^m}, a = 1 for K-163
        (cofactor 2) and a = 0 for K-233, K-283, K-409, K-571 (cofactor 4).
      - >-
        Scaled-down siblings for measurement: random (a = 1) and Koblitz (a in
        {0,1}, b = 1) curves over F_{2^m} for PRIME m this machine can decompose,
        with the standard's own field-polynomial shapes (trinomial or pentanomial)
        where a scaled analogue exists.
    field_types:
      - >-
        F_{2^m}, m PRIME: 163, 233, 283, 409, 571 -- verified by computation in
        inputs/FIPS186-4-BINARY-CURVES/. No proper subfield other than F_2 exists
        for any target. Field polynomials as read from Appendix D.1.3.
    bit_sizes:
      - 'targets: 163, 233, 283, 409, 571'
      - 'measurable: prime m in roughly [17, 61], to be fixed per contract, shared with RQ-CERTBIN-836ce2 where the objects coincide'
    methods:
      - >-
        Semaev / Diem index calculus with factor base F_V = {P : x(P) in V}, V an
        F_2-linear subspace of dimension l chosen by the attacker; V is the primary
        independent variable, exactly as in RQ-CERTBIN-836ce2, with coordinate,
        Frobenius-stable (K-curves), trace-structured and random V at matched l.
      - >-
        Koblitz structure on the K-curves: tau-adic / Frobenius orbits acting on
        both the rho side (the known sqrt(m) saving) and the index-calculus side
        (orbit-aware factor bases, orbit-quotiented relation collection), measured
        separately so the two savings are never summed as one.
      - >-
        Solvers: Groebner (F4 via msolve or equivalent), SAT over the Boolean
        descent (WDSat with XOR reasoning and symmetry breaking; a CDCL+XOR
        control), and the chained-S_3 Boolean formulation this program instruments.
      - >-
        The larger-size question, posed here because these are the standardised
        instances at 409 and 571 bits: which candidate mechanisms -- higher n' with
        symmetrisation, hybrid guess-and-SAT, relation recycling across V-orbits,
        structured V with cheap membership, or anything ideation produces -- change
        the EXPONENT of per-relation cost in m rather than its constant, measured
        on the scaled siblings and extrapolated only under numbered heuristics.
      - >-
        Fully charged cost accounting per ICPERF discipline, with the m-charged
        parallel rho measured on this machine as the comparator at every cell.
  motivation: >-
    These are the binary curves that were actually deployed for twenty years, at
    sizes the Certicom challenges never reach, and the corpus cites them by name
    over a hundred times while holding no normative source for them. They share
    the no-subfield structure of the challenge family exactly -- every degree is
    prime -- so a factor base must be a chosen subspace V, and the user's question
    about a more performant V is the whole question here too. They add two things
    the challenges do not: standardised Koblitz curves at five sizes, which is where
    Frobenius-aware factor bases (GOAL-FROB-6333a9's object) can be measured against
    the rho-side saving the structure is already known to give; and sizes up to 571,
    which is where "index calculus at larger sizes" either has a measured scaling
    exponent worth stating or does not. The program has costed these degrees once
    (EXP-SEMBIN-992e73) from a talk transcript under Semaev 2015's own model; this
    question asks for the measurement rather than the model.
  decision_target: >-
    A committed Coordinator decision stating, on prime-m scaled-down siblings with
    the ten FIPS curves as declared endpoints, (1) the fully charged per-relation
    cost under a Groebner baseline as a function of m at a fixed (n', l) policy,
    with its measured exponent; (2) for factor-base subspace choice on B-curves,
    whether any non-coordinate V changes decomposition probability or solver cost
    by a factor surviving size-matched random-V and shape-matched null controls, or
    explicitly does not; (3) for K-curves, the index-calculus-side Frobenius saving
    measured separately from the rho-side sqrt(m) saving, against size-matched
    non-orbit controls; (4) for SAT formulation, whether it moves per-relation cost
    against Groebner on identical instance bytes; (5) the crossover, if any, against
    m-charged rho at measured sizes; and (6) an explicit extrapolation boundary
    naming which claims, under which numbered heuristics, bear on m = 163 and which
    on nothing above the largest measured m. Either direction satisfies the target;
    an unmeasured comparison does not.
  constraints:
    - >-
      OBJECT FIRST. Every contract names the FIPS curve or the prime-m sibling it
      measures, with m, the field polynomial shape, a, and whether it is Koblitz.
      A contract that uses a specific FIPS curve verifies its parameters from the
      frozen standard before use, as the Oakley package does.
    - >-
      Scale is disclosed, never laundered. Any statement about m >= 163 names the
      heuristic it rides on and that heuristic's validation route; a statement
      about m = 571 additionally states the ratio of the extrapolation span to the
      measured span.
    - >-
      Two savings, two measurements. The Koblitz rho-side sqrt(m) saving and any
      index-calculus-side orbit saving are measured against separate controls and
      never presented as one combined factor.
    - >-
      Controls before belief. Size-matched random V, shape-matched random Boolean
      systems, and Groebner-versus-SAT identity on shared instance bytes, on every
      claimed advantage.
    - >-
      Charge everything, including the rho comparator's per-step cost on this
      machine rather than a literature figure.
    - >-
      Do not duplicate. Reuse by reference: the FROB dimension tables and
      HEUR-FROB-WDSAT-NULL, the SATIC instruments, the WDSat vendored source and
      ICPERF regression gate, KN-FIND-936151's first-fall-degree boundary, and
      EXP-SEMBIN-992e73's cost model as the thing to be measured against.
    - >-
      A timeout, memory cap, or solver crash is an infrastructure fact and never
      evidence about the curve (AGENTS.md rule 5).
    - >-
      Nothing here asserts anything about the security of any deployed system. The
      binary curves were withdrawn from the standard's successor; the interest is
      the object family and the sizes.
  status: active
  owner: coordinator
  provenance:
    posed_at: '2026-09-22'
    posed_by: coordinator, on user direction of 2026-09-22
    object_source: SRC-FIPS186-4-BINARY-CURVES (inputs/FIPS186-4-BINARY-CURVES/)
    siblings: [RQ-CERTBIN-836ce2, RQ-OAKLEY-264353]
    the_three_questions_as_one_design: >-
      OAKLEY (composite degree, subfield factor base canonical, GHS applies),
      CERTBIN (prime degree, challenge family, subspace factor base required), and
      NISTBIN (prime degree, standardised family reaching 571 bits, subspace factor
      base required, Koblitz at five sizes). Together they make subfield-versus-
      subspace factor bases a controlled comparison and give the larger-size
      question its standardised instances.
    rolls_up_to: GOAL-ECDLP2M-001
    rolls_up_note: >-
      Same letters-only sibling-area reason recorded in
      orchestration/research-priority.yaml. The goal head is not edited here;
      another session holds its QSP lane.
