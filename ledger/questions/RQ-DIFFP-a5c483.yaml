research_question:
  id: RQ-DIFFP-a5c483
  title: >-
    MD5 and SHA-1 differential paths: is the reachable difference space actually
    tiled by the published characteristics and disturbance vectors, and what
    would make a claim of a NEW path falsifiable in the first place?
  scope:
    scheme: >-
      MD5 (RFC 1321) and SHA-1 (FIPS 180-4), full and step-reduced, in the
      COLLISION/near-collision setting only. SHA-0 (FIPS 180) enters as the
      nearby-object control for the SHA-1 message expansion and is not itself a
      target.
    family: >-
      Merkle-Damgard, ARX, differential cryptanalysis of hash functions:
      message-difference vectors with signed bit-difference characteristics and
      sufficient bitconditions (MD5 lineage), and disturbance vectors drawn from
      the linearized message-expansion code with local collisions placed at the
      set bits (SHA/SHA-1 lineage). Method context in this corpus:
      knowledge/techniques/KN-TECH-066.md (message modification, freedom-degree
      accounting), knowledge/techniques/KN-TECH-080.md (proof_search_map).
    tracked_object: >-
      THE DIFFERENTIAL PATH ITSELF, not a collision and not a cost model. For
      MD5: a message-difference vector delta_m over the sixteen 32-bit words,
      plus the per-step signed bit-difference path on the working state, plus
      the sufficient-condition set. For SHA-1: a disturbance vector (a codeword
      of the linearized message expansion), plus the near-collision path the
      local collisions induce, plus its conditions. This is the object-first
      framing required by docs/inventor-protocol.md section 1.
    assumption: >-
      NONE ABOUT HARDNESS. Both primitives are broken for collisions, publicly
      and with certificates. What is ASSUMED, everywhere, and nowhere checked in
      this program's corpus, is that the published characteristics and
      disturbance-vector families EXHAUST the useful part of the difference
      space -- that a search would only re-find them. Under
      docs/inventor-protocol.md that assumption is a hypothesis about the
      search, not a fact about the object, and it is currently `unverified`.
    standardization_status: >-
      MD5 withdrawn from security use; SHA-1 deprecated and disallowed for new
      signatures yet still load-bearing in Git object identifiers, legacy
      HMAC-SHA-1, and long-lived archives. Neither is a live security margin;
      the scientific content here is about the STRUCTURE OF THE DIFFERENCE
      SPACE, and about the reach of an automated search over it, which is the
      part that transfers.
    targets:
      - >-
          THE ADJUDICATION PROBLEM, WHICH COMES FIRST AND IS THE POINT OF THIS
          QUESTION: a claim that a differential path is NEW is UNFALSIFIABLE
          until three objects exist. (a) A MACHINE-READABLE CENSUS of the
          published paths and disturbance vectors, each entry carrying its
          citation provenance per AGENTS.md rule 9. (b) A DECLARED EQUIVALENCE
          RELATION saying when two paths are the SAME OBJECT -- step shifts, bit
          rotations, global sign flips, signed-digit representation changes,
          condition-set normalisation, block-index re-use. (c) A VERIFIER that
          adjudicates a candidate against the census under that relation, with a
          null control proving it can answer NO. Without all three, "new" and
          "already known" are both unsupportable, in either direction.
      - >-
          MEASURE THE TILING, THEN DECIDE WHETHER TO SEARCH: how many distinct
          orbits does the published census occupy under the declared
          equivalence, and how much of the reachable, budget-feasible difference
          space do those orbits cover? Both extreme answers are informative and
          neither is a failure. If the published families already tile the
          reachable space, that is a NAMED OBSTRUCTION recorded under the
          closure standard, with the covering quantity measured. If the census
          collapses to very few orbits, the space of genuinely new paths is
          larger than the literature's coverage suggests and the search is
          worth its budget.
      - >-
          MD5 DELTA-M FAMILIES BEYOND THE PUBLISHED LINEAGE: whether message-
          difference vectors outside the ones the published attacks use admit
          characteristics whose condition count is within reach of message
          modification. The screen is the condition count and the surviving
          degrees of freedom (KN-TECH-066), computed rather than asserted.
      - >-
          SHA-1 DISTURBANCE-VECTOR CLASSES OUTSIDE THE PUBLISHED FAMILIES: the
          disturbance vector is a codeword of a LINEAR code, so the search space
          is enumerable in a way the MD5 space is not, and the question of which
          codewords the published families do and do not reach is decidable
          rather than rhetorical.
      - >-
          STEP-REDUCED TARGETS THAT ARE ACTUALLY REACHABLE: which reduced-round
          variants of either primitive admit a full search-and-verify cycle
          inside a campaign budget, so that a claimed new path can be driven to
          a literal conforming pair and certified rather than argued.
    methods:
      - >-
          Census-plus-equivalence-plus-verifier, built and controlled BEFORE any
          expensive search. The controls are the load-bearing part: a planted-
          positive control (a synthetic path and its images under every declared
          equivalence generator must adjudicate MEMBER) and a random-negative
          null control (decoy difference vectors must adjudicate NON-MEMBER
          against a census that contains plantable entries, so that a false
          positive is POSSIBLE and the null is not vacuous).
      - >-
          Verification of the equivalence generators themselves, not assumption
          of them. A generator is admitted to the group only if it is checked to
          map conforming paths to conforming paths on the primitive's own step
          function. Unverified generators are declared and EXCLUDED, and the
          adjudicator reports the strict and permissive verdicts separately.
      - >-
          Observation-collision search (KN-TECH-080 audit 2) against the
          canonical form: distinct ground-truth objects sharing one canonical
          form falsify the equivalence as too coarse; a path and a known-
          equivalent image with different canonical forms falsify it as too
          fine. Both are cheap and both are direct falsifiers.
      - >-
          Nearby-object control (KN-TECH-080 audit 4): SHA-0's message expansion
          differs from SHA-1's by one rotation. An adjudicator that cannot
          separate the two disturbance-vector spaces has not captured the
          load-bearing structure and its verdicts mean less than they appear to.
      - >-
          Certificates for anything claimed: a claimed conforming path is
          reported with a literal message pair that conforms to it, re-verified
          by an independent reference implementation
          (docs/claims-and-verification.md).
    claim_tier_ceiling: >-
      NO PATH IS CLAIMED NEW AND NO CRYPTANALYTIC IMPROVEMENT IS CLAIMED FROM
      THE ADJUDICATION MACHINERY. An adjudicator verdict is a claim about the
      CENSUS AND THE DECLARED EQUIVALENCE, scoped to both, and it is exactly as
      strong as the census is complete -- which, on the corpus as it stands, is
      not very. A NON-MEMBER verdict against an incomplete census means "not in
      this census", never "not in the literature". Any conforming-path claim
      carries a literal pair, independently re-verified. Nothing here is a new
      collision, a new attack, or a statement about any deployed system. Every
      figure is scoped to the tested primitive, step count, parameters and
      budget.
  motivation: >-
    The campaign brief is to find NEW differential paths for MD5 and SHA-1. The
    first honest observation about that brief is that this program cannot
    currently tell whether a path is new, and would not be able to tell if it
    found one. There is no census, no declared notion of when two paths are the
    same object, and no verifier -- so a search that returned a characteristic
    tomorrow would produce an unfalsifiable claim in either direction, and a
    search that returned nothing would produce a fatigue report, which
    docs/inventor-protocol.md section 4 explicitly refuses to accept as a
    closure. Building the adjudicator first is not preliminary work; it is the
    cheap gate that can FAIL, and it can fail informatively both ways.
    The second observation is that "MD5 and SHA-1 are broken, so the path space
    is mined out" is precisely the premature closure the inventor protocol names
    as a failure mode symmetric with overclaiming. The claim is checkable: the
    SHA-1 disturbance vector lives in a linear code, so the covering question is
    decidable, and the answer is not on record here. Whichever way it comes out
    is a result.
  decision_target: >-
    Whether this program can hold a checkable notion of "a new differential path
    for MD5 or SHA-1" -- census, equivalence, verifier, controls -- and, once it
    can, whether the published families tile the reachable difference space or
    leave a measured, budget-feasible remainder worth searching.
  provenance: >-
    NO PRIMARY SOURCE FOR EITHER PRIMITIVE'S PATH DATA WAS READ BY THIS TASK, and
    this record asserts no figure from the literature. Two facts about THIS
    REPOSITORY were checked directly and are stated as observations about the
    corpus, not about the literature: (1) the only MD5 collision-path source
    filed here is KN-LIT-87e00e (Wang-Feng-Lai-Yu, IACR ePrint 2004/199), whose
    entry deliberately carries NO path data -- the characteristic is quarantined
    under GOAL-MD5-001's BCP-1 firewall at
    coordination/goals/GOAL-MD5-001/quarantine/MD5-COLLISION-PATH-WANG-2004-199.yaml,
    sha256 e44a3fed81e9e7621697432b2124b357fc2c3f502f4bc6779df5c377b0a3e3c5,
    referenced by digest only; and (2) a search of knowledge/literature for
    SHA-1-tagged entries returned none carrying disturbance-vector data. So the
    census this question requires cannot presently be populated from readable
    in-repository sources for EITHER primitive. That is a measured acquisition
    gap, recorded here at the outset rather than discovered later.
  citations:
    - ref: KN-LIT-87e00e
      provenance: internal
      claim: >-
        This program's own committed literature entry for the first published
        MD5 collision attack. Bibliography and provenance only; the entry states
        explicitly that it carries no characteristic, no message blocks and no
        colliding pair, and points at the quarantined payload by sha256.
      verified_by: TASK-20260824-531f8a (read in full this session)
    - ref: knowledge/techniques/KN-TECH-066.md
      provenance: internal
      claim: >-
        This program's own technique entry for differential cryptanalysis of
        hash functions: message modification spends degrees of freedom against a
        CHOSEN path, and local collisions plus disturbance vectors are the SHA
        -family form of the same accounting. Its own "Verified vs reported"
        section states that this corpus holds no KN-LIT entry for the Wang et
        al. SHA-1 work.
      verified_by: TASK-20260824-531f8a (read in full this session)
    - ref: "Wang, Yin, Yu -- Finding Collisions in the Full SHA-1 (CRYPTO 2005)"
      provenance: recalled
      claim: >-
        RECALLED POINTER, NOT SUPPORT. Believed to be the first full-SHA-1
        collision attack built on a disturbance vector; named here so a reviewer
        or an acquisition task knows where to look. No agent in this program has
        opened it and nothing in this record rests on it.
      verified_by: null
    - ref: "Chabaud, Joux -- Differential Collisions in SHA-0 (CRYPTO 1998)"
      provenance: recalled
      claim: >-
        RECALLED POINTER, NOT SUPPORT. Believed to be the origin of the
        linearized-code / local-collision framing that disturbance vectors are
        drawn from, and therefore the natural source for the SHA-0 nearby-object
        control. Unopened here.
      verified_by: null
    - ref: >-
        "Manuel -- Classification and Generation of Disturbance Vectors for
        Collision Attacks against SHA-1 (Designs, Codes and Cryptography, circa
        2011)"
      provenance: recalled
      claim: >-
        RECALLED POINTER, NOT SUPPORT, AND THE SINGLE MOST RELEVANT ONE. Believed
        to classify usable SHA-1 disturbance vectors into two families indexed by
        a step offset and a bit rotation, which is exactly the census-plus-
        equivalence object this question needs. If that recollection is right,
        this paper is the highest-value acquisition target in the campaign. It is
        UNOPENED, the family structure is UNVERIFIED, and no record here may
        treat it as establishing what the published census contains.
      verified_by: null
    - ref: >-
        "De Canniere, Rechberger -- Finding SHA-1 Characteristics: General
        Results and Applications (ASIACRYPT 2006)"
      provenance: recalled
      claim: >-
        RECALLED POINTER, NOT SUPPORT. Believed to introduce automated search
        for SHA-1 characteristics over generalized bit conditions. Relevant to
        the search instrument a later batch would need; unopened here.
      verified_by: null
    - ref: >-
        "Stevens et al. -- chosen-prefix MD5 collisions (EUROCRYPT 2007) and the
        SHA-1 line through joint local-collision analysis (EUROCRYPT 2013) and
        the first full SHA-1 collision (CRYPTO 2017)"
      provenance: recalled
      claim: >-
        RECALLED POINTERS, NOT SUPPORT, grouped because the recollection is
        coarse. Believed to be the modern lineage for both primitives' paths.
        Unopened here; every attribution, date and result in this entry is
        unverified and must be read from primary text before any use.
      verified_by: null
  constraints:
    - >-
      NO CLAIM THAT ANY PATH IS NEW may be recorded by any batch of this
      question until the census, the declared equivalence relation, and the
      adjudicator with BOTH its controls exist as committed artifacts, and until
      the census's completeness is stated as a scope. A NON-MEMBER verdict is
      scoped to the census that produced it and is never reported as novelty.
    - >-
      THE PUBLISHED CENSUS IS BUILT ONLY FROM SOURCES AN AGENT ACTUALLY OPENED.
      Anything from a model's own knowledge is `recalled`, is a pointer for a
      reviewer, and may never populate a census entry, discharge a coverage
      claim, or support a `novelty_status` of `known` or `adaptation`
      (AGENTS.md rule 9).
    - >-
      GOAL-MD5-001'S BCP-1 QUARANTINE IS NOT CROSSED BY THIS QUESTION. No task
      here reads
      coordination/goals/GOAL-MD5-001/quarantine/**. The quarantined Wang
      characteristic may be carried in the census as a POINTER BY SHA256 with
      status `quarantined_not_read` and an UNDETERMINED orbit; it may not be
      opened, extracted, or reconstructed. Reading it from this goal would
      launder another goal's firewall, and the honest cost -- an MD5 census that
      is empty of readable path data -- is recorded rather than avoided.
    - >-
      A NULL CONTROL AGAINST AN EMPTY CENSUS IS VACUOUS and is recorded as
      vacuous. Every null-control run is executed against a census containing
      plantable entries, so that a false positive is possible; a null that
      cannot fail has measured nothing (docs/inventor-protocol.md section 3).
    - >-
      EVERY EQUIVALENCE GENERATOR IS VERIFIED OR EXCLUDED. Admitting an
      unverified generator under-declares novelty; omitting a real one
      over-declares it. Both verdicts are reported separately and neither is
      merged into a single number.
    - >-
      A FAILED OR EXHAUSTED SEARCH IS A BUDGET OUTCOME ABOUT A SOLVER, never
      evidence that no path exists (AGENTS.md rule 5). A count of screened-and-
      rejected difference vectors with no named, MEASURED obstruction is a
      fatigue report and is recorded `unverified`
      (docs/inventor-protocol.md section 4).
    - >-
      SEARCH-SOLVER VALIDATION IS NOT THIS QUESTION'S WORK. If a batch here
      finds itself measuring whether the characteristic-search instrument works
      rather than using it, that work belongs to GOAL-MD5-001 and is handed off
      (see GOAL-DIFFP-84d641 non_duplication).
    - >-
      Nothing here is reported as a statement about the security of any specific
      deployed system, repository, certificate or archive.
  status: active
  owner: coordinator
  created_at: '2026-08-24'
