research_question:
  id: RQ-QALG-457b41
  title: >-
    Does a quantum algorithmic mechanism exist that moves the exponent of the
    best currently known quantum attack against Module-LWE / Module-SVP, the
    hardness assumption underlying standardized ML-KEM?
  scope:
    curve_families: []
    field_types:
      - module lattices over cyclotomic polynomial rings (Module-LWE, Module-SVP)
    bit_sizes:
      - ML-KEM-512
      - ML-KEM-768
      - ML-KEM-1024
    methods:
      - quantum-accelerated lattice sieving (e.g. Grover/amplitude-amplification
        applied to classical sieve inner loops; quantum walk sieve variants)
      - quantum speedups to enumeration/BKZ-style reduction
      - any other quantum mechanism (quantum Fourier structure, quantum walk
        hidden-lattice-vector search, quantum random self-reduction) proposed
        against MLWE/MSVP specifically as a QUANTUM algorithm, not a classical
        cost-model estimate
  motivation: >-
    The best publicly known quantum attack against MLWE/MSVP is Grover-only: a
    quadratic amplitude-amplification speedup layered on top of the same
    classical lattice-reduction/sieving pipeline, with no known BQP structural
    algorithm (unlike Shor for factoring or discrete log) that changes the
    exponent of the lattice problem itself. This question searches in good
    faith for a mechanism that would move that exponent -- an exponent-moving
    target per docs/target-result-profile.md, not a constant-factor or
    logarithmic-cofactor gain -- while treating a rigorous, well-documented
    null result (a completed falsification search per docs/inventor-protocol.md)
    as a fully legitimate and likely outcome. This question is DISTINCT from
    RQ-MLKEM-001: RQ-MLKEM-001 (GOAL-MLKEM-001, closed_at_budget; GOAL-MLKEM-005,
    active) searches for ANY algorithmic mechanism -- classical or quantum,
    lattice-geometric, deployment-based, or failure-based -- that materially
    improves cryptanalysis of standardized ML-KEM, and treats quantum cost
    models as one item among many candidate angles. This question is scoped
    narrowly and exclusively to QUANTUM algorithms targeting the exponent of
    the underlying MLWE/MSVP hardness assumption itself, evaluated against the
    best known quantum baseline (Grover-only), and does not inherit or restate
    GOAL-MLKEM-005's classical-geometry findings or its "algebra is closed"
    constraint, which concerns a different (classical, algebraic-structure)
    line of attack. No cost figure, mechanism, or conclusion transfers between
    this question and RQ-MLKEM-001, or between this question and the two
    sibling questions under GOAL-QALG-001 (RQ-QALG-122b59 for HQC,
    RQ-QALG-74bf20 for CSIDH): the three target unrelated hard-problem
    families and a result on one says nothing about the others.
  decision_target: >-
    Whether a specific quantum mechanism reaches a fully charged, independently
    reviewed asymptotic-complexity claim against MLWE/MSVP that improves on the
    Grover-only baseline for at least one standardized ML-KEM parameter set, or
    whether a rigorous falsification search closes the searched lanes with a
    named obstruction.
  constraints:
    - No claim may exceed the exact parameter sets, quantum cost model
      (gate count, circuit depth, QRAM/QRACM assumptions), and oracle model
      analyzed.
    - The comparison baseline is the best currently known QUANTUM attack
      (Grover-amplified classical sieving/enumeration), stated explicitly and
      matched on cost accounting; a claim that only beats a weaker or
      unstated baseline is not admissible.
    - Any proposal under this question requires a proof_search_map (exact
      bottleneck, baseline reproduction, observation-collision search,
      quantifier order, method ceiling, nearby-object control per
      docs/inventor-protocol.md section 8 / knowledge/techniques/KN-TECH-080.md)
      before the Coordinator approves implementation or expensive experiments.
    - Toy-instance or small-parameter improvements are hypothesis-generating
      only and are not reported as statements about standardized ML-KEM.
    - Timeouts, crashes, and resource exhaustion are infrastructure outcomes,
      not cryptanalytic evidence (AGENTS.md rule 3 / CLAUDE.md rule 3).
    - No result, mechanism, or cost figure transfers between this question and
      RQ-MLKEM-001, RQ-QALG-122b59, or RQ-QALG-74bf20.
  status: active
  owner: coordinator
  created_at: '2026-08-11'
