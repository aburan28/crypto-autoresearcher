research_question:
  id: RQ-NTRU-9015ee
  title: >-
    NTRU's fatigue point is an asymptotic law with a constant fitted at small
    dimension — where does the dense-sublattice event actually sit for the ring
    shapes that are deployed, and how far are sntrup761 and ntruhps from it?
  scope:
    scheme: "NTRU (NTRU-HPS/HRSS), NTRU Prime (sntrup761, deployed in OpenSSH hybrid key exchange), matrix/module NTRU as the nearby object"
    family: "structured lattices; the overstretched-NTRU dense sublattice attack"
    standardization_status: >-
      RECALLED, UNVERIFIED: NTRU was a NIST PQC finalist not selected for
      standardization; sntrup761 is deployed in OpenSSH's default hybrid key
      exchange, which makes it one of the most widely executed post-quantum
      primitives in the world regardless of its standardization status.
    targets:
      - >-
        THE MEASURED FATIGUE POINT: reproduce the transition at toy dimension
        with CERTIFICATES — a recovered short vector re-verified independently —
        and fit the transition location and width, reporting confidence
        intervals rather than a single exponent.
      - >-
        THE RING-SHAPE QUESTION, WHICH IS THE POINT: the published law is
        usually derived and measured for one ring shape. NTRU Prime
        deliberately uses a different one (RECALLED: a large-Galois-group
        irreducible with prime degree and inert modulus). Does the transition
        move? A law that is insensitive to the ring is a stronger law; a law
        that moves is a correction that the deployed parameter margin should
        know about.
      - >-
        THE MARGIN: deployed (n, q) placed on the measured curve with the
        extrapolation's uncertainty shown, stated as a distance, never as a
        safety verdict.
      - >-
        THE GENERALIZATION SURFACE: matrix-NTRU and module-NTRU variants
        appear in newer constructions (including some in FHE and in signature
        proposals). Whether the dense-sublattice event generalizes with the
        same exponent is an open, measurable question at toy scale.
    methods:
      - Lattice reduction at toy dimension with certified output (the recovered secret re-verified), swept across q with n fixed and across n with q fixed.
      - Explicit measurement of the reduction profile (the "Z-shape") to detect the dense sublattice event directly rather than only through success/failure.
      - A planted-null control at every cell: a random lattice of identical dimension and determinant with no dense sublattice.
    claim_tier_ceiling: >-
      TOY-SCALE MEASUREMENT AND EXTRAPOLATION ONLY. No attack on any deployed
      parameter set is attempted or claimed. "The measured transition, if the
      fitted law is extrapolated, sits at X" is admissible; "sntrup761 is safe"
      and "sntrup761 is unsafe" are both inadmissible.
  motivation: >-
    sntrup761 runs in essentially every current OpenSSH connection, and the
    argument for its parameters includes the claim that it is far from the
    overstretched regime. That distance is computed from an asymptotic law with
    a constant fitted on small-dimension experiments — a quantity computed once
    and inherited. The experiment that checks it is the standard lattice
    reduction this program already runs elsewhere, it produces literal
    certificates, and it can be swept. The most interesting outcome is not that
    the margin is smaller, which is unlikely; it is that the law's constant
    depends on ring shape, which would mean the deployed variant was never the
    one measured.
  decision_target: >-
    Where the dense-sublattice transition sits as a function of (n, q, ring
    shape) under measurement, how wide it is, and how far the deployed
    parameters are from the extrapolated curve.
  provenance: >-
    RECALLED FROM MODEL MEMORY ON 2026-08-09. NOT WEB-SEARCHED, NOT PRIMARY-READ,
    NOT FILED AS KN-LIT. Research targets: Kirchner-Fouque (RECALLED as the
    origin of the overstretched-NTRU sublattice attack), Ducas-van Woerden "NTRU
    fatigue" (RECALLED as locating the fatigue point near q = n^{2.484} for one
    ring shape, with the exponent obtained by a mix of analysis and experiment),
    the NTRU and NTRU Prime NIST submissions, and the OpenSSH release notes
    making sntrup761 hybrid the default. Every parameter and exponent named here
    is UNVERIFIED.
  constraints:
    - No measurement may be recorded before the fatigue-point reference and both submission specifications are filed as KN-LIT entries; the ring-shape comparison is meaningless without the specifications.
    - Every claimed recovery is emitted as a certificate (the short vector) and re-verified by an independent checker.
    - A failed reduction is a budget outcome about a lattice solver, never evidence that a parameter set is secure (AGENTS.md rule 3). Non-recovery at a cell is recorded as non-recovery.
    - Extrapolation is reported with its uncertainty; a fitted exponent quoted without its confidence interval is not admissible.
    - No statement about any deployed system's security may appear in any record produced under this question.
  status: active
  owner: coordinator
  created_at: '2026-08-09'
