research_question:
  id: RQ-CRYPTO-001
  title: Can a reproducible non-generic algorithm beat Pollard rho on cryptographic prime-field ECDLP?
  scope:
    curve_families:
      - standardized short-Weierstrass prime-field curves
      - ordinary prime-field curves used for staged controls
    field_types: [prime]
    bit_sizes: [toy, medium, cryptographic]
    methods:
      - non-generic representations
      - algebraic relation collection
      - structured linear algebra
      - descent
      - matched Pollard-rho baselines
  motivation: >-
    The existing corpus contains many scoped toy-scale negatives and several
    exact algebraic subroutines, but no complete, independently verified
    cryptographic-scale algorithm with a fully charged advantage over Pollard
    rho. The remaining uncertainty is whether a mechanism outside the closed
    representations can connect relation supply, source recovery, factor logs,
    and blind descent below the birthday bound.
  decision_target: >-
    Select, falsify, or advance mechanisms according to their cheapest decisive
    gate until one satisfies GOAL-CRYPTO-001's cryptographic completion
    criteria or the declared campaign pause conditions are reached.
  constraints:
    - Generic-group lower bounds remain applicable unless a genuinely non-generic oracle is explicitly constructed and costed.
    - Toy and medium results only authorize scaling work; they never satisfy the goal.
    - Every claimed solve or relation requires an independently reverified certificate.
    - Timeouts, crashes, and resource exhaustion are infrastructure outcomes, not mathematical evidence.
    - All preprocessing, memory, relation supply, linear algebra, descent, and verification costs must be charged.
  status: active
  owner: coordinator
