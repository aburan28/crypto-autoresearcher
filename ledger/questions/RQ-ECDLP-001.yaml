research_question:
  id: RQ-ECDLP-001
  title: How does the cost of Semaev S_3 point decomposition behave at toy prime-field scale?
  scope:
    curve_families: [short_weierstrass]
    field_types: [prime]
    bit_sizes: [8, 10, 12]
    methods: [semaev_summation_polynomial, groebner_basis, pollard_rho_baseline]
  motivation: >-
    KN-OPEN-002 asks how the Groebner solving cost of prime-field summation-
    polynomial decomposition systems grows. Before any scaling or crypto-scale
    question can be approached, the harness must produce trustworthy toy-scale
    measurements with matched baselines and verifiable certificates.
  decision_target: >-
    Whether the toy-scale S_3 decomposition measurement is stable and cheap
    enough to justify a medium-scale scaling study (expand) or needs redesign.
  constraints:
    - toy scale only (field bits <= 32); no crypto-scale claims
    - every solve/relation must carry an independently verified certificate
  status: active
  owner: coordinator
