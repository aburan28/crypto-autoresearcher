research_question:
  id: RQ-SEMBIN-ade131
  title: >-
    Is Semaev 2015 eq. (11) -- the symmetric-random-map success-probability model
    this program has already been citing as HEUR-SEMAEV-2015-4.3 while the paper
    was recorded unread -- the right yield law for the CHAINED system, and in which
    direction does its stated inequality bias relation cost?
  scope:
    curve_families:
      - E/F_{2^n}: Y^2 + XY = X^3 + A X^2 + B, the form of KN-LIT-fa346d
          Tables 1-2, with B = 1 and with B random
      - the toy prime-field curves GOAL-RELN-001 and GOAL-ICEX-001 already
          instrument, where an exact relation-yield law is available for m = 2 and
          the existing 2^m-type discrepancy was first seen (H-RELN-96e3ba)
    field_types:
      - binary extension fields F_{2^n}, n prime, Weil-descended over F_2
      - V an F_2-subspace of dimension k, both the low-degree polynomial subspace
          and a random k-dimensional subspace
    bit_sizes:
      - 'exact enumeration where the whole of V^t is countable: n <= 24 with
        tk - n in [-6, +6], the window where 1 - exp(-2^{tk-n}/t!) is neither
        saturated nor negligible and a discrepancy is therefore visible'
      - 'the paper''s own published probability cells, n in {12,13,14,15,16,17,19,21}
        and n = 40 at m = t = 2, k = 20, as calibration targets'
      - 'no execution above the enumeration ceiling; any statement at n = 409, 571
        is derivation from the law that survives'
    methods:
      - direct enumeration of realized decompositions of R over V^t via the chained
          S_3 system of KN-LIT-fa346d eq. (5), counted rather than sampled wherever
          |V|^t is small enough to enumerate exhaustively
      - the same count taken through the SINGLE summation polynomial eq. (4), as
          the matched comparison that isolates whether the chaining changes the
          yield law or only the solving cost
      - Monte Carlo over random R with exact per-R counts, so the reported
          discrepancy carries an error bar rather than a point estimate
      - matched null: a symmetric random map from V^t to F_q realized directly,
          which is the object eq. (11) actually models, giving the deviation
          attributable to the curve rather than to the model's shape
      - re-derivation of the paper's own bounding argument, P(one of the first t-1
          systems) >= P(n,m,t,k) >= P(solve eq. 5), to fix the sign of the
          approximation it then makes
  motivation: >-
    Two frozen protocols in this program -- experiments/EXP-RELN-164ad3 and the
    hypotheses H-RELN-cfa1a2 and H-RELN-96e3ba under GOAL-RELN-001, and the
    charged-exponent work under GOAL-ICEX-001 -- carry a reference curve named
    HEUR-SEMAEV-2015-4.3. That name points at Section 4.3 of a paper this program
    recorded as unread until 2026-09-13. Under AGENTS.md core rule 9 a recalled
    citation is a pointer and supports nothing, so those protocols were comparing
    measurements against a curve whose formula had never been checked against its
    source. Freezing the paper (inputs/SEMAEV-2015-310/) closed half of that gap:
    the formula is eq. (11), P(n,m,t,k) = 1 - (1-1/q)^K with K ~ |V|^t / t!, i.e.
    1 - exp(-2^{tk-n}/t!), and it reproduces every theoretical-probability cell of
    Tables 1-2 to the four printed decimals (KN-LIT-fa346d, "Re-checked here").
    The other half is open, and it is the substantive half. Three things are
    unresolved.
    First, eq. (11) is a heuristic about a SYMMETRIC RANDOM MAP, justified by
    treating x_1,...,x_t -> S_{t+1}(x_1,...,x_t,z) as uniform with |V|^t / t!
    classes. Nothing in the paper measures the realized yield of the chained
    system against it; Tables 1-2 report solving degree and time, and the
    probability column is the model's own output, not an observation. The model is
    therefore uncalibrated against the object it is used to cost.
    Second, the paper derives eq. (11) inside an explicit inequality --
    P(solve one of the first t-1 systems) >= P(n,m,t,k) >= P(solve eq. 5) -- and
    then assumes P(solve eq. 5) ~ P(n,m,t,k). An upper bound substituted for the
    true probability sits in the DENOMINATOR of relation-collection cost, so the
    approximation biases stage 1 cost DOWNWARD. The size of that bias is unknown
    and propagates directly into eqs. (15)-(17) and Table 3.
    Third, this program already has a signal. H-RELN-96e3ba reports a 2^m-type
    discrepancy between an exact relation-yield law and the HEUR-SEMAEV-2015-4.3
    curve at m = 2. Now that the curve is confirmed to be eq. (11), that
    discrepancy is either a real defect of the model, a difference between the
    chained and single-polynomial presentations, or an artifact of how the toy
    prime-field setting was mapped onto a formula derived for F_{2^n}. Nothing in
    this repository distinguishes those three.
  decision_target: >-
    A committed Coordinator decision that (a) states, from exhaustive enumeration
    over the window where |V|^t is countable, the measured ratio of realized
    decomposition yield to eq. (11) with error bars, separately for the chained
    eq. (5) and the single eq. (4) presentations; (b) fixes the SIGN and an
    empirical magnitude for the bias introduced by substituting the upper bound
    P(n,m,t,k) for P(solve eq. 5), and says what that does to the stage-1 cost in
    eqs. (15)-(17); (c) resolves H-RELN-96e3ba's 2^m discrepancy into one of the
    three named causes, or records exactly which measurement would; and (d) states
    whether the frozen HEUR-SEMAEV-2015-4.3 reference curve in EXP-RELN-164ad3
    remains a sound comparator, with an additive amendment rather than an edit if
    it does not.
  constraints:
    - >-
      This question is about the YIELD LAW and never about Assumption 1. eq. (11)
      is a probability model; Assumption 1 is a degree bound. They are independent
      claims and a result about one says nothing about the other. RQ-SEMBIN-fa2e3f
      owns the degree side.
    - >-
      A discrepancy against eq. (11) is not automatically a defect of eq. (11). It
      may be a difference between the chained and single presentations, which is
      why the matched eq. (4) count is required rather than optional, and it may be
      a mapping error between the F_{2^n} derivation and a toy prime-field
      instrument.
    - >-
      Count, do not sample, wherever |V|^t admits exhaustive enumeration. A
      sampled yield at small tk - n has a variance comparable to the effect and is
      the cheapest way to manufacture a discrepancy that is not there. Where
      sampling is unavoidable, the reported quantity carries an error bar.
    - >-
      Controls before belief. The matched null is a symmetric random map from V^t
      to F_q realized directly -- the object eq. (11) models -- so that the
      deviation attributable to the curve is separated from the deviation
      attributable to the model's shape. A yield statistic that does not move
      between the curve-derived and null maps is measuring the shape.
    - >-
      Frozen protocols are amended additively. If the HEUR-SEMAEV-2015-4.3
      reference curve turns out to be the wrong comparator for EXP-RELN-164ad3,
      the remedy is a new record and an additive amendment; the frozen
      specification and H-RELN-96e3ba are immutable and are not rewritten.
    - >-
      The paper's probability column is a model output, not data. Reproducing
      Tables 1-2's probability cells (already done arithmetically in the freezing
      session) is a check that this program computes eq. (11) correctly. It is not,
      and must never be reported as, evidence that eq. (11) is right.
    - >-
      Machine reality: roughly 8-16 GB usable, no MAGMA. The enumeration window is
      chosen so the count is exact and cheap; if a cell exceeds the machine, it is
      recorded as an impediment with a recheck rather than estimated (AGENTS.md
      rule 5).
