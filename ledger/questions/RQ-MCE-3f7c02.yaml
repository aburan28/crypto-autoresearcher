  # ---------------------------------------------------------------------
  # ONE DEFECT, THREE SITES, SUPERSEDED TOGETHER
  # ---------------------------------------------------------------------
  one_defect_three_sites:
    defect: >-
      BATCH-001 recorded arXiv:2304.14757's boundary as RATE-SCOPED. The paper
      states verbatim that its attack "does not work at all when the alternant
      code has the additional structure of being a Goppa code". The decisive
      restriction is the CODE FAMILY, and Classic McEliece uses binary Goppa
      codes.
    why_one_task: >-
      The three sites are the same sentence written three times. Superseding
      them in separate tasks would let a later task cite whichever site was
      corrected last and inherit the defect from the other two.
    originals_edited: false
    hashes_not_recorded: >-
      RQ-FBG-001's supersession pattern records a supersedes_sha256. NO SHA256
      IS RECORDED HERE: the role executing TASK-20260808-843c87 has no execute
      capability (orchestration/roles.yaml, may_execute_experiments: false) and
      could not compute one. Each site is instead pinned by path, locus, and
      the superseded text quoted verbatim, which is checkable by string match.
      Recorded as a gap rather than left implicit.
    sites:
      - site: 1
        locus: coordination/goals/GOAL-MCE-001/batches/BATCH-001/BATCH-001-OPENING.md
        section: "section 4, final paragraph"
        superseded_text: >-
          "The rate threshold is the whole question. KN-LIT-4c8135 is genuinely
          polynomial-time and genuinely confined to high rate. Classic
          McEliece's rate is a number this program has not transcribed. The
          distance between those two is what BATCH-001 exists to measure, and
          until it is measured neither 'the structural line threatens Classic
          McEliece' nor 'it does not' is a statement this program is entitled to
          make."
        superseded_by: >-
          coordination/goals/GOAL-MCE-001/batches/BATCH-a68f79/tasks/TASK-20260808-843c87/correction_report.md,
          section "SITE 1", plus this record.
        why: >-
          Falsified by BATCH-001's own primary text (DEC-20260803-a5b9b1 D-2).
          The batch's measurement plan was built on the rate axis; the decisive
          axis is the code family. The opening file is immutable and is outside
          this task's write scope, so its superseding note lives in the task
          report and its durable anchor is this ledger record.
        not_defective: >-
          The same section's bibliographic gloss "KN-LIT-4c8135 (polynomial-time
          key recovery, high-rate random alternant codes, IEEE-IT 2024)" is NOT
          superseded. It repeats the paper's own title and is accurate.
      - site: 2
        locus: ledger/questions/RQ-MCE-e65b3c.yaml
        section: "constraints, fifth item"
        superseded_text: >-
          "Rate-scoping is load-bearing, not decoration. KN-LIT-4c8135 is
          polynomial-time key recovery for HIGH-RATE random alternant codes; the
          threshold is the practically decisive number and no deliverable may
          state the headline without it."
        superseded_by: RQ-MCE-3f7c02 (this record), field replacement_constraint
        why: >-
          The clause is not false about the rate condition -- the paper does
          impose one -- but it names the wrong conjunct as decisive and, as
          written, forbids stating the headline without the RATE while saying
          nothing about the exclusion that actually decides applicability to
          binary Goppa codes.
        also_superseded: >-
          The same framing is repeated in scope.targets, second bullet, which
          calls this line "the rate-threshold structure of the alternant/Goppa
          distinguisher line" and asks for it "stated as a quantitative distance
          from Classic McEliece's actual rates". For arXiv:2304.14757 that
          distance is not the discriminator; the family exclusion is. The bullet
          is superseded only as it concerns KN-LIT-4c8135.
      - site: 3
        locus: knowledge/literature/KN-LIT-4c8135.md
        section: "Contribution; Key claims; Not verified here"
        superseded_text: >-
          "the result is confined to the high-rate regime, and that scoping is
          the whole content of its practical reading"; "The attack is
          rate-scoped -- it does not claim to break alternant or Goppa codes at
          arbitrary rate"; "that threshold is the single most important number
          in the paper".
        superseded_by: knowledge/literature/KN-LIT-c41d8b.md
        why: >-
          DEC-20260803-a5b9b1 D-4. The entry frames the restriction as
          rate-scoped, omits the Goppa exclusion entirely, and its one Goppa
          mention runs in the opposite direction: "it does not claim to break
          alternant or Goppa codes at arbitrary rate" implies the attack WOULD
          reach Goppa codes at high rate, which the paper explicitly denies.
        known_limitation: >-
          KN-LIT-c41d8b carries supersedes: KN-LIT-4c8135, but KN-LIT-4c8135
          still carries superseded_by: null and CANNOT be edited by this task
          (immutability, and the card forbids it). The link is therefore
          one-way, so retrieval that filters on superseded_by will still surface
          the defective entry. Anyone auditing this line must follow the
          supersedes link forward from KN-LIT-c41d8b or read this record.

  # ---------------------------------------------------------------------
  # THE CORRECTED BOUNDARY, AS THE SOURCE STATES IT
  # ---------------------------------------------------------------------
  corrected_boundary:
    source: "arXiv:2304.14757 (KN-LIT-4c8135), Bardet, Mora, Tillich, IEEE-IT 2024"
    source_sha256: ebbd94ac3cd00b0f0e723aeab56fd3b0820c89d47072fc8241f12c5f93c564b8
    quotation_verbatim: >-
      "Interestingly our attack does not work at all when the alternant code has
      the additional structure of being a Goppa code."
    quotation_location: >-
      In the extracted text the sentence stands directly under the paragraph
      heading "Opening the road for attacking the CFS scheme." The same
      restriction appears in Table 1, restriction column, row "this paper":
      "q = 2 or q = 3, m arbitrary + high rate condition (6) (does not apply in
      the particular case of Goppa codes)" (the extraction renders "=" as a
      left-quote glyph). Section 3.2 is headed "What is wrong with Goppa
      codes?" and states "Goppa codes behave differently from random alternant
      codes and provide counterexamples to Heuristic 18." NO PAGE NUMBER was
      recorded by the transcription and none is invented.
    quotation_provenance: >-
      RE-QUOTED, NOT RE-READ. The PDF is not stored in this repository and the
      session writing this record could not read it. The quotation comes from
      this program's committed verbatim transcription (TASK-20260803-292b99,
      attack_transcription.md section 3 and rate_regime_extraction.md section
      3.3), bound to the sha256 above, and independently re-acquired
      BYTE-IDENTICALLY at that sha256 by validator TASK-20260803-409c5e. It is
      not written from memory.
    boundary_is:
      - >-
        CONJUNCT 1 -- CODE FAMILY, and this is the decisive one for GOAL-MCE-001:
        generic / random alternant codes, with Goppa codes EXPLICITLY EXCLUDED.
        The paper's stated reason is that Goppa codes are counterexamples to its
        Heuristic 18. The exclusion carves out exactly the subfamily Classic
        McEliece uses.
      - >-
        CONJUNCT 2 -- FIELD SIZE: q in {2,3}, with extension degree m ARBITRARY.
        Verbatim: "we can actually attack McEliece-alternant for any extension
        degree m provided that the rate of the alternant code is sufficiently
        large (6) and the field size sufficiently low q = 2 or q = 3."
      - >-
        CONJUNCT 3 -- RATE: "sufficiently large (6)". The rate condition is REAL
        and is NOT withdrawn; the paper's own title says "high rate". Condition
        (6) is a lower bound on n - 1 and its formula is [EXTRACTION-DAMAGED] in
        the available extraction and is NOT transcribed by this program. Clean:
        e := max{ i in N | r >= q^i + 1 } = floor(log_q(r-1)).
    what_changed: >-
      Not "the rate condition is gone" but "the rate condition is one of three
      conjuncts and is not the discriminator for binary Goppa codes." For any
      question about the family Classic McEliece uses, conjunct 1 settles
      applicability before any rate arithmetic is performed.
    what_this_does_not_establish:
      - >-
        NOT a security statement about Classic McEliece in either direction.
        "Our attack does not work at all" is these authors' statement about
        THEIR attack, not a theorem that Goppa codes resist algebraic attacks.
      - >-
        NOTHING about KN-LIT-7c4620 / iacr:2026/1232, whose abstract states
        binary Goppa codes explicitly and whose BODY WAS NOT OBTAINED. The
        exclusion in this paper does not transfer to that one, and reading it as
        licence to dismiss the 2026 line is the dismissal-side error that
        BATCH-001-OPENING section 7 defines as failure.
      - >-
        No claim tier above toy, no hypothesis status change, no goal criterion
        met.

  replacement_constraint: >-
    The scoping of arXiv:2304.14757 (KN-LIT-4c8135) is load-bearing, and it is a
    CONJUNCTION: generic / random alternant codes -- Goppa codes EXPLICITLY
    EXCLUDED -- over F_2 or F_3, with m arbitrary, at high rate per the paper's
    condition (6). No deliverable of this goal may state that result's headline
    without the FAMILY EXCLUSION, and no deliverable may present the rate
    threshold as the boundary or as the discriminator between that result and
    Classic McEliece: the family exclusion already settles applicability to
    binary Goppa codes. Condition (6) is extraction-damaged and untranscribed;
    any deliverable needing it must transcribe it from the PDF at sha256
    ebbd94ac3cd00b0f0e723aeab56fd3b0820c89d47072fc8241f12c5f93c564b8 and may not
    reconstruct it. Stating the exclusion is NOT a statement that Classic
    McEliece is secure, and it transfers to no other paper in this line.

