research_question:
  id: RQ-DREG-bd6c86
  title: >-
    For the Weil-descended Semaev point-decomposition systems (Semaev's F' and
    F'', and the Gaudry/Diem factor-base systems), how does the SOLVING degree
    grow as a function of m, n', n and q -- and is the apparent deficit versus
    "random" systems an artifact of the null object, or a real structural
    effect large enough to move the ECDLP exponent?
  scope:
    curve_families:
      - generic ordinary short-Weierstrass curves over F_{q^n}
      - binary-extension exemplars E/F_{2^n} (Petit-Quisquater / FGHR regime)
      - prime-field exemplars E/F_p for the Semaev F'/F'' shape
    field_types:
      - "extension field F_{q^n}"
      - "prime field F_p"
    bit_sizes:
      - "toy: m in {3,4}, n' in {1,2,3}, q in {2,3,4,5,7,8,16}, systems solvable
         or rank-profilable within a bounded Macaulay degree"
      - "symbolic: per-degree rank profiles and Hilbert series where no solve
         completes"
    methods:
      - Semaev summation polynomials S_3, S_4, S_5 (symmetrized and raw)
      - Weil restriction of scalars to F_q with field equations
      - Groebner basis (F4/F5) degree profiles; Macaulay matrix per-degree ranks
      - last fall degree measurement (Huang-Kosters-Petit-Yeo)
      - multihomogeneous / support-matched semi-regular null objects
  motivation: >-
    The subexponential ECDLP claims of Petit-Quisquater (2^{O(n^{2/3} log n)}
    over F_{2^n}) and of Semaev's F'/F'' systems rest on the first-fall-degree
    assumption: that the solving degree stays close to the first fall degree.
    Kosters-Yeo gave evidence against it; Huang-Kosters-Petit-Yeo replaced the
    heuristic invariant with the LAST fall degree, which provably bounds the
    solving degree. The program's open question (KN-OPEN-*) is stated in terms
    of "degree of regularity", which is the quantity that is simultaneously
    hardest to compute, weakest as a bound, and most sensitive to the choice of
    comparison baseline. Two measurable substitutes exist and have not been
    measured here: (a) the last fall degree, which is a rigorous bound and is
    computable on small instances; and (b) the per-degree rank deficit against
    a null object that carries the SAME multidegree block structure, the same
    S_m symmetry and the same field equations, rather than a dense random
    system. Much of the reported "slower than random" growth may be explained
    entirely by (b) -- and whatever survives (b) is the only part of the effect
    that can move an exponent.
  decision_target: >-
    A committed Coordinator decision on whether, within the toy ladder actually
    tested, the Semaev descent systems show a solving-degree (or last-fall-
    degree) growth deficit against a support-matched null object that (i) is
    statistically distinguishable from zero and (ii) persists or widens as the
    ladder parameters grow -- together with an explicit statement of which
    parameter axis (n at fixed m,n' versus m*n' at fixed q) the conclusion is
    scoped to. A null result is a first-class outcome and constrains the
    first-fall-degree assumption rather than the curve.
  constraints:
    - >-
      Every degree measurement is scoped to the tested (m, n', q, n, term order,
      symmetrization, field-equation) cell. Growth is never extrapolated past
      the tested ladder without a named, separately falsifiable heuristic.
    - >-
      The null object is part of the protocol, not a post-hoc comparison: a
      "slower than random" claim against a dense semi-regular baseline alone is
      inadmissible, because the systems are multihomogeneous and symmetric by
      construction.
    - >-
      Timeouts, memory exhaustion and aborted F4 runs are never evidence of high
      degree of regularity (AGENTS rule 3). A cell that does not complete is
      reported as not measured; per-degree rank profiles are the fallback
      observable precisely because they are bounded work.
    - >-
      Each attributed degree fall must be traced to an explicit syzygy class
      (symmetry, Frobenius, field equation) or recorded as unexplained. An
      unattributed fall is an observation, not a mechanism.
    - >-
      No claim about cryptographic-size curves. The tested scale and any
      transfer assumption are stated in every conclusion (AGENTS rule 4).
  status: active
  owner: coordinator
