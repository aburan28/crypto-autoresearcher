research_question:
  id: RQ-ECRANK-27dcc5
  title: >-
    How high a Mordell-Weil rank can be certified for an explicit elliptic
    curve, over how small a field, with a checkable witness rather than a
    conditional argument?
  scope:
    curve_families:
    - elliptic curves over Q in short Weierstrass form y^2 = x^3 + Ax + B
    - their quadratic twists E^(d) for squarefree d
    - >-
      base change of those curves to multiquadratic number fields
      K = Q(sqrt d : d in V), with V a finite subgroup of Q*/(Q*)^2
    field_types:
    - Q
    - multiquadratic number fields of degree 2^k, k <= 6
    bit_sizes:
    - not applicable; the parameter of interest is the field degree [K:Q] and
      the certified rank, not a bit-length
    methods:
    - two-descent (PARI/GP ellrank) for twist ranks and generators
    - Galois eigenspace decomposition of E(K) (x) Q under Gal(K/Q) = (Z/2)^k
    - Mazur torsion bound for non-torsion certification
    - Neron-Tate height regulator for within-class independence
    - Mestre-Nagao statistic as a twist prefilter
  motivation: >-
    "Produce an elliptic curve of rank > 30" has two completely different
    answers depending on the base field, and conflating them is the main way
    this question gets answered dishonestly. Over Q it is an open world-record
    problem: the largest rank known for any explicit curve over Q is 29
    (Elkies-Klagsbrun 2024, improving Elkies 2006's 28), and no method here or
    elsewhere is close to 30. Over number fields of growing degree, rank is
    provably unbounded and rank >= 31 is constructible. The research content is
    therefore NOT "can we exceed 30" but "at what field degree does rank >= 31
    become certifiable, and by a certificate of what strength". That question
    has a measurable answer and a falsifiable one.
  decision_target: >-
    A ranked ladder (field degree -> certified rank -> certificate strength)
    with explicit witnesses at each rung, and an explicit statement of where the
    method's reach ends. Downstream: whether the eigenspace certificate is worth
    promoting to the knowledge corpus as a reusable technique.
  constraints:
  - >-
    Rank lower bounds must be UNCONDITIONAL. No bound may rest on BSD, on
    analytic rank, or on a Selmer-group upper bound; only exhibited points count.
  - >-
    The certificate must be checkable by a verifier that does not share code
    with the search and does not call the descent engine.
  - >-
    No claim about rank over Q beyond what is exhibited. The world record over Q
    is not this program's to restate as its own result.
  status: active
  owner: coordinator
