research_question:
  id: RQ-QSP-f9bbdb
  added: '2026-09-16'
  title: >-
    Can a quasi-subfield-polynomial factor base (Huang-Kosters-Petit-Yeo-Yun 2020;
    Euler-Petit 2019) give an index-calculus alternative to Pollard rho for
    ECC2K-130 -- the Koblitz curve y^2 + xy = x^3 + 1 over F_{2^131} -- and, cell
    by cell in (n', deg lambda, m), what is the fully charged cost of that line
    at n = 131 against the recorded rho estimate of 2^60.9 iterations?
  scope:
    curve_families:
      - >-
        the ECC2K-130 Certicom challenge curve y^2 + xy = x^3 + 1 over
        F_2[z]/(z^131 + z^13 + z^2 + z + 1), group order 4 * l with l a 129-bit
        prime (KN-LIT-096, KN-LIT-661e97) -- the OBJECT; its q = 2 Frobenius is
        an endomorphism of the curve, so a Frobenius-stable factor base carries
        the standard n-fold orbit reduction (RQ-FROB-7d8dd4's "trivial n-fold
        symmetry")
      - >-
        ordinary binary curves over F_{2^131} defined over F_{2^131} only, of the
        same group-order magnitude -- the NULL OBJECT for anything the Koblitz
        form seems to buy
      - >-
        toy Koblitz and ordinary curves over F_{2^n} with n prime, 17 <= n <= 41,
        as executable cells for the decomposition-system cost (the ICPERF
        instrument, RQ-ICPERF-94c86e); n = 127 (Mersenne, Type 2 family exists)
        and n = 129 (= 2^7 + 1) as nearby-object controls where a published QSP
        family DOES exist and n = 131 has none
    field_types: [binary_extension, prime_extension_degree]
    bit_sizes:
      - arithmetic only at n = 131 (the target): every cost is computed, none is run
      - executable: n <= 41 binary, where a decomposition system of the quasi-subfield shape can be solved end to end and its cost measured against the paper's resultant model
    methods:
      - >-
        the quasi-subfield algorithm of KN-LIT-0a321c Section 3.1: factor base
        F = {(x, y) : x^{2^{n'}} = lambda(x)}, the chain S^{(k)} = phi(S^{(k-1)})
        of m equations in m variables over F_{2^131} with NO Weil descent, solved
        by Rojas' sparse resultant (Lemma 3.1) or by any solver whose cost per
        attempt is measured
      - >-
        the quality parameter beta = l n / n'^2 (KN-LIT-4fe9d2 Definition 2) and
        the admissibility constraints: Lemma 4.1 of KN-LIT-0a321c
        (floor(n/n') l + (n mod n') >= n'), Theorem 1 of KN-LIT-4fe9d2
        (beta >= 3/4 for linearized L), Proposition 2 (F_2-coefficient linearized
        QSPs are divisors of X^131 - 1), Appendix C.2 (multiplicative V from
        divisors of 2^131 - 1 = 263 * prime)
      - >-
        existence census: for a candidate shape X^{2^{n'}} + lambda(X) with lambda
        non-linearized and coefficients in a declared small set (F_2 first), the
        exact root count over F_{2^131} as deg gcd(X^{2^131} - X, L), a finite
        GF(2)[x] computation whose cost grows like 2^{n'} and which is feasible
        in C for n' near 33; results are certificates, never sampled
      - >-
        Pollard rho with the Frobenius and negation classes as the matched baseline
        (2^60.9 iterations for ECC2K-130, KN-LIT-096; generic sqrt(2^131) = 2^65.5)
  motivation: >-
    User instruction (2026-09-16, verbatim): "Investigation into quasi-subfield
    polynomial line for ecc2k 130 alternatives for index calculus". The corpus
    knew this line only by recollection; on 2026-09-16 both papers were frozen
    (SRC-HUANG-2020-JMC-QSP, SRC-EULER-PETIT-2019-QSP) and read, and this
    program's own arithmetic at n = 131 is in analysis/qsp-ecc2k130/. What that
    arithmetic shows, and what this question therefore has to decide: (1) n = 131
    is prime with ord_131(2) = 130, so the only F_2-coefficient linearized
    quasi-subfield polynomials are the subfield F_2 and Type 1bis (beta ~ 1), and
    Theorem 1 of KN-LIT-4fe9d2 caps every linearized one at beta >= 3/4, i.e. at
    exponent >= 0.93 -- 2^122 against 2^65.5. (2) 2^131 - 1 = 263 * p with p prime,
    so multiplicative V give |V| in {264, p + 1}, neither with beta <= 1 at any n'.
    (3) No published family (Types 1, 2, 3, the three multiplicative families)
    admits p = 2, n = 131. (4) Yet 131 = -1 mod n' for n' in {33, 44, 66}, the
    BEST case of Lemma 4.1, so a NON-linearized lambda of degree 3 at n' = 33 or
    66 is excluded by no theorem in either paper, and beta would be 0.03-0.19.
    (5) At n = 131 the paper's own cost formula with every constant kept bottoms
    out at 2^133 (n' = 66, m = 2, linear-algebra bound) and its resultant-model
    floor at 2^68 (n' = 33, m = 4); with Frobenius-orbit reduction on the Koblitz
    curve that floor is 2^60.6 against rho's 2^60.9 -- a tie under a floor that
    no solver is known to reach and for a polynomial that is not known to exist.
    The open content is therefore two finite questions, not a hope: does a
    non-linearized quasi-subfield polynomial with (n' = 33, deg lambda <= 7) and
    Frobenius-stable roots exist over F_{2^131}, and what does one decomposition
    attempt of the chain system at m = 4 actually cost when measured.
  decision_target: >-
    Either (a) a certified existence result -- a specific L = X^{2^33} + lambda(X)
    with lambda in F_2[X] non-linearized, deg lambda <= 7, and a computed root
    count >= 2^32 over F_{2^131}, at which point the solver-cost cell (m = 4,
    d = deg lambda) becomes the ranked experiment; or (b) a certified census
    showing every such L has o(2^33) roots, which closes the F_2-coefficient
    shape at that cell and leaves a stated successor (coefficients in a larger
    declared set, or the rational-lambda and isogeny-L generalisations named in
    KN-LIT-0a321c Section 5); together with (c) a measured cost per decomposition
    attempt for the chain system at an executable cell, compared with the
    resultant-model floor 2^{m(m-1)(1 + log2 d)}. A negative closes only the
    named shapes, coefficient sets and cells.
  constraints:
    - Lawful defensive cryptanalysis on the public Certicom challenge curve and toy curves only; no live keys, no deployed targets.
    - >-
      Every number attributed to the two frozen papers is cited by section, lemma
      or proposition number; every number at n = 131 is this program's arithmetic
      (analysis/qsp-ecc2k130/qsp_ecc2k130.py) and is attributed there.
    - >-
      An existence claim is a certificate (the polynomial, the gcd degree, the
      code and its hash), never a sampled estimate; a non-existence claim names
      the exact shape, coefficient set and n' it covers.
    - >-
      The baseline is the sped-up rho (2^60.9), not naive rho (2^65.5) and not
      brute force; a quasi-subfield cost that only beats 2^131 is the paper's own
      Remark 3.1 result, not progress.
    - >-
      Pareto honesty per docs/inventor-protocol.md section 5: every proposal on
      this question fills dominated_by against KN-LIT-096's rho row and
      sota_delta with exponents; every closure meets section 4.
    - >-
      No scientific run is launched under this question until a frozen,
      approved EXP-QSP-* contract exists; the analysis note is a pre-compute audit
      (section 8), not evidence.
