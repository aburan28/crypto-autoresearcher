research_question:
  id: RQ-FHE-001
  title: >-
    Do the sparse-secret Ring/Module-LWE parameter sets shipped by production
    FHE libraries still meet their claimed security level under the 2026
    enhanced hybrid decoding attacks, and what is the honest cost of
    restoring it?
  scope:
    scheme: >-
      FHE parameter sets, not a single scheme: CKKS, BGV/BFV, and FHEW/TFHE
      as instantiated in OpenFHE, Lattigo, TFHE-rs, and HEaaN, plus the
      parameter sets published in recent FHE literature.
    family: "lattice (Ring-LWE / Module-LWE with sparse or ternary secrets)"
    assumption: >-
      decision/search Ring-LWE and Module-LWE at the specific moduli, ring
      degrees, error distributions, and secret Hamming weights used in
      practice — NOT worst-case lattice assumptions, and NOT the
      dense-secret regime the standard parameter tables cover.
    process_status: >-
      ISO/IEC DIS 28033-1 (FHE, Part 1: General) ballot closed 2025-12-11 with
      publication reported as expected around end of 2026. The
      HomomorphicEncryption.org Standard v1.1 (2024) specifies no concrete
      sparse-secret parameters and states that their security is not yet well
      understood. Neither document has been read by this program.
    targets:
      - >-
          the reported claim that 12 of 16 recent published sparse Ring-LWE
          FHE parameter sets fall below their targeted 128-bit level under
          the enhanced hybrid decoding attack
      - >-
          whether the reported O(N) sparse-secret speedup and the reported
          up-to-13-bit improvement survive at the ring degrees and Hamming
          weights libraries actually ship as defaults
      - >-
          the separation between an estimator recount and a demonstrated
          attack: which of the reported bit losses correspond to an attack
          anyone has run, at any scale
      - >-
          the induced cost: sparse secrets exist to make bootstrapping cheap,
          so any parameter repair must be costed as a bootstrapping slowdown,
          not reported as a bit count alone
      - >-
          whether the IND-CPA^D line of attacks and the sparse-secret hybrid
          line compound at a shared parameter set or are independent
    methods:
      - >-
          primary-source reading of the disclosed attack and of the prior
          sparse-secret hybrid attack literature it builds on
      - >-
          Lattice Estimator recomputation at the exact shipped parameter
          sets, with the estimator version and cost model pinned and recorded
      - >-
          independent reimplementation at toy ring degrees and small moduli,
          where the recovered secret is checkable
      - >-
          library-default parameter extraction directly from source, so the
          analyzed sets are what is shipped rather than what is published
      - >-
          secret-recovery certificate: a claimed recovered sparse secret must
          reproduce the public samples under independent recomputation
    claim_tier_ceiling: >-
      Toy-tier until a certified recovery exists at or above a shipped
      parameter set. An estimator output is a cost ESTIMATE and is never
      recorded as a break. AGENTS.md rule 4 applies unchanged: no toy-scale
      result is reported as a statement about deployed FHE parameters.
  motivation: >-
    Sparse and ternary secrets are not an incidental choice — they are what
    makes FHE bootstrapping affordable, and therefore what makes every
    deployed FHE system practical. A 2026 preprint reports that exploiting
    ring structure accelerates the guessing and decoding steps of hybrid
    decoding attacks by a factor of O(N) in the sparse-secret setting, worth
    up to 13 bits over the best prior attacks, and that under it 12 of 16
    examined parameter sets fall below 128-bit security. If that holds at
    shipped defaults it is a parameter-level result on a central hard problem
    with immediate consequences for systems now entering production, and it
    lands during the ISO/IEC 28033-1 standardization window. If it does not
    hold, the reason — estimator methodology, unrealistic memory assumptions,
    or a regime libraries avoid — is itself worth establishing, because the
    community currently has no agreed concrete sparse-secret parameter table
    to appeal to.
    This program is already positioned for it: RQ-MLKEM-001 covers hybrid and
    decoding attacks on module lattices, and the certificate discipline in
    docs/claims-and-verification.md transfers without modification, because a
    recovered sparse secret is NP-checkable against the public samples in
    exactly the way a claimed discrete log is checkable by recomputing k*P.
  decision_target: >-
    Whether the reported security loss is real at the parameter sets
    production libraries ship by default, is confined to published-in-papers
    parameter sets that nobody deploys, or is an artifact of estimator
    methodology — and, if real, what restoring the claimed level costs in
    bootstrapping throughput.
  provenance: >-
    Every technical claim in this record originates from web-search result
    summaries gathered on 2026-08-01. eprint.iacr.org is UNREACHABLE from this
    harness's network policy (proxy CONNECT 403, confirmed against
    $HTTPS_PROXY/__agentproxy/status), as are arxiv.org/html and several
    vendor sites, so NO primary source behind this question has been read —
    not the attack preprint, not the prior hybrid-attack literature, not
    ISO/IEC DIS 28033-1, not the HomomorphicEncryption.org standard. The
    author list of the central preprint is not known to this program. What
    HAS been verified directly, by fetching library source from
    raw.githubusercontent.com, is the operation and capability surface of
    OpenFHE, TFHE-rs, and Lattigo — not their default parameters, which have
    not been extracted. Treat this record as a scoped target definition, not
    as a summary of established results.
  constraints:
    - >-
      Every technical claim in this record is sourced from web-search
      summaries and is UNVERIFIED. No experiment may be designed until the
      relevant primary sources are read and filed as KN-LIT entries with
      citation_verified other than `web`. KN-LIT-7c2620, KN-LIT-95256d and
      KN-LIT-7675 record the targets and their provenance limits; they do NOT
      discharge this gate.
    - >-
      Reading the primary sources requires network access to eprint.iacr.org,
      which this harness does not currently have. Either the network policy is
      changed or the papers are supplied out of band; until then this question
      cannot progress past ideation, and that blocker must be stated in any
      handoff rather than worked around.
    - >-
      An estimator bit-count is not an attack. Any record derived from the
      Lattice Estimator states the estimator commit, the cost model, and the
      memory model, and is labeled as an estimate. Estimates and demonstrated
      recoveries are never reported in the same units.
    - >-
      Matched-baseline discipline: no attack cost is reported without the
      best-known baseline at identical parameters, with sampling,
      preprocessing, memory, lattice-reduction, decoding, and verification
      all charged.
    - >-
      Parameter sets analyzed are extracted from library source at a pinned
      commit and recorded verbatim. A parameter set from a paper is never
      described as "deployed" without that extraction.
    - >-
      Any claimed recovery carries a certificate — the recovered secret
      reproduces the public samples — that the run wrapper re-verifies with
      code independent of the attack implementation. See
      docs/claims-and-verification.md.
    - >-
      Toy-scale recoveries are hypothesis-generating only and are never
      presented as statements about shipped parameters.
    - >-
      Timeouts, crashes, and memory exhaustion are infrastructure outcomes,
      not evidence that a parameter set is secure.
  status: active
  owner: coordinator
  created_at: '2026-08-01'
