research_question:
  id: RQ-ICPERF-94c86e
  title: >-
    What does index-calculus ECDLP actually cost, phase by phase and in measured
    operations, for Koblitz curves, general binary-extension curves and prime-field
    curves -- and where, cell by cell, does the measured boundary sit against a
    matched generic (rho) baseline?
  scope:
    curve_families:
      - >-
        Koblitz-form binary curves y^2 + xy = x^3 + a x^2 + 1 over F_{2^n}, starting
        with a = 1 on the fixed curve of SRC-ICPERF-TRIMOSKA-ECICB-2024 (prime n; the
        FIPS K-163/233/283/409/571 labels appear only as parameter labels in cost
        tables, never as targets)
      - >-
        general ordinary binary curves y^2 + xy = x^3 + a x^2 + b over F_{2^n} as the
        nearby-object control for anything the Koblitz form seems to buy
      - >-
        prime-field curves y^2 = x^3 + Ax + B over F_p and small extensions F_{p^n}
        (n in {2, 3, 5}) where Semaev / Gaudry-Diem index calculus is defined; for
        prime fields proper the boundary is expected to be rho and the question is
        to MEASURE how far index calculus falls short, not to beat it
    field_types: [binary_extension, prime, low_degree_extension]
    bit_sizes:
      - >-
        executable: n <= 41 binary (PDP at l <= 8), prime fields up to ~40 bits, so
        that every cell is solved end to end with a certificate and a matched rho run
      - >-
        arithmetic only: FIPS binary and NIST prime labels, for concrete-cost tables
        extrapolated from measured cells under stated, numbered assumptions
    methods:
      - >-
        point decomposition (PDP) via Semaev summation polynomials S_3 / S_4 with
        Weil descent, solved by (i) Groebner engines actually installed here --
        Macaulay2 F4 over ZZ/2 with field equations, Singular std/slimgb, msolve
        where the characteristic permits -- (ii) SAT: WDSat, CryptoMiniSat (CNF-XOR),
        CaDiCaL, MiniSat, and (iii) exhaustive / hybrid search as a floor
      - Nagao disjoint-coset factor bases and Semaev's chained S_3 as ALTERNATIVE
        decompositions, each costed as its own phase table (GOAL-SEMBIN-5078bc and
        GOAL-SEMBIN-fcb7a2 own the correctness questions; this question owns only
        the measured cost)
      - relation search yield (the RQ-RELN-001 quantity) as the multiplier on PDP cost
      - structured Gaussian elimination / block Wiedemann / Lanczos for the linear
        algebra phase, cost in field operations and bytes
      - descent / individual logarithm as a separate phase
      - matched Pollard rho and BSGS on the same group, same machine, same session
  motivation: >-
    The user's instruction (2026-09-13): "establish a runtime duration and complexity
    for index calculus algorithm for koblitz, char2, and generic prime fields ...
    the number of operations, time in relation finding, point decomposition,
    grobner bases, etc. -- a concrete boundary for the performance of these
    algorithms that we can then work against to iterate forward on", together with
    a request for the algorithms themselves ("solvers, grobner bases, f4, nagao ca
    summation polynomials etc") and the pointer to
    github.com/mtrimoska/EC-Index-Calculus-Benchmarks. This program has many
    single-phase measurements (RQ-DREG, RQ-SDEG, RQ-RELN, RQ-ICEX, RQ-SATIC, SEMBIN)
    but no single table that says, for a named curve family and a named cell, how
    many operations each phase took and what rho took beside it. Every asymptotic
    claim in the Semaev/Nagao lane is currently compared against a model of the
    incumbent rather than a measurement of it. A maintained boundary table turns
    "faster than rho" from a slogan into a number with a scope.
  decision_target: >-
    For each (family, cell) row: the measured cost of each phase in a
    hardware-independent primary unit (solver conflicts or Groebner matrix
    operations; field multiplications for linear algebra and rho) with wall time
    and peak memory secondary, a certificate for every claimed solve, and the ratio
    to matched rho on the same machine. Decide, per family, the smallest cell at
    which any index-calculus pipeline beats rho -- or record that none does within
    the executable range and by what measured factor. A negative closes only the
    tested engines and cells.
  constraints:
    - Lawful defensive cryptanalysis on public and toy curves only; no live keys or deployed targets.
    - >-
      Reported numbers from SRC-SATIC-TRIMOSKA-2019, SRC-SEMAEV-2015-310, SRC-NAGAO-2015-984
      or any other frozen source are never entered in a boundary table as measured;
      a table cell is either measured in-repo with a run id, or marked "reported"
      with its source id and excluded from any ratio.
    - >-
      Engines are named and versioned in every cell. "Groebner" is not an engine;
      Macaulay2 1.22 F4 over ZZ/2 with field equations is. No in-repo engine is a
      reproduction of Magma F4 or PolyBoRi, which are absent here.
    - >-
      SAT and UNSAT instances are reported separately; a pooled mean is a
      composition artifact.
    - >-
      A timeout, memory abort or crash is an infrastructure outcome, never negative
      evidence, and never evidence that an instance is unsatisfiable.
    - >-
      Every claimed decomposition carries the explicit factor-base points and is
      re-verified against the curve with arithmetic independent of the solver.
    - >-
      Extrapolation to FIPS/NIST labels is arithmetic on numbered assumptions and
      is labelled as such; it is never a security statement about any curve.
    - >-
      Correctness questions about Semaev's Assumption 1, Nagao's Proposition 5 and
      relation-yield models stay with their owning goals; this question consumes
      their engines and measures cost.
