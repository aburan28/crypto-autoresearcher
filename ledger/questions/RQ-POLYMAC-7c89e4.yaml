research_question:
  id: RQ-POLYMAC-7c89e4
  title: >-
    GHASH and Poly1305: the forgery bounds that set every deployed rekeying
    limit are the same construction over two different fields — do they behave
    the same when measured, and does either bound stay tight where deployments
    actually sit?
  scope:
    scheme: "GHASH (as used in AES-GCM) and Poly1305 (as used in ChaCha20-Poly1305)"
    family: "polynomial-evaluation universal hash MACs, in nonce-based AEAD modes"
    assumption: >-
      The load-bearing objects are FORGERY PROBABILITY BOUNDS that degrade with
      message length and with the number of queries. They are what every
      concrete deployment limit reduces to — record size caps, rekeying
      intervals, key-commitment caveats — and they are used as though tight.
      Tightness is a claim about the gap between a bound and the best actual
      attack, and this program holds no measurement of that gap for either
      construction.
    standardization_status: >-
      Both are fielded at internet scale in TLS and beyond. The limits derived
      from these bounds are written into protocol specifications and library
      defaults, which is precisely where a loose or misapplied bound propagates
      furthest.
    targets:
      - >-
          THE PAIRED-CONSTRUCTION CONTROL, WHICH IS WHY THIS IS ONE QUESTION AND
          NOT TWO: GHASH and Poly1305 are the same idea — evaluate a polynomial
          in a secret point — over a binary extension field and a prime field
          respectively. An analysis or model that explains one and not the other
          has found a property of a field rather than of the construction. This
          is a nearby-object control that the deployed world set up for free, and
          it is the strongest structural feature of this question.
      - >-
          MEASURED TIGHTNESS: forgery success probability as a function of
          message length and query count, measured on scaled-down analogues
          where exhaustive verification is possible, against the bound
          instantiated at the same parameters. Report the RATIO, not just the
          bound.
      - >-
          THE WEAK-KEY STRUCTURE, COUNTED RATHER THAN CITED: both fields have
          elements of low multiplicative order, and both constructions clamp or
          constrain the key in specific ways. Count exactly the density and
          structure of keys for which forgery is cheaper than the generic bound
          suggests, in each field, and state whether the two constructions
          inherit the same exposure.
      - >-
          THE NONCE-MISUSE CLIFF, STATED AS A COST RATHER THAN AS A WARNING:
          repeating a nonce is known to be catastrophic. Quantify it — how many
          repeated-nonce pairs are needed to recover the authentication key, at
          what cost, for each construction — so that the failure is a number a
          deployment can reason about rather than an adjective.
    methods:
      - >-
          Exact arithmetic in both fields at full size for structural counting
          (multiplicative order structure, clamped key space), which is finite
          and needs no approximation.
      - >-
          Scaled-down analogues with the identical mode structure and a smaller
          field, where forgery probability can be measured by exhaustion and
          compared against the bound at those parameters. The scaling rule is
          declared before the runs, and the extrapolation back to full size is
          reported as a projection rather than a measurement.
      - >-
          Key-recovery implementation under repeated nonces, with cost measured
          rather than quoted, in the charging convention shared across this
          program's cost work.
    claim_tier_ceiling: >-
      NO ATTACK ON CORRECTLY-USED AES-GCM OR CHACHA20-POLY1305 IS IN SCOPE AND
      NONE IS CLAIMED. Nonce-misuse results are statements about a MISUSE MODEL
      that the campaign supplies to itself by construction, and must never be
      written as a break of either AEAD. Tightness measurements at scaled-down
      parameters are statements about those parameters; the extrapolation to
      full-size fields is a labelled projection and is not evidence. Weak-key
      counts are exact structural facts about a field and imply nothing about
      the probability that a real deployment holds such a key beyond what the
      count itself states.
  motivation: >-
    This program's symmetric goals otherwise all target primitives. The MODE
    layer is where deployed cryptography actually fails, and the polynomial MAC
    is the single most consequential object in it: the forgery bound is what
    every concrete data limit and rekeying interval in modern protocols reduces
    to, and those limits are applied as though the bound were tight. Whether it
    is tight is measurable, and unusually cheaply, because the constructions are
    small, exact, and admit faithful scaled-down analogues where forgery
    probability can be obtained by EXHAUSTION rather than estimated. The pairing
    is what makes the question worth opening as research rather than as a
    literature review: two instantiations of one construction over structurally
    different fields, both fielded at internet scale, each serving as the
    other's control. A model that fits both is worth something; a model that
    fits one is a field artifact and the pairing catches it immediately.
  decision_target: >-
    Whether the forgery bounds underlying deployed data limits are tight where
    they are applied, whether GHASH and Poly1305 behave the same under a single
    measured model, and what the nonce-misuse failure costs as a number.
  provenance: >-
    NOT OBTAINED BY SEARCH IN THIS SESSION AND NOT FILED AS KN-LIT. The objects
    named here — GHASH's polynomial evaluation over a binary extension field,
    Poly1305's over a prime field with a clamped key, the AEAD compositions they
    sit in, the standing knowledge that nonce reuse permits authentication key
    recovery, and the existence of weak-key classes tied to multiplicative order
    — are named as RESEARCH TARGETS TO BE LOCATED AND FILED, not as results on
    record. NO BOUND, EXPONENT, FIELD SIZE, OR COMPLEXITY FIGURE IS QUOTED
    ANYWHERE IN THIS RECORD, deliberately: this program has not read the primary
    sources in this session and will not seed the ledger with remembered
    constants that later work would cite. Every numeric quantity enters through a
    KN-LIT entry read from primary text.
  constraints:
    - >-
      No experiment may be designed until the mode specifications and the
      forgery-bound proofs are filed as KN-LIT entries at stated provenance
      levels, WITH THEIR BOUNDS TAKEN FROM PRIMARY TEXT. This record contains no
      numbers to inherit, deliberately.
    - >-
      Reference implementations of both constructions must be pinned and
      validated against published test vectors before any measurement.
    - >-
      The scaled-down analogue's construction and scaling rule are declared and
      committed BEFORE any measurement. An analogue adjusted after seeing
      results measures the adjustment.
    - >-
      Extrapolation from scaled-down measurements to full-size fields is
      reported as a labelled projection and never as evidence about the deployed
      constructions.
    - >-
      Nonce-misuse work uses self-generated keys and self-generated traffic
      exclusively. NO THIRD-PARTY TRAFFIC, CAPTURE, OR KEY MATERIAL IS COLLECTED
      OR ANALYSED AT ANY POINT.
    - >-
      Nothing here may be reported as an attack on correctly-used AES-GCM or
      ChaCha20-Poly1305, or as a statement about any deployed protocol,
      implementation, or service.
  status: active
  owner: coordinator
  created_at: '2026-08-09'
