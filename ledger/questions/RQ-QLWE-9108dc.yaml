research_question:
  id: RQ-QLWE-9108dc
  title: >-
    Does the ring/module algebraic structure of Ring-LWE and Module-LWE admit a
    quantum mechanism that plain LWE does not — at the approximation factors
    LWE-based cryptography actually uses — or is every such mechanism confined,
    by a nameable obstruction, to the ideal-lattice regime where it already
    lives?
  scope:
    curve_families: []
    field_types:
      - >-
        Cyclotomic rings, power-of-two and general conductor, with the
        conductor's factorisation treated as an independent variable rather
        than fixed at the deployed shape
      - >-
        Non-cyclotomic / large-Galois-group ring shapes as the NEARBY-OBJECT
        control: a mechanism that survives when the unit group, class group, or
        Galois structure is removed was never using that structure
      - >-
        Plain (unstructured) LWE of the same total dimension as the NULL OBJECT:
        the mechanism is run against it before any structural claim is believed
      - >-
        The Module-LWE interpolation itself — rank k over a degree-d ring at
        fixed kd — as the object under study, since MLWE is exactly the family
        that deforms plain LWE (k = n, d = 1) into Ring-LWE (k = 1, d = n)
    bit_sizes:
      - >-
        Asymptotic regimes indexed by (n, q, alpha) and by approximation factor
        gamma, with the SEPARATION BETWEEN REGIMES as the primary object: the
        known quantum ideal-lattice results live at large gamma, and deployed
        LWE-based cryptography lives at small gamma
      - >-
        Toy and reduced dimensions only for any computation actually run.
        Nothing at a deployed parameter set is attempted or claimed.
    methods:
      - >-
        Object-first generation over the algebraic objects the family exposes
        that plain LWE does not: the log-unit and log-S-unit lattice, the
        cyclotomic class group and its Stickelberger structure, the Galois
        action and its subfield/norm-descent towers, the module's rank
        filtration and its rank-1 subquotients, and the Principal Ideal Problem
        as solved quantumly in the ideal-lattice setting.
      - >-
        The LOSSY-PROJECTION TEST from docs/inventor-protocol.md applied to each
        candidate: name the projection under which the proposed mechanism's
        input becomes the plain-LWE input, and show what information survives it.
        A mechanism whose advantage survives the projection is a plain-LWE
        mechanism that was mislabelled as structural, and belongs in the
        baseline, not here.
      - >-
        Quantifier-order audit before any implementation: the known quantum
        ideal-lattice results are statements about IDEAL lattices at LARGE
        approximation factor; RLWE/MLWE security rests on statements about
        average-case instances at SMALL approximation factor. Which quantifier
        moves, and in which direction, is a cheap pre-compute check that
        historically kills this class of proposal before a line of code is
        written — and killing one cheaply is a result.
      - >-
        Explicit ceiling derivation: state, as a theorem-shaped sentence with its
        quantifiers, the strongest claim the proposed mechanism could reach even
        if every step worked perfectly. Where that ceiling sits below the
        deployed regime, the proposal is closed there and the ceiling is
        recorded as the finding.
    known_obstruction_surface_to_be_mapped_not_assumed:
      - >-
        The gap between Ideal-SVP and Ring-LWE. Quantum algorithms are recorded
        in this corpus for the principal ideal problem and for approx-SVP in
        ideal lattices (KN-LIT-115, KN-LIT-117, KN-LIT-2568, KN-LIT-7288,
        KN-LIT-4775, KN-LIT-5227, KN-LIT-6583). Ring-LWE is not Ideal-SVP, and
        the reduction between them is not free. Mapping exactly where that gap
        is load-bearing — rather than asserting either that it closes or that it
        cannot — is the core work of this question.
      - >-
        The approximation-factor gap. The ideal-lattice quantum results are
        recorded as reaching subexponential-in-the-degree approximation factors;
        cryptographic RLWE/MLWE parameters sit far below that. Whether anything
        in the mechanism is elastic in gamma, and what it would cost to make it
        so, is measurable at reduced dimension.
      - >-
        The rank axis. Whether ANY quantum mechanism's exponent depends on the
        module rank k separately from the total dimension kd is, as far as this
        question's own baseline lane (RQ-QLWE-1c4a3b) can establish, unrecorded.
        A negative answer, established rather than assumed, is a real result
        about the family and is the expected outcome.
    claim_tier_ceiling: >-
      TOY-SCALE MEASUREMENT, SYMBOLIC DERIVATION, AND OBSTRUCTION MAPPING ONLY.
      No attack on any deployed parameter set is attempted or claimed. Admissible:
      "at reduced dimension the mechanism's advantage over the plain-LWE control
      is X, with confidence interval Y"; "the mechanism's ceiling, derived, is
      gamma >= Z, which does not reach cryptographic parameters"; "the
      quantifier order does not permit the transfer, for the following reason".
      Inadmissible: any statement that ML-KEM, ML-DSA, Falcon, Hawk, NTRU, or
      FrodoKEM is or is not secure; any extrapolation of a toy measurement to a
      deployed parameter set without its uncertainty; any claim of a break.
  motivation: >-
    Ring-LWE and Module-LWE are deployed instead of plain LWE for efficiency,
    and the standard argument that this costs nothing in security is a set of
    worst-case-to-average-case reductions plus the observation that no attack
    exploiting the structure is known. The second half of that argument is an
    empirical claim about the current state of knowledge, and it is exactly the
    kind of claim this program is built to interrogate in good faith rather than
    to accept or to sensationalise.
    There is a specific reason to think the ground is genuinely open rather than
    saturated. Quantum algorithms that DO exploit cyclotomic structure exist and
    are recorded in this corpus — for the principal ideal problem and for
    approx-SVP in ideal lattices — but they operate at approximation factors far
    above the cryptographic regime and on ideal lattices rather than on RLWE
    samples. Meanwhile the quantum results that DO reach cryptographic LWE
    parameters (Grover- and quantum-walk-amplified sieving and enumeration) are,
    on the face of it, structure-blind: their exponents are functions of the
    lattice dimension, and they would run identically on plain LWE of the same
    dimension. If that reading survives the baseline lane, then the question
    "does the structure buy the attacker anything at all" has a known answer at
    one end (yes, at large gamma, on ideal lattices) and a known answer at the
    other (no known mechanism, at cryptographic gamma), with the interpolation
    between them — which is precisely what the module rank parameterises —
    largely unmapped.
    Premature closure is the failure mode to avoid here, and it is treated as
    symmetric with overclaiming (docs/inventor-protocol.md): declining to search
    because the target looks saturated is a failure, and so is reporting a toy
    measurement as a threat. The null-object control is what makes it possible
    to do neither.
  decision_target: >-
    For each candidate structural mechanism proposed under this question, one of:
    (a) a fully charged asymptotic or concrete claim, with its numbered
    heuristics, that improves on the matched quantum baseline established by
    RQ-QLWE-1c4a3b for at least one of LWE, RLWE, or MLWE; or (b) a NAMED
    OBSTRUCTION — a specific quantifier inversion, approximation-factor gap,
    rank-independence, or null-object collision — that closes the mechanism at a
    stated boundary, with the boundary and the remaining uncertainty recorded so
    a successor can reopen it against a different object. Outcome (b) is the
    expected outcome for most candidates and is a full result, not a failure.
  constraints:
    - >-
      Every proposal under this question is proof/algorithm-oriented and requires
      a `proof_search_map` (exact bottleneck, baseline reproduction,
      observation-collision search, quantifier order, method ceiling,
      nearby-object control) per docs/inventor-protocol.md section 8 and
      knowledge/techniques/KN-TECH-080.md, BEFORE the Coordinator approves
      implementation or any expensive experiment. A failed proof_search_map
      audit is a recordable result.
    - >-
      NULL-OBJECT CONTROL IS MANDATORY AND PRECEDES BELIEF. No structural claim
      is recorded before the same mechanism has been run against (i) plain LWE
      of the same total dimension and (ii) a nearby ring shape with the
      structure the mechanism claims to use removed or weakened. Equal
      performance on a control is not a null finding to be explained away; it is
      the finding, and it reclassifies the mechanism as structure-blind.
    - >-
      Any claimed short vector, secret recovery, or solved instance is emitted
      as a CERTIFICATE and independently re-verified by the run wrapper per
      docs/claims-and-verification.md. A claimed solve without a re-verified
      certificate is not evidence at any tier.
    - >-
      Quantum mechanisms are costed as quantum algorithms — gates, depth,
      qubit count, and any QRAM/QRACM assumption named and charged — or they are
      recorded as uncosted. An oracle-model or query-complexity separation is
      reported as exactly that and is never quoted as a runtime.
    - >-
      Toy-dimension results are hypothesis-generating. Extrapolation to
      cryptographic dimension is reported with its uncertainty and its fitted
      constants' confidence intervals, or not at all; a fitted exponent quoted
      bare is inadmissible.
    - >-
      No result, mechanism, or cost figure transfers between this question and
      RQ-QALG-457b41 (quantum sieving/enumeration against MLWE/MSVP scoped to
      ML-KEM), RQ-MLKEM-001, RQ-MLKEM-003, RQ-NTRU-9015ee, or RQ-QALG-74bf20
      (the isogeny/dihedral-HSP lane). Where the abelian hidden-subgroup
      machinery appears in both this question and the CSIDH lane, the GROUPS
      ARE DIFFERENT — the unit/class group of a number field here, the isogeny
      class group action there — and no transfer between them is admissible
      without an explicit, cited reduction.
    - >-
      Timeouts, crashes, memory exhaustion, and solver failures are
      infrastructure outcomes, never evidence that a structure is unexploitable
      (AGENTS.md rule 3).
    - >-
      No statement about the security of any deployed system may appear in any
      record produced under this question.
  provenance: >-
    The obstruction surface above is assembled from THIS REPOSITORY's committed
    corpus as of 2026-08-30 and is a list of research targets, not of verified
    facts: KN-LIT-115 (Cramer-Ducas-Peikert-Regev, short generators of principal
    ideals in cyclotomic rings, EUROCRYPT 2016), KN-LIT-117 (efficient quantum
    algorithms for class groups and the principal ideal problem, 2016),
    KN-LIT-2568 (approx-SVP in ideal lattices with pre-processing), KN-LIT-7288
    (Twisted-PHS), KN-LIT-4775 and KN-LIT-5227 (log-S-unit lattice structure and
    its non-randomness), KN-LIT-6583 (short generators without quantum
    computers, multiquadratics), KN-LIT-053 / KN-LIT-5355 and KN-LIT-2264
    (Ring-LWE and its toolkit), KN-LIT-054 (worst-case to average-case
    reductions for module lattices), KN-LIT-4628 and KN-LIT-7208 (relations
    between Ring-LWE and Module-LWE, and module hardness at linear rank),
    KN-LIT-5556, KN-LIT-629, KN-LIT-5981, KN-LIT-5982 and KN-LIT-1169
    (Ring-LWE/Polynomial-LWE relations, order-LWE, weak-instance families, and
    field-extension-degree effects). The characterisation of each entry is taken
    from its own corpus record; where a record marks itself unverified or
    bulk-seeded, that status carries forward here unchanged. Approximation
    factors and exponents named in prose are UNVERIFIED research targets until
    re-read from primary text under this question's own constraints.
  status: active
  owner: coordinator
  created_at: '2026-08-30'
