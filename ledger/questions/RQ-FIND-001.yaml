research_question:
  id: RQ-FIND-001
  title: >-
    Which replicated prime-field ECDLP barrier and negative results from this
    program must be promoted into knowledge/findings so future ideation cannot
    re-cross closed scopes?
  scope:
    curve_families: [generic prime-field short-Weierstrass (toy-scoped evidence only)]
    field_types: [prime]
    bit_sizes: [toy-scale evidence already on ledger; no new crypto-scale claims]
    methods: [knowledge promotion from replicated EV/DEC records]
  motivation: >-
    docs/knowledge-assessment-20260724.md records zero KN-FIND entries despite
    multiple replicated evidence records (BKK/MV, jets, incidence, NC path
    algebras, SIG battery, etc.). Without promotion, the Tier 0-2 complexity
    path cannot treat closed families as durable internal ground truth.
  decision_target: >-
    A Coordinator-approved set of KN-FIND-* entries (or explicit not_warranted
    justifications per EV) covering every replicated ECDLP-relevant evidence
    record named in the assessment, with claim boundaries no stronger than the
    cited EV/DEC scope.
  constraints:
    - Promote only from strength replicated or strong evidence (knowledge/README.md).
    - Proven scoped negatives are findings too; do not upgrade toy scope to crypto-scale.
    - Do not rewrite immutable EV/DEC/RUN records; corrections supersede.
  status: active
  owner: coordinator
