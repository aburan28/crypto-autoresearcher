research_question:
  id: RQ-ENDO-476761
  id_allocation_provenance: >-
    Minted 2026-10-16 with `python3 tools/allocate_id.py --next
    research_question --area ENDO` and confirmed with `--check`.
  goal_id: GOAL-ENDO-001
  goal_id_note: >-
    Not bound to a goal record. Known-scalar multiplication cost is a
    constructive-side functional, not an ECDLP attack cost; GOAL-ENDO-001's
    organising question (is any cost functional non-constant across an
    isogeny class?) is the nearest parent. Bound to it by DEC-20261016-5cd7e2.
  title: >-
    Is variable-base scalar multiplication on a deployed prime-field curve
    measurably cheaper when it is routed through a small-degree F_p-rational
    isogenous neighbour that has a cheaper curve model or a cheap
    endomorphism, once the map, its dual and the scalar adjustment are
    charged?
  created_at: '2026-10-16T00:00:00Z'
  updated_at: '2026-10-16T00:00:00Z'
  scope:
    curve_families:
    - verified deployed prime-field curves in harness/endosweep/targets.py
      and the std-curves corpus used by harness/endosweep/corpus.py
    - synthetic positive controls built so a neighbour with a cheaper model
      or a small-discriminant crater is known to exist
    - curves already on their cheapest model (P-256, a = -3) as negative
      controls
    field_types:
    - prime
    bit_sizes:
    - 160 to 521 (deployed); toy sizes only for exhaustive cross-checks
    methods:
    - breadth-first enumeration of F_p-rational ell-isogenies, ell <= 13,
      by kernel polynomials (harness/endosweep/explicit.py)
    - per-node model availability (a = -3 by quartic-residue test, a = 0,
      Montgomery, twisted Edwards a = -1, Doche-Icart-Kohel)
    - conductor and fundamental discriminant from t^2 - 4p
      (volcano-ascent to a small-|D_K| crater)
    - counted operation model (harness/endosweep/costmodel.py), then
      measured wall clock for any modelled gain
  motivation: >-
    The isogeny-cycle GLV route is already priced by endosweep: a non-scalar
    endomorphism has norm at least |D_K|/4, so on generic curves a cycle of
    small isogenies costs about as much as the doublings it saves
    (harness/endosweep/README.md, "isogeny-cycle pump"). The other route,
    moving the computation to an isogenous curve with cheaper arithmetic
    (Brier and Joye 2003, provenance recalled), has no record in this corpus
    and no measurement over the deployed-curve set with conversion charged.
  decision_target: >-
    Per curve: the cheapest reachable model, the modelled and measured gain
    with and without conversion, and the obstruction where no gain exists
    (group order fixes the cofactor; a = -3 already present; no rational
    small-degree isogeny).
  constraints:
  - Known-scalar multiplication cost only; a gain here is not an ECDLP or rho
    gain (AGENTS.md, intermediate-cost section).
  - Modelled operation counts and measured timings are separate columns.
  - Every reported route is verified on points (k P computed both ways).
  - Positive and negative controls run on the same instrument.
  status: active
  owner: coordinator
