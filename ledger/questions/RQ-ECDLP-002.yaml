research_question:
  id: RQ-ECDLP-002
  title: Can index calculus beat Pollard rho for ECDLP over generic prime fields?
  scope:
    curve_families: [short_weierstrass]
    field_types: [prime]
    bit_sizes: [asymptotic]
    methods: [summation_polynomial, point_decomposition, index_calculus, pollard_rho_baseline]
  motivation: >-
    The central open question of the program (KN-OPEN-001). Over extension
    fields index calculus is subexponential; over prime fields no method is
    known to beat the generic sqrt(N) bound. This question asks for either an
    algorithm or a proof that the routes are closed.
  decision_target: >-
    Whether to invest further in prime-field index calculus, and if so on which
    axis -- settled by the reduction chain CHAIN-ECDLP-001, whose load-bearing
    link is the decomposition-oracle crux.
  constraints:
    - 'asymptotic claims only; no toy result may be presented as crypto-scale'
    - 'every link of the reduction chain must be marked proved | conditional | open'
  status: active
  owner: coordinator
