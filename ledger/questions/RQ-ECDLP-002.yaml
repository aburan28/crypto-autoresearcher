research_question:
  id: RQ-ECDLP-002
  title: >-
    Does any novelty-screened public mechanism or verifiable methodology yield a
    fully charged reduction in prime-field ECDLP attack cost or a credible,
    independently checkable route toward one?
  scope:
    curve_families:
      - generic prime-field short-Weierstrass curves
      - explicitly identified structured or endomorphism-rich public curve families
    field_types: [prime]
    bit_sizes:
      - toy instances for executable falsification only
      - symbolic asymptotic models
      - standardized public curves only when no secret scalar or live key is targeted
    methods:
      - generic-group and augmented-oracle simulability analysis
      - endomorphism, representation, and structured-curve leverage
      - relation collection, sparse linear algebra, and descent
      - multi-target, preprocessing, and memory-time tradeoffs
      - certificate-driven cryptanalytic methodology and full-path cost auditing
  motivation: >-
    The existing ledger contains many narrow active questions and a large, heavily
    deduplicated idea corpus, but no persistent campaign binds mechanism novelty,
    complete attack-path accounting, independent review, and durable checkpoints to
    the user's positive search objective.
  decision_target: >-
    Admit only a mechanism or methodology whose operation-level novelty survives the
    full ledger/idea/literature screen and whose cheapest decisive test can change a
    scoped ECDLP decision. A failed candidate or negative batch narrows the frontier
    but does not close this question.
  constraints:
    - Lawful defensive cryptanalysis using public constructions and toy benchmarks only.
    - No targeting, recovery, or testing of live private keys, wallets, or deployed systems.
    - Pollard rho, BSGS, and relevant generic/preprocessing lower bounds are mandatory matched controls.
    - No breakthrough claim without a non-originating independent review-xhigh session and scope-appropriate evidence.
    - Every claimed solve or relation requires an independently reverified certificate.
    - Timeouts, crashes, unavailable models, and invalid artifacts are infrastructure signals, not mathematical evidence.
  status: active
  owner: coordinator
