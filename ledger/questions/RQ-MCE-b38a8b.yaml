research_question:
  id: RQ-MCE-b38a8b
  title: >-
    Can a valid toy binary-Goppa public code support an ordinary user decoder
    and a distinct master-keyed decoder-recovery witness without separating
    from the matched honest-Goppa distribution under structural tests?
  scope:
    scheme: >-
      Toy binary Goppa codes in a McEliece-like public-code interface; no
      Classic McEliece parameter set, standard key format or deployed
      implementation
    family: >-
      Designer-side code-based trapdoor feasibility and defensive structural
      detection
    target_interface: >-
      Compare HonestGen(theta; r) -> (pk, sk_user) with
      TrapGen(tau, theta; r) -> (pk, sk_user, audit_witness), and require
      MasterRecover(tau, pk) to output a second equivalent bounded-distance
      decoder without access to sk_user or audit_witness. Candidate and honest
      public keys use the same frozen representation and parameter tuple. One
      tau must govern multiple independently randomized candidate keys in a
      declared nested cohort; multiple independent tau values are tested. A
      one-time tau is a per-key auxiliary secret, not a master key.
    parameter_boundary:
      - >-
        Smoke grid: m in {4, 5}, t in {2, 3}, 12 <= n <= 32 and n <= 2^m.
      - >-
        Largest admissible comparison grid: m in {5, 6}, t in {2, 3, 4},
        24 <= n <= 64 and n <= 2^m, reduced whenever exact public recovery or
        the registered symbolic invariants exceed the frozen batch budget.
      - >-
        No experiment above m = 6, n = 64 or t = 4; no extrapolation to a
        Classic McEliece or ISO parameter set; no standards-compatible key or
        ciphertext serialization.
    candidate_lanes:
      - >-
        DUAL DECODING REPRESENTATIONS. Seek two hidden Goppa decoding
        descriptions for one public code, with the second selected or
        reconstructed from tau, after quotienting by a pre-declared class of
        trivial support, field, row and coordinate equivalences.
      - >-
        MASTER-KEYED LOW-RANK QUADRATIC / SYZYGETIC WITNESS. Use tau to derive
        or locate a low-rank element of a frozen quadratic-relation space or a
        low-degree syzygy of a frozen relation ideal/module, then test whether
        that witness yields an equivalent decoder. Conditioning and rejection
        sampling are charged and measured as possible public signals.
    targets:
      - >-
        Functional correctness of the ordinary and master-derived decoding
        routes on only locally generated toy errors, with independent
        certificates and exhaustive error enumeration where the frozen budget
        permits it.
      - >-
        Whether the master key yields a reproducible charged work advantage
        over the best registered public witness/decoder search on the same toy
        keys; wall-clock speed alone is not an acceptable metric.
      - >-
        A matched comparison of candidate and honest Goppa public-key
        distributions, calibrated by honest-versus-honest null cohorts and
        planted-representation / planted-witness positive controls.
      - >-
        A defensive result when a public invariant, public witness search or
        equivalence test exposes the extra route, including a named mechanism
        and forward guidance rather than a bare rejection count.
    methods:
      - >-
        Source and object audit first. Primary Goppa-equivalence, quadratic-
        relation and syzygy-distinguisher sources are filed and their exact
        coefficient fields, maps, ideals, modules, gradings and rank notions
        frozen before any candidate is evaluated.
      - >-
        Object-first construction. A candidate must first demonstrate both
        decoding routes on the smoke grid before any large cohort is generated;
        a proposal without a functional witness is not sent to a distribution
        screen.
      - >-
        Blinded paired cohorts, domain-separated seeds, an untouched holdout,
        multiple keys under each fixed tau, multiple independent tau values,
        sample size and power analysis, pre-declared equivalence margins,
        multiplicity correction, confidence intervals and a joint classifier.
        Single-key detectors receive only (pk, theta); a set detector receives
        only an unordered public-key multiset and theta, with no tau or true
        grouping labels. No public detector receives a decoder or audit
        witness. Passing means only non-detection by the frozen battery at
        achieved power.
      - >-
        Structural feature panel: Schur-square and Schur-cube dimensions plus
        puncturing/shortening profiles; coordinate-permutation automorphism
        group order and orbit/support statistics; quadratic-relation-space
        dimensions and low-rank spectra; low-degree syzygy, Hilbert and graded
        Betti invariants.
      - >-
        Independent public-recovery and red-team pass. The Red Team searches
        for the witness without tau, tests rejection/support bias, and tries
        unregistered structural combinations against untouched seeds.
  claim_tier_ceiling: >-
    TOY AND DEFENSIVE ONLY, WITHOUT EXCEPTION. A functional candidate is an
    existence observation inside the exact synthetic cells tested, not a
    Classic McEliece trapdoor. Failure of a finite detector battery supports
    only the statement that the battery did not detect the candidate at the
    reported power; it does not support computational or statistical
    indistinguishability. A public distinguisher does not by itself recover a
    decoder or decrypt anything. No result may be stated as applying to a
    standard parameter set, implementation, third-party key, or traffic.
  motivation: >-
    McEliece's intended secret already consists of hidden decoding structure;
    the separate research object is a second recovery route controlled by a
    master secret while the ordinary owner retains a normal decoder. That
    creates two questions that cannot be separated honestly: whether the extra
    algebraic witness functions, and whether conditioning on it changes the
    public distribution. A generic malicious key generator could carry an
    arbitrary covert payload, but that is excluded here because it says
    little about code structure and directly conflicts with the defensive
    scope. The scientifically useful outcome may therefore be constructive or
    negative: a dual description not detected by a stated toy battery, a
    low-rank/syzygetic witness that immediately yields a detector, a public
    recovery route that destroys the master advantage, or a named structural
    obstruction showing why a candidate family collapses. Measuring the Schur,
    automorphism, quadratic-relation and syzygy/Betti panels in the same paired
    experiment makes those outcomes comparable instead of allowing
    functionality and stealth to be reported from different samples.
  decision_target: >-
    For each of the dual-representation and master-keyed quadratic/syzygetic
    lanes, choose exactly one supported toy disposition: (i) a functional
    master route not detected by the frozen structural battery at stated
    power; (ii) a replicated public distinguisher or public witness-recovery
    route; (iii) a named algebraic/equivalence obstruction with forward
    guidance; or (iv) inconclusive at the declared budget. No disposition may
    be promoted to a deployment recommendation or a crypto-scale claim.
  provenance: >-
    USER-DIRECTED RESEARCH QUESTION RECORDED 2026-08-08 from the referenced
    McEliece trapdoor discussion. The dual-representation and master-keyed
    low-rank-witness mechanisms are research proposals, not reported existing
    constructions. The repository holds an adjacent but unverified structural
    map under RQ-MCE-e65b3c, including KN-LIT-71d1a0 for the syzygy
    distinguisher; that entry explicitly says its full text was not read and
    its parameter reach was not established. This question therefore treats
    source acquisition and exact object definition as the first research
    stage and relies on no unfiled construction, complexity, distribution or
    security claim.
  constraints:
    - >-
      LAWFUL ACADEMIC / DEFENSIVE WORK ON LOCALLY GENERATED TOY OBJECTS ONLY.
      No live or third-party key, ciphertext, traffic, device, service,
      endpoint, wallet, account or deployed implementation may enter an
      experiment.
    - >-
      NO COVERT OR PRODUCTION USE. Do not build or modify an operational key
      generator, standards-compatible library, wire format, escrow system,
      interception tool or traffic-decryption facility. Do not deploy a
      candidate and do not advise another party how to conceal one in a
      production system.
    - >-
      No secret exfiltration or subliminal channel. Tau may only derive or
      locate the explicitly declared algebraic witness and may not encode
      user data, secret keys, identifiers, messages or telemetry into pk.
    - >-
      The master-key lifecycle is frozen before generation: one tau controls
      multiple independent keys, multiple tau values are sampled, randomness
      is domain-separated, and within-master and across-master public-key
      correlations are registered through a pk-only unordered-set detector.
      True tau labels are hidden until scoring and may not be detector features.
      If tau is not reused, the result must be labeled a per-key auxiliary-
      secret experiment.
    - >-
      The toy boundary is binding: m <= 6, n <= 64 and t <= 4, with only a
      nonstandard local serialization. Any task requesting a standard
      parameter set or implementation integration is outside this question
      and must be refused rather than merely labeled exploratory.
    - >-
      The exact trivial-equivalence quotient is frozen before searching for a
      dual representation. A publicly computable relabeling is a positive
      control and cannot satisfy the constructive criterion.
    - >-
      The structural detector contract is frozen before candidate labels are
      opened. Report the entire registered panel, all controls, the untouched
      holdout, effect sizes, uncertainty, multiplicity treatment and achieved
      power; selecting only favorable invariants invalidates the comparison.
      Primary public features implement Detect(pk, theta) and may not receive
      tau, sk_user, sk_master or audit_witness. Multi-key public features
      implement DetectSet(P, theta) on an unordered public-key multiset without
      tau or group labels; private-metadata features are audit-only diagnostics.
    - >-
      A replicated separation by a primary detector or registered public
      distribution leakage gate fails that candidate lane even when other
      metrics pass. Conversely, no separation under finite power is reported
      only as non-detection under the tested battery, never as
      indistinguishability or safety.
    - >-
      Timeouts, underpowered cohorts, failed symbolic computations and missing
      dependencies are infrastructure or inconclusive outcomes, not evidence
      about existence, detectability or security (AGENTS.md rules 5-7).
  status: active
  owner: coordinator
  created_at: '2026-08-08'
