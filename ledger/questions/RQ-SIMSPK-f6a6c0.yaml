research_question:
  id: RQ-SIMSPK-f6a6c0
  title: >-
    SIMON and SPECK: where do the published rotation constants sit in the
    distribution of achievable security over the whole constant space, and is
    there any computable measure under which they are anomalous?
  scope:
    scheme: "SIMON and SPECK block cipher families (all block/key size variants)"
    family: "AND-RX Feistel (SIMON) and ARX (SPECK) lightweight block ciphers"
    assumption: >-
      The contested object is NOT a hardness assumption. It is a DESIGN
      DECISION WITHOUT A PUBLISHED DERIVATION. The families were standardized
      into some settings and rejected from others explicitly over the absence
      of a full design rationale, and the specific unexplained choices are
      small integer parameters — SIMON's rotation triple and SPECK's rotation
      pair — over a space small enough to enumerate exhaustively.
    standardization_status: >-
      Designed at the NSA and published in 2013. Reported as rejected from
      ISO/IEC 29192-2 (lightweight block ciphers) in April 2018 after roughly
      3.5 years of deliberation, on trust grounds rather than on a published
      attack, while reportedly appearing in ISO/IEC 29167-21 and -22 for RFID
      air-interface use. BOTH STANDARDIZATION CLAIMS ARE UNVERIFIED HERE.
      Deployed in some constrained and embedded settings regardless.
    targets:
      - >-
          EXACT BASELINE REPRODUCTION (KN-TECH-080 audit 1): the rotation-constant
          space has been studied before, and the FIRST obligation is to
          reproduce that prior evaluation rather than to redo it in ignorance.
          Reproduce the published optimal-differential and optimal-linear trail
          bounds for the standardized constants at named round counts, and
          reproduce whatever ranking of alternative constants the prior work
          reports. A campaign that cannot reproduce the prior ranking has no
          business extending it.
      - >-
          THE EXTENSION, WHICH IS THE ACTUAL QUESTION: prior evaluation of the
          constant space is, as far as this program's corpus shows, scored
          against differential and linear bounds. Score the standardized
          constants against the FULL computable portfolio instead —
          differential, linear, impossible-differential reach,
          integral/division-property reach, and for SPECK rotational-XOR — and
          ask whether the chosen constants are unremarkable under EVERY measure
          or anomalous under any ONE. A constant set that is jointly optimal is
          a different object from one that is optimal against the two measures
          a designer would publish and mediocre against a third.
      - >-
          THE MARGIN, MEASURED RATHER THAN QUOTED: for each of the twenty
          variants, the exact optimal trail bound per round count as far as the
          solver reaches, giving a margin curve instead of the inherited
          summary that best attacks cover "slightly more than half the rounds".
      - >-
          THE NULL CONTROL, REQUIRED BEFORE ANY ANOMALY IS BELIEVED: run the
          identical scoring over a family of structurally identical ciphers
          with RANDOMLY DRAWN constants. An anomaly that also appears in the
          random family is a property of the measure, not of the design. This
          is docs/inventor-protocol.md's controls-before-belief obligation in
          its exact required form.
    methods:
      - >-
          MILP or SAT-based exact optimal-trail search over the constant space,
          with encoding, solver version, seed, and per-instance wall-clock
          ceiling declared before the run.
      - >-
          Exhaustive or declared-sampled enumeration of the rotation-constant
          space per variant, with the sampling rule stated when exhaustion is
          out of budget and the omitted region named.
      - >-
          Identical scoring pipeline applied to the standardized constants, the
          alternatives, and the random-constant null family, so that no
          measurement is made only where an effect is expected.
    claim_tier_ceiling: >-
      THE ADMISSIBLE OUTPUT IS A DISTRIBUTIONAL STATEMENT ABOUT PARAMETER
      CHOICES AND NOTHING ELSE. An anomaly is an anomaly: a position in a
      distribution under a named measure, at named round counts, with a named
      solver budget. IT IS NOT A BACKDOOR, NOT A TRAPDOOR, NOT EVIDENCE OF
      INTENT, AND MAY NOT BE WRITTEN AS THOUGH IT WERE. Symmetrically, an
      absence of anomaly is NOT a clearance, an endorsement, or a statement
      that the ciphers are secure — it is a statement that the measures tested
      did not separate the published constants from the alternatives, scoped to
      those measures and that budget. No attack on any full-round variant is
      in scope, and none is claimed.
  motivation: >-
    This is the rare case where a public controversy about a cipher reduces to
    a finite, exactly computable question. The dispute that kept SIMON and
    SPECK out of one standard was not about a published attack; it was about
    unexplained choices and an undisclosed rationale. Unexplained choices over
    a SMALL INTEGER SPACE can be evaluated rather than argued about, and the
    evaluation either separates the published constants from the alternatives
    or it does not. Both answers are worth having and neither is available in
    this program's corpus today. The question also earns its place on
    method grounds: exact optimal-trail search is mature, reachable inside a
    campaign budget, and gives INTEGER answers rather than estimates, which is
    rare for this program. Under docs/inventor-protocol.md the temptation to
    skip this because "the constants were already studied" is premature
    closure — and the correct response is not to ignore the prior work but to
    reproduce it first and then extend it along the axis it did not cover.
  decision_target: >-
    Whether the standardized SIMON and SPECK rotation constants are
    distributionally unremarkable across the full computable cryptanalytic
    portfolio, or anomalous under a specific named measure — with a
    random-constant null family establishing which of the two the measurement
    can even distinguish.
  provenance: >-
    OBTAINED BY WEB-SEARCH EXCERPT ON 2026-08-09, NOT FILED AS KN-LIT AND NOT
    READ IN PRIMARY TEXT BY THIS PROGRAM. RESEARCH TARGETS TO BE RE-READ, not
    facts on record here: SIMON and SPECK published by the NSA in June 2013;
    twenty variants across block and key sizes; best published attacks
    described in excerpt as differential and as covering "slightly more than
    half the number of rounds", with best linear attacks on SIMON quoted at
    12, 15, 19, 28 and 35 rounds without stating which variants those attach
    to; rejection from ISO/IEC 29192-2 in April 2018 after roughly 3.5 years,
    per "An Account of the ISO/IEC Standardization of the Simon and Speck
    Block Cipher Families". Sources seen in excerpt only: the FSE 2014
    differential cryptanalysis paper, eprint 2014/320 (Dinur), the
    nsacyber.github.io/simon-speck bibliography, and the standardization
    account. THE SPECIFIC ROTATION CONSTANTS ARE NOT RESTATED HERE BECAUSE THEY
    WERE NOT CONFIRMED IN THE EXCERPTS; they must be read from the
    specification. Prior systematic study of the SIMON constant space is
    BELIEVED to exist and MUST be located during acquisition — designing an
    extension without it would be the exact baseline-reproduction failure the
    inventor protocol exists to catch.
  constraints:
    - >-
      No experiment may be designed until the specification and the prior
      constant-space study are filed as KN-LIT entries at stated provenance
      levels. If the prior study cannot be located, that fact is recorded
      explicitly and the campaign proceeds knowing its baseline is missing.
    - >-
      Reference implementations of every variant under test must be pinned and
      validated against the specification's test vectors before scoring.
    - >-
      THE RANDOM-CONSTANT NULL FAMILY IS A PRECONDITION, NOT A ROBUSTNESS
      CHECK. No anomaly may be reported before the identical pipeline has been
      run against structurally identical ciphers with randomly drawn constants.
    - >-
      A solver timeout is a BUDGET OUTCOME, never a bound. Reporting "no trail
      found within budget" as "no trail exists" is a rule 3 violation and
      invalidates the record.
    - >-
      NO STATEMENT ABOUT DESIGNER INTENT, ORGANISATIONAL MOTIVE, OR THE
      PRESENCE OF A BACKDOOR MAY APPEAR IN ANY RECORD PRODUCED UNDER THIS
      QUESTION, whatever the measurement shows. The finding is a position in a
      distribution; the interpretation is not this program's to make and is not
      supported by this evidence.
    - >-
      No attack on any full-round variant is attempted or claimed.
  status: active
  owner: coordinator
  created_at: '2026-08-09'
