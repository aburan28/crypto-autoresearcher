research_question:
  id: RQ-ROS-595c15
  title: >-
    ROS and concurrency: the polynomial-time ROS solver broke a family of
    concurrent Schnorr-type protocols, and the replacements are deployed on the
    strength of proofs with named preconditions — what is the solver's measured
    cost curve, and which implementation choices push a "fixed" protocol back
    across the line?
  scope:
    scheme: "blind Schnorr signatures, MuSig1/MuSig2, FROST and Schnorr threshold variants, and any two-round protocol whose security rests on ROS-hardness or on an algebraic one-more assumption"
    family: "Schnorr-type signatures under concurrent sessions; the ROS (Random inhomogeneities in an Overdetermined Solvable system) problem"
    standardization_status: >-
      RECALLED, UNVERIFIED: FROST is on an IRTF/CFRG standards track; MuSig2 is
      deployed for Bitcoin Taproot multisignatures; blind Schnorr variants are
      deployed in e-cash and token-issuance systems.
    targets:
      - >-
        THE MEASURED COST CURVE: implement the sub-exponential/polynomial ROS
        solver and measure its running time and memory as a function of the
        number of concurrent sessions and of the group order, with certificates
        — a literal forged signature verifying under the honest verification
        equation, at declared parameters.
      - >-
        THE THRESHOLD, MEASURED RATHER THAN QUOTED: the number of concurrent
        sessions at which the attack becomes cheaper than the generic
        alternative, on this program's own implementation, reported as a curve
        with its uncertainty.
      - >-
        THE PRECONDITION MAP FOR THE REPLACEMENTS: for each of the deployed
        two-round protocols, the named precondition (nonce-commitment round,
        two-nonce linear combination, binding factor derivation, session
        identifiers, transcript inclusion) and a certificate for what happens
        when that precondition is instantiated incorrectly — for example a
        derandomized or reused nonce, or a binding factor computed over an
        incomplete transcript. This is the reachable part: the protocols are
        sound, and implementations still have choices.
      - >-
        THE ALGEBRAIC ASSUMPTION SURFACE: which of the replacements' proofs
        rest on an algebraic-group-model or one-more-discrete-log assumption,
        stated as a table, so the assumption being relied on is visible rather
        than folded into "proven secure".
    methods:
      - Direct implementation of the ROS solver with declared seeds, at group orders small enough to complete and at sizes chosen to expose the scaling.
      - Certificate-first: every claimed forgery emitted and re-verified by an independent verifier implementation.
      - Controls that vary exactly one implementation choice at a time in a reference implementation of each protocol.
    claim_tier_ceiling: >-
      SCOPED CERTIFICATES AGAINST THIS PROGRAM'S OWN IMPLEMENTATIONS ONLY. A
      forgery against a deliberately mis-instantiated reference implementation
      is a statement about that instantiation and never about the protocol or
      about any deployed system. No claim that a standardized protocol is
      broken may be recorded under this question.
  motivation: >-
    The ROS break is the clearest recent case of a folklore-secure construction
    failing under concurrency, and the response — two-round protocols with
    nonce commitments and binding factors — is now being standardized and
    deployed at scale in multisignature and threshold settings. The residual
    risk has moved from the protocol to the instantiation: what the binding
    factor is computed over, whether nonces can be derandomized, whether
    sessions are separated. Those are finite, checkable questions with literal
    certificates, and this program can answer them on its own implementations
    without touching anyone else's system.
  decision_target: >-
    The measured ROS cost curve and its concurrency threshold, plus a filled
    table of which instantiation choices in each deployed two-round protocol
    are load-bearing, each with a certificate or an explicit "no certificate
    found within budget".
  provenance: >-
    RECALLED FROM MODEL MEMORY ON 2026-08-09. NOT WEB-SEARCHED, NOT PRIMARY-READ,
    NOT FILED AS KN-LIT. Research targets: Benhamouda-Lepoint-Loss-Orru-Raykova
    "On the (in)security of ROS" (RECALLED as giving a polynomial-time ROS
    solver breaking blind Schnorr and MuSig1 under concurrency), Wagner's
    generalized birthday algorithm (RECALLED as the prior sub-exponential
    solver), MuSig2 (RECALLED), FROST and the CFRG FROST draft (RECALLED), and
    the algebraic one-more discrete log assumption line. All UNVERIFIED.
  constraints:
    - No certificate is recorded before the ROS reference and the specification of each protocol under test are filed as KN-LIT entries.
    - Every forgery certificate is re-verified by an independent verifier implementation and accompanied by the exact instantiation choice that enabled it.
    - All keys, sessions and transcripts are self-generated. No third-party wallet, service, node, chain or repository is probed or analysed.
    - A forgery obtained against a deliberately weakened reference implementation must be labelled as such in the record's title, not only in its body.
    - A failed forgery search is a budget outcome about a solver and never evidence of security (AGENTS.md rule 3).
  status: active
  owner: coordinator
  created_at: '2026-08-09'
