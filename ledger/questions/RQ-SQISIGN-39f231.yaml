research_question:
  id: RQ-SQISIGN-39f231
  title: >-
    Round-3 SQIsign builds its response from higher-dimensional isogeny
    representations, which are constructed out of torsion-point images. Which
    of that data is actually PUBLISHED, and is the SIDH/Kani attack template
    inapplicable for a nameable structural reason or merely for a missing
    ingredient?
  scope:
    scheme: "SQIsign, NIST additional-signatures Round 3 submission (the post-redesign, higher-dimensional variant)"
    family: "isogeny signature; the only isogeny-based Round-3 candidate"
    assumption: >-
      Not the endomorphism ring problem. The object is the PUBLISHED-DATA
      SURFACE: exactly what torsion-point and isogeny-representation
      information a verifier receives, and whether that surface admits the
      attack template that broke SIDH.
    nist_round: 3
    standardization_status: >-
      Advanced to Round 3 of the NIST additional digital signature process.
      The second-round status report is reported to state that SQIsign is
      resilient against the SIKE break "since SQIsign avoids the auxiliary
      torsion-point information exploited" there, and to recommend that future
      effort prioritize study of its security properties. UNVERIFIED here.
    targets:
      - >-
          An exact inventory, from the Round-3 specification, of what is
          public per key and per signature: which curves, which torsion bases,
          which point images, at which orders, and which of these a verifier
          actually needs versus merely receives.
      - >-
          The distinction the whole question turns on: the design COMPUTES
          torsion images internally (ideal-to-isogeny translation produces
          them by construction) whereas SIDH PUBLISHED them. Internal
          computation is harmless; publication is what the attack consumed.
          Establish which side of that line each item of the Round-3
          transcript falls on.
      - >-
          Instantiation of the Kani-based attack template against the actual
          published surface, carried to the point where the missing
          ingredient can be NAMED — unknown degree, absent torsion basis of
          the required order, a secret not of the exploitable form, or
          something else — rather than asserted to be absent.
      - >-
          Whether the named obstruction is structural or parametric: would it
          survive a variant that published slightly more, and if so which
          published item is the load-bearing omission.
    methods:
      - >-
          Specification audit first, computation second. The inventory is a
          reading task and it gates everything else; an attack template
          instantiated against a guessed data surface tests nothing.
      - >-
          NULL-OBJECT CONTROL, AND IT IS THE METHODOLOGICAL CORE HERE: run
          the identical audit against a deliberately weakened variant that
          DOES supply the ingredient claimed to be missing. An audit that
          concludes "the attack does not apply" without ever having been shown
          to fire when the ingredient is present has demonstrated nothing
          about SQIsign — only about the audit. This is
          docs/inventor-protocol.md's controls-before-belief requirement in
          its exact intended form.
      - >-
          Toy-scale instantiation at primes where the template can be run end
          to end, with the scaling behaviour of the obstruction stated rather
          than assumed to be scale-free.
      - >-
          Closure discipline per docs/inventor-protocol.md: a negative result
          is admissible only as a NAMED OBSTRUCTION with an argument and
          forward guidance stating what remains open. A count of attack
          variants tried and failed is a fatigue report and its honest status
          is unverified.
    claim_tier_ceiling: >-
      TOY TIER FOR ANY ATTACK BEHAVIOUR, without exception; a template that
      fires or fails at small primes says nothing directly about Round-3
      parameters. The specification inventory is a documentary result, not an
      experimental one, and is reported as such. A negative outcome closes
      only the exact template, published surface and parameters examined
      (AGENTS.md rule 6) and is never reported as "SQIsign is safe from
      SIDH-style attacks".
  motivation: >-
    The single most consequential structural claim about SQIsign is that it is
    not SIDH: that the auxiliary torsion-point information which turned Kani's
    lemma from a curiosity into a break is simply not published here. That
    claim appears in a status report as a sentence. It deserves an audit, for
    a reason specific to this history rather than general skepticism — the
    same community's confidence in SIDH was overturned by exactly this
    ingredient, after years in which its absence-of-attack record was read as
    evidence, and this program's corpus already carries that lesson as an open
    problem (KN-OPEN-015). What makes the audit non-trivial rather than
    pedantic is that the redesigned scheme uses higher-dimensional isogeny
    representations built FROM torsion-point images: ideal-to-isogeny
    translation in the two-dimensional design produces torsion images by
    construction. That is not a contradiction of the claim — computing torsion
    images internally is nothing like publishing them — but it means the claim
    is a statement about a boundary between internal and published data, and a
    boundary is something to be checked item by item rather than summarized.
    The redesign also changed what SQIsign publishes, at a moment when the
    scheme is in Round 3 and its tweak window is near, so the audit has a use
    beyond the ledger. The valuable outcome here is most likely a NEGATIVE
    one: a named obstruction, stated precisely enough that someone proposing a
    variant can check whether their change removes it. That is a result this
    program's closure standard recognizes and the literature currently lacks.
  decision_target: >-
    Whether the SIDH/Kani attack template is inapplicable to Round-3 SQIsign
    for a nameable structural reason, and which published item, if any, is
    the load-bearing omission that keeps it inapplicable.
  provenance: >-
    OBTAINED BY SEARCH-TOOL EXCERPT ON 2026-08-04, NOT FILED AS KN-LIT. Seen
    in excerpt: NIST IR 8610, the second-round status report for the
    additional signature process (nvlpubs.nist.gov), for the Round-3 roster,
    the SIKE-resilience sentence, the KLPT-to-higher-dimensional redesign, the
    "more natural distribution / clarifying zero-knowledge properties"
    language, and reported sizes as low as 148 bytes at category 1; the CSRC
    Round-3 additional-signatures page for the roster; "SQIsign2D-West: The
    Fast, the Small, and the Safer" (eprint 2024/760) for the two-dimensional
    design and its IdealToIsogeny producing torsion images; and an eprint
    archive item (2026/394) describing the Round-2 version's use of Kani's
    lemma and two-dimensional abelian varieties. NO ROUND-3 SPECIFICATION HAS
    BEEN READ BY THIS PROGRAM, and the published-data inventory this question
    asks for CANNOT be assembled from any source listed here — that is the
    first task, not a formality. A phrase about the Kani anti-isometry being
    publicly computable from torsion images appeared in a search synthesis
    without a resolvable attribution and is DELIBERATELY NOT RELIED ON in this
    record. The corpus independently holds KN-LIT-072 (the original SQIsign
    paper), KN-TECH-057 (matched full-cost baselines for supersingular
    path-finding), KN-OPEN-013 and KN-OPEN-015 (the post-SIDH hardness and
    auxiliary-torsion open problems).
  constraints:
    - >-
      Every technical statement here is UNVERIFIED and no Round-3
      specification has been read. No experiment may be designed until the
      Round-3 submission and the primary higher-dimensional-design papers are
      filed as KN-LIT entries at stated provenance levels.
    - >-
      SCOPE SEPARATION IS BINDING AND THREE-WAY. GOAL-SSI-001 owns
      endomorphism-ring and isogeny-path hardness and the KN-TECH-057
      baselines; GOAL-SQISIGN-001 owns signing-transcript distinguishability
      against a claimed simulation. This question owns neither: it asks what
      is published and whether a specific known template consumes it.
    - >-
      The SIDH torsion-image setting itself remains out of scope as a target;
      it is used here only as the source of the attack template and as the
      construction of the null control.
    - >-
      A negative result requires a named obstruction, an argument, and
      forward guidance. Under docs/inventor-protocol.md a screening count is
      not a closure and must be recorded as unverified.
    - >-
      The null control is a precondition, not a robustness check. No
      conclusion that the template fails to apply may be recorded before the
      same audit has been shown to fire against a variant supplying the
      allegedly missing ingredient.
    - >-
      No result is reported as a statement about SQIsign at Round-3
      parameters. Toy-scale behaviour is toy-scale behaviour (AGENTS.md rule
      7).
  status: active
  owner: coordinator
  created_at: '2026-08-04'
