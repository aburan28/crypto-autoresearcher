research_question:
  id: RQ-ECTD-001
  title: >-
    Can a Teske-style elliptic-curve trapdoor exist for ordinary curves over
    generic prime fields, via a secret isogeny to a rare endpoint-specific
    ECDLP weakness that is not a public isogeny-class invariant?
  scope:
    curve_families:
      - ordinary short-Weierstrass curves over prime fields
      - same-order isogenous curves across horizontal and vertical volcano levels
      - deliberately generated trapdoor endpoints (not only random public curves)
    field_types: [prime]
    bit_sizes:
      - toy instances ~40–80 bits for executable class enumeration and algebraic meters
      - larger sizes only for asymptotic cost models and detectability arguments
    methods:
      - literature reconstruction of Teske / GHS-isogeny / hidden-SNFS trapdoor patterns
      - ordinary isogeny-graph and endomorphism-ring (conductor) enumeration
      - Semaev / Gröbner / factor-base heterogeneity meters across isogeny neighborhoods
      - trapdoor DDH and hidden-representation analogues as intermediate objectives
      - red-team detectability and public path-recovery cost gates
    claim_tier_ceiling: >-
      Toy-tier for all empirical meters until a certified sub-rho solve or a
      verified precomputation/individual-log separation is exhibited at the
      tested sizes. No toy result may be reported as a crypto-scale trapdoor.
  motivation: >-
    Teske constructs a trapdoor ECDLP over F_2^161 by hiding a secret isogeny
    to a GHS-weak curve. Over generic F_p the same architecture cannot hide
    order-based or embedding-degree weaknesses because those are isogeny-class
    invariants and F_p has no proper subfields. The open scientific question is
    whether any rare, equation-dependent, endpoint-specific weakness still
    varies enough inside an ordinary class (especially across a hard conductor
    barrier) to support a genuine prime-field successor to Teske — as opposed
    to a protocol backdoor or weak-key generator.
  decision_target: >-
    Either (i) a constructive, independently reviewable prime-field trapdoor
    candidate with private sub-rho (or SNFS-style precomputation/individual-log)
    advantage and public path-search / detection remaining at least rho-hard
    inside the tested scope; or (ii) a scoped barrier naming the obstruction
    that kills each prioritized endpoint family (secret factor bases, vertical
    conductor traps, hidden correspondences, trapdoor-DDH-first) with forward
    guidance on what remains open. A count of rejected mechanisms without a
    named obstruction is fatigue, not closure (docs/inventor-protocol.md).
  provenance: >-
    Secondary briefing inputs/ECTD-TESKE-20260731/briefing.md (ChatGPT Pro
    analysis of Teske and related papers, 2026-07-31). All paper-level claims
    are UNVERIFIED until filed/upgraded as KN-LIT entries against primary
    sources. KN-LIT-7261 currently stubs Teske at title-only with a missing
    local PDF.
  constraints:
    - >-
      Lawful defensive cryptanalysis and trapdoor-detection research only.
      No targeting of live private keys, wallets, or deployed systems.
    - >-
      No experiment may be designed until the Teske primary source and the
      approach-adjacent papers listed in the briefing are either filed as
      citation-verified KN-LIT entries or recorded as blocked with exact
      fetch obstructions.
    - >-
      Class-invariant weaknesses (smooth order, anomalous trace, low embedding
      degree, supersingularity) are out of scope as secret endpoints behind
      F_p-isogenies; they may appear only as negative controls.
    - >-
      Matched Pollard rho / BSGS baselines are mandatory for any claimed
      private advantage. Fixed-factor-only gains (e.g. secret GLV alone) are
      recorded but do not meet the completion criterion.
    - >-
      Every claimed private solve requires an independently reverified
      certificate (docs/claims-and-verification.md).
    - >-
      Timeouts, crashes, and missing PDFs are infrastructure signals, not
      mathematical evidence against a mechanism.
  status: active
  owner: coordinator
  created_at: '2026-07-31'
