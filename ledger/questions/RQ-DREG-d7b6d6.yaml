research_question:
  id: RQ-DREG-d7b6d6
  title: >-
    In the regime where a Semaev or Weil-descent Gröbner system has a growing
    solving degree, does any F_q-isogenous curve keep a strictly slower growth
    of first-fall degree, last-fall degree, or named-order solving degree than
    the other members of its isogeny class?
  scope:
    curve_families:
      - ordinary elliptic curves over a small finite field, enumerated inside one F_q-isogeny class by explicit Vélu walks
      - the same base curve's non-isogenous coefficient-matched controls over the same field
      - binary and small-characteristic extension exemplars where a chained Semaev or Weil-descent system is already known to leave the m=3 degree floor
    field_types:
      - prime field F_p at toy size, only for summation degree m >= 4 or an equivalent system whose degree is not stuck at the nonlinear floor
      - extension field F_{q^n} and its Weil restriction to F_q, including the boolean chained Semaev system over GF(2)
    bit_sizes:
      - toy ladders only: parameters small enough that a per-degree Macaulay rank profile completes, or is reported as unmeasured when it does not
      - no cryptographic curve, and no claim transferred from the toy ladder without a separately named heuristic
    methods:
      - explicit F_q-rational ell-isogenies (Vélu), with the walk degree charged
      - first-fall degree, last-fall degree (Huang-Kosters-Petit-Yeo), and solving degree for one named monomial order
      - per-degree Macaulay rank profile against a support-matched null
      - stratification by Kohel volcano level (conductor of End) versus horizontal j-variation at fixed level
  motivation: >-
    ECDLP instances on F_q-isogenous curves are polynomial-time equivalent once
    the isogeny is known, and the ordinary isogeny graph is navigable. The
    Weierstrass coefficients, and therefore the summation polynomial, are not
    class invariants. If the Gröbner degree that dominates algebraic
    point-decomposition cost grew strictly more slowly on some member of the
    class, a walk to that member would be an attack the group order does not
    see. The program has already closed the adjacent screen: RQ-ISO-001 /
    H-ISO-001 is rejected_scoped (DEC-20260716-003, EV-ISO-001) because at
    prime-field m=3 every neighbor and every coefficient control sits at the
    solving-degree floor 2 or 3, and ISO-EXP-A2 found no exploitable early
    fall from L3 coefficient variation. That screen never entered the regime
    where the degree grows. GOAL-DREG-001 and RQ-DREG-001 ask whether the
    boolean chained system tracks a semi-regular null as n grows; they do not
    ask whether an isogenous curve is the outlier. RQ-VOLC-f6253b asks whether
    volcano depth changes any attack cost, and routes a depth effect through a
    named non-generic resource; it does not fix the observable to the Gröbner
    degree profile. This question is the measurement that sits in the gap: the
    same decomposition system, varied only along isogenies, scored by the
    degree quantities that can actually grow, against nulls that can show the
    variation is coefficient noise rather than an isogeny effect.
  decision_target: >-
    A later Coordinator decision, not taken here, on whether any tested
    F_q-isogenous member has a first-fall degree, last-fall degree, or
    named-order solving degree whose growth along the declared ladder is
    strictly slower than both the other class members and the declared
    non-isogenous nulls, by a pre-registered margin. A flat profile across the
    class is a first-class outcome and closes only the tested system shape,
    field, degree, and walk. An incomplete Macaulay profile is an unmeasured
    cell, not evidence that the degree exploded.
  constraints:
    - >-
      Do not rerun the closed prime-field m=3 neighbor screen. RQ-ISO-001,
      H-ISO-001 (rejected_scoped), EV-ISO-001, DEC-20260716-003, and the
      ISO-EXP-A2 gated first-fall meter already report that m=3 solving degree
      and decomposition yield do not separate isogeny neighbors from
      coefficient variance. A proposal whose only observable is m=3 d_reg on
      prime-field neighbors is out of scope.
    - >-
      First-fall degree, last-fall degree, named-order solving degree, and the
      Bardet-Faugère-Salvy degree of regularity are different quantities.
      IDEA-20260807-f6137c records that a single "true degree of regularity"
      meter is not constructible off the semi-regular locus. KN-TECH-004 and
      KN-TECH-011 record the same split. Report the named quantity that was
      computed. Do not equate them.
    - >-
      A timeout, memory exhaustion, or aborted F4 run is never evidence that
      the degree exploded (AGENTS.md rule 3). The admissible fallback is a
      completed per-degree Macaulay rank profile at a pre-registered degree
      bound. A cell that does not finish is unmeasured.
    - >-
      Every comparison uses a null of the same shape: a non-isogenous curve
      over the same field, and a support-matched system that keeps the
      monomial shape of the summation system while destroying the elliptic
      relation. An isogeny-only census with no null cannot separate an
      isogeny effect from coefficient variance.
    - >-
      Only F_q-rational isogenies transfer an F_q-rational DLP instance. A
      geometric isogeny that does not map E(F_q) to E'(F_q) is a different
      object and must be labeled as such. Tate's theorem makes the group
      order, the trace, and the extension point counts class invariants; a
      proposal may not treat those as varying inside the class.
    - >-
      If a proposal claims an attack, the walk is charged. Galbraith's
      ordinary-isogeny navigation cost is part of the total, recalled here as
      ePrint 2024/924 and marked unverified until read. A degree gap smaller
      than the charged walk is not an improvement.
    - >-
      Toy scale only. No conclusion about a cryptographic curve. The tested
      parameters and any transfer assumption are stated on every idea
      (AGENTS.md rules 4 and 6).
    - >-
      Subset-column coranks are not evidence for the boolean ladder
      (GOAL-DREG-001). Full-column exact ranks, a graded pivot-degree Hilbert
      function, or a completed fall-degree certificate are the admissible
      rank observables.
  status: active
  owner: coordinator
