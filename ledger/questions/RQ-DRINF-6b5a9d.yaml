research_question:
  id: RQ-DRINF-6b5a9d
  added: '2026-10-05'
  title: >-
    For rank-2 Drinfeld modules over F_q[T], do the period-lattice
    torsion prediction and the Frobenius characteristic-polynomial
    isogeny-class count match the elliptic-curve analogies stated in
    the title-level notes KN-LIT-174 and KN-LIT-1515, on one tiny field?
  scope:
    curve_families:
      - >-
        Rank-2 Drinfeld F_q[T]-modules and the rank-1 Carlitz reduction,
        not elliptic curves. Named instance: q = 3, A-characteristic
        (T), Phi_T = tau + tau^2, and the six modules
        Phi_T = g tau + Delta tau^2 with Delta nonzero in F_3.
    field_types:
      - finite fields that are extensions of F_q[T]/P
    bit_sizes:
      - q = 3; deg(T) = 1; deg(T+1) = 1; extension degree m = 1
    methods:
      - >-
        Geometric kernel cardinality of one separable additive
        polynomial (period-lattice shadow).
      - >-
        Enumeration of Frobenius characteristic polynomials and of
        j-invariants once those definitions are read from the local
        PDFs (isogeny-class count). Not an Anderson-motive computation.
  motivation: >-
    Drinfeld modules are the function-field analogue of elliptic
    curves: a period lattice in the completion at infinity, and
    explicit class field theory for F_q[T]. KN-LIT-174 and KN-LIT-1515
    are title-level (abstracts thin; PDFs not opened). They state
    elliptic-curve analogies, endomorphism rings, characteristic
    polynomials used to count isogeny classes, the Carlitz module,
    rank, and Anderson motives. This question splits the lattice
    shadow from the class count. It is not xedni lifting of prime-field
    ECDLP to F_p(t).
  decision_target: >-
    Two independent numerals. The geometric (T+1)-torsion of the named
    rank-2 module has size 9 and the rank-1 control has size 3, or one
    of those sizes fails. Separately, the characteristic-polynomial
    count read from KN-LIT-174 agrees with exhaustive enumeration on
    the six modules, or the two counts differ. Neither numeral is an
    ECDLP exponent.
  constraints:
    - Do not bind to RQ-XEDN-* or to KN-TECH-06bb4e.
    - No ECDLP campaign and no goal record.
    - Classical theorems of Drinfeld (1974) and Hayes stay provenance
      recalled until an agent opens the source.
    - The two mechanisms stay separate computations.
  status: active
  owner: coordinator
