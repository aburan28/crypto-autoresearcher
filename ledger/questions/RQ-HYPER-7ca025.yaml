research_question:
  id: RQ-HYPER-7ca025
  added: '2026-10-05'
  title: >-
    On one admissible genus-2 sextic over a tiny odd prime field, do the
    classical Wronskian Richelot (2,2)-isogeny formulae and the
    subresultant formulae named in the title-level note KN-LIT-1371
    return the same normalized codomain triple (U, V, W)?
  scope:
    curve_families:
      - >-
        Genus-2 hyperelliptic curves y^2 = Q1 Q2 Q3 over an odd prime
        field, Q1, Q2, Q3 monic quadratics, pairwise coprime, product
        squarefree of degree 6. One inadmissible control with a repeated
        quadratic factor.
    field_types:
      - odd prime fields
    bit_sizes:
      - toy prime q = 11; input degree fixed at 6
    methods:
      - >-
        Evaluate the classical Wronskian Richelot formulae and the
        subresultant (U, V, W) formulae after those formulae are read
        from the local PDF cited by KN-LIT-1371. Compare normalized
        triples. Count the (2,2)-kernel as four 2-torsion classes.
  motivation: >-
    The core code does not evaluate a Richelot (2,2) codomain triple.
    KN-LIT-1371 and KN-LIT-921 are title-level notes (abstracts thin;
    PDFs not opened). A Prym dimension is already measured by
    p1498_simple_prym_quotient_obstruction.py, and the odd-character
    cover genus on RQ-GFPN-c01af8 is already IDEA-20260920-10547b.
    Theta-null specifications already appear on H-ECDLP-e26a57.
    This question asks for one formula evaluation. It does not change
    the cost questions RQ-GFPN-c01af8, RQ-OAKLEY-264353,
    RQ-BINSTD-b6f698, or RQ-FROB-7d8dd4.
  decision_target: >-
    Either the two normalized triples agree on the first admissible
    sextic and both evaluators reject the repeated-factor control, or
    they disagree, or an evaluator accepts the control. Agreement is a
    single-example check of the note's equivalence sentence, not an
    identity proof and not a discrete-log result.
  constraints:
    - No ECDLP solver and no second ECDLP campaign.
    - Do not refile the odd-characteristic cover genus.
    - Odd characteristic only.
    - No goal record.
  status: active
  owner: coordinator
