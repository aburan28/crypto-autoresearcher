research_question:
  id: RQ-GFPN-4ab8c7
  added: '2026-09-20'
  title: >-
    For EcGFp5 and EcMasFp5 over F_{p^5} (p = 2^64 - 2^32 + 1), where do
    Gaudry/PDP, oracle-assisted static DH, odd-characteristic GHS, and
    SafeCurves-style audits place each curve relative to the design notes'
    ≥2^142 / ~128-bit claims — and which named avenues are already closed
    by arithmetic so they draw no further budget?
  scope:
    curve_families:
      - >-
        EcGFp5 (Pornin ePrint 2022/274, SRC-PORNIN-2022-274-ECGFP5): specialized
        curve over GF(p^5), double-odd / non-n-torsion group with neutral the
        unique order-2 point N = (0,0)
      - >-
        EcMasFp5 (HackMD design note, SRC-ECMASFP5-HACKMD-2025): 
        y^2 = x^3 + 3x + 8z^4 over F_p[z]/(z^5 - 3), cofactor 1
      - >-
        toy-p ladders with the same extension degree n = 5 and matching
        Weierstrass shapes, for executable PDP / cover-genus cells below the
        cryptographic p
      - >-
        isogeny-class neighbours of both curves, as controls for GHS and
        twist-security transfer
    field_types: [prime_power_extension, goldilocks_quintic]
    bit_sizes:
      - >-
        cryptographic: p = 2^64 - 2^32 + 1 (320-bit field elements); design-note
        Gaudry lower bound ≥ 2^142 is arithmetic on a model, not a measurement
      - >-
        executable toy-p ladder at n = 5 for PDP / symmetrization arms, sized so
        every cell finishes with a certificate
    methods:
      - Gaudry / Semaev-style point decomposition with named symmetrization arms
      - oracle-assisted static Diffie-Hellman costing (after JV/Granger freeze)
      - odd-characteristic GHS cover-genus computation (after Diem freeze)
      - SafeCurves-style certificate audit (twist, embedding degree, rho, …)
      - arithmetic closures (JV n-1 full-DLP variant; translation-descent lemma)
  motivation: >-
    User intake 2026-09-20: seven proposals with fixed tokens, GFPN into
    ecc_areas, sources frozen before numbers are quoted, and a deliberate
    non-opening list (coset bases, torsion quotients, Sarkar-Singh,
    linear-invariance pruning, GRUMPY/FROB/QSP, FF-DLP analogy). Both design
    notes argue ~128-bit security from a ≥2^142 Gaudry bound (Pornin) and an
    inherited field claim plus a 101.93-bit twist self-report (EcMasFp5). Neither
    note analyses oracle-assisted static DH; the odd-char GHS citation's coverage
    of n = 5 is unchecked; and several Galbraith-thread avenues are already
    opened under other goals. This question owns the GFPN-specific measurement
    and closure program only.
  decision_target: >-
    Per curve: (1) measured or tightly bounded PDP/Gaudry band at n = 5 on a
    toy-p ladder, and whether the cryptographic p sits inside or outside the
    design notes' ≥2^142 claim under the same model; (2) an OA-SDH cost with
    frozen sources; (3) GHS cover genus for the curve and isogeny class;
    (4) a SafeCurves-style certificate pack including an independent twist
    figure; (5) explicit arithmetic closures that permanently deprioritize
    named dead ends. A negative or "inside the band" result closes only the
    tested model and scale.
  constraints:
    - Lawful defensive cryptanalysis on public curve parameters only; no live keys.
    - >-
      Numbers from SRC-PORNIN-2022-274-ECGFP5 and SRC-ECMASFP5-HACKMD-2025 may be
      quoted with provenance retrieved. Figures that are not in those freezes
      (including provisional intake PDP/OA-SDH bands) are hypotheses to measure,
      never evidence, until their own sources are frozen and re-derived.
    - >-
      Do not open coset bases, torsion quotients, Sarkar-Singh, linear-invariance
      pruning, GRUMPY/FROB/QSP, or FF-DLP analogy under this question; those are
      owned elsewhere or deliberately deferred (see research/gfpn_ecmas_ecgfp5_intake_20260920.md).
  status: active
  owner: coordinator
