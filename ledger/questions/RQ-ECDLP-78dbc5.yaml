  - ref: KN-LIT-5229
    provenance: kb
    note: Coretti, Dodis, Guo, non-uniform bounds in the generic-group model (presampling)
  - ref: KN-LIT-5040
    provenance: kb
    note: Multiple discrete logarithm problems with auxiliary inputs (batch setting)
  - ref: KN-LIT-7046
