research_question:
  id: RQ-CSIDH-64343f
  title: >-
    CSIDH's quantum security level has been published as anywhere from
    catastrophically low to comfortably adequate for the same parameter set —
    reconstruct every model over one parameterization and isolate the exact
    quantity the disagreement reduces to.
  scope:
    scheme: "CSIDH-512 and the larger CSIDH parameter proposals; CSI-FiSh and SeaSign as dependent constructions"
    family: "commutative supersingular isogeny group actions; abelian hidden shift / Kuperberg-type quantum algorithms"
    standardization_status: >-
      RECALLED, UNVERIFIED: CSIDH is not standardized and was not a NIST PQC
      finalist. It remains the principal candidate for post-quantum
      non-interactive key exchange, which is a functionality the standardized
      set does not provide, so the dispute over its parameters is a dispute
      about whether that functionality is available at all.
    targets:
      - >-
        ONE COST FUNCTION WITH SWITCHES: a single parameterized model in which
        each published analysis is a setting of named switches (oracle cost
        model, quantum accessible memory model, Kuperberg variant and its
        parameters, cost of the group-action oracle in reversible gates, depth
        limits). Reproduce each published figure FROM ITS OWN SWITCH SETTING.
        Failure to reproduce is a first-class result.
      - >-
        THE DISAGREEMENT KERNEL: the minimal set of quantities whose values
        decide the answer. The dispute is widely described as being about
        several things at once; the deliverable is a demonstration that it
        reduces to a short list, or a demonstration that it does not.
      - >-
        THE MEASURABLE CLASSICAL PART: a concrete reversible-circuit gate count
        for evaluating the class group action at the deployed parameters, built
        here. This is the input the quantum models multiply by, and it is a
        classical computation this program can actually do.
      - >-
        THE STRUCTURE INPUTS: class group order and structure at small CSIDH-
        like parameters, computed and certified, as a calibration for the
        assumptions the models make about the group.
    methods:
      - One implementation of the cost model with published analyses as fixtures, each reproduced from its own inputs.
      - Reversible circuit construction and gate counting for the group action evaluation, validated by classical simulation of the same circuit at small parameters.
      - Certified class group computations at small discriminants as a calibration control.
    claim_tier_ceiling: >-
      MODEL-RECONSTRUCTION AND CLASSICAL-COUNTING CLAIMS ONLY. No quantum
      computation is performed and no quantum attack is claimed. This program
      does not adjudicate which published model is correct; it locates what
      they disagree about. Recording a verdict on CSIDH-512's security level is
      OUT OF SCOPE unless every switch is independently justified, which this
      goal does not attempt.
  motivation: >-
    A parameter set whose published quantum security estimates span dozens of
    bits is a rare object: the disagreement is between careful researchers with
    explicit models, which means it must reduce to identifiable quantities. That
    makes it tractable in a way that most security estimates are not. It also
    matters beyond CSIDH, because the same Kuperberg-cost questions recur for
    every abelian-hidden-shift-based proposal, and because the group action's
    reversible cost is the sort of quantity this program can compute exactly and
    contribute regardless of who is right.
  decision_target: >-
    The minimal set of quantities on which the published CSIDH quantum cost
    estimates disagree, and the reversible gate count of the group-action
    oracle computed here.
  provenance: >-
    RECALLED FROM MODEL MEMORY ON 2026-08-09. NOT WEB-SEARCHED, NOT PRIMARY-READ,
    NOT FILED AS KN-LIT. Research targets: Castryck-Lange-Martindale-Panny-Renes
    CSIDH (RECALLED), Peikert "He gives C-sieves on the CSIDH" (RECALLED as
    arguing CSIDH-512 is far weaker than claimed), Bonnetain-Schrottenloher
    (RECALLED, similar direction), Bernstein-Lange-Martindale-Panny "Quantum
    circuits for the CSIDH" (RECALLED as giving concrete reversible costs and a
    more conservative conclusion), and Kuperberg's algorithms. Every
    characterization of who claims what is UNVERIFIED and must be replaced by
    primary reads before any reconstruction is recorded.
  constraints:
    - No reconstruction is recorded before at least three primary analyses on different sides of the dispute are filed as KN-LIT entries.
    - Each published figure must be reproduced from that paper's own stated assumptions before this program comments on the assumptions.
    - The record may not characterize any researcher's position beyond what the filed primary text states.
    - No verdict on CSIDH's security level may be recorded under this question; the deliverable is the disagreement kernel, not an adjudication.
    - Reversible gate counts are reported with the gate set and the memory model named; a count without them is not admissible.
  status: active
  owner: coordinator
  created_at: '2026-08-09'
