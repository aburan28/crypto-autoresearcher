research_question:
  id: RQ-MLDSA-001
  title: >-
    Is ML-DSA's security governed by the assumption that is actually
    hardest at its parameters — is the SelfTargetMSIS estimate as well
    calibrated as the MLWE and MSIS ones, and does hedged mode's
    randomness discipline carry more weight than the standard admits?
  scope:
    scheme: "ML-DSA (FIPS 204, formerly CRYSTALS-Dilithium)"
    family: "lattice signature (Fiat-Shamir with aborts)"
    assumption: >-
      MLWE, MSIS, and SelfTargetMSIS at the FIPS 204 parameter sets
    standardization_status: >-
      Finalized 2024-08-13 as FIPS 204.
    targets:
      - >-
          SelfTargetMSIS concrete hardness at FIPS 204 parameters,
          independently estimated
      - >-
          which of MLWE / MSIS / SelfTargetMSIS actually binds at each
          category
      - >-
          the boundary of the existing fault-security proof: which fault
          classes lie outside it
      - >-
          hedged versus deterministic mode as an explicit attacker-model
          distinction
    methods:
      - >-
          independent re-derivation of all three problem estimates from
          primary text
      - >-
          measured calibration at reduced parameters where a forgery can
          be certified
      - >-
          explicit attacker-model taxonomy separating mathematical from
          fault/side-channel claims
      - >-
          matched baseline: best published attack per problem at
          identical parameters
    claim_tier_ceiling: >-
      Toy-tier until a certified instance at or above the standardized
      parameter scale exists. AGENTS.md rule 7 applies: no toy-scale result is
      reported as a statement about a standardized parameter set. A
      standardized algorithm makes this rule more binding, not less.
  motivation: >-
    ML-DSA's three underlying problems are not equally studied. MLWE and
    MSIS inherit a large literature; SelfTargetMSIS is the
    scheme-specific problem introduced to make the
    Fiat-Shamir-with-aborts proof go through, and its concrete hardness
    estimate carries the least independent scrutiny per unit of
    load-bearing. Separately, the implementation record is already
    sharp: reported 2026 work includes a differential fault attack that
    identifies intended faults from public information alone, a
    single-trace voltage-glitch attack on hedged ML-DSA recovering s1
    with roughly 53% success on Cortex-M4, and a formal proof covering
    only a specific class of faults at internal function boundaries.
    That combination — a proof that covers some faults and attacks that
    live outside it — is exactly where a scoped boundary result is worth
    more than another attack. These are the algorithms already being
    deployed, so the cost of a wrong security estimate is different in
    kind from a Round-3 candidate's: migration schedules are being set
    against them (reported June 2026 US federal deadlines of 2030 for
    key establishment and 2031 for signatures — unverified here), and a
    parameter set that is standardized is a parameter set nobody will
    re-derive on their own.
  decision_target: >-
    Whether ML-DSA's binding assumption is correctly identified and
    correctly costed, and where the fault-security proof's boundary
    actually lies.
  provenance: >-
    Algorithm roster taken from the NIST PQC standardization 'selected
    algorithms' page. csrc.nist.gov and nist.gov are unreachable from
    this harness's network policy (proxy CONNECT 403), so the roster and
    status dates were confirmed from secondary reporting rather than
    read from the primary page, and no FIPS text has been read by this
    program. Every per-algorithm technical claim below is a research
    target to be verified against the primary standard and against
    primary attack literature before any experiment is designed, not an
    established result.
  constraints:
    - >-
      Every per-algorithm technical claim in this record is sourced from
      secondary reporting or from memory of the literature and is UNVERIFIED.
      No experiment may be designed until the relevant primary sources are
      filed as KN-LIT entries.
    - >-
      Matched-baseline discipline: no attack cost is reported without the
      best-known baseline at identical parameters, with memory, preprocessing,
      and verification charged.
    - >-
      Any claimed break carries a certificate that the run wrapper re-verifies
      independently. See docs/claims-and-verification.md.
    - >-
      These algorithms are deployed or near-deployment. A claim about a
      standardized parameter set carries operational consequences, so no
      result leaves this program at a claim tier above the one its evidence
      supports, and no toy-scale finding is phrased as a statement about
      fielded systems.
  status: active
  owner: coordinator
  created_at: '2026-07-29'
