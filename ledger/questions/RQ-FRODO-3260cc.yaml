research_question:
  id: RQ-FRODO-3260cc
  title: >-
    FrodoKEM's two load-bearing numbers — the Renyi divergence between its
    sampling table and the rounded Gaussian it approximates, and its
    decryption failure rate — are finite exact computations at the
    standardized parameter sets. Do they reproduce, and how much security
    does the divergence argument actually buy once sample count is charged?
  scope:
    scheme: "FrodoKEM (Frodo-640 / Frodo-976 / Frodo-1344)"
    family: >-
      unstructured (plain) LWE key encapsulation, IND-CCA via a
      Fujisaki-Okamoto transform
    assumption: >-
      Plain LWE with a tabulated discrete error distribution chi, plus two
      computed quantities that stand between chi and the security claim: the
      Renyi divergence of chi from a rounded Gaussian at a stated order, and
      the decryption failure probability.
    standardization_status: >-
      Not a NIST selection. On an ISO/CFRG standardization track: a
      standard proposal is published at frodokem.org and an IETF CFRG
      Internet-Draft exists (draft-longa-cfrg-frodokem). Recommended by
      several European agencies as the conservative unstructured-lattice
      alternative to ML-KEM. Status as described here is UNVERIFIED by this
      program.
    targets:
      - >-
          Exact recomputation of the Renyi divergence between the published
          sampling table T_chi and the rounded Gaussian of the stated
          parameter, at the stated Renyi order, per parameter set.
      - >-
          The conversion step: how the divergence bound becomes a bit-security
          loss once multiplicativity over the number of samples an adversary
          consumes is applied. This is the least visible link in the chain and
          the one where an error would survive longest.
      - >-
          Exact recomputation of the decryption failure rate, by convolution
          over chi at the true dimension, compared against the published
          figure per parameter set.
      - >-
          What a decryption failure rate error is worth to an attacker under
          published failure-boosting cost models, and the sensitivity of that
          cost to the size of any discrepancy found.
    methods:
      - >-
          Exact rational arithmetic, not floating point. Both quantities are
          finite computations over distributions of small support (|z| <= 12,
          16-bit CDF table entries, q <= 2^16), so the standardized parameter
          sets are directly reachable and no extrapolation heuristic is needed.
      - >-
          Independent re-derivation from the primary specification text
          rather than reuse of the reference implementation's own scripts,
          so that a shared bug is not mistaken for agreement.
      - >-
          Null-object control per docs/inventor-protocol.md: the identical
          divergence and convolution pipeline run against a distribution whose
          divergence and failure rate are known in closed form, to establish
          that the pipeline detects a discrepancy it is claimed to detect.
      - >-
          Mutation control: deliberately perturb one table entry by one unit
          and confirm the pipeline registers the resulting change, before any
          agreement with the published numbers is reported as a verification.
    claim_tier_ceiling: >-
      SPLIT CEILING, and the split is the point. The ARITHMETIC claim — that a
      published number does or does not reproduce under exact recomputation —
      is reachable at crypto tier, because the computation is finite at the
      real parameter sets. This is unusual in this program and is the reason
      the question was selected. Every SECURITY claim remains bounded by
      AGENTS.md rule 7 and the LWE estimates this program has not
      independently derived: reproducing a number verifies an arithmetic
      assertion and nothing more, a discrepancy in a divergence or a failure
      rate is NOT an attack, and neither outcome is evidence about the
      hardness of LWE at Frodo's dimensions.
  motivation: >-
    Almost everything this program studies is out of exact reach at
    cryptographic parameters, so it works at toy scale and pays for the
    extrapolation with numbered heuristics. FrodoKEM is the rare case where
    the load-bearing quantities are finite exact computations AT the
    standardized parameters. The error distribution chi is a table of at most
    thirteen entries; the decryption failure rate is a convolution over that
    table; both were computed once by the designers and are quoted downstream
    ever since. Nobody re-derives a published parameter set, which is exactly
    what makes an error in one durable — the lesson GOAL-HQC-001 BATCH-002
    recorded when it found a printed minimum distance of 49 where four
    independent routes give 59, in a specification of a selected algorithm.
    The Renyi step deserves particular attention because it is the one link
    that is not a single number: the divergence bound has to be converted into
    a security loss using multiplicativity over the number of samples the
    adversary consumes, and the stated Renyi order (200, 500, 1000 for the
    three parameter sets, per the excerpt obtained) is a tuning knob traded
    against exactly that count. A conversion error there would not look like a
    wrong number anywhere in the document. FrodoKEM is also on a live
    standardization track rather than a finished one, so a defect found now
    can still reach the text, and it is the algorithm European agencies point
    to when they want the conservative option — which raises the cost of a
    quiet error rather than lowering it.
  decision_target: >-
    Whether FrodoKEM's published divergence and decryption-failure figures
    reproduce under independent exact recomputation at the standardized
    parameter sets, and how much bit security the divergence argument
    actually delivers once the sample count is charged.
  provenance: >-
    OBTAINED BY SEARCH-TOOL EXCERPT ON 2026-08-04, NOT BY THIS PROGRAM'S
    ACQUISITION DISCIPLINE, AND NOT FILED AS KN-LIT. The documents seen in
    excerpt were the FrodoKEM standard proposals at
    frodokem.org/files/FrodoKEM_standard_proposal_20250929.pdf and
    .../FrodoKEM_standard_proposal_20241205.pdf, the CiC/eprint paper
    "FrodoKEM: A CCA-Secure Learning With Errors Key Encapsulation Mechanism"
    (cic.iacr.org/p/2/3/25, eprint 2025/1861), and
    draft-longa-cfrg-frodokem-02. THE NUMERIC EXCERPTS ARE VISIBLY
    EXTRACTION-DAMAGED: the Table A.3 row for Frodo-640 arrived as an
    undelimited run "2.8 9288 8720 7216 5264 3384 1918 958 422 164 56 17 4 1
    200 0.324e-4" in which the Gaussian parameter, the probability entries,
    the Renyi order and the divergence are not separated by the extraction.
    The figures this record repeats — Renyi orders 200 / 500 / 1000 and
    divergences 0.324e-4 / 0.140e-4 / 0.264e-4 for Frodo-640 / 976 / 1344,
    and decryption failure rates 2^-138.7 / 2^-199.6 / 2^-252.5 — are
    therefore RESEARCH TARGETS TO BE RE-READ FROM PRIMARY TEXT, not values
    this program has established. They are recorded because naming the
    specific numbers to be checked is more useful than gesturing at a table,
    and they must be treated as suspect until re-read.
  constraints:
    - >-
      Every technical figure in this record was read from a possibly
      extraction-damaged search excerpt and is UNVERIFIED. No experiment may
      be designed until the FrodoKEM specification and the primary
      Renyi-divergence and failure-rate analyses are filed as KN-LIT entries
      at a stated provenance level, with any extraction damage marked. This is
      GOAL-HQC-001's BATCH-001-to-BATCH-002 sequence and it is not optional:
      a corpus entry is immutable once filed.
    - >-
      Exact rational arithmetic throughout. A floating-point agreement with a
      published figure is not a reproduction, because the published figure was
      itself computed in floating point and a shared rounding convention would
      hide precisely the class of error being looked for.
    - >-
      Controls before belief, per docs/inventor-protocol.md. Agreement with a
      published number counts as a reproduction only after the pipeline has
      been shown to DETECT a seeded discrepancy of comparable size; an
      unmutated pipeline that agrees with everything has demonstrated nothing.
    - >-
      Independence from the reference implementation. Re-deriving from the
      designers' own scripts tests transcription, not the mathematics.
    - >-
      AGENTS.md rule 7 separation. Implementation-side FrodoKEM results in the
      corpus — the Fujisaki-Okamoto timing attack (KN-LIT-2088), fault
      injection against the FO equality test (KN-LIT-3859), and
      hint-integrated primal attacks using side-channel information
      (KN-LIT-118, KN-TECH-047) — are OUT OF SCOPE here and may not be scored
      as evidence about the numbers this question asks about, in either
      direction.
    - >-
      A discrepancy is a documentation or analysis defect until it is costed.
      No discrepancy is reported as an attack, a break, or a statement about
      deployed FrodoKEM without a charged attacker cost and an independent
      review.
  status: active
  owner: coordinator
  created_at: '2026-08-04'
