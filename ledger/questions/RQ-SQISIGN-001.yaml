research_question:
  id: RQ-SQISIGN-001
  title: >-
    Does the SQIsign signing distribution leak information about the
    secret ideal beyond its zero-knowledge simulation assumption, and
    what is the fully charged cost of a transcript-based key recovery
    relative to the matched endomorphism-ring baseline?
  scope:
    scheme: "SQIsign"
    family: "isogeny (the only isogeny-based Round-3 candidate)"
    assumption: >-
      supersingular endomorphism-ring / ideal-to-isogeny hardness, plus
      a zero-knowledge simulation assumption
    process_status: >-
      NIST Additional Digital Signatures, advanced to Round 3 on 2026-05-14;
      team tweaks due 2026-08-14. Round-3 specification not yet read by this
      program.
    targets:
      - >-
          the signing distribution versus its claimed simulator, at v2.0
          and any Round-3 revision
      - >-
          statistical distinguishers on transcripts as a function of the
          number of signatures
      - >-
          leakage through ideal-to-isogeny conversion choices (not
          timing: distributional)
      - >-
          charged comparison against the KN-TECH-057 endomorphism-ring
          baselines
    methods:
      - >-
          transcript sampling at toy primes with a stated statistical
          test and pre-registered alpha
      - >-
          null-object control: the same test against a genuinely
          simulated transcript
      - >-
          any claimed key recovery must produce a certificate (recovered
          ideal reproduces the public curve)
      - >-
          conditional extrapolation only, with the matched baseline
          taken from KN-TECH-057
    claim_tier_ceiling: >-
      Toy-tier until a certified instance at or above the scheme's own
      parameter scale exists. AGENTS.md rule 7 applies: no toy-scale result is
      reported as a statement about deployed parameters.
  motivation: >-
    SQIsign has by far the most attractive size profile in the field
    (roughly 212 bytes of public key plus signature at category I) and
    advanced despite NIST-acknowledged concerns about implementation
    complexity and side-channel resistance; Round-2 optimization made
    signing nearly 20x faster and verification more than 6x faster, but
    the intricacy of the signing procedure — the diversity of objects
    manipulated in ideal-to-isogeny conversion — remains its stated
    weakness. The hard-problem side is already covered by GOAL-SSI-001,
    which holds the matched full-cost baselines (KN-TECH-057: VW p^{1/2}
    over F_{p^2}, or p^{1/4} over F_p conditional on mixing — not the
    easier MITM p^{2/3} or DG p^{1/3}). This goal deliberately takes the
    complementary flank: the protocol-level assumption, i.e. whether the
    signing transcript is as simulatable as claimed.
  decision_target: >-
    Whether SQIsign's zero-knowledge assumption is a real constraint at
    deployed parameters, or transcripts leak enough to beat the matched
    endomorphism-ring baseline.
  provenance: >-
    Candidate list taken from the NIST announcement of 2026-05-14 that
    nine schemes advance to Round 3 of the Additional Digital Signatures
    process. csrc.nist.gov and nist.gov are unreachable from this
    harness's network policy (proxy CONNECT 403), so the roster and
    elimination list were confirmed from secondary reporting rather than
    read from the primary page; the Round-3 specification bundle (team
    tweaks due 2026-08-14) has NOT been read. Every per-scheme technical
    claim below is a research target to be verified against primary
    sources before any experiment is designed, not an established
    result.
  constraints:
    - >-
      Every per-scheme technical claim in this record is sourced from
      secondary reporting or from memory of the literature and is UNVERIFIED.
      No experiment may be designed until the relevant primary sources are
      filed as KN-LIT entries.
    - >-
      Matched-baseline discipline: no attack cost is reported without the
      best-known baseline at identical parameters, with memory, preprocessing,
      and verification charged.
    - >-
      Any claimed break carries a certificate (recovered key annihilates the
      public map, or a forged signature verifies) that the run wrapper
      re-verifies independently. See docs/claims-and-verification.md.
  status: active
  owner: coordinator
  created_at: '2026-07-29'
