# RQ-TFISH-9b13ff -- opened by DEC-20260924-decc6a on user direction
# (2026-09-24): "let's go after other ciphers such as ... three fish."
research_question:
  id: RQ-TFISH-9b13ff
  title: >-
    Threefish (Skein v1.3 tweakable ARX block cipher; 256/512-bit blocks at
    72 rounds, 1024-bit at 80): how far do differential, rotational,
    boomerang, linear/differential-linear and algebraic distinguishers reach,
    and which of them survive the rotation constants actually standardized?
  scope:
    scheme: >-
      Threefish-256, -512 and -1024 per Skein v1.3 (MIX = modular addition,
      rotation, XOR; word permutation; subkey injection every 4 rounds with
      tweak and the key-schedule parity word C240). Reduced to r rounds, with
      the round convention declared per experiment: the start round modulo 8
      (the rotation constants cycle with period 8) and whether boundary
      subkey injections are included. Each block size is a separate
      comparison key.
    families:
      - XOR-differential and modular (signed) differential, including near-collision trails
      - rotational and rotational-XOR (RX), including the C240 constant's effect
      - related-key / related-tweak boomerang, with the switch evaluated on actual MIX layers
      - linear and differential-linear (ARX correlation via carry analysis)
      - algebraic (degree growth, cube / integral, SAT-based key recovery at low rounds)
    attacker_models: >-
      single-key, related-key, related-tweak and known-key (the Skein
      compression-function setting) are separate comparison keys. A result
      on the Skein compression function is never reported as a Threefish
      single-key result, or the reverse.
    out_of_scope: >-
      Full Skein hash collisions or preimages as a presumed target. They are
      not excluded, but no batch is designed on the presumption of one.
      Implementation attacks are out of scope.
  motivation: >-
    User-directed campaign. Threefish's published attacks sit far from its
    round count. The corpus reports a related-key boomerang distinguisher on
    34 rounds and key recovery up to 32 rounds (KN-LIT-4395), plus
    rotational-rebound results on an estimated 53/57 of 72 rounds of the
    Skein-256/512 compression function (KN-LIT-6311). The rotational line
    depends on the pass-through of the constant C240 and on the rotation
    constants, and ARX automated search (SAT/SMT trail search, RX
    differentials, differential-linear with carry-aware correlations) has
    advanced considerably since those results. This program has no Threefish
    execution campaign; GOAL-SYMF-c00fa1 is census-only.
  decision_target: >-
    For each (block size, family, attacker model, result type) comparison
    key: either (a) a distinguisher or attack verified empirically at every
    computable round count, extended only under numbered, falsifiable
    heuristics (in particular, the independence of consecutive MIX-layer
    carries and the boomerang-switch independence that Leurent-Roy-style
    incompatibility checks target), that reaches or exceeds the
    SYMF-recorded frontier; or (b) a measured obstruction with a
    resource_check.
  provenance: >-
    Opened by the coordinator on direct user instruction. Round counts below
    come from corpus literature entries (abstract-level notes), which the
    coordinator session read on 2026-09-24. The primary papers were not
    re-read by this task.
  citations:
    - ref: KN-LIT-4395
      provenance: kb
      claim: First third-party Threefish analysis; near collisions up to 17 rounds, impossible differential on 21, related-key boomerang distinguisher on 34, known-related-key boomerang on 35, key recovery up to 32 rounds.
      verified_by: coordinator session 2026-09-24 (DEC-20260924-decc6a), read the corpus entry's Key claims section; primary paper not re-read.
    - ref: KN-LIT-6311
      provenance: kb
      claim: Rotational rebound attacks; estimated 53/57 of 72 rounds of the Skein-256/512 compression function and Threefish.
      verified_by: coordinator session 2026-09-24 (DEC-20260924-decc6a), read the corpus entry's Key claims section; primary paper not re-read.
    - ref: KN-LIT-6307
      provenance: kb
      claim: Rotational cryptanalysis of ARX; reported best-known attack on reduced Threefish at its time.
      verified_by: coordinator session 2026-09-24 (DEC-20260924-decc6a), read the corpus entry's Key claims section; primary paper not re-read.
    - ref: KN-LIT-5731
      provenance: kb
      claim: Free-start partial-collision attack on Skein-256 reduced to 32 rounds; practical near-collision examples at 24 and 28 rounds.
      verified_by: coordinator session 2026-09-24 (DEC-20260924-decc6a), read the corpus entry's Key claims section; primary paper not re-read.
    - ref: Leurent-Roy, boomerang attacks on hash functions using auxiliary differentials (CT-RSA 2012)
      provenance: recalled
      claim: Recalled as showing that some published Skein/Threefish boomerang characteristics are incompatible; pointer only, supports nothing. It motivates the switch-compatibility control.
  constraints:
    - The implementation is pinned to the official Skein v1.3 Threefish known-answer tests before any reduced-round measurement.
    - Every boomerang or multi-trail construction is checked for compatibility by direct sampling of right quartets at reachable rounds; a published or searched probability that fails this check is recorded, not silently dropped.
    - Every signal is measured against a random-permutation (and, for rotational work, a random-constant) null of identical shape.
    - Results above the SYMF-recorded frontier for their comparison key receive review-breakthrough at max before promotion.
    - Negative results close only the exact tested family, round window, block size and budget.
