research_question:
  id: RQ-BINSTD-b6f698
  added: '2026-09-22'
  title: >-
    Which named, standardized binary-field elliptic curve does each index-calculus
    line in this program actually reach -- Certicom ECC2K/ECC2, the FIPS 186-4
    binary curves K-163..K-571 and B-163..B-571, the ANSI X9.62 c2tnb*/c2pnb*
    family and the SECG sect* curves that carry them -- and, curve by curve and
    phase by phase, what is the fully charged cost of the best line that reaches
    it against Pollard rho with every symmetry the curve itself grants?
  scope:
    curve_families:
      - >-
        CERTICOM CHALLENGE, the objects with a public solve target: ECC2K-130,
        the Koblitz curve y^2 + xy = x^3 + 1 over F_2[z]/(z^131 + z^13 + z^2 + z
        + 1) with group order 4*l, l a 129-bit prime (KN-LIT-096, KN-LIT-661e97),
        and the general-curve sibling ECC2-131; the solved 109-bit level as the
        one row of this table where a completed public computation exists.
      - >-
        FIPS 186-4 BINARY CURVES, arithmetic-only targets: Koblitz K-163, K-233,
        K-283, K-409, K-571 and pseudorandom B-163, B-233, B-283, B-409, B-571
        over F_{2^m}, m in {163, 233, 283, 409, 571} -- every m PRIME (verified
        in analysis/binstd-curve-audit/), so no proper intermediate subfield
        exists to descend to and the GHS lane is empty by construction.
      - >-
        ANSI X9.62 / SECG, arithmetic-only targets, in two structurally distinct
        halves verified in analysis/binstd-curve-audit/:
        (i) PRIME extension degree -- c2pnb163v1/v2/v3, c2tnb191v1/v2/v3,
        c2tnb239v1/v2/v3, c2tnb359v1, c2tnb431r1, sect131r1/r2, sect163r1/r2,
        sect193r1/r2, sect239k1 -- no proper subfield contains A or B;
        (ii) COMPOSITE extension degree m = 16k with k prime -- c2pnb176v1
        (k = 11), c2pnb208w1 (13), c2pnb272w1 (17), c2pnb304w1 (19), c2pnb368w1
        (23) -- where this program has now CHECKED, not recalled, that A and B
        lie in F_{2^16}, the cofactor is the F_{2^16} point count, and the Weil
        recursion from the subfield trace reproduces the published group order
        exactly. These five are simultaneously the GHS/Weil-descent class and
        the RQ-FROB-7d8dd4 subfield-curve class, at deployed parameters.
      - >-
        NULL OBJECTS: for every Koblitz or subfield row, the pseudorandom curve
        of the same field and group-order magnitude (B-m against K-m; a
        c2tnb curve against a c2pnb curve) as the nearby-object control for
        anything the subfield structure appears to buy.
      - >-
        EXECUTABLE TOY CELLS: Koblitz and ordinary binary curves over F_{2^n},
        n prime, 17 <= n <= 41, and subfield curves E/F_{2^d} over F_{2^{dk}}
        with dk <= 41, so that a pipeline can be run end to end with a
        certificate and a matched rho run beside it.
    field_types: [binary_extension, subfield_curve, composite_extension_degree, prime_extension_degree]
    bit_sizes:
      - >-
        executable: binary fields up to about 2^41, where index calculus and rho
        both complete and every claimed solve carries a certificate
      - >-
        arithmetic only: every named curve above at its deployed size. No attack
        is run at m >= 131 under this question; deployed parameters appear
        exclusively as rows in computed cost tables, under stated, numbered
        assumptions with their extrapolation distance shown.
    methods:
      - >-
        Semaev summation polynomials with Weil descent to F_2 (Gaudry, Diem,
        Joux-Vitse; KN-LIT-010 as the ledger's experimental exemplar), solved by
        the engines installed here -- WDSat, CryptoMiniSat (CNF-XOR), CaDiCaL,
        Macaulay2 F4 over ZZ/2, Singular std/slimgb -- with the point-decomposition
        cost charged per attempt and the relation yield charged as its multiplier
      - >-
        Semaev's chained S_3 algorithm and Nagao's disjoint-coset decomposition
        as alternative relation sources (GOAL-SEMBIN-5078bc and
        GOAL-SEMBIN-fcb7a2 own their correctness questions; this question owns
        only which curve they reach and at what charged cost)
      - >-
        GHS Weil descent and the cover-attack family (KN-LIT-007, KN-LIT-6987,
        KN-LIT-090, KN-LIT-449) on the composite-degree half, where an
        intermediate subfield exists -- including the genus of the covering
        curve actually obtainable at m/16 and whether the resulting
        hyperelliptic index calculus is cheaper than rho on the 161..353-bit
        subgroups those five curves carry
      - >-
        quasi-subfield-polynomial factor bases (RQ-QSP-f9bbdb, KN-LIT-0a321c,
        KN-LIT-4fe9d2) where the extension degree admits one
      - >-
        Frobenius-invariant and subfield-structured factor bases, orbit
        arithmetic, and the symmetry reduction of the decomposition system
        (RQ-FROB-7d8dd4)
      - >-
        the non-decomposition phases, each charged as its own column: linear
        algebra over F_2 (structured Gaussian elimination, block Wiedemann,
        Lanczos) in field operations and bytes, descent / individual logarithm,
        and preprocessing
      - >-
        MATCHED BASELINE: Pollard rho carrying every symmetry the curve itself
        grants -- negation on all rows, the n-fold Frobenius class reduction
        with its sqrt(n) gain on every Koblitz and subfield row -- plus the
        van Oorschot-Wiener parallel and memory accounting. The baseline must
        exploit at least the symmetry the attack exploits, or the comparison is
        void.
  motivation: >-
    User instruction (2026-09-22): thirty new index-calculus ideas for the ECDLP
    aimed at the Certicom ECC2K-130 challenge, the NIST binary curves and the
    ANSI curves. This program has deep machinery in this lane -- summation-
    polynomial solving degree (RQ-SDEG-001, RQ-DREG-*), relation yield
    (RQ-RELN-*), SAT and Groebner instruments (RQ-SATIC-1ae57a), the measured
    phase-cost boundary (RQ-ICPERF-94c86e), Semaev's 2015 binary algorithm
    (the SEMBIN questions), quasi-subfield factor bases at n = 131
    (RQ-QSP-f9bbdb) and the Frobenius mechanism at toy scale (RQ-FROB-7d8dd4) --
    and 164 filed proposals across them. What it does not have is a question
    indexed by the TARGET POPULATION rather than by the mechanism: no record
    says, for a named standardized curve, which of these lines reaches it at
    all, which are empty against it by a structural fact about the curve, and
    what the best reaching line costs against a properly sped-up rho.
    The pre-compute audit written for this question
    (analysis/binstd-curve-audit/) already shows why that indexing is not
    bookkeeping. The population splits in two, and the split is a property of
    the curves: every FIPS binary curve, every c2tnb curve and ECC2K-130 have
    PRIME extension degree, so the GHS lane against them is empty for want of
    an intermediate subfield, and the only index-calculus routes are
    decomposition-based; while the five composite-degree ANSI curves
    c2pnb176v1, c2pnb208w1, c2pnb272w1, c2pnb304w1 and c2pnb368w1 are
    SUBFIELD CURVES OVER F_{2^16} -- coefficients in F_{2^16}, m = 16k with k
    prime, cofactor equal to the F_{2^16} point count, group order reproduced
    exactly by the Weil recursion from the subfield trace. That composite
    degrees invite Weil descent is old news in the GHS literature; that these
    five specific deployed curves sit in the object class RQ-FROB-7d8dd4
    studies at toy scale is a fact this program had never checked, and it makes
    them the one place in the standardized binary population where the
    subfield-curve line and the deployed-parameter line meet.
  decision_target: >-
    A maintained REACHABILITY TABLE, one row per named curve and one column per
    index-calculus line, in which each cell is exactly one of: (a) STRUCTURALLY
    EMPTY, with the fact about the curve that empties it and the certificate for
    that fact; (b) DEFINED WITH A COMPUTED COST, with each phase charged in a
    hardware-independent primary unit, the assumptions numbered, and the
    extrapolation distance from the nearest measured toy cell stated; or (c)
    OPEN, with the specific missing quantity named and the experiment that would
    supply it. Beside every non-empty cell, matched rho with the curve's own
    symmetries, and the ratio. Decide, per curve: does any index-calculus line
    in this program's reach beat that rho number, and if not, by what measured
    or computed factor does it fall short. A negative closes only the tested
    lines, cells and engines -- never the curve, and never the method class.
  constraints:
    - >-
      Lawful defensive cryptanalysis. Targets are public standardized curve
      PARAMETERS and the public Certicom challenge instances only. No live key,
      no deployed public key, no captured traffic, no third-party system is a
      target of anything filed under this question.
    - >-
      ARITHMETIC ONLY AT DEPLOYED PARAMETERS. No scientific run under this
      question attacks a curve at m >= 131. Named curves appear only as computed
      rows; executable cells are toy curves at n <= 41. A proposal that asks to
      run a deployed curve is out of scope and is returned, not approved.
    - >-
      Every parameter used is re-derived or cited, never recalled. The audit in
      analysis/binstd-curve-audit/ is a SECONDARY source (OpenSSL 3.0.13 named-
      curve tables) computed in this repository; a record needing the parameters
      at claim strength re-derives them from FIPS 186-4 or ANSI X9.62 and says
      which.
    - >-
      The baseline is rho WITH the curve's own symmetries -- 2^60.9 iterations
      for ECC2K-130 (KN-LIT-096), negation everywhere, the sqrt(n) Frobenius
      class gain on every Koblitz and subfield row -- and is charged for memory
      and parallel efficiency under van Oorschot-Wiener. An index-calculus cost
      that only beats exhaustive search, or that beats a baseline stripped of
      the symmetry the attack itself uses, is not a result.
    - >-
      This question OWNS NO MECHANISM. Correctness of Semaev's chained S_3 stays
      with the SEMBIN questions, the quasi-subfield existence census with
      RQ-QSP-f9bbdb, the measured phase instrument with RQ-ICPERF-94c86e, the
      Frobenius decomposition mechanism with RQ-FROB-7d8dd4, solving degree with
      RQ-SDEG-001 and the DREG questions, relation yield with the RELN
      questions. A proposal here cites the owning question and adds the
      population-indexed content; it does not re-litigate the mechanism.
    - >-
      Pareto honesty per docs/inventor-protocol.md section 5: every proposal
      fills dominated_by against the matched rho row for its named curve, and
      sota_delta with exponents. Every closure meets the section 4 standard or
      is recorded as unverified.
    - >-
      No run is launched under this question until a frozen, approved EXP-BINSTD-*
      contract exists. The curve audit is a pre-compute falsification check
      (docs/inventor-protocol.md section 8), not evidence.
