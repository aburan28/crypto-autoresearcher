research_question:
  id: RQ-DREG-c8ae8d
  title: >-
    Inside one ordinary isogeny class, is there a curve whose Gröbner
    degree-of-regularity proxy for a fixed Semaev point-decomposition system
    stays bounded while the same proxy grows on isogenous classmates?
  scope:
    curve_families:
      - toy ordinary prime-field short-Weierstrass curves, whole F_p-isogeny class enumerated
      - the same class restricted to its volcano strata (crater, interior, floor) and to the loci a=0, b=0, and full rational 2-torsion
      - matched nulls: the Weierstrass gauge orbit of one j-invariant, and a support-matched random system with the same multidegree
    field_types:
      - prime
    bit_sizes:
      - toy instances only, p small enough that a complete isogeny class and a degree-capped Macaulay rank profile both finish
      - no cryptographic-size curve, and no extrapolation of a toy profile to one
    methods:
      - rebuild the Semaev system S_3 (and, where the degree cap allows, S_4) on each classmate from its own (a, b)
      - degree-capped Macaulay fall profile new_falls(D), never an unbounded F4 run
      - Vélu pullback of one curve's system along a rational ell-isogeny, compared with the rebuilt system on the codomain
      - explicit syzygy witness for any fall that is not shared by an isogeny neighbor
  motivation: >-
    The discrete logarithm transports across an F_p-isogeny of degree coprime
    to the group order, so a classmate whose decomposition system stayed at
    low degree while the others grew would be an algebraic shortcut to the
    same k, charged at the cost of finding and walking to that classmate.
    Order, embedding degree, and the fundamental discriminant are class
    invariants, so they cannot be that shortcut. What can still vary is the
    presentation: the coefficients (a, b), the volcano level, and the rational
    map of degree ell that an isogeny induces on x-coordinates. RQ-ICINV-475b5e
    already asks whether any attack-cost functional varies inside a class.
    RQ-DREG-bd6c86 already asks how the solving degree of one Semaev system
    grows with the descent parameters. Neither isolates the contrast this
    question is about: a classmate whose degree proxy stays bounded while the
    same proxy's certified lower bound grows on the others. A full Gröbner
    basis is the wrong instrument for that contrast, because a run that does
    not finish is not evidence of a high degree of regularity.
  decision_target: >-
    A committed Coordinator decision, scoped to the tested toy classes, on
    exactly one of three outcomes. (O1) The pre-registered degree proxy is
    constant on the class up to the gauge-orbit null, so no classmate is a
    low-degree outlier. (O2) The proxy varies, but only on a named locus
    (vanishing of a or b, or one volcano level), and the walk to that locus is
    charged. A volcano level is that locus only for the level whose proxy
    differs; curves at every other level are off it. (O3) Some curve off
    that locus keeps a bounded fall profile while an isogeny neighbor that
    is also off that locus has a certified lower bound on the last fall that
    grows,
    and the differing fall has an explicit syzygy witness. O1 and O2 are
    first-class results. O3 is the only outcome that motivates a later
    reachability argument, and it asserts nothing at cryptographic size.
  constraints:
    - >-
      Lawful defensive cryptanalysis on public constructions and toy
      benchmarks only. No targeting or recovery of live private keys,
      wallets, or deployed systems.
    - >-
      Timeouts, memory exhaustion, and aborted Gröbner runs are never
      evidence that a degree of regularity is large (AGENTS.md rule 3). The
      observable is a degree-capped fall profile. A cell that does not
      complete is not measured.
    - >-
      First-fall degree, last-fall degree, solving degree, and degree of
      regularity are different quantities. A proposal names which one its
      proxy bounds, and does not equate them without a direct comparison on
      the same generating set.
    - >-
      Every signal is compared with a null of the same shape: the gauge orbit
      of one j-invariant (many Weierstrass models, one curve) and a
      support-matched system whose coefficients are not a curve's (a, b).
      A quantity that does not change when the parameter meant to destroy it
      increases is an artifact (docs/inventor-protocol.md).
    - >-
      Evidence from these measurements is capped at claim_tier toy. No
      conclusion transfers to a cryptographic curve without a named,
      separately falsifiable heuristic.
    - >-
      This question does not approve an experiment. Ideas filed under it
      stay proposed.
