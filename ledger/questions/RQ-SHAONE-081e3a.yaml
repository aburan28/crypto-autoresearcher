research_question:
  id: RQ-SHAONE-081e3a
  title: >-
    SHA-1: what does a chosen-prefix collision cost in 2026 with memory and
    interconnect charged, and is the deployed counter-cryptanalysis detector
    complete over the attack class or only over the published attacks?
  scope:
    scheme: "SHA-1 (FIPS 180-4, deprecated), plus the deployed collision-detection countermeasure"
    family: "Merkle-Damgard, ARX, disturbance-vector / near-collision-block cryptanalysis"
    assumption: >-
      Neither a hardness assumption nor a margin. SHA-1's collision resistance
      is GONE, publicly and with certificates. What remains inherited without
      re-derivation is (a) the PRICE of a chosen-prefix collision, quoted from
      2020 GPU rental markets and cited ever since, and (b) the COVERAGE of the
      detector that deployed systems use to keep living with SHA-1.
    standardization_status: >-
      Deprecated for digital signatures and formally disallowed for most uses,
      yet still present in Git object identifiers, legacy HMAC-SHA-1, older PGP
      web-of-trust material, and long-lived archives. Deprecation removed it
      from new designs; it did not remove it from deployed state.
    targets:
      - >-
          EXACT BASELINE REPRODUCTION (KN-TECH-080 audit 1): re-derive the
          published chosen-prefix attack's cost FROM PARAMETERS — near-collision
          block count, per-block search cost, birthday phase size — and check
          the prediction against the reported computation before extrapolating
          anything. This is the RSA-001 discipline (RQ-RSA-afe33c) applied to a
          symmetric primitive, and the published attack supplies the
          measurement to validate against.
      - >-
          CHARGING WHAT CORE-HOURS HIDE: the reported cost is a GPU-time figure
          at 2020 rental prices. Memory footprint, the birthday-phase storage
          and its access pattern, and the interconnect the search actually
          needs are not expressed by it. State them, then re-cost at 2026
          hardware with the price assumption isolated as a single declared
          input rather than baked into the answer.
      - >-
          DETECTOR COMPLETENESS, THE OBJECT THAT MATTERS MOST: the deployed
          counter-cryptanalysis check flags a message as attack-derived by
          testing for near-collision block structure. Determine whether its
          criterion is defined over the DISTURBANCE VECTOR CLASS or over the
          specific published attack instances. These differ, and the
          difference is the entire safety argument for every system still
          using SHA-1 behind the detector.
      - >-
          THE ADVERSARIAL CONTROL: construct or characterise a colliding
          structure the detector would NOT flag, or prove within a stated class
          that none exists. An audit that cannot fail is not an audit; the
          detector must be run against something built to evade it.
    methods:
      - >-
          Re-implementation of the published cost model from parameters,
          validated against the reported computation, with a PRE-DECLARED
          agreement factor and failures reported as failures.
      - >-
          Small-but-real executable calibration: full MD5 chosen-prefix
          collisions are reachable within this harness's budget and provide a
          MEASURED anchor for the near-collision-block cost model that SHA-1
          only supplies at unreachable scale.
      - >-
          Source-level audit of the detection criterion against the disturbance
          vector class it claims to cover, item by item, with each covered and
          uncovered case named.
      - >-
          Charged-cost bookkeeping per docs/target-result-profile.md: memory
          beside time, price assumptions declared and varied, and the
          affected-versus-safe scope stated explicitly.
    claim_tier_ceiling: >-
      NO NEW SHA-1 COLLISION IS IN SCOPE; the compute is far beyond this
      campaign's budget and producing one would in any case restate a published
      result. The admissible outputs are (a) a validated COST MODEL, (b) a
      COMPLETENESS STATEMENT about a detector, scoped to the class actually
      audited, and (c) certificates only for objects actually computed, which
      at this budget means MD5-scale objects. A gap found in the detector is a
      statement about the detector, not a break of anything, and must not be
      reported as an attack on any deployed system.
  motivation: >-
    Every current recommendation about SHA-1 rests on two numbers this program
    cannot check: a dollar price for a chosen-prefix collision, and an implicit
    claim that the deployed detector closes the residual risk. The price is
    stale by construction — it was quoted against a 2020 GPU rental market and
    has been repeated since without re-derivation — and the detector's coverage
    is a mathematical property that has, as far as this program's corpus shows,
    never been separately audited by anyone re-deriving it. The second is the
    higher-value target and the cheaper one: it is a finite reading-and-testing
    task over a specific criterion, whereas the first requires a cost model.
    Both are reachable. Under docs/inventor-protocol.md, "SHA-1 is already
    broken, so there is nothing left to study" is precisely the premature
    closure the protocol forbids: a primitive can be broken in the collision
    sense and still carry an entirely unexamined question about the machinery
    the world uses to keep depending on it.
  decision_target: >-
    Whether this program can hold a memory-charged, re-derived chosen-prefix
    cost model for SHA-1, and whether the deployed counter-cryptanalysis
    detector's criterion covers the attack class or only its published
    instances.
  provenance: >-
    OBTAINED BY WEB-SEARCH EXCERPT ON 2026-08-09, NOT FILED AS KN-LIT AND NOT
    READ IN PRIMARY TEXT BY THIS PROGRAM. RESEARCH TARGETS TO BE RE-READ, not
    facts on record here: the first chosen-prefix collision on SHA-1 reported
    January 2020 by Leurent and Peyrin ("SHA-1 is a Shambles", eprint 2020/014,
    USENIX Security 2020), quoted at roughly US$45k in rented GPU time and
    reported as roughly two months of computation on about 900 Nvidia GTX 1060
    GPUs; the earlier Eurocrypt 2019 estimate of about 2^66.9 SHA-1-equivalent
    calls on GTX-970 class hardware at roughly US$1.2M optimistic or 2^69.4 at
    roughly US$7M conservative (eprint 2019/459); and public artifact
    repositories under the SHA-mbles organisation. THE FIGURE 2^63.4 THAT
    COMMONLY ACCOMPANIES THIS RESULT WAS NOT CONFIRMED IN THE EXCERPTS OBTAINED
    and must be read from primary text rather than carried in. Every number in
    this record is UNVERIFIED.
  constraints:
    - >-
      No experiment may be designed until the chosen-prefix paper, the earlier
      cost-estimate paper, and the counter-cryptanalysis specification are
      filed as KN-LIT entries at stated provenance levels. The detector audit
      in particular is meaningless against a remembered description of the
      criterion.
    - >-
      Memory beside time in every reported figure. A cost stated in GPU-hours
      or dollars alone is incomplete and may not be carried into a comparison.
    - >-
      The price of compute is a DECLARED INPUT, varied in a sensitivity
      analysis, never a constant folded into a headline number. A 2026 dollar
      figure with a single hidden price assumption repeats the exact defect
      this question exists to correct.
    - >-
      The detector audit must include an object built to evade it, or a stated
      argument over a named class that none exists. A pass with no adversarial
      case is not admissible evidence.
    - >-
      No new SHA-1 collision is attempted. A campaign that finds itself trying
      to produce one has misread this question and would exceed budget by many
      orders of magnitude.
    - >-
      Nothing here may be reported as a statement about the security of any
      specific deployed system, repository, or certificate.
  status: active
  owner: coordinator
  created_at: '2026-08-09'
