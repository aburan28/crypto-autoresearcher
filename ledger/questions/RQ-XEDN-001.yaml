research_question:
  id: RQ-XEDN-001
  title: >-
    At what rate does the lift probability of the function-field xedni
    representation decay with the field size, and is that rate ever slow enough
    (alpha < 1/2) to make Mordell-Weil section lifting a viable ECDLP relation
    source rather than a repetition of the classical xedni collapse?
  scope:
    curve_families:
      - rational elliptic surfaces y^2 = x^3 + a(t) x + b(t) over F_p(t)
      - the frozen EXP-XEDN-001 toy family a(t) = 0, deg b = 6
    field_types: [prime field F_p, rational function field F_p(t)]
    bit_sizes: ["p in {5, 7, 11, 13} exhaustive; p in {101, 211, 431, 809} contracted census sizes"]
    methods:
      - exact enumeration of (surface, section) incidence by fibering over sections
      - exhaustive slot census at small p as a control on the closed form
      - exact per-surface section-count histograms
      - codimension / parameter counting for the multi-section requirement
  motivation: >-
    The lifting family in this repository is closed by theorem or by literature
    on every audited route except one: the function-field xedni census
    EXP-XEDN-001, which ranked as the best representation-changing candidate in
    research_directions_20260718.md (candidate B2) and reached only a p=101
    smoke stage (0 sections in 5760 random slots, planted control recovered).
    Its phase-2 gate — fit alpha in P_lift ~ p^-alpha across >= 3 sizes and
    promote iff alpha < 1/2 — was contracted as rare-event sampling, but the
    predicted per-slot rate near p^-3 is about 1e-6 at p=101 and about 2e-9 at
    p=809, so no sampling budget of 40 runs and 14400 seconds can produce a
    nonzero count at the larger sizes, let alone a fitted exponent. The route
    therefore sits in the worst possible state: not promoted, not closed, and
    not measurable as designed. It can be settled exactly, because the section
    condition is an algebraic identity whose solution set can be enumerated by
    fibering over sections rather than sampling over surfaces.
  decision_target: >-
    Whether H-XEDN-001 is supported (alpha < 1/2 at the contracted sizes,
    promoting the function-field lift as a relation source and triggering a
    larger-size confirmation) or rejected within its tested scope (alpha >= 1/2,
    closing the function-field xedni census with exact values archived and the
    remaining lifting frontier restricted to routes outside the tested family).
  constraints:
    - >-
      Toy scale only; generated surfaces only; no production targets
      (AGENTS.md rule 7 applies to every statement derived here).
    - >-
      A closed-form count is admissible evidence only when it is verified
      against exhaustive enumeration under the SAME square-detection predicate
      used by the frozen EXP-XEDN-001 harness, including that harness's
      exclusion of the y = 0 section.
    - >-
      A result about this surface family closes this family only; it is not a
      general no-go for lifting, for xedni over number fields, or for
      higher-degree section searches.
    - >-
      The infeasibility of the original sampling design is a methodology
      observation, not evidence against the mathematical hypothesis
      (AGENTS.md rule 5).
  status: active
  owner: coordinator
