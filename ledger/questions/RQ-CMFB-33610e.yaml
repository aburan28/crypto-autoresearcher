research_question:
  id: RQ-CMFB-33610e
  title: >-
    Does the CM structure of a prime-field CM pair (a crater curve with a
    degree-5 endomorphism, its conductor-v floor, the prime-degree crater-to-
    floor isogeny, the canonical lift to Q, and the polynomial family
    p = 5t^2 + 19t + 19) give an index-calculus factor base whose advantage
    over a matched random base exceeds a constant, or does every such channel
    reduce to the recorded constant-only folds?
  scope:
    curve_families:
      - "Pair 46: p = 5947698030651343, N = 5947697996161643 (prime, both curves), t = 34489701, D = -19"
      - "crater y^2 = x^3 + 5757116383569871x + 3560173328417442 (End = Z[(1+sqrt(-19))/2])"
      - "floor y^2 = x^3 + 2087370704375809x + 1402887937802154 (End = Z[pi], conductor v = t + 2 = 34489703)"
      - "toy analogues: D = -19 curves and members of p = 5t^2 + 19t + 19 at 16-30 bits"
    field_types: [prime field F_p]
    bit_sizes: ["toy 2^16 - 2^30 with a growth arm; pair 46 at 53 bits for primitive costs only"]
    methods:
      - Semaev m = 3 decomposition counting against a matched random factor base
      - endomorphism-chain factor bases, isogeny pullback bases, canonical-lift (Xedni) relations
      - family-level comparison against random D = -19 and random curves
      - small-x in Montgomery / Edwards / Hessian models; joint x-y windows
  motivation: >-
    Pair 46's crater has a degree-5 CM endomorphism and its quadratic twist
    has order 5 v^2 (pi + 1 = v w). The ledger closes automorphism folds and
    general endomorphism quotients as constant-only (IDEA-20260807-5dfe4a,
    EV-STR-002, EV-FROB-b6e1e9) and generic lifts (EV-XEDN-001), but no
    record tests the crater/floor/lift/family structure of one concrete CM
    pair. The companion measurement campaign is
    aburan28/crypto research/pair46_factor_bases_20261015.
  decision_target: >-
    Retire each channel as constant-only, exactly obstructed, or null, or
    identify one whose advantage over a matched random base grows with N.
  constraints:
    - "No claim about pair 46 from a toy-size measurement without a growth arm."
    - "The same decomposition instrument on every arm; matched random base as the null."
    - "The qr_window (twist-aware) filter is the positive control: predicted ~2x density, no more."
  status: active
  owner: coordinator
