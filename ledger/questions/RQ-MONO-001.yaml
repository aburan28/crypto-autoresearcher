research_question:
  id: RQ-MONO-001
  title: >-
    Is the geometric monodromy of the m=3 Semaev summation cover the full
    symmetric/wreath group for generic ordinary prime-field curves, or is there
    an exceptional locus with deviant relation rates?
  scope:
    curve_families: [generic ordinary; CM panel as explicit exception screen]
    field_types: [prime]
    bit_sizes: [toy Frobenius/cycle-type census sizes]
    methods: [chebotarev_census, monodromy_computation, relation_rate_controls]
  motivation: >-
    KN-OPEN-009 is a high value/cost gate for relation-supply assumptions in
    prime-field index calculus (Tier 2). Full monodromy closes attack content;
    an exceptional locus narrows an exploitable family.
  decision_target: >-
    Admit either a census/protocol package that can decide full-vs-exceptional
    monodromy at toy scope, or a scoped no-go naming the first missing obligation.
  constraints:
    - Review-only protocol/design in the first batch; no crypto-scale claims.
    - Exclude j=0/1728 automorphism artifacts from random controls.
  status: active
  owner: coordinator
