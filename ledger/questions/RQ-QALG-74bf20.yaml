research_question:
  id: RQ-QALG-74bf20
  title: >-
    Does a genuine improvement to Kuperberg-type dihedral hidden-subgroup-
    problem algorithms exist that would move the exponent of the best
    currently known quantum attack against CSIDH's commutative isogeny group
    action?
  scope:
    curve_families: []
    field_types:
      - commutative supersingular isogeny group actions; abelian hidden shift /
        dihedral hidden-subgroup-problem (Kuperberg-type quantum algorithms)
    bit_sizes:
      - CSIDH-512
      - larger CSIDH parameter proposals (as published)
    methods:
      - genuine algorithmic improvement to Kuperberg's collimation-sieve /
        original Kuperberg algorithm for the abelian hidden shift problem
        (e.g. a mechanism that improves the 2^O(sqrt(log N)) query/time
        exponent, reduces the quantum-memory exponent at fixed time, or
        removes a structural bottleneck in the sieve)
      - any other quantum mechanism proposed against the dihedral HSP /
        abelian group action specifically as a novel ALGORITHM, not a
        re-parameterization or re-derivation of an existing published
        algorithm's cost under different switch settings
  motivation: >-
    CSIDH's quantum security rests on the hardness of an abelian hidden shift
    problem, solved by Kuperberg-type subexponential (2^O(sqrt(log p))-time)
    quantum algorithms; published cost estimates for CSIDH-512 already disagree
    by dozens of bits, but that disagreement is a dispute over MODEL SWITCHES
    (oracle cost, quantum memory model, Kuperberg variant and its parameters,
    reversible circuit cost of the group action, depth limits) applied to the
    SAME underlying algorithm family, not a claim that a better algorithm
    exists. This question searches in good faith for an actual algorithmic
    improvement to the Kuperberg-type approach itself -- an exponent-moving
    target per docs/target-result-profile.md -- while treating a rigorous,
    documented null result (a completed falsification search per
    docs/inventor-protocol.md) as a fully legitimate and likely outcome. This
    question is SHARPLY DISTINCT from RQ-CSIDH-64343f (GOAL-CSIDH-001, draft):
    that goal explicitly does NOT search for a new algorithmic mechanism and
    explicitly does NOT adjudicate CSIDH's security level (its own
    claim_tier_ceiling: "This program does not adjudicate which published
    model is correct; it locates what they disagree about"). GOAL-CSIDH-001's
    entire deliverable is RECONSTRUCTING published cost models -- reproducing
    each published figure from its own stated switches and isolating the
    "disagreement kernel" -- plus a classical reversible-circuit gate count for
    the group action and certified class-group-structure calibration; none of
    that is a quantum computation and none of it proposes a new algorithm. This
    question is the opposite motion: it takes Kuperberg's algorithm (and any
    published variant) as a fixed target and asks whether a genuinely new
    mechanism can beat it, not whether existing estimates of it can be
    reconciled. No cost figure, switch value, disagreement-kernel finding, or
    reversible gate count from GOAL-CSIDH-001 may be cited as evidence FOR a
    proposed mechanism here without independent re-derivation under this
    question's own baseline-reproduction requirement, and no mechanism
    proposed here may be cited as resolving GOAL-CSIDH-001's disagreement
    kernel. No cost figure, mechanism, or conclusion transfers between this
    question and the two sibling questions under GOAL-QALG-001
    (RQ-QALG-457b41 for ML-KEM, RQ-QALG-122b59 for HQC): the three target
    unrelated hard-problem families and a result on one says nothing about the
    others.
  decision_target: >-
    Whether a specific quantum mechanism reaches a fully charged, independently
    reviewed asymptotic-complexity claim against the abelian hidden shift
    problem underlying CSIDH that improves on the best published Kuperberg-type
    baseline (reproduced from its own stated assumptions, not adopted from
    memory), or whether a rigorous falsification search closes the searched
    lanes with a named obstruction.
  constraints:
    - No claim may exceed the exact parameter sets, quantum cost model (gate
      set, quantum memory model, Kuperberg variant and parameters, depth
      limits), and oracle model analyzed.
    - The comparison baseline is the best published Kuperberg-type algorithm,
      REPRODUCED FROM ITS OWN STATED ASSUMPTIONS by this question's own work
      before any improvement is claimed against it -- adopting a baseline
      figure from memory or from GOAL-CSIDH-001's in-progress reconstruction
      without independent verification is not admissible.
    - Any proposal under this question requires a proof_search_map (exact
      bottleneck, baseline reproduction, observation-collision search,
      quantifier order, method ceiling, nearby-object control per
      docs/inventor-protocol.md section 8 / knowledge/techniques/KN-TECH-080.md)
      before the Coordinator approves implementation or expensive experiments.
    - This question may not record a verdict on CSIDH-512's absolute security
      level; its deliverable is a mechanism (positive or a closed falsification
      search), not a security-level adjudication -- that discipline is
      inherited from RQ-CSIDH-64343f's own constraint and applies here for the
      same reason.
    - No characterization of any researcher's or paper's position beyond what
      is read in filed primary text (KN-LIT) may be recorded.
    - Toy-instance or small-parameter improvements are hypothesis-generating
      only and are not reported as statements about standardized CSIDH
      parameters.
    - Timeouts, crashes, and resource exhaustion are infrastructure outcomes,
      not cryptanalytic evidence (AGENTS.md rule 3 / CLAUDE.md rule 3).
    - No result, mechanism, or cost figure transfers between this question and
      RQ-CSIDH-64343f, RQ-QALG-457b41, or RQ-QALG-122b59.
  status: active
  owner: coordinator
  created_at: '2026-08-11'
