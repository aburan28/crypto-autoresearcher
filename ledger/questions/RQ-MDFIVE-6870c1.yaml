research_question:
  id: RQ-MDFIVE-6870c1
  title: >-
    MD5: why did collision resistance collapse completely while preimage
    resistance moved by a handful of bits in fifteen years — and can a search
    instrument calibrated on that gap be trusted anywhere else?
  scope:
    scheme: "MD5 (RFC 1321), with MD4 as the fully-broken lower control"
    family: "Merkle-Damgard, ARX, meet-in-the-middle / biclique preimage cryptanalysis"
    assumption: >-
      MD5 is the one primitive in this program's reach where GROUND TRUTH IS
      COMPLETE AND THE FULL ATTACK PIPELINE EXECUTES END TO END INSIDE A
      CAMPAIGN BUDGET. That makes it two things at once: a research target in
      its own right, and the only honest calibration instrument this program
      has for every other symmetric goal it is opening.
    standardization_status: >-
      Withdrawn from all security use. Still present in legacy file
      identification, deduplication, and non-security checksums, and still the
      canonical teaching example of a broken hash.
    targets:
      - >-
          THE ASYMMETRY, WHICH IS THE REAL QUESTION: MD5's collision resistance
          went from theoretical to seconds-on-a-laptop, while its preimage
          resistance has reportedly moved from 2^128 to roughly 2^123 and
          stopped there for over fifteen years, under the most concentrated
          cryptanalytic attention any hash function has received. Either the
          meet-in-the-middle method has a CEILING that can be named, or the
          search stopped for sociological reasons. These are different claims
          and this program's corpus asserts neither.
      - >-
          METHOD CEILING AUDIT (KN-TECH-080 audit 4): state the strongest claim
          the MITM/biclique preimage technique can certify against MD5's
          specific message schedule and step function, and name the obstruction
          that stops it short of a practical preimage. A named obstruction with
          an argument is a durable negative result under
          docs/inventor-protocol.md; a count of failed attempts is a fatigue
          report and is not.
      - >-
          INSTRUMENT CALIBRATION FOR THE WHOLE SYMMETRIC LANE: an automated
          differential-characteristic search must INDEPENDENTLY REDISCOVER a
          known MD5 collision path from the primitive's specification, without
          being handed the published path, and then drive it to a literal
          colliding pair. Until it does, no result the same instrument produces
          against SHA-2, SHA-3, BLAKE, Ascon, or SIMON/SPECK is worth
          believing.
      - >-
          A MEASURED COST ANCHOR: full and chosen-prefix MD5 collisions are
          reachable here, giving actual wall-clock, memory, and
          near-collision-block measurements. Every other hash goal in this set
          extrapolates such costs; this is the one place they can be measured.
    methods:
      - >-
          Automated characteristic search with the encoding, solver version,
          seed, and wall-clock ceiling declared before the run, scored on
          whether it rediscovers a published path unaided.
      - >-
          End-to-end collision generation with certificates: the literal
          colliding pair, re-verified by a second independent RFC 1321
          implementation.
      - >-
          MD4 as the LOWER CONTROL — a primitive where practical preimages are
          reported — so the ceiling claim is tested against a case where the
          method demonstrably does break through, rather than only against the
          case where it stalls.
      - >-
          Explicit accounting of the MITM split: which message words are
          neutral for which chunk, the exact matching point, and the resulting
          complexity, computed rather than quoted.
    claim_tier_ceiling: >-
      COLLISION CERTIFICATES ARE CRYPTO-TIER HERE — a colliding pair for full
      MD5 is a complete, checkable object and needs no scoping caveat about
      parameters. EVERYTHING ABOUT PREIMAGES IS BOUNDED BY WHAT IS ACTUALLY
      COMPUTED: no practical preimage is in scope, and a ceiling statement is
      a claim about a NAMED METHOD against a NAMED PRIMITIVE, never a claim
      that MD5 is preimage-resistant. Instrument calibration results are claims
      about this program's tooling and carry no cryptanalytic content at all.
  motivation: >-
    Two independent reasons converge on the same cheap target. First, the
    program is opening eight symmetric goals that all depend on one automated
    search instrument, and it has no way to know whether that instrument works.
    MD5 is the only place where a calibration can be VALIDATED AGAINST COMPLETE
    GROUND TRUTH rather than assumed — the paths are published, the pairs are
    checkable, and the whole pipeline fits in a campaign budget. Calibrating
    elsewhere means trusting the tool on exactly the questions it is supposed
    to answer. Second, and independently of the tooling, MD5 poses a genuinely
    unresolved scientific question that is easy to miss precisely because the
    primitive is written off: the collision and preimage frontiers moved by
    wildly different amounts under the same attention, and nobody in this
    program's corpus has stated why. Under docs/inventor-protocol.md, "MD5 is
    dead, there is nothing to learn" is a hypothesis about the search. The
    honest version of it is a named obstruction, and producing one would be a
    real result about the reach of meet-in-the-middle preimage methods
    generally — which is the same method family that bounds SHA-2 preimages.
  decision_target: >-
    Whether this program's characteristic-search instrument reproduces complete
    ground truth on MD5 unaided, and whether the MITM preimage method's stall
    at MD5 can be stated as a named obstruction rather than an absence of
    attempts.
  provenance: >-
    OBTAINED BY WEB-SEARCH EXCERPT ON 2026-08-09, NOT FILED AS KN-LIT AND NOT
    READ IN PRIMARY TEXT BY THIS PROGRAM. RESEARCH TARGETS TO BE RE-READ, not
    facts on record here: a preimage attack on full MD5 attributed to Sasaki
    and Aoki (2009) at a quoted complexity of about 2^123.4, described in
    excerpt as using meet-in-the-middle with differential paths and reported
    under the title "Finding Preimages in Full MD5 Faster than Exhaustive
    Search"; related work "Preimage Attacks on One-Block MD4, 63-Step MD5 and
    More" (Aoki and Sasaki) and "Preimage Attacks on Step-Reduced MD5"; and
    a cube-and-conquer SAT approach to inverting hash functions (arXiv
    2212.02405). One excerpt described the 2009 result as "the first practical
    preimage attack", WHICH THIS PROGRAM RECORDS AS AN APPARENT ERROR IN THE
    EXCERPT — 2^123.4 is not practical — and preserves rather than smooths
    over, because resolving it against primary text is exactly the kind of
    detail the acquisition gate exists to settle. Every figure here is
    UNVERIFIED.
  constraints:
    - >-
      No experiment may be designed until the preimage papers and at least one
      published MD5 collision path are filed as KN-LIT entries at stated
      provenance levels.
    - >-
      An RFC 1321 implementation must be pinned and validated against the
      published test vectors before any search runs.
    - >-
      THE CALIBRATION IS SCORED BLIND. The instrument must rediscover a path
      from the specification alone; a run that consumes the published path and
      then reports success has measured nothing and is recorded as invalid,
      not as a weaker pass.
    - >-
      A failed search is a BUDGET OUTCOME about a solver, never evidence that
      no characteristic or preimage structure exists (AGENTS.md rule 3).
    - >-
      No practical preimage is claimed at any complexity this campaign does not
      actually execute. A ceiling statement names a method and an obstruction
      and claims nothing about MD5's preimage resistance in general.
    - >-
      Collision certificates must be literal pairs re-verified independently.
      A reported collision without its pair is not admissible.
  status: active
  owner: coordinator
  created_at: '2026-08-09'
