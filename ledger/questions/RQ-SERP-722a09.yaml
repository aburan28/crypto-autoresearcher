# RQ-SERP-722a09 -- opened by DEC-20260924-decc6a on user direction
# (2026-09-24): "let's go after other ciphers such as serpent ... really focus
# on differential cryptanalysis, linear, algebraic ... against those block
# ciphers."
research_question:
  id: RQ-SERP-722a09
  title: >-
    Serpent (128-bit block, 32 rounds, 128/192/256-bit keys): how many rounds
    admit a verified differential, linear, differential-linear,
    boomerang/rectangle or algebraic distinguisher, and where exactly does
    each technique family stop?
  scope:
    scheme: >-
      Serpent as submitted to the AES process (bitsliced 4x4 S-boxes S0..S7,
      linear transformation LT, 32 rounds, final-round key whitening),
      reduced to r rounds with the round convention declared per experiment
      (start round index, whether the last LT is omitted). 128-, 192- and
      256-bit key schedules are separate comparison keys.
    families:
      - differential (single-trail and clustered differentials; truncated)
      - linear (single and multidimensional; linear hull)
      - differential-linear (with DLCT-based middle-layer evaluation)
      - boomerang / rectangle (BCT/BDT-based switch evaluation)
      - algebraic (degree bounds, division property, cube / integral)
      - related-key variants are recorded under a separate attacker model and never mixed with single-key rows
    attacker_models: >-
      single-key chosen/known plaintext is primary; related-key is a
      separate comparison key. A distinguisher, a key-recovery attack and a
      known-key property are three different result types and never share a
      frontier row.
    out_of_scope: >-
      Side channels, implementation faults, and the full-round cipher as an
      expected target. A full-round result is not excluded, but no batch is
      designed on the presumption of one.
  motivation: >-
    The user suspects deployed-era block ciphers other than AES may carry
    critical weaknesses and asked for a campaign on Serpent covering the
    differential, linear and algebraic families. This program has no Serpent
    execution campaign: GOAL-SYMF-c00fa1 is a census of published attacks,
    and its own ideation (IDEA-20260805-5b8f95) records zero Serpent rows.
    The corpus's published reach (kb, below) is about 10-12 of 32 rounds,
    i.e. a nominal margin of about 20 rounds. Since those results, automated
    trail search (MILP/SAT/CP), DLCT/BCT middle-layer theory, clustered
    differential estimation and division-property degree bounds have become
    standard. Whether they move Serpent's frontier by even one round is an
    open, measurable question. That is the honest shape of "critical
    vulnerability" here: it is tested round by round, not assumed.
  decision_target: >-
    For each (family, key size, attacker model, result type) comparison key:
    either (a) a distinguisher or key-recovery attack verified empirically at
    every round count where verification is computable, and extrapolated
    beyond that only under numbered, falsifiable independence heuristics,
    that reaches or exceeds the SYMF-recorded frontier for that key; or (b) a
    measured obstruction, meaning the round at which the family's best
    certified bound crosses the data/time budget of the generic attack, with
    a resource_check per the inventor protocol.
  provenance: >-
    Opened by the coordinator on direct user instruction. The published
    round counts below come from this corpus's literature entries (abstract-
    level notes), which the coordinator session read on 2026-09-24. The
    primary papers were NOT re-read by this task, and no figure here backs a
    decision until a census row cites its primary source.
  citations:
    - ref: KN-LIT-3430
      provenance: kb
      claim: Biham-Dunkelman-Keller enhanced differential-linear attack; reported as the best known attack on 11-round Serpent at its time.
      verified_by: coordinator session 2026-09-24 (DEC-20260924-decc6a), read the corpus entry's Key claims section; primary paper not re-read.
    - ref: KN-LIT-2112
      provenance: kb
      claim: Differential-linear methodology relaxing independence assumptions; reported attack on 12-round Serpent.
      verified_by: coordinator session 2026-09-24 (DEC-20260924-decc6a), read the corpus entry's Key claims section; primary paper not re-read.
    - ref: KN-LIT-5142
      provenance: kb
      claim: Improved boomerang/rectangle attacks; reported 10-round Serpent attack at about 2^173.8 memory accesses.
      verified_by: coordinator session 2026-09-24 (DEC-20260924-decc6a), read the corpus entry's Key claims section; primary paper not re-read.
    - ref: KN-LIT-5027
      provenance: kb
      claim: Multidimensional linear cryptanalysis (LLR vs chi-squared), with experiments on reduced-round Serpent.
      verified_by: coordinator session 2026-09-24 (DEC-20260924-decc6a), read the corpus entry's Key claims section; primary paper not re-read.
    - ref: Nguyen-Wu-Wang, multidimensional linear attack on 12-round Serpent (ACISP 2011)
      provenance: recalled
      claim: Recalled as a 12-round linear key-recovery; pointer only, not in the corpus, supports nothing.
  constraints:
    - Every reduced-round cipher implementation is pinned to published full-round test vectors before any measurement, and the reduced-round convention is stated in each experiment.
    - Every reported bias, probability or distinguishing advantage is measured against a random-permutation null of identical shape and sample count before it is believed (controls before belief).
    - Round counts beyond empirical reach rest on explicitly numbered heuristics (key independence, trail independence / hull approximation, Markov assumption), each with a falsification check at reachable rounds.
    - A claim above the SYMF-recorded frontier for its comparison key is a breakthrough claim and receives review-breakthrough at max before promotion.
    - Negative results close only the exact tested family, round count, key size and search budget.
