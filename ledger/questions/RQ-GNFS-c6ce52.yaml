research_question:
  id: RQ-GNFS-c6ce52
  title: >-
    The number field sieve as the object: does any NAMED ingredient of the
    general number field sieve — polynomial selection, relation collection,
    cofactorization, filtering, or the linear algebra — admit an improvement
    that moves the L_N[1/3, c] constant below the single-integer frontier this
    program can state and reproduce, or a MEASURED end-to-end improvement at
    reachable sizes on one implementation with memory and communication charged
    — and if not, what is the named obstruction at each stage?
  scope:
    scheme: >-
      Integer factorization of balanced semiprimes by the general number field
      sieve, with the prime-field NFS discrete logarithm variant as a built-in
      control because the two share every ingredient except the final
      descent.
    family: >-
      Number field sieve (general polynomial). Special-form inputs and the
      SNFS/GNFS crossover belong to RQ-SNFS-005666; NFS cost-model reproduction
      against the record computations belongs to RQ-RSA-afe33c; the extended
      tower NFS over GF(p^k) belongs to RQ-PAIR-f2e31f. This question is about
      THE ALGORITHM ITSELF as a research object, not about what it costs as
      deployed or what it says about any key.
    assumption: >-
      The load-bearing inherited claim is a FRONTIER: that heuristic
      L_N[1/3, (64/9)^{1/3}] for a single general integer is where the
      classical algorithmic exponent has sat since the early 1990s, that the
      only known movement below it is Coppersmith's multiple-polynomial
      variant and the amortised factorization-factory / batch settings, and
      that every subsequent improvement is a constant inside the o(1), an
      engineering gain in relation collection, or a memory reduction in the
      linear algebra. EVERY CONSTANT NAMED IN THIS PARAGRAPH IS RECALLED AND
      UNVERIFIED HERE: the constants themselves are research inputs to be
      re-derived from primary text and filed as KN-LIT before any idea leans
      on them.
    standardization_status: >-
      RSA remains deployed at scale and on a published migration path away;
      prime-field Diffie-Hellman groups remain in long-lived configurations.
      The algorithm this question studies is the classical reference against
      which every one of those parameter choices is quoted.
    targets:
      - >-
          THE CONSTANT, STATED FROM THE STAGE THAT SETS IT: for each named
          ingredient, write the size of the objects whose smoothness is
          required (norm sizes on each side as functions of degree, skewness,
          and sieve region), derive the L[1/3, c] balance that yields
          (64/9)^{1/3} as an EXACT parameter slice, and identify which single
          quantity in that balance any proposal must move. A proposal that
          cannot say which term it moves is not a proposal about the constant.
      - >-
          POLYNOMIAL SELECTION AS THE EXPONENT-ADJACENT TARGET: the linear +
          nonlinear pair is what fixes the norm sizes; two NONLINEAR
          polynomials of degree d >= 3 with small coefficients and a common root
          mod N would change the balance, and whether such pairs can be found
          in subexponential time is, as far as this program's corpus shows, an
          open problem rather than a settled negative. State the obstruction
          precisely or exhibit a construction at toy size with ground truth
          known by construction.
      - >-
          RELATION COLLECTION AND COFACTORIZATION CHARGED HONESTLY: lattice
          sieving, large-prime variations, batch smoothness detection, and ECM
          cofactorization each have a memory-access profile a core-year figure
          hides. Measure, on one implementation and one machine at reachable
          sizes, which of these is the binding cost and what its time-memory
          tradeoff position is.
      - >-
          FILTERING AND LINEAR ALGEBRA AS THE COMMUNICATION WALL: the sparse
          matrix after merge is the object every scaling argument runs into.
          State the memory and interconnect terms of block Wiedemann or block
          Lanczos, measure them at reachable sizes, and determine whether any
          structural ingredient (matrix structure inherited from the factor
          base, structured elimination, or a different final-stage algebra)
          moves the exponent of that term rather than its constant.
      - >-
          THE FACTORING-VERSUS-DLP CONTROL, FREE OF CHARGE: the same NFS
          ingredients run at the same size on both problems; a proposed
          improvement that helps one and not the other has located exactly
          which ingredient it touched, and a cost claim that fits one and not
          the other is caught by a control the literature already set up.
      - >-
          CLOSURE AT THE STANDARD: where the answer is "no movement", the
          deliverable is the named obstruction per stage — which quantity, over
          which scope, measured in which runs — with forward guidance naming
          the classes that remain open (multi-polynomial, amortised/batch,
          structure-exploiting linear algebra, hardware-aware sieving). A
          count of rejected mechanisms is a fatigue report and stays
          `unverified`.
    methods:
      - >-
          Object-first ideation per docs/inventor-protocol.md: name the tracked
          object at each stage (a norm distribution, a smoothness event, a
          lattice, a sparse matrix), apply the lossy-projection test before
          spending compute, and declare the established families
          (Coppersmith multiple polynomial, factorization factory, batch NFS,
          lattice sieving, special-q, block Wiedemann) off-limits as primary
          lens once named.
      - >-
          Exact baseline reproduction (KN-TECH-080 audit 1) of the standard
          L[1/3] balance as a symbolic parameter slice, so that any claimed
          constant improvement embeds the known one as a boundary case.
      - >-
          Small-but-real end-to-end runs on one open implementation at sizes
          this harness reaches, used to CALIBRATE a stage-by-stage cost model
          with memory beside time; extrapolation reported as conditional on
          numbered heuristics, never as a prediction about a record size.
      - >-
          Known-answer instances everywhere ground truth can be manufactured:
          semiprimes with known factors, primes with known generator
          structure, polynomial pairs with a common root planted by
          construction.
      - >-
          Charged-cost bookkeeping per docs/target-result-profile.md, with the
          time-memory tradeoff position and the parallel and communication
          forms stated rather than implied.
    claim_tier_ceiling: >-
      NO FACTORIZATION OR DISCRETE-LOGARITHM RECORD IS IN SCOPE, NO BREAK IS
      CLAIMED, AND NOTHING HERE IS A STATEMENT ABOUT ANY DEPLOYED KEY OR
      PARAMETER. Admissible conclusions are (a) a conditional theoretical
      statement about the L[1/3, c] balance under numbered heuristics with
      their validation route, (b) a toy-tier MEASURED statement about one
      stage on one implementation at stated sizes, and (c) a named
      obstruction at the docs/inventor-protocol.md section 4 standard. A
      constant improvement is reported as a constant improvement and never as
      an exponent change; an amortised or batch gain is reported per integer
      with the precomputation charged and never as a single-integer gain. Any
      figure recalled from literature is `unverified` until the source is
      filed as KN-LIT at a stated provenance level.
  motivation: >-
    This program treats the number field sieve in three places and in none of
    them as a research object. RQ-RSA-afe33c asks what NFS costs and whether a
    published cost model reproduces the records; RQ-SNFS-005666 asks whether
    special-form inputs are detectable and where the special sieve beats the
    general one; RQ-PAIR-f2e31f asks what the tower variant says about
    pairing fields. All three take the algorithm as fixed. The target profile
    this program works to (docs/target-result-profile.md) asks for
    exponent-moving results on central hard problems, and integer
    factorization by NFS is the most central classical hard problem there is;
    declining to ask whether its constant or its exponent can move because it
    is the most studied problem in the field is exactly the premature closure
    docs/inventor-protocol.md names as a failure mode. The question is posed
    so it can fail cheaply: the L[1/3] balance is a symbolic derivation that
    costs no compute and tells any proposal which term it must move; the
    two-nonlinear-polynomial problem has known-answer instances at toy size;
    and the stage costs are measurable on an open implementation at sizes a
    single machine reaches. The user directive of 2026-09-01 asked for
    ideation on NFS and GNFS specifically; no existing question admits an
    idea about the algorithm itself, so this record is opened rather than
    stretching a cost-model question to hold algorithmic proposals it was
    not written for.
  decision_target: >-
    Whether this program can name, for each stage of the general number field
    sieve, either a concrete ingredient that moves the single-integer
    L[1/3, c] constant or the measured end-to-end cost at reachable sizes with
    memory charged, or a named obstruction with an argument and forward
    guidance — and which of those two outcomes each stage yields.
  relationship_to_existing_questions: >-
    RQ-RSA-afe33c (cost model reproduction against records), RQ-SNFS-005666
    (special-form detectability and SNFS/GNFS crossover), and RQ-PAIR-f2e31f
    (exTNFS in GF(p^12)) are NOT widened, contradicted, or superseded. Their
    ceilings and constraints stand. A proposal under this question that
    produces a cost measurement usable by RQ-RSA-afe33c is filed here and
    cited there; a proposal about special-form inputs is filed under
    RQ-SNFS-005666, not here. Ideas already filed under those questions
    (listed in the ideation handoff of 2026-09-01) are prior art for this
    question and must be cited, not duplicated.
  constraints:
    - >-
      Every complexity constant quoted in this record is RECALLED and
      UNVERIFIED. No experiment may treat a constant as the baseline until the
      primary source stating it is filed as a KN-LIT entry with provenance.
    - >-
      No factorization or discrete-logarithm record is attempted. A campaign
      that finds itself sizing one has misread this question.
    - >-
      Classical algorithms only. Quantum factoring is out of scope and no
      comparison to it is admissible here.
    - >-
      Memory and communication beside time in every reported figure, per
      docs/target-result-profile.md. A core-year figure alone is incomplete.
    - >-
      Every measured comparison is matched: same implementation, same
      machine, same size, same parameter-selection procedure, with the
      baseline run recorded as a run record of its own.
    - >-
      The DLP control is not optional for cost claims: a stage-cost model or
      an ingredient improvement is reported on both problems at one size or
      says why it cannot be.
    - >-
      Nothing in this question may be reported as a statement about the
      security of deployed RSA or Diffie-Hellman parameters.
  status: active
  owner: coordinator
  created_at: '2026-09-01'
