hypothesis:
  id: H-JETB-001
  question_id: RQ-JETB-001
  statement: In the generic group model augmented with first-order jet (dual-number) queries of the addition law, the jet oracle is simulable with O(1) overhead from the standard group oracle; equivalently, the epsilon-consistency data of any relation variety is exactly its Zariski tangent space, determined by the zeroth-order relation structure, so no jet-augmented algorithm beats exponent 1/2.
  mechanism: 'S(x + eps*t) = S(x) + eps*(grad S(x).t): the eps-block is a homogeneous linear system in the free tangent parameters, hence consistent iff the zeroth-order relation holds; its solution space ker grad S is the Zariski tangent space by definition. On the group law itself, formal-group linearization makes the first-order part of dual-number addition equal Lie-algebra addition of omega-scalars (omega = dx/(2y)).'
  assumptions: [free (unconstrained) tangent lifts — the A1 screen regime, x-only Semaev relation varieties, ordinary non-anomalous prime-field curves]
  predictions:
    - metric: per-tuple tangent-screen verdict vs zeroth-order S-test verdict
      direction: different
      minimum_effect: "agreement = 1 exactly; any validated mismatch at all three toy sizes falsifies"
    - metric: sigma_true (tangent-survival of true relations)
      direction: higher
      minimum_effect: "= 1 exactly"
    - metric: leakage (screen pass among non-relations)
      direction: lower
      minimum_effect: "= 0 exactly"
    - metric: sigma_pass / p_m
      direction: different
      minimum_effect: "= 1 exactly"
    - metric: one-step jet-linear (Newton) solve hit rate
      direction: lower
      minimum_effect: "~ 0; 2/p on non-degenerate fibers (degree-drop fiber x1 = x_R is zeroth-order observable and solves at rate 1)"
  test_boundary:
    instances: ["fresh ordinary non-anomalous short-Weierstrass curves over F_p, p in {101,211,431}", "ell-subgroup target R", "6 seeds 20260717..20260722"]
    parameters: {factor_base: "x-interval, B = max(8, ceil(sqrt(2*p)))", varieties: ["S_R(x1,x2)=S3(x1,x2,x_R)", "S3(x1,x2,x3)"]}
    implementation: experiments/EXP-JETB-001/jetbarrier1_model_check.sage (self-contained)
    budget: {wall_clock_seconds: 2400, maximum_runs: 8, per_invocation_seconds: 600}
  falsification_conditions: [An explicit non-simulable operation: any per-tuple screen/zeroth-order mismatch, sigma_true < 1, leakage > 0, or formal-group linearity failure, reproduced at all three toy sizes with exact witnesses.]
  interpretation_limits: [Toy scale: consistency evidence for the barrier, NOT a proof of the simulation theorem; toy-curve evidence is not crypto-scale validation (rule 7); a negative (mismatch) would close only the tested augmented-model formalization, not all possible jet encodings.]
  status: supported
  proposed_by: coordinator-research-director
