  inference: >-
    Numbers only (status decision belongs to the Coordinator): under the
    canonical, rank-exact reduction the D4 residual non-rewritable series is
    24/9/11/13/15 at n=9/12/15/18/21. The EV-SIG-002 anchored series
    23/9/10/13/14 is a LOWER BOUND on the corrected series — exact at n=12
    and n=18, strict (+1) at n=9, n=15, n=21 — so the old counts are
    corrected at three of five sizes, while existence, positivity, and
    monotonicity over n=12..21 all carry over to the corrected instrument
    with strictly even +2 increments. The n=9 exception persists. The
    separation from the support-matched null (residual 0 everywhere) is
    unchanged. Whether the EV-SIG-002 series "stands as-is, stands as lower
    bound, or is corrected" in the program's official status language, and
    any consequence for H-SIG-001's supported_scoped status and for the
    EXP-SIG-003 link quantities that quoted residual_4 = 9/10 under pinned
    semantics, belongs to the Coordinator.
  boundaries:
