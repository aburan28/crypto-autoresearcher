    - "The rank-defect parity pattern (defect 1 at n=9/15/21, 0 at n=12/18) is a five-size observation; mechanism unexplained."
    - "No CI methodology beyond zero-variance replication over 3-5 seeds per size."
  unresolved_confounds:
