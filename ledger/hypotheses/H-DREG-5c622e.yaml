  title: >-
    One stored tuple and two gauge models accept an extra fall. One gauge model does not.
  statement: >-
    The generators X^2 + 1 and X^2 + 3 differ by the constant -2.
    In characteristics 3, 5 and 7 that constant is nonzero and has
    degree 0, which is below 2. In characteristic 2 the constant is
    0, so the combination is the zero polynomial. An extra-fall
    label is accept only when a tuple is stored, the neighbor fall
    count is 0, the random fall count is 0, and at least two gauge
    models reproduce the drop. The row with those four conditions
    is accept. The row with one gauge model is reject. The row with
    no stored tuple is reject. The row whose neighbor fall count is
    1 is reject. The row whose random fall count is 1 is reject.
    Zero supplied pairs give zero acceptances. An unfinished
    neighbor is unmeasured and is not recorded as a zero fall.
    A random fall reported as a curve effect must have count 0.
    Degree 2 is coprime to 15. Degrees 3 and 5 are not.
  mechanism: >-
    The proposal accepts a scalar fall gap only when a stored
    multiplier tuple exhibits it and the neighbor, the random
    system, and the gauge orbit line up. This contract checks that
    decision table and one explicit combination. It does not build
    a Macaulay matrix and it does not search for an outlier.
