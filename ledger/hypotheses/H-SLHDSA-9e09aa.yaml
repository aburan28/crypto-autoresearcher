hypothesis:
  id: H-SLHDSA-9e09aa
  question_id: RQ-SLHDSA-001
  goal_id: GOAL-SLHDSA-001
  derived_from_idea: IDEA-20260805-705614
  added: '2026-08-25'
  statement: >-
    The FORS interleaved-target bound is a statement of the form "for all
    adversaries A with at most q signing queries and at most Q hash queries,
    Adv_ITSR(A) <= f(q, Q, h, a, k)", and its tightness reduces entirely to WHICH
    SET OF OCCUPANCY VECTORS the quantifier over A is allowed to range over. The
    claim is threefold. (1) NO WORST-CASE-OCCUPANCY BOUND CAN BE NON-VACUOUS AT
    FIPS 205 PARAMETERS: since x -> x^k is convex for k >= 1, max of
    sum_i gamma_i^k over the simplex {gamma >= 0, sum_i gamma_i = q} is q^k
    attained at a vertex, so the worst-case per-attempt success probability is
    p_wc = 2^{-h} (q/2^a)^k = 2^{k(64-a)-h} at q = 2^64, which in log2 is
    665 / 1848 / 787 / 1782 / 1036 / 1857 at the six recalled parameter sets -
    every one vacuously above 1. The published bound therefore CANNOT be a
    worst-case-occupancy bound and must contain a probabilistic occupancy
    argument. (2) THE SLACK OF THE OBVIOUS PROOF MOVE IS AN EXACT RATIO OF
    COMPUTABLE INTEGERS: slack_1(q, s) = log2(q * G(s)^{k-1}) - log2(2^h *
    T_k(lambda)) where G is the smallest integer with 2^h * P[Poisson(lambda) >
    G] <= 2^{-s}, and this quantity is STRICTLY POSITIVE at every parameter set
    by the power-mean inequality. (3) ON THE NEARBY OBJECT VARIANT-P - identical
    to SLH-DSA except R = H(M) is publicly computable - the conclusion of (1) is
    FALSE: the reachable set becomes the whole simplex, the adversary can grind
    offline to concentrate occupancy, and the separation between SLH-DSA and
    VARIANT-P under one identical pipeline is at least 30 bits at 128s
    (pre-registered estimate about 57 bits). NO CLAIM IS MADE ABOUT SLH-DSA'S
    SECURITY AND NO ATTACK ON SLH-DSA IS PROPOSED.
  mechanism: >-
    The tracked object is THE REACHABLE OCCUPANCY SET Gamma(I) - the set of
    occupancy vectors gamma over the 2^h FORS key pairs that an adversary can
    induce, as a function of its CONTROL INTERFACE I - followed through
    interface, to reachable set, to the extremal value of sum_i gamma_i^k over
    that set, to the bound's per-attempt success probability. In SLH-DSA the
    hypertree leaf is (idx_tree, idx_leaf) extracted from
    H_msg(R, PK.seed, PK.root, M) with R = PRF_msg(SK.prf, opt_rand, M) and
    SK.prf secret; the adversary chooses M and sees the index AFTER the fact, so
    it cannot compute the index of an unsigned message and cannot choose a
    message for a target index. Its interface is exactly "choose q, choose the
    messages, observe the indices", which under a random-oracle idealisation of
    PRF_msg and H_msg induces the uniform multinomial and nothing else. Between
    the vacuous worst case and the exact moment sits a LADDER of surrogates a
    real proof might use - S0 worst case sum gamma^k <= q^k (vacuous); S1
    max-load tail bound sum gamma^k <= q * G^{k-1}; S2 exact moment
    E[sum gamma^k] = 2^h T_k(lambda); S3 exact moment with leaf collisions,
    2^h E[m(X)^k] with m(g) = 2^a(1 - (1 - 2^{-a})^g). S1 is the interesting rung
    because it is the move a careful prover makes when an exact moment is
    inconvenient, and its looseness is computable exactly. NOTE THE DIRECTION: S1
    upper-bounds the attack's success, so a loose S1 makes the PROOF
    CONSERVATIVE - the true margin is LARGER than the proof asserts. VARIANT-P
    supplies the falsification device: with a public index map the adversary
    grinds a multi-collision of G ~ 2^a ln(2^a) messages onto one leaf, then
    forges there. An analysis that reports the SAME answer for SLH-DSA and
    VARIANT-P has not identified the load-bearing structure, which is why both
    run through one identical pipeline.
  assumptions:
    - >-
      B1. The recalled control interface is correct - in particular that SK.prf
      is in the PRF input in EVERY signing mode, including FIPS 205's
      "deterministic" mode, which is RECALLED-UNVERIFIED to set
      opt_rand = PK.seed while keeping SK.prf in the PRF input. VERIFYING THIS
      ONE SENTENCE IS THE HIGHEST-VALUE READING TASK IN THE GOAL. If any mode
      makes the index publicly computable, VARIANT-P stops being hypothetical,
      the finding changes character completely, and the work must HALT and
      ESCALATE under AGENTS.md rule 12 rather than continue.
    - >-
      B2. The convexity argument of part (1) is exact and unconditional given the
      parameters. It assumes nothing beyond k >= 1.
    - >-
      B3. The multi-collision cost formula (about 2^{h(G-1)/G} * G/e hash
      evaluations) is RECALLED-UNVERIFIED and must be RE-DERIVED from first
      principles with the derivation shown. If the re-derivation disagrees with
      the recalled form, the recalled form is DISCARDED, the derived one is used,
      and the discrepancy is recorded.
    - >-
      B4. The coupon-collector argument fixing G ~ 2^a ln(2^a) is an argument
      SKETCH, to be made rigorous or replaced by an exact expected-cover
      computation.
    - >-
      B5. All structural facts about SLH-DSA here are RECALLED-UNVERIFIED and are
      candidates to check against FIPS 205. The mathematics is independent of
      them except through the constants (h, a, k).
  proof_search_map:
    map_shared_with: H-SLHDSA-3a403a
    map_sharing_note: >-
      The paired hypothesis H-SLHDSA-3a403a carries the full proof_search_map
      covering both IDEA-20260805-705614 and IDEA-20260805-fbe36a under one map
      rather than duplicating it. The fields below are written for THIS record's
      content specifically and are not a second copy of that map; a reviewer
      should read H-SLHDSA-3a403a's map for the shared bottleneck and baseline
      material.
    bottleneck: >-
      The translation of the quantifier over ADVERSARIES into a quantifier over
      OCCUPANCIES. Everything about whether the bound is loose or wrong lives in
      that translation, and nothing else in the derivation is decision-changing.
    baseline_embedding:
      parameter_slice: >-
        k = 1. With one FORS tree, sum_i gamma_i^1 = q identically for EVERY
        occupancy vector, so max equals min equals q and the worst case coincides
        with the exact moment. This is the exact old-method boundary at which the
        whole reachable-set apparatus must collapse to nothing.
      reproduction_check: >-
        Frozen fixture - the pipeline must report EXACTLY 0 bits of separation
        between S0, S1 and S2 at k = 1. Any non-zero separation there means the
        pipeline manufactures structure.
    observation_collision:
      observable: >-
        max over gamma in Gamma(I) of sum_i gamma_i^k - one real number
        summarising an entire adversary class.
      distinct_preimage_search: >-
        THE MIRROR FAILURE IS THE LIVE RISK and was checked ON PAPER. A summary
        this coarse could be CONSTANT across every interface worth
        distinguishing; if every interface reached the whole simplex the
        observable would carry no information and this record would be worthless.
        THE CHECK SEPARATES: for the randomized-index interface the reachable set
        is (under HEUR-001) a single multinomial distribution whose extremal k-th
        power sum concentrates at 2^h T_k(lambda); for the
        publicly-computable-index interface the reachable set includes the vertex
        with value q^k. At 128s with q = 2^64 those are 2^96 and 2^896 - 800 bits
        apart, the largest comparator spread in this goal. The lossless failure
        was also checked and is refuted on cardinality grounds.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The resubmission-budget ladder r in {0, 1, 4, 16, 64}, interpolating
          between the SLH-DSA interface (r = 0) and VARIANT-P by letting the
          adversary reject and resubmit a message after seeing its index.
        predicted_gain: >-
          Turns "the randomizer matters" into "here is the RATE at which it stops
          mattering", and localises any model failure to a specific interface
          strength rather than leaving a binary verdict.
      - transform: representation_reduction
        proposed_object: >-
          Replace "is the published bound tight" by "which rung of the surrogate
          ladder S0/S1/S2/S3 does the text stand on", answerable by a verbatim
          quotation rather than by argument.
        predicted_gain: >-
          Converts an unbounded interpretive question into a reading task with a
          decidable answer and a recordable failure mode (text unobtainable).
    quantifier_order: >-
      CLAIMED - for all six FIPS 205 parameter sets and for all q up to 2^64,
      [ there EXISTS no non-vacuous bound whose occupancy quantifier is
      worst-case ], unconditionally given the parameters (h, a, k). SEPARATELY
      CLAIMED - for all adversaries A against SLH-DSA with the stated control
      interface, the reachable set Gamma(A) is supported on the uniform
      multinomial, CONDITIONAL on PRF_msg being a secure PRF under SK.prf. NOT
      CLAIMED - anything about adversaries with a different control interface,
      anything about the WOTS+ layer or the hypertree, and anything about
      SLH-DSA's security.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At the six FIPS 205 parameter sets, a worst-case-occupancy bound on the
        FORS interleaved-target advantage is vacuous by 665 to 1857 bits; the
        max-load surrogate S1 is loose against the exact moment S2 by
        slack_1(q, s) bits as tabulated; and under one identical pipeline the
        hypothetical VARIANT-P separates from SLH-DSA by N bits at 128s." It
        certifies NOTHING about SLH-DSA's security, nothing about which rung the
        published text actually stands on absent a verbatim quotation, and
        nothing about VARIANT-P as a deployed object because VARIANT-P is not one.
      nearby_object_control: >-
        VARIANT-P is the nearby object on which the hoped-for conclusion ("the
        multi-target term is governed by the exact moment") is KNOWN FALSE. Any
        analysis, bound or instrument reporting the same answer for SLH-DSA and
        VARIANT-P is not reading the load-bearing structure.
    proof_obligations:
      - claim: 'x -> x^k is convex for k >= 1, so the simplex max is at a vertex with value q^k.'
        responsibility: correctness
      - claim: 'p_wc in log2 is 665/1848/787/1782/1036/1857 at the six recalled parameter sets.'
        responsibility: baseline
      - claim: 'slack_1 is strictly positive at every set, by the power-mean inequality.'
        responsibility: correctness
      - claim: 'G(s) is the smallest integer with 2^h P[Poisson(lambda) > G] <= 2^{-s}, computed exactly.'
        responsibility: size
      - claim: 'The k = 1 null shows exactly zero separation between S0, S1 and S2.'
        responsibility: feasibility
      - claim: 'The VARIANT-P grinding cost is re-derived from first principles, not cited.'
        responsibility: runtime
      - claim: 'VARIANT-P is not SLH-DSA and no artifact may report it as if it were.'
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        For all adversaries A against SLH-DSA with the stated control interface,
        the reachable set Gamma(A) of occupancy vectors is supported on the
        uniform multinomial and A cannot shift its extremal k-th power sum by
        more than the multinomial's own upper tail. Formally, there is no
        strategy A and no leaf i with E[gamma_i under A] exceeding
        q * 2^{-h} * (1 + negl).
      random_model_justification: >-
        A cannot evaluate PRF_msg without SK.prf, so the index of an unsigned
        message is unpredictable to it, and it must commit to M before the index
        exists. This is CONDITIONAL on PRF_msg being a secure PRF under SK.prf -
        the SAME assumption the scheme already makes for unforgeability, so it
        adds no new trust, but it is an assumption and is recorded as one rather
        than smuggled in as a structural fact.
      supporting_results:
        - >-
          RECALLED-UNVERIFIED - FIPS 205's signing algorithm keeps SK.prf in the
          PRF input in every mode including the deterministic one. This is the
          reading task, not an established result.
      validation_experiment_ids:
        - EXP-SLHDSA-62bb4a
      falsification_condition: >-
        Any published or derived route by which an adversary influences
        (idx_tree, idx_leaf). Discovery of one is an AGENTS.md rule 12 event and
        must be ESCALATED, not written up in this record.
    - id: HEUR-002
      formal_statement: >-
        The published FORS multi-target bound stands on rung S1 (max-load tail
        bound) or S2 (exact moment) of the surrogate ladder, not on S0.
      random_model_justification: >-
        NOT APPLICABLE - this is a claim about a DOCUMENT, not about a random
        object. S0 is excluded unconditionally by the vacuity computation given
        the parameters; which of S1 and S2 the text stands on is NOT derivable
        and is a reading question. This heuristic is the record's honest
        statement of what it does not know.
      supporting_results:
        - >-
          The unconditional exclusion of S0 by convexity plus the recalled
          parameters, derived in this record.
      validation_experiment_ids:
        - EXP-SLHDSA-62bb4a
      falsification_condition: >-
        The primary text uses a surrogate not on the ladder. That outcome is MORE
        interesting than either predicted one and must be treated as a success,
        not a failure.
  structural_ingredients:
    - description: >-
        The published design rationale that the message randomizer exists to
        prevent multi-target concentration.
      citation: KN-LIT-4938
      provenance: recalled
      verified_by: null
      role: >-
        qualitative source for VARIANT-P's motivation. The entry is a 2026-07-24
        bulk-seeded stub with null identifiers and has NOT been read; it is named
        as a candidate to check, never as an authority, and the quantitative
        claim is this record's derivation, not a relayed one.
    - description: >-
        FIPS 205 parameter sets (h, a, k) = (63, 12, 14) at 128s and the
        corresponding tuples at 128f / 192s / 192f / 256s / 256f.
      citation: FIPS 205
      provenance: recalled
      verified_by: null
      role: >-
        the constants the vacuity computation depends on. RECALLED-UNVERIFIED;
        NIST's own site is recorded in RQ-SLHDSA-001 as proxy-blocked.
    - description: >-
        Standard multi-collision estimate - producing G messages sharing one of
        2^h buckets costs about 2^{h(G-1)/G} * G/e hash evaluations.
      citation: null
      provenance: recalled
      verified_by: null
      role: >-
        VARIANT-P grinding cost. To be RE-DERIVED, not cited; until then the
        57-bit figure is a pre-registered estimate and nothing else.
    - description: >-
        The companion concrete-cost re-derivation producing the C2 figure
        2^{133.7} for SLH-DSA at q = 2^64, against which VARIANT-P is compared.
      citation: IDEA-20260805-fbe36a
      provenance: recalled
      verified_by: null
      role: >-
        the SLH-DSA side of the separation. This record must NOT become a second
        copy of that re-derivation.
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: >-
        Q1 - log2 of the worst-case-occupancy per-attempt success probability
        p_wc = 2^{k(64-a)-h} at q = 2^64, for the six parameter sets
      direction: higher
      minimum_effect: >-
        EXACTLY 665, 1848, 787, 1782, 1036, 1857 respectively - all strictly
        greater than 0, hence vacuous. Exact integers derived pre-run,
        conditional on the recalled (h, a, k). Any value at most 0 at any set
        falsifies the vacuity conclusion for that set.
    - metric: >-
        Q2 - slack_1(q = 2^64, s = 128) = log2(q * G^{k-1}) - log2(2^h
        T_k(lambda)) for the six sets
      direction: higher
      minimum_effect: >-
        STRICTLY POSITIVE at every set, forced by the power-mean inequality. NO
        NUMERIC PREDICTION IS PRE-REGISTERED FOR ITS SIZE, deliberately: G
        depends on the tail-probability convention and this record refuses to
        invent a number it has not derived. The SIGN is the falsifiable content;
        a non-positive value means the G search or the moment computation is
        wrong.
    - metric: >-
        Q3 - separation between SLH-DSA and VARIANT-P under the identical
        analysis pipeline, in bits, at 128s
      direction: higher
      minimum_effect: >-
        At least 30 bits. Pre-registered estimate about 57 bits (2^{133.7} versus
        roughly 2^{76.7}); the 30-bit floor sits well below the estimate so that
        a rough multi-collision re-derivation cannot manufacture a pass. A
        separation BELOW 30 bits would mean the randomizer buys much less than
        the design rationale implies and is the most interesting outcome here. A
        separation of ZERO means the pipeline is blind to the control interface
        and NO conclusion of any kind may be reported.
    - metric: Q4 - the rung of the surrogate ladder occupied by the primary text's bound
      direction: different
      minimum_effect: >-
        A verbatim quotation with equation or theorem number identifying S1, S2,
        S3 or an unlisted surrogate; OR an explicit record that the text could not
        be obtained under the goal's declared source-preference order.
    - metric: >-
        Q5 - achievable max_i gamma_i along the resubmission-budget ladder
        r in {0, 1, 4, 16, 64}
      direction: higher
      minimum_effect: >-
        Monotonically non-decreasing in r, with the r = 0 cell reproducing the
        pure multinomial EXACTLY. Five interior points; a non-monotone sequence
        localises the error in the reachable-set model rather than leaving "the
        interface matters".
  test_boundary:
    instances:
      - the six FIPS 205 parameter sets 128s / 128f / 192s / 192f / 256s / 256f
      - >-
        VARIANT-P, a hypothetical variant with R = H(M) publicly computable - NOT
        SLH-DSA and NOT any deployed scheme
      - the k = 1 degenerate case, as the forced-zero null object
      - the resubmission-budget ladder r in {0, 1, 4, 16, 64}
    parameters:
      signing_query_budget: q = 2^64
      tail_probability_targets: 's in {64, 128, 192, 256}'
      surrogate_ladder: 'S0 worst case, S1 max-load, S2 exact moment, S3 exact moment with leaf collisions'
      resubmission_budgets: '{0, 1, 4, 16, 64}'
    implementation: >-
      Pure Python exact integer and rational arithmetic - no floating point in
      any reported quantity. G by an exact Poisson tail search over rationals.
      The VARIANT-P grinding cost by a one-page closed-form derivation with every
      step shown. Stage 0 is a READING task on the primary text, not a
      computation.
    budget:
      estimated_wall_clock_seconds: 900
      note: >-
        The parent declares implementation low and compute VERY LOW. Parts 1, 2
        and 4 are seconds of integer arithmetic; the only step with obtainability
        risk is the reading task, and the goal's pause_conditions cover that
        outcome.
  distinguishable_outcomes:
    - outcome: >-
        Q1 comes out vacuous at all six sets; the k = 1 null shows exactly zero
        separation; VARIANT-P separates from SLH-DSA by at least 30 bits; the
        resubmission ladder is monotone with r = 0 reproducing the multinomial;
        and slack_1 is strictly positive throughout.
      means: >-
        The quantifier audit stands: no worst-case-occupancy bound can be
        non-vacuous at FIPS 205 parameters, the published bound must contain a
        probabilistic occupancy argument, and the message randomizer is now
        PRICED at a number this corpus did not have. A loose S1 would mean the
        proof is CONSERVATIVE - good news for SLH-DSA and bad news for anyone
        quoting the bound as tight.
    - outcome: >-
        Q1 is NOT vacuous at some parameter set.
      means: >-
        The central derivation is wrong for that set - almost certainly because a
        recalled (h, a, k) tuple is wrong - and the record must be superseded
        rather than patched.
    - outcome: >-
        slack_1 is non-positive anywhere.
      means: >-
        The surrogate ladder is MIS-ORDERED and the analysis is defective. The
        power-mean inequality forces the sign, so a violation is an arithmetic or
        implementation error, not a discovery.
    - outcome: >-
        The k = 1 null shows a non-zero separation between S0 and S2.
      means: >-
        The pipeline is MANUFACTURING STRUCTURE. Nothing may be reported from any
        arm; this is instrument failure, not evidence.
    - outcome: >-
        VARIANT-P shows no advantage over SLH-DSA (separation zero or below 30
        bits).
      means: >-
        EITHER the instrument is blind to the control interface - the only thing
        it was built to see, in which case no negative about SLH-DSA is
        reportable - OR, if the instrument passes its other controls, the message
        randomizer buys much less than the published design rationale implies,
        which is the most interesting outcome this record could produce and
        requires independent review before any statement.
    - outcome: >-
        Stage 0 finds that some SLH-DSA signing mode makes the index publicly
        computable.
      means: >-
        HEUR-001 is REFUTED and VARIANT-P stops being hypothetical. The work
        STOPS and ESCALATES under AGENTS.md rule 12; it is not written up here
        under any circumstances.
    - outcome: >-
        The resubmission ladder is non-monotone in r.
      means: >-
        The reachable-set model is wrong somewhere between the two endpoints, and
        the ladder localises where. The model is repaired before any separation
        figure is reported.
    - outcome: >-
        The primary text cannot be obtained.
      means: >-
        Q4 is UNANSWERED and must be recorded as unanswered. The rung a bound
        stands on cannot be inferred from its outputs, and Parts 1, 2 and 4
        complete without the text, so this is a partial result rather than a
        failure.
  prior_evidence_refs:
    - RQ-SLHDSA-001
    - GOAL-SLHDSA-001
    - IDEA-20260805-705614
    - IDEA-20260805-fbe36a
