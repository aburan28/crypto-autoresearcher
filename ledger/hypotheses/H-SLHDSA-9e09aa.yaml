  falsification_conditions:
    - >-
      Q1 is not vacuous at some parameter set. The central derivation is wrong
      for that set and the record must be superseded.
    - >-
      slack_1 is non-positive anywhere. The surrogate ladder is mis-ordered and
      the analysis is defective.
    - >-
      The k = 1 null shows a non-zero separation between S0 and S2. The pipeline
      is manufacturing structure; nothing may be reported.
    - >-
      VARIANT-P shows no advantage over SLH-DSA. The instrument cannot see the
      control interface, which is the only thing it was built to see.
    - >-
      Stage 0 finds that some SLH-DSA signing mode makes the index publicly
      computable. HEUR-001 is refuted; the work stops and escalates under
      AGENTS.md rule 12.
    - >-
      The resubmission ladder is non-monotone in r. The reachable-set model is
      wrong somewhere between the endpoints.
  interpretation_limits:
    - >-
      NO ATTACK ON SLH-DSA IS PROPOSED OR IMPLIED. The only attack costed is
      against VARIANT-P, a hypothetical object constructed as a control.
      REPORTING VARIANT-P AS IF IT WERE SLH-DSA IS THE PRINCIPAL RISK OF THIS
      RECORD and every artifact must carry the label.
    - >-
      A finding that the bound is loose is a finding about the BOUND. It does not
      weaken the scheme; it means the true margin against this attack is LARGER
      than the bound asserts.
    - >-
      Nothing here bears on fault, Rowhammer, or memory-corruption results.
      Separate claim class under RQ-SLHDSA-001, untouched, and never to be
      reported alongside.
    - >-
      The audit covers the FORS layer's interleaved-target bound ONLY. WOTS+ and
      the hypertree have their own bounds and their own quantifiers.
    - >-
      If the primary text cannot be obtained, Q4 is "unanswered" and the answer
      must NOT be inferred from the numbers.
    - >-
      The VARIANT-P figure is TIME-ONLY. Its multi-collision table memory is
      uncharged by design (delegated to IDEA-20260805-88ecef) and the figure is
      labelled time-only wherever it appears.
    - >-
      DIRECTIONAL COMFORT is a named risk: a loose S1 makes the scheme look
      better, which is the comfortable answer and therefore the one held to the
      higher standard. The k = 1 null and the VARIANT-P positive control can both
      fail and both must pass first.
