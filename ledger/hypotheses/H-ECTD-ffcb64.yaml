# H-ECTD-ffcb64 — specified from IDEA-20261005-b4c2bf.
# Protocol approval is DEC-20261006-edf5d4. The source idea is the
# unchanged blob from commit efaa5e0b09, now at
# ledger/proposals/IDEA-20261005-b4c2bf.yaml.
# This record asserts no isogeny-path algorithm and no change to the
# generic-group square-root exponent.
# The design session named the prime and the two models. It did not
# enter the root integers or the gaps into this prediction.
hypothesis:
  id: H-ECTD-ffcb64
  question_id: RQ-ECTD-001
  source_proposal: IDEA-20261005-b4c2bf
  goal_id: null
  goal_id_note: >-
    This design binds the question RQ-ECTD-001 and does not attach a
    goal record. It does not create one.
  status: approved
  status_note: >-
    approved means the root-gap protocol in EXP-ECTD-e79910 is approved
    for a later executor. It does not mean the volcano gap was observed
    to be at most the scaling gap. Status moves only by
    DEC-20261006-edf5d4 under the standing user authorization of
    2026-09-06.
  proposed_by: coordinator
  conversion_note: >-
    The meter, the inequality, the prime window 17 to 199, the exclusion
    of j in {0, 1728}, and the refusal to compute a discrete logarithm
    are carried from IDEA-20261005-b4c2bf. The Coordinator named the
    prime p = 41 and the two short-Weierstrass models below before any
    run of EXP-ECTD-e79910.

  statement: >-
    TEST BOUNDARY. One prime and three short-Weierstrass models over
    that prime. The prime is p = 41. The crater model E_crater is
    y^2 = x^3 + 12 x + 24. Its j-invariant is 5 and its twist bit is 1,
    the quadratic twist of the standard model of j = 5 by the least
    quadratic non-residue d = 3. The floor model E_floor is
    y^2 = x^3 + 3 x + 40. Its j-invariant is 13 and its twist bit is 1.
    Both lie on the ordinary rational 2-isogeny volcano of Frobenius
    trace -6. The scaled model E_scaled is y^2 = x^3 + 28 x + 19,
    the image of E_crater under (x, y) mapped to (u^2 x, u^3 y) for
    u = 2, the least quadratic residue in F_41 excluding 1.

    Let m(E) be the least integer in {0, 1, ..., 40} whose residue is
    the x-coordinate of a point P in E(F_41) with 2P = -P and P not
    the point at infinity. The two root methods defined in
    EXP-ECTD-e79910 must agree on that integer.

    PRE-REGISTERED PREDICTION, fixed before any gap is recorded as a
    run result. The absolute difference |m(E_floor) - m(E_crater)| is
    at most the absolute difference |m(E_crater) - m(E_scaled)|, and
    the scaling difference is at least 1. A volcano difference that
    exceeds the scaling difference by at least 1, on a run where both
    differences are defined, is a negative.

    DISTINGUISHABLE OUTCOMES. (1) The setup checks pass, the two root
    methods agree, the scaling gap is at least 1, and the volcano gap
    is at most the scaling gap: success. (2) The same checks pass and
    the volcano gap is at least the scaling gap plus 1: negative.
    (3) The scaling gap is 0: the coordinate control is degenerate and
    the comparison is refused. (4) Either named model has no point that
    survives the doubling check, or the two methods disagree: the gap
    is not read. (5) The executor's first eligible pair under the
    frozen enumeration is not this pair, the trace is not -6, the
    height is not 2, or j is 0 or 1728: failed setup. (6) The scaling
    map fails the transformed equation, or the scaled model is not
    F_41-isomorphic to the crater: invalid. (7) A timeout or crash:
    failed_infrastructure, not evidence.

    No discrete logarithm is computed. No isogeny-path algorithm is
    claimed. The generic-group exponent 1/2 is unchanged.

  mechanism: >-
    The surviving object is one ordinary height-2 rational 2-isogeny
    volcano at p = 41, not an ECDLP instance. Two explanations are
    separated before the search. Explanation A: the least rational root
    of psi_3 moves no more from the crater to the floor than it moves
    under one coordinate scaling of the crater, so this meter does not
    separate volcano level from a change of model. Explanation B: the
    volcano gap is at least one larger than the scaling gap, so the
    level is visible in this coordinate on this pair. Visibility is not
    a sub-rho trapdoor and it is not a path-finding algorithm. The
    representation is the affine x-coordinate of a rational point of
    order 3 (class R1). Sigma is the action of one rational 2-isogeny
    step on the volcano, not translation on a prime-order subgroup.
    Trichotomy class: coordinate-dependent. The projection keeps only
    the least integer representative of the rational roots and discards
    y and every larger root. Many root sets share one minimum, so the
    projection is lossy. It is not claimed to be a block system of the
    isogeny. The scaled curve is the nearby object: it is F_41-isomorphic
    to the crater, so a genuine level signal must be absent there.

  assumptions:
    - >-
      A root is accepted only after the doubling check: a point with
      that x-coordinate, doubled, equals its negative, and it is not
      2-torsion. A polynomial root that fails the check is not used.
    - >-
      Height exactly 2 means the rational 2-isogeny graph, after the
      deletion of j = 0 and j = 1728, peels in exactly two rounds of
      simultaneous degree-1 removal and leaves a nonempty core. The
      Frobenius conductor of the trace has 2-valuation exactly 2. A
      taller conductor is skipped.
    - >-
      The scaling u = 2 is an F_41-isomorphism of short-Weierstrass
      models. It is the coordinate control, not a second volcano and
      not a quadratic twist.
    - >-
      E_floor is the least (j, twist) vertex removed in the first peel
      round that has a verified root. E_crater is the least (j, twist)
      vertex of the core that has a verified root. A different floor
      is a different experiment.
    - >-
      Toy scope is this one pair at p = 41. No cryptographic prime is
      in the test, and no transfer to one is claimed.

  proof_search_map:
    bottleneck: >-
      Whether the least rational order-3 x-coordinate moves more across
      the height-2 step from E_crater to E_floor than across the scaling
      of E_crater by u = 2.
    baseline_embedding:
      parameter_slice: >-
        One ordinary volcano of height 2 at the prime p = 41, compared
        with the scaling (x, y) mapped to (4 x, 8 y) of the crater.
      reproduction_check: >-
        The scaling satisfies the transformed Weierstrass equation, and
        both root methods return the same least root on each model.
        A failed check invalidates the gap.
    observation_collision:
      observable: >-
        The integer volcano_gap minus scaling_gap, where each gap is an
        absolute difference of least roots in {0, 1, ..., 40}.
      distinct_preimage_search: >-
        E_floor and E_scaled are distinct models that can share a least
        root with the crater. A volcano gap strictly larger than the
        scaling gap is the collision that kills explanation A.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fibre of the least-root function on the three named
          models in this one isogeny class.
        predicted_gain: >-
          The volcano gap is at most the scaling gap. No discrete-log
          cost changes.
    quantifier_order: >-
      For the first eligible height-2 pair in the frozen enumeration,
      which this protocol names as p = 41, E_floor, and E_crater, the
      volcano gap is at most the scaling gap. This is one pair, not
      every volcano.
    method_ceiling:
      strongest_certifiable_claim: >-
        This meter does not separate volcano level from coordinate
        scaling at that pair, or it does, by an integer gap of at least 1.
      nearby_object_control: >-
        E_scaled, a model F_41-isomorphic to the crater, where a genuine
        level signal must be absent. If the scaling gap is 0, the meter
        is saturated by coordinates and the comparison is refused.
    proof_obligations:
      - claim: both models have at least one verified rational point of order 3
        responsibility: correctness
      - claim: the rational 2-isogeny component has height exactly 2
        responsibility: baseline
      - claim: volcano gap is at most scaling gap
        responsibility: strictness
    not_applicable_reason: >-
      The map applies to this one pair. It is not omitted. No exponent
      bookkeeping is claimed.

  rerandomization: >-
    There is no re-randomizing walk. The three models are fixed by the
    enumeration. The solution of the comparison is the pair of integer
    gaps on those models, not a pullback to a hidden discrete logarithm.

  asymptotic_claim:
    problem: none — no complexity improvement is claimed
    prior_best: >-
      KR-RHO-13bf67 gives a square-root lower bound for generic
      algorithms. KR-RHO-755e35 says an isogeny walk does not reach a
      different class-invariant weakness. Neither is beaten.
    time_exponent: unchanged
    memory_exponent: unchanged
    hidden_cofactor: >-
      None in an o(1) term. The output is one integer comparison at
      p = 41. A secret path of cryptographic length is outside the claim.
    claim_kind: not_applicable

  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        On the crater model, the least verified order-3 x-coordinate is
        no more extreme than the least verified order-3 x-coordinate of
        one coordinate scaling of that same model, in the sense that the
        floor does not move the minimum by more than that scaling does.
        This imitates the minimum of m uniform draws from
        {0, 1, ..., p - 1}, whose expectation is (p - 1)/(m + 1). It is
        not a theorem about division polynomials.
      random_model_justification: >-
        A separable degree-4 polynomial has at most 4 roots. The minimum
        of m uniform independent draws on {0, 1, ..., p - 1} has
        expectation (p - 1)/(m + 1). Division polynomials are not proved
        to have uniform roots. KR-RHO-755e35, opened, forbids using the
        group order as a hidden endpoint and does not mention this minimum.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECTD-e79910
      falsification_condition: >-
        The measured volcano gap exceeds the measured scaling gap by at
        least 1 on a run where both gaps are defined and the scaling gap
        is at least 1. Separately, a scaling gap of 0 refuses the
        comparison and does not confirm H1.

  structural_ingredients:
    - description: >-
        KR-RHO-755e35 states that over a finite field, isogenous curves
        share the group-structure class of weakness, including anomalous
        curves, small embedding degree, and smooth order. Walking the
        class does not reach a different class of those weaknesses.
      citation: KR-RHO-755e35
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
      role: scope fence; class-invariant weaknesses are not the meter
    - description: >-
        KR-RHO-13bf67 states that a generic algorithm on a prime-order
        group needs on the order of the square root of the group order
        group operations. A sub-square-root algorithm must use the
        representation.
      citation: KR-RHO-13bf67
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
      role: unchanged generic exponent
    - description: >-
        KR-IC-5931ee states that naive Semaev index calculus over prime
        fields does not beat generic methods under the statistical
        assumptions named in that row.
      citation: KR-IC-5931ee
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5931ee.yaml
      role: scope fence; no summation polynomial is built
    - description: >-
        IDEA-20260806-c5d183 is a recalled pointer that full translation
        admits no nontrivial deterministic lossy projection of a
        prime-order subgroup. The file was not opened in this design
        session.
      citation: IDEA-20260806-c5d183
      provenance: recalled
      verified_by: null
      role: pointer only; not support for the inequality

  reduction_chain:
    core_problem: >-
      Whether the volcano gap of the least order-3 x-coordinate at the
      named pair is at most the scaling gap. Not an attack.
    corollaries: []

  predictions:
    - metric: volcano_gap minus scaling_gap
      direction: lower
      minimum_effect: at most 0
    - metric: verified order-3 x-coordinate count on E_floor and on E_crater
      direction: higher
      minimum_effect: at least 1 on each model
    - metric: scaling_gap
      direction: higher
      minimum_effect: at least 1

  test_boundary:
    instances:
      - E_crater, y^2 = x^3 + 12 x + 24 over F_41
      - E_floor, y^2 = x^3 + 3 x + 40 over F_41
      - E_scaled, y^2 = x^3 + 28 x + 19 over F_41
    parameters:
      prime: 41
      trace: -6
      crater_j: 5
      crater_twist: 1
      floor_j: 13
      floor_twist: 1
      least_nonresidue: 3
      scaling_u: 2
      predicted_volcano_gap_minus_scaling_gap_at_most: 0
    implementation: >-
      A later executor rebuilds the rational 2-isogeny graph, checks
      that this pair is the first eligible pair, and computes the two
      least roots by two methods. This design does not record those
      roots as a run.
    budget:
      enforcement: advisory
      maximum_runs: 2
      note: >-
        One pair, inside one run. The second run id is an infrastructure
        retry, not a second scientific prime.

  falsification_conditions:
    - >-
      volcano_gap is at least scaling_gap plus 1, on a run where both
      gaps are defined and scaling_gap is at least 1. H1 is then false
      at this pair.
    - Either named model has no x-coordinate that survives the doubling check.
    - The two root methods disagree on any of the three models.
    - >-
      The first eligible pair under the frozen enumeration is not
      (p = 41, E_floor, E_crater), or the trace is not -6, or the peel
      height is not 2.
    - The scaling fails the transformed equation check.
    - The selected crater or floor has j in {0, 1728}.

  interpretation_limits:
    - >-
      A gap of one field element is not a discrete logarithm and does
      not beat rho. No isogeny-path algorithm is claimed.
    - >-
      Inequality in the predicted direction says only that this meter
      failed to separate level from scaling at one pair.
    - >-
      The opposite inequality nominates the meter for a later
      detectability test. It is not a Teske trapdoor and it is not a
      sub-rho solve.
    - No quantum query cost is measured.

  citations:
    - ref: IDEA-20261005-b4c2bf
      provenance: internal
      claim: >-
        Source proposal. The inequality, the window, the scaling
        control, and the refusal to compute a discrete logarithm are
        copied from it. The bytes are the blob from commit efaa5e0b09,
        checked out unchanged.
      verified_by: ledger/proposals/IDEA-20261005-b4c2bf.yaml
    - ref: RQ-ECTD-001
      provenance: internal
      claim: >-
        Binding question, read from ledger/questions/RQ-ECTD-001.yaml.
        This hypothesis does not claim a prime-field trapdoor.
      verified_by: ledger/questions/RQ-ECTD-001.yaml
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Isogeny walks do not reach a different class-invariant weakness.
        Read from the frontier row.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        Generic discrete logarithms need a square-root number of group
        operations. That exponent is not changed.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-IC-5931ee
      provenance: internal
      claim: >-
        Naive Semaev index calculus over prime fields does not beat
        generic methods. This hypothesis builds no summation polynomial.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5931ee.yaml
    - ref: IDEA-20260806-c5d183
      provenance: recalled
      claim: >-
        Recalled pointer, not opened: full translation admits no
        nontrivial deterministic lossy projection of a prime-order
        subgroup.
      verified_by: null
