  statement: >
    Fix the exact Woodbury-Schur
    identity on one frozen 2-by-2
    folded block plus rank-1
    exceptional coupling before any
    endomorphism orbit fold, sparse
    relation matrix, Semaev S_m, or
    nested LHW generator is built.
    Stage 0 asserts only that on
    REAL M0=I_2, U=[1,0]^T,
    V=[0,1]^T, b=[1,1], one has
    r=1, Schur=1, x=[0,1], and that
    the nearby KF claim r=0 is
    false. NULL empty matrix
    rejected. Singular M0 rejected.
    This is not a Semaev relation,
    not a rho beat. Stages 1+ stay
    unauthorized.
  mechanism: >
    IDEA-20260906-8d9926 Stage 0
    hard gate is the exact
    Woodbury identity versus the
    zero-rank nearby claim. Form
    M=M0+UV^T, invert M0, compute
    Schur I+V^T M0^{-1}U, reconstruct
    the solve. Stage 0 freezes that
    identity as exact tables. No
    endomorphism orbit. No Semaev
    S_m. No nested LHW. No Velu.
    This is a new GOAL-ECDLP-001
    object after P-S0-NBXCHG. It is
    not Stage 1 of EXP-ECDLP-bb5ef7
    and not Stage 1 of
    EXP-ECDLP-70c6f0.
