hypothesis:
  id: H-PFDR-09e1b0
  question_id: RQ-PFDR-ae2fba
  source_idea_id: IDEA-20260903-26aa81
  title: >-
    At fixed digit shape (m, d, s) the graded Macaulay invariants of the
    prime-field digit-presented decomposition system are p-independent above
    a small threshold prime, because the system is the specialization of one
    integer matrix family; the p-sweep to the P-256 prime is a pipeline
    calibration that measures the small-p rank-drop rate, not a discovery
    axis
  statement: >-
    SETTING. Fix m, d, s with d^s <= p and the base-d digit presentation of
    IDEA-20260830-84cdb7: digit variables a_{k,i} (k = 1..m, i = 0..s-1),
    membership generators prod_{j<d}(a_{k,i} - j) (constant coefficients), and
    the summation generator S_{m+1}(x_1, ..., x_m, x_R) with x_k = sum_i
    a_{k,i} d^i substituted, whose coefficients are integer polynomials in the
    curve parameters (A, B) and the target coordinate x_R. Let M_D be the
    degree-D Macaulay matrix in the multilinear quotient (a^2 -> a), whose row
    and column counts do not depend on p.
    CLAIM (derived in IDEA-20260903-26aa81 claim A). M_D over F_p is the
    specialization at a point of F_p^3 of one matrix M_D(A, B, x_R) over
    Z[A, B, x_R]; its rank over F_p is at most the generic rank r_D over
    Q(A, B, x_R), with equality unless every r_D x r_D minor vanishes at the
    specialization mod p. With P_D the product of the nonzero maximal minors,
    Schwartz-Zippel gives Prob[rank drop] <= deg(P_D)/p for uniform (A, B,
    x_R) and p not dividing the content of P_D. THEREFORE every graded rank,
    hence d_ff, fall_dim(D) and the per-degree deficit against the
    p-independent null series (1 + ... + z^{d-1})^{ms}(1 - z^{deg}), is the
    SAME integer at every prime above a threshold p_0, up to events of
    probability O(deg(P_D)/p) and finitely many content primes. The planted-
    target design restricts (A, B, x_R) to a subvariety on which the same
    argument holds with the generic rank of that subvariety.
    CONSEQUENCES TESTED. (i) On the Semaev arm at (m, d, s) = (2, 2, 3),
    every invariant is identical across p in {2^12-scale, 2^64-scale, the
    P-256 prime} in at least 95 percent of (curve, target) draws per cell;
    movement at p >= 2^32 is an instrument fault, not a finding. (ii) The
    rank-drop rate at small p falls as c/p. (iii) The shape-versus-structure
    question (whether the Semaev generic rank equals the random same-support
    generic rank) is NOT decided by the sweep; it is decided by the null arm
    at any single large p, and the difference, if any, is the same integer at
    every large p.
  mechanism: >-
    The digit presentation is the first prime-field presentation in which
    the argument is a three-variable Schwartz-Zippel statement: its
    membership generators are constants and its only free parameters are
    (A, B, x_R), whereas the direct presentation's membership generator
    f_V(x) = prod(x - v) carries B free parameters and the program's direct-
    presentation ladders vary B with p, never holding the shape fixed.
    Because the matrix size binom(ms + D, D) (or 2^{ms} in the multilinear
    quotient) is independent of p, the ladder can include the P-256 prime at
    the same matrix cost as p = 2^12, apart from field-element size; this is
    the sampling shortcut of docs/target-result-profile.md A7 for THESE
    invariants, with the transfer assumption explicit: it transfers across p
    at FIXED s and says nothing about the s-axis. The structural tell is
    inverted relative to the tasking handoff: stillness under a change of
    prime is forced by derivation, so the artifact signature is MOVEMENT at
    large p; stillness under a change of coefficient DISTRIBUTION (Semaev to
    random) is the shape-artifact reading, which the null arm measures. The
    small-p correction is measured directly: at p in {2^12, 2^16, 2^20} each
    cell's rank profile is compared with the profile at 2^64 (the generic
    one after the derivation) and the event rate per cell against 1/p is the
    measured deg(P_D)/p, the number every toy ladder in this lane lacks.
  assumptions:
    - >-
      d^s <= p at every prime; trivial for p >= 2^12 and s <= 4.
    - >-
      Curves at each p are random short-Weierstrass y^2 = x^3 + A x + B with
      nonzero discriminant; at 256 bits the named P-256 curve is used as a
      public instance alongside random curves; no key is involved.
    - >-
      Planted targets are constructed by point addition of window points and
      certified by independent re-addition; no yield statement is read.
    - >-
      Exact arithmetic at every p; no floating point; no CAS termination
      event is read as a degree.
    - >-
      The F_p Macaulay meter (port of experiments/EXP-SBRG-60c55e/driver/
      macaulay.py) has passed its p = 2 known answer against KN-FIND-006 and
      its planted-syzygy positive control before any cell is read.
  proof_search_map:
    bottleneck: >-
      The step 'rank over F_p equals the generic rank over Q off a set of
      density O(deg/p)', which is where p leaves the problem; everything
      else is bookkeeping (IDEA-20260903-26aa81).
    baseline_embedding:
      parameter_slice: >-
        p in {2^12, 2^14, 2^16} at (2, 2, s) is IDEA-20260830-84cdb7's own
        ladder; the (2, 2, 3) cell at p = 4099 is shared with H-PFDR-4148b8's
        deciding cell (EXP-PFDR-5726af), whose derived value d_ff = 5 is the
        cross-check. The direct presentation at fixed B = 8, m = 2 is the
        secondary arm that must show the same p-flatness.
      reproduction_check: >-
        Exact integer agreement of the rank profile at the shared (2, 2, 3),
        p = 4099 cell between this contract's engine and EXP-PFDR-5726af's
        on the same frozen instance (curve, target, seed), before any big-p
        cell runs.
    observation_collision:
      observable: >-
        The rank profile per (cell, arm, p) and its p-flatness label.
      distinct_preimage_search: >-
        The Semaev arm and the random same-support null arm may share a
        p-flat profile; that collision is the 'shape-determined' reading of
        outcome O1 and is designed for. The collision that would matter is a
        Semaev profile at the 256-bit prime equal to the null's while
        differing at 2^12: by the derivation that is the small-p artifact
        signature, and the rank-drop rate measures it.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Represent the family of digit systems over all p as one matrix
          over Z[A, B, x_R]; p-independence becomes the statement that the
          generic rank is an integer. Encoding exact; completeness: every
          F_p instance is a specialization; soundness: rank can only drop;
          cost loss: none.
        predicted_gain: >-
          Turns IDEA-20260731-009's HEUR-FF-1 surrogate question from a
          distributional heuristic into a rank identity plus one measured
          small-p correction.
    quantifier_order: >-
      DERIVED: FOR ALL (m, d, s, D) THERE EXIST integers r_D and p_0 such
      that FOR ALL primes p > p_0 and uniformly random (A, B, x_R) in F_p^3,
      rank_{F_p}(M_D) = r_D with probability at least 1 - deg(P_D)/p. The
      witness r_D depends on the shape and on the Semaev family, not on p.
      The dangerous reading FOR ALL p THERE EXISTS r_D(p) is what outcome O2
      would look like and is excluded above p_0 by the derivation.
      MEASURED: the rank-drop rate at p <= 2^20 and the flatness of every
      invariant at p >= 2^32.
    method_ceiling:
      strongest_certifiable_claim: >-
        'At (m, d, s) = (2, 2, 3) the digit system's graded invariants are
        p-independent above p_0 = [measured], the small-p rank-drop rate at
        2^12 is [measured], and the Semaev and null arms [do / do not]
        differ at the 256-bit prime.' It cannot certify anything about s
        growing, about yield, or about any solver's cost.
      nearby_object_control: >-
        The DIRECT presentation with B growing as p^{1/2} (m = 2, B =
        round(p^{1/2}) at p in {2^12, 2^14}), where the shape changes with p
        and d_ff DOES move with p (IDEA-20260808-093497's null d_reg = B + 1
        and IDEA-20260808-afe4ce's floor): a pipeline that reported
        p-flatness there is blind to p and may report nothing.
    proof_obligations:
      - claim: >-
          The Macaulay matrix entries are polynomials over Z in (A, B, x_R)
          with the digit membership generators constant.
        responsibility: correctness
      - claim: >-
          Rank over F_p equals the generic rank off a set of density at most
          deg(P_D)/p for p not dividing the content of P_D.
        responsibility: correctness
      - claim: >-
          The engine reproduces EXP-PFDR-5726af's profile on the shared
          (2, 2, 3), p = 4099 cell.
        responsibility: baseline
      - claim: >-
          The direct-presentation B-grows-with-p arm shows p-dependence.
        responsibility: interface
      - claim: >-
          256-bit cells stay within the memory contract; field-element size
          is charged and reported.
        responsibility: memory
      - claim: >-
          Nothing about the s-axis is claimed from a fixed-s sweep.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        RANK-DROP DENSITY. For the planted digit family at fixed (m, d, s, D)
        and prime p, the probability over a uniformly random curve (A, B)
        and a planted target that some graded rank falls below its generic
        value is at most c_D / p with c_D independent of p.
      random_model_justification: >-
        Schwartz-Zippel applied to the product of the maximal minors, a
        nonzero integer polynomial in (A, B, x_R) of bounded degree, gives
        deg(P_D)/p for uniform (A, B, x_R). The planted family is a
        subvariety; the same bound holds with the degree of the restricted
        polynomial. The heuristic content is the gap between the uniform
        distribution on F_p^3 and the actual sampling (random curves and
        planted targets are not uniform in x_R).
      supporting_results:
        - ref: >-
            Schwartz-Zippel lemma (Schwartz 1980; Zippel 1979); generic rank
            of a matrix over a polynomial ring and its specializations
          provenance: recalled
          claim: >-
            A nonzero polynomial of degree e over F_p vanishes at a uniform
            point with probability at most e/p; the rank of a specialization
            is at most the generic rank. Textbook; pointer only.
          verified_by: null
        - ref: IDEA-20260903-26aa81
          provenance: internal
          claim: >-
            Claim (A): the digit-presentation Macaulay matrix is one integer
            matrix family in (A, B, x_R); the rank-drop bound; the inverted
            structural tell; the small-p correction as a measured quantity.
          verified_by: coordinator, TASK-20260903-b5d2ae (record read in full)
      validation_experiment_ids:
        - EXP-PFDR-fd901a
      falsification_condition: >-
        A rank-drop event rate at p in {2^12, 2^16, 2^20} that does not fall
        as c/p (ratio about 16 between consecutive rungs, within binomial 95
        percent intervals), or a Semaev-arm invariant that moves between
        primes above 2^32 in more than 5 percent of draws with no located
        pipeline fault.
    - id: HEUR-002
      formal_statement: >-
        SHAPE-DETERMINATION (IDEA-20260731-009's HEUR-FF-1 restated for the
        digit presentation): the generic rank profile of the Semaev digit
        family equals the generic rank profile of the random same-support
        family at every degree below d_reg.
      random_model_justification: >-
        Both generic ranks are integers and p-independent by the derivation;
        no rigorous relation between them exists. The classical statement
        imitated is semi-regularity of a random system (Froberg /
        Bardet-Faugere-Salvy); the assumption is that the Semaev family is
        not rank-deficient relative to it. H-PFDR-4148b8 predicts by
        derivation that at d = 2 the Semaev arm DOES differ from the
        support-matched null at the first fall (d_ff = 5 against 6 at
        s = 3), so the pre-registered expectation for this heuristic at
        (2, 2, 3) is that it FAILS by exactly that p-independent integer.
      supporting_results:
        - ref: IDEA-20260731-009
          provenance: internal
          claim: >-
            HEUR-FF-1, shape-determined regularity; proposes crypto-size
            random-shape sampling without a p-sweep.
          verified_by: coordinator, TASK-20260903-b5d2ae (as cited in IDEA-20260903-26aa81; not reopened)
        - ref: IDEA-20260903-e1e38b
          provenance: internal
          claim: >-
            Derives d_ff(2, 2, s) = 4 + floor(s/2) for the Semaev arm and
            D_null = s + 3 for the support-matched null, so the two differ
            by ceil(s/2) - 1 at every p > s.
          verified_by: coordinator, TASK-20260903-b5d2ae (record read in full)
      validation_experiment_ids:
        - EXP-PFDR-fd901a
        - EXP-PFDR-5726af
      falsification_condition: >-
        Integer disagreement between the Semaev and null rank profiles at the
        large primes (2^64 and the P-256 prime) in the same degrees at every
        draw; the pre-registered expectation is that this condition FIRES at
        the first-fall degree by H-PFDR-4148b8's derivation.
  structural_ingredients:
    - description: >-
        Generic rank of an integer matrix family and its specialization mod p;
        Schwartz-Zippel bound on the rank-drop set.
      citation: 'Schwartz 1980; Zippel 1979 (textbook lemma)'
      provenance: recalled
      verified_by: null
      role: p-independence of graded ranks above p_0
    - description: >-
        The base-d digit presentation with constant membership generators,
        which makes the free-parameter count three at every p.
      citation: IDEA-20260830-84cdb7
      provenance: internal
      verified_by: coordinator, TASK-20260903-b5d2ae (record read in full)
      role: the presentation on which the argument is a three-variable statement
  reduction_chain:
    core_problem: >-
      No attack problem is reduced. The core statement is a calibration: the
      p-column of RQ-PFDR-ae2fba's decision table is flat by derivation at
      fixed shape, and the small-p artifact budget is a measured number.
    corollaries: []
  predictions:
    - metric: >-
        P1 -- rank profile agreement with EXP-PFDR-5726af on the shared
        (2, 2, 3), p = 4099 frozen instance
      direction: different
      minimum_effect: >-
        FORCED EXACT integer agreement at every degree D <= 6. A mismatch
        halts the line as an instrument finding.
    - metric: >-
        P2 -- d_ff on the direct-presentation positive control, m = 2,
        B = round(p^{1/2}), p in {4099, 16411}
      direction: higher
      minimum_effect: >-
        Strictly increasing: predicted 65 at B = 64 and 129 at B = 128, the
        null d_reg = B + 1 of IDEA-20260808-093497 with no early fall
        (IDEA-20260808-afe4ce). Flatness here means the instrument is blind
        to p and no O1 may be reported.
    - metric: >-
        P3 -- every invariant (full rank profile, d_ff, fall_dim(D),
        deficit at D = 3 and 4) on the Semaev arm at (2, 2, 3) across the
        2^64-scale prime and the P-256 prime
      direction: different
      minimum_effect: >-
        IDENTICAL integers at both large primes in at least 95 percent of
        (curve, target) draws per cell (38 of 40). Any systematic movement is
        outcome O2 and is an instrument fault by derivation.
    - metric: >-
        P4 -- rank-drop event rate per cell at p = 4099 against the 2^64
        profile
      direction: lower
      minimum_effect: >-
        Reported with a binomial 95 percent interval; predicted at most
        c_D / 4099 with c_D bounded by the minor degree, i.e. well below 0.1
        per draw. This rate is the small-p artifact budget handed to
        EXP-PFDR-cbdefb and EXP-PFDR-20ee58.
    - metric: >-
        P5 -- Semaev arm minus null arm, per invariant, at the two large
        primes
      direction: different
      minimum_effect: >-
        By H-PFDR-4148b8's derivation: d_ff(Semaev) = 5 against
        d_ff(null) = 6 at s = 3, identically at both large primes. Zero
        difference is the shape-determined reading (HEUR-002 holds);
        a nonzero difference varying between the large primes is a fault
        (O2). This prediction is inherited from IDEA-20260903-e1e38b and is
        a cross-check, not this hypothesis's own content.
  test_boundary:
    instances:
      - >-
        (m, d, s) = (2, 2, 3); p in {4099, the largest prime below 2^64
        (2^64 - 59, primality re-confirmed in the manifest), the P-256 prime
        2^256 - 2^224 + 2^192 + 2^96 - 1}; 8 random curves per prime plus
        the named P-256 curve at the 256-bit prime; 5 planted targets per
        curve
      - >-
        positive control: direct presentation m = 2, B = round(p^{1/2}),
        p in {4099, 16411}, 3 curves, 2 planted targets each
      - >-
        secondary arm: direct presentation at fixed B = 8, m = 2, at the
        three primes, 3 curves, 2 targets
    parameters:
      D_max: 6
      arms: 'Semaev; random same-support null; non-curve cubic (singular Weierstrass) nearby object'
      column_space: 'multilinear quotient a^2 = a, 2^6 = 64 columns at (2, 2, 3)'
      null_series: '(1 + z)^6 (1 - z^4)'
    implementation: >-
      The F_p port of experiments/EXP-SBRG-60c55e/driver/macaulay.py with
      arbitrary-precision residues (word-size below 2^62, Python integers
      above), validated on the p = 2 known answer (KN-FIND-006) and the
      planted-syzygy positive control; planting by point addition with
      certificate re-verification.
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 12
      maximum_memory_gb: 8
      maximum_runs: 12
  falsification_conditions:
    - >-
      F1. P1 fails: instrument fault; nothing else is reported.
    - >-
      F2. P2 fails (positive control flat in p): the instrument is blind to
      p; no O1 may be reported.
    - >-
      F3. O2 -- a Semaev-arm invariant moves between the large primes in
      more than 5 percent of draws. By the derivation this is a pipeline
      fault (reduction rule, planting, content prime) and is located before
      anything else is read; if no fault is found after the named checks,
      the derivation's hypotheses are re-examined (the planted subvariety's
      generic rank versus the uniform one) and the hypothesis is weakened
      with that finding, not silently re-scoped.
    - >-
      F4. The rank-drop rate does not fall as c/p across the small primes:
      HEUR-001's small-p model is wrong and the reported budget is replaced
      by the measured curve.
    - >-
      F5 (expected). O1 with the Semaev-minus-null difference equal to the
      same integers at every large prime: p-flat by derivation, and
      Semaev-specific structure carried p-independently by exactly those
      integers, which IDEA-20260731-009's surrogate must subtract.
  interpretation_limits:
    - >-
      p-independence at FIXED s says nothing about the s-axis, where the
      exponent question lives; this hypothesis calibrates the p-column of
      the RQ's table and does not fill any growth arm.
    - >-
      No yield, no cost, no attack; the 256-bit cells are degree invariants
      of a 64-column matrix, not solves of anything, and no cryptographic-
      scale claim about ECDLP follows from them.
    - >-
      The derivation is a derivation (checkable argument), not a reviewed
      theorem; its Schwartz-Zippel constant is bounded, not computed, and
      the measured rank-drop rate is what makes it usable.
    - >-
      No status change to IDEA-20260731-009 or any record; any licence for
      HEUR-FF-1 is conditional on the O1 reading and on subtracting the
      measured Semaev-minus-null offset.
