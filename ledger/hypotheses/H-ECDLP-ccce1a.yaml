hypothesis:
  id: H-ECDLP-ccce1a
  question_id: RQ-RELN-001

  statement: >-
    SCOPE: relation matrices retained or regenerable from the RELN lane s
    existing toy-scale runs. CLAIM TIER toy. NO ATTACK, NO EXPONENT, NO STATUS
    CHANGE TO ANY RECORD.
    An index calculus needs enough INDEPENDENT relations to solve its linear
    system; collection produces relations, some of which are linearly dependent
    on ones already held. The claim under test is that the lane s relation supply
    figure materially overstates progress - formally, that the rank deficit
    (relations collected minus exact rank achieved) on the lane s real matrices
    exceeds twice the deficit of a matched random-sparse null of the same size,
    density and field, at the largest retained matrix.
    The complementary outcome - rank tracks relation count as closely as random
    sparse vectors would - establishes that the lane s supply figure is sound,
    which is worth establishing and has never been checked here.
    THE OPERATIONALLY IMPORTANT QUANTITY IS THE MARGINAL ONE. Where the marginal
    rank contribution per newly collected relation approaches zero is the real
    stopping point of collection, and a relation COUNT cannot see it at all.

  mechanism: >-
    Track exact rank over the field the system is actually solved over, as
    relations accumulate, on every retained relation matrix. Report three things
    per run - rank against relations collected, the marginal rank contribution
    per relation as collection proceeds, and the deficit against a matched
    random-sparse baseline whose deficit distribution is computable.
    WHY THE RANDOM-SPARSE ARM IS BOTH THE CALIBRATION AND THE SCOPE GATE. The
    rank deficit of random sparse vectors over a finite field follows a known
    computable law, so the arm calibrates the measurement. It is ALSO entirely
    curve-free - there is no elliptic curve anywhere in a random sparse matrix -
    so if the lane s real matrices are indistinguishable from it, the finding is
    about sparse linear algebra in general and not about elliptic curves. That
    consequence is written down before the run.
    WHY A SWEPT DUPLICATION IS REQUIRED RATHER THAN A SINGLE DUPLICATE. A rank
    routine that fails to increase rank when one relation is duplicated has shown
    only that it handles one duplicate. Duplicating k relations for k swept over
    a range forces the measured deficit to rise by exactly k, which demonstrates
    that the instrument measures the SIZE of a dependency and not merely its
    presence. Without that, a small measured deficit is uninterpretable.

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Null deliberately. No algorithm, no complexity claim, no exponent. Cost is
    incremental exact rank computation over already-retained matrices.

  rerandomization: null

  proof_search_map:
    not_applicable_reason: >-
      A progress-metric control over existing artifacts, not a proof-oriented
      proposal. No theorem, reduction, certificate family or asymptotic is
      asserted. Recorded as non-applicable rather than omitted, per
      docs/inventor-protocol.md section 8.

  assumptions:
    - >-
      Relation matrices are retained, or are exactly regenerable from the lane s
      committed run parameters and seeds. If neither holds, the measurement is
      UNAVAILABLE and that is reported; a matrix reconstructed approximately is
      not the matrix the lane measured and may not be substituted for it.
    - >-
      Exact rank is computed over the field the linear system is actually solved
      over. Rank depends on that field, and computing it over the wrong one gives
      a meaningless deficit. The field is a required recorded parameter of every
      number.
    - >-
      Rank is computed EXACTLY, never estimated. An estimated rank cannot support
      a claim about a deficit of a few units.

  heuristic_assumptions:
    - id: HEUR-RANK-1
      formal_statement: >-
        Relations produced by the lane s collection procedure are linearly
        independent with the probability that random sparse vectors of the same
        length, density and field would be, so that the observed rank deficit
        matches the random-sparse law.
      random_model_justification: >-
        The rigorous ingredient is that for random sparse vectors over a finite
        field the rank deficit follows a computable law, giving a precise
        baseline distribution rather than a point. THE GAP, AND IT IS THE FAILURE
        THE MEASUREMENT IS LOOKING FOR - relations arise from decompositions over
        a FIXED factor base, so they live in a structured subspace, and repeated
        decompositions of related targets can produce genuinely dependent
        relations at a far higher rate than random.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-0cdf35]
      falsification_condition: >-
        A rank deficit on real matrices materially exceeding the random-sparse
        baseline at matched size, density and field - which refutes the
        assumption and is the record s positive outcome.

  structural_ingredients:
    - description: >-
        The RELN lane s decision target - a frozen measurement protocol for
        decomposition probability against factor-base size with explicit controls
        and certificate obligations - and its constraint that published heuristic
        exponents are treated as reported until reproduced.
      citation: ledger/questions/RQ-RELN-001.yaml
      provenance: internal
      verified_by: >-
        coordinator subagent under TASK-20260904-c0edda, 2026-09-04, read
        ledger/questions/RQ-RELN-001.yaml in full (25 lines).
      role: the lane whose supply figure this record re-expresses in rank
    - description: >-
        The rank-deficit law for random sparse matrices over a finite field,
        which supplies both the calibration and the curve-free comparison
        distribution.
      citation: >-
        Standard finite-field random-matrix theory. NO TEXT WAS OPENED for this
        record; the run must compute the baseline distribution numerically at the
        matched size, density and field rather than quoting a formula from here.
      provenance: recalled
      verified_by: null
      role: null distribution and calibration reference
    - description: >-
        The lane s existing relation-count supply figure, which this record would
        replace with a rank-based one.
      citation: >-
        Characterised from IDEA-20260815-fa56e7 and RQ-RELN-001. THE UNDERLYING
        RELN RUN AND EVIDENCE RECORDS WERE NOT OPENED BY THIS AGENT and no
        numeric supply figure is asserted here; Stage 0 must resolve the retained
        matrices and their recorded counts from committed artifacts.
      provenance: internal
      verified_by: >-
        coordinator subagent under TASK-20260904-c0edda, 2026-09-04 - read only
        ledger/questions/RQ-RELN-001.yaml and
        ledger/proposals/IDEA-20260815-fa56e7.yaml.
      role: the incumbent progress metric

  predictions:
    - metric: >-
        P1 - DUPLICATED-RELATION NULL, SWEPT - k relations deliberately
        duplicated, k swept over {1, 2, 4, 8, 16}
      direction: different
      minimum_effect: >-
        Rank FORCED not to increase at any k, and the measured deficit FORCED to
        rise by EXACTLY k at every k. Rank growth means the rank computation is
        wrong; a deficit that does not track k means the instrument sees the
        presence of a dependency but not its size, and no small measured deficit
        from it is interpretable.
    - metric: >-
        P2 - RANDOM-SPARSE BASELINE DEFICIT distribution at matched size, density
        and field, over at least 20 seeds, reported BEFORE any real matrix is
        scored
      direction: different
      minimum_effect: >-
        Width strictly greater than 0. A degenerate baseline of exactly one value
        would make every comparison against it a width-zero test that can never
        fail in one direction; if the computed distribution is a point mass, the
        matched size is too small to discriminate and that cell is dropped.
    - metric: >-
        P3 - exact rank against relations collected on the lane s real matrices,
        per run and per collection prefix (integer rank, integer count)
      direction: lower
      minimum_effect: >-
        The measurement. DEFICIT MATERIAL is declared if the real deficit exceeds
        twice the mean baseline deficit at the largest retained matrix and lies
        outside the baseline s 95 percent band. DEFICIT IMMATERIAL is declared if
        the real deficit lies inside that band. The region between is
        pre-declared INCONCLUSIVE.
    - metric: >-
        P4 - marginal rank contribution per newly collected relation, as a
        function of relations collected (dimensionless, rank per relation)
      direction: lower
      minimum_effect: >-
        Predicted to fall. The relation count at which it first falls below 0.5
        is the reported operational stopping point; if it approaches zero well
        before the target rank, collection SATURATES and no amount of further
        collection completes the system at that cell, which is the record s most
        consequential possible outcome.
    - metric: >-
        P5 - CURVE-FREE SCOPE GATE - real matrices scored against the matched
        random-sparse arm, which contains no elliptic curve
      direction: different
      minimum_effect: >-
        Consequence pre-declared. IF THE REAL MATRICES DEFICIT AND MARGINAL CURVE
        ARE INDISTINGUISHABLE FROM THE MATCHED RANDOM-SPARSE ARM, the finding is
        a statement about sparse linear algebra at these sizes and densities and
        NOTHING from this experiment may be quoted as a statement about elliptic
        curves or the ECDLP.

  test_boundary:
    instances: >-
      Every retained or exactly regenerable relation matrix from the RELN lane s
      committed toy-scale runs; a matched random-sparse ensemble at the same
      size, density and field; a duplicated-relation arm.
    parameters:
      duplication_sweep: [1, 2, 4, 8, 16]
      baseline_seeds: 20
      rank_computation: exact over the recorded solve field, never estimated
      prefix_granularity: rank recorded at every relation prefix, not only at the end
    implementation: >-
      Incremental exact rank over the recorded field, applied to retained
      matrices; a matched random-sparse generator; a duplication injector.
    budget:
      wall_clock_seconds_per_run: 3600
      maximum_memory_gb: 8
      maximum_runs: 120

  falsification_conditions:
    - >-
      F1 - the duplicated-relation null shows rank growth at any k. The rank
      computation is wrong and nothing is admissible.
    - >-
      F2 - the deficit does not rise by exactly k across the sweep. The
      instrument has no demonstrated dynamic range and no small deficit from it
      may be interpreted.
    - >-
      F3 - relation matrices are neither retained nor exactly regenerable. The
      measurement is UNAVAILABLE and is reported as such; nothing is
      reconstructed approximately and substituted.
    - >-
      F4 - the random-sparse baseline is a point mass at the matched size. That
      cell cannot discriminate and is dropped rather than scored.
    - >-
      F5 - rank tracks relation count within the baseline band. Relations are
      effectively independent and the lane s supply figure is sound - a clean
      positive result worth establishing.
    - >-
      F6 - a large deficit appears outside the baseline band. The lane s supply
      figure overstates progress and its stopping rule needs restating in rank
      rather than count. Directly actionable.
    - >-
      F7 - the real matrices are indistinguishable from the curve-free arm. Scope
      collapses to sparse linear algebra and no elliptic-curve statement may be
      made.

  interpretation_limits:
    - >-
      CLAIM TIER toy. Measures a progress metric on already-collected artifacts.
      Produces NO cost model, no relation-probability model and no exponent.
    - >-
      Scoped to the lane s existing runs, their matrix sizes and densities, and
      the recorded solve field.
    - >-
      At toy sizes the deficit is dominated by the first few relations and the
      marginal curve is noisy; a trend claim requires enough relations for the
      curve to be visible, and cells that do not have them are reported as
      underpowered rather than fitted.
    - >-
      NOT TESTABLE AT REACHABLE SCALE, STATED PLAINLY. Whether relation
      collection saturates at cryptographically relevant factor-base sizes cannot
      be determined here; a saturation finding at toy scale does not transfer
      without a trend supporting it, and no such trend is claimed.
    - >-
      Changes no status. Any restatement of the lane s stopping rule is a
      Coordinator decision made elsewhere on committed evidence.

  status: proposed
  proposed_by: coordinator

  source_refs:
    - ledger/proposals/IDEA-20260815-fa56e7.yaml
    - ledger/questions/RQ-RELN-001.yaml
    - ledger/handoffs/TASK-20260904-c0edda.yaml
    - docs/inventor-protocol.md
    - templates/research-records.md

  authoring_note: >-
    Written under TASK-20260904-c0edda (DESIGN ONLY) from IDEA-20260815-fa56e7.
    RQ-RELN-001 was read in full before its characterisation was adopted. The
    source idea offers a single duplicated-relation null; this record sweeps the
    duplication count so the instrument s dynamic range is demonstrated rather
    than assumed, requires the random-sparse baseline to have nonzero width
    before it is used as a reference, and pre-declares the curve-free
    consequence.
