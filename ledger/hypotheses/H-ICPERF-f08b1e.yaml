hypothesis:
  id: H-ICPERF-f08b1e
  question_id: RQ-ICPERF-94c86e
  goal_id: GOAL-ICPERF-e6b6a4
  batch_id: BATCH-94168f
  designed_from: IDEA-20260915-3119c9
  status: specified
  proposed_by: coordinator
  recorded_at: '2026-09-16'
  novelty_status_inherited: unverified

  statement: >-
    Let E: y^2 + xy = x^3 + a x^2 + b over F_q, q = 2^n, n odd, with
    #E = 2r and r odd, and let G = 2E be the odd-order class, which contains
    the attack's targets. Split a factor base Fb_E = {P in E(F_q) : x(P) in V}
    into F1 = #{P in Fb_E : P in G} = #{P in Fb_E : Tr(x(P)) = Tr(a)}
    (criterion F2 of H-SEMBIN-83a856, status supported) and
    F0 = |Fb_E| - F1.
    (Y1, THE COUNT.) The number of unordered point-triples from Fb_E whose sum
    lies in G is Lambda(V) = C(F1 + 2, 3) + F1 * C(F0 + 1, 2) -- three
    G-points, or one G-point and two non-G points, because the class bit is
    the homomorphism E -> E/2E = Z/2 and the class of a sum is the XOR of the
    classes. Consequently the expected number of decompositions of a uniformly
    random G-target x-coordinate is lambda_x(V) = 2 Lambda(V) / (r - 1), and
    the decomposable fraction is 1 - exp(-lambda_x) in the small-lambda
    regime.
    (Y2, DESIGN RULE R1 -- CLASS ALIGNMENT.) Replacing the Trimoska
    V = {deg x < l} by an affine slice V' = {x in W : Tr(x) = Tr(a)} for an
    (l+1)-dimensional linear W sets F0 = 0, excludes x = 0 automatically when
    Tr(a) = 1, and gives Lambda(V') = C(|Fb_E| + 2, 3), which at EQUAL
    |Fb_E| is 2x the balanced-V value.
    (Y3, DESIGN RULE R2 -- E-SIDE ENRICHMENT.) Over K random class-aligned
    slices of the same shape, |V' ∩ x(E)| is Binomial(2^l, 1/2) to within
    Weil-sum corrections (HEUR-1), so the best of K has
    |V'_E| ~ 2^{l-1}(1 + sqrt(2 ln K)/2^{l/2}) and Lambda gains
    (1 + sqrt(2 ln K)/2^{l/2})^3 over the mean -- decaying toward the class
    factor 2 alone as l grows.
    (Y4, THE CAP.) F1 <= 2|V| = 2^{l+1}, so Lambda <= C(2^{l+1}+2, 3), which
    is about 16x the balanced-V value, against a DOUBLED N_rel ~ |Fb_E|/2.
    Since the relation-search cost of an exhaustive-core point-decomposition
    solver scales as N_rel / Lambda (H-ICPERF-81de5c, L2), the T_rel gain over
    the shipped V is CAPPED AT 8x for any factor base that is an affine slice
    of dimension l, and is predicted at 4-5x at l = 6 with K = 10^4.
    (Y5, WHAT IS AND IS NOT CLAIMED.) This is a YIELD INSTRUMENT first and a
    CONSTANT-FACTOR design rule second. The exponent 1 in n of the SAT
    pipeline and the 1/2 of rho are untouched, the pipeline remains
    exponentially dominated by rho at every n in the table, and no exponent
    moves.

  mechanism: >-
    WHY (F1, F0) IS THE RIGHT OBJECT. The tracked object is the pair
    (side bit s(x), class bit Tr(x) + Tr(a)) of each factor-base
    x-coordinate. Under the operation set {form the sum of three factor-base
    points} the CLASS bit propagates deterministically -- it is the
    E -> E/2E homomorphism -- while the SIDE bit is a precondition (only
    side-0 x are factor-base points at all). The lossy-projection test passes
    for the class bit exactly as in IDEA-20260913-cedd2f, which used it to
    CONFINE; this record uses it to COUNT. That is the whole move: a factor
    base becomes a pair of integers, and the yield becomes a closed form in
    them.

    WHY THE COUNT IS WORTH MORE THAN THE DESIGN RULE. RUN-ICPERF-305ca3
    reports, per instance, an S/U label and a time. It cannot see that at the
    SAME l = 6 the (17,6) and (19,6) cells differ in yield by a factor of
    about 3.7 -- 27.7% of G-targets decomposable against 7.5% -- and that the
    difference comes entirely from F1 = 38 against F1 = 24. A boundary table
    whose relation-yield column is an idealisation (Semaev 2015/310 eq. (11),
    2^{3l-n}/3!) rather than a measured-and-predicted pair will attribute
    that 3.7x to whatever else varies between the cells. Y1 gives the column a
    PREDICTION computable from (F1, F0, r) before any solver runs, and
    EXP-ICPERF-2f2e40's exhaustive table gives it the exact measured value to
    check against. A residual above the multiset band is then a structural
    finding -- 2-torsion, sign multiplicity, or a class-criterion failure --
    localised by inspecting the residual triples, rather than an unexplained
    gap.

    WHY THE CAP IS STATED BEFORE THE GAIN IS MEASURED. Reaching Lambda's
    ceiling needs a subspace lying entirely inside x(E), whose probability
    under HEUR-1 is 2^{-(2^l - 1)} per random slice -- unreachable by search
    for l >= 5. So the realisable gain is the EXTREME-VALUE one and it SHRINKS
    with l: the enrichment factor (1 + sqrt(2 ln K)/2^{l/2})^3 decays as
    2^{-l/2}, leaving only the class factor 2 asymptotically. Recording the
    cap and the decay in the hypothesis, before any slice is searched, is what
    stops a measured 4x at l = 6 from being read as a method that keeps
    paying.

    THE ASYMMETRY WITH THE FROBENIUS LANE, RECORDED SO THE TWO ARE NOT
    CONFLATED. On a Tr(a) = 1 Koblitz curve, IDEA-20260915-8fe0ef (ranked 6,
    not designed here) observes that every linear tau-stable V not containing
    F_2 lies inside ker Tr and therefore has F1 = 0 -- the OPPOSITE extreme of
    this record's design rule, and a case where G-targets have exactly zero
    decompositions for odd m. The two records agree on the mechanism and
    disagree on which V to build; a slice that is good under Y2 is generally
    not tau-stable, and the shipped V = {deg x < 6} is neither.

  assumptions:
    - '#E = 2r with r odd. True at n = 15, 17, 19 on the Trimoska curve by IDEA-20260915-3119c9''s proposal-time count (r = 16247 = 7*11*211, 65587 prime, 262543 prime); r need not be prime for the design rule.'
    - >-
      The Weil-descent generator can emit an AFFINE factor-base slice
      x_i = v0 + sum_j bit_ij u_j with an arbitrary basis (u_j) and offset v0.
      The vendored Weil_descent.sage uses the monomial basis and CANNOT. This
      is an implementation gap, not a research assumption, and it is the
      contract's approval precondition AP-2.
    - >-
      Targets are drawn in G. The count is stated for G-targets and is
      different (and not stated here) for non-G targets.
    - >-
      Every quantity taken from IDEA-20260915-3119c9's proposal-time script
      (#E = 32494 / 131174 / 525086; F1/F0 = 14/7, 38/25, 24/39; measured
      lambda_x 0.117 / 0.678 / 0.162 against predicted 0.099 / 0.641 / 0.157;
      the K = 2000 slice statistics) is UNREVIEWED and is an input to be
      re-established by the reconstruction control, never a result.

  proof_search_map:
    bottleneck: >-
      The relation-search YIELD -- decompositions per target -- which divides
      the per-instance point-decomposition cost to give the relation-phase
      cost. It is the one factor of T_rel that H-ICPERF-81de5c takes as
      measured input rather than predicting.
    baseline_embedding:
      parameter_slice: >-
        The three shipped cells with the SHIPPED V. Lambda(V) computed from
        (F1, F0) must reproduce the exhaustive table's measured lambda_x
        within the multiset band before any designed V is scored.
      reproduction_check: >-
        Recompute F1, F0, r and #E from the .in files and the curve, and
        compare against 14/7, 38/25, 24/39 and #E = 32494 / 131174 / 525086;
        then compare Lambda-predicted lambda_x against the table's measured
        lambda_x per cell.
    observation_collision:
      observable: lambda_x measured on the table for a designed V against the shipped V.
      distinct_preimage_search: >-
        A yield gain g has at least three preimages: (i) the class alignment
        (F0 -> 0), (ii) a lucky E-side draw (large |V'_E|), (iii) a
        curve-specific structure of x(E) on affine slices. (i) and (ii) are
        separated by REPORTING F1 AND F0 ALONGSIDE lambda_x -- the count
        predicts the gain from the pair, so the two contributions are
        arithmetic rather than inferred. (iii) is detected when Lambda
        mispredicts lambda_x by more than the multiset band on the designed V
        but NOT on the shipped V.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The factor base as a pair of counts (F1, F0) rather than a set, and
          the yield as a closed form in them.
        predicted_gain: >-
          A predicted yield row per cell, checkable against an exact table;
          a design rule (maximise F1) with a quantitative ceiling stated in
          advance.
    quantifier_order: >-
      FOR EVERY cell (n, l) with l <= 8 admitted by the contract's admission
      rules AND FOR EVERY affine slice V of dimension l, lambda_x(V) equals
      2 Lambda(V)/(r-1) up to the multiset correction (at most +25% at
      |Fb_E| >= 20, at most +10% at |Fb_E| >= 60) and 2-torsion coincidences.
      The EXTREME-VALUE statement of Y3 is about the DISTRIBUTION of |V_E|
      over uniformly random slices and is HEUR-1, not part of Y1, Y2 or Y4.
    method_ceiling:
      strongest_certifiable_claim: >-
        The count Y1, the cap Y4, and a measured gain of the designed V at
        l <= 8 on the Trimoska curve and on at least two further curves: a
        constant-factor statement about the relation-search phase of an
        exhaustive-core point-decomposition solver. Nothing about any
        exponent, nothing about any curve's security.
      nearby_object_control: >-
        Two of them, and they test different things. (a) A V inside ker Tr at
        Tr(a) = 1: F1 = 0, Lambda = 0, and the table must show EXACTLY ZERO
        G-target decompositions -- the confinement object of
        IDEA-20260913-cedd2f / H-SEMBIN-83a856, which is KNOWN-FALSE for the
        design rule and TRUE for the mechanism. (b) The quadratic twist E'
        with a' satisfying Tr(a') != Tr(a): the SAME slice has the opposite
        class structure there, and the count must be RECOMPUTED from
        (F1', F0') rather than assumed to transfer or assumed not to.
    proof_obligations:
      - claim: Lambda(V) reproduces the shipped cells' measured table yields
        responsibility: baseline
      - claim: the class XOR rule for triples (E -> E/2E homomorphism)
        responsibility: correctness
      - claim: 'F0 = 0 on a class-aligned slice, verified by an INDEPENDENT 2E-membership test and not by the trace criterion the slice was built from'
        responsibility: correctness
      - claim: T_rel proportional to N_rel / Lambda at fixed per-instance cost
        responsibility: runtime
      - claim: the extreme-value law for max over K slices of |V_E|
        responsibility: success_probability
      - claim: the 8x cap for affine slices of dimension l
        responsibility: strictness
      - claim: every statement scoped to affine slices, l <= 8, m = 3, these curves
        responsibility: scope

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null and deliberately explicit. Y4 CAPS the effect at a
    constant 8 and the cap is part of the hypothesis rather than a caveat on
    it. No exponent is claimed, the four promotion gates of
    agents/coordinator.md are not engaged, and a measured gain above 8 at any
    cell is a FALSIFIER of Y4 rather than a better result.

  rerandomization: null

  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        Over uniformly random affine slices V of dimension l inside
        {Tr(x) = Tr(a)}, |V ∩ x(E)| is Binomial(2^l, 1/2) to within a relative
        correction O(2^{-l/2} + 2^{l/2 - n/2}).
      random_model_justification: >-
        Rigorous side: the E-side indicator is
        (1 + (-1)^{Tr(x + a + b/x^2)})/2, so the count is a character sum over
        an affine slice -- a subspace Kloosterman sum -- and over the whole
        field |K| <= 2 sqrt(q) by Weil. Imitated side: over a RANDOM subspace
        a second-moment argument gives variance 2^{l-2}, the binomial
        variance, up to a correlation term bounded by the Weil estimate. This
        imitates the classical equidistribution of Kloosterman sums and is NOT
        proved for fixed slices.
      supporting_results:
        - >-
          Weil bound |K| <= 2 sqrt(q) for Kloosterman sums over F_q --
          provenance RECALLED, therefore a pointer and not support
          (AGENTS.md rule 9). No agent in this program has opened a source.
        - >-
          Gumbel / Fisher-Tippett extreme-value law for maxima of K i.i.d.
          samples -- provenance RECALLED, and carried forward from
          IDEA-20260915-3119c9 which marks it the same way. It backs nothing;
          it tells a reviewer where to look.
      supporting_results_status: >-
        BOTH RECALLED, SO HEUR-1 HAS NO DISCHARGED SUPPORT. That is stated
        rather than smoothed. What the experiment CAN do without opening
        either source is measure the distribution directly: the |V_E|
        histogram over K = 10^4 slices is the validation, and it is cheap.
      validation_experiment_ids:
        - EXP-ICPERF-42ef30
      falsification_condition: >-
        The measured |V_E| histogram's mean or standard deviation departing
        from 2^{l-1} and 2^{l/2-1} by more than the sampling error at
        K = 10^4, OR the upper-tail fraction above mean + 2 s.d. differing
        from 0.023 +- 0.005. A HEAVIER tail is reported as structure and would
        make the enrichment gain LARGER than predicted, which is a finding and
        not a convenience.
    - id: HEUR-2
      formal_statement: >-
        The per-instance UNSAT cost of the exhaustive-core point-decomposition
        solver does not depend on WHICH affine slice V of a given dimension l
        is used: c within 10% between the shipped V and any designed V at the
        same l.
      random_model_justification: >-
        Rigorous side: the leaf count 2^{3l} is a property of the BLOCK SIZES,
        not of the basis (H-ICPERF-81de5c, L1), and an affine slice changes the
        descended relations only in their linear and constant terms. Imitated
        side: that those changed terms do not alter propagation enough to
        move the conflict count. Nothing classical is imitated; this is a
        solver-behaviour heuristic and it is the one this record most expects
        could fail, because an affine offset introduces constant terms into
        the linear relations and EV-ICPERF-390707 joint V4 already found that
        constant-term count is a property the program had been treating as
        irrelevant when it was not.
      supporting_results:
        - >-
          H-ICPERF-81de5c L1 (this program, `specified`, unmeasured at the
          time of writing) -- provenance internal. It is a SIBLING HYPOTHESIS,
          not evidence, and HEUR-2 therefore rests on an unmeasured claim.
          Stated so a reviewer sees the dependency rather than inferring it.
      validation_experiment_ids:
        - EXP-ICPERF-42ef30
      falsification_condition: >-
        c on the designed V differing from c on the shipped V by more than 25%
        at the same (n, l) over >= 20 certified-U instances each. Then the
        design changes the PER-INSTANCE cost as well as the yield, the gain is
        not yield-only, and T_rel must be recomputed with both factors
        reported separately.

  structural_ingredients:
    - description: >-
        Criterion (F2): P in 2E iff Tr(x_P) = Tr(a); and the confinement
        consequence that a V inside ker Tr gives half the targets exactly zero
        decompositions.
      citation: H-SEMBIN-83a856 (status supported) and IDEA-20260913-cedd2f
      provenance: internal
      verified_by: >-
        coordinator decision cited in H-SEMBIN-83a856; validator
        TASK-20260913-da3982 per IDEA-20260913-cedd2f. Read as committed
        records by this Coordinator 2026-09-16.
      role: the class criterion the whole count is built on
    - description: >-
        The idealised yield 2^{mk-n}/m! for a k-dimensional V, which Y1
        refines by carrying the class split and the exact multiset counts.
      citation: inputs/SEMAEV-2015-310/paper_fulltext.md eq. (11)
      provenance: internal
      verified_by: validator TASK-20260913-da3982 per IDEA-20260913-cedd2f; NOT re-opened by this record
      role: the incumbent yield model being replaced
    - description: >-
        The exact measured per-target decomposition counts against which Y1's
        prediction is checked.
      citation: H-ICPERF-afe62e / EXP-ICPERF-2f2e40
      provenance: internal
      verified_by: coordinator BATCH-94168f 2026-09-16 (designed in the same decision)
      role: the instrument that makes Y1 falsifiable rather than merely plausible
    - description: >-
        T_rel proportional to N_rel * C_U / p in the small-p regime, hence
        proportional to |Fb_E| / Lambda at fixed per-instance cost.
      citation: H-ICPERF-81de5c, L2
      provenance: internal
      verified_by: coordinator BATCH-94168f 2026-09-16 (designed in the same decision; UNMEASURED)
      role: the step that converts a yield gain into a cost gain -- and an unmeasured one

  reduction_chain:
    core_problem: The relation-search yield of a subspace-defined factor base on a binary curve with #E = 2r.
    corollaries:
      - problem: The relation-search phase cost T_rel of the SAT-driven S_4 pipeline at the same cell.
        reduction_ref: 'H-ICPERF-81de5c L2 (internal, unmeasured): T_rel proportional to N_rel / Lambda at fixed per-instance cost.'
        asymptotics_preserved: >-
          No. The reduction transfers a CONSTANT and explicitly not an
          exponent; Y4 caps it at 8.

  predictions:
    - metric: '|lambda_x(table) / (2 Lambda(V)/(r-1)) - 1| on every V tested'
      direction: lower
      minimum_effect: '<= 0.25 at |Fb_E| >= 20, <= 0.10 at |Fb_E| >= 60'
    - metric: F0 for the class-aligned slice V', measured by an INDEPENDENT 2E-membership test (not the trace criterion)
      direction: lower
      minimum_effect: exactly 0 on every admitted cell; a single non-G factor-base point falsifies criterion (F2) or the construction, and the record says which
    - metric: 'G-target decompositions for the KNOWN-FALSE slice inside ker Tr at Tr(a) = 1'
      direction: lower
      minimum_effect: exactly 0 over every G-target x-coordinate of the cell
    - metric: 'max over K = 10^4 random class-aligned slices of |V''_E| at l = 6'
      direction: higher
      minimum_effect: '>= 46.6 (the crude Gumbel estimate 32 + 4*sqrt(2 ln 10^4) minus 15%), reported with the full histogram'
    - metric: 'T_rel gain of the best designed V over the shipped V, computed as [|Fb_E|/Lambda]_shipped / [|Fb_E|/Lambda]_designed'
      direction: higher
      minimum_effect: '>= 3 at (17,6) and (19,6) with K = 10^4; and <= 8 at EVERY cell (the cap)'
    - metric: decay of the enrichment factor (max/mean)^3 from l = 6 to l = 8 at fixed K
      direction: lower
      minimum_effect: 'ratio of factors within 25% of [(1 + sqrt(2 ln K)/8)/(1 + sqrt(2 ln K)/16)]^3'
    - metric: 'HEUR-2: c on the designed V against c on the shipped V at the same (n, l)'
      direction: different
      minimum_effect: within 10%; a difference above 25% falsifies HEUR-2 and is reported as the finding

  test_boundary:
    instances: >-
      The shipped V and the designed V at the cells EXP-ICPERF-2f2e40 admits;
      for the solver arm, 20 certified-U and 20 certified-S G-target instances
      per (cell, V). Binary curves with #E = 2r, m = 3, l <= 8, one host.
    parameters:
      V_families: 'shipped {deg x < l}; class-aligned affine slice V'' = {x in W : Tr(x)=Tr(a)}; enriched best-of-K class-aligned slice; random non-aligned slice (null); ker-Tr slice (known-false)'
      curves: 'the Trimoska curve a = b = 1; its quadratic twist a'' with Tr(a'') != Tr(a); at least two further binary curves with #E = 2r, chosen at a recorded seed'
      solvers_named_and_versioned: WDSat @ 61c6ff3 default, for the HEUR-2 arm only
    implementation: >-
      New tree under experiments/EXP-ICPERF-42ef30/code/. Consumes
      EXP-ICPERF-2f2e40's ACCEPTED enumerator rather than writing a third
      implementation of the same arithmetic; its own independence guard is
      that Lambda is computed by a SEPARATE code path from the table, so the
      count and the table are two implementations that must agree.
    budget:
      note: >-
        Advisory. Steps computing (F1, F0, r), Lambda, the slice search and
        the exhaustive tables need NO solver and NO generator change; only the
        HEUR-2 arm does.

  falsification_conditions:
    - >-
      Lambda mispredicting lambda_x by more than 25% at |Fb_E| >= 20 on any V:
      the count is missing a term. Report WHICH by inspecting the residual
      triples -- sign multiplicity, 2-torsion, or a class-criterion failure.
    - >-
      Any factor-base point of the class-aligned slice found outside G by the
      INDEPENDENT 2E-membership test: criterion (F2) or the construction is
      wrong; the hypothesis is withdrawn until resolved, and which of the two
      failed is reported.
    - >-
      Any G-target decomposition on the ker-Tr slice: the confinement result
      H-SEMBIN-83a856 fails on this curve, which would be a contradiction
      between validated evidence records and requires review-breakthrough per
      AGENTS.md rule 12 rather than a quiet note.
    - >-
      max over K = 10^4 slices of |V'_E| below 2^{l-1} + 0.6 * 2^{l/2-1} *
      sqrt(2 ln K): the maximum falls short of the extreme-value prediction by
      more than 40% of the excess, so |V_E| is not binomial over slices (a
      Kloosterman-sum structure on subspaces). That is itself a structural
      finding and is recorded as one.
    - >-
      A measured T_rel gain ABOVE 8 at any cell: Y4's cap argument is wrong
      somewhere named. A gain above the cap is a falsifier, not a success.
    - >-
      HEUR-2 failing (c differing by more than 25% between designed and
      shipped V at equal l): the gain is not yield-only.
    - >-
      NOT a falsifier: a slice search that finds no admissible slice, a
      (cell, V, side) refused by an admission rule, a solver timeout, or a
      table that exceeds its memory bound. Those are infrastructure outcomes
      (AGENTS.md rule 5).

  interpretation_limits:
    - >-
      A yield instrument and a constant-factor design rule for the
      relation-search phase. No exponent claim. Nothing about the
      per-instance point-decomposition cost beyond HEUR-2, and nothing about
      Groebner engines.
    - >-
      Scoped to binary curves with #E = 2r, m = 3 decompositions, l <= 8, and
      factor bases that are AFFINE SLICES. The count changes for m = 4 (the
      parity condition on non-G members changes) and is not stated here. A
      non-affine V (a union of slices) is a different object with a different
      cap and is out of scope.
    - >-
      The 8x cap is a cap on this family of factor bases, not a general
      statement about factor-base design.
    - >-
      novelty_status is UNVERIFIED and inherited. Whether the trace-condition
      factor base is already in the literature is unchecked at full-text
      level; if it is, the design-rule half of this record is dominated and
      only the measured yield column survives.
    - >-
      HEUR-2 rests on H-ICPERF-81de5c's L1, which is itself unmeasured at the
      time of writing. Two unmeasured claims in series is a real weakness and
      it is the reason the HEUR-2 arm is gated rather than assumed.
    - >-
      The designed-V pipeline at T_rel/8 remains dominated on TIME by rho and
      by exhaustive group search at every n >= 8, and on MEMORY by rho's
      O(w). This record moves a dominated row by a constant and adds a
      predicted yield column; it occupies no new point on any frontier.
