    - metric: >-
        G8 -- both decompositions reported: slope of ln R and slope of
        delta = C_EC - C_null against ln p
      direction: different
      minimum_effect: >-
        'BOTH REPORTED, NEITHER CHOSEN. If they disagree about whether the
