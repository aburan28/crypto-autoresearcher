    - metric: >-
        G4 (the hypothesis) -- R(p) = C_EC/C_null at bits {20, 22, 24, 26},
        mean over >= 8 curves per rung
      direction: different
      minimum_effect: >-
        'In [1.10, 1.32] at every rung. Derived from the four committed points
        (1.1505, 1.2239, 1.2341, 1.1737) plus their 7 per cent scatter. Outside
