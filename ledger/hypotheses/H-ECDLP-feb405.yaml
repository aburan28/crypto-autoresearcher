  test_boundary:
    instances:
      - >-
        Deterministically seeded ordinary prime-field curves at bits in
        {20, 22, 24, 26}; >= 8 curves per rung for the mean statistic and >= 20
        per rung for the adversarial max.
      - >-
        Null arm: >= 200 uniform random B-subsets of Z_N per rung, same N, same
        B, same full k-range.
      - >-
        Planted AP arm and the five-point graded theta sweep at each rung.
      - >-
        OUT OF SCOPE: bits > 26 (FFT memory), partial-k maxima, standardized
        curves, any live key, and any discrete-logarithm SEARCH. DL values are
        obtained by enumerating the group from G, which is not a DLP solve.
      - >-
        NOT IN SCOPE AS A CONCLUSION: the asymptotic behaviour of C, the truth
        of H-PSEUDO, or the crypto-scale Semaev yield error.
    parameters:
      bits: [20, 22, 24, 26]
      curves_per_rung_mean: 8
      curves_per_rung_max: 20
      null_draws_per_rung: 200
      k_range: full (k = 1 .. N-1)
      B_rule: >-
        stated before the run and identical at every rung; the contract fixes
        it and records it, because a B-trend masquerading as a p-trend is the
        most likely way this comparison is wrong IN EITHER DIRECTION
      theta_sweep: [0.0, 0.25, 0.5, 0.75, 1.0]
      gamma_E: 0.5772156649
    implementation: >-
      Python 3.11 with numpy 2.4.6 (PRESENT AND VERIFIED BY IMPORT THIS SESSION;
      sympy and sage are ABSENT, both raising ModuleNotFoundError -- this
      resolves the environment disagreement recorded in this session's
