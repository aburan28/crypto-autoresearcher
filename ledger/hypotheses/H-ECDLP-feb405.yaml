hypothesis:
  id: H-ECDLP-feb405
  question_id: RQ-ECDLP-002
  source_proposal: ledger/proposals/IDEA-20260805-c4f675.yaml
  goal_id: GOAL-ECDLP-001

  statement: >-
    SCOPE: prime-field ordinary curves at bits in {20, 22, 24, 26}; the
    small-x factor base F = {P in E(F_p) : x(P) < tau} with |F| = B; the
    full-range additive-character statistic
    C = max_{k=1..N-1} |sum_{P in F} e(2 pi i k DL_G(P)/N)| / sqrt(B).
    CLAIM TIER toy. NO ATTACK, NO EXPONENT MOVED, NO SPEEDUP.
    THE HYPOTHESIS HAS TWO PARTS AND A FORCED VALUE FOR EACH.
    (P1) NULL CALIBRATION. For a uniformly random B-subset F' of Z_N, the same
    statistic has the forced value
    C_null(N) = sqrt( ln((N-1)/2) + gamma_E ), gamma_E = 0.5772156649,
    derived from the Exponential(1) limit of |hat{1_{F'}}(k)|^2/B at each
    nonzero frequency and the Gumbel maximum over the (N-1)/2 conjugate-pair
    frequencies. Measured C_null will agree with this to within 5 per cent at
    every rung. (SUPPORTING DATUM ALREADY ON RECORD AND NEVER USED AS ONE:
    DEC-20260804-7af513 measured 2.57 for random bijections at p = 1009 against
    this record's derived 2.6076 -- 1.46 per cent.)
    (P2) THE RATIO IS THE SIGNAL AND IT IS FLAT. R(p) = C_EC(p)/C_null(p) lies
    in [1.10, 1.32] at every rung with least-squares log-log slope
    |alpha_resid| < 0.020 for the mean statistic, against the exponents
    0.055 (KN-FIND-d4f820) and 0.079 (KN-FIND-4c9e71) currently on record for
    C itself. Equivalently: THE ENTIRE MEASURED p-GROWTH OF C IS THE GROWTH OF
    ITS OWN NULL, and the EC-specific part is a CONSTANT OFFSET of about 1.20,
    not a power law.
    CONSEQUENCE, STATED AS THE DELIVERABLE: DEC-20260804-7af513's conclusion
    that "C_EC ~ p^{0.079} >> sqrt(log p) = C_random_prediction ... EC sequences
    become increasingly worse than random bijections as p grows" would then be
    correct in its QUALITATIVE half (EC factor bases ARE about 20 per cent less
    Fourier-flat than random subsets, uniformly) and unsupported in its
    QUANTITATIVE half (the divergence does not grow). If instead
    alpha_resid >= 0.040 is measured, P2 is FALSE, the lane's original
    conclusion is vindicated with the null it never had, and that is the more
    valuable outcome.

  mechanism: >-
    DERIVED IN-REPO THIS SESSION. All arithmetic below is on values committed in
    KN-FIND-d4f820, KN-FIND-4c9e71 and DEC-20260804-7af513, ALL THREE READ IN
    FULL. No new measurement was made and none is claimed.

    STEP 1 -- THE NULL'S FORCED VALUE. For F' uniform of size B in Z_N and
    S(k) = sum_{j in F'} e(2 pi i k j / N), each fixed k != 0 gives a sum of B
    unit vectors at near-uniform phases, so E|S(k)|^2 = B(1 - (B-1)/(N-1)) and
    the complex CLT gives Pr[|S(k)|^2/B > u] -> e^{-u}. Since
    |S(k)| = |S(N-k)| there are M = (N-1)/2 distinct magnitudes; treating them
    as independent (the stated approximation, tested by the null arm rather than
    assumed), the maximum of M i.i.d. Exponential(1) has mean ln M + gamma_E.
    Hence C_null = sqrt(ln((N-1)/2) + gamma_E)(1 + o(1)).
    THE DECISIVE OBSERVATION IS IMMEDIATE AND HAS NEVER BEEN MADE IN THIS LANE:
    C_null ITSELF GROWS LIKE sqrt(log p). The growth the lane attributes to EC
    structure is present in an object with no elliptic curve in it.

    STEP 2 -- THE NULL IS ALREADY CONFIRMED, UNNOTICED. DEC-20260804-7af513
    records a measured random-bijection value 2.57 at p = 1009. Derived:
    sqrt(ln 504 + 0.5772) = 2.6076. Relative error 1.46 per cent. The lane's
    null instrument is therefore already demonstrated calibrated at one prime,
    and that demonstration was never used as a positive control.

    STEP 3 -- DIVIDE THE COMMITTED TABLE BY THE NULL.
      p       C_null    C_mean   R_mean    C_max   R_max
      1009    2.6076    3.00     1.1505    3.90    1.4956
      4001    2.8597    3.50     1.2239    3.87    1.3533
      9001    2.9982    3.70     1.2341    4.11    1.3708
      50021   3.2717    3.84     1.1737    5.18    1.5833
    Least squares of ln R on ln p gives alpha_resid(mean) = +0.00413 with 7.0
    per cent relative spread, and alpha_resid(max) = +0.01717 with 15.9 per cent
    spread. Against 0.055 and 0.079 on record: the mean's residual exponent is
    THIRTEEN TIMES SMALLER than the published one and of unresolvable sign at
    four points; the max retains a genuine but much smaller residual near 0.017.

    STEP 4 -- WHY THE PUBLISHED EXPONENTS ARE THE VALUES THEY ARE. A power law
    and sqrt(log p) are numerically indistinguishable over the measured range.
    The power law exactly mimicking sqrt(log p) between p_lo and p_hi is
      alpha_equiv = ln( sqrt( ln p_hi / ln p_lo ) ) / ln( p_hi / p_lo ),
    which is 0.05543 over [1009, 100003], 0.05732 over [1009, 50021] and
    0.06281 over [1009, 9001]. The four live values are 0.055, 0.0620, 0.0624
    and 0.079. THREE OF FOUR LIE INSIDE THE INTERVAL FORCED BY A MODEL WITH NO
    EC-SPECIFIC GROWTH AT ALL. Model comparison on the same four mean-C points:
    R^2 = 0.865 for ln C against ln p; 0.911 against ln sqrt(ln p); 0.930
    against ln ln ln p. The power law is the WORST of the three and is the only
    one that was extrapolated.

    STEP 5 -- THE MODEL CHOICE IS NOT COSMETIC. At p = 2^256,
    sqrt(ln(N/2) + gamma_E) = 13.32 while p^{0.079} = 1.22 x 10^6, a ratio of
    9.2 x 10^4; KN-FIND-4c9e71 carries C to the m-th power in the Semaev yield
    error term, so at m = 4 the two models differ by 7.2 x 10^{19}. The lane's
    "negligible at crypto scale" conclusion may well be true, but the four
    points do not determine WHICH model is being extrapolated, and the model
    choice is worth twenty orders of magnitude in the quantity of interest.

    STEP 6 -- WHAT SEPARATES THE MODELS AND WHAT IT COSTS. The ratio
    p^{0.079}/sqrt(ln p), normalised to 1 at p = 1009, reaches 1.25 at
    p = 2^{20.7}, 1.5 at 2^{26.2} and 2.0 at 2^{33.8}. A ladder at bits
    {20, 22, 24, 26} buys separation about 1.5 against a residual scatter
    measured at 7 per cent: decisive for the mean, marginal for the max, and
    both facts are stated in advance rather than discovered afterwards. Cost per
    rung: build the full DL table by iterating G once through the group (2^{26}
    point additions at the top rung), form the indicator over Z_N, one real FFT
    of length N, take the max. numpy 2.4.6 IS PRESENT in this container
    (verified by import this session; sympy and sage both raise
    ModuleNotFoundError), so the FFT is seconds and about 0.5 GB at the top
    rung, which is the binding constraint and is why the ladder stops at 26.

    STEP 7 -- WHAT A FLAT RATIO WOULD MEAN. R constant near 1.20 says the
    small-x factor base is about 20 per cent less Fourier-flat than a random
    subset of the same size, uniformly in p. That is a real, EC-specific,
    quantitatively stated structural difference -- the one DEC-20260804-7af513
    was reaching for -- but a CONSTANT OFFSET does not degrade with scale. The
    lane's substantive conclusion survives in a stronger and cleaner form while
    its quantitative form is withdrawn. Both halves are deliverables and neither
    is a status change.

  assumptions:
    - >-
      FROZEN DEFINITIONS, fixed before any evaluation.
      (1) C is the FULL-RANGE maximum over k = 1..N-1, normalised by sqrt(B).
      Partial-k maxima are biased downward by a p-dependent amount and are
      inadmissible. KN-FIND-d4f820 records that p = 2003 and 4001 used
      k = 1..300; those cells are therefore NOT comparable to full-range cells
      and the reproduction must say so.
      (2) C_null is MEASURED on uniform random B-subsets of Z_N with the same
      N, the same B, the same k-range and the same code path; the derived
      sqrt(ln((N-1)/2) + gamma_E) is reported BESIDE it, never in place of it.
      (3) R = C_EC/C_null; delta = C_EC - C_null is reported alongside, and if
      the two decompositions disagree about whether the residual grows, BOTH are
      reported and neither is chosen.
      (4) B is set by a fixed rule stated before the run and held to the same
      rule at every rung, and the rule is recorded.
      Any change to (1)-(4) after any number is observed requires a versioned
      amendment marked exploratory_only, never an edit.
    - >-
      The frequency-independence approximation underlying the Gumbel maximum is
      an approximation, not a theorem. It is tested by the null arm itself.
    - >-
      N = #E(F_p) is used, not p, inside the logarithm. The difference is
      numerically irrelevant but the actual N must be used.
    - >-
      The committed table values are read AS COMMITTED and are not re-derived to
      make them agree. They carry their own records' caveats.
    - >-
      Computing DL_G(P) for every P is done by ENUMERATING THE GROUP from G, not
      by solving any discrete logarithm problem, and is performed only on
      deterministically generated toy curves. No standardized curve, no live
      key, no wallet is involved, per RQ-ECDLP-002's constraints.

  proof_search_map:
    bottleneck: >-
      The single load-bearing inference in the H-PSEUDO lane: from four
      measurements of C at p <= 50021 to a growth law extrapolated to p = 2^256,
      where C^m enters a yield error term and licenses the conditional
      complexity ceiling exp(c sqrt(log N log log N)). If the growth law is not
      identifiable from the data, every downstream statement conditioned on it
      inherits that non-identifiability, and no improvement to the measurement's
      precision at the same four points can repair it.
    baseline_embedding:
      parameter_slice: >-
        The null arm at p = 1009, where DEC-20260804-7af513 already has a
        committed measurement (2.57) that this record's derivation must
        reproduce.
      reproduction_check: >-
        NUMERICAL AND ALREADY PERFORMED: derived 2.6076 against committed 2.57,
        error 1.46 per cent. This is an embedding of the model into an existing
        committed measurement, not a resemblance on a plot. The experiment
        re-measures it at four rungs rather than relying on the single point.
    observation_collision:
      observable: >-
        The single real number C, and the derived exponent alpha fitted to
        C(p).
      distinct_preimage_search: >-
        A COLLISION EXISTS AND IS THE HYPOTHESIS. Two distinct ground-truth
        models -- "C grows like p^{0.055} for EC-specific reasons" and "C grows
        like sqrt(log p) for reasons common to every B-subset of Z_N, with a
        constant EC offset" -- produce THE SAME OBSERVABLE over the entire
        measured range: the power law forced by a pure sqrt(log p) model over
        [1009, 100003] is alpha_equiv = 0.05543, against the published 0.055.
        They sit on OPPOSITE SIDES of the claimed conclusion (one says EC
        structure degrades with scale, the other says it does not) and the four
        committed points cannot separate them. THE SEPARATING CONDITION IS
        DIVISION BY THE MEASURED NULL, and it has never been applied.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable C fixed and vary the forgotten structure: replace
          the EC factor base by a random subset of the same size in Z_N. The
          intrinsic invariant proposed to distinguish them is the RATIO to the
          null, which is 1.00 by construction for the random object and about
          1.20 for the EC object.
        predicted_gain: >-
          Converts a contested exponent into an uncontested offset, and if the
          offset is real it is a cleaner statement of the lane's own claim than
          the lane currently has.
      - transform: baseline_as_boundary
        proposed_object: >-
          Enlarge the measured family from {EC factor base} to
          {EC factor base, random subset, planted arithmetic progression, graded
          interpolations between AP and random}, and require the instrument to
          reproduce the forced value at each boundary member before any interior
          reading is admitted.
        predicted_gain: >-
          A strict inward improvement rather than mere feasibility: the AP has
          forced C = sqrt(B) exactly and the random subset has forced
          C = sqrt(ln M + gamma_E), so the instrument is pinned at both ends of
          its range before the EC value is read.
    quantifier_order: >-
      WRITTEN OUT, because the lane's conclusion is stated in an order its data
      cannot support.
      THE LANE'S CLAIM, made explicit: THERE EXISTS alpha > 0 such that FOR ALL
      sufficiently large p, C_EC(p) >= c p^{alpha}, and in particular the ratio
      C_EC/C_random DIVERGES as p -> infinity. The divergence is a FOR ALL
      LARGE p statement and no finite set of four points below 50021 witnesses
      it.
      THIS RECORD'S CLAIM: FOR ALL p in the tested boundary {2^20, 2^22, 2^24,
      2^26}, R(p) in [1.10, 1.32] and the fitted |alpha_resid| < 0.020. This is
      an EXISTENTIAL-FREE, boundary-scoped statement and is not extended beyond
      the tested rungs. Crucially it does NOT claim FOR ALL p; a divergence
      beginning above 2^26 is entirely consistent with it, and any citation
      reading this as "the divergence does not exist" is reading the wrong
      quantifier.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that over the tested p-range the EC-specific residual growth
        exponent is below 0.02 for the mean and below 0.03 for the max once the
        measured null is divided out, and that the published exponents are
        numerically indistinguishable from the null's own growth over the range
        where they were fitted. IT CANNOT CERTIFY the asymptotic behaviour of C,
        cannot prove or disprove H-PSEUDO, cannot bound the Semaev yield error
        at crypto scale, and cannot establish that no EC-specific divergence
        exists at larger p. Writing it up as "the H-PSEUDO growth claim is
        refuted" would overstate it by a quantifier.
      nearby_object_control: >-
        THE NEAREST OBJECT WHERE THE HOPED-FOR CONCLUSION FAILS is the planted
        arithmetic progression in the DL domain, F = {DL = a + jd : j < B}. Its
        Fourier transform is a Dirichlet kernel with a spike of magnitude B, so
        C = sqrt(B) EXACTLY -- 22.6 at B = 512 against a null near 3.3, a ratio
        of about 7 rather than 1.2. If the instrument reports R near 1.2 THERE,
        it is insensitive to real structure and no reading of the EC arm means
        anything. Running the AP arm is a REQUIRED arm, not optional.
    proof_obligations:
      - claim: >-
          C_null(N) = sqrt(ln((N-1)/2) + gamma_E)(1+o(1)) for uniform random
          B-subsets, 1 << B << N.
        responsibility: correctness
      - claim: >-
          The planted AP has C = sqrt(B) exactly.
        responsibility: baseline
      - claim: >-
          The measured C uses the full k-range at every rung, with no partial
          maximum anywhere in the comparison.
        responsibility: interface
      - claim: >-
          The residual slope is reported with its interval and with the sample
          size and curve count per rung.
        responsibility: strictness
      - claim: >-
          The conclusion is scoped to bits <= 26 and does not claim an
          asymptotic behaviour.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. NO COMPLEXITY CLAIM OF ANY KIND. This is a MEASUREMENT
    AUDIT of an instrument whose readings condition a stated complexity ceiling.
    Nothing here makes any system easier to solve, moves any exponent, or adds
    any attack. Pollard rho remains the ECDLP baseline; sota_delta is zero on
    every attack axis; dominated_by is not applicable because no Pareto point is
    claimed. If anything the finding makes H-PSEUDO MORE plausible, not less,
    and that direction must be stated wherever it is cited.

  heuristic_assumptions:
    - id: HEUR-CN-1
      formal_statement: >-
        For F' a uniform random B-subset of Z_N with 1 << B << N, the values
        |hat{1_{F'}}(k)|^2/B over the (N-1)/2 conjugate-pair frequencies behave
        as i.i.d. Exponential(1), so
        E[max_k |hat{1_{F'}}(k)|]/sqrt(B) = sqrt(ln((N-1)/2) + gamma_E)(1+o(1)).
      random_model_justification: >-
        Marginal: the complex CLT for a sum of B unit vectors at equidistributed
        phases gives Exponential(1) at each fixed k != 0, with
        E|S(k)|^2 = B(1 - (B-1)/(N-1)). JOINT INDEPENDENCE ACROSS FREQUENCIES IS
        NOT PROVED and is the approximation; the pairwise covariance is O(B/N)
        and vanishes in the stated regime, but that is a heuristic for the
        MAXIMUM, not a theorem about it. Stated as a heuristic for exactly that
        reason.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-1ed445]
      falsification_condition: >-
        MEASURED FIRST, AND REPORTED BEFORE ANY EC READING. If measured C_null
        departs from the derived value by more than 5 per cent at any rung, the
        derivation is wrong, the headline arithmetic in this record rests on it,
        and the record is withdrawn by a superseding correction. Existing
        evidence: derived 2.6076 against DEC-20260804-7af513's measured 2.57 at
        p = 1009, error 1.46 per cent.
    - id: HEUR-CN-2
      formal_statement: >-
        THE WEAKEST LINK. The EC-specific content of C factors multiplicatively:
        C_EC(p) = C_null(p) * R(p) with R varying slowly, rather than additively
        as C_EC = C_null + delta(p).
      random_model_justification: >-
        NOT PROVED. A multiplicative decomposition is natural for an
        extreme-value statistic (both arms are maxima of the same functional
        form) and is supported by the observation that dividing by the null
        removes 92 per cent of the fitted exponent for the mean and 78 per cent
        for the max. But it is a MODELLING CHOICE and the additive decomposition
        gives a different residual. Choosing one and reporting only it would be
        the same error the lane made in choosing a power law.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-1ed445]
      falsification_condition: >-
        Report R = C_EC/C_null and delta = C_EC - C_null side by side at every
        rung with the slope of each. IF THE TWO DECOMPOSITIONS DISAGREE ABOUT
        WHETHER THE RESIDUAL GROWS, SAY SO AND DO NOT PICK -- that disagreement
        is itself the finding, and it means the data does not determine the
        decomposition any more than it determined the growth law.

  structural_ingredients:
    - description: >-
        Extreme-value law for the maximum of normalised Fourier coefficients of
        a random subset of Z_N (Exponential(1) marginals, Gumbel maximum).
      citation: >-
        NOT RETRIEVED. NO SOURCE WAS OPENED FOR THIS RECORD. The law was derived
        here from the complex CLT and the exponential maximum, and its numerical
        consequence was checked against the single committed null measurement in
        the corpus. RECALLED, UNVERIFIED as to any named theorem; it is a
        CANDIDATE TO TEST and the experiment tests it by measurement rather than
        assuming it.
      role: supplies the forced null value that the whole comparison rests on
    - description: >-
        Dirichlet-kernel spike of an arithmetic progression, giving C = sqrt(B)
        exactly for the planted positive control.
      citation: Elementary; derived in this record.
      role: pins the top end of the instrument's dynamic range
    - description: >-
        The committed H-PSEUDO measurement tables.
      citation: >-
        knowledge/findings/KN-FIND-d4f820.md (mean C at p = 1009, 4001, 9001,
        50021) and knowledge/findings/KN-FIND-4c9e71.md (adversarial max C at
        the same four primes, with its own in-body BATCH-107 correction). BOTH
        READ IN FULL. Both have superseded_by: null.
      role: the data the audit re-reads without re-deriving

  reduction_chain:
    core_problem: >-
      Determine whether the measured p-growth of the H-PSEUDO character-sum
      constant is EC-specific or is the growth of the extreme-value law common
      to every B-subset of Z_N of the same size.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. Nothing here reduces to a statement about H-PSEUDO's
      truth, about the Semaev yield error at crypto scale, or about the
      conditional ceiling exp(c sqrt(log N log log N)). Those conditionals
      inherit whatever the growth law is; this record says the four committed
      points do not determine it, which is a statement about the evidence, not
      about the mathematics. KN-OPEN entries concerning H-PSEUDO are NOT closed,
      narrowed or advanced by a measurement at bits <= 26.

  predictions:
    - metric: >-
        G1 (gate, cheapest) -- measured C_null at each rung versus the derived
        sqrt(ln((N-1)/2) + gamma_E), over >= 200 random B-subsets per rung
      direction: different
      minimum_effect: >-
        'Relative error below 0.05 at EVERY rung. Existing datum: derived
        2.6076 against 2.57 measured (DEC-20260804-7af513), 1.46 per cent. IF
        G1 FAILS, THE INSTRUMENT OR THE DERIVATION IS WRONG AND NO EC READING IS
        ADMISSIBLE.'
    - metric: >-
        G2 (positive control, must fire) -- C on the planted arithmetic
