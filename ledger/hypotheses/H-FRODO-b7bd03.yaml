hypothesis:
  id: H-FRODO-b7bd03
  question_id: RQ-FRODO-3260cc
  derived_from_idea: IDEA-20260821-b19e5e
  added: '2026-08-25'
  statement: >-
    A divergence is a functional of TWO arguments, and this lane has audited only the first. The
    hypothesis has four parts, each separately checkable.
    (A) THE RE-REPRESENTATION. The sampler's output law is not a table of integers but the PUSHFORWARD
    of the uniform measure on the sampler's 16-bit input space under the literal pseudocode, and it is
    computable by COMPLETE ENUMERATION of all 65536 inputs rather than by reading a table as a
    cumulative distribution. That representation fixes, with no reading of intent, three things a
    table cannot - which side of each comparison boundary is included, that the sign bit is consumed
    and wasted on a zero magnitude, and hence that the probability mass at zero carries an ODD
    numerator over 2^15 rather than an even one.
    (B) THE ARITHMETIC THIS PREDICTS. Under the strict-inequality plus wasted-sign-bit reading, the
    numerator of the mass at zero over the common denominator is twice the first table entry PLUS
    TWO, and each nonzero magnitude's numerator is the successive difference of table entries. The
    prediction is EXACT and a single unit of disagreement refutes it. The parent proposal reports a
    hand reconciliation matching an extraction-damaged published row term for term; that is HAND
    ARITHMETIC by the proposing agent, is NOT a run record, and must be re-derived by machine before
    anything cites it.
    (C) THE IDEAL IS UNDER-SPECIFIED BY FIVE INDEPENDENT CONVENTION FORKS - rounded versus discrete
    Gaussian; the parameter convention under which the subscript is read; untruncated versus truncated
    versus truncated-and-renormalised; which DIRECTION of an asymmetric divergence; and which quantity
    is printed. Their product is a finite grid of 96 candidate readings. TWO DISJOINT SUBSETS HAVE
    FORCED VALUES DERIVED IN ADVANCE - the cells that are simultaneously in the reversed direction AND
    untruncated return positive infinity for every order above 1, because there the ideal places mass
    where the sampler places none; and the remaining reversed-direction cells, being truncated, return
    a FINITE value, because truncation places the ideal's support inside the sampler's and the sampler
    is strictly positive at every one of its support points. The two forced subsets detect OPPOSITE
    defects - a hidden truncation of the ideal, and a support mismatch - and neither arm can see the
    other's defect.
    (D) THE ORACLE AND ITS THREE OUTCOMES, ALL OF WHICH ARE RESULTS. Evaluating the non-forced cells
    at the published orders for all three parameter sets and comparing against the three published
    figures gives exactly one of - a unique surviving cell, so the convention is DETERMINED; no
    surviving cell, so either the enumeration of conventions is incomplete or there is a discrepancy,
    quantified per cell; or several surviving cells, so three printed significant figures do not
    determine the convention, and the deliverable is the surviving SET plus a statement of which
    conventions the published precision cannot separate.
    (E) A CORRECTION OWED TO THE LANE'S OWN METHOD. Every candidate ideal involves an exponential or a
    Gaussian cumulative function, so the divergence is TRANSCENDENTAL and no rational number equals
    it. A mandate of exact rational arithmetic is unachievable for this quantity; the correct
    instrument is a CERTIFIED ENCLOSURE - a rigorous interval whose endpoints are rationals from a
    convergent series with a proved remainder - and the deliverable is an interval plus a proof of its
    width.
    NO ATTACK, NO BREAK, NO EXPONENT, NO STATEMENT ABOUT LATTICE HARDNESS. A convention ambiguity in a
    document is a documentation finding, and a discrepancy, if found, is a documentation or analysis
    defect until it is costed, which this record does not do.
  mechanism: >-
    The sampler's input space is finite and small, so its output law can be obtained by exhaustion
    rather than inference - which removes every table-reading degree of freedom from the first
    argument of the divergence and forces all remaining ambiguity onto the second. The second argument
    is then attacked as a finite grid, because each of the five forks is a discrete choice with a
    small number of values, and each cell is a microsecond of arithmetic. The three published figures
    at three different widths and three different supports OVERDETERMINE an 80-cell candidate space, so
    a convention that is right for one parameter set and wrong for the others cannot survive
    simultaneous consistency - which is why the oracle requires simultaneity across parameter sets and
    why reporting a single best cell would convert a set-valued answer into a false determination.
    The asymmetry that makes two forks separable rather than redundant is a support argument. In the
    forward direction the sampler vanishes outside its support and those terms contribute nothing, so
    the value is a finite sum in all three truncation settings. In the reversed direction the value is
    infinite exactly when the ideal places mass where the sampler places none, which happens only in
    the untruncated setting. The asymmetry is therefore a JOINT property of the truncation and
    direction forks, not of direction alone.
  assumptions:
    - >-
      The sampler pseudocode used is transcribed from the FILED primary specification, not from a
      draft view or a summariser's extraction. The parent proposal's own source is a fetch whose table
      was visibly truncated and whose content is a summariser's extraction; the lane's source gate
      makes filing the primary text a precondition and it is not optional.
    - >-
      The hand arithmetic in part (B), and the derivation of the two forced-value subsets, are HAND
      DERIVATIONS by the proposing agent. They are algebra, not measurements. The executor must
      re-derive them mechanically before either is read, and no evidence record may cite the hand
      arithmetic as a measurement.
    - >-
      The published order and divergence pairs are research targets carried from this repository's own
      question record and corroborated only by a search summary. If the filed text differs, the
      oracle's target values change and the grid is re-read.
    - >-
      The candidate list of 96 cells is a claim about which conventions are PLAUSIBLE, not a proof
      that no other convention exists. If no cell reproduces, the FIRST hypothesis to test is that the
      list is incomplete, not that the document is wrong.
    - >-
      Every candidate ideal's enclosure has a PROVED remainder bound, so the returned interval provably
      contains the true value. The heuristic content is only that the implementation realises the
      bound it claims, and that is checked by recomputation at two truncation indices and at higher
      precision.
  test_boundary:
    instances: >-
      The three standardized parameter sets of the scheme, as filed, at the published divergence
      orders. No toy scale exists here and none is used - the sampler's input space is exhausted and
      the supports have at most a few dozen points.
    parameters: >-
      All 65536 sampler inputs per parameter set; the 96-cell convention grid; the published order per
      parameter set; a two-point closed-form family for the null arm at at least six parameter
      combinations including the largest published order; a five-point perturbation ladder with at
      least three interior points.
    implementation: >-
      Exact rational arithmetic on the sampler side; certified enclosures with proved remainder bounds
      on the ideal side; enclosure widths recorded at every step and reported BEFORE any comparison.
    out_of_scope: >-
      Any attack; any statement about lattice hardness at the scheme's dimensions; the failure-rate
      side of the audit, whose ingredients are rational and which is a different quantity; and costing
      any discrepancy found, which this record explicitly does not do.
  distinguishable_outcomes:
    - outcome: >-
        The exhaustive enumeration reproduces the analytically derived numerators exactly, including
        the predicted mass at zero; the closed-form null reproduces its known values at every tested
        combination including the largest order; the two forced-value subsets return exactly as
        derived, with the executor's mechanical recount of every axis count matching the record's; the
        enclosure widths are below the printed precision; and EXACTLY ONE cell survives simultaneous
        consistency across all three parameter sets.
      means: >-
        The convention is DETERMINED and the arithmetic claim is earned at the tier the program calls
        an arithmetic claim. Every downstream number in this lane can now name the ideal it is a
        divergence against.
    - outcome: >-
        Everything above holds except that SEVERAL cells survive.
      means: >-
        Three printed significant figures do not determine the convention. The deliverable is the
        surviving SET, plus a statement of which conventions the published precision cannot separate
        and what precision would separate them. NO convention determination is reported, and reporting
        a best cell would be a false determination.
    - outcome: >-
        NO cell reproduces all three figures.
      means: >-
        Either the enumeration of conventions is INCOMPLETE - which is the first hypothesis and is
        tested by widening the grid along a named sixth axis - or there is a discrepancy, which is then
        quantified per cell and reported as a documentation or analysis defect, never as an attack.
    - outcome: >-
        The enumeration disagrees with the analytic numerators, or the mass at zero is not the
        predicted value.
      means: >-
        A boundary convention is misread, and the index at which they diverge localises it. The
        strict-inequality plus wasted-sign-bit reading is refuted and the hand derivation is withdrawn.
    - outcome: >-
        Any cell in the forced-infinite subset returns a finite value.
      means: >-
        HIDDEN TRUNCATION of the ideal. The grid is void until fixed. This is one of the two opposite
        defects, and the other arm cannot see it.
    - outcome: >-
        Any cell in the forced-finite subset returns infinity.
      means: >-
        SUPPORT MISMATCH - the ideal's support has been placed outside the sampler's, or a sampler
        support point has been assigned zero mass. The grid is void until fixed. This is the mirror
        defect, and the forced-infinite arm cannot see it.
    - outcome: >-
        The enclosure widths exceed the printed precision.
      means: >-
        The instrument cannot read the oracle at the published precision. NO surviving set may be
        reported, and the deliverable shrinks to the enclosure widths themselves, which is still a
        usable obstruction with a number.
    - outcome: >-
        The perturbation that moves one unit of mass off the zero point DECREASES the divergence of
        the winning cell.
      means: >-
        Local optimality of the published table is refuted at that perturbation, or the winning cell
        contains a bug. Either way it is a substantive finding and is reported as one.
    - outcome: >-
        The executor's mechanical recount of the grid's axis counts disagrees with the record's.
      means: >-
        HALT. The parent record was repaired once for exactly this failure - a forced value mis-derived
        by treating an axis product as non-interacting - and the recount is a gate rather than a
        formality.
