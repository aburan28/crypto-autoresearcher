  falsification_conditions:
    - The exhaustive enumeration disagrees with the analytic numerators at any support point.
    - The mass at zero is not the predicted numerator; the reading is refuted and the hand derivation withdrawn.
    - No cell reproduces all three published figures.
    - More than one cell reproduces all three, so the oracle is not discriminating at the printed precision.
    - Any forced-infinite cell returns a finite value; hidden truncation of the ideal.
    - Any forced-finite cell returns infinity; support mismatch.
    - Enclosure widths exceed the printed precision; the oracle cannot be read.
    - The mass-moving perturbation decreases the divergence of the winning cell.
    - The executor's mechanical recount of the axis counts disagrees with this record's counts.
  interpretation_limits:
    - >-
      NO ATTACK, NO BREAK, NO EXPONENT, NO STATEMENT ABOUT LATTICE HARDNESS. Determining a convention
      is a documentation result at the tier the program calls an arithmetic claim.
    - >-
      A determined convention says what is CONSISTENT with the printed figures, never what the
      designers computed. The set-valued deliverable is the honest form of that limit.
    - >-
      Everything is scoped to the three standardized parameter sets, the published orders, and the 96
      enumerated conventions, of which only the non-forced subset are oracle candidates. A convention
      outside the grid is not spoken for.
    - >-
      The correction to the lane's method statement is about the method, not about anyone's
      competence, and it does not imply any published figure is wrong.
    - >-
      Novelty is UNVERIFIED. The primary specification was not read by the proposing session, and the
      standard results used - the divergence and its probability-preservation property, certified
      enclosures of the Gaussian cumulative function - are quoted rather than claimed.
