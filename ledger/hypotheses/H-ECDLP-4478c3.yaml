hypothesis:
  id: H-ECDLP-4478c3
  area: ECDLP
  question_id: RQ-ECDLP-001
  goal_id: GOAL-ECDLP-001
  source_proposal: IDEA-20260815-bd3fae
  proposal_id: IDEA-20260815-bd3fae
  title: >
    Stage 0 S_3 foundation reachability
    inventory — commit and metric
    fields exist — before any re-run
  status: specified
  proposed_by: idea-generator
  designed_by: coordinator
  designed_under_task: TASK-20260913-17edae
  specified_by: DEC-20260913-7b2241
  specified_at: '2026-09-13'
  created: '2026-09-13'
  updated: '2026-09-13'
  depends_on:
    - IDEA-20260815-bd3fae
    - RQ-ECDLP-001
  related_hypotheses: []
  statement: >
    Fix the reachability inventory of
    the original S_3 toy measurement
    before any independent re-run.
    Stage 0 asserts only that a named
    frozen contract path exists in
    this checkout, that a commit SHA
    named by that contract or its run
    records is well-formed hex, and
    that a required metric-field list
    is nonempty. A nearby claim that
    reproduction is already complete
    without a field-by-field compare
    is rejected. A nonexistent path
    is the matched null and must be
    reported unreachable. This is not
    a Semaev solve and not a
    reproduction result. Stages 1+
    stay unauthorized.
  mechanism: >
    IDEA-20260815-bd3fae asks to re-run
    the original S_3 measurement from
    a clean checkout. Stage 0 freezes
    the cheap reachability gate: if
    the contract or commit is not
    here, the foundation is
    unreproducible and that is the
    finding, without inventing a
    re-run. No S_3 polynomial is
    formed. No seed is executed.
  predictions:
    - id: P-S0-S3REACH
      metric: reachability inventory
      direction: different
      minimum_effect: >
        After fixture_pass, REAL
        reports whether the named
        contract path exists and
        whether a commit field is
        well-formed hex, and lists
        nonempty required metric
        fields. KF
        already-reproduced-without-
        compare is rejected. NULL
        nonexistent path is
        unreachable.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KF
      statement: >
        After fixture_pass, KF claim
        that reproduction is already
        complete without compare is
        accepted.
    - id: F-S0-REAL
      statement: >
        After fixture_pass, REAL
        reports a nonexistent path as
        reachable or an ill-formed
        commit as well-formed.
  test_boundary:
    instances:
      - frozen Stage 0 REAL / KF / NULL reachability panel
    parameters:
      real_inventory:
        contract_candidates:
          - experiments/EXP-SDEG-001/specification.yaml
          - experiments/EXP-ECDLP-S3-001/specification.yaml
          - experiments/EXP-S3-001/specification.yaml
        must_report_exists_or_missing_exactly: true
        must_list_metric_fields: true
      known_false:
        kind: already_reproduced_without_compare
        must_reject: true
      matched_null:
        kind: nonexistent_path
        path: experiments/EXP-DOES-NOT-EXIST/specification.yaml
        must_unreachable: true
      stage0_only_at_specify: true
    implementation: EXP-ECDLP-5dc2f0 Stage 0 runner
    budget:
      wall_clock_seconds: 120
    prose: >
      Path and hex-format inventory
      only. Stage 0 does not re-run
      S_3, does not form a Semaev
      polynomial, and does not
      compare metric values.
  assumptions:
    - id: A1
      statement: >
        Stage 0 inspects declared
        candidate paths in this
        checkout. It does not
        execute the original
        measurement.
      status: explicit
    - id: A2
      statement: >
        Standing user authorization
        2026-09-06 covers protocol
        approval once the contract is
        complete.
      status: explicit
  heuristic_assumptions: []
  proof_search_map:
    bottleneck: >
      Whether the inventory reports
      existence exactly and rejects
      a no-compare reproduction claim.
    baseline_embedding:
      parameter_slice: >
        REAL candidate paths, KF
        already-reproduced, NULL
        nonexistent path.
      reproduction_check: >
        Existence reported exactly.
        KF rejected. NULL unreachable.
    observation_collision:
      observable: path exists versus reproduction-complete
      distinct_preimage_search: >
        Hold the checkout and claim
        already-reproduced (KF). Hold
        the checkout and name a
        missing path (NULL).
    constructive_transforms:
      - transform: baseline_reproduction
        proposed_object: Frozen reachability inventory.
        predicted_gain: >
          Exact known-false reject on
          KF. Zero reproduction claim.
    quantifier_order: >
      Freeze the candidate paths
      before reading existence.
      Reachability is not a
      field-by-field reproduction.
    method_ceiling:
      strongest_certifiable_claim: >
        Instrument reproduction on
        the inventory. Never an S_3
        metric match. Never an ECDLP
        exponent.
      nearby_object_control: >
        NULL is a nonexistent path.
        An argument that still calls
        it reachable is
        proves-too-much.
  knowledge_promotion:
    promoted: []
    not_warranted: Stage 0 design only. Nothing to promote.
  scientific_boundary: >
    Stage 0 P-S0-S3REACH only. Not
    Semaev S_3. Not a reproduction
    result. Not a rho beat. No
    Stage 1 of EXP-ECDLP-5dc2f0.
