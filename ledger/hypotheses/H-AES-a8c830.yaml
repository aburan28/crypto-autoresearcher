hypothesis:
  id: H-AES-a8c830
  question_id: RQ-AES-003
  derived_from_idea: IDEA-20260805-72ec9a
  status: proposed
  added: '2026-08-25'

  statement: >-
    SCOPE. Reduced-round AES-128 at r = 3 to 7 on the execution machine, in the CM-3 unit
    of one r-round AES-k encryption of one block with the key-schedule treatment declared.
    CLAIM TIER toy, reduced-round only. NO ATTACK, NO MARGIN CLAIMED AGAINST ANY
    REFERENCE, NO STATEMENT ABOUT FULL-ROUND OR DEPLOYED AES, AND NO COMPARISON TO THE
    PUBLISHED FRONTIER IN EITHER DIRECTION.

    THE HYPOTHESIS, IN FOUR PARTS.
    (A1) THE CONSTANT IS MEASURABLE AND FREEZABLE. A conversion constant
      T(r, k, cfg) - encryptions per second under a declared configuration cfg of thread
      count, key-schedule treatment and engine - can be measured on this machine for
      r = 3 to 7 with measured peak RSS beside it, and frozen before any candidate cost is
      measured under it.
    (A2) THE TWO COMMITTED FIGURES ARE RECONCILABLE, OR ONE DESCRIBES AN UNRECORDED
      CONFIGURATION. This campaign's record carries two throughput values a factor of about
      4.43 apart - which is 2.15 bits - and no committed artifact reconciles them. The
      re-measured ratio is explained by (thread count) x (round-count ratio) x
      (key-schedule treatment) to within 20 percent, OR one committed figure describes a
      configuration nobody recorded, which is a correction-level finding about a constant
      used program-wide under this goal.
    (A3) THE BASELINE IS A CURVE, NOT A POINT, AND IT YIELDS A FRONTIER. With h the number
      of key bits a construction is handed, the generic alternative is
      B(h, r, k) = 2^(k-1-h) / T(r, k, cfg) seconds in the average-case convention, and the
      DOMINATION FRONTIER is h* = k - 1 - log2(1600 T). Predicted 88 <= h* <= 91 for
      k = 128 and r in 3..7.
    (A4) THE CURVE REPRODUCES THE CAMPAIGN'S OWN COMMITTED ENDPOINTS AND VERDICTS. At
      h = 0 it must return the definitional REF-A figure; at h = 128 it must return one
      encryption; and on the campaign's committed hinted mode at h = 96 it must return
      DOMINATED, with B(96) in the bracket the two committed throughput figures imply. A
      framework that returns a margin there contradicts a committed measured comparison and
      is wrong.

    THIS IS INFRASTRUCTURE AND THE GOAL RECORD SAYS SO. A measured throughput receipt does
    not complete this goal. It is proposed because the generic-baseline criterion is
    unreachable without it, not because it is a result, and every record built on it must
    repeat that sentence.

  mechanism: >-
    A margin is a ratio between a candidate's cost and a baseline's, and both sides must be
    in one unit under one convention or the ratio is meaningless. THE UNIT IS FIXED BY THE
    CAMPAIGN'S OWN COST MODEL - one r-round AES-k encryption of one block - and the
    conversion from attack work to seconds must be MEASURED, not assumed, or the comparison
    is void by that model's own wording.
    STEP 1, THE DEFINITION THAT DOES NOT CHANGE WITH r. The definitional reference is
    2^(k-1) r-round encryptions, because reducing the round count reduces the cost of one
    trial and NOT the number of trials. A construction handed h bits faces a residual of
    k - h bits, so the generic alternative is 2^(k-1-h) r-round encryptions in the
    average-case convention, and 2^(k-h) in the worst case. One convention is adopted and
    applied on BOTH sides.
    STEP 2, THE MEASURED INPUT. T(r, k, cfg) in encryptions per second is the ONLY measured
    input to the curve, and it is exactly the quantity this campaign has not frozen.
    STEP 3, THE FRONTIER. B(h) fits inside one producer task of 1600 seconds exactly when
    2^(k-1-h)/T <= 1600, i.e. h >= h* = k - 1 - log2(1600 T). FOR ANY CONSTRUCTION WITH
    h >= h*, the trivial baseline completes inside one producer task and the best achievable
    margin is bounded by 1600 seconds divided by the candidate's runtime - a ceiling with
    nothing to do with cryptanalysis. That is why the frontier is proposed as a
    PRE-DISPATCH GATE rather than as a result.
    STEP 4, WHERE THE CURVE IS MEASURED AND WHERE IT IS MODELLED, STATED BEFORE ANYONE IS
    TEMPTED TO BLUR IT. B(h) is RUNNABLE TO COMPLETION only above roughly h* - 4, because
    below that the residual exceeds the producer task's measured envelope. Below it, the
    figure is a MEASURED CONVERSION applied to a DERIVED COUNT - which the cost model
    permits and explicitly distinguishes from a measured end-to-end cost, and which caps a
    modelled cost claim below the top tier. ANY MARGIN AT SMALL h INHERITS THAT CAP AND
    MUST SAY SO IN THE SAME SENTENCE.
    STEP 5, THE PARETO BOOKKEEPING TIME ALONE MISSES. The comparison is across time, memory,
    data and success probability. The baseline needs about two known plaintext-ciphertext
    pairs and negligible memory; the campaign's hinted construction needs 2^33 chosen
    plaintexts and a candidate bitmap plus parity tables. Adding query cost makes the
    domination LARGER, not smaller. The curve must therefore be published as a tuple at
    every h, or it repeats the time-only error a red team is required to attack.

  assumptions:
    - >-
      That the cost-model unit is one r-round AES-k encryption of one block with the
      key-schedule treatment declared. If the committed model fixes something else, the curve
      is rebuilt in that unit and the structure is unchanged.
    - >-
      That the average-case convention 2^(k-1) is the declared one. If the worst case is
      declared instead, every figure doubles on BOTH sides and h* falls by exactly 1 bit.
    - >-
      That a hint of h bits leaves a residual of exactly k - h bits. TRUE for this
      campaign's constructions, which are handed round-key BYTES; NOT true in general - a
      hint on an intermediate state or a partial round key can constrain the master key
      non-bijectively, and it fails for AES-192/256 where a single 128-bit round key does not
      determine the master key. Any future construction must DECLARE its residual size, and
      the gate must ask for the residual rather than the byte count.

  proof_search_map:
    bottleneck: >-
      The conversion constant T. It appears in every cost sentence this campaign can write,
      the cost model REQUIRES it to be measured and frozen, it is not frozen, and the record
      carries two values 4.43 apart. Every downstream figure - reference margins, the
      frontier h*, the producer-reach figure - is scaled by it.
    baseline_embedding:
      parameter_slice: >-
        h = 0 reproduces the definitional reference exactly: B(0, r, 128) = 2^127 r-round
        encryptions, which needs no document. h = 128 must return one encryption. The curve
        therefore contains the campaign's own endpoints as slices rather than approximating
        them.
      reproduction_check: >-
        Exact arithmetic against two committed endpoints - the seconds figure at h = 0 under
        the higher committed throughput, and the roughly 25 seconds recorded for exhaustive
        search over the same residual at h = 96 - not a resemblance. Both are quoted figures
        in committed records and both are reproduced or the curve is not frozen.
    observation_collision:
      observable: the measured seconds of a construction
      distinct_preimage_search: >-
        A COLLISION IS ALREADY ON THE RECORD AND IS THE REASON THE CURVE IS NEEDED. Two of
        this campaign's own constructions sit within a factor of three of each other in
        measured seconds, yet one beats its reference by about 28 orders of magnitude and the
        other LOSES to its reference. MEASURED SECONDS DOES NOT IDENTIFY THE VERDICT; the
        pair (h, seconds) does. Any record reporting seconds without h is reporting a quantity
        that does not determine what it is used to determine.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A problem-specific resource measure - the pair (h, cost in the cost-model unit) -
          realised by measuring T once per (r, k, cfg), with charges added only over DISJOINT
          blocks: encryption work, verification work, table build, and query transport, each
          charged once and named.
        predicted_gain: >-
          Every future construction gets its verdict against the generic baseline computed
          BEFORE it is dispatched, at zero compute, from one integer. No attacker gain of any
          kind.
      - transform: observable_fiber
        proposed_object: >-
          Hold measured seconds fixed and vary h, exhibiting two constructions in the same
          fibre with opposite verdicts.
        predicted_gain: >-
          A disqualification rule for any cost report that omits h, available at zero compute
          from records already committed.
    quantifier_order: >-
      CLAIMED. THERE EXISTS a frozen conversion constant T(r, k, cfg), measured once and
      committed, such that FOR ALL h in the declared range the baseline cost is
      2^(k-1-h)/T seconds. THE WITNESS T MAY DEPEND ON (r, k, cfg) AND ON NOTHING ELSE - in
      particular not on the construction being compared, which is exactly the dependence
      that would let a baseline be tuned to manufacture a margin. The FORBIDDEN weaker order
      - FOR ALL constructions THERE EXISTS a baseline cost - is what an ad-hoc
      after-the-fact comparison instantiates, and the campaign's criterion exists to forbid
      it.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: a frozen, measured, machine-specific conversion constant and a derived
        baseline curve with the measured/modelled boundary marked. IT CANNOT CERTIFY that
        any construction beats any baseline - that requires a construction - and by the
        question record's own ruling it is INFRASTRUCTURE and does not complete this goal.
      nearby_object_control: >-
        The campaign's own committed hinted mode at h = 96, where the hoped-for conclusion
        (a margin) MUST FAIL because the domination is independently measured and committed.
        Running the curve against it is the required negative control and it must fail to
        produce a margin.
    proof_obligations:
      - claim: B(0, r, 128) equals 2^127 r-round encryptions, reproducing the definitional reference.
        responsibility: baseline
      - claim: >-
          h* = k - 1 - log2(1600 T), landing in [88, 91] for k = 128 and r in 3..7.
        responsibility: correctness
      - claim: The hinted mode's h is READ from the committed source, not inferred from a byte count.
        responsibility: interface
      - claim: T is measured under a declared cfg and hash-committed BEFORE any candidate cost.
        responsibility: strictness
      - claim: The measured/modelled boundary of B(h) is marked at every h.
        responsibility: scope
      - claim: Peak RSS and query counts are measured, not modelled, on both sides.
        responsibility: memory

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Explicitly null and this is not an attack. The exponent this hypothesis makes LEGIBLE is
    the baseline's, k - 1 - h in r-round encryptions. Its contribution to exponent-first work
    is negative in the useful direction: it tells the campaign, before dispatch, that any
    construction with h at or above about 88 bits is competing against an exponent of at most
    39, which one producer task exhausts. THE DESIGN CONSEQUENCE IS THE DELIVERABLE - hunt
    constructions with h below about 87, or expect domination.

  heuristic_assumptions:
    - id: HEUR-AES-B1
      formal_statement: >-
        The cost of exhaustive search over an h-bit-hinted residual is 2^(k-1-h) r-round
        encryptions plus O(1) verification - that is, the search loop is
        ENCRYPTION-DOMINATED and the per-trial overhead is negligible.
      random_model_justification: >-
        NOT A THEOREM AND NOT DISTRIBUTIONAL: it is an implementation property, and a badly
        written loop can be overhead-dominated by an order of magnitude. It is stated
        formally so it can be MEASURED rather than assumed.
      supporting_results: []
      validation_experiment_ids: [EXP-AES-8e2e73]
      falsification_condition: >-
        Measured ratios outside [12, 20] between consecutive graded points at
        h = 104, 100, 96 whose forced ratios are exactly 16, or the no-op sibling loop costing
        more than 20 percent of the real loop.
    - id: HEUR-AES-B2
      formal_statement: >-
        A hint of h key bits leaves a residual of exactly 2^(k-h) master keys.
      random_model_justification: >-
        True when the hint is a set of independent round-key bytes pulling back bijectively to
        master-key bits, which holds for AES-128's key schedule but NOT in general and NOT for
        AES-192/256, where a single 128-bit round key does not determine the master key.
        Stated because a future construction hinting an intermediate state would violate it
        silently.
      supporting_results: []
      validation_experiment_ids: [EXP-AES-8e2e73]
      falsification_condition: >-
        Any construction whose residual, COUNTED from the key schedule rather than inferred
        from the byte count, differs from 2^(k-h). The curve must then be indexed by the
        residual, not by h, and every placement is recomputed.

  predictions:
    - metric: >-
        reconciliation of the two committed throughput figures - the re-measured ratio
        T(cfg_A)/T(cfg_B) once both configurations are identified and re-measured on this
        machine
      direction: different
      minimum_effect: >-
        The committed ratio is 4.43. PRE-REGISTERED: the re-measured ratio is explained by
        (thread count) x (round-count ratio) x (key-schedule treatment) to within 20 percent.
        If it is not, one committed figure describes a configuration nobody recorded, and that
        is a correction-record-level finding about a constant used program-wide.
    - metric: >-
        measured single-core throughput T(r, 128) for r = 3, 4, 5, 6, 7, key schedule
        amortised, on the pinned harness and separately on the hardware-accelerated path
      direction: different
      minimum_effect: >-
        FORCED SHAPE: T(r) monotone DECREASING in r and approximately proportional to 1/r once
        fixed per-block overhead is subtracted, so T(3)/T(7) lies in [1.6, 2.6]. A T(r) flat or
        non-monotone in r means the measurement is dominated by loop overhead rather than by
        the cipher and the constant is NOT usable.
    - metric: h*, the hint budget at which B(h) equals 1600 seconds, computed from the frozen T
      direction: different
      minimum_effect: >-
        PREDICTED 88 <= h* <= 91 for k = 128 and r in 3..7. Outside that bracket, the frozen T
        differs from both committed figures by more than a factor of 4 and must be explained
        before use.
    - metric: verdict of the curve on the campaign's committed hinted mode at h = 96
      direction: different
      minimum_effect: >-
        MUST RETURN DOMINATED, with B(96) in the bracket the two committed throughput figures
        imply. A margin there contradicts a committed measured comparison and the framework is
        wrong.
    - metric: measured peak RSS of the baseline implementation and of the hinted construction, side by side in one unit
      direction: different
      minimum_effect: >-
        Both MEASURED, neither modelled. FORCED EXPECTATION: the baseline below 16 MiB - it
        holds two pairs and a key schedule - against a construction holding a bitmap plus
        parity tables. A baseline above 100 MiB carries uncharged state and must be rebuilt.
    - metric: >-
        agreement between the measured baseline run at h in {96, 100, 104} and the derived
        B(h) at the same h
      direction: lower
      minimum_effect: >-
        Within the measured timing variance. A disagreement means the conversion constant does
        not convert, which is the cost model's own requirement unmet.

  test_boundary:
    instances: >-
      The pinned harness AES-128 implementation and the hardware-accelerated path, measured
      separately and labelled; a purpose-built exhaustive-search baseline over an h-bit-hinted
      residual, tuned in good faith; a no-op sibling loop of identical call structure; and the
      campaign's committed constructions placed on the curve by their READ h.
    parameters:
      rounds: [3, 4, 5, 6, 7]
      k: 128
      threads: [1, 4]
      key_schedule_treatment: [amortised, charged_per_trial]
      engines: [pinned_pure_python_harness, hardware_accelerated_path]
      runnable_h: [96, 100, 104]
      null_h: 128
      producer_task_seconds: 1600
      convention: average case, 2^(k-1-h), applied on BOTH sides
    implementation: >-
      Measurement on the execution machine only, no external dependency. Peak RSS measured by
      the harness at every point. The baseline is a runnable artifact, hash-committed together
      with the T table BEFORE any candidate cost is measured under it.
    budget:
      wall_clock_seconds: 5400
      total_cpu_hours: 6.0
      memory_gb: 8
      maximum_runs: 30

  distinguishable_outcomes:
    - outcome: >-
        CONSTANT FROZEN AND CURVE VALIDATED. T measured for r = 3..7 at both thread counts and
        both key-schedule treatments with peak RSS; h* in [88, 91]; the measured baseline at
        h in {96, 100, 104} agreeing with the derived B(h) within variance; graded ratios at
        16x; the h = 128 null returning verification cost alone; and the curve returning
        DOMINATED on the committed hinted mode.
      what_observing_it_would_mean: >-
        (A1), (A3) and (A4) hold. The campaign has a frozen, measured, machine-specific
        conversion constant and a baseline curve committed BEFORE any candidate is costed,
        which is the difference the campaign's own criterion draws between an admissible and an
        inadmissible comparison. IT IS INFRASTRUCTURE AND COMPLETES NO CRITERION BY ITSELF.
    - outcome: >-
        THE TWO COMMITTED FIGURES RECONCILE CLEANLY within 20 percent as threads x rounds x
        key-schedule treatment.
      what_observing_it_would_mean: >-
        (A2) holds in its first branch. The 2.15-bit ambiguity that has scaled every cost
        sentence under this goal is closed, and the closing artifact is a measurement rather
        than an argument.
    - outcome: >-
        THE TWO COMMITTED FIGURES DO NOT RECONCILE. The re-measured ratio is not explained by
        the three factors within 20 percent.
      what_observing_it_would_mean: >-
        (A2) holds in its SECOND branch: one committed figure describes a configuration that
        was never recorded. That is a correction-record-level finding about a constant used
        program-wide under this goal, it is the more likely branch by the parent proposal's own
        prior, and it is a deliverable rather than a failure. It SUPERSEDES under a new id and
        never edits the committed record.
    - outcome: >-
        T IS NOT USABLE. Measured T(r) is flat or non-monotone in r, or the no-op sibling loop
        costs more than 20 percent of the real loop.
      what_observing_it_would_mean: >-
        HEUR-AES-B1 is falsified and (A1) fails: the measurement is dominated by loop overhead
        rather than by the cipher, so the constant does not convert attack work into seconds
        and the curve cannot be frozen. The deliverable is the overhead measurement.
    - outcome: >-
        h* OUTSIDE [88, 91], or the measured baseline at h = 96 outside the bracket the
        committed figures imply.
      what_observing_it_would_mean: >-
        (A3) is falsified as stated. Either the frozen T differs from both committed figures by
        more than a factor of 4, or the conversion does not convert. Either way the curve is not
        frozen until it is explained, and no margin may be computed under it.
    - outcome: >-
        THE CURVE RETURNS A MARGIN ON THE COMMITTED HINTED MODE at h = 96.
      what_observing_it_would_mean: >-
        (A4) is falsified. The framework contradicts a committed measured comparison, which
        means the framework is wrong rather than the committed record. The nearby-object control
        has done its job and no baseline curve is published.
    - outcome: >-
        THE BASELINE AT h = 104 FAILS TO RECOVER THE KEY.
      what_observing_it_would_mean: >-
        It is not a key-recovery baseline and NO COMPARISON TO IT IS ADMISSIBLE. Nothing negative
        may be reported from any other stage, and the deliverable is the sensitivity failure.
    - outcome: >-
        A CONSTRUCTION'S COUNTED RESIDUAL DIFFERS FROM 2^(k-h).
      what_observing_it_would_mean: >-
        HEUR-AES-B2 is falsified for that construction. The curve must be indexed by the
        RESIDUAL rather than by h, every placement is recomputed, and the pre-dispatch gate must
        ask for the residual - which is exactly the silent failure the heuristic was stated to
        expose.
    - outcome: 'INFRASTRUCTURE. A measurement crashes or the baseline exceeds the producer envelope.'
      what_observing_it_would_mean: >-
        NOTHING ABOUT THE CONSTANT (AGENTS.md rule 5). failed_infrastructure; the point is
        unfilled and is never interpolated.

  falsification_conditions:
    - >-
      The measured T disagreeing with BOTH committed figures by more than a factor of 4. The
      environment has changed or one committed figure describes something else; either way the
      curve cannot be frozen until it is explained.
    - >-
      The measured baseline time at h = 96 falling outside the bracket the committed figures
      imply. The conversion constant does not convert.
    - >-
      Measured ratios between h = 104, 100 and 96 departing from 16x beyond [12, 20]. The
      baseline is not dominated by the residual search and is not a generic baseline.
    - >-
      The baseline at h = 104 failing to recover the key. No comparison to it is admissible and
      nothing negative may be reported from any other stage.
    - T(r) flat or non-monotone in r, which makes the constant unusable.
    - The curve returning a margin on the committed hinted mode at h = 96.

  interpretation_limits:
    - >-
      THIS IS INFRASTRUCTURE AND THE GOAL RECORD SAYS SO. A measured throughput receipt does not
      complete this goal. Any record built on it must repeat that sentence.
    - >-
      NO MARGIN IS CLAIMED AGAINST ANY REFERENCE. This builds the instrument that would let a
      margin be claimed honestly, and claims none.
    - >-
      A BASELINE BUILT BY THE SAME SESSION AS A CANDIDATE IS NOT A BASELINE. The campaign's
      criterion requires a different task and an independent red-team pass specifically on the
      baseline; a card bundling this with a candidate construction violates the criterion it
      exists to serve.
    - >-
      THE MEASURED/MODELLED BOUNDARY IS WHERE A CLAIM WILL BE LAUNDERED. B(h) below about
      h* - 4 is a measured constant times a DERIVED count, and a modelled cost claim is capped
      below the top tier. Any margin at small h inherits that cap and must say so in the same
      sentence.
    - >-
      Claim tier toy, reduced-round only. No statement about full-round or deployed AES, and no
      comparison to published cryptanalysis in either direction.
    - >-
      MACHINE-SPECIFIC. T is a property of this machine and this build; it does not transfer,
      and a curve quoted on another machine is a different curve.

