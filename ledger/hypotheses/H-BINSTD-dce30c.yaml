  title: >-
    An invertible two-bit substitution keeps degree 2 and splits one term
    into two.
  statement: >-
    The integer 131 leaves remainders 1, 2, 1, 5 and 10 on division by
    2, 3, 5, 7 and 11. The square 11^2 is 121 and the square 12^2 is
    144, which exceeds 131, so the trial bound is 11. The only positive
    divisors of 131 are 1 and 131. The polynomial with exponents 131,
    13, 2, 1 and 0 has Hamming weight 5, not 3. The substitution
    x0 = y0 and x1 = y0 + y1 has determinant 1. In the polynomial ring
    the product x0*x1 becomes y0^2 + y0*y1, still degree 2, with two
    terms. After the Boolean rule y0^2 = y0 the image is y0 + y0*y1,
    still degree 2, with two terms. The singular substitution x0 = y0
    and x1 = y0 has determinant 0. In the polynomial ring its product
    is y0^2, still degree 2, with one term. After the Boolean rule that
    image is y0, degree 1, with one term.
  mechanism: >-
    The proposal asks whether a change of F_2 basis can change sparsity
    while leaving total degree fixed. This contract checks that claim
    on one monomial and one two-bit matrix. It does not build a 131-bit
    basis and it does not run a solver.
