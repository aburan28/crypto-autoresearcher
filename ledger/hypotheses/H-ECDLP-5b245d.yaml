hypothesis:
  id: H-ECDLP-5b245d
  question_id: RQ-ECDLP-4fcbd3
  added: '2026-09-05'
  derived_from_idea: IDEA-20260905-5a1ea2
  statement: >-
    SCOPE: factor bases inside cofactor-1 prime-order subgroups at field_bits in
    {12, 16, 20, 24}: the interval base F_B = {W : x(W) < B} and the residue base
    F_res = {W : x(W) = 0 mod m0}, each sized to m = p^(1/3) and m = p^(1/2)
    (rounded), against 32 uniformly random m-subsets per cell (8 at 24 bits) as
    the null of the same shape; one cyclic order-2q curve per size with a base
    inside the index-2 subgroup as the known-true object. CLAIM TIER toy. NO
    ATTACK, NO EXPONENT MOVED, NOTHING ABOUT THE MEAN YIELD (KN-FIND-007 fixes it).
    Claim, in three parts. (1) WHITE ENVELOPES: the additive envelope S_add(F) =
    max over a != 0 of |sum over x of H_F(x) e(a x/p)| / m^2 and the quadratic
    envelope S_quad(F) = max over c of |sum over x of H_F(x) Legendre(x - c)| / m^2
    of the sumset x-histogram H_F are, for F_B and F_res at both sizes, within a
    factor 2 of the null's envelopes at every cell, and their slope against log p
    at fixed size exponent gamma is -gamma +- 0.1. (2) NULL LEVEL: the null's
    envelopes are sqrt(2 ln p)/m within a factor 1.5. (3) BLIND SPOT AND
    KNOWN-TRUE DETECTION: on the order-2q curve the subgroup-contained base has
    S_quad = 1 exactly at c = e and S_add at or below the null's level.
    Claim (1) is FALSE for a base if its envelope ratio to the null is above 4 at
    the two largest sizes with a positive slope, replicated on the second curve
    family; that base's envelope is then a resource for IDEA-20260830-c5c614's
    grammar. Claim (3) failing voids the instrument.
  mechanism: >-
    x(P + Q) is a bounded-degree correspondence applied to F x F, so a structured
    box can push forward to a non-flat histogram; the two envelopes bound the
    lift of every interval or residue predicate (additive family, via Parseval
    and the predicate's l^1 Fourier norm) and of every Legendre-type predicate
    (quadratic family) at once, without choosing a grammar. Below m = sqrt(p) the
    recalled bilinear bound is vacuous, so the measurement is in the unproved
    regime and the random null's Poisson level sqrt(2 ln p)/m is the prediction.
    The additive envelope is blind to residuosity structure because the squares'
    indicator has a Gauss-sum-flat additive spectrum, which is why the known-true
    object (sumset supported on the squares of x - e) must read S_quad = 1 and
    S_add at or below the null, and why both envelopes are carried.
  assumptions:
    - Pairs with P = +-Q are excluded and counted; the a = 0 coefficient reproduces the counted pair number exactly (blocking).
    - Bases live in the prime-order subgroup so sums stay in it; the order-2q control is the one exception and is labelled.
    - Toy tier; no transfer beyond the slopes.
  proof_search_map:
    bottleneck: >-
      An envelope above the white level at m <= sqrt(p) for a structured base;
      the only route from sumset non-flatness to a yield-relevant lift.
    baseline_embedding:
      parameter_slice: the random base at every cell; the a = 0 reproduction
      reproduction_check: a = 0 exact; null envelope at sqrt(2 ln p)/m within 1.5
    observation_collision:
      observable: the pair (S_add, S_quad)
      distinct_preimage_search: >-
        Residuosity and interval structures can share S_add (the first is
        additively flat); separated by S_quad. Higher-order multiplicative
        structure is invisible to both and is stated as out of scope.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: the fibre of white envelopes over x-line bases
        predicted_gain: a bound reusable by every x-line proposal; no exponent
    quantifier_order: FOR ALL cells, frequencies and shifts white; alternative existential in (a) or (c), persisting in p.
    method_ceiling:
      strongest_certifiable_claim: measured envelopes and slopes for the named bases at toy scale; detection of the known-true object by S_quad
      nearby_object_control: the subgroup-contained base on the order-2q curve
    proof_obligations:
      - claim: envelope inequality via Parseval
        responsibility: correctness
      - claim: null level sqrt(2 ln p)/m
        responsibility: size
      - claim: Gauss-sum flatness of the squares' indicator
        responsibility: baseline
      - claim: two FFTs of length p per base within one tool window
        responsibility: runtime
      - claim: toy tier
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: Explicitly null; a measurement of an envelope, no complexity claim.
  heuristic_assumptions:
    - id: HEUR-CBIAS-H3
      formal_statement: >-
        For x-line bases of size m <= sqrt(p) inside a prime-order subgroup, the
        sumset x-histogram's additive and quadratic transforms at nonzero
        frequencies and all shifts behave like those of a uniformly random
        m-subset, so both envelopes are at sqrt(2 ln p)/m.
      random_model_justification: >-
        Above m = sqrt(p) the recalled bilinear bound (Banks-Friedlander-Garaev-
        Shparlinski, unverified here) forces the additive envelope to c sqrt(p)/m;
        below it there is no rigorous support. The classical statement imitated is
        the Poisson law of a random subset's pair counts.
      supporting_results:
        - 'Recalled pointer only: Banks, Friedlander, Garaev, Shparlinski (2006). Unverified in this program.'
        - 'The random-base null measured in the same runs.'
      validation_experiment_ids: [EXP-ECDLP-0c717c]
      falsification_condition: >-
        An envelope ratio above 4 at the two largest sizes with positive slope on
        both families for F_B or F_res.
  structural_ingredients:
    - description: Conservation of mean decomposition yield; the envelopes exclude the mean term.
      citation: KN-FIND-007
      provenance: internal
      verified_by: claude-code-session 2026-09-05 (read in full)
      role: what this hypothesis does not dispute
    - description: The x-line predicate grammar and its yield-lift measurement, which the envelopes bound.
      citation: IDEA-20260830-c5c614
      provenance: internal
      verified_by: claude-code-session 2026-09-05 (title, claim, mechanism and citations read)
      role: the downstream consumer of a positive
    - description: Bilinear character sums of x(P + Q) over product sets.
      citation: >-
        RECALLED, NOT READ. Banks, Friedlander, Garaev and Shparlinski, Pure
        Appl. Math. Q. 2 (2006). Pointer only; the hypothesis's measured claims do
        not depend on it.
      provenance: recalled
      verified_by: null
      role: the regime boundary m = sqrt(p)
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: envelope_ratio_to_null
      direction: different
      minimum_effect: Null within 2 for both envelopes and both bases; structure above 4 at the two largest sizes with positive slope.
    - metric: envelope_slope
      direction: different
      minimum_effect: Null -gamma +- 0.1 at fixed m = p^gamma; structure above -gamma + 0.25.
    - metric: control_envelopes
      direction: higher
      minimum_effect: S_quad(F_sub) = 1 at c = e exactly; S_add(F_sub) at or below the null's level.
  test_boundary:
    instances:
      - cofactor-1 prime-order curves at field_bits in {12, 16, 20, 24}, three seeds, by rejection
      - F_B and F_res at m = p^(1/3) and m = p^(1/2), rounded; m0 chosen so |F_res| is within 10 percent of m
      - 32 random m-subsets per cell (8 at 24 bits)
      - one cyclic order-2q curve per size with the subgroup-contained base
    parameters:
      field_bits: [12, 16, 20, 24]
      seeds: [20260905, 20260906, 20260907]
      size_exponents: [0.3333, 0.5]
    implementation: >-
      A standalone driver under experiments/EXP-ECDLP-0c717c/driver/ using
      harness/toycurve.py and numpy; runs through harness/runner.py.
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 10
      maximum_memory_gb: 8
      maximum_runs: 48
  falsification_conditions:
    - Envelope ratio above 4 at the two largest sizes with positive slope, both families, for F_B or F_res. Claim (1) false for that base.
    - Null envelope outside a factor 1.5 of sqrt(2 ln p)/m. Claim (2) false; normalisation defect, instrument.
    - Control S_quad not 1 at c = e, or S_add above the null. Claim (3) false; instrument void.
    - Crashes, timeouts, memory exhaustion. Infrastructure, never negative mathematical evidence.
  interpretation_limits:
    - Toy tier; two size exponents only.
    - Two character families only; higher-order multiplicative structure out of scope.
    - No attack, no exponent; an envelope and a slope.
  status: proposed
  proposed_by: claude-code-session
  specified_by: claude-code-session 2026-09-05, as a DESIGN DRAFT; not a Coordinator status change.
  prior_evidence_refs:
    - RQ-ECDLP-4fcbd3
    - RQ-FBG-001
    - IDEA-20260905-5a1ea2
    - IDEA-20260830-c5c614
    - KN-FIND-007
  distinguishable_outcomes:
    - outcome: Claims (1)-(3) hold.
      meaning: >-
        The sumset x-distribution of interval and residue bases is white in both
        character families at index-calculus sizes at toy scale; the obstruction
        is the measured envelope, and it bounds every predicate lift in those
        families that c5c614's grammar could find.
    - outcome: Claim (1) false for a base.
      meaning: >-
        A measured envelope above the null in the unproved regime; replicated,
        then handed to c5c614's grammar as the successor to locate the predicate
        carrying it. No attack cost is modelled before that.
    - outcome: Claim (3) false.
      meaning: Instrument or descent claim wrong; nothing reported.
    - outcome: Infrastructure.
      meaning: Missing cells stay missing.
