hypothesis:
  id: H-NGCC-624765
  question_id: RQ-NGCC-f52138
  idea_id: IDEA-20261001-ff0049
  statement: >-
    On the official NGCC round-1 MoFang submission (hash-19), for every
    instance the package declares, the published hash-19-1 witness is a
    pair of distinct messages with equal full-round digests under a
    separately compiled official hasher.
  mechanism: >-
    The mechanism under test is the published collision, not a search for
    a new one. The executor reads the message pair from finding hash-19-1
    or from Yuan et al., ePrint 2026/2152, before hashing. Equality is
    decided by a second compilation of the submission hash. This hypothesis
    does not restate the collision construction.
  assumptions:
    - The official package implements full-round MoFang for each declared instance.
    - A published pair of messages can be read from finding hash-19-1 or ePrint 2026/2152. If neither source supplies a pair, the run is invalid rather than a falsification.
  proof_search_map:
    not_applicable_reason: >-
      This hypothesis is an empirical check of a published colliding pair.
      It asserts no theorem, asymptotic bound, or reduction.
    bottleneck: null
    baseline_embedding:
      parameter_slice: null
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms: []
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations: []
  predictions:
    - metric: distinct_messages_with_equal_full_round_digests
      direction: higher
      minimum_effect: >-
        At least one published pair per declared instance, messages unequal,
        full-round digests equal under the separate hasher.
  test_boundary:
    instances:
      - hash-19 MoFang, official round-1 zip named in inputs/ngcc-round1-20260920/candidates.yaml
    parameters:
      instances: every instance the official package declares, recorded before hashing
      rounds: full
    implementation: >-
      Reference C compiled by this program from submission sources.
      Nothing shipped as a binary, object file, or submission build script
      is executed.
    budget:
      enforcement: advisory
      wall_clock_seconds_per_run: null
      maximum_memory_gb: 4
  falsification_conditions:
    - >-
      For some declared instance, the published pair is hashed to completion
      and the two full-round digests differ.
  interpretation_limits:
    - A success is scoped to the tested package and instances. It does not transfer to a later revision.
    - A failure refutes the published pair on that instance. It does not by itself prove that no collision exists.
    - A collision that appears only at reduced rounds is outside this statement.
  status: specified
  proposed_by: coordinator
