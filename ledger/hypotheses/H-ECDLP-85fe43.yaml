# H-ECDLP-85fe43
# Stage-0 lower-half x-count for IDEA-20261006-43905e.
# Two curves over F_29. Not a discrete logarithm.
hypothesis:
  id: H-ECDLP-85fe43
  question_id: RQ-ECDLP-4fcbd3
  goal_id: GOAL-ECDLP-001
  source_idea: IDEA-20261006-43905e
  added: '2026-10-12'
  status: specified
  statement: >-
    Over F_29, the affine points of y^2 = x^3 - x + 1 contribute 20
    x-coordinates to {0, ..., 14} and 16 to {15, ..., 28}, and the
    affine points of y^2 = x^3 + x contribute 10 and 9. The absolute
    gap of the imbalances is 3. Counting the first curve twice has gap 0.
  test_boundary: >-
    One prime and two named curves. No character of a scalar, no
    halving step, and no factor base are inside this boundary.
  mechanism: >-
    The tracked object is the multiset of affine x-coordinates. The
    cut at 14 produces two imbalances. The four integers, and any
    other valid recount, are the two finished readings.
  distinguishable_outcomes:
    - >-
      The scanner agrees with itself, both curves are nonsingular, and
      the four half-counts are 20, 16, 10, and 9.
    - >-
      The scanner agrees with itself, both curves are nonsingular, and
      at least one half-count differs.
    - >-
      The two enumerations disagree, or the self-count gap is nonzero.
      That outcome invalidates the run.
  falsification: >-
    The worksheet is valid and a half-count or a projective total
    differs from the pre-registered list.
  not_claimed: >-
    No discrete logarithm, no rho step, and no change to the generic
    exponent 1/2.
