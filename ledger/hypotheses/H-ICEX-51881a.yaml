hypothesis:
  id: H-ICEX-51881a
  question_id: RQ-QRE-6dba8c
  source_idea_id: IDEA-20260815-f4c398
  title: >-
    THE 256-BIT ECDLP RESOURCE NUMBER THIS PROGRAM CITES REPRODUCES EXACTLY
    FROM ITS OWN CLOSED FORMS, AND ITS SENSITIVITY TO EVERY ERROR-CORRECTION
    ASSUMPTION IS EXACTLY ZERO- the logical qubit law is linear in n alone
    and the Toffoli law is a cubic in n alone, so code distance, cycle time,
    physical error rate and distillation scheme move the headline logical
    figures by nothing at all, and the whole migration-relevant sensitivity
    lives in a layer the source explicitly does not contain
  statement: >-
    (A) THE SOURCE AND WHAT IT RECORDS. KN-LIT-099 is this corpus's only
    ECDLP quantum resource-estimate entry with an extracted table and
    citation_verified 'read'. It records- logical qubits at most
    9n + 2*ceil(log2 n) + 10; Toffoli gates at most
    448 n^3 log2(n) + 4090 n^3, interpolated from simulation, with the
    controlled point addition alone at about 224 n^2 log2(n) + 2045 n^2 and
    run 2n times; seven simulated data points (n / logical qubits / Toffoli
    gates)- 110 / 1014 / 9.44e9, 160 / 1466 / 2.97e10, 192 / 1754 / 5.30e10,
    224 / 2042 / 8.43e10, 256 / 2330 / 1.26e11, 384 / 3484 / 4.52e11,
    521 / 4719 / 1.14e12; an RSA-3072 comparison at 6146 qubits and 1.86e13
    Toffoli gates; and, decisively, that ALL COUNTS ARE LOGICAL QUBITS IN A
    FAULT-FREE MODEL WITH NO ERROR-CORRECTION OVERHEAD INCLUDED.
    (B) THE FIRST PREDICTION, WHICH IS FORCED AND EXACT. The recorded qubit
    law reproduces ALL SEVEN recorded simulated qubit counts EXACTLY, with no
    tolerance- 9*256 + 2*8 + 10 = 2330 and 9*110 + 2*7 + 10 = 1014, and
    likewise at 160, 192, 224, 384 and 521. A single row that does not
    reproduce exactly means the extract or the transcription is wrong and
    HALTS the record.
    (C) THE SECOND PREDICTION, WHICH IS FORCED AND TIGHT. The recorded
    Toffoli law reproduces all seven recorded simulated Toffoli counts within
    5 percent. HAND ARITHMETIC, TO ABOUT 1 PERCENT AND WITH THE STAGE 0
    SCRIPT AS THE AUTHORITY- the residuals are about +0.5, +1.6, 0.0, +1.2,
    +2.2, -0.6 and +0.9 percent at n = 110, 160, 192, 224, 256, 384 and 521
    respectively. A residual above 5 percent at any row falsifies this
    prediction.
    (D) THE THIRD PREDICTION, WHICH IS AN INTERNAL CONSISTENCY IDENTITY AT
    ZERO COST. The point-addition law times 2n must equal the total law
    IDENTICALLY- 2n * (224 n^2 log2 n + 2045 n^2) = 448 n^3 log2 n +
    4090 n^3, symbolically and for every n. Any deviation is a transcription
    error in the extract and halts the record.
    (E) THE DELIVERABLE, AND IT IS A NEGATIVE ONE. The one-at-a-time
    sensitivity pass will find that CODE DISTANCE, CYCLE TIME, PHYSICAL ERROR
    RATE AND DISTILLATION SCHEME EACH MOVE BOTH HEADLINE FIGURES BY EXACTLY
    ZERO, because neither closed form contains them- the model is fault-free
    by the source's own statement. The only input that moves either figure is
    n. CONSEQUENCE- the assumption stack that migration arguments actually
    turn on is not in this estimate at all, so a sensitivity ranking derived
    from it is EMPTY by construction, and any physical-resource or
    wall-clock figure requires a SECOND filed source. That emptiness is the
    finding, and it is falsified by any assumption that moves either figure.
    (F) WHAT IS NOT CLAIMED. The source's reversible-arithmetic
    constructions, its interpolation methodology and its circuit simulations
    are NOT reproduced and are not reproducible from the publication
    description within this budget; the corpus entry records that they were
    not checked there either. Nothing here bears on quantum feasibility, on
    hardware, or - per RQ-QRE-6dba8c's binding constraint - on any date,
    timeline, arrival probability or policy recommendation.
  mechanism: >-
    WHY REPRODUCTION AND SENSITIVITY ARE THE SAME EXERCISE. A headline
    resource figure is the output of a function of named inputs. Recomputing
    it checks the arithmetic; perturbing each input checks what the figure is
    ABOUT. This program cites the 256-bit number without having done either,
    and the second is the one that matters, because a number whose
    sensitivity to an assumption is zero is not evidence about that
    assumption in any direction.
    WHY THE ANSWER IS PREDICTABLE HERE AND WHY THAT IS NOT A REASON TO SKIP
    IT. The source states its model is fault-free. So the sensitivity pass
    is predicted to return an empty ranking, and the value of running it is
    that the emptiness becomes a COMMITTED, CHECKABLE artifact rather than an
    inference someone has to re-derive from a caveat sentence. An empty
    ranking is also the strongest possible statement that the citation is
    being used outside its scope wherever it is quoted as bearing on
    error-correction assumptions.
    WHY THE THREE LAYERS MUST NOT BE CONFLATED. There is a COUNTING layer
    (the closed forms against the simulated table), a CIRCUIT-SYNTHESIS layer
    (the reversible arithmetic and the simulations that produced the table),
    and an ERROR-CORRECTION layer (absent from this source entirely). This
    hypothesis reproduces the FIRST and says so; it does not touch the second
    and cannot touch the third. Reporting a reproduction of the first as a
    reproduction of the pipeline would be exactly the silent gap-filling the
    source proposal names as its own dominant confounder.
  assumptions:
    - >-
      UNITS, DECLARED AND NEVER COMBINED- LOGICAL QUBITS (count), TOFFOLI
      GATES (count), TOFFOLI DEPTH (count). These are three distinct
      quantities and no scalar formed by adding or dividing across them is
      emitted. NO PHYSICAL-QUBIT, WALL-CLOCK OR SECONDS-DENOMINATED FIGURE
      MAY BE PRODUCED UNDER THIS HYPOTHESIS, because the source contains no
      error-correction layer from which one could be derived; such a figure
      requires a second filed source and belongs to H-ICEX-4b2e19.
    - >-
      The extracted table in KN-LIT-099 is taken as the reference. Its own
      'Not verified here' section records that the ePrint PDF's abstract,
      results paragraph and full simulation table were read directly, while
      the reversible-arithmetic constructions, interpolation methodology and
      simulations were NOT checked. That boundary is inherited exactly.
    - >-
      The corpus entry records a discrepancy in the RSA-3072 Toffoli figure
      between the ePrint text and table (1.86e13) and the published version's
      summary (1.5e14). Both are carried; neither is silently selected, and
      any RSA row is reported as a bracket.
    - >-
      Assumptions are separable enough for one-at-a-time ranking. Where the
      recorded closed forms contain an input at all, interactions are checked
      pairwise for the top-ranked inputs; where they do not contain it, the
      movement is exactly zero and no interaction exists.
    - >-
      No date, timeline, arrival probability or policy recommendation appears
      in any artifact (RQ-QRE-6dba8c constraint 4).
  proof_search_map:
    bottleneck: >-
      Which inputs the headline figures actually depend on. The exact step
      whose removal changes the conclusion is 'evaluate the recorded closed
      forms and perturb each named input'; everything else in the source's
      pipeline is upstream of the numbers this program quotes.
    baseline_embedding:
      parameter_slice: >-
        THE SEVEN RECORDED SIMULATED DATA POINTS. The closed forms must
        reproduce all seven qubit counts exactly and all seven Toffoli counts
        within 5 percent.
      reproduction_check: >-
        Exact integer arithmetic for the qubit law (it involves only
        multiplication, a ceiling of a base-2 logarithm, and addition) and
        floating-point with declared precision for the Toffoli law. The
        point-addition identity 2n * (224 n^2 log2 n + 2045 n^2) =
        448 n^3 log2 n + 4090 n^3 must hold symbolically. Any failure halts
        the record as a transcription error, never as a mathematical result.
    observation_collision:
      observable: >-
        The headline 256-bit figure alone.
      distinct_preimage_search: >-
        COLLISION EXHIBITED. The single number '2330 qubits' is produced by
        the fault-free logical model AND would be produced by any
        error-correction assumption whatsoever, since none appears in the
        law. The figure therefore does not identify an architecture, an era
        or an assumption stack, and quoting it as though it did is the
        misuse this hypothesis makes checkable. The identifying tuple is
        (n, model layer, whether error correction is included), and the
        answer for this source is (n, logical, no).
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the headline figure fixed and vary the error-correction
          assumptions; the fibre is the WHOLE assumption space, because the
          figure does not depend on any of them.
        predicted_gain: >-
          Establishes that the cited observable is not identifying with
          respect to the assumptions migration arguments turn on, and names
          the second source required to make it so. NO RESOURCE FIGURE IS
          IMPROVED IN EITHER DIRECTION.
    quantifier_order: >-
      CLAIMED. FOR ALL seven recorded n, the qubit law reproduces the
      recorded count exactly and the Toffoli law within 5 percent. CLAIMED.
      FOR ALL inputs in {code distance, cycle time, physical error rate,
      distillation scheme, connectivity}, the movement in both headline
      figures is EXACTLY ZERO. NOT CLAIMED- that the source's circuit
      constructions are correct; that the interpolation is sound; anything
      about physical resources or wall clock; anything about hardware.
    method_ceiling:
      strongest_certifiable_claim: >-
        'The recorded closed forms reproduce the recorded simulated table to
        the stated tolerances, and the headline logical figures depend on n
        alone.' It can NEVER certify the reversible-arithmetic constructions,
        the simulations that produced the table, any physical-resource
        figure, or anything about quantum feasibility.
      nearby_object_control: >-
        THE NON-CURVE INSTANCE- the source's own RSA-3072 comparison row,
        which is a different hard problem costed by the same authors under
        the same conventions. The reproduction machinery and the empty
        sensitivity ranking must behave identically there. A behaviour
        appearing only on the curve side would mean something
        curve-specific entered the counting layer and must be explained
        before any citation.
    proof_obligations:
      - claim: >-
          All seven recorded qubit counts reproduce exactly from
          9n + 2*ceil(log2 n) + 10.
        responsibility: baseline
      - claim: >-
          All seven recorded Toffoli counts reproduce within 5 percent from
          448 n^3 log2 n + 4090 n^3.
        responsibility: baseline
      - claim: >-
          The point-addition law times 2n equals the total law identically.
        responsibility: correctness
      - claim: >-
          Every error-correction input moves both headline figures by exactly
          zero.
        responsibility: scope
      - claim: >-
          No physical-resource, wall-clock, timeline or policy figure is
          emitted.
        responsibility: interface
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-QRE-REP-1
      formal_statement: >-
        The published costing pipeline is reproducible from its description
        to within its stated precision, at the COUNTING layer- that is, the
        recorded closed forms reproduce the recorded simulated table.
      random_model_justification: >-
        The rigorous ingredient is that the source states its closed forms
        and its simulated data points explicitly, and the corpus entry
        reproduces both, so the counting-layer check is exact arithmetic with
        no modelling at all. THE GAP- resource-estimation pipelines depend on
        tooling and calibration data not fully described in a paper, so the
        CIRCUIT-SYNTHESIS layer is generally NOT reproducible and the honest
        outcome there is a bounded mismatch or an explicit non-attempt. This
        hypothesis attempts only the counting layer and declares the other
        two out of reach rather than approximating them.
      supporting_results:
        - ref: KN-LIT-099
          provenance: internal
          claim: >-
            The two closed forms, the point-addition form, the seven
            simulated data points, the RSA-3072 comparison row with its
            recorded internal discrepancy, and the explicit statement that
            all counts are fault-free logical counts with no error-correction
            overhead.
          verified_by: >-
            coordinator, TASK-20260904-e87737 (corpus entry read in full,
            69 lines; the entry itself records citation_verified 'read' with
            the ePrint simulation table reproduced, and records what was NOT
            checked)
      validation_experiment_ids:
        - EXP-ICEX-640aef
      falsification_condition: >-
        Any of the seven qubit rows failing to reproduce exactly, or any
        Toffoli row exceeding a 5 percent residual, or the point-addition
        identity failing. Each is a transcription or extraction error and
        halts the record rather than being reported as a finding about the
        source.
  structural_ingredients:
    - description: >-
        The logical qubit law, the Toffoli law, the point-addition law, the
        seven simulated data points, the RSA comparison row and the
        fault-free caveat.
      citation: KN-LIT-099
      provenance: internal
      verified_by: coordinator, TASK-20260904-e87737 (read in full this task)
      role: the entire input to the reproduction and the sensitivity pass
    - description: >-
        The question's own constraints- two filed primary sources before any
        pipeline output, every constant derived or cited, no timeline or
        policy content, and no single-point sensitivity figure without its
        range.
      citation: RQ-QRE-6dba8c
      provenance: internal
      verified_by: coordinator, TASK-20260904-e87737 (question read in full)
      role: the binding procedural constraints, carried as invalidation rules
  reduction_chain:
    core_problem: >-
      Reproduction of the counting layer of a published ECDLP quantum
      resource estimate, and the sensitivity of its headline figures to its
      own named inputs.
    corollaries: []
  predictions:
    - metric: >-
        P1- reproduction of all seven recorded LOGICAL QUBIT counts from the
        recorded closed form, in LOGICAL QUBITS (count)
      direction: different
      minimum_effect: >-
        FORCED EXACT, ZERO TOLERANCE, at n = 110, 160, 192, 224, 256, 384 and
        521 against 1014, 1466, 1754, 2042, 2330, 3484 and 4719. A single
        mismatch halts the record as a transcription error.
    - metric: >-
        P2- reproduction of all seven recorded TOFFOLI GATE counts from the
        recorded closed form, in TOFFOLI GATES (count)
      direction: different
      minimum_effect: >-
        FORCED WITHIN 5 PERCENT at every row. Hand-derived residuals, to
        about 1 percent and with the Stage 0 script as the authority- +0.5,
        +1.6, 0.0, +1.2, +2.2, -0.6 and +0.9 percent at n = 110 through 521.
        A residual above 5 percent at any row falsifies P2.
    - metric: >-
        P3- the internal consistency identity, symbolic
      direction: different
      minimum_effect: >-
        FORCED EXACT- 2n * (224 n^2 log2 n + 2045 n^2) must equal
        448 n^3 log2 n + 4090 n^3 identically. Any deviation is a
        transcription error in the extract and halts.
    - metric: >-
        P4- one-at-a-time sensitivity of both headline figures to code
        distance, cycle time, physical error rate, distillation scheme and
        connectivity, in LOGICAL QUBITS and TOFFOLI GATES respectively
      direction: different
      minimum_effect: >-
        PRE-REGISTERED EXACTLY ZERO FOR EVERY ONE OF THEM, because none
        appears in either closed form and the source's model is fault-free by
        its own statement. ANY NONZERO MOVEMENT FALSIFIES THIS PREDICTION and
        means an assumption was smuggled into the reimplementation that the
        source did not state - which is the silent gap-filling this contract
        is built to detect.
    - metric: >-
        P5- non-curve control- the same reproduction and sensitivity
        behaviour on the source's RSA-3072 comparison row
      direction: different
      minimum_effect: >-
        PREDICTED IDENTICAL BEHAVIOUR- the counting layer reads no curve, so
        the machinery must behave the same way on a different hard problem
        costed by the same authors. The RSA Toffoli figure is reported as the
        BRACKET [1.86e13, 1.5e14] that the corpus entry records, never as a
        point.
  test_boundary:
    instances:
      - >-
        No curve, no group, no quantum hardware, no circuit simulation- exact
        arithmetic over a filed table.
      - >-
        NON-CURVE CONTROL- the source's RSA-3072 comparison row.
    parameters:
      n: '110, 160, 192, 224, 256, 384, 521'
      perturbed_inputs: 'code distance, cycle time, physical error rate, distillation scheme, connectivity'
      units: 'logical qubits, Toffoli gates, Toffoli depth - never combined'
    implementation: >-
      A derivation-aid script- exact integer arithmetic for the qubit law,
      declared-precision floating point for the Toffoli law, and a symbolic
      check of the point-addition identity. No quantum simulation, no circuit
      synthesis, no curve arithmetic.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 0.25
      maximum_memory_gb: 8
      maximum_runs: 4
  falsification_conditions:
    - >-
      F1. Any of the seven qubit rows fails to reproduce exactly. HALT-
      transcription or extraction error, an infrastructure outcome under
      AGENTS.md rule 5, never a finding about the source.
    - >-
      F2. Any Toffoli row exceeds a 5 percent residual. Same treatment,
      unless the residual pattern indicates the recorded interpolation itself
      is being mis-evaluated, which is reported as a finding about the
      EXTRACT rather than about the paper.
    - >-
      F3. The point-addition identity fails. The extract is internally
      inconsistent; halt and reconcile before anything is quoted from it.
    - >-
      F4. Any error-correction input moves either headline figure. The
      reimplementation has introduced an assumption the source did not state;
      the ranking is void until the introduced assumption is removed and
      named.
    - >-
      F5. The non-curve control behaves differently from the curve rows. A
      curve-specific quantity entered the counting layer undeclared.
    - >-
      F6. Everything holds. Then this program has a committed, checkable
      record that the figure it cites is a fault-free LOGICAL count depending
      on n alone, that its sensitivity to every error-correction assumption
      is exactly zero, and that any physical-resource statement requires a
      second filed source - which is precisely what H-ICEX-4b2e19 is blocked
      on.
  interpretation_limits:
    - >-
      REPRODUCES THE COUNTING LAYER ONLY. The reversible-arithmetic
      constructions, the interpolation methodology and the circuit
      simulations are NOT reproduced and are NOT REPRODUCIBLE FROM THE
      PUBLICATION DESCRIPTION WITHIN THIS BUDGET- the corpus entry records
      that they were not checked there either. THIS IS THE PART THAT IS NOT
      TESTABLE AT REACHABLE SCALE and it is stated as a limitation rather
      than approximated.
    - >-
      AN EMPTY SENSITIVITY RANKING IS NOT A STATEMENT THAT THE ESTIMATE IS
      ROBUST. It is a statement that the estimate does not contain the
      assumptions in question, which is a scope fact and the opposite of
      reassurance for anyone quoting it about error correction.
    - >-
      NO PHYSICAL-RESOURCE, WALL-CLOCK OR SECONDS-DENOMINATED FIGURE MAY BE
      EMITTED under this hypothesis; the source has no error-correction
      layer.
    - >-
      NO DATE, TIMELINE, ARRIVAL PROBABILITY OR POLICY RECOMMENDATION may
      appear in any artifact (RQ-QRE-6dba8c constraint 4). Enforced as an
      invalidation rule.
    - >-
      A SENSITIVITY RANKING IDENTIFIES DEPENDENCE, NEVER CORRECTNESS. Nothing
      here says the source's numbers are right, only what they are functions
      of.
    - >-
      HARDWARE-MODEL DRIFT- the source is a 2017 estimate and a reproduction
      is a statement about that estimate, not about present hardware. Since
      no timeline may be recorded, this limit is a scope statement and not a
      forecast.
