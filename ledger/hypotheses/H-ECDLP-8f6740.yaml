  goal_id: GOAL-ECDLP-001
  source_proposal: IDEA-20260808-c4b462
  proposal_id: IDEA-20260808-c4b462
  title: >
    Stage 0 closed-form gamma-threshold
    identities — 2/3-gamma versus 1/2
    iff gamma>1/6 — before any list is
    built
  status: specified
  proposed_by: idea-generator
  designed_by: coordinator
  designed_under_task: TASK-20260913-c1cf33
  specified_by: DEC-20260913-ff2cd5
  specified_at: '2026-09-13'
  created: '2026-09-13'
  updated: '2026-09-13'
  depends_on:
    - IDEA-20260808-c4b462
    - RQ-ECDLP-002
  related_hypotheses: []
  statement: >
    Fix the closed-form gamma-threshold
    identities of IDEA-20260808-c4b462
    before any signed-y bucket is
    evaluated, any four-list is built,
    or any discrete logarithm is solved.
    Stage 0 asserts only that on the
    frozen gamma grid {0, 1/6, 1/3} the
    time exponent 2/3-gamma equals 2/3,
    1/2, 1/3, so gamma=0 loses to rho,
    gamma=1/6 ties, and gamma=1/3 is the
    exact-quotient ceiling. A nearby
    claim that gamma=0 beats rho is
    rejected. A dummy gamma-independent
    time 2/3 is rejected as a threshold.
    This is not a cascade attack and not
    a rho beat. Stages 1+ stay
    unauthorized.
  mechanism: >
    IDEA-20260808-c4b462 tracks time
    N^{2/3-gamma} against rho N^{1/2}
    and states that a beat requires
    gamma>1/6. Stage 0 freezes that
    comparison so a later cascade cannot
    move the gate. No list is built. No
    Semaev S_m. No Coppersmith. No DLP
    solve. The identity is about a rho
    comparison; the comparison is not
    executed as an attack.
  predictions:
    - id: P-S0-GAMMA16
      metric: closed-form identities on the frozen REAL / KF / NULL panel
      direction: different
      minimum_effect: >
        After fixture_pass, REAL reports
        2/3-0=2/3>1/2, 2/3-1/6=1/2,
        2/3-1/3=1/3<1/2, and beats iff
        gamma>1/6. KF gamma=0-beats-rho is
        rejected. NULL constant-time-2/3 is
        rejected.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KF
      statement: >
        After fixture_pass, the KF
        claim is accepted. An encoding
        bug is failed_infrastructure.
    - id: F-S0-REAL
      statement: >
        After fixture_pass, REAL misses
        a frozen identity. That
        falsifies only P-S0-GAMMA16
        at the frozen arithmetic.
  test_boundary:
    instances:
      - frozen Stage 0 REAL / KF / NULL arithmetic panel
    parameters:
      real_grid:
        gamma: ['0', '1/6', '1/3']
        time_exponent: ['2/3', '1/2', '1/3']
        rho_exponent: '1/2'
        beats_strict_iff: 'gamma > 1/6'
        loses_at: ['0']
        equal_at: ['1/6']
        ceiling_at: ['1/3']
        must_zero_loses: true
        must_sixth_ties: true
        must_third_ceiling: true
      known_false:
        kind: gamma_zero_beats_rho
        must_reject: true
      matched_null:
        kind: constant_time_two_thirds
        must_reject: true
      stage0_only_at_specify: true
    implementation: EXP-ECDLP-5407b2 Stage 0 runner
    budget:
      wall_clock_seconds: 120
    prose: >
      Toy / closed-form arithmetic
      only. No curve construction.
      No Semaev S_m evaluation. No
      Coppersmith. No DLP. No rho
      beat. The frozen numbers are
      the proposal's own identities,
      not a fitted result.
  assumptions:
    - id: A1
      statement: >
        Stage 0 evaluates only the
        frozen closed-form identities.
        It does not execute an attack
        and does not solve a DLP.
      status: explicit
    - id: A2
      statement: >
        Standing user authorization
        2026-09-06 covers protocol
        approval once the contract is
        complete.
      status: explicit
  heuristic_assumptions: []
  proof_search_map:
    bottleneck: >
      Whether 2/3-gamma is above, equal,
      or below 1/2 on {0,1/6,1/3}.
    baseline_embedding:
      parameter_slice: >
        The REAL grid, the KF claim,
        and the NULL dummy. Disclosed
        tightening: arithmetic
        calibrator only, not later
        stages of the proposal.
      reproduction_check: >
        REAL identities hold. KF
        rejected. NULL rejected.
    observation_collision:
      observable: cascade time exponent 2/3-gamma versus rho exponent 1/2
      distinct_preimage_search: >
        Hold the cost model and claim
        gamma=0 beats rho (KF). Hold the
        method and drop gamma (NULL).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Frozen Stage 0 identity table.
        predicted_gain: >
          Exact known-false reject on
          KF. Zero claimed attack
          improvement.
    quantifier_order: >
      Freeze the formula and grid
      before reading the table.
      Existential equality at one
      grid does not imply an attack.
    method_ceiling:
      strongest_certifiable_claim: >
        Instrument reproduction on
        the declared frozen
        arithmetic. Never an attack.
        Never a DLP solve. Never a
        rho beat. Never an ECDLP
        exponent.
      nearby_object_control: >
        NULL is a constant 2/3. An argument
        that still calls it a gamma
        threshold is proves-too-much.
  knowledge_promotion:
    promoted: []
    not_warranted: Stage 0 design only. Nothing to promote.
  scientific_boundary: >
    Stage 0 P-S0-GAMMA16 only. Not a
    four-list cascade. Not a signed-y
    evaluation. Not Semaev S_m. Not
    Coppersmith. Not a DLP solve. Not a
    rho beat. No Stage 1 of
