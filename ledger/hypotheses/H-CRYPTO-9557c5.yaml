  title: >-
    On Z/17 the set {0, 1, 3} has 6 pair-sums, not 3 and not 9.
  statement: >-
    Ordered pairs from {0, 1, 3} number 9. Their sums in Z/17 are
    exactly {0, 1, 2, 3, 4, 6}, so the image has 6 elements. The
    combination count C(3, 2) is 3, which is strictly below the
    image. The commutative ceiling Q(Q+1)/2 is 6 and is achieved.
    Ordered triples number 27. Their image has 9 elements, strictly
    below the multiset ceiling 10 and strictly below 27. The zero-query
    term is 0. At n = 4096 the pairs (m, Q) = (2, 64), (3, 16) and
    (4, 8) each give Q^m = n. At the three squares 4096, 16384 and
    65536, T^2/n is 1 for T = 64, 128 and 256.
  mechanism: >-
    The proposal bounds the hit probability by Q^m/n. This contract
    counts one image and the exact power ratios. It does not run a
    solver.
  assumptions: []
  proof_search_map:
    bottleneck: The pair-sum image on one three-element set.
    baseline_embedding:
      parameter_slice: >-
