hypothesis:
  id: H-ECDLP-375be7
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  statement: >-
    On an ordinary prime-field curve with prime-order subgroup N, a genuine
    F_p-rational automorphism/CM eigenvalue set supplied by the special-j
    families j=0 or j=1728 always contains a nonzero short integer relation
    modulo N. Consequently, a curve-backed rank-3 configuration with no short
    eigenvalue relation does not exist in these families; the relation-free
    rank-3 escape proposed by IDEA-20260807-285ff4 is unavailable there.
  mechanism: >-
    For j=0, a nontrivial rational automorphism has eigenvalue lambda satisfying
    lambda^2 + lambda + 1 = 0 mod N, so the genuine set {1, lambda, lambda^2}
    has relation (1,1,1). For j=1728, i^2 + 1 = 0 mod N and the set
    {1,i,-1,-i} has relations (1,0,1,0) and (0,1,0,1). Generic ordinary
    curves have no additional rational automorphism and therefore do not supply
    a genuine rank-3 set. The audit verifies both the map-on-points and the
    modular relation instead of inferring either from the j label.
  assumptions:
    - >-
      The subgroup order N is prime and the supplied point P has exact order N;
      no discrete logarithm is solved by the audit.
    - >-
      The tested special-j maps are the F_p-rational automorphisms in the frozen
      short-Weierstrass models; high-degree non-automorphism CM elements,
      extension-field maps, and supersingular endomorphism algebras are outside
      this hypothesis.
  proof_search_map:
    bottleneck: >-
      Whether the proposed relation-free rank-3 curve-backed configuration can
      exist on the special-j ordinary prime-field families.
    baseline_embedding:
      parameter_slice: >-
        Frozen EXP-ENDO-001 prime-order J0 and J1728 instances at 16, 20, and
        24 field bits, with the generic-j family as the rank-one boundary.
      reproduction_check: >-
        Recompute the polynomial roots and verify phi(P)=[lambda]P directly on
        the frozen curve point; the expected relations are checked modulo N.
    observation_collision:
      observable: >-
        The multiset of verified eigenvalues and the set of short relation
        vectors in coefficient box {-1,0,1}^r.
      distinct_preimage_search: >-
        Compare a curve-backed special-j set against a synthetic same-dimension
        set [1,2,4] with no relation in that box. If both observables coincide,
        the relation test is not identifying the load-bearing structure.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          A verified relation certificate consisting of the map scalar, its
          defining polynomial, and a nonzero coefficient vector modulo N.
        predicted_gain: >-
          Replaces an unmeasured existence assumption with a falsifiable exact
          obstruction before any rank-3 MITM cost is charged.
    quantifier_order: >-
      For every frozen prime-order J0 or J1728 instance and every genuine
      F_p-rational automorphism eigenvalue set generated by the displayed map,
      there exists a nonzero coefficient vector with entries in {-1,0,1} whose
      dot product with the eigenvalue set is 0 modulo N. The synthetic control
      is existentially chosen only to test the instrument, not to widen the
      mathematical claim.
    method_ceiling:
      strongest_certifiable_claim: >-
        The named relation exists on the six frozen ordinary special-j cells;
        no relation-free rank-3 configuration is found in that exact family and
        map scope.
      nearby_object_control: >-
        A same-size synthetic [1,2,4] eigenvalue triple, plus the generic-j
        rank-one family, bound the audit's ability to distinguish relation from
        no-relation and special-j from generic behavior.
    proof_obligations:
      - claim: >-
          The displayed special-j map is on-curve and agrees with scalar
          multiplication by the selected modular root.
        responsibility: correctness
      - claim: >-
          The reported coefficient vector is nonzero and its modular dot product
          is exactly zero.
        responsibility: certificate
      - claim: >-
          No relation-free conclusion is extended beyond automorphism-generated
          special-j maps on prime-order ordinary curves.
        responsibility: scope
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: >-
        The defining quadratic polynomial of the rational special-j
        automorphism and direct point-map verification.
      citation: internal frozen curve construction; no external theorem claim
      role: correctness
  reduction_chain:
    core_problem: >-
      Existence of a relation-free genuine rank-3 endomorphism witness lattice
      configuration on special-j ordinary curves.
    corollaries: []
  predictions:
    - metric: verified_map_scalar_rate
      direction: different
      minimum_effect: 1.0 on every valid special-j cell
    - metric: short_relation_present_rate
      direction: different
      minimum_effect: 1.0 for J0 and J1728 cells
    - metric: synthetic_relation_free_control_rate
      direction: different
      minimum_effect: 1.0 for the fixed [1,2,4] control at the declared modulus sizes
  test_boundary:
    instances:
      - >-
        Six frozen EXP-ENDO-001 prime-order cells: J0 and J1728 at 16, 20,
        and 24 field bits.
      - >-
        Generic-j boundary cells are included only as rank-one controls.
    parameters:
      coefficient_box: '{-1,0,1}'
      synthetic_eigenvalues: '[1,2,4] modulo N'
      relation_scope: >-
        Genuine automorphism-generated eigenvalue sets only; no arbitrary
        high-degree CM elements or extension-field maps.
    implementation: >-
      Standalone pure-Python audit using harness.toycurve.EllipticCurve and
      SymPy modular-root arithmetic; the frozen EXP-ENDO-001 files are read-only
      inputs and no existing record is modified.
    budget:
      wall_clock_seconds: 120
      maximum_memory_gb: 2
      maximum_runs: 1
  falsification_conditions:
    - >-
      A verified special-j map yields a scalar eigenvalue set with no nonzero
      relation in the declared coefficient box; the proposed obstruction is
      false at that cell and the rank-3 lane must reopen for independent review.
    - >-
      The synthetic [1,2,4] control incorrectly reports a relation, or a map
      verification fails; the instrument is invalid and no mathematical result
      may be recorded.
    - >-
      A valid relation-free configuration appears outside this special-j,
      automorphism-generated scope; that is not a falsifier, but it requires a
      new hypothesis and separately approved experiment.
  interpretation_limits:
    - >-
      This is a scoped algebraic obstruction/audit, not a lower bound and not a
      statement about all ordinary endomorphism-ring elements.
    - >-
      It does not measure the P2 first minimum, the P3 MITM cost, or any ECDLP
      attack exponent. Those remain unadjudicated by this record.
    - >-
      All results are toy-tier and tied to the six frozen cells and the exact
      map formulas named above.
  dominated_by: Pollard rho at exponent 1/2
  sota_delta:
    time_exponent: not_applicable
    memory_exponent: not_applicable
    data_or_query_exponent: not_applicable
  pareto_integrity:
    dominated_by: Pollard rho at exponent 1/2
    sota_delta: >-
      No attack-cost improvement is measured; this audit only removes an
      unverified relation-free special-j escape assumption.
  status: proposed
  proposed_by: coordinator
