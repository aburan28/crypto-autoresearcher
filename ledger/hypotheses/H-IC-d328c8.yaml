hypothesis:
  id: H-IC-d328c8
  question_id: RQ-IC-a39c7e
  statement: On the fixed toy pairing schedule, exact certificates discriminate correct interfaces and useful output
    from the listed adverse controls; coverage/new-rank benefit is unknown and may be zero.
  mechanism: "Admit E/Eprime by independent point enumeration, map on all source points with O/(0,0) projective\
    \ exceptions and all-pair homomorphism check; enumerate order11 P and distortion witness S=(-x(P),u*y(P)); verify\
    \ order, independence and nondegeneracy.; Actual Miller-based Weil pairing, with deterministic lex auxiliary\
    \ shift if evaluation poles occur (record the shift and charge search). Direct e(P,S), e(Q,S), compatible transported\
    \ e(phiP,phiS), e(phiQ,phiS), reused degree2 powers; all targets checked against known planted scalars. Require\
    \ covariance and exact nontrivial order11 image; no inferred inverse-degree normalization.; Two field bases\
    \ u and v=u+1, v\xB2-2v+2=0; preserve elements by explicit conversion, charge conversion. Exhaustive and BSGS\
    \ tiny field DLP baselines are separate phases.; Actual tiny paired number-field relation pipeline: K1=Q(i),\
    \ Z[i]; K2=Q(w), w\xB2-w+3=0, theta2=4w-2. Evaluate i->u,w->(u+2)/4, so both a-btheta images agree; project\
    \ nonzero images by exponent168 into mu11. Enumerate prime-element generators for rational primes ell<=13 (normell,\
    \ or inert integerell of normell\xB2) and units; preserve exact element identity and unit for every accepted\
    \ factorization. K1 coefficient generator bounds[-13,13], K2[-26,26]; exact norm and irreducibility/inert test,\
    \ exclude characteristic43.; For all integer(a,b) in[-16,16]^2 except zero, compute both norms and attempt exact\
    \ element division by enumerated generators in deterministic(norm,coefficient) order; accepted factorization\
    \ requires exact product=element incl unit, not smoothnorm only. Project both identities, deduplicate actual\
    \ nontrivial field images as factorbase columns, create paired homogeneous log rows. Anchor first lex nontrivial\
    \ projected image to log1; solve modulo11 only if rank/consistency certify unique relative logs. Preserve incomplete\
    \ rank otherwise.; Individual descent for each actual pairing image and base g: search entire fixed box for\
    \ matching projected element and certified smooth element identity; charge all candidate search and zero successes.\
    \ Normalize field logs by separately descended logg, verify g^a=h. Direct DLP truth is checker/baseline only,\
    \ never injected into relation solver.; Public special-ideal lattice illustration already requested: basis (5,0),(2,1),\
    \ determinant5, exact a-2b=0 mod5 census in the same box, with primitive gcd(a,b)=1 subpanel labeled separately.\
    \ Verify norm/element divisibility at the good root. This is distinct from actual paired element relations;\
    \ a0 target is reported separately as valid logarithm0, not nondegenerate image failure. No NFS complexity is\
    \ claimed."
  assumptions:
  - All field/curve/subgroup/map admissions must be independently certified in-run.
  - Known families retained by explicit user instruction; no new method or speedup established.
  proof_search_map:
    bottleneck: Actual valid field/decomposition certificates, independent reduced rank and charged complete pipeline.
    baseline_embedding:
      parameter_slice: identity map
      reproduction_check: Preserve exact baseline and mandatory nearby-object controls on the frozen schedule.
    observation_collision:
      observable:
      - compatible pairing residual failures
      - actual nondegenerate target count
      - valid paired element relations and modular matrix rank
      - verified individual field descents and recovered scalars, or explicit incomplete coverage
      distinct_preimage_search: Preserve degenerate witnesses, invalid lifts, duplicate orbit rows and positive-dimensional
        short-vector controls where applicable.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: Exact pairing interface certificates
      predicted_gain: Discrimination only; no cost improvement assumed.
    quantifier_order: For every admitted frozen fixture/case verify certificates; existential successful or faster
      solving remains unproved. No transfer beyond the finite schedule.
    method_ceiling:
      strongest_certifiable_claim: Toy observations and exact implementation witnesses pending independent review.
      nearby_object_control:
      - identity map
      - S=P must be degenerate/rejected
      - '[r] kills G and fails injection'
      - q2,r101 embedding-degree gate (integer gate only, no admitted curve)
      - random relabeling must fail group compatibility
      - degree2 power permutation preserves full subgroup average; no selected-target advantage
      - normsmooth candidate without element identity never accepted
      - missing unit or bad projected factor rejected
    proof_obligations:
    - claim: Exact admission, valid output and complete accounting in every declared panel
      responsibility: correctness
    not_applicable_reason: null
  predictions:
  - metric: compatible pairing residual failures
    direction: different
    minimum_effect: Exact valid output, zero yield, rejected adverse control or explicit instrument stop, as preregistered;
      no benefit threshold asserted.
  - metric: actual nondegenerate target count
    direction: different
    minimum_effect: Exact valid output, zero yield, rejected adverse control or explicit instrument stop, as preregistered;
      no benefit threshold asserted.
  - metric: valid paired element relations and modular matrix rank
    direction: different
    minimum_effect: Exact valid output, zero yield, rejected adverse control or explicit instrument stop, as preregistered;
      no benefit threshold asserted.
  - metric: verified individual field descents and recovered scalars, or explicit incomplete coverage
    direction: different
    minimum_effect: Exact valid output, zero yield, rejected adverse control or explicit instrument stop, as preregistered;
      no benefit threshold asserted.
  test_boundary:
    instances:
    - p
    - A
    - B
    - target_A
    - target_B
    - r
    - quadratic
    - basis_change_quadratic
