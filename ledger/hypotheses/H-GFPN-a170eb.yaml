  statement: >-
    The factor 1 + 1/(2r) at r = 32 is 65/64. It exceeds 97/100 by the
    cross gap 292 and falls short of 103/100 by the cross gap 92, both on
    the denominator 6400. At r = 16 the factor is 33/32 and at r = 20 it
    is 41/40. The first exceeds the second by 8 on the denominator 1280.
    With 400 solves and a standard deviation of 52/100, the standard error
    is exactly 13/500. The square identity 400 times 13 squared times 100
    squared equals 500 squared times 52 squared. Eleven tenths exceeds
    65/64 by 54 on the denominator 640.
  mechanism: >-
    The proposal compares a one-coefficient walk with a hashed walk through
    the factor 1 + 1/(2r) and a three-hundredths band. This contract checks
    those rationals. It does not run a walk.
