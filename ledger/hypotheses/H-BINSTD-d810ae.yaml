  title: >-
    Thirty-five surface pairs, and 19 is the only ladder prime.
  statement: >-
    The orders of 2 modulo 17, 19, 23, 29, 31, 37, 41 and 131 are 8, 18,
    11, 28, 5, 36, 20 and 130. The Euler values of those orders are 4, 6,
    10, 12, 4, 12, 8 and 48. The cyclotomic values at 2 are 17, 57, 2047,
    3277, 31, 4033, 205 and 409368176241571. The cofactors are 1, 3, 89,
    113, 1, 109, 5 and 3124947910241. In particular 2047 equals 2^11 - 1
    and equals 23 times 89, and the degree-130 value equals 131 times
    3124947910241. The stable counts 8, 4, 8, 4, 128, 4, 8 and 4 sum to
    168. The box with coefficient a from -5 to 5 contains 35 integer
    pairs. Their point counts are 1 through 16 together with 19, 20 and
    25. Among the primes 17, 19, 23, 29, 31, 37 and 41, only 19 occurs.
    The pair a = 4, b = 4 gives 25. The pair a = 3, b = 1 gives 19, and
    a = 3, b = 2 gives 20. For a = 5 and b = 6 the square 196 is 4 below
    200, and for b = 7 the product 28 exceeds 25. Since 8 is below 9, an
    elliptic count over the field of 2 elements is at most 5. Since 288
    lies strictly between 256 and 289, the surface Weil number lies
    strictly between 33 and 34.
  mechanism: >-
    The proposal separates a Frobenius-order column from a surface-count
    column. This contract checks the orders, the cyclotomic values, and
    the 35 pairs. It does not enumerate a curve.
