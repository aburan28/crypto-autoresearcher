hypothesis:
  id: H-ICLIFT-d31664
  question_id: RQ-FB3-001
  idea_id: IDEA-20260805-a7a716
  goal_id: GOAL-ICLIFT-001

  statement: >-
    SCOPE: the frozen EXP-FB3-001 counting convention -- unsigned m-multisets of
    factor-base elements, targets uniform over the whole group of prime order N,
    matched size B = ceil((6N)^(1/3)) unless explicitly swept, one relation
    harvested per hit target. CLAIM TIER toy for every measurement; the bound
    itself is scale-free algebra. NO ATTACK, NO SPEEDUP, NO CRYPTO-SCALE CLAIM,
    AND NO ASSERTION THAT ANY FACTOR BASE IS GOOD.
    The hypothesis has two parts, both falsifiable, and the second is an audit of
    an existing contract rather than a new measurement.
    PART A (the ceiling). For every factor base D of B distinct group elements,
    coverage(D) := #{targets with at least one m-multiset decomposition}/N
    satisfies coverage(D) <= min(1, mu) exactly, where mu := C(B+m-1, m)/N is the
    conserved mean yield; consequently, against a matched random base whose
    coverage is cov_rand, the coverage ratio satisfies
    coverage(D)/cov_rand <= min(1, mu)/cov_rand, and with the occupancy value
    cov_rand = 1 - e^-mu this is bounded above by e/(e-1) = 1.5819767... for
    every D, every N and every m, with equality approached only at mu = 1.
    Therefore the growth clause of RQ-FB3-001 -- a yield or coverage advantage
    that GROWS with N -- is unattainable in this channel by ARGUMENT, not by
    exhaustion of six geometries.
    PART B (the control audit). The falsifying control that DEC-20260724-020
    queues for itself -- a Bose-Chowla B_3 arm at matched B, overturning the
    decision only if its coverage-ratio CI excludes 1 upward AND its slope versus
    log2 N excludes 0 upward -- cannot falsify anything as specified, because a
    verified B_3 set attains the ceiling BY DEFINITION (all C(B+2,3) 3-multiset
    sums distinct), so its ratio is a function of mu alone and the matched-size
    convention pins mu near 1 at every size. Concretely: the ceiling at the three
    frozen sizes is 1.481042 / 1.519949 / 1.542863 with slope +0.015455 per bit,
    so the frozen slope test's null of ZERO is the wrong null; and no B_3 set of
    size ceil((6N)^(1/3)) exists at N = 2^18 at all, because C(119,3) = 273819 >
    262144 = N contradicts distinctness by pigeonhole. The archived red-team
    coverage ratio of 1.1071 is predicted to correspond to mu ~= 0.2071, i.e. to
    a base about 1.82x smaller than matched B, and therefore to be BELOW what an
    ideal base could reach at the battery's own operating point rather than 36x
    above what the battery observed.

  mechanism: >-
    DERIVED; five steps, four exact and one heuristic, and the heuristic one is
    isolated in the denominator so the conclusion can be restated without it.

    (1) CONSERVATION (exact; already pre-registered and confirmed by
    EV-FBG-001's analytic arm over 336 cells with 0 violations). Every unsigned
    m-multiset drawn from D sums to exactly one target, so
    sum_{T} Y_D(T) = C(B+m-1, m) =: M1 for every D. Hence mu := M1/N depends only
    on (B, m, N). This is why the battery's PRIMARY metric returned exactly
    1.000000 for every untyped geometry at every size: DEC-20260724-020 itself
    calls that arm "vacuous by construction".

    (2) THE CEILING (exact, pigeonhole). At most one target is newly covered per
    multiset, so N*coverage(D) <= min(N, M1) and coverage(D) <= min(1, mu), with
    equality exactly for B_m (Sidon-m) sets.

    (3) TWO-SIDED FORM (exact). With Coll(D) := sum_T Y(Y-1) counting ordered
    pairs of distinct m-multisets with equal sum, and using (Y-1) <= Y(Y-1)/2 for
    Y >= 2, one gets mu - Coll(D)/(2N) <= coverage(D) <= min(1, mu). Coverage is
    thus a first-order readout of the collision count, and the entire dynamic
    range of coverage is governed by Coll.

    (4) THE DENOMINATOR (heuristic; HEUR-ICL-C1 below). For a uniformly random
    B-subset, cov_rand = 1 - (1 - 1/N)^{M1} -> 1 - e^-mu.

    (5) THE CHANNEL BOUND. f(mu) := min(1, mu)/(1 - e^-mu) is unimodal with
    f(0+) = 1, f(1) = e/(e-1) = 1.5819767..., f(infinity) = 1. So the coverage
    advantage of ANY geometry over a matched random base is at most 1.582, at
    every N and every m. A quantity bounded by an absolute constant cannot grow
    with N.

    WHY THIS IS A CLOSURE AND NOT A FATIGUE REPORT (inventor protocol section 4).
    THE NAMED OBSTRUCTION: first-moment conservation forces the total number of
    decompositions to be geometry-free, and the pigeonhole ceiling forces the
    only remaining degree of freedom -- how those decompositions are spread over
    targets -- into a range whose top is min(1, mu) and whose comparator bottom
    is 1 - e^-mu. THE ARGUMENT: steps (1), (2) and (5). THE FORWARD GUIDANCE,
    naming what remains open and is NOT touched: (i) the cost of FINDING a
    decomposition, i.e. the summation-polynomial solve, where EV-FBG-001 itself
    records that the Gaudry-Diem extension-field advantage lives; (ii) the
    linear-algebra stage; (iii) relation rank and independence, which EV-FBG-001
    lists as unmeasured and which the collision channel Coll -- dynamic range
    Theta(B^3), unbounded and N-growing -- is the natural instrument for;
    (iv) non-uniform target measures; (v) signed and ordered conventions, which
    change M1 by roughly 2^m and hence move mu; (vi) m > 3; (vii) KN-OPEN-001,
    untouched. This hypothesis explicitly does NOT assert "structured factor
    bases cannot help index calculus", "the coverage channel is closed", or "the
    F3 family is dead" -- the three sentences DEC-20260724-020 forbids. A
    constant factor of up to 1.582 is a real if modest advantage and the record
    says so.

    A CORRECTION THE MECHANISM FORCES, recorded and NOT acted on (no existing
    file is edited): EV-FBG-001 states the metrics "score a rank-deficient base
    (for example logs {1..B}) as tied with a random base of the same size". True
    of the MEAN metric, false of COVERAGE: for logs {1..B} the 3-multiset sums
    lie in [3, 3B], so coverage = (3B-2)/N exactly -- 0.001331 at N = 2^18,
    B = 117, against a matched random base's 0.648146, a ratio of 0.00205, not 1.
    That base is therefore a designed null the coverage metric detects
    overwhelmingly, and it is the sensitivity demonstration the battery lacked.

  assumptions:
    - >-
      The frozen EXP-FB3-001 convention as stated in the scope line. Every claim
      is scoped to it. A signed or ordered convention changes M1 and hence the
      numerical evaluation, though not the form of the bound.
    - >-
      Discrete logs known by construction, for measurement only, exactly as in
      the frozen battery. No cost or attack claim follows; counting at 2^18 costs
      far more than solving the same toy instance by rho, and EV-FBG-001 already
      records that.
    - >-
      The harvest-one-relation-per-hit-target model (HEUR-ICL-C2). Under the
      alternative harvest-all model the relations per solve equal the conserved
      mean and are exactly geometry-invariant, so the channel is worth exactly 1
      rather than at most 1.582. The hypothesis's DIRECTION -- no growth -- holds
      under either model, and the contract reports both.

  proof_search_map:
    bottleneck: >-
      The step at which factor-base GEOMETRY can enter the relation-collection
      cost. Relation collection costs Theta(B / coverage(D)) attempts under the
      harvest-one model; B is fixed by the matched-size convention; so geometry
      enters only through coverage. If coverage's achievable range against a
      matched random base is bounded by an absolute constant, no refinement of
      any geometry -- present, past or future -- can change the exponent of that
      stage, and the entire six-geometry battery was measuring a channel whose
      ceiling was decidable in advance.
    baseline_embedding:
      parameter_slice: >-
        The exact parameter slice that reproduces the best-known baseline is the
        matched random base at B = ceil((6N)^(1/3)), m = 3, N in {2^14, 2^16,
        2^18} -- literally the battery's own control arm. The bound must
        reproduce, to the digit, the two facts the battery already established:
        mean-yield ratio exactly 1.000000 for every untyped geometry (from step
        1), and a maximum observed coverage excess of +0.30% inside the battery
        with the red team's outside probes at +2.69% (greedy) and +10.71%
        (Bose-Chowla), all of which must lie under f(mu_N).
      reproduction_check: >-
        Symbolic for step (1) -- the conservation identity is re-derived and
        checked against the frozen convention -- plus a frozen numeric fixture:
        the triple (B, M1, mu) = (47, 18424, 1.124512), (74, 70300, 1.072693),
        (117, 273819, 1.044537) recomputed from the integer ceiling, and the
        exact re-measurement of the matched-random coverage arm. A plot that
        merely looks similar to the battery's numbers is not a reproduction; the
        integers must match.
    observation_collision:
      observable: >-
        The coverage ratio coverage(D)/cov_rand, which is the observable the
        frozen success criterion is written against.
      distinct_preimage_search: >-
        The collision is real, is exhibited rather than hypothesised, and is the
        heart of Part B. TWO GROUND-TRUTH OBJECTS ON OPPOSITE SIDES OF THE
        CLAIMED CONCLUSION SHARE THE OBSERVABLE: (i) a Bose-Chowla B_3 base at
        its natural size, which is a maximally spread base with ZERO collisions
        and is as far from a random base as a base can get, and (ii) any base
        that happens to reach the same coverage at the same mu. Both report the
        same ratio, because the ratio is a function of mu alone at the ceiling.
        More sharply: the SAME B_3 base reports 1.1071 at mu = 0.207 and would
        report 1.54 at mu = 1.04 -- the observable moves by 40% with the
        convention while the OBJECT does not change at all. The observable
        therefore does not identify the geometry, it identifies the operating
        point, and no additional condition in the frozen protocol separates them.
        This is a direct identifiability falsifier against reading a coverage
        ratio as a property of a geometry.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace coverage (one functional of the yield histogram, range capped
          at ratio 1.582) with the second factorial moment
          Coll(D) = sum_T Y(Y-1), equivalently the count of short vectors of the
          log-relation lattice L_D = {v in Z^B : sum v_i d_i = 0 mod N} that the
          pipeline can produce. Coll preserves strictly more state than the final
          criterion requires, which is exactly the reason to track it: it is what
          survives into the relation MATRIX, where independence lives.
        predicted_gain: >-
          Dynamic range Theta(B^3) instead of a range capped at 1.582 -- exactly
          0 for a verified B_3 base against ~M1*mu ~ 2.9e5 for a matched random
          base at N = 2^18. No attack gain is claimed; the gain is that the
          instrument can, in principle, register growth, which the incumbent
          instrument provably cannot.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (coverage ratio) fixed and vary the forgotten
          structure (the base's collision profile). The arithmetic-progression
          base and a matched random base can be made to share a mean-yield ratio
          of exactly 1 while differing in coverage by a factor of 300, and a B_3
          base and a near-B_3 base can share a coverage ratio while differing in
          Coll by an unbounded factor. The intrinsic invariant distinguishing the
          fibre is Coll.
        predicted_gain: >-
          A designed graded family of bases spanning the whole collision channel
          at fixed (N, B, m), each with a pre-derived forced value -- the null
          census this lane has never had.
    quantifier_order: >-
      Written out explicitly, because the frozen criterion and the honest claim
      differ exactly here.
      THE FROZEN SUCCESS CRITERION: THERE EXISTS a geometry g such that FOR ALL
      N in {2^14, 2^16, 2^18} the coverage-ratio CI at N excludes 1 upward, AND
      the slope over those N excludes 0 upward.
      THIS HYPOTHESIS'S PART A: FOR ALL groups of order N, FOR ALL m, FOR ALL
      bases D of size B, coverage(D)/cov_rand <= f(mu(B, m, N)) <= e/(e-1).
      Note the witness dependence that matters: f depends on the INSTANCE only
      through mu, and mu is fixed by the CONVENTION, not by the base. So the
      quantity the frozen criterion tests for growth is one whose N-dependence is
      supplied entirely by the size convention. A base that saturates the ceiling
      at every N exhibits slope +0.015455/bit -- growth in the criterion's sense
      -- without any geometry-dependent effect whatsoever. The frozen criterion
      therefore admits a witness that is an artifact of the convention, and the
      correct null for its slope test is the ceiling's own slope, not zero.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that under the frozen convention and the harvest-one model, the
        coverage advantage of any factor base over a matched random base of the
        same size is bounded by min(1, mu)/cov_rand, hence by e/(e-1) under the
        occupancy denominator, hence cannot grow with N. It CANNOT certify that
        structured factor bases are useless, that the solve is unaffected, that
        relation rank is unaffected, or anything at all about non-uniform target
        measures. Writing it up as any of those would be the premature-closure
        failure mode this program is explicitly warned against.
      nearby_object_control: >-
        The nearby object where the hoped-for conclusion FAILS -- i.e. where a
        structured description of the factor base demonstrably does help -- is
        the number-field sieve, whose factor base is algebraically described and
        which works subexponentially, and Gaudry-Diem extension-field index
        calculus, whose 1/n! decomposition probability IS the conservation mean
        (EV-FBG-001 states this). A method that cannot explain why the bound does
        not also refute those has not identified the load-bearing structure.
        THE ANSWER THIS HYPOTHESIS OWES, AND STATES: in both cases the advantage
        lives in the SOLVE and in the choice of ambient space, not in the spread
        of a fixed-size base over a fixed target group, so the bound does not
        apply to them -- and if a reviewer shows that it formally does, the bound
        is wrong, because those two methods work.
    proof_obligations:
      - claim: sum_T Y_D(T) = C(B+m-1, m) for every D.
        responsibility: correctness
      - claim: coverage(D) <= min(1, mu), with equality iff D is a B_m set.
        responsibility: correctness
      - claim: mu - Coll/(2N) <= coverage(D).
        responsibility: correctness
      - claim: sup_{mu > 0} min(1, mu)/(1 - e^-mu) = e/(e-1), attained at mu = 1.
        responsibility: strictness
      - claim: cov_rand = 1 - e^-mu + o(1) for a uniformly random B-subset.
        responsibility: success_probability
      - claim: No B_3 set of size ceil((6N)^(1/3)) exists at N = 2^18.
        responsibility: feasibility
      - claim: The bound is scoped to the harvest-one model and the uniform target measure.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim:
    problem: >-
      The relation-collection stage of index calculus over a group of prime order
      N, under the frozen EXP-FB3-001 convention.
    prior_best: >-
      Empirically, EV-FBG-001's measured maximum coverage excess of +0.30% inside
      the battery and the red team's +2.69% and +10.71% outside it; no bound of
      any kind was previously derived, and the growth clause was open.
    time_exponent: >-
      Unchanged. The stage costs Theta(B/coverage) attempts with
      B = Theta((m! N)^{1/m}) and coverage = Theta(min(1, mu)); geometry
      multiplies this by a factor in [1/1.582, 1.582] and by nothing more. The
      claim is a NEGATIVE exponent statement: no exponent moves in this channel,
      and that is proved rather than observed.
    memory_exponent: >-
      Unchanged by the result. Of the measurement itself: O(N) target counters
      per cell -- 262144 at N = 2^18 -- charged here rather than omitted.
    hidden_cofactor: >-
      None in the bound; it is exact. In the constant e/(e-1) the whole content
      of the heuristic denominator is hidden, and it is named as HEUR-ICL-C1
      rather than absorbed.
    claim_kind: constant_factor

  heuristic_assumptions:
    - id: HEUR-ICL-C1
      formal_statement: >-
        FOR ALL N, FOR ALL B with mu = C(B+m-1,m)/N bounded, the expected
        coverage of a uniformly random B-subset D of an abelian group of order N
        satisfies E[coverage(D)] = 1 - (1 - 1/N)^{M1} + o(1), and the coverage of
        a single random draw concentrates around that value.
      random_model_justification: >-
        The M1 multiset sums are treated as M1 independent uniform draws from the
        group, which is the standard occupancy model. The correlations among sums
        that share a base element are the entire content of the approximation and
        are not bounded here.
      supporting_results: []
      validation_experiment_ids: [EXP-ICLIFT-7c0728]
      falsification_condition: >-
        Measured coverage of >= 32 independent random bases departing from
        1 - (1 - 1/N)^{M1} by more than 2% at any tested (N, B). Note that a
        failure does NOT void the ceiling coverage(D) <= min(1, mu), which is
        exact; it voids only the constant e/(e-1), which would then be replaced
        by min(1, mu) divided by the MEASURED random coverage.
    - id: HEUR-ICL-C2
      formal_statement: >-
        THERE EXISTS a fixed pipeline model such that FOR ALL bases the
        relation-collection stage extracts at most one usable relation per hit
        target, targets being drawn uniformly and independently.
      random_model_justification: >-
        This is a model of the pipeline rather than a probabilistic assumption
        about a random object, and it is recorded as load-bearing precisely
        because it is not derivable. EV-FBG-001 records the alternative
        harvest-all model and notes that under it the relations per solve equal
        the conserved mean and are exactly geometry-invariant.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        A documented pipeline extracting more than one independent relation from
        repeated decompositions of one target. This would not overturn the bound;
        it would select the other branch, in which the channel is worth exactly 1.

  structural_ingredients:
    - description: >-
        Sidon / B_h sets and the Bose-Chowla construction of a B_h set of size q
        inside Z_{q^h - 1}.
      citation: >-
        RECALLED, UNVERIFIED. No author, year, venue, theorem number or page is
        asserted. The experiment does not rely on the construction's provenance:
        whatever set is used has its B_3 property VERIFIED directly by checking
        that all C(B+2,3) sums are distinct, which makes the citation
        unnecessary.
      role: >-
        Supplies the extremal object that attains the coverage ceiling, hence the
        positive control whose forced value is exact.
    - description: >-
        The occupancy / balls-in-bins limit 1 - e^-mu for the fraction of
        occupied bins after M1 = mu*N throws.
      citation: >-
        Standard and elementary; recalled, not cited, and carried as
        HEUR-ICL-C1 rather than as a theorem.
      role: Supplies the denominator of the coverage ratio.

  reduction_chain:
    core_problem: >-
      Whether factor-base GEOMETRY can produce a decomposition-yield or coverage
      advantage that grows with N under the frozen convention (RQ-FB3-001's
      growth clause).
    corollaries:
      - problem: >-
          Whether the Bose-Chowla arm queued by DEC-20260724-020 can falsify that
          decision as specified.
        reduction_ref: >-
          Immediate from Part A plus the definition of a B_3 set; no external
          reduction is cited.
        asymptotics_preserved: >-
          Yes -- the corollary is exact and inherits the same scope.
      - problem: >-
          Whether the frozen slope-versus-log2-N test uses the correct null.
        reduction_ref: >-
          Immediate from evaluating f(mu_N) under the matched-size convention;
          the ceiling's own slope is +0.015455 per bit over the three frozen
          sizes.
        asymptotics_preserved: >-
          Yes, within the frozen size range; the ceiling continues to rise
          monotonically toward e/(e-1) over 2^13..2^24.

  predictions:
    - metric: sup over all bases of coverage(D)/cov_rand
      direction: lower
      minimum_effect: >-
        e/(e-1) = 1.5819767, attained only at mu = 1. Any measured ratio above
        1.582 falsifies the derivation or the counter.
    - metric: f(mu_N) at the three frozen battery sizes
      direction: higher
      minimum_effect: 1.481042 / 1.519949 / 1.542863, exact to 6 decimals.
    - metric: slope of f(mu_N) versus log2 N over the three frozen sizes
      direction: higher
      minimum_effect: >-
        +0.015455 per bit, strictly positive; the frozen null of 0 is therefore
        mis-specified.
    - metric: coverage of a verified B_3 base
      direction: different
      minimum_effect: >-
        EXACTLY M1/N when mu <= 1, and Coll exactly 0. Positive control; failure
        blocks every negative report.
    - metric: coverage of the arithmetic-progression base with logs {1..B}
      direction: lower
      minimum_effect: >-
        EXACTLY (3B-2)/N, i.e. 0.001331 at N = 2^18, while its mean-yield ratio
        is exactly 1.000000. Designed-failure null; both halves can fail.
    - metric: mu recovered by inverting f at the archived value 1.1071
      direction: lower
      minimum_effect: >-
        0.2071 on the mu < 1 branch (the mu > 1 root is 2.3357 and is excluded by
        the matched-size convention).

  test_boundary:
    instances:
      - groups of prime order N in {2^12, 2^14, 2^16, 2^18, 2^20}
      - m = 3 primary; m = 2 and m = 4 as a convention check
      - >-
        four base families: matched random (null), verified B_3 (positive
        control), arithmetic progression (designed-failure null), greedy
        low-collision (treatment)
    parameters:
      matched_size: B = ceil((6N)^(1/3)) for the reproduction arm
      swept_size: B chosen so mu in {0.05, 0.2, 0.5, 1.0, 2.0, 5.0} for the graded arm
      counting_convention: unsigned m-multisets, targets uniform over the whole group
      harvest_model: one relation per hit target, with the harvest-all branch reported alongside
    implementation: experiments/EXP-ICLIFT-7c0728
    budget:
      wall_clock_seconds: 3600
      maximum_memory_gb: 4
      maximum_runs: 8

  falsification_conditions:
    - Any measured coverage ratio strictly above min(1, mu)/cov_rand at any cell.
    - A verified B_3 set whose measured coverage is not exactly M1/N.
    - >-
      Measured random-base coverage departing from 1 - e^-mu by more than 2% at
      any tested size with >= 32 draws; the constant e/(e-1) is then withdrawn and
      replaced by the measured ratio, though the exact ceiling survives.
    - >-
      The archived Bose-Chowla probe shown to have been run at mu ~ 1 with a
      genuinely verified B_3 set -- impossible by pigeonhole at the frozen
      matched B, so observing it falsifies either the archived configuration or
      this derivation.
    - >-
      A demonstration that the frozen pipeline harvests all Y(T) decompositions
      per target rather than one; the framing (not the algebra) is then wrong and
      the channel is worth exactly 1 rather than at most 1.582.

  interpretation_limits:
    - >-
      Bounds the coverage / relation-collection channel only. Says nothing about
      the decomposition SOLVE, the linear-algebra stage, relation rank and
      independence, or non-uniform target measures -- all four open, all four
      where an exponent could still live.
    - >-
      Does not license "structured factor bases cannot help index calculus",
      "the coverage channel is closed", or "the F3 family is dead". A factor of
      up to 1.582 is a real if modest advantage.
    - KN-OPEN-001 is untouched.
    - >-
      Toy claim tier for every measurement (N <= 2^20, logs known by
      construction). The bound is scale-free algebra and is not a toy-scale
      extrapolation, but any evidence record arising from the measurements is
      toy and must say so.
    - >-
      A ceiling is not an attainment. At mu > 1 the value min(1, mu) = 1 is
      unattainable by any set, and no B_3 set of the matched size exists at all.
      "Achievable advantage" must never be written where "ceiling" is meant.

  status: proposed
