hypothesis:
  id: H-ECRANK-7f0ec1
  question_id: RQ-ECRANK-27dcc5
  goal_id: GOAL-ECRANK-002
  recorded_at: '2026-09-13'
  converts_idea: IDEA-20260829-c7472b
  converts_idea_note: >
    Converts the only well-developed unconverted proposal on
    RQ-ECRANK-27dcc5, selected per
    `python3 tools/audit_proposal_backlog.py --question RQ-ECRANK-27dcc5
    --list` (scanning all branch tips). The proposal audits whether this
    program's own flagship rank-exactness claim (EV-ECQ-0d142e OBS-3,
    "rank E(Q) is EXACTLY 12" because PARI ellrank returned an
    "unconditional" upper bound of 12) is secretly GRH-conditional
    through the class-group computation ellrank performs internally --
    a controls-before-belief integrity check of this program's own
    strongest existing claim over Q, in the spirit of AGENTS.md's
    inventor protocol and target-result-profile honesty requirements.
    Selection rationale and pre-allocated IDs supplied by the
    orchestrating session; not re-litigated here.
  designed_by: TASK-20260913-e41247
  experiment_contract: EXP-ECRANK-b23a5e
  refines: null
  statement: >
    THREE PARTS, EACH FALSIFIABLE SEPARATELY. (A) THE OBJECT. For any
    committed rank statement, define its TRUST SURFACE as the multiset
    of labels of every step a from-scratch verifier, given only the
    witness, must accept without recomputing: EXHIBITED ARITHMETIC
    (recomputable in exact integers or rationals), a CITED THEOREM
    (a named theorem applied to exhibited, hypothesis-checked data), a
    FLOATING COMPUTATION (accepted without a rigorous error bound), or a
    CONDITIONAL SUBROUTINE (accepted only under an unproven hypothesis,
    e.g. GRH) -- or NON-INDEPENDENT (a call to the producer's own engine,
    which docs/claims-and-verification.md forbids for a verifier). A
    witness is checkable exactly when its trust surface contains only
    EXHIBITED and THEOREM; a rung is reported at the WEAKEST label
    anywhere in its verification path, never at an average, because the
    trust surface of a composed certificate is the UNION of the surfaces
    of its parts. (B) THE SUSPECTED CELL. EV-ECQ-0d142e OBS-3 states rank
    E(Q) is EXACTLY 12 for its best curve because "PARI ellrank returned
    r_high = 12" and "r_high = 12 is an unconditional upper bound" (also
    proof_status_detail item (ii) and boundary B-7). Klagsbrun, Sherman
    and Weigandt needed GRH to pin the Elkies curve at rank exactly 28,
    via class-group computations of associated cubic fields
    (arXiv:1606.07178); PARI's own documentation describes the bnf
    function family as sub-exponential algorithms for class and unit
    groups UNDER GRH, with bnfcertify the function that removes the
    hypothesis. THE CLAIM IS THAT THE WORD "UNCONDITIONAL" IN
    EV-ECQ-0d142e IS UNAUDITED AND MAY BE WRONG, and that this is settled
    by naming ellrank's code path on the rank-12 curve and running
    bnfcertify on whatever number field it constructs. EITHER ANSWER IS
    A RESULT and neither is failure: "unconditional, certified" restores
    the claim with a basis it currently lacks (a real, welcome outcome
    this design would most like to find); "GRH-conditional" means the
    claim must be restated under the two-record rule of
    docs/claims-and-verification.md. (C) THE PRICE. Removing GRH from a
    class-group computation over a cubic field A of discriminant d_A
    means searching to the Minkowski bound, of order sqrt|d_A|, instead
    of Bach's bound 12 log^2|d_A| -- for the rank-12 curve's cubic field
    (log_10|d_A| expected near 50 or above, a6 of order 1.4e26) that gap
    is roughly 20 orders of magnitude and is an EXPONENT, not a constant.
    There is therefore a CERTIFIABILITY HORIZON in log_10|d_A| beyond
    which no exact-rank statement over Q can be made unconditionally by
    this route, and it is measured (Arm 2), never asserted.
  mechanism:
    trust_surface_classification: >
      Mechanical labelling. Take a committed rank statement and its
      witness. Walk the verification path a from-scratch implementation
      would have to execute and label every step EXHIBITED, THEOREM,
      FLOAT, CONDITIONAL, or NON-INDEPENDENT (definitions in
      `statement` part A). A step is labelled THEOREM only if a named
      theorem is cited AND its hypotheses are exhibited and checked in
      the witness -- this rule is fixed before the audit and published
      with the table (mitigates classifier subjectivity; two independent
      labellers disagreements are reported, never resolved silently).
      Composition is by UNION of labels; a rung is reported at its
      weakest label. This is a computable classification, not a
      judgement, and it produces the certificate-strength column
      RQ-ECRANK-27dcc5's decision target asks for and that no committed
      record currently contains.
    grh_audit_of_ellrank: >
      The GRH cell is a measurement, not an argument. For a curve E,
      2-descent works in the algebra A = Q[x]/f(x); the Selmer group is
      cut from the S-unit group A(S,2) by local conditions, and computing
      A(S,2) requires the class group and unit group of A. Under GRH
      those are obtained by searching relations over prime ideals of
      norm below Bach's bound 12 log^2|d_A|; unconditionally the same
      search must reach the Minkowski bound, of order sqrt|d_A| up to a
      bounded constant. PARI exposes exactly this distinction as
      bnfcertify. For a ladder of curves of increasing coefficient size,
      compute the 2-descent field, attempt bnfcertify under a fixed
      budget, and record where it stops -- that boundary is the
      certifiability horizon, measured rather than asserted.
    quantifier_order_reminder: >
      FOR EACH committed rung r, THERE EXISTS a verification path P(r)
      such that FOR ALL steps s in P(r), label(s) is in
      {EXHIBITED, THEOREM}. The existential over paths is essential and
      is the honest weak point: a rung labelled FLOAT or CONDITIONAL
      means the COMMITTED WITNESS's path contains that step, never that
      no float-free or GRH-free path exists. The strong FOR-ALL-PATHS
      statement is not claimed anywhere.
  assumptions:
  - >
    THIS HYPOTHESIS AND ITS EXPERIMENT CHANGE NO STATUS AND EDIT NO
    RECORD. If the audit finds EV-ECQ-0d142e's exactness claim is
    GRH-conditional, the remedy is a NEW record superseding the
    statement, authored by the Coordinator under the two-record rule,
    never an edit of EV-ECQ-0d142e.
  - >
    The trust-surface classification is applied to WITNESSES AS
    COMMITTED. Where a committed certificate does not contain enough
    information to walk the verification path, that is recorded as an
    incomplete witness -- itself a finding about checkability -- and
    never filled in by inference about what the producer probably did.
  - >
    bnfcertify's success is evidence the class and unit group data are
    unconditional; its failure or timeout is an INFRASTRUCTURE outcome
    (AGENTS.md rule 3) and never evidence that the data are wrong. A
    bnfcertify timeout, including on the conductor-37/53 controls, is
    `invalid_measurement` for the affected field, never a mathematical
    result.
  proof_search_map:
    bottleneck: >
      The single step whose removal would change what may be CLAIMED, as
      opposed to what may be computed: the source of the upper bound in
      any exactness statement. Lower bounds are exhibited and cheap;
      upper bounds require descent, descent requires S-units, S-units
      require a class group, and a class group is where GRH enters.
      Everything else on this question's ladder is already unconditional.
    baseline_embedding:
      parameter_slice: >
        A curve small enough that the 2-descent field's class group can
        be certified outright -- the conductor-37 rank-1 control curve
        EV-ECQ-0d142e OBS-8 already used (18 supplied points, certified
        rank exactly 1) and, at the small end of the ladder, a
        conductor-53 curve. There the conditional and unconditional
        answers coincide and bnfcertify returns in milliseconds.
      reproduction_check: >
        Run the full audit on the conductor-37 curve first. The pipeline
        must classify its exactness claim UNCONDITIONAL, with bnfcertify
        succeeding, before any curve is classified conditional -- a
        classifier that calls everything conditional is as useless as
        one that calls everything exhibited (this is control GRH-BASELINE
        below).
    observation_collision:
      observable: the trust-surface label multiset of a rung
      distinct_preimage_search: >
        COLLISION FOUND AND STATED, not hidden: two rungs of wildly
        different rank and content can share a label multiset
        ({EXHIBITED, THEOREM} covers both a rank-64 and a rank-2
        statement), so the trust surface is a STRENGTH coordinate and
        never a rank coordinate -- a column beside the rank, never a
        substitute for it. A second, more dangerous collision: a rung
        can be labelled {EXHIBITED, THEOREM} while resting on a theorem
        FALSE AS APPLIED (e.g. the multiquadratic decomposition applied
        to a V that is not a subgroup). Label THEOREM therefore requires
        the theorem's hypotheses to be exhibited and checked; the
        conformance suite's seeded faults include exactly this case
        (non-subgroup V).
    quantifier_order: see mechanism.quantifier_order_reminder above.
    method_ceiling:
      strongest_certifiable_claim: >
        A per-rung strength label and a measured certifiability horizon
        in log_10|d_A|. The method can never prove a rung UNCERTIFIABLE
        (a for-all over methods), never raise any rank, never remove GRH
        from anything, and never establish that any class group computed
        under GRH is wrong. Its strongest negative is "the committed
        witness for this rung contains a step of kind X" -- a statement
        about an artifact.
      nearby_object_control: >
        The classifier must return a clean surface on the degree-32
        eigenspace certificate and the 31-point F_l reduction certificate
        (RUN-ECQ-f5af06-v2-A-certify) -- both float-free and
        descent-free by construction -- and must flag the degree-16
        multiplicity certificate, known to rest on a 64-digit regulator.
        A classifier that cannot separate that pair has identified
        nothing (control CLASSIFIER-SEPARATION below).
    proof_obligations:
    - claim: each label is justified by a named step in a named committed artifact
      responsibility: correctness
    - claim: a rung is reported at the WEAKEST label anywhere in its path, never at an average
      responsibility: strictness
    - claim: a bnfcertify timeout is reported as an infrastructure outcome
      responsibility: scope
    - claim: any adverse finding about a committed record is routed to the Coordinator as a proposed supersession, never applied as an edit
      responsibility: interface
  rerandomization: none
  rerandomization_note: >
    No randomization anywhere. The 9 rungs are a fixed enumeration of
    already-committed records; the discriminant ladder is drawn from
    already-committed certified-fibre pools by a frozen coefficient-size
    ordering rule; the 12 seeded faults are frozen mutations of a frozen
    valid witness. bnfcertify itself is deterministic given its inputs
    and budget.
  asymptotic_claim: null
  asymptotic_claim_note: >
    No complexity-improvement claim is made anywhere in this hypothesis.
    HA-1 below is a cost-model heuristic used to INTERPRET a measurement
    (the certifiability horizon), not a claimed improvement to any
    algorithm; nothing here reduces the cost of solving a central hard
    problem, so the four promotion gates of AGENTS.md do not engage.
  heuristic_assumptions:
  - id: HA-1
    formal_statement: >
      For a cubic number field A of discriminant d_A, the cost of
      verifying the class and unit group WITHOUT GRH is modelled as
      proportional to the number of prime ideals of norm below the
      Minkowski bound M(A) = (4/pi)^{r_2} (n!/n^n) sqrt|d_A|, i.e.
      |d_A|^{1/2+o(1)}, while the cost under GRH is proportional to the
      number below Bach's bound 12 log^2|d_A|, i.e. (log|d_A|)^{2+o(1)}.
      The ratio at fixed |d_A| is superpolynomial in log|d_A|.
    random_model_justification: >
      PROVEN BOUNDS FIXING THE QUANTITIES: Minkowski's bound is
      unconditional and exact as stated; Bach's 12 log^2|d_K| generating
      bound is proven under GRH. Both are theorems; the modelling is only
      in converting a search bound into a cost. CLASSICAL DISTRIBUTION
      THEOREM IMITATED: Landau's prime ideal theorem (number of prime
      ideals of norm below X is X/log X (1+o(1))), applied to each bound;
      Cohen-Lenstra for the class-group structure the relations must
      generate.
    supporting_results:
    - description: Minkowski's bound (unconditional)
      citation: Minkowski's theorem, standard algebraic number theory
      provenance: recalled
      verified_by: null
      role: size bound on the unconditional search
    - description: Bach's GRH-conditional generating bound 12 log^2|d_K|
      citation: Bach 1990, "Explicit bounds for primality testing and related problems"
      provenance: recalled
      verified_by: null
      role: size bound on the GRH-conditional search
    - description: Landau's prime ideal theorem
      citation: Landau, prime ideal theorem for number fields
      provenance: recalled
      verified_by: null
      role: converts a norm bound into a cost via the prime-ideal counting function
    - description: Cohen-Lenstra heuristics for class-group structure
      citation: Cohen-Lenstra 1984
      provenance: recalled
      verified_by: null
      role: distributional model for the class group the relations generate
    obstruction_declared: >
      Real implementations are cleverer than naive norm-bounded
      enumeration, so |d_A|^{1/2} is an upper bound on the unconditional
      cost of the NAIVE route, not a lower bound on any algorithm. The
      Arm-2 measurement is what makes the claim empirical rather than
      rhetorical; no lower bound is claimed anywhere.
    validation_experiment_ids: [EXP-ECRANK-b23a5e]
    validation_plan: >
      SAMPLE: at least 20 cubic 2-descent fields drawn from the 137
      certified fibres of certified_curves.json and the 1,206-curve pool,
      spanning log_10|d_A| as widely as the pools allow, plus the
      conductor-37 and conductor-53 control fields at the small end and
      the rank-12 curve's field at the large end. SCALE: 20-40
      bnfcertify calls at two budgets, at most about 40 CPU-hours worst
      case. PREDICTED DISTRIBUTION: log wall clock against log_10|d_A|,
      fitted against slope 1/2 in |d_A| (i.e. (1/2)ln(10) per unit of
      log_10) for the unconditional arm and flat-in-|d_A| for the GRH
      arm. TAIL CHECKS: the single largest |d_A| certified, and the
      single smallest |d_A| that timed out -- if these overlap, the
      horizon is not sharp and is reported as an interval.
    falsification_condition: >
      A measured tail check in which the largest certified |d_A| and the
      smallest timed-out |d_A| do NOT overlap yet the fitted wall-clock
      growth is inconsistent with the modelled 1/2-vs-flat slopes (e.g.
      growth compatible with a fixed polynomial exponent under BOTH
      budgets) falsifies HA-1's modelling at the tested scope; this is
      reported as a finding against HA-1, never as an infrastructure
      failure unless it stems from a bnfcertify timeout.
  - id: HA-2
    formal_statement: >
      For E/Q of naive height H, the discriminant of the cubic field
      A = Q[x]/f(x) attached to its 2-descent satisfies
      log|d_A| = c * log H (1+o(1)) for a constant c of order 1, and
      omega(d_A) behaves like that of a random integer of the same size
      (log log|d_A| with Erdos-Kac normal fluctuations).
    random_model_justification: >
      PROVEN BOUND FIXING THE QUANTITY: d_A divides disc(f) up to square
      factors and disc(f) = -(4A^3+27B^2) is explicit in the curve
      coefficients, so log|d_A| <= log|disc f| + O(1) = O(log H)
      unconditionally -- the upper direction is a theorem; only the
      constant and the lower direction are modelled. CLASSICAL
      DISTRIBUTION THEOREM IMITATED: Hardy-Ramanujan and Erdos-Kac for
      the number of prime factors of a random integer, applied to d_A
      modelled as a random integer of its size.
    supporting_results:
    - description: disc(f) = -(4A^3+27B^2) is explicit in the Weierstrass invariants
      citation: standard elliptic-curve discriminant formula
      provenance: recalled
      verified_by: null
      role: unconditional upper bound fixing log|d_A| = O(log H)
    - description: Hardy-Ramanujan / Erdos-Kac normal order of omega(n)
      citation: Hardy-Ramanujan 1917; Erdos-Kac 1940
      provenance: recalled
      verified_by: null
      role: distribution law for the number of prime factors of a random integer of d_A's size
    obstruction_declared: >
      Only the upper direction (log|d_A| = O(log H)) is a theorem; the
      constant c and the lower direction are modelled, and a curve whose
      f factors favourably can have a small 2-descent field despite huge
      coefficients -- the rank-12 curve's f may well factor this way,
      which is the single most likely route by which P1 resolves in the
      reassuring direction (confounder, carried into the experiment).
    validation_experiment_ids: [EXP-ECRANK-b23a5e]
    validation_plan: >
      SAMPLE: all 137 certified fibres plus a 200-curve sample of the
      1,206-curve pool (about 340 curves); compute f, disc(f), the
      maximal order and d_A where feasible, factor d_A where feasible.
      SCALE: minutes for discriminants, longer for factorisations,
      attempted under a frozen budget and reported incomplete on
      failure. PREDICTED DISTRIBUTION: the fitted constant c in
      log|d_A| = c log H with residuals; empirical distribution of
      (omega(d_A) - log log|d_A|)/sqrt(log log|d_A|) against the standard
      normal (Erdos-Kac). TAIL CHECKS: the curves with smallest d_A
      relative to H -- if the rank-12 curve is among them, checked
      directly rather than left to the fit.
    falsification_condition: >
      The rank-12 curve's field discriminant, once computed, checked
      directly against the small-d_A tail of the fitted distribution
      (per the tail check above); a persistent, replicated deviation of
      the empirical (omega - loglog)/sqrt(loglog) distribution from the
      standard normal beyond stated error bars falsifies the Erdos-Kac
      half of HA-2 at the tested scope.
  - id: HA-3
    formal_statement: >
      The detection rate of a conformance suite against SEEDED faults
      estimates its detection rate against unseen implementation faults
      (the mutation-testing coupling assumption).
    random_model_justification: >
      PROVEN HALF, the important one: the soundness lemmas of the two
      certificate kinds are theorems (an F_l rank equal to m implies
      independence; distinct Galois characters imply distinct isotypic
      components), so a correct verifier CANNOT accept a false witness
      on the mathematics -- every residual risk is implementation-level,
      which is what the suite targets. CLASSICAL DISTRIBUTION THEOREM
      IMITATED: NONE, and this is declared as a missing half. Mutation
      testing has no number-theoretic distribution law behind it; HA-3
      is justified only by software-engineering practice.
    obstruction_declared: >
      No distributional backing exists for the mutation-coupling
      assumption itself; this is the weakest-supported heuristic in this
      hypothesis and P4 is its only test.
    validation_experiment_ids: [EXP-ECRANK-b23a5e]
    validation_plan: >
      SAMPLE: 12 pre-declared seeded faults plus the one historically
      observed real fault (16 points landing on an isomorphic but
      different model through coset cancellation, EV-ECRANK-b6c9b6).
      SCALE: 13 mutants x 2 verifier implementations. PREDICTED
      DISTRIBUTION: none claimed; the reported quantity is a raw
      detection count with denominator and the explicit list of
      undetected faults. TAIL CHECK: the real historical fault MUST be
      detected; failure there invalidates the suite regardless of the
      synthetic score.
    falsification_condition: >
      The real historical fault (coset-cancellation off-model points) is
      NOT detected by the independent verifier. This falsifies HA-3's
      practical value at the tested scope regardless of the synthetic
      detection count, per the tail check above.
  structural_ingredients:
  - description: >
      Klagsbrun-Sherman-Weigandt: an exact rank-28 determination for a
      record curve over Q is GRH-conditional through class-group
      computation of associated cubic fields -- the published precedent
      motivating part (B).
    citation: arXiv:1606.07178, "The Elkies Curve has Rank 28 Subject only to GRH"
    provenance: retrieved
    verified_by: >
      idea-generator session 2026-08-29, WebFetch of arxiv.org/abs/1606.07178.
      CAVEAT CARRIED FROM THE PROPOSAL: only the abstract-page rendering
      was read, not the full paper or theorem numbering; a full-text read
      is a pre-registered step before this citation is load-bearing
      beyond motivation.
    role: motivating precedent for the GRH-conditional exact-rank pattern
  - description: >
      PARI's bnf function family implements sub-exponential class/unit
      group algorithms UNDER GRH; bnfcertify removes the hypothesis.
    citation: PARI/GP documentation, "General number fields" (pari.math.u-bordeaux.fr)
    provenance: retrieved
    verified_by: >
      idea-generator session 2026-08-29, WebSearch. CAVEAT CARRIED FROM
      THE PROPOSAL AND MATERIAL: this is a search-tool summary of
      documentation, not a direct read of the PARI documentation or of
      the ellrank source. Settling whether ellrank itself is
      GRH-conditional is exactly what R2 of EXP-ECRANK-b23a5e must do by
      reading the source and running the function; nothing here is
      quoted as establishing that fact yet.
    role: names the mechanism (bnf/bnfcertify) the audit measures
  - description: >
      EV-ECQ-0d142e's per-claim proof_status breakdown, the nearest
      existing thing to a hand-written trust surface, and the specific
      claim (OBS-3, boundary B-7) this hypothesis audits.
    citation: ledger/evidence/EV-ECQ-0d142e.yaml
    provenance: internal
    verified_by: coordinator (this session, full read)
    role: the audited claim and the row-7 comparator this proposal composes with, not dominates
  - description: >
      The independence rule for verifiers, the certificate-vs-negative
      distinction, and the two-record rule for heuristic-conditional
      claims.
    citation: docs/claims-and-verification.md
    provenance: internal
    verified_by: coordinator (this session, full read)
    role: governs how a GRH-conditional finding, if any, must be recorded
  - description: >
      The program's closest existing frozen witness schema (Cremona-Brumer
      style: character basis, good primes, point/torsion rows, exact F2
      matrix, matrix rank, torsion-row rank, halving witnesses), which
      Arm 3's schema must EXTEND rather than duplicate.
    citation: ledger/goals/GOAL-ECQ-e72c0b/goal.yaml (completion criterion 3)
    provenance: internal
    verified_by: idea-generator session 2026-08-29, full read (per proposal dominated_by row 9)
    role: baseline schema Arm 3 extends to the eigenspace certificate kind
  reduction_chain:
    core_problem: null
    core_problem_note: >
      Not a reduction-chain hypothesis. This is an audit of an existing
      certificate's trust surface, not a construction reducing one
      problem to another.
    corollaries: []
  predictions:
  - id: P1
    metric: >
      the GRH status of the upper bound r_high = 12 that EV-ECQ-0d142e
      cites as "unconditional", determined by naming the code path PARI
      ellrank takes on that exact curve and running bnfcertify on
      whatever number field it constructs
    direction: >
      the bound is found to depend on a GRH-conditional class or unit
      group computation, unless bnfcertify succeeds on the relevant field
    minimum_effect: >
      a binary determination with the code path named and the field's
      discriminant recorded. BOTH answers are a result and BOTH are
      distinguishable outcomes of this hypothesis, not a
      success/failure pair: "unconditional, certified" RESTORES the
      claim with a basis it currently lacks and is the outcome this
      design would most like to find -- it VINDICATES EV-ECQ-0d142e, it
      does not refute it; "GRH-conditional" means the claim must be
      restated under the two-record rule of docs/claims-and-verification.md.
      A total bnfcertify failure at every budget, including on the
      conductor-37/53 controls, is a THIRD outcome and is `invalid_measurement`,
      never evidence for either branch (see falsification_conditions).
  - id: P2
    metric: >
      the certifiability horizon -- the largest log_10|d_A| of a
      2-descent field for which bnfcertify returns success within a
      frozen budget of 3600 s and 8 GB
    direction: finite and small relative to record curves
    minimum_effect: >
      the horizon lies at log_10|d_A| between 10 and 45, and the rank-12
      curve's own field (expected near log_10|d_A| = 50 or more) lies
      ABOVE it. Negative branch, stated as a real possible outcome and
      NOT a failure: if the horizon exceeds log_10|d_A| = 60 the
      exactness claim is cheaply rescuable and the whole part-(C)
      concern is smaller than stated -- a falsification in the direction
      that helps the program.
  - id: P3
    metric: >
      number of the 9 enumerated frontier rungs whose trust surface
      contains only EXHIBITED and THEOREM labels
    direction: small; most rungs carry a FLOAT or a CONDITIONAL
    minimum_effect: >
      at most 4 of 9 clean, each label traced to a named step in a named
      committed artifact. Negative branch: more than 6 clean means the
      classifier is too permissive and must be re-tested against the
      seeded-fault suite (R3) before its column is published -- this is
      a finding about the classifier's calibration, not a claim about
      the rungs.
  - id: P4
    metric: >
      detection rate of a frozen conformance suite of at least 12 seeded
      faults (off-curve point, torsion point counted as independent,
      duplicated point, dependent triple, wrong twist model after a
      coset cancellation, non-subgroup V, subproduct that is a square,
      prime of bad reduction used, torsion row omitted, l dividing the
      lattice index, regulator nonsingular for dependent points, and a
      producer-state read instead of a recompute) plus the one real
      historical fault
    direction: increase toward 1
    minimum_effect: >
      at least 11 of 12 synthetic faults detected by an independent
      verifier given only the witness, AND the real historical fault
      detected (non-negotiable per HA-3's tail check). Negative branch:
      below 11 of 12, the witness FORMAT is underspecified -- some
      faults are invisible in the artifact -- and the missing fields
      become the deliverable, which is itself a useful, non-failing
      result about Arm 3's schema.
