  falsification_conditions:
  - >
    The classifier fails the separation control -- it flags the
    degree-32 eigenspace certificate, or fails to flag the degree-16
    multiplicity certificate. The whole table is then uninterpretable.
  - >
    P1 resolves as "unconditional, and bnfcertify succeeds on every field
    ellrank constructs for that curve". EV-ECQ-0d142e's exactness claim
    is then VINDICATED with a basis it currently lacks, and part (C) of
    this hypothesis is a smaller concern than stated. THIS IS A REAL
    POSSIBLE NEGATIVE FOR THE HYPOTHESIS AND IS THE OUTCOME THE DESIGN
    WOULD MOST LIKE TO BE WRONG ABOUT -- it is not a failure of this
    experiment.
  - >
    P2 fails upward: the horizon exceeds log_10|d_A| = 60, so
    record-scale exactness is cheaply certifiable. The certifiability
    concern collapses and the question's ladder may carry EXACT labels
    much further up than predicted.
  - >
    P4 fails: fewer than 11 of 12 synthetic faults detected, or the real
    historical fault is missed. The witness format is underspecified and
    the deliverable becomes the missing fields rather than the detection
    rate.
  - >
    Every bnfcertify call times out at both budgets, including on the
    conductor-37 control. That is an INFRASTRUCTURE outcome (AGENTS.md
    rule 3), invalidates Arm 2 entirely, and is reported as
    `invalid_measurement`, never as evidence that anything is
    conditional.
  interpretation_limits:
  - >
    NOTHING HERE CERTIFIES OR REFUTES ANY RANK. No rank is computed,
    none is changed, and no hypothesis or evidence status other than
    this one's own moves. The deliverable is a strength column, a
    horizon, and a format.
  - >
    A rung labelled FLOAT or CONDITIONAL is a statement about its
    COMMITTED WITNESS, not about the underlying mathematics. The true
    rank may be perfectly correct and may admit a clean witness nobody
    has written; the label says only that the artifact on disk does not
    exhibit one.
  - >
    An adverse finding about EV-ECQ-0d142e's exactness claim is a
    PROPOSED SUPERSESSION routed to the Coordinator. It does not edit
    that record, does not reduce its certified LOWER bound of 12 (rests
    on exhibited points, untouched by any of this), and bears only on
    the word EXACTLY.
  - >
    The certifiability horizon is scoped to the tested PARI build, the
    frozen budgets, and the tested fields. It is not a theorem about
    what is certifiable and does not preclude a better algorithm.
