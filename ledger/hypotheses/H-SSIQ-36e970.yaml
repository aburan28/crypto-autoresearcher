hypothesis:
  id: H-SSIQ-36e970
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  batch_id: BATCH-006
  statement: >-
    IDENTICAL TO H-SSIQ-137200 (and to H-SSIQ-9e2c71 and H-SSIQ-18dc91
    before it), restated because BATCH-005 could not test it cleanly: on
    the supersingular 2-isogeny graphs BATCH-003 built and BATCH-004/005's
    direct-computation instrument labelled with delta_E, greedy local
    descent on delta_E reaches the F_p-rational locus (delta_E = 1) in
    FEWER steps, as a function of graph size N, than an undirected random
    walk on the same graph: gamma_greedy < gamma_random. A DETECTABLE GAP
    is a computable delta_E-gradient in the sense of lever L4's revisit
    condition; no detectable gap means L4's obstruction stands unresolved
    by this test.
    WHAT IS NEW: this hypothesis is tested by RE-ANALYZING data
    RUN-SSIQ-a85692-b ALREADY COLLECTED, with TWO control-code defects
    fixed, rather than by any new real search. BATCH-005 computed a real
    M-GAP for the first time in this campaign (m_gap=+0.16786) but its
    terminal branch was CONTROL-FAILURE-VOID under a comparability test
    (C-SEARCH-BIAS) later found to have essentially no statistical power
    at n=20 (GD-... see goal.yaml), and the OTHER control the decision
    branch cited (C-NULL-LABEL) was found to be dead code that never
    actually compares a null M-GAP against anything (GD-9). Separately,
    the reported gamma_greedy itself was found invalid on its own terms:
    v1's inherited PER-PRIME-TRAPPED-EXCLUSION filter was never
    implemented in the reused descent-metrics code, and all four primes
    contributing to BATCH-005's fit exceed the stated 0.5 trapped-fraction
    exclusion threshold (GD-8). This hypothesis is tested only once both
    are fixed and re-applied to the already-collected labels -- zero new
    delta_E search, zero new graph construction.
  statement_note: >-
    THIS IS H-SSIQ-137200 WITH ITS TWO BLOCKING CODE DEFECTS FIXED, NOT A
    NEW HYPOTHESIS. The prediction, the decision logic, and the scope are
    unchanged; what changes is that two controls this campaign's decision
    rule always relied on are made to actually function as their own text
    requires, before the ALREADY-COMPUTED real-arm number from
    RUN-SSIQ-a85692-b is re-read under them. A separate hypothesis id is
    minted (rather than reopening H-SSIQ-137200) because AGENTS.md
    immutability treats a hypothesis record as append-only once archived,
    and H-SSIQ-137200 is already archived as analyzed under EV-SSIQ-f3ce32
    -- this record supersedes it for BATCH-006's purposes and says so
    explicitly, exactly the pattern H-SSIQ-137200 itself used against
    H-SSIQ-9e2c71.
  supersedes: H-SSIQ-137200
  supersedes_note: >-
    H-SSIQ-137200 is retained unedited, per AGENTS.md immutability. Its
    real-arm prediction was computed once (analyzed, EV-SSIQ-f3ce32) but
    the result could not be trusted at face value: CONTROL-FAILURE-VOID
    fired under a control later found low-power, a second required
    control was found to be dead code, and the point estimate itself was
    found invalid on a separate ground (a missing trapped-fraction
    filter). This record inherits its statement and scope unchanged and
    supplies the corrected control logic.
  mechanism: >-
    Unchanged from H-SSIQ-137200's mechanism at the delta_E-labelling
    level: BATCH-004/005's direct-computation instrument (bidirectional
    meet-in-the-middle search, B=X=23) remains the label source, already
    independently validated and NOT reopened by this hypothesis. What
    changes is entirely in the ANALYSIS layer applied to
    RUN-SSIQ-a85692-b's already-collected raw data: (1) C-NULL-LABEL's
    comparison logic is implemented for the first time -- fit a null
    M-GAP via OLS-log-log on the already-computed null_by_prime medians
    across primes, mirroring the real arm's own fit exactly, bootstrap its
    CI the same way M-GAP's CI is bootstrapped, and derive
    c_null_label_control_failure from a comparison rule stated and
    justified BEFORE looking at what it outputs on this already-collected
    data (so it is a genuine pre-registered rule applied to old data, not
    a rule reverse-engineered from a known answer); (2) the
    PER-PRIME-TRAPPED-EXCLUSION filter (trapped_fraction>0.5) is
    implemented per the frozen spec's own inherited text and applied to
    RUN-SSIQ-a85692-b's already-computed per-prime trapped_fraction
    values, determining which (if any) of the 5 admitted primes remain
    usable for a re-derived gamma_greedy/gamma_random/m_gap. If zero
    primes survive the corrected filter (plausible: all 4 previously-used
    primes have trapped_fraction in [0.72, 0.85]), the run reports
    DATA-UNAVAILABLE/BLOCKED for lack of usable coverage under the
    corrected filter -- itself a genuine, informative result about
    whether greedy descent gets trapped pervasively at this graph scale
    regardless of labelling quality, distinct from either prior VOID
    reason this campaign has recorded.
  assumptions:
    - >-
      No new delta_E search, no new graph construction, and no re-running
      of C-SEARCH-BIAS or the Phase -1 search is performed for this
      hypothesis -- it is a pure re-analysis of RUN-SSIQ-a85692-b's
      already-archived raw-result.json under corrected control logic.
      Any change to the underlying delta_E labels or the admitted prime
      set would be a different experiment, not this one.
    - >-
      C-NULL-LABEL's comparison rule (what counts as "the null CI is also
      comparable to the real CI") is pre-registered in the frozen
      contract BEFORE being applied to RUN-SSIQ-a85692-b's already-known
      null_by_prime data, so that fixing dead code does not become an
      opportunity to tune a threshold to a desired outcome -- the same
      non-improvisation discipline this campaign applies to every other
      frozen decision element.
    - >-
      If PER-PRIME-TRAPPED-EXCLUSION leaves fewer than 4 usable primes
      (plausible given BATCH-005's own trapped_fraction figures), the
      run is DATA-UNAVAILABLE/BLOCKED for lack of coverage under the
      stopping_rules floor inherited unchanged from v1/v2, reported
      honestly rather than lowering the threshold or the floor to force a
      result.
  proof_search_map:
    not_applicable_reason: >-
      NOT a proof-oriented hypothesis, inherited unchanged from
      H-SSIQ-137200 and its predecessors: a direct instrument-level test
      of whether a computable delta_E-gradient exists, not a proposed
      mechanism for lowering a hard problem's cost.
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    NULL AND REQUIRED TO BE, inherited unchanged. Fixing two controls'
    comparison logic does not itself constitute or license any complexity
    claim.
  heuristic_assumptions: []
  heuristic_assumptions_note: >-
    None numbered, inherited unchanged from H-SSIQ-137200 and its
    predecessors.
  status: analyzed
  status_note: >-
    analyzed, set by the Coordinator per AGENTS.md rule 1 (DEC-20260805-e46f4f,
    BATCH-006). GD-8's fix (the trapped-vertex exclusion filter) worked and
    is validated on real data: applying it correctly to RUN-SSIQ-a85692-b's
    already-collected labels excludes ALL 4 previously-searched primes in
    BOTH the real and null arms, so this hypothesis's real-arm prediction
    could not be computed at all -- terminal branch DATA-UNAVAILABLE-BLOCKED,
    honestly and mechanically derived, itself informative (pervasive
    trapping at N in [203, 611] independent of which label arm is used).
    NO NEW HYPOTHESIS IS MINTED YET, unlike the H-SSIQ-9e2c71 ->
    H-SSIQ-137200 -> H-SSIQ-36e970 chain: BATCH-007's ranked next actions
    (fix GD-10's validation-artifact gap; diagnose the trapping mechanism
    from already-collected data) are infrastructure/diagnostic work, not a
    new attempt at THIS prediction on a different prime set or graph size.
    A successor hypothesis is minted once BATCH-007/008's diagnostic work
    yields a concrete next real-arm attempt (e.g. a mechanism-informed
    redesign, or a larger-N attempt with a specific hypothesis about why
    trapping should differ).
  scope_ceiling:
    claim_tier: toy
    detail: >-
      Toy scale, inherited from H-SSIQ-137200: at most the 5 primes
      RUN-SSIQ-a85692-b already admitted (2437, 3889, 5737, 7333, 8893
      partial), N range at most [203, 718], narrower still after any
      corrected trapped-fraction filtering. No result transfers to
      cryptographic scale.
  why_this_test_and_not_another: >-
    Both required fixes (C-NULL-LABEL's comparison logic, GD-9;
    PER-PRIME-TRAPPED-EXCLUSION, GD-8) are applicable to data this
    campaign already collected and paid for, at zero new search cost --
    the Red Team's own ranked BATCH-006 recommendation (RT-BATCH-005.md
    Front 4, items 1-2) and DEC-20260805-5f5ac6's single next action.
    Spending new real-search budget before these fixes land would risk
    producing a second run with the identical two defects.
  owner: coordinator
  created_at: '2026-08-05'
