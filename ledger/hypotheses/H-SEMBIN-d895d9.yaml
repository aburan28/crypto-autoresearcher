  title: >-
    The Assumption 1 solving-degree boundary is a surface in (n, k) measurable
    by one-sided SOLV4 certificates: reproduce Semaev (40,2,2,20) and probe
    Kosters (45,2,2,23) at ≤2 GiB, then read dφ/dk vs dφ/dn on fixed-k and
    fixed-n ladders

  statement: >-
    CLAIM (measurement; NO ATTACK; NO EXPONENT). Scope: Semaev 2015 Assumption 1
    and the published Semaev/Kosters degree reports ONLY (KN-LIT-fa346d,
    KN-LIT-e77232); nothing about deployed FIPS curves as attack targets.
    Four independently falsifiable parts. (C1) LOCATION IS A SURFACE. The
    solving degree of the Weil-descended chained S_3 system is, within
    measurement reach, a function of k alone plus a weak n-dependence:
    d_solv(n,k) = φ(k) + o(1) with φ non-decreasing and φ(k) ≥ 5 for some
    k ≤ 23 (else C1's k-reading is refuted). (C2) USEFUL DIRECTION IS ONE-SIDED.
    NOT SOLV4 (degree-4 capped GF(2) closure fails to determine V(I)) certifies
    that every complete degree-by-degree procedure takes a productive step of
    degree ≥ 5; SOLV4 holding is recorded as "degree 4 sufficed here", never
    "the degree is 4". Decisive cells fit in ≤2 GiB dense (Semaev n=40 ~0.39 GiB;
    Kosters n=45 ~1.02 GiB; Kosters n=25 m=3 ~1.23 GiB). (C3) CONVERSE OUT OF
    BUDGET. Certifying degree 5 suffices needs ~132 GiB at n=45 m=2 — declared
    impediment, not evidence. (C4) FIXED-k LADDER. Neither Semaev nor Kosters
    varied n at fixed k as the primary axis; measuring SOLV4 failure rates on
    k=4 (n=13..28) and k=7 (n=19..30) plus the m=2 ladder k∈{15,20,23,25} at
    n∈{30,40,45,50} decides whether the boundary is in k (C1) or in n.
    CLAIM TIER: measurement / toy. Outcomes feed IDEA-20260913-9c54f9's
    sensitivity table as a measured φ range — they do not assert a FIPS break.

  mechanism: >-
    OBJECT FRAME. Representation R1: Boolean coordinates of the Weil-descended
    chained S_3 system (Semaev 2015 eq. (5)) over F_2. Tracked object: the
    SOLV4 boolean and per-cell failure rate stratified by satisfiability, as a
    function of (n,m,t,k). Sigma = {multiplication by variables inside B_{≤4},
    F_2-linear combination, re-echelon}. Trichotomy: COORDINATE-DEPENDENT only
    weakly (Boolean ring); SOLV4 itself is order-independent by construction
    (IDEA-20260913-449d2b). Lossy projection I ↦ (SOLV4, dim R_4, M_{≤4}, s,
    closure rounds) is Sigma-compatible and genuinely lossy. WHAT IS NEW:
    converting the under-determined "boundary between n=40 and n=45" into a
    unit-resolution surface in (n,k) via one-sided certificates two orders of
    magnitude cheaper than MAGMA F4 at the disputed cells.

  assumptions:
    - >-
      Frozen Semaev 2015 text at inputs/SEMAEV-2015-310/ is the sole primary
      source for Assumption 1, Table 2 cells, and Section 4.5.1 concessions.
    - >-
      SOLV4 iff dim R_4 = M_{≤4} - s (IDEA-20260913-449d2b); NOT SOLV4 implies
      every complete degree-by-degree procedure takes a productive step ≥5.
    - >-
      SOLV4 is decided by two independent GF(2) rank routines on the identical
      matrix; disagreement invalidates the cell (never averaged).
    - >-
      Solution count s is computed independently of the rank computation
      (enumeration over V^t AND point arithmetic on E must agree).
    - >-
      Magma/Sage are NOT the success path. Stage-1 instrument is a C / vendored
      four-Russians or M4RI-style GF(2) rank + degree-4 capped closure, gated
      on EXP-DREG-001 anchor ranks. No AUXIN. No Bedrock.
    - >-
      Kosters' setup is under-specified (KN-LIT-e77232); non-reproduction is
      evidence about THIS cell as specified, not a contradiction of his figure.
    - >-
      Resource exhaustion / timeout / RSS cap is failed_infrastructure /
      O-IMPEDIMENT / censored cell, never negative evidence against C1–C4
      (AGENTS.md rule 5).
    - >-
      m=2 cells are diagnostically useful but cryptographically irrelevant;
      transfer to m=12 is NOT claimed.

  proof_search_map:
    bottleneck: >-
      "d_F4 ≤ 4 for any 2 ≤ t ≤ m and any n" — the single inequality that makes
      the per-decomposition cost polynomial. Failure must be certifiable at the
      cells where failure has been reported, without a full Groebner basis.
    baseline_embedding:
      parameter_slice: >-
        (n,m,t,k)=(40,2,2,20) Semaev Table-2 largest cell (d_F4=4 claimed);
        (21,3,3,7) largest published m=3 cell; EXP-DREG-001 anchor ranks
        (69,073 at n=15; 143,882 at n=18) for the GF(2) rank engine.
      reproduction_check: >-
        Stage 0: size worksheet + preregistered predictions frozen before any
        ladder RESULTS reading. Stage 1: dual GF(2) rank reproduces DREG
        anchors; SOLV4 holds at (40,2,2,20) on both arms (else O-BASELINE-FAIL
        and ladder void). Secondary: builder equality / solution-set check
        against brute-force point arithmetic on E.
    observation_collision:
      observable: >-
        SOLV4 fails at this cell (per-arm failure rate).
      distinct_preimage_search: >-
        Search for same-k different-n cells on opposite sides of the SOLV4
        boundary, and same-n different-k likewise. Only second pair → boundary
        in k (C1); only first → boundary in n (C1 refuted); both → genuine
        curve in (n,k). Separated from shape artifacts by T11-style
        support-matched semi-regular null.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "run F4 to completion and read max step degree" by
          "decide dim R_4 = M_{≤4} - s".
        predicted_gain: >-
          126 GB → ~1.02 GiB at Kosters n=45; answer becomes an integer
          identity with a checkable certificate.
      - transform: boundary_lift
        proposed_object: >-
          Extend certificates off the diagonal and along fixed-k ladders.
        predicted_gain: >-
          Converts "somewhere between n=40 and n=45" into a unit-resolution
          bracket in the variable the cost model is sensitive to.
    quantifier_order: >-
      Assumption 1: FORALL n,m,t,V: d_F4 ≤ 4. Negation has cheap order:
      EXISTS n,m,t,V, EXISTS instance: SOLV4 fails. One certificate falsifies
      the universal. Positive direction is reported only as per-cell frequency,
      never as a universal.
    method_ceiling:
      strongest_certifiable_claim: >-
        At (n,m,t,k)=X, with curve B and factor base V as specified, degree 4
        is insufficient for a fraction p of instances stratified by
        satisfiability, with exact ranks and independently recomputed s.
        Reach: m=2 up to n≈50 (~1.87 GiB), m=3 up to n≈25–27 (~1.23 GiB), at
        degree 4 only. Cannot certify the degree is exactly 5; cannot reach
        n=409/571; cannot speak for MAGMA's F4.
      nearby_object_control: >-
        k-excess family k=ceil(n/m)+j at the same n (paper asserts failure);
        support-matched null; dual GF(2) rank; SAT/UNSAT stratification;
        Magma-as-success-path forbidden.
    proof_obligations:
      - claim: SOLV4 iff dim R_4 = M_{≤4} - s
        responsibility: correctness
      - claim: NOT SOLV4 implies every complete degree-by-degree procedure takes a productive step ≥ 5
        responsibility: correctness
      - claim: Degree-4 closure fixed point reached in finitely many rounds; round count recorded
        responsibility: feasibility
      - claim: GF(2) rank engine reproduces EXP-DREG-001 anchors exactly
        responsibility: baseline
      - claim: s computed independently of the rank computation
        responsibility: interface
      - claim: Memory/time per cell within 8 GiB / 8 CPU-hours; exceedance recorded censored
        responsibility: memory

  asymptotic_claim: null

  heuristic_assumptions:
    - id: H-9ba7fc-C1
      formal_statement: >-
        (Solving degree is a function of k.) There is a non-decreasing
        φ: Z_{>0} → Z_{>0} such that for the Weil descent of eq. (5) with
        dim V = k and any n with kt ≤ n, |d_solv(n,k) − φ(k)| ≤ 1 for all but
        an o(1) fraction of instances; and φ(k) ≥ 5 for some k ≤ 23 if Kosters'
        report reflects a cell property.
      random_model_justification: >-
        Excess of equations over unknowns is exactly n − kt (non-decreasing in
        n at fixed k; strictly decreasing in k at fixed n). Semi-regular
        Boolean regularity degree depends on the (equations, variables) ratio
        alone (Bardet–Faugère–Salvy, recalled); at fixed k that ratio tends to
        a constant as n grows.
      supporting_results:
        - KN-LIT-fa346d Section 4.5.1 and Table 2 (retrieved; frozen paper).
        - KN-LIT-e77232 Semaev/Kosters exchange (internal).
        - IDEA-20260913-449d2b SOLV4 identity (proposal on main; instrument design on sibling PR #1586).
      provenance: internal
      falsification_condition: >-
        Fitted dφ/dk indistinguishable from 0 across k=15..25 at m=2 while
        dφ/dn is not → C1 false → O-C1-N-AXIS. OR SOLV4 holds at (45,2,2,23)
        on both arms over ≥100 instances → φ(k)≥5 for k≤23 refuted →
        O-KOSTERS-NOREPRO.
      validation_plan: >-
        Fixed-k ladders (k=4 n=13..28; k=7 n=19..30) predicted flat; fixed-n
        growing-k and m=2 ladder k∈{15,20,23,25} predicted rising; compared
        against constant-4 and matched semi-regular null. Transfer to
        n=409/571 NOT made — φ reported on measured domain only.
    - id: H-9ba7fc-C2
      formal_statement: >-
        At Semaev's (40,2,2,20) cell, SOLV4 failure rate is <0.02 on both arms
        (reproducing Table 2 d_F4=4). At Kosters' (45,2,2,23) satisfiable arm,
        failure rate is >0.10 over ≥100 satisfiable instances if his report
        reflects a cell property.
      random_model_justification: >-
        Predictions are pre-registered empirical bands against the only two
        external data points; not a probabilistic hardness claim.
      supporting_results:
        - KN-LIT-fa346d Table 2 (retrieved).
        - KN-LIT-e77232 (internal).
      provenance: internal
      falsification_condition: >-
        SOLV4 fails at (40,2,2,20) with rate >0.10 → O-BASELINE-FAIL.
        SOLV4 holds at (45,2,2,23) both arms ≥100 → O-KOSTERS-NOREPRO.
      validation_plan: Stage 2 decisive cells after Stage-1 instrument gate.

  predictions:
    - claim: H-9ba7fc-C2 Semaev baseline
      metric: SOLV4 failure rate at (40,2,2,20), both arms
      minimum_effect: '< 0.02 (reproduce Table 2)'
      cites: H-9ba7fc-C2
    - claim: H-9ba7fc-C2 Kosters counter-datum
      metric: SOLV4 failure rate at (45,2,2,23), satisfiable arm
      minimum_effect: '> 0.10 over ≥100 SAT instances (if cell property)'
      cites: H-9ba7fc-C2
    - claim: H-9ba7fc-C1 dφ/dk
      metric: fitted dφ/dk on m=2 ladder k∈{15,20,23,25}
      minimum_effect: distinguishable from 0 at 90% level
      cites: H-9ba7fc-C1
    - claim: H-9ba7fc-C1 fixed-k flatness
      metric: SOLV4 failure rate along k=4 (n=13..28) and k=7 (n=19..30)
      minimum_effect: flat in n (≈0 slope) under C1; rising in n refutes C1
      cites: H-9ba7fc-C1
    - claim: resource band
      metric: wall time and peak RSS per certified cell
      minimum_effect: '< 8 CPU-hours and < 4 GiB at n=45 m=2 degree 4'

  test_boundary: >-
    Cells in run order: (30,2,2,15), (40,2,2,20), (21,3,3,7), (45,2,2,23),
    (25,3,3,9), (50,2,2,25); off-diagonal gate at (40,2,2,{21,22}) and
    (25,3,3,10); fixed-k ladders k=4 over n=13..28 and k=7 over n=19..30.
    ≥100 instances per arm per cell where budget allows; curves B=1 and
    random B at one cell; field-representation and V-construction controls at
    one cell. Degree 5 declared out of budget. No Magma/Sage/AUXIN/Bedrock.
    No deployed-degree Semaev/ECDLP solve as a claimed result. Transfer of φ
    beyond measured (n,k) is labelled scope-limited / escalation-only.

  falsification_conditions:
    - >-
      SOLV4 holds at (45,2,2,23) on both arms over ≥100 instances each →
      Kosters' degree-5 report does not reproduce as a solving-degree
      statement → O-KOSTERS-NOREPRO; φ(k)≥5 for k≤23 refuted.
    - >-
      SOLV4 fails at (40,2,2,20) with rate >0.10 → contradicts Table 2 →
      O-BASELINE-FAIL; instrument must be re-validated before claiming.
    - >-
      Fitted dφ/dk ≈ 0 across k=15..25 at m=2 while dφ/dn is not → C1's
      k-reading wrong → O-C1-N-AXIS.
    - >-
      Null arm fails SOLV4 at the same rate as the Semaev arm → certificate
      measures shape not arithmetic → O-NULL-COLLAPSE; no cell cited as
      Assumption 1 evidence.
    - >-
      Certificate cannot separate diagonal from k=ceil(n/m)+1 at any n →
      method ceiling reached → O-CEILING.
    - >-
      Dual GF(2) ranks disagree, or s from enumeration disagrees with point
      arithmetic → O-ARTIFACT.
    - >-
      Stage-1 DREG anchor ranks not reproduced → O-ENGINE-FAIL; ladder void.

  distinguishable_outcomes:
    - id: O-SURFACE-K
      meaning: >-
        C1 supported: boundary in k (fixed-k ladders flat; dφ/dk > 0);
        Semaev baseline holds; Kosters cell either fails SOLV4 on SAT arm or
        records O-KOSTERS-NOREPRO as a separate label; RESULTS names this
        primary label when the k-reading wins.
    - id: O-SURFACE-N
      meaning: >-
        C1 refuted on the k-axis: failure rises in n at fixed k → O-C1-N-AXIS
        as primary when that is the decisive finding.
    - id: O-C1-N-AXIS
      meaning: Fitted dφ/dk ≈ 0 while dφ/dn is not; boundary is in n.
    - id: O-KOSTERS-NOREPRO
      meaning: SOLV4 holds at (45,2,2,23) both arms; φ(k)≥5 for k≤23 refuted.
    - id: O-BASELINE-FAIL
      meaning: SOLV4 fails at Semaev (40,2,2,20); instrument/builder void.
    - id: O-NULL-COLLAPSE
      meaning: Null arm matches Semaev-arm failure rate; shape artifact.
    - id: O-CEILING
      meaning: Cannot separate diagonal from k-excess; method ceiling.
    - id: O-ENGINE-FAIL
      meaning: Stage-1 DREG anchors or dual-rank gate fail; stop before ladder.
    - id: O-ARTIFACT
      meaning: Dual-rank disagreement, s mismatch, or verification failure.
    - id: O-CENSORED
      meaning: Cell exceeds 8 GiB / 8 CPU-hours; partial state recorded; never a degree observation.
    - id: O-IMPEDIMENT
      meaning: >-
        Missing GF(2) engine / builder, or infra abort; never negative
        mathematical evidence against C1–C4.

