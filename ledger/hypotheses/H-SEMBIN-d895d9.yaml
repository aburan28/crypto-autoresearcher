#
# Consumes the SOLV4 degree-4 capped GF(2) closure predicate named by
# IDEA-20260913-449d2b (instrument design on sibling PR #1586; this contract
# embeds a self-contained Stage-1 SOLV4 gate on DREG anchors so it does not
# target_id sibling EXP/H not present on this branch). ZERO RUNS in this
# design packet. No Magma/Sage/AUXIN/Bedrock as success path.
# Claim tier: measurement. No curve attack. No exponent claim.
# =============================================================================
