hypothesis:
  id: H-PFDR-06fd60
  question_id: RQ-PFDR-ae2fba
  source_idea_id: IDEA-20260903-dcf857
  title: >-
    Theorem (conditional on HEUR-001): under a last fall degree bounded by
    D_0 the hybrid optimum of the digit-presentation decomposition oracle
    flips from full guessing (the semi-regular slice, reproducing
    IDEA-20260808-da1428's N^1 exactly) to no guessing (k* = 0), crossbred
    degenerates to XL at degree D_0, and at log2 N = 256 the route ties with
    rho only at m = 4, D_0 = 4, omega = 2 and beats it at m = 5 only for
    D_0 <= 6 at omega = 2 -- so 'bounded' is not enough and
    EXP-PFDR-cbdefb's Outcome III must return D_0 <= 6 to matter
  statement: >-
    (A) COST MODEL. Digit presentation at d = 2 (IDEA-20260830-84cdb7):
    n = ms digit variables over F_p, B = 2^s, one substituted summation
    generator, n field-type generators a(a - 1). Per-target oracle cost with
    k digits guessed: C(k) = 2^k Ncols(n - k, D(k))^omega, Ncols(n', D) =
    sum_{i <= D} binom(n', i), D(k) the Macaulay degree the residual system
    must reach. Assembly as in 84cdb7: success probability B^m / (m! N) per
    target, 2^m filtering charged, sparse linear algebra B^2, balance
    B = (m! 2^m C N)^{1/(m+1)}, total T = 2 (m! 2^m C N)^{2/(m+1)}, memory
    B; yield forced by KN-FIND-007.
    (B) BASELINE SLICE, REPRODUCING da1428. Under the semi-regular null
    D(k) = ceil(((n - k) + 2m)/2), Ncols exceeds half of 2^{n-k}, and
    C(k+1)/C(k) is about 2 x 2^{-omega} < 1 for every omega > 1: C is
    strictly decreasing to the enumerative leaf k = n - s, the optimum is
    FULL GUESSING, the oracle costs B^{m-1} up to constants, and T = N^1 at
    every arity -- da1428's verdict in the digit presentation, the mandatory
    baseline.
    (C) BOUNDED SLICE. Under HEUR-001 (d_lf <= D_0 and bounded solve), D(k)
    = min(D_0, d_reg(k)); for n - k large, C(k+1)/C(k) = 2 (1 - D_0/(n -
    k))^omega, which exceeds 1 exactly when n - k > D_0 / (1 - 2^{-1/omega})
    (3.41 D_0 at omega = 2, 4.57 D_0 at omega = 2.807). So the optimum is
    k* = 0 with C = Ncols(n, D_0)^omega, polynomial in n; crossbred
    degenerates to plain XL at degree D_0; the interior band (partial bound
    after guessing, HEUR-002 only) has optimum at k_c = n - 2(D_0 - m) with
    cost exponential in n, reproducing the baseline verdict.
    (D) TABLE (hand-derived to about 0.5 in log2; the Stage 0 script is the
    authority). log2 N = 256 (rho 2^127.8): m = 4, D_0 = 4, omega 2: T =
    2^128.6, memory 2^63.8 (tie, loses by 0.8); omega 2.807: 2^138. m = 4,
    D_0 = 8: 2^146.8 / 2^164.4. m = 5, D_0 = 4: 2^108.7 (omega 2) /
    2^116.6 (omega 2.807), memory 2^53.8 / 2^57.8. m = 5, D_0 = 6: 2^116.6
    / 2^127.9 (tie). m = 5, D_0 = 8: 2^124.1 / 2^139. m = 3, any D_0:
    T >= 2^2.8 N^{1/2}, never beats rho. log2 N = 128 (rho 2^63.8): best
    cell m = 5, D_0 = 4, omega 2: 2^64 (tie); omega 2.807: 2^71.1. log2 N =
    64 (rho 2^31.8): best cell 2^40.9, loses by 2^9. READING: the 'o(1)' of
    N^{2/(m+1)+o(1)} is a factor of 2^52 to 2^151 in the per-target cost at
    256 bits; the conditional advantage appears at 256 bits only for m = 5
    with D_0 <= 6 at omega = 2 (or D_0 = 4 at omega = 2.807), and at 128
    bits and below not at all.
    (E) UNCONDITIONALLY: nothing. The table is a concrete_cost artifact
    conditional on HEUR-001 (and HEUR-002 for interior cells only), with
    every optimistic assumption flagged; its deliverable to the lane is one
    number: D_0 must be at most 6 (m = 5, omega = 2) or at most 4 (m = 4,
    omega = 2, tie) for the conditional route to be competitive at 256
    bits.
  mechanism: >-
    WHY THE FLIP HAPPENS AT THE DEGREE, NOT THE VARIABLE COUNT. da1428's
    inequality 'keeping one variable algebraic costs a factor 2^omega here
    and guessing it costs 2' holds because the residual degree of
    regularity grows with the residual variable count. A bounded last fall
    degree decouples the Macaulay degree from the variable count, so the
    marginal cost of keeping a variable becomes the polynomial factor
    (1 - D_0/(n - k))^{-omega}, below 2 as soon as n - k exceeds a few
    multiples of D_0. That single change of the marginal-cost sign is the
    entire content of (C). THE THREE HONESTY DISCLOSURES: omega = 2 is not
    achievable for structured sparse Macaulay matrices and the omega =
    2.807 column moves every verdict by 2^7 to 2^18; memory B = 2^s is
    2^31 to 2^82 against rho's O(1) and no cell dominates rho on memory;
    HEUR-002 (specialization keeps the bound) is unmeasured and enters only
    the interior band, so the headline k* = 0 cells are HEUR-001-only.
    WHY THIS IS A COMPOSITION: it composes 84cdb7's presentation,
    H-PFDR-c88f14's invariant, da1428's hybrid framework and KN-LIT-139's
    crossbred shape with the standard index-calculus balance; the new
    arithmetic is the sign flip and the table, filed so that the lane's
    conditional claim carries the cost artifact the target profile (A8,
    C13-C15) requires BEFORE any measurement could promote it.
  assumptions:
    - >-
      Cost unit F_p field operations; Macaulay solve charged Ncols^omega with
      omega in {2, 2.807}; enumeration leaf charged by root-finding plus
      O(1) lookup; linear algebra B^2.
    - >-
      Yield B^m / (m! N) with 2^m filtering (KN-FIND-007 forced mean); no
      large-prime variation (IDEA-20260903-fc1355 shows the algebraic
      large-prime variation is dominated under the null and is not
      composed).
    - >-
      d = 2 throughout; other d change constants only under the null and
      the bounded-slice arithmetic is the same with 2^k replaced by d^k.
    - >-
      All hand numbers are to about 0.5 in log2; the Stage 0 script
      recomputes them exactly and any disagreement above 1 in log2 is a
      transcription error corrected by a superseding record.
  proof_search_map:
    bottleneck: >-
      The marginal-cost sign at k = 0: whether C(1)/C(0) is below or above
      1, decided entirely by whether D(k) tracks the variable count (null)
      or is pinned at D_0 (bound).
    baseline_embedding:
      parameter_slice: >-
        D(k) = d_reg(k) at every k: the semi-regular slice, which must
        return full guessing and N^1, i.e. da1428's verdict in the digit
        presentation. Second fixture: the direct presentation under the same
        machinery, which must reproduce da1428's B^{2 omega - 1} ratio.
      reproduction_check: >-
        Stage 0 script: emit C(k) for k = 0..n - s at (m, s) in {(3, 6),
        (4, 8), (5, 8)} under the null and confirm strict monotonicity in k
        with the enumerative leaf as argmin; emit the direct-presentation
        ratio from the same script; cross-check the balance against 84cdb7's
        accounting at C = 1 and against the enumerative oracle C = B^{m-1}
        (must give N^1).
    observation_collision:
      observable: >-
        The argmin k* and the total T.
      distinct_preimage_search: >-
        Two hypotheses give the same k* = 0: HEUR-001 true (bounded
        everywhere) and a partial bound holding at k = 0 only; the
        interior-band computation separates them because under the partial
        bound C(k) is non-monotone with a second minimum at k_c. The table
        reports the whole C(k) curve, not the argmin, for this reason.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Build the cost as a function of the disjoint blocks (k below k_c,
          k above k_c) with D(k) = min(D_0, d_reg(k)) and charge each block
          separately.
        predicted_gain: >-
          Locates the flip and the interior band exactly instead of
          asserting an optimum.
    quantifier_order: >-
      DERIVED: FOR ALL (m, s, omega > 1), under the null, FOR ALL k < n - s,
      C(k+1) < C(k). DERIVED: FOR ALL (m, s, omega), under HEUR-001, FOR ALL
      k with n - k > D_0 / (1 - 2^{-1/omega}), C(k+1) > C(k). CONDITIONAL
      TABLE: FOR ALL cells listed, the stated T and memory, assuming
      HEUR-001 (and HEUR-002 only for interior cells). NOT CLAIMED: any
      unconditional cost.
    method_ceiling:
      strongest_certifiable_claim: >-
        'Under HEUR-001 with the stated D_0, omega and cost model, the
        digit-presentation route costs T at memory M at the listed sizes,
        and under the null it costs N^1.' It cannot certify HEUR-001, cannot
        certify that a bounded last fall gives a bounded solve, and cannot
        certify omega.
      nearby_object_control: >-
        The direct presentation with membership degree B under the same
        table machinery, where the flip must NOT occur (da1428's boundary
        optimum); the second fixture of the reproduction check.
    proof_obligations:
      - claim: >-
          Under the null C(k) is strictly decreasing in k up to the
          enumerative leaf (baseline slice equals da1428).
        responsibility: baseline
      - claim: >-
          Under HEUR-001 the marginal ratio 2 (1 - D_0/(n - k))^omega
          exceeds 1 for n - k > D_0 / (1 - 2^{-1/omega}).
        responsibility: correctness
      - claim: >-
          Every table entry is reproduced by the Stage 0 script to within
          1 in log2.
        responsibility: feasibility
      - claim: >-
          The table is labelled conditional in every summary and no cell is
          quoted without its (D_0, omega) tags.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: >-
      Prime-field ECDLP on E/F_p via digit-presentation index calculus
      (IDEA-20260830-84cdb7); CONDITIONAL ON HEUR-001 ONLY -- unconditionally
      this hypothesis claims nothing and the semi-regular slice gives N^1.
    prior_best: 'Pollard rho, 0.886 N^{1/2} group operations, O(1) memory'
    time_exponent: >-
      2/(m+1) conditional on HEUR-001 (0.4 at m = 4, 1/3 at m = 5), with the
      o(1) made explicit as Ncols(ms, D_0)^{2 omega/(m+1)} (m! 2^m)^{2/(m+1)}
      x 2, a factor of 2^52 to 2^151 in the per-target cost at 256 bits.
    memory_exponent: >-
      1/(m+1) conditional on HEUR-001, times Ncols(ms, D_0)^{omega/(m+1)};
      2^54 to 2^82 at 256 bits against rho's O(1).
    hidden_cofactor: >-
      Ncols(ms, D_0)^omega with D_0 UNKNOWN and, by H-PFDR-c88f14's
      derivation, unbounded by any theorem; polynomial in log N only under
      HEUR-001; the table's whole point is that it is not small.
    claim_kind: exponent_improvement
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        BOUNDED LAST FALL AND BOUNDED SOLVE (H-PFDR-c88f14's HEUR-002
        imported): there exists D_0 = D_0(m, d) such that d_lf(m, d, s) <=
        D_0 for all s, p, curves and planted targets, AND the degree-D_0
        Macaulay matrix determines the solutions.
      random_model_justification: >-
        NONE transfers from the extension-field theorem (H-PFDR-c88f14
        claim A). The classical statement imitated is the Weil-descent
        last-fall bound of arXiv:2103.07282 with q <-> d, n <-> s; the solve
        half imitates Huang-Kosters-Yeo's relation between last fall degree
        and solving degree (recalled). The honest prior is AGAINST it
        (0.05 per IDEA-20260903-dcf857 and IDEA-20260903-d52480).
      supporting_results:
        - ref: IDEA-20260903-d52480
          provenance: internal
          claim: >-
            The transfer analysis and the three-outcome measurement whose
            Outcome III is the only support this heuristic can receive at
            the tested scale.
          verified_by: coordinator, TASK-20260903-b5d2ae (record read in full)
        - ref: >-
            Huang, Kosters, Yeo, Last fall degree, HFE, and Weil descent
            attacks on ECDLP (KN-LIT-7607), the statement that a Groebner
            basis can be computed by linear algebra in degree governed by
            max(d_F, generator degrees)
          provenance: recalled
          claim: >-
            The solve half of HEUR-001; pointer only, not opened in this
            program.
          verified_by: null
      validation_experiment_ids:
        - EXP-PFDR-cbdefb
      falsification_condition: >-
        EXP-PFDR-cbdefb Outcome I or II (a fitted d_lf slope whose interval
        excludes 0 on an uncensored ladder); the pre-registered expectation
        is that this fires, in which case the table stays as the record of
        what 'bounded' would have had to mean.
    - id: HEUR-002
      formal_statement: >-
        SPECIALIZATION MONOTONICITY: the last fall degree of the residual
        system after fixing k digits to values in {0, 1} is at most D_0.
      random_model_justification: >-
        No rigorous support; specialization can raise or lower fall degrees
        in general. Imitates the hybrid literature's practice
        (Bettale-Faugere-Perret, recalled through IDEA-20260808-da1428) of
        assuming the residual system is as regular as the original. Enters
        only the interior-band cells; the headline k* = 0 cells do not use
        it.
      supporting_results:
        - ref: IDEA-20260808-da1428
          provenance: internal
          claim: >-
            The hybrid framework, the full-guessing optimum under the null,
            and the escapes E1-E3.
          verified_by: coordinator, TASK-20260903-b5d2ae (as cited in IDEA-20260903-dcf857 and RQ-PFDR-ae2fba; not reopened)
      validation_experiment_ids: []
      falsification_condition: >-
        At s <= 5, a measured d_lf (by EXP-PFDR-cbdefb's closure) of the
        residual after guessing k in {1, 2} digits strictly above the
        unspecialized value; a FUTURE arm under separate authority, not
        scheduled here.
    - id: HEUR-003
      formal_statement: >-
        YIELD: expected decompositions per target 2^m B^m / (m! N) with half
        of interval solutions on-curve, uniformly at the table's sizes.
      random_model_justification: >-
        KN-FIND-007's conserved mean (exact identity for the mean) and
        84cdb7's H2 (Weil bound for the square fraction, vacuous at short
        intervals). Quoted as forced, not measured.
      supporting_results:
        - ref: KN-FIND-007
          provenance: internal
          claim: >-
            Mean decomposition yield is conserved across base geometries.
          verified_by: coordinator, TASK-20260903-b5d2ae (finding read in full)
      validation_experiment_ids: []
      falsification_condition: >-
        A measured square fraction over the interval outside [0.4, 0.6] at
        p >= 2^12 on the tested ladder (84cdb7's own construction-error
        threshold); not validated by this battery, which reads no yield.
  structural_ingredients:
    - description: >-
        The guess-then-solve hybrid framework with the optimum found by
        balancing the exhaustive factor against the residual cost.
      citation: 'Bettale, Faugere, Perret, Hybrid approach for solving multivariate systems over finite fields, J. Math. Cryptol. 2009'
      provenance: recalled
      verified_by: null
      role: the framework whose optimum flips (pointer only, via IDEA-20260808-da1428)
    - description: >-
        Crossbred's shape (partial Macaulay at degree D keeping k-degree <=
        d, then enumeration) and the category warning that solver exponents
        in n and IC exponents in N are different objects.
      citation: KN-LIT-139; KN-TECH-053
      provenance: internal
      verified_by: coordinator, TASK-20260903-b5d2ae (as cited in IDEA-20260903-dcf857; not reopened)
      role: degeneration to XL under the bound
    - description: >-
        The digit presentation, its null, and its index-calculus balance.
      citation: IDEA-20260830-84cdb7
      provenance: internal
      verified_by: coordinator, TASK-20260903-b5d2ae (record read in full)
      role: the presentation and the assembly being costed
  reduction_chain:
    core_problem: >-
      Point decomposition over the digit factor base by Macaulay linear
      algebra at degree D_0 (conditional on HEUR-001).
    corollaries:
      - problem: >-
          Prime-field ECDLP via index calculus at arity m with the digit
          factor base (conditional on HEUR-001).
        reduction_ref: >-
          The standard index-calculus balance of IDEA-20260830-84cdb7 claim
          (D), internal; no published reduction is cited.
        asymptotics_preserved: >-
          Yes under the model: T = 2 (m! 2^m C N)^{2/(m+1)} with C the
          oracle cost; the table is the explicit evaluation.
  predictions:
    - metric: >-
        P1 -- Stage 0 script reproduction of every table cell
      direction: different
      minimum_effect: >-
        Within 1 in log2 of the hand values listed in statement (D). A
        larger discrepancy is a transcription error and the corrected table
        supersedes this record.
    - metric: >-
        P2 -- argmin_k C(k) under the null slice at (m, s) in {(3, 6),
        (4, 8), (5, 8)}
      direction: different
      minimum_effect: >-
        FORCED: the enumerative leaf, with C strictly decreasing in k, at
        both omega. Any interior minimum is a bug in the model.
    - metric: >-
        P3 -- argmin_k C(k) under HEUR-001 at D_0 in {4, 6, 8}, n = ms in
        the hundreds
      direction: different
      minimum_effect: >-
        FORCED: k* = 0 with C increasing in k until n - k falls below
        3.41 D_0 (omega 2) or 4.57 D_0 (omega 2.807).
    - metric: >-
        P4 -- the D_0 threshold at which T crosses rho at log2 N = 256
      direction: different
      minimum_effect: >-
        Reported per (m, omega): m = 5, omega = 2: between 8 and 10; m = 5,
        omega = 2.807: between 4 and 6; m = 4, omega = 2: below 4. These are
        the numbers EXP-PFDR-cbdefb's Outcome III must be read against.
    - metric: >-
        P5 -- interior-band optimum under HEUR-002 only (partial bound)
      direction: different
      minimum_effect: >-
        Cost 2^{k_c} binom(2(D_0 - m), D_0)^omega with k_c = n - 2(D_0 - m),
        exponential in n, reproducing the baseline verdict.
  test_boundary:
    instances: []
    instances_note: >-
      No curve and no instance: a zero-run static derivation. The only
      computation is exact integer arithmetic on binomial coefficients and
      a real-valued balance solver, performed by a derivation-aid script
      archived as an artifact, not a run.
    parameters:
      m: '3, 4, 5'
      D_0: '4, 6, 8'
      omega: '2 and 2.807'
      log2_N: '64, 128, 256'
      fixtures: 'null slice at (m, s) in {(3, 6), (4, 8), (5, 8)}; direct presentation B^{2 omega - 1} ratio; C = 1 and C = B^{m-1} limits'
    implementation: >-
      A derivation-aid script (exact integer binomials, both omega columns,
      the balance solver) under experiments/EXP-PFDR-c04716/runs/STATIC-001/;
      no curve, no solver, no Macaulay matrix, no run record.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 0.5
      maximum_memory_gb: 8
      maximum_runs: 0
  falsification_conditions:
    - >-
      F1. The null slice shows an interior optimum: the marginal-cost
      inequality is misapplied and the hypothesis is superseded.
    - >-
      F2. The direct-presentation fixture does not reproduce da1428's
      B^{2 omega - 1} ratio: same.
    - >-
      F3. A bounded-slice cell beats rho at 64 bits: arithmetic error (the
      polynomial overhead is largest relative to N at small N and the table
      must lose there).
    - >-
      F4. EXP-PFDR-cbdefb returns Outcome I or II: HEUR-001 is false at the
      tested scale and the table is the price of a hypothesis that failed;
      it stays as the record of what 'bounded' would have had to mean.
    - >-
      F5. EXP-PFDR-cbdefb returns Outcome III with D_0 above the threshold
      for the relevant (m, omega): the bound exists and does not matter at
      256 bits; the honest headline is 'bounded but too large'.
  interpretation_limits:
    - >-
      CONDITIONAL THROUGHOUT; no cell may be quoted without 'assuming
      HEUR-001 with D_0 = ...' attached, per docs/claims-and-verification.md.
    - >-
      A pricing of 84cdb7's long shot whose pre-registered expectation is
      that HEUR-001 fails; the table's most likely use is to show that
      Outcome III at a moderate D_0 would still not threaten 256-bit curves.
    - >-
      No memory-matched comparison is favourable: every cell uses 2^31 to
      2^82 memory against rho's O(1).
    - >-
      Nothing about m = 3, 128 bits or below, or omega = 2.807 with D_0 >= 6
      is affected under any reading; the affected-vs-safe scope of
      IDEA-20260903-dcf857's concrete_cost block travels with every citation.
    - >-
      Two recalled pointers (Bettale-Faugere-Perret; Huang-Kosters-Yeo's
      solve relation) back nothing; the promotion gates of
      agents/coordinator.md are NOT met by this record and cannot be met by
      a derivation alone.
