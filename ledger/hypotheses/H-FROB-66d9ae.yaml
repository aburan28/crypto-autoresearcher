# =============================================================================
# H-FROB-66d9ae -- Weil-cap arity ledger for rational-point Couveignes bases
# Specified from IDEA-20261002-cad44c under RQ-FROB-7d8dd4 / GOAL-FROB-6333a9.
# Approved DEC-20261002-93fc80.
#
# High-priority open FROB idea after BINSTD/CERTBIN shortlist exhaustion on
# this design loop. Certificate + toy fibre count. ZERO RUNS in this design
# packet. No AUXIN. No Bedrock. No ECC2K-130 attack / exponent claim.
# Claim tier: structural certificate / column pricing. Stages 0-1.
# =============================================================================
hypothesis:
  id: H-FROB-66d9ae
  question_id: RQ-FROB-7d8dd4
  source_idea: IDEA-20261002-cad44c
  experiment_id: EXP-FROB-8451c7
  goal_id: GOAL-FROB-6333a9
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-93fc80
  status: approved
  proposed_by: coordinator
  title: >-
    Any Couveignes factor base built from F_2-rational points of a commutative
    algebraic group of dimension g <= 6 has m=3 sumset image fraction below
    2^{-80} at n=131, and the least covering arity is 11 (g=5) or 9 (g=6)

  statement: >-
    CLAIM (structural certificate / column pricing; NO ATTACK). Setting: any
    Couveignes factor base F whose elements are images of F_2-rational points
    of a commutative algebraic group A of dimension g <= 6; Weil ceilings
    |A(F_2)| <= 6725 (g=5) and <= 39201 (g=6) as written in KN-OPEN-095df5
    (cited, not re-derived). HYPOTHESIS: (A) exact successive multiplication
    of those ceilings against 2^{131} yields least covering arity m* = 11 at
    g=5 and m* = 9 at g=6, so Semaev degree 2^{m*-2} is 512 and 128; (B) under
    H1 (at most 2^m curve points per ordered m-tuple of x-coordinates), the
    m=3 image has size below 2^{51} and meets a fraction below 2^{-80} of a
    group of size 2^{131}; (C) at the written torus baseline n=17
    (Phi_8(2)=17, g=4), the Boolean variable count of the Weil-descended
    fibre is at least the equal-cardinality subspace count after dependency
    quotient (predicted match under H2 / method-ceiling nearby-object
    control), so the group law does not reduce the descended system below
    the subspace arm. CLAIM TIER: structural certificate. NO exponent move.
    NO ECC2K-130 break. Extension families of positive-dimensional
    parameters are OUTSIDE the forall and are named as the open window
    (IDEA-20261002-711e84 / bedc95 / 8f26ce).

  mechanism: >-
    OBJECT FRAME. Representation R1 for the elliptic point (x-coordinate in
    F_{2^n}). Tracked object: the relation vector over a rational-point
    Couveignes factor base. Sigma = translation on E by factor-base elements
    only (Class I partial-action). Lossy projection: discard the discrete
    log and every non-decomposable point; compatible with factor-base
    translates inside the decomposable set. WHAT IS NEW relative to
    KN-OPEN-095df5 emptiness at g<=4 and IDEA-20260926-6f2601 (torus row
    without arity pricing): the forced arity integers m*=11 and m*=9, the
    Semaev degrees 512 and 128, and the Boolean-count comparison of the
    n=17 torus fibre against an equal-cardinality subspace. Charged stage:
    relation-collection accounting / arity ledger — not a solve of any
    descended system at n=131 under this card.

  assumptions:
    - >-
      |F| <= Weil ceiling 6725 (g=5) or 39201 (g=6) from KN-OPEN-095df5;
      ceilings are cited integers, not re-proved here.
    - >-
      Factor-base elements are images of F_2-rational points. Positive-
      dimensional extension families are outside the inequality (claim scope).
    - >-
      Each x-coordinate lifts to at most two curve points (plane cubic);
      the published m=3 image bound uses |F|^3 * 2^3.
    - >-
      Semaev degree 2^{m-2} is applied only after m is the exact least
      covering integer from Arm A.
    - Executable work: Arm A is integer arithmetic only; Arm B is toy n=17.
    - No Magma/Sage/cypari2/AUXIN/Bedrock required for Stages 0-1.

  proof_search_map:
    bottleneck: >-
      The arity m forced by |F| <= Weil ceiling, because Semaev degree
      2^{m-2} is exponential in that arity. Decidable by Arm A successive
      multiplication and Arm B Boolean-count comparison at n=17.
    baseline_embedding:
      parameter_slice: >-
        n=17, cyclotomic torus of dimension phi(8)=4 with Phi_8(2)=17
        (IDEA-20260926-80209d hand table; KN-OPEN-095df5 written torus).
        Group law: field multiplication. Equal-cardinality F_2-subspace of
        dimension 8 inside F_{2^{17}} as nearby-object control.
      reproduction_check: >-
        Stage 0: recompute Phi_8(2)=2^4+1=17 by integer arithmetic before
        any fibre is built; Arm A must print m*=11 (g=5) and m*=9 (g=6)
        with Semaev degrees 512 and 128; 8 * 39201^3 < 2^{51} must hold.
    observation_collision:
      observable: the triple (g, ceiling, least m)
      distinct_preimage_search: >-
        Two groups with the same rational-point ceiling and different
        descended Boolean counts are a collision: the ceiling does not
        determine the variable count. Torus arm vs subspace of size 2^8
        at n=17 are the two preimages compared.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          Weil ceiling at g=5 and g=6, lifted from emptiness at g<=4 to an
          arity lower bound at n=131.
        predicted_gain: >-
          Exact integers m=11 and m=9, and Semaev degrees 512 and 128, in
          place of an unpriced residual.
    quantifier_order: >-
      FOR ALL factor bases with |F| <= 39201 and at most two curve points
      per x-coordinate: the m=3 sumset image has size below 2^{51} and
      meets a fraction below 2^{-80} of a set of size 2^{131}. The least m
      with |F|^m >= 2^{131} is at least 9. EXISTS a parametrization outside
      this forall: a positive-dimensional family of extension points — not
      constructed here.
    method_ceiling:
      strongest_certifiable_claim: >-
        The arity bound for rational-point bases of dimension <= 6, and a
        Boolean variable count at n=17 for the torus fibre versus subspace.
        The method cannot certify that every Galois-invariant base misses
        rho, because extension families are outside the forall.
      nearby_object_control: >-
        An F_2-subspace of dimension 8 inside F_{2^{17}} (size 2^8, not a
        rational-point set of a dimension-4 group). If the torus arm matches
        that subspace on Boolean count and first-fall degree, the group law
        has not reduced the system. Relabelled Z/17Z control: a match with
        the torus arm means the count is an encoding artifact.
    proof_obligations:
      - claim: Successive multiplication of 6725 and of 39201 reproduces least m = 11 and 9.
        responsibility: correctness
      - claim: The n=17 torus arm reports Boolean count, first-fall degree, and |F|.
        responsibility: baseline
      - claim: The image-fraction sentence is scoped to |F| at most the ceiling and to at most two points per x-coordinate.
        responsibility: scope
      - claim: Semaev degree 2^{m-2} is applied only after m is the exact least integer.
        responsibility: runtime
      - claim: Memory (Macaulay note at degree 128/512) stated beside every time figure; no o(1) hiding.
        responsibility: memory
    not_applicable_reason: null

  predictions:
    - metric: least m with ceiling^m >= 2^{131}, integer, at g=5 and at g=6
      direction: higher
      minimum_effect: 11 at g=5 and 9 at g=6, both strictly above 3
    - metric: Semaev degree 2^{m-2} at those arities, integer
      direction: higher
      minimum_effect: 512 at g=5 and 128 at g=6
    - metric: Boolean variable count of the n=17 torus fibre after Weil descent, integer
      direction: higher
      minimum_effect: >-
        At least the equal-cardinality subspace count after dependency
        quotient (predicted match; drop below both 68 and the subspace
        arm with Z/17Z not matching is the sole positive toy shape)

  test_boundary:
    instances:
      - Arm A: integer successive multiplication at n=131 (no curve)
      - Arm B: cyclotomic torus fibre at n=17 over F_2 with Phi_8(2)=17
    parameters:
      g_ceilings: {5: 6725, 6: 39201}
      n_ledger: 131
      n_toy: 17
      arity_primary: 3
    implementation: >-
      Pure Python under experiments/EXP-FROB-8451c7/implementation/;
      command surface experiments/EXP-FROB-8451c7/implementation/run.py
      driven by trial-plan-v1.json. May reuse
      experiments/EXP-CERTBIN-e94b27/impl/gf2n.py as read-only copy/wrapper.
    budget:
      wall_clock_seconds: 7200
      memory_gb: 4
      maximum_runs: 4

  falsification_conditions:
    - >-
      Successive multiplication yields a least m other than 11 at g=5 or
      other than 9 at g=6 (Arm A fails; ledger void).
    - >-
      Phi_8(2) is not 17 in the instrument, or a fixed F_{2^8} multiplication
      check fails (artifact; no image-fraction claim kept).
    - >-
      A rational-point set of an explicit group of dimension <= 6 exceeds
      the Weil ceiling used here.
    - >-
      Arm B Boolean count strictly below the subspace arm AND the Z/17Z
      control does not show the same drop: then the torus group law reduced
      the system (positive toy shape; report as O-POSITIVE-TOY, not an
      n=131 exponent claim).

  distinguishable_outcomes:
    - id: O-LEDGER
      meaning: >-
        Arm A returns m*=11 and m*=9 with degrees 512 and 128; Arm B Boolean
        count matches the subspace arm (after quotient) within the stated
        band; Z/17Z control matches or is disclosed. Rational-point
        Couveignes bases at g<=6 sit above the m=3 benchmark; rho exponent
        n/2 untouched.
    - id: O-POSITIVE-TOY
      meaning: >-
        Arm A holds; Arm B Boolean count strictly below both 68 and the
        subspace arm, and Z/17Z does not reproduce the drop. Toy observation
        only; no n=131 transfer.
    - id: O-ARTIFACT
      meaning: >-
        Phi_8(2) mismatch, multiplication check fail, or Arm A disagrees
        with m*=11/9. No image-fraction claim kept.
    - id: O-IMPEDIMENT
      meaning: >-
        Infrastructure timeout/crash/missing dependency. Never negative
        evidence against (A)-(C).

  interpretation_limits:
    - >-
      Bound stops at rational-point images of dimension <= 6. Extension
      families are the open window (711e84 / bedc95 / 8f26ce).
    - >-
      No attack at field degree >= 131. Arm A is multiplication of two
      integers. ECC2K-130 is not an instance. The figure 2^60.9 is a
      citation, not a result of this record.
    - >-
      m=9/degree 128 and m=11/degree 512 are charged costs, not claims that
      Groebner finishes or beats 2^60.9.
    - KN-OPEN-020 class: implicit-membership for fibre equations.

  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        Each ordered m-tuple of x-coordinates determines at most 2^m sums
        on E, and |F| <= 39201, so the m=3 image has size below 2^{51}.
      random_model_justification: >-
        At most two points lie above a given x on a nonsingular plane cubic.
        |F| <= 39201 is the g=6 ceiling in KN-OPEN-095df5. Pattern: trivial
        sumset |mF| <= |F|^m with the 2^m lift written explicitly.
      supporting_results:
        - >-
          KN-OPEN-095df5 Weil ceilings (internal); plane-cubic point-above-x
          count (standard).
      validation_experiment_ids:
        - EXP-FROB-8451c7
      falsification_condition: >-
        Arm A check 8 * ceiling^3 < 2^{51} fails, or at n=17 a single excess
        witness shows m=3 image > 8*|F|^3.
    - id: H2
      formal_statement: >-
        Each of the g torus coordinates of a fibre point is a free element
        of F_{2^n} before fibre equations are imposed, giving g*n Boolean
        variables at descent before dependency quotient.
      random_model_justification: >-
        Definition of Weil restriction; pattern of generic linear
        independence for g < n (here g=4, n=17).
      supporting_results: []
      validation_experiment_ids:
        - EXP-FROB-8451c7
      falsification_condition: >-
        Row-reduced rank of the g*n descended coordinates before S_3 is
        outside {68} without an explicit listed deficiency.

  asymptotic_claim:
    problem: >-
      ECDLP on binary elliptic curves via Couveignes / index-calculus
      relation collection with a rational-point factor base of dimension <= 6
    prior_best: >-
      Pollard rho ~ 2^{n/2}/n^{1/2} on Koblitz (2^60.9 at n=131); m=3
      free-oracle index-calculus floor 2^68.58 (KR-IC-1fcdbc / KN-FIND-aa2efc)
    time_exponent: >-
      unchanged (n/2); under the rational-point cap at g<=6 the forced
      Semaev degree is at least 128 — larger than the m=3 benchmark, not a
      reduction of n/2
    memory_exponent: >-
      unchanged vs van Oorschot-Wiener; Macaulay memory at degree 128/512
      not claimed smaller than rho memory
    hidden_cofactor: >-
      Factors 1/n and n^2 are polynomial in n. Sign lift 2^m and ordering
      m! sit inside the image bound and are named. Semaev degree 2^{m-2} at
      forced m is 128 or 512 — superpolynomial in g, named not hidden in o(1).
    claim_kind: constant_factor

  structural_ingredients:
    - description: Weil ceiling integers 6725 (g=5) and 39201 (g=6) on #A(F_2)
      citation: knowledge/open-problems/KN-OPEN-095df5.md
      provenance: internal
      verified_by: coordinator, this design session, via KN-OPEN-095df5 path cited in IDEA-20261002-cad44c
      role: cardinality upper bound forcing arity
    - description: Semaev summation-polynomial degree 2^{m-2} in each variable
      citation: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
      provenance: internal
      verified_by: coordinator, this design session, via frontier row cited in the idea
      role: degree after forced arity
    - description: Phi_8(2)=17 cyclotomic torus baseline at n=17
      citation: ledger/proposals/IDEA-20260926-80209d.yaml (hand table); KN-OPEN-095df5
      provenance: internal
      verified_by: coordinator, this design session, as cited; recomputed in Stage 0
      role: baseline embedding cell

  status_note: >-
    Approved under standing user authorization once the protocol was
    complete. Approval does not assert the hypothesis is true.
