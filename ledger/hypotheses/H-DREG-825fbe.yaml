# H-DREG-825fbe — specified from IDEA-20261005-be4540.
# Protocol approval is DEC-20261006-0824f3. This record asserts no
# subexponential ECDLP cost, no GHS cover, and no semi-regular estimate.
# The design session froze the curve by a point count. It did not build
# a Macaulay matrix and does not know the first-fall gap.
hypothesis:
  id: H-DREG-825fbe
  question_id: RQ-DREG-bd6c86
  source_proposal: IDEA-20261005-be4540
  status: approved
  status_note: >-
    approved means the measurement protocol in EXP-DREG-e02be8 is
    approved for a later executor. It does not mean the absolute gap
    is at least 1. Status moves only by DEC-20261006-0824f3 under the
    standing user authorization of 2026-09-06. This design session
    wrote no run artifact and did not build a Macaulay matrix.
  proposed_by: coordinator
  conversion_note: >-
    The prediction, the new_falls formula, the degree cap 6, the
    sentinel 7, the 20 support-matched nulls, the grevlex order, and
    the equal-value negative are carried from IDEA-20261005-be4540.
    The Coordinator pinned the curve-selection scan, the S_3 formula
    in KN-TECH-002, the median of an even sample, and the range rule
    from that proposal's heuristic H1.

  statement: >-
    TEST BOUNDARY. Prime p=5. Short Weierstrass curves
    y^2 = x^3 + A x + B. Lexicographic order of pairs (A, B) with A
    the first key and B the second, both ranging through 0, 1, 2, 3, 4,
    so the sequence begins (0, 0), (0, 1), (0, 2), (0, 3), (0, 4),
    (1, 0). Skip a pair when 4 A^3 + 27 B^2 is 0 in F_5. On each
    remaining pair compute the trace t = 6 - #E(F_5) by counting
    projective points. Freeze the first pair with t not equal to 0.
    The design session's count selects (A, B) = (1, 0), with #E = 4
    and t = 2. The executor repeats the scan. If it does not select
    that pair with that trace, the cell is void and no matrix is built.

    The system is the raw, unsymmetrized S_3 in F_5[x1, x2, x3] at
    m=3 and n'=1, one generator, grevlex with x1 > x2 > x3. n'=1 means
    the variables are already coordinates over F_5. No extension basis
    is introduced, no field polynomial x_i^5 - x_i is added, and S_3
    is not rewritten in elementary symmetric polynomials. new_falls(D)
    is rank(M_D) minus the rank of the degree-exactly-D columns of
    M_D minus rank(M_{D-1}), for D from 1 through 6, with rank(M_0)
    equal to 0. The comparison value is the least D in 1..6 with
    new_falls(D) > 0, or 7 when no such D exists. The same value is
    computed for the Semaev system and for 20 null systems that keep
    the zero pattern of that expanded S_3 and replace each nonzero
    coefficient by an independent uniform element of {1, 2, 3, 4}.

    PRE-REGISTERED PREDICTION, fixed before any executor run. The
    absolute difference between the Semaev comparison value and the
    median of the 20 null comparison values is at least 1. The median
    of 20 values is the average of the 10th and 11th order statistics.
    Equal comparison values, meaning that absolute difference is 0,
    falsify a structural gap at this cell. A null range of 2 or more
    makes the median unstable and the cell inconclusive. No
    subexponential ECDLP cost is claimed.

    DISTINGUISHABLE OUTCOMES. (1) The curve pin matches, both rankers
    agree, the plants pass, Jacobian operations are 0, every matrix
    through degree 6 finishes, the null range is at most 1, and the
    absolute gap is at least 1: the branch claim holds at this cell.
    (2) The same checks pass and the absolute gap is 0: the branch
    claim fails. (3) The same checks pass and the null range is at
    least 2: inconclusive, not a structural gap. (4) The rankers
    disagree, a plant fails, or the curve scan disagrees: the cell is
    void. (5) A timeout or an unfinished matrix: infrastructure, not
    a high degree of regularity.

  mechanism: >-
    Representation: the curve equation and the descended polynomial,
    not a coordinate of a point. Operation set: multiplication by
    degree-1 monomials that appends the next Macaulay block. That
    operation is not translation on the prime-order subgroup.
    Trichotomy: branching. The integer new_falls(D) does not determine
    the new rows, so the fall count does not propagate as a function
    of the previous integer alone. Two row spaces of equal rank can
    collide, so the projection from the row space onto the fall
    sequence is lossy. The open number is the gap between the Semaev
    first positive degree and the null median at this one cell. A gap
    of at least 1 means the support-matched null does not reproduce
    the Semaev fall. Equal values mean the support accounts for the
    fall, including the censored pair (7, 7). The descent is the
    polynomial system at n'=1. It is not the GHS map to a
    hyperelliptic Jacobian.

  assumptions:
    - Over F_5, trace of Frobenius nonzero is the ordinary test used to freeze the curve. For |t| at most 4, t not divisible by 5 is the same test. If the frozen curve is later shown supersingular, the cell is void, not a negative.
    - The monomial order is grevlex with x1 > x2 > x3 and is frozen before the null draws.
    - The null keeps the Semaev support and replaces nonzero coefficients by independent uniform nonzero field elements. The zero pattern is not redrawn.
    - Degree cap 6. The sentinel 7 means no positive new_falls through degree 6. It is not a measured degree of 7.
    - S_3 is the formula in KN-TECH-002. A different polynomial is a different cell.
    - This session counted points to freeze (A, B) = (1, 0). It did not build M_D and it does not know the gap.

  proof_search_map:
    bottleneck: >-
      Whether the first positive new_falls degree of this one S_3
      differs by at least 1 from the median of 20 support-matched
      nulls. Replacing the Semaev coefficients by a null draw is what
      the comparison measures. A hyperelliptic Jacobian and a
      semi-regular formula are outside this measurement. This session
      did not build the matrices.
    baseline_embedding:
      parameter_slice: >-
        The first null draw scored twice, once by each ranker. The
        two new_falls vectors must agree. A family compared with a
        disagreeing implementation is not a fall gap.
      reproduction_check: >-
        Both rankers return the same new_falls(D) for D from 1
        through 6 on the null drawn with seed 1, and both return the
        three planted ranks 2, 1, and 0.
    observation_collision:
      observable: >-
        The absolute gap between the Semaev comparison value and the
        median of the 20 null comparison values, together with the
        range of those 20 values.
      distinct_preimage_search: >-
        Two different coefficient fills can share a comparison value.
        That collision is expected. A witness for the negative is a
        finished pair whose absolute gap is 0 while the null range is
        at most 1.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          One ordinary curve over F_5, raw S_3, then 20 fills of its
          support.
        predicted_gain: >-
          An absolute gap of at least 1 on that pair, and agreement
          of the two rankers on the repeated null. No asymptotic gain.
    quantifier_order: >-
      The claim is one comparison at q=5, m=3, n'=1, cap 6. It does
      not say that every curve has a gap, and it does not say that
      the gap survives at a larger prime or at n' greater than 1.
    method_ceiling:
      strongest_certifiable_claim: >-
        The absolute gap of these comparison values at this cell.
        Nothing about a subexponential cost and nothing about the
        last-fall bound as the extension degree grows.
      nearby_object_control: >-
        The 20 support-matched nulls. A dense random system of a
        different support is not the control. On the repeated null,
        the two rankers must agree; a gap computed from disagreeing
        ranks is void.
    proof_obligations:
      - claim: The absolute gap at this cell is at least 1.
        responsibility: baseline
      - claim: The two rankers agree on the seed-1 null and on the plants.
        responsibility: correctness
      - claim: No subexponential cost and no Jacobian discrete logarithm is inferred.
        responsibility: scope
    not_applicable_reason: >-
      The map above audits one rank-profile comparison. It is not a
      closed form and not a complexity proof.

  rerandomization: >-
    The 20 null fills re-randomize coefficients on a frozen support.
    There is no walk on the curve and no discrete log is pulled back
    to an input point.

  asymptotic_claim:
    problem: >-
      Whether the absolute first-fall gap at this one cell is at
      least 1. ECDLP is not claimed to be faster.
    prior_best: >-
      No attack is improved. Generic Pollard rho remains exponent
      1/2. KN-TECH-018 adjusts that constant by about sqrt(|Aut|).
      KR-IC-fbdb61 records a last-fall bound independent of the
      extension degree under stated conditions. This cell does not
      replace that bound.
    time_exponent: unchanged
    memory_exponent: unchanged
    hidden_cofactor: >-
      No algorithmic o(1) term is claimed. The work is one curve, one
      S_3, Macaulay matrices through degree 6, and 20 null fills plus
      one repeated rank.
    claim_kind_note: >-
      No exponent improvement, cofactor improvement, or constant-factor
      improvement is claimed, so none of those three labels is applied.

  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        With the zero pattern held fixed, independent uniform nonzero
        coefficients on that support produce a first-positive
        new_falls degree whose median is a stable one-cell baseline.
        The Semaev coefficient pattern is one point against that
        baseline. This imitates a uniform random sparse matrix of the
        same shape over a finite field. It is not a semi-regular
        degree prediction.
      random_model_justification: >-
        The support constraint is exact: the null and the Semaev
        system have the same zero pattern by construction. The uniform
        draw on the nonzero positions is the model. KR-IC-fbdb61,
        opened, says semi-regular predictions do not describe
        descended summation systems, so this heuristic does not use
        one.
      supporting_results:
        - ref: IDEA-20261005-be4540
          provenance: internal
          claim: >-
            The proposal states this support-matched null, the sample
            of 20, and the rule that a null range of 2 or more marks
            the median unstable.
          verified_by: ledger/proposals/IDEA-20261005-be4540.yaml
        - ref: KR-IC-fbdb61
          provenance: internal
          claim: >-
            Semi-regular predictions do not describe descended
            summation systems. Solving degree, last fall degree, and
            degree of regularity are distinct.
          verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-fbdb61.yaml
      validation_experiment_ids:
        - EXP-DREG-e02be8
      falsification_condition: >-
        Both profiles finish, the rankers agree, the null range is at
        most 1, and the absolute gap is 0. That is the same numerical
        event as the branch negative. A null range of 2 or more does
        not falsify the heuristic; it marks the median unstable.

  structural_ingredients:
    - description: >-
        new_falls(D) equals rank(M_D) minus the rank of the
        degree-exactly-D columns minus rank(M_{D-1}). The identity is
        the title and the opening claim of IDEA-20260916-4b7c1e. This
        hypothesis uses that formula and does not restate the rest of
        that file.
      citation: IDEA-20260916-4b7c1e
      provenance: internal
      verified_by: ledger/proposals/IDEA-20260916-4b7c1e.yaml
      role: definition of the measured rank profile
    - description: >-
        S_3 for y^2 = x^3 + a x + b is
        (x1 - x2)^2 x3^2 - 2((x1 + x2)(x1 x2 + a) + 2b) x3
        + (x1 x2 - a)^2 - 4b(x1 + x2).
      citation: KN-TECH-002
      provenance: internal
      verified_by: knowledge/techniques/KN-TECH-002.md
      role: pinned generator
    - description: >-
        The same S_3 formula is implemented by s3_coefficients in the
        harness module. The experiment expands the polynomial; it does
        not call a decomposition search.
      citation: src/crypto_autoresearcher/index_calculus/semaev.py
      provenance: internal
      verified_by: src/crypto_autoresearcher/index_calculus/semaev.py
      role: second statement of the same generator
    - description: >-
        The last fall degree of Weil-descended systems is bounded
        independently of the extension degree under stated conditions.
        Solving degree, last fall degree, and degree of regularity are
        distinct. Semi-regular predictions do not describe descended
        summation systems. This cell does not vary the extension
        degree and does not use a semi-regular formula.
      citation: KR-IC-fbdb61
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-fbdb61.yaml
      role: known bound this one-cell gap does not replace
    - description: >-
        GHS Weil descent maps ECDLP to a hyperelliptic Jacobian and is
        effective only for special fields and curves. This measurement
        performs 0 Jacobian operations.
      citation: KR-IC-5ea2f8
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5ea2f8.yaml
      role: known mechanism this rank profile does not run
    - description: >-
        S_m vanishes when points with those x-coordinates sum to the
        identity, up to signs. Using that for decomposition is the
        index-calculus framework. This record uses S_3 as the system
        whose fall degree is measured and adds no decomposition
        algorithm.
      citation: KR-IC-5a43e5
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
      role: framework the generator comes from
    - description: >-
        The binary first-fall dispute records no consensus that binary
        ECDLP is subexponential. This cell is not a binary field and
        does not adopt that assumption.
      citation: KR-IC-889857
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-889857.yaml
      role: dispute this prime-field cell does not join
    - description: >-
        Rho baseline discount of about sqrt(|Aut|), with sqrt(2) for
        negation. This measurement does not beat that baseline.
      citation: KN-TECH-018
      provenance: internal
      verified_by: knowledge/techniques/KN-TECH-018.md
      role: constant this gap does not improve
    - description: >-
        Incidence and endomorphism-image oracles are closed at generic
        exponent 1/2. This record is a Macaulay rank profile, not one
        of those oracles.
      citation: KN-FIND-b7e091
      provenance: internal
      verified_by: knowledge/findings/KN-FIND-b7e091.md
      role: closure this profile does not reopen
    - description: >-
        Recalled pointer, not opened, for a last-fall degree that
        bounds the solving degree. Not support. The statement used
        here is the opened row KR-IC-fbdb61.
      citation: Huang-Kosters-Petit-Yeo last-fall degree
      provenance: recalled
      verified_by: null
      role: pointer only

  reduction_chain:
    core_problem: >-
      Whether the absolute gap between the Semaev first positive
      new_falls degree and the median of 20 support-matched nulls is
      at least 1, at q=5, m=3, n'=1, cap 6.
    corollaries: []
    corollaries_note: >-
      No published reduction is invoked. One integer gap does not
      cascade to a discrete logarithm.

  predictions:
    - metric: absolute_gap_first_positive_new_falls_degree
      direction: different
      minimum_effect: >-
        Absolute difference at least 1 between the Semaev comparison
        value and the median of the 20 null comparison values, cap
        sentinel 7 included.

  test_boundary:
    instances:
      - the first nonsingular short-Weierstrass curve over F_5 in lex order of (A, B) with nonzero trace
      - one raw S_3 Macaulay profile through degree 6
      - 20 support-matched null profiles
      - one repeated rank of the seed-1 null
      - three planted rank matrices
    parameters:
      prime: 5
      m: 3
      n_prime: 1
      degree_cap: 6
      sentinel: 7
      null_draws: 20
      monomial_order: grevlex
      variable_order: x1 > x2 > x3
      pinned_curve:
        A: 1
        B: 0
        trace: 2
        point_count: 4
    implementation: >-
      Expand S_3 from KN-TECH-002 at the frozen (A, B). Build Macaulay
      matrices through degree 6. Draw 20 nulls with Python
      random.Random seeds 1 through 20. Score plants and the second
      ranker before assigning the gap. Do not build a hyperelliptic
      Jacobian.
    budget:
      enforcement: advisory
      maximum_runs: 1
      note: >-
        One curve and 21 rank profiles. Time and memory watches live
        on the experiment contract. They are advisory.

  falsification_conditions:
    - Both profiles finish through degree 6, the rankers agree, the plants pass, the curve pin matches, the null range is at most 1, and the absolute gap is 0.
    - The writeup treats the gap as a subexponential ECDLP cost or as a Jacobian discrete logarithm.

  interpretation_limits:
    - One cell at q=5, m=3, n'=1 does not determine growth in n or m and does not move the generic exponent 1/2.
    - The sentinel 7 is a cap, not a fall at degree 7.
    - A nonzero gap is not a license to assume the first-fall degree stays bounded at cryptographic size, and it is not a claim that the last-fall bound in KR-IC-fbdb61 fails.
    - new_falls as used here is not identified with last fall degree.
    - A null range of 2 or more is inconclusive, not a structural gap and not a negative.
    - An absolute gap of 1/2, from a half-integer median, meets neither the prediction nor the equal-value negative.
    - The design session counted points only. There is no recorded fall gap yet.

