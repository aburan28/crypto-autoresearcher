hypothesis:
  id: H-ECDLP-a4c9c1
  question_id: RQ-ECDLP-002
  statement: >-
    Formalises IDEA-20260731-015. For a prime-field curve E/F_p with a
    prime-order subgroup G = <P> of order N, a factor base built as
    F = {s_i * P} with the scalars s_i PUBLIC removes the relation-collection
    and sparse-linear-algebra stages of prime-field index calculus by
    construction, because every base element already has a known logarithm.
    Three separable claims, deliberately not merged.
    (C1, DERIVATION, not an experimental arm) With known base logarithms no
    relation matrix is needed at all, so the single-target cost is
    attempts-per-success times membership-query cost and nothing else. Its
    falsifier would be an arithmetic contradiction in the cost decomposition
    and it is therefore recorded as a derivation, not measured against a band.
    (C2, MEASURED, curve-specific) A decomposition of a masked target
    R_t = Q + tP found by the committed Semaev membership test over the base
    x-set is convertible to a VERIFIED discrete logarithm at a charged cost of
    at most 2^m certificate re-multiplications per found decomposition, and
    the end-to-end verified-solve rate is 1.000 on every completed cell.
    (C3, MEASURED, curve-specific) The amortized membership-query exponent
    alpha, defined by query cost = c * B^alpha and fitted over at least four
    base sizes, satisfies alpha < m/2 for at least one tested arity m in
    {3,4,5}, which is the condition under which the assembled per-target
    exponent alpha/m falls below the rho exponent 1/2 at the tested scale.
  mechanism: >-
    Per target, draw a fresh mask t, form R_t = Q + tP, and run the committed
    Semaev membership test (S_{m+1} plus indicator factors over the base
    x-set). On success the test returns an unordered multiset of m base
    x-coordinates. Because the base x-set is the x-projection of {s_i P},
    each returned x lifts to two points +/- s_i P, so the recovered scalar is
    k = sum_j eps_j * s_{i_j} - t over a sign vector eps in {+1,-1}^m, and
    the correct sign vector is found by testing at most 2^m candidates against
    an independent re-multiplication check. This is a CORRECTION to the source
    idea, which states the recovery as k = +/- sum(s_i) - t verified by ONE
    re-multiplication; that is the m = 1 case. The correct verification charge
    is 2^m re-multiplications per found decomposition, which at m = 5 is 32 and
    is a constant, not an exponent, but it must be charged.
    Relation collection and linear algebra never run, because no base logarithm
    is unknown. The unknown-log variant runs on the identical point set with
    the scalars hidden and is charged S_rel + S_LA + descent, so the two arms
    differ only in scalar visibility.
  assumptions:
    - >-
      The base F = {s_i P} has B = ceil((m! N)^(1/m)) elements drawn with
      distinct +/- classes (s_i not congruent to +/- s_j mod N), so the base
      x-set has B distinct field elements. No coverage or yield advantage is
      claimed for the base as a point set.
    - >-
      The membership test is identical in both arms and is the committed
      Semaev solve at a pinned engine revision. alpha is a property of the
      point set and the test, not of scalar visibility.
    - >-
      Every failed attempt is charged at full query cost against the target.
      An uncharged single-solve figure may be reported alongside but never
      substituted for the yield-charged cost.
    - >-
      Toy instances only. No exponent measured here is transferred to
      cryptographic parameters.
  proof_search_map:
    bottleneck: >-
      The relation-collection plus sparse-linear-algebra term of the assembled
      index-calculus budget, which every standing cost model in this ledger
      charges unconditionally.
    baseline_embedding:
      parameter_slice: >-
        The unknown-log variant on the identical point set at K = 1 target.
        This is the exact old-method boundary and both arms must be charged in
        the same operation unit.
      reproduction_check: >-
        Frozen regression fixture. The unknown-log arm must reproduce
        H-IC-001's committed cost decomposition C_IC(K) = S_rel + S_LA +
        K*(T_desc + T_verify) term by term on at least one cell before any
        direct-arm number is admitted.
    observation_collision:
      observable: >-
        Yield-charged group operations per solved target, fitted against N.
      distinct_preimage_search: >-
        COLLISION EXISTS AND IS THE REASON FOR THE CURVE-FREE NULL. The same
        observable is produced by index calculus with a known-log factor base
        in ANY finite cyclic group; the removal of collection and linear
        algebra uses no elliptic structure whatsoever. Only alpha, the cost of
        the Semaev membership test, is curve-specific. The curve-free null in
        (Z/N, +) separates the two preimages.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace an unknown-log factor base by a public-scalar factor base,
          moving the base logarithms from unknowns determined by a solve to
          data chosen by the attacker.
        predicted_gain: >-
          Removal of the S_rel and S_LA terms entirely for the single-target
          case, at the price of a 2^m sign-search per found decomposition.
    quantifier_order: >-
      FOR ALL tested arities m in {3,4,5} and FOR ALL tested subgroup orders N
      in the declared ladder, THERE EXISTS a public-scalar base of size
      B = ceil((m! N)^(1/m)) such that the measured yield-charged per-target
      cost is c * B^alpha with alpha measured, never assumed. The base is
      chosen before any target is drawn and never after.
    method_ceiling:
      strongest_certifiable_claim: >-
        At the tested toy sizes and under the committed Semaev engine, the
        public-scalar variant solves targets end to end with verified
        certificates at a measured per-target exponent, and the unknown-log
        variant's removed term is measured in the same unit. Nothing about
        cryptographic-scale alpha is certified.
      nearby_object_control: >-
        Index calculus with a public-scalar base in (Z/N, +) where the
        membership test is exact subset-sum over the same B. If it reproduces
        the direct arm's exponent, the removal is generic and carries no
        elliptic content.
    proof_obligations:
      - claim: The unknown-log arm reproduces H-IC-001's committed decomposition.
        responsibility: baseline
      - claim: Recovery of k from a found decomposition is exact under at most 2^m sign tests.
        responsibility: correctness
      - claim: Every recovered k carries an independently re-verified certificate.
        responsibility: correctness
      - claim: Attempts-per-success is charged in full, including every failure.
        responsibility: success_probability
      - claim: alpha is fitted over at least four base sizes with a pre-registered fit rule.
        responsibility: runtime
      - claim: Base-set memory and query workspace are charged in bits.
        responsibility: memory
      - claim: The curve-free null separates generic index calculus from elliptic content.
        responsibility: strictness
      - claim: No base scalar, mask, or target is reused across cells.
        responsibility: interface
    not_applicable_reason: null
  rerandomization: >-
    Per-target masking R_t = Q + tP with a fresh t drawn per attempt is the
    only randomization device. It is not a worst-to-average-case reduction and
    no mixing-time claim is made; its sole purpose is to make repeated attempts
    on one target independent draws of the decomposition event.
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-PS-1
      formal_statement: >-
        For every tested m and N, the amortized membership-query exponent alpha
        defined by expected query cost = c * B^alpha + o(B^alpha) is a function
        of the base as a POINT SET and of the membership test alone, and is
        invariant under the visibility of the base scalars. Formally: for the
        same point set F, the query-cost distribution measured with s_i public
        and with s_i hidden are equal in distribution.
      random_model_justification: >-
        The membership test is a function of the base x-set alone; the Semaev
        system and its indicator factors contain no scalar. Scalar visibility
        therefore cannot enter the polynomial system, so any difference in
        measured query cost between the arms is an implementation artifact.
      supporting_results:
        - >-
          EV-FBG-001 conservation identity for mean yield over any base of
          size B. RELAYED from IDEA-20260731-015 and NOT read by this
          Coordinator; it does not discharge this heuristic until read.
        - >-
          EV-SUBRES-001 upper bound on m=5 query operations. RELAYED from
          IDEA-20260731-015 and NOT read by this Coordinator.
      validation_experiment_ids:
        - EXP-ECDLP-e7f6e4
      falsification_condition: >-
        Measured query-cost distributions differ between the public-scalar and
        hidden-scalar arms on the identical point set by more than Monte Carlo
        error at any cell. That is an implementation leak and voids the run
        rather than refuting the mechanism.
  structural_ingredients:
    - description: >-
        Source proposal. Public-scalar factor base, the removal of collection
        and linear algebra, and the alpha < m/2 gate.
      citation: IDEA-20260731-015
      provenance: internal
      verified_by: >-
        TASK-20260904-c063e5 coordinator. Full read of
        ledger/proposals/IDEA-20260731-015.yaml, 375 lines, Read tool,
        2026-09-04.
      role: originating claim
    - description: >-
        Committed index-calculus cost decomposition, recorded verbatim as
        "C_IC(K) = S_rel + S_LA + K*(T_desc + T_verify)". Record status is
        "weakened". NOTE, the source idea quotes this as
        "S_rel + S_LA + K*T_desc", omitting T_verify; the record's own text is
        used here.
      citation: H-IC-001
      provenance: internal
      verified_by: >-
        TASK-20260904-c063e5 coordinator. Targeted read of
        ledger/hypotheses/H-IC-001.yaml lines matching the cost decomposition
        and status, Grep tool, 2026-09-04. The full record was not read.
      role: baseline cost model
    - description: >-
        Assembled per-target budget E = max((1+alpha)/m, omega_LA/m, 1/m) and
        the sparse-solve term Theta(m B^{omega_LA}) = Theta(N^{omega_LA/m}).
      citation: IDEA-20260727-007
      provenance: internal
      verified_by: >-
        TASK-20260904-c063e5 coordinator. Targeted read of the two lines
        carrying the formulas, Grep tool, 2026-09-04. The full record was not
        read and the "alpha < 3/2" phrasing was not located verbatim; the
        gate is inferred from E < 1/2 at m = 5, which the record does state.
      role: standing gate the correction challenges
    - description: >-
        Conservation identity for mean yield and the bounded coverage channel.
      citation: EV-FBG-001
      provenance: internal
      verified_by: null
      role: relayed; yield accounting control
    - description: >-
        Upper bound on m=5 membership-query operations.
      citation: EV-SUBRES-001
      provenance: internal
      verified_by: null
      role: relayed; upper bound on alpha
  reduction_chain:
    core_problem: >-
      Single-target prime-field ECDLP by Semaev decomposition over a
      public-scalar factor base, at toy subgroup orders.
    corollaries: []
  predictions:
    - metric: >-
        end_to_end_verified_solve_rate, solved targets carrying an
        independently re-verified certificate divided by targets on which a
        decomposition was found, dimensionless
      direction: higher
      minimum_effect: >-
        Exactly 1.000 on every completed cell. Any value below 1.000 means the
        sign or index recovery is lossy and the mechanism is wrong as stated.
        The planted-defect control fixes the dynamic range, one corrupted base
        scalar must drive this rate to 0.000 on the affected cell.
    - metric: >-
        alpha, the amortized membership-query exponent fitted from
        query cost = c * B^alpha over at least four base sizes, dimensionless
      direction: lower
      minimum_effect: >-
        alpha < m/2 at at least one tested m in {3,4,5}, with the fitted
        two-sided 95 percent interval lying entirely below m/2. If the
        interval half-width exceeds (m/2 - alpha_hat)/2 the cell is declared
        UNDERPOWERED and the required number of base sizes is reported; the
        threshold is never widened.
    - metric: >-
        removed_term_magnitude, the measured (S_rel + S_LA) of the unknown-log
        arm divided by the direct arm's total per-target cost, at K = 1, in
        group-operation equivalents on both sides
      direction: higher
      minimum_effect: >-
        REPORTED, NOT A DISCRIMINATOR. Its sign is forced non-negative by the
        cost decomposition and it decays to 0 as K grows, so no value of it can
        falsify anything. Recorded as a magnitude with an interval.
    - metric: >-
        curve_free_null_exponent_gap, the fitted per-target exponent of the
        (Z/N, +) public-scalar arm minus the elliptic direct arm's exponent,
        dimensionless
      direction: different
      minimum_effect: >-
        If the two exponents agree within the pooled 95 percent interval, the
        measured saving is generic cyclic-group index calculus and NO ECDLP or
        elliptic-curve statement may be drawn from it. Only a gap larger than
        the pooled interval is attributable to the Semaev membership test.
  test_boundary:
    instances:
      - >-
        Toy prime-field short-Weierstrass curves with prime-order subgroups at
        16, 20 and 24 bits, three seeds each, hygiene-screened for
        "#E(F_p) != p" and factored group order.
      - >-
        Curve-free null instances in (Z/N, +) at the same three N values.
    parameters:
      claim_tier: toy
      arities: [3, 4, 5]
      base_size_rule: B = ceil((m! * N)^(1/m)), plus a four-point B ladder for the alpha fit
      targets_per_cell: 10
      subgroup_bits: [16, 20, 24]
    implementation: >-
      Not yet written. The contract EXP-ECDLP-e7f6e4 declares the required
      artifacts; no implementation exists at the time this record is minted.
    budget:
      wall_clock_seconds_per_run: 3600
      maximum_memory_gb: 8
      maximum_runs: 12
  falsification_conditions:
    - >-
      TOY-TIER FALSIFIER on C2. The end-to-end verified-solve rate is below
      1.000 on any completed cell while the planted-defect control fires
      correctly. The recovery k = sum eps_j s_{i_j} - t is then lossy and the
      public-scalar mechanism is wrong as stated at the tested scope.
    - >-
      TOY-TIER FALSIFIER on C3. The fitted alpha interval lies entirely at or
      above m/2 at every tested m, with the fit-quality rule satisfied. The
      assembled per-target exponent alpha/m is then at or above 1/2 and the
      direct route closes at the tested scope only.
    - >-
      SCOPE FALSIFIER. The curve-free (Z/N, +) arm reproduces the direct arm's
      fitted exponent within the pooled interval. The result is then a
      statement about index calculus in cyclic groups and asserts nothing about
      elliptic curves or the ECDLP, whatever its magnitude.
    - >-
      INSTRUMENT VOID. The planted-defect control fails to drive the
      verified-solve rate to 0.000, or the public-scalar and hidden-scalar
      query-cost distributions differ on the identical point set. Nothing is
      admissible.
    - >-
      INFRASTRUCTURE, NOT EVIDENCE. The unknown-log arm fails to reach rank
      B-1 within budget, or any run times out or crashes. Reported as an
      infrastructure outcome per AGENTS.md rule 5.
  interpretation_limits:
    - >-
      Toy scale only, 16 to 24 bit subgroups. No measured exponent is a
      statement about cryptographic parameters, and alpha at a cryptographic
      base size B = N^(1/m) with N about 2^256 is UNTESTABLE AT REACHABLE
      SCALE by any method available to this program. The contract says so and
      makes no extrapolation.
    - >-
      Claim C1 is a derivation about a cost decomposition, not a measurement.
      It is not evidence and carries no interval.
    - >-
      A measured alpha/m below 1/2 at toy scale is a conditional budget under
      the measured alpha and the committed engine. Per AGENTS.md rule 12 it
      requires independent review-breakthrough handling before any status
      change, and may never be reported as a solve or as crypto-scale evidence.
    - >-
      This record makes no status change to H-IC-001, IDEA-20260727-003,
      IDEA-20260727-007 or SG-ECDLP-004. Reconciling this ledger's internal
      index-calculus accounting with any confirmed correction is a separate
      Coordinator act.
    - >-
      The 2^m sign search is a constant, not an exponent, but it is charged.
      No claim is made that it stays constant at larger m.
  status: proposed
  proposed_by: idea-generator
