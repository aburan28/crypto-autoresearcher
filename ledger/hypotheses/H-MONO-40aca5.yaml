hypothesis:
  id: H-MONO-40aca5
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  goal_status_note: >-
    GOAL-MONO-001 is `paused`. This record makes NO relation-rate claim and
    proposes NO attack; it cashes an already-committed structural theorem
    (KN-FIND-c41ea9) as a per-attempt cost identity and produces a
    formulation-labelling reading pass over OTHER goals' (GOAL-SDEG-001,
    GOAL-DREG-001, GOAL-SIG-001, the ICEX threshold contract)
    already-committed, immutable records. Approved and executed under the
    identical standalone-experiment precedent already established for this
    session's four sibling MONO contracts (see EXP-MONO-a20e48's own
    `coordinator_approval_rationale`). Creating this record does not
    reopen GOAL-MONO-001, and every read of another goal's artifact in
    this record is READ-ONLY — no other goal's directory, ledger record,
    or state is written to, claimed, or locked by this record.
  source_proposal: IDEA-20260806-9d47e2
  status: proposed
  proposed_by: idea-generator

  conversion_note: >-
    Schema conversion of an already-complete, unusually rigorous proposal
    (added 2026-08-06). All mathematical content (the cost identity, the
    two-formulation dichotomy, the labelling deliverable, the five
    controls, the heuristic assumptions) is the idea-generator's, carried
    over with no new claim introduced. The Coordinator's own judgment,
    disclosed here, is confined to: (1) SCOPING m. The proposal's
    predictions span m in {3,...,8} for the operation-count measurement
    (Stage 2) but m in {3,4,5} implicitly for anything requiring the
    summation polynomial S_m itself (fixture reproduction, the negative-
    locus control, the partial-locus cost) — S_m for m>=6 requires an
    increasingly expensive iterated-resultant elimination not worth this
    toy-scale budget. This record keeps Stage 2's operation count at the
    proposal's full m in {3,...,8} (it needs NO polynomial construction:
    formulation E is pure group arithmetic) but caps every
    polynomial-construction-dependent stage at m in {2,3,4,5}, disclosed
    explicitly rather than silently narrowing the proposal's own range.
    (2) INFRASTRUCTURE REUSE. `harness/semaev.py` already implements S_2,
    S_3, S_4 (via one resultant elimination from S_3) and
    `harness/toycurve.py` already implements exact, auditable
    EllipticCurve/Point arithmetic (`add`, `mul`, `lift_x`) — this contract
    requires the Executor to REUSE both rather than reimplement curve
    arithmetic or S_3/S_4 from scratch, and to extend the identical
    resultant pattern by one further elimination step to obtain S_5. (3)
    CONCRETE PARAMETER CHOICES: p in {211, 1009} (matching the proposal's
    own predictions exactly; 211 for direct comparison against
    KN-FIND-c41ea9's own committed fixture and this session's other MONO
    experiments' curves), and >=10^5 attempts per Stage-2 cell (the
    proposal's own stated floor). (4) THE CROSS-GOAL LABELLING PASS IS
    READ-ONLY AND OBSERVATIONAL: the Executor reads already-committed
    evidence/decision/experiment records under GOAL-SDEG-001,
    GOAL-DREG-001, GOAL-SIG-001, and the ICEX threshold contract
    (`fa9839`/`EXP-ICEX-146ff5` if committed, else the proposal by that
    name) and reports a label (E, S, or non-labellable) per cell as an
    OBSERVATION in this experiment's own `execution_report.yaml`; it
    writes nothing to any of those other goals' directories or records,
    and this record proposes no status change to any of them. No
    hypothesis or experiment status beyond `proposed` / `review_required`
    is authorized by this record (AGENTS.md rule 1).

  statement: >-
    TEST BOUNDARY, STATED FIRST. This is a COST-MODEL / LABELLING
    hypothesis, not a hypothesis about any curve's monodromy or about
    ECDLP hardness: it claims (a) that KN-FIND-c41ea9's factor-base-locus
    complete-splitting theorem lets the "enumerate-and-test" relation-
    search formulation (formulation E) obtain a summation fibre's roots by
    GROUP ADDITIONS ALONE — exactly m-1 additions plus one O(1) membership
    test per attempt, no polynomial root-find — pinning the per-attempt
    cost D_trial(E) exactly; and (b) that this lane's own already-committed
    solving-degree measurements (SDEG, DREG, SIG) and the ICEX threshold
    contract all belong to the OTHER formulation (formulation S,
    solve-for-the-tuple), specifically for an EXTENSION-FIELD membership
    predicate where the constraint is free — meaning none of them currently
    measures D_trial for any prime-field enumerate-and-test formulation. It
    is tested by (i) an exact operation-count instrumentation of
    formulation E at m in {3,...,8}, p in {211,1009}; (ii) reproducing
    KN-FIND-c41ea9's own committed m=4 fixture and extending it to m=5;
    (iii) a null control on the generic (non-factor-base) locus; (iv) a
    genuinely open measurement of the partial-locus (large-prime) fibre
    cost, which the underlying theorem does NOT cover; and (v) a read-only
    labelling pass over other goals' already-committed measurement cells.
    It makes NO attack claim: the composed accounting (cheap D_trial times
    an enormous attempt count) is already known, from prior committed
    catalogue work, to be STRICTLY WORSE than Pollard rho at every finite
    m — this record pins a parameter and produces a label, it does not
    move an exponent.

  mechanism: >-
    DERIVED in IDEA-20260806-9d47e2 from KN-FIND-c41ea9 (read in full) and
    the group law; carried over in substance with the m-scoping above.

    STEP 1 (the two formulations). FORMULATION E: loop over (m-1)-tuples
    from the factor base F; compute the residual Q = R - (P_{i1}+...+
    P_{i_{m-1}}) via the group law; test Q in F by an O(1) hash lookup.
    Attempts: ~C(|F|+m-2, m-1). D_trial(E): EXACTLY m-1 group additions
    plus one O(1) lookup, by KN-FIND-c41ea9's own theorem (the summation
    fibre's roots over a factor-base tuple are x(+-P_1 +- ... +- P_{m-1}),
    obtained by adding points, never by root-finding S_m). FORMULATION S:
    fix the target, solve S_{m+1}(x_1,...,x_m,x(R))=0 subject to x_i in
    x(F); D_trial(S) is governed by a solving degree.

    STEP 2 (fixture reproduction and extension, THE HARD GATE). Reproduce
    KN-FIND-c41ea9's own committed m=4, p=211 census (193 specialisations,
    193/193 complete splitting, root sets exactly {x(+-P1+-P2+-P3)}) using
    `harness/semaev.py`'s existing `s4_expr` — cell for cell, before
    anything new is read. Then extend to m=5 at p in {211,1009}: build
    S_5 by ONE further resultant elimination from S_4 and S_3 (the
    identical pattern `s4_expr` already uses to build S_4 from two copies
    of S_3), evaluated numerically mod p (not symbolically over Z) for
    tractability, and check set equality of the measured root set against
    the group-law prediction {x(+-P1+-P2+-P3+-P4)}.

    STEP 3 (operation-count instrumentation, m in {3,...,8}, NO polynomial
    construction needed). Instrument formulation E's attempt loop directly
    using `harness/toycurve.py`'s `EllipticCurve.add`: for each of
    >=10^5 attempts per (m,p) cell, draw m-1 factor-base points, sum them
    via m-2 calls to `.add` (an (m-1)-fold sum costs m-2 additions when
    accumulated pairwise, plus the one subtraction from R which is itself
    one more `.add` after negation — report BOTH the m-1 convention the
    proposal states and the exact call count actually instrumented, and
    reconcile any difference explicitly rather than silently rounding),
    and count exactly. No `s_m` evaluation, root-finding, or polynomial
    arithmetic may appear in this stage's instrumented code path; any that
    does voids the cell per the proposal's own falsification condition.

    STEP 4 (controls, all mandatory, per the proposal's own `minimal_test.
    controls`). KNOWN-ANSWER EDGE (m=3): S_3 has degree 2 in T; the two
    roots are x(P+Q), x(P-Q) by the two-line chord derivation; the
    instrument must return exactly those two values and exactly m-1 = 2
    additions per attempt with a fixed target. COMMITTED-FIXTURE REPRODUCTION (m=4,
    CAN FAIL): per Step 2. NEGATIVE-LOCUS NULL (CAN FAIL): specialise S_3
    at x_1,x_2 chosen UNIFORMLY in F_p (not on the factor-base/on-curve
    locus); FORCED split rate 1/2 + O(1/p), NOT 1; a complete-splitting
    result here means the implementation is silently projecting onto the
    curve and voids the whole measurement. DEGENERATE CHECK (m=2, MUST
    FAIL GRACEFULLY): S_2 = x_1-x_2 has no fibre; the instrument must
    report this explicitly, never a numeric result. UNIT-DECLARATION
    TRIPWIRE: any cross-formulation ratio (D_trial(S)/D_trial(E)) must be
    REFUSED, not estimated, unless a group-operation-to-field-operation
    conversion constant is explicitly declared; this record declares NONE
    and therefore refuses that ratio outright (a disclosed, deliberate
    non-computation, not a gap).

    STEP 5 (the reachable positive: partial-locus fibre cost, m in {4,5}
    ONLY, genuinely open). KN-FIND-c41ea9's theorem requires ALL m-1
    coordinates to be factor-base x-coordinates. On the PARTIAL locus
    (m-2 factor-base coordinates fixed, one coordinate free), the fibre is
    a CURVE, not a finite set, and the theorem says nothing. Measure the
    charged operations to enumerate this fibre (genuine root-finding over
    the free coordinate, via `s4_expr`/the newly-built `s5_expr` evaluated
    as a univariate polynomial in the free variable) at m in {4,5},
    p in {211,1009}. PREDICTED: expensive (genuine root-finding required,
    NOT reducible to group additions); a cheap result here would itself be
    a new structural fact this record did not expect and must report
    prominently, not bury.

    STEP 6 (the read-only cross-goal labelling pass, ZERO COMPUTE, a
    reading task not a measurement). Read every locatable, already-
    committed measurement cell under `GOAL-SDEG-001`, `GOAL-DREG-001`,
    `GOAL-SIG-001`, and the ICEX threshold contract (`fa9839`/
    `EXP-ICEX-146ff5`, whichever is committed under that name or a
    superseding one), determine which polynomial system each cell's
    solving-degree measurement actually solves, and assign the label E, S
    with an extension-field membership predicate, S with a prime-field
    membership predicate, or NOT-LABELLABLE (system not recorded clearly
    enough to determine). PREDICTED (per the proposal): every cell labels
    S with an extension-field predicate. A cell that labels E, or S with a
    prime-field predicate, REFUTES that prediction and is named as the
    single most valuable cell across those three goals, per the proposal's
    own framing — reported prominently, never buried in a table.

  assumptions:
    - >-
      Charged units are group operations for formulation E; no
      group-operation-to-field-operation conversion is declared or
      computed in this record (Step 4's unit-declaration tripwire).
    - >-
      Membership testing "is Q in F" is O(1) given a stored hash table of
      size |F|, charged at |F| memory (H2 in `heuristic_assumptions`).
    - >-
      `harness/semaev.py`'s `s3_expr`/`s4_expr` and `harness/toycurve.py`'s
      `EllipticCurve` are correct as already committed and independently
      used by prior work in this repository; this record does not
      re-verify their own correctness beyond the m=4 fixture reproduction
      that is this record's own Stage-2 hard gate.
    - >-
      Every SDEG/DREG/SIG/ICEX cell this record reads is already
      committed (immutable) at the time of reading; a cell still `draft`
      or under active concurrent revision is reported as
      `not_yet_committed`, not labelled, and is not treated as a
      falsifier of the labelling prediction.

  proof_search_map:
    bottleneck: >-
      Whether the free parameter D_trial in the ICEX relation-collection
      threshold is pinned for the enumerate-and-test formulation (it is,
      by KN-FIND-c41ea9's own theorem plus the group law — this record's
      Step 1-3 cash that corollary), and whether this lane's own
      solving-degree measurements (SDEG/DREG/SIG) are even measuring the
      quantity the ICEX threshold needs (Step 6 answers this by reading,
      not deriving).
    baseline_embedding:
      parameter_slice: >-
        KN-FIND-c41ea9's own committed m=4, p=211 fixture (193
        specialisations) is an exact parameter slice this record's Step 2
        must reproduce cell for cell before any new cell is interpreted.
      reproduction_check: >-
        193/193 complete splitting, root sets exactly
        {x(+-P1+-P2+-P3)}, using `harness/semaev.py`'s own `s4_expr`.
    observation_collision:
      observable: >-
        The charged operation count D_trial as a function of the
        FORMULATION (E vs S), not of the curve — every prior MONO record
        this session tracked a property of the summation fibre itself
        (cycle type, splitting rate, monodromy group); this tracks the
        cost of the PROCEDURE that obtains the fibre.
      distinct_preimage_search: >-
        FOUND, per the proposal's own `discriminated_from`: this record's
        D_trial(E)=m-1 and IDEA-20260805-90df50's root-coincidence rate
        6(tau-1)/N (at m=4) are measured on the SAME summation fibre but
        answer unrelated questions — one is a statistic of the fibre, the
        other of the procedure that computes it — and one shared harness
        run separates them cleanly.
      applies_to: >-
        This record's D_trial(E) versus H-MONO-0b3def/H-MONO-0f9170's
        cycle-type/stratum-count statistics — orthogonal observables on
        the same object family, neither implying the other.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The summation fibre's root set, replaced by its group-law
          pre-image (a signed sum of factor-base points) wherever all
          coordinates are factor-base x-coordinates.
        predicted_gain: >-
          Eliminates the polynomial root-find entirely in formulation E,
          replacing a degree-2^{m-2} factorisation with m-1 group
          additions — the record's entire cost content.
    quantifier_order: >-
      FOR EVERY m in {3,4,5} and p in {211,1009}, THE ROOT SET of the
      summation fibre over a factor-base tuple EQUALS the group-law
      prediction (Step 2's fixture reproduction and extension); AND FOR
      EVERY m in {3,...,8}, p in {211,1009}, formulation E's measured
      per-attempt operation count equals exactly m-1 additions plus one
      O(1) lookup with zero polynomial-arithmetic operations (Step 3);
      AND for the partial locus at m in {4,5}, genuine root-finding is
      required (Step 5, the open/reachable-positive case, stated as a
      prediction not a certainty). Bounded and falsifiable at every tested
      cell.
    method_ceiling:
      strongest_certifiable_claim: >-
        For the FACTOR-BASE-COMPLETE locus (all m-1 coordinates are
        factor-base x-coordinates), formulation E's per-attempt cost is
        certified exactly, for every m and p, by the group law alone — no
        heuristic, no toy-scale caveat on the THEOREM (only on the
        measurements). NOT certifiable: anything about the PARTIAL locus
        (Step 5 is a measurement, not a proof, and predicts but does not
        establish that it is expensive); anything about formulation S's
        D_trial, which this record explicitly declines to pin.
      nearby_object_control: >-
        The negative-locus null (generic, non-factor-base x-coordinates)
        is the nearby-object control: an implementation that also reports
        complete splitting there is silently projecting onto the curve,
        and the entire measurement is void regardless of how clean the
        factor-base-locus numbers look.
    proof_obligations:
      - claim: "D_trial(E) = m-1 group additions + one O(1) lookup, for m in {3,4,5}, both tested p."
        responsibility: correctness
      - claim: "The m=4 fixture reproduces cell-for-cell (193/193, exact root sets)."
        responsibility: baseline
      - claim: "The negative-locus null shows split rate 1/2 + O(1/p) at m=3, NOT 1."
        responsibility: strictness
      - claim: "Every committed SDEG/DREG/SIG/ICEX cell reachable at run time is assigned a label (E/S-extension/S-prime/not-labellable)."
        responsibility: feasibility
      - claim: "The partial-locus fibre cost at m in {4,5} is measured and reported, whichever direction it points."
        responsibility: scope

  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        No heuristic is required for the central cost identity; it is an
        unconditional corollary of KN-FIND-c41ea9's own proof plus the
        group law, for every m and every p>3.
      rigorous_support: >-
        KN-FIND-c41ea9's own proof (elementary, independently re-derived
        by two reviewers per that entry's provenance note) plus the
        elliptic-curve group law.
      supporting_results: []
      validation_experiment_ids: [EXP-MONO-805a02]
      validation_scope_note: >-
        Tested by exhaustive reproduction of the committed m=4 fixture
        plus a fresh, exact m=5 census at both tested primes — complete
        verification at those sizes, not a distributional comparison.
      falsification_condition: >-
        The m=4 fixture fails to reproduce, or the m=5 root set does not
        equal the group-law prediction at either tested prime.
    - id: H2
      formal_statement: >-
        Membership "is Q in F" costs O(1) charged operations given |F|
        words of storage, charged at |F| memory.
      rigorous_support: >-
        Standard hashing; RECALLED as an operation-count fact, HEURISTIC
        as a real-hardware cost (a memory access is not constant-time
        under an area-time model).
      supporting_results: []
      validation_experiment_ids: [EXP-MONO-805a02]
      validation_scope_note: >-
        Report measured lookups per attempt and table size per cell, plus
        the same accounting under an area-time convention as a disclosed
        second column.
      falsification_condition: >-
        Measured per-attempt cost grows with p or shows operations beyond
        additions and one lookup.
    - id: H3
      formal_statement: >-
        The formulation label (E, S-extension, S-prime, or
        not-labellable) can be assigned to every committed SDEG, DREG,
        SIG, and ICEX measurement cell reachable at run time by reading
        the system that cell solves.
      rigorous_support: >-
        NONE claimed — an empirical claim about this repository's own
        artifacts, stated formally because a non-labellable cell is
        itself a reportable finding, not a gap to guess past.
      supporting_results: []
      validation_experiment_ids: [EXP-MONO-805a02]
      validation_scope_note: >-
        Step 6's reading pass; report labellable/non-labellable counts
        explicitly, never resolved by inference.
      falsification_condition: >-
        A committed cell labels as E, or as S with a prime-field
        membership predicate — either directly refutes the labelling
        prediction and is named as the single most valuable cell found.

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. NO ATTACK, NO EXPONENT MOVED, IN EITHER DIRECTION.
    Formulation E's algebra-free per-attempt cost is exactly compensated
    by its attempt count; the composed accounting
    (Theta(N^{1/2+1/m}) with a meet-in-the-middle join, per prior committed
    catalogue work this record adopts unchanged) is STRICTLY WORSE than
    Pollard rho's N^{1/2} at every finite m. sota_delta is zero on every
    attack axis.

  structural_ingredients:
    - description: >-
        KN-FIND-c41ea9's factor-base-locus complete-splitting theorem: for
        x_1,...,x_{m-1} rational x-coordinates, the summation fibre's
        roots are exactly x(+-P_1+-...+-P_{m-1}).
      citation: knowledge/findings/KN-FIND-c41ea9.md
      provenance: internal
      verified_by: TASK-20260802-1b4130 / TASK-20260802-e2702a (per that entry's own provenance)
      role: >-
        Supplies the entire cost identity (Steps 1-3); this record adds
        the cost corollary and the cross-goal labelling, not the theorem.
    - description: "KN-FIND-007's conservation identity (mean solutions per target)."
      citation: knowledge/findings/KN-FIND-007.md
      provenance: internal
      verified_by: coordinator (read in full during this record's own conversion, 2026-08-30)
      role: >-
        Confirms the mean solution count is formulation-invariant; used
        only to state that D_trial and success probability must be
        reported as a pair, never folded into one number.

  reduction_chain:
    core_problem: >-
      Pin the per-attempt cost D_trial for the enumerate-and-test
      relation-search formulation, and determine which formulation this
      lane's own already-committed solving-degree measurements actually
      belong to.
    corollaries:
      - problem: >-
          Whether the ICEX threshold contract's own rows can be
          re-labelled by formulation once this record's labels exist.
        reduction_ref: >-
          Not performed here (would require writing to another goal's
          contract); named as a concrete follow-up for the Coordinator
          owning that lane.
        asymptotics_preserved: not_applicable
    corollaries_note: >-
      Deliberately excludes: any claim that prime-field index calculus
      beats Pollard rho; any status change to GOAL-SDEG-001,
      GOAL-DREG-001, GOAL-SIG-001, or the ICEX threshold contract
      (Coordinator authority for those goals alone, AGENTS.md rule 1); any
      claim about the partial locus beyond the measurement Step 5
      performs.

  predictions:
    - metric: "D_trial(E) per attempt, m in {3,...,8}, p in {211,1009}, >=10^5 attempts/cell"
      direction: lower
      minimum_effect: "EXACTLY m-1 additions plus one O(1) lookup, zero polynomial-arithmetic operations, at every cell."
    - metric: "Root set of S_m over factor-base tuples vs. group-law prediction, m in {3,4,5}, p in {211,1009}"
      direction: same
      minimum_effect: "Set equality in 100% of tested tuples, reproducing the committed m=4/p=211 fixture (193/193) exactly before any new cell is read."
    - metric: "Negative-locus (generic, non-factor-base) split rate, m=3"
      direction: different
      minimum_effect: "1/2 + O(1/p), NOT 1; a complete-splitting result here voids the whole measurement."
    - metric: "Partial-locus fibre enumeration cost, m in {4,5}, p in {211,1009}"
      direction: higher
      minimum_effect: "Genuine root-finding cost, materially above m-1 additions; a cheap result is itself a new structural fact to report prominently."
    - metric: "Formulation label for every committed SDEG/DREG/SIG/ICEX cell reachable at run time"
      direction: different
      minimum_effect: "Every reachable cell labels S with an extension-field membership predicate; any E or S-prime-field cell refutes this and is named as the most valuable cell found."

  test_boundary:
    instances:
      - "p in {211, 1009} only."
      - "m in {2,3,4,5} for every polynomial-construction-dependent stage (fixture reproduction, negative-locus control, degenerate check, partial-locus cost) -- a disclosed Coordinator scoping-down from the proposal's implicit wider range, for tractability of iterated resultant elimination."
      - "m in {3,...,8} for Stage 2's pure operation-count measurement only (needs no polynomial construction)."
      - "The Step 6 labelling pass covers only cells reachable and already committed at run time; a goal whose relevant contract cannot be located is reported as such, not guessed."
    parameters:
      p_values: [211, 1009]
      m_range_polynomial_stages: "2..5"
      m_range_operation_count: "3..8"
      attempts_per_cell_floor: 100000
    implementation: >-
      Pure Python 3 plus `sympy` (already a harness dependency via
      `harness/semaev.py`), reusing `harness/semaev.py`'s `s3_expr`/
      `s4_expr` and `harness/toycurve.py`'s `EllipticCurve`/`Point`
      directly rather than reimplementing curve arithmetic or S_3/S_4.
    budget: >-
      See the frozen experiment contract for exact numbers. Low
      implementation cost (existing harness reuse), low compute (10^5
      attempts of trivial group arithmetic per cell; a handful of
      resultant eliminations at fixed, small p), per the source
      proposal's own `estimated_cost`.

  falsification_conditions:
    - "The m=4 fixture does not reproduce cell-for-cell. Stop; the construction differs from the finding's."
    - "The negative-locus (generic) control also splits completely. The implementation is silently projecting onto the curve; the whole measurement is void."
    - "Measured D_trial(E) grows with p or shows polynomial-arithmetic operations. The implementation is not formulation E."
    - "Any committed SDEG/DREG/SIG/ICEX cell labels as E, or as S with a prime-field membership predicate. The labelling prediction is wrong; that cell becomes the most valuable one found and must be reported prominently, not buried."
    - "The partial locus at m=4 or 5 also splits completely / is cheap to enumerate. Complete splitting reaches further than the theorem claims; a new structural fact exists and must be reported as the record's headline, not a footnote."
    - "fa9839 / EXP-ICEX-146ff5 (if committed) already charges formulation E explicitly. Then D_trial is already pinned there and this record's labelling half is largely void; only the partial-locus question and the exact m<=5 fixture work retain value."
    - "Any timeout, crash, or construction failure at any stage. failed_infrastructure per AGENTS.md rule 3, never negative evidence."

  confounders:
    - "UNIT INCOMMENSURABILITY: group operations and field operations are not comparable without a declared conversion; this record declares none and refuses the cross-formulation ratio outright rather than estimating it."
    - "CHEAP PER ATTEMPT IS NOT CHEAP IN TOTAL: formulation E's attempt count is B^{m-1} (or B^{ceil(m/2)} with a meet-in-the-middle join); D_trial(E)=m-1 must always be reported beside the attempt count, never alone."
    - "MEMORY: the O(1) membership test presumes |F| words of storage, charged as such, not free."
    - "SIGN CONVENTIONS: whether the factor base is closed under negation changes D_trial(E) by a factor of roughly 2^{m-2}/(m-1) for the full signed root set versus the single-residual convention; both must be reported, neither assumed."
    - "AUTHORSHIP: this record cashes KN-FIND-c41ea9's theorem; only the cost corollary and the cross-goal labelling are this record's own content."
    - "CONCURRENT GOAL STATE: GOAL-SDEG-001/GOAL-DREG-001/GOAL-SIG-001/the ICEX contract may be under active concurrent work by other sessions; Step 6 reads only already-committed (immutable at read time) artifacts and reports what it found, with the read timestamp/commit disclosed, never claims completeness of a goal's full history."

  interpretation_limits:
