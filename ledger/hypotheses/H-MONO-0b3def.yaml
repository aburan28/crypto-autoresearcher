hypothesis:
  id: H-MONO-0b3def
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  goal_status_note: >-
    GOAL-MONO-001 is `paused` (campaign budget exhausted: maximum_batches: 3,
    BATCH-003 was the third) as of its 2026-08-10 checkpoint. Its recorded
    `next_action` names a different live route (the T-line/direction-swap
    census of DEC-20260810-2f86db D-4/D-5) and explicitly rejects the
    generic-fibre cycle-type census AS A RELATION-RATE PROBE at every m. THIS
    RECORD MAKES NO RELATION-RATE CLAIM (S7 below): it is a pure group-theory
    decision about the m=3 symmetric-base cover's monodromy, which is the
    OTHER half of KN-OPEN-009 and is not the instrument the goal's
    next_action rejected. Creating this hypothesis/experiment pair does not
    reopen, resume, or reprioritize GOAL-MONO-001; execution of the paired
    experiment still requires a Coordinator batch assignment and a fresh
    budget grant from GOAL-PATH-001, exactly as for the two sibling
    review_required contracts already on file (EXP-MONO-c819ba,
    EXP-MONO-12ce1c).
  source_proposal: IDEA-20260830-1a08f9
  status: proposed
  proposed_by: idea-generator

  conversion_note: >-
    This record is a schema conversion of an already-complete, already-worked
    proposal. All mathematical content (statement, mechanism, proof_search_map,
    heuristic_assumptions, predictions, falsification_conditions) is the
    idea-generator's, carried over from IDEA-20260830-1a08f9 with no new claim
    introduced and no step re-derived. The Coordinator's own judgment is
    confined to: the explicit test-boundary scoping below, the mapping of the
    idea's `minimal_test`/`controls` design into this repo's hypothesis/
    experiment schema, and the decision (recorded in the paired experiment
    contract EXP-MONO-4c7479) to bound the FIRST frozen contract to Stages 0-1
    only. No hypothesis or experiment status is authorized by this record; it
    is `proposed`/`review_required` pending Coordinator approval (AGENTS.md
    rule 1).

  statement: >-
    TEST BOUNDARY, STATED FIRST. m = 3 only. p > 3. E/F_p given by
    y^2 = f(x) = x^3 + Ax + B with f squarefree (E non-singular). The tested
    object is the SYMMETRIC base B_sym = Spec k[e1,e2], e1 = t1+t2,
    e2 = t1 t2 -- never the ordered base (t1,t2), which appears only as a
    control. No claim is made for m != 3, for singular curves, for
    characteristic 2 or 3, or for any base other than B_sym.

    THE CLAIM. Let Phi(e1,e2) = {P in E : x(P) is a root of x^2 - e1 x + e2},
    the four points of E lying over the unordered pair {t1,t2}, carrying the
    intrinsic block system {{P1,-P1},{P2,-P2}} from the fibres of the x-map.
    Then for every p > 3 and every non-singular E/F_p:
    (a) the Galois closure of Phi over k(e1,e2) is k(t1,t2,y1,y2)
    (y_i^2 = f(t_i)), of degree exactly 8;
    (b) Gal(k(t1,t2,y1,y2)/k(e1,e2)) = (Z/2)^2 semidirect S_2 = Z/2 wr S_2 =
    D_4 (order 8), acting on the four points as the full stabiliser of the
    block system in S_4;
    (c) geometric monodromy = arithmetic monodromy = D_4, uniformly in the
    curve, with an EMPTY exceptional locus (proved by inertia generation at
    the two ramification divisors D_swap = {e1^2-4e2=0} and
    D_sign = {f(t1)f(t2)=0}, not by census);
    (d) consequently the 4-cycle class -- unrealizable over the ordered base
    by KN-FIND-a8990a Theorem B -- occurs over B_sym at forced density 1/4,
    and the five Frobenius classes (identity, {sigma_i}, sigma_1 sigma_2,
    block-swap involutions, 4-cycles) occur at forced densities
    1/8, 1/4, 1/8, 1/4, 1/4 respectively, exact up to O(1/p).

    DISTINGUISHABLE OUTCOMES (this is what a run can move, in either
    direction; see `falsification_conditions`):
    CONFIRMS (c)+(d): every base point off the excluded strata is classified
    identically by two independent methods; exactly 8 distinct labelled
    permutations are realized on every tested curve; the observed cycle-type
    densities agree with 1/8:1/4:1/8:1/4:1/4 within the stated statistical
    and O(1/p) tolerances; the matched ordered-base control on the same data
    reproduces KN-FIND-a8990a Theorem B exactly (two cycle types, zero
    4-cycles); the random-quartic S_4 control reproduces Chebotarev
    densities.
    FALSIFIES the upper bound (containment in D_4): any observed cycle type
    outside {1^4, 2.1.1, 2^2, 4} on a non-excluded point.
    FALSIFIES the lower bound / uniformity (the exceptional-locus half): zero
    4-cycles observed while the random-quartic control passes, OR fewer than
    8 distinct permutations realized on any tested curve, OR a class-density
    deviation of order p^{-1/2} across the p-ladder while controls pass.
    FALSIFIES the recipe/derivation link: any per-instance disagreement
    between the class forced by the character triple
    (chi(e1^2-4e2), chi(f(t1)), chi(f(t2))) and the observed class.
    INCONCLUSIVE / instrument failure, not evidence either way: the
    random-quartic control failing to reproduce S_4 Chebotarev densities
    (especially failing to emit type 3+1), or the two independent
    classification arms disagreeing off the declared instrument-degeneracy
    stratum {e1^2-e2+A=0}.

    WHAT THIS DOES NOT CLAIM (S7 of the source proposal, restated as a test
    boundary, not an afterthought): on the factor-base sublocus (both t_i
    themselves factor-base x-coordinates) the forced class is IDENTITY with
    probability 1 (KN-FIND-a8990a Theorem C); this record asserts and tests
    no relation-rate content and no algorithm, in either direction.

  mechanism: >-
    DERIVED in IDEA-20260830-1a08f9; the only imported ingredient is the
    discriminant identity disc_T S_3 = 16 f(t1) f(t2) (KN-FIND-a8990a,
    used, not reproved). Carried over verbatim in substance.

    STEP 1 (descent to the symmetric base). The three T-coefficients of
    harness/semaev.py's `s3_expr(a, b)` -- (x1-x2)^2, the middle term
    -2[(x1+x2)(x1 x2+A)+2B], and (x1 x2-A)^2-4B(x1+x2) -- are each symmetric
    in (x1,x2), hence polynomials in (e1,e2); substituting gives the three
    forms of the source proposal's (S1) with no normalisation or choice
    involved. This is the only place this record touches the harness code,
    and it touches it by READING the coefficients off `s3_expr`, not by
    re-deriving S_3 from scratch.

    STEP 2 (the degree-8 field). k(e1,e2) subset k(t1,t2) is quadratic,
    Galois with group <tau> (tau: t1 <-> t2), ramified exactly along
    e1^2-4e2=0. Adjoining y1,y2 (y_i^2=f(t_i)) over k(t1,t2) gives a (Z/2)^2
    extension because f(t1),f(t2) are non-associate squarefree elements of
    k[t1,t2] (KN-FIND-a8990a Theorem A step (2), cited not redone). tau lifts
    by y1<->y2, giving Gal(k(t1,t2,y1,y2)/k(e1,e2)) = <sigma1,sigma2,tau>
    with tau sigma1 tau = sigma2 -- the presentation of Z/2 wr S_2 = D_4.

    STEP 3 (explicit degree-4 instrument). The y-coordinates of Phi's four
    points are the roots of h(Y) = Y^4 - c1 Y^2 + c0 with
    c1 = f(t1)+f(t2) = e1^3 - 3 e1 e2 + A e1 + 2B and
    c0 = f(t1) f(t2) = e2^3 + A e2(e1^2-2e2) + B(e1^3-3e1e2) + A^2 e2
         + A B e1 + B^2,
    both polynomials in k[e1,e2] by inspection. The splitting field of h
    contains y1,y2 and (via t1-t2 = (y1^2-y2^2)/(e1^2-e2+A) and t1+t2=e1)
    recovers t1,t2, so it equals k(t1,t2,y1,y2) exactly, of degree 8. Hence
    Gal(h) = D_4 and h is a concrete, computable degree-4 instrument.
    disc_Y h = 16 c0 (e1^2-4e2)^2 (e1^2-e2+A)^4 exhibits the two
    ramification divisors of STEP 5 plus an instrument-only divisor
    {e1^2-e2+A=0} where h has repeated roots although the four points of Phi
    are still distinct (excluded stratum, see `assumptions`/confounders
    below).

    STEP 4 (arithmetic = geometric). F_p is algebraically closed in
    F_p(t1,t2); each of the three quadratic steps is ramified over an
    explicit divisor of the base, and a constant-field extension is
    unramified everywhere, so no step introduces new constants. Arithmetic
    monodromy over F_p therefore equals geometric monodromy over F_p-bar,
    both D_4, and Chebotarev over F_p licenses reading off the geometric
    group from Frobenius statistics. Discharged HERE for this cover only.

    STEP 5 (inertia decides the exceptional-locus question without a
    census). Upper bound: the action preserves the block system by
    construction, so the group is contained in Z/2 wr S_2. Lower bound: the
    cover is tame (degree 8, p odd) over the simply connected base A^2, so
    its geometric monodromy is generated by inertia at the ramification
    divisors D_swap = {e1^2-4e2=0} (inertia: a block swap) and
    D_sign = {f(t1)f(t2)=0} (inertia: a single sign flip sigma_i). A sign
    flip together with any block-swapping reflection generates all of D_4.
    Both inertia groups are non-trivial for EVERY non-singular E (f
    squarefree makes the x-map genuinely ramified over each root of f, and
    e1^2-4e2 is a non-square in k(e1,e2)). Hence the exceptional locus for
    the geometric-group half of RQ-MONO-001, in the wreath reading at m=3,
    is empty BY ARGUMENT. The census in the paired experiment is run as a
    CHECK of this derivation, not as the source of the conclusion.

  assumptions:
    - Characteristic p > 3, short Weierstrass form, m = 3 only.
    - >-
      E non-singular (f squarefree) -- the only curve hypothesis anywhere,
      and exactly where STEP 5's lower bound is used.
    - >-
      The base is affine A^2 in (e1,e2); densities are affine densities and
      the projective closure is not analysed.
    - >-
      Tameness: p odd, so p does not divide the ramification index (2)
      anywhere. Wild ramification is out of scope and would break STEP 5's
      lower bound (not its upper bound).
    - >-
      Excluded strata, never pooled into the primary classification: (i)
      e1^2-4e2=0 (t1=t2, degree drop); (ii) f(t1)f(t2)=0 (a t_i a 2-torsion
      x-coordinate, genuine ramification); (iii) e1^2-e2+A=0
      (instrument-only: h has repeated roots although the four points of Phi
      are distinct, so the quartic-factoring arm is invalid there while the
      direct-arithmetic arm is not).

  proof_search_map:
    bottleneck: >-
      The lower bound on the geometric monodromy, uniform in the curve.
      Everything else (containment in the wreath group, the Frobenius
      recipe) is bookkeeping. Without the lower bound only "the group is a
      subgroup of D_4" survives, which is compatible with an exceptional
      locus and decides nothing.
    baseline_embedding:
      parameter_slice: >-
        Restricting the degree-8 cover to the ordered base (adjoining
        sqrt(e1^2-4e2) to the base field) kills the S_2 factor and returns
        exactly KN-FIND-a8990a Theorem A at m=3: group (Z/2)^2 on the four
        points, only cycle types 1^4 and 2^2.
      reproduction_check: >-
        Symbolic: the fixed field of <tau> is k(t1,t2) and the induced group
        is <sigma1,sigma2>. Numeric: classify every base point twice, once
        over (t1,t2) and once over (e1,e2), and require the ordered arm to
        reproduce Theorem B's two-type law with zero exceptions. This is the
        `matched ordered-base arm` control in the paired experiment
        contract. A symmetrised result that cannot reproduce the committed
        ordered law on the same data is wrong.
    observation_collision:
      observable: >-
        The Frobenius conjugacy class in D_4, observed as the cycle type of
        the four points of Phi(e1,e2).
      distinct_preimage_search: >-
        REAL and disclosed: cycle type 2^2 has TWO preimages (the central
        element sigma1 sigma2, and the block-swap involutions), so cycle
        type alone does not determine the class. The required metrics
        therefore record the character triple
        (chi(e1^2-4e2), chi(f(t1)), chi(f(t2))), not just the cycle type; a
        record reporting cycle types alone would merge two classes of total
        density 3/8 and could not measure the 1/8-versus-1/4 split.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The degree-8 Galois cover of the symmetric base, replacing the
          degree-2 T-cover of the ordered base as the carrier of the
          question.
        predicted_gain: >-
          Group order 2 -> 8; realizable permutation orders {1,2} -> {1,2,4};
          a question vacuous at degree 2 (S_2 trivially full) becomes a
          genuine full-versus-not decision at degree 4.
      - transform: boundary_lift
        proposed_object: >-
          Inertia at the two ramification divisors, lifted to a lower bound
          on the global monodromy via tame pi_1 of A^2.
        predicted_gain: >-
          Converts a per-curve census into a curve-uniform theorem; the
          exceptional locus is shown empty rather than merely unobserved.
    quantifier_order: >-
      FOR ALL p > 3, FOR ALL non-singular E/F_p, THERE EXIST two ramification
      divisors whose inertia generate, and THEREFORE the geometric monodromy
      of the degree-4 symmetric-base cover equals Z/2 wr S_2. The group is
      full for EVERY curve, not merely for a generic one -- no "outside an
      exceptional locus" clause appears in the claim.
    method_ceiling:
      strongest_certifiable_claim: >-
        The geometric and arithmetic monodromy of the m=3 symmetric-base
        Semaev tower, exactly, for all p > 3 and all non-singular E. NOT
        certifiable by this method: anything about m >= 4 (there the
        symmetric base is Sym^3 and the wreath group is Z/2 wr S_3, order 48,
        not computed here); anything about relation rates on the
        factor-base sublocus (constant there, by S7); any cost claim.
      nearby_object_control: >-
        The nearby object on which the conclusion FAILS is the cover
        (Y^2-a(e))(Y^2-c a(e)) with c a fixed non-square constant: same
        degree, same block system, arithmetic group (Z/2)^2 but geometric
        group Z/2. Its existence is why STEP 4 is a required step and not a
        formality; it is the planted separator of sibling record
        IDEA-20260830-8a767e (not tested by this record or its paired
        experiment).
    proof_obligations:
      - claim: >-
          The three T-coefficients of S_3 lie in k[e1,e2] with the stated
          forms.
        responsibility: baseline
      - claim: >-
          [k(t1,t2,y1,y2):k(e1,e2)] = 8 and the extension is Galois with
          group D_4.
        responsibility: correctness
      - claim: >-
          Inertia at D_swap and D_sign generate D_4 for every non-singular E.
        responsibility: strictness
      - claim: No constant-field extension, hence arithmetic = geometric.
        responsibility: scope
      - claim: The Frobenius recipe (S6) determines the class per instance.
        responsibility: feasibility

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. NO ECDLP CLAIM OF ANY KIND, in either direction: no
    speedup, no barrier theorem, no change to any cost estimate. Pollard rho
    at p^{1/2} time, O(1) memory remains the prime-field ECDLP baseline
    (KN-OPEN-001). sota_delta is zero on every attack axis (time, memory,
    data/queries/advice); on the QUESTION axis, from a decided ordered-base
    group of order 2 at m=3 (where "full symmetric" is vacuous, S_2 being
    the whole symmetric group on 2 letters) to a decided symmetric-base
    group of order 8 on 4 points -- full wreath, index 3 in S_4. This record
    is not dominated by, and does not dominate, KN-FIND-a8990a Theorem A
    (different base, different group, a permutation class it forbids;
    Theorem A holds at every m, this holds at m=3 only): recorded as
    "extends by base change", never "beats".

  heuristic_assumptions:
    - id: HEUR-WREATH-1
      formal_statement: >-
        For a tame finite cover of A^2 over an algebraically closed field of
        characteristic p, branched along a divisor D, the geometric
        monodromy group is generated by the inertia subgroups at the
        components of D.
      random_model_justification: >-
        NOT A DISTRIBUTIONAL HEURISTIC -- a structural/algebraic dependence
        on a recalled lemma, stated here (per docs/target-result-profile.md)
        rather than left blank. The rigorous ingredient is the triviality of
        the prime-to-p etale fundamental group of affine space together with
        SGA1 tame specialisation theory (over C, the elementary statement
        that pi_1 of a complement is generated by loops around the branch
        components). RECALLED, NOT FETCHED this session or any prior one
        (see `structural_ingredients`): the gap is that in characteristic p
        the statement is for the tame quotient only, which applies exactly
        when p is odd (assumed) at this degree-8 cover.
      supporting_results: []
      validation_experiment_ids: [EXP-MONO-4c7479]
      validation_scope_note: >-
        EXP-MONO-4c7479 covers only p in {101, 211} (its Stage 0-1). The
        source proposal's full validation plan additionally samples p=1009
        on the same curve panel; that third rung, and the tail check on the
        curve with fewest realized permutations there, are OUT OF SCOPE for
        EXP-MONO-4c7479 and are named as future work in that contract. If
        the measured realized-permutation count is 8 on every panel curve at
        both tested primes, this heuristic is not load-bearing at the tested
        scope, which is why the validation is designed this way.
      falsification_condition: >-
        Fewer than 8 distinct labelled permutations realized on any panel
        curve at any tested prime (partial test at p in {101,211} under
        EXP-MONO-4c7479; the full p=1009 tail check is deferred).
    - id: HEUR-WREATH-2
      formal_statement: >-
        F_p is algebraically closed in F_p(t1,t2,y1,y2), so the arithmetic
        monodromy over F_p equals the geometric monodromy.
      random_model_justification: >-
        NOT A DISTRIBUTIONAL HEURISTIC. Argued in STEP 4 rather than merely
        assumed: a constant-field extension is everywhere unramified, and
        each of the three quadratic steps is ramified along an explicit
        divisor. KN-FIND-a8990a Theorem A asserts the same conclusion for
        the ordered sub-tower and is corroborating, not load-bearing. The
        residual gap: "ramified therefore not constant" is applied step by
        step rather than to an arbitrary subextension.
      supporting_results: []
      validation_experiment_ids: [EXP-MONO-4c7479]
      validation_scope_note: >-
        Direct-arithmetic arm (a) already requires lifting to F_p or F_{p^2}
        as needed, so recomputing the realized-class count over F_{p^2} as
        well as F_p on every panel curve at p in {101,211} is in scope for
        EXP-MONO-4c7479 and is a required metric there.
      falsification_condition: >-
        Any panel curve whose F_{p^2} realized-class count differs from its
        F_p realized-class count; voids the geometric reading for that curve.
    - id: HEUR-WREATH-3
      formal_statement: >-
        Over uniform (e1,e2) in F_p^2, the character triple
        (chi(e1^2-4e2), chi(f(t1)), chi(f(t2))) equidistributes over its
        attainable values up to an error of order 1/p, with no term of
        order p^{-1/2}.
      random_model_justification: >-
        e1^2-4e2 is uniform on F_p because e2 -> e1^2-4e2 is a bijection for
        fixed e1, so the first bit is exactly balanced. The remaining counts
        reduce to counts of x with f(x) a square, i.e. to S=(p-t-Z)/2 over
        F_p and its F_{p^2} analogue; the trace enters only through products
        that cancel at first order -- the same phenomenon KN-FIND-a8990a
        Theorem B records and proves for the ordered base.
      supporting_results: []
      validation_experiment_ids: [EXP-MONO-4c7479]
      validation_scope_note: >-
        EXP-MONO-4c7479's Stage 1 is EXHAUSTIVE over all p^2 base points at
        p in {101,211}, which is the full validation this heuristic asks for
        at those two primes (the source proposal's p=1009 rung samples
        rather than enumerates and is out of scope here). The closed-form
        exact residual check (exact integer 0, not a tolerance) is the
        sibling record IDEA-20260830-9761f0's claim and is NOT re-derived or
        tested here; only the O(1/p)-vs-p^{-1/2} distinction is tested, via
        the p-ladder {101,211} plus the deferred {1009}.
      falsification_condition: >-
        A class-density deviation from its forced value growing like
        p^{-1/2} rather than O(1/p) between p=101 and p=211 (partial;
        the third ladder point at p=1009 is required for a confident fit
        and is deferred).

  structural_ingredients:
    - description: >-
        The discriminant identity disc_T S_3 = 16 f(t1) f(t2), exact in
        Z[t1,t2,A,B]; and the fact that f(t1), f(t2) are non-associate
        squarefree elements of k[t1,t2], used to get the (Z/2)^2 splitting
        in STEP 2 and the c0 identity check in Stage 0 of the paired
        experiment.
      citation: KN-FIND-a8990a
      provenance: internal
      verified_by: >-
        idea-generator, this session (per IDEA-20260830-1a08f9): "Read in
        full, all 248 lines including the verification table and the
        'not an algorithm' section."
      role: supplies the STEP 2 splitting fact and the STEP 3/Stage-0 identity
    - description: >-
        A tame finite cover of A^2 branched along a divisor has geometric
        monodromy generated by inertia at the branch components (triviality
        of the prime-to-p etale pi_1 of affine space; tame specialisation).
      citation: "Grothendieck, SGA1"
      provenance: recalled
      verified_by: null
      role: supplies HEUR-WREATH-1, the STEP 5 lower bound
    - description: >-
        Classical resolvent criterion distinguishing D_4 from (Z/2)^2 or
        Z/4 for a biquadratic Y^4-c1Y^2+c0.
      citation: >-
        Kappe and Warren, an elementary test for the Galois group of a
        quartic polynomial
      provenance: recalled
      verified_by: null
      role: nearest standard result behind STEP 3's degree-8 splitting claim

  reduction_chain:
    core_problem: >-
      Determine the exact geometric and arithmetic monodromy of the m=3
      Semaev summation cover over its symmetric base, resolving which of
      KN-OPEN-009's two readings ("full symmetric" vs "full wreath") applies
      and whether the wreath reading's exceptional locus is empty.
    corollaries:
      - problem: >-
          Whether an m=3 exceptional-locus census is needed for the wreath
          reading of KN-OPEN-009.
        reduction_ref: >-
          Derived here (STEP 5): inertia at D_swap, D_sign generates D_4 for
          every non-singular curve; the upper bound follows from the
          preserved block system. No census is load-bearing for the
          conclusion; the paired experiment's census is a check.
        asymptotics_preserved: not_applicable
    corollaries_note: >-
      Deliberately excludes: any m>=4 statement (Z/2 wr S_3, order 48, is
      not computed here); any relation-rate or factor-base-sublocus content
      (S7: the statistic is identically the identity class there, per
      KN-FIND-a8990a Theorem C); any cost or exponent claim; and any status
      change to KN-OPEN-009, KN-FIND-a8990a, RQ-MONO-001, or GOAL-MONO-001
      (Coordinator authority alone, AGENTS.md rule 1).

  predictions:
    - metric: >-
        frequency of Frobenius cycle type 4 (a 4-cycle on the four points of
        Phi) over uniform (e1,e2) in F_p^2, excluded strata removed
      direction: higher
      minimum_effect: >-
        0.25 up to O(1/p); at least 0.20 at every tested p >= 101. The same
        classifier on the ordered base of the same curve must return EXACTLY
        0 4-cycles (KN-FIND-a8990a Theorem B). A symmetrised frequency of 0
        falsifies the wreath claim outright.
    - metric: frequency of cycle type 3+1 on the same fibres
      direction: lower
      minimum_effect: >-
        EXACTLY 0 over every classified base point. D_4 contains no element
        of order 3. One occurrence falsifies the wreath upper bound and
        would contradict the block system being preserved.
    - metric: >-
        number of distinct Frobenius permutations of the labelled four-point
        fibre realized per curve
      direction: higher
      minimum_effect: >-
        EXACTLY 8 at every tested p, on every curve of the panel. Fewer than
        8 with all controls passing is the exceptional-locus signal
        RQ-MONO-001 hunts and routes to its own record.
    - metric: >-
        per-instance agreement between observed cycle type and the type
        forced by the character triple (chi(e1^2-4e2), chi(f(t1)),
        chi(f(t2))) via the S6 recipe
      direction: higher
      minimum_effect: >-
        1.000 exactly, every classified base point, every curve. A single
        mismatch kills the record; stronger than any frequency test because
        it is per-instance.
    - metric: >-
        class densities (identity, {sigma_i}, sigma_1 sigma_2, block-swap
        involutions, 4-cycles) against the group-theoretic values
        (1/8, 1/4, 1/8, 1/4, 1/4)
      direction: same
      minimum_effect: >-
        Each within 3 binomial standard errors AND within an O(1/p) window;
        the deviation must NOT be of order p^{-1/2}. A p^{-1/2}-sized
        deviation would mean the trace enters at first order, contradicting
        the first-order cancellation KN-FIND-a8990a Theorem B records for
        the ordered base, and is a two-sided falsifier.
    - metric: >-
        curve-panel spread of each class density at fixed p (generic
        ordinary, CM, j=0, j=1728, full rational 2-torsion)
      direction: same
      minimum_effect: >-
        All panels agree with the same forced values within the same O(1/p)
        window. A j=0 or CM curve standing outside it is the single most
        informative possible failure. NOTE: the CM / j=0 / j=1728 / full
        2-torsion legs of this panel are OUT OF SCOPE for EXP-MONO-4c7479
        (generic-ordinary panel only); this prediction is untested by that
        contract and is named as future work there.

  test_boundary:
    instances:
      - "p in {101, 211, 1009}, all > 3; non-singular short-Weierstrass E/F_p; m=3 only."
      - "Stage 0: zero-compute symbolic identity check (no instance data)."
      - "Stage 1: exhaustive census of every (e1,e2) in F_p^2 at p in {101,211} -- IN SCOPE for EXP-MONO-4c7479."
      - "Stage 2: sampled census at p=1009 -- OUT OF SCOPE for EXP-MONO-4c7479; future work."
      - >-
        Stage 3: a matched ordered-base reproduction control at p in
        {101,211} IS in scope for EXP-MONO-4c7479 (reusing the same
        exhaustive data); a standalone p=1009-scale Stage 3 is deferred with
        Stage 2.
    parameters:
      m: 3
      field_characteristic: "p > 3"
      curve_condition: "f squarefree (E non-singular)"
      base: "symmetric (e1,e2) only; ordered base (t1,t2) is a control, never the tested object"
    implementation: >-
      Pure Python 3 stdlib integer/modular arithmetic over F_p and F_{p^2};
      no CAS, no external solver required. harness/semaev.py's `s3_expr` is
      the cited source of the S_3 coefficients used in STEP 1 of the
      mechanism (read, not re-derived at runtime).
    budget: >-
      See the frozen experiment contract for exact numbers. EXP-MONO-4c7479
      bounds its Stage 0-1 scope to well under 30 minutes wall-clock, under
      1GB memory, pure CPU, no network.

  falsification_conditions:
    - >-
      Any observed cycle type outside {1^4, 2.1.1, 2^2, 4} on a
      non-excluded base point. Kills the wreath upper bound; the record is
      withdrawn by a superseding record, never edited.
    - >-
      Zero 4-cycles observed on the symmetric base while the random-quartic
      control passes. Kills the lower bound and would mean the tower is not
      what STEP 2 says it is.
    - >-
      Any per-instance disagreement between the observed class and the
      class forced by the character triple.
    - >-
      Fewer than 8 distinct permutations realized on any curve at the
      largest tested p. This is the exceptional-locus outcome and it is a
      falsifier of the record's central claim, not a hoped-for result.
    - >-
      A class density deviating from its forced value by order p^{-1/2}
      across the p-ladder while controls pass. Then the trace enters at
      first order and the O(1/p) claim is wrong.
    - >-
      The random-quartic control failing to emit 3+1. Instrument outcome,
      not mathematical evidence; nothing may be reported in either
      direction (AGENTS.md rule 3).

  interpretation_limits:
    - >-
      CLAIM TIER toy for every measurement; the group computation is a
      DERIVATION and must be cited as one, never as an empirical finding.
      Largest p contemplated by the source proposal is about 1009; the
      currently frozen experiment tests only p in {101,211}.
    - >-
      NO ECDLP CLAIM OF ANY KIND, in either direction. No speedup, no
      barrier theorem, no change to any cost estimate.
    - >-
      DOES NOT EVADE THE CENSUS OBSTRUCTION. On the factor-base sublocus the
      statistic is identically the identity class, exactly as
      KN-FIND-a8990a Theorem C forces. Citing this record as a route to
      relation-rate content is misciting it.
    - >-
      m = 3 ONLY. At m >= 4 the symmetric base is Sym^{m-1} and the
      candidate group is Z/2 wr S_{m-1}; whether inertia still generates it
      is NOT addressed and is named as forward guidance.
    - >-
      NO STATUS CHANGE to KN-OPEN-009, KN-FIND-a8990a, RQ-MONO-001,
      GOAL-MONO-001, or any other record is proposed or implied by this
      record. Coordinator authority alone (AGENTS.md rule 1).
    - >-
      This record's paired experiment (EXP-MONO-4c7479) tests only Stage
      0-1 of the source proposal's four-stage minimal_test. Stage 2 (p=1009
      sampling) and Stage 3 (a standalone large-p ordered-base reproduction)
      are named as future work, not silently dropped.

