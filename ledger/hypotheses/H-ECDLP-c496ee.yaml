hypothesis:
  id: H-ECDLP-c496ee
  area: ECDLP
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  source_proposal: IDEA-20260815-e05d09
  proposal_id: IDEA-20260815-e05d09
  title: >
    Stage 0 citation-rate
    identities — 2/3 among reachable,
    not 2/4 — before any corpus
    entry is re-verified
  status: specified
  proposed_by: idea-generator
  designed_by: coordinator
  designed_under_task: TASK-20260913-93d5c1
  specified_by: DEC-20260913-9d513a
  specified_at: '2026-09-13'
  created: '2026-09-13'
  updated: '2026-09-13'
  depends_on:
    - IDEA-20260815-e05d09
    - RQ-ECDLP-002
  related_hypotheses: []
  statement: >
    Fix the closed-form
    verification-rate identities of
    IDEA-20260815-e05d09 on one
    frozen 4-marked + 2-unmarked toy
    sample before any live
    citation_verified corpus entry
    is re-checked. Stage 0 asserts
    only that among the four marked
    rows (verify, verify, fail,
    unreachable) the reachable rate
    is 2/3, that a nearby claim that
    the rate is 2/4 (counting
    unreachable as fail) is
    rejected, and that the unmarked
    pair is a separate category not
    merged into the marked
    denominator. This is not a
    corpus audit and not a rho beat.
    Stages 1+ stay unauthorized.
  mechanism: >
    IDEA-20260815-e05d09 tracks the
    verification rate of
    citation_verified markings.
    Stage 0 freezes the exact
    fraction identities so a later
    sample cannot be read from an
    instrument that conflates
    unreachable with fail. No
    primary source is fetched. No
    KN-OPEN-3f7a21 entry is
    re-scored. No Semaev S_m. No
    DLP solve.
  predictions:
    - id: P-S0-CITER
      metric: toy verification-rate identities
      direction: different
      minimum_effect: >
        After fixture_pass, REAL
        reports 2/3 among reachable
        marked rows. KF 2/4 is
        rejected. NULL unmarked
        pair is not merged into the
        marked denominator.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KF
      statement: >
        After fixture_pass, KF claim
        that the marked rate is 2/4
        is accepted.
    - id: F-S0-REAL
      statement: >
        After fixture_pass, REAL
        misses 2/3 among reachable
        or uses 4 as the marked
        reachable denominator.
  test_boundary:
    instances:
      - frozen Stage 0 REAL / KF / NULL rate-arithmetic panel
    parameters:
      real_sample:
        marked:
          - {id: M1, verdict: verify}
          - {id: M2, verdict: verify}
          - {id: M3, verdict: fail}
          - {id: M4, verdict: unreachable}
        rate_among_reachable_num: 2
        rate_among_reachable_den: 3
        must_not_use_4_as_denominator: true
      known_false:
        kind: rate_is_two_over_four
        claimed_num: 2
        claimed_den: 4
        must_reject: true
      matched_null:
        kind: unmarked_separate_category
        unmarked:
          - {id: U1, verdict: verify}
          - {id: U2, verdict: fail}
        must_not_merge_into_marked_denominator: true
      stage0_only_at_specify: true
    implementation: EXP-ECDLP-c23dd7 Stage 0 runner
    budget:
      wall_clock_seconds: 120
    prose: >
      Exact fraction arithmetic on
      a 4+2 toy sample. Stage 0
      does not fetch a primary
      source and does not re-verify
      a live corpus entry.
  assumptions:
    - id: A1
      statement: >
        Unreachable rows are
        excluded from the
        denominator. Stage 0 does
        not audit KN-OPEN-3f7a21.
      status: explicit
    - id: A2
      statement: >
        Standing user authorization
        2026-09-06 covers protocol
        approval once the contract is
        complete.
      status: explicit
  heuristic_assumptions: []
  proof_search_map:
    bottleneck: >
      Whether the reachable marked
      rate is 2/3 and 2/4 is
      rejected.
    baseline_embedding:
      parameter_slice: >
        REAL 4-row marked sample,
        KF 2/4, NULL unmarked pair.
      reproduction_check: >
        2/3 among reachable. KF
        rejected. NULL not merged
        into the marked denominator.
    observation_collision:
      observable: verify-count over reachable versus over all marked
      distinct_preimage_search: >
        Hold the four rows and
        count unreachable as fail
        (KF). Hold the method and
        merge unmarked into marked
        (NULL).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Frozen 4+2 rate table.
        predicted_gain: >
          Exact known-false reject on KF.
          Zero claimed corpus rate.
    quantifier_order: >
      Freeze the six rows and the
      reachable-denominator rule
      before reading the rate. Toy
      2/3 is not a corpus estimate.
    method_ceiling:
      strongest_certifiable_claim: >
        Instrument reproduction on
        the declared frozen
        fractions. Never a
        citation_verified audit.
        Never an ECDLP exponent.
      nearby_object_control: >
        NULL is the unmarked pair.
        An argument that still
        merges it into the marked
        denominator is
        proves-too-much.
  knowledge_promotion:
    promoted: []
    not_warranted: Stage 0 design only. Nothing to promote.
  scientific_boundary: >
    Stage 0 P-S0-CITER only. Not a
    corpus re-verification. Not
    KN-OPEN-3f7a21 closure. Not
    Semaev S_m. Not Coppersmith.
    Not a DLP solve. Not a rho
    beat. No Stage 1 of
    EXP-ECDLP-c23dd7.
