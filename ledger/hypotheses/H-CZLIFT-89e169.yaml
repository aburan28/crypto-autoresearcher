  added: '2026-10-09'
  proposed_by: coordinator
  designed_by: coordinator
  approval_decision: DEC-20261009-575cd3
  title: Over K = Q(2^{1/3}) the small points of E(K) exceed those of E(Q) by a bounded factor and reduce to E(F_p)
    like uniform points at split primes
  statement: 'For the six ladder curves of rank 0..5 and K-points x = alpha/d^2 with alpha in Z[theta], coordinates
    up to 32 and d <= 4: N_K(H) is at least N_Q(H) and at most 4 N_Q(H) at the top height on every curve with N_Q
    >= 10, and at 12 split primes between 101 and 5000 the distinct residues of the K-points in E(F_p) have ratio
    to the uniform model with median in [0.8, 1.2] and fewer than 5 percent of cells above 1.5.'
  mechanism: E(K) tensor Q contains E(Q) tensor Q plus the part cut out by the Galois closure of K; its rank is
    larger but still finite and the points of bounded height still number (log H)^{r_K/2}; reduction at a split
    prime identifies theta with a cube root of 2 and the small K-points, being few relative to p, carry no structure
    into E(F_p).
  assumptions:
  - Z[theta] is the maximal order of K
  - the square test is exact in Z[theta] (numeric candidate, exact verification)
  proof_search_map:
    not_applicable_reason: bounded measurement against a pre-registered prediction; no asymptotic claim
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
  - description: known-negative row on lifting to characteristic zero
    citation: knowledge/frontiers/ecdlp/index-calculus/KR-IC-cd159a.yaml
    provenance: internal
    verified_by: coordinator, this session (2026-10-09), read the entry on disk
    role: the obstruction being quantified
  reduction_chain:
    core_problem: whether a characteristic-zero lift of the ECDLP carries discrete-log information at the tested
      scope
    corollaries: []
  predictions:
  - metric: cubic_gain_median (N_K / N_Q at hmax)
    direction: different
    minimum_effect: in [1, 4]
  - metric: coverage_ratio_median, coverage_ratio_frac_above_1p5
    direction: different
    minimum_effect: median in [0.8, 1.2], frac above 1.5 below 0.05
  test_boundary:
    instances:
    - six ladder curves, coordinate box 32 with d <= 4, and box 24 with d <= 6 as the replication, 12 split primes
    parameters:
      field: Q(2^(1/3))
    implementation: experiments/EXP-CZLIFT-8c50ea/implementation/run.py over harness/czlift_cubic.py
    budget:
      wall_clock_seconds_per_run: 3600
  falsification_conditions:
  - a curve with N_K > 4 N_Q at the top height with N_Q >= 10 (a cubic-field point family far richer than the rational
    one)
  - coverage ratio median outside [0.8, 1.2]
  interpretation_limits:
  - tiny height box (coordinates to 32); r_K is not computed; one cubic field only
  status: approved
  status_note: Pre-run approval paired to EXP-CZLIFT-8c50ea under DEC-20261009-575cd3; asserts nothing about truth.
