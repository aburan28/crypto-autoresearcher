hypothesis:
  id: H-ECDLP-63eecd
  question_id: RQ-ECDLP-165d4b
  goal_id: GOAL-ECDLP-001
  source_proposal: coordination/goals/GOAL-ECDLP-001/proposals/NON-INDEX-ECDLP-IV-20260808/H-ECDLP-1853dc.yaml
  supersedes_hypothesis: H-ECDLP-63d136
  statement: >-
    On a pre-registered, fail-closed toy corpus of ordinary prime-order
    prime-field curves with independently certified subgroup-preserving
    automorphisms, a fully charged Pollard-rho walk canonicalized by the
    verified automorphism has lower normalized charged work than ordinary and
    negation-only controls for at least one held-out family of eight paired
    groups. This is a finite constant-factor prediction and does not change the
    generic 1/2 exponent.
  mechanism: >-
    A verified F_p-defined automorphism acts by a certified eigenvalue lambda
    on the prime subgroup. Canonicalizing each rho state to the lexicographically
    smallest encoded orbit representative and transforming its coefficients by
    lambda reduces the collision state space while retaining a
    certificate-recoverable discrete-log equation.
  assumptions:
    - >-
      Every admitted curve, subgroup, twist, automorphism group, eigenvalue,
      orbit, and state stabilizer is certified before any walk starts.
    - >-
      The canonical group-pair token fixes the target scalar, partition seed,
      stopping rule, and cost-model version for every source/random pair.
    - >-
      The exclusive counter schema charges every declared operation exactly
      once and the validator recomputes the total from raw counters.
    - >-
      Eight held-out groups and all calibration rows are fixed before any
      candidate-family outcome is observed; no row is replaced after a walk.
  proof_search_map:
    bottleneck: >-
      Determine whether quotienting by a verified automorphism lowers complete
      charged collision-search cost beyond negation after all overheads.
    baseline_embedding:
      parameter_slice: >-
        Frozen rho transition fixture on a 101-point prime subgroup with
        C-BASE and C-NEG coefficient/certificate equations.
      reproduction_check: >-
        The implementation must reproduce the committed coefficient sequence,
        negation transform, and collision equation before instance generation.
      audit_status: frozen_fixture_required_before_approval
    observation_collision:
      observable: normalized charged work and verified scalar recovery
      distinct_preimage_search: >-
        The fixture contains identical, quotient-equivalent, and distinct
        valid coefficient collisions. The last has a nonzero denominator and
        expected recovered scalar x=37.
      audit_status: frozen_fixture_required_before_approval
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: verified automorphism orbit representative
        predicted_gain: at most the declared effective orbit-size ceiling after overhead
    quantifier_order: >-
      For every fixed manifest row and seed, first validate all certificates;
      then run every paired variant with the same pair token and stopping rule;
      only then aggregate train or held-out family statistics.
    method_ceiling:
      strongest_certifiable_claim: >-
        A bounded toy finite-size constant-factor difference in charged rho work
        for the declared family, controls, seeds, and budget only.
      nearby_object_control: >-
        Matched same-order random ordinary curves and a deterministic relabel
        control with no claimed structural advantage.
    proof_obligations:
      - claim: certificate and walk correctness
        responsibility: fail_closed_verifier_and_recovery_check
      - claim: orbit-size and stabilizer feasibility
        responsibility: explicit_group_closure_and_state_witness
      - claim: charged cost comparison
        responsibility: exclusive_cost_vector_and_recomputation
      - claim: no exponent improvement inferred from finite sizes
        responsibility: held_out_slope_ceiling_and_scope
  rerandomization: null
  asymptotic_claim:
    problem: prime-order ECDLP on E(F_p)
    prior_best: ell^(1/2) generic Pollard-rho operations
    time_exponent: 1/2
    memory_exponent: 0
    hidden_cofactor: >-
      None hidden in the primary metric: setup, maps, canonicalization,
      retries, recovery, memory, hashing, certificate replay, and serialization
      charges are explicit.
    claim_kind: finite_constant_factor_only
  heuristic_assumptions:
    - id: HEUR-e42bda-01
      formal_statement: >-
        Conditional on the admitted certificate set and after the fixed
        partition/cycle controls pass, each quotient walk is sufficiently mixed
        for the measured finite-size collision distribution.
      random_model_justification: >-
        The birthday model is a comparison prediction only; the protocol emits
        cycle-tail and collision-certificate diagnostics and rejects a result
        when the pre-registered non-randomness predicate fires.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-1c12d3
      falsification_condition: >-
        Any certificate failure, persistent cycle predicate failure, recovery
        mismatch, or control-corrected held-out comparison outside the declared
        effect rule falsifies this finite-scope prediction.
  structural_ingredients:
    - description: verified subgroup-preserving F_p automorphism
      citation: >-
        GLV/GLS and automorphism-map rho methods are the prior mechanism class;
        this record makes no literature novelty or crypto-scale claim.
      role: representation_reduction
  reduction_chain:
    core_problem: prime-order ECDLP on E(F_p)
    corollaries: []
  predictions:
    - metric: held_out_median_normalized_charged_work_ratio_full_to_negation
      direction: lower
      minimum_effect: >-
        The lower Hodges-Lehmann geometric ratio estimator for both FULL/NEG
        and FULL/BASE is <= 0.90, where the estimator is the 18th ordered
        Walsh geometric mean of the 36 exact pairwise ratios. The exact paired
        signed-rank permutation statistic is frozen by the successor experiment:
        its inclusive two-sided p numerator is <= 6 out of 256 (equivalent to
        p <= 0.025) for each comparison under Bonferroni family-wise alpha
        0.05; all certificates are valid and no invalid/stopping rule fires.
    - metric: fitted_log_log_slope
      direction: equal
      minimum_effect: >-
        No slope below 1/2 is accepted; the slope is descriptive only and must
        carry a finite-size confidence interval and the toy claim ceiling.
  paired_test_contract:
    observations: >-
      For each held-out group i, W_FULL_i and W_CONTROL_i are positive integer
      exclusive charged-work totals recomputed from raw counters. Set the exact
      reduced rational r_i = W_FULL_i / W_CONTROL_i and d_i = log(r_i), with
      CONTROL equal to NEG or BASE for the named comparison.
    effect_estimator: >-
      Form all 36 Walsh geometric means g_ij = sqrt(r_i*r_j) for 1 <= i <= j
      <= 8. Order them by exact squared-rational comparison and use the lower
      median g_(18), not an interpolated midpoint. The reported ratio is g_(18);
      the threshold g_(18) <= 0.90 is checked exactly by cross multiplication
      after squaring.
    exact_test: >-
      Use the paired signed-rank statistic. Retain d_i=0 with score zero.
      For nonzero d_i, order |d_i| exactly using rational comparison of r_i
      and 1/r_i; equal magnitudes are tied when r_i=r_j or r_i*r_j=1.
      Assign average ranks and define integer S_i=2*midrank_i. Set
      T2(epsilon)=sum_i epsilon_i*sign(d_i)*S_i. Enumerate k=0..255 with
      epsilon_i=+1 when bit i of k is 1 and -1 otherwise, in group order
      [G09,G10,G11,G12,G13,G14,G15,G16]. The inclusive two-sided p-value is
      #{k: abs(T2(epsilon_k)) >= abs(T2_observed)} / 256. Emit every row,
      the observed statistic, p numerator, and denominator; no floating-point
      logarithm or implementation-selected tie rule is permitted.
    decision: >-
      A comparison passes only when all eight rows are valid, g_(18) <= 0.90,
      and the exact p numerator is <= 6. The FULL/NEG and FULL/BASE decisions
      are separate conjuncts under Bonferroni family-wise alpha 0.05.
  test_boundary:
    instances:
      - deterministic ordinary prime-field short-Weierstrass curves with certified prime subgroup
      - j=0 or j=1728 curves only when the exact automorphism certificate passes
      - matched random ordinary same-order controls generated before walk outcomes are visible
    parameters:
      train_groups: 8
      held_out_groups: 8
      seeds: [101, 103, 107, 109, 113, 127, 131, 137, 139, 149, 151, 157, 163, 167, 173, 179]
      field_bits: [12, 13, 14, 15]
      subgroup_checks: [prime_order, twist_order, cofactor_le_4, non_anomalous, embedding_degree_gt_12]
      quotient_variants: [C-BASE, C-NEG, C-FULL, C-RELABEL, C-RAND-BASE, C-RAND-NEG]
      calibration_rows: 8
    implementation: >-
      Pure-Python deterministic rho harness with exact finite-field arithmetic,
      exhaustive point counts for the toy p bound, fail-closed certificates,
      explicit group closure and stabilizer witnesses, orbit canonicalization,
      scalar recovery, and raw per-step receipts.
    budget:
      wall_clock_seconds: 18720
      memory_gb: 8
      maximum_runs: 104
  falsification_conditions:
    - >-
      Any certificate verifier accepts a row with a false curve, subgroup,
      twist, eigenvalue, group order, orbit, or stabilizer predicate.
    - >-
      Any paired mode uses a different target scalar, pair token, partition
      seed, stopping rule, or cost-model version.
    - >-
      Any held-out group is missing or invalid, or the exact eight-pair effect
      rule fails on a valid complete matrix.
    - >-
      Any apparent gain is explained by uncharged setup, relabelling, memory,
      hashing, certificate replay, serialization, retries, or cycle handling.
  interpretation_limits:
    - The result is toy finite-size evidence and is not a cryptographic-scale break.
    - The null closes only the certified curve families, controls, sizes, seeds, and cost model tested.
    - No finite slope estimate supports an asymptotic exponent claim.
  dominated_by: null
  dominated_by_status: no_result_claimed
  dominated_by_note: >-
    Pareto domination is deliberately not asserted at specification time. The
    experiment claims no measured result; any later frontier comparison must
    cite quantified time, memory, and data/query rows.
  sota_delta:
    status: not_applicable_no_result_claimed
    generic_time_exponent: 0.0
    memory_exponent: 0.0
    data_query_improvement: 0
    cryptographic_security_bits_reduced: 0
  status: specified
  proposed_by: coordinator
