hypothesis:
  id: H-ICEX-51839b
  question_id: RQ-JINV-8fc13a
  source_idea_id: IDEA-20260811-6c893b
  title: >-
    ARE THE SEMAEV-SPECIAL j ALSO ARITHMETICALLY SPECIAL - each degeneration j is a
    FIXED RATIONAL, so it defines one curve over Q whose reductions form a family
    indexed by p; run them against the Sato-Tate semicircle and against a
    ten-curve random-curve null, with the j = 0 CM baseline as a positive control
    whose Kolmogorov-Smirnov statistic must exceed 0.25 against a 95 percent band of
    0.005 - a fiftyfold separation computed here - and with the small-discriminant
    count arm DECLARED UNDERPOWERED IN ADVANCE if its control rate is below 10
  statement: >-
    (A) THE SETUP. IDEA-20260811-a7c1df derives the six weight-12 degeneration loci
    as FIXED RATIONAL j-values, so each defines a single elliptic curve over Q up to
    quadratic twist and hence a canonical family of reductions indexed by p. That is
    what makes a distributional test possible at all- -the special-j curve at p- is
    a well-defined sequence rather than a fresh random draw at each p.
    (B) THE NULL PREDICTION AND ITS THEOREM. IDEA-20260811-df6c0f argues that five
    of the six j are NON-INTEGRAL RATIONALS - 55296/5, 55296/59, 27648/25,
    221184/47, 110592/19 - hence not algebraic integers, hence NOT CM j-invariants,
    with the sixth, -13824, an integer requiring a lookup against the thirteen
    rational CM j-invariants. If all six are non-CM, Sato-Tate applies and the
    normalised Frobenius angles equidistribute with respect to the semicircle law.
    PREDICTION- all six match the semicircle within the two-sided 95 percent
    Kolmogorov-Smirnov band, and are mutually indistinguishable and indistinguishable
    from a ten-curve random non-CM control.
    (C) THE POSITIVE CONTROL AND ITS SEPARATION, COMPUTED HERE. j = 0 IS CM, so its
    trace distribution must FAIL the Sato-Tate test. Under CM about half the primes
    are inert with a_p = 0, putting mass about 0.5 at theta = pi/2 while the
    semicircle has cumulative 0.5 there and continuous density, so the empirical
    cumulative distribution at theta just below pi/2 is about 0.25 against a
    semicircle value of 0.5 and THE KOLMOGOROV-SMIRNOV STATISTIC IS AT LEAST 0.25.
    At the target bound of primes below 2^20 there are about 78500 good primes, so
    the two-sided 95 percent band is about 1.36/sqrt(78500) = 0.0049. THE POSITIVE
    CONTROL THEREFORE EXCEEDS ITS BAND BY A FACTOR OF ABOUT FIFTY. That is a
    demonstrated dynamic range, computed before the run rather than hoped for.
    (D) THE ARM THIS RECORD DECLARES UNDERPOWERED IN ADVANCE. The source proposes
    counting primes at which a special-j curve has |D_0| among the nine
    class-number-one discriminants, and comparing to a Poisson interval around the
    control rate. THAT COUNT IS A RARE EVENT- |D_0| small requires the square part of
    a_p^2 - 4p to be of order p, which has density of order 1/sqrt(p), so the
    expected count per curve over primes below 2^20 is of order ten at most and may
    be far smaller. IF THE POOLED CONTROL COUNT IS BELOW 10, A POISSON INTERVAL
    AROUND IT CONTAINS 0 THROUGH 3 AND NO ALTERNATIVE CAN BE DISTINGUISHED FROM THE
    NULL. THE CONTRACT THEREFORE COMPUTES THE CONTROL RATE FIRST AND, IF IT IS BELOW
    10, DECLARES THE COUNT ARM UNDERPOWERED AND FALLS BACK TO THE TWO-SAMPLE TEST ON
    log|D_0|, WHICH USES THE FULL SAMPLE. A null with unreported power is not a null.
    (E) WHAT THIS CANNOT ESTABLISH. A null here does NOT prove the algebraic and
    arithmetic divisors are independent; it bounds the coupling by the detectable
    effect size, which must be stated. And this record CANNOT NAME A MECHANISM FOR
    ITS OWN POSITIVE OUTCOME- a deviation would be an anomaly requiring explanation
    before any use, and the record says so rather than pretending otherwise.
  mechanism: >-
    THE OBJECT AND ITS PROJECTION. The projection is (fixed curve over Q, prime p)
    onto (a_p, D_0, f). It forgets the whole curve except one integer per prime, and
    it is compatible with the operation that matters here - reduction - because a_p
    is defined at every good p and determines the isogeny class of the reduction.
    CRUCIALLY THIS IS NOT THE PROJECTION THAT FAILED AT j = 0 IN THIS LANE- that
    failure was support onto Groebner time, a projection onto a COST functional.
    This one projects onto an ARITHMETIC functional and makes NO cost claim
    whatsoever.
    THE MECHANISM PREDICTING THE NULL. The degeneration condition
    alpha a^3 + beta b^2 = 0 is a condition on coefficients over QQ. The CM condition
    is a condition on End(E). A fixed non-CM curve over Q has, at each good p, an
    endomorphism order determined by a_p, and a_p varies with p according to
    Sato-Tate - essentially at random. SO THE MECHANISM PREDICTING THE NULL IS
    SIMPLY THAT NOTHING CONNECTS THE TWO CONDITIONS, and the experiment is the test
    of that nothing.
    THE ABSENCE OF A MECHANISM FOR THE POSITIVE, STATED HONESTLY. No mechanism is
    known that would couple summation-polynomial degeneration to endomorphism
    structure. A positive would be treated as an anomaly requiring explanation before
    any use, exactly as the lane committed decision required for its previous
    outlier. That absence is a weakness of the record and is recorded as one.
    WHY THE QUANTIFIER ORDER IS LOAD-BEARING. The claim is PER CURVE OVER p, never
    per p over curves. A per-p claim would be a claim about six numbers and would be
    meaningless. THIS RECORD MUST NEVER REPORT A p-BY-p STATISTIC AS EVIDENCE.
    WHY A CURVE-FREE NULL DOES NOT APPLY AND WHAT REPLACES IT. The observable is a
    Frobenius trace sequence, which no non-curve object produces- there is no
    curve-free arm of the same shape to build. THE REQUIRED CONTROLS ARE THEREFORE
    THE TEN-CURVE RANDOM NON-CM NULL, whose own spread defines the band, AND THE CM
    POSITIVE CONTROL, which supplies the demonstrated dynamic range. That
    substitution is declared here rather than left implicit.
  assumptions:
    - >-
      The six characteristic-zero j are as derived in IDEA-20260811-a7c1df and are
      non-CM as argued in IDEA-20260811-df6c0f. IF EITHER FAILS, the Sato-Tate
      hypothesis fails for that curve and its arm must be restated against the CM
      law, in which a_p = 0 for about half the primes. THE CONTRACT ANTICIPATES THIS
      RATHER THAN DISCOVERING IT.
    - >-
      The integrality argument covers five of the six by five exact divisibility
      tests. The sixth, -13824, requires a LOOKUP AGAINST A CITED TABLE of the
      thirteen rational CM j-invariants and MUST BE PERFORMED RATHER THAN ASSERTED
      FROM MEMORY; reproducing a numeric table from memory is the fabrication risk
      AGENTS.md rule 9 forbids.
    - >-
      The standard j-to-curve construction is verified symbolically as step 0 rather
      than trusted.
    - >-
      Primes of bad reduction and primes dividing the denominators are EXCLUDED AND
      COUNTED, never silently dropped, and the effective sample size is reported per
      curve because the six have different conductors.
    - >-
      UNITS. theta is an ANGLE IN RADIANS on [0, pi]; the Kolmogorov-Smirnov
      statistic is a DIMENSIONLESS supremum of a cumulative-distribution difference;
      D_0 and f are INTEGERS; counts are integers. NO TIME QUANTITY ENTERS ANY
      REPORTED STATISTIC.
  proof_search_map:
    bottleneck: >-
      The non-CM classification of the six j. Everything downstream is a
      distributional comparison that is only meaningful once the applicable theorem -
      Sato-Tate or the CM law - is fixed. A run that got that backwards would compare
      a CM curve against the wrong law and report a spectacular false positive.
    baseline_embedding:
      parameter_slice: >-
        j = 0 is the exact baseline slice and it is a POSITIVE CONTROL of a rare and
        valuable kind- j = 0 IS CM, so its trace distribution must FAIL the
        Sato-Tate test and match the CM law instead, with a_p = 0 at the primes
        inert in the relevant imaginary quadratic field, about half of them.
      reproduction_check: >-
        Run the identical pipeline on the j = 0 and j = 1728 curves and confirm the
        pipeline reports a CLEAR Sato-Tate REJECTION and the a_p = 0 signature. A
        pipeline that cannot tell a CM curve from a non-CM one CANNOT CERTIFY that
        the six are non-CM-like and EVERY NULL IT PRODUCES IS VOID. THE REQUIRED
        MAGNITUDE IS COMPUTED- Kolmogorov-Smirnov statistic at least 0.25 against a
        95 percent band of about 0.005 at the target prime bound.
    observation_collision:
      observable: >-
        The empirical distribution of (theta_p, D_0(p), f(p)) over p, per fixed curve.
      distinct_preimage_search: >-
        PERFORMED AND POSITIVE, AND IT IS HANDLED RATHER THAN HIDDEN. Two
        non-isogenous non-CM curves over Q have, by Sato-Tate, the SAME limiting
        theta distribution, so the observable cannot distinguish two generic curves -
        which is exactly why the null prediction is stated as INDISTINGUISHABILITY
        rather than as a discovery. THE SEPARATING CONDITION is that a CM curve DOES
        have a different distribution, which is what the j = 0 baseline exploits and
        what gives the instrument its demonstrated power.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable - the Sato-Tate class - fixed and vary the forgotten
          structure, namely which weight-12 form produced the j. If the null holds,
          all six sit in the same fibre as ten random curves and the intrinsic
          invariant distinguishing them is purely the coefficient combinatorics.
        predicted_gain: >-
          Converts -we saw nothing- into -the fibre is exactly the generic one-,
          which is a positive statement about the object and survives citation.
      - transform: specialization_pack
        proposed_object: >-
          Replace the rare-event class-number-one count by the two-sample test on
          log|D_0| whenever the control rate is below 10, decided BEFORE the counts
          are observed.
        predicted_gain: >-
          Removes an arm whose Poisson interval would contain the alternative, and
          replaces it with one that uses the full sample.
    quantifier_order: >-
      FOR EACH of the six fixed rational j, the sequence indexed by p of normalised
      traces equidistributes with respect to the semicircle. THE ORDER MATTERS- the
      claim is PER CURVE OVER p, NOT PER p OVER CURVES. A per-p claim would be a
      claim about six numbers and would be meaningless, and this record must never
      report a p-by-p statistic as evidence.
    method_ceiling:
      strongest_certifiable_claim: >-
        That over the tested prime range the special-j reductions are statistically
        indistinguishable from generic non-CM reductions on the stated statistics, AT
        THE STATED POWER. IT CANNOT CERTIFY THAT NO ARITHMETIC COUPLING EXISTS -
        only that none of the tested size does - and the record must state the
        detectable effect size rather than claiming absence.
      nearby_object_control: >-
        A CM curve, j = 0, is the nearby object where the desired conclusion fails,
        and it is run as the BLOCKING baseline. A method that cannot separate j = 0
        from a random non-CM curve has not identified the load-bearing structure and
        its nulls are void.
    proof_obligations:
      - claim: The six curves over Q are non-CM
        responsibility: baseline
      - claim: Sato-Tate applies and the empirical fit is within band for all six
        responsibility: success_probability
      - claim: The |D_0| distributions match the ten-curve control
        responsibility: correctness
      - claim: >-
          Every test has a stated power against a stated alternative, and any arm
          whose control rate is too small is declared UNDERPOWERED before the counts
          are observed
        responsibility: interface
      - claim: >-
          The family-wise correction is pre-registered across all 72 tests before any
          statistic is computed
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-ST-1
      formal_statement: >-
        For each fixed non-CM elliptic curve over Q, the normalised Frobenius angles
        theta_p equidistribute on [0, pi] with respect to the semicircle measure
        (2/pi) sin^2 theta.
      random_model_justification: >-
        THIS IS A THEOREM, NOT A HEURISTIC, for elliptic curves over Q without
        complex multiplication. THE CITATION MUST BE VERIFIED IN THE RUN RECORD with
        a specific reference; it is used here as an external structural ingredient
        and MUST NOT BE PARAPHRASED FROM MEMORY in any evidence record. What remains
        genuinely heuristic is only the CONVERGENCE RATE, which is slow, so a null at
        the tested bound bounds coupling only at the effect size the sample supports.
      supporting_results:
        - ref: IDEA-20260811-df6c0f
          provenance: internal
          claim: >-
            VERBATIM- five of the six Semaev degeneration j-values are NON-INTEGRAL
            RATIONALS, namely 55296/5, 55296/59, 27648/25, 221184/47 and 110592/19,
            hence not algebraic integers, hence NOT CM j-invariants; the sixth,
            -13824, is an integer requiring a lookup against the thirteen rational
            CM j-invariants, which that record explicitly declines to reproduce from
            memory; and the conclusion that the algebraic and arithmetic divisors of
            this lane meet only at j = 0 and j = 1728.
          verified_by: >-
            coordinator, TASK-20260904-65b023 - the title, object and claim (A)-(B)
            blocks of IDEA-20260811-df6c0f read verbatim this task (pattern-scoped
            read with surrounding context). PARTIAL READ, DECLARED- the remainder of
            the record was not opened and nothing else from it is relied on.
        - ref: IDEA-20260811-a7c1df
          provenance: internal
          claim: >-
            VERBATIM- the closed-form dictionary
            j = 1728 * (-4 beta)/(27 alpha - 4 beta) for a weight-12 locus, and the
            six characteristic-zero values 55296/5, 55296/59, 27648/25, 221184/47,
            -13824 and 110592/19, together with the hand cross-check of five of them
            against the committed F_4001 list. THIS IS WHAT MAKES THE SIX j FIXED
            RATIONALS AND HENCE MAKES THIS EXPERIMENT POSSIBLE AT ALL.
          verified_by: >-
            coordinator, TASK-20260904-65b023 - IDEA-20260811-a7c1df read in full
            this task, 459 lines.
        - ref: >-
            The Sato-Tate theorem for non-CM elliptic curves over Q
          provenance: recalled
          claim: >-
            That the normalised Frobenius angles of a fixed non-CM elliptic curve
            over Q equidistribute with respect to the semicircle measure. NO SOURCE
            WAS OPENED BY THIS AGENT. Under AGENTS.md rule 9 this discharges nothing,
            and the contract requires the citation to be VERIFIED IN THE RUN RECORD
            with a specific reference before any evidence record quotes it.
          verified_by: null
        - ref: >-
            The thirteen rational CM j-invariants
          provenance: recalled
          claim: >-
            That there are exactly thirteen rational CM j-invariants, arising from
            the thirteen class-number-one imaginary quadratic orders. THE LIST IS
            DELIBERATELY NOT REPRODUCED HERE- reproducing a numeric table from memory
            is the fabrication risk rule 9 forbids. The contract performs the lookup
            against a CITED table.
          verified_by: null
      validation_experiment_ids:
        - EXP-ICEX-48d649
      falsification_condition: >-
        The j = 0 CM baseline is NOT rejected by the Sato-Tate test at a
        Kolmogorov-Smirnov statistic of at least 0.25. The instrument has no power,
        the run is INVALID rather than negative, and no null may be reported.
    - id: HEUR-ST-2
      formal_statement: >-
        Conditional on a_p, the factorisation a_p^2 - 4p = D_0 f^2 has D_0
        distributed as for a random integer of that size subject to the congruence
        conditions, so the conductor f is typically small and |D_0| is typically
        within a constant factor of 4p.
      random_model_justification: >-
        The Deuring and Hurwitz-Kronecker class-number relation ties class sizes to
        H(4p - t^2) exactly, and this campaign has verified the mass formula on all
        253 traces at p = 4001 with zero disagreements. The distributional statement
        imitated is the classical average order of class numbers. THIS HEURISTIC IS
        USED ONLY TO SET EXPECTATIONS FOR THE DISCRIMINANT ARM AND IS NOT
        LOAD-BEARING FOR THE SATO-TATE ARM.
      supporting_results:
        - ref: EV-ICINV-6b6264
          provenance: recalled
          claim: >-
            That all 253 traces at p = 4001 were checked against the
            Hurwitz-Kronecker mass formula with zero disagreements. RELAYED- this
            agent did NOT open ledger/evidence/EV-ICINV-6b6264.yaml; the statement is
            taken from IDEA-20260811-6c893b and from DEC-20260810-d70ece, which this
            agent read. Marked recalled rather than internal for that reason.
          verified_by: null
      validation_experiment_ids:
        - EXP-ICEX-48d649
      falsification_condition: >-
        The conductor distribution of the control curves departs from the special
        curves in a way the two-sample test detects at the pre-registered family-wise
        level. That is a positive on the discriminant arm and requires replication at
        a second prime range before description.
  structural_ingredients:
    - description: >-
        The derivation making the six degeneration j FIXED RATIONALS defined over Q,
        which is what turns them into a curve family indexed by p and makes a
        distributional test possible.
      citation: IDEA-20260811-a7c1df
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-65b023 - read in full this task, 459 lines.
      role: supplies the six fixed rational j and the dictionary that produced them
    - description: >-
        The integrality argument separating the algebraic divisor from the CM locus,
        which fixes which theorem each arm is tested against.
      citation: IDEA-20260811-df6c0f
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-65b023 - PARTIAL READ, DECLARED (title, object and
        claim (A)-(B) blocks read verbatim; the remainder not opened).
      role: the non-CM classification this experiment depends on and re-checks
    - description: >-
        The Sato-Tate theorem for non-CM elliptic curves over Q and the list of
        thirteen rational CM j-invariants. RELAYED AND UNREAD- no source was opened
        by this agent and no numeric table is reproduced here. Marked recalled, and
        the contract requires both to be verified against cited sources in the run
        record before any evidence record quotes them.
      citation: >-
        The Sato-Tate theorem for non-CM elliptic curves over Q, and a cited table of
        the rational CM j-invariants
      provenance: recalled
      verified_by: null
      role: >-
        the law the null arm is tested against, and the table the sixth j is looked
        up in; both must be verified in the run record
    - description: >-
        The automorphism-discounted rho baseline and the sqrt(6) calibration
        threshold. RELAYED- this agent did NOT open
        knowledge/techniques/KN-TECH-018.md; the threshold is quoted from
        RQ-JINV-8fc13a decision_target, read in full this task. No cost claim is made
        here in any case.
      citation: KN-TECH-018
      provenance: recalled
      verified_by: null
      role: the lane comparator; not engaged, since this record makes no cost claim
  reduction_chain:
    core_problem: >-
      Whether the Semaev degeneration divisor carries any arithmetic content, tested
      by the distribution of Frobenius traces and fundamental discriminants of the
      six fixed special-j curves over Q as p varies.
    corollaries:
      - problem: >-
          Whether the algebraic and arithmetic halves of this lane are empirically
          as well as theoretically independent.
        reduction_ref: >-
          Internal- no published reduction is cited. The Sato-Tate theorem is used as
          an external law and is RECALLED, requiring verification in the run record.
        asymptotics_preserved: >-
          Not applicable. No cost is measured, no exponent is claimed, sota_delta
          zero.
  predictions:
    - metric: >-
        P1- Kolmogorov-Smirnov statistic of the empirical theta distribution against
        the semicircle law, per special curve (dimensionless)
      direction: different
      minimum_effect: >-
        INSIDE the two-sided 95 percent band for the REALISED sample size, for ALL
        SIX curves, under the pre-registered family-wise correction. One curve
        outside is a flag; two or more outside is a positive requiring explanation
        before any use.
    - metric: >-
        P2- Kolmogorov-Smirnov statistic for the j = 0 CM baseline (dimensionless)
      direction: higher
      minimum_effect: >-
        AT LEAST 0.25, DECISIVELY OUTSIDE the band of about 0.0049 at the target
        prime bound. COMPUTED HERE- under CM about half the primes are inert with
        a_p = 0, giving an atom of about 0.5 at theta = pi/2 against a continuous
        semicircle whose cumulative there is 0.5, so the supremum difference is at
        least about 0.25, while 1.36/sqrt(78500) is about 0.0049. A SEPARATION OF
        ABOUT FIFTY BAND-WIDTHS. IF j = 0 IS NOT REJECTED, THE INSTRUMENT LACKS
        POWER AND EVERY NULL IN THE RECORD IS VOID.
    - metric: >-
        P3- two-sample Kolmogorov-Smirnov on log|D_0|, each special curve against the
        pooled ten-curve control (p-value)
      direction: different
      minimum_effect: >-
        ABOVE THE PRE-REGISTERED FAMILY-WISE THRESHOLD for all six, WITH THE ACHIEVED
        MINIMUM DETECTABLE EFFECT REPORTED EXPLICITLY. A NULL WITH UNREPORTED POWER
        IS NOT A NULL.
    - metric: >-
        P4- count of primes at which |D_0| lies among the nine class-number-one
        values, per curve (count)
      direction: different
      minimum_effect: >-
        DECIDED BY POWER BEFORE THE COUNTS ARE OBSERVED. The expected count is a rare
        event of order at most ten per curve, since small |D_0| requires the square
        part of a_p^2 - 4p to be of order p, a density of order 1/sqrt(p). IF THE
        POOLED TEN-CURVE CONTROL COUNT IS BELOW 10, A POISSON INTERVAL AROUND IT
        CONTAINS 0 THROUGH 3 AND NO ALTERNATIVE IS DISTINGUISHABLE- THE ARM IS THEN
        DECLARED UNDERPOWERED AND THE VERDICT FALLS BACK TO P3. If the control count
        is at least 10, an excess of more than 3 standard deviations at any one curve
        is the pre-registered positive.
    - metric: >-
        P5- fraction of primes with a_p equal to zero, per curve (probability)
      direction: different
      minimum_effect: >-
        BELOW 0.01 for all six special curves if non-CM, and NEAR 0.5 for the j = 0
        and j = 1728 CM baselines. This single statistic separates the two regimes
        crisply and is the cheapest sanity gate in the design.
    - metric: >-
        P6- DECAY CONTROL- the Kolmogorov-Smirnov statistic as a function of the
        prime bound, at three bounds (dimensionless)
      direction: lower
      minimum_effect: >-
        DECAY LIKE ONE OVER THE SQUARE ROOT OF THE SAMPLE SIZE. COMPUTED- at bounds
        2^12, 2^16 and 2^20 the good-prime counts are about 446, 6542 and 78500, so
        the sample grows by a factor about 176 and the statistic should FALL BY A
        FACTOR ABOUT 13.3. PRE-REGISTERED BAND- the measured ratio between the 2^12
        and 2^20 bounds lies in [6.6, 26.6], a factor-2 tolerance around 13.3. A
        STATISTIC THAT DOES NOT DECAY AS THE SAMPLE GROWS IS AN ARTIFACT OF THE
        PIPELINE, NOT A PROPERTY OF THE CURVE.
    - metric: >-
        P7- twist consistency- each curve quadratic twist run separately
      direction: different
      minimum_effect: >-
        a_p NEGATES, so the theta distribution REFLECTS and the semicircle is
        symmetric; and a_p^2 - 4p is UNCHANGED, so the D_0 statistics are
        twist-invariant. THIS MUST BE VERIFIED RATHER THAN ASSUMED. Any asymmetry
        beyond the reflection is an implementation error.
    - metric: >-
        P8- isogeny independence- whether any two of the six special curves, or any
        special curve and a control curve, are Q-isogenous
      direction: different
      minimum_effect: >-
        NONE ARE. If any pair is, the samples are not independent and the pooled
        comparisons must be redone with the dependence accounted for.
  test_boundary:
    instances:
      - >-
        The six special-j curves over Q built by the standard j-to-curve
        construction, verified symbolically, and their quadratic twists.
      - >-
        C-CM-BASELINE- the j = 0 and j = 1728 CM curves, run through the identical
        pipeline as the blocking positive control.
      - >-
        C-RANDOM-CURVE- ten fixed random non-CM curves over Q with small
        coefficients, whose own spread defines the band.
      - >-
        THERE IS NO CURVE-FREE ARM AND NONE IS POSSIBLE- a Frobenius trace sequence
        is not produced by any non-curve object. The random-curve null and the CM
        positive control replace it, and that substitution is declared here.
    parameters:
      prime_bound: 'target 2^20, with a declared fallback ladder 2^12 / 2^16 / 2^20'
      curves: 'six special, two CM baselines, ten random non-CM controls, plus all quadratic twists'
      lower_prime_cut: 'declared before the run; results reported with and without it'
      family_wise_correction: 'pre-registered before any statistic is computed, across all 72 tests'
      power_gate: 'the class-number-one count arm is declared underpowered if the pooled control count is below 10'
    implementation: >-
      Point counting by a standard algorithm at the upper end and exhaustive counting
      at small p, with bad-reduction primes EXCLUDED AND COUNTED. Embarrassingly
      parallel and memory-trivial, so the budget is wall-clock only. Bands are
      computed PER CURVE from its own effective sample size, because the six have
      different conductors and therefore different bad-prime counts.
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 24.0
      maximum_memory_gb: 8
      maximum_runs: 20
  falsification_conditions:
    - >-
      F1. The j = 0 baseline is NOT rejected by the Sato-Tate test at a
      Kolmogorov-Smirnov statistic of at least 0.25. The instrument has NO POWER, the
      run is INVALID rather than negative, and no null may be reported.
    - >-
      F2. The Kolmogorov-Smirnov statistic fails to decay with the prime bound,
      outside the computed band [6.6, 26.6] between 2^12 and 2^20. The statistic is
      an artifact of the pipeline and every conclusion is void.
    - >-
      F3. Two or more special curves fall outside the Sato-Tate band under the
      pre-registered correction. The null prediction is falsified; before any
      interpretation, check whether the deviating curves are the ones whose non-CM
      status rests on the table lookup rather than on the integrality argument.
    - >-
      F4. The small-|D_0| count for any special curve exceeds the control rate by
      more than 3 standard deviations, WITH the control rate at least 10. Arithmetic
      coupling is indicated and must be replicated at a second prime range before it
      is described as anything.
    - >-
      F5. Any two of the six, or any special and control curve, are Q-isogenous. The
      samples are not independent and the pooled comparisons must be redone.
    - >-
      F6. The sixth j, -13824, is found ON the cited table of rational CM
      j-invariants. That curve arm must be restated against the CM law, and the
