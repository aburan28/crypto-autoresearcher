hypothesis:
  id: H-PFDR-2139a5
  question_id: RQ-PFDR-ae2fba
  source_idea_id: IDEA-20260905-df55e9
  title: Definition and quantifier certificates for first-fall comparisons
  statement: >-
    A certificate naming field, generators, quotient, term order, degree convention,
    algorithm, target domain, and quantifiers distinguishes a finite counterexample
    to an explicit bound from evidence that cannot decide an unspecified uniform bound.
    The eight frozen fixtures should produce zero invalid accepted comparisons.
  mechanism: >-
    Check a mathematical signature before accepting degree comparisons, then verify
    witnesses in the signature's native ring. A finite table cannot negate an
    existential uniform constant. This is an applicability instrument, not a solver.
  assumptions:
    - Exact arithmetic and independently checkable certificates.
    - Reconstruct published fixtures without extra field or Boolean equations.
    - Missing interface proofs return incompatible rather than a numerical comparison.
  proof_search_map:
    bottleneck: Conflation of first cancellation, last fall, solving degree, and quantifiers.
    baseline_embedding:
      parameter_slice: Caminata and Gorla Example 4.4 at q=3 and q=5 in its ordinary ring.
      reproduction_check: Reconstruct its four generators and certify the native degree values.
    observation_collision:
      observable: A bare integer labelled first fall degree.
      distinct_preimage_search: Compare native signatures against deliberately altered Boolean quotient signatures.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: A degree value with a typed definition and quantifier certificate.
        predicted_gain: Zero accepted invalid comparisons in the specified panel.
    quantifier_order: >-
      One admissible witness can refute forall theta, sd(theta)=dff(theta), or
      forall theta, gap(theta)<=C for a supplied C. A finite panel cannot refute
      exists C forall theta, gap(theta)<=C, or exists C forall s, degree(s)<=C.
      A distributional claim needs an explicit distribution and failure probability.
    method_ceiling:
      strongest_certifiable_claim: Correct certificate decisions for eight specified fixtures.
      nearby_object_control: An altered quotient must not inherit the ordinary-ring certificate.
    proof_obligations:
      - claim: Native degree definitions coincide with the implemented closure procedure.
        responsibility: interface
      - claim: Exact row and ideal-membership certificates establish each witness.
        responsibility: correctness
      - claim: Quantifier and admissibility domains remain in every reported conclusion.
        responsibility: scope
      - claim: Ordinary and quotient signatures stay separate absent a transfer proof.
        responsibility: strictness
    not_applicable_reason: null
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: Native ordinary-ring separation controls and degree-compatible solving/last-fall relation.
      citation: https://arxiv.org/pdf/2112.05579
      provenance: retrieved
      verified_by: codex-root/2026-09-05
      role: Control predictions and interface conditions; no automatic quotient transfer.
  predictions:
    - metric: Invalid accepted claims.
      direction: lower
      minimum_effect: Zero in eight fixtures.
    - metric: Native solving-degree minus first-fall-degree gap.
      direction: different
      minimum_effect: Preregistered gaps 2 and 6 for q=3 and q=5; no new observation.
  test_boundary:
    instances:
      - Two native polynomial fixtures and two altered quotient signatures.
      - Four explicit logical claims.
    parameters:
      q: [3, 5]
      term_order: Graded reverse lexicographic, w>x>y>z.
      supplied_gap_constant: 1
    implementation: Exact native-ring and signature checkers, retained before execution.
    budget:
      maximum_runs: 4
      wall_clock_seconds_per_run: 900
      maximum_memory_gb: 8
      total_cpu_hours: 1
  falsification_conditions:
    - Any incompatible or over-quantified claim is accepted.
    - A certified native control disagrees after its source convention is checked.
  interpretation_limits:
    - Missing certificates, runtime failure, and resource limits are inconclusive.
    - Passing this panel does not establish a prime-digit interface or an asymptotic theorem.
    - ECDLP time, memory, and query exponent deltas are all zero; no improvement claimed.
  status: specified
  proposed_by: coordinator
