# H-FROB-d1e512 — specified from IDEA-20261005-903ce8.
# Protocol approval is DEC-20261006-9d9a8c. The source idea lives on
# origin/design/pair-3a18d1-hcp and is not copied here.
# This record asserts no ECDLP exponent change. No curve was enumerated
# in this design.
hypothesis:
  id: H-FROB-d1e512
  question_id: RQ-FROB-7d8dd4
  source_proposal: IDEA-20261005-903ce8
  goal_id: null
  goal_id_note: >-
    This design binds the question RQ-FROB-7d8dd4 and does not attach a
    goal record. It does not create one.
  status: approved
  status_note: >-
    approved means the square-test protocol in EXP-FROB-0688a8 is approved
    for a later executor. It does not mean the count 27 was observed.
    Status moves only by DEC-20261006-9d9a8c under the standing user
    authorization of 2026-09-06. No field was enumerated in this design.
  proposed_by: coordinator
  conversion_note: >-
    The curve y^2 = x^3 + x + 1 over F_5, the predicted counts 9 and 27,
    the nearby curve y^2 = x^3 + x + 2 with predicted counts 4 and 32,
    and the refusal to move an exponent are carried from
    IDEA-20261005-903ce8, which was read via git show of
    origin/design/pair-3a18d1-hcp. The Coordinator froze the square test
    and the field polynomial z^2 - 2 before any run of EXP-FROB-0688a8.

  statement: >-
    TEST BOUNDARY. One short-Weierstrass curve E given by
    y^2 = x^3 + x + 1 over F_5, and its base change to F_25, together
    with the nearby equation y^2 = x^3 + x + 2 over the same two fields.
    F_25 is F_5[z]/(z^2 - 2). The point at infinity is counted once.

    PRE-REGISTERED PREDICTION, fixed before any run. The square-test
    count of E(F_25), including infinity, is exactly 27. Any other
    integer is a negative. The same instrument is pre-registered to
    return 9 for E(F_5), 4 for the nearby curve over F_5, and 32 for
    the nearby curve over F_25. Those three integers are controls on
    the instrument. They are not a second copy of the prediction 27.

    DISTINGUISHABLE OUTCOMES. (1) Both square-test methods agree, the
    trace recurrence was not used as the counter, and the four counts
    are 9, 27, 4, and 32: success for the prediction 27. (2) Both
    methods agree and the count of E(F_25) is any integer other than
    27: negative. (3) Both methods agree, the count of E(F_25) is 27,
    and at least one of 9, 4, or 32 fails: the prediction 27 holds and
    a control integer fails, which is not success. (4) The two methods
    disagree, 2 is a square in F_5, infinity was omitted, or the trace
    recurrence was used as the counter: invalid, not evidence. (5) A
    timeout or crash: failed_infrastructure, not evidence.

    No discrete-log exponent moves. The rho exponent stays 1/2.

  mechanism: >-
    The prediction is the Cayley-Hamilton shadow of the trace, not the
    counter. If the square test returns 9 points of E over F_5, the
    trace t satisfies 5 + 1 - t = 9, so t = -3. The characteristic
    equation is pi^2 - t pi + 5 = 0. The trace of pi^2 is t^2 - 2*5
    = -1, and 25 + 1 - (-1) = 27. The executor must not evaluate that
    identity in place of testing squares. A value c in the field is a
    square when some y in the field satisfies y^2 = c. Zero contributes
    one affine point. A nonzero square contributes two. The point at
    infinity contributes one. The nearby equation uses the same rules
    and is not copied from E.

  assumptions:
    - F_25 is F_5[z]/(z^2 - 2). The element 2 is not a square in F_5. Squares in F_5 are 0, 1, and 4.
    - The base-change equation keeps coefficients 1 and 1. No F_25-isomorphism is applied before the count.
    - The nearby curve y^2 = x^3 + x + 2 is a different equation. Its count is not copied from E.
    - Toy scope is this one curve at q = 5 and n = 2. No factor base is built.

  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
    not_applicable_reason: >-
      One field enumeration against a pre-registered integer. No proof
      decomposition and no exponent bookkeeping.

  asymptotic_claim:
    problem: none — no complexity improvement is claimed
    prior_best: Pollard rho at exponent 1/2, not beaten
    time_exponent: unchanged
    memory_exponent: unchanged
    hidden_cofactor: >-
      None in an o(1) term. The output is four point counts. The
      discrete-log time exponent stays 1/2.
    claim_kind: not_applicable

  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        For the base change of an elliptic curve over F_q with trace t,
        the trace of Frobenius over F_{q^2} equals t^2 - 2q. Here q = 5
        and, if the F_5 count is 9, t = -3, so that trace is -1 and the
        point count over F_25 is 27. One curve. No transfer to a larger
        extension or to a factor-base cost.
      random_model_justification: >-
        The comparison distribution is a point mass at 27. This imitates
        no random integer. The sample is one equation, counted twice by
        independent square tests.
      supporting_results: []
      validation_experiment_ids:
        - EXP-FROB-0688a8
      falsification_condition: >-
        The square-test count of y^2 = x^3 + x + 1 over F_25 is an
        integer other than 27.

  structural_ingredients:
    - description: >-
        KR-RHO-13bf67 states that a generic discrete logarithm needs
        Omega(sqrt(p)) group operations. A point count is not a discrete
        logarithm, and this hypothesis does not change that exponent.
      citation: KR-RHO-13bf67
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
      role: unchanged generic exponent
    - description: >-
        KR-RHO-755e35 states that the trace is an isogeny invariant.
        This hypothesis measures one curve and does not walk to a
        different trace.
      citation: KR-RHO-755e35
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
      role: scope fence; no isogeny walk
    - description: >-
        KR-RHO-0528e7 states that an automorphism of order m changes the
        rho constant by sqrt(m) and does not change the exponent 1/2.
        This hypothesis applies no automorphism to a walk.
      citation: KR-RHO-0528e7
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-0528e7.yaml
      role: unchanged automorphism baseline
    - description: >-
        KR-RHO-fbd7b1 states a square-root memory ordering for grumpy
        giants. This hypothesis does not change that ordering.
      citation: KR-RHO-fbd7b1
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-fbd7b1.yaml
      role: unchanged memory ordering

  reduction_chain:
    core_problem: >-
      Whether the square-test count of y^2 = x^3 + x + 1 over F_25 is
      27. Not an attack.
    corollaries: []

  predictions:
    - metric: enumerated_point_count_of_E_over_F_25
      direction: different
      minimum_effect: >-
        Exactly 27, including the point at infinity. Any other integer
        is the negative.
    - metric: enumerated_point_count_of_E_over_F_5
      direction: different
      minimum_effect: Exactly 9, including the point at infinity.
    - metric: enumerated_point_count_of_nearby_curve_over_F_25
      direction: different
      minimum_effect: Exactly 32, and not 27.

  test_boundary:
    instances:
      - E given by y^2 = x^3 + x + 1 over F_5 and over F_25
      - the nearby curve y^2 = x^3 + x + 2 over F_5 and over F_25
    parameters:
      field_prime: 5
      extension_degree: 2
      modulus: z^2 - 2
      predicted_E_F_25: 27
      predicted_E_F_5: 9
      predicted_nearby_F_5: 4
      predicted_nearby_F_25: 32
    implementation: >-
      A later executor enumerates squares. This design does not
      enumerate them.
    budget:
      enforcement: advisory
      maximum_runs: 2
      note: >-
        One exhaustive square test by two methods inside one run. The
        second run id is an infrastructure retry, not a second
        scientific sample.

  falsification_conditions:
    - The square-test count of E(F_25) is not 27. H1 is then false for this equation.
    - The square-test count of E(F_5) is not 9. The trace t = -3 used to write 27 is then not the trace of this model.
    - The square-test count of y^2 = x^3 + x + 2 over F_25 is 27, or is not 32.

  interpretation_limits:
    - Toy scope: one curve, q = 5, n = 2. No statement about a factor base, a decomposition degree, or a larger extension.
    - The rho exponent stays 1/2. Agreement at 27 does not beat Frobenius-class rho.
    - The trace recurrence is the source of the prediction. It is not the counter.
    - Theta coordinates and the field of definition of etale 2-torsion are not this count.

