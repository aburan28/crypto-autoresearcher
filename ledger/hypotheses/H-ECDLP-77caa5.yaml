hypothesis:
  id: H-ECDLP-77caa5
  area: ECDLP
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  source_proposal: IDEA-20260904-d84512
  proposal_id: IDEA-20260904-d84512
  title: >
    Advice exponent gamma_C of a charged-polylog discrete-log
    table is indistinguishable from 0 on ordinary prime-order
    curves for the declared classes, while the same instrument
    reports gamma near 1 on a planted affine table and on an
    anomalous curve
  status: specified
  proposed_by: idea-generator
  designed_by: coordinator
  designed_under_task: TASK-20260908-141ad9
  specified_by: DEC-20260908-11e3ec
  specified_at: '2026-09-08'
  created: '2026-09-08'
  updated: '2026-09-08'
  depends_on:
    - IDEA-20260904-d84512
    - IDEA-20260806-071255
    - IDEA-20260806-3b91c7
    - KN-TECH-005
    - KN-LIT-013
    - DEC-20260908-109500
  related_hypotheses:
    - H-ECDLP-2ade73
    - H-ECDLP-07c7c6
  statement: >
    Fix E/F_p with G = <P> of prime order N. For a set V of
    x-coordinates with |V| = D, let Tab_V be the table
    {(v, k_v) : x([k_v]P) = v, 0 < k_v < N/2}. For a class C
    of representations that answer membership and lookup in
    polylog(p) time, define S_C(V) as the bit length of the
    shortest member of C representing Tab_V, and define
    gamma_power by S_C = (D * log2 N)^{1 - gamma_power} and
    gamma_linear by S_C = (1 - gamma_linear) * D * log2(N/D).
    Null H1: for every declared C and V, gamma_power -> 0
    and gamma_linear -> 0 as p grows on the sampled ordinary
    ladder. The instrument is live only if a planted affine
    table and, when authorized, an anomalous curve report a
    recovered exact affine relation. Neither a null nor a
    live reading is an attack, a W class, or authorization
    of Stage 5 of EXP-ECDLP-a98ea9.
  mechanism: >
    The generic lower bound S*T^2 = Omega~(N) treats labels
    as opaque. A concrete curve indexes by x. The compressed
    distinguished-set construction beats the frontier iff
    gamma > 0. Charging polylog decompression is the only
    difference from closed Kolmogorov D3
    (IDEA-20260806-071255), whose O(log p) program answers
    a query in Theta(N) steps and sits at S*T^2 = N^2
    polylog. Anomalous curves show the mechanism is
    non-empty: k_v is affine in a polylog-computable
    coordinate. Stage 0 tests whether class C3 recovers
    that affine relation on a planted table, not whether
    H1 holds on a curve.
  predictions:
    - id: P-S0-IDENTITY
      metric: S*T^2 identity at gamma=0
      direction: different
      minimum_effect: >-
        At gamma=0 and theta in {1/3, 1/2, 1}, the frozen
        identity log_N(S*T^2) = 2 - theta holds to 1e-12
        relative error. Failure is infrastructure.
      claim_tier: observational
    - id: P-S0-PLANTED
      metric: recovered affine coefficients on the planted table
      direction: different
      minimum_effect: >-
        C3 recovers (a, b) = (3, 7) exactly on the frozen
        planted table (N=8191, D=20, V={0..19},
        k_v = (3*v+7) mod 8191, lambda=identity).
      claim_tier: observational
    - id: P-S0-SHUFFLE
      metric: exact affine recovery on the matched-marginal shuffle
      direction: lower
      minimum_effect: >-
        The same C3 fit on the seed-20260908 shuffle of the
        planted k_v values does not recover any (a, b) with
        zero residual.
      claim_tier: observational
    - id: P-H1-NULL
      metric: gamma_power and gamma_linear on ordinary curves
      direction: lower
      minimum_effect: >-
        After an authorized later-stage ladder, both
        gammas are indistinguishable from 0 on declared
        C and V. Stage 0 does not test this.
      claim_tier: observational
    - id: P-H2-ANOMALOUS
      metric: exact affine recovery on an anomalous curve
      direction: higher
      minimum_effect: >-
        When Stage 1 is authorized, C3 recovers an exact
        affine relation on a certified #E(F_p)=p curve.
        Stage 0 does not test this.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-INSTRUMENT
      statement: >
        Stage 0 misses the identity, fails to recover
        (3, 7) on the planted table, or recovers an exact
        affine on the shuffle. Classified
        failed_infrastructure; no mathematical claim
        about H1.
    - id: F-H1-LIVE
      statement: >
        After an authorized ladder, some declared C and V
        give gamma_linear >= 0.10 with a 95 percent
        interval excluding 0 at three or more consecutive
        primes, with no decay in p, while NULL-2 and
        NULL-3 stay at gamma_linear <= 0.02. That would
        be a live advice exponent, not an attack by
        itself, and would require review-breakthrough
        before any support reading.
    - id: F-H1-NULL
      statement: >
        After an authorized ladder, every declared C and
        V has |gamma_linear| <= 0.02 with intervals
        containing 0, AND the authorized anomalous
        control recovers an exact affine. Both halves
        are required.
    - id: F-INSTRUMENT-CURVE
      statement: >
        An authorized anomalous control fails to recover
        an exact affine. Then the class list is too weak
        and no H1 reading is allowed.
  test_boundary:
    instances:
      - frozen Stage 0 planted table N=8191 D=20 V={0..19} k_v=(3*v+7) mod 8191
    parameters:
      N_stage0: 8191
      D_stage0: 20
      stage0_only_at_specify: true
    implementation: EXP-ECDLP-420e73 Stage 0 runner
    budget:
      wall_clock_seconds: 120
    prose: >
      Toy scale. Stage 0 is a synthetic planted-affine
      instrument plus its matched-marginal shuffle and a
      symbolic identity. It is not a curve, not an
      anomalous control, and not an H1 measurement.
      No 20-26-bit claims. No secp256k1 / P-256 /
      Curve25519 transfer. Stages 1+ of EXP-ECDLP-420e73
      are not authorized. Stage 5 of EXP-ECDLP-a98ea9
      is not authorized. H-ECDLP-07c7c6 and
      H-ECDLP-2ade73 remain specified. W is not
      classified.
  assumptions:
    - id: A1
      statement: >
        The idea's power definition of gamma and the
        linear reading used in its H2 validation_plan
        are both recorded. Stage 0 does not use
        gamma >= 0.9 as a hard gate at D=20, because
        O(log N) advice cannot meet that power-threshold
        at this D. The instrument gate is exact affine
        recovery.
      status: explicit
    - id: A2
      statement: >
        Preprocessing time is uncharged by the model and
        is at least N^theta discrete logs. Any later
        positive is an asymptotic frontier statement,
        not a deployable attack.
      status: explicit
    - id: A3
      statement: >
        Standing user authorization 2026-09-06 covers
        protocol approval once the contract is complete.
      status: explicit
  heuristic_assumptions:
    - id: H1
      formal_statement: >
        For every declared class C in {C1, C2, C3} and
        every declared design V in {V1, V2, V3}, and for
        every epsilon > 0, there is p0 such that for all
        ordinary E/F_p with N prime and all sampled
        p > p0, S_C(V) >= (1-epsilon)*D*log2(N/D) bits,
        equivalently gamma_linear <= epsilon.
      random_model_justification: >
        A uniformly random injection from a D-set into
        Z/N has entropy (1-o(1))*D*log2(N/D) bits. H1
        asserts that the ECDLP table behaves like that
        injection for the declared classes. The available
        rigorous half is one-directional and weaker:
        low-degree polynomial interpolation is already
        constrained by recalled Lange-Winterhof-type
        bounds, which are pointers only and do not
        support this decision.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-420e73
      falsification_condition: >
        Authorized ladder with gamma_linear >= 0.10 and
        interval excluding 0 at three consecutive primes
        on a declared C,V while NULL-2 and NULL-3 stay
        at <= 0.02.
    - id: H2
      formal_statement: >
        For class C3, for all certified anomalous
        E/F_p with #E(F_p)=p in an authorized sample,
        C3 recovers an exact affine relation
        k_v = a*lambda(v)+b.
      random_model_justification: >
        On a trace-one curve the formal-group logarithm
        gives an efficiently computable isomorphism to
        F_p^+ (Smart; Satoh-Araki; Semaev -- recalled
        pointers only). H2 asserts that the declared
        lambda list contains that coordinate, which is
        a contract property.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-420e73
      falsification_condition: >
        Authorized anomalous control fails exact affine
        recovery on C3.
    - id: H3
      formal_statement: >
        For all declared designs V of size D and all
        authorized sampled p, an r-adding walk meets V
        after (1+o(1))*N/D steps in expectation.
      random_model_justification: >
        Hitting-time law for a walk that mixes faster
        than 1/(hitting time) on a cyclic group, plus
        x-coordinate equidistribution to Hasse error.
        Mixing is heuristic, as in every rho analysis
        in this corpus.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-420e73
      falsification_condition: >
        Authorized walk-length measurement departs from
        Theta(N/D) by more than a factor 2 in a
        systematic direction.
  proof_search_map:
    bottleneck: >
      Passage from "the advice must name D independent
      discrete logarithms" to "the advice must encode a
      table with a short polylog-query description".
    baseline_embedding:
      parameter_slice: >
        gamma=0 and theta=1 reproduce the frontier
        full-table corner S=Theta(N log N), T=polylog,
        S*T^2 = N*polylog. gamma=0 with the chain
        construction of IDEA-20260806-3b91c7 reproduces
        T=Theta(sqrt(N/S)).
      reproduction_check: >
        Stage 0 symbolic identity at gamma=0 and
        theta in {1/3, 1/2, 1}, plus planted-affine
        recovery and shuffle non-recovery.
    observation_collision:
      observable: S_C and the two derived gammas
      distinct_preimage_search: >
        A planted affine table and an anomalous curve
        can share gamma near 1. A generic curve and a
        random injection can share gamma near 0. A
        positive must exhibit the representation. A
        gamma reading is not a W class.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >
          Advice string reduced from D logarithms to
          the shortest polylog-query member of C.
        predicted_gain: >
          S*T^2 = N^{2 - theta(1+gamma)} against the
          generic frontier N. Stage 0 claims none of
          this gain.
    quantifier_order: >
      EXISTS C in the declared list and EXISTS V in
      the declared family such that FOR ALL
      sufficiently large p on the ordinary ladder,
      gamma_linear >= gamma_0 > 0. Null H1 is the
      negation over the declared finite lists.
    method_ceiling:
      strongest_certifiable_claim: >
        For the declared classes and designs, at the
        tested primes, the advice exponent is or is
        not bounded away from zero. Never all classes.
        Never a cryptographic-scale claim from Stage 0.
      nearby_object_control: >
        Planted affine table (Stage 0) and, when
        authorized, an anomalous curve (Stage 1). If
        C3 reports no affine there, the pipeline is
        refuted.
    proof_obligations:
      - claim: compressed distinguished-set walk recovers log Q
        responsibility: correctness
      - claim: walk hits V in Theta(N/D) steps
        responsibility: runtime
      - claim: advice is S_C bits and membership is polylog
        responsibility: memory
      - claim: S*T^2 = N^{2-theta(1+gamma)} and gamma=0 reproduces the frontier
        responsibility: baseline
      - claim: Stage 0 does not transfer to cryptographic size
        responsibility: scope
    not_applicable_reason: null
  novelty_status: unverified
  novelty_claim: >
    Measurement of charged-advice length, distinguished
