  heuristic_assumptions:
    - id: H1
      name: uniform touching (restated at the validation arity)
      formal_statement: >-
        Relation legs and fresh-target decomposition legs at arity m over a
        base of B columns behave as independent uniform column draws, and the
        number of decompositions an attempt returns is Poisson(mu), each
        usable independently. Consequences at the validation arity m = 2 with
        R = B relations, which the contract tests: (a) the touched fraction is
        1 - exp(-2) = 0.8647 (diagnostic); (b) the relation graph is a random
        multigraph of mean degree 2 whose determined columns are those of
        components containing an unbalanced cycle or a coefficient-2 loop, so
        the determined fraction is the giant-component fraction delta_inf =
        0.7968, the root of y = 1 - exp(-2y), with graph-level standard
        deviation about 0.403 / sqrt(B); (c) a fresh decomposition is usable
        (both legs determined) with probability delta^2 given the determined
        set (0.6349 at delta_inf; 0.7477 would be the touched value, a
        diagnostic only); (d) attempts per target are geometric with p = 1 -
        exp(-mu u), mean 2.1276 at mu = 1 and 50.903 at mu = 0.0312498
        (multi-decomposition acceptance; single acceptance would give 2.492 at
        mu = 1); (e) consequently the knee is K = B A(mu) / a(mu), the flat
        per-target level is a(mu) attempts, and the per-target cost does not
        depend on L. At the deployed arities the column uses the version-1
        constants (A2, A3), conservative against (c) and (d) by at most about
        0.05 bit. Uniformly in B for the tested cells; at n = 131 only the
        form of the law transfers.
      random_model_justification: >-
        MODEL: the relation set as a random signed multigraph on the B
        columns (occupancy for the touched set; Erdos-Renyi for components)
        and Poisson thinning for usable decompositions. RIGOROUS BOUND: the
        mean touched count is exact by linearity of expectation for any base,
        and KN-FIND-007's double count fixes the mean decomposition yield
        C(B + m - 1, m)/N exactly for every base. DISTRIBUTION LAW: the
        giant-component law y = 1 - exp(-c y) at c = 2 (Erdos-Renyi, recalled
        as a pointer), with a reviewer Monte Carlo of the abstract relation
        graph confirming the determined fraction at B = 128 and B = 512
        (TASK-20260928-d5024b E05, internal) and the cycle-sign determination
        rule (TASK-20260928-a75ba7, internal). OBSTRUCTIONS: KN-FIND-007's
        coverage concentration (structured bases with repeated sums can leave
        more columns untouched or undetermined than the random graph at
        matched size), which is exactly what the binary cells measure; the
        Z/NZ control realises the model by construction.
      supporting_results:
        - ref: KN-FIND-007
          provenance: internal
          claim: Mean decomposition yield C(B+m-1, m)/N for every base of size B; coverage at most min(1, mean); coverage concentration for structured bases.
          verified_by: TASK-20260929-1e739f (finding read in full this session)
        - ref: TASK-20260928-d5024b computations.json E05
          provenance: internal
          claim: Asymptotic determined fraction 0.79681 and usable 0.63491 at m = 2, R = B; Monte Carlo of the abstract relation graph, mean determined 0.7983 (B = 128) and 0.7970 (B = 512), 5th to 95th percentile of the both-legs probability [0.5393, 0.7252] and [0.5892, 0.6826].
          verified_by: TASK-20260929-1e739f (entry and its stdout read this session; not re-run)
        - ref: TASK-20260928-a75ba7 red-team-report J3.collision reading_2 and reading_3
          provenance: internal
          claim: Determination by unbalanced cycles or coefficient-2 loops; tree components touched but undetermined; retries differ by mu regime under multi-decomposition acceptance.
          verified_by: TASK-20260929-1e739f (report read in full this session)
        - ref: Erdos and Renyi, On the evolution of random graphs (1960), giant-component fraction
          provenance: recalled
          claim: "RECALLED POINTER. The giant component of G(n, c/n) has fraction y with y = 1 - exp(-c y) for c > 1; not load-bearing, the number is confirmed by the internal Monte Carlo above."
          verified_by: null
        - ref: IDEA-20260805-061f97
          provenance: internal
          claim: The touched-column fraction 1 - exp(-mR/B) (relayed by the proposal).
          verified_by: not verified by TASK-20260929-1e739f (not opened this session; the touched value is a diagnostic only)
      validation_experiment_ids: [EXP-BINSTD-517186]
      validation_plan: >-
        SAMPLE: per cell, R = B_c relations and 1365 fresh certified targets
        in the L cells 1, 4, 16, 64, 256, 1024 (about 2900 decompositions on a
        binary cell and about 2170 on CTRL-ZN), plus 21 null-arm targets on
        CTRL-ZN and BIN-ORD-19. PREDICTED DISTRIBUTION: delta_inf and its
        graph-level spread; u = delta^2 given the measured determined set;
        geometric attempts with p = 1 - exp(-mu u); the knee, the flat level
        and the all-L slope of model M2. COMPARISON (two-sided): T_delta,
        T_u, T_a, T_cmp and the gates KR, FR, d_sigma (EXP-BINSTD-517186
        definitions.observables_and_tests). SAMPLE SIZE: at about 2900
        decompositions the standard error of the usable fraction is about
        0.009, resolving the touched-against-determined difference (0.748
        against 0.635) at about 12 standard errors; at 1365 targets the
        relative standard error of the mean attempts is about 2 percent,
        resolving single against multi-decomposition acceptance (2.49 against
        2.13) at about 8. TAIL: the maximum attempts per target against the
        0.999 quantile of the maximum of 1365 geometric draws (about 22.3 on a
        binary cell, 712 on the control); the largest decomposition count in
        an attempt against the Poisson tail. CONTROLS: CTRL-ZN at mu about
        1/32 (a second mu regime, where the model holds by construction); the
        no-reuse null. TRANSFER: only the form of the uniform-leg law; the
        deployed constants are A2 and A3's, not the toy measurements.
      falsification_condition: >-
        With G1 passed and no invalidation: both binary cells LOW-COV (the
        coverage tests fail low and every failing test is low) falsifies H1 at
        the tested cells in the coverage direction, and the amortisation is
        recorded as coverage-limited on subspace bases (H1-NEGATIVE-COVERAGE);
        both binary cells failing any H1 test or amortisation gate, not both
        in the coverage direction, falsifies H1's law at the tested cells in
        another direction (H1-NEGATIVE-DEVIANT; a LOW-RETRY pair is audited
        for the instrument before it is interpreted). One cell failing is
        H1-MIXED (not validated, not falsified). An instrument failure, a
        failed control gate, a timeout or a crash never falsifies H1.
    - id: H2
      name: generic laws (with their constant and conventions)
      formal_statement: >-
        (i) Multi-target rho with one shared distinguished-point table solves
        L logarithms in a group of effective size N in expected total c(L)
        sqrt(L) W1 group operations (W1 the single-target mean), with c(L) in
        [0.8, 1.3] at the toy L (IDEA-20260920-2e37b3's range; Kuhn-Struik's
        Theorem 1 sum gives 1.000, 1.094, 1.120, 1.126, 1.128 at L = 1, 4, 16,
        64, 256), so the per-target cost falls as L^(-1/2); for the windows'
        L the law is ASSUMED with c = 1 (the narrowest window). Kuhn-Struik
        state it only for L << N^(1/4); Bernstein-Lange measure tables only up
        to l^(1/3); it is false for L above N. (ii) The generic preprocessing
        frontier is S T^2 = N_prime and P T + T^2 = N_prime up to logarithmic
        factors, taken with S in 129-bit words and the group size N_prime =
        r/262 (C1); at source (CGK Theorems 2 and 10) S is in bits and N is
        the prime order, which move T_gen by -3.51 and +4.02 bits.
      random_model_justification: >-
        MODEL: a random mapping on the effective group; collision times of L
        walk families sharing one table. RIGOROUS BOUND: CGK Theorem 2
        (S T^2 = Omega-tilde(epsilon N)) and Theorem 10 (P T + T^2 =
        Omega(epsilon N)) in the generic-group model, retrieved and read by
        TASK-20260928-a75ba7. DISTRIBUTION LAW: the birthday law for random
        mappings; Kuhn-Struik Theorem 1 for pooled walks (retrieved, range
        L << N^(1/4)); Bernstein-Lange's measured table constants
        (retrieved). OBSTRUCTIONS: at toy N the distinguished-point overshoot
        and walk restarts rival the per-target walk at L near sqrt(N_G), and
        the toy walks use no negation or Frobenius classes while the deployed
        rho_1 does; the constant above N^(1/4) is neither measured nor
        sourced, so it is carried as a disclosed choice (c = 1) with its
        sensitivity 2 log2 c on log2 L_hi.
      supporting_results:
        - ref: SRC-CGK, Corrigan-Gibbs and Kogan, IACR ePrint 2017/1113 (PDF sha256 f9550f7d9a0701e17bc2fe2c9faea7e1fed546f572d307f8e1adc6994f75de08)
          provenance: retrieved
          claim: Theorem 2, S T^2 = Omega-tilde(epsilon N) for S-bit advice in a group of prime order N (composite order, the largest prime factor); Theorem 10, P T + T^2 = Omega(epsilon N) (operator glyph reconstructed); Section 7.1, the matching table construction in O(S log N) bits.
          verified_by: TASK-20260928-a75ba7
        - ref: SRC-KS, Kuhn and Struik, SAC 2001, LNCS 2259 (PDF sha256 369ff4cfe50ae108cc514862cbf307c53354742780f2a7fe2fa175e3c6d73fe4)
          provenance: retrieved
          claim: Theorem 1, E_L about sqrt(pi N / 2) times the sum over t < L of C(2t, t)/4^t for L << N^(1/4), about sqrt(2 L N), a constant 2/sqrt(pi) = 1.128 relative to one target.
          verified_by: TASK-20260928-a75ba7
        - ref: SRC-BL, Bernstein and Lange, IACR ePrint 2012/458 (PDF sha256 204d47c34c410b594d2212370dde79e97883b9fdcb5a8b8ab6880a228d26d3b7)
          provenance: retrieved
          claim: 1.77 l^(1/3) online after 1.24 l^(2/3) precomputation with a table of l^(1/3) entries; Table 4.1, 15 measured constants at l about 2^48.
          verified_by: TASK-20260928-a75ba7
        - ref: KN-LIT-013
          provenance: internal
          claim: Corpus entry for CGK; states S T^2 = Omega-tilde(epsilon N) and that the full paper was not read there. Superseded as support by SRC-CGK above; kept as the corpus pointer.
          verified_by: TASK-20260929-1e739f (corpus entry read in full)
        - ref: KN-LIT-f47b10 and KN-LIT-7cc07f
          provenance: internal
          claim: Corpus entries for Kuhn-Struik and Bernstein-Lange; superseded as support by SRC-KS and SRC-BL.
          verified_by: TASK-20260928-58d044 (read in full there; not re-read by TASK-20260929-1e739f)
      validation_experiment_ids: [EXP-BINSTD-517186]
      validation_plan: >-
        SAMPLE: the shared-table rho harness (I2) on each cell (subgroup orders
        about 2^17 to 2^20), 30 seeds per L in 1, 4, 16, 64, 256, and 150
        single-target reference solves, with the table charged in entries and
        bytes. PREDICTED DISTRIBUTION: total walk_ops at L about c(L) sqrt(L)
        W1 with the Kuhn-Struik values; exponent -0.5 + slope(log2 c), model
        -0.4805. COMPARISON: c(L) in [0.8, 1.3] at every L and exponent_rho in
        [-0.6, -0.4] on each cell (the exponent is -0.5 plus the slope of
        log2 c(L) identically, a disclosed link). TAIL: the 90th percentile
        over the mean of the per-seed totals at each L against the L = 1
        ratio. TRANSFER: the law's form only; part (ii) is not measured and
        enters only the Stage 0 arithmetic.
      falsification_condition: >-
        With G1 passed: both binary cells outside the H2 band (c(L) outside
        [0.8, 1.3] at some L, or exponent_rho outside [-0.6, -0.4]) with every
        c(L) inside the instrument band [0.5, 2] (H2-NEGATIVE): H2 (i) does not
        describe the shared-table harness at those group orders and L, and the
        window's rho side carries the measured law. A pooling constant outside
        [0.5, 2] is an instrument defect and reads nothing. Part (ii) is
        withdrawn only by a published generic preprocessing algorithm off the
        S T^2 line or by a source statement of a different form (the retrieved
        Theorem 2 is of the stated form up to its conventions); either
        withdraws the frontier column and leaves the split (A) standing.

