hypothesis:
  id: H-SCR-001
  question_id: RQ-CRYPTO-001
  source_proposal: IDEA-20260723-003
  statement: >-
    Applying the frozen post-z_R / post-hyperplane admission sheet
    mechanically to the frozen corpus snapshot (the BATCH-005 checked scope,
    commit-pinned) yields a complete, deduplicated admissibility table in
    which zero items supply a semantically distinct explicit operation with a
    fully charged complete classical prime-field relation-to-target path
    below the matched Pollard-rho work exponent, and the residual frontier is
    recorded as SOURCE-LOCATOR-OPEN together with KN-OPEN-005, KN-OPEN-004,
    KN-OPEN-006, and the umbrella KN-OPEN-001. The hypothesis is falsified if
    at least one frozen corpus item passes every sheet predicate; that item
    must then be recorded as a candidate.
  mechanism: >-
    Corpus and literature deduplication against the two excluded interfaces
    (the failed compact z_R constructor of IDEA-20260723-001 / EV-CRYPTO-002
    and the inconclusive defect-scaled hyperplane-signature route of
    IDEA-20260723-002 / EV-CRYPTO-004), against the named toy-negative closed
    classes (jets, elliptic nets, incidence, BKK, displacement, model and
    factor-base and isogeny levers, solver-free summation backends), and
    against the operation-level collapse recorded in the BATCH-005 checked
    snapshot (source-preserving transforms, endpoint aggregation plus source
    unranking, scalar-orientation return, cover/correspondence transfer).
    Items surviving dedup are admitted only if they name an explicit public
    operation and a complete charged sub-rho cost path; otherwise the
    residual frontier is recorded unchanged as SOURCE-LOCATOR-OPEN with a
    repaired zero-compute admission sheet rather than a new algorithm.
  assumptions:
    - >-
      Every audited artifact is content-pinned: the audit reads git blob
      content at the frozen snapshot commit, not the working tree, so the
      sheet's input is immutable and replayable.
    - >-
      The frozen sheet predicates S1-S5 in EXP-SCR-001 are decidable per
      corpus item from the pinned records; an item on which a predicate
      cannot be decided from the pinned record is recorded as
      undecidable_with_reason, never silently admitted or dropped.
    - >-
      Literature conclusions are scored as recorded in the pinned KN-LIT
      entries and the pinned BATCH-005 literature_deduplication section; the
      audit performs no live retrieval and no new external coverage.
    - >-
      The checked corpus is the BATCH-005 scope; coverage outside it is
      explicitly out of scope and its absence is not evidence.
    - >-
      The 0.50 rho work exponent is the screen's sub-rho threshold; the
      campaign admission margin (lambda, mu at most 0.45) is recorded as a
      secondary flag per item and is not this screen's pass/fail line.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: >-
        Generic-group square-root lower bound fixing the screen's sub-rho
        threshold at work exponent 0.50.
      citation: >-
        Shoup, Lower Bounds for Discrete Logarithms and Related Problems,
        EUROCRYPT 1997 (KN-LIT-011); technique record KN-TECH-005.
      role: screen_threshold
    - description: >-
        Survey anchor for the classical prime-field ECDLP literature class in
        the frozen dedup table.
      citation: >-
        Galbraith and Gaudry, Recent progress on the elliptic curve discrete
        logarithm problem, Designs, Codes and Cryptography 78 (2016);
        knowledge record KN-LIT-006.
      role: literature_class_anchor
    - description: >-
        Algebraic prime-field index-calculus class anchor for the solver-free
        summation backend dedup class.
      citation: >-
        Petit, Kosters, and Messeng, Algebraic Approaches for the Elliptic
        Curve Discrete Logarithm Problem over Prime Fields, PKC 2016;
        knowledge record KN-LIT-025.
      role: literature_class_anchor
    - description: >-
        Prime-field index-calculus route reported worse than Pollard rho in
        the pinned screen, anchoring one literature dedup item.
      citation: >-
        McGuire and Mueller, A New Index Calculus Algorithm for the Elliptic
        Curve Discrete Logarithm Problem and Summation Polynomial Evaluation,
        IACR ePrint 2017/1262 (as recorded in the pinned BATCH-005 candidate
        report literature_deduplication section, retrieved 2026-07-23).
      role: literature_class_anchor
  reduction_chain: null
  predictions:
    - metric: admissible_candidate_count
      direction: lower
      minimum_effect: >-
        exactly 0 among the 21 frozen corpus audit items (scoped-absence
        claim); any count above 0 falsifies the screen and the passing item
        must be recorded.
    - metric: table_completeness
      direction: higher
      minimum_effect: >-
        exactly 21 of 21 corpus items receive exactly one verdict plus a
        duplicate-owner or residual-frontier assignment; an incomplete table
        is an invalid run, not a negative result.
    - metric: sheet_calibration_accuracy
      direction: higher
      minimum_effect: >-
        exactly 2 of 2 frozen calibration items receive their pre-declared
        verdicts (one ADMIT fixture, one reject_duplicate), proving the sheet
        discriminates before any corpus verdict is read.
    - metric: residual_frontier_recorded
      direction: different
      minimum_effect: >-
        the residual frontier table contains SOURCE-LOCATOR-OPEN, KN-OPEN-005,
        KN-OPEN-004, KN-OPEN-006, and KN-OPEN-001 with their frozen admission
        obligations, and proposes no new algorithm.
  test_boundary:
    instances:
      - >-
        21 frozen corpus audit items in three groups: 9 dedup/exclusion items
        (2 excluded interfaces, 7 toy-negative closed classes), 5 residual
        open problems, 7 literature screen records, as enumerated in
        EXP-SCR-001 inputs.audit_item_index
      - 2 frozen calibration fixtures (one must-pass, one must-fail)
    parameters:
      sub_rho_work_exponent_threshold: 0.5
      campaign_admission_threshold: 0.45
      snapshot_commit: b8af1551e45fbe4435745239d29f4d141eea3356
    implementation: >-
      Deterministic read-and-adjudicate audit applying the frozen sheet in
      EXP-SCR-001 to git-blob-pinned corpus content; no sampling, no curve
      arithmetic, no live retrieval.
    budget:
      wall_clock_seconds_per_run: 1800
      total_wall_clock_seconds: 4200
      maximum_runs: 3
  falsification_conditions:
    - >-
      At least one frozen corpus item passes S1-S5 (semantically distinct,
      explicit operation, complete charged sub-rho path): the screen is
      refuted and the passing item must be recorded as a candidate with its
      full cost ledger.
    - >-
      A dedup assignment is shown wrong: an item classified
      reject_duplicate or reject_closed_class is demonstrated, from pinned
      records, to be semantically distinct from its named owner and to
      satisfy S4-S5.
    - >-
      The sheet cannot be applied mechanically (a predicate is ambiguous on a
      pinned record): the affected item is recorded undecidable_with_reason
      and the run is inconclusive for that item, which blocks the
      scoped-absence success criterion without falsifying the hypothesis.
  interpretation_limits:
    - >-
      A zero-admissible table is a scoped absence over the checked frozen
      snapshot only: it is not an impossibility theorem, not exhaustive
      prior-art coverage, and does not close unrestricted non-generic
      representations (AGENTS.md rule 6).
    - >-
      The audit re-adjudicates committed records; it produces no empirical
      run, no curve computation, and no cryptographic-scale evidence. Its
      claim tier is bounded by the scope of the checked snapshot.
    - >-
      Literature items are scored as recorded in pinned knowledge and batch
      records retrieved on the recorded dates; newly appearing external work
      is outside this screen.
    - >-
      A sheet-calibration failure invalidates the audit (instrument failure);
      it is not evidence for or against the screen claim.
    - No ECDLP algorithm, solve, or breakthrough is claimed by any outcome.
  status: approved
  proposed_by: coordinator
