# =============================================================================
# H-CSIDH-f83e20 — specified from IDEA-20261006-3cc090 in design session
# design-session-20261009 (worktree at origin/main tip 2487cdb0e1).
# Question RQ-CSIDH-64343f, goal GOAL-CSIDH-001. The prediction under
# test is the idea's own: when both frozen enumerations return the same
# reduced-form set and the frozen rational interval gates the scoring,
# the nearest integer r to the 30-term truncation of L(1, chi) at
# discriminant -83 equals the certified form count h. A scored r
# different from h is the concrete negative. This record does not
# assert that any form was enumerated, does not assert the value of
# h(-83), and states no security level.
# =============================================================================
hypothesis:
  id: H-CSIDH-f83e20
  question_id: RQ-CSIDH-64343f
  goal_id: GOAL-CSIDH-001
  source_idea_ids:
    - IDEA-20261006-3cc090
  added: '2026-10-09'
  status: approved
  approved_by: coordinator
  approved_at: '2026-10-09'
  proposed_by: coordinator
  title: >-
    The interval-gated nearest integer to a 30-term class-number
    truncation equals the two-enumeration-certified form count at
    discriminant -83
  statement: >-
    Let p = 83. Let h be the number of reduced positive-definite binary
    quadratic forms (a, b, c) of discriminant -83 under the reduced
    convention -a < b <= a <= c with b >= 0 when |b| = a or a = c,
    certified before scoring by two independent enumerations that must
    return the same set: E1, the direct reduced-form listing under the
    standard bounds a <= sqrt(|D|/3), and E2, the orbit enumeration of
    every primitive positive-definite form of discriminant -83 in the
    frozen box 0 < a <= 40, 0 <= b <= a, 0 < c <= 400, reduced by the
    Gauss reduction algorithm and deduplicated. Let chi(n) be the
    Kronecker symbol (-83/n) and let L30 be the exact rational sum of
    chi(n)/n for n from 1 to 30. Let S be (sqrt(83)/pi) times L30,
    where pi is the circle constant, not a Frobenius endomorphism.
    Replace sqrt(83) by rational bounds computed in-launcher by integer
    square root at 10^6 decimal places and pi by the classical
    continued-fraction convergent bounds 333/106 < pi < 355/113, so
    that S is enclosed in a rational interval of length strictly less
    than 1/2. If that interval contains two integers, or meets an
    integer plus 1/2, or has length at least 1/2, the row is
    instrument_failure and no nearest integer is scored. Otherwise let r
    be the unique integer nearest to every point of the interval. The
    claim is r = h. A finished interval with r scored and r different
    from h is the concrete negative. This is not an invariant-factor
    count, it is not the congruence of a Frobenius endomorphism with 1
    modulo a prime, and it states no security level.
  mechanism: >-
    The tracked object is the class number, read as a form count,
    against one partial sum of the Dirichlet series for L(1, chi). The
    representation is the set of reduced positive-definite binary
    quadratic forms of discriminant -83, counted twice by two
    independent enumerations whose agreement certifies h before anything
    is scored. The operation set Sigma is enumeration of that set, not
    composition and not elliptic translation. Class:
    coordinate-dependent, because h is a property of the whole set and
    is constant on forms. Lossy-projection test against Sigma: the
    forms are discarded and the integer h is kept. Many sets share a
    cardinality, so the projection is lossy. Two outcomes are
    separated before any run. r = h says this 30-term truncation, under
    the declared rational bounds, already names the form count. r
    different from h says the truncation has not settled. The question
    asks for a certified class-group order at a small CSIDH-like
    discriminant. The order is the product of the invariant factors,
    which a different record ignores. This record scores the order and
    ignores the factors.
  assumptions:
    - >-
      Discriminant -83 is fundamental (83 is prime and 83 is congruent
      to 3 modulo 4). The number of reduced positive-definite forms is
      the class number of Z[(1+sqrt(-83))/2].
    - >-
      The weight w in the recalled Dirichlet class-number formula is 2 at
      this discriminant (D < -4), so the factor in front of L(1, chi)
      is sqrt(p)/pi. If a later primary read shows a different weight,
      the row is instrument_failure rather than a mismatch.
    - >-
      The nearest integer is scored only when the rational interval has
      length strictly less than 1/2, contains at most one integer
      (defensive), and meets no half-integer; r is then the unique
      integer nearest to every point of the interval, not necessarily an
      integer contained in it. A wider interval is not a mismatch.
    - >-
      No quantum oracle and no security level enter the claim.
  proof_search_map:
    bottleneck: >-
      Whether the 30-term truncation of L(1, chi) at discriminant -83,
      under the frozen rational enclosure, rounds to the certified form
      count h at this discriminant.
    observation_collision: >-
      Many truncation lengths share a nearest integer — the integer is
      the object. The certified form count h is the extra datum that
      separates them; only the frozen truncation length 30 is scored.
    constructive_transforms: >-
      None. This is a measurement: one frozen truncation compared with
      one certified count. No transform, reduction, or closure of the
      class-number formula is proposed.
    quantifier_order: >-
      For this discriminant and this truncation length: the
      interval-gated r equals the certified h or it does not. No other
      discriminant, truncation length, or enclosure enters the claim.
    method_ceiling: >-
      Closes only this discriminant and this truncation length, never
      the infinite sum. A match is not a proof of the Dirichlet
      class-number formula and not a CSIDH-512 class number.
    nearby_object_control: >-
      The -332 non-fundamental refusal: -332 = 4*(-83) is the
      conductor-2 non-maximal order of the same field Q(sqrt(-83)),
      and the launcher must label it non-fundamental or refuse it
      before any count is scored.
  predictions:
    - metric: >-
        absolute difference between the interval-gated nearest integer r
        and the two-enumeration-certified form count h
      direction: lower
      minimum_effect: equal to 0
  test_boundary:
    instances:
      - discriminant -83
      - truncation length 30
      - the frozen E2 box bounds A_MAX = 40 and C_MAX = 400
      - the frozen pi convergents 333/106 and 355/113
      - the -332 non-fundamental control
    parameters:
      p: 83
      N: 30
      A_MAX: 40
      C_MAX: 400
      sqrt83_decimal_places: 1000000
      pi_bounds: '333/106 < pi < 355/113'
    implementation: >-
      Enumerate the reduced forms of discriminant -83 twice (E1 direct
      listing, E2 orbit enumeration over the frozen box with Gauss
      reduction and deduplication), compute the Kronecker symbol
      (-83/n) for n from 1 to 30 and the exact rational sum L30, enclose
      S = (sqrt(83)/pi) * L30 in a rational interval of length strictly
      less than 1/2, run the -332 control and the -84 self-check, and
      name exactly one reading row. No quantum circuit, no
      discrete-logarithm search, and no full group-action oracle.
    budget:
      cell: both enumerations, one truncation, one interval, one run id
      maximum_runs: 1
  falsification_conditions:
    - >-
      The interval meets the length bound, r is scored, and r is
      different from h. That difference is the negative observation.
    - >-
      The two enumerations disagree and the disagreed h is then used.
    - Discriminant -332 is treated as fundamental.
  interpretation_limits:
    - >-
      Equality at 30 terms is not a proof of the Dirichlet class-number
      formula and is not a CSIDH-512 class number.
    - >-
      A mismatch closes only this discriminant and this truncation
      length. It does not refute the infinite sum.
    - >-
      The circle constant in the formula is not the Frobenius
      endomorphism, and the claim is not a congruence modulo the group
      order.
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        The tail of L(1, chi) after 30 terms, multiplied by sqrt(83)/pi,
        has absolute value strictly less than 1/2, so the nearest
        integer to the truncation equals the class number. The tail bound
        is the heuristic. The form count is the measurement.
      random_model_justification: >-
        None. This is a tail-bound heuristic over a complete frozen
        cell, one discriminant and one truncation length, not a
        distributional claim. No random model is invoked, and none is
        needed to compare the scored integer against the certified count.
      supporting_results: []
      validation_experiment_ids:
        - EXP-CSIDH-f3c102
      validation_plan: >-
        The run compares the scored integer against the exactly
        enumerated count on a complete cell (both enumerations, one
        discriminant, one truncation length), not a random draw. The
        tail check is the interval length gate, which must pass before r
        is scored.
      falsification_condition: >-
        A scored r different from h.
  structural_ingredients:
    - description: >-
        For the fundamental discriminant -83 (83 prime, 83 congruent to
        3 modulo 4), the class number equals (sqrt(p)/pi) times L(1,
        chi) with weight w = 2. Not opened as a primary text in this
        session.
      citation: Dirichlet class-number formula for imaginary quadratic fields
      provenance: recalled
      verified_by: null
      role: the infinite-sum identity the truncation approximates
    - description: >-
        The Kronecker symbol (-83/n) defines the Dirichlet character
        chi. Not opened as a primary text in this session.
      citation: Kronecker symbol
      provenance: recalled
      verified_by: null
      role: the character
    - description: >-
        The reduced positive-definite binary quadratic forms of one
        discriminant can be enumerated both directly and by Gauss
        reduction of a covering box, and agreement of the two
        enumerations certifies the count. Not opened as a primary text
        in this session.
      citation: reduced-form enumeration
      provenance: recalled
      verified_by: null
      role: the certificate
    - description: >-
        The note estimates a count of discriminants whose class number is
        not divisible by a fixed prime l. It does not evaluate a
        30-term truncation at discriminant -83.
      citation: KN-LIT-508
      provenance: kb
      verified_by: knowledge/literature/KN-LIT-508.md
      role: orthogonal indivisibility count
    - description: >-
        A generic algorithm on a prime-order group needs Omega of the
        square root of the group order. This form count is not a
        generic discrete logarithm.
      citation: KR-RHO-13bf67
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
      role: the generic exponent fence
  reduction_chain:
    core_problem: >-
      one truncation-length certification at one toy discriminant
    corollaries: []
  rerandomization: >-
    None. The cell is the frozen discriminant and the frozen truncation
    length, every form in it, not a random draw. The computation is
    deterministic, nothing is sampled, and nothing pulls a hidden shift
    back to an input instance.
