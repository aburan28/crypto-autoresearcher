      falsification_condition: >-
        Floors met and Spearman ρ < 0.70 (O-FAIL-BAND), OR twin failure
        (O-ARTIFACT), OR floors unmet after enhanced freeze (O-INCONCLUSIVE).

  asymptotic_claim:
