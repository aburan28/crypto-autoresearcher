  title: >-
    After EV-BINSTD-69cb29, an enhanced diversity-seeking catalog targets ≥3
    distinct dim(V·V) on (17,3) for FORALL package admission, and independently
    replicates the (17,4) floors-met fail-band cell reading under twin meters
    and the frozen 0.70 band

  statement: >-
    CLAIM (heuristic_validation / encoding-size instrument; NO ATTACK; NO
    EXPONENT). Successor to H-BINSTD-7cbce1 after EV-BINSTD-69cb29 (package
    O-INCONCLUSIVE: (17,3) distinct_dimVV=2; (17,4) floors met ρ≈−0.24
    disclosed). Using a NEW enhanced diversity-seeking frozen catalog (seed
    2026100330; ≥32 and ≤72 shapes; dimVV-first seek; NOT seeds 2026100317
    or 2026100320): (A) FORALL Stage-1 cells (n,ℓ)∈{(17,3),(17,4)} —
    ADMISSION twin meters agree and catalog yields ≥3 distinct dim(V·V) and
    ≥2 distinct N_var; only after (A), Spearman ρ ≥ 0.70 (O-SUPPORT) OR fails
    (O-FAIL-BAND); if (A) fails → package O-INCONCLUSIVE. (B) SCOPED: when
    (17,4) floors met and CI95 entirely below 0.70 under twin agreement,
    record scoped_17_4_outcome=O-CELL-FAIL-BAND-17-4 (replication of the
    EV-BINSTD-69cb29 disclosed cell) WITHOUT upgrading package
    O-INCONCLUSIVE while (17,3) floors fail. NO break. NO n≥131 transfer.
    Do NOT re-run EXP-BINSTD-16ee30 or EXP-BINSTD-5b2fd0 v1.

  mechanism: >-
    OBJECT FRAME as IDEA-20261001-febbe1 / H-BINSTD-7cbce1. Operation set
    CHANGE: enhanced catalog (sparse / complement-mix / multiplicative
    translate / expanded twists; min 32 / max 72; dimVV-first random seek) plus
    dual-label Stage-1 (package FORALL vs scoped (17,4)). Twin dimVV + twin
    N_var meters unchanged. WHAT IS NEW: combined NA-1 (a)+(b) after
    EV-BINSTD-69cb29; scoped cell fail-band is first-class.

  predictions:
    - metric: distinct_dimVV_values
      direction: lower_bounded
      minimum_effect: '≥ 3 distinct dim(V·V) values per Stage-1 cell (package admission)'
    - metric: distinct_Nvar_values
      direction: lower_bounded
      minimum_effect: '≥ 2 distinct N_var values per Stage-1 cell (admission)'
    - metric: spearman_dimVV_vs_Nvar
      direction: lower_bounded
      minimum_effect: '≥ 0.70 at each Stage-1 cell after FORALL admission'
    - metric: scoped_17_4_failband_replication
      direction: same
      minimum_effect: >-
        (17,4) floors met and CI95 entirely <0.70 → O-CELL-FAIL-BAND-17-4
    - metric: catalog_size
      direction: lower_bounded
      minimum_effect: '≥ 32 distinct V shapes per Stage-1 cell'
    - metric: twin_agreement
      direction: same
      minimum_effect: >-
        dimVV path A = path B and N_var path A = path B on every measured V

  test_boundary:
    instances:
      - 'Stage 0: enhanced diversity freeze for (n,ℓ)∈{17,19,23}×{3,4}; twin probe'
      - 'Stage 1 authorized: (n,ℓ)∈{(17,3),(17,4)} FORALL floors then package Spearman; scoped (17,4)'
    parameters:
      spearman_band: 0.70
      catalog_seed: 2026100330
      bootstrap_seed: 2026100331
      bootstrap_reps: 200
      min_catalog: 32
      max_catalog: 72
      floor_dimVV: 3
      floor_Nvar: 2
      forbidden_catalog_seeds: [2026100317, 2026100320]
      moduli:
        17: t^17+t^3+1
        19: t^19+t^5+t^2+t+1
        23: t^23+t^5+1
    implementation: >-
      Pure Python under experiments/EXP-BINSTD-9b18fc/implementation/;
      command surface implementation/run.py driven by trial-plan-v1.json.
      Twin meters in product_space.py and encode_s3.py. No Magma/Sage/AUXIN/Bedrock.
    budget:
      wall_clock_seconds: 7200
      memory_gb: 2
      maximum_runs: 4

  falsification_conditions:
    - Twin meters disagree on any measured V (O-ARTIFACT; table void).
    - Reading package O-SUPPORT/O-FAIL-BAND without FORALL admission floors.
    - Upgrading package O-INCONCLUSIVE from scoped (17,4) alone.
    - Re-using EXP-BINSTD-16ee30 or EXP-BINSTD-5b2fd0 catalog seeds.
    - Editing the 0.70 band after seeing encodings.
    - Claiming practical binary IC or an exponent move from a toy Spearman.
    - Transferring the 0.70 band to n≥131 without a new contract.

  distinguishable_outcomes:
    - id: O-SUPPORT
      meaning: >-
        Twin OK; FORALL admission floors met; Spearman ρ ≥ 0.70 on every
        Stage-1 cell. Encoding-size predictor holds at toys under enhanced
        catalog. No attack claim.
    - id: O-FAIL-BAND
      meaning: >-
        Twin OK; FORALL floors met; ρ < 0.70 on at least one Stage-1 cell.
        Product-dim-not-predictive of N_var at this scale (power-adequate).
    - id: O-INCONCLUSIVE
      meaning: >-
        Catalog still collapses below ≥3 distinct dim(V·V) or ≥2 distinct
        N_var on a Stage-1 cell after enhanced freeze; package band not read
        as support/fail. Scoped (17,4) outcome may still be decided.
    - id: O-CELL-FAIL-BAND-17-4
      meaning: >-
        Scoped secondary: (17,4) floors met, twin OK, CI95 entirely below
        0.70 under the new catalog — replicates EV-BINSTD-69cb29 disclosed
        cell reading. Does not alone license package O-FAIL-BAND.
    - id: O-ARTIFACT
      meaning: Twin disagreement or freeze/regression failure. No ρ claim kept.
    - id: O-IMPEDIMENT
      meaning: >-
        Infrastructure timeout/crash/missing Stage-0 freeze. Never
        negative evidence against H-BINSTD-73ea03.

  interpretation_limits:
    - Encoding-size correlation only; does not predict yield or beat rho.
    - Does not rewrite EV-BINSTD-69cb29 / EV-BINSTD-a99d47 or re-score prior freezes.
    - Stage-2 (n=19,23 + random-Boolean null) not authorized under this card.
    - Ambient (17,3) may admit only two dimVV values; package O-INCONCLUSIVE remains honest.
    - No attack at field degree ≥ 131. ECC2K-130 is not an instance.

  heuristic_assumptions:
    - id: HEUR-BINSTD-febbe1-H1
      formal_statement: >-
        FORALL Stage-1 cells (17,3)/(17,4): after admission floors on the
        frozen enhanced diversity-seeking catalog, Spearman ρ(dim(V·V), N_var)
        ≥ 0.70.
      random_model_justification: >-
        Same as IDEA-20261001-febbe1. Catalog enhancement and scoped cell
        arm repair instrument power after EV-BINSTD-69cb29; they do not
        change the heuristic.
      supporting_results:
        - EV-BINSTD-69cb29
        - EV-BINSTD-a99d47
        - IDEA-20261003-94078e
        - IDEA-20261003-f20e41
        - KR-IC-73db3f
      validation_experiment_ids:
