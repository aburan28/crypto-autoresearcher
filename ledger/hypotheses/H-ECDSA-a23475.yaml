hypothesis:
  id: H-ECDSA-a23475
  question_id: RQ-ECDSA-87625f

  statement: >-
    SCOPE: the set of PUBLISHED resource rows for ECDSA key recovery from
    partial nonce leakage -- lattice-with-predicate and Fourier/Bleichenbacher
    alike -- treated as data, under five charging conventions declared before
    any row is read. This is a COST-MODEL AUDIT. NO ATTACK IS RUN, NO KEY IS
    RECOVERED, NO ALGORITHM IS IMPROVED OR CRITICISED, NO EXPONENT IS MOVED,
    AND NOTHING HERE CONCERNS THE PLAIN ECDLP (GOAL-ECDSA-001.non_duplication;
    KN-OPEN-011 owns that question and it stays with GOAL-ECDLP-001 /
    GOAL-PATH-001). CLAIM TIER: not applicable to an attack; the tier of any
    resulting evidence record is bounded by the provenance of the rows, and
    rows relayed from an excerpt may support no claim above "as reported,
    unverified".

    The hypothesis is that GOAL-ECDSA-001's own premise -- that the missing
    work is a MEMORY-charged comparison -- is under-specified, and that two
    checkable facts show which axis actually binds.

    C1 (VOLUME / COMPARABILITY). For at least one published row, the STORED
    VOLUME of its input signatures, V = Q * b bytes with b in {40, 64, 96}
    depending on curve order and record format, EXCEEDS its reported peak
    working memory M. Predicted specifically for the row quoted in
    RQ-ECDSA-87625f.provenance at 2^36 samples and 850 GiB: V/M = 3.01 at
    b = 40 and 4.82 at b = 64. If C1 holds, the reported M of that row and the
    reported M of the 2^25-sample row (V/M = 0.00064) do not denote the same
    quantity, and placing 1939 GiB beside 850 GiB as two points of one
    memory-charged frontier is a category error that no choice of charging
    convention repairs.

    C2 (ORDERING INSTABILITY). The ordering of the published rows is NOT
    invariant across the five declared conventions, and it is the QUERY axis --
    signature count charged as an oracle-query cost against the victim's key --
    that moves it furthest. For the two 1-bit secp160r1 rows the end-to-end
    wall clocks cross at exactly
      rho* = (Q_F - Q_L)/(T_L - T_F) = (2^36 - 2^25)/(49440 - 16740) s
           = 2.1005e6 signatures per second,
    so below rho* the row reported as 2.95x faster is slower end-to-end -- 828x
    slower at rho = 10^3, and 3.0e5 times more expensive under an
    area-time-squared charge.

    C3 (THE DELIVERABLE). Only ORDER-STABLE pairs -- those keeping their sign
    under all five conventions -- may be stated as Pareto facts, and the
    stability fraction of the published rows must be measurably lower than that
    of a matched null of the same marginal spread. C3 is what converts "one
    frontier or two incomparable regimes" (RQ-ECDSA-87625f.decision_target)
    from a rhetorical question into a measured statistic.

    IF C1 AND C2 BOTH FAIL the deliverable is the negative: memory and query
    charging do not reorder this family's published results, GOAL-ECDSA-001's
    premise is weakened before six batches are spent on it, and the goal is
    told so with the numbers. That negative is a first-class outcome and is
    designed for, not tolerated.

  mechanism: >-
    DERIVED IN-REPO. No primary source on ECDSA nonce leakage was read by the
    session that wrote this record. Every resource figure used below is quoted
    from RQ-ECDSA-87625f.provenance, WHICH LABELS ITS OWN FIGURES AS READ FROM
    A REPOSITORY README IN EXCERPT AND EXPLICITLY UNVERIFIED. They are used
    here as INPUTS TO A SENSITIVITY ANALYSIS and never as measurements; stage 0
    of EXP-ECDSA-dad4fd exists to replace them.

    THE FOUR AXES. Every published nonce-leakage recovery has at least four
    resource coordinates and the literature reports at most three:
      T = compute wall clock
      M = reported peak working memory
      Q = number of signatures consumed -- an ORACLE QUERY COUNT against the
          victim's key, not a free parameter and not a compute cost
      V = Q * b = stored volume of those signatures, a memory cost that the
          reported M may or may not include, and which no figure this session
          has seen states either way.
    b is 40 bytes for a raw (r, s) pair at 160-bit order, 64 with the message
    hash; 64 and 96 respectively at 256-bit order. Both endpoints are
    evaluated; none is asserted.

    C1, COMPUTED. From the two relayed secp160r1 1-bit rows
      Row L: Q = 2^25, T = 824 min = 49440 s, M = 1939 GiB
      Row F: Q = 2^36, T = 279 min = 16740 s, M = 850 GiB
    at b = 40 bytes:
      V(L) = 2^25 * 40 = 1.342e9 B = 1.250 GiB,  V/M = 0.00064
      V(F) = 2^36 * 40 = 2.749e12 B = 2560 GiB,  V/M = 3.01
    and at b = 64, V(F) = 4096 GiB, V/M = 4.82. Row F's input alone is three to
    five times its reported peak memory; Row L's is a rounding error. EITHER
    the reported M excludes streamed input -- in which case M is not a
    comparable quantity between the rows -- OR one figure is wrong. Both are
    deliverables and both are cheap.

    C2, COMPUTED. Charging acquisition at rho signatures/second gives
    T_tot = T + Q/rho, hence rho* = (Q_F - Q_L)/(T_L - T_F). Evaluated:
      Q_F - Q_L = 68719476736 - 33554432 = 68685922304
      T_L - T_F = 49440 - 16740 = 32700 s
      rho* = 2.1005e6 signatures/second.
    Ratios T_F/T_L: 828.2 at rho = 1e3; 130.5 at 1e4; 1.727 at 1e6; 1.000 at
    rho*; 0.3525 at 1e8. Under M * T_tot^2: compute-only gives
    1939*49440^2 = 4.7395e12 against 850*16740^2 = 2.3819e11, i.e. L/F = 19.90
    (F cheaper); at rho = 1e3 it gives F/L = 3.007e5 (L cheaper). THE ORDERING
    IS A PROPERTY OF rho, WHICH IS A DEPLOYMENT FACT ABOUT THE VICTIM THAT NO
    PAPER IS OBLIGED TO STATE.

    THE FIVE CONVENTIONS, FROZEN BEFORE ANY ROW IS READ.
      K1  T only                                (what most papers report)
      K2  M only
      K3  A * T,   A = max(M, V)                (area-time)
      K4  A * T^2, A = max(M, V)                (area-time-squared / full cost;
                                                 KN-TECH-035 lineage, NOT READ)
      K5  T + Q/rho at rho in {1e2,1e3,1e4,1e6,1e8}  (acquisition-charged)
    A = max(M, V) is a DECLARED and CONSERVATIVE choice: it charges the larger
    of working memory and stored input, never both. The sensitivity of every
    conclusion to replacing it by M + V is reported alongside.

    THE STATISTIC. For each ordered pair (i, j) record sign(cost_i - cost_j)
    under each convention; stable(i,j) = 1 iff the sign is identical under all
    of them. Report (a) the stability fraction, (b) the explicit unstable-pair
    list with the convention that flips each and its crossover parameter value,
    (c) the list of rows dominated simultaneously on T, M and Q. ONLY STABLE
    PAIRS MAY BE STATED AS PARETO FACTS. That rule is the deliverable and is
    what GOAL-RSA-001 can bind to (GOAL-ECDSA-001.non_duplication requires
    whichever goal runs second to bind to the other's convention or record why
    it cannot; K1-K5 with A = max(M,V) and the M+V sensitivity is offered in
    scheme-neutral terms, with its query axis instantiating there as sieving
    relation output rather than as signatures, stated rather than assumed).

    WHY THE QUERY AXIS AND NOT THE MEMORY AXIS. The two quoted rows differ by
    2.28x on memory, 2.95x on time, and 2^11 = 2048x on queries. A frontier
    that charges memory and not queries has charged the smaller difference by a
    factor of about 2^10 and left the larger one free. That is the entire
    content of the hypothesis in one sentence, and it is arithmetic on the
    goal's own quoted numbers.

    WHY THIS IS NOT A REPACKAGING OF "REPORT MEMORY TOO". Reporting memory
    beside time yields one extra column and a second ordering; it does not say
    which orderings SURVIVE. Ordering stability is the invariant of the
    comparison rather than a preferred convention, it punishes convention
    shopping instead of rewarding it, and it is the only statistic in this
    lane that is defined without choosing a cost model.

  assumptions:
    - >-
      FROZEN DEFINITIONS, complete before any row is read.
      (G1) axes (T, M, Q) as reported by the source; V = Q*b, b in {40,64,96}.
      (G2) A = max(M, V); the M+V variant is computed and reported alongside.
      (G3) conventions K1..K5 exactly as above, with the rho grid as above.
      (G4) stable(i,j) = sign agreement across all conventions and all rho.
      (G5) a row enters the analysis only with a provenance label in
           {primary-read, README-relayed, secondary-relayed,
            this-program-measured}, and every statistic is recomputed with the
           relayed rows excluded.
      No other degree of freedom. Any change after any statistic is observed is
      a versioned protocol amendment with confirmatory_status exploratory_only,
      never an edit.
    - >-
      Signature acquisition is serial at a bounded rate rho and is not free
      (HEUR-EC-4). The archive regime rho = infinity, where only V binds, is
      reported in parallel at every point; neither regime is assumed.
    - >-
      Reported wall clock and peak memory from different papers and hardware
      are on a common enough scale that their ORDER carries information even
      though their magnitudes do not (HEUR-EC-3). This is the assumption the
      literature already makes implicitly whenever a frontier is drawn; stating
      it is part of the contribution.
    - >-
      No statement is made about any algorithm's intrinsic cost. Every
      conclusion is of the form "the REPORTED numbers, under convention K,
      order as follows".

  proof_search_map:
    bottleneck: >-
      Whether the reported peak memory M is a comparable quantity across rows.
      Everything the goal's completion criterion 2 asks for -- "a single
      memory-charged frontier ... covering both families" -- rests on that one
      step, and C1 is the cheapest possible test of it. If M is not comparable,
      no charging convention repairs the frontier and the goal must either
      obtain a comparable memory figure or state the frontier's axes
      differently. That is an afternoon's arithmetic standing in front of a
      six-batch campaign.
    baseline_embedding:
      parameter_slice: >-
        rho = infinity and V = 0. In that slice K5 collapses to K1, K3 to M*T
        and K4 to M*T^2, and the analysis reduces EXACTLY to the conventional
        time-and-memory reporting the literature already performs. So the
        incumbent method is a boundary case of this one, at a named parameter
        value, rather than something this analysis merely resembles.
      reproduction_check: >-
        SYMBOLIC AND EXACT: at rho = infinity, T_tot = T identically, so K5's
        ordering equals K1's for every pair, by definition and not by
        approximation. Fixture: the two quoted rows must reproduce the
        literature's own reported comparison (F faster by 2.95x, F using 2.28x
        less memory) under K1 and K2, and they do -- 49440/16740 = 2.9534 and
        1939/850 = 2.2812. A convention that could not reproduce the incumbent
        ordering at its own boundary would be measuring something else.
    observation_collision:
      observable: >-
        The pairwise sign vector of a row across the five conventions.
      distinct_preimage_search: >-
        COLLISIONS ARE ABUNDANT AND ARE THE REASON THE NULLS EXIST. Rows
        differing by orders of magnitude on every axis can share a sign vector,
        so a stable ordering is NOT evidence that the rows are similar. The
        decisive collision to search for is on the other side: TWO ROWS WHOSE
        REPORTED M DENOTES DIFFERENT THINGS (one including streamed input, one
        not) are indistinguishable in the observable, and C1's V/M ratio is the
        additional condition that separates them. Without that separator the
        whole frontier is an identifiability failure, which is exactly the
        claim.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Track the ORDER RELATION across conventions rather than any single
          cost. The order relation preserves more state than a chosen cost
          does -- it survives every monotone rescaling of any axis -- and that
          stronger state is what survives being carried across papers, machines
          and years.
        predicted_gain: >-
          A comparison that cannot be manufactured by choosing a convention,
          because the statistic is defined over all of them. It costs absolute
          magnitude, which the record never claims.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (the pairwise ordering under K1 and K2) fixed and
          vary the forgotten structure (Q, V, rho). The intrinsic invariant
          proposed to distinguish the resulting objects is the crossover
          parameter rho*, which exists for every pair whose ordering K5 can
          flip and is undefined for pairs it cannot.
        predicted_gain: >-
          Turns "the ordering might depend on queries" into a number per pair.
          A pair with no finite rho* is genuinely order-stable on that axis and
          may be stated as a Pareto fact; a pair with rho* inside the plausible
          deployment range may not.
      - transform: specialization_pack
        proposed_object: >-
          Charge only over provably disjoint resource blocks: A = max(M, V)
          rather than M + V, so no byte is charged twice.
        predicted_gain: >-
          A conservative convention that cannot be accused of inflating the
          memory axis to manufacture an inversion -- which matters, because the
          hypothesis predicts an inversion.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER. C1: EXISTS a published row FORALL b in
      {40, 64, 96} such that V > M. The witness row may depend on nothing; it
      is exhibited. C3: EXISTS the frozen convention set K1..K5 (fixed before
      any row is read, not chosen per pair) FORALL published row pairs such
      that the stability verdict is well defined, AND the stability fraction is
      below the matched-null value. THE WEAKER ORDER -- FORALL pairs EXISTS a
      convention that flips them -- IS TRIVIALLY SATISFIABLE, IS EXPLICITLY NOT
      CLAIMED, AND IS NOT ADMISSIBLE AS A RESULT. This is the quantifier trap
      the audit is hunting in its own design: a convention allowed to depend on
      the pair proves nothing, which is why the set is frozen and why the null
      measures how often random rows flip under the same frozen set.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that the REPORTED figures of the assembled rows, under the
        five declared conventions, order in the stated way, with the stated
        stability fraction, and that a stated number of rows have V > M as
        reported. It CANNOT certify that any algorithm is faster, slower,
        cheaper or more expensive than another; cannot certify that any
        published figure is wrong; cannot say where the 1-bit boundary sits at
        256 bits; and cannot say anything about the ECDLP. A finding that a row
        is Pareto-dominated is a finding about the row AS REPORTED, not an
        allegation about the paper -- papers optimise the axis they declare,
        and the point is that a defender reads the frontier rather than the
        declaration.
      nearby_object_control: >-
        THE OBJECT WHERE THE HOPED-FOR CONCLUSION MUST FAIL is a set of rows
        generated from a single time-memory tradeoff curve M*T = const at fixed
        Q. There the conventions disagree BY CONSTRUCTION (K1 and K2 order such
        rows exactly oppositely) while the rows are perfectly comparable and lie
        on one frontier -- so ordering instability there means "tradeoff", not
        "incomparable". If the audit cannot separate that object from the
        published rows, it has not identified the load-bearing structure and
        C3's interpretation collapses. FORCED VALUES for that control, derived
        before the run: K1-vs-K2 agreement is exactly 0 on every pair; K3 gives
        EXACT TIES on every pair whose M > V (because A*T = M*T = const there)
        and a strictly T-monotone order on the pairs whose M < V. A control
        that returns anything else is misimplemented.
    proof_obligations:
      - claim: V = Q*b with b in {40,64,96} is a correct lower bound on stored input volume.
        responsibility: size
      - claim: rho* = (Q_F - Q_L)/(T_L - T_F) is the exact K5 crossover for a pair.
        responsibility: correctness
      - claim: At rho = infinity, K5's ordering equals K1's identically.
        responsibility: baseline
      - claim: For i.i.d. rows, P(K1 and K2 agree on a pair) = 1/2 exactly, bounding null stability.
        responsibility: strictness
      - claim: The stability verdict is computed under a convention set frozen before any row is read.
        responsibility: interface
      - claim: Every statistic is recomputed with relayed rows excluded, and both values are reported.
        responsibility: scope
      - claim: No conclusion asserts anything about an algorithm's intrinsic cost or about the ECDLP.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null, and stated plainly as the generation contract requires:
    THIS HYPOTHESIS MOVES NO EXPONENT. It changes which cost is compared, not
    what any cost is. It is proposed because GOAL-ECDSA-001's completion
    criterion 2 cannot be met without a charging convention, because the
    convention is currently unstated anywhere in this program, and because the
    arithmetic that decides whether the convention matters costs an afternoon
    against a six-batch campaign budget.

  heuristic_assumptions:
    - id: HEUR-EC-3
      formal_statement: >-
        (Cross-source comparability.) FORALL pairs of published rows i, j from
        different papers and hardware, sign(T_i - T_j) and sign(M_i - M_j)
        carry information about the algorithms, even though the magnitudes
        T_i/T_j and M_i/M_j do not.
      random_model_justification: >-
        NONE, AND THIS IS THE PROPOSAL'S WEAKEST ASSUMPTION. It is the
        assumption the literature already makes implicitly whenever a frontier
        is drawn across papers; numbering it and testing it is half the
        contribution.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDSA-dad4fd]
      falsification_condition: >-
        Label every pair homogeneous (same paper and hardware) or
        heterogeneous, and report the stability fraction separately. If the two
        differ by more than 0.25, heterogeneous comparisons are reported as
        UNINTERPRETABLE rather than as frontier points, and C3 is restricted to
        homogeneous pairs.
    - id: HEUR-EC-4
      formal_statement: >-
        (Acquisition serialization.) Signature acquisition against a single
        victim key proceeds at a bounded rate rho, so Q signatures impose Q/rho
        seconds of wall clock the attacker cannot parallelise away.
      random_model_justification: >-
        Follows from the leakage model: the side channel is attached to the
        victim's signing operation, so signatures arrive at the victim's
        signing rate. It fails if the attacker can induce signing at will or
        already holds an archive.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDSA-dad4fd]
      falsification_condition: >-
        NOT FALSIFIABLE BY MEASUREMENT, and recorded as a scoping assumption
        rather than dressed as an empirical claim. Its operative content is
        that BOTH regimes (finite rho, and rho = infinity where only V binds)
        must appear in the deliverable; the falsifier of that content is a
        deliverable that reports only one.
    - id: HEUR-EC-8
      formal_statement: >-
        (Storage lower bound.) A pipeline consuming Q signatures must at some
        point hold or stream Q*b bytes, with b >= 40 at 160-bit order, so V is
        a lower bound on its total data movement even if not on its resident
        set.
      random_model_justification: >-
        Information-theoretic in the weak sense that the signatures must be
        read. It is a bound on data movement, NOT on resident memory, and the
        distinction is exactly what C1 is about: a streaming pipeline can have
        V >> M legitimately, and if so the two rows' M values are not
        comparable, which is C1's conclusion either way.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDSA-dad4fd]
      falsification_condition: >-
        A primary source shows the pipeline consumes signatures in a form
        smaller than 40 bytes each (compressed, derived, or generated on the
        fly rather than collected). V is then recomputed at the true b and C1
        is re-evaluated; if b is small enough that V <= M for every row, C1 is
        refuted.

  structural_ingredients:
    - description: >-
        Area-time and area-time-squared full-cost measures for memory-heavy
        computations.
      citation: >-
        KN-TECH-035 is cited in this corpus as the Wiener full-cost lineage
        (session ANGLE-BRIEF, device D5). NOT READ by this session. The A*T and
        A*T^2 forms used here are stated by this record and reconciling them
        with KN-TECH-035's exact formulation is a stage-0 task. No claim is
        made that KN-TECH-035 says what this record says.
    - description: >-
        The resource figures for the two secp160r1 1-bit rows.
      citation: >-
        ledger/questions/RQ-ECDSA-87625f.yaml, provenance block, which states
        that these come from a repository README table read in excerpt and are
        research targets to be re-read. NOT READ -- relayed claim, and used
        only as sensitivity inputs.
    - description: >-
        Pareto honesty obligations: dominated_by across time, memory and
        data/queries, and a quantitative sota_delta.
      citation: docs/inventor-protocol.md section 5
      role: the reason the deliverable is an ordering statistic rather than a chosen cost

  reduction_chain:
    core_problem: >-
      Decide whether the published nonce-leakage resource rows admit a single
      well-defined Pareto frontier at all, and if so which pairwise
      comparisons on it are convention-independent.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. Nothing here reduces to a statement about any
      algorithm's cost, about the 1-bit boundary at 256 bits, about the
      predicate or Fourier families' correctness, or about the ECDLP. The
      convention offered to GOAL-RSA-001 is an OFFER of a definition, not a
      reduction, and its query axis instantiates differently there.

  predictions:
    - metric: >-
        V/M for the highest-Q row in the assembled table, at b = 40 bytes
      direction: higher
      minimum_effect: >-
        STRICTLY GREATER THAN 1; predicted 3.01 for the specific relayed row
        (2^36 samples, 850 GiB). If every row in the re-read primary table has
        V/M <= 1 at every b in {40,64,96}, C1 is FALSE and is withdrawn.
    - metric: >-
        Acquisition crossover rate rho* for the two 1-bit secp160r1 rows
      direction: different
      minimum_effect: >-
        2.1005e6 signatures/second, stated to five significant figures BEFORE
        the primary table is read, from the relayed inputs. If the re-read
        numbers differ, rho* is recomputed by the SAME frozen formula and both
        values are reported. THE FORMULA IS PRE-REGISTERED, NOT THE NUMBER.
    - metric: >-
        Ordering-stability fraction of the published rows under K1..K5
      direction: lower
      minimum_effect: >-
        At least 0.15 below the matched-null fraction measured on the same
        number of rows with the same per-axis log-ranges. At or above the null
        value, C3 is refuted: charging conventions do not discriminate this
        family and that negative is the deliverable.
    - metric: >-
        Count of published rows dominated simultaneously on T, M and Q by
        another row in the table
      direction: higher
      minimum_effect: >-
        At least 1, or an explicit statement that none is. A published point
        that is Pareto-dominated once all three axes are shown together has
        never been so labelled in per-paper reporting, and labelling it is a
        result either way.
    - metric: >-
        Fraction of assembled rows whose primary source states whether the
        reported peak memory includes input signature volume
      direction: lower
      minimum_effect: >-
        Reported as measured, no value predicted. A low fraction justifies the
        convention; a high fraction means the literature already handles this
        and C1 is a misreading, which is recorded as such.
    - metric: >-
        Number of inverted pairs as a function of rho over
        {1e2, 1e3, 1e4, 1e5, 1e6, 1e7, 1e8}
      direction: lower
      minimum_effect: >-
        MONOTONE NON-INCREASING in rho, by force: a higher acquisition rate
        shrinks the query term, so the ordering must converge to the
        compute-only ordering. A non-monotone curve means the evaluator is
        wrong, not the attacks -- the canonical artifact tell
        (docs/inventor-protocol.md section 3) applied to a cost model.

  test_boundary:
    instances:
      - >-
        Every published (curve size, leakage level, error rate, Q, T, M) row
        that stage 0 can obtain, each carrying a provenance label.
      - >-
        Matched null A: R synthetic rows with independent (T, M, Q) drawn on
        the same per-axis log-ranges as the published rows.
      - >-
        Matched null B (correlated): R synthetic rows from a single M*T = const
        curve at fixed Q -- the tradeoff object where instability means
        "tradeoff", not "incomparable".
      - >-
        Positive control: one synthetic inverting pair, P = (T 100, M 1,
        Q 2^20) and P' = (T 50, M 1000, Q 2^20).
    parameters:
      conventions: [K1_time, K2_memory, K3_AT, K4_AT2, K5_acquisition]
      area_definition: max(M, V)
      area_sensitivity_variant: M + V
      bytes_per_signature: [40, 64, 96]
      rho_grid: [1.0e2, 1.0e3, 1.0e4, 1.0e5, 1.0e6, 1.0e7, 1.0e8]
      synthetic_rows_per_null: 200
      null_seeds: [11, 22, 33]
      minimum_published_rows_for_a_stability_statement: 6
    implementation: >-
      Pure Python arithmetic on a transcribed table. No solver, no lattice, no
      network beyond stage 0's source acquisition. numpy is present (measured
      2026-08-06) but is not required.
    budget:
      stage0_wall_clock_seconds: 5400
      stage1_wall_clock_seconds: 600
      stage2_wall_clock_seconds: 900
      maximum_memory_gb: 1
      note: >-
        The dominant cost is READING, not computing. If the primary tables
        cannot be obtained under the network policy, that is an infrastructure
        outcome reported as such (AGENTS.md rule 5) and matches
        GOAL-ECDSA-001.pause_conditions clause 2; the arithmetic is then run on
        the relayed rows and every output is labelled a sensitivity analysis
        over unverified inputs.

  falsification_conditions:
    - >-
      V/M <= 1 for every row at every b in {40, 64, 96} in the re-read primary
      table. C1 is withdrawn as a superseding record.
    - >-
      Ordering stability of the published rows is at or above the matched-null
      value. C2 and C3 are refuted; charging does not discriminate this family;
      the negative is the deliverable and GOAL-ECDSA-001's premise is reported
      as weakened.
    - >-
      Primary sources state explicitly that reported memory includes input
      volume for the rows in question. The category-error claim collapses to a
      misreading and is recorded as one.
    - >-
      The inverted-pair positive control is not flagged by the detector.
      NOTHING in the run may be reported.
    - >-
      The correlated null B does not produce exact K1-vs-K2 disagreement on
      every pair and exact K3 ties on its M > V pairs. The evaluator is
      misimplemented and every stability number is void.
    - >-
