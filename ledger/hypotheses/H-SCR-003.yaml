hypothesis:
  id: H-SCR-003
  question_id: RQ-CRYPTO-001
  source_proposal: IDEA-20260723-005
  statement: >-
    Applying the frozen KN-OPEN-005 GGM-simulability screen mechanically to
    the frozen corpus snapshot (the checked prime-field representation
    corpus, commit-pinned) yields a complete, deduplicated family table in
    which zero of the eight frozen named families is both distinct from the
    already audited jet, elliptic-net, incidence, endpoint-aggregation,
    cover-return, and coordinate-encoding classes and equipped with an
    explicit target-conditioned transcript separating it from an
    O(1)-overhead generic-group simulator under the frozen NS-TX-PRIME-001
    criterion. The hypothesis is falsified if at least one frozen family
    passes the full frozen criterion; that family must then be recorded as an
    unfiled theorem candidate.
  mechanism: >-
    Deduplicate every frozen family against the closed variants: higher-order
    public-equation jets and public affine or algebraically constrained lifts
    (covered by the all-order public Hasse-Schmidt simulation theorem in
    research/THM_JETBARRIER1.md), finite additive, formal, Witt, p-typical,
    and arithmetic jet targets (covered by the P1547 prime-to-p filtration
    and additive vanishing screen), Hasse-jet multiplicity codes (IDEA-268,
    hidden source oracle), composite-handle coordinate oracles
    (encoding-only gap), Weil-restriction/descent jets (outside prime-field
    scope), and the remaining FINDING-PF-IC-001 representation screens.
    Surviving items are then admitted only if they satisfy the frozen
    NS-TX-PRIME-001 criterion written into EXP-SCR-003: exact oracle
    definition, proved two-world relabelling isomorphism, a public-verifier
    transcript gap asymptotically larger than the O((q+1)^2/N) generic
    collision term, an exact signed occurrence-relation transcript shape, and
    a complete charged cost ledger with tau at most 0.25 and lambda, mu at
    most 0.45. Separation and usefulness are scored as distinct gates: a raw
    encoding gap without a source-bearing relation transcript is not an
    admissible family.
  assumptions:
    - >-
      Every audited artifact is content-pinned: the audit reads git blob
      content at the frozen snapshot commit, not the working tree.
    - >-
      The frozen screen scores families as recorded in the pinned corpus; no
      external web review is performed, matching the checked scope of the
      BATCH-007 screen.
    - >-
      NS-TX-PRIME-001 is a sufficient certificate against a frozen
      O(1)-overhead simulator, not a necessary condition: failure to exhibit
      a two-world gap for a family is recorded as
      separation_not_certified, never as a proved simulation, unless the
      pinned record itself supplies the covering simulation theorem.
    - >-
      The prime-to-p additive vanishing exclusion is applied only to the
      stated homomorphic additive channel; nonlinear cocycles, multi-point
      predicates, torsors, and branch-selection distributions are not
      silently covered by it.
    - >-
      The frozen sheet predicates are decidable per family from the pinned
      records; undecidable items are recorded undecidable_with_reason, never
      silently admitted or dropped.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: >-
        Generic-group square-root lower bound: an O(1)-overhead simulable
        augmentation inherits the Omega(N^(1/2)) generic work barrier, which
        is what makes the simulability screen decisive.
      citation: >-
        Shoup, Lower Bounds for Discrete Logarithms and Related Problems,
        EUROCRYPT 1997 (KN-LIT-011); technique record KN-TECH-005.
      role: simulability_barrier
    - description: >-
        Universal Somos identities hold for every scalar k, so on a single
        k-fiber elliptic-net values can encode only the group law -- the
        recurring tautology argument behind the closed net class.
      citation: technique record KN-TECH-009.
      role: closed_class_justification
    - description: >-
        All-order public-equation jet simulation theorem and the
        composite-handle coordinate-seam classification used by the frozen
        dedup classes.
      citation: research/THM_JETBARRIER1.md (internal theorem record, commit-pinned).
      role: closed_class_justification
  reduction_chain: null
  predictions:
    - metric: admitted_family_count
      direction: lower
      minimum_effect: >-
        exactly 0 among the 8 frozen family items; any count above 0
        falsifies the screen claim and the passing family must be recorded.
    - metric: dedup_class_assignment_complete
      direction: higher
      minimum_effect: >-
        exactly 8 of 8 families receive a dedup class (prior_audited,
        prior_rejected, uninstantiated_residual, model_seam,
        outside_prime_field_scope) with a named owner record; incomplete
        assignment invalidates the run.
    - metric: sheet_calibration_accuracy
      direction: higher
      minimum_effect: >-
        frozen calibration items receive their pre-declared verdicts: the
        must-pass synthetic family fixture is ADMITTED, and the must-fail
        first-jet oracle fixture is classified simulable_closed (fails the
        NS-TX-PRIME-001 transcript-gap clause), proving the sheet
        discriminates before any corpus verdict is read.
    - metric: separation_usefulness_split_recorded
      direction: different
      minimum_effect: >-
        every family receives separate simulator-separation (N1-N3) and
        relation-usefulness (N4-N5) verdicts; no family is recorded as
        simulable merely because it is not useful, and no encoding-only gap
        is recorded as a source-bearing separation.
  test_boundary:
    instances:
      - >-
        8 frozen family items: higher_order_public_equation_jets,
        public_affine_or_algebraically_constrained_lifts,
        finite_additive_formal_Witt_or_arithmetic_jet_targets,
        nonadditive_lift_invariant_point_constraint,
        composite_handle_coordinate_oracle, Weil_restriction_or_descent_jet,
        Hasse_jet_multiplicity_code, other_finding_representation_screens
      - >-
        3 frozen calibration fixtures: one must-pass synthetic family
        fixture, one must-fail first-jet dual-number oracle fixture, and one
        intermediate discrete-log augmentation fixture (separation certified
        at N3, rejected at N4) recording the separation/usefulness split
      - 4 frozen residual placeholders carried without admission scoring
    parameters:
      campaign_work_threshold_lambda: 0.45
      campaign_memory_threshold_mu: 0.45
      fresh_target_exponent_cap_tau: 0.25
      generic_collision_term: O((q+1)^2/N)
      snapshot_commit: b8af1551e45fbe4435745239d29f4d141eea3356
    implementation: >-
      Deterministic read-and-adjudicate audit applying the frozen screen in
      EXP-SCR-003 to git-blob-pinned corpus content; zero compute beyond
      table construction; no sampling and no curve arithmetic.
    budget:
      wall_clock_seconds_per_run: 1800
      total_wall_clock_seconds: 3600
      maximum_runs: 3
  falsification_conditions:
    - >-
      At least one frozen family is mechanism-distinct from every closed
      class and passes N1-N5 with a source-bearing transcript gap and a
      complete charged ledger: the screen claim is refuted and the family
      must be recorded as an unfiled theorem candidate.
    - >-
      A dedup assignment is shown wrong from pinned records: a family
      classified into a closed class is demonstrated not to be covered by the
      named simulation theorem or vanishing screen, and it then passes
      N1-N5.
    - >-
      A predicate is mechanically undecidable on a pinned record: the family
      is recorded undecidable_with_reason and the run is inconclusive for
      that family, blocking the scoped-absence success criterion without
      falsifying the hypothesis.
  interpretation_limits:
    - >-
      A zero-admitted table is a scoped absence over the checked closed-family
      list and frozen corpus only: it is not a universal GGM-simulability
      theorem, not GGM completeness, and not a proof that all non-generic
      representations are simulable.
    - >-
      NS-TX-PRIME-001 can reject a candidate but cannot classify every failed
      candidate as simulable; a gap may live in adaptive joint transcripts,
      state across answers, or accumulated per-answer gaps, none of which the
      frozen fixed-schedule criterion excludes.
    - >-
      THM-JETBARRIER1 G1 is an open model-classification question; nothing in
      this screen closes every imaginable augmentation.
    - >-
      A representation may be encoding-dependent and therefore non-generic
      without supplying useful k-dependent relations; an encoding-only gap is
      recorded as such and is not an admissible family.
    - >-
      The audit is zero-compute: no empirical run, no curve execution, no
      cryptographic-scale evidence; existing toy evidence enters only as
      scoped prior records (AGENTS.md rule 7).
    - No ECDLP algorithm, solve, or breakthrough is claimed by any outcome.
  status: approved
  proposed_by: coordinator
