hypothesis:
  id: H-MCE-15cb48
  question_id: RQ-MCE-e65b3c
  derived_from_idea: IDEA-20260807-c3267e
  added: '2026-08-25'
  status: proposed
  proposed_by: coordinator
  statement: >-
    The reviewed but unadopted code-based costing convention DOES REAL WORK: recharging a published
    ISD cost figure under its declared triple (what is counted, under which memory model, with what
    preprocessing charge) yields a figure that differs MATERIALLY - a nonzero delta in bits - from
    the same figure charged naively under the private convention that produced it. The competing
    reading, which the design can select instead, is that the delta is ZERO, in which case adoption
    is cosmetic and must be recorded as such rather than celebrated. A third selectable outcome is
    that the convention carries a specific defect that its prior review missed, in which case a
    reasoned rejection is the deliverable and is as valuable as adoption.
  mechanism: >-
    Three code-based goals need cross-scheme-comparable ISD figures and none can produce one,
    because a figure is comparable to another only if both are expressed under the same triple. The
    convention that would supply that triple exists, is complete, and was independently reviewed and
    found genuinely scheme-independent, but no decision adopts, supersedes, amends or rejects it, so
    it remains permanently proposed. One task already read a published ISD cost table and
    DELIBERATELY DECLINED to transcribe it, deferring to a binding that does not exist. The
    measurement that decides whether the limbo matters is the MIGRATION CHECK: take one already-
    published figure, recharge it under the convention's triple and under the private convention
    that produced it, and report the difference. If the two agree exactly, the convention creates no
    comparability and adoption is cosmetic. If they differ, the difference IS the size of the
    comparability problem, and a prior proposal in this program has already priced it at 6 to 10
    bits in a single named direction - a pre-registered target this check either meets or refutes.
  assumptions:
  - >-
    ADOPTION IS A COORDINATOR ACT AND IS NOT PERFORMED BY THIS HYPOTHESIS OR ITS EXPERIMENT. What is
    produced is the audit that such a decision would consume. A proposal cannot self-adopt
    (AGENTS.md rule 1).
  - >-
    The published cost table is an external source; every transcribed value records its provenance
    level and its locator, and a value that cannot be obtained is marked unavailable rather than
    recalled.
  - >-
    The three goals may need DIFFERENT memory models, in which case the convention must declare all
    three as ROWS rather than pick one. Whether it does is part of the audit, not an assumption.
  - >-
    The convention's own text is read first-hand for this audit; a review judgement recorded
    elsewhere is a pointer, not a substitute.
  proof_search_map:
    bottleneck: >-
      The step that decides whether the limbo matters is the migration delta on a single published
      figure. Everything else in the lane - which goals bind, what the successor act is - is
      procedure downstream of that number.
    baseline_embedding:
      parameter_slice: >-
        The private convention that produced the published figure is the baseline; recharging under
        it must reproduce the published figure exactly, or the transcription is wrong and no delta
        is meaningful.
      reproduction_check: >-
        A frozen fixture: the published figure, re-derived under its own stated convention, must
        equal the published value to the digits the source carries.
    observation_collision:
      observable: 'An ISD attack cost under a declared triple.'
      distinct_preimage_search: >-
        Two figures under DIFFERENT conventions are not comparable at all, so the convention is what
        creates comparability rather than what discovers it. The honest caveat is stated: adopting a
        convention creates no knowledge; it makes existing figures subtractable, and that is its
        entire value.
    quantifier_order: >-
      FOR ALL pairs of ISD figures expressed under the SAME triple, their difference is meaningful;
      there EXISTS no such guarantee across triples. The transitivity gate tests exactly that
      quantifier on two real figures drawn from different goals.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest claim a run may support is a measured delta on the specific figures recharged,
        plus verdicts on scheme-independence and transitivity. It supports NO security claim, no
        attack, and no margin statement about any code-based scheme - a margin computed under two
        conventions is an artifact of the conventions.
      nearby_object_control: >-
        A figure whose private convention already coincides with the convention's triple. Its
        migration delta must be EXACTLY ZERO. If the pipeline reports a nonzero delta there, it is
        manufacturing differences and no other delta is reportable.
    proof_obligations:
    - claim: 'The convention is statable without naming any specific scheme.'
      responsibility: scope
    - claim: 'Recharging under the private convention reproduces the published figure.'
      responsibility: baseline
    - claim: 'Two figures from different goals become subtractable after migration without further argument.'
      responsibility: interface
    - claim: 'The delta on a convention-coincident figure is exactly zero.'
      responsibility: correctness
    not_applicable_reason: null
  asymptotic_claim:
    problem: null
    prior_best: null
    time_exponent: null
    memory_exponent: null
    hidden_cofactor: null
    claim_kind: null
  heuristic_assumptions:
  - id: HEUR-ISDFC-1
    formal_statement: >-
      One costing convention can serve all three code-based goals in this program without per-scheme
      amendment - that is, for every ISD figure any of the three goals needs, the convention's
      declared triple suffices to express it, and two such figures are subtractable without further
      argument.
    random_model_justification: >-
      Not a distributional heuristic. Its only current support is a review judgement of
      scheme-independence, which is a judgement and not a proof.
    supporting_results: []
    validation_experiment_ids:
    - EXP-MCE-313ecb
    falsification_condition: >-
      The transitivity gate fails on two real figures from different goals - they cannot be
      subtracted without an additional per-scheme argument - or the scheme-independence gate finds
      the convention cannot be stated without naming a scheme. Either refutes HEUR-ISDFC-1 and turns
      the deliverable into a reasoned rejection with a named defect.
  structural_ingredients:
  - description: The published ISD cost table used as the migration subject.
    citation: 'Published ISD cost table (three memory models x five parameter sets) - external source, transcription deferred by a prior task'
    provenance: recalled
    verified_by: null
    role: >-
      Supplies the figures to be recharged. Every transcribed value must record its provenance level
      and locator; a value that cannot be obtained is marked unavailable, never recalled.
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
  - metric: migration_delta_bits
    direction: different
    minimum_effect: >-
      Nonzero, and a prior in-program proposal prices it at 6 to 10 bits in a single named direction.
      A delta of exactly 0 on every migrated figure is the clean negative - adoption is cosmetic and
      must be recorded as such.
  - metric: convention_coincident_control_delta
    direction: different
    minimum_effect: >-
      EXACTLY 0 bits on a figure whose private convention already coincides with the triple. A
      nonzero value there means the pipeline manufactures differences and NO other delta is
      reportable.
  - metric: scheme_independence_verdict
    direction: different
    minimum_effect: >-
      The convention must be statable without naming any specific scheme. A specific defect found
      here is a rejection with a named reason and is equally valuable, since it resolves the limbo
      the lane currently sits in.
  - metric: transitivity_gate_verdict
    direction: different
    minimum_effect: >-
      Two figures from different goals must be subtractable after migration without further argument.
      A failure refutes HEUR-ISDFC-1 directly.
  test_boundary:
    instances:
    - The convention document itself, read first-hand
    - The published ISD cost table's figures, transcribed under the convention's triple
    - At least one figure whose private convention coincides with the triple, as the zero-delta control
    - Two figures drawn from different goals, for the transitivity gate
    parameters:
      memory_models: all rows the convention declares, never a single chosen one
      figures_migrated: at least three, including the coincident control
      arithmetic: exact where the source's precision permits; every rounding stated
    implementation: >-
      Reading plus arithmetic. No solver, no randomness, no seeds, no network beyond source
      retrieval.
    budget:
      wall_clock_seconds_per_run: 900
      maximum_memory_gb: 2
  falsification_conditions:
  - >-
    The migration check shows ZERO delta on every migrated figure. Adoption is cosmetic and is
    recorded as such rather than celebrated. This is a fully reportable negative.
  - >-
    The convention-coincident control shows a nonzero delta. The migration pipeline manufactures
    differences and no delta anywhere in the run is reportable.
  - >-
    A specific defect is found in the convention - it cannot be stated without naming a scheme, or
    its memory-model rows do not cover what the three goals need. The deliverable is a reasoned
    REJECTION with a named reason, which resolves the limbo just as an adoption would.
  - >-
    The transitivity gate fails. HEUR-ISDFC-1 is refuted and the convention needs per-scheme
    amendment, which is a defect and a named one.
  - >-
    The published table cannot be obtained. That is an infrastructure outcome, not a finding about
    the convention, and the deliverable is the convention audit alone with the migration check
    marked unavailable.
  interpretation_limits:
  - >-
    Adoption creates NO new knowledge and NO security claim. It makes existing figures subtractable,
    and that is its entire value.
  - >-
    This hypothesis proposes the measurement; only the Coordinator may take the adopting or
    rejecting act, and no run under it changes any record's status.
  - >-
    A margin claim computed under two conventions is an artifact of the conventions. No margin
    statement about any code-based scheme may be derived from a migrated figure.
  - >-
    The measured delta is scoped to the specific figures recharged and the specific memory-model
    rows used. It is not a general correction factor for any other figure.
  prior_evidence_refs:
  - DEC-20260802-344883
  - DEC-20260803-a5b9b1
  - H-MCE-efa9b2
  - H-HQC-1d9b21
