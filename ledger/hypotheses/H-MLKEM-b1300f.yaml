hypothesis:
  id: H-MLKEM-b1300f
  question_id: RQ-MLKEM-001
  goal_id: GOAL-MLKEM-005
  source_idea: IDEA-20260805-cdc87d

  statement: >-
    SCOPE: cost-model arithmetic over a two-member family of SVP oracles
    (sieving, enumeration), evaluated at block sizes 60..2000, under the
    one-parameter accounting family Cost_alpha = T * M^alpha with alpha in
    [0, 1]. CLAIM TIER estimate. NO LATTICE IS REDUCED, NO ATTACK IS
    IMPLEMENTED, NO FIPS 203 PARAMETER SET IS AFFECTED OR CLEARED.
    THE CLAIM, IN THREE PARTS, EACH SEPARATELY FALSIFIABLE.
    (P1, UNCONDITIONAL GIVEN THE MODEL) For oracles with exponent pairs
    (c_T, c_M) for sieving and (c_E beta log2 beta, 0) for enumeration, the
    crossover block size satisfies log2 beta*(alpha) = (c_T + alpha c_M)/c_E,
    hence beta*(alpha) = beta*(0)^{1 + (c_M/c_T) alpha}. THE SHIFT EXPONENT
    CONTAINS NO CALIBRATED QUANTITY: c_E cancels. With the corpus's relayed
    c_T = 0.292 and c_M = 0.2075 the shift exponent is 1 + 0.7106 alpha
    EXACTLY, and this is the hypothesis's central forced value.
    (P2, CONDITIONAL ON THE CALIBRATION c_E := c_T/log2 beta*(0) AND ON
    beta*(0) = 70) beta*(1) = 1433 +/- 1, which exceeds every block size
    reported for ML-KEM under core-SVP.
    (P3, CONDITIONAL ON P1, P2 AND ON THE ILLUSTRATIVE BLOCK SIZES) At every
    ML-KEM-relevant block size and at alpha = 1 the cheaper SVP oracle is
    ENUMERATION, so the full cost of the best oracle is bounded by
    2^{c_E beta log2 beta} INDEPENDENTLY OF alpha, and the naive
    charge-the-sieve figure overstates the attacker's cost by 35.1 bits at
    beta = 400, 35.9 at 600 and 29.7 at 875.
    WHAT IS NOT CLAIMED: that any alpha is physically correct; that
    enumeration is a better attack in practice at beta = 400; that ML-KEM's
    security level is any particular number; that the o(beta) terms are
    negligible at beta = 70. If P1 fails the hypothesis has no content; if P1
    holds and P3 fails, the deliverable becomes the opposite and equally
    reportable statement that memory charging raises the ML-KEM attack
    exponent by alpha c_M beta with no fallback.

  mechanism: >-
    DERIVED IN-REPO; every imported constant is labelled and none is treated as
    an authority. The arithmetic below was computed on this machine on
    2026-08-05 in pure Python (SCOUT-COMPUTED; re-run in-harness before
    citation).

    THE ACCOUNTING FAMILY. Cost_alpha(A) = T(A) * M(A)^alpha, alpha >= 0.
    alpha = 0 is the step count that core-SVP quotes. alpha = 1 is area-time
    under the identification area ~ stored vectors. The family is the smallest
    one containing both the convention the lattice literature uses and the
    convention KN-TECH-035 imposes on the ECDLP half of this same program, so
    a methodological disagreement becomes an alpha-indexed number.

    THE ORACLES. Sieving: T_S = 2^{c_T beta + o(beta)},
    M_S = 2^{c_M beta + o(beta)}. Enumeration: T_E = 2^{c_E beta log2 beta +
    o(beta log beta)}, M_E = poly(beta), so alpha log2 M_E = O(alpha log beta),
    subleading. Hence log2 Cost_alpha(S) = (c_T + alpha c_M) beta and
    log2 Cost_alpha(E) = c_E beta log2 beta + O(alpha log beta).

    THE CROSSOVER AND THE CANCELLATION. Setting the two equal and dividing by
    beta gives log2 beta*(alpha) = (c_T + alpha c_M)/c_E. Dividing that
    identity by itself at alpha = 0 removes c_E:
      log2 beta*(alpha) / log2 beta*(0) = 1 + (c_M/c_T) alpha.
    This is the whole of P1 and it is one line. Its force is that a 30 per cent
    error in the reported crossover dimension perturbs beta*(1) by
    1.30^{1.7106}, not by an exponent, while an error in c_M/c_T perturbs the
    exponent directly -- so the hypothesis's sensitivity is concentrated in
    exactly two published constants and in nothing that was measured here.

    THE CALIBRATION, AND ITS DECLARED COST. c_E is set to c_T / log2 beta*(0)
    rather than imported. This makes the model reproduce the measured crossover
    BY CONSTRUCTION, so the crossover is NOT evidence for the model and no
    statement in any downstream record may treat it as such. What it buys is
    that the two constants doing the work are the two the sieving literature
    actually states, and that no recalled enumeration constant (the commonly
    quoted 0.125 beta log2 beta is RECALLED, UNVERIFIED) is load-bearing.
    With c_T = 0.292 and beta*(0) = 70: c_E = 0.047640.

    THE LADDER (forced, computed, monotone by construction):
      alpha  0     1/6    1/3    1/2    2/3    5/6    1
      beta*  70.0  115.8  191.5  316.7  523.8  866.4  1433.0

    THE CAP, WHICH IS WHERE ML-KEM ENTERS. An adversary runs whichever oracle
    is cheaper, so min(Cost_alpha(S), Cost_alpha(E)) <= 2^{c_E beta log2 beta},
    a bound with no alpha in it. At illustrative block sizes (RECALLED-
    UNVERIFIED, illustrative only): beta = 400 gives enumeration 164.7 bits,
    sieve 116.8 at alpha = 0 and 199.8 at alpha = 1, so the capped figure is
    164.7 and the naive charge overstates by 35.1; beta = 600 gives
    263.8 / 175.2 / 299.7 and 35.9; beta = 875 gives 407.4 / 255.5 / 437.1 and
    29.7; at beta = 1433 the overstatement is 0 by construction.

    THE TWO CONSEQUENCES, IN OPPOSITE DIRECTIONS, BOTH REQUIRED IN ANY
    DELIVERABLE. (a) For ML-KEM the full-cost margin is LARGER than core-SVP
    reports (164.7 against 116.8 at beta = 400), because core-SVP charges no
    memory at all. A result that makes a standardised scheme look stronger is
    still a result. (b) For this program's own comparisons the RANKING is
    computed in a model whose winning subroutine is not the winning subroutine:
    at alpha = 1 the cheaper oracle at every ML-KEM block size is enumeration,
    so a dual-versus-primal comparison built from sieve step counts is
    comparing two attacks neither of which uses the cheaper oracle. That is the
    sentence GOAL-MLKEM-003 and GOAL-MLKEM-004 needed across eighteen batches
    and did not have.

    WHAT IS NOT DERIVED, AND IS THE WEAKEST LINK. The mapping from a physical
    cost model to a value of alpha. Wiener's model charges wiring in three
    spatial dimensions and adds a latency term per access; that is not exactly
    any member of T * M^alpha. The hypothesis therefore reports an
    alpha-indexed curve and names alpha = 0 and alpha = 1 as the two
    conventions in use, and it does NOT assert which is right.

  assumptions:
    - >-
      FROZEN MODEL, stated completely and with every constant fixed BEFORE any
      evaluation. (1) Cost_alpha = T * M^alpha. (2) Sieve exponent pair
      (c_T, c_M) = (0.292, 0.2075). (3) Enumeration time 2^{c_E beta log2 beta},
      memory poly. (4) c_E := c_T / log2 beta*(0) with beta*(0) = 70. (5) The
      alpha grid is {0, 1/6, 1/3, 1/2, 2/3, 5/6, 1}. (6) The illustrative block
      sizes are 400, 600, 875 and are labelled illustrative at every use. NO
      OTHER DEGREE OF FREEDOM EXISTS. Any change after any number has been
      observed requires a versioned amendment and is never an edit.
    - >-
      c_T = 0.292 and c_M = 0.2075 are RELAYED FROM THIS CORPUS: KN-TECH-044,
      which cites KN-LIT-104 for the 2^{0.2075 n} kissing-number space floor
      and KN-TECH-040 for the 0.292 figure. NEITHER PRIMARY SOURCE WAS READ BY
      THE AUTHOR OF THIS RECORD. They are candidates to check, and checking
      them is stage 2 of EXP-MLKEM-384e5c.
    - >-
      "Crossover at dimension 70" is RELAYED FROM KN-OPEN-017, which states it
      as a measured G6K-versus-FPLLL step-count comparison for exact SVP. The
      underlying measurement was not read. The COHERENCE of that measurement
      with the quoted exponent pair -- whether the sieve whose exponents are
      quoted is the sieve whose crossover was measured -- is an explicit check
      and is not assumed.
    - >-
      The environment was verified by import on 2026-08-05: numpy 2.4.6 IS
      present; sympy, scipy, fpylll and Sage are ABSENT. No lattice reduction
      of any kind can be run in this container. The hypothesis is designed so
      that none is needed, and the corresponding limitation -- that HEUR-XC-1
      cannot be validated here -- is declared rather than worked around.

  proof_search_map:
    bottleneck: >-
      The step at which a memory charge is converted into a block size. Every
      quoted ML-KEM security level, and every dual-versus-primal ranking this
      program has produced, passes through it, and at present it is executed at
      alpha = 0 without the choice being recorded as a choice. If the crossover
      does not move, every downstream comparison is unaffected and this
      hypothesis is worthless; if it moves past the ML-KEM block sizes, every
      comparison is computed against the wrong oracle.
    baseline_embedding:
      parameter_slice: >-
        alpha = 0. At alpha = 0 the model must reproduce, exactly, the incumbent
        situation: crossover at beta*(0) = 70, sieve cost 2^{0.292 beta}, and
        enumeration more expensive than sieving for every beta > 70. This is
        the core-SVP convention the lattice-estimator cost models -- including
        the RC.MATZOV model pinned by EXP-MLKEM-015 -- operate in.
      reproduction_check: >-
        SYMBOLIC, and it is trivially exact BY THE CALIBRATION, which is
        precisely why it is NOT evidence for the model and is recorded here as
        a consistency check only. The non-trivial part of the reproduction is
        the SIGN structure: at alpha = 0 the model must place enumeration above
        sieving for all beta > 70 and below it for all beta < 70, which is a
        property of the functional forms rather than of the calibration and
        can fail if the forms are miswritten.
    observation_collision:
      observable: >-
        The crossover block size beta*(alpha), and the derived shift exponent
        e(alpha) = log2 beta*(alpha) / log2 beta*(0).
      distinct_preimage_search: >-
        A COLLISION EXISTS BY CONSTRUCTION AND IS THE HYPOTHESIS'S PRINCIPAL
        IDENTIFIABILITY WEAKNESS, so it is stated first rather than hidden.
        Every pair of oracle families with the same RATIO c_M/c_T produces the
        SAME shift exponent, whatever their absolute exponents. So the
        observable does not identify the oracle pair -- it identifies one ratio.
        Two ground-truth situations on opposite sides of the conclusion that
        share it: (i) sieving (0.292, 0.2075) against enumeration; (ii) a
        hypothetical sieve (0.584, 0.415) against an enumeration with double
        c_E. Both give shift exponent 1 + 0.7106 alpha; but (ii) puts
        beta*(0) somewhere else entirely and so places the ML-KEM block sizes
        on the OTHER side of the crossover. THE SEPARATING CONDITION IS THE
        BASE beta*(0), which is the one measured quantity, and the hypothesis
        therefore CANNOT stand on the calibration-free part alone when it
        reaches P3. P1 is identifiable; P3 is not, without the measurement. The
        record states which of its parts survives the collision and which does
        not.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the pair (algorithm, algorithm) by the pair of exponent pairs
          ((c_T, c_M), (c_E log2 beta, 0)), moving the comparison into a model
          where the hypothesis is an exact algebraic identity rather than a
          benchmark.
        predicted_gain: >-
          Converts "does charging memory change the ranking" from an
          unanswerable engineering question into a one-line identity plus one
          measured base. Encoding obligation: the exponent pairs must be the
          ones the measured crossover was produced by. Soundness obligation:
          the o() terms must be negligible at the evaluated beta, WHICH IS
          FALSE AT beta = 70 and is carried as HEUR-XC-2.
      - transform: boundary_lift
        proposed_object: >-
          Enlarge the oracle family from two members to three by adding the
          min-space sieve variants KN-TECH-044 names, and prove a strict inward
          improvement of the min-cost envelope rather than merely exhibiting a
          third point.
        predicted_gain: >-
          If a third family lies strictly below the min of the two at some
          (alpha, beta), the cap in P3 is not tight and the overstatement
          figures move. This is the most likely way for P3 to be quantitatively
          wrong while remaining qualitatively right, and it is listed as an
          obligation rather than deferred.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER. P1: EXISTS one closed form e(alpha) =
      1 + (c_M/c_T) alpha, FIXED BEFORE EVALUATION AND INDEPENDENT OF beta,
      alpha, c_E AND OF THE MEASURED CROSSOVER, such that FORALL alpha >= 0 the
      crossover satisfies beta*(alpha) = beta*(0)^{e(alpha)}. The witness may
      NOT depend on the instance (the oracle pair) beyond the single ratio
      c_M/c_T, and this record admits openly under observation_collision that
      the ratio is all it identifies.
      P3 IS A DIFFERENT AND WEAKER ORDER AND MUST NEVER BE STATED AS P1's:
      FORALL beta in the illustrative ML-KEM range, EXISTS a cheaper oracle
      (namely enumeration) at alpha = 1. The existential is inside, the witness
      is allowed to depend on beta, and the claim is therefore a statement
      about a finite table rather than a uniform theorem. Presenting P3 with
      P1's quantifier order would be the central overclaim available here and
      is prohibited in advance.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that under a declared one-parameter accounting family and two
        declared exponent pairs, the crossover moves by a stated closed form,
        and that at a declared list of block sizes the enumeration branch is
        the cheaper one at alpha = 1. It CANNOT certify that enumeration is
        practically better at any dimension anyone has run; it cannot certify
        an ML-KEM security level; it cannot certify that alpha = 1 is the
        physically correct charge; and it cannot certify anything about the
        o(beta) terms, which are the whole content of the regime where the
        calibration point sits.
      nearby_object_control: >-
        THE NEARBY OBJECT ON WHICH THE HOPED-FOR CONCLUSION IS KNOWN FALSE IS A
        PAIR OF ORACLES WITH IDENTICAL MEMORY EXPONENTS. For such a pair the
        crossover CANNOT move with alpha -- the alpha term cancels from both
        sides -- so the shift exponent is exactly 1 and its alpha-derivative is
        exactly 0. A method that reports a moving crossover there has not
        identified the memory-exponent gap as the load-bearing structure and is
        responding to something else. This pair is a REQUIRED arm and is run
        BEFORE the real pair.
    proof_obligations:
      - claim: >-
          log2 beta*(alpha) = (c_T + alpha c_M)/c_E, and c_E cancels in the
          ratio to alpha = 0.
        responsibility: correctness
      - claim: >-
          At alpha = 0 the model reproduces the incumbent sign structure
          (enumeration above sieving for beta > 70, below for beta < 70).
        responsibility: baseline
      - claim: >-
          alpha log2 M_E is subleading against c_E beta log2 beta for every
          alpha in the grid, given enumeration's polynomial space.
        responsibility: feasibility
      - claim: >-
          The quoted exponent pair belongs to the algorithm family whose
          crossover was measured at 70.
        responsibility: interface
      - claim: >-
          The min over the oracle family is taken over a family that is
          complete enough for the cap to be an upper bound.
        responsibility: strictness
      - claim: >-
          P3's quantifier order is reported as an existential inside a
          universal over a finite table, never as P1's uniform statement.
        responsibility: scope
      - claim: >-
          No FIPS 203 parameter set is asserted affected or cleared, and every
          illustrative block size is labelled illustrative at every use.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim:
    problem: >-
      The cost of an exact-SVP oracle inside BKZ, as it enters the concrete
      security estimate of Module-LWE at FIPS 203 parameters. NOT the ML-KEM
      problem itself: no attack is proposed.
    prior_best: >-
      2^{0.292 beta + o(beta)} time with memory 2^{0.2075 beta} UNCHARGED
      (core-SVP, as used inside the lattice-estimator cost models this program
      has pinned, e.g. RC.MATZOV in EXP-MLKEM-015).
    time_exponent: >-
      min(c_T + alpha c_M, c_E log2 beta) per unit beta. At alpha = 1 and the
      illustrative block sizes this evaluates to the enumeration branch, i.e.
      0.0476 log2 beta per unit beta, which EXCEEDS 0.292 for beta > 70. The
      exponent therefore moves AGAINST the attacker; the direction is stated
      explicitly so that no reader mistakes this for an attack improvement.
    memory_exponent: >-
      c_M = 0.2075 on the sieve branch (relayed); 0 up to polynomial factors on
      the enumeration branch (recalled). The memory exponent is the object of
      study, not an output.
    hidden_cofactor: >-
      o(beta) on both sieve exponents; o(beta log beta) on the enumeration
      exponent; the entire wiring and latency model inside the choice of alpha;
      and the constant-factor difference between two codebases inside
      beta*(0) = 70. The hypothesis's central quantity is designed to be immune
      to the last of these and is NOT immune to the first three.
    claim_kind: cofactor_improvement

  heuristic_assumptions:
    - id: HEUR-XC-1
      formal_statement: >-
        FORALL alpha >= 0 and FORALL beta in [60, 2000], the cost of the
        cheaper SVP oracle equals min over the two families of
        2^{c_T beta} * 2^{alpha c_M beta} and 2^{c_E beta log2 beta}, with all
        o() terms set identically to zero.
      random_model_justification: >-
        NOT A DISTRIBUTIONAL ASSUMPTION AND NOT DEFENSIBLE AS ONE. It is the
        assumption that asymptotic exponents describe finite dimensions. It is
        rigorous only in the limit and is UNSUPPORTED at every beta actually
        evaluated. Recorded as the model's defining idealisation rather than
        justified.
      supporting_results: []
      validation_experiment_ids: [EXP-MLKEM-384e5c]
      falsification_condition: >-
        Cannot be falsified in this container: no sieve and no enumeration
        implementation is available (fpylll ABSENT, verified 2026-08-05). The
        substitute obligation, which IS discharged: report the size of the
        o(beta) correction on each side that would be required to bring
        beta*(1) below the largest illustrative ML-KEM block size, and report
        the conclusion as fragile if that correction is small.
    - id: HEUR-XC-2
      formal_statement: >-
        The calibration c_E := c_T / log2 beta*(0), applied at beta*(0) = 70,
        transfers a finite-dimension implementation crossover into an
        asymptotic constant valid at beta of order 10^3.
      random_model_justification: >-
        NONE. THIS IS THE WEAKEST LINK IN THE RECORD and is stated as such
        rather than defended. It is adopted because the alternative -- importing
        a recalled enumeration constant -- is strictly worse, and because P1,
        the hypothesis's central claim, does not depend on it at all.
      supporting_results: []
      validation_experiment_ids: [EXP-MLKEM-384e5c]
      falsification_condition: >-
        The CALIBRATION-CIRCULARITY arm: recompute with an independently
        sourced c_E and report how far the model's beta*(0) then lands from 70.
        A discrepancy of more than a factor two means the calibration is doing
        most of the work and every absolute number in P2 and P3 must be
        withdrawn, leaving P1 standing alone.
    - id: HEUR-XC-3
      formal_statement: >-
        Enumeration's space is poly(beta), so alpha log2 M_E = O(alpha log beta)
        is subleading against c_E beta log2 beta for every alpha in the grid.
      random_model_justification: >-
        Elementary GIVEN the antecedent. The antecedent -- that the pruned
        enumeration variants actually used in the measured comparison run in
        polynomial space -- is RECALLED, UNVERIFIED.
      supporting_results: []
      validation_experiment_ids: [EXP-MLKEM-384e5c]
      falsification_condition: >-
        A source establishing that the relevant enumeration variants use
        2^{Omega(beta)} space. The cap argument in P3 then weakens and must be
        restated with the enumeration branch's own memory charge included.

  structural_ingredients:
    - description: >-
        Full-cost accounting: hardware quantity multiplied by time occupied,
        rather than processor steps.
      citation: >-
        KN-TECH-035 (this corpus), which attributes the discipline and the
        BSGS n^{1/2} -> n^{2/3+o(1)} example to KN-LIT-094 (Wiener). NEITHER
        KN-LIT-094 NOR ANY PRIMARY SOURCE WAS READ HERE. The n^{2/3} figure is
        relayed and is NOT used in any computation in this record; it appears
        only as motivation.
      role: >-
        The accounting convention the alpha family interpolates toward.
    - description: >-
        The kissing-number space floor 2^{0.2075 n} for sieves of Gauss-Sieve
        shape, and the 2^{0.292 beta} classical sieve time exponent.
      citation: >-
        KN-TECH-044 (this corpus), citing KN-LIT-104 and KN-TECH-040
        respectively. RELAYED; primaries NOT READ.
      role: >-
        Supplies the pair (c_M, c_T) on which the entire shift exponent
        depends.
    - description: >-
        The measured enumeration/sieving crossover at dimension 70 (G6K against
        FPLLL, exact SVP, step counts).
      citation: >-
        KN-OPEN-017 (this corpus). RELAYED; the underlying measurement NOT
        READ. KN-OPEN-017 also states, in its own words, that "No source in
        this corpus computes the crossover under full cost."
      role: >-
        Supplies the base beta*(0), and is the ONLY measured input.

  reduction_chain:
    core_problem: >-
      Given two SVP-oracle cost exponents and one measured crossover, determine
      how the crossover and the min-cost envelope move as memory is charged.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. There is no reduction from this cost-model statement
      to any statement about ML-KEM's security, and none is claimed. In
      particular this hypothesis does NOT license a revised ML-KEM security
      level, does NOT close KN-OPEN-016, and does NOT resolve the
      dual-versus-primal question EV-MLKEM-015 scoped. What it would license,
      if supported, is one sentence in the METHODS section of any future
      comparison: which alpha the comparison is computed at.

  predictions:
    - metric: >-
        XC-1 shift exponent e(alpha) recovered numerically by the implemented
        crossover solver, per alpha in the grid
      direction: different
      minimum_effect: >-
        EXACTLY 1 + 0.7106 alpha, to within 1e-9 relative, at all seven grid
        points. FORCED, DERIVED BEFORE ANY RUN, NO PARAMETER FITTED.
    - metric: XC-2 beta*(1)
      direction: higher
      minimum_effect: >-
        1433 +/- 1 under the frozen constants, and required to exceed the
        largest illustrative ML-KEM block size (875) by at least a factor 1.5.
    - metric: >-
        XC-3 overstatement of the naive memory charge, in bits, at
        beta in {400, 600, 875}
      direction: higher
      minimum_effect: >-
        35.1, 35.9 and 29.7 respectively, each within +/- 0.2 bits. A NEGATIVE
        value at any of the three falsifies P3.
    - metric: >-
        XC-4 NULL PAIR: alpha-derivative of log beta* for two oracle families
        with identical memory exponents
      direction: different
      minimum_effect: >-
        EXACTLY 0 at every alpha, to within 1e-12. This null CAN FAIL and its
        failure invalidates the whole run rather than producing a finding.
    - metric: >-
        XC-5 SYNTHETIC POSITIVE CONTROL: fitted shift exponent for declared
        pairs whose memory exponents differ by Delta in {0.05, 0.10, 0.2075}
      direction: different
      minimum_effect: >-
        EXACTLY 1 + (Delta/c_T) alpha at every alpha and every Delta. IF THIS
        FAILS THE INSTRUMENT IS BROKEN AND NO NEGATIVE RESULT MAY BE REPORTED
        FROM THIS HYPOTHESIS AT ALL.
    - metric: >-
        XC-6 monotonicity and interior values over the seven-point alpha ladder
      direction: higher
      minimum_effect: >-
        Strictly increasing, with the five interior values 115.8 / 191.5 /
        316.7 / 523.8 / 866.4 each within 0.1. A failure at an interior point
        localises the defect to an alpha regime.
    - metric: >-
        XC-7 FRAGILITY: the o(beta) correction, in bits per unit beta, that
        would be required on the enumeration side to bring beta*(1) below 875
      direction: different
      minimum_effect: >-
        Reported as a number with no threshold attached, BEFORE the headline is
        written. If it is below 0.05 bits per unit beta the conclusion is
        reported as fragile and P3 is downgraded to indicative.

  test_boundary:
    instances:
      - >-
        Two declared SVP-oracle exponent pairs: sieving (0.292, 0.2075) and
        enumeration (c_E log2 beta, 0) with c_E = 0.047640 by calibration.
      - >-
        One null pair with identical memory exponents, and three synthetic
        control pairs with declared memory-exponent gaps.
      - >-
        Block sizes evaluated on a grid over [60, 2000]; the ML-KEM-relevant
        table reported at the illustrative values 400, 600, 875 ONLY, each
        labelled illustrative.
    parameters:
      c_T: 0.292
      c_M: 0.2075
      beta_star_0: 70
      c_E: 0.047640
      alpha_grid: [0, 0.16666667, 0.33333333, 0.5, 0.66666667, 0.83333333, 1.0]
      illustrative_block_sizes: [400, 600, 875]
      null_pair_memory_exponents: [0.2075, 0.2075]
      synthetic_control_deltas: [0.05, 0.10, 0.2075]
    implementation: >-
      Pure Python plus numpy 2.4.6 (present, verified by import on 2026-08-05).
      sympy, scipy, fpylll and Sage are ABSENT (verified). No lattice reduction
      is performed and none is required. A root-finder for
      (c_T + alpha c_M) = c_E log2 beta with a closed-form cross-check.
    budget:
      stage0_wall_clock_seconds: 3600
      stage0_compute: zero -- pen-and-paper derivation and a second reader
      stage1_wall_clock_seconds: 600
      stage2_wall_clock_seconds: 7200
      stage2_compute: zero -- source retrieval and verbatim quotation only
      stage3_wall_clock_seconds: 600
      maximum_memory_gb: 2

  falsification_conditions:
    - >-
      F1 (ZERO COMPUTE, PRIMARY) -- the c_E cancellation is wrong. P1 has no
      content and the hypothesis is withdrawn by a superseding record. This
      costs one hour and is stage 0.
    - >-
      F2 -- XC-4 returns a nonzero alpha-derivative on the null pair. The
      implementation does not implement the model; NOTHING in the run is
      reportable, and this is an instrument failure, not evidence.
    - >-
