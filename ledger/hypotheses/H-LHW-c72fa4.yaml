  statement: >-
    One half exceeds the written 4999/10000 by cross 2, and the
    difference is 1/10000. Twice 4999 minus 10000 is -2, so twice
    the written figure minus one is -1/5000. The written 6668/10000
    exceeds 2/3 by cross 4, and the difference is 1/7500. Half of
    that written figure exceeds 1/3 by cross 4, and the difference
    is 1/15000. The ratio of the two written exponent formulas is
    2. Eight exceeds 2 by 6. 1024 divided by 64 is 16, and the
    product of 8 and 2 is 16. The product of 193 and 121 is 23353.
  mechanism: >-
