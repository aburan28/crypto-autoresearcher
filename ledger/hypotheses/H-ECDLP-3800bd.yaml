      distinct_preimage_search: >
        Hold the ladder and drop
        r-dependence (KF). Hold the
        method and treat shuffled as
        structured (NULL).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Frozen r-ladder decay table.
        predicted_gain: >
          Exact known-false reject on KF.
          Zero claimed distinguisher.
    quantifier_order: >
      Freeze the ladder and the
      r^{-1/2} rule before reading
      a bias. Toy doubling squares
      are not an FFT measurement.
    method_ceiling:
      strongest_certifiable_claim: >
        Instrument reproduction on
        the declared frozen
        arithmetic. Never an
        x-coordinate FFT. Never an
        ECDLP exponent.
      nearby_object_control: >
        NULL is a shuffled-equals-
        structured dummy. An
        argument that still calls
        it a structured bias is
        proves-too-much.
