  updated: '2026-09-13'
  depends_on:
    - IDEA-20260802-006
    - RQ-ECDLP-002
  related_hypotheses: []
  statement: >
    Fix the closed-form square-root-
    cancellation identities of
    IDEA-20260802-006 before any
    curve is chosen, any x(kP) is
    evaluated, or any FFT is run.
    Stage 0 asserts only that on the
    frozen r-ladder {64,128,256,512}
    a predicted Bias ~ r^{-1/2} has
    doubling ratio squared equal to
    2, that the predicted structured-
    to-unstructured ratio is 1, and
    that four doublings from 64 stay
    on that ladder. A nearby claim
    that Bias is constant in r is
    rejected. A dummy that treats a
    shuffled index as structured is
    rejected. This is not a bias
    measurement and not a DLP solve.
    Stages 1+ stay unauthorized.
  mechanism: >
    IDEA-20260802-006 tracks additive-
    character bias of x(kP) over a
    multiplicative index coset versus
    a matched unstructured set.
    Stage 0 freezes the r^{-1/2}
    decay arithmetic so a later FFT
    cannot be read from an instrument
    that does not decay. No point is
    evaluated. No FFT. No Semaev S_m.
    No DLP solve.
  predictions:
    - id: P-S0-IDXB
      metric: toy index-set decay identities
      direction: different
      minimum_effect: >
        After fixture_pass, REAL
        reports Bias(r)^2/Bias(2r)^2
        = 2 on every frozen doubling
        and predicted ratio 1. KF
        constant-in-r is rejected.
        NULL shuffled-equals-
        structured is rejected.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KF
      statement: >
        After fixture_pass, KF claim
        that Bias is constant in r
        is accepted.
    - id: F-S0-REAL
      statement: >
        After fixture_pass, REAL
        misses a doubling-ratio
        square of 2 or the predicted
        ratio of 1.
  test_boundary:
    instances:
      - frozen Stage 0 REAL / KF / NULL decay-arithmetic panel
    parameters:
      real_ladder:
        r: [64, 128, 256, 512]
        predicted_gamma: '1/2'
        doubling_ratio_squared: 2
        predicted_structured_to_unstructured: 1
        must_doubling_ratio_sq_two: true
        must_predicted_ratio_one: true
      known_false:
        kind: constant_in_r_bias
        claimed_gamma: 0
        must_reject: true
      matched_null:
        kind: shuffled_equals_structured
        must_reject: true
      stage0_only_at_specify: true
    implementation: EXP-ECDLP-9b40a2 Stage 0 runner
    budget:
      wall_clock_seconds: 120
    prose: >
      Exact rational arithmetic only.
      No x(kP). No FFT. The
      r^{-1/2} doubling square 2 is
      the proposal's own decay, not
      a measured bias.
  assumptions:
    - id: A1
      statement: >
        The frozen decay is
        Bias ~ r^{-1/2}, so
        Bias(r)^2 / Bias(2r)^2 = 2.
        Stage 0 does not evaluate
        x(kP) and does not solve a
        DLP.
      status: explicit
    - id: A2
      statement: >
        Standing user authorization
        2026-09-06 covers protocol
        approval once the contract is
        complete.
      status: explicit
  heuristic_assumptions: []
  proof_search_map:
    bottleneck: >
      Whether the predicted doubling
      ratio squared is 2 and the
      predicted structured-to-
      unstructured ratio is 1.
    baseline_embedding:
      parameter_slice: >
        REAL r-ladder, KF constant-
        in-r, NULL shuffled-equals-
        structured.
        Disclosed tightening:
        arithmetic calibrator only,
        not the proposal's FFT
        panel.
      reproduction_check: >
        Doubling square 2. Predicted
        ratio 1. KF rejected. NULL
        rejected.
    observation_collision:
