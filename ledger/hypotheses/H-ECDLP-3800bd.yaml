  title: >
    Stage 0 closed-form index-set
    decay identities — doubling
    ratio squared equals 2 — before
    any x(kP) is evaluated
  status: specified
  proposed_by: idea-generator
  designed_by: coordinator
  designed_under_task: TASK-20260913-a00131
  specified_by: DEC-20260913-4e33ea
