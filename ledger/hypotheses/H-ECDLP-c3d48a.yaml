  statement: >
    Fix the exact threshold identities of
    IDEA-20260808-486ae2 before any
    Coppersmith / Howgrave-Graham /
    Jochemsz-May lattice is built and
    before any Semaev polynomial is
    formed. Stage 0 asserts only that
    the rho-beating threshold is
    t(m)=m/(2(m-1)), that t(3)=3/4,
    that a degree-4-per-variable cap
    eps<=1/4 lies strictly below 3/4
    (empty admissible band at m=3),
    and that the nearby claim that m=3
    already beats rho is rejected. A
    m=2 exhaustive-cost identity
    (solver cost B, lattice cannot win)
    is the matched null. This is not a
    windowed index-calculus attack.
    Stages 1+ stay unauthorized.
  mechanism: >
    The proposal's falsifiable number is
    eps(m,tree) versus t(m)=m/(2(m-1)).
    Stage 0 freezes those exact rational
    comparisons. No Newton polytope is
    computed beyond the declared
    degree-4 cap. No lattice. No S_m.
  predictions:
    - id: P-S0-EPSTH
      metric: exact threshold identities
      direction: different
      minimum_effect: >
        After fixture_pass, REAL has
        t(3)=3/4 and 1/4<3/4.
        KF claim m=3 beats rho is
        rejected. NULL m=2 exhaustive
        identity is accepted as
        lattice-cannot-win.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KF
      statement: >
        After fixture_pass, KF claim
        that m=3 already beats rho is
        accepted.
    - id: F-S0-REAL
      statement: >
        After fixture_pass, t(3) is not
        3/4 or 1/4 is not below 3/4.
  test_boundary:
