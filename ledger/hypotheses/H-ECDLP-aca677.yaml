  statement: >
    Fix the exact affine doubling
    slope of one frozen toy before
    any Gamma orbit, Semaev S_m,
    nested LHW generator, pairing,
    Miller, Tate, or unary-closure
    census is built. Stage 0 asserts
    only that on REAL p=19, A=1,
    B=-1, P=(2,3) one has [2]P=(16,11),
    lambda=(3x^2+A)/(2y)=18,
    lambda'=3, and x'=lambda^2-2x=16,
    and that the nearby KF invariance
    claim lambda'=18 is false. NULL
    empty slope rejected. y=0 is
    undefined (division by 2y).
    This is not det D[2] (768066).
    Stages 1+ stay unauthorized.
  mechanism: >
    IDEA-20260913-4efec0 Stage 0 hard
    gate is the exact rational
    function lambda=(3x^2+A)/(2y)
    at P and at [2]P. Form [2]P by
    affine doubling, then evaluate
    lambda at both points. Stage 0
    freezes that identity as exact
    tables. No Gamma orbit. No
    Semaev S_m. No nested LHW. No
    Miller. No Tate. No unary-
    closure census. This is a new
    GOAL-ECDLP-001 object after
    P-S0-DBLJAC. It is not Stage 1
    of EXP-ECDLP-895a0f and not
    Stage 1 of EXP-ECDLP-bf222c.
  predictions:
    - id: P-S0-DBLSLP
      metric: well-defined doubling-slope identity on frozen toys
      direction: different
      minimum_effect: >
        After fixture_pass, REAL
        lambda equals 18 and
        lambda' equals 3 and
        x' equals 16, and KF
        invariance claim lambda'=18
        is rejected. NULL empty
        slope is rejected. y=0
        is rejected. One certified
        miss after fixture_pass is
        a scoped falsification of
        this instrument at the
        frozen toys.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KF
      statement: >
        After fixture_pass, KF claim
        lambda'=18 is accepted as a
        generic doubling-slope
        target. An encoding bug is
        failed_infrastructure.
    - id: F-S0-REAL
      statement: >
        After fixture_pass, REAL
        fails to match lambda=18,
        lambda'=3, or x'=16.
        That falsifies only
        P-S0-DBLSLP at the frozen
        toy.
  test_boundary:
