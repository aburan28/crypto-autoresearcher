# H-ICEX-6ca21f -- designed by TASK-20261001-768475 (GOAL-ICEX-001,
# BATCH-454f85) as the successor ordered by DEC-20261001-9e675e NA-1/NA-2 and
# DEC-20261001-f5e83a R-2. Parent: H-ICEX-d8e858. Status `specified`:
# designed, not approved. Approval is a separate Coordinator decision.
hypothesis:
  id: H-ICEX-6ca21f
  question_id: RQ-ICEX-001
  parent_hypothesis_id: H-ICEX-d8e858
  source_idea_ids: [IDEA-20260909-fe3e07]
  goal_ids: [GOAL-ICEX-001]
  batch_id: BATCH-454f85
  designed_by_task: TASK-20261001-768475
  experiment_ids: [EXP-ICEX-153c34]

  statement: >-
    On the six frozen EXP-ICEX-aaccfc v4 fixtures (16 and 20 bits, seeds
    21-23), with the v4 interval factor base (B = ceil(p^{1/5})), the C-3 cost
    units, the uniform collector, the linear algebra, the 16 descents and the
    matched rho baseline all held fixed, replacing the enumerative membership
    backend B0 by the Groebner summation-polynomial membership backend G1
    (EXP-ICEX-fa2b37's design, adapted as declared in EXP-ICEX-153c34) brings
    the fully charged m = 5 membership cost per success M_s below the
    competitiveness threshold T = 13*0.886*sqrt(q)/(L+27) units on every 20-bit
    fixture. Independently, along a frozen-L series of fresh public synthetic
    fixtures at 16, 18, 20, 22 and 24 bits, the variable membership cost of one
    complete log, C_M = (L+27)*M_s, grows with an exponent in q below 1/2.

  mechanism: >-
    EV-ICEX-16e3ec localised the whole cost gap of the v4 pipeline in the
    membership decision: yields, linear algebra and descents behave as
    modelled, while one successful enumerative B0 membership costs 50-306
    frozen rho references. Its resource check proposed that a non-enumerative
    decision procedure could convert the same yields into about (L+27)/yield
    attempts at much lower cost each. G1 decides membership of R as solvability
    of I_R = <f6(x1..x5, x(R)), g_V(x1), ..., g_V(x5)> by a deterministic
    Groebner computation and certified root extraction, never listing
    candidate tuples. Because every exact backend decides the same predicate on
    the same attempt stream, attempts per success are fixed; only the
    per-attempt cost changes.

  assumptions:
    - Ordinary prime-order prime-field short-Weierstrass curves, public and synthetic; toy scale only (q < 2^25).
    - The membership predicate is B0's exactly (m = 5 signed points of the factor base, repetitions and cancelling pairs allowed); G1 must agree with it on every attempt.
    - No uncharged oracle inside the charged path. The exact 5-sum oracle used for yields and agreement checks is a verifier, never part of the attack.
    - Timeouts, watchdog stops and memory checkpoints are infrastructure, never negative mathematical evidence. A charged-work lower bound that already exceeds a threshold is a measured cost floor of G1 as implemented, scoped to that implementation.
    - Index calculus is Class I partial action (IDEA-20260806-c5d183), as in the parent.

  coordinator_prior:
    recorded_before_any_g1_data: true
    statement: >-
      I expect the hypothesis to fail on both counts. The design-time ceiling
      audit (TASK-20261001-768475/ceiling_audit_output.json) shows why: the
      indicator ideal's quotient ring is F_p^(V^5) by the Chinese remainder
      theorem, because g_V splits into distinct linear factors, so a certified
      negative answer generically needs an object of size L^5. Charging one
      unit per grid point, the floor is 1,041-8,438 times T on the six v4
      fixtures; a symmetrised variant would still be 55-229 times T. G1 also
      uses nothing about small x, so interval and random-x factor bases should
      cost the same.
    probabilities:
      arm_M_below_threshold_on_every_20bit_fixture: 0.01
      arm_M_obstruction_persists_on_all_six: 0.95
      arm_M_mixed_or_incomplete: 0.04
      arm_X_favourable: 0.01
      arm_X_unfavourable: 0.39
      arm_X_incomplete_or_inconclusive: 0.60
    why_test_anyway: >-
      The floor is a derivation under a stated heuristic
      (HEUR-ICEX-6ca21f-1), not a theorem about every algorithm. The run
      measures it, checks EV-ICEX-16e3ec's unchecked dominated_by row
      (EXP-ICEX-fa2b37's Groebner membership), and tests the resource check's
      small-x reading with the random-x control. A prior this run overturns is
      the most informative outcome it can produce.

  proof_search_map:
    bottleneck: >-
      Membership units per success M_s versus the threshold
      T = 13*0.886*sqrt(q)/(L+27): the EV-ICEX-16e3ec obstruction quantity
      (50-306 rho references per success for B0).
    baseline_embedding:
      parameter_slice: >-
        The six EXP-ICEX-aaccfc v4 fixtures with the v4 attempt stream replayed
        exactly (namespace 'EXP-ICEX-aaccfc/v2'), so B0 and G1 are compared on
        identical attempts.
      reproduction_check: >-
        (a) G1's membership bit equals RUN-ICEX-0ad4d8's logged bit on every
        completed attempt; (b) the v4 rho code rerun on the six fixtures
        reproduces RUN-ICEX-0ad4d8's rho outputs exactly; (c) B0 membership-only
        units per success recomputed from RUN-ICEX-0ad4d8 per-attempt logs
        reproduce EV-ICEX-16e3ec within rounding. Any failure is a procedure
        defect.
    observation_collision:
      observable: "A membership decision reached without listing candidate tuples."
      distinct_preimage_search: >-
        Collision found before compute. F_p[x1..x5]/<g_V(x_i)> is isomorphic to
        functions on the grid V^5 (CRT: g_V has L distinct roots), so any
        computation in that ring is a change of basis from evaluating f6 at all
        L^5 grid points. A Groebner decision on I_R is therefore observationally
        an enumeration over L^5 points with a basis-change overhead, and the
        interval and random-x factor bases are indistinguishable to it. A
        second collision, the successful-subset loophole of
        AMD-20260926-3479cf, is closed by charging every attempt, members and
        non-members alike.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: G1 = summation polynomial f6 plus grid indicators, lex Buchberger, certified roots (EXP-ICEX-fa2b37 design)
        predicted_gain: >-
          None on interval factor bases. Grid floor A*L^5 is 0.13-4.4 times
          B0's measured units per success and 1,041-8,438 times T on the v4
          fixtures.
      - transform: specialization_pack
        proposed_object: S5-symmetrised indicator ideal (elementary symmetric coordinates), not built in this experiment
        predicted_gain: >-
          Floor A*C(L+4,5), 55-229 times T on the v4 fixtures; cannot change
          the arm-M verdict, so it is recorded and not built.
    quantifier_order: >-
      Fix the fixtures, factor bases, attempt-label namespaces, cost units,
      thresholds and verdict rules (this record and EXP-ICEX-153c34) before any
      G1 computation on a frozen fixture. Then for every fixture f and every
      attempt j of its stream: run G1 on R_j, charge it, and check agreement
      with the exact oracle. Statistics are taken over all attempts of all
      fixtures; no fixture, size, attempt or threshold is chosen after any G1
      cost is seen.
    method_ceiling:
      strongest_certifiable_claim: >-
        Toy tier. G1 as implemented, charged in C-3 units, lies above or below
        T on each of the six v4 fixtures, with its cost relative to B0 on the
        same attempts; and its variable-cost exponent along the frozen-L path at
        16-24 bits with a CI. Never a statement about every non-enumerative
        algorithm, other factor-base rules, or cryptographic sizes.
      nearby_object_control: >-
        Random-x factor base of equal L on the same attempts (G1 should not
        tell them apart); planted-exponent synthetic cost tables; the fixed-setup
        and constant-per-query proves-too-much objects
        (TASK-20261001-768475/power_check_output.json).
    proof_obligations:
      - claim: G1 decides exactly B0's predicate on every attempt
        responsibility: correctness
      - claim: every C-3-charged operation of G1, including failed attempts, Groebner work and per-fixture setup, is counted
        responsibility: runtime
      - claim: the exponent estimator is not flattened by fixed or constant per-query costs
        responsibility: strictness
      - claim: conclusions stay inside the six fixtures, the frozen-L panel and G1 as implemented
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim:
    problem: prime-field ECDLP, index-calculus m = 5 factor-base membership on interval factor bases
    prior_best: Theta(sqrt(q)) group operations, Pollard rho (memory-matched)
    time_exponent: conditional; established gain 0; tested as the slope of ln C_M versus ln q along the frozen-L path
    memory_exponent: charged and reported; established gain 0
    hidden_cofactor: per-fixture setup (summation-polynomial construction and pair-product tensors), constant per-query terms, Groebner blow-up, failed attempts
    claim_kind: exponent_improvement

  heuristic_assumptions:
    - id: HEUR-ICEX-6ca21f-1
      formal_statement: >-
        For every fixture and every non-member attempt R, G1's charged C-3
        cost of deciding R is at least L^5 units, the dimension of the grid
        quotient ring F_p[x1..x5]/<g_V(x_i)>.
      random_model_justification: >-
        By CRT the quotient ring is F_p^(V^5). A certified negative answer
        exhibits a cofactor h with h*f6 = 1 on the grid, i.e. h = 1/f6
        pointwise. If the L^5 values of f6 on the grid behave like independent
        uniform nonzero residues, their interpolant has all L^5 monomial
        coefficients nonzero except with probability about L^5/p, so writing h
        down costs at least L^5 operations. Stated as a heuristic, not a lower
        bound for algorithms that skip the certificate.
      supporting_results: []
      validation_experiment_ids: [EXP-ICEX-153c34]
      falsification_condition: >-
        On any fixture, the median charged G1 cost per completed non-member
        attempt is below L^5 units, with the decision confirmed by the exact
        oracle and certified on the audit subsample.
    - id: HEUR-ICEX-6ca21f-2
      formal_statement: >-
        G1's per-attempt charged cost on an interval factor base equals its
        cost on a random-x factor base of the same L, on the same attempts,
        within a factor 1.25 (median ratio in [0.8, 1.25]).
      random_model_justification: >-
        G1 sees V only through the coefficients of g_V, which are generic
        residues for both decks; nothing in Buchberger's algorithm or root
        extraction uses the size of the roots.
      supporting_results: []
      validation_experiment_ids: [EXP-ICEX-153c34]
      falsification_condition: >-
        Median interval/random-x cost ratio outside [0.8, 1.25] on at least
        four of the six v4 fixtures with completed control attempts. A ratio
        below 0.8 would mean G1 exploits small x and is a lead to record.
    - id: HEUR-ICEX-6ca21f-3
      formal_statement: >-
        Along the frozen-L path, ln C_M is linear in ln q over 16-24 bits with
        a within-size residual SD of at most 0.40.
      random_model_justification: >-
        With L fixed per size and exact yields, the remaining per-fixture
        variation is the curve's yield relative to the multiset model (SD about
        0.13 in log in RUN-ICEX-0ad4d8) and the within-size spread of q; the
        q-and-L fit of RUN-ICEX-0ad4d8 left residual SD 0.095.
      supporting_results: []
      validation_experiment_ids: [EXP-ICEX-153c34]
      falsification_condition: >-
        Realised pooled within-size residual SD above 0.40. The verdict mapping
        is unchanged, but the evidence record must then quote the power at that
        SD from the pre-registered power table instead of the design power.

  structural_ingredients:
    - description: Enumerative B0 membership obstruction and the competitiveness threshold
      citation: EV-ICEX-16e3ec
      provenance: internal
      verified_by: TASK-20261001-768475
      role: bottleneck and comparison baseline
    - description: Groebner summation-polynomial membership backend design (polynomials, indicator ideal, Buchberger, certification, root extraction, signed recovery)
      citation: experiments/EXP-ICEX-fa2b37/specification.yaml
      provenance: internal
      verified_by: TASK-20261001-768475
      role: backend reused by reference with declared deviations
    - description: Summation polynomials describe signed point sums; the resultant construction retains infinity
      citation: Claus Diem, On the discrete logarithm problem in elliptic curves, Compositio Math. 147 (2011), DOI 10.1112/S0010437X10005075
      provenance: retrieved
      verified_by: TASK-20260908-df109a
      role: definition of f_n used by G1 (as read for EXP-ICEX-fa2b37)
    - description: Summation polynomials and small-x factor bases for prime-field index calculus were proposed by Semaev
      citation: I. Semaev, Summation polynomials and the discrete logarithm problem on elliptic curves, IACR ePrint 2004/031
      provenance: recalled
      verified_by: null
      role: pointer only; origin of the small-x factor base
    - description: Algebraic structure in the factor base (rational-map images, subgroups) is what makes Groebner methods useful over prime fields
      citation: C. Petit, M. Kosters, A. Messeng, Algebraic approaches for the elliptic curve discrete logarithm problem over prime fields, PKC 2016
      provenance: recalled
      verified_by: null
      role: pointer only; forward guidance for a structured-factor-base successor
    - description: Symmetrised summation polynomials reduce degree by the symmetric-group action
      citation: J.-C. Faugere, P. Gaudry, L. Huot, G. Renault, Using symmetries in the index calculus for elliptic curves discrete logarithm, J. Cryptology 27 (2014)
      provenance: recalled
      verified_by: null
      role: pointer only; the symmetrised floor A*C(L+4,5)

  reduction_chain:
    core_problem: m = 5 factor-base membership inside index calculus for prime-field ECDLP
    corollaries: []

  predictions:
    - metric: M_s(G1) / T on each v4 fixture (arm M)
      direction: lower
      minimum_effect: upper 95% bound below 1 on every 20-bit fixture
    - metric: between-size slope of ln C_M^var versus ln q, frozen-L panel (arm X)
      direction: lower
      minimum_effect: upper bound below 0.5 under both CI methods, with the component and absolute guards of EXP-ICEX-153c34

  test_boundary:
    instances:
      - EXP-ICEX-aaccfc v4 fixtures b16-s21, b16-s22, b16-s23, b20-s21, b20-s22, b20-s23
      - frozen-L panel, 5 sizes x 4 fresh public synthetic fixtures (rule in EXP-ICEX-153c34)
    parameters:
      m: 5
      factor_base: interval, B = ceil(p^{1/5}); random-x control of equal L
      bits: [16, 18, 20, 22, 24]
      L_star_by_bits: {16: 5, 18: 6, 20: 8, 22: 10, 24: 13}
    implementation: experiments/EXP-ICEX-153c34/implementation/ (to be written by the executor; nothing exists yet)
    budget:
      enforcement: advisory
      maximum_memory_gb: 8
      maximum_runs: 1

  falsification_conditions:
    - Arm M outcome B (M_s lower bound at or above T on all six fixtures) falsifies the first clause for G1 as implemented on these fixtures.
    - Arm X unfavourable verdict (slope lower bound at or above 0.5 under both CI methods) falsifies the second clause for G1 along the frozen-L path at 16-24 bits.
    - Any disagreement between G1 and the exact oracle, or a failed certificate, invalidates the run (procedure defect), never the hypothesis.

  interpretation_limits:
    - Toy tier; q < 2^25.
    - Scoped to G1 as implemented and the interval factor base. A negative result says nothing about structured factor bases, symmetrised ideals, or algorithms that decide without certificates.
    - Approval of the protocol, when it comes, does not assert the hypothesis is true.
    - No ECDLP claim on deployed curves.

