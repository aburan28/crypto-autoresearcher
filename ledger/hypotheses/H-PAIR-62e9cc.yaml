# H-PAIR-62e9cc — specified from IDEA-20261005-78e17d.
# Protocol approval is DEC-20261006-2c3c71. This record asserts no
# exTNFS runtime, no bit level, and no ECDLP exponent change. No
# baby-step giant-step has been run. The design session enumerated the
# ordered splits and checked that z^2 + 1 is irreducible over F_11.
# It did not open the PDFs named by KN-LIT-3743 or KN-LIT-2061.
hypothesis:
  id: H-PAIR-62e9cc
  question_id: RQ-PAIR-f2e31f
  source_proposal: IDEA-20261005-78e17d
  goal_id: null
  goal_id_note: >-
    ledger/questions/RQ-PAIR-f2e31f.yaml does not name a goal_id on the
    head read at design time. This design does not attach one and does
    not edit a goal file.
  status: approved
  status_note: >-
    approved means the measurement protocol in EXP-PAIR-513c28 is
    approved for a later executor. It does not mean the split tuple or
    the logarithm identity is supported. Status moves only by
    DEC-20261006-2c3c71 under the standing user authorization of
    2026-09-06. This design session wrote no run artifact.
  proposed_by: coordinator
  conversion_note: >-
    The five degrees, the acceptance rule gcd(eta, kappa) = 1 with both
    parts at least 2, the field F_121, the target 2, and the equality
    s = 12 t are carried from IDEA-20261005-78e17d. The Coordinator
    added the ordered-pair checksum and the rule that a different tuple,
    or a failed logarithm identity, is a negative.

  statement: >-
    TEST BOUNDARY. Five integers n in {4, 5, 6, 8, 12}, and one field
    F_121 = F_11[z] / (z^2 + 1). An ordered split of n is a pair of
    integers eta, kappa, each at least 2, with eta times kappa equal to
    n. The split is accepted when gcd(eta, kappa) = 1. The logarithm is
    one element g of order 120 and one target, the prime-field element 2.
    No other degree and no other field are in the test.

    PRE-REGISTERED PREDICTION, fixed before any executor run. The
    accepted-split counts, in the order n = 4, 5, 6, 8, 12, are the
    tuple (0, 0, 2, 0, 2). Separately, baby-step giant-step returns an
    exponent s with g^s = 2, an independent checker accepts that power,
    and the discrete log t of 2 in the prime subfield relative to g^12
    satisfies s = 12 t, with s in {0, 1, ..., 119} and t in {0, 1, ..., 9}.
    A different tuple is a negative. A failed logarithm identity is a
    negative. No bit level is stated. No ECDLP exponent is in scope.

    DISTINGUISHABLE OUTCOMES. (1) The tuple is (0, 0, 2, 0, 2), the
    checker accepts g^s = 2, and s = 12 t: the side-condition reading
    and the subgroup relation both hold on these inputs. (2) Any count
    differs from that tuple: the side-condition reading fails. (3) The
    checker rejects the returned power, or no element of order 120 is
    found: the certificate fails. (4) The checker accepts and s is not
    12 t: the logarithm identity fails. (5) The two enumerators disagree,
    or the two power routines disagree: the measurement is unsigned.

  mechanism: >-
    Two explanations of the integer side are separated before the count
    is treated as a yield. Side-condition reading: acceptance is exactly
    gcd(eta, kappa) = 1 on ordered pairs with both parts at least 2, so
    n = 4 is rejected and n = 6 has the two ordered splits (2, 3) and
    (3, 2). Uniform-composite reading: every composite n is accepted,
    which would give n = 4 the count 1. The prime n = 5 is a null with
    no split of two integers at least 2. The field computation is a
    certificate that one discrete log in this quadratic extension
    satisfies the subgroup relation F_11^* = (F_121^*)^12, which is the
    calibration shape named by RQ-PAIR-f2e31f, at a field that is not
    GF(p^12) for a deployed prime. A checker that accepts a wrong power
    is a failed certificate, not a logarithm.
    LOSSY-PROJECTION TEST. The object is the integer n. Operation set
    Sigma is writing n as eta times kappa. The projection keeps the gcd
    bit and discards the polynomials a sieve selector would still have
    to choose. Compatible with Sigma: the gcd is a function of the pair.
    Lossy: many polynomial pairs can sit over one accepted integer split,
    so the count is not a selector's output.

  assumptions:
    - Acceptance is only the integer condition gcd(eta, kappa) = 1 with eta and kappa at least 2. Polynomial quality is not scored. Pairs are ordered.
    - This session listed the accepted pairs. n = 4 has none. n = 5 has none. n = 6 has (2, 3) and (3, 2). n = 8 has none. n = 12 has (3, 4) and (4, 3). The counts are (0, 0, 2, 0, 2). This is a checksum. It is not a recorded run.
    - Squares modulo 11 are {0, 1, 3, 4, 5, 9}. The residue 10 is not among them, so z^2 + 1 is irreducible over F_11 and F_11[z] / (z^2 + 1) has 121 elements. This is instance selection. It is not a discrete logarithm.
    - F_121^* is cyclic of order 120. The image of the 12th-power map is the unique subgroup of order 10, which is F_11^*. The equality s = 12 t is unchecked until the certificate runs.
    - No deployed prime and no relation matrix is built. No formula from the unread PDFs is used. KN-LIT-3743 and KN-LIT-2061 were opened as markdown notes only.

  proof_search_map:
    bottleneck: >-
      The integer side condition gcd(eta, kappa) = 1, together with one
      checked equality s = 12 t. Removing the gcd bit is what would make
      n = 4 look accepted. Polynomial selection, sieving, and linear
      algebra are outside this measurement. This session did not run
      baby-step giant-step.
    baseline_embedding:
      parameter_slice: >-
        The opened abstract of KN-LIT-3743 names gcd(eta, kappa) = 1 and
        the degrees 6 and 12. The opened abstract of KN-LIT-2061 says the
        method does not work when n is a composite prime power. Neither
        states the five counts or a logarithm in F_121.
      reproduction_check: >-
        Re-list the ordered pairs for n in {4, 5, 6, 8, 12} and compare
        with the checksum above. Agreement of the counts with
        (0, 0, 2, 0, 2) is the integer half. It is not a sieve.
    observation_collision:
      observable: >-
        The accepted-split count, and separately the checked equality
        s = 12 t for the target 2.
      distinct_preimage_search: >-
        n = 4 and n = 8 are distinct and are predicted to share the
        count 0. That collision is intended: the gcd bit does not
        separate those two prime powers. n = 6 and n = 12 share the
        count 2. The element 1 is a different target: both of its
        logarithms are 0, so it must not be substituted for 2.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The five named degrees, then one logarithm in F_121.
        predicted_gain: >-
          The tuple (0, 0, 2, 0, 2) and one verified equality s = 12 t.
          No asymptotic gain.
    quantifier_order: >-
      For all n in {4, 5, 6, 8, 12}, the accepted count equals the
      number of ordered pairs with both parts at least 2 and gcd 1.
      The pairs depend on n. Separately, there exists a generator g of
      this one field such that the logarithms of this one target satisfy
      s = 12 t. Neither quantifier ranges over deployed primes. Swapping
      those quantifiers would claim a theorem this hypothesis refuses.
    method_ceiling:
      strongest_certifiable_claim: >-
        The split tuple under this reading of the abstracts, and one
        independently checked discrete log in F_121. Nothing about a
        pairing-friendly prime and nothing about an ECDLP exponent.
      nearby_object_control: >-
        n = 5 and n = 8 must score 0. The uniform-composite reading,
        which would score n = 4 as 1, is the nearby rule on which the
        conclusion "every composite is accepted" is predicted false
        under the gcd rule. The element 1 must not be the target.
    proof_obligations:
      - claim: The five split counts match (0, 0, 2, 0, 2).
        responsibility: baseline
      - claim: The checker accepts g^s = 2 and s = 12 t.
        responsibility: correctness
      - claim: No bit level and no ECDLP exponent is inferred.
        responsibility: scope
    not_applicable_reason: >-
      The map above audits a toy count and one certificate. It is not
      a proof of an exTNFS runtime.

  rerandomization: >-
    This hypothesis does not use a re-randomizing walk. The census is
    five named integers and one named target. No discrete log is pulled
    back to an elliptic curve.

  asymptotic_claim:
    problem: >-
      Whether the accepted ordered splits of five named integers are
      (0, 0, 2, 0, 2), and whether one discrete log in F_121 satisfies
      s = 12 t. The ECDLP is not claimed to be easier.
    prior_best: >-
      No ECDLP algorithm is improved. The opened notes state a gcd side
      condition and a prime-power exclusion. They do not state this tuple
      or this equality.
    time_exponent: unchanged
    memory_exponent: unchanged
    hidden_cofactor: >-
      No algorithmic o(1) term is claimed. The split census is a handful
      of divisions. The logarithm is baby-step giant-step on a group of
      order 120.
    claim_kind_note: >-
      No exponent improvement, cofactor improvement, or constant-factor
      improvement is claimed, so none of those three labels is applied.

  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        For every n in {4, 5, 6, 8, 12}, the number of ordered pairs of
        integers at least 2 whose product is n and whose gcd is 1 equals
        the corresponding entry of (0, 0, 2, 0, 2). This imitates the
        characteristic function of coprime factorizations named by the
        opened abstracts, which separate n = 6 and n = 12 from composite
        prime powers. The census is these five integers. No density
        statement for large n is claimed. There is no random model.
      random_model_justification: >-
        There is no random model. Nothing is asserted to behave like a
        uniform random integer of a given size. The support is the
        Euclidean algorithm on the ordered pairs of these five integers.
      supporting_results:
        - ref: KN-LIT-3743
          provenance: internal
          claim: >-
            The markdown note says exTNFS applies to F_{p^{eta kappa}}
            whenever gcd(eta, kappa) = 1, and that on the practical side
            it can be used for n = 6 and n = 12. It does not list the
            five counts. Those counts are the prediction, not a quoted
            theorem.
          verified_by: >-
            Design session 2026-10-06, which opened
            knowledge/literature/KN-LIT-3743.md and did not open
            downloads/98140523.pdf.
        - ref: KN-LIT-2061
          provenance: internal
          claim: >-
            The markdown note says the Kim-Barbulescu method does not
            work when n is a composite prime power. It gives no split
            count for n = 4 or n = 8.
          verified_by: >-
            Design session 2026-10-06, which opened
            knowledge/literature/KN-LIT-2061.md and did not open
            downloads/10031172.pdf.
      validation_experiment_ids:
        - EXP-PAIR-513c28
      falsification_condition: >-
        Any entry of the count tuple differs from (0, 0, 2, 0, 2). One
        mismatched row falsifies HEUR-1 under this reading. No second
        range of n is authorized.
    - id: HEUR-2
      formal_statement: >-
        For one generator g of F_121^* and the target 2, the discrete
        log s in the group of order 120 and the discrete log t of 2
        against g^12 satisfy s = 12 t as integers in the ranges above.
        This imitates the subgroup relation (F_{q^2}^*)^{q+1} = F_q^*
        at q = 11, where q + 1 = 12. One target is checked. No smoothness
        distribution and no transfer to degree 12 are claimed.
      random_model_justification: >-
        There is no random model. F_121^* is cyclic of order 120, and
        the unique subgroup of order 10 is the image of the 12th-power
        map. The equality is one certificate, not a sample from a
        distribution.
      supporting_results:
        - ref: KR-RHO-46c2c6
          provenance: internal
          claim: >-
            The row says L discrete logs reused across distinguished
            points cost about the square root of 2 L n in total, rather
            than L times the square root of n. This hypothesis computes
            one log, so that multi-target bound is not used and is not
            support for s = 12 t.
          verified_by: >-
            Design session 2026-10-06, which opened
            knowledge/frontiers/ecdlp/generic-rho/KR-RHO-46c2c6.yaml.
      validation_experiment_ids:
        - EXP-PAIR-513c28
      falsification_condition: >-
        The checker rejects the returned power, no element of order 120
        is found in the exhaustive scan, or the checker accepts and
        s is not 12 t. Any of those falsifies HEUR-2 at this field. No
        second extension degree.

  structural_ingredients:
    - description: >-
        Title-and-abstract markdown note for exTNFS. States the gcd side
        condition and the practical degrees 6 and 12. States neither the
        five counts nor a logarithm in F_121. The local PDF was not opened.
      citation: KN-LIT-3743
      provenance: internal
      verified_by: knowledge/literature/KN-LIT-3743.md
      role: source of the side condition being counted
    - description: >-
        Title-and-abstract markdown note. States that the method does not
        work when n is a composite prime power. States no split count.
        The local PDF was not opened.
      citation: KN-LIT-2061
      provenance: internal
      verified_by: knowledge/literature/KN-LIT-2061.md
      role: source of the prime-power exclusion used as a null
    - description: >-
        Multi-target discrete logarithms cost about the square root of
        2 L n rather than L times the square root of n. This measurement
        computes one log and does not use that bound.
      citation: KR-RHO-46c2c6
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-46c2c6.yaml
      role: frontier row positioned against, and not used
    - description: >-
        Recalled pointer, not opened, for the paper whose abstract
        KN-LIT-3743 relays. Not support for the five counts.
      citation: Kim-Barbulescu CRYPTO 2016
      provenance: recalled
      verified_by: null
      role: pointer to the unread paper

  reduction_chain:
    core_problem: >-
      Whether the accepted ordered-split counts on five named integers
      are (0, 0, 2, 0, 2), and whether one logarithm in F_121 satisfies
      s = 12 t.
    corollaries: []
    corollaries_note: >-
      No published reduction is invoked. Five counts and one equality do
      not cascade to an ECDLP corollary or a bit level.

  predictions:
    - metric: accepted ordered splits at n = 4, 5, 6, 8, 12
      direction: different
      minimum_effect: the tuple (0, 0, 2, 0, 2)
    - metric: absolute difference between the checker exponent s and 12 times the subfield exponent t of the target 2
      direction: lower
      minimum_effect: 0

  test_boundary:
    instances:
      - n in {4, 5, 6, 8, 12}
      - F_121 = F_11[z] / (z^2 + 1)
      - target 2 in the prime field
    parameters:
      predicted_tuple: [0, 0, 2, 0, 2]
      degree_order: [4, 5, 6, 8, 12]
      checksum_pairs:
        n4: []
        n5: []
        n6: [[2, 3], [3, 2]]
        n8: []
        n12: [[3, 4], [4, 3]]
      field_polynomial: z^2 + 1
      group_order: 120
      subfield_exponent: 12
    implementation: >-
      Enumerate ordered splits in two independent loops. Search for a
      generator in a fixed order, run baby-step giant-step for the target
      2, recompute the power in a second routine, and test s = 12 t. Do
      not emit a bit level.
    budget:
      enforcement: advisory
      maximum_runs: 1
      note: >-
        One census and one logarithm. Time and memory watches live on
        the experiment contract. They are advisory.

  falsification_conditions:
    - The count tuple is not (0, 0, 2, 0, 2).
    - splits at n = 5 or at n = 8 is positive.
    - The checker rejects the returned power, or the exhaustive scan finds no element of order 120.
    - The checker accepts and s is not 12 t.
    - The writeup states a bit level, a deployed-prime cost, or an ECDLP exponent improvement.

  interpretation_limits:
    - The split count is the integer side condition in the opened abstracts. It is not a polynomial-selection run and not an exTNFS cost.
    - F_121 is not GF(p^12) at a pairing prime. No transfer to BLS12-381 or BN254 is claimed.
    - Not an attack claim. No ECDLP exponent is in scope.
    - The design-session enumeration is a checksum. It is not a recorded run of baby-step giant-step.
    - The multi-target bound in KR-RHO-46c2c6 is not a result of this measurement.

