      verified_by: knowledge/literature/KN-LIT-3743.md
    - ref: KN-LIT-2061
      provenance: internal
      claim: >-
        The note states that the method does not work for a composite
        prime power. It states no split count. The PDF was not opened.
      verified_by: knowledge/literature/KN-LIT-2061.md
    - ref: KR-RHO-46c2c6
      provenance: internal
      claim: >-
        L discrete logs reused across distinguished points cost about the
        square root of 2 L n, rather than L times the square root of n.
        This hypothesis computes one log.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-46c2c6.yaml
    - ref: Kim-Barbulescu CRYPTO 2016
      provenance: recalled
      claim: >-
        Recalled pointer, not opened, for the paper whose abstract
