  title: >-
    16 exceeds 8 by 8
  statement: >-
    A window of width 5 stores 16 entries. A window of width 4
    stores 8. Two to the power 4 is 16. Two to the power 3 is 8.
    Sixteen exceeds eight by 8. The product of the two table sizes
    is 128. Their sum is 24. Two width-4 tables each store 8, so
    that gap is 0 and their product is 64.
  mechanism: >-
    The proposal writes the widths 5 and 4 and the sizes 16 and 8.
    This contract checks those integers. It does not add a curve
    point.
  assumptions: []
  proof_search_map:
    bottleneck: The table-size gap 8.
    baseline_embedding:
      parameter_slice: >-
        The widths 5 and 4 and the sizes 16 and 8 in
        IDEA-20261003-18748d, read 2026-10-03. The powers, the
        product, and the sum were recomputed in this design
        session. That computation is not a run.
      reproduction_check: >-
        One route computes 2 to the power 4. The other computes 2
        to the power 3. They must agree that the sizes are 16 and 8.
    observation_collision:
      observable: The table-size gap 8 and the product 128.
      distinct_preimage_search: >-
        Reporting both tables as size 8 drops the gap. Two width-4
        tables make that gap 0.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The sizes 16 and 8.
        predicted_gain: Integer gap. No curve addition.
    quantifier_order: >-
      The size 16 comes first, then the size 8, then the nearby
      gap 0.
    method_ceiling:
      strongest_certifiable_claim: >-
        The table sizes 16 and 8. Not a scalar multiplication.
      nearby_object_control: >-
        Two width-4 tables. Both store 8, and the gap is 0.
    proof_obligations:
