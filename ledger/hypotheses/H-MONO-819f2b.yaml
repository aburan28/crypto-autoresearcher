hypothesis:
  id: H-MONO-819f2b
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  goal_status_note: >-
    GOAL-MONO-001 is `paused` (campaign budget exhausted). This record makes
    NO relation-rate claim and no curve-specific claim; it is a pure
    instrument-power question about the Chebotarev-style cycle-type census
    this session's three sibling records (H-MONO-0b3def, H-MONO-0f9170,
    H-MONO-59f6a6) already used and validated. Approved and executed under
    the identical standalone-experiment precedent already established for
    those three (see EXP-MONO-a20e48's own `coordinator_approval_rationale`;
    the same reasoning applies here, not repeated in full). Creating this
    record does not reopen or resume GOAL-MONO-001.
  source_proposal: IDEA-20260815-711932
  status: proposed
  proposed_by: idea-generator

  conversion_note: >-
    Schema conversion of an already-complete proposal (added 2026-08-15,
    before this session's three MONO experiments existed). All mathematical
    content (the census-convergence claim, the three-group battery design,
    the two null controls, the required real-curve validation) is the
    idea-generator's. The Coordinator's own judgment, disclosed here, is
    confined to: (1) RESOLVING THE PROPOSAL'S "PRIMES" LANGUAGE AGAINST WHAT
    THIS LANE'S ACTUAL PROTOCOL SAMPLES (see `test_boundary` — the archived
    census protocol samples independent base POINTS at one fixed prime, or
    independent coefficient DRAWS, never independent PRIMES; "primes needed"
    is reinterpreted as "independent census draws needed", the resource the
    real protocol actually spends); (2) selecting three concrete, named
    degree-4 permutation groups that instantiate the proposal's abstract
    "full symmetric / proper transitive / imprimitive" triple — S_4 (full),
    A_4 (proper, transitive, PRIMITIVE), D_4 (proper, transitive,
    IMPRIMITIVE) — chosen because two of the three already have committed,
    independently-reviewed real census data in this session's own archive
    (EXP-MONO-a20e48's N1 for D_4, exhaustive; N3 for S_4, sampled),
    satisfying the proposal's own required real-curve validation at
    essentially zero additional compute; (3) the concrete test statistic and
    stopping rule (a likelihood-ratio classifier on the exact multinomial
    cycle-type distribution, Neyman-Pearson optimal for this discrimination
    problem) instantiating the proposal's "at a stated confidence"; and (4)
    concrete numeric budgets (alpha=0.05, target power 0.99, Monte Carlo
    trial counts). No hypothesis or experiment status beyond `proposed` /
    `review_required` is authorized by this record (AGENTS.md rule 1).

  statement: >-
    TEST BOUNDARY, STATED FIRST. This is an INSTRUMENT-POWER hypothesis, not
    a hypothesis about any curve's monodromy: it claims that the number of
    independent census draws this lane's protocol has actually used
    (exhaustive enumeration for D_4-type members; S=2,000-10,000 sampled
    draws for full-symmetric-type members) is at or above the number needed
    to distinguish a full symmetric monodromy group from a proper transitive
    subgroup at a stated statistical confidence — and that an identical-group
    null never produces a spurious separation. It is tested by simulation on
    three named, small, exactly-known degree-4 permutation groups (S_4, A_4,
    D_4), cross-validated against two pieces of already-archived real census
    data (EXP-MONO-a20e48's N1 and N3), and makes no claim about any other
    group, degree, or curve.

    THE OBLIGATION (from IDEA-20260815-711932, restated). A Chebotarev-style
    census estimates a monodromy group from the empirical frequency of
    cycle types across independent draws. Convergence to the true
    frequencies is asymptotic; over a finite budget of draws, a census can
    in principle report a group name that is really sampling noise. No
    record in this lane has previously measured how many draws its own
    protocol needs before a verdict is statistically supportable, as
    distinct from having enough draws to survive a coupon-collector
    completeness argument (which HEUR-AG-2 in H-MONO-59f6a6 already
    addresses for EXHAUSTIVE / near-exhaustive census members, and which
    this record does not re-litigate).

    SCOPE NOTE ON WHAT THIS DOES AND DOES NOT COVER, relative to this
    session's own prior work. H-MONO-0b3def, H-MONO-0f9170, and (for its
    exact-closure members N1/N2/N2-twin/N4) H-MONO-59f6a6 all rest on
    EXHAUSTIVE or near-exhaustive enumeration, or on an existence-proof-grade
    closure argument, for which both prior independent reviewers already
    established (EXP-MONO-a20e48's reviews) that ordinary sampling risk is
    not the operative uncertainty at all — a genuinely smaller group
    deterministically caps closure below the structural bound regardless of
    sample size. THIS RECORD DOES NOT REVISIT THAT FINDING. It targets
    instead the one census style in this lane that IS a genuine statistical
    frequency estimate with real sampling risk: the Chebotarev
    density-comparison used by H-MONO-59f6a6's N3/N5 members (a sampled
    cycle-type histogram compared against a known law, with no fixed
    labelled fibre for a closure computation to act on). It asks: is
    S=2,000-10,000 draws enough to distinguish "the true group is S_4" from
    "the true group is secretly a proper subgroup" at a stated confidence?

  mechanism: >-
    DERIVED in IDEA-20260815-711932; carried over in substance, with the
    reinterpretation and battery choice above.

    STEP 1 (exact ground-truth distributions, ALL IN ONE COMMON OUTCOME
    SPACE — S_4's own 5-way cycle type on 4 points: identity, transposition,
    double-transposition, 3-cycle, 4-cycle — so the three groups' laws are
    directly comparable; no simulation needed for any of the three). S_4
    (order 24), by direct enumeration of all 24 permutations of 4 points and
    cycle-decomposing each: identity 1/24, transposition 6/24,
    double-transposition 3/24, 3-cycle 8/24, 4-cycle 6/24 (matches the
    Chebotarev law H-MONO-59f6a6's N3 already used). A_4 (order 12, the
    proper transitive PRIMITIVE case), by direct enumeration of its 12 even
    permutations: identity 1/12, double-transposition 3/12, 3-cycle 8/12,
    and — the discriminating fact, confirmed by enumeration not assumed —
    NO transposition and NO 4-cycle ever occur, since A_4 contains only
    even permutations. D_4 (order 8, the proper transitive IMPRIMITIVE
    case, exactly N1's group): NOT computed from D_4's own internal
    conjugacy-class labels (identity/sigma_i/sigma1_sigma2/
    block_swap_involution/four_cycle — a D_4-specific, finer partition that
    does not correspond one-to-one with S_4 cycle type, since one of D_4's
    own reflection classes and its central rotation both realize the SAME
    S_4 cycle type, double-transposition) and NOT from the abstract
    |class|/|G| formula either (see `confounders` — this lane's actual
    base-point census does not sample D_4's Haar measure directly, so that
    formula does not describe this instrument's real behaviour). INSTEAD:
    the Executor reads the RAW PERMUTATION TUPLES directly from
    EXP-MONO-a20e48/EXP-MONO-4c7479's already-archived per-point logs (the
    `perm` field, e.g. `(1,0,3,2)`, already used by this session's
    reviewers), cycle-decomposes each tuple mechanically (a fixed,
    unambiguous operation on any permutation of 4 labelled points,
    requiring no group-theoretic derivation), and tabulates the resulting
    S_4-cycle-type frequencies exhaustively over the full 44,521-point
    census. Because this reuses an EXHAUSTIVE, already-independently-
    reviewed census, the resulting D_4-in-S_4-cycle-type law has zero
    sampling error of its own; it is exact ground truth, not an estimate.

    STEP 2 (the discrimination test). For a competing pair (S_4 vs A_4;
    S_4 vs D_4), construct the Neyman-Pearson-optimal likelihood-ratio
    statistic on N i.i.d. cycle-type draws: LR(data) = product over draws
    of P_sub(cycle_type)/P_full(cycle_type). Calibrate a rejection threshold
    from N i.i.d. draws simulated under P_full so the false-positive rate
    (rejecting "it's S_4" when it truly is S_4) is at most alpha=0.05.
    Measure power (the fraction of N-draw sequences simulated under P_sub
    that cross that threshold) via Monte Carlo (20,000 trials per candidate
    N). Report, for each pair, the smallest N (searched by doubling then
    bisection over a grid) at which measured power >= 0.99.

    STEP 3 (null controls, exactly as the proposal specifies). NULL 1
    (identical-group false positive): run the identical Step-2 procedure
    with P_sub = P_full (S_4 vs a second independent S_4 draw stream) at
    several N; a nonzero apparent "power" here is a genuine false-positive
    problem with the test construction itself, not a finding about any
    group. NULL 2 (same-group variance bound): report the empirical
    false-positive rate at the calibrated threshold across N in
    {100, 1,000, 10,000, 44,521} to bound the test's own variance,
    independent of any group-separation claim.

    STEP 4 (real-data validation, REQUIRED by HEUR-MONO-CONV-1, satisfied at
    zero new compute — two distinct checks). (4a) BOOTSTRAP CROSS-CHECK OF
    THE SIMULATION MODEL ITSELF: since D_4's ground-truth law (Step 1) is
    already derived from N1's full 44,521-point exhaustive data, validate
    HEUR-MONO-CONV-1 by RESAMPLING (with replacement) sub-samples of size N
    directly from those same 44,521 real, already-cycle-decomposed data
    points — not from a synthetic i.i.d. generator — and comparing the
    resulting empirical power curve (does the real data's own finite-sample
    behaviour match the synthetic Monte Carlo simulation's predicted power
    at the same N) at every N tested in Step 2's search. Agreement confirms
    the i.i.d. simulation model captures whatever correlation structure the
    real point-parametrized census actually has; disagreement is exactly
    HEUR-MONO-CONV-1's falsification condition. (4b) REAL SAMPLE-SIZE
    CLASSIFICATION: run the identical calibrated LR statistic directly on
    N3's REAL, GENUINELY SAMPLED (not exhaustive) S=2,000 cycle-type
    histogram (both runs, both pairwise tests: vs the A_4 law and vs the
    D_4-derived law) and report whether it classifies correctly as S_4 —
    this is the concrete answer to whether N3's actual historical sample
    size was enough. Also run it on N1's own exhaustive 44,521-point data
    (both pairwise tests) as a sanity check that it classifies as D_4, not
    S_4 or A_4.

    STEP 5 (verdict discipline). Report, per pair (S_4-vs-A_4,
    S_4-vs-D_4): N_required (the simulation's answer), the two real archived
    sample sizes' classification outcome under the identical statistic, and
    whether N_required <= the real protocol's actual sample size at that
    census member (10,000 for N3/N5-style members; effectively unbounded
    for exhaustive members). Never report a single N_required figure across
    both pairs — the proposal's own `confounders` names group-pair
    specificity as real, and `predictions` explicitly forecasts the
    imprimitive pair (S_4 vs D_4) needs MORE draws than the primitive pair
    (S_4 vs A_4), since D_4 shares more cycle types with S_4 (all five of
    D_4's classes are also present in S_4, differing only in relative
    frequency; A_4 categorically excludes two of S_4's five classes,
    letting a single observed transposition or 4-cycle immediately falsify
    "it's A_4").

  assumptions:
    - >-
      The census statistic modeled is cycle type under i.i.d. draws from a
      fixed finite permutation group on 4 points — an exact, finite
      combinatorial object requiring no field arithmetic, curve
      construction, or external library.
    - >-
      "Independent draws" in this record means whatever resource this
      lane's actual protocol spends per census member: independent base
      points at one fixed prime (D_4-type members) or independent
      coefficient draws (S_4/A_4-type members) — never independent primes,
      correcting the source proposal's literal "primes" language to match
      the real protocol (disclosed in `conversion_note`).
    - >-
      D_4's ground-truth cycle-type distribution is taken from this
      session's own exhaustive, independently-reviewed real census
      (EXP-MONO-a20e48/EXP-MONO-4c7479), not from the abstract |class|/|G|
      Chebotarev formula, because the two are confirmed to differ for this
      lane's actual point-parametrized census (see `confounders`).
    - >-
      A_4's cycle-type distribution is exact standard quartic Galois theory
      (RECALLED, NOT FETCHED): A_4 contains only even permutations, so a
      degree-4 A_4-cover's Frobenius never realizes a transposition or a
      4-cycle. This requires no simulation to establish and is checked at
      Stage 0 before any Monte Carlo run.

  proof_search_map:
    bottleneck: >-
      Whether this lane's already-spent census budget (exhaustive for
      exact-closure members; S=2,000-10,000 for Chebotarev-density
      members) is provably sufficient, or merely assumed sufficient, to
      support the group verdicts already recorded in H-MONO-0b3def and
      H-MONO-59f6a6's N3.
    baseline_embedding:
      parameter_slice: >-
        The real archived D_4 (N1, exhaustive) and S_4 (N3, S=2,000)
        histograms are an exact parameter slice of this record's own
        simulated battery, reused verbatim rather than re-measured.
      reproduction_check: >-
        Step 4's real-data classification must be internally consistent
        with the already-committed EXP-MONO-a20e48 execution_report before
        any N_required comparison is interpreted; a mismatch voids the
        comparison and is reported as `failed_infrastructure`.
    observation_collision:
      observable: >-
        The number of i.i.d. cycle-type draws needed for a calibrated
        likelihood-ratio test to reach 99% power at 5% false-positive rate,
        as a function of which proper subgroup is being distinguished from
        S_4.
      distinct_preimage_search: >-
        FOUND: D_4 and A_4 are both proper, transitive, order <= 12
        subgroups of S_4, yet the proposal predicts materially different
        N_required for the two (imprimitive D_4 harder to separate than
        primitive A_4) BECAUSE their cycle-type SUPPORT differs (A_4
        categorically excludes two of S_4's five classes; D_4's support
        equals S_4's support, differing only in relative frequency). The
        battery contains both cases so this is tested, not asserted.
      applies_to: S_4-vs-A_4 versus S_4-vs-D_4, the record's decisive pair.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The exact multinomial likelihood-ratio statistic on the full
          cycle-type vector, replacing a single summary count (e.g. "was a
          4-cycle ever seen").
        predicted_gain: >-
          Neyman-Pearson optimal for this exact discrimination problem
          given the true distributions are fully known in simulation,
          giving the smallest possible N_required rather than an
          upper-bound estimate from a weaker test.
    quantifier_order: >-
      FOR the two named group pairs (S_4-vs-A_4, S_4-vs-D_4), THERE EXISTS
      an N_required <= a stated Monte Carlo search ceiling (100,000 draws)
      such that the calibrated LR test reaches 99% power at 5%
      false-positive rate; this record reports N_required for both pairs
      and compares each against the real protocol's actual spend at the
      corresponding census member type. Bounded and falsifiable: failure to
      find such an N by the search ceiling is reported as-is, not
      extrapolated.
    method_ceiling:
      strongest_certifiable_claim: >-
        For a census whose candidate groups' EXACT cycle-type distributions
        are known in advance (true here by construction, since the
        candidate groups are named and small), this record certifies
        whether the real protocol's actual sample size clears the
        simulation-measured power requirement. NOT certifiable: anything
        about a census where the candidate groups are not enumerable in
        advance, or about any group outside the tested triple.
      nearby_object_control: >-
        NULL 1 (identical-group false positive) is the nearby-object
        control: a test that ever "separates" a group from an
        independent draw of itself has a broken test construction,
        regardless of how well it performs on the real pairs.
    proof_obligations:
      - claim: >-
          A_4's cycle-type support on 4 points excludes transpositions and
          4-cycles.
        responsibility: correctness
      - claim: >-
          The identical-group null (NULL 1) shows no separation at any
          tested N, at the calibrated alpha.
        responsibility: strictness
      - claim: >-
          N_required(S_4-vs-D_4) > N_required(S_4-vs-A_4), i.e. the
          imprimitive pair needs strictly more draws.
        responsibility: baseline
      - claim: >-
          The real archived N1 (44,521 draws, D_4) and N3 (2,000 draws,
          S_4) data classify correctly under the identical calibrated
          statistic.
        responsibility: feasibility

  heuristic_assumptions:
    - id: HEUR-MONO-CONV-1
      formal_statement: >-
        Simulated cycle-type sampling on the three named known-monodromy
        groups (S_4, A_4, D_4) reproduces the statistical behaviour of this
        lane's actual Frobenius/coefficient census on real curves.
      rigorous_support: >-
        RECALLED, NOT FETCHED, from the source proposal. Rigorous
        ingredient: for the sampled-coefficient members (N3/N5-style), the
        cycle-type frequencies ARE i.i.d. draws from the group's action by
        construction (independent random polynomials); for the
        point-parametrized members (N1-style), the frequencies are exactly
        measured (exhaustive), not estimated, sidestepping the asymptotic
        convergence question entirely for that member. THE GAP: whether the
        i.i.d. simulation model matches the ACTUAL correlation structure of
        independent-coefficient sampling at finite p is not independently
        re-derived here; the real-data cross-check (Step 4) is what makes
        the model's applicability checkable rather than assumed.
      supporting_results: []
      validation_experiment_ids: [EXP-MONO-715694]
      validation_scope_note: >-
        Tested by Step 4a (bootstrap resampling from N1's real 44,521-point
        data compared against the synthetic Monte Carlo power curve at
        matched N) and Step 4b (running the identical calibrated statistic
        directly on N3's and N1's real archived sample sizes).
      falsification_condition: >-
        EITHER (4a) the bootstrap-resampled empirical power curve from
        N1's real data disagrees materially with the synthetic i.i.d.
        Monte Carlo simulation's predicted power at the same N, OR (4b)
        the real archived data (N1 at 44,521 draws, N3 at 2,000 draws)
        fails to classify correctly under the calibrated statistic at its
        real sample size, or classifies correctly at a sample size the
        simulation predicts should be insufficient (or vice versa) — any
        of these means the i.i.d. simulation does not model the real
        protocol's sampling behaviour.

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. NO ECDLP CLAIM, no speedup, no exponent, in either
    direction. This is a power analysis of a census instrument, not a
    result about any curve or field. sota_delta is zero on every attack
    axis.

  structural_ingredients:
    - description: >-
        Exact cycle-type enumeration for a finite permutation group acting
        on a small set (here: S_4, A_4, D_4 on 4 points).
      citation: Standard finite group theory / Burnside's lemma folklore.
      provenance: recalled
      verified_by: null
      role: Supplies the three exact ground-truth distributions (Step 1).
    - description: >-
        The Neyman-Pearson lemma: the likelihood-ratio test is the
        uniformly most powerful test for a simple-vs-simple hypothesis at a
        given significance level.
      citation: Neyman & Pearson (1933); standard statistics.
      provenance: recalled
      verified_by: null
      role: Justifies Step 2's test construction as the tightest possible
        N_required, not merely a sufficient one.

  reduction_chain:
    core_problem: >-
      Determine whether this lane's already-spent census budget is
      sufficient, by a stated statistical standard, to support the group
      verdicts its Chebotarev-density members (N3/N5-style) report.
    corollaries:
      - problem: >-
          Whether any OTHER Chebotarev-density census in this program
          (outside this lane) should adopt the same power-check discipline
          before interpreting a verdict.
        reduction_ref: >-
          Not derived here as a general theorem; tested on one lane's own
          protocol and two named group pairs. A positive result supports,
          but does not prove, that the check generalises.
        asymptotics_preserved: not_applicable
    corollaries_note: >-
      Deliberately excludes: any claim about exact-closure census members
      (N1/N2/N2-twin/N4-style), which both prior independent reviewers
      already established are existence-proof-grade and not subject to
      this kind of sampling risk; any claim about any group outside the
      tested triple; any status change to any other record (Coordinator
      authority alone, AGENTS.md rule 1).

  predictions:
    - metric: identical-group null (NULL 1) apparent separation rate
      direction: different
      minimum_effect: >-
        FORCED AT alpha (0.05), NOT ABOVE. Any materially higher apparent
        separation rate is a false-positive problem in the test
        construction itself, voiding the record.
    - metric: N_required(S_4 vs A_4), the primitive proper-subgroup pair
      direction: lower
      minimum_effect: >-
        Predicted SMALL (low tens to low hundreds of draws), since A_4
        categorically excludes two of S_4's five cycle types.
    - metric: N_required(S_4 vs D_4), the imprimitive proper-subgroup pair
      direction: higher
      minimum_effect: >-
        Predicted STRICTLY LARGER than N_required(S_4 vs A_4), since D_4's
        cycle-type support equals S_4's support (differs only in relative
        frequency, never in which classes can appear).
    - metric: >-
        real archived N1 (44,521 draws) classification under the
        calibrated S_4-vs-D_4 statistic
      direction: same
      minimum_effect: >-
        Classifies correctly as D_4 (the real, already-independently-
        confirmed answer). A misclassification here is a serious finding
        about either this record's statistic or the archived data, escalate
        per `falsification_conditions`.
    - metric: >-
        real archived N3 (2,000-draw, both runs) classification under the
        calibrated S_4-vs-A_4 and S_4-vs-D_4 statistics
      direction: same
      minimum_effect: >-
        Classifies correctly as S_4 under both pairwise tests (N3 is a
        genuine, uncontested S_4 object; it must not be mistaken for either
        proper subgroup).

  test_boundary:
    instances:
      - "Three named groups only: S_4, A_4, D_4, acting on 4 points. No other group or degree."
      - "Two named group pairs only: S_4-vs-A_4, S_4-vs-D_4. Not A_4-vs-D_4 (out of scope; neither is the census's actual null hypothesis)."
      - "Stage 0: zero-compute exact cycle-type tables for all three groups, hand-verified before any simulation."
      - "Stage 1: NULL 1 and NULL 2 controls."
      - "Stage 2: the main N_required search, both pairs, Monte Carlo power estimation."
      - "Stage 3: the real-data cross-check (Step 4), reading already-archived EXP-MONO-a20e48/EXP-MONO-4c7479 artifacts."
    parameters:
      degree: 4
      groups: [S_4, A_4, D_4]
      alpha: 0.05
      target_power: 0.99
      monte_carlo_trials_per_candidate_N: 20000
      search_ceiling_N: 100000
    implementation: >-
      Pure Python 3 stdlib only (`random`, `math`, `itertools`); no
      external statistics library. Cycle-type enumeration is exact
      (finite group, brute-force over all group elements representable as
      permutations of 4 points — at most 24 elements, trivial). The
      Monte Carlo search is a doubling-then-bisection search over N.
    budget: >-
      See the frozen experiment contract for exact numbers. Pure
      combinatorics/statistics simulation plus reading two already-archived
      JSON files; no field arithmetic, no curve construction, negligible
      compute (source proposal's own `estimated_cost`: implementation low,
      compute low).

  falsification_conditions:
    - >-
      NULL 1 (identical-group false positive) yields an apparent
      separation rate materially above the calibrated alpha at any tested
      N. The test construction has a false-positive problem and every
      N_required figure in this record is suspect.
    - >-
      The real archived N1 exhaustive D_4 data classifies as anything other
      than D_4 under the calibrated statistic. Either this record's
      statistic is unsound or the archived data (already independently
      reviewed twice) has a problem neither prior review caught — either
      reading requires escalation before any status change, per AGENTS.md
      rule 12.
    - >-
      The real archived N3 sampled S_4 data classifies as a proper subgroup
      under either pairwise test. Same escalation as above.
    - >-
      N_required(S_4 vs D_4) is NOT strictly greater than N_required(S_4 vs
      A_4). The record's own central prediction (imprimitive harder to
      detect than primitive) is falsified; reported as such, not
      rationalized away.
    - >-
      The real protocol's actual sample size at a census member's type
      (10,000 for N3/N5-style; exhaustive for N1-style) falls below the
      corresponding measured N_required. The lane's past Chebotarev-density
      verdicts (N3/N5 in H-MONO-59f6a6) are under-powered and must be
      re-labelled; this does NOT retroactively change H-MONO-59f6a6's
      status (Coordinator authority, a fresh decision would be required)
      but is reported as the record's own headline finding if it occurs.
    - >-
      The real protocol's actual sample size suffices at both tested
      pairs. The census is adequately powered for the tested group pairs
      and this record retires the worry cheaply, exactly as the source
      proposal names as one of its own possible outcomes.

  confounders:
    - >-
      SAMPLING MISMATCH (PRIMES VS DRAWS), NAMED AND RESOLVED IN
      `conversion_note`. The source proposal's literal "primes" language
      does not match what this lane's real protocol samples (independent
      points or coefficient draws at one fixed prime, never independent
      primes); reinterpreted throughout, disclosed rather than silently
      substituted.
    - >-
      GROUP-PAIR SPECIFICITY. A single N_required figure would be
      misleading; results are reported per pair, as the source proposal's
      own `confounders` already required.
    - >-
      D_4's REAL CENSUS FREQUENCIES ARE NOT THE NAIVE |class|/|G| FORMULA.
      This lane's point-parametrized census does not sample D_4's Haar
      measure directly (confirmed by comparing EXP-MONO-a20e48's measured
      N1 frequencies against the abstract conjugacy-class-size formula,
      which do not match exactly — see `mechanism` Step 1). Using the REAL
      measured frequencies as ground truth, not the formula, is the
      methodologically correct choice for a record whose entire point is to
      validate THIS lane's actual instrument; using the formula instead
      would test a different, hypothetical census this lane does not run.
    - >-
      TOY SCALE, SMALL DEGREE. Degree 4 only, three specific groups only.
      Nothing here extrapolates to any other degree, group, or census
      design.

  interpretation_limits:
    - >-
      CLAIM TIER toy. Simulation-only content plus a real-data cross-check;
      the Neyman-Pearson optimality result is RECALLED external mathematics
      and must be cited as recalled, never as independently re-proven here.
    - >-
