# H-ECDLP-7bd5f5
# Low-bit branching of addition mod 17. Not a k-tree.
# Approval: DEC-20261001-9549fe.
hypothesis:
  id: H-ECDLP-7bd5f5
  question_id: RQ-ECDLP-bc7a54
  source_idea: IDEA-20260920-a5757d
  experiment_id: EXP-ECDLP-95f69f
  specified_at: '2026-10-01'
  status: approved
  proposed_by: idea-generator
  approved_by_decision: DEC-20261001-9549fe
  title: >-
    Addition modulo 17, reduced mod 4, has image size 2 on every low-bit
    pair, while addition modulo 4 has image size 1.
  statement: >-
    Let low(x) = x mod 4. For every pair of residues (u, v) in 0..3, the
    set of low((a+b) mod 17) over a, b in 0..16 with low(a)=u and low(b)=v
    has size 2. There are 136 pairs (a, b) where this value differs from
    (low(a)+low(b)) mod 4. For addition modulo 4 itself, every such set
    has size 1 and there are 0 mismatches.
  mechanism: >-
    Reduction modulo 4 after addition modulo a prime is not a function of
    the two reduced inputs alone, because of carries and the modulus. The
    same reduction of addition modulo 4 is a homomorphism. This is a toy
    of the proposal's rebuttal that a low-bit rule need not be a group
    homomorphism. It is not a k-tree and not a curve.
  assumptions: []
  proof_search_map:
    bottleneck: Enumerating all 289 pairs modulo 17 and all 16 pairs modulo 4.
    baseline_embedding:
      parameter_slice: >-
        Claim (A) of IDEA-20260920-a5757d, read 2026-10-01. A design-time
        count gave image size 2 and 136 mismatches. It is not a run.
      reproduction_check: >-
        One loop orders a then b. The other orders b then a. The image sets
        must agree.
    observation_collision:
      observable: Image sizes and homomorphism-mismatch counts.
      distinct_preimage_search: >-
        The mod-4 addition is the homomorphism control. Reporting image
        size 2 there invalidates the run.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: Z/17Z and Z/4Z with reduction mod 4.
        predicted_gain: A branching count. No attack cost.
    quantifier_order: >-
      For every one of the 16 residue pairs, the mod-17 image has size 2
      and the mod-4 image has size 1.
    method_ceiling:
      strongest_certifiable_claim: >-
        These two moduli and this bit width. Not Wagner's algorithm and
        not a prime-order elliptic curve.
      nearby_object_control: >-
        Addition modulo 4. It is a homomorphism, so every image has size 1.
    proof_obligations:
      - claim: All 16 mod-17 images have size 2.
        responsibility: correctness
      - claim: There are 136 homomorphism mismatches mod 17.
        responsibility: correctness
      - claim: All 16 mod-4 images have size 1.
        responsibility: scope
    not_applicable_reason: null
