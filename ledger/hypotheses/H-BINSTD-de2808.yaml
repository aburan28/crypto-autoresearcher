  title: >-
    On the composite ambient group of ECC2K-130 every exactly sum-compatible
    filter has alphabet in 1, 2, 4, so the exact capacity is 2 bits (subject to
    PO-1 and to the primary source's primality statement for l); the ideal
    k-list tree, which would need about 25.8 bits (target-subgroup ambient) or
    26.2 bits (full-group ambient) of alphabet per internal level at k = 16, is
    therefore a CEILING of the k-list column and not a reachable cost; and the
    approximate capacity of the declared Koblitz-specific arms is measurable on
    an admissible three-cell ladder against a measured random-label null,
    their own histogram-preserving shuffles, and exact positive controls read
    at their declared sample sizes.

  statement: >-
    Let E be a binary Koblitz curve and G a finite abelian group written
    additively. Call h from G onto an alphabet of size M EXACTLY SUM-COMPATIBLE
    if there is a combining rule f with h(P + Q) = f(h(P), h(Q)) for all P, Q
    in G and f invertible in each argument.

    (A) CAPACITY CERTIFICATE, unconditional subject to PO-1. Theorem C of
    KN-FIND-ffe1df re-run on an arbitrary finite abelian group: invertibility
    of f in each argument makes f a quasigroup operation, associativity of
    addition on G forces f associative, an associative quasigroup is a group,
    hence h is a surjective group homomorphism onto a group of order M, and
    Lagrange gives M dividing the order of G. The extension from prime order to
    composite order is PROOF OBLIGATION PO-1 of this hypothesis, re-derived
    step by step by the version-1 validator and confirmed exhaustively on six
    small composite groups (DEC-20260928-9d9c47 J1), and is not assumed.
    Consequence on ECC2K-130, whose ambient group order is 4l with l the
    129-bit prime 680564733841876926932320129493409985129 AS STATED BY THE
    PRIMARY SOURCE (Bailey et al. Appendix A, read at source; l is
    probable-prime tested by two version-1 reviews and NOT proved here): the
    divisors of 4l are 1, 2, 4, l, 2l, 4l, so every alphabet strictly below l
    lies in 1, 2, 4 and the exact capacity of the ambient group below l is
    2 bits. AMBIENT: the FULL group of order 4l. On the target subgroup of
    order l the capacity is 0 bits. The certificate is committed as code that
    works from a factorisation and never from primality (CODE-CERT), with
    three control readings as pass criteria.

    (B) THE TWO NONTRIVIAL EXACT FILTERS, CONSTRUCTED (carried). The order-2
    filter is E onto E/2E, P maps to Tr(x(P)) + Tr(a), RE-DERIVED FROM THE
    GROUP LAW (Q in 2E exactly when Tr(x(Q)) = Tr(a); verified exhaustively at
    n = 13 and 17 by the version-1 red team). The order-4 filter is E onto
    E/4E, cyclic of order 4 whenever the 2-Sylow subgroup is, CONSTRUCTED as a
    homomorphism onto Z/4 by scalar multiplication; design finding DF-1
    (the trace pair is a presentation on 2E only) is carried. Design finding
    DF-6 adds its halving presentation on all of E, b0 + 2 b1 with b0 = h2(P)
    and b1 the trace bit of a half of P - b0 g4, equal to the constructed map
    whenever Tr(a) = 0; it is used only to evaluate composites, after a gate
    check shows the two maps equal.

    (C) THE CEILING, EXPLICITLY COUNTERFACTUAL, IN NAMED AMBIENTS. Under the
    ideal k-list model (k = 2^j lists of size L = N^(1/(j + 1)), per-attempt
    cost k L, B = L, relations B or B/262, linear algebra k R^2), the table's
    declared ambient is the target subgroup, N = l. At k = 16 an ideal tree
    would need an alphabet of about 2^25.80 at each of three internal levels.
    IN THE TARGET-SUBGROUP AMBIENT the exact capacity is 0 bits, the per-level
    gap is 25.80 bits and, at that capacity, the same tree costs about
    2^107.20 per attempt. IN THE FULL-GROUP AMBIENT (N = 4l) the tree would
    need about 2^26.20, the capacity is 2 bits, the gap is 24.20 bits and the
    closure line is about 2^102.80 per attempt. The version-1 figures (23.80
    and 2^101.20), which mixed the two ambients, are withdrawn (R-9). The
    ideal-tree totals of the table are the CEILING of the k-list column,
    CONDITIONAL ON A FILTER THAT (A) EXCLUDES EXACTLY, and are not a cost this
    or any construction reaches. Nothing in this hypothesis predicts or
    asserts any reachable cost below matched rho on ECC2K-130 or on any other
    curve, and the experiment's outcome table states no such cell. Any reading
    of a lead is pre-registered to review-breakthrough at max and to
    independent replication before interpretation.

    (D) THE ONE OPEN NUMBER, WHICH THE EXPERIMENT MEASURES. For a cheap
    NON-homomorphic filter the level-1 bucket gain is G(h) = M times the
    maximum over (a, b, c) of Pr[h(P + Q) = c given h(P) = a and h(Q) = b],
    estimated from S = 2^ceil(log2(128 M^2)) sampled pairs per (cell, M).
    PREDICTION, stated so it can fail: on the admissible Koblitz ladder
    n in 13, 19, 23 (at M = N^(1/3) and N^(1/4), N = l) and at the fixed
    alphabet M = 16 on n in 13, 19, 23, 41, every declared arm reads NEG - no
    controlled excess, meaning that its excess over its own
    histogram-preserving shuffle never reaches three widths of the measured
    random-label null with the shuffle rank at its floor - while the exact
    controls read exactly 2, 4, 548 and 956 and every declared alphabet on
    Z/2^17, and the log-interval key on Z/lZ is read and reaches the lead
    signature. An arm meeting clauses L1, L2 and L3 of the experiment's SR-4
    is the LEAD branch and is routed, not interpreted.

  statement_note: >-
    DC-B1 (R-12): the record's 2^24.7 relations at k = 8 with orbit unknowns is
    0.4834 bit above the recomputation 2^24.2166 under the record's own model;
    THE DIAGNOSIS OF THE RECORD'S SLIP IS LEFT OPEN here, the version-1
    validator having found it reproduced exactly by an ambient mix inside the
    record (L = (4l)^(1/4) for the relation count, the per-attempt cost kept at
    N = l), which is recorded as the more plausible reading; the version-1
    sentence attributing it to a division by about 188 is withdrawn by
    supersession. DC-B2 and DC-B3 are carried unchanged (arithmetic, not
    relabelling). The proposal is NOT edited.

  mechanism: >-
    OBJECT FRAME (carried). Representation R1 of RQ-ECDLP-623a32: the
    x-coordinate of a point of the FULL group E(F_2^n), read in a normal basis
    where Frobenius is a cyclic shift and in the polynomial basis. Operation
    set Sigma: pairwise addition of list elements at ONE merge level of a
    k-list tree, with Frobenius and negation. The legs and intermediate sums
    live in E, whose translation block systems are the cosets of 2E and 4E
    (IDEA-20260922-153a90, cited by id).

    TRICHOTOMY (carried). The exact filters are Class I partial-action objects:
    homomorphisms of E whose entire content is the 2-bit block system of (A).
    Every non-homomorphic candidate is Class II BRANCHING, and G(h) is the
    branching meter read at one level, b = M / G.

    WHY THE INSTRUMENT CAN NOW READ WHAT IT ASSERTS (version 2). The version-1
    instrument could not: its shuffle was an alphabet relabelling under which
    G is exactly invariant, its null allowance was the scale of a bucket
    average applied to a maximum statistic, its sample sizes left the
    composite control and the N^(1/3) arms unreadable, and its ladder had two
    admissible cells. In version 2, (i) the shuffle reassigns labels across
    points, preserving every bucket's size and destroying every arithmetic
    relation, and is pinned by gate checks it can fail (an exact control must
    collapse, a planted marginal-only filter must survive); (ii) the null is
    the measured distribution of 200 independent random labels on the same
    pairs and code path, per (cell, M); (iii) S is set so every conditioning
    cell holds about 128 pairs, which makes the composite alphabets 548 and 956
    and every declared alphabet on Z/2^17 readable exactly; (iv) the ladder is
    three admissible cells; (v) the decision clauses compare each arm with its
    own shuffle and the measured null, and their slope clause standardises a
    shuffle-subtracted excess so occupancy growth of a maximum statistic
    cannot pass as non-decay; and (vi) the rules as coded must classify a
    known approximate filter (the log-interval key on the Z/l ladder) as LEAD
    and a random label as NEG before any Koblitz arm is read.

    WHY A NULL READING WOULD BE ADMISSIBLE AT ALL. The same instrument must
    read forced non-null values on nearby objects: the composite n = 17 cell
    (alphabets 548 and 956, exactly), Z/2^17 (every declared alphabet,
    exactly), and Z/lZ with the log-interval key (about M/2, and the LEAD
    signature). An instrument that cannot see those cannot assert absence on
    the prime-l cells, and a NEG reading asserts absence only above the stated
    resolving floor.

    THE CEILING IS NOT A MECHANISM. (C) prices what a filter WOULD be worth. It
    proposes no construction.

  assumptions:
    - >-
      The ECC2K-130 ambient group order is 4l with l prime as the primary source
      states, and the 2-Sylow subgroup is cyclic of order 4 (E(F_2) is cyclic of
      order 4; version-1 validator C-J1-4). The certificate needs only the
      divisor set of 4l, and that set rests on the source's primality statement.
    - >-
      The ideal k-list accounting of (C) assumes independent uniformly random
      lists and a filter with G = M at every internal level; it is the IDEAL
      bound, used only to state the ceiling and the HEUR-B2 thresholds, and is
      conditional on a filter that (A) excludes exactly.
    - >-
      OFF-LIMITS COMPONENT DECLARED: F2, factor-base decomposition, is the
      family. The k-list tree is a join strategy for its decomposition step,
      not a new factor base, so KN-OPEN-020 is engaged only through the
      orbit-union base of the ceiling's with-orbit line. F1 is not used.
    - >-
      Arithmetic only at deployed parameters. Every executable cell has n at
      most 41 and every ladder cell n at most 23. No k-tree run at deployed
      parameters, no target-dependent family, no level above 1, and no
      IDEA-20260926-d3c5a5 engine.
    - >-
      NO BUDGET QUANTITY IS USED. None of D1 (2^-4.41), D2 (2^+5.71) or D3
      (2^+11.01) of CORR-20260928-4cb669 is used and no per-attempt oracle
      budget is asserted; under that correction's pricing rule a per-attempt
      comparator, were one ever needed, would be D3 and never D1. The only
      reference quantity is matched rho.
    - >-
      Matched rho on ECC2K-130 is 2^60.8090 = sqrt(pi l / (4 x 131)) under
      CORR-20260922-81aeab. AMBIENT: the target subgroup of order l. A reference
      for the ceiling and HEUR-B2 threshold lines only.

  proof_search_map:
    bottleneck: >-
      The level-1 bucket gain G(h) of cheap filters on E(F_2^n) for a binary
      Koblitz curve at the alphabets of rule R-M, read against a measured null
      and the filter's own shuffle. Every other quantity of the k-list route is
      fixed by (A) and (C). Decision-changing because the k-list column is a
      prose closure by Theorem C and either outcome replaces it with a quantity
      scoped to the declared arms and tested cells.
    baseline_embedding:
      parameter_slice: >-
        Four slices, each now a blocking control with committed code. (i)
        Z/2^17 with h the low log2(M) bits, Wagner's own setting: exact at every
        declared alphabet (PC-1). (ii) Z/lZ with the log-interval key i ->
        floor(i M / l): approximate, G about M/2, and the LEAD signature along
        the Z/l ladder (PC-7, PC-16). (iii) The composite n = 17 Koblitz cell,
        order 4 x 137 x 239: exact filters of alphabet 548 and 956 (PC-5). (iv)
        The certificate on 4l, 2^17 and 130972 (PC-CERT-1 to PC-CERT-3).
      reproduction_check: >-
        SYMBOLIC plus a FROZEN FIXTURE: the seven code blocks of the audit
        sheet, extractable by one pinned method with pinned reference sha256,
        pass criteria stated before execution and placed in the experiment's
        SR-1 and IR-1 to IR-19.
    observation_collision:
      observable: >-
        Per (cell, arm, M, seed): G(h), its excess over the measured null and
        over its own histogram-preserving shuffle, and the standardised excess
        along the ladder n in 13, 19, 23.
      distinct_preimage_search: >-
        Five collisions, each separated by a control or clause with code (audit
        sheet audit_2): OC-1, a genuine approximate homomorphism against a
        skewed-marginal filter (the popcount false positive of KN-FIND-ffe1df
        RT-EXP-1), separated by the histogram-preserving shuffle, which PC-6a
        and PC-6b pin; OC-2, a low G against a sparse table, separated by rule
        R-S, IR-12, PC-2 and PC-9; OC-3, an approximate filter against a
        secretly exact one, separated by the certificate, SR-6 and the
        stratified F5 null; OC-4, an instrument that sees capacity against a
        blind one, separated by PC-1, PC-5, PC-7 and PC-16; OC-5, a non-decaying
        excess against the occupancy growth of a maximum statistic, separated by
        clause L2's shuffle-subtracted standardised excess and PC-15.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The k-list tree's filter requirement rewritten as a subgroup-index
          condition on the ambient group. Encoding exact; completeness and
          soundness inherited from the argument under PO-1; transfer to any
          finite abelian group; cost loss none. Now also code (CODE-CERT).
        predicted_gain: >-
          The exact-capacity cell of the k-list column for ECC2K-130 reads
          2 bits from the cofactor (0 bits on the target subgroup), with the
          ideal-tree table as the column's ceiling. Zero compute.
      - transform: observable_fiber
        proposed_object: >-
          Hold G(h) fixed and vary the forgotten structure: the prime-order
          target subgroup (G at most 1 plus the null for every cheap h,
          predicted), the composite ambient group of order 4l (G = 2 and 4
          exactly), the composite toy cell at n = 17 (alphabets 548 and 956
          exactly), and Z/lZ (the key about M/2). The invariant distinguishing
          the fibre is the subgroup lattice.
        predicted_gain: >-
          It makes a NEG reading on the prime-l cells admissible, because the
          same instrument reads forced non-null values on the nearby objects.
    quantifier_order: >-
      (A) FOR ALL finite abelian groups G and FOR ALL h from G onto an alphabet
      of size M admitting a combining rule f with h(P + Q) = f(h(P), h(Q)) for
      all P, Q and f invertible in each argument: M divides the order of G and
      h is a group homomorphism. HENCE on ECC2K-130 every alphabet strictly
      below l lies in 1, 2, 4. (D) FOR THE TESTED cells and THE DECLARED arms
      ONLY, at level 1 only, above the resolving floor at the declared S: every
      arm reads NEG. NOT CLAIMED: undeclared filters; target-dependent filters
      (the widest open class); levels above 1; excesses below the resolving
      floor; any cost reachable on any deployed curve.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On ECC2K-130 every exactly sum-compatible filter has alphabet at most
        4 (subject to PO-1 and the source's primality statement for l); and on
        toy Koblitz cells at n in 13, 19, 23 (and at M = 16 to n = 41) the
        declared arms show no controlled excess above the stated resolving
        floor, with the exact controls read exactly at 2, 4, 548, 956 and every
        declared alphabet on Z/2^17, and the log-interval key read and reaching
        the LEAD signature." It can NEVER certify that no cheap filter exists,
        nothing about levels above 1 or the algebraic route, and nothing about
        any deployed curve's cost or security.
      nearby_object_control: >-
        The composite n = 17 cell, Z/2^17, the Z/l key ladder, the ordinary
        n = 19 cell and the held-out random label, all blocking controls of the
        experiment.
    proof_obligations:
      - claim: PO-1. Theorem C's quasigroup argument holds verbatim on a composite-order finite abelian group, giving M dividing the group order and h a homomorphism; its own obligation, not inherited from KN-FIND-ffe1df.
        responsibility: correctness
      - claim: PO-2. The halving criterion Tr(x(Q)) = Tr(a) for membership in 2E, re-derived from the group law, and P to Tr(x(P)) + Tr(a) a surjective homomorphism onto E/2E when the 2-Sylow subgroup is non-trivial.
        responsibility: correctness
      - claim: >-
          PO-3. E/4E is cyclic of order 4 when the 2-Sylow subgroup is; the
          constructed map onto Z/4 is a surjective homomorphism; the trace pair
          is its presentation on 2E (DF-1); and the halving presentation b0 +
          2 b1 equals it on all of E when Tr(a) = 0 (DF-6), checked by PC-4b.
        responsibility: correctness
      - claim: PO-4. The ideal k-list arithmetic of (C) at k in 4, 8, 16, 32 with and without orbit unknowns, the gap and closure lines in both named ambients, and the HEUR-B2 thresholds, under the stated model.
        responsibility: baseline
      - claim: PO-5. The (C3) floor l C_3 / (2B), 2^101.00 C_3 at B = 2^27, and the (C4) plain two-list join floor 2^62.48 per relation (carried).
        responsibility: runtime
      - claim: >-
          PO-6. G(h) is estimated with the stated S, ten enumerated seeds,
          ten histogram-preserving shuffles per seed and a measured null of
          200 independent random-label draws per (cell, M), never with a
          percentile bootstrap of a maximum statistic.
        responsibility: correctness
      - claim: PO-7. Every cell's group order, the primality of its l, and the cyclicity of its 2-Sylow subgroup (where formed) are recomputed and proved at setup by the route of its kind; the design-time orders are inputs, never results.
        responsibility: baseline
      - claim: PO-8. The exact capacity, the ceiling and the measurement are three separable quantities with named ambients, and nothing here bounds undeclared filters, the algebraic oracle, levels above 1, or any deployed curve's cost or security.
        responsibility: scope
      - claim: PO-9. Interface. The ceiling of (C) is conditional on a filter that (A) excludes exactly, and no interface converts it into a reachable cost; discharged by the outcome table containing no such cell.
        responsibility: interface
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim:
    problem: ECDLP on ECC2K-130 by a filtered k-list decomposition oracle
    prior_best: >-
      Matched rho 2^60.8090 with negation and the 131-fold Frobenius class
      (CORR-20260922-81aeab; KN-FIND-aa2efc as scoped by CORR-20260928-4cb669).
