  test_boundary:
    instances:
      - >-
        LADDER: the a = 0 Koblitz curves at n = 13 (order 8012 = 4 x 2003), n = 19
        (523492 = 4 x 130873; the PRIMARY cell, over t^19 + t^5 + t^2 + t + 1)
        and n = 23 (8383412 = 4 x 2095853), each AR-B1-admissible, with
        alphabets 16 and 8, 64 and 16, 128 and 32 (rule R-M, N = l).
      - FIXED ALPHABET. M = 16 on the three ladder cells and on n = 41 (order 2199025563772 = 4 x 549756390943).
      - COMPOSITE-ORDER CONTROL. The a = 0 Koblitz curve at n = 17, order 130972 = 4 x 137 x 239, alphabets 548 and 956.
      - ORDINARY-CURVE CONTROL. The n = 19 RQ-CERTBIN-836ce2 cell, A = 46693, B = 306147, order 523646 = 2 x 261823, alphabets 64 and 16.
      - CALIBRATION CELL. RC-1, n = 17, t^17 + t^3 + 1, A = 97044, B = 126251, order 130412 = 4 x 32603.
      - GENERIC CONTROLS. Z/lZ at l = 2003, 130873, 2095853 (the key, relabelled windows, planted mixtures) and Z/2^17 (the exact low-bits grid).
      - DEPLOYED ROW, ARITHMETIC ONLY. ECC2K-130 enters as the certificate, the ceiling table and the HEUR-B2 thresholds. No run touches it.
    parameters:
      alphabets: rule R-M, M = 2^floor(log2(l)/p + 1/2), p in 3, 4, per cell; fixed alphabets named; the table in audit sheet stage_0.sample_table
      samples: rule R-S, S = 2^ceil(log2(128 M^2)) per (cell, M); 2^26 and 2^27 at 548 and 956
      null: 20 independent random labels per seed, 200 per (cell, M)
      shuffle: histogram-preserving across points, 10 per (cell, arm, M, seed); stratified by h4 for F5
      seeds: enumerated 0 to 9; derived seeds by crc32 of recorded labels
      min_cell: 100 pairs per conditioning cell
      levels: level 1 only
      ceiling_table: k in 4, 8, 16, 32, with and without orbit unknowns, target-subgroup ambient; gap and closure in both ambients
    implementation: >-
      The seven code blocks of the audit sheet, pure Python 3.8 or later,
      standard library only, with pinned reference sha256, extracted by one
      pinned method. No solver, no decomposition engine, no network.
    budget:
      enforcement: advisory
      wall_clock_seconds_per_run: 259200
      maximum_memory_gb: 4
      maximum_runs: 16
      note: Advisory machine-protection ceilings under docs/research-budget-policy.md; about 59 CPU-hours estimated (audit sheet stage_0.cost_table). Zero runs exist.

  falsification_conditions:
    - >-
      An exactly sum-compatible filter on a prime-l Koblitz cell with alphabet
      strictly between 4 and l, exhibited with its combining rule verified
      exhaustively. That refutes (A); this hypothesis is withdrawn; it would
      also contradict KN-FIND-ffe1df's argument, so it routes to
      review-breakthrough at max (AGENTS.md rule 12).
    - A certificate control reading fails (PC-CERT). A code defect; row CERT is void until repaired.
    - An exact control (h2, h4, 548, 956, the Z/2^17 grid) fails to read exactly M at its declared S. Instrument defect; nothing on the affected cell, alphabet or run is read.
    - >-
      A declared arm meets the LEAD threshold of EXP-BINSTD-6f1e66 SR-4 (L1, L2
      and L3). The null prediction of (D) is falsified on the tested range; the
      route is live and is ROUTED to review-breakthrough at max and to
      independent replication before any interpretation. The most valuable
      outcome; no cost consequence is stated for it.
    - >-
      CODE-S0 disagrees with the frozen Stage 0 figures beyond the stated
      tolerances. An arithmetic error in this design or in the script,
      corrected by a new record before any use.
    - HEUR-B1 or HEUR-B2 meets its own falsification_condition. Each heuristic is refuted only through its own condition.
  falsification_note: >-
    An instrument failure, a failed exact control, a failed calibration row, a
    dropped cell, a not-estimated arm, a timeout, a crash or an unreachable
    source invalidates the affected arm and is NEVER evidence against this
    hypothesis, however often a deterministic defect replicates (AGENTS.md
    core rule 5).

  interpretation_limits:
    - Specified, not approved. No run exists. Approval is solely the act of DEC-20260929-8c3cb2 naming EXP-BINSTD-6f1e66.
    - >-
      NO ATTACK AND NO SPEEDUP. The hypothesis certifies a capacity, records a
      ceiling, and measures a control. Its expected outcome is a record of the
      k-list column FOR THE DECLARED ARMS AND TESTED CELLS with a measured
      obstruction.
    - >-
      THE CEILING IS COUNTERFACTUAL. Every ideal-tree total is conditional on a
      filter that (A) excludes exactly; the gap and closure lines are stated in
      named ambients. No sentence of this record or of its experiment asserts a
      cost below matched rho on ECC2K-130 or on any curve.
    - >-
      THE ORBIT-UNKNOWNS LINE IS CONDITIONAL, THREE TIMES OVER: on the filter
      the certificate excludes, on the per-orbit unit NO APPROVED CONTRACT HAS
      FIXED (CORR-20260925-649e25), and on a trade class its dependency
      KN-FIND-47da4e declines to price, that record not being a promoted
      finding. The WITHOUT-ORBIT line is the unconditional one of the pair,
      under the first condition.
    - >-
      RESOLVING FLOOR. A NEG reading means an arm's controlled excess lies below
      about three measured null widths at the declared S (design estimates of
      the smallest registrable G about 2.8 to 8.8 across M = 8 to 128, the
      measured floor the planted-mixture rho), never that G = 1.
    - >-
      Levels above 1 are not measured. Target-dependent filters are out of the
      family and are the widest open class. The declared arm list is
      incomplete by construction.
    - >-
      Toy tier: ladder at n at most 23, fixed alphabet to n = 41. A NEG at these
      n is not a NEG at n = 131; the transfer is HEUR-B2, a heuristic and never
      a bound, whose consequent is quantitative and whose N^(1/3) arm has no
      random-model justification even conditionally.
    - The primality of l is the primary source's statement; the certificate's divisor set of 4l rests on it.
    - >-
      This hypothesis asserts nothing about any curve's security, about whether
      index calculus beats rho on any curve, about any oracle meeting any
      budget, or about the AUXIN, FROB or QSP work of this program. It uses no
      D1, D2 or D3 quantity.
    - >-
      FORWARD GUIDANCE regardless of outcome (carried): the k-list objects NOT
      priced here are filters that read the discrete logarithm (closed by
      definition), target-dependent filters, and algebraic joins that are not
      rectangle covers, the last being the chained Semaev system, which is the
      SEMBIN questions'.

