  heuristic_assumptions:
    - id: HEUR-B1
      short_name: uniform sums
      formal_statement: >-
        Carried unchanged. For lists L_1 and L_2 of distinct elements of
        E(F_2^131) drawn without structure, the number of ordered pairs (S, T) in
        L_1 x L_2 whose sum lies in a fixed set of 262 targets is distributed as
        Binomial(|L_1| x |L_2|, 262 / 2^131) to first order, uniformly in |L_1|
        and |L_2| below 2^40. The mean is exact; the Binomial SHAPE is the
        heuristic content.
      random_model_justification: >-
        An occupancy count for independent uniform draws into 2^131 cells of
        which 262 are marked. The mean is exact by double counting, so the model
        is asked only for the shape of the fluctuation.
      supporting_results:
        - ref: KN-FIND-007
          provenance: internal
          claim: >-
            Yield conservation, the exact mean identity, applied to pair sums: the
            sum over all targets of the number of ordered pairs summing to the
            target is |L_1| |L_2| exactly, fixing the mean.
          verified_by: TASK-20260929-291567 (statement and consequences read); version-1 validator C-J2-16 found the relay adequate
        - ref: classical balls-in-bins occupancy law
          provenance: recalled
          claim: For independent uniform draws the count in a fixed rare set is asymptotically Poisson-Binomial with the stated mean. A pointer, not support.
          verified_by: null
      validation_experiment_ids: [EXP-BINSTD-6f1e66]
      validation_plan: >-
        Carried. SAMPLE: on CELL-K19, 200 independent list pairs at |L_1| =
        |L_2| = 2^8, by DIRECT PAIR-SUM COUNTING, against 262 fixed targets drawn
        as uniform points under a recorded seed. No engine is used. PREDICTED
        DISTRIBUTION: Binomial(2^16, 262 / N_E) at the cell's verified order
        N_E, stated before the run. COMPARISON: chi-squared of the count
        histogram against that Binomial, with its degrees of freedom. TAIL CHECK:
        the maximum count over the 200 pairs against the Binomial upper tail.
        TRANSFER: none beyond the tested n; the floor arithmetic at n = 131 uses
        the exact mean only.
      falsification_condition: >-
        The chi-squared statistic exceeds its 99th percentile on the tested cell
        with the instrument's gate passing, or the maximum count sits above the
        Binomial upper tail at probability below 0.01. Either refutes HEUR-B1 on
        the tested cell and puts the (C4) floor's shape, not its mean, in
        question.
    - id: HEUR-B2
      short_name: decay transfer
      formal_statement: >-
        Let F be a declared arm. PREMISE P(F): EXP-BINSTD-6f1e66 classifies F
        NEG, that is, F shows no controlled excess (clause L3) at any estimated
        (cell, M) of the ladder n in 13, 19, 23 at M = N^(1/3) and N^(1/4)
        (N = l), nor at the fixed alphabet M = 16 on n in 13, 19, 23, 41.
        CONSEQUENT Q(F), QUANTITATIVE (R-11): at n = 131, for k in 16 and 32,
        the level-1 gain of F at the alphabet L_k = l^(1/(j + 1)) of the k-tree
        satisfies G_131(F, L_k) <= l^(c_k), with c_16 = 0.1866 (log2 G at most
        24.0768) and c_32 = 0.1418 (log2 G at most 18.2978) on the
        without-orbit line, and c_8 = 0.2448, c_16 = 0.1658 and c_32 = 0.1263
        on the doubly conditional with-orbit line. These are the largest gains
        at which the ideal k-tree of the ceiling model, run with that gain at
        each internal level, keeps its total at or above matched rho (audit
        sheet stage_0.heur_b2_thresholds); the binding named exponent is c* =
        0.1418 (k = 32, without orbit), so an arm whose G_131 exceeded l^0.1418
        at L_32 would falsify Q. For k = 4, and k = 8 without orbit, the tree
        stays above matched rho at every G <= M and Q is vacuous there, which is
        stated rather than hidden. G_131 includes any exact component of the arm
        (F5 carries the 2 bits of h4). THIS IS A HEURISTIC OF TRANSFER, NEVER A
        BOUND: over about 108 bits of log2 l from the ladder (at most 21.0) and
        about 90 bits from the fixed-alphabet reading (39.0), and over the
        alphabet exponent (measured at 1/3, 1/4 and at fixed M = 16; applied at
        1/5 and 1/6).
      random_model_justification: >-
        The model is square-root cancellation of character sums along the
        curve, as in KN-FIND-ffe1df's Theorem A-prime for x-based interval and
        bit-window filters on prime-field curves, which bounds the level-1
        agreement by 1/M plus a Weil-type term, conditional on that line's
        H1-prime, which the finding records as largely untraced. TWO LIMITS,
        RECORDED (R-11). First, THEOREM A-PRIME BOUNDS THE BUCKET-AVERAGED
        AGREEMENT delta AND NOT G: G is M times the maximum over (c, d) of
        pi_c(d), and max_c pi_c is at least delta, so a bound on delta bounds a
        lower bound on G; KN-FIND-ffe1df records exactly this as the hole that
        withdrew its own headline. Second, THE REPAIRED single-bucket bound,
        speedup = M pi_c <= 1 + M^2 Lambda_W, reaches p^(o(1)) ONLY FOR M AT
        MOST p^(1/4) (N^(1/4) here). So the N^(1/4) arm has at most a
        conditional justification by analogy (prime field, no binary-field
        analogue cited), and THE N^(1/3) ARM HAS NO RANDOM-MODEL JUSTIFICATION
        EVEN CONDITIONALLY. HEUR-B2 is the weakest link of this hypothesis and
        is measured rather than assumed.
      supporting_results:
        - ref: KN-FIND-ffe1df
          provenance: internal
          claim: >-
            Theorem A-prime at level 1 (for the averaged agreement, conditional,
            prime field); the bucket-gain statistic; the averaged-versus-maximum
            record and the M <= p^(1/4) reach of its repair; RT-EXP-1, where every
            cheap filter tested on E(F_p) decayed with the SHA null at M = N^(1/3)
            and popcount and digit-sum were false positives reproduced by the
            matched-marginal shuffle.
          verified_by: TASK-20260929-291567 (finding read, lines 1 to 340)
        - ref: square-root cancellation of character sums on a curve of genus 1 (the classical statement imitated)
          provenance: recalled
          claim: RECALLED, NOT RETRIEVED. Names the classical law the model imitates; supports nothing on its own; no binary-field instance is claimed.
          verified_by: null
      validation_experiment_ids: [EXP-BINSTD-6f1e66]
      validation_plan: >-
        RESTATED FOR THE LADDER THAT EXISTS (R-4). SAMPLE: the three-cell
        AR-B1-admissible ladder CELL-K13, CELL-K19, CELL-K23 at N^(1/3) and
        N^(1/4), and the fixed-alphabet reading at M = 16 on CELL-K13,
        CELL-K19, CELL-K23 and CELL-K41, per declared arm, ten seeds each.
        PREDICTED DISTRIBUTION: the measured null of the same (cell, M) (200
        independent random-label draws) and the arm's own ten
        histogram-preserving shuffles per seed are the prediction; no closed
        form is asserted. COMPARISON: clauses L1 and L3 per (cell, M), and L2,
        the ten per-seed OLS slopes of Z = (G minus the shuffle median) / W
        against log2 l over the three ladder cells with the interval from the
        second smallest to the second largest slope; the fixed-alphabet
        readings reported beside them. TAIL CHECK: the largest single-seed
        excess over the shuffles against the largest shuffle reading; the count
        of seeds at the rank floor. TRANSFER ASSUMPTION, STATED: as in the
        formal statement, a heuristic and never a bound.
      falsification_condition: >-
        The PREMISE is falsified on the tested range when a declared arm meets
        the LEAD threshold of EXP-BINSTD-6f1e66 SR-4 in full (L1, L2 and L3):
        that is the LEAD branch, routed to review-breakthrough at max and to
        independent replication before any interpretation. The CONSEQUENT can
        fail, in principle, at n = 131 when an arm's level-1 gain at L_k exceeds
        l^(c_k); it is not measurable by this instrument (rule R-S would need
        about 2^58.6 pairs at M = 2^25.8). An arm classified ART-RES does not
        meet the premise, and HEUR-B2 asserts nothing for it.

  heuristic_note: >-
    (A) is unconditional subject to PO-1 and to the source's primality
    statement for l. (C) is arithmetic under the exact mean of HEUR-B1 and is in
    any case counterfactual. (D)'s null prediction is the falsifiable content
    of this hypothesis and rests on HEUR-B2 for any reading beyond the tested
    cells. The a-priori expectation is stated so it cannot be chosen after the
    fact: the exact controls read exactly, the key is read and reaches the LEAD
    signature, the random label reads NEG, every declared arm reads NEG, and
    the column is recorded for the declared arms with the controlled excess and
    the resolving floor as its measured obstruction.

  structural_ingredients:
    - description: >-
        Theorem C: a tree must invert its combining rule in each argument, so
        exact sum-compatibility plus associativity forces h to be a surjective
        homomorphism. Used as a component and re-run on a composite-order group
        under PO-1.
      citation: KN-FIND-ffe1df
      provenance: internal
      verified_by: TASK-20260929-291567 (finding read, lines 1 to 340); PO-1 re-derived by the version-1 validator (DEC-20260928-9d9c47 J1)
      role: exact capacity from the subgroup lattice
    - description: Lagrange's theorem and the divisor set of the group order, as code that works from a factorisation (CODE-CERT).
      citation: elementary finite group theory, written out in the audit sheet
      provenance: internal
      verified_by: TASK-20260929-291567 (written); the version-1 validator and blind re-deriver agree on the divisor sets (DEC-20260928-9d9c47 J1, J5)
      role: the certificate's arithmetic
    - description: The group order 4l of ECC2K-130 and the primality of l, as the primary source states them.
      citation: Bailey et al., IACR ePrint 2009/541, Appendix A (inputs/BAILEY-2009-541-ECC2K130/paper_fulltext.md lines 1093 to 1096)
      provenance: retrieved
      verified_by: TASK-20260929-291567 (read at source in the repository input)
      role: the divisor set of 4l; the primality is the source's statement and is not proved here (R-12)
    - description: >-
        The halving criterion and the E/2E quotient on a binary curve,
        RE-DERIVED FROM THE GROUP LAW; verified exhaustively at n = 13 and 17,
        a in 0, 1, by an independent implementation. NOT relayed through
        IDEA-20260922-1b16d7.
      citation: >-
        Fong, Hankerson, Lopez, Menezes, "Field inversion and point halving
        revisited", IEEE Transactions on Computers 53(8), 2004 (Waterloo CORR
        2003-18), as the nearest published statement; its Section 1 names the
        technique as that of Knudsen and Schroeppel
      provenance: retrieved
      verified_by: >-
        TASK-20260928-062eb8 (version-1 red team), IN PART: title, abstract,
        Section 1 and roadmap retrieved; Section 3, where the criterion would
        be stated, NOT readable (IMP-FHLM). The criterion is therefore used only
        as re-derived; the citation supports the attribution, not the
        criterion.
      role: the order-2 exact filter, used only as re-derived
    - description: >-
        The k-tree algorithm and its accounting: lists of size 2^(n/(1 + lg k))
        and time O(k 2^(n/(1 + lg k))), matching L = N^(1/(j + 1)) and cost k L;
        the source stores about lg k lists and its joins nest cumulative
        constraints, both making the ceiling more generous.
      citation: D. Wagner, "A generalized birthday problem (extended abstract)", CRYPTO 2002
      provenance: retrieved
      verified_by: TASK-20260928-062eb8 (version-1 red team, provenance_C5.wagner_2002, IACR archive copy, verbatim quotations); cited here with that recorded provenance under the card's read_scope_note
      role: the ceiling's list sizes and per-attempt cost
    - description: >-
        Bailey et al.'s normalisation to the lexicographically smallest conjugate
        of x in a normal basis, and the distinguished-point predicate on the
        Hamming weight of x.
      citation: KN-LIT-661e97
      provenance: internal
      verified_by: TASK-20260928-6880fc (version-1 producer, entry read in full); not re-read by this session
      role: the declared Koblitz-specific arms F1 and F4
    - description: >-
        Orbit unions of any size exist at n = 131 and the (representative,
        shift) parameterisation is cost-neutral at m = 2. The record says
        nothing about orbit unions used with a materialised meet-in-the-middle
        oracle, which a k-list tree over stored lists is, and is by its own
        frontmatter not a promoted finding (confidence unverified;
        promotion_gate NOT MET; not citable as internal ground truth).
      citation: KN-FIND-47da4e
      provenance: internal
      verified_by: TASK-20260929-291567 (frontmatter and the scope sentences read)
      role: the dependency of the ceiling's with-orbit line, which is therefore conditional on its exclusion as well (R-11)

