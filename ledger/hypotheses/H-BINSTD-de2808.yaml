    hidden_cofactor: >-
      Sort and hash polylogarithmic factors and multiset symmetry of the k-list
      accounting, a few bits, disclosed; the ceiling is conditional, so the
      disclosure bears on a counterfactual.
    claim_kind: capacity_certificate_plus_control_measurement
    claim_kind_note: >-
      A declared departure from the template enum, carried from version 1: the
