hypothesis:
  id: H-TLD-f4c8ba
  question_id: RQ-ECDLP-002
  proposal_id: IDEA-20260806-071255
  added: '2026-08-06'
  statement: >-
    An automated generator over a frozen grammar of candidate ECDLP lenses,
    typed by the trichotomy of IDEA-20260806-c5d183 and filtered by a
    forced-value table, produces: (i) EXACTLY ZERO candidates typed as
    deterministic under the full translation action and non-trivially lossy --
    forced by the trichotomy, so a non-zero count means either the trichotomy is
    false or the typing code is wrong; (ii) a refusal rate of at least 30 percent
    once the forced-value table carries its four derived families and the seven
    established families F1-F7; and (iii) zero candidates landing outside the
    (type, L, b) region occupied by F1-F7. The deliverable is a typed frontier
    with per-cell coverage depth, never an undifferentiated candidate count.
  mechanism: >-
    The trichotomy proves that any map propagating deterministically under the
    full translation action on a cyclic group of prime order is constant or
    injective. So "conserved under scalar multiplication but varying with the
    logarithm" names an EMPTY cell, and an untyped generator searching for it
    would return zero hits at any budget while looking like diligent negative
    work. Typing converts the search into a well-posed optimisation over three
    non-empty cells: TYPE I (deterministic only under a proper subset H of
    translations -- index calculus), TYPE II (branching factor b > 1 -- transfer
    operators, Kummer pseudo-addition, coarse cells), TYPE III (a function of the
    REPRESENTATION rather than the group element -- jets, coordinates, lifts).
    THE FORCED-VALUE PRE-CHECK IS THE LOAD-BEARING STAGE, not the generator. Four
    families are already derived to zero at zero compute and are the table's
    first entries: persistent homology (needs a metric E(F_p) does not have, so
    every such lens is TYPE III by construction, with a uniform-random-subset
    null); functorial / category-theoretic embeddings (isomorphism-invariant
    functors cannot see P at all, and functors on pairs (E, P) reduce to the
    X_1(N) analysis of H-MOD-e9d87e); Kolmogorov complexity and compression
    ratio (the sequence x(P), x(2P), ... has complexity O(log p) for every t, so
    the ratio measures t, not k); and approximate / interval arithmetic (every
    absolute value on a finite field is trivial, so approximation exists only
    after a lift, which is the xedni lane). A generator WITHOUT this stage
    manufactures at scale exactly the fatigue reports
    docs/inventor-protocol.md section 4 rejects.
  assumptions:
    - >-
      The trichotomy of IDEA-20260806-c5d183 is correct. Elementary and its proof
      is recorded, but NOT independently validated in this session; the typing
      stage is void without it.
    - >-
      Toy N small enough for exhaustive typing (N up to roughly 2^16), so typing
      is EXACT rather than statistical. Conclusions about which lenses exist are
      scoped to the declared grammar and are not claims about all lenses.
    - >-
      The (L, b) meter of IDEA-20260802-002 exists and passes its own four
      calibration checks. This hypothesis consumes that meter and is BLOCKED
      without it; it does not rebuild it.
    - >-
      The grammar and composition depth are frozen before generation. A count
      produced under a grammar chosen while looking at results is a function of
      how long someone kept typing, not a coverage statement.
  proof_search_map:
    bottleneck: >-
      The forced-value table. Everything else is engineering. A thin table
      degenerates the generator into a high-throughput fatigue-report machine,
      which is strictly worse than not running it.
    baseline_embedding:
      parameter_slice: >-
        The seven established families F1-F7 named in IDEA-20260802-002 (walk-
        collision, factor-base decomposition, isogeny path, pairing transfer,
        p-adic lift, and the remaining two), each with its known type and triple.
      reproduction_check: >-
        Frozen fixture: F1-F7 typed by hand once, then reproduced MECHANICALLY.
        Exact match on type; triples within the meter's declared tolerance. Plus
        the x-coordinate lens, whose exact triple (TYPE II, L = 1 bit, b = 2) is
        already calibrated in IDEA-20260802-002 and must be rediscovered exactly.
    observation_collision:
      observable: the (type, L, b) triple
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED MASSIVELY: many syntactically distinct
        lenses share a triple. This does not falsify the scheme -- the triple is
        a deliberate quotient -- but it bounds the conclusion: a NEW triple is a
        candidate new family, a REPEATED triple is a rediscovery, and the
        write-up must never present the second as the first. The count of
        distinct triples versus candidates generated is reported for exactly this
        reason.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Type together with the triple, rather than the triple alone --
          preserving the propagation structure that survives composition.
        predicted_gain: >-
          Distinguishes TYPE I candidates with small H from TYPE II candidates
          with small b, which the triple alone conflates and which have entirely
          different cost consequences.
      - transform: specialization_pack
        proposed_object: >-
          Charge the search budget over the proved-disjoint type cells so
          coverage per cell is reportable.
        predicted_gain: >-
          Converts "we screened N candidates" -- a fatigue report -- into
          per-cell coverage depth with per-family obstructions.
    quantifier_order: >-
      What the generator can support: FORALL candidates pi in the declared
      grammar at composition depth <= D, EXISTS a type and a triple, and the
      achieved region is R.
      What it can NEVER support: FORALL lenses whatsoever, the achieved region is
      R. The grammar and the depth bound sit INSIDE the quantifier and must
      appear in every reported conclusion; dropping them turns a coverage
      statement into a false closure.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Within this grammar, at this depth, at this toy scale, no candidate
        lands outside the region occupied by the known families." NEVER "there is
        no new attack family."
      nearby_object_control: >-
        Seed the grammar with a lens the generator is NOT supposed to find and
        which is genuinely powerful -- a pairing transfer on a low-embedding-degree
        curve. The generator must type it correctly and place it OUTSIDE the
        generic region. A generator that types a known-powerful lens as
        unremarkable cannot detect power, and its negatives are uninformative.
    proof_obligations:
      - claim: Typing is exact at toy N by exhaustive check.
        responsibility: correctness
      - claim: F1-F7 are reproduced at their correct types and triples.
        responsibility: baseline
      - claim: Every refusal carries a recorded derivation.
        responsibility: interface
      - claim: Reported conclusions carry grammar and depth bounds.
        responsibility: scope
      - claim: The known-powerful seed lens is placed outside the generic region.
        responsibility: correctness
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-TLD-1
      formal_statement: >-
        The (type, L, b) triple is a sufficient statistic for whether a lens can
        found a new attack family: two lenses with the same triple have the same
        best-achievable cost exponent against the ECDLP.
      random_model_justification: >-
        The rigorous half is the trichotomy, which shows the type determines
        which of three propagation regimes a lens is in, together with the
        survival-depth formula log(budget)/log(b) for TYPE II. The heuristic half
        is SUFFICIENCY -- that nothing outside the triple matters -- and it is
        almost certainly false in detail, since two TYPE I lenses with the same
        |H| but different word metrics on H can differ in cost. It is stated so
        it can be attacked rather than relied on quietly.
      supporting_results:
        - IDEA-20260806-c5d183 (the trichotomy)
        - IDEA-20260802-002 (the (L, b) meter and its four calibration answers)
      validation_experiment_ids: [EXP-TLD-0a6b4d]
      falsification_condition: >-
        Within-triple spread of measured relation yield comparable to
        across-triple spread. HEUR-TLD-1 is then refuted and the generator's
        output must be read as a COARSE FILTER only -- a weaker but still usable
        instrument, and the record says so rather than treating the refutation as
        fatal.
  structural_ingredients:
    - description: >-
        The propagation trichotomy: a lossy map cannot propagate deterministically
        under the full translation action, forcing every non-trivial lens into
        partial-action, branching, or representation-dependent form.
      citation: IDEA-20260806-c5d183
      role: supplies the type system that makes the search non-vacuous
    - description: >-
        The (L, b) meter and the seven established attack families F1-F7.
      citation: IDEA-20260802-002
      role: supplies the measurement stage and the baseline region
  reduction_chain:
    core_problem: >-
      KN-OPEN-019: what object does each ECDLP attack family track, and is that
      enumeration closed.
    corollaries: []
  predictions:
    - metric: >-
        candidates typed as full-translation-deterministic and non-trivially lossy
      direction: different
      minimum_effect: >-
        Exactly 0, at any budget. FORCED by the trichotomy and therefore the
        instrument's self-check: a non-zero count means the trichotomy is false --
        a major finding -- or the typing code is wrong. The run halts either way
        and the discrepancy is resolved before anything else is reported.
    - metric: fraction of candidates refused by the forced-value pre-check
      direction: higher
      minimum_effect: >-
        At least 30 percent once the table carries the four derived families and
        the F1-F7 rows. A rate near zero means the table is not being maintained
        and the run is manufacturing tallies.
    - metric: >-
        candidates landing outside the (type, L, b) region occupied by F1-F7
      direction: different
      minimum_effect: >-
        Predicted 0. A single one is a candidate new attack family and triggers a
        full hand analysis before any claim; it is never reported as a finding
        from the generator alone.
  test_boundary:
    instances: >-
      Toy prime-order subgroups with N up to roughly 2^16, on prime-field curves,
      where the full-translation determinism check and the branching measurement
      are exhaustive.
    parameters:
      grammar_alphabet:
        - coordinate extractors (x, y, bit slices, Legendre symbol, field trace)
        - arithmetic maps of bounded degree
        - quotients by declared subgroups or automorphisms
        - partition maps into r cells
        - small-degree isogeny or endomorphism evaluations
      composition_depth: bounded at D, frozen before generation
      N_range: up to 2^16
    implementation: >-
      Exhaustive typing (O(N) per candidate for the full-translation check, O(N^2)
      naive for branching), which is the binding constraint on N.
    budget:
      total_cpu_hours: 150
      maximum_memory_gb: 16
  falsification_conditions:
    - >-
      A candidate types as full-translation-deterministic and non-trivially
      lossy. Either the trichotomy is false or the typing code is wrong; the run
      halts and nothing is reported until resolved.
    - >-
      F1-F7 are not reproduced at their correct types. Instrument failure.
    - >-
      The known-powerful seed lens is typed as unremarkable. The generator cannot
      detect power; its negatives are uninformative and may not be reported.
    - >-
      The structure-destruction null (a random cyclic group with arbitrary
      labelling, no curve) produces the same achieved region. The generator is
      measuring the label encoding, not the curve.
  interpretation_limits:
    - >-
      Everything is scoped to the declared grammar, depth bound and toy N. THE
      ACHIEVED REGION IS A FUNCTION OF THE GRAMMAR, so "nothing new was found"
      may mean "the grammar cannot express anything new" -- reporting the grammar
      alongside every conclusion is not optional and is the single most likely
      way this instrument misleads.
    - >-
      Typing is TRIAGE. A surviving candidate is a hypothesis for hand analysis,
      never a finding.
    - >-
      An empty frontier is a coverage statement about the grammar, and its honest
      status is `unverified` as a closure unless a per-family obstruction
      accompanies it.
    - >-
      Throughput is not coverage. Per-cell coverage depth is the reportable
      quantity and the metrics are chosen so the tempting headline number is not
      available.
  status: specified
  proposed_by: idea-generator
  specified_by: coordinator
  specified_at: '2026-08-06'
