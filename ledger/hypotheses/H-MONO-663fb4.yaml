hypothesis:
  id: H-MONO-663fb4
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  status: supported_scoped_k3_k4_controlled_null_fisher_sensitivity_open

  statement: >-
    SCOPE: prime fields F_p with p in [100, 3000]; E(F_p) as a finite abelian group;
    factor bases FB that are symmetric subsets of E(F_p) (closed under negation);
    m in {1, 2, 3, 4}; claim tier toy for every measurement, derivation tier for the
    identity and the bound. NO ATTACK, NO EXPONENT, NO CRYPTO-SCALE TRANSFER.

    THE HYPOTHESIS. The "deviant relation rate" half of KN-OPEN-009 -- and hence
    GOAL-MONO-001's declared objective -- is not a monodromy question but a
    subset-uniformity question, and the governing quantity is the normalized character
    bias of the factor base. Precisely, with N = #E(F_p), F = |FB|,
    Shat(chi) = sum_{P in FB} chi(P), C = max_{chi != 1} |Shat(chi)|, and
    N_m(R) = #{(P_1,...,P_m) in FB^m : sum P_i = R}:

      (I1)  mean_R N_m(R) = F^m / N                                      [exact]
      (I2)  Var_R N_m(R) = (1/N^2) sum_{chi != 1} |Shat(chi)|^{2m}       [exact]
      (I3)  max_R |N_m(R)/(F^m/N) - 1|  <=  (C/F)^{m-2} (N/F)   for m >= 2

    and the three substantive consequences:
      (P1) The MEAN is geometry-independent and therefore cannot exhibit an exceptional
           locus at all, for any curve or factor base. Any programme that compares only
           means is structurally unable to answer the question KN-OPEN-009 asks. The
           question lives in the SECOND moment.
      (P2) CONDITIONAL ON square-root cancellation for the full x-coordinate factor base
           (HEUR-CHR-2, numbered and unproved), (I3) forces the relative relation-rate
           deviation to O((log N)^{m-2} N^{-(m-2)/2}) at every m >= 3, uniformly over
           curves -- i.e. no exceptional relation-rate locus can exist there. The
           interesting regime is small structured factor bases (F << N), which is the
           actual index-calculus regime.
      (P3) Var_R N_m(R) is NOT constant on the factor-base sublocus where
           EV-MONO-a0a89c OBS-5 shows the cycle-type instrument is constant. Its spread
           there is demonstrated BEFORE any run by two sets of equal size with computed
           values differing by a factor of exactly N/h - 1.

    PRE-REGISTERED PREDICTION, WHICH CAN FAIL IN BOTH DIRECTIONS: the real x-coordinate
    factor base behaves like a matched random symmetric subset of the same size, with
    Var_real/Var_null in [0.7, 1.4] and (C/F)_real/(C/F)_null in [0.85, 1.15] at every
    tested cell. A ratio above the band is the exceptional locus this goal was created to
    find, located in the correct argument slot (the factor base, not the curve); a ratio
    below it means the factor base is MORE uniform than random, which is also a finding.

  mechanism: >-
    DERIVED IN-REPO; no source read, none cited. G = E(F_p) is a finite abelian group of
    order N (abelianness is all that is used, so non-cyclic E(F_p) is covered).

    (1) N_m is the m-fold convolution of 1_FB with itself. Fourier inversion turns
    convolution into multiplication: N_m(R) = (1/N) sum_chi Shat(chi)^m conj(chi(R)).
    Splitting off chi = 1 (where Shat = F) gives (I1) and the exact error expansion.

    (2) Orthogonality applied to the mean-subtracted expansion gives (I2) with NO error
    term. THE m = 1 CASE IS A COMPLETE, UNFAKEABLE SELF-CHECK: N_1 = 1_FB, whose variance
    is F/N - (F/N)^2 = F(N-F)/N^2, and the right side is (1/N^2)(NF - F^2) by Parseval.
    They agree identically FOR EVERY SET. This is the calibration control, and because it
    is forced to agree it is declared IN ADVANCE to be non-discriminating, so that its
    passing can never be reported as a null result (the failure mode KN-TECH-1a5b7e
    catalogues -- a control that passes without being able to fail).

    (3) (I3) follows by pulling out C^{m-2} and applying Parseval:
    |sum_{chi != 1} Shat^m conj(chi(R))| <= C^{m-2} sum_{chi != 1} |Shat|^2 <= C^{m-2} N F.

    (4) IDENTIFICATION WITH THE RELATION RATE. A prime-field index-calculus relation is a
    decomposition of a target R = aP + bQ as a sum of m factor-base elements; N_m(R) is
    the ORDERED count of these. The multiset count differs by a reordering convention,
    and that convention is precisely where IDEA-20260803-ff7415 suspects an existing
    double count in this corpus (a spurious 2^{n-1} or n!), so BOTH conventions are
    reported at every cell rather than one. F^m/N is the ordered-convention analogue of
    the conservation mean that IDEA-20260803-ff7415 attributes to KN-FIND-007 as
    C(B+m-1,m)/N -- NOT READ, RELAYED FROM THAT PROPOSAL, and confirming the
    correspondence is a declared stage, not an assumption.

    (5) THE SUBGROUP EXTREME IS EXACT AND IS THE POSITIVE CONTROL. If FB = H <= G of
    order h, then Shat(chi) = h for the characters trivial on H and 0 for the rest, so
    N_m(R) = h^{m-1} on H and 0 off it, and max_R |N_m/(F^m/N) - 1| = N/h - 1 exactly.
    This is a factor base with a maximally exceptional relation rate; it exists on every
    curve with a proper subgroup; it is not exotic but is what a badly chosen factor base
    looks like; and any instrument that cannot reproduce N/h - 1 exactly cannot detect an
    exceptional factor base at all.

    (6) WHAT IS BEING REPLACED, AND WHY. The goal's instrument measures the Frobenius
    cycle type of the summation fibre. EV-MONO-a0a89c OBS-5 shows that statistic is
    identically trivial on the factor-base locus at every m, because the group law forces
    complete splitting there. The statistic proposed here is not a Galois statistic at
    all: it is a statistic of the factor base as a SUBSET of the curve group, it is
    defined on that locus by construction, and it is provably non-constant there. That is
    the exact thing GOAL-MONO-001's next_action asks for ("identify a statistic that
    discriminates ON that sublocus").

    (7) THE CROSS-GOAL COLLISION, STATED AS A LINK AND NOT A RESULT. C is the same shape
    of quantity as the H-PSEUDO / ECCG character sum about which this corpus holds four
    inconsistent values and two incompatible growth verdicts (relayed from the session
    ANGLE-BRIEF: alpha = 0.055 in KN-FIND-d4f820, 0.079 in KN-FIND-4c9e71, a refit at
    0.0620, a SCOUT-COMPUTED null at 0.0624 computed over Z_N rather than E(F_p);
    max C = O(1) in DEC-20260804-0a4bc2 and -4f3a3b versus "genuine p-growth" in
    DEC-20260804-53c89f). NONE OF THOSE RECORDS WAS READ FOR THIS HYPOTHESIS. They are
    candidates to check and the contradiction is reported rather than resolved
    (AGENTS.md retrieval policy item 7). The structural point does not depend on which is
    right: if this reduction holds, GOAL-MONO-001 and GOAL-ECDLP-001 have been asking one
    question in two vocabularies and neither cites the other. Adjacent boundary, also
    relayed: DEC-20260804-f320c2 (R2) closes the spectral-gap route for Cay(Z/N, S) at
    |S| = O(1); the factor base has |S| = F ~ sqrt(N) and is outside that scope. This
    hypothesis claims no territory in GOAL-ECDLP-001 or GOAL-RELN-001; the overlap is
    flagged for Coordinator adjudication rather than assumed away.

  proof_search_map:
    bottleneck: >-
      Whether the relation-rate deviation of prime-field index calculus is governed by
      the factor base's character bias C/F rather than by any property of the summation
      cover. Everything KN-OPEN-009 hopes to find in the monodromy lives, under this
      hypothesis, in one scalar computed from the factor base alone. If the reduction is
      wrong -- if the ordered decomposition count is not the relation event -- the whole
      record collapses at step (4), which is why step (4) is the first thing measured.
    baseline_embedding:
      parameter_slice: >-
        m = 1, where (I2) reduces to Var = F(N-F)/N^2 for EVERY subset, computable in
        closed form with no curve, no factor base structure and no sampling; and m = 2,
        where (I2) is equivalent to the standard additive-quadruple identity
        sum_R N_2(R)^2 = F^4/N + (1/N) sum_{chi != 1} |Shat(chi)|^4.
      reproduction_check: >-
        SYMBOLIC at m = 1 (both sides are F(N-F)/N^2 by Parseval; checked while writing
        this record), and EXACT-INTEGER at m = 2 by counting additive quadruples directly
        and comparing. A frozen fixture is required: one declared (curve, factor base)
        cell with both sides written into the contract as integers before execution. A
        plot that resembles a plot is not an embedding; these are integer identities.
      what_would_have_counted_as_failure: >-
        Any residual at m = 1 in exact arithmetic. The check was performed before this
        record was written precisely so that a failure would have prevented it existing.
    observation_collision:
      observable: >-
        The scalar Var_R N_m(R), and behind it the modulus spectrum { |Shat(chi)| }.
      distinct_preimage_search: >-
        SEARCHED, FOUND, AND DECLARED. The observable collides massively: FB and FB + g
        (any translate) and FB and its image under any group automorphism have IDENTICAL
        |Shat| spectra and identical variances at every m. So the observable does not
        determine the factor base. Is there a collision across the claimed conclusion --
        two sets, one "exceptional" and one not, with the same observable? By
        construction any translate of a subgroup coset-union has the same spectrum as the
        original, and both are exceptional, so that pair does not straddle the
        conclusion. NO STRADDLING COLLISION WAS FOUND, and the reason is structural: the
        conclusion IS a statement about the observable (deviation is large or small), so a
        pair with equal observables cannot straddle it. THIS IS RECORDED AS A LIMITATION
        RATHER THAN A PASS: it means the audit cannot falsify identifiability here,
        because the claim is definitionally about the observable. The place a collision
        WOULD bite is step (4) -- if two different relation-collection procedures have the
        same N_m but different actual yields -- and that is the ordered-versus-multiset
        convention question, which is measured in both conventions for exactly this
        reason.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER:
        FOR ALL finite abelian G, FOR ALL symmetric FB <= G, FOR ALL m >= 1,
        THERE EXISTS no error term -- (I1) and (I2) hold as identities.
      The witness is the character decomposition, which depends on G but not on FB, m, R,
      the curve or a seed, so it is uniform in exactly the arguments the conclusion
      quantifies over.
      (I3) IS CLAIMED IN A STRICTLY WEAKER ORDER AND THE DIFFERENCE MATTERS:
        FOR ALL FB, FOR ALL R, FOR ALL m >= 2, deviation <= (C/F)^{m-2}(N/F),
      where C DEPENDS ON FB. So (I3) is not a uniform bound over factor bases; it is a
      bound in terms of an FB-dependent quantity, and the substantive consequence (P2)
      needs the ADDITIONAL, SEPARATELY QUANTIFIED claim HEUR-CHR-2 that C is small for
      the x-coordinate factor base. THAT IS THE QUANTIFIER TRAP IN THIS RECORD AND IT IS
      NAMED HERE: writing "the relation rate is quasirandom" without the C clause would
      promote an FB-conditional statement to a uniform one, which the evidence does not
      support and which this record does not claim.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: an exact second-moment identity for decomposition counts over a finite
        abelian group, a bias-conditional deviation bound, and a toy-scale measurement of
        that bias for x-coordinate factor bases on a small curve panel at p <= 3000. It
        CANNOT certify the asymptotic size of C (that is a character-sum estimate this
        record does not prove and explicitly does not assert); it CANNOT convert a
        measured deviation into a cost or an exponent, because the linear-algebra stage
        is uncharged; it CANNOT transfer to F_{q^n}, where the factor base is a subfield
        line and the relevant group structure differs; and it CANNOT close KN-OPEN-009,
        whose imprimitivity half is H-MONO-45183a's.
      nearby_object_control: >-
        THE OBJECT ON WHICH THE HOPED-FOR CONCLUSION (quasirandom relation rate) IS KNOWN
        FALSE is a factor base equal to a proper subgroup H <= E(F_p): there the relative
        deviation is exactly N/h - 1, the rate is maximally exceptional, and the
        conclusion fails by construction. The instrument MUST reproduce N/h - 1 exactly on
        that arm. A method that reports the subgroup arm as quasirandom has not identified
        the load-bearing structure and NO NEGATIVE MAY BE REPORTED FROM ANY ARM.
        A SECOND, INTERMEDIATE nearby object: a union of two subgroup cosets, whose
        spectrum is closed-form and whose bias is realistic rather than extremal. This
        tests sensitivity at an effect size that could actually occur, not only at the
        extreme.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the question from the summation cover to the group algebra of E(F_p),
          where the hypothesis becomes an exact equality (I2) rather than a distributional
          claim. Encoding: FB -> 1_FB -> Shat. Completeness: every decomposition is
          counted. Soundness: the ordered/multiset convention is the only gap and is
          measured in both conventions. Transfer: to F_{q^n} NOT CLAIMED. Cost loss: the
          exhaustive convolution is O(F N) per m at toy N and is an instrument cost only.
        predicted_gain: >-
          Replaces a census whose statistic has zero spread on the attack locus with a
          closed-form second moment that has computable spread there.
      - transform: specialize_measure_pack
        proposed_object: >-
          Use Parseval as the global budget: sum_chi |Shat|^2 = N F is a conserved
          quantity, so bias in one character must be paid for by flatness elsewhere.
          Charges are added only over the disjoint blocks {chi = 1} and {chi != 1}.
        predicted_gain: >-
          Turns "how exceptional can a factor base be" into a constrained optimization
          with an exact budget, which is what makes (I3) tight at the subgroup extreme
          rather than merely valid.
      - transform: telescoping_potential
        proposed_object: >-
          NOT APPLICABLE, and the reason is recorded rather than the field omitted: there
          is no unstable increment to randomize and no filtration in play. The quantity is
          computed in one shot from a fixed set.
        predicted_gain: n/a
    proof_obligations:
      - claim: (I1) and (I2) hold as exact identities on any finite abelian group.
        responsibility: correctness
      - claim: (I3) follows from (I2) and Parseval with the stated constant.
        responsibility: correctness
      - claim: >-
          m = 1 reduces to F(N-F)/N^2 and m = 2 to the additive-quadruple identity, on a
          frozen fixture, as exact integers.
        responsibility: baseline
      - claim: >-
          N_m is the relation event index calculus collects, up to a convention factor
          depending only on m -- and both conventions are reported.
        responsibility: interface
      - claim: >-
          C for the x-coordinate factor base is measured, never assumed; (P2) is stated
          conditionally on HEUR-CHR-2 and never unconditionally.
        responsibility: strictness
      - claim: >-
          The subgroup arm returns exactly N/h - 1 before any other arm is interpreted.
        responsibility: soundness
      - claim: >-
          Nothing transfers to F_{q^n}, to crypto scale, or to any cost statement; every
          citation carries the gap.
        responsibility: scope
    not_applicable_reason: null

  heuristic_assumptions:
    - id: HEUR-CHR-1
      formal_statement: >-
        NONE LOAD-BEARING FOR (I1), (I2) OR (I3). All three are exact consequences of
        Fourier inversion, orthogonality and Parseval on a finite abelian group. Recorded
        so that the unconditional part of the record is unmistakable.
      random_model_justification: >-
        Not applicable: the statements are not distributional. Stated rather than left
        blank, per docs/target-result-profile.md.
      supporting_results: []
      validation_experiment_ids: [EXP-MONO-c819ba]
      falsification_condition: >-
        Any nonzero residual in exact arithmetic between the convolution side and the
        character side at any m in {1,2,3,4}.
    - id: HEUR-CHR-2
      formal_statement: >-
        FOR ALL generic ordinary E/F_p and the full x-coordinate factor base FB (F ~ N/2),
        C = max_{chi != 1} |sum_{P in FB} chi(P)| = O(sqrt(N) log N).
      random_model_justification: >-
        The random model is that FB behaves like a uniformly random symmetric subset of
        E(F_p) of the same size, for which |Shat(chi)| concentrates at scale sqrt(F).
        THIS IS THE RECORD'S LOAD-BEARING CONDITIONAL AND IT IS NOT PROVED HERE. Its
        analogue in this corpus is itself disputed four ways and two of the disputing
        records were not read for this hypothesis. Consequence (P2) is worthless without
        it and is stated conditionally on it everywhere it appears.
      supporting_results: []
      validation_experiment_ids: [EXP-MONO-c819ba]
      falsification_condition: >-
        Measured C/sqrt(F) growing with p across the pinned prime ladder, i.e. a fitted
        exponent in N significantly above 0.5. That would mean the factor base is
        structurally biased, (P2) is void, and an exceptional relation-rate regime is
        live -- the positive outcome for the goal.
    - id: HEUR-CHR-3
      formal_statement: >-
        The ordered count N_m(R) is the relation event that index-calculus relation
        search collects, up to a convention factor depending only on m.
      random_model_justification: >-
        Not distributional; it is an identification of events. It is NOT treated as
        harmless because IDEA-20260803-ff7415 identifies exactly this
        ordered-versus-multiset conflation as the likeliest source of an existing
        spurious 2^{n-1} factor in this corpus.
      supporting_results: []
      validation_experiment_ids: [EXP-MONO-c819ba]
      falsification_condition: >-
        The measured ordered/multiset ratio failing to match its combinatorial prediction
        at any cell, or the mean of the multiset count failing to match the conservation
        mean IDEA-20260803-ff7415 attributes to KN-FIND-007.
    - id: HEUR-CHR-4
      formal_statement: >-
        The factor base is symmetric (FB = -FB), so Shat is real-valued.
      random_model_justification: >-
        Not distributional; it is a property of the construction. TRUE for a factor base
        defined by x-coordinates, FALSE for one defined by a per-point sign choice.
        Several statements change under the second convention.
      supporting_results: []
      validation_experiment_ids: [EXP-MONO-c819ba]
      falsification_condition: >-
        The implemented factor base failing the symmetry check. That is a construction
        failure and halts the cell as infrastructure, never as evidence.

  structural_ingredients:
    - description: >-
        Fourier analysis on a finite abelian group: inversion, orthogonality, Parseval,
        and convolution-to-multiplication.
      citation: >-
        NOT RETRIEVED, NO SOURCE READ, NO CITATION ASSERTED. Standard; derived in full in
        the mechanism above and self-checking at m = 1.
      role: supplies (I1), (I2), (I3)
    - description: >-
        The Cayley-graph reading: N_m(R) is the number of length-m walks from O to R in
        Cay(E(F_p), FB), and Shat(chi) are its eigenvalues.
      citation: >-
        Derived here. Adjacent recorded boundary, RELAYED AND UNREAD: DEC-20260804-f320c2
        closes the spectral-gap route for |S| = O(1); the factor base is |S| ~ sqrt(N) and
        is outside that scope.
      role: names the second eigenvalue as the quantity the whole question reduces to
    - description: >-
        The subgroup spectrum: Shat(chi) = h on the annihilator of H and 0 elsewhere.
      citation: Derived here; elementary.
      role: supplies the exact positive control N/h - 1

  reduction_chain:
    core_problem: >-
      Determine whether prime-field index-calculus relation rates admit a curve-specific
      or factor-base-specific exceptional locus, and if so what quantity controls it.
    corollaries:
      - >-
        The relation-rate half of KN-OPEN-009 reduces to a bound on C/F, so it is a
        factor-base question and not a curve question, and not a monodromy question.
      - >-
        Any exceptional-locus search that compares MEANS is vacuous, because the mean is
        exactly F^m/N independent of the geometry. This is the same structural point that
        KN-FIND-007 makes about yield (RELAYED via IDEA-20260803-ff7415, not read), now
        stated for the relation count and extended to say where the non-vacuous question
        lives.
      - >-
        A statistic exists that is non-constant on the factor-base sublocus, which is the
        object GOAL-MONO-001's next_action asks for as the alternative to recording a
        scoped no-go.
    corollaries_note: >-
      DELIBERATELY EXCLUDED: any statement about the monodromy or imprimitivity of the
      summation cover (H-MONO-45183a's), any statement about F_{q^n} and the subfield-line
      factor base, any cost or exponent claim, and any resolution of the corpus's own
      four-way disagreement about the analogous constant -- which is reported, not
      adjudicated.

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. (P2) is a CONDITIONAL deviation bound, not an asymptotic complexity
    claim, and it makes no algorithm faster or slower. Pollard rho at O(sqrt(N)) time and
    O(1) memory remains the prime-field ECDLP baseline (KN-OPEN-001). sota_delta is zero
    on every attack axis; dominated_by is not applicable because no Pareto point is
    claimed. If a large bias WERE measured, converting it to a cost claim would require
    charging the linear-algebra stage, which this hypothesis does not do and which the
    session ANGLE-BRIEF records no relation-rate finding in this program as having done.

  predictions:
    - metric: >-
        K1 (ZERO-COMPUTE GATE) -- exact agreement of (I2) at m = 1 with F(N-F)/N^2 on the
        frozen fixture, in exact rational arithmetic
      direction: same
      minimum_effect: >-
        EXACT equality of integers/rationals. Not a tolerance. Declared in advance to be
        NON-DISCRIMINATING (it holds for every set), so its passing is a calibration and
        may never be reported as a null result.
    - metric: >-
        K2 -- relative residual between the convolution side and the character side of
        (I2) at m = 2, 3, 4, per cell
      direction: lower
      minimum_effect: >-
        0 in exact arithmetic; below 1e-10 relative if the character side is evaluated in
        floating point as a cross-check. Any larger residual halts the record.
    - metric: >-
        K3 (PRIMARY DISCRIMINATOR) -- Var_real / Var_null at m = 3 and m = 4, where the
        null is a uniformly drawn symmetric subset of E(F_p) of identical size on the same
        curve, over >= 30 draws
      direction: same
      minimum_effect: >-
        Within [0.7, 1.4], pre-registered before any run. Outside that band, with all
        controls passing, is the exceptional relation-rate signal KN-OPEN-009 asks for.
        The prediction is two-sided and the record predicts its own null.
    - metric: >-
        K4 -- (C/F)_real / (C/F)_null on the same cells
      direction: same
      minimum_effect: within [0.85, 1.15], pre-registered.
    - metric: >-
        K5 (POSITIVE CONTROL, MANDATORY) -- max_R |N_m(R)/(F^m/N) - 1| for FB = a proper
        subgroup H of order h
      direction: higher
      minimum_effect: >-
        EXACTLY N/h - 1 (e.g. exactly 1 at h = N/2, exactly 3 at h = N/4), with C/F
        exactly 1. If this arm does not return the forced value, NO NEGATIVE MAY BE
        REPORTED FROM ANY ARM.
    - metric: >-
        K6 (GRADED, >= 3 INTERIOR POINTS, MONOTONICITY REPORTED) -- relative deviation as
        F ranges over {N/16, N/8, N/4, N/2} at fixed curve and m
      direction: lower
      minimum_effect: >-
        Strictly decreasing in F, with a fitted trend consistent with (C/F)^{m-2}(N/F) at
        C ~ sqrt(F). A QUANTITY THAT FAILS TO DECAY AS F GROWS IS THE CANONICAL ARTIFACT
        TELL (docs/inventor-protocol.md section 3) and this ladder exists to expose it.
    - metric: >-
        K7 -- curve-panel spread of (C/F)_real at fixed p and fixed F across random
        ordinary, CM, j = 0 and j = 1728 curves
      direction: lower
      minimum_effect: >-
        Coefficient of variation below 0.10. THIS IS THE EXCEPTIONAL-CURVE TEST RELOCATED
        TO A STATISTIC THAT CAN SEE IT: a CM or j = 0 curve beyond 3 sigma of the
        random-ordinary panel is the exceptional locus, found where it can exist.
    - metric: >-
        K8 -- ordered-count / multiset-count ratio per cell against its combinatorial
        prediction
      direction: same
      minimum_effect: >-
        Matching the combinatorial prediction at every cell. A mismatch diagnoses the
        convention artifact IDEA-20260803-ff7415 suspects and is a deliverable in itself.

  test_boundary:
    instances:
      - >-
        Non-singular curves over prime fields, p in [100, 3000], panel of >= 8 curves
        including >= 4 random ordinary, >= 2 CM, and j = 0 and j = 1728 explicitly.
      - >-
        Factor bases: (a) the full x-coordinate factor base (symmetric, F ~ N/2);
        (b) declared truncations at F in {N/16, N/8, N/4}; (c) proper subgroups (positive
        control); (d) unions of two subgroup cosets (intermediate control); (e) >= 30
        uniformly drawn symmetric subsets per size (matched null).
      - m in {1, 2, 3, 4}. m = 1 is calibration only. m >= 5 out of scope.
      - >-
        Targets: ALL R in E(F_p), exhaustively. No target sampling; at these sizes the
        exhaustive computation is affordable and a sampled variance would carry its own
        error into the primary metric.
    parameters:
      m_values: [1, 2, 3, 4]
      prime_range: [100, 3000]
      null_draws_per_cell_minimum: 30
      factor_base_size_ladder: ["N/16", "N/8", "N/4", "N/2"]
      curve_panel_minimum: 8
      conventions_reported: [ordered, multiset]
      arithmetic: >-
        Primary metric computed by exact-integer convolution over the group; the character
        side computed independently as a cross-check, with a declared floating-point
        tolerance of 1e-10 relative if exact roots of unity are not used.
    implementation: >-
      Pure Python 3.11 integer arithmetic; group elements indexed by an explicit
      enumeration of E(F_p) so that non-cyclic groups (tau = 4 curves) are handled
      correctly rather than by a single discrete log. Environment verified 2026-08-05 in
      this container: numpy 2.4.6 imports; sympy and sage do NOT. Nothing here requires
      either; numpy may be used for the cross-check only and its absence must not block
      the primary metric.
    budget:
      stage0_wall_clock_seconds: 1800
      stage0_compute: zero; symbolic m = 1 identity check only
