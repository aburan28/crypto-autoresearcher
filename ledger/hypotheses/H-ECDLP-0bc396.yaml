hypothesis:
  id: H-ECDLP-0bc396
  question_id: RQ-ECDLP-4fcbd3
  added: '2026-09-05'
  derived_from_idea: IDEA-20260905-f31bc4
  threshold_source_idea: IDEA-20260905-b6154d
  statement: >-
    SCOPE: odd-prime-order subgroups G = <P> of cofactor 1 on deterministically
    generated ordinary short-Weierstrass curves over F_p at field_bits in {12, 14,
    16, 18, 20, 22, 24}, a FROZEN library of cheap coordinate functions (listed in
    EXP-ECDLP-184fc4 Stage 0), and one cyclic order-2q curve with an F_p-rational
    2-torsion point per size as the known-true object. CLAIM TIER toy. NO ATTACK,
    NO EXPONENT MOVED.
    Claim, in three parts. (1) WHITE SPECTRUM: for every library member g, the
    DL-spectrum g^(a) = sum over W in G of (g(W) - mean g) e(a log_P(W)/N) has
    maximal spike max over a != 0 of |g^(a)| scaling as N^beta with beta in [0.45,
    0.60] across the ladder, and level statistic Z(g) = max spike / sqrt(N Var(g)
    ln(N/2)) within [0.5, 4] at every size, with the matched random-function null
    (same marginal) at beta = 0.5 +- 0.05 and Z in [0.5, 2]. The half-energy
    frequency fraction is 0.5 +- 0.05 for every member. (2) NO CONCENTRATION: no
    member's energy concentrates on a frequency set of size below N^(1/2) at any
    size; equivalently no member reaches the break-even spike N^(3/4) of
    IDEA-20260905-b6154d, and none reaches even the intermediate beta = 0.6. (3)
    KNOWN-TRUE DETECTION: on the order-2q curve, the descent symbol delta(W) =
    Legendre(x(W) - e) is verified exhaustively to be a homomorphism with index-2
    kernel, and its spectrum with respect to a generator of the cyclic group has
    a single nonzero coefficient at frequency q with Z at the full level
    sqrt(N / ln(N/2)) (beta = 1.0).
    Claim (1) is FALSE for a member if beta is at or above 0.60 at the two largest
    sizes, replicated on the second curve family, while the null's beta stays at
    0.5; that is the finding of the lane and it triggers replication and
    independent review before any interpretation. Claim (3) failing voids the
    instrument and no reading from it supports anything.
  mechanism: >-
    On a cyclic group the eigenvectors of the random-branch walk operator are the
    characters chi_a, so the correlation of a coordinate function with any
    eigenvector is a coefficient of its DL-spectrum; a coordinate distinguisher
    that could leak into key recovery must show up as a spike in this spectrum.
    For bounded-degree coordinate functions composed with residue, interval or
    Legendre outer functions the spike is bounded at the Weil level c deg sqrt(p)
    polylog (recalled Bombieri / Kohel-Shparlinski, the twisted-sheaf argument of
    IDEA-20260905-b6154d), which scales as N^(1/2) exactly like the Gumbel extreme
    of a random function; hence beta = 1/2 for both and the slope, not the level,
    is the discriminating statistic. The 2-torsion descent symbol is a
    bounded-degree coordinate function that IS a character when the group order
    is even, so it is the object where the white-spectrum conclusion is known
    false and the instrument must show a full spike; on odd-order groups it is
    constant, which is Pohlig-Hellman's content. The two preimages of a large
    spike (genuine character correlation versus a nearly constant member whose
    normalisation inflates the statistic) are separated by reporting Var(g)
    beside every spike and by exact centring (g^(0) = 0 to machine precision).
  assumptions:
    - >-
      The discrete log of every element of G is tabulated by enumeration iP, and a
      random sample of 1000 entries is certified by independent recomputation
      (harness/toycurve.py mul) before any spectrum is computed.
    - >-
      The library is frozen in the contract before any run; no member is added
      after a spectrum is seen.
    - >-
      Cofactor-1 curves for the primary arm; cofactor > 1 subgroups, if any are
      used, form a separately labelled arm and never mix with the primary cells.
    - >-
      Toy tier. Nothing transfers to cryptographic scale; the slope beta is the
      only scale statement and is reported with its bootstrap interval.
  proof_search_map:
    bottleneck: >-
      A spike |g^(a)| above the Weil level for some cheap g; nothing downstream
      in the coordinate-bias lane exists without it.
    baseline_embedding:
      parameter_slice: >-
        The random-function null at every cell, and the instrument's own
        synthetic character g_0(W) = cos(2 pi a_0 log_P(W)/N) (NOT a coordinate
        function; an instrument check) which must show a single spike at a_0.
      reproduction_check: >-
        The synthetic character shows one spike at a_0 with beta = 1; the null
        shows beta = 0.5 and Z near 1; the a = 0 coefficient is zero to machine
        precision for every centred member. All three are blocking.
    observation_collision:
      observable: the pair (beta, Z) per member and the half-energy fraction
      distinct_preimage_search: >-
        A high Z with beta = 0.5 is a Weil-level constant, allowed by the ceiling
        and not exploitable; a high Z with beta above 0.6 is concentration. The
        pair separates them; Z alone does not, which is why beta is primary.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: the DL-spectrum over the frozen library
        predicted_gain: a measured obstruction with a slope, no exponent
    quantifier_order: >-
      FOR ALL cells, FOR ALL members, FOR ALL a != 0: white. Alternative: THERE
      EXISTS a member and a frequency set of size below sqrt(N) carrying constant
      energy across the two largest sizes.
    method_ceiling:
      strongest_certifiable_claim: >-
        White spectrum of the frozen library at toy scale with slopes, and
        detection of the known-true object. Nothing about functions outside the
        library or of unbounded degree.
      nearby_object_control: the descent symbol on the cyclic order-2q curve
    proof_obligations:
      - claim: log table certified on a sample
        responsibility: correctness
      - claim: descent symbol is a homomorphism (exhaustive)
        responsibility: baseline
      - claim: Gumbel level sqrt(N Var(g) ln(N/2)) for N/2 complex coefficients
        responsibility: size
      - claim: FFT of length up to 2^24 within one tool window and 8 GB
        responsibility: runtime
      - claim: toy tier, no transfer
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    Explicitly null. The hypothesis is a measured ceiling on a mechanism, not a
    complexity claim; no exponent moves in either direction.
  heuristic_assumptions:
    - id: HEUR-CBIAS-H1
      formal_statement: >-
        For every member g of the frozen library on an odd-prime-order subgroup
        of cofactor 1, the DL-spectrum's maximal spike over nonzero frequencies
        behaves like the extreme of N/2 independent complex coefficients of mean
        square N Var(g), i.e. it is at the Gumbel level with beta = 1/2.
      random_model_justification: >-
        The rigorous ingredient is the pointwise Weil-level bound |g^(a)| <= c deg
        sqrt(p) polylog for bounded-degree coordinate functions (recalled; not
        opened here), which forbids any spike above N^(1/2 + o(1)); the classical
        statement imitated is the Gumbel law for the maximum of independent
        exponential variables, which the spectrum of a random function obeys.
      supporting_results:
        - 'Bombieri 1966 (recalled), Kohel-Shparlinski 2000 (recalled): pointers only, unverified in this program.'
        - 'The random-function null measured in the same runs.'
      validation_experiment_ids: [EXP-ECDLP-184fc4]
      falsification_condition: >-
        A member with beta at or above 0.60 at the two largest sizes on two curve
        families while the null stays at 0.5, or a half-energy fraction below 0.1
        at every size.
  structural_ingredients:
    - description: Generic-group lower bound and the baseline convention this lane is scored against.
      citation: KN-TECH-005
      provenance: internal
      verified_by: claude-code-session 2026-09-05 (read in full)
      role: baseline
    - description: The practical rho baseline and Teske's r-adding walks.
      citation: KN-TECH-006
      provenance: internal
      verified_by: claude-code-session 2026-09-05 (read in full)
      role: baseline and the source of the harness partition function
    - description: >-
        The Weil-level bound on character sums of rational functions over a curve
        and over a subgroup of E(F_p).
      citation: >-
        RECALLED, NOT READ. Bombieri, Amer. J. Math. 88 (1966); Kohel and
        Shparlinski, ANTS-IV (2000). Pointers for the reviewer; the hypothesis's
        measured claims do not depend on them.
      provenance: recalled
      verified_by: null
      role: the theorem shape behind the white-spectrum prediction
    - description: >-
        The descent homomorphism W -> Legendre(x(W) - e) on a curve with a
        rational 2-torsion point.
      citation: >-
        RECALLED, NOT READ (standard 2-descent, e.g. Silverman chapter X). The
        contract verifies the property exhaustively at toy scale instead of
        relying on the recollection.
      provenance: recalled
      verified_by: null
      role: the known-true object
    - description: The break-even threshold N^(3/4) and the class boundary of the ceiling.
      citation: IDEA-20260905-b6154d
      provenance: internal
      verified_by: claude-code-session 2026-09-05 (authored and read)
      role: scoring line
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: beta_per_member
      direction: different
      minimum_effect: >-
        Null in [0.45, 0.60] for every member and 0.5 +- 0.05 for the random
        null; structure at or above 0.60 at the two largest sizes.
    - metric: Z_per_member
      direction: different
      minimum_effect: >-
        Null within [0.5, 4]; the random null within [0.5, 2]; the synthetic
        character and the descent symbol at the full level sqrt(N / ln(N/2))
        within a factor 2.
    - metric: half_energy_frequency_fraction
      direction: different
      minimum_effect: Null 0.5 +- 0.05; structure below 0.1 at every size; controls below 2/N.
    - metric: descent_symbol_single_frequency
      direction: higher
      minimum_effect: >-
        Exactly one nonzero coefficient (at q) above 1e-6 of the total energy,
        deterministically, on every order-2q control curve.
  test_boundary:
    instances:
      - cofactor-1 prime-order curves at field_bits in {12, 14, 16, 18, 20, 22, 24}, three seeds each, generated by rejection from harness/toycurve.py's generator
      - one cyclic order-2q curve with rational 2-torsion per size, generated by rejection
      - the random-function null per member per cell, seeded
      - the synthetic character instrument check per cell
    parameters:
      field_bits: [12, 14, 16, 18, 20, 22, 24]
      seeds: [20260905, 20260906, 20260907]
      library: frozen in EXP-ECDLP-184fc4 Stage 0
      certificate_sample: 1000 log entries per curve
    implementation: >-
      A standalone driver under experiments/EXP-ECDLP-184fc4/driver/ using
      harness/toycurve.py for arithmetic and numpy for FFTs; runs written through
      harness/runner.py so every run carries manifest, command, environment and
      raw-result.json. Nothing under harness/ is modified.
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 12
      maximum_memory_gb: 8
      maximum_runs: 48
  falsification_conditions:
    - >-
      A member with beta at or above 0.60 at the two largest sizes on both curve
      families while the null's beta stays at 0.5 +- 0.05. Claim (1) is FALSE for
      that member; escalate to replication and independent review.
    - >-
      A member with half-energy fraction below 0.1 at every size. Claim (2) is
      FALSE; same escalation.
    - >-
      The descent symbol is not a homomorphism on the control curve, or its
      spectrum is not single-frequency. Claim (3) fails; the instrument is void
      and nothing is reported from it.
    - >-
      The synthetic character does not produce a single spike, or the random null
      shows beta outside 0.5 +- 0.05. Instrument defect; nothing is reported.
    - >-
      Crashes, timeouts, memory exhaustion. Infrastructure under AGENTS.md rule 5,
      never negative mathematical evidence.
  interpretation_limits:
    - Toy tier; no transfer to cryptographic scale is offered.
    - A white spectrum for the frozen library says nothing about functions
      outside it, in particular about fast high-degree functions.
    - A member at Weil level (Z up to 4, beta 0.5) is a real correlation the
      ceiling allows and is recorded as such, not as structure.
    - No attack, no exponent; the deliverable is a measured obstruction and its
      resource reading.
  status: proposed
  proposed_by: claude-code-session
  specified_by: >-
    claude-code-session 2026-09-05, as a DESIGN DRAFT under /design-experiment
    step 2; this is not a Coordinator status change and the hypothesis stays
    proposed until a committed Coordinator decision moves it.
  prior_evidence_refs:
    - RQ-ECDLP-4fcbd3
    - IDEA-20260905-f31bc4
    - IDEA-20260905-b6154d
    - the lumpability-defect proposal named as nearest_internal_record in the parent idea's novelty_screen (referenced indirectly so tools/ecc_priority.py's open-idea worklist does not read this hypothesis as designing it)
    - IDEA-20260830-c5c614
    - KN-TECH-005
    - KN-TECH-006
    - KN-FIND-b7e091
  distinguishable_outcomes:
    - outcome: Every member at beta in [0.45, 0.60], Z within [0.5, 4], controls detected.
      meaning: >-
        Claims (1)-(3) hold at toy scale. The lane's eigenvector premise is
        measured closed for bounded-degree cheap functions, with the obstruction
        recorded as the maximal beta and Z per member; the resource reading is
        that any member with Z consistently above 2 is a Weil-level correlation
        worth characterising for walk engineering (constants), never for an
        exponent.
    - outcome: A member with beta at or above 0.60 on both families at the two largest sizes.
      meaning: >-
        Claim (1) is FALSE for that member. The finding is replicated at a fourth
        seed and a further size before interpretation, then reviewed
        independently; if it survives it is the first measured concentration in
        the lane and IDEA-20260905-b6154d's break-even line prices it.
    - outcome: The descent symbol is not single-frequency or the synthetic character fails.
      meaning: Instrument failure. Nothing about the curve is learned.
    - outcome: Timeouts or crashes at the largest sizes.
      meaning: >-
        Infrastructure. The ladder is reported to the largest completed size and
        the missing cells stay missing.
