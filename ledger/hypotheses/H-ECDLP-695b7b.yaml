  title: >-
    At p = 11 and n = 7 the power quotient has order 1, and at n = 5 it has order 5.
  statement: >-
    For a prime n the gcd of n and p - 1 is either 1 or n. The image
    of the map x to the power n on the multiplicative group has size
    (p - 1) divided by that gcd, and the quotient has that gcd as its
    order. The six cells (11, 5), (11, 7), (13, 3), (13, 5), (17, 5)
    and (3, 2) have quotient orders 5, 1, 3, 1, 1 and 2, and image
    sizes 2, 10, 4, 12, 16 and 1. The cell (11, 7) is the trivial
    quotient. The cell (11, 5) is the nontrivial one. The cell
    (13, 3) divides 12 and is not equal to 12, so divisibility alone
    does not force n = p - 1. The cell (3, 2) does satisfy n greater
    than (p - 1)/2 and n divides p - 1, and there n equals p - 1.
    A group order equal to p - 1 has trace 2. At p = 11 that trace
    is 2 for order 10, and at p = 3 it is 2 for order 2.
  mechanism: >-
    The proposal says the only group-element invariant of a cubical
    lift is a power-quotient class, and that the class is trivial
    when the gcd is 1. This contract checks that gcd arithmetic on
    six cells. It does not run a pairing ladder.
