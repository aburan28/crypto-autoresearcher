hypothesis:
  id: H-XEDN-58867e
  question_id: RQ-XEDN-004

  statement: >-
    SCOPE: the executed measurement operator of GOAL-XEDN-003 -- the functions
    shortest_relation_group_law, shortest_relation, height_gram and
    analyze_surface in
    experiments/EXP-XEDN-007/implementation/run_census.sage -- together with
    the committed run artifacts of EXP-XEDN-006 and EXP-XEDN-007. CLAIM TIER
    toy. NO ATTACK, NO EXPONENT, NO STATUS CHANGE REQUESTED. This is a
    statement about an instrument, not about elliptic surfaces.
    TWO CLAIMS, both decidable by reading committed source and confirmable by
    running a reimplementation on synthetic inputs.
    (I) IMAGE-SET CLAIM. The reachable output set of the primary metric
    max_abs_coeff is exactly {1, 2, 3, None}. It is {1,2,3} at support 2 and 3
    because the search draws coefficients from
    range(-coeff_bound, coeff_bound+1) with coeff_bound = 3 and the caller
    supplies no override; it is {1} at support 4 because the only support-4
    branch sweeps product([-1, 1], repeat=4); and no combination of support 5
    or more is ever formed, because max_support = 3 bounds the first loop. The
    height-Gram path that could in principle exceed 3 contributes nothing: it
    is declared diagnostic-only in both contracts, and on all 14
    relation-bearing configurations the committed records show
    max_abs_coeff_gram null and corank 0, so it never had a kernel to search.
    CONSEQUENCE: P(reported max_|coeff| >= 4) = 0 identically, for every input.
    H-XEDN-005's falsification condition -- "any verified shortest relation
    with infinity-norm >= 4" -- lies outside the image of the instrument
    charged with testing it.
    (II) CONFOUND CLAIM. analyze_surface labels a surface
    skip_reason: no_relation_in_observed_span whenever the search returns None.
    By (I) that label has three disjoint preimages: no relation exists; a
    relation exists at support >= 5; a relation exists at support <= 3 with
    infinity-norm >= 4. The second and third ARE the falsification of
    H-XEDN-005. Therefore the p = 31 cell of EXP-XEDN-006 (48 surfaces
    analysed, 2 eligible, 0 verified relations), which KN-FIND-010 reads as
    "a free-x relation-density obstruction, not an observed coefficient
    blow-up", is UNIDENTIFIED: both readings produce the identical observable
    and no committed measurement separates them.
    FALSIFICATION OF THIS HYPOTHESIS: any input on which the archived search
    returns a value >= 4, or a re-extraction showing corank >= 1 on any
    relation-bearing configuration, or a failure of the archived search to
    return 2 and 3 on planted relations of those infinity-norms (which would
    make the diagnosis an implementation defect rather than a declared
    ceiling).

  mechanism: >-
    ESTABLISHED BY READING COMMITTED SOURCE AND COMMITTED RESULTS, both re-read
    in the ideation session. No external source is used and none is asserted.

    (A) THE ALPHABET AND THE SUPPORT CEILING. The relevant definition is
    `def shortest_relation_group_law(E, pts, coeff_bound=3, max_support=3)`.
    Its body loops `for supp in range(2, max_support + 1)` -- so supp in {2,3}
    -- and for each support draws coefficient tuples from
    `product([c for c in range(-coeff_bound, coeff_bound + 1) if c != 0],
    repeat=supp)`, i.e. from {-3,-2,-1,1,2,3}. A guard `if n > 40 and supp >= 3:
    break` can only shrink that. A separate branch guarded by `if n <= 24`
    sweeps `combinations(range(n), 4)` against `product([-1, 1], repeat=4)` and
    returns 1 on the first hit. `analyze_surface` calls
    `shortest_relation_group_law(E, pts)` with no overrides. Hence the image
    set of the group-law path is {1,2,3} at support <= 3, {1} at support 4, and
    empty above. `analyze_surface` then sets
    `rec["max_abs_coeff"] = gl_maxc` whenever the group-law value is not None,
    so that image set is the image set of the reported primary metric.

    (B) THE DIAGNOSTIC PATH IS EMPTY, NOT MERELY DEMOTED. `height_gram(pts)`
    sets G[i,i] = h_naive(P_i) and
    G[i,j] = (h_naive(P_i + P_j) - h_naive(P_i) - h_naive(P_j))/2, where
    `h_naive(P) = max(deg num x, deg den x)`. The naive x-degree is not a
    quadratic form on MW/tors, so this matrix is not the Gram matrix of any
    bilinear pairing and its kernel has no relation-theoretic meaning. The
    archive shows the consequence: over the 14 relation-bearing
    configurations, `corank` is 0 on 14 of 14 and `max_abs_coeff_gram` is null
    on 14 of 14, while a group-law relation was independently verified on each.
    A genuine positive-definite Gram matrix of s vectors satisfying a
    nontrivial relation has rank <= s - 1 and corank >= 1. The archive
    therefore records, on its own face, a matrix that is mathematically
    incompatible with the relation recorded beside it, and no committed record
    notes this. (The repair is the subject of IDEA-20260805-68c69a; this
    hypothesis only needs the fact that the path contributes nothing.)

    (C) WHY THIS IS NOT MERELY A LOW-POWER MEASUREMENT. A low-power test can
    fail to detect an effect; this one cannot detect it at any power. The
    falsification region and the image set are disjoint SETS, not distributions
    with small overlap. Increasing the number of surfaces, the number of
    primes, the enumeration density, or the replication count cannot change a
    disjointness. EXP-XEDN-007's densification at p = 31 increased the number
    of measurements from 0 to 2 and left the image set exactly as it was.

    (D) THE CONFOUND, WRITTEN AS A COLLISION. Let Obs be the observable
    (max_abs_coeff, skip_reason). Take two ground-truth states of a surface:
    S1, whose enumerated slots satisfy no nontrivial relation; S2, whose slots
    satisfy a unique relation of support 3 and infinity-norm 5. Then
    Obs(S1) = Obs(S2) = (None, no_relation_in_observed_span). S1 supports
    H-XEDN-005 vacuously and S2 falsifies it outright. This is an observation
    collision in the strict sense of inventor-protocol section 8 audit 2 and it
    is a direct falsifier of identifiability unless an additional condition
    separates the pair. No such condition appears in EXP-XEDN-006's or
    EXP-XEDN-007's contract, in EV-XEDN-005 or EV-XEDN-006, in
    DEC-20260730-001 or DEC-20260730-002, or in the three closure attestations
    on GOAL-XEDN-003 (whose recorded rationales address scope and the sparsity
    of n_rel = 2, not the range of the measurement).

    (E) WHAT AN UNBOUNDED SEARCH COSTS, SO THAT THE CEILING IS NOT MISTAKEN FOR
    A NECESSITY. With the corrected canonical-height Gram the relation module
    is exactly ker G intersected with Z^s and the shortest relation is an SVP
    instance in a lattice of rank equal to the corank -- at most 6 here --
    solvable exactly by LLL plus a small enumeration, with NO coefficient
    ceiling at all. Even without the corrected Gram, raising coeff_bound to 8
    at support 3 multiplies the search by (16/6)^3 = 19, which on 447 surfaces
    is negligible. The ceiling was a convenience, not a constraint, and the
    audit should say so rather than treating it as forced.

    (F) NOT A CLOSURE. Nothing here shows the coefficient bound is false or
    that the p = 31 cell hides a large-coefficient relation. It names an
    obstruction (the instrument's image set), gives the argument (A)-(D), and
    gives forward guidance (E) plus the successor metrics of
    IDEA-20260805-5bf632.

  assumptions:
    - >-
      FROZEN READING RULE, fixed before any measurement. The image set is
      determined solely from the archived source text at
      experiments/EXP-XEDN-007/implementation/run_census.sage; if a different
      committed variant of the implementation is found that produced the
      archived results, the whole audit is re-aimed at that file and this
      record is superseded rather than amended.
    - >-
      FROZEN RECOVERY TABLE, declared before any run: recovery = 1 for
      (support <= 3, infinity-norm <= 3); recovery = 1 for
      (support 4, infinity-norm 1); recovery = 0 for (support 4,
      infinity-norm >= 2); recovery = 0 for support >= 5; recovery = 0 for
      infinity-norm >= 4 at any support. Every cell is a prediction and every
      cell is reported.
    - >-
      Sage is ABSENT from this container (verified in the ideation session:
      `import sage` raises ModuleNotFoundError; numpy 2.4.6 present; sympy
      absent), so the archived implementation cannot be re-executed here. The
      recovery table is therefore measured on a pure-Python reimplementation
      whose fidelity is itself checked against the 14 committed configurations
      before any conclusion is drawn. An attempt to install Sage is an
      infrastructure request and its outcome is infrastructure signal, never
      mathematical evidence (AGENTS.md rule 5).
    - >-
      Committed numbers are read as-is. The 14 relations, their supports and
      coefficient vectors, corank 0 on 14 of 14, max_abs_coeff_gram null on 14
      of 14, and the p = 31 EXP-XEDN-006 cell (48 analysed, 2 eligible, 0
      relations) are re-extractions performed in the ideation session and must
      be re-extracted in-harness as stage 0 before being cited.

  proof_search_map:
    bottleneck: >-
      The step at which H-XEDN-005 could have been falsified. Every conclusion
      in GOAL-XEDN-003 -- DEC-20260730-001's support_scoped at p in {7,13,19},
      DEC-20260730-002's four-prime support_scoped, KN-FIND-010's density
      reading and KN-FIND-011's promotion -- rests on a test that was passed.
      If the test could not have been failed, every one of those is a statement
      about the apparatus. Repairing or condemning this one step consumes no
      other goal's budget and is upstream of any further XEDN work.
    baseline_embedding:
      parameter_slice: >-
        The 14 committed relation-bearing configurations at their recorded
        supports (13 at support 3, 1 at support 4) with their recorded
        coefficient vectors. On this slice the reimplemented search must
        reproduce the archived output EXACTLY -- same value, same relation
        vector up to sign and permutation of equal entries -- which is the
        strongest available check that the reimplementation is the same
        instrument.
      reproduction_check: >-
        FIXTURE-BASED AND EXACT. Fourteen integer outputs must match fourteen
        committed integer outputs. A reimplementation that "behaves similarly"
        is not a reproduction. If fewer than 14 of 14 match, the reimplemented
        instrument is a different instrument and the recovery table it produces
        may not be attributed to the archived one.
    observation_collision:
      observable: >-
        The pair (max_abs_coeff, skip_reason) recorded per eligible surface.
      distinct_preimage_search: >-
        THE COLLISION IS THE HYPOTHESIS AND IT IS EXHIBITED CONSTRUCTIVELY, one
        object on each side of the claimed conclusion. Side A (supports
        H-XEDN-005): a slot set with no nontrivial relation. Side B (falsifies
        H-XEDN-005): a slot set whose unique relation has support 3 and
        infinity-norm 5. Both map to (None, no_relation_in_observed_span). The
        objects are constructible directly in an abstract finite abelian group
        with no elliptic curve needed, and constructing them is stage 2 of the
        paired experiment. NO additional condition in any GOAL-XEDN-003 record
        separates them, and the search for one was performed over the two
        experiment contracts, both evidence records, both decisions, both
        knowledge findings and the three closure attestations.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable fixed at (None, no_relation_in_observed_span) and
          vary the forgotten structure: the true relation's support and
          infinity-norm. The intrinsic invariant proposed to distinguish the
          resulting objects is the output of an UNBOUNDED relation search on
          the same committed slot lists -- which is computable, because
          specialisation to a single fibre turns each slot into an F_p point
          and the relation search into integer linear algebra over a finite
          abelian group.
        predicted_gain: >-
          Converts the p = 31 cell from an unidentified observable into a
          measured one. Both outcomes are usable: a large-coefficient or
          high-support relation falsifies H-XEDN-005 at p = 31 by its own
          stated condition; none found converts KN-FIND-010's density reading
          from an assumption into a measurement.
      - transform: representation_reduction
        proposed_object: >-
          Replace the elliptic surface by an abstract finite abelian group in
          which relations of prescribed support and infinity-norm can be
          PLANTED exactly. The instrument's sensitivity then becomes an exact
          integer-valued function of (support, infinity-norm) rather than
          something estimated on curves.
        predicted_gain: >-
          A complete recovery table at seconds of compute, with encoding,
          completeness and soundness obligations that are trivial to discharge
          because planting is exact. Transfer obligation: the table describes
          the SEARCH, not the curve arithmetic, and no curve-specific claim
          transfers from it.
    quantifier_order: >-
      H-XEDN-005's falsification condition reads: THERE EXISTS an eligible
      surface such that THE VERIFIED SHORTEST relation has infinity-norm >= 4.
      For that existential to be testable the instrument must be able to
      witness it. Written with the instrument exposed, what the protocol can
      decide is: THERE EXISTS an eligible surface and a relation IN THE
      SEARCHED REGION with infinity-norm >= 4 -- and the searched region is
      declared, by the code, to contain no such relation. The quantifier trap
      being hunted is therefore not a witness depending on the instance; it is
      an existential quantified over an empty set. Note also the superlative:
      "the shortest relation" is a universal over all relations, and a bounded
      search certifies a superlative only within its bound. Every archived
      report of "the shortest relation" is, correctly stated, "the shortest
      relation of support <= 4 with coefficients in {-3..3}, and {-1,1} at
      support 4".
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that the executed protocol could not have reported a value
        >= 4, and that its zero-relation label has three preimages of which two
        are falsifying. It CANNOT certify that H-XEDN-005 is false, that any
        p = 31 surface carries a large-coefficient relation, that the
        Coordinator's decision was wrong, or anything about elliptic surfaces
        at all. It moves no exponent and touches no ECDLP cost.
      nearby_object_control: >-
        THE OBJECT ON WHICH THE INSTRUMENT MUST SUCCEED, and therefore the
        control that decides between "declared ceiling" and "implementation
        defect": a planted relation of support 3 with infinity-norm exactly 2,
        and another with infinity-norm exactly 3. Both lie strictly inside the
        instrument's declared range, so it MUST return 2 and 3. If it does not,
        the finding is not a design ceiling but a defect, the diagnosis
        changes, and no statement about the ceiling may be made. The
        complementary nearby object, on which it must FAIL if claim (I) is
        right: the same relation with infinity-norm 4.
    proof_obligations:
      - claim: >-
          The image set of the archived search is {1,2,3,None}, established
          from the source text and confirmed by an adversarial sweep.
        responsibility: correctness
      - claim: >-
          The reimplementation reproduces all 14 committed outputs exactly.
        responsibility: baseline
      - claim: >-
          The height-Gram path contributes no relation on any of the 14
          configurations (corank 0, max_abs_coeff_gram null).
        responsibility: interface
      - claim: >-
          The recovery table is measured at every declared cell and reported in
          full, including cells that agree with the prediction.
        responsibility: strictness
      - claim: >-
          Any relation found by the unbounded p = 31 search is verified over
          F_p(t) as well as by specialisation, to the same standard the
          archived pipeline used, before being called a falsification.
        responsibility: soundness
      - claim: >-
          Nothing here transfers to any conclusion about elliptic surfaces, the
          ECDLP, or any other goal's instruments without that instrument being
          read in the same way.
        responsibility: scope
    not_applicable_reason: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. No complexity claim of any kind. Instrument audit only;
    moves no exponent, makes no system easier to solve, sota_delta zero on
    every attack axis, dominated_by not applicable.

  heuristic_assumptions:
    - id: HEUR-XI-1
      formal_statement: >-
        None is load-bearing for claim (I). The image set is a property of a
        committed program text with constant bounds and no caller overrides,
        established by reading it rather than by assumption.
      random_model_justification: >-
        Not applicable; there is no distributional content. This entry exists
        to record that the primary claim is UNCONDITIONAL given the source
        text, and that the only genuine assumption is evidentiary -- that the
        archived source is the code that produced the archived results.
      supporting_results: []
      validation_experiment_ids: [EXP-XEDN-373466]
      falsification_condition: >-
        The adversarial sweep makes the archived search return a value >= 4, or
        a differing committed implementation variant is found.
    - id: HEUR-XI-2
      formal_statement: >-
        The expected number of spurious support-3 relations with coefficients
        in {-3..-1,1..3} among n elements drawn uniformly from an abelian group
        of order M is approximately C(n,3) * 6^3 / M.
      random_model_justification: >-
        Elementary counting under uniformity of the drawn elements, which is
        what a null object instantiates by construction. It is NOT claimed to
        hold for the curve-derived slots, and no claim about those rests on it.
        The number matters because at p = 31 the specialised fibre has order
        about p = 31 and the generic F_p(t) check is what keeps a spurious hit
        from being recorded as a relation.
      supporting_results: []
      validation_experiment_ids: [EXP-XEDN-373466]
      falsification_condition: >-
        The measured spurious rate in the null arm departs from the formula by
        more than a factor of 2 over >= 1000 draws per cell. The counting model
        is then wrong and the null's forced value must be recomputed before the
        null is used to interpret anything.
    - id: HEUR-XI-3
      formal_statement: >-
        A pure-Python reimplementation of shortest_relation_group_law against
        an abstract abelian group has the same image set and the same recovery
        table as the archived Sage version.
      random_model_justification: >-
        Not a mathematical assumption but an engineering one, and the weakest
        link in the experiment as designed, because the archived code cannot be
        executed here to compare directly.
      supporting_results: []
      validation_experiment_ids: [EXP-XEDN-373466]
      falsification_condition: >-
        The reimplementation fails to reproduce any of the 14 committed
        outputs. It is then a different instrument, its recovery table may not
        be attributed to the archived one, and the audit reports the
        discrepancy as its result.

  structural_ingredients:
    - description: >-
        The archived measurement operator itself, read as a mathematical
        object: a partial function from slot sets to {1,2,3,None}.
      citation: >-
        experiments/EXP-XEDN-007/implementation/run_census.sage, functions
        shortest_relation_group_law, shortest_relation, height_gram and
        analyze_surface. Read in the ideation session; NOT executed, because
        Sage is absent from this container.
      role: the object whose image set is the finding
    - description: >-
        The committed per-surface records carrying corank, max_abs_coeff_gram,
        max_abs_coeff, shortest_relation, relation_source and skip_reason.
      citation: >-
        experiments/EXP-XEDN-006/runs/RUN-XEDN-006-MAIN/raw-result.json and
        experiments/EXP-XEDN-007/runs/RUN-XEDN-007-MAIN/raw-result.json.
      role: the evidence that the diagnostic path contributed nothing
    - description: >-
        Planted-relation construction in a finite abelian group, which makes
        the recovery table exact rather than estimated.
      citation: >-
        Elementary; derived in this record. No source asserted.
      role: the sensitivity instrument

  reduction_chain:
    core_problem: >-
      Decide whether the executed GOAL-XEDN-003 protocol could have reported a
      falsification of H-XEDN-005, and whether its zero-relation label
      identifies the state it is read as identifying.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. No statement about elliptic surfaces, the ECDLP, or
      any other goal follows from an instrument audit. The obvious successor --
      a program-wide census of instruments whose falsification region lies
      outside their image -- is named as forward guidance, not claimed as a
      corollary.

  predictions:
    - metric: >-
        I1 -- instrument_image_set: the set of distinct non-None values the
        archived search returns over an adversarial sweep designed to force a
        large return
      direction: different
      minimum_effect: >-
        'EXACTLY {1, 2, 3}. Any returned value >= 4 falsifies claim (I) and is
        the single most useful outcome of the experiment.'
    - metric: >-
        I2 -- recovery table: recovery rate at each cell of
        (support s in {2,3,4,5,6}) x (planted infinity-norm k in {1,...,6})
      direction: different
      minimum_effect: >-
        'The frozen table: 1 for (s <= 3, k <= 3); 1 for (s = 4, k = 1); 0 for
        (s = 4, k >= 2); 0 for all s >= 5; 0 for all k >= 4. Every cell is
        reported. A single disagreeing cell means the source was misread and
        this record must be corrected before anything else.'
    - metric: >-
        I3 -- step sharpness: whether the recovery rate falls as a STEP between
        k = 3 and k = 4, and between s = 4 and s = 5, rather than decaying
      direction: different
      minimum_effect: >-
        'A step, i.e. recovery 1.00 at k = 3 and 0.00 at k = 4 with nothing in
        between. A smooth decay would mean the search is failing for a reason
        other than its declared bounds, and the diagnosis must change from
        "declared ceiling" to something else.'
    - metric: >-
        I4 -- positive control: the value returned on planted relations of
        support 3 with infinity-norm exactly 2 and exactly 3
      direction: different
      minimum_effect: >-
        'EXACTLY 2 and EXACTLY 3. If either fails, the instrument cannot reach
        its own declared ceiling, the finding becomes an implementation defect,
        and NO NEGATIVE RESULT MAY BE REPORTED FROM ANY ARM.'
    - metric: >-
        I5 -- re-extracted corank and max_abs_coeff_gram on the 14
        relation-bearing configurations
      direction: different
      minimum_effect: >-
        'corank EXACTLY 0 and max_abs_coeff_gram EXACTLY null on all 14,
        against a mathematically forced corank >= 1. Any configuration with
        corank >= 1 refutes the internal-contradiction claim of mechanism (B).'
    - metric: >-
        I6 -- fidelity: number of the 14 committed outputs reproduced exactly
        by the reimplementation
      direction: higher
      minimum_effect: >-
        '14 of 14. Below that, the recovery table may not be attributed to the
        archived instrument and the experiment reports a fidelity failure
        instead of a sensitivity curve.'
    - metric: >-
        I7 -- p = 31 confound resolution: among the EXP-XEDN-006 p = 31
        surfaces that returned no relation, the number carrying a relation of
        support >= 5 or infinity-norm >= 4 under an unbounded search over the
        committed slot lists, verified generically as well as by specialisation
      direction: different
      minimum_effect: >-
        'NO VALUE IS PRE-REGISTERED, because no measurement of this quantity
        exists anywhere in the corpus and inventing a number would be a
        fabrication. The DISPOSITION is pre-registered: any count > 0 falsifies
        H-XEDN-005 at p = 31 by its own stated condition and must be routed to
        the Coordinator as a contradiction with a committed record; a count of
        0 converts KN-FIND-010''s density reading from an assumption into a
        measurement. Both outcomes are deliverables.'

  test_boundary:
    instances:
      - >-
        The archived source file
        experiments/EXP-XEDN-007/implementation/run_census.sage, read as text.
      - >-
        The committed run artifacts of EXP-XEDN-006 (p in {7,13,19,31}) and
        EXP-XEDN-007 (p = 31), including all recorded slot lists.
      - >-
        Synthetic planted-relation instances in finite abelian groups, at
        support 2..6 and infinity-norm 1..6.
      - >-
        OUT OF SCOPE: any new curve, any new prime, any surface not already
        committed, and any statement about elliptic-surface geometry.
    parameters:
      source_under_audit: experiments/EXP-XEDN-007/implementation/run_census.sage
      functions_under_audit:
        - shortest_relation_group_law
        - shortest_relation
        - height_gram
        - analyze_surface
      declared_defaults: {coeff_bound: 3, max_support: 3}
      support_4_alphabet: "{-1, +1} only"
      planted_supports: [2, 3, 4, 5, 6]
      planted_inf_norms: [1, 2, 3, 4, 5, 6]
      draws_per_cell: 1000
      committed_archives:
        - experiments/EXP-XEDN-006/runs/RUN-XEDN-006-MAIN/raw-result.json
        - experiments/EXP-XEDN-007/runs/RUN-XEDN-007-MAIN/raw-result.json
    implementation: experiments/EXP-XEDN-373466
    budget:
      stage1_wall_clock_seconds: 3600
      stage1_compute: "zero; source reading only"
      stage2_wall_clock_seconds: 1800
      stage3_wall_clock_seconds: 3600
      maximum_memory_gb: 2
      maximum_runs: 6

  falsification_conditions:
    - >-
      F1 (PRIMARY, ZERO COMPUTE) -- the archived search returns any value >= 4
      on any input, or a differing committed implementation variant is found
      that produced the archived results. Claim (I) is withdrawn by a
      superseding record.
    - >-
      F2 -- the positive controls fail (2 and 3 are not returned on planted
      relations of those infinity-norms). The diagnosis changes to
      implementation defect and NOTHING NEGATIVE MAY BE REPORTED.
    - >-
      F3 -- re-extraction shows corank >= 1 on any relation-bearing
      configuration. Mechanism (B)'s internal-contradiction claim is wrong.
    - >-
      F4 -- the reimplementation fails to reproduce the 14 committed outputs.
      The measured recovery table describes a different instrument and may not
      be attributed to the archived one.
    - >-
      F5 -- the recovery curve decays smoothly rather than stepping at k = 4
      and s = 5. The declared-ceiling explanation is wrong even if the numbers
      happen to fall the same way.
    - >-
      F6 (THE PLANNED NEGATIVE, PRE-REGISTERED BEFORE ANY RUN) -- if claim (I)
      is confirmed as expected, the batch has NOT finished unless it also emits
      the recovery table in full, the p = 31 confound resolution with its
      generic verification, and the concrete unbounded-search design of
      mechanism (E) with its measured cost. A confirmed ceiling that produces
      no successor instrument is a fatigue report and its honest status would
      be unverified.

  interpretation_limits:
    - >-
      CLAIM TIER toy, and no downstream citation may raise it. This audits an
      instrument. It moves NO exponent, is not an attack, makes no system
      easier to solve, and sota_delta is zero on every attack axis.
    - >-
      NO STATUS CHANGE to GOAL-XEDN-003, H-XEDN-005, DEC-20260730-001,
      DEC-20260730-002, EV-XEDN-005, EV-XEDN-006, KN-FIND-010 or KN-FIND-011 is
      proposed, implied, or permitted. Only the Coordinator may change a
      status. A disagreement with a committed record is expressed by a
