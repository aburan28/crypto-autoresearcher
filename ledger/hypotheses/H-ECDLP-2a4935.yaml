hypothesis:
  id: H-ECDLP-2a4935
  area: ECDLP
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  source_proposal: IDEA-20260815-bfb2f2
  proposal_id: IDEA-20260815-bfb2f2
  title: >
    Stage 0 certificate-verdict
    identities — six-class table,
    cross-instance rejected — before
    any campaign verifier is attacked
  status: specified
  proposed_by: idea-generator
  designed_by: coordinator
  designed_under_task: TASK-20260913-92b47f
  specified_by: DEC-20260913-e61b46
  specified_at: '2026-09-13'
  created: '2026-09-13'
  updated: '2026-09-13'
  depends_on:
    - IDEA-20260815-bfb2f2
    - RQ-ECDLP-002
  related_hypotheses: []
  statement: >
    Fix the closed-form
    certificate-verdict identities of
    IDEA-20260815-bfb2f2 on one frozen
    six-class table before any live
    campaign verifier is called and
    before any evidence record is
    re-checked. Stage 0 asserts only
    that valid accepts and that
    wrong_point, off_curve,
    wrong_scalar, replay, and
    off_by_one each reject; that a
    nearby claim that a cross-instance
    certificate accepts is rejected;
    and that an unconstructible class
    is reported rather than counted
    as a rejection. This is not an
    adversarial attack on the live
    verifier and not a rho beat.
    Stages 1+ stay unauthorized.
  mechanism: >
    IDEA-20260815-bfb2f2 tracks the
    verifier's verdict on invalid
    certificates. Stage 0 freezes
    the exact accept/reject table
    the later attack must reproduce
    so a later pass cannot be read
    from an instrument that cannot
    fail. No live verifier is
    called. No evidence record is
    reopened. No Semaev S_m. No
    DLP solve.
  predictions:
    - id: P-S0-CERTV
      metric: six-class verdict identities
      direction: different
      minimum_effect: >
        After fixture_pass, REAL
        accepts valid and rejects
        the five invalid classes.
        KF cross-instance-accept
        is rejected. NULL
        unconstructible is reported
        not counted as reject.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KF
      statement: >
        After fixture_pass, KF claim
        that a cross-instance
        certificate accepts is
        accepted.
    - id: F-S0-REAL
      statement: >
        After fixture_pass, REAL
        rejects valid or accepts any
        of the five invalid classes.
  test_boundary:
    instances:
      - frozen Stage 0 REAL / KF / NULL verdict-table panel
    parameters:
      real_table:
        valid: accept
        wrong_point: reject
        off_curve: reject
        wrong_scalar: reject
        replay: reject
        off_by_one: reject
      known_false:
        kind: cross_instance_accept
        must_reject: true
        required_verdict: reject
      matched_null:
        kind: unconstructible_class
        must_report_not_count_as_reject: true
      stage0_only_at_specify: true
    implementation: EXP-ECDLP-25be5c Stage 0 runner
    budget:
      wall_clock_seconds: 120
    prose: >
      Frozen six-row verdict table
      only. Stage 0 does not call
      the live campaign verifier
      and does not submit a
      certificate against evidence.
  assumptions:
    - id: A1
      statement: >
        The frozen table is the
        six-class map above.
        Stage 0 does not invoke
        the campaign verifier.
      status: explicit
    - id: A2
      statement: >
        Standing user authorization
        2026-09-06 covers protocol
        approval once the contract is
        complete.
      status: explicit
  heuristic_assumptions: []
  proof_search_map:
    bottleneck: >
      Whether valid accepts, the
      five invalid classes reject,
      and cross-instance accept is
      rejected.
    baseline_embedding:
      parameter_slice: >
        REAL six-class table, KF
        cross-instance accept, NULL
        unconstructible class.
      reproduction_check: >
        valid accept; five invalid
        reject. KF rejected. NULL
        reported not counted.
    observation_collision:
      observable: accept versus reject on a named class
      distinct_preimage_search: >
        Hold the table and claim
        cross-instance accepts (KF).
        Hold the method and drop
        constructibility (NULL).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Frozen six-class verdict table.
        predicted_gain: >
          Exact known-false reject on KF.
          Zero claimed verifier soundness.
    quantifier_order: >
      Freeze the six classes before
      reading verdicts. Table
      reproduction is not a live
      verifier attack.
    method_ceiling:
      strongest_certifiable_claim: >
        Instrument reproduction on
        the declared frozen table.
        Never a live-verifier
        soundness claim. Never an
        ECDLP exponent.
      nearby_object_control: >
        NULL is unconstructible.
        An argument that still
        counts it as a rejection
        is proves-too-much.
  knowledge_promotion:
    promoted: []
    not_warranted: Stage 0 design only. Nothing to promote.
  scientific_boundary: >
    Stage 0 P-S0-CERTV only. Not a
    live verifier attack. Not a
    claimed solve. Not Semaev S_m.
    Not Coppersmith. Not a DLP
    solve. Not a rho beat. No
    Stage 1 of EXP-ECDLP-25be5c.
