# H-CMFB-7d4e1a
# Orbit-arc factor base under the degree-5 CM endomorphism w of the D = -19
# crater curves of the family p = 5t^2 + 19t + 19: arc bases have one
# unknown logarithm (rank 1), and all of the cost sits in the
# decomposition search, which is BSGS-equivalent (T*M ~ N). Specifies
# IDEA-20261015-29fdc8 under RQ-CMFB-33610e.
#
# The expected reading is negative (no saving over BSGS, dominated by rho).
# The record exists to price the cost split and to check three cheap leak
# channels, not to look for an exponent change.
#
# ID minting note: this session had no shell. The token was drawn at random
# and checked for collisions by a repository-wide search for '[A-Z]-7d4e1a'
# (no match). `python3 tools/allocate_id.py --check H-CMFB-7d4e1a` must be run
# before the snapshot archive.
hypothesis:
  id: H-CMFB-7d4e1a
  question_id: RQ-CMFB-33610e
  source_idea: IDEA-20261015-29fdc8
  added: '2026-10-16'
  status: specified
  statement: >-
    Let E be a crater-type curve (End = O_K, K = Q(sqrt(-19)),
    w = (1 + sqrt(-19))/2, w^2 - w + 5 = 0) of prime order N over F_p for a
    family member p = 5v^2 - v + 1, N = 5v^2 - 2v + 4 (v = t + 2, t odd). Let
    G = E(F_p). (A) The endomorphism w acts on G as the scalar
    lambda = 2 v^{-1} mod N, and its x-map R (degree-5 rational map; the
    kernel is the F_p-rational pair of x-roots of twist 5-torsion) permutes
    x(G \ {O}) in s = (N - 1)/(2 ell) cycles of equal length ell, where ell
    is the order of lambda in F_N^* / {+-1}. At pair 46
    (p = 5947698030651343, N = 5947697996161643) ord(lambda) = (N - 1)/7,
    which is even, so s = 7 and ell = (N - 1)/14. (B) For an arc base
    A_L(P0) = {[lambda^a] P0 : 0 <= a < L} with L <= ell, every m = 2
    relation T = e1 [lambda^a] P0 + e2 [lambda^b] P0 (T = alpha P + beta Q)
    is linear in the two unknowns (k = log_P Q, x0 = log_P P0): two
    relations with nonzero 2x2 determinant determine k (one relation if
    P0 = P), against Theta(L) relations for a matched random base of L
    points. (C) Under HEUR-001 and HEUR-002 the expected number of point
    subtractions per relation in the meet-in-the-middle search is
    N / (2L + 1), so the cost of one DLP is L + R N / (2L + 1) group-level
    operations (R = 2 unknown log, R = 1 known log), minimised at
    sqrt(2 R N) with memory sqrt(R N / 2): the BSGS tradeoff curve, never
    below it. Quantified at toy sizes 2^18 < p <= 2^29: for every cell and
    every L = c sqrt(N), c in {0.5, 1, 2}, the cell mean of
    rho = (measured search ops per relation) / (N / (2L + 1)) has a 95
    percent interval inside [0.9, 1.1], the CM arc and the
    fake-endomorphism arc (scalar ratio drawn at random) do not differ by
    more than 0.1 in rho, and every DLP solve from the minimal number of
    relations is verified by [k]P = Q.
  mechanism: >-
    On a cyclic group of prime order every endomorphism acts as a scalar, so
    the orbit of w through a point P0 is the geometric progression
    lambda^a P0 and its logarithms are lambda^a x0: the factor base has one
    unknown. This moves the whole IC cost out of the linear algebra (which
    needs 2 relations instead of Theta(|V|)) and into the decomposition
    search, which is a sparse representation of T in F_N by two terms of a
    geometric progression. A point-level search for such a representation
    has only the meet-in-the-middle exponent, and with P0 = P it is literally
    baby-step giant-step with baby set {+-lambda^a P}. [lambda] is computable
    in O(log N) group operations, so the endomorphism oracle is
    generic-group simulable (KN-FIND-b7e091) and the Shoup bound applies to
    any algorithm built from it. The x-map R is a cheap generator for the
    arc (about 12 field multiplications per element against about 80 for a
    lift_x, idea notes section 3), a constant that does not touch the cost
    exponent. The cycle class of x(tP) under R is the class of t in
    F_N^* / <lambda, -1> (index 7 at pair 46), a power-residue character of
    the logarithm; an efficiently computable predictor of it from x would be
    a partial-information leak and is tested as a null.
  assumptions:
    - >-
      Standard CM theory (recalled, not re-derived): curves with j = -96^3
      over F_p with p split in K have End = O_K (class number 1); both
      degree-5 endomorphisms w and wbar are defined over F_p; the Frobenius
      is pi = v w - 1 for the family, so pi = -1 on E[w] (the kernel x-roots
      of w are F_p-rational and are twist 5-torsion). Checked per instance by
      the run: j, order, trace identity, the homomorphism property of the
      constructed map, and its eigenvalue.
    - >-
      On a cyclic group of prime order any group endomorphism is a scalar
      (elementary). Hence (A) and (B) are theorems once the map is verified
      as an endomorphism of E; the run checks the identity and the cycle
      structure as instrument-level confirmations, and a mismatch is a
      defect in the construction or in the idea's lambda convention, never a
      scientific signal about arc bases.
    - >-
      Numbered heuristics HEUR-001 to HEUR-004 below; HEUR-001 and HEUR-002
      carry claim (C).
  proof_search_map:
    bottleneck: >-
      the decomposition search over the arc (sparse two-term representation
      in F_N), not the linear algebra
    baseline_embedding:
      parameter_slice: >-
        P0 = P, m = 2 is BSGS with baby set {+-lambda^a P} and giant steps
        T - e [lambda^b] P; with lambda replaced by a random unit c it is the
        fake-endomorphism control
      reproduction_check: >-
        known-log arm of the contract: one relation per DLP, total cost
        L + N/(2L+1), verified by [k]P = Q on every instance and every c
    observation_collision:
      observable: >-
        relations needed to determine k, and rho = search ops per relation
        over N/(2L+1)
      distinct_preimage_search: >-
        the CM arc (ratio lambda) and the fake arc (ratio a random unit c of
        large order) must give the same rank and the same rho; a difference
        is the only signal that CM structure matters
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: c disjoint arcs (c unknowns), interpolating to the naive base
        predicted_gain: none; cost N (c + 1) / (2 c L) per idea notes section 2
    quantifier_order: >-
      for every admitted family member E in the cell, for every
      c in {0.5, 1, 2}, with L = round(c sqrt(N)) fixed before any search,
      the arc and the targets are drawn from frozen seeds independent of k;
      no choice depends on k or on Q
    method_ceiling:
      strongest_certifiable_claim: >-
        arc bases with m = 2 cost at least about sqrt(2 R N) group operations
        per DLP at the tested sizes (equal to BSGS), i.e. no saving
      nearby_object_control: >-
        matched random base of L points (Theta(N) total), known-log arc
        (exact BSGS), fake-endomorphism arc
    proof_obligations:
      - claim: R acts as the scalar lambda (or 1 - lambda for wbar) on G
        responsibility: correctness
      - claim: arc relations have at most 2 unknowns (k, x0)
        responsibility: interface
      - claim: search ops per relation N/(2L+1) under HEUR-001/HEUR-002
        responsibility: runtime
      - claim: memory L table entries; T*M ~ N along the BSGS curve
        responsibility: memory
      - claim: scope is family crater curves at 2^18 < p <= 2^29 plus primitive checks at pair 46
        responsibility: scope
    not_applicable_reason: null
  rerandomization: >-
    targets T = alpha P + beta Q with alpha, beta uniform from a seeded stream
    independent of k; each relation is a fresh uniform group element
  asymptotic_claim:
    problem: ECDLP on prime-order prime-field CM curves (D = -19 family)
    prior_best: Pollard rho with negation map, about 0.886 sqrt(N) group operations, O(1) memory
    time_exponent: N^{1/2} (claimed equal to BSGS, no improvement)
    memory_exponent: N^{1/2}
    hidden_cofactor: >-
      factor sqrt(2R)/0.886 over rho (about 1.6 for the known-log arc at its
      optimum, 2.3 for the unknown-log arc), plus table memory
    claim_kind: constant_factor
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        For N prime, lambda a unit of order at least 2L in F_N^*/{+-1}, and
        L = c sqrt(N) with c in {0.5, 1, 2}, the L^2 signed sums
        {e1 lambda^a + e2 lambda^b : 0 <= a <= b < L} taken up to global
        sign cover a fraction 1 - exp(-2 L^2 / (N - 1)) of the (N - 1)/2
        nonzero classes of F_N / {+-1}, within the same deviation as L^2 sums
        built from L uniformly random distinct units (random-set control);
        the class multiplicities follow the same law as for the random set.
      random_model_justification: >-
        a 4-term +-1 identity lambda^a +- lambda^b = +-lambda^c +- lambda^d
        is a +-1 polynomial of degree < L vanishing at lambda mod N; over Z
        such a polynomial is never divisible by x^2 - x + 5 (its roots have
        modulus sqrt(5) > 2, the Cauchy bound for +-1 coefficients), so
        vanishing mod N is a 1/N event per polynomial, which is the birthday
        count of a random set
      supporting_results:
        - >-
          additive-energy bounds for geometric progressions in F_N
          (Bourgain-Glibichuk-Konyagin type sum-product estimates); recalled,
          not read; a pointer for the reviewer only
      validation_experiment_ids: [EXP-CMFB-b36f58]
      falsification_condition: >-
        in any cell and any c in {0.5, 1} (coverage saturates at c = 2),
        the cell mean of (coverage of the GP sum set) / (coverage of the
        matched random-set sum set) - 1 has a 99 percent interval excluding
        [-0.01, +0.01]
    - id: HEUR-002
      formal_statement: >-
        For a uniform target T and the arc table {+-[lambda^a] P0 : a < L},
        the candidates U_b = T - e2 [lambda^b] P0 hit the table (or O) at
        marginal rate (2L + 1)/N and the expected number of candidates per
        found relation is N/(2L + 1) (renewal ratio, ignoring within-target
        dependence).
      random_model_justification: >-
        T is uniform in G and independent of the arc; each U_b is then
        uniform; within one target the candidates are dependent through T,
        which the renewal ratio E[ops per target]/P(hit per target) absorbs
        only if hits are not clustered, which is HEUR-001
      supporting_results:
        - geometric-trial expectation; HEUR-001
      validation_experiment_ids: [EXP-CMFB-b36f58]
      falsification_condition: >-
        cell mean of rho with a 99 percent interval entirely below 0.8
        (structure beyond BSGS) or entirely above 1.2 (worse than the model)
        for the CM arc in any cell and c
    - id: HEUR-003
      formal_statement: >-
        The cycle class of x under R (the class of log_P of the point in
        F_N^* / <lambda, -1>) is statistically independent of the cheap
        invariants Legendre(x/p), x mod 3, x mod 5, x mod 7, the top 8 bits
        and the bottom 8 bits of x.
      random_model_justification: >-
        the class is a power-residue character of the discrete logarithm;
        a correlation with a cheap function of x would be a hard-core-bit
        type leak that no known result provides for prime-order curves
      supporting_results:
        - >-
          no rigorous result; GGM intuition (KN-FIND-b7e091) only
      validation_experiment_ids: [EXP-CMFB-b36f58]
      falsification_condition: >-
        Holm-adjusted G-test p-value below 1e-4 for any invariant, with the
        plug-in mutual information above the 99.9th percentile of its
        permutation null, at pair 46 or pooled over toy instances with s >= 2
    - id: HEUR-004
      formal_statement: >-
        Bateman-Horn member counts for the pair (p(t), N(t)), t odd, in the
        band 2^25 < p <= 2^29 predict at least 8 members.
      random_model_justification: standard prime-pair heuristic
      supporting_results:
        - Bateman-Horn conjecture (recalled); EXP-CMFB-cea1d2 pre-freeze sieve gave 10 and 13 members in the two lower bands
      validation_experiment_ids: [EXP-CMFB-b36f58]
      falsification_condition: exact sieve count below 8 in the top cell (changes power only, never a reading)
  structural_ingredients:
    - description: Scalar action of endomorphisms on a cyclic group of prime order
      citation: elementary group theory
      provenance: internal
      verified_by: checked per instance by the run (identity on random points)
      role: correctness of claims A and B
    - description: GGM simulability of endomorphism oracles and the Shoup lower bound
      citation: KN-FIND-b7e091
      provenance: internal
      verified_by: knowledge/findings/KN-FIND-b7e091.md (proof_status derivation)
      role: method ceiling (no generic algorithm below sqrt(N))
    - description: First-cycle time of the random graph process
      citation: Flajolet, Knuth, Pittel, "The first cycles in an evolving graph" (1989)
      provenance: recalled
      verified_by: null
      role: loose prediction for relations needed by the matched random base
  reduction_chain:
    core_problem: ECDLP on the tested family curves
    corollaries: []
  predictions:
    - metric: eigenvalue of the rational-kernel degree-5 endomorphism R on G
      direction: different
      minimum_effect: >-
        equals +-lambda = +-2/v mod N on every instance (the wbar map gives
        +-(1 - lambda)); any other value is CLAIM_A_DEFECT
    - metric: R-cycle count and lengths on x(G \ {O})
      direction: different
      minimum_effect: >-
        all cycles of length ell = ord(lambda in F_N^*/{+-1}), count
        (N - 1)/(2 ell), exactly, on every enumerated instance; at pair 46
        ord(lambda) = (N - 1)/7 (s = 7)
    - metric: relations needed to determine k
      direction: lower
      minimum_effect: >-
        exactly 2 for the unknown-log arc and 1 for the known-log arc (up to a
        degenerate determinant of probability O(1/N)), against at least
        0.05 L for the matched random base of L points
    - metric: rho = search ops per relation / (N/(2L+1)), cell mean
      direction: different
      minimum_effect: 1 predicted; 95 percent interval inside [0.9, 1.1]
    - metric: GP sum-set coverage over matched random-set coverage, minus 1
      direction: different
      minimum_effect: 0 predicted; 95 percent interval inside [-0.01, +0.01]
    - metric: mutual information of the cycle class with cheap invariants of x
      direction: different
      minimum_effect: 0 within the permutation null
  test_boundary:
    instances:
      - "family crater curves p = 5t^2+19t+19, N = 5t^2+18t+20 both prime, t odd, cells C20 = (2^18, 2^22], C24 = (2^22, 2^25], C28 = (2^25, 2^29], at most 8 admitted per cell"
      - "pair 46 crater curve over p = 5947698030651343 for primitive checks only (identity, ord(lambda), class leak, sum-set collision tail, R evaluation cost)"
    parameters:
      m: 2
      arc_length: "L = round(c sqrt(N)), c in {0.5, 1, 2}"
      relations_per_arm_instance_c: 256
      resolution_rho: 0.1
      resolution_coverage: 0.01
    implementation: >-
      experiments/EXP-CMFB-b36f58 (specification.yaml; launcher not yet
      written, see the specification's launcher block)
    budget:
      wall_clock_seconds_total: 7200
      maximum_memory_gb: 8
      maximum_workers: 4
  distinguishable_outcomes:
    - "INSTRUMENT_VOID: an instrument gate fails (endomorphism verification, brute-force search check, planted-target or planted-AP control, DLP verification); no reading"
    - "BSGS_EQUIVALENT_AT_RESOLUTION: the positive reading of this hypothesis (all channel predictions hold at the stated resolutions)"
    - "STRUCTURE_BEYOND_BSGS: CM-arc rho 99 percent interval below 0.8 in some cell while the fake arc is consistent with 1; a lead needing replication"
    - "H1_VIOLATED: GP coverage differs from the random-set control beyond 1 percent (scoped falsification of HEUR-001, sign reported)"
    - "CLASS_LEAK: HEUR-003 rejected"
    - "CLAIM_A_DEFECT: verified endomorphism with an eigenvalue or cycle structure off the prediction"
    - "INCONCLUSIVE: no channel is decided at its resolution"
  falsification_conditions:
    - "a verified endomorphism whose eigenvalue is not +-lambda or +-(1 - lambda), or a cycle structure off the prediction, on any instance (claims A, B)"
    - "CM-arc rho 99 percent interval below 0.8 in any cell and c, or the CM-arc minus fake-arc contrast 99 percent interval below -0.1 (claim C)"
    - "HEUR-001 falsification condition"
    - "HEUR-003 falsification condition"
  interpretation_limits:
    - "Single-arc bases with m = 2 only; c disjoint arcs, m >= 3 and target-dependent bases are not tested."
    - "Toy sizes 2^18 < p <= 2^29 for every cost and coverage statement. Pair 46 enters only through primitive checks; the transfer of HEUR-001 and HEUR-002 to 2^52 is an assumption, supported at pair 46 by a sum-set collision tail check only."
    - "Crater curves only (End = O_K); the floor curve (conductor v) is not constructed."
    - "Operation counts are group-level (point subtractions, table probes, endomorphism evaluations) and are priced against rho at 0, 0.1 and 1 GAE per unpriced native operation; wall-clock is CPython and is reported, never ranked."
    - "A BSGS-equivalent reading is a statement about this construction at these sizes; it is not a general impossibility statement (the generic lower bound is KN-FIND-b7e091's, not this experiment's)."
  refutation_basis: >-
    Should the evidence later support weakening any improvement claim for arc
    bases, the strongest available artifact is a derivation: the scalar
    action argument above plus KN-FIND-b7e091 (endomorphism oracles are
    GGM-simulable). The run is the empirical check of the constants and the
    leak channels; it is not the proof.
  not_claimed: >-
    No exponent, no improvement over rho or BSGS, no statement about the
    floor curve, about m >= 3, or about any curve outside the tested family
    sizes except the listed pair-46 primitive checks.
  status_rationale: >-
    Specified under design-experiment step 3. The contract
    experiments/EXP-CMFB-b36f58/specification.yaml is complete as a protocol
    and is held at review_required because no launcher exists. No evidence
    exists.
  proposed_by: coordinator
