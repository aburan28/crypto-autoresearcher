hypothesis:
  id: H-MLKEM-012
  question_id: RQ-MLKEM-003
  goal_id: GOAL-MLKEM-003
  title: >-
    Carrier CC NIST shortfalls are erased by ≲15 bits of Pwrong underestimation
    under HEUR-S1
  statement: >-
    Using Carrier CC intermediates and Theorem 4.1, if an underestimation of
    log2(Pwrong) by Δ bits is paid entirely by increasing the R·(N·Tdec+TFFT)
    term by Δ (HEUR-S1 / Case A), then the minimal such Δ that brings the total
    cost to the NIST classical cutoffs 143/207/272 is less than 15 bits for
    every Kyber-512/768/1024 set — far below the ~84-bit Fig 4.1→Kyber-512
    Pwrong floor gap of KN-FIND-012.
  mechanism: >-
    CC totals are Tsample-dominated with thin margins (3.5/11.9/12.3 bits).
    The false-candidate budget ε ∝ Pwrong; restoring ε after a Pwrong miss
    inflates the FFT/decode term. Once that term overtakes Tsample, NIST
    cutoffs are crossed after only a few bits of Δ.
  heuristic_assumptions:
    - id: HEUR-S1
      formal_statement: >-
        An underestimation of log2(Pwrong) by Δ bits, at fixed success
        probability, requires at least +Δ bits in log2(R·(N·Tdec+TFFT)).
      validation_experiment_ids: [EXP-MLKEM-012]
      falsification_condition: >-
        A documented Carrier re-optimization shows ε can be restored with
        o(Δ) growth in that term for Δ up to 20.
    - id: HEUR-S2
      formal_statement: >-
        Adding Δ to the full Theorem 4.1 total is a crude upper envelope on
        the underestimation penalty (not a tight re-optimization).
      validation_experiment_ids: [EXP-MLKEM-012]
      falsification_condition: null
  predictions:
    - metric: min_Delta_CaseA_to_meet_nist
      direction: lower
      minimum_effect: less_than_15_on_all_three_sets
  falsification_conditions:
    - Case A crossover Δ > 15 on any Kyber set
  interpretation_limits:
    - Conditional sensitivity, not a measured Pwrong error
    - Not an ML-KEM break; does not replace Carrier's table with a new estimate
  status: analyzed
  proposed_by: coordinator
  approved_by: coordinator
  approved_at: '2026-07-31'
  evidence_ids: [EV-MLKEM-012]
