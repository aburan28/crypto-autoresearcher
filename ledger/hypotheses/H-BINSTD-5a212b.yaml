hypothesis:
  id: H-BINSTD-5a212b
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261001-0fcbe2
  derived_from_idea: IDEA-20261001-0fcbe2
  experiment_id: EXP-BINSTD-8bdf86
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-03'
  approved_at: '2026-10-03'
  authorised_by: DEC-20261003-555f72
  status: approved
  proposed_by: coordinator
  title: >-
    At toy Koblitz n=17 with frozen ℓ∈{3,4}, either no φ-invariant F_2-subspace
    of dimension ℓ exists (structural E-NO-TAU-CLOSED-AT-ELL), or a τ-closed V
    of that dim raises Semaev m=3 relation success by ≥1.25× vs a matched-dim
    open V under the exhaustive FB-sum pin — or the band fails

  statement: >-
    SETTING. Binary Koblitz analog Y^2+XY=X^3+1 over F_{2^{17}} with modulus
    t^{17}+t^3+1. Factor base = points with x-coordinate in an F_2-subspace V.
    τ-closed means V is φ-invariant (x↦x^2), equivalently (normal basis) a
    circulant code / ideal of F_2[x]/(x^n-1). Solver pin: exhaustive ordered
    m=3 FB-sum (admitted toy pin; not XOR-SAT).

    CLAIM. For each Stage-0-frozen cell (n=17, ℓ∈{3,4}):
      (i) if ℓ ∉ admissible_φ_invariant_dims(n), the cell label is
          E-NO-TAU-CLOSED-AT-ELL and HEUR-BINSTD-0fcbe2-H1's ≥1.25 band is
          not applicable at that cell; OR
      (ii) if ℓ is admissible, on ≥40 matched random targets under the frozen
          pin, R_τ ≥ 1.25 × R_open with both arms nonzero (E-TAU-RICHER),
          else E-TAU-NOT-RICHER / O-INCONCLUSIVE as defined.
    Overall Stage-1 outcome is exactly one of E-TAU-RICHER |
    E-TAU-NOT-RICHER | E-NO-TAU-CLOSED-AT-ELL | O-INCONCLUSIVE | O-IMPEDIMENT.

    TEST BOUNDARY. Stages 0-1 only. Stdlib GF(2^n)+curve arithmetic. No
    Magma/Sage/AUXIN/Bedrock. No n∈{23,31} / Boolean-null Stage 2. NO break,
    exponent, or deployed insecurity claim. certificate.kind=none.

    FALSIFICATION OF HEUR-BINSTD-0fcbe2-H1 (within boundary). An admissible
    cell completes with both arms nonzero and R_τ < 1.25 × R_open while the
    report claims E-TAU-RICHER. Structural emptiness is NOT falsification of
    the band — it is a scope obstruction. Budget / missing Stage-0 freeze is
    O-IMPEDIMENT, never negative mathematical evidence.

  mechanism: >-
    OBJECT FRAME. Representation: F_2-subspace V ⊆ F_{2^n} as FB abscissae
    (KR-IC-73db3f) with φ-invariance as the τ-closed predicate (KR-IC-b0fcda).
    Operation set: saturate under x↦x^2; match dim of an open control; run
    identical exhaustive m=3 FB-sum attempts. Trichotomy: Class I
    partial-action (relation under FB translation). Lossy-projection: success
    bit discards which triples hit. OFF-LIMITS: orbit-attempt counting on a
    fixed open V (IDEA-20261001-cb6a72); usable_dimensions predictors
    (fbee3f / 880180); walk-constant √(2n) (833e78); XOR-SAT / Magma / Sage /
    AUXIN / Bedrock as the success path.

  predictions:
    - metric: success_rate_ratio_tau_over_open
      direction: lower_bounded
      minimum_effect: '≥ 1.25 at each admissible (n,ℓ) cell'
    - metric: target_count
      direction: lower_bounded
      minimum_effect: '≥ 40 matched targets per admissible cell'
    - metric: structural_precondition_certified
      direction: higher
      minimum_effect: 'admissible φ-dims listed before any yield ratio'

  test_boundary: >-
    Stages 0-1; n=17; ℓ∈{3,4}; stdlib exhaustive FB-sum pin; no Stage 2;
    certificate.kind=none.

  falsification_criteria: >-
    Editing the ≥1.25 band after Stage-1 outcomes; claiming practical binary
    IC or a break/exponent from a toy yield win or from structural emptiness;
    transferring the band to n≥131 without a new contract; treating missing
    Stage-0 freeze as mathematical falsification.

  heuristic_assumptions:
    - id: HEUR-BINSTD-0fcbe2-H1
      formal_statement: >-
        FORALL admissible cells (n,ℓ) with ℓ ∈ admissible_φ_invariant_dims(n)
        among the Stage-0-frozen panel: on ≥40 matched random targets under
        the frozen solver pin, R_τ ≥ 1.25 × R_open where R is the empirical
        Semaev m=3 success rate on τ-closed vs matched-dim open V.
      random_model_justification: >-
        Rigorous: KR-IC-b0fcda — τ-orbits collapse equivalent FB points, so a
        closed V packs more inequivalent x-coordinates per dim than a random
        open V of the same dim, when such a closed V exists. Classical: if
        packing dominates, R_τ rises; if closure forces worse product-space
        geometry, R_τ may fall. The ≥1.25 band is the pre-registered transfer
        hypothesis at toys — not a claim of the 1/n asymptotic or any
        exponent vs rho. Structural non-existence of closed V at a cell is
        certified via F_2-factorization of x^n-1 and removes that cell from
        the band's domain.
      supporting_results:
        - KR-IC-b0fcda
        - KR-IC-73db3f
      validation_experiment_ids:
        - EXP-BINSTD-8bdf86
      falsification_condition: >-
        An admissible completed cell with both arms nonzero and
        R_τ < 1.25 × R_open while claiming E-TAU-RICHER; OR post-hoc band
        edit. Structural E-NO-TAU-CLOSED-AT-ELL is not band falsification.

  proof_search_map:
    not_applicable_reason: >-
      Empirical / structural instrument hypothesis calibrating KR-IC-b0fcda at
      toys (and certifying when the τ-closed dim-ℓ cell is empty). No theorem,
      asymptotic bound, or certificate family is claimed beyond the
      F_2-factorization of x^n-1 used as a scope gate. Baseline reproduction
      is the admissible-dim table against the known cyclotomic factorization.

  interpretation_limits:
    - Toy yield / structural scope only; does not beat rho or invent τ-stable FB.
    - Shared exhaustive pin; a different encoder needs a new contract.
    - E-NO-TAU-CLOSED-AT-ELL does not refute τ-stable FB at admissible dims.

