# =============================================================================
# H-BINSTD-6feaa2 -- Dimension-5/6 Weil-polynomial census for 131 | #A(F_2)
# Specified from IDEA-20260926-5c26f9 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Approved DEC-20261002-820b87.
#
# HOLD-X3 DX-09 bundle survivor (consolidates IDEA-20260926-6f2601 valuation
# certificate and IDEA-20260926-80209d toy-modulus ladder as controls).
# ZERO RUNS in this design packet. No AUXIN. No Bedrock. No curve attack.
# Unlocks the KN-OPEN-095df5 g<=6 structural-emptiness column of RQ-BINSTD.
# =============================================================================
hypothesis:
  id: H-BINSTD-6feaa2
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260926-5c26f9
  experiment_id: EXP-BINSTD-7d37fc
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-820b87
  status: approved
  proposed_by: coordinator
  title: >-
    An exact Rolle-pruned Weil-polynomial census at g in {5,6} over F_2,
    completeness-controlled against LMFDB class counts and the g<=4 baseline,
    decides whether any abelian variety over F_2 of dimension <=6 has a
    rational point of order 131

  statement: >-
    CLAIM (structural certificate; HOLD-X3). KN-OPEN-095df5 excludes
    Couveignes-Lercier bases at n=131 for abelian varieties over F_2 of
    dimension g<=4 (0 hits; exact_targets.py). HYPOTHESIS: (A) a Rolle-pruned
    depth-first exact enumerator with integer Sturm tests and a_g pinned by
    h(3)=0 (mod 131) reaches g in {5,6} in hours on one core under HEUR-BINSTD-
    5c26f9-H1; (B) the unfiltered class counts at g=4,5,6 reproduce the LMFDB
    completeness control 1645, 14325, 164937, and the g<=4 filtered run
    reproduces 0 hits with counts 5,35,215,1645; (C) the filtered census at
    g=5 and g=6 returns either ZERO hits (outcome A: exclusion extends to
    dimension 6) or a small explicit hit list (outcome B: candidate isogeny
    classes only — not a factor base, not a Jacobian certificate, and any
    Couveignes-Lercier use is constrained by IDEA-20260926-6f2601 to the
    non-linear shape). CLAIM TIER: structural certificate / measurement.
    NO attack. NO exponent. NO ECC2K-130 break. NO Magma/Sage/AUXIN required
    for the primary path (pure Python integers + sympy re-verification only).

  mechanism: >-
    NO NEW TRACKED OBJECT on E(F_{2^131}). Object = isogeny class of an
    abelian variety over F_2, represented by its real Weil polynomial
    h in Z[x] of degree g. Sigma = none on the curve; enumeration is over
    integer coefficient vectors. Trichotomy / lossy-projection on E: not
    applicable (certificate column). WHAT IS NEW relative to
    analysis/couveignes-lercier-131/exact_targets.py: (i) top-down
    Rolle-pruned search order instead of per-target full-box head
    enumeration (infeasible at g=5/6); (ii) congruence pinning of a_g by
    h(3)≡0 (mod 131); (iii) unfiltered LMFDB completeness control at
    g=4,5,6; (iv) HOLD-X3 nearby-object toy-modulus ladder from
    IDEA-20260926-80209d; (v) explicit binding of IDEA-20260926-6f2601's
    valuation / non-linear-shape ceiling so outcome B cannot be over-read
    as a factor-base unlock. Charged stage: none on ECDLP — structural
    emptiness certificate for one RQ-BINSTD reachability-table column.

  assumptions:
    - >-
      Honda-Tate / Tate isogeny: over F_2, monic integer polynomials whose
      roots are Weil 2-numbers biject with isogeny classes; tested by the
      unfiltered LMFDB count control, not trusted blindly.
    - >-
      Multiples of 131 below the integer Weil ceiling are exactly 51 at g=5
      (ceiling 6725) and 299 at g=6 (ceiling 39201); any other value is
      O-TRANSCRIPTION in this contract.
    - >-
      LMFDB unfiltered class counts 1645 (g=4), 14325 (g=5), 164937 (g=6)
      over F_2 are the completeness control (retrieved in the idea; cited
      provenance:retrieved). A mismatch of >=1 voids outcome-A certificate
      reading (O-INCOMPLETE).
    - >-
      Jacobian screen a_r >= 0 is NECESSARY only; a pass is "undecided",
      never "is a Jacobian".
    - >-
      Runtime under HEUR-BINSTD-5c26f9-H1: minutes at g=5, hours at g=6 on
      one core (estimate). Exceeding 10x the estimate triggers cheap
      necessary filters before Sturm (O-RUNTIME), not a math falsification
      of the emptiness claim.
    - >-
      No Magma/Sage/cypari2/AUXIN/Bedrock required; primary path is stdlib
      + sympy re-verification only.

  proof_search_map:
    bottleneck: >-
      Exact real-rootedness test count under Rolle pruning at g in {5,6}
      with a_g pinned by h(3)≡0 (mod 131). Decidable by: Stage-0 arithmetic
      freeze (ceilings, multiples 51/299); Stage-1 g<=4 reproduction +
      unfiltered LMFDB control; Stage-2 g=5/6 filtered census; Stage-3
      dual box-test agreement + toy-modulus nearby-object control.
    baseline_embedding:
      parameter_slice: >-
        Incumbent = exact_targets.py at g<=4 (0 hits; 104 and 234220
        candidate-equivalents; unfiltered 5,35,215,1645). Degenerate case
        of THIS proposal: run the new enumerator at g<=4 and require exact
        match before any g=5/6 claim.
      reproduction_check: >-
        Zero-compute Stage 0: recompute ceilings 6725/39201 and multiples
        51/299. Stage 1: exact_targets_g56.py --max-dim 4 must report 0
        hits at every g<=4 and unfiltered counts 5,35,215,1645. Any
        deviation is O-TRANSCRIPTION / instrument defect before g=5.
    observation_collision:
      observable: >-
        "Zero filtered hits at g in {5,6} means no AV/F_2 of dim <=6 has
        a rational point of order 131."
      distinct_preimage_search: >-
        Colliding preimages without this contract: (i) incomplete
        enumeration (caught by LMFDB unfiltered count); (ii) wrong box
        test (caught by g<=4 reproduction + dual Sturm/sympy agreement);
        (iii) genuine emptiness. False hit preimage: wrong box test
        (caught by second implementation). Identifying tuple:
        (stage0_arithmetic, g4_reproduction, unfiltered_counts,
         filtered_hits, dual_box_agreement, toy_modulus_control).
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Exact Rolle-pruned enumerator + congruence a_g pinning + LMFDB
          completeness control + 80209d toy-modulus nearby-object control,
          with 6f2601 non-linear-shape ceiling bound on outcome B.
        predicted_gain: >-
          Extends KN-OPEN-095df5 exclusion from g<=4 to g<=6 (outcome A)
          or produces an explicit candidate list (outcome B) without
          claiming a factor base; unlocks the RQ-BINSTD structural-
          emptiness column at certificate grade.
    quantifier_order: >-
      FOR ALL integer real Weil polynomials h of degree g in {5,6} with
      roots in [-2√2, 2√2]: 131 does not divide h(3) (outcome A), OR THERE
      EXISTS such an h (outcome B). The enumeration decides which; the
      unfiltered LMFDB count certifies the FOR ALL reading of outcome A.
      NOT claimed: dim>=7 emptiness; torus/unipotent rows; Jacobianhood of
      any hit; a factor base; any ECDLP cost bound; ECC2K-130 break.
    method_ceiling:
      strongest_certifiable_claim: >-
        Either "no abelian variety over F_2 of dimension <=6 has a
        rational point of order 131" (outcome A, completeness-controlled)
        or "the listed isogeny classes are the only dim<=6 candidates
        with 131 | #A(F_2)" (outcome B) — never a Jacobian certificate
        and never a Couveignes-Lercier factor-base unlock without the
        6f2601 non-linear-shape ceiling.
      nearby_object_control: >-
        (i) g<=4 baseline reproduction; (ii) null moduli (mod 5 at g=1
        returns the 5-point class; mod 1 returns every class); (iii)
        IDEA-20260926-80209d seven toy moduli at g<=3 with hand-derived
        answers; (iv) dual box-test implementations must agree.
    proof_obligations:
      - claim: >-
          Stage-0 ceilings / multiples 51 and 299 reproduce from
          (3+2√2)^g arithmetic.
        responsibility: correctness
      - claim: >-
          Stage-1 g<=4 and unfiltered LMFDB counts match before any g=5/6
          certificate reading.
        responsibility: baseline
      - claim: >-
          Dual box-test agreement on every hit and on a random sample of
          pruned nodes; ambiguous-near-boundary count reported.
        responsibility: correctness
      - claim: >-
          Outcome B never upgraded to Jacobian / factor-base / ECDLP
          attack; 6f2601 ceiling stated beside any hit list.
        responsibility: scope

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Structural certificate only; asymptotic_claim.claim_kind on the source
    idea is structural_certificate with no ECDLP time/memory exponent.

  heuristic_assumptions:
    - id: HEUR-BINSTD-5c26f9-H1
      formal_statement: >-
        The number of Rolle-surviving partial vectors at level g-1 is
        within a factor 10 of the isogeny-class count at dimension g-1
        (1645 at g=5, 14325 at g=6), so the total exact-test count is
        about 10^7 at g=5 and 10^8 at g=6 on one core.
      random_model_justification: >-
        Survivors at level k are integer points of a scaled real-rooted
        region whose volume is comparable to the dimension-k class
        region. Calibration from class-count growth 5,35,215,1645
        (factor ~7–9 per dimension). Runtime heuristic only — does not
        support the emptiness claim.
      supporting_results:
        - KN-OPEN-095df5 (internal; g<=4 exact zero)
        - LMFDB q=2 g<=6 class counts (retrieved; completeness control)
        - analysis/couveignes-lercier-131/exact_targets.py (internal)
      validation_experiment_ids:
        - EXP-BINSTD-7d37fc
      falsification_condition: >-
        Level-(g-1) survivor count at g=6 exceeds 10×14325 without the
        contract inserting cheap necessary filters (Newton log-concavity,
        sign conditions) before Sturm → O-RUNTIME (design amendment),
        not a refutation of outcome A/B math content. Unfiltered count
        mismatch or dual-test disagreement falsifies the instrument, not
        this runtime heuristic alone.

  structural_ingredients:
    - description: Open-problem exclusion at g<=4 and named g=5/6 next test.
      citation: KN-OPEN-095df5
      provenance: internal
      verified_by: coordinator (knowledge/open-problems/KN-OPEN-095df5.md exists)
      role: prior exclusion this census extends
    - description: Exact box-test baseline script (g<=4).
      citation: analysis/couveignes-lercier-131/exact_targets.py
      provenance: internal
      verified_by: coordinator (read header + method docstring 2026-10-02)
      role: Stage-1 reproduction baseline
    - description: HOLD-X3 consolidated valuation / non-linear-shape ceiling.
      citation: IDEA-20260926-6f2601
      provenance: internal
      verified_by: coordinator (proposal on main; consolidated into 5c26f9)
      role: outcome-B interpretation ceiling
    - description: HOLD-X3 consolidated toy-modulus nearby-object ladder.
      citation: IDEA-20260926-80209d
      provenance: internal
      verified_by: coordinator (proposal on main; consolidated into 5c26f9)
      role: Stage-3 nearby-object control
    - description: LMFDB complete isogeny-class counts over F_2 at g=4,5,6.
      citation: LMFDB abelian varieties over finite fields (q=2, g=4/5/6)
      provenance: retrieved
      verified_by: >-
        idea-generator (IDEA-20260926-5c26f9 citations; counts 1645/14325/164937)
      role: Stage-1/2 completeness control
    - description: Honda-Tate / Tate isogeny correspondence over prime fields.
      citation: Waterhouse 1969; Honda-Tate (recalled)
      provenance: recalled
      verified_by: null
      role: pointer only until unfiltered count control tests it

  reduction_chain:
    core_problem: >-
      Decide whether any abelian variety over F_2 of dimension <=6 has a
      rational point of order 131 (KN-OPEN-095df5 / RQ-BINSTD column).
    corollaries:
      - problem: >-
          Extend or replace the g<=4 exclusion note on KN-OPEN-095df5 by an
          additive superseding finding after independent review (not in
          this design packet).
        reduction_ref: IDEA-20260926-5c26f9 + HOLD-X3
        asymptotics_preserved: n/a (certificate)

  predictions:
    - metric: multiples_of_131_below_ceiling_g5_g6
      direction: same
      minimum_effect: Exactly 51 (g=5) and 299 (g=6)
    - metric: unfiltered_class_counts_g4_g5_g6
      direction: same
      minimum_effect: Exactly 1645, 14325, 164937 (LMFDB)
    - metric: filtered_hits_g5_g6
      direction: different
      minimum_effect: >-
        No direction pre-committed; zero (O-EMPTY-TO-6) and a small
        positive list (O-HIT-LIST) are both live deliverables; >~100 hits
        at g=6 triggers re-check before belief
    - metric: ambiguous_near_boundary_count
      direction: same
      minimum_effect: Zero expected; nonzero → O-AMBIGUOUS
    - metric: dual_box_test_disagreements
      direction: lower
      minimum_effect: Exactly 0 on hits and on the pruned-node sample

  test_boundary:
    instances:
      - stage0_arithmetic: >-
          Weil ceilings at g=5,6; multiples 51,299; box-size / gap notes
          from the idea's zero-run part
      - stage1_baseline: >-
          exact_targets_g56.py --max-dim 4 filtered+unfiltered vs
          exact_targets.py / LMFDB counts 5,35,215,1645
      - stage2_census: >-
          --dims 5 6 --modulus 131 → exact_targets_g56.json hit list
          (possibly empty)
      - stage3_controls: >-
          null moduli (5 at g=1; 1 = all classes); IDEA-20260926-80209d
          seven toy moduli at g<=3; dual Sturm/sympy agreement
      - no_curve_cell: >-
          Instance is the pair (g, 131); no ECC2K-130 / FIPS curve run
    parameters:
      dimensions: [5, 6]
      modulus: 131
      q: 2
      baseline_max_dim: 4
      lmfdb_counts: {4: 1645, 5: 14325, 6: 164937}
      expected_multiples: {5: 51, 6: 299}
      runtime_estimate_factor_fail: 10
      pruned_sample_size: 10000
    implementation: >-
      experiments/EXP-BINSTD-7d37fc/implementation/ plus
      analysis/couveignes-lercier-131/exact_targets_g56.py (new). May read
      analysis/couveignes-lercier-131/exact_targets.py, weil_census.py,
      census.json, exact_targets.json as read-only inputs. Pure Python
      integers + sympy for re-verification only. No Magma/Sage/cypari2;
      no AUXIN; no Bedrock.
    budget:
      maximum_runs: 4
      total_cpu_hours_advisory: 12.0
      wall_clock_seconds_advisory: 43200

  falsification_conditions:
    - >-
      Multiples at g=5,6 are not 51 and 299 → O-TRANSCRIPTION (arithmetic
      error in the frozen Stage-0 table).
    - >-
      Unfiltered counts miss LMFDB 1645/14325/164937 by >=1 → O-INCOMPLETE;
      outcome A certificate reading forbidden.
    - >-
      g<=4 filtered result differs from committed 0-hit baseline →
      O-TRANSCRIPTION / instrument defect; do not run g=5/6 until fixed.
    - >-
      A hit rejected by the second box-test implementation, or a pruned
      node accepted by it → O-BOX-DISAGREE.
    - >-
      Claiming Jacobianhood, a factor base, an ECDLP cost bound, or an
      ECC2K-130 break from this contract.

  interpretation_limits:
    - >-
      Outcome A extends exclusion to dimension 6 only; says nothing about
      dimension >=7 or about tori / unipotent / non-commutative groups
      (IDEA-20260926-6f2601 prices the torus row separately).
    - >-
      Outcome B produces an isogeny class list, not a group law, not a
      translation formula, not a factor base, and not a degree bound; any
      Couveignes-Lercier use is constrained to the non-linear shape.
    - >-
      Nothing here touches ECC2K-130's curve, points, or rho baseline.
    - >-
      Timeouts/crashes/budget aborts are failed_infrastructure /
      O-IMPEDIMENT (AGENTS.md rule 5), never refutation of the emptiness
      claim; O-RUNTIME is a pruning-estimate design stop.

  distinguishable_outcomes:
    - id: O-EMPTY-TO-6
      meaning: >-
        Filtered hits = 0 at g=5 and g=6; unfiltered LMFDB counts match;
        g<=4 reproduction passes; dual box-tests agree; ambiguous=0 —
        certificate-grade extension of KN-OPEN-095df5 exclusion to
        dimension 6 (still requires separate review before KN promotion).
    - id: O-HIT-LIST
      meaning: >-
        One or more filtered hits at g=5 and/or g=6, each re-verified by
        both box-tests, with 6f2601 non-linear-shape ceiling stated beside
        the list; not a Jacobian or factor-base claim.
    - id: O-AMBIGUOUS
      meaning: >-
        Nonzero ambiguous-near-boundary count; widen brackets / report
        undecided roots before claiming A or B.
    - id: O-INCOMPLETE
      meaning: >-
        Unfiltered class count mismatches LMFDB; enumerator incomplete;
        outcome A forbidden.
    - id: O-TRANSCRIPTION
      meaning: >-
        Stage-0 multiples/ceilings wrong, or g<=4 reproduction fails.
    - id: O-BOX-DISAGREE
      meaning: >-
        Dual box-test implementations disagree on a hit or pruned sample.
    - id: O-RUNTIME
      meaning: >-
        Runtime exceeds 10× Stage-0 estimate without inserting declared
        cheap filters; amend protocol before treating partial counts as
        certificate.
    - id: O-IMPEDIMENT
      meaning: Budget/infra stop with measured quantity; never negative evidence.

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
