  heuristic_assumptions:
    - id: HEUR-TZ-1
      formal_statement: >-
        No heuristic is load-bearing for the seven closed-form counts
        themselves: they follow deductively from #E(F_p) = p+1-t,
        #E(F_{p^2}) = p^2+1-(t^2-2p), the classical fact that F_p^* is
        contained in the squares of F_{p^2}^*, and the character recipe of
        IDEA-20260830-1a08f9 (S6, used not re-derived). No distributional
        assumption, no asymptotics, no error term anywhere in the derivation.
      random_model_justification: >-
        NOT A DISTRIBUTIONAL HEURISTIC. This entry exists to record that the
        headline claim is unconditional, which is why the prediction is an
        exact integer residual rather than a confidence band -- carried over
        from the source proposal's own framing (`docs/target-result-profile.md`
        asks for exactly this kind of explicit statement rather than a blank).
      supporting_results: []
      validation_experiment_ids: [EXP-MONO-2a13d7]
      falsification_condition: >-
        Any nonzero integer residual against the closed forms at p in
        {101,211} (Stage 1 of EXP-MONO-2a13d7). Full test at the two tested
        primes; a third rung at p=1009 is out of scope and future work.
    - id: HEUR-TZ-2
      formal_statement: >-
        Non-isomorphic short-Weierstrass curves over F_p with equal (t,Z)
        exist at p in {101,211}, and at least one such matched pair per
        prime differs on an invariant outside (t,Z) (order-3 point count
        or j).
      random_model_justification: >-
        Deuring's class-number formula for the number of curves of a given
        trace makes this overwhelmingly expected for ordinary t at these
        primes, but the citation is RECALLED, NOT FETCHED (per the source
        proposal), and is a statement about counts across all t rather than
        a guarantee for a specific small (t,Z) cell. THE GAP: a particular
        cell at p=101 could in principle contain only one isomorphism class.
      supporting_results: []
      validation_experiment_ids: [EXP-MONO-2a13d7]
      falsification_condition: >-
        No matched non-isomorphic pair found at a tested prime (reported as
        an instrument outcome for that prime, not a negative finding), or a
        found pair indistinguishable on every reported control invariant
        (the vacuous-match confounder).
    - id: HEUR-TZ-3
      formal_statement: >-
        The relation-rate consequence of the exceptional stratification
        (coverage and multiplicity effects sourced from this cover) is
        bounded by the ramified density 2Z/p plus the class-density
        correction 4/p, and its curve-dependence through tau=Z+1 matches the
        independently measured root-coincidence rate of IDEA-20260805-90df50
        at m=4.
      random_model_justification: >-
        The mean is fixed exactly by KN-FIND-007 and cannot deviate; the
        ramified density is the exact count divided by p^2; the t-dependence
        of the class densities enters as t^2/p^2 <= 4/p by Hasse. THE GAP:
        the cross-comparison with IDEA-20260805-90df50's independently
        derived tau-dependence has not been run.
      supporting_results: []
      validation_experiment_ids: []
      validation_scope_note: >-
        DELIBERATELY OUT OF SCOPE for EXP-MONO-2a13d7, which tests only the
        m=3 cover-internal counts, not the m=4 cross-record comparison.
        Named as future work: a dedicated experiment measuring
        IDEA-20260805-90df50's rate at m=4 on the same curve panel and
        comparing its tau-dependence against this record's closed forms.
      falsification_condition: >-
        UNTESTED by any experiment currently frozen. Would be falsified by a
        measured m=4 root-coincidence rate whose tau-dependence disagrees
        with this record's implied linear-in-(Z+1) prediction.

