hypothesis:
  id: H-MONO-0f9170
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  goal_status_note: >-
    GOAL-MONO-001 is `paused` (campaign budget exhausted: maximum_batches: 3,
    BATCH-003 was the third) as of its 2026-08-10 checkpoint. Its recorded
    `next_action` names a different live route (the T-line/direction-swap
    census of DEC-20260810-2f86db D-4/D-5) and rejects, at every m, the
    generic-fibre cycle-type census AS A RELATION-RATE PROBE. THIS RECORD
    MAKES NO RELATION-RATE CLAIM (see `interpretation_limits`): it is an
    exact-arithmetic completeness statement about the m=3 symmetric-base
    cover's per-instance stratum counts, tested against closed forms rather
    than censused for a rate. It is the direct sibling of H-MONO-0b3def
    (status: supported, DEC-20260830-1fb2e3 / EV-MONO-7c216b), which decided
    the GROUP; this record decides the exact ARITHMETIC of the seven counts
    the group's five classes plus two ramified sub-strata partition into.
    Creating this hypothesis/experiment pair does not reopen, resume, or
    reprioritize GOAL-MONO-001; execution of the paired experiment still
    requires a Coordinator batch assignment and a fresh budget grant from
    GOAL-PATH-001, OR approval through the standalone experiment lifecycle
    exactly as GOAL-MONO-001 `paused` did not block EXP-MONO-4c7479 (see that
    contract's `coordinator_approval_rationale`; the same reasoning applies
    here and is not repeated in full).
  source_proposal: IDEA-20260830-9761f0
  status: supported
  status_note: >-
    Transitioned proposed -> supported by DEC-20260830-509678 / EV-MONO-d90e9c
    (2026-08-30), SCOPED EXACTLY to m=3, p in {101,211}, the 18 tested panel
    curves. Both independent reviewers re-derived the seven closed forms from
    scratch (the Validator via a structurally different O(p^2) brute-force
    implementation) and confirmed exact agreement at every panel curve, both
    runs, bit-identical. Characterized by the Red Team as a legitimate,
    LOW-NOVELTY extension of KN-FIND-a8990a's already-proven Theorem B, not a
    surprising new result -- recorded so this status is not overclaimed.
    NAMED LIMITATION (not a falsifier): the matched-pair non-vacuity control's
    strong form (order-3-point-count difference) was never exercised -- both
    tested pairs passed non-vacuity via j-invariant difference only, which is
    independently sufficient to rule out the one vacuity failure mode this
    hypothesis's own confounders list names, so the pass is not vacuous, just
    not at its strongest available form. See DEC-20260830-509678's
    disclosed_open_items for the concrete, cheap follow-up this creates.
  proposed_by: idea-generator

  conversion_note: >-
    This record is a schema conversion of an already-complete, already-worked
    proposal. All mathematical content (statement, mechanism, proof_search_map,
    heuristic_assumptions, predictions, falsification_conditions) is the
    idea-generator's, carried over from IDEA-20260830-9761f0 with no new claim
    introduced and no step re-derived. The Coordinator's own judgment is
    confined to: the explicit test-boundary scoping below (dropping the
    p=1009 cell and the p-ladder decay prediction, per the idea's own staging);
    the mapping of the idea's `minimal_test`/`controls` design into this
    repo's hypothesis/experiment schema; the observation (new to this record,
    not asserted by the idea) that the exact formulas below are consistent
    with, and offer a mechanistic account of, H-MONO-0b3def's HEUR-WREATH-3
    finding (see `relation_to_sibling_finding`); and the decision, recorded in
    the paired experiment contract EXP-MONO-2a13d7, to bound the FIRST frozen
    contract to Stages 0-1 (plus Stage 3's matched-pair test on the same two
    primes) only. No hypothesis or experiment status beyond `proposed` /
    `review_required` is authorized by this record (AGENTS.md rule 1).

  relation_to_sibling_finding: >-
    NOT PART OF THE IDEA'S OWN CLAIM; a Coordinator observation added for
    context, and load-bearing for nothing. H-MONO-0b3def's HEUR-WREATH-3 was
    falsified_scoped by DEC-20260830-1fb2e3 for exactly the identity and
    sigma1_sigma2 class densities: the crude forced-density approximation
    (1/8, 1/4 independent of t) missed a genuine linear-in-t term,
    S(S-1)-N(N-1) = -t(p-Z-1), giving O(1/sqrt p) deviation rather than
    O(1/p). This record's closed forms make that t-dependence EXPLICIT and
    EXACT: identity = C(S,2) and sigma1sigma2 = C(N,2) with S=(p-t-Z)/2,
    N=(p+t-Z)/2 are manifestly linear-in-t through S and N themselves, not
    merely through a cancelling correction term. If this record's Stage-1
    residual check passes (exact 0, not a tolerance), it explains -- and does
    not merely coexist with -- HEUR-WREATH-3's falsification: the "deviation"
    found there is not noise or a second-order artifact, it is the exact,
    computable t-dependence this record asserts throughout the mechanism. A
    Stage-1 failure here (a nonzero residual) would instead mean the exact
    formulas are themselves wrong, which is a stronger and more surprising
    outcome than HEUR-WREATH-3's finding. Neither outcome changes
    HEUR-WREATH-3's own status, which is fixed by its own evidence record.

  statement: >-
    TEST BOUNDARY, STATED FIRST. m = 3 only. p > 3. E/F_p given by
    y^2 = f(x) = x^3 + Ax + B, f squarefree (E non-singular), short
    Weierstrass form only. The tested object is the SEVEN stratum counts of
    the symmetric-base cover's Frobenius action, as defined below -- never a
    rate, a density band, or a curve family beyond generic short-Weierstrass
    E/F_p. Uses, and does not re-derive, H-MONO-0b3def's now-supported group
    claim (D_4 = Z/2 wr S_2, uniform, empty exceptional locus for the GROUP)
    and its S6 per-instance Frobenius recipe. IF H-MONO-0b3def's group
    identification were later overturned, the class LABELS attached to the
    seven numbers below (which permutation each count corresponds to) would
    be wrong, but the seven numbers themselves and their exact dependence on
    (p, t, Z) would not be, because they are counts of CHARACTER PATTERNS
    (values of the quadratic character at the discriminant D = e1^2-4e2 and
    at f(t1), f(t2)), not counts that presuppose any particular group-theoretic
    reading of those patterns.

    NOTATION. t = trace of Frobenius, #E(F_p) = p+1-t. Z = #{x in F_p :
    f(x)=0} in {0,1,3}. S = #{x in F_p : f(x) a nonzero square} =
    (p-t-Z)/2. N = #{x in F_p : f(x) a non-square} = (p+t-Z)/2. Z' =
    #{x in F_{p^2} : f(x)=0}, determined by Z alone for a cubic: Z=0 -> Z'=0
    (roots in F_{p^3}), Z=1 -> Z'=3, Z=3 -> Z'=3.

    THE SEVEN NUMBERS, as exact functions of (p,t,Z) alone:
    (A1) identity class:              C(S,2)
    (A2) {sigma_1,sigma_2} class:     S*N
    (A3) sigma_1 sigma_2 class:       C(N,2)
    (A4) ramified, case A (excluded): Z(p-Z) + C(Z,2)
    (B1) block-swap involutions:      M/2, with
         M = (p^2+2p-t^2-Z')/2 - (p-Z)
    (B2) ramified, case B (excluded): (Z'-Z)/2
    (B3) four-cycles:                 p(p-1)/2 - M/2 - (Z'-Z)/2
    (A1)-(A3) plus (A4) sum to C(p,2) identically (the split-base points);
    (B1)-(B3) sum to p(p-1)/2 identically (the inert-base points); the
    double-root stratum {e1^2-4e2=0} (excluded, a THIRD stratum, no
    (t,Z)-dependence at all) has exactly p points always. These three sums
    are internal, zero-cost correctness gates, not part of the seven-number
    claim itself.

    THE COMPLETENESS CLAIM (C1 of the source proposal). For every p>3 and
    every non-singular short-Weierstrass E/F_p, each of the seven numbers
    above is EXACTLY the stated function of (p,t,Z) and of NOTHING ELSE: two
    non-isomorphic curves over the same p with the same (t,Z) have BITWISE
    IDENTICAL seven-tuples. This is a per-instance, exact-integer prediction,
    not a statistical one.

    DISTINGUISHABLE OUTCOMES (what a run can move, in either direction; see
    `falsification_conditions`, taken directly from the source proposal and
    scoped to the tested primes):
    SUPPORTS the completeness claim: every measured seven-tuple, per curve,
    per prime in {101,211}, agrees EXACTLY (integer residual 0) with the
    closed forms evaluated at that curve's own (p,t,Z); every internal sum
    check passes exactly; at least one matched non-isomorphic pair per tested
    prime with equal (t,Z) is found and its two seven-tuples agree exactly,
    while the pair differs on at least one control invariant (j, or order-3
    point count) -- the non-vacuity requirement.
    FALSIFIES the completeness claim: any nonzero integer residual against a
    closed form, on any curve, at either tested prime; or any matched
    non-isomorphic pair with UNEQUAL seven-tuples (this is the more valuable
    outcome -- it localizes a finer curve invariant and answers RQ-MONO-001's
    exceptional-locus question in the other direction, and must be reported
    as the exceptional locus found, not absorbed as noise).
    INSTRUMENT FAILURE / not evidence either way: no matched non-isomorphic
    pair with equal (t,Z) existing at a tested prime, or every matched pair
    at a tested prime being indistinguishable on every reported control
    invariant (the vacuous-match confounder) -- then the matched-pair half of
    the claim is untested at that prime and must be reported as an
    instrument outcome, per AGENTS.md rule 5's disposition-of-infrastructure
    logic extended to a design confound by the source proposal's own
    `confounders`.

    WHAT THIS DOES NOT CLAIM. No relation-rate content: coverage of targets
    by factor-base decompositions is a function of the factor base, not of
    this cover, and is untouched here (H-MONO-0b3def S7 / KN-FIND-a8990a
    Theorem C, carried over unchanged). No claim about m>=4 (the wreath
    group there is Z/2 wr S_{m-1}, not counted here). No claim about the
    group structure of E(F_p) beyond its order (the order-3 point count is
    reported PRECISELY BECAUSE it is NOT a function of (p,t,Z) -- it is the
    control that makes the matched-pair test non-vacuous, not part of the
    completeness claim). No ECDLP, cost, or exponent claim in either
    direction (C3/C4 of the source proposal: any cover-sourced deviation is
    bounded by O(1/p) and lands on coverage/multiplicity, never the fixed
    mean of KN-FIND-007).

  mechanism: >-
    DERIVED in IDEA-20260830-9761f0 using IDEA-20260830-1a08f9's Frobenius
    recipe (S6, "used here, not re-derived") and KN-FIND-a8990a's Theorem B
    counting method; carried over verbatim in substance, restated in this
    schema's notation above under `statement`.

    THE SPLIT OF THE BASE (case A / case B / degree-drop). A base point
    (e1,e2) in F_p^2 has x^2-e1 x+e2 either (A) SPLIT with distinct roots
    t1 != t2 in F_p (exactly C(p,2) points, bijective with unordered pairs);
    or (B) INERT, roots t1, t1^p in F_{p^2}\F_p (exactly p(p-1)/2 points); or
    (D) a DOUBLE ROOT, e1^2=4e2 (exactly p points, the excluded
    degree-drop stratum). Frobenius fixes both blocks in case A (the class is
    read off chi(f(t1)), chi(f(t2))) and swaps them in case B (by
    IDEA-20260830-1a08f9 S6, involution iff chi(f(t1)f(t2))=+1, four-cycle
    iff -1; f(t1)f(t2) = Norm_{F_{p^2}/F_p}(f(t1)), computed DIRECTLY over
    F_p from (e1,e2) via c0 = e2^3 + A e2(e1^2-2e2) + B(e1^3-3e1e2) + A^2 e2
    + AB e1 + B^2, the same polynomial arm (b) of EXP-MONO-4c7479 computes --
    NO lift to F_{p^2} is required to determine chi(c0), which is the entire
    reason this record's Stage-1 arithmetic is cheap: the inert-case class is
    decided by a single Legendre symbol of a polynomial in (e1,e2) over F_p).

    WHY M IS DERIVED FROM #E(F_{p^2}) AND NOT FROM A SEPARATE F_{p^2} CENSUS.
    M = #{t in F_{p^2}\F_p : f(t) a nonzero square in F_{p^2}}. Every element
    of F_p is automatically a square in F_{p^2} (F_p^* has index p+1 in
    F_{p^2}^*, and p+1 is even for p odd, so F_p^* sits inside the index-2
    subgroup of squares). Hence #{x in F_{p^2} : f(x) a nonzero square} =
    (p-Z) [all of F_p except f's roots, automatically square in the
    extension] + M. The left side is (p^2+2p-t^2-Z')/2 via
    #E(F_{p^2}) = p^2+1-(t^2-2p) and Z2 = Z' roots. Rearranging gives
    M = (p^2+2p-t^2-Z')/2 - (p-Z) exactly as stated. This identity is a free,
    zero-cost re-derivation any implementation can check symbolically before
    spending any compute, and is required as part of Stage 0 below.

    WHY NO FINER INVARIANT CAN ENTER. Every quantity above reduces to how
    many x in F_p (respectively F_{p^2}) have f(x) a square, non-square, or
    zero -- tallies determined entirely by #E(F_p), #E(F_{p^2}) (both
    functions of t alone by Hasse/Weil) and the factorization type of f
    (determined by Z alone, since f is a cubic). There is no slot in this
    computation for j, the CM order, the automorphism group, or the group
    structure of E(F_p) beyond its order.

    THE NON-VACUITY CONTROL, RESTATED. Points of order 3 on E(F_p) are NOT a
    function of (p,t,Z): whether E(F_p) has a rational 3-torsion subgroup
    depends on the exponent of the group, which two curves of equal order
    can differ on. A matched pair equal on (t,Z), equal on all seven
    stratum counts, but ALSO equal on order-3 count and j would be either two
    models of the same curve (a labeling failure, not a finding) or a
    genuinely uninformative coincidence; the control exists to rule out the
    former and flag the latter.

  assumptions:
    - p > 3, short Weierstrass form, f squarefree, m = 3 only.
    - >-
      The symmetric-base group and Frobenius recipe of IDEA-20260830-1a08f9,
      now corroborated at toy scale by H-MONO-0b3def (status: supported,
      scoped to m=3, p in {101,211}, generic-ordinary curves). USED HERE, NOT
      RE-DERIVED. If that record's group identification were wrong, only the
      class LABELS attached to the seven numbers would be wrong; the numbers
      themselves are counts of character patterns and do not depend on the
      group-theoretic reading (see `statement`).
    - >-
      Affine base A^2 in (e1,e2); the projective closure and the point at
      infinity of the x-line are not counted.
    - >-
      Matched non-isomorphic curve pairs with equal (t,Z) exist at the
      chosen p. A Stage-0 feasibility check that can end a prime's
      matched-pair cell without ending the record (see `falsification_conditions`
      / instrument-outcome disposition above).

  proof_search_map:
    bottleneck: >-
      The completeness step: that no invariant finer than (p,t,Z) enters any
      of the seven counts. Everything else is a closed-form finite sum
      derived from two Hasse/Weil point-count identities and one classical
      fact about squares in a quadratic extension. If a finer invariant does
      enter, the exceptional locus reopens exactly there and IS the more
      valuable outcome (source proposal's own framing, carried over).
    baseline_embedding:
      parameter_slice: >-
        Restricting to case A and to the ORDERED base recovers
        KN-FIND-a8990a Theorem B's m=3 instance: split count S^2+N^2 with the
        diagonal correction, at the same O(1/p) density law.
      reproduction_check: >-
        Emit S^2+N^2-(p-Z) from the case-A counts (A1)+(A3), doubled and
        corrected for the unordered-to-ordered map, and require exact
        agreement with the committed Theorem B closed form, as integers, on
        the SAME curves BEFORE any new cell is measured. This is the same
        reproduction check H-MONO-0b3def's proof_search_map requires of its
        own baseline; this record's obligation is to reproduce it from the
        seven-number decomposition rather than from raw class densities.
    observation_collision:
      observable: >-
        The seven-tuple of stratum counts, as a function of the curve.
      distinct_preimage_search: >-
        INVERTED, deliberately, exactly as in the source proposal: the claim
        IS that the observable has a large fibre (every curve sharing (p,t,Z)
        is a distinct preimage). The risk under test is the mirror one --
        that the observable is so lossy it is constant across ALL curves at
        fixed p, not merely across curves with equal (p,t,Z). That risk is
        excluded in advance because the counts vary with t across the Hasse
        interval and with Z across {0,1,3}, and the panel spread across those
        two axes (within the tested primes) is reported as the run's own
        comparator.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The map curve -> (t,Z) -> seven exact stratum counts, replacing a
          per-curve census by a two-parameter closed form.
        predicted_gain: >-
          A census over C curves at O(C p^2) becomes a formula evaluation at
          O(C log p) once (t,Z) are known, and the exceptional-locus question
          becomes a question about a bounded stratification rather than an
          unbounded family of curves.
      - transform: observable_fiber
        proposed_object: >-
          The fibre of the seven-tuple observable over a fixed (t,Z), tested
          directly by matched non-isomorphic curve pairs.
        predicted_gain: >-
          A single matched pair with unequal seven-tuples refutes
          completeness and localizes the exceptional locus at a finer
          invariant than (t,Z) -- the outcome that would matter most.
    quantifier_order: >-
      FOR ALL p>3, FOR ALL pairs (E,E') of non-singular short-Weierstrass
      curves over F_p with equal t and equal Z, THE SEVEN STRATUM COUNTS ARE
      EQUAL AS INTEGERS. Not: for generic curves; not: up to statistical
      error. Restricted for THIS record's tested claim to p in {101,211}
      (the p=1009 rung and the cross-prime panel-spread-decay prediction are
      OUT OF SCOPE, named as future work, per `test_boundary`).
    method_ceiling:
      strongest_certifiable_claim: >-
        The seven stratum counts of the m=3 symmetric-base cover, exact
        functions of (p,t,Z), verified by exhaustive agreement at p in
        {101,211}. NOT certifiable by this method: any statement about
        m>=4, about factor-base coverage or relation rank, about solve cost,
        or about E(F_p)'s group structure beyond its order.
      nearby_object_control: >-
        The number of points of order 3 on E(F_p) is the planted nearby
        object: NOT a function of (p,t,Z), and its differing on a matched
        pair is what makes the equality test non-vacuous. Reporting it is
        mandatory, per the source proposal's own framing.
    proof_obligations:
      - claim: >-
          The case-A counts (A1)-(A4) sum to C(p,2) identically.
        responsibility: correctness
      - claim: >-
          M = (p^2+2p-t^2-Z')/2 - (p-Z) counts case-B elements with f a
          nonzero square in F_{p^2}, via the fact that every element of F_p
          is automatically a square in F_{p^2}.
        responsibility: correctness
      - claim: Z' is determined by Z alone for a cubic over F_p.
        responsibility: strictness
      - claim: >-
          chi(f(t1)f(t2)) in the inert case equals chi(c0) computed directly
          over F_p from (e1,e2), with no lift to F_{p^2} required.
        responsibility: correctness
      - claim: Matched non-isomorphic pairs exist at p in {101,211}.
        responsibility: feasibility

  predictions:
    - metric: >-
        integer residual between each of the seven measured stratum counts
        and its closed form in (p,t,Z), per curve, exhaustive over all p^2
        base points, at p in {101,211}
      direction: lower
      minimum_effect: >-
        EXACTLY 0 in integer arithmetic, every stratum, every curve, at both
        tested primes. A single nonzero residual falsifies the mechanism's
        arithmetic and halts the record (superseded, not edited).
    - metric: >-
        difference between the seven-tuples of a matched non-isomorphic pair
        (equal t, equal Z, different j) over the same p, at p in {101,211}
      direction: same
      minimum_effect: >-
        EXACTLY 0 on all seven, for at least one matched pair per tested
        prime. A nonzero difference is the exceptional locus RQ-MONO-001
        hunts, found at a finer invariant, and routes to its own record.
    - metric: >-
        control invariant on the same matched pair(s) (order-3 point count,
        and j)
      direction: different
      minimum_effect: >-
        j must differ (that is what non-isomorphic means over F_p for
        j != 0, 1728, the only case in scope) and the pair must differ in
        its order-3 point count. If no matched pair differs on the reported
        control at a given prime, the equality test at that prime is vacuous
        and NO conclusion may be drawn from it.
      note: >-
        j=0/j=1728 curves are deliberately excluded from this record's tested
        panel (see `test_boundary` and the paired experiment's
        `curve_panel_note`); the idea's own prediction of a matched pair
        "involving j=0 or j=1728 where such a pair exists" is named as
        future work, not tested here.
    - metric: >-
        F_p-point count of the ramified strata (A4) and (B2), as functions
        of Z, at p in {101,211}
      direction: different
      minimum_effect: >-
        FORCED per-curve values Z(p-Z)+C(Z,2) [case A] and (Z'-Z)/2 [case B],
        emitted before enumeration. A Z=0 curve with any (A4) or (B2) point,
        or a Z=3 curve with materially fewer than the forced (A4) count, is a
        two-sided falsifier. Because Stage 0 exhaustively enumerates curves
        at both primes, panel selection for Stage 1 deterministically
        includes at least one curve with each of Z in {0,1,3} at each
        tested prime, so this prediction is fully tested within scope
        (unlike the sibling H-MONO-0b3def's K7, which was untested by its
        first contract).

  test_boundary:
    instances:
      - "p in {101, 211}, both > 3; non-singular short-Weierstrass E/F_p; m=3 only."
      - "Stage 0: curve enumeration and matched-pair pre-registration at p in {101, 211} -- IN SCOPE for EXP-MONO-2a13d7."
      - "Stage 1: exhaustive base-point census on a small deterministic panel at p in {101, 211} -- IN SCOPE."
      - "Stage 3: matched-pair equality test plus control invariants at p in {101, 211}, reusing Stage-0/1 data -- IN SCOPE."
      - "Stage 2 (p=1009, sampled) -- OUT OF SCOPE for EXP-MONO-2a13d7; future work, named there."
      - "The cross-prime panel-spread-decay-like-1/p prediction (needs 3+ primes) -- OUT OF SCOPE; future work."
    parameters:
      m: 3
      field_characteristic: "p > 3"
      curve_condition: "f squarefree (E non-singular), short Weierstrass"
      base: "symmetric (e1,e2); the tested object is its seven-count stratification"
    implementation: >-
      Pure Python 3 stdlib integer/modular arithmetic over F_p; the
      inert-case class is decided by a single F_p Legendre symbol of the c0
      polynomial (no F_{p^2}/F_{p^4} arithmetic is required for this
      record's primary metric, unlike the sibling H-MONO-0b3def's arm (a)).
      harness/semaev.py's `s3_expr` is the cited source of the c1, c0
      coefficient forms (read, not re-derived at runtime).
    budget: >-
      See the frozen experiment contract for exact numbers. EXP-MONO-2a13d7
      bounds its scope to well under the stated wall-clock cap, pure CPU, no
      network, no external libraries.

  falsification_conditions:
    - >-
      Any nonzero integer residual against the closed forms, at either
      tested prime. The mechanism's arithmetic is wrong; the record is
      withdrawn by a superseding record, never edited.
    - >-
      Any matched non-isomorphic pair, at either tested prime, with unequal
      seven-tuples. The completeness claim is false and a finer curve
      invariant enters -- the most valuable possible outcome, reported as
      such, never absorbed.
    - >-
      A Z=0 curve exhibiting a nonzero (A4) or (B2) ramified count, or a Z=3
      curve exhibiting a measured (A4)/(B2) count differing from its forced
      value, at either tested prime.
    - >-
      Any internal sum check (case A to C(p,2), case B to p(p-1)/2, or the
      double-root stratum to exactly p) failing. This is an implementation
      defect, not mathematical evidence, and voids the cell's interpretation.
    - >-
      No matched non-isomorphic pair existing at a tested prime, or every
      matched pair at a tested prime being indistinguishable on both
      reported control invariants (j and order-3 count). Then the
      matched-pair half of the claim is untested at that prime -- an
      instrument outcome, reported as one, never as confirmation.

  interpretation_limits:
    - >-
      CLAIM TIER toy for the measurements; the closed forms are a DERIVATION
      and must be cited as one, never as an empirical finding in their own
      right.
    - >-
      NO ECDLP CLAIM. No exponent moves in either direction; any cover-sourced
      deviation is bounded by O(1/p) relative (source proposal C3), which
      cannot change any collection cost by more than a 1+O(1/p) factor.
    - >-
      NOT A CLOSURE of KN-OPEN-009, RQ-MONO-001, or GOAL-MONO-001, and no
      status change to any of those or to KN-FIND-a8990a is proposed or
      implied. Coordinator authority alone (AGENTS.md rule 1).
    - >-
      DOES NOT SUPERSEDE IDEA-20260805-90df50. That record measures a rate
      at m=4; this record predicts how that rate's curve-dependence should
      look (through tau=Z+1) but does not test it -- HEUR-TZ-3 (below) names
      that comparison as deferred, future work.
    - >-
      m=3 ONLY, p in {101,211} ONLY for this record's tested claim. The
