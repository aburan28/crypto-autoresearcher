hypothesis:
  id: H-KDUAL-d0ae7e
  question_id: RQ-MONO-001
  question_id_note: Attached to the nearest existing question because no lattice research question
    exists in ledger/questions/. A Coordinator should mint one; this field is wrong and is flagged
    rather than hidden.
  added: '2026-08-07'
  status: proposed
  statement: lattice-estimator's `dual_hybrid` does NOT model the coded/polar decoding stage
    that Carrier et al.'s coded dual attack is about. If so, KN-FIND-015's non-reproduction
    of the dual headline on Kyber is evidence about the PUBLIC INSTRUMENT and carries no weight
    against the paper, and every citation of it must be re-scoped. If not, the non-reproduction
    is a substantive disagreement about deployed ML-KEM parameters and is the most consequential
    open item in this corpus.
  mechanism: 'KN-FIND-015 pins lattice-estimator at commit 3e48ef42 and RC.MATZOV, validates
    the instrument against pq-crystals core-SVP within 1 bit, and finds primal_bdd beating dual_hybrid+fft
    at all three parameter sets. It then records, and does not resolve, the caveat that decides
    its meaning: the estimator''s dual may simply predate and not implement the coded improvement.
    The two readings are opposite, and the corpus currently cites the finding without distinguishing
    them. The determination is a SOURCE READ, not a benchmark: output numbers cannot separate
    ''modelled and cheaper'' from ''not modelled at all''.'
  assumptions:
  - The pinned estimator commit is the one KN-FIND-015 used; a different commit makes the comparison
    meaningless.
  - Instrument validation against pq-crystals must pass BEFORE any comparison is read.
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: NO SECURITY CLAIM IN EITHER DIRECTION. An estimator comparison is not
    a cryptanalytic certificate and must never be quoted as one.
  heuristic_assumptions: []
  predictions:
  - The estimator's dual_hybrid contains no decoding-stage cost term.
  - If it does contain one, the discrepancy against Carrier Theorem 4.1 concentrates in the
    Tdec term rather than spreading evenly across terms.
  falsification:
  - lattice-estimator's dual_hybrid does model a comparable coded/decoding stage, which falsifies
    this hypothesis and escalates KN-FIND-015.
  pareto_integrity:
    dominated_by: not_applicable -- this is an audit of an estimator
    sota_delta:
      time_exponent: not_applicable
    note: No attack is run and no cost is claimed.
  experiment_ids:
  - EXP-KDUAL-8f0b69
  evidence_ids: []
  owner: unassigned
