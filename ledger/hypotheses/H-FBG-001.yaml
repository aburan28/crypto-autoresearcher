hypothesis:
  id: H-FBG-001
  question_id: RQ-FBG-001
  transcription:
    supersedes: H-FB3-001
    supersedes_path: ledger/H-FB3-001.yaml
    supersedes_sha256: b7f2142ca690153cc5eeab681364f9fc2000e4f8ca92cc9b69d7b5f57af0aca8
    frozen_at: >-
      commit e111dd3731a21f3345114b7bb4c04a8f54d4b4c9 (2026-07-18), approved by
      DEC-20260717-002
    reason: >-
      ledger/H-FB3-001.yaml is not machine-parseable YAML (line 27 onward:
      unquoted multi-line scalars containing colons inside list items), so the
      validator cannot register H-FB3-001 and no new record can machine-reference
      it. Its ID also predates the current `H-[A-Z]+-NNN` format, which forbids a
      digit inside the area code. The frozen file is immutable and is NOT edited.
    execution_note: >-
      The battery was executed against the ORIGINAL frozen text of H-FB3-001 and
      experiments/EXP-FB3-001/specification.yaml, which the executor read
      directly; this transcription was written afterwards, purely so the outcome
      could be recorded against a resolvable ID. It introduced no criterion and
      changed no threshold. A reader auditing the claim should read the frozen
      files, whose hashes are recorded here.
    created_by: TASK-20260724-236
  statement: >-
    At least one structured factor-base geometry among {high-bit interval, small
    canonical height, mixed two-base, multiplicative coset union,
    greedy-optimized, asymmetric sizing} yields m=3 decompositions at a rate
    whose advantage over a matched random base GROWS with N
    (exponent-relevant), rather than being a constant or null effect.
    (Source: HYPOTHESES_100 H004, H018, H019, H020, H021, H022, batched.)
  mechanism: >-
    Decomposition probability depends on how the base's x-coordinates interact
    with the chord structure of the summation condition. High-bit membership
    couples to carry propagation (opposite endianness of the killed low-bit
    interval bases); small-height points concentrate additive relations; mixed
    and coset bases change the sumset profile; greedy optimization could find
    structure none of the hand-designed families have. Any of these might make
    per-size decomposition probability scale with a different exponent than the
    balanced random base — the only form of advantage that survives at the bar.
  assumptions:
    - >-
      The H016 harness convention (decomposition counting, bootstrap CIs,
      permutation null on labelings) is reused unchanged except for the growth
      arm. Amendment EXP-FB3-001-AMD-001 supplies the implementation basis, since
      the named external harness is absent from this repository, and upgrades the
      sampled count to an exact full-target-space count.
    - >-
      H016 (QR base) and H017 (small multiples) cells are already run and enter
      the Holm family as prior cells; they are not re-run.
    - >-
      The greedy base is selected on one curve-half and evaluated on held-out
      targets (transfer guard against overfitting).
  predictions:
    - metric: >-
        yield ratio (structured / matched random) per geometry per N, with
        bootstrap CI and permutation-null band
      direction: different
      minimum_effect: >-
        ratio CI excludes 1 AND the effect size grows from 2^14 to 2^18 (slope
        vs log N excludes 0 in the alive direction) after Holm correction across
        the full family.
    - metric: asymmetric-base exponent gap (the H004 arm)
      direction: different
      minimum_effect: >-
        per-size decomposition probabilities fit different exponents in B
        (CI-separated), making some B1*B2*B3 ~ l split dominate the balanced
        base super-constantly.
  test_boundary:
    instances: [">=4 generic curves, N in {2^14, 2^16, 2^18}, m=3, >=300 random targets R per cell"]
    parameters:
      geometries: [high_bit_interval, small_height, mixed_two_base, coset_union, greedy_optimized, asymmetric_sizing]
      permutation_draws: ">=100 per cell (matching H016/H017 for family comparability)"
    implementation: >-
      EXP-FB3-001 under amendment EXP-FB3-001-AMD-001; exact counting over the
      complete target space supersedes the >=300-target sample, which is a strict
      strengthening of the frozen metric.
    budget:
      wall_clock_seconds_per_run: 1800
      maximum_memory_gb: 8
      maximum_runs: 96
  falsification_conditions:
    - >-
      All geometry ratios ~1 within CIs / permutation bands at every N: scoped
      kill of the F3 family.
    - >-
      Any effect present but constant across N: fails the growth clause —
      "interesting structure", not alive.
  interpretation_limits:
    - >-
      Toy scale (N <= 2^18); a growth signal triggers a larger-N confirmation
      before any alive claim.
    - >-
      A kill closes the six tested geometries only (AGENTS.md rule 6). Per the
      independent red-team review recorded in DEC-20260724-007, it closes the
      GROWTH clause of the yield channel for those six geometries and must not be
      read as showing that no factor-base geometry beats a matched random base:
      a Bose-Chowla B_3 base reaches a measured coverage ratio of 1.1071.
    - >-
      Yield and coverage only. The point-decomposition solve and the linear
      algebra stage are not measured.
  status: rejected_scoped   # DEC-20260724-007; see EV-FBG-001 for the tested scope
  proposed_by: coordinator
