  title: >-
    Five over four sits above one plus one over n on three degrees
  statement: >-
    Five times 17 minus four times 18 is 13. Five times 23 minus four
    times 24 is 19. Five times 31 minus four times 32 is 27. Two to
    the 3 is 8 and two to the 4 is 16, so a matched-size ratio is 1,
    and five minus four is 1. Six cells times 40 targets is 240.
    Seventeen squared is 289, twenty-three squared is 529, and
    thirty-one squared is 961.
  mechanism: >-
    The proposal pre-registers a success-rate band of five over four
    against a matched-dimension control, on degrees 17, 23 and 31.
    This contract checks that the band is not the factor one plus one
    over n, and that matched powers of two have ratio 1. It does not
    build a curve.
