    "statement": "For the full frozen 12/16/20-bit prime-field digit panel, the specified adaptive connected-staircase search preserves every certified root/decomposition and reduces fully charged field work to at most half identical-input grevlex F4 in every held-out source cell/stratum aggregate. Source H1 separately predicts a certificate by candidate 4 with at most half the multiplication-matrix nonzeros and verification overhead below the reduction work saved.",
    "mechanism": "Adaptive support-budget border closure, version 1: A=R/Q with squarefree monomial universe U of size 2^n, ordered grevlex. nf_Q reduces exponents >0 to 1 with an explicit polynomial witness. Maintain an exact full-column sparse RREF row space K contained in I/Q, each row carrying a witness in original G. Missing sparse entries are certified zero; no support-column restriction may remove possible columns. Initial K is the span of nf_Q(h_i) and nf_Q(F). Attempt 1 uses initial K. Rebuild a candidate after each subsequent closure batch, for at most 16 attempts total. Start B={1}, provided 1 is independent modulo K; if 1 is in K take the unit branch. Frontier comprises squarefree monomials outside B whose every immediate divisor belongs to B. Repeatedly choose an independent frontier monomial modulo K+span(B), minimizing (sum_k nnz(nf_K(nf_Q(d_k*b))), nnz(nf_K(b)), total degree, exponent bitmask). Each score and exact independence query is charged. Add that monomial and recompute frontier. Permanently reject a dependent frontier monomial for this candidate. For attempt k, stop adding when |B| reaches cap_k=min(2^n,(n+1)*2^(k-1)), or when no independent eligible monomial remains. The cap is frozen before any outcome and is not an oracle for the quotient dimension. This greedy set need not span A/K; inability to reduce its full border is a recorded candidate failure, never presumed completeness. The squarefree bitmask tie break is sum_(k=1)^n exponent_k*2^(k-1), in the frozen variable order. This finite frontier cap starts with a small candidate and permits charged border extension; it avoids assuming that the first relation space must already span the entire ambient quotient.",
