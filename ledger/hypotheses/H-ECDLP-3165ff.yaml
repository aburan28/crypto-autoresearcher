hypothesis:
  id: H-ECDLP-3165ff
  question_id: RQ-SBRG-f31cb2

  statement: >-
    SCOPE: EXPLICIT reusable precomputations for the target-independent part of a
    chained point-decomposition system, priced under a stated three-term cost
    model, with a toy achievability ladder at group orders up to about 2 to the
    18. CLAIM TIER toy for the measured arm and DERIVATION for the exponent
    statements. NO ATTACK, NO FAVOURABLE EXPONENT, NO STATUS CHANGE TO ANY
    RECORD.
    The target-independent part of a chained decomposition system cuts out a
    finite solution set whose cardinality is polynomial in the factor-base size,
    so every EXPLICIT reusable representation of it - a lookup table, a Groebner
    basis of its vanishing ideal, a multiplication-matrix engine, a Macaulay row
    space - costs at least that many words. The k-fold sumset table realises that
    bound, and balancing a three-term total of trial cost, table cost and linear
    algebra puts the whole family at time and memory both of order N to the power
    k over (2k minus 1), which exceeds N to the one half strictly for every
    finite k and is therefore Pareto-dominated by Pollard rho on BOTH axes.
    THE CLAIM UNDER TEST is that this closed form is correct and that a toy
    measurement tracks it. It is a NEGATIVE frontier for one family, offered with
    forward guidance rather than as a closure of the question.

  mechanism: >-
    The derivation is elementary and is reproduced so it can be checked by hand.
    Precompute a k-fold sumset table over the factor base, keyed by coordinate,
    at cost of order B to the k to build and B to the k words to store, charged
    once. Online, per target, enumerate the remaining summands and look up, at
    order B to the (t minus k) per trial. With the conservation mean fixing the
    expected yield exactly, the trial count to collect B relations is of order
    N B to the (1 minus t), so the total is of order
    t factorial times N times B to the (1 minus k), plus B to the k, plus a
    linear-algebra term proportional to B squared. Minimising the first two over
    B gives B of order N to the one over (2k minus 1) and hence time and memory
    both of order N to the k over (2k minus 1). Since k over (2k minus 1) exceeds
    one half exactly when 2k exceeds 2k minus 1, the inequality is strict for
    every finite k, and the gap in the exponent is one over twice (2k minus 1).
    A PRE-REGISTERED CORRECTION TO THE SOURCE IDEA S ALGEBRA, STATED BEFORE ANY
    RUN. IDEA-20260829-66a876 asserts that the linear-algebra term is subdominant
    for every k at least 2. At k = 2 that is FALSE - the linear-algebra exponent
    2 over (2k minus 1) equals 2 over 3, which is exactly the optimum exponent
    k over (2k minus 1) = 2 over 3. The term is CO-DOMINANT, not subdominant, at
    precisely the value of k the measurement arm uses. The conclusion is
    unaffected because the exponent is unchanged, but the stated justification is
    wrong at the tested case and Stage 1 must re-derive it rather than inherit
    it. This agent verified the arithmetic by hand.
    A SECOND PRE-REGISTERED CORRECTION, ABOUT THE MEASUREMENT S POWER. The source
    idea pre-registers that the measured operation count divided by N to the two
    thirds must stay inside a factor-4 band across a ladder from 2 to the 12 to
    2 to the 18. Over that span, a truth of N to the one half would make that
    ratio fall by exactly a factor of 2, which is INSIDE the factor-4 band. THE
    PRE-REGISTERED BAND THEREFORE CANNOT DISCRIMINATE THE TWO HYPOTHESES IT IS
    MEANT TO SEPARATE - a null that cannot differ from the treatment. To separate
    N to the two thirds from N to the one half by a factor F the ladder must span
    more than 6 times log-base-2 of F bits of N, so the factor-4 band needs a
    span above 12 bits of N. The design therefore either extends the ladder or
    tightens the band, and states which, rather than reporting an
    unfalsifiable band.

  asymptotic_claim:
    problem: >-
      Relation generation for elliptic-curve point-decomposition index calculus,
      in the regime where the factor-base size is free.
    prior_best: >-
      Pollard rho at about 0.886 times the square root of N group operations with
      constant memory; BSGS at square root of N time and square root of N memory.
      RECALLED constants, not verified by this agent.
    time_exponent: k over (2k minus 1), strictly above one half for every finite k
    memory_exponent: k over (2k minus 1), equal to the time exponent at the optimum
    hidden_cofactor: >-
      The coupon-collector logarithmic factor on relations needed is OMITTED, and
      its omission favours the table arm, which is the safe direction for a
      negative reading and the UNSAFE direction for any positive reading - so no
      positive reading may be taken from this record. The linear-algebra constant
      is pinned rather than derived. Sign and coordinate collision factors are
      constants at fixed arity and compound with growing arity, which is why every
      statement is quoted at fixed arity.
    claim_kind: exponent_improvement
    claim_direction_note: >-
      THE EXPONENT MOVES IN THE UNFAVOURABLE DIRECTION. This record claims a
      frontier for a family that is WORSE than the incumbent on both axes; it
      claims no improvement of any kind and must never be summarised as one.

  rerandomization: null

  proof_search_map:
    bottleneck: >-
      The SIZE of the reusable object. Every claim here turns on how many words a
      target-independent precomputation must occupy, and the exact step whose
      removal would change the conclusion is materialising the solution set of
      the target-independent part.
    baseline_embedding:
      parameter_slice: >-
        k = 1, where the table is the factor base itself and the online charge is
        the full enumeration. The formula must then reproduce the algebra-free
        brute-force decomposition total of order N, i.e. worse than rho by a
        square-root factor.
      reproduction_check: >-
        Symbolic identity plus a numerical check that the minimum over B of the
        three-term total has exponent k over (2k minus 1) for a range of k, and
        that at k = 1 the optimum is degenerate with total of order N. Any
        deviation is an algebra error and halts the record. The k = 2
        co-dominance noted in the mechanism must be reproduced here explicitly
        rather than glossed.
    observation_collision:
      observable: >-
        The pair of time and memory exponents of a reusable-precomputation
        scheme.
      distinct_preimage_search: >-
        REQUIRED AND IT SUCCEEDS, which is this record s sharpest content. A
        Macaulay row space, a multiplication-matrix engine for the fixed ideal,
        and a plain hash table all produce the SAME observable at k = 2, because
        all three are explicit representations of one finite set. The collision
        is not a defect of the observable; it IS the content, and it is what
        licenses the screening rule. Any separation must therefore come from an
        object that is NOT an explicit representation, which is the forward
        guidance.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the open question of what a reusable algebraic dependency is
          worth with the closed question of how large the finite set it
          represents is, turning a cost question into a cardinality count.
        predicted_gain: >-
          A closed-form frontier for an entire family at zero compute, replacing
          a measurement programme. NO ATTACK EXPONENT IS MOVED FAVOURABLY.
      - transform: boundary_lift
        proposed_object: >-
          Let the table build be FREE and the lookup be constant-time - better
          than any implementation - and re-run the optimisation.
        predicted_gain: >-
          The result still exceeds N to the one half for every finite k, so the
          negative survives every future improvement of the precomputation, which
          a measurement of today s code could never deliver.
    quantifier_order: >-
      CLAIMED - FOR ALL arities at least 3, FOR ALL k between 1 and arity minus
      1, FOR ALL factor bases of a given size, FOR ALL factor-base geometries,
      the k-fold-table scheme has total cost of order N to the k over (2k minus
      1) with memory of the same order. The universal quantifier over geometry is
      DELIVERED by the conservation identity rather than assumed, and that is the
      one place where a weaker existential reading would gut the claim.
      NOT CLAIMED, AND THE DISTINCTION IS LOAD-BEARING - anything about IMPLICIT
      predicates, compressed filters, or any algorithm outside the
      point-decomposition family.
    method_ceiling:
      strongest_certifiable_claim: >-
        That EXPLICIT table-based reuse of the target-independent part attains
        exactly that time-memory pair and is dominated by Pollard rho on both
        axes at every k. It can NEVER certify anything about implicit
        representations, about the algebraic solve cost, about ECDLP hardness, or
        about algorithms outside this family. Any summary dropping the word
        EXPLICIT is overclaiming under AGENTS.md core rule 4.
      nearby_object_control: >-
        THE EXTENSION-FIELD INSTANTIATION, AND IT IS BLOCKING. Re-run the
        identical accounting in the extension-field regime where index calculus
        demonstrably works. It must NOT return worse-than-rho at every degree for
        the ALGEBRAIC variant. If it does, the whole accounting is wrong and
        nothing here may be reported. A second nearby object is a Sidon factor
        base, where the table has no repeated sums and the frontier must be
        unchanged because it depends on cardinality and not multiplicity.
    proof_obligations:
      - claim: The target-independent part plus membership has a finite solution set of the stated cardinality.
        responsibility: size
      - claim: Any explicit representation of a finite set of that cardinality costs at least that many words.
        responsibility: strictness
      - claim: The three-term total and its optimum, including the k = 2 co-dominance.
        responsibility: correctness
      - claim: The optimum exponent exceeds one half strictly for every finite k.
        responsibility: correctness
      - claim: The k = 1 slice reproduces the brute-force total.
        responsibility: baseline
      - claim: The extension-field instantiation does NOT return a no-go for the algebraic variant.
        responsibility: scope
      - claim: Toy measured operation counts track the predicted exponent across a ladder wide enough to discriminate it.
        responsibility: feasibility
      - claim: Every recovered logarithm carries an independently re-verified certificate.
        responsibility: interface
    not_applicable_reason: null

  assumptions:
    - >-
      The factor base has distinct coordinates and the group has prime order, or
      the accounting is restated with the order of the subgroup the sums actually
      live in.
    - >-
      The table is keyed with constant expected lookup. A sorted array with
      binary search adds a logarithmic factor to the online term and moves no
      exponent; that variant is reported alongside.
    - >-
      k is at most arity minus 1, because the target-independent part contains at
      most that many summands. A table over all summands would already contain
      the answer for every target and is not target-independent.
    - >-
      The conclusion is a power of N and survives any linear-algebra exponent
      between 1 and 2, EXCEPT that at k = 2 the linear-algebra term is
      co-dominant rather than subdominant and must be carried explicitly.

  heuristic_assumptions:
    - id: HEUR-TABLE-1
      formal_statement: >-
        For a factor base of B points and k at most arity minus 1, the k-fold
        signed sumset has cardinality of order B to the k with an explicit
        constant, because distinct k-multisets give distinct coordinates except
        for the forced sign identification and a collision correction that is
        small when the table is small relative to the group.
      random_model_justification: >-
        The rigorous ingredients are the conservation double count, which fixes
        the total multiplicity exactly and geometry-independently, and the
        splitting result that forces the fibre over a good factor-base tuple to
        be exactly the signed-sum set. The CLASSICAL DISTRIBUTION IMITATED is the
        birthday and occupancy model - the sums are assumed to behave like
        independent uniform draws with respect to collisions. THE GAP - additive
        structure in the base creates repeated sums, so this is FALSE BY
        CONSTRUCTION for structured bases, and the frontier is quoted for random
        bases with the structured case reported separately.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-23d7d3]
      falsification_condition: >-
        Measured peak memory growing materially slower than the predicted table
        size, meaning coordinate collisions are collapsing the table and the
        cardinality count is wrong - which would WEAKEN the size lower bound and
        is the most interesting way for this record to be wrong.
    - id: HEUR-TABLE-2
      formal_statement: >-
        The per-trial online charge is of the stated order with constant expected
        lookup, and successive trials are independent for the purpose of the
        trial-count accounting.
      random_model_justification: >-
        The rigorous ingredient is that re-randomisation is an exactly uniform
        map onto a prime-order group, so target uniformity is exact rather than
        heuristic, and the conservation mean then fixes the expected yield
        exactly. What is HEURISTIC is only independence ACROSS trials at a fixed
        factor base - successive targets share one table, so the events are
        correlated. The classical statement imitated is the geometric waiting
        time for a Bernoulli process with the conservation mean as its parameter.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-23d7d3]
      falsification_condition: >-
        Over-dispersion beyond a factor of 2 in the variance of the total trial
        count against the independent prediction, which means the shared table
        induces correlation strong enough to move the constant and must be
        reported with every operation count.

  structural_ingredients:
    - description: >-
        The decomposition-yield conservation identity - the mean per-target yield
        is a binomial coefficient over the group order, exactly, for EVERY factor
        base of a given size, independently of geometry, with maximum absolute
        deviation of the exact cell mean from the prediction measured at exactly
        0 over 144 cells; and its recorded consequences that coverage is bounded
        by the minimum of 1 and the mean, that additive structure LOWERS coverage
        at matched size, and that the one-relation-per-target gain is at most
        1.582.
      citation: knowledge/findings/KN-FIND-007.md
      provenance: internal
      verified_by: >-
        coordinator subagent under TASK-20260904-c0edda, 2026-09-04, read
        knowledge/findings/KN-FIND-007.md in full (97 lines). The identity, the
        144-cell zero-deviation figure, the 0.0021 structured-base coverage
        ratio, the 1.1071 Sidon coverage ratio and the 1.582 bound are all
        verbatim from that file, as is its own statement that it says NOTHING
        about the cost of FINDING a decomposition.
      role: makes the trial-count factor geometry-independent rather than assumed
    - description: >-
        The question s own constraints - that precomputation is charged and
        amortized over an explicit measured batch size, and that Pollard rho,
        BSGS where relevant, and matched random polynomial systems are mandatory
        controls before any attack-cost claim.
      citation: ledger/questions/RQ-SBRG-f31cb2.yaml
      provenance: internal
      verified_by: >-
        coordinator subagent under TASK-20260904-c0edda, 2026-09-04, read
        ledger/questions/RQ-SBRG-f31cb2.yaml in full (45 lines). Both constraint
        strings are verbatim.
      role: the control obligations this design must satisfy
    - description: >-
        The generic-group preprocessing tradeoff for the discrete logarithm and
        its achievability, used to say that a generic preprocessing algorithm
        beats this family.
      citation: >-
        Recalled from the source idea, which itself records the achievability
        result as RECALLED AND NOT OPENED. KN-TECH-005 and KN-LIT-013, where this
        program records the bound, WERE NOT OPENED BY THIS AGENT. The domination
        statement is therefore stated CONDITIONALLY on achievability and must be
        re-cited before it is quoted anywhere; if achievability fails, the
        statement weakens to "the table family does not saturate the barrier".
      provenance: recalled
      verified_by: null
      role: the frontier comparison, conditional and disclosed as such
    - description: >-
        The chained representations whose target-independent part is priced here,
        and their declared full cost model with its rule that every preprocessing
        cost is charged and amortized only over the explicitly measured number of
        targets.
      citation: >-
        EXP-SBRG-60c55e. THAT CONTRACT WAS NOT OPENED BY THIS AGENT; the
        characterisation is taken from IDEA-20260829-66a876, which records
        reading it in full. Stage 0 must confirm the cost-model rule against the
        contract itself before this record s accounting is aligned to it.
      provenance: internal
      verified_by: >-
        coordinator subagent under TASK-20260904-c0edda, 2026-09-04 - read only
        ledger/proposals/IDEA-20260829-66a876.yaml. Not an independent reading of
        EXP-SBRG-60c55e.
      role: the object whose structural part is being priced
    - description: >-
        The complete-splitting result that makes the fibre over a good
        factor-base tuple exactly the signed-sum set, which is what makes the
        sumset table an exact enumeration rather than an approximation.
      citation: >-
        KN-FIND-a8990a. NOT OPENED BY THIS AGENT; taken from
        IDEA-20260829-66a876, which records reading it in full and also records
        that it is NOT an algorithm and gives relation search no leverage. That
        scope note is carried forward here.
      provenance: internal
      verified_by: >-
        coordinator subagent under TASK-20260904-c0edda, 2026-09-04 - read only
        ledger/proposals/IDEA-20260829-66a876.yaml.
      role: makes the table cardinality an exact count at fixed arity

  predictions:
    - metric: >-
        P1 - symbolic optimum of the three-term total over B, at a range of k and
        arity, verified numerically
      direction: different
      minimum_effect: >-
        FORCED EXACT - time and memory exponent both k over (2k minus 1),
        verified to 1e-12 at every parameter pair, INCLUDING an explicit report
        that at k = 2 the linear-algebra term is co-dominant rather than
        subdominant. Any deviation is an algebra error and halts the record
        before any cell runs.
    - metric: >-
        P2 - EXTENSION-FIELD GATE, BLOCKING AND RUN FIRST - the same accounting
        instantiated in the extension-field regime, for the enumerative and
        algebraic variants separately
      direction: different
      minimum_effect: >-
        The gate PASSES only if the accounting does NOT return worse-than-rho at
        every degree for the ALGEBRAIC variant. If it returns a no-go there, the
        accounting is wrong and NOTHING in this record may be reported. Zero
        compute; runs before anything else.
    - metric: >-
        P3 - k = 1 EMBEDDING CONTROL - the formula at k = 1 against the
        algebra-free brute-force total
      direction: different
      minimum_effect: >-
        FORCED to reproduce order N. A mismatch is an algebra error.
    - metric: >-
        P4 - SIDON-BASE CONTROL - the frontier exponent under a Sidon factor
        base, which the conservation finding measures at a coverage ratio above 1
      direction: different
      minimum_effect: >-
        FORCED UNCHANGED, because the frontier depends on cardinality and not on
        multiplicity. A different exponent means a multiplicity assumption has
        been smuggled in and the derivation must be redone.
    - metric: >-
        P5 - MATCHED POLLARD RHO on the identical instances under one frozen
        operation-counting convention (group operations, integer)
      direction: lower
      minimum_effect: >-
        REQUIRED to land at the textbook constant times the square root of N
        within the seed spread, and REQUIRED to be below the table arm at every
        ladder cell by a factor growing with N. A comparison whose baseline arm
        does not reproduce the textbook constant is not measuring a ratio and
        that cell is void.
    - metric: >-
        P6 - measured total group operations of a complete toy solve using the
        k = 2 table, divided by the predicted N to the two thirds, across the
        ladder
      direction: different
      minimum_effect: >-
        BAND AND LADDER RE-SPECIFIED SO THE TEST CAN FAIL. A factor-4 band over a
        6-bit ladder cannot separate the two-thirds exponent from one half, which
        would fall by only a factor of 2 over that span. The contract therefore
        requires EITHER a ladder spanning more than 12 bits of N with the
        factor-4 band, OR a tightened band of at most factor 1.6 over the 6-bit
        ladder. Which was used is declared before the run and reported on the
        face of the result.
    - metric: >-
        P7 - PLANTED COST INFLATION, SWEPT - a known multiplicative inflation
        injected into the table arm at swept magnitudes
      direction: higher
      minimum_effect: >-
        The measured ratio band must move by the predicted amount at EVERY
        magnitude, demonstrating the fit can detect a deviation of known size.
        Without this the exponent check has no demonstrated dynamic range and its
        agreement means nothing.
    - metric: >-
        P8 - measured peak memory of the k = 2 arm against the predicted table
        size
      direction: different
      minimum_effect: >-
        PREDICTED CONSTANT ratio within a factor 2 across the ladder. Memory
        growing materially slower means coordinate collisions are collapsing the
        table and the cardinality count must be corrected; that correction is
        itself a reportable quantity and the record commits to reporting it.
    - metric: >-
        P9 - CURVE-FREE ARM, REQUIRED - the identical three-term accounting and
        toy measurement carried out over a curve-free finite abelian group with a
        random subset of B elements as its factor base
      direction: different
      minimum_effect: >-
        EXPECTED TO REPRODUCE THE ENTIRE FRONTIER, and the consequence is
        pre-declared for that reason. The derivation depends only on the
        cardinality of a multiset sumset in a finite abelian group and on a
        counting identity, with no elliptic-curve content anywhere. IF THE
        CURVE-FREE ARM REPRODUCES THE EXPONENTS AND THE LADDER BEHAVIOUR, the
        frontier is a statement about explicit precomputation over finite abelian
        groups and NOTHING from this experiment may be quoted as a statement
        about elliptic curves or the ECDLP.

  test_boundary:
    instances: >-
      Toy prime-order groups across a ladder wide enough to discriminate the
      predicted exponent (see P6), with the k = 2 table scheme at the smallest
      admissible arity; a matched Pollard rho arm on the identical instances; a
      curve-free finite abelian group arm at matched orders; Sidon and structured
      factor-base arms.
    parameters:
      k_values_symbolic: 2 through 12
      arity_values_symbolic: 3 through 8
      measured_k: 2
      ladder: declared at Stage 1 per the P6 power requirement
      seeds_per_cell: 5
      factor_base_sweep: at least a 16-fold range at each ladder point
      operation_convention: one frozen convention, fixed before any cell runs
      planted_inflation_magnitudes: at least 3
    implementation: >-
      A k-fold sumset table over a keyed structure, an online enumerator, a
      matched Pollard rho arm, and an independent certificate verifier. NO
      Macaulay matrix, NO Groebner basis and NO echelon carrier is built
      anywhere, so this design cannot reproduce this program s recorded
      large-memory stops.
    budget:
      wall_clock_seconds_per_run: 3600
      maximum_memory_gb: 8
      maximum_runs: 200

  falsification_conditions:
    - >-
      F1 - the extension-field control returns a no-go for the ALGEBRAIC variant.
      The accounting is wrong, NOTHING is reported, and the record is withdrawn
      rather than re-scoped.
    - >-
      F2 - the symbolic optimum does not give the predicted exponent. Algebra
      error; halt.
    - >-
      F3 - measured operation counts deviate from the prediction beyond the
      declared band on a ladder wide enough to discriminate it. The k = 2
      accounting is falsified at the tested scale and the deviation s direction
      says which term is mis-charged.
    - >-
      F4 - measured peak memory grows materially slower than the predicted table
      size. The cardinality count is wrong, which WEAKENS the size lower bound
      and is the most interesting way for this record to be wrong.
    - >-
      F5 - the Sidon control changes the frontier exponent. A multiplicity
      assumption has been smuggled in and the derivation must be redone.
    - >-
      F6 - the planted inflation sweep does not move the measured band by the
      predicted amount. The fit has no demonstrated dynamic range and no
      agreement from it is interpretable.
    - >-
      F7 - the matched rho arm does not reproduce the textbook constant. The
      baseline is not measuring what it claims and every ratio from that cell is
      void.
    - >-
      F8 - an IMPLICIT representation is exhibited whose size is smaller than the
      finite set s cardinality and which answers membership faster than
      enumeration. The screening rule does not apply to it, the exhibited object
      is far more valuable than anything here, and the forward guidance names it
      as the priority.
    - >-
      F9 - the curve-free arm reproduces the frontier. Scope collapses to
      explicit precomputation over finite abelian groups and no elliptic-curve
      statement may be made.

  interpretation_limits:
    - >-
      NOT AN ECDLP HARDNESS RESULT AND NOT A LOWER BOUND ON ANYTHING. It prices
      ONE family of reusable precomputations under ONE cost model.
    - >-
      SCOPED TO EXPLICIT REPRESENTATIONS. The whole content lives inside the word
      explicit. This record must NEVER be quoted as closing reusable dependencies
      for this question - premature closure is a failure mode symmetric with
      overclaiming.
    - >-
      The exponent statements are DERIVATIONS under a stated cost model, not
      measurements. Toy scale only in the measured arm; nothing above the tested
      ladder is validated by any part of this design.
    - >-
      Dominated within a stated cost model is not domination in fact. The model
      omits the coupon-collector factor and pins the linear-algebra constant
      without deriving it; both move the conclusion in the SAFE direction for a
      NEGATIVE reading and the unsafe direction for a positive one, so NO
      POSITIVE READING MAY BE TAKEN FROM THIS RECORD.
    - >-
      The generic-preprocessing comparison is CONDITIONAL on an achievability
      result this agent did not verify and the source idea did not open. If only
      the lower bound is established, the honest statement weakens to "does not
      saturate the barrier".
    - >-
      NOT TESTABLE AT REACHABLE SCALE, STATED PLAINLY. Whether the frontier holds
      at cryptographically relevant group orders cannot be measured here; the
      exponent statements are derivations and the measured ladder is toy. No
      extrapolation is claimed.
    - >-
      NOVELTY IS NOT ADJUDICATED. The source idea names two likely locations of
      prior art and records that neither was opened; THIS AGENT OPENED NEITHER
      EITHER, and the honest status is unverified.

