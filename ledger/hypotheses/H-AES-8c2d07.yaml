hypothesis:
  id: H-AES-8c2d07
  question_id: RQ-AES-002

  statement: >-
    SCOPE: AES-shaped ten-round SPN objects derived from AES-128 by replacing one
    named layer, plus the campaign's own verification path; CLAIM TIER toy for
    every rung reading; NO STATEMENT ABOUT AES SECURITY AT ANY ROUND COUNT, no
    attack on AES, no exponent moved.
    THE HYPOTHESIS, IN THREE PARTS.
    (A) FORCED AND ALREADY COMPUTED: replacing SubBytes by the identity in both
    the encryption and the key schedule turns ten-round AES-128 into a map that is
    GF(2)-AFFINE jointly in plaintext and key, C = M_P P + M_K K + c, with
    rank(M_K) = 128 and rank(M_P) = 128 at the full ten-round count -- so the
    master key is UNIQUELY determined by one known plaintext/ciphertext pair and
    recovered by GF(2) elimination in about 2^21 bit operations. This object,
    called L0, is a certifiable ten-round key recovery on a NON-AES object and is
    the positive control this campaign does not have.
    (B) TESTABLE AND EXPECTED TO BITE: a screening instrument that is silent at
    L0 has ZERO demonstrated sensitivity at the full round count, and therefore
    may not license a completion-criterion-C3 barrier statement. The hypothesis
    predicts that at least one instrument this campaign would otherwise trust
    fails its L0 check.
    (C) INFRASTRUCTURE, DECIDABLE IN ONE SHELL LINE: the verification path that
    criteria C1 and C4 require -- re-verification under BOTH pycryptodome and the
    openssl CLI -- is not satisfiable as written in the measured container,
    because pycryptodome is not installed; and the obvious substitute is not
    independent, because two Python-visible bindings over one libcrypto have
    fault correlation exactly 1 on every libcrypto-resident fault. The hypothesis
    predicts a shared-layer mutation catch rate of EXACTLY 0 for the substituted
    pair and EXACTLY 1 for a pair whose second member is derived from the
    FIPS-197 definition rather than from any vendored implementation.
    ALL THREE ARE INFRASTRUCTURE AND INSTRUMENT FINDINGS. Under AGENTS.md rule 5
    none of them is negative mathematical evidence about AES, and none may be
    transcribed as one.

  mechanism: >-
    DERIVED IN-REPO, with the numbers marked SESSION-COMPUTED obtained by the
    ideation session on this machine OUTSIDE the harness -- candidates to re-run
    in-harness, never run records. No primary source was read and none is cited;
    RQ-AES-002's provenance ruling makes that the only admissible mode.

    PART A -- THE L0 RUNG AND WHY ITS VALUE IS FORCED.
    AES-128 is built from AddRoundKey (XOR), SubBytes (the only nonlinear layer),
    ShiftRows (a coordinate permutation), MixColumns (multiplication by fixed
    GF(2^8) constants, hence GF(2)-linear on the bit vector), and a key schedule
    made of XORs, RotWord (a permutation), SubWord (the same S-box), and the rcon
    constants. Replace the S-box by the identity in BOTH places and every
    remaining operation is GF(2)-linear or a constant. Composition of affine maps
    is affine, so
      E(P, K) = M_P P + M_K K + c   over GF(2), with c = E(0, 0).
    SESSION-COMPUTED at the full r = 10: the key map's affinity held on all 20
    random triples tested (E(0,K1) + E(0,K2) + E(0,K1 xor K2) = E(0,0)), and
    exact GF(2) elimination gave rank(M_K) = 128 and rank(M_P) = 128.
    FORCED CONSEQUENCE: M_K is invertible, so K = M_K^{-1}(C + M_P P + c) is
    unique from ONE known pair, recovered in about 128^3 = 2.10e6 bit operations
    (about 2^21), or about 2^15 64-bit word operations. Against the DEFINITIONAL
    exhaustive-key-search reference for a 128-bit key under CM-1 -- 2^127 full
    evaluations in expectation -- that is a margin of roughly 106 bits ON THE L0
    OBJECT, WHICH IS NOT AES; the published-state-of-the-art comparison is
    UNADJUDICABLE in this environment and is asserted in neither direction, and
    no record anywhere may transcribe this as a margin against AES (RQ-AES-002
    R5).
    WHY THIS RUNG IS WORTH BUILDING RATHER THAN ASSUMING: it is the only object
    in reach that is simultaneously at the FULL ten-round count, AES-shaped in
    every layer but one, solved with certainty by a derivation available before
    the run, and capable of emitting a real key-recovery certificate that the C1
    verification path must accept. It converts that pipeline from untested to
    tested at a cost of milliseconds.

    THE SIBLING NULL THAT MAKES L0 MEAN SOMETHING. Real S-box in the ENCRYPTION,
    identity SubWord in the KEY SCHEDULE. Its key schedule is affine but the
    cipher is not, so the affinity test must FAIL on it. If the affinity test
    passes on the sibling, the test is reading the key schedule and not the
    cipher, and L0's reading is void. KN-FIND-029's practice rule requires
    exactly this: a null control must ISOLATE the property it names, and the
    sibling null is built before the label is believed.

    PART A' -- THE GRADED RUNGS.
    L1: SubBytes replaced by the identity on exactly t of the 16 byte positions
    in every round, real key schedule retained, t in {16, 12, 8, 4, 0}. Three
    genuine interior points. The forced content is a SHAPE, not a value: any
    sound sensitivity statistic must be monotone non-increasing in (16 - t). A
    non-monotone profile localises an artifact in the instrument instead of
    leaving "it did not work".
    L2: MixColumns replaced by the identity in all rounds, real S-box and real
    key schedule retained. FORCED STRUCTURAL VALUE, checkable by exhaustive
    single-bit flips: each ciphertext byte depends on EXACTLY ONE plaintext byte
    and on EXACTLY 11 round-key bytes, those on one orbit of the ShiftRows byte
    permutation across the 11 round keys. NO RECOVERY COST IS CLAIMED FOR L2,
    and the reason is stated rather than hidden: the AES-128 key schedule couples
    the 16 byte channels through SubWord and the w[i] = w[i-4] xor w[i-1]
    recurrence, so the channels are independent in the ROUND FUNCTION but not in
    the KEY, and deriving L2's recovery cost is named as work rather than
    asserted as a number.
    L3: real AES-128, ten rounds, where the expectation is that no instrument
    fires and a firing is the campaign's headline event.

    PART B -- THE SENSITIVITY RULE, WHICH IS THE ACTUAL DELIVERABLE.
    An instrument that does not fire at L0 has zero demonstrated sensitivity at
    the full round count and may not license a C3 barrier statement. This is
    KN-FIND-029's "a green states its covered cells or it states nothing" and "a
    repair is proved by execution, never by reading the new task set" applied to
    the campaign's own screening. GOAL-AES-002 adopts those rules by reference
    under instrument_inheritance; the ladder makes them executable. THE RULE IS
    NECESSARY AND NOT SUFFICIENT: firing at L0 could happen for reasons peculiar
    to affine ciphers, so every sensitivity claim states which rungs it covers.

    PART C -- THE VERIFICATION PATH.
    RQ-AES-002 R7 opens the crypto tier through exactly one door: re-verification
    of a recovered key under BOTH pycryptodome and the openssl CLI, recomputed by
    the wrapper and not by the attack code. C1 repeats it and C4 makes the
    Validator check it. SESSION-MEASURED in this container:
    `python3 -c "import Crypto"` raises ModuleNotFoundError; `cryptography` is
    present at 41.0.7; `openssl version` reports OpenSSL 3.0.13; gcc is present
    and a program using `_mm_aesenc_si128` compiles with -maes and runs; numpy is
    present at 2.4.6; 4 cores, 15 GB.
    THE LAYER ARGUMENT. Model a verifier as a stack of layers (wrapper, extension
    module, shared library, CPU instruction path, constant tables). For a fault F
    resident in a layer SHARED by both verifiers, both stacks compute the same
    wrong answer and agree, so Pr[detect] = 0 EXACTLY -- not small, zero. If
    `cryptography` in this build binds OpenSSL's libcrypto (RECALLED, UNVERIFIED;
    establishing or refuting it is a stage of the experiment) then the substituted
    pair shares three layers and its detection probability for every
    libcrypto-resident fault is exactly 0 while its known-answer pass rate is
    exactly 1 -- the signature of a control that cannot fail.
    THE REPAIR, ALREADY IN HAND. A third verifier sharing no layer below the
    interpreter is derivable from the FIPS-197 DEFINITION: the S-box is inversion
    in GF(2^8) mod 0x11b (with 0 -> 0) followed by the fixed GF(2)-affine map
    with constant 0x63. SESSION-COMPUTED: that construction reproduces
    S(0x00) = 0x63, S(0x01) = 0x7c, S(0x53) = 0xed, and -- a much sharper check
    on the same object -- its univariate GF(2^8) interpolation polynomial has
    EXACTLY 9 nonzero coefficients at exponents
    {0, 127, 191, 223, 239, 247, 251, 253, 254} = {0} union {255 - 2^t}, which is
    forced by S = A o (x -> x^254) with A affine. A tabulated S-box with any
    single byte altered cannot satisfy that identity, so the identity is a
    definition-level integrity check obtainable without trusting any
    implementation.
    THE IRREDUCIBLE RESIDUAL, DECLARED OUT OF THE THREAT MODEL: a fault beneath
    all verifiers, in the interpreter or the CPU, is not detectable by any
    in-container instrument. KN-FIND-029 records that the evasion class is not
    closable in process, and that declaration must be written into any
    certificate relying on this instrument.

  assumptions:
    - >-
      That rungs are built as SEPARATE code paths and the pinned FIPS-197
      implementation is never edited in place. The contract re-runs the pinned
      known-answer vectors after ladder construction to prove the ground truth
      was not perturbed.
    - >-
      That the container state measured by this ideation session is the state a
      dispatched task sees. NOT ASSUMED SAFE: stage 0 re-measures it and reports
      the result whether or not it agrees with this record.
    - >-
      L0 PRODUCES A KEY RECOVERY, so any certificate-emitting form of this work
      is gated behind RQ-AES-002's named blocker BLK-1: the certificate
      vocabulary admits only discrete_log | decomposition | none and check_run
      errors on anything else, so protocol-amendment-GOAL-AES-002-001 must be
      authored, approved and COMMITTED before such a card is issued. A
      non-certificate-emitting form may run earlier and the contract says which.

  proof_search_map:
    bottleneck: >-
      Instrument sensitivity at the FULL round count. GOAL-AES-002 names C3 -- a
      scoped barrier statement -- as its most plausible deliverable, and a
      barrier is only as good as the demonstrated ability of the instrument that
      failed to find anything. Every C3 the campaign could produce passes through
      this step, and nothing in the goal's ranked next_action addresses it.
    baseline_embedding:
      parameter_slice: >-
        L0 at r = 1, where the affine map is a single ARK-ShiftRows-ARK
        composition and M_K is a 128x128 permutation-plus-XOR matrix whose rank
        is trivially 128. The ten-round case is the same construction iterated,
        so the r = 1 slice reproduces the known object exactly and the r = 10
        rank is the claim under test.
      reproduction_check: >-
        EXACT AND INTEGER-VALUED, not a resemblance: rank(M_K) and rank(M_P) at
        r = 1..10 are computed by exact GF(2) elimination and must all be 128,
        and the affinity identity must hold on every tested triple. PASSED
        OUTSIDE THE HARNESS at r = 10 before this record was written
        (SESSION-COMPUTED: 128, 128, 20/20). Stage 0 re-runs it in-harness and
        the run stops if it fails.
    observation_collision:
      observable: >-
        Two observables, deliberately kept separate. (i) An instrument's
        fire/silent verdict per rung. (ii) The verifier pair's agree/disagree bit
        per planted mutation.
      distinct_preimage_search: >-
        COLLISIONS EXIST FOR BOTH AND ARE THE WHOLE REASON THE CONTROLS ARE
        MANDATORY.
        For (i): "instrument silent" collides between "the object is strong" and
        "the instrument is blind", and no committed record in this repository
        separates them for any AES screening instrument. The ladder separates
        them by construction, because the objects' forced values differ by
        roughly 106 bits of recovery cost on L0 against exhaustive key search for
        a 128-bit key under CM-1 -- with the published-state-of-the-art
        comparison unadjudicable in this environment -- while L3's is unknown.
        For (ii): "verifiers agree" collides between "both correct" and "both
        identically wrong". On natural inputs the bit is identically "agree" for
        BOTH preimages, i.e. it has zero comparator spread and identifies
        nothing. Planted mutations indexed by resident layer are what restore
        identifiability, and the collision is why the raw agreement bit is not
        used.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the instrument verdict fixed at "silent" and vary the forgotten
          structure: which rung produced it. If no rung separates the verdicts,
          the instrument's verdict is a constant of the apparatus and carries no
          information about any object.
        predicted_gain: >-
          None to an attacker. The gain is that a subsequent C3 barrier becomes
          falsifiable: it acquires a stated sensitivity envelope instead of
          resting on an unexamined silence.
      - transform: representation_reduction
        proposed_object: >-
          Replace the verifier pair's agreement bit by the catch rate as a
          function of the fault's resident layer, converting a statistic with
          zero spread into one forced to 0 or 1 with nothing in between.
        predicted_gain: >-
          Makes the independence question decidable by measurement instead of by
          assertion, at a cost of minutes.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER: THERE EXISTS a fixed object ladder (L0, L1 at five
      values of t, L2, L3), fixed before any instrument is run, such that FOR ALL
      screening instruments the campaign proposes, the instrument's sensitivity
      profile across that ladder is measured and published before any barrier it
      would license is recorded. The ladder MAY NOT be chosen after seeing an
      instrument's result -- a ladder selected per instrument would satisfy the
      reversed and vacuous order (FOR ALL instruments THERE EXISTS a ladder on
      which it looks sensitive), which is explicitly NOT claimed and NOT
      admissible.
      SECOND QUANTIFIER STATEMENT, for part C: the claim is FOR ALL faults F
      resident in the shared layer, Pr[the pair detects F] = 0 -- a universal
      statement over faults, not an average -- which is why a single detected
      shared-layer fault falsifies it outright.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: (a) that L0 as constructed has rank(M_K) = 128 at ten rounds and
        that its key is recoverable from one pair and re-verifiable; (b) that a
        named instrument fires at rungs X and is silent at rungs Z, in this
        container, on this object set; and (c) that a named verifier pair does or
        does not share a layer, on the tested mutation set. It CANNOT certify that
        any verifier is CORRECT -- correctness is not testable from inside the
        stack under test, which is KN-FIND-029's own irreducible finding -- and it
        CANNOT certify anything whatsoever about AES.
      nearby_object_control: >-
        THE NEARBY OBJECT WHERE THE HOPED-FOR CONCLUSION IS KNOWN FALSE IS BUILT
        AND REQUIRED: the L0 sibling (real S-box in the encryption, identity
        SubWord in the key schedule), where the affinity conclusion MUST FAIL.
        A method that cannot separate L0 from its sibling is responding to the key
        schedule rather than to the cipher. A SECOND nearby object: a uniformly
        random 128-bit bijection, on which every structural forced value
        (affinity, dependency cardinalities 1 and 11) must fail. For part C the
        nearby object is a pair KNOWN dependent by construction -- the openssl CLI
        invoked through two different subprocess wrappers -- whose shared-layer
        catch rate must be exactly 0.
    proof_obligations:
      - claim: >-
          Ten-round AES-128 with the identity S-box everywhere is GF(2)-affine in
          (P, K).
        responsibility: correctness
      - claim: rank(M_K) = 128 at r = 10, computed exactly and reported with digests.
        responsibility: baseline
      - claim: >-
          The sibling null fails the affinity test, so the test isolates the
          cipher rather than the key schedule.
        responsibility: interface
      - claim: >-
          The ladder is fixed before any instrument is run and is not re-chosen
          per instrument.
        responsibility: strictness
      - claim: >-
          A shared-layer fault is undetectable by a layer-sharing pair, and the
          layer-disjoint positive control catches every planted fault.
        responsibility: correctness
      - claim: >-
          L0 is not AES and no statement about L0 is a statement about AES; every
          citation carries that clause in the same sentence.
        responsibility: scope
      - claim: >-
          The pinned FIPS-197 ground truth still passes its known-answer vectors
          after the ladder is built.
        responsibility: interface
    not_applicable_reason: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. No complexity claim about AES is made. The only cost figure
    in this record is L0's ~2^21 bit operations, which is a property of a
    constructed non-AES object; sota_delta against the definitional
    exhaustive-key-search reference under CM-1 is ZERO on every axis for AES, and
    the published-state-of-the-art comparison is UNADJUDICABLE in this
    environment and is asserted in neither direction.

  heuristic_assumptions:
    - id: HEUR-AES-L1
      formal_statement: >-
        SENSITIVITY MONOTONICITY. For any sound screening statistic, sensitivity
        is monotone non-increasing along the L1 ladder as AES nonlinearity is
        added, i.e. as (16 - t) increases.
      random_model_justification: >-
        NONE, AND THIS IS THE WEAKEST LINK IN THE RECORD RATHER THAN A DETAIL.
        It is a design expectation, not a derivation: statistics can be
        constructed that respond non-monotonically to partial S-box replacement,
        for instance one keyed to the count of active byte positions rather than
        to their nonlinearity. It is stated as a heuristic precisely so a
        violation is reportable as a finding about the instrument instead of
        being dismissed as noise.
      supporting_results: []
      validation_experiment_ids: [EXP-AES-3283d3]
      falsification_condition: >-
        The five-point profile is MEASURED AND PUBLISHED whether or not it is
        monotone. A violation is a first-class result about that instrument and is
        reported before any verdict the instrument would license.
    - id: HEUR-AES-L2
      formal_statement: >-
        LAYER MODEL. A verifier is a stack of deterministic layers, and a fault
        resident in a layer shared by two verifiers produces identical outputs
        from both, hence catch probability exactly 0; a fault resident above the
        shared layer in exactly one stack has catch probability exactly 1.
      random_model_justification: >-
        Immediate from determinism: identical inputs to an identical faulty layer
        give identical outputs, so a comparison cannot separate them. Not a
        distributional claim. What it does NOT justify is the assumption that the
        planted fault is actually EXERCISED by the test inputs, which is handled
        as a confounder rather than assumed away.
      supporting_results: []
      validation_experiment_ids: [EXP-AES-3283d3]
      falsification_condition: >-
        The known-dependent null pair must read exactly 0 and the layer-disjoint
        positive control exactly 1. ANY INTERMEDIATE READING falsifies the
        two-valued layer model and the mechanism must be rewritten before any
        verdict is recorded.
    - id: HEUR-AES-L3
      formal_statement: >-
        CONTAINER STABILITY. The interpreter, package set and toolchain a
        dispatched task sees are those this ideation session measured.
      random_model_justification: >-
        No justification is offered and none is available: a session outside the
        harness has no standing to speak for the harness's environment. RQ-AES-002
        itself records an UNRESOLVED CONTRADICTION between two committed records
        about the C toolchain, which is direct evidence that environment claims in
        this program have been wrong before.
      supporting_results: []
      validation_experiment_ids: [EXP-AES-3283d3]
      falsification_condition: >-
        Stage 0 re-measures everything under a receipt. A discrepancy with this
        record is REPORTED, not reconciled, and if pycryptodome imports in the
        harness then part C's headline premise is falsified and is withdrawn --
        which costs one shell line and would be the cheapest refutation available.

  structural_ingredients:
    - description: >-
        Composition of GF(2)-affine maps is GF(2)-affine; a 128x128 GF(2) system
        with full rank has a unique solution obtainable by elimination.
      citation: >-
        Elementary linear algebra, derived in this record. No citation asserted.
      role: makes L0's forced value a derivation rather than a hope
    - description: >-
        S-box as affine composed with inversion, giving exactly 9 nonzero
        univariate interpolation coefficients at exponents {0} union {255 - 2^t}.
      citation: >-
        DERIVED from the FIPS-197 definition, which is NOT cited from a read
        document but pinned operationally by local computation per RQ-AES-002's
        provenance ruling. SESSION-COMPUTED confirmation on this machine.
      role: definition-level integrity check on any verifier's S-box table
    - description: >-
        Mutation testing with per-layer fault residence, and the five false-green
        escape classes.
      citation: knowledge/findings/KN-FIND-029.md (internal, read).
      role: supplies the practice rules the ladder and the verifier audit implement

  reduction_chain:
    core_problem: >-
      Establish, before any barrier statement is recorded, (i) that the campaign
      possesses a full-round-count object on which a screening instrument must
      fire, and (ii) that the campaign's certificate verification path consists of
      more than one independent implementation.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. Nothing here reduces to a statement about AES, about any
      other primitive, or about any cost. The ladder makes barrier statements
      INTERPRETABLE; it does not make any of them true, and a C3 still requires
      its own named obstruction, checkable argument and forward guidance.

  predictions:
    - metric: >-
        P1 - L0 key-map affinity at r = 10 over 1000 random key triples
      direction: different
      minimum_effect: >-
        EXACTLY 1000/1000. Forced by construction; SESSION-COMPUTED on 20 triples.
        A single failure means the object was built wrong.
    - metric: P2 - rank(M_K) over GF(2) at r = 10 for the L0 object
      direction: different
      minimum_effect: >-
        EXACTLY 128. SESSION-COMPUTED: 128. A lower in-harness value means the key
        is not unique from one pair and the recovery cost becomes
        2^{128 - rank} verifications; the forced value would then be restated and
        the rung redesigned. THIS CONTROL CAN THEREFORE ACTUALLY FAIL.
    - metric: P3 - rank(M_P) over GF(2) at r = 10 for the L0 object
      direction: different
      minimum_effect: >-
        EXACTLY 128 (the cipher is a bijection in P). SESSION-COMPUTED value 128.
    - metric: >-
        P4 - L0 end-to-end recovery over 100 random keys with re-verification by
        an implementation independent of the recovery code
      direction: higher
      minimum_effect: >-
        EXACTLY 100/100. This is the campaign's first end-to-end exercise of the
        C1 verification path and it MUST pass; anything less is a pipeline defect
        and NO negative result about any object may be reported until it is
        repaired.
    - metric: >-
        P5 - L0 sibling-null affinity (real S-box in the encryption, identity
        SubWord in the key schedule)
      direction: lower
      minimum_effect: >-
        EXACTLY 0/1000 triples passing. The null MUST FAIL. If it passes, the
        affinity test reads the key schedule and not the cipher, and L0's reading
        is void.
    - metric: >-
        P6 - L2 dependency cardinalities from exhaustive single-bit flips
      direction: different
      minimum_effect: >-
        EXACTLY 1 plaintext byte and EXACTLY 11 round-key bytes per ciphertext
        byte. Any other reading means the rung was built wrong.
    - metric: >-
        P7 - shared-layer mutation catch rate of the declared verifier pair, over
        32 planted single-bit mutations resident in the shared layer
      direction: lower
      minimum_effect: >-
        EXACTLY 0/32 if the pair shares libcrypto, EXACTLY 32/32 if it does not.
        No intermediate value is admissible under HEUR-AES-L2; an intermediate
        reading falsifies the layer model rather than being rounded.
    - metric: >-
        P8 - wrapper-layer mutation catch rate (positive control), 32 mutations
        resident above the shared layer in exactly one stack
      direction: higher
      minimum_effect: >-
        EXACTLY 32/32. IF THIS FAILS THE MUTATION HARNESS IS BROKEN AND NOTHING
        MAY BE REPORTED.
    - metric: >-
        P9 - S-box nine-term identity for each verifier's effective S-box
      direction: different
      minimum_effect: >-
        EXACTLY 9 nonzero coefficients at exponents
        {0, 127, 191, 223, 239, 247, 251, 253, 254}. SESSION-COMPUTED on a
        from-definition construction. Detects a single altered table byte with
        certainty.
    - metric: >-
        P10 - number of campaign screening instruments that fail their L0
        sensitivity check, of those run
      direction: higher
      minimum_effect: >-
        AT LEAST 1, predicted. This is the hypothesis's one genuinely risky
        prediction and it is the reason part B is a hypothesis rather than a
        procedure: if every instrument fires at L0, the prediction is falsified,
        the campaign's instruments are better than this record expects, and that
        is a clean and welcome negative.

  test_boundary:
    instances:
      - >-
        L0: ten-round AES-128 with the identity S-box in the encryption AND the
        key schedule.
      - >-
        L0-sibling: ten-round AES-128, real S-box in the encryption, identity
        SubWord in the key schedule.
      - >-
        L1: ten-round AES-128 with the identity S-box on t of 16 byte positions,
        t in {16, 12, 8, 4, 0}, real key schedule.
      - "L2: ten-round AES-128 with MixColumns replaced by the identity."
      - "L3: real AES-128, ten rounds, pinned implementation, unmodified."
      - >-
        Verifier pairs: (declared campaign pair), (openssl CLI via two subprocess
        wrappers -- known dependent null), (from-definition pure Python, openssl
        CLI -- layer-disjoint positive control).
      - >-
        AES-192 and AES-256 ladders are OPEN AND UNATTEMPTED and are never
        recorded as tried, screened or negative.
    parameters:
      key_size: 128
      rounds: 10
      t_values: [16, 12, 8, 4, 0]
      affinity_triples: 1000
      recovery_keys: 100
      mutations_per_layer: 32
      field: GF(2^8) with the FIPS-197 modulus 0x11b
      arithmetic: exact
    implementation: >-
      Pure Python with exact GF(2) elimination for the rank computations; the
      pinned FIPS-197 implementation untouched and re-verified afterwards. numpy
      is optional. The environment facts quoted in the mechanism were
      SESSION-MEASURED outside the harness and RQ-AES-002 records an unresolved
      contradiction between two committed records about the C toolchain, so stage
      0 re-measures rather than assumes.
    budget:
      stage0_wall_clock_seconds: 600
      stage1_wall_clock_seconds: 900
      stage2_wall_clock_seconds_ceiling: 1800
      stage3_wall_clock_seconds_ceiling: 1800
      maximum_memory_gb: 2
      note: >-
        Not authorized by this record. Any CERTIFICATE-EMITTING form is
        additionally gated behind the committed BLK-1 amendment
        (protocol-amendment-GOAL-AES-002-001); a gate uncommitted when the card
        is issued is exactly the retroactive enforcement GOAL-AES-002 refuses.

  falsification_conditions:
    - >-
      F1 - rank(M_K) < 128 in-harness at r = 10. L0's forced value as stated here
      is wrong; the record is superseded with the measured rank and the corrected
