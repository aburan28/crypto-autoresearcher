hypothesis:
  id: H-ECTD-3dbda5
  question_id: RQ-ECTD-001
  goal_id: GOAL-ECTD-001
  source_proposal: IDEA-20260805-4243e6

  statement: >-
    SCOPE: ordinary elliptic curves over prime fields F_p, secret-isogeny
    trapdoors whose endpoint weakness is PUBLICLY RECOGNIZABLE at a cost c_test
    expressible in group-operation-equivalents. CLAIM TIER toy for every
    measured number; the two analytic limbs are size-independent algebra and are
    labelled separately. NO ATTACK IS PROPOSED, NO EXPONENT IS MOVED, AND NO
    DIRECTION IS DECLARED IMPOSSIBLE.
    THE CLAIM, IN THREE LIMBS.
    (L1, UNCONDITIONAL CAP) For every prime p and every admissible trace t, the
    number of F_p-isomorphism classes of elliptic curves over F_p with trace t,
    weighted by 1/|Aut|, is the Hurwitz-Kronecker class number H(4p - t^2), and
    H(4p - t^2) = O(sqrt(p) log p). No GRH, no Brauer-Siegel lower bound, no
    heuristic. Since Tate's isogeny theorem makes the F_p-isogeny class exactly
    the set of curves with a given point count, this set -- the complete space of
    trapdoor endpoints available to any designer, at every volcano level -- has
    size p^{1/2 + o(1)}.
    (L2, TYPICAL VALUE) The Kronecker-Hurwitz relation
    sum_{t^2 <= 4p} H(4p - t^2) = 2p over 2*floor(2 sqrt p) + 1 admissible traces
    forces the MEAN class size to sqrt(p)/2 exactly in the limit, and the MEDIAN
    exponent log(median H)/log(sqrt p) rises monotonically toward 1 with p while
    remaining strictly below it at every computationally reachable size.
    (L3, THE COST CONSEQUENCE) A public attacker who walks the class from E_pub
    with small-degree isogenies, applying the weakness test at each curve and
    retaining the chain traversed, needs NO separate path-recovery stage -- the
    walk that finds E_s is the path -- and pays H*(c_test + c_step)
    group-operation-equivalents at O(log p) memory. Against matched Pollard rho
    at sqrt(pi N / 2), the security margin of ANY such trapdoor is exactly
    log2(c_test + c_step) - 1.33 bits at the mean class size and ZERO IN THE
    EXPONENT.
    WHAT THE HYPOTHESIS DOES NOT CLAIM, STATED INSIDE THE CLAIM SO IT CANNOT BE
    DROPPED: L3 requires the attacker to be able to EVALUATE the weakness test.
    For a weakness that is not recognizable without the trapdoor secret, L3 does
    not apply at all, and the correct reading of this hypothesis is a
    REDIRECTION -- the ordinary-F_p trapdoor design target is a recognition/
    exploitation cost asymmetry, not endpoint rarity, which enters nowhere in
    L1-L3 -- and never a barrier against the family.

  mechanism: >-
    DERIVED IN THIS RECORD. Sources for the two classical inputs (Dirichlet class
    number formula; Kronecker-Hurwitz class number relation) are NOT REACHABLE AS
    PRIMARY TEXT FROM THIS SESSION and are labelled RECALLED; each is assigned a
    verification stage rather than cited. No theorem number, page, author or
    venue is asserted.

    L1. Deuring's correspondence assigns to each ordinary curve E/F_p with trace
    t an order O with Z[pi] contained in O contained in O_K, K = Q(sqrt(D_pi)),
    D_pi = t^2 - 4p; the curves with a given O form a torsor under Cl(O), and
    the union over admissible O of the h(O) is the Hurwitz-Kronecker class
    number H(4p - t^2). VERTICAL VOLCANO LEVELS ARE INSIDE THIS COUNT, which is
    why L1 also bounds GOAL-ECTD-001's priority family (2) and not only family
    (1). Dirichlet gives h(D) = sqrt|D| L(1, chi_D) / pi for D < -4, and
    L(1, chi_D) = O(log|D|) follows from partial summation against the
    Polya-Vinogradov character-sum bound with no unproved input. Summing over
    the O(log|D|) admissible conductors preserves the exponent. With
    0 < 4p - t^2 <= 4p this gives H = O(sqrt(p) log p) uniformly.
    NOTE THE DIRECTION CAREFULLY, BECAUSE IT IS WHY L1 IS UNCONDITIONAL: the
    attacker's cost is proportional to H, so the attacker needs an UPPER bound on
    H, and the upper bound is the elementary side. Brauer-Siegel's lower bound
    h(D) >> |D|^{1/2 - eps} is ineffective and is used ONLY in L2's typical-value
    statement, never in L1 and never in L3.

    L2. The Kronecker-Hurwitz relation sum over t in Z with t^2 <= 4p of
    H(4p - t^2) equals 2p for p prime (RECALLED as the prime case of
    sum_{d | n} max(d, n/d) for general n). Dividing by the trace count
    2*floor(2 sqrt p) + 1 ~ 4 sqrt p gives mean H -> sqrt(p)/2. The median runs
    strictly below the mean because the class-number distribution at fixed p is
    right-skewed: H(4p - t^2) is small exactly when |D_pi| = 4p - t^2 is small,
    i.e. when t sits near the Hasse bound, and there are relatively few such
    traces but their class numbers are small by a full power.

    L3. Fix E_pub with trace t. A public attacker enumerates the class by walking
    the CM action with isogenies of small degree ell (horizontal steps inside a
    level, vertical steps between levels), evaluating the weakness test at each
    curve visited and keeping the composite chain from E_pub. On the first weak
    curve the attacker HOLDS THE CONNECTING ISOGENY BY CONSTRUCTION and
    transports the DLP immediately. This is the structural point the prior ECTD
    records miss: they treat "find E_s" and "find the path E_pub -> E_s" as two
    problems whose difficulties multiply, when in the natural attack they are one
    problem whose costs add. Writing c_test and c_step in
    group-operation-equivalents,
        C_pub  ~  H * (c_test + c_step)   at memory O(log p),
        C_rho  =  sqrt(pi N / 2)  ~  1.2533 sqrt(p)   at memory O(log N),
        C_pub / C_rho  ~  0.399 * (c_test + c_step)   at the mean class size,
        MARGIN(c) = log2(0.399 * c) = log2(c) - 1.33 bits.
    FORCED VALUES, derived before any run and tabulated in EXP-ECTD-45290a:
    margin(1) = -1.33, margin(2) = -0.33, margin(2^8) = 6.67, margin(2^16) =
    14.67, margin(2^20) = 18.67, margin(2^24) = 22.67, margin(2^30) = 28.67 bits.
    At the OBSERVED maximum class size (about 2.5 sqrt p) subtract a further
    2.32 bits.

    THE SECOND CONSEQUENCE, WHICH IS OPERATIONAL RATHER THAN THEORETICAL. L1 and
    L2 also gate the queued BATCH-003 work. At N in [2^40, 2^56] the expected
    class size is 2^19 to 2^27. EXP-ECTD-001 is titled a FULL-CLASS screen and
    sets min_class_size 64 with a 40-CPU-hour budget and five Groebner/Macaulay
    meters per curve. Enumerating 2^19 to 2^27 curves under those meters is not
    within that budget by many orders of magnitude, so exactly one of two things
    must be true and the contract does not say which: either (a) the screen
    selects classes small enough to enumerate, which by L1 forces
    |D_pi| = 4p - t^2 to be atypically small, i.e. t atypically close to the
    Hasse bound -- a PUBLICLY VISIBLE, non-generic feature, so the screen's
    conclusions would not extend to generic curves and, symmetrically, a designer
    could not use such a class without publishing a detectable trace; or (b) the
    screen SAMPLES k curves from a class of size H, in which case max/median over
    a size-k sample of a size-H population is a different statistic from the one
    the decision table pre-registers and must be re-derived as an extreme-value
    statement. Both readings are stated; neither is picked.

  assumptions:
    - >-
      FROZEN DEFINITIONS, fixed before any evaluation. (1) Class size means
      H(4p - t^2), F_p-isomorphism classes weighted by 1/|Aut|; the unweighted
      and marked-point conventions are ALSO computed and reported, and they
      differ by at most a factor 6 (2.6 bits) concentrated at j = 0 and j = 1728.
      (2) Matched rho means sqrt(pi N / 2) ~ 1.2533 sqrt(N) group operations for
      a single-processor random walk without the negation map; the negation-map
      variant divides by sqrt(2) (0.5 bits) and is reported beside it.
      (3) c_test and c_step are FREE SYMBOLS. Nothing in this hypothesis measures
      them and no numeric value for either is asserted anywhere; the deliverable
      is a table of MARGIN as a function of c.
    - >-
      N = #E(F_p) is prime or has a prime factor of the same bit length. Small
      cofactors change constants, not exponents, and the run reports the cofactor
      of every instance it uses.
    - >-
      Only F_p-rational isogenies are available to the designer, since an
      isogeny not defined over F_p does not transport the F_p-DLP. This is a
      property of the object, not a restriction imposed on the adversary.
    - >-
      All class-number computation is exact rational arithmetic by reduced binary
      quadratic form enumeration with Hurwitz weights (1/2 at (a,0,a), 1/3 at
      (a,a,a)). No floating point enters the Kronecker check. Pure Python; the
      container has numpy 2.4.6 and NO Sage, sympy, PARI or gmpy2 (verified in
      this session by import).

  proof_search_map:
    bottleneck: >-
      The public limb of GOAL-ECTD-001's completion criterion: "public path
      search and public detection remain at least matched-rho hard". Every
      prioritized endpoint family (1)-(4) must pass it, no ECTD record contains a
      number for it, and its removal or confirmation changes what the whole
      campaign is trying to build. This hypothesis attacks that one step and
      consumes none of the meter lanes' budget.
    baseline_embedding:
      parameter_slice: >-
        The degenerate slice H = 1 -- a trace whose class contains a single
        curve -- reproduces the known baseline exactly: there is no secret to
        hide, the endpoint is the public curve, and the trapdoor's margin is
        MARGIN = log2(c_test + c_step) - log2(1.2533) with H = 1, i.e. the
        designer gains nothing and rho is the whole story. The claim under test
        is that the general case differs from this slice only by the factor H,
        which is capped at O(sqrt p log p).
      reproduction_check: >-
        SYMBOLIC PLUS FROZEN FIXTURE, and the fixture is exact. The
        implementation must reproduce sum_{t^2 <= 4p} H(4p - t^2) = 2p in exact
        rational arithmetic at p = 11, 13, 101, 1009, 10007. This was COMPUTED IN
        THIS SESSION OUTSIDE THE HARNESS and returned ratio 1.000000 at all five
        primes; it is recorded here as a fixture to be reproduced IN-harness, not
        as a measurement of this program. A ratio that merely "looks close" is
        not a reproduction: the identity is exact and the check is exact.
    observation_collision:
      observable: >-
        The single integer H(4p - t^2) standing for the designer's hiding budget,
        and the derived quantity MARGIN(c) = log2(0.399 c).
      distinct_preimage_search: >-
        SEARCHED, AND ONE COLLISION IS FOUND AND IS THE LOAD-BEARING LIMIT OF THE
        RECORD. Two trapdoor designs with IDENTICAL (p, t, H), hence identical
        observable, sit on opposite sides of the claimed conclusion: (i) a design
        whose endpoint weakness is publicly recognizable at cost c_test, where L3
        binds; and (ii) a design whose weakness is recognizable ONLY with the
        trapdoor secret, where the class walk has nothing to evaluate and L3 does
        not bind at all. H does not separate them. THE SEPARATING CONDITION IS
        THEREFORE NAMED EXPLICITLY AND CARRIED INTO THE STATEMENT: L3 is
        conditioned on public recognizability, and any citation that drops that
        condition misreads the record. A second, weaker collision: the horizontal
        reading H = h(O_max) and the full reading H = H(4p - t^2) give different
        constants and the SAME exponent, so the observable does not distinguish
        them and the conclusion does not depend on which is right.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable H fixed and vary the forgotten structure (which
          curve is the endpoint, which weakness, which chain). The intrinsic
          invariant proposed to distinguish the resulting trapdoors is the
          RECOGNITION COST c_test, and the claim is that it is the ONLY invariant
          that matters for the public limb -- endpoint rarity, chain length, and
          conductor structure all cancel out of L3.
        predicted_gain: >-
          None to any attacker. The gain is a redirection of the campaign's
          design target from rarity to a recognition/exploitation cost asymmetry,
          plus a named quantity (c_test) that future ECTD records must report.
      - transform: specialization_pack
        proposed_object: >-
          Build the resource measure MARGIN(c) = log2(H * c / sqrt(pi N / 2)) and
          realize it by specializing to the mean class size sqrt(p)/2 and to the
          observed maximum 2.5 sqrt(p), charging the two regimes as disjoint
          blocks rather than averaging them.
        predicted_gain: >-
          A two-row table that answers the public-limb criterion quantitatively
          where the campaign currently has prose.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER, AND THE ORDER IS THE POINT.
      L1: FOR ALL primes p, FOR ALL traces t with t^2 <= 4p, H(4p - t^2) <=
      C * sqrt(p) * log p for one absolute constant C fixed before any p. The
      witness C may NOT depend on p or t. The weaker order -- FOR ALL p EXISTS C
      -- is trivially true and is explicitly NOT claimed.
      L3: FOR ALL ordinary-F_p secret-isogeny trapdoors whose endpoint weakness
      is publicly recognizable at cost c_test, THERE EXISTS a public attack of
      cost H*(c_test + c_step). Note that the attack is allowed to depend on the
      instance (it starts at E_pub), which is legitimate, but the BOUND is
      uniform, which is what a barrier needs.
      THE TRAP BEING HUNTED, STATED SO A REVIEWER CAN CHECK IT: a barrier of the
      form "FOR ALL designs THERE EXISTS an attack" is refuted by ONE design for
      which no such attack exists, and the observation-collision audit above has
      already exhibited the shape of that design (weakness not publicly
      recognizable). The hypothesis therefore carries the exception in its own
      statement rather than being falsified by it later.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that the public-attack cost against a publicly-recognizable-
        weakness ordinary-F_p secret-isogeny trapdoor is at most
        O(sqrt(p) log p)*(c_test + c_step) at O(log p) memory, hence that its
        security margin over matched rho is a constant factor and zero in the
        exponent. It CANNOT certify that ordinary-F_p trapdoors do not exist,
        cannot bound trapdoor-DDH (IDEA-20260731-018's lane, where the private
        object is a predicate and the class walk may not apply), cannot say
        anything about supersingular or extension-field constructions, and cannot
        be cited as a family closure. Writing it up as one would be exactly the
        premature-closure failure mode the inventor protocol treats as symmetric
        with overclaiming.
      nearby_object_control: >-
        THE SUPERSINGULAR ISOGENY GRAPH OVER F_{p^2}, where the hoped-for
        conclusion FAILS. It is the closest object to the ordinary F_p class --
        same base prime, same notion of isogeny, same walk structure -- and its
        size is about p/12, exponent 1 rather than 1/2. A method that reports
        exponent 1/2 there has not identified the load-bearing structure and its
        ordinary-side negative is void. This control is free (the count is a
        closed form cross-checked by direct enumeration at toy p) and it is
        REQUIRED, not optional. Its existence is also the substantive reason
        isogeny-based cryptography lives in the supersingular world, and stating
        that is the record's most useful single sentence for a future agent.
    proof_obligations:
      - claim: H(4p - t^2) = O(sqrt(p) log p) unconditionally, constant reported.
        responsibility: correctness
      - claim: sum_{t^2 <= 4p} H(4p - t^2) = 2p exactly, at five primes, exact arithmetic.
        responsibility: baseline
      - claim: The class walk retains the chain, so no separate path stage exists.
        responsibility: interface
      - claim: c_test and c_step are never assigned numeric values; MARGIN is a table.
        responsibility: strictness
      - claim: >-
          The bound is conditioned on public recognizability of the weakness, and
          that condition appears in every downstream citation.
        responsibility: scope
      - claim: >-
          Multi-level traversal cost is folded into c_step and the conclusion is
          reported under BOTH the horizontal-only and full-class readings.
        responsibility: feasibility
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim:
    problem: >-
      Public detection and path recovery against an ordinary-F_p secret-isogeny
      ECDLP trapdoor with a publicly recognizable endpoint weakness.
    prior_best: >-
      Not established anywhere in this campaign. GOAL-ECTD-001's completion
      criterion requires the public limb to be "at least matched-rho hard" and no
      ECTD record supplies a number, a bound, or an attack for it.
    time_exponent: >-
      1/2 + o(1) for the public attack, matching Pollard rho's 1/2. NO EXPONENT
      IS IMPROVED. The claim is that the trapdoor's security exponent CANNOT
      EXCEED 1/2, i.e. it is an upper bound on a designer's achievable exponent,
      not a lower bound on anyone's attack.
    memory_exponent: >-
      0 (that is, O(log p) memory) for the class walk. This is stated because it
      matters for domination: BSGS also achieves exponent 1/2 in time but pays
      sqrt(N) memory, so the class walk is NOT dominated by BSGS on the memory
      axis and the comparison must be made on both.
    hidden_cofactor: >-
      The log p from L(1, chi) = O(log|D|); the free symbols c_test and c_step;
      the 1/|Aut| weighting convention (<= 2.6 bits); the twist factor (1 bit);
      the negation-map factor in rho (0.5 bits).
    claim_kind: constant_factor

  heuristic_assumptions:
    - id: HEUR-ECTD-MASS-1
      formal_statement: >-
        NONE LOAD-BEARING FOR L1. FOR ALL D < -4, h(D) <= (sqrt|D|/pi)(log|D| +
        2), which follows from the Dirichlet class number formula and the
        elementary bound L(1, chi_D) = O(log|D|). This is a theorem, not a
        heuristic, and the entry exists to record that L1 is UNCONDITIONAL where
        every prior ECTD heuristic (HEUR-ECTD-TAIL-1, HEUR-ECTD-VERT-1,
        HEUR-ECTD-DDH-1) is recorded in its own record as supported by no
        theorem at all.
      random_model_justification: >-
        Not applicable -- no random model is invoked for L1. For L2's typical
        value the relevant input is Brauer-Siegel, which IS ineffective, and L2
        is therefore reported as an observed trend over five computed sizes
        rather than as a guarantee.
      supporting_results:
        - Dirichlet class number formula (RECALLED; primary text not reachable from this session)
        - Polya-Vinogradov character sum bound (RECALLED; used only through L(1,chi) = O(log|D|))
      validation_experiment_ids: [EXP-ECTD-45290a]
      falsification_condition: >-
        The computed max_t H(4p - t^2) exceeds (2/pi)(log 4p + 2) * sqrt(p) at
        any tested prime. The recalled constant is then wrong and must be
        re-derived before any part of it is used or cited.
    - id: HEUR-ECTD-MASS-2
      formal_statement: >-
        FOR ALL primes p and FOR ALL admissible traces t, a public attacker can
        traverse the entire F_p-isogeny class of a curve with trace t in H steps,
        each of cost c_step = poly(log p), retaining the connecting chain.
      random_model_justification: >-
        Within a single volcano level this is the simple transitivity of the
        Cl(O) action together with the existence of enough small split primes
        (a Chebotarev statement, and the standard random model is that small
        primes split with density 1/2). ACROSS LEVELS IT IS NOT JUSTIFIED HERE:
        identifying the level requires partial endomorphism-ring information
        whose cost is RECALLED-UNVERIFIED as subexponential L_p(1/2) and is NOT
        asserted. THIS IS THE WEAKEST LINK IN THE RECORD AND IS LABELLED AS SUCH.
      supporting_results:
        - >-
          KN-LIT-7630 (Galbraith, filed in this corpus, citation_verified true,
          local PDF recorded) identifies the large conductor gap as the principal
          obstruction to efficient isogeny construction. That is an obstruction
          to a DIFFERENT task (constructing a specific isogeny between two GIVEN
          curves) than the one here (walking the class and keeping the chain),
          and the distinction is recorded rather than blurred.
      validation_experiment_ids: [EXP-ECTD-45290a]
      falsification_condition: >-
        An independent reviewer shows that vertical traversal cannot be performed
        within poly(log p) per step without information the walker does not have.
        L3 then applies with H replaced by h(O_max) (horizontal level only): the
        constant improves for the designer by the conductor factor and THE
        EXPONENT IS UNCHANGED. EXP-ECTD-45290a reports the margin table under
        BOTH readings precisely so that the conclusion does not depend on this
        heuristic being true.

  structural_ingredients:
    - description: >-
        Tate's isogeny theorem over finite fields: two elliptic curves over F_p
        are F_p-isogenous iff they have equal point counts. Converts "the set of
        admissible trapdoor endpoints" into "the set of curves of a given order".
      citation: >-
        RECALLED, standard. The corpus's nearest filed record is KN-LIT-7630,
        which frames the algorithmic side of it (citation_verified true, local
        PDF at inputs/ECTD-TESKE-20260731/sources/galbraith-iso.pdf, sha256 and
        page count recorded in that entry). THE THEOREM ITSELF IS NOT CITED TO
        THAT ENTRY and no theorem number is asserted.
      role: identifies the endpoint set with an isogeny class
    - description: >-
        Deuring's correspondence and the Hurwitz-Kronecker class number:
        the weighted count of curves with trace t is H(4p - t^2), summed over
        admissible conductors, so vertical volcano levels are inside the count.
      citation: RECALLED, standard; primary text not reachable from this session.
      role: converts the endpoint set into a class number
    - description: >-
        Dirichlet class number formula with the elementary L(1,chi) = O(log|D|)
        bound; gives the unconditional cap.
      citation: RECALLED, standard; the constant is re-measured in EXP-ECTD-45290a rather than trusted.
      role: unconditional upper bound, the direction the barrier needs
    - description: >-
        Kronecker-Hurwitz class number relation sum_{t^2 <= 4p} H(4p - t^2) = 2p
        for p prime; gives the exact mean.
      citation: >-
        RECALLED as the prime case of sum_{d|n} max(d, n/d). REPRODUCED TO RATIO
        1.000000 AT p = 11, 13, 101, 1009, 10007 BY COMPUTATION IN THIS SESSION
        OUTSIDE THE HARNESS, by reduced-form counting; that computation is a
        FIXTURE TO BE REPRODUCED IN-HARNESS and is not a measurement of this
        program.
      role: exact typical value, and the instrument's baseline-reproduction check
    - description: >-
        Decomposition-yield conservation: mean per-target yield is
        binomial(B+m-1,m)/N for every base of size B in any group of order N.
      citation: knowledge/findings/KN-FIND-007.md (in-corpus, proof_status derivation, claim_tier toy)
      role: >-
        NOT used by this hypothesis. Recorded here only to point at
        H-ECTD-110aef, which uses it, so a reader does not conflate the two.

  reduction_chain:
    core_problem: >-
      Upper-bounding the public-attack cost against an ordinary-F_p
      secret-isogeny ECDLP trapdoor with a publicly recognizable endpoint
      weakness, in terms of the isogeny class size.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. There is no reduction from this bound to any statement
      about (i) trapdoors whose weakness is not publicly recognizable, (ii)
      trapdoor-DDH, where the private object is a predicate rather than a solve
      and where the class walk may have nothing to test, (iii) supersingular or
      extension-field constructions, or (iv) whether rare endpoint weaknesses
      exist at all, which is H-ECTD-001's question and is untouched here. Any
      citation toward those must carry the gap explicitly.

  predictions:
    - metric: >-
        G1 -- KRONECKER FIXTURE: [sum_{t^2 <= 4p} H(4p - t^2)] / (2p) in exact
        rational arithmetic at p in {11, 101, 1009, 10007, 100003, 1000003}
      direction: different
      minimum_effect: >-
        EXACTLY 1, as an exact rational, at every prime. Not "within tolerance".
        A deviation is an INSTRUMENT FAILURE and the run reports it as such with
        no mathematical content (AGENTS.md rule 5).
    - metric: >-
        G2 -- MEAN RATIO: mean_t H(4p - t^2) divided by sqrt(p)/2
      direction: different
      minimum_effect: >-
        Within [0.97, 1.03] at every p >= 10^4, converging to 1 with deviation
        O(p^{-1/2}). The exact predicted value is
        2p / [(2*floor(2 sqrt p) + 1) * sqrt(p)/2] and is computed in closed form
        before the measured value is read.
    - metric: >-
        G3 -- MEDIAN EXPONENT: log(median_t H(4p - t^2)) / log(sqrt p) at
        p in {10^3, 10^4, 10^5, 10^6, 10^7}
      direction: higher
      minimum_effect: >-
        MONOTONE INCREASING across the five sizes and within [0.70, 1.00] at each.
        THE BAND IS DELIBERATELY NOT [0.90, 1.00]. Values COMPUTED IN THIS SESSION
        OUTSIDE THE HARNESS at 10^4, 10^5, 10^6 were 0.790, 0.846, 0.870, so a
        naive "the exponent is 1/2 therefore this ratio is 1" pre-registration
        would have been falsified by finite-size effects rather than by
        mathematics. Recording that near-miss here is part of the deliverable.
    - metric: >-
        G4 -- ANALYTIC CAP CHECK: max_t H(4p - t^2) / [ (2/pi)(log 4p + 2) sqrt(p) ]
      direction: lower
      minimum_effect: >-
        <= 1 at every tested prime. Observed max_t H / sqrt(p) was 2.64, 2.16,
        2.63 at p = 10^4, 10^5, 10^6 (computed outside the harness), all well
        inside the cap. A value above 1 refutes HEUR-ECTD-MASS-1's recalled
        constant.
    - metric: >-
        G5 -- SUPERSINGULAR POSITIVE CONTROL: log(#supersingular j-invariants over
        F_{p^2}) / log p, by closed form AND by direct enumeration at toy p
      direction: higher
      minimum_effect: >-
        1.00 +/- 0.02, and the two computations must agree exactly. THE EFFECT
        MUST APPEAR HERE. If the instrument returns an exponent near 1/2 on the
        supersingular side it cannot distinguish a p^{1/2} hiding budget from a
        p^1 one, and NO NEGATIVE FROM ANY OTHER ARM MAY BE REPORTED.
    - metric: >-
