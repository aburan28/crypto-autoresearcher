# =============================================================================
# H-DTREE-8636a3 -- The confirmed harness/semaev.py s4_expr bug (and the
# build_factor_base whole-curve sampling) leaves the 21 archived runs of
# EXP-MTIC-001 and EXP-FIB-001 materially unaffected, or each affected run
# gets a superseding repair. Evidence-integrity audit from KN-OPEN-5b3a08,
# succeeding H-DTREE-001 / EV-DTREE-2e8f6a / EV-DTREE-b47c19.
# =============================================================================
hypothesis:
  id: H-DTREE-8636a3
  question_id: RQ-ECDLP-002
  added: '2026-10-05'
  proposed_by: coordinator
  source_note: >-
    Designed from knowledge/open-problems/KN-OPEN-5b3a08 (read in full
    this session), which records the confirmed defect and the 21-run exposure
    and asks for exactly this audit.
  archived_by: null
  approved_by_decision: DEC-20261005-a67fea
  approved_at: '2026-10-05'
  status: approved
  status_note: >-
    approved on design completeness (frozen contract EXP-DTREE-b93a15);
    nothing asserted until the audit completes and is reviewed.
  title: >-
    Per-run immunity audit of the 21 archived runs exposed to the confirmed
    harness/semaev.py s4_expr variable-collision bug and the
    build_factor_base whole-curve (non-target-subgroup) sampling
  statement: |
    THE DEFECTS (confirmed, not hypothesized). (D1) harness/semaev.py's
    s4_expr contains a variable-collision bug in its .subs() calls,
    confirmed by EV-DTREE-2e8f6a two ways (an independent point-addition
    verifier on a cell where the substitution is exact, and a direct read of
    the source); it was worked around locally for the DTREE experiment only.
    (D2) build_factor_base samples the whole curve rather than the target
    subgroup (KN-OPEN-5b3a08). Both live in the SHARED harness, so every
    archived Semaev/point-decomposition experiment that ran through them is
    exposed until shown otherwise.
    THE EXPOSURE (named by KN-OPEN-5b3a08). EXP-MTIC-001 (11 archived
    runs) and EXP-FIB-001 (10 archived runs): 21 runs total, each of which
    this audit classifies into exactly one of:
    AFFECTED -- the run's code path passes through D1 or D2 AND at least one
    reported number changes when recomputed with the defect fixed;
    IMMUNE -- the run's code path does not pass through either defect, or
    recomputation with the fix reproduces every reported number bit-exactly;
    SUPERSEDED -- a later record already replaces the run's content, so the
    defect question is moot for it (list the superseding record id).
    THE CLAIM (falsifiable): every one of the 21 runs is IMMUNE or
    SUPERSEDED. A run that is AFFECTED falsifies it, and that run's content
    is repaired by a superseding record under a new id (never an edit of the
    archived bytes), with the defect and the changed numbers named.
    NO SCIENCE IS RE-RUN BEYOND RECOMPUTATION. Where recomputation is
    needed it is the SAME computation with the fix applied, on the archived
    inputs and seeds, never a new protocol; a discrepancy with the archived
    number is the finding, not a new claim.
  mechanism: >-
    OBJECT: each archived run's provenance chain -- its recorded code
    identity, its actual imports (harness.semaev.s4_expr or
    build_factor_base), and its reported numbers. OPERATION SET: reading
    archived manifests and code at the recorded commit, plus bit-exact
    recomputation with the fix where the code path is exposed. This is an
    evidence-integrity instrument, not an ECDLP tracked-object claim.
    WHY NOW: every other index-calculus claim in this program cites evidence
    that runs through the shared harness; the audit is the cheapest
    protection of all of it, and KN-OPEN-5b3a08 has carried it unstarted
    since the defect was confirmed.
  assumptions:
    - >-
      The 21-run exposure list in KN-OPEN-5b3a08 is complete for the two
      named experiments; a run found exposed that is NOT on the list is
      ADDED to the table with its id (the audit's own output is the
      authority on the final list, and the open problem is updated on
      review).
    - >-
      Recomputation uses the archived inputs, seeds and code identity from
      each run's manifest; where a manifest lacks code identity, the run is
      classified AFFECTED-UNKNOWN only if the experiment's own
      specification names harness/semaev.py, and the gap is recorded.
  predictions:
    - metric: >-
        the per-run classification (AFFECTED / IMMUNE / SUPERSEDED) with
        its reason string, over the 21 named runs
      direction: different
      minimum_effect: >-
        No direction promised: all-IMMUNE/SUPERSEDED supports the claim;
        any AFFECTED run falsifies it at that run and triggers its repair
        route. Both outcomes are recorded.
    - metric: >-
        recomputation mismatches, with the archived number, the fixed
        number, and the delta, per AFFECTED-candidate run
      direction: different
      minimum_effect: >-
        Reported exactly; a mismatch is the finding. Zero mismatches across
        all exposed-path runs is the immunity reading.
  falsification_conditions:
    - >-
      Any run classified AFFECTED (exposed path + a number that changes
      under the fix). The claim is refuted at that run; the repair record
      (new id, supersession) is the artifact.
    - >-
      An unclassifiable run (unreadable provenance): an impediment at that
      run, never evidence; it is reported with what is missing.
    - >-
      Timeout, crash, environment gap: infrastructure, never evidence.
  test_boundary:
    instances: >-
      The 21 archived runs of EXP-MTIC-001 and EXP-FIB-001 named by
      KN-OPEN-5b3a08, plus any run the audit itself finds exposed in those
      two experiments. Other experiments' runs are OUT OF SCOPE for this
      contract (a later audit may extend the table; DTREE's own runs are
      already covered by EV-DTREE-2e8f6a / EV-DTREE-b47c19).
    parameters:
      defect_D1: harness/semaev.py s4_expr variable collision
      defect_D2: build_factor_base whole-curve sampling
      run_count: 21
  proof_search_map:
    bottleneck: >-
      Whether any of the 21 runs reported a number that the shared-harness
      defect changed. The bottleneck is provenance (which code each run
      actually executed), not the recomputation itself.
    baseline_embedding:
      parameter_slice: >-
        EV-DTREE-2e8f6a's two-cell verification (the independent
        point-addition verifier and the direct source read) is the
        instrument baseline; this audit's D1 reader must reproduce its
        finding on those cells before classifying any run.
      reproduction_check: >-
        The EV-DTREE-2e8f6a cells must reproduce exactly (the verifier's
        outputs and the source-read conclusion), or the audit instrument is
        invalid.
    observation_collision:
      observable: the per-run classification.
      distinct_preimage_search: >-
        A run classified IMMUNE only because its manifest was unread (not
        because the path was shown clean) is an AFFECTED-UNKNOWN, not an
        IMMUNE; the reason strings separate the two.
    constructive_transforms:
      - transform: provenance_table
        proposed_object: the 21-row classification table.
        predicted_gain: the smallest artifact that closes KN-OPEN-5b3a08.
    quantifier_order: >-
      For each run: read provenance; classify path exposure; recompute
      where exposed; classify. Never the reverse (no number is re-derived
      to justify a pre-chosen class).
    method_ceiling:
      strongest_certifiable_claim: >-
        The 21 named runs are each IMMUNE or SUPERSEDED (or the named
        AFFECTED set with repairs). NOTHING about other experiments' runs;
        the shared-harness fix itself is a separate code task.
      nearby_object_control: >-
        The EV-DTREE-2e8f6a cells (known-affected, locally worked around)
        are the positive control the classifier must catch.
    proof_obligations:
      - >-
        The exposure list's completeness within the two experiments is an
        audit output, assumed only as the starting set.
  citations:
    - ref: KN-OPEN-5b3a08
      provenance: kb
      claim: the confirmed defects and the 21-run exposure list.
      verified_by: coordinator, this design session, record read in full
    - ref: EV-DTREE-2e8f6a
      provenance: internal
      claim: the D1 confirmation (verifier + source read) and the local workaround.
      verified_by: coordinator, this design session, evidence record read
    - ref: EV-DTREE-b47c19
      provenance: internal
      claim: the companion DTREE evidence record.
      verified_by: coordinator, this design session, evidence record read
    - ref: H-DTREE-001
      provenance: internal
      claim: the parent DTREE hypothesis this audit succeeds.
      verified_by: coordinator, this design session, record read
  interpretation_limits:
    - >-
      An integrity audit: no ECDLP claim moves in either direction. An
      AFFECTED verdict questions the run's NUMBERS, never the hypotheses it
      tested (those are re-judged only by their own successors).
    - >-
      The shared-harness FIX is out of scope (a code task); this contract
      measures blast radius only.
  drafting_provenance: >-
    Coordinator session of 2026-10-05 (opencode runtime, branch
    coord/s4expr-audit-20261005), from KN-OPEN-5b3a08 under
    DEC-20261005-a67fea's approval.
