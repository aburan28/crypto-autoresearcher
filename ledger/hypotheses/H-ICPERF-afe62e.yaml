hypothesis:
  id: H-ICPERF-afe62e
  question_id: RQ-ICPERF-94c86e
  goal_id: GOAL-ICPERF-e6b6a4
  batch_id: BATCH-94168f
  designed_from: IDEA-20260915-3f1964
  designed_from_note: >-
    IDEA-20260915-3f1964 is `proposed` with `novelty_status: adaptation` and
    was NOT novelty-screened by this record. Designing an idea into a
    hypothesis asserts nothing about its novelty; the novelty screen is owed
    before any promotion of a finding from this line into knowledge/.
  status: specified
  status_note: >-
    `specified`, not `approved`. The approval recorded by DEC-20260916-3c0cf5
    is on the EXPERIMENT (EXP-ICPERF-2f2e40). A hypothesis moves on evidence,
    and there is none yet.
  proposed_by: coordinator
  recorded_at: '2026-09-16'

  statement: >-
    (D1, THE DICHOTOMY -- a derivation, not a heuristic.) Let E: y^2 + xy =
    x^3 + a x^2 + b over F_q, q = 2^n, b != 0, and let sigma be the q-power
    Frobenius. For x in F_q^*, x is the x-coordinate of a point of E(F_q) iff
    s(x) := Tr(x + a + b/x^2) = 0 ("side 0"); the remaining x are the
    x-coordinates of points of the quadratic twist, realised inside
    E(F_{q^2}) as the points with sigma(P) = -P ("side 1"). If
    S_4(x_1, x_2, x_3, x_R) = 0 with all four coordinates nonzero, there are
    points P_1, P_2, P_3, R in E(F_{q^2}) with those x-coordinates and
    P_1 + P_2 + P_3 = +-R. Applying sigma and subtracting gives
    2 * (sum of the side-1 points among {P_1, P_2, P_3, -+R}) = O. Hence
    EXACTLY ONE of: all four are side 0 (an E-decomposition); all four are
    side 1 (a twist decomposition); or the side-1 points among them form a
    nonempty proper sub-sum lying in E[2] = {O, T} with T = (0, sqrt b) (a
    MIXED root).
    (D2, THE MIXED-ROOT COUNT -- this record's replacement for the idea's
    rate estimate.) A nonempty proper side-1 sub-sum in E[2] is a PAIR
    {P, Q} of side-1 points with P + Q in {O, T}, because a single side-1
    point P with P in E[2] would be side 0, and a three-element side-1
    sub-sum leaves one side-0 summand whose own image under the same
    argument is again constrained to E[2]. P + Q = O means Q = -P, i.e.
    x_Q = x_P (family M1, the "cancelling pair"); P + Q = T means
    Q = T - P, i.e. x_Q = b / x_P (family M2). In M1 the remaining point is
    +-R, so x_3 = x_R; in M2 the remaining point is +-R + T, so
    x_3 = x(R + T) = b / x_R. Therefore, for a factor-base subspace V and a
    target x_R:
      #M1(x_R) = #{x in V : x != 0, s(x) = 1} if x_R in V, else 0;
      #M2(x_R) = #{unordered {x, b/x} : x in V, b/x in V, x != 0, s(x) = 1}
                 if b/x_R in V, else 0;
    and the total mixed-root count of the instance is #M1 + #M2. Mixed roots
    are therefore NOT a measure-zero coincidence: they are exactly the roots
    an instance acquires when its own target (or its 2-torsion translate)
    falls inside the factor-base subspace, and they are a deterministic
    function of V, b and x_R alone.
    (D3, THE INSTRUMENT.) Consequently one enumeration of unordered triples
    of factor-base points per (cell, side) -- C(|Fb_s| + 2, 3) point
    additions -- yields, for every x_R in F_q^*, the exact decomposition
    count, the exact class of every root, and a CERTIFICATE of
    unsatisfiability for every target absent from both tables; and a
    complete solver run in all-solutions mode must return exactly the
    table's count times the orderings, which is a completeness test of
    encoding-plus-solver that no first-solution run provides.

  mechanism: >-
    WHY THE SIDE BIT IS THE RIGHT TRACKED OBJECT. s(x) is a genuinely lossy
    projection of a point (one bit out of n) and it propagates
    deterministically under the only operation the point-decomposition
    problem uses, summation to O: side-1 points are exactly the
    F_{q^2}-points with sigma(P) = -P (from y^q = y + x when y lies in
    F_{q^2} \ F_q, since -(x, y) = (x, x + y) on this model), so sigma acts
    as +1 on side-0 summands and -1 on side-1 summands and the relation
    forces 2 * (side-1 sub-sum) = O. Away from E[2] that forces the side to
    be constant across the relation; ON E[2] it produces exactly the two
    families M1 and M2 of D2.

    WHY D2 IS AN IMPROVEMENT AND NOT A REPAIR OF CONVENIENCE. The idea
    record estimated the mixed rate as "about 2^{l-n} per triple, under
    1e-3 total" -- i.e. it treated E[2]-membership as a random coincidence.
    It is not: the sub-sum condition P + Q in E[2] is satisfied
    IDENTICALLY, for every P, by Q = -P, which costs nothing and is
    available whenever the remaining coordinate x_R happens to lie in V.
    D2 makes that structural and gives a closed count. Read against the
    committed evidence: EV-ICPERF-390707 joint V1 recorded 21 mixed roots,
    ALL IN ONE INSTANCE, and EXP-ICPERF-13f001 CH-6 records that this
    instance is n15l5-8-S, whose "target x_R = 0x12 LIES INSIDE THE SUBSPACE
    V ITSELF" and which carries 32 roots against a handful elsewhere. D2
    predicts precisely that shape: mixed roots are possible only where
    x_R in V or b/x_R in V, which on the shipped set is true of exactly one
    instance. Quantitatively, IDEA-20260915-3f1964's PROPOSAL-TIME
    (unreviewed, not evidence) count says 10 of the 31 nonzero x in
    V = {deg x < 5} lie on E at n = 15, so #M1 = 31 - 10 = 21 and, since
    b = 1 and no x in V has 1/x in V at that cell, #M2 = 0 -- total 21,
    against 21 observed. The remaining 11 of the 32 roots are the 10
    side-0 cancelling pairs {x, x, x_R} (which are all-E roots, not mixed)
    plus one genuine decomposition. THE ARITHMETIC IN THIS PARAGRAPH IS A
    DERIVATION OVER AN UNREVIEWED INPUT AND IS NOT EVIDENCE; control
    C-RECON of EXP-ICPERF-2f2e40 is what converts the input count into a
    measured one, and P2 is what converts the derivation into a test.

    WHY THE TABLE IS AN INSTRUMENT AND NOT AN ATTACK. At l <= 8 the table
    costs at most about C(2^{l+1} + 2, 3) ~ 2.8e6 point additions per
    (cell, side) and answers every target in O(1) thereafter. It is the
    "exhaustive / hybrid search as a floor" engine RQ-ICPERF-94c86e lists
    under methods, and it is the point sampler that GOAL-ICPERF-e6b6a4
    objective (2) names as missing. It claims no speedup, moves no exponent,
    and says nothing at any l where V^3 is not enumerable. What it buys the
    boundary table is the difference between a label and a certificate: the
    upstream generator's U label is an UNFILTERED RANDOM x_R with no
    membership or unsatisfiability check (find_points.sage lines 61-67, as
    recorded in KN-LIT-036049), and every U-instance statement this goal has
    made is therefore scoped to 30 specific shipped files.

  assumptions:
    - >-
      The shipped INFO moduli (little-endian coefficient strings) define the
      field in which x_R and every certificate are read. A modulus mismatch
      makes every side bit wrong; control C-KF-CONVENTION is the guard.
    - >-
      Factor-base points are sampled WITH repetition, as find_points.sage
      does, so triples are counted with repetition and the table's size is
      C(|Fb_s| + 2, 3). A design forbidding repeats changes the count by
      O(|Fb|^2) and would have to say so.
    - >-
      D2's enumeration of nonempty proper side-1 sub-sums assumes m = 3
      (four points in the relation). For m != 3 the sub-sum lattice is
      larger and D2 is not stated here.
    - >-
      Every quantity taken from IDEA-20260915-3f1964's proposal-time script
      (|Fb_E| = 21/63/63, |V_E| = 16/30/32, "10 of 31 nonzero x in V lie on
      E" at n = 15) is UNREVIEWED and is an input to be re-established by
      C-RECON, never a result.

  proof_search_map:
    bottleneck: >-
      Certifying unsatisfiability and classifying roots of the descended S_4
      system without a Groebner engine. The enumeration replaces both at
      l <= 8, and the Groebner column that would otherwise be needed for
      UNSAT certification is exactly the column this goal has never been
      able to fill (RUN-ICPERF-305ca3: 32 of 32 Macaulay2 rows aborted,
      P2 null on every cell).
    baseline_embedding:
      parameter_slice: >-
        The 60 shipped instances of (15,5), (17,6), (19,6), and the
        independently produced enumeration behind EV-ICPERF-390707 joint V1
        (artifacts v1_decomp_search_n15l5.json, _n17l6.json, _n19l6.json,
        v1_certificates.json, v1_all_sat_answers.json).
      reproduction_check: >-
        A SECOND, independently written enumerator must reproduce that
        artifact set exactly: 60/60 status agreement, 30/30 S certificates
        present as preimages, 67 roots classified 45 all-E / 1 all-twist /
        21 mixed, and the 21 mixed all in n15l5-8-S. Disagreement localises
        to one of two named implementations and is the interesting outcome.
    observation_collision:
      observable: the pair (s(x_R), table count for x_R).
      distinct_preimage_search: >-
        "Target absent from the table" has at least four distinct preimages:
        genuinely undecomposable; read in the wrong field (modulus); read
        under the wrong bit-order convention; or enumerated over the wrong
        factor base. The convention flip and the null-curve control are
        chosen so each preimage produces a different pattern; a pattern
        matching none is reported as such rather than assigned. Separately,
        "mixed root" has exactly two preimages under D2, M1 and M2, and the
        contract reports them separately so a mixed count that matches the
        total but not the split is visible.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The relation set of a cell as a finite dictionary
          x_R -> multiset of triples, computed once per (cell, side), against
          which every solver answer is an exact membership test and every
          target is an O(1) lookup.
        predicted_gain: >-
          Certified U labels, exact per-target counts, an encoding-plus-solver
          completeness ratio, the twist fraction, and a certified-target
          SAMPLER for cells the upstream generator never shipped. No speedup
          claimed.
    quantifier_order: >-
      FOR EVERY cell (n, l) admitted by AR-1 and AR-2 of EXP-ICPERF-2f2e40
      and FOR EVERY x_R in F_q^*, the table's count is exact and the class of
      every root is determined by s(x_R) together with the M1/M2 membership
      tests of D2. The count is exact for that x_R; no statement is made
      about the distribution over x_R except through HEUR-1, which is a
      comparison model and not a premise of D1 or D2.
    method_ceiling:
      strongest_certifiable_claim: >-
        Exact relation yield and certified satisfiability for every target of
        every cell with 2^{3l} enumerable on this host; nothing at any l
        where C(|Fb|+2, 3) point additions are infeasible, nothing about any
        curve's security, and no exponent.
      nearby_object_control: >-
        The same field, the same V, the same |V|, a DIFFERENT curve constant
        b' != b (control C-NULL-CURVE). The theorem predicts the shipped S
        certificates are absent from that table at the chance rate
        30 * 2^{-n} < 1e-3. A null matched on everything except the object
        the claim is about is the only null that can separate "the table
        finds structure" from "the table finds anything of this size".
    proof_obligations:
      - claim: sigma acts as -1 on side-1 points and +1 on side-0 points
        responsibility: correctness
      - claim: 2 * (side-1 sub-sum) = O forces constant side away from E[2]
        responsibility: correctness
      - claim: the only nonempty proper side-1 sub-sums in E[2] are the pairs M1 and M2 of D2
        responsibility: correctness
      - claim: '#M1 and #M2 are the counts stated in D2'
        responsibility: correctness
      - claim: a target absent from both tables has no F_q-rational root of the descended system
        responsibility: correctness
      - claim: enumeration cost C(|Fb_s| + 2, 3) additions per (cell, side)
        responsibility: runtime
      - claim: the emitted certified-U and certified-S instances are what they are labelled
        responsibility: interface
    not_applicable_reason: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. This hypothesis is an instrument and a classification
    theorem; it claims no complexity improvement and therefore engages none
    of the four promotion gates in agents/coordinator.md. The table's own
    cost, C(|Fb|+2,3) additions once per cell against a per-target solver, is
    reported as the boundary table's FLOOR row and is not a result.

  rerandomization: null

  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        For a uniformly random target x_R on side s in {0, 1} with
        x_R not in V and b/x_R not in V, the number of unordered
        decompositions over Fb_s is Poisson-distributed with mean
        lambda_s = C(|Fb_s| + 2, 3) / #E_s(F_q), where E_0 = E and E_1 is
        the quadratic twist.
      random_model_justification: >-
        The MEAN is exact by double counting and is not a heuristic: each
        negation pair of triples hits exactly one x-value, so the sum of the
        table's counts over all x-coordinates of side s equals the number of
        triples (control C-SUM is this identity). What is heuristic is the
        SHAPE: the Poisson limit is the classical occupancy limit for T balls
        in M bins at T/M = O(1), which Semaev 2015/310 eq. (11) uses in the
        same idealised form. The exclusion of targets inside V (or with
        b/x_R in V) is required, not cosmetic: D2 says those targets carry a
        deterministic block of mixed roots and are not draws from the
        occupancy model at all -- which is exactly what n15l5-8-S's 32 roots
        against a handful elsewhere looks like.
      supporting_results:
        - >-
          Exact mean by double counting (this record, derivation; no external
          citation required or offered).
        - >-
          inputs/SEMAEV-2015-310/paper_fulltext.md eq. (11), idealised yield
          2^{mk-n}/m! for a k-dimensional V -- provenance internal, verified
          by validator TASK-20260913-da3982 per IDEA-20260913-cedd2f; not
          re-opened by this record.
      validation_experiment_ids:
        - EXP-ICPERF-2f2e40
      falsification_condition: >-
        The per-target count histogram of a (cell, side) departing from
        Poisson(lambda_s) by a chi-square p-value below 0.01 after excluding
        the D2 targets, or the maximum observed count exceeding the Poisson
        upper quantile at the number of targets tested. Either outcome is a
        structural finding about the landing of triple-sums and is reported
        as one; neither touches D1, D2 or D3, which do not rest on HEUR-1.

  structural_ingredients:
    - description: >-
        Candidate roots of a descended summation-polynomial system must be
        checked for correspondence to curve points -- the folklore fact that
        D1 makes exact and turns into a classifier.
      citation: 'ePrint 2014/806, Galbraith-Gebregiyorgis, Summation polynomial algorithms for elliptic curves in characteristic two, Section 4 (sys1 passage)'
      provenance: retrieved
      verified_by: >-
        idea-generator TASK-20260915-5ba08b (WebSearch fetch, passages read in
        that session, as recorded in IDEA-20260915-3f1964 citations). NOT
        re-opened by this record.
      role: the fact the dichotomy sharpens
    - description: >-
        The point-halving trace criterion s(x) = Tr(x + a + b/x^2) = 0 for
        x in x(E(F_q)), and Tr(a') = Tr(a) + 1 on the quadratic twist.
      citation: IDEA-20260913-cedd2f (which records Pornin 2022/1325 Section 3 and Fong-Hankerson-Lopez-Menezes 2003 Lemma 4.1 as retrieved)
      provenance: internal
      verified_by: idea-generator TASK-20260913-335d65 (retrieved, per that record); read here as a committed record
      role: the side criterion the classifier evaluates
    - description: >-
        The measured classification this record's D2 must reproduce: 60/60
        solver agreement, 67 roots as 45 all-E / 1 all-twist / 21 mixed with
        all 21 in one instance, and n15l5-8-S degenerate with x_R inside V.
      citation: EV-ICPERF-390707 and coordination/review/icperf-20260913-66fd51/TASK-20260913-6c5729/report.md
      provenance: internal
      verified_by: coordinator BATCH-94168f 2026-09-16 (report.md read this session, lines 146-158)
      role: the baseline the reproduction control embeds

  reduction_chain:
    core_problem: >-
      Certified satisfiability and exact decomposition counting for the
      Weil-descended S_4 point-decomposition problem at l <= 8.
    corollaries:
      - problem: >-
          Certified-U and certified-S instance generation at cells the
          upstream benchmark never shipped, which is the input every other
          ICPERF PDP measurement needs.
        reduction_ref: >-
          Internal: the table is a membership oracle, so sampling x_R outside
          it certifies U and reading a triple's sum certifies S. No external
          reduction is cited or needed.
        asymptotics_preserved: not_applicable

  predictions:
    - metric: >-
        Number of the 30 shipped S certificates present in the table as a
        preimage of their own target
      direction: different
      minimum_effect: exactly 30 of 30
    - metric: >-
        Mixed-root count per shipped instance, split into families M1 and M2
        of D2
      direction: different
      minimum_effect: >-
        EXACTLY 21 on n15l5-8-S (M1 = 21, M2 = 0) and EXACTLY 0 on each of
        the other 59, reproducing EV-ICPERF-390707 joint V1's total of 21.
        The split, not only the total, is the prediction: a total of 21
        reached with M2 > 0 falsifies D2's identification of the families
        even though it matches the recorded number.
    - metric: >-
        Root classification agreement -- class of every root against
        s(x_R) together with the D2 membership tests
      direction: different
      minimum_effect: >-
        100% on all 67 recorded roots: 45 all-E, 1 all-twist (the
        n19l6-19-U answer), 21 mixed. Any root classified `neither` is a
        failure of the theorem or of the field reading and is reported with
        the deciding arithmetic.
    - metric: >-
        Status agreement between the table and every complete solver on the
        60 shipped instances
      direction: different
      minimum_effect: 60 of 60, reproducing EV-ICPERF-390707 joint V1
    - metric: >-
        All-solutions count from a complete solver divided by the table's
        count times the orderings (6, corrected exactly for repeated
        x-values)
      direction: different
      minimum_effect: >-
        exactly 1.000 on every S instance where the all-solutions build
        finishes; a deficit is an incompleteness of solver or encoding and
        voids every S timing in this goal's table as a timing of a different
        problem
    - metric: >-
        Fraction of freshly generated U targets (uniform on F_q^*, recorded
        seed, 200 per cell) that the table finds decomposable
      direction: different
      minimum_effect: >-
        within the Poisson band of 1 - exp(-lambda) computed from the SAME
        run's measured |Fb_0|, |Fb_1|; predicted 0.19 / 0.29 / 0.08 at
        (15,5) / (17,6) / (19,6) from IDEA-20260915-3f1964's unreviewed
        proposal-time counts. Compared against the 1 of 30 observed on the
        SHIPPED U set, this is the measurement that settles whether the
        upstream generator screens its U targets -- a statement about the
        benchmark's provenance, never about any curve.
    - metric: >-
        Number of new cells among (21,7), (23,7), (25,8) admitted by AR-1 and
        AR-2 and carrying a complete table plus a certified sampler
      direction: higher
      minimum_effect: >-
        at least 1; a cell not admitted is recorded with the failing
        admission rule and its measured pre-pass quantity, which is an
        instrument fact and not a result about anything

  test_boundary:
    instances: >-
      The 60 shipped instances of SRC-ICPERF-TRIMOSKA-ECICB-2024 at (n,l) in
      {(15,5),(17,6),(19,6)} on the single fixed Koblitz curve
      y^2 + xy = x^3 + x^2 + 1; plus the candidate new cells (21,7), (23,7),
      (25,8) subject to the admission rules of EXP-ICPERF-2f2e40. m - 1 = 3
      throughout. One host.
    parameters:
      V: '{deg x < l} (the shipped Trimoska subspace) throughout; designed subspaces are H-ICPERF-f08b1e''s object, not this one''s'
      sides: both, always reported separately
      labels: S and U, always reported separately -- RQ-ICPERF-94c86e names pooling a composition artifact
      solvers_named_and_versioned: >-
        WDSat @ 61c6ff3 rebuilt per cell with exact static sizing, in BOTH
        the default build and a separate __FIND_ALL_SOLUTIONS__ build whose
        build hash is recorded distinctly; CryptoMiniSat 5.11.15 (CNF-XOR
        native) as the second complete solver for the status cross-check.
        No Groebner engine is used and none is needed: the table replaces the
        UNSAT certificate a Groebner engine would have provided.
    implementation: >-
      New tree under experiments/EXP-ICPERF-2f2e40/code/. It never edits the
      frozen EXP-ICPERF-66fd51 tree, never edits EXP-ICPERF-e21835 or
      EXP-ICPERF-13f001 (BATCH-a33cda's), and is written WITHOUT reading
      binec.py, convert.py, semaev.c, Weil_descent.sage or the validator's
      val_gf2n.py -- control C-INDEP.
    budget:
      note: >-
        Advisory per CLAUDE.md. Arithmetic only; single core; no timing claim
        is made by this hypothesis, so a loaded host does not contaminate it.

  falsification_conditions:
    - >-
      A shipped S certificate absent from the table, or a solver-verified
      E-decomposition whose x_R is side 1: D1 or the field reading is wrong.
      The hypothesis is withdrawn until the arithmetic is localised to one of
      two named implementations.
    - >-
      A mixed root whose side-1 sub-sum is not in E[2]: D1 is false as
      stated.
    - >-
      A mixed root belonging to neither family M1 nor family M2, or a mixed
      count differing from #M1 + #M2 on any instance: D2 is false as stated.
      This is the clause most likely to break, because D2 is this record's
      own derivation and has been checked against exactly one observed
      number.
    - >-
      A complete solver returning UNSAT on a target the table lists, or SAT
      on a target absent from both tables: the table or the encoding is
      wrong, and every certificate this goal issues is void until resolved.
    - >-
      An all-solutions count below the table's count times the corrected
      ordering multiplicity on any S instance: the encoding loses roots.
    - >-
      NOT a falsifier: a cell not admitted by AR-1/AR-2, a watchdog stop, a
      solver timeout, or an all-solutions build that does not finish. Those
      are infrastructure outcomes (AGENTS.md rule 5) and in particular a
      solver timeout is never evidence that an instance is unsatisfiable.

  interpretation_limits:
    - >-
      An instrument at l <= 8 on one curve and one host. It claims no
      speedup, no exponent, nothing about any l where V^3 is not enumerable,
      and nothing about any curve's security.
    - >-
      Agreement with the solvers on the shipped U targets confirms
      completeness of the TESTED ENGINES on THOSE INSTANCES only.
    - >-
      A statement about how many shipped U targets are decomposable is a
      statement about the benchmark's provenance, to be raised with the
      source. It is not a finding about Semaev's method.
    - >-
      D2 is derived for m = 3. Nothing here transfers to m != 3.
    - >-
      A twist decomposition is a genuine relation FOR THE TWIST. Counting one
      for E would overstate the yield, and any later relation-search column
      must count it on the correct curve or not at all
      (EXP-ICPERF-13f001 interpretation_limits, same point).
    - >-
      The new cells (21,7) and (25,8) have composite n, so E(F_{2^n})
      contains subfield points and the group order may be highly smooth.
      Nothing in this hypothesis depends on n being prime, but no asymptotic
      constant may be read off those cells.
