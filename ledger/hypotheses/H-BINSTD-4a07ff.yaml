  heuristic_assumptions:
    - id: HEUR-BINSTD-4a07ff-H1
      formal_statement: >-
        (Coverage.) For P uniform in F_{V'} and z uniform in Gamma_w, the
        points [z]P are distinct with probability
        1 - O(|Gamma_w|^2 2^{2l'}/l), so |T_w| = |Gamma_w| 2^{l'} up to that
        error.
      random_model_justification: >-
        Birthday bound for uniformly random elements of Z/l; [z]P=[z']P'
        in prime-order G forces a scalar relation mod l.
      supporting_results:
        - ref: IDEA-20260926-b48c9d
          provenance: internal
          claim: H1 coverage statement and product-law arithmetic
          verified_by: coordinator (proposal read in full this design session)
        - ref: KN-FIND-aa2efc
          provenance: kb
          claim: Matched rho 2^60.809 context; product-law table unreviewed
          verified_by: coordinator (finding entry read this design session)
      validation_experiment_ids:
        - EXP-BINSTD-5d3ec0
      falsification_condition: >-
        At n=19, measured |T_w| differs from |Gamma_w|2^{l'} by more than
        the birthday correction on two cells; OR Stage-0 |Gamma_13|
        disagrees with ≈2^71 by more than 1 bit.
    - id: HEUR-BINSTD-4a07ff-H2
      formal_statement: >-
        (Relabelling of the coupled solve.) The one-hot shift encoding of
        the coupled w=2 system costs the sum of the per-pattern solves plus
        an additive overhead of about one unit of work per shift ruled out,
        as KN-FIND-47da4e measured for independent summands transplanted to
        the coupled shape. Predicted ratio >= 1.0.
      random_model_justification: >-
        No rigorous bound; imitates the additive-overhead reading of
        KN-FIND-47da4e (toy tier) on the coupled Frobenius-twisted shape.
      supporting_results:
        - ref: KN-FIND-47da4e
          provenance: kb
          claim: >-
            One-hot shift encoding over orbit union costs 1.00–1.47× summed
            gauge-fixed systems at n=13..23, m=2, independent summands
          verified_by: coordinator (finding entry read this design session)
        - ref: IDEA-20260926-b48c9d
          provenance: internal
          claim: H2 prediction ratio >= 1 for coupled shape; <0.5 falsifies
          verified_by: coordinator (proposal read in full this design session)
      validation_experiment_ids:
        - EXP-BINSTD-5d3ec0
      falsification_condition: >-
        Stage-2 ratio < 0.5 at two of three l' in {8,10,12} at n=19
        (outcome ii — escape live).

