  title: >-
    Tau-adic factor base T_w over an orbit-union base is a Gamma_w-orbit
    quotient: free-oracle attempts 2^131/|Gamma_w| reach rho only at w>=13;
    enumerated collision form costs ~2^{131-l'/2}>=2^66; coupled one-hot
    escape predicted ratio>=1 (closure)

  statement: >-
    SETTING. ECC2K-130: E: y^2 + xy = x^3 + 1 over F_{2^131}, order 4*l with
    l a 129-bit prime (KN-LIT-661e97). tau is the 2-Frobenius with
    tau^2 + tau + 2 = 0, acting on the prime-order subgroup G as scalar mu
    with mu^2 + mu + 2 = 0 mod l and ord_l(mu) = 131
    (analysis/frobenius-orbit-ecc2k130/README.md). Let V' be an F_2-subspace
    of dimension l', F_{V'} = {P : x(P) in V'}. Define
    T_w = {Q = (sum_{i=1}^w e_i tau^{j_i})(P) : P in F_{V'}, e_i in {+1,-1},
    0 <= j_1 < ... < j_w < 131}.

    CLAIM (A) — SCALAR COLLAPSE. f(tau) = sum e_i tau^{j_i} acts as scalar
    z = f(mu) mod l, so every Q in T_w is [z]P with z in
    Gamma_w = {f(mu) : wt(f)=w}, |Gamma_w| <= C(131,w) 2^w. Tracking the
    representative P is the Gamma_w-orbit projection (lossy under
    Sigma = {tau, negation, Q -> Q + tau^j(P) for the SAME P}).

    CLAIM (B) — COVERAGE PRODUCT LAW (structural arithmetic at n=131).
    Free-oracle attempts column = 2^131 / |Gamma_w|. Re-derived Stage-0
    target: |Gamma_13| ≈ 2^71 so attempts ≈ 2^60 at w=13 (within 0.5 bit of
    this packet's arithmetic). Enumerated collision form (birthday over
    F_{V'}) costs about 2^{131 - l'/2} scalar multiplications, minimised
    near l'=130 at ≈ 2^66 — above matched rho 2^60.809 (KN-FIND-aa2efc)
    before charging the tau-adic NAF constant (≈2^5.5 group ops, recalled
    Solinas 2000 — not load-bearing for measured Stage-1 units).

    CLAIM (C) — COUPLED ESCAPE (priced, predicted null). Solving
    Q = f(tau)(P) for x(P) in V' without enumerating patterns via the
    coupled Weil-descended system at w=2. Predicted (HEUR-BINSTD-4a07ff-H2):
    one-hot-over-j solve costs >= summed per-pattern solves (ratio >= 1),
    matching the independent-summand reading of KN-FIND-47da4e. Ratio < 0.5
    at two toy cells falsifies the closure prediction and reopens CERTBIN.

    CLAIM TIER: structural_certificate + toy heuristic validation.
    NO exponent move. NO break. NO rho competitiveness. NO attack claim
    on any deployed curve. Escape that survives → follow-up under
    RQ-CERTBIN-836ce2, not a silent upgrade of this certificate.

  statement_note: >-
    IDEA-20260926-b48c9d claim text is immutable and left at status
    proposed. This hypothesis restates the mechanism with explicit Stage-0
    arithmetic obligations, HEUR ids, certificate.kind vocabulary, and
    citation provenance suitable for a frozen EXP. Solinas 2000 tau-adic
    NAF density remains recalled; Stage-1 units are scalar multiplications
    so the constant never enters measured ratios.

  mechanism: >-
    OBJECT FRAME (from source IDEA, retained). Representation R3: pair
    (representative P in F_{V'}, tau-adic scalar z in Gamma_w). Operation
    set Sigma = {tau, negation, translation by tau^j(P) for the same
    representative}; translation by a different factor-base point is
    EXCLUDED. Trichotomy: Class I partial-action (representative
    propagates under Sigma only). Lossy projection discards z
    (up to ~2^71:1 at w=13); Sigma-compatible; lossy in the representation.
    KN-OPEN-020 class: TARGET-DEPENDENT — declared and charged, not claimed
    to escape the universal statement. Off-limits: F1 as closure target,
    F6 as the Gamma action; F2 supplies the coupled Semaev escape. What
    this packet freezes: Stage-0 product-law arithmetic, Stage-1 collision
    instrument with relabelled + ordinary controls, Stage-2 coupled
    one-hot vs per-pattern ratio at n=19.

  assumptions:
    - >-
      Images [z]P for z in Gamma_w and P in F_{V'} are heuristically
      distinct when |Gamma_w| 2^{l'} << l (favours the object); failure
      only lowers coverage (HEUR-BINSTD-4a07ff-H1).
    - >-
      OFF-LIMITS COMPONENTS DECLARED: F1 (closure), F6 (action), F2
      (coupled escape). No new factor base claimed to escape KN-OPEN-020.
    - >-
      Product-law table of BRIEF/KN-FIND-aa2efc cited as unreviewed
      context; this packet's attempts column 2^131/|Gamma_w| is a separate
      transparent count and does not depend on that table.
    - >-
      Arithmetic at n=131 is Stage-0 analysis; executable cells at n=19.
    - >-
      Solinas 2000 tau-adic NAF constant is RECALLED only; measured Stage-1
      unit is scalar multiplications.

  proof_search_map:
    bottleneck: >-
      Canonicalising a Gamma_w-orbit (recovering P from Q) at cost below
      |Gamma_w| scalar multiplications; without that, claim (B) makes the
      object a walk at 2^{131 - l'/2}.
    baseline_embedding:
      parameter_slice: >-
        w=1, Gamma_1 = {±mu^j}: T_1 is the orbit union of F_{V'} under
        Frobenius and negation — exact object of KN-FIND-47da4e /
        analysis/frobenius-orbit-ecc2k130 (gain exactly n on relations).
      reproduction_check: >-
        Stage 0 zero-compute: |Gamma_1|=262, attempts 2^131/262 ≈ 2^122.97;
        collision form 2^{131-l'/2} at l'=130 is 2^66 vs rho without class
        gains ≈2^65.3. Stage 1 w=1 cell must reproduce orbit-union gain n
        and no more.
    observation_collision:
      observable: >-
        Pair (attempts column, per-attempt canonicalisation cost) at
        (w,l'); at toy scale the collision-based DLP cost in scalar
        multiplications and the coupled/per-pattern work ratio.
      distinct_preimage_search: >-
        Enumerated form (cost |Gamma_w|) vs coupled-solve form (escape).
        Report both so the attempts column is never read as a cost.
        Control for trivial-linearisation artifact: sweep l' until
        C(l',2)+l' > n.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "Q in T_w" by "exists z in Gamma_w with [z^{-1}]Q in
          F_{V'}" (enumerated) and separately by the coupled descended
          system with one-hot shift bits. Completeness: every tau-adic
          decomposition is a solution. Soundness: re-verify by curve
          arithmetic (certificate.kind discrete_log / decomposition).
        predicted_gain: >-
          None predicted (closure outcome); transform exists so the escape
          is measured rather than asserted.
      - transform: observable_fiber
        proposed_object: >-
          Hold attempts column fixed; vary scalar-set representation:
          Gamma_w on Koblitz vs random scalar set of equal size on
          relabelled Z/(4l) and on ordinary curve. Identical collision
          statistics prove the fibre carries no curve structure.
        predicted_gain: Certificate of genericity for the enumerated form.
    quantifier_order: >-
      FORALL w in 1..131 and FORALL l' in 1..131: attempts(free oracle) =
      2^131 / |Gamma_w| and enumerated collision form ≈ 2^{131-l'/2}
      scalar multiplications (claim B, arithmetic). EXISTS a toy cell
      (n=19, a=0) at which coupled one-hot and summed per-pattern solves
      are both measured; PREDICTED ratio >= 1 (outcome i). Falsifiable by
      ratio < 0.5 replicated at a second n.
    method_ceiling:
      strongest_certifiable_claim: >-
        On ECC2K-130 the tau-adic factor base over an orbit-union base of
        dimension l' has free-oracle attempts 2^131/(C(131,w)2^w), reaching
        rho only at w>=13; its enumerated form is a walk-collision at about
        2^{131-l'/2} >= 2^66 scalar multiplications, generic by the
        relabelled control; and at toy n the coupled one-hot solve costs
        [measured ratio] of the summed per-pattern solves. Certifies
        NOTHING about a coupled solver at n=131 and nothing about w>=3
        coupled systems not built.
      nearby_object_control: >-
        BLOCKING. Ordinary curve of same n (BRIEF n=19 CERTBIN cell
        A=46693, B=306147, h=2) has no tau; same collision algorithm with
        Gamma replaced by a random scalar set of equal size must match
        Koblitz and relabelled Z/NZ. If Koblitz differs from both, report
        instrument defect before any reading.
    proof_obligations:
      - claim: >-
          f(tau) acts as f(mu); T_w is the set of [z]P with z in Gamma_w
          and P in F_{V'}.
        responsibility: correctness
      - claim: >-
          Attempts column 2^131/|Gamma_w| and |Gamma_13| about 2^71
          (re-derived).
        responsibility: size
      - claim: >-
          Collision form about 2^{131-l'/2} scalar multiplications,
          minimised near 2^66.
        responsibility: runtime
      - claim: >-
          Enumerated form is generic (relabelled control reproduces it).
        responsibility: correctness
      - claim: >-
          Coupled w=2 descended system is quadratic in bits of x per
          fixed shift.
        responsibility: correctness
      - claim: >-
          Every toy relation and DLP solution is certificate-verified.
        responsibility: correctness
      - claim: >-
          Nothing asserted at n=131 beyond arithmetic on published
          constants.
        responsibility: scope
    not_applicable_reason: null

