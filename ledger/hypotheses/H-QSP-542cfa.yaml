    parameters:
      threshold_exact: kappa_crit = 1/(2 beta_min) = (n-1)/n, attained at n' = n-1 (q = 1, r = 1)
      threshold_at_n_131: 130/131 = 0.9923664, from beta_min = 131/260 = 0.5038462 at n' = 130
      published_constraint: kappa "currently majored by 4.876" (KN-LIT-4fe9d2 Proposition 7) -- an UPPER bound
      eliminant_size_model: 'M(E) = 2^{m(m-1)} d^{m(m-1)/2} (KN-LIT-0a321c Appendix A.1, stated there as an upper bound)'
      restriction: quasi-subfield polynomial per Definition 3.1 of KN-LIT-0a321c; equivalently n' < n with n' not dividing n
    implementation: >-
      None exists. A resultant or Groebner engine is required and the
      container has none (sage, magma, macaulay2, singular, msolve,
      ntl_or_flint all absent, re-confirmed by the environment.json of
      EXP-QSP-33b442's own runs). Whether that impediment binds at the
