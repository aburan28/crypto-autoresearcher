hypothesis:
  id: H-QSP-542cfa
  question_id: RQ-QSP-f9bbdb
  source_proposal: IDEA-20260916-5c9d6e
  supersedes: H-QSP-5540d7
  supersedes_scope: >-
    THE CONDITIONAL CLOSURE READING (E) OF H-QSP-5540d7 AND NOTHING ELSE.
    Claims (A), (B), (C) and (D) of that record are unconditional and are
    carried by H-QSP-3fe0ab. This record is deliberately SHORT and is not a
    copy of its parent: it restates one claim, narrows its quantifier, names
    the exact inequality on which it now rests, and says which side of that
    inequality no source in this program has established. A reader wanting
    the twisted injection bound wants H-QSP-3fe0ab.
  supersession_decision: DEC-20260917-6b9a63
  added: '2026-09-17'
  proposed_by: coordinator
  statement: >-
    SETTING, INHERITED AND NOT RE-DERIVED. K = F_{p^n}, L = X^{p^{n'}} -
    lambda(X) with lambda in K[X] of degree d, n = q n' + r with 0 <= r < n',
    l := log_p d, beta := l n / n'^2 (Definition 2 of KN-LIT-4fe9d2). The
    unconditional bound N_K(L) <= max(d^{q+1}, p^{n'-r}) and its corollary
    beta >= n/(n + n' - r) > 1/2 for complete splitting at r >= 1 and n' < n
    are H-QSP-3fe0ab claims (A) and (B) and are ASSUMED HERE, not re-argued.
    THE CLAIM (E'), CONDITIONAL ON H1 AND RESTRICTED.
    Let L be a QUASI-SUBFIELD POLYNOMIAL IN THE SENSE OF DEFINITION 3.1 OF
    KN-LIT-0a321c -- that is, L | X^{p^n} - X and l < n'^2/n -- with n' not
    dividing n. (Definition 3.1's divisibility condition forces deg L =
    p^{n'} <= p^n, hence n' <= n, and non-divisibility then gives n' < n; the
    restriction and the explicit conjunct n' < n are therefore two statements
    of the same narrowing, and both are written so no reader has to pick.)
    THEN, UNDER HEURISTIC H1 BELOW AND UNDER NO OTHER ASSUMPTION, the
    factor base F = {x in K : x^{p^{n'}} = lambda(x)} does not beat generic
    algorithms in the sense of Proposition 8 of KN-LIT-4fe9d2 (alpha_beta =
    1/(2 kappa beta) <= 1), PROVIDED THE SOLVER EXPONENT kappa SATISFIES
        kappa >= (n - 1) / n.
    THE ROBUST SUFFICIENT CONDITION IS THE HEADLINE, AND IT IS THE WHOLE
    CLAIM. (B) gives beta >= n/(n + n' - r), whose minimum over n' not
    dividing n with n' < n is attained at n' = n - 1 (there q = 1, r = 1, so
    beta >= n/(2n - 2)). alpha_beta > 1 requires kappa < 1/(2 beta_min) =
    (2n - 2)/(2n) = (n - 1)/n exactly. So (n - 1)/n is not a convenience: it
    is the EXACT threshold at the worst beta that (B) admits, and it tends to
    1 from below. At n = 131 it is 130/131 = 0.9923664, computed by exact
    rational arithmetic from beta_min = 131/260 = 0.5038462 at n' = 130
    (TASK-20260917-52b4e6, quoted via EV-QSP-a6aa4b obstruction.value).
    WHAT THE PARENT RECORD GOT WRONG, STATED HERE BECAUSE THE RESTATEMENT IS
    THE POINT OF THIS RECORD. H-QSP-5540d7 (E) excluded a cheap solver by
    asserting that beta > 1/2 forces kappa < 1, "five times below Rojas'
    4.876". THAT COMPARISON IS WITHDRAWN AND MUST NOT BE REPEATED. 4.876 is
    an UPPER BOUND on kappa in both frozen sources -- Proposition 7 of
    KN-LIT-4fe9d2 says verbatim that kappa is "currently majored by 4.876"
    (inputs/EULER-PETIT-2019-QSP/paper_fulltext.md line 2597), and Lemma 3.1
    of KN-LIT-0a321c gives the eliminant-solving cost as a big-O, also an
    upper bound. EXCLUDING A CHEAP SOLVER REQUIRES A LOWER BOUND ON kappa,
    AND NEITHER FROZEN SOURCE CONTAINS ONE. H1 itself assumes kappa >= 1, so
    the margin (E') has over its own assumption is exactly 1/n: 0.76% at
    n = 131 and ZERO IN THE LIMIT -- not a factor of five. The missing lower
    bound is recorded as an open problem at KN-OPEN-ac409f.
    CONSEQUENTLY THIS RECORD IS AT `specified` AND CLAIMS NOTHING YET. Its
    conclusion is not refuted -- no solver with kappa < (n-1)/n has been
    exhibited, at any parameters -- and it is not established, because
    nothing excludes one. The honest reading is that (E') reduces a closure
    question to a single number nobody has bounded from below.
    SURVIVORS: WHAT (E') WOULD LEAVE OPEN EVEN IF IT WERE ESTABLISHED. FOUR,
    not three; the parent listed three and silently absorbed the fourth.
    (1) n' | n -- Diem's subfield family, which (B) does not reach at all; at
    n = 131, n prime, this is only n' in {1, 131}.
    (2) Correspondence shapes of conjugate degree >= 2 (IDEA-20260916-a17f43).
    THE CONSTRAINT ON THEM IS MEASURED AND IS HANDED TO THAT IDEA BY
    DEC-20260917-793ae2 NA-9: a successor shape must RAISE deg D, not find a
    luckier lambda, because 0 of roughly 340000 lambda across two
    implementations and four characteristics exceeded the cap, and the
    measured target to beat at n = 131, n' = 33 is 132 against the 2^33 a
    complete splitter needs -- a shortfall of 2^25.96.
    (3) Factor bases that are not root sets of a single X^{p^{n'}} - lambda.
    (4) RATIONAL lambda. (D)(ii) of the parent record is WITHDRAWN AS STATED
    (RUN-QSP-33b442-S5 section 6: the pole bookkeeping was never written
    out), so rational lambda are neither covered by the bound nor excluded by
    (E'). The parent's survivor list omitted them; EV-QSP-a6aa4b boundaries
    and DEC-20260917-793ae2 revisit_conditions restore them, and this record
    carries the restoration.
    NO ATTACK IS CLAIMED, NO EXPONENT IS MOVED, AND NO STATEMENT IS MADE
    ABOUT ANY DEPLOYED CURVE. No curve, group or point was constructed
    anywhere in EXP-QSP-33b442. rho on ECC2K-130 stands at 2^60.9 iterations
    (KN-LIT-096), untouched by this record in either direction. THE QSP LINE
    IS NOT CLOSED AND THIS RECORD DOES NOT CLOSE IT.
  mechanism: >-
    WHAT CONVERTS A BOUND ON |F| INTO A STATEMENT ABOUT COST, AND WHERE THE
    CONVERSION IS UNDERWRITTEN. Proposition 8 / Remark 1 of KN-LIT-4fe9d2
    prices the quasi-subfield index calculus as alpha_beta = 1/(2 kappa beta),
    with beta the factor base's quality and kappa the exponent of the cost of
    solving the chain system S of KN-LIT-0a321c Section 3.1. The algorithm
    beats generic algorithms iff alpha_beta > 1, i.e. iff the solver is CHEAP
    (kappa small) or the factor base is GOOD (beta small). H-QSP-3fe0ab (B)
    removes the second route unconditionally for n' not dividing n: beta
    cannot go below n/(n + n' - r), whose infimum over the admissible n' is
    n/(2n - 2) > 1/2. THE FIRST ROUTE IS EXACTLY WHAT THIS RECORD CANNOT
    CLOSE. Ruling out a cheap solver is a LOWER bound on kappa, and the two
    frozen sources bound kappa only from ABOVE.
    THE ASYMMETRY IS THE MECHANISM, NOT A BOOKKEEPING DETAIL. An upper bound
    on a solver's cost is what an algorithm designer publishes; a lower bound
    is a hardness statement about a structured algebraic system, and nobody
    has published one for these systems. So the closure question has a
    definite shape: it is not "is the factor base too small" (answered, and
    unconditionally) but "can the structured chain system be solved
    sub-quadratically in the eliminant degree".
    THE CHEAPEST INFORMATIVE MEASUREMENT EXISTS AND IS SMALL. The red team's
    own assessment, recorded in DEC-20260917-793ae2 NA-5 and in
    EV-QSP-a6aa4b obstruction.resource_check, is that the smallest useful
    measurement is the ELIMINANT DEGREE at (m, d) = (2, 2) or (2, 3), where a
    RESULTANT suffices and no Groebner engine is needed. That matters because
    the recorded engine impediment for IDEA-20260916-b84e2d (no Groebner or
    resultant engine in the container; sage, magma, macaulay2, singular,
    msolve, ntl_or_flint all absent from the run's own environment.json) may
    be larger than the cheapest informative cell requires. Designing that
    experiment is the only route by which this record can move, and it is
    DEC-20260917-793ae2 NA-5.
    WHAT WOULD BE MORE VALUABLE THAN THE CLOSURE. A demonstrated solver with
    kappa < (n-1)/n refutes (E')'s CONCLUSION, not merely its stated reason,
    and would be a far more valuable result than the closure -- it would
    reopen the quasi-subfield line at exactly the cells (B) leaves standing.
    The experiment that could establish the closure is the same experiment
    that could produce that refutation, which is why it is ranked work rather
    than confirmation.
  assumptions:
    - >-
      H-QSP-3fe0ab (A) and (B) hold as stated. They are assumed, not
      re-argued; they are unconditional and carry their own evidence
      (EV-QSP-a6aa4b). If (B) were weakened to the conservative threshold
      n(n' - 1)/(n'(n + n' - r)) the sufficient condition here moves with it
      and must be recomputed; it is not independent of (B)'s exact form.
    - >-
      The cost interface is Proposition 8 / Remark 1 of KN-LIT-4fe9d2,
      alpha_beta = 1/(2 kappa beta), CITED AND NOT RE-DERIVED. This record
      does not re-verify the proposition; it uses it as the definition of
      what "beats generic algorithms" means here.
    - >-
      'Beats generic algorithms' therefore means alpha_beta > 1 under that
      cost model. A SOLVER MODEL IN WHICH COST DOES NOT GROW WITH d IS NOT
      EXCLUDED BY THIS RECORD -- it is exactly the object whose absence this
      record cannot establish. Such a model is nonetheless constrained by
      H-QSP-3fe0ab (A) directly, which bounds |F| and needs no cost model at
      all.
    - >-
      n' < n and n' does not divide n, either by restricting to quasi-subfield
      polynomials in the sense of Definition 3.1 of KN-LIT-0a321c or by
      carrying the conjunct explicitly. WITHOUT IT THE CLAIM IS FALSE AS
      QUANTIFIED: a witness against the parent's written quantifier was
      produced at p = 2, n = 5, n' = 11, lambda = X^2, where V = F_32,
      N = 32 by two agreeing instruments and beta = 5/121 = 0.0413
      (TASK-20260917-34b637, via EV-QSP-a6aa4b).
    - >-
      NOTHING HERE IS MEASURED. Every number in this record is either exact
      rational arithmetic on (B) and Proposition 8, or a quotation from a
      committed artifact cited in place. No decomposition was attempted, no
      solver was run, and no Groebner or resultant engine is installed.
  proof_search_map:
    bottleneck: >-
      THE ABSENCE OF A LOWER BOUND ON kappa, the exponent of the cost of
      solving the structured chain systems S of KN-LIT-0a321c Section 3.1.
      Everything else in the closure argument is in hand: (B) is
      unconditional and reviewed, Proposition 8 supplies the interface, and
      the arithmetic is exact. Supplying kappa >= (n-1)/n -- or, far more
      cheaply, kappa >= 1, which H1 already assumes and which would suffice
      for every n -- converts (E') from `specified` to a conditional result
      whose conditionality is a named, validated heuristic. Exhibiting
      kappa < (n-1)/n refutes the conclusion and reopens the line. The
      decision it changes: whether RQ-QSP-f9bbdb's cost question at the cells
      (B) leaves standing is answered or merely bounded.
    baseline_embedding:
      parameter_slice: >-
        Proposition 7 of KN-LIT-4fe9d2 ("kappa currently majored by 4.876",
        line 2597 of the frozen text) and Lemma 3.1 / Appendix A.1 of
        KN-LIT-0a321c (eliminant degree "bounded by M(E)" = 2^{m(m-1)}
        d^{m(m-1)/2}; root-finding cost that "can be neglected in the overall
        complexity estimation", lines 1116-1118) are the exact published
        boundary. BOTH ARE UPPER BOUNDS. The baseline this record must
        reproduce is therefore not a number but a DIRECTION, and reproducing
        it is what showed the parent record's comparison ran the wrong way.
      reproduction_check: >-
        Symbolic and already performed, at zero compute, by
        TASK-20260917-52b4e6 reading both frozen texts directly and by the
        orchestrating session of 2026-09-17 re-verifying the 4.876 direction
        against the same line. The arithmetic threshold (n-1)/n was
        independently recomputed and matched exactly at 130/131. NO FURTHER
        LITERATURE CHECK IS PENDING; what is pending is a measurement.
    observation_collision:
      observable: >-
        kappa itself: the exponent such that solving one chain-system instance
        at (n, m, d) costs M(E)^{kappa + o(1)}, equivalently the growth rate
        of the univariate eliminant degree / solution count in d and m.
      distinct_preimage_search: >-
        The collision that matters is a family of chain systems whose
        eliminant degree or solution count is far below 2^{m(m-1)}
        d^{m(m-1)/2} by a factor GROWING WITH d -- that is a cheap solver and
        refutes the conclusion. None has been searched for by this program:
        no cell has been solved, because no solver engine is installed. The
        search is not claimed to have been run and its absence is not evidence
        either way (AGENTS.md rule 5 and the retrieval policy's "absence of a
        result is not evidence").
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The (m, d) = (2, 2) and (2, 3) cells, where the eliminant is a
          RESULTANT of two polynomials in two variables and needs no Groebner
          basis. Measure the eliminant degree directly and compare against
          2^{m(m-1)} d^{m(m-1)/2} = 2^2 d^1.
        predicted_gain: >-
          Turns an unmeasurable exponent into a measured degree at a cell that
          runs in a container with no algebra system, and tests whether the
          recorded engine impediment actually binds at the cheapest
          informative scale.
      - transform: observable_fiber
        proposed_object: >-
          Hold the conclusion fixed and vary n: the threshold (n-1)/n is a
          function of n alone and tends to 1, so any lower bound kappa >= 1 --
          weaker than every published upper bound by a factor of about five --
          suffices at EVERY n.
        predicted_gain: >-
          Reduces a family of n-dependent thresholds to a single, modest,
          n-independent hardness question, which is the honest statement of
          what the closure needs.
    quantifier_order: >-
      FORALL p, n, n' with n' < n and n' not dividing n, FORALL lambda in
      K[X] of degree d such that L = X^{p^{n'}} - lambda(X) is a
      quasi-subfield polynomial in the sense of Definition 3.1 of
      KN-LIT-0a321c: IF H1 holds at (n, n', d, m) AND kappa >= (n-1)/n,
      THEN alpha_beta <= 1. The quantifier on kappa is the load-bearing one
      and it is an ASSUMPTION of the implication, never a conclusion of it:
      this record does not assert that kappa >= (n-1)/n, and nothing in this
      program establishes it. The weaker reading "for each lambda there
      exists some kappa making the conclusion true" is NOT what is claimed and
      would be vacuous.
    method_ceiling:
      strongest_certifiable_claim: >-
        'Under the Proposition 8 cost model and given a lower bound
        kappa >= (n-1)/n, no quasi-subfield polynomial with n' < n and n' not
        dividing n yields a factor base that beats generic algorithms, at any
        p, n, n'.' IT CANNOT CERTIFY THE ANTECEDENT. It cannot certify
        anything about n' | n, about factor bases that are not root sets of a
        single X^{p^{n'}} - lambda, about rational lambda, about the isogeny-L
        reading if reference [20] of KN-LIT-0a321c means something other than
        the two forms considered, or about any solver outside the
        Proposition 8 model.
      nearby_object_control: >-
        (i) n' | n, where the conclusion is KNOWN FALSE (Diem's subfield
        family beats nothing but is not excluded by beta): (B) is vacuous
        there, so this record must and does say nothing about it. (ii) The
        published QSP families that DO exist -- Type 2 at n = 7, n = 31,
        n = 127 -- where beta is large (0.778, 0.9, 0.992): the claim must
        admit them as objects while denying them an advantage, and it does,
        because a large beta makes alpha_beta small. An argument that
        excluded the OBJECTS rather than their advantage would be proving too
        much. (iii) n' = n with lambda = X, where complete splitting occurs
        and beta = 1/2 exactly: excluded by non-divisibility, and the reason
        the restriction to Definition 3.1 is written into the statement.
    proof_obligations:
      - claim: >-
          beta_min over n' not dividing n with n' < n is n/(2n - 2), attained
          at n' = n - 1 (q = 1, r = 1).
        responsibility: size
      - claim: >-
          alpha_beta = 1/(2 kappa beta) <= 1 for all admissible beta iff
          kappa >= 1/(2 beta_min) = (n-1)/n.
        responsibility: strictness
      - claim: >-
          A LOWER bound kappa >= (n-1)/n, or the weaker n-independent
          kappa >= 1. NOT DISCHARGED. No frozen source supplies it; both
          supply upper bounds. This is the open obligation and it is
          KN-OPEN-ac409f.
        responsibility: feasibility
      - claim: >-
          The interface between |F| and cost is Proposition 8 of
          KN-LIT-4fe9d2, cited and not re-derived.
        responsibility: interface
      - claim: >-
          The restriction to Definition 3.1 quasi-subfield polynomials (or the
          explicit n' < n conjunct) excludes the produced counterexample to
          the parent's written quantifier, (p, n, n', lambda) = (2, 5, 11,
          X^2) with beta = 5/121.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: >-
      The ECDLP over F_{p^n} by quasi-subfield-polynomial index calculus
      (KN-LIT-0a321c Section 3.1). NO IMPROVEMENT IS CLAIMED IN EITHER
      DIRECTION: this record is a conditional NON-EXISTENCE statement about an
