      >= 0.898, i.e. >= 2^117.7 against rho's 2^60.9. THAT FIGURE IS
      ARITHMETIC ON (B) AND ON A CITED PROPOSITION, NEVER A MEASUREMENT, and
      it does not establish the closure, because a cost computed at an upper
      bound on kappa says nothing about a solver with a smaller one. Recorded
