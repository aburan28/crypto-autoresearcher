  reduction_chain:
    core_problem: >-
      Whether a quasi-subfield factor base with n' < n and n' not dividing n
      can beat generic algorithms for the ECDLP over F_{p^n} under the
      Proposition 8 cost model.
    corollaries:
      - problem: >-
          The same question at n = 131 for ECC2K-130, the target of
          RQ-QSP-f9bbdb. NOT ANSWERED BY THIS RECORD: at n = 131 the
          threshold is kappa >= 130/131 = 0.9923664 and no lower bound on
          kappa exists in either frozen source.
        reduction_ref: arithmetic on H-QSP-3fe0ab (B) and KN-LIT-4fe9d2 Proposition 8
        asymptotics_preserved: >-
          not applicable; the reduction is exact rational arithmetic at fixed
          n, and its conclusion is conditional on an antecedent nobody has
          established
  predictions:
    - metric: >-
        V1 -- the measured univariate eliminant degree (equivalently the
        solution count over the closure) of the chain system S at executable
        cells (n, m, d), divided by M(E) = 2^{m(m-1)} d^{m(m-1)/2}
      direction: different
      minimum_effect: >-
        Under H1 the ratio does not decay with d: it is bounded away from 0
        uniformly in d at fixed m. A ratio that FALLS as d grows, by a factor
        growing with d, refutes H1 and is the informative outcome. NOT YET
        MEASURED AT ANY CELL: no solver engine is installed and
        IDEA-20260916-b84e2d is undesigned. This is a pre-registration for
        that experiment, not a result.
    - metric: >-
        V2 -- the implied kappa at the cheapest cell (m, d) = (2, 2) or
        (2, 3), where the eliminant is a resultant
      direction: higher
      minimum_effect: >-
        kappa >= 1 at that cell would be consistent with H1 and, being
        n-independent, would suffice for the closure at EVERY n (since
        (n-1)/n < 1). A measured kappa below (n-1)/n at any executable n
        refutes the conclusion of (E') at that n. NOT YET MEASURED.
