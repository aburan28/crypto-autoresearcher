        refutes H1 and, if the implied kappa is below (n-1)/n, refutes the
        CONCLUSION of (E') rather than merely its reason, which would be a
        more valuable result than the closure.
        VALIDATION ROUTE, SCHEDULED AND NOT YET DESIGNED: IDEA-20260916-b84e2d
        -- SAMPLE (n, m, d) in {17, 23, 29, 41} x {2, 3, 4} x {2, 3};
        COMPARISON of measured eliminant degree / solution count against
        2^{m(m-1)} d^{m(m-1)/2}; TAIL the cell with the largest deficit;
        TRANSFER none to n = 131. CHEAPEST INFORMATIVE CELL, per
        DEC-20260917-793ae2 NA-5 and EV-QSP-a6aa4b
        obstruction.resource_check: the eliminant degree at (m, d) = (2, 2) or
        (2, 3), where a RESULTANT suffices and no Groebner engine is needed.
        The recorded engine impediment (no sage, magma, macaulay2, singular,
        msolve or ntl_or_flint in the container; see
        analysis/qsp-ecc2k130/explore/README.md and the run's own
