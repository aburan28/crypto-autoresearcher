      falsification_condition: >-
        A measured per-attempt decomposition at an executable cell (n, m, d)
        whose univariate eliminant degree or solution count over the closure
        is below M(E) = 2^{m(m-1)} d^{m(m-1)/2} by a factor that GROWS WITH d
