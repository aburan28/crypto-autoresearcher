      validation_experiment_ids: []
      validation_experiment_ids_note: >-
        STILL EMPTY, AND THIS IS WHY agents/coordinator.md PROMOTION GATE (2)
        BLOCKS THIS RECORD. IDEA-20260916-b84e2d is the SCHEDULED validation
