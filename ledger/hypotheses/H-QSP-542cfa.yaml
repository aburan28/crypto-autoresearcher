    claim_kind: null
  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        For the chain system S of KN-LIT-0a321c Section 3.1 at parameters
        (n, n', d, m), the cost of one decomposition attempt is governed by
        Proposition 8 of KN-LIT-4fe9d2 with a solver exponent kappa, and
        kappa >= 1 uniformly in the instance -- equivalently, the cost of
        solving S grows at least linearly in M(E) = 2^{m(m-1)}
        d^{m(m-1)/2}, so a factor base with beta > 1/2 cannot be compensated
        by a cheap solver. NEEDED ONLY BY THIS RECORD; H-QSP-3fe0ab (A) and
        (B) are unconditional and do not use it.
      random_model_justification: >-
        STATED HONESTLY, AND THE HONEST STATEMENT IS THAT THE LOAD-BEARING
        DIRECTION IS UNSUPPORTED. This replaces the parent record's
        justification, which the review round refuted on its own cited text.
        WHAT THE SOURCES ACTUALLY SAY: Appendix A.1 of KN-LIT-0a321c says the
        univariate polynomials produced by Rojas' algorithm have degree
        "BOUNDED BY M(E)" and that root-finding's cost "CAN BE NEGLECTED in
        the overall complexity estimation" (frozen text lines 1116-1118), and
        Lemma 3.1 gives the eliminant cost as a big-O. Both are UPPER bounds.
        WHAT H1 NEEDS: that the eliminant degree is ACTUALLY M(E) (not merely
        bounded by it) and that solving costs AT LEAST that much -- the
        opposite direction in both cases.
        WHAT WOULD BRIDGE THE GAP AND WHY IT CANNOT BE USED: the BKK /
        mixed-volume generic-attainment statement, that the mixed volume is
        generically attained by systems with the given supports so the
        eliminant does not collapse. NO AGENT OF THIS PROGRAM HAS OPENED A
        SOURCE FOR IT. It is `recalled`, and AGENTS.md rule 9 bars a recalled
        citation from discharging supporting_results. It is named here as a
        POINTER so a reviewer knows where to look, and it supports nothing.
        THE PARENT RECORD'S ERROR IS NAMED RATHER THAN SOFTENED: it asserted
        the eliminant "has degree M(E)" and that root-finding "costs at least
        M(E)", attributing to Appendix A.1 the reverse of what Appendix A.1
        says. That assertion is withdrawn.
        NOTHING HERE ASSERTS H1 IS FALSE. What is established is that the
        record's SUPPORT for H1's load-bearing direction is absent once
        `recalled` citations are honoured.
      supporting_results: []
      supporting_results_note: >-
        DELIBERATELY EMPTY. The two retrieved sources bound kappa only from
        above and therefore discharge nothing in the direction H1 uses; the
        one statement that would discharge it is `recalled` and barred. An
