  falsification_conditions:
    - >-
      G1. A solver for the chain systems S with exponent kappa < (n-1)/n at
      some executable n, demonstrated by a measured decomposition: the
      CONCLUSION of (E') is refuted at that n, not merely its reason, and the
      quasi-subfield line reopens at the cells (B) leaves standing. This is
      the most valuable outcome this record can produce.
    - >-
      G2. A measured eliminant degree or solution count below M(E) by a
      factor growing with d at any executable (n, m, d): H1 is refuted and
      (E') loses its cost model. (A) and (B) are untouched -- they assume no
      cost model.
    - >-
      G3. A published or derived LOWER bound kappa >= 1 for these structured
      systems: (E') becomes a conditional result whose conditionality is a
      validated heuristic, and promotion toward `supported` becomes possible
      subject to the remaining gates (a concrete-cost table with honest
      accounting, and independent review-breakthrough plus a red-team pass on
      the cost model). This is the confirming direction and is recorded
      beside the refuting ones so the record is not written only to be
      knocked down.
    - >-
      G4. A completely splitting quasi-subfield polynomial at n' < n, n' not
      dividing n with beta below n/(n + n' - r): (B) fails, this record's
      sufficient condition is recomputed against the conservative threshold,
      and the claim is restated rather than refuted. That is H-QSP-3fe0ab F2.
    - >-
      G5. Timeout, crash, missing engine, or budget exhaustion in any future
      validation run: an infrastructure outcome under AGENTS.md rule 5, never
      evidence about H1 or about (E') in either direction. The absent solver
      engine is exactly such an outcome and is recorded as an impediment, not
      as a finding.
