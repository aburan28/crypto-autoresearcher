hypothesis:
  id: H-ECRANK-a84737
  id_allocation_provenance: >
    Allocated via python3 tools/allocate_id.py --next hypothesis --area
    ECRANK and confirmed free with --check before use (random 6-hex
    suffix; rule 14).
  question_id: RQ-ECRANK-27dcc5
  goal_id: GOAL-ECRANK-002
  batch_id: BATCH-2305cb
  task_id: TASK-20260910-87e6fd
  recorded_at: '2026-09-10'
  opening_decision: DEC-20260910-c10298
  status: specified
  title: >
    N4 HEUR-1 reconciliation: the construct-side decade-ratio tension
    (TENSION-REAL) is a STRUCTURAL-SCOPE mismatch, not small-height
    scarcity or a local obstruction -- the frozen n=6 construct arm
    enumerates a 0-dimensional slice (<= 2 rational roots of one
    univariate quadratic per tuple, H used only as an admission
    filter), so per-tuple count growth in H is bounded by 2 and the
    H^(5-n/2) law is untestable on this arm rather than violated.
  statement: >
    The measured TENSION-REAL outcome of EXP-ECRANK-73275e v2 (N2R:
    decade ratios A [1.4, 1.1786] two-decade 1.65; B [1.2692, 1.0]
    two-decade 1.2692, vs the frozen exponent-+2 prediction x100 per
    decade; EV-ECRANK-d7e05f, DEC-20260909-5756cb) is explained by the
    enumeration scope, not by scarcity of high-height solutions or by a
    local obstruction on the construction family. In the bound sources
    (experiments/EXP-ECRANK-73275e/source/construct.py solve_n6, lines
    65-95, and source-v2/construct_v2.py construct_arm_v2), each n=6
    (b, dpat) tuple yields AT MOST TWO candidate instances -- the
    rational roots of a single univariate quadratic A t^2 + B t + C
    whose coefficients depend only on (b, dpat) -- and the box height H
    enters ONLY as the post-solve admission filter h <= H (line 86).
    Therefore N_6(H) over the frozen 10^4 b-sample is monotone in H,
    bounded above by the total rational-root count of the sample
    (<= 2 per tuple, independent of H), and saturates exactly at the
    maximum admitted-or-rejected root height. The x100-per-decade
    growth HEUR-1 predicts for "square-pattern points of height <= H
    in W'(b)" (H-ECRANK-ee6e0e mechanism text) concerns a
    positive-dimensional parameter space (the draw-side H^5 box /
    general W'(b) section); the construct arm measures a 1-parameter
    linear-g slice whose point count is finite by Bezout. HEUR-1 is
    therefore neither validated nor refuted by the construct-side
    ratios: it is UNTESTABLE on this arm as frozen. The scarcity and
    local-obstruction readings are rejected AT THE TESTED SCOPE by the
    committed bytes: every root the solver rejected for height is
    already recorded in the near-miss ledger with its exact height
    ("r_height_<h>"), so the extended-H re-admission count N_6(H') for
    any H' is exactly computable from the committed R12 raw bytes plus
    an H-independent build_instance recomputation, and is bounded by
    the same <= 2-per-tuple ceiling.
  mechanism:
    M-S1_candidate_bound: >
      solve_n6 (bound bytes, v1 source/construct.py): coefficients
      (A, B, C) are computed from (b, dpat) alone (NF.d1_quadratic_coeffs
      or _n6_quad); _quad_rational_roots(A, B, C) returns the complete
      rational root set of one univariate quadratic -- at most 2, found
      by exact arithmetic with NO H input. For each root: g = [t, 1]
      (linear), r_i = g(b_i), h = max rat_height(r_i); h > H -> near-miss
      rejection with the exact height recorded; otherwise
      engine.build_instance (H-independent checks) decides keep/reject.
      The per-tuple candidate set is H-independent and bounded by 2.
    M-S2_saturation_ceiling: >
      N_6^{A}(H) and N_6^{B}(H) over the frozen sample are therefore
      cumulative height-distribution functions of a FIXED finite multiset
      (kept roots plus re-admissible near roots), not density laws. The
      two-decade ratio at any H is bounded by (total roots)/(roots <= H/100),
      which the committed R12 near-miss ledger makes exactly computable.
      No extended-H enumeration of the frozen pipeline can produce x100
      per decade once the ceiling is known -- arithmetic, not measurement.
    M-S3_formulation_locus: >
      HEUR-1's exponent 5 - n/2 (lineage H-ECRANK-ee6e0e, carried from
      IDEA-20260905-d5608c) is stated for "expected square-pattern points
      of height <= H in W'(b)" -- a count over a parameter space that
      grows with H (the draw-side seeds 5 r-coordinates from a height-H
      sub-box: draws(H) ~ H^5 with per-draw incidence ~ H^(-n/2), the
      random-model justification recorded in H-ECRANK-36d8d7 HEUR-1
      random_model_justification: subspace lattice count times
      square-class equidistribution). The construct arm replaces that
      growing space by a 1-parameter linear-g family solved in closed
      form. The construct-side realization of the count law that IS
      testable is the b-box scaling: feasible-tuple density C(b,d) > 0
      times multiplicity <= 2 over a growing b-sample -- a different
      quantity, to be reformulated as a candidate heuristic (HEUR-1-C)
      for future pre-registration, never asserted as validated here.
  numbered_predictions:
    - id: P1
      claim: >
        Machine-checked dataflow trace of the bound bytes shows H enters
        solve_n6 only at the admission filter (h > H rejection) and never
        in candidate generation; the candidate set per tuple is the
        rational root set of one quadratic, size <= 2, H-independent.
        Same trace for solve_n8 records its candidate structure verbatim
        (descriptive at n=8; no adjudication claimed there).
      source: M-S1; test T1.
    - id: P2
      claim: >
        The committed R12 raw bytes contain, for every near-miss with
        reason r_height_<h>, the exact rational root data sufficient to
        recompute build_instance at any extended H' without re-running
        the solver; the count of such entries is reported exactly.
      source: M-S1/M-S2; test T2-precondition.
    - id: P3
      claim: >
        The exact extended-height re-admission counts N_6^{A,ext}(H') for
        H' in {10^5, 10^6, 10^7} (T2) satisfy: every decade ratio is
        <= 4, and N_6^{A,ext}(10^7) <= kept + near-root total <= 2 x
        (tuples with >= 1 rational root). No decade ratio approaches 100.
        If ANY decade ratio >= 10 is measured, this hypothesis's scarcity
        rejection is FALSIFIED at the tested scope and the scarcity
        reading revives.
      source: M-S2; test T2.
    - id: P4
      claim: >
        The theoretical derivation (T3) from the committed lineage records
        exhibits the parameter space in which HEUR-1's H^(5-n/2) is stated
        and shows it grows with H, while the construct arm's linear-g
        slice is 0-dimensional (Bezout <= 2); the two quantities are
        formally distinct. The Hasse-Minkowski pointer in the lineage is
        marked recalled-not-verified and is NOT load-bearing for this
        derivation.
      source: M-S3; test T3.
    - id: P5
      claim: >
        Proves-too-much control: the same structural argument applied to
        the draw-side committed data of EV-ECRANK-8b35bb (where the F1
        growth fired at the tested scope) does NOT predict saturation --
        the draw-side search space grows with H by construction. If the
        argument predicts saturation there, it is defective and P1-P4
        readings are void.
      source: control; test T3-control.
    - id: P6
      claim: >
        Calibration control: a synthetic known-answer family with exactly
        two roots per tuple at hand-computed heights, run through the
        same counting/ratio instrument, reproduces the hand-computed
        decade ratios exactly -- validating the ratio instrument that the
        v2 round's failed gates (b)/(c) left uncalibrated.
      source: control; test T4.
  falsification_conditions:
    - P1 fails (H participates in candidate generation anywhere in the
      bound n=6 path): the structural reading collapses and a genuine
      extended-H enumeration successor (the original N4 sketch) is the
      required next measurement.
    - P3 fails (any extended-band decade ratio >= 10): small-height
      scarcity revives at the tested scope; TENSION-REAL stands as a
      density finding and the local-obstruction reading remains open.
    - P5 fails (the argument predicts draw-side saturation): the argument
      proves too much; all readings void, recorded as a defect.
    - P6 fails (instrument cannot reproduce known ratios): every ratio
      reading in this experiment is uncalibrated and void.
  test_boundary: >
    Toy tier throughout. The adjudication is over the FROZEN 73275e
    construct arm and its committed bytes: n=6 primary (n=8 descriptive
    only -- R14 recorded found 0, near_miss_total 0, so the n=8 extended
    band is vacuous and reported as such). Nothing here transfers to
    cryptographic parameters; no asymptotic claim is made; HEUR-1's
    draw-side validity in its own regime is untouched (F1 fired there at
    the tested scope, EV-ECRANK-8b35bb). A STRUCTURAL-SCOPE outcome
    reclassifies the construct-side tension; it does not close HEUR-1,
    does not promote anything toward C1, and does not touch the
    UNPROMOTED C1-closure candidate of DEC-20260905-7adca0.
