  predictions:
    - metric: >-
        P1 - STAGE 0 DEGENERACY DECLARATION - whether a literal support-copy null
        over GF(2) has any randomness at all
      direction: different
      minimum_effect: >-
        FORCED DEGENERATE, and the run must say so before proceeding. Over GF(2)
        a present monomial s only nonzero coefficient is 1, so a strict support
        copy reproduces the Semaev system exactly and the treatment-null
        comparison has width zero. The strict copy is therefore run ONLY as a
        column-identity check and is declared inadmissible as a null. If the
        implementation instead produces a strict copy that DIFFERS from the sem,
        the construction is wrong and that is the finding.
    - metric: >-
        P2 - column count of the corrected null constructions at the cheap cells
        (integer count of monomials), against the lane s forced values
      direction: lower
      minimum_effect: >-
        The strict support copy FORCED to equal the Semaev column count EXACTLY,
        zero tolerance, at every cheap cell. The block-restricted variant FORCED
        to lie strictly between the Semaev count and the current full-space
        count. A mismatch at either stops the run before any rank or memory
        number is produced.
    - metric: >-
        P3 - FULL-SUPPORT CALIBRATION - the existing full-support null must
        reproduce the semi-regular prediction exactly at the cheap cells
      direction: different
      minimum_effect: >-
        Deficit EXACTLY 0. This is the instrument s calibration and it can fail.
        If it fails, no number from any arm is admissible and NO negative may be
        reported.
    - metric: >-
        P4 - PLANTED RANK DEFECT, SWEPT - a syzygy of known multiplicity r
        planted into the corrected null by forcing one equation to be a sum of
        others, r swept over at least 3 values
      direction: higher
      minimum_effect: >-
        The measured deficit must reach at least its pre-computed forced lower
        bound at EVERY r, and must increase with r. An instrument that fires at
        one planted size only has not demonstrated it can measure the size of a
        defect, and no small measured deficit from it is interpretable.
    - metric: >-
        P5 - seed-to-seed rank spread of the block-restricted null at the cheap
        cell, over at least 5 seeds, reported BEFORE any comparison
      direction: different
      minimum_effect: >-
        STRICTLY GREATER THAN 0 and strictly less than a quarter of the deficit
        under study. Exactly 0 means the coefficient sampler is not random and
        the corrected null is not a null; a quarter or more means the comparison
        at that cell is withdrawn and a distribution is reported instead of a
        share.
    - metric: >-
        P6 - peak resident memory of the corrected null arm s prepare phase at
        the stretch cell (GiB), against the current construction s measured
        baseline re-measured under identical conditions
      direction: lower
      minimum_effect: >-
        No direction forced. ANY measurable reduction supports explanation 1 at
        least partially. A change under 5 percent despite a confirmed column
        reduction supports explanation 2, that the memory is dominated by
        something independent of the column count - which is itself a valuable
        reportable negative for the lane s memory work and must be stated as a
        result rather than as a disappointment.
    - metric: >-
        P7 - CURVE-FREE SCOPE STATEMENT - the entire measured object is a boolean
        polynomial system and its null
      direction: different
      minimum_effect: >-
        Declared in advance rather than discovered. Every number this experiment
        produces is a statement about a Macaulay construction and a null-model
        choice inside it. NOTHING from it may be quoted as a statement about
        elliptic curves or the ECDLP, and no d_reg conclusion follows from it in
        either direction.

  test_boundary:
    instances: >-
      Boolean chained Semaev systems at the cells the lane has already
      instrumented, with the corrected null constructions built against them;
      cheap cells first, the memory-relevant stretch cell last and only if the
      cheap cells pass.
    parameters:
      primary_cells: n in {9, 12} at D = 5
      stretch_cell: n = 15 at D = 6, run only after every gate passes
      corrected_variants: [strict_support_copy_declared_degenerate, block_restricted]
      seeds_at_cheap_cell: 5
      planted_multiplicities: at least 3 values
    implementation: >-
      A corrected monomial-set generator substituted for boolean_null(), feeding
      the unchanged Macaulay construction. The shared file is not edited in
      place; the corrected generator lives beside it and which generator produced
      each number is a required artifact.
    budget:
      wall_clock_seconds_per_run: 21600
      maximum_memory_gb: 16
      maximum_runs: 60

  falsification_conditions:
    - >-
      F1 - the strict support copy s column count does not equal the Semaev count
      exactly at a cheap cell. Either the column identity or this construction is
      wrong, and the discrepant monomial must be exhibited before anything else
      is read.
    - >-
      F2 - the full-support calibration does not return deficit exactly 0. The
      instrument is broken; no arm is reported and no negative is admissible.
    - >-
      F3 - the planted rank defect does not reach its forced bound, or does not
      grow with the planted multiplicity. No demonstrated dynamic range; no
      measured deficit is interpretable.
    - >-
      F4 - the block-restricted null s seed spread is exactly 0. The corrected
      null is degenerate and is not a null.
    - >-
      F5 - peak memory of the corrected arm is not meaningfully lower despite a
      confirmed column reduction. The memory floor is not mainly attributable to
      this construction defect; the lane s sparsity and representation work
      becomes the primary lever. A clean, reportable negative.
    - >-
      F6 - the stretch cell exhausts memory or wall clock. INFRASTRUCTURE OUTCOME
      under AGENTS.md core rule 5. Report the cheap cells plus a resource
      receipt; never report a negative from the missing cell. The lane s own
      history makes this clause load-bearing.

  interpretation_limits:
    - >-
      CLAIM TIER toy. Removes a construction and admissibility defect from a null
      arm. NO d_reg CONCLUSION FOLLOWS FROM IT in either direction.
    - >-
      Does not resolve H-DREG-001 s status and does not supply a completion rung
      for any goal.
    - >-
      A corrected null is a DIFFERENT OBJECT from the committed one. Any rank
      recomputed under it is a NEW measurement and must be reported as such,
      never as a silent replacement of a committed value.
    - >-
      The committed n = 12 null result may already be affected by this same
      construction; if so, an existing evidence record s headline may need this
      as an additional named confound. THIS RECORD FLAGS THAT POSSIBILITY FOR
      REVIEW AND CHANGES NO EVIDENCE RECORD S STATUS - that is Coordinator
      authority exercised elsewhere on committed evidence.
    - >-
      NOT TESTABLE AT REACHABLE SCALE, STATED PLAINLY. The degrees at which the
      lane s actual solving-degree question lives are far above the cells reached
      here, and no fix to a null construction at D = 5 or a single D = 6 cell
      transfers upward.
    - >-
      NOTHING HERE IS A STATEMENT ABOUT ELLIPTIC CURVES OR THE ECDLP. The object
      measured is a boolean polynomial system and a null-model choice inside a
      Macaulay pipeline.

