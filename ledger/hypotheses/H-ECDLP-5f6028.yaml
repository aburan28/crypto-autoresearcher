        support-matched semi-regular null".
      citation: ledger/RQ-DREG-001.yaml
      provenance: internal
      verified_by: >-
        coordinator subagent under TASK-20260904-c0edda, 2026-09-04, read the
        matching lines of ledger/RQ-DREG-001.yaml directly (lines 12-27 of that
        file). Both quoted strings are verbatim. THE REMAINDER OF THE FILE WAS
