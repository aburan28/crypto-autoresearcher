hypothesis:
  id: H-ECDLP-5f6028
  question_id: RQ-DREG-001

  statement: >-
    SCOPE: the T11 null construction in src/h012_peel_rank.py, at boolean chained
    Semaev cells n in {9, 12} at D = 5 primarily, with n = 15 at D = 6 as a
    stretch. CLAIM TIER toy. NO ATTACK, NO EXPONENT, NO d_reg CONCLUSION, NO
    STATUS CHANGE TO H-DREG-001, EV-DREG-008, GOAL-DREG-001 OR ANY OTHER RECORD.
    RQ-DREG-001 names as its reference, verbatim, a "T11-certified
    support-matched semi-regular null", and H-DREG-001 records as an assumption,
    verbatim, that "The T11 null has identical monomial support / degree profile
    with only coefficients randomized (the miscalibrated D6 null is excluded)".
    The function implementing T11 carries its own docstring, verbatim,
    "T11-boolean null: same shape, random monomials (identical to t2)", and draws
    each replacement monomial by sampling a fresh uniformly random subset of ALL
    variables. It therefore matches the per-equation DEGREE HISTOGRAM and not the
    monomial SUPPORT.
    The claim under test is that this is a measurable construction mismatch
    against the lane s own declared reference, and that correcting it toward a
    support- or block-restricted null reduces the null s column count toward the
    Semaev column count by the amount the closed-form column identity forces.
    Whether it also reduces the null arm s peak memory is genuinely open and is
    the record s discriminating measurement, not an assumption.

  mechanism: >-
    Two competing explanations are separated, and the design is built so both are
    reportable.
    EXPLANATION 1 - T11 as implemented is a FULL-SUPPORT null, a construction
    mismatch against what RQ-DREG-001 s own text says the arm measures, and
    correcting it shrinks the column count and, plausibly, the peak memory.
    EXPLANATION 2 - the null arm s excess memory is dominated by something
    independent of the column count, in which case correcting the construction
    fixes admissibility and barely moves memory. That is a valuable and
    reportable negative for the lane s memory work.
    THE FIRST THING THE DESIGN MUST DO IS ADMIT THAT THE OBVIOUS FIX IS
    DEGENERATE. A literal "support fixed, coefficients randomized" null over
    GF(2) has no randomness at all - a monomial present in the support has its
    only possible nonzero coefficient equal to 1 - so such a null IS the Semaev
    system, the treatment and the null coincide exactly, and the discriminator
    has width zero by construction. That is precisely the failure mode this
    control lane exists to prevent, so it is a Stage 0 finding rather than a
    surprise, and the randomization freedom must be re-derived explicitly. The
    design therefore carries TWO corrected variants - a strict support copy,
    which is run only to confirm the forced column identity and is declared
    degenerate as a null, and a block-restricted variant that draws monomials
    only from the equation s own variable block and therefore retains genuine
    randomness while being far closer to the sem s support than the current
    full-space draw.
    THE COLUMN IDENTITY IS CHECKABLE BY HAND AND IS CHECKED FIRST. The lane s
    committed forced column counts at the cheap cells are exact integers with
    zero tolerance, so the construction can be validated before any rank or any
    memory number is produced, and a mismatch stops the run at minutes of cost.

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Null deliberately. A methodology and admissibility fix, not an algorithmic
    claim. No exponent is claimed or moved and no cost model is produced.

  rerandomization: null

  proof_search_map:
    not_applicable_reason: >-
      An instrument-admissibility audit and repair, not a proof-oriented
      proposal. No theorem, reduction, certificate family or asymptotic is
      asserted. Recorded as non-applicable rather than omitted, per
      docs/inventor-protocol.md section 8. The one proof-adjacent element - that
      a null whose per-equation supports equal the sem s has, by construction,
      the same Macaulay up-closure and therefore the same column count - is
      elementary and is checked numerically at the cheap cells before it is
      relied on.

  assumptions:
    - >-
      The Macaulay row and column construction applies identically regardless of
      which monomial-set generator feeds it, so substituting a
      support-preserving generator is a localized change. This is checked at
      Stage 1 by reproducing the forced column counts, not assumed.
    - >-
      The sem s per-equation supports are recoverable from a committed system
      artifact or exactly rebuildable. If they are not, the strict support copy
      is unavailable and the block-restricted variant is the only corrected arm;
      which was used is a required artifact and must appear on the face of every
      number.
    - >-
      The lane s closed-form column-count identity is correct. THIS AGENT DID NOT
      OPEN H-DREG-152cff, where that identity is derived. The forced column
      counts carried into this design are taken from H-DREG-5a3ac1, which this
      agent DID read, and Stage 1 re-derives and re-checks them numerically
      before any of them is used as a gate.

  heuristic_assumptions:
    - id: HEUR-NULLFIX-1
      formal_statement: >-
        The T11 null s intended role, per RQ-DREG-001 s own scope text, is to
        approximate a system with IDENTICAL support to the Semaev system and only
        its underlying arithmetic randomized, matching the standard null-model
        role in which a generic system on the same monomial support behaves like
        a random element of the corresponding ensemble.
      random_model_justification: >-
        NOT PROVED, and the honest content of this field is that it inherits an
        open status rather than resolving it. The generic-support-coverage
        assumption that this rests on is already named as unproved in the lane s
        own H-DREG-5a3ac1, whose HEUR-BMN-2 states that support sufficiency is
        the hypothesis under test rather than an assumption granted to it. This
        record inherits that status explicitly.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-c2d1e1]
      falsification_condition: >-
        The block-restricted null s seed-to-seed rank spread at the cheap cell
        exceeding a quarter of the deficit under study, or being exactly zero.
        The first means the corrected null cannot support a point comparison; the
        second means the generator is not random and the corrected null is not a
        null.

