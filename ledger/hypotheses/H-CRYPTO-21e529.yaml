hypothesis:
  id: H-CRYPTO-21e529
  question_id: RQ-CRYPTO-001
  source_proposal: IDEA-20260807-f73d98
  derived_from_idea: IDEA-20260807-f73d98

  statement: >-
    SCOPE. A dated, per-source retrievability measurement of this execution
    environment, plus a count over this repository's own committed question and
    goal records. NO MATHEMATICAL CLAIM, NO SECURITY CLAIM, NO ECDLP CONTENT OF
    ANY KIND. The hypothesis has three conjuncts and each is separately
    falsifiable.
    (C1, INSTRUMENT) A probe that records, per source class, the tuple
    (host, URL class, HTTP status, content type, byte size,
    artifact-or-challenge, client, date) can distinguish BOTH verdicts. It
    returns UNREACHABLE for a deliberately non-existent host and REACHABLE for a
    known-good host, and it classifies an HTTP 200 serving a bot-challenge page
    as NOT-AN-ARTIFACT while classifying an HTTP 200 serving a valid PDF as an
    artifact. A probe that cannot return both verdicts, or that reads a status
    code as an artifact, is a control that cannot fail and is unusable.
    (C2, THE PREMISE IS PARTLY FALSE) The premise carried by 22 RQ records and by
    eleven of the fourteen never-launched goals -- that no primary source is
    reachable from this environment -- is FALSE for at least three named
    sources. The pre-registered forced value is that at least three of the 22
    gated questions have at least one named primary source that the probe
    classifies as a retrieved, artifact-validated document on the run date.
    (C3, THE COUNT) The number of the 22 gated questions with at least one
    retrievable named source is a countable quantity, and it is counted rather
    than asserted. NO VALUE ABOVE THE FLOOR OF THREE IS PRE-REGISTERED for C3.
    IF ANY CONJUNCT FAILS, the failure is reported at the conjunct that produced
    it. C1 is the instrument check and must pass before C2 or C3 is reportable.
    A GENUINE NEGATIVE EXISTS AND IS NAMED: if every named source is
    unreachable while the forced-reachable control fires, the inherited premise
    is CORRECT and this hypothesis is rejected at the tested scope -- which is
    itself a useful result, because it converts an undated belief into a dated
    measurement.

  mechanism: >-
    WHAT IS BEING MEASURED, AND WHY IT IS NOT ALREADY KNOWN. Twenty-two of the
    program's RQ records carry a constraint of the form 'Every per-scheme
    technical claim in this record is sourced from secondary reporting ... No
    experiment may be designed until the relevant primary sources are read and
    filed as KN-LIT entries': RQ-ECDSA-87625f, RQ-ECTD-001, RQ-FAEST-001,
    RQ-FHE-001, RQ-FNDSA-001, RQ-FRODO-3260cc, RQ-HAWK-001, RQ-HQC-001,
    RQ-MAYO-001, RQ-MCE-e65b3c, RQ-MLDSA-001, RQ-MLDSA-ffa0f5, RQ-MLKEM-003,
    RQ-MQOM-001, RQ-QRUOV-001, RQ-RSA-afe33c, RQ-SDITH-001, RQ-SLHDSA-001,
    RQ-SNOVA-001, RQ-SQISIGN-001, RQ-SQISIGN-39f231, RQ-UOV-001. Eleven of the
    fourteen draft goals name that gate in next_action as the reason they have
    not opened. The premise is stated in PUBLICATION-CANDIDATES.md, dated
    2026-08-02: that no primary source is reachable from this environment.
    THE PREMISE IS UNDATED IN USE AND HAS NOT BEEN RE-MEASURED SINCE. That is
    the defect. A gate whose trigger is a sentence rather than a measurement
    cannot close and cannot open on evidence.

    THE INSTRUMENT. For each source class the program depends on --
    nvlpubs.nist.gov, csrc.nist.gov, arxiv.org (abstract and PDF endpoints
    separately), eprint.iacr.org (abstract and PDF endpoints separately),
    Crossref, DBLP, raw.githubusercontent.com -- record on each run: the URL
    class, the HTTP status, the returned content type and size, WHETHER THE BODY
    IS THE ARTIFACT OR A CHALLENGE OR ERROR PAGE, the client used, and the date.
    Emit it as a small committed record that any goal's source gate can cite
    instead of quoting a 2026-08-02 sentence.

    WHY THE ARTIFACT-OR-CHALLENGE DISTINCTION IS THE LOAD-BEARING PART. A naive
    reading of a status code is wrong in BOTH directions here, and the parent
    proposal's own measurement shows both. An eprint ABSTRACT page returns 200
    with correct title, authors and abstract, which is a genuine artifact; the
    eprint /NNNN.pdf endpoint returns 403 whose body is a Cloudflare interactive
    JavaScript challenge, which is a bot posture rather than a network-policy
    block. A probe that reported reachability from the status code alone would
    have called the first unreachable at some times and the second a hard block
    at all times. So the probe must (i) classify the body, not the status, and
    (ii) VALIDATE a retrieved PDF as a PDF rather than counting it by status
    code.

    THE FORCED VALUES, AND THEY ARE FORCED IN BOTH DIRECTIONS. A deliberately
    non-existent domain must report UNREACHABLE. A known-good host must report
    REACHABLE. Both must fire in the same invocation. A probe that reports
    everything reachable is a control that cannot fail, which is precisely the
    failure mode that produced the current situation in the opposite direction --
    a belief that reports everything unreachable and can never be contradicted.

    WHAT THE PARENT PROPOSAL MEASURED, AND ITS STATUS HERE. The session that
    filed IDEA-20260807-f73d98 reports, on 2026-08-07 from this environment,
    that nvlpubs.nist.gov served FIPS 203, 204 and 205 as complete valid PDFs of
    1,252,341, 3,291,746 and 1,055,752 bytes; that csrc.nist.gov returned 200;
    that an arXiv PDF returned 200 and 706,116 bytes of valid PDF; that an eprint
    abstract page returned 200 with correct metadata; and that only the eprint
    PDF endpoint returned 403 with a challenge body. THOSE FIGURES ARE THE
    PARENT PROPOSAL'S OWN SESSION MEASUREMENT, NOT EVIDENCE UNDER THIS PROGRAM:
    they were taken outside the harness, they carry no run record, and network
    posture changes without notice. They are recorded here as the
    PRE-REGISTRATION for C2 and the experiment must reproduce them under the
    harness on its own date or report that it could not.

    WHAT THE GATE IS AND IS NOT. The gate itself STAYS. Designing experiments on
    secondhand figures is the right prohibition and nothing here weakens it. What
    changes is that the gate closes and opens on a dated measurement rather than
    on an inherited sentence. And opening a question's source gate is a
    COORDINATOR ACT: this hypothesis supplies the measurement such an act would
    rest on and performs none of it.

    THE STANDING LIMIT, STATED RATHER THAN DISCOVERED LATER. A retrievability
    verdict is valid only ON ITS DATE and FOR THE ROUTES AND CLIENT TRIED. A
    verdict quoted without its date repeats the current error in the opposite
    direction, which would be worse than the error it replaces because it would
    read as measured.

  assumptions:
    - >-
      That this execution environment has some network egress at all. If the
      forced-reachable control does not fire, the environment has no egress and
      the run is FAILED_INFRASTRUCTURE. It is NOT a measurement that sources are
      unreachable, and it is never evidence for the inherited premise
      (AGENTS.md rule 5). This distinction is the single most important one in
      the contract.
    - >-
      That the 22 gated questions and the eleven gated goals name their primary
      sources specifically enough to be probed. Where a record names a source
      class rather than a document, that record is reported as UNRESOLVABLE
      rather than counted on either side.
    - >-
      That a retrieved PDF is a retrieved PDF and nothing more. Opening a gate
      creates transcription work; it does not discharge it, and no KN-LIT entry
      is created by this hypothesis.
    - >-
      That different clients traverse a proxy differently. A status observed
      through one client does not guarantee another behaves the same, so the
      client is recorded on every row and no verdict is generalised across
      clients.
    - >-
      That the parent proposal's 2026-08-07 figures are a PRE-REGISTRATION and
      not a result. They were measured outside the harness with no run record and
      they may be stale by the run date; a disagreement is a fact about the date,
      not a defect in either measurement.

  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: null
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms: []
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations: []
    not_applicable_reason: >-
      PURELY EMPIRICAL, AND NOT PROOF-ORIENTED IN ANY SENSE. This hypothesis
      proposes no theorem, no asymptotic bound, no certificate family, no
      reduction and no closure argument. Its entire content is a dated
      measurement of an execution environment plus a count over committed files.
      There is no mathematical object whose baseline could be reproduced, no
      observable that could collide, and no quantifier order to audit beyond the
      trivial one recorded in the mechanism. Per templates/research-records.md, a
      purely empirical hypothesis sets this field and leaves the other subfields
      null; nulling them is complete work here rather than an omission.

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    DELIBERATELY NULL. This hypothesis claims no complexity result of any kind
