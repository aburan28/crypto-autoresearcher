  heuristic_assumptions:
    - id: HEUR-SRC-1
      source_id_in_proposal: HEUR-SRC-1
      formal_statement: >-
        Retrievability measured on one date is a usable basis for opening a gate
        that will be acted on over the following days.
      random_model_justification: >-
        NOT A RANDOM MODEL AT ALL, and labelled as such rather than dressed as
        one. This is an operational persistence assumption about third-party
        infrastructure. The parent proposal records its rigorous support as
        NONE, on the explicit ground that Cloudflare posture and proxy policy
        both change without notice, and that statement is preserved here
        unchanged.
      supporting_results: []
      supporting_results_note: >-
        EMPTY AND CORRECT. The parent proposal states plainly that there is no
        rigorous support for this assumption. Populating this field would
        manufacture support the proposal declined to claim.
      validation_experiment_ids: [EXP-CRYPTO-9389a1]
      falsification_condition: >-
        A re-run on a later date returning a different verdict for any source
        class whose verdict a gate has already been opened on. The parent
        proposal's validation plan is preserved as the operative rule: re-run the
        probe at the start of any batch that depends on it, and record the run in
        that batch. A verdict quoted without its date is out of contract.

  structural_ingredients:
    - description: >-
        The GATHER series' discipline of recording per-source retrieval attempts
        with the routes tried and the date, including GATHER-20260803 recording
        DBLP as unreachable. This hypothesis generalises that discipline into a
        standing probe that source GATES can cite, which the gathers were never
        meant to be.
      citation: 'GATHER-20260803 and the GATHER series'
      provenance: internal
      verified_by: null
      verified_by_note: >-
        NULL AND FLAGGED. The GATHER records were named in the parent proposal's
        novelty screen but were NOT opened by the converting Coordinator, so no
        agent in this conversion can attest to their contents. Reading them is
        Stage 0 of EXP-CRYPTO-9389a1.
      role: prior art for the per-source dated verdict, and the discipline being generalised
    - description: >-
        The recorded observation that 7,457 of 7,666 literature entries claim
        citation_verified against a source the program believed unreachable. A
        working probe is a precondition for resolving that open problem.
      citation: KN-OPEN-3f7a21
      provenance: internal
      verified_by: null
      verified_by_note: >-
        NULL AND FLAGGED. Named in the parent proposal; not opened during this
        conversion. Stage 0 reads it or records that it could not.
      role: the downstream open problem a working probe unblocks
    - description: >-
        The premise under audit, stated with its date -- that no primary source
        is reachable from this environment, eprint.iacr.org, csrc.nist.gov and
        arxiv.org all blocked.
      citation: 'PUBLICATION-CANDIDATES.md, 2026-08-02'
      provenance: internal
      verified_by: null
      verified_by_note: >-
        NULL AND FLAGGED. Quoted from the parent proposal rather than read from
        the file during this conversion. Stage 0 must quote it verbatim from the
        committed file with its line number, because it is the exact sentence the
        hypothesis contradicts.
      role: the inherited belief the measurement replaces

  reduction_chain:
    core_problem: >-
      Decide, per source class and on a stated date from this execution
      environment, whether a named primary document is retrievable as a validated
      artifact, and count how many of the 22 gated research questions have at
      least one such source.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. A retrievability verdict reduces to NOTHING. It does
      not imply a source has been read, does not create a KN-LIT entry, does not
      discharge any question's source constraint, does not open any gate, and
      does not authorize designing any experiment. Every one of those is a
      separate act and several are Coordinator acts.

  predictions:
    - metric: >-
        G1 -- forced-unreachable control: the verdict returned for a deliberately
        non-existent domain
      direction: different
      minimum_effect: >-
        UNREACHABLE, at every attempt. If a non-existent domain reports
        reachable, the probe is a control that cannot fail and NOTHING in the
        package is reportable.
    - metric: >-
        G2 -- forced-reachable control: the verdict returned for a known-good host
      direction: different
      minimum_effect: >-
        REACHABLE, with a validated artifact body. IF THIS DOES NOT FIRE, THE
        ENVIRONMENT HAS NO EGRESS AND THE RUN IS FAILED_INFRASTRUCTURE. It is NOT
        a measurement that sources are unreachable and may never be cited as
        support for the inherited premise (AGENTS.md rule 5).
    - metric: >-
        G3 -- challenge-detection gate: the classification of a body known to be a
        bot-challenge page served under an HTTP status that is not an error
      direction: different
      minimum_effect: >-
        NOT-AN-ARTIFACT. A probe that classifies a challenge page as a retrieved
        artifact is unusable and must be repaired before any gate cites it. The
        eprint PDF endpoint is the expected live instance of this case.
    - metric: >-
        G4 -- artifact validation: whether each retrieved PDF parses as a valid
        PDF, with its byte size recorded
      direction: different
      minimum_effect: >-
        VALID for every body classified as a retrieved PDF. A body counted as a
        PDF by status code alone and not parsed is a contract violation, not a
        measurement.
    - metric: >-
        G5 -- number of the 22 gated questions whose named primary sources are
        retrievable on the run date
      direction: higher
      minimum_effect: >-
        AT LEAST THREE. FIPS 203, 204 and 205 were measured retrievable by the
        session that filed the parent proposal, and GOAL-MLDSA-002 is blocked on
        FIPS 204 while GOAL-SLHDSA-001 is blocked on FIPS 205. A count of ZERO,
        with the forced-reachable control firing, REFUTES this hypothesis at the
        tested scope and vindicates the inherited premise as of the run date.
    - metric: >-
        G6 -- per-source dated verdict table over the eight declared source
        classes
      direction: different
      minimum_effect: >-
        BOTH VERDICTS PRESENT among the eight rows. A table that is uniformly
        reachable or uniformly unreachable across all eight classes is reported as
        such and treated as suspect until the two forced-value hosts are checked,
        because a real environment that returns one verdict everywhere is
        indistinguishable from an instrument that returns one verdict everywhere.
    - metric: >-
        G7 -- number of gated questions whose named sources are UNRESOLVABLE,
        i.e. named as a class rather than as a probeable document
      direction: different
      minimum_effect: >-
        NO VALUE IS PRE-REGISTERED, DELIBERATELY. This count was not measured by
        the parent proposal and guessing it would be fabrication under AGENTS.md
        rule 9. It is reported because an unresolvable naming is a THIRD outcome
        that must not be silently folded into either reachable or unreachable.

  test_boundary:
    instances:
      - >-
        Eight declared source classes: nvlpubs.nist.gov, csrc.nist.gov,
        arxiv.org abstract, arxiv.org PDF, eprint.iacr.org abstract,
        eprint.iacr.org PDF, Crossref, DBLP, plus raw.githubusercontent.com.
      - >-
        Two forced-value hosts: one deliberately non-existent domain, one
        known-good host, both probed in the same invocation as the eight classes.
      - >-
        The 22 committed RQ records carrying the source constraint, and the
        eleven draft goal records naming the gate in next_action, read as files.
      - >-
        Three named documents with a pre-registered expectation: FIPS 203, FIPS
        204 and FIPS 205 on nvlpubs.nist.gov.
    parameters:
      source_classes: 9
      forced_value_hosts: 2
      gated_questions: 22
      gated_goals: 11
      per_request_timeout_seconds: 30
      retries_per_source: 3
      client_recorded: 'yes, on every row; no verdict is generalised across clients'
      verdict_validity: 'the run date and the routes and client actually tried, recorded on every row'
      credentials: 'none; only unauthenticated public endpoints are probed'
    implementation: >-
      A small probe script emitting one dated tuple per source class. Python 3
      standard library HTTP client plus, where a PDF is retrieved, a header and
      trailer check that the body is a valid PDF rather than a status-code count.
      No credentials, no authenticated endpoints, no scraping beyond a single
      request per source class per attempt, and no circumvention of any challenge
      -- a challenge is RECORDED as a challenge and never solved or bypassed.
      Runs recorded through harness/runner.py.
    budget:
      stage0_wall_clock_seconds: 900
      stage1_wall_clock_seconds: 600
      stage2_wall_clock_seconds: 900
      total_wall_clock_seconds: 2400
      maximum_memory_gb: 8
      note: >-
        Dominated by network latency and by the retry schedule, not by compute.
        The retrieved artifacts are a few megabytes in total.

  falsification_conditions:
    - >-
      F1 (INSTRUMENT, CANNOT FAIL) -- the deliberately non-existent domain
      reports reachable. The probe is a control that cannot fail; nothing in the
      package is reportable and it must be repaired before any gate cites it.
    - >-
      F2 (NO EGRESS, INFRASTRUCTURE) -- the known-good host does not report
      reachable. The environment has no egress. The run is FAILED_INFRASTRUCTURE
      and is NEVER negative evidence about source reachability, and never support
      for the inherited premise (AGENTS.md rule 5).
    - >-
      F3 (CLASSIFICATION) -- the probe cannot distinguish a challenge page from
      an artifact. The instrument is unusable and must be repaired before any gate
      cites it.
    - >-
      F4 (THE PREMISE STANDS) -- every named primary source across all eight
      classes is unreachable WHILE the forced-reachable control fires. The gate is
      correct as inherited, this hypothesis is REJECTED at the tested scope, and
      the premise becomes dated rather than inherited -- which is a clean negative
      and a real deliverable.
    - >-
      F5 (THE EXPECTED OUTCOME, AND IT IS ALSO A RESULT) -- sources are reachable
      and at least three gated questions have a retrievable named source. Eleven
      draft goals lose their stated blocker. This is the outcome the hypothesis
      expects for the NIST-sourced subset, and it authorizes NOTHING by itself:
      opening any gate is a separate Coordinator act.
    - >-
      F6 (SCOPE OVERREACH, A FAILURE OF THE REPORT RATHER THAN OF THE
      MEASUREMENT) -- any output quoting a verdict without its date, its routes
      and its client; or asserting that a source has been READ because it was
      retrieved; or asserting that any question's gate is opened; or creating a
      KN-LIT entry. Each of those is a different act from the one measured.

  interpretation_limits:
    - >-
      THIS IS INFRASTRUCTURE. It supports no mathematical claim and no security
      claim, and it is not toy, medium or crypto evidence about the ECDLP or
      about anything else. It may never be cited in a cost or complexity
      statement.
    - >-
      Reachability is PER-DATE AND PER-ROUTE. A verdict quoted without its date
      repeats the current error in the opposite direction, and the record must
      carry the date, the routes tried and the client on every row.
    - >-
      A RETRIEVABLE PDF IS NOT A READ PAPER. Opening a gate creates transcription
      work; it does not discharge it. No provenance in the corpus is upgraded from
      `recalled` by this hypothesis.
    - >-
      Opening a question's source gate is a COORDINATOR ACT (AGENTS.md rule 1).
      This hypothesis supplies the measurement the act would rest on and proposes
      no change to any question's constraints, any goal's status, or any goal's
      next_action.
    - >-
      NOTHING HERE WEAKENS THE PROHIBITION on designing experiments from
      secondhand figures. It makes the prohibition's trigger measurable, and a
      measurably-open gate is still a gate.
    - >-
      SCOPE MISMATCH, RECORDED RATHER THAN HIDDEN. The parent proposal is filed
      under RQ-CRYPTO-001 but the 22 gated questions it concerns are almost
      entirely NON-ECDLP (ML-KEM, ML-DSA, SLH-DSA, FrodoKEM, UOV and others).
      This hypothesis is bound to RQ-CRYPTO-001 to preserve the provenance chain
      of its parent, and it is emphatically not a contribution to
      RQ-CRYPTO-001's own question, which asks whether a non-generic algorithm
      can beat Pollard rho. A reader ranking RQ-CRYPTO-001's portfolio should
      score this record on its unblocking value to the wider program and on
      nothing else.

