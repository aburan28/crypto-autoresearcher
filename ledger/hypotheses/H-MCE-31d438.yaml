hypothesis:
  id: H-MCE-31d438
  question_id: RQ-MCE-e65b3c
  goal_id: GOAL-MCE-001
  source_idea_id: IDEA-20260805-9704d9

  statement: >-
    SCOPE FIRST. Claim tier TOY. No attack, no break, no distinguisher result,
    no exponent, and no statement about the security of any Classic McEliece
    parameter set in either direction. RQ-MCE-e65b3c's toy ceiling is untouched.
    THE CLAIM, IN THREE SEPARABLE PARTS.
    (H2-A, AN ALGEBRAIC IDENTITY) For q = 2, for every m, every ordered support
    L of distinct elements of F_(2^m), and every SQUAREFREE g of degree t with
    no root in L, the binary Goppa codes satisfy Gamma(L, g) = Gamma(L, g^2) as
    F_2 codes. Consequently one and the same code is presentable BOTH as an
    alternant code of degree t with multiplier y_i = g(alpha_i)^(-1) AND as an
    alternant code of degree 2t with multiplier g(alpha_i)^(-2).
    (H2-B, A DIMENSION EXCESS THAT SEPARATES GOPPA FROM RANDOM) Define
    delta(C, r) = dim_{F_2} C - (n - m*r). Then for a binary Goppa code
    delta = 0 at r = t and delta = m*t at r = 2t; while for the MATCHED NULL --
    an alternant code A_r(L, y) at the same (n, m, r) with y drawn uniformly
    from (F_(2^m)^*)^n -- delta = 0 at BOTH r = t and r = 2t, so the
    r = t versus r = 2t dimension difference is m*t for the null and 0 for the
    Goppa code. The two arms are the same measurement on matched objects and
    their forced values are exact integers derived before any run.
    (H2-C, THE CONSEQUENCE FOR THIS GOAL'S HEADLINE NUMBER) Since Classic
    McEliece sets k = n - m*t, the excess at r = 2t equals n - k exactly, hence
    as a fraction of n it equals the redundancy rate 1 - k/n, whose values at the
    five parameter sets are the exact rationals 24/109, 13/48, 52/209,
    1547/6960, 13/64. Therefore "the alternant degree of Classic McEliece" is
    NOT WELL DEFINED: it takes two admissible values differing by a factor of
    two, and any published threshold stated as a condition on the alternant
    degree yields two different distances from Classic McEliece's parameters
    depending on which is used. The distance that GOAL-MCE-001 completion
    criterion 1 requires cannot be stated as a single number until this is
    resolved per threshold.
    THE FALSIFIERS. H2-A fails at a single toy instance with squarefree g;
    or the matched null ALSO exhibits the doubling, in which case delta carries
    no separating information; or every threshold in scope turns out to be
    stated in the code family or the rate rather than a degree, in which case
    H2-C is true coding theory with no bearing on any published threshold and
    must be recorded as such.

  mechanism: >-
    DERIVED IN-REPO except where explicitly labelled RECALLED-UNVERIFIED. No
    citation, author, year, venue or theorem number is asserted anywhere in this
    record for the doubling identity or for any threshold, because none was
    read.

    OBJECTS. F = F_(2^m). L = (alpha_1, ..., alpha_n), distinct elements of F.
    g in F[X], deg g = t, g(alpha_i) != 0 for all i.
      Gamma(L, g) = { c in F_2^n : sum_i c_i/(X - alpha_i) = 0 in F[X]/(g) }
      A_r(L, y)   = { c in F_2^n : sum_i c_i * y_i * alpha_i^j = 0 in F,
                      j = 0..r-1 },  y in (F^*)^n.

    STEP 1 -- GOPPA IS ALTERNANT OF DEGREE t, DERIVED. Modulo g,
      1/(X - alpha_i) = -g(alpha_i)^(-1) * (g(X) - g(alpha_i))/(X - alpha_i),
    and (g(X) - g(alpha_i))/(X - alpha_i) is a polynomial of degree t-1 whose
    coefficients are polynomials in alpha_i. Collecting the syndrome condition
    coefficient by coefficient gives exactly t F-linear conditions of alternant
    shape with y_i = g(alpha_i)^(-1). Hence Gamma(L,g) = A_t(L, y) and the
    generic subfield-subcode bound dim_{F_2} A_r >= n - m*r reads
    dim Gamma(L,g) >= n - m*t. Classic McEliece takes k = n - m*t exactly
    (EV-MCE-332f99 O-1, from mceliece-spec-20221023.pdf section 3, independently
    recomputed 5/5), so in this presentation delta = 0 and NOTHING about the
    code's dimension is anomalous.

    STEP 2 -- THE DOUBLING. RECALLED-UNVERIFIED, and it is the load-bearing
    external statement of the entire hypothesis. For q = 2 and g squarefree,
    Gamma(L,g) = Gamma(L,g^2). The recalled sketch: for c in Gamma(L,g) put
    f(X) = prod_{i in supp(c)} (X - alpha_i); then
      sum_i c_i/(X - alpha_i) = f'(X)/f(X),
    and gcd(f, g) = 1 because g has no root in L, so the syndrome vanishes mod g
    exactly when g | f'. Over F_2 every derivative f' is a SQUARE (odd-degree
    terms differentiate to even-degree ones and the field has characteristic 2),
    so g | f' with g squarefree forces g^2 | f', which is the syndrome condition
    for g^2. Inclusion in the other direction is immediate because g | g^2.
    THIS SKETCH IS A CANDIDATE TO CHECK, NOT AN AUTHORITY. It is checked
    computationally at 60-plus toy instances BEFORE any source is consulted, and
    the source hunt is a separate, separately-failable stage.

    STEP 3 -- THE EXCESS, AND WHY THE MATCHED NULL IS THE WHOLE POINT. Granting
    step 2, Gamma(L,g) = A_(2t)(L, y') with y'_i = g(alpha_i)^(-2), so
      delta(Gamma, 2t) = (n - m*t) - (n - 2*m*t) = m*t,
    exactly, an integer identity with no tolerance. For the matched null -- same
    n, same m, same r, same construction, differing ONLY in whether the
    multiplier has the Goppa form -- the generic expectation HEUR-SD-1 gives
    dim A_r(L, y) = n - m*r at both r = t and r = 2t, hence delta = 0 at both
    and the r-to-2r dimension DROP is m*t. So the contrast is exact and
    two-sided:
      Goppa arm: excess m*t at r = 2t, dimension drop 0 from t to 2t.
      Null arm:  excess 0 at r = 2t, dimension drop m*t from t to 2t.
    Either arm alone is uninterpretable. The pair is the measurement.

    STEP 4 -- WHY delta IS A LEGITIMATE TRACKED OBJECT AND NOT A CONSTANT OF THE
    APPARATUS. Two propagation rules, both derived. (i) Under change of
    presentation degree, delta(C, r') = delta(C, r) + m*(r' - r), a deterministic
    shift depending only on m. (ii) Under the isometries the public key is
    scrambled by -- coordinate permutation and F_2-scaling -- dim C and hence
    delta are INVARIANT. So delta propagates deterministically through exactly
    the group the scrambling uses, which is the compatibility condition the
    lossy-projection test demands. The mirror failure was checked explicitly: at
    r = t, delta is 0 for essentially every alternant code and IS a constant
    carrying no information; it is only at r = 2t that the comparator spread
    becomes m*t. That is why the experiment measures both presentations and
    reports the pair.

    STEP 5 -- THE IDENTIFIABILITY CONSEQUENCE, WHICH IS THE DELIVERABLE. A
    published attack or distinguisher on alternant codes states its applicability
    as a condition on (n, m, r). Classic McEliece presents two admissible values
    of r differing by a factor of two, hence two values of m*r/n differing by a
    factor of two, hence two distances from any such threshold. A deliverable
    reporting one of them has not stated THE distance; it has stated A distance.
    This is inventor-protocol section 8 audit 2 in its exact form: the observable
    does not determine the object, and two admissible readings give different
    answers on the quantity the conclusion rests on.

    STEP 6 -- A CANDIDATE MECHANISM FOR THIS GOAL'S OWN READ NEGATIVE, OFFERED
    AS A HYPOTHESIS AND NOT AS A READING. EV-MCE-332f99 O-5 records, from full
    text re-acquired byte-identically by an independent validator,
    arXiv:2304.14757's verbatim statement that its attack "does not work at all
    when the alternant code has the additional structure of being a Goppa code",
    with Table 1 carrying "(does not apply in the particular case of Goppa
    codes)". That sentence currently sits in the corpus with no mechanism
    attached. CANDIDATE: an attack optimised for a generic degree-r alternant
    code meets, in the Goppa case, an object that is simultaneously degree-t
    generic and degree-2t anomalous, so its algebraic system is built at the
    wrong degree in one reading and is m*t-dimensionally degenerate in the
    other. THAT PAPER'S BODY WAS NOT OBTAINED FOR THIS RECORD and no artifact of
    this line may present the candidate as a reading of it.

    WHAT IS NOT DERIVED AND IS THE WEAKEST LINK. (a) The doubling identity is
    recalled, and the exact side conditions -- squarefree versus separable,
    whether roots in L matter, whether n = 2^m matters -- are precisely the kind
    of hypotheses memory drops. (b) Whether Classic McEliece's g is squarefree
    at the standardized parameters is recalled (understood to follow from an
    irreducibility requirement) and must be read from the transcribed
    specification. (c) Whether ANY published threshold in scope is a function of
    a degree parameter at all is unknown and is a reading task that can return
    "no", which would leave H2-A and H2-B intact and H2-C irrelevant.

  assumptions:
    - >-
      TOY-CELL FILTERING IS PART OF THE CONTRACT, NOT A CLEANUP. delta is
      meaningless where n - 2*m*t < 1, because the generic bound is vacuous
      there. Cells are filtered by that condition BEFORE any measurement, the
      filter is stated in the contract, and every filtered cell is reported as
      filtered. Omitting this would manufacture a spurious excess.
    - >-
      DIMENSION IS MEASURED, NEVER DESIGNED. dim Gamma(L,g) can exceed n - m*t
      at small parameters. Every delta is computed from a MEASURED rank against
      a MEASURED matched-null rank, never against a designed value.
    - >-
      The claim is about the code, and its relevance to any published threshold
      is a separate, separately-failable question. A stage-1 pass with the
      reading stage blocked is a coding-theory result with an UNRESOLVED
      relevance claim and must be written up that way. Letting the algebra
      borrow the reading stage's significance is the named risk of this line.
    - >-
      Environment MEASURED for this record rather than assumed, because the
      scouting reports disagreed: python 3.11.15, numpy 2.4.6 PRESENT, sage,
      sympy and fpylll ABSENT (import errors recorded). Nothing here needs the
      absent packages: F_(2^m) is implemented in about forty lines of pure
      Python over an explicit irreducible polynomial recorded in the contract,
      and F_2 rank is Gaussian elimination on Python integers used as bit rows.
    - >-
      iacr:2026/1232's PDF is NOT re-attempted by any route. Its 403 is
      path-scoped and reproducible (EV-MCE-332f99 O-9), circumvention is
      forbidden, and a blocked route is a recorded outcome, never negative
      mathematical evidence (AGENTS.md rule 5).

  proof_search_map:
    bottleneck: >-
      The step at which a published threshold is EVALUATED at Classic
      McEliece's parameters, i.e. the substitution of a concrete degree into a
      condition on (n, m, r). Every "distance from the attack regime" number
      this goal can produce passes through that one substitution, and if the
      degree substituted is ambiguous by a factor of two then so is every such
      number. Nothing downstream -- better transcription, more parameter sets,
      more papers -- repairs a substitution made with the wrong parameter.
    baseline_embedding:
      parameter_slice: >-
        r = t with a uniformly random multiplier: the ordinary alternant code,
        where the generic theory is exactly the incumbent and delta = 0 by
        construction. Also g = 1 degenerately, where Gamma(L,g) is the whole of
        F_2^n and dim = n.
      reproduction_check: >-
        EXACT INTEGER, not a resemblance. The pipeline must return
        dim A_t(L, y_random) = n - m*t for a stated majority of random
        multipliers in every unfiltered cell, and dim = n at g = 1. These are
        integer identities against a computed rank, and the empirical rate of
        attainment per cell is reported BEFORE any Goppa number is compared
        against it. A cell whose attainment rate is low is EXCLUDED from the
        contrast rather than the contrast being reinterpreted.
    observation_collision:
      observable: >-
        The pair (r, dim_{F_2} C), equivalently delta(C, r).
      distinct_preimage_search: >-
        A COLLISION IS CONSTRUCTED DELIBERATELY AND IS THE ENTIRE CONTENT. At
        r = t the Goppa code and the matched random alternant code have the SAME
        observable (delta = 0): the observable does not separate them, and any
        threshold evaluated at r = t therefore cannot see the Goppa structure at
        all. At r = 2t the collision breaks (m*t versus 0). So there exist two
        ground-truth objects on opposite sides of the interesting conclusion
        that share the observable in one presentation and not the other, and the
        separating condition is the presentation degree itself. That is a direct
        identifiability finding rather than an incidental one, and it is why
        this hypothesis is an audit rather than an attack.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the code from its Goppa presentation to its degree-2t alternant
          presentation, where the hypothesis becomes an exact integer equality
          delta = m*t rather than an approximate structural statement.
        predicted_gain: >-
          Encoding is exact (the multiplier maps g(alpha_i)^(-1) to
          g(alpha_i)^(-2)); completeness and soundness are the two inclusions of
          step 2; TRANSFER to any published threshold is DECLARED UNMET, not
          deferred, and is the reading stage. Cost loss: none.
      - transform: observable_fiber
        proposed_object: >-
          Hold delta fixed at 0 and vary the forgotten structure -- Goppa
          multiplier versus uniform random multiplier at r = t -- then ask what
          intrinsic invariant distinguishes them. The proposed invariant is
          delta at r = 2t.
        predicted_gain: >-
          If delta at r = 2t also fails to distinguish the pair, the family has
          not identified the load-bearing structure and the hypothesis is
          refuted by its own matched null at zero further cost.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER. H2-A: FOR ALL m, FOR ALL supports L, FOR ALL
      squarefree g of degree t with no root in L, Gamma(L,g) = Gamma(L,g^2). The
      identity may NOT depend on the instance, the support, the field or the
      seed. The weaker order -- FOR ALL instances THERE EXISTS some identity --
      is not claimed and would be worthless.
      H2-B: FOR ALL unfiltered cells, delta(Goppa, 2t) = m*t; and FOR MOST
      random multipliers (a probability statement, HEUR-SD-1, stated as one and
      not smuggled in as a universal), delta(A_r(L,y), r) = 0. The asymmetry
      between the universal Goppa claim and the probabilistic null claim is
      deliberate and is stated so a reviewer can attack it.
      H2-C: THERE EXISTS a published threshold whose stated parameter is a
      degree -- an EXISTENTIAL, explicitly not a universal. "Published alternant
      thresholds are stated in the degree" is a FORBIDDEN SENTENCE for this
      line unless a universal is separately established, which it does not
      attempt.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: an exact toy-scale verification of an algebraic identity, an
        exact integer dimension excess against a matched null at m <= 6 and
        n <= 64, and a per-paper record of which parameter each obtainable
        threshold is stated in. It CANNOT certify anything about the security of
        Classic McEliece, cannot establish or refute any distinguisher, cannot
        be promoted toward key recovery (docs/claims-and-verification.md and
        RQ-MCE-e65b3c constraint 4 both forbid it), cannot state a distance for
        a threshold whose text was not obtained, and cannot be cited above claim
        tier toy.
      nearby_object_control: >-
        THE MATCHED RANDOM-MULTIPLIER ALTERNANT CODE, at identical n, m, r,
        field and construction -- the closest object where the hoped-for
        conclusion (the doubling, hence the excess) is expected to FAIL. If the
        doubling also holds there, the phenomenon is not about Goppa structure,
        delta separates nothing, and the hypothesis is dead. A SECOND nearby
        object, graded: g_j = g_0 * h^j for j = 0..3 with h linear and coprime
        to g_0, interpolating from squarefree to increasingly non-squarefree.
        The model must predict a difference of exactly 0 at j = 0 and a
        non-decreasing, eventually strictly positive difference as j grows. A
        model that cannot hold those apart has not identified squarefreeness as
        the load-bearing feature.
    proof_obligations:
      - claim: Gamma(L,g) = A_t(L, y) with y_i = g(alpha_i)^(-1).
        responsibility: correctness
      - claim: Gamma(L,g) = Gamma(L,g^2) for q = 2 and g squarefree with no root in L.
        responsibility: baseline
      - claim: delta(C, r') - delta(C, r) = m*(r' - r), and delta is invariant under permutation and F_2-scaling.
        responsibility: correctness
      - claim: dim A_r(L, y) = n - m*r for a stated majority of random multipliers per unfiltered cell.
        responsibility: feasibility
      - claim: delta(Goppa, 2t) = m*t exactly, as an integer, at every unfiltered cell.
        responsibility: strictness
      - claim: Classic McEliece's g is squarefree at all five standardized parameter sets, read from the specification and quoted.
        responsibility: interface
      - claim: No statement is made about any threshold whose text was not obtained; unobtained papers are ABSENT with routes tried.
        responsibility: scope
      - claim: The square-code arm measures an observable and is never promoted to a distinguisher or key-recovery result.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    DELIBERATELY NULL. There is no complexity claim of any kind. No algorithm is
    proposed, no exponent is moved, no cost is computed, and no scheme is made
    easier or harder to attack. This is an IDENTIFIABILITY AUDIT of a parameter
    substitution. dominated_by is not applicable because no Pareto point is
    claimed, and sota_delta against the published literature is zero -- the
    doubling identity is textbook and no priority over it is claimed. The delta
    is entirely against this program's internal state, which currently holds no
    value for Classic McEliece's alternant degree and no computed distance to
    any threshold (EV-MCE-332f99 boundaries: "there is no transcribed left-hand
    side").

  heuristic_assumptions:
    - id: HEUR-SD-1
      formal_statement: >-
        FOR ALL (n, m, r) in the unfiltered test grid, FOR a uniformly random
        multiplier y in (F_(2^m)^*)^n, dim_{F_2} A_r(L, y) = n - m*r with
        probability at least 0.90 over the choice of y.
      random_model_justification: >-
        The m*r conditions obtained by expanding r F-linear conditions over an
        F_2-basis of F_(2^m) are expected to be F_2-independent for a random
        multiplier. This is the standard genericity expectation for subfield
        subcodes. It is NOT proved here, small-n deviations are expected, and
        that is exactly why the threshold is 0.90 rather than 1.00 and why the
        empirical rate is reported per cell before any contrast is drawn.
      supporting_results: []
      validation_experiment_ids: [EXP-MCE-3ffdf9]
      falsification_condition: >-
        Measured attainment rate below 0.90 in a cell. That cell is EXCLUDED
        from the Goppa-versus-null contrast and the exclusion is reported. If a
        majority of cells fail, the null is not generic at reachable sizes, the
        contrast cannot be drawn at toy scale, and that is the result.
    - id: HEUR-SD-2
      formal_statement: >-
        Gamma(L,g) = Gamma(L,g^2) for q = 2 whenever g is squarefree with no
        root in L.
      random_model_justification: >-
        NOT DISTRIBUTIONAL AT ALL -- an algebraic identity, recorded as a
        heuristic assumption ONLY because it is RECALLED and unverified, with
        the derivative-is-a-square sketch given in mechanism step 2. It is the
        load-bearing external statement of the whole hypothesis and is recorded
        as such rather than buried.
      supporting_results: []
      validation_experiment_ids: [EXP-MCE-3ffdf9]
      falsification_condition: >-
        A single toy instance with squarefree g at which the two codes differ.
        The identity is then not as recalled, the r = 2t presentation does not
        exist, and H2-A, H2-B and H2-C all fall. Cost of being wrong: seconds.
        This is the primary falsifier and the experiment orders it first.
    - id: HEUR-SD-3
      formal_statement: >-
        Classic McEliece's Goppa polynomial g is squarefree at all five
        standardized parameter sets.
      random_model_justification: >-
        Understood to follow from an irreducibility requirement in the
        specification. RECALLED-UNVERIFIED. The check is a READ of text already
        in this goal's transcription lineage, not a computation.
      supporting_results: []
      validation_experiment_ids: [EXP-MCE-3ffdf9]
      falsification_condition: >-
        The specification does not require squarefreeness or irreducibility. The
        doubling then does not apply to the deployed scheme, the toy result
        stands as pure coding theory with no bearing on this goal, and that must
        be stated explicitly rather than quietly dropped.

  structural_ingredients:
    - description: >-
        The five Classic McEliece parameter sets, the identity k = n - m*t, and
        the exact rates 85/109, 35/48, 157/209, 5413/6960, 51/64, from which the
        redundancy fractions 24/109, 13/48, 52/209, 1547/6960, 13/64 follow by
        subtraction.
      citation: >-
        ledger/evidence/EV-MCE-332f99.yaml observation O-1, transcribed from
        mceliece-spec-20221023.pdf sections 3 and 7 by TASK-20260803-f3aece,
        independently recomputed 5/5 by TASK-20260803-409c5e on a re-fetched
        specification (lowest-terms fractions, gcds, six-decimal values,
        mt < n everywhere, 5413 confirmed prime).
      role: the entire input to H2-C's arithmetic
    - description: >-
        The verbatim Goppa exclusion in arXiv:2304.14757 -- the attack "does not
        work at all when the alternant code has the additional structure of
        being a Goppa code", with Table 1 carrying "(does not apply in the
        particular case of Goppa codes)".
      citation: >-
        ledger/evidence/EV-MCE-332f99.yaml observation O-5, from full text
        (526,690 bytes) obtained by TASK-20260803-292b99 and re-acquired
        byte-identically by TASK-20260803-409c5e. THE PAPER ITSELF WAS NOT READ
        FOR THIS RECORD; only this quoted observation is used.
      role: the phenomenon for which step 6 offers a candidate mechanism
    - description: >-
        The squarefree-doubling identity for binary Goppa codes and its standard
        consequence d >= 2t+1.
      citation: >-
        NOT RETRIEVED AND NOT CITED. Attributed in the literature to the
        binary-Goppa minimum-distance line; NO AUTHOR, YEAR, VENUE OR THEOREM
        NUMBER IS ASSERTED because none was checked. Derived-and-sketched
        in-repo at mechanism step 2 and treated as a CANDIDATE TO TEST.
      role: the load-bearing identity, verified computationally before any source is sought
    - description: >-
        The square-code observable dim(D*D) with generic value min(n, C(s+1,2)),
        used only as a secondary measurement with its positive control.
      citation: >-
        RECALLED-UNVERIFIED as the observable of the high-rate alternant/Goppa
        distinguisher line (RQ-MCE-e65b3c names KN-LIT-13a01d, KN-LIT-71d1a0,
        KN-LIT-7ee1a9 as that line). NONE OF THOSE PAPERS WAS READ and no defect
        formula from any of them is stated or invented here.
      role: a secondary measured table with a generic reference column, never a distinguisher claim

  reduction_chain:
    core_problem: >-
      Determine, exactly and at toy scale, whether a binary Goppa code with
      squarefree g admits a degree-2t alternant presentation carrying a
      dimension excess of m*t over the matched random-multiplier null; and
      determine, per published threshold, whether that threshold's stated
      parameter is a degree, a rate, or a code family.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. There is no reduction from this audit to any statement
      about Classic McEliece's security, to any distinguisher, or to any key
      recovery, and none is claimed. The only downstream consumer is the
      "distance from the attack regime" arithmetic of GOAL-MCE-001 completion
      criterion 1, and the deliverable there is that the distance must be
      reported in BOTH presentations with the ambiguity explicit -- a
      requirement on how a future record is written, not a result about the
      scheme.

  predictions:
    - metric: >-
        FV-A: fraction of unfiltered toy instances (m in {4,5,6}, t in {2,3,4,5},
        squarefree g with no root in L) at which Gamma(L,g) and Gamma(L,g^2)
        have identical F_2 row spaces, verified by rank of the stacked
        generators equalling each individual rank.
      direction: higher
      minimum_effect: >-
        1.00 -- identity at 100 per cent of at least 60 instances across at
        least 3 values of m. Any failure refutes HEUR-SD-2; the failing instance
        is recorded and the derivation redone, never the prediction weakened.
    - metric: >-
        FV-B: delta(Gamma(L,g), 2t) = dim Gamma(L,g) - (n - 2*m*t), over the same
        instances, together with the separately reported fraction of instances
        at which dim Gamma(L,g) = n - m*t exactly.
      direction: different
      minimum_effect: >-
        EXACTLY m*t at every instance attaining dim = n - m*t. Integer identity,
        no tolerance. The attainment fraction is a measurement reported
        alongside, not a filter applied afterwards.
    - metric: >-
        FV-D (the matched null contrast): delta(A_(2t)(L, y_random), 2t), and
        dim A_t(L, y_random) - dim A_(2t)(L, y_random), same (n, m, t).
      direction: different
      minimum_effect: >-
        delta EXACTLY 0 and the dimension difference EXACTLY m*t, at at least
        90 per cent of random multipliers per unfiltered cell (HEUR-SD-1).
        This is the arm that gives FV-B meaning: Goppa gives excess m*t and
        difference 0; the matched null gives excess 0 and difference m*t.
    - metric: >-
        FV-C: the five redundancy fractions (n-k)/n in exact rationals,
        recomputed from (m, n, t).
      direction: different
      minimum_effect: >-
        EXACTLY 24/109, 13/48, 52/209, 1547/6960, 13/64, i.e. 0.220183,
        0.270833, 0.248804, 0.222270, 0.203125 to six decimals. Any deviation
        means either EV-MCE-332f99 O-1's transcription or this derivation is
        wrong, and the discrepancy is routed to a correction record.
    - metric: >-
        Graded squarefreeness sweep: dim Gamma(L, g_j) - dim Gamma(L, g_j^2) for
        g_j = g_0 * h^j, j = 0,1,2,3, h linear and coprime to g_0.
      direction: higher
      minimum_effect: >-
        EXACTLY 0 at j = 0, NON-DECREASING in j, and strictly positive by j = 3.
