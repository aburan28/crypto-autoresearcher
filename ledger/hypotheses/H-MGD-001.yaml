hypothesis:
  id: H-MGD-001
  question_id: RQ-ECDLP-002
  statement: >-
    For generic-prime ECDLP, a Cummings--Hauenstein homogeneous multigraded dual-space
    route can support only a corrected existence-bit interface if the restricted-fiber ideal is
    proven Cox-irrelevant-saturated with exact all-strata semantics, if the Hilbert grade is
    in a proved saturated finite-scheme region, and if the recursion/division primitives are
    correctly ported to the finite field of the target ECDLP instance; direct faithful
    atomization remains an optional stronger branch.
  mechanism: >-
    Build a canonical homogeneous graded ideal for the target-restricted five-deck fiber,
    prove exact finite-scheme saturation and all-strata emptiness equivalence, evaluate
    `dim D_0^a(I)` via a theorem-fixed multigraded dual recursion and Maican-grade
    regularity bounds at a proven safe `a`, then use charged `O(log B)` restriction replay and
    singleton verification as in P1553 Query2P1.
  assumptions:
    - The restricted-fiber construction can be performed over the target finite field with a
      proved analogue of the dual recursion assumptions used over `C`.
    - Cox-irrelevant saturation removes all irrelevant torsion while preserving a true
      finite-fiber length criterion.
    - All recursive-S3/exhaustive-all-strata branches and exceptional charts are either proven
      empty-safe or charge-correctly integrated into the same predicate.
    - The empty-fiber bit is not inferred from an unsaturated or unrepaired homogeneous component.
  predictions:
    - metric: existence-predicate_validity
      direction: higher_accuracy
      minimum_effect: >-
        One verified multigraded component at the proven safe grade returns the exact
        restricted-fiber nonemptiness bit under all-strata semantics.
    - metric: reduction_cost
      direction: lower
      minimum_effect: >-
        A future exact constructor must reduce the setup/query costs to within the frozen
        `B^(9/4+o(1))` and `B^(5/4+o(1))` caps after charging all saturation and replay work.
    - metric: proof_integrity
      direction: higher
      minimum_effect: >-
        Complete source-binding across `TASK-041`, `TASK-039`, and `TASK-040` with no
        representation-agnostic lower-bound overreach.
  test_boundary:
    scope:
      - source-only theorem reconstruction
      - finite-field semantic port check
      - exact finite-fiber saturation theorem check
      - complete all-strata restriction replay cost accounting
    implementation: none (this hypothesis is not execute-only evidence)
  falsification_conditions:
    - >-
      The producer-corrected route fails to produce a finite-field, all-strata exact theorem of
      saturated-fiber equivalence; then the route is scoped-revise and cannot advance to an
      operational attack hypothesis.
    - >-
      The `O(log B)` replay or singleton recovery cannot be proved within the frozen complete
      path and remains only a speculative control.
  interpretation_limits:
    - This hypothesis is source-to-proof level only and has no cryptographic instance
      evidence.
    - No universal algorithmic lower bound is implied by the review findings.
    - No breakthrough is licensed until an audited constructor and full ECDLP path are durable.
  status: specified
  proposed_by: coordinator
