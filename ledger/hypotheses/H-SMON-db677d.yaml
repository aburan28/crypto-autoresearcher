hypothesis:
  id: H-SMON-db677d
  question_id: RQ-MONO-001
  added: '2026-08-07'
  status: supported_scoped
  status_note: >-
    Status set by the top-level session, NOT by an independent Coordinator subagent, and
    NOT reviewed by an independent validator or red team. AGENTS.md rule 12 is not met.
    "supported_scoped" means: the derivation in
    papers/semaev-conservation-specialization/paper.tex is complete and its finite-scale
    consequences held on 241643 good specializations with zero exceptions
    (RUN-SMON-e5cbe6-001), while independent proof review by a reader experienced in
    function fields or arithmetic geometry has NOT been obtained. Do not read this status
    as a closure of KN-OPEN-009.

  statement: >-
    Let E be an elliptic curve over any field K, m >= 3, n = m-1, and let t_1..t_n be
    independent transcendentals. Then S_m(t_1,...,t_n,T) is separable of degree 2^{m-2}
    over L = K(t_1,...,t_n); its splitting field is the function field of E^n/Delta,
    where Delta is the DIAGONAL inversion; and
        Gal( S_m(t_1,...,t_n,T) / L )  =  (Z/2)^n / Delta  =  (Z/2)^{m-2},
    acting SIMPLY TRANSITIVELY on the roots. K is algebraically closed in the splitting
    field, so arithmetic monodromy = geometric monodromy. The group is the same for every
    curve, every base field and every characteristic.

  mechanism: >-
    The roots of S_m(t_1..t_n,T) are the x-coordinates of the signed sums
    eps_1 P_1 + ... + eps_n P_n of the tautological points P_i with x(P_i) = t_i (this
    part is classical). Hence the splitting field sits inside K(E^n), which is Galois
    over K((E/+-)^n) = L with group (Z/2)^n -- the DECK GROUP of the fibre product of n
    copies of the degree-2 Galois cover x : E -> P^1. The diagonal inversion fixes every
    root because x(R) = x(-R). Nothing else does, because a further coincidence among
    roots forces sum_{i in S} eps_i P_i in E[2] for a proper nonempty S, which is a
    proper closed condition on E^n and so is avoided by its generic point. Because the
    group is abelian the stabiliser of a root is normal, so the root field is already the
    splitting field: the cover is Galois.

  assumptions:
    - The only properties of the x-map E -> P^1 used are that it is finite separable of
      degree 2 with Galois group generated by inversion, and that inversion is not the identity.
      Both hold in every characteristic, which is why no characteristic is excluded.
    - The Weierstrass-coordinate statements (the S_3 closed form, disc_T S_3 = 16 f f,
      the description of the branch locus by f(t_i) = 0) additionally need char != 2,3.
    - deg_T S_m = 2^{m-2} is taken from the literature (Semaev 2004; Gaudry 2009), not
      re-proved here.

  proof_search_map:
    bottleneck: >-
      Whether the permutation action of the deck group (Z/2)^n on the 2^{m-2} roots has
      kernel exactly the diagonal. Everything else is formal. If the kernel were larger
      for some curve, that curve would have smaller monodromy and a potentially deviant
      relation rate -- which is exactly the exceptional locus KN-OPEN-009 hunts.
    baseline_embedding:
      parameter_slice: >-
        m = 3 is the degenerate slice: deg_T S_3 = 2, and the claim reduces to the known
        identity disc_T S_3 = 16 f(x1) f(x2) and monodromy S_2 (KN-FIND-c41ea9). The m=3
        case must be reproduced exactly by any proof of the general statement.
      reproduction_check: >-
        C1 of EXP-SMON-e5cbe6 re-derives the m=3 identity symbolically over
        Z[x1,x2,A,B]; C9 confirms m=3 is the unique m at which disc_T S_m is a
        non-square, i.e. the unique m at which the classical identity carries information.
    observation_collision:
      observable: >-
        The factorization type of S_m(a_1,...,a_n,T) over F_p at a good specialization.
        The theorem predicts it takes exactly two values, 1^{2^{m-2}} and 2^{2^{m-3}},
        and is a function of the class of (chi(f(a_i)))_i modulo global sign.
      distinct_preimage_search: >-
        Two matched null objects of the same degree were searched for the same
        dichotomy: a uniform random quartic, and the S_4 resultant construction with the
        inner summation polynomial replaced by a random quadratic. Both produced
        factorization types the theorem forbids (degree-3 and degree-4 irreducible
        factors, mixed types), at rates 86.3% and 51.1% respectively. The observable
        therefore separates the object from its nearest non-elliptic neighbour.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "the splitting field of S_m" by "the function field of E^{m-1}/Delta".
          This is the whole content: it converts a question about a polynomial of degree
          2^{m-2} whose coefficients are unbounded-degree polynomials in m-1 variables
          into a question about a quotient of a product of elliptic curves by an order-2
          group.
        predicted_gain: >-
          Removes the square-class independence computation entirely, and with it the
          char != 2 restriction and any dependence on the Weierstrass model.
    quantifier_order: >-
      FOR ALL fields K, FOR ALL elliptic curves E/K, FOR ALL m >= 3: the Galois group is
      (Z/2)^{m-2}. The quantifier order matters and is the point: the group does not
      depend on E, so there EXISTS NO curve family with smaller monodromy. Note the
      generic point is quantified inside: the statement is about the generic fibre, and
      says nothing about any particular specialization, which is why Theorem 4.2 of the
      paper (the specialization law) is a separate statement with its own good-locus
      hypothesis.
    method_ceiling:
      strongest_certifiable_claim: >-
        A complete derivation, plus exhaustive finite-field verification at toy scale.
        NOT a peer-reviewed proof and NOT a closure of KN-OPEN-009.
      nearby_object_control: >-
        NULL-B of EXP-SMON-e5cbe6: the identical resultant construction with the elliptic
        structure removed. It fails the dichotomy, confirming the elliptic group law and
        not the resultant shape is what forces the result.
    proof_obligations:
      - claim: The deck group of E^n -> (E/+-)^n is (Z/2)^n.
        responsibility: correctness
      - claim: The 2^{m-2} signed sums are pairwise distinct and finite at the generic point.
        responsibility: correctness
      - claim: E^n/Delta is geometrically integral, so arithmetic = geometric monodromy.
        responsibility: correctness
      - claim: deg_T S_m = 2^{m-2}.
        responsibility: baseline
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    NO ASYMPTOTIC CLAIM IS MADE. This hypothesis asserts nothing about the cost of any
    ECDLP algorithm. It does not improve, and does not purport to improve, any exponent,
    cofactor or constant. Filling this block would misrepresent the record.

  heuristic_assumptions: []

  predictions:
    - At every good specialization the factorization type of S_m(a,T) over F_p is
      1^{2^{m-2}} when all chi(f(a_i)) agree and 2^{2^{m-3}} otherwise; never mixed,
      never with a factor of degree >= 3.
    - On the factor-base locus (every a_i the x-coordinate of an F_p-rational point) the
      fibre splits completely at EVERY m.
    - disc_T S_m is a square in L for every m >= 4, and a non-square at m = 3.
    - The exact per-class count S^k N^{n-k} + N^k S^{n-k} is met with residual zero.

  falsification:
    - Any good specialization whose factorization type is not the predicted one.
    - Any irreducible factor of degree >= 3, or any mixed type, at a good specialization.
    - Any good factor-base specialization that fails to split completely.
    - A nonzero residual in the exhaustive per-class identity.
    - A curve exhibiting a Frobenius cycle type of order > 2.

  pareto_integrity:
    dominated_by: Pollard rho at exponent 1/2
    sota_delta:
      time_exponent: not_applicable
      memory_exponent: not_applicable
      data_or_query_exponent: not_applicable
    note: >-
      This is a structural result with no algorithmic component. It is not on the Pareto
      frontier of any cost model because it makes no cost claim.

