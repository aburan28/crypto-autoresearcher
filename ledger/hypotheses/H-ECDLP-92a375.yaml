hypothesis:
  id: H-ECDLP-92a375
  question_id: RQ-ECDLP-002
  statement: >-
    CONDITIONAL NECESSARY-CONDITION GATE, NOT A RESULT. Fix a public
    finite-alphabet predicate psi on x-coordinates and the scalar-orbit word
    s_i = psi(x([i]P)). For a live public target Q = [k]P the queryable shifted
    word is s^Q_j = psi(x(Q + [j]P)) = s_{k+j}, so a public target exposes a
    substring of the global word starting at the unknown index k. There MAY exist
    a public predicate whose scalar-orbit word has recurrence-state length
    L = N^rho with rho below 1/2 and whose live-target companion state can be
    inverted to a complete scalar candidate list in sub-square-root total work.
    The hypothesis under test is the OPPOSITE, and it is what the experiment
    expects: normalized linear complexity, state-collision exponent, and decoder
    cost decisively rule out this cheap-state mechanism on increasing toy sizes.
    No unconditional lower bound, no ECDLP closure, no short recurrence and no
    attack is claimed; a negative test closes only the frozen predicate and
    window family. Source proposal: IDEA-20260814-270e03.
  mechanism: >-
    If the global word admits a compact linear recurrence, a window determines a
    companion state. If scalar positions map to a small state fibre and the
    companion orbit can be indexed without solving a generic finite-field or
    group discrete logarithm, that state could serve as a decoder bridge. The
    proposal makes all three gates explicit: recurrence compression, collision
    entropy, and state-index inversion. A recurrence-fitting algorithm is a
    MEASUREMENT PRIMITIVE only. Random balanced words and salted predicates are
    same-shape controls, and spurious finite-window compression must disappear as
    the window lengthens - a quantity that fails to decay when the parameter meant
    to destroy it increases is the canonical artifact tell.
  assumptions:
    - >-
      The curve and the prime-order public subgroup are fixed, and psi, the
      alphabet, the coordinate model, the window schedule, the recurrence
      algorithm and the decoder audit are ALL FROZEN before any live-target shift
      is sampled.
    - >-
      psi is public, target-independent, and evaluable from Q + [j]P without
      knowing k. Predicate search cost and every rejected predicate are charged as
      setup or advice, never free.
    - >-
      Exhaustive toy scalar enumeration is used ONLY to establish ground-truth
      state collisions and candidate recall. It receives no online decoder credit,
      and an N-entry state table is linear advice and is disqualifying.
    - >-
      Linear complexity over each declared alphabet field is reported separately;
      symbol encodings and field extensions are not silently optimized after
      seeing results.
    - >-
      Published bounds on linear complexity apply only to their stated function
      and parameter families. The experiment neither generalizes them nor claims a
      lower bound.
  proof_search_map:
    bottleneck: >-
      Whether public target-shift coordinate symbols compress to a
      collision-bounded recurrence state whose orbit index can be recovered
      without reintroducing a square-root or order-N discrete logarithm.
    baseline_embedding:
      parameter_slice: >-
        A window too short to determine a recurrence returns all matching scalar
        positions. A recurrence of length at least half the observed window gives
        no compression over storing the window. Exhaustive state lookup is an
        N-entry baseline and receives no algorithmic credit.
      reproduction_check: >-
        Reconstruct every held-out symbol from the fitted recurrence wherever a
        recurrence is credited, compare independent recurrence implementations on
        the same toy words, and verify that every exhaustively enumerated
        candidate state reproduces the live-target window.
    observation_collision:
      observable: >-
        The finite target window, the fitted minimal polynomial, and the companion
        state.
      distinct_preimage_search: >-
        Enumerate all toy scalar shifts and collect exact state-collision buckets;
        and search for different words, gauges and predicates with identical short
        recurrence profiles but different continuations or scalar fibres. A
        compact state whose orbit-index problem remains hard is the expected
        collision and it is measured rather than assumed away.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Convert public symbols psi(x(Q + [j]P)) into a recurrence companion
          state.
        predicted_gain: >-
          Compress target-dependent observations to L field symbols IF a genuine
          short recurrence exists.
      - transform: observable_fiber
        proposed_object: >-
          Invert the companion orbit to all scalar positions sharing the live
          state.
        predicted_gain: >-
          Supplies the mandatory candidate decoder and exposes whether state
          indexing is merely another discrete logarithm.
    quantifier_order: >-
      THERE EXISTS one public target-independent predicate psi and one
      recurrence-and-decoder pair such that FOR RANDOM live targets and FOR ALL
      target states in the declared family, the decoder returns the true scalar
      with a bounded fibre and sub-square-root complete cost. psi MAY NOT be
      chosen after reading target windows or test-set linear complexities.
    method_ceiling:
      strongest_certifiable_claim: >-
        The test can certify recurrence and collision profiles for frozen toy
        predicates, or falsify their cheap-state interface. It CANNOT prove an
        unconditional ECDLP lower bound, cannot close recurrence methods
        generally, and cannot establish a cryptographic attack.
      nearby_object_control: >-
        Random balanced cyclic words matched on length, alphabet frequencies,
        negation symmetry, window count and hash representation. A low-complexity
        reading shared with this null is finite-window overfitting.
    proof_obligations:
      - claim: Live-target symbols are computed without k or source advice
        responsibility: interface
      - claim: The recurrence reproduces held-out continuation symbols exactly
        responsibility: correctness
      - claim: Exhaustive state fibres contain every true scalar shift
        responsibility: correctness
      - claim: State inversion is not another generic DLP or an N-entry table
        responsibility: interface
      - claim: Complexity and collision exponents are stable across window growth
        responsibility: success_probability
      - claim: Predicate search, queries, arithmetic, retries and output are all charged
        responsibility: runtime
      - claim: The conclusion stays conditional and predicate-local
        responsibility: scope
  rerandomization: null
  asymptotic_claim:
    problem: 'Prime-field ECDLP in a public prime-order subgroup.'
    prior_best: 'Pollard rho at N^{1/2+o(1)} time with constant memory; BSGS at N^{1/2+o(1)} time and memory.'
    time_exponent: >-
      NONE CLAIMED. The gate defines what a constructive survivor would need -
      complete cost N^{1/2-epsilon+o(1)} - and expects to falsify the premise
      rather than to meet it. Delta against rho and BSGS today is zero exponent
      bits and no algorithm.
    memory_exponent: >-
      NONE CLAIMED. An N-entry state table is Theta(N) memory or advice and is
      explicitly disqualifying.
    hidden_cofactor: >-
      Predicate search over many masks, rejected predicates, curve-coordinate
      conversion, source-word construction, recurrence fitting, companion-orbit
      indexing and null calibration - all charged as preprocessing or advice, none
      hidden.
    claim_kind: exponent_improvement
  heuristic_assumptions:
    - id: HEUR-WORD-1
      formal_statement: >-
        The normalized linear-complexity profile of a frozen coordinate predicate
        stabilizes as subgroup and window sizes increase.
      random_model_justification: >-
        Balanced random words typically have linear complexity near half the
        observed length, and there are published results proving large
        linear-complexity profiles for specific elliptic-derived sequences;
        neither fact is a universal theorem for an arbitrary psi, and the record
        does not treat it as one.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-baeab8
      falsification_condition: >-
        Profile slopes oscillate, depend on a post-hoc alphabet choice, or fail to
        stabilize within 0.10 on the largest two sizes.
    - id: HEUR-WORD-2
      formal_statement: >-
        Exact companion states arising from the same live-target window have a
        stable target-weighted collision exponent.
      random_model_justification: >-
        For random words, matching-window occupancy supplies a balls-into-bins
        null once overlaps are handled; the real cyclic dependence is measured
        rather than assumed.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-baeab8
      falsification_condition: >-
        Collision exponents drift by more than 0.10 across sizes, or rare buckets
        dominate the target-weighted expectation.
    - id: HEUR-WORD-3
      formal_statement: >-
        If a compact recurrence exists, its companion-orbit index admits a public
        inversion whose cost is captured by the declared decoder audit.
      random_model_justification: >-
        NO RANDOM-MODEL THEOREM GRANTS THIS. It is the explicit structural
        heuristic whose likely failure is what prevents a recurrence from becoming
        an ECDLP algorithm, and it is named so that its failure is a first-class
        result rather than a silent gap.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-baeab8
      falsification_condition: >-
        Inversion is exhaustive, table-based at size N, invokes a generic discrete
        logarithm, or has a measured time or memory exponent of at least 1/2.
  structural_ingredients:
    - description: >-
        Large linear-complexity-profile bounds for certain functions evaluated on
        multiples of a point, which make a cheap recurrence a hypothesis to
        FALSIFY rather than to assume.
      citation: >-
        Merai and Winterhof, On the linear complexity profile of some sequences
        derived from elliptic curves, arXiv:1509.06909. The source proposal lists
        this under primary_sources_checked; this design session did NOT open it,
        so the entry is marked `recalled` and is a pointer for the reviewer.
      provenance: recalled
      verified_by: null
      role: >-
        Sets the prior that the falsification-oriented default is the expected
        outcome. Being `recalled` it may not discharge any supporting result and
        may not back a decision until an agent that read it says so in a new
        record.
    - description: >-
        Pseudorandomness context for elliptic-curve coordinate sequences via
        exponential sums; it supplies context, NOT a state-index decoder.
      citation: >-
        Ahmadi and Shparlinski, Exponential Sums over Points of Elliptic Curves,
        arXiv:1302.4210. Listed by the source proposal as checked; NOT opened by
        this design session.
      provenance: recalled
      verified_by: null
      role: >-
        Background only. Explicitly does not supply the decoder the gate demands.
  reduction_chain:
    core_problem: >-
      Whether a deliberately lossy public coordinate-predicate word over the
      scalar orbit admits a compact recurrence state whose inversion is cheaper
      than the square-root frontier.
    corollaries: []
  predictions:
    - metric: 'normalized linear complexity L_w/w at growing window length w (dimensionless)'
      direction: higher
      minimum_effect: >-
        For the falsification-oriented default, at least 0.40 on each of the three
        largest windows and within 0.10 of the balanced-random-word null. A
        constructive exception must instead keep absolute L below N^0.49.
    - metric: 'exact held-out recurrence error (integer count of mismatched symbols)'
      direction: lower
      minimum_effect: >-
        Exactly zero for any state credited as a recurrence. Fitted-window
        accuracy alone receives no credit.
    - metric: 'target-state candidate exponent u = log_N |C_state(Q)| (dimensionless)'
      direction: lower
      minimum_effect: >-
        A constructive survivor requires target-weighted u below 0.49 on the three
        largest completed sizes with exhaustive recall exactly 1.000000.
    - metric: >-
        complete state-index decoder exponent - measured time and memory slopes in
        log N (dimensionless)
      direction: lower
      minimum_effect: >-
        A constructive survivor requires both slopes below 0.49 without an N-entry
        table and without any generic group or field discrete logarithm.
    - metric: >-
        spurious compression under window growth and predicate salting - the
        fraction of any initial gap from the random-word null that disappears at
        full salt (dimensionless)
      direction: lower
      minimum_effect: >-
        At least 75 percent of the initial gap must disappear when the predicate
        is fully salted, or the credited recurrence is rejected as a finite-window
        artifact.
  test_boundary:
    instances:
      - 'Public generated prime-order toy subgroups from 12 through 26 bits.'
      - 'Balanced one-bit, two-bit and four-symbol public coordinate predicates.'
      - 'Random balanced cyclic words matched on alphabet histogram, length, negation symmetry and sampled windows - the curve-free null.'
      - 'LFSR words with known recurrence length, state orbit, collision fibre and decoder - the positive control.'
    parameters:
      bit_sizes: '12 through 26'
      window_lengths: 'doubling from 32 to the smaller of N/4 and the budget cap'
      live_target_shifts_per_cell: 200
      salt_fractions: '0, 25, 50, 75, 100 percent'
      alphabets: 'one-bit, two-bit, four-symbol'
    implementation: >-
      Fit recurrences on one prefix and test exact continuation on a DISJOINT
      suffix; enumerate all scalar shifts to form exact state buckets; attempt only
      pre-registered companion-state index methods, and count every finite-field or
      group discrete-logarithm call any of them makes.
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 32
      maximum_memory_gb: 16
      maximum_runs: 6
  falsification_conditions:
    - >-
      A fitted recurrence fails to reproduce one held-out symbol while still being
      credited as a deterministic state.
    - >-
      Linear complexity grows proportionally to the window, or matches the
      random-word null on the largest pre-registered windows, eliminating the
      cheap-state premise for that predicate.
    - >-
      The true scalar is absent from a state collision bucket, or the bucket
      exponent remains at least 1/2.
    - >-
      State inversion needs an N-entry lookup, an exhaustive orbit traversal, or a
      generic discrete logarithm whose complete cost is not below the rho
      baseline.
    - >-
      Apparent compression SURVIVES full predicate salting, or disappears under an
      equivalent coordinate gauge without a declared scope restriction. Failure to
      decay under the parameter meant to destroy the signal is the canonical
      artifact tell.
    - >-
      The curve-free random-word null reproduces the measured complexity profile
      and collision exponent. Nothing measured may then be quoted as a statement
      about elliptic curves or the ECDLP.
  interpretation_limits:
    - >-
      This is a conditional model ceiling for a frozen lossy-word representation,
      not an unconditional ECDLP lower bound and not a closure of recurrence
      ideas.
    - >-
      A large measured linear complexity is evidence only for the tested curves,
      predicates, windows and symbol fields.
    - >-
      A short recurrence would still NOT be an attack until state collisions,
      indexing, retries, memory, advice and final scalar verification are all
      solved and charged.
    - >-
      The richer elliptic-net lane may behave differently because it retains
      algebraic data this predicate intentionally discards; that lane is carried as
      a labelled nearby-object control and is NOT merged into this claim.
    - >-
      NOT TESTABLE AT REACHABLE SCALE, STATED PLAINLY RATHER THAN SHRUNK. The
      constructive branch requires u below 0.49 and decoder slopes below 0.49 at
      cryptographic N. This design reaches 26 bits, so every exponent it reports is
      a slope fitted over a short range of sizes with wide error bars, and it
      CANNOT establish an exponent at cryptographic scale in either direction. The
      contract reports the slope with its error bars and the number of sizes it was
      fitted over, and asserts nothing beyond the tested range.
    - >-
      Predicate search over many masks creates multiple-testing bias, and it is
      charged as advice and reported as a count of rejected predicates rather than
      hidden.
  status: proposed
  proposed_by: coordinator
  source_refs:
    - ledger/proposals/IDEA-20260814-270e03.yaml
    - ledger/questions/RQ-ECDLP-002.yaml
    - experiments/EXP-ECDLP-baeab8/specification.yaml
