  related_hypotheses: []
  statement: >
    Fix the closed-form census-column
    identities of IDEA-20260829-20b05f
    before any F_p-isogeny class is
    enumerated or any charged rho is
    run. Stage 0 asserts only that the
    reachable per-curve column set has
    size 3 and equals {j, f, |Aut|},
    that order-derived quantities are
    class-constant, and that the Aut
    work-ratio squares are 3 at
    |Aut|=6 and 2 at |Aut|=4. A nearby
    claim that embedding degree k is a
    per-curve reachable column is
    rejected. A dummy that treats a
    change of Weierstrass model as a
    fourth column is rejected. This is
    not a class-spread measurement and
    not a rho beat. Stages 1+ stay
    unauthorized.
  mechanism: >
    IDEA-20260829-20b05f tracks the
    reachable invariant set under
    charged F_p-isogeny transfer after
    Tate's theorem makes every
    order-derived non-genericity
    class-constant. Stage 0 freezes
    the column-set cardinality and the
    Aut-discount squares so a later
    S(C) run cannot be read from an
    instrument that invents columns.
    No Velu walk. No rho. No Semaev
    S_m. No DLP solve.
  predictions:
    - id: P-S0-COLS3
      metric: toy census-column identities
      direction: different
      minimum_effect: >
        After fixture_pass, REAL
        reports column_set_size=3,
        columns {j,f,Aut}, and Aut
        work-ratio squares 3 and 2.
        KF k-is-per-curve-column is
        rejected. NULL model-is-
        fourth-column is rejected.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KF
      statement: >
        After fixture_pass, KF claim
        that embedding degree k is a
        per-curve reachable column is
        accepted.
    - id: F-S0-REAL
      statement: >
        After fixture_pass, REAL
        misses size 3 or the Aut
        work-ratio squares.
  test_boundary:
    instances:
      - frozen Stage 0 REAL / KF / NULL column-arithmetic panel
    parameters:
      real_schema:
        reachable_columns: [j, f, Aut]
        column_set_size: 3
        class_constant:
          - N
          - anomalous
          - embedding_degree
          - pohlig_hellman
        aut6_work_ratio_squared: 3
        aut4_work_ratio_squared: 2
        must_column_set_size_three: true
        must_aut_discount_squares: true
      known_false:
