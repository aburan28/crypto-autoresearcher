hypothesis:
  id: H-ECDLP-731225
  question_id: RQ-ECDLP-002
  added: '2026-08-25'
  derived_from_idea: IDEA-20260725-007
  status: proposed
  proposed_by: coordinator

  statement: >-
    SCOPE. Boolean chained Semaev systems with m equal to t equal to 3 over GF(2^n)
    at n equal to 9 and n equal to 12, DEGREE 5 ONLY, two construction families,
    no closure engine and no D6 rank. Claim tier toy. NO ATTACK, NO EXPONENT, NO
    PRIME-FIELD OR CRYPTO-SCALE STATEMENT.
    THE THREE EXPLANATIONS THIS SEPARATES. The recorded support-bias pair -
    extra_5 equal to 369 of a sem D5 deficit of 909 at n equal to 9 (40.6 percent,
    EV-SIG-006) and extra_5 equal to 0 of 1,321 at n equal to 12 (0.0 percent,
    EV-SIG-008 RUN-c) - is currently consistent with three different readings, and
    an ensemble over re-seeded constructions separates them.
    E1 SIZE-DEPENDENT. extra_5 is fixed by the cell, essentially independent of
    which admissible column-matched construction is drawn. Then over K equal to 16
    independently seeded greedy constructions at n equal to 9, median extra_5 is at
    least 200, IQR over median is at most 0.5, and at most 2 of 16 give extra_5
    equal to 0; and over K equal to 16 at n equal to 12, 0 of 16 give extra_5
    greater than 0.
    E2 TRAJECTORY-DEPENDENT. extra_5 depends on which greedy trajectory the seed
    takes. Then at n equal to 9 IQR over median is at least 1.0, or at least 4 of
    16 give extra_5 equal to 0, and both the 40.6 percent and the load-bearing 0.0
    percent become single-construction measurements that must be re-scoped.
    E3 DEGENERATE ENTROPY - and this is the explanation the existing data most
    supports. The construction family has so little freedom that re-seeding
    produces near-identical systems. Operationalised as median pairwise support
    Jaccard at least 0.99 across the n equal to 9 ensemble. Under E3 neither E1 nor
    E2 is decidable with this family, the recorded 369 is a single point of a nearly
    deterministic construction, and no share figure may be quoted from it until the
    family is widened.
    CONFIRMATION PRESSURE IS NAMED. E1 is the convenient outcome because it
    preserves every D at most 5 SIG conclusion. The interpretation map and every
    threshold are fixed in this record before any sample is drawn, for that reason.

  mechanism: >-
    Column matching is realised by seeded greedy set-cover over safe pools plus swap
    repairs - 5 repairs at n equal to 9, 6 at n equal to 12. The randomisation is
    explicit and re-seedable - SIG8_run.sage lines 646 to 647 define
    greedy_cover(seed_tag) with rng seeded by stable_seed of ("sig8", "n1greedy", N,
    SEED, seed_tag), and line 734 calls it with the single tag main. SO EVERY
    RECORDED COLUMN-MATCHED NULL IN THIS PROGRAM SITS ON ONE GREEDY TRAJECTORY, and
    re-seeding is a one-line change.
    That procedure concentrates the null's monomial supports into the same sparse
    block-composition classes the sem occupies - the structure the up-closure column
    law rewards, per EV-SIG-006 observation 1 - so a concentrated random system can
    carry non-Koszul relations at D5 that a histogram-only null does not. The n equal
    to 9 attribution is already clean, because the non-column-matched nulls N0 and N2
    give extra_5 equal to 0 there (EV-SIG-006 control C2). What is unknown is whether
    the MAGNITUDE is a property of the cell, of the trajectory, or of a family with
    no freedom to vary.
    PRIOR EVIDENCE THAT MUST BE FOLDED IN RATHER THAN IGNORED. RUN-EXP-SIG-006-c and
    RUN-EXP-SIG-006-d are two DIFFERENT constructions - D5 ncols 11,004 against
    11,021, D6 ncols 29,327 against 29,332, D6 extra 7,261 against 7,226, |V| 1
    against 0 - and they return byte-identical D5 numbers - rank 9,135, sr_pred
    9,504, deficit 369, kernel_dim 1,305, rankK 936, extra 369. That is strong
    evidence against fine-grained sensitivity. It is NOT evidence against E2, because
    both used seed_tag main and differ only by a donor-filter bug fix; and it is
    exactly the signature E3 predicts. Hence the ensemble, and hence E3 as a
    first-class pre-registered outcome.
    TWO FAMILIES ARE COMPARED. Family G - greedy with K distinct seed_tags. Family W
    - admissible-swap walk starting from a valid N1 and applying W accepted swaps
    drawn from the pools. Family W is PROVABLY admissible - every pool element is
    safe in the sense of SIG8_run.sage lines 435 to 444, so no choice from the pools
    can introduce a column outside the sem's D6 column set; and the swap primitive's
    risk test at lines 707 to 722 accepts a swap only if no singly-covered sextic
    loses its cover, so no sem column is lost. Exact D6 column-set equality is
    therefore preserved BY CONSTRUCTION and is verified per sample by the existing
    colset_of_int equality check at lines 763 to 776. Its expected admission rate is
    about 1; a measured rate below 0.9 FALSIFIES that safety argument and is itself
    the finding.
    The program's standard T11 null - identical support, randomised coefficients - is
    VACUOUS for this instrument because the system is boolean over GF(2) where every
    support coefficient is 1, which is why a construction-space ensemble is the only
    available route.

  assumptions:
  - >-
    D5 is below the freeze degree at both n equal to 9 (freeze 6) and n equal to 12
    (freeze 7), so the freeze / variety-collapse mechanism of EV-SIG-006 is not in
    play at D5. A sample whose measured freeze differs is out of scope.
  - >-
    greedy_cover's seed_tag is the only randomisation input (SIG8_run.sage lines 646
    to 647), so distinct tags give genuinely distinct trajectories through the shuffle
    of free and of each pool. IF DISTINCT TAGS PRODUCE IDENTICAL CHOSEN SETS, THAT IS
    THE E3 OUTCOME and must be reported as such rather than as a bug.
  - >-
    Column matching is enforced at D6, NOT at D5 (SIG8_run.sage lines 763 to 776
    compute colset_of_int at degree 6 and halt on inequality). The recorded D5 column
    counts differ from the sem's - 11,032 against 11,021 at n equal to 9
    (RUN-EXP-SIG-006-d), 46,709 against 46,694 at n equal to 12
    (RUN-EXP-SIG-008-c). ANY CONTROL DEMANDING EXACT D5 COLUMN-SET EQUALITY IS
    UNSATISFIABLE, and delta5_in / delta5_out are uncontrolled covariates by design.
  - >-
    sr_pred is the pinned truncated-positive series documented in EV-SIG-006, not the
    textbook Bardet series.
  - >-
    The sem D5 anchors are reproducible through this instrument. EV-SIG-005's D5
    deficit series lists 1322 at n equal to 12 where the receipt records deficit 1,321
    and extra 1,322; THE RECEIPT VALUES GOVERN and this plus-or-minus-one labelling
    inconsistency is flagged, not relied on.

  proof_search_map:
    not_applicable_reason: >-
      Baseline instrument calibration. No theorem, asymptotic bound, algorithm,
      reduction or closure argument is proposed; the deliverable is a distribution of
      a quantity the corpus has sampled exactly once per cell. Nothing here admits or
      inadmits any D6 quantity and nothing changes any hypothesis status. If an E1
      outcome were later used to argue that the sem D5 deficit is genuine and
      therefore that some semi-regularity statement holds, THAT argument is
      proof-oriented and needs its own map - and this record's interpretation limits
      say explicitly that even a fully E1 outcome does not validate the cascade
      interpretation.
    bottleneck: null
    baseline_embedding:
      parameter_slice: null
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms: []
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations: []

  asymptotic_claim: null

  heuristic_assumptions:
  - id: HEUR-SIGENS-1
    formal_statement: >-
      Distinct seed_tags passed to greedy_cover produce statistically independent
      draws from the admissible column-matched construction family, so that the
      measured IQR over 16 samples estimates the family's spread rather than the
      spread of a correlated pseudo-replicate set.
    random_model_justification: >-
      The only randomisation input is the seed_tag (SIG8_run.sage lines 646 to 647),
      which shuffles free and each pool. Independence of the resulting chosen sets is
      an assumption about the greedy procedure, not a theorem, and the safe pools may
      be correlated enough that distinct tags reuse the same choices.
    supporting_results: []
    validation_experiment_ids:
    - EXP-ECDLP-8a96c6
    falsification_condition: >-
      Median pairwise support Jaccard at least 0.99 within the n equal to 9 family-G
      ensemble. The draws are then pseudo-replicates, the measured IQR is an
      underestimate of the family's spread, and E1 and E2 are BOTH undecidable with
      this family - which is precisely the E3 verdict and is a first-class outcome
      rather than a failure of the run.
  - id: HEUR-SIGENS-2
    formal_statement: >-
      Family W's safe-pool plus risk-test argument preserves exact D6 column-set
      equality, so the admission rate of walk samples is at least 0.9.
    random_model_justification: >-
      Derived, not assumed - every pool element is safe (SIG8_run.sage lines 435 to
      444) so no pool choice introduces a column outside the sem's D6 set, and the
      swap risk test (lines 707 to 722) accepts only swaps under which no
      singly-covered sextic loses its cover. The expected rate is therefore about 1.
    supporting_results: []
    validation_experiment_ids:
    - EXP-ECDLP-8a96c6
    falsification_condition: >-
      Family-W admission rate below 0.9. The preservation argument is FALSE, family W
      contributes nothing to the family-comparison prediction, and that must be STATED
      rather than the arm silently dropped.

  structural_ingredients:
  - description: >-
      The pinned EXP-SIG-006 / EXP-SIG-008 instrument, its greedy set-cover with
      seed_tag randomisation, its swap primitive and risk test, and its D6 column-set
      equality check.
    citation: experiments/EXP-SIG-008/SIG8_run.sage
    provenance: internal
    verified_by: >-
      In-repo instrument, read directly at the line references given in the parent
      proposal. Instrument sha256 identity with the pinned version is a required
      control.
    role: the object being calibrated and the source of every construction
  - description: >-
      The committed anchors this ensemble is regressed against - n equal to 9 deficit
      909 (EV-SIG-005/006), n equal to 12 rank 28,097, sr_pred 29,418, deficit 1,321,
      extra 1,322, rankK5 2,093, kernel 3,415, nrows 31,512, ncols 46,709
      (RUN-EXP-SIG-008-c raw.json).
    citation: EV-SIG-005, EV-SIG-006, EV-SIG-008
    provenance: internal
    verified_by: In-repo committed evidence records and run receipts, read directly.
    role: blocking regression targets

  reduction_chain:
    core_problem: null
    corollaries: []

  predictions:
  - metric: median extra_5 over the n equal to 9 K equal to 16 greedy (family G) ensemble
    direction: higher
    minimum_effect: >-
      At least 200 under E1; a median at most 100 falsifies the size-typical reading
      of the 369.
  - metric: IQR over median of extra_5 in the n equal to 9 family-G ensemble
    direction: lower
    minimum_effect: 'At most 0.5 under E1; at least 1.0 selects E2.'
  - metric: median pairwise support Jaccard within the n equal to 9 family-G ensemble
    direction: lower
    minimum_effect: >-
      At most 0.95 is required for the ensemble to be informative; at least 0.99
      selects E3 and makes E1 and E2 undecidable with this family.
  - metric: >-
      count of n equal to 12 samples with extra_5 greater than 0, reported separately
      for family G (of 16) and family W (of 16)
    direction: lower
    minimum_effect: >-
      0 in both under E1; at least 1 in EITHER family forces re-scoping of EV-SIG-008's
      0.0 percent support-induced, the sem's entire 1,321 D5 deficit is genuine.
  - metric: >-
      within-size Spearman rho between extra_5 and conc_5, computed separately at
      n equal to 9 and n equal to 12 and NEVER pooled
    direction: higher
    minimum_effect: >-
      |rho| at least 0.6 at n equal to 9 establishes a predictive admissibility
      criterion for future nulls; |rho| at most 0.2 leaves the confound mechanistically
      unexplained.
  - metric: >-
      absolute difference between median extra_5 in family G and in family W at
      n equal to 9
    direction: different
    minimum_effect: >-
      At most 50 indicates the effect is a property of column matching itself; at least
      150 indicates construction-procedure dependence and the family must be
      re-specified before further use.
  - metric: >-
      family-W admission rate - the fraction of walk samples whose D6 column set still
      equals the sem's
    direction: higher
    minimum_effect: >-
      At least 0.9, as predicted by the safe-pool plus risk-test argument; below 0.9
      falsifies that argument, voids family W's contribution to the family comparison,
      and is reported as an instrument finding rather than as evidence about extra_5.
  - metric: >-
      n_free_classes and n_forced_classes at each size - pool size against required
      count per (equation, monomial-degree) class
    direction: different
    minimum_effect: >-
      n equal to 9 is recorded as 36 free and 2 forced (RUN-EXP-SIG-006-c/-d); if
      n equal to 12 shows a materially higher forced fraction, E3 is the expected
      outcome at n equal to 12 and the 0-of-16 prediction there is weak evidence rather
      than strong.

  test_boundary:
    instances:
    - >-
      Boolean chained Semaev systems, m equal to t equal to 3 over GF(2^n), at
      n equal to 9 (ncols about 11,000 to 12,600) and n equal to 12 (sem D5 ncols
      46,709, nrows 31,512), D5 only.
    - >-
      Family G - K equal to 16 greedy constructions with distinct seed_tags per size.
    - >-
      Family W - K equal to 16 admissible-swap walk samples per size, walk length swept
      over at least two values.
    parameters:
      degree: 'D5 only; no closure engine and no D6 rank'
      sizes: 'n equal to 9 and n equal to 12'
      K_per_family_per_size: 16
      definitions_fixed_before_execution: 'conc_5, delta5_in, delta5_out and pairwise support Jaccard as defined in the parent proposal minimal_test'
      column_matching: 'enforced at D6 by set equality; NOT at D5, where equality is unsatisfiable'
    implementation: >-
      The pinned EXP-SIG-006 / EXP-SIG-008 instrument (SIG8_run.sage), with
      greedy_cover called at K distinct seed_tags and with the existing swap primitive
      driving family W. Instrument sha256 must match the pinned version.
    budget:
      wall_clock_seconds_total: 2700
      maximum_memory_gb: 2
      per_invocation_seconds: 240
      samples_per_invocation: 8

  distinguishable_outcomes:
  - outcome: >-
      Small within-size spread at both sizes, median pairwise Jaccard at most 0.95, and
      0 of 32 nonzero at n equal to 12.
    means: >-
      E1. The size-dependent reading stands, the 0.0 percent at n equal to 12 is robust
      across constructions, and the D at most 5 SIG conclusions keep their current
      strength. NOTE - this is the CONVENIENT outcome and its thresholds were fixed
      before any sample was drawn for exactly that reason.
  - outcome: >-
      Large n equal to 9 spread with IQR over median at least 1.0, or any nonzero
      extra_5 at n equal to 12 in either family.
    means: >-
      E2. Both share figures are single-construction artifacts, and every SIG D at most
      5 statement must be re-scoped to validated against one null construction. The
      families are reported separately so the source is attributable.
  - outcome: >-
      Median pairwise support Jaccard at least 0.99 in family G at n equal to 9.
    means: >-
      E3. The construction family cannot vary, so E1 and E2 are BOTH undecidable with
      it, the recorded 369 is a single point of a nearly deterministic construction, no
      share figure may be quoted from a single draw, and the correct next step is a
      WIDER admissible family rather than more seeds. This is the outcome the existing
      byte-identical RUN-006-c/-d D5 numbers most support.
  - outcome: >-
      The two families' median extra_5 differ by at least 150 at n equal to 9.
    means: >-
      The operative variable is the CONSTRUCTION PROCEDURE rather than column matching
      itself, and the column-matched null family must be re-specified before any
      further use anywhere in the program.
  - outcome: >-
      Family-W admission rate below 0.9.
    means: >-
      HEUR-SIGENS-2 is false - the safe-pool plus risk-test preservation argument does
      not hold. Family W contributes nothing to the family comparison, and this is
      reported as an INSTRUMENT finding rather than as evidence about extra_5.
  - outcome: >-
      Sem D5 anchors fail to reproduce at either size, or the two recorded n equal to 9
      constructions do not return 369.
    means: >-
      Instrument failure. No null statement may be made and the run yields no evidence
      in any direction.

  falsification_conditions:
  - >-
    Median extra_5 over the n equal to 9 family-G ensemble at most 100 - the claim that
    369 is a size-typical value is FALSE.
  - >-
    IQR over median of n equal to 9 family-G extra_5 at least 1.0 - E1 is falsified; the
    confound is trajectory-dependent and the recorded 40.6 / 0.0 percent pair is not
    interpretable as a size effect.
  - >-
    Any n equal to 12 sample in either family with extra_5 greater than 0 - the
    load-bearing half is falsified and EV-SIG-008's 0.0 percent support-induced, the
    sem's entire 1,321 D5 deficit is genuine must be re-scoped.
  - >-
    Median pairwise support Jaccard at least 0.99 in family G at n equal to 9 - E1 and
    E2 are BOTH undecidable with this family; the correct report is E3.
  - >-
    Family-W admission rate below 0.9 - the preservation argument is FALSE and family
    W's contribution is void.
  - >-
    Sem D5 anchors fail to reproduce at either size, or the two recorded n equal to 9
    constructions do not return 369 - instrument failure, no evidence.
  - >-
    At least 4 of 16 family-G samples fail D6 column-set equality - the generator is
    unreliable at that size and no support-share figure may be quoted from it.
  - >-
    The two families' medians differ by at least 150 at n equal to 9 - the claim that
    the effect is a property of column matching is falsified in favour of procedure
    dependence.

  prior_evidence_refs:
  - EV-SIG-005
  - EV-SIG-006
  - EV-SIG-008
  - DEC-20260724-003
  - EXP-SIG-006
  - EXP-SIG-008
  - IDEA-20260725-001
  - RQ-ECDLP-002

  interpretation_limits:
  - >-
    claim_tier toy - boolean chained Semaev m equal to t equal to 3 over GF(2^n) at
    n equal to 9 and n equal to 12 only. No prime-field and no crypto-scale statement.
  - >-
    This CALIBRATES THE BASELINE. Even a fully E1 outcome does not validate the cascade
    interpretation of the sem deficit; it only removes one alternative explanation for
    it.
  - >-
    Nothing here admits or inadmits any D6 quantity, and nothing here changes any
    hypothesis status - that is the Coordinator's authority.
  - >-
    A measured conc_5 correlation would be an empirical admissibility criterion for
    this instrument, not a theorem about semi-regularity.
  - >-
    The ensemble explores only the SAFE-POOL admissible set. A negative result bounds
    that family and says nothing about column-matched nulls built by a different
    admissible construction.
  - >-
    n equal to 9 is documented in EV-SIG-005 as an anomalous size (residual_4 equal to
    24 against law 7), so a large n equal to 9 spread might reflect that anomaly rather
    than construction noise. The n equal to 12 rung is the decisive one for that reason.
  - >-
    A censored rung is INCONCLUSIVE, not negative (AGENTS.md rule 5).
