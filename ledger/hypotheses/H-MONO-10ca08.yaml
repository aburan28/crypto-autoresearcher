  falsification_conditions:
    - >-
      The m=4/p=211/j=0 fixture does not reproduce. Stop; nothing else is
      interpretable.
    - >-
      j=0 or j=m-1 ever fails to split completely (with multiplicity) at
      the tested m, p, WITHIN EXP-MONO-7c653b's OWN SAMPLED CELLS. This
      would be a local anomaly relative to H-MONO-45183a's already-
      supported_scoped Part A and must be escalated, not absorbed
      quietly, even though it is out of scope for a general re-test here.
    - >-
      The twist-computed x(Q) disagrees with the direct-root x(Q) at any
      j=m-1 trial. Falsifies `mechanism` STEP 5's cost identity.
    - >-
      The deliberately wrong-rescaling-constant mutant construction ALSO
      reproduces x(Q) at a rate near 1.000. The exact-match test has no
      discriminating power and Stage 3's main result, however clean, is
      unsupported.
    - >-
      Any timeout, crash, or construction failure at any stage.
      failed_infrastructure per AGENTS.md rule 3, never negative evidence.
    - >-
      NOT a falsification condition of THIS record (inherited and already
      adjudicated by H-MONO-45183a / DEC-20260830-0f8def): any
      intermediate-j (1<=j<=m-2) complete splitting. EXP-MONO-7c653b does
      not sample intermediate j at all (by construction, Stage 1 draws
      j=0 and Stage 3/4a draw j=m-1 only), so it cannot observe this
      outcome; a reader must not read EXP-MONO-7c653b's silence on this
      point as confirmation.

  interpretation_limits:
    - >-
      NO ATTACK, NO EXPONENT MOVED, IN EITHER DIRECTION. Even if the
      twist cost identity holds exactly, D_trial(E) stays O(m) on both
      branches; the attempt count is unchanged and remains strictly worse
      than Pollard rho at every finite m.
    - >-
      TOY SCALE: p<=1009, m<=5. Object 1's general claim is addressed at
      larger scale (primes to 3000) and a larger curve panel by
      EXP-MONO-12ce1c; this record's own Stage 1/3/4a cells are a local
      sanity check on the SPECIFIC p=211/1009 curves, not an independent
      replication of the general claim.
    - >-
      This record does NOT supersede, duplicate, or change the status of
      IDEA-20260805-cf2d5a, H-MONO-45183a, EXP-MONO-12ce1c, H-MONO-40aca5,
      or EXP-MONO-805a02. No status change to any of those records is
      proposed or implied here (AGENTS.md rule 1, Coordinator authority
      alone).
    - >-
      The twist-arithmetic cost identity (STEP 5) is a HAND DERIVATION,
      believed correct but unverified by computation until EXP-MONO-7c653b
      Stage 3 runs.
    - >-
      Forward guidance, mandatory regardless of outcome: (a) whether an
      analogous twist trick extends to the PARTIAL locus (some
      coordinates on-curve, some off, none free) is untouched; (b) whether
      IDEA-20260830-d84f6a's own Stage-4b tau=4-vs-fixture paired
      comparison at p=211 specifically is still worth running, given
      EXP-MONO-12ce1c's own panel already covers tau=4 in aggregate, is
      left to a future Coordinator decision, not resolved here.

  superseded_design_for_reference: >-
    IDEA-20260830-d84f6a's own Stage 2 (full j=0..m-1 census at m in
    {4,5}, p in {211,1009}, n=500/200 per cell, multiplicity-aware,
    split_with_multiplicity AND split_distinct reported) and Stage 4b (the
    tau=4-vs-fixture nearest-object control for the genericity gap) are
