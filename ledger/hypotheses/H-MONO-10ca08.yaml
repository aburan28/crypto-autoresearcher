      reproduction_check: >-
        193/193 complete splitting via `harness/semaev.py`'s own
        `s4_expr`, cell for cell, using the SAME curve as
        KN-FIND-c41ea9's / EXP-MONO-805a02's own fixture (p=211, a=37,
        b=57). Per EXP-MONO-805a02's own disclosed protocol deviation,
        the literal 193 historical triples are not committed anywhere
