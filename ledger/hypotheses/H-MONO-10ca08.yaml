      root-coincidence rate across tau in {1,2,4}, j=0 only). It contains
      NO quadratic-twist, E_delta, or trace-zero-subgroup construction
      anywhere -- confirmed by reading the full specification, which never
      instantiates a twisted curve or a rescaling constant, and by the
      idea's own novelty_screen, which corpus-wide-grepped for "twist" and
      "trace-zero" and found no hit anywhere in this program outside
