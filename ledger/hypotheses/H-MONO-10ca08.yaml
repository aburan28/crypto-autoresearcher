  statement: >-
    PART A (Object 1, ALREADY SUPPORTED_SCOPED -- carried here for
    completeness and NOT re-tested by this record's own paired experiment;
    see the audit above). For the m-th Semaev summation polynomial
    S_m(x_1,...,x_{m-1},T) over E: y^2=f(x)=x^3+Ax+B over F_p, specialising
    each x_i to an F_p-rational on-curve x-coordinate ("residue") or an
    x-coordinate whose point is only defined over F_{p^2} ("non-residue"),
    writing j = #{i : f(x_i) is a non-residue}, the fibre splits completely
    over F_p iff j=0 or j=m-1; intermediate 1<=j<=m-2 does not split
    (modulo the genericity condition of HEUR-PARITY-2 below). This is
    H-MONO-45183a Part A / IDEA-20260805-cf2d5a Step 4, `supported_scoped`
    as of DEC-20260830-0f8def.

    PART B (Object 2, THE GENUINELY OPEN CLAIM THIS RECORD'S OWN PAIRED
    EXPERIMENT TESTS). On the j=m-1 locus, fixing a non-residue delta mod
    p, writing f(x_i)/delta = (y_i')^2 with y_i' in F_p, the point
    P_i = (x_i, sqrt(delta)*y_i') in E(F_{p^2}) satisfies Frob(P_i)=-P_i.
    The isomorphism (x,y') |-> (delta*x, delta^2*y') carries the auxiliary
    curve E': (y')^2 = f(x)/delta onto the standard quadratic twist
    E_delta: Y^2 = X^3 + A*delta^2*X + B*delta^3 -- an ordinary
    F_p-rational elliptic curve, already constructible with the existing
    `harness/toycurve.py` `EllipticCurve` class with no modification. The
    signed sum Q = sum eps_i*P_i can therefore be computed as
    R = sum eps_i*(delta*x_i, delta^2*y_i') using E_delta's ORDINARY
    F_p-rational Weierstrass addition law -- m-1 group additions, zero
    F_{p^2} arithmetic -- then x(Q) = X(R) * inverse(delta) mod p (one
    disclosed extra F_p multiplication). PREDICTED: this reproduces the
    direct polynomial-root x(Q) exactly, at cost m-1 additions plus one
    multiplication plus one O(1) lookup -- the SAME order as H-MONO-40aca5's
    D_trial(E)=m-1 for the j=0 branch.

  mechanism: >-
    Steps 1-4 (the fibre as points; Frobenius as the character vector; the
    parity law; the genericity gap) are IDEA-20260830-d84f6a's own
    re-derivation of IDEA-20260805-cf2d5a Step 4 / H-MONO-45183a Part A,
    carried here verbatim in substance and ALREADY EMPIRICALLY SUPPORTED
    per the audit above -- not re-tested by EXP-MONO-7c653b.

    STEP 5 (the twist-arithmetic cost identity for j=m-1, THE NEW
    COROLLARY THIS RECORD TESTS). On the j=m-1 locus every P_i has
    Frob(P_i)=-P_i, so every P_i is (x_i, sqrt(delta)*y_i') with y_i' in
    F_p. The map phi: (x,y') |-> (delta*x, delta^2*y') sends
    E': (y')^2=f(x)/delta to Y^2 = delta^3*f(X/delta) =
    X^3 + A*delta^2*X + B*delta^3 =: E_delta(X,Y) (verified by direct
    expansion: delta^3*((X/delta)^3+A*(X/delta)+B) =
    X^3+A*delta^2*X+B*delta^3). E_delta is the standard quadratic twist of
    E by delta, non-singular whenever E is (discriminant scales by
    delta^6). The composite map (x,y_i') |-> (x, sqrt(delta)*y_i') |->
    (delta*x, delta^2*y_i') is an isomorphism E' -> E_delta over
    F_p(sqrt(delta)) covering E' -> E over the same field via
    y = sqrt(delta)*y'; isomorphisms of elliptic curves commute with the
    group law over any field where they are defined. Hence
    R = sum eps_i*(delta*x_i, delta^2*y_i') computed on E_delta(F_p)
    equals the image of Q = sum eps_i*P_i, and x(Q) = X(R)*inverse(delta)
    mod p. HONEST STATUS: this algebraic derivation was worked by hand and
    is believed correct but was NOT machine-checked when this idea was
    written (the Idea Generator had no code-execution tool available).
    EXP-MONO-7c653b's Stage 3 is exactly the machine verification this
    step needs before any claim tier beyond "hand derivation, unverified
    by computation" is warranted.

  assumptions:
    - >-
      p > 3, E non-singular, and a fixed non-residue delta mod p is chosen
      once per p and shared across all j=m-1 constructions in a cell (a
      stable precomputed "twisted factor base", matching H-MONO-40aca5's
      own H2 convention for the on-curve factor base).
    - >-
      The m-1 fixed x_i are drawn with distinct x-values and f(x_i) != 0
      for all i (the ramified locus is excluded, matching KN-FIND-c41ea9's
      own scope statement).
    - >-
      `harness/semaev.py`'s `s3_expr`/`s4_expr` and `harness/toycurve.py`'s
      `EllipticCurve` are correct as already committed (re-verified only
      to the extent of EXP-MONO-7c653b's own Stage-1 fixture-reproduction
      hard gate; a new `s5_expr` function, built by one further resultant
      elimination in the identical pattern `s4_expr` already uses, is a
      required implementation task, not a mathematical assumption).
    - >-
      Object 1's genericity condition (HEUR-PARITY-2) is not re-tested by
      EXP-MONO-7c653b; its existing empirical support (M1=0 across
      EXP-MONO-12ce1c's tau in {1,2,4} panel) is relied on as-is, per the
      audit above, and this record does not schedule a Stage-4b-style
      tau=4-vs-fixture paired comparison.

  proof_search_map:
    bottleneck: >-
      Whether the twist-arithmetic isomorphism of `mechanism` STEP 5
      actually reproduces the direct polynomial root x(Q) at every tested
      j=m-1 configuration. If it does, the j=m-1 branch is cheap by the
      SAME mechanism class as j=0 (group arithmetic, no root-finding),
      completing H-MONO-40aca5's cost identity into a two-branch law with
      a unified mechanism. If it does not, the sign-convention or
