    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The j=m-1 signed-sum point Q, replaced by its quadratic-twist
          avatar R on E_delta(F_p), moving the computation from F_{p^2}
          arithmetic to F_p arithmetic on a different, standard curve.
        predicted_gain: >-
          Collapses the j=m-1 branch's per-attempt cost to m-1 group
          additions plus one multiplication -- the SAME asymptotic order
          as the j=0 branch, extending H-MONO-40aca5's cost identity.
    quantifier_order: >-
      FOR EVERY m in {4,5} and p in {211,1009}, AND FOR EVERY tuple
      (x_1,...,x_{m-1}) with j(tuple)=m-1 (all non-residue, distinct,
      f(x_i)!=0), the twist-computed x(Q) EQUALS the direct-root x(Q)
      (EXP-MONO-7c653b Stage 3's claim, bounded and falsifiable at every
      tested cell). NOT a claim about intermediate j (out of this record's
      scope; see the audit above) and NOT a claim beyond the tested
      (m,p) cells.
    method_ceiling:
      strongest_certifiable_claim: >-
        For the j=m-1 locus at m in {4,5}, p in {211,1009}, this record
        can certify (by exact computation, not statistics) that the
        branch admits an m-1-group-addition-plus-O(1) cost identity via
