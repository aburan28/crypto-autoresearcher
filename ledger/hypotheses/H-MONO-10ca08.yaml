    proof_obligations:
      - claim: "The m=4, p=211, a=37, b=57, j=0 fixture reproduces cell for cell (193/193)."
        responsibility: baseline
      - claim: >-
          The twist-computed x(Q) equals the direct-root x(Q) at every
