      distinct_preimage_search: >-
        FOUND, and resolved by the audit above: IDEA-20260805-cf2d5a's
        Object 1 (the full sign vector s), this record's Part A Object 1
        (its Hamming weight j), and EXP-MONO-12ce1c's own M1/M2 (cycle
        type as a function of the full character vector) all collide on
        the underlying mathematical claim tested at j=0/j=m-1; only
        EXP-MONO-12ce1c's execution decides that claim now. Object 2 (the
        twist-arithmetic cost identity) has no distinct preimage anywhere
