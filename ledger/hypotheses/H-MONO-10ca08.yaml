    observation_collision:
      observable: >-
        Per the audit above: EXP-MONO-12ce1c's cycle-type census (M1/M2/
        M3/M4, uniform sampling, F_{p^2}-native for j=m-1) and this
        record's own twist-arithmetic exact-match test (Stage 3, deliberate
