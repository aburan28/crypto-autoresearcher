    not_applicable_reason: null

  heuristic_assumptions:
    - id: HEUR-PARITY-1
      statement: >-
        No heuristic is required for the core containment: on the j=0 or
        j=m-1 locus, every sign-class value is Frobenius-fixed as a CLASS,
        unconditionally, for every non-singular E and every p>3.
      rigorous_support: >-
        Elementary Frobenius linearity plus the quadratic-character
        eigen-relation Frob(P_i)=chi(f(x_i))*P_i.
      validation_plan: >-
        ALREADY VALIDATED by EXP-MONO-12ce1c (M1=0/M2=1.000 exactly,
        multiply independently confirmed; see the audit above). Not
        re-tested by EXP-MONO-7c653b beyond its own Stage-1 hard gate.
      falsification_condition: >-
        A single j=0 or j=m-1 tuple failing to split completely with
        multiplicity, at any tested m, p.
      validation_experiment_ids: [EXP-MONO-12ce1c]
    - id: HEUR-PARITY-2
      statement: >-
        FOR a sampled (m-1)-tuple with intermediate j, no signed subset
        sum of the corresponding points lies in E[2] -- the genericity
        condition necessary for "intermediate j never splits" to hold
        LITERALLY. Under independent-uniform sampling this fails with
        probability of order tau/N (H-MONO-45183a Part B, tau=#E(F_p)[2]).
      rigorous_support: >-
        H-MONO-45183a's B-1/B-2 collision criterion and probability
        derivation.
      validation_plan: >-
        SUBSTANTIALLY, THOUGH NOT IDENTICALLY, ADDRESSED by
        EXP-MONO-12ce1c's own tau in {1,2,4} panel: M1=0 exactly across
        that whole panel (including at least one tau=4 curve, a hard
        precondition for that contract's own Stage 3) means no
        genericity-gap violation was observed at any sampled intermediate
        j on any tested tau value. This is not IDEA-20260830-d84f6a's own
        Stage-4b paired tau=4-vs-fixture comparison at p=211 specifically,
        and is not repeated by EXP-MONO-7c653b; treated here as adequate
        existing evidence for this record's own scope (Object 2 only). A
        future record MAY still run the exact paired comparison at p=211
        if a reviewer judges the existing panel's tau/N regime
        insufficiently resolved at that specific small p.
      falsification_condition: >-
        Not re-opened by this record. Inherited from H-MONO-45183a, whose
        Part A status (supported_scoped) already accounts for this.
      validation_experiment_ids: [EXP-MONO-12ce1c]
    - id: HEUR-PARITY-3
      statement: >-
        The quadratic-twist isomorphism of `mechanism` STEP 5 -- E' ->
        E_delta via (x,y')|->(delta*x,delta^2*y'), covering E'->E via
        y=sqrt(delta)*y' -- commutes with the group law, so the
        twist-computed x(Q) equals the direct-root x(Q) at every j=m-1
        tuple.
      rigorous_support: >-
        Standard elliptic-curve theory: any isomorphism of Weierstrass
        curves over a field extension is a morphism of group schemes and
        commutes with addition (RECALLED, general theory, e.g. Silverman
        AEC III.1, not fetched in this session -- see IDEA-20260830-d84f6a
        `citations`). The specific discriminant/coefficient-scaling
        identity was independently re-derived by direct expansion.
      validation_plan: >-
        GENUINELY UNTESTED. EXP-MONO-7c653b Stage 3, all j=m-1 cells,
        m in {4,5}, p in {211,1009}, n=500 (m=4) / n=200 (m=5) per cell.
        Stage 4a's wrong-rescaling-constant mutant is the paired
        proves-too-much control.
      falsification_condition: >-
        Any j=m-1 trial where the twist-computed x(Q) differs from the
        direct-root x(Q). THE SINGLE MOST CONSEQUENTIAL POSSIBLE OUTCOME
        OF THIS RECORD'S OWN PAIRED EXPERIMENT: it falsifies STEP 5's
        hand-derived cost identity, meaning the sign-convention or
        isomorphism step has an error the derivation missed. This is a
        VALID, REPORTABLE, NON-CATASTROPHIC outcome for the run itself
        (the run is successful if it detects and reports the mismatch
        cleanly) even though it would be a significant negative result
        for this record's own central claim.
      validation_experiment_ids: [EXP-MONO-7c653b]

  predictions:
