    disposition_object_2_twist_cost_identity: >-
      GENUINELY OPEN, CONFIRMED UNTESTED. EXP-MONO-12ce1c's treatment_b
      (the only place it does group-law arithmetic on signed sums) is
      restricted to j=0 (on-curve, F_p-rational) tuples and uses E's own
      ordinary addition law -- it never constructs a quadratic twist, and
      it never handles a j=m-1 (all-non-residue) tuple via any group-
