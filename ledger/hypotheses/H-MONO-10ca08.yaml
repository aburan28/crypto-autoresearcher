      via the Path-1 signed-sum-in-F_{p^2} / Path-2 polynomial-
      factorization dual check, never via an F_p-rational twist avatar).
      No record in this program uses quadratic-twist or trace-zero-
      subgroup arithmetic anywhere (idea's own corpus-wide grep,
      independently re-checked here by grep of `ledger/`, `experiments/`,
      and `knowledge/` for "E_delta", "quadratic twist", "trace-zero
