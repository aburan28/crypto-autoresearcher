    baseline_embedding:
      parameter_slice: >-
        KN-FIND-c41ea9's / H-MONO-40aca5's / EXP-MONO-805a02's own
        committed m=4, p=211, a=37, b=57, j=0 fixture (193
        specialisations, 193/193 complete splitting) is the exact
        parameter slice EXP-MONO-7c653b's Stage 1 must reproduce before
