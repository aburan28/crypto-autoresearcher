hypothesis:
  id: H-SSIQ-055a36
  question_id: RQ-SSIQ-9702af
  title: >-
    The memory lever is ONE object: every rebuild-and-shard scheme is dominated by van Oorschot-Wiener
    by exactly the shard count S, so memory below p^{1/3} at time p^{1/3} requires a streaming
    RECOGNISER for the codomain set C(E) -- and no pre-registered cheap predicate separates C(E) from
    a shape-matched null beyond the derived, factor-about-2 midpoint bias
  statement: >-
    Write N = p^{1/3+o(1)} for the claw size and let a candidate cost be (time, memory) =
    (N^alpha, N^mu); van Oorschot-Wiener golden-collision search satisfies time^2 x memory = N^3, so a
    candidate beats the whole VW family exactly when 2 alpha + mu < 3, and the incumbent sits at
    (1, 1), ON that curve. THE HYPOTHESIS HAS THREE SEPARABLE PARTS. (S1, ARITHMETIC, NO COMPUTE) Any
    REBUILD-AND-SHARD scheme -- partition the list into S parts by a predicate and run S regenerating
    passes -- costs time S N and memory N/S, hence 2 alpha + mu = 3 + log_N S > 3 for every S > 1:
    EVERY such scheme is dominated by VW by exactly a factor S in the invariant time^2 x memory, with
    equality only at S = 1. This covers both admissible shard predicates: the multiplicative degree
    (which forces an S^2 pair sweep because the split of delta_E is unknown) and any
    Frobenius-equivariant function of the codomain (which shards the claw consistently but still loses,
    because generation cannot be restricted to a shard: Algorithm 1 produces list elements BY
    EXTENSION, not by address). (S2, REDUCTION) Consequently mu < 1 at alpha = 1 is EXACTLY the
    existence of a streaming recogniser for C(E) = { j(cod psi) : psi in L(E,X,B) }, and no other route
    survives S1. (S3, MEASURED) No member of the pre-registered predicate family separates C(E) from
    the SHAPE-MATCHED null C(E'') at corrected AUC at least 0.55 with a bootstrap interval excluding
    0.5, replicated at three primes and DECAYING in the list radius X -- beyond the one derived bias
    delta_{E'} <= delta_E, whose magnitude under the conjugate-degree density law is about 0.46 in
    density, a CONSTANT FACTOR and not an exponent. NO EXPONENT IS CLAIMED TO MOVE.
  mechanism: >-
    Let the list have N entries and let D_1..D_S partition the codomain space. Pass i regenerates the
    list at cost N and stores only entries with codomain in D_i, so after S passes time is S N and
    memory N/S, giving the invariant (S N)^2 (N/S) = S N^3 against VW's N^3. The accounting is exact
    and needs no heuristic beyond partition balance, which is itself measured. A shard predicate must
    be evaluable on a list entry at unit cost AND must not split the claw pair; the pair shares only
    (i) the product of their degrees, which is delta_E and is unknown, and (ii) the Frobenius orbit of
    their codomains, since cod(chi) = cod(psi)^{(p)}. That classifies the AVAILABLE predicates -- those
    computable from the codomain j alone -- and not all conceivable ones. If instead a streaming
    recogniser R for C(E) exists, answering membership in time c and memory m after preprocessing, the
    algorithm becomes: stream L once, query R at cod(psi)^{(p)}, stop at the first hit, giving
    (alpha, mu) = (1 + log_N c, log_N m). C(E) is N vertices inside p/12, so a trivial recogniser
    stores it and an information-theoretic floor for an exact one is |C(E)| log(p/N) bits unless C(E)
    is compressible; a ONE-SIDED filter suffices because false positives are cheap and false negatives
    are fatal, which is exactly the regime where a small measured bias could become a saving and where
    an uncontrolled bias becomes an artifact. THE ONE DERIVABLE PRE-RUN SIGNAL: if phi = eta o psi is
    the minimal conjugate isogeny split at E' = cod(psi), then psi^{(p)} o dual(eta) : E' -> E'^{(p)}
    has degree deg(eta) deg(psi) = delta_E, so delta_{E'} <= delta_E -- THE MIDPOINT LIVES IN A STRATUM
    NO HIGHER THAN THE INSTANCE'S OWN. That is a theorem; only its MAGNITUDE as a discriminating
    advantage depends on the density law.
  assumptions:
    - >-
      The list is regenerable at cost N per pass, i.e. Algorithm 1's cost is dominated by the number of
      entries. This is the basis of the shard accounting; a generator with a cheaper restart would
      change the S factor and must be EXHIBITED rather than assumed.
    - >-
      The codomain map is essentially injective on L at these parameters, so |C(E)| = N^{1-o(1)}.
      Expected within-list collisions number about N^2/p. NOTE THE CONSEQUENCE, which is a fact worth
      recording rather than an assumption: a codomain collision WITHIN the single list is itself a
      non-scalar endomorphism of E, so the incumbent has a second success channel; its probability is
      N^2/p = X^4/p, which equals 1 only at X = p^{1/4}, i.e. it is exactly classical
      meet-in-the-middle and contributes p^{-1/3} at the incumbent's parameters. A measured collision
      rate above N^2/p is either a bug or a discovery and neither may be silently absorbed.
    - >-
      The shard partitions are balanced. Unbalanced partitions change the S accounting and are measured
      rather than assumed.
    - >-
      The recogniser reduction preserves correctness: streaming L and querying R at cod(psi)^{(p)}
      finds the claw whenever R has no false negatives on C(E).
    - >-
      A recogniser whose PREPROCESSING stores N entries is the incumbent wearing a different name. The
      memory bound must be on the recogniser's persistent state, not on its query-time working set.
  proof_search_map:
    bottleneck: >-
      The claw step's table: the step that forces memory equal to time. Removing it -- achieving mu < 1
      at alpha = 1 -- would move the frontier that VW currently owns and would answer the open problem
      the frozen source states at line 39.
    baseline_embedding:
      parameter_slice: >-
        S = 1 in the shard accounting reproduces the incumbent exactly (time N, memory N,
        2 alpha + mu = 3); w = N in the VW formula reproduces the same point, which is the check that
        the two accountings agree at their common endpoint; w = poly(log p) reproduces p^{1/2+o(1)},
        the unconditional tier.
      reproduction_check: >-
        SYMBOLIC AND FROZEN: a fixture evaluating (S N)^2 (N/S) and sqrt(N^3/w)^2 w and asserting
        S N^3 and N^3 respectively, plus the two endpoint values. Any candidate scheme must be
        evaluated by the SAME fixture, so a scheme cannot be reported as an improvement without being
        placed on the same axis as VW.
    observation_collision:
      observable: >-
        The output of a candidate membership predicate on a curve j, i.e. the claimed certificate "j is
        in C(E)".
      distinct_preimage_search: >-
        THE COLLISION IS THE HEART OF THE DESIGN AND IS SEARCHED FOR BY CONSTRUCTION: C(E) and C(E'')
        for an independent random E'' are two distinct ground-truth objects, one on each side of the
        conclusion ("recognises THIS instance's codomain set" versus "recognises reachable sets in
        general"). A predicate that cannot separate them has collided and is DISQUALIFIED as a
        recogniser even if it separates C(E) from a uniform random subset. This is why the
        shape-matched null is primary and the uniform null is only a diagnostic.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "reduce the memory of the claw" by the single decision problem "recognise membership
          in C(E) in sublinear memory", via the streaming reduction.
        predicted_gain: >-
          No cost gain claimed. The gain is that the memory lever becomes ONE falsifiable object with a
          null and a calibration, instead of a family of schemes each needing separate refutation -- and
          the shard accounting already refutes that family wholesale by an S factor.
      - transform: observable_fiber
        proposed_object: >-
          Hold a candidate predicate's verdict fixed and vary the forgotten structure (which curve E
          generated the set). The intrinsic invariant that must distinguish the resulting objects is
          E-dependence itself; a predicate with none is in the fibre and is useless.
        predicted_gain: >-
          A disqualification rule available before any compute, applied to every member of the
          pre-registered predicate family.
    quantifier_order: >-
      There EXISTS a recogniser family R_E, computable from E in time N and memory m(N), such that FOR
      ALL supersingular E and FOR ALL F, R_E(F) answers "F in C(E)" with no false negatives, in time c.
      THE ORDER IS THE TRAP: R is ALLOWED to depend on E -- that is the whole content -- but its MEMORY
      m must be sublinear in N uniformly over E, and its preprocessing may not itself store the list. A
      recogniser whose preprocessing keeps N entries is the incumbent renamed, and this quantifier
      order is where that substitution would hide.
    method_ceiling:
      strongest_certifiable_claim: >-
        "No member of the pre-registered predicate family separates C(E) from C(E'') by more than the
        derived midpoint bias, at the tested primes and sample sizes." That is a statement about ONE
        finite family of cheap statistics of j at toy scale. It is NOT a statement that C(E) is
        incompressible and may never be cited as one; in particular it says nothing about recognisers
        using quaternion-side data.
      nearby_object_control: >-
        THE F_p LOCUS. For the sub-problem where the target stratum is {delta = 1}, a perfect
        O(1)-memory recogniser DOES exist ("is j in F_p?"), so the hoped-for conclusion "no sublinear
        recogniser exists" is KNOWN FALSE at that nearby object. Any measurement that cannot distinguish
        {delta = 1} from C(E) has not identified the load-bearing structure, and the battery must be run
        against the F_p locus as a POSITIVE control where a predicate must score AUC 1.0.
    proof_obligations:
      - claim: "Rebuild-and-shard has time^2 x memory = S N^3, hence 2 alpha + mu = 3 + log_N S."
        responsibility: memory
      - claim: >-
          The claw's two members lie in the same shard for any Frobenius-invariant codomain predicate,
          and in a known shard PAIR for the degree predicate.
        responsibility: correctness
      - claim: >-
          Streaming plus a false-negative-free recogniser R yields time N c and memory m.
        responsibility: runtime
      - claim: "delta_{E'} <= delta_E for the true claw midpoint E'."
        responsibility: size
      - claim: >-
          Under the conjugate-degree density law the induced midpoint bias has magnitude
          (delta_E/(p/2)^{1/3})^{3/2}, a constant factor and not an exponent.
        responsibility: success_probability
      - claim: >-
          The classification of admissible shard predicates covers predicates computable from the
          codomain j alone, and no others.
        responsibility: scope
    not_applicable_reason: null
  asymptotic_claim:
    problem: >-
      The memory exponent of the claw step in the p^{1/3+o(1)} supersingular endomorphism algorithm, at
      unchanged time.
    prior_best: >-
      p^{1/3+o(1)} time AND memory conditional on Heuristic 1; p^{1/2}(log p)^{O(1)} time at polynomial
      memory unconditionally; and the whole VW curve sqrt(N^3/w) between them, which is what any
      candidate must actually beat. Full cost under Wiener 3D wiring: MITM Otilde(p^{2/3}), VW
      Otilde(p^{1/2}).
    time_exponent: >-
      p^{1/3+o(1)}, UNCHANGED. Nothing here changes the time exponent or claims anything about it.
    memory_exponent: >-
      TARGET: strictly below p^{1/3+o(1)} at unchanged time, i.e. mu < 1. NOT CLAIMED, NOT ACHIEVED,
      and the MODAL EXPECTED OUTCOME of the measurement is that no candidate appears. What is delivered
      unconditionally is the exclusion of the whole rebuild-and-shard family by an exact S factor and
      the reduction of the remaining space to one object.
    hidden_cofactor: >-
      The incumbent's o(1) is SUPERPOLYNOMIAL by its author's own disclosure and is not assumed smaller
      for any candidate. Additionally disclosed: any streaming or low-memory variant pays Theta(log X)
      modular-polynomial steps per element where an extension-based build pays Theta(1) amortised -- a
      (log p)-cofactor multiplying the VW curve and every candidate alike, so it does not change which
      side of 2 alpha + mu = 3 anything falls on, but a concrete-cost table omitting it is wrong by
      that factor.
    claim_kind: constant_factor
  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        CODOMAIN EQUIDISTRIBUTION (the assumption this hypothesis is designed to TEST rather than to
        rely on). For a uniformly random supersingular E and parameters (X, B) with
        |C(E)| <= |V|/10, the set C(E) is indistinguishable from a uniformly random subset of the same
        size of the supersingular vertex set, by any statistic computable from the j-invariants alone
        in time poly(log p) per element, up to the derived midpoint bias delta_{E'} <= delta_E.
      random_model_justification: >-
        RIGOROUS SIDE: the supersingular ell-isogeny graph is Ramanujan (Pizer, RECALLED and unverified
        in this program), so a non-backtracking walk of length Theta(log p) has total-variation distance
        o(1) from stationary, and C(E) is a set of endpoints of smooth walks of length Theta(log X), so
        each individual endpoint is close to stationary. THE CLASSICAL STATEMENT IT IMITATES: that a set
        of N such endpoints behaves like N independent uniform draws -- a PAIRWISE-INDEPENDENCE claim
        that mixing does NOT supply, and that gap is precisely what is measured.
      supporting_results:
        - >-
          Pizer, Ramanujan graphs and Hecke operators. RECALLED and unverified here;
          IDEA-20260815-1cc763 owns the spectral-gap question and this record defers to it.
        - >-
          The O(log p) re-randomisation mixing statement quoted internally at line 193 of
          inputs/P13-WESOLOWSKI-2026/paper_fulltext.md.
      validation_experiment_ids:
        - EXP-SSIQ-0c559e
      falsification_condition: >-
        Any pre-registered predicate reaching corrected AUC at least 0.55 against the shape-matched null
        at three primes with a bootstrap interval excluding 0.5 and an advantage DECAYING in X.
    - id: H2
      formal_statement: >-
        MIDPOINT BIAS MAGNITUDE. Under the conjugate-degree density law, the probability that a generic
        curve satisfies delta <= delta_E equals (delta_E/(p/2)^{1/3})^{3/2}, so the derived midpoint
        constraint delta_{E'} <= delta_E confers a discriminating advantage of exactly that size and no
        more.
      random_model_justification: >-
        The inequality delta_{E'} <= delta_E is RIGOROUS and derived by composition. Only its MAGNITUDE
        as an advantage depends on the density law, which is the numbered heuristic of a companion
        record with its own validation route.
      supporting_results:
        - >-
          The conjugate-degree density law Pr[delta <= T] = Theta(T^{3/2} p^{-1/2}), stated as H1 of
          IDEA-20260821-e99afd, provenance internal.
      validation_experiment_ids:
        - EXP-SSIQ-0c559e
      falsification_condition: >-
        A measured generic rate outside [0.35, 0.60] at typical delta_E with the density-law calibration
        passing, or ANY sampled midpoint violating the inequality delta_{E'} <= delta_E.
  structural_ingredients:
    - description: >-
        The incumbent's memory obstacle, its claw formulation at two sets of size N = p^{1/3+o(1)}, the
        VW tradeoff sqrt(N^3/w), and the open problem "it is currently unclear how to reduce the memory
        cost without increasing the time"; Algorithm 1's build BY EXTENSION of stored entries, which is
        the fact making shard-restricted generation impossible; Lemma 3.3's cost accounting; and
        Algorithm 2's table keyed by codomain and looked up at (E')^{(p)}.
      citation: >-
        inputs/P13-WESOLOWSKI-2026/paper_fulltext.md lines 39, 137-152, 154, 162-175
      provenance: internal
      verified_by: idea-generator session 2026-08-21, lines 1-240 read directly
      role: the object being analysed and the frontier being compared against
    - description: >-
        Wiener 3D wiring full cost = step count x S^{1/3} for a shared table of S entries, so a
        high-memory algorithm pays a wiring penalty a polynomial-memory one does not.
      citation: KN-TECH-057
      provenance: internal
      verified_by: idea-generator session 2026-08-21, read in full
      role: full-cost asymmetry, which makes the memory lever MORE valuable than step counts show
    - description: >-
        One-sided approximate membership: a filter with false-positive rate q on N elements needs about
        N log2(1/q) bits, so a CONSTANT q buys a constant factor and only q = N^{-Omega(1)} could move
        mu.
      citation: >-
        Standard Bloom-filter / approximate-membership bound; no specific source is asserted by this
        program.
      provenance: recalled
      verified_by: null
      role: the yardstick preventing a constant-factor filter being reported as a memory-exponent gain
  reduction_chain:
    core_problem: >-
      Reducing the memory exponent of the claw step at unchanged time exponent.
    corollaries:
      - problem: >-
          A quantum costing of the claw step, which needs pointwise membership rather than a
          materialised table.
        reduction_ref: >-
          No published reduction is cited. The recogniser reduction is exactly the interface such a
          costing would need, so a positive outcome here would feed that lane; that is a pointer, not a
          transfer.
        asymptotics_preserved: null
  predictions:
    - metric: shard_invariant_ratio
      direction: higher
      minimum_effect: >-
        FORCED VALUE exactly S, for every S > 1, in a MEASURED toy implementation as well as in the
        derivation. If a measured implementation returns anything other than S, the accounting is wrong
        and the closure is withdrawn.
    - metric: best_predicate_auc_vs_shape_matched_null
      direction: higher
      minimum_effect: >-
        FORCED NULL VALUE 0.5. A candidate requires corrected AUC at least 0.55 with a bootstrap
        interval excluding 0.5, replicated at three primes, AND decaying in X. Anything below is
        reported as a bounded negative WITH the resolution stated.
    - metric: acceptance_density_q_and_fitted_exponent
      direction: lower
      minimum_effect: >-
        Only q = N^{-c} for a fitted c > 0 STABLE ACROSS PRIMES moves mu; a constant q is a
        constant-factor memory saving and must be reported as such. Pre-registered so that a constant
        cannot later be presented as an exponent.
    - metric: midpoint_delta_inequality_rate
      direction: higher
      minimum_effect: >-
        FORCED VALUE 1.00 for planted claw midpoints (it is a theorem; a violation is an instrument bug)
        against about 0.46 for generic list codomains under the density law. The gap is the instrument's
        calibrated yardstick.
    - metric: within_list_codomain_collision_count
      direction: different
      minimum_effect: >-
        FORCED VALUE about N^2/p, essentially zero at toy scale. A count materially above it is either a
        bug or the second success channel behaving unexpectedly, and either must be reported rather than
        absorbed.
    - metric: shard_balance_ratio
      direction: different
      minimum_effect: >-
        FORCED VALUE 1 + o(1) for the Frobenius-invariant predicates if codomains are equidistributed in
        the F_p-coordinates. A materially unbalanced partition would change the S accounting and is
        itself a structure finding.
  test_boundary:
    instances:
      - Three primes with log2 p in [20, 40], with L(E,X,B) and C(E) built exactly
      - >-
        The shape-matched null C(E'') for an independent uniformly random supersingular E'', at matched
        cardinality and matched degree profile
      - A uniform random subset of the vertex set at matched size, as an instrument diagnostic
      - The F_p-rational locus, as a positive control where a trivial predicate must score AUC 1.0
      - Planted claw midpoints, for the derived-bias calibration
      - A rebuild-and-shard implementation at S in {1, 4, 16}
    parameters:
      primes: three, with log2 p in [20, 40], declared before any run
      list_radii_X: three declared values
      predicate_family: >-
        pre-registered and fixed before any data is seen: (a) F_p-coordinate (Tr(j), Nm(j)) marginal and
        joint histograms; (b) the delta-statistic (exact distance-to-conjugate) of the codomain; (c) for
        ell in {2,3,5}, the root-count pattern of the modular polynomial over F_{p^2}; (d) the
        Frobenius-orbit-quotient occupancy vector; (e) a supervised baseline (regularised logistic
        regression and one gradient-boosted model) on the concatenation of (a)-(d) plus raw
        F_p-coordinate bits
      degeneracy_gate: "|C(E)| at most 0.1 |V|, mandatory"
      shard_counts: [1, 4, 16]
      multiple_comparison_correction: fixed in advance over predicates x nulls x primes x radii
    implementation: >-
      Exact construction of L(E,X,B) and C(E) at toy primes; the predicate battery evaluated with strict
      held-out splitting BY CURVE (not by sample) for the supervised arm; AUC reported with a bootstrap
      interval and the pre-registered multiple-comparison correction; a toy rebuild-and-shard
      implementation measured against the symbolic invariant.
    budget:
      wall_clock_seconds: 10800
      cpu_hours: 8.0
      maximum_memory_gb: 16
      maximum_runs: 24
  falsification_conditions:
    - >-
      A rebuild-and-shard implementation measures an invariant ratio other than S. The closure is
      WITHDRAWN and the accounting must be redone; this would be the most consequential negative
      available, since the closure is the part that stands without any experiment.
    - >-
      A predicate achieves corrected AUC at least 0.55 against the SHAPE-MATCHED null, replicated at
      three primes, with a bootstrap interval excluding 0.5 and the advantage DECAYING in X. C(E) is
      then recognisable at some level, the memory lever is OPEN, the modal expectation is refuted, and
      the candidate goes straight to a costed (alpha, mu) evaluation against 2 alpha + mu < 3.
    - >-
      The planted-midpoint calibration fails to recover the derived bias. The battery has no power at
      the scale of an effect that is PROVABLY present, so every negative it reports is void and must be
      reported as an instrument limit, never as a closure.
    - >-
      Any sampled midpoint has delta_{E'} > delta_E. The two-line composition derivation is wrong -- a
      transcription error -- and it is included precisely because such errors are the ones that survive
      review.
    - >-
      A reader exhibits a memory-reduction scheme that is neither rebuild-and-shard nor
      recogniser-based and that achieves 2 alpha + mu < 3. The classification is incomplete and this
      hypothesis is superseded with the wider family.
  distinguishable_outcomes:
    bounded_negative_with_resolution: >-
      No pre-registered predicate beats the shape-matched null, the F_p positive control scores AUC 1.0,
      and the planted-midpoint calibration recovers the derived bias. MEANING: a MEASURED OBSTRUCTION
      with a stated resolution floor, closing recognition-based memory reduction WITHIN THE TESTED
      FAMILY of cheap statistics of j. It is not a statement that C(E) is incompressible.
    recogniser_candidate_found: >-
      A predicate reaches corrected AUC at least 0.55 against the shape-matched null at three primes,
      interval excluding 0.5, decaying in X. MEANING: the memory lever is open; report the acceptance
      density q and its fitted exponent c and score the candidate against 2 alpha + mu < 3 before any
      other statement.
    constant_factor_only: >-
      A predicate shows a real advantage but with acceptance density q CONSTANT across primes. MEANING:
      a constant-factor memory saving, explicitly NOT an exponent improvement. The pre-registered
      q-exponent test exists so the two cannot be conflated later.
    reachable_set_ness_only: >-
      A predicate scores 0.5 against the shape-matched null but high against the uniform null. MEANING:
      it recognises reachable-set-ness rather than THIS instance's set; it is DISQUALIFIED as a
      recogniser, which is exactly the observation collision the design searches for.
    shard_closure_withdrawn: >-
      The measured shard invariant ratio is not S. MEANING: the arithmetic closure is wrong; withdraw it
      and redo the accounting. This is the most consequential negative available.
    instrument_without_power: >-
      The planted-midpoint calibration fails, or the F_p positive control does not score AUC 1.0.
      MEANING: INVALID. Every negative from the battery is void and must be reported as an instrument
      limit.
    toy_scale_degenerate: >-
      |C(E)| exceeds 0.1 |V| at a prime. MEANING: the degeneracy gate fires; every AUC at that prime is
      meaningless and is not reported.
  interpretation_limits:
    - >-
      NO EXPONENT IS CLAIMED TO MOVE, and nothing here suggests that a p^{1/4} algorithm over F_{p^2}
      exists, is likely, or is nearly obtained. The target is the memory exponent at unchanged time and
      the modal expected outcome is a bounded negative.
    - >-
      THE SHARD CLOSURE IS SCOPED to rebuild-and-shard schemes and to shard predicates computable from
      the codomain alone. It closes no other route, and what remains open is explicit: recognisers using
      E-dependent quaternion-side data rather than statistics of j; generators restrictable to a shard
      without regeneration; and any scheme in which the two claw sides are not both materialised.
    - >-
      TOY SCALE IS TOY SCALE. An AUC measured at 2^40 bounds nothing at 2^250; the deliverable is "no
      bias above resolution r at the tested primes", with r reported.
    - >-
      CONDITIONAL TIERS ARE INHERITED. The incumbent point (1, 1) is conditional on Heuristic 1 and the
      midpoint bias's magnitude is additionally conditional on the density law. The unconditional tier
      remains p^{1/2}(log p)^{O(1)} at polynomial memory, and beating only that tier is not an
      improvement.
    - >-
      A CONSTANT-FACTOR MEMORY SAVING IS NOT A MEMORY-EXPONENT IMPROVEMENT, and the pre-registered
      q-exponent test exists so the two cannot be conflated later.
    - >-
      The projection to C(E) forgets MULTIPLICITY, so it cannot see the second success channel (a
      within-list codomain collision is itself an endomorphism). Any record using this projection must
      import that channel separately rather than concluding it does not exist.
