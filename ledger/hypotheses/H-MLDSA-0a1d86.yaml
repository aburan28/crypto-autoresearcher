  falsification_conditions:
    - The estimator does not recover the derived forced values on the positive arm within its interval and the tabulated residual.
    - The finite-sample floor exceeds the rate being estimated at some parameter set; only a sample-size statement is then reportable there.
    - The structural null arm returns a nonzero distance or non-identical transcripts where the rate is derived to be exactly zero.
    - Some predicate's omission changes the emitted law by more than its firing rate, refuting the identity as applied.
    - The rate census measures the vanishing predicate firing above the experiment's sensitivity, withdrawing the crossover table.
    - The graded sweep is non-monotone in the rate.
  interpretation_limits:
    - >-
      NOT A BREAK, NOT A FORGERY, NOT A WEAKNESS IN ML-DSA AS STANDARDIZED. Every object is emitted
      by a party holding the signing key. Nothing bears on the underlying lattice problems in any
      direction, and any downstream sentence readable as such is defective regardless of what was
      measured.
    - >-
      The bound covers an adversary that sees SIGNATURES. It says nothing about timing, power,
      emissions, memory or the attempt count, where an omitted check is plainly visible; that is a
      different goal's territory and the boundary is stated rather than assumed.
    - >-
      The named term is an upper bound on the ADVANTAGE DIFFERENCE, not a claim that a particular
      quantity is or is not recovered. "The omitting signer leaks at most N times p_R" must never be
      restated as "the secret cannot be recovered".
    - >-
      The vanishing-rate row is CONDITIONAL on an inherited heuristic at one parameter set and
      unconditional at the others, and the two must never be reported at the same strength.
    - >-
      The published fault-attack result that motivates the reconciliation was read as an ABSTRACT
      ONLY in the parent proposal. If the test it prevents is not one of the first-stage conjuncts,
      the reconciliation is wrong and only the identity survives.
    - >-
      The identity is elementary and may well already appear in the rejection-sampling literature.
      If so this is a rediscovery and must be reported as one; novelty is explicitly unverified.
