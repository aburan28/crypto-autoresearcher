# H-ECTD-3e7660 — specified from IDEA-20261005-1b41d9.
# Protocol approval is DEC-20261006-8d65cc. This record asserts nothing
# about the invariant-factor pairs. No group was decomposed in this design.
hypothesis:
  id: H-ECTD-3e7660
  question_id: RQ-ECTD-001
  source_proposal: IDEA-20261005-1b41d9
  goal_id: null
  goal_id_note: >-
    ledger/questions/RQ-ECTD-001.yaml does not name a goal. GOAL-ECTD-001
    lists that question. This design does not attach the goal, does not
    edit the goal head, and does not claim a lane.
  status: approved
  status_note: >-
    approved means the measurement protocol in EXP-ECTD-e1ccaf is approved
    for a later executor. It does not mean the invariant-factor pairs
    differ. Status moves only by DEC-20261006-8d65cc under the standing
    user authorization of 2026-09-06. No invariant factor was computed in
    this design.
  proposed_by: coordinator
  conversion_note: >-
    The pair comparison, the same-trace rational 2-isogeny, the
    non-square-free order, the scaling control, and the prediction that
    the invariant-factor pairs differ are carried from
    IDEA-20261005-1b41d9. The Coordinator named the prime and both curves
    by a point-count and j-invariant scan. That scan is instance
    selection. The invariant factors themselves were not computed.

  statement: >-
    TEST BOUNDARY. The named prime is p = 5. The source curve is
    E: y^2 = x^3 + x + 2 over F_5. Its first rational point of order 2,
    the least root of x^3 + x + 2, is (4, 0). The Vélu codomain of that
    kernel is E2: y^2 = x^3 + x over F_5. The design-session point count
    gives both curves order N = 4 and trace t = 2, and gives j(E) = 1
    and j(E2) = 3. Write E(F_5) congruent to Z/n1 x Z/n2 and E2(F_5)
    congruent to Z/m1 x Z/m2 with n2 dividing n1, m2 dividing m1, and
    both products equal to N. The pre-registered prediction is
    (n1, n2) != (m1, m2). Equal pairs are a negative. This is one
    isomorphism-type comparison on one isogeny. It is not a trapdoor
    and it does not change an ECDLP exponent.

    DISTINGUISHABLE OUTCOMES. (1) The executor recomputes the selection
    census and lands on this same pair, the trace, kernel, and scaling
    controls pass, and the pairs differ in at least one coordinate: the
    type is not fixed by the trace on this edge. (2) The same controls
    pass and the pairs are equal: negative. (3) An earlier model in the
    scan qualifies, the recomputed order is square-free, the traces
    differ, the kernel misses the identity, or the scaling
    y^2 = x^3 + x + 3 changes the source pair: invalid, not evidence.
    (4) A timeout or a missing dependency: failed_infrastructure, not
    evidence.

  mechanism: >-
    The computed objects are the two invariant-factor pairs of the
    rational points on the two ends of one F_5-rational 2-isogeny. For
    an abelian group of order 4 and rank at most 2, the only pairs
    (n1, n2) with n2 dividing n1 and n1*n2 = 4 are (4, 1) and (2, 2).
    That alphabet is group theory of the order. It is not an observation
    of either curve. Disagreement means the isomorphism type of E(F_5)
    is not fixed by the trace on this edge. Agreement means this edge
    does not witness that variation. Neither outcome is a trapdoor and
    neither is a private discrete logarithm.

  assumptions:
    - The selection rule below returns (p, a, b) = (5, 1, 2) with codomain (a2, b2) = (1, 0). The executor recomputes the census. An earlier qualifying model makes the run invalid.
    - E(F_p) has rank at most 2, so one pair with the second factor dividing the first describes it.
    - The Vélu codomain is the short-Weierstrass model y^2 = x^3 + x over F_5 before the group is enumerated.
    - The design session computed point counts and j-invariants only. It did not compute invariant factors. The prediction is fixed before that decomposition.

  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
    not_applicable_reason: >-
      This is a measurement of two invariant-factor pairs on one
      isogeny. It is not a proof, an asymptotic bound, a certificate
      family, a reduction, or a closure argument.

  asymptotic_claim:
    problem: none — no complexity improvement is claimed
    prior_best: unchanged; no ECDLP baseline is moved
    time_exponent: unchanged
    memory_exponent: unchanged
    hidden_cofactor: none introduced
    claim_kind: not_applicable

  heuristic_assumptions:
    - id: HA-1
      formal_statement: >-
        On this one accepted pair, the codomain isomorphism type imitates
        a uniform draw among the rank-at-most-2 abelian groups of order
        N = 4 whose second invariant factor divides p - 1 = 4. The two
        candidates are (4, 1) and (2, 2). The uniform draw is the
        imitation. The sample is one isogeny at p = 5. No transfer to a
        second volcano is claimed.
      random_model_justification: >-
        A rational 2-isogeny induces a surjective homomorphism of
        rational points whose kernel has order 2, so the image is
        isomorphic to a quotient of E(F_5) by a subgroup of order 2 and
        the codomain has the same order N when the isogeny is defined
        over F_5. Elliptic curves over a prime field have rank at most 2.
        This design session did not decompose either group. Sample size
        one has no tail.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECTD-e1ccaf
      falsification_condition: >-
        The controls pass and (n1, n2) equals (m1, m2), or a recorded
        second factor fails to divide both the first factor and p - 1,
        or the two orders are not both 4.

  predictions:
    - metric: number of coordinates in which (n1, n2) and (m1, m2) differ
      direction: different
      minimum_effect: 1

  test_boundary:
    instances:
      - id: p5-ordinary-2-isogeny
        prime: 5
        source_model: "y^2 = x^3 + x + 2"
        source_coefficients: [1, 2]
        kernel_point: [4, 0]
        codomain_model: "y^2 = x^3 + x"
        codomain_coefficients: [1, 0]
        common_order_from_point_count: 4
        trace_from_point_count: 2
        j_source: 1
        j_codomain: 3
        note: >-
          These figures are the design-session point-count and
          j-invariant census. They are not invariant factors.
    parameters:
      prime: 5
      prime_cap: 64
      isogeny_degree: 2
      coefficient_range: "a, b in {0, 1, ..., p-1}"
    implementation: >-
      Recompute the selection census by exact point counts and Vélu,
      then enumerate both groups and record invariant factors. No
      floating point. No rho. No division-polynomial root is a metric.
      No invariant factor was computed while specifying this record.
    budget:
      maximum_runs: 2
      note: >-
        One scientific execution on the frozen pair. maximum_runs 2
        allows one infrastructure retry under a new run id. The
        scientific object is frozen at p = 5 and these two models.

  falsification_conditions:
    - The controls pass and (n1, n2) equals (m1, m2).
    - The scaling model y^2 = x^3 + x + 3 changes the source pair. That outcome invalidates the enumerator. It is not a difference of the two isogeny ends.
    - No accepted pair exists for odd p <= 64 under the frozen selection rule. That outcome means the named instance was wrong. It is invalid, not a negative on the pairs.

  interpretation_limits:
    - A difference on this edge shows that the trace does not fix the isomorphism type on this edge. It does not exhibit a discrete-log weakness and it is not a trapdoor.
    - Equality on this edge fails to witness variation. It does not prove the type is a class invariant for every curve of this trace.
    - This measurement does not change an ECDLP exponent. No discrete logarithm is computed. Matched rho on a group of order 4 is not run.
    - RQ-ECTD-001 caps toy meters below a certified sub-rho solve. This record stays under that cap. Toy scope only: p = 5.

  citations:
    - ref: IDEA-20261005-1b41d9
      provenance: internal
      claim: >-
        Across the first ordinary same-trace rational 2-isogeny whose
        point count is not square-free, the invariant-factor pairs of
        the two curves differ. Equal pairs are the idea's negative. The
        idea does not claim a trapdoor or an ECDLP algorithm.
      verified_by: >-
        coordinator design session 2026-10-06 read the proposal bytes
        from origin/design/hyper-fb6ec7-richelot, blob
        681ca7f5a3bc726cad3e56de61cae67085263c70, copied unchanged to
        ledger/proposals/IDEA-20261005-1b41d9.yaml
    - ref: RQ-ECTD-001
      provenance: internal
      claim: >-
        The question asks whether a rare endpoint-specific weakness can
        vary inside an ordinary isogeny class over a prime field. Toy
        meters stay below a certified sub-rho solve and are not reported
        as a crypto-scale trapdoor.
      verified_by: >-
        coordinator design session 2026-10-06 read
        ledger/questions/RQ-ECTD-001.yaml
