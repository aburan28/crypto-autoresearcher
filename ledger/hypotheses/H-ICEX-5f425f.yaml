hypothesis:
  id: H-ICEX-5f425f
  question_id: RQ-ICEX-001
  source_idea_id: IDEA-20260815-6f09d5
  title: >-
    THE LANE'S DECISION TARGET IS A STATISTICAL QUESTION BEFORE IT IS A
    QUESTION ABOUT INDEX CALCULUS- a four-rung log-log cost ladder spanning
    one decade in N, at the per-point log-cost noise the lane's own toy runs
    exhibit, produces a slope interval too wide to separate 1/2 from 1/3, so
    RQ-ICEX-001's decision target is unreachable as currently specified and
    the required ladder length is a computable number nobody has computed
  statement: >-
    (A) THE DECISION TARGET, QUOTED. RQ-ICEX-001 asks whether a charged toy
    index-calculus operation exponent alpha has a confidence interval that
    EXCLUDES 1/2. That is a statement about a fitted slope and its interval,
    and it is answerable or unanswerable BEFORE any cost is measured, as a
    function of three things only- the number of rungs L, the span of the
    ladder in ln N, and the per-point standard deviation sigma of ln(cost).
    (B) THE CLAIM, STATED WITH ITS ARITHMETIC SO IT CAN BE CONTRADICTED. For
    an ordinary least-squares fit of ln(cost) on ln(N) with L equally spaced
    rungs over a span S in natural-log units and homoscedastic per-point
    noise sigma, the slope standard error is
    SE = sigma / (sqrt(L) * sd(x)), where sd(x) is the population standard
    deviation of the rung positions. At L = 4 equally spaced over a ladder
    spanning one decade in N (S = ln(10) = 2.303), sd(x) is about 0.858, so
    SE is about sigma / 1.716. At sigma = 0.10 that is SE about 0.058, and a
    95 percent interval on L - 2 = 2 degrees of freedom carries t about 4.30,
    giving a half-width of about 0.25. The separation to be resolved is
    |1/2 - 1/3| = 1/6 = 0.167. THE HALF-WIDTH EXCEEDS THE SEPARATION, so a
    four-rung one-decade ladder at sigma = 0.10 CANNOT distinguish 1/2 from
    1/3 at 95 percent confidence.
    (C) THE PRE-REGISTERED PREDICTION. Simulation will show the empirical
    power of a 4-rung, one-decade, sigma = 0.10 ladder to exclude 1/2 when
    the truth is 1/3 is BELOW 0.80. FALSIFIED if the simulated power is at or
    above 0.80. The hand arithmetic above is accurate to about 1 percent in
    the half-width; THE SIMULATION IS THE AUTHORITY and any disagreement
    above 10 percent is a transcription error corrected by a superseding
    record.
    (D) THE DELIVERABLE, WHICH IS A DESIGN NUMBER AND NOT A VERDICT. The
    required ladder length L*(sigma, span) at which the empirical power
    reaches 0.80, tabulated per noise level and per span, and compared
    against whatever ladder the lane can afford. If L* exceeds the affordable
    ladder at every plausible sigma, the decision target is unreachable AS
    SPECIFIED and must be restated before money is spent - which is a
    budget-saving negative and the outcome with the highest campaign value.
    (E) WHAT THIS IS NOT. It is a simulation about MEASUREMENT DESIGN. It
    produces no evidence about index calculus, no exponent, no comparison,
    and nothing about elliptic curves. Every object in it is synthetic; there
    is no curve anywhere in the experiment, which is how the standing
    curve-free-null requirement is discharged - by construction, and with the
    consequence that no result here may be phrased as a statement about
    curves.
  mechanism: >-
    WHY THE FIT'S RESOLVING POWER IS PRIOR TO THE MEASUREMENT. A confidence
    interval that excludes 1/2 requires the interval to be narrower than the
    distance from the estimate to 1/2. The interval's width is set by the
    design (L, span) and the noise, not by which algorithm generated the
    cost. So the lane can learn, at seconds of compute, whether its planned
    measurement can answer its own question - and if it cannot, every hour
    spent on SDEG, MONO and RELN buys an interval that will contain 1/2 no
    matter what index calculus does.
    WHY THE NOISE MODEL DOES ALL THE WORK, AND WHY IT IS SWEPT RATHER THAN
    ASSUMED. SE scales linearly in sigma, so a record fixing one noise level
    would be nearly worthless- halving the assumed sigma halves the required
    interval and can turn an unreachable design into a reachable one on
    paper. sigma is therefore swept over a declared range and the answer is
    reported PER LEVEL. Where sigma can be estimated from existing toy runs
    it is, and the estimate's own weakness is disclosed- variance typically
    grows with problem size and existing runs concentrate at the smallest
    sizes, so an estimate drawn from them systematically UNDERSTATES the
    noise at the rungs that drive the fit, which is the direction that would
    let an under-powered measurement proceed.
    WHY THE TWO NULLS ARE NOT OPTIONAL. A fitting procedure that excludes 1/2
    more often than its nominal rate when the truth IS 1/2 manufactures
    positives, and a procedure that resolves an exponent from pure noise is
    broken. Both are cheap to check and both are blocking, because the
    deliverable L* is meaningless from a procedure that fails either.
  assumptions:
    - >-
      MEASURED QUANTITIES AND THEIR UNITS- L is a COUNT OF RUNGS
      (dimensionless integer); the span is in NATURAL-LOG UNITS OF N; sigma
      is the standard deviation of ln(cost) and is therefore DIMENSIONLESS;
      power and false-exclusion rate are DIMENSIONLESS PROBABILITIES
      estimated as fractions of replicates. The fitted slope is dimensionless
      PROVIDED both axes use the same logarithm base, which the harness
      asserts.
    - >-
      The cost curve is a power law over the tested range. THIS IS THE LANE'S
      OWN MODELLING ASSUMPTION AND IS INHERITED, NOT TESTED HERE. If the true
      curve is not a power law over the range, the fitted exponent is not the
      quantity anyone thinks it is and this record's L* is answering a
      different question.
    - >-
      Per-point noise is homoscedastic in ln(cost) in the base case. A
      heteroscedastic arm with variance growing in ln N is run as a
      sensitivity, because that is the realistic direction and it is the
      direction that raises L*.
    - >-
      The estimator is ordinary least squares on ln(cost) against ln(N) with
      a Student-t interval on L - 2 degrees of freedom. Any other estimator
      the lane intends to use is a DIFFERENT design and must be simulated
      separately; L* is not portable across estimators.
    - >-
      NO CURVE, NO GROUP, NO COST MEASUREMENT of any kind occurs. All data
      are synthetic.
  proof_search_map:
    bottleneck: >-
      The width of the slope interval relative to |1/2 - 1/3|. The exact
      quantity whose reduction changes the lane's answerability is
      SE = sigma / (sqrt(L) * sd(x)), and the only levers on it are L, the
      span, and sigma.
    baseline_embedding:
      parameter_slice: >-
        ANALYTIC SLICE- for homoscedastic Gaussian noise the OLS slope
        interval has a closed form, so the simulation must reproduce the
        analytic SE at every (L, span, sigma) cell.
      reproduction_check: >-
        The simulated slope standard deviation across replicates must match
        sigma / (sqrt(L) * sd(x)) within 3 percent at every cell with at
        least 10^4 replicates. A systematic mismatch means the simulator or
        the estimator is wrong and the whole grid is void; this is a
        known-answer test of the instrument, not a finding.
    observation_collision:
      observable: >-
        The fitted exponent alone.
      distinct_preimage_search: >-
        COLLISION EXHIBITED, AND IT IS THE LANE'S PROBLEM IN MINIATURE. The
        same point estimate alpha-hat = 0.42 is produced by a true 1/2 with
        wide noise and by a true 1/3 with wide noise; the two are
        distinguished only by the INTERVAL, and at the planned design the
        interval does not distinguish them. A reported exponent without its
        interval and its design (L, span, sigma) is therefore not an
        identifying observation, and every exponent this lane reports must
        carry that triple.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The power function of the lane's own decision rule, as an explicit
          three-parameter family (L, span, sigma), inverted to give
          L*(sigma, span) at power 0.80.
        predicted_gain: >-
          Prices the ladder before the lane commits to it. NO EXPONENT IS
          CLAIMED OR MOVED.
    quantifier_order: >-
      CLAIMED. FOR ALL sigma >= 0.10 and FOR ALL spans of one decade or less,
      a 4-rung ladder has power below 0.80 to exclude 1/2 when the truth is
      1/3. NOT CLAIMED- anything about the actual cost of index calculus;
      anything about non-power-law cost curves; anything about estimators
      other than the declared OLS-with-t-interval; and anything about
      elliptic curves, since no curve appears anywhere in the experiment.
    method_ceiling:
      strongest_certifiable_claim: >-
        'Under the declared noise model, span and estimator, a ladder of L
        rungs achieves power P to exclude 1/2 when the truth is 1/3, and
        L*(sigma, span) rungs are needed for P = 0.80.' It can NEVER certify
        the true noise level of the lane's runs, that the cost curve is a
        power law, or anything about what the measurement would find.
      nearby_object_control: >-
        THE TRUTH-IS-1/2 OBJECT, on which the conclusion 'the interval
        excludes 1/2' is KNOWN FALSE. The procedure must exclude 1/2 there at
        no more than its nominal rate. A procedure that excludes 1/2 at an
        elevated rate on that object proves too much and manufactures the
        lane's positive result.
    proof_obligations:
      - claim: >-
          The simulator reproduces the analytic slope SE within 3 percent at
          every cell.
        responsibility: baseline
      - claim: >-
          The false-exclusion rate under the truth-is-1/2 null is at its
          nominal level within Monte Carlo error.
        responsibility: correctness
      - claim: >-
          The pure-noise null resolves no exponent.
        responsibility: correctness
      - claim: >-
          L*(sigma, span) is reported per noise level and never at a single
          assumed sigma.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-ICEX-POW-1
      formal_statement: >-
        The per-point standard deviation of ln(cost) in the lane's toy runs
        is well approximated by the variance observed in existing runs of the
        same shape, and is approximately constant across the ladder.
      random_model_justification: >-
        The rigorous ingredient is that existing toy runs supply an empirical
        variance estimate at the sizes they cover. THE GAP- variance
        typically grows with problem size, and existing runs concentrate at
        the SMALLEST sizes, so an estimate drawn from them systematically
        understates sigma at the rungs that dominate the fit. That is the
        direction that would let an under-powered measurement proceed, which
        is why sigma is swept rather than estimated once and why a
        heteroscedastic arm is run.
      supporting_results:
        - ref: RQ-ICEX-001
          provenance: internal
          claim: >-
            That the lane's decision target is a charged exponent whose
            confidence interval excludes 1/2, which is the statistic whose
            resolving power this hypothesis prices.
          verified_by: >-
            coordinator, TASK-20260904-e87737 (question record read in full)
      validation_experiment_ids:
        - EXP-ICEX-ff3e13
      falsification_condition: >-
        A measured per-point variance at the largest available ladder rung
        exceeding the value extrapolated from the smaller rungs by more than
        a factor 2. Then sigma is not constant across the ladder, the
        homoscedastic base case understates L*, and the heteroscedastic arm
        becomes the reportable one.
  structural_ingredients:
    - description: >-
        The closed-form standard error of an ordinary-least-squares slope,
        SE = sigma / (sqrt(L) * sd(x)), and the Student-t interval on L - 2
        degrees of freedom.
      citation: elementary regression theory; no external source relied on
      provenance: internal
      verified_by: coordinator, TASK-20260904-e87737
      role: the analytic baseline the simulator must reproduce
    - description: >-
        The lane's decision target as RQ-ICEX-001 states it, and its blocking
        constraints.
      citation: RQ-ICEX-001
      provenance: internal
      verified_by: coordinator, TASK-20260904-e87737
      role: the statistic whose resolving power is priced
  reduction_chain:
    core_problem: >-
      The statistical power of the lane's own decision rule as a function of
      ladder length, ladder span and per-point noise.
    corollaries: []
  predictions:
    - metric: >-
        P1- empirical power to exclude 1/2 at 95 percent confidence when the
        truth is 1/3, DIMENSIONLESS PROBABILITY, at L = 4 rungs, one-decade
        span, sigma = 0.10
      direction: lower
      minimum_effect: >-
        PRE-REGISTERED BELOW 0.80. The hand computation gives an interval
        half-width of about 0.25 against a separation of 0.167. A simulated
        power at or above 0.80 FALSIFIES the hypothesis and means the planned
        ladder is adequate, which is a real and useful result.
    - metric: >-
        P2- false-exclusion rate under the truth-is-exactly-1/2 null,
        DIMENSIONLESS PROBABILITY, over at least 10^4 replicates per cell
      direction: different
      minimum_effect: >-
        FORCED at the nominal 0.05 within Monte Carlo error (0.05 +/- 0.005
        at 10^4 replicates). A rate above 0.075 means the fitting procedure
        is over-confident and would manufacture a positive for the lane; the
        grid is then void.
    - metric: >-
        P3- resolvability under the pure-noise null (cost independent of N),
        as the fraction of replicates whose slope interval excludes 0
      direction: different
      minimum_effect: >-
        FORCED at the nominal 0.05. Any materially elevated rate means the
        procedure resolves an exponent from noise and is broken.
    - metric: >-
        P4- required ladder length L*(sigma, span) at power 0.80, a COUNT OF
        RUNGS
      direction: different
      minimum_effect: >-
        THE DELIVERABLE, tabulated per sigma in {0.02, 0.05, 0.10, 0.20,
        0.40} and per span in {half a decade, one decade, two decades}, with
        Monte Carlo error bars. Compared against the lane's affordable
        ladder; if L* exceeds it at every plausible sigma, the decision
        target is unreachable as specified.
    - metric: >-
        P5- instrument response- the simulated slope standard deviation
        against the analytic SE = sigma / (sqrt(L) * sd(x))
      direction: different
      minimum_effect: >-
        FORCED within 3 percent at every cell, and the simulated SE must
        scale LINEARLY in sigma (a 4x increase in sigma must widen the
        half-width by 4x +/- 5 percent). An interval insensitive to sigma
        means the estimator is not wired to the noise and voids the grid.
  test_boundary:
    instances:
      - >-
        None. Every data point is synthetic and drawn from a declared
        generative model; NO CURVE, NO GROUP AND NO COST MEASUREMENT OCCURS
        ANYWHERE IN THIS HYPOTHESIS.
    parameters:
      L: '2, 3, 4, 5, 6, 8, 10, 12, 16 rungs'
      span: 'half a decade, one decade, two decades in N'
      sigma: '0.02, 0.05, 0.10, 0.20, 0.40 in natural-log units of cost'
      true_exponent: '1/3 (power arm), 1/2 (false-exclusion null), 0 with constant mean (pure-noise null)'
      noise_shape: 'homoscedastic base case; heteroscedastic sensitivity arm with sigma growing linearly in ln N'
      replicates: 'at least 10^4 per cell'
    implementation: >-
      Pure Python with numpy, a declared pseudo-random generator and a
      recorded seed sequence; ordinary least squares on ln(cost) against
      ln(N) with a Student-t interval on L - 2 degrees of freedom. Seconds of
      compute.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 0.25
      maximum_memory_gb: 8
      maximum_runs: 4
  falsification_conditions:
    - >-
      F1. Simulated power at L = 4, one decade, sigma = 0.10 is at or above
      0.80. The hypothesis is falsified, the planned ladder suffices, and the
      lane's design is confirmed cheaply.
    - >-
      F2. The truth-is-1/2 null excludes 1/2 above 0.075. The fitting
      procedure is over-confident; the grid is void and the lane must not use
      that estimator.
    - >-
      F3. The pure-noise null yields a resolvable exponent above the nominal
      rate. The procedure is broken; void.
    - >-
      F4. The simulated SE departs from the analytic form by more than 3
      percent, or fails to scale linearly in sigma. Instrument failure- an
      infrastructure outcome under AGENTS.md rule 5, never a statistical
      finding.
    - >-
      F5. L*(sigma, span) at every plausible sigma is at or below the lane's
      affordable ladder. The design is sound and this record confirms it at
      seconds of compute.
    - >-
      F6. L* exceeds the affordable ladder at every plausible sigma. THE
      DECISION TARGET IS UNREACHABLE AS SPECIFIED and must be restated before
      the three blocked measurement lanes are funded. This is the
      budget-saving negative and the highest-value outcome available here.
  interpretation_limits:
    - >-
      A SIMULATION ABOUT MEASUREMENT DESIGN. It produces NO evidence about
      index calculus, no exponent, no comparison, and nothing about elliptic
      curves - and since no curve appears anywhere in it, the standing
      curve-free-null requirement is discharged by construction, with the
      consequence that no result here may be phrased as a curve statement.
    - >-
      CONCLUSIONS BIND THE ASSUMED NOISE MODEL AND THE POWER-LAW FORM. If the
      cost curve is not a power law over the tested range, L* answers a
      different question than the lane is asking.
    - >-
      L* IS NOT PORTABLE ACROSS ESTIMATORS. It is computed for OLS with a
      Student-t interval; a different estimator is a different design and must
      be simulated separately.
    - >-
      A SUFFICIENT-LADDER RESULT IS ABOUT RESOLVING POWER, NOT ABOUT WHAT THE
      MEASUREMENT WILL FIND. Adequate power says the question is answerable,
      never what the answer is.
    - >-
      NOISE UNDERESTIMATION IS THE DANGEROUS DIRECTION. An estimate of sigma
      drawn from the smallest existing runs understates it at the rungs that
      drive the fit, which is exactly the direction that would let an
      under-powered measurement proceed; the sweep and the heteroscedastic
      arm exist for that reason and their results travel with L*.
  status: proposed
  proposed_by: coordinator
  proposed_at: '2026-09-04'
  specified_under_task: TASK-20260904-e87737
  id_allocation_provenance: >-
    H-ICEX-5f425f was pre-allocated by the tasking Coordinator session and
    supplied in TASK-20260904-e87737's constraints, verified free across the
    identifier union before use. This agent has no shell and allocated no
    identifier.
  yaml_parse_disclosure: >-
    Written by a Coordinator subagent without an interpreter; every prose
    value is a folded block scalar or a quoted scalar; no tabs; no duplicate
    keys to the author's reading. The orchestrating session must run the
    strict parse and tools/validate_ledger.py before this record is relied
    on.
