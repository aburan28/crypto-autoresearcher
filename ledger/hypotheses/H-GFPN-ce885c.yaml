# H-GFPN-ce885c
# Exhaustive m=3 side table over F_{q^3}. The n=1 pair-sum contracts
# are a different slice and are not edited.
hypothesis:
  id: H-GFPN-ce885c
  question_id: RQ-GFPN-c01af8
  goal_id: GOAL-GFPN-380702
  source_idea: IDEA-20261004-31991f
  experiment_id: EXP-GFPN-76a1cd
  specified_at: '2026-10-05'
  status: approved
  proposed_by: coordinator
  approved_by_decision: DEC-20261005-031527
  title: >-
    At n=3 and m=3 the side-1 subsum of a rational three-point sum
    is K-rational 2-torsion, and type (c) is absent when f has no
    root in K
  statement: >-
    Let q be 5, 7, or 11. Let L be F_q[z] modulo x^6 + x + 2 when
    q is 5 or 11, and modulo x^6 + 2 when q is 7. Let K be the
    subfield fixed by the q^3-power Frobenius. Let theta be the
    trace z^k + (z^k)^{q^3} for the first k in (1, 2, 4, 3, 5)
    whose trace is outside F_q. Those traces are the coefficient
    lists [0, 2, 3, 4, 2, 1], [0, 0, 2], and [0, 6, 10, 4, 6].
    The torsion model is y^2 = x^3 + x. The root-free model is
    y^2 = x^3 + x + B with B = c0 + c1 theta, (c0, c1) equal to
    (1, 1), (6, 1), and (0, 1) at q = 5, 7, 11. A design-session
    enumeration, which is not a run, gives side-0 and side-1
    abscissae in F_q, and for every nondecreasing triple from
    their union and every sign pattern with first sign positive,
    classifies sums that land in E(K) or in the kernel of
    Frobenius-plus-one. Lemma violations are 0 on all six cells.
    Type (c) counts on the torsion model are 0, 15, and 39. Type
    (c) counts on the root-free model are 0, 0, and 0. At q=5
    the torsion model has no side-0 abscissa, so its type (c)
    count is 0 for that reason.
  mechanism: >-
    The side of an F_q abscissa is the Legendre symbol of the
    norm from K to F_q of f(x). Frobenius over K fixes a side-0
    point and negates a side-1 point. Subtracting a landed
    relation from its conjugate forces the side-1 subsum into
    E(K)[2] when the sum is K-rational. A nonzero 2-torsion
    subsum is type (c), and it cannot occur when f has no root
    in K.
  assumptions:
    - n is 3 and m is 3. Repeats are allowed. The first sign is fixed positive.
    - Factor-base abscissae are the elements of F_q with f(x) nonzero.
    - One square root in L is chosen per abscissa. Relative signs absorb the other root.
  proof_search_map:
    bottleneck: >-
      Whether every landed three-point sum on these six cells
      has its exceptional subsum inside E(K)[2].
    baseline_embedding:
      parameter_slice: >-
        IDEA-20261004-31991f names this n=3 table as the
        reproduction check. The n=1 pair-sum contracts are a
        smaller slice and are not this table.
      reproduction_check: >-
        The product formula for the norm and the power
        a^{1+q+q^2} must assign the same sides. Left-to-right
        and right-to-left addition must return the same sum.
    observation_collision:
      observable: >-
        The side vector of a triple together with the type of
        a landed sum.
      distinct_preimage_search: >-
        A landed sum whose side-1 subsum is outside E(K)[2],
        or a type (c) sum on the root-free model.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: the side bit of each factor-base abscissa
        predicted_gain: >-
          Classifies landed sums into types (a), (b), and (c).
          No index-calculus exponent moves.
    quantifier_order: >-
      For each prime, for each model, for each nondecreasing
      triple, for each of the four sign patterns.
    method_ceiling:
      strongest_certifiable_claim: >-
        A complete classification of these finite tables. Not a
        cost for EcGFp5 or EcMasFp5.
      nearby_object_control: >-
        The root-free model at the same primes. Its type (c)
        count is 0. The q=5 torsion model has an empty side-0
        set, so it does not by itself show that torsion produces
        type (c).
    proof_obligations:
      - claim: Lemma violations are 0 on all six cells
        responsibility: correctness
      - claim: Type (c) is 0, 15, 39 on the torsion model and 0 on the root-free model
        responsibility: size
      - claim: The two norm formulas assign the same sides
        responsibility: interface
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        These six tables do not transfer to a Gaudry cost at
