hypothesis:
  id: H-ECDLP-a3598b
  question_id: RQ-ECDLP-002
  source_idea_id: IDEA-20260905-3e9133
  title: First-order torsion-section deformation jet and its transformation laws
  statement: For a finite prime-to-p torsion section of a smooth short-Weierstrass family over k[epsilon]/epsilon^2,
    p>3 and A0 invertible, the first coefficient of F=x^2/A is invariant under the active unit model scaling
    and covariant under epsilon->c epsilon pullback. It vanishes for a constant family up to model scaling.
    Etaleness alone does not imply vanishing of this coefficient for a varying family. The proposal's
    interpretation is restricted to ordinary special fibers; elementary identities also admit separately
    labeled smooth auxiliary controls without this restriction.
  mechanism: The explicit coefficient J=2*x0*x1/A0-x0^2*A1/A0^2 cancels the model gauge terms but retains
    dependence on the family tangent. Uniqueness of a torsion section across a nilpotent thickening is
    separated from constancy of its coordinates in a varying family. An explicit flex family supplies
    a proposed known-false control for an overbroad zero-derivative rule.
  assumptions:
  - k is a field of characteristic p>3; the audit uses only first-order dual numbers.
  - A0 and the special-fiber discriminant are invertible.
  - The section is finite, nonidentity, and killed by n>1 with p not dividing n.
  - Ordinary special fibers are required for the originating proposal's tested stratum.
  - The active model action is x'=u^2*x,y'=u^3*y,A'=u^4*A,B'=u^6*B.
  - The parameter convention is pullback epsilon->c*epsilon, c nonzero, not inverse passive renaming.
  predictions:
  - metric: exact_jet_expansion_failures
    direction: different
    minimum_effect: All applicable symbolic residuals and all 96 planned finite rows vanish exactly.
  - metric: gauge_and_parameter_law_failures
    direction: different
    minimum_effect: J'=J under active gauge and J_pullback=c*J under pullback.
  - metric: constant_and_pure_gauge_nonzero_jets
    direction: different
    minimum_effect: Zero nonzero jets in all 64 constant or pure-gauge rows.
  - metric: varying_flex_jet
    direction: different
    minimum_effect: J=-6 before pullback and -6*c after pullback in all 32 varying rows.
  test_boundary:
    instances: 'Four fixed primes 7,11,13,17, three explicitly defined section families, four active gauges,
      two parameter pullbacks: 96 exact finite rows. Four ordinary-eligibility checks, four invalid-input
      rejection fixtures, and six universal certificate groups; no scalar targets or DLP benchmark.'
    parameters:
      characteristic_panel:
      - 7
      - 11
      - 13
      - 17
      truncation_order: 1
      torsion_order: 3
      gauge_u0:
      - 1
      - 2
      gauge_v:
      - 0
      - 1
      parameter_c:
      - 1
      - 2
      synthetic_base:
        A: 3
        B: -11
        x: 3
        y: 5
      varying_family: s=5+epsilon; A=6*s-27; B=s^2-18*s+54; P=(3,s)
      ordinary_rule: p does not divide t=p+1-#E(F_p); cross-check Hasse invariant
    implementation: Future exact dual-number arithmetic and a separately written coefficient implementation,
      plus symbolic certificates and a scoped lemma argument. No implementation or experiment is authorized
      by this design.
    budget:
      future_proposed_wall_clock_seconds: 1200
      future_proposed_memory_gb: 2
      future_proposed_maximum_runs: 1
      authorized_design_maximum_runs: 0
  falsification_conditions:
  - A valid independently checked in-scope example violates the declared gauge or pullback identity.
  - A correctly lifted constant-family section has nonzero J after the declared gauge action.
  - The stated flex certificate or scoped lemma fails under its exact declared hypotheses.
  interpretation_limits:
  - No ECDLP algorithm, scalar recovery, canonical-lift advantage, or cryptographic-scale transfer is
    claimed.
  - Equal-characteristic dual numbers are not identified with Witt vectors or a characteristic-zero canonical
    lift.
  - Nonzero coordinate response does not contradict the scoped IDEA-109 expectation about finite invariant
    jets and level structure.
  - Passing synthetic controls does not establish novelty, useful scalar information, or injectivity;
    P and -P collide.
  - Ineligible fibers, unproved lemmas, implementation failures and budget exhaustion do not refute the
    hypothesis.
  - No conclusion about ordinary fibers is supported by auxiliary nonordinary controls alone.
  proof_search_map:
    bottleneck: Separate unique etale section lifting from fixed-coordinate constancy as the ambient family
      varies.
    baseline_embedding:
      parameter_slice: A1=B1=x1=y1=0, with and without u=1+epsilon active model scaling.
      reproduction_check: Recover F0=x0^2/A0 and J=0 independently from direct and coefficient arithmetic.
    observation_collision:
      observable: The first jet J together with its parameter pullback law.
      distinct_preimage_search: Compare C with its pure gauge G for different raw coordinate motion and
        identical J; compare P with -P for identical x and F on every constructed curve. Record these
        collisions and do not interpret J as a scalar label.
    constructive_transforms:
    - transform: stronger_invariant
      proposed_object: Active unit model scaling u=u0*(1+v*epsilon). Coefficient J of F=x^2/A.
      predicted_gain: Exact cancellation of gauge contributions, an interpretability result only.
    - transform: stronger_invariant
      proposed_object: Pullback epsilon->c*epsilon for c in k*. The jet with its declared tangent direction.
      predicted_gain: Explicit covariance rather than an unsupported parameter-free invariant.
    - transform: observable_fiber
      proposed_object: Vary the smooth flex family while retaining its 3-torsion section. A varying-family
        control for the scoped etale-section lemma.
      predicted_gain: Localize the invalid implication from torsion etaleness to zero coordinate response.
    quantifier_order: Fix a field, smooth family, invertible n, and finite n-torsion section first; then
      quantify over every active unit model scaling and invertible parameter pullback. Vanishing is asserted
      for constant families up to that scaling, not for all varying families. The flex construction is
      existential; the ordinary-stratum instantiation requires a separately certified eligible panel prime.
      Finite tests do not replace the universal identities.
    method_ceiling:
      strongest_certifiable_claim: Exact first-order transformation laws and the scoped constant-versus-varying-family
        distinction.
      nearby_object_control: The explicit flex family must reject the deliberately false blanket rule
        that all prime-to-p torsion coordinate derivatives vanish; constant and pure-gauge families must
        still give J=0. Neither control is a DLP method.
    proof_obligations:
    - claim: Derive J and its active scaling and pullback laws with conventions fixed.
      responsibility: correctness
      owner_plan: Future approved producer; later blind independent re-deriver.
    - claim: Prove constant-family uniqueness and constancy without importing the varying-family conclusion.
      responsibility: correctness
      owner_plan: Future approved producer; later independent reviewer of the etale-section joint.
    - claim: Verify flex incidence, tangency, smoothness, exact order 3 and predicted jet.
      responsibility: correctness
      owner_plan: Future approved producer; later independent validator using separate arithmetic.
    - claim: Establish eligibility and explain the IDEA-109 scope distinction without claiming contradiction.
      responsibility: scope
      owner_plan: Future approved producer; later red-team reviewer and Coordinator synthesis.
    not_applicable_reason: null
  asymptotic_claim: null
  heuristic_assumptions: []
