  title: 'Arity axis of bounded-degree refutation: the minimal refuting mutant-closure degree D_W of
    enumeration-certified UNSAT chained-S_3 descended decompositions stays 4 at m in {3,4,5}, n <= 15,
    |V| >= 8 (Semaev 2015 Assumption 1 on the UNSAT arm, operationalised as D_W = 4)'
  statement: >-
    On enumeration-certified UNSAT chained-S_3 descended decomposition systems (t = m, Semaev 2015 eq. (5)
    presentation, u auxiliaries in F_(2^n), x_i in a k-dimensional F_2-subspace V with k >= 3 so |V| >= 8),
    the minimal refuting mutant-closure degree D_W = min{D : 1 in W_D} equals 4 on >= 90% of instances in
    every tested cell m in {3,4,5}, n in the ladder of the test boundary (m=3: (n,k) in {(9,3),(11,4),(13,5),
    (15,5)}; m=4: {(9,3),(11,3),(13,4)}; m=5: {(9,3),(11,3)}), for both V = {deg < k} and random V; plain
    Macaulay M_4 refutes none; the support-matched null is refuted at the same degree and the dense matched
    null is not. Tested scope: the cells above, up to three curves per n (y^2+xy=x^3+x^2+b, #E = 2q, q prime;
    curves_used reported per cell), one
    host class; nothing at n = 131 or any cryptographic size; no speedup claim (per-attempt cost at fixed D is
    polynomial in N = (m-2)n + mk with a large constant; see
    analysis/ecdlp2m-iteration-20261009/wwit-ecc2k130/README.md, a derivation). Source of the statement:
    design memo for EXP-SEMBIN-d9767f, from IDEA-20261010-066c44 (claim).
  mechanism: >-
    (Verbatim from IDEA-20261010-066c44.) PAIR (R1 Boolean coordinates of x_i in V and chain nodes u_j; Sigma
    = {multiply by a variable inside B_<=D, F_2-combine, re-echelon} = W_D, plus chain extension m->m+1), not
    translation. Trichotomy: coordinate-dependent (depends on the SET V and presentation, not a basis); index
    calculus stays Class I. Lossy test: I -> D_W(I) keeps one integer; Sigma-compatible (monotone least
    fixpoint, GL_N(F_2)-invariant); lossy. NEW AT m>=4: middle blocks S_3(u_{j-1},x,u_j) multiply two chain
    nodes, so the pilot mechanism (u affine) cannot carry; the support null tests this. M_4 rows/cols fall
    0.43->0.06 with m: degree 4 never generic by counting. Only full-symbolic bounded D gives alpha<m/2-1;
    enumerating m-2 legs (IDEA-20260930-b26bbc) costs 2^((m-2)l), and m-2>m/2-1 for m>2.
  assumptions:
  - 'Prop S: 1 in W_D implies UNSAT (IDEA-20261010-066c44 assumption; W_D is a subspace of the ideal, so 1 in
    W_D is a certificate of unsatisfiability over F_2 with the field equations).'
  - 'V a subspace: KN-OPEN-020 scoped-out class, not escaped (IDEA-20261010-066c44).'
  - 'D_W <= d_F4 on UNSAT (IDEA-20261010-066c44.notes.md section 3, derivation sketch, unchecked): this is the
    direction that lets D_W >= 5 bear on Assumption 1; the converse is heuristic H1 and is not tested here.'
  - 'Labels are ground truth only when two independent exhaustive enumerators agree (curve-level
    chain_solutions and the Boolean C enumerator count_chain.c, m45-closure-pilot README); a disagreement
    voids the run.'
  - 'crypto-kb retrieval was unavailable to the proposer (IDEA-20261010-066c44); novelty_status stays
    unverified.'
  proof_search_map:
    bottleneck: D_W along m; bounded D is the only route to polynomial-in-N attempts.
    baseline_embedding:
      parameter_slice: 'pilot m=3 n=9,11,15; Semaev (13,4,4,4),(13,5,5,3)'
      reproduction_check: 'gate: m=3 n=11 W_4 >=0.95 of >=30 UNSAT, M_4 0 (IDEA); the contract C1 gate is
        the m=3 n=9 poly cell on the pilot instance ids, 60/60 W_4 and 0/8 false (design memo)'
    observation_collision:
      observable: (D_W, support-null D_W, dense-null D_W) per cell
      distinct_preimage_search: 'curve structure vs sparse support vs counting, separated by nulls and rows/cols'
    constructive_transforms:
    - transform: observable_fiber
      proposed_object: the triple
      predicted_gain: names which reading carries the bound
    quantifier_order: 'EXISTS D_0=4 FORALL tested cells m<=5: rate>=0.9; D_0 independent of m; not FORALL n'
    method_ceiling:
      strongest_certifiable_claim: rates and rungs at tested cells; d_F4 only via H1; nothing at n=131
      nearby_object_control: dense null, support null, SAT controls
    proof_obligations:
    - claim: 'H1: D_W<=d_F4'
      responsibility: correctness
    not_applicable_reason: null
  asymptotic_claim: null
