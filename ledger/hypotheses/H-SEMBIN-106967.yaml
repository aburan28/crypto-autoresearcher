  heuristic_assumptions:
  - id: A1
    statement: >-
      Semaev 2015 Assumption 1 (KN-LIT-fa346d; wording as recorded in RQ-SEMBIN-fa2e3f): for the Boolean
      systems of eq. (5) at the parameters the paper uses, d_F4 - the maximal total degree of polynomials
      occurring strictly before F4 terminates (Section 4.4) - is at most 4. Operationalised in this hypothesis
      as: for every enumeration-certified UNSAT instance of the tested cells, 1 in W_4 (D_W = 4). The paper
      itself was not re-read for this design; the statement is carried from RQ-SEMBIN-fa2e3f and the IDEA's
      citation of KN-LIT-fa346d (provenance internal).
    rigorous_support: >-
      Only one direction connects D_W to d_F4: D_W <= d_F4 on UNSAT (IDEA notes section 3, sketch,
      unchecked). So D_W >= 5 on an instance implies d_F4 >= 5 there (Assumption 1 measured false at that
      cell on the UNSAT arm, under the sketch); D_W = 4 leaves Assumption 1 not contradicted, never confirmed.
    validation_plan: >-
      EXP-SEMBIN-d9767f: r_4 per cell with Clopper-Pearson 95%, D_W distribution, M_4 count, both nulls,
      SAT controls, two eliminators, two enumerators.
    validation_experiment_ids:
    - EXP-SEMBIN-d9767f
    falsification_condition: >-
      Any uncensored S_3 cell with |V| >= 8 and >= 20 UNSAT instances with r_4 <= 0.8 (the IDEA's
      pre-registered GROWTH threshold, >= 20% non-refuted; EXP-SEMBIN-d9767f falsification criterion). A cell
      with 0.8 < r_4 < 0.9 makes the contract inconclusive, neither support nor falsification.
  - id: H1
    statement: 'On UNSAT, d_F4 (normal strategy) = D_W or +1.'
    rigorous_support: 'F4 trace lies in the capped fixpoint, so D_W<=d_F4 (sketch); converse imitates Lazard
      truncation'
    validation_plan: 'msolve/M2 step degrees where F4 finishes (n<=11, m<=4)'
    validation_experiment_ids: []
    falsification_condition: 'an UNSAT instance with d_F4 >= D_W + 2 on a completed F4 run; not tested by
      EXP-SEMBIN-d9767f (no solver other than the two eliminators is in scope)'
  - id: H2
    statement: 'r_4 at fixed m, k/n is non-decreasing in n.'
    rigorous_support: 'columns C(N,<=D) polynomial in N; imitates semi-regular monotonicity (recalled)'
    validation_plan: 'n ladder to the memory wall'
    validation_experiment_ids: []
    falsification_condition: 'r_4 falling with n at fixed m and k/n on uncensored cells; the n ladder of
      EXP-SEMBIN-d9767f is descriptive for H2 and carries no criterion'
  - id: H3
    statement: 'Chained D_W <= direct D_W; direct >= generator degree (6 at m=3).'
    rigorous_support: 'EV-BINSTD-5cd3c9'
    validation_plan: 'direct S_4, m=3, n=7,11,13; m>=4 needs S_5 export (b94ec8)'
    validation_experiment_ids: []
    falsification_condition: 'a direct-presentation instance refuted at a lower D than its chained
      presentation; the direct presentation is out of scope of EXP-SEMBIN-d9767f'
  - id: H4
    statement: 'Non-refuted share <= poly(l)2^-(alpha l) or refuted at bounded D_1.'
    rigorous_support: 'H-ECDLP-1f1111 H2-TAIL'
    validation_plan: 'rung distribution only'
    validation_experiment_ids: []
    falsification_condition: 'a non-refuted share that neither decays in l nor is refuted at a bounded
      D_1; the D_W distribution of EXP-SEMBIN-d9767f is descriptive for H4 and carries no criterion'
  structural_ingredients:
  - description: chained S_3 Boolean systems from Semaev 2015 eq. (5), t = m, Weil-descended over F_2
    citation: KN-LIT-fa346d (Semaev, ePrint 2015/310, inputs/SEMAEV-2015-310/); technique abstract KN-TECH-b18366
    provenance: internal
    verified_by: idea-generator read tables.yaml (IDEA-20261010-066c44 citation); coordinator read RQ-SEMBIN-fa2e3f
    role: presentation under test
  - description: mutant closure W_D to fixpoint and the plain Macaulay matrix M_D over F_2 with field equations;
      1 in W_D certifies UNSAT (Prop S)
    citation: analysis/ecdlp2m-iteration-20261009/m3-closure-pilot/README.md and m45-closure-pilot/README.md
      (closure.c, myclosure.c); exploratory provenance only
    provenance: internal
    verified_by: coordinator read both READMEs for this design
    role: the refutation instrument whose minimal degree is measured
  - description: first-fall degree bounds independent of n (Petit-Quisquater m^2+1; Kousidis-Wiemers
      improvement)
    citation: arXiv:1906.05594 and arXiv:1503.08001 abstracts; m^2+1 from a search summary
      (IDEA-20261010-066c44.notes.md section 6)
    provenance: recalled
    verified_by: null
    role: pointer only; a first-fall bound says nothing about D_W (IDEA notes)
  reduction_chain:
    core_problem: whether the minimal refuting closure degree of the chained-S_3 UNSAT arm stays bounded as the
      arity m grows at toy n
    corollaries: []
  predictions:
  - id: P1
    metric: 'r_4 = UNSAT share refuted by W_4, per (m,n,V)'
    direction: same
    minimum_effect: '>=0.90 each cell m<=5'
    source: IDEA-20261010-066c44 prediction 1 (poly and random V, |V| >= 8 per the design memo)
  - id: P2
    metric: 'support-null / dense-null r_4'
    direction: different
    minimum_effect: 'support >=0.9; dense <=0.1'
    source: IDEA-20261010-066c44 prediction 2
  - id: P3
    metric: 'M_4 refutations of UNSAT S_3 instances per cell'
    direction: lower
    minimum_effect: '0 at every cell'
    source: design memo P3 (from the IDEA claim "plain Macaulay M_4 refutes none" and proof_search_map
      reproduction_check "M_4 0")
  - id: P4
    metric: 'log2 ops_to_1 vs log2 N'
    direction: different
    minimum_effect: 'power law beats 2^(cN) (AIC delta>=4)'
    source: IDEA-20261010-066c44 prediction 3; secondary in EXP-SEMBIN-d9767f, not part of its success
      criterion (design memo); ops_to_1 is operationalised there as ops_proxy, the independent eliminator's sum
      over closure iterations of rows x cols (Coordinator resolution h)
  - id: P-direct
    metric: 'D_W direct minus chained, m=3'
    direction: higher
    minimum_effect: '>=2'
    source: IDEA-20261010-066c44 prediction 4; NOT tested by EXP-SEMBIN-d9767f (direct S_{m+1} presentation
      is out of scope there); retained unadjusted for a later contract
  test_boundary:
    instances:
    - 'curves y^2+xy=x^3+x^2+b over F_(2^n), #E = 2q, q prime: the driver enumerates b upward from 1 and keeps
      the first three b with #E = 2q, q prime; if fewer than three exist at some n it records the count and
      runs those (never fewer than one); the cell table reports curves_used (Coordinator resolution g)'
    - 'targets x(2P) from the seeded stream: the first 10 unique UNSAT targets per (curve, V) and every unique
      SAT target among the first 150, so a cell with three curves has >= 30 UNSAT'
    - 'V: polynomial {deg<k} and one random k-dimensional subspace per curve; per (trial seed s, curve index
      c) the subspace seed is the first 8 bytes of sha256("V|" + str(s) + "|" + str(c)) as an integer, a
      uniformly random full-rank k x n F_2 matrix is drawn with that seed and its row space is V (Coordinator
      resolution f)'
    - 'cells (m; n,k): m=3 (9,3),(11,4),(13,5),(15,5); m=4 (9,3),(11,3),(13,4); m=5 (9,3),(11,3); all k >= 3'
    - 'nulls: support-matched null (same monomials, iid coefficients) >= 10 UNSAT at all nine S_3 cells (poly V,
      curve 0); dense matched null (boolsys.matched_null) >= 10 labelled at the five cells with N <= 30
      (Coordinator resolution m)'
    - 'm=2 chained control (C2) at (n,k) in {(9,3),(11,4)}: 20 UNSAT + all SAT targets among the first 100,
      closures W_3 and W_4; instrument control, not part of success (Coordinator resolution e)'
    parameters:
      presentation: chained S_3, t = m, Semaev 2015 eq. (5)
      closures_per_instance: [M_3, W_3, M_4, W_4, 'W_5 only where columns <= 4e4, which is the m3-n9-k3 cell
          alone (12,616 columns at D = 5)']
      eliminators: ['M4RI closure.c (libm4ri 0.0.20200125 on this host)', 'independent bit-packed myclosure.c
          (primary above 50,000 columns)']
      enumerators: [chain_solutions (curve level), count_chain.c (Boolean C)]
      seeds: [20261017, 20261018, 20261019, 20261020, 20261021, 20261022]
      censoring: 'a job exceeding 6 GB RSS or 1800 s is censored, never refuted or not refuted'
    implementation: experiments/EXP-SEMBIN-d9767f/implementation/run.py (checker check.py; sources copied from
      the m45 and block-local pilots, sha256-bound by the trial plan)
    budget:
      wall_clock_seconds_per_run: 36000
      wall_clock_seconds_per_run_m5_trial: 50400
      maximum_memory_gb: 6
      maximum_runs: 6
    scope_note: >-
      Toy scale only: n <= 15, m <= 5, one host class. Nothing at n = 131 or any cryptographic size; no
      transfer assumption is made. The direct S_{m+1} presentation, any n > 15, any solver other than the two
      eliminators, and any cost extrapolation are outside this boundary.
  distinguishable_outcomes:
  - 'support_scoped: r_4 >= 0.9 in every uncensored S_3 cell with |V| >= 8 and >= 20 UNSAT instances (P1), P2
    and P3 hold on every such cell, false_refutations = 0, controls C1-C6 pass, both eliminators agree
    wherever both run, check.py exits 0 on every run.'
  - 'falsify: any uncensored S_3 cell with |V| >= 8 and >= 20 UNSAT instances has r_4 <= 0.8 (the IDEA GROWTH
    threshold; then D_W grows with m or n in that cell; the minimal refuting D is reported where W_5 ran).'
  - 'inconclusive: a cell with 0.8 < r_4 < 0.9 (neither support nor falsification), or every m=5 cell
    censored, or fewer than 20 UNSAT instances in every m=5 cell.'
  - 'not evidence (run invalid): any false refutation, any eliminator disagreement, any enumerator
    disagreement, any evaluation-check mismatch, or check.py exit 3; the run is completed_invalid.'
  - 'not evidence: a timeout, memory kill or crash is censoring or failed_infrastructure (AGENTS.md rule 5).'
  falsification_conditions:
  - 'GROWTH: >=20% of >=30 UNSAT at a cell m<=5 reach a W_4 fixpoint without 1. Support null at 4:
    coefficient-driven (Assumption 1 false there if H1); null also >=5: presentation support, not curve.'
  - 'Any refuted SAT instance or eliminator/enumerator disagreement voids the run; dense null r_4>=0.5 makes the
    cell non-discriminating.'
  - 'COST: 2^(cN) preferred (AIC delta>=4) at an m with >=4 cells: alpha<m/2-1 route fails whatever D is.'
  confounders:
  - one curve per n in pilot
  - composite n=9 and 15
  - tiny k at n=7
  - old M4RI defect
  interpretation_limits:
  - 'Flat 4 on both V through m=5/6 AND alpha~0 at fixed D is the only route to alpha<m/2-1; supports
    Assumption 1 on the UNSAT arm only, via H1. Censoring is never negative.'
  - 'Rate >=0.9 is not an exponent (H4). Growth refutes Assumption 1 only. No deployed-curve claim.'
  - 'No speedup is claimed and none can follow from this hypothesis: the per-attempt cost at fixed D is
    polynomial in N with a prohibitive constant on toy sizes (pilot READMEs;
    analysis/ecdlp2m-iteration-20261009/wwit-ecc2k130/README.md is a derivation, not a measurement).'
  - 'Nothing at n = 131; nothing about the security of any deployed curve in either direction
    (RQ-SEMBIN-fa2e3f constraint).'
  - 'Presentation: chained S_3 only (t = m). One host class. The host M4RI is 0.0.20200125, the release with a
    documented large-elimination defect; the independent eliminator is primary above 50,000 columns and both
    must agree wherever both run.'
  - 'The pilots (m3-closure-pilot, m45-closure-pilot, block-local-closure-pilot) are exploratory provenance
    for the cell choice only, never evidence.'
  - 'Producer-written check.py is not independent review; independent review precedes any status move.'
