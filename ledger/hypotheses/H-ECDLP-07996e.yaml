  statement: >-
    A window of width 30 stores 536870912 entries. A window of width 29
    stores 268435456. Two to the power 29 is 536870912. Two to the power
    28 is 268435456. Five hundred thirty-six million eight hundred
    seventy thousand nine hundred twelve exceeds two hundred sixty-eight
    million four hundred thirty-five thousand four hundred fifty-six by
    268435456. The product of the two table sizes is 144115188075855872.
    Their sum is 805306368. Two width-29 tables each store 268435456, so
    that gap is 0 and their product is 72057594037927936.
  mechanism: >-
    The proposal writes the widths 30 and 29 and the sizes 536870912 and
    268435456. This contract checks those integers. It does not add a
    curve point.
