    - Specified, not approved. No run exists. Approval is solely the act of DEC-20260929-585602 naming EXP-BINSTD-c9c8a2.
    - NO ATTACK AND NO SPEEDUP. The hypothesis certifies a capacity, records a ceiling, and measures a control beyond the exact components.
    - THE CEILING IS COUNTERFACTUAL. Every ideal-tree total is conditional on a filter that (A) excludes exactly; no sentence of this record or of its experiment asserts a cost below matched rho on ECC2K-130 or on any curve, and no statistic is mapped onto the ceiling-model thresholds.
