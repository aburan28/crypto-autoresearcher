      CONTRACT HAS FIXED (CORR-20260925-649e25), and on a trade class
      KN-FIND-47da4e declines to price, that record not being a promoted
      finding. The without-orbit line is the unconditional one of the pair,
      under the first condition.
    - >-
      RESOLVING FLOOR, MEASURED (RR-5). A NEG reading means an arm's stratified
      controlled excess lies below 3 W of the exact-saturated null at the
      declared S, never that G = 1; the floor reported beside it is the
      measured planted-mixture rho per (l, M). The version-2 design figures
      (smallest registrable G about 2.8 to 8.8 across M = 8 to 128) are
      WITHDRAWN as the floor: they were underestimates for a uniform label and
      do not describe the version-3 reference.
    - >-
      LEAD REACH, SCOPED (RR-3). The controls show LEAD reachable for a known
      approximate filter whose excess grows along the ladder (PC-16) and for one
      whose standardised excess is flat (PC-16b), and not reached by a planted
      excess decaying from rho = 1 to rho = 0.8 along the ladder at M = 16
      (PC-16c). Nothing is shown for excesses below the measured floor or
      decaying more slowly than PC-16c's; L2 fails a flat excess with
      probability about 0.011.
    - Levels above 1 are not measured. Target-dependent filters are out of the family. The declared arm list is incomplete by construction.
    - Toy tier. Ladder at n at most 23, fixed alphabet to n = 41. A NEG at these n is not a NEG at n = 131; the transfer is HEUR-B2, a heuristic and never a bound, testable only on held-out tested cells.
    - The primality of l is the primary source's statement; the certificate's divisor set of 4l rests on it.
    - This hypothesis asserts nothing about any curve's security, about whether index calculus beats rho on any curve, about any oracle meeting any budget, or about the AUXIN, FROB or QSP work of this program. It uses no D1, D2 or D3 quantity.
    - FORWARD GUIDANCE regardless of outcome (carried). The k-list objects NOT priced here are filters that read the discrete logarithm (closed by definition), target-dependent filters, and algebraic joins that are not rectangle covers (the chained Semaev system, the SEMBIN questions').

