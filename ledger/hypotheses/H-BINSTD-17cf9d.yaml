  title: >-
    On the composite ambient group of ECC2K-130 every exactly sum-compatible
    filter has alphabet in 1, 2, 4, so the exact capacity is 2 bits (subject to
    PO-1 and to the primary source's primality statement for l), and every
    exact component is a function of the E/4E class; the ideal k-list tree is a
    CEILING of the k-list column and not a reachable cost; and the approximate
    capacity of the declared Koblitz-specific arms BEYOND THOSE EXACT
    COMPONENTS is measurable on an admissible three-cell ladder by comparing
    each arm with its own shuffle stratified by the exact quotient and with an
    exact-saturated random-label null, under controls that read an
    exact-content-only label as a null.

  statement: >-
    Let E be a binary Koblitz curve and G a finite abelian group written
    additively. Call h from G onto an alphabet of size M EXACTLY SUM-COMPATIBLE
    if there is a combining rule f with h(P + Q) = f(h(P), h(Q)) for all P, Q in
    G and f invertible in each argument.

    (A) CAPACITY CERTIFICATE, unconditional subject to PO-1 (carried). Theorem C
    of KN-FIND-ffe1df re-run on an arbitrary finite abelian group: f is a
    quasigroup operation, associativity forces it associative, an associative
    quasigroup is a group, h is a surjective homomorphism, and Lagrange gives M
    dividing the order of G. On ECC2K-130, whose ambient group order is 4l with
    l the 129-bit prime 680564733841876926932320129493409985129 AS STATED BY THE
    PRIMARY SOURCE (Bailey et al., Appendix A; not proved here), every alphabet
    strictly below l lies in 1, 2, 4: the exact capacity of the FULL group below
    l is 2 bits, of the target subgroup 0 bits. COROLLARY USED BY (D): every
    exact sum-compatible map below l is a function of the E/4E class h4 (and
    E/2E is its quotient). The certificate is committed as code that works from
    a factorisation GUARDED for primality, distinctness and positive exponents
    (CODE-CERT, RR-7), with four control readings as pass criteria.

    (B) THE TWO NONTRIVIAL EXACT FILTERS (carried). The order-2 filter E onto
    E/2E, P maps to Tr(x(P)) + Tr(a), RE-DERIVED FROM THE GROUP LAW (Q in 2E
    exactly when Tr(x(Q)) = Tr(a)), now also read at source as
    Fong-Hankerson-Lopez-Menezes CACR CORR 2003-18 Lemma 4.1(iv) (retrieved,
    verified_by TASK-20260929-7d8385). The order-4 filter E onto E/4E,
    constructed by scalar multiplication (DF-1), with its halving presentation
    b0 + 2 b1 (DF-6), which now supplies the STRATUM of every Koblitz arm after
    PC-4b shows it equal to the constructed map.

    (C) THE CEILING, EXPLICITLY COUNTERFACTUAL, IN NAMED AMBIENTS (carried).
    Under the ideal k-list model (k = 2^j lists of size L = N^(1/(j + 1)),
    per-attempt cost k L, B = L, relations B or B/262, linear algebra k R^2) in
    the declared target-subgroup ambient (N = l), an ideal k = 16 tree would
    need an alphabet of about 2^25.80 at each of three internal levels; the
    per-level gap is 25.80 bits (capacity 0 bits) and the closure line at the
    exact capacity about 2^107.20 per attempt; in the full-group ambient (N =
    4l) the gap is 24.20 bits (capacity 2 bits) and the closure line about
    2^102.80. The ideal-tree totals are the CEILING of the k-list column,
    CONDITIONAL ON A FILTER THAT (A) EXCLUDES EXACTLY, and are not a cost any
    construction reaches. Nothing here predicts or asserts any reachable cost
    below matched rho on ECC2K-130 or on any curve. Any reading of a lead is
    pre-registered to review-breakthrough at max and to independent replication
    before interpretation.

    (D) THE ONE OPEN NUMBER, MEASURED BEYOND THE EXACT COMPONENTS. For a cheap
    NON-homomorphic label h the level-1 bucket gain is G(h) = M times the
    maximum over (a, b, c) of Pr[h(P + Q) = c given h(P) = a, h(Q) = b], from S
    = 2^ceil(log2(128 M^2)) sampled pairs per (cell, M). Its CONTROLLED EXCESS
    is G minus the median of ten shuffles of h STRATIFIED BY THE CELL'S EXACT
    QUOTIENT (h4 on a Koblitz cell, h2 on the ordinary cell), read against the
    width of the EXACT-SATURATED random-label null q r + e of the same (cell,
    M); by the corollary of (A) this removes every exact component the
    certificate counts and keeps every other relation for the arm alone (RR-1).
    PREDICTION, stated so that it is true of a null and can fail: on the
    admissible Koblitz ladder n in 13, 19, 23 at M = N^(1/3) and N^(1/4) (N = l),
    at the fixed alphabet M = 16 on n in 13, 19, 23, 41, and on the ordinary
    n = 19 cell, every declared arm reads NEG - no stratified controlled excess
    (clause L3) at any estimated (cell, M). A uniform random label and the two
    exact-content-only labels (weight classes tied to the E/2E class; q r + e
    with a skewed r) also read NEG - they are nulls of this comparison, and the
    contract requires it (PC-15, PC-17, PC-18). The exact controls read exactly
    2, 4, 548, 956 and every declared alphabet on Z/2^17, and the log-interval
    key on Z/lZ reaches LEAD with a growing (PC-16) and with a flat (PC-16b)
    standardised excess, while a planted decaying excess does not (PC-16c). An
    arm meeting clauses L1, L2 and L3 of the experiment's SR-4 is the LEAD
    branch and is routed, not interpreted. F1 carries the exact E/2E bit on its
    parity-pure classes (DF-9); under the stratified comparison that bit is
    not excess, so F1's predicted reading is NEG like every other arm.

  statement_note: >-
    DC-B1 (carried): the record's 2^24.7 relations at k = 8 with orbit unknowns
    is 0.4834 bit above the recomputation 2^24.2166 under the record's own
    model; the diagnosis is left open, the ambient-mix reading recorded as the
    more plausible one. DC-B2 and DC-B3 carried. The proposal is NOT edited.

  mechanism: >-
    OBJECT FRAME (carried). Representation R1 of RQ-ECDLP-623a32: the
    x-coordinate of a point of the FULL group E(F_2^n), read in a normal basis
    (Frobenius a cyclic shift) and in the polynomial basis. Operation set Sigma:
    pairwise addition at ONE merge level of a k-list tree, with Frobenius and
    negation. The translation block systems of E are the cosets of 2E and 4E
    (IDEA-20260922-153a90, cited by id).

    TRICHOTOMY (carried). The exact filters are Class I objects whose entire
    content is the 2-bit block system of (A); every non-homomorphic candidate is
    Class II BRANCHING, and G is the branching meter at one level, b = M / G.

    WHY THE VERSION-2 INSTRUMENT MISREAD F1, AND WHAT VERSION 3 CHANGES. In a
    normal basis the trace is the sum of the coordinates (FHLM 4.2), so F1's
    weight parity is h2: F1 is a MIXED object, marginal skew plus the
    certificate's exact bit. Version 2 shuffled F1 without stratification, so
    the destroyed h2 relation scored as controlled excess and an F1-structured
    label read LEAD in synthetic replicates (DEC-20260929-8c3cb2 RT-O1). Version
    3: (i) every curve-cell arm is shuffled within the strata of the exact
    quotient and compared with the exact-saturated null (RR-1 route (a),
    DF-7 generalised); (ii) exact-content-only labels must read NEG before any
    arm is read (PC-18, on the isomorphism types of the declared groups) and on
    every declared cell before any classification (PC-17) (RR-2); (iii) L2 is
    pre-registered as NON-DECAY, on a standardised excess whose width is
    measured per seed, so no common-mode width error enters the slopes (RR-3);
    (iv) the null width is stabilised at 500 draws (RR-6); (v) the stratified
    branch is gate-pinned by an exact control (PC-6c) and a planted marginal
    (PC-6d), PC-9 uses an out-of-family filter on its own stream, and PC-10 is
    guarded in code (RR-10); (vi) CORRECTED ORDERING (RR-11): the rules as coded
    must classify the log-interval key LEAD with growing and flat excess, a
    planted decay not LEAD (PC-16, PC-16b, PC-16c) and the exact-content-only
    labels NEG on the isomorphism types (PC-18) BEFORE any Koblitz arm is read;
    RLFAM (PC-15) and the on-cell exact-content-only labels (PC-17) are read
    with the arms in Stage 2 and must read NEG before any classification is
    admitted, voiding every classification if they do not.

    WHY A NULL READING WOULD BE ADMISSIBLE AT ALL (carried, extended). The same
    instrument must read forced non-null values on nearby objects (CELL-K17C,
    Z/2^17, Z/(16 x 2003), Z/lZ with the key) and forced null values on
    exact-content-only labels; a NEG asserts absence only above the measured
    resolving floor.

    THE CEILING IS NOT A MECHANISM. (C) prices what a filter WOULD be worth.

  assumptions:
    - >-
      The ECC2K-130 ambient group order is 4l with l prime as the primary source
      states, and the 2-Sylow subgroup is cyclic of order 4 (carried).
    - >-
      The ideal k-list accounting of (C) assumes independent uniformly random
      lists and a filter with G = M at every internal level; it is the IDEAL
      bound, used only to state the ceiling and its threshold arithmetic, and is
      conditional on a filter that (A) excludes exactly (carried).
    - OFF-LIMITS COMPONENT DECLARED (carried). F2, factor-base decomposition, is the family; KN-OPEN-020 is engaged only through the orbit-union base of the ceiling's with-orbit line. F1 is not used.
    - Arithmetic only at deployed parameters (carried). Every executable cell has n at most 41 and every ladder cell n at most 23. No k-tree run at deployed parameters, no target-dependent family, no level above 1, and no IDEA-20260926-d3c5a5 engine.
    - >-
      NO BUDGET QUANTITY IS USED (carried). None of D1 (2^-4.41), D2 (2^+5.71)
      or D3 (2^+11.01) of CORR-20260928-4cb669 is used and no per-attempt
      oracle budget is asserted; under that correction's pricing rule a
      per-attempt comparator, were one ever needed, would be D3 and never D1.
    - Matched rho on ECC2K-130 is 2^60.8090 = sqrt(pi l / (4 x 131)) under CORR-20260922-81aeab, AMBIENT the target subgroup; a reference for the ceiling line and the ceiling-model threshold table only.
    - >-
      NEW. Every exact component a label on a declared cell can carry is a
      function of the cell's exact quotient (h4 on a Koblitz cell, h2 on
      CELL-O19), by the corollary of (A) applied to each cell's verified order
      (4 x a prime, or 2 x a prime). The stratified comparison rests on this,
      and PC-6c, PC-6d, PC-17 and PC-18 check its implementation.

  proof_search_map:
    bottleneck: >-
      The level-1 bucket gain G(h) of cheap filters on E(F_2^n) for a binary
      Koblitz curve at the alphabets of rule R-M, read BEYOND THE EXACT
      COMPONENTS: against the arm's own shuffle stratified by the exact quotient
      and against the exact-saturated null. Decision-changing because the
      k-list column is a prose closure by Theorem C and either outcome replaces
      it with a quantity scoped to the declared arms and tested cells.
    baseline_embedding:
      parameter_slice: >-
        Six slices, each a blocking control with committed code: Z/2^17 low bits
        (PC-1); Z/lZ with the log-interval key, growing, flat and decaying
        (PC-7, PC-16, PC-16b, PC-16c); the composite n = 17 cell at 548 and 956
        (PC-5); Z/(16 x 2003) and Z/(64 x 2003) exact beyond the stratum
        (PC-6c); the certificate on 4l, 2^17 and 130972 with malformed inputs
        refused (PC-CERT-1 to PC-CERT-4).
      reproduction_check: >-
        SYMBOLIC plus a FROZEN FIXTURE: the ten import-safe code blocks of the
        audit sheet, extractable by one pinned method with pinned reference
        sha256, pass criteria stated before execution and placed in the
        experiment's SR-1 and IR-1 to IR-24.
    observation_collision:
      observable: >-
        Per (cell, arm, M, seed): G, its excess over the exact-saturated null,
        its excess over its own stratified shuffles, and the per-seed
        standardised excess along the ladder.
      distinct_preimage_search: >-
        Six collisions, each separated by a control or clause with code (audit
        sheet audit_2): OC-1 marginal skew (the shuffle; PC-6a, PC-6b, PC-6d),
        with F1 reclassified as a mixed object; OC-2 sparse tables (rule R-S,
        IR-12, PC-2, PC-9 as redefined and disclosed); OC-3 secretly exact (the
        certificate, SR-6 with the image-size rule); OC-4 a blind instrument
        (PC-1, PC-5, PC-7, PC-16, PC-16b); OC-5 occupancy growth (L2 on
        per-seed-standardised excess, PC-15); OC-6 exact-content-only labels
        (the stratified comparison; PC-6c, PC-6d, PC-17, PC-18).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The k-list tree's filter requirement rewritten as a subgroup-index condition on the ambient group; now guarded code (CODE-CERT).
        predicted_gain: The exact-capacity cell of the k-list column reads 2 bits from the cofactor (0 bits on the target subgroup), with the ideal-tree table as the column's ceiling. Zero compute.
      - transform: observable_fiber
        proposed_object: >-
          Hold the stratified controlled excess fixed and vary the forgotten
          structure: the prime-l Koblitz cells (predicted none beyond the
          exact components), the composite cell, Z/lZ with the key, and the
          exact-content-only labels (predicted none, PC-17 and PC-18).
        predicted_gain: It makes a NEG reading admissible, because the same instrument reads forced non-null values on the nearby objects and forced null values on exact-content-only labels.
    quantifier_order: >-
      (A) FOR ALL finite abelian groups and FOR ALL exactly sum-compatible maps:
      M divides the group order and h is a homomorphism; HENCE on ECC2K-130
      every alphabet below l lies in 1, 2, 4 and every exact component is a
      function of h4. (D) FOR THE TESTED cells and THE DECLARED arms ONLY, at
      level 1 only, above the measured resolving floor at the declared S: every
      arm reads NEG beyond the exact components. NOT CLAIMED: undeclared or
      target-dependent filters; levels above 1; excesses below the floor; any
      cost on any deployed curve.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On ECC2K-130 every exactly sum-compatible filter has alphabet at most 4
        (subject to PO-1 and the source's primality statement for l); and on toy
        Koblitz cells at n in 13, 19, 23 (and at M = 16 to n = 41) the declared
        arms show no controlled excess beyond the exact components above the
        measured resolving floor, with the exact controls read exactly,
        exact-content-only labels read as nulls, and the log-interval key
        reaching LEAD with growing and with flat excess." It can NEVER certify
        that no cheap filter exists, nothing about levels above 1 or the
        algebraic route, and nothing about any deployed curve's cost or
        security.
      nearby_object_control: CELL-K17C, Z/2^17, Z/(16 x 2003) and Z/(64 x 2003), the Z/l key ladder, CELL-O19, RLFAM and the exact-content-only labels XCO1 and XCO2, all blocking.
    proof_obligations:
      - claim: PO-1. Theorem C's argument holds verbatim on a composite-order finite abelian group (carried).
        responsibility: correctness
      - claim: PO-2. The halving criterion Tr(x(Q)) = Tr(a) for membership in 2E, re-derived from the group law and corroborated at source (FHLM Lemma 4.1(iv)); P to Tr(x(P)) + Tr(a) a surjective homomorphism onto E/2E.
        responsibility: correctness
      - claim: PO-3. E/4E cyclic of order 4; the constructed map a surjective homomorphism; the halving presentation equal to it when Tr(A) = 0, checked by PC-4b (carried).
        responsibility: correctness
      - claim: PO-4. The ideal k-list arithmetic, the gap and closure lines in both ambients, and the ceiling-model threshold arithmetic (carried).
        responsibility: baseline
      - claim: PO-5. The (C3) floor 2^101.0000 C_3 (target subgroup) and the (C4) floor 2^62.4833 (full group) and 2^61.4833 (target subgroup) per relation, computed in CODE-S0 (RR-11).
        responsibility: runtime
      - claim: PO-6. G estimated with the stated S, ten enumerated seeds, ten stratified shuffles per seed and a measured exact-saturated null of 500 draws per (cell, M) with per-seed widths; never a percentile bootstrap.
        responsibility: correctness
      - claim: PO-7. Every cell's order, the primality of its l (by complete trial division, RR-11) and the cyclicity of its 2-Sylow subgroup recomputed and proved at setup; design-time orders are inputs, never results.
        responsibility: baseline
      - claim: PO-8. The exact capacity, the ceiling and the measurement are three separable quantities with named ambients (carried).
        responsibility: scope
      - claim: PO-9. Interface. No interface converts the ceiling into a reachable cost, and no statistic of the contract is mapped onto the ceiling-model thresholds (carried, extended by RR-4).
        responsibility: interface
      - claim: PO-10. The strata are the complete exact quotient of each declared cell (the corollary of (A) on its verified order), so the stratified comparison removes every exact component and nothing else; checked in implementation by PC-6c, PC-6d, PC-17 and PC-18.
        responsibility: correctness
      - claim: PO-11. CODE-AUDIT reads exactly the declared arms (one shared label function) and its fast maps equal CODE-CORE's on sampled points, blocking.
        responsibility: correctness
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim:
    problem: ECDLP on ECC2K-130 by a filtered k-list decomposition oracle
    prior_best: >-
      Matched rho 2^60.8090 with negation and the 131-fold Frobenius class
      (CORR-20260922-81aeab; KN-FIND-aa2efc as scoped by CORR-20260928-4cb669).
      The plain two-list join floor (C4) is 2^62.4833 group operations per
      relation in the full-group ambient (N = 4l) and 2^61.4833 in the
      target-subgroup ambient (N = l), above that reference in both (RR-11).
    time_exponent: >-
      NO EXPONENT IS CLAIMED IN EITHER DIRECTION. The unconditional content,
      SUBJECT TO PO-1 AND TO THE PRIMARY SOURCE'S PRIMALITY STATEMENT FOR l
      (RR-11), is a capacity certificate of 2 bits, which moves nothing. The
      ideal-tree totals are a CEILING conditional on a filter the certificate
      excludes exactly; at the exact capacity the k = 16 tree costs about
      2^107.20 per attempt in the target-subgroup ambient and about 2^102.80 in
      the full-group ambient.
    memory_exponent: >-
      For the ceiling, k lists of L points at 17 bytes: about 2^33.89 bytes at
      k = 16 and 2^39.34 at k = 8 (conservative). For the measurement, at most
      2^21 pairs per stream and 2^21 counters per table (4 GB ceiling).
    hidden_cofactor: Sort and hash polylogarithmic factors and multiset symmetry, a few bits, disclosed; the ceiling is conditional, so the disclosure bears on a counterfactual.
    claim_kind: capacity_certificate_plus_control_measurement
    claim_kind_note: A declared departure from the template enum, carried; read it as "no complexity claim is made".

  heuristic_assumptions:
    - id: HEUR-B1
      short_name: uniform sums
      formal_statement: >-
        Carried unchanged. For lists L_1 and L_2 of distinct elements of
        E(F_2^131) drawn without structure, the number of ordered pairs in
        L_1 x L_2 whose sum lies in a fixed set of 262 targets is distributed
        as Binomial(|L_1| x |L_2|, 262 / 2^131) to first order, uniformly in
        |L_1| and |L_2| below 2^40. The mean is exact; the Binomial SHAPE is the
        heuristic content.
      random_model_justification: An occupancy count for independent uniform draws; the mean is exact by double counting, so the model is asked only for the shape of the fluctuation (carried).
      supporting_results:
        - ref: KN-FIND-007
          provenance: internal
          claim: Yield conservation fixes the mean of the pair-sum count exactly.
          verified_by: TASK-20260929-291567 (read); relayed here as the version-2 record states it
        - ref: classical balls-in-bins occupancy law
          provenance: recalled
          claim: A pointer, not support.
          verified_by: null
      validation_experiment_ids: [EXP-BINSTD-c9c8a2]
      validation_plan: >-
        COMMITTED AS CODE (RR-9, CODE-HB1). SAMPLE: on CELL-K19, 200 independent
        pairs of lists of 2^8 distinct uniform points, 262 distinct targets
        under the seed crc32 of "heurb1-targets:CELL-K19", DIRECT PAIR-SUM
        COUNTING. PREDICTED DISTRIBUTION: Binomial(2^16, 262 / N_E) at the
        verified order N_E (mean about 32.80 at the design-time 523492).
        COMPARISON: chi-squared over NINE BINS FIXED NOW, edges 24, 27, 30, 32,
        34, 36, 39, 42, with 8 degrees of freedom and its 99th percentile
        computed in code. TAIL CHECK: the maximum count over the 200 pairs,
        1 - (1 - P(X >= max))^200. If a bin's expected count is below 5 at the
        verified N_E the chi-squared is reported and not read (fixed now).
        TRANSFER: none beyond the tested n.
      falsification_condition: >-
        The chi-squared statistic exceeds its 99th percentile at 8 degrees of
        freedom (when applicable), or the tail probability of the maximum count
        is below 0.01, with the instrument's gate passing. Either refutes
        HEUR-B1 on the tested cell and puts the (C4) floor's shape, not its
        mean, in question.
    - id: HEUR-B2
      short_name: decay transfer, restated on the stratified comparison
      formal_statement: >-
        RESTATED (RR-4). Let F be one of the twelve declared Koblitz arms. Its
        QUANTITY is the stratified clause L3 of EXP-BINSTD-c9c8a2: F's excess
        over the median of its own ten shuffles stratified by h4, at least 3 W
        of the exact-saturated null with the rank floor on 8 of 10 seeds. By
        construction marginal skew (kept by the shuffle) and exact components
        (kept by the strata and by the null) can neither satisfy nor violate
        it, which PC-6b, PC-6d, PC-17 and PC-18 check.
        CONSEQUENT Q-held, TESTABLE AT TESTED N: (ladder) if L3 holds at no
        estimated (cell, M) of CELL-K13 and CELL-K19, it holds at none of
        CELL-K23; (fixed alphabet) if L3 holds at none of CELL-K13, CELL-K19 and
        CELL-K23 at M = 16, it does not hold on CELL-K41 at M = 16. Each test is
        defined only when every involved (cell, M) is estimated. DEFINED FOR the
        twelve declared Koblitz arms; NOT DEFINED for the six ordinary arms (one
        ordinary cell, nothing held out).
        CONSEQUENT Q-131, NOT TESTABLE AT ANY TESTED N: at n = 131 and the
        alphabets L_k of the k-tree, F would show no stratified controlled
