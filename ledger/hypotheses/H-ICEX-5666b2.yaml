hypothesis:
  id: H-ICEX-5666b2
  question_id: RQ-EQLA-0d3f40
  source_idea_id: IDEA-20260815-fa6a12
  title: >-
    THE SECOND HALF OF EVERY INDEX-CALCULUS EXPONENT IS CITED, NOT MEASURED-
    block Wiedemann and block Lanczos on the relation matrices this lane
    actually produces cost within a factor 1.5 of the same solvers on random
    sparse matrices matched on dimension, density AND row-weight law, so the
    lane's cited asymptotic is adequate and the relation matrix's structure
    contributes nothing measurable at the tested dimensions; and this cost
    term is denominated in FIELD operations while the lane's other term and
    both baselines are denominated in GROUP operations, so no combined total
    may be emitted at all
  statement: >-
    (A) THE OBJECT. The ICEX exponent is relation cost plus linear-algebra
    cost. The lane measures the first and CITES the second as a sparse-matrix
    asymptotic. Real relation matrices have a specific sparsity pattern and a
    specific column-frequency law inherited from the factor base, and
    iterative-solver cost on them is measurable rather than citable.
    (B) THE FUNCTIONAL FORM, RE-DERIVED HERE RATHER THAN CITED. For an n x n
    sparse matrix over F_N with average row weight w, a block Wiedemann or
    block Lanczos solve performs Theta(n) matrix-vector products, each
    Theta(n*w) field operations, for Theta(n^2 * w) FIELD OPERATIONS in
    total, with a working set of Theta(n*w) stored field elements for the
    matrix plus Theta(n) per vector and Theta(n) sequence elements for
    Wiedemann. That form is elementary and is stated here so the measurement
    has something to be compared against; no external complexity claim is
    relied on.
    (C) THE PRE-REGISTERED PREDICTION. Measured field-operation counts on the
    lane's REAL relation matrices agree with the matched-random-sparse null -
    matched on dimension, on density AND on the row-weight distribution -
    within a factor 1.5 at every tested dimension. FALSIFIED if the ratio
    exceeds 1.5 at a majority of dimensions with a consistent sign. A
    consistent ratio ABOVE 1.5 means the lane's second term is UNDERSTATED,
    which is the direction that flatters index calculus and would be easy to
    miss; a consistent ratio BELOW 1.5 means it is overstated and the ICEX
    exponent improves for index calculus. Both are reportable and neither is
    the predicted outcome.
    (D) THE UNIT STATEMENT, WHICH IS BINDING AND IS NOT A CAVEAT. This
    contract's output is denominated in F_N FIELD OPERATIONS, with
    multiplications and additions counted in SEPARATE columns and never
    summed without a declared relative weight. The lane's relation-collection
    term and both matched baselines (Pollard rho, BSGS) are denominated in
    GROUP OPERATIONS. THESE ARE DIFFERENT UNITS. This hypothesis EMITS NO
    COMBINED TOTAL and forbids any artifact under it from doing so; a
    downstream ICEX aggregation must convert at an explicitly declared,
    recorded rate before adding. A red-team pass on this program found a
    total denominated in field operations from which group operations had
    been subtracted, which flipped a headline - this is the same junction and
    it is closed here by refusing to cross it.
    (E) THE LIMIT THAT DOMINATES EVERYTHING ELSE. The lane's matrices are
    TOY-DIMENSIONAL and sit far below any asymptotic regime; iterative
    solvers have startup costs that dominate at small dimension, which is
    exactly the regime the lane's runs produce. A toy measurement may say
    nothing about the sizes where the exponent would matter. THAT IS THE
    RECORD'S CENTRAL LIMITATION, NOT A FOOTNOTE, and it is stated in the
    hypothesis rather than at the end of a report.
  mechanism: >-
    WHY A CITED ASYMPTOTIC IS A LOSSY PROJECTION HERE. An asymptotic projects
    away the matrix's actual structure. For relation matrices that structure
    is highly non-random - column frequencies follow the factor base's usage
    distribution, row weights follow the arity, and rows arrive in blocks
    from the same target - and iterative-solver cost is exactly what responds
    to structure, through the number of iterations to a nontrivial kernel
    element and through the cost of each product.
    WHY DENSITY-ONLY MATCHING WOULD MAKE THE NULL WORTHLESS. A random matrix
    matched on density alone does not reproduce the relation matrix's
    row-weight law or its column-frequency law, so a measured separation
    could be an unmatched moment rather than structure. The null is therefore
    matched on dimension, density AND row-weight distribution, and the
    column-frequency law is reported alongside so a reviewer can see which
    moments were matched and which were not.
    WHY A SECOND, CURVE-FREE SYNTHETIC ARM IS REQUIRED AND NOT OPTIONAL. If a
    generator that reproduces the relation matrices' shape and weight laws
    with NO CURVE IN THE LOOP produces the same solver cost, then the measured
    cost is a function of shape and weight law only, and no linear-algebra
    measurement in this lane may be quoted as a curve-specific or
    endomorphism-specific result. That generator already exists in the lane's
    own design space as the matched null of EXP-EQLA-95fa76, whose arm E is a
    curve-free relation-matrix-shaped object with matched shape, density and
    column-orbit partition; reusing it rather than building a second one is
    both cheaper and the correct cross-record discipline.
    WHY CORRECTNESS COMES BEFORE TIMING. A solver that returns a wrong kernel
    element cheaply is not fast. The known-solution control is blocking and
    no count is admitted until it passes.
  assumptions:
    - >-
      COST UNIT- F_N FIELD OPERATIONS, with MULTIPLICATIONS and ADDITIONS
      counted in separate columns. They are summed only under an explicitly
      declared relative weight, reported at weights in {1, 2, 5}
      multiplications per addition-equivalent, one row per weight. MEMORY
      UNIT- STORED F_N ELEMENTS, measured by an explicit program counter,
      with an allocator-level byte probe reported SIDE BY SIDE as a
      cross-check and never substituted for the element count. WALL CLOCK, in
      SECONDS, is a machine-tagged secondary column only.
    - >-
      NO COMBINED TOTAL WITH ANY GROUP-OPERATION QUANTITY IS EMITTED. This is
      an assumption about the record's interface, not about mathematics, and
      it is enforced as an invalidation rule.
    - >-
      Relation matrices from the lane's runs are retained or regenerable.
      STAGE 0 of the contract DETERMINES which, reports the inventory, and
      narrows the scope to what is actually available rather than assuming
      availability.
    - >-
      Both solvers are implementable or available in a form whose operation
      count is measurable rather than opaque. A library whose internal
      operation count cannot be instrumented is not admissible as an
      instrument here, however fast it is.
    - >-
      The functional form Theta(n^2 * w) is stated as a comparison reference
      derived in-record from the iteration structure, NOT as a cited
      complexity result. Nothing here depends on any external analysis being
      correct.
  proof_search_map:
    bottleneck: >-
      The number of field operations to obtain a kernel element of the
      relation matrix. The exact step whose removal changes the lane's second
      cost term is the matrix-vector product loop and the iteration count
      that drives it.
    baseline_embedding:
      parameter_slice: >-
        THE MATCHED RANDOM SPARSE MATRIX at the same dimension, density and
        row-weight law - the object for which the cited asymptotic is
        supposed to be exactly right. The solvers must reproduce the
        Theta(n^2 * w) form on it as a function of n at fixed w.
      reproduction_check: >-
        Fit the measured field-operation count against n at fixed w on the
        RANDOM arm; the fitted exponent must approach 2 as n grows across the
        available range. A random-arm exponent far from 2 means the solvers
        are not in their modelled regime at these dimensions AT ALL, which
        would make the real-versus-random comparison the only admissible
        output and the asymptotic comparison inadmissible.
    observation_collision:
      observable: >-
        The measured field-operation count alone.
      distinct_preimage_search: >-
        COLLISION EXHIBITED. The same field-operation count arises from a
        larger matrix with fewer iterations and from a smaller matrix with
        more, and from the same matrix under two different blocking
        parameters. The scalar does not identify the solve; the identifying
        tuple is (dimension, average row weight, iteration count, block size,
        peak stored elements), and every row must carry all five.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The solve cost as a measured function of (dimension, row weight,
          structure source) with three arms - real, matched random, and
          curve-free synthetic - sharing one instrumented solver.
        predicted_gain: >-
          Replaces a cited term with a measured one over the dimensions the
          lane actually reaches, and says explicitly where that measurement
          stops being informative. NO EXPONENT IS CLAIMED OR MOVED.
    quantifier_order: >-
      CLAIMED. FOR ALL retained relation matrices in the tested dimension
      range, the measured field-operation count lies within a factor 1.5 of
      the matched-random-sparse null at the same dimension and row-weight
      law. NOT CLAIMED- anything at dimensions above the tested range;
      anything about the asymptotic regime; anything about designed or
      endomorphism-structured supports, which is KN-OPEN-006's question and
      for which this measurement is only the BASELINE.
    method_ceiling:
      strongest_certifiable_claim: >-
        'At the tested dimensions, with these solvers and this
        instrumentation, the lane's real relation matrices cost X field
        operations and Y stored elements to solve, against Z on a matched
        random null.' It can NEVER certify the asymptotic behaviour, the cost
        at dimensions the lane has not reached, or that a structured support
        would do better or worse.
      nearby_object_control: >-
        THE KNOWN-SOLUTION MATRIX, on which the solver's answer is known in
        advance, and the IDENTITY AND PERMUTATION matrices, whose solve cost
        is known by inspection. A solver that misprices those is not
        measuring solve cost. Beyond correctness, the CURVE-FREE SYNTHETIC
        arm is the nearby object that must reproduce the real arm's cost if
        the cost is structural rather than curve-derived.
    proof_obligations:
      - claim: >-
          Solver correctness verified on a known-solution matrix before any
          count is admitted.
        responsibility: correctness
      - claim: >-
          The random arm's fitted exponent in n approaches 2 across the
          available range, or the asymptotic comparison is declared
          inadmissible.
        responsibility: baseline
      - claim: >-
          Real-versus-random ratio within 1.5 at every tested dimension.
        responsibility: runtime
      - claim: >-
          Peak working set reported in stored field elements with an
          allocator probe beside it.
        responsibility: memory
      - claim: >-
          No combined total with any group-operation quantity is emitted.
        responsibility: interface
      - claim: >-
          No matrix with zero rows, zero columns, or fewer rows than columns
          is priced.
        responsibility: feasibility
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-EQLA-1
      formal_statement: >-
        Solver cost measured on the lane's toy relation matrices reflects the
        cost behaviour at the dimensions the ICEX exponent comparison
        targets.
      random_model_justification: >-
        The rigorous ingredient is that the iteration structure of block
        Wiedemann and block Lanczos gives Theta(n) matrix-vector products of
        Theta(n*w) field operations each, so the functional form Theta(n^2*w)
        is derivable from the algorithms themselves rather than assumed. THE
        GAP, WHICH IS THE RECORD'S CENTRAL LIMITATION- at toy dimensions the
        asymptotic regime has NOT been reached and startup costs dominate, so
        a toy measurement may say nothing at all about the regime that
        matters. There is no correspondence trick available here that would
        reach cryptographic matrix dimensions, so THE TRANSFER IS STATED AND
        UNJUSTIFIED, and the record is honest about being a toy measurement
        rather than a validated cost term.
      supporting_results:
        - ref: RQ-EQLA-0d3f40
          provenance: internal
          claim: >-
            That the lane's question is whether module structure in a
            relation matrix reduces linear-algebra cost, that a matched null
            of identical shape and density is BLOCKING, and that evidence
            from its runs is capped at claim_tier toy.
          verified_by: >-
            coordinator, TASK-20260904-e87737 (question record read in full)
        - ref: EXP-EQLA-95fa76
          provenance: internal
          claim: >-
            The existence of a designed curve-free generator emitting a
            relation-matrix-shaped object from a declared parameter vector
            with NO CURVE IN THE LOOP, matched on shape, density, row-weight
            law and column-orbit partition, together with its planted-signal
            and planted-deficiency self-checks. That contract is DRAFT and
            unapproved; this hypothesis reuses its generator design rather
            than assuming its results.
          verified_by: >-
            coordinator, TASK-20260904-e87737 (contract read in full,
            276 lines; its status is draft with approved_by null and
            hypothesis_id explicitly null, and nothing here treats it as
            executed)
      validation_experiment_ids:
        - EXP-ICEX-7ea77e
      falsification_condition: >-
        Measured cost failing to approach the Theta(n^2*w) form as matrix
        dimension grows across the available range - specifically, a fitted
        exponent in n on the RANDOM arm that does not trend toward 2. That
        would show the tested dimensions are entirely pre-asymptotic and that
        no statement about the lane's cited term may be drawn from them in
        either direction.
  structural_ingredients:
    - description: >-
        The iteration structure of block Wiedemann and block Lanczos-
        Theta(n) matrix-vector products at Theta(n*w) field operations each -
        re-derived in-record and used only as a comparison reference.
      citation: re-derived in-record; no external complexity result relied on
      provenance: internal
      verified_by: coordinator, TASK-20260904-e87737
      role: the functional form the measurement is compared against
    - description: >-
        The lane's blocking matched-null requirement and its toy claim-tier
        cap.
      citation: RQ-EQLA-0d3f40
      provenance: internal
      verified_by: coordinator, TASK-20260904-e87737
      role: the control discipline and the evidence ceiling
    - description: >-
        A designed curve-free relation-matrix generator with matched shape,
        density, row-weight law and column-orbit partition, plus planted
        positive and planted-deficiency self-checks.
      citation: EXP-EQLA-95fa76
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-e87737 (read in full; contract is DRAFT
        and unapproved, and no result of it is assumed)
      role: the curve-free arm's generator, reused rather than rebuilt
  reduction_chain:
    core_problem: >-
      Measured block Wiedemann and block Lanczos cost, in field operations
      and stored field elements, on the relation matrices this lane produces,
      against a matched random null and a curve-free synthetic null.
    corollaries:
      - problem: >-
          The linear-algebra term of the charged ICEX exponent comparison.
        reduction_ref: >-
          Internal- the comparison is RQ-ICEX-001's and is not performed
          here. The term produced is in FIELD operations and requires an
          explicitly declared conversion before it can be combined with the
          relation term.
        asymptotics_preserved: >-
          Not applicable; no asymptotic statement is made or transferred, and
          the tested dimensions are declared pre-asymptotic.
  predictions:
    - metric: >-
        P1- solver correctness on a known-solution matrix
      direction: different
      minimum_effect: >-
        FORCED CORRECT before any timing or count is recorded. A failure
        means the implementation is wrong and NO count is admissible.
    - metric: >-
        P2- ratio of measured FIELD OPERATIONS on real relation matrices to
        the matched-random-sparse null at the same dimension, density and
        row-weight law
      direction: different
      minimum_effect: >-
        PRE-REGISTERED WITHIN A FACTOR 1.5 at every tested dimension.
        FALSIFIED if the ratio exceeds 1.5 at a majority of dimensions with a
        consistent sign. Above 1.5- the lane's second term is UNDERSTATED,
        the direction that flatters index calculus. Below 1/1.5- it is
        OVERSTATED and the ICEX exponent improves for index calculus.
    - metric: >-
        P3- fitted exponent of measured field operations against dimension n
        at fixed row weight w, on the RANDOM arm
      direction: different
      minimum_effect: >-
        PREDICTED TO TREND TOWARD 2 across the available dimension range. A
        fitted exponent below 1.5 or above 2.5 at the largest available
        dimension means the tested regime is entirely pre-asymptotic, and
        then NO comparison against the cited asymptotic is admissible - only
        the real-versus-random ratio survives.
    - metric: >-
        P4- peak solver working set, in STORED F_N ELEMENTS, per solver per
        matrix, with an allocator-level byte probe reported beside it
      direction: different
      minimum_effect: >-
        REPORTED FOR EVERY CELL. A memory column absent from a
        linear-algebra cost record makes the record incomplete under
        AGENTS.md rule 4; and the element count and the byte probe must move
        in the same direction, since a divergence means one of them is
        measuring something else.
    - metric: >-
        P5- curve-free synthetic arm's field-operation count against the real
        arm at matched shape and weight law
      direction: different
      minimum_effect: >-
        PREDICTED WITHIN THE SAME FACTOR 1.5. If it holds, the measured solve
        cost is a function of SHAPE AND WEIGHT LAW ONLY, and no
        linear-algebra measurement in this lane may be quoted as a
        curve-specific or endomorphism-specific result. A departure above 1.5
        IS the curve-derived content and is the interesting outcome.
    - metric: >-
        P6- block Wiedemann against block Lanczos on the same matrices
      direction: different
      minimum_effect: >-
        REPORTED SEPARATELY AND NEVER AVERAGED. Their costs differ on
        structured input and the lane's cited term must name which solver it
        refers to; a term quoted without its solver is not identifying.
  test_boundary:
    instances:
      - >-
        The lane's retained relation matrices, at whatever dimensions Stage 0
        finds them - the inventory is a deliverable, not an assumption
      - >-
        MATCHED RANDOM SPARSE NULL at the same dimension, density and
        row-weight law
      - >-
        CURVE-FREE SYNTHETIC ARM from a relation-matrix-shaped generator with
        no curve in the loop, matched on shape, density, row-weight law and
        column-frequency law
      - >-
        KNOWN-SOLUTION, IDENTITY and PERMUTATION matrices as correctness and
        known-answer controls
    parameters:
      dimension: 'every retained matrix, spanning as wide a range as the lane''s runs provide'
      row_weight: 'as produced, reported per matrix; matched exactly in the null arms'
      solver: 'block Wiedemann and block Lanczos, reported separately'
      block_size: 'declared and swept over at least two values, since it is part of the identifying tuple'
      addition_weight: '1, 2, 5 multiplications per addition-equivalent'
    implementation: >-
      Instrumented solvers with explicit field-operation counters and an
      explicit stored-element counter, plus an allocator-level byte probe as
      a cross-check. A library whose internal operation count cannot be
      instrumented is not admissible as the instrument.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 4.0
      maximum_memory_gb: 8
      maximum_runs: 24
  falsification_conditions:
    - >-
      F1. Solver correctness fails on the known-solution matrix.
      IMPLEMENTATION WRONG- no timing or count is admissible. An
      infrastructure outcome under AGENTS.md rule 5.
    - >-
      F2. Real matrices match the random reference within 1.5 at every
      dimension. The cited asymptotic is adequate at the tested dimensions
      and the lane's citation is justified there - the predicted outcome, and
      a real one.
    - >-
      F3. Real matrices solve materially FASTER (ratio below 1/1.5,
      consistent sign, majority of dimensions). The lane's linear-algebra
      term is OVERSTATED and the ICEX exponent improves for index calculus.
    - >-
      F4. Real matrices solve materially SLOWER (ratio above 1.5, consistent
      sign, majority of dimensions). The term is UNDERSTATED - the direction
      that would be easy to miss and that flatters index calculus if
      unmeasured.
    - >-
      F5. The random arm's fitted exponent does not trend toward 2. The
      tested dimensions are entirely pre-asymptotic; the comparison against
      the cited asymptotic is INADMISSIBLE and only the real-versus-random
      ratio survives.
    - >-
      F6. The curve-free synthetic arm reproduces the real arm within 1.5, as
      predicted. The measured cost is a function of shape and weight law, and
      no linear-algebra measurement here may be read as a curve statement.
    - >-
      F7. Stage 0 finds no retained matrices and regeneration exceeds the
      budget. The contract's scope narrows to whatever is regenerable and
      that narrowing is reported; it is a scope outcome, not a negative
      result.
  interpretation_limits:
    - >-
      MEASURES A COST TERM; PRODUCES NO EXPONENT AND NO COMPARISON. The ICEX
      exponent decision remains RQ-ICEX-001's.
    - >-
      SCOPED TO THE LANE'S ACTUAL MATRICES AT THEIR CURRENT SIZES, which are
      TOY. Evidence is capped at claim_tier toy per RQ-EQLA-0d3f40's
      constraint.
    - >-
      SMALL-MATRIX BEHAVIOUR DOES NOT EXTRAPOLATE TO THE SIZES WHERE THE
      EXPONENT WOULD MATTER, AND THERE IS NO CORRESPONDENCE TRICK AVAILABLE
      HERE TO REACH THEM. THE ASYMPTOTIC TRANSFER IS NOT TESTABLE AT
      REACHABLE SCALE and is stated as an unjustified assumption rather than
      approximated.
    - >-
      THE OUTPUT IS IN FIELD OPERATIONS AND MAY NOT BE ADDED TO ANY
      GROUP-OPERATION QUANTITY without an explicitly declared, recorded
      conversion. This record emits no combined total.
    - >-
      DENSITY-ONLY MATCHING WOULD MAKE THE NULL WEAK; the null is matched on
      the row-weight law too, and the column-frequency law is reported
      alongside so a reviewer can see which moments were matched.
    - >-
      SAYS NOTHING ABOUT DESIGNED OR ENDOMORPHISM-STRUCTURED SUPPORTS, which
      is KN-OPEN-006's question. This measurement is the BASELINE that
      question needs and is not an answer to it.
    - >-
      IF THE CURVE-FREE ARM REPRODUCES THE COST, as predicted, nothing here
      is a statement about elliptic curves.
