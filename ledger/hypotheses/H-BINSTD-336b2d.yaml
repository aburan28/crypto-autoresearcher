hypothesis:
  id: H-BINSTD-336b2d
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-6cf862
  experiment_id: EXP-BINSTD-becc4b
  specified_at: '2026-10-01'
  status: approved
  proposed_by: idea-generator
  approved_by_decision: DEC-20261001-327951
  title: >-
    On the five composite-degree ANSI X9.62 binary curves, the F_{2^16}-rational
    factor base meets the prime-order subgroup only at the identity when the
    published cofactor equals #E(F_{2^16}) and is coprime to the published
    subgroup order, and the phi-stable F_{2^16}-subspaces of F_{2^{16k}} are
    the monic divisors of T^k-1 with the dimension sets predicted by
    d = ord_k(2^16).
  statement: >-
    Let q = 2^16 and let k be one of 11, 13, 17, 19, 23, corresponding to the
    named curves c2pnb176v1, c2pnb208w1, c2pnb272w1, c2pnb304w1, c2pnb368w1
    in analysis/binstd-curve-audit/binary-curve-params.txt. Let h be the
    published cofactor and r the published Order integer in that file, and let
    t = q + 1 - h. Claim (A): h equals the audit cofactor (65390, 65096, 65286,
    65070, 65392 respectively), the Weil count of E(F_q) is h, r is prime,
    gcd(h, r) = 1, and therefore the only F_q-rational point in a cyclic
    subgroup of order r is the identity. Claim (C): T^k - 1 is square-free over
    F_q and splits into exactly 1 + (k - 1)/d distinct monic irreducibles, where
    d = ord_k(q), with one factor of degree 1 and (k - 1)/d factors of degree d.
    The F_q-dimensions of the phi-stable subspaces are {k - deg g} as g runs
    over the monic divisors. The preregistered values are d = 5, 3, 1, 9, 11
    and irreducible-factor counts 3, 5, 17, 3, 3.
  mechanism: >-
    E(F_q) = ker(phi - 1) has order q + 1 - t. If that order equals the
    published cofactor h and r is a prime not dividing h, then a subgroup of
    order r meets E(F_q) only at the identity, so no non-identity target in
    that subgroup is a sum of F_q-rational points. Separately, a normal basis
    realises F_{q^k} as a free rank-one module over F_q[T]/(T^k - 1) with T
    acting as the q-power Frobenius, so the phi-stable F_q-subspaces are the
    ideals, i.e. the monic divisors of T^k - 1. This contract tests those two
    arithmetic statements. It does not build relations or price an attack.
  assumptions: []
  proof_search_map:
    bottleneck: >-
      Exact irreducible factorization of T^k - 1 over F_{2^16} for the five
      primes k, together with primality of the published Order integer. Removing
      either leaves the dimension census or the coprimality certificate unproved.
    baseline_embedding:
      parameter_slice: >-
        The five rows of analysis/binstd-curve-audit/audit-certificate.txt:
        cofactors 65390, 65096, 65286, 65070, 65392 and implied traces 147, 441,
        251, 467, 145. Reproduce h = q + 1 - t against those integers before
        interpreting gcd.
      reproduction_check: >-
        Parse Cofactor from binary-curve-params.txt and require equality with
        q + 1 - t and with the audit table. A mismatch stops the run as an
        instrument or transcription failure.
    observation_collision:
      observable: >-
        The set of F_q-dimensions of monic divisors of T^k - 1, and the
        irreducible-degree multiset.
      distinct_preimage_search: >-
        Compute the degree multiset by factoring, and compute the predicted
        multiset from d = ord_k(q) by the cyclotomic splitting count. The two
        routes use different code. Agreement is the collision; disagreement
        localises to the factorisation or to the order formula.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Phi-stable subspaces as monic divisors of T^k - 1, replacing a search
          over subspaces of F_{q^k}.
        predicted_gain: >-
          The census becomes a factorisation of one degree-k polynomial. No
          attack exponent moves.
    quantifier_order: >-
      For every k in {11, 13, 17, 19, 23}, after the published (h, r) for the
      matching curve are parsed, the claims are: r is prime, gcd(h, r) = 1,
      h = q + 1 - t, and every monic-divisor dimension lies in the preregistered
      set. The factorisation witness is exhibited, not assumed. The order
      formula does not depend on the curve coefficients.
    method_ceiling:
      strongest_certifiable_claim: >-
        A finite certificate for these five parameter rows: cofactor identity,
        primality and coprimality, and the stable-dimension set. No ECDLP
        solution, no relation count, and no cost comparison with rho.
      nearby_object_control: >-
        The same factorisation code on T^17 - 1 over F_2. There ord_17(2) = 8,
        so the predicted irreducible count is 3, not 17, and the dimension set
        is not {0, 1, ..., 17}. An implementation that reports 17 linear factors
        over F_2 has proved too much and is invalid.
    proof_obligations:
      - claim: h = q + 1 - t equals the published cofactor on each row.
        responsibility: baseline
      - claim: The published Order integer is prime and coprime to h.
        responsibility: correctness
      - claim: The factor-degree multiset matches the preregistered multiset.
        responsibility: size
      - claim: The F_2, k = 17 control returns 3 irreducibles, not 17.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: >-
        The number of rational points on an elliptic curve over a finite field
        is q + 1 - t with t the trace of Frobenius.
      citation: >-
        Standard Weil formula. Not opened as a primary source in this design
        session. The numerical cofactors used here were read from
        analysis/binstd-curve-audit/audit-certificate.txt.
      provenance: recalled
      verified_by: null
      role: order of E(F_q)
    - description: >-
        For k odd, T^k - 1 is separable in characteristic 2, and the k-th
        cyclotomic polynomial splits into (k - 1)/ord_k(q) irreducibles of
        degree ord_k(q) over F_q.
      citation: >-
        Standard finite-field cyclotomic factorisation. Not opened as a primary
        source in this design session. The experiment must exhibit the factors
        rather than trust the count.
      provenance: recalled
      verified_by: null
      role: predicted factor-degree multiset
    - description: >-
        All five composite-degree ANSI binary curves are subfield curves over
        F_{2^16}, with the cofactors and implied traces listed in the audit
        certificate, and the Weil recursion reproduces the published group order.
      citation: analysis/binstd-curve-audit/README.md
      provenance: internal
      verified_by: >-
        coordinator session 2026-10-01 (README.md and audit-certificate.txt
        read; binary-curve-params.txt read for c2pnb176v1)
      role: parameter table the certificate must reproduce
  reduction_chain:
    core_problem: >-
      Decide emptiness of the F_q-rational factor base inside the prime-order
      subgroup, and list the phi-stable F_q-dimensions, at the five named rows.
    corollaries: []
  predictions:
    - metric: irreducible_factor_count
      direction: different
      minimum_effect: >-
        Counts 3, 5, 17, 3, 3 at k = 11, 13, 17, 19, 23 over F_{2^16}. Any
        other agreed count on any k is a negative result for that row.
    - metric: stable_dimension_set
      direction: different
      minimum_effect: >-
        {0,1,5,6,10,11}, {0,1,3,4,6,7,9,10,12,13}, {0,1,...,17},
        {0,1,9,10,18,19}, {0,1,11,12,22,23} respectively.
    - metric: gcd_h_r
      direction: different
      minimum_effect: >-
        gcd(h, r) = 1 and r prime on every row. A composite Order is a negative
        result for the proposal's primality clause on that row.
  test_boundary:
    instances:
      - c2pnb176v1
      - c2pnb208w1
      - c2pnb272w1
      - c2pnb304w1
      - c2pnb368w1
    parameters:
      field: F_{2^16}
      extension_degrees: [11, 13, 17, 19, 23]
      parameter_file: analysis/binstd-curve-audit/binary-curve-params.txt
    implementation: >-
      Two factorisation implementations that do not import each other, plus the
      F_2 control at k = 17. No point enumeration on the deployed curves.
    budget:
      maximum_runs: 2
      maximum_memory_gb: 2
      maximum_workers: 1
  falsification_conditions:
    - >-
      The two independent factorisations agree with each other and disagree
      with the preregistered degree multiset or dimension set on any k.
    - >-
      Parsed h, r satisfy h = q + 1 - t and the implementations agree, but r is
      composite or gcd(h, r) != 1.
  interpretation_limits:
    - >-
      Scope is these five parameter rows and the F_2, k = 17 control. A pass
      does not transfer to any other curve, base field, or factor base.
    - >-
      A pass does not say that index calculus on these curves is feasible, and
      it does not move an exponent. The proposal's balance heuristic and toy
      relation census are a different experiment.
    - >-
      Design-time order arithmetic in this session recomputed ord_k(2) and
      ord_k(2^16) only. It did not factor T^k - 1 and is not a run of
      EXP-BINSTD-becc4b.
  dominated_by: >-
    Not re-derived here. IDEA-20260922-6cf862 states that matched Pollard rho
    dominates every design point it exhibits, and its frontier_check status is
