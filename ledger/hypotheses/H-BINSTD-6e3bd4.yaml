    - metric: reachability_cell_verdict
      direction: flat
      minimum_effect: OPEN with named missing quantity (per-trial cost arity 10-22)
    - metric: gorla_massierer_calibration_ratio_g2_g4
      direction: unknown
      minimum_effect: >-
