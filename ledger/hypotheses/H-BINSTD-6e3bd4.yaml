# H-BINSTD-6e3bd4 -- Trace-zero-variety Arm B naive cost at five deployed ANSI
# rows is an invalid extrapolation (rho_reg>=1); cell OPEN with named missing
# quantity = per-trial decomposition cost at arity 10-22.
# Specified and approved under DEC-20261001-bcc056 from IDEA-20260922-8278db
# under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001, absorbing the 2026-09-26 review
# defects (analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-8278db.yaml;
# verdict sound / HOLD-L design_after): corrected rho comparator; Gorla-
# Massierer literature gate; tripwire that (B) numbers never ship without
# (C) and (D).
#
# ZERO RUNS in this design packet. IDEA-20260922-8278db claim text is not
# edited (proposals immutable); this hypothesis cites it and freezes the
# review-absorbed restatement for experimental purposes.
# =============================================================================
hypothesis:
  id: H-BINSTD-6e3bd4
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-8278db
  experiment_id: EXP-BINSTD-1a7892
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-01'
  approved_at: '2026-10-01'
  authorised_by: DEC-20261001-bcc056
  review_cited: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-8278db.yaml
  proposed_by: coordinator
  title: >-
    Trace-zero-variety Gaudry Arm B naive cost at five deployed c2pnb rows
    lands below matched rho only by misapplying a fixed-g asymptotic
    (rho_reg=g/log2(q)>=1 at 3/5 rows); reachability cell OPEN with named
    missing quantity = per-trial decomposition cost at arity 10-22

  statement: >-
    SETTING. E/F_q, q=2^16, over F_{q^k}, k in {11,13,17,19,23} prime
    (analysis/binstd-curve-audit/). IDEA-20260906-a77711 Arm B proposes
    index calculus on the trace-zero variety T_k = ker(Tr : Res_{F_{q^k}/F_q}(E)
    -> E), an abelian variety of dimension g=k-1 over F_q containing G, via
    Gaudry's abelian-variety algorithm at cost q^{2-2/g} (up to polylog) with
    disclosed (g)!-class per-relation overhead that a77711 flags as making
    "the exponent meaningless for n growing with the field."

    (A) STRUCTURAL FIT (UNCONDITIONAL ARITHMETIC). Audited cofactor h~q and
    total order ~q^k imply r~(q^k)/h ~ q^{k-1}. Bit check: 16(k-1) =
    160,192,256,288,352 vs audited r bit-lengths 161,193,257,289,353 —
    agreement to within one bit at every row (Hasse rounding).

    (B) NAIVE CHARGED NUMBER (ARITHMETIC ONLY; NOT A COST CLAIM). Charging
    q^{2-2/g}*(k-1)! in bits:
      k=11 (g=10): 16*(2-2/10)+log2(10!)=28.80+21.79=50.6
      k=13 (g=12): 16*(2-2/12)+log2(12!)=29.33+28.84=58.2
      k=17 (g=16): 16*(2-2/16)+log2(16!)=30.00+44.25=74.3
      k=19 (g=18): 16*(2-2/18)+log2(18!)=30.22+52.51=82.7
      k=23 (g=22): 16*(2-2/22)+log2(22!)=30.55+69.93=100.5
    Against reused matched-rho column from IDEA-20260922-d11575/c07598
    (2^77.9..2^173.3, 0.5-bit-low convention): margins 27.3, 35.5, 51.3,
    58.8, 72.8 bits BELOW rho, growing with k. HOLD-L DEFECT ABSORBED:
    Stage 0 ALSO reports the canonical comparator sqrt(pi*r/(4k)) in a
    SEPARATE column; that widens each margin by ~0.5 bit and strengthens
    the "apparent break" the record discredits — it does NOT license
    reporting a break.

    (C) REGIME FAILURE. Gaudry's q^{2-2/g} assumes g FIXED, q->infinity.
    Regime ratio rho_reg = g/log2(q)=(k-1)/16: 0.625, 0.750, 1.000, 1.125,
    1.375. Exactly 1 at k=17; exceeds 1 at k=19,23. This quantifies
    a77711's own disclaimer at these five rows.

    (D) NAMED MISSING QUANTITY. The (k-1)! charge prices trial COUNT under
    H2 (decomposition probability ~1/(k-1)!), NOT the cost of ONE trial
    (solving/testing an arity-g Weil-descended system). Per
    IDEA-20260807-32f96d, arity m>=4 has ZERO measured cost cells in this
    corpus. The reachability-table cell for "decomposition-based index
    calculus via T_k" on these five rows is therefore OPEN with that
    per-trial cost at arity 10-22 over F_{2^16} named — not STRUCTURALLY
    EMPTY, not DEFINED WITH A COMPUTED COST.

    TRIPWIRE T4 (HOLD-L): any downstream citation of (B)'s numbers without
    also citing (C) and (D) is a misuse. This hypothesis does NOT claim a
    break of any of the five curves.

  statement_note: >-
    IDEA-20260922-8278db claim text is immutable and left at status proposed.
    Review verdict sound (HOLD-L design_after). Defects absorbed: (1) dual
    rho columns (reused + canonical); (2) Gorla-Massierer measured g=2,4
    costs are a Stage-1 literature gate before any cell moves toward
    DEFINED; (3) T4 tripwire frozen into interpretation_limits and success
    criteria. ECC2K-130 bearing: zero operational transfer (n=131 prime —
    no proper subfield, no T_k); methodological transfer only (rho_reg gate).

  mechanism: >-
    OBJECT FRAME. Representation: x-coordinate of a point of T_k(F_{q^k})
    restricted to its F_q-rational structure (a77711 Arm B; R1 of
    RQ-ECDLP-623a32). Operation set Sigma: translation by the factor base
    inside T_k — partial action, Class I. WHAT IS TESTED is not a new
    object but a COST-AUDIT protocol: (i) reproduce the naive arithmetic
    and regime ratio; (ii) calibrate H2 against Gorla-Massierer measured
    per-relation cost at g=2,4; (iii) measure per-trial decomposition
    cost vs g at toy subfield cells and fit a growth law with stated
    extrapolation distance to deployed g in {10..22}. F2 (factor-base
    decomposition) and F6 (trace endomorphism) are declared components;
    no new mechanism is proposed.

  assumptions:
    - k odd prime, q=2^16 as audited; r~q^{k-1} to within one bit (A).
    - a77711 H2 (decomposition probability ~1/(k-1)!) imported for the
      probability half only; per-trial cost is explicitly UNASSUMED
      (H-8278db-2 / HEUR-BINSTD-6e3bd4-H2).
    - Gaudry q^{2-2/g} is the asymptotic formula under test for regime
      validity, not re-derived here (provenance recalled on primary source;
      internal via a77711).
    - No scientific run at deployed field sizes; deployed rows appear only
      as Stage 0 arithmetic cells.
    - Toy Stage 2 cells reach g<=8 against deployed g up to 22; extrapolation
      distance is large and must be stated, never hidden.

  proof_search_map:
    bottleneck: >-
      Per-trial solving cost of one arity-(k-1) decomposition attempt on a
      Weil-descended T_k system over F_{2^16}, at g in {10,12,16,18,22} —
      unmeasured in this program above arity 3-4 (IDEA-20260807-32f96d).
    baseline_embedding:
      parameter_slice: >-
        g=2,4 (k'=3,5) matching a77711's toy ladder and Gorla-Massierer's
        implemented cases; then toy ladder g in {2,4,6,8} at (d,k')=
        (4,3),(4,5),(4,7),(4,9), dk' in {12,20,28,36} <=41.
      reproduction_check: >-
        (i) Stage 0: naive bits and rho_reg match frozen expected within
        0.5 bit / 0.01. (ii) Stage 1: Gorla-Massierer measured per-relation
        cost at g=2,4 read at source and compared to H2-only prediction.
        (iii) Stage 2: g=2 cell reproduces a finite measured cost (instrument
        smoke); null non-subfield curve reports no T_k construction.
    observation_collision:
      observable: >-
        Gap between (i) naive (k-1)!-charged bits and (ii) measured
        per-relation / per-trial cost at growing arity.
      distinct_preimage_search: >-
        "Naive number below rho" admits (a) formula valid despite
        rho_reg>=1 (implausible given deployment history) or (b) formula
        invalid and true per-trial cost large (stated expectation).
        Distinguisher: measured per-trial cost growth in g (Stage 2) plus
        literature calibration (Stage 1). Artifact tell: cost that fails
        to grow when arity grows, or growth that vanishes under the
        matched non-T_k same-arity control.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          T_k as (k-1)-dimensional subvariety of Res(E) with F_q-linear
          trace-zero factor base (a77711; cited, not modified).
        predicted_gain: >-
          NONE CLAIMED. This hypothesis evaluates a77711's own predicted
          gain at deployed parameters and files the evaluation as
          untrustworthy pending (D).
      - transform: stronger_invariant
        proposed_object: >-
          Standing rho_reg = g/log2(q) gate on every q^{2-2/g} /
          decomposition reachability cell (review successor_seam).
        predicted_gain: >-
          Prevents filing a misapplied asymptotic as DEFINED cost; forces
          OPEN + named missing quantity when rho_reg approaches/exceeds 1.
    quantifier_order: >-
      FOR EACH of the five rows, the naive charged cost (B) and rho_reg (C)
      are exact arithmetic consequences of stated formulas (Stage 0).
      SEPARATELY, THERE EXISTS no corpus measurement of per-trial
      decomposition cost at arity>=4, so TRUE cost at arity 10-22 is
      UNKNOWN. Verdict OPEN follows from the second statement. NOT
      CLAIMED: any break; any defined attack cost; any exponent move.
    method_ceiling:
      strongest_certifiable_claim: >-
        (i) Naive Arm B arithmetic + rho_reg at five rows; (ii) dual rho
        margins under reused and canonical comparators; (iii) OPEN cell
        with named missing quantity; (iv) Stage-1 calibration ratio at
        g=2,4 if literature retrieved; (v) Stage-2 fitted growth law at
        g<=8 with stated extrapolation distance to g=22. Cannot certify
        a break or a deployed attack cost; cannot move an exponent.
      nearby_object_control: >-
        BLOCKING. (1) PROVES-TOO-MUCH / small-g sanity: at k'=3,g=2 the
        naive number is deep inside rho_reg=0.125 and expected cheap —
        formula behaves where it should. (2) NULL: curve not over a
        subfield — no T_k; instrument must report no construction.
        (3) Matched non-T_k same-arity factor base — isolates arity-driven
        vs T_k-specific cost growth.
    proof_obligations:
      - claim: r~q^{k-1} to within one bit at all five rows
        responsibility: baseline
      - claim: Factorial magnitudes and log2 values in (B) arithmetically correct (±0.5 bit)
        responsibility: correctness
      - claim: q^{2-2/g} evaluations in (B) arithmetically correct
        responsibility: correctness
      - claim: rho_reg=(k-1)/16 exact per row; >=1 at k in {17,19,23}
        responsibility: correctness
      - claim: Canonical rho column reported separately from reused d11575 column
        responsibility: scope
      - claim: Per-trial cost at arity 10-22 unmeasured in corpus (cite 32f96d; Stage 0 recheck)
        responsibility: scope
      - claim: No break claim; (B) never emitted without (C) and (D)
        responsibility: scope
      - claim: ECC2K-130 has no T_k (n prime); zero operational transfer stated
        responsibility: scope

  asymptotic_claim:
    problem: >-
      Decomposition-based index calculus via the trace-zero variety T_k on
      the prime-order subgroup of the five composite-degree ANSI X9.62
      binary curves (c2pnb* family)
    prior_best: >-
      Pollard rho with negation and Frobenius classes; reused column
      0.886*sqrt(r)/sqrt(2k); canonical comparator sqrt(pi*r/(4k))
    time_exponent: >-
      UNKNOWN. Naive Arm B suggests a shrinking exponent on l as k grows
      at fixed q — treated as further evidence of regime failure, not as
      a claimed complexity.
    memory_exponent: >-
      Roughly q^{1-1/g} (~q, independent of growing k) — comparatively more
      trustworthy than the time claim; still not promoted.
    hidden_cofactor: >-
      Per-trial decomposition solving cost at arity 10-22 over F_{2^16},
      wholly unmeasured; (k-1)! is a trial-count placeholder that may
      severely understate total cost.
    claim_kind: open_question_with_named_missing_quantity

  heuristic_assumptions:
    - id: HEUR-BINSTD-6e3bd4-H0
      formal_statement: >-
        r ~ q^{k-1} TO WITHIN ONE BIT at each of the five audited rows.
        Unconditional given audited h~q and Hasse; recorded as HEUR id for
        Stage 0 falsification hook only.
      random_model_justification: >-
        RIGOROUS: Weil/Hasse plus audited cofactor identity
        (IDEA-20260922-6cf862 result A / curve audit).
      supporting_results:
        - ref: IDEA-20260922-8278db
          provenance: internal
          claim: Bit check 160..352 vs audited 161..353
          verified_by: coordinator, this design session (Read, full proposal)
        - ref: analysis/binstd-curve-audit/
          provenance: internal
          claim: Audited q,k,h,r bit-lengths for composite-degree ANSI rows
          verified_by: coordinator, this design session (path present; Stage 0 rechecks)
      validation_experiment_ids:
        - EXP-BINSTD-1a7892
      falsification_condition: >-
        Stage 0 bit check disagrees by more than one bit at any row after
        recompute from audit inputs.
    - id: HEUR-BINSTD-6e3bd4-H1
      formal_statement: >-
        DECOMPOSITION PROBABILITY ~ 1/(k-1)! (a77711 H2, imported). At
        implemented small g, Gorla-Massierer measured per-relation cost
        (once retrieved) is compared to this H2-only prediction to yield a
        calibration ratio; ratio near 1 weakens (D) at small g only.
      random_model_justification: >-
        Classical unordered arity-g factor-base counting heuristic
        (Gaudry–Diem family); attainment is heuristic.
      supporting_results:
        - ref: IDEA-20260906-a77711
          provenance: internal
          claim: H2 decomposition probability ~1/(n-1)!; Arm B T_n construction
          verified_by: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-8278db.yaml
        - ref: 'Gorla, Massierer, arXiv:1405.1059 / iacr:2014/318'
          provenance: recalled
          claim: >-
            Prototype T_k index calculus at n=3,5 with MEASURED per-relation
            costs (pointer only until Stage 1 retrieves and reads)
          verified_by: null
      validation_experiment_ids:
        - EXP-BINSTD-1a7892
      falsification_condition: >-
        Stage 1 retrieved measured cost at g=2 or 4 matches H2-only
        prediction with no extra per-trial overhead (weakens (D) at small g;
        rho_reg argument for g>=16 untouched) — recorded as DO-2, not as
        automatic DEFINED promotion.
    - id: HEUR-BINSTD-6e3bd4-H2
      formal_statement: >-
        PER-TRIAL COST IS THE UNKNOWN. No O(1)/polylog assumption. Stage 2
        measures cost vs g at toy scale and fits a growth law; a priori
        expectation (stated before runs): growth is fast enough to erase
        the 27-to-73-bit naive margin when extrapolated — but extrapolation
        to g=22 is NOT a success criterion and must not move the cell to
        DEFINED without independent review.
      random_model_justification: >-
        Explicitly unassumed; recorded so absence is not read as implicit O(1).
        Prior from DREG/SDEG experience that Weil-descended solving cost
        grows rapidly in arity.
      supporting_results:
        - ref: IDEA-20260807-32f96d
          provenance: internal
          claim: Arity m>=4 has ZERO measured cost cells in the corpus
          verified_by: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-8278db.yaml
      validation_experiment_ids:
        - EXP-BINSTD-1a7892
      falsification_condition: >-
        Stage 2 shows per-trial cost growing only polynomially in g at
        tested cells AND a careful extrapolation (with stated distance)
        leaves a surviving margin below rho — then cell may move toward
        DEFINED only after review-breakthrough (break-adjacent).

