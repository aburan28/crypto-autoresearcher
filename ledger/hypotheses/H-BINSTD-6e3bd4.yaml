      minimum_effect: >-
        0.625, 0.750, 1.000, 1.125, 1.375 (±0.01); exactly 1 at k=17
    - metric: margin_below_rho_bits_dual_columns
      direction: higher
      minimum_effect: >-
        Reused column margins ~27.3..72.8 growing with k; canonical
