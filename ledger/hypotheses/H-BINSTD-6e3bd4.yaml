  reduction_chain:
    core_problem: >-
      Decide the BINSTD reachability-table cell for T_k / Gaudry Arm B on
      the five composite-degree ANSI rows (OPEN vs DEFINED vs inert)
    corollaries:
      - problem: standing rho_reg gate for decomposition/cover asymptotics
