      - >-
        Stage 0 arithmetic cells: five deployed rows q=2^16,
        k in {11,13,17,19,23} (audit identities only; no group walks)
      - >-
        Stage 1 literature cell: Gorla-Massierer iacr:2014/318 / arXiv:1405.1059
        measured per-relation costs at implemented g=2,4
      - >-
        Stage 2 toys: (d,k') in {(4,3),(4,5),(4,7),(4,9)} → g in {2,4,6,8},
        dk' in {12,20,28,36}; T_k descended decomposition system; plus
        null non-subfield curve; plus matched non-T_k same-arity control
    parameters:
      q: [65536]
      k_deployed: [11, 13, 17, 19, 23]
      g_toy: [2, 4, 6, 8]
      d_toy: [4]
    implementation: >-
      Stage 0: pure arithmetic scripts under
      experiments/EXP-BINSTD-1a7892/implementation/. Stage 1: literature
      retrieval + extraction notes (no compute). Stage 2: reuse
      EXP-CERTBIN-e94b27/impl/{macaulay,curve,gf2n}.py plus a new
      T_k / Res(E) descended-system builder; Macaulay-rank instrument may
      cap affordable g — record instrument ceiling explicitly.
    budget:
      wall_clock_seconds: 86400
      memory_gb: 8
      maximum_runs: 40

  falsification_conditions:
    - >-
      Stage 0 recomputation of (B) or (C) disagrees by >0.5 bit or >0.01 in
      rho_reg at any row — arithmetic wrong; supersede, do not patch.
    - >-
      Stage 1 retrieved Gorla-Massierer measured cost at g=2 or 4 matches
      H2-only prediction with no extra per-trial overhead — (D) substantially
      weakened at small g (rho_reg argument for g>=16 untouched).
    - >-
      Stage 2 per-trial cost grows only polynomially (or slower than
      factorial-adjacent) in g at tested cells — naive number gains
      credibility; any move toward DEFINED is break-adjacent and requires
      review-breakthrough before promotion.
    - >-
      Stage 2 per-trial cost explosive beyond a generous
      factorial-times-exponential model — naive number confirmed artefact;
      cell may move toward "line inert, obstruction: per-trial solving cost"
      after ordinary review (closure standard with named obstruction).
    - >-
      Null control reports a finite T_k construction cost, or certificate
      oracle fails — instrument invalid; no mathematical reading.

  interpretation_limits:
    - THIS HYPOTHESIS DOES NOT CLAIM A BREAK OF ANY OF THE FIVE CURVES.
    - (B) numbers are computed specifically to be DISCREDITED by (C)+(D);
      citing (B) without (C) and (D) is misuse (tripwire T4 / HOLD-L).
    - Reachability verdict supported is OPEN with named missing quantity —
      not STRUCTURALLY EMPTY (that is 6cf862's F_q-rational-base cell) and
      not DEFINED WITH A COMPUTED COST.
    - Gaudry primary source and Gorla-Massierer remain provenance recalled
      until Stage 1 retrieves them; recalled citations never back a
      coordinator support/reject_scoped decision.
    - Stage 2 toys reach g<=8 vs deployed g up to 22; extrapolation is
      disclosed and is not a deployed cost claim.
    - ECC2K-130: zero operational transfer (no proper subfield / no T_k).
    - Stages 0-2 only; no deployed-curve attack; no exponent claim.

  distinguishable_outcomes:
    - id: DO-1-open-confirmed
      description: >-
        Stage 0 arithmetic matches; rho_reg>=1 at 3/5 rows; Stage 2 shows
        rapid cost growth and/or Stage 1 shows extra per-trial overhead —
        cell stays/confirmed OPEN or moves toward inert with named
        obstruction (per-trial cost).
      next_decision: commit_open_or_inert_cell_route_rho_reg_gate
    - id: DO-2-small-g-calibration-weakens-D
      description: >-
        Stage 1 shows measured g=2,4 costs match H2-only prediction —
        weaken (D) at small g only; do NOT promote DEFINED at deployed rows.
      next_decision: weaken_D_at_small_g_keep_open_at_deployed
    - id: DO-3-break-adjacent-surviving-margin
      description: >-
        Stage 2 growth slow enough that a stated extrapolation leaves a
        surviving margin below rho — break-adjacent; HALT promotion;
        require review-breakthrough before any DEFINED filing.
      next_decision: review_breakthrough_before_any_defined_claim
    - id: DO-4-arithmetic-fail
      description: Stage 0 disagrees with frozen (B)/(C) beyond tolerance.
      next_decision: supersede_hypothesis
    - id: DO-5-instrument-invalid
      description: Null/certificate/non-T_k controls fail.
      next_decision: repair_executor_no_status_change

  dominated_by: >-
    UNRESOLVED BY CONSTRUCTION for attack cost (honest content of OPEN).
