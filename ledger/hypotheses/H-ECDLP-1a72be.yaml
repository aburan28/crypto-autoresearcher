    stores 512. Two to the power 10 is 1024. Two to the power 9 is 512.
    One thousand twenty-four exceeds five hundred twelve by 512. The
    product of the two table sizes is 524288. Their sum is 1536. Two
    width-10 tables each store 512, so that gap is 0 and their
    product is 262144.
  mechanism: >-
    The proposal writes the widths 11 and 10 and the sizes 1024 and 512.
    This contract checks those integers. It does not add a curve
    point.
