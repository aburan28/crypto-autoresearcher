hypothesis:
  id: H-ALBIN-913542
  question_id: RQ-ALBIN-001
  derived_from_idea: IDEA-20260808-b188d0
  added: '2026-08-25'

  statement: >-
    SCOPE: the primary texts recorded in this corpus as the sources for the
    last-fall-degree bound on Weil-descent summation-polynomial systems, and
    the published Petit-Quisquater-style analysis of binary ECDLP. BINARY
    FIELDS ONLY; nothing transfers to prime fields. CLAIM TIER -- documentary
    for the transcription, and derived for the composition. NO NEW ALGORITHM IS
    PROPOSED AND NO ATTACK IS CLAIMED.

    THE HYPOTHESIS. The corpus records that the last fall degree of
    Weil-descent summation-polynomial systems is bounded INDEPENDENTLY OF THE
    EXTENSION DEGREE n, and that this does not yield a subexponential ECDLP
    algorithm, but it does not record WHY NOT. The candidate reason is the
    bound's dependence on the DECOMPOSITION ARITY m. Writing the bound as
    d_lf <= L(m) with L free of n, the subexponential analysis operates on a
    diagonal where m GROWS WITH n, so "independent of n" is evaluated at
    m = m(n) and the bound is L(m(n)), which is n-dependent after all.

    THE DECIDABLE QUESTION, WITH THREE OUTCOMES OF DISTINCT MEANING, all
    decidable from the transcribed theorem alone. (i) L POLYNOMIAL IN m -- the
    Macaulay matrix at degree L(m(n)) in n*m variables has (n*m)^{O(L)}
    columns, and the published subexponential claim becomes UNCONDITIONAL on
    the first-fall assumption. This would be a target-class result obtained by
    composition rather than by new mathematics, and it would require immediate
    independent breakthrough-tier review before anything is recorded.
    (ii) L SINGLY EXPONENTIAL IN m -- the bound is VACUOUS on the diagonal
    m of order n, the first-fall assumption remains load-bearing, and the
    forward guidance is to attack that assumption directly. (iii) L DOUBLY
    EXPONENTIAL -- the bound is vacuous even at modest m and its only use is at
    small m. THE PARENT PROPOSAL'S OWN HONEST PRIOR PUTS OUTCOME (ii) OR WORSE
    AT ABOUT 0.75, so the modal deliverable is the obstruction.

    THE OUTCOME THAT IS NOT EVIDENCE. If the primary texts cannot be obtained,
    the record is UNRUN. The parent proposal records that its own session could
    not open any primary source and that one host is separately recorded as
    returning HTTP 403 from this environment. An acquisition failure is
    reported as such and licenses NO conclusion in either direction.

  mechanism: >-
    THIS IS A QUANTIFIER AUDIT OF TWO EXISTING PUBLISHED RESULTS, NOT A NEW
    ALGORITHM. It is exactly the audit KN-TECH-080 mandates before compute, and
    the work is transcription plus algebra with zero experimental compute.

    (1) THE QUANTIFIER SWAP IS THE ENTIRE CONTENT. The published boundedness
    statement is -- FOR ALL m THERE EXISTS L(m) such that FOR ALL n,
    d_lf <= L(m). The statement needed for a subexponential conclusion is --
    THERE EXISTS a slowly growing L such that FOR ALL n, with m = m(n),
    d_lf <= L(m(n)) AND the Macaulay column count is subexponential in n. The
    swap is illegitimate unless L's growth in m is controlled, and controlling
    it is a matter of reading the theorem's explicit m-dependence.

    (2) THE COMPOSITION IS MECHANICAL ONCE THE CONSTANT IS KNOWN. Solving cost
    is the Macaulay column count raised to a linear-algebra exponent, with the
    variable count being n*m after descent and the degree being d_lf. So the
    whole subexponential question reduces to the growth of L(m) against the
    diagonal m(n) that the factor-base balance dictates.

    (3) WHY TRANSCRIPTION FIDELITY IS THE BINDING CONTROL. A paraphrase that
    drops one hypothesis of a theorem is exactly how a vacuous bound gets
    quoted as a strong one. The theorem must be quoted VERBATIM with its
    numbering and every hypothesis, and each hypothesis must then be checked
    against the family the subexponential analysis actually uses. A hypothesis
    that fails on that family VOIDS the composition -- and that is a legitimate,
    reportable outcome rather than a failure of the design.

    (4) WHY THE IDENTIFIABILITY WARNING MATTERS. Two systems with the same
    d_lf bound and very different solving costs are trivially constructible by
    changing n*m at fixed d_lf. So d_lf ALONE does not determine cost. That is
    not a defect of the invariant but a warning -- any derivation quoting only
    "bounded last fall degree" as evidence of tractability commits exactly this
    identifiability error, and the composition must carry BOTH factors.

    (5) THE NEARBY-OBJECT ARM. The same sources treat systems from another
    problem family where the analogous composition is reported to give
    quasi-polynomial claims that also depend on heuristics. Applying the
    identical composition there is the method-ceiling control -- if the method
    cannot distinguish the two cases, it has not identified the load-bearing
    structure.

  assumptions:
    - >-
      The two sources identified in this corpus are the correct primary
      references for the last-fall-degree bound. If they are not, the
      transcription target is wrong and the record's premise fails; this is
      checked by reading, not assumed.
    - >-
      "Bounded independently of n" may be stated for a SPECIFIC system family,
      not for the family the subexponential analysis uses. The transcription
      must check FAMILY IDENTITY explicitly, and a mismatch VOIDS the
      composition.
    - >-
      The relation between last fall degree and the degree at which a Groebner
      basis is actually obtained may carry an additive or multiplicative term
      the headline omits. That term, if present, must be transcribed and
      carried into the composition.
    - >-
      The published analysis may use a different variable count than n*m after
      its own optimisations. The transcription must recover the variable count
      the analysis actually uses rather than substituting the naive one.
    - >-
      EVERY ATTRIBUTION IN THE PARENT PROPOSAL IS UNVERIFIED. Its own session
      could not open any primary source, and the corpus entries it relies on
      record that their full texts were not read. This record is a proposal to
      OPEN them, and until they are opened nothing here is supported.
    - >-
      Source accessibility is UNKNOWN. One host is recorded as returning HTTP
      403 from this environment. An acquisition failure is reported as UNRUN,
      never absorbed and never treated as evidence.

  proof_search_map:
    bottleneck: >-
      The growth of the last-fall-degree bound L(m) in the arity m. It is the
      single quantity that decides whether the published subexponential
      binary-ECDLP claim rests on a heuristic or on a theorem, and it is
      recoverable from a theorem statement without any compute.
    baseline_embedding:
      parameter_slice: >-
        m FIXED, n growing -- the slice on which the published statement
        (bound independent of n) holds exactly.
      reproduction_check: >-
        GATING. Transcribe the theorem statement and verify that setting m
        constant yields a CONSTANT bound, matching the corpus's recorded
        headline for the source. If the transcription does not reproduce the
        published headline on its own slice, THE TRANSCRIPTION IS WRONG and
        nothing composed from it may be reported.
    observation_collision:
      observable: >-
        The pair (last-fall-degree bound, number of descended variables n*m).
      distinct_preimage_search: >-
        Two systems with the same d_lf bound and very different solving costs
        are EASY to construct by changing n*m at fixed d_lf. The collision is
        therefore asserted, not hunted -- and its consequence is that d_lf
        alone does not determine cost. Any derivation quoting only "bounded
        last fall degree" as evidence of tractability commits this
        identifiability error, and the composite statement must carry both
        factors explicitly.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The composite cost statement -- the Macaulay column count at the
          transcribed L(m), in n*m variables, raised to a linear-algebra
          exponent -- replacing the first-fall-degree-conditional cost
          statement.
        predicted_gain: >-
          Removes ONE heuristic from a published complexity claim, or localises
          precisely why it cannot be removed. NO new algorithm and NO lowering
          of any true complexity is claimed.
    quantifier_order: >-
      PUBLISHED -- FOR ALL m THERE EXISTS L(m) such that FOR ALL n,
      d_lf <= L(m). NEEDED FOR A SUBEXPONENTIAL CONCLUSION -- THERE EXISTS a
      slowly growing L such that FOR ALL n, with m = m(n), d_lf <= L(m(n)) AND
      the composite column count is subexponential in n. THE SWAP IS THE ENTIRE
      CONTENT of this record, and it is exactly the swap the first-fall-degree
      assumption performs without justification.
    method_ceiling:
      strongest_certifiable_claim: >-
        At best, a conditional-free cost bound for binary ECDLP at the
        transcribed L(m). It can NEVER lower the true complexity of anything --
        only remove or confirm a heuristic. It says nothing about prime fields,
        nothing about non-algebraic methods, and nothing about any curve of
        cryptographic size.
      nearby_object_control: >-
        The other problem family treated in the same sources, where the
        analogous composition is reported to give quasi-polynomial claims that
        also depend on heuristics. Apply the IDENTICAL composition there. If
        the method cannot distinguish that case from the ECDLP case, it has not
        identified the load-bearing structure and no composed conclusion is
        admissible.
    proof_obligations:
      - claim: The exact form of L(m), transcribed verbatim from primary sources with its numbering.
        responsibility: baseline
      - claim: The diagonal m(n) implied by the published factor-base balance.
        responsibility: scope
      - claim: The composite Macaulay column count and its asymptotics in n.
        responsibility: runtime
      - claim: >-
          Every hypothesis of the transcribed theorem holds for the family the
          subexponential analysis uses.
        responsibility: interface
      - claim: >-
          The composite reports MEMORY beside time, since a Groebner route is
          memory-bound and the generic route is not.
        responsibility: memory
      - claim: >-
          Nothing transfers to prime fields, where a different obstruction is
          argued to apply.
        responsibility: scope
    not_applicable_reason: null

  asymptotic_claim:
    problem: binary-field ECDLP by Weil descent and Groebner solving
    prior_best: >-
      Pollard rho at 2^{n/2} generically, against a published Weil-descent
      claim of the form 2^{O(n^{2/3} log n)} which is HEURISTIC and whose
      status is exactly what this record audits.
    time_exponent: >-
      NONE CLAIMED BY THIS RECORD. The record does not propose to beat either
      baseline; it decides whether the published subexponential statement rests
      on a heuristic or on a theorem.
    memory_exponent: >-
      The Macaulay matrix at degree d_lf in n*m variables requires a column
      count that this record composes explicitly. Published analyses of this
      family are routinely quoted in time and not in memory, and requiring the
      memory column beside the time column is itself a correction to how the
      claim is usually stated.
    hidden_cofactor: >-
      Everything inside the O() of the published subexponential expression. The
      composition here does NOT resolve those constants and does not pretend to.
    claim_kind: cofactor_improvement
    claim_kind_note: >-
      Recorded as cofactor_improvement only because the schema requires a
      value; the honest description is NO improvement of any kind. This record
      changes the CONFIDENCE LABEL on an existing row rather than adding a row,
      and it occupies no Pareto position. If the polynomial outcome fires, the
      resulting unconditional claim would belong to the source authors'
      theorem, not to this program, and would require independent
      breakthrough-tier review before any status moved.

  heuristic_assumptions:
    - id: HEUR-ALBIN-1
      formal_statement: >-
        The last-fall-degree bound for Weil-descent summation systems has the
        form d_lf <= L(m) with L free of n, and the published subexponential
        analysis operates at m = m(n) growing with n.
      random_model_justification: >-
        Not a distributional assumption -- it is a STRUCTURAL one, and it is
        the load-bearing unverified input. The boundedness statement is relayed
        from corpus entries whose own records state that their full texts were
        not read, so the rigorous ingredient is currently a summary of a
        summary.
      supporting_results: []
      validation_experiment_ids: [EXP-ALBIN-25b768]
      falsification_condition: >-
        The transcribed theorem's bound is NOT free of n, or the published
        analysis does NOT operate at growing m. Either voids the record's
        premise, and there is no sampling route -- the quantity is a theorem,
        not a random variable.
    - id: HEUR-ALBIN-2
      formal_statement: >-
        The transcribed theorem's hypotheses are satisfied by the exact system
        family the subexponential analysis uses, so the two published results
        may be composed.
      random_model_justification: >-
        Not distributional. It is a family-identity condition, and the parent
        proposal names it as the confounder most likely to void the whole
        composition -- "bounded independently of n" may be stated for a
        particular set of summation polynomials rather than for the family in
        question.
      supporting_results: []
      validation_experiment_ids: [EXP-ALBIN-25b768]
      falsification_condition: >-
        Any hypothesis of the transcribed theorem that fails on the
        subexponential analysis's family. The composition is then INVALID and
        the record's premise is wrong -- a legitimate reportable outcome.

  predictions:
    - metric: >-
        T1 -- transcription_completeness -- whether the theorem statement, its
        numbering, every hypothesis, and the explicit m-dependence were quoted
        VERBATIM from primary text
      direction: different
      minimum_effect: >-
        COMPLETE, verbatim, with numbering. A paraphrase is NOT admissible, and
        any hypothesis dropped in paraphrase is exactly how a vacuous bound
        gets quoted as a strong one.
    - metric: >-
        T2 -- fixed_m_slice_reproduction -- whether the transcribed statement,
        at m constant, yields a constant bound matching the corpus's recorded
        headline
      direction: different
      minimum_effect: >-
        MUST REPRODUCE. GATING. If it does not, the transcription is wrong and
        nothing composed from it may be reported.
    - metric: >-
        L1 -- growth_class_of_L -- the growth class of L in m, read off the
        transcribed closed form, classified as polynomial, singly exponential,
        doubly exponential, or NOT-STATED
      direction: different
      minimum_effect: >-
        A CATEGORICAL VERDICT with the closed form quoted. All four values are
        reachable and each has a distinct consequence -- polynomial makes the
        published claim unconditional and triggers breakthrough-tier review;
        singly exponential makes the bound vacuous on the diagonal; doubly
        exponential confines it to small m; NOT-STATED means the sources do not
        answer the question and the audit's honest output is that the
        m-dependence is not published.
    - metric: >-
        D1 -- diagonal_recovery -- whether the diagonal m(n) implied by the
        published factor-base balance is recoverable from the published
        analysis, and its explicit form
      direction: different
      minimum_effect: >-
        RECOVERED with its form, or reported as NOT RECOVERABLE. If it is not
        recoverable, the composition has no diagonal to evaluate on and the
        record's central question cannot be answered from these sources.
    - metric: >-
        C1 -- composite_cost_curve -- log2 of the Macaulay column count at the
        transcribed L, in the analysis's own variable count, raised to the
        linear-algebra exponent, as a function of n, plotted BESIDE the
        published subexponential expression
      direction: different
      minimum_effect: >-
        REPORTED AS A CURVE with both series on the same axes, and with a
        MEMORY column beside the time column. Concordance or crossing is the
        deliverable; a single crossing point is not, because the comparison is
        asymptotic and the constants are unresolved.
    - metric: >-
        N1 -- negative_control_at_fixed_m -- the composite cost evaluated at m
        FIXED rather than on the diagonal
      direction: different
      minimum_effect: >-
        MUST be polynomial in n, as it must be by construction. A composition
        that fails this check is MIS-ASSEMBLED and every curve from it is void.
    - metric: >-
        H1 -- nearby_object_arm -- the same composition applied to the other
        problem family the same sources treat
      direction: different
      minimum_effect: >-
        Reported alongside the ECDLP arm. If the composition cannot
        DISTINGUISH the two cases, it has not identified the load-bearing
        structure and no composed conclusion is admissible.
    - metric: >-
        K1 -- low_degree_count_resolution -- whether the primary sources state
        the low-degree counts that a standing corpus finding numerically
        corroborates
      direction: different
      minimum_effect: >-
        Reported as stated-with-values or not-stated. Either resolves a
        standing open item in this corpus about whether that finding has a
        publishable quantitative residue.
    - metric: >-
        A1 -- acquisition_outcome -- per source, retrieved or an acquisition
        failure with URL, HTTP status, attempt count and timestamp
      direction: different
      minimum_effect: >-
        Reported whatever its value. If the sources cannot be obtained, the
        record's output is UNRUN and NO conclusion may be drawn from the
        failure in either direction.

  test_boundary:
    instances:
      - >-
        The primary texts recorded in this corpus as the sources for the
        last-fall-degree bound on Weil-descent summation-polynomial systems.
      - >-
        The published Petit-Quisquater-style subexponential binary-ECDLP
        analysis and its factor-base balance.
      - >-
        The other problem family treated in the same sources, as the
        nearby-object arm.
      - >-
        The fixed-m slice, as the gating reproduction check, and the fixed-m
        composite, as the negative control.
      - >-
        OUT OF SCOPE -- prime fields entirely; any new algorithm; any
        experimental compute; any curve of any size; and any claim about
        constants hidden inside the published O().
    parameters:
      fields: binary only
      compute: zero experimental compute
      transcription_mode: verbatim with theorem numbering and every hypothesis
      arms: [ECDLP diagonal, ECDLP fixed-m negative control, nearby problem family]
    implementation: experiments/EXP-ALBIN-25b768
    budget:
      agent_hours_estimate: 8
      compute_seconds: 300
      maximum_memory_gb: 2
      maximum_runs: 3

  distinguishable_outcomes:
    - outcome: >-
        Sources retrieved, T1 complete, T2 reproduces, HEUR-ALBIN-2 holds, and
        L1 = POLYNOMIAL with C1 sitting below the published subexponential
        expression.
      means: >-
        The published subexponential claim becomes UNCONDITIONAL on the
        first-fall assumption -- the most consequential outcome available in
        this slice. IT IS NOT THIS PROGRAM'S RESULT; it belongs to the source
        authors' theorem, obtained here by composition. It requires IMMEDIATE
        independent breakthrough-tier review under AGENTS.md rule 12 before
        anything is recorded, and no status may move on this run alone.
    - outcome: >-
        Same gates pass and L1 = SINGLY EXPONENTIAL.
      means: >-
        The rigorous bound is VACUOUS on the diagonal where the subexponential
        claim lives; the first-fall assumption remains load-bearing. This is a
        NAMED OBSTRUCTION with forward guidance -- attack the assumption
        directly, or work at bounded m where the bound bites. The parent
        proposal's own prior makes this the modal outcome and it is worth
        having precisely because it is currently absent from the corpus.
    - outcome: >-
        Same gates pass and L1 = DOUBLY EXPONENTIAL.
      means: >-
        The bound is vacuous even at modest m and its only use is at small
        arity. Same disposition as the singly exponential case, with a tighter
        usable range named.
    - outcome: >-
        L1 = NOT-STATED -- the sources do not give an explicit m-dependence.
      means: >-
        The question this record asks IS NOT ANSWERED BY THE PUBLISHED TEXTS.
        That is itself the finding and must be reported as an absence with the
        search terms used, not as an obstruction and not as a confirmation.
    - outcome: >-
        HEUR-ALBIN-2 fails -- a transcribed hypothesis does not hold for the
        subexponential analysis's family.
      means: >-
        THE COMPOSITION IS INVALID and the record's premise is wrong. The
        family mismatch is the deliverable, and it also explains why the corpus
        never recorded why the bound does not yield a subexponential algorithm.
    - outcome: >-
        T2 fails -- the fixed-m slice does not reproduce the published
        headline.
      means: >-
        THE TRANSCRIPTION IS WRONG. Nothing composed from it may be reported;
        the deliverable is the located transcription error.
    - outcome: >-
        N1 fails -- the composite at fixed m is not polynomial in n.
      means: >-
        The composition is MIS-ASSEMBLED. Every curve is void and the
        deliverable is the assembly error.
    - outcome: >-
        H1 -- the composition gives the same verdict on the nearby problem
        family as on ECDLP.
      means: >-
        The method has not identified the load-bearing structure. No composed
        conclusion is admissible and the arm's failure is reported as the
        method ceiling being reached.
    - outcome: >-
        The sources cannot be obtained.
      means: >-
        UNRUN. Reported with the full acquisition log; NO conclusion in either
        direction, and specifically NOT that the m-dependence is unfavourable.
        The parent proposal prices source obtainability at about 0.4 from this
        environment.

  falsification_conditions:
    - >-
      F1 -- the transcribed L(m) is POLYNOMIAL and the composite curve sits
      below the published subexponential expression. The obstruction reading is
      FALSE; this triggers immediate independent breakthrough-tier review under
      AGENTS.md rule 12 and no status moves on this run alone.
    - >-
      F2 -- a transcribed hypothesis fails on the subexponential analysis's
      family. The composition is invalid and the record's premise is wrong.
    - >-
      F3 -- the fixed-m slice does not reproduce the published n-independence
      headline. The transcription is wrong.
    - >-
      F4 -- the fixed-m composite is not polynomial in n. The composition is
      mis-assembled and every curve is void.
    - >-
      F5 -- the nearby-object arm returns the same verdict as the ECDLP arm.
      The method ceiling is reached and no composed conclusion is admissible.
    - >-
      F6 -- the sources are unobtainable. Reported UNRUN, never as evidence in
      either direction.
    - >-
      F7 -- the sources state no explicit m-dependence. The question is not
      answered by the published texts, reported as an absence with named search
      terms.

  interpretation_limits:
    - >-
      BINARY FIELDS ONLY. Nothing transfers to prime fields, where a different
      obstruction is argued in this corpus to block the analogous bound.
    - >-
      NO NEW ALGORITHM IS PROPOSED AND NO ATTACK IS CLAIMED. Any positive
      outcome is a statement about a PUBLISHED claim's dependence on a
      heuristic, not a new complexity result of this program, and the
      underlying theorem belongs to its authors.
    - >-
      The composition does not resolve the constants hidden inside the
      published O() and does not pretend to. Any comparison of curves is
      asymptotic and its crossing point carries no operational meaning.
    - >-
      MEMORY MUST BE REPORTED BESIDE TIME. The Groebner route is memory-bound
      and the generic route is not; a comparison at fixed time that ignores
      memory favours the algebraic route artificially.
    - >-
      Every attribution inherited from the parent proposal and from the
      relaying corpus entries is UNVERIFIED until the primary texts are opened.
      The whole record is a proposal to open them.
    - >-
      An acquisition failure is never evidence. It is reported as UNRUN with
      its log, and it specifically does not support the obstruction reading.

