  - metric: >-
      slope_SRW: the same fit for the simple walk on the identical graph
    direction: different
    minimum_effect: >-
      3.0 under the same rule, and separately slope_SRW/slope_NBRW = 3.0 +/- 0.5.
      This RATIO is the strongest internal check in the design: the two walks
      differ only in the backtracking step, so the ratio tests both recalled
      cutoff results simultaneously without needing either to be trusted
      individually.
  - metric: >-
      slope_NULL: fitted slope on the matched random 3-regular null, same n,
      three seeds, identical code path
    direction: different
    minimum_effect: >-
      EQUAL to slope_NBRW within 0.35. THIS NULL CAN FAIL IN EITHER DIRECTION
      AND BOTH FAILURES ARE INFORMATIVE: agreement means the
      commitment-uniformity premise rests on generic expansion and nothing
      supersingular-specific, which is the controlled-null deliverable;
      disagreement is a structural fact about the supersingular graph and is a
      genuine finding.
  - metric: >-
      dumbbell_ratio: k_mix(dumbbell, t = 1) / k_mix(G_2(p)) at matched n and
      matched degree
    direction: higher
    minimum_effect: >-
      '>= 10. DERIVED PRE-RUN: conductance ~2/(3n) forces a relaxation time of
      at least 3n/4, so k_mix grows linearly in n against the expander''s
