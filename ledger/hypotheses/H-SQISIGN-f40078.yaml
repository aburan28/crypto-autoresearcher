hypothesis:
  id: H-SQISIGN-f40078
  question_id: RQ-SQISIGN-001

  statement: >-
    SCOPE: the supersingular 2-isogeny graph G_2(p) over F_{p^2} for p = 3 mod 4,
    at the eight declared ladder primes 1031, 2063, 4099, 8219, 16411, 32771,
    65539, 131111 (log2 of the vertex count running from 6.41 to 13.42);
    total-variation distance computed EXACTLY by sparse iteration of the
    reversible transition operator, never estimated by sampling; simple and
    non-backtracking walks; one instrument lineage. CLAIM TIER toy. NO ATTACK,
    NO EXPONENT, NO CRYPTOGRAPHIC-SCALE STATEMENT, AND NO STATEMENT ABOUT
    SQIsign AT ALL UNLESS AND UNTIL THE STAGE-0 READING GATE COMPLETES.
    THE CLAIM. The mixing time of the walk that a SQIsign-shaped commitment
    performs obeys a scaling law k_mix(n) = a*log2(n) + b, with a and b
    independent of n, and the slope a is 1.0 for the NON-BACKTRACKING walk and
    3.0 for the SIMPLE walk - i.e. mixing is governed by the cutoff regime and
    NOT by the Ramanujan spectral upper bound, whose slope is
    0.5/(log2(3) - 1.5) = 5.885. The three candidate slopes are separated by 2.0
    and 2.885; the decision window is fixed at +/-0.35 before any run, so at
    most one candidate can be selected and "none of the three" is a permitted
    and pre-declared verdict. SECOND AND EQUALLY BINDING HALF: the supersingular
    graph's slope equals that of a MATCHED random 3-regular null on the same
    vertex count within the same +/-0.35, so that the commitment's uniformity
    premise is exactly as strong as generic expansion and no stronger. THIRD
    HALF, THE ONE THAT BEARS ON A TRANSCRIPT: the mixing time started at the
    special vertex j = 1728 - which is where an honest commitment walk starts,
    and where a simulator's backwards walk does not - differs from the mixing
    time started at a deterministic generic vertex by 0 +/- 1 step, and that
    difference does not grow with log2(n).
    WHY THE CLAIM MATTERS AND WHAT IT IS NOT. If the slope is 5.885 rather than
    1.0, then the only rigorous bound available requires
    k* = (0.5*log2(n) + lambda + 1)/0.0849625 = 3004 two-isogeny steps at
    p = 2^256, lambda = 128, and that bound is VACUOUS (it returns 2^+104.5,
    greater than 1) at the ~256 steps a natural parameter would give. THAT IS A
    STATEMENT ABOUT AN ARGUMENT, NOT ABOUT A SCHEME. If no frozen candidate is
    selected, the deliverable is a NAMED NO-GO with its exact boundary: neither
    the spectral bound nor either recalled cutoff result describes this graph at
    n <= 10925, stated with the measured slope attached.

  mechanism: >-
    DERIVED IN-REPO. Every external theorem below is RECALLED, UNVERIFIED and is
    a candidate to test, never an authority; three of them are tested BY THE RUN,
    which is the design's principal defence against faulty recall. The
    corresponding idea record is ledger/proposals/IDEA-20260805-bb4bf8.yaml and
    carries the protocol-level motivation; this record carries the mathematics.

    THE OBJECT. Fix p = 3 mod 4. Let SS(p) be the set of supersingular
    j-invariants in F_{p^2} and n = |SS(p)|. Recalled counting law, TO BE
    RE-VERIFIED BY DIRECT ENUMERATION AT EVERY LADDER PRIME:
        |SS(p)| = floor(p/12) + e,  e = 0, 1, 1, 2 for p = 1, 5, 7, 11 mod 12.
    The 2-isogeny graph G_2(p) has vertex set SS(p) and, from each vertex, the
    three 2-isogenies given by the three order-2 subgroups. It is 3-regular only
    as a WEIGHTED multigraph: the walk is reversible with respect to
        pi(j) proportional to w(j) = 2/|Aut(E_j)|,
    i.e. w = 1 generically, 1/2 at j = 1728 and 1/3 at j = 0, and the adjacency
    matrix is NOT symmetric at those two vertices. A construction that
    symmetrizes it silently has the wrong stationary measure and will put a
    spurious O(1/n) floor under every TV curve; the exact detailed-balance check
    below exists solely to catch that.

    THE SPECTRAL BOUND, DERIVED IN FULL, NO CITATION REQUIRED FOR THE
    INEQUALITY. Let P be the transition operator and f_k = P^k delta_v. Because
    P is self-adjoint on L^2(pi) with top eigenvalue 1 and second-largest
    absolute eigenvalue mu,
        ||f_k - pi||_2 <= mu^k ||delta_v - pi||_2 <= mu^k,
    and by Cauchy-Schwarz TV_k = (1/2)||f_k - pi||_1 <= (1/2) sqrt(n)
    ||f_k - pi||_2, hence
        TV_k <= (sqrt(n)/2) * mu^k.
    RECALLED, UNVERIFIED (Pizer): G_l(p) is Ramanujan, mu <= 2*sqrt(l)/(l+1). For
    l = 2, mu <= 2*sqrt(2)/3 = 0.94280904, and
        log2(1/mu) = log2(3) - 1.5 = 0.08496250 exactly.
    Requiring TV_k <= 2^-lambda gives
        k*(n, lambda) = (0.5*log2(n) + lambda + 1)/0.08496250,
    with slope dk*/dlog2(n) = 0.5/0.08496250 = 5.88495.
    FORCED NUMBERS, COMPUTED BEFORE ANY RUN AND RECOMPUTABLE IN ONE LINE: at
    p = 2^256, n = p/12, log2(n) = 252.41504, lambda = 128, k* = 3003.77, i.e.
    3004 steps; and at k = 256 the bound returns 2^(126.208 - 21.750) = 2^104.46,
    which exceeds 1 and therefore asserts nothing.

    THE TWO CUTOFF CANDIDATES, RECALLED AND UNVERIFIED. Cutoff for the SIMPLE
    random walk on a d-regular Ramanujan graph at (d/(d-2))*log_{d-1}(n), which
    for d = 3 is 3*log2(n), slope 3.0; and cutoff for the NON-BACKTRACKING walk
    at log_{d-1}(n) = log2(n), slope 1.0. NO AUTHOR, VENUE, YEAR OR THEOREM
    NUMBER IS ASSERTED ANYWHERE IN THIS RECORD. Both enter only as
    PRE-REGISTERED CANDIDATE SLOPES. The non-backtracking walk is the correct
    model for the honest object because a cyclic isogeny of degree 2^k is exactly
    a non-backtracking length-k walk, and measuring BOTH walks on the SAME graph
    is the strongest internal check available: their predicted slope ratio is
    exactly 3, so a measured ratio near 3 corroborates both recalled results at
    once and a ratio near 1 falsifies at least one of them.

    WHY THE MEASUREMENT IS EXACT, WHICH IS THE ONE REAL DESIGN IDEA. TV_k is a
    deterministic functional of P: k sparse matrix-vector products and one
    weighted L1 norm. THERE IS NO SAMPLING ANYWHERE, HENCE NO SAMPLING ERROR AND
    NO STATISTICAL POWER PROBLEM. This is why the hypothesis can be settled at
    all in a container with numpy 2.4.6 and no sympy, no scipy, no Sage and no
    PARI (all four VERIFIED on this machine, 2026-08-05). It is also the reason
    to prefer this route to transcript sampling: a permutation test over N
    sampled transcripts has a resolution floor of order 1/sqrt(N) and cannot
    bound a 2^-128 statistical distance at any budget, whereas an exact spectral
    computation extrapolates through a scaling law whose parameters are measured.
    The extrapolation is still heuristic and is numbered HEUR-CWM-2; it is not
    presented as a proof and it is WITHDRAWN rather than caveated if its own
    stability test fails.

    FOUR FORCED VALUES THAT VERIFY THE INSTRUMENT BEFORE ANY CURVE IS BELIEVED.
    (F-a) |SS(p)| equals floor(p/12) + e exactly, by direct enumeration.
    (F-b) EICHLER MASS: sum over supersingular E of 1/|Aut(E)| = (p-1)/24
          exactly, as a rational. CHECKED BY HAND WHILE WRITING THIS RECORD at
          two ladder primes: p = 1031 (= 11 mod 12) gives |SS| = 85 + 2 = 87
          with one j = 0 (|Aut| = 6), one j = 1728 (|Aut| = 4) and 85 generic,
          so the mass is 85/2 + 1/6 + 1/4 = 42.9166666..., and (1031-1)/24 =
          42.9166666...; p = 4099 (= 7 mod 12) gives |SS| = 341 + 1 = 342 with
          no j = 0, so the mass is 341/2 + 1/4 = 170.75, and (4099-1)/24 =
          170.75. EXACT AGREEMENT IN BOTH CASES. These are consistency checks on
          the recalled formulas, not proofs of them.
    (F-c) DETAILED BALANCE: w(j) A(j,j') = w(j') A(j',j) with residual exactly 0
          in exact arithmetic.
    (F-d) INDEPENDENT EDGE-SET AGREEMENT: the edge multiset built by Velu
          2-isogenies from curve models must equal the edge multiset given by the
          roots of the classical modular polynomial Phi_2(j, Y). Phi_2's
          coefficients are RECALLED, UNVERIFIED; Velu is derived from scratch; on
          disagreement Velu is authoritative, the recalled Phi_2 is quarantined,
          and the disagreement is an INFRASTRUCTURE finding under AGENTS.md
          rule 5 and never a mathematical one.
    Failing any of the four ends the run as an infrastructure outcome. Passing
    all four licenses nothing beyond the measurement itself.

    WHAT THE MECHANISM DOES NOT DO. It says nothing about the response isogeny's
    distribution, nothing about unforgeability, nothing about the union graph
    over a real commitment degree's several prime factors, and nothing about the
    F_p-rational subgraph - which is a separate and pointed matter recorded here
    as forward guidance rather than claimed: knowledge/techniques/KN-TECH-057.md,
    READ in-repo, states its van Oorschot-Wiener p^{1/4} row as CONDITIONAL ON
    UNPROVEN F_p-SUBGRAPH MIXING. The instrument built here measures exactly that
    class of quantity. Pointing it at that subgraph would serve GOAL-SSI-001,
    whose lane this hypothesis does not enter and whose budget it does not spend.

  assumptions:
  - >-
    FROZEN INSTRUMENT DEFINITION, fixed in full BEFORE any evaluation.
    (1) LADDER: for b = 10..17, p_b = the smallest prime >= 2^b with p = 3 mod 4.
        Computed on this machine while writing this record: 1031, 2063, 4099,
        8219, 16411, 32771, 65539, 131111, with p mod 12 = 11, 11, 7, 11, 7, 11,
        7, 11 and n = 87, 173, 342, 686, 1368, 2732, 5462, 10927 by the recalled
        counting law (to be re-verified by enumeration, F-a).
    (2) GRAPH: G_2(p_b), vertices SS(p_b), edges the three 2-isogenies per
        vertex by Velu, weights w(j) = 2/|Aut(E_j)|.
    (3) WALKS: SRW = the w-reversible simple walk; NBRW = the non-backtracking
        walk on directed edges, its stationary measure the edge measure, TV
        computed on the projected vertex marginal.
    (4) START VERTICES: v_special = j = 1728, and v_generic = the element of
        SS(p) at index floor(n/2) in the canonical ascending order of the
        F_{p^2} encodings, skipping j in {0, 1728}. Deterministic, seed-free.
    (5) TV TARGETS: k_mix is defined at TV <= 1/4 (primary) and TV <= 1/100
        (secondary). BOTH ARE FIXED NOW so the fit window cannot be chosen after
        the curves are seen.
    (6) FIT: ordinary least squares of k_mix against log2(n) over all eight
        primes, reported beside the same fit over the top four primes only.
    (7) DECISION RULE: the measured slope is assigned to the nearest of
        {1.0, 3.0, 5.885} only if within 0.35; otherwise NO candidate is
        selected and that is the reported result.
    NO OTHER DEGREE OF FREEDOM EXISTS. Any change to (1)-(7) after any number has
    been observed requires a versioned protocol amendment marked exploratory
    only, and is never an edit.
  - >-
    ARMS ARE FIXED NOW: TREATMENT = G_2(p_b); MATCHED NULL = a random 3-regular
    graph on exactly n vertices by the configuration model, seeds 1/2/3;
    POSITIVE CONTROL = the dumbbell, two random 3-regular halves on n/2 vertices
    joined by t = 1 edge; GRADED CONTROL = the same dumbbell with
    t in {1, 2, 4, 8, 16, 32}. Every arm runs through the IDENTICAL TV and
    k_mix code path. The null arm's fit is computed and recorded BEFORE the
    treatment arm's curves are looked at.
  - >-
    THE l = 2 RESTRICTION IS A RESTRICTION AND IS CARRIED ON EVERY CITATION. A
    real commitment degree is (RECALLED, UNVERIFIED) a smooth number with several
    prime factors, so the relevant walk lives in a union of l-graphs. A union of
    expanders mixes at least as fast as its best factor, so the l = 2 reading is
    conservative in one direction ONLY and is not representative in the other.
  - >-
    NO SQIsign CONCLUSION IS LICENSED BY THIS HYPOTHESIS. Its measurements are
    statements about a graph. RQ-SQISIGN-001.constraints forbids designing on
    unverified per-scheme claims, and this record complies by making every
    scheme-facing statement conditional on a reading gate that has not been run.

  proof_search_map:
    bottleneck: >-
      The walk-length constant in the commitment-uniformity premise: the number
      of isogeny steps at which the endpoint law is within 2^-lambda of
      stationary. Every marginal-level zero-knowledge statement about the
      published commitment curve passes through this one number, and no record
      in this corpus has ever evaluated it for any isogeny graph. Removing or
      confirming it changes what the security argument is entitled to assert and
      consumes no other goal's budget.
    baseline_embedding:
      parameter_slice: >-
        The Ramanujan spectral bound itself is the baseline, and it is exact
        rather than approximate: at EVERY ladder prime and EVERY k the measured
        TV_k must satisfy TV_k <= (sqrt(n)/2)*mu_emp^k, and the measured mu_emp
        must satisfy mu_emp <= 2*sqrt(2)/3 = 0.94280904. A second baseline slice
        is the trivial one: TV_0 = 1 - pi(v_start), exactly.
      reproduction_check: >-
        SYMBOLIC PLUS FROZEN FIXTURE, and partially discharged before this record
        was written. The four forced instrument values F-a..F-d are exact integer
        or exact rational identities, not resemblances; two of them (F-b at
        p = 1031 and p = 4099) were computed by hand above and agree exactly. A
        TV curve that merely LOOKS like the bound is not a reproduction; the
        inequality is checked pointwise at every k.
    observation_collision:
      observable: >-
        The exact TV decay curve k -> TV_k, and the derived pair
        (k_mix, fitted slope).
      distinct_preimage_search: >-
        A COLLISION IS EXPECTED AND IS PRE-DECLARED, WHICH IS WHY THIS AUDIT IS
        WORTH RUNNING BEFORE THE COMPUTE. G_2(p) and a matched random 3-regular
        graph on the same n are DISTINCT ground-truth objects that the recalled
        theory predicts share the observable (both near-Ramanujan, both cutting
        off at the same order). If the measurement confirms the collision, the
        observable does NOT identify "supersingular" - it identifies "good
        expander" - and every downstream statement must say so. That is not a
        defect of the experiment; it is the CONTROLLED NULL that
        docs/inventor-protocol.md section 3 names as a first-class deliverable,
        and the honest reading is that the commitment-uniformity premise is
        exactly as strong as generic expansion. On the OTHER side of the claimed
        conclusion the observable must separate: the dumbbell is an object where
        fast mixing is known FALSE by conductance, and if the observable does not
        separate G_2 from the dumbbell then it identifies nothing at all and no
        result may be reported from any arm.
    constructive_transforms:
    - transform: observable_fiber
      proposed_object: >-
        Hold the observable (the TV curve, or k_mix) fixed and vary the forgotten
        structure: supersingular versus random 3-regular versus dumbbell at
        identical n and identical degree. The intrinsic invariant proposed to
        distinguish the members is mu_emp, the measured second eigenvalue.
      predicted_gain: >-
        None to any attacker. The gain is a clean statement of what the
        commitment-uniformity premise does and does not rest on: if mu_emp does
        not separate the supersingular graph from the matched random graph, then
        no argument specific to supersingular structure is doing any work in the
        premise, and the premise should be stated as generic expansion.
    - transform: stronger_invariant
      proposed_object: >-
        Preserve mu_emp and the whole TV curve rather than only k_mix, because
        the eigenvalue is what survives recursion across the ladder while k_mix
        is a single threshold crossing that is sensitive to the target choice.
      predicted_gain: >-
        Two independent routes to the same verdict: the fitted slope (a
        threshold statistic) and mu_emp's own n-dependence (a spectral statistic).
        Disagreement between them localises the failure to the fit window rather
        than leaving a bare negative.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER AND NO OTHER: THERE EXIST constants a and b, FIXED
      AND INDEPENDENT OF n, SUCH THAT FOR ALL eight ladder primes, and FOR BOTH
      start vertices, and FOR ALL three null seeds, k_mix(n) = a*log2(n) + b
      within the declared residual tolerance, with a within 0.35 of one of
      {1.0, 3.0, 5.885}. The witness (a, b) MAY NOT depend on n, on the start
      vertex, on the arm's seed, or on the TV target. THE WEAKER ORDER - FOR ALL
      n THERE EXIST a, b - is trivially satisfiable by any data whatever and is
      EXPLICITLY NOT CLAIMED AND NOT ADMISSIBLE AS A RESULT. If the fit over the
      top four primes differs from the fit over all eight by more than 0.35, the
      "independent of n" clause has failed, the EXISTS-FORALL order is not
      established, and the extrapolation is WITHDRAWN rather than reported with a
      caveat. Separately, the quantifier that the SCHEME-level claim would need
      is stronger still and is NOT approached here: FOR ALL public keys and FOR
      ALL adversaries, which no measurement on eight toy graphs can reach.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: an empirical scaling law for the mixing time of the l = 2
        supersingular isogeny graph, at n <= 10927, over eight primes, in one
        instrument lineage, with its fit residual and its extrapolation factor
        (7 bits of log2(n) measured against 252 bits of interest, i.e. 36x)
        reported beside every extrapolated number. It CANNOT certify a mixing
        time at cryptographic n; CANNOT certify anything about a union graph;
        CANNOT certify anything about the F_p-rational subgraph or about
        KN-TECH-057's conditional p^{1/4} row; CANNOT move any exponent; CANNOT
        say anything about the response isogeny's distribution or about
        unforgeability; and CANNOT say anything about SQIsign at all until the
        Stage-0 reading gate has established what the commitment mechanism
        actually is.
      nearby_object_control: >-
        THE DUMBBELL, and it is a genuine nearby object rather than a decoration:
        same vertex count, same degree, same code path, and the hoped-for
        conclusion (fast mixing) is KNOWN FALSE there by an elementary
        conductance argument - a 3-regular graph split into halves joined by
        t = 1 edge has conductance ~2/(3n), so its relaxation time is at least
        3n/4 and its k_mix grows LINEARLY in n while an expander's grows
        logarithmically. A method that cannot hold that pair apart has not
        identified expansion, and the pre-registered threshold is a k_mix ratio
        of at least 10 at matched n. A SECOND nearby object is named and
        DECLARED OUT OF SCOPE rather than quietly skipped: the F_p-rational
        subgraph on ~sqrt(p) vertices, where the mixing question is genuinely
        open and where KN-TECH-057's own conditional row lives.
    proof_obligations:
    - claim: >-
        The constructed graph is G_2(p) with correct multiplicities and correct
        automorphism weights, discharged by the four exact forced values F-a..F-d
        rather than assumed.
      responsibility: correctness
    - claim: >-
        TV_k <= (sqrt(n)/2)*mu_emp^k holds pointwise at every measured k and p,
        and mu_emp <= 2*sqrt(2)/3 at every p.
      responsibility: baseline
    - claim: >-
        The fitted slope is stable under the top-four-primes refit to within
        0.35, establishing the EXISTS-FORALL quantifier order rather than its
        trivial converse.
      responsibility: strictness
    - claim: >-
        The dumbbell positive control fires at ratio >= 10, demonstrating that
        the instrument can detect slow mixing at all.
      responsibility: feasibility
    - claim: >-
        Nothing here transfers to a union graph, to the F_p-rational subgraph, or
        to any statement about SQIsign absent the Stage-0 gate, and every
        citation carries that gap.
      responsibility: scope
    - claim: >-
        Exact arithmetic where exactness is claimed (vertex counts, mass sum,
        detailed balance) and stated floating-point tolerances elsewhere, with
        the TV computation's accumulated error bounded and reported.
      responsibility: correctness
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    DELIBERATELY NULL. There is no complexity claim of any kind. This hypothesis
    measures a mixing constant inside a security argument; it makes no problem
    easier, moves no exponent, proposes no algorithm, and adds no attack. The
    matched full-cost baselines of KN-TECH-057 (MITM p^{2/3} over F_{p^2},
    Delfs-Galbraith p^{1/3} over F_p, van Oorschot-Wiener p^{1/2} over F_{p^2}
    and p^{1/4} over F_p conditional on unproven subgraph mixing, all READ
    in-repo) stand entirely unaffected, and sota_delta is zero on every attack
    axis - time, memory, data, queries, advice. dominated_by is not applicable
    because no Pareto point is claimed.

  heuristic_assumptions:
  - id: HEUR-CWM-1
    formal_statement: >-
      FORALL p in the declared ladder, the graph produced by the implemented Velu
      construction is the supersingular 2-isogeny graph of p, with correct edge
      multiplicities and correct automorphism weights at j = 0 and j = 1728.
    random_model_justification: >-
      NOT A PROBABILISTIC HEURISTIC. It is a correctness claim, and it is
      DISCHARGED BY FOUR EXACT FORCED VALUES rather than assumed: the vertex
      count F-a, the Eichler mass sum F-b, exact detailed balance F-c, and
      independent agreement with the Phi_2 root construction F-d. Two instances
      of F-b were computed by hand while writing this record and agree exactly.
    supporting_results: []
    validation_experiment_ids: [EXP-SQISIGN-7a48bb]
    falsification_condition: >-
      Any of F-a..F-d failing at any ladder prime. The run ends as an
      infrastructure outcome under AGENTS.md rule 5 and NO mathematical
      conclusion of any kind is drawn from it.
  - id: HEUR-CWM-2
    formal_statement: >-
      FORALL sufficiently large n, k_mix(n) = a*log2(n) + b with a, b independent
      of n, AND the constants fitted over log2(n) in [6.44, 13.42] are the
      constants that govern at log2(n) = 252.4.
    random_model_justification: >-
      NONE THAT SURVIVES SCRUTINY, AND THIS IS THE WEAKEST LINK IN THE RECORD.
      The spectral inequality is a genuine upper bound at every n, so the 5.885
      candidate is safe AS A BOUND; the two cutoff candidates are asymptotic
      statements whose approach rate at n ~ 10^4 is unknown to this program. The
      measured slope may therefore be a finite-size artifact, and the fitted b
      may be absorbing a term that is not constant. Extrapolating 7 measured bits
      of log2(n) to 252 is a 36x extrapolation and is labelled as one everywhere
      it appears.
    supporting_results: []
    validation_experiment_ids: [EXP-SQISIGN-7a48bb]
    falsification_condition: >-
      The slope fitted over the top four primes differs from the slope fitted
      over all eight by more than 0.35, or the two TV targets (1/4 and 1/100)
      yield slopes differing by more than 0.35. Either means the asymptotic
      regime has not been reached; the extrapolation is WITHDRAWN, not reported
      with a caveat, and the deliverable becomes the measured curves plus that
      statement.
  - id: HEUR-CWM-3
    formal_statement: >-
      The l = 2 graph's mixing behaviour is representative of the union graph
      over the prime factors of a real commitment degree.
    random_model_justification: >-
      Weak and explicitly one-directional. A union of expanders is at least as
      good an expander as its best factor, so an l = 2 reading is CONSERVATIVE
      in one direction and carries no information in the other. No claim of
      two-sided representativeness is made.
    supporting_results: []
    validation_experiment_ids: []
    falsification_condition: >-
      Not tested by this experiment and declared untested. The follow-on that
      would test it - the identical instrument on G_3 and on G_2 union G_3 over
      the same ladder - is named as forward guidance and is a separate contract,
      not a stage of this one.

  structural_ingredients:
  - description: >-
      Pizer's theorem that the supersingular l-isogeny graph is Ramanujan, i.e.
      that the second-largest absolute eigenvalue is at most 2*sqrt(l) in the
      (l+1)-regular normalisation.
    citation: >-
      NOT RETRIEVED AND NOT VERIFIED. Recalled from memory. No author beyond the
      name, no venue, no year, no theorem number is asserted. It is used only to
      supply the numerical value 2*sqrt(2)/3, and the run MEASURES mu_emp and
      compares it to that value, so the recall is tested rather than trusted.
    role: numerical value of the spectral bound, and an instrument self-check
  - description: >-
      Cutoff for the simple random walk on Ramanujan graphs at
      (d/(d-2))*log_{d-1}(n), and for the non-backtracking walk at log_{d-1}(n).
    citation: >-
      NOT RETRIEVED AND NOT VERIFIED. Recalled, and associated in memory with the
      cutoff literature; NO AUTHOR ATTRIBUTION, VENUE, YEAR OR THEOREM NUMBER IS
      ASSERTED. Used only as two of three pre-registered candidate slopes to be
      confirmed or refuted by measurement.
    role: candidate scaling laws under test
  - description: >-
      Eichler mass formula, sum over supersingular E of 1/|Aut(E)| = (p-1)/24,
      and the vertex count floor(p/12) + e.
    citation: >-
      NOT RETRIEVED. Recalled, and numerically consistent at p = 1031 and
      p = 4099 as computed in the mechanism above. Re-verified by direct
      enumeration at every ladder prime inside the run.
    role: exact instrument forced values F-a and F-b
  - description: >-
      The classical modular polynomial Phi_2(X, Y).
    citation: >-
      COEFFICIENTS RECALLED, UNVERIFIED. Used ONLY as an independent cross-check
      against a from-scratch Velu construction. On disagreement, Velu is
      authoritative and the recalled Phi_2 is quarantined as an infrastructure
      finding.
    role: independent edge-set construction, forced value F-d
  - description: >-
      Friedman's theorem that random d-regular graphs are near-Ramanujan
      asymptotically almost surely.
    citation: >-
      NOT RETRIEVED AND NOT VERIFIED. Used only to motivate the matched null's
      expected behaviour; the null's slope and mu_emp are MEASURED, never
      assumed.
    role: expected behaviour of the matched null

  reduction_chain:
    core_problem: >-
      Measure, exactly and without sampling, the total-variation mixing scaling
      law of the simple and non-backtracking walks on the supersingular
      2-isogeny graph over a ladder of toy primes, and determine which of three
      pre-registered candidate slopes governs.
    corollaries: []
    corollaries_note: >-
