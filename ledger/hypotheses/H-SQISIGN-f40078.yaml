      an INSTRUMENT CHECK, not a finding. A measured value above it means the
      construction is wrong - most likely the j = 0 / j = 1728 weighting - the
      package is invalid, and nothing is reported.
  - metric: >-
      slope_NBRW: fitted dk_mix/dlog2(n) for the non-backtracking walk on
      G_2(p) from j = 1728, TV target 1/4, over all eight primes
    direction: different
    minimum_effect: >-
