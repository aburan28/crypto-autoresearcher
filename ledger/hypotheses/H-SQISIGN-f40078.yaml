  test_boundary:
    instances:
    - >-
      Supersingular 2-isogeny graphs G_2(p) over F_{p^2} for the eight declared
      primes p = 3 mod 4: 1031, 2063, 4099, 8219, 16411, 32771, 65539, 131111.
      No other prime, no other l, no subgraph.
    - >-
      Matched null: random 3-regular graphs on the same vertex counts,
      configuration model, seeds 1, 2, 3.
    - >-
      Positive and graded controls: dumbbells on the same vertex counts with
      t in {1, 2, 4, 8, 16, 32} cross edges.
    - >-
      Walks: simple reversible and non-backtracking. Start vertices: j = 1728 and
      the deterministic generic vertex. Nothing else.
    parameters:
      primes: [1031, 2063, 4099, 8219, 16411, 32771, 65539, 131111]
      p_mod_12: [11, 11, 7, 11, 7, 11, 7, 11]
      expected_vertex_counts: [87, 173, 342, 686, 1368, 2732, 5462, 10927]
      expected_counts_note: >-
        floor(p/12) + e with e = 2 for p = 11 mod 12 and e = 1 for p = 7 mod 12.
        RECALLED and TO BE RE-VERIFIED BY ENUMERATION; a mismatch is forced
        value F-a failing.
      isogeny_degree_l: 2
      walks: [simple_reversible, non_backtracking]
      start_vertices: [j_1728, deterministic_generic]
      tv_targets: [0.25, 0.01]
      max_walk_steps: 400
      null_seeds: [1, 2, 3]
      dumbbell_cross_edges: [1, 2, 4, 8, 16, 32]
      spectral_bound_mu: 0.9428090415820634
      log2_inv_mu: 0.08496250072115605
      candidate_slopes: [1.0, 3.0, 5.884949192361728]
      decision_window: 0.35
    implementation: >-
      Pure Python plus numpy 2.4.6 (VERIFIED PRESENT on this machine 2026-08-05;
      sympy, scipy, Sage and PARI all VERIFIED ABSENT). Required components,
      written from scratch: F_{p^2} = F_p(i) arithmetic for p = 3 mod 4; cubic
      root-finding over F_{p^2} by gcd(Y^{p^2} - Y, f) followed by
      Cantor-Zassenhaus splitting; Velu 2-isogenies from the 2-torsion; breadth-
      first construction of G_2(p) from E_0 : y^2 = x^3 + x; sparse
      matrix-vector iteration for the TV curves; deflated power iteration for
      mu_emp. No solver is required and none is available; if any stage turns out
      to need one, that is an INFRASTRUCTURE REQUEST under AGENTS.md rule 3 and
      not an experiment.
    budget:
      stage1_wall_clock_seconds: 300
      stage1_compute: "graph construction and forced values at p = 1031 only"
      stage2to4_wall_clock_seconds_ceiling: 5400
      maximum_memory_gb: 4
      maximum_runs: 1
      note: >-
        Stage 1 is decisive for the instrument and must pass before any other
        stage runs. No stage of this hypothesis is authorized for execution by
        this record: only a Coordinator approval of EXP-SQISIGN-7a48bb can do
        that.

  falsification_conditions:
  - >-
    F1 (INSTRUMENT, CHEAPEST, RUNS FIRST) - any of the four forced values
    F-a..F-d fails at any ladder prime, or mu_emp exceeds 2*sqrt(2)/3 anywhere.
    The construction is wrong; the package is invalid; NOTHING is reported, and
    the outcome is infrastructure signal under AGENTS.md rule 5, never
    mathematical evidence.
  - >-
    F2 (SENSITIVITY) - the dumbbell positive control does not fire at
    ratio >= 10. The instrument cannot detect slow mixing and NO NEGATIVE FROM
    ANY ARM IS ADMISSIBLE.
  - >-
    F3 (THE CLAIM) - slope_NBRW is not within 0.35 of 1.0. The hypothesis as
    stated is falsified. If it is instead within 0.35 of 3.0 or 5.885, the
    corresponding alternative is reported as the finding; if it is within 0.35
    of none, the reported result is "none of the three models describes this
    graph at these sizes", with the measured slope attached and with forward
    guidance naming what a fourth model would have to explain.
  - >-
    F4 (QUANTIFIER ORDER) - the top-four-primes refit or the second TV target
    moves the slope by more than 0.35. The EXISTS-FORALL order is not
    established, HEUR-CWM-2 fails, and the extrapolation is WITHDRAWN rather
    than reported with a caveat.
  - >-
    F5 (RATIO CHECK) - slope_SRW/slope_NBRW is not 3.0 +/- 0.5 while both
    individual slopes were nonetheless assigned to candidates. The two
    assignments are then mutually inconsistent and neither may be reported
    without the inconsistency stated first.
  - >-
    F6 (THE PLANNED NEGATIVE, PRE-REGISTERED SO IT CANNOT BE DOWNGRADED LATER) -
    slope_NULL equals slope_NBRW within 0.35. This is NOT a failure. It is the
    controlled null: the commitment-uniformity premise rests on generic
    expansion and on nothing supersingular-specific, and the deliverable is that
    sentence with the measured numbers. A run that produces it and does not emit
    that sentence HAS NOT FINISHED.

  interpretation_limits:
  - >-
    CLAIM TIER TOY, and no downstream citation may raise it. Every number is
    measured at p <= 131111 against a scheme prime of ~2^256. AGENTS.md rule 7.
  - >-
    NO SQIsign STATEMENT IS LICENSED WITHOUT THE STAGE-0 READING GATE. This
    hypothesis is about a graph. RQ-SQISIGN-001.constraints forbids designing on
    unverified per-scheme claims, and no SQIsign specification of any version has
    been read by this program.
  - >-
    A fitted slope is not a proof of a mixing time. The deliverable is an
    empirical scaling law with a stated fit range and a stated 36x extrapolation
    factor, not a theorem.
  - >-
    l = 2 ONLY. Nothing here transfers to the union graph a real commitment
    degree would use, and the union result could only be better, never worse.
  - >-
    NOT THE F_p-RATIONAL SUBGRAPH. KN-TECH-057's conditional p^{1/4} row rests on
    an unproven mixing assumption about that subgraph; this record measures the
    FULL graph and neither supports nor weakens that row. Any citation in that
    direction is a misuse.
  - >-
    A distinguishability statement about the commitment marginal would concern
    the ZERO-KNOWLEDGE ARGUMENT, never unforgeability, and the commitment
    marginal is secret-independent, so nothing here is or can become a
    key-recovery route. Writing it up as one would be the overclaiming failure
    the program's rules exist to prevent.
  - >-
    NO HARD PROBLEM IS COSTED. This record does not enter GOAL-SSI-001's
    endomorphism-ring lane, does not touch GOAL-SQISIGN-002's published-data
    surface or the Kani template, and stays out of the broken SIDH torsion-image
    setting that GOAL-SQISIGN-001 places out of scope.

