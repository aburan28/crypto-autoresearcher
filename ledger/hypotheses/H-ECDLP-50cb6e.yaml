hypothesis:
  id: H-ECDLP-50cb6e
  question_id: RQ-SDEG-001

  statement: >-
    SCOPE: Semaev decomposition systems over prime fields at the SDEG lane s toy
    ladder, on curves admitting short-Weierstrass, Edwards, Montgomery and
    Hessian models simultaneously. CLAIM TIER toy. NO ATTACK, NO EXPONENT, NO
    STATUS CHANGE TO ANY RECORD.
    A curve has many models related by birational maps, and the summation
    polynomials differ between them because the addition law differs, while the
    ECDLP is identical across all of them. The claim under test is that the
    SOLVING DEGREE of the decomposition system is a model INVARIANT - formally,
    that for a fixed curve and fixed arity the paired cross-model difference in
    solving degree does not exceed the within-model variance induced by monomial
    ordering, on at least 8 of 10 ladder curves.
    Both outcomes are useful and neither is currently known to this program. If
    invariant, the lane gains a robustness result that a cost model needs before
    it can be extrapolated. If not invariant, some model is cheaper, the lane s
    C_decomp is overstated by a measurable ratio, and choosing the best model is
    a free improvement to a cost-model input - which is explicitly a CONSTANT
    FACTOR and, per docs/target-result-profile.md, explicitly NOT a target-class
    result and must never be presented as one.

  mechanism: >-
    Four stages, of which the third is the measurement and the first two are
    gates.
    STAGE 1 - construct a ladder of curves admitting all four models. Edwards and
    Montgomery require a rational point of order 4 and Hessian a rational point
    of order 3, so the full set forces the group order to be divisible by 12. The
    ladder is therefore NOT GENERIC and that bias is a reported quantity, not an
    absorbed caveat. Curves admitting only some models are recorded separately,
    never dropped.
    STAGE 2 - generate the summation polynomial and the decomposition system in
    each model, then VERIFY the systems describe the same decomposition problem
    by solving both at tiny size and checking that the solution sets correspond
    under the birational map. Without this check the comparison is meaningless,
    and it is the stage most likely to be skipped, so it is blocking.
    STAGE 3 - measure solving degree, wall clock and relation yield per (curve,
    model), paired per curve, with the ordering-variance null measured FIRST so
    that the comparison basis exists before any cross-model number is read.
    STAGE 4 - report paired ratios and, if a model dominates, quantify the effect
    on the lane s existing C_decomp as a ratio rather than as the word faster.
    WHY THE ORDERING NULL COMES FIRST AND WHY ITS WIDTH IS ITSELF A RESULT. If
    the ordering-induced spread swamps any plausible cross-model difference at
    the reachable sizes, the experiment is UNDERPOWERED and the honest output is
    the required size, not a null result. If instead the spread is exactly zero,
    the solver is insensitive to ordering at these sizes and the null cannot
    bound anything - a different degeneracy, and it is stopped on too.

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Null deliberately. If a model dominates, the gain is a CONSTANT FACTOR in the
    C_decomp numerator. Per docs/target-result-profile.md this is not a
    target-class result, moves no exponent, and may not be described as one.

  rerandomization: null

  proof_search_map:
    bottleneck: >-
      The step that treats a measured solving degree as a property of the CURVE
      rather than of the presentation the lane happened to choose. Every
      extrapolation of C_decomp passes through it, and the lane has held the
      model fixed at short Weierstrass throughout without recording that as a
      choice.
    baseline_embedding:
      parameter_slice: >-
        The identity model change - short Weierstrass compared with itself under
        the same variable ordering. Solving degree must be bit-identical. This is
        the degenerate slice the pipeline must reproduce before any nontrivial
        model change is trusted.
      reproduction_check: >-
        Exact equality of solving degree, of the reduced basis hash, and of the
        relation yield. Failure is an implementation defect and halts the run.
    observation_collision:
      observable: >-
        The solving degree of the decomposition system at fixed arity.
      distinct_preimage_search: >-
        REQUIRED. Exhibit two objects with the same solving degree and opposite
        standing - the same curve in two models, and two DIFFERENT curves in one
        model. If solving degree alone cannot separate them, then a cross-model
        equality is not by itself evidence of invariance, and the claim must be
        carried by the PAIR of the solving degree and the ordering-variance
        spread on the same curves. The design records both.
      constructive_note: >-
        This is why the minimum effect in P4 is stated relative to the null
        spread and never as a bare equality.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "what is the decomposition cost of this curve" with "what is
          the decomposition cost of this curve in its cheapest available model",
          making the model an optimised parameter rather than an unrecorded
          background choice.
        predicted_gain: >-
          If a model dominates, a quantified constant-factor reduction in the
          lane s C_decomp numerator at the cost of one change of coordinates. NO
          EXPONENT IS MOVED.
      - transform: observable_fiber
        proposed_object: >-
          Hold the curve fixed and vary the model, recording the fibre of solving
          degrees a single curve can produce. Its WIDTH is what decides whether
          any single-model C_decomp in this corpus is a curve property.
        predicted_gain: >-
          Converts the lane s existing C_decomp point values into values carrying
          a presentation-induced spread, which is a strictly more honest reading
          of measurements already committed.
    quantifier_order: >-
      CLAIMED - FOR ALL curves in the tested ladder, FOR ALL pairs of the four
      models, the paired difference in solving degree is within the within-model
      ordering spread measured on that same curve. NOT CLAIMED - anything about
      generic curves, about curves whose order is not divisible by 12, about
      arities other than the tested one, or about any solver other than the one
      used.
    method_ceiling:
      strongest_certifiable_claim: >-
        That on a torsion-constrained toy ladder, at one arity, under one solver
        and one model-independent monomial-order convention, the solving degree
        does or does not move across four birational models by more than the
        ordering-induced spread. It can never certify model-independence as a
        theorem, and it can certify nothing about generic curves.
      nearby_object_control: >-
        THE CURVE-FREE MATCHED-SHAPE SYSTEM under an analogous presentation
        change - a random system of the same variable count and degree sequence,
        put through a random invertible change of variables that reproduces the
        degree and support changes a model change induces. It is the object on
        which the conclusion "solving degree moved because the curve model
        changed" is KNOWN FALSE, since there is no curve in it. A pipeline that
        reports the same movement there has not identified a curve effect.
    proof_obligations:
      - claim: The four models solution sets correspond under the birational maps.
        responsibility: correctness
      - claim: >-
          Two admissible short-Weierstrass models of one curve are
          indistinguishable.
        responsibility: baseline
      - claim: >-
          The ordering-variance spread is strictly positive and is measured
          before any cross-model comparison.
        responsibility: strictness
      - claim: >-
          A planted degree increase of known size is detected at the predicted
          magnitude in every model.
        responsibility: feasibility
      - claim: >-
          The ladder s torsion constraint is reported and no generic-curve claim
          is made from it.
        responsibility: scope

  assumptions:
    - >-
      A curve ladder admitting all four models simultaneously is constructible at
      toy size. This forces the group order to be divisible by 12 and therefore
      BIASES THE LADDER AWAY FROM GENERIC CURVES. That is a real confounder, it
      is reported per curve as the torsion structure, and no generic-curve
      statement follows from the ladder.
    - >-
      The birational maps are computable and their solution-set correspondence is
      verifiable at tiny size. Standard, and Stage 2 checks it rather than
      assuming it.
    - >-
      The monomial order is specified MODEL-INDEPENDENTLY. A model change alters
      the variables, and a variable-name-dependent order would make the
      experiment measure the order rather than the model.
    - >-
      Generator code parity across models is reviewed before results are
      admitted. Short-Weierstrass summation polynomials are well trodden here and
      the other models are not; an unoptimised or subtly wrong generator in a
      less-trodden model produces a spurious model effect IN THE DIRECTION THE
      RECORD IS LOOKING FOR, which is the worst available failure mode.

  heuristic_assumptions:
    - id: HEUR-MODEL-1
      formal_statement: >-
        For a fixed curve and fixed arity, the solving degree of the Semaev
        decomposition system is the same across birationally equivalent models,
        up to the solver s ordering-induced variance.
      random_model_justification: >-
        The rigorous ingredient is that the models are birationally equivalent
        over the base field, so the decomposition VARIETIES correspond and the
        solution counts agree. THE GAP, AND IT IS THE REASON THIS IS A HEURISTIC
        RATHER THAN A COROLLARY - solving degree is a property of the ideal s
        PRESENTATION and of the ALGORITHM, not of the variety, and birational
        equivalence of varieties does not imply equal solving degree of the
        corresponding presentations. That gap is exactly what the measurement
        probes. No distribution is imitated.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-728bf1]
      falsification_condition: >-
        A reproducible cross-model solving-degree difference exceeding the
        ordering-variance spread on at least 3 curves, with the curve-free arm
        NOT reproducing the same movement.

  structural_ingredients:
    - description: >-
        The SDEG lane s scope, declared as short-Weierstrass generic ordinary
        curves, which is what makes the model a fixed and previously unrecorded
        background choice.
      citation: ledger/questions/RQ-SDEG-001.yaml
      provenance: internal
      verified_by: >-
        coordinator subagent under TASK-20260904-c0edda, 2026-09-04, read
        ledger/questions/RQ-SDEG-001.yaml in full (25 lines); its scope field
        reads short_weierstrass generic ordinary.
      role: establishes the model as an unexamined lane-wide choice
    - description: >-
        Torsion conditions for the alternative models - order 4 rational point
        for Edwards and Montgomery, order 3 for Hessian - forcing 12 to divide
        the group order for a curve admitting all four.
      citation: >-
        Standard elliptic-curve model theory. NO TEXT WAS OPENED for this record
        and the conditions are reproduced so a reviewer can check them without a
        library; Stage 1 must verify each condition per curve computationally
        rather than relying on this statement.
      provenance: recalled
      verified_by: null
      role: determines the ladder and its non-genericity
    - description: >-
        The fast-arithmetic literature on curve models, which compares the cost
        of a GROUP OPERATION across models and is the likeliest location of prior
        art for a solving-degree comparison.
      citation: >-
        Recalled only. NOT SCREENED AND NOT OPENED. Stage 1 must include a
        literature check, and if the question is already settled there this
        record reduces to a citation.
      provenance: recalled
      verified_by: null
      role: novelty risk, disclosed rather than assumed away

  predictions:
    - metric: >-
        P1 - solution-set correspondence under the birational map at tiny size,
        per curve, per model pair
      direction: different
      minimum_effect: >-
        FORCED TO CORRESPOND EXACTLY. Failure means the systems are not the same
        problem and every subsequent comparison on that curve is void.
    - metric: >-
        P2 - ORDERING-VARIANCE NULL - solving degree of one fixed model under at
        least 5 random variable orderings per curve, reported BEFORE any
        cross-model number is read
      direction: different
      minimum_effect: >-
        SPREAD STRICTLY GREATER THAN 0 and strictly less than 2 degrees. A spread
        of exactly 0 means the null cannot bound anything and the comparison
        basis does not exist; a spread of 2 or more degrees means the design is
        underpowered at this size and the run must report the size at which it
        would not be, rather than reporting a null result.
    - metric: >-
        P3 - TWO ADMISSIBLE SHORT-WEIERSTRASS MODELS of the same curve, related
        by an admissible u-to-the-fourth and u-to-the-sixth scaling
      direction: different
      minimum_effect: >-
        FORCED INDISTINGUISHABLE within the P2 spread. A difference means the
        pipeline responds to something other than the model and voids the
        cross-model comparison.
    - metric: >-
        P4 - PLANTED DEGREE DEFECT, SWEPT - a generator of known degree d
        injected into the system in each model, d swept over at least 3 values
      direction: higher
      minimum_effect: >-
        The measured solving degree must rise by the pre-computed predicted
        amount in EVERY model at EVERY d, within the P2 spread. This is the
        dynamic-range demonstration - without it, a report that solving degree
        did not move across models is a report from an instrument never shown to
        be able to see a move.
    - metric: >-
        P5 - paired per-curve cross-model difference in solving degree (integer
        degrees), across all four models
      direction: different
      minimum_effect: >-
        INVARIANT is declared if the maximum paired difference is within the P2
        spread on at least 8 of 10 ladder curves. NOT INVARIANT is declared if a
        single model is strictly lowest by more than the P2 spread on at least 3
        curves, reproducibly across orderings. The band between is pre-declared
        INCONCLUSIVE.
    - metric: >-
        P6 - CURVE-FREE ARM - the same cross-presentation solving-degree movement
        measured on matched-shape random systems under an analogous random
        invertible change of variables
      direction: different
      minimum_effect: >-
        No direction pre-committed and this is the scope gate. IF THE CURVE-FREE
        ARM REPRODUCES THE CROSS-MODEL MOVEMENT WITHIN ITS SPREAD, the observed
        effect is the solver responding to degree and support changes, NOT to
        elliptic-curve structure, and nothing from this experiment may be quoted
        as a statement about elliptic curves or the ECDLP.
    - metric: >-
        P7 - if a model dominates, the ratio by which the lane s existing
        C_decomp is overstated (dimensionless ratio, with interval)
      direction: lower
      minimum_effect: >-
        Quantified as a ratio with an interval, never described with the word
        faster. Explicitly labelled a CONSTANT FACTOR and explicitly labelled
        non-target-class.

  test_boundary:
    instances: >-
      At least 10 toy curves admitting all four models simultaneously, at one
      prime size, at the lane s existing summation arity; curves admitting only
      some models recorded separately; a matched-shape curve-free random-system
      arm at the same shapes.
    parameters:
      models: [short_weierstrass, edwards, montgomery, hessian]
      curves_admitting_all_four: 10
      orderings_per_curve_model: 5
      planted_degree_values: at least 3
      monomial_order: specified model-independently and recorded per run
    implementation: >-
      Summation-polynomial and decomposition-system generators per model, a
      birational-correspondence checker, and the lane s existing Groebner
      instrumentation. Generator code parity across models is reviewed before any
      result is admitted.
    budget:
      wall_clock_seconds_per_run: 3600
      maximum_memory_gb: 16
      maximum_runs: 400

  falsification_conditions:
    - >-
      F1 - solution sets do not correspond under the birational map. The systems
      are not the same problem; halt on that curve.
    - >-
      F2 - the two admissible short-Weierstrass models differ beyond the ordering
      spread. Pipeline artifact; the cross-model comparison is void.
    - >-
      F3 - the ordering spread is exactly 0, or is 2 degrees or more. In the
      first case the null cannot bound anything; in the second the design is
      underpowered. Either way report the condition and the required size, NEVER
      a null result.
    - >-
      F4 - the planted degree defect does not fire at the predicted magnitude in
      every model. The instrument cannot see a move it was told about, and no
      invariance verdict may be reported.
    - >-
      F5 - a model dominates reproducibly across the ladder. The lane s C_decomp
      is overstated by the measured ratio and must be refitted. This is the
      record s positive outcome and it is a constant factor.
    - >-
      F6 - the curve-free arm reproduces the movement. Scope collapses to solver
      behaviour on systems of that shape and no elliptic-curve statement may be
      made.

  interpretation_limits:
    - >-
      CLAIM TIER toy. Scoped to the tested models, arity, ladder, monomial-order
      convention and solver.
    - >-
      NO STATEMENT ABOUT GENERIC CURVES FOLLOWS FROM A TORSION-CONSTRAINED
      LADDER. Requiring all four models forces 12 to divide the group order, so
      the ladder is not generic, and generalising an invariance result from it to
      generic curves is exactly the extrapolation AGENTS.md core rule 7 forbids
      without an explicit stated assumption.
    - >-
      Produces no attack and no exponent. At most it validates or improves a
      cost-model input by a constant factor.
    - >-
      An invariance result is evidence of robustness within the tested range, NOT
      a theorem of model-independence.
    - >-
      NOT TESTABLE AT REACHABLE SCALE, STATED PLAINLY. Whether solving degree
      remains model-invariant at the sizes where C_decomp would actually be
      extrapolated is beyond any budget this program can grant, and the record
      does not shrink its claim to hide that.
    - >-
      Changes no status. Any refit of C_decomp is a Coordinator decision made
      elsewhere on committed evidence.

  status: proposed
  proposed_by: coordinator

  source_refs:
    - ledger/proposals/IDEA-20260815-b751cf.yaml
    - ledger/questions/RQ-SDEG-001.yaml
    - ledger/handoffs/TASK-20260904-c0edda.yaml
    - docs/inventor-protocol.md
    - docs/target-result-profile.md
    - templates/research-records.md

  authoring_note: >-
    Written under TASK-20260904-c0edda (DESIGN ONLY) from IDEA-20260815-b751cf.
    RQ-SDEG-001 was read in full before its characterisation was adopted. The
    source idea names KN-OPEN-003 as its closest neighbour and requires a check
    of that record s existing evidence at Stage 1; THIS AGENT DID NOT OPEN
    KN-OPEN-003, so no characterisation of it is adopted here and the Stage 1
    check remains an open obligation on the executing session. The swept
    planted-degree arm (P4) and the curve-free arm (P6) are added to the source
    idea s three nulls.
