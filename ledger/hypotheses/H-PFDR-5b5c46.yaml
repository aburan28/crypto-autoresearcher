hypothesis:
  id: H-PFDR-5b5c46
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  added: '2026-09-04'
  derived_from_idea: IDEA-20260825-7efa27
  batch_id: BATCH-2c45e2
  statement: >-
    A PUBLIC TRANSCRIPT FILTRATION CAN BIAS A NON-BACKTRACKING WALK ONLY IF IT CARRIES
    INFORMATION THE ORDINARY TRANSCRIPT DOES NOT, AND THE EXPERIMENT THAT WOULD SHOW
    OTHERWISE IS THE ONE THIS RECORD PRE-REGISTERS AS THE LIKELY OUTCOME.
    (S1 THE LOSSY-PROJECTION GATE, ZERO COMPUTE, AND IT COMES FIRST) The filtration -
    the affine coefficient pair, a bounded residue window, and a support-compatible
    potential updated from each public group operation - must be a genuinely LOSSY
    projection of the transcript that nevertheless propagates deterministically under
    the declared public step set. If two distinct transcripts with different affine
    coefficients and different endpoints cannot be exhibited sharing one filtration
    state, the filtration is invertible, it is a change of coordinates rather than an
    object, and the line halts before any walk runs.
    (S2 THE COST CLAIM, WITH ITS POWER STATED) At fixed memory and processor count and
    with adaptive selection, restart, metadata and certificate costs all charged, the
    filtration-enabled walk reaches a certified collision in at most 0.90 times the
    expected charged group operations of the fixed-predicate baseline, with a bootstrap
    interval excluding 1.00.
    (S3 THE CURVE-FREE GATE, WHICH DECIDES WHETHER ANY OF IT IS ABOUT ELLIPTIC CURVES)
    The identical filtration and the identical walk on a random cyclic group of the same
    order with a matched step-count distribution must show NO potential excess and NO
    collision-time reduction. If the signal appears there too, the effect is a property
    of the walk and the filtration and NOT of elliptic curves, and nothing may be quoted
    as a statement about elliptic curves or the ECDLP.
    THE RECORD PREDICTS THAT S3'S CONTROL WILL ERASE THE SIGNAL. That prediction is a
    falsifiable frontier result, not a closure, and it is recorded before the run rather
    than after.
  mechanism: >-
    Replace a static distinguished-point predicate with a public state filtration of the
    walk transcript, and choose non-backtracking steps by a pre-registered transition
    rule that maximises the expected decrease of a bounded potential while retaining an
    invertible scalar transcript. A collision certificate carries both endpoint equality
    and the complete coefficient transcript. The stopping time is charged through an
    optional-stopping or entropy argument, and a gain may be claimed only if the
    potential survives a same-shape null and the optional-stopping bound is uniform. The
    load-bearing question is whether the potential carries any non-generic information at
    all - if the filtration is simulable from the ordinary transcript then a generic
    argument already forbids a gain, and the measurement's job is to find out which.
  band_non_degeneracy:
    checked_by: TASK-20260904-5423ad
    finding: >-
      THE SOURCE IDEA'S PRIMARY BAND IS UNQUANTIFIED AND WOULD NOT HAVE BEEN
      RESOLVABLE AT ORDINARY SAMPLE SIZES. It asks for "a pre-registered strict reduction
      versus fixed-predicate rho" without a number and without a power statement. The
      collision time of a fixed-predicate walk is a heavy-tailed quantity whose
      coefficient of variation is about 0.52, so the standard error of a mean ratio over
      n independent instances is about 0.52 divided by the square root of n - which at 50
      instances per cell is 0.074 and at 200 is 0.037, giving 95 percent half-widths of
      about 0.145 and 0.073. A design at 50 instances per cell could not distinguish a
      10 percent reduction from no reduction at all, and a null there would be an
      absence of power rather than an absence of effect.
    change_made: >-
      The band is fixed at a charged-operation ratio of at most 0.90 with a bootstrap
      interval excluding 1.00, and the sample size is set at AT LEAST 500 INDEPENDENT
      SEEDED INSTANCES PER CELL, giving a standard error of about 0.023 and a 95 percent
      half-width of about 0.046 - comfortably below the 0.10 the band requires. A
      PLANTED-BIAS control of known magnitude is added so that the potential is shown to
      detect a bias of a known size before any null is interpreted. The
      distinct-preimage exhibition is promoted to a blocking zero-compute gate.
    alternative_hypothesis_range: >-
      Under S2 the ratio is at most 0.90 with the interval excluding 1.00. Under
      H_generic - the filtration is simulable from the ordinary transcript and carries no
      non-generic information - the ratio is 1.00 within the measured half-width of
      0.046, which is a bound and not merely an absence. Under H_artifact the ratio falls
      below 1.00 on the elliptic arm AND on the curve-free random cyclic group, which
      separates a walk-and-filtration effect from an elliptic one. All three are
      reachable at the declared sample size and the design reports which of them the data
      is in.
  assumptions:
  - >-
    The filtration is a genuinely lossy projection of the transcript and propagates
    deterministically under the declared public step set. This is verified by exhibition
    in S1 rather than assumed, because a state that is not operation-compatible is a
    renamed coordinate system and fails the projection test outright.
  - >-
    The potential has uniformly bounded increments and the declared stopping rule
    satisfies the hypotheses of an optional-stopping argument. Both are checked on the
    enumerated toy groups rather than asserted.
  - >-
    A lower potential corresponds to a certifiable collision opportunity rather than
    merely to a biased encoding. This is the assumption most likely to be false and it is
    what the curve-free arm and the label-permutation arm test.
  - >-
    The non-backtracking transition distribution remains sufficiently mixed for the
    collision analysis over the tested parameter range. No uniform spectral or mixing
    theorem is asserted for the proposed filtration and none is available to this
    program.
  - >-
    No deployed target, live key or secret scalar is used or inferred anywhere. Every
    instance is generated locally with a known scalar.
  proof_search_map:
    bottleneck: >-
      Converting a public adaptive stopping signal into a uniform collision-time
      improvement without violating generic-group transcript indistinguishability. If the
      filtration is simulable from the ordinary transcript, a generic argument already
      forbids the improvement, and the bottleneck is showing that it is not.
    baseline_embedding:
      parameter_slice: >-
        Freeze the step distribution to the standard walk with a fixed distinguished-point
        predicate and reproduce its collision law, its memory and its data before enabling
        the filtration.
      reproduction_check: >-
        A frozen toy-group fixture with a known scalar, replaying the exact transcript
        including inverse and non-backtracking bookkeeping, whose measured mean collision
        time must match the standard constant times the square root of the group order to
        within the measured half-width, on at least 500 instances.
    observation_collision:
      observable: >-
        The filtration state - the coefficient residue window, the potential, the
        step-history tag, and the distinguished endpoint encoding.
      distinct_preimage_search: >-
        REQUIRED, BLOCKING, AND ZERO COMPUTE. Construct two distinct transcripts with
        EQUAL filtration state but different affine coefficients and different endpoints.
        If none exists the filtration is invertible and the projection is a coordinate
        rename; if the stopping rule treats such a pair as equivalent WITHOUT an endpoint
        certificate, identifiability fails and every collision is suspect. Both outcomes
        are decided before any walk runs.
    constructive_transforms:
    - transform: telescoping_potential
      proposed_object: >-
        A bounded martingale or entropy potential on the affine transcript and the
        operation-compatible residue window.
      predicted_gain: >-
        A provable reduction in expected collision search, or a lower memory frontier at
        fixed time. THE RECORD ITSELF EXPECTS THE GENERIC CONTROLS TO REJECT AN EXPONENT
        GAIN if the potential carries no non-generic information, and says so in advance.
    quantifier_order: >-
      FOR EVERY prime-order curve and EVERY public instance pair in scope, THERE EXISTS a
      public step rule and a bounded potential such that FOR EVERY valid transcript the
      martingale bound holds - and ONLY THEN may one assert that there exists a stopping
      schedule with expected cost below the birthday exponent. The order matters - a
      per-instance schedule that works for some transcripts is not the claim and would not
      support it.
    method_ceiling:
      strongest_certifiable_claim: >-
        A scoped change in collision time or memory for a declared walk family at the
        tested group sizes, with every cost charged. IT CANNOT certify a generic
        improvement if the filtration is simulable from the ordinary transcript, and it
        cannot certify anything at cryptographic scale.
      nearby_object_control: >-
        THE IDENTICAL WALK AND FILTRATION ON A RANDOM CYCLIC GROUP OF THE SAME ORDER, and
        on a curve with structure-destroying step labels. A real elliptic signal must
        disappear on BOTH. A signal that survives either is a property of the walk or of
        the encoding rather than of the curve.
    proof_obligations:
    - claim: The lossy projection is deterministic under the declared step set.
      responsibility: correctness
    - claim: The baseline collision law and transcript recovery are reproduced.
      responsibility: baseline
    - claim: The potential has bounded increments and the optional-stopping hypotheses hold.
      responsibility: feasibility
    - claim: A uniform mixing bound holds for the non-backtracking walk.
      responsibility: success_probability
    - claim: The collision certificate and the scalar orientation are correct on every claimed solve.
      responsibility: interface
    - claim: Time, memory, data and parallel traffic are all charged.
      responsibility: runtime
    - claim: 'The signal disappears on the curve-free arm, or no elliptic statement is made.'
      responsibility: scope
    not_applicable_reason: null
  rerandomization: >-
    The walk is a re-randomisation device in the ordinary sense - a public pseudorandom
    step rule on the group - but NO worst-to-average-case reduction is claimed and NO
    mixing-time theorem is asserted for the proposed filtration. The absence is stated
    rather than left to be inferred, and it is the reason the mixing assumption appears in
    assumptions and in the proof obligations rather than in a citation.
  asymptotic_claim:
    problem: 'Prime-field ECDLP in a group of prime order.'
    prior_best: 'Square root of the group order with a constant near 0.886 for parallel rho with distinguished points, memory of order one.'
    time_exponent: >-
      UNVERIFIED TARGET BELOW ONE HALF. NO HONEST EXPONENT IS ASSIGNED until scaling data
      and an optional-stopping bound establish one, and none exists. Recording a value here
      would be a fabrication.
    memory_exponent: >-
      Potentially subpolynomial with distinguished storage, or a declared time-memory
      tradeoff, but adaptive metadata and certificate verification may INCREASE it and are
      charged.
    hidden_cofactor: >-
      Restarts, adaptive selection, mixing burn-in, potential evaluation, transcript
      storage, false-positive verification, parallel synchronisation, and every
      inverse-success-probability factor. All are charged and none is hidden.
    claim_kind: exponent_improvement
    claim_kind_note: >-
      The claim KIND is exponent_improvement because that is what the mechanism would be if
      it worked. NO IMPROVEMENT IS CLAIMED, the verified delta is zero on every axis, and
      the record's own prediction is that the generic controls erase the signal.
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: >-
      The non-backtracking walk reaches a distribution close enough to its declared
      stationary law before the stopping rule fires that the martingale collision
      calculation applies uniformly over the tested parameter range.
    random_model_justification: >-
      A finite-state walk can be analysed exactly on enumerable toy groups, so the
      stationary law and the total-variation distance are directly measurable there. NO
      UNIFORM SPECTRAL OR MIXING THEOREM IS ASSERTED for the proposed filtration and none
      is available to this program.
    supporting_results: []
    supporting_results_note: 'EMPTY AND HONESTLY SO. No theorem supports this and the measurement is the substitute.'
    validation_experiment_ids:
    - EXP-PFDR-4b5fc0
    falsification_condition: >-
      Measured total-variation distance to the declared stationary law exceeds the declared
      tolerance at the stopping time, at two or more group sizes, with the departure not
      shrinking as the walk depth increases.
  - id: HEUR-002
    formal_statement: >-
      The filtration potential has a structure-dependent excess that is ABSENT from the
      random cyclic-group and label-permuted nulls and that decreases under the proposed
      adaptive rule.
    random_model_justification: >-
      NO THEOREM SUPPORTS THIS. It is the central falsifiable empirical assumption of the
      record and it may be rejected by the mandatory controls, which is the outcome the
      record predicts.
    supporting_results: []
    supporting_results_note: 'EMPTY. This is the claim, not a supported premise.'
    validation_experiment_ids:
    - EXP-PFDR-4b5fc0
    falsification_condition: >-
      The measured potential trajectory on the random cyclic-group null is statistically
      indistinguishable from the elliptic arm, or the excess fails to decay as the
      structure-destroying parameter increases.
  structural_ingredients:
  - description: >-
      The mandatory generic baseline for this question - a transcript-tracked walk with
      distinguished points and collision recovery.
    citation: KN-TECH-006
    provenance: internal
    verified_by: >-
      Relayed from IDEA-20260825-7efa27, which cites specific lines of
      knowledge/techniques/KN-TECH-006.md. TASK-20260904-5423ad did NOT open that file and
      marks this entry relayed.
    role: 'the baseline the filtration must beat after every cost is charged'
  - description: >-
      This program's finding that incidence and ordinary endomorphism-image oracles are
      generic-group simulable on prime-order prime-field curves.
    citation: KN-FIND-b7e091
    provenance: internal
    verified_by: >-
      Relayed from IDEA-20260825-7efa27, which cites specific lines of
      knowledge/findings/KN-FIND-b7e091.md. NOT opened by TASK-20260904-5423ad and marked
      relayed.
    role: >-
      the standing reason the record expects the generic controls to erase the signal - if
      the filtration is likewise simulable, a gain is forbidden generically
  - description: >-
      The generic lower bound of order the square root of the group order.
    citation: KN-TECH-005
    provenance: internal
    verified_by: >-
      Relayed from RQ-ECDLP-002's constraint list, which TASK-20260904-5423ad read and
      which names generic and preprocessing lower bounds as mandatory matched controls.
    role: 'the bound any claimed exponent gain would have to escape, and the reason the prior of survival is low'
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
  - metric: >-
      distinct-preimage exhibition, a binary outcome - whether two transcripts with equal
      filtration state and different affine coefficients and endpoints exist
    direction: different
    minimum_effect: >-
      MUST EXIST, exhibited explicitly at zero compute. If none exists the filtration is
      invertible, it is a coordinate rename, and the line halts before any walk runs.
  - metric: >-
      expected charged group operations to a certified collision, filtration walk divided by
      fixed-predicate baseline, dimensionless, at matched memory and processor count
    direction: lower
    minimum_effect: >-
      At most 0.90 with a bootstrap interval excluding 1.00, over at least 500 independent
      seeded instances per cell. TASK-20260904-5423ad computed the required sample size -
      the collision-time coefficient of variation is about 0.52, so 500 instances give a
      standard error of about 0.023 and a 95 percent half-width of about 0.046, which
      resolves a 0.10 effect.
  - metric: >-
      potential excess on the elliptic arm minus the excess on the random cyclic-group arm,
      in the declared potential units
    direction: higher
    minimum_effect: >-
      Exceeding the null arm's own bootstrap width. IF THE EXCESS IS PRESENT ON THE
      CURVE-FREE ARM TOO, the effect is a property of the walk and the filtration and NOT of
      elliptic curves, and nothing may be quoted as a statement about elliptic curves or the
      ECDLP.
  - metric: >-
      planted-bias detection, the measured potential response to a partition carrying a
      deliberately injected bias of KNOWN magnitude
    direction: higher
    minimum_effect: >-
      Matching the predicted response at each of at least three planted magnitudes. Failure
      to detect a bias of known size means the potential lacks dynamic range and no null is
      interpretable.
  - metric: >-
      potential excess as a function of the structure-destroying parameter, in potential
      units
    direction: lower
    minimum_effect: >-
      Monotone decay toward the null value. AN UNEXPLAINED CONSTANT EXCESS THAT DOES NOT
      DECAY as the parameter meant to destroy it increases is the canonical artifact tell
      and voids the effect.
  - metric: 'transcript collision false-positive rate, dimensionless'
    direction: lower
    minimum_effect: >-
      EXACTLY ZERO after independent endpoint and coefficient verification. A single false
      positive means the certificate is not a certificate.
  test_boundary:
    instances:
    - >-
      Toy prime-order curve groups with known scalars, at group orders from about 2 to the
      20 to about 2 to the 32, at least 500 independent seeded instances per cell.
    - >-
      Random cyclic groups of identical order with a matched step-count distribution and no
      curve anywhere - the curve-free arm.
    - >-
      A structure-destroying label permutation and random residue windows on the same
      curves.
    - >-
      A planted-bias arm with at least three known bias magnitudes.
    parameters:
      filtration_state: 'affine coefficient pair, bounded residue window, support-compatible potential, step-history tag'
      transition_rule: 'pre-registered, public, non-backtracking, maximising expected potential decrease'
      matched_resources: 'identical memory, identical processor count, identical step budget across arms'
      instances_per_cell: 500
    implementation: >-
      A single walk implementation used for every arm, with only the group and the label
      map swapped, so that an arm difference cannot be an implementation difference. Every
      claimed collision emits a certificate carrying endpoint equality and the full
      coefficient transcript, re-verified by an independent checker.
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 32
      maximum_memory_gb: 8
      maximum_runs: 8
  falsification_conditions:
  - >-
    The filtration is invertible or operation-incompatible - it is a coordinate rename or
    cannot be replayed, and the line halts at zero compute.
  - >-
    The potential signal MATCHES the random cyclic-group or label-permuted null - the effect
    is not elliptic and no statement about elliptic curves or the ECDLP is admissible in
    either direction.
  - >-
    Increasing the structure-destroying parameter leaves an unexplained constant excess -
    artifact.
  - >-
    The optional-stopping or mixing assumptions fail on the declared walk family.
  - >-
    A collision or scalar certificate produces any false positive, or requires hidden state.
  - >-
    The full charged path is NOT strictly below the fixed-predicate baseline after adaptive
    selection, memory, verification and traffic are charged - the mechanism is rejected at
    tested scope.
  - >-
    The planted-bias control fails at its largest magnitude - the potential lacks dynamic
    range and no null is interpretable.
  interpretation_limits:
  - >-
    A MEASURED COLLISION-TIME CHANGE IS NOT AN EXPONENT CLAIM without scaling data and a
    proof boundary, and none is claimed here.
  - >-
    A generic-group null match is evidence against THIS filtration within the tested
    transcript model only, and closes nothing wider.
  - >-
    NO DEPLOYED TARGET, LIVE KEY OR SECRET SCALAR is used or inferred. Every instance is
    generated locally with a known scalar.
  - >-
    Negative evidence narrows only the declared walk, filtration, group and parameter range.
  - >-
    Adaptive step selection can itself bias the walk or invalidate the mixing argument, and
    early stopping can reduce measured time while increasing restart and verification cost.
    Both are charged and neither is assumed away.
  - >-
    Toy groups make entropy estimates and collision tails non-asymptotic, so a fitted
    scaling exponent over the tested range carries its confidence interval and is not
    extrapolated.
  - >-
    UNTESTABLE AT REACHABLE SCALE, STATED RATHER THAN SHRUNK. Whether any filtration-based
    gain persists at cryptographic group sizes is NOT testable by this or any reachable
    experiment - a single fixed-predicate baseline run at those sizes is precisely what the
    security level asserts is infeasible. The record therefore measures a ratio at group
    orders at most about 2 to the 32 and can never establish the asymptotic claim its
    mechanism would need. That gap is the record's central limitation and is stated before
    the run.
