hypothesis:
  id: H-MLKEM-36f511
  question_id: RQ-QALG-457b41
  goal_id: GOAL-QALG-001
  source_idea: IDEA-20260813-02479f

  statement: >-
    CLAIM TIER: derivation. This is a closed-form arithmetic/symbolic result
    over ML-KEM's own exact standardized parameters (k in {2,3,4}, q = 3329,
    eta1/eta2 per FIPS 203) and Simon 2026's own explicitly stated constants
    (Q = k*n^(c+1), c >= 12, faulty-sample tolerance 1/O(log n)) -- not an
    empirical measurement, not a lattice-reduction run, and not a
    toy/medium/crypto-tier claim in the sense of docs/claims-and-verification.md
    (that taxonomy describes TESTED SCALE of a run; this hypothesis produces no
    run at all, only an exact evaluation). NO ML-KEM BREAK IS CLAIMED, NOTHING
    HERE TOUCHES KEY RECOVERY, and this hypothesis depends throughout on an
    external, UNVERIFIED preprint claim (Simon 2026, KN-LIT-e204ab, self-labelled
    "[Preliminary Draft]" with every substantive lemma marked "(Sketch)" --
    treated as unverified in every use below, never as an established theorem).

    STATEMENT. Standard, publicly-computable linear self-reduction from
    ML-KEM's actual k in {2,3,4} real Module-LWE public-key rows -- generating
    a "virtual" sample as a bounded-coefficient combination of up to k real
    rows plus fresh public randomness -- CANNOT supply anywhere near Simon
    2026's own required Q = k*n^(c+1) (c >= 12) sample count within the
    noise/faulty-sample-rate budget that algorithm's own stated theorem
    requires, at ML-KEM's actual (non-asymptotic) parameters. This predicts
    the DCP-route family (KN-TECH-d1bc4f) is UNREALIZABLE against a single,
    standard ML-KEM public key via this specific, standard sample-generation
    mechanism, independent of whether Simon's Lemma 3 (audited separately by
    IDEA-20260813-4aecda) is itself eventually verified or refuted -- a
    closure that would hold even in a world where the rest of the DCP paper
    turns out to be entirely correct. The opposite verdict (self-reduction
    noise growth stays inside budget) is an equally legitimate, fully
    specified outcome and is not dispreferred by this record; see
    falsification_conditions.

    This hypothesis is a pure ACCESS-MODEL / INTERFACE audit (KN-TECH-080
    vocabulary): it checks whether the abstract algorithm's assumed input
    interface (an idealized independent-faulty-sample oracle) is actually
    instantiable from the concrete object under attack (one bounded ML-KEM
    public key) -- independent of whether the algorithm, once given that
    interface, would actually work. It does not test Lemma 3's correctness
    (IDEA-20260813-4aecda / a future hypothesis, not this one) and it does not
    test the base reduction's own noise rate (IDEA-20260813-0cf345 / a future
    hypothesis, not this one).

  mechanism: >-
    Self-reduction: a "virtual" MLWE-shaped sample is built as
    v = sum_{i in S} c_i * (a_i, b_i), for S a subset of size m <= k of the
    real rows and c_i small bounded public coefficients (e.g. in {-1,0,1} or
    CBD-bounded), optionally blinded by fresh public randomness. By variance
    additivity for independent CBD(eta)-distributed error coordinates
    (HEUR-MLKEM-36f511-1 below), Var(sum c_i e_i) = sum c_i^2 * Var(e_i),
    which grows with the number and magnitude of combined terms. Because only
    k in {2,3,4} REAL rows exist, the number of DISTINCT low-variance
    combinations achievable this way is combinatorially bounded (at most
    roughly (2B+1)^k for coefficient magnitude bound B and m <= k terms) --
    this bound, not an assumed rate, is what must be compared against
    Q = k*n^(c+1) at ML-KEM's actual n.

    A SEPARATE, LOAD-BEARING GAP THIS DESIGN TASK IDENTIFIES (not named, in
    this precise form, by IDEA-20260813-02479f's own text): Simon's algorithm
    tolerates a "faulty sample RATE" of 1/O(log n) -- a discrete, all-or-
    nothing corruption probability in his own DCP formalization ("with
    probability 1/a(n) the sample is a random bit and random value instead of
    the correct superposition"), not a continuous LWE noise VARIANCE.
    KN-TECH-d1bc4f states the connection for REGEV'S OWN reduction
    construction: "Regev's reduction converts a(n)-approximate lattice
    problems into DCP instances with faulty-sample rate 1/a(n)" -- i.e. for a
    FIXED target approximation factor a(n), Regev's reduction's own internal
    sampler produces DCP instances at faulty rate exactly 1/a(n). This
    hypothesis's own hoped-for chain (self-reduction noise variance -> an
    effective a(n) -> a required DCP faulty rate 1/a(n) -> comparison against
    Simon's 1/O(log n) tolerance) requires INSTANTIATING Regev's reduction
    using ML-KEM's own k real MLWE rows as a stand-in for the a(n)-SVP oracle
    the reduction assumes, and self-reduction is the standard classical device
    for doing so from a bounded set of real samples -- but the EXACT formula
    converting a given noise-variance inflation into the corresponding a(n)
    (equivalently, into a corresponding faulty rate) is not stated in
    KN-LIT-21383c's summary, KN-LIT-e204ab, or KN-TECH-d1bc4f, and Regev 2004's
    and BKSW's full derivations are not staged in this repository's inputs/
    (only inputs/DCP-SIMON-2026/paper_extracted_text.txt is available, and it
    states the reduction's EXISTENCE and its DCP group-order parameterization,
    not the internal noise-to-a(n) conversion formula). This gap is made the
    explicit, gating first stage of EXP-MLKEM-12d9b8 rather than silently
    assumed away in either direction; see that contract's stage-0 and its
    three-way (not binary) decidable outcome.

  assumptions:
    - >-
      "One public key" is the realistic passive-attacker model this RQ's own
      constraints require (matched cost accounting against the best known
      QUANTUM attack against a single target key, per RQ-QALG-457b41); a
      multi-key-compromise model is out of scope.
    - >-
      PARTIALLY RESOLVED BY THIS DESIGN TASK, DIRECTLY FROM SIMON'S OWN SOURCE
      TEXT (inputs/DCP-SIMON-2026/paper_extracted_text.txt, pages 1-3, not
      merely from KN-LIT-21383c's own flagged-as-unverified summary): Simon's
      "n" is LITERALLY the dimension of the SVP/LWE lattice the reduction
      operates over -- "p(n)-SVP is the problem of finding a non-zero vector
      in an n-dimensional lattice" -- and the DCP group order is 2N ~ 2^(n+1)
      directly (post-BKSW; Regev's original reduction had a quadratic blow-up,
      N ~ 2^(n^2), which BKSW's improvement removes). This resolves the
      LITERAL DEFINITION of n, superseding KN-LIT-21383c's own "should be
      checked against the original before use" flag for this specific
      question. NOT resolved, and explicitly out of scope for this design
      task and for this specific hypothesis: whether n := k*256 (ML-KEM's
      module rank times ring degree, "unrolling" the structured Module-LWE
      instance into an n-coordinate object) is a legitimate way to count "the
      lattice dimension" for BKSW's reduction, which is stated for
      unstructured LWE, not Module-LWE -- KN-OPEN-8a5965's own Q2 names this
      bridge ("Unstructured LWE vs Module-LWE... whether the claimed DCP
      algorithm applies through that structure is unaddressed") as fully
      open. n := k*256 is adopted here as an EXPLICIT, DISCLOSED, UNVERIFIED
      WORKING DEFINITION for this arithmetic exercise only, exactly matching
      IDEA-20260813-02479f's own second assumption -- never as an established
      fact, and every numeric output in EXP-MLKEM-12d9b8 must carry this
      caveat with it.
    - >-
      Standard (not adversarially weakened) linear self-reduction is the
      sample-generation mechanism under test; a not-yet-published cleverer
      technique (e.g. IDEA-20260813-8aa6ea's Galois-orbit mechanism) is
      explicitly out of scope and named as an open direction, not ruled out.

  proof_search_map:
    not_applicable_reason: null
    bottleneck: >-
      Whether the noise/faulty-rate cost of generating Simon's required
      Q = k*n^(c+1), c >= 12 virtual samples via standard linear self-
      reduction from ML-KEM's actual k in {2,3,4} real rows stays within, or
      catastrophically exceeds, the 1/O(log n) tolerance the algorithm needs
      -- independent of whether Lemma 3 (IDEA-20260813-4aecda) or the base
      reduction's noise rate (IDEA-20260813-0cf345) are separately favorable.
    baseline_embedding:
      parameter_slice: >-
        m = 1 (each virtual sample IS one of the k real rows, no combination)
        reproduces the original, unmodified oracle-model assumption exactly:
        each of only k in {2,3,4} samples, independently faulty at whatever
        base rate the un-self-reduced reduction gives, nowhere near Q. This
        is the fixed reference point every self-reduction variant (m > 1) is
        compared against.
      reproduction_check: >-
        Symbolic check (EXP-MLKEM-12d9b8 stage 1) that the noise-variance
        formula at m = 1 reduces EXACTLY to ML-KEM's own base CBD(eta)
        variance with no inflation term, and that m = 2 (two independent
        unit-coefficient CBD(eta) terms) gives exactly 2*(eta/2) = eta,
        matching the CBD distribution's own convolution property -- both
        verifiable by hand before the general-m formula is trusted at the
        astronomically larger m implied by reaching Q.
    observation_collision:
      observable: >-
        The pair (number of distinct virtual samples generated, resulting
        noise variance and/or effective a(n)/faulty-rate per virtual sample).
      distinct_preimage_search: >-
        Search for a combining strategy (choice of m <= k and coefficient
        bound B) achieving a large distinct sample count while keeping
        variance growth sub-linear in the count, by exploiting CBD(eta)'s or
        the module ring's structure (overlaps in spirit with, but is computed
        independently of, IDEA-20260813-8aa6ea's Galois-orbit mechanism). If
        no such strategy exists under plain variance-additivity, the
        (count, variance) pair is dominated by a simple, no-slack trade-off
        and the closure below follows from arithmetic alone -- EXP-MLKEM-12d9b8
        stage 3 computes the combinatorial ceiling explicitly rather than
        asserting it.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A target-specific measure: noise variance (and, pending stage 0's
          conversion chain, effective faulty rate) of a virtual sample built
          from m <= k real rows with bounded public coefficients, evaluated
          up to the m/B needed to approach Q = k*n^(c+1) distinct virtual
          samples, accounting for the true combinatorial ceiling on distinct
          combinations available from only k in {2,3,4} real rows.
        predicted_gain: >-
          Not a speed gain -- a closure-scale measurement. The predicted
          (not yet confirmed) severity, given k is only 2-4 and Q needs to
          reach roughly n^13 with n in the hundreds (Q on the order of 10^36
          or larger under the k := 256*rank working definition), is that no
          combinatorially available self-reduction strategy can supply
          anywhere near Q distinct, low-variance virtual samples -- shown by
          the actual arithmetic, not asserted.
    quantifier_order: >-
      Simon's theorem states: for all n, THERE EXISTS a sample-generation
      procedure supplying Q = k*n^(c+1) independent-enough faulty samples such
      that the algorithm succeeds. This hypothesis checks whether that
      existential clause is satisfiable AT ALL from a single bounded ML-KEM
      key's k real rows via standard linear self-reduction -- if no such
      procedure exists at ML-KEM's actual, non-asymptotic n (under the
      disclosed n := k*256 working definition), the existential clause fails
      for THIS specific concrete instantiation, regardless of the asymptotic
      theorem's truth for an idealized oracle.
    method_ceiling:
      strongest_certifiable_claim: >-
        At best, whether STANDARD linear self-reduction from k in {2,3,4}
        real rows can or cannot realistically approach Q = k*n^(c+1) virtual
        samples within Simon's own noise/faulty-rate budget at ML-KEM's
        actual n -- never that NO conceivable sample-generation technique
        could ever do so (a cleverer, not-yet-published technique is
        explicitly out of scope and named as an open direction).
      nearby_object_control: >-
        The DEGENERATE case Q <= k (no self-reduction needed, using only the
        k real rows directly) is trivially realizable; this hypothesis's
        finding is informative only to the extent it establishes how far past
        that trivial floor the actual required Q sits, and by what
        multiplicative noise/faulty-rate cost factor.
    proof_obligations:
      - claim: >-
          The noise-variance formula reduces to ML-KEM's base CBD(eta)
          variance at m = 1 with no inflation, and to 2*(eta/2) = eta at
          m = 2 with unit coefficients.
        responsibility: baseline
      - claim: >-
          PARTIALLY DISCHARGED BY THIS DESIGN TASK: the literal definition of
          Simon's "n" (the SVP/LWE lattice dimension the reduction operates
          over) is pinned from the primary source
          (inputs/DCP-SIMON-2026/paper_extracted_text.txt), not guessed. NOT
          discharged: whether n := k*256 legitimately counts "the lattice
          dimension" for ML-KEM's actual Module-LWE structure under BKSW's
          (unstructured-LWE) reduction -- carried forward as an explicit,
          disclosed working assumption, never resolved as fact by this record.
        responsibility: correctness
      - claim: >-
          NOT YET PERFORMED (named here, gating EXP-MLKEM-12d9b8 stage 0): the
          exact conversion chain from self-reduction-induced noise variance to
          an effective approximation factor a(n) to a required DCP faulty
          rate 1/a(n), comparable against Simon's stated 1/O(log n) tolerance.
          KN-TECH-d1bc4f states this relationship only for Regev's OWN
          reduction construction at a fixed target a(n), not as a general
          noise-variance-to-faulty-rate formula; Regev 2004's and BKSW's full
          derivations are not staged in this repository. This is a genuine,
          previously unflagged gap in IDEA-20260813-02479f's own mechanism
          text, not an omission of this filing.
        responsibility: correctness
      - claim: >-
          The combinatorial ceiling on distinct low-variance combinations
          available from k in {2,3,4} rows is computed explicitly, not
          asserted.
        responsibility: size
      - claim: >-
          The final verdict (realizable / unrealizable / not computable from
          available sources, at each standardized ML-KEM level) is reported
          with its exact numeric margin where computable, never only a
          qualitative label.
        responsibility: scope

  rerandomization: null

  asymptotic_claim: null
  # No exponent-improvement claim of any kind: this hypothesis measures an
