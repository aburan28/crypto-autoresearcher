  heuristic_assumptions:
    - id: HEUR-MLKEM-36f511-1
      formal_statement: >-
        The noise variance of a linear self-reduction virtual sample, built as
        a bounded-coefficient combination of m <= k real MLWE samples plus
        fresh public randomness, grows as the sum of the individual combined-
        term variances: Var(sum_i c_i * e_i) = sum_i c_i^2 * Var(e_i), for
        independent e_i ~ CBD(eta) (Var = eta/2 exactly).
      random_model_justification: >-
        A direct, elementary, EXACT consequence of variance additivity for
        independent random variables (a finite instance of the property, not
        an asymptotic approximation), applied to ML-KEM's own CBD(eta)-
        distributed error coordinates, whose variance eta/2 is exactly known.
        This is a proven identity, not a random-model conjecture; the only
        open content is whether it is the CORRECT model for what "noise" means
        in Simon's DCP faulty-rate sense, which is the separate, not-yet-
        performed conversion-chain gap named in proof_search_map above.
      supporting_results: []
      validation_experiment_ids: [EXP-MLKEM-12d9b8]
      falsification_condition: >-
        The formula does not reduce exactly to eta/2 at m = 1 or to eta at
        m = 2 with unit coefficients -- falsifies the baseline embedding and
        blocks any further conclusion until corrected (EXP-MLKEM-12d9b8
        stage 1, can_terminate_run: true).

  structural_ingredients:
    - description: >-
        Variance additivity for sums of independent random variables, applied
        to ML-KEM's CBD(eta) error coordinates (Var(CBD(eta)) = eta/2 exactly).
      citation: >-
        Elementary probability identity; not a fabricated external citation.
        Used exactly as stated in IDEA-20260813-02479f's own mechanism.
      role: >-
        Supplies the exact, non-heuristic half of HEUR-MLKEM-36f511-1; the
        open content is confined to the conversion-chain gap named above.
    - description: >-
        Regev's a(n)-SVP-to-DCP reduction and its faulty-sample-rate
        parameterization (1/a(n)), as stated in KN-TECH-d1bc4f, with the
        quadratic dimension blow-up removed by BKSW (KN-LIT-4706), per
        inputs/DCP-SIMON-2026/paper_extracted_text.txt's own recap.
      citation: KN-LIT-21383c (Regev 2004); KN-TECH-d1bc4f; inputs/DCP-SIMON-2026/paper_extracted_text.txt.
      role: >-
        Names the OBJECT (a(n), faulty rate 1/a(n)) EXP-MLKEM-12d9b8's stage 0
        must connect self-reduction noise variance to; the exact conversion
        formula itself is NOT supplied by this citation and is the named gap.

  reduction_chain:
    core_problem: >-
      Can standard linear self-reduction from ML-KEM's k in {2,3,4} real
      Module-LWE public-key rows materialize anywhere near Simon 2026's
      required Q = k*n^(c+1) virtual samples within that algorithm's own
      stated noise/faulty-rate budget, at ML-KEM's actual, non-asymptotic
      parameters?
    corollaries: []
    # No downstream problem is claimed reached by a published reduction; this
    # hypothesis terminates at the access-model verdict itself, disclosed
    # explicitly rather than left implicit.

  predictions:
    - metric: n_to_lattice_dimension_correspondence
      direction: different
      minimum_effect: >-
        A pinned, source-cited definition of Simon's "n" (DONE by this design
        task: the SVP/LWE lattice dimension, DCP group order 2N ~ 2^(n+1)
        post-BKSW) plus an explicitly disclosed, unverified working
        substitution n := k*256 for ML-KEM's actual module dimension.
    - metric: required_virtual_sample_count_q
      direction: different
      minimum_effect: >-
        The exact numeric value of Q = k*n^(c+1) at ML-KEM-512/768/1024's
        pinned n (under the disclosed working definition), at Simon's own
        stated minimal c = 12, with a sensitivity sweep over c > 12.
    - metric: self_reduction_noise_variance_at_required_q
      direction: higher
      minimum_effect: >-
        The noise variance per virtual sample when approaching the required Q
        from k in {2,3,4} real rows via standard linear self-reduction;
        "higher" because variance-additivity guarantees growth with the
        number/magnitude of combined terms -- the open question is the exact
        numeric severity and, pending stage 0, its translation into an
        effective faulty rate, not the direction.
    - metric: realizability_verdict
      direction: different
      minimum_effect: >-
        A three-way verdict (realizable within budget / unrealizable /
        not computable from currently available sources) at each of
        ML-KEM-512/768/1024, with an exact numeric margin wherever computable,
        and a sensitivity range over c.

  test_boundary:
    instances:
      - >-
        ML-KEM-512 (k = 2), ML-KEM-768 (k = 3), ML-KEM-1024 (k = 4); FIPS 203
        standardized q = 3329, eta1/eta2 per level (512: eta1=3, eta2=2;
        768/1024: eta1=2, eta2=2); n := k*256 as the explicit, disclosed,
        unverified working definition of Simon's lattice dimension for this
        arithmetic exercise (see assumptions above).
      - >-
        Simon 2026's own stated constants: Q = k*n^(c+1), c >= 12 (minimal
        stated value, with a sensitivity sweep c in {12, 13, 15, 20}), k > c
        (paper's own condition on its internal parameter, distinct from
        ML-KEM's module rank -- both use the symbol k; EXP-MLKEM-12d9b8 must
        keep these visibly distinct throughout), faulty-rate tolerance
        1/O(log n).
      - >-
        NOT IN SCOPE: Simon's Lemma 3 correctness (IDEA-20260813-4aecda); the
        base reduction's own noise rate absent self-reduction
        (IDEA-20260813-0cf345); any HQC or CSIDH instance
        (GOAL-QALG-001 non_duplication); any real ML-KEM implementation,
        lattice software, or quantum simulation.
    parameters:
      k: [2, 3, 4]
      q: 3329
      eta1: {k2: 3, k3: 2, k4: 2}
      eta2: 2
      n_working_definition: "k*256"
      c: [12, 13, 15, 20]
    implementation: >-
      Closed-form symbolic/numeric arithmetic evaluation only; no ML-KEM
      implementation, no lattice software, no quantum simulation. Full staging
      in experiments/EXP-MLKEM-12d9b8/specification.yaml.
    budget: {}
    # Populated in experiments/EXP-MLKEM-12d9b8/specification.yaml, not duplicated here.

  falsification_conditions:
    - >-
      F1: the noise-variance formula does not reduce to the base CBD(eta)
      variance at m = 1, or to eta at m = 2 with unit coefficients -- falsifies
      this hypothesis's own baseline embedding and blocks any further
      conclusion until corrected.
    - >-
      F2: the realizability verdict is "realizable within budget" (noise/
      faulty-rate cost stays inside 1/O(log n) even at the required Q) at any
      standardized level, robustly across the sensitivity range over c -- this
      REFUTES this hypothesis's own predicted severity and means the sample-
      access-model obstruction is NOT what closes this route at that level,
      redirecting remaining scrutiny fully onto IDEA-20260813-4aecda (Lemma 3)
      and IDEA-20260813-0cf345 (base reduction noise rate).
    - >-
      F3 (does NOT falsify -- confirms the predicted severity): the
      realizability verdict is "unrealizable" (cost exceeds budget by an
      overwhelming margin) at all three standardized levels, robustly -- a
      positive finding for this hypothesis, recorded as a named, scoped
      closure of the concrete-attack-reach question (Q2) for standard self-
      reduction specifically, independent of Q1's (Lemma 3's) resolution.
    - >-
      F4: stage 0's noise-variance-to-faulty-rate conversion chain cannot be
      derived or sourced within EXP-MLKEM-12d9b8's stage-0 budget -- this is
      NOT a falsification of the hypothesis and NOT a realizability verdict of
      either kind; it is reported as "NOT COMPUTED: conversion chain
      unavailable from available sources," an honest infrastructure/
      derivation-availability outcome (AGENTS.md rule 5), and the run stops
      there without defaulting to either verdict.

  interpretation_limits:
    - >-
      This hypothesis audits only STANDARD linear self-reduction as the
      sample-generation mechanism; a not-yet-published cleverer technique
      (possibly exploiting Galois-orbit structure per IDEA-20260813-8aa6ea, or
      some other public symmetry) is explicitly out of scope and named as an
      open direction, not ruled out.
    - >-
      A closure finding here applies specifically to the standard-self-
      reduction access model at ML-KEM's three standardized levels under the
      disclosed n := k*256 working definition; it does not close the
      possibility that some future, differently-shaped noise-tolerant DCP
      algorithm with a much smaller required Q could still be realizable.
    - >-
      Results here do not transfer to RQ-QALG-122b59 (HQC) or RQ-QALG-74bf20
      (CSIDH) per GOAL-QALG-001's own non_duplication note; those schemes have
      different public-key structures and different sample-access models
      entirely.
    - >-
      Realizability of the sample-access model is a NECESSARY, not sufficient,
      condition for any concrete attack; it is silent on Lemma 3's correctness
      (KN-LIT-e204ab, UNVERIFIED throughout) and on the base reduction's own
      noise rate.
    - >-
      Every numeric output in this line depends on Simon 2026's own claim
      being taken at face value for the purpose of the arithmetic (its
      stated Q formula, its stated tolerance, its stated k>c condition); this
      hypothesis makes NO assertion that Simon's underlying algorithm is
      correct, and a favorable (realizable) verdict here would say nothing
      about whether the rest of the paper survives scrutiny (KN-OPEN-8a5965).

