hypothesis:
  id: H-EQJ-7e870f
  question_id: RQ-EQJ-001
  added: '2026-08-25'
  derived_from_idea: IDEA-20260807-394cf4
  status: proposed
  proposed_by: coordinator

  statement: >-
    SCOPE. The S_3-equivariant relation module of the ECDLP relation system at
    p equal to 1009 and p equal to 4099, at two k/p ratios larger than those
    EXP-EQJ-001 used and at m equal to 5 in addition to the committed m, with
    three distinct curves of each order. Claim tier toy. NO ATTACK, NO EXPONENT,
    NO SOLVING-COST CLAIM, AND NO REVIVAL OF THE ISOTYPIC LINEAR-ALGEBRA COST
    MECHANISM, which EV-EQJ-001 killed and which this hypothesis does not dispute.
    TWO CLAIMS, INDEPENDENTLY DECIDABLE.
    C1, COMPRESSIBILITY. The ratio of distinct coefficient rows to total
    relations continues to FALL as k/p grows beyond the tested range, so the
    collapse to 11 to 15 distinct rows recorded at p equal to 4099 is a property
    of the relation module rather than an artifact of the sampled k/p range. This
    is simultaneously the RETEST of the isotypic kill, because EV-EQJ-001's own
    unresolved_confound says the distinct-row collapse is what forced r_full below
    k and could mask block-rank arrival that only appears at much larger k/p.
    C2, CURVE-DEPENDENCE. The per-block mass vector w_lambda, which EV-EQJ-001
    measured 7.5 to 152 standard deviations outside the 8-draw random-subset null
    envelope for all 10 blocks at all 9 cells, VARIES across distinct curves of
    the same order by more than the within-curve null spread - i.e. it carries
    curve-distinguishing bits rather than being forced by S_3-invariance alone.
    THE MODAL OUTCOME IS THAT C2 IS FALSE. The parent proposal's honest prior is
    0.35 for C2, and a w_lambda identical across same-order curves is a clean
    FORCED-VALUE closure of the 152-sigma signal - a legitimate and useful result,
    not a failure.

  mechanism: >-
    EV-EQJ-001 rejected the isotypic linear-algebra cost mechanism cleanly -
    exactly 4 of 10 isotypes carry mass, every surviving block has r_lambda equal
    to r_full so rank never splits, and the sum of r_lambda cubed equals 4 times
    r_full cubed, a 4x LOSS. But its NEGATIVE CONTROL DID NOT FIRE - the EC
    per-block profile lies outside the 8-draw random-subset null envelope for all
    10 blocks at all 9 cells with |z| from 7.5 to 152 - and DEC-20260718-006
    states the consequence explicitly - the kill is no asymptotic gain, not
    not-EC-specific. That decision's next_actions logged the distinct-row collapse
    for the idea pool as relation-module compressibility, detached from the
    isotypic mechanism, and the idea pool never received it. Forward guidance
    naming no record is guidance nobody can follow.
    Two cheap measurements on artifacts EXP-EQJ-001 already produced settle both
    orphans. (i) Extend the distinct-row census to larger k/p and to m equal to 5.
    Adding a relation either adds a new distinct row or does not, so the ratio is
    a deterministic function of the relation set; a ratio that keeps falling means
    the module is compressible in a way that bears on the LINEAR-ALGEBRA stage's
    memory, which is a different cost driver from the solving degree. (ii) Treat
    w_lambda as a CURVE INVARIANT and measure its spread across three distinct
    curves of the same order. Four of the ten entries are exactly zero for
    representation-theoretic reasons, so the free part is only a 4-vector and the
    object is weak - which is precisely why the forced-zero gate is blocking and
    why a constant w_lambda is the expected reading.

  assumptions:
  - >-
    EXP-EQJ-001's artifacts and harness support larger k/p ratios and m equal to 5
    without redesign. If they do not, that is an instrumentation cost recorded as
    such and not a result.
  - >-
    Multiple distinct curves of the same order are constructible at p equal to
    1009 and p equal to 4099. Curves of the same order may be ISOGENOUS, which is
    not independence; the isogeny class of each curve must be reported.
  - >-
    The 6 representation-theoretically zero isotypes are zero for reasons of
    S_3-invariance and not of the sample, so a nonzero value anywhere is a
    projection bug rather than a finding.

  proof_search_map:
    not_applicable_reason: >-
      Purely empirical measurement on committed artifacts. No theorem, asymptotic
      bound, reduction or closure argument is proposed, and no cost claim is made
      - the compressibility observation bears on linear-algebra memory and is
      measured rather than costed. If a measured non-generic w_lambda were later
      proposed as a curve distinguisher or as a basis for a cost mechanism, THAT
      proposal is proof-oriented and requires its own map before approval.
    bottleneck: null
    baseline_embedding:
      parameter_slice: null
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms: []
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations: []

  asymptotic_claim: null

  heuristic_assumptions:
  - id: HEUR-EQJ2-1
    formal_statement: >-
      The distinct-row collapse measured at p at most 4099 is indicative of the
      behaviour at larger p, in the sense that the direction of the trend in
      distinct rows divided by relations as k/p grows does not reverse with p.
    random_model_justification: >-
      None offered. This is an extrapolation of convenience and is written down
      rather than left implicit.
    supporting_results: []
    validation_experiment_ids:
    - EXP-EQJ-48c911
    falsification_condition: >-
      The ratio falls with k/p at p equal to 1009 and rises with k/p at p equal to
      4099, or vice versa. The trend then depends on p within the tested range and
      no pooled statement is admissible. The contract requires per-p reporting and
      forbids pooling precisely so this is visible.

  structural_ingredients:
  - description: >-
      Isotypic and equivariant decomposition of an S_3-symmetric relation system
      into representation blocks, with per-block mass and per-block rank.
    citation: KN-TECH-012
    provenance: internal
    verified_by: >-
      In-repo technique entry, read directly. Cited by no ledger or experiment
      record before this one.
    role: decomposition machinery and the definition of w_lambda
  - description: >-
      The committed measurements this hypothesis extends - 4 of 10 isotypes
      carrying mass, r_lambda equal to r_full on every surviving block, the
      distinct-row counts 64 to 67, 12 and 11 to 15 at p equal to 211, 1009 and
      4099, and the |z| range 7.5 to 152 against an 8-draw random-subset null.
    citation: EV-EQJ-001
    provenance: internal
    verified_by: In-repo committed evidence record, read directly.
    role: the baseline every new cell is regressed against

  reduction_chain:
    core_problem: null
    corollaries: []

  predictions:
  - metric: 'number of distinct coefficient rows divided by number of relations, as k/p grows'
    direction: lower
    minimum_effect: >-
      Continued decline at two larger k/p ratios at each prime, i.e. the collapse
      is not an artifact of the tested range.
  - metric: variation of w_lambda across distinct curves of the same order
    direction: different
    minimum_effect: >-
      Between-curve spread exceeding the within-curve null spread at any block,
      measured against a null envelope widened well beyond 8 draws.
  - metric: r_full against k at the larger k/p ratios
    direction: different
    minimum_effect: >-
      Any cell where r_full reaches k, which would be the block-rank arrival
      EV-EQJ-001's unresolved_confound says the distinct-row collapse could be
      masking, and which would require re-scoping the isotypic kill.

  test_boundary:
    instances:
    - >-
      Three distinct elliptic curves of each of two orders, at p equal to 1009 and
      p equal to 4099, with the isogeny class of each curve reported.
    parameters:
      primes: '1009 and 4099'
      k_over_p: 'the committed ratio plus two larger ratios, fixed at Stage 0'
      m_values: 'the committed m plus m equal to 5'
      curves_per_order: 3
      null_draws: 'widened from the committed 8-draw random-subset null; the widened count is fixed at Stage 0 before any between-curve spread is read'
    implementation: >-
      The isotypic decomposition harness of experiments/EXP-EQJ-001, extended to
      larger k/p and m equal to 5 and to multiple curves per order.
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 4.0
      maximum_memory_gb: 16

  distinguishable_outcomes:
  - outcome: >-
      The distinct-row ratio keeps falling at both larger k/p ratios at both
      primes, with the committed p equal to 4099 counts reproduced and the
      forced-zero isotype gate passing.
    means: >-
      Relation-module compressibility is a real property of the module over the
      tested range and not a small-sample artifact. It bears on the
      LINEAR-ALGEBRA stage's memory, which is a different cost driver from the
      solving degree, and it is NOT an exponent claim. C1 is supported at toy
      scale.
  - outcome: >-
      The distinct-row ratio stops falling, or rises, at the larger k/p ratios.
    means: >-
      The collapse is an artifact of the tested range. C1 is false, the isotypic
      kill stands unqualified rather than being softened by the
      could-mask-block-rank-arrival confound, and the compressibility observation
      that DEC-20260718-006 detached for the idea pool can be closed.
  - outcome: >-
      w_lambda differs across distinct same-order curves by more than the widened
      within-curve null spread at at least one block, with the isogeny classes
      reported and the forced-zero gate passing.
    means: >-
      The per-block mass vector carries curve-distinguishing bits - a measured
      non-generic property of the relation module at toy scale. It is not an
      attack and not a cost statement, and it must be red-teamed before any use.
      C2 is supported at toy scale.
  - outcome: >-
      w_lambda is identical across distinct same-order curves to within the
      widened null spread.
    means: >-
      w_lambda is FORCED by S_3-invariance, carries no curve-distinguishing bits,
      and the |z| equal to 152 departure from the random-subset null closes as a
      forced value rather than as an unexplained signal. C2 is false. This is the
      modal outcome, it is a legitimate closure of the lane on a measurement, and
      it is a first-class deliverable.
  - outcome: >-
      Any of the 6 representation-theoretically zero isotypes is nonzero in any
      new cell, or the p equal to 4099 regression does not reproduce 11 to 15
      distinct rows.
    means: >-
      The projection is misimplemented or the harness is not measuring the
      committed object. No reading of any arm is admissible; this is instrument
      failure, not evidence.

  falsification_conditions:
  - >-
    The distinct-row ratio stops falling at the larger k/p ratios at both primes.
  - >-
    w_lambda is identical across distinct curves of the same order to within the
    widened null spread at every block.
  - >-
    Any of the 6 representation-theoretically zero isotypes is nonzero anywhere,
    which voids the projection and every reading built on it.
  - >-
    The p equal to 4099 regression does not reproduce the committed 11 to 15
    distinct-row counts and the committed |z| range.

  prior_evidence_refs:
  - EV-EQJ-001
  - EXP-EQJ-001
  - H-EQJ-001
  - DEC-20260718-006
  - KN-FIND-020
  - KN-TECH-012

  interpretation_limits:
  - >-
    Toy scale, p at most 4099. No cryptographic-scale claim.
  - >-
    Relation-module compressibility bears on the LINEAR-ALGEBRA stage, a different
    cost driver from the solving degree. It is not an exponent claim and no cost
    number is produced by this design.
  - >-
    EV-EQJ-001's kill of the isotypic linear-algebra COST mechanism is not
    disputed and is not revived. The objects here are the distinct-row count and
    the block-mass vector, which DEC-20260718-006 explicitly detached from that
    mechanism.
  - >-
    Curves of the same order may be isogenous, which is not independence. Any
    between-curve spread must be read with the isogeny classes attached, and a
    spread measured only across isogenous curves is weaker evidence for C2 than
    one across distinct classes.
  - >-
    The free part of w_lambda is a 4-vector because 6 of the 10 entries are
    exactly zero by representation theory. It is a weak object and a null result
    on C2 is correspondingly cheap to obtain and correspondingly informative.
