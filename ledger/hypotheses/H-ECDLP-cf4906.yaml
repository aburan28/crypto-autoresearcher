  statement: >-
    A window of width 9 stores 256 entries. A window of width 8
    stores 128. Two to the power 8 is 256. Two to the power 7 is 128.
    Two hundred fifty-six exceeds one hundred twenty-eight by 128.
    The product of the two table sizes is 32768. Their sum is 384.
    Two width-8 tables each store 128, so that gap is 0 and their
    product is 16384.
  mechanism: >-
    The proposal writes the widths 9 and 8 and the sizes 256 and 128.
    This contract checks those integers. It does not add a curve
    point.
