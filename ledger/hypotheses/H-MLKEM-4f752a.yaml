hypothesis:
  id: H-MLKEM-4f752a
  question_id: RQ-MLKEM-001
  added: '2026-08-25'
  derived_from_idea: IDEA-20260821-003cb0
  statement: >-
    ML-KEM has a FINITE REDUCTION BUDGET and the published Albrecht-Deo Module-LWE to
    Ring-LWE chain exhausts it at rung one. Precisely, three claims that can each fail
    independently.
    (S1) BUDGET. Define the hardness coordinate of an LWE-type instance as the pair
    C = (d, R) with d the dimension of the lattice a primal attack reduces and
    R = log2(q/sigma) the modulus-to-noise ratio in bits. Since samples with sigma >= q/2
    carry no information about the secret, R = 0 is an ABSOLUTE, unconditional floor, so
    R_0 computed from the FIPS 203 constants is the total error-rate blow-up any chain of
    reductions may ever spend against ML-KEM.
    (S2) RUNG-ONE CLOSURE. Evaluated at the CONCRETE constants of the current (01/2020)
    version of the Albrecht-Deo corollaries - not at the abstract's asymptotic form and not
    at the superseded 2017 wording - the rung-one charge (the MLWE-to-RLWE error-rate
    blow-up, plus the separately tracked spherical-error correction the Stage-2 estimator
    requires because it has no input for a skewed error) EXCEEDS R_0, so the number of
    ALIVE rungs on every ML-KEM parameter set is ZERO at every declared negligibility level.
    (S3) MECHANISM SEPARATION. On the budget-relaxed control, where the budget does not
    bind, rungs ARE alive, and every alive rung's estimated attack cost under matched
    accounting is STRICTLY HIGHER than the un-reduced baseline - i.e. the dimension-for-
    ratio trade loses monotonically even where it is not starved.
    THE DELIVERABLE IS THE EXCHANGE RATE IN BITS, NOT THE VERDICT. No attack, break,
    speedup or exponent movement is claimed, and none would follow from a confirming run.
  mechanism: >-
    A reduction from P to P' means an algorithm for P' solves P, so if the image instance
    were cheaper to attack than ML-KEM that WOULD be an attack on ML-KEM. Nothing forbids it
    a priori - the chain trades R linearly for d exponentially, and lattice cost is
    exponential in a blocksize that grows with d and shrinks with R. A monotone loss is the
    EXPECTED outcome, not a theorem. The propagation law is the theorem statement itself and
    is deterministic and closed-form given the declared free constant, the declared smoothing
    parameter and the declared sample count - one rung per reduction applied, with the
    descent step taken in its SINGLE-SHOT form because composing halvings overcharges the
    descent in the proposal's own favour and is therefore forbidden. The two explanations the
    design separates - lossy-by-construction versus non-monotone - are separated on the
    budget-relaxed control, because under the concrete constants ML-KEM itself is predicted
    to have no alive rung to score at all.
  assumptions:
  - >-
    The reductions' theorem statements are correct as published. This hypothesis audits
    their COST, not their correctness; a correctness failure would invalidate the ledger
    without being detected by it.
  - >-
    log2(q/sigma) is a bookkeeping coordinate, NOT by itself a hardness measure. Hardness
    depends jointly on the pair. The R = 0 floor is nevertheless unconditional. Conclusions
    may rest on the floor or on estimator-relative differences, and on nothing in between.
  - >-
    Both reductions are stated for a Gaussian noise model and ML-KEM's noise is centred
    binomial. Applying them to CBD requires either an explicit transfer step with its own
    cost, or the explicit statement that the ledger is computed for the Gaussian instance of
    matched standard deviation. THIS IS A REAL GAP, DECLARED AND NOT ABSORBED - the run must
    record which of the two it does.
  - >-
    The free constant and the smoothing parameter are NOT free. They are pinned by a
    declared negligibility level through the two inequalities the corollary supplies, and a
    ledger that instantiates the free constant favourably without exhibiting the inequality
    that bounds it is invalid, because taking that constant to zero makes the corollary's own
    probability bound vacuous.
  - >-
    The spherical-error correction is REQUIRED by this pipeline, because a standard lattice
    estimator has no input for a skewed (ellipsoidal) error. Its search-only restriction
    therefore propagates into the ledger and rungs are tagged accordingly; a decision-variant
    ledger may not use it.
  - >-
    The estimator is applied identically to both arms at the same version and cost model, and
    the reported quantity is a DIFFERENCE. No absolute cost from it is quoted.
  - >-
    Every numeric value recited in the parent proposal IDEA-20260821-003cb0 is the PROPOSER'S
    ARITHMETIC on theorem text read from a PDF held only in an ephemeral scratchpad. None of
    it is a measurement and none of it is backed by a committed run. Stage 0's first
    obligation is to re-fetch, re-extract, re-verify every quoted string and recompute every
    number in-harness; any of them may be overturned there.
  proof_search_map:
    bottleneck: >-
      The TOTAL rung-one charge against R at the ML-KEM ring dimension and module rank - the
      MLWE-to-RLWE blow-up plus the spherical-error column. If it exceeds R_0 the chain is
      dead at rung one and nothing downstream revives it; if it falls below R_0 the chain is
      open and the descent depth becomes a free parameter, though the single-shot descent
      then charges further. Lowering the concrete prefactor, or removing the spherical-error
      requirement by supplying an estimator that scores skewed errors natively, are the two
      things that would change the theorem's applicability to FIPS parameters.
    baseline_embedding:
      parameter_slice: >-
        The i = -1 rung - the un-reduced ML-KEM instance itself, at its own hardness
        coordinate. This is the exact boundary of the family, the chain applied zero times,
        and every rung is compared against it under identical accounting.
      reproduction_check: >-
        TWO frozen fixtures. (a) ESTIMATOR BASELINE - the estimator run on the i = -1 rung
        must reproduce the published core-SVP blocksize for the same cost model within a
        tolerance declared BEFORE the run. If it does not, the estimator arm is void and only
        the paper-arithmetic stages are reportable; stating this in advance is precisely what
        stops a Stage-2 failure from silently downgrading into a Stage-0 conclusion.
        (b) ASYMPTOTIC-LIMIT FIXTURE - the concrete-constant evaluator, run in the limit that
        suppresses the logarithmic and constant factors the source itself ignores, must
        reproduce the source's own asymptotic form. If it does not, the concrete
        implementation disagrees with the source's summary of itself and nothing is
        reportable. This is what separates 'the concrete constants are large' from 'the
        transcription is wrong'.
    observation_collision:
      observable: >-
        The hardness coordinate C = (d, R). It carries the whole argument and it is
        deliberately lossy.
      distinct_preimage_search: >-
        THE COLLISION IS REAL AND IS ADMITTED UP FRONT. Instances with identical C can have
        very different attack costs; a plain q-ary LWE instance and a structured module
        instance at matched C is exactly such a pair, and it is the structure-deleted control.
        C is therefore NOT identifying, and conclusions are restricted to what C legitimately
        bounds - the unconditional R = 0 floor, which no collision can breach, and the
        estimator-relative comparison, where the collision is handled by scoring both arms
        with the same estimator rather than by claiming C determines cost. Any conclusion
        requiring C to be identifying is out of scope.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        The image instance under the composed chain, in which ML-KEM's module structure is
        exchanged for a rank-one ring instance at an exponentially larger modulus and an
        exponentially smaller ring dimension.
      predicted_gain: >-
        Predicted NEGATIVE, and predicted negative AT RUNG ONE. The value of the hypothesis is
        the SIZE of that loss and its decomposition into named columns - prefactor, choice of
        the free constant, choice of the smoothing parameter, spherical correction. The
        transform is selected precisely because its encoding, completeness and soundness
        obligations are already discharged by a published theorem, leaving only the cost-loss
        to be measured.
    quantifier_order: >-
      FOR ALL parameter sets in {ML-KEM-512, ML-KEM-768, ML-KEM-1024}, FOR ALL descent depths
      i >= 0 for which the chain's hypotheses hold, THERE EXISTS NO i such that the estimated
      attack cost of the i-th rung, scored by the frozen estimator under matched accounting,
      is strictly below the estimated attack cost of the un-reduced set. The negation - THERE
      EXISTS a set and THERE EXISTS an i with strictly lower cost - is the outcome the run is
      built to be able to report. The witness i is allowed to depend on the parameter set;
      nothing here claims a uniform i. Under the concrete constants this quantifier is
      VACUOUSLY satisfied on ML-KEM (no rung is alive), which is why the same statement is
      also posed over the budget-relaxed control, where it is not vacuous.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most - under the frozen cost model, the concrete constants of the named corollaries
        at declared parameters, and the single-shot descent, NO rung of THIS chain improves on
        the direct attack at these parameter sets, and the per-rung exchange rate is X bits of
        log2(q/sigma) for a factor 2^i of dimension. It cannot certify that no reduction
        helps, cannot certify anything about reductions not evaluated, cannot certify anything
        about ACTUAL as opposed to ESTIMATED attack cost, and cannot certify anything about the
        DECISION variant of any rung that used the spherical-error corollary.
      nearby_object_control: >-
        The budget-relaxed instance, at an artificially raised modulus-to-noise ratio, where
        the hoped-for conclusion should FAIL if the small budget is the load-bearing structure.
        If the method reports 'no rung improves' for both ML-KEM and the relaxed control
        identically, the method has not identified ML-KEM's small budget as load-bearing and
        its ML-KEM verdict carries no scheme-specific content. Running both is required, and
        doubly so because ML-KEM's own ledger is predicted empty.
    proof_obligations:
    - claim: 'R_0 computed from FIPS 203 constants, per parameter set, from constants re-read from the standard.'
      responsibility: baseline
    - claim: 'At sigma >= q/2 the samples are independent of the secret, so R = 0 is an absolute floor.'
      responsibility: correctness
    - claim: 'The MLWE-to-RLWE corollary transcribed verbatim with its admissibility condition and its advantage-loss term.'
      responsibility: correctness
    - claim: 'The free constant and the smoothing parameter pinned by the two inequalities at a declared negligibility level, with the bounding inequalities exhibited.'
      responsibility: size
    - claim: 'The rung-one blow-up evaluated per parameter set from the concrete prefactor.'
      responsibility: size
    - claim: 'The spherical-error column, with its sample-count dependence, its multiply-or-replace reading settled from the corollary text rather than the prose, and its search-only restriction recorded.'
      responsibility: size
    - claim: 'The descent charge read in single-shot form; composing halvings is forbidden and its overcharge is reported.'
      responsibility: correctness
    - claim: 'The estimator reproduces the published un-reduced baseline within a pre-declared tolerance.'
      responsibility: baseline
    - claim: 'The evaluator reproduces the source''s own asymptotic form in the source''s own limit.'
      responsibility: baseline
    - claim: 'The structure-deleted control emits exactly one rung; the pipeline checks hypotheses before applying them.'
      responsibility: interface
    - claim: 'The verdict is scoped to this chain, this cost model, these declared parameters, and these parameter sets.'
      responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    NULL AND REQUIRED TO BE. No exponent is claimed to move. The predicted result is a CLOSURE
    with a named obstruction and a number - a budget, its decomposition into named columns, and
    the forward guidance that any future reduction-cascade proposal against ML-KEM must exhibit
    total error-rate blow-up below the budget INCLUDING whatever correction its own scoring
    pipeline requires. A non-monotone (E2) outcome would be an ESTIMATOR-RELATIVE anomaly and
    would still require independent verification before any security claim.
  heuristic_assumptions:
  - id: HEUR-MK-1
    formal_statement: >-
      BLOW-UP FIDELITY UNDER NOISE TRANSFER. For all power-of-two ring dimensions n, all
      module ranks d >= 1, all admissible (free constant, smoothing parameter) and all error
      rates the corollary quantifies over, the multiplicative error-rate blow-up of the
      MLWE-to-RLWE step is exactly the factor stated there, with no additional instance-
      dependent factor, and in particular no factor depending on the secret distribution's
      shape beyond its standard deviation - so that a centred-binomial secret of standard
      deviation sqrt(eta/2) behaves under the reduction like a discrete Gaussian of the same
      standard deviation.
    random_model_justification: >-
      The corollary itself is rigorous, not heuristic; what is heuristic is only the TRANSFER
      to centred-binomial noise. The classical statement this imitates is the standard
      smoothing / Renyi-divergence argument by which CBD and discrete-Gaussian noise of matched
      variance are interchangeable for LWE hardness up to a small multiplicative loss in the
      distinguishing advantage. NOTE THAT THE CBD TAIL IS BOUNDED WHILE THE GAUSSIAN TAIL IS
      NOT, so the corollary's tail-bound pair is CONSERVATIVE for CBD - which is the safe
      direction for the ledger and must be stated as such rather than claimed as an
      improvement.
    supporting_results: []
    validation_experiment_ids:
    - EXP-MLKEM-67d103
    falsification_condition: >-
      At reduced parameters where the reduction can be executed end to end, the measured
      empirical error-rate blow-up on CBD secrets falls outside the corollary's stated factor
      by more than the declared tolerance, with the end-to-end fixture passing. That would mean
      the CBD-to-Gaussian transfer is not free and its cost belongs in the ledger.
  - id: HEUR-MK-2
    formal_statement: >-
      ESTIMATOR COMPARABILITY. A single lattice cost estimator, at one pinned version and one
      pinned cost model, applied to two instances whose logarithmic moduli differ by orders of
      magnitude, is wrong in the SAME direction on both, so that the reported signed difference
      between the two arms is unbiased even though neither absolute cost is.
    random_model_justification: >-
      Not a randomness heuristic. It is a comparability assumption, and it is the largest
      residual threat to the estimator arm, because a cost model whose error depends on log q
      would still bias the comparison. It is declared here rather than absorbed.
    supporting_results: []
    validation_experiment_ids:
    - EXP-MLKEM-67d103
    falsification_condition: >-
      The estimator baseline fixture fails at the un-reduced rung, or the sign of the reported
      difference is not stable across the swept modulus-to-noise range on the budget-relaxed
      control. Either voids the estimator arm; only the paper-arithmetic stages remain
      reportable, and that consequence is declared before the run.
  structural_ingredients:
  - description: >-
      The Module-LWE to Ring-LWE reduction and its dimension-reducing self-reduction, with
      their concrete constants, admissibility conditions and advantage-loss terms, in their
      CURRENT published version. The superseded earlier wording carries no live weight and the
      version's own changelog decides between them.
    citation: >-
      Albrecht and Deo, 'Large Modulus Ring-LWE >= Module-LWE', eprint 2017/612, version of
      01/2020. The PDF was fetched and read during the parent proposal's repair pass and
      text-extracted to an EPHEMERAL session scratchpad; that path is NOT a durable citation
      and a run must re-fetch, re-extract and re-verify every quoted string before any number
      is quoted downstream.
    provenance: retrieved
    verified_by: idea-generator@2026-08-21 in IDEA-20260821-003cb0
    role: the propagation law - the theorem-stated action of each reduction on the hardness coordinate
  - description: >-
      The ML-KEM parameter tables - ring dimension, modulus, module rank and the centred-
      binomial parameters, from which R_0 is computed.
    citation: NIST FIPS 203 (ML-KEM), parameter tables for ML-KEM-512/768/1024.
    provenance: recalled
    verified_by: null
    role: the source of the budget; every constant must be re-read from the standard and certified in-harness
  predictions:
  - metric: >-
      log2 of the rung-one MLWE-to-RLWE error-rate blow-up at the ML-KEM-768 shape, computed
      from the corollary's concrete constants at the declared free constant and smoothing
      parameter, in bits
    direction: different
    minimum_effect: >-
      A THREE-WAY PREDICTION, each branch naming what it would mean. (i) The value the
      abstract's asymptotic form gives when the concrete constants are dropped and the free
      constant is taken to zero - a measurement there would mean the concrete constants are
      NOT load-bearing at this ring dimension and the parent's arithmetic is wrong. (ii) The
      concrete-constant value, which is the PREDICTION, at a declared tolerance of plus or
      minus 0.3 bits at fixed negligibility level. (iii) The superseded 2017 wording's value -
      a measurement there would mean the implementation read the superseded version. Any value
      outside all three branches by more than the declared tolerance is itself the finding and
      is reported as an error in the parent's arithmetic.
  - metric: >-
      the spherical-error column at the ring dimension and the jointly optimised sample count,
      in bits
    direction: different
    minimum_effect: >-
      Reported BOTH as a multiplier of and as a replacement for the rung-one prefactor until
      the reading is settled from the corollary text rather than the prose. A column outside
      the declared band at the reference sample count means the sample-count dependence was
      mis-transcribed.
  - metric: >-
      number of ALIVE rungs (positive residual budget) for each ML-KEM parameter set under the
      composed chain, with the spherical-error column included
    direction: lower
    minimum_effect: >-
      Predicted EXACTLY 0 at every declared negligibility level. A count of 1 or more falsifies
      S2 and re-opens the chain, which is the outcome that would most change this hypothesis's
      priority. Reported SEPARATELY without the spherical column, where the prediction is also 0
      because the residual budget does not buy the single-shot first descent.
  - metric: >-
      signed difference in estimated primal blocksize, rung i minus the un-reduced baseline, on
      the budget-relaxed control, under matched accounting
    direction: higher
    minimum_effect: >-
      At least +1 blocksize unit at every alive rung. This is where the E1/E2 discrimination
      actually lives, because ML-KEM itself is predicted to have no alive rung to score. A
      difference of zero or negative at any alive rung is the E2 outcome and is escalated rather
      than absorbed.
  - metric: >-
      overcharge in bits from composing halvings versus the single-shot descent form, at descent
      depth 2
    direction: higher
    minimum_effect: >-
      Strictly positive at the declared free constant. A measured overcharge of zero would mean
      the composition and single-shot forms agree and the rung-by-rung composition model was not
      pessimistic after all.
  test_boundary:
    instances:
    - 'ML-KEM-512, ML-KEM-768 and ML-KEM-1024 at their FIPS 203 constants, re-read from the standard.'
    - 'NULL-1, the structure-deleted instance: plain unstructured LWE at matched hardness coordinate, on which the chain''s hypotheses FAIL.'
    - 'NULL-2, the budget-relaxed instance: the same ML-KEM shape with the modulus raised at fixed noise so the budget does not bind, swept over at least four modulus-to-noise values.'
    parameters:
      negligibility_levels: 'three declared values, so the choice of the free constant contributes a visible column'
      descent_depths: 'every admissible target ring dimension reachable by the single-shot descent'
      sample_count: 'optimised jointly with the estimator and reported per rung'
      variants: 'search and decision tagged separately; a decision-variant rung may not use the spherical-error corollary'
    implementation: >-
      Stage 0 and Stage 1 need no lattice and no estimator - standard-library Python arithmetic
      on transcribed constants, plus a verbatim-quotation log with locators and version dates.
      Stage 2 uses one pinned lattice estimator at one pinned commit and one pinned cost model,
      applied identically to both arms, reporting differences only. Recorded through
      harness/runner.py.
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 6.0
      maximum_memory_gb: 8
      maximum_runs: 20
  distinguishable_outcomes:
  - >-
    O1 (E1, PREDICTED). Both fixtures pass, NULL-1 emits exactly one rung, the ALIVE rung count
    is 0 on every ML-KEM set at every negligibility level, and every alive NULL-2 rung shows a
    strictly positive blocksize difference with the sign stable across the swept range. MEANING -
    the chain is closed at rung one by a MEASURED obstruction, and the deliverable is the budget,
    its decomposition into named columns, and forward guidance that binds every future
    reduction-cascade proposal against ML-KEM. This is a complete and useful negative and it
    costs no cryptanalytic compute.
  - >-
    O2 (S2 FALSIFIED ON PAPER). The ALIVE rung count is 1 or more on some ML-KEM set with the
    asymptotic-limit fixture passing. MEANING - the parent's concrete arithmetic is wrong in a way
    the fixture does not catch, the chain is OPEN, the descent depth becomes a real free parameter,
    and Stage 2 must be run on ML-KEM itself rather than only on the control. This is the outcome
    that would most change the lane's priority.
  - >-
    O3 (E2, THE MOST VALUABLE OUTCOME). Some alive rung - on NULL-2, or on ML-KEM in the O2
    branch - shows a blocksize difference of zero or below against its own baseline. MEANING - the
    exponential dimension reduction can outrun the linear ratio loss, and a published
    polynomial-time reduction leaks ESTIMATED security. It is escalated immediately for independent
    review and is not interpreted until replicated; it is an estimator-relative anomaly, not a
    security claim.
  - >-
    O4 (METHOD INSENSITIVE). Every alive NULL-2 rung shows a strictly positive difference AND the
    sign does not change across the swept modulus-to-noise range. MEANING - the method is
    insensitive to the budget, has not identified ML-KEM's small budget as the load-bearing
    structure, and NO scheme-specific conclusion may be reported. This is a stronger and more
    general statement than the ML-KEM one and it means the ML-KEM result is not about ML-KEM.
  - >-
    O5 (TRANSCRIPTION WRONG). The asymptotic-limit fixture fails - the evaluator does not reproduce
    the source's own asymptotic form in the source's own limit. MEANING - the corollary
    transcription is wrong and every concrete-constant number is void. Zero compute, and it is the
    cheapest way this hypothesis can fail.
  - >-
    O6 (PIPELINE VOID). NULL-1 emits more than one rung. MEANING - the pipeline applies
    transformations without checking the hypotheses that license them, and no ledger it produced is
    reportable at all. This is the cheapest possible check that the pipeline tracks a reduction and
    not merely arithmetic on two numbers.
  - >-
    O7 (SPHERICAL COLUMN NOT REQUIRED). An estimator that scores ellipsoidal errors natively is
    available and reproduces the baseline fixture. MEANING - the spherical correction comes off the
    budget, the residual margin flips sign, and the chain must be RE-SCORED against the single-shot
    first descent rather than declared dead. This is the most likely route by which the predicted
    closure would be overturned and it is named in advance.
  falsification_conditions:
  - >-
    The ALIVE rung count is 1 or more on any ML-KEM parameter set at any declared negligibility
    level with the asymptotic-limit fixture passing - S2 is false.
  - >-
    Any alive rung on ML-KEM itself shows a blocksize difference of zero or below - the headline
    prediction is falsified and the correct response is escalation to independent review, not a
    louder claim.
  - >-
    The recomputed rung-one blow-up falls outside the declared tolerance of the concrete-constant
    branch while the asymptotic-limit fixture passes - the parent's arithmetic is wrong, and that
    is recorded as an error with the corrected value.
  - >-
    Every alive NULL-2 rung shows a strictly positive difference with the sign invariant across the
    swept range - S3's discriminating power is absent and no scheme-specific conclusion is
    reportable.
  - >-
    NULL-1 emits more than one rung - the pipeline is void.
  interpretation_limits:
  - >-
    No attack, break, speedup or exponent movement is claimed and none would follow from a
    confirming run. A non-monotone run would be an estimator-relative anomaly requiring independent
    verification before any security claim.
  - >-
    Every conclusion is scoped to the exact reduction chain, parameter sets, cost model, estimator
    version and declared constants used, and says nothing about other reductions, other schemes, or
    quantum routes.
  - >-
    The hardness coordinate does not determine attack cost. Conclusions may rest on the
    unconditional R = 0 floor and on estimator-relative differences, and on nothing in between.
  - >-
    The parent proposal's numbers are proposer arithmetic on theorem text read from an ephemeral
    scratchpad. They are NOT measurements, no committed run supports them, and until a run re-fetches
    the source and recomputes them they must be labelled as proposer arithmetic wherever they appear.
  - >-
    An earlier draft of the parent presented two readings of the blow-up as a live dichotomy
    straddling the budget. That was a version confusion resolved by the source's own changelog, and
    the straddle supports nothing. Any downstream text quoting it is quoting a withdrawn claim.
  - >-
    The claim-tier ceiling for this lane is toy-tier. Nothing here upgrades it - the ledger is a
    derivation and the estimator arm is a model evaluation, not a solve.
  prior_evidence_refs:
  - RQ-MLKEM-001
  - IDEA-20260805-574cd0
  - KN-LIT-4628
