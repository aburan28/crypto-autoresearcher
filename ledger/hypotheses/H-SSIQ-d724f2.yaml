    hidden_cofactor: Source superpolynomial o(1); heap/sort polylog if streaming existed.
    claim_kind: heuristic_validation

  proof_search_map:
    bottleneck: >-
      Existence of an abelian path-independent ordered key on the N-marked
      groupoid with alphabet ≥ M=p^{1/3}; equivalently the order of the
      largest abelian quotient of H_N.
    baseline_embedding:
      parameter_slice: >-
        Incumbent keyed table (memory M); vOW at w=p^{1/6}. Cayley Z/n key g(x)=x.
      reproduction_check: >-
        Stage-0 Cayley Z/12 fixture must be abelian and full; O/NO map sends 1
        to I and det=nrd. check.py recomputes the Cayley fixture independently.
    observation_collision:
      observable: 'the pair (H_N, (H_N ∩ SL_2)^{ab}) per (p,N)'
      distinct_preimage_search: >-
        Index>1 vs missed generators (stabilisation prefixes); extra abelian
        quotient vs path-dependent holonomy (N dividing 6 not on this card).
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: Holonomy subgroup H_N and |H^{ab}|
        predicted_gain: Yes/no per cell; predicted det-only so alphabet is degree count.
    quantifier_order: >-
      FORALL frozen readable Stage-1 cells: the index/ab band decides
      O-CLOSED vs O-OPEN. NOT CLAIMED: all p; N|6; crypto-size Deuring; any
      time exponent < 1/3; closure of vOW.
    method_ceiling:
      strongest_certifiable_claim: >-
        On named toy (p,N) cells, |H_N|, index, and SL abelianisation are
        measured. Strong approximation remains recalled.
      nearby_object_control: >-
        Cayley Z/12 and F_p-spine must admit an abelian holonomy. A derivation
        forbidding those keys proves too much.
    proof_obligations:
      - claim: Twin BFS agree on every measured cell.
        responsibility: baseline
      - claim: Cayley/spine nearby objects stay abelian.
        responsibility: baseline
      - claim: Index and SL_ab decide O-CLOSED vs O-OPEN.
        responsibility: correctness
      - claim: Nothing asserted at the time exponent; Stage 2 off.
        responsibility: scope

