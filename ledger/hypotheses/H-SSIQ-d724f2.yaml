  title: >-
    Stage-1 holonomy census: for first two panel primes p≡3 (mod 4) and
    N∈{5,7} with p>N^4, either index[GL_2(Z/N)_S : H_N]=1 and
    |(H_N ∩ SL_2)^{ab}|=1 (O-CLOSED) or some readable cell shows a larger
    path-independent abelian quotient (O-OPEN)

  statement: >-
    CLAIM (heuristic_validation / group-theoretic census; NO ATTACK; NO
    EXPONENT). Let O be the standard maximal order of B_{p,infinity}
    (i^2=-1, j^2=-p) and H_N the subgroup of GL_2(Z/N) generated by images
    of elements of O with reduced norm in {2^a 3^b : 0 ≤ a+b ≤ 12}, S={2,3}.
    FOR frozen Stage-1 cells (first two primes p≡3 mod 4 at/above 2^10 and
    2^11, N∈{5,7}): a cell is readable iff p>N^4, twin BFS agree, O/NO
    identity/det checks pass, and |H_N| is stable across prefixes 100/200/400
    (clamped to the enumerated set). THEN either (i) every readable cell has
    index 1 and |(H_N ∩ SL_2)^{ab}|=1 (O-CLOSED), OR (ii) some readable cell
    has index>1 AND a nontrivial path-independent abelian quotient beyond
    det, or |SL_ab|>1 at index 1 (O-OPEN), OR (iii) readable cells exist but
    neither band fires (O-MIXED). The F_p-spine arm MUST be abelian (else
    O-ARTIFACT). The Cayley Z/12 positive control MUST show an abelian
    holonomy (else O-ARTIFACT). NO p^{1/4}. NO isogeny walk. Crypto-size
    Deuring Stage 2 unauthorized. Infra failure is O-IMPEDIMENT, never a
    negative mathematical result.

  mechanism: >-
    OBJECT: N-marked supersingular curves as the level-N groupoid of OneEnd;
    the missing object for Schroeppel-Shamir streaming of the Frobenius claw
    is an abelian-valued ordered key g satisfying (K1)-(K3) of
    IDEA-20260930-024033. OPERATION: transport of the marking along
    S-smooth-degree isogenies, recorded as the image of O-elements in
    GL_2(Z/N). Holonomy H_N is generated by those images. Twin meters:
    BFS subgroup closure in generator order vs reversed order. Spine arm:
    restrict to Z[sqrt(-p)]. Null arm: seeded random subgroup of equal
    order. This card does not stream a claw and does not move the time
    exponent; it measures whether any abelian path-independent quotient
    larger than det exists at toy p.

  predictions:
    - metric: index_GL2S_HN
      direction: same
      minimum_effect: 'O-CLOSED requires index=1 on every readable cell'
    - metric: ab_sl_order
      direction: same
      minimum_effect: 'O-CLOSED requires |(H ∩ SL_2)^{ab}|=1 for N∈{5,7}'
    - metric: R_max_vs_M
      direction: lower
      minimum_effect: 'R_max < p^{1/3} on every readable cell (alphabet vs list size)'
    - metric: spine_abelian
      direction: same
      minimum_effect: spine holonomy abelian on every cell (instrument control)
    - metric: twin_H_agreement
      direction: same
      minimum_effect: BFS path A equals path B as matrix sets

  test_boundary:
    instances:
      - 'Stage 0: freeze panel primes, N, S, formula, seven obligations, Cayley Z/12 and O/NO iso twin fixtures'
      - 'Stage 1 authorized: first two panel primes × N∈{5,7}; readable iff p>N^4'
    parameters:
      bit_floors: [1024, 2048, 4096, 8192, 16384]
      N_panel: [5, 7]
      S: [2, 3]
      max_sum: 12
      coord: 4
      stab_prefixes: [100, 200, 400]
      null_seed: 2026100303
    implementation: >-
      Pure Python under experiments/EXP-SSIQ-4ecc58/implementation/;
      command surface implementation/run.py driven by trial-plan.json.
      Twin meters in meters.py (BFS order vs reverse). No Magma/Sage/AUXIN/Bedrock.
      No Deuring sampler.
    budget:
      wall_clock_seconds: 7200
      memory_gb: 2
      maximum_runs: 4

  falsification_conditions:
    - Twin BFS disagree on any measured cell (O-ARTIFACT).
    - Spine arm non-abelian (O-ARTIFACT; instrument defect).
    - O/NO map: image of 1 is not I, or det ≠ nrd mod N (O-ARTIFACT).
    - Cayley Z/12 control not abelian/full (O-ARTIFACT).
    - Claiming an exponent move or p^{1/4} from this census.
    - Running crypto-size Deuring Stage 2 under this card.
    - Using Magma/Sage/AUXIN/Bedrock as the success path.

  distinguishable_outcomes:
    - id: O-CLOSED
      meaning: >-
        Twin OK; ≥1 readable cell; every readable cell has index=1 and
        |(H∩SL_2)^{ab}|=1. Ordered-merge lever closed at these (p,N) under
        the frozen S-smooth generating set. No exponent claim.
    - id: O-OPEN
      meaning: >-
        Twin OK; some readable cell shows index>1 with extra abelian
        quotient, or SL_ab>1 at index 1. Lever reopened only if R_max can
        reach M; reported per cell.
    - id: O-MIXED
      meaning: >-
        Twin OK; readable cells exist but neither closed nor open band fires
        (e.g. index 1 with undetermined SL_ab, or mixed cells).
    - id: O-INCONCLUSIVE
      meaning: No readable cell (all fail p>N^4, stab, or power). Band not read.
    - id: O-ARTIFACT
      meaning: Twin/spine/iso/Cayley instrument fail. No holonomy claim kept.
    - id: O-IMPEDIMENT
      meaning: Missing Stage-0 freeze, timeout, or crash. Never negative evidence.
    - id: O-STAGE0-OK
      meaning: Stage-0 freeze twin_ok; not a scientific census verdict.

  interpretation_limits:
    - No exponent moves. Time remains p^{1/3+o(1)}; memory lever is ordered-merge only.
    - Toy p; H1 (holonomy surjectivity for all large p) is not proved.
    - Strong approximation is recalled and must not back a Coordinator conclusion alone.
    - N=2,3,4 and cryptographic-size Deuring Stage 2 are unauthorized.
    - Generating set is S-smooth norms with a+b≤12, not the full S-unit group.
    - Closure of ordered-merge does not close vOW or rebuild-and-shard.

  heuristic_assumptions:
    - id: HEUR-SSIQ-024033-H1
      formal_statement: >-
        FOR N in {5,7} and every readable Stage-1 prime p>N^4, the subgroup
        H_N generated by the frozen S-smooth order elements contains SL_2(Z/N)
        (index of H_N in GL_2(Z/N)_S equals 1).
      random_model_justification: >-
        Strong approximation for SL_1 of a definite quaternion algebra is
        recalled (not retrieved) as the shape; the heuristic content is that
        the frozen generating set already surjects at p>N^4 on this panel.
      supporting_results:
        - IDEA-20260930-024033
        - knowledge/techniques/KN-TECH-055.md
      validation_experiment_ids:
        - EXP-SSIQ-4ecc58
      falsification_condition: >-
        A readable cell with index>1 (O-OPEN or O-MIXED depending on abelianisation).
    - id: HEUR-SSIQ-024033-H2
      formal_statement: >-
        For N coprime to 6, every path-independent abelian-valued key factors
        through det (degree); equivalently |(H_N ∩ SL_2)^{ab}|=1 on readable cells.
      random_model_justification: >-
        Perfectness of SL_2(F_q) for q>3 plus Weil pairing det=degree
        (IDEA-20260930-024033 H2). Measured here as abelianisation order.
      supporting_results:
        - IDEA-20260930-024033
        - knowledge/techniques/KN-TECH-050.md
      validation_experiment_ids:
        - EXP-SSIQ-4ecc58
      falsification_condition: >-
        Readable cell with |(H ∩ SL_2)^{ab}| > 1 (O-OPEN).

