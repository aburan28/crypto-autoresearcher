hypothesis:
  id: H-ICPERF-05021b
  question_id: RQ-ICPERF-94c86e
  source_idea: IDEA-20261017-9cf4b9
  derived_from_idea: IDEA-20261017-9cf4b9
  experiment_id: EXP-ICPERF-f839ca
  goal_id: GOAL-ICPERF-e6b6a4
  specified_at: '2026-10-17'
  proposed_by: coordinator
  status: approved
  approved_by_decision: DEC-20261017-65d831
  title: Bounded 63-bit three-base solver-to-certificate feasibility at m=2 through 8
  statement: >-
    On the frozen prime-field curve with p=9223372021248595841 and prime subgroup
    order r=9223372018953067627, the committed wide-field backend and exact
    full-point checker can execute the frozen B=475 coset, random and small-x
    systems across m=2..8 under equal per-cell limits. Separately planted
    positive m=2 and m=8 systems check solver-to-certificate feasibility.
    The 21 natural systems have one common public target per m, so their
    outcomes describe this fixed panel and cannot estimate relation yield
    or a factor-base speed advantage by themselves.
  mechanism: >-
    The coset arm represents x in c*mu_896 using a degree-896 predicate with
    eleven multiplication gates per x; the quadratic lift keeps gate equations
    sparse. The random and small-x arms encode the same B=475 point count
    directly. All arms use chained S3 equations for m summands and exact
    signed curve-point verification. Only 475 of the 896 coset field roots
    lift to the selected base points, so false roots and sign choices must be
    charged and rejected by an independent checker.
  assumptions:
    - The 16-seed coset scan and equal-size control bases were fixed before these targets.
    - Each of seven natural targets is shared by all three arms and is a public known-answer group point, not a planted decomposition.
    - A planted point identity is known independently of the solver; failure to find it at a cap is a bounded feasibility observation only.
    - The finite-field and curve checker is independent of the Sage polynomial solver implementation.
    - Static monomial support does not determine solving degree, matrix density, relation yield, or end-to-end work.
  proof_search_map:
    bottleneck: Whether the 63-bit solver and full-point certificate interface is valid and usable at the frozen cap.
    baseline_embedding:
      parameter_slice: Same p, r, B=475, m=2..8 and natural target for coset, random and small-x arms.
      reproduction_check: Replay the 21 archived input systems and a <=32-bit complete-engine regression; hash-check all frozen inputs and code.
    observation_collision:
      observable: Static input support, accepted polynomial roots, full-point certificates, and capped solve outcomes.
      distinct_preimage_search: Count non-lifting coset roots, altered roots, duplicate signed point rows, and auxiliary gate variables separately from certified relations.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Degree-896 coset predicate with a quadratic multiplication-gate lift.
        predicted_gain: A testable sparse-input representation; no solving-degree or whole-cost gain is assumed.
    quantifier_order: Freeze the bases, targets, backend, term order and caps before observing any arm; no target-conditioned base choice.
    method_ceiling:
      strongest_certifiable_claim: Correctness and bounded feasibility of this exact 27-cell solver-to-certificate panel.
      nearby_object_control: Equal-size random and small-x bases, six separately planted positives, altered-root rejection, and the <=32-bit regression.
    proof_obligations:
      - claim: Exact GF(p), polynomial and curve arithmetic at 63-bit width.
        responsibility: correctness
      - claim: Every accepted root names base points whose signed sum is the exact target point.
        responsibility: interface
      - claim: Every timeout, memory stop, model cap and false root remains in the charged record.
        responsibility: runtime
      - claim: Full IC phases and matched rho are needed for a total-runtime conclusion.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: wide_backend_and_checker_controls
      direction: higher
      minimum_effect: All frozen field identities, independent input replays, <=32-bit regressions and altered-root rejections pass.
    - metric: planted_m2_certificate_count
      direction: higher
      minimum_effect: One independently certified m=2 root per arm within the 300-second and 8-GiB per-cell caps; a censored cell does not falsify point identity.
    - metric: planted_m8_certificate_count
      direction: higher
      minimum_effect: One independently certified m=8 root per arm within the same caps; bounded failure is recorded without extrapolation.
    - metric: matched_natural_panel_accounting
      direction: different
      minimum_effect: All 21 cells attempted when no safety or integrity stop intervenes; every omission and capped outcome is accounted for at the fixed limits.
  test_boundary:
    instances:
      - One fixed 63-bit prime curve and subgroup, three B=475 bases, seven natural targets, six positive systems.
    parameters:
      p: '9223372021248595841'
      r: '9223372018953067627'
      base_size: 475
      arms: [coset, random, small_x]
      arities: [2, 3, 4, 5, 6, 7, 8]
      positive_count: 6
      natural_count: 21
      seconds_per_cell: 300
      rss_bytes_per_cell: 8589934592
      panel_seconds: 14400
      model_cap: 64
    implementation: research/icperf_prime63_inflight_admission_20261017/{execute.py,driver.py,check.py}, hash-bound by TASK-20261017-e5c95d.
    budget:
      enforcement: bounded machine protection and fixed panel sampling
      maximum_runs: 1
      maximum_cells: 27
  falsification_conditions:
    - A field arithmetic mismatch, altered-root acceptance, forged certificate, or wrong target-point sum invalidates the solver-to-certificate instrument.
    - Failure to certify a planted m=2 root at the frozen cap refutes only the predicted bounded m=2 feasibility for this implementation and panel, when its input identity and independent checker remain valid.
    - Failure to certify a planted m=8 root at the frozen cap refutes only the predicted bounded m=8 feasibility under the same condition.
    - A natural timeout, model cap, memory stop or unvalidated solver-reported UNSAT does not establish absence of a decomposition.
  interpretation_limits:
    - One curve, one common target per arity, three prepared bases and six positive controls; no powered yield or runtime comparison.
    - The fixed B=475 signed-multiset tuple-count ceiling makes natural m=2..6 relations sparse even for a perfect solver; zero observed relations cannot rank those arms.
    - A successful full-point certificate proves a relation for that cell, not useful rank or target discrete-log recovery.
    - No complete cold-start IC cost, matched rho gap, degree of regularity or asymptotic exponent is established by this bounded panel.
    - Negative evidence closes only the exact tested source, target, cap, host and checker scope.
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: Fixed-base signed m-sums may approximate uniform subgroup targets only after exact collision and sign accounting; this panel does not estimate that law.
      random_model_justification: The combinatorial tuple count is an upper bound on distinct reachable targets and supplies no uniformity theorem.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: A separately powered target-blind panel finds occupancy or tails inconsistent with the precommitted random-map comparison beyond its frozen uncertainty band.
  structural_ingredients:
    - description: Chained S3 relations and summation-polynomial point decomposition.
      citation: KR-IC-5a43e5
      provenance: internal
      verified_by: idea-generator in IDEA-20261017-9cf4b9
      role: Defines the relation representation; it is not a measured advantage.
    - description: Frozen 63-bit coset and equal-size control systems.
      citation: IDEA-20261017-9cf4b9
      provenance: internal
      verified_by: coordinator design session 2026-10-17 read the proposal and archived inputs
      role: Supplies the exact tested instance family.
  asymptotic_claim: null
  dominated_by: Matched generic rho and the current complete IC pipeline remain total-cost references; this bounded panel cannot rank them.
  sota_delta: No verified end-to-end improvement is claimed; the proposed observable is solver and certificate feasibility at 63-bit width.
