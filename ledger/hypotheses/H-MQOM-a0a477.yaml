hypothesis:
  id: H-MQOM-a0a477
  question_id: RQ-MQOM-001

  statement: >-
    SCOPE: MQOM v2.1 (specification dated 2025-09-22, the latest published as of
    2026-08-05; NO ROUND-3 SPECIFICATION EXISTS YET, tweaks due 2026-08-14), its
    eighteen published instances of Table 6, the ROM plus ICM setting the
    specification itself declares, and arithmetic only. CLAIM TIER: derivation.
    NO ATTACK, NO FORGERY, NO EXPONENT, NO STATEMENT THAT ANY CLAIMED LEVEL
    FAILS.
    THE HYPOTHESIS HAS THREE PARTS AND EACH CAN FAIL SEPARATELY.
    (P1, RECONSTRUCTION) MQOM v2.1's entire proof-system parameter table is
    generated by four closed forms with no free choices: tau =
    ceil((lambda - w)/(log2 N - 1)); eta_5r = lambda / log2|K|;
    eta_3r = m / mu; and mu = [K : F] with |K| = 2^16 for N = 2048 and 2^8 for
    N = 256. Every one of the eighteen published rows is reproduced exactly.
    (P2, ZERO SLACK) Define S_FS := tau*(log2 N - 1) + w - lambda and
    S_5r := eta_5r * log2|K| - lambda. Both are EXACTLY ZERO at all eighteen
    instances, while S_3r := eta_3r * log2|K| - lambda is STRICTLY POSITIVE at
    all eighteen (32 bits at MQOM2-L1-gf2-short-3r, 96 at L1-gf16-short-3r, 256
    at L1-gf256-short-3r). Every parameter the designers were free to choose
    sits exactly on its constraint; every parameter forced by the packing
    carries large slack.
    (P3, CONSEQUENCE) Because S_FS = 0, the claimed forgery cost 2^lambda is
    exactly the value of the specification's inequality and carries no reserve.
    Therefore the derived forgery cost is 2^(lambda - B) where B is the sum of
    the bits contributed by terms the inequality does not carry, and the
    hypothesis asserts that B IS FINITE, ENUMERABLE AND DERIVABLE WITHOUT
    COMPUTE from six named lines: the random-oracle query count, the additive
    combination of the two challenge phases, the split-repetition (multi-round
    Fiat-Shamir) forgery, grinding amortisation, the relaxed-opening offset the
    specification itself declines to adopt, and salt/seed collisions. THE
    HYPOTHESIS DOES NOT PREDICT B'S VALUE. It predicts that each of the six
    lines resolves to a derived number or an explicit derivably-zero, and that
    the count of lines left unresolved is reportable. A ledger with unresolved
    lines may not be summed and no security statement follows from it.
    IF ANY OF P1, P2, P3 FAILS, THE FAILURE IS THE DELIVERABLE. In particular a
    complete ledger with B = 0 or B = 1 is a supported statement that MQOM's
    soundness accounting is tight and complete, and that is the most likely
    single outcome.

  mechanism: >-
    DERIVED IN THIS SESSION IN EXACT INTEGER ARITHMETIC, OUTSIDE THE HARNESS,
    WITH NO RUN RECORD. Every number below is re-derivable in seconds and must
    be re-derived in-harness before any evidence record cites it. The
    specification was READ this session from https://mqom.org/docs/mqom-v2.1.pdf
    (HTTP 200, 707578 bytes) using a pure-zlib PDF stream extractor, because
    pdftotext is absent and pypdf crashes on import in this container. THE
    EXTRACTION IS LOSSY -- it recovers text-showing operators only, so table
    cells arrive in reading order and ligatures arrive as octal escapes. Stage 0
    of EXP-MQOM-bf568a re-verifies every quoted line and every table cell
    against the rendered PDF, and the hypothesis is not testable until it does.

    THE TWO DESIGN EQUATIONS, quoted from the extracted Section 3.1 and
    Section 2.1.4.
    (E1) "we chose the parameters tau and w such that (2/N)^tau * 2^(-w) <=
    2^(-lambda)", with tau := ceil((lambda - w)/(log2(N) - 1)). The 2/N per
    repetition, rather than 1/N, is the TCitH degree-1 polynomial ambiguity: for
    each external repetition a cheating prover is consistent at up to 2 of the N
    evaluation points.
    (E2) "we took eta = lambda / log2|K| for the batching (5-round) variant to
    ensure a soundness error of 1/|K|^eta = 2^(-lambda) (while eta is fixed to
    m/mu by design for the 3-round variant)".
    The specification's own justification of the grinding term is also quoted:
    "In the random oracle model (ROM), any attempt to forge a signature requires
    the adversary to make a random oracle query to get the associated challenge
    i*. Using grinding, each such random oracle query has only a probability
    2^(-w) to yield a valid grinding value val = 0. As a result, the (amplified)
    second-round soundness error scales from eps_1 = (2/N)^tau down to
    eps_1 * 2^(-w)".

    THE PUBLISHED ROWS (Table 6; six distinct proof-system rows, each shared by
    three base fields F in {F_2, F_16, F_256}):
      (lambda, N, w, tau, mu-set, eta_5r) =
      (128, 2048, 8, 12, {16,4,2}, 8),  (128, 256, 9, 17, {8,2,1}, 16),
      (192, 2048, 12, 18, {16,4,2}, 12), (192, 256, 3, 27, {8,2,1}, 24),
      (256, 2048, 6, 25, {16,4,2}, 16), (256, 256, 4, 36, {8,2,1}, 32).
      m = n takes the values 160/56/48 at Category I, 240/84/72 at III,
      320/116/96 at V for F_2/F_16/F_256.

    P1 EVALUATED. ceil(120/10) = 12; ceil(119/7) = 17; ceil(180/10) = 18;
    ceil(189/7) = 27; ceil(250/10) = 25; ceil(252/7) = 36. Six of six.
    eta_5r: 128/16 = 8; 128/8 = 16; 192/16 = 12; 192/8 = 24; 256/16 = 16;
    256/8 = 32. Six of six. eta_3r = m/mu: 160/16 = 10, 56/4 = 14, 48/2 = 24 at
    Category I short; 48/1 = 48 at Category I fast for F_256; 240/16 = 15 and
    320/16 = 20 at Categories III and V short for F_2. Every checked value
    matches the published table. THE RECONSTRUCTION IS THEREFORE EXACT AND IT
    PASSED BEFORE THIS RECORD WAS WRITTEN -- this is the inventor protocol's
    audit-1 baseline reproduction, performed on integers rather than on a plot
    that resembles a baseline.

    P2 EVALUATED. S_FS = 12*10 + 8 - 128 = 0; 17*7 + 9 - 128 = 0;
    18*10 + 12 - 192 = 0; 27*7 + 3 - 192 = 0; 25*10 + 6 - 256 = 0;
    36*7 + 4 - 256 = 0. S_5r = 8*16 - 128 = 0; 16*8 - 128 = 0; 12*16 - 192 = 0;
    24*8 - 192 = 0; 16*16 - 256 = 0; 32*8 - 256 = 0. S_3r = 10*16 - 128 = 32;
    14*16 - 128 = 96; 24*16 - 128 = 256; and so on, all strictly positive.
    WHY THIS IS NOT A COINCIDENCE, AND WHY THAT MATTERS. The ceiling in (E1)
    generically leaves a remainder in {0, ..., log2 N - 2}: ten possible values
    for the short sets, seven for the fast sets. If w were chosen for signing
    cost alone, the chance of six independent exact zeros is about
    (1/10)^3 * (1/7)^3 = 2.9e-6. THAT FIGURE IS AN ILLUSTRATION OF SCALE AND
    MUST NEVER BE REPORTED AS A P-VALUE: w is chosen from a small range under
    competing pressures and there is no reason its induced remainder
    distribution is uniform. The defensible statement is the weaker and
    sufficient one: w was selected to make (lambda - w) divisible by
    (log2 N - 1), which is a sensible design choice whose consequence is that
    no rounding reserve exists anywhere in the family.

    P3, THE LEDGER, AND WHY IT IS THE CONTENT. At nonzero slack a two-bit term
    is absorbed and invisible. At zero slack the sum of the omitted terms IS the
    gap between the claimed and derived levels, and there is no proof document
    in which that sum has already been taken: MQOM v2.1 Section 4.1 states, in
    the extracted text, "The formal EUF-CMA security proof of MQOM will be added
    to a future version of the specification." Independently, the abstract of
    ePrint 2026/629 (READ; PDF BODY NOT READ) states that MQOM's secret-key-root
    correlated GGM tree "introduces a dependency loop in the proof" and that
    "standard MPCitH proof templates do not apply directly", and proves EUF-CMA
    for two MODIFIED variants rather than for the submitted scheme. The six
    ledger lines and their status before any work:
    (L1) QUERY COUNT. (E1) bounds a per-query probability. Whether lambda is
    stated as a per-query bound or as a work bound changes the derived level by
    log2(Q_ro). READING TASK. Expected: already intended as a work bound;
    expected contribution 0 bits.
    (L2) PHASE COMBINATION. Two phases each at 2^(-lambda) combine additively to
    2^(-lambda+1), giving forgery cost 2^(lambda-1). DERIVED; contribution
    exactly 1 bit; unabsorbable at S_FS = 0.
    (L3) SPLIT-REPETITION FORGERY. For a multi-round Fiat-Shamir protocol the
    Kales-Zaverucha family of attacks costs
    min over t in [0, tau] of [ 1/Pr(at least t of tau first-phase repetitions
    succeed) + (N/2)^(tau - t) * 2^w ] rather than the product of the two
    errors. WHETHER THIS BITES ON MQOM IS DECIDED BY ONE READING: if the
    5-round batching challenge Gamma is GLOBAL across the tau repetitions, the
    attack collapses into (L2) and contributes nothing beyond one bit; if Gamma
    is drawn PER REPETITION, the optimisation must be performed. THIS IS THE
    SINGLE HIGHEST-VALUE UNKNOWN IN THE HYPOTHESIS, IT IS SETTLED BY READING
    ALGORITHM 3 AND ComputeP Alpha, AND IT COSTS NO COMPUTE. The cost formula
    itself is RECALLED AND UNVERIFIED -- no paper was retrieved -- and the line
    carries no number until it is retrieved or re-derived.
    (L4) GRINDING AMORTISATION. The 2^(-w) factor assumes the adversary cannot
    share grinding work across attempts. Algorithm 4 draws (i*, val) from a
    single XOF_5((hash, nonce)) output of length tau*log2(N) + w bits with nonce
    a 32-bit counter; the adversary may also vary hash. Expected: derivably
    zero. The 32-bit nonce caps the signer's search at 2^32 >> 2^w for every
    published w (max w = 12), so it is not a constraint either.
    (L5) RELAXED OPENING. The specification describes a relaxed vector
    commitment that "degrades the soundness of the proof system by an offset of
    log2(u) bits" with u := 2N(lambda/log2 lambda)^2, and states it was NOT
    adopted in v2. Contribution to MQOM v2.1: ZERO, by construction. It is
    carried in the ledger as the designers' own worked example of the mechanism
    by which an offset becomes a parameter change at zero slack, and log2(u) is
    computed as a calibration of scale (about 20.9 bits at lambda = 128,
    N = 2048).
    (L6) SALT AND SEED COLLISIONS. Delegated in full to IDEA-20260805-cec9b6 and
    carried here as a pointer, never double-counted.

    WHAT THE MECHANISM DOES NOT DO. It does not re-derive the TCitH soundness
    theorem, does not verify that the per-repetition error is 2/N rather than
    3/N or 1/N (a separate and worthwhile question whose sensitivity is
    quantified below), and does not touch the QROM. A one-unit error in the
    bad-set size would move the derived level by tau*log2(3/2) = 7.0 bits at
    Category I short and 21.1 bits at Category V fast -- a sensitivity worth
    recording precisely because there is no slack to absorb it, and worth
    recording as a SENSITIVITY rather than as a suspicion, since nothing here
    suggests the specification's 2 is wrong.

  assumptions:
    - >-
      FROZEN DEFINITIONS, fixed before any evaluation and admitting no free
      parameter. (1) S_FS(P) := tau*(log2 N - 1) + w - lambda. (2) S_5r(P) :=
      eta_5r*log2|K| - lambda. (3) S_3r(P) := (m/mu)*log2|K| - lambda.
      (4) tau_pred(P) := ceil((lambda - w)/(log2 N - 1)). (5) The ledger is the
      ordered list L1..L6 above, closed before evaluation; no line may be added
      after any number is observed, and every line is reported with one of the
      three markers derived / derivably-zero / unresolved. Any change to (1)-(5)
      after a value has been seen requires a superseding record, never an edit.
    - >-
      That the extracted Table 6 is faithful. This is the single evidentiary
      assumption and stage 0 of the paired experiment removes it or halts. A
      transposed column would change every number here.
    - >-
      NO ASSUMPTION IS MADE that MQOM is insecure, that B > 0, or that the
      designers overlooked anything. The hypothesis is symmetric and its most
      likely outcome is a complete ledger summing to at most one bit.

  proof_search_map:
    bottleneck: >-
      The single inequality (2/N)^tau * 2^(-w) <= 2^(-lambda) is the entire
      quantitative content of MQOM's unforgeability claim in the absence of the
      deferred EUF-CMA proof. Every parameter choice in Table 6 is downstream of
      it and nothing else in the specification bounds forgery cost. Repairing,
      confirming, or costing this one step is upstream of any statement about
      MQOM's claimed levels and consumes no compute.
    baseline_embedding:
      parameter_slice: >-
        The eighteen published instances of Table 6 themselves, under the two
        closed forms tau_pred and eta_5r. This is not a nearby regime chosen for
        convenience: it is the exact published parameter set, so the baseline
        and the target coincide and there is no extrapolation between them.
      reproduction_check: >-
        SYMBOLIC AND EXACT, AND PASSED BEFORE THIS RECORD WAS WRITTEN. Six of
        six on tau, six of six on eta_5r, and every checked eta_3r = m/mu. These
        are exact integer identities against published values, not a curve that
        resembles a baseline. Stage 1 of EXP-MQOM-bf568a recomputes them in the
        harness with a receipt.
    observation_collision:
      observable: >-
        The slack integer S_FS (and its companion S_5r), plus the ledger's
        per-line markers.
      distinct_preimage_search: >-
        A COLLISION EXISTS, IS TOTAL, AND IS THE CENTRAL RISK OF THE
        HYPOTHESIS: S_FS = 0 at all eighteen instances, so the observable does
        not distinguish any two MQOM parameter sets. Within MQOM its comparator
        spread is exactly zero. The hypothesis survives only because the fibre
        is probed from OUTSIDE MQOM: the null arm computes S_FS for (i) the MQOM
        v1.0 parameter table, a different design by the same team, and (ii) a
        synthetic sweep of w over its admissible range at each published
        (lambda, N). FORCED VALUE FOR THE SYNTHETIC NULL, DERIVED BEFORE THE
        RUN: the fraction of w values giving S_FS = 0 is exactly
        1/(log2 N - 1), i.e. 1/10 at N = 2048 and 1/7 at N = 256. IF THE NULL
        ALSO RETURNS ZERO EVERYWHERE, the statistic is a constant of the
        apparatus, P2's interpretation collapses, and the correct report is a
        controlled null (inventor protocol section 3). A second, sharper
        separation is already available and is what gives the observable its
        content: S_3r is strictly positive at every instance while S_FS and
        S_5r are zero, so the observable DOES distinguish free parameters from
        forced ones within the same table.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the informal question "is MQOM's forgery bound tight?" by the
          exact integer identity S_FS = 0 plus an additive ledger in bits. In
          that representation the hypothesis is an equality between integers and
          a finite enumeration, not a fit.
        predicted_gain: >-
          Converts an unbounded literature question into six checkable lines and
          two integers per parameter set, with the encoding obligation (the
          slack functional is the designers' own inequality rearranged, with no
          free choice), the completeness obligation (the ledger is closed before
          evaluation), the soundness obligation (each line is derived or marked
          unresolved, and unresolved ledgers may not be summed), and the transfer
          obligation DECLARED UNMET: nothing here transfers to the QROM or to
          any other MPCitH scheme.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable S_FS = 0 fixed and vary the forgotten structure:
          the base field, n, m, mu, the packing, the whole MQ instance. If some
          intrinsic invariant distinguishes the resulting eighteen objects
          inside the soundness argument, name it; the hypothesis asserts that
          none does, which is exactly why one inequality governs all eighteen.
        predicted_gain: >-
          If a distinguishing invariant IS found -- for instance if the
          per-repetition error is not 2/N uniformly across base fields -- the
          hypothesis is refuted at zero compute and the refutation is the useful
          result.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER: THERE EXIST four fixed closed forms (tau_pred,
      eta_5r, eta_3r, mu), chosen before any evaluation and depending on no
      instance, such that FOR ALL eighteen published instances the reconstructed
      parameters equal the published ones and S_FS = S_5r = 0 < S_3r. The
      witnesses may NOT depend on the instance, the base field, the category or
      the variant. The weaker order -- FOR ALL instances THERE EXISTS a formula
      -- is trivially satisfiable, is explicitly NOT claimed, and is not
      admissible as a result.
      THE QUANTIFIER TRAP BEING HUNTED IS IN THE TARGET, NOT IN THIS
      HYPOTHESIS. MQOM's claim is: THERE EXISTS a bound such that FOR ALL
      adversaries A making at most Q queries, Pr[A forges] <= 2^(-lambda) * Q or
      similar. The ledger's job is to determine, by reading, whether the
      quantifier over Q is inside or outside the specification's lambda, and
      whether the second-phase challenge is quantified once per signature or
      once per repetition -- the latter being exactly the difference between
      ledger line (L3) contributing one bit and requiring a full optimisation.
    method_ceiling:
      strongest_certifiable_claim: >-
        AT MOST: for MQOM v2.1, in the ROM plus ICM, granting the TCitH
        soundness theorem and the 2/N per-repetition error, the derived forgery
        cost is 2^(lambda - B) where B is the completed ledger's sum, scoped to
        the eighteen published instances. It CANNOT certify that MQOM is secure,
        cannot certify that MQOM is insecure, cannot say anything about the
        QROM, cannot validate the TCitH theorem it grants, and cannot transfer
        to FAEST, SDitH or any other MPCitH scheme. Writing it up as if it could
        would be the premature-closure failure mode in its overclaiming
        direction.
      nearby_object_control: >-
        THE 3-ROUND VARIANT AT THE SAME PARAMETER SET IS THE NEAREST OBJECT, AND
        THE HOPED-FOR CONCLUSION FAILS THERE BY CONSTRUCTION: S_3r is strictly
        positive (32, 96, 256 bits at Category I for F_2, F_16, F_256), so the
        3-round variant's first phase has enormous reserve and the ledger's
        lines are absorbed there rather than exposed. ANY ANALYSIS THAT REPORTS
        THE SAME ZERO SLACK FOR BOTH VARIANTS IS RESPONDING TO THE PARAMETER
        TABLE'S SHAPE RATHER THAN TO THE DESIGN EQUATIONS, AND HAS NOT
        IDENTIFIED THE LOAD-BEARING STRUCTURE. A second nearby object, also
        free: the MQOM v1.0 parameter table, a prime-field design by the same
        team, whose slack profile must be computed and reported before any
        conclusion is drawn about v2.1.
    proof_obligations:
      - claim: >-
          tau_pred, eta_5r and eta_3r reproduce all eighteen published rows of
          Table 6 exactly.
        responsibility: baseline
      - claim: S_FS = S_5r = 0 and S_3r > 0 at all eighteen instances.
        responsibility: correctness
      - claim: >-
          The synthetic null's zero-slack fraction is exactly 1/(log2 N - 1),
          so the comparator has nonzero spread and the statistic is not a
          constant of the apparatus.
        responsibility: strictness
      - claim: >-
          The ledger L1..L6 is closed before evaluation and every line carries a
          marker; an unresolved ledger is not summed.
        responsibility: interface
      - claim: >-
          The first-phase challenge structure (global versus per-repetition) is
          established by citation to Algorithm 3 and ComputeP Alpha, never
          inferred from a desired ledger total.
        responsibility: feasibility
      - claim: >-
          Nothing transfers to the QROM, to other MPCitH schemes, or to the
          truth of the TCitH soundness theorem, and every citation of this
          hypothesis carries that gap.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. There is NO complexity claim of any kind and no exponent
    is moved. The hypothesis is an ACCOUNTING AUDIT of a published design
    inequality. A completed ledger makes MQOM's claimed level derived rather
    than asserted; it makes no signature easier to forge, no system easier to
    solve, and adds no attack. dominated_by is not applicable because no Pareto
    point is claimed; sota_delta is zero on every attack axis (time, memory,
    data, queries, advice) and the deliverable is evidentiary.

  heuristic_assumptions:
    - id: HEUR-MQOM-FS-1
      formal_statement: >-
        NONE LOAD-BEARING FOR P1 OR P2. For all eighteen published instances,
        tau_published = ceil((lambda - w)/(log2 N - 1)) and
        tau*(log2 N - 1) + w - lambda = 0 are exact integer identities in four
        published integers, established by evaluation rather than assumed.
      random_model_justification: >-
        Not applicable: these are identities, not distributional statements.
        This entry exists to record that P1 and P2 are unconditional where
        their predecessor in this question (IDEA-20260801-018) was conditional
        on a simulation, and that the only assumption is evidentiary.
      supporting_results: []
      validation_experiment_ids: [EXP-MQOM-bf568a]
      falsification_condition: >-
        Any published tau differing from tau_pred, or any nonzero S_FS or S_5r,
        at any of the eighteen instances.
    - id: HEUR-MQOM-FS-2
      formal_statement: >-
        LOAD-BEARING FOR THE INTERPRETATION OF P2, NOT FOR ITS ARITHMETIC. That
        a designer choosing w for signing cost alone would produce a remainder
        (lambda - w) mod (log2 N - 1) approximately uniform on
        {0, ..., log2 N - 2}, so six exact zeros indicate deliberate tuning.
      random_model_justification: >-
        NONE THAT SURVIVES SCRUTINY, AND THAT IS RECORDED RATHER THAN PAPERED
        OVER. w is drawn from a small integer range under competing pressures
        (signing cost grows as 2^w while tau and hence signature size shrink as
        w grows), and there is no argument that the induced distribution on
        remainders is uniform. The 2.9e-6 figure is an illustration of scale and
        MAY NEVER BE REPORTED AS A P-VALUE.
      supporting_results: []
      validation_experiment_ids: [EXP-MQOM-bf568a]
      falsification_condition: >-
        The synthetic null returning S_FS = 0 for all w (the statistic is a
        constant of the apparatus), or the MQOM v1.0 table also showing
        identically zero slack (the "deliberate tuning" reading weakens sharply
        and must be reported weakened).
    - id: HEUR-MQOM-FS-3
      formal_statement: >-
        LOAD-BEARING FOR P3 AND THE WEAKEST LINK IN THIS RECORD. That the list
        L1..L6 is COMPLETE, i.e. that no seventh term is omitted by both the
        specification's inequality and this hypothesis.
      random_model_justification: >-
        None available: completeness of an enumeration of omitted terms cannot
        be established by any random model and is not claimed to be. The
        mitigation is procedural and stated: the list is frozen before
        evaluation, each line is marked, the unresolved count is reported in the
        headline of any resulting evidence record, and the ledger is offered to
        independent review specifically to be extended. A seventh line found by
        a reviewer is a SUCCESS OF THE FORMAT, not a failure of the record.
      supporting_results: []
      validation_experiment_ids: [EXP-MQOM-bf568a]
      falsification_condition: >-
        Any independent reviewer naming a term absent from both (E1)/(E2) and
        L1..L6. The hypothesis is then incomplete as stated and a superseding
        record carries the extended ledger.

  structural_ingredients:
    - description: >-
        The MQOM v2.1 design inequalities (E1) and (E2), the grinding argument,
        Algorithms 3 and 4, Table 6, and the Section 4.1 statement deferring the
        EUF-CMA proof.
      citation: >-
        MQOM v2.1 specification, https://mqom.org/docs/mqom-v2.1.pdf, fetched
        this session (HTTP 200, 707578 bytes) and read via a lossy zlib text
        extractor. PRIMARY SOURCE, READ, WITH THE EXTRACTION CAVEAT. Page
        references are NOT asserted because the extractor does not preserve
        them; supplying them is stage 0 of EXP-MQOM-bf568a.
      role: the entire quantitative content under audit
    - description: >-
        The dependency loop in MQOM's secret-key-root correlated GGM tree, and
        the fact that EUF-CMA is proved only for two MODIFIED variants.
      citation: >-
        Haruhisa Kosuge and Keita Xagawa, "Towards Formal Security Proofs of
        MQOM", Cryptology ePrint Archive Paper 2026/629, received 2026-03-31,
        approved 2026-04-02. ABSTRACT PAGE READ THIS SESSION (HTTP 200); THE PDF
        BODY WAS NOT READ. No theorem, lemma, bound or page from it is cited.
      role: >-
        external corroboration that the proof gap the specification declares is
        real and non-trivial; used for context only, never for a number
    - description: >-
        The multi-round Fiat-Shamir forgery cost formula
        min_t [1/P1(t) + (1/p2)^(tau-t)] for 5-round MPCitH signatures.
      citation: >-
        RECALLED, UNVERIFIED, NOT RETRIEVED. This is a CANDIDATE TO CHECK and
        never an authority. Ledger line (L3) carries no number until the source
        is retrieved or the formula re-derived from scratch, and retrieving or
        re-deriving it is a declared stage of EXP-MQOM-bf568a.
      role: potentially the only ledger line that could move a claimed level

  reduction_chain:
    core_problem: >-
      Determine, by arithmetic and reading alone, the derived forgery cost of
      MQOM v2.1 in the ROM plus ICM at its eighteen published instances,
      granting the TCitH soundness theorem.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. There is no reduction from this audit to any statement
      about FAEST, SDitH, or any other MPCitH scheme, and none is claimed: those
      schemes use different transforms, different challenge structures and
      different tree constructions, and the shared GGM/VOLE machinery is a
      similarity of implementation, not of soundness accounting. Any citation of
      this hypothesis toward another scheme must carry that gap explicitly.
      There is likewise no reduction to the QROM.

  predictions:
    - metric: >-
        G1 - reconstruction gate: number of the eighteen published rows of
        Table 6 whose tau, eta_5r and eta_3r all equal the closed-form values
      direction: higher
      minimum_effect: >-
        EXACTLY 18 of 18, on all three parameters. Tolerance is exact, not
        approximate: these are integers.
    - metric: G2 - S_FS at each of the eighteen instances
      direction: different
      minimum_effect: >-
        EXACTLY 0 at all eighteen. A single nonzero value falsifies P2 as stated
