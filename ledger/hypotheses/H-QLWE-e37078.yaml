# H-QLWE-e37078 — specified from IDEA-20261005-ccc1ad.
# Protocol approval is DEC-20261005-19b340. This record asserts no
# Ideal-SVP theorem, no attack, and no exponent change. No run has
# been performed. The design session opened the named texts in order
# to pre-register quotations. It did not extract an abstract into
# KN-LIT-6130.md, and it did not open either named PDF.
hypothesis:
  id: H-QLWE-e37078
  question_id: RQ-QLWE-9108dc
  source_proposal: IDEA-20261005-ccc1ad
  goal_id: null
  goal_id_note: >-
    ledger/questions/RQ-QLWE-9108dc.yaml does not name a goal_id on the
    head read at design time. This design does not attach one and does
    not edit a goal file.
  status: approved
  status_note: >-
    approved means the reading protocol in EXP-QLWE-20ad77 is approved
    for a later executor. It does not mean the absence claim is
    supported. Status moves only by DEC-20261005-19b340 under the
    standing user authorization of 2026-09-06. This design session
    opened the named texts and wrote no run artifact.
  proposed_by: coordinator
  conversion_note: >-
    The sentence classes, the four opened corpus paths, the two missing
    PDF paths, the instrument control on KN-TECH-046, and the
    falsification conditions are carried from IDEA-20261005-ccc1ad. The
    Coordinator added the exact falsifying sentence, the pre-registered
    quotations copied from files opened in this session, and the rule
    that a missing PDF is unreadable rather than a zero inside the
    paper.

  statement: >-
    TEST BOUNDARY. Six paths, and no others. (1)
    knowledge/literature/KN-LIT-6130.md. (2)
    knowledge/techniques/KN-TECH-060.md. (3)
    knowledge/techniques/KN-TECH-046.md. (4)
    research_digest/chunks/chunk_023.txt, only the block whose heading
    is "### file: 12171116.pdf (30p)". (5) downloads/12171116.pdf. (6)
    downloads/12171116 (1).pdf. A sentence counts only if it is quoted
    from a path that opened. An unopened PDF is not a reading.

    PRE-REGISTERED PREDICTION, fixed before any executor run. In every
    file among (1)-(4) that opens, the number of sentences that state
    what an archimedean fibre contributes to mixing, to covering
    radius, or to the height pairing is 0. Paths (5) and (6) were
    absent when this session listed them. An absent path is recorded
    as unreadable. It is not a sentence count inside the unread paper,
    and it is not evidence that the paper lacks the sentence.

    ABSTRACT STATUS. This session opened KN-LIT-6130.md. The
    Contribution section still says that no abstract was extractable
    from the first two pages of the local PDF and that the contribution
    was recorded from the title only. This session did not extract an
    abstract. The truncated paragraph in path (4) is a different file.
    It does not fill the stub.

    FALSIFYING SENTENCE. The absence claim fails if an opened file
    contains this sentence: "The archimedean fibre supplies the
    logarithmic embedding at the infinite places and thereby determines
    the covering radius of the Arakelov-class-group random walk." Any
    other sentence in an opened file that assigns the archimedean fibre
    a role in mixing, covering radius, or the height pairing fails the
    0-count as well.

    SENTENCES THAT DO NOT FALSIFY IT. They were copied from files this
    session opened, and none of them names an archimedean fibre. From
    path (4): "we prove that, subject to the Riemann Hypothesis for
    Hecke L-functions, certain random walks on the Arakelov class group
    have a rapid mixing property." From path (4): "We then exploit this
    result to relate the average-case and the worst-case of the
    Shortest Vector Problem in ideal lattices." From path (2): the
    Néron–Tate height attached to a symmetric ample line bundle is a
    positive semi-definite quadratic form on A(K) tensor R, obtained as
    a limit of Weil heights, vanishing exactly on the torsion subgroup.

    DISTINGUISHABLE OUTCOMES. (1) Count 0 on every opened file, the
    instrument control quotes the approximation-factor sentence from
    path (3), each missing PDF is recorded unreadable, and the two
    pre-registered path-(4) sentences occur in that file: the absence
    reading holds on the opened texts. It is not a theorem about the
    unread PDF. (2) The falsifying sentence, or any other
    fibre-contribution sentence, is quoted from an opened file: the
    0-count fails. (3) A pre-registered quotation does not occur in the
    file named as its source: the reading is invalid. (4) A named PDF
    opens and contains a fibre-contribution sentence: outcome (2) for
    that file. If it opens and the sentence is absent, record an
    additional 0 on that file only. (5) The instrument control does not
    find the approximation-factor sentence in path (3): inconclusive.
    The procedure failed to keep a sentence that is present.

  mechanism: >-
    The tracked object is a sentence in an opened file. The test keeps
    the self-reducibility sentence, the rapid-mixing sentence, and the
    archimedean-fibre sentence class, and it discards the rest of the
    unread paper. That is a lossy projection of the PDF onto text this
    checkout contains. A missing file does not become a formula. The
    Néron–Tate quadratic form in KN-TECH-060.md is not substituted for
    a missing archimedean-fibre sentence. The rapid-mixing sentence
    names the Arakelov class group and a Riemann Hypothesis hypothesis.
    It does not name the fibre. Broken spacing in the digest ("number
    eld", "o er") can hide a ligature. The robust token is the substring
    archimedean, which this session did not find in paths (1)-(4).

  assumptions:
    - The six paths are the copies named by IDEA-20261005-ccc1ad. This session opened (1), (2), (3), and the headed block of (4). Listing (5) and (6) returned "No such file or directory".
    - A title and a truncated abstract are not a checked theorem. The Riemann Hypothesis sentence is text inside the dump. This hypothesis does not assume that hypothesis and does not infer a fibre formula from it.
    - Case-sensitive search of paths (1), (2), (3), and the whole of chunk_023.txt for archimedean, fibre, fiber, and "covering radius" returned no matches in this session.
    - The only quantitative expression copied from path (4) is an asymptotic Hermite-factor loss of a tilde-O of square-root n. It is not a few-line arithmetic identity, and this session did not evaluate it.

  proof_search_map:
    bottleneck: >-
      The unread PDF. Opening downloads/12171116.pdf or
      downloads/12171116 (1).pdf is the only step that can add a
      sentence from the paper itself. Both paths were absent in this
      checkout, so that step was not taken.
    baseline_embedding:
      parameter_slice: >-
        KN-TECH-046 composes worst-case Ideal-SVP in quantum polynomial
        time at approximation factor exp(O~(sqrt(n))) in cyclotomic
        fields. That factor is the baseline. This hypothesis does not
        move it.
      reproduction_check: >-
        Quote the sentence "Composed: worst-case Ideal-SVP in quantum
        polynomial time at approximation factor exp(O~(sqrt(n)))." from
        knowledge/techniques/KN-TECH-046.md. This session quoted it.
        The executor quotes it again as the instrument control. The
        same file says the composition was read from other abstracts
        and that the number theory was not verified in that note.
    observation_collision:
      observable: >-
        A sentence that assigns the archimedean fibre a role in mixing,
        covering radius, or the height pairing.
      distinct_preimage_search: >-
        Two nearby sentences can be mistaken for that observable. The
        rapid-mixing sentence in the digest names the Arakelov class
        group and does not name the fibre. The Néron–Tate sentence in
        KN-TECH-060 names a quadratic form on A(K) tensor R and does
        not name the fibre. Both were opened. Neither is the observable.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The archimedean-fibre contribution sentence, including the
          pre-registered falsifying sentence named in the statement.
        predicted_gain: >-
          None on the Ideal-SVP exponent. The predicted count in the
          opened texts is 0. A later quote of the falsifying sentence
          changes the count and does not by itself move an exponent.
    quantifier_order: >-
      Forall files among the four opened paths, the fibre-contribution
      count is 0. This does not quantify over every text of the paper.
      The unread PDF sits outside the quantifier. Swapping those
      quantifiers would claim a theorem about a file this session did
      not open, which this hypothesis refuses.
    method_ceiling:
      strongest_certifiable_claim: >-
        A sentence count on the named opened paths, plus an explicit
        unreadable mark on each missing PDF. No attack, no exponent
        change, no rank certificate, and no Selmer or Sha certificate.
      nearby_object_control: >-
        KN-TECH-046 is the nearby object on which a requested sentence
        is present. The same quote-or-absence procedure must keep the
        approximation-factor sentence. If it reports that sentence
        absent, the procedure is wrong and the 0-count is inconclusive.
    proof_obligations:
      - claim: The fibre-contribution count on each opened path is the integer the executor quotes.
        responsibility: scope
      - claim: The instrument keeps the approximation-factor sentence when that sentence is present.
        responsibility: correctness
      - claim: A missing PDF is recorded as unreadable and is not entered as a zero inside the paper.
        responsibility: interface
    not_applicable_reason: >-
      The four audits are filled because the reading has a bottleneck,
      a baseline sentence, a collision with two nearby sentences, a
      quantifier, and a ceiling. The map is not a proof of Ideal-SVP.

  rerandomization: >-
    This hypothesis does not use a re-randomizing walk. The rapid-mixing
    sentence in the digest is text under test. It is not a device that
    converts a worst-case Ideal-SVP instance into an average-case
    instance, and the solution is not pulled back through a walk.

  asymptotic_claim:
    problem: >-
      Sentence extraction for Ideal-SVP self-reducibility text under
      RQ-QLWE-9108dc. The Ideal-SVP problem itself is not claimed to be
      easier.
    prior_best: >-
      exp(O~(sqrt(n))) quantum polynomial time for Ideal-SVP in
      cyclotomic fields, as composed in KN-TECH-046, and the Néron–Tate
      quadratic form as stated in KN-TECH-060. Neither is improved.
    time_exponent: unchanged
    memory_exponent: unchanged
    hidden_cofactor: >-
      No algorithmic o(1) term is claimed. The unread remainder of the
      paper is an evidence gap, not a cofactor.
    claim_kind_note: >-
      No exponent improvement, cofactor improvement, or constant-factor
      improvement is claimed, so none of those three labels is applied.

  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        No distributional hypothesis is used. For every opened file,
        the fibre-contribution count is a quote count, not a
        probability. The Riemann Hypothesis for Hecke L-functions
        occurs only as words inside the truncated abstract.
      random_model_justification: >-
        There is no random model. Nothing is asserted to behave like a
        uniform random object of a given size. The support is the
        opened text.
      supporting_results:
        - ref: research_digest/chunks/chunk_023.txt
          provenance: internal
          claim: >-
            The rapid-mixing sentence cites the Riemann Hypothesis for
            Hecke L-functions as a hypothesis of that text. This record
            does not adopt it.
          verified_by: >-
            Design session 2026-10-05, which opened the headed block of
            research_digest/chunks/chunk_023.txt.
      validation_experiment_ids:
        - EXP-QLWE-20ad77
      falsification_condition: >-
        The executor infers a fibre formula from the Riemann Hypothesis
        sentence, or reports a numerical value for the tilde-O of
        square-root n expression, or treats a missing PDF as a zero
        count inside the paper.

  structural_ingredients:
    - description: >-
        Title-only literature stub. No abstract was extracted in this
        session. Local PDF paths are named and were absent.
      citation: KN-LIT-6130
      provenance: internal
      verified_by: knowledge/literature/KN-LIT-6130.md
      role: the text whose abstract remains unextracted
    - description: >-
        Néron–Tate height as a positive semi-definite quadratic form on
        A(K) tensor R, a limit of Weil heights. No archimedean-fibre
        sentence.
      citation: KN-TECH-060
      provenance: internal
      verified_by: knowledge/techniques/KN-TECH-060.md
      role: nearby sentence that must not be substituted for the fibre sentence
    - description: >-
        Composed Ideal-SVP approximation factor exp(O~(sqrt(n))), read
        in that note from other abstracts, number theory not verified
        there.
      citation: KN-TECH-046
      provenance: internal
      verified_by: knowledge/techniques/KN-TECH-046.md
      role: instrument control and unchanged baseline
    - description: >-
        Truncated abstract under the heading for 12171116.pdf, ending
        inside the letters algori. Contains the average-case/worst-case
        sentence and the rapid-mixing sentence. Does not name the
        archimedean fibre.
      citation: research_digest/chunks/chunk_023.txt
      provenance: internal
      verified_by: research_digest/chunks/chunk_023.txt
      role: the only abstract paragraph this checkout opened

  reduction_chain:
    core_problem: >-
      Whether the opened texts contain an archimedean-fibre contribution
      sentence.
    corollaries: []
    corollaries_note: >-
      No published reduction is invoked. A sentence count does not
      cascade to a Ring-LWE corollary, a rank statement, or an attack.

  predictions:
    - metric: >-
        number of sentences, in files that opened, that state what an
        archimedean fibre contributes to mixing, covering radius, or
        the height pairing
      direction: different
      minimum_effect: >-
        0. One quoted fibre-contribution sentence, including the
        pre-registered falsifying sentence, is a different outcome.
    - metric: >-
        number of body sentences in the opened digest truncation that
        relate worst-case Ideal-SVP to average-case Ideal-SVP
      direction: different
      minimum_effect: >-
        1, the average-case/worst-case sentence quoted in the statement,
        against 0 such sentences in KN-LIT-6130.md.
    - metric: >-
        whether an abstract was extracted into KN-LIT-6130 beyond the
        title-only stub
      direction: different
      minimum_effect: >-
        not extracted, in this session. Extracting one from a newly
        readable PDF is a different outcome and is recorded as such.
    - metric: >-
        absolute discrepancy of one hand evaluation of an extracted
        few-line formula at one tiny discriminant or one tiny cyclotomic
        conductor
      direction: different
      minimum_effect: >-
        uncomputed. The only quantitative expression extracted is an
        asymptotic Hermite-factor loss. Discrepancy stays undefined
        until a few-line formula is present in an opened file.

  test_boundary:
    instances:
      - knowledge/literature/KN-LIT-6130.md
      - knowledge/techniques/KN-TECH-060.md
      - knowledge/techniques/KN-TECH-046.md
      - research_digest/chunks/chunk_023.txt
      - downloads/12171116.pdf
      - downloads/12171116 (1).pdf
    parameters:
      search_tokens:
        - archimedean
        - fibre
        - fiber
        - covering radius
      falsifying_sentence: >-
        The archimedean fibre supplies the logarithmic embedding at the
        infinite places and thereby determines the covering radius of
        the Arakelov-class-group random walk.
      numerical_branch: >-
        skipped unless an opened file contains a formula of a few
        arithmetic operations. The tilde-O expression is not that formula.
    implementation: >-
      Open each path and quote or record absence or record that the
      path is missing. No lattice reduction, no class-group computation,
      and no evaluation of an asymptotic expression.
    budget:
      enforcement: advisory
      maximum_runs: 1
      note: >-
        One reading pass. Time and memory watches live on the experiment
        contract. They are advisory.

  falsification_conditions:
    - A sentence quoted in this statement does not occur in the file named as its source.
    - An opened file contains the pre-registered falsifying sentence.
    - An opened file contains any other sentence that assigns the archimedean fibre a role in mixing, covering radius, or the height pairing.
    - downloads/12171116.pdf or downloads/12171116 (1).pdf is readable in this checkout and contains either the self-reducibility sentence or a fibre-contribution sentence. The file-not-found outcome is then false for that file.
    - A few-line formula is present in an opened source and no numerical comparison is reported.
    - The writeup states a self-reducibility theorem, an archimedean-fibre formula, an attack, or an exponent improvement that was not in an opened file.

  interpretation_limits:
    - Ideal-SVP self-reducibility reading only. The paper's theorem was not checked.
    - Not a Selmer or Sha certificate. Not a rank certificate. Not a result under RQ-ECRANK-27dcc5.
    - Provenance of the unread PDF remainder is not retrieved. No venue or year was checked. KN-LIT-6130.md has venue null and year null.
    - No deployed system is discussed. No exponent moves. Delta versus exp(O~(sqrt(n))) is zero on the time exponent.
    - A missing PDF is an observation about this checkout. It is not a proof that the unread paper lacks the sentence.

