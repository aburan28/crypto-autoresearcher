hypothesis:
  id: H-PAIR-04cff7
  question_id: RQ-PAIR-f2e31f
  added: '2026-08-25'
  derived_from_idea: IDEA-20260809-15e1cd
  statement: >-
    A complete, certified discrete logarithm in a small tower field of the same
    tower SHAPE as a deployed pairing target is reachable inside one bounded batch,
    and the resulting per-phase measurements constitute a usable calibration anchor
    for the asymptotic tower-field index-calculus cost model. Three limbs are
    asserted jointly and each is separately falsifiable.
    (A1) REACHABILITY. At three increasing field sizes sharing one tower shape, the
    pipeline returns an exponent whose certificate is re-verified by independent
    exponentiation, within the declared wall-clock and memory budget.
    (A2) PHASE SEPARABILITY. Relation collection, linear algebra and individual
    logarithm each carry an attributable operation count and peak memory, with the
    unattributed remainder below a pre-registered fraction of total cost. The
    asymptotic model is stated per phase, so a merged number cannot calibrate it and
    a large unattributed remainder makes the anchor unusable.
    (A3) CALIBRATION CONTENT. The dimensionless ratio of observed to modelled cost,
    computed per phase at each size, is NOT constant across the three sizes; it
    carries a measurable trend, and that trend rather than any single ratio is the
    calibration this goal would inherit otherwise.
    The hypothesis is FALSE if any certificate fails re-verification (A1 fails and
    nothing downstream is admissible), if the unattributed cost fraction exceeds the
    pre-registered bound at any size (A2 fails and no per-phase anchor exists), or if
    the per-phase ratios are statistically indistinguishable across the three sizes
    (A3 fails - a flat ratio, which the parent proposal records as the surprising and
    more valuable outcome, meaning the model's constants already absorb the size
    dependence at this scale).
  mechanism: >-
    Published pairing security levels are quoted from asymptotic cost expressions
    whose constants are left implicit. Any figure this goal produces by evaluating
    such an expression is a restatement of somebody else's constants, and the program
    has no way to tell whether it has restated them correctly.
    An end-to-end computation supplies the missing anchor. Building the tower,
    selecting polynomials, collecting relations, solving the linear system over the
    appropriate ring, and performing one individual logarithm exercises exactly the
    phases the asymptotic expression is stated over. Because the model is per phase,
    the anchor must be per phase: a single total operation count divides the whole
    model by one number and cannot distinguish an under-modelled relation search from
    an over-modelled linear algebra.
    Running three sizes with ONE tower shape is what converts a set of numbers into a
    calibration. A single size gives one ratio and no way to tell a constant from a
    slope; three sizes at fixed shape isolate the size dependence from the shape
    dependence, which is the only decomposition the model's own form permits at this
    budget.
    The certificate is what makes the anchor evidence rather than an assertion. The
    recovered exponent is re-verified by exponentiation in an implementation that
    does not share the solver's internal state, so a pipeline that has silently
    solved a different problem is caught before any number is quoted.
  assumptions:
    - >-
      Three field sizes at one tower shape are computationally reachable at the
      declared budget. This is precisely limb A1 and is measured rather than assumed;
      non-completion at a size is a budget outcome about this implementation under
      AGENTS.md rule 5, never a mathematical result.
    - >-
      Operation counts are recorded in a single declared unit per phase and the unit
      is stated in the manifest. Mixing field operations with ring operations across
      phases would make the per-phase ratios incommensurable.
    - >-
      Peak memory is measured per phase rather than for the process as a whole, since
      the linear-algebra phase dominates memory and a whole-process peak would
      attribute it to every phase.
    - >-
      The asymptotic model evaluated for comparison is DECLARED in the contract, with
      its source named, before any run. A model chosen after seeing the measurements
      is not a calibration.
    - >-
      Toy scale. Nothing measured here is a statement about a deployment-sized field,
      and the transfer assumption behind any extrapolation is stated explicitly and
      is not exercised by this hypothesis.
  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: null
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms: []
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations: []
    not_applicable_reason: >-
      Purely empirical. This hypothesis proposes no theorem, no asymptotic bound and
      no reduction; it asserts that a measurement is reachable and that its per-phase
      decomposition is usable. The proof-oriented audits of KN-TECH-080 have no
      target here, and the checks that would substitute for them - a known-answer
      self-consistency arm and an independent certificate re-verification - are
      carried in the experiment's controls instead.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: >-
        The tower-field index-calculus cost model whose per-phase constants this
        anchor would calibrate.
      citation: >-
        NOT READ. The parent proposal IDEA-20260809-15e1cd lists its primary
        reference as recalled, required, and not yet read. The contract therefore
        requires the model to be transcribed from a primary source with a quoted
        excerpt and a hash as a BLOCKING stage, and reports the calibration arm
        UNRUN if no source can be obtained.
      provenance: recalled
      verified_by: null
      role: modelled cost per phase, the denominator of every reported ratio
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: certificate_verification
      direction: different
      minimum_effect: >-
        The recovered exponent re-verifies by independent exponentiation at every
        completed size. A single failure means the pipeline is wrong and NO later
        figure produced by this goal is admissible.
    - metric: unattributed_cost_fraction
      direction: lower
      minimum_effect: >-
        Below 0.15 of total measured operations at every completed size. Above that,
        the phases did not separate and the anchor cannot calibrate a per-phase model.
    - metric: observed_to_modelled_ratio_per_phase
      direction: different
      minimum_effect: >-
        Reported per phase per size with a seed-derived interval. Order-of-magnitude
        agreement at best is expected, with relation collection closer than linear
        algebra. No agreement threshold is pre-registered as a pass condition, because
        the ratio's VALUE is the measurement; what is pre-registered is that it is
        reported with an interval and never quoted without its phase.
    - metric: ratio_trend_slope
      direction: different
      minimum_effect: >-
        The slope of log ratio against log field size, per phase, with an interval
        that EXCLUDES zero on at least one phase. An interval containing zero on
        every phase means the ratio is flat across the tested range - limb A3 fails
        and the model's constants already absorb the size dependence at this scale.
    - metric: peak_memory_per_phase
      direction: higher
      minimum_effect: >-
        Reported in bytes per phase per size, with the linear-algebra phase's
        dominant structure sized analytically and the measured peak reconciled
        against it. A measured peak differing from the analytic size by more than a
        factor 4 means the dominant structure was mis-identified.
  test_boundary:
    instances:
      - >-
        Three finite fields of one fixed tower shape and increasing base-prime size,
        each carrying a target element of known prime-order subgroup.
      - >-
        A self-consistency instance at each size whose logarithm is known by
        construction, run through the identical pipeline.
    parameters:
      tower_shape: 'k = 6, built as a degree-2 extension of a degree-3 extension, fixed across all three sizes'
      base_primes: 'three primes of approximately 8, 12 and 16 bits, giving fields of approximately 48, 72 and 96 bits'
      phases: 'polynomial selection, relation collection, linear algebra, individual logarithm'
      operation_unit: one base-field multiplication, declared per phase in the manifest
      seeds: '3 per size'
    implementation: >-
      A new standalone driver under experiments/EXP-PAIR-a5c19e/driver/ with its own
      tower arithmetic, plus a SEPARATE certificate re-verifier that shares no state
      with the solver. Nothing under harness/ is modified.
    budget:
      wall_clock_seconds_total: 28800
      maximum_memory_gb: 16
      maximum_runs: 24
  falsification_conditions:
    - >-
      Any recovered exponent fails independent certificate re-verification. The
      pipeline is wrong, the run set is invalid, and no figure this goal produces may
      cite it.
    - >-
      The self-consistency arm - recomputing the logarithm of a known power - returns
      a value other than the known exponent at any size. The instrument is void and
      no negative may be read from any arm.
    - >-
      The unattributed cost fraction exceeds 0.15 at any completed size. Limb A2 is
      false; per-phase costs did not separate cleanly and the calibration is unusable
      for a model stated per phase.
    - >-
      The ratio-trend slope interval contains zero on every phase. Limb A3 is false;
      the ratio is flat across the tested range and a single-size anchor would have
      sufficed - which the parent proposal records as the surprising outcome and which
      must be reported as such rather than as a failure.
    - >-
      No certified exponent is obtained at ANY of the three sizes inside the batch
      budget. Limb A1 is unresolved rather than false. This is a BUDGET outcome about
      this implementation under AGENTS.md rule 5, the calibration is recorded as
      unavailable, and every later extrapolation by this goal must say so.
  interpretation_limits:
    - >-
      Toy-scale calibration. Nothing here is a statement about a deployment-sized
      field or about the security level of any deployed pairing-friendly curve.
    - >-
      The anchor calibrates THIS implementation against a DECLARED model. A different
      implementation, a different polynomial-selection strategy or a different linear-
      algebra method has different constants, and none of them transfer.
    - >-
      Non-completion at a size is an infrastructure and budget outcome, never
      evidence that the computation is infeasible.
    - >-
      A calibrated constant is not a security level. Converting any number here into
      a statement about a deployed parameter set requires the real parameters, the
      best known variant, and an extrapolation whose assumptions are stated - none of
      which this hypothesis supplies.
  status: proposed
  proposed_by: idea-generator
  specified_by: coordinator
  prior_evidence_refs:
    - RQ-PAIR-f2e31f
    - IDEA-20260809-15e1cd
    - GOAL-PAIR-001
    - docs/claims-and-verification.md
  distinguishable_outcomes:
    - outcome: >-
        Certificates verify at all three sizes, the unattributed fraction stays below
        0.15, and at least one phase's ratio-trend slope interval excludes zero.
      meaning: >-
        A1, A2 and A3 all hold. The goal owns a per-phase calibration anchor with a
        measured size trend, and any extrapolation it publishes afterwards is its own
        rather than an inherited restatement. The anchor is scoped to this tower
        shape, this implementation and this size range.
    - outcome: >-
        Certificates verify and phases separate, but every phase's ratio-trend slope
        interval contains zero.
      meaning: >-
        A3 is FALSE. The observed-to-modelled ratio is flat over the tested range, so
        the model's constants already carry the size dependence here and a single
        anchor point would have been sufficient. Reportable and useful - it says the
        cheaper experiment was the right one - and it must not be dressed up as a
        confirmation of the model at scale, which three toy sizes cannot support.
    - outcome: >-
        Certificates verify but the unattributed cost fraction exceeds 0.15 at one or
        more sizes.
      meaning: >-
        A2 is FALSE. The measurement exists but is not decomposable into the phases
        the model is stated over, so it cannot calibrate that model. The reported
        deliverable is the total-cost anchor plus an explicit statement that no
        per-phase calibration is available, and the phase-attribution instrumentation
        is the named next target.
    - outcome: >-
        Any certificate fails re-verification, or the known-answer self-consistency
        arm returns a wrong exponent.
      meaning: >-
        INVALID RUN SET. The pipeline is not computing what it claims; nothing is
        interpreted, the run returns to the executor with the failing instance, and
        no ratio, trend or anchor is reportable from it.
    - outcome: >-
        No certified exponent is obtained at any size within the declared budget.
      meaning: >-
        UNRESOLVED, on infrastructure grounds. Under AGENTS.md rule 5 this is a
        budget outcome about this implementation and NOT evidence that the
        calibration is unreachable. The recorded consequence is that the calibration
        is unavailable and every extrapolation this goal makes must declare it.
