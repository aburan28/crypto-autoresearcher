hypothesis:
  id: H-ECDLP-3ca750
  question_id: RQ-ECDLP-4fcbd3
  added: '2026-09-05'
  derived_from_idea: IDEA-20260905-9c4f0c
  statement: >-
    SCOPE: the harness r-adding walk F(W) = W + T_{x(W) mod r} (harness/rho.py) on
    cofactor-1 prime-order subgroups at field_bits in {12, 14, 16, 18, 20, 22, 24}
    with r in {4, 8, 16, 32}, its lumping by a frozen partition library, and its
    itinerary classes to every depth k with r^k <= sqrt(N); the random-label walk
    (same table, seeded uniformly random labelling s') as the null of the same
    shape; one cyclic order-2q curve per size for the known-true spectral object.
    CLAIM TIER toy. NO ATTACK, NO EXPONENT MOVED.
    Claim, in three parts. (1) LUMPED DEFECT DECAYS: for every partition g in the
    library, the centred second singular value lambda_2(Q_g) of the lumped
    transition matrix scales as p^gamma with gamma in [-0.65, -0.35] across the
    ladder on the true walk, and the true/null ratio stays within a factor 2 at
    every cell. (2) NO ITINERARY CONCENTRATION: at every depth k with r^k <=
    sqrt(N), including every depth beyond k* = log(N)/(2 log(2r)) where the
    class-indicator Weil bound exceeds the class size, the class-averaged arc
    concentration A_k(true) - A_k(null) is within the null's bootstrap band of
    zero, the class-minimum statistic is within the null's extreme-value band, and
    every class indicator's DL-spectrum has beta in [0.45, 0.60] with Z in [0.5,
    4]. (3) KNOWN-TRUE DETECTION: on the order-2q curve with the branch chosen by
    the descent symbol, the depth-1 classes have A = 1/2 +- 0.05 (parity classes
    are spread) AND a class-indicator spike at frequency q at the full level
    (beta = 1); the instrument must report both.
    Claim (2) is FALSE if some depth k has class-averaged A_k(true) below 0.4
    while A_k(null) stays at 0.5 +- 0.05, at the two largest sizes, replicated on
    the second curve family; that depth and its modelled localized-kangaroo cost
    are then the finding and trigger independent review. Claim (1) failing means
    the lumped operator carries coordinate information beyond the constant-factor
    literature; it is recorded, not interpreted as an attack.
  mechanism: >-
    The real walk chooses its branch from x(W) mod r, so it is not a convolution
    and its lumped operator can carry coordinate-to-coordinate information; for
    bounded-complexity partitions that information is bounded by completion of
    sums on the addition correspondence at relative size O(r^2 sqrt(p) log^2 p /
    N), hence claim (1). The depth-k itinerary class is a residue condition on the
    k-fold composite whose degree grows exponentially in k, so past k* the Weil
    bound on the class indicator exceeds the class size and certifies nothing;
    under the random-mapping heuristic the class is spread uniformly on the log
    line, and every published rho analysis assumes it; claim (2) measures it. A
    class concentrated on an arc of relative length A is a localiser: for W = Q +
    uP the itinerary (k steps) localises log Q + u to the arc and a kangaroo
    finishes at 2 sqrt(A N), which beats 0.886 sqrt(N) iff A < 0.196; that is the
    modelled readout and it is never run. The two preimages of a small A (genuine
    concentration versus a small class) are separated by pairing every statistic
    with the null walk at matched class size.
  assumptions:
    - >-
      The walk reproduces harness/rho.py step for step: byte-identical regression
      of the first 10^4 iterates from the harness start point on a shared seed is
      blocking.
    - >-
      Table logs are distinct and nonzero; a degenerate table is rejected before
      the cell runs.
    - >-
      Logs are tabulated by enumeration and certified on a 1000-entry sample.
    - >-
      Toy tier, depth cap r^k <= sqrt(N); no transfer.
  proof_search_map:
    bottleneck: >-
      Coordinates locating the log: a class of cheaply decidable points whose
      logs are not spread. Forbidden below k*, unproved above.
    baseline_embedding:
      parameter_slice: >-
        The random-label walk at every cell, and the k = 1 slice where the Weil
        bound applies with margin.
      reproduction_check: >-
        At k = 1 both walks give class-averaged A = 1/2 within the band; the
        lumped matrix for g = s reproduces the marginal law of s exactly.
    observation_collision:
      observable: A_sigma and lambda_2
      distinct_preimage_search: paired with the null at matched class size; never reported unpaired
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: the pair (itinerary, log arc)
        predicted_gain: exposes the one observable that could carry an exponent; none predicted
    quantifier_order: >-
      FOR ALL cells and classes with r^k <= sqrt(N): spread. Alternative: THERE
      EXISTS a depth at which EVERY class is concentrated below 0.196, persisting
      in p.
    method_ceiling:
      strongest_certifiable_claim: >-
        Measured spreading of itinerary classes of the harness walk at toy scale
        to the depth cap, paired with the null. Nothing about other iteration
        functions or larger p beyond slopes.
      nearby_object_control: the descent-symbol-driven walk on the order-2q curve
    proof_obligations:
      - claim: walk regression and log certificate
        responsibility: correctness
      - claim: k* formula
        responsibility: baseline
      - claim: extreme-value band from the null walk
        responsibility: size
      - claim: kangaroo cost model stated as a model
        responsibility: runtime
      - claim: toy tier, depth cap
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    Explicitly null. A measured concentration would be priced by the modelled
    localized-kangaroo cost, which is a model and not a claim; none is predicted.
  heuristic_assumptions:
    - id: HEUR-CBIAS-H2
      formal_statement: >-
        Random-mapping heuristic for itinerary classes: for every depth k with
        r^k <= sqrt(N), the depth-k itinerary class of the harness walk is
        distributed on Z/N like a uniformly random subset of its size.
      random_model_justification: >-
        Below k* the Weil-level bound on the class indicator's DL-spectrum
        (recalled) forces equidistribution against every character; above k*
        there is no rigorous support, which is why it is measured. The classical
        statement imitated is the equidistribution of a random subset.
      supporting_results:
        - 'Recalled pointers only: Bombieri 1966, Kohel-Shparlinski 2000, Lange-Shparlinski 2005. Unverified in this program.'
        - 'The random-label walk measured in the same runs.'
      validation_experiment_ids: [EXP-ECDLP-2c3d20]
      falsification_condition: >-
        A depth with class-averaged A_k(true) below 0.4 while the null stays at
        0.5, at the two largest sizes on both families; or a class family with
        spectral beta at or above 0.60 under the same replication.
  structural_ingredients:
    - description: The harness r-adding walk with x mod r partition and seeded table.
      citation: harness/rho.py
      provenance: internal
      verified_by: claude-code-session 2026-09-05 (read in full)
      role: the walk under test
    - description: Teske r-adding walks and the constant-factor status of mixing.
      citation: KN-TECH-006
      provenance: internal
      verified_by: claude-code-session 2026-09-05 (read in full)
      role: the ceiling for claim (1)
    - description: Walk-lane null-object discipline and the statement that mixing moves constants only.
      citation: EXP-EWALK-f19570
      provenance: internal
      verified_by: claude-code-session 2026-09-05 (read lines 1-320)
      role: design precedent
    - description: Uniformity of additive walks on elliptic curves via exponential sums, for the regime the theorems cover.
      citation: >-
        RECALLED, NOT READ. Lange and Shparlinski, Canad. J. Math. 57 (2005).
        A reviewer with retrieval should determine which depth regime the
        theorems cover; this hypothesis measures across that boundary.
      provenance: recalled
      verified_by: null
      role: the boundary between proved and unproved depths
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: lambda_2_slope_gamma
      direction: different
      minimum_effect: Null in [-0.65, -0.35] on both walks with ratio within 2; structure above -0.25 on the true walk only.
    - metric: arc_concentration_paired_difference
      direction: different
      minimum_effect: Null within the bootstrap band of zero at every depth; structure below -0.1 at some depth at the two largest sizes.
    - metric: class_indicator_beta
      direction: different
      minimum_effect: Null in [0.45, 0.60]; structure at or above 0.60 under replication.
    - metric: modelled_localized_kangaroo_cost
      direction: lower
      minimum_effect: Reported only; under the null at or above 0.886 sqrt(N).
  test_boundary:
    instances:
      - cofactor-1 prime-order curves at field_bits in {12, ..., 24}, three seeds, generated by rejection
      - r in {4, 8, 16, 32} with the harness's seeded table
      - the random-label walk per cell
      - one cyclic order-2q curve per size with the descent-symbol-driven walk
    parameters:
      field_bits: [12, 14, 16, 18, 20, 22, 24]
      seeds: [20260905, 20260906, 20260907]
      r: [4, 8, 16, 32]
      depth_cap: r^k <= sqrt(N)
      partition_library: ['s itself', 'x mod 2', 'x mod 4', 'x mod 8', 'x mod 16', 'Legendre(x)', 'y mod 2', '1[x < p/2]']
    implementation: >-
      A standalone driver under experiments/EXP-ECDLP-2c3d20/driver/ that imports
      harness/toycurve.py and harness/rho.py (read, not modified), runs through
      harness/runner.py.
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 16
      maximum_memory_gb: 8
      maximum_runs: 64
  falsification_conditions:
    - A depth with class-averaged A_k(true) below 0.4 while the null stays at 0.5, at the two largest sizes, on both families. Claim (2) false; escalate.
    - A class family with spectral beta at or above 0.60 under the same replication. Claim (2) false; escalate.
    - lambda_2 slope above -0.25 on the true walk while the null decays. Claim (1) false; recorded.
    - The descent-symbol walk fails to show the spike at q or shows A far from 1/2. Instrument void.
    - Walk regression fails, table degenerate, certificate fails. Instrument defect; nothing reported.
    - Crashes, timeouts, memory exhaustion. Infrastructure, never negative mathematical evidence.
  interpretation_limits:
    - Toy tier; depth cap at most 6 symbols.
    - Closes the itinerary family for the harness walk only; other iteration functions untouched.
    - The exploit cost is a model; never a claim.
  status: proposed
  proposed_by: claude-code-session
  specified_by: >-
    claude-code-session 2026-09-05, as a DESIGN DRAFT; not a Coordinator status
    change.
  prior_evidence_refs:
    - RQ-ECDLP-4fcbd3
    - RQ-EWALK-8fa147
    - IDEA-20260905-9c4f0c
    - IDEA-20260905-b6154d
    - the lumpability-defect proposal named as nearest_internal_record in the parent idea's novelty_screen (referenced indirectly so tools/ecc_priority.py's open-idea worklist does not read this hypothesis as designing it)
    - EXP-EWALK-f19570
    - KN-TECH-006
  distinguishable_outcomes:
    - outcome: All three claims hold.
      meaning: >-
        The itinerary family of the harness walk is measured spread to the depth
        cap at toy scale, including beyond k*; the obstruction is the measured
        paired difference and its band; the resource reading is that lambda_2's
        constants are walk-engineering data for the EWALK lane.
    - outcome: Claim (2) false at some depth under replication.
      meaning: >-
        First measured DL concentration in the lane. Replicate at a fourth seed
        and a further size, review independently, then model the cost with
        IDEA-20260905-b6154d's line; no attack is asserted before that.
    - outcome: Claim (1) false, claim (2) holds.
      meaning: >-
        The lumped operator carries more coordinate information than the
        constant-factor literature prices, but it does not locate the log; a
        constant-factor finding for walk engineering, no exponent.
    - outcome: Instrument failure or infrastructure.
      meaning: Nothing about the walk is learned; reported as such.
