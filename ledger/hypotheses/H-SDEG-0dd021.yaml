  interpretation_limits:
  - >-
    CLAIM TIER toy, and it may not be raised by any downstream citation. This
    is a MODEL REPAIR OF A MEASUREMENT INSTRUMENT, NOT AN ATTACK. A validated
    Phi makes d_reg predictions usable; it makes no system easier to solve and
    MOVES NO EXPONENT. Pollard rho remains the ECDLP baseline. sota_delta is
    ZERO on every attack axis. dominated_by is not applicable - no Pareto
    point, no cost claim.
  - >-
    BOOLEAN IS NOT PRIME-FIELD. The SIG/DREG lineage is boolean; the ECDLP
    target is prime-field. A repaired boolean d_reg model DOES NOT TRANSFER,
    and every citation toward prime-field cost must carry that gap explicitly.
    KN-OPEN-002 is NOT closed by a model validated at n <= 14; a growth law
    needs the growth range, which this ladder does not reach.
  - >-
    INSTRUMENT FINDING, NOT MECHANISM FINDING. Nothing here supports or
    weakens H-SIG-001, H-DREG-001, or any hypothesis about the Semaev syzygy
    cascade. It is about the NULL, which is the instrument. EV-STR-003 and
    EV-DS-004 are this programme's own precedents for keeping that
    distinction. Phi predicts NULL ranks; the sem's departure from Phi is the
    residual Phi is designed NOT to predict, and a miss on a sem number is
    therefore never a falsification of Phi.
  - >-
    THE TWO "COMMITTED NUMBERS" ARE NOT TWO INDEPENDENT CONSTRAINTS, AND
    SAYING OTHERWISE WOULD OVERSTATE THE TEST. 17,947 = 156,520 - 138,573 is
    the SEM's deficit against a null baseline that itself validated exactly at
    sr_pred; rank_sem = 138,573 was already the committed BATCH-002 anchor
    (results.json admission metric rank_sem_anchor_138573_unchanged) and
    sr_pred = 156,520 was already committed. The only new information in
    17,947 is that rank(null|sem_support) = sr_pred, i.e. that the ARM-P
    DEFECT IS ZERO - which EV-DREG-008 states itself ("the upper-interval case
    rank(null|sem_support)=sr_pred"). The gate is therefore stated on the two
    NULL-side numbers 7,110 and 0, which are genuinely independent, and
    17,947 is carried as a derived consistency check.
  - >-
    A Stage-1 PASS is a pass by ONE OF THREE pre-declared candidates and must
    always be reported with that multiplicity. It authorizes Stage 2 and
    nothing else; it is not evidence for Phi until the ladder confirms it, and
    it may never be cited as validating any d_reg-derived cost.
  - >-
    A Stage-1 FAIL closes exactly the tested family - the untruncated
    boolean/Koszul series with field equations carried, plus the up-closure
    law, under three canonical collapse conventions, at the four gate cells.
    It does NOT establish that no closed form exists. Forward guidance is
    mandatory: the residual mechanism of the 7,110 defect remains OPEN and the
    negative names it as such.

