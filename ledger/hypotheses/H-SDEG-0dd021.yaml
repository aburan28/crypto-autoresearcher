hypothesis:
  id: H-SDEG-0dd021
  question_id: RQ-SDEG-001

  statement: >-
    SCOPE: boolean chained Semaev (t = 3, ti = 0) Macaulay rank at degrees D in
    {5, 6}, sizes n <= 14, exact GF(2) rank, one instrument lineage. CLAIM TIER
    toy. NO ATTACK, NO EXPONENT, NO PRIME-FIELD TRANSFER.
    The recorded D6 rank defect of the boolean chained-Semaev NULL objects is
    produced by exactly two computable ingredients and nothing else: (i) the
    UNTRUNCATED boolean/Koszul Hilbert series with the field equations
    x_i^2 = x_i carried rather than absorbed, and (ii) the up-closure column
    law (EV-SIG-006) applied to the EQUATION supports, which lowers the
    effective freeze degree below the full-support freeze degree. The
    consequence, and the whole content of the hypothesis, is that WHERE THE
    SUPPORT RESTRICTION IS APPLIED DECIDES THE DEFECT: a null whose EQUATIONS
    are support-constrained (arm R) freezes early and shows a defect, while a
    full-support null whose MACAULAY COLUMNS are merely deleted (arm P) does
    not freeze and shows defect zero. One parameter-free closed form Phi,
    frozen before any evaluation, must therefore return BOTH committed n = 12
    D = 6 null numbers - 7,110 for the arm-R column-matched null (EV-SIG-008,
    seed 2) and 0 for the arm-P support-restricted null (EV-DREG-008 /
    TASK-20260731-016, seed 2026) - with no parameter fitted to either, and
    must simultaneously reproduce the two committed zero-defect controls
    (n = 12 D = 5 arm R, extra 0) and the n = 9 D = 6 full-support saturation
    (rank 31,179 = ncols - |V|). If no frozen candidate does, the deliverable
    is a NAMED NO-GO: the untruncated-series-plus-up-closure family cannot
    supply a usable d_reg baseline at D >= 6 over the tested n range, stated
    with its exact boundary.

  mechanism: >-
    DERIVED IN-REPO. Primary sources for semi-regular boolean Hilbert series
    (Bardet-Faugere-Salvy) are UNREACHABLE from this environment; every
    recalled form below is a CANDIDATE TO TEST, never an authority, and is
    labelled so. What follows was re-derived here and checked against
    committed numbers.

    STRUCTURE OF THE FAMILY. The pinned builder (semaev_tree.py, read and
    verified in research/dreg-linear-law/scripts/dreg_crypto_cost_model.py)
    gives, at t = 3: k(n) = ceil(n/3), nb(n) = n + 3*k(n) boolean variables,
    n equations of degree 2 and n of degree 3. nb = 2n ONLY when 3 | n; off
    the lattice nb = 18/22/23/24/28/29 at n = 9/10/11/12/13/14. Any closed
    form written with nb = 2n is wrong off-lattice.

    INGREDIENT (i) - FIELD EQUATIONS CARRIED, NOT ABSORBED. The ambient object
    is the boolean ring B = F_2[x_1..x_nb]/(x_j^2 - x_j), whose Hilbert series
    is (1+z)^nb - this is the FIRST place x_j^2 = x_j is carried; it is not a
    denominator to be absorbed into a power of (1-z). For each equation f_i of
    degree d_i, squaring is Frobenius in B, so f_i^2 = f_i identically, i.e.
    f_i*(f_i + 1) = 0 is a TRIVIAL SYZYGY in degree 2*d_i. The Koszul factor is
    therefore (1 - z^{d_i})/(1 - z^{2 d_i}) = 1/(1 + z^{d_i}) - this is the
    SECOND place the field equations are carried. Hence
      H_n(z) = (1+z)^{nb(n)} * (1+z^2)^{-n} * (1+z^3)^{-n},  h_k = [z^k] H_n(z),
    UNTRUNCATED. The legacy prediction applies a TRUNCATION CONVENTION:
    h_k^+ = h_k while every h_j > 0 for j <= k, and 0 thereafter; the freeze
    degree is phi_full(n) = min{k : h_k <= 0}, and
      sr_pred(n, D) = N(nb, D) - sum_{k<=D} h_k^+,  N(nb,D) = sum_{j<=D} C(nb,j).
    THE TRUNCATION IS A MODELLING CONVENTION, NOT A PROPERTY OF THE SYSTEM.
    That is the suspect.

    INGREDIENT (ii) - UP-CLOSURE APPLIED TO THE EQUATIONS. EV-SIG-006
    machine-verified, with zero cancellation or parity deviation, that the
    reachable column set is the up-closure of the equation supports with
    degree slack:
      Cols_F(D) = { m : exists i, exists m' in supp(f_i), m' | m,
                        deg(m) - deg(m') <= D - d_i }.
    Write a_k for its degree-k count, A = sum_{k<=D} a_k, u_k = C(nb,k) - a_k.
    Every committed cell has u_k = 0 for k < D and the whole deficiency in
    degree exactly D (n = 9: 1,584 at D5, 1,848 at D6; n = 12: 16,018 at D6
    seed 2, 16,016 at D6 seed 2026, the latter committed as
    deleted_degree_histogram_equals_6_16016). Applying the same Koszul
    denominator to the restricted numerator A_F(z) = sum_k a_k z^k gives
      S_{n,F}(z) = A_F(z) * (1+z^2)^{-n} * (1+z^3)^{-n},  s_k = [z^k] S_{n,F},
    and, because the deficiency sits in the top degree where the denominator's
    constant term is 1,
      s_k = h_k for k < D,   s_D = h_D - u_D.
    TWO CONSEQUENCES, both derivations rather than fits.
    (a) SUPPORT-INDEPENDENCE OF sr_pred IS A THEOREM IN THIS MODEL:
        A - sum_{k<=D} s_k = N(nb,D) - sum_{k<=D} h_k, so an untruncated
        restricted prediction equals the untruncated full prediction. This is
        exactly the property GOAL-DREG-001 asserts of sr_pred, recovered here
        rather than assumed.
    (b) THE EFFECTIVE FREEZE DEGREE FALLS. phi_F = min{k : s_k <= 0} can be
        strictly below phi_full because s_D = h_D - u_D. This IS the
        "below-freeze collapse in the top sextic columns" EV-SIG-008 names and
        leaves unexplained: a cell can sit below the FULL-SUPPORT freeze
        degree while sitting AT the SUPPORT-RESTRICTED one.

    THE ARM RULE (HEUR-BF-3), WHICH IS THE ENTIRE DISCRIMINATING CONTENT. The
    Koszul denominator models relations among the EQUATIONS; the numerator
    models the space the equations actually occupy. Deleting columns from an
    already-built Macaulay matrix does not change the equations. Therefore:
      ARM P (matrix-projected: full-support SYSTEM, columns deleted afterwards)
        uses h, and the only effect available is a generic-position projection
        loss:  rank_P = sr_pred(n,D) - max(0, sr_pred(n,D) + u_D - N(nb,D)).
      ARM R (system-restricted: the EQUATION supports are themselves
        constrained, e.g. by safe pools plus seeded greedy set-cover) uses s,
        and is subject to the collapse rule at phi_F.
    EV-SIG-008's N1 is arm R (its supports were constructed). CTRL-B
    (TASK-20260731-016) is arm P: results.json records
    arm = null_restricted_to_sem_support, deleted_set_equals_null_minus_sem,
    the null system hash equal to the CTRL-A pin, and the restricted column
    index set derived from the full one. IF THE ARM RULE IS WRONG, THE TWO
    COMMITTED n = 12 D6 NULL RANKS CANNOT BOTH BE PRODUCED BY ANY MEMBER OF
    THIS FAMILY, AND THAT IS A CLEAN RESULT.

    WHAT IS NOT DERIVED, AND IS THE WEAKEST LINK. The collapse rule at and
    above phi_F is NOT derived. Three canonical conventions are frozen as the
    complete candidate list (C1/C2/C3 in assumptions); each is
    single-valued and parameter-free; the list is closed before evaluation and
    every member is evaluated and reported. A pass by one of three
    pre-declared candidates is weaker than a pass by one of one and must be
    reported with that multiplicity attached.

  assumptions:
  - >-
    FROZEN CLOSED FORM Phi, part of the contract, stated completely and with
    every parameter fixed BEFORE any evaluation.
    (1) k(n) = ceil(n/3); nb(n) = n + 3*k(n); degrees = n twos and n threes.
    (2) N(nb,D) = sum_{j<=D} C(nb,j).
    (3) nrows(n,D) = n*N(nb,D-2) + n*N(nb,D-3).
    (4) H_n(z) = (1+z)^{nb(n)} * (1+z^2)^{-n} * (1+z^3)^{-n}; h_k = [z^k] H_n,
        UNTRUNCATED. h_k^+ = truncate-positive. phi_full = min{k : h_k <= 0}.
        sr_pred(n,D) = N(nb,D) - sum_{k<=D} h_k^+.
    (5) Cols_F(D) = up-closure of the equation supports with degree slack;
        a_k, A = sum_{k<=D} a_k, u_k = C(nb,k) - a_k.
    (6) S_{n,F}(z) = A_F(z) * (1+z^2)^{-n} * (1+z^3)^{-n}; s_k = [z^k] S_{n,F};
        equivalently s_k = h_k for k < D and s_D = h_D - u_D whenever u_k = 0
        for k < D (verified at every committed cell; VERIFIED PER CELL, never
        assumed). phi_F = min{k : s_k <= 0}.
    (7) ARM P: rank_P = sr_pred(n,D) - max(0, sr_pred(n,D) + u_D - N(nb,D)).
    (8) ARM R: rank_R = A - Q, with Q given by exactly one of the three frozen
        collapse rules:
          C1 HARD_FREEZE      Q = sum_{k < phi_F} s_k
          C2 SIGNED_CARRY     Q = max(|V|, sum_{k <= D} s_k)
          C3 VARIETY_COLLAPSE Q = |V| if D >= phi_F, else sum_{k <= D} s_k
    (9) deficit = sr_pred(n,D) - rank; rankK_D is modelled as nrows - sr_pred
        (the identity EV-SIG-008 verified for arm R at n = 12: rankK6_null =
        26,792 = 183,312 - 156,520), hence extra = deficit under Phi.
    NO OTHER DEGREE OF FREEDOM EXISTS. Any adjustment to (1)-(9) after any
    Stage-1 or Stage-2 number has been observed requires a versioned
    protocol_amendment with confirmatory_status exploratory_only, and is never
    an edit. EV-IC-002 records this exact lane retracting a support verdict
    because a criterion was revised after the prior criterion was observed to
    fail.
  - >-
    BASELINE-REPRODUCTION AUDIT ALREADY RUN BY THE COORDINATOR (inventor
    protocol section 8, audit 1; cheap, pre-compute, and PASSED). Clauses
    (2)-(4) reproduce, exactly, every committed structural number the two
    lineages record: sr_pred(9,3..6) = 180 / 1,674 / 9,504 / 28,068;
    HF(n=9) = [1, 18, 144, 645, 1,566, 738, 0] with frozen quotient 3,112 and
    phi_full(9) = 6; sr_pred(12,3..6) = 312 / 3,834 / 29,418 / 156,520;
    N(24,6) = 190,051 (committed independently as ncols_null_full in
    TASK-20260731-016 results.json); nrows(9,6) = 45,324; nrows(12,6) =
    183,312; nrows(12,5) = 31,512. It also reproduces both endpoints of
    CTRL-B's own PREREGISTERED bracket restricted_null_rank = [140,504,
    156,520]: 140,504 = A - sum_{k<=6} h_k (restricted numerator, no
    projection) and 156,520 = sr_pred (arm-P rule). That the prior team
    pre-registered exactly these two endpoints is independent corroboration of
    the skeleton's structure and is NOT evidence for any collapse rule.
  - >-
    THE COMMITTED NUMBERS ARE READ AS-IS AND ARE NOT RE-DERIVED TO MAKE THEM
    AGREE. 7,110 = 156,520 - 149,410 is EV-SIG-008's arm-R column-matched null
    at n = 12 seed 2. 0 = 156,520 - 156,520 is TASK-20260731-016's arm-P
    support-restricted null at n = 12 seed 2026. A record that reconciles them
    by reinterpreting either measurement is inadmissible.
  - >-
    PROVENANCE ASYMMETRY, CARRIED NOT HIDDEN. The 7,110 anchor has the WEAKEST
    provenance of any number in the gate: EV-SIG-008's own
    artifact_absence_statement records that its run directories are on a
    pre-current manifest schema or absent, and that
    experiments/EXP-SIG-008/specification.yaml is prose in a .yaml file, so
    the experiment does not register - "no claim in this record is bound to a
    frozen protocol or to a reproducible run receipt through the ledger". The
    figures survive via the live transcript and git branch
    exp-sig-008-artifacts commit d1d36dd. The 0 anchor, by contrast, carries a
    schema-complete results.json with chunk coverage, system hashes and set
    hashes. Stage 2 must RE-MEASURE the n = 12 arm-R cell; a Stage-1 pass
    against 7,110 is a pass against a transcript-preserved number, and every
    downstream statement says so.
  - >-
    Rank computations are exact over GF(2) with a reproducible pivoting order,
    a persisted system hash, chunked execution under a fresh write_scope, and
    per-chunk receipts. EV-DREG-004 destroyed a checkpoint at 194,000/778,394
    columns (24.93%) with a measured carrier-codec bottleneck (pickle unpickle
    198.6 s per 44 blocks vs 0.7 s projected raw). Chunking is REQUIRED, not
    advisory, so a crash costs a chunk rather than a cell; a crash is an
    infrastructure outcome and never mathematical evidence (AGENTS.md rule 5).

  proof_search_map:
    bottleneck: >-
      sr_pred(n, D) as the rank baseline. Every SIG and DREG deficit, and
      every d_reg-derived cost prediction at D >= 6, is measured against it.
      EV-SIG-008 falsified its "null validates at D6 for n >= 12" prediction
      at the exact cell recorded as the decisive test. Repairing or condemning
      this one step is upstream of GOAL-SDEG-001, GOAL-SIG-001 and
      GOAL-DREG-001 and consumes none of their budgets.
    baseline_embedding:
      parameter_slice: >-
        D <= 5 at n = 9 and D <= 5 at n = 12, where sr_pred is committed-valid
        (extra = 0 and rank == sr_pred at D3/D4/D5 for the pinned nulls), plus
        the full-support n = 12 D6 null where rank == sr_pred == 156,520.
      reproduction_check: >-
        SYMBOLIC, and PASSED before this record was written. Clause (4) of Phi
        reproduces sr_pred(9,3..6), sr_pred(12,3..6), HF(n=9), the frozen
        quotient 3,112, N(24,6) = 190,051, nrows(9,6) = 45,324,
        nrows(12,6) = 183,312 and nrows(12,5) = 31,512 exactly. A curve that
        merely resembles the baseline is not an embedding; these are exact
        integer identities against committed values.
    observation_collision:
      observable: >-
        The single integer extra_D (equivalently deficit_D) per cell, plus the
        categorical saturation shape (saturating at ncols - |V| versus
        collapsing below it).
      distinct_preimage_search: >-
        A COLLISION EXISTS AND IS COMMITTED, and it is the reason this
        hypothesis has content. At the SAME n = 12, D = 6, with essentially
        the same column set (174,033 vs 174,035) and the same degree histogram
        {2: 12, 3: 12}, two null objects give ranks 149,410 (EV-SIG-008 N1,
        seed 2) and 156,520 (TASK-20260731-016 CTRL-B, seed 2026). The
        observable is therefore NOT determined by (n, D, support histogram)
        alone. This directly falsifies the identifiability HEUR-BF-1 assumes
        UNLESS a further condition separates them. The arm rule (HEUR-BF-3) is
        the proposed separating condition, and the gate is its test. A second,
        weaker collision: EV-SIG-006's N1 at n = 9 D6 has rank 28,939 with
        ncols 29,332 and |V| = 0, i.e. 393 BELOW ncols - |V|, while the
        full-support N0 sits exactly at ncols - |V| = 31,179.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        Replace the ambient numerator (1+z)^{nb} by the up-closure column
        series A_F(z), moving the hypothesis into a model where it is an exact
        integer equality (rank = A - Q) rather than an approximate fit.
      predicted_gain: >-
        Turns "the null misbehaves at D6" into two checkable integers per
        cell, and makes the two null families structurally distinguishable by
        the single quantity s_D = h_D - u_D. Encoding, completeness,
        soundness and transfer obligations are listed under proof_obligations;
        the transfer obligation to prime fields is DECLARED UNMET, not
        deferred.
    - transform: observable_fiber
      proposed_object: >-
        Hold the observable (extra_6) fixed and vary the forgotten structure:
        arm P versus arm R at identical (n, D, a_k). The intrinsic invariant
        proposed to distinguish them is the sign of s_D under the arm's own
        numerator.
      predicted_gain: >-
        If the invariant does not distinguish the pair, the family has not
        identified the load-bearing structure and F1 fires at zero compute.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER: EXISTS one closed form Phi (fixed, parameter-free,
      frozen before evaluation) FORALL cells (n, D, support family F, arm,
      seed) in the declared boundary, such that the predicted rank matches the
      measured rank within the declared tolerance. The witness Phi may NOT
      depend on n, D, F, arm or seed. The weaker order - FORALL cells EXISTS a
      Phi - is trivially satisfiable and is explicitly NOT claimed and NOT
      admissible as a result. Seed uniformity is a separate obligation carried
      by HEUR-BF-1; if seed-dependence is measured, the FORALL over seeds
      collapses to a distribution statement and the claim must be restated as
      such rather than retained.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: a scoped, toy-tier, BOOLEAN-ONLY rank-prediction formula for
        the chained-Semaev t = 3 family, validated at n <= 14 and D <= 6, on
        one instrument lineage, at two or three seeds per cell. It cannot
        certify a prime-field degree of regularity, cannot move any exponent,
        cannot bound any solver's cost at cryptographic scale, and cannot
        close KN-OPEN-002 (whose question is the GROWTH of the solving degree
        over PRIME fields; a growth law needs the growth range, which n <= 14
        does not reach).
      nearby_object_control: >-
        THE FULL-SUPPORT GENERIC NULL AT n = 12, D = 6 (rank_null_full =
        156,520 = sr_pred, committed in TASK-20260731-016 anchors and in
        GOAL-DREG-001's BATCH-002 checkpoint "null rank=sr_pred=156520,
        deficit 0 => calibrated"). It is the closest object to the arm-R null:
        same n, same D, same degree histogram, same ring, same lineage - and
        the hoped-for conclusion FAILS there, its defect being exactly 0. Any
        model that produces 7,110 at arm R must produce exactly 0 here, or it
        is responding to the column count rather than to the support
        constraint on the equations. A SECOND nearby-object control, also
        committed and also zero-compute: n = 12, D = 5, arm R, where the
        column-matched null's extra is 0 and its rank is exactly
        sr_pred = 29,418 - the model must predict 0 there while predicting
        7,110 one degree higher on the SAME object. A model that cannot hold
        those two apart has not identified the freeze mechanism.
    proof_obligations:
    - claim: >-
        Phi reproduces sr_pred, nrows and the column histograms at every
        committed cell.
      responsibility: baseline
    - claim: >-
        s_k = h_k for k < D and s_D = h_D - u_D, verified per cell rather than
        assumed (it depends on u_k = 0 for k < D, which is a measured property
        of the up-closure, not a theorem).
      responsibility: correctness
    - claim: >-
        The arm classification of every cited cell is established from
        committed artifacts (system hash provenance and deleted-set
        derivation), not inferred from the result.
      responsibility: interface
    - claim: >-
        The collapse rule is single-valued and parameter-free, the candidate
        list is closed before evaluation, and every member is reported.
      responsibility: strictness
    - claim: >-
        Rank measurement is exact, chunk coverage is exactly-once, and every
        reported rank equals the sum of per-chunk new pivots.
      responsibility: correctness
    - claim: >-
        Nothing here transfers to prime fields; the boolean-to-prime gap is
        stated on every citation.
      responsibility: scope
    - claim: >-
        n = 13 D = 6 dominates the ladder cost; a truncated ladder reports what
        it covered rather than failing.
      responsibility: runtime
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. There is NO complexity claim of any kind. This is a
    MODEL REPAIR of a measurement baseline. A validated Phi makes existing
    d_reg predictions usable; it makes no system easier to solve, moves no
    exponent, and adds no attack. Pollard rho remains the ECDLP baseline and
    sota_delta is zero on every attack axis (time, memory, data, queries,
    advice). dominated_by is not applicable: no Pareto point is claimed.

  heuristic_assumptions:
  - id: HEUR-BF-1
    formal_statement: >-
      For every cell in the declared boundary, extra_D is a DETERMINISTIC
      function of (n, D, the equation-support up-closure data {a_k}, the arm,
      and |V|), and in particular is INVARIANT under the random seed used to
      draw the system at fixed support data. Formally: FORALL n, D, F, arm,
      FORALL seeds s, s' admissible for that cell,
      extra_D(n,D,F,arm,s) = extra_D(n,D,F,arm,s').
    random_model_justification: >-
      NONE THAT SURVIVES SCRUTINY, AND THIS IS RECORDED AS A WEAKNESS RATHER
      THAN PAPERED OVER. The usual argument - a random system of fixed degree
      histogram occupies general position, so its Macaulay rank is a.s. the
      maximum compatible with the forced syzygies - predicts concentration,
      not determinism, and says nothing about the size of the fluctuation. The
      committed record already shows fluctuation: at n = 12 D6 the sem's rank
      is 138,570 at seed 2 (EV-SIG-008) and 138,573 at seed 2026
      (TASK-20260731-016 anchors), with ncols 174,033 vs 174,035 and deleted
      columns 16,018 vs 16,016. The support data itself is seed-dependent, so
      the "fixed support" antecedent is not automatically satisfiable across
      seeds.
    supporting_results: []
    validation_experiment_ids: [EXP-SDEG-f7faa8]
    falsification_condition: >-
      MEASURED FIRST, AND REPORTED BEFORE ANY MODEL ERROR. At every core cell,
      at least two seeds, and the seed-to-seed spread of extra_D is reported
      BEFORE Phi's error at that cell is reported. IF THE SPREAD IS COMPARABLE
      TO OR LARGER THAN THE MODEL ERROR, THE MODEL IS FITTING NOISE AND MUST
      BE REPORTED AS SUCH, not as a fit; the premise that a deterministic
      closed form exists is then wrong and the correct object is a
      distribution, not a formula. Concretely: if spread >= model error at any
      core cell, stopping rule SR6 fires.
  - id: HEUR-BF-2
    formal_statement: >-
      The truncation convention at the freeze degree is the responsible
      discrepancy: the family
      { A - Q : Q in {C1, C2, C3} applied to S_{n,F} } contains the true rank
      law for arm R over the declared boundary.
    random_model_justification: >-
      Derived from EV-SIG-006's own committed diagnosis - that D6 is the
      freeze degree of the semi-regular Hilbert series at n = 9, that the
      model's frozen quotient (3,112 dims) is unrealizable by any generic
      boolean system, and that measured variety sizes there are 0/1/6. That
      diagnosis is committed and independently reviewed. THE INFERENCE FROM
      "THE CONVENTION IS SUSPECT" TO "THIS PARTICULAR THREE-MEMBER FAMILY
      CONTAINS THE TRUTH" IS NOT SUPPORTED AND IS THE WEAKEST LINK IN THIS
      RECORD.
    supporting_results: []
    validation_experiment_ids: [EXP-SDEG-f7faa8]
    falsification_condition: >-
      The Stage-1 zero-compute gate IS this heuristic's test. If no frozen
      candidate satisfies G1 and G2 and G3 and G5 simultaneously, HEUR-BF-2 is
      refuted over the declared boundary and the ladder is not authorized on
      any of C1/C2/C3. Cost of being wrong: zero compute.
  - id: HEUR-BF-3
    formal_statement: >-
      ARM RULE. The Koszul denominator prod_i (1 + z^{d_i})^{-1} is a property
      of the EQUATIONS, and the series numerator is the space the equations
      occupy. Therefore a null built by deleting Macaulay columns from a
      full-support system (arm P) is predicted from H_n with a
      generic-position projection loss, while a null whose EQUATION supports
      are themselves constrained (arm R) is predicted from S_{n,F} with the
      collapse rule. The classification of a cell into P or R is determined by
      committed construction artifacts and never by its measured rank.
    random_model_justification: >-
      Elementary and derived in-repo: a rank-r subspace in general position
      inside an N-dimensional space projects onto a coordinate subspace of
      codimension u with rank min(r, N - u), giving the loss
      max(0, r + u - N). This is a statement about projections and requires no
      literature. What it does NOT justify is that a support-CONSTRAINED
      system behaves like a projected one - the hypothesis asserts they
      differ, and that assertion is the content.
    supporting_results: []
    validation_experiment_ids: [EXP-SDEG-f7faa8]
    falsification_condition: >-
      Gate condition G2. If the frozen Phi does not return exactly 0 for the
      arm-P cell at n = 12 D6 (rank 156,520), or if a candidate returns the
      same value for arm P and arm R at that cell while the committed ranks
      differ by 7,110, the arm rule is refuted and no member of the family can
      produce both committed numbers.

  structural_ingredients:
  - description: >-
      Boolean semi-regular Hilbert series and the degree-of-regularity
      framework of Bardet, Faugere and Salvy.
    citation: >-
      NOT RETRIEVED AND NOT VERIFIABLE FROM THIS ENVIRONMENT. Recorded as
      literature_unverified exactly as IDEA-20260803-202a15 recorded it. The
      form used here was DERIVED IN-REPO and validated against committed
      numbers; it is a CANDIDATE TO TEST, never an authority. No citation is
      asserted.
    role: candidate series form for the null baseline
  - description: >-
      Column-formation (up-closure) law: cols(D) = up-closure of the equation
      supports with degree slack, with zero cancellation or parity deviation.
    citation: >-
      ledger/evidence/EV-SIG-006.yaml, observation (1), machine-checked at
      n = 9 seed 1 across D3..D6 on both arms.
    role: converts equation supports into the exact column series a_k
  - description: >-
