# H-MONO-a82b4a
# Arithmetic monodromy of the four signed sums on the symmetric base.
# H-MONO-0b3def reads the four input points and is not edited.
hypothesis:
  id: H-MONO-a82b4a
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  source_idea: IDEA-20261005-ddbf31
  experiment_id: EXP-MONO-1da7be
  specified_at: '2026-10-05'
  status: approved
  proposed_by: coordinator
  approved_by_decision: DEC-20261005-f31688
  title: >-
    On four ordinary curves at p=101 the signed-sum fibre has
    Frobenius image the wreath group of order 8
  statement: >-
    Fix p=101 and m=3. Let E be y^2 = x^3 + A x + B over F_p.
    The ordinary panel is (A, B) = (1, 1), (2, 3), (4, 1), (1, 2),
    with point counts 105, 96, 112, and 100. The artifact panel is
    (0, 1), which has j=0 and 102 points, and (1, 0), which has
    j=1728 and 100 points. The curve (0, 1) is supersingular.
    For e1, e2 in F_p let {x(P), x(Q)} be the roots of
    T^2 - e1 T + e2 = 0, and let Psi be the unordered set
    {P+Q, -(P+Q), P-Q, -(P-Q)} when those four points are distinct.
    The sample is the first 64 indices k >= 0 for which both Psi
    and the four input points over the same pair are distinct.
    The index map is u = (37 k + 11) mod p^2, e1 = u mod p,
    e2 = floor(u / p). Square roots are taken in
    F_p[z]/(z^8 + 2). The design-session count, which is not a
    run, gives Frobenius image order 8 on Psi for every ordinary
    curve, with no permutation that breaks the inverse-pair
    partition, and with 15, 15, 24, and 14 samples of cycle type
    4. The same orders on the artifact curves are 8 and 8, with
    15 and 13 four-cycles. Those two curves are not in the
    ordinary tally. The input-point control has order 8 on every
    curve. A separate null of 64 separable quartics has 20
    factorizations of type 3+1.
  mechanism: >-
    The inverse-pair partition of Psi is the candidate block
    system. Its setwise stabiliser in S_4 is the wreath product
    of order 8. A sample that only tests whether the discriminant
    is a square in F_p drops the swap of the two summands and
    collapses this image to a group of order dividing 4. Taking
    the square root in F_{p^8} keeps that class. The input fibre
    of H-MONO-0b3def is the control that this sampler still sees
    a group of order 8.
  assumptions:
    - Characteristic is 101, which is greater than 3, and each panel polynomial is squarefree.
    - A specialization is good only when both four-point sets are distinct and neither sum is the point at infinity.
    - The artifact curves are reported and are excluded from the ordinary tally.
    - No factor base is built and no discrete logarithm is solved.
  proof_search_map:
    bottleneck: >-
      Whether Frobenius on the signed-sum fibre generates a group
      of order 8, or only a proper subgroup of the wreath product.
    baseline_embedding:
      parameter_slice: >-
        The same prime and the three curves (1, 1), (2, 3), and
        (4, 1) used by EXP-MONO-4c7479. That contract reads the
        input fibre. This one reads Psi. The fourth ordinary
        curve is (1, 2).
      reproduction_check: >-
        On each frozen sample the input fibre must generate a
        group of order 8. A smaller input group invalidates the
        cell.
    observation_collision:
      observable: >-
        A Frobenius permutation of Psi that does not preserve
        the inverse-pair partition.
      distinct_preimage_search: >-
        Two ordinary curves in the panel whose Psi images have
        different orders.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The four signed sums, rather than the four input
          points over the same unordered pair.
        predicted_gain: >-
          Decides the wreath reading for this panel. No
          decomposition exponent moves.
    quantifier_order: >-
      For each of the six curves, for each of 64 good base
      points, one Frobenius permutation in S_4.
    method_ceiling:
      strongest_certifiable_claim: >-
        The arithmetic monodromy generated by this frozen
        sample at p=101. Not a statement for every ordinary j,
        and not generation by inertia.
      nearby_object_control: >-
        The input fibre on the same base points, and the two
        artifact curves, which are tallied apart from the
        ordinary panel.
    proof_obligations:
      - claim: Each ordinary Psi image has order 8
        responsibility: correctness
      - claim: No ordinary permutation breaks the inverse-pair partition
        responsibility: correctness
      - claim: The input control has order 8 on every curve
        responsibility: baseline
  predictions:
    - metric: order of the Frobenius group on Psi
      direction: different
      minimum_effect: >-
        Order 8 against an order dividing 4. The ordinary panel
        is predicted at order 8 on all four curves.
    - metric: count of cycle type 4 on Psi
      direction: different
      minimum_effect: >-
        The ordinary counts are 15, 15, 24, and 14. Zero
        four-cycles on an ordinary curve would be the proper
        subgroup reading.
  falsification_conditions:
    - >-
      A Psi permutation that breaks the inverse-pair partition
      falsifies containment of that image in the wreath group.
    - >-
      Psi order 8 on all four ordinary curves, with the input
      control at order 8, falsifies the claim that this panel
      contains an exceptional ordinary curve. It does not prove
      the image is the wreath group for every ordinary j.
    - >-
      Psi order dividing 4 on an ordinary curve, with input
      order 8, the null quartic emitting type 3+1, and point
      counts as stated, falsifies the full-wreath reading on
      this panel.
  interpretation_limits:
    - p=101 and m=3 only. No transfer to another prime or to m greater than 3.
    - The artifact curves do not count as ordinary exceptional loci.
    - Order 8 on these four curves does not empty the exceptional locus outside the panel.
    - This sample does not generate the image by inertia. That comparison is out of scope.
  test_boundary: >-
    One prime, six explicit curves, 64 base points per curve,
    and one null of 64 quartics. GOAL-MONO-001 is not
    status-changed by this record.
