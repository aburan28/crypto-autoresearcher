# =============================================================================
# H-SSIQ-4cae0e — specified from IDEA-20261006-b6ce60 (bytes copied
# unchanged from origin/design/ssi-2f5c3f-cartier). Question
# RQ-SSIQ-9702af. The prediction under test is the idea's own: at the
# smallest prime p >= 5500, the curve-side and quaternion-side multisets
# of minimal degrees E -> E^{(p)} are equal, and the curve-side
# 5-smooth fraction differs from 10/14 by more than 0.15. A finished
# census whose multisets differ, or whose absolute gap is at most 0.15,
# is the concrete negative. This record does not assert that the
# multisets are equal and does not assert that the gap exceeds 0.15.
# =============================================================================
hypothesis:
  id: H-SSIQ-4cae0e
  question_id: RQ-SSIQ-9702af
  source_idea_ids:
    - IDEA-20261006-b6ce60
  added: '2026-10-06'
  status: approved
  proposed_by: coordinator
  title: >-
    Curve-side and quaternion-side minimal degrees agree at the first
    prime past 5500, and the 5-smooth fraction misses 10/14
  statement: >-
    Let p be the smallest prime at least 5500. The frozen candidate is
    5501, and EXP-SSIQ-821a49 rechecks primality before any degree is
    scored. Then X = floor((p/2)^{1/3}) equals 14, because 14^3 = 2744
    and 15^3 = 3375, so every prime from 5500 through 6749 has this
    same X. Let S be the set of supersingular j-invariants in F_{p^2}.
    For each j let d(j) be the least degree of a separable isogeny from
    a curve of that j to a curve of j-invariant j^p. Let Q be the same
    multiset of integers read from maximal orders in the quaternion
    algebra ramified at p and infinity, one order per j, taking the
    least value of Nrd(alpha)/p on the unique two-sided ideal of
    reduced norm p. The idea's prediction is that those two multisets
    are equal, and, separately, that the fraction of curve-side values
    that are 5-smooth differs from 10/14 by more than 0.15. The ten
    5-smooth integers in {1,...,14} are 1, 2, 3, 4, 5, 6, 8, 9, 10, and
    12. A finished census with equal cardinality on both sides, controls
    passing, and either a nonempty symmetric difference or an absolute
    gap of at most 0.15, is the concrete negative. No exponent
    improvement is claimed. The time exponent stays the archived
    p^{1/3+o(1)} under Heuristic 1.
  mechanism: >-
    The tracked object is the integer d_min(E -> E^{(p)}). It is read
    either as an isogeny degree, through modular polynomials Phi_ell
    for ell at most 14, or as a reduced norm on the two-sided ideal of
    norm p. The two readings are the two sides of the Deuring isometry
    stated in the archived paper's Section 4. Equal multisets say the
    readings match at this one prime. The 5-smooth fraction is then
    compared with the exact finite ratio 10/14, which is what a uniform
    integer in {1,...,14} would have, and which Heuristic 1 does not
    assert at X = 14. Neither outcome moves the exponent.
  assumptions:
    - >-
      Supersingularity is decided by a Hasse-invariant or supersingular
      polynomial test, not by scanning points of E(F_{p^2}). j^p is the
      j-invariant of the conjugate curve.
    - >-
      The least separable degree and the least Nrd/p are the two sides
      of the isometry quoted from the archived Section 4.
    - >-
      p remains below 6750, so X stays 14. If the smallest prime at
      least 5500 were at least 6750, the instance would be redefined
      and this claim would not be scored.
    - >-
      A Gal(F_{p^2}/F_p) pair is duplicated when a quaternion sampler
      emits only one order for the pair. Subfield j-invariants, those
      fixed by the p-power map, are kept and have degree 1.
  proof_search_map:
    bottleneck: >-
      Whether the curve-side degree and the quaternion norm are the
      same integer for every supersingular j at this p, and whether
      the 5-smooth fraction then sits more than 0.15 away from 10/14.
    baseline_embedding:
      parameter_slice: >-
        Archived Theorem 1.1 at p^{1/3+o(1)} time and memory under
        Heuristic 1. No endomorphism search is reproduced.
      reproduction_check: >-
        Recompute that 14^3 = 2744 is at most p/2 and 15^3 = 3375 is
        greater than p/2, and that trial division counts exactly ten
        5-smooth integers in {1,...,14}, before any fraction is scored.
    observation_collision:
      observable: >-
        The multiset of minimal degrees and the curve-side 5-smooth
        fraction.
      distinct_preimage_search: >-
        Two j-invariants with the same degree are one multiset entry
        with multiplicity, not a collision to be dropped. A quaternion
        order emitted once for a Gal pair is duplicated before the
        multisets are compared.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The integer Nrd/p on the two-sided ideal, as a second
          reading of the same degree.
        predicted_gain: >-
          An empty symmetric difference, or a finished difference of
          at least one integer.
    quantifier_order: >-
      For this single prime p, for every supersingular j in F_{p^2},
      the curve-side d(j) equals the quaternion-side norm for a
      matching of one order per j, as multisets, and the absolute
      difference between the curve-side 5-smooth fraction and 10/14
      is strictly greater than 0.15.
    method_ceiling:
      strongest_certifiable_claim: >-
        Agreement or disagreement of two finite multisets at one
        prime with X = 14, plus a gap from 10/14. Not a certificate
        of the isometry at SQIsign size and not an exponent movement.
      nearby_object_control: >-
        An ordinary curve y^2 = x^3 + x + a over F_p. The same degree
        search must not find an isogeny of degree at most 14 from
        that curve to its conjugate. A hit invalidates the search.
    proof_obligations:
      - claim: >-
          Equality of the two multisets is a comparison of integers,
          not an isogeny-path algorithm.
        responsibility: scope
      - claim: A gap from 10/14 at X = 14 does not move the 1/3 exponent.
        responsibility: scope
    not_applicable_reason: >-
      This is a finite census of integers at one prime. It does not
      propose a theorem, a new bound, a certificate family, a
      reduction, or a closure of Heuristic 1. The map audits that
      census only.
  rerandomization: >-
    No re-randomizing walk is used. The census is every supersingular
    j at one prime. Nothing pulls a discrete logarithm back to an
    input instance.
  asymptotic_claim:
    problem: supersingular OneEnd over F_{p^2}
    prior_best: >-
      archived Theorem 1.1, time and memory p^{1/3+o(1)} under
      Heuristic 1
    time_exponent: '1/3+o(1), unchanged; this hypothesis does not move it'
    memory_exponent: >-
      1/3+o(1) for that algorithm, unchanged. The census stores one
      integer per supersingular j.
    hidden_cofactor: >-
      The paper's u^{-u(1+o(1))} hides an o(1) in the success
      probability. A gap at X = 14 does not estimate that o(1).
    claim_kind: constant_factor
    claim_kind_note: >-
      The constant factor against the archived algorithm is 1.
      claim_kind is filled so the non-claim is explicit. A smoothness
      gap at X = 14 is not a runtime.
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        If d_min were a uniform random integer in {1,...,14}, its
        probability of being 5-smooth would be 10/14. Heuristic 1 of
        the archived paper asks for the Dickman tail u^{-u(1+o(1))}
        only as X goes to infinity inside a window on u that X = 14
        does not meet. The comparison uses the exact finite ratio,
        not that tail.
      random_model_justification: >-
        Exact count of 5-smooth integers in a fixed interval of
        length 14. Theorem 1.4 of the archived paper is the
        Canfield-Erdos-Pomerance / Dickman count in a window this X
        does not meet, and it is not used as support for 10/14.
      supporting_results: []
      validation_experiment_ids:
        - EXP-SSIQ-821a49
      falsification_condition: >-
        The curve-side 5-smooth fraction lies at most 0.15 away from
        10/14 after the multisets are equal and the controls pass.
        That observation is the negative for the uniform-model miss.
        It does not by itself make the multisets unequal, and an
        unequal multiset does not by itself create a gap above 0.15.
  structural_ingredients:
    - description: >-
        Heuristic 1 asks that the least degree E -> E^{(p)} be
        B-smooth with probability at least u^{-u(1+o(1))}. Theorem
        1.5 bounds that degree by (p/2)^{1/3}. Section 4 reads the
        degree as Nrd/p on the two-sided ideal of reduced norm p.
      citation: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
      provenance: retrieved
      verified_by: >-
        design session opened
        inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, including lines
        69-81, 177-218, and 242-252, on 2026-10-06
      role: degree ceiling, isometry, and the finite-ratio comparison
    - description: >-
        The same pattern is the program's exemplar: a structural
        bound, a smoothness heuristic, and a meet-in-the-middle. This
        hypothesis does not run that algorithm.
      citation: KN-TECH-055
      provenance: internal
      verified_by: >-
        design session opened knowledge/techniques/KN-TECH-055.md
        on 2026-10-06
      role: fence around treating the census as an algorithm
    - description: >-
        An isogeny walk does not find a weaker curve. This census
        does not walk from a public curve to a secret curve.
      citation: KR-RHO-755e35
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
        on 2026-10-06
      role: fence around isogeny-path readings
    - description: >-
        A generic algorithm on a prime-order group needs Omega of
        square root of the group order. This census is not a generic
        discrete-logarithm algorithm.
      citation: KR-RHO-13bf67
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
        on 2026-10-06
      role: unchanged generic exponent, different problem
    - description: >-
        Precomputation can move an online discrete logarithm to about
        l^{1/3} after an l^{2/3} table. This census builds no
        distinguished-point table.
      citation: KR-RHO-ea34b8
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-ea34b8.yaml
        on 2026-10-06
      role: fence around preprocessing tradeoffs
  reduction_chain:
    core_problem: toy census of minimal conjugate degrees at one prime
    corollaries: []
  predictions:
    - metric: size of the symmetric difference of the two d_min multisets
      direction: lower
      minimum_effect: the symmetric difference is empty
    - metric: absolute gap between the curve-side 5-smooth fraction and 10/14
      direction: higher
      minimum_effect: strictly greater than 0.15
  test_boundary:
    instances:
      - every supersingular j-invariant in F_{p^2} at the smallest prime p >= 5500
    parameters:
      p_candidate: 5501
      X: 14
      smoothness_bound: 5
      uniform_numerator: 10
      uniform_denominator: 14
      gap_threshold: '3/20'
    implementation: >-
      Enumerate supersingular j-invariants, compute least separable
      degrees by modular polynomials, compute least Nrd/p on one
      maximal order per j, and compare the multisets and the exact
      rational gap. No discrete-log search and no walk.
    budget:
      census: full
      maximum_runs: 1
  falsification_conditions:
    - >-
      The two multisets differ by at least one integer. That is the
      negative observation for the isometry check.
    - >-
      The curve-side 5-smooth fraction lies at most 0.15 away from
      10/14. That is the negative observation for the uniform-model
      miss.
    - A supersingular j in F_p has d(j) greater than 1.
    - The ordinary control curve has a conjugate isogeny of degree at most 14.
  interpretation_limits:
    - >-
      A gap above 0.15 at X = 14 does not falsify Heuristic 1 inside
      the paper's stated window on u. It only says the uniform model
      is a poor fit at this X.
    - >-
      Equal multisets at this p do not certify the isometry at
      SQIsign-sized p.
    - >-
      No exponent moves. A smooth fraction is not a runtime.
    - >-
      log2(p) at this prime is below the question's stated toy window
      of log2(p) in [20, 60]. No transfer into that window is assumed.
    - >-
      This prime is the idea's prime. It is not a second sample of
      the same claim at another X.
