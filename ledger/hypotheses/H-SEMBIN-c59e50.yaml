      citation: knowledge/literature/KN-LIT-327949.md
      provenance: internal
      verified_by: TASK-20260913-6519c9
      role: evidence the localisation is a property of the model family, not of one paper
  reduction_chain:
    core_problem: >-
      Which term of Semaev's two-stage balance carries the exponent constant
      c = 1.6986, and what a published removal of that term forces about the
      solving degree.
    corollaries:
      - problem: >-
          Whether GOAL-SEMBIN-cbf422's four named unrevisited choices (t, the
          subspace, the chain topology, the cofactor) can move the exponent.
        reduction_ref: >-
          Direct: none of them can, because each contributes O(log n) to the
          exponent while log2(m!) contributes Theta(sqrt(n ln n)). This answers the
          goal's central question in the negative for three of its four
          sub-objectives, by derivation and at zero compute cost.
        asymptotics_preserved: not_applicable
      - problem: >-
          Whether Semaev's Section 4.6 claim of independence from any first-fall
          assumption survives a published factor-base device.
        reduction_ref: >-
          Direct: the independence is purchased by the m! and evaporates when the
          m! is removed, so eq. (17) is a statement about the symmetry loss rather
          than about the degree.
        asymptotics_preserved: >-
          'not applicable: the conclusion is that the exponent is not identified by
          the degree, which is a non-identifiability statement rather than a bound'
  predictions:
    - metric: exponent_carrier_derivation
      direction: different
      minimum_effect: >-
        The symbolic derivation returns c' = sqrt(2 ln 2) = 1.17741 and
        c = 1.698644 with log2(m!) exhibited as the UNIQUE m-growing term, and the
        stage-1 and stage-2 coefficients equal to 10 decimal places at that c'.
        Failure is a procedure defect and stops the derivation.
    - metric: typed_surface_monotonicity_in_m
      direction: different
      minimum_effect: >-
        The typed objective is monotone decreasing in m over the whole feasible
        range 2 <= m <= n at EVERY tested n, so the argmin sits at the boundary.
        Falsified if an interior minimum in m appears at any tested n, which would
        mean a rising term was missed and the localisation is wrong -- and the term
        must then be named.
    - metric: typed_minus_untyped_stage1_saving_bits
      direction: lower
      minimum_effect: >-
        Exactly log2((m-1)!) to within 0.1 bit at every (n, m). At n = 571, m = 12
        that is log2(11!) = 25.25 bits; at n = 571, m = 11 it is log2(10!) = 21.79;
        at n = 283, m = 8 it is log2(7!) = 12.30. Any other value means the three
        GG substitutions were applied wrongly. NOTE the third figure: the
        originating proposal IDEA-20260913-8138a0 quotes 15.3 bits there, which is
        log2(8!) = 15.299 and hence log2(m!) rather than log2((m-1)!). The contract
        must resolve this explicitly; see the interpretation limits.
    - metric: builder_identity_typed_vs_untyped
      direction: different
      minimum_effect: >-
        Identical n(t-1) equations, n(t-2) + kt variables and algebraic degree 3 for
        every tested (n, t, k) and EVERY choice of coset representatives v_i,
        compared coefficient-wise and not merely by count. A single mismatch refutes
        the zero-cost clause.
    - metric: affine_invariance_of_d_ff_argument
      direction: different
      minimum_effect: >-
        deg_{F_2} S_3(u, v_1+y_1, v_2+y_2) = 3 and
        deg_{F_2} y_1 S_3(u, v_1+y_1, v_2+y_2) = 3 for every tested (v_1, v_2),
        including adversarially chosen ones. This is predicted as a THEOREM, so its
        failure refutes the theorem rather than the assumption -- which would be a
        genuinely good outcome, since it would identify the coset shift as the thing
        the first-fall argument is sensitive to.
    - metric: exact_image_size_ratio_typed_over_untyped
      direction: different
      minimum_effect: >-
        The ratio of distinct achievable sums, typed over untyped, equals m! to
        within 10% at every enumerated cell, and the absolute typed image size
        matches 2^{mk}(1 + o(1)). This is the seconds-long gate on the whole
        hypothesis and it is run FIRST.
    - metric: fibre_size_distribution
      direction: different
      minimum_effect: >-
        Fibre sizes consistent with Pois(2^{mk-n}); the most-hit and least-hit
        fibres reported against the Poisson tail. A heavy-tailed fibre distribution
        means concentration and refutes HEUR-YT even when the MEAN image size
        matches, which is why the tail is checked and not only the mean.
    - metric: required_degree_floor
      direction: higher
      minimum_effect: >-
        d >= 0.196 sqrt(n / ln n) at omega = 3 and d >= 0.248 sqrt(n / ln n) at
        omega = 2.376, both asymptotically, re-derived independently. This is a
        derived inequality, so it is falsified only by an arithmetic error in the
        derivation; it is listed as a prediction because it is the record's
        quantitative deliverable.
    - metric: lemma2_typed_hypothesis_failure_rate
      direction: lower
      minimum_effect: >-
        No higher in the typed arm than in the untyped arm at matched (n, m, k). A
        HIGHER typed failure rate means typing costs CORRECTNESS, and the cost must
        be charged before any cost claim: a typed algorithm that emits non-relations
        is wrong, not fast.
  test_boundary:
    instances:
      - >-
        Semaev's own cost formulas eqs. (15)-(16) unchanged, under both k readings,
        as the untyped arm and the reproduction baseline
      - >-
        the same formulas with GG's three substitutions as the typed arm, over every
        integer m in [2, n]
      - >-
        the degenerate typing v_1 = ... = v_m, which must return the untyped arm
        exactly
      - >-
        exact enumeration of prod_i (V + v_i) and of the untyped multiset family
        from V, at n small enough for the image to be counted rather than estimated
      - >-
        symbolic F_2-degree expansion of S_3 under the affine substitution
        x_i = v_i + y_i
      - >-
        the two nearby objects where the conclusion is known false: GG's symmetrised
        presentation, and Trimoska et al.'s search-side setting
    parameters:
      n_range_cost_surface: 'every integer n in [100, 1000], plus 10^4 and 10^5'
      m_range_cost_surface: 'every integer m in [2, n]'
      omega_variants: [2.376, 2.807, 3.0]
      omega_prime_variants: [2.0, 3.0]
      k_readings: [unceiled_n_over_m_as_in_table3, ceil_n_over_m]
      table3_reproduction: 'all 36 numeric cells of tables.yaml Table 3'
      enumeration_n: [12, 15, 17]
      enumeration_k: [2, 3, 4]
      coset_draws_per_cell: 20
      translate_families: [additive_cosets_V_plus_v, multiplicative_translates_gV]
    implementation: >-
      Arbitrary-precision integer and rational arithmetic, exact F_2 linear algebra
      by bit-packed Python integers, and exhaustive enumeration at 2^{mk} <= 2^{17}.
      NO curve group law is needed for the image-size measurement, NO Groebner
      engine is used, and NO degree is measured. That is why this hypothesis is
      testable on this host at all, and it is also the precise limit of what it can
      conclude.
    budget:
      wall_clock_seconds_per_run: 3600
      maximum_memory_gb: 4
      maximum_runs: 40
      enforcement: advisory
  falsification_conditions:
    - >-
      Exact enumeration shows the typed-over-untyped distinct-sum ratio is not about
      m!. Coset typing then does not buy the yield, the zero-cost clause fails, and
      the whole hypothesis dies at a cost of seconds. This is the cheapest and most
      likely refutation and it is deliberately placed first.
    - >-
      The coset-typed descended system has a different equation count, variable
      count or algebraic degree than the untyped one. The zero-cost claim fails and
      the substitution is not free.
    - >-
      The affine-invariance expansion fails: deg_{F_2} y_1 S_3(u, v_1+y_1, v_2+y_2)
      is 4 for some v_1, v_2. Then Assumption 1's justification does NOT transfer,
      the collapse argument loses its force, and the coset shift is identified as
      the thing the first-fall argument is sensitive to -- a good outcome.
    - >-
      The typed cost surface has an interior minimum in m at some tested n. A rising
      term in m was missed, the exponent localisation is wrong, and the term must be
      named.
    - >-
      The untyped arm fails to reproduce Table 3 to 0.7% or to recover m* and
      c = 1.6986. Procedure defect; the derivation stops and no claim is made.
    - >-
      The argument, run on GG's symmetrised presentation or on Trimoska et al.'s
      setting, ALSO collapses them to polynomial time. It has then proved too much
      and is wrong somewhere nobody has read closely enough.
    - >-
      Lemma 2's hypothesis fails more often in the typed arm at matched (n, m, k).
      Typing costs correctness and the cost must be charged before any cost claim.
    - >-
      A reader finds that Diem's use of different factor bases, or any other prior
      work, already composes a typed factor base with an auxiliary-variable
      presentation and derives the degree consequence. novelty drops to `known` and
      the contribution reduces to the quantitative bound. This is named as the
      single most likely place for closer prior art and was NOT chased.
  interpretation_limits:
    - >-
      What this record ASSERTS is a dichotomy and an inequality, never an algorithm.
      The polynomial-time branch is a REDUCTIO against the typed first-fall premise
      and must never be quoted as an attack. If a summary of this record reads as
      "ECDLP in n^{14}", the summary is wrong.
    - >-
      Assumption 1 and Assumption 2 are different claims and must never be refuted
      as one object. The inequality bears on both but by different margins:
      Assumption 1 is contradicted asymptotically by the polynomial branch, while
      Assumption 2 is contradicted by a constant factor in the required degree
      growth.
    - >-
      The floor 0.196 sqrt(n / ln n) is a statement about SEMAEV'S COST MODEL under
      GG's accounting. It is not a lower bound on the degree of regularity of any
      concrete system, and becomes one only for an algorithm actually built and
      measured.
    - >-
      At n = 571 the floor evaluates to 1.86, BELOW Assumption 1's 4, so there is no
      contradiction with Assumption 1 at concrete FIPS-labelled parameters from the
      floor alone; it exceeds 4 only near n ~ 3400 at omega = 3. The concrete-n
      force of the argument comes from the MONOTONICITY in m, not from the floor,
      and conflating the two would overstate the result at small n.
    - >-
      A KNOWN ARITHMETIC DEFECT IN THE ORIGINATING PROPOSAL, recorded here rather
      than silently corrected because IDEA-20260913-8138a0 is now an immutable
      ledger record. Its `sota_delta.conditional_delta` quotes the typed stage-1
      saving as "25.25 bits at n = 571, m = 12; 21.8 bits at n = 571, m = 11; 15.3
      bits at n = 283, m = 8". The first two are log2((m-1)!) as the claim states
      (log2(11!) = 25.25, log2(10!) = 21.79), but the third is log2(8!) = 15.299,
      i.e. log2(m!), where log2((m-1)!) = log2(7!) = 12.299. The Coordinator
      verified all three independently under DEC-20260913-cb5ee2. This is a
      transcription inconsistency in one illustrative figure and does NOT touch
      (C1)'s derivation, which the Coordinator re-derived and confirmed exactly; but
      it is the kind of slip that propagates, so the contract re-derives all three
      figures from scratch and reports the corrected value.
    - >-
      Galbraith-Gebregiyorgis's observation that the degree of regularity is "often
      3 when using symmetry-breaking while it is 4 for most values in experiment 2"
      is at m = 3, in a different presentation, on binary Edwards curves with
      symmetrised coordinates, from a table whose own authors call their results
      "not conclusive". It motivates the degree experiment and supports nothing.
    - >-
      NO DEGREE IS MEASURED BY THIS HYPOTHESIS'S CONTRACT and none can be on this
      host: no MAGMA, Sage, Singular or msolve is installed, and this program's own
      first-fall instruments import sage.all. HEUR-A1T is therefore carried as an
      explicitly unvalidated premise. The deciding measurement -- whether the typed
      solving degree rises with m while the untyped one does not, which would mean
      the m! is CONSERVED and exchanged from probability into degree -- is separate
      future work and is not claimed here in either direction.
    - >-
      No statement about the security of any deployed curve, in either direction,
      follows from anything in this record. The FIPS n appear only as labels on rows
      of a cost table whose internal consistency is the object of study.
