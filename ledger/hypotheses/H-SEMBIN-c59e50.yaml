hypothesis:
  id: H-SEMBIN-c59e50
  question_id: RQ-SEMBIN-9fa4ba
  statement: >-
    The exponent constant c = 1.6986 in Semaev 2015's bound
    2^{1.6986 sqrt(n ln n)} is carried ENTIRELY by the symmetry factor m! of the
    Section 4.3 yield model, and by nothing else in the construction. Specifically:
    writing m = c' sqrt(n / ln n), log2 of eq. (15) is
    [c'/(2 ln 2) + 1/c'] sqrt(n ln n) + O(log n) and log2 of eq. (16) is
    (2/c') sqrt(n ln n); log2(m!) ~ (c'/(2 ln 2)) sqrt(n ln n) is the ONLY term in
    that balance that grows with m; equating the stages gives c'^2 = 2 ln 2, hence
    c' = 1.17741 and c = 2/c' = 1.698644. Delete the m! and the objective is
    monotonically DECREASING in m over the whole feasible range 2 <= m <= n, with no
    interior optimum at any n -- so the optimisation that produced the exponent
    does not merely shift, it ceases to exist.
    The m! is removable by a PUBLISHED device: Galbraith-Gebregiyorgis 2014/806
    section 4.2 coset-typed factor bases F_i = {P : x(P) in V + v_i}. Their own
    obstruction to it -- extra variables from expressing summation polynomials in
    elementary symmetric coordinates -- does not transfer to Semaev's chained
    presentation, which has no symmetric coordinates: x_1, ..., x_t appear
    individually, so x_i = v_i + y_i is an affine change of Boolean variables and
    leaves the equation count n(t-1), the variable count n(t-2) + kt and the
    algebraic degree 3 unchanged.
    What this hypothesis therefore ASSERTS is a dichotomy and an inequality, never
    an algorithm: since the polynomial-time branch is not believed, the typed
    first-fall-degree premise fails, and the failure has a computable minimum rate.
    For Semaev's own bound to survive coset typing the solving degree must satisfy
    d(n, m) >= (c ln 2)/(2 omega) sqrt(n / ln n), which is 0.196 sqrt(n / ln n) at
    omega = 3 and 0.248 at omega = 2.376 -- CONTRADICTING Semaev's Assumption 2
    (d_F4 = o(sqrt(n / ln n))) by a constant factor. Semaev's Section 4.6 remark
    that "the asymptotical bound does not depend on any first fall degree
    assumption" is then true only because the m! is left in place: eq. (17) is a
    statement about the symmetry loss, not about the degree.
  mechanism: >-
    OBJECT FRAME, and why the chain sits in the dominated corner. The object the
    Section 4.3 yield model tracks is the UNORDERED multiset {x_1, ..., x_t}, i.e.
    the S_t-orbit of the ordered tuple. That is a lossy projection, and eq. (11)'s
    class count K ~ |V|^t / t! is precisely the price of the discard, charged as
    inverse success probability. A lossy projection pays for itself only if the
    algorithm downstream works IN the quotient. Faugere-Gaudry-Huot-Renault do work
    in the quotient -- they solve in elementary symmetric coordinates and collect
    the reduction. Semaev's chain does not: it is a path of S_3 constraints on the
    individual x_i and on auxiliary partial sums, and a partial sum is not
    S_t-invariant. The chained presentation therefore PAYS THE COST OF A PROJECTION
    IT DOES NOT USE. Coset typing un-projects: it replaces the orbit by a
    type-indexed tuple, which is not a lossy projection and carries no
    orbit-canonicalisation price. That asymmetry -- projection used versus projection
    paid for -- is the entire mechanism, and it is what distinguishes this from
    Galbraith-Gebregiyorgis's own setting where the projection IS used and
    un-projecting costs them their symmetrisation.
    WHY THE COLLAPSE IS STRUCTURAL RATHER THAN ARITHMETIC. With the m! present the
    objective n/m + log2(m!) + 2n/m has a genuine interior minimum, because
    log2(m!) ~ m log2 m rises while 2n/m falls: the balance is between a symmetry
    loss growing in the number of summands and a relation store shrinking in it.
    Remove the rising term and no balance exists -- every cost term falls with m, so
    the model's optimum runs to the boundary m = n, where the factor base is m
    single points and decomposition IS subset-sum over n group elements. A model
    that prices subset-sum over n generators at n^{O(1)} is mispricing something,
    and the only thing left to misprice is the degree. This is "controls before
    belief" applied to an argument instead of a measurement: the cost formula is run
    at parameters where its conclusion is known false and it still goes through.
    WHY THE PUBLISHED m! REMOVALS ARE NOT THIS, which is the standing trap. Two
    distinct factorials carry the same name. (i) The PROBABILITY m! of eq. (11),
    removed by coset-typed bases, net gain (m-1)! because the factor base is m times
    larger. (ii) The SEARCH m!, the redundancy of m! permuted satisfying assignments
    inside one solver call, removed by Trimoska-Ionica-Dequen 2019/313 with an
    ordering constraint; their Theorem 1 keeps the probability factorial explicitly
    and their total is O~(2^{n+l}), worse than 2^{n/2}, because their solve is
    exponential in l. So removal (ii) is coupled to an exponential solver and buys
    nothing asymptotically, while removal (i) has never been composed with a
    presentation whose solve is CLAIMED polynomial. Semaev's chain is the first such
    presentation and the composition is unexamined. That, and nothing else, is what
    is new here.
    WHY THE FIRST-FALL ARGUMENT TRANSFERS, which is what makes the dichotomy bite
    rather than dissolve. Semaev's Section 4.5 proof that d_ff = 4 is the pair of
    facts deg_{F_2} S_3(x_1,x_2,x_3) = 3 and deg_{F_2} x_1 S_3 = 3 against
    deg_{F_2} x_1 + deg_{F_2} S_3 = 4. Both are statements about F_2-degrees of
    coordinate functions, hence about Hamming weights of exponent vectors, and are
    invariant under any affine F_2-substitution of the field variables. So the typed
    system inherits Assumption 1's ENTIRE published justification: the hypothesis
    does not weaken Assumption 1 to reach its conclusion, it applies the assumption
    exactly where the paper's own stated reason reaches.
  assumptions:
    - >-
      Standalone mathematical instances and derivations only. The n values are
      parameter labels in a cost model whose internal consistency is the object of
      study. No claim about the security of any FIPS PUB 186-4 binary curve in
      either direction, and no claim that any algorithm here is fast -- the
      load-bearing conclusion runs the other way, against an assumption.
    - >-
      The cost model is Semaev's own, eqs. (15)-(16), with exactly THREE
      substitutions, all of them Galbraith-Gebregiyorgis's own accounting rather
      than inventions here: the yield 1/P becomes 2^{n-mk} in place of
      m! 2^{n-mk}; the relation count becomes m 2^k in place of 2^k; and stage 2
      becomes (m 2^k)^{omega'} in place of 2^{k omega'}. Every other term is
      unchanged. Quoting a gain of m! rather than (m-1)! would overstate it by a
      factor m and is not done.
    - >-
      The k-reading ambiguity carried by every SEMBIN derivation applies here too
      and is not resolved silently. eq. (15) is derived with k = ceil(n/m) but
      Table 3's stage-1 column reproduces only from the un-ceiled k = n/m, so both
      readings are computed and reported. This is the same ambiguity H-SEMBIN-b1708c
      and H-SEMBIN-83999d carry.
    - >-
      omega and omega' are carried as ranges (omega in {2.376, 2.807, 3},
      omega' in {2, 3}) and never fixed silently; every quoted exponent states
      which.
    - >-
      The claim that the coset-typed chained Boolean system has the same equation
      count, variable count and algebraic degree as the untyped one is an ALGEBRAIC
      IDENTITY to be checked by construction, not assumed. If a coset shift changes
      any of the three, the zero-cost clause fails and the hypothesis fails with it.
    - >-
      MAGMA is not available to this program and no Groebner engine of any kind is
      installed on the execution host, so nothing here can reproduce Semaev's d_F4
      in its operational sense. This hypothesis therefore makes NO measured degree
      claim: the degree arm is separated out deliberately and is not part of the
      contract that tests this record. What is testable now is the derivation, the
      algebraic identity, the affine-invariance expansion, and the exact image-size
      enumeration.
  proof_search_map:
    bottleneck: >-
      The factor m! in eq. (11), and hence in eq. (15). It is the unique term in
      Semaev's two-stage balance that grows with m, so it alone sets both m* and the
      constant c = 1.6986. Removing it does not improve the algorithm's solve, its
      chain topology, its subspace or its cofactor -- it dissolves the optimisation
      that produced the exponent. Everything else in the construction is a cofactor
      by construction, which is a derivation and not a heuristic.
    baseline_embedding:
      parameter_slice: >-
        The exact old-method boundary is the DEGENERATE TYPING v_1 = ... = v_m, at
        which the typed family IS the untyped family. On that slice every formula,
        every cost surface and every enumerated image size must return Semaev's own
        values, including m* ~ sqrt(2 ln 2 n / ln n), c = 1.6986 and the 36 cells of
        Table 3.
      reproduction_check: >-
        Frozen fixture: the 36 numeric cells of Table 3 in
        inputs/SEMAEV-2015-310/tables.yaml, reproduced to the 0.7% already
        established there, under BOTH the ceiled and un-ceiled k readings that file
        records as disagreeing. A reproduction is accepted only if it ALSO recovers
        c' = sqrt(2 ln 2) symbolically -- fitting the number 1.6986 without
        exhibiting log2(m!) as its unique carrier would not identify the carrier,
        which is the whole claim.
    observation_collision:
      observable: >-
        The single number "total cost exponent" reported by eq. (17), and the single
        number d_F4 that Assumption 1 bounds.
      distinct_preimage_search: >-
        Two searches on the two observables. (a) For the cost exponent: exhibit two
        DISTINCT cost models -- Semaev's untyped model at d_F4 <= 4, and the typed
        model at d_F4 ~ 0.196 sqrt(n / ln n) -- that produce the SAME total exponent
        1.6986 sqrt(n ln n). They do so by construction, and that is the content of
        the inequality: the published exponent does not identify the degree, so no
        measurement of the exponent can ever confirm Assumption 1. (b) For d_F4:
        a typed and an untyped instance at matched (n, m, t, k) and matched seed
        whose degrees collide at 4 while their yields differ by m!. Either collision
        alone shows the paper's two headline numbers are not jointly identifiable
        from what it reports.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the single factor base F = {P : x(P) in V} by the coset-typed
          family F_i = {P : x(P) in V + v_i}; equivalently replace the tracked
          object "unordered multiset of factor-base points" by "type-indexed tuple".
        predicted_gain: >-
          Exactly log2((m-1)!) bits of stage-1 saving at fixed (n, m, k), at zero
          cost in equation count, variable count or algebraic degree, with the
          d_ff = 4 argument intact. The exponent consequence is not a gain but a
          collapse, and the collapse is the deliverable.
      - transform: boundary_lift
        proposed_object: >-
          m released from Semaev's optimum sqrt(2 ln 2 n / ln n) to the full
          feasible range 2 <= m <= n. This is only meaningful once the m! is gone:
          with the m! present the optimum is interior and the release changes
          nothing.
        predicted_gain: >-
          Exposes that the typed objective has no interior optimum, which is the
          structural signature of a missing constraint. No algorithmic gain is
          claimed; the diagnostic IS the gain.
      - transform: observable_fiber
        proposed_object: >-
          Hold the exponent 1.6986 sqrt(n ln n) fixed and vary the forgotten
          structure -- the symmetry factor, the degree, the cofactor. The fibre is
          two-dimensional (symmetry factor x degree) and the published number picks
          out a curve in it rather than a point.
        predicted_gain: >-
          Names which published claims are jointly identifiable from eq. (17) and
          which are not, converting "is Assumption 1 true" into "what is the
          exchange rate between the symmetry factor and the degree".
    quantifier_order: >-
      ASSERTED: FOR ALL n, FOR ALL m with 2 <= m <= n, FOR ALL k = ceil(n/m), FOR
      ALL F_2-subspaces V of dimension k, FOR ALL coset representatives v_1..v_m in
      pairwise distinct cosets of V -- IF the typed Boolean system equivalent to (5)
      has d_F4 <= 4 AND the typed yield law holds, THEN ECDLP on E(F_{2^n}) is
      solved in n^{O(1)} operations by the stated algorithm.
      CONTRAPOSITIVE, which is the operative form: FOR ALL n, IF ECDLP on E(F_{2^n})
      requires more than 2^{1.6986 sqrt(n ln n)} operations, THEN THERE EXISTS
      m <= n at which d_F4 for the typed system exceeds
      0.196 sqrt(n / ln n) / (1 + o(1)).
      Note the EXISTENTIAL on m in the contrapositive. This record does NOT claim
      the degree is large at Semaev's m* = 11; only that it is large SOMEWHERE in
      the range Assumption 1 quantifies over. Collapsing that existential into a
      universal would overstate the result and is the specific misreading to guard
      against.
    method_ceiling:
      strongest_certifiable_claim: >-
        Without compute: the symbolic identity that log2(m!) is the unique m-growing
        term and therefore fixes c' and c; the affine invariance of the d_ff = 4
        argument; the counting cap binom(2^k + m - 1, m) ~ 2^{mk}/m! on the untyped
        image against 2^{mk} on the typed one; the full typed and untyped cost
        surfaces under stated (omega, omega'); and the necessary-condition
        inequality on d. With compute at n <= 17: exact typed and untyped image
        sizes and fibre-size distributions. It CANNOT certify anything about MAGMA's
        F4, anything about d_F4 at any m, or anything at n = 409 or n = 571 --
        and on this execution host it cannot certify any degree at all, because no
        algebra engine is installed.
      nearby_object_control: >-
        Two nearby objects where the argument's conclusion is KNOWN FALSE, and the
        argument must fail on both. (i) Galbraith-Gebregiyorgis's OWN setting: the
        single summation polynomial in elementary symmetric coordinates, where coset
        typing demonstrably costs extra variables and their own measured benefit is
        "moderate" and "not conclusive". The argument must NOT go through there, and
        the reason it does not -- symmetrised coordinates -- is exactly the
        mechanism. An argument that also collapses GG's setting to polynomial time
        has proved too much and is wrong. (ii) Trimoska et al.'s setting, where the
        m! is removed on the search side and the total is O~(2^{n+l}), worse than
        2^{n/2}; the argument must not collapse that either, and the reason is that
        their solve is exponential in l. These two controls are what distinguish a
        real mechanism from an arithmetic slip, and they cost nothing.
    proof_obligations:
      - claim: >-
          log2(m!) is the unique term in eqs. (15)-(16) whose leading order grows
          with m, and equating the two stages returns c' = sqrt(2 ln 2) = 1.17741
          and c = 2/(2 ln 2)^{1/2} = 1.698644
        responsibility: baseline
      - claim: >-
          deg_{F_2} S_3(u, v_1+y_1, v_2+y_2) = 3 and
          deg_{F_2} y_1 S_3(u, v_1+y_1, v_2+y_2) = 3 for all v_1, v_2 in F_{2^n},
          so the d_ff = 4 argument is affine-invariant and transfers to the typed
          system
        responsibility: correctness
      - claim: >-
          The coset-typed chained Boolean system has exactly n(t-1) equations,
          n(t-2) + kt variables and algebraic degree 3, identical to the untyped one
        responsibility: size
      - claim: >-
          A single factor base of size 2^k admits at most binom(2^k + m - 1, m)
          distinct m-fold sums, so the m! is an information-theoretic cap rather
          than an accounting choice; m distinct cosets lift the cap to 2^{mk}
        responsibility: success_probability
      - claim: >-
          The typed cost surface is monotone decreasing in m over 2 <= m <= n at
          every tested n, with no interior optimum, and returns a polynomial value
          at m = n / ceil(log2 n)
        responsibility: runtime
      - claim: >-
          For Semaev's bound to survive typing, d(n, m) >= 0.196 sqrt(n / ln n) at
          omega = 3, contradicting Assumption 2's o(sqrt(n / ln n)) by a constant
          factor
        responsibility: strictness
      - claim: >-
          Lemma 2's conditional equivalence holds for the typed system under the
          type-indexed proper-subset hypothesis, which quantifies over strictly
          fewer tuples than the untyped hypothesis, so the equivalence is more often
          in force rather than less; and the order-2 channel is unaffected by typing
        responsibility: correctness
      - claim: >-
          The argument does NOT go through in GG's symmetrised presentation nor in
          Trimoska et al.'s search-side setting
        responsibility: scope
      - claim: >-
          Nothing here bears on the security of any deployed curve in either
          direction, and the polynomial-time branch is a reductio and not a claim
        responsibility: scope
  rerandomization: null
  asymptotic_claim:
    problem: ECDLP on E(F_{2^n}), n prime, via chained-S_3 index calculus
    prior_best: >-
      2^{1.6986 sqrt(n ln n)} claimed by Semaev 2015 under Assumption 1;
      ~0.886 * 2^{n/2} for van Oorschot-Wiener parallel rho, which is the
      unconditional best and the comparator every number here is measured against
    time_exponent: >-
      NO unconditional exponent improvement is claimed and none follows. Two
      CONDITIONAL branches are offered as reductiones, never as results: under the
      typed first-fall premise, n^{O(1)}; under Semaev's Assumption 2 extended to
      the typed family, 2^{epsilon sqrt(n ln n)} for every constant epsilon > 0, so
      no positive constant survives in front of sqrt(n ln n). What is asserted
      unconditionally is the contrapositive inequality
      d(n, m) >= 0.196 sqrt(n / ln n) at omega = 3.
    memory_exponent: >-
      Typed relation store m 2^{ceil(n/m)} against Semaev's 2^{ceil(n/m)}, an extra
      factor m; at m = n/log2 n that is about n^2/log2 n points, polynomial. The
      stage-1 Macaulay working set at large m is NOT costed here and is the most
      likely place the collapse branch is actually blocked by resources rather than
      by degree. Disclosed rather than absorbed; H-SEMBIN-83999d owns the memory
      column.
    hidden_cofactor: >-
      the n^{4 omega} (or [n(m-1)]^{4 omega}) per-solve factor, which at omega = 3
      and n = 571 is 2^{109.9} and therefore EXCEEDS the 2^{94.8} stage-2 term it is
      balanced against -- the cofactor is not a cofactor at these n
    claim_kind: exponent_constant
  heuristic_assumptions:
    - id: HEUR-A1T
      formal_statement: >-
        (Typed first-fall-degree assumption.) Let q = 2^n, 2 <= m < n,
        k = ceil(n/m), let V be an F_2-subspace of F_{2^n} of dimension k, and let
        v_1, ..., v_m in F_{2^n} lie in pairwise distinct cosets of V. Then for
        every 2 <= t <= m, the Boolean system equivalent to (5) with the constraint
        x_i in V + v_i has d_F4 <= 4. This is Semaev's Assumption 1 with "V"
        replaced by the coset family. It is NOT asserted by Semaev and is authored
        here so the collapse argument has a NAMED premise instead of a silent
        inheritance.
      random_model_justification: >-
        The rigorous half is the affine-invariance obligation above: Semaev's
        Section 4.5 proof that d_ff = 4 rests on deg_{F_2} S_3 = 3 and
        deg_{F_2} x_1 S_3 = 3, which are statements about Hamming weights of
        exponent vectors and are invariant under the affine substitution
        x_i = v_i + y_i. So d_ff = 4 is provable for the typed system exactly where
        it is provable for the untyped one. The step d_F4 <= d_ff is the heuristic
        and is exactly as unproved here as in the paper -- Assumption 1 IS that
        step. Above its exhibited degree-4 syzygies the system is modelled as a
        uniformly random Boolean system of the same variable count and the same
        quadratic/cubic generator split, which is the model Section 4.5.1 itself
        uses when it substitutes a random z for R_X. Affine changes act transitively
        on the relevant Boolean variable space, so a random-model justification
        holding for one coset family holds for all; this is the one place where
        typing is cleanly neutral under the model, and if measurement disagrees it
        is the MODEL that is refuted, which is the informative outcome.
      supporting_results:
        - >-
          Semaev Section 4.5's d_ff = 4 argument and Assumption 1 as stated for all
          2 <= t <= m on the diagonal k = ceil(n/m)
          (inputs/SEMAEV-2015-310/paper_fulltext.md; KN-LIT-fa346d; provenance kb).
        - >-
          Bardet-Faugere-Salvy semi-regular-sequence picture as held in this corpus
          (KN-LIT-029), whose own record hedges that identifying the degree of
          regularity with an observed first-fall or solving degree is a heuristic and
          that semi-regularity need not hold for structured systems
          (provenance internal).
      validation_experiment_ids: []
      validation_status: >-
        NOT VALIDATED AND NOT VALIDATABLE ON THIS HOST. No Groebner engine is
        installed (no MAGMA, Sage, Singular or msolve), and this program's own
        instruments src/ic_first_fall_fast.py and src/semaev_tree.py both import
        sage.all. The degree arm is therefore a SEPARATE future contract and is
        deliberately excluded from EXP-SEMBIN-92724f. Recording the premise as
        unvalidated is the honest state; substituting an unmeasured degree for a
        measured one would be the failure mode.
      falsification_condition: >-
        A typed cell with degree-4 closure false, or with productive step degree
        above 4 on the unsatisfiable stratum, where the untyped cell at the same
        (n, m, t, k) and seed is at 4. HEUR-A1T is then refuted at that cell, the
        collapse is blocked, and the measured exchange rate between the removed m!
        and the added degree becomes the deliverable -- a result, not a failure.
    - id: HEUR-YT
      formal_statement: >-
        (Typed yield law.) With V of dimension k and v_1, ..., v_m in pairwise
        distinct cosets of V, the map
        (x_1, ..., x_m) in prod_i (V + v_i) -> S_{m+1}(x_1, ..., x_m, z) behaves,
        for random z in F_{2^n}, like a uniformly random map from a set of size
        2^{mk} into F_{2^n}, so
        P(satisfiable) ~ 1 - exp(-2^{mk-n}) with NO 1/m! and no other symmetry
        factor. Formally: for all n, k, m and all admissible {v_i}, the number of
        distinct values attained is 2^{mk}(1 + o(1)) whenever mk <= n - omega(1).
      random_model_justification: >-
        The rigorous half is a counting bound in the other direction: with a single
        base the number of distinct achievable m-fold sums is at most
        binom(2^k + m - 1, m) ~ 2^{mk}/m!, an information-theoretic cap, whereas
        with m distinct cosets the cap is 2^{mk}. So the m! is a genuine cap on the
        untyped family and its removal is not an accounting choice. The classical
        distribution theorem imitated is the balls-into-bins law already used by
        eq. (11); this heuristic is eq. (11) with the symmetry quotient removed and
        nothing else changed. S_{m+1} restricted to a product of cosets is a
        polynomial map of degree 2^{m-1} in each variable, and the random-map model
        is the assumption that its image is not concentrated. Concentration is
        exactly what a small subgroup or a multiplicative structure in the v_i could
        cause, which is why the representation control (multiplicative translates
        against additive cosets) is in the design and why the image size is measured
        EXACTLY rather than assumed.
      supporting_results:
        - >-
          Galbraith-Gebregiyorgis 2014/806 section 4.2 asserts the same heuristic for
          the same construction: "we expect the number of points in
          {P_1 + ... + P_m : P_i in F_i} to be roughly 2^{lm}. Note that there is no
          1/m! term here" (KN-LIT-439; provenance retrieved, full text read under
          TASK-20260913-6519c9).
      validation_experiment_ids:
        - EXP-SEMBIN-92724f
      falsification_condition: >-
        Measured image-size ratio between typed and untyped families materially
        below m! (under m!/2) at any cell, or a fibre-size distribution
        significantly heavier-tailed than Poisson. Either refutes HEUR-YT, and since
        the zero-cost clause rests on it, the cost claims fall with it. This is the
        cheapest refutation available -- seconds of enumeration -- and it is
        deliberately the first thing the contract runs.
  structural_ingredients:
    - description: >-
        Galbraith-Gebregiyorgis 2014/806 section 4.2 coset-typed factor bases
        F_i = {P : x(P) in V + v_i}, with the m! absent from the sum count, a net
        speedup of (m-1)! because m times as many relations are needed, and a
        stage-2 linear-algebra cost rising by m^2. Their obstruction is explicitly
        tied to symmetrised coordinates: "we require one more variable than the
        previous case, and things get worse for higher degree terms."
