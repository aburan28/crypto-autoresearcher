  title: The level-1 Serre-Tate splitting of an anomalous lift is exactly the j-distance rule, witnessed by an explicitly
    constructed and verified p-torsion lift
  statement: 'On the 29 anomalous CM curves (p <= 1500) and the four lift classes of EXP-CZLIFT-17b7eb, with lambda
    = log_F(z([p]P^)) computed from the formal-group series at precision 6: v_p(lambda) >= 2 if and only if v_p(j(E^)
    - j_can) >= 2e on every sample, and whenever v_p(lambda) >= 2 the point P~ = P^ - exp_F(lambda / p) satisfies
    [p]P~ = O at precision 5 by curve arithmetic and reduces to P, on every sample; when v_p(lambda) = 1 no such
    lift is constructed.'
  mechanism: E^[p] splits (the extension of Z/p by mu_p is trivial, equivalently q(E^) is a p-th power, equivalently
    v_p(q - 1) >= 2) exactly when every P has a p-torsion lift; the formal logarithm is an isomorphism E^(pZ_p)
    -> pZ_p for p > 2, so [p]U = [p]P^ is solvable in the formal group iff p^2 | log_F(z([p]P^)), and then U = exp_F(log_F
    / p) is the solution. This instrument computes the series rather than reading a valuation, and verifies the
    constructed point by the group law.
  assumptions:
  - precision k = 6 < p so every series coefficient has unit denominators
  - point lifts are Hensel lifts with random x-digit
  proof_search_map:
    not_applicable_reason: bounded measurement against a pre-registered prediction; no asymptotic claim
  asymptotic_claim: null
