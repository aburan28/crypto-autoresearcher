hypothesis:
  id: H-ENDO-001
  question_id: RQ-ECDLP-002
  statement: >-
    For a prime-order subgroup G of order N generated by P on a prime-field
    elliptic curve, and for r efficiently computable endomorphisms
    phi_1 = identity, phi_2, ..., phi_r acting on G with publicly computable
    eigenvalues lambda_i in Z/N, the augmented witness lattice
    W_r, defined as the set of integer vectors (a_1..a_r, b_1..b_r) in Z^(2r)
    for which the sum over i of a_i phi_i(P) plus the sum over i of
    b_i phi_i(Q) is the point at infinity, satisfies three properties at once.
    (P1) INDEX PINNING - the index of W_r in Z^(2r) equals N exactly, for every
    r, on every instance.
    (P2) MINIMUM SHRINKAGE - the infinity-norm first minimum of W_r scales as
    N^(1/(2r)), so the shortest witness really does get dramatically shorter as
    r grows.
    (P3) COST NEUTRALITY - despite P2, the cost of FINDING a witness by the
    balanced meet-in-the-middle over the 2r coordinates stays at exponent 1/2 in
    N and its constant grows like 2^r, so increasing r makes the attack strictly
    worse and is Pareto-dominated by parallel Pollard rho with distinguished
    points.
    The hypothesis is that P1, P2 and P3 hold simultaneously on the tested
    scope. Shrinkage WITHOUT cost reduction is the falsifiable signature;
    shrinkage WITH cost reduction would refute P3 and reopen the endomorphism
    lane.
  mechanism: >-
    Because G has prime order N, every group endomorphism of G is multiplication
    by a scalar. Each phi_i therefore acts on G as multiplication by some
    lambda_i in Z/N, and with Q equal to [k]P the defining condition of W_r
    collapses to the SINGLE linear congruence
    (sum over i of lambda_i a_i) plus k times (sum over i of lambda_i b_i)
    congruent to 0 modulo N.
    Adding endomorphisms therefore adds COORDINATES but no additional
    congruence. One congruence modulo N on Z^(2r) whose coefficient vector
    contains a unit - and it does, because lambda_1 = 1 - is a surjection onto
    Z/N, so the kernel W_r has index exactly N and determinant exactly N,
    whatever r is. That is P1, and it is rigorous rather than heuristic.
    Minkowski's convex body theorem applied to the symmetric closed box of side
    X = ceil(N^(1/(2r))) in dimension 2r then guarantees a nonzero witness,
    because the box volume (2X+1)^(2r) strictly exceeds 2^(2r) times the
    determinant N. That is P2, and it is also rigorous as an upper bound on the
    first minimum.
    P3 is where the intuition that more structure must help breaks. The same box
    that is guaranteed to contain a witness contains about 4^r times N integer
    points, and the witness density inside it is 1/N, so the witness count is
    Theta(4^r) and does not fall with r. A balanced split of the 2r coordinates
    into the r P-side coordinates and the r Q-side coordinates gives two lists,
    each of size about (2X+1)^r, that is about 2^r times sqrt(N), joined by a
    collision search. Counting one elliptic-curve point addition per list entry
    built incrementally, the predicted cost is 2^(r+1) times sqrt(N) point
    additions and the predicted peak storage is 2^r times sqrt(N) entries. The
    exponent is 1/2 for every r and the constant DOUBLES per added endomorphism.
    So the shortest witness gets shorter while the work of finding it gets
    larger - the determinant is pinned, and shortness bought by adding
    coordinates is not shortness that can be searched for more cheaply.
    The only measurable benefit endomorphisms confer in this setting is then the
    classical automorphism-quotient speedup: rho on the quotient by the
    automorphism group costs about 0.886 times sqrt(N / |Aut|) group operations,
    a constant factor of at most sqrt(6), never an exponent.
  assumptions:
    - >-
      G has prime order N and every phi_i is defined over F_p and maps G into G,
      so each acts on G as multiplication by a scalar lambda_i in Z/N.
    - >-
      Each lambda_i is publicly computable from the curve and N without solving
      any discrete logarithm - for CM discriminant -3 by the roots of
      L^2 + L + 1 = 0 mod N and for CM discriminant -4 by the roots of
      L^2 + 1 = 0 mod N. Any phi whose eigenvalue could only be obtained by
      solving a discrete logarithm is EXCLUDED, and the exclusion is stated
      because it is exactly where circularity would otherwise enter.
    - >-
      lambda_1 = 1, so the congruence coefficient vector contains a unit. This
      is what makes P1 rigorous rather than generic-position heuristic.
    - >-
      THE NUMBER OF GENUINE EFFICIENTLY COMPUTABLE ENDOMORPHISMS IS BOUNDED BY
      THE CURVE, NOT CHOSEN BY THE EXPERIMENTER. On a j = 0 curve the available
      scalars are generated by 1 and lambda with lambda^2 + lambda + 1 = 0 mod N,
      so there are at most three distinct ones and the third satisfies
      lambda_3 = lambda_2^2 = -1 - lambda_2. On a j = 1728 curve the available
      scalars are 1 and lambda with lambda^2 + 1 = 0 mod N, so there are at most
      two. Cells at higher r are SYNTHETIC - the extra eigenvalues are drawn
      uniformly from the units of Z/N and correspond to no efficiently
      computable map - and they test the LATTICE claim only, never a realizable
      attack.
    - >-
      At 16 to 28 bits an exact Hermite normal form is computable, and an exact
      shortest vector is computable by enumeration in dimension at most 4. In
      dimensions 6 and 8 the reported first minimum is an LLL upper bound unless
      exact enumeration completes, and which method produced each value must be
      recorded per cell.
    - >-
      Matched Pollard rho with negation and matched BSGS are run on identical
      instances and counted in the same operation unit, namely one
      elliptic-curve point addition or doubling.
  predictions:
    - metric: augmented_witness_lattice_index
      direction: different
      minimum_effect: >-
        The Hermite normal form index of W_r in Z^(2r) equals N exactly on 100
        percent of cells, for every r tested, whenever the eigenvalue control
        passes. A single cell with index strictly below N and a passing
        eigenvalue control falsifies P1. BASIS - derivation in this record
        (surjectivity of a congruence whose coefficient vector contains a unit);
        NOT measured anywhere in this campaign.
    - metric: log_N_first_minimum_versus_inverse_2r
      direction: lower
      minimum_effect: >-
        Regressing log_N of the infinity-norm first minimum of W_r on 1/(2r)
        over cells whose first minimum was obtained by EXACT enumeration gives a
        slope in [0.85, 1.15] with R^2 at least 0.90. BASIS - the ideal slope 1
        is Minkowski's bound in this record's derivation; the interval and the
        R^2 floor are PRE-REGISTERED TOLERANCES chosen a priori and are
        UNTESTED EXPECTATIONS, not measurements.
    - metric: mitm_point_additions_over_sqrt_N_versus_r
      direction: higher
      minimum_effect: >-
        The measured ratio rho(r) of meet-in-the-middle point additions to
        sqrt(N) is non-decreasing in r within a 15 percent tolerance at every
        field size, lies within a factor 2 of the predicted 2^(r+1) at every r,
        and satisfies rho(4)/rho(1) at least 4 at the largest completed field
        size. BASIS - 2^(r+1) is derived in this record (two lists of
        (2X+1)^r entries at X = ceil(N^(1/(2r)))), giving rho(1) = 4 and
        rho(4) = 32 and hence a predicted ratio 8; the acceptance threshold is
        set at 4 to leave implementation slack, and both the factor-2 band and
        the 15 percent tolerance are PRE-REGISTERED and UNTESTED.
    - metric: rho_cost_over_automorphism_quotient_prediction
      direction: different
      minimum_effect: >-
        Measured Pollard rho cost on j = 0 and j = 1728 curves lies within 20
        percent of 0.886 times sqrt(N / |Aut|). BASIS - 0.886 is the classical
        birthday constant sqrt(pi/4) from the published rho literature, used
        here as a KNOWN-ANSWER CALIBRATION; this campaign has never measured it,
        and the 20 percent band is a pre-registered untested tolerance.
    - metric: mitm_peak_entries_over_rho_peak_entries
      direction: higher
      minimum_effect: >-
        Peak stored entries of the augmented meet-in-the-middle divided by peak
        stored entries of rho with distinguished points is at least sqrt(N)/16
        at every r, confirming Pareto domination by rho on the memory axis. A
        memory-competitive meet-in-the-middle would change the tradeoff reading
        and is an INCONCLUSIVE outcome, not a negative one. BASIS - derivation
        in this record; UNTESTED.
  test_boundary:
    instances:
      - >-
        Prime-field curves with prime-order subgroups at 16, 20, 24 and 28 field
        bits, five seeds per family per size.
      - >-
        Family J0 - j = 0 curves, CM discriminant -3, p congruent to 1 mod 3,
        |Aut| = 6, genuine r up to 3.
      - >-
        Family J1728 - j = 1728 curves, CM discriminant -4, p congruent to 1
        mod 4, |Aut| = 4, genuine r up to 2.
      - >-
        Family GEN - generic j curves with |Aut| = 2 and no nontrivial
        efficiently computable endomorphism, r = 1 only, used to pin the r = 1
        baseline against BSGS.
    parameters:
      endomorphism_rank_r: '1, 2, 3, 4 (cells above the genuine bound are labelled SYNTHETIC)'
      box_side: 'X = ceil(N**(1.0/(2*r)))'
      operation_unit: one elliptic-curve point addition or doubling
      first_minimum_method: exact enumeration in dimension at most 4, LLL upper bound otherwise
      seeds: '1, 2, 3, 4, 5'
    implementation: >-
      A NEW standalone driver under experiments/EXP-ENDO-001/driver/. Nothing
      under harness/ is modified or reused for the measurement, because no
      existing harness module computes a witness lattice, a Hermite normal form
      or a balanced meet-in-the-middle.
    budget:
      wall_clock_seconds_total: 7200
      maximum_memory_gb: 8
      maximum_runs: 8
  falsification_conditions:
    - >-
      The measured ratio rho(r) DECREASES with r beyond the pre-registered 15
      percent tolerance on any family at any completed field size, and the
      random-sublattice control does not show the same decrease. P3 is false,
      the endomorphism lane is live, and independent review is mandatory before
      any interpretation.
    - >-
      Any cell has Hermite normal form index strictly below N while the
      eigenvalue control passes. P1 is false, which contradicts an elementary
      theorem and must be replicated independently before being reported as
      anything other than a suspected implementation error.
    - >-
      The shrinkage slope over exact-enumeration cells falls outside
      [0.85, 1.15] or its R^2 falls below 0.90. The Minkowski minimum is not
      being attained, the box is the wrong size, and the cost comparison is
      UNINTERPRETABLE. This is an inconclusive outcome, not a negative one.
    - >-
      Measured rho cost on an endomorphism-rich curve beats
      0.886 times sqrt(N / |Aut|) by more than 20 percent. The endomorphism
      benefit exceeds the classical automorphism quotient and must be explained
      before any other number in the run set is trusted.
    - >-
      The planted index-collapse positive control is NOT detected. The
      instrument cannot see a genuine determinant collapse, so every P1 negative
      it produces is void and the run set is INVALID rather than negative.
  interpretation_limits:
    - >-
      A confirmation is a SCOPED NEGATIVE about ONE attack strategy at toy
      sizes. It is not a lower bound, not a hardness proof, and not a statement
      about crypto-scale behaviour. It bounds what the endomorphism lane may be
      promoted to and nothing more.
    - >-
      All conclusions are scoped to prime-order subgroups over prime fields at
      16 to 28 bits with |Aut| in {2, 4, 6}. Nothing transfers to
      composite-order groups, extension fields, or supersingular curves over
      F_(p^2), where the endomorphism ring has rank 4 and the analysis differs
      materially.
    - >-
      CELLS ABOVE THE GENUINE ENDOMORPHISM BOUND ARE SYNTHETIC. r = 4 on J0 and
      r at least 3 on J1728 use uniformly drawn eigenvalues that correspond to
      no efficiently computable map. They test the lattice geometry and the cost
      model; they may never be described as a realizable attack configuration,
      and a claim about "an attack at r = 4" is not available from this design.
    - >-
      A refutation of P3 would be a structural signal about the augmented
      search, still bounded by generic-group lower bounds, and would require a
      fully charged end-to-end comparison before it changed any claim.
    - >-
      This hypothesis is NEW and independent of H-STR-002 and H-IC-001. It does
      not test, support, weaken or restore either of them; both remain
      `weakened` per DEC-20260727-009 and DEC-20260727-008 respectively, and
      nothing in this record or its experiment may be read as moving either.
  heuristic_assumptions:
    - id: HEUR-1
      statement: >-
        Witness equidistribution in the Minkowski box - for uniformly random k
        the number of nonzero witnesses of W_r in the box [-cX, cX]^(2r) is
        Poisson with mean (2cX+1)^(2r)/N, so at c = 1 the box holds Theta(4^r)
        witnesses and the balanced meet-in-the-middle succeeds with constant
        probability in one pass.
      rigorous_support: >-
        EXISTENCE is rigorous, not heuristic - Minkowski's convex body theorem
        gives a nonzero witness in the closed box at c = 1, since
        (2X+1)^(2r) is strictly greater than 2^(2r) times N when
        X = ceil(N^(1/(2r))). Only the COUNT is heuristic, and the count
        controls only how far the box must be inflated in practice. The
        classical statement imitated is Siegel's mean value theorem.
      validation_arm: RUN-ENDO-001-F-H1
    - id: HEUR-2
      statement: >-
        Eigenvalue genericity - apart from the algebraic relations forced by the
        endomorphism ring, the lambda_i behave like independent uniform elements
        of Z/N, so the first minimum attains the Minkowski bound instead of
        being forced short by an accidental relation.
      rigorous_support: >-
        NOT LOAD-BEARING FOR P1. Non-degeneracy of the congruence is rigorous
        because lambda_1 = 1 is a unit, so the index is exactly N
        unconditionally. HEUR-2 is used only to predict that the first minimum
        attains rather than undercuts the Minkowski bound.
      validation_arm: RUN-ENDO-001-G-H2
