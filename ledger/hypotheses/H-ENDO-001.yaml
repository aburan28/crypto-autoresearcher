hypothesis:
  id: H-ENDO-001
  question_id: RQ-ECDLP-002
  source_proposal: IDEA-20260726-002
  statement: >-
    For toy prime-field GLV curves — j = 0 with p = 1 mod 3 (phi(x,y) =
    (zeta_3*x, y), orbit length r = 3) and j = 1728 with p = 1 mod 4
    (phi(x,y) = (-x, i*y), orbits merged with negation, effective r = 2) —
    at 16, 20, and 24 bits with factor base B = ceil(sqrt(N)) chosen as a
    union of phi-orbits, two claims are tested separately. C1 (structure):
    the relation matrix satisfies M*Phi = Phi*M for the phi-shift
    permutation Phi, and its displacement rank with respect to the
    phi-shift generator pair is alpha <= r, clearly separated from the
    in-run random baseline alpha ~ min(R, B) (the generic maximum measured
    in EV-STR-001) — unlike the failed additive-translation AP approach.
    C2 (net LA-stage advantage): the relation-density penalty of the
    phi-orbit constraint is < B/alpha (the AP approach's 17.5x-4128x
    supply-side penalty, EV-STR-001, does not recur), and the structured-
    solve model cost alpha^2*B*ceil(log2 B) is at least 2x below the
    Wiedemann model cost 2*B^2*m at the largest tested B, so the LA saving
    is not swamped by the harvesting penalty. C1 and C2 are decided
    independently; a positive C1 with a negative C2 is the EV-STR-001
    failure mode for this route and is recorded as such.
  mechanism: >-
    phi is a group endomorphism defined over F_p, so phi(P + Q) = phi(P) +
    phi(Q) and the summation polynomial is phi-equivariant:
    S_{m+1}(phi(x_1),...,phi(x_m); phi(x_R)) = 0 whenever
    S_{m+1}(x_1,...,x_m; x_R) = 0. If F is a union of phi-orbits, every
    relation maps under phi to another relation with all summands in F, so
    the relation matrix commutes with the phi-shift permutation and is
    block-circulant with block size r; displacement-rank theory
    (KN-TECH-008) then gives alpha = O(r) and superfast structured solves
    in the alpha regime. How this differs from the EV-STR-001 failure: the
    AP approach constrained supports to additive x-interval translations,
    and ~50% non-residue gaps (x + d need not be a curve x-coordinate when
    x is) broke translation invariance, yielding alpha = min(R, B) in 32/35
    measurable instances, while the AP supply covered only 3-13% of the
    group (17.5x-4128x penalty). The phi-orbit constraint is multiplicative
    and exact — phi(F) = F for any orbit-closed F, with no non-residue
    gaps — and it does not restrict the x-support to an interval, so the
    expected penalty is only the orbit-alignment cost (~2-3x measured
    preliminarily in EV-STR-002). Relationship to EV-STR-002: H-STR-002
    already reported alpha = O(1) at B >= 200 on j = 0 curves with a ~2-3x
    penalty, but that evidence is preliminary, never independently
    reviewed, used a model-only cost comparison, had a noisy
    under-powered penalty measurement, and showed instance-dependent
    orbit-closure failures. H-ENDO-001 is the decisive replication and
    extension under a frozen protocol: new independent instances, both GLV
    families, a non-GLV generic-curve arm, in-run random and AP baselines,
    a phi-ablation control, verified Wiedemann solves, a penalty
    measurement powered at >= 200 decomposition tests per cell, and
    fully-charged end-to-end accounting.
  assumptions:
    - >-
      Each GLV curve carries an efficiently computable endomorphism phi of
      small order r defined over F_p (zeta_3 in F_p for j = 0; i in F_p for
      j = 1728), computable from public curve parameters.
    - >-
      F is constructed as a union of complete phi-orbits (orbit-closure is
      a design constraint on F, not a property of a random F); the
      construction records the orbit-completeness fraction per instance,
      because EV-STR-002 showed the effect is instance-dependent.
    - >-
      phi-equivariance of S_{m+1} (phi is a group endomorphism) lifts to
      matrix-level commutation M*Phi = Phi*M once negation/sign handling is
      bookkept by the pre-registered generator pair; any residual beyond
      that bookkeeping is a scientific falsifier, not an implementation
      detail.
    - >-
      The displacement rank alpha = O(r) survives lifting from x-coordinates
      to full point representations, including negation.
    - >-
      The relation-density penalty is measurable at toy scale with >= 200
      decomposition tests per arm per cell, repairing the noisy-penalty
      confound of EV-STR-002.
    - >-
      GLV curves are special curves with extra automorphisms; the GGM lower
      bound (KN-TECH-005) and the S*T^2 preprocessing bound (KN-LIT-013)
      still frame any end-to-end claim, and the endomorphism is precisely
      the non-generic structure the generic model excludes.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        For relation matrices of the tested dimensions (B <= ~4100) and
        densities, the frozen model-op comparison — structured solve
        alpha^2*B*ceil(log2 B) versus Wiedemann 2*B^2*m — preserves the
        ordering of actual finite-field operation counts of a superfast
        structured solve versus block Wiedemann, with deviations bounded by
        a factor below 2 at the tested scale, so the pre-registered 2x
        threshold decision is robust. The Wiedemann side is calibrated in
        run by verified solves with field-op counts.
      random_model_justification: >-
        Displacement-rank theory bounds the structured side at O~(alpha*n)
        classically and O~(alpha^(omega-1)*n) for larger alpha, and
        Wiedemann costs O(n) matrix-vector products at w nonzeros per row;
        the frozen formulas drop only constant and polylogarithmic factors,
        which at fixed toy dimensions are bounded and partially calibrated
        by the in-run verified solves. There is no distributional
        assumption beyond the measured alpha entering the formula.
      supporting_results:
        - >-
          KN-TECH-008: Kailath--Kung--Morf displacement rank and
          Bostan--Jeannerod--Schost superfast solvers (O~(alpha*n) /
          O~(alpha^(omega-1)*n)); Wiedemann / block-Wiedemann baselines
          (KN-LIT-016, KN-LIT-017) and the program's rule that alpha must
          be measured, not assumed.
        - >-
          EV-STR-001 (internal): the same model-op formulas were used with
          25 verified Wiedemann solves at 0.4-6.5 ms consistent with the
          model at toy scale; cited as methodological precedent, with its
          stated boundary that structured-solve time is model-evaluated,
          not a measured superfast solve.
      validation_experiment_ids: [EXP-ENDO-001]
      falsification_condition: >-
        The verified Wiedemann solves measured in run deviate from the
        2*B^2*m model by a factor outside [0.5, 2] at the largest tested B,
        in the direction that would invert the 2x threshold decision; or no
        consistent model-op calibration can be frozen across sizes.
  structural_ingredients:
    - description: >-
        Displacement-rank theory: a matrix with alpha = O(r) under a
        structured generator pair admits superfast solves
        (O~(alpha*n), O~(alpha^(omega-1)*n)).
      citation: KN-TECH-008
      role: converts measured alpha into the LA-stage cost model
    - description: >-
        Point-decomposition index calculus relation collection over a
        factor base; each relation is an independently checkable
        certificate.
      citation: KN-TECH-003
      role: supplies the relation matrices whose structure is measured
    - description: >-
        Open problem this hypothesis answers for the multiplicative
        (endomorphism) support design after the additive (AP) design
        failed.
      citation: KN-OPEN-006
      role: frames the two-sided alpha-versus-penalty question
  predictions:
    - metric: displacement_rank_alpha_of_phi_invariant_relation_matrix
      direction: lower
      minimum_effect: >-
        alpha <= r on at least 4 of the 6 GLV instances and at least one
        instance of each family, with complete separation from the in-run
        random baseline (alpha_phi <= r < 0.5*min(R, B) <= alpha_rand on
        those instances). Instance-dependent failures (poor orbit closure,
        as in EV-STR-002) are recorded and counted against the fraction,
        never dropped.
    - metric: phi_orbit_relation_density_vs_random_factor_base
      direction: lower
      minimum_effect: >-
        Median penalty = (random-base hit rate)/(phi-invariant hit rate)
        < B/alpha across GLV cells, each cell measured with >= 200
        decomposition tests per arm. The competing outcome, penalty
        >= B/alpha, falsifies the net-advantage claim C2 (the EV-STR-001
        failure mode).
    - metric: structured_solve_time_vs_wiedemann
      direction: lower
      minimum_effect: >-
        Model ops alpha^2*B*ceil(log2 B) <= 0.5 * (2*B^2*m) at the largest
        tested B on at least 4 of the 6 GLV instances, with the Wiedemann
        side calibrated by verified solves within a factor [0.5, 2] of the
        model. A ratio < 2x means the LA saving is within noise.
    - metric: non_GLV_generic_arm
      direction: different
      minimum_effect: >-
        On the generic-curve arm (j not in {0, 1728}, no known
        small-degree endomorphism beyond negation), the negation-orbit
        factor base gives alpha_neg <= 2 while its random baseline has
        alpha_rand >= 0.5*min(R, B). This separates universal involution
        structure (r = 2, every curve) from GLV specialness (r = 3 for
        j = 0; merged-quartic r = 2 for j = 1728); alpha_neg ~
        min(R, B) would falsify the equivariance-to-structure mechanism
        generically.
  test_boundary:
    instances:
      - >-
        9 toy prime-field curves at 16, 20, 24 bits: 3 families {j = 0 with
        p = 1 mod 3; j = 1728 with p = 1 mod 4; generic non-GLV} x 3 sizes,
        seeds {1, 2, 3} mapped one-to-one to sizes within each family.
      - 200 decomposition-test targets per factor-base arm per cell.
    parameters:
      factor_base_size: B = ceil(sqrt(N))
      decomposition_arity: m = 3 (S_4 systems)
      orbit_lengths: "j0: 3; j1728: 2 (negation-merged); generic_negation: 2"
      factor_base_arms: [phi_invariant, random_baseline, ap_benchmark, negation_orbit_generic]
      ap_benchmark_cells: 20-bit cells, D = {1..64}, following the EV-STR-001 protocol
      displacement_generator_pair: (Z_phi, Z_phi^T) with Z_phi the phi-shift cyclic operator; phi-ablation uses a random shift on the same matrices
    implementation: >-
      harness/endomorphism_la.py (EXP-STR-002 implementation base, to be
      extended under experiments/EXP-ENDO-001/ with the j = 1728 family,
      the generic arm, and the ablation operator), harness/semaev.py,
      harness/rho.py, harness/runner.py.
    budget:
      wall_clock_seconds_per_run: 1800
      total_wall_clock_seconds: 10200
      total_cpu_hours: 3.0
      maximum_memory_gb: 4
      maximum_runs: 12
  falsification_conditions:
    - >-
      C1 falsified (no structure): alpha_phi / min(R, B) >= 0.5 at the
      largest tested B on at least half the GLV instances — no separation
      from the random baseline, the block-circulant structure does not
      survive relation collection; or the commutation residual
      ||M*Phi - Phi*M||_0 > 0 beyond the pre-registered negation/sign
      bookkeeping on any instance; or alpha_neg ~ min(R, B) on at least 2/3
      of the generic-curve instances, falsifying the
      equivariance-to-structure mechanism generically.
    - >-
      C2 falsified (saving swamped): median phi-orbit relation-density
      penalty >= B/alpha, the EV-STR-001 failure mode recurring on the
      multiplicative design; or the structured-solve model ratio exceeds
      0.5 of the Wiedemann model at the largest B on at least half the GLV
      instances; or HEUR-001 is refuted (Wiedemann calibration outside
      [0.5, 2] of model in the threshold-inverting direction).
    - >-
      The fully-charged end-to-end total (penalty-adjusted relation
      collection + LA + descent + verification) exceeds matched rho at all
      tested B and m. At 16-24 bits this is EXPECTED (Groebner-bound
      descent dominates; cf. EV-IC-001) and therefore falsifies only an
      end-to-end toy-scale advantage, which this hypothesis does not claim;
      it does not falsify the LA-stage claims C1/C2 (see
      interpretation_limits).
  interpretation_limits:
    - >-
      Toy scale only (16-24 bits, B <= ~4100, GLV families). alpha = O(r)
      at these sizes says nothing about B = 2^128, crypto-scale behavior,
      or generic curves; nothing is claimed for curves without an
      efficiently computable endomorphism beyond negation.
    - >-
      A positive result replicates and extends EV-STR-002 (preliminary,
      unreviewed, model-only cost comparison, noisy penalty) under a frozen
      protocol with new instances, both GLV families, a generic arm, and
      measured solves: it upgrades evidence strength for H-STR-002's claim
      class; it is a structural LA-stage signal, not a breakthrough, and
      any end-to-end or crypto-scale claim would require separate
      fully-charged accounting and independent review.
    - >-
      The structured-solve advantage is model-evaluated
      (alpha^2*B*ceil(log2 B)) with the Wiedemann side calibrated by
      verified solves; it is not a measured superfast solve — the same
      boundary EV-STR-001 and EV-STR-002 state.
    - >-
      A negative result closes only the tested scope: these families,
      B = ceil(sqrt(N)), m = 3, this orbit-construction rule, this solver,
      these sizes. Other orbit constructions, arities, or families are not
      covered (rule 6).
  status: approved
  proposed_by: coordinator
