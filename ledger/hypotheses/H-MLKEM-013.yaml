hypothesis:
  id: H-MLKEM-013
  question_id: RQ-MLKEM-003
  goal_id: GOAL-MLKEM-003
  title: >-
    verifyModel Pwrong uses FFT/k_fft while Pgood uses raw cosine sum; after
    aligning by k_fft the Fig 4.1 coverage gap remains
  statement: >-
    In CodedDualAttack verifyModel (commit 9c1367f), the Pwrong path records
    scores equal to numpy.fft.fftn(...).real/k_fft while the Pgood path records
    the unnormalized cosine-sum Score_Function; these differ by exactly the
    constant k_fft on shared inputs. After dividing archived left-panel Pgood
    scores by k_fft=3, the fraction of aligned Pgood scores with T ≤ last
    positive Pwrong index remains 0, so H-MLKEM-011 survives scale correction.
  mechanism: >-
    RT-20260731-002 required a code audit of score units before treating the
    T-range comparison as load-bearing. An FFT normalization applied only on
    the uniform-target path creates a constant scale factor; correcting it
    shrinks but need not eliminate the coverage gap.
  predictions:
    - metric: scale_factor
      direction: different
      minimum_effect: equals_k_fft
    - metric: fraction_Pgood_aligned_inside_Pwrong_T_range
      direction: lower
      minimum_effect: equals_0
  falsification_conditions:
    - Synthetic check fails to recover exact factor k_fft between paths
    - After alignment, fraction_inside > 0.5
  interpretation_limits:
    - Does not by itself change Kyber Table 5.1 numbers
    - Strengthens, not weakens, the coverage-gap reading once units are fixed
  status: analyzed
  proposed_by: coordinator
  approved_by: coordinator
  approved_at: '2026-07-31'
  evidence_ids: [EV-MLKEM-013]
