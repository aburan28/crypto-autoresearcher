  title: >-
    The integer 32767 has 14 doublings and 14 additions
  statement: >-
    The integer 32767 has bit length 15. Its bits are fifteen 1s.
    Reaching it by doubling and adding uses 14 doublings and 14
    additions. Fifteen exceeds fourteen by 1. Fourteen equals fourteen,
    so that gap is 0. The product of 15, 14, and 14 is 2940. Their sum
    is 43. Two readings of the addition count are both 14, so that gap
    is 0 and their product is 196.
  mechanism: >-
    The proposal writes the counts 15, 14, and 14. This contract
    checks those integers. It does not add a curve point.
