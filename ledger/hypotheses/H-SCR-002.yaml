hypothesis:
  id: H-SCR-002
  question_id: RQ-CRYPTO-001
  source_proposal: IDEA-20260723-004
  statement: >-
    Applying the frozen repaired SOURCE-LOCATOR-OPEN admission sheet
    mechanically to the frozen corpus snapshot (the checked six-list
    Abel-Jacobi / source-location material, commit-pinned) yields a complete
    admissibility table in which zero items instantiate a semantically
    distinct explicit restricted-existence operation with occurrence-level
    signed source replay, with the first failure at
    requirement_1_explicit_semantically_distinct_operation, and complete
    charged exponents lambda and mu at most 0.45 with one fresh scalar-blind
    query inside B^(5/4+o(1)). The hypothesis is falsified if at least one
    frozen item passes all seven frozen requirements; that operation must
    then be recorded as an unfiled theorem candidate.
  mechanism: >-
    Static admission against the P1552/P1553 six-list frontier after the
    BATCH-005 no-candidate screen (EV-CRYPTO-005): each frozen item is
    checked against seven repaired requirements written into EXP-SCR-002 --
    (R1) explicit semantically distinct operation, (R2) mandatory
    O(1)-overhead GGM-simulator exclusion via an exact target-dependent
    transcript, (R3) subset-stable occurrence replay, (R4) deterministic rank
    or proved rank-yield tail with rejected batches charged, (R5) enumeration
    and charging of every restricted call, rebuild, and live state, (R6) one
    complete fresh scalar-blind query inside B^(5/4+o(1)) = N^(0.25+o(1)),
    (R7) complete lambda, mu at most 0.45 with unknown terms counted as
    failures and no admissible (0.45, 0.50] interval. No new algorithm is
    proposed by any outcome of this audit.
  assumptions:
    - >-
      Every audited artifact is content-pinned: the audit reads git blob
      content at the frozen snapshot commit, not the working tree.
    - >-
      The asymptotic regime is frozen: subgroup order N, factor scale
      B = N^(1/5), beta = 0.20, five signed coloured occurrence decks of size
      Theta(B), Theta(B) known-log relation targets, required verified rank
      Theta(B); hence B^(9/4) = N^0.45, B^(5/2) = N^0.50, B^3 = N^0.60, and
      B^(5/4) = N^0.25.
    - >-
      All exponents are in N and absorb poly(log(N)) factors only; field,
      group, and bit operations and memory traffic keep their
      polynomial-log conversion factors.
    - >-
      Expected Theta(B) random-occupancy relation count is not treated as
      observed or guaranteed rank; positive rank credit requires a
      deterministic rank guarantee or a proved lower tail over the frozen
      deck and target distribution.
    - >-
      The sheet's seven requirements are decidable per item from the pinned
      records; undecidable items are recorded undecidable_with_reason and
      never silently admitted or dropped.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: >-
        Generic-group square-root lower bound fixing the Pollard-rho baseline
        at N^(1/2+o(1)) and forcing any admitted operation to be non-generic
        with simulator separation.
      citation: >-
        Shoup, Lower Bounds for Discrete Logarithms and Related Problems,
        EUROCRYPT 1997 (KN-LIT-011); technique record KN-TECH-005.
      role: baseline_and_simulator_barrier
    - description: >-
        Tight generic preprocessing tradeoff S*T^2 = Omega~(n), used in the
        frozen sheet to show the B^(9/4) advice / B^(5/4) query rectangle is
        unreachable by any O(1)-overhead generic-simulable operation
        (S*T^2 = B^(19/4), polynomially below N = B^5).
      citation: >-
        Corrigan-Gibbs and Kogan, as recorded in technique record KN-TECH-005
        (KN-LIT-013).
      role: simulator_exclusion_bound
  reduction_chain: null
  predictions:
    - metric: admissible_operation_count
      direction: lower
      minimum_effect: >-
        exactly 0 among the 7 frozen audit items; any count above 0 falsifies
        the sheet-failure claim and the passing operation must be recorded.
    - metric: first_failed_requirement_distribution
      direction: different
      minimum_effect: >-
        requirement_1_explicit_semantically_distinct_operation is the first
        failure for every rejected item that presents no typed operation,
        matching the checked-snapshot record EV-CRYPTO-006.
    - metric: sheet_calibration_accuracy
      direction: higher
      minimum_effect: >-
        exactly 2 of 2 frozen calibration items receive their pre-declared
        verdicts (one ADMIT fixture, one reject at R1/R2), proving the sheet
        discriminates before any corpus verdict is read.
    - metric: requirement_matrix_completeness
      direction: higher
      minimum_effect: >-
        exactly 7 of 7 items receive a full R1-R7 verdict row with
        independent per-requirement statuses; incomplete rows invalidate the
        run.
  test_boundary:
    instances:
      - >-
        7 frozen audit items: the six excluded nonconstructors of the
        BATCH-006 sheet (supplied residue/source/scalar/B3-provenance,
        compact z_R/resultant/common-factor/source-dictionary, unnamed
        zero-minor/hyperplane locator, target-fitted coefficients/advice,
        determinant/pair-wedge/Abel-endpoint zero test, direct
        source-labelled 3+3 separator) plus the current explicit six-list
        source-labelled campaign control
      - 2 frozen calibration fixtures (one must-pass, one must-fail)
    parameters:
      beta_in_N: 0.2
      campaign_work_threshold_lambda: 0.45
      campaign_memory_threshold_mu: 0.45
      fresh_query_exponent_cap_tau: 0.25
      rho_baseline_exponent: 0.5
      snapshot_commit: b8af1551e45fbe4435745239d29f4d141eea3356
    implementation: >-
      Deterministic read-and-adjudicate audit applying the frozen repaired
      sheet in EXP-SCR-002 to git-blob-pinned corpus content; zero compute
      beyond table construction; no sampling and no curve arithmetic.
    budget:
      wall_clock_seconds_per_run: 1800
      total_wall_clock_seconds: 3900
      maximum_runs: 3
  falsification_conditions:
    - >-
      At least one frozen item passes R1-R7 with lambda, mu at most 0.45 and
      one fresh query inside B^(5/4+o(1)): the sheet-failure claim is
      refuted and the operation must be recorded as an unfiled theorem
      candidate for independent review.
    - >-
      An item rejected as a rename (R1) is demonstrated, from pinned records,
      to be semantically distinct from every excluded interface and to
      satisfy R2-R7.
    - >-
      A predicate is mechanically undecidable on a pinned record: the item is
      recorded undecidable_with_reason and the run is inconclusive for that
      item, blocking the scoped-absence success criterion without falsifying
      the hypothesis.
  interpretation_limits:
    - >-
      A zero-admissible table is a scoped sheet failure over the checked
      SOURCE-LOCATOR-OPEN material only: not an impossibility theorem for
      non-generic ECDLP, not a universal lower bound, and no closure of
      coordinate-sensitive operations outside the checked interfaces.
    - >-
      The B^3 = N^0.60 figure is the complete cost of the named direct
      materialized control, not a proved lower bound for every possible
      source-faithful algorithm; the zero count rests first on the absence of
      a supplied explicit operation.
    - >-
      The audit is zero-compute static admission: no empirical run, no curve
      execution, no cryptographic-scale evidence; claim tier is bounded by
      the checked snapshot's scope.
    - >-
      Sheet-calibration failure invalidates the audit as an instrument
      failure; it is evidence for nothing (AGENTS.md rule 5).
    - No ECDLP algorithm, solve, or breakthrough is claimed by any outcome.
  status: approved
  proposed_by: coordinator
