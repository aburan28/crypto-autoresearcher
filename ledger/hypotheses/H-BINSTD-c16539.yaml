  title: >-
    Independent replication: second diversity catalog seed + independent
    twin meters reproduce floors_met and Spearman ρ(r_Tr, N_nl) ≤ −0.70
    on n=17 Stage-1 cells after EV-BINSTD-d3a6be

  statement: >-
    CLAIM (heuristic_validation / encoding-structure instrument; NO ATTACK;
    NO EXPONENT). Independent replication of H-BINSTD-6d5b4a after
    EV-BINSTD-d3a6be (O-SUPPORT → replicate / preliminary under
    EXP-BINSTD-871156 seed 202610038196). Using a NEW diversity catalog
    seed 202610039715 (≠ 202610038196 parent; ≠ 202610038782 v1) and
    independent twin-meter code under EXP-BINSTD-6fd454 (Twin B bottom-up
    pivot search), FORALL Stage-1 cells (n,ℓ)∈{(17,3),(17,4)}: (i) ADMISSION
    — twin meters agree and catalog yields ≥3 distinct r_Tr and ≥2 distinct
    N_nl; (ii) only after (i), Spearman's ρ(r_Tr, N_nl) ≤ −0.70 (O-SUPPORT)
    OR fails the band (O-FAIL-BAND). If (i) fails → O-INCONCLUSIVE. NO break.
    NO n≥131 transfer. Do NOT re-run EXP-BINSTD-871156.

  mechanism: >-
    Same OBJECT FRAME and encoder pin as H-BINSTD-6d5b4a / IDEA-20261003-43f871.
    WHAT IS NEW for replication: (1) second catalog seed 202610039715;
    (2) independent twin-meter reimplementation (encode_s3 Twin B bottom-up
    pivot search) under a new EXP directory; (3) forbidden-seed gate covers
    both parent 202610038196 and v1 202610038782. Admission floors and
    Spearman ≤−0.70 band unchanged.

  predictions:
    - metric: distinct_rTr_values
      direction: lower_bounded
      minimum_effect: '≥ 3 distinct r_Tr values per Stage-1 cell (admission)'
    - metric: distinct_Nnl_values
      direction: lower_bounded
      minimum_effect: '≥ 2 distinct N_nl values per Stage-1 cell (admission)'
    - metric: spearman_rTr_vs_Nnl
      direction: upper_bounded
      minimum_effect: '≤ −0.70 at each Stage-1 cell after admission'
    - metric: catalog_size
      direction: lower_bounded
      minimum_effect: '≥ 24 distinct V shapes per Stage-1 cell'
    - metric: twin_agreement
      direction: same
      minimum_effect: >-
        r_Tr path A = path B and N_nl path A = path B on every measured V

  test_boundary:
    instances:
      - 'Stage 0: rank-diversity-seeking freeze for (n,ℓ)∈{17,19,23}×{3,4}; twin probe'
      - 'Stage 1 authorized: (n,ℓ)∈{(17,3),(17,4)} admission floors then Spearman'
    parameters:
      spearman_band: -0.70
      catalog_seed: 202610039715
      bootstrap_seed: 202610039716
      bootstrap_reps: 200
      min_catalog: 24
      max_catalog: 128
      floor_rTr: 3
      floor_Nnl: 2
      forbidden_parent_seed: 202610038196
      forbidden_v1_seed: 202610038782
      moduli:
        17: t^17+t^3+1
        19: t^19+t^5+t^2+t+1
        23: t^23+t^5+1
    implementation: >-
      Pure Python under experiments/EXP-BINSTD-6fd454/implementation/;
      command surface implementation/run.py driven by trial-plan-v1.json.
      Independent twin meters in encode_s3.py. No Magma/Sage/AUXIN/Bedrock.
    budget:
      wall_clock_seconds: 7200
      memory_gb: 2
      maximum_runs: 4

  falsification_conditions:
    - Twin meters disagree on any measured V (O-ARTIFACT; table void).
    - Editing the Spearman band after Stage-0 freeze (protocol invalid).
    - Re-using parent seed 202610038196 or v1 seed 202610038782 (O-ARTIFACT).
    - Claiming practical binary IC or an exponent move from a toy Trace-rank
      correlation (KR-IC-1fcdbc).
    - Transferring the band to n≥131 without a new contract.
    - Catalog collapses below admission floors (O-INCONCLUSIVE).

  distinguishable_outcomes:
    - id: O-SUPPORT
      meaning: >-
        Twin OK; admission floors met on every Stage-1 cell; ρ(r_Tr, N_nl)
        ≤ −0.70 on every Stage-1 cell under the second seed / independent
        meters. No attack claim.
    - id: O-FAIL-BAND
      meaning: >-
        Twin OK; floors met; ρ > −0.70 on at least one Stage-1 cell.
    - id: O-INCONCLUSIVE
      meaning: >-
        Catalog collapses below distinct_rTr≥3 or distinct_Nnl≥2 on a
        completed cell after diversity-seeking freeze (max ≤128).
    - id: O-ARTIFACT
      meaning: >-
        Twin disagreement, freeze/regression failure, or forbidden prior
        seed reuse. No band claim kept.
    - id: O-IMPEDIMENT
      meaning: >-
        Infrastructure timeout/crash/missing Stage-0 freeze. Never negative
        evidence against H-BINSTD-c16539 / H-BINSTD-6d5b4a.

  interpretation_limits:
    - Encoding-structure instrument only; does not predict yield or beat rho.
    - Independent replication of EV-BINSTD-d3a6be scope only; does not rewrite it.
    - Stage-2 (n∈{19,23} + shuffled-linear null) not authorized under this card.
    - No attack at field degree ≥ 131. ECC2K-130 is not an instance.
    - Not a re-run of EXP-BINSTD-871156.

  heuristic_assumptions:
    - id: HEUR-BINSTD-878222-H1
      formal_statement: >-
        FORALL (n,ℓ)∈{17}×{3,4} Stage-1 cells: AFTER ≥3 distinct r_Tr and
        ≥2 distinct N_nl across the frozen rank-diversity-seeking catalog,
        Spearman ρ(r_Tr, N_nl) ≤ −0.70 where r_Tr is the rank of the
        Trace-derived linear block and N_nl is the residual nonlinear XOR-SAT
        clause count after eliminating those linears.
      random_model_justification: >-
        Same as H-BINSTD-6d5b4a. Replication asks whether O-SUPPORT under
        seed 202610038196 / EXP-BINSTD-871156 meters recurs under a second
        seed and independent Twin-B implementation.
      supporting_results:
        - EV-BINSTD-d3a6be
        - EV-BINSTD-56dda7
        - KR-IC-f5c584
      validation_experiment_ids:
        - EXP-BINSTD-6fd454
        - EXP-BINSTD-871156
      falsification_condition: >-
        Floors met and Spearman ρ > −0.70 at a completed Stage-1 cell
        (O-FAIL-BAND), OR twin failure (O-ARTIFACT), OR floors unmet
        (O-INCONCLUSIVE), OR Trace extractor absent (O-IMPEDIMENT).

  asymptotic_claim:
    problem: >-
      Independent replication of Trace-linear rank as predictor of residual
      nonlinear XOR-SAT clause count on toy binary IC cells
    prior_best: >-
      EV-BINSTD-d3a6be (O-SUPPORT preliminary under EXP-BINSTD-871156)
    time_exponent: >-
      NO EXPONENT MOVED. Encoding-structure instrument only.
    memory_exponent: Negligible — store per-V r_Tr and N_nl.
    hidden_cofactor: Encoder constants + diversity-seeking catalog construction.
    claim_kind: heuristic_validation

  proof_search_map:
    bottleneck: >-
      Whether EV-BINSTD-d3a6be O-SUPPORT recurs under a second catalog seed
      and independent twin meters on the same Stage-1 cells.
    baseline_embedding:
      parameter_slice: >-
        n=17, ℓ∈{3,4}; seed 202610039715; parent seed 202610038196 forbidden;
        twin r_Tr and N_nl must agree before any Spearman panel is read.
      reproduction_check: >-
        Independent check.py recomputes twin r_Tr/N_nl on the Stage-0 probe,
        verifies catalog seed ∉ {202610038196, 202610038782}, and re-checks
        admission floors + band polarity against the frozen ≤−0.70 band.
    observation_collision:
      observable: 'Spearman ρ(r_Tr, N_nl) vs −0.70 band per (n,ℓ) after floors'
      distinct_preimage_search: >-
        Held band could arise from Trace-dominated removable work (claim),
        catalog/seed artifact (tested by second seed), or twin-encode
        artifact (tested by independent Twin B). Stage-2 null not authorized.
    constructive_transforms:
      - transform: measurement_instrument
        proposed_object: >-
          Second diversity seed + independent Twin B + admission floors +
          frozen Spearman ≤−0.70 band.
        predicted_gain: >-
          Replication strength for HEUR-BINSTD-878222-H1 at toys, or a
          seed/meter-scoped failure that blocks support.
    quantifier_order: >-
      FORALL Stage-1 cells (17,3) and (17,4): AFTER admission floors,
      ρ(r_Tr, N_nl) ≤ −0.70 is PREDICTED. NOT CLAIMED: Stage-2; n≥131; attack.
    method_ceiling:
      strongest_certifiable_claim: >-
        On the named Stage-1 toy cells, after floors, measured Spearman ρ
        lies ≤ or > the frozen −0.70 band, with twin agreement, under the
        second seed / independent meters.
      nearby_object_control: >-
        Twin disagreement (artifact); floors unmet (inconclusive); forbidden
        prior seed (artifact). Stage-2 null not authorized.
    proof_obligations:
      - claim: Twin r_Tr and N_nl paths agree on every measured V.
        responsibility: baseline
      - claim: Admission floors gate any band verdict.
        responsibility: baseline
      - claim: Catalog seed is neither parent 202610038196 nor v1 202610038782.
        responsibility: baseline
      - claim: Band polarity is Spearman ≤ −0.70 (not ≥).
        responsibility: baseline

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
