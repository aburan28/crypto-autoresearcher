    stores 32. Two to the power 6 is 64. Two to the power 5 is 32.
    Sixty-four exceeds thirty-two by 32. The product of the two
    table sizes is 2048. Their sum is 96. Two width-6 tables each
    store 32, so that gap is 0 and their product is 1024.
  mechanism: >-
