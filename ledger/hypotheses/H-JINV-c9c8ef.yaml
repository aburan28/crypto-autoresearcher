hypothesis:
  id: H-JINV-c9c8ef
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  source_idea_ids:
    - IDEA-20261006-79bd0d
  added: '2026-10-07'
  status: specified
  proposed_by: coordinator
  title: >-
    Scaling-automorphism counts 6 and 2 on two models over F_13
  statement: >-
    Let E_0 be y^2 = x^3 + 1 over F_13, which has j-invariant 0, and
    let E_gen be y^2 = x^3 + x + 1 over F_13. A scaling automorphism
    is a u in F_13-star such that (x, y) mapped to (u^2 x, u^3 y)
    preserves the equation, counted as distinct pairs (u^2, u^3).
    The number of such u on E_0 is exactly 6, and the number on
    E_gen is exactly 2. A count on E_gen of 3 or more, or a count on
    E_0 other than 6, on a pair that is nonsingular and ordinary with
    j(E_gen) neither 0 nor 1728, is the concrete negative. No
    discrete logarithm is computed, and the generic-group exponent
    1/2 is unchanged.
  mechanism: >-
    PAIR (representation, Sigma), carried from IDEA-20261006-79bd0d.
    The representation is the scaling parameter u in F_13-star.
    Sigma is the set of maps (x, y) mapped to (u^2 x, u^3 y) that
    preserve the short-Weierstrass equation. Sigma is not
    translation. The projection keeps only the count of such u.
    Explanation A: E_0 has exactly the six scalings from u^6 = 1,
    and E_gen has exactly u = plus or minus 1, so the only gap is
    the constant sqrt(6) versus sqrt(2) already stated in
    KR-RHO-0528e7. Explanation B: E_gen has a third scaling, so a
    non-special j carries an extra rational automorphism that the
    sqrt(|Aut|) constant does not price. No rho walk is run.
  assumptions:
    - >-
      E_0 and E_gen are nonsingular and ordinary over F_13. A
      singular or supersingular model is a failed setup.
    - >-
      j(E_gen) is neither 0 nor 1728. If it is, the non-special arm
      is invalid.
    - Two u that induce the same map (u^2, u^3) are counted once.
  proof_search_map:
    bottleneck: >-
      Whether a non-special j over F_13 has more than two scaling
      automorphisms.
    baseline_embedding:
      parameter_slice: >-
        One prime, p = 13, and two models. No rho iteration is run.
      reproduction_check: >-
        The identity u = 1 is a scaling automorphism of both models.
        If it is not, the count is invalid. The map u = -1 on E_gen
        must be counted.
    observation_collision:
      observable: the integer count of scaling automorphisms
      distinct_preimage_search: >-
        Distinct j-invariants can share a count of 2. A count of 3
        or more on E_gen is the collision that kills explanation A.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: the pair of models at p = 13
        predicted_gain: >-
          Two integers, 6 and 2. No exponent.
    quantifier_order: >-
      At p = 13, the scaling-automorphism count of E_0 is 6 and the
      count of E_gen is 2. This is one prime, not every prime.
    method_ceiling:
      strongest_certifiable_claim: >-
        The non-special model has no extra scaling automorphism
        beyond negation at p = 13, or it has at least one.
      nearby_object_control: >-
        The map u = -1 on E_gen, which must be counted. If negation
        fails the equation, the instrument is wrong.
    proof_obligations:
      - claim: both models are ordinary and nonsingular
        responsibility: baseline
      - claim: the count on E_0 is 6
        responsibility: correctness
      - claim: the count on E_gen is 2
        responsibility: strictness
    not_applicable_reason: >-
      No exponent is claimed. The map is still filled for this one
      prime.
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        On a short-Weierstrass model with A and B both nonzero and
        j not in {0, 1728}, the only u in F_p-star with A u^4 = A
        and B u^6 = B are u = plus or minus 1. On y^2 = x^3 + B the
        same condition is u^6 = 1, and the number of solutions in
        F_p is gcd(6, p - 1). At p = 13 that gcd is 6.
      random_model_justification: >-
        This imitates the unit group of the order of discriminant
        -3. Transfer of that unit count onto these two models at
        p = 13 is the heuristic. It is not a new theorem.
      supporting_results:
        - >-
          KR-RHO-0528e7, opened in this session, states the rho
          discount sqrt(6) for j = 0 and sqrt(4) for j = 1728, and
          says the exponent stays 1/2. It does not compute the count
          at p = 13.
      validation_experiment_ids: []
      falsification_condition: >-
        At this pair, count_generic is not 2, or count_j0 is not 6,
        on models that pass the ordinary and nonsingular checks. If
        the identity is missing, refuse the count.
  structural_ingredients:
    - description: >-
        An automorphism group of order m reduces rho iterations by
        sqrt(m). The opened row gives sqrt(6) for j = 0 and sqrt(4)
        for j = 1728. This census does not change that constant and
        does not beat it.
      citation: KR-RHO-0528e7
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-0528e7.yaml
      role: automorphism discount the two counts are compared with
    - description: >-
        A generic algorithm needs a square-root number of group
        operations. This hypothesis does not beat that bound.
      citation: KR-RHO-13bf67
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
      role: exponent ceiling
  predictions:
    - metric: number of scaling automorphisms of E_0
      direction: different
      minimum_effect: exactly 6
    - metric: number of scaling automorphisms of E_gen
      direction: different
      minimum_effect: exactly 2
  test_boundary:
    instances:
      - y^2 = x^3 + 1 over F_13
      - y^2 = x^3 + x + 1 over F_13
    parameters:
      prime: 13
      units_scanned: 12
    implementation: >-
      Direct scan of u in F_13-star. No driver is bound in this
      record. No rho walk.
    budget:
      maximum_runs: 1
  falsification_conditions:
    - >-
      On a nonsingular ordinary pair with j(E_gen) neither 0 nor
      1728, count_generic is 3 or more, or count_j0 is not 6.
    - >-
      The identity u = 1 is missing on either model, or u = -1 is
      missing on E_gen. No count from that run is admissible, and
      the failure is not the concrete negative above.
  interpretation_limits:
    - >-
      A count of 6 against 2 is the constant in KR-RHO-0528e7. It
      does not change the exponent 1/2.
    - No discrete logarithm is computed.
    - Failure at p = 13 is a failure at p = 13 only.
  status_note: >-
    specified means the protocol is written. It does not mean
    approved. EXP-JINV-dfebe7 is review_required.
