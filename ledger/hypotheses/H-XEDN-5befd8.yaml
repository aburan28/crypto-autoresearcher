  title: 'Faithful-target eligibility: odd-order points of y^2=x(x^2-x+16) have square x, so at p = 3 mod 4
    a faithful pair occupies only the (+,+) arm'
  statement: 'On E^: y^2=x(x^2-x+16) over F_p, p in {31,43,59,83,353}, call a target pair faithful when
    both points have odd order. (F1) Every odd-order affine point has x^ a nonzero quadratic residue.
    (F2) At p = 3 mod 4 (31, 43, 59, 83) no odd-order point is minus-sign eligible (-x^ is never a
    square), so a faithful pair among the 32 frozen pairs has no opposite-sign and no (-,-) eligible arm;
    at p=353 (1 mod 4) every odd-order point is eligible for both signs. (F4) D^=A^2-4B=-63 is a
    quadratic non-residue at 31, 59, 83 and 353 and a residue at 43; -16 is a residue only at 353. (F5,
    corollary of F1, F2, F4, scoped to these five primes) the opposite-sign lemma of H-XEDN-0ea2b6 applies
    to no faithful target at the four p = 3 mod 4 primes. (F3, a derivation not tested by the census) a
    relation aP+bQ=tau over Q reducing to a faithful pair inside a subgroup of prime order l not dividing
    |E(Q)_tors| has tau=O, so no T-shift lift and no torsion-term relation is faithful.'
  mechanism: 'alpha^: E^(F_p) -> F_p*/F_p*^2, (x,y) -> x mod squares, (0,0) -> B^=16, is the 2-isogeny
    descent homomorphism. Its target has exponent 2, so it kills 2E^(F_p); an odd-order point P of order
    n equals 2*((n+1)/2)P and so lies in 2E^(F_p), hence x^ is a nonzero square (F1). At p = 3 mod 4, -1
    is a non-residue, so exactly one of x^, -x^ is a square and the minus sign is closed for odd-order
    points (F2). The map is lossy: it discards the odd part, so it retains nothing about a prime-order
    discrete logarithm. F4 is a finite table of Legendre symbols.'
  assumptions:
  - good reduction of y^2=x(x^2-x+16) at every listed p (B^*D^ = 16*(-63) is nonzero mod each p)
  - F1-F5 are producer derivations in ledger/proposals/IDEA-20261016-633cb1.notes.md, unreviewed
  - the 32 frozen pairs are analysis/xedni-cheon/20261007-certificates/targets.json, unchanged
  - 'eligibility of a sign arm means: the frozen t-rule (ascending t in [1,64], signed t^2 == x mod p,
    first four) returns at least one representative for each point'
  proof_search_map:
    bottleneck: which sign arm a prime-order DLP target can occupy
    baseline_embedding:
      parameter_slice: p=353 historical x^=9,17
      reproduction_check: both residues, both signs open
    observation_collision:
      observable: chi(x^)
      distinct_preimage_search: odd- and even-order points with equal chi=+1; chi is a one-way test
    constructive_transforms:
    - transform: observable_fiber
      proposed_object: the image of the odd-order subgroup under alpha^ (trivial by F1)
      predicted_gain: none for the DLP; a restriction of which frozen arms carry faithful targets
    quantifier_order: 'for all odd-order P^ != O: chi=+1 (not iff)'
    method_ceiling:
      strongest_certifiable_claim: arm emptiness for faithful pairs at p=3 mod 4
      nearby_object_control: unfaithful pair p31-pair00 (chi=+1,-1) is opposite-sign
    proof_obligations:
    - claim: alpha^ is a homomorphism on E^(F_p) for odd p with B^*D^ != 0 (F1 premise)
      responsibility: correctness
    - claim: odd-order points lie in 2E^(F_p), so alpha^ is trivial on them (F1)
      responsibility: correctness
    - claim: at p = 3 mod 4 the minus sign is closed for every nonzero square x^ (F2)
      responsibility: scope
    - claim: a faithful relation in an l-subgroup with l not dividing |E(Q)_tors| has tau=O (F3; derivation,
        routed to independent review, not tested here)
      responsibility: scope
    not_applicable_reason: null
