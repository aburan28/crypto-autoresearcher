    statement: >-
      over the 17x17 ordinate progression (w,z) is uniform mod n=|s^2-t^2| (same-sign) or m=s^2+t^2
      (opposite), so P[A integral]=rho(n)/n, rho(n)=#{(w,z) mod n: w^2=z^2}/n (2^omega(n), n odd squarefree)
    rigorous_support: CRT count of w^2=z^2 mod n; exact for uniform (w,z)
    validation_plan: observed accepted cells per (arm,p) vs sum 289*rho/n over (s,t) reps; tail = (s,t) sharing
