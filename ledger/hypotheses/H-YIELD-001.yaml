hypothesis:
  id: H-YIELD-001
  question_id: RQ-ECDLP-002
  statement: >-
    SETTING. Let p be a prime, let E/F_p be an elliptic curve whose group
    G = E(F_p) has PRIME order N, let I be the x-coordinate interval
    {0, 1, ..., L-1} with L = round(p^beta), and let the factor base be
    F = {P in G such that x(P) lies in I}, of measured size B = |F|. Because N is
    prime and odd there is no point of order 2, so F is closed under negation and
    B is even. For an arity m, say that a target T in G DECOMPOSES if T is the
    sum of some m-element multiset drawn from F (repetition allowed; the sign of
    each summand is already carried by the closure of F under negation, so this
    is exactly the Semaev m-fold relation shape). Write S_m for the SET of such
    sums, so that the measured yield is |S_m| / N, and write the counting
    heuristic that every index-calculus cost model in this ledger charges against
    as h = B^m / (m! p).
    THE CLAIM, IN THREE PARTS.
    (Y1) UPPER BOUND, ASSERTED AS EXACT AND NOT AS AN APPROXIMATION. The measured
    yield NEVER exceeds the counting heuristic by more than the elementary
    multiset factor. Precisely, |S_m| is at most C_all = C(B+m-1, m), so the
    observed-over-heuristic ratio R = (|S_m| / N) / h satisfies
    R <= (p/N) * prod_{j=0}^{m-1} (1 + j/B).
    This is a counting bound, not a statistical expectation, and it holds for
    every curve, every prime p, every interval and every arity. It is derived in
    the mechanism below and it is elementary; NO NOVELTY IS CLAIMED FOR IT.
    (Y2) THE NULL. After the two known corrections are applied - the multiset
    factor of Y1, and the birthday (occupancy) correction for collisions among
    the m-multiset sums - the residual efficiency
    E = |S_m| / P_pred, where P_pred is the occupancy prediction defined in the
    mechanism, equals 1 up to chance fluctuation, and DOES NOT DECAY WITH p at
    fixed (beta, m) over the tested range.
    (Y3) THE THREE COMPETING OUTCOMES, PRE-REGISTERED. (a) E is 1 within a band
    and shows no trend in p, so the counting heuristic is correct at toy scale
    once the two known corrections are made, and every index-calculus cost model
    in this ledger is correctly parameterized on this quantity at these sizes.
    (b) E exceeds 1 by a factor growing in p - THE ONLY EVENT ON THE PRESENT
    FRONTIER THAT WOULD REOPEN A PRIME-FIELD EXPONENT BELOW ONE HALF - which Y1
    EXCLUDES A PRIORI on this metric, so that an observation of it is an
    instrument defect and never a discovery. (c) E decays with p at fixed
    (beta, m), so the yield falls further below the heuristic as the field grows,
    every index-calculus cost model in this ledger is OPTIMISTIC and must be
    re-charged, and the shortfall itself is exponent-relevant in the pessimistic
    direction.
    WHICH WAY THE EXISTING EVIDENCE POINTS, QUOTED WITHOUT FLATTERING IT.
    EV-STR-001 measured a yield penalty spanning 17.5x to 4128.6x across its
    tested cells - medians 17.5x and 214.9x at n = 211, 41.9x and 924.5x at
    n = 1009, and 87.8x and 4128.6x at n = 4099, for m = 3 and m = 4 respectively
    - a RANGE that record states grows with field size and superlinearly in m.
    THE SINGLE FIGURE 17.5x IS NEVER CHARACTERISTIC AND MUST NOT BE QUOTED ALONE.
    DEC-20260727-009 separately measured a 2.62x to 3.20x density penalty. Both
    are directionally consistent with outcome (c). Both were measured under
    factor-base conventions DIFFERENT from this hypothesis's x-interval
    B = p^beta convention - EV-STR-001 used an arithmetic-progression support
    constraint at B = ceil(sqrt(n)) with shift set D = {1..64} - so neither is a
    prediction for the cells tested here, and the comparison is QUALITATIVE only.
  mechanism: >-
    WHY THE COUNTING HEURISTIC IS AN UPPER BOUND (Y1). Every decomposable target
    is the sum of at least one m-element multiset from F. The number of
    m-element multisets from a set of size B is exactly
    C_all = C(B+m-1, m) = (B)(B+1)...(B+m-1)/m!, so |S_m| <= C_all, hence also
    |S_m| <= min(C_all, N). Dividing by N and by h = B^m/(m! p) gives
    R <= (p/N) * (C_all * m! / B^m) = (p/N) * prod_{j=0}^{m-1} (1 + j/B).
    The factor prod (1 + j/B) is at most exp(m(m-1)/(2B)) and tends to 1 as B
    grows, and (p/N) lies within 2/sqrt(p) of 1 by Hasse. So the counting
    heuristic OVERSTATES the true yield by at least the collision loss and can
    understate it only by a vanishing amount. THIS IS AN ELEMENTARY,
    SCALE-FREE, PAPER-CHECKABLE FACT, and its consequence is the load-bearing one
    for this program - outcome (b), an excess growing in p, is not an empirical
    question on this metric at any scale.
    WHAT SCOPE THE BOUND HAS, AND WHERE IT DOES NOT APPLY. It applies to the
    fixed-factor-base, fixed-arity, unweighted decomposition shape defined above,
    which is the shape the Semaev relation and every cost model in this ledger
    use. It does NOT apply to a decomposition allowing integer coefficients
    beyond the sign already carried by F, to an adaptively grown factor base, to
    the NUMBER of distinct decompositions of a single target (which is not
    bounded by C_all/N), or to any construction that enlarges the reachable set
    by a means other than summing m elements of F. Any of those is a different
    quantity and this hypothesis says nothing about it.
    THE NULL MODEL AND WHAT IT CORRECTS FOR (Y2). Model the map from m-multisets
    to G as uniformly random. Two structural facts are known in advance and are
    put INTO the null rather than being left to be rediscovered as a signal.
    FIRST, CANCELLATION. Because F is closed under negation, any multiset
    containing both P and -P has its sum equal to that of the remaining
    (m-2)-multiset, so those multisets contribute nothing new beyond S_(m-2). The
    number of m-multisets from F containing NO cancelling pair is exactly
    C_red = sum_{k=1}^{m} C(B/2, k) * C(m-1, k-1) * 2^k,
    obtained by choosing k of the B/2 sign classes, splitting m into k positive
    multiplicities, and choosing one sign per used class. For m = 2 this is
    B^2/2, exactly C_all minus the B/2 cancelling pairs; for m = 3 it is
    B + B(B-2) + B(B-2)(B-4)/6, which is about 3/B below C_all in relative terms
    and is therefore a 6.7 percent correction at B = 42 - large enough that
    ignoring it would eat most of a plus-or-minus 10 percent criterion band.
    SECOND, OCCUPANCY. Throwing C_red balls into N bins covers
    N(1 - exp(-C_red/N)) distinct bins in expectation, and the cancelling
    multisets cover exactly S_(m-2), whose elements are already reachable. Hence
    P_pred = N(1 - exp(-C_red/N)) + |S_(m-2)| * exp(-C_red/N),
    with |S_0| = 1 (the identity) and |S_1| = B. E is defined as |S_m| / P_pred,
    and the null value of E is 1 BY CONSTRUCTION rather than by fitting.
    WHAT COULD MAKE E DEPART FROM 1, WHICH IS THE MECHANISM UNDER TEST. The
    factor base is an x-INTERVAL, not a random set. If the sums of m points whose
    x-coordinates lie in a short interval concentrate - because of the group law
    over the interval, because of the two-to-one x-to-point map, or because of
    any algebraic structure of the summation relation not captured by the two
    corrections above - then reachable targets are LOST to collisions beyond the
    birthday rate and E falls below 1. If instead they spread more evenly than
    random, E rises toward the Y1 ceiling and no further. The experiment
    discriminates the two by measuring E exhaustively across four field sizes at
    fixed (beta, m), against a factor base randomisation that must DESTROY any
    interval-specific effect.
    WHY THE MEASUREMENT IS INSTRUMENT-INDEPENDENT. Decomposition is decided by
    membership in a hash set of factor-base m-sums. NO GROEBNER BASIS, NO
    POLYNOMIAL SYSTEM SOLVE AND NO SUMMATION POLYNOMIAL IS COMPUTED ANYWHERE, and
    harness/endomorphism_la.py is not imported. That is deliberate and it is the
    reason this measurement does not inherit the instrument question that
    DEC-20260727-009 left UNADJUDICATED about that module, where a primary metric
    may have been a statistic of insertion bookkeeping rather than of the
    quantity it named.
  assumptions:
    - >-
      N is prime, so G has no proper subgroup, no point of order 2, every
      non-identity point generates, and every group element is a legitimate
      target. This removes cofactor and subgroup-structure confounds entirely and
      is enforced by the curve selection rule rather than assumed of a given
      curve.
    - >-
      B is measured, never modelled. The interval length L = round(p^beta) is the
      independent variable; B = |F| is counted exactly and is what enters
      h = B^m/(m! p), C_all and C_red. B is close to L in expectation - about
      half of the x in I admit points and each such x gives two - with
      fluctuation of order sqrt(L), and no criterion is evaluated on L.
    - >-
      The census is carried out in the discrete-logarithm image. The full
      discrete-log table of G with respect to a fixed generator is built once per
      field size by walking N multiples of that generator, after which every
      point is an integer modulo N and an m-sum is an integer addition. This is
      legitimate because the quantity measured is a combinatorial property of the
      factor base's image in G, and it is NOT an attack technique and confers no
      attack advantage - building the table costs N group operations, which
      already exceeds the 0.886 sqrt(N) a matched Pollard rho needs to solve the
      instance outright. Its correctness is not assumed - it is checked by a
      control that recomputes sampled m-sums directly on the curve.
    - >-
      Matched Pollard rho with negation at 0.886 sqrt(N) group operations at
      N^{o(1)} memory, and matched BSGS at about 2 sqrt(N) group operations with
      sqrt(N) stored group elements, are mandatory controls, MEASURED at these
      toy sizes rather than only modelled, and counted in the same unit as every
      other operation count reported.
    - >-
      Chance fluctuation of E under the null is of order sqrt(h/(2 C_red)), which
      at every criterion-evaluable cell of the tested design is below 2 percent.
      A plus-or-minus 10 percent band on E is therefore a STRUCTURE band and not
      a noise band. This is asserted here and is CHECKED at execution against the
      empirical null spread, not taken on trust.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        (Occupancy null for m-multiset sums.) For the factor base F defined
        above, arity m and prime group order N, the number of distinct sums
        satisfies |S_m| = P_pred * (1 + o(1)) with
        P_pred = N(1 - exp(-C_red/N)) + |S_(m-2)| exp(-C_red/N), where C_red is
        the exact cancellation-free multiset count given in the mechanism, with
        the o(1) uniform over beta in the unsaturated band and over the tested
        field sizes.
      random_model_justification: >-
        The multiset-to-group-element map is modelled as a uniformly random map
        into a set of size N, which is the same model every index-calculus cost
        model in this ledger already assumes implicitly when it writes the yield
        as B^m/(m! p). The two structural departures known in advance - the
        negation closure of F, and the fact that lower-arity sums are already
        reachable - are removed from the model exactly rather than absorbed into
        the o(1).
      supporting_results:
        - >-
          RIGOROUS BOUND - the multiset counting bound |S_m| <= C(B+m-1, m),
          derived in the mechanism of this record, elementary and paper-checkable.
        - >-
          CLASSICAL DISTRIBUTION THEOREM - the balls-in-bins occupancy law, under
          which C balls in N bins occupy N(1 - exp(-C/N)) bins in expectation
          with the standard birthday correction. Textbook combinatorics; no
          citation is fabricated and none is needed.
      validation_experiment_ids:
        - EXP-YIELD-001
      falsification_condition: >-
        The occupancy Monte-Carlo null arm of EXP-YIELD-001, which throws C_red
        uniform group elements through the IDENTICAL distinct-count estimator,
        fails to recover P_pred within 3 empirical standard deviations at any
        criterion-evaluable cell. That refutes the null model itself, and every E
        value in the census is then VOID rather than negative.
    - id: HEUR-2
      formal_statement: >-
        (Curve genericity at toy scale.) The first curve selected by the
        deterministic selection rule at each field size behaves, with respect to
        interval-factor-base decomposition yield, like a uniformly random curve
        of prime order over that field, so that a per-size E value is not an
        artifact of that one curve.
      random_model_justification: >-
        Curves of prime order over F_p with j-invariant outside {0, 1728} have
        automorphism group of order 2 only, so no extra symmetry acts on the
        reachable sum set. The selection rule fixes a single curve per size for
        reproducibility rather than sampling many, which is a declared weakness
        of the design and not a strength.
      validation_experiment_ids:
        - EXP-YIELD-001
      falsification_condition: >-
        The uniform-random-factor-base null arm, run on the SAME curve at the
        SAME B, shows an E deviation of the same sign and comparable magnitude to
        the interval arm's at three or more criterion-evaluable cells. Any
        deviation surviving factor-base randomisation is an ESTIMATOR OR CURVE
        artifact, not an interval-structure signal, and no interval-structure
        reading may then be made in either direction.
    - id: HEUR-3
      formal_statement: >-
        (Genericity of the summation-polynomial specialization; INHERITED FROM
        IDEA-20260727-006 AS H3.) For a random curve and random target Q the
        specialized polynomial S_{m+1}(x_1, ..., x_m, x(Q)) has an absolutely
        irreducible component of dimension m-1 with probability 1 - O(1/p).
      random_model_justification: >-
        The standard Bertini/Noether specialization heuristic - the locus of bad
        specializations is a proper closed subvariety and hence of density
        O(1/p). Stated for completeness of the dependency chain only.
      validation_experiment_ids: []
      falsification_condition: >-
        NOT VALIDATED AND NOT VALIDATABLE BY EXP-YIELD-001, because the
        absolute-irreducibility audit is CUT (DEFER-BATCH011-001) and because
        this design computes no summation polynomial at all. HEUR-3 IS NOT
        LOAD-BEARING for Y1, Y2 or Y3 - none of them invokes Lang-Weil, a main
        term or an error term - and it is recorded here ONLY so that no reader
        imports a Lang-Weil-conditional statement from IDEA-20260727-006 into
        this hypothesis. ANY STATEMENT RESTING ON THE LANG-WEIL MAIN TERM IS
        CONDITIONAL ON AN UNCHECKED ASSUMPTION AND MUST BE WRITTEN AS CONDITIONAL.
  structural_ingredients:
    - description: >-
        The multiset counting bound |S_m| <= C(B+m-1, m) and its corollary
        R <= (p/N) prod_{j=0}^{m-1} (1 + j/B).
      citation: >-
        DERIVED IN PLACE in the mechanism of this record and re-derived with
        per-cell arithmetic in the criterion feasibility table at
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-011/tasks/TASK-20260729-001/criterion_feasibility_table.md.
        Elementary and near-certainly folklore; NO EXTERNAL SOURCE WAS RETRIEVED
        AND NO NOVELTY IS CLAIMED. It is presented as a derivation to be checked
        by the independent pre-execution review, not as a cited theorem.
      role: >-
        Upper bound on the yield, hence the a-priori exclusion of outcome (b) on
        this metric and the reason the upward criterion is demoted to an
        instrument-invalidation trigger.
    - description: >-
        The balls-in-bins occupancy law N(1 - exp(-C/N)) for the expected number
        of occupied bins.
      citation: >-
        Textbook combinatorics; used as a model, not as an authority. No citation
        is invented.
      role: Null prediction for the distinct reachable sum count.
    - description: >-
        The Hasse bound |N - (p+1)| <= 2 sqrt(p), used only to bound p/N within
        2/sqrt(p) of 1 so that the heuristic denominator convention (p versus N)
        cannot move any criterion.
      citation: Hasse bound, classical.
      role: Convention control.
    - description: >-
        Pollard rho with negation at 0.886 sqrt(N) group operations, and BSGS at
        about 2 sqrt(N) operations with sqrt(N) memory.
      citation: >-
        The 0.886 = sqrt(pi/4) birthday constant from the published rho
        literature, used here as the mandatory matched baseline and as a
        known-answer calibration of the measured baseline arm.
      role: Matched baseline position in time and in memory.
    - description: >-
        The per-cell yield-penalty range 17.5x to 4128.6x measured in a DIFFERENT
        factor-base regime, and the 2.62x to 3.20x density penalty.
      citation: 'ledger/EV-STR-001.yaml and ledger/decisions/DEC-20260727-009.yaml'
      role: >-
        Prior pointing toward outcome (c), and the calibration target of the
        invalidation control - NOT a prediction for the cells this hypothesis
        tests.
  reduction_chain:
    core_problem: >-
      NONE. This hypothesis solves no problem and reduces no problem to another.
      It states a bound and a null model for a quantity that other cost models
      consume. Recorded as null rather than left blank so that no reader infers a
      reduction that is not claimed.
    corollaries: []
  predictions:
    - metric: observed_over_heuristic_yield_ratio_R
      direction: lower
      minimum_effect: >-
        R = (|S_m|/N) / (B^m/(m! p)) is at most
        R_max = (p/N) prod_{j=0}^{m-1} (1 + j/B) at EVERY cell, with R_max
        between 1.004 and 1.21 across the tested design. BASIS - the counting
        derivation in this record, evaluated per cell in the feasibility table.
        This prediction is EXACT, not statistical, and a single violating cell is
        an implementation defect rather than a discovery.
    - metric: occupancy_normalised_efficiency_E
      direction: different
      minimum_effect: >-
        E = |S_m| / P_pred lies in [0.90, 1.10] at every criterion-evaluable
        cell. BASIS - the null model of HEUR-1; the band is a PRE-REGISTERED
        TOLERANCE chosen a priori at roughly five times the largest chance
        fluctuation of the design (about 2 percent), and it is an UNTESTED
        EXPECTATION rather than a measured quantity.
    - metric: trend_of_log_E_in_log_p_at_fixed_beta_and_m
      direction: different
      minimum_effect: >-
        The ordinary-least-squares slope of log E against log p across the field
        sizes of an evaluable beta-column has absolute value at most 0.05, with a
        95 percent interval containing zero, in every evaluable column. BASIS -
        Y2; PRE-REGISTERED TOLERANCE, untested. A slope at or below -0.05 with an
        interval excluding zero is outcome (c).
    - metric: distinct_reachable_m_sums_versus_multiset_count
      direction: lower
      minimum_effect: >-
        |S_m| is at most min(C_all, N) at every cell, and the reported ratio
        |S_m|/C_red is consistent with the occupancy law to within the empirical
        null spread. BASIS - counting plus HEUR-1. This is the control that
        CHECKS the m! denominator of the heuristic rather than assuming it.
    - metric: census_group_operations_over_matched_rho_operations
      direction: higher
      minimum_effect: >-
        At least 1.0 at every census instance, and in fact far above it - the
        census performs on the order of min(C_red, N) times B group-equivalent
        operations while matched rho needs 0.886 sqrt(N). BASIS - derivation in
        the contract. This is the standing control that prevents a yield
        measurement from being read as an attack result, and a value below 1.0
        would be a red flag about the accounting rather than an attack.
  test_boundary:
    instances:
      - >-
        Four toy prime fields, p equal to the smallest prime at or above 2^k for
        k in {12, 14, 16, 18}, so at most 18 field bits.
      - >-
        Exactly ONE curve per field size, fixed by a deterministic selection rule
        stated in the contract and requiring prime group order N, N different
        from p, and j-invariant outside {0, 1728}. One curve per size is a
        DECLARED WEAKNESS of the design, not a strength.
      - >-
        Factor base F = points whose x-coordinate lies in the interval
        {0, ..., L-1}, L = round(p^beta), with beta on a grid of step 0.025 from
        0.200 to 0.600.
      - >-
        Null instances - a uniformly random negation-closed subset of G of the
        SAME measured size B on the SAME curve, and an occupancy Monte Carlo
        throwing C_red uniform elements of G through the identical estimator.
      - >-
        Calibration instances in EV-STR-001's OWN regime and nowhere else -
        arithmetic-progression supports at B = ceil(sqrt(n)), m in {3, 4},
        n in {211, 1009, 4099}, shift set D = {1..64}.
    parameters:
      arity_m: '2 and 3 only'
      beta_grid: '0.200 to 0.600 in steps of 0.025'
      decomposition_test: hash membership in the set of factor-base m-sums
      solver: >-
        NONE. No Groebner basis, no polynomial system solve, no summation
        polynomial, and no import of harness/endomorphism_la.py.
      operation_unit: one elliptic-curve point addition or doubling
      criterion_evaluable_cell: 'h at most 0.5 and C_red at least 500'
    implementation: >-
      A NEW standalone single-file driver at
      experiments/EXP-YIELD-001/driver/yield_census.py. Nothing under harness/ is
      modified, reused or imported for the measurement.
    budget:
      wall_clock_seconds_total: 5400
      maximum_memory_gb: 8
      maximum_runs: 6
  falsification_conditions:
    - >-
      OUTCOME (c) - in at least one criterion-evaluable beta-column carrying at
      least three field sizes, E is at most 0.80 at the largest evaluated size,
      E is non-increasing across those sizes, and the ordinary-least-squares
      slope of log E against log p is at most -0.05 with a 95 percent interval
      excluding zero. Y2 is false in the pessimistic direction, every
      index-calculus cost model in this ledger that charges against
      B^m/(m! p) is optimistic at these sizes and worsening with p, and the
      re-charging obligation is real. This is a GENUINELY REACHABLE NEGATIVE
      OUTCOME - nothing in the design forces E above 0.80 - and it is the branch
      the existing evidence in EV-STR-001 and DEC-20260727-009 points toward.
    - >-
      THE CORRECTION MODEL IS INCOMPLETE - E falls outside [0.90, 1.10] at more
      than one third of criterion-evaluable cells with NO monotone trend in p and
      no consistent sign. Neither (a) nor (c) is established; the null model
      itself is missing a term, the correct verdict is INCONCLUSIVE, and a scoped
      successor must identify the missing correction before any yield number is
      re-used.
    - >-
      THE COUNTING BOUND IS APPARENTLY VIOLATED - R exceeds R_max, or |S_m|
      exceeds min(C_all, N), or |S_m| is less than |S_(m-2)|, at any cell. Each
      of these is MATHEMATICALLY IMPOSSIBLE, so this is an IMPLEMENTATION DEFECT
      and the run is INVALID. It is never evidence about the yield heuristic and
      NEVER an observation of outcome (b).
    - >-
      THE INSTRUMENT CANNOT RECOVER A KNOWN ANSWER - the calibration leg, run in
      EV-STR-001's own regime, fails to recover that record's per-cell yield
      penalty within a factor 2 in at least 5 of its 6 cells, or fails to
      reproduce the monotone growth of the penalty in n at fixed m and its
      superlinear growth in m at fixed n. The census numbers are VOID rather than
      negative.
    - >-
      THE NULL MODEL IS NOT RECOVERED - the occupancy Monte Carlo fails to
      reproduce P_pred within 3 empirical standard deviations at any
      criterion-evaluable cell. Every E value is VOID rather than negative.
  interpretation_limits:
    - >-
      TOY SCALE, MECHANICALLY. At most 18 field bits, m at most 3, one curve per
      size, one interval anchor, one implementation, one budget. Nothing this
      hypothesis can establish is evidence about cryptographic-size curves in
      either direction, and toy-scale agreement is TOY-SCALE VALIDATION of a
      heuristic and must never be presented as crypto-scale validation.
    - >-
      THIS HYPOTHESIS MOVES NO EXPONENT AND IS NOT AN EXPONENT-TARGETING
      MECHANISM. Its experiment is admitted under docs/target-result-profile.md
      rule A1 as an EXPONENT-DECIDING SCREEN, EXPRESSLY NOT as an
      exponent-targeting mechanism, and NO DOWNSTREAM RECORD MAY QUOTE IT AS
      TARGET-CLASS. It buys no attack, no attack improvement and no cryptanalytic
      result.
    - >-
      OUTCOME (a) LICENSES ALMOST NOTHING. It says the counting heuristic is
      correct at 12 to 18 bits after two known corrections. It does not upgrade
      the heuristic to a theorem, does not certify it at any larger size, and
      leaves the index-calculus lane permanently heuristic-conditional in exactly
      the sense docs/target-result-profile.md requires to be declared.
    - >-
      OUTCOME (c) FLAGS COST MODELS; IT DOES NOT RE-CHARGE THEM. A measured
      shortfall at toy sizes identifies which models are optimistic and by how
      much AT THOSE SIZES. Re-charging any model at any other size requires its
      own work and is not licensed here.
    - >-
      THE A-PRIORI EXCLUSION OF OUTCOME (b) IS SCOPED TO THE DECOMPOSITION SHAPE
      DEFINED IN THE STATEMENT. It says nothing about weighted decompositions,
      adaptive factor bases, decomposition MULTIPLICITY, binary or extension
      fields where the summation-polynomial system behaves differently and where
      published subexponential results exist, or any lane other than
      fixed-factor-base fixed-arity prime-field index calculus.
    - >-
      IT ADJUDICATES NEITHER OF IDEA-20260727-006'S HEADLINE CLAIMS. The gap
      beta_cert minus beta_adm is NOT adjudicated (DEFER-BATCH011-002, because
      beta_adm needs an omega_LA that has never been measured), and the
      (m+1)/(2m) certification exponent is NOT tested (stage 2 is cut on the
      arithmetic in the criterion feasibility table). No record may say otherwise.
    - >-
      THIS HYPOTHESIS IS NEW AND INDEPENDENT. It does not test, support, weaken
      or restore H-IC-001, H-STR-002, H-ENDO-001, H-SUBRES-001, H-GGM-001 or
      H-FCP-001, and its creation is NOT a transition of any of them. H-IC-001
      and H-STR-002 remain `weakened`, H-SUBRES-001 remains `weakened`,
      H-ENDO-001 remains `approved` which carries no evidential standing,
      H-GGM-001 remains `specified` and H-FCP-001 remains `analyzed`. In
      particular DEFER-BATCH009-001's undischarged EXP-STR-004 replication still
      binds the next transition of H-STR-002 in either direction, and nothing
