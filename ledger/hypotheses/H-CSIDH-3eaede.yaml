hypothesis:
  id: H-CSIDH-3eaede
  goal_id: GOAL-QALG-001
  question_id: RQ-QALG-74bf20
  source_idea: IDEA-20260813-e6d55d

  statement: >-
    CLAIM TIER: crypto (CSIDH-512's actual, standardized class-group order is
    the tested instance -- a >96-bit field per docs/claims-and-verification.md
    -- even though the WORK performed is a small, deterministic verification,
    not a compute campaign). This hypothesis states a two-premise conditional
    and this record's paired experiment (EXP-CSIDH-c65945) tests ONLY the
    first premise, on CSIDH-512's actual class-group order rather than a toy
    or symbolic one. Written out in full so neither premise is ever silently
    dropped:

    IF (i) the zero-noise (a(n) -> infinity) specialization of Simon 2026's
    (KN-LIT-e204ab -- an UNVERIFIED, unrefereed, three-day-old-at-filing
    preprint whose load-bearing Lemma 3 is an explicit "(Sketch)"; treated as
    unverified throughout this record and never cited as established) DCP
    erasure mechanism is a legitimate instantiation of the paper's own stated
    theorem when applied to a dihedral group whose order is CSIDH-512's
    actual, independently re-derived CSI-FiSh class-group order N (not a
    toy N, not a symbolic n), AND (ii) [NOT TESTED BY THIS EXPERIMENT -- a
    separate, not-yet-designed crossover/cost-model experiment] the resulting
    O(n^13) sample-complexity floor (n = log2 N) is smaller than Kuperberg's
    own concretely re-derived 2^{O(sqrt(log N))} cost at that same N, THEN
    Simon 2026's mechanism would be a genuine exponent-class alternative to
    Kuperberg's sieve for CSIDH-512's dihedral hidden-shift instance -- a
    change in functional form (poly(n) vs 2^{O(sqrt n)}), not a
    constant-factor gain, per the source idea's own method_ceiling.

    THIS EXPERIMENT TESTS ONLY PREMISE (i), TOGETHER WITH INDEPENDENTLY
    ESTABLISHING N ITSELF (needed both for (i)'s own structural-form question
    and as a prerequisite input to any later test of (ii)). It is a
    baseline-reproduction / applicability audit, per this task's own
    objective: "not yet a claim that the specialization works." A positive
    outcome (premise (i) holds) is NOT a claim that Simon's construction is
    correct, fast, or that CSIDH is threatened -- it only clears this
    specific extrapolation question and leaves Lemma 3's own correctness and
    premise (ii)'s crossover-order question entirely open, exactly as the
    source idea's own interpretation_limits state.

  mechanism: >-
    In the error-free (zero-noise) limit every DCP sample used by the CJS
    reduction (KN-LIT-071) of CSIDH's class-group hidden-shift instance is a
    valid Regev-form coset state. Simon 2026's construction (KN-TECH-d1bc4f)
    partitions Q = k*n^{c+1} samples into groups of c*log(n), Hadamard-erases
    each group's b_i register, keeps only the all-zero-measured groups, and
    reconstructs a phase-carrying bit h* from their partial subset sums --
    recursing bit-by-bit under an explicit N = 2^n presentation (residual
    phase w^{z'd}*(-1)^{h*d_n}, recursion on individual bits d_n, d_{n-1},
    ...). CSIDH-512's actual class-group order N, as independently re-derived
    from CSI-FiSh (Beullens-Kleinjung-Vercauteren 2019) by this experiment,
    is almost certainly NOT of that literal form (class numbers of
    several-hundred-bit imaginary-quadratic discriminants are generically not
    powers of two; this must be VERIFIED, not assumed, on the actual
    published value). The mechanism this experiment audits is therefore:
    does N (or the specific group order the CJS reduction actually supplies
    as the DCP instance's modulus, which may differ from the raw class
    number if the class group is not cyclic or a subgroup is used) admit a
    citable, stated reduction to the N=2^n presentation Simon's paper and its
    cited predecessors (Regev 2004, Kuperberg 2005, Ettinger-Hoyer) actually
    use -- or is applying the construction to CSIDH-512 an extrapolation
    beyond what those sources state.

  assumptions:
    - >-
      Simon 2026's construction (KN-LIT-e204ab) is treated as an unverified,
      unrefereed preprint whose load-bearing Lemma 3 is a sketch. This
      experiment does not attempt to verify Lemma 3; it only audits whether
      the zero-noise specialization, applied to CSIDH-512's actual group
      order, is a legitimate instance of the paper's own stated claim.
    - >-
      CSIDH's hidden-shift instance (via the Childs-Jao-Soukharev reduction,
      KN-LIT-071) supplies exact, error-free coset samples over a group whose
      order is (a function of) CSI-FiSh's published class-group order for
      CSIDH-512 -- itself independently re-derived, not adopted from memory,
      by this experiment.
    - >-
      CSI-FiSh's own published class-group-order computation
      (Beullens-Kleinjung-Vercauteren 2019) is treated as the primary source
      of record for N; this experiment independently re-verifies (primality
      of stated factors, product reconciliation, second-citation agreement)
      rather than blindly trusting a single citation, but does not attempt a
      full from-scratch re-derivation of the class number by BSGS or an
      analytic/GRH-heuristic method (explicitly out of scope; see
      EXP-CSIDH-c65945's budget note).

  proof_search_map:
    bottleneck: >-
      Scoped, at CSIDH-512's actual N, from IDEA-20260813-e6d55d's own
      bottleneck: does Simon's construction's implicit N=2^n presentation
      (bit-recursion, residual phase w^{z'd}*(-1)^{h*d_n}) apply, as stated
      or via a citable reduction, to a dihedral group of CSIDH-512's actual
      class-group order N -- which this experiment establishes concretely
      rather than leaving symbolic. This experiment does NOT re-derive
      Lemma 1/Lemma 3/Lemma 4's internal arithmetic (that remains
      IDEA-20260813-e6d55d's own Stage-1 symbolic audit, not yet dispatched);
      it audits only the group-order structural premise, now pinned to a
      real number.
    baseline_embedding:
      parameter_slice: >-
        Kuperberg's original sieve (KN-LIT-2c8264), 2^{O(sqrt(log N))} time
        and query, error-free samples, is the exact old-method boundary; N is
        CSIDH-512's actual class-group order, independently re-derived here
        from CSI-FiSh rather than adopted from SQALE (KN-LIT-129, which
        covers larger, non-CSIDH-512 parameter sets) or from memory.
      reproduction_check: >-
        NOT performed by this experiment. Symbolically re-deriving
        Kuperberg's own stated time/query formula 2^{c*sqrt(log2 N)} with its
        published constant, cross-checked against Peikert's classical
        simulator (KN-LIT-127), is required before any crossover-order
        (premise (ii)) computation, but is out of THIS experiment's scope,
        which is confined to premise (i) plus establishing N. Recorded here
        as an explicit gap this experiment does not close, so a future
        reviewer does not mistake this run for having reproduced the
        Kuperberg baseline.
    observation_collision:
      observable: >-
        Unchanged from IDEA-20260813-e6d55d: the recovered bit h* (Simon's
        construction) and the recovered coset-representative label c mod N
        (Kuperberg's sieve) are the same abstract certificate, the shift
        value d mod N solving CSIDH's hidden-shift instance.
      distinct_preimage_search: >-
        Not performed by this experiment (requires a toy-instance simulation
        harness IDEA-20260813-e6d55d's own minimal_test describes but this
        experiment does not build). Recorded as a gap, not silently dropped.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Determine, at CSIDH-512's actual (not symbolic) N, whether N's
          structural form (odd/composite/prime, per the independently
          re-derived factorization) admits a stated bridging reduction to
          Simon's N=2^n presentation -- e.g. an explicit padding/embedding
          technique cited in the DCP literature (Kuperberg, Regev,
          Ettinger-Hoyer) that preserves the erasure construction's stated
          hypotheses -- rather than leaving this an abstract limit argument
          over a free parameter a(n) as the source idea's own transform
          proposed.
        predicted_gain: >-
          If a citable reduction exists and preserves the stated hypotheses,
          premise (i) clears at CSIDH-512's real scale with no new proof
          obligation invented by this program; if no such reduction is
          citable, that is a clean, cheap, literature-level falsifier of
          premise (i) at this scale, independent of Lemma 3.
      - transform: specialization_pack
        proposed_object: >-
          Package CSI-FiSh's independently re-derived N (and its
          factorization) as a frozen, citable numeric input any future
          EXP-CSIDH-* task under RQ-QALG-74bf20 (including a future
          premise-(ii) crossover experiment) can reuse without re-deriving it.
        predicted_gain: >-
          Removes N-re-derivation as a recurring cost/uncertainty from every
          downstream CSIDH-512-scale audit in this lane.
    quantifier_order: >-
      As stated by Simon 2026 (unchanged from the source idea): for all n,
      for all fixed noise-tolerance target a(n) <= O(log n), there exists a
      sample complexity Q(n,a) and a measurement procedure recovering d_n
      with probability significantly greater than 1/2, over a group
      presented with N = 2^n. This experiment requires: for the SPECIFIC,
      concrete N = CSIDH-512's actual class-group order (independently
      established here, not "for all n in [256,9000]" symbolically), does a
      citable instantiation or reduction of that existential claim exist --
      i.e. is the witness reachable at this one concrete N, or does the
      paper's own N=2^n presentation fail to extend to it without an
      unstated extrapolation.
    method_ceiling:
      strongest_certifiable_claim: >-
        Unchanged from IDEA-20260813-e6d55d: at best, if every step
        specializes cleanly (both premises (i) and (ii)), this could certify
        an unconditional o(1)-error polynomial-time algorithm for the exact
        dihedral hidden-shift problem underlying CSIDH -- a genuine
        exponent-moving replacement for Kuperberg's sieve. THIS EXPERIMENT
        CANNOT REACH THAT CEILING; it can at most clear or close premise (i)
        at CSIDH-512's real scale.
      nearby_object_control: >-
        Not run by this experiment (requires the toy-instance simulation
        harness from IDEA-20260813-e6d55d's own minimal_test, log2 N <= 24,
        not dispatched here). Recorded as an explicit, undischarged control
        this experiment leaves for a later task, not silently satisfied.
    proof_obligations:
      - claim: >-
          CSIDH-512's class-group order N, as independently re-derived and
          factorized in this experiment, matches CSI-FiSh's own published
          value (Beullens-Kleinjung-Vercauteren 2019).
        responsibility: baseline
      - claim: >-
          The zero-noise limit of Simon's construction, applied to a group
          of CSIDH-512's actual order N, is a legitimate specialization of
          the paper's own stated theorem (directly, or via a citable
          bridging reduction), not an extrapolation beyond its proven or
          sketched range.
        responsibility: scope
      - claim: >-
          Every claim in the applicability audit is backed by an exact,
          checkable citation (page/section/lemma) to primary source text,
          not paraphrase from memory -- so an independent reviewer can
          re-verify the audit without re-deriving it.
        responsibility: correctness
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim:
    problem: >-
      the dihedral hidden-shift problem underlying CSIDH's commutative
      isogeny group action (via the Childs-Jao-Soukharev reduction,
      KN-LIT-071)
    prior_best: >-
      Kuperberg's sieve, 2^{O(sqrt(log N))} time and query (KN-LIT-2c8264);
      the collimation-sieve variant achieves the same time order with
      exponentially reduced quantum memory (KN-LIT-127) -- neither figure is
      independently re-derived by this experiment (see
      proof_search_map.baseline_embedding.reproduction_check above).
    time_exponent: >-
      CONDITIONAL ONLY, established by neither this hypothesis nor this
      experiment: IF premise (i) [tested here] AND premise (ii) [NOT tested
      here] both hold, poly(n) = O(n^13), n = log2(N), evaluated at
      CSIDH-512's independently re-derived N.
    memory_exponent: >-
      O(n^13) qubits/classical storage (same order as the query count),
      conditional on the same two premises; no claimed memory reduction over
      Kuperberg's sieve, per the source idea's own target_complexity.
    hidden_cofactor: >-
      O(n^13) is polynomial but with a very large fixed exponent (c >= 12,
      required by the paper's own stated condition k > c) -- an acknowledged
      galactic-algorithm risk. No concrete-cost table exists for this
      mechanism at any N; producing one is out of this experiment's scope.
    claim_kind: exponent_improvement

  heuristic_assumptions:
    - id: HEUR-CSIDH-3eaede-1
      formal_statement: >-
        (= IDEA-20260813-e6d55d's own H1, carried unmodified.) Simon's
        construction's stated per-recursion-level bias on d_n ("significantly
        greater than 1/2") behaves, in the zero-noise limit, like an
        unconditionally bounded-away-from-1/2 Bernoulli bias whose deviation
        is Omega(1/n), uniformly for n in [256, 9000] class-group-order
        bit-lengths.
      random_model_justification: >-
        No independent rigorous bound in this corpus; explicitly a
        placeholder pending Lemma 3's own resolution (KN-LIT-e204ab), not a
        derived heuristic. NOT VALIDATED BY THIS EXPERIMENT -- H1 concerns
        premise (ii)'s bias/repetition arithmetic, which this experiment does
        not test. Carried here so the hypothesis record discloses the full
        conditional structure rather than hiding H1 until a later experiment
        exists to test it.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        (unchanged from the source idea) The bias trend as n grows decays
        faster than Omega(1/n) across sampled toy sizes, directly falsifying
        H1's extrapolation to CSIDH-scale n -- to be tested by a future,
        not-yet-designed toy-simulation experiment, not this one.

  structural_ingredients:
    - description: >-
        The Childs-Jao-Soukharev reduction of CSIDH-style commutative
        isogeny secret-key recovery to a hidden-shift / dihedral coset
        instance over the class group.
      citation: KN-LIT-071
      role: >-
        supplies the group and the group order N whose CSIDH-512-scale value
        this experiment independently re-derives and structurally audits.
    - description: >-
        CSI-FiSh's published exact class-group-order computation for
        CSIDH-512.
      citation: >-
        Beullens, Kleinjung, Vercauteren, "CSI-FiSh: Efficient Isogeny Based
        Signatures Through Class Group Computations" (2019); primary-source
        citation to be re-obtained and re-verified by the executor, not
        adopted from this record's own memory (no numeric value is asserted
        in this hypothesis or its paired experiment contract).
      role: >-
        supplies the concrete numeric N this experiment's applicability
        audit is instantiated against.
    - description: >-
        Simon 2026's zero-noise DCP erasure construction and its cited
        predecessors (Regev 2004, Kuperberg 2005, Ettinger-Hoyer).
      citation: KN-LIT-e204ab (UNVERIFIED preprint); background KN-TECH-d1bc4f
      role: >-
        source theorem whose stated group-order hypothesis (N=2^n) is being
        audited against CSIDH-512's actual N.

  reduction_chain:
    core_problem: >-
      the exact (zero-noise) dihedral coset problem over Z_N (or the
      relevant coset structure) for N = CSIDH-512's actual class-group order
    corollaries:
      - problem: CSIDH-512 secret-key recovery (class-group-action hidden-shift instance)
        reduction_ref: >-
          Childs-Jao-Soukharev, KN-LIT-071 -- cited, not independently
          re-derived by this experiment.
        asymptotics_preserved: >-
          not evaluated by this experiment; out of scope (this experiment
          audits applicability of a DCP-solving mechanism, not the CJS
          reduction's own asymptotics).

  predictions:
    - metric: >-
        applicability-audit outcome: A (APPLICABLE-AS-STATED -- N, or the
        group order the CJS reduction actually supplies, matches or has a
        citable reduction to Simon 2026's stated N=2^n presentation) versus
        B (NOT-APPLICABLE-AS-STATED -- no such match or citable reduction
        exists)
      direction: different
      minimum_effect: >-
        Not a higher/lower magnitude claim -- a categorical, decidable
        determination. The disclosed prior expectation (not assumed as a
        conclusion; the audit must determine, not assume, which holds) is
        that a several-hundred-bit class number is generically NOT a power
        of two, so outcome A, if reached, would depend on a citable bridging
        reduction rather than a literal match -- this experiment finds out
        which, with citations, rather than presupposing either.
    - metric: >-
        class_group_order_match: whether the independently re-derived N (via
        >= 2 independent sources/citations, with product-and-primality
        verification of the published factorization) agrees exactly with
        CSI-FiSh's own published value
      direction: different
      minimum_effect: >-
        Exact equality is the only passing outcome (deterministic, no
        tolerance); any mismatch triggers this experiment's invalidation
        rules rather than being reported as a scientific finding.

  test_boundary:
    instances:
      - >-
        CSIDH-512, the original CSIDH parameter set (Castryck, Lange,
        Martindale, Panny, Renes) at NIST security level 1, as adopted by
        CSI-FiSh (Beullens-Kleinjung-Vercauteren 2019); the prime p and the
        class group of the associated imaginary-quadratic order, per
        CSI-FiSh's own stated convention.
      - >-
        NOT IN SCOPE: any larger CSIDH parameter set (e.g. SQALE's 2000-9000
        bit primes, KN-LIT-129) -- this experiment tests CSIDH-512 only,
        exactly matching CSI-FiSh's own published computation, which is the
        only class-group order this program can cite from an independently
        computed primary source rather than an estimate.
    parameters:
      class_group_order_N: >-
        to be independently obtained and cited by the executor, not asserted
        in this record (no numeric value is fabricated here per AGENTS.md
        rule 5)
      group_type: >-
        class group of the (maximal, per CSI-FiSh's own stated convention)
        imaginary-quadratic order acting on the CSIDH-512 supersingular
        curve set
    implementation: >-
      Literature citation plus independent arithmetic verification; see
      experiments/EXP-CSIDH-c65945/specification.yaml for the full method.
      No cryptographic-scale simulation, no quantum circuit execution.
    budget: {}
    # Populated in experiments/EXP-CSIDH-c65945/specification.yaml, not
    # duplicated here (matching H-MLKEM-7d9bcc's own precedent).

  falsification_conditions:
    - >-
      At CSIDH-512's actual, independently-verified class-group order N (not
      a toy or symbolic N), Simon 2026's zero-noise construction, AS STATED,
      is not shown to be a legitimate instance of the paper's own theorem
      (outcome B, NOT-APPLICABLE-AS-STATED) -- this falsifies premise (i) at
      CSIDH-512's actual scale without evaluating Lemma 3 at all, matching
      IDEA-20260813-e6d55d's own falsification_conditions item 1, now
      instantiated at a concrete N rather than left symbolic.
    - >-
      The independently re-derived class-group order N does not match
      CSI-FiSh's own published value after a documented reconciliation
      attempt -- this is an evidence-integrity failure (invalidates the run;
      it does not itself falsify the hypothesis) and must be reported as
      such, not silently resolved by picking a source.

  interpretation_limits:
    - >-
      No claim about CSIDH's security level. No claim that Simon's
      construction is correct at any noise rate -- Lemma 3 (KN-LIT-e204ab)
      remains unverified and is not touched by this experiment.
    - >-
      This experiment tests ONLY premise (i) (applicability of the
      zero-noise specialization at CSIDH-512's actual N) plus independently
      establishing N itself. It does NOT test premise (ii) (whether the
      O(n^13) sample floor beats Kuperberg's cost at this N), which requires
      a separate, not-yet-designed crossover/cost-model experiment paired
      with this program's conditional-result pairing rule.
    - >-
      An outcome-A (APPLICABLE-AS-STATED) finding is NOT a claim that the
      mechanism works, is correct, or is fast -- it only clears this specific
      extrapolation question and leaves Lemma 3's own correctness and the
      crossover-order question entirely open, exactly as
      IDEA-20260813-e6d55d's own interpretation_limits state.
    - >-
      An outcome-B (NOT-APPLICABLE-AS-STATED) finding closes premise (i) at
      CSIDH-512's scale under this program's discipline; it is not itself an
      adjudication of Simon 2026's correctness at any other scale or noise
      rate, and it is not a security statement about CSIDH.
    - >-
      This is a crypto-tier instance (CSIDH-512's real parameters) for the
      APPLICABILITY question only; it is not a crypto-scale cost measurement
      and does not produce a concrete-cost table (CLAUDE.md's four
      asymptotic-complexity promotion gates remain entirely unsatisfied by
      this record; the asymptotic_claim above stays capped at `analyzed`
      at most, never `supported`).

