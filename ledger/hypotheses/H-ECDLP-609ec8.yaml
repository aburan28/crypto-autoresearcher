hypothesis:
  id: H-ECDLP-609ec8
  question_id: RQ-ECDLP-002
  source_proposal_id: IDEA-20260802-001
  related_experiment_id: EXP-ECDLP-523318
  context_goal_id: GOAL-ECDLP-001
  context_note: >-
    Recorded for provenance only. This hypothesis reads artifacts archived under
    GOAL-ECDLP-001 BATCH-025; it is NOT assigned to a batch here and no BATCH id is
    minted by this record. Batch assignment, scheduling and dispatch belong to the
    approval decision, which is a separate committed Coordinator record.

  title: >-
    The measured departure of the archived known-uniform integer arm from the asymptotic
    Dickman reference at the EXP-LPF-001 toy cells is a property of the REFERENCE at
    finite y rather than of the sampler, and is absorbed by the Hildebrand-Tenenbaum
    saddle-point estimate of Psi(x, y)

  statement: >-
    ASSUMING HEUR-SP-1. The upward departure from the asymptotic Dickman reference that
    RUN-LPF-001-calib measured on its KNOWN-UNIFORM integer arm - archived as
    LPF_R_u_uniform_mean_over_replicates R_unif(u) = 1.1702, 1.4522, 2.0521, 4.5709,
    11.5937 at u_target 2, 3, 4, 5, 6 for the bits-16 cell and 1.1279, 1.3055, 1.6443,
    2.4453, 5.0386 at the bits-20 cell, each value independently recomputed by a second
    quadrature scheme at TASK-20260801-051 - IS A PROPERTY OF THE ASYMPTOTIC REFERENCE
    EVALUATED AT FINITE y, AND NOT OF THE SAMPLER, THE BITLENGTH MATCHING OR THE
    u-PARAMETERIZATION. Concretely, three consequences are asserted together and are
    tested together by EXP-ECDLP-523318.
    (i) Substituting the Hildebrand-Tenenbaum saddle-point estimate Psi_sp(x, y) for
    x * rho(u), evaluated at the SAME x that the archived reference used (x = D, the
    frozen bound that defines u through u = ln(D)/ln(Bsm)) and at the SAME archived
    recomputed u, reduces max_u |ln R(u)| by at least a factor of 3 at BOTH cells.
    The archived asymptotic figures are max_u |ln R_rho(u)| = |ln 11.5937| = 2.4506 at
    bits 16 and |ln 5.0386| = 1.6171 at bits 20, so the frozen decision thresholds are
    2.4506 / 3 = 0.8169 at bits 16 - which the source proposal states in rounded form as
    the pre-registered target 0.82 - and 1.6171 / 3 = 0.5390 at bits 20.
    (ii) Under that substitution all five rungs at both cells lie inside the frozen
    constant-factor band [1/8, 8], so the count of rungs at which EXP-LPF-001's LIMB B is
    decidable by its own apparatus rises from the archived 9 of 10 to 10 of 10.
    (iii) Under the EXACT count Psi(x, Bsm), computed at the bits-16 cell over the
    sampler's own recorded support, the archived uniform arm's ratio R_exact(u) lies
    inside [0.90, 1.11] at every rung u_target in 2, 3, 4, 5, 6.
    IF ANY OF THE THREE FAILS, the departure is not explained as a finite-y reference
    effect and the calibration's uniform sampler, its support, its bitlength matching or
    its u-parameterization is implicated. THAT IS AN INSTRUMENT FINDING OF EQUAL DECISION
    VALUE AND IS REPORTED AS A POSITIVE FINDING ABOUT THE APPARATUS, NEVER AS A NULL
    RESULT AND NEVER AS A RESULT ABOUT THE SEMAEV MAP.

  mechanism: >-
    Hildebrand's theorem gives Psi(x, y) = x * rho(u) * (1 + O(log(u+1) / log y)) with
    u = log x / log y, uniformly in a stated range. The relative error term is NOT small
    at this campaign's toy parameters. At the bits-16 cell and u_target 6 the smoothness
    bound is Bsm = 40, so log Bsm is about 3.69 and log(u+1)/log Bsm is about 0.53 - an
    error term of order unity, i.e. the asymptotic reference is being read at the edge of
    its usable range. The Hildebrand-Tenenbaum saddle-point estimate does not degrade in
    that regime because it never passes to the u -> infinity asymptotic. It evaluates the
    Dirichlet-series saddle directly at the actual y, with alpha = alpha(x, y) the
    solution of sum over primes p <= y of log p / (p**alpha - 1) = log x.
    WHY THIS MATTERS BEYOND ACCURACY. Every conditional cost statement this program has
    entertained in the Gaudry-Semaev lane is an instance of the target profile's
    per-attempt-cost times inverse-success-probability bookkeeping, and the inverse
    success probability IS rho(u)**-1. The reference is therefore an ABSOLUTE factor that
    every such statement multiplies by. A reference whose measured relative error against
    a KNOWN-UNIFORM arm runs from about 17 percent at u = 2 to about 1059 percent at
    u = 6 mis-states that factor by an amount that grows along the exact axis a parameter
    optimization over B runs on, so an argmin over B - and any conditional exponent read
    off it - is computed against a measurably wrong curve. THIS HYPOTHESIS CLAIMS NO
    EXPONENT AND NO ALGORITHM. It claims that repairing the reference is a precondition
    for any exponent statement in this lane being computed at all.
    THE DESIGN DISCRIMINATES THREE EXPLANATIONS, NOT TWO.
    (a) REFERENCE EFFECT - the saddle-point estimate absorbs the departure at every rung
    and the exact count places the arm inside its point band. Then the frozen [1/8, 8]
    band was being applied against a reference a correct null provably could not satisfy
    at u = 6, and the correction is carried into every successor contract by a new
    superseding record.
    (b) SAMPLER OR SPECIFICATION EFFECT - a residual of the same order survives the
    saddle correction. Then the departure is not explained by finite-y analysis and the
    archived uniform arm itself is under suspicion; REF-EXACT localizes it, because it is
    a THEOREM about the count rather than a model of it.
    (c) PARTIAL - absorbed at low u, residual at high u. Then the decidable-rung set is
    reported as measured and the residual is a named open item, not a result.

  assumptions:
  - >-
    The archived RUN-LPF-001-calib arrays are what the committed record says they are.
    This hypothesis reads them; it does not re-run the calibration, does not redraw any
    arm, and does not edit any EXP-LPF-001 artifact.
  - >-
    THE SAMPLER SUPPORT IS READ OUT OF THE COMMITTED RECORD AND IS NOT ASSUMED. The
    archived descriptor in experiments/EXP-LPF-001/results/calib/null_replicate_statistics.json
    records, at the bits-16 cell, p = 46663, X_equals_p_squared = 2177435569,
    D_frozen = 4294967296 and X_over_D = 0.5069737250450999; and at the bits-20 cell,
    p = 767551, X_equals_p_squared = 589134537601, D_frozen = 1099511627776 and
    X_over_D = 0.5358147405795535. EXP-LPF-001's range_matching_note states that the
    uniform calibration arm is drawn uniformly on [1, p**2] and that D is retained ONLY
    as the frozen bound defining u. CONSEQUENCE, STATED HERE BEFORE ANY COMPUTATION - the
    archived ratio R_rho(u) compares an empirical rate measured on [1, X] against a
    reference density evaluated at x = D with X/D about 0.51, so the reference domain is
    a live candidate contributor to the departure and is treated in EXP-ECDLP-523318 as a
    declared INDEPENDENT VARIABLE with two levels rather than as a fixed choice.
  - >-
    At the bits-16 cell the exact count Psi(x, Bsm) is computable by an exact
    integer dynamic program over the primes up to Bsm at at least the high-u rungs, where
    Bsm is small. FEASIBILITY IS MEASURED PER RUNG AND REPORTED, NEVER ASSUMED; a rung
    that exhausts its declared cap is recorded as budget-exhausted with its elapsed time
    and is a scope reduction and an infrastructure signal, never a result in either
    direction (AGENTS.md rule 5).
  - >-
    No live keys, no discrete logarithm, no curve arithmetic, no factorization and no
    sampling of any kind are required or permitted. The only inputs are archived arrays
    and the only new objects are two computed reference functions.

  proof_search_map:
    not_applicable_reason: >-
      NOT PROOF-ORIENTED IN THE SENSE OF KN-TECH-080 SECTION 8. This hypothesis proposes
      no theorem, no asymptotic bound, no certificate family, no reduction and no closure
      argument; it predicts the numerical behaviour of two reference functions against an
      already-archived sample. The map is therefore not required. The three audits that
      DO apply at zero cost are filled below rather than nulled, because a cheap
      pre-compute falsification check is worth running whether or not the schema compels
      it; the remaining subfields are null for the stated reason and not by omission.
    bottleneck: >-
      The absolute smoothness reference itself. It enters every conditional cost
      statement in this lane as the inverse-success-probability factor rho(u)**-1, so an
      error in it multiplies every such statement and moves the argmin over B.
    baseline_embedding:
      parameter_slice: >-
        The incumbent baseline is the asymptotic Dickman reference exactly as
        EXP-LPF-001 used it - rho evaluated at u = ln(D)/ln(Bsm) with D the frozen
        per-cell bound, at the five frozen integer Bsm rungs per cell.
      reproduction_check: >-
        FROZEN REGRESSION FIXTURE. Before any new reference is compared, the
        implementation must reproduce, from the archived p_hat means and its own
        independently coded rho, the archived R_rho values 1.1702, 1.4522, 2.0521,
        4.5709, 11.5937 (bits 16) and 1.1279, 1.3055, 1.6443, 2.4453, 5.0386 (bits 20) to
        four decimal places. Failure is an implementation defect that voids the exercise
        and is never read as a finding.
    observation_collision:
      observable: >-
        R(u) = p_hat_unif(u) / S(x, Bsm), the ratio of the archived empirical smooth
        fraction to a reference density S. The observable is indexed by the reference AND
        by the domain x, and a value reported without both labels is inadmissible.
      distinct_preimage_search: >-
        THE COLLISION IS NAMED IN ADVANCE RATHER THAN SEARCHED FOR. At least three
        distinct causes produce the same upward R - (1) finite-y error of the asymptotic
        reference, (2) the domain mismatch between the sampler's support [1, X] and the
        reference argument x = D, and (3) a genuine sampler defect. The design separates
        (1) from (2) by computing every reference at both domains and separates (1)+(2)
        from (3) by REF-EXACT, which is an exact count and therefore cannot carry a
        model error. It does NOT separate causes that the asymptotic and the saddle-point
        reference share, and that limit is recorded in interpretation_limits.
    constructive_transforms: []
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: >-
        A statement about the numerical accuracy of two named reference functions, and
        about the position of one archived uniform arm relative to them, at two toy
        parameter cells (D = 2**32 and D = 2**40, supports X = 2177435569 and
        X = 589134537601) and five frozen Bsm rungs per cell. NOTHING STRONGER IS
        CERTIFIABLE BY THIS DESIGN AT ANY OUTCOME.
      nearby_object_control: >-
        CLOSED-FORM NULL OBJECTS OF THE SAME SHAPE. Both reference implementations are
        run against smoothness counts with known closed forms - Psi(x, y) = floor(x) for
        y >= x, and Psi(x, 2) = floor(log2 x) + 1 - and against each other. A reference
        that misses a closed form is broken before any archived array is read.
    proof_obligations:
    - claim: >-
        REF-SP and REF-EXACT are two INDEPENDENT computations of the same quantity at the
        bits-16 rungs where both complete.
      responsibility: correctness
    - claim: >-
        The exact dynamic program counts exactly the integers in [1, x] all of whose
        prime factors are at most y, with no floating point anywhere in the count.
      responsibility: correctness
    - claim: >-
        Every reported ratio names its reference AND its domain, and no ratio computed at
        one domain is compared against a threshold registered for the other.
      responsibility: interface
    - claim: >-
        The exact count's cost is measured per rung against a declared cap rather than
        assumed feasible.
      responsibility: runtime

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    NULL BY DESIGN AND NOT BY OMISSION. This hypothesis claims no complexity improvement,
    no exponent, no memory bound and no cofactor. It is about a reference function, and
    an outcome in any direction moves none of the four promotion gates in
    agents/coordinator.md, which remain OPEN and untouched.

  heuristic_assumptions:
  - id: HEUR-SP-1
    formal_statement: >-
      For x and y ranging over the ten archived (D, Bsm) pairs of the EXP-LPF-001 frozen
      ladder - x in {2**32, 2**40} paired with its own five integer Bsm values, and
      equally for x in {2177435569, 589134537601} paired with the same Bsm values - the
      Hildebrand-Tenenbaum saddle-point estimate Psi_sp(x, y) approximates the true count
      Psi(x, y) of y-smooth integers in [1, x] to within relative error strictly below
      0.10, uniformly over those pairs. Here Psi_sp(x, y) = x**alpha * zeta(alpha, y) /
      (alpha * sqrt(2 * pi * sigma2(alpha, y))), with alpha the unique positive solution
      of sum over primes p <= y of log p / (p**alpha - 1) = log x, zeta(alpha, y) the
      product over primes p <= y of (1 - p**(-alpha))**(-1), and sigma2(alpha, y) the sum
      over primes p <= y of (log p)**2 * p**alpha / (p**alpha - 1)**2.
      QUANTIFIERS ARE OVER A FINITE EXPLICIT SET OF PAIRS, NOT OVER AN ASYMPTOTIC RANGE.
      This is deliberate - the heuristic is asserted only where it will be checked, and
      no uniformity in x or y beyond those pairs is claimed by this record.
    random_model_justification: >-
      NONE IS REQUIRED AND NONE IS OFFERED, AND THAT IS THE POINT. HEUR-SP-1 is not a
      claim that some arithmetic object behaves like a uniform random integer; it is a
      claim about the numerical accuracy of an analytic estimator for a counting function
      whose value is an integer computable in principle. The rigorous-bound times
      classical-distribution-theorem justification pattern of docs/target-result-profile.md
      A2 does not apply, and asserting one here would be decoration. What replaces it is
      that the heuristic is DIRECTLY DECIDABLE at toy scale - REF-EXACT computes the very
      integer the estimator estimates - which is a stronger position than a justified
      heuristic and is why this record is worth running before any of the lane's
      conditional statements are recomputed.
    supporting_results:
    - >-
      Hildebrand and Tenenbaum, saddle-point method for Psi(x, y). PROVENANCE recalled;
      NOT DISCHARGED. Under AGENTS.md rule 9 a recalled reference is a pointer for a
      reviewer and never support, so this entry does NOT discharge the obligation. The
      primary source must be read and a KN-LIT entry authored before the implementation
      is frozen; that is registered as approval gate LIT-1 on EXP-ECDLP-523318 and no
      KN identifier is minted by this record.
    - >-
      Hildebrand's theorem for the asymptotic reference, supplying the ERROR SCALE
      log(u+1)/log y of the incumbent. PROVENANCE recalled; NOT DISCHARGED; same gate.
    validation_experiment_ids:
    - EXP-ECDLP-523318
    falsification_condition: >-
      At any bits-16 rung where REF-EXACT completes, |Psi_sp(x, Bsm) / Psi(x, Bsm) - 1|
      is at least 0.05 at the matched domain x. That observation refutes HEUR-SP-1 over
      the tested pairs AND voids the exercise under F3, because two references that
      disagree cannot jointly adjudicate a third. It is an implementation-or-estimator
      finding and no branch about the archived arm is read in either direction.

  structural_ingredients:
  - description: >-
      Hildebrand's theorem, in the form Psi(x, y) = x * rho(u) * (1 + O(log(u+1)/log y))
      with u = log x / log y, valid uniformly in a stated range of (x, y). It supplies
      the ERROR SCALE of the incumbent reference and therefore the reason to expect a
      finite-y defect at these cells.
    citation: >-
      A. Hildebrand, "On the number of positive integers <= x and free of prime factors
      > y", Journal of Number Theory (1986). THE UNIFORMITY RANGE IS UNSETTLED IN THIS
      RECORD AND IS AN APPROVAL GATE. IDEA-20260802-001 states the range as
      log x < y <= x**(1/3). The coordinator's own recollection of the standard statement
      is different - uniformly for x >= y >= 2 with u bounded by exp((log y)**(3/5 - eps))
      - and BOTH are provenance `recalled`, so neither is support. The primary source
      must adjudicate before implementation is frozen (gate RANGE-1 on EXP-ECDLP-523318).
      The disagreement is load-bearing - under the range as the proposal states it, the
      low-u rungs of the frozen ladder sit at or outside the upper boundary y <= x**(1/3),
      which the experiment records as a per-rung membership flag.
    provenance: recalled
    verified_by: null
    role: error scale of the incumbent absolute reference
  - description: >-
      The Hildebrand-Tenenbaum saddle-point estimate for Psi(x, y), with alpha defined by
      sum over primes p <= y of log p / (p**alpha - 1) = log x. It supplies the
      replacement reference REF-SP, which does not pass to the u -> infinity asymptotic
      and so is not expected to degrade at small y.
    citation: >-
      A. Hildebrand and G. Tenenbaum, "On integers free of large prime factors",
      Transactions of the American Mathematical Society (1986). RECALLED AND UNREAD IN
      THIS PROGRAM. The exact formula, its error term and its stated uniformity range
      must be transcribed from the primary source before the implementation is frozen;
      IDEA-20260802-001 records the same duty and the same owed KN-LIT entry.
    provenance: recalled
    verified_by: null
    role: replacement reference REF-SP
  - description: >-
      The Dickman-de Bruijn function rho, the incumbent reference of EXP-LPF-001, defined
      by the delay equation and evaluated numerically. Used here only as the baseline
      being measured against and as a regression fixture.
    citation: >-
      Dickman (1930) and de Bruijn (1951), as the classical origin of rho; and, as a
      modern secondary source naming explicit estimates for smooth-number counts, the
      preprint arXiv 1705.02442 named in IDEA-20260802-001's novelty screen. ALL RECALLED
      AND UNREAD IN THIS PROGRAM.
    provenance: recalled
    verified_by: null
    role: incumbent reference and regression fixture
  - description: >-
      The archived apparatus and its numbers - the EXP-LPF-001 frozen contract (the D
      formula, the u formula, the integer Bsm ladders, the [1/8, 8] band, the
      range_matching_note), the RUN-LPF-001-calib arrays, and the independent
      recomputation of the uniform arm's R(u) at TASK-20260801-051.
    citation: >-
      experiments/EXP-LPF-001/specification.yaml;
      experiments/EXP-LPF-001/runs/RUN-LPF-001-calib/raw-result.json;
      experiments/EXP-LPF-001/results/calib/null_replicate_statistics.json;
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-051/calibration_validation_report.yaml
    provenance: internal
    verified_by: >-
      coordinator, in this design session, by direct read of each committed path named
      above. The dispatching session's TASK identifier is assigned at dispatch and is
      deliberately not minted here.
    role: the archived arm, the frozen apparatus, and the figures to beat

  reduction_chain:
    core_problem: null
    corollaries: []

  predictions:
  - metric: max_rung_absolute_log_ratio_saddle
    direction: lower
    minimum_effect: >-
      max_u |ln R_sp_D(u)| at most 0.8169 at bits 16 and at most 0.5390 at bits 20, being
      a factor-of-3 reduction against the archived 2.4506 and 1.6171. The source proposal
      states the bits-16 target in rounded form as 0.82; the exact quotient governs and
      is the stricter of the two by 0.0031. A reduction smaller than a factor of 3 at
      EITHER cell fails this prediction.
  - metric: limb_b_decidable_rung_count
    direction: higher
    minimum_effect: >-
      10 of 10 rungs inside the frozen [1/8, 8] band under REF-SP at the archived domain,
      against the archived 9 of 10 under rho. Nine or fewer fails.
  - metric: exact_reference_residual_bits16
    direction: same
    direction_vocabulary_note: >-
      The template's direction vocabulary is higher|lower|different and has no value for
      a predicted NULL effect. `same` is used, as IDEA-20260802-001 used it, and the
      decidable content is the band below, not the word.
    minimum_effect: >-
      With REF-EXACT at bits 16, computed over the sampler's own recorded support
      X = 2177435569, R_exact(u) lies inside [0.90, 1.11] at every rung where the exact
      count completes. THIS IS THE ABSOLUTE DISCRIMINATOR - a point prediction against a
      reference that is a theorem rather than an approximation, and it can fail.
  - metric: monotonicity_of_post_correction_residual_in_u
    direction: increasing
    minimum_effect: >-
      The ARCHIVED R_rho(u) is strictly increasing in u at both cells, and that is used
      here as the ARTIFACT TELL rather than as a result - a reference error must grow
      with u because the Hildebrand error term grows with u at fixed x. The prediction is
      that any residual surviving the saddle correction is likewise monotone in u. A
      non-monotone post-correction residual indicates that the residual is NOT a
      reference effect, whatever its magnitude.

  test_boundary:
    instances:
    - >-
      The archived bits-16 cell of RUN-LPF-001-calib - field prime p = 46663, sampler
      support X = p**2 = 2177435569, frozen D = 2**32 = 4294967296, 200 uniform
      replicates of n = 130816 draws at each of five frozen integer Bsm rungs.
    - >-
      The archived bits-20 cell - p = 767551, X = p**2 = 589134537601,
      D = 2**40 = 1099511627776, same replicate and draw counts, same five rung
      structure with its own integer Bsm ladder.
    parameters:
      cells_are_toy: >-
        BOTH CELLS ARE TOY PARAMETERS AND ARE LABELLED AS SUCH EVERYWHERE. `bits` names
        the FIELD prime and nothing else, per EXP-LPF-001's RT047-B5 discipline.
      bsm_ladder_bits16: [65536, 1626, 256, 84, 40]
      bsm_ladder_bits20: [1048576, 10321, 1024, 256, 102]
      u_source: >-
        Every reference is evaluated at the ARCHIVED recomputed u, never at the nominal
        integer u_target. The archived non-integer values include 2.99987488400962,
        5.00600922694629 and 6.012858390691442 at bits 16 and 3.0000085936215726 and
        5.994821665277897 at bits 20.
      reference_domains: >-
        Two declared levels, x = D (the archived choice, which defines u) and x = X (the
        sampler's recorded support). Every reference is evaluated at both and every
        reported ratio carries its domain label.
      precision: >-
        Exact Python integers for all counts; a declared decimal context of 50
        significant digits for the saddle evaluation, where cancellation is a real risk;
        IEEE double for the rho quadrature, whose adequacy is demonstrated by the
        regression fixture rather than assumed.
    implementation: >-
      Pure Python 3 standard library. NO NETWORK, NO PARI/GP, NO SAGEMATH, and no sympy
      or mpmath on any decisive path. Declared here at design time and checked at
      dispatch, because two producers in one batch of GOAL-ECRANK-002 held different
      toolchains and the second lost half its protocol to a requirement discovered
      mid-run rather than declared.
    budget:
      wall_clock_seconds: 5400
      memory_gb: 8
      maximum_runs: 3

  falsification_conditions:
  - >-
    'F1 - the saddle reference reduces max_u |ln R(u)| by less than a factor of 3 at
    either cell, i.e. max_u |ln R_sp_D(u)| exceeds 0.8169 at bits 16 or exceeds 0.5390 at
    bits 20. Then the departure is NOT explained as a finite-y reference effect and the
    sampler or the specification is implicated. Branch (b). THIS IS A POSITIVE FINDING
    ABOUT THE APPARATUS AND IS REPORTED AS SUCH, NEVER AS A NULL RESULT.'
  - >-
    'F2 - REF-EXACT at bits 16 puts the archived uniform arm outside [0.90, 1.11] at any
    rung where the exact count completes. Then the archived uniform arm is not behaving
    as a uniform sample of its stated support against a reference that is a THEOREM. This
    is the strongest instrument finding this design can produce, and it BLOCKS every LPF
    reading that rests on the uniform arm until the departure is localized.'
  - >-
    'F3 - REF-SP and REF-EXACT disagree by more than 5 percent at any bits-16 rung where
    both complete, at the matched domain. Implementation or estimator failure; the
    exercise is VOID and NO BRANCH IS READ IN EITHER DIRECTION.'
  - >-
    'F4 - the post-correction residual ln R_sp(u) is non-monotone in u at either cell,
    outside the archived Monte-Carlo error of the p_hat means. Then the residual is not a
    reference effect; report branch (c) with the residual as a named open item rather
    than as a result.'

  interpretation_limits:
  - >-
    THIS MOVES NO EXPONENT AND MAKES NO STATEMENT ABOUT THE SEMAEV MAP IN EITHER
    DIRECTION. It concerns the reference and the archived uniform calibration arm only.
    The real arm of EXP-LPF-001 is not read, re-read or re-scored, and its artifacts are
    on the experiment's declared forbidden-read list.
  - >-
    A repaired reference at toy D = 2**32 and D = 2**40 is a repaired reference at toy D.
    NO OUTCOME TRANSFERS UPWARD BY ANY ARGUMENT THIS RECORD OFFERS. The transfer
    assumption that would be needed - that the saddle-point estimator's accuracy at
    y in [40, 1048576] predicts its accuracy at cryptographic y - is NOT made here, is
    NOT tested here, and is IDEA-20260802-004's object, not this one.
  - >-
    NO CRYPTOGRAPHIC CLAIM AND NO ECDLP COST CLAIM IS ASSERTED AT ANY OUTCOME. This
    experiment measures a REFERENCE, not an attack. It computes no discrete logarithm,
    claims no relation, and its certificate kind is `none`.
  - >-
    THE DESIGN IS BLIND TO ERRORS THE TWO ANALYTIC REFERENCES SHARE at any rung where
    REF-EXACT does not complete. Both are integer-smoothness references; a departure
    caused by the ENCODING producing non-uniform integers is invisible to REF-SP and to
    rho alike, and is only detectable where the exact count runs. That is precisely why
    REF-EXACT may not be dropped for budget.
  - >-
    Nothing here authorizes editing RR-LPF-1, RR-LPF-2, the EXP-LPF-001 specification, or
    any archived run record. A correction to a frozen band is a SUPERSEDING RECORD UNDER
    A NEW ID (AGENTS.md rule 4), and this record neither performs nor pre-authorizes one.
  - >-
    EXP-LPF-001's CAL-LPF-1 states that the calibration is NON-EVIDENTIAL in either
    direction and that no calibration number may be cited as evidence about any
    hypothesis. Whether reading those archived numbers as measurements of the REFERENCE,
    inside a different experiment about the reference, is compatible with that clause is
