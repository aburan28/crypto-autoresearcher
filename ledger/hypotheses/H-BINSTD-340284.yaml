# =============================================================================
# H-BINSTD-340284 -- Reduction-polynomial sparsity is a c_leaf-axis-only lever
# for CNF-XOR descended point-decomposition, with a width-matched relabelling
# null that separates sparsity from IDEA-20260915-7ef636's order effect.
# Specified and approved under DEC-20261001-f29259 from IDEA-20260922-9d12bd
# under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001, absorbing the 2026-09-26 review
# defects (analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-9d12bd.yaml;
# verdict sound_with_corrections / HOLD-I): (1) do not duplicate the sibling
# CNF-XOR basis experiment owned by IDEA-20260922-f37254 / IDEA-20260922-cdca3a
# consolidation — this packet freezes 9d12bd's DISTINCTIVE deliverable (axis
# framing + width-matched relabelling discriminator); (2) WDSat missing —
# encoder-level metrics are primary; SAT conflict/seconds-per-leaf is an
# optional Stage-2b arm gated on instrument availability; (3) census
# re-verification obligation for sect*r1/r2 rows.
#
# ZERO RUNS in this design packet. IDEA-20260922-9d12bd claim text is not
# edited (proposals immutable); this hypothesis cites it and freezes the
# HOLD-I-absorbed restatement for experimental purposes.
# =============================================================================
hypothesis:
  id: H-BINSTD-340284
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-9d12bd
  experiment_id: EXP-BINSTD-a8efe2
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-01'
  approved_at: '2026-10-01'
  authorised_by: DEC-20261001-f29259
  review_cited: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-9d12bd.yaml
  sibling_ideas_noted:
    - IDEA-20260922-f37254  # same axis; NOT_OPEN (text-cited); phi-transport / no-trinomial control
    - IDEA-20260922-cdca3a  # HOLD-I survivor carrier (NISTBIN); still open; Hamming-weight confound
    - IDEA-20260922-99294c  # basis-invariance of fully-determined shape; still open (low)
  proposed_by: coordinator
  title: >-
    Reduction-polynomial sparsity (pentanomial vs trinomial) moves CNF-XOR
    c_leaf (clause width) and not N_leaf; width-matched vs unmatched
    relabelling nulls separate sparsity from unstructured order effects

  statement: >-
    SETTING. Binary fields F_{2^n} with a CNF-XOR encoding of the descended
    point-decomposition (pdp) system (Trimoska CNF-XOR model / program
    encoder). Primary arithmetic: m=3; structural fixture at l in {3,4};
    encoder-level measurement at l in {6,7,8}. Toy field F_{2^9} admitting
    BOTH a trinomial modulus (x^9+x+1) AND a pentanomial modulus (exhibited
    at Stage 0; review confirmed trinomial irreducible). CLAIM TIER toy.
    NO ATTACK, NO EXPONENT.

    (A) CENSUS AXIS (field-degree → basis type). The standardized binary
    population partitions by reduction-polynomial sparsity: ppBasis
    (pentanomial) vs tpBasis (trinomial). Basis type is a property of the
    field degree alone. Stage 0 re-greps analysis/binstd-curve-audit/
    binary-curve-params.txt and flags sect*r1/r2 rows for m in
    {233,283,409,571} with an explicit primary-text re-verification
    obligation (HOLD-I defect 3) before claim strength.

    (B) AXIS-PURITY CLAIM (H1). At matched (m,l,n), changing only the
    reduction polynomial (trinomial ↔ pentanomial) while holding the block
    partition and monomial support fixed leaves the ml core-variable count
    and therefore (by Trimoska Proposition 1's backdoor, cited not
    re-derived) the leaf-count axis N_leaf within [0.95,1.05], while the
    F-set clause-width distribution and substitution-variable counts
    (encoder-level c_leaf proxies) are measurably higher under the
    pentanomial arm. A normal-basis arm is a THIRD, separately interpreted
    control (structure-constant multiplication, not schoolbook-plus-
    reduction).

    (C) RELABELLING-NULL DISCRIMINATOR (H2) — DISTINCTIVE DELIVERABLE.
    A basis change is technically a linear relabelling, so any
    pentanomial/trinomial difference could be misread as IDEA-20260915-
    7ef636's unstructured-order effect. Discriminator: (i) UNMATCHED
    random invertible F_2-linear relabelling per block MUST reproduce
    7ef636's large N_leaf blow-up at the tested cell; (ii) WIDTH-MATCHED
    random relabelling (clause-width histogram matched to a real-basis
    arm) MUST show N_leaf ratio within [0.9,1.1] of that arm. Failure of
    (ii) voids sparsity attribution.

    (D) HOLD-I INSTRUMENT GATE. WDSat is NOT installed in this repository
    (review defect 2; confirmed design-session absence). Authorized
    success criteria for Stages 0–2a and Stage 3-at-fixture-scale use
    encoder-level metrics and brute-force certificate equality at small
    (m,l). Conflict-count / seconds-per-leaf (Stage 2b) is OPTIONAL and
    records instrument_unavailable (infrastructure, AGENTS.md rule 3)
    when no CNF-XOR SAT engine is present — never a negative math result.

    (E) NON-DUPLICATION (HOLD-I defect 1). This packet does NOT re-own
    f37254's phi-transport / no-trinomial-control design or cdca3a's
    Hamming-weight confound experiment. It freezes 9d12bd's axis framing
    and width-matched discriminator as the BINSTD measurement for this
    IDEA; sibling seams remain separately designable.

  statement_note: >-
    IDEA-20260922-9d12bd claim text is immutable and left at status proposed.
    Review verdict sound_with_corrections (HOLD-I). Defects absorbed into
    this hypothesis and EXP-BINSTD-a8efe2: non-duplication, WDSat gate,
    census re-verification. Source IDEA Stages 2–3 SAT leaf-count grid at
    l in {6,7,8} is retained only as the OPTIONAL Stage 2b / scale-up arm.

  mechanism: >-
    OBJECT FRAME. Representation: the F_2-basis / reduction polynomial used
    to expand field products in the descended Boolean system (R1 of
    RQ-ECDLP-623a32). Attack stage: point-decomposition SOLVING per-node
    cost (c_leaf), not membership, not relation collection. No new tracked
    object / lossy projection — measures a representation-level cost
    parameter of the existing Class-I descended system.
    WHY AXIS PURITY IS PRINCIPLED. Proposition 1 (Trimoska) fixes the strong
    backdoor at the ml core variables from SUBSTITUTION STRUCTURE (which
    monomials determine which variables), independent of the bilinear form's
    entries. Changing the reduction polynomial changes clause WIDTH (how
    many input-bit products XOR into each output bit) without changing
    domain/codomain of that form — hence N_leaf predicted flat, c_leaf not.
    WHY NOT f37254 / cdca3a. Those own phi-transport / Hamming-weight
    confound on the same sparsity axis; this hypothesis owns the
    (N_leaf, c_leaf) attribution language of IDEA-20260904-7fd218 plus the
    width-matched vs unmatched discriminator that keeps a sparsity finding
    from collapsing into IDEA-20260915-7ef636.

  assumptions:
    - >-
      Field multiplication expands via schoolbook-plus-reduction (as in the
      program's polynomial-basis tooling); a solver-side strategy that avoids
      an explicit bilinear form voids the mechanism and is out of scope.
    - >-
      ml core-variable count and block partition are identical across
      trinomial, pentanomial, and (if constructed) normal-basis arms at
      matched (m,l,n) — verified as Stage-1 structural fixture before any
      between-arm cost claim.
    - >-
      Component used: F2 (factor-base decomposition) setting only; no new
      F1–F7 off-limits object.
    - No run at m>=131. Deployed curves appear only as census rows.
    - >-
      WDSat / CNF-XOR SAT engine may be absent; Stages 0–2a and fixture-scale
      Stage 3 remain decidable without it.

  proof_search_map:
    bottleneck: >-
      Whether descended per-node cost (c_leaf / clause width) depends on
      reduction-polynomial sparsity while leaf count stays flat — and whether
      that dependence can be told apart from unstructured variable-order
      scrambling (7ef636), which would otherwise make any naive
      pentanomial-vs-trinomial comparison uninterpretable.
    baseline_embedding:
      parameter_slice: >-
        m=3; toy n=9 admitting trinomial x^9+x+1 and a pentanomial alternative
        (Stage 0 exhibits both by irreducibility testing); structural fixture
        at l in {3,4}; encoder grid at l in {6,7,8}.
      reproduction_check: >-
        (i) Stage 0 confirms both moduli irreducible at n=9. (ii) Stage 1:
        identical core-variable count and block partition across arms;
        certificate-set equality by brute force. (iii) Unconstrained leaf /
        solution counts at fixture scale match across real-basis arms within
        [0.95,1.05] before any c_leaf claim is read.
    observation_collision:
      observable: >-
        Pair (N_leaf or fixture solution-count, clause-width /
        substitution-variable distribution) under each basis arm.
      distinct_preimage_search: >-
        A c_leaf difference could be (i) genuine sparsity or (ii) encoder
        artefact. Broken by reporting RAW clause-width and substitution-
        variable histograms from the encoder before any solve. An N_leaf
        difference could be sparsity-on-wrong-axis or 7ef636 order effect;
        broken by width-matched vs unmatched relabelling controls.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold N_leaf fixed (predicted) and vary reduction polynomial; the
          distinguishing invariant is clause-width / c_leaf.
        predicted_gain: >-
          Measurable clause_width_ratio > 1 for pentanomial over trinomial,
          with axis purity on N_leaf, surviving the width-matched null.
    quantifier_order: >-
      CLAIMED at tested toy cells: FOR ALL arms with both moduli available at
      the tested n, leaf/solution-count ratio within [0.95,1.05] and
      clause-width distribution differing with pentanomial denser.
      NOT CLAIMED: closed-form multiplier; any m>=131 statement; Gröbner-arm
      basis sensitivity; that WDSat is installed.
    method_ceiling:
      strongest_certifiable_claim: >-
        Toy-scale (N_leaf or fixture solution-count, clause-width, optional
        c_leaf) under three basis arms with discriminator pass/fail. Cannot
        certify production field arithmetic at m>=131; cannot certify
        Gröbner column; cannot claim SAT conflict metrics without an engine.
      nearby_object_control: >-
        BLOCKING. Unmatched random relabelling must show large N_leaf
        effect; width-matched must stay near 1. If both blow up equally,
        discriminator has no power and sparsity attribution is not licensed.
    proof_obligations:
      - claim: Toy n=9 admits exhibited irreducible trinomial and pentanomial moduli
        responsibility: baseline
      - claim: Core-variable count and block partition identical across real-basis arms
        responsibility: correctness
      - claim: Clause-width and substitution-variable distributions measured from encoder
        responsibility: runtime
      - claim: Width-matched control's clause-width histogram matches its target arm
        responsibility: strictness
      - claim: No exponent / deployed-curve security claim; WDSat absence is infrastructure
        responsibility: scope

  asymptotic_claim:
    problem: ECDLP on standardized binary curves via x-coordinate point decomposition, CNF-XOR arm
    prior_best: >-
      IDEA-20260904-3c7a91 leaf-count ceiling / IDEA-20260904-96c4f3 frontier;
      matched rho baseline for ECC2K-130 (KN-LIT-096 / lane convention)
    time_exponent: Unchanged (constant factor on c_leaf predicted; leaf count flat)
    memory_exponent: Unchanged
    hidden_cofactor: None claimed; clause-width→wall-clock link checked when Stage 2b runs
    claim_kind: constant_factor

  heuristic_assumptions:
    - id: HEUR-BINSTD-340284-H1
      formal_statement: >-
        AXIS PURITY. For the CNF-XOR pdp model at m=3 and tested l, changing
        the reduction polynomial (or polynomial-vs-normal basis) while holding
        block partition and monomial support fixed changes expected clause
        width / E[c_leaf] by a measurable factor while changing expected
        leaf/solution count by less than 5%, uniformly over the tested n.
      random_model_justification: >-
        RIGOROUS ingredient: backdoor depends on substitution structure
        (basis-independent). Heuristic extrapolation: Boolean encodings of
        denser bilinear forms yield wider XOR clauses without changing which
        variables are core.
      supporting_results:
        - ref: IDEA-20260922-9d12bd
          provenance: internal
          claim: H1 axis-purity statement and Prop-1 backdoor argument
          verified_by: coordinator, this design session (Read, full proposal)
        - ref: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-9d12bd.yaml
          provenance: internal
          claim: core_argument_check step 'axis purity' verdict holds
          verified_by: coordinator, this design session (Read, full review)
        - ref: SRC-SATIC-TRIMOSKA-2019
          provenance: recalled
          claim: Proposition 1 — ml core variables form a strong backdoor (pointer only)
          verified_by: null
      validation_experiment_ids:
        - EXP-BINSTD-a8efe2
      falsification_condition: >-
        leaf_count_ratio or fixture solution-count ratio outside [0.95,1.05]
        at any cell with a passing structural fixture.
    - id: HEUR-BINSTD-340284-H2
      formal_statement: >-
        DISCRIMINATOR VALIDITY. A random F_2-linear relabelling constructed to
        match a real basis arm's clause-width DISTRIBUTION has N_leaf (or
        fixture solution-count) within 10% of that arm, while an UNMATCHED
        random relabelling reproduces a large-effect regime comparable to
        IDEA-20260915-7ef636's order effect at the tested cell.
      random_model_justification: >-
        Instrumental assumption about which property of a relabelling drives
        search cost; stated to be falsifiable, not relied on as a theorem.
      supporting_results:
        - ref: IDEA-20260922-9d12bd
          provenance: internal
          claim: H2 width-matched vs unmatched discriminator design
          verified_by: coordinator, this design session (Read, full proposal)
        - ref: IDEA-20260915-7ef636
          provenance: recalled
          claim: Unstructured relabelling large N_leaf / conflict blow-up at l=6 (pointer)
          verified_by: null
      validation_experiment_ids:
        - EXP-BINSTD-a8efe2
      falsification_condition: >-
        Width-matched control reproduces unmatched control's large N_leaf
        effect (discriminator has no power).

  structural_ingredients:
    - description: >-
        Trimoska Proposition 1 — ml core variables as strong backdoor w.r.t.
        unit propagation, independent of clause-encoding details.
      citation: SRC-SATIC-TRIMOSKA-2019
      provenance: recalled
      verified_by: null
      role: basis-independent N_leaf invariance argument (pointer)
    - description: Two-axis (N_leaf, c_leaf) attribution language for CNF-XOR pdp
      citation: IDEA-20260904-7fd218
      provenance: recalled
      verified_by: null
      role: axis vocabulary this record extends (pointer)
    - description: Unstructured relabelling order effect as the confound to rule out
      citation: IDEA-20260915-7ef636
      provenance: recalled
      verified_by: null
      role: unmatched-control prior (pointer)
    - description: HOLD-I review restatement and concrete_experiment cell
      citation: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-9d12bd.yaml
      provenance: internal
      verified_by: coordinator, this design session (Read, full review)
      role: defect list + Stage-0 n=9 cell confirmation

  reduction_chain:
    core_problem: >-
      Measure whether reduction-polynomial sparsity is a c_leaf-only lever on
      CNF-XOR descended pdp systems at toy binary fields
    corollaries:
      - problem: field-degree → ppBasis|tpBasis census cells for RQ-BINSTD reachability table
        reduction_ref: Stage 0 audit grep + flagged primary-text re-verification
        asymptotics_preserved: true

  predictions:
    - metric: leaf_or_solution_count_ratio (pentanomial / trinomial)
      direction: flat
      minimum_effect: within [0.95, 1.05] at every cell with passing structural fixture
    - metric: clause_width_ratio (pentanomial / trinomial), F-set clauses
      direction: higher
      minimum_effect: >-
        Measurably above 1; distinguishable from noise across >=5 seeds;
        no closed-form floor pre-committed
    - metric: substitution_variable_count_ratio (pentanomial / trinomial)
      direction: higher
      minimum_effect: consistent in direction with clause_width_ratio
    - metric: unmatched_vs_width_matched_N_leaf_discriminator
      direction: different
      minimum_effect: >-
        Unmatched large effect; width-matched within [0.9,1.1] of target arm
    - metric: certificate_set_equality across real-basis arms at fixture cells
      direction: flat
      minimum_effect: exact multiset equality
    - metric: stage2b_sat_engine_available
      direction: different
      minimum_effect: >-
        Boolean; if false, Stage 2b writes instrument_unavailable and does
        not score conflict/seconds-per-leaf (infrastructure, not falsification)

  test_boundary:
    instances:
      - >-
        BIN-TOY-F29: F_{2^9} with irreducible trinomial x^9+x+1 and an
        exhibited irreducible pentanomial (Stage 0 records exact poly);
        Koblitz-analogue or ordinary binary curve over that field for pdp
        encode (exact (A,B) recorded at setup)
      - >-
        Optional CERTBIN RC-1 (n=17) structural-fixture reproduction cell
        if encoder reuse from EXP-CERTBIN-e94b27 is cheaper than building
        only n=9 — not required for Stage 0
    parameters:
      m: [3]
      l_fixture: [3, 4]
      l_encoder: [6, 7, 8]
      n_primary: [9]
      seeds_min: 5
    implementation: >-
      New per-basis Tseitin/CNF-XOR encoder variants + width-matched
      relabelling generator under experiments/EXP-BINSTD-a8efe2/implementation/;
      optional reuse of experiments/EXP-CERTBIN-e94b27/impl/gf2n.py + curve.py.
      WDSat not required for Stages 0–2a / fixture-scale Stage 3.
    budget:
      wall_clock_seconds: 28800
      memory_gb: 4
      maximum_runs: 30

  falsification_conditions:
    - >-
      leaf_or_solution_count_ratio outside [0.95,1.05] with passing structural
      fixture — axis purity false (escalate; more important than a positive).
    - >-
      Structural fixture fails (core-variable count or equisatisfiability
      differs) — instrument defect; no cost conclusion.
    - >-
      Width-matched relabelling reproduces unmatched large N_leaf effect —
      discriminator powerless; no sparsity attribution licensed.
    - >-
      clause_width_ratio and (when Stage 2b available) seconds_per_leaf_ratio
      disagree in direction — proxy fails; need different observable.
    - >-
      Certificate sets differ across real-basis arms at any brute-forceable
      cell — encoding bug, not a result.

  interpretation_limits:
    - Stages authorized here only; no deployed-curve attack; no exponent claim.
    - CLAIM TIER toy; l<=8, m=3, n=9 primary.
    - Census is secondary-source until Stage 0 re-grep + flagged FIPS/ANSI note.
    - No Gröbner-arm basis claim.
    - Sibling f37254/cdca3a seams not adjudicated here.
    - WDSat absence is infrastructure, never negative math evidence.

  distinguishable_outcomes:
    - id: DO-1-axis-purity-confirmed
      description: >-
        N_leaf/solution-count flat; clause_width_ratio > 1; discriminator
        passes — seventh c_leaf ingredient beside 7fd218's six.
      next_decision: support_scoped_toy + promote census cell
    - id: DO-2-axis-purity-refuted
      description: >-
        leaf_or_solution_count_ratio outside [0.95,1.05] — basis choice moves
        N_leaf; escalate (more surprising).
      next_decision: weaken + spawn N_leaf-axis follow-on
    - id: DO-3-discriminator-fail
      description: >-
        Width-matched control blows up like unmatched — no sparsity
        attribution licensed.
      next_decision: inconclusive on sparsity; refine controls
    - id: DO-4-structural-fixture-fail
      description: Instrument/encoding defect at Stage 1.
      next_decision: repair_instrument
    - id: DO-5-infrastructure-wdsat
      description: >-
        Stage 2b unavailable — record instrument_unavailable; Stages 0–2a
        and fixture-scale Stage 3 remain interpretable.
      next_decision: checkpoint; do not reject_scoped on H1 from infra alone

  dominated_by: >-
    Matched rho on every standardized binary row (unaffected). Within pdp,
    IDEA-20260904-3c7a91 leaf-count ceiling is UNCHANGED under H1. Pareto-
    incomparable to IDEA-20260904-96c4f3 frontier rows (different axis).
    Extension of IDEA-20260904-7fd218's attribution table, not dominating it.
  sota_delta:
    time: Measured constant factor on c_leaf only (magnitude not pre-committed); zero on leaf count under H1; zero attack capability.
    memory: Unchanged.
    data_queries: N/A; adds census cell + reusable relabelling-null pattern.

  status: approved
  status_history:
