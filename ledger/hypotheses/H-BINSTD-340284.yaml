      at: '2026-10-01'
      by: coordinator
      note: minted from IDEA-20260922-9d12bd under design-experiment
    - status: approved
      at: '2026-10-01'
      by: DEC-20261001-f29259
      note: >-
        Approved under standing user authorization; HOLD-I defects absorbed;
        Stages 0–2a + fixture-scale Stage 3 frozen; Stage 2b optional;
        first executor handoff authorized (zero runs in this design session).
