  proposed_by: coordinator
  title: >-
    After EV-BINSTD-90c856, cell-scope package HEUR to (17,4) under band 0.70
    with Stage-2 null, and treat (17,3) dimVV collapse via product-rank escape
    or O-INSTRUMENT-BOUNDARY-17-3 (not a package gate)
  statement: >-
    CLAIM (heuristic_validation / encoding-size instrument; NO ATTACK; NO
    EXPONENT). Successor to H-BINSTD-73ea03 after EV-BINSTD-90c856 (package
    O-INCONCLUSIVE: (17,3) distinct_dimVV=2 across 72 shapes; scoped
    O-CELL-FAIL-BAND-17-4). Using a NEW frozen catalog (seed 2026100340; ≥32
    and ≤72 shapes; NOT seeds 2026100317/2026100320/2026100330): (A) PACKAGE
    is CELL-SCOPED to (n,ℓ)=(17,4) — ADMISSION twin meters agree and catalog
    yields ≥3 distinct dim(V·V) and ≥2 distinct N_var; only after (A),
    Spearman ρ ≥ 0.70 (O-SUPPORT) OR fails (O-FAIL-BAND); if (A) fails →
    package O-INCONCLUSIVE. (B) DIAGNOSTIC (17,3): product-rank-escape recipe
    either yields O-ESCAPE-OK-17-3 or O-INSTRUMENT-BOUNDARY-17-3; (17,3) does
    NOT gate package outcomes. (C) STAGE-2: when (17,4) floors met, permutation
    + random-Boolean matched-catalog null discriminates structure-specific
    fail-band vs instrument artifact. NO break. NO n≥131 transfer. Do NOT
    re-run EXP-BINSTD-9b18fc, EXP-BINSTD-16ee30, or EXP-BINSTD-5b2fd0 v1.
  mechanism: >-
    OBJECT FRAME as IDEA-20261001-febbe1 / H-BINSTD-73ea03. Operation set
    CHANGE: drop FORALL {(17,3),(17,4)} package gate after two measured
    collapses; product-rank-escape diagnostic on (17,3); Stage-2 null on
    (17,4). Twin meters unchanged.
  predictions:
    - metric: distinct_dimVV_values
      direction: lower_bounded
      minimum_effect: '≥ 3 distinct dim(V·V) on package cell (17,4)'
    - metric: distinct_Nvar_values
      direction: lower_bounded
      minimum_effect: '≥ 2 distinct N_var on package cell (17,4)'
    - metric: spearman_dimVV_vs_Nvar
      direction: lower_bounded
      minimum_effect: '≥ 0.70 on (17,4) after cell-scoped admission'
    - metric: diagnostic_17_3
      direction: same
      minimum_effect: O-ESCAPE-OK-17-3 or O-INSTRUMENT-BOUNDARY-17-3
    - metric: stage2_null_outcome
      direction: same
      minimum_effect: Named Stage-2 null outcome when (17,4) floors authorize the null
    - metric: twin_agreement
      direction: same
      minimum_effect: dimVV and N_var twin paths agree on every measured V
  test_boundary:
    instances:
      - 'Stage 0: product-rank escape freeze (17,3) + cell-scoped diversity (17,4); Stage-2 auth; twin probe'
      - 'Stage 1 authorized: package (17,4) floors then Spearman; diagnostic (17,3)'
      - 'Stage 2 authorized: permutation + random-Boolean null on (17,4) when floors met'
    parameters:
      spearman_band: 0.70
      catalog_seed: 2026100340
      bootstrap_seed: 2026100341
      null_seed: 2026100342
      bootstrap_reps: 200
      null_reps: 200
      min_catalog: 32
      max_catalog: 72
      floor_dimVV: 3
      floor_Nvar: 2
      package_cells: [{n: 17, ell: 4}]
      diagnostic_cells: [{n: 17, ell: 3}]
      forbidden_catalog_seeds: [2026100317, 2026100320, 2026100330]
      moduli:
        17: t^17+t^3+1
        19: t^19+t^5+t^2+t+1
        23: t^23+t^5+1
    implementation: >-
      Pure Python under experiments/EXP-BINSTD-4b846c/implementation/;
      command surface implementation/run.py driven by trial-plan-v1.json.
      No Magma/Sage/AUXIN/Bedrock.
    budget:
      wall_clock_seconds: 10800
      memory_gb: 2
      maximum_runs: 6
  falsification_conditions:
    - Twin meters disagree on any measured V (O-ARTIFACT).
    - Reading package O-SUPPORT/O-FAIL-BAND without (17,4) admission floors.
    - Re-imposing FORALL {(17,3),(17,4)} package gate under this card.
    - Re-using EXP-BINSTD-9b18fc / 16ee30 / 5b2fd0 catalog seeds.
    - Editing the 0.70 band after seeing encodings.
    - Claiming practical binary IC or an exponent move from a toy Spearman.
  distinguishable_outcomes:
    - id: O-SUPPORT
      meaning: Twin OK; (17,4) floors met; Spearman ρ ≥ 0.70. No attack claim.
    - id: O-FAIL-BAND
      meaning: Twin OK; (17,4) floors met; ρ < 0.70 (cell-scoped package).
    - id: O-INCONCLUSIVE
      meaning: (17,4) floors unmet; package band not read.
    - id: O-ESCAPE-OK-17-3
      meaning: Diagnostic product-rank escape meets (17,3) dimVV floors.
    - id: O-INSTRUMENT-BOUNDARY-17-3
      meaning: Diagnostic (17,3) still collapses; remains out of package gate.
    - id: O-CELL-FAIL-BAND-17-4
      meaning: Continuity label; CI95 entirely below 0.70 on (17,4).
    - id: O-STRUCTURE-SPECIFIC-FAIL-BAND
      meaning: Stage-2 null reaches band while observed CI below band.
    - id: O-NULL-ALSO-BELOW-BAND
      meaning: Stage-2 null also stays below band (possible instrument artifact).
    - id: O-ARTIFACT
      meaning: Twin disagreement or freeze/regression failure.
    - id: O-IMPEDIMENT
      meaning: Infrastructure timeout/crash/missing freeze. Never negative evidence.
  interpretation_limits:
    - Encoding-size correlation only; does not predict yield or beat rho.
    - Does not rewrite EV-BINSTD-90c856 / EV-BINSTD-69cb29 / EV-BINSTD-a99d47.
    - Cell-scoping is an instrument amendment, not a claim that (17,3) is solved.
    - No attack at field degree ≥ 131.
  heuristic_assumptions:
    - id: HEUR-BINSTD-4b846c-H1-CELL-17-4
      formal_statement: >-
        FOR Stage-1 package cell (17,4): after admission floors on the frozen
        cell-scoped catalog, Spearman ρ(dim(V·V), N_var) ≥ 0.70.
      random_model_justification: >-
        Same as IDEA-20261001-febbe1. Cell-scoping after EV-BINSTD-90c856
        removes the repeatedly unmet (17,3) quantifier; Stage-2 null is the
        artifact control.
      supporting_results:
        - EV-BINSTD-90c856
        - EV-BINSTD-69cb29
        - EV-BINSTD-a99d47
        - IDEA-20261003-c9c6c3
        - IDEA-20261003-94078e
        - KR-IC-73db3f
      validation_experiment_ids:
        - EXP-BINSTD-4b846c
      falsification_condition: >-
        Floors met and Spearman ρ < 0.70 (O-FAIL-BAND), OR twin failure
        (O-ARTIFACT), OR floors unmet on (17,4) (O-INCONCLUSIVE).
  asymptotic_claim:
    problem: >-
      Encoding-size predictability of Weil-descended S_3 XOR-SAT from
      dim(V·V) at toy binary IC cell (17,4) under a cell-scoped catalog
    prior_best: >-
      EV-BINSTD-90c856 (scoped fail-band; (17,3) instrument collapse);
      EV-BINSTD-69cb29 (partial floor repair)
    time_exponent: NO EXPONENT MOVED. Encoding-size instrument only.
