hypothesis:
  id: H-SNOVA-ec84c2
  question_id: RQ-SNOVA-001

  statement: >-
    SCOPE: the counting of admissible oil objects for UOV-family schemes whose
    coefficients lie in a finite F_q-algebra A, at (q, ell, n, o) small enough
    to enumerate exhaustively, plus exact integer arithmetic over the eleven
    parameter rows published on the SNOVA project page. CLAIM TIER toy for
    every enumerated cell; the parameter arithmetic is exact but is arithmetic
    on published parameters, not a measurement. NO ATTACK, NO SOLVER, NO
    RECOVERED KEY, NO FORGERY, NO STATEMENT THAT ANY PARAMETER SET IS BROKEN OR
    SAFE.
    The claim has two parts, and the second is a NEGATIVE that is asserted in
    advance.
    PART A (the counting theorem, unconditional). For a finite F_q-algebra A
    with dim_{F_q} A = ell, the number of free rank-k left A-submodules of A^N
    is: [N choose k]_{q^ell} when A is a field F_{q^ell}; [ell N choose ell k]_q
    when A = M_ell(F_q), by Morita equivalence with F_q; the product of two
    ordinary Gaussian binomials when A = F_q x F_q; and NOT a Gaussian binomial
    at all when A is local and non-semisimple, taking the value q(q+1) for
    A = F_q[x]/(x^2) at (N, k) = (2, 1). One parameter-free formula per algebra
    class, all fixed before any evaluation, must return every pre-registered
    integer exactly.
    PART B (the SNOVA instantiation and its non-binding ceiling). If SNOVA's
    secret transformation is A-linear for A = F_q[S] (READING 1), then
    log_q of the number of candidate oil objects is ell * o * (n - o), against
    ell^4 * o * (n - o) for a UOV over F_q with the SAME F_q variable count and
    the SAME F_q oil dimension - a deficit of exactly ell^3 in the exponent -
    and the entropy-matched plain-UOV instance is any (n', o') with
    o'(n' - o') = ell * o * (n - o). THE CONSEQUENT CEILING IS PREDICTED NOT TO
    BIND AT ANY PUBLISHED PARAMETER SET: the minimum over the eleven rows is
    1920 bits at (v, o, q, ell) = (24, 5, 16, 4) against a category-I claim,
    and the minimum of the tighter ell (v - o) log2 q ceiling is 160 bits at
    (37, 17, 16, 2). If either count comes out below its category level the
    prediction is falsified in the most consequential possible direction and
    the result is routed to review-breakthrough under AGENTS.md rule 12.
    If no frozen formula reproduces every pre-registered integer, the
    deliverable is a NAMED NO-GO with its exact boundary: the Morita/Gaussian-
    binomial family does not supply an oil-object count over the tested algebra
    classes, and the ell^3 figure is withdrawn.

  mechanism: >-
    DERIVED IN-REPO. No source for Morita equivalence or Gaussian-binomial
    counting was read in this session; every step below was derived here and
    checked against integers computed here, and each is a CANDIDATE TO TEST
    rather than an authority. The SNOVA-specific structure is RECALLED,
    UNVERIFIED except where a fetch is named.

    WHAT WAS ACTUALLY FETCHED, 2026-08-06. https://snova.pqclab.org/ returned
    HTTP 200 through the harness web tool, which renders a page through a
    summarising model: from it come the eleven rows (SL, (v, o, q, ell), public
    key size, signature size, private key sizes) with q = 16 on every row and
    ell in {2, 3, 4, 5}, and the definition of the ring as
    F_q[S] = {a_0 + a_1 S + ... + a_{ell-1} S^{ell-1}}. The SPECIFICATION
    DOCUMENT WAS NOT READ. https://eprint.iacr.org/2026/237 returned HTTP 200
    on the ABSTRACT PAGE: title "Exploiting SNOVA's Structure in the Wedge
    Product Attack", authors Bros, Le, Lichtinger, Minaud, Perlner, Smith-Tone,
    Valenzuela, dated 2026-02-13; THE BODY WAS NOT READ and no figure from that
    abstract is used anywhere in this hypothesis. GOAL-SNOVA-001's next_action
    forbids restating this program's inherited secondhand SNOVA figures and
    none is restated.

    PART A, DERIVED. Let A be a finite F_q-algebra of F_q-dimension ell and
    consider free rank-k left A-submodules of A^N.
      (A1) A = F_{q^ell}, a field. A^N is an F_{q^ell}-vector space of
        dimension N; rank-k free submodules are k-dimensional subspaces; the
        count is the Gaussian binomial [N choose k]_{q^ell}, whose order of
        magnitude is (q^ell)^{k(N-k)} = q^{ell k (N-k)}.
      (A2) A = M_ell(F_q). Let C = F_q^ell be the unique simple left A-module.
        Then A =~ C^ell as a left A-module, so A^N =~ C^{ell N}. Every left
        A-submodule of C^{M} is a direct sum of copies of C, and the lattice of
        such submodules is isomorphic to the lattice of F_q-subspaces of
        F_q^{M} - this is Morita equivalence made concrete, with
        Hom_A(C, C^M) =~ F_q^M. A submodule isomorphic to A^k = C^{ell k}
        therefore corresponds to an F_q-subspace of dimension ell k inside
        F_q^{ell N}, and the count is [ell N choose ell k]_q, of order
        q^{ell^2 k (N-k)}.
      (A3) A = F_q x F_q, split etale of dimension 2. Modules split along the
        two idempotents, so the count factors as [N choose k]_q squared.
      (A4) A = F_q[x]/(x^2), local with maximal ideal m = (x). Free rank-1
        submodules of A^2 are generated by unimodular vectors, so the count is
        (|A|^2 - |mA|^2)/|A^x| = (q^4 - q^2)/(q^2 - q) = q(q+1), which is NOT a
        Gaussian binomial. This case exists in the hypothesis specifically so
        that the instrument is forced to distinguish semisimple from
        non-semisimple rather than pattern-matching a binomial onto everything.
      (A5) SEMISIMPLICITY CRITERION, used by the paired proposal
        IDEA-20260805-54723a: A = F_q[S] is semisimple exactly when the
        characteristic polynomial of S is squarefree. In particular, when it is
        irreducible A =~ F_{q^ell} and case (A1) applies.
    SESSION-COMPUTED AND EXACTLY CONFIRMED OUTSIDE THE HARNESS, in pure Python,
    by enumerating every cyclic left submodule and closing under addition:
    A = M_2(F_2), N = 2 gives the submodule-size histogram {1: 1, 4: 15,
    16: 35}, so 35 free rank-1 submodules against [4 choose 2]_2 = 35 and 15
    simple submodules against [4 choose 1]_2 = 15; A = F_2[x]/(x^2), N = 2
    gives {1: 1, 2: 3, 4: 6}, so 6 = q(q+1) free rank-1 submodules against the
    5 = [2 choose 1]_4 of the semisimple algebra of the same dimension. THOSE
    NUMBERS WERE NOT PRODUCED INSIDE THE HARNESS. They are pre-registered in
    EXP-SNOVA-7e3625 to be recomputed there, and until they are, they are a
    derivation check and not a measurement.

    PART B, THE INSTANTIATION AND ITS THREE READINGS. SNOVA's signature
    variables are ell-by-ell matrices over F_q, so the flattened variable count
    is ell^2 n with n = v + o and the flattened oil dimension is ell^2 o. Three
    readings of which objects can be the secret oil space give three exponents:
      READING 1, secret transformation in GL_n(F_q[S]) acting on the n ring
        coordinates: candidates form Gr_A(o, n), count [n choose o]_{q^ell},
        log_q = ell * o * (n - o). WORKING READING; RECALLED, UNVERIFIED.
      READING 2, secret transformation in GL_n(M_ell(F_q)): count
        [ell n choose ell o]_q, log_q = ell^2 * o * (n - o).
      READING 3, no ring structure - the flattened generic UOV that an
        uncritical matched baseline uses: log_q = ell^4 * o * (n - o).
    Deficit of Reading 1 against Reading 3: exactly ell^3. Against Reading 2:
    exactly ell^2. NO READING IS ASSERTED TO BE SNOVA'S until the specification
    is read, and all three exponents are carried through every deliverable.

    THE TWO CEILINGS, AND WHY THE HYPOTHESIS ASSERTS THEY DO NOT BIND. Under
    Reading 1 the oil-object entropy is ell * o * v * log2 q bits. Computed
    exactly over the eleven fetched rows with log2 q = 4: (37,17,2) 5032;
    (25,8,3) 2400; (24,5,4) 1920; (56,25,2) 11200; (49,11,3) 6468; (37,8,4)
    4736; (24,5,5) 2400; (75,33,2) 19800; (66,15,3) 11880; (60,10,4) 9600;
    (29,6,5) 3480. Second, tighter ceiling: the SNOVA analogue of UOV's
    vinegar-guessing step costs (q^ell)^{v-o} under Reading 1 rather than
    q^{ell^2 (v-o)}, i.e. ell (v - o) log2 q bits: 160, 204, 304, 248, 456,
    464, 380, 336, 612, 800, 460 over the same rows in the same order. Every
    entry exceeds its category level. THE HYPOTHESIS THEREFORE PREDICTS ITS OWN
    NEGATIVE, WHICH IS THE POINT: the deliverable is not a break, it is the
    correct matched baseline plus two unconditional ceilings that this program
    has never recorded and that turn out not to bind.

    WHAT IS NOT DERIVED, AND IS THE WEAKEST LINK. Which of Readings 1-3 SNOVA
    occupies. That is not a matter of degree - it changes the headline factor
    from ell^3 to ell^2 to 1 - and this session could not settle it, because
    the project page gave the ring and not the group. Stage 0 of
    EXP-SNOVA-7e3625 exists solely to settle it, and every number above is
    reported with its reading attached.

  assumptions:
    - >-
      FROZEN FORMULA SET Psi, complete, parameter-free, and fixed BEFORE any
      evaluation.
      (1) Gaussian binomial [N choose k]_Q = prod_{i=0}^{k-1} (Q^{N-i} - 1) /
          (Q^{k-i} - 1).
      (2) A = F_{q^ell}: count = [N choose k]_{q^ell}.
      (3) A = M_ell(F_q): count = [ell N choose ell k]_q.
      (4) A = F_q x F_q: count = ([N choose k]_q)^2.
      (5) A = F_q[x]/(x^2), (N, k) = (2, 1): count = q(q + 1).
      (6) A = F_q (i.e. ell = 1): count = [N choose k]_q; deficit factor
          forced to 1.
      (7) Reading 1 exponent E1 = ell * o * (n - o); Reading 2 exponent
          E2 = ell^2 * o * (n - o); Reading 3 exponent
          E3 = ell^4 * o * (n - o); deficit factors E3/E1 = ell^3 and
          E2/E1 = ell.  [note: E3/E2 = ell^2]
      (8) Ceiling 1 in bits = E1 * log2 q. Ceiling 2 in bits =
          ell * (v - o) * log2 q.
      (9) Entropy-matched plain-UOV instance: any (n', o') over F_q with
          o'(n' - o') = E1.
      NO OTHER DEGREE OF FREEDOM EXISTS. Any adjustment to (1)-(9) after any
      enumerated integer has been observed requires a versioned protocol
      amendment recorded as exploratory_only, and is never an edit. EV-IC-002
      is this program's own precedent for a lane retracting a verdict because a
      criterion was revised after the prior criterion was seen to fail.
    - >-
      THE PRE-REGISTERED INTEGER TABLE, fixed here and evaluated in
      EXP-SNOVA-7e3625, all at k = 1 unless stated:
      [4 choose 2]_2 = 35 (A = M_2(F_2), N = 2);
      [4 choose 1]_2 = 15 (simple submodules, same cell);
      [6 choose 2]_2 = 651 (A = M_2(F_2), N = 3);
      [6 choose 3]_2 = 1395 (A = M_3(F_2), N = 2);
      [4 choose 2]_3 = 130 (A = M_2(F_3), N = 2);
      [2 choose 1]_4 = 5 (A = F_4, N = 2);
      [3 choose 1]_4 = 21 (A = F_4, N = 3);
      [2 choose 1]_8 = 9 (A = F_8, N = 2);
      ([2 choose 1]_2)^2 = 9 (A = F_2 x F_2, N = 2);
      ([2 choose 1]_3)^2 = 16 (A = F_3 x F_3, N = 2);
      q(q+1) = 6 at q = 2 and 12 at q = 3 (A = F_q[x]/(x^2), N = 2);
      [2 choose 1]_2 = 3 and [2 choose 1]_3 = 4 (the ell = 1 null).
      NOTE THE COINCIDENCE, RECORDED IN ADVANCE SO IT CANNOT BE MISREAD: the
      split algebra at q = 2 and the field F_8 both give 9 in this cell, for
      unrelated reasons. Any narrative that treats the ladder as strictly
      monotone in F_q-dimension is wrong, and the ladder 3 < 5 < 6 < 9 < 35 at
      q = 2 is NOT monotone in semisimplicity either.
    - >-
      THE ELEVEN PARAMETER ROWS ARE READ AS FETCHED AND ARE NOT ADJUSTED. They
      come from a model-rendered fetch of https://snova.pqclab.org/ on
      2026-08-06 and are re-transcribed from raw HTML in Stage 0. A record that
      changes a row to make an arithmetic conclusion nicer is inadmissible.
    - >-
      ENTROPY IS NOT COST. Every ceiling here is an information-theoretic upper
      bound on security via exhaustive search over oil objects. A non-binding
      ceiling supports no parameter set and a binding one would exhibit no
      algorithm beyond exhaustive search. This is stated as an assumption of
      interpretation because it is the single most likely way a downstream
      record will misuse this hypothesis.
    - >-
      Enumeration is exhaustive and exact over finite algebras with no floating
      point anywhere, in pure Python with no third-party dependency. This is
      deliberate: this session's scouting reports disagree about whether numpy,
      sympy or any algebra system is importable in this container, and a
      contract whose cheapest gate depends on an unresolved dependency question
      is an infrastructure request, not an experiment.

  proof_search_map:
    bottleneck: >-
      The single step is: what is the correct baseline entropy for SNOVA's oil
      space. Every statement in GOAL-SNOVA-001's third completion criterion -
      whether any surviving parameter choice keeps SNOVA's size advantage over
      matched UOV variants - is measured against it, and the phrase "matched
      UOV" has no defined referent until this step is done. Getting it wrong by
      a factor ell^3 in the exponent, which is 64 at ell = 4, would make every
      subsequent Pareto statement in the goal meaningless. Repairing this step
      is upstream of the whole goal and consumes almost none of its budget.
    baseline_embedding:
      parameter_slice: >-
        ell = 1, where A = F_q, SNOVA degenerates to plain UOV over F_q, and
        the count must reduce EXACTLY to the ordinary Grassmannian
        [n choose o]_q with deficit factor exactly 1. This is the exact
        old-method boundary: at ell = 1 every reading coincides and the
        established UOV oil-space count must be reproduced with no residue.
      reproduction_check: >-
        SYMBOLIC AND EXACT, and partially performed before this record was
        written: formulas (2), (3) and (6) of Psi all collapse to
        [n choose o]_q at ell = 1, and the enumeration at A = M_2(F_2), N = 2
        returned 35 = [4 choose 2]_2 with the simple-module count 15 =
        [4 choose 1]_2, both exactly. A curve that resembles the baseline is
        not an embedding; these are exact integer identities.
    observation_collision:
      observable: >-
        The single integer "number of admissible oil objects", equivalently its
        log_q, per (algebra class, q, N, k).
      distinct_preimage_search: >-
        A COLLISION EXISTS, IT WAS FOUND BEFORE THE RUN, AND IT IS PRE-
        REGISTERED. At (N, k) = (2, 1), q = 2 the split etale algebra
        F_2 x F_2 and the field F_8 both give the observable value 9, from
        F_q-dimensions 2 and 3 respectively. The observable therefore does NOT
        determine the algebra, and any narrative reading the count backwards to
        a structural conclusion is falsified at that pair unless a further
        condition separates them - here, dim_{F_q} A, which is public. A SECOND
        collision, more consequential: at (N, k) = (2, 1) the semisimple
        F_4 gives 5 and the non-semisimple F_2[x]/(x^2) gives 6, which are
        close but distinct - if an implementation returned 5 for both, the
        instrument would be blind to semisimplicity, which is exactly the
        property the companion proposal's Maschke gate turns on. The
        near-collision is the reason that cell is in the required table.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the flattened F_q-subspace count by the A-module count,
          moving the hypothesis into a setting where the claim is an exact
          integer identity (a Gaussian binomial over the right ring) rather
          than an estimate or a fit.
        predicted_gain: >-
          Turns "SNOVA has less entropy than a UOV of the same size" from a
          slogan into an exponent with a pre-registered value, and makes the
          matched baseline computable. Encoding, completeness, soundness and
          transfer obligations are listed under proof_obligations; the transfer
          obligation to an actual attack cost is DECLARED UNMET, not deferred.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (the count) fixed and vary the forgotten
          structure (which algebra produced it). The intrinsic invariant
          proposed to distinguish them is dim_{F_q} A together with the
          semisimplicity verdict.
        predicted_gain: >-
          If those two invariants do not separate the fibre, the counting
          observable has not identified the load-bearing structure and the
          instantiation half of the hypothesis fires at zero compute.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER: THERE EXISTS one frozen formula set Psi, fixed
      and parameter-free before evaluation, such that FOR ALL cells (algebra
      class, q, N, k) in the declared boundary the predicted count equals the
      exhaustively enumerated count EXACTLY. Psi may NOT depend on the cell.
      The weaker order - FOR ALL cells THERE EXISTS a formula - is trivially
      satisfiable and is explicitly NOT claimed and NOT admissible as a result.
      For Part B the order is: FOR ALL of the eleven published parameter rows,
      the Reading-1 entropy exceeds the row's claimed category level. That is a
      universally quantified negative and a single counterexample refutes it -
      which is the direction in which a refutation would be enormously
      valuable, and is why the prediction is stated universally rather than
      hedged.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: an exact count of admissible oil objects, hence an
        information-theoretic upper bound on security via exhaustive oil-space
        search, together with the exponent of the entropy-matched plain-UOV
        instance. It cannot certify any attack cost, cannot exhibit a recovered
        key or a forgery, cannot move any attack exponent, cannot support or
        contradict any reported SNOVA attack, and cannot establish that any
        parameter set is safe. In particular a NON-BINDING ceiling - which is
        the predicted outcome at every row - says nothing whatever in SNOVA's
        favour.
      nearby_object_control: >-
        QR-UOV, the closest object in the same family, where the coefficient
        algebra is COMMUTATIVE of F_q-dimension ell and the variables are not
        ell-by-ell matrices. Its Reading-1 deficit factor against its own
        flattened baseline is forced to ell, not ell^3. If the method returns
        the same factor for QR-UOV and SNOVA it is responding to the dimension
        of the algebra rather than to its structure, has not identified the
        load-bearing feature, and the SNOVA-specific claim must be withdrawn. A
        SECOND nearby object, and the one where the hoped-for conclusion fails
        outright: ell = 1, where SNOVA IS plain UOV, the deficit is forced to
        exactly 1, and any nonzero deficit is proof that the instrument is
        measuring its own construction.
    proof_obligations:
      - claim: >-
          Psi reproduces every pre-registered integer exactly, including the
          ell = 1 baseline and the non-semisimple cell.
        responsibility: baseline
      - claim: >-
          Left A-submodules of A^N correspond to F_q-subspaces of F_q^{ell N}
          when A = M_ell(F_q), with a rank-k free submodule corresponding to
          dimension ell k.
        responsibility: correctness
      - claim: >-
          SNOVA's secret transformation is A-linear for A = F_q[S] (Reading 1),
          established from the specification and never inferred from which
          exponent looks nicer.
        responsibility: interface
      - claim: >-
          The eleven parameter rows are transcribed from raw page source, not
          from a summarising model's rendering.
        responsibility: baseline
      - claim: >-
          Every ceiling is reported as an information-theoretic upper bound and
          never as an attack cost.
        responsibility: scope
      - claim: >-
          The enumeration is exhaustive over the stated algebra and its
          exhaustiveness is verified by an independent recount of the ambient
          module's cardinality.
        responsibility: correctness
      - claim: >-
          The largest enumerated cell fits the declared memory and wall-clock
          budget; a cell that does not is reported as truncated coverage rather
          than as a failure.
        responsibility: runtime
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. There is NO attack-complexity claim of any kind. The
    exponent that appears - ell * o * (n - o) against ell^4 * o * (n - o) - is
    the exponent of a KEY-SPACE CARDINALITY, i.e. of a baseline, not of an
    algorithm. Nothing here makes any system easier to solve, moves no attack
    exponent, and adds no attack. dominated_by is not applicable because no
    Pareto point is claimed, and sota_delta is zero on every attack axis:
    time, memory, data, queries, advice.

  heuristic_assumptions:
    - id: HEUR-SNOVA-EC-1
      formal_statement: >-
        Recovery of the oil object constitutes a break of SNOVA. Formally:
        FOR ALL SNOVA key pairs, THERE EXISTS a polynomial-time procedure that,
        given the public key and the oil object O, produces signatures that
        verify. Hence an upper bound on the number of oil objects is an upper
        bound on the security level.
      random_model_justification: >-
        Not a distributional claim; it is the standard equivalent-key statement
        for UOV-family schemes, RECALLED for SNOVA specifically and NOT
        verified in this session. It is recorded as a heuristic rather than a
        fact precisely because it is recalled: if SNOVA's signing additionally
        requires data not determined by O, the ceiling bounds oil-space
        recovery only, and the deliverable must be restated in those narrower
        terms.
      supporting_results: []
      validation_experiment_ids: [EXP-SNOVA-7e3625]
      falsification_condition: >-
        Stage 0 reads the specification and finds that signing requires secret
        data not determined by the oil object. The hypothesis is then restated
        as a bound on key recovery only, and every downstream citation carries
        that narrowing.
    - id: HEUR-SNOVA-EC-2
      formal_statement: >-
        SNOVA's secret transformation is A-linear with A = F_q[S], and the
        characteristic polynomial of S is squarefree, so A is semisimple and
        case (A1) or (A3) of Psi applies.
      random_model_justification: >-
        NONE, AND THIS IS RECORDED AS THE HYPOTHESIS'S WEAKEST LINK RATHER THAN
        PAPERED OVER. The project-page fetch establishes the RING and not the
        GROUP, and says nothing about the factorization type of S. The usual
        argument - that a designer choosing S with irreducible characteristic
        polynomial gets a field and hence the cleanest structure - is a guess
        about design intent, not evidence.
      supporting_results: []
      validation_experiment_ids: [EXP-SNOVA-7e3625]
      falsification_condition: >-
        Stage 0 establishes Reading 2, or establishes that the characteristic
        polynomial of S is not squarefree. In the first case the deficit factor
        becomes ell^2 and every number is restated; in the second the
        Gaussian-binomial count does not apply and the local-algebra branch
        must be developed before any exponent is quoted. BOTH ARE REPORTABLE
        OUTCOMES AND NEITHER IS A FAILURE OF THE EXPERIMENT.
    - id: HEUR-SNOVA-EC-3
      formal_statement: >-
        The eleven parameter rows fetched on 2026-08-06 are the rows a
        specification would give. Formally: the model-rendered table equals the
        table in the page source.
      random_model_justification: >-
        None; it is an evidentiary assumption about a fetch that passed through
        a summarising model, and this program's own KN-LIT audit records the
        corpus-wide consequence of trusting rendered numbers - the worked
        instance being an entry that records 264 where the publisher abstract
        reads 2^64.
      supporting_results: []
      validation_experiment_ids: [EXP-SNOVA-7e3625]
      falsification_condition: >-
        Stage 0's raw-HTML transcription differs from the rendered table in any
        cell. Every arithmetic conclusion is recomputed on the transcription
        and the discrepancy is recorded, not smoothed.

  structural_ingredients:
    - description: >-
        Morita equivalence of M_ell(F_q) with F_q, in the concrete form
        "left submodules of C^M correspond to F_q-subspaces of F_q^M for C the
        simple module".
      citation: >-
        NOT RETRIEVED AND NOT VERIFIED IN THIS SESSION. Standard algebra;
        derived in this record and checked by exhaustive enumeration at
        A = M_2(F_2), N = 2 (35 free rank-1 submodules, 15 simple ones). A
        CANDIDATE TO TEST, never an authority. No citation is asserted.
      role: converts the flattened subspace count into the correct module count
    - description: >-
        Gaussian binomial count of k-dimensional subspaces of an
        N-dimensional space over a finite field.
      citation: >-
        Elementary; the product formula is written out in Psi clause (1) and is
        evaluated directly rather than cited.
      role: closed form for every semisimple cell
    - description: >-
        Unimodular-vector count for free rank-1 submodules over a finite local
        ring, giving q(q+1) at A = F_q[x]/(x^2), N = 2.
      citation: >-
        Derived in this record as (|A|^2 - |mA|^2)/|A^x| and confirmed by
        enumeration at q = 2 (value 6) and q = 3 (value 12).
      role: the non-semisimple control that the binomial family must fail
    - description: >-
        The SNOVA parameter table and ring definition.
      citation: >-
        https://snova.pqclab.org/, FETCHED 2026-08-06, HTTP 200, through a
        summarising model. PAGE-LEVEL EVIDENCE, NOT THE SPECIFICATION
        DOCUMENT. Re-transcribed from raw HTML in Stage 0 before use.
      role: supplies (v, o, q, ell) for the eleven rows and the ring F_q[S]

  reduction_chain:
    core_problem: >-
      Count the admissible oil objects of a UOV-family scheme whose
      coefficients lie in a finite F_q-algebra A, exactly, and derive the
      exponent of the entropy-matched plain-UOV instance.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. There is no reduction from this count to any attack
      cost, and none is claimed. In particular this hypothesis does NOT reduce
      to, support, contradict, or narrow any reported SNOVA attack; it does not
      close RQ-SNOVA-001's weak-key or wedge-product targets; and it produces
      no certificate of the kind GOAL-SNOVA-001's first completion criterion
      requires. Its only downstream consumer is the goal's third completion
      criterion, which needs a defined matched baseline and currently has none.

  predictions:
    - metric: >-
        G1 - Morita gate: exhaustively enumerated number of free rank-1 left
