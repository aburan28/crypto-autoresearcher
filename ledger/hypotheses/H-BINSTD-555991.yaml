hypothesis:
  id: H-BINSTD-555991
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261001-621974
  experiment_id: EXP-BINSTD-e066d8
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-6dd4c6
  status: approved
  proposed_by: coordinator
  title: >-
    On ECC2K-130 subspace factor bases the GTTD double-large-prime row is
    dominated by matched rho in the enumeration oracle class and reduces to a
    per-attempt budget column (2^8.71 at m=3; 2^22.34 at m=4) in the product-law
    convention, with one measurable break-even inequality on marginal oracle
    cost (s*=0.672 bit/unknown at m=4)

  statement: >-
    CLAIM (composition / column pricing; U-REACH lead; NO ATTACK). Setting:
    ECC2K-130, E: y^2+xy=x^3+1 over F_2^131, N=4r, matched rho R=2^60.8090
    (CORR-20260922-81aeab; KN-FIND-aa2efc). Small/large F_2-subspace bases
    F subset F' with sizes B≈2^l, B'≈2^l'. A partial with j large primes has
    m-j legs in F and j in F'. HYPOTHESIS: (A) in the free-leg enumeration
    class, single-large-prime T_1=sqrt(2 U N/kappa_r) sits at least 1.17+0.5
    log2 U bits (kappa_r=262, conditional) or 4.69+0.5 log2 U bits
    (kappa_r=2) above R; (B) double-large-prime total cancels to 2 r N
    C_2(B')/B'^2 (2^123.97 C_2/B' conditional per-orbit; 2^132 theta C_2/B'
    unconditional), so every enumeration-class large-prime row is above R;
    (C) under the product-law per-attempt budget convention with p_2<=1, the
    rebalanced j=2 row leaves budgets 2^8.71 (m=3) and 2^22.34 (m=4) for
    square systems of 132 and 133 Boolean unknowns against plain budgets
    2^-15.55 and D3=2^11.01; (D) the column reduces to one inequality — at
    m=4 the 2LP row beats D3 iff marginal oracle cost per added unknown is
    below s*=0.672 bit — and claims NO oracle meets either budget. Stage 0
    is a blind re-derivation with the j=0 fixture first; Stage 1 is a
    solver-free toy j=2 graph census validating H-621974-1..3. CLAIM TIER:
    composition. NO exponent. NO ECC2K-130 break. NO Magma/Sage/AUXIN.

  mechanism: >-
    OBJECT FRAME. Representation R1 (x-coordinates in a fixed polynomial
    basis). Tracked object: the partial relation (small-leg tuple, at most
    two canonicalised large primes, target coefficients). Sigma = cycle
    combination on the large-prime graph (GTTD), with sign canonicalisation.
    Trichotomy: Class I partial-action. Lossy projection pi: partial ->
    multiset of canonical large primes passes (cycle membership decides
    combination); cost sits in attempts/oracle, which pi does not see —
    hence pricing by oracle class, not a new object. WHAT IS NEW relative to
    superseded IDEA-20260922-c2bbe6 and dominated_by IDEA-20260926-1db0e8:
    (i) GTTD form adopted with KN-LIT-164 cited; (ii) single-LP enumeration
    priced with kappa_r explicit; (iii) 1db0e8 line recomputed and scoped to
    the enumeration class; (iv) product-law j=2 budget column and s*
    inequality; (v) IDEA-20261001-5628bc convention-audit arm under U-REACH.
    Charged stage: relation-collection accounting / reachability-table
    large-prime column — not a solve of any descended system under this card.

  assumptions:
    - >-
      Costs in group-operation equivalents; ambient N=4r (log2 N=131.0000)
      unless the subgroup ambient is stated; matched rho 2^60.8090.
    - >-
      Budget convention (claim C): one attempt = one oracle call; cost is a
      per-attempt BUDGET to be met; p_2<=1 (IDEA-20260926-4b65e3). A budget
      is a specification, never a measured cost.
    - >-
      Unknowns count points (U=B); folding signs halves U (stated where used).
    - Single target throughout; multi-target/preprocessing belong to S1 lineage.
    - Executable work is toy-tier only (n in {17,19}); deployed params are arithmetic only.
    - >-
      Per-orbit kappa_r=262 readings are conditional (CORR-20260925-649e25)
      and require a Frobenius-stable base that does not exist at useful
      dimension at n=131; unconditional readings are the headline.
    - No Magma/Sage/cypari2/AUXIN/Bedrock required for Stages 0-1.

  proof_search_map:
    bottleneck: >-
      Per-attempt cost of an oracle for the asymmetric (m-2 small, 2 large)
      system at the rebalanced point, against claim (C) budgets: absolute at
      m=3 (2^8.71 for square 132-unknown shape); relative at m=4 (marginal
      cost per added unknown below s*=0.672 bit beats D3). Decidable by:
      Stage-0 blind re-derivation with j=0 fixture; Stage-1 toy j=2 graph
      census (cycle yield, weight, partial yield) with replica and G(n,M)
      controls. Oracle-side measurement is OUT OF SCOPE (next_gate).
    baseline_embedding:
      parameter_slice: >-
        j=0 (B'=B): budget expression must return D3=2^11.01 at m=4
        (CORR-20260928-4cb669: 11.010251) and 2^-15.55 at m=3. Enumeration
        class with r=B'/262 must return 1db0e8's ~2^124. Free-oracle j=0
        floors must return KN-FIND-aa2efc's 2^68.58 (m=3) and 2^56.40 (m=4).
      reproduction_check: >-
        Stage 0: a Python cell from (R,N,m,theta,w) alone must print D3,
        plain m=3 budget, and 1db0e8 line within 0.01 bit BEFORE any j=2
        value is read. Hand values in the idea: D3(4)=11.010253; plain
        m=3=-15.552; 1db0e8 line=123.967.
    observation_collision:
      observable: >-
        The budget column value; at toy scale the pair (cyclomatic number,
        cycle-relation weight) of the j=2 large-prime graph.
      distinct_preimage_search: >-
        Same budget whether the 2LP shape is cheap or expensive — column
        cannot distinguish; only the named oracle measurement separates
        them. Toy cycle count matching G(n,M) can be genuine randomness or
        finite-size artifact: separated by sweeping V' (three d'),
        relabelled Z/(4r) replica, and finite-size G(n,M) simulation.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          Per-attempt budget family lifted from j=0 (pinned D3) to j<=2,
          with j=0 slice reproduced exactly.
        predicted_gain: >-
          Inward budget improvement at m=3 (2^-15.55→2^8.71) and m=4
          (2^11.01→2^22.34), paid for by square systems with ~44.7/~16.9
          more unknowns and graphs of 2^51.77/2^37.89 vertices; no gain at
          m=5 (infeasible unconstrained optimum).
      - transform: observable_fiber
        proposed_object: >-
          Hold (j=2,m,B,B') fixed; vary oracle class: free-leg enumeration
          (closed), factorisation-type independent of large bound (gain),
          algebraic with marginal cost s (gain iff s<s* at m=4).
        predicted_gain: Localises the large-prime column in one measurable oracle property.
    quantifier_order: >-
      FOR ALL m in {3,4}, theta in [1/2,1], w in [m,32m], and B with
      B<=0.162 B' at the cap: the j=2 per-attempt budget is at most the
      claim-(C) maximum. FOR ALL B,B',m and FOR ALL enumeration-class
      oracles: total >= 2 r N C_2(B')/B'^2. NOT CLAIMED: EXISTS an oracle
      meeting any budget; any algebraic-oracle bound; any m>=5 value.
    method_ceiling:
      strongest_certifiable_claim: >-
        Under the product-law convention the j=2 row leaves budgets 2^8.71
        (m=3) and 2^22.34 (m=4) for square systems of 132/133 unknowns
        against plain 2^-15.55 and 2^11.01; in the enumeration class every
        large-prime row is above matched rho; at toy scale the j=2 graph's
        cycle yield and weight match the random-graph model within band.
        Never certifies that an oracle meets a budget, nor bounds algebraic
        oracles.
      nearby_object_control: >-
        (i) j=0 slice must reproduce D3 and -15.55 (positive m=3 j=0 budget
        = wrong); (ii) m=5 must report infeasibility not gain
        (proves-too-much); (iii) Z/(4r) replica must match curve graph
        statistics within [0.5,2] or the excess is curve structure.
    proof_obligations:
      - claim: Claim (A) T_1 formula and gaps 1.17/4.69/5.19.
        responsibility: runtime
      - claim: Claim (B) cancellation to 2 r N C_2/B'^2 and values 123.97 / 132+log2(theta).
        responsibility: correctness
      - claim: Claim (B) scope binds exactly enumeration-class oracles.
        responsibility: scope
      - claim: Claim (C) optimum and table values; j=0 fixture reproduces D3 and -15.55.
        responsibility: baseline
      - claim: Cap and B<=0.162 B' at m=3,4 optima; m=5 infeasibility.
        responsibility: feasibility
      - claim: H-621974-2 and H-621974-3 at toy scale (Stage 1).
        responsibility: success_probability
      - claim: Graph memory B' and matrix size B stated beside every time figure.
        responsibility: memory
      - claim: Nothing bounds an algebraic oracle; claim (D) is an inequality not a verdict.
        responsibility: scope

  asymptotic_claim:
    problem: >-
      ECDLP on ECC2K-130 by index calculus with at most two large primes per
      relation on F_2-subspace factor bases, single target
    prior_best: matched rho 2^60.8090; plain product-law budgets D3 2^11.01 (m=4) and none at m=3
    time_exponent: >-
      unchanged; enumeration class dominated (A,B); budget convention
      2^8.71 (m=3) and 2^22.34 (m=4) per attempt — a requirement, not a cost
    memory_exponent: >-
      graph 2^51.77 (m=3) or 2^37.89 (m=4) vertices at the budget point;
      j=1 enumeration at least 2^61.98 residuals
    hidden_cofactor: per-attempt oracle cost on square (m-2,2) systems of 132–133 unknowns, unmeasured
    claim_kind: column_pricing_by_oracle_class

  heuristic_assumptions:
    - id: H-621974-1
      formal_statement: >-
        For uniformly random targets the number of (m-2,2) decompositions
        with small legs in F and large legs in F' is Poisson with mean
        p_2=(B^(m-2)/(m-2)!)(B'^2/2)/N, and large legs of found partials
        are distributed over F' like independent uniform draws.
      random_model_justification: >-
        MEAN is exact by double counting (yield conservation, KN-FIND-007
        typed form; also 1db0e8 H1). Poisson shape and independence imitate
        classical occupancy; failure mode is coset concentration (parity
        factor of polynomial windows).
      supporting_results:
        - KN-FIND-007 (internal; yield conservation)
        - IDEA-20260926-1db0e8 (internal; H1)
        - KN-FIND-aa2efc (internal; product law)
      validation_experiment_ids:
        - EXP-BINSTD-e066d8
      falsification_condition: >-
        Partials-per-target outside [0.5,2] of p_2 after stated parity
        factor, or large-prime occupancy failing chi-squared vs Poisson at
        1% on both curve and replica → H-621974-1 fails at toy scale
        (reported; mean still exact).
    - id: H-621974-2
      formal_statement: >-
        The uncanonicalised large-prime graph with V' vertices and r edges
        has cyclomatic number as G(V',r), so about B independent cycle
        relations arise from r=theta V' edges with theta=1 when B≈0.162 V'
        and theta near 1/2 when B≪V'.
      random_model_justification: >-
        Erdős–Rényi component/excess asymptotics for G(n,M) (classical;
        recalled; verified by Stage-1 direct simulation). Heuristic: edges
        from curve partials behave like uniform random edges if H-621974-1
        holds.
      supporting_results:
        - IDEA-20261001-621974 (internal; claim C / H-621974-2)
        - IDEA-20260926-1db0e8 (internal; HOLD-X12 input)
      validation_experiment_ids:
        - EXP-BINSTD-e066d8
      falsification_condition: >-
        Cyclomatic number outside [0.5,2] of finite-size G(n,M) mean on
        the curve but not the replica → H-621974-2 fails for curve
        partials; theta moves by the measured factor (reported).
    - id: H-621974-3
      formal_statement: >-
        Mean weight w of full relations from a cycle basis at r=theta V'
        lies in [m, 32m] at deployed graph sizes; linear-algebra cost is
        w B^2.
      random_model_justification: >-
        Fundamental cycles of a supercritical random-graph spanning forest
        have length ~logarithmic in vertex count (recalled); near
        criticality cycles are longer (GTTD weight penalty, recalled
        pointer). Sparse LA cost w B^2 is the product-law model with m
        replaced by w.
      supporting_results:
        - KN-FIND-aa2efc (internal; product-law LA model)
        - KR-IC-a4dd54 (internal; GTTD abstract-level)
      validation_experiment_ids:
        - EXP-BINSTD-e066d8
      falsification_condition: >-
        Mean cycle-relation weight above 32m at r=V' → H-621974-3 fails;
        budget recomputed with measured w.

