  falsification_conditions:
    - >-
      Blind re-derivation of any claim (A)–(C) entry disagrees by >0.05 bit
      after convention matching → entry wrong; correct before any use
      (O-ARITHMETIC).
    - >-
      j=0 slice fails to reproduce D3=11.0103 or -15.55 → budget machinery
      wrong; claim (C) withdrawn until it does (O-FIXTURE-FAIL).
    - >-
      A reviewer exhibits a lower bound on every algebraic oracle for the
      (m-2,2) shape by the small-tuple loop times C_2 → claims (C)(D)
      withdrawn and 1db0e8's line is general (O-E1-GENERAL-BOUND).
    - >-
      At m=5 the argument returns a gain rather than infeasibility →
      rebalancing mis-applied (O-PROVES-TOO-MUCH).
    - >-
      Stage-1 cycle yield outside [0.5,2] of finite-size G(n,M) on the curve
      but not the replica → H-621974-2 fails for curve partials; theta moves
      (O-MIXED-THETA).
    - >-
      Stage-1 cycle-relation weight above 32m at r=V' → H-621974-3 fails;
      budget recomputed with measured w (O-MIXED-W).
    - >-
      Any certificate failure under correct canonicalisation, or zero
      failures under truncated key → instrument defect; arm void
      (O-ARTIFACT).
    - >-
      Claiming that any oracle meets a budget, that index calculus beats
      rho, or that ECC2K-130 is broken under this card.

  interpretation_limits:
