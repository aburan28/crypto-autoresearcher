      Budget column is a specification of what an oracle must cost. No
      sentence of this contract states that any oracle meets it, that IC
      beats rho on ECC2K-130 at any m, or that any row is open/closed as a
      cryptanalytic outcome.
    - >-
      Free-oracle floors of the j=2 row (2^53.84 at m=3, 2^45.92 at m=4) are
      D1-type gap quantities, never budgets (CORR-20260928-4cb669).
    - >-
      Per-orbit (kappa=262) readings are conditional; unconditional readings
      are the headline.
    - Single target only; multi-target graph sharing is S1 lineage.
    - KN-OPEN-020 class — subspace bases only.
    - >-
      Tripwire (claim C / free-oracle floor at m=3): scopes KN-FIND-aa2efc's
      m=3 statement to the j=0 row; first review of any design carrying
      claim (C) should run at review-breakthrough at max (recorded as
