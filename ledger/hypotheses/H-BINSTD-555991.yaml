# Specified from IDEA-20261001-621974 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Approved DEC-20261002-6dd4c6.
#
# U-REACH zero-run lead (DEC-20260929-7257b2): queued after HOLD-X4; consolidates
# IDEA-20260926-1db0e8 (HOLD-X12) and IDEA-20261001-5628bc as convention-audit
# arm. Supersedes IDEA-20260922-c2bbe6 (HOLD-Q revision). ZERO RUNS in this
# design packet. No AUXIN. No Bedrock. No curve attack / exponent claim.
# Claim tier: composition / column pricing. Stages 0-1 only.
