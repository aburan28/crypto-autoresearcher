    - >-
      Oracle-side measurement (m=3 two-large-block extension of 1db0e8 (D)
      against s*) is a later design item sequenced after 1db0e8 Stage 2 and
      HOLD-X1 — not this card.

  distinguishable_outcomes:
    - id: O-E2-BUDGET-ROW
      meaning: >-
        Stage 0 reproduces the table within 0.05 bit, no general algebraic
        bound is exhibited, and Stage 1 cycle yield/weight/partial yield sit
        inside bands on both curves and the replica: large-prime column
        recorded CLOSED in the enumeration class (A,B) and as a BUDGET ROW
        in the product-law convention (C) with claim-(D) inequality as the
        decision quantity; oracle-side measurement becomes the next design
        item.
    - id: O-E1-GENERAL-BOUND
      meaning: >-
        Stage 0 finds an arithmetic/convention error that drops j=2 budgets
        to or below the plain ones, OR a reviewer exhibits a lower bound on
        every algebraic oracle for the 2LP shape by the small-tuple loop:
        column closed for every oracle class with 1db0e8's mechanism;
        claim (C) withdrawn.
    - id: O-MIXED-THETA
      meaning: >-
        Stage 0 reproduces but Stage 1 places theta outside band: budget
        row stands with measured constants substituted; transfer of those
        constants stated as heuristic.
    - id: O-MIXED-W
      meaning: >-
        Stage 0 reproduces but Stage 1 places w above 32m: budget
        recomputed with measured w; transfer stated as heuristic.
    - id: O-FIXTURE-FAIL
      meaning: >-
        j=0 fixture misses D3 or -15.55 (or 1db0e8 line): budget machinery
        wrong; no j=2 value is read.
    - id: O-ARITHMETIC
      meaning: >-
        Blind re-derivation disagrees by >0.05 bit after convention matching
        on a claim (A)–(C) entry.
    - id: O-PROVES-TOO-MUCH
      meaning: >-
        m=5 returns a gain rather than infeasibility.
    - id: O-ARTIFACT
      meaning: >-
        Certificate failure, truncated-key arm with zero failures, or
        replica showing the same deviation as the curve: instrument defect;
        nothing read.
    - id: O-IMPEDIMENT
      meaning: Budget/infra stop with measured quantity; never negative evidence.

