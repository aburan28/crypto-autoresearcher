        below 0.05 bit at every entry after conventions matched
        (D3_2LP(3)=8.71, D3_2LP(4)=22.34, plain 11.01 and -15.55); larger
        discrepancy is arithmetic error localised by the j=0 fixture
    - metric: abs_discrepancy_bits_claims_A_and_B
      direction: lower
      minimum_effect: below 0.05 bit (T_1 gaps 1.17/4.69/5.19; 1db0e8 line 123.97)
    - metric: ratio_cyclomatic_to_finite_size_G_n_M_mean
      direction: different
      minimum_effect: >-
        PREDICTED inside [0.5,2] on curve and replica; curve/replica ratio
        inside [0.5,2]. Outside on curve only → curve-specific structure
        (theta moves); outside on both → model failure at toy scale
    - metric: mean_weight_cycle_basis_relations_at_r_eq_Vprime
