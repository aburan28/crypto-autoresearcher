hypothesis:
  id: H-ECDLP-3ac227
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  source_proposal: IDEA-20260815-f81c17
  derived_from_idea: IDEA-20260815-f81c17

  statement: >-
    SCOPE. A measurement of where baby-step giant-step stops being a usable
    second baseline under an ENFORCED memory ceiling, on toy prime-order
    subgroups at 16, 20, 24 and 28 bits, on instances shared with the rho
    baseline. NO NEW ALGORITHM, NO ATTACK, NO EXPONENT. Four conjuncts, each
    separately falsifiable.
    (C1, THE NULLS BEHAVE) With unbounded memory BSGS uses fewer group
    operations than rho at every tested size; with a ceiling below the cost of
    a single table entry, fixed-table BSGS cannot run at all. The two fail in
    opposite directions and a failure of either voids every measurement.
    (C2, THE CEILING IS REAL) The memory ceiling is ENFORCED by the runtime, not
    simulated by accounting. A run whose table exceeds its declared budget
    without being stopped has measured nothing about memory-bound behaviour.
    (C3, THE CROSSOVER IS LOCATED OR BOUNDED) For each declared budget there is
    a group size at which memory-constrained BSGS ceases to beat rho in group
    operations. Within the reachable range that size is MEASURED; where it is
    not reached, the record reports a BOUND rather than a crossover, and says
    which.
    (C4, THE PER-ENTRY MEMORY COST IS STABLE) Peak table memory grows as
    sqrt(N) times a representation-dependent per-entry cost that does not vary
    materially across the tested sizes. This is HEUR-BSGS-1 and it is the
    quantity that decides where the crossover sits, so it is measured rather
    than assumed.
    THE HYPOTHESIS'S OWN DECISION-RELEVANT OUTCOME IS NAMED IN ADVANCE. If a
    crossover sits INSIDE the sizes the campaign actually works at, then
    comparisons at those sizes have effectively ONE baseline and not two, and
    every record that names 'rho and BSGS' as its matched controls is
    overstating its control set. That is the most consequential possible result
    and it is a negative one.

  mechanism: >-
    THE GAP AS THE PROPOSAL STATES IT. Every comparison in this campaign names
    rho and BSGS as the baselines. BSGS is faster in group operations but needs
    sqrt(N) storage, so under a fixed memory budget it stops being usable at a
    determinable group size while rho continues at constant memory. The
    crossover is the honest statement of when there are two baselines and when
    there is one, and no record in this corpus measures it.
    THE VARIANT DISTINCTION, SUPPLIED IN CONVERSION BECAUSE THE PROPOSAL'S
    NULLS PRESUPPOSE ONE VARIANT AND ITS CROSSOVER CLAIM NEEDS THE OTHER. There
    are two BSGS behaviours under a ceiling and they are not the same
    experiment.
    ARM A, FIXED-TABLE BSGS: the table holds ceil(sqrt(N)) entries or the run
    does not start. Under a ceiling below that, the algorithm FAILS. This is the
    arm the proposal's NULL 2 describes -- 'memory so tight that BSGS cannot run
    at all, where only rho remains'.
    ARM B, MEMORY-CONSTRAINED BSGS: the table holds m entries with m at most the
    budget allows, and the giant-step phase runs about N/m steps. The algorithm
    always runs and DEGRADES. This is the arm in which a crossover against rho
    actually exists, because arm A has no crossover -- it has a cliff.
    Running only arm A would measure a cliff and call it a crossover; running
    only arm B would make the proposal's second null unreachable. Both are run.
    THE CROSSOVER, DERIVED. Let C be the budget in bytes and e the MEASURED
    bytes per table entry, so the largest affordable table is E = floor(C/e)
    entries. Arm B costs about N/E group operations once the budget binds, and
    rho costs about c * sqrt(N). The two cross where N/E equals c * sqrt(N),
    i.e. at N* = (c * E)^2. This closed form is MODELED. The MEASURED crossover
    is the size at which the two measured curves actually cross, and the two are
    reported side by side in separate columns. Where the modeled and measured
    crossovers disagree, the disagreement is the result.
    WHY MEMORY IS FIRST-CLASS HERE IN A WAY IT IS NOT ELSEWHERE. For rho, memory
    is a secondary term. For BSGS, memory IS the algorithm: the table is the
    method. A BSGS baseline reported without peak memory has not been measured
    at all, it has been asserted. Every table in this contract carries peak
    resident bytes, table entries and table bytes beside every operation count.
    THE RECORD'S WEAKEST PART, NAMED BEFORE IT IS REACHED. The crossover under
    a REALISTIC memory budget -- gigabytes, against cryptographic group sizes --
    sits far above anything measurable here. Any statement about it is an
    EXTRAPOLATION across a very large gap whose form dominates the answer. The
    parent proposal gives this a prior of only 0.3 and calls it the record's
    weakest part. The contract preserves that: extrapolated crossovers are
    reported in a separate, clearly labelled table with the extrapolation's
    basis and range stated, and never in the same column as a measurement.

  assumptions:
    - >-
      That a real memory ceiling is ENFORCEABLE in the implementation rather
      than simulated by accounting. The parent proposal states this as its first
      assumption and the contract makes it a blocking control rather than an
      assumption: a simulated ceiling that never actually stops a run is a
      forced-value failure.
    - >-
      That the crossover under realistic budgets can be extrapolated from
      measured points. The parent proposal names this as spanning a large gap
      and as the record's stated weakness; the contract carries it as a labelled
      extrapolation and never as a measurement.
    - >-
      That the table representation is declared before execution and held fixed,
      since representation choices change the effective ceiling by a large
      constant and therefore move the crossover.
    - >-
      That instances are shared verbatim with the rho baseline contract, so that
      the comparison is paired rather than between two independently drawn
      samples.
    - >-
      That group-operation counts and peak memory can be attributed separately
      to the baby-step and giant-step phases, so that the degradation in arm B
      is visible rather than aggregated away.

  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: null
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms: []
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations: []
    not_applicable_reason: >-
      PURELY EMPIRICAL. No theorem, asymptotic bound, certificate family,
      reduction or closure argument is proposed. The parent proposal states
      under object_first_candidate that no tracked object propagating under a
      group law is proposed, and describes its own content as measuring a
      textbook tradeoff on this program's implementations. The one closed form
      the record uses, N* = (c * E)^2, is elementary arithmetic over two measured
      quantities rather than a proof obligation, and it is carried in the
      contract's MODELED column where a reader can check it in one line. Per
      templates/research-records.md a purely empirical hypothesis sets this
      field and leaves the other subfields null.

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    DELIBERATELY NULL. No complexity improvement is claimed and no exponent
    moves. The parent proposal states plainly that the incumbents are BSGS and
    rho themselves, measured here under memory constraint and NOT improved, and
    that it proposes nothing new. Every value of the required claim_kind enum
    would be false. The proposal's target_complexity block is carried verbatim
    below.

  source_target_complexity:
    note: >-
      Carried VERBATIM from IDEA-20260815-f81c17.
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is BSGS and rho solves across sizes and
      budgets.
    memory_exponent: >-
      The baby-step table, which is the quantity under study.
    best_known: >-
      Incumbents are BSGS and rho themselves, measured here under memory
      constraint and not improved.
    hidden_overhead: >-
      Table representation choices can shift the effective ceiling by a
      large constant, which is why the representation is reported.
    tradeoff_note: >-
      More memory keeps BSGS competitive to larger sizes; the crossover is
      where the campaign's second baseline disappears.

  heuristic_assumptions:
    - id: HEUR-BSGS-1
      source_id_in_proposal: HEUR-BSGS-1
      formal_statement: >-
        BSGS's memory requirement grows as sqrt(N) with a
        representation-dependent constant that is stable across the
        tested size range.
      random_model_justification: >-
        Carried verbatim from the parent proposal, including its own statement
        of the gap: 'Rigorous ingredient: the baby-step table holds sqrt(N)
        entries by construction, which is exact. THE GAP: the per-entry cost
        depends on the representation and on hash-table load factors, which can
        change with size and can be optimised in ways that shift the crossover
        by a constant that matters exactly where the crossover sits.'
      supporting_results: []
      supporting_results_note: >-
        EMPTY AND CORRECT. The entry-count half is exact by construction and
        needs no supporting result; the per-entry-cost half has no rigorous
        support and the proposal claims none. Populating this field would
        present an implementation fact as a distribution theorem.
      validation_experiment_ids: [EXP-ECDLP-709063]
      falsification_condition: >-
        Measured per-entry memory cost varying materially across the
        tested sizes.
      falsification_condition_operationalised: >-
        The proposal's condition is preserved verbatim above and made decidable
        by one addition attributed to the converting Coordinator: 'materially'
        is pre-registered as a variation in measured bytes per entry exceeding
        20 percent across the four tested sizes at a fixed representation. The
        proposal supplies no threshold, and without one the condition cannot be
        evaluated.
      validation_plan_from_proposal: >-
        Carried verbatim: 'SAMPLE: >= 4 sizes, peak memory recorded per run.
        COMPARISON: measured memory against sqrt(N) times the fitted per-entry
        cost. TAIL CHECK: the largest size, where load factors bite. TRANSFER:
        stated and unjustified beyond the tested range.'

  structural_ingredients:
    - description: >-
        The sibling contract in this series that measures the rho baseline and
        supplies both the comparison side and the shared instance set, and whose
        own R6 metric is unconstrained BSGS on the identical instances -- which
        is exactly this record's NULL 1.
      citation: 'experiments/EXP-ECDLP-4320a7/specification.yaml'
      provenance: internal
      verified_by: TASK-20260904-35fbe5
      role: >-
        Declared dependency and explicit anti-duplication link. If EXP-ECDLP-4320a7
        runs first, its unconstrained BSGS arm SATISFIES this record's NULL 1 and
        must be reused rather than re-measured. The campaign must not pay twice
        for the same unconstrained BSGS measurement.
    - description: >-
        The baby-step giant-step algorithm and its sqrt(N) time and sqrt(N)
        storage requirement, and the general shape of time-memory tradeoffs for
        collision search.
      citation: 'textbook; nearest corpus entries KN-TECH-031 and KN-TECH-035'
      provenance: recalled
      verified_by: null
      role: >-
        The incumbent being measured. RECALLED and therefore a pointer for the
        reviewer rather than support; Stage 0 reads whatever the committed
        corpus entries state and records it verbatim. The parent proposal calls
        the memory requirement textbook and claims no novelty for it.
    - description: >-
        The closed-form crossover N* = (c * E)^2, where E is the largest
        affordable table in entries and c is the rho step-count constant,
        obtained by equating memory-constrained BSGS's N/E giant steps against
        rho's c * sqrt(N).
      citation: 'derived by the converting Coordinator under TASK-20260904-35fbe5'
      provenance: internal
      verified_by: TASK-20260904-35fbe5
      role: >-
        The MODELED crossover prediction. Elementary and checkable in one line;
        it is a prediction to be compared against the measured crossover, never
        a substitute for it. The parent proposal supplies no closed form, which
        is why its crossover claim is not decidable as written.

  reduction_chain:
    core_problem: >-
      Produce, for toy prime-order subgroups at 16, 20, 24 and 28 bits under
      three enforced memory budgets, the measured group-operation cost and peak
      memory of fixed-table BSGS, memory-constrained BSGS and rho on shared
      instances; the measured per-entry table cost and its variation across
      sizes; and per budget either a measured crossover size or an explicit
      bound saying the crossover lies outside the reachable range.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. A located crossover reduces to NOTHING on its own. It
      does not retire BSGS, does not invalidate any past comparison, and does
      not change any hypothesis status. If a crossover is found inside the
      campaign's working sizes, the consequence -- that records claiming two
      matched baselines there in fact have one -- is a Coordinator judgement
      requiring its own decision record and its own re-reading of the affected
      records, not an automatic corollary of this measurement.

  predictions:
    - metric: >-
        B1 -- unbounded-memory null, group operations of BSGS versus rho on the
        same instances with no ceiling
      direction: different
      minimum_effect: >-
        FORCED: BSGS uses fewer group operations at every tested size. Carried
        verbatim in force from the proposal. If it does not, the implementation
        is wrong and no crossover is reportable.
    - metric: >-
        B2 -- tight-memory null, fixed-table BSGS under a ceiling below the cost
        of a single table entry
      direction: different
      minimum_effect: >-
        FORCED: BSGS cannot run and only rho remains. If the run completes
        anyway, the ceiling was simulated rather than enforced, C2 fails, and
        every memory measurement in the package is void.
    - metric: >-
        B3 -- measured crossover group size per budget, the size at which
        memory-constrained BSGS stops using fewer group operations than rho
      direction: different
      minimum_effect: >-
        Located within the reachable range for at least one of the three
        budgets, or reported as a BOUND with the direction stated. This is the
        measurement. No numeric value is pre-registered as required; the
        prediction is that the located value agrees with the modeled
        N* = (c * E)^2 within a factor of 2, and a larger disagreement is
        itself the reportable result.
    - metric: >-
        B4 -- measured bytes per table entry, per size, at the declared
        representation
      direction: different
      minimum_effect: >-
        Variation below 20 percent across the four sizes. Above that,
        HEUR-BSGS-1 is refuted at the tested scope and no single crossover
        formula may be quoted, because the constant that decides it is not
        constant.
    - metric: >-
        B5 -- peak table memory against sqrt(N) times the fitted per-entry cost
      direction: different
      minimum_effect: >-
        Agreement within 20 percent at every size. This is the direct test of
        HEUR-BSGS-1's exact half against its inexact half.
    - metric: >-
        B6 -- the arm-A cliff, the largest size at which fixed-table BSGS starts
        at all under each budget
      direction: different
      minimum_effect: >-
        FORCED to equal the size at which ceil(sqrt(N)) entries first exceed the
        budget, within one tested rung. A cliff located anywhere else means the
        table is not the size the implementation reports.
    - metric: >-
        B7 -- extrapolated crossover under a realistic budget
      direction: different
      minimum_effect: >-
        NO VALUE IS PRE-REGISTERED AND NONE MAY BE QUOTED AS A MEASUREMENT. It
        is reported in a separate labelled table with its basis, its functional
        form and its range, and with the parent proposal's own prior of 0.3 that
        it is defensible enough to quote recorded beside it.

  test_boundary:
    instances:
      - >-
        The identical prime-order subgroup instances used by EXP-ECDLP-4320a7 at
        16, 20, 24 and 28 bits, reused verbatim with their recorded seeds so the
        comparison is paired.
      - >-
        Three enforced memory budgets for the table, and one degenerate budget
        below a single entry for the tight-memory null.
      - >-
        One declared table representation, held fixed across every cell.
    parameters:
      subgroup_bit_sizes: [16, 20, 24, 28]
      memory_budgets_bytes: [4096, 32768, 262144]
      degenerate_budget_bytes: 8
      budget_rationale: >-
        A COORDINATOR ADDITION, DERIVED AND FLAGGED. At an assumed 16 bytes per
        entry these budgets afford about 256, 2048 and 16384 entries, so the
        modeled crossovers N* = (c * E)^2 at c approximately 0.886 fall near
        2^15.6, 2^21.6 and 2^27.7. All three therefore land INSIDE the tested
        16-to-28-bit range, which is the point of choosing them. The 16 bytes
        per entry is an ASSUMPTION used only to size the sweep; the actual value
        is metric B4 and is MEASURED.
      bsgs_arms: ['A fixed-table, requires ceil(sqrt(N)) entries or does not start', 'B memory-constrained, table of m entries at most the budget allows with about N/m giant steps']
      table_representation: >-
        Declared before execution and frozen. The representation, its load
        factor policy and its per-entry layout are recorded, because the parent
        proposal names representation choice as able to shift the effective
        ceiling substantially.
      ceiling_enforcement: >-
        ENFORCED BY THE RUNTIME, not simulated. The run executes under a hard
        address-space or allocator limit set to the declared budget plus a
        recorded fixed overhead allowance, and an attempt to exceed it must
        terminate the arm rather than be counted and permitted.
      charging_convention: >-
        Group-operation equivalents for time, one point addition equal to one
        operation; memory in peak resident bytes, table entries and table bytes,
        reported separately. Identical to EXP-ECDLP-4320a7's convention so the
        two are comparable.
    implementation: >-
      A BSGS implementation with an instrumented, size-capped table in both
      arms, sharing curve arithmetic with the rho harness so that a group
      operation costs the same on both sides. Python 3, or a compiled inner loop
      recorded as such. The ceiling is imposed by the operating system or the
      allocator, not by a counter the algorithm consults. NO network access is
      required and none may be used.
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 6
      maximum_memory_gb: 8
      maximum_runs: 40
      note: >-
        The tested sizes are small; the cost is dominated by arm B at the
        tightest budget, where the giant-step phase runs about N/E steps and at
        28 bits with 256 entries that is on the order of 10^6 operations per
        instance.

  falsification_conditions:
    - >-
      F1 (NULL 1 MISBEHAVES) -- with unbounded memory BSGS does not use fewer
      group operations than rho at some tested size. Carried from the proposal:
      implementation wrong. No crossover is reportable.
    - >-
      F2 (CEILING NOT REAL) -- fixed-table BSGS completes under the degenerate
      budget, or any arm's peak memory exceeds its declared budget without the
      arm being terminated. The ceiling was simulated rather than enforced, C2
      fails, and every memory measurement in the package is void.
    - >-
      F3 (NO CROSSOVER IN RANGE) -- memory-constrained BSGS remains competitive
      across all reachable sizes and budgets. Carried verbatim in force from the
      proposal: the crossover is beyond the measurable range and the record
      reports a BOUND rather than a crossover. This is a legitimate negative
      outcome, not a failure.
    - >-
      F4 (THE CONSEQUENTIAL POSITIVE) -- a crossover sits within the campaign's
      working sizes. Carried from the proposal: comparisons at those sizes have
      effectively one baseline and not two, which changes how they should be
      reported. This is the most decision-relevant outcome and is reported as
      the headline.
    - >-
      F5 (HEUR-BSGS-1 REFUTED) -- measured bytes per entry vary by more than 20
      percent across the tested sizes at a fixed representation, or peak table
      memory departs from sqrt(N) times the fitted per-entry cost by more than
      20 percent. No single crossover formula may then be quoted and the
      deliverable becomes a per-size table.
    - >-
      F6 (CLIFF MISLOCATED) -- arm A's failure point differs by more than one
      tested rung from the size at which ceil(sqrt(N)) entries first exceed the
      budget. The table is not the size the implementation reports and every
      memory number is suspect.
    - >-
      F7 (EXTRAPOLATION OVERREACH, A FAILURE OF THE REPORT) -- any output
      quoting an extrapolated crossover in the same table or the same column as
      a measured one, or without its basis, functional form and range. Out of
      contract regardless of the numbers, because the parent proposal names the
      extrapolation as its weakest part and quoting it as a measurement is the
      specific corruption to prevent.
    - >-
      F8 (SUPERSEDED) -- Stage 0 finds a committed record already measuring the
      BSGS memory-bound crossover for this program. The hypothesis is superseded
      and the run cites that record. Absence of a search result is not evidence
      that none exists, and this worktree cannot see unmerged branches.

  interpretation_limits:
    - >-
      MEASURES A TEXTBOOK TRADEOFF ON THIS PROGRAM'S IMPLEMENTATIONS; PROPOSES
      NOTHING NEW. The parent proposal's own limit, preserved exactly.
    - >-
      SCOPED TO THE TESTED SIZES, BUDGETS AND TABLE REPRESENTATION. A different
      representation moves the crossover by a constant that matters exactly
      where the crossover sits, which is why the representation is reported.
    - >-
      THE EXTRAPOLATED CROSSOVER IS EXPLICITLY AN EXTRAPOLATION AND NOT A
      MEASUREMENT. Carried verbatim from the proposal.
    - >-
      TOY SIZES ONLY, 16 TO 28 BITS. Nothing here supports a statement at
      cryptographic size, and the gap between the measurable range and a
      realistic budget at cryptographic group size is very large.
    - >-
      A CROSSOVER IS ABOUT BASELINE AVAILABILITY, NOT ABOUT ANY CANDIDATE. That
      BSGS ceases to be usable somewhere says nothing about whether any
      mechanism beats rho; it says only how many matched controls a comparison
      at that size actually has.
    - >-
      MEMORY BUDGETS HERE ARE TINY BY DESIGN, chosen so the ceiling binds inside
      the reachable range. They are not models of any deployment's memory.
    - >-
      NOVELTY. The parent proposal records novelty_status 'adaptation' on the
      ground that BSGS's memory requirement is textbook and the contribution is
      locating the crossover under stated budgets, supported by a grep of
      internal records. No external literature was consulted during conversion.

