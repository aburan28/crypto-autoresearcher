hypothesis:
  id: H-AES-7e22e8
  question_id: RQ-AES-001
  goal_id: GOAL-AES-001
  source_idea_id: IDEA-20260807-7e16ac

  statement: >-
    SCOPE: AES-GCM/AES-CTR's counter byte placement (bytes 12-15 = column 3
    under the pinned column-major layout), reduced-round, toy tier. NO ATTACK,
    NO KEY RECOVERY, NO FULL-ROUND OR DEPLOYED-AES CLAIM. Under ShiftRows
    index arithmetic, the column-3 coset a real GCM counter delivers reaches
    full active-column diffusion exactly one round earlier than REF-C's
    diagonal coset D_0 at the same data cost. Predicted: (i) the full 2^32
    column coset balances exactly through r=3 (16/16) and is dead at r=4
    (0/16), one round earlier than REF-C's diagonal 16/16-through-r=4; (ii) on
    a dimension ladder d in {8,16,24,30,31,32} the column-coset depth is
    non-decreasing in d, saturating by d=24; (iii) the largest set-aggregate
    depth available to a ciphertext-only GCM adversary is the d=30 column
    reading, moving to d=31 with the tag-mask block and no further, under
    GCM's own 2^32-2 message limit.

  mechanism: >-
    With SR(x)[t][c] = x[t][(c+t) mod 4], D_0 = {0,5,10,15} maps under
    ShiftRows onto column 0, so after round 1 exactly one column is fully
    active. GCM fixes the counter in column 3; ShiftRows sends column 3 to
    one byte in each of the four columns, so MixColumns makes all four
    columns fully active after round 1 — one round further along in
    diffusion than the diagonal coset. GCM's 2^32-2 plaintext-block limit
    caps the largest aligned (GF(2)-coset) run at 2^30; the missing element
    of the aligned 2^31 run is counter 0, whose block E_K(J_0) is the tag
    mask and is recoverable from any known-plaintext message with its tag,
    restoring 2^31 at the cost of one recovered block, never 2^32 inside
    GCM's own limit. Full derivation: ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/A2.md
    lines 465-509.

  assumptions:
    - >-
      The pinned column-major state layout (state[t][c] = byte[4c+t]) and the
      pinned final-round convention (no final MixColumns) used throughout
      GOAL-AES-001's harness.
    - >-
      REF-C's diagonal-coset measurement (MEAS-GOAL-AES-002-002) is
      reproduced bit-for-bit in the same binary before any column reading is
      believed (known-answer gate).

  proof_search_map:
