      by: DEC-20260929-79ba35
      note: >-
        Approved as well-formed and worth testing. Approval asserts nothing
        about truth; the confirmatory run EXP-SEMBIN-e76704 / RUN-SEMBIN-79996f
        has not executed.
  title: >-
    Committed, hash-pinned code reproduces the exploratory exhaustive counts
    showing that the reduced first fall degree of a Weil-descended Semaev S_3
    system can be RAISED by an invertible F_2-recombination of its generators
    (n = 6, n' = 3), cannot be at n = 4, n' = 2, and can be on a
    degree-matched random null at n = 4, n' = 2.
  statement: >-
    Let d'_ff(F) = min{ D : new_falls(D) > 0 }, new_falls(D) =
    dim(V_D cap R_{<D}) - dim V_{D-1}, computed by GF(2) Macaulay rank in the
    Boolean ring F_2[u_1..u_N]/(u_j^2 - u_j), where V_D is spanned by the
    products m * f_i whose reduced degree is <= D (definition #4 of
    KN-OPEN-7f0511, the reduced or "fake" quantity; not definition #3). For
    M in GL_l(F_2) let F^(M) be the recombined generators f^(M)_i = XOR of
    the f_j over the set bits of row M_i. Build the Semaev systems exactly as
    experiments/EXP-SEMBIN-e76704/src/run_separation.py cell_systems(n, n')
    does (curve y^2 + xy = x^3 + x^2 + 1 over F_{2^n} with the modulus of
    ffd_semaev.MODS[n]; x1, x2 in the span of {1, a, ..., a^{n'-1}};
    x_R = a_real_xR(n, 1, 1, random.Random(100 n + n')); N = 2 n'; reduced to
    the maximal F_2-independent subset; the null is random_matched on the
    same RNG stream, then reduced). Then, executed from the committed code,
    (T1) at (n, n') = (6, 3) with M = [1, 2, 4, 8, 26], d'_ff(I) = 2 and
    d'_ff(M) = 3 by the original (slow) instrument; (T2) exhaustively over
    GL_5(F_2) at (6, 3): group order 9,999,360, exactly 1,612,800 elements
    with d'_ff(M) > d'_ff(I), none of them with a zero generator, 0 counted
    downward, d'_ff(I) = 2 and max_M d'_ff(M) = 3; (T3) exhaustively over
    GL_4(F_2) at Semaev (4, 2): group order 20,160, 0 upward, d'_ff(I) = 2,
    max 2; (T4) exhaustively over GL_4(F_2) on the degree-matched null at
    (4, 2): group order 20,160, exactly 5,424 upward, d'_ff(I) = 2, max 3.
  mechanism: >-
    Recombination by an invertible M preserves the F_2-span of the generators
    (at the witness, checked as rank preservation by control C2) but changes
    which span elements are GENERATORS and so which products m * g enter V_D.
    The observable depends on the presentation, not only on the span; the
    exploratory run showed this dependence can go upward. No mechanism for
    WHEN it goes upward is asserted: a degree-drop absorption reading was
    considered in exploration and is not supported by the null (which
    separates with no recorded linear drop) nor by the Semaev cells (four of
    five with a recorded drop do not separate). This hypothesis is a
    replication of computation, not an explanation.
  assumptions:
    - >-
      The Macaulay-rank definition of new_falls(D) implemented in
      src/recomb_search.py (new_falls_at, ffd) and src/fastfall.py (Kernel)
      is the definition #4 quantity stated above. C1 checks the two
      implementations against each other on the identity at 10 cells; it
      cannot detect a definitional error the two share.
    - >-
      Python's random.Random(seed) stream and the enumeration order of
      itertools.product are deterministic across CPython 3 versions for the
      calls used (rng.choice, rng.sample); the RNG determines x_R and the
      null system.
  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: null
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms: []
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations: []
    not_applicable_reason: >-
      Empirical/computational hypothesis: exact exhaustive counts on three
      fixed toy systems, no theorem, bound or reduction is claimed.
  rerandomization: not_applicable -- no worst-to-average-case device is used
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: >-
        Nagao's D_ff^max := max over invertible M of D_ff(M), and his statement
        that he cannot prove Weil-descent systems have low D_ff^max
      citation: KN-OPEN-7f0511 (quoting Nagao ePrint 2013/549, p. 3; KN-LIT-c5dceb)
      provenance: internal
      verified_by: coordinator (this session), KN-OPEN-7f0511 read in full 2026-09-29
      role: definition whose reduced analogue is measured
    - description: >-
        The Lemma 4 gap: d_F <= d'_F is not proved in 2015/984, and its
        literal form (field equations outside the generating set) is false by
        an exhibited counterexample
      citation: H-SEMBIN-a7e721 (mechanism, LINK 2); KN-OPEN-7f0511 item (B)
      provenance: internal
      verified_by: coordinator (this session), H-SEMBIN-a7e721 lines 1-60 read 2026-09-29
      role: scope limit on transferring any reduced-degree result to the true degree
  reduction_chain:
    core_problem: not_applicable -- no problem is solved or reduced
    corollaries: []
  predictions:
    - metric: T1 d'_ff(M) at (6, 3), M = [1, 2, 4, 8, 26], original instrument
      direction: higher
      minimum_effect: exactly 3 against d'_ff(I) = 2
    - metric: T2 upward count over GL_5(F_2) at Semaev (6, 3)
      direction: different
      minimum_effect: exactly 1,612,800 of 9,999,360; 0 with a zero generator; 0 downward; max 3
    - metric: T3 upward count over GL_4(F_2) at Semaev (4, 2)
      direction: different
      minimum_effect: exactly 0 of 20,160; max 2
    - metric: T4 upward count over GL_4(F_2) at the degree-matched null (4, 2)
      direction: different
      minimum_effect: exactly 5,424 of 20,160; max 3
  test_boundary:
    instances:
      - Semaev S_3 2-decomposition, (n, n') = (6, 3), 5 independent generators, N = 6
      - Semaev S_3 2-decomposition, (n, n') = (4, 2), 4 independent generators, N = 4
      - degree-matched random null (random_matched) at (4, 2), reduced to independent generators, N = 4
      - control C1 only, identity M, full (unreduced) generator sets at (n, n') in {3..7} x {2, 3}
    parameters:
      curve: 'y^2 + xy = x^3 + x^2 + 1 (a2 = a6 = 1)'
      field_modulus: ffd_semaev.MODS[n] (x^6 + x + 1 at n = 6; x^4 + x + 1 at n = 4)
      subspace_basis: '{1, a, ..., a^(n''-1)}'
      rng_seed: 100 n + n' (603 for (6, 3); 402 for (4, 2))
      ring: Boolean, u^2 = u
      recombination_set: all of GL_l(F_2), exhaustive
      field_bits: [4, 6]
    implementation: >-
      experiments/EXP-SEMBIN-e76704/src/{run_separation.py, ffd_semaev.py,
      recomb_search.py, fastfall.py}, pure Python, sha256-pinned in the
      experiment specification
    budget:
      runs: 1
      wall_clock_watchdog_seconds: 86400
      memory_gb: 4
  falsification_conditions:
    - >-
      In a run that exits 0 from the committed code with matching source
      hashes, any preregistered exact value in T1-T4 differs from the
      runner's PRED block (runner verdict pass_ false for any test).
    - >-
      Control C1 (all_match) or C2 (span/rank invariance at the witness) is
      false; the replication is then not confirmed and no mathematical
      reading of T1-T4 from that run is admissible.
    - >-
      An exit-3 or other infrastructure failure falsifies NOTHING and is not
      evidence (AGENTS.md rule on timeouts/crashes); the run is repeated
      under the same frozen contract.
  interpretation_limits:
    - >-
      NOT independent pre-registration. Every predicted value was read off an
      exploratory run of substantially the same code on 2026-09-27. A pass
      confirms that committed, hash-pinned code reproduces those numbers on a
      clean path and turns scratch data into citable artifacts; it does not
      confirm a prediction made in ignorance of the outcome.
    - >-
      Toy tier only, N <= 6 Boolean variables (field sizes 2^4 and 2^6). No
      statement about asymptotics, growth in n or n', chained systems,
      cryptographic parameters, subexponentiality, or any curve's security.
    - >-
      Says nothing about whether D_ff^max is BOUNDED (Nagao's actual open
      problem, KN-OPEN-7f0511 (A)); only that the reduced analogue can EXCEED
      the plain value on this system class at one cell.
    - >-
      Measures definition #4 (reduced, Boolean ring). Nagao defines D_ff^max
      over definition #1. The transfer from #4 to #3 rests on 2015/984
      Lemma 4, which is unproved there and false in its literal form
      (H-SEMBIN-a7e721); no transfer to #1/#2/#3 is asserted.
    - >-
      The separation is GENERIC, not a Weil-descent property: the
      degree-matched random null separates too (T4).
    - >-
      The separation is NOT AUTOMATIC. In nullcontrol_results.json, of the
      five Semaev cells with a recorded linear degree drop, four did not
      separate: three under a 400-sample search of GL_l(F_2) ((5,3), (7,3),
      (5,2)) and one exhaustively ((4,2), which T3 re-tests). Only (6,3)
      separated. The earlier exploratory claim that separation is automatic
      when D_ff = max_i deg f_i was wrong and is corrected by T3.
    - >-
      One curve (a Koblitz-type a2 = a6 = 1), one basis, one x_R per cell,
      2-decomposition (not chained) systems, reduced to an independent subset.
      The unreduced 6-generator set at (6, 3) was only sampled in exploration
      (821 upward of 6,000 sampled, control_results.json) and is not tested.
    - >-
      The runner's "downward" counter counts only M with no new fall at
      d'_ff(I) whose d'_ff(M) is lower; an M with falls both below and at
      d'_ff(I) is skipped. downward = 0 is therefore not an exhaustive count
      of d'_ff(M) < d'_ff(I).
