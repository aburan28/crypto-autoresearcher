        type-versus-count dichotomy at
        frozen m=3 only, not the
        proposal's Semaev S_m^t, not
        the yield ratio k, not Velu.
      reproduction_check: >
        REAL all fibres size 6,
        type_degree equals count_degree.
        KF max fibre 8, type_degree 2,
        count_degree 8, they disagree.
        NULL empty affine rejected.
        p=0 rejected.
