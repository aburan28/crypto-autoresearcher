          gap on KF. Zero claimed attack
          improvement.
    quantifier_order: >
      Freeze m=3 before reading the
      dichotomy. Existential equality
      at one toy does not imply Semaev
      S_m and does not imply a rho
      beat.
    method_ceiling:
      strongest_certifiable_claim: >
        Instrument reproduction on the
        declared frozen toys.
        Never Semaev S_m.
        Never a yield ratio k.
        Never an ECDLP exponent.
      nearby_object_control: >
        NULL is the empty affine set.
        An argument that still assigns
        it a true dichotomy is wrong.
        KF is the translation object;
        an argument that assigns every
        deck the count-read degree is
        wrong.
    proof_obligations:
