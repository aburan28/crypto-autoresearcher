  statement: >
    Fix m=3 before any Semaev
    polynomial, Velu map, yield
    ratio, or (L,b) meter is read.
    Stage 0 asserts only the
    deck-type versus count degree
    dichotomy as exact integer
    fibre arithmetic. count_degree(g, m)
    is g**(m-2). type_degree(aut, g, m)
    is g**(m-2). type_degree(translation,
    g, m) is 2**(m-2). REAL is the
    j=0 model y^2 = x^3 + 2 over
    F_13 with t = x^3: every affine
    t-fibre has size 6, so
    type_degree equals count_degree
    equals 6. KF is the Edwards
    model x^2 + y^2 = 1 + 3 x^2 y^2
    over F_17 with t = (x y)^2:
    the maximum affine t-fibre has
    size 8, type_degree is 2,
    count_degree is 8, and they
    disagree. NULL empty affine
    set is rejected. p=0 is
    rejected. This is not Semaev
    S_m, not a Velu isogeny, not
    a yield ratio k, not elliptic
    M_S, not an (L,b) meter, not
    an Aut census, not an orbit
    cost, and not a rho beat.
    Stages 1+ stay unauthorized.
  mechanism: >
    IDEA-20260905-05648a (S5) says
    the per-variable degree is
    decided by the TYPE of the
    deck elements, not by their
    number. Aut-type deck of order
    g is read by the count rule
    g**(m-2). Translation-type
    deck of order 2k is Semaev of
    the quotient, degree 2**(m-2),
    not (2k)**(m-2). Stage 0
    freezes that dichotomy as
    fibre-size arithmetic on two
    frozen toys. The producer
    enumerates affine t-fibres
    and compares type_degree to
    count_degree. The KF
    translation object and the
    NULL empty set are the
    proves-too-much and nearby-
    object controls. No S_m is
    formed. No Velu is run. This
    is a new RQ-ECDLP-002 object
    after Stage 0 of
    EXP-ECDLP-5f3822 held as
    P-S0-SHIFT (DEC-20260908-e00455).
    It is not Stage 1 of
    EXP-ECDLP-5f3822 and not
    Stage 1 of this experiment.
  predictions:
    - id: P-S0-DECKTYPE
      metric: well-defined exact deck-type versus count degree dichotomy on frozen toys
      direction: different
      minimum_effect: >
        After fixture_pass, REAL
        fibres are all size 6 and
        type_degree equals
        count_degree. KF max fibre
        is 8, type_degree is 2,
        count_degree is 8, and they
        disagree. NULL empty affine
        set is rejected. p=0 is
        rejected. One certified miss
        after fixture_pass is a
        scoped falsification of this
        instrument at the frozen toys.
      claim_tier: observational
    - id: P-S1-SEMAEV
      metric: Semaev S_m^t degree and yield ratio k
      direction: different
      minimum_effect: >
        Stage 1+, unauthorized here.
        Stage 0 does not form S_m,
        does not run Velu, and does
        not claim a yield ratio.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KFCOUNT
      statement: >
        After fixture_pass, KF reports
        type_degree equal to
        count_degree, or max fibre
        not 8. An encoding bug is
        failed_infrastructure.
    - id: F-S0-REALCNT
      statement: >
        After fixture_pass, REAL fails
        to have every fibre size 6
        or fails type_degree equal
        to count_degree. That
        falsifies only P-S0-DECKTYPE
        at the frozen j=0 toy.
    - id: F-S1-SEMAEV
      statement: >
        After an authorized later
        stage, a claimed S_m^t degree
        or yield that misses (S1)-(S3).
        Unauthorized here.
