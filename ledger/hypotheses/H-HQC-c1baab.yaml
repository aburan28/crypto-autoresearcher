  interpretation_limits:
    - >-
      A DEPENDENCE RATIO IS NOT A DECODING FAILURE RATE. R_k(u) at u = 1e-4 and
      k = 8 says nothing directly about a probability of 2^-128 at k = 16, and the
      extrapolation to k = delta_e + 1 is HEUR-002, reported with its bracket. NO
      DFR VALUE IS PRODUCED and none may be inferred.
    - >-
      THE SIGNED MARGIN AND THE RELIABILITY MEASURE ARE DIFFERENT OBJECTS AND
      RESULTS ABOUT ONE ARE NOT RESULTS ABOUT THE OTHER. Every table carries which
      object it is computed on; a citation dropping that label cites something
      this hypothesis does not claim.
    - >-
      DEPLOYED PARAMETERS ARE NOT A DEPLOYED CLAIM TIER. RQ-HQC-001's toy
      claim-tier ceiling is set by the certificate standard in
      docs/claims-and-verification.md, not by the parameter values, and applies
      unchanged. Nothing here carries a certificate of anything.
    - >-
      The signed margin requires the transmitted codeword and is therefore a
      SIMULATION INSTRUMENT. Nothing here is available to an adversary and nothing
      here is an attack surface.
    - >-
      Scoped to HQC-1 unless HQC-3 and HQC-5 are run. Their inner codes
      ([640, 8, 320]) and outer codes differ and SPEC Table 11 shows their inner
      DFRs are not monotone in security level, so nothing transfers.
    - >-
      Scoped to the deployed decoder, the pinned tie rule and the two samplers
      run. Not a statement about maximum-likelihood decoding of the whole
      concatenated code.
    - >-
      No attack, no oracle, no query count, no key recovery, no security
      consequence. A conservative DFR bound is not a vulnerability and a
      dependence ratio above 1 is not an attack.
    - >-
      No full text of eprint 2026/795 has been read in this program. Every
      statement about what that model predicts is PROVISIONAL until transcribed,
      and a head-to-head reported before transcription is a head-to-head against a
      model described from a search snippet.
