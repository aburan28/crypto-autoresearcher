  structural_ingredients:
    - description: >-
        The abstract statement that the characteristic polynomial calculates
        the number of isogeny classes. No integer is in the opened note.
      citation: KN-LIT-174
      provenance: internal
      verified_by: >-
        coordinator design session 2026-10-05 read
        knowledge/literature/KN-LIT-174.md
      role: names the published count's document; does not supply the integer
    - description: >-
