# H-DRINF-cac0da — specified from IDEA-20261005-497357.
# Protocol approval is DEC-20261005-3b806c. This record asserts nothing
# about the integers. No module was enumerated in this design.
hypothesis:
  id: H-DRINF-cac0da
  question_id: RQ-DRINF-6b5a9d
  source_proposal: IDEA-20261005-497357
  goal_id: null
  goal_id_note: >-
    ledger/questions/RQ-DRINF-6b5a9d.yaml does not name a goal. This design
    does not attach one and does not create a goal record.
  status: approved
  status_note: >-
    approved means the measurement protocol in EXP-DRINF-b750f4 is approved
    for a later executor. It does not mean the published count equals the
    enumeration. Status moves only by DEC-20261005-3b806c under the standing
    user authorization of 2026-09-06. No polynomial was enumerated in this
    design.
  proposed_by: coordinator
  conversion_note: >-
    The six modules, the equality |N_formula - N_enum| = 0, the degree
    prediction 2, the inequality N_j >= N_enum, the Carlitz exclusion, and
    the bound-plus-one control are carried from IDEA-20261005-497357. The
    Coordinator added only the operational rule that N_formula is read from
    the PDF at run time and that a missing formula withdraws the equality
    rather than substituting a remembered integer. Those rules were fixed
    before any run.

  statement: >-
    TEST BOUNDARY. q = 3. The Frobenius of F_3 is tau. The six modules are
    Phi_T = g tau + Delta tau^2 with g in {0, 1, 2} and Delta in {1, 2},
    at A-characteristic (T). The rank-1 module Psi_T = tau is the control
    and is not one of the six. N_enum is the number of distinct monic
    Frobenius characteristic polynomials returned by the relation search.
    N_formula is the integer produced by the isogeny-class formula in the
    PDF named by KN-LIT-174, applied to these same six modules. N_j is the
    number of distinct j-invariants under the j formula in that same PDF.
    No ECDLP exponent is claimed.

    SOURCE OF THE PUBLISHED COUNT. The source is Mohamed Ahmed Mohamed
    Saadbouh, "Endomorphism Rings and Isogenies Classes for Drinfeld
    A-Modules of Rank 2 over Finite Fields", arXiv:0412367, as named by
    knowledge/literature/KN-LIT-174.md. That note lists local copies
    downloads/0412367v3.pdf and downloads/0412367v3 (1).pdf. This design
    session opened the markdown note and did not open the PDF. Both paths
    are absent from this checkout. The markdown states no integer. The
    numerical count therefore has provenance recalled and is not verified.
    No PDF integer is frozen in this record.

    PRE-REGISTERED PREDICTION, fixed before any run. Once N_formula has
    been read from that PDF and N_enum has been enumerated, those two
    integers are equal. Each rank-2 characteristic polynomial has degree
    2. N_j is at least N_enum. A mismatch |N_formula - N_enum| of at least
    1, after both integers exist, is a negative.

    DISTINGUISHABLE OUTCOMES. (1) The PDF formula and the relation search
    both return integers, they are equal, every rank-2 polynomial has
    degree 2, N_j >= N_enum, and the Carlitz module is outside the six:
    agreement on this field. (2) Both integers exist and they differ:
    negative. (3) A rank-2 polynomial has degree other than 2, or
    N_j < N_enum: negative. (4) The PDF is absent, or it contains no
    isogeny-class formula: the equality prediction is withdrawn. That is
    inconclusive, not a negative, and a recalled formula is not
    substituted. (5) The two degree bounds disagree, a recalled integer
    is used as N_formula, or the run fails: invalid, not evidence.

  mechanism: >-
    Two procedures on the same six modules either return the same integer
    or they do not. The map from a module to its Frobenius characteristic
    polynomial discards the pair (g, Delta) and keeps the polynomial.
    Equality of N_formula and N_enum means the PDF formula and the
    relation search describe one partition at q = 3. Inequality means
    they disagree, so one of them is not the count the abstract names.
    N_j > N_enum means at least two j-invariants share a polynomial.
    N_j = N_enum means that collapse is invisible on these six modules.
    Hayes class-field generation is not constructed.

  assumptions:
    - The six pairs (g, Delta) with g in {0, 1, 2} and Delta in {1, 2} are the full list at q = 3 with Delta nonzero.
    - The Frobenius of F_3 is tau.
    - Degree 2 is the prediction for each rank-2 characteristic polynomial. If the PDF defines another degree, that degree is the result and the prediction fails.
    - j is the normalised invariant the PDF defines. No recalled formula for j is an input.
    - N_formula is an integer read from the PDF formula. A remembered integer is not N_formula.

  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
    not_applicable_reason: >-
      This is a measurement of one equality of counts on six modules at
      q = 3. It is not a proof, an asymptotic bound, a certificate family,
      a reduction, or a closure argument.

  asymptotic_claim:
    problem: none — no complexity improvement is claimed
    prior_best: unchanged; no ECDLP exponent is in scope
    time_exponent: unchanged
    memory_exponent: unchanged
    hidden_cofactor: none introduced
    claim_kind: not_applicable

  heuristic_assumptions:
    - id: HA-1
      formal_statement: >-
        Two rank-2 Drinfeld modules over this finite field lie in the
        same isogeny class if and only if their Frobenius characteristic
        polynomials agree, in the sense that the PDF formula's count
        equals the number of distinct polynomials the relation search
        returns. The sample is the six modules at q = 3, characteristic
        (T). No transfer to larger m is claimed.
      random_model_justification: >-
        KN-LIT-174's abstract says the characteristic polynomial is used
        to calculate the number of isogeny classes. This design session
        opened that markdown and did not open the PDF. The classical
        theorem imitated is Tate 1966, provenance recalled, not opened,
        and is not used as support. The finite check is agreement of
        N_formula with N_enum, together with N_j >= N_enum.
      supporting_results: []
      validation_experiment_ids:
        - EXP-DRINF-b750f4
      falsification_condition: >-
        The PDF formula and the relation search both return integers and
        those integers differ, or a rank-2 polynomial has degree other
        than 2, or N_j < N_enum.

  predictions:
    - metric: absolute difference |N_formula - N_enum|
      direction: different
      minimum_effect: 0
    - metric: degree of each rank-2 characteristic polynomial
      direction: different
      minimum_effect: 2
    - metric: N_j - N_enum
      direction: different
      minimum_effect: 0

  test_boundary:
    instances:
      - id: six-modules
        field: F_3
        characteristic: (T)
        modules: Phi_T = g tau + Delta tau^2 for g in {0, 1, 2} and Delta in {1, 2}
        count: 6
      - id: carlitz
        module: Psi_T = tau
        role: nearby_object_control
    parameters:
      q: 3
      degree_of_T: 1
      extension_degree: 1
    implementation: >-
      Exact enumeration of additive-polynomial relations and an integer
      read from the PDF formula. No floating point. No module was
      enumerated while specifying this record.
    budget:
      maximum_runs: 2
      note: >-
        One scientific execution of the six modules. maximum_runs 2
        allows one infrastructure retry under a new run id. The
        scientific objects are frozen at these six modules.

  falsification_conditions:
    - "|N_formula - N_enum| is at least 1 after both integers have been produced, the first from the PDF formula and the second from the relation search."
    - A rank-2 characteristic polynomial has degree other than 2.
    - N_j < N_enum.
    - >-
      The PDF contains no isogeny-class formula, or the PDF is absent.
      The equality prediction is withdrawn. That withdrawal is not a
      negative and is not replaced by a recalled formula.

  interpretation_limits:
    - Equality at q = 3, m = 1, six modules. No asymptotic class-number formula.
    - The PDF integer was not opened in this design. It is not a verified numeral.
    - Hayes is not opened and no class field is built.
    - Not an attack claim. No ECDLP exponent is in scope.

