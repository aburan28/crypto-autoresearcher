hypothesis:
  id: H-MLKEM-d9062d
  question_id: RQ-MLKEM-002

  statement: >-
    SCOPE: functional single-byte differential conformance of ML-KEM
    re-encryption comparison primitives, at the three FIPS 203 ciphertext
    lengths L = 768, 1088, 1568, on laboratory builds from public source, under
    the GNU ld --wrap instrument admitted by EV-MLKEM-010. CLAIM TIER toy /
    laboratory. NO ATTACK, NO ORACLE, NO EXPONENT, NO MLWE STATEMENT, NO
    STATEMENT ABOUT DEPLOYED SYSTEMS.

    The hypothesis has four conjuncts, each with a forced value fixed before any
    measurement.

    (A) MECHANISM MODEL. The silent set S(impl, L) -- the ciphertext byte
    indices at which a single-byte differential mutation does not change the
    comparison verdict -- is, for every routine of the standard
    accumulate/reduce/finalize shape, generated by exactly one of three
    single-parameter classes with these closed forms:
        C-BND(N):   S = [N, L),                       |S| = max(0, L - N)
        C-COV(w):   S = [w*floor(L/w), L),            |S| = L mod w
        C-RED(phi): S = { i : (i mod nlanes) not in Lambda },
                    |S| = L*(1 - phi), minimal period dividing nlanes
    and the two archived pre-fix wolfSSL arms of EV-MLKEM-005 are reproduced
    with EXACTLY ZERO integer residual at all three parameter sets: AVX2 by
    C-BND(1536) and by C-COV(64), both giving (0, 0, 32); NEON by C-RED(1/2),
    giving (384, 544, 784) = (L/2). The post-fix arms are reproduced by every
    class at its no-defect parameter, giving (0, 0, 0).

    (B) DIVISIBILITY OBSTRUCTION. Every FIPS 203 ciphertext length satisfies
    L = 32*(du*k + dv), hence 32 | L. Therefore |S| = L mod w = 0 for every
    w dividing 32, at every ML-KEM parameter set, unconditionally: the
    coverage-deficit class is ARITHMETICALLY UNREACHABLE for strides 1, 2, 4, 8,
    16 and 32, and is reachable in exactly five of the 27 (stride, parameter
    set) cells over w in {1,...,256}, namely (64, 1024), (128, 768), (128,
    1024), (256, 768), (256, 1024).

    (C) IDENTIFIABILITY COLLISION. Over the complete set of standardized
    parameter sets, the cardinality profile does NOT identify the mechanism:
    C-BND(1536) and C-COV(64) have identical profiles AND identical index sets,
    and C-COV(128) and C-COV(256) likewise. The shape observable
    is_suffix(S) together with the minimal period DOES separate C-RED from the
    other two at a single parameter set, and no C-BND or C-COV member reproduces
    (384, 544, 784).

    (D) POPULATION CONSEQUENCE. GOAL-MLKEM-002's strict neighborhood predicate
    is stated in C-BND vocabulary ("fixed-bound hand-written vector comparison
    tails"); every candidate recorded as rejected under it in
    experiments/EXP-MLKEM-009/analysis/second_implementation_selection.md has a
    comparison stride dividing 32 and is therefore ALSO immune to C-COV by (B).
    The predicate "the comparison reduces a SIMD accumulator, measure phi",
    applied to the same evidence base, has a population of at least two before
    any fetch. If any conjunct fails, the deliverable is a NAMED NO-GO with its
    exact boundary and its forward guidance, not a tally.

  mechanism: >-
    DERIVED IN-REPO. Every archived number below is quoted from a committed
    record; every arithmetic value was computed on this machine and is
    recomputed under a frozen script in the paired experiment; every external
    fact is labelled with its provenance and none is treated as an authority.

    1. THE OBJECT. GOAL-MLKEM-002 and its predecessor measured a boolean
    ("silent indices present") and a cardinality. The object here is the pair
    (silent set as an index set, parameter set), i.e. the map L -> S(L). Two
    projections of it are used: the cardinality profile
    (|S(768)|, |S(1088)|, |S(1568)|), and the shape (is_suffix, minimal period,
    residue set). The finer projection is available from data the existing
    instrument already emits -- EV-MLKEM-005 reports per-index tables that the
    validator recomputed -- so this costs no new measurement on the archived
    arms.

    2. THE THREE CLASSES AND WHY THEY ARE THE RIGHT DECOMPOSITION. Every
    optimized constant-time comparison in this family has the shape
    accumulate-over-blocks, reduce-the-accumulator, finalize. A defect enters at
    exactly one of those three points, and the entry point determines the
    signature. C-BND and C-COV are accumulate-stage defects and both yield a
    TOP-OF-BUFFER SUFFIX. C-RED is a reduce-stage defect and yields a PERIODIC
    set. A finalize-stage defect C-FIN is a fourth class, recorded and NOT
    pursued: its signature would be S = [0, L) entire, which no archived arm
    exhibits. The decomposition is claimed to cover the archived data, not to be
    exhaustive over all possible defects, and that limit is stated in the method
    ceiling below.

    3. THE ARCHIVED ANCHORS, VERBATIM. EV-MLKEM-005 records: "mlkem_cmp_avx2 in
    wolfcrypt/src/wc_mlkem_asm.S ends at vmovdqu 1504(%rdi) and therefore
    compares 1536 of the 1568 ML-KEM-1024 ciphertext bytes"; "BUILD-PREFIX-AVX2
    on ML-KEM-1024 has silent set exactly {1536..1567} (32 indices, empty
    unstable set, coverage fraction 1.0, 6272 mutation events)"; "Pre-fix AVX2
    ML-KEM-1024 shows 32 disagreements against its scalar reference; all other
    pre-fix parameter-set combinations show zero"; "mlkem_cmp_neon ... loads the
    full length but reduces with ins v9.b[0], v8.b[1] at v5.9.1 and with
    ext v9.16b, v8.16b, v8.16b, #8 at v5.9.2"; "BUILD-PREFIX-NEON under
    qemu-aarch64 has silent cardinalities 384, 544, and 784 following the
    (i mod 64) >= 32 half-block pattern plus the ML-KEM-1024 remainder";
    "BUILD-POSTFIX-AVX2 and BUILD-POSTFIX-NEON show zero silent indices ... for
    all three parameter sets and both seeds". The record states that the
    coordinator, the validator and the red team each read the assembly
    independently, and that the validator recomputed the per-index tables.

    4. FITTING THE ANCHORS, WITH NO PARAMETER CHOSEN AFTER THE FACT.
    C-BND(1536): max(0, L - 1536) = (0, 0, 32). The parameter 1536 is not
    fitted -- it is the byte count the record itself states the routine
    compares. C-COV(64): L mod 64 = (0, 0, 32). The parameter 64 is not fitted
    -- it is the vector-pair width implied by the final offset 1504 = 47*32
    together with 1536 = 24*64. C-RED(1/2): L*(1 - 1/2) = (384, 544, 784). The
    parameter 1/2 is not fitted -- it is read off the v5.9.1 reduction, which
    folds one lane of a two-half accumulator. Three anchors, three parameters,
    all fixed by source facts recorded independently of the cardinalities.

    5. THE DIVISIBILITY IDENTITY AND WHAT IT FORCES. FIPS 203 encodes a
    256-coefficient polynomial at d bits per coefficient into 256*d/8 = 32*d
    bytes; a ciphertext is k such encodings at du bits plus one at dv bits, so
    L = 32*(du*k + dv). THE ENCODING RULE AND THE TRIPLES (k, du, dv) ARE
    RECALLED FROM FIPS 203 AND ARE CANDIDATES TO CHECK, NOT AN AUTHORITY; they
    are corroborated in-repo only in that the lengths they imply, 768 / 1088 /
    1568, are the lengths every archived measurement is consistent with.
    Granting the identity, 32 | L, so the remainder path of any w | 32 routine
    executes zero iterations at every ML-KEM length: it is DEAD CODE there, may
    be arbitrarily defective, and no conformance probe conducted at ciphertext
    length has any power against it. This is a ZERO-POWER STATEMENT ABOUT THE
    INSTRUMENT, derived before any run, and it is the sharpest thing in this
    record.

    6. THE COLLISION AND ITS CONSEQUENCE FOR THE GOAL'S SEARCH. Because
    C-BND(1536) and C-COV(64) agree on every standardized cell -- in cardinality
    AND in index set -- the founding measurement does not determine which
    mechanism it is an instance of. The goal's strict predicate was written in
    C-BND vocabulary and five candidates were rejected verbatim for being
    "length-parameterized" (BoringSSL CRYPTO_memcmp; PQClean avx2 len/32 loop
    plus scalar remainder; PQClean aarch64 runtime-length scalar loop;
    mlkem-native and aws-lc portable compare). If the mechanism is C-COV(64),
    the predicate could not select the correct successor population, which is
    stride >= 64 code evaluated at ML-KEM-1024. Reading the load stride in
    wc_mlkem_asm.S at peeled commit 1d363f3 resolves this in minutes and is
    stage S2 of the paired experiment.

    7. WHY C-RED IS THE CLASS THE GOAL COULD NOT SEE. C-RED is stride-
    independent and parameter-set-independent, so conjunct (B) does not protect
    against it; its silent set at ML-KEM-1024 is 784 bytes against the AVX2
    class's 32, a factor of 24.5; and the wolfSSL fix for it changed the
    REDUCTION, not the coverage, so no coverage-shaped predicate can express it.
    Its population -- comparisons that reduce a SIMD accumulator -- contains at
    least wolfSSL (two backends) and PQClean avx2 from committed records alone,
    and PQClean's `1 - _mm256_testz_si256(h, h)` reduces the whole register, so
    it is a MEASURED PASS at phi = 1 rather than a non-candidate. That is the
    structural difference between a predicate that returns an empty population
    and one that returns a measured null.

    8. WHAT IS NOT DERIVED, AND IS THE WEAKEST LINK. Conjunct (A)'s claim that
    the three classes are the right decomposition is a MODEL, supported by
    fitting three archived arms with three source-fixed parameters and by the
    accumulate/reduce/finalize anatomy, and it is not proved. A fourth class
    producing a suffix or a periodic set with different arithmetic would sit
    inside the fitted region undetected. The forced values are the defence: they
    are exact integers, they were fixed before comparison, and any one of them
    coming out wrong falsifies the class that produced it.

    9. AN INTERNAL DISCREPANCY THIS RECORD REPORTS AND DOES NOT ADJUDICATE. A
    literal "(i mod 64) >= 32" rule over [0, 1568) yields 24*32 = 768 silent
    indices; EV-MLKEM-005 records 784, which is exactly L/2 and which the record
    itself qualifies with "plus the ML-KEM-1024 remainder". The C-RED(1/2)
    closed form matches the cardinality; the quoted prose pattern does not,
    quite. Both statements are in one committed record and this hypothesis
    reports the disagreement rather than picking a side (AGENTS.md knowledge-
    retrieval policy item 7). Stage S3 recomputes the index-level pattern from
    the archived per-index tables and settles it, and the settlement is a
    deliverable in either direction.

  assumptions:
    - >-
      FROZEN FORCED-VALUE TABLE, part of the contract, complete and with every
      parameter fixed BEFORE any measurement or file read.
      (1) L in {768, 1088, 1568} for ML-KEM-512 / -768 / -1024.
      (2) C-BND(N): |S(L)| = max(0, L - N); S is the top max(0, L - N) indices.
      (3) C-COV(w): |S(L)| = L mod w; S is the top L mod w indices.
      (4) C-RED(phi) with lane count nlanes and inspected subset Lambda:
          S = { i in [0, L) : (i mod nlanes) not in Lambda };
          |S(L)| = L*(1 - phi) up to one partial period.
      (5) ANCHOR A1 (AVX2, C-BND, N = 1536): profile EXACTLY (0, 0, 32).
      (6) ANCHOR A2 (AVX2, C-COV, w = 64): profile EXACTLY (0, 0, 32).
      (7) ANCHOR A3 (NEON, C-RED, phi = 1/2): profile EXACTLY (384, 544, 784).
      (8) ANCHOR A4 (post-fix, any class at no-defect parameter): EXACTLY
          (0, 0, 0).
      (9) REACHABILITY TABLE: L mod w over w in {1,2,4,8,16,32,64,128,256} and
          the three L, 27 cells, of which EXACTLY 5 are nonzero: (64, 1568) = 32,
          (128, 1088) = 64, (128, 1568) = 32, (256, 1088) = 64, (256, 1568) = 32.
      (10) GRADED C-RED LADDER at L = 1568: phi in {1, 7/8, 3/4, 1/2, 1/4}
          gives |S| = (0, 196, 392, 784, 1176), exactly linear in (1 - phi).
      (11) NULL-LENGTH CHECK: at L = 1000, which is not a multiple of 32,
          L mod 32 = 8 and L mod 16 = 8, so the w <= 32 row must be NONZERO.
      NO OTHER DEGREE OF FREEDOM EXISTS. Any adjustment to (1)-(11) after any
      stage output has been observed requires a versioned protocol amendment
      with confirmatory_status exploratory_only, and is never an edit. EV-IC-002
      is this program's own precedent for a support verdict retracted because a
      criterion was revised after the prior criterion was seen to fail.
    - >-
      INHERITED PREMISE, CARRIED NOT HIDDEN. Every archived number used as an
      anchor comes from EV-MLKEM-005, which is committed, thrice-read, and whose
      per-index tables the validator recomputed. This hypothesis does not
      re-measure the wolfSSL builds and does not need to: conjuncts (A)-(C) are
      statements about whether closed forms reproduce committed integers. Where
      a stage does re-read source or re-measure, it says so.
    - >-
      PROVENANCE ASYMMETRY. The FIPS 203 encoding rule and the parameter triples
      are the one load-bearing EXTERNAL input and they are RECALLED, UNVERIFIED.
      Conjunct (B) rests on them entirely. If they are wrong, (B) falls and
      (A), (C) and (D) survive, because the anchors are in-repo integers.
    - >-
      NO NEW DEFECT IS SOUGHT OR ALLEGED in any implementation. Should any stage
      observe a conformance deficiency in unmodified upstream code, it is
      escalated to the coordinator immediately and published by no agent, per
      RQ-MLKEM-002's constraints; this is a stopping rule of the paired
      experiment, not advice.

  proof_search_map:
    bottleneck: >-
      The step at which a search predicate for the "defect-mechanism
      neighborhood" is chosen. GOAL-MLKEM-002's entire second-implementation
      question, its four batches, its second_impl_unavailable disposition and
      its closure all sit downstream of one phrase -- "fixed-bound hand-written
      vector comparison tails" -- whose relationship to the mechanism it was
      abstracted from has never been checked. Repairing or condemning that one
      step is upstream of any future work on this question and consumes none of
      the closed goal's budget.
    baseline_embedding:
      parameter_slice: >-
        The two archived pre-fix wolfSSL arms and the two archived post-fix arms
        at all three parameter sets: twelve committed cells in total, four
        profiles, all in EV-MLKEM-005, all recomputed by an independent
        validator. This is the exact slice on which the previous best account of
        the phenomenon -- "wolfSSL v5.9.1 has an incomplete comparison, fixed in
        v5.9.2" -- is stated.
      reproduction_check: >-
        EXACT INTEGER IDENTITY, not resemblance. Each class must return the
        committed cardinality at each of the three lengths with residual
        EXACTLY 0, with its parameter fixed from a source fact rather than
        fitted to the cardinality. This check was performed once while drafting
        (A1, A2, A3, A4 all pass) and is repeated under a frozen, hashed script
        in stage S1 so the numbers carry a receipt. A class that reproduces two
        of three cells is a failure, not a partial success.
    observation_collision:
      observable: >-
        Primary: the cardinality profile (|S(768)|, |S(1088)|, |S(1568)|).
        Secondary: the shape triple (is_suffix, minimal period, residue set).
      distinct_preimage_search: >-
        A COLLISION EXISTS, IS DERIVED, AND IS THE CENTRAL CONTENT. On the
        primary observable the fibre over (0, 0, 32) contains at least
        C-BND(1536) and C-COV(64), and these agree not only in cardinality but
        in the index set {1536..1567}, so no refinement of the silent set at
        the standardized lengths separates them. A second collision: C-COV(128)
        and C-COV(256) both give (0, 64, 32). Both are direct falsifiers of
        identifiability for the primary observable, and neither is separated by
        any additional condition available at FIPS 203 parameter sets. THE
        SEPARATING CONDITIONS ARE OUTSIDE THE OBSERVABLE: for the first
        collision, the load stride read from the assembly, or a measurement at a
        non-standard length such as L = 1600 where C-BND(1536) gives 64 and
        C-COV(64) gives 0. On the secondary observable the collision is PARTIAL:
        is_suffix and period separate C-RED from {C-BND, C-COV} at a single
        parameter set, and separate nothing inside {C-BND, C-COV}. Reporting
        which collisions the observable does and does not resolve is the audit's
        output.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (silent-set profile) fixed at (0, 0, 32) and vary
          the forgotten structure (the accumulate loop). Two members are
          exhibited: a 32-strided body stopping one block early, and a
          64-strided body dropping an odd half-block. The intrinsic invariant
          proposed to distinguish them is the load stride, which is not a
          function of the observable at any FIPS 203 length.
        predicted_gain: >-
          None to any attacker. The gain is a named identifiability failure in
          the goal's founding measurement, plus the concrete separating
          experiment (L = 1600, or read the file) that resolves it for minutes
          of work.
      - transform: stronger_compositional_invariant
        proposed_object: >-
          Preserve more state than the goal's gate required: carry the silent
          INDEX SET and its periodic structure rather than the boolean
          "silent indices present" and the cardinality. The stronger state is
          what survives the composition across parameter sets and across
          backends, and it is what separates the reduce-stage class from the
          accumulate-stage classes.
        predicted_gain: >-
          Converts a predicate that returned an empty population into one that
          returns a population of at least two on the same evidence base,
          restoring reachability of both outcome worlds for the isolation-
          versus-systemic question.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER. EXISTS one frozen table of closed forms (conjunct
      A, parameters fixed from source facts before any comparison) FORALL
      archived arms and FORALL three parameter sets, such that the predicted
      cardinality equals the committed cardinality exactly. The witness -- the
      closed form and its parameter -- may NOT be chosen per parameter set. The
      weaker order, FORALL arms EXISTS a closed form, is trivially satisfiable
      by three unrelated formulas and is explicitly NOT claimed and NOT
      admissible.
      SEPARATELY, AND THIS IS THE QUANTIFIER TRAP THE AUDIT IS HUNTING IN THE
      GOAL'S OWN CRITERION. GOAL-MLKEM-002 completion criterion 2 reads: the
      isolation question "is asked of at least one second implementation whose
      comparison routine uses fixed-bound hand-written vector comparison tails,
      OR an explicit infrastructure unavailability is recorded after exhausting
      the preference order." Written with quantifiers: EXISTS a predicate P
      (chosen by the same session), EXISTS a disposition d, such that d is
      recorded. The research question RQ-MLKEM-002 asks something else: FORALL
      implementations in the defect-mechanism neighborhood, is the defect
      present. The criterion's disjunctive second branch is satisfiable by a
      witness (the emptiness of P's preimage) that is allowed to depend on P,
      and P was selected by the searching session. The consequence is
      quantitative and is stated as a prediction below: when the strict
      neighborhood is empty, the recorded class second_impl_unavailable is
      reachable with probability 1 from BOTH ground-truth worlds, so its mutual
      information with the isolation question is exactly 0 bits. This is a
      statement about what the criterion licenses, NOT a claim that the goal
      violated it -- the goal satisfied its criterion as written, and the
      evidence records already forbid over-reading it ("do not paraphrase
      EV-MLKEM-008/009/010 as H-MLKEM-004 support"). Making the zero-information
      property explicit and quantitative is the contribution.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: a scoped, laboratory-tier, single-byte-differential account of
        which mechanism classes are reachable at FIPS 203 ciphertext lengths as
        a function of vector stride and lane coverage, validated against four
        committed archived profiles and a planted-comparator battery on one
        toolchain. It CANNOT certify that any implementation is correct, cannot
        exclude multi-byte cancellations, cannot exclude timing or any physical
        channel, cannot bound any attack cost, cannot move any exponent, and
        cannot make any statement about MLWE hardness or passive ML-KEM
        security. It cannot certify that the three classes are exhaustive.
      nearby_object_control: >-
        THREE, all required. (i) THE POST-FIX ARMS at zero silent indices,
        coverage fraction 1.0, all three parameter sets, both seeds -- the
        closest object to the pre-fix arms, differing by one commit, where the
        hoped-for conclusion (a nonempty silent set) FAILS. Any model that
        produces a nonzero profile there is responding to the parameter set
        rather than to the defect. (ii) A PURELY SCALAR byte-at-a-time
        comparator, which has no lanes: the C-RED predicate must return "out of
        population", not "phi = 1". A predicate that scores a scalar loop as a
        passing member of the SIMD population has not identified the
        load-bearing structure. (iii) A NON-ML-KEM LENGTH, L = 1000, where 32
        does not divide L: the divisibility obstruction must NOT fire, the
        w <= 32 row must be nonzero, and if the table reports zeros there the
        obstruction is an artifact of the script rather than of the standard.
    proof_obligations:
      - claim: Each class reproduces its archived anchor profile with residual exactly 0 at all three lengths.
        responsibility: baseline
      - claim: L = 32*(du*k + dv) for every FIPS 203 parameter set, checked against the standard and not asserted.
        responsibility: correctness
      - claim: The reachability table has exactly 5 nonzero cells out of 27, listed explicitly.
        responsibility: correctness
      - claim: No C-BND or C-COV member reproduces (384, 544, 784).
        responsibility: strictness
      - claim: The parameter of each fitted class is fixed by a source fact recorded independently of the cardinality it must reproduce.
        responsibility: strictness
      - claim: Instrument adequacy is the GNU ld --wrap method admitted by EV-MLKEM-010, with wrap call counts attested, never the call-site INTERPOSE_COMPARE method refuted by EV-MLKEM-009.
        responsibility: interface
      - claim: Nothing here transfers to multi-byte, timing, or any cryptanalytic conclusion; the gap is stated on every citation.
        responsibility: scope
      - claim: A null census over a non-empty population is reported as a measured null, never as an isolation proof.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. There is NO complexity claim of any kind, no attack, no
    oracle, no cost estimate. RQ-MLKEM-002 forbids attack-cost estimation
    outright. This is a MEASUREMENT-AND-SEARCH-DESIGN repair of a defensive
    conformance instrument: it makes no system easier to solve, moves no
    exponent, and adds nothing to any adversary. sota_delta is zero on every
    attack axis (time, memory, data, queries, advice), and dominated_by is not
    applicable because no Pareto point is claimed.

  heuristic_assumptions:
    - id: HEUR-SIL-1
      formal_statement: >-
        FOR ALL routines of the accumulate/reduce/finalize shape and FOR ALL
        L in {768, 1088, 1568}, the single-byte silent set S(L) equals the
        closed form of exactly one of C-BND(N), C-COV(w), C-RED(phi) for some
        parameter, and that parameter is INVARIANT across L. Formally: EXISTS
        (class, parameter) FORALL L, S(L) = closed_form(class, parameter, L).
      random_model_justification: >-
        NONE, AND THAT IS RECORDED AS A WEAKNESS RATHER THAN PAPERED OVER. This
        is not a distributional claim and there is no random model for it. Its
        support is (i) the accumulate/reduce/finalize anatomy, which is
        structural, and (ii) a fit to four committed profiles with parameters
        fixed from independently recorded source facts. Four profiles is a small
        design and cannot distinguish a true taxonomy from a flexible one. The
        honest statement is that the classes were abstracted from the same data
        they are tested against, and the only genuinely out-of-sample tests are
        the planted-comparator battery and the non-standard length L = 1600.
      supporting_results: []
      validation_experiment_ids: [EXP-MLKEM-63f2f5]
      falsification_condition: >-
        MEASURED FIRST AND REPORTED BEFORE ANY MODEL SUCCESS. If any planted
        comparator's measured silent set differs from its forced closed form at
        any of the three lengths, HEUR-SIL-1 is refuted at that class and the
        class is rewritten by a new record. If two classes fit the same planted
        comparator, the taxonomy is not a partition and must be reported as an
        overlapping cover.
    - id: HEUR-SIL-2
      formal_statement: >-
        FOR ALL FIPS 203 parameter sets, L = 32*(du*k + dv), hence 32 | L.
      random_model_justification: >-
        Not a distributional claim. It is an arithmetic consequence of
        ByteEncode packing 256 coefficients at d bits into 32*d bytes. It is
        listed as a heuristic assumption solely because of PROVENANCE: the
        encoding rule is RECALLED, UNVERIFIED here. In-repo corroboration is
        indirect but real -- the three lengths it implies are the only lengths
        consistent with EV-MLKEM-005's measured cardinalities 384 / 544 / 784
        and its silent set {1536..1567}.
      supporting_results: []
      validation_experiment_ids: [EXP-MLKEM-63f2f5]
      falsification_condition: >-
        Any ML-KEM ciphertext length read from FIPS 203 that is not a multiple
        of 32. Conjunct (B) then falls entirely and the reachability table is
        void; conjuncts (A), (C) and (D) survive because their anchors are
        in-repo integers. Cost of being wrong: zero compute, one document read.
    - id: HEUR-SIL-3
      formal_statement: >-
        The single-byte differential probe measures the silent set of the
        LIBRARY routine actually invoked, not of a probe-local proxy.
      random_model_justification: >-
        This program has already been wrong about exactly this once. EV-MLKEM-009
        records that the call-site INTERPOSE_COMPARE construction was a
        probe-local multiplicity gate implemented inside the probe binary, with
        attributable_via_library_call_path hard-coded true in the scorer
        (OBJ-RT006-001/002). EV-MLKEM-010 records the repair: GNU ld
        -Wl,--wrap=mlkem_cmp{,_avx2,_neon} under Binutils ld 2.40 on Docker
        linux/amd64, with wrap_call_counts mlkem_cmp_avx2 = 4 on the wrapped
        AVX2 probe. The assumption is therefore supported ONLY under the wrap
        method and ONLY on linux/amd64; NEON and Darwin-native wrap are recorded
        as not demonstrated.
      supporting_results: []
      validation_experiment_ids: [EXP-MLKEM-63f2f5]
      falsification_condition: >-
        Wrap-attest call counts of zero for the symbol under test on any arm
        that carries a conclusion. That arm is then a probe-local measurement,
        is reported as such, and contributes nothing -- exactly the disposition
        EV-MLKEM-009 reached. Attempting to rescue it by re-labelling is
        forbidden.

  structural_ingredients:
    - description: >-
        The accumulate/reduce/finalize anatomy of SIMD constant-time equality
        comparison, used to decompose the defect space into stage-indexed
        classes.
      citation: >-
        Derived in-repo from the PQClean ML-KEM-1024 AVX2 verify body quoted
        verbatim in experiments/EXP-MLKEM-009/analysis/
        second_implementation_selection.md (READ). No external citation is
        asserted.
      role: supplies the class decomposition C-BND / C-COV / C-RED / C-FIN
    - description: >-
        ByteEncode packing identity, 32*d bytes per 256-coefficient polynomial,
        giving L = 32*(du*k + dv).
      citation: >-
        FIPS 203. NOT READ -- RECALLED, UNVERIFIED. Checking it is a stage of
        EXP-MLKEM-63f2f5 and until then every dependent sentence carries the
        label.
      role: supplies the divisibility obstruction of conjunct (B)
    - description: >-
        GNU ld --wrap library-path interposition as an admitted instrument-
        adequacy control on linux/amd64.
      citation: >-
        ledger/evidence/EV-MLKEM-010.yaml (READ), with its own boundaries:
        admitted only for GNU ld --wrap on linux/amd64 Docker; NEON and
        Darwin-native wrap not demonstrated.
      role: the only admissible instrument for any arm that carries a conclusion
    - description: >-
        Archived per-arm silent-set cardinalities and index sets for pre- and
        post-fix wolfSSL on two backends at three parameter sets.
      citation: ledger/evidence/EV-MLKEM-005.yaml (READ IN FULL)
      role: the four anchors that every closed form must reproduce exactly

  reduction_chain:
    core_problem: >-
      Determine which implementation-defect mechanism classes are REACHABLE at
      FIPS 203 ciphertext lengths as a function of vector stride and lane
      coverage, and hence what an empty-neighborhood verdict for a
      coverage-shaped search predicate does and does not establish about the
      ecosystem.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. There is no reduction from this object to any
      statement about MLWE hardness, ML-KEM passive security, attack cost, or
      any cryptanalytic quantity, and none is claimed. RQ-MLKEM-002's
      constraints forbid attack-cost estimation and any exploitation path.
      GOAL-MLKEM-002 is completed and no status change is sought here; this
      hypothesis addresses only what its verdict scopes.

  predictions:
    - metric: >-
        G1 -- anchor reproduction, four profiles: max over the twelve committed
        cells of |forced |S|  -  archived |S||
      direction: lower
      minimum_effect: >-
        EXACTLY 0. Not a tolerance and not a percentage: A1 and A2 must give
        (0, 0, 32), A3 must give (384, 544, 784), A4 must give (0, 0, 0). A
        single nonzero residual falsifies the class that produced it.
    - metric: >-
        G2 -- collision multiplicity on the primary observable: number of
        members of {C-BND(N)} union {C-COV(w) : w in {8,...,512}} whose profile
        equals (0, 0, 32)
      direction: higher
      minimum_effect: >-
        EXACTLY 2 over that enumeration, namely C-BND(1536) and C-COV(64),
        predicted before the enumeration is scripted. 1 falsifies conjunct (C);
        more than 2 means the enumeration missed a member and the record is
        corrected upward.
    - metric: >-
        G3 -- reachability table: number of nonzero cells of L mod w over
        w in {1,2,4,8,16,32,64,128,256} and L in {768, 1088, 1568}
      direction: different
      minimum_effect: >-
        EXACTLY 5 of 27, at (64, 1568) = 32, (128, 1088) = 64, (128, 1568) = 32,
        (256, 1088) = 64, (256, 1568) = 32, and EXACTLY 0 in all 18 cells with
        w <= 32. Any other count is an arithmetic error.
    - metric: >-
        G4 -- cross-class exclusion: number of C-BND or C-COV members
        reproducing the NEON profile (384, 544, 784)
      direction: lower
      minimum_effect: >-
        EXACTLY 0. If any is found, the shape claim of conjunct (C) is false and
        the taxonomy is not separated by the observable.
    - metric: >-
        G5 -- shape discrimination at ONE parameter set: whether
        (is_suffix, minimal period) separates the archived AVX2 arm from the
        archived NEON arm at ML-KEM-1024
      direction: different
      minimum_effect: >-
        MUST SEPARATE: AVX2 is_suffix true, period undefined; NEON is_suffix
        false, period 64. If it does not, the finer projection carries no
        information beyond cardinality and conjunct (C)'s secondary observable
        is worthless.
    - metric: >-
        G6 -- planted-comparator battery, out-of-sample: max over all arms of
        |measured |S| - forced |S||, over strides w in {16, 32, 64, 128}, bound
        literals N in {L, 1536, L-1}, and lane fractions phi in
        {1, 7/8, 3/4, 1/2, 1/4}, at all three lengths
      direction: lower
      minimum_effect: >-
        EXACTLY 0 at every arm. This is the only genuinely out-of-sample test of
        HEUR-SIL-1 and it is the one that can fail honestly, because none of
        these comparators existed when the classes were written.
    - metric: >-
        G7 -- separating measurement at a non-standard length: |S(1600)| for the
        two colliding AVX2 candidates, measured on planted comparators
      direction: different
      minimum_effect: >-
        C-BND(1536) must give EXACTLY 64 and C-COV(64) must give EXACTLY 0 at
        L = 1600. Equal values falsify the claim that the collision is a
        property of the standardized lengths rather than of the model.
    - metric: >-
        G8 -- population contrast: size of the strict coverage-predicate
        population versus size of the lane-coverage-predicate population, over
        the same set of implementations named in committed records
      direction: higher
      minimum_effect: >-
        0 versus at least 2, derived from records alone before any fetch: the
        strict order is recorded as
        empty_preferred_public_neighborhood, while wolfSSL (two backends) and
        PQClean avx2 all reduce a SIMD accumulator. A lane-coverage population
        below 2 means the predicate was misdefined.
    - metric: >-
        G9 -- outcome-class information: mutual information in bits between the
        recorded package class and the isolation-versus-systemic ground truth,
        under the goal's frozen precedence, conditional on the strict
        neighborhood being empty
      direction: lower
      minimum_effect: >-
        EXACTLY 0 bits, derived rather than measured: when the strict
        neighborhood is empty the class second_impl_unavailable is emitted with
        probability 1 in both ground-truth worlds, so the channel is constant.
        This is a statement about what the criterion licenses and NOT a claim
        that the criterion was violated -- it was satisfied as written, and the
        evidence records already forbid over-reading it. If a world exists in
        which the empty neighborhood yields a different class, the derivation is
        wrong and the value exceeds 0.

  test_boundary:
    instances:
      - >-
        Archived committed cells only, for conjuncts (A) and (C): EV-MLKEM-005's
        pre-fix and post-fix AVX2 and NEON arms at ML-KEM-512, -768, -1024.
        No re-measurement of wolfSSL is required for these.
      - >-
        Planted comparators written for this contract, compiled on the session
        toolchain, linked via GNU ld --wrap into a probe binary, for the
        out-of-sample battery G6 and the separating measurement G7.
      - >-
        Lengths L in {768, 1088, 1568} for every ML-KEM cell, plus the
        non-ML-KEM control lengths L in {1000, 1600} used only for the null and
        separating checks.
      - >-
        Optionally and last, a source census of publicly fetchable ML-KEM
        comparison routines. Bounded by fetch budget; its result is always a
        FLOOR over what was fetched and never an inventory of what exists.
    parameters:
      ciphertext_lengths: [768, 1088, 1568]
      control_lengths: [1000, 1600]
      strides: [1, 2, 4, 8, 16, 32, 64, 128, 256]
      planted_strides: [16, 32, 64, 128]
      planted_bound_literals: ["L", 1536, "L-1"]
      planted_lane_fractions: [1, 0.875, 0.75, 0.5, 0.25]
      mutation_deltas: "all 255 nonzero single-byte values at each index"
      classes: [C-BND, C-COV, C-RED, C-FIN_recorded_not_pursued]
      instrument: gnu_ld_Wl_wrap
      backends_with_admitted_wrap: [linux_amd64]
    implementation: >-
      Pure-Python integer arithmetic for the forced tables; C for the planted
      comparators, compiled with the session's gcc and linked with the session's
      GNU ld under -Wl,--wrap; a Python driver for the single-byte differential
      sweep. Environment as measured in this session: gcc present at
      /usr/bin/gcc, Python 3.11.15, numpy 2.4.6 importable. NO SAGE, NO SOLVER,
      NO NETWORK-DEPENDENT STAGE is required for S1 through S4; the census stage
      S5 requires network and is the only stage that may be blocked by it.
    budget:
      stage_s1_wall_clock_seconds: 600
      stage_s1_compute: "zero measurement; closed-form integer arithmetic only"
      stage_s2_wall_clock_seconds: 1800
      stage_s3_wall_clock_seconds: 1800
      stage_s4_wall_clock_seconds: 3600
      stage_s5_wall_clock_seconds: 7200
      maximum_memory_gb: 2
      note: >-
        No stage is authorized by this record. GOAL-MLKEM-002 is completed with
        a standing instruction not to reopen experimental batches under
        maximum_batches = 4 without an explicit campaign-budget amendment and a
        new or successor goal. Nothing here overrides that: execution requires a
        separate Coordinator approval under a successor goal, and stages S1-S3
        are designed to be worth running even if S4 and S5 never are.

  falsification_conditions:
    - >-
      F1 (ZERO COMPUTE, PRIMARY) -- any anchor residual in G1 is nonzero. The
      mechanism model does not describe the founding measurements of this entire
      research line and nothing may be built on it. Cost of being wrong: minutes.
    - >-
      F2 (ZERO COMPUTE) -- collision multiplicity is 1. There is no
      identifiability problem, the goal's strict predicate was in the only
      available vocabulary, and conjunct (C) is withdrawn.
    - >-
      F3 (ZERO COMPUTE) -- any ML-KEM ciphertext length is not a multiple of 32,
      or the reachability table has other than 5 nonzero cells. Conjunct (B)
      falls; (A), (C), (D) survive on in-repo anchors.
    - >-
      F4 -- some C-BND or C-COV member reproduces (384, 544, 784), or shape
      fails to separate the two archived arms. The taxonomy is not separated by
      the observable and conjunct (C) is false.
    - >-
      F5 -- any planted comparator's measured silent set differs from its forced
      value (G6), or the phi = 1/2 positive control fails to reproduce
      384/544/784. INSTRUMENT FAILURE: no negative result and no census result
      may be reported from that instrument at all.
    - >-
      F6 -- wrap-attest call counts are zero for the symbol under test on any
      arm that carries a conclusion. That arm is probe-local, is reported as
      such, and contributes nothing. This is the exact disposition EV-MLKEM-009
      reached and it may not be re-labelled.
    - >-
      F7 -- the C-RED predicate scores a purely scalar comparator as an
      in-population pass. The population is misdefined and must be restated
      before any census.
    - >-
      F8 (NOT A FALSIFICATION, PRE-REGISTERED HERE BEFORE ANY STAGE RUNS) -- if
      the archived NEON index-level pattern recomputed in S3 gives 768 rather
      than 784, the honest first reading is that EV-MLKEM-005's prose pattern
      and its cardinality are in tension inside one record, NOT that C-RED
      failed. Both readings are recorded and neither is selected after seeing the
      result.
    - >-
      F9 (THE PLANNED NEGATIVE, A DELIVERABLE) -- if conjuncts fail and the
      batch does NOT emit a statement of which mechanism classes are reachable
      at which (stride, parameter set) cells, with its exact boundary and a
      named successor population, it HAS NOT FINISHED. A count of screened and
      rejected classes is a fatigue report, not a closure.

  interpretation_limits:
    - >-
      CLAIM TIER toy / laboratory, and it may not be raised by any downstream
      citation. Laboratory implementation-conformance evidence is never
      crypto-scale evidence and never an MLWE statement (AGENTS.md rule 7,
      RQ-MLKEM-002 constraints).
    - >-
      NOT AN ATTACK, ORACLE, EXPLOITATION PATH, DISCLOSURE, OR ATTACK-COST
      ESTIMATE. No new implementation defect is alleged. Any deficiency observed
      in unmodified upstream code is escalated to the coordinator and published
      by no agent.
    - >-
      NO STATUS CHANGE is proposed for GOAL-MLKEM-002, DEC-20260730-005/006,
      DEC-20260731-001, EV-MLKEM-005 through EV-MLKEM-010, or H-MLKEM-002
      through H-MLKEM-009. GOAL-MLKEM-002 met its declared completion criteria
      and its closure stands. Nothing here is offered as H-MLKEM-004 support and
      EV-MLKEM-008/009/010 are not paraphrased.
    - >-
      INSTRUMENT AND SEARCH-DESIGN FINDING, NOT A MECHANISM FINDING ABOUT ANY
      LIBRARY. Conjuncts (A)-(D) are about what a predicate and an observable
      can and cannot distinguish. They do not establish that any implementation
      is correct or incorrect.
    - >-
      A SUCCESSFUL RESULT AUTHORIZES ONE THING: a successor goal with a
      lane-coverage or stride-based population predicate. It does not authorize
      reopening GOAL-MLKEM-002's batches, and the goal record explicitly forbids
      that without a campaign-budget amendment.
    - >-
      SINGLE-BYTE ONLY. Everything here is stated for single-byte differential
      probing. Multi-byte cancellations, alignment classes, malformed lengths,
      and every physical channel are outside and are neither tested nor
      excluded.

