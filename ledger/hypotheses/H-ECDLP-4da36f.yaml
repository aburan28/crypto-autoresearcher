# =============================================================================
# H-ECDLP-4da36f -- SNFS-G3 specified: generalized Mersenne (Solinas) primes
# p = f(2^k) with low-weight f give number fields K_f = Q[t]/(f) of small
# root discriminant with a degree-one prime of norm p (the SNFS field for
# F_p^*); the hypothesis is that E(K_f) inherits nothing from the small root
# discriminant: rank gain, new-point heights and residue coverage match a
# random f of the same degree and weight, and coverage is uncorrelated with
# the root discriminant. Generalizes SNFS-F1 from f = t^d - c to arbitrary
# low-weight f. Derived from IDEA-20261009-b6d31b (addendum G). Status
# proposed with specified_by; nothing here asserts an outcome. Toy primes.
# =============================================================================
hypothesis:
  id: H-ECDLP-4da36f
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  derived_from_idea: IDEA-20261009-b6d31b
  added: '2026-10-09'
  statement: >-
    Let f be a monic low-weight polynomial with coefficients in {-1, 0, 1}
    and p = f(2^k) prime, and let K_f = Q[t]/(f) with the degree-one prime
    P_1 = (t - 2^k, p). For seeded random curves E/Q with good reduction at
    p, lifted to K_f: (i) rank E(K_f) - rank E(Q), (ii) the minimal canonical
    height of a point of E(K_f) not in E(Q) divided by log p, and (iii) the
    number of distinct residues of E(F_p) hit by K_f-points whose coordinates
    have coefficient vector in a box of side X (coverage exponent gamma =
    dlog(D)/dlog(X^deg f)) all match the same quantities over K_g for random
    monic g of the same degree and weight within sampling error, and gamma is
    uncorrelated with the root discriminant of K_f across all fields. Alive
    only if gamma on a Solinas f exceeds the random-g null by > 0.2 across
    >= 3 primes with descent bounds tight.
  mechanism: >-
    Small root discriminant means many algebraic integers of small height,
    the resource a lift would want, and the NIST shapes (t^3 - t - 1 at 2^64
    for P-192; t^7 - t^3 + 1 at 2^32 for P-224; t^8 - t^7 + t^6 + t^3 - 1 at
    2^32 for P-256; t^12 - t^4 + t^3 + t - 1 at 2^32 for P-384) have
    unusually small discriminants for their degree. But the Mordell-Weil
    group of E over K_f depends on f only through the arithmetic of E over
    K_f (rank, regulator), and Lang-type bounds keep nontorsion heights
    >= c log p regardless of how many small algebraic integers K_f has; the
    covering exponent of bounded-box points is then governed by rank and
    height, not by the root discriminant (H-ECDLP-bd1572 HEUR-003 for
    f = t^d - c). The record asks whether the f-shape dependence is anything
    beyond degree and discriminant size.
  assumptions:
    - "Toy primes f(2^k) at k in 4..12 with the NIST f shapes model the deployed shapes for rank and height statistics (not for absolute cost)."
    - "Random g of the same degree and weight is the right null; it is matched on degree and weight, not on discriminant, and the regression of gamma on root discriminant separates the two."
    - "Descent over degree <= 12 fields is feasible at toy conductor in PARI/GP or Magma; a cell where only a rank bound is obtained is reported as inconclusive for the rank arm, never imputed."
  proof_search_map:
    bottleneck: >-
      whether the resource small root discriminant buys (many small
      algebraic integers) reaches E(K_f) as points of small height; Lang's
      bound says no.
    baseline_embedding:
      parameter_slice: >-
        f = t^d - c is EXP-ECDLP-3e8403's K_d = Q(c^{1/d}) arm; d = 1 is
        the Q-lift.
      reproduction_check: >-
        the t^d - c cells must reproduce EXP-ECDLP-3e8403's covering numbers
        on shared curves and boxes.
    observation_collision:
      observable: gamma and rank gain as functions of f
      distinct_preimage_search: >-
        random g of the same degree and weight, same curves, same boxes; a
        gain present there is a degree effect.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: E over the Solinas field K_f with the degree-one prime (t - 2^k, p)
        predicted_gain: none predicted; gamma and rank gain at the random-g value
    quantifier_order: >-
      For all tested f (NIST shapes and random g), primes and curves, gamma
      and rank gain are within sampling error of the random-g null and gamma
      is uncorrelated with the root discriminant; there exists no f with a
      gamma excess > 0.2 across >= 3 primes.
    method_ceiling:
      strongest_certifiable_claim: >-
        a rank, height and coverage table over four f shapes and random
        controls at toy primes, plus one regression; no asymptotic statement.
      nearby_object_control: random g of the same degree and weight; Q itself (d = 1)
    proof_obligations:
      - claim: residues at P_1 computed by exact reduction t -> 2^k mod p
        responsibility: correctness
      - claim: boxes and enumeration work identical on both arms
        responsibility: baseline
      - claim: rank reported as exact or as a bound, never mixed
        responsibility: strictness
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        For E/Q with good reduction at p = f(2^k) and K_f = Q[t]/(f), the
        number of K_f-points with coordinate coefficient vectors in a box of
        side X grows like (deg f * log X)^{r_f/2} with r_f = rank E(K_f)
        distributed as over a random field of the same degree and
        discriminant size, so gamma -> 0 and is independent of the root
        discriminant of K_f.
      random_model_justification: >-
        Points of bounded Neron-Tate height number c T^{r/2}; a box of
        coefficient size X has height about deg f * log X; nontorsion
        heights are bounded below by c log p (Lang, recalled; Hindry-Silverman
        under Szpiro); none of these quantities sees the root discriminant
        beyond the discriminant's size (KN-TECH-060).
      supporting_results:
        - KN-LIT-021 (xedni fails asymptotically; absolute coefficient bound)
        - H-ECDLP-bd1572 HEUR-003 and EXP-ECDLP-3e8403 (f = t^d - c case)
      validation_experiment_ids: [EXP-ECDLP-4c6a09]
      falsification_condition: >-
        gamma on a Solinas f exceeding the random-g null by > 0.2 across >= 3
        primes with descent bounds tight, or a significant (p < 0.01)
        negative correlation between gamma and root discriminant across all
        fields with the d = 1 control at its EXP-ECDLP-3e8403 value.
  structural_ingredients:
    - description: Analysis of the xedni calculus; lifted points have large height.
      citation: KN-LIT-021
      provenance: kb
      verified_by: knowledge/literature/KN-LIT-021.md
      role: the Q-side negative this record extends to Solinas fields
    - description: Neron-Tate canonical heights; passing from E(F_q) to a lift is a lossy choice.
      citation: KN-TECH-060
      provenance: internal
      verified_by: knowledge/techniques/KN-TECH-060.md
      role: height formalism
    - description: Lifting-obstruction taxonomy (face F4b).
      citation: KN-TECH-06bb4e
      provenance: internal
      verified_by: knowledge/techniques/KN-TECH-06bb4e.md
      role: the cell this hypothesis occupies
    - description: Mordell-Weil over number fields, reduction at a degree-one prime (textbook).
      citation: KN-LIT-7621
      provenance: kb
      verified_by: knowledge/literature/KN-LIT-7621.md
      role: reduction and height background
    - description: Generalized Mersenne primes and the NIST shapes.
      citation: Solinas 1999, Generalized Mersenne numbers (CORR 99-39)
      provenance: recalled
      verified_by: null
      role: pointer for the f shapes; the shapes themselves are public constants verified by primality of f(2^k) in the runner
    - description: Lifting ECDLP to number fields does not remove the rank/height obstruction.
      citation: Huang, Kueh, Tan, Lifting elliptic curves and solving the elliptic curve discrete logarithm problem (ANTS 2000)
      provenance: recalled
      verified_by: null
      role: pointer, never support
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: rank_gain_solinas_minus_random_g_mean
      direction: different
      minimum_effect: within sampling error of 0 per degree
    - metric: min_new_point_height_over_log_p_solinas_minus_random_g
      direction: different
      minimum_effect: within sampling error of 0
    - metric: coverage_exponent_gamma_solinas_minus_random_g
      direction: different
      minimum_effect: "|difference| <= 0.2 at every f"
    - metric: correlation_gamma_vs_log_root_discriminant
      direction: different
      minimum_effect: 99 % interval contains 0
  test_boundary:
    instances:
      - "the four NIST f shapes at k in 4..12 where f(2^k) is prime (toy), plus 20 random monic g per degree with coefficients in {-1, 0, 1}"
      - "5 seeded random curves E/Q per prime with good reduction at p; Q (d = 1) and f = t^d - c (EXP-ECDLP-3e8403) as embedded baselines"
    parameters:
      claim_tier: toy
      box_ladder: "X in {2, 4, 8, 16, 32} on coefficient vectors in the power basis 1, t, ..., t^{deg f - 1}, denominators <= 4"
      rank_method: "2-descent (PARI/GP ellrank or Magma) where available; else bounded point search with rank as a lower bound"
    implementation: >-
      NOT IMPLEMENTED in the design session (no PARI/GP, Sage or Magma); the
      coverage arm alone is implementable in the Python standard library by
      the EXP-ECDLP-3e8403 box-ladder method generalized to arbitrary f
      (arithmetic in Z[t]/(f) with reduction t -> 2^k mod p), and is the
      recommended first cell; see EXP-ECDLP-4c6a09 launcher.
    budget:
      enforcement: advisory
      total_cpu_hours: 80
      maximum_memory_gb: 4
  falsification_conditions:
    - "HEUR-001 (alive condition): gamma on a Solinas f exceeds the random-g null by > 0.2 across >= 3 primes with descent bounds tight."
    - "HEUR-001: a significant negative correlation between gamma and root discriminant across all fields (p < 0.01) with the d = 1 control at its EXP-ECDLP-3e8403 value."
    - "A cell with a loose descent bound and no exhibited points is inconclusive for the rank arm, never negative."
  interpretation_limits:
    - Toy primes f(2^k) at small k only; no deployed curve is lifted and nothing is extrapolated.
    - "Small k compresses the discriminant contrast between f shapes; the regression, not the per-shape comparison, carries the root-discriminant question."
    - "A null result supports the hypothesis in the exact tested scope and closes nothing (AGENTS.md rules 5 and 6)."
    - No statement about any deployed parameter set is made or implied.
