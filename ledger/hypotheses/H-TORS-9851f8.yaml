  falsification_conditions:
    - >-
      A correctly implemented pairing returns a non-trivial value for ell different from N on a curve
      satisfying the stated hypotheses. Contradicts an elementary theorem; suspected implementation
      error; independent replication required before any other reading.
    - >-
      P is found NOT to lie in ell times E(F_p) on some instance with N and ell coprime. Same
      disposition.
    - The ell = N boundary control returns the trivial value everywhere. Instrument blind; run set INVALID.
    - The composite-order control fails to recover the scalar modulo ell. Instrument cannot see a real leak; nulls void.
    - The planted non-homomorphic functional does not vary over the swept k. Variation detector broken; nulls void.
  interpretation_limits:
    - >-
      This closes ONE sub-family of candidates - ell-primary homomorphic invariants with ell
      different from N. It says nothing about non-homomorphic torsion functionals, which is where the
      lane's remaining live question sits.
    - >-
      It is not a hardness result and not a lower bound. It removes a class of would-be attacks by
      showing they carry no information, which constrains attackers and defenders symmetrically and
      changes no security estimate.
    - >-
      Scoped to prime-field ordinary curves with a prime-order base point. Nothing transfers to
      supersingular curves over F_{p^2}, to composite-order base points, or to ell = N.
    - >-
      The experiment cannot establish the theorem. It can only exhibit the value on the sampled
      instances and show that the instrument would have seen a different value had one existed. The
      universal statement is carried by the archived derivation note and cited as such.
    - >-
      "Constant over k" is measured over an explicit swept set of at least 32 scalars per instance.
      That is a bounded statement about that set; the unbounded statement comes from the derivation.
