hypothesis:
  id: H-TORS-9851f8
  question_id: RQ-TORS-8c7b79
  derived_from_idea: IDEA-20260807-6eab6a
  added: '2026-08-25'
  statement: >-
    Let E be an ordinary elliptic curve over a prime field F_p with p greater than 3, let N be a
    prime exactly dividing the group order, let G be the subgroup of order N generated by P, and let
    Q = [k]P. Let ell be any prime different from N, let M be any abelian group whose exponent
    divides a power of ell, and let f be any group homomorphism from E(F_p) to M. THEN f vanishes
    identically on G, so f(P) = f(Q) = 0 on every instance and for every k, and the map from k to
    the pair (f(P), f(Q)) is CONSTANT and therefore carries exactly zero bits about k.
    FOUR NAMED CONSEQUENCES, each closing a candidate this lane was opened to evaluate. C1 - the
    image of P and of Q in E(F_p) modulo ell times E(F_p) is the zero class on every instance, so
    "the position of P modulo ell E(F_p)" is constant. C2 - the ell-descent and Kummer images of P
    and Q are trivial, since the descent map factors through a quotient of exponent dividing a power
    of ell. C3 - the Weil pairing of P against any ell-torsion point, and the reduced Tate pairing of
    P against any point of E(F_p) of order ell, are identically 1, because the pairing value's order
    divides both N and ell. C4 - the multiset of fields of definition of the ell-power division
    points of P equals the multiset of fields of definition of E's own ell-power torsion, so that
    statistic depends on E alone and not on k.
    THE BOUNDARY IS THE FORWARD GUIDANCE AND IS PART OF THE CLAIM - the argument uses only that N and
    ell are coprime, and it is void at ell = N, which is exactly where the recorded literature places
    both the pairing transfers and, in the coincidence ell = N = p, the anomalous-curve total break.
    The hypothesis therefore asserts a closure whose complement is named rather than a general
    impossibility.
  mechanism: >-
    For R in G the order of f(R) divides the order of R, which is N, and also divides the exponent of
    M, which is a power of ell. Since N and that power of ell are coprime, the order of f(R) is 1 and
    f(R) = 0. The four consequences follow by exhibiting each candidate invariant as such a
    homomorphism into such a group. C1 uses that multiplication by ell is an automorphism of G, so G
    is contained in ell times E(F_p) and in every higher power. C2 uses that the ell-descent map
    factors through that quotient. C3 uses bilinearity twice - the pairing value raised to N is
    trivial because N kills P, and raised to ell is trivial because ell kills the second argument, so
    its order divides the greatest common divisor of N and ell, which is 1. C4 uses C1 to produce an
    ell-power division point of P inside E(F_p) itself, after which every other division point
    differs from it by an ell-power torsion point and contributes the same field.
    THE ARGUMENT IS ELEMENTARY AND UNCONDITIONAL. It needs no heuristic, no experiment and no scale
    qualification. What DOES need an experiment is the instrument that the sibling records use to
    compute these quantities, and the experiment attached to this hypothesis tests the instrument
    against known answers - including, crucially, a known NON-trivial answer at ell = N, without
    which an instrument that returns the trivial value unconditionally would look like a
    confirmation.
  assumptions:
    - >-
      E is an ordinary elliptic curve over F_p with p greater than 3, the group order factors as h
      times N with N prime and exactly dividing it, and P has order exactly N. This is the program's
      target family and is enforced by the instance generator rather than assumed.
    - >-
      ell is a prime different from N. The theorem places no other restriction - it holds for ell
      equal to p, for ell dividing the cofactor h, and for ell coprime to the whole group order
      alike.
    - >-
      "Publicly computable" means computable from the instance data without solving a discrete
      logarithm. All four consequences concern quantities that are publicly computable in this sense;
      the claim is about their VALUE, not their computability.
    - >-
      The Weil and Tate pairings are used with their standard definitions and normalisations, quoted
      rather than re-derived. The reduced Tate pairing requires the embedding degree to be COMPUTED
      rather than assumed, and an unreduced Tate pairing is defined only up to N-th powers and would
      make every comparison meaningless.
  test_boundary:
    instances: >-
      Toy ordinary prime-field curves at roughly 16, 20 and 24 field bits, restricted to those whose
      cofactor has a small prime factor so that the ell-torsion of E(F_p) is non-empty; plus one
      fixture with small embedding degree for the ell = N boundary control; plus, on the same curves,
      a composite-order base point of order h times N for the Pohlig-Hellman control.
    parameters: >-
      ell in {3, 5, 7, 11, 13} subject to ell dividing the group order and ell different from N;
      5 seeds per field size; a swept set of at least 32 distinct scalars k per instance, so that
      "constant in k" is a measured statement over an explicit set rather than an assertion.
    implementation: >-
      Pairing and division-point computations through the shared instrument this lane builds, with
      x(P - R) style operations taken through the same code path as their unshifted counterparts;
      every claimed division point emitted as a certificate that the run wrapper re-verifies by
      multiplying by ell.
    out_of_scope: >-
      ell = N (except as the boundary control), composite-order base points (except as the
      Pohlig-Hellman control), extension fields, supersingular curves over F_{p^2}, non-homomorphic
      functionals, and any statement about the cost of the ECDLP.
  distinguishable_outcomes:
    - outcome: >-
        The ell = N boundary control returns a NON-TRIVIAL pairing on at least one fixture; the
        composite-order control recovers the scalar modulo ell and matches ground truth; the planted
        non-homomorphic functional VARIES over the swept k; and every ell different from N cell
        returns the trivial value with its division-point certificate re-verifying.
      means: >-
        The instrument is calibrated in both directions and the four consequences are confirmed
        operationally over the swept k. The measured obstruction is that the number of distinct
        observable values over at least 32 scalars is exactly 1, on every ell different from N cell,
        which is the quantity a scoped closure of this candidate family would be measured as. The
        theorem itself is carried by the archived derivation note, not by these runs.
    - outcome: >-
        The ell = N boundary control returns the trivial value everywhere.
      means: >-
        THE INSTRUMENT IS BLIND. It cannot see a non-trivial pairing where one provably exists, so
        every trivial value it reported at ell different from N is uninterpretable. The run set is
        INVALID rather than confirmatory, and no closure may rest on it.
    - outcome: >-
        The composite-order control fails to recover the scalar modulo ell.
      means: >-
        The instrument cannot detect a leak that provably exists (this is Pohlig-Hellman), so its
        nulls are void. Invalid, not negative.
    - outcome: >-
        The planted non-homomorphic functional is also constant over the swept k.
      means: >-
        The instrument's variation detector is broken or the sweep is degenerate, and a null on the
        homomorphic family cannot be distinguished from an instrument-wide null. Invalid.
    - outcome: >-
        A cell with ell different from N, with the hypotheses verified per instance, returns a
        NON-TRIVIAL pairing or an ell-division-point certificate that fails re-verification.
      means: >-
        This contradicts an elementary theorem and is treated as a SUSPECTED IMPLEMENTATION ERROR
        first. It must be replicated by an independent implementation before being reported as
        anything else. If it survives independent replication, the derivation note - most likely its
        pairing normalisation or its division-point bookkeeping in C3 and C4 - is what is wrong, and
        the record is superseded rather than amended.
    - outcome: >-
        No small-embedding-degree fixture can be constructed at the executed field sizes.
      means: >-
        INFRASTRUCTURE OUTCOME under AGENTS.md rule 5. The boundary control is unavailable, the run
        is incomplete rather than negative, and it is re-dispatched at different sizes or with a
        constructed fixture that is labelled as constructed.
