  title: >-
    The order of 2 modulo 163 is 162.
  statement: >-
    The integer 163 is prime and leaves remainder 3 on division by 8.
    The powers 2^2, 2^6, 2^18, 2^54, 2^81 and 2^162 leave residues 4,
    64, 40, 104, 162 and 1 modulo 163. The residue 162 equals 163 minus
    1, so 2^81 is congruent to -1, and 2^162 is congruent to 1. None of
    4, 64, 40 and 104 is 1. The product of those four residues with 2,
    reduced modulo 163, is 162, and the exponents 54, 18, 6, 2 and 1
    sum to 81. The order is therefore 162. Since 162 equals 163 minus
    1, the cyclotomic factor has degree 162, and the stable dimensions
    are 0, 1, 162 and 163. The order of 2 modulo 131 is 130. The square
    17^2 is 289. The written ratio 7/2000 exceeds 1/289, and the
    cross difference is 23 on the common denominator 578000.
  mechanism: >-
    The proposal says the order of 2 modulo 163 is 162, so the only
    stable dimensions are the four listed above. This contract checks
    that order and the written ratio. It does not run a solver.
