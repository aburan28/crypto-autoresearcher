  interpretation_limits:
    - >-
      claim_tier toy for every measured number at 16-28 bits, except the
      256/384-bit norm-form smoothness sampling, which is a
      HEURISTIC-VALIDATION artifact per docs/target-result-profile.md Part D
      and carries its own sampling method and transfer assumptions. The
      algebraic derivations (the cost correction, the ceiling formula, the
      break-even inequality) are size-independent algebra and are labelled
      derivation, never proved.
    - >-
      Scoped to orbit-canonicalisation rho variants built from F_p-rational
      endomorphisms of ordinary, prime-order curves. Says nothing about
      isogeny transport between curves, index calculus, or any non-morphism
      selector mechanism.
    - >-
      The corrected cost is a LOWER bound on true evaluation cost, hence
      G_max is an UPPER bound on the lane; a faster evaluation strategy than
      Velu composition would raise the ceiling, which this hypothesis states
      as its own method ceiling rather than excludes.
    - >-
      No exponent moves in any outcome, including Reading 2. The best possible
      case is a constant-factor ceiling G_max, and no summary of this record
      may present it otherwise.
    - >-
      Per KN-OPEN-001 no prime-field ECDLP advantage over sqrt(p) is known,
      and per KN-OPEN-019 this program has no written ECDLP object
      enumeration; nothing in this hypothesis closes or opens either question.
    - >-
      Timeouts, crashes and infrastructure failures are never negative
      mathematical evidence (AGENTS.md rule 5).
