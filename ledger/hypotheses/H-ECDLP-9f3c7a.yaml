hypothesis:
  id: H-ECDLP-9f3c7a
  question_id: RQ-ECDLP-165d4b
  goal_id: GOAL-ECDLP-001
  derived_from_idea: IDEA-20260904-742c48
  added: '2026-09-08'
  status: proposed
  proposed_by: coordinator

  selection_rationale: >-
    Selected by the Coordinator on 2026-09-08 from 354 open ECC-area proposals
    (all areas in orchestration/research-priority.yaml are ECC per rule 11, so
    priority among them is decided by research judgment, not by area token).
    Candidates IDEA-20260829-882739 (special-j exit-boundary correction),
    IDEA-20260904-ab226c (class-level census cell), IDEA-20260904-cb1199
    (Galbraith transfer-exponent crossover) and this record were read in full
    before deciding. IDEA-20260829-882739 was rejected as the pick because its
    content is already substantially designed into the existing, unapproved
    contract EXP-ECDLP-6ecca1 (derived from the sibling proposal
    IDEA-20260812-c49409): that contract's Stage 4/5 (Arm S) already tests
    exactly the "does every odd ell != 3 leave the j=0 automorphism locus"
    question and already carries "an isogeny of odd degree ell > 3 whose
    codomain still has |Aut| = 6" as an explicit falsification criterion for
    its D2 claim. Designing a second contract for 882739 would duplicate
    EXP-ECDLP-6ecca1 rather than add a distinguishing test; the correct next
    Coordinator action for that lane is to rule on EXP-ECDLP-6ecca1's existing
    approval gate, not to write a new one. IDEA-20260904-cb1199 was set aside
    for THIS decision (not closed) because its central quantitative claim
    leans on Galbraith 2025 (eprint 2024/924) read only at abstract level
    (search-result summaries; the paper itself returned a block page) --
    workable, since the record's own Stage 2 measures the exponent
    independently rather than resting on the citation, but a heavier
    dependency on an unverified external claim than the other two candidates.
    IDEA-20260904-ab226c is a strong second choice (a pure arithmetic
    occupancy census, no cost claim) and remains available as the next
    RQ-ECDLP-165d4b design task.
    This record (IDEA-20260904-742c48) was selected because: (1) it is a
    correction to an existing internal closure (IDEA-20260901-6b63a4's C1,
    which prices endomorphism evaluation at Omega(n) uniformly) rather than a
    fresh speculative mechanism, and the correction makes the closure
    STRONGER, not weaker, which is the "closure that survives its own
    best-case cost model" standard of docs/inventor-protocol.md section 4;
    (2) its decisive test is cheap and sharply falsifying: one microbenchmark
    (gamma_min on census curves) plus one planted-dial calibration decide the
    entire orbit-lane ceiling in under an hour at 16-20 bits (idea Stage B),
    with the derivations (Stage A) reviewable at zero compute; (3) it is
    paired, in the same record, with a genuine heuristic-validation experiment
    at cryptographic scale (Stage D: 256-bit and 384-bit discriminant norm-form
    sampling against the Dickman-de Bruijn prediction, with an explicit tail
    check) reached via a sampling shortcut needing no curve -- exactly the
    A7/target-result-profile pattern this program is directed to bias toward,
    and exactly the pairing AGENTS.md requires for a conditional result; (4)
    every citation this record's core algebra depends on is either read in
    full this session (IDEA-20260901-6b63a4, KN-TECH-018, KN-TECH-005,
    KN-TECH-031, IDEA-20260901-3e68ad) or independently checked by the
    experiment itself (the recalled classical facts: Velu/isogeny evaluation
    cost, Canfield-Erdos-Pomerance/Dickman-de Bruijn, genus theory), so no
    unverified external citation is load-bearing for the derivation itself;
    (5) no existing H-ECDLP-* hypothesis under RQ-ECDLP-165d4b (8 checked:
    f6d060, ff38dc, e42bda, 80fceb, 63d136, 63eecd, 1853dc, 24d15c) covers
    endomorphism-evaluation cost, and no experiment anywhere in
    experiments/EXP-ECDLP-*/ references this idea or IDEA-20260901-6b63a4;
    the idea is genuinely open, not merely unlabelled.
    Honest limitation of the pick: per docs/target-result-profile.md this is
    NOT an exponent-moving direction -- like every currently open, well-formed
    RQ-ECDLP-165d4b candidate, its best possible outcome is a constant-factor
    statement (a ceiling G_max <= 1/(2*sqrt(gamma_min)) on the automorphism/
    orbit-quotient rho lane), because KN-OPEN-001 records no known prime-field
    ECDLP advantage over sqrt(p) and this whole lane is scoped to the
    constant-factor endomorphism-orbit question by RQ-ECDLP-165d4b itself. The
    program's exponent-targeting mechanism work sits in RQ-ECDLP-002 and its
    live approved contract (H-ECDLP-a4be60 / EXP-ECDLP-56ee42); this record does
    not compete with that lane and is disclosed here as a constant-factor,
    closure-class contribution rather than presented as more than it is.

  statement: >-
    CLAIM TIER TOY (16-28 bits) FOR THE MICROBENCHMARK AND THE SMOOTHNESS
    CENSUS; HEURISTIC-VALIDATION TIER AT 256/384-BIT DISCRIMINANTS FOR THE
    NORM-FORM SAMPLING ARM. NO EXPONENT MOVES IN ANY OUTCOME.
    Let E/F_p be ordinary with prime-order subgroup G of order N, and let
    alpha be a non-unit endomorphism whose ideal (alpha) factors, in the order
    O = End_{F_p}(E), entirely into prime ideals of norm at most B lying over
    SPLIT rational primes. Then alpha is evaluable on a point as a composition
    of Omega(N(alpha)) Velu isogenies of degree at most B, at charged cost
        C(alpha) = Otilde(c_0 * B * Omega(N(alpha)))
    field operations, rather than the Omega(N(alpha)) field operations that
    IDEA-20260901-6b63a4's closure C1 prices every non-unit endomorphism at.
    Writing gamma = C(alpha)/c_step for the cost of one application in units
    of one charged group addition, and h for the multiplicative order of the
    scalar lambda_alpha by which alpha acts on G, the net gain of an
    orbit-canonicalised rho walk over that alpha is
        G(h, gamma) = sqrt(h) / (1 + h*gamma),   maximised at h = 1/gamma,
        G_max = 1 / (2*sqrt(gamma)).
    Composing with IDEA-20260901-6b63a4's norm-order tradeoff
    (n^h >= (sqrt(N) - 1)^2, so Omega(n) >= log N / (h log B) for n = N(alpha))
    gives the corrected necessary condition for ANY non-unit orbit discount to
    be worth using at all:
        c_step * log B  >=  c_0 * B * log N.
    TWO MUTUALLY EXCLUSIVE READINGS, decided by one measured ratio gamma_min
    (the smallest such gamma over every applicable non-unit endomorphism on
    the census curves) and the measured constants (c_0, c_step):
    READING 1 -- gamma_min is at least 1.0 at every declared bit size and the
    break-even threshold N_0 solving c_step*log B = c_0*B*log N at B = 2 falls
    below 2^16. The endomorphism-orbit lane is then closed under the most
    favourable evaluation model this record can construct: only UNIT
    endomorphisms (automorphisms) are cheap enough to be worth canonicalising
    over, recovering exactly KN-TECH-018's sqrt(|Aut|) family as the unique
    live member, and the closure this makes STRONGER (it survives its own
    best-case cost model) rather than contradicts.
    READING 2 -- some (curve, alpha) has measured gamma < 0.25, or the
    measured constants satisfy the break-even inequality at a declared bit
    size. A genuine, previously unaccounted, constant-factor non-generic rho
    discount beyond sqrt(|Aut|) exists on a named cell, and the finding
    requires independent validation and red-team review before any further
    use (per docs/target-result-profile.md's C1/C2 ambition classification --
    this remains, even in Reading 2, a constant factor, not an exponent).
    H1 (heuristic, validated separately at scale): the norm form of O imitates
    a uniformly random integer of its size with respect to B-smoothness once
    the genus-theory local splitting conditions are imposed. This is the
    availability law the corrected cost model needs to be non-vacuous, and it
    is validated by direct sampling at 256- and 384-bit discriminants with no
    curve construction (Stage D of the paired experiment), exactly mirroring
    the sampling-shortcut structure of the target-result-profile exemplar's
    section 4.2 (Deuring correspondence there; the norm form itself here).

  mechanism: >-
    TRACKED OBJECT: the smoothness profile of the endomorphism norm,
    (P^+(N(alpha)), Omega(N(alpha)), split-fraction), together with the
    induced application cost ratio gamma = C(alpha)/c_step. This is a
    genuinely lossy projection of alpha (it discards the ideal, the curve, the
    class and the scalar lambda_alpha; its fibres are enormous) whose
    retained state propagates DETERMINISTICALLY under the operation the
    hypothesis is about -- composition in O: norms multiply, so Omega adds
    and P^+ takes the maximum, giving the subadditivity C(alpha*beta) <=
    C(alpha) + C(beta) that the orbit-enumeration bound needs. It is
    incompatible with F_p-isogeny to a different curve and is never
    transported across curves.
    The mechanism is: (i) a smooth, split-factoring endomorphism norm converts
    "evaluate alpha" from "compute a degree-n rational map directly" into "walk
    a short chain of Velu isogenies of degree at most B, staying inside the
    same F_p-isogeny class the whole time" -- the standard smooth-isogeny
    evaluation trick of isogeny cryptography, applied here to CORRECT an
    existing internal cost closure rather than to build a new attack; (ii)
    substituting the corrected cost into the orbit-canonicalisation gain
    formula produces a closed-form ceiling 1/(2*sqrt(gamma)) that is a function
    of one measurable ratio per endomorphism, collapsing an open-ended search
    over End(E) into a single microbenchmark per curve; (iii) the resulting
    necessary condition c_step*log B >= c_0*B*log N is tightest at B=2 and
    fails for every larger B, so the whole correction either closes the
    non-unit branch at a small, measured threshold N_0, or exhibits a live
    cell -- and which of the two holds is decided empirically, not asserted.

  assumptions:
    - >-
      Ordinary, prime-order, non-anomalous curves over F_p with declared
      embedding degree and twist rows (RQ-ECDLP-165d4b scope, KN-TECH-034
      screens). Primality of N makes the ring map O -> Z/N sending alpha to
      lambda_alpha well defined on G.
    - >-
      c_0 (field operations per unit isogeny degree) and c_step (field
      operations per charged group addition) are MEASURED in a single frozen
      cost model, never assumed; every threshold this hypothesis states is a
      function of their measured ratio.
    - >-
      The corrected cost Otilde(c_0*B*Omega(n)) is a LOWER bound on the true
      cost of applying alpha: it excludes kernel-finding, modular-polynomial
      or eigenvalue computation, and path storage. Using a lower bound makes
      any Reading-1 closure conservative; a Reading-2 escalation under this
      model must be re-measured with those costs charged before any further
      use, and this is stated in advance so a favourable-looking Reading 2 is
      not taken at face value.
    - >-
      Canonicalisation needs the WHOLE orbit of order h; a sub-orbit of order
      m dividing h does not reduce the canonicalisation cost below h
      applications (proved by direct substitution in Stage 0 of the paired
      experiment, not assumed).
    - >-
      No uncharged precomputation. Any table of precomputed alpha-images is
      charged at build and at storage.
    - >-
      Lawful defensive cryptanalysis on public constructions and toy
      benchmarks only.

  proof_search_map:
    not_applicable_reason: null
    bottleneck: >-
      The step "apply a non-trivial endomorphism to a walk state during
      orbit canonicalisation". Every orbit-quotient proposal under
      RQ-ECDLP-165d4b and GOAL-ECDLP-001's endomorphism arm passes through it;
      the standing closure (IDEA-20260901-6b63a4's C1) prices it at
      Omega(n), and this hypothesis's content is that the correct price is
      Otilde(c_0*B*Omega(n)) for smooth split-factoring alpha, after which the
      lane is re-closed under the corrected, more favourable model.
    baseline_embedding:
      parameter_slice: >-
        alpha a UNIT: n = 1, Omega(n) = 0, C(alpha) = one field
        multiplication, gamma = gamma_aut, h in {2, 4, 6}. The corrected model
        must return G(2, gamma_aut) ~= 1.29, G(4, .) ~= 1.43 and G(6, .) ~=
        1.53 at gamma_aut ~= 0.1, recovering KN-TECH-018's sqrt(|Aut|) family
        net of canonicalisation and consistent with EV-ENDO-10109d's measured
        ratio-to-ceiling means (1.0043, sd 0.1128 at j=0; 1.0442, sd 0.1059 at
        j=1728).
      reproduction_check: >-
        Symbolic: substitute h=2 and the negation map into G(h,gamma) and
        recover the sqrt(2) already inside KN-TECH-006's 0.886*sqrt(N)
        convention, so the formula does not double-count. Frozen fixture: at
        the paired experiment's declared toy primes, at j=0 and j=1728, the
        measured net gain must reproduce EV-ENDO-10109d's reported means
        within their reported sd under a matched seed count.
    observation_collision:
      observable: the cost ratio gamma and the derived ceiling G_max = 1/(2*sqrt(gamma))
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED. A measured gamma near 0.1 could be
        produced BOTH by a genuinely free automorphism AND by an instrument
        that charges the automorphism application but omits the
        re-canonicalisation comparison (the minimum over the orbit) that the
        walk actually pays. SEPARATING CONDITION, BLOCKING: gamma must be
        measured as the difference of two END-TO-END charged walk costs at
        matched seeds (quotient arm minus base arm), divided by h -- never as
        an isolated map timing. A second, symmetric collision: a G_max near 1
        could be produced either by a genuinely marginal map or by an
        overstated c_step; c_step is therefore reported in raw field
        operations alongside every gamma so the two cannot be confused.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "does an exploitable non-unit endomorphism exist on this
          curve" by the single scalar inequality gamma < 1/4, with gamma a
          measured cost ratio.
        predicted_gain: >-
          Reduces an open-ended search over End(E), across every curve in the
          census, to one microbenchmark per curve, with a closed-form ceiling
          1/(2*sqrt(gamma)) holding for every orbit order h.
      - transform: stronger_invariant
        proposed_object: >-
          Track the norm's factorisation shape (P^+, Omega, split-fraction)
          rather than the bare norm, since the shape determines cost under
          composition (Omega adds, P^+ maximises) and the norm alone does not.
        predicted_gain: >-
          Preserves exactly the extra state needed to make the cost bound
          subadditive, which is what makes it usable inside orbit enumeration.
    quantifier_order: >-
      FOR ALL ordinary prime-order curves in the declared scope, FOR ALL
      non-unit alpha in End(E) whose ideal factors into split primes of norm
      at most a declared B, and FOR ALL orbit orders h: the net
      orbit-canonicalisation gain is at most 1/(2*sqrt(gamma_alpha)), where
      gamma_alpha is THAT alpha's measured application cost ratio.
      SEPARATELY, FOR ALL non-unit alpha, THERE EXISTS a threshold
      N_0(c_0, c_step) above which the corrected necessary condition fails, and
      N_0 is computed from the measured constants, not asserted. EXPLICITLY
      NOT CLAIMED: that Velu composition is the optimal evaluation strategy (a
      faster evaluation would raise the ceiling, and this is the hypothesis's
      own stated method ceiling, not excluded); nothing about endomorphisms
      whose ideal has an inert or ramified factor, which the corrected model
      does not apply to.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On the tested curves and the frozen cost model, the cheapest
        applicable non-unit endomorphism has gamma_min = g +/- CI, so no
        orbit-quotient rho variant built from it can gain more than
        1/(2*sqrt(g)), and at the measured (c_0, c_step) the non-unit branch is
        below break-even for every group order above the measured N_0." It can
        NEVER certify that no faster evaluation of endomorphisms exists, that
        no non-orbit mechanism uses End(E), or anything about the ECDLP
        exponent.
      nearby_object_control: >-
        THE SUPERSINGULAR CURVE over F_{p^2}, where End(E) is a maximal order
        in a quaternion algebra and cheap non-scalar endomorphisms genuinely
        exist. The measured gamma_min there must DROP relative to the ordinary
        case while the ordinary-case gamma_min stays above 1/4. A method
        reporting the same gamma_min on both has not identified the
        load-bearing structure (commutativity and rank 2 of the ordinary
        endomorphism ring) and its closure is void.
    proof_obligations:
      - claim: "A smooth, split-ideal alpha of norm n is evaluable in Otilde(c_0*B*Omega(n)) field operations."
        responsibility: runtime
      - claim: "G(h,gamma) = sqrt(h)/(1+h*gamma) and its maximum over h is G_max = 1/(2*sqrt(gamma))."
        responsibility: correctness
      - claim: "Sub-orbits of order m dividing h do not reduce canonicalisation cost below h applications."
        responsibility: strictness
      - claim: "T1 (IDEA-20260901-6b63a4) gives Omega(n) >= log N/(h log B), hence the break-even c_step*log B >= c_0*B*log N."
        responsibility: size
      - claim: "The unit-endomorphism slice reproduces KN-TECH-018's family and EV-ENDO-10109d's measured means."
        responsibility: baseline
      - claim: "gamma is measured end-to-end at matched seeds, never as an isolated map timing."
        responsibility: interface
      - claim: "The supersingular control shows gamma_min dropping relative to the ordinary case."
        responsibility: strictness
      - claim: "No claim is made about faster endomorphism evaluations, non-orbit mechanisms, or any ECDLP exponent."
        responsibility: scope

  asymptotic_claim:
    problem: >-
      ECDLP on ordinary, prime-order elliptic curves over prime fields, via
      Pollard-rho orbit-canonicalisation using endomorphisms.
    prior_best: >-
      Parallel Pollard rho with negation at 0.886*sqrt(N) group operations,
      O(1) memory (KN-TECH-001, KN-TECH-006); automorphism-discounted rho at
      factor sqrt(|Aut|/2), measured as attained by EV-ENDO-10109d
      (KN-TECH-018); the standing closure this hypothesis corrects,
      IDEA-20260901-6b63a4's C1, which prices every non-unit endomorphism
      evaluation at Omega(n) and concludes the cheap-and-short configuration
      exists only at n=1.
    time_exponent: "1/2, UNCHANGED in every outcome."
    memory_exponent: "O(1) for rho, UNCHANGED."
    hidden_cofactor: >-
      Disclosed in both directions. FAVOURING THE LANE (i.e. making a Reading
      2 look better than it is): the corrected cost omits kernel-finding,
      modular-polynomial evaluation and path-storage cost, so gamma is
      understated and the ceiling overstated by this model alone -- a Reading
      2 must be re-measured with those costs charged before any escalation.
      FAVOURING THE CLOSURE (i.e. making Reading 1 conservative): Velu
      composition may not be the optimal evaluation of a smooth endomorphism;
      a faster evaluation would lower gamma and raise the ceiling, which is
      named as this hypothesis's own method ceiling rather than excluded.
    claim_kind: constant_factor

  heuristic_assumptions:
    - id: HEUR-9f3c7a-01
      formal_statement: >-
        NORM-FORM SMOOTHNESS. Let O be an imaginary quadratic order of
        discriminant Delta and Q its principal norm form. For alpha drawn
        uniformly from {alpha in O : N(alpha) <= X}, N(alpha) behaves, with
        respect to B-smoothness, like a uniformly random integer of size X
        conditioned on the genus-theory local conditions of Q (every rational
        prime inert in O divides N(alpha) only to an even power; every split
        prime is unconstrained). Formally,
            Pr[N(alpha) is B-smooth, every prime factor split]
                = (1/2 + o(1))^{Omega} * u^{-u(1+o(1))},  u = log X / log B,
        uniformly for (log X)^eps < u < (log X)^{1-eps}.
      random_model_justification: >-
        RIGOROUS INGREDIENTS composed: (i) genus theory's exact structural
        characterisation of which integers the norm form represents, together
        with the rigorous lattice-point count for {alpha : N(alpha) <= X}
        (Gauss circle problem for a positive-definite binary form,
        2*pi*X/sqrt(|Delta|) + O(sqrt(X/|Delta|))); (ii) the classical
        distribution theorem it imitates, Canfield-Erdos-Pomerance /
        Dickman-de Bruijn, Psi(X,B) = X*u^{-u(1+o(1))} uniformly in the stated
        u-range. The heuristic step -- the only step that can fail -- is that
        the VALUES of this specific quadratic form imitate random integers of
        their size for smoothness once the local conditions are imposed. This
        is exactly the shape of the target-result-profile exemplar's
        Heuristic 1 (rigorous size/structure bound composed with a classical
        distribution theorem).
      supporting_results:
        - >-
          Canfield-Erdos-Pomerance / Dickman-de Bruijn smoothness density for
          uniform integers. RECALLED as the classical distribution theorem
          being imitated, provenance recalled, not independently retrieved
          this session; used as the PREDICTION UNDER TEST, not as authority --
          the experiment measures agreement with it and a disagreement is the
          informative outcome.
        - >-
          Genus theory's local-splitting characterisation of values
          represented by a binary quadratic form. RECALLED, standard, and
          checked directly by the paired experiment's genus-theory control
          (every observed prime factor's Kronecker symbol is recomputed
          independently against the observed exponent parity).
        - >-
          inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, read in-repo, as the
          exemplar of a conditional result whose heuristic is validated by
          sampling the relevant distribution via a correspondence that reaches
          cryptographic scale without constructing the underlying object (the
          Deuring correspondence there; the norm form itself here).
      validation_experiment_ids:
        - EXP-ECDLP-b2e5d1
      falsification_condition: >-
        The empirical CDF of log(P^+(N(alpha)))/log(X) at a 256-bit
        discriminant departs from the Dickman-corrected prediction beyond the
        95th percentile of the Kolmogorov-Smirnov null at the tested sample
        size, while the matched random-integer null control does not depart.
        That is a measured deviation of the norm form from the uniform
        smoothness law at cryptographic scale and would bound the corrected
        cost model's applicability there.
    - id: HEUR-9f3c7a-02
      formal_statement: >-
        COST ADDITIVITY OF COMPOSITION. For alpha with a split, B-smooth ideal
        factorisation, the measured end-to-end charged cost of evaluating
        alpha on a point equals the sum, over the Omega(N(alpha)) steps, of
        the independently measured c_velu(ell_i), up to a multiplicative
        factor in [0.8, 1.5], uniformly over the tested curves and paths.
      random_model_justification: >-
        The rigorous ingredient is only that composition of isogenies is
        composition of maps, so cost is additive up to bookkeeping overhead;
        there is no asymptotic content. The classical statement imitated is
        the standard smooth-isogeny evaluation accounting used throughout
        isogeny cryptography. The heuristic step is that per-step overhead
        (curve-parameter updates, coordinate normalisation) stays a bounded
        fraction of the per-step cost rather than dominating as path length
        grows.
      supporting_results:
        - >-
          Standard Velu-composition evaluation accounting, RECALLED, standard
          isogeny-cryptography practice; no priority claimed. Checked directly
          by the paired experiment's Omega=1 one-step-increment control.
      validation_experiment_ids:
        - EXP-ECDLP-b2e5d1
      falsification_condition: >-
        The measured total cost of a multi-step path exceeds the sum of
        independently measured per-step costs by more than the declared
        multiplicative factor, with the excess GROWING as a function of path
        length Omega. That would mean bookkeeping overhead dominates and the
        corrected cost model must be restated with an explicit
        overhead-per-step term.

  structural_ingredients:
    - description: >-
        Composition of small-degree Velu isogenies to evaluate a smooth-degree
        isogeny, remaining inside one F_p-isogeny class throughout, standard
        practice in isogeny cryptography.
      citation: null
      provenance: recalled
      verified_by: null
      role: >-
        the correction to the endomorphism-evaluation cost that this
        hypothesis substitutes for IDEA-20260901-6b63a4's Omega(n) pricing;
        no novelty is claimed for the composition technique itself, only for
        its use to correct and strengthen an existing internal closure
    - description: >-
        Canfield-Erdos-Pomerance / Dickman-de Bruijn smoothness distribution
        for uniform integers, Psi(X,B) = X*u^{-u(1+o(1))}.
      citation: null
      provenance: recalled
      verified_by: null
      role: the classical distribution theorem HEUR-9f3c7a-01 imitates
    - description: >-
        Genus theory: a rational prime inert in an imaginary quadratic order O
        divides every value of O's norm form only to an even power.
      citation: null
      provenance: recalled
      verified_by: null
      role: the rigorous structural half of HEUR-9f3c7a-01's justification
    - description: >-
        IDEA-20260901-6b63a4's norm-order tradeoff T1 (for alpha of norm n
        acting on the prime subgroup with multiplicative order h,
        n^h >= (sqrt(N)-1)^2) and its closure C1 (evaluating an endomorphism
        of degree n costs Omega(n) field operations, so a cheap-and-short
        configuration exists only at n=1).
      citation: IDEA-20260901-6b63a4
      provenance: internal
      verified_by: "coordinator, 2026-09-08, lines 1-120 read in full (object, lossy-projection test, T1 with proof, C1)"
      role: the standing closure this hypothesis corrects and re-derives under a corrected cost model
    - description: >-
        rho speedup ~sqrt(|Aut|) as a constant factor that does not move the
        exponent 1/2; the 0.886*sqrt(n) convention already contains the
        sqrt(2) negation factor.
      citation: KN-TECH-018
      provenance: internal
      verified_by: "coordinator, 2026-09-08, read in full"
      role: the baseline_embedding case this hypothesis's ceiling formula must reproduce
    - description: >-
        Generic discrete-log lower bound Omega(sqrt(p)); a prime-field
        proposal claiming to beat sqrt(n) is claiming a non-generic mechanism.
      citation: KN-TECH-005
      provenance: internal
      verified_by: "coordinator, 2026-09-08, read in full"
      role: the generic-group boundary this hypothesis's constant-factor claim never approaches

  reduction_chain:
    core_problem: >-
      Correct the evaluation-cost term in the endomorphism-orbit rho ceiling
      for ordinary prime-order curves.
    corollaries: []

  predictions:
    - metric: >-
        gamma_min -- the measured end-to-end application cost of the cheapest
        applicable non-unit endomorphism on each census curve, in charged
        group-addition units
      direction: higher
      minimum_effect: >-
        Predicted at least 1.0 at every declared bit size (at least 4x the
        1/4 break-even). A measured gamma_min below 0.25 on any curve is
        Reading 2 and escalates to independent validation and red-team review.
    - metric: >-
        gamma_aut -- the same quantity for the F_p-rational automorphism at
        j=0 and j=1728
      direction: lower
      minimum_effect: >-
        Predicted in [0.03, 0.20], giving G(6,gamma_aut) in [1.35,1.72] and
        G(4,.) in [1.28,1.60], consistent with EV-ENDO-10109d's reported
        means within their reported sd. A gamma_aut outside this band that
        cannot reproduce EV-ENDO-10109d voids the ceiling formula (baseline
        obligation fails).
    - metric: >-
        planted-dial tracking -- measured net gain versus predicted
        1/(2*sqrt(gamma)) over gamma in {0.05, 0.10, 0.20, 0.50, 1.00}
      direction: different
      minimum_effect: >-
        Agreement within 15 percent at every dial setting, with gamma=1.00
        showing a net LOSS. Failure means the closed-form ceiling is the wrong
        model and only the empirical dial curve survives as a deliverable.
    - metric: >-
        fraction of alpha with N(alpha) <= X whose ideal factors entirely into
        split primes of norm at most B, at B in {10^2, 10^3, 10^4}, over the
        census curves
      direction: different
      minimum_effect: >-
        Predicted to match the Dickman-de Bruijn prediction with the
        genus-theory one-half correction within binomial sampling error. A
        fraction indistinguishable from zero means the correction is VACUOUS
        (the smooth branch is never available), which strengthens
        IDEA-20260901-6b63a4's original C1 rather than refuting it -- a clean,
        reportable outcome.
    - metric: >-
        N_0 -- the threshold solving c_step*log(B) = c_0*B*log(N) at the
        measured constants and B=2
      direction: different
      minimum_effect: >-
        Predicted below 2^16, i.e. below every declared census bit size. An
        N_0 above 2^36 means the non-unit branch is not closed inside the
        declared range and must be tested directly rather than inherited.
    - metric: >-
        Kolmogorov-Smirnov distance between the empirical CDF of
        log(P^+(N(alpha)))/log(X) at a 256-bit discriminant and the
        Dickman-corrected prediction, 10^5 samples
      direction: different
      minimum_effect: >-
        Predicted below the 95th percentile of the KS null at that sample
        size, with the matched random-integer null control passing the same
        check. A larger distance on the elliptic data alone falsifies
        HEUR-9f3c7a-01 at cryptographic scale.

  test_boundary:
    instances:
      - >-
        Ordinary, prime-order, non-anomalous curves over F_p with declared
        embedding-degree and twist rows, at 16, 20, 24 and 28 bits, drawn from
        the RQ-ECDLP-165d4b census set.
      - >-
        Synthetic planted-cost-ratio "endomorphisms" with gamma set by hand
        to {0.05, 0.10, 0.20, 0.50, 1.00} and synthetic orbit order
        h = 1/gamma, for the ceiling-formula calibration dial.
      - >-
        Norm-form sampling with NO curve: fixed discriminants Delta = t^2-4p
        at one declared 256-bit prime p and admissible trace t (repeated at a
        384-bit discriminant), 10^5 and 10^4 uniform samples respectively in
        the norm ball N(alpha) <= X.
      - >-
        Nearby-object control: the supersingular curve over F_{p^2}, where
        End(E) is a maximal quaternion order.
    parameters:
      toy_bit_sizes: [16, 20, 24, 28]
      dial_gammas: [0.05, 0.10, 0.20, 0.50, 1.00]
      smoothness_B_grid: [100, 1000, 10000]
      cryptographic_discriminants_bits: [256, 384]
      cryptographic_sample_sizes: [100000, 10000]
    implementation: >-
      harness/isogeny_class.py (velu_odd, velu_image, find_kernel_generator,
      rational_isogeny_count, fundamental_discriminant, hurwitz_class_number,
      cm_eigenvalues) plus a new bounded norm-form enumerator/sampler and a
      Dickman-rho evaluator checked against known small-u values, all recorded
      through harness/runner.py. No factoring beyond trial division to 10^6
      and ECM to 10^12 for the 256/384-bit smoothness arm.
    budget:
      wall_clock_seconds_per_run: 14400
      total_cpu_hours: 24.0
      maximum_memory_gb: 8

  distinguishable_outcomes:
    - outcome: >-
        gamma_min >= 1.0 at every declared bit size, N_0 < 2^16, the planted
        dial tracks 1/(2*sqrt(gamma)) within 15 percent, the smooth-split
        fraction is non-vanishing, and the 256/384-bit KS test passes against
        the matched null.
      means: >-
        READING 1. The endomorphism-orbit lane is closed with a mechanism that
        survives the best-case cost model; the closure is STRENGTHENED, not
        weakened; the only live member of the family is the automorphism case
        already known (KN-TECH-018).
    - outcome: >-
        Some non-unit endomorphism has measured gamma < 0.25, or the
        break-even inequality holds at a declared bit size.
      means: >-
        READING 2. A genuine constant-factor discount beyond sqrt(|Aut|)
        exists on a named cell. Escalates to independent validation and
        red-team review before any further use; still not an exponent claim.
    - outcome: >-
        The planted dial does not track 1/(2*sqrt(gamma)) within 15 percent.
      means: >-
        The closed-form ceiling formula is the wrong model; only the raw
        empirical dial curve survives as a deliverable and every closed-form
        number in this hypothesis is withdrawn.
    - outcome: >-
        The unit-case baseline cannot reproduce EV-ENDO-10109d's reported
        means within their reported sd.
      means: >-
        The instrument contradicts a replicated internal measurement; halt
        and reconcile before reporting anything else from this contract.
    - outcome: >-
        The smooth-split fraction is indistinguishable from zero at every
        tested B.
      means: >-
        The correction is VACUOUS. IDEA-20260901-6b63a4's original C1 stands
        as written and this hypothesis's contribution reduces to a negative
        note, stated in advance so the dependency is honest.
    - outcome: >-
        The supersingular nearby-object control shows the same gamma_min as
        the ordinary case.
      means: >-
        The method proves too much and has not identified the load-bearing
        structure (commutativity, rank-2 ordinary endomorphism ring); every
        number in this hypothesis is void.
    - outcome: >-
        The 256/384-bit empirical CDF departs from the Dickman-corrected
        prediction beyond the KS threshold while the matched random-integer
        null does not.
      means: >-
        HEUR-9f3c7a-01 is falsified at cryptographic scale; the corrected cost
        model's applicability there is bounded by the measured direction of
        the deviation, and this is reported regardless of the READING 1/2
        outcome on the toy-scale arms.

  falsification_conditions:
    - >-
      Any curve shows a non-unit endomorphism with measured end-to-end gamma
      < 0.25 (Reading 2; escalates rather than closes the record).
    - >-
      The planted dial does not track 1/(2*sqrt(gamma)) within 15 percent at
      any of the five settings.
    - >-
      The unit-case control cannot reproduce EV-ENDO-10109d's measured
      ratio-to-ceiling means within their reported sd.
    - >-
      The measured N_0 exceeds 2^36 while gamma_min is at least 1.0 (the
      non-unit branch is not closed inside the declared range and must be
      tested directly rather than inherited).
    - >-
      The supersingular nearby-object control returns the same gamma_min as
      the ordinary case.
    - >-
      The 256- or 384-bit empirical smoothness CDF departs from the
      Dickman-corrected prediction beyond the declared Kolmogorov-Smirnov
      threshold while the matched random-integer null does not.
    - >-
      Certificate verification fraction below 1.0 on any kernel, isogeny edge
      or path claim.

