# H-GFPN-8aaf70
# Side lemma on y^2 = x^3 + x + 1, a model with no F_p-root.
# Companion to H-GFPN-d48ae1. Does not edit that record.
hypothesis:
  id: H-GFPN-8aaf70
  question_id: RQ-GFPN-c01af8
  goal_id: GOAL-GFPN-380702
  source_idea: IDEA-20261004-31991f
  experiment_id: EXP-GFPN-3ce2d1
  specified_at: '2026-10-05'
  status: approved
  proposed_by: coordinator
  approved_by_decision: DEC-20261005-2a1dbb
  title: >-
    On y^2 = x^3 + x + 1 the side-1 subsum of an F_p-rational pair
    sum is the identity
  statement: >-
    Let p be in {7, 19, 59} and let E be y^2 = x^3 + x + 1 over F_p.
    The cubic has no root in F_p at these primes, so the only
    F_p-rational 2-torsion point is the identity. A design-session
    partition, which is not a run, is
    p=7 side 0 {0, 2} and side 1 {1, 3, 4, 5, 6};
    p=19 side 0 {0, 2, 5, 7, 9, 10, 13, 14, 15, 16} and side 1
    {1, 3, 4, 6, 8, 11, 12, 17, 18};
    p=59 side 0 {0, 1, 6, 8, 11, 13, 14, 15, 19, 21, 22, 25, 26, 27,
    30, 31, 34, 38, 39, 40, 41, 42, 43, 45, 48, 49, 51, 52, 53, 54, 55}
    and side 1 {2, 3, 4, 5, 7, 9, 10, 12, 16, 17, 18, 20, 23, 24, 28,
    29, 32, 33, 35, 36, 37, 44, 46, 47, 50, 56, 57, 58}.
    Every ordered pair of affine points on those x-coordinates has,
    whenever the sum lies in E(F_p), side-1 subsum equal to the
    identity. The same session counted 26, 418, and 3900 such sums,
    and 0 other subsums.
  mechanism: >-
    The nontrivial Galois element of F_{p^2}/F_p negates side-1
    points and fixes side-0 points. An F_p-rational sum relation
    forces the side-1 subsum to have order dividing 2. With no
    rational root of the cubic, that subsum is the identity.
  assumptions:
    - n = 1 and the factor base is all of F_p.
    - F_{p^2} = F_p[i]/(i^2+1).
    - A sum is F_p-rational when it is infinity or both coordinates lie in F_p.
    - The doubling slope uses derivative 3x^2 + 1.
  proof_search_map:
    bottleneck: >-
      Whether a side-1 subsum can be a nonzero F_p-point when the
      cubic has no F_p-root.
    baseline_embedding:
      parameter_slice: >-
        Lemma (L) of IDEA-20261004-31991f at n = 1 and m = 2 on
        y^2 = x^3 + x + 1. H-GFPN-d48ae1 is the model with (0, 0).
      reproduction_check: >-
        Affine and Jacobian addition must agree on the side sets,
        the rational-sum counts, and the nonzero-subsum count.
    observation_collision:
      observable: side of each x, the pair sum, and the side-1 subsum
      distinct_preimage_search: >-
        A nonzero side-1 subsum would be a rational 2-torsion point
        this model does not have.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: the side bit on a root-free cubic
        predicted_gain: >-
          Separates this model from y^2 = x^3 + x. No Gaudry exponent.
    quantifier_order: >-
      For each fixed prime, every x in F_p, both square roots, then
      every ordered pair.
    method_ceiling:
      strongest_certifiable_claim: >-
        The identity-only subsum condition at these three primes.
        Not a cost for EcMasFp5.
      nearby_object_control: >-
        Two side-0 points. Their side-1 subsum is the identity.
    proof_obligations:
      - claim: The side sets match the statement and the cubic has no F_p-root
        responsibility: size
      - claim: Every F_p-rational pair sum has side-1 subsum equal to the identity
        responsibility: correctness
      - claim: The rational-sum counts are 26, 418, and 3900
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        A zero nonzero-subsum count here does not price Gaudry
        descent at n greater than 1.
      random_model_justification: The pairs are enumerated in full.
      supporting_results: []
      validation_experiment_ids:
        - EXP-GFPN-3ce2d1
      falsification_condition: >-
        A later record that treats these counts as a cryptographic cost.
  structural_ingredients:
    - description: >-
        IDEA-20261004-31991f states that a curve with no rational
        2-torsion has no type-(c) root. This hypothesis tests the
        pair case of that statement.
      citation: ledger/proposals/IDEA-20261004-31991f.yaml
      provenance: internal
      verified_by: coordinator session 2026-10-05, proposal file read
      role: source lemma
  reduction_chain:
    core_problem: The identity-only side-1 subsum on this model.
    corollaries: []
  predictions:
    - metric: nonzero_side1_subsums
      direction: equal
      minimum_effect: "0 at each prime"
    - metric: rational_sum_count
      direction: equal
      minimum_effect: "26 at p=7, 418 at p=19, 3900 at p=59"
    - metric: rational_root_count
      direction: equal
      minimum_effect: "0 at each prime"
  test_boundary:
    instances:
      - y^2 = x^3 + x + 1 over F_p for p in {7, 19, 59}
    parameters:
      primes: [7, 19, 59]
      degree_n: 1
      pair_length: 2
    implementation: >-
      Affine slope addition and Jacobian addition. Square roots are
      searched in F_{p^2}.
    budget:
      maximum_runs: 6
      maximum_memory_gb: 2
  falsification_conditions:
    - >-
      Both addition laws agree and a side-1 subsum of an F_p-rational
      pair sum is a nonzero point.
    - >-
      Both addition laws agree and a side set, a root count, or a
      rational-sum count differs from the statement.
  interpretation_limits:
    - This does not replace H-GFPN-d48ae1 or H-GFPN-d3c9a1.
    - No Gaudry exponent and no claim about EcMasFp5 itself.
    - A timeout, a crash, or an addition-law disagreement is not evidence against the statement.
  dominated_by:
    verdict: not_applicable
    justification: A lemma check on one model. No exponent is claimed.
  sota_delta:
    time_exponent_change: 0
    memory_exponent_change: 0
    quantitative_audit_delta: >-
      Records rational-sum counts 26, 418, and 3900 on a root-free cubic.
  status_note: >-
    Approved with EXP-GFPN-3ce2d1 by DEC-20261005-2a1dbb under the
    standing user authorization of 2026-09-06.
