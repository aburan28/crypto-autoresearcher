# Specified from IDEA-20260922-1a081a under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Approved DEC-20261002-e4e699.
#
# HOLD-B (DEC-20260924-99ce20 / DEC-20260928-63addc): survivor IDEA-20260922-1a081a
# with IDEA-20260922-c07598 symmetry ledger as a section (c07598 also designed
# separately as EXP-BINSTD-e6fc82 on PR #1545; this card does not re-design it).
# Support restatement condition: cite HOLD-X4 / IDEA-20260926-cafcf1 certificate
# (EXP-BINSTD-c05a0f on PR #1562) before reading HB1-2 Weil support as fired.
#
# ZERO RUNS in this design packet. Stage 0 only (grep + arithmetic). No AUXIN.
# No Bedrock. No curve attack / exponent claim. Claim tier: composition / indexing.
# =============================================================================
