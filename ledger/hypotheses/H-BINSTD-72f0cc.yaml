  id: H-BINSTD-72f0cc
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-1a081a
  absorbed_idea_ids:
    - IDEA-20260922-c07598
  related_idea_ids:
    - IDEA-20260926-cafcf1
    - IDEA-20260915-8fe0ef
    - IDEA-20260913-41c4f0
    - IDEA-20260922-8ac1ea
  experiment_id: EXP-BINSTD-7100ec
  goal_id: GOAL-ECDLP2M-001
  hold_id: HOLD-B
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-e4e699
  status: analyzed
  status_note: >-
    Stage-0 review DEC-20261003-747334 / EV-BINSTD-6298f1: O-C1-COUNTEREXAMPLE
    under Stage-0 ab_cost heuristic (94/2936); C2/C3 pass; C1 weakened
    (empirical_only, preliminary) — not reject_scoped. approved→analyzed.
  evidence_ids:
    - EV-BINSTD-6298f1
  decision_ids:
    - DEC-20261002-e4e699
    - DEC-20261003-747334
  proposed_by: coordinator
  title: >-
    Filed binary index-calculus cost laws are curve-blind except through
    lambda_x; matched rho gaps are exactly 0.5 log2(m)+h-bit; and Delta(m)
    flips sign between Frobenius-blind and Frobenius-aware lines — so the
    reachability table needs five IC columns, not ten

  statement: >-
    CLAIM (composition / indexing; HOLD-B; NO ATTACK). Setting: the ten FIPS
    binary curves at m in {163,233,283,409,571} with K/B partners, parameters
    from analysis/binstd-curve-audit/. HYPOTHESIS three decidable statements:
    (C1) CURVE-BLINDNESS — every filed binary IC cost law in ledger/ and
    knowledge/ factors as f(m,l,m_a,omega)*g(lambda_x) and never reads a or b
    except through lambda_x and r; one counterexample falsifies. (C2) EXACT
    BASELINE GAP — Delta_rho(m) = log2 rho_neg(B-m) - log2 rho_<tau,-1>(K-m)
    equals 0.5*log2(m)+0.5 for m in {233,283,409,571} and 0.5*log2(163) at
    m=163 (within 0.05 bit), with the (227,55) n=17 fixture of
    IDEA-20260915-8fe0ef reproduced. (C3) SIGN FLIP — for every Frobenius-blind
    filed line Delta(m)>0 (>=3.6 bit); for every Frobenius-aware orbit-quotient
    line on the relation-dominated branch Delta(m)<0 (magnitude >=3.1 bit);
    each cell names its branch. CONSEQUENCE: under (C1) the reachability table
    needs exactly five IC columns (one per m), not ten. CLAIM TIER: composition.
    NO exponent. NO security verdict. NO Magma/Sage/AUXIN.

  mechanism: >-
    OBJECT FRAME. Representation-neutral over R1 of the indexed lines.
    Sigma = translation by factor-base elements; tracked object = relation
    vector (Class I partial-action). No new object: composition over filed
    cost laws. Curve enters IC only via (i) S_3 through b, (ii) E-membership
    / yield through a,b as lambda_x, (iii) whether tau is an endomorphism
    (Koblitz). (C1) asserts filed COST laws are blind to (i)/(ii) except
    through lambda_x. (C2) charges matched rho with each curve's own
    symmetry group. (C3) is the discriminator: blind lines inherit the
    baseline gap as a positive Delta; aware lines apply an m-fold (or m^2
    on LA-dominated branch) gain that flips the sign. LOSSY-PROJECTION:
    relation vector discards the group element; fibre nontrivial when
    |Fb|^{m_a}>r. Open scalar: lambda_x (measured elsewhere; IDEA-20260922-
    8ac1ea / RELN). Charged stage: NONE — indexing of already-filed costs.

  assumptions:
    - >-
      Corpus scope is ledger/ + knowledge/ binary IC cost laws as of the
      Stage-0 freeze timestamp; a later-filed law is out of scope for this
      run's C1 verdict and may reopen the census by amendment.
    - >-
      Matched rho: negation-only 0.886*sqrt(r); <tau,-1> sqrt(pi*r/(4m));
      cofactor h read per curve from the audit dump (never assumed equal
      within a K/B pair).
    - >-
      Frobenius-aware gain uses the relation-dominated m-fold reading unless
      a cell is labelled LA-dominated (then m^2); branch is a reported column.
    - >-
      HB1-2 Weil support for any 1a081a trigger is restated against the
      HOLD-X4 / cafcf1 certificate (EXP-BINSTD-c05a0f) before being read as
      fired (DEC-20260928-63addc HOLD-B condition).
    - >-
      c07598 symmetry ledger is an absorbed section (corrected sqrt(2k)
      convention per HOLD-B); EXP-BINSTD-e6fc82 is cited, not re-run.
    - No Magma/Sage/cypari2/AUXIN/Bedrock required for Stage 0.
    - Assumption-1 resolutions are inputs labelled per cell, never tested here.

  proof_search_map:
    bottleneck: >-
      Corpus indexing mismatch: cost records indexed by n, decision target
      indexed by curve. Decidable by Stage-0 grep census (C1) plus independent
      rho-table arithmetic (C2) and signed Delta table (C3). Zero algorithmic
      solve.
    baseline_embedding:
      parameter_slice: >-
        Degenerate IC m_a=1, |Fb|=1: T_IC -> exhaustive 2^{log2 r}; Delta
        reduces to pure baseline gap 0.5*log2(m)+0.5, checkable against the
        rho table alone.
      reproduction_check: >-
        Independent script must emit the ten rho design figures from the
        audit dump and the n=17 pair (227, 55) from IDEA-20260915-8fe0ef
        formulas before any C3 cell is filled.
    observation_collision:
      observable: Delta(m) = M(K-m) - M(B-m) in bits at fixed m.
      distinct_preimage_search: >-
        Near-zero Delta has preimages (a) blind line at tiny m (excluded at
        deployed m); (b) aware line on LA-dominated branch cancelling m vs
        m^2; (c) lambda_x differing by ~m between K and B — separated by
        reporting branch and lambda_x columns (8ac1ea measures (c)).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Reachability attack side as 5 IC columns (per m) + 10-row baseline
          + scalar lambda_x, replacing a 10xk independent-cell matrix.
        predicted_gain: >-
          Halves independent cells; makes K/B difference a one-line
          consequence; exposes lambda_x as the only curve-hiding place.
      - transform: observable_fiber
        proposed_object: >-
          Fibre of attack column over curve — curves a single cost applies to.
        predicted_gain: >-
          Turns reach questions into lookups; makes curve-specific IC claims
          without a named curve-dependent input immediately auditable.
    quantifier_order: >-
      (C1) FOR EVERY filed binary IC cost law L, EXISTS factorisation
      L=f(m,l,m_a,omega)*g(lambda_x) — falsified by ONE counterexample.
      (C3) FOR EVERY m in FIPS and FOR EVERY named-regime line, Delta has
      the stated sign — not a security claim.
    method_ceiling:
      strongest_certifiable_claim: >-
        Under cost laws filed in this repository as of the Stage-0 freeze,
        with matched rho charged as above from analysis/binstd-curve-audit/,
        the per-curve margins and K/B gaps are the Stage-0 table, and Delta
        sign follows Frobenius awareness. Conditional on the corpus; silent
        on security; silent on Assumption 1.
      nearby_object_control: >-
        sect193r1/r2 (prime m=193, no Frobenius row — any <tau,-1> baseline
        for them is a bug); sect239k1 (Koblitz not in FIPS — must get a
        Frobenius row while c2tnb239v* over the same field must not).

  predictions:
    - id: P-C1
      metric: >-
        count of filed binary IC cost laws reading a/b other than through
        lambda_x or r
      direction: lower
      minimum_effect: exactly 0; one counterexample falsifies C1
    - id: P-C2
      metric: Delta_rho(m) recomputed from FIPS parameters
      direction: match
      minimum_effect: >-
        0.5*log2(m)+0.5 for m in {233,283,409,571}; 0.5*log2(163) at 163;
        each within 0.05 bit; (227,55) fixture passes
    - id: P-C3-blind
      metric: sign of Delta(m) for Frobenius-blind filed lines
      direction: higher
      minimum_effect: strictly positive at all five m; magnitude >= 3.6 bits
    - id: P-C3-aware
      metric: sign of Delta(m) for Frobenius-aware relation-dominated lines
      direction: lower
      minimum_effect: strictly negative at all five m; magnitude >= 3.1 bits
    - id: P-COLS
      metric: distinct IC columns required under C1 for ten FIPS rows
      direction: lower
      minimum_effect: exactly 5 (vs 10 curve-indexed)

  test_boundary:
    included:
      - >-
        Stage 0 only: corpus grep for C1; independent rho-table arithmetic
        for C2 including (227,55); signed Delta table for C3 with branch
        labels; cafcf1/HOLD-X4 support restatement note; c07598 section
        citation; sect193/sect239 nearby-object controls.
    excluded:
      - Any SAT/Groebner/Magma/Sage/AUXIN solve
      - Amazon Bedrock
      - Editing IDEA-20260922-1a081a / c07598 / cafcf1 claim text
      - Editing shared GOAL-ECDLP2M-001.yaml
      - Claiming break / exponent / security verdict
      - Measuring lambda_x (belongs to 8ac1ea / RELN)
      - Re-running EXP-BINSTD-e6fc82 or EXP-BINSTD-c05a0f
      - Treating infra failure as mathematical evidence against C1–C3

  falsification_conditions:
    - >-
      F-C1: one filed binary IC cost law reads a or b other than through
      lambda_x/r → C1 rejected; fan built with ten columns for that line only.
    - >-
      F-C2: any Delta_rho(m) off by >0.05 bit after convention matching, or
      (227,55) fixture miss → C2 rejected; pipeline not implementing C2.
    - >-
      F-C3: a named Frobenius-blind cell with Delta<=0, or a named
      relation-dominated Frobenius-aware cell with Delta>=0, after branch
      label check → C3 rejected for that regime.
    - >-
      F-SUPPORT: reading HB1-2 Weil support as fired without the cafcf1
      certificate restatement → procedure invalidation, not a math verdict.

  distinguishable_outcomes:
    - id: O-C1-HOLD
      meaning: >-
        C1 survives the census; reachability table opened with five IC
        columns; C2/C3 tables filed within tolerance.
    - id: O-C1-COUNTEREXAMPLE
      meaning: >-
        Named filed law falsifies C1; ten-column fan retained for that line;
        exception recorded; no hypothesis status move beyond this card's
        observation.
    - id: O-C2-FAIL
      meaning: Rho pipeline fails fixture or gap tolerance; C2 not implemented.
    - id: O-C3-MIXED
      meaning: >-
        C1 holds; some C3 cells miss the predicted sign after branch
        labelling — report per-cell; no security claim.
    - id: O-IMPEDIMENT
      meaning: >-
        Audit dump / corpus unreadable or required design PR artifacts for
        cafcf1/c07598 unavailable on this checkout — infra, never evidence
        against C1–C3.

  dominated_by: >-
    Every proposal in scope is dominated by matched rho for its own curve
    (design figures in IDEA-20260922-1a081a dominated_by block). This record
    claims no attack row; frontier rows checked per the idea (negation-only
    rho, <tau,-1> rho, vOW, exhaustive, Semaev 2015, Nagao Thm 1, empty GHS
    on prime degrees). dominated_by set after checking those rows; not null
    by default.
  sota_delta:
    time: >-
      Zero exponent. Quantitative output is the margin table and exact K/B
      gaps 3.67, 4.43, 4.57, 4.84, 5.08 bits at m=163,233,283,409,571.
    memory: Zero; memory column inherited per line beside time.
    data_queries: Not applicable.

  claim_tier: composition
  claim_tier_note: >-
    Indexing / composition over filed cost laws. No IC-vs-rho crossover
    asserted as a cryptanalytic result. No deployed-curve security verdict.

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
