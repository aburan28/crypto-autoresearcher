hypothesis:
  id: H-SSI-bdc41f
  question_id: RQ-SSI-001
  class: baseline_audit
  source_proposal: IDEA-20260805-d66193

  statement: >-
    SCOPE: two 2026 complexity claims about the supersingular endomorphism-ring problem, one
    FROZEN AND READ IN FULL IN THIS REPOSITORY and one NOT READ AT ALL; an audit of their
    quantifier structure and of the input encodings they range over. CLAIM TIER derivation.
    NO ATTACK, NO ALGORITHM, NO MEASUREMENT, NO EXPONENT CLAIMED TO MOVE, AND NO ASSERTION
    WHATSOEVER ABOUT THE CORRECTNESS OF EITHER PAPER.
    THE HYPOTHESIS: the apparent exponential disagreement between p^{1/3+o(1)} (ePrint
    2026/1486, READ) and a relayed poly(log p) (ePrint 2026/1586, NOT READ, ABSTRACT ONLY,
    RELAYED FROM THE 2026-08-05 SCOUTING BRIEF) IS LOCATED ENTIRELY IN THE INPUT ENCODING,
    AND THE LOCATION IS DECIDABLE BY A ZERO-COMPUTE AUDIT. Specifically:
    (i) There is a ladder of at least five distinct input encodings that all project onto the
        same English phrase "compute End(E) given E" -- G1 j(E) alone; G2 j(E) plus one
        non-scalar endomorphism in efficient representation; G3 j(E) plus an orientation by a
        small-discriminant order; G4 an abstract maximal order with the promise that it is
        some curve's endomorphism ring; G5 a special curve (j = 1728, CM, or F_p-rational).
        Their true computational contents are believed to span p^{1/3+o(1)} down to
        poly(log p). FIVE PREIMAGES, ONE OBSERVABLE.
    (ii) The disagreement is EXHAUSTIVELY forked by a consequence chain: if two explicit
        maximal orders End(E1), End(E2) are available then a connecting ideal plus KLPT
        yields a smooth-degree isogeny E1 -> E2 in polynomial time (RECALLED, UNVERIFIED,
        and its verification is a declared obligation). Hence a poly(log p) algorithm taking
        G1 input would make the supersingular isogeny problem polynomial, contradicting the
        p^{1/2}(log p)^{O(1)} history quoted verbatim from the READ paper and every parameter
        choice of CGL, the SQIsign family, GPS, PRISM and (x)-MIKE.
    (iii) THEREFORE EXACTLY ONE OF: BRANCH A -- the second claim's input is at rung G2-G5,
        the claims are compatible, and this goal acquires a precisely stated new open problem
        (produce that input cheaply for uniformly random j, or prove it cannot be produced);
        or BRANCH B -- the input is G1, in which case the goal's completion criterion 1 is
        already met by external work and the only correct action is rule-12 routing to
        independent review at the non-degradable tier.
    THE FLOOR DELIVERABLE, WHICH DOES NOT DEPEND ON OBTAINING THE SECOND PAPER AT ALL, is a
    dated and sourced baseline statement for the supersingular endomorphism problem, replacing
    KN-OPEN-013's 2026-07-23 "no sub-p^{1/4} attack is known" snapshot, which the frozen
    in-repo 2026/1486 input already postdates.

  mechanism: >-
    PROVENANCE IS PART OF THE MECHANISM AND BINDS EVERY SENTENCE.
    READ IN FULL IN THIS SESSION: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md. Quoted
    verbatim from its section 1: the endomorphism / isogeny problems "constitute the first
    entry in The Isogeny Problems [12]"; "The previous best algorithms to solve them had
    complexity p^{1/2} * (log p)^{O(1)}"; that complexity "had stayed remarkably stable, with
    subsequent improvements only impacting the logarithmic cofactor". From section 1.1: the
    affected list is "the CGL hash function [14], the SQIsign digital signature family
    [7, 19, 20, 22, 34] ... GPS signatures [28] and PRISM [5], and the (x)-MIKE key exchange
    [39]", and the algorithm "does not constitute a complete break".
    NOT READ, NOT FETCHED, RELAYED AT SECOND HAND: ePrint 2026/1586 in its entirety --
    existence, authorship, theorem statement, and the phrases "rank-4 CVP" and "exact Gram
    matrix in poly(log p)". THE RELAY SOURCE IS THE 2026-08-05 SCOUTING BRIEF, WHICH ITSELF
    LABELS THE ITEM "ABSTRACT ONLY" AND STATES THE BODY WAS NOT READ. NOTHING IN THIS RECORD
    ESTABLISHES ANYTHING ABOUT THAT PAPER.

    (A) WRITE BOTH CLAIMS WITH EXPLICIT QUANTIFIERS. This is the entire method and it costs
    nothing.
      CLAIM-1 (READ): THERE EXISTS an algorithm A1 such that FOR ALL primes p and FOR ALL
      supersingular E/F_{p^2} GIVEN BY ITS j-INVARIANT ALONE, A1 outputs a non-scalar
      endomorphism, and thence End(E), in expected time and memory p^{1/3+o(1)}, ASSUMING
      Heuristic 1, with the o(1) superpolynomial. Las Vegas.
      CLAIM-2 (RELAYED; TO BE REWRITTEN FROM THE SOURCE IN THE EXPERIMENT'S STAGE 1): THERE
      EXISTS A2 such that FOR ALL ... GIVEN ??? ... A2 outputs a Z-basis of End(E) and its
      Gram matrix in poly(log p). THE WHOLE ADJUDICATION IS THE "???".
    THE TRAP BEING HUNTED, STATED IN ADVANCE SO IT CANNOT BE FITTED AFTERWARDS: a witness --
    here the Z-basis -- that is allowed to depend on the instance cannot be produced by a
    procedure whose INPUT does not determine it. If A2's input is an abstract maximal order
    plus a curve, A2 solves a rank-4 lattice problem, which is genuinely poly(log p),
    genuinely useful, and NOT the endomorphism-ring problem, because matching an abstract
    order to a given j is exactly the hard step. If A2's input is j(E) alone, it IS the
    endomorphism-ring problem.

    (B) THE CONSEQUENCE CHAIN THAT MAKES THE FORK EXHAUSTIVE. RECALLED, UNVERIFIED, AND
    CARRIED AS HEUR-QUANT-2: given explicit maximal orders O1 = End(E1), O2 = End(E2), one
    computes a connecting ideal I with left order O1 and right order O2, applies KLPT to
    replace I by an equivalent ideal of smooth norm, and translates that ideal into an
    isogeny E1 -> E2, all in time polynomial in log p under the standard heuristics of that
    line. IF that holds AND A2 takes G1 input, THEN the supersingular isogeny problem is
    poly(log p) and the entire quoted history, the p^{1/3+o(1)} result, and every affected
    scheme's parameters are simultaneously wrong. A consequence that strong is exactly what
    makes a cheap audit worth running: it turns "read a preprint" into a decidable fork.

    (C) THE OBSERVATION COLLISION, RUN AS AN EXPERIMENT RATHER THAN ASSERTED. The observable
    carrying CLAIM-2 is the phrase "given E". Two ground-truth objects on opposite sides of
    the conclusion:
      OBJECT-X: a uniformly random supersingular j in F_{p^2}, presented as a j-invariant.
      OBJECT-Y: the same curve presented with a known small-degree endomorphism, or with an
      orientation by a small-discriminant order, or as a special CM / F_p-rational curve --
      inputs for which cheap endomorphism-ring recovery is uncontroversial and for which this
      goal's own orientation lane was CLOSED (DEC-20260804-3677f1 / EV-SSI-8aaad0).
    IF CLAIM-2'S STATEMENT DOES NOT SEPARATE X FROM Y, IDENTIFIABILITY FAILS AT THE STATEMENT
    LEVEL, and that is the deliverable independently of whether the mathematics is correct.

    (D) WHY THIS IS A DEFENSIBLE USE OF BUDGET NOW. GOAL-SSI-001's next_action says further
    progress "requires either a genuinely new mechanism or a model upgrade". A third option
    is cheaper than both: THE GOAL'S BASELINE MAY ALREADY HAVE MOVED, IN EITHER DIRECTION,
    AND THE GOAL HAS NOT CHECKED. KN-OPEN-013's framing is a 2026-07-23 snapshot; the frozen
    2026/1486 input postdates it; 2026/1586 is absent from the corpus entirely. Auditing the
    baseline is decisive regardless of how it resolves, and the floor deliverable is certain.

    (E) WHAT THE AUDIT MAY NOT DO, FIXED BEFORE IT RUNS. It may not output "the paper is
    wrong". Its only admissible outputs are: a RUNG ASSIGNMENT on the G1-G5 ladder (or a
    declared sixth, off-ladder rung), the two control verdicts, the verification status of
    (B), and the dated baseline statement. Dismissing an unread preprint because its
    conclusion is too strong is the premature-closure failure mode that the inventor protocol
    treats as symmetric with overclaiming, and the design forbids it structurally by making
    "wrong" not an available answer.

  assumptions:
    - >-
      That the relayed description of 2026/1586 is close enough to reality for the fork to be
      the right fork. THE EXPERIMENT'S STAGE 1 EXISTS SOLELY TO REMOVE THIS, and the audit may
      not proceed past it on the relay. If the paper cannot be obtained, the STRUCTURAL result
      stands and the specific claim is recorded UNADJUDICATED -- never refuted.
    - >-
      That "recovering End(E)" means producing a maximal order together with an explicit
      correspondence to the given curve, not producing some order or some lattice.
    - >-
      Academic / defensive cryptanalysis only, and no operational action of any kind. A
      branch-B outcome concerns schemes in an active NIST process and is automatically routed
      under AGENTS.md rule 12 to independent `review-breakthrough` at max, which this session
      cannot provide and does not claim.
    - >-
      NO STATUS CHANGE to KN-OPEN-013/014/015, KN-TECH-024/025/028/029/050, H-SSI-001, or the
      closed orientation lane is proposed or implied. The orientation CLOSURE is respected:
      oriented input appears here only as rung G3 of an input ladder, which is a different
      role from a mechanism, and a reviewer may reject even that reuse if the closure's scope
      forbids it.

  proof_search_map:
    bottleneck: >-
      The input encoding. Every complexity statement about End(E) recovery passes through an
      unstated choice of what the algorithm is handed, and that choice spans the entire
      complexity question. Fixing it is what makes the two claims comparable; leaving it
      unstated is what lets an exponential disagreement persist unexamined in a corpus whose
      whole baseline depends on the answer.
    baseline_embedding:
      parameter_slice: >-
        Rung G2 (j(E) plus one non-scalar endomorphism in efficient representation) is the
        exact slice that reproduces the KNOWN, uncontroversial baseline: from a single
        non-scalar endomorphism the full ring is recoverable by standard means, and it is
        precisely the output CLAIM-1's algorithm produces. So G2 is where the two claims must
        AGREE, and any audit procedure that reports them as contradictory at G2 has failed
        its own baseline embedding.
      reproduction_check: >-
        Symbolic and exact: the READ paper's section 1.4 states its own algorithm's output is
        a non-scalar endomorphism obtained as ϕ o φ with ϕ the Frobenius isogeny. Checking
        that the ladder places that output at G2 and that both claims are compatible there is
        a hard gate before any rung assignment for CLAIM-2 is attempted.
    observation_collision:
      observable: >-
        The quantifier prefix of an English complexity statement, together with the phrase
        naming its input.
      distinct_preimage_search: >-
        THE COLLISION IS EXHIBITED, NOT MERELY SOUGHT, AND IT IS THE RECORD'S CONTENT: the
        five rungs G1-G5 are five distinct computational problems that all project to the
        single observable "compute End(E) given E", and they sit on OPPOSITE SIDES of the
        claimed conclusion -- G1 is the hard problem this goal exists to study, G4 is a rank-4
        lattice problem. A five-element fibre over the observable is a direct falsifier of the
        uniform reading of any statement written with that observable, UNLESS an additional
        condition in the statement separates them. Finding that separating condition, or
        recording its absence, is exactly what the audit does.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move each claim from prose into a model where the disagreement is an exact
          condition: a triple (input alphabet, promise, output specification). ENCODING
          obligation: CLAIM-1 is transcribed from the frozen text, CLAIM-2 from its abstract.
          COMPLETENESS: the ladder must admit an off-ladder sixth rung rather than forcing a
          fit. SOUNDNESS: the null control guards against manufacturing contradictions.
          TRANSFER: none is claimed beyond these two statements. COST-LOSS: none; the audit
          costs nothing.
        predicted_gain: >-
          Converts an exponential apparent disagreement into a named rung, which is a
          mechanism rather than a verdict, and which names exactly what would have to be
          produced cheaply for the second claim to bear on this goal.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable ("given E") fixed and vary the forgotten structure (the
          encoding). The intrinsic invariant proposed to distinguish the resulting problems
          is the cost of PRODUCING the input for a uniformly random supersingular j -- which
          is 0 for G1 and is exactly the hard problem for G2, G3, G4.
        predicted_gain: >-
          Gives a single quantity ("what does it cost to manufacture this input?") that
          orders the ladder and makes the rung assignment checkable rather than rhetorical.
    quantifier_order: >-
      THE AUDIT'S OWN CLAIM, WRITTEN OUT: FOR EACH of the two statements THERE EXISTS a rung
      G in {G1,...,G5, off-ladder} such that the statement's hypotheses are satisfied at G and
      not below it, AND the two statements are jointly consistent if and only if not both sit
      at G1. The witness (the rung) is allowed to depend on the statement -- that is the
      point -- but NOT on the reader, so two independent auditors must assign the same rung or
      the audit has failed. The weaker order -- THERE EXISTS a reading under which the papers
      agree -- is trivially satisfiable and is EXPLICITLY NOT CLAIMED.
      THE TRAP IN THE AUDITED CLAIMS: CLAIM-1 is "THERE EXISTS A1, FOR ALL p, FOR ALL E given
      by j" -- a uniform algorithm over a fully specified input. CLAIM-2's prefix is unknown
      and the audit's product is precisely its recovery. A claim of the form "FOR ALL E THERE
      EXISTS a presentation under which End(E) is computable in poly(log p)" is TRUE AND
      VACUOUS (take the presentation to be End(E) itself), and distinguishing it from the
      uniform reading is the single most likely resolution.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: a rung assignment for two statements, two control verdicts, a verification
        status for the KLPT consequence chain, and a dated sourced baseline sentence. It
        cannot certify that either paper is correct or incorrect, cannot establish any
        complexity bound, cannot move any exponent, cannot measure anything, and cannot close
        KN-OPEN-013 -- it can only DATE it.
      nearby_object_control: >-
        THE NEAREST OBJECT ON WHICH THE HOPED-FOR CONCLUSION (an inconsistency) IS KNOWN
        FALSE IS A PAIR OF STATEMENTS FROM THE SAME READ PAPER: Theorem 1.1 (complexity
        p^{1/3+o(1)}) and Theorem 1.5 (every E admits an isogeny to E^{(p)} of degree at most
        (p/2)^{1/3}). They are compatible, they superficially concern the same objects, and a
        careless procedure WILL flag them -- conflating a DEGREE with a RUNNING TIME is
        exactly the error available here. The audit procedure MUST return COMPATIBLE on that
        pair. If it manufactures a contradiction there, it cannot distinguish a real
        disagreement from a superficial one and NO verdict elsewhere is admissible.
    proof_obligations:
      - claim: >-
          The five rungs G1-G5 are distinct computational problems, not restatements.
        responsibility: correctness
      - claim: >-
          Both claims are compatible at rung G2, which reproduces the uncontroversial baseline.
        responsibility: baseline
      - claim: >-
          Two known maximal orders yield a connecting isogeny in poly(log p) (KLPT line).
        responsibility: feasibility
      - claim: >-
          The audit procedure returns COMPATIBLE on the same-paper null pair and INCONSISTENT
          on the synthetic positive-control pair.
        responsibility: strictness
      - claim: >-
          The verdict sequence across G1-G5 is monotone in "amount given".
        responsibility: correctness
      - claim: >-
          Every output sentence carries a provenance label; an unlabelled sentence is an
          integrity failure of the package.
        responsibility: interface
      - claim: >-
          Nothing here establishes any fact about ePrint 2026/1586, and a branch-B outcome is
          routed under rule 12 rather than acted on.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    DELIBERATELY NULL. NO COMPLEXITY CLAIM IS MADE BY THIS RECORD. The exponents it discusses
    -- p^{1/3+o(1)} from a read source, poly(log p) from an unread one -- belong to their
    authors. The audit's output is a rung, two control verdicts, and a dated baseline
    sentence. sota_delta on every attack axis is zero; the Pareto rows checked are enumerated
    in IDEA-20260805-d66193, and the relayed poly(log p) row is deliberately EXCLUDED from
    the frontier because including an unverified row would be exactly the error this record
    exists to prevent.

  heuristic_assumptions:
    - id: HEUR-QUANT-1
      formal_statement: >-
        NOT LOAD-BEARING. The ladder, the collision, and the quantifier rewriting are
        definitional: five rungs are five input alphabets, and a quantifier prefix is syntax.
        No distributional or probabilistic assumption enters the structural result.
      random_model_justification: n/a -- no random quantity appears.
      supporting_results:
        - >-
          READ: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md sections 1, 1.1, 1.3, 1.4, 1.5.
      validation_experiment_ids: [EXP-SSI-3980e3]
      falsification_condition: >-
        The null control returns INCONSISTENT on the same-paper pair, or the positive control
        returns COMPATIBLE on the synthetic inconsistent pair. Either way the procedure is
        broken and nothing is reported.
    - id: HEUR-QUANT-2
      formal_statement: >-
        LOAD-BEARING FOR THE FORK'S EXHAUSTIVENESS. THERE EXISTS a polynomial-time algorithm
        that, GIVEN explicit maximal orders O1 and O2 in B_{p,infinity} together with curves
        E1, E2 and isomorphisms Oi = End(Ei), outputs an isogeny E1 -> E2 of smooth degree in
        efficient representation, in time polynomial in log p, under the standard heuristics
        of the KLPT line.
      random_model_justification: >-
        RECALLED, UNVERIFIED. NO SOURCE FOR THIS WAS READ IN THIS SESSION. It is the single
        step that upgrades "two numbers disagree" to "at most one can be about j-only input",
        and it is therefore the first thing a reviewer should attack.
      supporting_results:
        - >-
          NOT RETRIEVED. Candidate corpus records to check are KN-TECH-025 and KN-TECH-028;
          neither was read here, and naming them is a pointer, not a citation.
      validation_experiment_ids: [EXP-SSI-3980e3]
      falsification_condition: >-
        The reduction cannot be verified against a source. The fork is then WEAKENED in the
        output from "at most one can hold" to "the two are in tension", explicitly, and the
        branch-B language is removed rather than defended.
    - id: HEUR-QUANT-3
      formal_statement: >-
        Any baseline statement citing 2026/1486 inherits its Heuristic 1 verbatim: for
        uniformly random supersingular E/F_{p^2}, the degree of the smallest isogeny
        E -> E^{(p)} is B-smooth with probability at least u^{-u(1+o(1))} where
        u = log(p/2)/(3 log B), uniformly as p -> infinity for
        (log p)^eps < u < (log p)^{1-eps}.
      random_model_justification: >-
        Quoted verbatim from the READ text. It is a CONDITION, not a support, and it is
        recorded here so that the audit's baseline sentence cannot silently drop it.
      supporting_results:
        - >-
          READ: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md section 1.5, which states the
          heuristic and its justification via Theorem 1.4 (the classical smooth-number count)
          and Theorem 1.5 (the degree bound).
      validation_experiment_ids: []
      falsification_condition: >-
        The audit emits a baseline statement that presents p^{1/3+o(1)} as unconditional. That
        would present a heuristic-conditional result as unconditional, which
        docs/target-result-profile.md forbids, and the package is then malformed.

  structural_ingredients:
    - description: >-
        The p^{1/3+o(1)} time-and-memory algorithm for the supersingular endomorphism problem,
        its Heuristic 1, its affected/safe scope statement, and the p^{1/2}(log p)^{O(1)}
        history it supersedes.
      citation: >-
        inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, READ IN FULL IN THIS SESSION; externally
        identified in the 2026-08-05 sweep as ePrint 2026/1486 (that identification is
        RELAYED and is not required by anything here).
      role: CLAIM-1, and the source of the dated baseline sentence
    - description: >-
        A claimed poly(log p) recovery of a Z-basis of End(E) with its exact Gram matrix.
      citation: >-
        ePrint 2026/1586 -- NOT READ, ABSTRACT NOT FETCHED IN THIS SESSION, RELAYED FROM THE
        2026-08-05 SCOUTING BRIEF WHICH ITSELF LABELS THE SOURCE ABSTRACT ONLY. NOTHING IN
        THIS RECORD IS EVIDENCE ABOUT THIS PAPER.
      role: CLAIM-2, to be transcribed in the experiment's stage 1 or recorded UNRUN
    - description: >-
        Connecting-ideal plus KLPT translation from two known endomorphism rings to a
        smooth-degree isogeny in polynomial time.
      citation: >-
        RECALLED, UNVERIFIED, NO SOURCE READ. Carried as HEUR-QUANT-2 and its verification is
        a declared obligation.
      role: makes the branch A / branch B fork exhaustive; if unverified, the fork weakens

  reduction_chain:
    core_problem: >-
      Locate, on a declared ladder of input encodings, the rung at which each of two 2026
      complexity claims about End(E) recovery has its hypotheses satisfied, and decide whether
      the pair is jointly consistent.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. No downstream problem is reached. In particular a branch-A outcome
      does NOT close, narrow, or advance KN-OPEN-013; it DATES it and replaces its stale
      snapshot with a sourced sentence, which is a different and smaller thing.

  predictions:
    - metric: >-
        given_level: the lowest rung in {G1,...,G5, off-ladder} at which CLAIM-2's stated
        hypotheses are satisfied, after reading the source
      direction: different
      minimum_effect: >-
        'PRE-REGISTERED PRIOR, FIXED BEFORE ANY FETCH: G4 (an abstract maximal order is given)
        is the single most likely rung; G1 is the branch-B outcome. THE PREDICTION IS NOT
        THAT G4 IS RIGHT -- it is that a rung is assignable. An audit that cannot name a rung,
        or that assigns one without quoting the hypothesis sentence that places it there, has
        not produced its deliverable.'
    - metric: >-
        null_control_verdict: the procedure''s verdict on Theorem 1.1 versus Theorem 1.5 of
        the READ paper (same paper, known compatible)
      direction: different
      minimum_effect: >-
        'COMPATIBLE, with the reason stated explicitly (Theorem 1.5 bounds a DEGREE for every
        curve; Theorem 1.1 bounds a RUNNING TIME; they quantify over different objects). Any
        other verdict means the procedure manufactures contradictions and NOTHING ELSE MAY BE
        REPORTED. This null CAN fail -- conflating a degree bound with a time bound is the
        available error and a careless procedure will make it.'
    - metric: >-
        positive_control_verdict: the procedure''s verdict on the synthetic pair "End(E) is
        computable in poly(log p) for all supersingular E/F_{p^2} given j(E)" versus "the
        supersingular isogeny problem requires p^{1/3-o(1)}"
      direction: different
      minimum_effect: >-
        'INCONSISTENT, with the connecting reduction named as the reason. If the procedure
        returns COMPATIBLE here it cannot detect a real contradiction, and no negative from
        the treatment arm is admissible.'
    - metric: >-
        ladder_monotonicity: whether the contentiousness verdict across G1..G5 is monotone in
        the amount given
      direction: different
      minimum_effect: >-
        'MONOTONE. More given cannot make a poly(log p) claim more contentious. A non-monotone
        sequence means the procedure is not responding to the amount given and its rung
        assignment is uninterpretable.'
    - metric: >-
        consequence_chain_status: whether HEUR-QUANT-2 is verified against a source or a
        corpus record
      direction: different
      minimum_effect: >-
        'Binary, and REPORTED BEFORE the fork is applied so it cannot be reported selectively.
        If unverified, the output must say "in tension" and must not say "at most one can
        hold".'
    - metric: >-
        baseline_delta: the dated sourced baseline sentence produced for the supersingular
        endomorphism problem
      direction: different
      minimum_effect: >-
        'PRODUCED IN EVERY OUTCOME, INCLUDING WHEN STAGE 1 IS UNRUN. It must carry: the
        exponent, the memory, the conditionality (Heuristic 1 verbatim), the o(1)
        superpolynomial disclosure, the affected/safe scope lists, the source, and the date.
        This is the floor deliverable and its absence means the audit did not finish.'

  test_boundary:
    instances:
      - >-
        CLAIM-1: Theorem 1.1 of inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, transcribed from
        the frozen in-repo text.
      - >-
        CLAIM-2: the main theorem of ePrint 2026/1586 as stated on its ABSTRACT page, if
        obtainable; otherwise recorded UNRUN.
      - >-
        NULL PAIR: Theorem 1.1 versus Theorem 1.5 of the same READ paper.
      - >-
        POSITIVE-CONTROL PAIR: the synthetic inconsistent pair stated in predictions.
    parameters:
      ladder_rungs: [G1_j_only, G2_j_plus_endomorphism, G3_j_plus_orientation, G4_abstract_maximal_order, G5_special_CM_or_Fp_rational]
      off_ladder_allowed: true
      provenance_labels: [READ, ABSTRACT_ONLY, RELAYED, RECALLED_UNVERIFIED, NOT_OBTAINED]
      branch_outcomes: [A_input_above_G1, B_input_is_G1, UNADJUDICATED]
    implementation: >-
      Reading and writing only. Stage 0 requires NO network and NO compute. Stage 1 is a
      single HTTP GET to an ePrint ABSTRACT page; the 2026-08-05 sweep measured ePrint
      abstract pages at HTTP 200 and PDF bodies at 403, but THAT MEASUREMENT IS RELAYED and
      must be re-established in-harness, with the UNRUN disposition covering its failure.
    budget:
      stage0_wall_clock_seconds: 10800
      stage0_compute: "zero; zero network"
      stage1_wall_clock_seconds: 3600
      stage23_wall_clock_seconds: 7200
      maximum_memory_gb: 1
      network_required: "stage 1 only; every other stage is offline"

  falsification_conditions:
    - >-
      F1 (HARD GATE): the null control returns INCONSISTENT on the same-paper pair. The
      procedure manufactures contradictions; nothing is reported.
    - >-
      F2 (HARD GATE): the positive control returns COMPATIBLE on the synthetic inconsistent
      pair. The procedure is blind; nothing is reported.
    - >-
      F3: HEUR-QUANT-2 cannot be verified. The fork's exhaustiveness fails; the output is
      weakened to "in tension" and the branch-B language is removed.
    - >-
      F4: ePrint 2026/1586 does not exist, or its abstract is structurally different from the
      relay. The relayed premise is wrong, the record says so plainly, and the ladder is
      applied to whatever is actually there.
    - >-
      F5: the verdict sequence across G1-G5 is non-monotone. The rung assignment is
      uninterpretable and must not be reported as one.
