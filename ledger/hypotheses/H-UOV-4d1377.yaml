  predictions:
  - metric: >-
      G1 - NULL-P first-fall degree at each even-n core cell (3,3), (7,5),
      (6,4), (8,6)
    direction: different
    minimum_effect: >-
      'EXACTLY 2, 4, 5, 4 respectively, the frozen semi-regular values. Exact,
      not within a tolerance: these are integers and a tolerance would make the
      control vacuous. A miss at any cell blocks every treatment conclusion at
      that cell.'
  - metric: >-
      G2 - d_ff(TREAT) - d_ff(NULL-P) at each even-n core cell, at two seeds and
      two independent choices of (L_1, L_2)
    direction: lower
    minimum_effect: >-
      'PRE-REGISTERED NULL VALUE EXACTLY 0 at every cell. A reportable departure
      requires <= -1 at three or more of the four even-n core cells, at every
      seed and both L-choices, with G1 passing at those cells. Anything less is
      reported as noise, and the fact that four cells is a small ladder is
      stated as a limitation rather than compensated for by loosening the rule.'
  - metric: >-
      G3 - POS arm, deficit at D = d_reg on the zero-constraint system at every
      cell with 3m - n >= 2
    direction: higher
    minimum_effect: >-
      'AT LEAST 1, and this control MUST FIRE. A positive-dimensional solution
      set forces the Hilbert function to stabilise to a polynomial of degree
      t = 3m - n - 1 rather than to a constant, so a strictly positive deficit
      is forced by the construction. IF G3 RETURNS 0 THE INSTRUMENT CANNOT SEE A
      FORCED DEGREE FALL AND NO NEGATIVE RESULT MAY BE REPORTED FROM ANY ARM.'
  - metric: >-
      G4 - graded monotonicity: deficit(d_reg) as a function of t over
      c = 0..3m-n-1 at cell (8,6), giving t = 3, 2, 1, 0
    direction: lower
    minimum_effect: >-
      'STRICTLY DECREASING across all four interior points. Monotone by
      derivation. A non-monotone reading localises the break to a specific
      solution dimension instead of leaving "it did not work", and that
      localisation is itself a deliverable.'
  - metric: >-
      G5 - generator count of the TREAT system, and the disposition of the two
      lost equations
    direction: different
    minimum_effect: >-
      'EXACTLY 3m - 2 nonzero generators, with the two losses appearing as
      IDENTICALLY ZERO polynomials before removal, since the field has
      characteristic 2. A builder emitting 3m nonzero rows, or removing the two
      as duplicates, does not implement the derivation and the package is
      invalid rather than merely wrong.'
  - metric: >-
      G6 - measured projective dimension of the unconstrained solution space at
      the two smallest cells, by exhaustive search over F_16
    direction: higher
    minimum_effect: >-
      'AT LEAST 3m - n - 1, derived in P1. A measured value BELOW the derived
      bound falsifies P1, terminates the line, and is the cheapest available
      refutation of this record''s own mathematics - it costs seconds and it
      runs before anything expensive.'
  - metric: >-
      G7 - NULL-P versus NULL-U deficit sequences at every core cell
    direction: different
    minimum_effect: >-
