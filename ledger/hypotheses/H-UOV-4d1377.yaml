  - metric: >-
      G8 - L-choice spread: the range of deficit(d_reg) across the two
      independent choices of (L_1, L_2) at each cell, reported BEFORE any
      treatment-null gap is reported
    direction: lower
    minimum_effect: >-
      'Strictly below the treatment-null gap at the same cell. IF THE SPREAD IS
      COMPARABLE TO OR LARGER THAN THE GAP, THE MEASUREMENT IS OF THE CHOICE AND
