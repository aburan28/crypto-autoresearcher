  test_boundary:
    instances:
    - >-
      Random UOV keys over F_16 generated in-harness from a declared seed
      derivation, with the oil space in echelon form O = span of columns of
      [O' ; I_m], O' uniform in F_q^{v x m}.
    - >-
      CORE LADDER, even n only, so that invertible alternating polar forms
      exist: (v, m) = (3,3) n=6, (7,5) n=12, (6,4) n=10, (8,6) n=14.
    - >-
      ODD-n ARM, reported separately and never pooled with the core:
      (4,3) n=7, (5,4) n=9, (6,5) n=11. At these cells every alternating matrix
      is singular over a field of characteristic 2 and the construction of
      L_1, L_2 requires a declared substitute; the arm exists to record that
      fact rather than to hide it.
    - >-
      STRETCH CELLS, outside the completion gate: (9,6) n=15 (odd), (10,7) n=17
      (odd). Both are odd-n and both have Macaulay matrices above 6,000 columns;
      they are listed so that a later contract can pick them up, not run here.
    - >-
      Degrees D from 2 to d_reg + 1 per cell. D beyond d_reg + 1 is out of scope.
    - >-
      Arms TREAT, NULL-P, NULL-U, POS, GRADE-c. The odd-n arm carries only
      TREAT and NULL-P.
    parameters:
      field: GF(16)
      q: 16
      core_cells_v_m: [[3, 3], [7, 5], [6, 4], [8, 6]]
      odd_n_arm_v_m: [[4, 3], [5, 4], [6, 5]]
      stretch_cells_v_m: [[9, 6], [10, 7]]
      M_rule: "M = 3m - 2"
      N_rule: "N = 2n - 3m"
      frozen_dreg_core: {"3,3": 2, "7,5": 4, "6,4": 5, "8,6": 4}
      frozen_dreg_odd_n_arm: {"4,3": 3, "5,4": 3, "6,5": 3}
      seeds: [1, 2, 2026]
      l_choices_per_cell: 2
      max_invertibility_trials: 100
    implementation: >-
      Written from scratch for this experiment. There is no Sage, no sympy and
      no Groebner engine in this container (SESSION-VERIFIED 2026-08-05; numpy
      2.4.6 is present). Required components: GF(16) log/antilog tables; UOV key
      generation in block form; polar-form assembly; an invertibility search
      over F_q-combinations of the polar forms; monomial indexing for degree
      <= D in N variables; Macaulay assembly per clause (5); blocked exact
      GF(16) Gaussian elimination over numpy uint8 with a persisted system hash
      and per-block pivot receipts. The existing repository instrument
      src/ic_first_fall_fast.py is NOT reusable - it is F_2 by construction
      (Boolean monomials as frozensets, XOR cancellation, x_i^2 = x_i) and it
      does not import.
    budget:
      stage0_wall_clock_seconds: 3600
      stage1_wall_clock_seconds: 600
      stage1_compute: "integer arithmetic only; no linear algebra"
      stage2_wall_clock_seconds: 900
      stage3_wall_clock_seconds_ceiling: 10800
      stage3_maximum_memory_gb: 8
      stage3_note: >-
        Stage 3 is NOT authorized by this record. GOAL-UOV-001 is status draft
        with next_action naming ideation only, and no Coordinator approval
        exists. Stage 3 requires a Stage-1 and Stage-2 pass plus a separate
        committed Coordinator authorization.

