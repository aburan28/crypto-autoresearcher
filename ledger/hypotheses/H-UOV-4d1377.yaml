    departure from semi-regularity.'

  interpretation_limits:
  - >-
    CLAIM TIER toy, and no downstream citation may raise it. Cells with m <= 6
    over F_16 say nothing about (256, 112, 44). AGENTS.md rules 4 and 7 apply
    with full force.
  - >-
    A CONTROLLED NULL CLOSES THE TESTED TOY RANGE ONLY. It does not establish
    semi-regularity at deployed sizes, where d_reg is 20 to 37 and the Macaulay
    matrix has 2^72 to 2^144 columns and can never be built. Forward guidance is
    mandatory in either direction: what remains open is the behaviour at larger
    m, over F_256 rather than F_16, at k = 3 where the parameter condition is
    5m > 2n, and for the hybridised systems with g variables guessed - which
    IDEA-20260805-69af7c's frontier depends on and which this experiment does
    NOT test.
  - >-
    THIS IS AN INSTRUMENT AND MODEL CALIBRATION, NOT A MECHANISM FINDING ABOUT
    UOV. Nothing here supports or weakens any claim that UOV is or is not
    secure. It measures one input to a cost model.
  - >-
    THE ODD-n ARM IS NOT COMPARABLE TO THE CORE. Four of the seven naive cells
    have n odd, where no invertible alternating form exists over a field of
    characteristic 2, so those cells require a different construction and their
    numbers may not be pooled with the core ladder under any circumstances.
