  - >-
    'F7 - a treatment-null gap appears but does not decay as cell size grows, or
    grows without bound across (3,3) -> (6,4) -> (7,5) -> (8,6). Per
    inventor-protocol section 3 a quantity that fails to decay when the
    parameter meant to destroy it increases is the canonical artifact tell; the
