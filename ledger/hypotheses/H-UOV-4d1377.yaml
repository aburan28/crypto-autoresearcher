    core_problem: >-
      Determine whether the graded Macaulay rank profile of the k = 2
      UOV intersection-attack system over F_16 at toy cells equals the
      semi-regular prediction, against a matched planted-solution null.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. There is no reduction from this measurement to any
