hypothesis:
  id: H-UOV-4d1377
  question_id: RQ-UOV-001

  statement: >-
    SCOPE: the k = 2 intersection-attack system derived from a random UOV key
    over F_16, at toy cells (v, m) in {(3,3), (4,3), (5,4), (6,5), (7,5),
    (6,4), (8,6)} with 3m > n, Macaulay degrees D <= d_reg + 1, exact GF(16)
    rank, one instrument lineage written for this experiment. CLAIM TIER toy.
    NO ATTACK, NO KEY RECOVERY, NO EXPONENT, NO STATEMENT ABOUT ANY DEPLOYED
    PARAMETER SET.
    The hypothesis has three parts and they fail independently.
    (P1, STRUCTURAL, DERIVED, ZERO COMPUTE) For every UOV key, every index a and
    every u, w in the oil space O, the polar form satisfies u^T P'_a w = 0;
    hence P'_a O is contained in O-perp, whose dimension is n - m; hence for any
    two invertible polar-form combinations L_1, L_2 the intersection
    L_1 O intersect L_2 O has dimension at least 3m - n. P1 is a theorem, it is
    proved in the mechanism, and the experiment verifies it computationally at
    toy cells because a computational refutation of a claimed theorem is worth
    more than the theorem.
    (P2, COUNTING, DERIVED) The system whose solution set is that intersection,
    after imposing the 3m - n - 1 linear constraints P1 licenses, consists of
    EXACTLY M = 3m - 2 nonzero quadratic equations in EXACTLY N = 2n - 3m
    variables, with the two lost equations vanishing identically over a field of
    characteristic 2 and coinciding as duplicates in odd characteristic.
    (P3, THE HEURISTIC UNDER TEST, NOT DERIVED) That system is SEMI-REGULAR over
    the tested range: its first-fall degree equals the index of the first
    non-positive coefficient of [(1 - z^2)^M / (1 - z)^N]_+, whose frozen values
    at the seven core cells are 2, 3, 3, 3, 4, 5, 4 respectively, and its graded
    Macaulay rank profile is indistinguishable from that of a matched random
    system with a planted projective solution.
    P3 IS THE ASSUMPTION THE PUBLISHED UOV KEY-RECOVERY COST MODEL RESTS ON, AND
    IT IS THE ONE THIS HYPOTHESIS EXPECTS TO BE TRUE. The deliverable if P3
    holds is a controlled null and the first measured calibration point this
    program has for any multivariate scheme. The deliverable if P3 fails is a
    measured integer gap, at named cells, in the direction that makes the
    published model optimistic about security.

  mechanism: >-
    DERIVED IN-REPO ON 2026-08-05. NO SOURCE WAS READ FOR ANY STEP. The
    supporting numbers marked SESSION-COMPUTED were produced in this session's
    scratchpad with Python's standard library and MUST be recomputed inside the
    harness before any of them is cited; that recomputation is Stage 1 of
    EXP-UOV-cd7536 and it can terminate the line.

    OBJECTS. Field F_q, q a power of 2 in the deployed case and q = 16 in the
    tested one. Parameters m (equations), v (vinegar), n = v + m. Public key
    P = (p_1, ..., p_m), each p_l a quadratic form on F_q^n. Secret: a subspace
    O of F_q^n with dim O = m on which every p_l vanishes identically. Polar
    form P'_l(u, w) = p_l(u + w) - p_l(u) - p_l(w); its matrix P'_l is
    symmetric, and in characteristic 2 alternating (zero diagonal).

    P1 - THE CONTAINMENT AND THE SURPLUS.
    p_l vanishes identically on O, so for u, w in O we have
    P'_l(u, w) = p_l(u + w) - p_l(u) - p_l(w) = 0. Read as a dot product,
    u^T (P'_l w) = 0 for every u in O, i.e.
        P'_l O  is contained in  O-perp,   dim O-perp = n - m = v,
    for every l, and hence for every F_q-combination of the P'_l. If L is an
    invertible such combination then dim(L O) = m. Two m-dimensional subspaces
    of a v-dimensional ambient space intersect in dimension at least 2m - v,
    so with v = n - m,
        dim(L_1 O  intersect  L_2 O)  >=  3m - n,
    and for k of them, dim >= km - (k-1)v = (2k-1)m - (k-1)n. The attack regime
    n < (2k-1)m/(k-1), which for k = 2 is the familiar n < 3m, is thus DERIVED
    rather than quoted. Characteristic-2 caveat, carried not hidden: an
    alternating matrix over a field has even rank, so an invertible L requires
    n even; if a parameter set has n odd the construction must be rebuilt and
    the experiment halts on that condition.

    P2 - THE SYSTEM AND ITS EXACT SIZE.
    Seek x with L_i^{-1} x in O for i = 1, 2; write u_i = L_i^{-1} x. The
    complete condition set is one block of m equations per unordered index pair:
        p_l(u_1) = 0,  p_l(u_2) = 0,  P'_l(u_1, u_2) = 0,   l = 1..m,
    i.e. 3m quadratic forms in x. Take L_i = P'_{a_i}. Then the cross-block
    equation at l = a_1 is
        P'_{a_1}(L_1^{-1}x, L_2^{-1}x) = x^T L_1^{-1} P'_{a_1} L_2^{-1} x
                                       = x^T L_2^{-1} x,
    using L_1 = P'_{a_1} and symmetry. In ODD characteristic that is exactly the
    diagonal-block equation {2,2} at l = a_2, so the two coincide - a DUPLICATE.
    In CHARACTERISTIC 2, L_2^{-1} is alternating and x^T A x vanishes
    identically for alternating A, so the equation is 0 = 0 - VACUOUS. The same
    computation at l = a_2 removes one more. Hence exactly two of the 3m are
    lost, by different mechanisms in the two characteristics, and
        M = 3m - 2   (generally M = m*k(k+1)/2 - k(k-1)).
    The system is homogeneous, costing one projective degree of freedom, and P1
    guarantees a solution space of projective dimension at least 3m - n - 1, so
    that many further independent linear constraints may be imposed while a
    solution is still expected. Therefore
        N = (n - 1) - (3m - n - 1) = 2n - 3m
        (generally N = kn - (2k-1)m).
    BOTH COUNTS FOLLOW FROM P1 ALONE. That the same two counts are, on
    recollection, the ones the published analysis uses is recorded as
    CORROBORATION OF THE DERIVATION and never as a citation; reconciling them
    against the actual text is Stage 0.

    P3 - WHY SEMI-REGULARITY IS NOT OBVIOUS HERE, AND WHAT THE NULL MUST MATCH.
    The published cost model reads the solving degree off the semi-regular
    Hilbert series [(1 - z^2)^M / (1 - z)^N]_+ and costs the linear algebra as
    about 3 * C(N + d_reg - 1, d_reg)^omega * C(N+1, 2). Two structural facts
    stand against the assumption, and they are the whole content of P3.
      (a) THE PENCIL. The M forms are not M independent generic quadratics.
      They are the images of ONE m-dimensional pencil, span{P'_1, ..., P'_m},
      under three FIXED congruences A -> L_i^{-1} A L_j^{-1} for (i,j) in
      {(1,1), (2,2), (1,2)}. Semi-regularity is a general-position statement;
      three twisted copies of one m-dimensional space are not evidently in
      general position, and whether the twisting produces syzygies below the
      semi-regular degree is an empirical question this corpus has never asked.
      (b) THE SOLUTION. A random system with M > N over F_q has no F_q-point
      with overwhelming probability; the intersection system HAS one by
      construction. Therefore the matched null is NOT a random system of the
      same (M, N, q) - which is what the only prior UOV proposal in this corpus,
      IDEA-20260801-014, specifies - but a random system of the same (M, N, q)
      WITH A PLANTED PROJECTIVE POINT. Choosing the unplanted null is the single
      most likely way to manufacture a spurious effect here, and the design
      runs BOTH nulls side by side so that the choice is measured rather than
      argued.

    FORCED VALUES, FROZEN BEFORE ANY RUN (SESSION-COMPUTED, to be recomputed
    in-harness at Stage 1). Semi-regular d_reg of (M, N) = (3m - 2, 2n - 3m)
    over F_16 at the seven core cells (v, m):
        (3,3) M=7  N=3   d_reg=2       (4,3) M=7  N=5   d_reg=3
        (5,4) M=10 N=6   d_reg=3       (6,5) M=13 N=7   d_reg=3
        (7,5) M=13 N=9   d_reg=4       (6,4) M=10 N=8   d_reg=5
        (8,6) M=16 N=10  d_reg=4
    and at two optional stretch cells (9,6) M=16 N=12 d_reg=5, (10,7) M=19 N=13
    d_reg=5. Macaulay sizes at D = d_reg + 1 run from 28 x 20 at (3,3) to
    4576 x 3003 at (8,6); the stretch cells reach 29120 x 18564 and are outside
    the completion gate for that reason.

    WHAT IS NOT DERIVED, AND IS THE WEAKEST LINK. Nothing in this mechanism
    predicts WHETHER the pencil structure of (a) lowers the solving degree. P3
    is stated as the null and the experiment is designed so that the boring
    outcome - agreement - is the pre-registered one. The second weakest link is
    the toy-to-deployed extrapolation, which is not attempted here at all and is
    carried as HEUR-UOV-A3 so that any later cost model must display it.

  assumptions:
  - >-
    FROZEN PROTOCOL Phi, complete and parameter-free, fixed BEFORE any
    evaluation. (1) Field F_16 with a fixed primitive polynomial recorded in the
    contract; all arithmetic exact via log/antilog tables. (2) Cells (v, m) as
    listed; n = v + m; require 3m - n >= 1. (3) M = 3m - 2, N = 2n - 3m.
    (4) Semi-regular series H(z) = [(1 - z^2)^M / (1 - z)^N], h_k = [z^k]H,
    truncated at the first non-positive coefficient; d_reg = min{k : h_k <= 0};
    sr_pred(D) = C(N + D, D) - sum_{k <= D, h_k > 0} h_k. THE TRUNCATION
    CONVENTION IS PART OF THE CONTRACT AND IS NOT ADJUSTABLE AFTER ANY NUMBER IS
    SEEN. (5) Macaulay matrix at degree D: rows are m_mu * f for every generator
    f and every monomial mu with deg(mu) <= D - 2; columns are all monomials of
    degree <= D in N variables. (6) deficit(D) = sr_pred(D) - rank(D).
    (7) d_ff = min{D : deficit(D) > 0}. (8) The arms are TREAT (the derived
    intersection system), NULL-P (planted-solution random system), NULL-U
    (unplanted random system), POS (zero linear constraints imposed), and
    GRADE-c for c = 0..3m-n-1. NO OTHER DEGREE OF FREEDOM EXISTS. Any change to
    (1)-(8) after any measurement requires a versioned protocol amendment with
    confirmatory status exploratory_only, and is never an edit.
  - >-
    That at least two invertible F_q-combinations of the polar forms exist at
    each cell. Over F_16 with n even this holds with probability bounded below
    by a constant; the experiment RECORDS THE NUMBER OF TRIALS rather than
    assuming the first attempt succeeds, and a cell where no invertible
    combination is found in 100 trials is reported as a construction failure,
    not as a result.
  - >-
    That n is even at every tested cell. Cells (3,3) n=6, (4,3) n=7, (5,4) n=9,
    (6,5) n=11, (7,5) n=12, (6,4) n=10, (8,6) n=14 - FOUR OF THE SEVEN HAVE n
    ODD. Over a field of characteristic 2 every alternating matrix of odd size
    is singular, so at (4,3), (5,4), (6,5) and (9,6) NO invertible polar form
    exists and L_1, L_2 must instead be taken from a different construction.
    THIS IS A REAL DEFECT IN THE NAIVE CELL LIST AND IT IS RECORDED HERE RATHER
    THAN DISCOVERED AT RUNTIME: the contract's stopping rules require the
    executor to detect it, and the resolution declared in advance is to restrict
    the CORE ladder to even-n cells (3,3), (7,5), (6,4), (8,6) and to treat the
    odd-n cells as an ODD-n ARM run with a declared substitute construction,
    reported separately and never pooled with the core.
  - >-
    That the semi-regular prediction is the right null for a system built over
    F_16 without field equations. Field equations x^16 = x contribute only at
    degree 16 and every tested degree is at most 6, so they are inert. This is
    a derivation, not an assumption, and it is stated because the only
    solving-degree instrument in this repository is F_2-based, where the field
    equations are degree 2 and are NOT inert - the two settings are not the
    same object and no convention may be carried across.
  - >-
    That exact GF(16) rank is computed with a reproducible pivot order, a
    persisted system hash, and per-block receipts. There is no Sage, no sympy
    and no Groebner engine in this container (SESSION-VERIFIED 2026-08-05:
    `import numpy` succeeds at 2.4.6, `import sympy` and `import sage` both
    fail, and src/ic_first_fall_fast.py fails to import on `from sage.all
    import GF, Matrix`). The rank routine must therefore be written from
    scratch, and a first-run rank routine is the most likely source of a
    spurious deficit.

  proof_search_map:
    bottleneck: >-
      The step at which the published UOV key-recovery exponent is fixed: the
      substitution of the semi-regular Hilbert series for the actual Hilbert
      series of the intersection-attack ideal. Every downstream figure - the
      solving degree, the Macaulay matrix size, the time and memory exponents,
      the claimed margin over the NIST level, and the matched baselines that
      GOAL-MAYO-001, GOAL-QRUOV-001 and GOAL-SNOVA-001 are instructed to compare
      against - is a function of that one substitution. Repairing or confirming
      it is upstream of all four goals and consumes none of their budgets.
    baseline_embedding:
      parameter_slice: >-
        The unplanted random system at the same (M, N, q). That is the exact
        boundary at which the semi-regular model is believed correct: M random
        quadratics in N variables in general position with M > N and no
        F_q-point. Every published use of the model on this system is an
        assertion that the intersection system sits in that slice.
      reproduction_check: >-
        SYMBOLIC PLUS FIXTURE. Symbolically, the frozen sr_pred of clause (4)
        must reproduce, exactly, the classical count for a single quadratic
        (M = 1): d_reg = 2 and sr_pred(2) = C(N+2,2) - (1 + N + (C(N+1,2) - 1))
        = 1, i.e. exactly one dependency, the equation itself. It must also
        return d_reg = 2 for any M >= C(N+1,2), the linearisation regime. Both
        are checked before any cell is built. As a fixture, arm NULL-U at each
        core cell must reproduce the frozen d_reg of the mechanism's table; a
        curve that merely resembles the prediction is not an embedding, these
        are exact integer identities.
    observation_collision:
      observable: >-
        The integer sequence deficit(D) for D = 2..d_reg + 1, and the derived
        scalar d_ff.
      distinct_preimage_search: >-
        A COLLISION IS EXPECTED AND IS THE PRE-REGISTERED NULL RESULT, which is
        why the design is built around separating it from a real signal rather
        than around finding one. The two ground-truth objects on opposite sides
        of the claimed conclusion are (i) the intersection system, which carries
        the oil structure, and (ii) NULL-P, a random system with a planted point
        and no oil structure anywhere. If their deficit sequences agree at every
        core cell and seed, the observable does NOT identify the oil structure,
        P3 stands over the tested range, and the honest report is a controlled
        null. A SECOND, SHARPER COLLISION IS BUILT DELIBERATELY: cells (4,3) and
        (6,4) share neither (M, N) nor surplus, while (5,4) and (6,5) both have
        d_reg = 3 at different (M, N); pairs matched on (M, N) but differing in
        surplus 3m - n, and pairs matched on surplus but differing in (M, N),
        separate 'the instrument reads the oil structure' from 'the instrument
        reads the shape of the system'. An instrument that cannot hold those
        pairs apart has not identified the load-bearing structure and no result
        may be reported from it.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        Replace the question 'is UOV's cost model right' by the exact integer
        equality rank(Macaulay_D) = sr_pred(D), which is decidable per cell by
        finite linear algebra over F_16 and needs no solver, no Groebner basis
        and no asymptotics.
      predicted_gain: >-
        Converts an asymptotic modelling assumption into one integer per cell
        per degree. Encoding obligation: the Macaulay construction of clause (5)
        must generate the same ideal in degrees <= D as the system does -
        checked by verifying that the true solution x* lies in the kernel of the
        transposed matrix restricted to its evaluation. Completeness,
        soundness and transfer obligations are listed under proof_obligations;
        THE TRANSFER OBLIGATION TO DEPLOYED PARAMETERS IS DECLARED UNMET, NOT
        DEFERRED.
    - transform: observable_fiber
      proposed_object: >-
        Hold the observable deficit(d_reg) fixed and vary the forgotten
        structure: the number c of imposed linear constraints, which moves the
        projective solution dimension t = (3m - n - 1) - c through
        3, 2, 1, 0 at cell (8,6). The intrinsic invariant proposed to
        distinguish the resulting objects is t itself, because a
        positive-dimensional solution set forces the Hilbert function to
        stabilise to a polynomial of degree t rather than to a constant.
      predicted_gain: >-
        If deficit(d_reg) does NOT vary monotonically with t, the instrument is
        not reading solution dimension and therefore cannot be reading anything
        finer; the whole line fails at zero further cost. This is the positive
        control and the graded control in one construction.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER. EXISTS one frozen protocol Phi (clause set (1)-(8),
      fixed before any evaluation) FOR ALL core cells (v, m), FOR ALL admissible
      seeds, FOR ALL choices of the two invertible polar-form combinations, such
      that deficit_TREAT(D) = deficit_NULL-P(D) for every D <= d_reg + 1. The
      witness Phi may NOT depend on the cell, the seed or the choice of L_1, L_2.
      THE WEAKER ORDER - FOR ALL cells EXISTS a Phi - is trivially satisfiable
      and is explicitly NOT claimed and NOT admissible as a result. The
      quantifier over the CHOICE OF L_1, L_2 is the one most likely to fail and
      is the reason at least two independent choices per cell are measured: if
      the deficit varies more across choices than across arms, the claim
      collapses from a universal statement to a distributional one and must be
      restated as such rather than retained.
    method_ceiling:
      strongest_certifiable_claim: >-
        AT MOST: a scoped, toy-tier statement that the k = 2 intersection system
        over F_16 is or is not semi-regular at cells with m <= 6 and
        3m - n in {1, 2, 3, 4}, on one instrument lineage, at two or more seeds
        and two or more choices of (L_1, L_2) per cell. It CANNOT certify
        semi-regularity at m = 44 over F_256, where d_reg is 20 and the Macaulay
        matrix has about 2^72 columns and can never be built. It CANNOT recover
        a key, cannot forge a signature, cannot move any exponent, and cannot
        support or weaken any claim about a NIST parameter set. It cannot close
        KN-OPEN-002, whose question concerns prime-field summation-polynomial
        systems, a different object entirely.
      nearby_object_control: >-
        NULL-P, THE PLANTED-SOLUTION RANDOM SYSTEM, at identical (M, N, q). It
        is the closest object to the treatment - same field, same equation
        count, same variable count, same guaranteed solution - and the
        hoped-for conclusion (a rank deficit attributable to oil structure)
        FAILS there by construction, because it has no oil structure. Any model
        that reports a deficit at TREAT must report the frozen semi-regular
        value at NULL-P, or it is responding to the shape of the system rather
        than to the secret. A SECOND nearby-object control, and the one that
        must FIRE rather than stay silent: arm POS, the treatment system with
        zero linear constraints imposed, whose solution set has projective
        dimension at least 3m - n - 1 > 0 and therefore FORCES a positive
        deficit at high enough degree. An instrument silent on POS cannot be
        trusted to be silent meaningfully on TREAT, and no negative result may
        be reported if POS does not fire.
    proof_obligations:
    - claim: >-
        P'_a O is contained in O-perp, and dim(L_1 O intersect L_2 O) >= 3m - n
        for invertible L_1, L_2 in the span of the polar forms.
      responsibility: correctness
    - claim: >-
        The generator list has exactly 3m - 2 nonzero members, with the two
        losses appearing as identically-zero polynomials over F_16 rather than
        as duplicates.
      responsibility: correctness
    - claim: >-
        The imposed linear constraints number exactly 3m - n - 1 and are
        independent, so that N = 2n - 3m after dehomogenisation.
      responsibility: interface
    - claim: >-
        sr_pred as frozen in clause (4) reproduces the M = 1 and the
        M >= C(N+1,2) boundary cases exactly.
      responsibility: baseline
    - claim: >-
        Rank measurement is exact over GF(16), block coverage is exactly-once,
        and every reported rank equals the sum of per-block new pivots.
      responsibility: correctness
    - claim: >-
        The true solution x* lies in the variety of the constructed system at
        every cell, verified independently of the rank computation.
      responsibility: feasibility
    - claim: >-
        Nothing transfers to deployed parameters, to F_256, to MAYO, to QR-UOV
        or to SNOVA; the toy-to-deployed gap is stated on every citation.
      responsibility: scope
    - claim: >-
        Cell (8,6) at D = 5 dominates the ladder cost at 4576 x 3003 over F_16;
        a truncated ladder reports what it covered rather than failing.
      responsibility: runtime
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. THERE IS NO COMPLEXITY CLAIM OF ANY KIND HERE. This is a
    calibration of one heuristic input to a published cost model. A confirmed P3
    makes the existing UOV cost model usable with a stated toy-scale
    justification; a refuted P3 says the model's solving degree is wrong at the
    tested cells and says nothing about deployed ones. Either way no system
    becomes easier to solve, no key is recovered, no signature is forged, and
    sota_delta is zero on every attack axis - time, memory, data, queries and
    advice. dominated_by is not applicable because no Pareto point is claimed.
    The exponent AT STAKE, for orientation only and not claimed to move, is
    SESSION-COMPUTED as 2^158.0 field multiplications at the recalled tuple
    (q,n,m) = (256,112,44) with omega = 2, where each unit change in d_reg is
    worth about 9 bits.

  heuristic_assumptions:
  - id: HEUR-UOV-A1
    formal_statement: >-
      SEMI-REGULARITY OF THE DERIVED SYSTEM. FOR ALL admissible (q, v, m) in the
      declared boundary and FOR ALL choices of two invertible polar-form
      combinations L_1, L_2, the Hilbert function of the ideal generated by the
      M = 3m - 2 quadratic forms in N = 2n - 3m variables agrees degree by
      degree, up to the first non-positive coefficient, with
      [(1 - z^2)^M / (1 - z)^N]_+. Equivalently deficit(D) = 0 for all
      D < d_reg. Note the quantifier over the CHOICE of L_1, L_2: the weaker
      claim 'for some choice' is not what the cost model needs and is not what
      is tested.
    random_model_justification: >-
      NONE THAT SURVIVES SCRUTINY, AND THAT IS RECORDED AS THE POINT RATHER THAN
      PAPERED OVER. The usual argument - M forms of fixed degree drawn
      independently in general position have the generic Hilbert series -
      DOES NOT APPLY, because the M forms here are the images of one
      m-dimensional pencil under three fixed congruences and are therefore not
      drawn independently. No rigorous statement is offered and none is recalled.
      ANGLE-BRIEF section 2 T-E measures semi-regularity as an unnamed inherited
      assumption in 24 files of this corpus with no heuristic record type to
      hold it; this entry is the first attempt to name one for the MQ family.
    supporting_results: []
    validation_experiment_ids: [EXP-UOV-cd7536]
    falsification_condition: >-
      REFUTED OVER THE TESTED RANGE if the measured first-fall degree of arm
      TREAT is strictly below the frozen semi-regular value at three or more of
      the even-n core cells, at every seed and both L-choices, while NULL-P
      simultaneously sits at its frozen value at those cells. A single cell, or
      a single seed, or a discrepancy accompanied by NULL-P also missing its
      value, is NOT a refutation and must be reported as instrument doubt.
  - id: HEUR-UOV-A2
    formal_statement: >-
      MATCHED-NULL SUFFICIENCY. A uniformly random system of M quadratic forms
      in N variables over F_q with one planted projective point has the same
      graded Macaulay rank profile as the intersection system would have if the
      intersection system carried no structure beyond possessing a point.
    random_model_justification: >-
      PARTIAL, and stated as partial. The planting matches the one structural
      feature that provably separates the treatment from an unplanted random
      overdetermined system - the existence of a solution, which for M > N is
      not a generic property. It does NOT match the pencil structure, and it is
      not meant to: that difference is the quantity the experiment measures.
      What is unsupported is the stronger reading that planting is the ONLY
      relevant match. NULL-U is run beside NULL-P precisely so that the stronger
      reading is measured rather than assumed. If NULL-P and NULL-U agree
      everywhere, the planting was not load-bearing and IDEA-20260801-014's
      simpler null was adequate - a finding about this record, reported as one.
    supporting_results: []
    validation_experiment_ids: [EXP-UOV-cd7536]
    falsification_condition: >-
      REFUTED if NULL-P's first-fall degree differs from its frozen
      semi-regular value at any core cell. The reference point is then wrong, no
      treatment conclusion may be drawn at that cell, and the comparison must be
      rebuilt around the corrected reference before any further claim.
  - id: HEUR-UOV-A3
    formal_statement: >-
      TOY-TO-DEPLOYED DIRECTIONALITY. If HEUR-UOV-A1 holds at every core cell
      with m <= 6 over F_16, that is evidence, NOT proof, that it holds at
      m = 44 over F_256.
    random_model_justification: >-
      NONE. This is exactly the extrapolation GOAL-UOV-001 exists to make
      explicit, and this program has a documented record of such extrapolations
      failing under measurement. It is numbered here so that any cost model
      derived from this experiment must display it rather than inherit it
      silently, and so that the eventual conditional statement has a named
      antecedent.
    supporting_results: []
    validation_experiment_ids: [EXP-UOV-cd7536]
    falsification_condition: >-
      NOT FALSIFIABLE BY THIS EXPERIMENT, and that is recorded rather than
      hidden. What the experiment CAN do is report deficit as a function of cell
      size and state the trend; a trend that moves with size is a positive
      reason to refuse the extrapolation, and a flat trend is weak support and
      must be described as weak. No deployed-parameter statement may be made
      from this experiment under any outcome.
