hypothesis:
  id: H-ICEX-12d125
  question_id: RQ-RELN-001
  statement: >-
    For a fixed algebraic factor base of size B on a fixed toy curve at fixed
    arity, the decomposition probability conditioned on the target,
    P(decomp | target), is CONCENTRATED - its spread across uniformly sampled
    targets does not exceed the spread of a matched random set of the same size
    by more than the estimator's own noise - and the fraction of targets with
    zero successes in the trial budget falls as B grows. The lane's relation
    supply input therefore does not move by more than its own confidence interval
    when recomputed under a tail-aware model, and the mean-based formulation is
    adequate within the tested range.
  mechanism: >-
    Decomposition is a property of the target point, not of the curve alone, and
    the quantity that drives an index-calculus exponent is the distribution over
    targets rather than its mean. A heavy left tail would mean the descent stage
    stalls on a fixed fraction of targets however long relation collection runs -
    an exponent-level effect a mean cannot see. Estimating P(decomp | target) per
    target by repeated independent attempts, and reporting the empirical
    distribution rather than its expectation, is what separates the two regimes.
  assumptions:
  - >-
    Targets are sampled uniformly from the subgroup as random scalar multiples of
    the generator. The scalar is discarded and never used, and the discard is
    enforced mechanically and recorded as an artifact.
  - >-
    Decomposition attempts on the same target with fresh randomness are
    independent. IF THE ATTEMPT PROCEDURE IS DETERMINISTIC GIVEN THE TARGET then
    P(decomp | target) is 0 or 1, the distribution is a partition rather than a
    distribution, and the estimator is wrong for that regime. A determinism check
    is therefore a blocking first stage.
  - >-
    INSTRUMENT FLOOR, AND A CORRECTION TO THE SOURCE IDEA'S SAMPLING PLAN. With T
    independent attempts, a target of true probability p shows zero successes
    with probability (1 - p)^T. At the source idea's T = 50 and p = 0.01 that is
    0.99^50 = 0.605, so a zero-success census at T = 50 CANNOT distinguish a
    genuine hard-target stratum from a uniform population at p = 0.01, and the
    pre-registered discriminator could not fire. Resolving p = 0.01 at 95 percent
    requires T >= ln(0.05) / ln(0.99) = 298, so this contract sets T = 300, giving
    an instrument floor p_min = 1 - 0.05^{1/300} = 0.0099. No tail claim is made
    below p_min. The change from 50 to 300 is stated rather than absorbed.
  - >-
    One curve cannot separate a target-distribution property from a curve
    property. Multi-curve replication is required before any general statement,
    and this contract runs at least three curves for that reason.
  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms:
    - transform: null
      proposed_object: null
      predicted_gain: null
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations:
    - claim: null
      responsibility: null
    not_applicable_reason: >-
      A distributional measurement inside an existing lane. No theorem is sought;
      the counting bound it leans on is KN-OPEN-020's and is cited, not improved.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: >-
      FOR ALL tested base sizes B on all tested curves, the interquartile spread
      of P(decomp | target) across at least 200 uniformly sampled targets does
      not exceed the corresponding spread of a matched random set of the same
      size by more than the estimator's own noise at T = 300 attempts.
    random_model_justification: >-
      The rigorous ingredient is the tuple-image counting bound recorded in
      KN-OPEN-020, read verbatim - tuple-image counting bounds the reachable
      target set by B^m - which applies uniformly over targets. The distributional
      ingredient is the heuristic that decomposition behaves like a
      balls-into-bins allocation over targets. THE COMPOSITION IS THE ASSUMPTION -
      counting bounds the MEAN and says nothing about concentration, so
      concentration is genuinely assumed and is what the measurement tests.
    supporting_results:
    - >-
      KN-OPEN-020, read in full - the bounded-degree factor-base obstruction
      bounds the factor base by 3d or Delta, tuple-image counting bounds the
      reachable target set by B^m, and the fresh-rerandomized descent interface
      has charged-trial lower bound Omega(N / B^m).
    validation_experiment_ids:
    - EXP-ICEX-0b55c3
    falsification_condition: >-
      A measured spread exceeding the matched random-set null's spread by more
      than estimator noise, reproducibly across at least 3 curves.
  structural_ingredients:
  - description: >-
      RQ-RELN-001 decision target, read verbatim - a frozen measurement protocol
      for P(decomp) versus base size with explicit controls and certificate
      obligations, or a scoped no-go against honest measurement under the Tier
      path cost contract.
    citation: RQ-RELN-001
    provenance: internal
    verified_by: coordinator (TASK-20260904-074465, file read in full)
    role: lane whose input this conditions
  - description: >-
      The tuple-image counting bound, which caps the reachable target set by B^m
      uniformly over targets and is therefore silent about concentration.
    citation: KN-OPEN-020
    provenance: internal
    verified_by: coordinator (TASK-20260904-074465, statement section read verbatim)
    role: rigorous ingredient of HEUR-001
  reduction_chain: null
  predictions:
  - metric: determinism_check_on_the_attempt_procedure
    direction: different
    minimum_effect: >-
      BLOCKING FIRST STAGE. Repeated attempts on one target with fresh randomness
      must produce a mix of outcomes on at least one target. If every target's
      outcome is constant across attempts, the procedure is deterministic given
      the target, the estimator is wrong for that regime, and estimation must be
      redesigned before any distribution is reported.
  - metric: planted_easy_target
    direction: different
    minimum_effect: >-
      FORCED - a target constructed as a known sum of m factor-base elements must
      show 300 successes in 300 attempts. Failure means the attempt procedure is
      broken and no distribution from it is admissible.
  - metric: restricted_base_planted_defect_graded
    direction: lower
    minimum_effect: >-
      Forbidding a declared fraction f of the factor base from appearing in a
      decomposition must reduce the mean P(decomp) by the factor (1 - f)^m.
      Predicted magnitudes at m = 3 - a factor 0.422 at f = 0.25 and a factor
      0.125 at f = 0.50, each within 30 percent. The two-point ladder is the
      demonstrated dynamic range; a control that merely returns a number is not
      accepted.
  - metric: spread_of_p_decomp_given_target_at_fixed_base_size
    direction: different
    minimum_effect: >-
      No direction pre-committed; the spread IS the measurement. Pre-committed is
      that it is compared against the matched random-set null's spread at the
      same size, never against zero.
  - metric: fraction_of_targets_with_zero_successes_as_base_size_grows
    direction: lower
    minimum_effect: >-
      PREDICTED TO FALL. Interpreted only above the instrument floor p_min =
      0.0099 at T = 300. A flat fraction with all planted controls passing is
      either a genuine hard-target stratum, which routes to a successor proposal,
      or an artifact, and the contract does not decide between them.
  - metric: movement_in_the_lanes_relation_supply_input_under_a_tail_aware_model
    direction: different
    minimum_effect: >-
      Quantified as a ratio against the mean-based input. Movement below the
      input's own confidence interval means the mean was adequate within the
      tested range.
  test_boundary:
    instances:
    - at least 3 toy curves, at least 200 uniformly sampled targets per cell
    - at least 300 independent decomposition attempts per target
    parameters:
      base_sizes: at least 2, spanning at least a twofold range
      arity_m: fixed and recorded
      trial_budget_T: 300
    implementation: >-
      The lane's existing decomposition-attempt procedure under the certificate
      contract, with target sampling and scalar discard enforced mechanically.
    budget:
      wall_clock_seconds_per_run: 3600
      maximum_memory_gb: 8
      maximum_runs: 40
  falsification_conditions:
  - >-
    The planted easy target does not decompose in all 300 attempts. The attempt
    procedure is broken; halt.
  - >-
    The restricted-base plant does not reduce the mean by (1 - f)^m within 30
    percent at both f. The instrument has no demonstrated dynamic range and no
    distribution from it is admissible.
  - >-
    The attempt procedure is deterministic given the target. The estimator is
    wrong for this regime; redesign before any estimation.
  - >-
    The observed spread matches the matched random-set null. No target dependence
    beyond birthday behaviour within the tested range - a clean negative.
  - >-
    The observed spread exceeds the null's by more than estimator noise on at
    least 3 curves. HEUR-001 is falsified within the tested scope.
  - >-
    The zero-success fraction is flat in base size AND every planted control
    passes AND the fraction sits above the instrument floor. A candidate
    hard-target stratum - the exponent-relevant outcome - routed to its own
    proposal and NOT concluded here.
  interpretation_limits:
  - >-
    Measures a distribution. Produces no cost model, no exponent and no attack.
  - >-
    Scoped to the tested curves, arity, base sizes, attempt procedure and trial
    budget. A null result closes the tested range only and says nothing about the
    larger bases where the lane wants to operate.
  - >-
    A heavy tail would be a SUPPLY observation, not an exponent claim. Converting
    it into either needs a separate proposal with its own cost table, and that
    conversion is UNTESTABLE AT REACHABLE SCALE here - the exponent-level
    consequence lives at base sizes this contract does not reach.
  - >-
    THE DOMINANT RISK IS A BUDGET-INDUCED FAKE TAIL, and the instrument floor
    exists for it. No zero-success fraction is interpreted below p_min = 0.0099.
  - >-
    A curve-free null in Z/n with a random subset of matched size and m-fold sums
    is mandatory. If that curve-free object reproduces the spread and the tail,
    the observation is about balls-into-bins supply in a finite abelian group and
    NOTHING may be quoted as a statement about elliptic curves or the ECDLP.
  status: proposed
  proposed_by: coordinator
