hypothesis:
  id: H-QRUOV-677301
  question_id: RQ-QRUOV-001
  goal_id: GOAL-QRUOV-001
  source_ideas:
    - IDEA-20260805-8d9ac0
    - IDEA-20260805-bb9f73

  statement: >-
    SCOPE: QR-UOV-shaped keys over A = F_q[t]/(f) with f IRREDUCIBLE, so
    A = F_{q^ell}. Toy measurement at q in {7, 11}, ell in {2, 3, 4}, M in {2, 3},
    V in {4, 6, 8}; all cost statements are closed-form arithmetic, not runs.
    CLAIM TIER toy. NO ATTACK IS PROPOSED AND NO EXPONENT IS MOVED BY THIS
    HYPOTHESIS.
    The claim is that GOAL-QRUOV-001's yardstick -- "the matched
    extension-field-UOV baseline" -- is exactly determined by three quantities,
    two of which are ell-invariant identities and one of which is a single
    measurable integer, and that all three can be settled before any attack work
    begins.
    (Q1) n - 2m = ell*(V - M) and n/m = (V + M)/M. The second is INDEPENDENT OF
    ell. Hence the Kipnis-Shamir / reconciliation exponent and any applicability
    threshold expressed as a ratio of variables to equations are IDENTICAL for
    QR-UOV at (q, V, M, ell), plain UOV at (q, n, m), and UOV at
    (q^ell, V + M, M). The compression is exponent-neutral for these attacks by
    arithmetic, not by measurement, and the only difference is a linear-algebra
    cofactor of order ell^{omega - log_2 3}.
    (Q2) The attacker's oil-space haystack is NOT ell-invariant: it falls from
    about q^{M V ell^2} to about q^{M V ell}, a factor ell in the exponent. Yet
    generic meet-in-the-middle over the smaller haystack costs q^{ell M V / 2},
    which beats q^{ell(V - M)} only when M*V/2 < V - M, i.e. only when M = 1. For
    every M >= 2 the reduced haystack is UNSPENDABLE by generic enumeration. That
    is a closure with a named obstruction (a quadratic exponent halved cannot
    reach a linear one) and forward guidance (only an attack formulated over A,
    where the variable count itself drops by ell before a modelling degree is
    chosen, can spend it).
    (Q3) The folklore reduction underwriting the baseline is proved in only one
    direction. The direction that IS provable is Lemma T: for an A-submodule O,
    isotropy of O for the F_q form equals isotropy for the A form, because the
    residue pairing is nondegenerate and associative. The direction a security
    argument needs -- that the descent's image is not an easier subfamily -- turns
    on one integer r, the A-rank of the A-span of the descended public forms,
    which is forced to be M or M*ell. If r = M the descent is dimension-exact and
    the baseline is legitimate; if r = M*ell then a totally isotropic M-space
    exists generically only when V >= M*ell*(M+1)/2, and any declared parameter
    set below that threshold is a non-generic instance that the matched baseline
    prices wrongly.
    PRE-REGISTERED EXPECTATION: Q1 holds exactly, Q2 holds exactly, r = M, margin
    non-negative, and the honest conclusion is that the baseline is legitimate and
    the compression is exponent-neutral for the audited attack families. A result
    that makes the scheme look sound is still a result, and it is half of
    GOAL-QRUOV-001's second completion criterion.

  mechanism: >-
    SHAPE AND PROVENANCE. A = F_q[t]/(f) with f irreducible, so A = F_{q^ell};
    N = V + M, n = N*ell, m = M*ell; public matrices are n x n symmetric over F_q
    with N x N blocks in W*phi(A) for the invertible Hankel symmetriser W of
    H-QRUOV-e8ae3e P1; the oil space O is an A-submodule of A^N of A-rank M.
    RECALLED, UNVERIFIED -- no QR-UOV document has been read by this program, and
    stage 0 of EXP-QRUOV-5c1efb pins the shape and the parameter table down or
    records that it could not.

    Q1, DERIVED. n - 2m = (V + M)ell - 2M ell = (V - M)ell, and over A the same
    instance has N - 2M = V - M, so (q^ell)^{V-M} = q^{(V-M)ell}: the exponents are
    EQUAL, exactly. n/m = (V + M)/M = N/M contains no ell, so every threshold
    stated as a bound on the variables-to-equations ratio -- including the RECALLED
    two-map intersection-attack condition n < 3m, which becomes V < 2M -- is the
    same on both sides for ANY threshold value. That robustness is deliberate: the
    conclusion does not depend on the recalled threshold being 3.
    COFACTOR, DERIVED. A linear-algebra step on M x M matrices over F_{q^ell}
    costs about M^omega * ell^{log_2 3} F_q-operations with Karatsuba extension
    arithmetic, against (M ell)^omega over F_q; ratio ell^{omega - log_2 3},
    i.e. ell^{0.78} at omega = 2.37 and ell^{1.415} at omega = 3. Both endpoints
    are reported; a cofactor claim resting on an unstated omega is not a claim.

    Q2, DERIVED. The number of F_q-subspaces of dimension m in F_q^n is the
    Gaussian binomial [n choose m]_q = q^{m(n-m)(1+o(1))} with
    m(n - m) = M ell * V ell = M V ell^2. The number of free A-submodules of rank
    M in A^N is [N choose M]_{q^ell} = q^{ell M V (1+o(1))}. So the module
    constraint deletes a factor ell from the haystack EXPONENT, for free, from a
    public parameter. Generic MITM costs the square root, q^{ell M V/2}, and beats
    q^{ell(V-M)} exactly when M V/2 < V - M, i.e. V(M - 2) < -2M; for M >= 2 the
    left side is non-negative and the right side is negative, so it never holds,
    and only M = 1 with V > 2 admits it. The obstruction is structural and named:
    the haystack exponent is QUADRATIC in the parameters (M V ell) while the solver
    exponent is LINEAR ((V - M) ell), and halving a quadratic does not reach a
    linear. Forward guidance, mandatory under inventor protocol section 4: what
    remains open is any attack whose cost is set by the module structure rather
    than by enumeration -- a MinRank or intersection modelling carried out over A,
    where the variable count drops by ell BEFORE the modelling degree is chosen.
    This hypothesis does not claim that lane is closed and must never be cited as
    if it did.

    Q3, DERIVED (LEMMA T). Let B(x, y) = coeff_{ell-1}(x*y mod f), symmetric,
    associative and nondegenerate (H-QRUOV-e8ae3e P1). For a symmetric N x N
    matrix Q over A put beta_Q(u, v) = B(u^T Q v); its F_q Gram matrix has (i, j)
    block W*phi(Q_ij), so Q <-> P is a bijection between symmetric matrices over A
    and the QR-UOV block shape. If O is an A-SUBMODULE then beta_Q vanishes on
    O x O iff u^T Q v = 0 in A for all u, v in O: given u, v in O and any c in A,
    c*u lies in O, so B(c*(u^T Q v)) = 0 for every c, and nondegeneracy of B forces
    u^T Q v = 0. THE MODULE HYPOTHESIS IS ESSENTIAL and is the design choice the
    whole reduction rests on.
    THE INTEGER. The m = M ell public F_q forms descend to M ell symmetric matrices
    over A; let r be the A-rank of their A-span. O is isotropic for the whole span.
    If the forms are organised as M groups of ell related forms then r = M and the
    descended object is UOV over A at (N, M) with oil dimension M -- the matched
    baseline -- and the two public-key spaces have EQUAL F_q-dimension
    M*N(N+1)/2*ell, so the descent is dimension-exact and its image is not a proper
    subvariety. If instead the M ell forms are A-independent then r = M ell, the
    public-key space has ell times the F_q-dimension, and the descended object is a
    UOV instance with M ell equations carrying an oil space of A-dimension only M.
    GENERIC-EXISTENCE THRESHOLD, DERIVED: a d-dimensional totally isotropic
    subspace for r quadratic forms in N variables imposes r*d(d+1)/2 conditions on
    Gr(d, N), of dimension d(N - d); generic existence needs
    N - d >= r(d+1)/2, i.e. at d = M and N = V + M, V >= r(M+1)/2. With r = M this
    is the ordinary UOV inequality V >= M(M+1)/2; with r = M ell it is ell times
    larger. A declared parameter set with measured r = M ell and
    V < M ell (M+1)/2 would therefore be a non-generic point of the ext-UOV space,
    and the matched baseline would be pricing the wrong object.

    OVERLAP DECLARED, NOT DOUBLE-COUNTED. The stabiliser count -- |GL_N(A)| about
    q^{ell N^2} against |GL_n(F_q)| about q^{ell^2 N^2} -- exhibits the SAME
    factor-of-ell-in-the-exponent as Q2's haystack. They are one phenomenon seen
    twice and are reported as one.

    COST BOOKKEEPING. Not applicable in the per-attempt x inverse-success sense:
    there is no attempt. The deliverable is a table with one row per declared
    parameter set and columns (q, V, M, ell, n, m, n-2m, n/m, V/M, log_q KS cost
    over F_q, log_q KS cost over A, cofactor at both omega, log_2 haystack over
    F_q, log_2 haystack over A, log_2 generic MITM, V < 2M flag, measured r,
    V - r(M+1)/2). Every column is closed form; only the parameter values must be
    READ, and a value that cannot be read is marked unavailable, never invented.

  assumptions:
    - >-
      The QR-UOV parameter semantics and key shape. RECALLED, UNVERIFIED, and the
      dominant risk. Q1's identity check is the cheapest detector of a wrong
      assumption and runs first.
    - >-
      f irreducible throughout. The reducible case is a different object and
      belongs to H-QRUOV-e8ae3e; mixing them would confound both.
    - >-
      Environment, verified by direct import in the generating session:
      numpy 2.4.6 present, sympy ABSENT, Sage ABSENT. Every stage is pure-Python
      integer and modular arithmetic. A stage later found to need a computer
      algebra system is an infrastructure request, never negative evidence
      (AGENTS.md rule 5).

  proof_search_map:
    bottleneck: >-
      The unexamined premise that "the matched extension-field-UOV baseline" is a
      well-defined and correct yardstick. Everything GOAL-QRUOV-001 plans to
      measure is a ratio against it. If the baseline is wrong by a factor of ell
      in the equation count, every later cost comparison in the goal is void, and
      no amount of careful attack work downstream repairs it. This is upstream of
      the entire goal and consumes almost none of its budget.
    baseline_embedding:
      parameter_slice: >-
        ell = 1. Then A = F_q, QR-UOV degenerates to plain UOV at (V + M, M), and
        every identity in Q1 becomes trivially true, the haystack ratio becomes 1,
        the cofactor becomes 1, and r must equal M. This is the exact old-method
        boundary and the formulas must reproduce it with no residual.
      reproduction_check: >-
        SYMBOLIC plus a frozen fixture. At ell = 1 the table's QR-UOV row and its
        plain-UOV row must be IDENTICAL in every column, as exact integers. Any
        difference is an implementation defect in the table, detectable before any
        other row is read.
    observation_collision:
      observable: >-
        The tuple (field, variable count, equation count, oil dimension) -- which
        is exactly what the baseline's cost model consumes -- together with r.
      distinct_preimage_search: >-
        THIS IS THE WHOLE POINT AND THE SEARCH IS DECISIVE. Hunt for two objects
        with the same observable and different truth: a descended QR-UOV key and a
        generically drawn ext-UOV key at (F_{q^ell}, N, M). If r = M they agree on
        the observable BY CONSTRUCTION, and the collision search then reduces to
        asking whether the descended forms are distributed like generic symmetric
        matrices over A -- tested against a MATCHED NULL built in the same code
        path (random symmetric matrices over the same A), with the corank
        distribution as the statistic and no recalled reference distribution
        required. A large distance means the observable is shared while the objects
        are not, which is a direct falsifier of the baseline's identifiability. If
        r = M ell the observables differ outright and the baseline is refuted
        without any statistics at all.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Re-express the instance over A so that "the compression is
          security-neutral" becomes an exact equality of integer exponents rather
          than an approximate comparison of costs. Encoding: Lemma T's bijection.
          Completeness: every public F_q form descends. Soundness: isotropy is
          preserved in both directions FOR MODULES ONLY, and that hypothesis is
          stated rather than buried. Transfer: the exponent identity Q1. Cost loss:
          the ell^{omega - log_2 3} cofactor, charged explicitly.
        predicted_gain: >-
          None to an attacker -- the gain is that the goal's yardstick becomes
          derived rather than inherited, and the one integer that could invalidate
          it becomes measurable in seconds.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (field, N, M, oil dimension) fixed and vary the
          forgotten structure: descended QR-UOV forms versus generic symmetric
          forms over A. An intrinsic invariant separating them -- corank profile,
          or any A-linear relation among the forms -- would show the descent's
          image is a subfamily.
        predicted_gain: >-
          Falsification power only. If no invariant separates them at toy size the
          baseline survives its sharpest cheap test; if one does, the baseline is
          the wrong object and the goal must be rebuilt on a corrected one.
    quantifier_order: >-
      THE AUDIT IS THE QUANTIFIER ORDER. Written out:
      DIRECTION 1 (proved by Lemma T): FORALL QR-UOV instances I, EXISTS a
      polynomial-time computable ext-UOV instance J such that an oil space of J
      yields one of I. This bounds QR-UOV's hardness ABOVE.
      DIRECTION 2 (needed for a security claim, NOT proved anywhere in this
      corpus): FORALL cost models C used as the baseline, C evaluated on the
      DESCENT'S IMAGE distribution is at least C evaluated on the generic ext-UOV
      distribution. GOAL-QRUOV-001 nevertheless prices everything against the
      generic model. The trap being hunted: the witness J is allowed to depend on
      the instance I, so the family {J(I)} may be a structured subfamily on which
      the uniform cost model is simply wrong -- exactly the dependence a uniform
      conclusion forbids. r and the corank test are the two cheap probes of it.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that the two identities hold exactly, that generic MITM cannot
        spend the reduced haystack at any M >= 2, that r takes a specific value at
        toy parameters, and that the descended forms are or are not distinguishable
        from generic ones at toy size by the corank statistic. It CANNOT certify
        that the descent's image is generic in every respect, cannot certify that
        no attack beats the baseline, and cannot certify anything about a deployed
        parameter set.
      nearby_object_control: >-
        PLAIN UOV at (q, n, m) with the SAME n and m, where the hoped-for
        conclusion (exponent neutrality under the descent) must hold trivially
        because it is literally the same F_q system. The instrument must report
        ratio exactly 1.000 there. And a second, adversarial nearby object where
        the conclusion MUST FAIL: the deliberately mismatched baseline UOV over
        F_{q^ell} at (N, M ell) -- confusing equation count with oil dimension --
        whose exponent ell(V + M - 2 M ell) is negative for ell >= 2 at ordinary
        (V, M). A comparison instrument that does not flag that arm as mismatched
        cannot detect a wrong baseline, and its verdict on the real arm is
        worthless.
    proof_obligations:
      - claim: n - 2m = ell(V - M) and n/m = (V + M)/M, exactly, at all parameters.
        responsibility: correctness
      - claim: >-
          Lemma T -- isotropy transfer for A-submodules under a nondegenerate
          associative pairing.
        responsibility: correctness
      - claim: >-
          The Gaussian-binomial haystack exponents M V ell^2 and ell M V, and the
          MITM inequality M V/2 < V - M failing for all M >= 2.
        responsibility: size
      - claim: >-
          The generic-existence threshold V >= r(M+1)/2 as a dimension count, with
          its passage to a finite-field probability flagged as heuristic.
        responsibility: feasibility
      - claim: >-
          The recalled Kipnis-Shamir and intersection cost statements, quoted from
          a primary source or recorded as unobtainable.
        responsibility: baseline
      - claim: >-
          No attack is claimed and no exponent is moved; every citation carries
          that.
        responsibility: scope

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    DELIBERATELY NULL. There is no complexity claim of any kind here. This is a
    BASELINE CONSTRUCTION AND AN AUDIT OF AN INHERITED PREMISE. It makes no system
    easier to solve, moves no exponent, and adds no attack. sota_delta is zero on
    every attack axis (time, memory, data, queries, advice), and dominated_by is
    not applicable because no Pareto point is claimed. The one thing it does claim
    quantitatively is a NEGATIVE: generic MITM over the reduced haystack never
    beats the recalled Kipnis-Shamir exponent for M >= 2.

  heuristic_assumptions:
    - id: HEUR-QRUOV-BASE-1
      formal_statement: >-
        FORALL finite fields F and FORALL (n', m') with n' >= 3m', UOV
        key-recovery over F costs |F|^{n' - 2m'} * poly(n', m') F-operations, with
        poly independent of |F|.
      random_model_justification: >-
        RECALLED, NOT VERIFIED, NO SOURCE CITED. Load-bearing for the exponent
        columns of the table but NOT for Q1's identities, which are pure integer
        arithmetic, nor for Q3.
      supporting_results: []
      validation_experiment_ids: [EXP-QRUOV-5c1efb]
      falsification_condition: >-
        A primary source states an incompatible form. The recalled form is
        withdrawn, every derived column recomputed, and the record superseded --
        never edited. Q1 and Q3 survive such a failure untouched, which is why the
        record is layered in that order.
    - id: HEUR-QRUOV-BASE-2
      formal_statement: >-
        The two-map intersection attack applies exactly when n < 3m.
      random_model_justification: >-
        RECALLED, NOT VERIFIED. Used only to convert the RELAYED ePrint 2026/298
        phrase "linear solution space" into the checkable inequality V < 2M. The
        ell-cancellation conclusion is INDEPENDENT of the threshold value, since
        ell cancels in n/m for any threshold whatsoever.
      supporting_results: []
      validation_experiment_ids: [EXP-QRUOV-5c1efb]
      falsification_condition: >-
        A primary source gives a different threshold. Report it, recompute the
        flag; the ell-invariance conclusion is unaffected.
    - id: HEUR-QRUOV-BASE-3
      formal_statement: >-
        FORALL (N, M, r) with r*M(M+1)/2 <= M(N - M), an M-dimensional totally
        isotropic subspace for r generic quadratic forms in N variables over a
        finite field exists with probability bounded away from 0 as the field
        grows; and FORALL (N, M, r) violating the inequality, with probability
        tending to 0.
      random_model_justification: >-
        The dimension count is exact -- Gr(M, N) has dimension M(N - M) and total
        isotropy for r forms imposes r*M(M+1)/2 conditions. The passage from a
        dimension count to a finite-field probability is the heuristic step, needs
        Lang-Weil-type control, and IS NOT SUPPLIED HERE.
      supporting_results: []
      validation_experiment_ids: [EXP-QRUOV-5c1efb]
      falsification_condition: >-
        Measure the empirical existence rate directly on both sides of the
        threshold at the smallest feasible toy cells. If the threshold does not
        separate the regimes, the generic-existence argument is downgraded to
        heuristic in every downstream statement rather than quietly retained.

  structural_ingredients:
    - description: >-
        The residue pairing B(x, y) = coeff_{ell-1}(x*y mod f) on F_q[t]/(f):
        symmetric, associative, nondegenerate for every monic f.
      citation: >-
        Derived and proved in H-QRUOV-e8ae3e's mechanism in two lines; verified
        exhaustively at toy sizes in the generating session (414,582 cells, zero
        failures). NO external citation asserted.
      role: makes Lemma T's isotropy transfer exact
    - description: >-
        Gaussian binomial count of subspaces, [n choose m]_q = q^{m(n-m)(1+o(1))},
        applied over F_q and over F_{q^ell}.
      citation: >-
        Standard; NOT retrieved and NOT cited. Used only for an exponent RATIO,
        where the bounded factor cancels, and never for an absolute count.
      role: the haystack exponents and their ratio ell
    - description: >-
        Dimension of the Grassmannian and the condition count for total isotropy.
      citation: >-
        Elementary and derived in this record. No external citation asserted.
      role: the generic-existence threshold V >= r(M+1)/2

  reduction_chain:
    core_problem: >-
      Determine whether the matched extension-field-UOV cost is the correct
      baseline for QR-UOV at (q, V, M, ell) with f irreducible, and quantify what
      the quotient-ring structure changes and what it does not.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. No reduction to any other scheme is claimed. In
      particular this record deliberately does NOT mint a plain-UOV cost
      convention of its own: GOAL-QRUOV-001's next_action requires that the
      plain-UOV attack model shared with RQ-UOV-001 not be re-derived twice with
      two different conventions, so every plain-UOV number here is a QUOTED
      recalled statement (HEUR-QRUOV-BASE-1/2) carried with its provenance, to be
      replaced by whatever RQ-UOV-001 establishes rather than competing with it.

  predictions:
    - metric: >-
        B1 -- integer residual (n - 2m) - ell(V - M) at every declared QR-UOV
        parameter set and over 10^4 random (V, M, ell)
      direction: different
      minimum_effect: >-
        EXACTLY 0 everywhere. Zero tolerance. A single nonzero residual means the
        assumed parameter semantics are wrong and terminates the audit.
    - metric: >-
        B2 -- symbolic partial derivative of n/m with respect to ell
      direction: different
      minimum_effect: EXACTLY 0.
    - metric: >-
        B3 -- ell = 1 baseline-embedding check: number of columns in which the
        QR-UOV row and the plain-UOV row of the table differ
      direction: lower
      minimum_effect: >-
        EXACTLY 0 columns. A frozen fixture; any difference is a table defect.
    - metric: >-
        B4 -- mismatched-baseline detection: does the instrument flag UOV over
        F_{q^ell} at (N, M ell) as not comparable?
      direction: different
      minimum_effect: >-
        FLAGGED, in 100 per cent of cells. THIS IS THE NULL AND IT CAN FAIL. If
        the instrument passes a manifestly mismatched baseline as comparable, no
        matched-baseline claim may be made from it at all.
    - metric: >-
        B5 -- exhaustive truth table of M*V/2 < V - M over 1 <= M <= 16,
        1 <= V <= 256
      direction: different
      minimum_effect: >-
        TRUE only for M = 1 and V > 2; FALSE for every M >= 2. Exhaustive integer
        enumeration, so the prediction is exact rather than statistical.
    - metric: >-
        B6 -- measured r, the A-rank of the A-span of the descended public forms,
        over >= 20 keys per toy cell
      direction: different
      minimum_effect: >-
        EXACTLY M, or EXACTLY M*ell; pre-registered expectation M. Any third value
        falsifies the grouping assumption and redirects the audit.
    - metric: >-
        B7 -- public-key F_q-dimension ratio, QR-UOV over ext-UOV
      direction: different
      minimum_effect: >-
        EXACTLY 1 if r = M, EXACTLY ell if r = M*ell. Any other value refutes
        Lemma T's bijection.
    - metric: >-
        B8 -- generic-existence margin V - r(M+1)/2 at each declared parameter set
        with the measured r
      direction: higher
      minimum_effect: >-
        Predicted >= 0. A NEGATIVE margin is the falsifier of the goal's yardstick
        and is the most consequential single outcome available in this hypothesis.
    - metric: >-
        B9 -- corank-distribution distance between descended forms and a matched
        random-symmetric-over-A null built in the same code path, >= 200 samples
      direction: lower
      minimum_effect: >-
        Kolmogorov-Smirnov distance below 0.10 at that sample size. A larger
        distance means the descent's image is a structured subfamily and direction
        2 of the quantifier audit is in doubt regardless of r.
    - metric: >-
        B10 -- planted-versus-measured r across a graded ladder with r planted at
        1, 2, ..., M*ell
      direction: different
      minimum_effect: >-
        Measured equals planted at EVERY rung. THIS IS THE POSITIVE CONTROL: if the
        rank instrument cannot see A-independence, no measured r may be reported.

  test_boundary:
    instances:
      - >-
        QR-UOV-shaped keys constructed in-harness at f irreducible; NOT keys from
        any reference implementation, which this program does not have.
      - >-
        A matched random-symmetric-over-A null and a matched planted-r ladder, both
        built in the same code path as the treatment.
      - >-
        The declared QR-UOV parameter sets, IF and ONLY IF a specification can be
        read; otherwise the numeric columns are marked unavailable.
    parameters:
      q: [7, 11]
      ell: [1, 2, 3, 4]
      M: [2, 3]
      V: [4, 6, 8]
      keys_per_cell: 20
      null_samples: 200
      omega_reported: [2.37, 3.0]
      random_identity_sweep: 10000
      mitm_enumeration_range: "1 <= M <= 16, 1 <= V <= 256"
      field: odd q only; characteristic 2 out of scope for the symmetric-form arguments
    implementation: >-
      Pure Python integer and modular arithmetic; exact rank over F_{q^ell}
      implemented directly. Environment verified in the generating session:
      numpy 2.4.6 present, sympy ABSENT, Sage ABSENT. No computer-algebra
      dependency in any stage.
    budget:
      stage0_wall_clock_seconds: 3600
      stage1_wall_clock_seconds: 300
      stage2_wall_clock_seconds: 900
      stage3_wall_clock_seconds: 600
      maximum_memory_gb: 2
      note: >-
        The entire hypothesis is seconds-to-minutes of exact arithmetic plus one
        reading stage. It is the cheapest decisive work available to
        GOAL-QRUOV-001 and is a prerequisite for every cost comparison the goal
        plans.

  falsification_conditions:
    - >-
      B1 or B2 fails. The assumed parameter semantics are wrong; the audit stops
      and is redirected. Cheapest possible failure and it costs seconds.
    - >-
      B3 fails at ell = 1. The table does not reproduce its own baseline; it is a
      defective instrument and no row may be read.
    - >-
      B4 fails -- the mismatched baseline is not flagged. The instrument cannot
      detect a wrong baseline; NO MATCHED-BASELINE CLAIM MAY BE MADE.
    - >-
      B10 fails at any rung. The rank instrument is blind to A-independence and NO
      measured r may be reported.
    - >-
      B6 returns a third value. The grouping assumption is falsified; the audit is
      redirected, not reinterpreted.
    - >-
      B7 returns neither 1 nor ell. Lemma T's bijection is wrong and the derived
