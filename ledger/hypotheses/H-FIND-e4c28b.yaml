hypothesis:
  id: H-FIND-e4c28b
  question_id: RQ-FIND-001
  derived_from_idea: IDEA-20260807-d7ef50
  added: '2026-08-25'
  status: proposed
  proposed_by: coordinator
  statement: >-
    The program's evidence records cannot be traced to the research questions they bear on, and
    the cause is SCHEMA-WIDE rather than local to one campaign. Formally: over the complete set of
    committed records under ledger/evidence/, the fraction of records whose hypothesis_id is null
    or does not match the regular expression ^H- is materially above zero, and the campaigns
    (identified by the AREA token of the EV-<AREA>-<tok> identifier) in which such records occur
    number strictly more than one. The competing explanation, which this experiment is built to be
    able to select instead, is that the defect is confined to a single campaign's practice, in
    which case the remedy is guidance and not a schema change.
  mechanism: >-
    The evidence template in templates/research-records.md declares no question_id field, and the
    validator's REQUIRED list for evidence records contains no question linkage and no type check
    on the prefix of hypothesis_id. A field that is neither required nor type-checked is filled
    inconsistently, so records that legitimately bear on no single hypothesis either leave the slot
    null or place a proposal identifier in it. Because coverage scans derive a question's evidence
    count by grepping for the RQ identifier inside evidence records, every such record contributes
    a systematic FALSE NEGATIVE to that count, and the program's batch prioritization consumes the
    corrupted count. If the omission is caused by the schema, the defect must appear across
    unrelated campaigns with unrelated authors; if it is caused by one campaign's local practice,
    it will not.
  assumptions:
  - >-
    Every committed evidence record parses as YAML and exposes an id and a hypothesis_id key or
    the absence of one. A record that fails to parse is counted in a separate disclosed-debt bucket
    and never silently dropped.
  - >-
    The AREA token of an EV identifier is a usable proxy for campaign membership. Where a record
    carries an explicit goal_id, that field takes precedence and the disagreement is reported.
  - >-
    No existing record is edited. Any correction proceeds by supersession under a new identifier
    (AGENTS.md rule 2), so the audit is read-only over the ledger.
  proof_search_map:
    not_applicable_reason: >-
      Not proof-oriented. This is a harness-integrity audit over committed records; it asserts no
      theorem, no bound, no certificate and no cryptanalytic claim, so the KN-TECH-080 gate does
      not bind. Recorded explicitly rather than omitted.
  asymptotic_claim:
    problem: null
    prior_best: null
    time_exponent: null
    memory_exponent: null
    hidden_cofactor: null
    claim_kind: null
  heuristic_assumptions:
  - id: HEUR-LINK-1
    formal_statement: >-
      For every evidence record in the committed ledger there exists exactly one research question
      it bears on, so a required question_id field is answerable without forcing a false claim.
    random_model_justification: >-
      Not a distributional heuristic. It is a claim about the answerability of a proposed required
      field, and it is exactly the claim the audit measures rather than assumes.
    supporting_results: []
    validation_experiment_ids:
    - EXP-FIND-d2495e
    falsification_condition: >-
      The audit finds records - screening reviews, multi-lane batch records, cost-model refinements
      - for which no single question can be named without asserting a bearing the record disclaims.
      The count of such records is a primary output, and a nonzero count refutes HEUR-LINK-1 and
      forces a documented-null path rather than a bare required field.
  structural_ingredients: []
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
  - metric: affected_campaign_count
    direction: higher
    minimum_effect: >-
      Strictly greater than 1, and at least 25 percent of campaigns that own at least three
      evidence records. Exactly 1 is the clean negative and means the defect is local practice.
  - metric: unlinkable_record_count
    direction: higher
    minimum_effect: >-
      At least 2, forced by inspection, since EV-SSI-001 and EV-SSI-042 are known to carry IDEA
      identifiers in the hypothesis slot. Zero would mean the coverage scan that prompted this
      record was itself wrong, which is a reportable finding about the scan.
  - metric: unanswerable_question_id_count
    direction: higher
    minimum_effect: >-
      No magnitude predicted. Any value above zero refutes HEUR-LINK-1 as stated and is the
      deliverable that decides whether a required field or a documented-null path is proposed.
  test_boundary:
    instances:
    - >-
      Every file under ledger/evidence/ in the committed tree at the pinned base commit, with no
      sampling and no exclusion. The audit is a census, not an estimate.
    parameters:
      scope: complete committed evidence corpus at one pinned commit
      linkage_rule: 'hypothesis_id is LINKED iff it is a string matching ^H-; null or ^IDEA- or any
        other prefix is UNLINKED'
      campaign_key: AREA token of the EV identifier, with explicit goal_id taking precedence
    implementation: >-
      Read-only Python over the committed tree with a YAML parser. No network, no solver, no
      randomness, no seeds, and no write to any ledger path.
    budget:
      wall_clock_seconds_per_run: 300
      maximum_memory_gb: 2
  falsification_conditions:
  - >-
    Exactly one campaign is affected. The schema-wide claim is FALSE as stated, the defect is local
    practice, and the correct remedy is guidance rather than a schema change. This is a fully
    reportable negative and terminates the schema proposal.
  - >-
    The unlinkable count is zero. Both forced rows failed to appear, the premise is wrong, and the
    finding is about the coverage scan rather than about the evidence records.
  - >-
    A parse or read failure prevents the census from covering the complete corpus. That is an
    infrastructure outcome (AGENTS.md rule 3), never a finding about linkage, and the run reports
    the uncovered fraction rather than a rate over a partial denominator.
  interpretation_limits:
  - >-
    This is harness infrastructure. It supports no mathematical claim, no security claim, and no
    statement about any scheme or parameter set.
  - >-
    A schema change to templates/research-records.md and to tools/validate_ledger.py is a
    Coordinator act. This hypothesis and its experiment produce the measurement that such a
    decision would consume; they do not make it and must not be read as making it.
  - >-
    The census is scoped to one pinned commit of one repository. Concurrent worktrees hold
    different corpora, so every count is a floor over the pinned tree and is not an exact figure
    for the program as a whole.
  prior_evidence_refs:
  - EV-SSI-001
  - EV-SSI-042
  - EV-SSI-0eb0b1
  - EV-SSI-59f7a2
  - EV-SSI-8aaad0
  - EV-WESO-b6ceff
  - KN-FIND-030
