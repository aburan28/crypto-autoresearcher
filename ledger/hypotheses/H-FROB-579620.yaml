# H-FROB-579620 — specified from IDEA-20261005-f1b0af.
# Protocol approval is DEC-20261006-3685d2. This record asserts nothing
# about the two weights. No degree-3 minimal-polynomial coefficient
# vector is recorded here.
hypothesis:
  id: H-FROB-579620
  question_id: RQ-FROB-7d8dd4
  source_proposal: IDEA-20261005-f1b0af
  goal_id: null
  goal_id_note: >-
    ledger/questions/RQ-FROB-7d8dd4.yaml has goal_ids empty. This design
    does not attach a goal, does not edit a goal head, and does not
    claim a lane.
  status: approved
  status_note: >-
    approved means the measurement protocol in EXP-FROB-d056ce is
    approved for a later executor. It does not mean the object weight
    is smaller. Status moves only by DEC-20261006-3685d2 under the
    standing user authorization of 2026-09-06. No degree-3 weight was
    recorded in this design.
  proposed_by: coordinator
  conversion_note: >-
    The two curves, the two degree-3 x-coordinates, the weight
    definition, and the prediction that the object weight is strictly
    smaller are carried from IDEA-20261005-f1b0af. The Coordinator
    named both curves and both coordinates by a point-count and
    square-test census. That census is instance selection. The
    coefficient vectors of the two degree-3 minimal polynomials were
    not recorded.

  statement: >-
    TEST BOUNDARY. Let F_343 = F_7[z] / (z^3 + 2). Order field elements
    c0 + c1*z + c2*z^2 by lexicographic order on (c0, c1, c2), with c0
    the most significant coordinate. The object curve is E, given by
    y^2 = x^3 + 1 over F_7. The object coordinate is x_E = 3*z^2. The
    null curve is E-prime, given by y^2 = x^3 + (z^2)*x + (2 + z + z^2)
    over F_343. The null coordinate is x_Eprime = z^2. Let w be the
    number of nonzero coefficients in F_7 of the monic minimal
    polynomial over F_7, including the leading 1. The pre-registered
    prediction is w(x_E) < w(x_Eprime), equivalently
    w(x_Eprime) - w(x_E) >= 1. Equal weights, and a larger object
    weight, are negatives. This is one integer comparison. It is not a
    relation collection and it does not change an ECDLP exponent.

    DISTINGUISHABLE OUTCOMES. (1) The executor recomputes the selection
    census and lands on these two curves and these two coordinates, the
    degree, order, trace, j-invariant, instrument, and Frobenius
    controls pass, and w(x_E) is strictly smaller than w(x_Eprime):
    this coordinate is sparser than the matched-order null. (2) The
    same controls pass and w(x_Eprime) - w(x_E) <= 0: negative.
    (3) An earlier model qualifies, a degree is not 3, the orders are
    not both 324, a trace is divisible by 7, a j-test fails, the
    instrument mis-weighs T - 1, or Frobenius changes a minimal
    polynomial: invalid, not evidence. (4) A timeout or a missing
    dependency: failed_infrastructure, not evidence.

  mechanism: >-
    Both selected elements have Frobenius-orbit size 3, so both minimal
    polynomials have degree 3. A smaller weight is sparsity of
    coefficients beyond that degree. The design-session census found
    the orbits of 3*z^2 and of z^2 each have size 3. It did not record
    the coefficient vectors. Disagreement of the weights in the
    predicted direction means this one object coordinate is sparser
    over F_7 than the null coordinate at the same field and the same
    rational-point count 324. Equality or the opposite inequality means
    this coordinate shows no such sparsity. Neither outcome prices a
    pipeline stage and neither is a rho timing.

  assumptions:
    - The first monic irreducible cubic over F_7 is z^3 + 2. The executor recomputes that scan. A different polynomial makes the run invalid.
    - Lexicographic order on (c0, c1, c2) uses c0 as the most significant coordinate. Short-Weierstrass models are ordered by (A, B) in that same element order, with A most significant. Over F_7 the same rule is integer order on (a, b).
    - Both selected x-coordinates have degree 3. An x-coordinate in F_7 is skipped. For this prime extension, degree 3 is exactly the condition of lying outside F_7.
    - E-prime matches the rational-point count 324, is ordinary over F_343, and its j-invariant is not in F_7.
    - The design session computed point counts, j-invariants, and Frobenius-orbit sizes. It did not record degree-3 coefficient vectors. The prediction is fixed before those weights are written down.

  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
    not_applicable_reason: >-
      This is a measurement of two coefficient weights at (q, n) = (7, 3).
      It is not a proof, an asymptotic bound, a certificate family, a
      reduction, or a closure argument.

  asymptotic_claim:
    problem: none — no complexity improvement is claimed
    prior_best: unchanged; no ECDLP baseline is moved
    time_exponent: unchanged
    memory_exponent: unchanged
    hidden_cofactor: none introduced
    claim_kind: not_applicable

  heuristic_assumptions:
    - id: HA-1
      formal_statement: >-
        The weight of the monic minimal polynomial of one degree-3
        element imitates the Hamming weight of a uniform random monic
        polynomial of degree 3 over F_7, whose mean is 24/7. The sample
        is the two named elements. No transfer to another extension is
        claimed. The prediction under test is the inequality
        w(x_E) < w(x_Eprime), not a fit to the mean 24/7.
      random_model_justification: >-
        The minimal polynomial of a field element is monic of degree
        dividing 3, so a degree-3 polynomial has weight in
        {1, 2, 3, 4}. That bound is the rigorous part. Uniformity among
        monic polynomials is the imitation. Sample size two has no tail
        beyond the interval check.
      supporting_results: []
      validation_experiment_ids:
        - EXP-FROB-d056ce
      falsification_condition: >-
        The controls pass and w(x_Eprime) - w(x_E) <= 0, or a recorded
        weight falls outside {1, 2, 3, 4}, or a recorded degree is not 3.

  predictions:
    - metric: w(x_Eprime) - w(x_E)
      direction: higher
      minimum_effect: 1

  test_boundary:
    instances:
      - id: f7-degree3-x-weight
        field_polynomial: "z^3 + 2"
        object_curve: "y^2 = x^3 + 1"
        object_coefficients_over_F7: [0, 1]
        object_coordinate: "3*z^2"
        object_coordinate_coeffs: [0, 0, 3]
        null_curve: "y^2 = x^3 + (z^2)*x + (2 + z + z^2)"
        null_A_coeffs: [0, 0, 1]
        null_B_coeffs: [2, 1, 1]
        null_coordinate: "z^2"
        null_coordinate_coeffs: [0, 0, 1]
        matched_point_count: 324
        object_trace_over_F7: -4
        trace_over_F343: 20
        j_object: 0
        j_null_coeffs: [1, 1, 0]
        note: >-
          These figures are the design-session point-count, j-invariant,
          and orbit-size census. They are not weights.
    parameters:
      q: 7
      n: 3
      field_size: 343
    implementation: >-
      Recompute the selection census by exact point counts, the j
      formula 6912*A^3 / (4*A^3 + 27*B^2) reduced in characteristic 7,
      and Frobenius orbits. Then build each monic minimal polynomial by
      linear algebra on {1, x, x^7, x^{49}} over F_7 and count nonzero
      coefficients, including the leading 1. No floating point. No rho.
      No summation polynomial. No degree-3 coefficient vector was
      recorded while specifying this record.
    budget:
      maximum_runs: 2
      note: >-
        One scientific execution on the frozen pair of coordinates.
        maximum_runs 2 allows one infrastructure retry under a new run
        id. The scientific object is frozen at these two curves and
        these two x-coordinates.

  falsification_conditions:
    - The controls pass and w(x_Eprime) - w(x_E) <= 0.
    - E(F_343) has no x-coordinate of degree 3. That outcome means the named coordinate was wrong. It is invalid, not a negative on the weights.
    - No ordinary curve over F_343 has j outside F_7 and rational-point count 324. That outcome means the named null was wrong. It is invalid, not a negative on the weights.

  interpretation_limits:
    - A weight gap of 1 on one coordinate is sparsity of one polynomial. It is not a change in solving degree, relation yield, or linear-algebra dimension.
    - The degree-3 condition already removes the orbit-size alternative. The comparison does not re-measure that factor.
    - This measurement does not change an ECDLP exponent. No discrete logarithm is computed. Matched rho is not run.
    - RQ-FROB-7d8dd4 asks for a stage-charged pipeline against Frobenius-class rho. This record is one integer at (7, 3) and does not answer that comparison. Toy scope only.

  citations:
    - ref: IDEA-20261005-f1b0af
      provenance: internal
      claim: >-
        One degree-3 x-coordinate on the lexicographically first ordinary
        curve over F_7 has strictly smaller minimal-polynomial weight
        than the matched-order null curve over F_343. Equal or larger
        object weight is the idea's negative. The idea does not claim an
        ECDLP exponent.
      verified_by: >-
        coordinator design session 2026-10-06 read the proposal bytes
        from origin/design/hyper-fb6ec7-richelot, blob
        0cc9831e393a783808066f1b2c7bc4b58be70ce4, copied unchanged to
        ledger/proposals/IDEA-20261005-f1b0af.yaml
    - ref: RQ-FROB-7d8dd4
      provenance: internal
      claim: >-
        The question asks whether the q-power Frobenius reduces the fully
        charged cost of index calculus on a subfield curve by more than
        the trivial n-fold symmetry, against a matched null and against
        Frobenius-class rho. Toy evidence does not authorize a scaling
        claim.
      verified_by: >-
        coordinator design session 2026-10-06 read
        ledger/questions/RQ-FROB-7d8dd4.yaml
