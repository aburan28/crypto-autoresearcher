hypothesis:
  id: H-SDEG-3acfcf
  question_id: RQ-SDEG-001
  goal_id: GOAL-SDEG-001

  statement: >-
    SCOPE: the certificate-coverage accounting of a charged Semaev decomposition
    cost model C_decomp(p, m) over prime fields, at arities m in {3, 4, 5}, on
    the toy ladder this goal already owns. CLAIM TIER toy for every measurement;
    the coverage identity itself is symbolic. NO ATTACK, NO EXPONENT, NO
    SPEEDUP, NO STATUS CHANGE TO ANY RECORD.
    Three assertions, in decreasing order of how unconditional they are.
      (A1) COVERAGE IDENTITY, symbolic. A Semaev decomposition certificate is
           defined only on successful attempts. Writing P_dec for the per-attempt
           success probability and C_succ, C_fail for the charged cost of a
           successful and an unsuccessful attempt, the certificate-covered share
           of total charged decomposition cost is
             chi = P_dec C_succ / (P_dec C_succ + (1 - P_dec) C_fail),
           which under the equal-work model C_fail = C_succ equals P_dec exactly,
           and at the standard operating point B = (m! N)^{1/m} equals 1/m!
           INDEPENDENT OF N, p AND THE CURVE: 0.16667 at m = 3, 0.041667 at
           m = 4, 0.0083333 at m = 5. The UNCONDITIONAL half is the upper bound
           P_dec <= C(B+m-1, m)/N, which is a count and needs no heuristic.
      (A2) NUMERATOR COMPLETENESS. The quantity GOAL-ICEX-001 needs is
           T_IC = m! N B^{1-m} C_decomp + C_linalg with a memory column beside
           it. C_decomp is a factor inside the first term only. At any
           cost-balanced B the two terms are equal by construction, so the
           collection share is exactly 1/2 and a C_decomp-only numerator
           understates total time by exactly 2 at the optimum. Separately and
           more importantly, index calculus stores Omega(B) = Omega(N^{1/m})
           while the matched Pollard rho control stores O(1), so the two sides
           are PARETO-INCOMPARABLE until a memory model is fixed --
           and GOAL-SDEG-001's completion criterion names certificates and
           matched rho/BSGS controls and DOES NOT MENTION MEMORY.
      (A3) CONSTRUCTIVE REPAIR, THE ONLY SPECULATIVE PART. The failed attempts
           are certifiable at cheap verification cost by a degree-bounded
           Nullstellensatz witness 1 = sum_i g_i f_i, which is a vector in the
           row space of the Macaulay matrix that this goal's own solving-degree
           instrument already reduces. Verification is one polynomial
           multiply-and-add; production is a by-product of the rank computation.
           NO SIZE IS ASSERTED for the witness -- its size is the measurement,
           and it is the obvious failure mode.
    IF A1 IS ALREADY STATED IN THE CERTIFICATE CONTRACT, or if a negative
    certificate is already specified there, the deliverable is a NAMED NEGATIVE:
    the accounting is already owned, with the record that owns it cited, and this
    hypothesis is withdrawn at zero cost.

  mechanism: >-
    DERIVED IN-REPO. No source is cited as support: Gaudry and Diem on elliptic
    index calculus, Wiedemann and Lanczos on sparse linear algebra, and effective
    Nullstellensatz degree bounds are ALL NOT READ, and every recalled complexity
    below is labelled RECALLED-UNVERIFIED and is a candidate to check, never an
    authority.

    PART 1 - THE COUNT THAT FIXES chi. Let the prime-order subgroup have size N
    and the factor base F have size B, and let arity be m. The unordered
    m-multisets over F number C(B + m - 1, m) = B^m/m! (1 + O(m^2/B)). Each maps
    to one group element, so AT MOST that many of the N elements are m-fold sums.
    Hence UNCONDITIONALLY
      P_dec <= C(B + m - 1, m) / N,
    and under the standard spreading heuristic (HEUR-CERTCOV-1 below) with near
    equality. At the operating point B^m/m! ~ N this gives P_dec ~ 1/m!, a
    function of the ARITY ALONE. That independence is what makes a toy
    measurement of chi meaningful: it is not an extrapolation in N.

    PART 2 - WHERE THE CERTIFICATE LIVES. Under the GOAL-ECDLP-001 certificate
    contract, a claimed relation carries the m factor-base indices; a verifier
    recomputes the sum in O(m) group operations and compares with the target.
    This is unconditional, implementation-independent, and cheap -- everything a
    certificate should be. IT DOES NOT EXIST FOR A FAILURE. "R does not decompose
    over F at arity m" is a universally quantified statement about a variety, and
    the present contract attaches to it only a solver transcript and a wall-clock
    number. Since the charged cost integrates over all attempts and only 1/m! of
    them succeed, the certificate covers chi of the number being reported and no
    more. THE DERIVATION IS THE WHOLE POINT: chi is not an implementation detail,
    it is forced by the choice of certificate.

    PART 3 - THE DIRECTION NOBODY NOTED. If C_fail < C_succ -- which is exactly
    what a working early-abort test produces -- then chi RISES above P_dec.
    Numerically at m = 4: chi = 0.0417 at C_fail = C_succ, 0.0800 at
    C_fail = C_succ/2, and 0.3030 at C_fail = C_succ/10. So a validated
    early-abort smoothness test does not merely cut cost, it RAISES THE VERIFIED
    FRACTION OF THE COST THAT REMAINS. That is a reason to care about the
    HEUR-DS-1 lane which appears in no record in this corpus and which survives
    whatever the smoothness verdict turns out to be. Symmetrically, if the
    backend must complete the basis before reading solutions then C_fail = C_succ
    and chi is exactly 1/m!; and if failure is MORE expensive than success then
    chi falls below 1/m!. All three regimes are measurable on the lane's own
    backend and the sign of the deviation is itself diagnostic.

    PART 4 - THE NUMERATOR. Relation collection needs about B relations at
    1/P_dec attempts each:
      C_collect = B C_decomp / P_dec = m! N B^{1-m} C_decomp.
    The relation matrix is B x B over F_N with about m nonzeros per row; a sparse
    solve costs Theta(m B^2) field operations (RECALLED-UNVERIFIED for the
    constant and the exponent; the audit records the exponent it uses rather than
    assuming it) and stores Omega(m B) entries. Setting dT_IC/dB = 0 balances the
    two terms, at which point the collection share s = C_collect/T_IC = 1/2
    EXACTLY and the Amdahl ceiling on end-to-end gain from improving collection
    alone is 1/(1 - s) = 2.
    PRIORITY DISCLAIMER, RECORDED SO NO SYNTHESIS DOUBLE-COUNTS: the same Amdahl
    bound is derived independently, for the BKK speedup trichotomy under
    RQ-ECDLP-002, in ledger/proposals/IDEA-20260805-1f4a11.yaml of the same date.
    The two are ONE derivation reached twice and neither corroborates the other.
    What is specific to this hypothesis is the MEMORY column and the certificate
    coverage, neither of which appears there.

    PART 5 - THE MEMORY STATEMENT, WHICH IS THE PART NOBODY CHARGED. Index
    calculus must hold the factor base (Omega(B) points) and the relation matrix
    (Omega(m B) entries) simultaneously; at the operating point that is
    Omega(N^{1/m}). Pollard rho with negation and distinguished points holds O(1)
    state, or O(w) for the parallel van Oorschot-Wiener variant with w chosen
    freely. A comparison reported as a single exponent alpha against rho's 1/2
    therefore compares an Omega(N^{1/m})-memory algorithm with an O(1)-memory one
    and calls the result a scalar. Under any area-time charging the pair is
    incomparable rather than ordered. THIS IS NOT AN OBJECTION TO GOAL-ICEX-001;
    it is a specification of what its numerator package must contain, and it is
    exactly the kind of Pareto honesty docs/target-result-profile.md demands and
    that the house exemplar itself exhibits (a memory-incomparable trade, not a
    domination).

    PART 6 - THE REPAIR, AND WHY THIS GOAL IS THE RIGHT OWNER. A failed attempt
    asserts that a polynomial system has no admissible solution. If the solver has
    reduced the system at Macaulay degree D and found 1 in the ideal, the witness
    is an explicit tuple (g_i) with deg(g_i f_i) <= D and 1 = sum_i g_i f_i --
    a vector in the row space of the degree-D Macaulay matrix expressing the
    constant monomial. VERIFYING IT IS UNCONDITIONAL AND CHEAP: multiply out and
    compare coefficients; no solver is trusted and no implementation is trusted.
    PRODUCING IT is not free, and the honest question is its SIZE, bounded above
    by sum_i #{monomials of degree <= D - deg f_i}. NO NUMBER IS ASSERTED. The
    structural point that IS derived: the Macaulay-rank-at-degree-D computation is
    the instrument this goal's own lineage (H-SDEG-0dd021, the SIG/DREG
    experiments) already builds and measures. The lane owns the machine and has
    never asked it for the receipt.

  assumptions:
  - >-
    FROZEN EVALUATION PROTOCOL, FIXED BEFORE ANY MEASUREMENT IS OBSERVED.
    (1) chi is defined as the charged-cost share, not the attempt share and not
        the relation share; all three are reported, and the relation share
        (trivially 1) is reported explicitly as trivial so it cannot be quoted
        alone.
    (2) P_dec is MEASURED at each toy cell and compared with C(B+m-1,m)/N; the
        measured value, not the model value, enters chi.
    (3) C_fail/C_succ is measured with early abort DISABLED first, and then at
        three further abort settings, in that order.
    (4) The linear-algebra exponent used in the s = 1/2 statement is recorded
        explicitly as Theta(m B^2) and flagged RECALLED-UNVERIFIED; if a
        committed source or measurement gives another, s is restated at the
        corrected balance point rather than defended.
    (5) The memory column reports the SCALING of stored objects with B, not a
        resident-set byte count, because at toy scale the interpreter dominates.
    NO OTHER DEGREE OF FREEDOM. Any change after a number is observed requires a
    versioned protocol amendment with confirmatory_status exploratory_only.
  - >-
    That "certificate" in the GOAL-ECDLP-001 certificate contract means an
    independently re-verifiable artifact for a claimed relation or solve. READ
    FROM ledger/questions/RQ-SDEG-001.yaml constraints ("Matched rho/BSGS
    controls and certificates are mandatory") and from
    docs/claims-and-verification.md. IF THE CONTRACT IN FACT SPECIFIES SOMETHING
    ELSE, OR ALREADY SPECIFIES A NEGATIVE CERTIFICATE, A1 IS VOID and stage 0 of
    the paired contract says so and stops.
  - >-
    No status change is proposed for GOAL-SDEG-001, GOAL-ICEX-001, RQ-SDEG-001,
    H-SDEG-0dd021, or any evidence record, and in particular NO CLAIM IS MADE
    THAT ANY COMPLETION CRITERION IS UNMET. Only the Coordinator may make that
    judgement (AGENTS.md rule 1).
  - >-
    The toy ladder cannot see the linear-algebra term. At 16-24 bits B is small
    and the matrix stage is negligible, so a measured collection share near 1 is
    GUARANTEED and says nothing about the asymptotic balance. This is stated
    before measuring so the measurement cannot be read as reassurance.

  proof_search_map:
    bottleneck: >-
      The join between the two words in this goal's own title and completion
      criterion: "certificate-backed" and "cost model". Every downstream use of a
      C_decomp number by GOAL-ICEX-001 inherits whatever fraction of that number
      is actually backed, and no record states the fraction.
    baseline_embedding:
      parameter_slice: >-
        m = 1 (trivial arity): every target that lies in the factor base
        decomposes, P_dec = B/N, C_fail = C_succ = one table lookup, and chi =
        P_dec exactly with no heuristic at all. The identity is exactly
        reproducible by hand at this slice, and the certificate is a single
        index.
      reproduction_check: >-
        SYMBOLIC. At m = 1 the general formula chi = P_dec C_succ / (P_dec C_succ
        + (1-P_dec) C_fail) collapses to B/N under equal work, which is the
        directly countable answer. A second, fully enumerable check: at m = 2 and
        a toy p of a few hundred, C(B+1,2) can be enumerated exhaustively and
        P_dec computed EXACTLY rather than sampled, so the model and the truth
        can be compared with no statistics. Neither of these is a curve that
        resembles a baseline; both are exact identities.
    observation_collision:
      observable: >-
        A reported charged cost C_decomp(p, m) with the adjective
        "certificate-backed" attached.
      distinct_preimage_search: >-
        THE COLLISION IS THE POINT AND IT IS EXHIBITED RATHER THAN SEARCHED FOR.
        Two decidedly different ground-truth situations produce the SAME
        observable: (i) a run in which every attempt succeeded and every relation
        was verified, and (ii) a run in which 1/m! of attempts succeeded, all
        were verified, and the remaining 1 - 1/m! of the charged cost is
        unverified solver time. Both report the same C_decomp with the same
        adjective and the same set of valid certificates. NOTHING IN THE PRESENT
        CONTRACT SEPARATES THEM. The separating condition proposed here is the
        explicit reporting of chi, and A3 is the attempt to remove the collision
        entirely by making the projection total.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        Move the assertion "this system has no admissible solution" into a model
        where it is an exact linear-algebra equality: 1 lies in the row space of
        the degree-D Macaulay matrix, witnessed by an explicit coefficient
        vector.
      predicted_gain: >-
        Converts an unverifiable universal statement into a checkable identity
        whose verification cost is a single polynomial multiply-and-add.
        Obligations kept separate as the transform requires: ENCODING (the
        witness is a Macaulay row-space vector), COMPLETENESS (a witness exists
        whenever the solver correctly reports no solution at degree D -- this is
        NOT proved here and is the first thing to check), SOUNDNESS
        (verification is unconditional), TRANSFER (nothing about boolean systems
        transfers to prime fields and vice versa), COST LOSS (witness size,
        UNBOUNDED HERE and declared unmet rather than deferred).
    - transform: specialize_measure_pack
      proposed_object: >-
        Build chi as a problem-specific resource measure -- charged cost weighted
        by verifiability -- and report it beside, never instead of, the raw cost.
      predicted_gain: >-
        Makes the observable collision above visible in the deliverable itself,
        so that a future consumer of the ICEX numerator can see how much of it is
        backed without re-deriving anything.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER: FORALL arities m and FORALL choices of factor-base
      size B, EXISTS a single formula chi(P_dec, C_fail/C_succ) -- fixed,
      parameter-free, stated before evaluation -- returning the
      certificate-covered share. The witness formula may NOT depend on m, B, p or
      the curve. The reverse order, FORALL cells EXISTS a chi, is trivially
      satisfiable and is NOT claimed.
      THE QUANTIFIER TRAP BEING HUNTED IN THE AUDITED OBJECT: a certificate
      contract is naturally read as "FORALL charged operations EXISTS a
      verification", while what is implemented is "FORALL SUCCESSFUL attempts
      EXISTS a verification". Those differ by a factor of m! and the difference is
      invisible in the phrase "certificate-backed".
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that the certificate defined by the present contract covers a
        derivable share of a charged decomposition cost, that the share is 1/m!
        under a stated model, that a C_decomp-only ICEX numerator omits a
        linear-algebra term and a memory column, and -- if A3 survives -- that a
        cheaply verifiable negative certificate exists at the tested toy cells.
        IT CANNOT certify that index calculus is worse or better than rho, cannot
        move the exponent alpha, cannot establish a prime-field solving-degree
        law, cannot close KN-OPEN-002, and cannot establish that any completion
        criterion is unmet.
      nearby_object_control: >-
        THE MATCHED POLLARD RHO ARM, where the hoped-for conclusion FAILS in an
        instructive way. Rho has exactly the same asymmetry: a collision is
        trivially checkable, a NON-collision is not, so rho's own certificate
        coverage is also far below 1 -- and nobody has ever complained about it,
        because rho's cost model is not presented as certificate-backed. Applying
        this hypothesis's accounting to rho MUST return a low chi as well. IF IT
        DOES NOT, the accounting is measuring something specific to Groebner
        solvers rather than to certificates, and it has not found the
        load-bearing structure. A SECOND nearby object: BSGS, where the "failure"
        of a lookup is a table miss that IS cheaply certifiable by the sorted
        table itself -- so BSGS should score HIGH. A method that cannot separate
        rho, BSGS and index calculus on this axis is measuring noise.
    proof_obligations:
    - claim: chi = P_dec under equal work, and 1/m! at the operating point.
      responsibility: correctness
    - claim: P_dec <= C(B+m-1, m)/N unconditionally.
      responsibility: correctness
    - claim: Measured P_dec agrees with the count at the toy cells.
      responsibility: baseline
    - claim: >-
        The equal-work model is measured, not assumed, at four abort settings.
      responsibility: strictness
    - claim: >-
        The linear-algebra exponent used is recorded and flagged as recalled.
      responsibility: interface
    - claim: >-
        The memory statement reports scaling with B, not a byte count.
      responsibility: runtime
    - claim: >-
        A Nullstellensatz witness, if produced, verifies without trusting the
        solver, and its size is reported.
      responsibility: feasibility
    - claim: >-
        Nothing transfers to the index-calculus exponent or to crypto scale, and
        the gap is stated on every citation.
      responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. No complexity claim of any kind is made. This is an
    accounting statement about what a cost model verifies and what its consumer
    needs. It makes no system easier to solve, moves no exponent, and adds no
    attack. Pollard rho remains the ECDLP baseline; sota_delta is zero on every
    attack axis. dominated_by is not applicable -- no Pareto point is claimed for
    this work, and the Pareto observation it makes is about the OBJECTS BEING
    COSTED, not about itself.

  heuristic_assumptions:
  - id: HEUR-CERTCOV-1
    formal_statement: >-
      For uniformly random targets in a prime-order subgroup of size N and a
      factor base of size B, P_dec = C(B + m - 1, m)/N * (1 + o(1)) whenever
      B^m/m! = o(N).
    random_model_justification: >-
      The UPPER bound is unconditional -- at most C(B+m-1,m) group elements are
      m-fold sums. The matching lower bound requires the multiset sums to be
      nearly distinct, i.e. few coincidences, which is the standard heuristic of
      the field and is NOT proved here. The pessimistic direction of this
      hypothesis needs only the unconditional half.
    supporting_results: []
    validation_experiment_ids: [EXP-SDEG-0be8e4]
    falsification_condition: >-
      Measured P_dec on the real factor base exceeds C(B+m-1,m)/N by more than a
      factor of 2, or falls below by more than a factor of 4, at any toy cell.
      Either refutes the heuristic THERE and every chi number is restated against
      the measurement. An excess on the real factor base together with agreement
      on the matched-random null would be a finding about index calculus, not
      about certificates, and would be reported as the more interesting result.
  - id: HEUR-CERTCOV-2
    formal_statement: >-
      With early abort disabled, C_fail = C_succ (1 + o(1)) on the lane's
      Groebner backend, because the basis must be completed before solutions are
      read off.
    random_model_justification: >-
      Structural, not proved, and it fails for any backend that detects
      infeasibility early. This is why it is measured at four abort settings
      rather than assumed, and why chi is reported as a function of C_fail/C_succ
      rather than as a single number.
    supporting_results: []
    validation_experiment_ids: [EXP-SDEG-0be8e4]
    falsification_condition: >-
      Measured C_fail/C_succ outside [0.8, 1.2] with abort disabled. chi is then
      restated at the measured ratio and the 1/m! headline is qualified.
  - id: HEUR-CERTCOV-3
    formal_statement: >-
      Sparse elimination on the B x B relation matrix with about m nonzeros per
      row costs Theta(m B^2) field operations and stores Omega(m B) entries.
    random_model_justification: >-
      RECALLED-UNVERIFIED as the standard Wiedemann/Lanczos accounting; no source
      was read. The s = 1/2 statement needs only that the term be
      non-negligible at the balanced B, and the memory statement needs only
      Omega(B) storage, which follows from holding the factor base alone.
    supporting_results: []
    validation_experiment_ids: [EXP-SDEG-0be8e4]
    falsification_condition: >-
      A committed source or measurement giving a materially different exponent
      for this matrix shape. s = 1/2 is then restated at the corrected balance
      point; the memory statement is unaffected because it follows from the
      factor base alone.
  - id: HEUR-CERTCOV-4
    formal_statement: >-
      Whenever the solver correctly reports no admissible solution after reducing
      at Macaulay degree D, an explicit witness (g_i) with deg(g_i f_i) <= D and
      1 = sum_i g_i f_i exists and is extractable from the reduction.
    random_model_justification: >-
      NONE, AND THIS IS THE WEAKEST LINK IN THE RECORD. It is exactly the
      completeness obligation of the representation_reduction transform, and it
      can fail: a solver may report no admissible solution for reasons other than
      1 lying in the degree-D ideal (for instance because the admissible set is
      imposed by constraints handled outside the ideal). The hypothesis therefore
      claims A3 only as a candidate and the paired contract tests it at the
      smallest enumerable cell before anything else in A3 is attempted.
    supporting_results: []
    validation_experiment_ids: [EXP-SDEG-0be8e4]
    falsification_condition: >-
      At the smallest fully enumerable cell, a failed attempt for which no
      degree-D witness exists. A3 is then refuted AT THAT DEGREE, which is a
      scoped negative naming its own residual (a higher degree, or a different
      certificate for the admissibility constraints), and is reported as such
      rather than as "negative certificates are impossible".

  structural_ingredients:
  - description: >-
      Multiset counting C(B + m - 1, m) and the resulting unconditional upper
      bound on the decomposition probability.
    citation: >-
      Elementary and derived here. The corresponding index-calculus cost analysis
      is attributed in the literature to Gaudry and to Diem; NOT READ, and
      nothing here depends on them.
    role: fixes P_dec and hence chi
  - description: >-
      Degree-bounded Nullstellensatz representation 1 = sum g_i f_i as a
      row-space vector of the Macaulay matrix.
    citation: >-
      Effective Nullstellensatz degree bounds exist in the literature and were
      NOT READ; no bound is asserted. Only the trivial verification direction is
      used, which needs no source.
    role: candidate negative certificate
  - description: >-
      The Macaulay-rank-at-degree-D instrument already built and measured by this
      area's own lineage.
    citation: >-
      ledger/hypotheses/H-SDEG-0dd021.yaml (READ), which specifies exact GF(2)
      Macaulay rank at degrees 5 and 6 with chunked execution and persisted
      system hashes. NOTE THE GAP, CARRIED NOT HIDDEN: that lineage is BOOLEAN
      and this hypothesis concerns PRIME FIELDS. The instrument's existence is
      cited as evidence that the lane knows how to build such a thing, NOT as a
      claim that the boolean instrument can be reused.
    role: production path for the candidate negative certificate

  reduction_chain:
    core_problem: >-
      Determine what fraction of a charged Semaev decomposition cost is backed by
      an independently verifiable artifact, and what a numerator package must
      contain to be usable by GOAL-ICEX-001.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. Nothing here reduces to a statement about the
      index-calculus exponent, about crypto-scale cost, or about KN-OPEN-002. A
      completeness statement about a numerator is not a numerator.

  predictions:
  - metric: >-
      P1 - chi at m = 3, 4, 5 under the equal-work model at the operating point,
      derived symbolically
    direction: lower
    minimum_effect: >-
      'EXACTLY 1/6 = 0.166667, 1/24 = 0.0416667, 1/120 = 0.00833333. Not a
      tolerance: these are exact rationals and a symbolic re-derivation returning
      anything else refutes the arithmetic at zero cost.'
  - metric: >-
      P2 - measured P_dec versus C(B+m-1, m)/N at the lane''s toy cells,
      treatment and matched-random null
    direction: different
    minimum_effect: >-
      'Within a factor of 2 on both arms. A departure larger than that on the
      real factor base with agreement on the null is a structured-dependence
      finding about index calculus and is more valuable than the coverage number.'
  - metric: >-
      P3 - measured C_fail / C_succ with early abort disabled
    direction: different
    minimum_effect: >-
      '1.00 with tolerance [0.8, 1.2]. The direction of any deviation is
      diagnostic and must be reported before chi is recomputed.'
  - metric: >-
      P4 - chi as a function of the abort setting, four levels
    direction: higher
    minimum_effect: >-
      'MONOTONE INCREASING as abort becomes more aggressive, with forced values at
      m = 4 of 0.0417 at ratio 1, 0.0800 at ratio 1/2 and 0.3030 at ratio 1/10.
      A non-monotone result localises an accounting error rather than leaving
      "the numbers moved".'
  - metric: >-
      P5 - certificate coverage of the matched control arms (Pollard rho, BSGS)
      under the same accounting
    direction: different
    minimum_effect: >-
      'FORCED ORDERING, NOT A VALUE: BSGS strictly above index calculus, and
      Pollard rho comparably low. If the accounting does not separate BSGS from
      rho it is not measuring verifiability and NO conclusion about index calculus
      may be drawn from it.'
  - metric: >-
      P6 - memory scaling of the index-calculus arm with B, against the matched
      rho arm on the same instance
    direction: higher
    minimum_effect: >-
      'Stored-object count must grow at least linearly in B on the IC arm and
      stay constant on the rho arm across at least three values of B. If the IC
      arm does not grow with B, the implementation is not storing what the cost
      model assumes and the measurement is INVALID rather than favourable.'
  - metric: >-
      P7 - existence, size and verification time of a degree-D Nullstellensatz
      witness for one failed attempt at the smallest enumerable cell
    direction: lower
    minimum_effect: >-
      'NO SIZE IS PREDICTED -- asserting one would be fabrication. The forced,
      falsifiable claim is the asymmetry: verification must cost at least ten
      times less than re-solving the same cell. If it does not, A3 is dead AT
      THAT CELL and the scale is stated.'

  test_boundary:
    instances:
    - >-
      Prime-field short-Weierstrass ordinary curves on this goal's existing toy
      ladder; the lane's own factor-base construction; arities m in {2, 3, 4}
      for measurement and {3, 4, 5} for the symbolic identity.
    - >-
      The matched Pollard rho and BSGS control arms on the same instances, for
      the nearby-object control of the coverage accounting.
