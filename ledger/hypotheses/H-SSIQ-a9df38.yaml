hypothesis:
  id: H-SSIQ-a9df38
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  source_proposal: IDEA-20260926-e1b48e
  class: closure
  statement: >-
    DETERMINANT LEMMA (derivation tier, with a computational normalisation
    check). For every prime p and every pair (E, E') of supersingular elliptic
    curves over F_{p^2}, the Z-lattice Hom(E, E') under the quadratic form deg
    has Gram determinant EXACTLY p^2/16. Gram convention: the matrix A with
    A_ii = q(e_i) and A_ij = (q(e_i+e_j) - q(e_i) - q(e_j))/2 on a Z-basis
    (e_1..e_4), i.e. q(x) = x^T A x. Consequently every full-rank (rank-4)
    sublattice L of index m in Hom(E, E') has det(L, deg) = m^2 p^2/16 >= p^2/16,
    so log_p(det L)/4 >= 1/2 - log_p(16)/4, and a Hermite/Minkowski-type
    certificate min q <= c_4 det(L)^{1/4} built from L can never certify a
    nonzero isogeny E -> E' of degree below (c_4/2) p^{1/2}.
    CONSEQUENCE FOR GOAL-SSIQ-001 (proposed, not enacted here). The corrected
    admissibility criterion recorded by DEC-20260805-2be965 in
    ledger/goals/GOAL-SSIQ-001/goal.yaml exponent_budget_corrections
    (factor: admissibility_criterion) reads "log_p(det)/rank <= 1/4, which
    admits rank 4 with det <~ p. Rank > 3 is exactly where N5's
    higher-dimensional case lives." If this hypothesis is supported, the
    "rank 4 with det <~ p" option is EMPTY for every lattice lying inside a
    single Hom(E, E') under deg in DIMENSION ONE, for every auxiliary target
    E' (not only E^{(p)}); lever L1's recorded "rank-4 object (P, Nrd/p) gives
    exponent 1/2" is the index-1 case. Lever N5 (levers_added) is NOT closed:
    only its rank-4, dimension-one, single-Hom-module, degree-form branch is.
  mechanism: >-
    Deuring correspondence plus quaternion-order lattice algebra. (1) For a
    maximal order O of B_{p,inf} the trace form Trd(x ybar) has determinant
    disc(O) = p^2; the Gram matrix of Nrd is half the trace-form matrix, so
    det(O, Nrd) = p^2/2^4 = p^2/16. (2) Under Deuring, Hom(E, E') with deg is
    isometric to (I, Nrd/n(I)) for a left O-ideal I connecting End(E) = O to
    O_R(I) ~ End(E') (frozen source inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
    line 244 states the E' = E^{(p)} case with I = P, the two-sided ideal of
    reduced norm p). (3) [O : I] = n(I)^2, so det(I, Nrd) = n(I)^4 p^2/16, and
    rescaling a rank-4 form by 1/n(I) multiplies the determinant by n(I)^{-4},
    giving det(I, Nrd/n(I)) = p^2/16 independent of I and hence of (E, E').
    (4) det(L) = [M : L]^2 det(M) for full-rank L <= M. The test computes the
    load-bearing normalisation inputs (1), (3), (4) exactly over Q on explicit
    PARI-constructed maximal orders, two-sided ideals P, random left ideals and
    their right orders, with mis-normalised and non-maximal controls that must
    fail. Input (2) is a cited theorem and is NOT independently verified by
    the computation (see interpretation_limits).
  assumptions:
    - >-
      Deuring isometry (input 2) holds for every pair (E, E') with the
      convention-independent determinant: whichever of I, Ibar, I^{-1} (with
      the matching norm rescaling) a given reference uses, conjugation is an
      Nrd-isometry and the rescaled determinant is unchanged. Internal
      citation for E' = E^{(p)}; general pair is recalled (see
      structural_ingredients) and is the one input the run does not test.
    - >-
      "Certificate" means an upper bound on the minimum of the degree form
      derived from (rank, det) alone via a Hermite/Minkowski inequality. The
      lemma says nothing about the actual minimum of any particular Hom(E, E'),
      which can be far smaller than p^{1/2} (BATCH-001: Minkowski bounds are
      upper bounds, never floors).
    - >-
      Exponent statements are asymptotic in p with the constant log_p(16)/4
      stated, not hidden.
  proof_search_map:
    bottleneck: >-
      Whether ANY rank-4 lattice usable as a degree certificate inside a single
      Hom(E, E') under deg has log_p(det)/4 <= 1/4, the corrected
      admissibility window of GOAL-SSIQ-001 (DEC-20260805-2be965).
    baseline_embedding:
      parameter_slice: >-
        L = Hom(E, E^{(p)}) = (P, Nrd/p) at index 1 reproduces lever L1's
        recorded "rank-4 object (P, Nrd/p) gives exponent 1/2":
        log_p(p^2/16)/4 -> 1/2. The rank-3 trace-zero sublattice
        (P^0, Nrd/p), recorded in L1 with discriminant p/4 and exponent 1/3,
        is the nearby-object baseline (frozen Theorem 1.5).
      reproduction_check: >-
        Arm A3 of EXP-SSIQ-6916e8 recomputes det(P, Nrd/p) and control C-NEAR
        recomputes det(P^0, Nrd/p) = p/4 exactly at every tested prime.
    observation_collision:
      observable: >-
        The Gram determinant of a candidate certificate lattice under deg.
      distinct_preimage_search: >-
        The lemma predicts total collision: det(Hom(E, E'), deg) = p^2/16 for
        every pair (E, E'), so the determinant cannot distinguish targets.
        Arms A4/A5 search for a counterexample to this collision over 20
        random left ideals (hence 20 right-order types E') per prime; any
        target with a different determinant refutes it.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fibre of det over all (E, E'), predicted constant. Any route to a
          small-determinant rank-4 certificate must change rank, form, or
          dimension g.
        predicted_gain: >-
          Removes the rank-4 dimension-one branch from the lever map at
          seconds of compute and names the three branches that remain open.
    quantifier_order: >-
      FORALL primes p, FORALL supersingular E, E' / F_{p^2}, FORALL full-rank
      sublattices L <= Hom(E, E'): det(L, deg) = [Hom(E,E') : L]^2 p^2/16 >=
      p^2/16. No witness depends on anything; exact, no heuristic. The
      experiment instantiates the universal statement at a finite frozen set of
      (p, O, I, L) and can only refute it or corroborate its normalisation.
    method_ceiling:
      strongest_certifiable_claim: >-
        No rank-4 Hermite/Minkowski degree certificate inside a single
        Hom-module under deg certifies an exponent below 1/2 in dimension one.
        Nothing about rank <= 3 certificates, non-degree forms, direct sums
        over several targets beyond the one-line rank-8 remark, or g >= 2.
      nearby_object_control: >-
        The rank-3 trace-zero sublattice (P^0, Nrd/p), det p/4, exponent
        -> 1/3 (a theorem, frozen Theorem 1.5). The lemma must not apply there
        (not full rank) and the computation must return p/4, not a multiple of
        p^2/16. A closure that also killed this case would prove too much.
        Second nearby object: (O^0, Nrd), det p^2/4.
    proof_obligations:
      - claim: det(O, Nrd) = p^2/16 for every maximal order O of B_{p,inf}.
        responsibility: baseline
      - claim: >-
          Hom(E, E') with deg is isometric to (I, Nrd/n(I)) for a left O-ideal
          I with O ~ End(E), O_R(I) ~ End(E') (Deuring).
        responsibility: interface
      - claim: "[O : I] = n(I)^2 and det(I, Nrd/n(I)) = det(O, Nrd)."
        responsibility: size
      - claim: "det(L) = [M : L]^2 det(M) for a full-rank sublattice L <= M."
        responsibility: correctness
      - claim: >-
          The conclusion covers full-rank sublattices of a single Hom-module
          under deg in dimension one, and nothing else.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    NULL AND REQUIRED TO BE. This is a closure (a lower bound on what one
    certificate family can certify), not a complexity improvement. It moves
    no time or memory exponent; best known remains p^{1/3+o(1)} under
    Heuristic 1 (frozen Theorem 1.1) and p^{1/2}(log p)^{O(1)} unconditional.
  heuristic_assumptions: []
  heuristic_assumptions_note: >-
    None. The lemma is exact; the only non-computed input is a cited theorem
    (Deuring), listed as a structural ingredient and as a proof obligation.
  structural_ingredients:
    - description: >-
        Hom(E, E^{(p)}) with deg is isometric to the two-sided ideal P of
        reduced norm p in O = End(E) with Nrd/p.
      citation: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md line 244
      provenance: internal
      verified_by: coordinator (DEC-20260926-e05697 design session), line 244 read 2026-09-26
      role: interface for the E' = E^{(p)} case
    - description: >-
        General Deuring correspondence: Hom(E, E') ~ connecting left ideal I
        with deg = Nrd/n(I); a maximal order of B_{p,inf} has discriminant p^2;
        [O : I] = n(I)^2 for an invertible (locally principal) left ideal.
      citation: >-
        Kohel 1996 thesis; Voight, Quaternion Algebras (Ch. 42 Deuring, Ch. 16
        norms/discriminants) -- recalled, not opened in this program
      provenance: recalled
      verified_by: null
      role: >-
        interface (general pair) and normalisation inputs; the normalisation
        inputs are checked computationally by EXP-SSIQ-6916e8, the general
        interface is not
    - description: >-
        Explicit maximal orders by congruence class (used only as a second,
        hand-written order arm A2; PARI's own maximal order is primary):
        p = 2: Z<1, i, j, (1+i+j+k)/2> in (-1,-1); p = 3 mod 4:
        Z<1, i, (1+j)/2, (i+k)/2> in (-1,-p); p = 5 mod 8:
        Z<1, (1+j+k)/2, (i+2j+k)/4, k> in (-2,-p); p = 1 mod 8:
        Z<(1+i)/2, (j+k)/2, (i+c k)/q, k> in (-q,-p), q = 3 mod 4 prime with
        (p/q) = -1 and q | c^2 p + 1.
      citation: >-
        Pizer 1980; Kohel-Lauter-Petit-Tignol 2014 Lemma 2 -- recalled, not
        opened in this program
      provenance: recalled
      verified_by: null
      role: >-
        second construction arm; every formula is verified to be an order by
        the run itself, and a failed formula is a construction defect, not a
        falsification
  reduction_chain:
    core_problem: >-
      none (closure of a certificate family, not an algorithm)
    corollaries: []
  predictions:
    - metric: R = det(Gram of Nrd on O) * 16 / p^2 for every maximal order tested (arms A1, A2, A5)
      direction: different
      minimum_effect: FORCED VALUE exactly 1 (exact rational arithmetic).
    - metric: R = det(Gram of Nrd/p on P) * 16 / p^2 (arm A3)
      direction: different
      minimum_effect: FORCED VALUE exactly 1.
    - metric: R = det(Gram of Nrd/n(I) on I) * 16 / p^2 with n(I) MEASURED as gcd of norm-form values (arm A4)
      direction: different
      minimum_effect: "FORCED VALUE exactly 1; and [O : I] = n(I)^2 exactly."
    - metric: R_sub = det(L) * 16 / (m^2 p^2) for index-m sublattices (arm A6)
      direction: different
      minimum_effect: FORCED VALUE exactly 1.
  test_boundary:
    instances:
      - >-
        22 primes: tier S {2, 3, 5, 7, 11, 13, 17, 19, 23, 101, 103, 109, 113};
        tier M the two smallest primes > 2^63 in each class 3 mod 4, 5 mod 8,
        1 mod 8; tier L the smallest prime > 2^255 in each class.
      - >-
        Per prime: PARI maximal order, hand-written maximal order, two-sided
        ideal P, 20 left ideals of frozen norms, their 20 right orders, 22
        random full-rank sublattices; controls C-TRD, C-NOSCALE, C-NONMAX,
        C-NEAR, C-ALG, C-CROSS.
    parameters:
      form: degree form via Deuring, Nrd/n(I) on quaternion lattices
      rank: 4 (primary), 3 (nearby-object control only)
      dimension_g: 1
    implementation: >-
      PARI/GP 2.15.4 (alginit/algbasis/algnorm/algmul) plus an independent
      Python fractions/sympy exact determinant; see EXP-SSIQ-6916e8.
    budget:
      maximum_runs: 1
      maximum_memory_gb: 4
      note: advisory time/CPU per docs/research-budget-policy.md; expected seconds to minutes
  falsification_conditions:
    - >-
      Any maximal order that passes the order-validity and ramification checks
      (C-ALG) in arm A1 or A5 gives R != 1: the normalisation input (1) is
      wrong as stated and the closure is withdrawn pending localisation.
    - >-
      Any left ideal I passing its validity checks gives [O : I] != n(I)^2 or
      R != 1 in arm A4, or P gives R != 1 in arm A3: input (3) is wrong and
      the closure is withdrawn.
    - >-
      Any full-rank sublattice gives R_sub != 1 in arm A6: input (4) is wrong
      (practically impossible; would indicate an instrument error first).
    - >-
      Anyone exhibits a rank-4 lattice inside a single Hom(E, E') with the
      degree form and det <~ p: contradicts the lemma; the derivation must be
      found in error.
  interpretation_limits:
    - >-
      SCOPE. Rank-4 full-rank sublattices of a single Hom(E, E') under deg,
      dimension one. Rank <= 3 certificates (e.g. the rank-3 route to 1/3 and
      its density limits under H-WESO-9dc201), non-degree forms, and g >= 2
      (the genuine higher-dimensional N5) remain OPEN and are not touched.
    - >-
      WHAT THE COMPUTATION DOES NOT TEST. The Deuring isometry
      Hom(E, E') ~ (I, Nrd/n(I)) itself (proof obligation "interface") is a
      cited theorem; no curve or isogeny is constructed. The run tests the
      quaternion-side normalisation that the lemma's arithmetic rests on.
    - >-
      FINITE INSTANTIATION. Exact equality at every tested (p, O, I, L)
      corroborates the normalisation; the universal statement rests on the
      derivation note (derivation tier, docs/claims-and-verification.md),
      not on the finite sample. It is not "proved" until independently
      reviewed, and a theorem-level claim still routes to a proof assistant
      or human referee.
    - >-
      NO GOAL RECORD IS AMENDED by this hypothesis. Adopting "rank-4 branch
      empty in dimension one" into GOAL-SSIQ-001's lever map is a separate
      Coordinator decision after evidence review.
  scope_ceiling:
    claim_tier: crypto
    detail: >-
      Descriptive label: tier L primes are ~256-bit (SQIsign NIST-I scale).
      The claim is exact at every tested prime and carries no transfer
      assumption; the universal statement is a derivation, not an
      extrapolation from the sample.
  status: approved
  status_note: >-
    Created and advanced proposed -> specified -> approved by
    DEC-20260926-e05697 (pre-run approval paired with frozen contract
    EXP-SSIQ-6916e8 v1, standing user authorization in AGENTS.md). Approval
    asserts protocol readiness, not truth of the lemma.
  proposed_by: idea-generator
  specified_by: coordinator
  owner: coordinator
  created_at: '2026-09-26'
