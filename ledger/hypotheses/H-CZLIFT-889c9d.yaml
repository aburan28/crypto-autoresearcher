hypothesis:
  id: H-CZLIFT-889c9d
  question_id: RQ-CZLIFT-b9f765
  goal_id: GOAL-CZLIFT-1516d5
  added: '2026-10-09'
  proposed_by: user
  designed_by: coordinator
  approval_decision: DEC-20261009-a3797d
  title: >-
    On an anomalous CM curve, Smart's formal-logarithm attack is killed exactly
    by the Serre-Tate canonical lift of the curve, and on that lift every point
    lift gives lift-noise
  source_statement: >-
    User hypothesis H2, 2026-10-09 (verbatim fragment): "Smart's anomalous
    attack is the one lifting attack that works: in 0 -> E^(pZ_p) -> E(Q_p)
    -> E(F_p) -> 0, multiplication by p pushes everything into the formal
    group, where the p-adic log is a homomorphism. For trace t != 1, [#E]
    still kills the point but the residue in E^ depends on the chosen lift, so
    you get noise. Serre-Tate gives a canonical lift of the curve for ordinary
    E, but no canonical lift of points."
  statement: >-
    Let E/F_p be ordinary with #E(F_p) = p and End(E) the maximal order of a
    class-number-one field, so its Serre-Tate canonical lift E_can/Z_p is the
    explicit integral CM model. For a lift E^/Z_p of E and any point lift P^ of
    P in E(F_p), write z = -X/Y for the formal parameter of [p]P^. Then
    v_p(z([p]P^)) >= 2 if and only if v_p(j(E^) - j(E_can)) >= 2e, where e is
    the ramification index of the j-map at j(E_can) (e = 3 at j = 0, e = 1
    otherwise). Consequently Smart's precision-p^2 attack recovers d from
    (P, dP) for EVERY point lift when v_p(j(E^) - j_can) < 2e, and for NO
    point lift on the canonical lift (or on any lift with v_p(Delta j) >= 2e);
    on those degenerate lifts the next digit, z([p]Q^)/z([p]P^) read at
    precision p^3, equals d at the random rate 1/p.
  mechanism: >-
    By Serre-Tate the deformation space of E over W(F_p) is the formal torus
    with parameter q, q(E_can) = 1, and v_p(q - 1) = v_p(j(E^) - j_can)/e for
    a lift with j-distance of valuation below the ramification. The p-torsion
    of E^[p] is an extension of the etale Z/p (rational over Q_p since the
    unit root is 1 mod p on an anomalous curve) by mu_p, split exactly when q
    is a p-th power, i.e. when v_p(q - 1) >= 2. On a split lift every P has a
    p-torsion lift P~, so any lift P^ = P~ + T with T in E^(pZ_p) and
    [p]P^ = [p]T in E^(p^2 Z_p): the precision-p^2 residue is 0/0 for every
    point lift, and the next digit is z(T_Q)/z(T_P), a ratio of two
    lift-dependent units. On a non-split lift no p-torsion point exists, so
    [p]P^ has valuation exactly 1 and the usual Smart identity
    z([p]Q^) = d z([p]P^) mod p^2 holds for every pair of lifts.
  assumptions:
    - E/F_p ordinary, #E(F_p) = p, p >= 7, class-number-one CM so the canonical lift is an explicit integral model.
    - 'The formal logarithm agrees with z to first order: ratios of equal-valuation parameters are read on z, never on a truncated series.'
    - Point lifts are Hensel lifts with an arbitrary x-digit, the naive integer lift, or the Teichmuller x; all are sections, none is a homomorphism.
    - d = +-1 excluded (recovered by any negation-equivariant section by symmetry).
  proof_search_map:
    not_applicable_reason: >-
      Bounded empirical check of a derived statement at toy scale; the
      derivation (Serre-Tate splitting of E^[p] on lifts with v_p(q-1) >= 2)
      is standard and is stated in mechanism; the measurement decides whether
      the implemented instruments agree with it at every sampled lift.
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: Smart's anomalous-curve attack via the formal-group logarithm after multiplication by p.
      citation: 'N. P. Smart, The discrete logarithm problem on elliptic curves of trace one, J. Cryptology 12 (1999)'
      provenance: recalled
      verified_by: null
      role: the attack whose lift-dependence is measured
    - description: Serre-Tate theory of the canonical lift and the deformation parameter q of an ordinary elliptic curve.
      citation: 'N. Katz, Serre-Tate local moduli, LNM 868 (1981)'
      provenance: recalled
      verified_by: null
      role: the splitting criterion that predicts degeneracy
  reduction_chain:
    core_problem: whether the lift-noise of the non-anomalous Smart attack is a defect of the lift choice that a canonical lift removes
    corollaries: []
  predictions:
    - metric: rule_agreement (fraction of samples where [v_p(z([p]P^)) >= 2] equals [v_p(j(E^) - j_can) >= 2e])
      direction: different
      minimum_effect: 'exactly 1.0; a single disagreement falsifies the rule as stated'
    - metric: nondegenerate_success_rate (v_p = 1 samples; Smart ratio equals d)
      direction: different
      minimum_effect: 'exactly 1.0'
    - metric: degenerate_success_rate (v_p >= 2 samples; precision-p^3 ratio equals d) against the mean of 1/p over those samples
      direction: different
      minimum_effect: 'within 4 binomial standard errors of the 1/p reference; above it by more than 4 sigma is an unexplained structure'
  test_boundary:
    instances:
      - 'every class-number-one CM anomalous curve with 7 <= p <= 1500 (29 curves, D in {-3, -11, -19, -43, -67, -163})'
    parameters: {precision: 8, curve_lift_classes: [canonical, isomorphic, pert_p, pert_p2], point_sections: [hensel_random, naive, teichmuller]}
    implementation: experiments/EXP-CZLIFT-17b7eb/implementation/run.py over harness/czlift.py
    budget: {wall_clock_seconds_per_run: 600}
  falsification_conditions:
    - any sample where the degeneracy flag and the j-distance rule disagree
    - any v_p = 1 sample where the Smart ratio is not d
    - degenerate success rate above the 1/p reference by more than 4 standard errors on both seeds
  interpretation_limits:
    - Toy primes; nothing about a deployed curve.
    - The claim is about anomalous curves; its non-anomalous counterpart is H-CZLIFT-6d4ed1.
    - A non-split lift succeeding for every point lift is Smart's theorem, not a new attack.
  status: approved
  status_note: >-
    Pre-run approval paired to EXP-CZLIFT-17b7eb under DEC-20261009-a3797d.
    Approval asserts nothing about truth.
