hypothesis:
  id: H-NCP-4cc527
  question_id: RQ-NCP-001
  added: '2026-08-25'
  derived_from_idea: IDEA-20260807-0085af
  status: proposed
  proposed_by: coordinator

  statement: >-
    SCOPE. Ordinary elliptic curves over prime fields at p approximately 431 and
    p approximately 1009, the path groupoid of the isogeny quiver whose vertices
    are E together with its 2-isogenous and 3-isogenous neighbours inside one
    F_p-isogeny class, whose arrows are phi_2, phi_3, their duals, negation at
    each vertex, and a translation set T of size 2, 3 or 4 at each vertex, and
    words of degree at most 6. Claim tier toy. NO ATTACK, NO EXPONENT, NO
    CRYPTOGRAPHIC-SCALE STATEMENT.
    THE CLAIM. On this MULTI-VERTEX quiver the abelianization fraction of
    target-reaching word relations is strictly below 1.0 at at least one of the
    two primes and at least one arrow set, whereas EV-NCP-001 measured exactly
    1.0 on the one-vertex quiver whose arrow group is virtually abelian. The
    mechanism named for the difference is the semidirect relation
    phi o T_P = T_{phi(P)} o phi, which is non-trivial exactly when
    phi(P) is different from P, a condition checkable before any search runs.
    WHAT IS AND IS NOT AT STAKE. EV-NCP-001 is not disputed inside its own
    declared test boundary (quiver of translations and negation only, no isogeny
    arrows, word degree at most 6). What is at stake is whether
    DEC-20260804-139a86's program-wide reading of that negative extends to the
    arrow class KN-OPEN-008 and KN-TECH-014 were written for. A measured
    abelianization fraction of exactly 1.0 on the multi-vertex quiver at both
    primes is a REAL and useful outcome that makes the program-wide reading
    correct; this hypothesis then stands rejected on its own declared boundary.

  mechanism: >-
    In the one-vertex quiver every arrow lives over E and the arrow group
    generated by translations and negation is virtually abelian, so the
    evaluation of a word factors through the abelianization of the free group on
    the arrows and word order carries no information. Commutator collapse is
    therefore close to forced a priori and EV-NCP-001's 100 percent reproduction
    of NC-found relations by the commutative signed-subset-sum quotient across
    94,472 shadow replays is the expected value, not a discovery about elliptic
    curves.
    Adding vertex-changing isogeny arrows changes the algebra rather than the
    bookkeeping. Composability becomes a groupoid condition on vertices, so not
    every pair of arrows composes. More importantly the conjugation action of an
    isogeny arrow on the translation arrows is by a non-identity map on the point
    group whenever phi(P) is different from P, so the evaluation of a word
    depends on the ORDER in which translation and isogeny arrows appear. The
    commutator subgroup of the path groupoid is then not obviously trivial, and
    the abelianization diagnostic already implemented in EXP-NCP-001
    (ncp1_quiver_gb.sage plus its shadow-replay control) can return a value
    other than 1.0 for the first time.
    The projection under test is word in the path groupoid mapped to the pair
    (endpoint vertex, evaluated point). In the one-vertex case that projection is
    effectively lossless for the relevant purpose; in the multi-vertex case it
    discards something the target's operations do not let you recover, unless the
    conjugation action merely permutes translations within the same commutative
    image, which is the modal way this hypothesis fails.

  assumptions:
  - >-
    Small-degree isogenies between toy prime-field curves at p from about 431
    upward are computable within the declared budget. A failure here is
    infrastructure, never a negative result.
  - >-
    The noncommutative Groebner engine in ncp1_quiver_gb.sage accepts a quiver
    with more than one vertex, or can be extended to. If it cannot, that is an
    instrumentation cost recorded as such.
  - >-
    l-isogenies are taken within one F_p-isogeny class so the point-group orders
    match across vertices and translation transport is well defined.

  proof_search_map:
    not_applicable_reason: >-
      Purely empirical structure probe. No theorem, asymptotic bound, reduction
      or closure argument is proposed, and no cost claim of any kind is made, so
      the section 8 audits of KN-TECH-080 have no object to bind. If a
      non-abelianizable target-reaching relation is found and anyone proposes to
      convert it into a search procedure, THAT proposal is proof-oriented and
      requires its own map before approval.
    bottleneck: null
    baseline_embedding:
      parameter_slice: null
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms: []
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations: []

  asymptotic_claim: null

  heuristic_assumptions:
  - id: HEUR-NCPQ-1
    formal_statement: >-
      For the isogeny quiver at these parameters, the abelianization behaviour of
      target-reaching relations at word degree at most 6 is directionally
      representative of the behaviour at larger word degree, in the sense that a
      fraction of exactly 1.0 at degrees 4, 5 and 6 makes a fraction below 1.0 at
      degree 7 or more unlikely.
    random_model_justification: >-
      None offered. This is an extrapolation of convenience, and it is the same
      one EV-NCP-001 relied on for its committed negative, which is why it is
      written down here rather than left implicit.
    supporting_results: []
    validation_experiment_ids:
    - EXP-NCP-01d366
    falsification_condition: >-
      The abelianization fraction is 1.0 at degree 4 and 5 but below 1.0 at
      degree 6. The trend is then not monotone and no degree-bounded null may be
      read as evidence about longer words.

  structural_ingredients:
  - description: >-
      Path algebras and noncommutative Groebner bases over a quiver, used to
      enumerate target-reaching word relations and compute commutative images.
    citation: KN-TECH-014
    provenance: internal
    verified_by: >-
      In-repo technique entry, read directly. Cited by no ledger or experiment
      record before this one.
    role: diagnostic machinery
  - description: >-
      The semidirect relation between an isogeny and a translation,
      phi o T_P = T_{phi(P)} o phi, which is the relation an abelianization
      argument must survive on a multi-vertex quiver.
    citation: null
    provenance: internal
    verified_by: >-
      Elementary and re-derivable from the definition of an isogeny as a group
      homomorphism; it is a declared proof obligation for the executor to check
      symbolically at the tested parameters, not an appeal to authority.
    role: the mechanism's load-bearing identity

  reduction_chain:
    core_problem: null
    corollaries: []

  predictions:
  - metric: >-
      abelianization fraction of target-reaching word relations on the
      multi-vertex quiver
    direction: lower
    minimum_effect: >-
      Any value strictly below 1.0 that survives the random-isomorphism null.
      EV-NCP-001 measured exactly 1.0 on the one-vertex quiver.
  - metric: >-
      reachability fraction under word-order constraints versus the commutative
      quotient
    direction: different
    minimum_effect: >-
      EV-NCP-001 found strict PRUNING, 350 of 439 against 437 of 439. A
      multi-vertex quiver that instead EXTENDS reachability reverses the sign of
      the committed observation and is a distinct outcome from mere pruning.

  test_boundary:
    instances:
    - >-
      Ordinary elliptic curves over F_p with p approximately 431 and p
      approximately 1009, together with their 2-isogenous and 3-isogenous
      neighbours inside the same F_p-isogeny class.
    parameters:
      primes: '431 and 1009 (exact values fixed by the executor at Stage 0 and recorded)'
      arrows: 'phi_2, phi_3, their duals, negation per vertex, translations T with |T| in {2,3,4} per vertex'
      word_degree_bound: 'swept over 4, 5, 6; 6 is EV-NCP-001 own bound'
      vertices: 'E plus its 2-isogenous and 3-isogenous neighbours in one isogeny class'
    implementation: >-
      The abelianization diagnostic already implemented in EXP-NCP-001
      (ncp1_quiver_gb.sage) plus its shadow-replay control, extended to accept a
      quiver with more than one vertex.
    budget:
      wall_clock_seconds_per_run: 1800
      total_cpu_hours: 2.0
      maximum_memory_gb: 8

  distinguishable_outcomes:
  - outcome: >-
      Abelianization fraction strictly below 1.0 at at least one prime and one
      arrow set, the random-isomorphism null stays at 1.0, and the one-vertex
      regression reproduces EV-NCP-001 zero violations.
    means: >-
      The first target-reaching relation in this corpus with a non-commutative
      image. It is NOT an attack and NOT a cost improvement; it is exactly the
      condition KN-OPEN-008 names for the path-algebra route to remain open, and
      it shows DEC-20260804-139a86's program-wide closure of NCP over-reached the
      evidence it cited.
  - outcome: >-
      Abelianization fraction exactly 1.0 on the multi-vertex quiver at both
      primes and both arrow sets, with all three controls behaving.
    means: >-
      The commutative collapse extends to the arrow class that was supposed to
      break it. This hypothesis is wrong, the program-wide reading of EV-NCP-001
      is vindicated on a broader object, and KN-OPEN-008 can be closed properly
      at word degree at most 6 rather than by fatigue. This is a first-class
      deliverable, not a null result.
  - outcome: >-
      The random-isomorphism null shows the same non-abelianization rate as the
      genuine isogeny arrows.
    means: >-
      Any measured effect is groupoid bookkeeping about vertex-changing arrows in
      general and carries nothing about elliptic curves. No reading of the signal
      arm is admissible; the deliverable is a corrected understanding of the
      diagnostic.
  - outcome: >-
      phi(P) equals P for the entire translation set at the chosen parameters, or
      the one-vertex regression fails to reproduce EV-NCP-001 zero violations.
    means: >-
      In the first case the quiver is one-vertex in disguise and the design is
      void at those parameters, requiring re-parameterisation rather than
      interpretation. In the second the harness is not measuring the committed
      object either and nothing is reportable. Both are instrument findings, not
      evidence about the mathematics.

  falsification_conditions:
  - >-
    Abelianization fraction is exactly 1.0 on the multi-vertex quiver at both
    primes and both arrow sets, with the forced-value gate and the one-vertex
    regression both passing.
  - >-
    The random-isomorphism null shows the same non-abelianization rate as the
    genuine isogeny arrows.
  - >-
    phi(P) equals P for the whole translation set by construction at these
    parameters, in which case the quiver is one-vertex in disguise and the
    design is void.

  prior_evidence_refs:
  - EV-NCP-001
  - EXP-NCP-001
  - H-NCP-001
  - DEC-20260718-009
  - DEC-20260804-139a86
  - KN-OPEN-008
  - KN-TECH-014

  interpretation_limits:
  - >-
    Toy scale only, p at most 2^12. Nothing here is a cryptographic-scale claim.
  - >-
    A non-abelianizable relation is not an attack and not a cost improvement. Its
    only content is that the path-algebra route is not closed by the evidence
    currently cited for closing it.
  - >-
    A null result is scoped to word degree at most 6, to these two primes, to
    2-isogeny and 3-isogeny arrows, and to translation sets of size at most 4.
    It says nothing about longer words or larger degree arrows.
  - >-
    This hypothesis does not dispute EV-NCP-001 within that record's declared
    test boundary.
