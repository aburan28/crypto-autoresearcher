  title: >-
    At p = 8 the correct threshold is 16 and the draft threshold is 4.
  statement: >-
    Eight to the fourth is 4096. Sixteen cubed is 4096, so the gap at
    the correct threshold is 0. Eight cubed is 512, and 4096 exceeds
    it by 3584. Four cubed is 64, and 4096 exceeds it by 4032. The
    ratio of 16 to 4 is 4. Four times 3 equals 12 times 1, so four
    thirds times one fourth equals one third. The value 8 lies strictly
    between 4 and 16.
  mechanism: >-
    The proposal corrects a discriminant threshold from p to the power
    2/3 to p to the power 4/3. This contract checks that correction at
    p = 8. It does not compute an endomorphism ring.
