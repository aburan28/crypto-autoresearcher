    "source_heuristic_assumptions": [
      {
        "id": "H1",
        "statement": "(Witness equidistribution in the Minkowski box.) For uniformly random k, the number of nonzero witnesses of W_r in the box [-X, X]^{2r} is Poisson with mean (2X+1)^{2r}/N, so at X = N^{1/(2r)} the box contains Theta_r(1) witnesses and the balanced MITM succeeds with constant probability in one pass.",
        "rigorous_support": "Minkowski's convex body theorem gives the RIGOROUS existence of a nonzero witness with ||v||_infty <= det^{1/(2r)} = N^{1/(2r)}, so success in the box is guaranteed, not probabilistic; the heuristic content is only the COUNT, which controls how much the box must be inflated in practice. The classical distribution statement imitated is Siegel's mean value theorem for random lattices: the expected number of nonzero lattice points in a measurable set S of volume V, for a random lattice of covolume D, is V/D.",
        "validation_plan": "Sampled quantity: the witness count in boxes of side c N^{1/(2r)} for c in {0.5, 1, 2, 4}, per instance per r. Shortcut making sampling feasible: at toy N the scalar k is CHOSEN by the experimenter, so no discrete logarithm is solved and the entire witness set of a box can be enumerated directly; at 16-20 bits the whole scalar range can be swept exhaustively, giving a complete census rather than a sample. Comparison distribution: the empirical count histogram against Poisson with mean (2X+1)^{2r}/N, tested by chi-square. Tail consistency check: the fraction of instances with ZERO witnesses in the c = 1 box, which Minkowski forces to be exactly 0 - a single nonzero observation is an implementation error, and this is the cheapest self-check in the record. LABEL: EXHAUSTIVE at 16-20 bits, TOY-SCALE SAMPLED at 24-32 bits."
      },
      {
        "id": "H2",
        "statement": "(Eigenvalue genericity.) The scalars lambda_1 = 1, lambda_2, ..., lambda_r are, apart from the algebraic relations forced by the endomorphism ring (for example lambda^2 + lambda + 1 = 0 mod N at j = 0), distributed like independent uniform elements of Z/N, so the single congruence sum_i lambda_i (a_i + k b_i) = 0 is non-degenerate and the index is N rather than a proper divisor.",
        "rigorous_support": "Non-degeneracy is RIGOROUS given lambda_1 = 1: the coefficient vector of the congruence contains a unit, so the map Z^{2r} -> Z/N is surjective and the index is exactly N unconditionally. H2 is therefore NOT load-bearing for P1; it is used only to predict that the shortest vector attains the Minkowski bound rather than being forced short by an accidental relation among the lambda_i. The classical statement imitated is the equidistribution of roots of a fixed quadratic modulo varying primes.",
        "validation_plan": "Sampled quantity: the multiset {lambda_i mod N} over many curves, and the observed lambda_1^infty against the Minkowski bound. Shortcut: the lambda_i are roots of a known quadratic modulo N, computable directly; no curve arithmetic beyond one verification multiplication is needed. Comparison distribution: the empirical distribution of lambda_2/N on [0,1) against uniform, by Kolmogorov-Smirnov, over at least 500 curves. Tail check: the smallest observed ratio lambda_1^infty / N^{1/(2r)}; a systematically small ratio would indicate accidental relations among the lambda_i and would mean r is effectively lower than nominal. LABEL: TOY-SCALE."
      }
