    "statement": "Test all source index, ordinary-minimum, useful-witness cost, automorphism-rho and memory predictions across the complete 16/20/24/28/32-bit ladder, without secret-dependent lattice information entering the attack.",
    "mechanism": "The intuition that more structure should help is strong and is exactly what H-STR-002 encoded before DEC-20260727-009 weakened it to the known automorphism-quotient constant r = 3. This control replaces the intuition with a measurement of the one quantity that decides it. Because G has prime order N, every group homomorphism G -> G is multiplication by a scalar. Therefore the r endomorphisms contribute exactly ONE linear congruence over 2r unknowns: sum_i lambda_i (a_i + k b_i) = 0 mod N. A single congruence modulo N in Z^{2r} cuts out a sublattice of index N, whatever r is. Minkowski then bounds the shortest vector by det^{1/(2r)} = N^{1/(2r)}, which is a genuine and dramatic shrinkage: at r = 4 the shortest witness has entries of size only N^{1/8}. But the box of side N^{1/(2r)} in dimension 2r contains (2N^{1/(2r)}+1)^{2r} = Theta_r(N) integer points, independent of r, and the witness density inside it is 1/N. A balanced split of the 2r coordinates into two halves of r gives two lists of Theta(2^r sqrt(N)) group elements joined by a collision - the birthday exponent, with a constant that doubles per added endomorphism. So the three properties pull apart cleanly, and measuring all three at once is what makes this a discriminator rather than a demonstration. Shrinkage without cost reduction is the signature of the determinant being pinned; shrinkage WITH cost reduction would mean the determinant is not pinned or the enumeration is not the bottleneck, either of which would be a genuine structural finding. Three explanations of the endomorphism lane are separated: (a) P1, P2 and P3 all hold: endomorphism augmentation is exponent-neutral and constant-inflating, the intuition is refuted quantitatively, and the program should stop spending compute on endomorphism-rich factor bases and displacement structure. This also supplies the lattice-geometric reading of DEC-20260726-007's endomorphism-oracle verdict (simulable at C = 0) and of DEC-20260727-009's measured r = 3 constant. (b) P1 holds but P3 fails - cost falls with r: the meet-in-the-middle is not the best decomposition of the augmented search, and some enumeration exploits the low-dimensional shadow of a short vector. This would be the first non-generic signal from the endomorphism lane and would require independent review before interpretation. (c) P1 fails - some instance has index below N: an efficiently computable non-scalar self-map exists, contradicting an elementary theorem. This is far more likely an implementation error than a discovery and must be replicated independently before being reported as anything.",
