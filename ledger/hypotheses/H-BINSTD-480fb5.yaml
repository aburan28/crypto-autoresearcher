# =============================================================================
# H-BINSTD-480fb5 -- Sparse GF(2) fill-in band vs relation surplus on toy
# |FB|. Specified from IDEA-20261002-7def74 under RQ-BINSTD-b6f698 /
# GOAL-ECDLP2M-001. Approved DEC-20261003-40fe41. ZERO RUNS in this design
# packet. No AUXIN. No Bedrock. No curve attack / exponent claim.
# =============================================================================
hypothesis:
  id: H-BINSTD-480fb5
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261002-7def74
  experiment_id: EXP-BINSTD-7cfb11
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-03'
  approved_at: '2026-10-03'
  authorised_by: DEC-20261003-40fe41
  status: approved
  status_history:
    - from: proposed
      to: specified
      at: '2026-10-03'
      by: DEC-20261003-40fe41
    - from: specified
      to: approved
      at: '2026-10-03'
      by: DEC-20261003-40fe41
  proposed_by: coordinator

  title: >-
    On toy n=17 GF(2) relation-like matrices with frozen |FB|=24 and weight 4,
    sparse Gauss–Jordan fill-in ratio F stays ≤ β=16 at surplus
    s∈{1.0,1.25,1.5,2.0}

  statement: >-
    CLAIM (heuristic_validation / post-collection LA instrument; NO ATTACK;
    NO EXPONENT). For the frozen toy cell n=17 with frozen factor-base
    cardinality |FB|=24, row weight w=4, surplus schedule
    s∈{1.0,1.25,1.5,2.0}, and sparse-LA pin = GF(2) Gauss–Jordan
    (left-to-right first unused pivot; XOR-clear that column from every
    other row), the fill-in ratio F := nnz_after / nnz_initial on
    relation-like matrices satisfies F ≤ β with β frozen at 16 — OR the
    band breaks and is recorded as LA-fill-in-superlinear-in-surplus at
    this scale. Dual independent meters (row-sets vs bitmasks) must agree
    on (nnz_initial, nnz_after, rank, F). A matched Erdős–Rényi null with
    p=w/|FB| is the nearby-object control. NO break. NO n≥131 transfer.
    Distinct from IDEA-20261002-79a077 (solver race) and from KR-IC-b0fcda
    (n² LA-speedup claim).

  mechanism: >-
    OBJECT FRAME as IDEA-20261002-7def74. Representation: sparse GF(2)
    matrices of size ceil(s·|FB|) × |FB| with frozen relation-like
    sparsity (exactly w ones per row), standing in for IC relation
    matrices without a Magma/Sage collector. Operation: one shared
    Gauss–Jordan pin. Observable: F at each surplus. Dual routes:
    route_sets.py (symmetric difference) and route_bits.py (XOR/popcount)
    must not import each other. Null: Erdős–Rényi same shape and expected
    density. WHAT IS NEW vs the idea's IMP-if-collector-absent trap: the
    LA meter is implemented in pure Python so the trial is arithmetic,
    not a missing-launcher detector.

  assumptions:
    - Frozen |FB|, surplus, β=16, seeds, w=4, and sparse-LA pin before Stage 1.
    - Synthetic relation-like rows model IC sparsity; they are not sampled
      from a Koblitz point collector.
    - F ≤ β ≠ practical binary IC (KR-IC-1fcdbc).
    - Dual disagreement is O-ARTIFACT, never a band verdict.

  predictions:
    - metric: fill_in_ratio_F
      direction: upper_bounded
      minimum_effect: '≤ 16 at each completed n=17 surplus on relation-like matrices'
    - metric: surplus_levels_completed
      direction: lower_bounded
      minimum_effect: '≥ 3 of 4 surplus levels completed, else O-INCONCLUSIVE'
    - metric: dual_route_agreement
      direction: same
      minimum_effect: 'sets and bits agree on nnz_initial, nnz_after, rank, F'
    - metric: null_ER_matrix_fill_in_independence
      direction: different
      minimum_effect: 'ER-null F is recorded independently of the relation-like pattern'

  test_boundary:
    instances:
      - 'Stage 0: freeze pins + dual probe (8x8 identity F=1; 6x8 w=3 fixture)'
      - 'Stage 1 authorized: n=17, |FB|=24, s∈{1.0,1.25,1.5,2.0}, relation-like + ER null'
    parameters:
      n_stage1: 17
      fb_size:
        17: 24
        23: 32
        31: 40
      row_weight: 4
      surplus: [1.0, 1.25, 1.5, 2.0]
      beta: 16.0
      relation_seed: 2026100301
      er_seed: 2026100302
      probe_seed: 2026100303
      min_surplus_completed: 3
    implementation: >-
      Pure Python under experiments/EXP-BINSTD-7cfb11/implementation/;
      command surface implementation/run.py driven by trial-plan-v1.json.
      Dual meters in route_sets.py and route_bits.py. No Magma/Sage/AUXIN/Bedrock.
    budget:
      wall_clock_seconds: 3600
      memory_gb: 1
      maximum_runs: 4

  falsification_conditions:
    - F > 16 at any completed n=17 surplus with dual agreement (O-FAIL-BAND).
    - Dual meters disagree (O-ARTIFACT).
    - Editing β after Stage-0 freeze.
    - Claiming practical binary IC or an exponent move from a toy fill-in band.
    - Transferring the band to n≥131 without a new contract.
    - Equating this meter with Frobenius-closed yield (0fcbe2) or BW vs GE (79a077).

  distinguishable_outcomes:
    - id: O-SUPPORT
      meaning: >-
        Dual OK; ≥3 surplus levels completed; F ≤ 16 on every completed
        n=17 relation-like cell. Band holds at this scale. No attack claim.
    - id: O-FAIL-BAND
      meaning: >-
        Dual OK; ≥3 surplus completed; F > 16 on at least one completed
        cell. LA-fill-in-superlinear-in-surplus at this scale.
    - id: O-INCONCLUSIVE
      meaning: Fewer than 3 surplus levels completed; band not read.
    - id: O-ARTIFACT
      meaning: Dual disagreement, mutated β, or freeze/regression failure.
    - id: O-IMPEDIMENT
      meaning: >-
        Infrastructure timeout/crash/missing Stage-0 freeze. Never
        negative evidence against H-BINSTD-480fb5.
    - id: O-STAGE0-OK
      meaning: Stage-0 freeze and dual probe passed.

  interpretation_limits:
    - Fill-in ratio only; does not predict collector cost or beat rho.
    - Synthetic relation-like sparsity, not a live Koblitz relation harvest.
    - Shared Gauss–Jordan pin; a different elim order needs a new contract.
    - Stage-2 n∈{23,31} not authorized under this card.
    - No attack at field degree ≥ 131. ECC2K-130 is not an instance.

  heuristic_assumptions:
    - id: HEUR-BINSTD-7def74-H1
      formal_statement: >-
        FORALL admitted Stage-1 cells n=17 with frozen (|FB|=24, β=16, w=4):
        for each surplus s∈{1.0,1.25,1.5,2.0}, F := nnz_after_elim /
        nnz_initial ≤ 16 on relation-like matrices under the frozen pin.
      random_model_justification: >-
        Rigorous: sparse elimination fill-in is governed by the sparsity
        pattern and pivot order; classical random sparse-matrix models
        predict bounded fill-in (or net cancellation) below a density
        threshold. If toy relation-like matrices behave like that model at
        the frozen surpluses, F should stay ≤ 16; if dependencies create
        dense blocks as surplus grows, the band breaks. The β band is the
        pre-registered transfer hypothesis at toys — not a claim that IC
        LA beats rho.
      supporting_results:
        - KR-IC-b0fcda
        - KR-IC-ae532f
        - KR-IC-1fcdbc
        - IDEA-20261002-7def74
      validation_experiment_ids:
        - EXP-BINSTD-7cfb11
      falsification_condition: >-
        F > 16 at any completed surplus level (O-FAIL-BAND), OR dual
        disagreement (O-ARTIFACT), OR fewer than 3 surplus levels
        completed (O-INCONCLUSIVE).

  asymptotic_claim: null

  proof_search_map:
    bottleneck: >-
      Whether sparse GF(2) Gauss–Jordan nnz after elim stays inside a
      frozen β=16 band as relation surplus grows on a fixed |FB|.
    baseline_embedding:
      parameter_slice: >-
        8×8 identity: F must equal 1 under both routes (net-zero fill-in
        on a permutation matrix).
      reproduction_check: >-
        Independent check.py recomputes identity F=1 and the n=17
        surplus-1.0 relation-like cell on both routes; refuses mutated β.
    observation_collision:
      observable: F = nnz_after / nnz_initial under the frozen pin
      distinct_preimage_search: >-
        Dual routes (sets vs bits) are distinct preimages of the same F;
        disagreement collides the observation and voids the band.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Two GF(2) row representations of one sparse matrix; one
          Gauss–Jordan pin.
        predicted_gain: >-
          A decidable O-SUPPORT/O-FAIL-BAND (or honest O-INCONCLUSIVE)
          without Magma/Sage collectors.
    quantifier_order: >-
      FORALL completed n=17 surplus cells: dual agreement THEN F ≤ 16
      predicted. NOT CLAIMED: n∈{23,31} under this card; n≥131; any attack.
    method_ceiling:
      strongest_certifiable_claim: >-
        On named Stage-1 toys under the frozen pin, either F stays ≤ 16
        or the band fails, with twins. Not an n² LA speedup (KR-IC-b0fcda).
      nearby_object_control: >-
        Erdős–Rényi matrices of the same shape and p=w/|FB|; F_ER is
        recorded independently. Dual disagreement is the artifact control.
    proof_obligations:
      - claim: Dual routes agree on nnz_initial, nnz_after, rank, F.
        responsibility: baseline
      - claim: 8×8 identity has F=1.
        responsibility: correctness
      - claim: β=16 is frozen before Stage 1 and not edited.
        responsibility: interface
      - claim: Band verdict requires ≥3 completed surplus levels.
        responsibility: success_probability
      - claim: Nothing asserted at n≥131.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  structural_ingredients:
