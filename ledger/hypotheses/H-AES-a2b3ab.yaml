    ~25s pair (EV-AES-005 / EV-AES-d33b1c OBS-B2-1) within run-to-run
    variance; (iii) any zero crossing h* lies BELOW the measurable window —
    D(h) < 0 for every h in {12,...,15}, and h <= 11 is recorded OUT OF
    ENVELOPE / DEFERRED_UNBOUNDED rather than estimated. The deliverable is
    the measured monotone curve through the committed anecdote PLUS the named
    bounded unmeasurable region, never an extrapolated crossing.

