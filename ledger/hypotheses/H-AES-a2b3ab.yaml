  statement: >-
    SCOPE: the r=6 hinted partial-sums construction (sq_null.c attack6n) and
    a matched brute-force-over-residual baseline, AES-128, toy/medium tier.
    NO ATTACK CLAIM, NO STATUS CHANGE to the existing DOMINATED verdict.
