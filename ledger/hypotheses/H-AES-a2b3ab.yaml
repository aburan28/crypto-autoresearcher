    Full derivation: ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/A3.md lines
    328-390. D(h) is monotone for a structural reason: increasing h shrinks
    the residual, helping brute force at 2^-8 per byte, while helping the
    structured arm at most linearly in the filtering it removes — a shape
    prediction with a mechanism, not a curve fit.

