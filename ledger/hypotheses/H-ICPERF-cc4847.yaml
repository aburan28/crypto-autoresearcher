hypothesis:
  id: H-ICPERF-cc4847
  question_id: RQ-ICPERF-94c86e
  question_ids:
    - RQ-ICPERF-94c86e
    - RQ-SATIC-1ae57a
  goal_id: GOAL-ICPERF-e6b6a4
  proposal_id: null
  proposal_note: >-
    No IDEA record: this hypothesis is the measurement design the user asked for
    directly (2026-09-13) and the pointer to the benchmark set came from the user.
    It proposes no new mechanism; it pins the first row of the boundary table to a
    set of pre-registered, falsifiable numbers so the row is a test and not a log.
  title: >-
    On Trimoska's S_4 Weil-descent PDP instances at l <= 6, the in-repo measurement
    reproduces the direction and rough magnitude of the reported SAT-over-Groebner
    gap, every shipped certificate verifies, and the gap is carried by the core-
    variable branching order rather than by XOR Gaussian elimination
  statement: >-
    For the 60 shipped instances of SRC-ICPERF-TRIMOSKA-ECICB-2024 (cells (15,5),
    (17,6), (19,6); 10 S + 10 U each), run on this host with WDSat rebuilt from
    SRC-ICPERF-TRIMOSKA-WDSAT-2024, the installed generic engines (Macaulay2 1.22 F4
    over ZZ/2 with field equations; Singular 4.3.2 std; CryptoMiniSat 5.11 on
    CNF-XOR; CaDiCaL 1.7 and MiniSat 2.2 on pure CNF), and a matched random Boolean
    null object per instance:
    (P1) all 30 S certificates verify on the curve with independent arithmetic and
    every SAT answer any engine returns is a valid decomposition;
    (P2) per cell, the median WDSat wall time is at least 10x below the median wall
    time of every Groebner engine that finishes, on S and on U separately;
    (P3) the branching order carries the gap: (a) the explicit core order
    (-g 1..ml) reproduces the default's conflict count EXACTLY on every instance
    (it is a prefix of the default order, so this is an identity check on the -g
    wiring, not a finding); (b) the non-core-first order (-g listing the N-ml
    e-variables before the ml core variables, a full permutation so the search
    stays complete), run on the first 5 S and 5 U instances of each cell under a
    120 s timeout, has a median wall time at least 2x the default's on the same
    instances on every (cell, label), with a timeout row counted at its timeout
    (a right-censored lower bound, so censoring can only understate the ratio);
    and (c) giving CryptoMiniSat only the pure-CNF encoding costs it at least 10x
    the median wall time of WDSat on the ANF at l = 6;
    (P4) enabling WDSat's Gaussian elimination (-x) does not reduce median wall time
    by more than 10% on any (cell, label) whose default median exceeds 0.05 s (the
    reported C3 direction); a (cell, label) under that floor is reported as
    unresolvable by wall clock and asserts nothing;
    (P5) for the SAT solvers the median U cost exceeds the median S cost by at least
    2x in conflicts on every cell, while for the Groebner engines the S/U median
    CPU ratio lies within [0.5, 2];
    (P6) on the matched random null objects WDSat's median conflicts are at least
    10x its median on the structured U instances of the same cell, i.e. the
    solver's speed is a property of the descended structure, not of the size.
  mechanism: >-
    Proposition 1 of KN-LIT-102cdb: assigning the ml core variables x_{i,j} determines
    every e-variable by unit propagation through the linking equations
    e_k = sigma_k(x), so a DPLL search that branches only on the core has a search
    space of 2^{ml} and never pays for the (n choose 2)-sized e-layer; the S_4
    descent's XOR structure makes propagation cheap. A Groebner engine pays for the
    e-layer in the Macaulay matrix regardless of order, and with field equations
    appended over ZZ/2 pays again for the quadratic field relations. Gaussian
    elimination on the XOR store re-derives what propagation already gives and adds
    row work per node (C3). Random systems of the same shape have no such core, so
    branching on the first ml variables propagates nothing.
  assumptions:
    - >-
      The installed generic engines are stand-ins for Magma F4 / PolyBoRi, which are
      absent; P2 is about the gap to THESE engines and asserts nothing about Magma.
    - The shipped U label is not a certificate; U instances are treated as solver reports until a Groebner engine returns the unit ideal.
    - >-
      WDSat's performance depends on the compile-time __MAX_ID__ being exact; every
      cell is run on a build sized to the value the solver itself reports.
    - Wall time and conflicts are taken with the machine otherwise quiet; a run whose recorded load average exceeds the pinned core count is flagged, not discarded.
  proof_search_map:
    applicability: >-
      Measurement hypothesis, not a proof-oriented proposal; the four audits are
      recorded as they apply.
    bottleneck: >-
      The PDP step's solve cost per instance, in conflicts (SAT) and CPU seconds
      (Groebner), on the authors' own instances.
    baseline_embedding:
      exact_baseline: >-
        Table 4 / Table 2 of SRC-SATIC-TRIMOSKA-2019 report WDSat 0.601 s at l=6,n=17
        (S) and CryptoMiniSat 133.98 s -> 15.67 s with the core order; those are
        REPORTED numbers and are not the baseline here. The in-repo baseline is the
        default-order WDSat run on each instance, against which every variant and
        every engine is a ratio on the same machine.
      reproduction_status: not_attempted_and_not_claimed
    observation_collision:
      what: >-
        Whether a smaller ratio than reported could be the ENCODING rather than the
        solver: the pure-CNF file expands each XOR by XORtoCNF.sh and may simply be
        larger. Controlled by running CryptoMiniSat on both the CNF-XOR and the pure
        CNF forms of the same instance.
    quantifier_order: >-
      For every shipped instance (60), for every engine that finishes within budget:
      the ratios in P2-P6 are per-cell medians over the 10 S or 10 U instances.
      Nothing is claimed for any instance, cell, engine or l outside the 60.
    method_ceiling:
      ceiling: >-
        l <= 6 and n <= 19 are all the generator ships; nothing about the reported
        200 GB wall at l = 8 (C5) is reachable from this batch.
      nearby_object_control: >-
        The matched random Boolean system of identical shape (same variable count,
        same equation count, same per-equation monomial-count and degree profile,
        coefficients drawn uniformly) is the null object; P6 is its prediction.
  predictions:
    - P1 through P6 as stated, each checkable from the run's raw table by a
      reviewer with no access to the producer's summary.
    - >-
      Direction of the reported effect reproduces (P2); magnitude is NOT predicted
      beyond the 10x floor because the Groebner engines differ from the authors'.
  test_boundary:
    instances:
      - the 60 shipped instances, unchanged, identified by INFO-file parameters
      - 60 matched random null objects generated from a recorded seed
    scale: toy (n <= 19, l <= 6); every instance solved to completion or recorded as budget-stopped
    excluded: any n or l not shipped; any engine not installed; Magma F4 and PolyBoRi; every reported timing
  falsification_conditions:
    - P1 fails on any instance: a shipped certificate does not verify, or any engine returns an assignment that is not a decomposition. This invalidates the instance set as an instrument until explained.
    - P2 fails on any cell where a Groebner engine finishes: the median WDSat/Groebner wall ratio is above 0.1.
    - P3 fails: (a) the explicit core order differs from default in conflicts on any instance (then -g is not doing what the README says and every -g row is suspect); (b) the non-core-first order's censored median wall time is NOT at least 2x the default's on some (cell, label) (then the order is not what carries the gap and the mechanism paragraph is wrong); or (c) CryptoMiniSat on pure CNF is within 10x of WDSat at l = 6.
    - P4 fails: -x reduces median wall time by more than 10% on some (cell, label) whose default median exceeds 0.05 s (the reported C3 direction does not hold here).
    - P5 fails on any cell.
    - P6 fails: random null objects are NOT harder for WDSat by 10x in median conflicts, which would mean structure is not what the solver exploits and the SAT-side numbers say nothing about the PDP.
  interpretation_limits:
    - A confirmed P2 is a statement about six named engine builds on one host on 60 instances; it is not a statement about Magma F4, about l > 6, or about the end-to-end attack, whose other phases are unmeasured here.
    - A failed P2 would weaken the transferability of C6 of SRC-SATIC-TRIMOSKA-2019 to generic engines, not contradict the authors' Magma measurement, which is not reproduced.
    - No rho comparison exists in this batch; nothing here bears on RQ-ICPERF-94c86e's decision target beyond one column of one row.
    - Budget stops (timeouts, memory aborts) are infrastructure outcomes and are excluded from medians with the count of exclusions reported per cell.
