hypothesis:
  id: H-ECDLP-0e7bf2
  question_id: RQ-ECDLP-912694
  statement: >-
    For an ordinary elliptic curve E/F_p with an F_p-rational CM
    automorphism of order 3 (j=0) or 4 (j=1728), every F_p-rational cyclic
    odd-prime-degree quotient of degree ell whose Frobenius action on E[ell]
    has distinct eigenvalues and whose CM discriminant is unramified at ell
    remains on the same special-j locus and retains the corresponding
    rational automorphism. A rational quotient that leaves the locus is
    therefore expected only in the explicitly exceptional boundary (ramified
    ell or repeated Frobenius eigenvalue), or when the source automorphism is
    not F_p-rational.
  mechanism: >-
    Frobenius and the F_p-rational CM automorphism commute. Away from CM
    ramification and repeated Frobenius eigenvalues, a rational cyclic kernel
    is a Frobenius eigenline in E[ell]. The CM action is simultaneously
    diagonalizable exactly on the split CM component, so that line is stable
    under the automorphism and the automorphism descends to the quotient. In
    the inert or repeated-eigenvalue boundary this simultaneous-line argument
    does not apply; those cells are retained as explicit nearby-object controls.
  assumptions:
    - E is ordinary and p > 3.
    - The automorphism is defined over F_p (p congruent to 1 mod 3 for j=0, or p congruent to 1 mod 4 for j=1728).
    - ell is an odd prime distinct from p and the quotient is formed from an exact F_p-rational kernel.
    - The finite audit uses exact affine arithmetic and does not infer crypto-scale behavior.
  proof_search_map:
    bottleneck: >-
      Establish whether a public rational isogeny can change the availability
      of the low-degree CM automorphism that supplies the endomorphism lane.
    baseline_embedding:
      parameter_slice: >-
        Reproduce the existing special-j maps and the independent Velu target
        construction on the same short-Weierstrass arithmetic; compare target
        orders and j-invariants against direct enumeration.
      reproduction_check: >-
        Frozen regression cells include j=0 and j=1728 twists, exact kernel
        subgroup enumeration, and map-on-curve checks; a mismatch invalidates
        the cell rather than changing the interpretation.
    observation_collision:
      observable: >-
        Target j equality alone can be caused by a coordinate isomorphism or an
        accidental repeated j. Distinguish those cases using the descended
        automorphism polynomial, rationality flag, target automorphism order,
        and an explicit Velu image certificate.
      distinct_preimage_search: >-
        For every accepted kernel, enumerate all order-ell subgroups and record
        the split symbol and Frobenius discriminant instead of retaining one
        favorable kernel per curve.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: [CM_discriminant_mod_ell, frobenius_discriminant_mod_ell, target_automorphism_order]
        predicted_gain: >-
          Separates genuine CM descent from j-only collisions and identifies the
          exceptional boundary where a quotient may leave the locus.
      - transform: specialization_pack
        proposed_object: >-
          Split, inert, ramified, and non-F_p-rational special-j strata with the
          same exact Velu and map controls.
        predicted_gain: >-
          Prevents an inert or extension-field counterexample from being silently
          generalized to the rational CM lane.
    quantifier_order: >-
      For every audited source curve and every enumerated F_p-rational cyclic
      kernel of every allowed ell, first require ordinary/nonexceptional status;
      only then assert preservation of the special-j locus. Exceptional and
      non-rational strata are reported but do not enter the universal claim.
    method_ceiling:
      strongest_certifiable_claim: >-
        A finite, exhaustive certificate over the declared p list, twists, odd
        degrees, and rational kernels; it can reveal a boundary counterexample
        but cannot prove closure for all p, all degrees, even isogenies,
        supersingular curves, or extension fields.
      nearby_object_control: >-
        Include p with non-rational special-j automorphisms and exceptional
        repeated-Frobenius/ramified kernels; these controls must be kept
        separate from the nonexceptional rational-CM claim.
    proof_obligations:
      - claim: Exact enumeration finds every rational order-ell kernel in each cell.
        responsibility: completeness
      - claim: Velu quotient coefficients and images satisfy the target curve equation.
        responsibility: correctness
      - claim: Split/nonexceptional cells preserve j and the rational automorphism order.
        responsibility: strictness
      - claim: Exceptional and non-rational controls are labeled and not generalized.
        responsibility: scope
      - claim: Runtime and memory remain within the declared toy budget.
        responsibility: runtime
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: Commuting Frobenius and CM action on prime-to-p torsion
      citation: null
      role: simultaneous-eigenline mechanism to be audited, not cited as a completed proof
  reduction_chain:
    core_problem: ordinary prime-field ECDLP endomorphism availability
    corollaries:
      - problem: special-j isogeny representative selection
        reduction_ref: null
        asymptotics_preserved: not_applicable
  predictions:
    - metric: split_nonexceptional_special_j_preservation_rate
      direction: different
      minimum_effect: 1.0
    - metric: split_nonexceptional_target_automorphism_match_rate
      direction: different
      minimum_effect: 1.0
    - metric: exceptional_or_nonrational_counterexample_rate
      direction: different
      minimum_effect: report_stratum_without_generalization
  test_boundary:
    instances:
      - >-
        Explicit prime list filtered into p congruent to 1 mod 3 and p congruent
        to 1 mod 4 rational-CM strata, plus non-rational special-j controls.
      - >-
        All F_p-isomorphism twists at each selected j and every enumerated
        rational kernel for ell in {3,5,7,11,13}.
    parameters:
      prime_list: [101, 103, 107, 109, 113, 127, 131, 137, 139, 149, 151, 157, 163, 167, 173, 179, 181, 191]
      degrees: [3, 5, 7, 11, 13]
      coefficient_box: not_applicable
      claim_tier: toy
    implementation: experiments/EXP-ECDLP-3c1bc0/code/audit_special_j_isogeny_closure.py
    budget:
      wall_clock_seconds: 120
      maximum_memory_gb: 2
      maximum_runs: 1
  falsification_conditions:
    - >-
      A valid split, unramified, distinct-Frobenius rational-CM cell has a
      target j outside its source special locus or loses the predicted rational
      automorphism order.
    - >-
      Any map or subgroup certificate fails after the exact kernel enumeration;
      this invalidates infrastructure rather than falsifying the mechanism.
  interpretation_limits:
    - This is a toy finite certificate, not a proof for all isogeny degrees or fields.
    - Exceptional and non-F_p-rational controls may leave the special-j locus and are not counterexamples to the scoped claim.
    - No ECDLP is solved and no attack complexity improvement is inferred.
  status: proposed
  proposed_by: coordinator
  dominated_by: Pollard rho at exponent 1/2
  sota_delta: 0
  pareto_integrity:
    time: no claimed improvement
    memory: no claimed improvement
    data_queries: explicit quotient construction adds overhead
    frontier_checked: true
