hypothesis:
  id: H-DREG-91be14
  question_id: RQ-DREG-001
  derived_from_idea: IDEA-20260801-002
  status: proposed
  added: '2026-08-25'

  statement: >-
    SCOPE. The boolean chained Semaev system at m = 3, t = 3 as built by
    src/semaev_tree.py and Weil-descended to GF(2), at sizes n in the goal's committed
    range, on and off the n/3 lattice, over FULL degree-by-degree column sets only.
    CLAIM TIER toy. NO ATTACK, NO EXPONENT, NO PRIME-FIELD TRANSFER, NO ECDLP HARDNESS
    STATEMENT.

    THE HYPOTHESIS, IN THREE PARTS.
    (D1) THE INSTRUMENT IS THE QUANTITY. The graded PIVOT-DEGREE HILBERT FUNCTION of
      the homogenized system - computed by exact row-echelonization of the FULL-column
      Macaulay-like matrix at each degree - has its first full-rank-stable degree equal
      to the system's solving degree d_reg(n). This is HEUR-DREG-HILB-1, it is
      numbered, it is load-bearing, and it is validated against a direct F4/F5-style
      solve at the small n where both complete.
    (D2) THE MEASUREMENT IS AFFORDABLE WITHOUT A SOLVE. d_reg(n) is obtainable from
      that pass at n where a Groebner solve is not affordable, using full column sets
      at each degree and never subset-column coranks, which the goal's own evidence
      rules classify as artifacts.
    (D3) THE DISCRIMINATION, WHICH IS THE POINT. The measured gap sequence
      gap(n) = d_reg(n) - d_ff(n), read against the T11-support-matched semi-regular
      null, either TRACKS the null at every tested n or DEPARTS from it - a departure
      being a divergence at three or more consecutive n, in a consistent direction,
      exceeding the null's own spread over the matched-support ensemble.

    PRE-REGISTERED READING, TWO-SIDED AND BOTH INFORMATIVE. Tracking the null at all
    tested n KILLS the sub-rho scenario within the tested scope and is a scoped
    negative with forward value. Departing - bounded d_reg with a growing deficit -
    leaves the sub-rho scenario alive within the tested scope. The record does not
    predict which; what it predicts is that the pass is DECIDABLE between them, and the
    control ensemble exists so that "decidable" is measured rather than asserted.

  mechanism: >-
    The solving degree of a polynomial system is the first degree at which the
    Macaulay-type matrix acquires enough independent leading terms that no new leading
    monomial appears above it; equivalently, the first degree at which the graded pivot
    structure of the homogenized system becomes full-rank-stable. That structure is
    exactly what a graded pivot-degree Hilbert function exposes, and reading it requires
    only exact linear algebra degree by degree - NOT a Groebner basis. The saving is
    therefore not algorithmic cleverness but a change of what is computed: rank and
    pivot degrees instead of a reduced basis, which removes the combinatorial blowup of
    reduction while keeping the quantity the goal is about.
    TWO DISCIPLINE POINTS ARE LOAD-BEARING AND BOTH COME FROM THIS LANE'S OWN HISTORY.
    FIRST, column sets must be FULL at each degree: subset-column coranks were found to
    be artifacts, so a pass built on them would reproduce an artifact more cheaply
    rather than measure d_reg. SECOND, the comparison must be against a
    SUPPORT-MATCHED semi-regular null, not against a generic semi-regular series,
    because this system's supports are structured by the char-2 Frobenius expansion and
    the Weil-descent block pattern; a null that does not match the support is a null
    about a different system and a "departure" from it measures the mismatch.
    THE HOMOGENIZATION CONVENTION SHIFTS d_reg BY A CONSTANT, so the convention is
    frozen in the contract and the SAME convention is applied to the measured system,
    the null ensemble and the F4/F5 validation - otherwise a constant offset would be
    read as a departure.

  assumptions:
    - >-
      Exact row-echelonization of full-column sets is tractable at the n range where the
      null-versus-departure decision is expected. Where it is not, the rung is reported
      as beyond reach rather than estimated.
    - >-
      Full-column rank at every degree is computable without materializing the entire
      matrix at once; the chunking strategy is declared and its peak memory measured,
      because this lane has already met a memory wall around n = 21.
    - >-
      The homogenization convention is fixed once and applied identically to the
      measured system, the null ensemble and the validation solve.
    - >-
      The T11-support-matched null ensemble is generated by matching the SUPPORT
      pattern, not merely the degree and variable count; a mismatched null is not a null.

  proof_search_map:
    bottleneck: >-
      Whether the first full-rank-stable degree of the graded pivot-degree Hilbert
      function equals d_reg. If it does not, the pass measures a different integer and
      every gap(n) computed from it is a gap in that different integer - which is the
      one way this design fails silently, and the reason the F4/F5 cross-check is a
      precondition rather than a robustness extra.
    baseline_embedding:
      parameter_slice: >-
        The small-n slice where a direct F4/F5-style solve completes is the exact
        boundary at which the new instrument and the incumbent method must agree. The
        claimed family therefore contains the incumbent as a slice, not as an analogy.
      reproduction_check: >-
        Frozen regression fixture: at every n where a direct solve completes within
        budget, the pivot-degree pass's first full-rank-stable degree must equal the
        solve's observed solving degree EXACTLY, under one homogenization convention. A
        mismatch at any such n halts the line before any gap sequence is reported.
    observation_collision:
      observable: 'the integer d_reg-hat(n) read off the pass'
      distinct_preimage_search: >-
        THE COLLISION IS NAMED. The same integer can arise as (a) the true solving
        degree, (b) a degree at which rank stabilized because the column set was
        truncated, or (c) a degree shifted by a constant from a different homogenization
        convention. Three preimages, one observable. The separating conditions are the
        FULL-column requirement, the frozen convention applied identically across all
        three arms, and the F4/F5 agreement at the overlap - and a departure claimed
        without all three is a departure in an unidentified quantity.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace a Groebner solve with a graded pivot-degree rank pass on full column
          sets, computing only rank and pivot degrees, so the quantity survives while
          the reduction blowup does not.
        predicted_gain: >-
          d_reg(n) at rungs where a solve is unaffordable, at the cost of a numbered
          heuristic that must be validated at the overlap. No exponent and no attack.
      - transform: observable_fiber
        proposed_object: >-
          Hold the measured d_reg-hat fixed and vary the column set (full versus subset)
          and the homogenization convention, exhibiting which choices move the observable
          and by how much.
        predicted_gain: >-
          A calibration of the observable's sensitivity to exactly the two choices this
          lane has previously been misled by, available before any gap is interpreted.
    quantifier_order: >-
      CLAIMED. FOR EACH n in the committed range, THERE EXISTS a first full-rank-stable
      degree of the graded pivot-degree pass on FULL column sets, and it equals
      d_reg(n) at every n where the F4/F5 comparison is available. NOT CLAIMED, and it
      is the dangerous stronger reading: that the equality persists at n beyond the
      validation overlap. That extension is exactly HEUR-DREG-HILB-1's unvalidated
      region, it is declared as such, and every gap(n) read beyond the overlap inherits
      the heuristic's status.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On the boolean chained Semaev system at m = 3, t = 3 built by
        src/semaev_tree.py, over the committed n range and under the frozen
        homogenization convention, the measured gap sequence against the
        T11-support-matched semi-regular null is the reported sequence, with d_reg
        validated against a direct solve at n up to the overlap boundary." It certifies
        nothing about prime-field systems, nothing at other m or t, nothing about ECDLP
        hardness, and nothing about n beyond the measured range.
      nearby_object_control: >-
        The subset-column corank pass, which this lane has already classified as an
        artifact, run as a labelled NEGATIVE control: it must be shown to produce a
        DIFFERENT sequence, so that a reader can see the full-column requirement is
        load-bearing rather than ceremonial.
    proof_obligations:
      - claim: The pivot-degree pass's stable degree equals the direct solve's solving degree at every overlap n.
        responsibility: correctness
      - claim: Column sets are full at every degree, and the subset pass is labelled an artifact.
        responsibility: interface
      - claim: One homogenization convention is applied identically to measurement, null and validation.
        responsibility: strictness
      - claim: The null ensemble matches the T11 support pattern, not merely degree and variable count.
        responsibility: baseline
      - claim: Peak memory and wall time are measured per rung and the reached n is reported, not assumed.
        responsibility: memory
      - claim: A departure is declared only against the null ensemble's own measured spread.
        responsibility: success_probability

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Explicitly null. This hypothesis measures a degree sequence; it makes no complexity
    claim and moves no exponent. A departure would leave a scenario alive, which is not
    the same as supporting it, and the record says so rather than letting the
    distinction erode.

  heuristic_assumptions:
    - id: HEUR-DREG-HILB-1
      formal_statement: >-
        FOR the boolean chained Semaev system at m = 3, t = 3 and FOR every n in the
        committed range, the first degree at which the leading-coefficient pivot
        structure of the homogenized system's FULL-column Macaulay-like matrix becomes
        full-rank-stable equals the system's solving degree d_reg(n), under the frozen
        homogenization convention.
      random_model_justification: >-
        Not distributional. It is a structural identification standard in Groebner-basis
        and Hilbert-function theory for zero-dimensional ideals over finite fields, and
        it is recorded as a numbered heuristic rather than a theorem because this
        program has not proved it for THIS system's support pattern and cites no source
        for it.
      supporting_results: []
      supporting_results_note: >-
        No citation is asserted. The parent proposal names "standard Groebner-basis /
        Hilbert-function theory (semi-regularity literature)" as rigorous support and no
        source has been read; the validation experiment, not a citation, is what this
        record relies on.
      validation_experiment_ids: [EXP-DREG-620b15]
      falsification_condition: >-
        At any n where a direct F4/F5-style solve completes, the pass's first
        full-rank-stable degree differs from the solve's solving degree under the same
        convention. The identification is then wrong and every d_reg-hat beyond the
        overlap is withdrawn.

  predictions:
    - metric: >-
        agreement between the pivot-degree pass and a direct F4/F5-style solve at every
        n where both complete
      direction: different
      minimum_effect: >-
        Exact integer equality at every overlap n. A single disagreement falsifies
        HEUR-DREG-HILB-1 and voids every value beyond the overlap.
    - metric: gap(n) = d_reg(n) - d_ff(n) against the T11-support-matched semi-regular null
      direction: different
      minimum_effect: >-
        A departure requires divergence from the null at three or more CONSECUTIVE n, in
        a consistent direction, exceeding the null ensemble's own measured spread at
        those n. Anything less is TRACKING and is reported as tracking.
    - metric: subset-column corank pass versus full-column pass, same n
      direction: different
      minimum_effect: >-
        A different sequence. If the two agree everywhere, the full-column requirement
        this lane imposed is not load-bearing on this instrument and that itself must be
        recorded, because it would mean the artifact finding does not bind here.
    - metric: largest n at which the full-column pass completes inside the memory budget
      direction: different
      minimum_effect: >-
        Reported, not predicted, together with measured peak RSS per rung. A rung not
        reached is a budget stop and is never a value.
    - metric: homogenization-convention sensitivity, the shift in d_reg-hat between two conventions at fixed n
      direction: different
      minimum_effect: >-
        A constant shift, identical at every n. A shift that varies with n means the
        convention interacts with the system's structure and no cross-n sequence may be
        compared until it is resolved.

  test_boundary:
    instances: >-
      The frozen boolean chained Semaev system used by the prior experiments in this
      lane, at m = 3, t = 3, built by src/semaev_tree.py and Weil-descended to GF(2);
      plus a T11-support-matched semi-regular null ensemble at every n; plus, at small n
      only, the same instances handed to a direct solve.
    parameters:
      m: 3
      t: 3
      n_range: >-
        the goal's committed range, walked upward from the smallest n where the direct
        solve completes until the full-column pass exceeds the memory budget, with
        rungs both on and off the n/3 lattice
      column_sets: full at every degree; subset-column pass run only as a labelled negative control
      null_ensemble_draws: 20 per n
      homogenization_convention: frozen in the contract and applied identically to all three arms
      seeds: [2026, 20260825, 20260826]
    implementation: >-
      Python 3.11 with exact GF(2) linear algebra; degree-by-degree construction of the
      full column set with a declared chunking strategy so the whole matrix is never
      materialized; peak RSS measured per rung; the direct-solve arm using this lane's
      existing solver path at the small n where it completes.
    budget:
      wall_clock_seconds: 7200
      total_cpu_hours: 16.0
      memory_gb: 24
      maximum_runs: 40

  distinguishable_outcomes:
    - outcome: >-
        VALIDATION FAILS. The pass's stable degree differs from the direct solve's
        solving degree at any overlap n.
      what_observing_it_would_mean: >-
        HEUR-DREG-HILB-1 and hence (D1) are FALSIFIED. The pass measures a different
        integer, every d_reg-hat beyond the overlap is withdrawn, and no gap sequence is
        reported. The deliverable is the exhibited disagreement at a named n, which is
        cheap and is a genuine result about the instrument.
    - outcome: >-
        TRACKS THE NULL. Validation passes and gap(n) stays inside the null ensemble's
        spread at every tested n.
      what_observing_it_would_mean: >-
        (D3) resolves to tracking. The sub-rho scenario is KILLED WITHIN THE TESTED
        SCOPE - the tested n range, m = 3, t = 3, this system, this convention - and the
        obstruction is the measured gap sequence with its ensemble spread, over exactly
        that scope. It is a scoped negative with forward guidance, not a universal
        impossibility statement, and it must never be quoted as one.
    - outcome: >-
        DEPARTS FROM THE NULL. Validation passes and gap(n) diverges at three or more
        consecutive n beyond the ensemble spread, consistent in direction.
      what_observing_it_would_mean: >-
        (D3) resolves to departure and the sub-rho scenario is NOT killed within the
        tested scope. This is not support for the scenario; it is the failure of one
        attempt to kill it. Independent replication is required before any status change,
        because a departure here would be surprising, high-impact and sensitive to the
        homogenization and column-set choices this design exists to control.
    - outcome: >-
        AMBIGUOUS. The null ensemble's spread is wide enough that gap(n) is inside it at
        some n and outside at others, with no run of three consecutive.
      what_observing_it_would_mean: >-
        The measurement CANNOT DISCRIMINATE between tracking and departure at the
        reached n. The decision is inconclusive and is recorded as inconclusive; the
        forward action is more rungs or a tighter null ensemble, not a narrower reading
        of the existing data.
    - outcome: >-
        SUBSET AND FULL AGREE. The negative-control subset-column pass reproduces the
        full-column sequence exactly.
      what_observing_it_would_mean: >-
        The artifact finding that motivated the full-column requirement does not bind on
        THIS instrument. That is a correction to this lane's own methodology and is a
        deliverable in its own right; it does not by itself invalidate the gap sequence,
        but it must be recorded beside it.
    - outcome: >-
        CONVENTION SHIFT VARIES WITH n.
      what_observing_it_would_mean: >-
        The homogenization convention interacts with the system's structure rather than
        contributing a constant. NO CROSS-n COMPARISON IS VALID until it is resolved, and
        the gap sequence is withheld rather than reported with a caveat.
    - outcome: >-
        INFRASTRUCTURE. The pass exceeds memory or time at the rungs where the decision
        was expected.
      what_observing_it_would_mean: >-
        NOTHING ABOUT d_reg (AGENTS.md rule 5). failed_infrastructure; the reached n and
        measured peak RSS are the deliverable, and the decision is deferred, not
        answered negatively.

  falsification_conditions:
    - >-
      The pivot-degree pass disagrees with a direct F4/F5-style solve at any n where
      both complete.
    - >-
      The gap sequence is identical to the T11-support-matched semi-regular null at all
      tested n, which resolves (D3) to tracking and kills the sub-rho scenario in scope.
    - >-
      The gap sequence departs from the null at three or more consecutive n beyond the
      ensemble spread, which resolves (D3) to departure.
    - >-
      The homogenization convention's shift varies with n, which makes the sequence
      uninterpretable across rungs.
    - >-
      No n is reached at which both the pass and the direct solve complete, so
      HEUR-DREG-HILB-1 is never validated and no d_reg-hat may be reported.

  interpretation_limits:
    - >-
      Toy-scale n only. No crypto-scale claim, no prime-field transfer, and nothing at m
      or t other than 3.
    - >-
      The measurement discriminates NULL-VERSUS-DEPARTURE for one system under one
      convention. It does not measure ECDLP hardness and no hardness statement follows.
    - >-
      A departure is the failure of an attempt to kill a scenario, not support for it.
      Reading it as support would be exactly the inference this record refuses.
    - >-
      Every d_reg-hat beyond the F4/F5 validation overlap is CONDITIONAL on
      HEUR-DREG-HILB-1 and inherits its unvalidated status; the overlap boundary must be
      quoted wherever such a value is cited.
    - >-
      A rung not reached within the memory budget is not a value and is never
      interpolated.

  prior_evidence_refs:
