hypothesis:
  id: H-ECDLP-5b4ade
  question_id: RQ-ECDLP-002
  statement: >-
    Formalises IDEA-20260814-c3af09, WITH ITS PRUNING BASELINE DISAMBIGUATED
    BECAUSE ONE OF THE TWO READINGS HAS BAND WIDTH ZERO. Fix m in {3,4}, a
    public factor base F of size B, a target-independent integral lift rule and
    a finite precision schedule. The claim under test is the INTERFACE, not the
    asymptotic target. A branch-and-Hensel decoder D that uses tropical
    initial-form cancellations to select which monomial-valuation cells to
    visit must, on exhaustive toy instances,
    (i) return EVERY exact factor-base source tuple with its signs and
    multiplicities, recall exactly 1.000, each carrying a replayable
    point-sum certificate, false-source rate exactly 0;
    (ii) cost strictly less than the same residue-and-Hensel backend with the
    TROPICAL MEMBERSHIP TEST REMOVED, at a charged F_p-operation ratio of at
    most 0.70, with the cost of computing valuations and testing cell
    membership charged to the tropical side;
    (iii) hold that advantage across independent integral lifts that reduce to
    the identical F_p system, coefficient of variation at most 0.10 with no
    monotone collapse toward 1 as the lift-randomisation amplitude increases;
    and
    (iv) beat a support-and-valuation-matched random polynomial system by at
    least 0.15 absolute on the same ratio.
    A lift-sensitive advantage is a representation artifact. An advantage
    shared with the matched random system is solver behaviour, not elliptic
    structure. Either falsifies this version.
  mechanism: >-
    Semaev decomposition is expressed over a fixed integral model. Monomial
    valuations identify cells in which at least two lowest terms can cancel.
    Instead of sending the whole system to a generic solver, the decoder visits
    only those cells, solves each residue initial form, Hensel-lifts every
    residue root, maps lifted coordinates back to exact points of F, and
    verifies the signed sum. The potential gain is a target-dependent reduction
    in the number of cells VISITED before nonlinear elimination.
    THE BASELINE THAT MAKES THAT MEASURABLE IS THE PRUNING-ERASED DECODER, NOT
    THE ORDER-ERASED ONE, and the two are different objects. A decoder whose
    branch PRIORITY is randomly permuted visits the same cell set in a
    different order, so its visited-cell count is identical by construction and
    the ratio is exactly 1.000 for every instance. A decoder with the tropical
    membership test REMOVED visits every cell of the declared normal fan, and
    the ratio against it is the tropical pre-variety's share, which is a real
    number below 1 whenever the pre-variety is a proper subset. The source
    proposal's text uses both phrasings, "branch-order-erased" and "without
    tropical pruning", and only the second supports a 0.70 gate.
    The projection from a lifted system and a source tuple to its monomial
    valuations and residue initial form is genuinely lossy, distinct
    coefficient lifts and distinct residue roots can share a tropical cell.
    That missing inverse is deliberate and is why the decoder must attach a
    residue branch and return exact source tuples; returning only a cell, a
    valuation vector, a rank drop or a candidate filter is failure, not success.
  assumptions:
    - >-
      E/F_p is a public ordinary curve with a public prime-order subgroup
      G = <P> of order N about p. Only generated toy instances are used.
    - >-
      The factor base, arity, signed-source convention, integral polynomial
      model, coefficient lifts, valuation field, precision schedule, branch
      order and independent verifier are all frozen before any target is
      sampled.
    - >-
      Every accepted branch returns exact factor-base indices and signs. A
      branch reporting only existence, a root count, or a coordinate outside F
      earns no relation credit.
    - >-
      Setup, valued extensions, coefficient height, precision limbs, failed
      branches, residue solves, Hensel steps, emitted roots, retries,
      factor-log linear algebra, masked descent, verification and serialised
      bytes are all charged, on both sides, in one unit.
    - >-
      Source indices come only from public coordinate membership. Reusing known
      toy logarithms to index factor-base points would supply the decoder the
      answer.
  proof_search_map:
    bottleneck: >-
      The generic polynomial-membership solve inside Semaev decomposition.
      Removing it would require a target-uniform set of initial-form branches
      that can be traversed and inverted to exact source tuples at total query
      and output cost below the rho boundary.
    baseline_embedding:
      parameter_slice: >-
        THE PRUNING-ERASED DECODER, that is the identical residue-and-Hensel
        backend visiting every cell of the declared normal fan with no tropical
        membership test. Separately, the ORDER-PERMUTED decoder is a distinct
        object whose visited-cell ratio is forced to exactly 1.000 and which
        serves as a forced-value null. With one chart per source tuple the
        procedure is explicit enumeration and receives no compression credit.
      reproduction_check: >-
        Exhaustive truth through 16-bit subgroup order must reproduce every
        Semaev decomposition, and the pruning-erased baseline must return an
        accepted-source set identical to the tropical arm's, before any timing
        or ratio is read.
    observation_collision:
      observable: >-
        The ordered monomial-valuation vector and residue initial form of a
        target branch.
      distinct_preimage_search: >-
        Exhaustively find distinct source tuples and distinct coefficient lifts
        sharing an observable. Every collision must be separated by the declared
        residue-and-Hensel state or retained in the output list. One lost source
        falsifies completeness; an ambiguity list as large as exhaustive search
        falsifies the cost mechanism.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace one dense Semaev solve by a finite initial-form branch graph
          with exact residue roots and Hensel edges.
        predicted_gain: >-
          Fewer nonlinear branches visited per accepted relation, without losing
          source labels.
      - transform: observable_fiber
        proposed_object: >-
          Hold the tropical branch observable fixed while changing integral
          lifts and residue roots.
        predicted_gain: >-
          Distinguishes lift-stable geometric pruning from a coefficient-encoding
          artifact before any scaling claim.
    quantifier_order: >-
      THERE EXISTS one target-independent lift rule, precision schedule and
      decoder D such that FOR ALL targets in the declared toy family and FOR ALL
      valid factor-base source tuples, D returns that tuple, while FOR RANDOM
      blinded targets its expected complete cost including retries and output
      is below the declared bound. D may not be selected after seeing a target.
    method_ceiling:
      strongest_certifiable_claim: >-
        Exact toy source recovery and a measured charged-cost ratio under the
        frozen lift ensemble. It cannot certify a cryptographic exponent,
        source-faithful tropicalization in general, or any ECDLP improvement.
      nearby_object_control: >-
        A random polynomial system matched in variable count, degree, monomial
        support, coefficient-valuation histogram and number of residue roots. A
        pruning ratio shared with this null is solver behaviour, not elliptic
        structure. This object is CURVE-FREE and is the contract's required
        curve-free null.
    proof_obligations:
      - claim: The pruning-erased baseline reproduces exhaustive Semaev source truth.
        responsibility: baseline
      - claim: Every retained initial-form branch lifts to all exact residue roots.
        responsibility: correctness
      - claim: Every exact source is returned with its signs and multiplicities.
        responsibility: correctness
      - claim: Branch and output counts stay below the claimed bounds.
        responsibility: size
      - claim: Per-attempt cost times inverse success probability is below rho.
        responsibility: runtime
      - claim: Peak valued-state and output memory is below the stated cap.
        responsibility: memory
      - claim: Lift-ensemble invariance separates mechanism from encoding artifact.
        responsibility: strictness
      - claim: The decoder uses only public target-dependent data.
        responsibility: interface
    not_applicable_reason: null
  rerandomization: >-
    Targets are blinded as R + [t]P with the public mask retained only for final
    verification. This is a blinding device for the measurement, not a
    worst-to-average-case reduction, and no mixing-time claim is made.
  asymptotic_claim: null
  heuristic_assumptions:
    - id: H-TROP-1
      formal_statement: >-
        For the frozen lift ensemble and declared parameter family, the number
        of source-bearing initial-form branches per random blinded target is
        N^{theta + o(1)} for one target-independent theta below 1/2, uniformly
        over the declared arities and lift-randomisation amplitude.
      random_model_justification: >-
        The fundamental theorem of tropical geometry relates valuations of
        algebraic roots to the tropical variety, and every exact F_p source is
        checked by the Semaev identity after reduction. Branch occupancy is
        modelled by a support-and-valuation-matched random polynomial ensemble.
        NEITHER FACT SUPPLIES THE CLAIMED theta, and the record says so.
      supporting_results:
        - >-
          None internal. The two ingredients named above are a theorem and a
          modelling choice, not corpus results, and no committed record in this
          ledger is cited as discharging theta.
      validation_experiment_ids:
        - EXP-ECDLP-5551b6
      falsification_condition: >-
        The fitted theta is at or above 1/2 on any completed scaling fit, or
        the branch-count distribution's upper tail departs from the matched
        random ensemble in the direction of more branches.
    - id: H-TROP-2
      formal_statement: >-
        Conditional on a source-bearing initial form, residue roots lift with
        bounded expected multiplicity N^{o(1)}, and the lift failure and retry
        law is stable across coefficient lifts of the same reduced system.
      random_model_justification: >-
        Simple nonsingular roots satisfy the ordinary Hensel uniqueness
        condition. Singular Semaev fibres are NOT covered by that theorem and
        are retained as a separate stratum rather than folded in.
      supporting_results:
        - >-
          Hensel uniqueness for simple nonsingular roots, elementary and
          internal. Nothing covers the singular stratum.
      validation_experiment_ids:
        - EXP-ECDLP-5551b6
      falsification_condition: >-
        Any branch is lost or unrecorded, or the singular-stratum retry law
        differs across the lift ensemble beyond the declared tolerance.
  structural_ingredients:
    - description: >-
        Source proposal. The lift-stable tropical initial-form decoder, its
        blocking interface gates, and the branch-ratio baseline whose two
        readings this record disambiguates.
      citation: IDEA-20260814-c3af09
      provenance: internal
      verified_by: >-
        TASK-20260904-c063e5 coordinator. Full read of
        ledger/proposals/IDEA-20260814-c3af09.yaml, 416 lines, Read tool,
        2026-09-04.
      role: originating claim
    - description: >-
        Governing question. Scope field_types "prime"; constraint 3 makes
        Pollard rho, BSGS and relevant generic and preprocessing lower bounds
        MANDATORY matched controls; constraint 5 requires an independently
        reverified certificate for every claimed solve or relation.
      citation: RQ-ECDLP-002
      provenance: internal
      verified_by: >-
        TASK-20260904-c063e5 coordinator. Full read of
        ledger/questions/RQ-ECDLP-002.yaml, 41 lines, Read tool, 2026-09-04.
      role: the governing question and its mandatory controls
    - description: >-
        Igor Semaev, summation polynomials and the discrete logarithm problem
        on elliptic curves, IACR ePrint 2004/031. Supplies the
        summation-polynomial decomposition equation and no tropical decoder.
      citation: IACR ePrint 2004/031
      provenance: recalled
      verified_by: null
      role: >-
        NAMED BY THE SOURCE PROPOSAL AS A PRIMARY SOURCE IT CHECKED. NOT opened
        by this Coordinator, so it is recorded recalled here rather than
        inheriting the proposal's own status.
    - description: >-
        Paul Alexander Helminck, faithful tropicalizations of elliptic curves
        using minimal models and inflection points, arXiv 1809.09892.
        Distinguishes numerical from faithful tropicalization and does not
        provide finite-field source recovery for Semaev fibres.
      citation: arXiv 1809.09892
      provenance: recalled
      verified_by: null
      role: named by the source proposal; NOT opened by this Coordinator
    - description: >-
        Amadori, Pintore and Sala, on the discrete logarithm problem for
        prime-field elliptic curves, IACR ePrint 2017/609. Supplies the
        prime-field PDP, relation-matrix and factor-base path the decoder must
        complete.
      citation: IACR ePrint 2017/609
      provenance: recalled
      verified_by: null
      role: named by the source proposal; NOT opened by this Coordinator
  reduction_chain:
    core_problem: >-
      Exact factor-base source recovery from Semaev decomposition at toy
      prime-field subgroup orders, by a fixed branch-and-Hensel decoder.
    corollaries: []
  predictions:
    - metric: exact source recall against exhaustive truth, dimensionless in [0,1]
      direction: higher
      minimum_effect: >-
        Exactly 1.000000 on every completed toy cell. One missed tuple falsifies
        the decoder interface. The disabled-branch-class planted control fixes
        the dynamic range by forcing recall down by the exactly computed
        fraction of sources in the disabled class.
    - metric: verified false-source rate after elliptic point-sum checking, dimensionless
      direction: lower
      minimum_effect: >-
        Exactly 0. Every accepted tuple carries a replayable point-sum
        certificate.
    - metric: >-
        charged F_p-operation ratio against the PRUNING-ERASED decoder,
        dimensionless, with valuation computation and cell-membership testing
        charged to the tropical side
      direction: lower
      minimum_effect: >-
        At most 0.70 on each of three increasing sizes and at least two
        arities, with the accepted-source set identical on both sides. THE
        BASELINE IS THE PRUNING-ERASED DECODER, NOT THE ORDER-PERMUTED ONE; see
        the band note in EXP-ECDLP-5551b6 for why the second has width zero.
    - metric: >-
        visited-branch ratio against the ORDER-PERMUTED decoder, dimensionless
      direction: different
      minimum_effect: >-
        Exactly 1.000, FORCED, because permuting branch priority does not change
        which cells are visited. A forced-value null that separates ordering
        from pruning; a value away from 1.000 means the implementation is
        conflating the two and nothing is admissible.
    - metric: >-
        coefficient of variation of the charged ratio across independent
        integral lifts reducing to the identical F_p system, dimensionless
      direction: lower
      minimum_effect: >-
        At most 0.10, with no monotone collapse toward 1 as the lift
        randomisation amplitude increases.
    - metric: >-
        charged ratio on the support-and-valuation-matched random-system null
        minus the elliptic arm's, dimensionless
      direction: higher
      minimum_effect: >-
        At least 0.15 absolute. This is the CURVE-FREE null and it is the only
        thing licensing an elliptic reading. Below 0.15 the pruning is solver
        behaviour and no statement about elliptic structure, Semaev fibres or
        the ECDLP may be drawn.
  test_boundary:
    instances:
      - >-
        At least six public toy prime-field curves at subgroup sizes 12, 14 and
        16 bits, hygiene-screened, with exhaustive source truth enumerated.
      - >-
        Support-and-valuation-matched random polynomial systems, the curve-free
        null, at matched degree, support, valuation histogram and root count.
    parameters:
      claim_tier: toy
      arities: [3, 4]
      subgroup_bits: [12, 14, 16]
      factor_base_sizes_per_cell: 2
      lift_variants: 10
    implementation: >-
      Not yet written. EXP-ECDLP-5551b6 declares the required artifacts. This
      record authorizes neither implementation nor execution.
    budget:
      wall_clock_seconds_per_run: 3600
      maximum_memory_gb: 8
      maximum_runs: 8
  falsification_conditions:
    - Any valid exhaustive source tuple is absent from the decoder output.
    - Any accepted tuple fails independent point membership or signed-sum verification.
    - >-
      The apparent advantage vanishes or changes sign as p-multiple coefficient
      randomisation increases while the reduced polynomial is unchanged.
    - >-
      The support-and-valuation-matched random null matches the elliptic charged
      ratio within 0.15 on every completed cell. The pruning is then solver
      behaviour and the elliptic reading is forbidden whatever the ratio is.
    - >-
      The charged F_p-operation ratio against the pruning-erased baseline
      exceeds 0.70 on any completed size or arity while the accepted-source sets
      agree.
    - >-
      Source ambiguity, atlas state, precision, or complete cost has a
      confidence exponent at or above 1/2 on every tested scaling fit.
    - The decoder selects a lift, chart, branch order or precision after seeing the target.
    - >-
      INSTRUMENT VOID. The order-permuted forced-value null does not return
      exactly 1.000, or the disabled-branch-class planted control does not drop
      recall by its computed fraction.
  interpretation_limits:
    - >-
      This is a proposed toy decoder test, not an experiment, result,
      algorithmic improvement, approval or breakthrough claim.
    - >-
      A valid tropicalization, a small cell count, or one recovered relation is
      not evidence for a full index-calculus path.
    - >-
      UNTESTABLE AT REACHABLE SCALE. Exhaustive source truth exists only through
      16-bit subgroup order, so H-TROP-1's theta below 1/2 cannot be validated
      at any parameter this program can reach, and no observation transfers to
      cryptographic sizes without separate evidence for branch, precision,
      density, rank, descent and memory scaling. The asymptotic target in the
      source proposal is NOT under test here and no exponent is claimed.
    - >-
      Timeouts, crashes, unavailable software and invalid certificates are
      infrastructure outcomes, not evidence against the mathematical mechanism,
      per AGENTS.md rule 5.
    - >-
      THE THREE EXTERNAL SOURCES THE PROPOSAL LISTS AS CHECKED WERE NOT OPENED
      BY THIS COORDINATOR and are recorded here as recalled. Their status may be
      upgraded only by a new record in which an agent that read them says so.
  status: proposed
  proposed_by: idea-generator
