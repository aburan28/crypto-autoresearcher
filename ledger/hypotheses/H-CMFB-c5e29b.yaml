# H-CMFB-c5e29b
# Box-count dispersion of E(F_p) points in axis-parallel boxes below the
# Bombieri-Weil scale, for crater-type members of p = 5t^2 + 19t + 19 and for
# random prime-order curves, at toy sizes 2^18 < p <= 2^25. Specifies
# IDEA-20261015-5888a7 (joint x-y window factor bases) under RQ-CMFB-33610e.
# Counting only: no solver, relation-rank or pair-46 statement anywhere here.
#
# Id note: no shell was available in the designing session, so
# tools/allocate_id.py could not be executed. The 6-hex token was drawn by the
# designer and checked free the way `allocate_id.py --check` checks (no
# repository path component carries it; well-formed against
# validate_ledger.ID_PATTERNS). The archive task must run
# `python3 tools/allocate_id.py --check H-CMFB-c5e29b` before committing.
hypothesis:
  id: H-CMFB-c5e29b
  question_id: RQ-CMFB-33610e
  source_idea: IDEA-20261015-5888a7
  added: '2026-10-16'
  status: specified
  statement: >-
    For prime-field curves y^2 = x^3 + A x + B of prime order N with
    2^18 < p <= 2^25, in their stated integral charts, the number of affine
    points (x, y) of E(F_p), with x and y read as integers in [0, p), lying in
    an axis-parallel box X x Y = [x0, x0 + B1) x [y0, y0 + B2) whose corner
    (x0, y0) is uniform over [0, p - B1) x [0, p - B2) (no wrapping), has the
    variance-to-mean ratio of the uniform random model, for every box shape
    with area B1 B2 = p^alpha, alpha in {1, 4/3, 3/2}, and aspect ratio
    r = B1 / B2 in {1/16, 1/4, 1, 4, 16}. Quantified: for each arm a in
    {FAM, N-B}, each size cell c and each shape s, the ratio
    rho(a, c, s) = D_hat(a, c, s) / D_0(c, s) of the arm's mean dispersion
    index over its curves to the dispersion index of the synthetic uniform
    control measured by the same instrument at the same p and shape (each
    instance normalized by D_pred at its own p) lies in [0.9, 1.1], with its
    simultaneous interval inside [0.9, 1.1]. The random-model value is pre-registered as
    D_pred = 1 - q / 2 with q = B2 / p (derivation in the experiment
    contract, with the exact finite-p form
    1 - B2/(p-1) + B2/(2(p-B2))); the synthetic control must reproduce it
    within 0.05. Intervals are simultaneous over the 90 (arm, cell, shape)
    cells (normal intervals at z = 3.48 from a two-level bootstrap). This is
    a null prediction: below the Weil scale (area < p^{3/2} log^2 p) no
    theorem forces it, so it is a statement about the random model, tested.
  mechanism: >-
    Under the random model each abscissa x lifts with probability 1/2 to the
    pair {y, p - y} with y uniform on [1, p - 1] (y = 0 never occurs because
    N odd forbids 2-torsion), independently across x. The box count is then
    a sum over the B1 abscissae of the window of independent per-x counts
    c_x in {0, 1, 2}, with E c_x = q and Var c_x = q - q^2/2 after averaging
    y0, so Var / Mean = 1 - q/2. Any additive structure of the point set in
    the (x, y) chart (large coefficients in the exponential sums of E(F_p)
    points along both coordinates, or a CM- or family-specific correlation
    between y_x and y_{x+k}) would appear as over- or under-dispersion of the
    counts across translates of a fixed shape. Over-dispersion at the
    factor-base operating scale (area p^{4/3}) is the only way a joint x-y
    window could be enumerated by a box enumerator cheaper than the x-scan
    (cost c_box below B1), because a structured point set is what such an
    enumerator would exploit; a Poisson-like set offers it nothing beyond
    the scan. Yield at matched base size is conserved regardless
    (KN-FIND-007), so this measurement does not and cannot change yield.
  assumptions:
    - >-
      The Bombieri-Weil box estimate #(E in box) = B1 B2 / p +
      O(sqrt(p) log^2 p) is quoted in the idea from a talk slide and was not
      read at source (provenance recalled). It only places the threshold
      p^{3/2} above which the count is forced; nothing in the decision rule
      depends on its constant.
    - >-
      Chart dependence: the point set is read in one fixed integral
      Weierstrass chart per curve (FAM: A = -152 d^2, B = 722 d^3 with the
      twist parameter d of the sibling contract EXP-CMFB-cea1d2; N-B: integer
      |A|, |B| <= 1000). An isomorphic chart (u^2 x, u^3 y) moves points
      between boxes; the hypothesis is stated per chart.
    - >-
      Exact point counts are obtained by full enumeration of x in F_p (all
      cells have p <= 2^25), so curve orders are computed, not assumed.
  proof_search_map:
    bottleneck: enumeration of E(F_p) points in a thin axis-parallel box (c_box)
    baseline_embedding:
      parameter_slice: >-
        B2 = p (y unrestricted) is the plain x-window; B2 = p/2 with a
        canonical-sign fold is the small-x base of EXP-CMFB-cea1d2.
      reproduction_check: >-
        x-only window dispersion and the qr_window scan ratio 2.0 on generic
        curves (anchored scan with B2 = p/2), both measured in the same run.
    observation_collision:
      observable: box point count across translates of one shape
      distinct_preimage_search: >-
        The synthetic uniform point set is the null object of the same shape;
        a planted clustered set is the known-positive object. Over-dispersion
        shared by the synthetic set would be an instrument artifact.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: box-count law at fixed shape as a function of (x0, y0)
        predicted_gain: none predicted (null); a lead would motivate a c_box enumerator study
    quantifier_order: >-
      For each curve (fixed chart), for each shape (alpha, r) fixed before the
      run, the law of the count over uniform translates; no shape, cell or
      threshold is chosen after observing counts.
    method_ceiling:
      strongest_certifiable_claim: >-
        Dispersion of box counts consistent with the random model at
        resolution 0.1 for the tested shapes, sizes, charts and arms; no
        enumeration-cost statement, no yield change at matched B.
      nearby_object_control: >-
        Height box of H-ECDLP-b97b72 (nonlinear, not tested here); synthetic
        uniform point set and planted clustered set (tested here).
    proof_obligations:
      - claim: random-model dispersion D_pred = 1 - q/2
        responsibility: baseline
      - claim: instrument reproduces exact point counts and brute-force box counts
        responsibility: correctness
    not_applicable_reason: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        For p in (2^18, 2^25], every tested shape (alpha in {1, 4/3, 3/2},
        r in {1/16, 1/4, 1, 4, 16}) and every tested curve, the count of
        affine points of E(F_p) in a uniformly translated box of that shape
        has Var / Mean equal to that of the uniform random point model
        (independent abscissae, lift probability 1/2, uniform sign pair) to
        within a factor in [0.9, 1.1].
      random_model_justification: >-
        Points of a curve over F_p behave as a random set at scales where
        exponential-sum bounds are silent; per-x lifts are the Legendre
        symbols of f(x), whose interval sums behave like random walks.
      supporting_results:
        - "Bombieri-Weil type box count, error O(sqrt(p) log^2 p) (recalled, unread; threshold only)"
        - "arXiv:1111.1543, upper bounds for points of y^2 = f(x) mod p in small squares (retrieved, abstract only)"
      validation_experiment_ids: [EXP-CMFB-a07d3f]
      falsification_condition: >-
        On a valid run set with every gate passed, rho >= 1.3 at one shape
        on at least two size cells in an arm, with each such cell's
        simultaneous interval above 1.1; or rho <= 0.7 with the interval
        below 0.9 under the same condition (under-dispersion, recorded
        separately).
  structural_ingredients:
    - description: Bombieri-Weil box estimate for points of a curve mod p
      citation: talk slide quoted in IDEA-20261015-5888a7 notes
      provenance: recalled
      verified_by: null
      role: threshold p^{3/2} above which the box count is forced
    - description: upper bounds on points of y^2 = f(x) mod p in a square of side M
      citation: arXiv:1111.1543
      provenance: retrieved
      verified_by: idea-generator (abstract only, 2026-10-15)
      role: context for small boxes; not used in the decision rule
  predictions:
    - metric: rho = arm dispersion index / synthetic dispersion index per shape and cell
      direction: different
      minimum_effect: >-
        1.0 predicted, resolution [0.9, 1.1]; rho >= 1.3 on at least two
        cells is a lead (over-dispersion), rho <= 0.7 likewise a recorded
        under-dispersion
    - metric: synthetic dispersion index against D_pred = 1 - B2/(2p)
      direction: different
      minimum_effect: within 0.05 absolute (instrument gate)
    - metric: anchored lifts per kept element against p / B2
      direction: different
      minimum_effect: >-
        within max(5 percent, 3 standard errors) pooled per cell (reported
        check, not a gate); 2.0 +- 0.02 at B2 = (p-1)/2 on generic curves
        (qr_window positive control, a gate)
    - metric: m = 3 coverage ratio of the anchored joint base vs 200 matched random bases (cell K20 only)
      direction: different
      minimum_effect: 1.00 +- 0.01 predicted
  test_boundary:
    instances:
      - "FAM: crater-type members of p = 5t^2+19t+19, N = 5t^2+18t+20 both prime, t odd, 5 per cell (all if fewer)"
      - "N-B: random prime-order curves y^2 = x^3+Ax+B, |A|,|B| <= 1000, 5 per cell"
      - "SYN: synthetic uniform point sets, 5 per cell, p matched to N-B curves"
      - "PLT: planted clustered synthetic sets, 3 per cell"
    parameters:
      cells: "K20 = (2^18, 2^21], K22 = (2^21, 2^23], K24 = (2^23, 2^25]"
      area_exponents: [1, 4/3, 3/2]
      aspect_ratios: [1/16, 1/4, 1, 4, 16]
      translates_per_shape: "10^5 = 100 y0 rows x 1000 x0 per row"
      resolution: "[0.9, 1.1] on rho; lead threshold 1.3 on >= 2 cells"
    implementation: >-
      experiments/EXP-CMFB-a07d3f (launcher not yet implemented; contract is
      review_required until it is, see the specification).
    budget:
      enforcement: advisory
      total_cpu_hours: 6
      maximum_memory_gb: 8
      maximum_workers: 4
  distinguishable_outcomes:
    - "INSTRUMENT_VOID: a gate fails (point-count identity, brute-force box counts, synthetic D within 0.05 of D_pred, planted detection, qr_window ratio). No reading."
    - "NULL_AT_RESOLUTION: every powered (arm, cell, shape) rho has its simultaneous interval inside [0.9, 1.1], with at least 2 powered cells per arm."
    - "GENERIC_OVERDISPERSION (E1): rho >= 1.3 in N-B at one shape on >= 2 cells; the random model fails for curves generally in this chart family."
    - "FAMILY_OVERDISPERSION (E2/E3 joint): rho >= 1.3 in FAM at one shape on >= 2 cells and not in N-B; D = -19 class and family relation are not separated by this design."
    - "UNDERDISPERSION_RECORDED: rho <= 0.7 under the same rule and no over-dispersion lead."
    - "INCONCLUSIVE: none of the above (an interval leaves [0.9, 1.1] without a lead at 1.3 on two cells)."
  falsification_conditions:
    - >-
      H1 is falsified (scoped to the arm, shapes and cells) by GENERIC or
      FAMILY over-dispersion, or by recorded under-dispersion, on a valid run
      set; the falsification is a lead that needs independent replication
      with fresh seeds and instances.
    - >-
      The instrument is falsified (run void) if the planted clustered set is
      not detected (rho_planted < 1.3 in any cell) or the synthetic control
      leaves D_pred +- 0.05.
  interpretation_limits:
    - >-
      Counting only. No solver, relation, linear-algebra or descent cost is
      measured, and yield at matched base size is conserved (KN-FIND-007):
      a lead here is a reason to study a box enumerator, not an advantage.
    - >-
      Toy sizes 2^18 < p <= 2^25 only; no transfer to 2^28, to the 53-bit
      pair p = 5947698030651343, or to any cryptographic size.
    - >-
      Chart-specific, axis-parallel boxes only, translates without wrapping.
      The floor curve (End = Z[pi]) and other D = -19 curves (N-A of
      EXP-CMFB-cea1d2) are not tested; a FAM-only lead cannot separate the CM
      class from the family relation.
    - >-
      Does not touch the gamma_m question of H-ECDLP-b97b72; a null reading
      is a statement at resolution 0.1 on rho for the tested shapes, never
      "no structure".
  status_rationale: >-
    Specified under design-experiment step 3. The contract
    experiments/EXP-CMFB-a07d3f/specification.yaml is complete as a
    scientific protocol but review_required: no launcher, trial plan or
    dispatch queue exists, and this designing session had no shell to
    implement or pilot one. No evidence exists.
  not_claimed: >-
    No exponent, no enumeration-cost bound, no yield or coverage advantage,
    no claim for p > 2^25 or for the 53-bit pair.
  proposed_by: coordinator
