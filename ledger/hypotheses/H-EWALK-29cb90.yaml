hypothesis:
  id: H-EWALK-29cb90
  question_id: RQ-EWALK-8fa147
  added: '2026-08-25'
  derived_from_idea: IDEA-20260807-18d2f7
  statement: >-
    On a prime-order subgroup G of an elliptic curve over F_p, the equivalence-class ladder indexed
    by subgroups H of (Z/N)^* is bounded above by uselessness and below by the automorphism group -
    quotienting by the FULL endomorphism action leaves exactly TWO classes and zero information about
    the discrete logarithm, while free canonicalisation exists only up to h = |H| <= 6. The two costs
    of a quotient are INDEPENDENT and their thresholds differ by an exponent - canonicalisation is
    paid per STEP and binds immediately at h > 6, giving a charged gain of 1/sqrt(h) <= 1 under
    enumerative canon, whereas disambiguation is paid per COLLISION and does not bind until
    h is of order sqrt(N)/log2(N). It follows that COST 1 alone is what bounds the lane, and that an
    efficiently computable non-constant H-invariant on the ENCODING for h of order N^{1/3} would give
    a total of N^{1/3} with O(1) memory. Whether such an invariant exists is OPEN and is NOT claimed
    here in either direction; the generic-group bound does not forbid it because such an invariant is
    non-generic by construction.
  mechanism: >-
    On a prime-order G every endomorphism acts as a scalar and Z is contained in every endomorphism
    ring, so the image of the full endomorphism action on G is all of Z/N. The orbit of any nonzero
    point under that action is therefore the whole of G minus the identity, and the quotient has
    exactly two classes - a walk on it carries zero bits about the discrete logarithm and no collision
    in it is a relation. Below that degenerate top, the available equivalences are indexed by
    subgroups H of (Z/N)^* acting by A ~ [c]A; since N is prime, orbits are free of size h = |H| and
    the class count is (N-1)/h + 1. Realisability is a real constraint often missed - to quotient by H
    one must be able to APPLY its elements, and the cheaply applicable ones are exactly the
    F_p-rational endomorphisms, which for a generic curve are the scalars (about log2(N) group
    operations each) plus negation (free). Free canonicalisation therefore stops at h = 6. The cost
    separation is the substantive content - canonicalisation requires a canonical orbit element at
    EVERY step, which by enumeration costs h evaluations per step against a gain of sqrt(h), giving a
    charged ratio of 1/sqrt(h) <= 1, whereas disambiguation resolves an unknown c in H only ONCE per
    candidate collision at h log2(N) group operations. If canonicalisation were free at h = N^alpha,
    the walk would cost N^{(1-alpha)/2} and disambiguation N^alpha, balanced at alpha = 1/3 for a
    total of N^{1/3}. That balance is a CONDITIONAL DERIVATION with an unmet prerequisite and is the
    value of an open rung, never an achieved or achievable complexity.
  assumptions:
  - >-
    N is prime, so scalars other than 1 fix no nonzero point, orbits are free and equal-sized, and
    lambda - 1 is invertible. Over composite N the whole analysis changes and nothing here transfers.
  - >-
    p > 3 and the automorphism group is taken over F_p, so it has order at most 6. Over extension
    fields, subfield curves and Koblitz curves the available maps are larger and the free-canon top is
    higher; those cases are OUT OF SCOPE and the bound is not universal.
  - >-
    The candidate-invariant failures enumerated in the parent proposal are NOT exhaustive. Stated as an
    assumption because treating it as a theorem would be premature closure, and because the main
    forward-looking claim depends on the question being genuinely open.
  - >-
    The alpha = 1/3 balance assumes the disambiguation cost is paid once per candidate collision and
    that the number of candidate collisions is O(1) in a distinguished-point run. If a quotient produces
    many spurious collisions the balance shifts and alpha falls; the calculation is indicative of the
    SHAPE of the payoff, not a complexity claim.
  - >-
    The generic-group lower bound holds, which is what makes the consistency argument in the mechanism
    necessary rather than optional.
  proof_search_map:
    bottleneck: >-
      COST 1, the per-step canonicalisation. The two-threshold analysis exists to identify it, and it is
      the exact step whose removal changes an exponent rather than a constant. Nothing else in the lane
      is a bottleneck in that sense.
    baseline_embedding:
      parameter_slice: >-
        h = 2, H = {+1, -1}, the negation walk, which must reproduce 1.2533 sqrt(N/2) = 0.886 sqrt(N),
        this program's frozen baseline convention.
      reproduction_check: >-
        Symbolic - sqrt(pi/2)/sqrt(2) = sqrt(pi)/2 = 0.8862269, compared digit for digit against the
        0.886 convention and the value 0.8862269254527579 recorded as the negation constant in the staged
        artifact. Plus an enumerative check at toy size that the h = 2 quotient has (N-1)/2 + 1 classes.
    observation_collision:
      observable: >-
        The pair (h, achieved charged speedup).
      distinct_preimage_search: >-
        A real collision exists and is reported - h = 4 with free canon (gain 2) and h = 16 with a canon
        costing 2 evaluations per step (gain 4/2 = 2) have IDENTICAL charged gain from two very different
        quotients. The separating observable is the DISAMBIGUATION cost h per collision, which differs by a
        factor 4, and it is reported alongside because a ladder ranking rungs by charged step cost alone
        would call these equivalent when their collision-side behaviour differs.
    constructive_transforms:
    - transform: boundary_lift
      proposed_object: >-
        Enlarge the certificate family from "H is a group of automorphisms of E" to "H is any subgroup of
        (Z/N)^* admitting an efficiently computable invariant", and ask for a strict inward improvement -
        a rung with h > 6 and free canon - rather than mere feasibility.
      predicted_gain: >-
        sqrt(h). At h = N^{1/3} the total becomes N^{1/3}, an exponent move. This is where the lane's whole
        remaining value sits and it is stated WITH its prerequisite unmet.
    - transform: representation_reduction
      proposed_object: >-
        Move "is there a cheap canonicalisation" from the group into the function field - does there exist a
        low-degree rational function on E invariant under the scalar action on points, evaluable from the
        x-coordinate alone, non-constant, and computable without knowing the orbit?
      predicted_gain: >-
        Reformulates the open rung as a concrete question about invariant rational functions, which is
        answerable in principle - and whose likely answer is negative, since the scalar action is not a
        morphism of E, which is itself the sharpest available heuristic AGAINST the rung and is recorded here
        as such rather than suppressed.
    quantifier_order: >-
      CLOSURE CLAIMED - FOR ALL prime-order G and FOR ALL H <= (Z/N)^* with |H| = h, quotienting by H yields
      (N-1)/h + 1 classes, and at h = N-1 exactly 2, carrying zero information about the discrete logarithm.
      COST CLAIM - FOR ALL H whose canonicalisation is by enumeration, the charged gain is 1/sqrt(h) <= 1.
      NOT CLAIMED, EXPLICITLY - FOR ALL H THERE IS NO cheap invariant. Only that the enumerated candidates
      fail; the general question is OPEN. Getting this quantifier wrong in the permissive direction would turn
      a legitimate open problem into a fabricated closure, which is the single most likely way this record
      could do harm.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The full-ring quotient is trivial; the free-canon ladder tops out at h = 6 over F_p; enumerative canon
        is a strict loss; and relieving the canonicalisation cost at h = N^{1/3} would give N^{1/3} total." It
        can NEVER certify that no cheap invariant exists, and any summary reading it that way is wrong.
      nearby_object_control: >-
        Koblitz and subfield curves and the extension-field case, where Frobenius supplies cheaply computable
        maps of larger order and the corresponding speedups exceed sqrt(6). The argument MUST fail to bound
        those, and it does, because the order-6 bound is specific to the endomorphism ring being an imaginary
        quadratic order over F_p. That contrast is the strongest available evidence that the open rung is a
        genuine question about F_p rather than a category error.
    proof_obligations:
    - claim: The full endomorphism action on prime-order G has image all of Z/N.
      responsibility: correctness
    - claim: Its quotient has exactly 2 classes and carries zero information.
      responsibility: correctness
    - claim: Scalar orbits are free of size ord(lambda) for N prime.
      responsibility: correctness
    - claim: Enumerative canon gives charged gain 1/sqrt(h).
      responsibility: runtime
    - claim: Disambiguation costs h per collision, not per step.
      responsibility: runtime
    - claim: Balancing gives alpha = 1/3 and total N^{1/3}.
      responsibility: size
    - claim: An encoding-dependent orbit-label oracle is not generic-group simulable.
      responsibility: interface
    - claim: The h = 2 rung reproduces the 0.886 baseline convention.
      responsibility: baseline
    - claim: The non-existence of a cheap invariant is NOT claimed.
      responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: ECDLP on a prime-order subgroup of an elliptic curve over a prime field
    prior_best: 0.886 sqrt(N) group operations with O(1) memory per processor plus a distinguished-point table
    time_exponent: >-
      1/2 for every REALISABLE rung, i.e. unchanged, with constant 1.2533/sqrt(h) and h <= 6 over F_p.
      CONDITIONALLY, if free canonicalisation existed at h = N^alpha, the total would be
      N^{max((1-alpha)/2, alpha)}, minimised at alpha = 1/3 giving N^{1/3}. THAT SECOND SENTENCE IS
      CONDITIONAL ON AN UNMET PREREQUISITE AND IS NOT A CLAIM.
    memory_exponent: >-
      O(1) per processor plus the distinguished-point table, for every rung including the hypothetical one.
    hidden_cofactor: >-
      The conditional N^{1/3} hides its entire content in the phrase "if canonicalisation were free", which is
      the unmet prerequisite, and additionally assumes O(1) candidate collisions in a distinguished-point run.
      Neither may be dropped in any downstream citation.
    claim_kind: constant_factor
  heuristic_assumptions:
  - id: HEUR-EWALK-29C-1
    formal_statement: >-
      NO GENERIC-GROUP SIMULATOR EXISTS for an oracle that returns a label constant on scalar-subgroup orbits
      and computable from a single point ENCODING. In the generic group model the encodings are random labels,
      so a function of one label constant on orbits would have to encode knowledge of the orbit structure,
      which a generic algorithm does not have; the only generic route is to compute the h orbit elements, at
      cost h.
    random_model_justification: >-
      The random-labelling model of the generic group. The heuristic step is the passage from "a generic
      algorithm has no orbit knowledge" to "therefore no simulator exists", which is an argument sketch rather
      than a simulator-exclusion proof and is FLAGGED as requiring independent audit.
    supporting_results: []
    validation_experiment_ids:
    - EXP-EWALK-36ab1f
    falsification_condition: >-
      An explicit generic-group simulator for the encoding-dependent orbit-label oracle. The open rung is then
      CLOSED and the lane finishes - which this record names as the most valuable possible refutation of itself
      and the cheapest decisive action available.
  - id: HEUR-EWALK-29C-2
    formal_statement: >-
      The number of candidate collisions in a distinguished-point run on the quotient is O(1), so the
      disambiguation cost is paid a constant number of times and enters the balance as h rather than as h times
      a growing count.
    random_model_justification: >-
      The standard model of a distinguished-point walk, where a collision is detected once and resolved once.
      A quotient that generates many spurious class collisions would break it, and the possibility is recorded
      rather than assumed away.
    supporting_results: []
    validation_experiment_ids:
    - EXP-EWALK-36ab1f
    falsification_condition: >-
      A measured spurious-collision count growing with h or with N at toy scale. The alpha = 1/3 balance shifts
      downward and the conditional payoff shrinks with it.
  structural_ingredients:
  - description: >-
      Every endomorphism acts as a scalar on a prime-order subgroup, and Z is contained in every endomorphism
      ring.
    citation: H-ENDO-001
    provenance: internal
    verified_by: >-
      Enumeration at toy size in this experiment - the full-scalar quotient must have exactly 2 classes.
    role: the fact that makes the top of the ladder degenerate
  - description: >-
      The generic-group lower bound of order sqrt(N) for the discrete logarithm.
    citation: KN-TECH-005
    provenance: recalled
    verified_by: null
    role: the bound the conditional payoff must be shown consistent with, via non-genericity
  - description: >-
      The frozen baseline convention of 0.886 sqrt(N) for parallel rho with distinguished points and negation.
    citation: KN-TECH-006
    provenance: kb
    verified_by: >-
      Reproduced digit for digit by the h = 2 rung as this hypothesis's baseline obligation.
    role: baseline the ladder must reproduce at h = 2
  - description: >-
      The orbit-sum degeneracy - the sum of a scalar orbit is the point at infinity, since the geometric series
      collapses and lambda - 1 is invertible.
    citation: KN-FIND-009
    provenance: internal
    verified_by: EV-ENDO-001
    role: one closed canonicalisation route, already instantiated at h = 3 on a real curve
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
  - metric: Number of classes under the full endomorphism-action quotient, by direct enumeration at toy size
    direction: different
    minimum_effect: >-
      EXACTLY 2 on every prime-order instance. A single toy instance with more than 2 falsifies the top-of-ladder
      closure and would mean the scalar image is not all of Z/N.
  - metric: Orbit size and freeness for a scalar lambda of multiplicative order h
    direction: different
    minimum_effect: >-
      EXACTLY ord(lambda), with orbits partitioning G minus the identity evenly and no nonzero fixed point. Any
      deviation makes every class count in the ladder wrong.
  - metric: Orbit sum over a scalar orbit
    direction: different
    minimum_effect: >-
      The point at infinity, for every point and every lambda of order above 1. One counterexample refutes that
      canonicalisation route's closure.
  - metric: >-
      Charged gain of an enumeratively canonicalised scalar quotient, measured from instrumented group-operation
      counters as h varies
    direction: lower
    minimum_effect: >-
      1/sqrt(h), decaying monotonically, below 1 for every h >= 2 and below 0.5 by h = 4. A measured gain that does
      not decay with h is the artifact tell and means the cost model is not charging canonicalisation.
  - metric: Measured constant of the h = 2 negation walk against the frozen 0.886 convention
    direction: different
    minimum_effect: >-
      Agreement to three decimal places. Failure means the ladder's arithmetic is wrong and every rung is void.
  - metric: Measured charged gain on a subfield or Koblitz curve where a cheap large-order map exists
    direction: higher
    minimum_effect: >-
      STRICTLY ABOVE sqrt(6). The argument MUST fail to bound this nearby object; an analysis that also bounds it
      proves too much and is void.
  - metric: Spurious candidate-collision count in a distinguished-point run on the quotient, as h varies
    direction: different
    minimum_effect: >-
      O(1) in h and in N at toy scale. Growth with h shifts the alpha = 1/3 balance downward and the conditional
      payoff with it.
  - metric: Existence of a generic-group simulator for an encoding-dependent orbit-label oracle
    direction: different
    minimum_effect: >-
      This hypothesis predicts NONE EXISTS and flags the prediction for independent audit. A simulator would CLOSE
      the rung and finish the lane, which makes finding one the highest-value cheap action available and is why the
      prediction is stated in falsifiable form rather than assumed.
  test_boundary:
    instances: >-
      Toy elliptic curves over prime fields with prime subgroup order, small enough that the full group can be
      enumerated and every class count checked exactly. Plus one subfield or Koblitz curve as the nearby-object
      control where the conclusion must FAIL. The primary deliverable is a written ladder with derivations; the
      toy checks are known-answer verifications of one-line predictions, not an experiment in their own right.
    parameters:
      ladder_rungs:
      - h = 1, no quotient, baseline 1.2533 sqrt(N)
      - h = 2, negation, canon free, gain sqrt(2), available on every curve
      - h = 4, requires j = 1728 and p = 1 mod 4, canon free, gain 2
      - h = 6, requires j = 0 and p = 1 mod 3, canon free, gain sqrt(6)
      - 6 < h < N, the open rung, canon by enumeration costs h per step
      - h = N-1, the full scalar action, exactly 2 classes and zero information
      toy_group_orders: prime, small enough for exhaustive enumeration of G
      instrumented_counters: group operations per step, per canonicalisation, and per collision resolution, counted separately
    implementation: >-
      Exhaustive enumeration on toy curves for the class counts and orbit structure; an instrumented walk with
      SEPARATE counters for step operations, canonicalisation operations and collision-resolution operations, so
      the two costs are never pooled. Pure Python; no algebra system required.
    budget:
      wall_clock_seconds_per_run: 1800
      total_cpu_hours: 1.0
      maximum_runs: 10
  falsification_conditions:
  - >-
    A prime-order instance whose full-endomorphism quotient has more than 2 classes. The top-of-ladder closure is
    false.
  - >-
    A scalar orbit of size other than ord(lambda), or one fixing a nonzero point. The freeness argument is false and
    every class count in the ladder is wrong.
  - >-
    A counterexample to the orbit-sum identity. That canonicalisation route's closure is false.
  - >-
    A measured charged gain that does not decay as 1/sqrt(h) under enumerative canon. The cost model is not charging
    canonicalisation and the two-threshold separation is unsupported.
  - >-
    The h = 2 rung failing to reproduce the 0.886 convention. The ladder's arithmetic is wrong and every rung is void.
  - >-
    The argument, as written, also bounding the subfield or Koblitz nearby object. It proves too much and is void.
  - >-
    A generic-group simulator for the encoding-dependent orbit-label oracle. HEUR-EWALK-29C-1 is false, the open rung
    is CLOSED, and the lane finishes - the most valuable possible refutation of this record.
  - >-
    An efficiently computable non-constant scalar-orbit invariant on the encoding for h far above 6. The conditional
    prerequisite is met, the sqrt(6) ceiling is void, and the result requires independent review at the highest
    available tier before any description.
  interpretation_limits:
  - >-
    ANY MEASURED EXCESS OVER sqrt(|Aut|) IS A SUSPECTED INSTRUMENT ARTIFACT UNTIL A NULL CONTROL SAYS OTHERWISE. This
    applies with particular force here - a claimed cheap invariant would manifest exactly as such an excess, and the
    correct first response is a matched-seed null and the enumeration instrument, not excitement.
  - >-
    THE N^{1/3} FIGURE IS CONDITIONAL ON AN OBJECT NOT KNOWN TO EXIST. It is the value of an open rung, not a
    complexity claim, not an algorithm, and not a target this record proposes to pursue. It is written down so the
    rung is not silently closed.
  - >-
    The closures are scoped to prime-order subgroups over prime fields with p > 3. Extension fields, subfield curves,
    composite orders and supersingular curves over quadratic extensions are all outside and behave differently.
  - >-
    The candidate-invariant failures are NOT an exhaustive enumeration, and this is stated as an assumption rather
    than a theorem. A count of failed candidates is a fatigue report, and this record avoids that by giving the
    ladder, the thresholds and the payoff instead.
  - >-
    Nothing here moves a hypothesis status, closes a goal, or constitutes an attack. The lane's endomorphism-resource
    part is bounded; its encoding-resource hand-off is open.
  distinguishable_outcomes:
  - outcome: >-
      Every toy enumeration check passes exactly - 2 classes at the top, free orbits of size ord(lambda), orbit sum at
      infinity, (N-1)/2 + 1 classes at h = 2 - the measured charged gain decays as 1/sqrt(h), the h = 2 rung reproduces
      0.886, and the subfield nearby object is NOT bounded.
    means: >-
      The ladder, the two-threshold cost separation and the conditional payoff stand as written at the tested scope.
      The lane's endomorphism-resource part is bounded at sqrt(6) with its obstruction named as COST 1 alone, and the
      one live question is correctly relabelled as an encoding-resource question and handed on with its payoff attached.
  - outcome: >-
      The measured charged gain does NOT decay as 1/sqrt(h) under enumerative canon.
    means: >-
      The two-threshold separation - the record's main contribution - is unsupported by the instrument. Either the
      canonicalisation cost is not being charged, which is an instrument defect, or the cost model is wrong. The
      instrument must be checked first, and if it is sound the cost claim is a genuine negative.
  - outcome: >-
      The argument as written also bounds the subfield or Koblitz nearby object.
    means: >-
      PROVES TOO MUCH. On subfield curves cheap large-order maps DO exist and the corresponding speedups are classical,
      so an argument bounding them is void. This is the design's proves-too-much control and its failure invalidates
      the ladder's reasoning rather than merely its numbers.
  - outcome: >-
      A generic-group simulator for the encoding-dependent orbit-label oracle is exhibited.
    means: >-
      The open rung is CLOSED. HEUR-EWALK-29C-1 is falsified, the lane finishes with a genuinely strong obstruction
      rather than a cost argument, and this record has been refuted in the most useful available way. It costs no
      compute and is therefore the highest-value action the design points at.
  - outcome: >-
      The spurious candidate-collision count grows with h at toy scale.
    means: >-
      HEUR-EWALK-29C-2 is falsified. The alpha = 1/3 balance shifts downward, the conditional payoff shrinks, and any
      future citation of N^{1/3} must carry the measured collision growth with it.
  - outcome: >-
      Any toy enumeration check fails - class count, orbit freeness, orbit sum, or the 0.886 reproduction.
    means: >-
      The ladder's arithmetic or the instrument is wrong. Infrastructure signal where it is an implementation fault; a
      genuine refutation of the corresponding closure where it is not. The two are separated by re-running the check on
      a second toy curve before any interpretation.
