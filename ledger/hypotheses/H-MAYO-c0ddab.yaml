hypothesis:
  id: H-MAYO-c0ddab
  question_id: RQ-MAYO-001

  statement: >-
    IMPLEMENTATION CLASS, FILED SEPARATELY FROM THE MAP-CLASS HYPOTHESIS
    H-MAYO-2c6c34, per GOAL-MAYO-001's next_action: a result here is NEVER a
    break of the mathematics and may never be scored as one.
    SCOPE: toy MAYO-shaped instances over F_16 built in-repo; claim tier toy for
    every measurement and derivation for the count. NO CLAIM ABOUT ANY DEPLOYED
    IMPLEMENTATION, NO FAULT INJECTION PERFORMED, NO ASSERTION THAT ANY REAL
    SYSTEM CAN BE MADE TO REPEAT A VINEGAR.
    THE HYPOTHESIS. Because a MAYO signature is s = v + x with v the vinegar and
    x in the whipped oil space O^k, two signatures produced under the SAME
    vinegar differ by an element of O^k, so each of the k blocks of the
    difference lies in the underlying oil space O. Therefore (i) the
    accumulated span of block projections over N signatures sharing one vinegar
    has dimension EXACTLY min(k (N - 1), o); (ii) full oil-space recovery
    succeeds at N* = 1 + ceil(o / k) signatures, which is TWO whenever k >= o;
    (iii) with only j of the k vinegar blocks shared, the count becomes
    N*(j) = 1 + ceil(o / j), monotone in j; and (iv) with NO shared vinegar the
    recovered oil dimension is EXACTLY 0. The recovered space is validated by a
    certificate that a verifier recomputes independently -- annihilation of the
    public map, and, as the stronger and preferred certificate, a fresh forged
    signature that the ordinary verification routine accepts.
    THE DELIVERABLE is a number, not a warning: it converts the qualitative
    relayed statement 'fixing the vinegar seed recovers the key' into a bound on
    what MAYO's randomness discipline must guarantee, namely that a SINGLE
    repetition is already sufficient at three of the four recalled parameter
    sets.

  mechanism: >-
    DERIVED IN-REPO. NO MAYO SPECIFICATION HAS BEEN READ BY THIS SESSION; the
    signing structure below is RECALLED, UNVERIFIED and is the experiment's
    Stage 0 reading task. The algebra is unconditional given that structure.

    SIGNING (RECALLED, UNVERIFIED). To sign a digest t in F_q^m, the signer
    samples a vinegar v = (v_1,...,v_k) in (F_q^n)^k expanded from a seed and
    solves for x in O^k. Since P* vanishes on O^k,
      P*(v + x) = P*(v) + P*'(v, x) + P*(x) = P*(v) + P*'(v, x),
    so the signing equation P*'(v, x) = t - P*(v) is LINEAR in x with k o
    unknowns and m equations. k o >= m is exactly why MAYO whips: the underlying
    map offers only o < m unknowns and cannot sign. The published signature is
    s = v + x (plus a salt).

    THE DIFFERENCE IDENTITY (DERIVED, ONE LINE, AND IT USES NOTHING ELSE). For
    two signatures s = v + x and s' = v + x' under the SAME v,
      s - s' = x - x' in O^k,
    because O^k is an F_q-subspace. Hence every block pi_i(s - s') lies in O.
    One repeated-vinegar PAIR therefore yields k vectors of the o-dimensional
    secret oil space. Note what is NOT used: the digests may differ arbitrarily,
    the solver's particular-solution rule is irrelevant, no arithmetic fault is
    required, and no property of the emulsifier or of P beyond 'O^k is the oil
    space' enters. That is why the count is small.

    THE FORCED COUNT (DERIVED, MODULO ONE NAMED HEURISTIC). From N signatures
    sharing one vinegar, take the N - 1 differences against the first and
    collect their k (N - 1) block projections, all in O. Under HEUR-MAYO-VIN-1
    (spanning genericity) the accumulated span has dimension min(k (N - 1), o),
    so it reaches O as soon as k (N - 1) >= o, i.e.
      N >= N* = 1 + ceil(o / k).
    Under the RECALLED parameter sets (k, o) = (9, 8), (4, 18), (11, 10),
    (12, 12) this gives N* = 2, 6, 2, 2. The exact success probability at j
    vectors is the q-binomial spanning probability
      prod_{i=0}^{o-1} (1 - q^{i - j}),
    TO BE RECOMPUTED IN THE EXPERIMENT AND NOT QUOTED FROM THIS RECORD.

    PARTIAL REUSE (DERIVED). If only j of the k vinegar blocks are shared, then
    for a shared index i the block difference is pi_i(x - x') in O, while for an
    unshared index it contains a vinegar difference and is NOT in O -- and
    membership in O is DIRECTLY TESTABLE against the public map, so the attacker
    does not need to know which blocks were shared: the test sorts them.
    Yield per pair is j, and N*(j) = 1 + ceil(o / j), diverging as j -> 0. The
    j = 0 endpoint IS the matched null and its forced value is 0 recovered
    dimension.

    FROM O TO SIGNING CAPABILITY (DERIVED, WITH ITS LIMIT). Knowledge of O
    suffices to construct the signing linear system from the public map alone,
    so the strong certificate is a forged signature on a fresh challenge digest
    that the ordinary verification routine accepts. THE CLAIM IS 'RECOVERS O
    AND CAN SIGN', NOT 'RECOVERS THE SERIALISED PRIVATE KEY'; the byte-level key
    format is an implementation matter and is not claimed.

    THE SOLVER-DEPENDENCE THAT MUST BE MEASURED, NOT ASSUMED. If the signer
    picks its particular solution by a FIXED linear right-inverse L^+ of
    P*'(v, .)|_{O^k}, then x - x' = L^+(t - t') lies in the image of L^+, a
    subspace of O^k of dimension at most m -- still far more than o at the
    recalled parameters, so the RECOVERY conclusion is robust, but the
    DISTRIBUTION of the block projections is then not uniform and the spanning
    probability is a different number. If the signer randomises within the
    kernel, the projections are closer to uniform. Both rules are separate cells
    of the experiment for exactly this reason, and neither is assumed
    representative of the other.

  assumptions:
    - >-
      That a signature exposes s = v + x for all k blocks. RECALLED,
      UNVERIFIED. If the encoding compresses or omits blocks, the yield per
      pair falls from k to the number recoverable and N* rises; the formula's
      shape is unchanged.
    - >-
      That the whipped oil space is O^k and P* vanishes on it. Definitional
      given the whipped map's form.
    - >-
      THREAT MODEL, NOT TESTED: that an attacker can obtain two signatures under
      one vinegar. This program performs no fault injection and asserts nothing
      about the faultability of any real implementation. The conclusion is
      strictly conditional.
    - >-
      That the vinegar is not derived deterministically from the message in a
      way that makes repetition unreachable in the attacker's model. Stage 0
      settles this and it NARROWS THE SCOPE rather than voiding the algebra:
      deterministic derivation blocks accidental repetition while leaving
      induced repetition live.

  proof_search_map:
    bottleneck: >-
      The single step at which the secret enters the observable: the
      cancellation of the vinegar in the difference of two signatures. Every
      other part of the route (spanning, certification, forging) is routine
      linear algebra. If the vinegar does not cancel -- because the signature
      does not expose it additively, or because blocks are compressed -- there
      is no route at all and the hypothesis dies at Stage 0.
    baseline_embedding:
      parameter_slice: >-
        k = 1 with o >= m, i.e. plain UOV with a full-size oil space, where
        signature-difference leakage under nonce reuse is the classical and
        elementary statement. The whipped case at k > 1 must reduce to it at
        k = 1, and the forced count must become N* = 1 + ceil(o / 1) = o + 1,
        the plain-UOV value.
      reproduction_check: >-
        Symbolic (the difference identity at k = 1 is the classical statement)
        plus a frozen numeric fixture: build a plain-UOV toy instance, sign
        o + 1 messages under a fixed vinegar, and confirm the span reaches o at
        exactly that count and not before.
    observation_collision:
      observable: >-
        The dimension of the accumulated span of block projections, and the
        membership test P(pi_i(d)) = 0 for a block difference d.
      distinct_preimage_search: >-
        THE COLLISION TO HUNT, AND IT IS THE NULL: could a block difference from
        signatures with DIFFERENT vinegars pass the oil test by accident? Yes,
        with probability about q^{-m} per test (the map must land at zero in
        F_q^m), which at toy q = 16, m = 6 is 6e-8 and at real m = 64 is
        16^{-64}. So the observable separates the two ground-truth situations
        (shared vinegar / not shared) with a computable and negligible collision
        rate, and that rate is REPORTED rather than assumed. A second potential
        collision: a recovered isotropic subspace of dimension o that is not O.
        The forgery certificate is insensitive to it -- a signature that
        verifies is signing capability whatever the subspace is -- which is why
        forgery and not annihilation is the success criterion.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (recovered span dimension) fixed at 0 and vary the
          forgotten structure: fresh vinegar, j = 1 shared block, j = k shared
          blocks. The intrinsic invariant distinguishing them is the number of
          block projections passing the oil test.
        predicted_gain: >-
          Localises any failure to the reuse mechanism rather than to the
          recovery code, and makes the graded arm interpretable point by point.
    quantifier_order: >-
      CLAIMED: FOR ALL toy instances in the declared boundary, FOR ALL digest
      sequences, IF two signatures share a vinegar THEN their difference lies in
      O^k -- a universal statement with no witness and no instance-dependence,
      because it follows from subspace closure alone. The COUNT statement is
      weaker and is stated as such: FOR ALL instances, WITH PROBABILITY at least
      the q-binomial spanning probability over the digest and solver
      randomness, N* signatures suffice. The stronger reading (N* always
      suffices) is explicitly NOT claimed, and conflating them would overstate
      the result.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: a certified toy-scale oil-space recovery and forgery under a
        stated vinegar-reuse threat model, plus the derived count
        N* = 1 + ceil(o/k) as a derivation valid at any size. It CANNOT certify
        that any deployed MAYO implementation is attackable, cannot say anything
        about the hardness of the whipped map, cannot move any exponent, and
        cannot be cited as evidence about GOAL-MAYO-001's map-class question.
      nearby_object_control: >-
        THE FRESH-VINEGAR ARM is the nearby object where the hoped-for
        conclusion MUST FAIL: identical instance, identical digests, identical
        solver, identical recovery code, only the vinegar refreshed. Recovered
        oil dimension must be 0. A method that recovers oil there is recovering
        it through the harness and not through the mechanism, and every number
        in the study is then void. Second control, in the opposite direction:
        hand the certifier and forger the TRUE oil space, where success is
        obligatory -- separating 'the certifier works' from 'the leak works'.
    proof_obligations:
      - claim: "s - s' lies in O^k when the vinegar is shared."
        responsibility: correctness
      - claim: "The span of k(N-1) block projections has dimension min(k(N-1), o) with the stated q-binomial probability."
        responsibility: success_probability
      - claim: "k = 1 reproduces the classical plain-UOV nonce-reuse statement with N* = o + 1."
        responsibility: baseline
      - claim: "The false-positive rate of the oil membership test is about q^{-m}, computed not assumed."
        responsibility: strictness
      - claim: "The certificate verifier is independent of the recovery code and a forged signature is checked by the ordinary verification routine."
        responsibility: interface
      - claim: "Nothing transfers to deployed implementations, to fault feasibility, or to the map-class question."
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. No complexity claim. The route's cost given the
    signatures is one Gaussian elimination on at most k(N-1) vectors in F_q^n --
    polynomial and negligible. The quantity produced is a SIGNATURE COUNT on the
    data axis, not a time or memory exponent, and sota_delta is zero on time and
    memory. dominated_by is not applicable: the route requires an assumption the
    map-class attacks do not need and is therefore not comparable to them.

  heuristic_assumptions:
    - id: HEUR-MAYO-VIN-1
      formal_statement: >-
        The k(N-1) block projections behave, for spanning purposes, like
        independent uniform vectors of O, so their span has dimension
        min(k(N-1), o) with probability prod_{i=0}^{o-1}(1 - q^{i-j}) at
        j = k(N-1).
      random_model_justification: >-
        The oil corrections solve a linear system whose right-hand sides are
        essentially uniform digests, so their differences spread over the
        solution structure. THE ARGUMENT IS NOT AIRTIGHT AND THAT IS RECORDED:
        under a fixed linear right-inverse the differences lie in a subspace of
        dimension at most m, which is still much larger than o at the recalled
        parameters -- the recovery conclusion is robust, the distribution is not
        uniform, and the spanning probability is then a different number.
      supporting_results: []
      validation_experiment_ids: [EXP-MAYO-3d55ca]
      falsification_condition: >-
        Measured span dimension strictly below min(k(N-1), o) beyond the stated
        sampling tolerance at any N in the toy sweep. A solver whose corrections
        lie in a predictable proper subspace is itself a reportable finding and
        must be reported as one rather than absorbed as noise.
    - id: HEUR-MAYO-VIN-2
      formal_statement: >-
        A recovered subspace W of dimension o annihilating the public map is
        the oil space O (certificate soundness).
      random_model_justification: >-
        Expected for a random UOV-shaped instance, but a spurious totally
        isotropic subspace of the same dimension is possible in principle. The
        FORGERY certificate does not depend on this at all, which is why forgery
        is the declared success criterion and annihilation is the secondary
        check.
      supporting_results: []
      validation_experiment_ids: [EXP-MAYO-3d55ca]
      falsification_condition: >-
        A recovered W that annihilates the public map but from which no valid
        signature can be produced. That would be a real structural fact about
        the whipped map and would be routed to the map-class lane, not buried.

  structural_ingredients:
    - description: >-
        Linearity of the MAYO signing equation in the oil correction, from
        P*(v + x) = P*(v) + P*'(v, x) when P* vanishes on O^k.
      citation: >-
        DERIVED IN THIS RECORD from the whipped map's stated form. The form
        itself is RECALLED, UNVERIFIED; no MAYO document was read.
      role: makes the signature an additive vinegar-plus-oil decomposition
    - description: >-
        q-binomial spanning probability for j uniform vectors in F_q^o.
      citation: >-
        Elementary counting; to be RECOMPUTED in the experiment rather than
        quoted from this record.
      role: forced success probability at the recovery threshold
    - description: >-
        Reported fault attacks fixing or disturbing the MAYO vinegar seed, and a
        fault-assisted key-generation attack recovering the oil matrix.
      citation: >-
        NOT READ -- relayed by RQ-MAYO-001's motivation, which itself declares
        every per-scheme claim in it to be unverified secondary reporting. Used
        only to situate the class; no number is taken from it.
      role: prior art for the class, not for the count

  reduction_chain:
    core_problem: >-
      Determine the exact number of signatures under a repeated (or partially
      repeated) vinegar that suffices for certified oil-space recovery in a
      MAYO-shaped scheme.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. There is no reduction from this to any statement about
      the hardness of the whipped map, the underlying MQ problem, or any
      deployed system. GOAL-MAYO-001's next_action forbids scoring a result here
      as a break of the mathematics and every citation must carry that sentence.

  predictions:
    - metric: "V1: span dimension of accumulated block projections vs N, full vinegar reuse, toy parameters"
      direction: higher
      minimum_effect: "EXACTLY min(k(N-1), o) at every N. An exact integer staircase with a plateau at o."
    - metric: "V2: recovery success rate at N = N* = 1 + ceil(o/k) over >= 50 independent toy instances"
      direction: higher
      minimum_effect: >-
        At least the recomputed q-binomial spanning probability at j = k(N*-1),
        minus a declared sampling tolerance. Materially below it refutes
        HEUR-MAYO-VIN-1.
    - metric: "V3: forgery verification rate on fresh challenge digests using only the recovered W and the public key"
      direction: higher
      minimum_effect: "1.00 once W = O. This is the success criterion; annihilation alone is not."
    - metric: "V4 (matched null): recovered oil dimension with FRESH vinegar for every signature"
      direction: lower
      minimum_effect: >-
        EXACTLY 0, with every block projection failing the oil test except at
        the computed rate of about q^{-m} per test. A nonzero null recovery
        invalidates the entire study.
    - metric: "V5 (graded, >= 3 interior points): N*(j) for j shared vinegar blocks, j = 1..k"
      direction: lower
      minimum_effect: >-
        MONOTONE NON-INCREASING in j and equal to 1 + ceil(o/j) at every j. A
        flat graded arm means the shared-block count is not what drives the leak
        and the mechanism is misidentified.
    - metric: "V6 (baseline embedding): N* at k = 1 (plain-UOV shape)"
      direction: different
      minimum_effect: "EXACTLY o + 1, reproducing the classical nonce-reuse statement."
    - metric: "V7 (solver-rule cell): span dimension under a fixed linear right-inverse versus a kernel-randomised solver"
      direction: different
      minimum_effect: >-
        Both cells reported. Recovery must succeed in both; if the span
        dimensions differ, the difference is the measurement and must not be
        averaged away.

  test_boundary:
    instances:
      - >-
        Synthetic MAYO-shaped instances over F_16 built in-repo, with a planted
        oil space O of dimension o, k emulsifier matrices, and k o >= m so that
        signing is possible. Arms: full reuse, graded partial reuse (j = 1..k),
        fresh-vinegar null, planted-true-oil positive control.
      - >-
        Toy sizes only: m in {4, 6}, o in {2, 3}, k in {2, 3, 4}, n in {6, 8},
        chosen so k o >= m holds and both k >= o and k < o cases are covered
        (so that N* = 2 and N* > 2 both occur and the formula is tested, not
        just its easy branch).
      - >-
        Both signer particular-solution rules: fixed linear right-inverse, and
        uniform random solution of the affine system.
    parameters:
      q: 16
      characteristic: 2
      m_values: [4, 6]
      o_values: [2, 3]
      k_values: [2, 3, 4]
      n_values: [6, 8]
      N_sweep: [2, 3, 4, 5, 6, 8]
      shared_block_counts_j: [0, 1, 2, 3, 4]
      solver_rules: [fixed_right_inverse, kernel_randomised]
      instances_per_cell: 50
    implementation: >-
      Pure Python with hand-rolled GF(16) log/exp tables plus numpy 2.4.6 for
      arrays. VERIFIED IN THIS CONTAINER ON 2026-08-05: numpy 2.4.6 imports;
      sympy, galois and Sage are ABSENT. All rank, kernel and solve operations
      are exact over a 16-element field and require no computer-algebra system.
      The certificate verifier must be a SEPARATE code path from the recovery
      routine and must re-evaluate the public map from its stored coefficients.
    budget:
      stage0_wall_clock_seconds: 3600
      stage1_wall_clock_seconds: 1800
      stage2_wall_clock_seconds_ceiling: 3600
      stage2_maximum_memory_gb: 2
      note: >-
        Stage 2 is NOT authorized by this record; EXP-MAYO-3d55ca is status
        review_required with execution_authorized false.

  falsification_conditions:
    - >-
      F1 (ZERO COMPUTE): Stage 0 shows the signature does not expose s = v + x
      blockwise. The route dies as stated; report and stop.
    - >-
      F2: the null arm recovers any oil vector. The study is invalid and only
      the harness defect may be reported.
    - >-
      F3: the planted-true-oil positive control fails to certify or to forge.
      Instrument failure; no negative may be reported from any arm.
    - >-
      F4: the measured span dimension falls below the forced staircase.
      HEUR-MAYO-VIN-1 is refuted; report the measured law instead of the derived
      one.
    - >-
      F5: recovery succeeds at N < N*. The forced count is wrong in the
      direction that matters most for a security requirement, and the corrected
      count is the deliverable.
    - >-
      F6 (THE PLANNED NEGATIVE): everything confirms and the batch does NOT
      emit the randomness-discipline statement in a form GOAL-MAYO-001's second
      completion horn can consume -- the conditional requirement, its threat
      model, its scope, and what remains untested (deterministic vinegar
      derivation, countermeasures, real implementations). A confirmation without
      that statement HAS NOT FINISHED.

  interpretation_limits:
    - >-
      IMPLEMENTATION CLASS. This record may never be cited as evidence for or
      against any statement about MAYO's mathematical security, the whipping
      map, or the underlying MQ problem. That separation is a standing
      instruction of GOAL-MAYO-001, not a courtesy.
    - >-
      CLAIM TIER toy for every measurement. The difference identity is exact at
      all sizes and transfers as ALGEBRA; the measured rates do not transfer.
    - >-
      NO DEPLOYED SYSTEM IS ASSESSED. No fault is injected, no implementation is
      examined, and no claim is made that repetition is achievable in practice.
    - >-
      NO COUNTERMEASURE IS EVALUATED. Whether deterministic vinegar derivation
      or a fault-detection countermeasure closes the route is a separate
      question this record does not answer, and it is named as forward guidance.
    - >-
      The mechanism class is prior art (relayed, unread). The COUNT is what this
      record contributes, and any claim of novelty beyond the count would be
      unsupported.

