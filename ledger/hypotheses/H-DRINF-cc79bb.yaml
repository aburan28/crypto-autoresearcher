# H-DRINF-cc79bb — specified from IDEA-20261005-474802.
# Protocol approval is DEC-20261005-fe1718. This record asserts nothing
# about the kernel sizes. No root was counted in this design.
hypothesis:
  id: H-DRINF-cc79bb
  question_id: RQ-DRINF-6b5a9d
  source_proposal: IDEA-20261005-474802
  goal_id: null
  goal_id_note: >-
    ledger/questions/RQ-DRINF-6b5a9d.yaml does not name a goal. This design
    does not attach one and does not create a goal record.
  status: approved
  status_note: >-
    approved means the test protocol in EXP-DRINF-662e16 is approved for a
    later executor. It does not mean the kernel sizes are 9 and 3. Status
    moves only by DEC-20261005-fe1718 under the standing user authorization
    of 2026-09-06. No polynomial was factored in this design.
  proposed_by: coordinator
  conversion_note: >-
    The module laws, the predicted sizes 9 and 3, the Carlitz control, the
    derivative check, and the splitting-field warning are carried from
    IDEA-20261005-474802. The Coordinator added only the operational
    measurement: two independent root counts that must agree, the F_9
    count recorded and then forbidden as the primary metric, and the
    withdrawal rule when the degree-1 coefficient is 0. Those rules were
    fixed before any run.

  statement: >-
    TEST BOUNDARY. q = 3. tau is the map x |-> x^3. The rank-2 module is
    Phi_T = tau + tau^2, so the executor expands Phi_T(x) = x^3 + x^9 and
    Phi_{T+1}(x) = x + x^3 + x^9 by coefficient-wise addition with the
    identity. The rank-1 control is Psi_T = tau, so Psi_{T+1}(x) = x + x^3.
    The metric is the number of distinct roots in a splitting field over
    F_3. Roots already in F_9 are a confounder column, not the metric.
    No characteristic polynomial is computed. No ECDLP exponent is claimed.
    No prime other than q = 3 and no element other than T+1 is in scope.

    PRE-REGISTERED PREDICTION, fixed before any run. The rank-2 geometric
    kernel has size 9. The rank-1 geometric kernel has size 3. Both
    degree-1 coefficients are 1, and both formal derivatives are the
    constant polynomial 1. A size other than 9 on the rank-2 polynomial,
    or other than 3 on the rank-1 polynomial, while the degree-1
    coefficient is 1 and the derivative is the constant 1, is a negative.

    DISTINGUISHABLE OUTCOMES. (1) Both expanded polynomials match the
    expressions above, both derivatives are the constant 1, and the two
    root-count methods agree on 9 and on 3: the rank-difference reading
    on this one element. (2) Degree-1 coefficient 1, derivative the
    constant 1, and at least one agreed count different from its
    prediction: negative, the size claim fails on this element. (3)
    Degree-1 coefficient 0, or a derivative that is not the constant 1:
    the example is withdrawn as inseparable. That is inconclusive, not a
    negative. (4) The two root-count methods disagree, the runtime watch
    expires, or the executor reports the F_9 count as the primary metric:
    invalid, not evidence.

  mechanism: >-
    The additive group is the ambient object. Phi is a ring homomorphism
    from F_3[T] into additive polynomials, so Phi_{T+1} maps its kernel
    to itself. The projection that keeps only that kernel is lossy: the
    kernel is finite and the additive group is not. The elliptic
    mis-reading says every torsion module is a square, which would give
    the rank-1 control 9 roots as well. The control decides. A separable
    polynomial's distinct geometric roots are counted by listing them in
    a splitting field, not by reducing modulo x^9 - x.

  assumptions:
    - tau is the 3-power Frobenius x |-> x^3, and tau^2 is x |-> x^9.
    - At A-characteristic (T) the constant term of Phi_T is 0.
    - Phi_1 and Psi_1 are the identity polynomial x.
    - T+1 is not divisible by T, so the degree-1 coefficient is predicted to be 1.
    - The kernel is the set of distinct roots in a splitting field.

  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
    not_applicable_reason: >-
      This is a measurement of two kernel cardinalities at one prime of
      degree 1. It is not a proof, an asymptotic bound, a certificate
      family, a reduction, or a closure argument.

  asymptotic_claim:
    problem: none — no complexity improvement is claimed
    prior_best: unchanged; no ECDLP exponent is in scope
    time_exponent: unchanged
    memory_exponent: unchanged
    hidden_cofactor: none introduced
    claim_kind: not_applicable

  heuristic_assumptions:
    - id: HA-1
      formal_statement: >-
        For a = T+1, q = 3, and r in {1, 2}, a separable rank-r module
        of the shape frozen in this record has |Phi[a]| = q^{r deg a}.
        The sample is this one element. No transfer to larger degree is
        claimed.
      random_model_justification: >-
        A separable polynomial over a field has as many distinct roots
        in a splitting field as its degree. Separability here is the
        formal derivative equal to the constant 1. The identification of
        that count with the cardinality of a period lattice modulo a is
        Drinfeld 1974, provenance recalled, not opened, and is not used
        as support. KN-LIT-1515 states the elliptic analogy and the rank
        difference only at abstract level. This design session opened
        that markdown note and did not open the PDF, which is absent
        from this checkout.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        The degree-1 coefficient is 1, the formal derivative is the
        constant 1, the two root-count methods agree, and the agreed
        count is not 9 for the rank-2 polynomial or not 3 for the
        rank-1 polynomial.

  predictions:
    - metric: number of distinct geometric roots of the expanded rank-2 polynomial
      direction: different
      minimum_effect: 9
    - metric: number of distinct geometric roots of the expanded rank-1 polynomial
      direction: different
      minimum_effect: 3
    - metric: degree-1 coefficient of each expanded polynomial
      direction: different
      minimum_effect: 1

  test_boundary:
    instances:
      - id: rank2
        module: Phi_T = tau + tau^2
        predicted_polynomial: x + x^3 + x^9
        predicted_kernel_size: 9
      - id: rank1
        module: Psi_T = tau
        predicted_polynomial: x + x^3
        predicted_kernel_size: 3
        role: nearby_object_control
    parameters:
      q: 3
      element: T+1
      degree: 1
    implementation: >-
      Exact arithmetic in F_3[x] and in a splitting field built by
      adjoining irreducible factors. No floating point. No root was
      counted while specifying this record.
    budget:
      maximum_runs: 2
      note: >-
        One scientific execution of the two polynomials. maximum_runs 2
        allows one infrastructure retry under a new run id. The
        scientific objects are frozen at these two polynomials.

  falsification_conditions:
    - >-
      The rank-2 geometric kernel has size other than 9 while its
      degree-1 coefficient is 1 and its formal derivative is the
      constant 1, and the two count methods agree.
    - >-
      The rank-1 geometric kernel has size other than 3 while its
      degree-1 coefficient is 1 and its formal derivative is the
      constant 1, and the two count methods agree.
    - >-
      The degree-1 coefficient is 0, or the formal derivative is not the
      constant 1. The separability hypothesis failed and the example is
      withdrawn, not reinterpreted, and not scored as a negative.

  interpretation_limits:
    - One prime of degree 1. No statement about a period lattice in the completion at infinity beyond this finite shadow.
    - Anderson motives are not computed. Characteristic polynomials are not computed.
    - Not an attack claim. No ECDLP exponent is in scope.
    - Counting roots in F_9 is a different number. On F_9 one has x^9 = x, so the rank-2 polynomial collapses. That count is recorded and then ignored.

