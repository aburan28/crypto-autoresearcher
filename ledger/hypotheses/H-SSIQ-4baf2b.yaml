hypothesis:
  id: H-SSIQ-4baf2b
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  source_idea_ids:
    - IDEA-20261007-20ae4e
  added: '2026-10-10'
  status: approved
  proposed_by: coordinator
  title: >-
    Kernel-polynomial degree sum versus distinct codomain j for three
    prime degrees over characteristic 53
  statement: >-
    Let E be y^2 = x^3 + x + 6 over F_53 and let L be all outgoing
    separable isogenies from E with cyclic kernel of order ell in
    {3, 5, 7}, considered geometrically over an algebraic closure
    of F_53 and identified only when their kernels agree. For each
    isogeny, d is the degree of the monic polynomial of the distinct
    x-coordinates of its nonzero kernel points. Let S be the sum of
    these d and J the number of distinct codomain j-invariants in
    the same algebraic closure. The prediction from
    IDEA-20261007-20ae4e is S >= 4*max(1,J). A complete, valid
    census with S <= 3*max(1,J) is its concrete negative. A value
    strictly between those bounds is inconclusive for this claim.
  mechanism: >-
    A list of short outgoing isogenies may store a kernel polynomial
    for each entry even when several entries have the same codomain
    j-invariant. S prices the total kernel-polynomial degree, while
    J measures the number of distinct codomain labels. The ratio
    tests this one representation effect on one curve. The null
    curve y^2 = x^3 + 2x + 3 over F_53 is enumerated by the identical
    method and reported separately; it does not set the target's
    success threshold.
  assumptions:
    - >-
      Geometric means every cyclic subgroup of E[ell] over the
      algebraic closure, including subgroups whose isogeny is not
      defined over F_53. All codomain j values are compared in one
      exact algebraic closure; conjugates are distinct unless equal.
    - >-
      Isogenies are counted by outgoing cyclic kernel. Post-composing
      by an isomorphism does not add a row; a reverse or dual
      isogeny is not an outgoing row from E.
    - >-
      For ell in {3, 5, 7}, each kernel polynomial is monic and has
      degree (ell-1)/2. The enumerator must exhibit the kernels;
      substituting the ell+1 theorem for enumeration is invalid.
    - >-
      E and the null curve are nonsingular in characteristic 53;
      the specification requires this to be checked before scoring.
  proof_search_map:
    not_applicable_reason: >-
      This is a finite measurement of a list representation on two
      fixed curves. It proposes no theorem, asymptotic improvement,
      or closure of a research direction.
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        On the fixed target E over characteristic 53, after all
        geometric outgoing cyclic kernels of orders 3, 5, and 7
        are enumerated, their kernel-polynomial degree sum S is
        at least four times the number J of distinct codomain
        j-invariants, with max(1,J) used for an empty list.
      random_model_justification: >-
        This is a curve-specific collision prediction, not a
        uniform-random model or an assumption used to prove an
        algorithm. Equal codomain j values may arise from distinct
        kernels, but no theorem cited here forces the threshold 4.
      supporting_results: []
      validation_experiment_ids:
        - EXP-SSIQ-dcb6d6
      falsification_condition: >-
        With the full target and null censuses complete and all
        instrument controls passing, S <= 3*max(1,J) on the target.
        The strict interval above 3*max(1,J) and below 4*max(1,J)
        leaves this prediction inconclusive.
  structural_ingredients:
    - description: >-
        A separable isogeny with a given finite kernel is unique up
        to post-composition by an isomorphism, and a curve has
        ell+1 distinct geometric ell-isogenies for prime ell.
      citation: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
      provenance: retrieved
      verified_by: >-
        coordinator design session 2026-10-10 opened the archived
        paper, including its isogeny preliminaries at line 99
      role: completeness and duplicate controls for the finite census
  predictions:
    - metric: target_S_vs_4_times_max_1_J
      direction: higher
      minimum_effect: S >= 4*max(1,J) after a complete valid census
  test_boundary:
    instances:
      - y^2 = x^3 + x + 6 over F_53 as the target
      - y^2 = x^3 + 2x + 3 over F_53 as the null
    parameters:
      characteristic: 53
      prime_degrees: [3, 5, 7]
      kernel_scope: all geometric outgoing cyclic kernels
      expected_kernel_counts_by_degree: {3: 4, 5: 6, 7: 8}
    implementation: >-
      Enumerate kernels and exact codomains with Sage over an
      algebraic closure of F_53. Record a reconstructible exact
      kernel polynomial and codomain j for every row, the finite
      extension data used, and an independent completeness check.
      A separate checker recomputes S, J, and the reading row from
      the archived raw table.
    budget:
      enforcement: advisory
      maximum_runs: 1
      maximum_workers: 1
  falsification_conditions:
    - >-
      A complete valid target census gives S <= 3*max(1,J), with
      the same-shape null and every completeness control recorded.
  interpretation_limits:
    - >-
      A result on these two curves and three degrees does not give
      an exponent change, a cryptographic-size memory bound, or a
      statement about the paper's smoothness heuristic.
    - >-
      The null is a diagnostic comparison. Its S and J do not enter
      the target inequality.
    - >-
      A timeout, incomplete kernel census, failed kernel-degree
      check, or field-construction failure is an instrument or
      infrastructure failure, never a negative observation.
