  proposed_by: coordinator
  title: >-
    On a Stage-0-frozen list of ≥10 odd primes with ord_n(2)=n-1, Part-1
    usable_dimensions is empty under both census routes, a synthetic non-empty
    injection is rejected by a preregistered gate, and ≥1 control with
    ord_n(2)<n-1 yields a non-empty usable set — or the gate fails closed

  statement: >-
    SETTING. Part-1 census predicates from EXP-BINSTD-178742 /
    part1_surface.py: d=ord_n(2) by iteration and by divisor test; stable
    dimensions from Phi_n factorization over F_2; usable_dimensions =
    stable_dimensions \ {0,1,n-1,n}.

    CLAIM (instrument / observational). For every n in the Stage-0-frozen
    forced-negative list F (|F|≥10, each with ord_n(2)=n-1): both routes
    agree, usable_dimensions(n)=∅, AND the preregistered gate rejects a
    synthetic non-empty usable injection with a logged failure_signature;
    AND there exists at least one control n' in Stage-0-frozen positive list
    C (|C|≥3, each with ord_n'(2)<n'-1) with usable_dimensions(n')≠∅.
    Outcomes: E-GATE-HOLDS | E-GATE-FAILS | O-CONTROL-FAIL | O-IMPEDIMENT.

    TEST BOUNDARY. Stages 0-1 only. Stdlib arithmetic on frozen odd primes.
    No factor-base construction. No Semaev. No Part-2 ranks. NO break,
    exponent, deployed insecurity claim, or n≥131 transfer as a security
    conclusion (n=131 may appear only as a listed forced-negative arithmetic
    check, never as an attack).

    FALSIFICATION OF HEUR-BINSTD-11aa69-H1 (within boundary). Any frozen
    n∈F with nonempty usable_dimensions; OR synthetic injection accepted;
    OR every control in C also has empty usable — while a report still
    claims E-GATE-HOLDS. Budget / missing Stage-0 freeze is O-IMPEDIMENT,
    never negative mathematical evidence.

  mechanism: >-
    OBJECT FRAME. Representation R1: F_2-subspace dimensions stable under
    x↦x^2 on F_{2^n}, derived from d=ord_n(2). Operation set: Part-1 dual
    census routes + a preregistered emptiness gate with a synthetic
    non-empty injection null. Trichotomy: Class I structural gate.
    Lossy-projection: discarding the concrete subspace and retaining only
    the usable-dimension cardinality must still catch fake non-empty
    readouts. OFF-LIMITS: deployed FB builds; Semaev; Part-2 ranks;
    Magma/Sage/AUXIN/Bedrock.

  predictions:
    - metric: empty_usable_rate_on_ord_eq_n_minus_1
      direction: higher
      minimum_effect: '=1.0 on the frozen forced-negative list'
    - metric: synthetic_injection_catch_rate
      direction: higher
      minimum_effect: '=1.0 (gate fails closed)'
    - metric: positive_control_nonempty_count
      direction: higher
      minimum_effect: '≥1 control with usable_dimensions≠∅'

  test_boundary: >-
    Stages 0-1; stdlib Part-1 predicates; frozen odd-prime panels; no curve
    libs required; certificate.kind=none.

  falsification_criteria: >-
    Retuning the usable filter after Stage-1 outcomes; claiming deployed
    insecurity or break / exponent from empty usable sets; transferring
    toy gate rates to a security claim about n≥131 without a new contract.

  distinguishable_outcomes:
    - id: E-GATE-HOLDS
      meaning: >-
        All forced-negatives empty under both routes; injection rejected;
        ≥1 positive control nonempty; route agreement holds.
    - id: E-GATE-FAILS
      meaning: >-
        Controls/route agreement pass but HEUR-BINSTD-11aa69-H1 fails
        (nonempty forced-negative, accepted injection, or all positives empty).
    - id: O-CONTROL-FAIL
      meaning: >-
        Dual-route disagreement or positive-control panel malformed; gate
        bake-off void as instrument defect.
    - id: O-IMPEDIMENT
      meaning: >-
        Stage-0 freeze missing or infrastructure abort; never negative evidence.

  heuristic_assumptions:
    - id: HEUR-BINSTD-11aa69-H1
      formal_statement: >-
        FORALL odd primes n in the Stage-0-frozen list F with ord_n(2)=n-1:
        usable_dimensions(n)=∅ under both Part-1 routes; AND the synthetic
        non-empty injection gate fails closed; AND EXISTS at least one
        control n' in C with ord_n'(2)<n'-1 and usable_dimensions(n')≠∅.
      random_model_justification: >-
        Rigorous: when d=n-1, Phi_n is irreducible over F_2 so stable
        dimensions are only {0,1,n-1,n} and the contract's usable filter
        excludes those. Classical: cyclotomic factorization over F_2.
        The gate's false-positive rate under synthetic injection is the
        instrument property under test.
      supporting_results: []
      validation_experiment_ids:
        - EXP-BINSTD-27f623
      falsification_condition: >-
        Any frozen n with ord_n(2)=n-1 and non-empty usable set; OR
        synthetic injection accepted; OR all controls with ord<n-1 also
        empty (instrument collapse).

  proof_search_map:
    not_applicable_reason: >-
      Purely empirical / instrument hypothesis validating a structural gate
      at frozen odd primes; no theorem, asymptotic bound, or certificate
      family is claimed. Baseline reproduction is the Part-1 dual-route
      census already frozen under EXP-BINSTD-178742.

  interpretation_limits:
    - Gate calibration only; empty usable ≠ security claim about any curve.
    - No break; no exponent; no rho-competitiveness claim.
    - No factor-base construction at deployed size.

