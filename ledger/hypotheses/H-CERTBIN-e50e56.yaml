# H-CERTBIN-e50e56
# Half-fold memory identity vs the audit 16-byte pair column.
# Source: IDEA-20260930-77ec1c. Arithmetic only. No solver.
# Approval: DEC-20261003-61f2d6.
hypothesis:
  id: H-CERTBIN-e50e56
  question_id: RQ-CERTBIN-836ce2
  source_idea: IDEA-20260930-77ec1c
  experiment_id: EXP-CERTBIN-ec9d83
  specified_at: '2026-10-03'
  status: approved
  proposed_by: idea-generator
  approved_by_decision: DEC-20261003-61f2d6
  title: >-
    The audit pair column is the m=4 half-fold table, not an m>=5
    memory bound
  statement: >-
    Let k = floor(m/2). The generic claw that decides unordered
    m-multiset membership (repetition allowed) stores M_k =
    C(B+k-1, k) entries, not M_pair = B(B-1)/2. Define
    R_mem(m, B) = M_k / M_pair, at 16 bytes per entry. On the
    idea's printed 1% rows with B given, that identity is:
    m=4 degree 83 (B=872790) R_mem=1.000002; m=4 degree 131
    (B=3574951633) R_mem=1.000000; m=3 degree 83 (B=52544464)
    R_mem=3.806e-8; m=7 degree 83 (B=5325) R_mem=1776.33 with
    pair column 0.211 GiB and 3-fold table 375.2 GiB; m=7
    degree 131 (B=617668) R_mem=2.058907e5. Degree-131 m=3 is
    not printed with a B in the idea and is not evaluated.
    This is a memory identity, not a solver and not an exponent
    move. IDEA-20260930-14c753 (T_test) is a pointer only and
    is not designed here.
  mechanism: >-
    OBJECT: unordered k-fold multiset sums as table keys, with
    k = floor(m/2). The pair column of the audit is M_pair
    entries of 16 bytes. Operation set: store one half and
    enumerate the complementary half. The claim under test is
    the integer ratio R_mem, not a discrete-logarithm walk.
    Two arithmetic routes recompute C(B+k-1, k) and B(B-1)/2
    independently and must not import each other.
  assumptions:
    - >-
      Entries are unordered multisets with repetition, matching
      the audit ceiling. The pair column uses unordered pairs
      without repetition, B(B-1)/2.
    - >-
      A 16-byte entry is the audit's accounting width. R_mem is
      invariant to that width; GiB figures are not.
    - The identity does not depend on the curve law or on ord_m(2).
  proof_search_map:
    bottleneck: >-
      Reading the audit's last column as the memory of an m-sum
      membership test for every m.
    baseline_embedding:
      parameter_slice: >-
        Printed rows of IDEA-20260930-77ec1c with B given:
        (degree, m) in {(83,3), (83,4), (131,4), (83,7), (131,7)}.
        m=10 rows and degree-131 m=3 without printed B are out of
        this contract.
      reproduction_check: >-
        Recompute B(B-1)/2 * 16 / 2^30 and match the idea's
        degree-83 pair-GiB figures (20570462.6, 5675.6, 0.211)
        to three significant figures before any half-fold ratio
        is scored. Then recompute R_mem by two routes.
    observation_collision:
      observable: R_mem(m, B) versus the printed pair column
      distinct_preimage_search: >-
        At m=4 the two counts differ by the factor (B+1)/(B-1).
        At m=7 they differ by the printed ratio 1776.33 at
        degree 83. A pair-only count cannot equal the 3-fold
        count at that row.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Membership witness as a k-fold multiset plus a
          complementary multiset, instead of as a pair.
        predicted_gain: >-
          A correct memory figure at m=7. No time-exponent gain.
    quantifier_order: >-
      FOR ALL frozen rows with printed B, R_mem equals
      M_k / M_pair from the binomial coefficients.
    method_ceiling:
      strongest_certifiable_claim: >-
        The pair column equals the half-fold memory at m=4
        (printed R_mem) and understates it by the printed
        ratios at m=7. No ECDLP claim.
      nearby_object_control: >-
        At m=2 the half-fold table is the set of points and
        the pair column is a different object. This contract
        does not evaluate m=2. Degree-131 m=3 has no printed B
        and is not filled in.
    proof_obligations:
      - claim: M_k = C(B+k-1, k) counts unordered k-multisets with repetition
        responsibility: size
      - claim: M_pair = B(B-1)/2 is the unordered pair column
        responsibility: size
      - claim: the identity does not depend on the curve or on ord_m(2)
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-CERTBIN-e50e56-H1
      formal_statement: >-
        When C(B+m-1, m) <= r/64, a uniform random sum map has
        fibers of mean 1 + Theta(C/r), so a stored-M_k claw has
        branching b = 1. The memory identity M_k itself does not
        depend on this heuristic.
      random_model_justification: >-
        Occupancy for a random function into a set of size r, as
        named in IDEA-20260930-77ec1c H1. This experiment does not
        test uniqueness; it tests the integer identity.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
