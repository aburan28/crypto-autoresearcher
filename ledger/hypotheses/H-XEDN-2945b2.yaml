hypothesis:
  id: H-XEDN-2945b2
  question_id: RQ-XEDN-002
  statement: >-
    The Mordell-Weil relation coefficients measured by RQ-XEDN-002 and bounded at
    max_|coeff| = 1 by EV-XEDN-003 are the coefficients of GENERIC relations --
    integer vectors c with sum_i c_i P_i = O in E(F_p(t)), which by definition
    specialise to a relation at every smooth fibre and therefore carry no
    information about any particular fibre. For the complementary and disjoint
    class of FIBRE-SPECIFIC relations -- vectors c with
    sum_i c_i sigma_{t_0}(P_i) = O in E_{t_0}(F_p) but sum_i c_i P_i != O over
    F_p(t) -- the hypothesis asserts three things.
      (T1) They exist in abundance and are not bounded. For n free-x sections
           independent in the Mordell-Weil lattice, the kernel
           K_{t_0} = ker(Z^n -> E_{t_0}(F_p)) is a FULL-RANK sublattice of Z^n
           with determinant exactly M_{t_0} = |<sigma(P_1), ..., sigma(P_n)>|,
           and its shortest infinity-norm vector satisfies
           lambda_1^inf(K_{t_0}) ~ M_{t_0}^(1/n) / 2. Against the census's fitted
           slope of 0.0 vs log p for the generic class, this class has slope 1/n
           against log M, hence ~1/n against log p whenever M ~ p.
      (T2) Coefficient size is not a cost parameter. The search box
           {c : |c_i| <= lambda_1^inf} contains ~M integer points INDEPENDENTLY
           of n, because raising n shrinks the side exactly as fast as it adds
           dimensions. By AM-GM no split of a set of size M into two matched
           halves has both halves smaller than M^(1/2), so finding a
           fibre-specific relation without prior discrete logarithms costs
           Theta(M^(1/2)) time -- with M^(1/2) memory in meet-in-the-middle form
           or O(1) memory in the rho form -- regardless of n, of the degree
           window, and of the coefficient bound the completed goal measured.
      (T3) The exponent is carried by M, not by the coefficient bound. Since
           M <= N_{t_0} = #E_{t_0}(F_p) ~ p, the per-relation cost is at best
           p^(1/2), identical to Pollard rho and strictly worse once the lift is
           charged at the measured alpha = 3. A subfamily on which M ~ p^theta
           with theta < 1 would give p^(theta/2) and would be an exponent
           statement; the hypothesis does not assert such a subfamily exists, and
           predicts median M/N = 1, but identifies the measurement of the M/N
           distribution -- which appears nowhere in this corpus -- as the
           quantity that decides it.
    Falsification of any of T1-T3 is specified below, and the outcome the
    hypothesis most wants to see falsified is its own prediction that specialised
    sections behave like uniformly random points of the same subgroup.
    No status change to any existing record is proposed or implied.
  mechanism: >-
    SETUP. S -> P^1 the rational elliptic surface of y^2 = x^3 + a(t)x + b(t)
    over F_p(t) in the frozen EXP-XEDN-004 window (a != 0, deg a <= 2,
    deg b = 6, j non-constant, Delta not identically 0). P_1, ..., P_n free-x
    sections. For t_0 in F_p with Delta(t_0) != 0, E_{t_0} : y^2 = x^3 +
    a(t_0)x + b(t_0) is nonsingular over F_p with N_{t_0} = p + 1 - a_{t_0}
    points, and sigma_{t_0} : E(F_p(t)) -> E_{t_0}(F_p) evaluating a section at
    t_0 is a group homomorphism.

    THE TWO LATTICES. R = {c : sum c_i P_i = O over F_p(t)} and
    K_{t_0} = {c : sum c_i sigma_{t_0}(P_i) = O}. R is contained in K_{t_0} for
    every good t_0, and rank R = n - r' where r' = rank of the sublattice the
    P_i generate. The first isomorphism theorem gives
    Z^n / K_{t_0} isomorphic to <sigma(P_1), ..., sigma(P_n)>, so
    [Z^n : K_{t_0}] = M_{t_0} exactly. Because the target group is FINITE,
    K_{t_0} has full rank n for every good t_0 whatever r' is. Note the contrast
    with the number-field intuition: Silverman's specialisation theorem, which
    makes sigma injective for all but a thin set of t_0, is a statement over
    number fields and DOES NOT APPLY here -- a free group of rank up to 8 cannot
    inject into a group of order ~p. Getting that backwards would invert the
    whole hypothesis, so verifying the correct function-field statement is a
    required step.

    WHAT THE CENSUS MEASURED. EXP-XEDN-004 accepts a relation only after a
    group-law identity over F_p(t) plus specialisation to O at >= 20 distinct
    smooth fibres, and its per-surface records carry the field
    generic_relation_is_O with value true on every reported relation. That is
    exactly R. Its acceptance rule -- valid at 20 fibres simultaneously --
    structurally excludes the fibre-specific class, so the two classes were never
    in competition and the census's slope of 0 is a statement about R alone.

    T1 DERIVED. Take the P_i independent in the Mordell-Weil lattice, so R = 0
    and the census instrument reports no relation at all (its archived
    skip_reason no_relation_in_observed_span). K_{t_0} is then a full-rank
    sublattice of Z^n of determinant M. Minkowski's convex body theorem applied
    to the symmetric convex cube [-lambda, lambda]^n, of volume (2 lambda)^n,
    gives a nonzero lattice point once (2 lambda)^n >= 2^n det K, i.e. once
    lambda >= M^(1/n): an UNCONDITIONAL upper bound
    lambda_1^inf(K_{t_0}) <= M^(1/n). The matching lower bound, i.e. that
    lambda_1 is not much smaller, is the Gaussian heuristic for a random
    determinant-M sublattice and is numbered HEUR-XEDN-C1 rather than assumed.
    Hence log lambda_1^inf / log M -> 1/n, a positive slope, where the generic
    class gives 0.

    T2 DERIVED. The number of integer points in the box {|c_i| <= lambda} is
    (2 lambda + 1)^n. At lambda ~ M^(1/n)/2 this is ~M, independent of n: the
    dimension and the side length trade off exactly. So enlarging n buys smaller
    coefficients and buys nothing in search cost. Splitting the box into two sets
    A and B and matching sum_{A} against -sum_{B} succeeds only if |A| * |B| >= M
    (each of the M possible group values must be reachable), so by AM-GM
    |A| + |B| >= 2 M^(1/2): meet-in-the-middle costs M^(1/2) time and M^(1/2)
    memory, and the memoryless rho form costs M^(1/2) time with O(1) memory.
    This half of the mechanism uses no heuristic -- it is counting and AM-GM --
    which is why T2 carries a higher prior than T1.

    T3 AND WHERE AN EXPONENT COULD MOVE. M <= N ~ p, so the cost is at best
    p^(1/2), which is exactly Pollard rho on the same curve; and connecting the
    relation to an externally specified target requires lifting that target into
    the surface, at probability ~ (2 p^3)^-1 per the lane's own measured
    alpha = 3. So as a route this is dominated, and the hypothesis says so
    rather than dressing the trade as a gain. The only free parameter is M. Three
    concrete mechanisms would depress it, each checkable and none asserted:
    (M-a) E_{t_0}(F_p) non-cyclic, isomorphic to Z/n_1 x Z/n_2 with n_2 > 1, and
    the specialised sections lying in a single factor; (M-b) the specialised
    sections divisible, all lying in k * E_{t_0}(F_p), giving M <= N/k;
    (M-c) systematic collapse of the image at special fibres. If any of these is
    systematic on an identifiable subfamily, the per-relation cost falls to
    (N/k)^(1/2) and the object worth studying is the DISTRIBUTION OF SUBGROUP
    ORDERS ALONG A FIBRATION -- a different question from coefficient bounds, and
    the successor this hypothesis names.

    WHY THIS IS THE QUESTION JUST OUTSIDE THE COMPLETED BOUNDARY. GOAL-XEDN-001
    closed on max_|coeff| = 1 without mu_3. Its sibling goals GOAL-XEDN-002 and
    GOAL-XEDN-003 consumed the red team's named next control by widening the
    degree window (deg a <= 4; deg x <= 3 with deg b = 10) and reported the same
    bound. All four measured R. The class that was never measured is the one
    whose coefficients are forced to grow, and whose governing parameter has
    never been written down anywhere in this corpus.
  assumptions:
    - >-
      sigma_{t_0} is a group homomorphism on smooth fibres; fibres with
      Delta(t_0) = 0 are excluded and the exclusion is recorded.
    - >-
      Independence of the P_i in the Mordell-Weil lattice can be certified. The
      natural certificate is a nonsingular Shioda height Gram; the census's
      pseudo-Gram cannot supply one (see H-XEDN-fe3446), so the experiment must
      compute a real height Gram or certify independence by another route. This
      dependency between the two hypotheses is declared rather than hidden: if
      H-XEDN-fe3446's stage 1 refutes the recalled height theory, this
      hypothesis's independence certification must be redesigned.
    - >-
      Computing discrete logarithms at toy p in order to BUILD K_{t_0} is an
      instrument, not a cost model. Every cost statement in T2 and T3 is derived
      from the box volume, never from the instrument's runtime.
    - >-
      The archived generic_relation_is_O fields mean what they appear to mean --
      that the recorded relations hold identically over F_p(t). Confirmed by
      reading, to be re-confirmed as stage 0.
  proof_search_map:
    bottleneck: >-
      The exact bottleneck of any lifting-based relation source is the SEARCH FOR
      A FIBRE-SPECIFIC RELATION WITHOUT PRIOR DISCRETE LOGARITHMS, and its cost
      is the volume of the coefficient box that must contain one. Every other
      step -- enumerating sections, verifying identities, bounding generic
      coefficients -- is polynomial-time bookkeeping at these sizes. If the box
      volume is M regardless of n, then no choice of degree window, section
      shape, or coefficient bound changes the exponent, and the only quantity
      that can is M itself.
    baseline_embedding:
      parameter_slice: >-
        The best-known baseline to reproduce is Pollard rho on E_{t_0}(F_p): time
        ~sqrt(N), memory O(1). The parameter slice that reproduces it exactly is
        n = 1 with a single specialised section: the kernel K_{t_0} is then the
        ideal (ord(sigma(P_1))) in Z, lambda_1 = ord(sigma(P_1)) which is ~N, the
        box has ~N points, and meet-in-the-middle over it is BSGS at N^(1/2) --
        i.e. the mechanism degenerates to the incumbent exactly at n = 1. That
        degeneration is the embedding, and the claim under test is whether n > 1
        buys anything strictly inside it.
      reproduction_check: >-
        Symbolic plus a frozen fixture: at n = 1 the measured lambda_1 must equal
        the order of sigma(P_1) exactly, and the measured box volume must equal
        that order, at every tested (surface, fibre). If the instrument does not
        reproduce the n = 1 case on the nose, no comparison at n > 1 is
        meaningful. A cost curve that merely "looks like" sqrt(N) is not a
        reproduction.
    observation_collision:
      observable: >-
        The reported coefficient statistic of a Mordell-Weil relation --
        specifically max_|coeff| of the shortest relation among the observed
        sections, which is what RQ-XEDN-002 asks about and what four completed
        censuses measured.
      distinct_preimage_search: >-
        The collision is exhibited by construction and is the substance of the
        hypothesis: for one and the same (surface, section set), the observable
        takes the value 1 when the relation class is R and a value ~M^(1/n)
        when the class is K_{t_0} \ R. Two ground-truth objects -- "coefficients
        are absolutely bounded" and "coefficients grow like a positive power of
        p" -- are therefore BOTH consistent with the phrase "the shortest
        Mordell-Weil relation among the observed sections", one on each side of
        the conclusion RQ-XEDN-002 was set up to decide. The additional condition
        that separates them is a single word that RQ-XEDN-002 does not contain:
        whether the relation is required to hold identically over F_p(t). A
        second collision, on the null side: n specialised sections and n
        uniformly random points of the same subgroup produce the SAME predicted
        lambda_1, so the observable does not separate "surface" from "no
        surface" -- which is why the matched-random null is a required arm and
        not a decoration.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Build a problem-specific resource measure -- the coefficient box volume
          (2 lambda + 1)^n -- realise it by the specialisation map sigma_{t_0},
          and charge cost only over the provably disjoint halves of a
          meet-in-the-middle split. This is precisely the specialize-measure-pack
          transform: the measure is the box, the specialisation is sigma, and the
          disjointness is the A/B split whose AM-GM bound is proved rather than
          assumed.
        predicted_gain: >-
          None to the attacker, and that is the deliverable: a measure under
          which the n-dependence provably cancels, converting "raise the degree
          window to get more sections" from a research direction into a proved
          no-op for cost purposes. It also isolates M as the sole surviving
          parameter, which is the constructive part.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (lambda_1 and M) fixed and vary the forgotten
          structure: replace the specialised sections by uniformly random points
          generating a subgroup of the same order. The intrinsic invariant that
          could distinguish them is the joint distribution of the sections'
          images -- e.g. whether they lie in special position with respect to a
          subgroup filtration. If no such invariant is found, the surface
          contributes nothing beyond n group elements.
        predicted_gain: >-
          A measured ratio (section lambda_1 over random-point lambda_1) with a
          forced value of 1.0. A ratio below 0.8 would be a genuine
          surface-specific signal and is the outcome that would most raise the
          value of the whole lane.
    quantifier_order: >-
      RQ-XEDN-002's question, written out: DOES THERE EXIST a bound B such that
      FOR ALL p and FOR ALL surfaces in the family, the shortest Mordell-Weil
      relation among low-degree free-x sections has infinity norm <= B? The
      hypothesis's restatement makes the hidden quantifier explicit: FOR ALL p,
      FOR ALL surfaces, THERE EXISTS a bound B = 1 for relations required to hold
      FOR ALL smooth fibres; and FOR ALL p, FOR ALL surfaces, FOR ALL good fibres
      t_0, the shortest relation holding AT THAT ONE FIBRE has norm ~M^(1/n),
      which admits NO uniform bound as p grows. The quantifier trap being hunted
      is on the witness: the census's witness relation is not allowed to depend
      on t_0 -- it is verified at 20 fibres at once -- while any relation usable
      against a particular instance MUST depend on t_0. A conclusion whose
      witness is forbidden to depend on the instance cannot bound the witnesses
      that do.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most, the audit can certify: (a) that on the frozen family at toy p
        the fibre-specific relation lattice has determinant M and shortest vector
        consistent with M^(1/n); (b) that the coefficient box volume is M
        independent of n; (c) that meet-in-the-middle over it costs M^(1/2);
        and (d) a measured distribution of M/N at toy p. It CANNOT certify that
        no lifting-based relation source exists, cannot certify anything about
        number-field xedni, cannot close candidate B2, and cannot make any
        crypto-scale statement. In particular it may not be written up as
        establishing any sentence on DEC-20260724-021's forbidden list.
      nearby_object_control: >-
        The closest object where the hoped-for conclusion (that this is a
        relation source) is KNOWN to hold is index calculus over a finite field
        with a genuine factor base, where relations among factor-base elements
        are found at cost far below the group order because a smoothness test
        certifies a relation locally, without search over coefficient vectors.
        Applying the method's cost accounting to that object must reproduce its
        known subexponential behaviour; if the same accounting says index
        calculus over F_p^* also costs sqrt(N), the accounting is wrong and
        cannot be used to bound anything. Running that check is a required arm.
        The second nearby object, on the other side, is n uniformly random points
        with no surface -- where the conclusion must FAIL identically -- and the
        method must not distinguish it from the sections unless there is real
        structure.
    proof_obligations:
      - claim: "sigma_{t_0} is a homomorphism and the index [Z^n : K_{t_0}] equals M_{t_0} exactly."
        responsibility: correctness
      - claim: K_{t_0} has full rank n for every good t_0, and Silverman's number-field specialisation theorem does not apply.
        responsibility: baseline
      - claim: lambda_1^inf(K) <= M^(1/n) unconditionally (Minkowski on the cube).
        responsibility: size
      - claim: lambda_1^inf(K) ~ M^(1/n) (Gaussian heuristic, HEUR-XEDN-C1).
        responsibility: success_probability
      - claim: the box has ~M points independently of n.
        responsibility: correctness
      - claim: any two-set split has max part >= M^(1/2) by AM-GM; hence cost Theta(M^(1/2)).
        responsibility: runtime
      - claim: memory is M^(1/2) in MITM form and O(1) in rho form; both reported.
        responsibility: memory
      - claim: the cost accounting reproduces subexponential index calculus on the nearby object.
        responsibility: strictness
      - claim: the audit narrows a boundary and names a successor; it closes nothing.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: >-
      Per-relation cost of a function-field lifting relation source for ECDLP
      over F_p, measured at toy scale and derived asymptotically.
    prior_best: >-
      Pollard rho for ECDLP over F_p at time p^(1/2) with O(1) memory and O(1)
      data. No subexponential algorithm is known for prime-field ECDLP.
    time_exponent: >-
      1/2 in M, i.e. theta/2 in p when M ~ p^theta. Predicted theta = 1, giving
      exponent 1/2 -- IDENTICAL to the incumbent, i.e. NO IMPROVEMENT. The
      conditional statement, and it is conditional: theta = 2/3 would give 1/3.
    memory_exponent: >-
      1/2 in M for the meet-in-the-middle form; 0 for the memoryless rho form at
      the same time exponent. Both are stated, per
      docs/claims-and-verification.md's requirement that memory appear beside
      time.
    hidden_cofactor: >-
      The lift. Connecting these relations to an externally specified target
      requires lifting it into the surface at probability ~(2 p^3)^-1
      (EXP-XEDN-001, DEC-20260724-021, alpha = 3). That p^3 factor dominates
      everything above and is recorded here so the cost identity cannot be
      mistaken for an attack cost.
    claim_kind: constant_factor
  heuristic_assumptions:
    - id: HEUR-XEDN-C1
      formal_statement: >-
        For n free-x sections independent in the Mordell-Weil lattice of a
        surface in the frozen EXP-XEDN-004 family, and t_0 chosen uniformly among
        the good fibres in F_p, the kernel lattice
        K_{t_0} = ker(Z^n -> E_{t_0}(F_p)) behaves with respect to its shortest
        infinity-norm vector like a uniformly random full-rank sublattice of Z^n
        of determinant M_{t_0}: E[log lambda_1^inf(K_{t_0})] =
        (1/n) log M_{t_0} + O_n(1), the implied constant depending only on n.
        Quantifiers: for all n <= 8, for all surfaces in the frozen family, over
        the uniform choice of t_0.
      random_model_justification: >-
        K_{t_0} is determined by the n images sigma(P_i); if those behave like
        independent uniform elements of a group of order M then the kernel is a
        uniformly random index-M sublattice, for which the Gaussian heuristic is
        the standard model. The RIGOROUS HALF IS UNCONDITIONAL: Minkowski's
        convex body theorem on the cube gives lambda_1^inf <= M^(1/n) with no
        assumption at all. Only the matching lower bound is heuristic, and T2's
        cost conclusion does not use it.
      supporting_results: >-
        Minkowski's convex body theorem (rigorous upper bound) and the Gaussian
        heuristic for random lattices (classical, not a theorem in this setting).
        NEITHER IS CITED TO A SOURCE READ IN THIS SESSION; both are standard and
        both must be stated with a reference in the experiment's derivation
        stage, not taken from this record on trust.
      validation_experiment_ids: [EXP-XEDN-9bd3bd]
      falsification_condition: >-
        The measured mean of log lambda_1^inf / log M departs from 1/n by more
        than a factor 1.4 at n >= 4, or the lambda_1-vs-n curve is not monotone
        decreasing at fixed M. Either refutes the random-lattice model for these
        kernels. T2 and T3 survive such a refutation because the box-volume and
        AM-GM arguments do not use it; T1's slope claim does not.
    - id: HEUR-XEDN-C2
      formal_statement: >-
        For surfaces in the frozen family, the median over good fibres t_0 in F_p
        of M_{t_0} / N_{t_0} equals 1; that is, n >= 2 specialised free-x sections
        generically generate the whole group E_{t_0}(F_p).
      random_model_justification: >-
        Two or more uniform elements of a finite abelian group generate it with
        probability bounded below by a constant depending on the group's rank;
        for cyclic groups the failure probability is O(1/smallest prime factor of
        N). Specialised sections are not uniform elements, which is exactly why
        this is numbered as a heuristic and is the quantity to measure.
      supporting_results: >-
        Elementary counting for cyclic groups; the structure theorem giving
        E(F_p) as a product of at most two cyclic factors. RECALLED, standard,
        not cited to a source read in this session.
      validation_experiment_ids: [EXP-XEDN-9bd3bd]
      falsification_condition: >-
        Median M/N below 1 on any identifiable subfamily of surfaces or fibres.
        THIS IS THE FALSIFICATION THE HYPOTHESIS MOST WANTS TO SEE, because it is
        the only outcome that would move an exponent, and stating that explicitly
        is a guard against the hypothesis being written so as to survive.
  structural_ingredients:
    - description: >-
        Minkowski's convex body theorem applied to the cube [-lambda, lambda]^n,
        giving the unconditional bound lambda_1^inf(K) <= (det K)^(1/n) and hence
        the existence of a fibre-specific relation with coefficients bounded by
        M^(1/n).
      citation: >-
        Minkowski, geometry of numbers; standard. NOT CITED TO A SOURCE READ IN
        THIS SESSION -- the exact form of the constant must be checked in the
        derivation stage.
      role: existence and size bound for fibre-specific relations
    - description: >-
        The two-table meet-in-the-middle bound |A| + |B| >= 2 sqrt(M) by AM-GM,
        converting the box volume into a search cost.
      citation: >-
        Recorded in this corpus as R10 (two-table MITM below sqrt(N) is
        impossible). NOT READ this session -- relayed from the 2026-08-05
        scouting brief; re-derived inline in the mechanism so the citation is a
        pointer and not an authority.
      role: cost lower bound making the n-dependence provably cancel
    - description: >-
        Shioda-Tate rank bound rank E(F_p(t)) <= 8 for a rational elliptic
        surface, capping the number of independent sections and hence the
        smallest achievable exponent 1/n at 1/8.
      citation: >-
        T. Shioda, "On the Mordell-Weil lattices", Comment. Math. Univ. St.
        Pauli 39 (1990). NOT READ -- RECALLED, UNVERIFIED.
      role: caps n, hence caps how small the coefficient exponent can be made
    - description: >-
        Silverman's specialisation theorem, cited to record that it does NOT
        apply over a function field with finite constant field -- the failure of
        injectivity is what makes K_{t_0} large.
      citation: >-
        J. H. Silverman, specialisation of Mordell-Weil groups. NOT READ --
        RECALLED, UNVERIFIED. The correct function-field statement must be
        established in the derivation stage; getting it backwards inverts the
        hypothesis.
      role: negative structural ingredient; delimits where the number-field intuition fails
  reduction_chain:
    core_problem: >-
      Cost of producing one fibre-specific Mordell-Weil relation among n
      specialised free-x sections on a surface in the frozen family.
    corollaries:
      - problem: >-
          Whether widening the degree window (more sections, larger n) reduces
          the cost of a lifting relation source -- the direction GOAL-XEDN-002
          and GOAL-XEDN-003 pursued.
        reduction_ref: >-
          Immediate from T2: the box volume is M independent of n, so the answer
          is no for cost purposes. This is a reduction internal to this
          hypothesis, not a published one, and is flagged as such.
        asymptotics_preserved: >-
          Yes -- exactly, since the n-dependence cancels rather than being
          absorbed into a constant.
  predictions:
    - metric: >-
        minkowski_exponent: slope of log lambda_1^inf(K_{t_0}) against
        log M_{t_0} at fixed n, over surfaces and good fibres, n independent
        sections
      direction: higher
      minimum_effect: >-
        FORCED VALUE derived pre-run: 1/n, with intercept -log 2. Declared
        tolerance fixed before the run: fitted slope in [0.7/n, 1.4/n]. A fitted
        slope of 0 falsifies T1 and would mean the fibre-specific class is
        bounded too.
    - metric: >-
        section_to_random_ratio: lambda_1^inf for the specialised sections
        divided by lambda_1^inf for n uniformly random points of E_{t_0}(F_p)
        generating a subgroup of the same order M, matched on n, M and fibre
      direction: different
      minimum_effect: >-
        FORCED VALUE: 1.0 within sampling noise. Declared decision rule fixed
        before the run: mean ratio below 0.8 over >= 50 matched pairs is a
        genuine surface-specific signal and reopens the relation-source question
        with a measured effect size. This is the ratio the corpus's own
        matched-null template demands in place of a raw statistic; this lane has
        never reported one.
    - metric: >-
        M_over_N distribution: M_{t_0}/N_{t_0} over all good fibres t_0 in F_p,
        per surface
      direction: higher
      minimum_effect: >-
        FORCED VALUE under HEUR-XEDN-C2: median 1, with mass at 1/k for small k.
        This is the quantity the whole hypothesis turns on and it has never been
        measured. Any surface family with systematically depressed M/N is the
        exponent-relevant object and is promoted immediately to a successor
        hypothesis.
    - metric: >-
        box_volume_vs_n: number of integer points in {|c_i| <= lambda_1^inf} as a
        function of n at fixed (surface, fibre)
      direction: different
      minimum_effect: >-
        FORCED VALUE: ~M, flat in n, within a factor 2 across n = 2..8. A box
        volume that DECREASES with n falsifies T2 and would make the coefficient
        bound a genuine cost parameter -- retroactively making the completed
        goal's statistic exponent-relevant.
    - metric: >-
        n1_baseline_reproduction: measured lambda_1^inf at n = 1 against the
        order of sigma(P_1), and measured box volume against that order
      direction: different
      minimum_effect: >-
        FORCED VALUE: exact equality at every tested cell. Any discrepancy means
        the lattice construction is wrong and no result at n > 1 may be reported.
    - metric: >-
        generic_relation_share: fraction of archived EXP-XEDN-004 verified
        relations whose generic_relation_is_O field is true
      direction: higher
      minimum_effect: >-
        FORCED VALUE: 1.0, read from the archive. Any fibre-specific relation
        among them falsifies this hypothesis's account of what the census
        measured.
    - metric: >-
        nearby_object_sanity: the same cost accounting applied to index calculus
        over F_p^* with a smoothness-certified factor base
      direction: different
      minimum_effect: >-
        Must reproduce subexponential behaviour, not sqrt(N). If the accounting
        says sqrt(N) there too, the accounting is wrong and T2/T3 may not be
        reported at all.
  test_boundary:
    instances:
      - The 24 surfaces recorded eligible in RUN-XEDN-004-MAIN, at p in {7,13,19,31}
      - Newly generated surfaces in the SAME degree window at p up to about 10^5
      - All good fibres t_0 in F_p per surface, for the M/N distribution
      - Matched uniformly random point sets in E_{t_0}(F_p) as the null arm
      - Index calculus over F_p^* as the nearby-object sanity arm
    parameters:
      surface_family: "y^2 = x^3 + a(t)x + b(t), a != 0, deg a <= 2, deg b = 6, j non-constant"
      degree_window: >-
        UNCHANGED from EXP-XEDN-004. Widening it is the declared scope of
        GOAL-XEDN-002 and GOAL-XEDN-003 and is deliberately out of scope; this
        hypothesis changes the RELATION CLASS, not the window.
      n_range: "2 to 8, sections certified independent in the Mordell-Weil lattice"
      p_range: "7 to about 10^5; toy scale throughout"
      relation_class: "fibre-specific: valid at one t_0, NOT valid identically over F_p(t)"
    implementation: experiments/EXP-XEDN-9bd3bd
    budget:
      wall_clock_seconds: 21600
      maximum_memory_gb: 4
      maximum_runs: 6
  falsification_conditions:
    - >-
      Fitted Minkowski slope is 0, or outside [0.7/n, 1.4/n]. T1 is wrong and the
      claimed contrast with the census's slope-0 result collapses.
    - >-
      Measured box volume decreases with n. T2 is wrong; the coefficient bound is
      a cost parameter after all.
    - >-
      Any archived census relation is fibre-specific rather than generic. The
      account of what the census measured is wrong.
    - >-
      Section-to-random-points ratio systematically below 0.8. The surface
      contributes real structure beyond n group elements; the relation-source
      question reopens with a measured effect size. THIS IS THE OUTCOME THE
      HYPOTHESIS DOES NOT EXPECT AND MOST WANTS TESTED.
    - >-
      Median M/N below 1 on an identifiable subfamily. T3's "no better than rho"
      conclusion does not apply there and that subfamily becomes the successor
      object.
    - >-
      The n = 1 baseline does not reproduce exactly, or the nearby-object sanity
      arm returns sqrt(N) for index calculus. The instrument or the accounting is
      wrong and nothing may be reported.
    - >-
      The positive control fails: lambda_1 does not fall when M is deliberately
      reduced by a known factor k. Nothing may be reported from any arm.
    - >-
      An infrastructure failure, timeout, or missing dependency. Reported as
      infrastructure signal only; never negative mathematical evidence
      (AGENTS.md rule 5).
  interpretation_limits:
    - >-
      Toy scale. p <= about 10^5 is not crypto scale and no outcome supports,
      weakens, or bears on any claim about a deployed curve (AGENTS.md rule 7).
    - >-
      Confirmation does NOT close the lifting relation-source route. It supplies
      a named obstruction -- the search box has volume M independent of dimension,
      so the coefficient bound is not a cost parameter -- together with forward
      guidance naming the successor object (families with systematically small
      M). That is what docs/inventor-protocol.md section 4 requires of a
      negative and what a fatigue report is not. It specifically does not license
      any sentence on DEC-20260724-021's forbidden list.
    - >-
      Confirmation does NOT retract, weaken, or contradict EV-XEDN-003,
      DEC-20260725-001, or the sibling goals' evidence. Those record correct
      measurements of a different relation class. What it would do is narrow
      their claim boundary to the generic class, and the mechanism for that is a
      superseding record under a new id (AGENTS.md rule 4), created only by the
      Coordinator (rule 1).
    - >-
      Computing discrete logarithms at toy p to build K_{t_0} is an instrument.
      No cost claim may be derived from its runtime; all cost claims come from
      the box volume. Conflating them would be the partial-cost error AGENTS.md
      rule 4 forbids.
    - >-
      If the section-to-random ratio comes in below 0.8, that is a claimed new
      structural signal on a hard problem and is routed to independent
      review-adversarial review before any promotion. At toy scale it is not a
      breakthrough claim and must not be written as one.
