  related_hypotheses: []
  statement: >
    Fix the closed-form pair-object
    identities of IDEA-20260815-528b6e
    before any Pollard walk is run, any
    pair-map is enumerated on a group,
    or any discrete logarithm is solved.
    Stage 0 asserts only that the
    collision indicator 1_{R=S} is a
    pair-object and is not a function of
    one point, and that the difference
    map (R,S)|->v(R-S) does reduce to a
    single-point object. A nearby claim
    that every pair-object is a
    single-point object is rejected. A
    dummy that all pair-maps are
    constant is rejected as a
    classification. This is not a
    rigidity theorem proof and not a rho
    beat. Stages 1+ stay unauthorized.
  mechanism: >
    IDEA-20260815-528b6e asks whether
    rigidity extends from single-point
    objects to symmetric pair-objects,
    where rho's collision lives. Stage 0
    freezes the two forced
    classification identities (collision
    indicator is pair-not-point;
    difference map reduces) so a later
    argument cannot move the cells. No
    walk. No Semaev S_m. No Coppersmith.
    No DLP solve.
  predictions:
    - id: P-S0-PAIROID
      metric: closed-form identities on the frozen REAL / KF / NULL panel
      direction: different
      minimum_effect: >
        After fixture_pass, REAL reports
        collision_indicator_is_single_point=false,
        difference_map_reduces=true,
        pair_object_strictly_richer=true. KF
        every-pair-is-single-point is
        rejected. NULL
        all-pair-maps-constant is rejected.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KF
      statement: >
        After fixture_pass, the KF
        claim is accepted. An encoding
        bug is failed_infrastructure.
    - id: F-S0-REAL
      statement: >
        After fixture_pass, REAL misses
        a frozen identity. That
        falsifies only P-S0-PAIROID
        at the frozen arithmetic.
  test_boundary:
