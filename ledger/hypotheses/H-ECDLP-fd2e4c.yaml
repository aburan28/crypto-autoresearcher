  title: >
    Stage 0 closed-form pair-object
    identities — collision indicator is
    not a single-point map — before any
    walk is run
  status: specified
  proposed_by: idea-generator
  designed_by: coordinator
  designed_under_task: TASK-20260913-6b1780
