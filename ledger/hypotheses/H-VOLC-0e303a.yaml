hypothesis:
  id: H-VOLC-0e303a
  question_id: RQ-VOLC-f6253b
  added: '2026-08-25'
  derived_from_idea: IDEA-20260807-3c6bd8
  statement: >-
    The cost of knowing an ordinary curve's position in an ell-volcano decomposes into three components
    with very different prices, and the obstruction sits in the third rather than where this program has
    been placing it. (I) The HEIGHT v_ell(c) is obtained by repeated division of D = t^2 - 4p by ell
    alone, without any factorization, in O(log^2 p) bit operations for every ODD ell, because a
    fundamental discriminant has v_ell(D_K) in {0, 1} at odd ell; the case ell = 2 requires an explicit
    case split since v_2(D_K) lies in {0, 2, 3}. (II) The DISCRIMINANT is p-sized, not p^2-sized, since
    |t^2 - 4p| <= 4p by Hasse - about 258 bits at a 256-bit p - so even its full factorization is routine
    at deployed sizes rather than a barrier. (III) The LEVEL v_ell(f_E) requires walking the volcano, at
    O(ell h^2) isogeny computations each costing at least O(ell^2) field operations, which is polynomial
    in ell and therefore EXPONENTIAL IN log ell - so the level is cheap for small ell and infeasible for
    large ell, and that walk is where the obstruction actually is.
  mechanism: >-
    Write D = t^2 - 4p = c^2 D_K with D_K fundamental. For odd ell, v_ell(D_K) is 0 or 1 because a
    fundamental discriminant is squarefree or four times a squarefree number and the factor of four is
    invisible at odd ell; hence v_ell(D) = 2 v_ell(c) + v_ell(D_K) and v_ell(c) = floor(v_ell(D)/2),
    obtained by repeated division alone. At ell = 2 the same method works with a case split - v_2(D) odd
    forces v_2(D_K) = 3, while v_2(D) even leaves {0, 2}, resolved in O(1) by testing D/4^k modulo 4. The
    2-adic case is stated explicitly rather than swept into the odd-ell formula, because getting it wrong
    silently mislabels every 2-volcano. Separately, the Hasse bound gives |D| = 4p - t^2 <= 4p, so D has
    about the same bit length as p; the inference that extracting its square part is prohibitive AT
    DEPLOYED SIZES is what this hypothesis disputes, since p-sized means about 258 bits at a 256-bit
    curve, not 2^258 work. Finally, knowing the height is not knowing the level - the level requires
    locating E in the volcano by rational ell-isogeny counting and descent, needing either the
    ell-division polynomial of degree (ell^2 - 1)/2 or the modular polynomial of size O(ell^3), which is
    what makes the published endomorphism-ring algorithms subexponential rather than polynomial. The
    consequence is a DISCRIMINATION between two competing accounts of why this lane might be a dead end -
    COST, that any attack needing the level must pay a subexponential endomorphism-ring computation, versus
    INVISIBILITY, that the level is cheap to obtain but carries no usable information. Those are different
    closures with different forward guidance, and this hypothesis predicts invisibility below a crossover
    in ell and cost above it.
  assumptions:
  - >-
    A fundamental discriminant is squarefree or four times a squarefree number. RECALLED, standard; checked
    directly on every toy instance by factoring, so the hypothesis does not rest on the recollection.
  - >-
    The ell-volcano has height v_ell(c). RECALLED, UNVERIFIED; verified empirically here by isogeny counting
    rather than assumed.
  - >-
    Public factoring-record figures used to support "258 bits is far below the record" are RECALLED and NOT
    VERIFIED in this corpus. They support a conclusion robust to substantial error in the figures, and
    verification against a primary source is a declared stage.
  - >-
    Modular polynomial size O(ell^3) and division polynomial degree (ell^2 - 1)/2. RECALLED, standard; the
    actual construction cost is MEASURED at small ell rather than assumed to bind there.
  - >-
    Cryptographic-scale statements are ARGUED from bit lengths and public records, never extrapolated from
    toy Python timings. Any sentence mixing the two is a defect and the design treats it as one.
  proof_search_map:
    bottleneck: >-
      The construction of an ell-isogeny at large ell - concretely, building the division polynomial of degree
      (ell^2 - 1)/2 or the modular polynomial of size O(ell^3). Removing that step is what would make the full
      endomorphism ring polynomial, and it is the exact reason the published algorithms are subexponential.
    baseline_embedding:
      parameter_slice: >-
        ell = 2 and ell = 3, which reproduce the classical hand computation - the 2-isogeny kernel is a root of
        the cubic and the 3-isogeny kernel a root of the third division polynomial.
      reproduction_check: >-
        A frozen fixture - a curve with known 2- and 3-volcano structure, level determined by hand, cost
        measured. Exact agreement of the level, and measured cost within a factor 2 of the model. The cost
        model's extrapolation in ell is not credited until those two values are reproduced.
    observation_collision:
      observable: >-
        The integer v_ell(c) as returned by the shortcut.
      distinct_preimage_search: >-
        REQUIRED - search for two discriminants with the same v_ell(D) but different v_ell(c). By the argument
        this is impossible for odd ell and POSSIBLE at ell = 2 if the case split is omitted. The search is
        therefore a direct test of whether the 2-adic case split is correct, and it is expected to succeed
        exactly when the implementation is wrong.
    constructive_transforms:
    - transform: specialization_pack
      proposed_object: >-
        Decompose "the cost of knowing the endomorphism ring" into per-ell blocks that are provably disjoint,
        since the ell-parts of the conductor are independent, and charge each separately rather than charging one
        aggregate subexponential figure.
      predicted_gain: >-
        Converts an aggregate "subexponential, therefore expensive" into a per-ell schedule with an explicit
        crossover, so an attack needing only small ell pays polynomial and can say so - and, symmetrically, so
        that a closure naming cost as its obstruction can be checked against the ell it actually needs.
    quantifier_order: >-
      CLAIMED - FOR ALL ordinary E over F_p and FOR ALL ODD primes ell, v_ell(c) equals floor(v_ell(t^2 - 4p)/2),
      computable in O(log^2 p) bit operations with no factorization. Uniform, unconditional, no exceptions.
      SEPARATELY - FOR ALL ell THERE EXISTS an algorithm computing v_ell(f_E) in O(ell h^2) isogeny computations.
      The dependence on ell is polynomial in ell and therefore EXPONENTIAL IN log ell; stating it as
      "polynomial" without that qualifier is the error this hypothesis exists to prevent.
      NOT CLAIMED - that the conductor is computable in polynomial time. It is not, by any method known here.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The height of every small-ell volcano is free, the discriminant is p-sized so its factorization is
        routine at deployed sizes, and the endomorphism-ring bottleneck is the large-ell walk." It can NEVER
        certify that the endomorphism ring is computable in polynomial time, and it improves no published
        algorithm.
      nearby_object_control: >-
        A class where the conductor c is a single LARGE PRIME. There is then no small-ell structure at all, every
        level sits at a single huge ell, and the cheap route gives nothing. The method MUST be seen to fail
        there; a cost model claiming cheapness for that class would have proved too much.
    proof_obligations:
    - claim: v_ell(D_K) lies in {0, 1} for odd ell.
      responsibility: correctness
    - claim: v_ell(c) equals floor(v_ell(D)/2) for odd ell.
      responsibility: correctness
    - claim: The ell = 2 case split is complete and correct.
      responsibility: correctness
    - claim: The absolute value of t^2 - 4p is at most 4p by Hasse.
      responsibility: size
    - claim: Level determination costs O(ell h^2) isogeny computations.
      responsibility: runtime
    - claim: The bottleneck is large-ell isogeny construction.
      responsibility: feasibility
    - claim: Cryptographic-scale statements are argued from bit lengths, never extrapolated from toy timings.
      responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-VOLC-0E3-1
    formal_statement: >-
      FOR ALL ordinary E over F_p and FOR ALL ell in the tested set, the number of isogeny computations required
      to determine v_ell(f_E) by descent scales as O(ell h^2) with h = O(log p), so a log-log regression of
      measured isogeny counts on ell and on h returns exponents near 1 and 2 respectively.
    random_model_justification: >-
      Not a distributional claim about a random object - it is a cost model for a deterministic procedure, recorded
      as a heuristic because its constants and its regime of validity at small ell are asserted rather than derived,
      and because the asymptotic form may not bind at the only ell values reachable here.
    supporting_results: []
    validation_experiment_ids:
    - EXP-VOLC-6120a9
    falsification_condition: >-
      A fitted exponent in ell outside [0.7, 1.5] or in h outside [1.5, 2.5]. The walk is then more or less
      expensive than modelled, the crossover moves, and the reported cost schedule must be rebuilt from the
      measured exponents.
  - id: HEUR-VOLC-0E3-2
    formal_statement: >-
      The endomorphism-ring bottleneck in the published subexponential algorithms is the LARGE-ell walk rather
      than any step this audit could remove.
    random_model_justification: >-
      Not a random model. An attribution based on the shape of the cost components, made without having read the
      relevant papers beyond their abstracts. It is recorded as a heuristic precisely because the attribution is
      the least certain part of the hypothesis and is resolvable for free by reading.
    supporting_results: []
    validation_experiment_ids:
    - EXP-VOLC-6120a9
    falsification_condition: >-
      Reading the published algorithms beyond their abstracts and finding the bottleneck attributed elsewhere. The
      attribution is then misplaced and must be rewritten around what the papers actually say. This is a likely and
      welcome outcome.
  structural_ingredients:
  - description: >-
      The Hasse bound, giving |t^2 - 4p| = 4p - t^2 <= 4p, so the discriminant is about the same bit length as p.
    citation: null
    provenance: recalled
    verified_by: >-
      Checked directly on every instance in the pool as a required metric, because the entire correction to a
      standing cost framing in this program rests on it.
    role: size bound that makes the factorization argument work
  - description: >-
      Kohel-style volcano structure - the ell-volcano has height v_ell(c) where c is the conductor of Z[pi] in the
      maximal order.
    citation: KN-LIT-360
    provenance: kb
    verified_by: >-
      Verified empirically by isogeny counting at small ell rather than assumed; the citation is recorded as not
      read.
    role: the structure whose height and level are being priced
  - description: >-
      Published subexponential algorithms for endomorphism-ring computation.
    citation: KN-LIT-251 and KN-LIT-309
    provenance: recalled
    verified_by: null
    role: >-
      The state of the art this audit does NOT improve and says it does not improve. Both corpus entries are
      abstract-level and flagged as relayed without independent verification; reading them beyond their abstracts is
      a declared stage and can falsify the bottleneck attribution.
  - description: >-
      A standing in-corpus argument that detecting a large square part of t^2 - 4p is factoring-hard and therefore
      that hidden-CM curves are not excluded by ordinary curve-generation hygiene.
    citation: IDEA-20260726-010
    provenance: internal
    verified_by: >-
      Read. This hypothesis accepts that record's premise that the integer is p-sized and DISPUTES the inference
      that this is hard at deployed sizes. The record is cited and audited, never contradicted from memory, and
      its density measurement and hardness null stand independently.
    role: the cost framing under audit
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
  - metric: >-
      Agreement between the formula-based v_ell(c) and the factorization-based v_ell(c) over at least 10^5 random
      toy (p, t) pairs, per ell in {2, 3, 5, 7, 11, 13}
    direction: different
    minimum_effect: >-
      100 percent agreement for odd ell; any disagreement falsifies the shortcut. At ell = 2, 100 percent agreement
      ONLY AFTER the case split, with the disagreement rate WITHOUT the case split also reported, since it measures
      how often the naive formula would silently mislabel a 2-volcano.
  - metric: >-
      Wall time of v_ell(c) by the shortcut versus by full factorization of D, as a function of log p
    direction: lower
    minimum_effect: >-
      The shortcut at least 100 times faster at the largest tested p, with its time growing like O(log^2 p) while
      factorization grows superpolynomially. A ratio that does not widen with p means the shortcut is not
      asymptotically cheaper and the claim is overstated.
  - metric: Bit length of D = t^2 - 4p relative to the bit length of p, over the instance pool
    direction: different
    minimum_effect: >-
      At most 2 bits more than p on 100 percent of instances. This is the Hasse bound and it is CHECKED rather than
      asserted, because the correction to the standing cost framing rests entirely on it.
  - metric: Isogeny computations to determine v_ell(f_E), fitted against ell and h
    direction: higher
    minimum_effect: >-
      Fitted exponent in ell inside [0.7, 1.5] against a predicted 1, and in h inside [1.5, 2.5] against a
      predicted 2. A fitted exponent in ell materially above 1 means the walk is more expensive than modelled and
      the crossover moves down.
  - metric: The cost-versus-invisibility verdict per ell regime
    direction: different
    minimum_effect: >-
      A stated crossover ell* with a stated budget, plus the sentence naming which obstruction applies below and
      above it. PREDICTED - invisibility, not cost, for ell below a few thousand; cost above. If instead small-ell
      level determination is measured to be expensive, cost applies everywhere and any closure in this lane would
      name a completely different obstruction, which is why this audit runs BEFORE the closures are written.
  test_boundary:
    instances: >-
      At least 10^5 random toy (p, t) pairs for the height mass-check, with p across a declared ladder; a separate
      pool for the factoring-time ladder; and a selected pool of ordinary curves with volcano height at least 1 for
      the walk-cost measurement at ell in {2, 3, 5, 7, 11, 13}. Plus random integers of matched bit length, a
      supersingular pool, and a class with conductor a single large prime, as the three named nulls.
    parameters:
      ell_set:
      - 2
      - 3
      - 5
      - 7
      - 11
      - 13
      height_mass_check_pairs: 100000
      p_ladder_bits_min: 16
      p_ladder_bits_max: largest feasible in pure Python, reported rather than assumed
      fitted_exponent_band_ell:
      - 0.7
      - 1.5
      fitted_exponent_band_h:
      - 1.5
      - 2.5
      minimum_volcano_height_for_walk_pool: 1
    implementation: >-
      Pure integer arithmetic for the height and the Hasse check; a factorization backend for the brute-force oracle
      null; and ell-isogeny code for ell in {2, 3} extended to the tested ell set for the walk measurement. No
      Groebner computation is required. Point counting to obtain t is charged SEPARATELY and explicitly, since at toy
      scale it is the dominant cost of the whole audit.
    budget:
      wall_clock_seconds_per_run: 7200
      total_cpu_hours: 6.0
      maximum_runs: 20
  falsification_conditions:
  - >-
    Any odd-ell instance where the shortcut disagrees with the factorization-based value. The height claim is false
    and the record is superseded.
  - >-
    Any instance with |D| greater than 4p. The Hasse bound is being misapplied and the correction to the standing
    cost framing collapses.
  - >-
    Measured level-determination cost growing faster than O(ell h^2), i.e. a fitted exponent outside the declared
    bands. The crossover moves down and the "small ell is cheap" conclusion narrows; the record reports the narrower
    range rather than the original claim.
  - >-
    Reading the published algorithms beyond their abstracts and finding the bottleneck attributed elsewhere. The
    attribution is misplaced and must be rewritten around what the papers say. This is a likely and welcome outcome.
  - >-
    The cheap route giving a useful answer on the nearby-object class where the conductor is a single large prime.
    The method would then prove too much and the cost model is void.
  interpretation_limits:
  - >-
    This is a COST AUDIT. It produces no attack, improves no published algorithm, and asserts nothing about whether
    volcano depth matters.
  - >-
    The cryptographic-scale conclusion about factoring a p-sized discriminant is an ARGUMENT from bit lengths and
    public records, not a measurement, and must be labelled as such everywhere it appears. Mixing it with a toy
    Python timing in the same sentence is a defect.
  - >-
    A correction to another record's cost framing does not touch that record's density measurement or its hardness
    null, both of which stand independently.
  - >-
    Nothing here licenses the claim that the endomorphism ring is easy. The third component says the opposite for
    large ell and cites the published subexponential algorithms as the state of the art.
  - >-
    The largest prime factor of the conductor, not the conductor itself, determines feasibility - a 265-bit conductor
    that is a product of small primes is entirely tractable while a 265-bit prime one is not. All reporting is by
    largest prime factor.
  distinguishable_outcomes:
  - outcome: >-
      100 percent odd-ell agreement against the factorization oracle; the ell = 2 case split achieving 100 percent
      while the naive formula does not; 100 percent of instances satisfying the Hasse bit-length check; the shortcut
      at least 100 times faster at the largest p with a widening ratio; and fitted walk exponents inside their bands.
    means: >-
      The three-part price list stands at the tested scope. A stated crossover ell* is reported with its budget, and
      the lane's obstruction is named as invisibility below it and cost above it. Any subsequent closure in this lane
      must name the obstruction this audit licenses rather than the one it disproves.
  - outcome: >-
      Any odd-ell disagreement against the factorization oracle.
    means: >-
      The height shortcut is FALSE as stated. The record is superseded, and the first component of the price list -
      the one the whole "the height is free" claim rests on - is withdrawn.
  - outcome: >-
      Fitted walk exponents outside their declared bands.
    means: >-
      HEUR-VOLC-0E3-1 is falsified. The crossover moves and the "small ell is cheap" conclusion narrows to whatever
      the measured exponents support. This is a genuine negative for the cost model as stated, and the narrower range
      is what gets reported.
  - outcome: >-
      Reading the published algorithms shows the bottleneck is not the large-ell walk.
    means: >-
      HEUR-VOLC-0E3-2 is falsified and the third component's attribution is misplaced. The record is rewritten around
      what the papers actually say. This costs no compute and is the cheapest available refutation of the hypothesis.
  - outcome: >-
      The cheap route appears to work on the nearby-object class where the conductor is a single large prime.
    means: >-
      PROVES TOO MUCH. The cost model claims cheapness where none can exist and is void, regardless of its other
      numbers.
  - outcome: >-
      Small-p degeneracy leaves too few instances with volcano height at least 1 for the walk measurement.
    means: >-
      CENSORED. The walk-cost half has no signal; the selection rate is reported, no exponent is fitted, and no
      crossover is stated. This is a stop, not a negative.
