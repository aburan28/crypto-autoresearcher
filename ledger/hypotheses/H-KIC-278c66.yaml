hypothesis:
  id: H-KIC-278c66
  question_id: RQ-KIC-7502b9
  idea_id: IDEA-20260930-4406e0
  statement: >-
    On the frozen explicit base of the n=7 Koblitz subgroup, explanation O
    holds when the mean and the minimum of f = (C_sat - G_sat) / C_sat are
    both at least 0.5, G_sat is at most 1.1 times G_mitm, and the verified
    triple sets match. Explanation S holds when that mean is strictly below
    0.5 and the triple sets match. A triple mismatch decides neither
    explanation. No speedup and no exponent move are claimed.
  mechanism: >-
    Representation R1 selects an index into an explicit list B. The circuit
    is the Boolean XOR system for addition of three decoded points, compared
    with the public target. G_sat counts invocations of one shared field
    multiplier inside that circuit. G_mitm counts the same invocations while
    exact meet-in-the-middle tries every ordered pair, including pairs whose
    third point misses B. C_sat adds, at weight 1 each, membership tests,
    solver conflicts, solver decisions, and solver clause inspections.
    f = (C_sat - G_sat) / C_sat. The stricter fraction
    (C_sat - G_sat - M) / C_sat, with M the membership tests, is reported
    and is not the success bit. Wall time is recorded and is not in f.
  assumptions:
    - >-
      B is the lexicographically first m points of the unique order-r
      subgroup, m=8 at n=7 and m=12 at n=11, written to a file before any
      solver call or meet-in-the-middle search.
    - >-
      Every charged weight is 1. The weights are not edited after f is seen.
    - >-
      A target that hits the n=11 conflict cap is UNKNOWN and is excluded
      from f. n=7 has no conflict cap.
    - >-
      A satisfying model is accepted only after an independent group-law
      replay. A failed replay is an error, not a relation.
  proof_search_map:
    bottleneck: >-
      Which part of the solver's charged operations is group-law work. No
      search step is removed.
    baseline_embedding:
      parameter_slice: >-
        n=7, a=1, F2[x]/(x^7+x+1), curve y^2 + xy = x^3 + x^2 + 1,
        group order 142, r=71, m=8, every subgroup point as a target.
      reproduction_check: >-
        Meet-in-the-middle triples equal an independent loop over B^3, and
        decoded uncapped solver models equal that set.
    observation_collision:
      observable: the pair (G_sat, conflict count) per n=7 target
      distinct_preimage_search: >-
        Two targets with the same G_sat and different conflict counts. If
        every addition-count fiber has one conflict total, L=0 and the
        independence sentence fails. That does not by itself flip
        explanation O into explanation S.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: solver trails that share one addition-operation count
        predicted_gain: >-
          Variation of conflict counts inside one fiber is the evidence that
          overhead is not a rekeying of G_sat.
      - transform: specialization_pack
        proposed_object: >-
          The same counters on the curve circuit, the random-XOR circuit,
          and the Z/rZ circuit.
        predicted_gain: >-
          Separates overhead that appears for any XOR system of that shape
          from overhead that appears only on the curve.
    quantifier_order: >-
      For the frozen (n, m, B, charged unit, solver binary, seeds) and for
      every n=7 subgroup target, compute f. The charged unit is not edited
      after f is seen. The procedures are the solver and exact
      meet-in-the-middle.
    method_ceiling:
      strongest_certifiable_claim: >-
        At n=7, either explanation O, or explanation S, or a split
        population, or an unresolved seed crossing, or an invalid run.
        No statement about F4, n=131, or a speedup.
      nearby_object_control: >-
        Random XOR rows of equal count and width, and integer addition
        modulo r on the same selector width. A random-XOR model that passes
        curve replay invalidates the decoder.
    proof_obligations:
      - claim: n=7 meet-in-the-middle triples match the B^3 loop
        responsibility: baseline
      - claim: satisfying models replay to curve relations, or are rejected
        responsibility: correctness
      - claim: f uses only the pre-registered unit
        responsibility: runtime
      - claim: capped n=11 targets are excluded from f
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        No distributional law is assumed for conflict counts. The cut
        f >= 0.5 is a cut in the finite n=7 population. The random-XOR
        control is assumed not to encode the curve relation, and replay
        checks that assumption.
      random_model_justification: >-
        Occupancy and Dickman laws are not invoked. The n=7 mean is a mean
        over a fully enumerated target list. Seed variance is the second
        seed.
      supporting_results: []
      validation_experiment_ids:
        - EXP-KIC-6ee7d9
      falsification_condition: >-
        A random-XOR model passes curve replay, or a counter absent from
        the binary is filled in with an invented value.
  structural_ingredients:
    - description: >-
        n=7 parameters a=1, modulus x^7+x+1, group order 142, r=71. This
        session recomputed the affine point count of
        y^2 + xy = x^3 + x^2 + 1 over F2[x]/(x^7+x+1) as 141, hence 142
        points with the point at infinity. x^11+x^2+1 is irreducible over
        F2 by trial division. The n=11 group order is computed in the run.
      citation: IDEA-20260930-4406e0
      provenance: internal
      verified_by: >-
        coordinator session 2026-10-05, direct enumeration, citing the
        parameter line of H-KIC-9416d9 as recorded on IDEA-20260930-4406e0
      role: frozen field and group order for the decision cell
    - description: >-
        KR-IC-5765d2 records a SAT-versus-F4 constant on a PDP step. This
        hypothesis does not compare SAT to F4 and does not reclaim that row.
      citation: IDEA-20260930-4406e0
      provenance: internal
      verified_by: >-
        idea-generator, citation block of IDEA-20260930-4406e0
      role: prior accounting that this control does not repeat
  reduction_chain:
    core_problem: >-
      The composition of the charged-cost gap between CryptoMiniSat and
      exact meet-in-the-middle on one explicit base.
    corollaries: []
  predictions:
    - metric: solver_overhead_fraction_f
      direction: higher
      minimum_effect: mean and minimum at least 0.5 on the n=7 list
    - metric: G_sat_over_G_mitm
      direction: lower
      minimum_effect: ratio at most 1.1
    - metric: symmetric_difference_of_verified_triple_sets
      direction: lower
      minimum_effect: 0
  test_boundary:
    instances:
      - every order-r point at n=7, both seeds, no conflict cap
      - the lexicographically first 32 order-r points at n=11, seed 1, conflict cap 100000
      - 16 control targets at n=7 for random XOR and for Z/rZ
    parameters:
      n7_modulus: x^7+x+1
      n11_modulus: x^11+x^2+1
      curve: y^2 + xy = x^3 + x^2 + 1
      n7_group_order: 142
      n7_r: 71
      n7_m: 8
      n11_m: 12
      n11_r: computed in the run
      seeds: [1, 2]
      n11_conflict_cap: 100000
      charged_weight: 1
    implementation: >-
      One shared multiplier circuit, exact meet-in-the-middle, and
      CryptoMiniSat. Counters are read from that binary. A missing counter
      is omitted.
    budget:
      enforcement: advisory
      wall_clock_seconds_per_run: null
      maximum_memory_gb: 4
      maximum_runs: 1
  falsification_conditions:
    - >-
      At n=7 on seed 1, the mean of f is strictly below 0.5 and the verified
      triple sets match. Explanation O is false.
    - >-
      At n=7 on seed 1, G_sat > 1.1 * G_mitm while the mean of f is at least
      0.5 and the triple sets match. Explanation O fails.
    - >-
      The verified sets differ on any uncapped target. Neither explanation
      is decided, and the run is invalid.
    - >-
      Seed 1 and seed 2 disagree on whether the n=7 mean of f is at least
      0.5. The result is unresolved.
    - >-
      A random-XOR model passes curve replay. The instrument is invalid.
    - >-
      The minimum of f on the n=7 list is below 0.5 while the mean is at
      least 0.5. The population is split and explanation O is not confirmed.
  interpretation_limits:
    - >-
      No speedup is claimed. Pollard rho still has time exponent 1/2, and
      this control does not move it. sota_delta on that exponent is 0.
    - KR-IC-5765d2 is not re-tested and is not claimed as new.
    - The explicit base is an accounting fixture, not a new factor base.
    - >-
      An n=7 result does not transfer to Weil descent at n=131, to F4, or
      to another solver.
    - >-
      The CryptoMiniSat counter citation on the proposal is provenance
      recalled. This hypothesis does not treat it as support. Counters come
      from the binary that runs.
  status: specified
  proposed_by: coordinator
