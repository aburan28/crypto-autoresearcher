hypothesis:
  id: H-MAYO-e034c2
  question_id: RQ-MAYO-001
  derived_from_idea: IDEA-20260805-258212
  added: '2026-08-25'
  status: proposed
  proposed_by: coordinator
  statement: >-
    MAYO's whipped map is a k-fold DILATION of its underlying UOV map, acting on the parameter
    triple (variables, equations, oil dimension) with eigenvalues (k, 1, k), and that single
    asymmetry fixes exactly which UOV attack families whipping can and cannot move. Formally, if the
    whipped map has n* = k n, m* = m, o* = k o, then (I0) the whipped oil dimension is exactly k o;
    (I1) the oil ratio n*/o* equals n/o exactly, so any attack whose applicability is a function of
    n/o alone applies to the whipped map exactly when it applies to the underlying one; (I2) the
    intersection attack's generic solution dimension satisfies d*_{k'} = k times d_{k'}, so it is
    dilated but never changes sign; (I3) the Kipnis-Shamir exponent satisfies n* - 2 o* = k (n - 2
    o), multiplied by k strictly AGAINST the attacker when n > 2o; and (I4) the underdetermination
    ratio satisfies alpha* = k alpha, multiplied by k strictly FOR the attacker. The honest
    matched-baseline statement is therefore a TRADE, not a verdict.
  mechanism: >-
    The whipped map is stated as P*(x_1,...,x_k) = sum_i E_ii P(x_i) + sum_{i<j} E_ij P'(x_i, x_j)
    with P a UOV map of oil dimension o and P' its polar form. P vanishes on the oil space O and O
    is totally isotropic for P', both definitional, so every term of P* vanishes on O^k and O^k of
    dimension k o is an oil space for P*. Reading the whipped instance as a UOV instance in its own
    right gives n* = k n, m* = m, o* = k o - the variable and oil counts scale while the EQUATION
    COUNT DOES NOT - and identities I1 through I4 are corollaries of that single asymmetry, obtained
    by substitution. Because the intersection dimension formula is homogeneous of degree 1 in (n,
    o), I2's k-fold dilation survives replacement of that formula by any other degree-1-homogeneous
    rule, which is a robustness property that makes the identity worth stating before the
    cryptanalysis literature is read.
  assumptions:
  - >-
    That the whipped map has the stated bilinear form. If the Round-3 specification whips
    differently - per-copy linear maps on the arguments, or a non-symmetric polar convention - I0
    may still hold while I2 through I4 need restating. This is the single most likely way the record
    is wrong, and the reading stage exists to settle it.
  - >-
    That the whipped instance's oil dimension is k o and not more. If a larger oil space exists the
    whipped map is WEAKER than these identities say, not stronger, so the identities are
    conservative in the direction that matters for a security claim - but the claim that whipping is
    neutral on the oil-geometry axis would then be unsupported.
  - >-
    Every parameter figure recalled for MAYO and for plain UOV is RECALLED and UNVERIFIED and is a
    candidate to check. No numeric column may be filled from memory.
  proof_search_map:
    bottleneck: >-
      The step that decides the claim is the assignment of the triple (n*, m*, o*) to the whipped
      map from its definition. Every downstream identity is substitution; if the triple is wrong,
      every identity is void, and if the triple is right, no identity can fail.
    baseline_embedding:
      parameter_slice: >-
        k = 1 is the exact old-method boundary - whipping with k = 1 is the identity dilation, the
        whipped map equals E_11 P, and every predicted ratio must come out exactly 1.
      reproduction_check: >-
        A symbolic re-derivation of I0 through I4 against the specification's quoted definition,
        plus the k = 1 slice evaluated in exact integer arithmetic, both as frozen fixtures.
    observation_collision:
      observable: 'The parameter triple (n, m, o) and the three derived ratios n/o, n/m, n - 2o.'
      distinct_preimage_search: >-
        The projection is enormously many-to-one by construction - the fibre over a triple is the
        whole space of UOV maps with those parameters - and the record states that plainly. What
        matters is not that the fibre is small but that the projected value VARIES ACROSS THE
        OBJECTS COMPARED, which is checked: plain UOV and MAYO at the same claimed level have
        different n/o and different n/m. The projection therefore cannot detect a whipping-induced
        structural weakness at FIXED parameters, and that boundary is stated rather than left
        implicit.
    quantifier_order: >-
      FOR ALL k, FOR ALL underlying UOV maps P with parameters (n, m, o) and FOR ALL admissible
      emulsifier families {E_ij}, the whipped map has parameters (k n, m, k o) and the four
      identities hold. The identities are unconditional given the stated form of P*; they quantify
      over every P and every emulsifier choice and depend on neither.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest claim a run may support is a table of exact integers per parameter set plus
        the dilation statement. Converting 'alpha is dilated by k' into a bit figure requires a cost
        model for underdetermined MQ, which this hypothesis deliberately does not supply and which
        no run under it may assume.
      nearby_object_control: >-
        Plain UOV at Level I, where o equals m and n/o is below the recalled intersection threshold.
        The identities MUST classify it as intersection-attack IN RANGE. A second nearby object,
        Rainbow, whose parameters the intersection attack is reported to have devastated, must also
        come out in range. If the instrument classifies either as out of range, the applicability
        rule or the recalled threshold is wrong and NO conclusion about MAYO may be reported.
    proof_obligations:
    - claim: 'O^k is an oil space for P* of dimension exactly k o.'
      responsibility: correctness
    - claim: 'The whipped equation count is m, not k m.'
      responsibility: correctness
    - claim: 'd*_{k''} = k d_{k''} follows from degree-1 homogeneity in (n, o).'
      responsibility: strictness
    - claim: 'The recalled intersection applicability rule is the rule the literature states.'
      responsibility: baseline
    - claim: 'No cost figure is derived from a ratio without a named MQ cost model.'
      responsibility: scope
    not_applicable_reason: null
  asymptotic_claim:
    problem: null
    prior_best: null
    time_exponent: null
    memory_exponent: null
    hidden_cofactor: null
    claim_kind: null
  heuristic_assumptions:
  - id: HEUR-MAYO-DIL-1
    formal_statement: >-
      NONE OF THE FOUR IDENTITIES IS HEURISTIC. I0 through I4 are exact consequences of the stated
      form of P* and of the definitions of n, m and o, and they are unconditional given that form.
      This entry exists to record that the hypothesis is UNCONDITIONAL where a predecessor proposal
      was heuristic.
    random_model_justification: >-
      Not a distributional heuristic and not presented as one. The support is substitution into the
      definitions plus bilinearity of the polar form and homogeneity of P.
    supporting_results: []
    validation_experiment_ids:
    - EXP-MAYO-70f6c1
    falsification_condition: >-
      A ratio predicted to be exactly 1 or exactly k comes out otherwise in exact integer
      arithmetic, which means a k-dependence was smuggled into the derivation or the triple is
      mis-assigned.
  - id: HEUR-MAYO-DIL-2
    formal_statement: >-
      LOAD-BEARING AND HEURISTIC. The intersection attack's applicability is governed by the generic
      intersection dimension d_{k'} = k' o - (k'-1) n being positive, and the relevant cost
      quantities are homogeneous of degree 1 in (n, o).
    random_model_justification: >-
      None offered. This is recalled from the UOV cryptanalysis literature and has not been read by
      this program. It is a candidate to check, and I2's k-fold dilation is stated CONDITIONALLY on
      it. The conditional structure is deliberate - if the true applicability rule is any other
      degree-1-homogeneous function of (n, o), the dilation conclusion survives unchanged.
    supporting_results: []
    validation_experiment_ids:
    - EXP-MAYO-70f6c1
    falsification_condition: >-
      A primary source states an applicability rule that is not degree-1 homogeneous in (n, o). I2
      is then void as written and must be re-derived under the true rule, and the positive controls
      on plain UOV and Rainbow are what detect a mis-recalled rule.
  structural_ingredients:
  - description: The MAYO whipped-map definition and the parameter table per parameter set.
    citation: 'MAYO Round-3 specification - NOT READ by this program; NIST submission package, team site, or reference implementation parameter header'
    provenance: recalled
    verified_by: null
    role: >-
      Supplies the exact form the identities are derived from. It is a pointer, not support - the
      reading stage must quote it verbatim or record precisely which sources were tried and failed.
  - description: >-
      The report that MAYO and QR-UOV security rests on underdetermined MQ and that a pseudo-oil
      approach lowers the direct-attack cost at Level I by 8 bits.
    citation: KN-LIT-1818
    provenance: recalled
    verified_by: null
    role: >-
      Used ONLY as a consistency check on a derivation, never as a number this program asserts. The
      corpus entry's own text states its claims are relayed from an abstract without independent
      verification, and its relevance section is unrelated boilerplate.
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
  - metric: oil_ratio_dilation
    direction: different
    minimum_effect: >-
      EXACTLY 1.000 at every parameter set, with no tolerance. This is an identity, not a
      measurement. Any other value means the whipped oil dimension is not k o and the whole record
      must be redone.
  - metric: intersection_dimension_dilation
    direction: different
    minimum_effect: 'EXACTLY k at every parameter set. Derived before any reading.'
  - metric: sign_of_underlying_intersection_dimension
    direction: different
    minimum_effect: >-
      NEGATIVE at every declared MAYO set, i.e. 2o < n. If ANY set has 2o - n at least 0 the
      intersection attack is in range for that set and the record has found the single most
      important fact in the goal. The prediction is a real risk, not a formality.
  - metric: underdetermination_dilation
    direction: different
    minimum_effect: >-
      EXACTLY k at every parameter set. The cross-scheme ratio of MAYO's alpha* to plain UOV's alpha
      at matched claimed level is reported alongside; a value below 1.5 would mean whipping does not
      materially move the underdetermination axis and would remove the record's main claim.
  - metric: kipnis_shamir_exponent_dilation
    direction: different
    minimum_effect: >-
      EXACTLY k, in the protective direction, reported in the SAME table as the adverse alpha
      dilation. A table reporting only one of them is incomplete by this record's own standard.
  test_boundary:
    instances:
    - Every declared MAYO parameter set, at whatever k, n, m, o the specification states
    - Plain UOV at Level I and Rainbow, as positive controls
    - 'A toy whipped instance over a small field, for the oil-dimension confirmation'
    parameters:
      arithmetic: exact integer, no floating point anywhere
      k_sweep: 'graded control over k in {1, 2, 3, 4, 6, 9, 12} at fixed underlying (n, m, o)'
      toy_confirmation: pure Python exact linear algebra over a small field, seconds
    implementation: >-
      Exact integer and rational arithmetic in Python; pure-Python linear algebra over a small field
      with log tables for the toy confirmation. No computer-algebra system, no solver, no
      randomness, no network beyond the reading stage.
    budget:
      wall_clock_seconds_per_run: 600
      maximum_memory_gb: 2
  falsification_conditions:
  - >-
    The Round-3 whipped map is not of the stated form. I2 through I4 are void as written and must be
    re-derived; this is the most likely single failure of the record and saying so is the
    deliverable.
  - >-
    The whipped oil dimension is measurably larger than k o at toy parameters. I0 fails, and the
    failure is far more interesting than the record - it would mean whipping CREATES oil structure,
    which is the goal's primary target.
  - >-
    Any MAYO parameter set has 2o at least n, i.e. the intersection attack in range for the
    underlying map. The 'whipping buys oil-geometry safety' reading is then wrong for that set.
  - >-
    The underdetermination dilation is anything other than k. Either an arithmetic error or a
    whipped map whose equation count is not m.
  - >-
    The k = 1 null returns any ratio other than exactly 1. A k-dependence has been smuggled into the
    derivation and every treatment number is uninterpretable.
  - >-
    The positive controls misclassify plain UOV or Rainbow as intersection-attack out of range. The
    applicability rule or the recalled threshold is wrong and NO conclusion about MAYO may be
    reported.
  interpretation_limits:
  - >-
    NO ATTACK IS PROPOSED AND NO COST IS CLAIMED. This is a parameter-level derivation, claim tier
    theory/derivation, and it may not be cited as evidence about any MAYO parameter set's security.
  - >-
    A confirmed set of identities does NOT establish that whipping is security-neutral. It
    establishes that whipping is neutral for attacks that read only the parameter triple. A
    whipping-induced structural weakness at fixed parameters is invisible to this object by
    construction.
  - >-
    RATIO IS NOT COST. alpha* equal to k alpha is a statement about a ratio. Whether a k-fold larger
    alpha costs 1 bit or 30 depends entirely on the underdetermined-MQ cost model, which this record
    does not supply. Reading it as 'MAYO is weaker than UOV by a factor k' would be exactly the
    partial-cost error AGENTS.md rule 4 forbids.
  - >-
    RETRODICTION IS NOT EVIDENCE. Any agreement with a figure already in the corpus is recorded as a
    consistency check on the derivation and given no evidential weight, because a reader cannot
    verify from the record that the derivation was not fitted to it.
  - >-
    Nothing here bears on the intersection attack's correctness or on any other goal's calibration
    of it. The identities are relative statements that hold under whatever cost convention is fixed.
  prior_evidence_refs: []
