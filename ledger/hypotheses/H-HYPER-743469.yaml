# H-HYPER-743469 — specified from IDEA-20261005-0aecda.
# Protocol approval is DEC-20261006-2a89a2. This record asserts no
# identity of Cantor doubling with a Richelot codomain, no Prym
# dimension, and no ECDLP exponent change. No Cantor doubling has
# been run. The design session expanded the named products and
# checked the Mumford congruence by divisibility. It did not open
# the PDFs named by KN-LIT-1371 or KN-LIT-921.
hypothesis:
  id: H-HYPER-743469
  question_id: RQ-HYPER-7ca025
  source_proposal: IDEA-20261005-0aecda
  goal_id: null
  goal_id_note: >-
    ledger/questions/RQ-HYPER-7ca025.yaml does not name a goal_id on the
    head read at design time. This design does not attach one and does
    not edit a goal file.
  status: approved
  status_note: >-
    approved means the measurement protocol in EXP-HYPER-a09993 is
    approved for a later executor. It does not mean the doubling claim
    is supported. Status moves only by DEC-20261006-2a89a2 under the
    standing user authorization of 2026-09-06. This design session
    wrote no run artifact.
  proposed_by: coordinator
  conversion_note: >-
    The two curves, the divisor (x^2 + 1, 0), the degree-5 rejection,
    the nontorsion divisor (x, 2), and the falsification conditions are
    carried from IDEA-20261005-0aecda. The Coordinator added the
    expanded polynomials as an instance checksum, the squarefree check,
    and the rule that failure of either half of the prediction is a
    negative.

  statement: >-
    TEST BOUNDARY. Two named curves over F_11, and no others. Curve C6,
    the sextic, is y^2 = f with
    f = (x^2 + 1)(x^2 + x + 2)(x^2 + 2). Curve C5, the degree-5 null,
    is y^2 = g with g = (x^2 + x + 2)(x^2 + 2)(x - 1). The input pair
    is the Mumford candidate D2 = (u, v) = (x^2 + 1, 0). The nontorsion
    control on C6 is Dn = (u, v) = (x, 2).

    PRE-REGISTERED PREDICTION, fixed before any executor run. One run
    of Cantor doubling on C6 sends D2 to the zero class of the Jacobian
    of C6. The same pair D2 is rejected on C5, because x^2 + 1 does not
    divide g, and a rejected input is not doubled. Failure of either
    half is a negative. Separately, doubling Dn on C6 returns a class
    that is not zero. No Richelot codomain triple (U, V, W) is computed.
    No Prym dimension is computed. No ECDLP exponent is in scope.

    DISTINGUISHABLE OUTCOMES. (1) D2 doubles to zero on C6, C5 rejects
    D2, Dn doubles to a nonzero class, and the two acceptance
    implementations agree: the order-2 reading holds on this sextic.
    (2) Doubling D2 on C6 does not return zero: the first half fails.
    (3) C5 accepts D2: the second half fails. (4) Dn doubles to zero:
    the order-2 outcome was not special to D2. (5) The two acceptance
    implementations disagree, or the infinity convention is unstated:
    the order claim is unsigned.

  mechanism: >-
    Two explanations are separated before the run. Order reading: the
    roots of one quadratic factor of a squarefree sextic are Weierstrass
    points, their Mumford sum has order 2, and doubling is the zero
    class. Invalid-input reading: the same pair is not a divisor on a
    quintic that this quadratic does not divide, so a group-law step
    that returns zero there is not seeing a Jacobian. A third outcome,
    doubling of (x, 2) to zero, means every tested rational divisor
    looked like torsion and the order-2 signal is not distinguished.
    The codomain of a (2,2)-isogeny is not the object.
    LOSSY-PROJECTION TEST. The underlying group is the Jacobian of
    y^2 = f. Operation set Sigma is doubling, not translation on a
    prime-order elliptic subgroup. The projection keeps the class of D2
    and discards the choice of Mumford representative. Compatible with
    Sigma: doubling is defined on classes. Lossy: more than one reduced
    representative can be written before reduction, and the zero class
    is a proper quotient of the set of representatives.

  assumptions:
    - C6 has two points at infinity, and the zero class is the identity of that Jacobian in the infinity convention the executor states.
    - Mumford's congruence v^2 congruent to the curve polynomial modulo u is the acceptance test.
    - This session expanded f to x^6 + x^5 + 5x^4 + 3x^3 + 8x^2 + 2x + 4 over F_11 and g to x^5 + 3x^3 + 9x^2 + 2x + 7 over F_11. Remainder of f by x^2 + 1 was 0. Remainder of g by x^2 + 1 was the constant 9. gcd of each polynomial with its derivative was 1. f(0) = 4 = 2^2. This is instance selection. It is not a run of Cantor doubling.
    - No formula from the unread PDFs is used. KN-LIT-1371 and KN-LIT-921 were opened as markdown notes only.

  proof_search_map:
    bottleneck: >-
      One Cantor doubling of D2 on C6, which this session did not run.
      Removing that step leaves the divisibility check and does not
      decide the order of the class.
    baseline_embedding:
      parameter_slice: >-
        The opened notes KN-LIT-1371 and KN-LIT-921 name a Richelot
        triple and a squared Kummer pairing. Neither states this
        doubling. This hypothesis does not move an ECDLP exponent and
        does not reproduce those formulae.
      reproduction_check: >-
        Re-expand the named products and recompute the two remainders.
        Agreement with the checksums above is the instrument. It is not
        a doubling.
    observation_collision:
      observable: >-
        The class of D2 after one doubling on C6, together with the
        accept-or-reject bit of D2 on C5.
      distinct_preimage_search: >-
        Two nearby outcomes can be mistaken for that observable. The
        zero class of Dn is a different divisor. A Richelot triple
        (U, V, W) is a different object and is not computed. A Prym
        dimension is a different object and is not computed.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The triple of indicators (D2 doubles to zero on C6, C5
          rejects D2, Dn does not double to zero), predicted 1, 1, 0.
        predicted_gain: >-
          None on an ECDLP exponent. A failed indicator changes the
          triple and does not by itself move an exponent.
    quantifier_order: >-
      For this one sextic over F_11 and this one quintic, the predicted
      indicators are 1, 1, and 0. The statement does not quantify over
      every sextic, every prime, or every genus-2 Jacobian. Swapping
      those quantifiers would claim a theorem this hypothesis refuses.
    method_ceiling:
      strongest_certifiable_claim: >-
        Three indicators on two named curves over F_11, plus agreement
        of two acceptance implementations. No attack, no exponent
        change, no Richelot triple, and no Prym dimension.
      nearby_object_control: >-
        C5 is the nearby object of the same input shape on which the
        conclusion "this pair is a Jacobian divisor" is known false,
        because x^2 + 1 does not divide g. Dn is the nearby divisor on
        C6 on which the conclusion "every rational divisor doubles to
        zero" is predicted false.
    proof_obligations:
      - claim: The doubling indicator on C6 is the class the executor records, not a label without a representative.
        responsibility: correctness
      - claim: C5 contributes an accept-or-reject bit and is not doubled when rejected.
        responsibility: interface
      - claim: The indicators are claimed only for these two curves over F_11.
        responsibility: scope
    not_applicable_reason: >-
      The four audits are filled because the measurement has a
      bottleneck, a checksum, a collision with two nearby objects, a
      quantifier, and a ceiling. The map is not a proof of a group law
      and not an ECDLP result.

  rerandomization: >-
    This hypothesis does not use a re-randomizing walk. Doubling is the
    operation under test. No discrete log is pulled back to an elliptic
    subgroup.

  asymptotic_claim:
    problem: >-
      Whether one named Mumford class on one sextic over F_11 has order
      2 under Cantor doubling, and whether the same input is outside the
      degree-5 null. The ECDLP is not claimed to be easier.
    prior_best: >-
      No ECDLP algorithm is improved. The opened notes state a Richelot
      triple and a squared Kummer pairing. They do not state this
      indicator triple.
    time_exponent: unchanged
    memory_exponent: unchanged
    hidden_cofactor: >-
      No algorithmic o(1) term is claimed. One doubling and two
      congruence checks are the whole test.
    claim_kind_note: >-
      No exponent improvement, cofactor improvement, or constant-factor
      improvement is claimed, so none of those three labels is applied.

  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        For this squarefree sextic over F_11, the Mumford class of the
        monic quadratic factor x^2 + 1 with v = 0 has order 2 under one
        Cantor doubling, and the same pair is rejected on the named
        quintic. This imitates the classical fact that a Weierstrass
        point on an odd-degree hyperelliptic curve has order 2,
        transferred to one even-degree model at q = 11, with no claim
        beyond that model. There is no probability and no random model.
      random_model_justification: >-
        There is no random model. Nothing is asserted to behave like a
        uniform random object of a given size. The support is one
        doubling and one rejection on the named inputs.
      supporting_results:
        - ref: KN-LIT-1371
          provenance: internal
          claim: >-
            The markdown note states a derivative-free Richelot
            formulation by first subresultants and a certified triple
            (U, V, W). It states no Mumford divisor and no Cantor double.
            This hypothesis does not adopt a formula from that note.
          verified_by: >-
            Design session 2026-10-06, which opened
            knowledge/literature/KN-LIT-1371.md and did not open
            downloads/2025-2145.pdf.
      validation_experiment_ids:
        - EXP-HYPER-a09993
      falsification_condition: >-
        Doubling D2 on C6 does not return the zero class, or C5 accepts
        D2, or doubling Dn on C6 returns the zero class. Any of those
        falsifies HEUR-1 at this sextic. No second prime and no transfer
        to cryptographic genus-2 parameters.

  structural_ingredients:
    - description: >-
        Title-and-abstract markdown note for a derivative-free Richelot
        formulation. States a certified triple (U, V, W). States no
        Mumford class and no Cantor output. The local PDF was not opened.
      citation: KN-LIT-1371
      provenance: internal
      verified_by: knowledge/literature/KN-LIT-1371.md
      role: nearby note that must not be substituted for a doubling
    - description: >-
        Markdown note on Richelot isogenies and a squared symmetric
        pairing on squared Kummer surfaces. States no Cantor output.
        The local PDF was not opened.
      citation: KN-LIT-921
      provenance: internal
      verified_by: knowledge/literature/KN-LIT-921.md
      role: nearby note that must not be substituted for a doubling
    - description: >-
        Recalled pointer, not opened. Cantor's algorithm adds reduced
        divisors on a hyperelliptic Jacobian. Not support for the
        order-2 claim.
      citation: Cantor 1987
      provenance: recalled
      verified_by: null
      role: pointer to the algorithm the executor is asked to implement
    - description: >-
        Frobenius-invariant factor bases on subfield Koblitz curves cut
        the number of systems by up to 1/n and speed linear algebra by
        n^2. That is not one Cantor doubling.
      citation: KR-IC-b0fcda
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-b0fcda.yaml
      role: frontier row positioned against, and not used

  reduction_chain:
    core_problem: >-
      Whether doubling sends (x^2 + 1, 0) to zero on the named sextic,
      and whether the named quintic rejects that input.
    corollaries: []
    corollaries_note: >-
      No published reduction is invoked. Three indicators do not cascade
      to an ECDLP corollary, a Richelot identity, or a Prym dimension.

  predictions:
    - metric: indicator that doubling (x^2 + 1, 0) on C6 returns the zero class
      direction: higher
      minimum_effect: 1
    - metric: indicator that C5 rejects (x^2 + 1, 0)
      direction: higher
      minimum_effect: 1
    - metric: indicator that doubling (x, 2) on C6 returns the zero class
      direction: lower
      minimum_effect: 0

  test_boundary:
    instances:
      - C6 over F_11, y^2 = (x^2 + 1)(x^2 + x + 2)(x^2 + 2)
      - C5 over F_11, y^2 = (x^2 + x + 2)(x^2 + 2)(x - 1)
      - D2 = (x^2 + 1, 0)
      - Dn = (x, 2) on C6
    parameters:
      field: F_11
      sextic_checksum: x^6 + x^5 + 5x^4 + 3x^3 + 8x^2 + 2x + 4
      quintic_checksum: x^5 + 3x^3 + 9x^2 + 2x + 7
      predicted_indicators: [1, 1, 0]
    implementation: >-
      Implement acceptance by the Mumford congruence in two ways, and
      one Cantor doubling. State the infinity convention. Do not
      evaluate a Richelot triple and do not compute a Prym dimension.
    budget:
      enforcement: advisory
      maximum_runs: 1
      note: >-
        One doubling and the rejection check. Time and memory watches
        live on the experiment contract. They are advisory.

  falsification_conditions:
    - Doubling (x^2 + 1, 0) on C6 does not return the zero class.
    - C5 accepts (x^2 + 1, 0).
    - Doubling (x, 2) on C6 returns the zero class.
    - The two acceptance implementations disagree on either curve.
    - The writeup states an ECDLP exponent improvement, a Richelot identity, or a Prym dimension.

  interpretation_limits:
    - One sextic over F_11 and one quintic. No identity of Cantor doubling with a Richelot codomain is claimed.
    - A zero class here is not a count of the (2,2)-kernel and not a Prym dimension.
    - Not an attack claim. No ECDLP exponent is in scope.
    - The design-session expansion is a checksum. It is not a recorded run of Cantor doubling.

