  title: >-
    The four-subset power count is exactly one third.
  statement: >-
    With pool size 2^33, the exact two-subset count divided by 2^129
    equals 2^{-64} times (1 - 2^{-33}). The four-subset power count
    2^{132} / 24 divided by 2^129 equals 1/3. Since 243 is below 256,
    1/3 lies strictly above 2^{-8/5}, and since 8 is below 9 it lies
    strictly below 2^{-3/2}. The three-subset power count 2^{-31} / 3
    lies strictly above 2^{-163/5} and strictly below 2^{-65/2}. The
    five-subset power count equals 2^{33} / 15, which lies strictly
    above 2^{29} and strictly below 2^{291/10}, because 15^{10} exceeds
    2^{39}. The two-list exponents are 66 at subset sizes 3 and 4, and
    99 at subset size 5. A hit rate 2^{33} / 2^{131} equals 2^{-98}.
    The bit count 2^{33} times 389 lies strictly above 2^{41} and
    strictly below 2^{42}, exceeding 2^{41} by 133 times 2^{33}. The
    written difference 2^{304/5} - 2^{583/10} lies strictly above
    2^{121/2}, so 2^{66} divided by that difference lies strictly below
    2^{11/2}.
  mechanism: >-
    The proposal prices zero-sum subsets of a known-log pool by powers
    of two. This contract checks those powers. It does not search a
    pool.
