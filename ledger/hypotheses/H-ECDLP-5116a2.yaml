  title: >-
    8192 exceeds 4096 by 4096
  statement: >-
    A window of width 14 stores 8192 entries. A window of width 13
    stores 4096. Two to the power 13 is 8192. Two to the power
    12 is 4096. Eight thousand one hundred ninety-two exceeds four
    thousand ninety-six by 4096. The product of the two table sizes is
    33554432. Their sum is 12288. Two width-13 tables
    each store 4096, so that gap is 0 and their product is
    16777216.
  mechanism: >-
    The proposal writes the widths 14 and 13 and the sizes 8192 and
    4096. This contract checks those integers. It does not add a
    curve point.
