hypothesis:
  id: H-ECDLP-3b589b
  question_id: RQ-FIND-001
  statement: >-
    The three generic-group simulability findings are statements about ORACLES -
    augmentations of the group-operation oracle whose outputs a simulator can
    produce from the group structure alone - and their force is exactly the
    generic lower bound they inherit. By construction they say nothing about
    resources that are not group-oracle outputs: field-level x-coordinate data,
    lifts to a different group, and pairings into a different group. The
    hypothesis is that a census of every record citing one of the three as a
    CLOSURE will find a conformance rate high but strictly below 1, that
    essentially every non-conformance is an OVER-application rather than an
    under-application, and that a small but nonzero number of field-data,
    lift or pairing ideas were declined or downgraded with one of the three
    cited as the reason. Source proposal: IDEA-20260808-ea3b4f.
  mechanism: >-
    A closure's force comes from a model, and a model has a boundary. Citations
    migrate across that boundary silently because a finding's TITLE names the
    conclusion - closed - without naming the model's input assumption. The
    generic group model hides the encoding, so a method whose input is the actual
    field element rather than an oracle response is outside the model by
    construction, which is precisely why prime-field index calculus remains an
    open problem rather than a closed one. The corrective is the same as for any
    measurement: state the boundary in the record, then check empirically whether
    uses respect it. The failure mode being bounded is FALSE NEGATIVES in
    ideation - a generator under time pressure self-censoring a legitimate
    field-data idea - which the inventor protocol names as symmetric with
    overclaiming and which is invisible unless someone counts.
  assumptions:
    - >-
      That the three findings are statements about oracle simulability in the
      generic group model. Supported by their committed titles, which this design
      session read verbatim: "Jet and endomorphism ECDLP oracles are GGM-simulable
      with O(1) overhead, closing their ..."; "GGM closure of incidence and
      endomorphism oracle classes for prime-field ECDLP"; "C_t-minimality theorem
      - the threshold oracle is the minimal non-simulable order-based factor-base
      identifier". Only the title lines were read; the bodies were not opened and
      the experiment must open them before classifying.
    - >-
      That a resource taxonomy exists in the corpus and is the classification
      scheme. VERIFIED 2026-09-04: it is the R1-R8 table in
      analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md section 2,
      exactly where IDEA-20260808-ea3b4f and IDEA-20260808-8e13ff say it is. The
      experiment still re-quotes and hashes it at run time so the classification
      is bound to a recorded version, but its existence and location are no longer
      open.
    - >-
      That the open problem asking whether index calculus beats the generic
      baseline for prime-field ECDLP is open, which is itself evidence that the
      field-data resource is not closed by any generic-group result. Not verified
      by this design session; the experiment must read its status.
    - >-
      IMPORTANT STALENESS CORRECTION, FLAGGED. The source proposal carries a
      "PAUSE FLAG" stating the owning goal is paused. That is STALE as of
      2026-09-04: this design session read ledger/goals/GOAL-FIND-001.yaml and
      found `status: completed`. The experiment must re-read the current status
      rather than inherit the pause flag.
    - >-
      That the corpus size is a moving target, so every count over the corpus is
      reported as a FLOOR with its enumeration rule, never as an exact number.
  proof_search_map:
    bottleneck: >-
      The step whose removal changes what gets proposed is the instruction to
      generators not to propose against these findings without an explicit reason
      why the idea escapes the closure. That instruction is correct for
      oracle-shaped proposals and over-broad for field-data, lift and pairing
      shaped ones.
    baseline_embedding:
      parameter_slice: >-
        The exact boundary is the generic group model itself: the encoding of
        group elements is a random injection and field-level data about
        x-coordinates is not available to the algorithm.
      reproduction_check: >-
        Two records known to cite the findings correctly, submitting NEW oracle
        classes to a simulability audit, must be classified conformant.
    observation_collision:
      observable: 'A conformant / non-conformant label per citation.'
      distinct_preimage_search: >-
        PERFORMED. Many citations share a label, and the label carries no
        mathematics. The specific collision risk is that a field-data method may
        be oracle-shaped in disguise - a factor-base membership test IS an oracle
        - and mislabelling those would overstate the defect. The classification
        rule must handle that case explicitly and is frozen before the census.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          A per-citation table with the cited-against method's resource class and
          the conformance label, and for each non-conformance the specific
          statement the record would need to add.
        predicted_gain: >-
          Bounds a false-negative failure mode at a few hours of hand
          classification, with a cheap and informative null outcome.
    quantifier_order: >-
      FOR ALL records citing one of the three findings as a closure, the
      cited-against method is oracle-shaped OR the record supplies an additional
      argument covering the non-oracle resource. The existential the census looks
      for is THERE EXISTS a citation against a field-data, lift or pairing
      method with no covering argument.
    method_ceiling:
      strongest_certifiable_claim: >-
        That, under a classification rule fixed before the census, certain
        citations do or do not stay inside the model their source rests on. It
        CANNOT show any closure is wrong; at most it shows some uses of a correct
        closure exceed its scope. It creates no permission to propose an
        oracle-shaped idea against the three findings.
      nearby_object_control: >-
        A synthetic citation that is unambiguously non-conformant - a field-data
        index-calculus idea declined with one of the three as the sole reason -
        which the classifier must flag; and two real conformant citations it must
        not flag.
    proof_obligations:
      - claim: The classification rule is fixed and hashed before the census
        responsibility: baseline
      - claim: The classifier marks the two known-conformant citations conformant
        responsibility: interface
      - claim: The classifier flags the synthetic non-conformant citation
        responsibility: interface
      - claim: Citations used as CONTEXT are distinguished from citations used as a REASON
        responsibility: correctness
      - claim: The census establishes nothing about elliptic curves
        responsibility: scope
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-CENSUS-1
      formal_statement: >-
        NO HEURISTIC IS LOAD-BEARING. The census is an enumeration with a fixed
        criterion; its output is a count, not an estimate. This entry exists to
        record that the record's central quantity is unconditional given its
        classification rule, and correspondingly limited: it can only establish
        facts about citations.
      random_model_justification: >-
        Not applicable. The one substantive definition it rests on is the generic
        group model itself, in which the encoding of group elements is a random
        injection and field-level x-coordinate data is unavailable to the
        algorithm.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-7c9150
      falsification_condition: >-
        The classifier marks a known-conformant citation non-conformant, or fails
        to flag the synthetic non-conformant one. The criterion is then not
        determinate and every count is void.
  structural_ingredients:
    - description: >-
        The three findings' committed titles, which fix that their subject is
        oracle simulability rather than resources generally.
      citation: 'knowledge/findings/KN-FIND-002.md; knowledge/findings/KN-FIND-b7e091.md; knowledge/findings/KN-FIND-982fdf.md'
      provenance: internal
      verified_by: >-
        Coordinator subagent under TASK-20260904-43152a read the title line of
        all three files by pattern search on 2026-09-04 and CONFIRMS the source
        proposal quotes them faithfully. ONLY THE TITLE LINES WERE READ; the
        bodies, their scope statements, and their evidence tiers were NOT opened,
        so nothing about what those findings actually establish is asserted here
        beyond their titles. The experiment must open all three bodies before any
        citation is classified.
      role: >-
        Fixes the model boundary the census checks citations against.
    - description: >-
        The R1-R8 resource taxonomy, whose own "Why it escapes the GGM" column
        states the model boundary this hypothesis rests on, quoted verbatim: R1
        `x`-coordinates as field elements (index calculus, Semaev) - "the oracle
        returns field data, not group elements"; R6 lifts to `Z_p` / char 0 - "a
        different group"; R7 pairings into `F_{p^k}` - "a different group". The
        same section states the admissibility filter: "Any lane in this campaign
        must therefore name a resource that is not a group-operation output."
      citation: 'analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md section 2'
      provenance: internal
      verified_by: >-
        Coordinator subagent under TASK-20260904-43152a opened
        analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md on
        2026-09-04 and read section 2 VERBATIM, reproducing the three rows and
        the filter sentence above from that read. THIS MATERIALLY STRENGTHENS THE
        HYPOTHESIS: the claim that a generic-group closure cannot speak to R1, R6
        or R7 is not this record's inference but the corpus's own committed
        statement, in the same document that supplies the classification scheme.
        The same section also records that the incidence and endomorphism-image
        oracles are GGM-simulable and hence closed, so the document holds both
        halves - the closure and its boundary - and the census measures only
        whether citations respect the boundary.
      role: >-
        Supplies both the classification scheme and the committed statement of
        why the three closures cannot reach R1, R6 or R7.
  reduction_chain:
    core_problem: >-
      Whether uses of three generic-group closures in this corpus stay inside the
      model those closures rest on, and whether any legitimate idea was suppressed
      by an over-broad citation.
    corollaries: []
  predictions:
    - metric: >-
        conformance rate of closure citations - the fraction of citing records
        classified conformant under the frozen criterion (dimensionless, with the
        citing-record count reported as a measured floor)
      direction: different
      minimum_effect: >-
        High but STRICTLY BELOW 1. The predicted direction is that at least one
        non-conformant citation exists, most likely in round-level or
        summary-level scaffolding rather than in a ledger record. A rate of
        exactly 1 falsifies the concern and is a clean, useful null.
    - metric: >-
        asymmetry of the failure - for each non-conformant citation, whether it
        makes the claim STRONGER (closure over-applied) or WEAKER than its source
        (integer counts in each direction)
      direction: different
      minimum_effect: >-
        Essentially all over-application, none under-application, because a
        closure is quoted to save work and never to create it. A substantial
        under-application count would mean the classifier is measuring something
        else.
    - metric: >-
        number of field-data, lift or pairing ideas declined or downgraded with
        one of the three findings cited as the reason (integer count)
      direction: different
      minimum_effect: >-
        Small but nonzero. Each such case is a candidate for regeneration, which
        is the census's actual payoff. Reported as measured; zero is a legitimate
        outcome.
    - metric: >-
        classifier control outcomes - two known-conformant citations and one
        synthetic non-conformant citation (three booleans)
      direction: different
      minimum_effect: >-
        Conformant, conformant, flagged. Any other result means the classifier is
        too strict or too lenient and its counts are meaningless.
  test_boundary:
    instances:
      - 'Every record in the ledger and idea trees citing one of the three findings, count reported as a measured floor.'
      - 'Two records known to submit new oracle classes to a simulability audit, as the conformant controls.'
      - 'One synthetic non-conformant citation constructed by the driver.'
      - 'A four-rung graded ladder of synthetic citations at increasing distance from the model boundary.'
    parameters:
      classification_rule_frozen_before_grep: true
      resource_taxonomy_quoted_before_classification: true
      independent_second_classification_sample: 0.2
      corpus_count_reported_as: floor
    implementation: >-
      A pattern search over the ledger and idea trees for the three identifiers,
      followed by hand classification of each hit against the quoted resource
      taxonomy. No compute.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 0.5
      maximum_memory_gb: 8
      maximum_runs: 3
  falsification_conditions:
    - >-
      Zero non-conformant citations across the whole examined corpus. The concern
      is unfounded, the check is retired, and the finding is that the corpus
      respects its own model boundaries - a clean and useful null.
    - >-
      A demonstration that the three findings DO cover field-level data - for
      example a simulator that reproduces x-coordinate field data. Then the
      closures are broader than this record says and the record is wrong in the
      direction that matters, since it would mean prime-field index calculus is
      closed, which would contradict the open problem and would be a far larger
      event requiring immediate independent review.
    - >-
      The classifier marks either known-conformant control non-conformant, or
      fails to flag the synthetic one. The criterion is not determinate and every
      count is void.
    - >-
      The graded ladder does not separate its four rungs. The classifier is not
      resolving distance from the model boundary and its labels are void.
  interpretation_limits:
    - >-
      This audits CITATIONS, not mathematics. It cannot show any closure is
      wrong; at most it shows some uses of a correct closure exceed its scope.
    - >-
      It creates NO permission to propose an oracle-shaped idea against the three
      findings. Any record it flags must still meet the ordinary bar on its own
      merits.
    - >-
      No status changes. Only the Coordinator may make those, and nothing here
      performs one.
    - >-
      THIS ESTABLISHES NOTHING ABOUT ELLIPTIC CURVES OR THE ECDLP. The census
      reads citations. A curve-free object - any corpus of citations to any
      closure - would produce the same kind of output, so the scope statement is
      unconditional and declared in advance.
    - >-
      NOT TESTABLE AT REACHABLE SCALE, IN THE ONLY SENSE THAT APPLIES: whether
      the three closures are CORRECT is not tested and cannot be tested by
      counting citations. Nor can the census establish whether any suppressed
      idea would have succeeded; it can only count the suppressions.
    - >-
      The author of the source proposal was an idea generator in a round whose
      own citations would be classified. The classification must be done by a
      different session; that is a requirement, not a caveat.
    - >-
      The source proposal's pause flag on the owning goal is STALE; the goal
      reads `completed` as of 2026-09-04.
  status: proposed
  proposed_by: coordinator
  source_refs:
