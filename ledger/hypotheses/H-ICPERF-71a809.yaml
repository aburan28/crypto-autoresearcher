# =============================================================================
# H-ICPERF-71a809 -- Side-constrained core leaf-count reduction (GOAL-ICPERF-e6b6a4
# / RQ-ICPERF-94c86e). Specified from IDEA-20260915-eee7e4; folds
# IDEA-20260926-a79052 (DX-04 / DEC-20260928-63addc) as Stage-0 membership /
# E-NULL inspection arm. Approved DEC-20261002-74ce9e.
#
# Load-bearing: (A) s(x)=Tr(x+a+b/x^2)=0 characterises E-side x-coords;
# (B) constraining each core block to V_E = V ∩ x(E) is sound and shrinks
# the DPLL leaf count from |V|^3 to |V_E|^3 ~ 2^{3(l-1)}; (C) WDSat conflict
# ratio unconstrained/constrained in [6,8] (blocking) or [7.5,8.5]
# (re-encoding) on side-0 certified-U; (D) constrained S answers have zero
# twist-side roots. a79052 arm: re-derived membership identity + oracle-A
# E-NULL inspection may close that seam item at zero compute. ZERO RUNS in
# this design packet. No Magma/Sage/AUXIN/Bedrock. No attack. No exponent.
# Singular success/falsification criteria live on the EXP.
# =============================================================================
hypothesis:
  id: H-ICPERF-71a809
  question_id: RQ-ICPERF-94c86e
  source_idea: IDEA-20260915-eee7e4
  related_idea_ids:
    - IDEA-20260926-a79052
    - IDEA-20260915-3f1964
    - IDEA-20260915-0d8e90
    - IDEA-20260915-3476de
  experiment_id: EXP-ICPERF-a5a78a
  goal_id: GOAL-ICPERF-e6b6a4
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-74ce9e
  status: analyzed
  status_history:
    - status: proposed
      at: '2026-10-02'
      by: coordinator
      note: minted from IDEA-20260915-eee7e4 under design-experiment
    - status: approved
      at: '2026-10-02'
      by: DEC-20261002-74ce9e
      note: >-
        Standing user authorization; protocol complete; Stages 0-1
        execution authorized.
    - status: analyzed
      at: '2026-10-03'
      by: DEC-20261003-d003b7
      note: >-
        Evidence review EV-ICPERF-090b10 / DEC-20261003-d003b7: Stage 0
        S0-FREEZE-OK; Stage 1 O-IMPEDIMENT (WDSat not on PATH);
        scientific ratios unread; decision refine; strength
        inconclusive. Missing WDSat is not negative mathematical
        evidence against this hypothesis.
  proposed_by: coordinator
  title: >-
    Side-constrained core: E-membership per block shrinks WDSat UNSAT leaf
    count by ~8x without losing E-decompositions; a79052 membership /
    E-NULL arm folded at Stage 0

  statement: >-
    CLAIM (measurement / constant-factor mechanism; DX-04 survivor of
    DEC-20260928-63addc; NO ATTACK; NO EXPONENT). Setting: E/F_{2^n},
    V = {deg x < l}, Trimoska descended S_4, WDSat default core-first.
    (A) EXACT STRUCTURE. For x != 0, x is an F_q-point x-coordinate of E
    iff s(x) := Tr(x + a + b/x^2) = 0 (IDEA-20260915-3f1964 side bit).
    (B) SOUND CONSTRAINT. Restricting each of the three core blocks to
    V_E = V ∩ x(E) — by blocking clauses (~2^{l-1} width-l clauses per
    block) or by a bijective (l-1)-bit re-encoding — loses no
    E-decomposition of a side-0 target and reduces the leaf count to
    |V_E|^3 ~ 2^{3(l-1)}. (C) PREDICTION (H1 + counting). On side-0
    certified-U targets at cells (17,6), (19,6), (21,7), the ratio of
    median UNSAT conflicts unconstrained/constrained lies in [6, 8]
    (blocking) or [7.5, 8.5] (re-encoding); constrained c =
    conflicts/|V_E|^3 lies in [0.85, 1.05] unless a sub-exhaustive signal
    (<0.5) appears. (D) S COLUMN. Constrained S instances return zero
    twist-side roots among >=40 S instances per cell; every table-known
    E-decomposition is recovered (soundness). (E) WALL. Median wall_s
    ratio unconstrained/constrained >= 4. FOLDED ARM (a79052): Stage 0
    re-derives the Koblitz membership identity Tr(x)=Tr(1/x)+Tr(a) and
    inspects oracle-A sampling for E-NULL; that inspection alone may
    close the a79052 seam item at zero compute without authorizing a
    separate EXP. CLAIM TIER: measurement / constant-factor. PTR-ICPERF
    routes design to GOAL-ICPERF-e6b6a4.

  mechanism: >-
    OBJECT FRAME. Representation R1: x-coordinates in an F_2-basis of
    the Trimoska subspace V. Operation set: block-level DPLL assignment
    of each core block's l bits. Tracked object: the side bit s(x_i) of
    each core block — a Boolean function of the block alone. LOSSY-
    PROJECTION TEST: (x_1,x_2,x_3) -> (s(x_1),s(x_2),s(x_3)) discards
    l-1 bits per block and propagates deterministically under block
    assignment; it is exactly the 3f1964 classification object moved
    into the solver as an alphabet filter. KN-OPEN-020: bounded-degree
    linear subspace factor base, scoped-out; unchanged. STAGE: per-
    attempt SAT PDP solve cost (relation collection). MECHANISM: filter
    each block alphabet from V to V_E so twist-side leaves (fraction
    ~7/8 under balance) are never explored; encoding is sound for
    side-0 targets. a79052 supplies the Koblitz-sibling membership
    identity and the E-NULL sampling inspection as a zero-compute /
    toy-mix arm, not a second exponent claim.

  assumptions:
    - >-
      WDSat core-first branching assigns the l bits of one block
      consecutively (P3a of H-ICPERF-cc4847, unreviewed). If bits of
      different blocks interleave, the conflict ratio may fall toward
      [2, 6]; that is a named confound, not evidence against (A).
    - >-
      Targets in the attack reading are side-0 (R in the subgroup is on
      E); primary metrics are on side-0 certified-U and on S targets
      from the IDEA-20260915-3f1964 table.
    - >-
      Extra clauses append to DIMACS/ANF after generation; if the
      vendored XOR-module rejects mixed input, use the re-encoding
      variant as the primary constrained arm.
    - >-
      OFF-LIMITS: Magma/Sage/AUXIN/Bedrock as success path; editing
      IDEA-20260915-eee7e4 / IDEA-20260926-a79052 claim text; editing
      shared GOAL-ICPERF-e6b6a4/goal.yaml; deployed-curve ECDLP solves;
      treating missing WDSat as evidence against (B)-(E).
    - >-
      Missing / unbuildable WDSat → O-IMPEDIMENT; never negative
      mathematical evidence (AGENTS.md rule 5).

  heuristics:
    - id: H1
      statement: >-
        Within V = {deg x < l}, the side bit s(x) is balanced and its
        restriction to each pair {v, v+theta^{l-1}} is independent of
        the pair, so |V_E|/|V| ≈ 1/2 and depth-(l-1) completion counts
        are Binomial(2, 1/2).
      rigorous_support: >-
        RIGOROUS: s(x) = Tr(x) + Tr(a) + Tr(b/x^2); Tr(x) is F_2-linear.
        HEURISTIC: Tr(b/x^2) behaves like a Kloosterman-type character
        sum whose bias over an affine subspace is bounded in the Weil
        style over the whole field; over a subspace the bound is weaker
        and is imitated, not proved. Proposal-time counts at l=5,6 showed
        balance within 3%.
      falsification_condition: >-
        Exhaustive tabulation on V for a primary cell with |V_E|/|V|
        outside [0.4, 0.6], or pair-completion histogram far from
        (1/4, 1/2, 1/4) after the Stage-0 census.
      validation_plan: >-
        Exhaustively tabulate s on V for every cell up to l=8 and for
        100 random l-dimensional subspaces per n in {17,19,21}; compare
        |V_E|/|V| to 1/2 ± 2^{-l/2}; report the fraction of subspaces
        outside [0.4, 0.6] against the binomial tail.

  heuristic_note: >-
    (A) is exact (side criterion). (B) soundness is a correctness claim.
    (C)-(E) are H1 plus the leaf-count reading of WDSat cost under
    core-first order. a79052's membership identity is re-derived
    algebraically at Stage 0; its E-NULL reading is an inspection.

  proof_search_map:
    bottleneck: >-
      Per-instance UNSAT cost of the SAT PDP = leaf count of the core
      tree × per-leaf propagation cost.
    baseline_embedding:
      parameter_slice: >-
        Three shipped cells with default WDSat; unconstrained c must
        reproduce 0.945 / 0.971 / 0.974 from the 0d8e90/3f1964
        results.jsonl before constrained instances are run.
      reproduction_check: >-
        Unconstrained and constrained DIMACS differ ONLY in the
        appended blocking clauses (or in the re-encoding of block
        variables); a diff must show exactly those changes.
    observation_collision:
      observable: ratio of UNSAT conflicts, unconstrained / constrained
      distinct_preimage_search: >-
        A ratio of ~8 can arise from (i) alphabet shrink to |V_E| or
        (ii) accidental propagation strengthening. Separated by the
        KNOWN-FALSE random-subset control of size |V_E| (same encoding):
        must match the conflict ratio under (i) and must NOT remove
        twist roots on S; and by the DECISIONS count ≈ |V_E|^3 under (i).
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Per-block alphabet V_E in place of V; descended relation
          unchanged; domain of each block specialised.
        predicted_gain: >-
          (|V|/|V_E|)^3 ~ 8 in leaves on every UNSAT instance; zero
          twist roots on SAT instances.
    quantifier_order: >-
      FORALL cells (n,l) with l<=8, side-0 certified-U targets, and
      default core-first order: constrained conflicts lie in [1/8, 1/6]
      of unconstrained conflicts up to per-instance spread ≤15%.
      NOT CLAIMED: any exponent move, any deployed-curve verdict.
    method_ceiling:
      strongest_certifiable_claim: >-
        A factor in [6, 8.5] on UNSAT conflicts and elimination of twist
        roots at l<=8 with WDSat; constant factor, independent of n; no
        change to the exponent 1 in n of the SAT pipeline.
      nearby_object_control: >-
        Random-subset alphabet of the same size (KNOWN-FALSE for side
        semantics, TRUE for counting): must reproduce the conflict ratio
        but NOT the zero-twist-root outcome on S instances.
    proof_obligations:
      - claim: unconstrained c reproduces the shipped medians
        responsibility: baseline
      - claim: no E-decomposition is lost (soundness of the constraint)
        responsibility: correctness
      - claim: leaf count |V_E|^3 under the core-first order
        responsibility: runtime
      - claim: constrained S instances return 100% E-decompositions
        responsibility: success_probability
      - claim: a79052 membership identity re-derives; E-NULL inspection recorded
        responsibility: interface
    not_applicable_reason: null

  predictions:
    - metric: median_unsat_conflict_ratio_blocking
      direction: different
      minimum_effect: 'ratio unconstrained/constrained in [6, 8] at (17,6), (19,6), (21,7)'
    - metric: median_unsat_conflict_ratio_reencoding
      direction: different
      minimum_effect: 'ratio in [7.5, 8.5] at the same cells'
    - metric: twist_side_root_fraction_constrained_S
      direction: lower
      minimum_effect: 'exactly 0 out of >=40 S instances per cell'
    - metric: median_wall_s_ratio
      direction: higher
      minimum_effect: '>= 4'
    - metric: constrained_c
      direction: different
      minimum_effect: 'in [0.85, 1.05]; <0.5 is a reported sub-exhaustive headline'

  test_boundary:
    instances:
      - cells: ['(17,6)', '(19,6)', '(21,7)']
      - targets: 20 side-0 certified-U and 20 S per cell from IDEA-20260915-3f1964 table
      - variants: [unconstrained, blocking_clauses, reencoding_l_minus_1, random_subset_control]
    parameters:
      m: 3
      factor_base: 'V = {deg x < l}'
      solver: WDSat default (vendored)
    implementation: >-
      Trimoska Weil_descent generator + appended constraints or
      re-encoding; side classifier from IDEA-20260915-3f1964; a79052
      Stage-0 membership/E-NULL note under stage0/.
    budget:
      wall_clock_seconds: 14400
      memory_gb: 1
      maximum_runs: 1

  falsification_conditions:
    - >-
      Conflict ratio below 4 on side-0 certified-U with blocking AND below
      6 with re-encoding → leaf-count reading of WDSat cost is wrong;
      IDEA-20260915-0d8e90's law needs a different mechanism.
    - >-
      Any S target whose table-known E-decomposition is NOT returned by
      the constrained instance → encoding unsound; withdraw until fixed.
    - >-
      Any twist-side root returned by a constrained instance → side
      criterion misimplemented or 3f1964 dichotomy fails; report which.
    - >-
      Random-subset control conflict ratio differs from the side-
      constrained ratio by more than 25% → gain is not (only) alphabet
      size; mechanism paragraph wrong.
    - >-
      Timeout / crash / missing WDSat → O-IMPEDIMENT / failed_infrastructure;
      never negative mathematical evidence.

  interpretation_limits:
    - Constant-factor (~8x) inside a rho-dominated SAT PDP row; no exponent moves.
    - Toy cells l<=8; no deployed-curve claim.
    - a79052 fold is Stage-0 inspection / identity; not a second EXP.
    - Core-first interleaving confound may compress the measured ratio.

  asymptotic_claim:
    problem: per-attempt SAT PDP cost on Trimoska descended S_4
    prior_best: IDEA-20260915-0d8e90 exhaustive-core law c·2^{ml}
    time_exponent: unchanged (constant-factor leaf reduction ~8)
    memory_exponent: unchanged
    hidden_cofactor: propagation cost of ~3·2^{l-1} width-l clauses
    claim_kind: constant_factor

  distinguishable_outcomes:
    - id: O-GAIN
      when: 'ratios in band; zero twist roots; soundness holds'
    - id: O-PROP-DOMINATES
      when: 'ratios below falsification band; leaf-count reading fails'
    - id: O-UNSOUND
      when: 'known E-decomposition lost or twist root under constraint'
    - id: O-NOT-SIDE
      when: 'random-subset control mismatches side-constrained ratio >25%'
    - id: O-ARTIFACT
      when: 'baseline c not reproduced; DIMACS diff not pure constraint'
    - id: O-IMPEDIMENT
      when: 'WDSat missing/unbuildable; timeout/OOM/crash'

  status_note: >-
    Analyzed under DEC-20261003-d003b7 / EV-ICPERF-090b10 after Stages 0-1
    (TASK-20261003-6bb6ee). Stage 0 freeze OK; Stage 1 O-IMPEDIMENT
    (WDSat PATH) — infrastructure, not a falsifier. Leaf-count
    predictions (C)-(E) remain untested. Next: clear WDSat PATH and
    re-run Stage 1 (NA-1 on DEC-20261003-d003b7). Idea statuses left
    proposed.
