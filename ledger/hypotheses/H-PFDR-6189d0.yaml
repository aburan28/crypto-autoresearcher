  yaml_parse_disclosure: >-
    Written by the Coordinator subagent without an interpreter; every prose
    value is a folded block scalar or a quoted scalar; no tabs; no
    duplicate keys to the author's reading. The orchestrating session must
    run a strict parse and tools/validate_ledger.py before this record is
    relied on.
