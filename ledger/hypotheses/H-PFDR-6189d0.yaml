hypothesis:
  id: H-PFDR-6189d0
  question_id: RQ-EQIC-8cb959
  source_idea_id: IDEA-20260815-a5a19f
  batch_id: BATCH-2eaca1
  title: >-
    The corpus's nominal breadth of proposed prime-field ECDLP attack
    systems materially overstates the number of DISTINCT constructions:
    under a frozen, decidable normal form on the proposed polynomial system,
    the quotient covers at most 0.6 of the concretely-specified records --
    but the claim is only meaningful if a matched RANDOM-SYSTEM null, built
    with no curve and no cryptographic content, fails to collapse at the
    same rate, since a coarse descriptor collapses anything
  statement: >-
    (A) THE OBJECT AND THE NORMAL FORM, FROZEN. For a corpus record r that
    proposes a concrete algebraic attack system, define the descriptor
    NF(r) as the tuple
      NF(r) = (base, nvars, degseq, gbsig, oracles, symgrp)
    where: base is the coefficient domain as declared (F_p, F_{2^n},
    F_{p^n}, Z, or Z/N); nvars is the number of indeterminates after
    elimination of variables the record itself declares eliminated; degseq
    is the sorted multiset of total degrees of the generators; gbsig is the
    signature of the defining ideal, computed as the sorted multiset of
    (monomial support pattern up to a canonical variable relabelling,
    coefficient pattern up to scaling by a nonzero constant) of a
    degrevlex Groebner basis of the ideal after substituting a fixed
    declared specialisation for every free parameter; oracles is the sorted
    list of external primitives the record declares its system consumes
    (summation polynomial S_m, factor-base membership test, subgroup DLP
    oracle, isogeny evaluation, point-halving, none); symgrp is the
    declared symmetry group with its action type. Two records are
    EQUIVALENT iff NF is equal componentwise. The relation is decidable
    given the descriptors, is an equivalence by construction, and is frozen
    in the contract before any record is descriptor-extracted.
    (B) THE MEASURED CLAIM. Let T be the declared record population
    (concretely enumerated in the contract by a reproducible query), N_c
    the number of records from which a descriptor is extracted at HIGH
    confidence, N_v = |T| - N_c the number that propose a direction rather
    than a system, and Q the number of equivalence classes on the N_c.
    H1: COVERAGE. N_c/|T| >= 0.25. Below that the quotient describes too
    small a share of the corpus for any statement about the corpus, and the
    deliverable is the coverage number itself.
    H2: COLLAPSE. Q/N_c <= 0.6 -- at least two fifths of the concretely
    specified systems are notational variants of another record's system.
    This is the variant regression of docs/inventor-protocol.md section 1,
    stated as a number.
    H3: CALIBRATION, AND THE CLAIM THAT MAKES H2 MEAN ANYTHING. A matched
    RANDOM-SYSTEM null -- synthetic polynomial systems drawn with the same
    (base, nvars, degseq, oracle-count) marginals as the corpus but with
    randomly generated generators, no elliptic curve, no summation
    polynomial and no cryptographic content whatsoever -- must NOT collapse:
    Q_rand/N_rand >= 0.9. If matched random systems collapse at a rate
    comparable to the corpus, the descriptor is too coarse and Q/N_c
    measures the descriptor's resolution rather than the corpus's
    duplication. THIS IS THE STANDING SCOPE CONSTRAINT: the same
    'signature' -- a low quotient count -- is trivially reproducible by a
    curve-free, non-cryptographic object, so a curve-free null is
    mandatory and blocking here.
    H4: DISCRIMINATION. A pre-registered list of pairs known to be
    genuinely different constructions must NOT collapse, and a
    pre-registered list of notational re-presentations of one system
    (variables renamed, generators reordered and rescaled, an equation
    replaced by an equivalent one) MUST collapse. These are the coarseness
    and the fineness bounds and both are blocking.
    (C) WHAT IS NOT CLAIMED. Equivalence of systems is NOT scientific
    redundancy. Two records may propose the same system and measure
    different things on it; the quotient counts constructions, not research
    programmes, and the record makes no judgement about the value of any
    construction or about which member of a class should have been
    screened. Reading Q/N_c as 'the corpus wasted (1 - Q/N_c) of its
    effort' is a misreading the record forbids in advance.
  mechanism: >-
    THREE STAGES, THE FIRST TWO BLOCKING.
    STAGE 1, CALIBRATION BEFORE ANY CORPUS NUMBER. The descriptor pipeline
    is run on the four calibration sets and must pass all four before any
    corpus record is descriptor-extracted: SELF (every record against
    itself; reflexivity, forced), RENAME (the pre-registered notational
    re-presentations; forced equivalent), DISTINCT (the pre-registered
    genuinely-different pairs; forced inequivalent), and RANDOM (the
    matched random-system null; forced to stay near-discrete at
    Q_rand/N_rand >= 0.9). A failure of RENAME means the descriptor is too
    fine and finds nothing; a failure of DISTINCT or RANDOM means it is too
    coarse and would understate the corpus's real breadth. Only the two
    nulls constrain that choice, which is why they run first and why the
    descriptor is frozen before they run rather than after.
    STAGE 2, EXTRACTION AND ITS OWN CONTROL. The binding difficulty of this
    record is not the equivalence, it is the EXTRACTION of a system from
    prose: records specify at wildly different precision. Extraction
    therefore follows a declared written procedure, emits a per-record
    confidence in {high, low, none}, and is subject to an
    INTER-EXTRACTOR AGREEMENT control: a seeded random sample of 20 records
    is descriptor-extracted independently and blindly by two agents, and
    the agreement rate on the full descriptor is measured. Agreement below
    0.8 means the descriptor is not reproducibly extractable and the
    quotient is uninterpretable; the record then reports the agreement rate
    as its result and nothing else. This is the one control that decides
    whether the whole exercise has a subject.
    STAGE 3, THE QUOTIENT. The fingerprint pre-filter of
    IDEA-20260813-f2a6e7 is applied first where a fingerprint exists, as a
    cheap necessary condition, and the full descriptor decides every
    candidate collision it raises; the pre-filter never decides an
    equivalence by itself. Q, N_c, N_v are reported with the full class
    partition, and every class of size >= 2 is listed member by member so a
    reader can check the collapse rather than trust it. Classes of size
    >= 3 are additionally read individually against the H4 hazard: a
    collapse that a human reader judges to have merged genuinely different
    research content is recorded as a DESCRIPTOR DEFECT with the pair named,
    and the count of such defects is a reported metric, not a repair.
    WHY THE RANDOM-SYSTEM NULL IS THE LOAD-BEARING CONTROL. Q/N_c is a
    statistic of a descriptor applied to a finite set, and any descriptor
    with fewer distinct values than the set has elements collapses it. The
    corpus's systems share a base field, a handful of degree sequences and
    a small oracle vocabulary, so the descriptor's range is small by
    construction. Matched random systems have the SAME marginals and no
    shared origin, so they measure exactly the collapse the descriptor
    produces from marginals alone. The corpus's excess collapse over that
    baseline is the only part of Q/N_c that is about the corpus.
  assumptions:
    - >-
      The record population T is fixed by a reproducible query stated in
      the contract and executed once, at a recorded commit; the corpus
      grows, so the quotient is a statement about a named commit and never
      about 'the corpus'.
    - >-
      A Groebner basis of each extracted ideal is computable at the
      declared sizes; a record whose system does not admit one inside the
      per-record budget is counted as extraction confidence 'low' and
      excluded, not forced.
    - >-
      The specialisation of free parameters is a fixed declared choice; a
      different specialisation defines a different descriptor and would
      require a new contract.
    - >-
      Extraction confidence is assigned before the descriptor is compared
      with any other record's, so a record cannot be promoted to 'high'
      because it happens to match something.
  proof_search_map:
    bottleneck: >-
      Not a mathematical bottleneck: the load-bearing step is the
      EXTRACTION of a formal system from a prose record, which is the only
      step in the pipeline that is not decidable. Everything downstream is
      mechanical. This is why the inter-extractor agreement control, not
      the normal form, is the gate on the whole result.
    baseline_embedding:
      parameter_slice: >-
        The keyword novelty screens each record already performs
        individually: the incumbent method, which checks against the corpus
        by term rather than by structure and therefore cannot see a variant
        arriving in new notation. The RENAME calibration set is exactly the
        slice where the incumbent fails and the descriptor must not.
      reproduction_check: >-
        For each RENAME pair, the keyword screen is recorded as MISSING the
        equivalence (the pair shares no distinguishing term) and the
        descriptor as FINDING it. If the descriptor finds nothing the
        keyword screen misses, it adds nothing over the incumbent and the
        record says so.
    observation_collision:
      observable: >-
        The quotient size Q on N_c records, and the induced class
        partition.
      distinct_preimage_search: >-
        REQUIRED AND BLOCKING. Three distinct preimages of a low Q: (i) the
        corpus really contains duplicated constructions; (ii) the
        descriptor is coarse, which the matched RANDOM-SYSTEM null detects
        directly and which the DISTINCT pairs detect at a named point;
        (iii) extraction is unreliable and maps different systems to the
        same descriptor by attrition, which the inter-extractor agreement
        control detects. Only (i) is the claim; (ii) and (iii) are ruled
        out first or the number is not reported.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The descriptor NF as a canonical representative of a proposed
          attack system, replacing the record's prose and notation.
        predicted_gain: >-
          Turns 'has this been screened before' from a keyword question
          into a decidable one, and makes the corpus's breadth a measured
          quantity rather than a record count.
      - transform: observable_fiber
        proposed_object: >-
          Hold the descriptor and the pipeline fixed and vary only the
          input population: corpus records, matched random systems,
          notational re-presentations, known-different pairs.
        predicted_gain: >-
          Separates duplication in the corpus from coarseness in the
          descriptor, which is the only ambiguity a raw Q cannot resolve.
    quantifier_order: >-
      CLAIMED: FOR THE NAMED POPULATION T at the named commit, THERE EXIST
      at least 0.4 N_c records each of which is NF-equivalent to some other
      record of T. NOT CLAIMED: that FOR ALL pairs with equal NF the two
      records are scientifically redundant (claim C explicitly denies the
      converse reading), nor that the statement transfers to any other
      population, commit, or descriptor.
    method_ceiling:
      strongest_certifiable_claim: >-
        'At commit C, on the population T defined by the declared query,
        under the frozen descriptor NF and with extraction agreement A,
        the concretely-specified attack systems fall into Q classes, N_v
        records specify no system, and a matched random-system null of the
        same marginals falls into Q_rand classes.' It cannot certify that
        any particular collapse is scientifically redundant, cannot
        certify anything about records it could not extract, and cannot
        certify a property of the corpus at any other commit.
      nearby_object_control: >-
        The matched random-system population: a set with the same
        descriptor marginals and no shared origin, where the conclusion
        'these are duplicates of each other' is KNOWN FALSE. A descriptor
        that collapses it has proved too much.
    proof_obligations:
      - claim: >-
          NF is an equivalence relation (reflexive, symmetric, transitive)
          on descriptors.
        responsibility: correctness
      - claim: >-
          The RENAME set collapses and the DISTINCT set does not, under the
          descriptor frozen before those sets were run.
        responsibility: baseline
      - claim: >-
          The matched random-system null does not collapse below the
          declared threshold.
        responsibility: strictness
      - claim: >-
          Inter-extractor agreement on a blind seeded sample is measured
          and reported before any quotient number is reported.
        responsibility: interface
      - claim: >-
          The population T is reproducible from the declared query at the
          named commit.
        responsibility: scope
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        DESCRIPTOR SEPARATION. For any two corpus records r, r' whose
        proposed systems define different computational problems, NF(r) is
        not equal to NF(r'); and for any two records whose proposed systems
        differ only by a renaming of indeterminates, a reordering or
        nonzero rescaling of generators, or a substitution of an equivalent
        generating set, NF(r) equals NF(r').
      random_model_justification: >-
        Rigorous ingredient: two systems with the same defining ideal over
        the same base and the same consumed oracle set define the same
        computational problem, and a reduced Groebner basis under a fixed
        monomial order is a canonical generator of an ideal, so the second
        half of the statement is exact for the ideal component of the
        descriptor. THE GAP, STATED: the descriptor is not the ideal, it is
        a SIGNATURE of the ideal (support and coefficient patterns up to
        relabelling and scaling), so distinct ideals can share a signature;
        and the first half of the statement -- that different problems get
        different descriptors -- is not provable at all, only bounded from
        below by the DISTINCT pairs and from the null side by the
        random-system population.
      supporting_results:
        - ref: IDEA-20260815-a5a19f
          provenance: internal
          claim: >-
            HEUR-EQIC-1 as originally stated, its rigorous ingredient (same
            defining ideal plus same oracle set implies same computational
            problem) and its explicitly stated gap (two records may share a
            system while measuring different things on it).
          verified_by: coordinator, TASK-20260904-b2a7e9 (record read in full)
        - ref: IDEA-20260813-f2a6e7
          provenance: internal
          claim: >-
            Syzygy fingerprints proposed for attack-system equivalence; a
            fingerprint gives probable equality where a normal form gives
            decidable equality, so it is consumed here only as a
            pre-filter.
          verified_by: >-
            NOT VERIFIED BY THIS RECORD. Cited from IDEA-20260815-a5a19f's
            novelty screen, which the coordinator read; the f2a6e7 record
            itself was not opened under TASK-20260904-b2a7e9 and the
            executor must read it before implementing the pre-filter.
      validation_experiment_ids:
        - EXP-PFDR-a2f447
      falsification_condition: >-
        Any pre-registered DISTINCT pair collapsing, OR the matched
        random-system null falling below Q_rand/N_rand = 0.9, OR any
        pre-registered RENAME pair failing to collapse. Any one of these
        falsifies HEUR-001 and blocks every corpus number.
    - id: HEUR-002
      formal_statement: >-
        EXTRACTION REPRODUCIBILITY. The declared extraction procedure,
        applied blindly by two independent agents to the same record,
        yields the same descriptor with probability at least 0.8 on records
        assigned confidence 'high'.
      random_model_justification: >-
        No rigorous ingredient exists: this is a claim about the legibility
        of prose records, and the only justification available is the
        measurement itself. It is stated as a numbered heuristic precisely
        so that its failure is a reportable result rather than an excuse.
      supporting_results:
        - ref: IDEA-20260815-a5a19f
          provenance: internal
          claim: >-
            SPECIFICATION VARIANCE named as a confounder: records specify
            systems at wildly different precision, so a normal form may
            fail on vague records for reasons unrelated to their content.
          verified_by: coordinator, TASK-20260904-b2a7e9 (record read in full)
      validation_experiment_ids:
        - EXP-PFDR-a2f447
      falsification_condition: >-
        Measured inter-extractor agreement below 0.8 on the blind seeded
        sample. The quotient is then uninterpretable and the agreement rate
        is the record's only reportable result.
  structural_ingredients:
    - description: >-
        A reduced Groebner basis under a fixed monomial order is a
        canonical generating set of an ideal, which is what makes the
        ideal component of the descriptor well defined rather than
        presentation dependent.
      citation: 'Buchberger; standard, see Cox-Little-OShea, Ideals, Varieties and Algorithms, Ch. 2'
      provenance: recalled
      verified_by: null
      role: >-
        canonicity of the gbsig component; a pointer for the reviewer, not
        support. The property actually relied on is checked operationally
        by the RENAME calibration set.
    - description: >-
        The variant regression this record measures: the same construction
        re-screened under several names.
      citation: 'docs/inventor-protocol.md section 1'
      provenance: internal
      verified_by: >-
        NOT RE-READ under TASK-20260904-b2a7e9; cited as characterised by
        IDEA-20260815-a5a19f, whose characterisation the coordinator read.
      role: motivation and the definition of the failure mode being counted
    - description: >-
        Syzygy fingerprints for attack-system equivalence, consumed here as
        a fast necessary-condition pre-filter only.
      citation: IDEA-20260813-f2a6e7
      provenance: internal
      verified_by: >-
        NOT VERIFIED. Known only through the novelty screen of
        IDEA-20260815-a5a19f; the executor must open it before use.
      role: pre-filter; never decides an equivalence
  reduction_chain:
    core_problem: >-
      No attack problem is reduced and no cryptanalytic claim is made. The
      core statement is a measurement of this program's own corpus at a
      named commit.
    corollaries: []
  predictions:
    - metric: 'P1 -- SELF calibration (every record against itself)'
      direction: different
      minimum_effect: 'FORCED equivalent for all records. Reflexivity; a failure is a code defect.'
    - metric: 'P2 -- RENAME calibration (pre-registered notational re-presentations)'
      direction: different
      minimum_effect: >-
        FORCED equivalent for all pre-registered pairs. A failure means the
        descriptor is too fine, would find nothing, and the run halts.
    - metric: 'P3 -- DISTINCT calibration (pre-registered genuinely different pairs)'
      direction: different
      minimum_effect: >-
        FORCED inequivalent for all pre-registered pairs. A collapse means
        the descriptor is too coarse and would understate the corpus's real
        breadth; the run halts.
    - metric: >-
        P4 -- matched RANDOM-SYSTEM null collapse ratio Q_rand/N_rand
        (curve-free, no cryptographic content, matched marginals)
      direction: higher
      minimum_effect: >-
        FORCED >= 0.9. Below that the descriptor collapses objects with no
        shared origin, so any corpus collapse is attributable to the
        descriptor's resolution rather than to duplication, and no corpus
        number is reportable. THIS IS THE BLOCKING CURVE-FREE NULL.
    - metric: 'P5 -- inter-extractor agreement on a blind seeded sample of 20 records'
      direction: higher
      minimum_effect: >-
        >= 0.8. Below that the quotient is uninterpretable and the
        agreement rate is the only result.
    - metric: 'P6 -- coverage N_c/|T|'
      direction: higher
      minimum_effect: >-
        >= 0.25 for the quotient to describe the corpus. Below that the
        deliverable is the coverage number and an explicit statement that
        the corpus mostly proposes directions rather than systems, which is
        itself a process finding.
    - metric: 'P7 -- corpus collapse ratio Q/N_c'
      direction: lower
      minimum_effect: >-
        <= 0.6 predicted (the record's claim H2), AND at least 0.3 below
        the measured Q_rand/N_rand. A ratio above 0.6, or within 0.3 of
        the random null, refutes the variant-regression claim for this
        population at this commit; the corpus's breadth is then real, which
        is a useful confirmation and not a failure of the experiment.
    - metric: 'P8 -- descriptor defects (classes of size >= 3 judged to merge different research content)'
      direction: different
      minimum_effect: >-
        Reported as a count with the merged pairs named. A nonzero count
        does not repair the descriptor and does not adjust Q; it bounds how
        far Q/N_c may be read, and the bound is reported beside it.
  test_boundary:
    instances:
      - >-
        Population T: the live (non-superseded) records under
        ledger/proposals/ whose declared question is a prime-field ECDLP
        question and whose class is not 'governance', enumerated by the
        exact query stated in EXP-PFDR-a2f447 and executed once at a
        recorded commit
      - >-
        Calibration sets: SELF (all of T), RENAME (>= 6 pre-registered
        pairs), DISTINCT (>= 6 pre-registered pairs), RANDOM (>= 200
        synthetic systems with matched marginals)
      - >-
        Blind double-extraction sample: 20 records drawn by a declared
        seeded sample from T
    parameters:
      descriptor: '(base, nvars, degseq, gbsig, oracles, symgrp) as defined in the statement'
      specialisation: 'free parameters specialised at a single fixed declared choice, recorded in the contract'
      thresholds: 'coverage >= 0.25; agreement >= 0.8; Q_rand/N_rand >= 0.9; Q/N_c <= 0.6 and at least 0.3 below Q_rand/N_rand'
      excluded_by_name: >-
        superseded records; records of class governance; records whose
        Groebner computation exceeds the per-record budget (counted as
        extraction confidence low, never forced into the quotient)
    implementation: >-
      Symbolic. A descriptor extractor following a written procedure with
      per-record confidence; a Groebner engine over the declared
      specialisation; the fingerprint pre-filter of IDEA-20260813-f2a6e7
      where available; a union-find over descriptors. No curve is sampled,
      no ECDLP instance is solved, no run touches cryptographic material.
    budget:
      wall_clock_seconds_per_run: 1800
      total_cpu_hours: 4
      maximum_memory_gb: 8
      maximum_runs: 8
  falsification_conditions:
    - >-
      F1 CALIBRATION FAILURE. P1, P2 or P3 fails. The descriptor is too
      fine or too coarse; the run halts and reports which, with the failing
      pair named. No corpus number is produced.
    - >-
      F2 NULL FAILURE, THE SCOPE-CONSTRAINT OUTCOME. P4 fails: matched
      random systems with no curve and no cryptographic content collapse
      at a rate comparable to the corpus. The quotient measures the
      descriptor's resolution, not the corpus. The result is a controlled
      null and the record explicitly does NOT support any claim about
      duplication in this program's ECDLP proposals.
    - >-
      F3 EXTRACTION FAILURE. P5 fails. The corpus does not state its
      systems reproducibly enough to be quotiented. This is a process
      finding about how records are written, is reported as such, and
      supersedes every other output of the run.
    - >-
      F4 COVERAGE FAILURE. P6 fails. Most live prime-field ECDLP proposals
      specify a direction rather than a system. The quotient covers too
      small a share to describe the corpus; the coverage number is the
      deliverable and H2 is not evaluated.
    - >-
      F5 CLAIM REFUTED. P7 fails: Q/N_c > 0.6, or Q/N_c is within 0.3 of
      the random null's ratio. The corpus's nominal breadth is real at this
      commit under this descriptor, and the variant-regression worry is not
      confirmed. This is a reassuring result and is reported with the same
      prominence as the alternative.
    - >-
      F6 CLAIM SUPPORTED. All calibration passes, coverage and agreement
      clear their thresholds, and Q/N_c <= 0.6 with the required margin
      over the random null. The program has been screening a materially
      smaller set of constructions than its record count suggests, at this
      commit, under this descriptor, for this population -- and for no
      other.
  interpretation_limits:
    - >-
      This is a measurement of this repository's own records. It makes no
      mathematical claim, produces no evidence about elliptic curves or the
      ECDLP, and cannot change the status of any hypothesis about them.
    - >-
      NF-equivalence is NOT scientific redundancy. Two records may propose
      one system and measure different things on it; the quotient counts
      constructions. No record may be deprioritised, closed, or described
      as duplicative on the strength of a class membership alone.
    - >-
      Every number is scoped to one commit, one population, one descriptor,
      one specialisation of free parameters, and one extraction procedure.
      The corpus grows continuously and in several worktrees at once, so
      the quotient is never 'the corpus's breadth' without those five
      qualifiers.
    - >-
      Records that could not be extracted are counted, never imputed. N_v
      and the low-confidence count are reported beside Q and bound how far
      Q/N_c may be read.
    - >-
      The question_id RQ-EQIC-8cb959 is inherited from the source idea
      IDEA-20260815-a5a19f and is a poor fit: that question is about
      phi-stable factor bases, and this record is a corpus audit. The
      inheritance is preserved rather than repaired because the coordinator
      subagent has no shell with which to mint a new RQ identifier, and
      because breaking the chain to the source idea would cost more than
      the mismatch does. A future coordinator may supersede this record
      under a better-fitting question; it may not edit this field.
  status: proposed
  proposed_by: idea-generator
  proposed_at: '2026-08-15'
  specified_under_task: TASK-20260904-b2a7e9
  specified_at: '2026-09-04'
  status_note: >-
    status is 'proposed' per the constraints of TASK-20260904-b2a7e9. This
    record is DESIGN ONLY: no experiment is approved, no run has occurred,
    and no existing record's status is changed by writing it.
  id_allocation_provenance: >-
    H-PFDR-6189d0 pre-allocated by the tasking Coordinator in
    TASK-20260904-b2a7e9 and stated there verbatim against source idea
    IDEA-20260815-a5a19f. The authoring subagent has no shell and minted
