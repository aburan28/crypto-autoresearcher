hypothesis:
  id: H-PFDR-df0127
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  added: '2026-09-04'
  derived_from_idea: IDEA-20260811-c05798
  batch_id: BATCH-2c45e2
  statement: >-
    RANK-DEFINED COST FUNCTIONALS OF THE SUMMATION FAMILY ARE MINIMISED GENERICALLY,
    AND THE INFORMATIVE QUESTION IS NOT THE SIGN OF THAT INEQUALITY BUT WHETHER THE
    DROP AT THE SPECIAL LOCI IS ELLIPTIC OR IS WHAT ANY COEFFICIENT-BLOCK VANISHING
    PRODUCES.
    (S1 THE THEOREM, WHOSE SIGN CANNOT FAIL) The degree-d Macaulay matrix of the
    summation system has entries polynomial in the two Weierstrass coefficients, so
    its rank is lower semi-continuous in the Zariski topology - the condition that
    the rank is at least r is cut out by the non-vanishing of some minor and is
    therefore open. Hence the rank is maximal on a dense open set and can only DROP
    on the complement. Since the dimension of the degree-d part of the ideal is that
    rank, the ideal is smaller at every special point, the quotient algebra larger,
    and every functional monotone in the quotient at least its generic value. NO
    DEGENERATION CAN REDUCE ANY OF THEM. This is a theorem with a one-line proof and
    its sign is therefore NOT a discriminator.
    (S2 THE ATTRIBUTION, WHICH IS THE DISCRIMINATOR) The rank DEFICIT at a special
    locus - the generic rank minus the rank there, in rows - is predicted to exceed
    the deficit of a matched curve-free system whose coefficients carry a
    coefficient-block structure of the same size. If it does not, the deficit is
    what specialising any polynomially-parametrised family with a vanishing
    coefficient block produces, and it carries no elliptic-curve content.
    (S3 THE BRIDGE TO COST, WHICH IS THE WEAK LINK AND IS NAMED AS ONE) Basis size
    at a special locus is at least its generic value. The two committed data points
    at the two trivial loci both carry the predicted sign, but neither has a
    dispersion estimate, so the direction is untested until the run-to-run noise
    floor is measured first and the minimum detectable effect is fixed before any
    comparison.
  mechanism: >-
    Genericity is maximality for ranks. A polynomial system with generic coefficients
    has the largest possible ideal in every degree, because the minors that certify
    rank are non-zero polynomials and vanish only on a proper closed set.
    Specialising the coefficients - which is what fixing a special j does - can only
    kill minors, never create them. So a search for a computationally easier special
    curve among rank-defined functionals is searching in the direction the inequality
    forbids. The mechanism is not subtle and its simplicity is the point: it is
    available before any compute and it predicts the sign of quantities the lane has
    already measured. What it does NOT do is explain why the drop is what it is, and
    that is where the elliptic content, if any, must live.
  band_non_degeneracy:
    checked_by: TASK-20260904-5423ad
    finding: >-
      THE SOURCE IDEA'S PRIMARY PREDICTION HAS A BAND OF WIDTH ZERO ON THE SIDE THAT
      MATTERS. It asks for the rank at every locus to be less than or equal to the
      generic rank, eight of eight with no exception, and names a strictly greater
      rank as the falsifier. But lower semi-continuity of matrix rank over a
      polynomial base makes a strictly greater rank IMPOSSIBLE, not merely unlikely -
      the idea itself says the derivation is a one-line proof by minors. A
      pre-registered discriminator whose failure would be a contradiction in linear
      algebra tests the implementation and nothing else. The same applies to the
      Hilbert-function and degree-of-regularity predictions, which follow from the
      same inequality.
      THE IDEA'S OWN NULL IS ALSO WIDTH-ZERO. Its C-NULL-LOCUS specialises to ten
      RANDOM weight-12 loci and predicts generic rank there. A random weight-12
      locus passes through generic points of the coefficient plane, so it is generic
      by construction and the control cannot fail except through a coding error.
    change_made: >-
      Two changes. First, the primary measured quantity became the RANK DEFICIT in
      rows - a magnitude rather than a sign - and the primary discriminator became
      the DIFFERENCE between the elliptic deficit and that of a MATCHED CURVE-FREE
      SYSTEM carrying a coefficient block of the same size. That contrast has real
      range because the two competing explanations predict different magnitudes,
      whereas the sign is fixed by theorem under both. Second, the basis-size arm is
      gated on measuring the run-to-run dispersion FIRST on repeated identical
      inputs, so that its band is fixed by measurement before any comparison rather
      than left undeclared.
    alternative_hypothesis_range: >-
      Under H_blockvanishing the deficit at a locus is essentially determined by how
      many coefficients vanish there, so a curve-free system with a block of 48
      vanishing coefficients out of 439 shows a deficit within the null spread of the
      elliptic 48-block locus, and the difference is consistent with zero. Under
      H_semaev the elliptic deficit materially exceeds the matched curve-free one.
      Both deficits are exact integers computed by the same code on systems of the
      same shape, so the comparison is exact up to the curve-free arm's draw-to-draw
      spread, which is itself measured over at least 20 draws. Separately, the
      basis-size band is set by the measured noise floor, and the committed evidence
      shows why that matters - the two existing data points are plus 1.02 percent at
      one trivial locus over 6 curves and plus 3.41 percent at the other over 4
      curves, against 12 generic curves, WITH NO DISPERSION ESTIMATE REPORTED FOR ANY
      ARM.
  assumptions:
  - >-
    The Macaulay matrix entries are polynomial in the two Weierstrass coefficients.
    True by construction for a fixed degree and monomial basis; verified symbolically
    as the first gate rather than assumed.
  - >-
    The semi-continuity statement is over an algebraically closed base. Over a finite
    field the conclusion holds for the rational points of the open set, and the
    density must be QUANTIFIED rather than waved - the eight loci carry about eight
    times the field size of the squared field size worth of points, that is about
    eight over the prime, which at the reference prime is about 0.2 percent, and at
    very small primes the argument would be vacuous.
  - >-
    Monotonicity of a solver's wall-clock in the size of the quotient algebra is NOT
    part of the theorem and is assumed only for the practical reading. The theorem
    bounds Hilbert functions, degrees of regularity, Betti numbers and reduced basis
    sizes; the step from those to time is empirical and is where the lane's own
    committed data is weakest.
  - >-
    The factor-base-free and factor-base-bearing formulations are both covered by the
    theorem, since the membership polynomials do not depend on the curve
    coefficients, but their MAGNITUDES differ enormously because the
    factor-base-bearing system's solving degree is pinned by the factor-base size.
    Both are reported and never pooled.
  proof_search_map:
    bottleneck: >-
      The degree of regularity of the summation system. This record shows it cannot
      be reduced by moving along the j-line, which is a statement about a whole lane
      rather than about one experiment.
    baseline_embedding:
      parameter_slice: >-
        The generic curve, meaning any coefficient pair outside the eight known loci.
        The theorem asserts the generic fibre is OPTIMAL, so the baseline is not
        merely reproduced but proved to be the best member of the family.
      reproduction_check: >-
        Symbolic - compute the rank of the Macaulay matrix at a generic point and at
        each of the eight loci at arity 3 and several degrees, and confirm the
        generic rank is maximal. A frozen fixture pins the generic rank profile.
    observation_collision:
      observable: 'The rank profile, equivalently the Hilbert function.'
      distinct_preimage_search: >-
        PERFORMED AND POSITIVE. The rank profile is a function of j, hence collides on
        twist pairs and carries no isogeny-class information. THE SEPARATING
        CONDITION - this record makes no class claim at all; it is a statement about
        the coefficient plane. A second collision, added by TASK-20260904-5423ad and
        more consequential - the profile also collides with any polynomially
        parametrised family whose coefficients vanish in blocks of the same sizes,
        which is what S2 exists to test.
    constructive_transforms:
    - transform: boundary_lift
      proposed_object: >-
        Rather than searching for a curve that beats the generic one, PROVE the
        generic one is the boundary and that the family cannot be pushed inward.
      predicted_gain: >-
        Converts an unbounded search over the j-line into a proved optimum plus a
        named list of escapes. NO COST GAIN and none claimed.
    quantifier_order: >-
      CLAIMED - FOR ALL arities, FOR ALL degrees, FOR ALL monomial orders and FOR ALL
      coefficient pairs, the rank is at most the generic rank, with equality on a
      dense open set. THERE IS NO WITNESS ANY PARTY MAY CHOOSE; the inequality holds
      pointwise and uniformly. That total absence of an exploitable existential is
      what makes it a closure - and it is also exactly why the inequality is not a
      testable discriminator and the DEFICIT MAGNITUDE is.
    method_ceiling:
      strongest_certifiable_claim: >-
        That every rank-defined cost functional of the summation family is minimised
        generically, and that the deficit at the elliptic loci is or is not larger
        than a matched coefficient-block vanishing produces. It CANNOT certify that
        special j confers no advantage whatsoever - only that the advantage cannot
        come from a rank - and it says nothing about point counts, factorisation
        type, the automorphism group, sparse-matrix constants, or the multi-instance
        model.
      nearby_object_control: >-
        THE COUNT OF RATIONAL SOLUTIONS IN A WINDOW, which is not a rank and is not
        semi-continuous. Applying the argument there must FAIL to give a direction. A
        version of the argument that proved a direction for point counts would have
        proved too much and would be wrong somewhere unexamined. That control is the
        cheapest test that the argument tracks the right structure.
    proof_obligations:
    - claim: Macaulay matrix entries are polynomial in the curve coefficients.
      responsibility: correctness
    - claim: Rank is lower semi-continuous over a polynomial base.
      responsibility: baseline
    - claim: The generic rank is attained off a proper closed subset.
      responsibility: correctness
    - claim: 'The elliptic rank deficit exceeds the matched curve-free deficit.'
      responsibility: strictness
    - claim: 'The escapes are genuinely outside the argument.'
      responsibility: scope
    - claim: 'The rational-point density of the open set is quantified at the tested prime.'
      responsibility: scope
    - claim: 'The basis-size noise floor is measured before any basis-size comparison.'
      responsibility: interface
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    NULL, AND THE RECORD ARGUES NONE IS AVAILABLE FROM THIS AXIS. The strongest
    statement is negative - no j-line degeneration reduces a rank-defined cost
    functional - so the exponent of any algebraic relation-collection method is
    unchanged by the choice of j within a class. A negative claim about an axis is not
    an asymptotic claim about a problem.
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: >-
      NO DISTRIBUTIONAL HEURISTIC IS LOAD-BEARING IN S1. Lower semi-continuity of
      matrix rank over a polynomial base is a theorem with a one-line proof by
      minors - the vanishing locus of all minors of a given size is Zariski-closed, so
      its complement is open.
    random_model_justification: >-
      Not applicable to S1. The only sampling anywhere is the curve-free coefficient
      draws, the 1000 random coefficient pairs of the generic-maximality control, and
      the ten random loci, all seeded and recorded, none of which enters a
      distributional claim.
    supporting_results: []
    supporting_results_note: >-
      EMPTY. The companion statements for Betti numbers and Hilbert functions under
      specialisation are standard textbook results which this program has not opened;
      naming them without theorem numbers and an opened status would be a rule 9
      violation, so the run records theorem numbers and an opened status per source or
      drops the record's status to unverified rather than asserting anyway.
    validation_experiment_ids:
    - EXP-PFDR-3d4706
    falsification_condition: >-
      A rank at some locus strictly exceeding the generic rank at some degree. Because
      that would contradict the theorem, the FIRST hypothesis to test is that the
      generic point was itself special, and only a defect-free reproduction in a
      second engine may be reported as anything else.
  - id: HEUR-002
    formal_statement: >-
      Solver basis size and wall-clock are monotone non-decreasing in the size of the
      quotient algebra, so the theorem's direction transfers to measured cost.
    random_model_justification: >-
      NONE. This is the weak link and it is named as such rather than buried. The
      committed evidence is two supporting data points at the two trivial loci and one
      uninformative one, none with a dispersion estimate.
    supporting_results: []
    supporting_results_note: >-
      EMPTY AND HONESTLY SO. TASK-20260904-5423ad read the committed red-team notes
      and reports the exact figures - at the first trivial locus, Groebner-seconds
      ratio 0.9956, a movement of minus 0.44 percent, and basis-size ratio 1.0102, a
      movement of PLUS 1.02 percent, over 6 curves; at the second, Groebner-seconds
      ratio 0.9933, minus 0.67 percent, and basis-size ratio 1.0341, PLUS 3.41
      percent, over 4 curves; against 12 generic curves. THE SOURCE IDEA CALLS THE
      PLUS 3.41 PERCENT FIGURE "THE ONE EXISTING DATA POINT". THERE ARE TWO, AND BOTH
      CARRY THE PREDICTED SIGN, which understates rather than overstates the support.
      The red-team record states in the same place that NO DISPERSION ESTIMATE IS
      REPORTED FOR ANY ARM, which is why the noise floor must be measured first.
    validation_experiment_ids:
    - EXP-PFDR-3d4706
    falsification_condition: >-
      Basis size at any locus strictly smaller than generic by more than the measured
      noise floor. That would break the practical reading of the theorem and hand the
      lane a direction-correct effect to chase.
  structural_ingredients:
  - description: >-
      Lower semi-continuity of matrix rank over a polynomial base, and the companion
      upper semi-continuity of Betti numbers and Hilbert functions under
      specialisation.
    citation: >-
      Standard algebraic geometry and commutative algebra texts. THEOREM NUMBERS TO BE
      RECORDED IN THE RUN RECORD WITH AN OPENED STATUS; NOT PARAPHRASED FROM MEMORY
      AND NOT OPENED BY THIS PROGRAM.
    provenance: recalled
    verified_by: null
    role: >-
      supplies the direction of S1; a pointer for the reviewer until an agent records
      theorem numbers and an opened status
  - description: >-
      The committed pair at the two trivial loci - basis size moving PLUS 1.02 percent
      and PLUS 3.41 percent while the summation support dropped 30.8 percent and 23.1
      percent respectively, with Groebner-seconds moving minus 0.44 and minus 0.67
      percent, over 6, 4 and 12 curves, at a reference prime of about 10 bits, and
      with no dispersion estimate for any arm.
    citation: >-
      The committed red-team notes of this campaign, section 11, and the derived
      figures relayed in EV-ICINV-6b6264.
    provenance: internal
    verified_by: >-
      TASK-20260904-5423ad read the committed red-team notes directly and confirms
      every figure above, including the curve counts and the explicit statement that no
      dispersion estimate is reported for any arm.
    role: >-
      the standing anomaly whose SIGN this record predicts, and the reason the
      basis-size arm is gated on a noise-floor measurement
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
  - metric: >-
      rank deficit at each locus, in rows, equal to the generic Macaulay rank minus
      the rank at the locus, per degree per arity
    direction: higher
    minimum_effect: >-
      STRICTLY POSITIVE at the largest-block locus at some degree. A deficit of zero
      at every locus and every degree means the specialisation is invisible to the
      rank and the whole practical reading is empty, which is itself informative.
  - metric: >-
      elliptic rank deficit minus matched curve-free rank deficit at the same block
      size, in rows
    direction: higher
    minimum_effect: >-
      Exceeding the curve-free arm's draw-to-draw spread over at least 20 draws, by
      at least a factor of 2. Below that, the deficit is what any coefficient-block
      vanishing produces and carries no elliptic-curve content.
  - metric: >-
      basis size at each locus against generic, as a ratio, dimensionless
    direction: higher
    minimum_effect: >-
      At least 1.00 minus the measured noise floor, at every locus. The noise floor is
      measured FIRST on repeated identical inputs and the minimum detectable effect is
      fixed before any comparison. A locus strictly below that is a pre-registered
      falsification and would be the most interesting outcome available.
  - metric: >-
      rational-point count of the summation system in a fixed window, per locus
    direction: different
    minimum_effect: >-
      NO CONSISTENT DIRECTION across the eight loci - some up, some down. A consistent
      direction means either the escape classification is wrong or the point counting
      is, and both are checked before either is believed.
  - metric: >-
      generic maximality over 1000 random coefficient pairs, as a count of pairs whose
      rank exceeds the computed generic rank
    direction: different
    minimum_effect: >-
      EXACTLY ZERO. A single pair exceeding the generic rank means the generic
      computation was performed at a special point and everything is void.
  - metric: >-
      non-zero entry count against rank, per locus
    direction: lower
    minimum_effect: >-
      Reported as a contrast table. The non-zero entry count FALLS while the rank also
      falls, so the two move in the same direction while their cost consequences move
      in opposite directions - the clearest available statement that sparsity and
      hardness are not the same axis.
  test_boundary:
    instances:
    - >-
      The summation system at arity 3, and at arity 4 if the budget allows, at degrees
      up to rank stabilisation, both factor-base-free and factor-base-bearing, never
      pooled.
    - >-
      A matched curve-free system - same variables, same monomial support, coefficients
      polynomial in two indeterminates with a deliberately planted vanishing block of
      the SAME size as the elliptic locus under comparison, at least 20 independent
      draws per block size.
    - >-
      1000 random coefficient pairs for the generic-maximality control.
    - >-
      Ten random weight-12 loci, retained as an implementation check and labelled as
      one, since a random locus is generic by construction.
    parameters:
      loci: 'the eight known loci - the two trivial coefficient factors and the six weight-12 forms'
      block_sizes_matched: '48, 36, 6, 6, 4, 1'
      degrees: 'up to and including the degree at which the rank profile stabilises, which must be demonstrated'
      primes: 'the reference prime of about 10 to 12 bits and one prime above 2 to the 20'
      monomial_orders: 'two, since the rank of a fixed-degree Macaulay matrix on a fixed monomial basis is order-independent and disagreement is an implementation error'
    implementation: >-
      Symbolic rank computation over the function field of the two coefficients for
      the generic point, and by substitution at each locus, in two engines sharing no
      code. NO minimal free resolution is required anywhere, so the resolution-backend
      precondition that paused an earlier contract in this lane does not bind this one.
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 8
      maximum_memory_gb: 16
      maximum_runs: 6
  falsification_conditions:
  - >-
    A rank at any locus strictly exceeding the generic rank at any degree - the
    theorem is contradicted; check first whether the generic point was itself special,
    since that is the overwhelmingly likely cause, and reproduce in a second engine
    before concluding anything.
  - >-
    THE MATCHED CURVE-FREE SYSTEM SHOWS A COMPARABLE RANK DEFICIT - the deficit is
    what specialising any polynomially parametrised family with a vanishing
    coefficient block produces, it carries NO elliptic-curve content, and no statement
    about elliptic curves or the ECDLP may be quoted from the rank arm in either
    direction.
  - >-
    Basis size at any locus strictly smaller than generic beyond the measured noise
    floor - the practical reading of the theorem fails, the monotonicity from quotient
    size to basis size is not what it appears, and the lane has a real,
    direction-correct effect to chase. This is the outcome that would reopen the
    algebraic half.
  - >-
    A random coefficient pair in the generic-maximality control exceeds the computed
    generic rank - the generic computation was performed at a special point and
    everything is void.
  - >-
    The rational-point counts move consistently in one direction across all eight loci
    - either the escape classification is wrong or the point counting is.
  - >-
    The cited semi-continuity theorems cannot be verified at stated theorem numbers -
    the argument's external support is unconfirmed and the record's status drops to
    unverified rather than being asserted anyway.
  interpretation_limits:
  - >-
    THE CLOSURE IS SCOPED TO RANK-DEFINED FUNCTIONALS OF THE COEFFICIENT FAMILY. It
    does NOT close relation density, factorisation type over the base field, the
    automorphism discount, sparse-matrix constants charged per non-zero entry, or the
    multi-instance and preprocessing model. Those escapes are the forward guidance and
    they are not optional.
  - >-
    THE SIGN OF THE INEQUALITY IS A THEOREM AND IS THEREFORE NOT A TEST. Any report
    that presents eight-of-eight agreement with the inequality as a confirmation of a
    mechanism has confirmed linear algebra. The discriminating result is the deficit
    magnitude against the curve-free arm.
  - >-
    IT IS A STATEMENT ABOUT THE FAMILY, NOT ABOUT THE ECDLP. No cost model, no
    exponent, no attack.
  - >-
    THE STEP FROM ALGEBRA SIZE TO WALL-CLOCK IS EMPIRICAL AND WEAK BY THIS CAMPAIGN'S
    OWN COMMITTED DATA. The theorem's practical force is a DIRECTION, not a
    magnitude, and this record claims only the direction - and only after the noise
    floor is measured.
  - >-
    UNTESTABLE AT REACHABLE SCALE, STATED RATHER THAN SHRUNK. Whether the rank deficit
    has any consequence for solving cost AT CRYPTOGRAPHIC PARAMETERS is not testable
    here or by any reachable experiment. The factor-base-bearing system at deployed
    factor-base sizes has a Macaulay matrix far beyond any budget this program has, and
    in that formulation the solving degree is pinned by the factor-base size rather
    than by the curve in any case - so the quantity that would matter is both
    unmeasurable and, by the campaign's own argument, insensitive to the effect.
  - >-
    Generic over a finite field is not generic over an algebraically closed field. The
    eight loci carry about eight over the prime of the coefficient pairs, which the
    run must COMPUTE rather than describe as dense, and at very small primes the
    argument is vacuous.
  - >-
    A conclusion drawn at degrees below rank stabilisation is about a truncation and
    not about the ideal. Stabilisation must be demonstrated, not assumed.
  - >-
    Minors non-zero over the rationals can vanish in a given characteristic, creating
    loci that exist only there. Those are reported separately and are not part of the
    characteristic-zero statement.
