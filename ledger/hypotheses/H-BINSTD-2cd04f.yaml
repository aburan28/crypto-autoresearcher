    equals the written m. The density 2/100 exceeds 1/1000 by
    19/1000, and their ratio is 20. The band width 7/10 divided
    by 1/10 is 7. 200 divided by 25 is 8. Three arms give three
    pairwise comparisons. Two to the power 17 is 131072. Two to
    the power 23 is 8388608.
