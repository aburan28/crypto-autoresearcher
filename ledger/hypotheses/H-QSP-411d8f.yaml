  reduction_chain:
    core_problem: >-
      Whether the m=2 chain system's eliminant degree is a constant-fraction
      of the paper's M(E)=4d as d grows from 2 to 3, at toy n in {17, 23}.
    corollaries:
      - problem: >-
          A lower bound kappa >= 1 for the structured chain systems, which
          would suffice for (E') at every n. NOT A COROLLARY OF THIS RECORD:
          this record measures degree, not solving exponent, and only at m=2.
        reduction_ref: H-QSP-645a07 H1 / KN-OPEN-ac409f
        asymptotics_preserved: >-
          not applicable; no complexity claim is made, and no transfer to
          n=131 is licensed
  predictions:
    - metric: >-
        rho_paper = deg_elim / (4d) at (m, d) in {(2,2), (2,3)}, n in {17, 23},
        over the frozen lambda list
      direction: different
      minimum_effect: >-
        Under H1 the ratio is >= 1/2 at both d and does not drop by a factor
        of 2 or more from d=2 to d=3, at every tested n. A growing deficit
        (median rho at d=3 less than half the d=2 median) or both medians
        < 1/4 refutes H1 at these cells. Either outcome is recorded; no
        direction is promised. Two points cannot fit a growth law in m.
    - metric: rho_note = deg_elim / (4 d^2) at the same cells
      direction: different
      minimum_effect: >-
        Reported as a comparison column. H1 is not evaluated against this
        formula. No direction promised; the discrepancy is not adjudicated.
  test_boundary:
    instances: >-
      n in {17, 23} over F_2[z]/(z^17+z^3+1) and F_2[z]/(z^23+z^5+1)
      respectively (the irreducibles used by EXP-QSP-33b442 Stage 2, re-checked
      irreducible over F_2 this session by a Ben-Or gcd sweep). m=2 fixed.
      d in {2, 3}. n' = ceil(n/2) in {9, 12}. xi=1. lambda: the 2+8=10
      non-linearized F_2 polynomials of exact degree d counted in
      EXP-QSP-82a906. Plus C1 null (one random pair per (n,d)), C2 d=1
      (lambda=X known-collapse; lambda=X+1 well-defined). n in {29, 41} and
      m>=3 are OUT OF SCOPE for v1.
    parameters:
      M_E_paper_at_m_2: 4d
      M_E_paper_at_2_2: 8
      M_E_paper_at_2_3: 12
      M_E_note_at_m_2: 4*d^2
      M_E_note_at_2_2: 16
      M_E_note_at_2_3: 36
      rho_paper: deg_elim / (4d)
      consistent_floor: 'median rho_paper >= 1/2 at both d, and d=3 median >= d=2 median / 2'
      refute_growing_deficit: 'd=3 median < d=2 median / 2'
      refute_far_below: 'both medians < 1/4'
    implementation: >-
      Two independent bit-packed Sylvester resultant implementations over
      F_{2^n} (C and Python), specified under
      experiments/EXP-QSP-82a906/implementation/. gcc 13.3.0, g++, python3
      3.12.3, numpy 2.4.4 PRESENT (measured this session). sage, sympy,
      macaulay2/M2, singular, msolve, magma, galois, FLINT/NTL headers,
      libflint, libntl ABSENT (measured this session). analysis/qsp-ecc2k130/
      explore/gf2rc.c is a GF(2)[X] root counter, not a resultant-over-F_{2^n}
      engine; helpers may be copied into implementation/ with provenance and
      are never a result. No Groebner engine is used or required.
    budget: >-
      Machine protection 4 GB, 1 worker. Time/CPU advisory. ECC unlimited
      is not a license to add m=3 Groebner cells to this version.
  falsification_conditions:
    - >-
      G1. A certified growing deficit: at any tested n, with C3 agreement,
      median_lambda rho_paper(d=3) < median_lambda rho_paper(d=2)/2. H1 is
      refuted at m=2, that n, the tested lambda class. Archive and stop.
    - >-
      G2. Identically far below: at any tested n, both medians < 1/4, or
      every chain cell at that n has identically-zero eliminant with a
      recorded non-constant bivariate gcd. Same scoped refutation.
    - >-
      G3. Two implementations disagree on deg_elim at any reported cell:
      the RUN is invalid, not the hypothesis (AGENTS.md rule 5).
    - >-
      G4. Timeout, crash, missing compiler, memory cap: infrastructure,
      never evidence.
    - >-
      G5. C2a (lambda=X) returning a nonzero resultant: the instrument is
      not computing Sylvester resultants; the run is invalid.
  interpretation_limits:
    - >-
      THIS RECORD IS AT `specified` AND ASSERTS NOTHING ABOUT THE WORLD YET.
      Approval of EXP-QSP-82a906 authorizes the measurement and asserts
      nothing about H1 or about (E').
    - >-
      Consistency with H1 at m=2 is not validation at m=3,4, not a lower
      bound on kappa, not a promotion of (E'), and not a move of
      H-QSP-645a07.
    - >-
      A collapse that also appears on the C1 null object is an artefact of
      the instrument, not a property of the chain (inventor protocol:
      controls before belief).
    - >-
      NO ATTACK, NO EXPONENT, NO DEPLOYED CURVE. rho on ECC2K-130 stays
      2^60.9 (KN-LIT-096). Scale tier of any later evidence is toy.
    - >-
      Two d values cannot fit a growth law in m. n in {29, 41} and the
      Groebner ladder remain the idea's later cells.
