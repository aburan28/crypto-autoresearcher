        split across lines 1029-1032 of the frozen text, univariate degree
        "bounded by M(E)", root-finding "can be neglected").
      citation: KN-LIT-0a321c
      provenance: retrieved
      verified_by: >-
        coordinator, this design session, 2026-09-17: inputs/HUANG-2020-JMC-QSP/
        paper_fulltext.md Section 3.1 (lines 422-520), Lemma 3.1 (lines 537-553),
