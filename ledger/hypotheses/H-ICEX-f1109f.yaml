hypothesis:
  id: H-ICEX-f1109f
  question_id: RQ-ECDLP-002
  statement: >-
    Let F be a public coordinate-defined factor base in the prime-order subgroup
    G = <P> of a toy curve, A a public target-independent offset set, and R a
    public target. The public overlap fingerprint A_F,A(R) = (|F intersect (F + R
    + [a]P)|)_{a in A} localises the hidden scalar strictly better than the same
    fingerprint built from a same-shape null factor base - specifically, the
    target-weighted median exhaustive candidate exponent u = log_N |C(R)| is at
    least 0.05 below the matched-null median, on each of the three largest
    completed subgroup sizes, at a comparison cell where the NULL median u lies
    strictly inside (0, 1). This is an information gate. It asserts no decoder,
    no sub-square-root inverse, and no ECDLP algorithm.
  mechanism: >-
    Coordinate-defined factor bases can have nonrandom additive intersections.
    Translating F by the live target and a short public scalar offset yields a
    directly computable count whose distribution may depend on the target's
    scalar position relative to F. Several offsets form a low-bandwidth
    fingerprint. At toy scale, enumerating every [k]P yields the exact collision
    fiber C(R) and hence exact candidate entropy, and blinded translations R +
    [t]P test whether any effect tracks the hidden shift rather than target
    labels.
  assumptions:
  - >-
    E over F_p, the prime-order subgroup G = <P>, the factor-base predicate, the
    offset set A, the enumeration order, the membership structure and the null
    generator are all public and are frozen before any target is sampled.
  - >-
    Every fingerprint coordinate is computable from R, P, F and public group
    operations alone, with no discrete-log oracle and no target-specific
    precomputed table.
  - >-
    Exhaustive scalar enumeration is a MEASUREMENT ORACLE charged separately and
    never projected into any online cost. Online work and exhaustive measurement
    work are reported as two disjoint budgets.
  - >-
    BAND NON-DEGENERACY, ADDED BY THIS CONTRACT AND NOT PRESENT IN THE SOURCE
    IDEA. The discriminator is a difference of candidate exponents. If the offset
    set is large enough that the fingerprint is injective on scalars in BOTH
    arms, then |C(R)| = 1 and u = 0 in both arms, the discriminator is
    identically zero over the whole declared range, and no alternative hypothesis
    can move it. The comparison cell is therefore chosen by a null-only
    calibration pass, before the structured arm runs, as the largest |A| whose
    null median u lies in [0.10, 0.90]. If no |A| on the declared ladder yields
    an interior null median, the design cannot discriminate and the experiment
    terminates as design-infeasible rather than reporting a difference of zero.
  proof_search_map:
    bottleneck: >-
      Establish whether a public target-shift overlap statistic carries scalar
      information beyond same-shape geometry, and expose that information through
      an exact candidate fiber rather than through a moment separation that no
      decoder consumes.
    baseline_embedding:
      parameter_slice: >-
        With A empty the candidate fiber is all N scalars and u = 1. With the
        fingerprint injective the fiber is a single scalar and u = 0. Both
        endpoints are degenerate for a difference-of-medians discriminator, and
        the calibration pass exists to keep the comparison off both.
      reproduction_check: >-
        For each toy group, direct pair enumeration and translated-membership
        counting must return bit-identical overlap vectors, and every exhaustive
        fiber must contain the true target scalar.
    observation_collision:
      observable: The ordered vector of target-shift intersection counts.
      distinct_preimage_search: >-
        Enumerate all scalars, hash the exact vectors, retain every collision
        bucket, and search for same-shape factor-base variants with equal
        fingerprints and different fibers. Report worst-case and target-weighted
        entropy separately.
    constructive_transforms:
    - transform: public_shift_probe
      proposed_object: >-
        Counts of intersections between F and its public live-target
        translations, replacing an inaccessible source autocorrelation.
      predicted_gain: >-
        A lawful target-dependent observable with explicit group-operation and
        membership-probe cost.
    - transform: exact_fiber_gate
      proposed_object: >-
        The complete scalar collision bucket of each toy fingerprint.
      predicted_gain: >-
        Candidate entropy measured exactly, blocking any inference from a moment
        separation to scalar recovery.
    quantifier_order: >-
      THERE EXISTS one target-independent public F and one offset family A such
      that FOR RANDOM blinded targets R = [k]P the fingerprint has lower
      candidate entropy than FOR RANDOM same-shape null factor bases, with F and
      A fixed before k is drawn. F and A may not be tuned per target.
    method_ceiling:
      strongest_certifiable_claim: >-
        A toy information separation with an exact collision-fiber measurement.
        Even u < 1/2 certifies no algorithm, because the fiber is constructed by
        enumerating N scalars and no sublinear inverse is supplied.
      nearby_object_control: >-
        A random negation-symmetric subset with identical cardinality,
        coordinate-bucket counts, membership representation, offset count and
        group. A separation shared with this control is finite-group geometry,
        not coordinate factor-base structure.
    proof_obligations:
    - claim: Every fingerprint coordinate is public and target-computable.
      responsibility: interface
    - claim: Direct and translated-membership counts agree exactly.
      responsibility: baseline
    - claim: The exhaustive fiber contains the true scalar and all collisions.
      responsibility: correctness
    - claim: Any entropy separation survives target blinding and null matching.
      responsibility: strictness
    - claim: Online probes, setup, exhaustive measurement and output are charged separately.
      responsibility: runtime
    - claim: The comparison cell has a null median candidate exponent strictly inside (0, 1).
      responsibility: feasibility
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: >-
      FOR ALL completed subgroup sizes on the declared ladder, at the calibrated
      comparison cell, the target-weighted median collision-fiber exponent of the
      frozen overlap vector is stable to within 0.10 between adjacent sizes.
    random_model_justification: >-
      Independent matched subsets give a hypergeometric count baseline and its
      concentration scale. Square-root cancellation for character-type sums over
      curve points motivates the expectation that the structured arm matches the
      null; neither implies independence nor an inverse.
    supporting_results:
    - >-
      Hypergeometric concentration for matched random subsets, used as the null
      baseline only.
    validation_experiment_ids:
    - EXP-ICEX-8cd977
    falsification_condition: >-
      The exponent gap shrinks toward zero, changes sign, or varies by more than
      0.10 across the largest adjacent sizes.
  - id: HEUR-002
    formal_statement: >-
      FOR ALL declared replacement fractions, replacing the coordinate
      factor-base predicate by independently resampled membership bits drives the
      entropy gap monotonically to the matched-null value, with at least 75
      percent total decay at full replacement.
    random_model_justification: >-
      At full replacement the construction IS the declared matched random subset,
      so the endpoint is forced. Intermediate fractions are an empirical
      interpolation and are not a theorem.
    supporting_results:
    - >-
      The full-replacement endpoint is definitional, not assumed.
    validation_experiment_ids:
    - EXP-ICEX-8cd977
    falsification_condition: >-
      No monotone decay, or less than 75 percent total decay, which labels the
      original gap an artifact or a generic finite-group effect.
  structural_ingredients:
  - description: >-
      Homometric ambiguity of autocorrelation-like data, motivating exhaustive
      fiber accounting rather than an injectivity assumption.
    citation: Ranieri, Chebira, Lu, Vetterli, arXiv:1308.3058
    provenance: recalled
    verified_by: null
    role: non-injectivity warning
  - description: >-
      Square-root cancellation for exponential sums over points of elliptic
      curves, cited as the reason the structured arm is EXPECTED to match the
      null rather than as a quantitative bound.
    citation: Ahmadi and Shparlinski, arXiv:1302.4210
    provenance: recalled
    verified_by: null
    role: null-side expectation
  reduction_chain: null
  predictions:
  - metric: exhaustive_candidate_exponent_u_equals_log_N_of_fiber_size
    direction: lower
    minimum_effect: >-
      Target-weighted median u at least 0.05 below the matched-null median on
      each of the three largest completed sizes, at the calibrated comparison
      cell. Worst-case u reported separately and never substituted for the
      median.
  - metric: conditional_min_entropy_reduction_versus_same_shape_null_in_bits
    direction: higher
    minimum_effect: >-
      At least 0.05 * log2(N) bits with a target-blinded 95 percent interval
      excluding zero. Information only; no attack credit.
  - metric: exhaustive_fiber_recall
    direction: higher
    minimum_effect: >-
      Exactly 1.000000 for every completed target. One omitted true scalar
      invalidates the fiber implementation and the whole run.
  - metric: normalised_separation_under_predicate_randomisation
    direction: lower
    minimum_effect: >-
      At least 75 percent decay from the unmodified factor base to the fully
      randomised same-shape predicate, monotone in the replacement fraction.
  - metric: planted_period_control_candidate_exponent
    direction: different
    minimum_effect: >-
      A factor base carrying a planted public scalar period d must yield u equal
      to 1 - log_N(d) within 0.02. This is the defect of known size and its
      predicted magnitude.
  test_boundary:
    instances:
    - public generated prime-order toy subgroups, 12 to 24 bits
    - at least 200 blinded targets per completed cell
    parameters:
      factor_base_densities: at least 3
      offset_sizes: [1, 2, 4, 8, 16, 32]
      comparison_cell: chosen by null-only calibration before the structured arm runs
    implementation: >-
      Public toy-group generator, coordinate-defined factor-base predicate,
      exhaustive scalar enumeration used only as a measurement oracle.
    budget:
      wall_clock_seconds_per_run: 3600
      maximum_memory_gb: 12
      maximum_runs: 120
  falsification_conditions:
  - >-
    Any fingerprint coordinate requires a hidden scalar, a source label, or a
    target-specific precomputed table rather than public group operations.
  - >-
    The true scalar is missing from any exhaustive collision fiber.
  - >-
    The median candidate exponent fails to beat the matched null by 0.05 on the
    three largest completed sizes at the calibrated cell.
  - >-
    The separation persists unchanged after full predicate randomisation, or
    vanishes under an isomorphic coordinate gauge with no declared scope reason.
  - >-
    No offset size on the declared ladder yields a null median u inside
    [0.10, 0.90]. The discriminator is degenerate over the declared range and the
    experiment terminates as design-infeasible; this is NOT a negative result
    about the mechanism.
  - >-
    The planted-period control does not return u = 1 - log_N(d) within 0.02. The
    fiber instrument has no demonstrated dynamic range and no number from it is
    admissible.
  interpretation_limits:
  - >-
    This is a gate. It supplies no sublinear fiber construction, no decoder, no
    ECDLP algorithm and no time-exponent claim, and a positive outcome remains
    strictly dominated by Pollard rho and BSGS.
  - >-
    The decoder requirements that would be needed for a below-rho route - u < 1/2
    with online fingerprint evaluation AND candidate recovery below N^{1/2}, no
    N-sized table, certificate-bearing verification - are UNTESTABLE AT REACHABLE
    SCALE by this design and by any toy design, because the fiber here is built
    by enumerating all N scalars. The contract states this rather than shrinking
    the claim to something a toy run can reach.
  - >-
    A toy entropy gap may be a small-field or coordinate-gauge effect and may not
    be extrapolated without a validated scaling assumption and independent review.
  - >-
    The overlap statistic is an additive-combinatorial quantity of a subset of a
    finite abelian group. A curve-free arm in Z/N is therefore mandatory, and if
    the curve-free object reproduces the entropy gap, nothing here may be quoted
    as a statement about elliptic curves or the ECDLP.
  status: proposed
  proposed_by: coordinator
