hypothesis:
  id: H-PFDR-e02f3b
  question_id: RQ-PFDR-ae2fba
  source_idea_id: IDEA-20260903-751062
  title: >-
    The one recorded prime-field early fall (EXP-ALPF-011 e-ring, quoted by
    EV-ALPF-001 and RQ-PFDR-ae2fba as 'POSITIVE (SURVIVED)') is a closed-form
    membership-only shared-factor syzygy at d_ff = |FB| - 1 with kernel
    dimension 3, present for every curve, prime and target and absent from
    the summation rows, and the m = 2 symmetric arm's 'flat' reading is a
    reduced-basis output-degree proxy; under the derivation no prime-field
    early fall involving S_{m+1} has been recorded in this program
  statement: >-
    (A) THE ARCHIVE VERSUS THE LEDGER. EV-ALPF-001's line for EXP-ALPF-011
    quotes the Section-5 auto-verdict 'POSITIVE (SURVIVED)'; the archived
    result file's section 8 (red-team correction) records the e-ring and
    power-sum fires (16/16 cells) as a coordinate-artifact shared-factor
    syzygy living entirely in the FB constraints, with a generic twin on the
    identical degree profiles NOT firing, and a corrected verdict 'FAILED
    (BANKABLE NEGATIVE)'; the x-ring baseline never fired (0/16). EXP-ALPF-
    013's localization gate fails the e-ring and power-sum fires on
    reconstructed leading forms and names the exact-builder re-run as
    undone. EV-ALPF-001's EXP-ALPF-001 line (m = 2 symmetric arm, 'd_ff
    bounded (flat) strictly below D_reg') reads d_ff and D_reg off the
    minimum and maximum total degree of the reduced Groebner basis with a
    factor base of exactly two elements -- the output-degree proxy Q1 of
    IDEA-20260807-899c5e under the CRT degeneracy of IDEA-20260830-cb8e46.
    (B) THE MECHANISM, DERIVED. In the e-ring the factor-base constraint
    F(t) = prod_{v in FB}(t - v) of degree k = |FB| is reduced modulo
    M(t) = t^3 - e_1 t^2 + e_2 t - e_3 to a quadratic in t whose three
    coefficients are the membership generators. With t^j = A_j t^2 + B_j t
    + C_j mod M, the recurrence A_{j+1} = e_1 A_j + B_j, B_{j+1} = -e_2 A_j
    + C_j, C_{j+1} = e_3 A_j from (A_3, B_3, C_3) = (e_1, -e_2, e_3) gives,
    by induction in the standard grading deg e_i = 1, top(A_j, B_j, C_j) =
    e_1^{j-3}(e_1, -e_2, e_3) of degree j - 2. So the three membership top
    forms are e_1^{k-3}(e_1, -e_2, e_3) of degree k - 2, all divisible by
    e_1^{k-3} and proportional to one fixed vector; hence e_2 h_A + e_1 h_B
    = 0, e_3 h_A - e_1 h_C = 0, e_3 h_B + e_2 h_C = 0 are three independent
    non-Koszul syzygies at degree k - 1 (Koszul pairs sit at 2(k - 2)).
    THEREFORE d_ff = k - 1 exactly with nontrivial kernel dimension 3, for
    EVERY curve, prime and target, involving no row of S_4. ARCHIVE CHECK
    AT ZERO COMPUTE: k = 4 gives 3 and k = 5 gives 4, matching all 16 e-ring
    cells; EXP-ALPF-013's gate table records nontriv_full = nontriv_fb = 3 at
    d_ff = 3. D_reg of the profile [k-2, k-2, k-2, 4] in 3 variables is 4,
    5, 7, 8, 10 at k = 4..8, so the archived 'flat' is flatness in p at fixed
    |FB|, not in the factor-base size.
    (C) FOUR MECHANISMS, ONE SEPARATING INVOCATION. M1 GENUINE: a non-Koszul
    syzygy at d_ff with nonzero support on the summation rows, absent from
    a support-matched null. M2 MEMBERSHIP-ONLY: the syzygy lives in the
    membership block, present with S_4 replaced by a random polynomial of
    the same degree (predicted by B). M3 CRT/UNIT-IDEAL: an ideal-invariant
    reading trivial because the ideal is radical of tiny dimension, often
    the unit ideal on a random target. M4 OUTPUT-DEGREE PROXY: Q1 of
    899c5e. The separating cell is one invocation on the EXACT archived
    builders at |FB| in {4..8} with the shrink test, the S_4-scrambled null,
    planted targets, and Q1 recorded alongside. M1 is uniquely 'shrink test
    positive AND null does not fire'; M2 is 'd_ff = |FB| - 1, shrink test
    zero, null fires identically'.
    (D) A superseding measurement, not a re-run: nothing immutable is
    edited; the deliverable is a new measurement under a validated meter
    with a matched null, citing the old one, and a draft of the evidence
    supersession for the Coordinator.
  mechanism: >-
    TRACKED OBJECT: the pair (d_ff, localization bit) of the top-form
    syzygy module -- the first degree with a non-Koszul syzygy and whether
    any such syzygy has nonzero support on the summation-polynomial rows
    (EXP-ALPF-013's gate_meaningful). It keeps one integer and one bit from
    a module, propagates monotonically under the Macaulay degree step, and
    is blind to the solving degree (stated horizon). WHY ONE RUN SEPARATES
    FOUR MECHANISMS: M2 is a statement about membership top forms only, so
    scrambling S_4 leaves it fixed; M1 is a statement about S_4's rows, so
    scrambling S_4 destroys it; M3 and M4 are statements about the ideal
    and the reduced basis, blind to the generating set, detected by
    comparing Q1 and vdim against the Macaulay d_ff on the same instance
    with a planted target (vdim >= 1) and a random target (unit ideal with
    probability about 1 - 8 |FB|^3 / p at m = 3). DECAY CHECK: under M2 the
    gap D_reg - d_ff grows with |FB| (1, 1, 2, 2, 3 at |FB| = 4..8) while
    d_ff = |FB| - 1; a gap constant in |FB| is the artifact tell of an
    instrument and is reported first.
  assumptions:
    - >-
      The archived ALPF-011 Sage builders (build_S4_poly,
      rewrite_S4_in_e_coords, build_fb_constraints_e_ring) reproduce the
      archived degree profiles ([2, 2, 2, 4] at |FB| = 4, [3, 3, 3, 4] at
      |FB| = 5) when re-run at seed 42; a mismatch halts the line as a
      reconstruction finding.
    - >-
      Two meters are run and cross-checked on every cell: the inline ALPF
      leading-form meter reconstructed from EXP-ALPF-009/010/013 sources
      (the file EXP-ALPF-011 load()ed is absent from the archive) and the
      F_p port of macaulay.py; both self-validated on POS-A / NEG-1 / NEG-2
      and on the 16 archived cells before any new cell is read.
    - >-
      Standard grading deg e_i = 1 (the grading the archived meter used);
      the weighted arm deg e_i = i is reported separately.
    - >-
      Toy scale: p at most 2^19 as archived plus one 2^23 cell for the
      p-independence check; Sage available to the executor.
  proof_search_map:
    bottleneck: >-
      The step 'a prime-field representation early-falls under a validated
      meter, therefore the degree column of the RQ has a positive'. The
      hypothesis claims the step is invalid for both archived arms and that
      the correct reading of the archive is an empty degree column.
    baseline_embedding:
      parameter_slice: >-
        The archived 16 e-ring cells (k = 4, 5) must reproduce d_ff = 3, 4
        and D_reg = 4, 5 exactly on the exact builders; the archived x-ring
        cells must reproduce d_ff = D_reg = 10, 12; EXP-ALPF-013's gate
        values (nontriv_full = nontriv_fb = 3 at k = 4) must reproduce on
        the exact builders rather than on reconstructions.
      reproduction_check: >-
        Symbolic: the recurrence in (B) at k = 4 gives (e_1^2, -e_1 e_2,
        e_1 e_3), matching section 8's h3 = e1^2, h2 = -e1*e2, h1 = e1*e3
        literally. Frozen: seed 42, the archived curve list (13-bit Solinas
        p = 4079 named in section 8), the archived FB pool.
    observation_collision:
      observable: >-
        The bit 'fires' (d_ff < D_reg) on a homogeneous leading-form meter.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED: the S_4-scrambled null (random
        degree-4 polynomial in e-coordinates with the same membership
        generators) is a distinct ground truth with the same observable
        (fires, d_ff = k - 1, kernel 3). The collision proves that 'fires'
        alone does not identify a Semaev early fall.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Reduce 'does the e-ring early-fall' to 'the membership block's top
          forms are e_1^{k-3} times a fixed vector', a divisibility
          condition checkable by hand.
        predicted_gain: >-
          Replaces 16 measured bits with a two-line induction and a per-k
          prediction.
      - transform: observable_fiber
        proposed_object: >-
          Hold 'fires' fixed and vary the summation polynomial (Semaev
          versus random degree-4); the invariant separating the fibre is the
          localization bit.
        predicted_gain: >-
          A one-bit certificate that any future prime-field fire must carry.
    quantifier_order: >-
      CLAIMED: FOR ALL k >= 4, FOR ALL p > 3, FOR ALL curves and targets,
      the e-ring membership block has three non-Koszul syzygies at degree
      k - 1 and none below, hence d_ff <= k - 1 with equality whenever S_4's
      rows contribute no lower non-Koszul syzygy (forced by degree at
      k = 4). NOT CLAIMED: that S_4 never contributes a syzygy at some
      k >= 5 -- exactly what the shrink test measures.
    method_ceiling:
      strongest_certifiable_claim: >-
        'On the exact archived builders at |FB| in 4..8, three primes and
        three curves, the e-ring and power-sum fires are membership-only
        (shrink test zero, null fires identically) and d_ff = |FB| - 1; the
        m = 2 symmetric arm's flat reading is a reduced-basis proxy; no
        archived prime-field representation carries a summation-involving
        early fall.' It cannot certify anything about representations not
        in the archive, about F4 behaviour, or about any cost.
      nearby_object_control: >-
        The Weil-restricted S_3 over F_{p^2} (EXP-ALPF-013's POS-C), where
        the gate PASSES: the method must distinguish it from the e-ring. A
        second nearby object: the e-ring with the membership constraints
        replaced by three random forms of degree k - 2 with no shared factor
        and the genuine S4sym kept -- predicted NOT to fire, isolating the
        shared factor as the sole cause.
    proof_obligations:
      - claim: >-
          top(A_j, B_j, C_j) = e_1^{j-3}(e_1, -e_2, e_3) for j >= 3 under
          deg e_i = 1.
        responsibility: correctness
      - claim: >-
          The three displayed syzygies are non-Koszul and independent at
          degree k - 1.
        responsibility: strictness
      - claim: >-
          D_reg of [k-2, k-2, k-2, 4] in 3 variables is 4, 5, 7, 8, 10 at
          k = 4..8.
        responsibility: baseline
      - claim: >-
          The exact builders reproduce the archived profiles and integers.
        responsibility: baseline
      - claim: >-
          The S_4-scrambled null fires identically (M2) and the
          random-membership null does not.
        responsibility: interface
      - claim: >-
          The evidence supersession changes no immutable record and proposes
          no status change.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        UNIT-IDEAL PROBABILITY. For a uniformly random affine target and a
        random factor base of k on-curve x-coordinates at m = 3, the e-ring
        decomposition ideal is the unit ideal with probability
        1 - 8 k^3 / p (1 + O(t/p)), so the archived ALPF-011 cells (k <= 5,
        p >= 2^13) were unit ideals with probability at least 0.87 each.
      random_model_justification: >-
        Rigorous: KN-FIND-a8990a Theorem C fixes 4 candidate last
        coordinates per pair (complete splitting on the factor-base locus)
        and KN-FIND-007's exact mean fixes the expected count; the e-ring
        ideal is the symmetrisation of the direct ideal and is the unit
        ideal iff the direct one is. Classical distribution imitated:
        Poisson occupancy of the 2^{m-1} k^{m-1} candidates in a set of
        size about p/2, the same imitation as IDEA-20260830-cb8e46's H1.
      supporting_results:
        - ref: KN-FIND-007
          provenance: internal
          claim: >-
            Mean per-target decomposition yield binom(B + m - 1, m)/N for
            every base; coverage bound.
          verified_by: coordinator, TASK-20260903-b5d2ae (finding read in full)
        - ref: IDEA-20260830-cb8e46
          provenance: internal
          claim: >-
            Arity-universal CRT degeneracy; ideal-invariant observables
            determined by the point set; unit-ideal probability
            1 - 2^m B^m / p.
          verified_by: coordinator, TASK-20260903-b5d2ae (as cited in IDEA-20260903-751062 and RQ-PFDR-ae2fba; not reopened)
      validation_experiment_ids:
        - EXP-PFDR-4bfc6f
      falsification_condition: >-
        The unit-ideal indicator over 200 random targets per (k, p) cell,
        computed by enumeration over k^3 triples with no Groebner call,
        falling outside the exact binomial 99 percent interval of
        1 - 8 k^3 / p at more cells than the 1 percent level allows across
        the battery.
  structural_ingredients:
    - description: >-
        Reduction of t^k modulo the e-cubic and the induction on the top
        forms of the coefficients.
      citation: IDEA-20260903-751062 (B); experiments/EXP-ALPF-011/source/round006_exp010_validated_resweep_result.md section 8
      provenance: internal
      verified_by: coordinator, TASK-20260903-b5d2ae (751062 read in full; the archived result file as cited by it, not reopened)
      role: correctness of the closed form d_ff = |FB| - 1
    - description: >-
        The localization gate (nontrivial kernel support on summation rows;
        DIRECT and SHRINK tests).
      citation: experiments/EXP-ALPF-013/source/round007_exp012_localization_gate_result.md
      provenance: internal
      verified_by: coordinator, TASK-20260903-b5d2ae (as cited in IDEA-20260903-751062; not reopened)
      role: the localization bit and the shrink test
    - description: >-
        The Q1 output-degree proxy defect and its instrument controls.
      citation: IDEA-20260807-899c5e; IDEA-20260807-1354d8
      provenance: internal
      verified_by: coordinator, TASK-20260903-b5d2ae (as cited in IDEA-20260903-751062 and RQ-PFDR-ae2fba; not reopened)
      role: the M4 classification of EXP-ALPF-001
  reduction_chain:
    core_problem: >-
      No attack problem is reduced. The core statement classifies two
      archived prime-field signals and, if it holds, reduces the RQ's
      degree-column positives from one to zero under the derivation.
    corollaries: []
  predictions:
    - metric: >-
        P1 -- d_ff on the exact e-ring builders at |FB| = 4..8, three
        curves, p in {4079, a 17-bit random prime, a 23-bit prime}
      direction: different
      minimum_effect: >-
        FORCED EXACT 3, 4, 5, 6, 7 (= |FB| - 1) at every cell, independent
        of p and curve; D_reg forced 4, 5, 7, 8, 10.
    - metric: >-
        P2 -- nontriv_full minus nontriv_fb at d_ff (shrink test) on the
        exact builders
      direction: different
      minimum_effect: >-
        FORCED 0 at |FB| = 4 (S_4 cannot enter at degree 3); PREDICTED 0 at
        |FB| = 5..8 (M2). A strictly positive value at any |FB| >= 5, absent
        on NULL-S4 and persisting at the next |FB|, is M1 and is the one
        outcome that puts a positive back into the RQ's degree column.
    - metric: >-
        P3 -- d_ff and kernel dimension on NULL-S4 versus the Semaev arm
      direction: different
      minimum_effect: >-
        FORCED identical (|FB| - 1, kernel 3) under M2.
    - metric: >-
        P4 -- fires bit on NULL-FB (random membership, genuine S4sym)
      direction: lower
      minimum_effect: >-
        FORCED no fire (d_ff = D_reg) at every cell; a fire here means S4sym
        alone early-falls in e-coordinates -- M1 by another route.
    - metric: >-
        P5 -- Q1 (reduced-basis max degree) on planted versus random
        targets, e-ring and x-ring
      direction: different
      minimum_effect: >-
        Random targets: unit ideal (Q1 = 0) at the per-cell rate predicted
        by HEUR-001 within its binomial interval; planted targets: Q1 <= 2
        at m = 3 by CRT. Q1 must NOT track the Macaulay d_ff, which is the
        M3/M4 signature and the calibration of EXP-ALPF-001's proxy.
  test_boundary:
    instances:
      - >-
        the exact EXP-ALPF-011 e-ring and power-sum builders at |FB| in
        {4, 5, 6, 7, 8}; three curves (the archived 13-bit Solinas a = -3
        curve at p = 4079, one random prime-order curve at a 17-bit prime,
        one at a 23-bit prime); planted and random targets; seed 42 for the
        archived-cell reproduction plus seeds 43, 44 for new cells
      - >-
        the 16 archived e-ring, 16 power-sum and 16 x-ring cells, reproduced
        integer for integer before any new cell is read
      - >-
        200 random targets per (k, p) cell for the unit-ideal enumeration
    parameters:
      grading: 'standard deg e_i = 1 (primary); weighted deg e_i = i reported separately'
      arms: 'e-ring Semaev; NULL-S4; NULL-FB; generic twin on the exact profile; POS-C Weil S_3 over F_{p^2}; synthetic gate-POS; x-ring; power-sum'
      meters: 'inline ALPF leading-form meter (reconstructed) and the F_p port of macaulay.py, cross-checked per cell'
    implementation: >-
      Sage, with the archived ALPF-011 source at its committed path; the
      inline ALPF meter reconstructed from EXP-ALPF-009/010/013 sources
      (the EXP-ALPF-013 series.list() D_reg fix applied); the F_p port of
      experiments/EXP-SBRG-60c55e/driver/macaulay.py in ordinary-monomial
      mode (3 free variables), validated on the p = 2 known answer against
      KN-FIND-006 and the planted-syzygy positive control; certificates via
      an independent point-addition verifier.
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 12
      maximum_memory_gb: 8
      maximum_runs: 30
  falsification_conditions:
    - >-
      F1. The exact builders do not reproduce the archived profiles or
      integers: reconstruction finding; the line halts and the archive's
      dependency gap (missing round005 meter file) is reported as the cause
      candidate.
    - >-
      F2. P1 fails at some |FB|: the induction in (B) is wrong at that k
      (checkable by hand) or S_4 contributes a lower syzygy -- M1, then
      tested by P2/P3.
    - >-
      F3. P2 strictly positive at some |FB| >= 5, absent on NULL-S4,
      persisting at |FB| + 1: a genuine summation-involving early fall in
      e-coordinates; routed to independent review before it is named.
    - >-
      F4. NULL-FB fires: S4sym alone early-falls in e-coordinates; M1 by
      another route, same routing.
    - >-
      F5. Q1 tracks the Macaulay d_ff on planted targets: the proxy is not
      degenerate here and the M4 classification of EXP-ALPF-001 is
      withdrawn.
    - >-
      F6 (predicted). P1-P5 hold: both archived arms are classified (M2 for
      ALPF-011's e-ring and power-sum; M3/M4 for ALPF-001's m = 2 symmetric
      arm), and the honest statement for RQ-PFDR-ae2fba is that no
      prime-field early fall involving S_{m+1} has been recorded.
  interpretation_limits:
    - >-
      A control-class hypothesis: it classifies archived signals and
      proposes a superseding evidence note; it moves no exponent, mounts no
      attack, and does not close KN-OPEN-002.
    - >-
      Scoped to the archived representations (x-ring, e-ring, power-sum) at
      m in {2, 3}, |FB| <= 8, p <= 2^23; nothing about F4, other
      coordinates, or cryptographic scale.
    - >-
      'No recorded prime-field early fall involving S_{m+1}' is a statement
      about this program's archive under the derivation, not about
      prime-field decomposition systems in general.
    - >-
      No hypothesis status changes and no edit to any immutable record;
      supersession is by a new evidence record written by the Coordinator
      only after independent review.
