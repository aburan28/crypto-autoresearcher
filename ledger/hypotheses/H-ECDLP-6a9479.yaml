  distinguishable_outcomes:
    - outcome: All four claims hold.
      meaning: >-
        The hard-lift localisation is verified at toy scale: the barrier is one
        p-adic digit, explicit lifts leak it, the price is m^2 bits, the canonical
        non-homomorphic section does not carry it, and the anomalous case breaks
        the argument where it should. The proof map's decodability dichotomy rests
        on a verified identity.
    - outcome: Claim (1) or (3) fails.
      meaning: The splitting argument is wrong somewhere; the map is withdrawn pending re-derivation.
    - outcome: Claim (2) fails.
      meaning: The size law's constant matters at toy scale; reported as a measured correction.
    - outcome: Instrument failure or infrastructure.
      meaning: Nothing learned.
