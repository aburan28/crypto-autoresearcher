  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: digit_identity_agreement_rate
      direction: different
      minimum_effect: exactly 1.0 over all instances and m with n not dividing m.
    - metric: size_slope
      direction: different
      minimum_effect: 2.00 +- 0.05.
    - metric: teichmuller_linearity_rate
      direction: lower
      minimum_effect: at most 3/p.
    - metric: leak_recovery_and_break
      direction: different
      minimum_effect: recovery certified on every instance; refusal at division by n = p on the anomalous curve.
  test_boundary:
    instances:
      - five global curves y^2 = x^3 + a x + b with (x0, y0, a) small integers, b = y0^2 - x0^3 - a x0, nonsingular, frozen by a seeded generator and listed
      - for each, four toy primes of good ordinary reduction in 10 to 14 bits with gcd(n, p) = 1 and group order not equal to p
      - one anomalous toy curve with a global point, found by searching (x0, y0, a) and p
    parameters:
      m_ladder: [1..64 dense, 96, 128, 192, 256]
      j_range: [-3, 3]
      precision: v + 1 and v + 2
    implementation: >-
      A driver under experiments/EXP-ECDLP-a26bde/driver/ using Python fractions
      and the p-adic module of IDEA-20260905-dacf4f; runs through harness/runner.py.
      No numpy needed.
    budget:
      wall_clock_seconds_per_run: 1800
      total_cpu_hours: 4
      maximum_memory_gb: 4
      maximum_runs: 24
  falsification_conditions:
    - A single exact disagreement in claim (1) after the self-checks pass. The identity as stated is false; re-derive.
    - Size slope outside 2.00 +- 0.05 for m >= 16. The height comparison's constant is not negligible at this scale, or the arithmetic is wrong; reported either way.
    - Teichmuller digit linear at a rate far above 3/p. Uniqueness of the homomorphic section is contradicted; re-derive.
    - Recovery fails on an instance, or the anomalous curve does not break at the division step. Instrument defect or misplaced hypothesis; reported.
    - Crashes, timeouts, memory exhaustion. Infrastructure, never negative mathematical evidence.
  interpretation_limits:
    - Toy tier; five curves, twenty primes, one anomalous object.
    - A verified identity is not a theorem at cryptographic scale; the derivation is general and its recalled inputs still need reading.
    - No attack; the leak arm consumes the scalar to produce the lift it reads.
  status: proposed
  proposed_by: claude-code-session
  specified_by: claude-code-session 2026-09-05, as a DESIGN DRAFT; not a Coordinator status change.
  prior_evidence_refs:
