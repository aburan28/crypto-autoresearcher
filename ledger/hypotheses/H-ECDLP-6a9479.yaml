hypothesis:
  id: H-ECDLP-6a9479
  question_id: RQ-ECDLP-c1b7b1
  added: '2026-09-05'
  derived_from_idea: IDEA-20260905-848b77
  instrument_idea: IDEA-20260905-dacf4f
  statement: >-
    SCOPE: five frozen global curves E^/Q with a small-integer rational point S^,
    reduced at toy primes p in the 10 to 14 bit range of good ordinary reduction
    where S = S^ mod p has order n coprime to p and #E(F_p) != p; multiples m S^
    computed exactly over Q for m in {1, ..., 64} union {96, 128, 192, 256}; one
    anomalous toy curve with a global point as the proves-too-much object. CLAIM
    TIER toy. NO ATTACK, NO EXPONENT MOVED: every scalar "recovered" here is
    recovered from an explicit global lift that was produced using the scalar.
    Claim, in four parts. (1) THE DIGIT IDENTITY: with t the torsion section, v =
    v_p(psi(S^ - t(S))) and d(P) = (psi(E_1-component of P) / p^v) mod p, the
    equality d(m S^) = m d(S^) mod p holds exactly for every m with n not
    dividing m, on every curve and prime in scope, at precision v + 1 and v + 2.
    (2) THE SIZE LAW: the bit-size of the numerator of x(m S^) fitted against m for
    m >= 16 has log-log slope 2.00 +- 0.05, and the ratio bit-size / m^2 converges
    to 2 h^(S^) / ln 2 within 10 percent by m = 256, where h^(S^) is estimated by
    the same limit. (3) THE NON-HOMOMORPHIC CONTRAST: the canonical Teichmuller
    section's digit delta_1(s(m S)) equals m delta_1(s(S)) mod p at a rate at most
    3/p over m, never systematically. (4) THE LEAK AND THE BREAK: from an explicit
    lift T' = (m + j n) S^ with a seeded j in {-3, ..., 3}, the integer m + j n is
    recovered from d(T') and the height of T', and m from it, certified by [m]S =
    T, on every instance; and on the anomalous curve the torsion-section
    construction refuses at the division by n = p inside E_1, which is the argument
    breaking at its named hypothesis and nowhere else.
    Claim (1) failing on any instance after the instrument's self-checks pass
    falsifies the splitting identity as stated. Claim (3) failing (systematic
    linearity of the Teichmuller digit) contradicts uniqueness of the homomorphic
    section and forces a re-derivation.
  mechanism: >-
    For gcd(n, p) = 1 the reduction sequence splits on the prime-to-p part and the
    homomorphic section is unique; a global point is torsion section plus a
    formal-group point X_S, and the hard lift m S^ is t(T) + m X_S, so its
    formal-group digit is m times a unit. Any explicit global lift therefore leaks
    m through one digit, and the price of an explicit lift is the canonical height
    m^2 h^(S^) in bits. The Teichmuller section is non-homomorphic (P1543's pro-p
    gate), so its digit cannot be linear in m. On an anomalous curve the section
    does not exist and the identity's derivation stops at division by n = p, which
    is the correct place for the argument to fail.
  assumptions:
    - The five self-checks of IDEA-20260905-dacf4f pass; the instrument is shared with EXP-ECDLP-1e6502.
    - Exact rational arithmetic (Python fractions) for m S^; p-adic digits read from x(m S^) reduced mod p^(v+2) by numerator times inverse denominator.
    - The recalled height comparison is measured (claim 2), not assumed.
    - Toy tier; the derivation is general but only its toy instances are tested.
  proof_search_map:
    bottleneck: the digit identity and the size law
    baseline_embedding:
      parameter_slice: rank-one global points at toy primes
      reproduction_check: exact digit equality and slope 2
    observation_collision:
      observable: d(m S^) and the bit-size of x(m S^)
      distinct_preimage_search: d is injective in m mod p; the bit-size is a function of |m + jn|; both are read from an explicit point only
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: the local digit as the relocated barrier
        predicted_gain: none on the exponent
    quantifier_order: FOR ALL instances and m in scope the identity holds; alternative a single exact counterexample.
    method_ceiling:
      strongest_certifiable_claim: the identity and size law verified at toy scale; the leak demonstration; the anomalous break step
      nearby_object_control: the anomalous toy curve with a global point
    proof_obligations:
      - claim: identity exact
        responsibility: correctness
      - claim: size slope 2
        responsibility: size
      - claim: exact rational multiples to m = 256 within one tool window
        responsibility: runtime
      - claim: toy tier
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: Explicitly null; a verification of a derivation, no complexity claim.
  heuristic_assumptions: []
