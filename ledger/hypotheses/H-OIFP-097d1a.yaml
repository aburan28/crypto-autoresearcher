hypothesis:
  id: H-OIFP-097d1a
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-003
  source_analysis: TASK-20260804-031
  statement: >-
    For two ordinary elliptic curves E and E' over F_p with the same group order N
    (same isogeny class, CM discriminant D = t^2-4p), a birthday meet-in-the-middle
    (MITM) on the ordinary ell-isogeny graph with L = p^{1/4} forward steps from E
    and L backward steps from E' produces a collision (a curve reachable from both
    E and E') in O(p^{1/4}) isogeny evaluations. A Pollard-rho distinguished-point
    variant achieves the same time bound with O(log p) memory.
  mechanism: >-
    Birthday paradox on the isogeny class: the class has h(D) ~ sqrt(p) curves.
    Two random walks each of length L cover fraction L/h(D) ~ p^{1/4-1/2} = p^{-1/4}
    each. Collision probability ~ L^2/h(D) = p^{1/2}/p^{1/2} = 1 at L = sqrt(h(D)) ~ p^{1/4}.
    The collision point gives a path E -> X -> E', establishing the isogeny.
  predictions:
    - metric: collision_steps
      direction: lower
      minimum_effect: >-
        At bits=20 (p ~ 2^20, h(D) ~ 2^10): expected collision after L ~ 2^5 = 32
        isogeny steps forward from E, 32 steps backward from E'. Total ~64 steps.
    - metric: path_length
      direction: specific
      minimum_effect: >-
        The connecting isogeny has degree ell^L ~ 3^32 ~ 2^50 at bits=20.
        Path is found as an explicit chain of ell-isogenies.
  falsification_conditions:
    - >-
      If collision requires > 4 * p^{1/4} steps on average across 20 random (E, E')
      pairs: the p^{1/4} bound does not hold at toy scale.
  test_boundary:
    bits: [20, 40]
    replications: 20
    isogeny_degree_ell: 3
  status: specified
  status_history:
    - status: specified
      decision_id: DEC-20260804-998060
      decided_at: '2026-08-04'
  proposed_by: coordinator
  does_not_modify:
    - H-IT-001
    - H-ICI-063e91
    - H-DS-001
    - H-IC-001
    - H-STR-002
