# prediction under test is the idea's own: I_frob <= floor(I_rand / 2)
# on y^2 = x^3 + x + 1 over F_7, with both image sizes taken on exactly
# |S| slopes in F_{7^3}. The concrete negative is I_frob > floor(I_rand / 2)
# after the instrument checks pass and the slope map is lossy. This
