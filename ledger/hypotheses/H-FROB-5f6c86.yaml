# enumerate E(F_{7^3}) and did not compute either image size.
# =============================================================================
hypothesis:
  id: H-FROB-5f6c86
  question_id: RQ-FROB-7d8dd4
  goal_id: GOAL-FROB-6333a9
  source_idea_ids:
    - IDEA-20261006-922612
  added: '2026-10-06'
  status: approved
  proposed_by: coordinator
  title: >-
    Frobenius-chord slope image versus a frozen random-chord image on
    y^2 = x^3 + x + 1 over F_{7^3}
  statement: >-
    Let E be y^2 = x^3 + x + 1 over F_7. Let S be the affine points of
    E(F_{7^3}) whose x-coordinate does not lie in F_7. Let I_frob be
    the number of distinct chord slopes
    (y(P)^7 - y(P)) / (x(P)^7 - x(P)) for P in S. Let I_rand be the
    number of distinct chord slopes on the first |S| ordered pairs of
    distinct points of E(F_{7^3}) in the frozen lexicographic order,
    after vertical pairs are skipped. The prediction taken from
    IDEA-20261006-922612 is I_frob <= floor(I_rand / 2). The concrete
    negative is that the instrument checks pass, the mean fibre has
    size at least 2, and I_frob > floor(I_rand / 2). A failed check is
    not that negative. The statistic does not depend on a secret
    scalar and does not move the generic exponent 1/2.
  mechanism: >-
    The representation is the affine point (x, y). The operation is
    the coordinate 7-power map, which sends E to itself because the
    coefficients lie in F_7. The projection discards the point and
    keeps the chord slope through P and its image. The same slope
    formula on a frozen list of unrelated pairs is the comparison.
    A thin Frobenius image is the prediction. An image larger than
    half the random image is the negative. No factor base is proposed.
  assumptions:
    - >-
      For A=1 and B=1, 4A^3+27B^2 = 31 and 31 mod 7 is 3, not 0. The
      run recomputes that residue. This session did the same integer
      arithmetic and did not enumerate points.
    - >-
      F_{7^3} is F_7[z]/(z^3 + z + 1). The design session checked that
      t^3 + t + 1 has no root for t in 0..6, and that z^3 + z + 1
      reduces to 0. The run repeats both checks.
    - >-
      Elements are a0 + 7 a1 + 49 a2 with a0 varying fastest. Points
      are ordered by (x, y) in that integer encoding. Pairs are
      ordered by that point order, left point outer.
    - >-
      L >= 1 means the mean fibre |S| / I_frob is at least 2, decided
      by the integer comparison |S| >= 2 I_frob. A floating-point
      logarithm does not choose the row.
    - >-
      The null count is affine only. The point at infinity is fixed by
      every coordinate power and is not part of the count the idea
      asked to be 0.
  proof_search_map:
    bottleneck: >-
      The comparison I_frob <= floor(I_rand / 2). The tangent image
      I_tan is a different integer and is recorded only beside the row.
    baseline_embedding:
      parameter_slice: >-
        One curve y^2 = x^3 + x + 1 over F_7, one extension F_{7^3},
        one frozen pair order. The minimum effect is a factor of 2
        between the two image sizes.
      reproduction_check: >-
        The first 20 slopes of S are computed with two inverses, and
        the identity lambda(pi(P), pi^2(P)) = lambda(P, pi(P))^7 is
        checked on those 20 points.
    observation_collision:
      observable: the pair of integers (I_frob, I_rand)
      distinct_preimage_search: >-
        Many point sets share an image size. Equality of the two
        images is not the negative. The negative is the Frobenius
        image exceeding half the random image.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: the fibres of P mapped to lambda(P, pi(P))
        predicted_gain: >-
          the Frobenius image is at most half the random image, or it
          is larger
    quantifier_order: >-
      There exists this one curve and this one extension such that the
      inequality holds. Not for every curve and not for every extension.
    method_ceiling:
      strongest_certifiable_claim: >-
        On this curve the inequality holds, or it fails, or the
        instrument is void. No discrete log is certifiable.
      nearby_object_control: >-
        The null curve y^2 = x^3 + x + z over the same field is not
        defined over F_7. A positive count of affine points whose
        coordinate 7-power stays on that curve voids the run. It does
        not score the inequality.
    proof_obligations:
      - claim: I_frob and I_rand are cardinalities of slope images on samples of size |S|.
        responsibility: correctness
      - claim: I_frob > floor(I_rand / 2), with the instrument checks passed and the map lossy, is a negative for this curve. It is not a confirmation.
        responsibility: scope
    not_applicable_reason: >-
      This is one image-size comparison on a field of 343 elements.
      It is not a proof that a slope filter lowers a discrete logarithm.
  rerandomization: >-
    No re-randomizing walk is used. The curve, the modulus, and the
    pair order are frozen. The reversed-pair image is a second sample
    for the heuristic H1. It does not choose the reading row.
  asymptotic_claim:
    problem: one slope-image comparison on F_{7^3}
    prior_best: >-
      Opened KR-IC-46d822 states Gaudry's Õ(q^{2-2/n}) for fixed n.
      Opened KR-RHO-037e22 states a square-root-of-degree class-walk
      factor on Koblitz curves. This hypothesis moves neither figure.
    time_exponent: '1/2, unchanged'
    memory_exponent: >-
      unchanged. The point list over a field of 343 elements is the
      dominant table. The exponent in the group order is 0 beyond that
      list.
    hidden_cofactor: >-
      No o(1) attack term is claimed. The comparison is an integer
      ratio on one extension.
    claim_kind: constant_factor
    claim_kind_note: >-
      The constant factor against Pollard rho is 1. A factor-of-two
      gap between two image cardinalities is not a runtime.
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        Slopes of chords through two uniformly chosen distinct points
        of E(F_{7^3}), conditional on the chord not being vertical,
        have an image of size at least half the sample whenever the
        sample size is at most half the field. The pre-registered
        comparison uses one frozen lexicographic sample, not a fresh
        uniform draw.
      random_model_justification: >-
        A uniform sample of m distinct elements of a finite set has
        image size m. The chord-slope rational function is not proved
        to be uniform on this curve. The second frozen sample, with
        each accepted pair reversed, is the check named in the source
        idea. If those two image sizes differ by more than a factor of
        two, HEUR-1 is not used to interpret I_frob. That flag does not
        choose the reading row.
      supporting_results: []
      validation_experiment_ids:
        - EXP-FROB-ad6a6d
      falsification_condition: >-
        The instrument checks pass, the map is lossy, and I_frob is
        greater than floor(I_rand / 2). That inequality refutes the
        predicted gap on this curve. A failed identity, a positive
        null count, a short sample, and a timeout do not refute the
        heuristic.
  structural_ingredients:
    - description: >-
        Frobenius-invariant factor bases cut the number of systems by
        at most 1/n and speed linear algebra by n^2. A slope image is
        not that factor base.
      citation: KR-IC-b0fcda
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-b0fcda.yaml
        on 2026-10-06
      role: fence around a factor-base reading of the image
    - description: >-
        For fixed n, Gaudry decomposition is Õ(q^{2-2/n}). This
        comparison does not change that exponent.
      citation: KR-IC-46d822
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-46d822.yaml
        on 2026-10-06
      role: unchanged decomposition exponent
    - description: >-
        On a Koblitz curve, walking on Frobenius classes reduces
        parallel rho by a square-root-of-degree factor. The exponent
        1/2 is unchanged. This comparison does not walk on classes.
      citation: KR-RHO-037e22
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-037e22.yaml
        on 2026-10-06
      role: unchanged time exponent
    - description: >-
        Galbraith–Gebregiyorgis and Shantz–Teske conclude that
        summation-polynomial decomposition on prime-degree binary
        curves of reasonable size is much slower than Pollard rho.
        This comparison does not run that attack.
      citation: KR-IC-1fcdbc
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-1fcdbc.yaml
        on 2026-10-06
      role: fence around a summation-polynomial reading
    - description: >-
        S_m and small-torsion symmetry shrink point-decomposition
        systems. This comparison never forms S_m.
      citation: KR-IC-955fd6
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-955fd6.yaml
        on 2026-10-06
      role: fence around a decomposition-cost reading
    - description: >-
        The chord through two distinct affine points has slope
        (y2-y1)/(x2-x1) when x2 is not x1. Silverman's book was not
        opened.
      citation: >-
        Silverman, The Arithmetic of Elliptic Curves, chord-tangent
        group law
      provenance: recalled
      role: the slope formula whose image is counted
  reduction_chain:
    core_problem: one slope-image comparison on F_{7^3}
    corollaries: []
  predictions:
    - metric: ratio of I_frob to I_rand
      direction: lower
      minimum_effect: I_frob <= floor(I_rand / 2) on samples of size |S|
  test_boundary:
    instances:
      - y^2 = x^3 + x + 1 over F_7, points over F_{7^3}
    parameters:
      p: 7
      A: 1
      B: 1
      extension_degree: 3
      modulus: z^3 + z + 1
      identity_checks: 20
      null_constant: z
    implementation: >-
      Enumerate affine points, build S, count I_frob and I_rand, and
      name exactly one reading row. Report I_tan, the reversed-pair
      image, and the null-curve count beside the row. Do not search
      for a discrete logarithm. The future run slot named by the trial
      plan is RUN-FROB-026551. This design session does not launch it.
    budget:
      cell: one curve, one extension of cardinality 343
      maximum_runs: 1
  falsification_conditions:
    - >-
      The instrument checks pass, the map is lossy, and I_frob is
      greater than floor(I_rand / 2). That is the concrete negative.
    - >-
      The mean fibre is smaller than 2. The comparison is then void
      because the slope map is not lossy. That void is not the
      inequality negative.
    - Any of the 20 Frobenius identities fails, or the two inverses disagree on those 20 slopes.
    - The affine null-curve count is positive.
    - The size of S is below 20, or I_rand is below 2, or the random sample cannot fill that many slopes.
  interpretation_limits:
    - Toy scope is one curve and one extension. No transfer to cryptographic size is claimed.
    - The discrete-log time exponent stays 1/2 and the delta versus Pollard rho is 0 even if the inequality holds.
    - A passed inequality does not define a factor base.
    - I_tan and the reversed-pair image are recorded beside the row. They do not choose it.
    - A timeout is failed_infrastructure and is not the negative.
