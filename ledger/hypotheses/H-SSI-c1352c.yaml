hypothesis:
  id: H-SSI-c1352c
  title: "Any-basis inversion of an unoriented torsion-transport transcript"
  area: SSI
  question_ids: [RQ-SSI-1946c9]
  goal_ids: [GOAL-SSI-2fa82a]
  idea_ids: [IDEA-20261007-c5a097]
  status: proposed
  statement: >-
    For the declared UTTK distribution, every complete evaluable basis of
    End(E) can be compiled in polynomial time to data that recovers the sampled
    isogeny kernel from its pointed torsion-transport transcript.
  mechanism: >-
    Derive an attack-suitable non-scalar theta from an arbitrary basis and use
    theta with transported N-torsion to recover the cyclic kernel.
  predictions:
    - "A basis-change-invariant B-to-theta compiler exists with quantified polynomial bounds."
    - "The resulting kernel recovery succeeds for every supported E, valid B, and valid transcript."
    - "Either inversion does not factor through theta alone or theta reconstructs a complete evaluable ring basis."
  falsification_criteria:
    - "the compiler is defined only for planted or reduced bases"
    - "required theta degree or search is superpolynomial"
    - "a theta-only witness preserves all inverse outputs without complete-ring reconstruction"
    - "the reported torsion attack does not cover the exact distribution or transcript encoding"
  test_boundary: "zero-run definition and proof audit only; no implementation or security inference"
