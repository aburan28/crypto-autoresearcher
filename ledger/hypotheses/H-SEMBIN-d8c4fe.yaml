  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: >-
        Differencing fall-profile observable and the degree-profile-matched
        null
      citation: research/FFD_SEMAEV_MEASUREMENT1.md section 0 (attributing Caminata-Gorla eq. (1), Thm 2.8)
      provenance: internal
      verified_by: coordinator (this session), MEASUREMENT1 read in full 2026-09-29; the Caminata-Gorla source itself not opened
      role: definition of the measured quantity
    - description: Trace witness for a degree-2 fall on the Semaev side when x_R != 0
      citation: research/FFD_SEMAEV_MEASUREMENT1.md section 3a
      provenance: internal
      verified_by: coordinator (this session), read 2026-09-29
      role: context for P1; its existence statement is not the scored quantity
  reduction_chain:
    core_problem: not_applicable. No problem is solved or reduced.
    corollaries: []
  predictions:
    - metric: P1_reduced and P1_formal, the Semaev median d_ff in each of the 8 cells
      direction: different
      minimum_effect: exactly 2 in every cell
    - metric: P2_reduced and P2_formal, the null median minus the Semaev median in the 7 cells other than (7,3)
      direction: higher
      minimum_effect: '>= 1 in every one of the 7 cells'
    - metric: P3_reduced and P3_formal, the null median at n' = 4 against n' = 3 for each n in {4,5,6,7}
      direction: higher
      minimum_effect: strictly greater for all four n
  test_boundary:
    instances:
      - 8 cells (n, n') in {4,5,6,7} x {3,4}; 10 Semaev draws and 25 null draws per cell (80 Semaev and 200 null systems)
    parameters:
      curve: 'y^2 + xy = x^3 + x^2 + 1 (a2 = a6 = 1)'
      field_modulus: ffd_semaev_core_v1.MODS[n]
      field_bits: [4, 5, 6, 7]
      N: [6, 8]
      Dmax: 6
      semaev_seed: 7919 n + 131 n' + s, s in 0..9
      null_seed: 31 n + 7 n' + t, t in 0..24, matched to the s = 0 Semaev system
      ring: Boolean, u^2 = u
      conventions: [reduced, formal]
      control_convention: legacy (set-OR, reduced filter), used for C1 only
    implementation: >-
      experiments/EXP-SEMBIN-473340/src/{remeasure.py, boolean_macaulay.py,
      ffd_semaev_core_v1.py, test_boolean_macaulay.py}, pure Python,
      sha256-pinned in the specification
    budget:
      runs: 1
      wall_clock_watchdog_seconds: 86400
      memory_gb: 4
  falsification_conditions:
    - >-
      In a valid run (exit 0, IR-1..IR-9 not triggered, C1 true), the
      contract's scoring rule yields "fails" for P1_c, P2_c or P3_c. Each of
      the six is falsified separately. A failure of P2_c or P3_c means the
      MEASUREMENT1 headline "null climbs while Semaev stays pinned" does not
      hold for convention c on these systems. For c = reduced this isolates
      the product, because legacy and reduced differ only in the product and
      C1 fixes the legacy values to the published ones. For c = formal the
      product and the row filter both differ, so a failure is not attributed
      to the product alone.
    - >-
      C1 false, exit 3, a watchdog kill or any other infrastructure failure
      falsifies NOTHING. It is not evidence (AGENTS.md core rule 5).
  interpretation_limits:
    - >-
      Toy tier: N <= 8, n <= 7, one curve shape, characteristic 2,
      2-decomposition (m = 2) only.
    - >-
      Null matched on the per-equation degree profile only. The
      block-multiaffine null (MEASUREMENT1 N1, IDEA-20260916-9d2fa6 rung 3) is
      not run. By MEASUREMENT1's own reading, any surviving deficit is an
      upper bound on the real one.
    - >-
      d_ff is not the solving degree, the last fall degree or the degree of
      regularity (MEASUREMENT1 section 4). Nothing about subexponentiality,
      ECDLP cost or any curve's security.
    - >-
      Same systems as MEASUREMENT1: a re-computation, not a fresh sample. The
      null is 25 draws matched to ONE Semaev system per cell (the s = 0
      draw). Null seed ranges overlap between cells: for example, (4,3) uses
      145..169 and (4,4) uses 152..176, so the n' = 3 and n' = 4 null draws
      compared by P3 share RNG seeds. The resulting systems differ because N
      and the degree profiles differ, but the draws are not independent across
      cells. This is inherited from MEASUREMENT1 and preserved deliberately.
    - >-
      Neither convention is asserted to equal Nagao Definitions 1, 5 or 6, or
      a Caminata-Gorla definition as that source states it. Results are
      reported per convention and never pooled.
    - x_R and the basis are not written to results.json. They are recoverable from the seeds.
