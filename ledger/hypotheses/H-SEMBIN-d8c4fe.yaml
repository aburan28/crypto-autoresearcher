  relation_to_other_hypotheses: >-
    This is NOT the NA-2 successor of H-SEMBIN-934774. That successor concerns
    recombination separation (D_ff versus D_ff^max) and is still unwritten.
    This hypothesis concerns the identity presentation only: the
    MEASUREMENT1 table. H-SEMBIN-934774 is not edited, superseded or moved
    here.
  title: >-
    The three claims of FFD_SEMAEV_MEASUREMENT1 section 2 (Semaev d_ff pinned
    at 2; null d_ff exceeds Semaev; null d_ff rises with n') hold when the
    observable is computed with the true Boolean-ring product. Each claim is
    scored separately under the reduced and the formal degree convention.
  statement: >-
    NAMING (DEC-20260929-d75c82 NA-4).
    (i) Definition: the differencing fall profile of MEASUREMENT1 section 0,
    new_falls(D) = dim(V_D cap R_{<D}) - dim V_{D-1} and
    d_ff = min{D : new_falls(D) > 0}. MEASUREMENT1 attributes this to
    Caminata-Gorla eq. (1) and Thm 2.8, a source this Coordinator did not
    read. It is NOT Nagao 2013/549 Definition 1, and NOT literal 2015/984
    Definition 5 or 6.
    (ii) Field equations: reduced modulo in every product (Boolean ring
    F_2[u]/(u_j^2 + u_j), N = 2n' variables). Under convention "reduced", row
    m*f enters V_D iff the reduced product has degree <= D. Under convention
    "formal", it enters iff deg m + deg f <= D. The formal convention is
    defined operationally as boolean_macaulay.fall_profile(...,
    convention="formal") codes it. Its identification with the Macaulay
    filtration of {f} union S_fe in F_2[u] is the instrument docstring's
    claim, and it is NOT asserted here.
    (iii) Product: XOR-accumulated Boolean-ring product
    (boolean_macaulay.bool_mul), with u0u1*(u0+u1) = 0.
    SYSTEMS: exactly the systems of research/verification/ffd_semaev_measure.py,
    reproduced verbatim by experiments/EXP-SEMBIN-473340/src/remeasure.py.
    Cells: (n, n') in {4,5,6,7} x {3,4}. Semaev draw s in 0..9 uses
    random.Random(7919 n + 131 n' + s) for x_R (a random x-coordinate of
    E: y^2 + xy = x^3 + x^2 + 1 over F_{2^n}) and for a random F_2-independent
    basis of V. The 25 null draws t in 0..24 use
    random.Random(31 n + 7 n' + t) and random_matched on the s = 0 Semaev
    system. Dmax = min(N, 6).
    CLAIM. For each convention c in {reduced, formal} separately, with medians
    and censoring as defined in EXP-SEMBIN-473340 scoring_rule:
    (P1_c) the Semaev median d_ff equals 2 in all 8 cells;
    (P2_c) null median minus Semaev median is >= 1 in all 7 cells other than
    (7,3);
    (P3_c) for each n in {4,5,6,7}, the null median at n' = 4 is strictly
    greater than the null median at n' = 3.
  mechanism: >-
    These are MEASUREMENT1's claims, carried over unchanged so that the run
    tests them rather than fits them. Semaev side: MEASUREMENT1 section 3a
    derives, for x_R != 0, an F_2-combination Tr(x_R^{-2} . S) of the n Weil
    components whose degree-2 part vanishes. It uses constant coefficients
    (m = 1 rows) and no product m*f, so the product defect cannot touch it.
    It gives a fall at D = 2 only if the resulting degree <= 1 polynomial is
    nonzero and not already in V_1. In the formal convention V_1 contains
    only generators of formal degree <= 1. In the reduced convention V_1 also
    contains products m*f whose reduced degree dropped to <= 1. That is why
    section 3a does not predict d_ff = 2 in every draw, and why the published
    (OR, reduced-filter) Semaev column already holds 10 of 80 draws at 3.
    Null side: no derivation predicts P2 or P3. They are the observed pattern
    of the defective instrument, and the defect acts on non-constant
    multipliers, which is where the null's falls come from.
  assumptions:
    - >-
      boolean_macaulay.fall_profile computes the differencing observable
      stated above. Evidence: test_boolean_macaulay.py (the pre-launch gate).
      It checks agreement with explicit span enumeration on 120 N = 3 systems
      in both conventions, and agreement with the validator's independent
      boolring kernel on 12 systems (reduced convention only). It also checks
      the fixtures [1,2,4,8,16] reduced = 2, [1,2,4,8,26] reduced = 3,
      [1,2,4,13,26] reduced = 2, [1,2,4,8,26] formal = 3 and
      [1,2,4,8,16] formal = 2. Formal-convention agreement with an
      INDEPENDENT kernel is not tested.
    - >-
      ffd_semaev_core_v1.build_system, random_matched and on_curve are
      correct. They are a verbatim copy of
      research/verification/ffd_semaev_core.py, whose defect is confined to
      fall_profile (CORR-20260929-616d03). The S_3 polynomial was checked
      560/560 against point arithmetic (MEASUREMENT1 section 1). The
      validator reused the same construction, so a defect there would be
      shared and invisible (EV-SEMBIN-c71cad unresolved_confounds).
    - >-
      CPython random.Random reproduces MEASUREMENT1's streams. Control C1
      checks this end to end: the legacy column must reproduce the published
      distributions exactly.
