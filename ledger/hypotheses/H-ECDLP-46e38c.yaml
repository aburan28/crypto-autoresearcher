  statement: >-
    The census's stability-signal tradeoff (structured additive
    statistics are PGL_2-unstable; stable multiplicative statistics are
    Gauss-flat) is theorem-shaped: for set statistics on P^1(F_p), a
    three-step mechanism (concentration implies additive structure;
    inversion images of structured sets are arcs without comparable
    structure; the inversion image's transform is a Kloosterman-type
    character sum with square-root cancellation forbidding the same
    concentration) composes into an obstruction -- PGL_2 family-
    constancy forces the Gauss-flat level -- with the multiplicative
    cosets as the equality case (inversion-invariant and flat) and the
    non-set statistics (characters, partitions) as the stated escape
    hatch (both now measured: RUN-ECDLP-ee15df, RUN-ECDLP-3e2225). The
    derivation-level claim is scoped honestly: the exact
    inversion-transform identity is derivable and checkable; the
    Freiman-converse and Kloosterman-cancellation supports are external
    and unextracted, so the composed theorem is expected to close as a
    FRAGMENT with the open obligations named. The toy verification
    measures the mechanism's predicted instance: a structured row's
    inversion image collapses toward the flat level, the QR row is
    inversion-invariant (the equality case), and the both-structures
    family (interval cap QR) either shows the collapse too or stands as
    the counterexample that refutes the mechanism and promotes it to
    the lane's successor.

  mechanism: >-
    Step O4 is the exact heart: for v = 1_A/|A| and w = v o inv
    (inv(x) = 1/x, inv(0) = 0 frozen), w-hat(k) = (1/|A|) sum_{x in A}
    e^{-2 pi i k (1/x)/p} -- the indicator's transform over the
    INVERTED set, a pure multiplicative-twist character sum whose
    Weil-cancellation behaviour (RECALLED) sits at the sqrt(p) scale
    that forces the flat level. The equality case is exact algebra:
    inversion preserves the quadratic residues (chi(1/x) = chi(x)),
    so the QR row is inversion-invariant and its flatness is the
    Gauss-sum derivation already on file. The census's C03 battery
    readings (intervals unstable, cosets flat-stable) are the two ends
    of the mechanism, and the toy run measures the middle object
    (the both-structures family) for the first time.

  assumptions:
    - Canonical probability normalisation; the census's primary ladder.
    - inv frozen as inv(x) = 1/x for x != 0, inv(0) = 0.
    - The proof note's verdict labels (derived / folklore-flagged /
      open) are binding: no obligation may be labelled derived on
      recalled-only support.
    - Toy/medium scale; the fragment (if that is the outcome) is a
      legitimate result with the open obligations named.

  proof_search_map:
    bottleneck: >-
      The synthetic-statistic lane's search space: without the
      obstruction, every new family is tried empirically; with it (even
      as a fragment), the search reorganises around the escape hatch.
    baseline_embedding:
      parameter_slice: >-
