        the baseline instances the mechanism must reproduce.
      reproduction_check: >-
        The equality case (R08I = R08 exactly) is the algebraic check;
        the census's R01/R08 lambdas reproduce through the harness.
    observation_collision:
      observable: >-
        The pair (lambda, inversion-image lambda) per family; the
        mechanism asserts their divergence for structured members and
        their equality for the coset.
      distinct_preimage_search: >-
        The both-structures family (interval cap QR) is the deliberate
        collision candidate: built from both structures, it could
        satisfy both sides or neither; it is enumerated and measured
        rather than assumed.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The inversion-twisted character sum (the O4 identity) as the
          object whose cancellation behaviour carries the mechanism.
        predicted_gain: >-
          Converts the census's empirical tradeoff into a scoped
          obstruction fragment with an equality case.
    quantifier_order: >-
      FOR EVERY non-trivially PGL_2-closed family of balanced subsets,
      FOR EVERY member: family-constant lambda above the flat level
      leads toward contradiction through O2-O4; any counterexample is
      EXISTENTIAL and refutes the mechanism.
    method_ceiling:
      strongest_certifiable_claim: >-
        The fragment the obligations actually support: the exact O4
        identity (derived, numerically checked), the equality case
        (derived), the toy mechanism instance (measured), and the
        composed obstruction stated CONDITIONALLY on the unextracted
        external bounds -- never presented as an unconditional theorem.
      nearby_object_control: >-
        PROVES-TOO-MUCH: the argument must NOT exclude the cosets
        (they are the equality case) and must say nothing about random
        sets (their closure is all sets; the closure condition is
        load-bearing).
    proof_obligations:
      - claim: O1 definitions (family closure, lambda-constancy)
        responsibility: feasibility
      - claim: O2 concentration-implies-structure
        responsibility: baseline
      - claim: O3 inversion destroys structure
        responsibility: strictness
      - claim: O4 the exact inversion-transform identity + cancellation
        responsibility: size
      - claim: O5 honest composition (fragment outcome legitimate)
        responsibility: correctness
      - claim: O6 scope, escape hatch, counterexample enumeration
        responsibility: scope
