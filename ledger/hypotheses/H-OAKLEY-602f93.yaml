# =============================================================================
# H-OAKLEY-602f93 -- HOLD-A Oakley n=5 SAT-arm pricing (GOAL-ECDLP2M-001 / RQ-OAKLEY-264353).
# Specified from IDEA-20260922-af7396; folds IDEA-20260922-70a67c as Groebner companion arm (engine-
# impediment path). Approved DEC-20261002-800b91.
#
# Load-bearing: (A) chained t=5 S_3 is F_2-affine in each new argument once
# the other two are fixed, so DPLL core <= 4p x-bits; (B) WDSat conflicts
# conf = c · 2^{k p} with k in {4,5}, c in [0.5,1]; (C) endpoint pricing
# above rho and exhaustive search; (D) crossover p* in [11,13] so the
# machine ladder p in 3..8 cannot support a SAT-beats-Groebner reading of
# the Oakley endpoints. Stage G (K_5) is impediment-gated. ZERO RUNS in
# this design packet. No Magma/Sage/AUXIN/Bedrock. No attack. No exponent.
# Singular success/falsification criteria live on the EXP.
# =============================================================================
hypothesis:
  id: H-OAKLEY-602f93
  question_id: RQ-OAKLEY-264353
  source_idea: IDEA-20260922-af7396
  related_idea_ids:
    - IDEA-20260922-70a67c
  experiment_id: EXP-OAKLEY-b7421f
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-800b91
  status: approved
  proposed_by: coordinator
  title: >-
    Oakley n=5 SAT arm prices as conf = c · 2^{kp} (k in {4,5}) on the
    chained t=5 ladder; endpoints dominated; ladder below crossover is not
    an endpoint reading; Groebner K_5 companion arm impediment-gated

  statement: >-
    CLAIM (measurement / pricing; HOLD-A of DEC-20260924-99ce20; NO ATTACK;
    NO EXPONENT). Setting: E/F_{2^{5p}}, V = F_{2^p}, Semaev chained t=5
    S_3 system (20p Boolean unknowns). (A) EXACT STRUCTURE. Each chain
    equation is F_2-affine in its new argument once the other two are fixed;
    assigning 4p x-bits of x_1..x_4 reduces the system to F_2-linear.
    (B) PREDICTION (H1). WDSat with XOR-Gauss refutes certified-UNSAT
    instances in conf = c · 2^{k p} with k in {4,5} and c in [0.5, 1.0],
    p-independent at fixed k over p in 3..8; k=4 iff XG recovers the affine
    structure and x_5 is not forced first. (C) ENDPOINT PRICING under (A)-(B):
    SAT per-relation totals dominate rho and exhaustive search at both Oakley
    endpoints (p=31,37). (D) CROSSOVER. 2^{4p}/24 exceeds K_5 in [2^{40},
    2^{48}] at p* in [11,13]; the runnable ladder lies entirely below
    crossover, so SAT-beats-Groebner on the ladder is pre-registered as a
    small-p artefact. Companion IDEA-20260922-70a67c: K_5 is q-independent; 2-torsion
    D/16 unavailable on both Oakley curves; Stage G measures K_5 only if a
    Groebner engine over F_{2^p} is present, else O-IMPEDIMENT-G.
    F-2 resolution: IDEA-20260922-684291 and IDEA-20260922-2caba8 remain
    ABSENT from ledger/proposals on this branch and are treated as unresolved
    citations (HOLD-A design duty of DEC-20260924-99ce20 F-2); no claim rests
    on them. CLAIM TIER: measurement / pricing. Tripwire T3: first review at
    review-breakthrough.

  mechanism: >-
    OBJECT FRAME. Representation R1: x-coordinate in an F_2-basis of
    F_{2^{5p}}, with x in F_{2^p} as 4p linear equations (or p free
    bits). Operation set: translation by factor-base elements (Class I
    partial-action). LOSSY-PROJECTION TEST: relation vector over the factor
    base; passes. KN-OPEN-020: linear subspace factor base, scoped-out;
    nothing escapes. STAGE: relation decomposition per-attempt cost.
    MECHANISM: Semaev's chain makes each S_3 F_2-affine in the new argument
    after the other two are fixed (squaring is F_2-linear), so a DPLL+XG
    solver branches on at most 4p bits. This is the SAT analogue of the
    (m-1)-fold exhaustive loop. Open number: whether WDSat attains k=4 or
    k=5. Groebner companion prices the q-independent constant K_5 against
    the same endpoints.

  assumptions:
    - >-
      Both Oakley b's satisfy b^{2^5} != b and b^{2^p} != b (p=31,37);
      recomputed at Stage 0; if either fails, 2-torsion symmetry becomes
      available and pricing must be redone.
    - >-
      Sibling ladder: E/F_{2^{5p}}, a=0, random b not in F_{2^p},
      p in 3..8, irreducible degree-5p modulus, prime-order subgroup by BSGS;
      pure Python + vendored WDSat.
    - >-
      OFF-LIMITS: Magma/Sage/AUXIN/Bedrock as success path; editing
      IDEA-20260922-af7396/IDEA-20260922-70a67c claim text; editing shared GOAL-ECDLP2M-001.yaml; deployed-curve
      ECDLP solves; treating missing Groebner engine as evidence against (A)-(D).
    - >-
      Missing Groebner engine → O-IMPEDIMENT-G for Stage G only; SAT Stages
      0-2 remain decidable.

  heuristics:
    - id: H1
      statement: >-
        For fixed k, c(p) = conf / 2^{kp} on certified-UNSAT chained t=5
        instances is independent of p over p in 3..8 and extends unchanged
        to the endpoint extrapolations at p=31,37 (labelled extrapolation).
      rigorous_support: >-
        RIGOROUS: affine-propagation (A) bounds the DPLL core by 4p bits;
        a full leaf enumeration has 2^{4p} leaves. HEURISTIC: no
        above-leaf pruning on this shape (exhaustive-core model of
        IDEA-20260915-0d8e90).
      falsification_condition: >-
        k < 3.5 at any p>=5 under default+XG, OR c decreasing by more than
        a factor 2 from p=4 to p=7.
      validation_plan: >-
        10 certified-UNSAT targets per p in 3..7 (p=8 only if k=4);
        four WDSat configs; fit k,c; tail check max/min c within factor 2
        of median; transfer to endpoints labelled extrapolation.
    - id: H2
      statement: >-
        Uniform random R in the prime-order subgroup decomposes as a sum of
        five factor-base points with probability ~1/5!, so 5! attempts per
        relation (used only in endpoint pricing arithmetic, not in the
        per-attempt fit).
      rigorous_support: >-
        Expected-count identity for independent uniform points; classical.
      falsification_condition: >-
        Not directly tested under Stages 0-2; endpoint pricing labelled
        conditional on H2.
      validation_plan: Out of Stages 0-2; named hostage of claim (C) totals.

  heuristic_note: >-
    (A) is exact. (B) is H1. (C) and (D) are arithmetic corollaries under
    H1/H2 and the named K_5 band. Stage G does not authorize a deployed
    Groebner solve; it measures K_5 at small p if an engine exists.

  predictions:
    - metric: fitted_exponent_k
      direction: different
      minimum_effect: >-
        k in {4,5} with residual < 0.3 in log2 at every p; k=4 iff XG on
        and x_5 not forced first. k<3.5 is the sub-exhaustive surprise.
    - metric: fitted_constant_c
      direction: different
      minimum_effect: >-
        c in [0.5, 1.0], p-independent within +-20% across p in 3..7.
    - metric: bridge_t3_vs_direct_S4_conf_ratio
      direction: lower
      minimum_effect: >-
        ~2^{-l} if affine-propagation is what WDSat exploits; ~1 otherwise.
    - metric: null_object_fit
      direction: different
      minimum_effect: >-
        Shape-matched random Boolean null must NOT fit c·2^{4p} with
        c in [0.5,1].
    - metric: oakley_b_outside_subfield
      direction: exact
      minimum_effect: >-
        Both RFC 2409 Group 3/4 b's satisfy b^{2^5}!=b and b^{2^p}!=b
        at Stage 0 re-verify.

  test_boundary: >-
    Toy ladder p in 3..7 (p=8 only if k=4). Endpoint figures are labelled
    extrapolations under H1/H2. Stage G (K_5) only if a Groebner engine over
    F_{2^p} is present; otherwise O-IMPEDIMENT-G. No measurement at
    p in {31,37}. No Magma/Sage. WDSat from inputs/TRIMOSKA-WDSAT-2024.

  falsification_criteria:
    - >-
      k<3.5 at any p>=5 on certified-UNSAT under default+XG: exhaustive-core
      reading wrong for the chain; endpoint pricing (C) withdrawn.
    - >-
      c decreases by more than factor 2 from p=4 to p=7: sub-exhaustive;
      same consequence.
    - >-
      Chained t=3 bridge shows k=3 (no 2^{-l} gain): mechanism (A) not
      what WDSat exploits; only k=5 branch survives.
    - >-
      Null object fits c·2^{4p} with c in [0.5,1]: law is about shape,
      not the curve.
    - >-
      Either Oakley b lies in F_{2^p}: Stage-0 assumption fails; redo
      pricing with D/16 available.
    - >-
      Trimoska instrument check fails (>6% median miss): O-ARTIFACT;
      run void; no directional evidence.

  distinguishable_outcomes:
    - id: O-K4
      label: affine-propagation recovered (k=4 under default+XG)
      condition: >-
        Fitted k in [3.7, 4.3] under default+XG; k rises under XG-off or
        x_5-first; null does not fit; instrument check passes.
    - id: O-K5
      label: exhaustive-core only (k=5)
      condition: >-
        Fitted k in [4.7, 5.3] under default+XG; bridge shows no 2^{-l}
        gain OR order/XG manipulations do not drop k to 4.
    - id: O-SUBEX
      label: sub-exhaustive surprise
      condition: k<3.5 at any p>=5 under default+XG (or decaying c).
    - id: O-SHAPE
      label: shape artefact
      condition: null object fits the same 2^{4p} law.
    - id: O-ARTIFACT
      label: instrument / soundness defect
      condition: >-
        Trimoska check fail, SAT/UNSAT disagree with exhaustive certificate
        at p<=5, or builder/certificate defect.
    - id: O-IMPEDIMENT
      label: SAT-path infrastructure stop
      condition: WDSat cannot be built/run; Stages 1-2 blocked.
    - id: O-IMPEDIMENT-G
      label: Groebner companion engine missing
      condition: >-
        Stage G cannot run for lack of Groebner over F_{2^p}; SAT
        Stages 0-2 still produce an O-K* / O-SUBEX / O-SHAPE / O-ARTIFACT
        / O-IMPEDIMENT label.

  proof_search_map:
    bottleneck: >-
      Per-attempt decomposition cost at n=5 as a function of q: exponential
      (SAT) versus constant (Groebner).
    baseline_embedding:
      parameter_slice: >-
        t=3 direct S_4 Trimoska cells (15,5),(17,6),(19,6) where
        IDEA-20260915-0d8e90 reports c·2^{3l}; chained t=3 on the same
        cells is the k=2 vs k=3 bridge.
      reproduction_check: >-
        Re-run WDSat on three shipped Trimoska cells; reproduce medians
        within 6% before any chain instance is built.
    observation_collision:
      observable: fitted exponent k across p in 3..8 on certified-UNSAT.
      distinct_preimage_search: >-
        Discriminate "XG recovers affine structure" from "lucky variable
        order" via x_5-first and XG-off configs; a k that does not move
        under either is a fit artefact.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Two-formulation ladder: SAT exponent here; Groebner K_5 in the
          companion arm; crossover p* = (log2 K_5 + log2 24)/k.
        predicted_gain: >-
          Converts SAT-vs-Groebner at n=5 into two scaling laws with an
          explicit crossover.
    quantifier_order: >-
      FORALL p>=3, FORALL b not in F_{2^p}, FORALL unsatisfiable R:
      conf >= c0 · 2^{4p} (c0>=0.5). EXISTS order with conf <= c1 · 2^{4p}.
    method_ceiling:
      strongest_certifiable_claim: >-
        On the tower family with subfield factor base, WDSat per-attempt
        conflicts grow as c·2^{kp} with k in {4,5} over p in 3..8, and
        the SAT formulation at either Oakley endpoint costs more than
        exhaustive group search under the stated extrapolation.
      nearby_object_control: >-
        Chained t=3 bridge (proves-too-much if k=3); shape-matched random
        Boolean null; size-matched random V of dimension p.
    proof_obligations:
      - claim: Each chain equation is F_2-affine in its new argument.
        responsibility: correctness
      - claim: DPLL core is at most 4p x-bits.
        responsibility: size
      - claim: conf = c·2^{kp}, k in {4,5}, over the ladder.
        responsibility: runtime
      - claim: Both Oakley b's outside F_{2^5} and F_{2^p}.
        responsibility: correctness
      - claim: Endpoint totals exceed rho and exhaustive search under H1/H2.
        responsibility: scope
    not_applicable_reason: null

  confounders:
    - >-
      WDSat static allocation / variable-order heuristics may mimic k
      changes; four-config design and null object separate solver from system.
    - >-
      Certification of UNSAT at p>=6 rests on WDSat's own proof; at p<=5
      the exhaustive 4-loop is the independent certificate.
    - F-2 dangling citations 684291/2caba8 are unresolved; no claim uses them.

  interpretation_limits:
    - Proposal-derived pricing; no ECDLP break; no exponent move.
    - Ladder p<=8 only; endpoints are labelled extrapolations.
    - Stage G may stop as O-IMPEDIMENT-G without affecting SAT outcomes.
    - Tripwire T3: first review at review-breakthrough at max.
    - GHS comparator (absent 2caba8) is unresolved under F-2; not charged.

  claim_tier: measurement
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
