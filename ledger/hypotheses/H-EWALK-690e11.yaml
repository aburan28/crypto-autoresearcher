# H-EWALK-690e11 — specified from IDEA-20261006-934aa5.
# The proposal file on the source branch is dated 20261006. The token
# 934aa5 is the one named for this design. Protocol approval is
# DEC-20261006-e131bc. This record asserts no change in the discrete-log
# exponent 1/2. The design session counted points, sixth roots, and
# subgroup generators. It did not run a walk.
hypothesis:
  id: H-EWALK-690e11
  question_id: RQ-EWALK-8fa147
  source_proposal: IDEA-20261006-934aa5
  status: approved
  status_note: >-
    approved means the measurement protocol in EXP-EWALK-5e7e56 is
    approved for a later executor. It does not mean the length-3-or-6
    fraction gap is at least 0.01, and it does not mean the step ratio
    is at most 1.15*sqrt(6). Status moves only by DEC-20261006-e131bc
    under the standing user authorization of 2026-09-06. This design
    session wrote no run artifact and did not step a walk.
  proposed_by: coordinator
  conversion_note: >-
    The two predictions, r=16, 20 walks of 5000 steps, 30 planted
    logarithms, the 0.01 absolute gap, and the cap 1.15*sqrt(6) are
    carried from IDEA-20261006-934aa5. The Coordinator pinned p=751,
    the two models, the generators, the fraction as a ratio of cycle
    counts, and Decimal precision 50 for the irrational cap.

  statement: >-
    TEST BOUNDARY. Let p=751. Let E0 be y^2 = x^3 + 1 and E2 be
    y^2 = x^3 + x + 1 over F_751. The design session counted
    #E0 = 804 and #E2 = 727, found a point G0 = (651, 302) of order
    67 on E0, and found G2 = (0, 1) of order 727 on E2. An r-adding
    walk uses r=16. On an arm, a detected fruitless cycle is a return
    of the frozen state (canonical x, canonical y, x mod 16) with a
    positive step gap L. Let n36 be the number of those events with
    L in {3, 6}, and let ndet be the number of those events of any
    positive length, over 20 walks of 5000 steps. The fraction is
    n36/ndet when ndet > 0, and 0 when ndet = 0. The gap is the
    order-6 fraction on E0 minus the negation-canonicaliser fraction
    on E2.

    PRE-REGISTERED PREDICTION, fixed before any executor run. After
    the nonsingular, ordinary, automorphism-count, and generator gates
    pass, the negation-only arm on E0 and the negation arm on E2 each
    have length-3-or-6 fraction strictly below 0.01, and all 30
    planted logarithms are found within 5000 steps on both the plain
    walk and the order-6 walk on E0, the gap is at least 0.01 and the
    ratio of mean plain-rho steps to mean order-6-orbit steps on
    those 30 logs is at most (23/20)*sqrt(6), compared at Decimal
    precision 50. A finished gap strictly below 0.01, with those
    gates passing, falsifies the cycle-length half. A finished ratio
    strictly above the cap, with those gates passing, falsifies the
    step-ratio half. Either finished failure falsifies the prediction.
    The exponent 1/2 is not claimed to move.

    DISTINGUISHABLE OUTCOMES. (1) The gates pass and both inequalities
    hold: the branch claim holds at this pin. (2) The gates pass and
    the gap is strictly below 0.01, including a gap of 0: the
    cycle-length half fails. (3) The gates pass and the step ratio
    exceeds the cap: the step-ratio half fails. (4) The |Aut|=2 arm
    or the negation-only arm on E0 reports a length-3-or-6 fraction
    of at least 0.01: the detector is not reading the automorphism
    group, and the claim is not scored as a separation. (5) A planted
    log is not found within 5000 steps, or the two group-law
    implementations disagree: void or incomplete, not a statement
    about the gap. (6) A timeout: infrastructure, not a mathematical
    negative.

  mechanism: >-
    The tracked object is the length of a run of repeated
    canonicalisation under the automorphism group, not a point of the
    prime-order subgroup. The representation is the orbit label, the
    lexicographically smallest x-coordinate, then the smaller y in
    0..p-1. The operation set is the r-adding step composed with that
    canonicaliser. On E0 the rational automorphism group has order 6,
    so a deterministic canonicaliser can close cycles whose length
    divides 6, including 3 and 6. On E2 the only automorphisms are
    the identity and negation, so a correct detector reports no cycle
    of length 3 or 6. The orbit map is lossy: each fibre has size
    |Aut| and discards the coset representative. It is a block system
    of the automorphism group, not a block system of translation.
    Canonicalising one orbit costs a constant number of field
    operations. The cycle length is an instrument reading. It is not
    claimed to shrink the search below the orbit of size N/|Aut|.

  assumptions:
    - E0 and E2 are ordinary over the same prime p=751, and each has a unique prime-order subgroup of order N > 40. The design session's counts are #E0 = 804 with N = 67, and #E2 = 727 with N = 727.
    - E0 admits an F_751-rational automorphism of order 3. The comparison curve E2 has automorphism group of order exactly 2.
    - The same r=16, the same partition x mod 16, and the same seeds are used on both curves.
    - Cycle detection is a function of the canonical representative and the bucket x mod 16, and it is frozen before any steps are counted.

  proof_search_map:
    bottleneck: >-
      Whether detected cycle lengths 3 and 6 are more frequent by at
      least 0.01 on the order-6 canonicaliser of E0 than on the
      negation canonicaliser of E2, and whether the plain-to-orbit
      step ratio on E0 stays at most (23/20)*sqrt(6). The exponent
      1/2 is a different quantity.
    baseline_embedding:
      parameter_slice: >-
        p=751, r=16, 20 walks of 5000 steps, 30 planted scalars
        1..30, generators G0 and G2 as pinned in EXP-EWALK-5e7e56.
      reproduction_check: >-
        Two group-law implementations agree on 2G and on N*G = O
        for both generators, and two point counters agree on #E0
        and #E2.
    observation_collision:
      observable: length-3-or-6 fraction gap
      distinct_preimage_search: >-
        The negation-only canonicaliser on E0 is a second walk with
        the order-3 automorphism removed. If that arm reports a
        length-3-or-6 fraction of at least 0.01, the observable is
        not carried by the order-3 element, and the claim is not scored.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The multiset of detected cycle lengths on the order-6
          walk and on the |Aut|=2 walk.
        predicted_gain: >-
          A gap of at least 0.01, or an explicit finished gap below
          0.01. The step-ratio cap is a second inequality on the
          same pin.
    quantifier_order: >-
      There exist these two named curves at p=751 such that, after
      the gates, the cycle-length gap is at least 0.01 and the step
      ratio is at most (23/20)*sqrt(6). Not for all j=0 curves, and
      not for all primes.
    method_ceiling:
      strongest_certifiable_claim: >-
        At this pin, either both inequalities hold or at least one
        finished inequality fails. No ECDLP solve and no exponent
        change is certifiable from the gap.
      nearby_object_control: >-
        E2 has |Aut|=2. A length-3 or length-6 detection there at
        fraction at least 0.01 falsifies the detector. The
        negation-only arm on E0 is the same control with the
        order-3 map removed.
    proof_obligations:
      - claim: The fraction uses the frozen state and the zero-denominator convention.
        responsibility: correctness
      - claim: The gap is at least 0.01 and the step ratio is at most the cap when the gates pass.
        responsibility: baseline
      - claim: No exponent change is inferred.
        responsibility: scope
    not_applicable_reason: >-
      The map above audits one cycle-length comparison and one step
      ratio. It is not a proof that an automorphism walk beats or
      fails the generic bound beyond KR-RHO-13bf67 and KR-RHO-0528e7.

  rerandomization: >-
    The r-adding walk is the iteration used to sample cycle lengths
    and collision steps. It is not a reduction from a worst-case
    instance to an average-case instance. Each planted logarithm is
    the scalar itself. No discrete log is pulled back from a
    different curve.

  asymptotic_claim:
    problem: >-
      Whether the two inequalities in the prediction hold at p=751.
      ECDLP is not claimed to be faster.
    prior_best: >-
      Pollard rho at exponent 1/2. An automorphism group of order m
      discounts the iteration count by about sqrt(m). For j=0 the
      factor is sqrt(6), a constant, as in KR-RHO-0528e7 and
      KN-TECH-018. The exponent stays 1/2.
    time_exponent: unchanged
    memory_exponent: unchanged
    hidden_cofactor: >-
      No algorithmic o(1) term is claimed. The factor 23/20 is an
      explicit instrument tolerance around sqrt(6), not a hidden
      cofactor.
    claim_kind_note: >-
      No exponent improvement, cofactor improvement, or constant-factor
      improvement of ECDLP is claimed, so none of those three labels
      is applied.

  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        For an r-adding walk with r=16, detected fruitless-cycle
        lengths divide |Aut|. Lengths 3 and 6 occur with fraction 0
        when |Aut|=2 and with fraction at least 0.01 above that null
        when an order-3 automorphism is included in the canonicaliser.
        On the j=0 curve the ratio of mean plain steps to mean
        order-6 steps, on the 30 planted logs, is at most
        (23/20)*sqrt(6).
      random_model_justification: >-
        The orbit of a group of order m is a block system of that
        group. A return to the same canonical representative under a
        nontrivial group element has length dividing m. The comparison
        distribution is the zero count on the |Aut|=2 walk, not a
        fitted constant. Random-mapping cycle statistics are a
        recalled model for the length-2 rate and are not used as a
        checked bound. KR-RHO-fb88e6, opened this session, records
        the negation-map account. KR-RHO-0528e7 records the sqrt(6)
        constant. Neither row states the 0.01 gap at p=751.
      supporting_results:
        - ref: IDEA-20261006-934aa5
          provenance: internal
          claim: >-
            The proposal states the 0.01 gap, the cap 1.15*sqrt(6),
            r=16, 20 walks of 5000 steps, and 30 planted logs.
          verified_by: ledger/proposals/IDEA-20261006-934aa5.yaml
        - ref: KR-RHO-0528e7
          provenance: internal
          claim: >-
            An automorphism group of order m discounts rho iterations
            by about sqrt(m). For j=0 the factor is sqrt(6). The
            exponent stays 1/2.
          verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-0528e7.yaml
        - ref: KR-RHO-fb88e6
          provenance: internal
          claim: >-
            Walking on plus-minus classes gives a sqrt(2) iteration
            reduction and creates fruitless cycles.
          verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-fb88e6.yaml
      validation_experiment_ids:
        - EXP-EWALK-5e7e56
      falsification_condition: >-
        The gates pass and the length-3-or-6 gap is strictly below
        0.01. A gap of 0 is this negative. A finished step ratio
        above (23/20)*sqrt(6) is the other negative. An unfound
        logarithm does not falsify the heuristic.

  structural_ingredients:
    - description: >-
        An automorphism group of order m discounts rho by about
        sqrt(m), and the j=0 case is sqrt(6), without changing the
        exponent 1/2.
      citation: KR-RHO-0528e7
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-0528e7.yaml
      role: constant-factor baseline the cap is wrapped around
    - description: >-
        Negation-map rho creates fruitless cycles. The practical gain
        has been below the full sqrt(2).
      citation: KR-RHO-fb88e6
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-fb88e6.yaml
      role: length-2 control, not a length-3 claim
    - description: >-
        A generic-group discrete logarithm in a prime-order group
        needs Omega(sqrt(N)) group operations.
      citation: KR-RHO-13bf67
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
      role: exponent ceiling this hypothesis does not cross
    - description: >-
        The program charges the automorphism-adjusted rho constant.
        The discount is a constant, not an attack.
      citation: KN-TECH-018
      provenance: internal
      verified_by: knowledge/techniques/KN-TECH-018.md
      role: same constant-factor baseline, second source

  reduction_chain:
    core_problem: >-
      The numerical comparison of cycle-length fractions and of one
      step ratio at p=751.
    corollaries: []

  predictions:
    - metric: length_3_or_6_fraction_gap
      direction: higher
      minimum_effect: >-
        The order-6 fraction on E0 exceeds the negation fraction on
        E2 by at least 0.01.
    - metric: j0_plain_over_orbit_step_ratio
      direction: lower
      minimum_effect: >-
        The ratio of mean plain steps to mean order-6 steps on the
        30 planted logs is at most (23/20)*sqrt(6).

  test_boundary:
    instances:
      - E0 y^2 = x^3 + 1 over F_751 with G0 = (651, 302)
      - E2 y^2 = x^3 + x + 1 over F_751 with G2 = (0, 1)
    parameters:
      prime: 751
      r: 16
      cycle_walks: 20
      steps_per_walk: 5000
      planted_logs: 30
      decimal_precision: 50
    implementation: >-
      Exact field arithmetic in F_751, two group-law implementations.
      Decimal square root of 6 at precision 50 for the cap only.
    budget:
      maximum_runs: 1
      enforcement: advisory

  falsification_conditions:
    - The length-3-or-6 gap is strictly below 0.01 after the gates pass. A gap of 0 is this outcome.
    - The plain-over-orbit step ratio exceeds (23/20)*sqrt(6) after the gates pass and all 30 logs are found.
    - The |Aut|=2 walk reports a length-3-or-6 fraction of at least 0.01.
    - The negation-only walk on E0 reports a length-3-or-6 fraction of at least 0.01.

  interpretation_limits:
    - A gap in cycle-length fractions is a property of the canonicaliser. It is not a reduction of the generic exponent 1/2.
    - The cap (23/20)*sqrt(6) is an instrument band above sqrt(6). Landing under the cap does not show that the prediction is sharp.
    - The test covers one prime and two curves. It does not transfer to binary Koblitz Frobenius orbits or to cryptographic sizes.
    - KR-RHO-13bf67 remains the generic-group floor. This hypothesis does not contradict it.

