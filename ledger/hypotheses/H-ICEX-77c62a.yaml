hypothesis:
  id: H-ICEX-77c62a
  question_id: RQ-JINV-8fc13a
  added: '2026-09-04'
  derived_from_idea: IDEA-20260826-4bc5d2
  statement: >-
    The coordinate-placement channel of RQ-JINV-8fc13a is a SECOND-MOMENT object and it is
    predicted to be |D_0|-FREE. Fix a prime p, a prime-order subgroup G of an ordinary curve
    E/F_p with #G = N, and a window W = [a, a+B) in the lift of F_p to [0, p). Let
    S_W(E) = #{ P in G \ {O} : lift x(P) in W } and
    Delta_W(E) = ( S_W(E) - B (N-1) / p ) / sqrt(B).
    THE HYPOTHESIS (H-null): over a frozen, rotation-closed window family, the
    ROTATION-INVARIANT VARIANCE Var_rot(Delta) of a curve with small |D_0| (including the
    j = 0 and j = 1728 craters) is indistinguishable, at matched p and matched N, from that
    of (i) a matched random ordinary curve with generic D_0 and |Aut| = 2, and from that of
    (ii) a CURVE-FREE null - a uniformly drawn subset of F_p of the same cardinality
    (N-1)/2, built with no elliptic curve anywhere in its construction. Equivalently, the
    x-coordinate image of a prime-order subgroup behaves, to second order in window
    incidence, like a pseudorandom subset of F_p of the same size, and the only incidence
    advantage a special-j curve enjoys is the trivial |Aut|/2 orbit collapse, which acts on
    x as the permutation x -> zeta x and is annihilated exactly by rotation-averaging.
    THE RIVAL (H-bias): small |D_0| induces a COHERENT low-frequency bias, so that
    Var_rot(Delta) for the special-j crater exceeds the matched-random and curve-free bands
    by an amount that grows with the number of windows and survives both the quadratic-twist
    control and the curve-free control. Under H-bias a smaller factor base would collect the
    same length-2/length-3 relations, which is a yield effect distinct from the automorphism
    discount.
    NO EXPONENT IS CLAIMED IN EITHER BRANCH. The ECDLP time exponent is 1/2 throughout, and
    the largest conceivable downstream consequence of H-bias is a change in factor-base
    size, i.e. a constant or logarithmic cofactor.
  mechanism: >-
    The map x : G -> F_p is 2-to-1 onto its image, an (N-1)/2-element subset of F_p. For the
    FULL group of an elliptic curve the count of affine points with x in an interval is
    controlled by incomplete character sums with a Weil-type bound, giving square-root
    discrepancy; restricting to a prime-order subgroup replaces the full-group sum by a
    subgroup character sum, and the governing expectation is that the restricted image is
    equidistributed with square-root discrepancy and no coherent low-frequency component.
    The rational automorphism group acts on x only by multiplication by a root of unity.
    That is a measure-preserving bijection of F_p; it maps a window to a rotated window and
    can therefore REINDEX windows, but averaging an indicator over a finite group orbit is
    exact, so it cannot create a NET deviation over a rotation-averaged family. Any excess
    that survives rotation-averaging is therefore orthogonal by construction to the
    sqrt(|Aut|) mechanism, and this is what makes the object distinct from every prior
    record in the lane, all of which measure the FIRST moment of relation yield.
    The CM structure enters only as a candidate cause of a low-frequency component:
    End(E) = O_{D_0} with small |D_0| makes G a module over that order, and the open
    question this hypothesis poses is whether the module structure leaves a fingerprint in
    the ADDITIVE placement of x-coordinates in [0, p). The lane's standing admissibility
    argument concerns the GROUP action on points and does not reach the field-additive image
    of x, so it neither settles nor is retested here.
    WHY A CURVE-FREE NULL IS MANDATORY AND NOT DECORATIVE. The predicted H-null signature -
    square-root discrepancy with a curve-independent variance - is exactly the signature a
    uniformly random subset of F_p of the same size produces. A run that reported it from
    curve arms alone would be reporting a property of pseudorandom subsets and inviting the
    reader to hear a statement about elliptic curves. The curve-free arm makes the two
    readings separable in the same run at negligible cost.
  assumptions:
    - >-
      G has prime order N by construction (matched-order family), so the automorphism acts
      freely on G \ {O} and each x-orbit has size exactly |Aut|/2.
    - >-
      Toy scale with full enumeration of G. Every S_W is an exact integer count obtained by
      walking the subgroup, never an estimate from sampling.
    - >-
      The window family is chosen ROTATION-CLOSED under the rational automorphism action
      before any curve is read, so the sqrt(|Aut|) mechanism is averaged out by construction
      rather than argued away afterwards.
    - >-
      Comparisons are made at matched p AND matched N. p is a residual covariate across the
      matched-order family because p = N + t - 1, and is reported alongside |D_0| rather
      than adjusted away.
    - >-
      The analytic null band used as the reference is a DERIVED band, computed in a
      zero-compute stage from the stated character-sum bound, and is frozen before any curve
      arm is examined.
  proof_search_map:
    bottleneck: >-
      Whether Var_rot(Delta) carries |D_0| information beyond the trivial automorphism
      reindexing. That single quantity is what separates a genuine yield effect from the
      orbit-count discount, and nothing else in the design turns on anything else.
    baseline_embedding:
      parameter_slice: >-
        A matched RANDOM ordinary curve with generic D_0 and |Aut| = 2 at the SAME p and the
        SAME N, plus the curve-free uniform subset of F_p of size (N-1)/2. Both must
        reproduce the derived square-root-discrepancy null band.
      reproduction_check: >-
        Frozen fixture, blocking: at each toy prime, the empirical Var_rot(Delta) of the
        matched-random curve arm and of the curve-free subset arm must both lie inside the
        derived null band before any small-|D_0| curve is read. The fixture is written and
        hashed in the zero-compute stage.
    observation_collision:
      observable: >-
        The rotation-invariant variance of the normalised window-incidence deviation over
        the frozen window family.
      distinct_preimage_search: >-
        TWO COLLISIONS ARE IDENTIFIED IN ADVANCE. (i) The reindexing x -> zeta x produces the
        same rotation-averaged deviation as the identity, so any per-window deviation that
        vanishes under rotation-averaging is automorphism-trivial and is discarded by the
        design rather than by later judgement. (ii) A curve arm and the curve-free uniform
        subset can produce the same Var_rot for entirely different reasons - one because the
        subgroup image is genuinely equidistributed, the other because it was drawn
        uniformly by construction. Exhibiting that second collision at the predicted rate IS
        the H-null deliverable, and a record reporting a curve-specific placement statement
        without running it would be reporting a property of random subsets.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the incidence count fixed and vary the forgotten additive structure (the lift
          of x to [0, p)). The intrinsic separating invariant is the rotation-averaged
          low-frequency Fourier weight of the indicator of the x-image.
        predicted_gain: >-
          Distinguishes a genuine additive-placement fingerprint from an artifact of window
          choice, which is the dominant confounder and can otherwise swing the apparent
          deviation more than any |D_0| effect.
    quantifier_order: >-
      CLAIMED IN THIS ORDER. FOR EACH tested toy prime p and matched order N, FOR ALL
      windows in the frozen rotation-closed family, the rotation-invariant variance of Delta
      for a small-|D_0| curve does or does not exceed the matched-random and curve-free
      bands. NOT CLAIMED: the weaker order "there exists a window on which the crater
      deviates", which is guaranteed to be satisfiable by chance and supports nothing.
    method_ceiling:
      strongest_certifiable_claim: >-
        At the tested toy orders, on the tested curves, in the frozen window family, the
        rotation-invariant coordinate-placement discrepancy of the small-|D_0| arms does or
        does not exceed the matched-random and curve-free null bands by a stated factor with
        a stated resolution. It can certify NOTHING about relation-collection cost, about
        any exponent, or about cryptographic scale.
      nearby_object_control: >-
        The quadratic twist of the small-|D_0| curve: same CM order, same |Aut|, different
        point set. A deviation driven by |D_0| must persist under the twist; a deviation
        driven by the specific coefficient pair must not.
    proof_obligations:
      - claim: The matched-random curve arm reproduces the derived square-root-discrepancy null band.
        responsibility: baseline
      - claim: The curve-free uniform-subset arm reproduces the same band.
        responsibility: baseline
      - claim: Rotation-averaging annihilates the x -> zeta x reindexing exactly at the tested orders.
        responsibility: correctness
      - claim: The reported quantity is a variance over a frozen window family, not a mean over an ad hoc one.
        responsibility: strictness
      - claim: Nothing transfers to relation-collection cost or to any exponent.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-INC-1
      formal_statement: >-
        For a uniformly drawn ordinary curve E/F_p with prime-order subgroup G of order N,
        the normalised incidence deviation Delta_W is mean-zero over a rotation-closed
        window family and its variance is bounded by a curve-INDEPENDENT constant times a
        slowly varying factor in log p, uniformly over windows of width B in the declared
        range.
      random_model_justification: >-
        The rigorous ingredient is the incomplete-character-sum bound for the number of
        points of an elliptic curve with x in an interval, which is square-root in p up to a
        logarithmic factor; the classical distribution statement being imitated is the
        discrepancy law of a pseudorandom subset of F_p of the same cardinality, which is
        what the design instantiates directly as the curve-free arm. THE GAP: the bound is
        stated for the full group and its specialisation to a prime-order subgroup is not
        re-derived here, and its uniformity range in B is the transfer assumption.
      supporting_results:
        - >-
          Incomplete character-sum / Weil bounds for the distribution of x-coordinates of
          points on elliptic curves and on their subgroups. RECALLED ONLY; no agent in this
          program has opened the primary source, so this entry is a pointer for the reviewer
          and supports nothing. Locating and reading it is a declared zero-compute stage of
          the contract.
      validation_experiment_ids:
        - EXP-ICEX-4fabdb
      falsification_condition: >-
        The matched-random curve arm or the curve-free subset arm has empirical
        Var_rot(Delta) outside the derived band at any tested prime. The heuristic, or the
        derivation of the band, is wrong; no |D_0| comparison is reported from that prime.
    - id: HEUR-INC-2
      formal_statement: >-
        The rotational average over the rational automorphism action annihilates the
        x -> zeta x reindexing contribution to Delta exactly, so any residual
        rotation-invariant deviation is orthogonal to the sqrt(|Aut|) mechanism.
      random_model_justification: >-
        NOT HEURISTIC IN ITS CORE, and this entry exists to say so. The automorphism acts on
        x as multiplication by a root of unity, a bijection of F_p, and averaging an
        indicator over a finite group orbit is an exact identity rather than an asymptotic
        one. The heuristic residue is only that the implementation realises the average the
        derivation describes, which is why it is checked numerically rather than assumed.
      supporting_results:
        - >-
          Elementary; no external source is relied on. The check is internal and exact at
          toy order.
      validation_experiment_ids:
        - EXP-ICEX-4fabdb
      falsification_condition: >-
        The rotation-averaged deviation of the reindexed windows on a j = 0 curve is nonzero
        beyond enumeration tolerance. The averaging is mis-implemented and the run is void
        in both directions.
  structural_ingredients:
    - description: >-
        The parent proposal's construction of the functional, its rotation-closed window
        family, its twist control, and its pre-registered null expectation.
      citation: ledger/proposals/IDEA-20260826-4bc5d2.yaml
      provenance: internal
      verified_by: >-
        TASK-20260904-8f2f95, coordinator design session, full read of the record on
        2026-09-04.
    - description: >-
        The automorphism-discounted rho baseline against which any incidence advantage at or
        below the orbit-collapse factor is scored as baseline calibration rather than as a
        finding.
      citation: KN-TECH-018
      provenance: internal
      verified_by: >-
        IDEA-20260826-4bc5d2 cites this technique note for the discounted baseline;
        TASK-20260904-8f2f95 read that proposal and did NOT open KN-TECH-018 itself. The
        constant is therefore second-hand and the contract re-reads it in its zero-compute
        stage before any comparison is scored.
    - description: >-
        The lane's standing first-moment closure, which this hypothesis extends to the
        second moment rather than contradicts.
      citation: IDEA-20260807-0ff796
      provenance: internal
      verified_by: >-
        Named by IDEA-20260826-4bc5d2 as its nearest existing record;
        TASK-20260904-8f2f95 did not open IDEA-20260807-0ff796 and relies on it for
        positioning only, never as support for a measured value.
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: >-
        var_rot_delta_matched_random - the rotation-invariant variance of Delta over the
        frozen window family for the matched random curve, dimensionless
      direction: different
      minimum_effect: >-
        Inside the derived square-root-discrepancy band at every tested prime. This is the
        instrument gate and it can fail.
    - metric: >-
        var_rot_delta_curve_free - the same statistic computed on a uniformly drawn subset
        of F_p of cardinality (N-1)/2, with no curve constructed, dimensionless
      direction: different
      minimum_effect: >-
        Inside the same band, and within the declared resolution of the matched-random curve
        arm. A curve arm that agrees with this arm is a statement about pseudorandom subsets
        of F_p and MUST be reported as such.
    - metric: >-
        var_rot_delta_special_minus_matched - the rotation-invariant variance of the
        small-|D_0| arm minus the matched-random arm at the same p and N, dimensionless
      direction: different
      minimum_effect: >-
        PRE-REGISTERED NULL EXPECTATION 0 within the band. H-bias would show a positive
        excess growing with the number of windows. Any apparent excess halts the record for
        independent review before a sentence asserts it.
    - metric: >-
        rotation_average_residual - the rotation-averaged deviation of the x -> zeta x
        reindexed windows on a j = 0 curve, dimensionless
      direction: different
      minimum_effect: >-
        FORCED 0 to enumeration tolerance. A nonzero value voids the run.
    - metric: >-
        d0_regression_slope - the slope of rotation-invariant Var(Delta) against |D_0| over
        the matched-order family, with an exact permutation distribution over class labels
      direction: different
      minimum_effect: >-
        Flat under H-null, with the reported resolution stated per prime. A monotone trend
        surviving the twist control AND not reproduced by the curve-free arm is the H-bias
        signature.
    - metric: >-
        twist_agreement - the same statistic on the quadratic twist of each small-|D_0|
        curve, dimensionless
      direction: different
      minimum_effect: >-
        A |D_0|-driven effect must persist under the twist within the declared resolution; a
        coefficient-instance effect must not. Disagreement localises the effect and is
        reported rather than pooled.
  test_boundary:
    instances:
      - >-
        A matched-order family at three toy primes: N prime, fixed per family, and p = N + t - 1
        prime, so that D = (t-2)^2 - 4N sweeps while N is literally the same integer in every
        class.
      - >-
        Per prime: the j = 0 and j = 1728 craters where they exist, at least four small-|D_0|
        classes with |Aut| = 2, at least eight generic-D_0 matched-random curves, the quadratic
        twist of every small-|D_0| arm, and one curve-free uniform-subset arm.
    parameters:
      primes: 'three toy primes with N between 2^16 and 2^20, chosen and frozen before any measurement'
      window_widths: 'B/p in {1/64, 1/16, 1/4}, with at least 256 rotation-closed offsets per width'
      window_family: 'frozen and hashed before any curve arm is enumerated; rotation-closed under the rational automorphism action by construction'
      enumeration: 'complete enumeration of G, exact integer counts, no sampling of points'
    implementation: >-
      Pure Python integer arithmetic plus an explicit affine group law under
      experiments/EXP-ICEX-4fabdb/driver/. No solver, no Groebner basis, no Macaulay matrix.
      Nothing under harness/ is modified.
    budget:
      wall_clock_seconds_total: 21600
      maximum_memory_gb: 8
      maximum_runs: 12
  falsification_conditions:
    - >-
      F1. The matched-random curve arm does not reproduce the derived null band. INSTRUMENT
      OR DERIVATION FAILURE; no |D_0| comparison is reported at that prime.
    - >-
      F2. The rotation-averaged reindexed deviation is nonzero beyond tolerance. The
      averaging is wrong; the run is void.
    - >-
      F3. The curve-free uniform-subset arm does NOT reproduce the band. Either the band is
      wrong or the subset draw is wrong; in both cases the curve arms are uninterpretable,
      because the reference object the design uses to separate "elliptic curve" from
      "pseudorandom subset" is itself broken.
    - >-
      F4 (MAIN NEGATIVE AND THE EXPECTED DELIVERABLE). Rotation-invariant Var(Delta) shows no
      |D_0| trend beyond the matched-random and curve-free bands across the family. The
      coordinate-placement channel is closed at the tested orders with a named, MEASURED
      obstruction - subgroup coordinate placement is indistinguishable at second order from a
      uniform subset of the same size - and the lane's first-moment closure is strengthened in
      its second moment.
    - >-
      F5 (STOP CONDITION). An apparent excess over both null bands that survives the twist
      control. Work STOPS and independent review is requested before any record states an
      excess.
  interpretation_limits:
    - >-
      Claim tier toy. N is a toy group order; nothing here is a cryptographic-scale statement
      and no transfer is attempted.
    - >-
      A coordinate-placement bias, even if found, is at best a change in factor-base SIZE, i.e.
      a constant or logarithmic cofactor, and is NOT an exponent. The record is proposed as a
      falsifier of a yield-advantage folklore and as a second-moment building block, not as an
      exponent-mover.
    - >-
      Any advantage at or below the automorphism orbit-collapse factor is baseline calibration
      and is recorded as such, never as a discovery.
    - >-
      The object is a passive functional of the curve, not a relation-collection algorithm. No
      factor base is constructed and no relation is collected.
    - >-
      If the curve arms agree with the curve-free arm, the SUPPORTED statement is about
      pseudorandom subsets of F_p and it may not be restated as a statement about elliptic
      curves or about the ECDLP.
  status: proposed
  proposed_by: idea-generator
  specified_by: coordinator
  prior_evidence_refs:
    - RQ-JINV-8fc13a
    - IDEA-20260826-4bc5d2
    - GOAL-ENDO-001
    - KN-TECH-018
  distinguishable_outcomes:
    - outcome: >-
        Both null arms reproduce the band, rotation-averaging is exact, and the |D_0| slope's
        interval contains 0 at the stated resolution.
      meaning: >-
        H-null is supported at the tested orders. The channel closes with a measured
        obstruction and a stated resolution, and the closure is explicitly a statement about
        subsets of F_p of this size, not about curves.
    - outcome: >-
        The |D_0| slope excludes 0, survives the twist control, and the curve-free arm does NOT
        show it.
      meaning: >-
        H-bias is the live reading. Work stops for independent review; nothing is asserted
        before it, and the effect is scoped to a factor-base-size question, never an exponent.
    - outcome: >-
        The |D_0| slope excludes 0 and the curve-free arm shows the SAME excess.
      meaning: >-
        The signal is a property of the window family or of the discrepancy statistic, not of
        curves. The measurement is reported as an instrument finding and the |D_0| reading is
        withdrawn.
    - outcome: >-
        The rotation-averaged reindexed deviation is nonzero, or a null arm misses the band.
      meaning: >-
        Instrument failure. Nothing in the run is readable in either direction, and the failure
        is an infrastructure and derivation outcome, never negative mathematical evidence.
