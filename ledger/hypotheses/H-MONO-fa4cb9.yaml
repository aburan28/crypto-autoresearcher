hypothesis:
  id: H-MONO-fa4cb9
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  derived_from_idea: IDEA-20260904-4f614a
  status: supported
  added: '2026-09-04'

  status_note_2026_09_04: >-
    EXP-MONO-ee06e2 executed, independently reviewed (Validator + Red
    Team), and decided in DEC-20260904-e9df3f (evidence: EV-MONO-fae201).
    Outcome (I) resolves cleanly: on a found h_-=3 curve, the linear
    closed form matches the exhaustive census exactly and the named
    quadratic rival is decisively excluded, independently reproduced from
    scratch. Red Team additionally re-derived IDEA-20260904-4f614a's own
    STEP 4/5 mechanism from first principles and confirmed it structurally
    forces linearity (no combinatorial slot for a nonlinear term) --
    upgrading this from an empirical fit to a corroborated derivation.
    Promoted to the knowledge corpus as KN-FIND-edd62c, with the h_+ term
    and any h_+/h_- interaction explicitly disclosed as untested. Next
    action: a follow-up on the curve p=103, A=1, B=11 (h_+=1, h_-=1, per
    Red Team's own finding) testing the full bivariate form.

  statement: >-
    SCOPE: m=4 only, symmetric-base Semaev cover, prime fields F_p, p>3,
    toy range, ordinary curves with the distinct-split (Z=3) residual
    stratum, on a curve with h_- >= 2 (i.e. genuinely beyond the minimal
    positive value h_-=1 that EXP-MONO-4e6faa tested). Claim tier toy for
    measurement, derivation tier for the closed form under test.

    THE HYPOTHESIS. EXP-MONO-4e6faa confirmed IDEA-20260904-4f614a's D3
    closed form exactly on a curve with h_-=1, but (per that experiment's
    own independent Red Team review, DEC-20260904-46b71e) h_-=1 is
    algebraically incapable of discriminating the CLAIMED LINEAR
    dependence of the D-term on h_- (D = h_+ n_- + h_- n_+) from any other
    functional form f(h_-) agreeing with the linear one at h_-=1 (since
    1^k=1 for any k). This hypothesis targets exactly that gap: on a curve
    with h_- >= 2, does the closed form's LINEAR prediction survive, while
    a named, plausible non-linear rival (quadratic scaling in h_-) is
    excluded?

    PRE-REGISTERED, TWO-SIDED, TARGETING THE FUNCTIONAL FORM SPECIFICALLY.
    Let D_lin = h_+ n_- + h_- n_+ (the frozen D3 formula, unchanged) and
    D_quad = h_+ n_- + (h_-)^2 n_+ (the simplest non-linear rival that
    also collapses to D_lin at h_- in {0,1}, so it was NOT excluded by any
    prior run). (I) On a found h_->=2, Z=3 curve, the exhaustive census's
    own #1^4 and #2+1+1 match D_lin's prediction EXACTLY and do NOT match
    D_quad's prediction (D_lin != D_quad whenever h_- >= 2 and n_+ > 0,
    since h_- != h_-^2 there) -- this closes the retrodiction-bias gap
    IDEA-20260904-4f614a itself named, in full, for the first time.
    (II) The census matches D_quad instead of D_lin -- falsifying the
    specific LINEAR form while leaving the qualitative "D depends on h_-"
    finding from EXP-MONO-4e6faa intact; the closed form would need
    correction, not wholesale rejection. (III) The census matches
    NEITHER exactly -- falsifying both tested forms, itself a genuinely
    informative result requiring a fresh derivation attempt, reported
    plainly rather than explained away.

  mechanism: >-
    Reuses IDEA-20260904-4f614a's own full derivation and
    EXP-MONO-4e6faa's own already-independently-verified search/census/
    comparison pipeline (Stage 0/1/2 structure), unmodified in its core
    logic. This hypothesis's own new content is: (1) an explicit search
    for a curve with h_- >= 2 (not merely h_- > 0) at a toy prime, so the
    found object can actually discriminate linear from quadratic scaling;
    (2) computing BOTH the linear (D3, frozen) and a named quadratic rival
    prediction BEFORE running Stage 1, so neither can be selected after
    seeing the result; (3) exact, zero-tolerance three-way comparison
    (observed vs. D_lin vs. D_quad).

  falsification_condition: >-
    Per (II)/(III) above: if the exhaustive census's #1^4 or #2+1+1 does
    NOT match D_lin's prediction exactly, the LINEAR form of the D-term is
    falsified (whether or not D_quad's prediction happens to match). If no
    curve with h_- >= 2 exists within the declared toy prime range, that is
    itself a reportable, falsifiable, non-evidentiary occupancy fact (per
    HEUR-CELL-2 below), not evidence for or against the formula -- though
    Red Team's own free-standing census (200 of 10,100 non-singular (A,B)
    pairs at p=101 alone have h_-=3, h_+=0) makes exhaustion very unlikely
    at this specific prime.

  heuristic_assumptions:
    - id: H1
      statement: >-
        HEUR-CELL-2 (a refinement of H-MONO-d4c511's own HEUR-CELL-1): a
        curve with Z=3 and h_- >= 2 exists within the declared toy prime
        search range [101, 2000]. Unlike HEUR-CELL-1, this is not a fully
        open occupancy question at the time this record is filed:
        EXP-MONO-4e6faa's own independent Red Team review already
        exhaustively enumerated all 10,100 non-singular (A,B) pairs at
        p=101 (using only already-verified filter functions, per that
        review's own J4 discretionary check) and found 200 curves with
        h_-=3, h_+=0 there alone. This experiment's own Stage 0 must
        independently re-verify this by its own fixed, declared search
        order rather than assuming or hard-coding any specific (A,B) pair,
        to avoid any appearance of curve-selection after the fact.
      rigorous_support: >-
        Not distributional; an existence claim. Strong prior evidence from
        an independent source (the Red Team's own free-standing count),
        but this record's own falsification/support judgment rests only on
        this experiment's own independently re-verified search and census,
        never on the cited prior count taken on faith.
      validation_plan: >-
        SAMPLE: scan ordinary curves (varying A,B) at toy primes in
        [101,2000], same fixed ascending order as EXP-MONO-4e6faa
        (prime asc, then A asc, then B asc), requiring Z=3 AND h_- >= 2
        this time (not merely h_- > 0), first hit taken. COMPARE AGAINST:
        both D_lin's and D_quad's exact predictions on that curve's own
        exhaustive distinct-split-stratum census. TAIL CHECK: not
        applicable, exact-integer test. TRANSFER ASSUMPTION, STATED: a
        confirmed linear match on ONE h_->=2 curve supports but does not
        prove the linear form for every possible h_- value; a fully
        thorough test would sample multiple such curves (e.g. h_-=2 and
        h_-=3 separately) if budget allows within this same experiment.
      falsification_condition: >-
        Any exact mismatch between the observed census and D_lin's own
        prediction on a found h_->=2 curve; or complete exhaustion of the
        declared search range with no such curve found (a reported
        non-finding, not a falsification of the formula itself, though
        very unlikely per the Red Team's own prior count).

  target_complexity:
    time_exponent: O(p) per curve tested (exhaustive census over the distinct-split stratum, reusing already-verified O(1)-per-instance classification).
    memory_exponent: O(1).
    best_known: Not applicable; no ECDLP complexity claim. Pollard rho (KN-OPEN-001) untouched.

  claim_boundary_and_test_boundary: >-
    Tests ONLY whether the D-term's own dependence on h_- is specifically
    linear, on the distinct-split (Z=3) stratum, at toy scale, using a
    curve with h_- >= 2. Does NOT test the non-split strata. Does NOT make
    any relation-rate, cost, or exponent claim. A confirmed linear match
    strengthens but does not, by itself, prove the closed form for every
    curve or every h_- value; a mismatch is a complete, zero-tolerance
    falsification of the specific linear form (not of the qualitative
    "D depends on h_-" finding from EXP-MONO-4e6faa, which stands
    independently). Does not re-scope H-MONO-93bc4d.

