# CERTBIN instrument control: retires the normal-vs-polynomial basis
# confound for closure-based measurements; measures whether W_4 sees the
# SET V on structured 9-dimensional sets at the RC-1 cell. ZERO RUNS in
# this design packet. No AUXIN. No Bedrock. No curve attack / exponent
# claim. Claim tier: instrument control + exact propositions + toy
# measurement. Stages 0-2 authorized.
# =============================================================================
