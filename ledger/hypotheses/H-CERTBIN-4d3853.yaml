# mutant closures (Proposition B) plus Frobenius-stable certificate
# transfer (Proposition F). Specified from IDEA-20260926-917981 under
# RQ-CERTBIN-836ce2 / GOAL-ECDLP2M-001. Approved DEC-20261002-711879.
