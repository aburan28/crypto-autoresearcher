  proposed_by: coordinator
  title: >-
    Closure outcomes are basis-invariant (Proposition B proved and
    instrument-regressed on archived RC-1 targets); W_4 rates on
    normal-coordinate and Frobenius-stable 9-dimensional V decide E-SET
    vs E-POLY; Proposition F transfers certificates across Frobenius
    orbits on a stable V exactly

  statement: >-
    CLAIM (instrument control; NO ATTACK; NO COST CLAIM). Setting: RC-1
    cell n=17, f=t^17+t^3+1, m=2, l=9, curve A=97044, B=126251, the 144
    archived x(2E) targets (U62, S62, C20) of RUN-CERTBIN-c417e0.
    PROPOSITION B (exact): for fixed set V and x_R, changing the F_2-basis
    of the field or of V leaves "1 in M_D" and "1 in W_D" invariant for
    every D, because both changes induce degree-preserving ring
    automorphisms of B = F_2[v]/(v_i^2+v_i) that fix the constant 1.
    PROPOSITION F (exact): if V is Frobenius-stable then W_D(x_R^2) is the
    image of W_D(x_R) under the induced automorphism, so one certificate
    per Frobenius orbit transfers and verifies. EMPIRICAL: on the same
    144 targets, W_4 and M_4 rates over (a) polynomial V with random basis
    + normal field basis, (b) normal-coordinate V_N, (c) Frobenius-stable
    V_S, (d) random 9-dimensional V, decide E-SET (both structured W_4
    rates >= 0.90) vs E-POLY (either <= 0.50) vs MIXED. CLAIM TIER:
    control + measurement. NO exponent. NO ECC2K-130 break. NO Magma/
    Sage/AUXIN/Bedrock. Closure instrument only (SAT engines out of scope).

  mechanism: >-
    OBJECT FRAME. Representation R1 (Boolean coordinates of x_i in a
    basis of V; equations in an F_2-basis of the field). Relation-search
    object: Class I partial-action, unchanged. Solver-side object: the
    pair (set V, x_R) that Proposition B shows the closure depends on;
    Sigma = D-bounded ring action of B plus (for F) Frobenius orbit action
    on targets. Trichotomy: COORDINATE-INDEPENDENT by Proposition B —
    HOLD-I's descent-basis confound is a change of coordinates for the
    closure instrument; the residual object is the SET V. Lossy
    projection: (bases, set V, x_R) -> (set V, x_R) discards the two
    bases; Sigma-compatible because both act as ring automorphisms
    commuting with the D-bounded action. WHAT IS NEW: Propositions B and
    F written with the automorphism argument; arm (a) as an instrument
    regression of B; arms (b)-(d) deciding whether W_4 is set-blind on
    structured V at this cell. Charged stages: per-attempt closure
    solve only — not an ECDLP solve.

  assumptions:
    - >-
      The RC-1 curve, modulus, and 144 archived targets of
      RUN-CERTBIN-c417e0 are reused as literal inputs; nothing is re-sampled
      for the archived labels.
    - >-
      A normal element of F_{2^17} is found by pure-Python search (conjugates
      linearly independent); no GNB existence condition is needed.
    - >-
      The 9-dimensional Frobenius-stable V is F_2 + ker g(sigma) for each
      octic factor g of Phi_17 over F_2; both octics are run and reported
      separately.
    - >-
      OFF-LIMITS: F2 family; F6 (automorphism orbit) only in Proposition F,
      with the gain stated as the known GGMP 1/n.
    - >-
      Proposition B says nothing about SAT/DPLL engines (basis remains a
      live confound there; IDEA-20260922-7ab503 / IDEA-20260904-3c7a91).
    - Amazon Bedrock is prohibited. No AUXIN provisioning.

  proof_search_map:
    bottleneck: >-
      Whether any representation-level choice other than the set V can move
      a closure outcome (Proposition B says no), and whether W_4 sees the
      set at all on structured V (measured on three V-sets at 144 targets).
    baseline_embedding:
      parameter_slice: >-
        The RC-1 cell itself (polynomial V, archived labels: M_4 and W_4
        on the 144 targets of RUN-CERTBIN-c417e0) is the exact slice; arm
        (a) must reproduce every archived label, iteration count and
        dimension exactly.
      reproduction_check: >-
        Arm (a): re-descend the 144 archived targets in a NORMAL field
        basis and with a random basis of the polynomial V, run M_4 and
        W_4; Proposition B predicts 288/288 label agreement (144 targets
        x {M_4, W_4}); any disagreement after instrument regression is
        either an instrument defect or a counterexample to Proposition B
        and is the headline.
    observation_collision:
      observable: >-
        The triple (M_4 label, W_4 label, first iteration containing 1)
        per target per V-set.
      distinct_preimage_search: >-
        Two V-sets with equal kappa but different tensors could give
        different rates (kappa is not the object); the polynomial V and
        the stable V both have kappa = 17 at l=9, n=17, so a rate
        difference between them exhibits exactly this collision and says
        the finer tensor invariant is the object.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The closure outcome as a function of (set V, x_R) only, with
          the bases quotiented out by the automorphism argument.
        predicted_gain: >-
          Removes one confound from every closure-based measurement at
          zero compute; no cost gain.
      - transform: observable_fiber
        proposed_object: >-
          Three V-sets of dimension 9 at the same 144 targets, with the
          archived polynomial V as the reference fibre, plus a random-V
          null of matched shape.
        predicted_gain: >-
          Decides E-SET against E-POLY for W_4 and reads the M_4 rate as
          a saturation-count consequence per set.
    quantifier_order: >-
      Propositions B and F: FORALL n, V, x_R, D, FORALL bases (and for F,
      FORALL Frobenius-stable V): exact equalities. Empirical claim: FOR
      the 144 archived targets and the three named V-sets, the W_4 and
      M_4 rates are as measured. NOT CLAIMED: anything about SAT engines,
      n=19/131 cost, or ECC2K-130.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Closure outcomes are basis-invariant (proved); on the RC-1
        targets the W_4 rate is r_poly, r_norm, r_stab and the M_4 rate
        is as measured per set; on the stable set one certificate per
        Frobenius orbit transfers and verifies 17-fold." Nothing about
        SAT engines, about n=19 or 131, or about cost.
      nearby_object_control: >-
        The n=19 cell as the object where Proposition F has no stable V
        to act on (control for the amortisation arm: transfer must be
        impossible there by construction); arm (d) random V as the
        shape-matched null; S62 satisfiable controls on every set.
    proof_obligations:
      - claim: Linear substitution v -> Tv is a degree-preserving ring automorphism of B in characteristic 2.
        responsibility: correctness
      - claim: Recombining equations by an invertible matrix leaves rowspace(M_D) and W_D unchanged.
        responsibility: correctness
      - claim: The squaring map on a stable V induces such an automorphism and maps the system for x_R to the system for x_R^2.
        responsibility: correctness
      - claim: The stable 9-dimensional V at n=17 exists and is computed exactly (kernel of g(sigma)).
        responsibility: feasibility
      - claim: Transferred certificates verify under the separate-process verifier on every conjugate.
        responsibility: correctness
      - claim: Arm (a) reproduces archived RC-1 labels exactly (288/288).
        responsibility: baseline
    not_applicable_reason: null

  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        (Saturation predicts M_4.) For each V-set the plain M_4 refutation
        rate on unsatisfiable targets is 1 where the tensor's saturation
        count exceeds dim B_{<=3} and near 0 where it falls short, as
        KN-FIND-7c1e94's counting rule held on N-CONV, N-CONV17 and N-CONVL.
      random_model_justification: >-
        The degree-4 projection rank P depends on the quadratic part only
        (L-TOP, verified derivation in KN-FIND-7c1e94); the step from
        saturation to refutation is the scoped heuristic R-ED, used here
        only for the structured sets.
      supporting_results:
        - KN-FIND-7c1e94; IDEA-20260926-917981 H1.
      validation_experiment_ids: [EXP-CERTBIN-1bfef5]
      falsification_condition: >-
        Any target refuted at M_4 with a non-saturated count, or unrefuted
        with a saturated one, listed by idx; a measured rate contradicting
        its own saturation prediction breaks KN-FIND-7c1e94's counting
        rule for that set.

  predictions:
    - metric: label_agreement_arm_a
      direction: same
      minimum_effect: >-
        Exactly 288/288 (144 targets x {M_4, W_4}) by Proposition B; any
        disagreement is the headline.
    - metric: W4_rate_structured_sets
      direction: different
      minimum_effect: >-
        E-SET iff both V_N and V_S W_4 rates >= 0.90 (CP95); E-POLY iff
        either <= 0.50; MIXED otherwise.
    - metric: M4_rate_per_set
      direction: different
      minimum_effect: >-
        Predicted from the saturation count of each set's tensor,
        computed first (pre-data); measured rate contradicting its own
        saturation prediction reported as a break of H1.
    - metric: transferred_certificate_verification
      direction: same
      minimum_effect: >-
        Exactly 17/17 per refuted target on the stable V by Proposition F;
        any failure is an instrument or proposition defect.

  test_boundary:
    instances:
      - cell_rc1: >-
          n=17, f=t^17+t^3+1, m=2, l=9, curve A=97044, B=126251, 144
          archived x(2E) targets (U62,S62,C20) of RUN-CERTBIN-c417e0.
      - arm_a_coordinate_change: >-
          Polynomial V with a random basis of V; equations descended in a
          normal field basis; prediction exact agreement with archived
          labels.
      - arm_b_normal_coordinate: >-
          V_N = span of nine conjugates of a normal element.
      - arm_c_frobenius_stable: >-
          V_S = F_2 + ker g(sigma) for both octic factors of Phi_17;
          certificate transfer to 16 conjugates per refuted target.
      - arm_d_random_null: >-
          One random 9-dimensional V (RC-4's object) as the shape-matched
          null.
      - nearby_control_n19: >-
          Document that Proposition F has no stable V at n=19
          (ord_19(2)=18); no transfer arm there by construction.
    parameters:
      n: 17
      m: 2
      l: 9
      n_targets: 144
      D_levels: [3, 4]
      frobenius_orbit_size: 17
      e_set_threshold: 0.90
      e_poly_threshold: 0.50
      seed: 2026092691
    implementation: >-
      experiments/EXP-CERTBIN-1bfef5/implementation/ wrapping
      experiments/EXP-CERTBIN-e94b27/impl/{gf2n,curve,macaulay,closure,
      oracles_rc1,elim}.py and verifier/verify_cert.py. Extend descent to
      take an arbitrary basis of V and of the field (~150 lines). Pure
      Python. No Magma/Sage/cypari2; no AUXIN; no Bedrock; no SAT engine.
    budget:
      maximum_runs: 4
      total_cpu_hours_advisory: 4.0
      wall_clock_seconds_advisory: 14400

  falsification_conditions:
    - >-
      Proposition B falsified by any verified label disagreement in arm
      (a) once the instrument regression passes.
    - >-
      Proposition F falsified by any transferred certificate that fails
      verification while the source certificate verifies.
    - >-
      E-SET falsified iff the W_4 rate on V_N or V_S is <= 0.50; E-POLY
      falsified iff both are >= 0.90 (both are scientific readings, not
      artifacts).
    - Instrument falsified (void) by any refuted satisfiable control (S62).
    - Claiming any ECDLP speedup, exponent move, or ECC2K-130 break under this card.
    - Treating infra timeout/crash as negative evidence against Propositions B/F or H1.

  interpretation_limits:
    - Toy tier; one curve, n=17, m=2; nothing about cost, F4 step degree, Semaev Assumption 1, or SAT engines.
    - Proposition F's amortisation is the known GGMP 1/n and is unavailable on ECC2K-130's linear factor bases; recorded as a control, not a lever.
    - KN-OPEN-020 class of every V here is the scoped-out linear-subspace class.
    - At n=19 no stable set exists, so arm (c) has no counterpart there.
    - Proposition B does not license basis-invariance claims for SAT/DPLL.

  distinguishable_outcomes:
    - id: O-E-SET
      meaning: >-
        Arm (a) exact; both structured W_4 rates >= 0.90; M_4 rates match
        saturation predictions; transferred certificates verify 17/17.
        Descent basis retired as a confound for closure-based CERTBIN
        measurements; W_4 read as set-blind at this cell; stable-V
        amortisation verifies as the known 1/n. No cost/exponent claim.
    - id: O-E-POLY
      meaning: >-
        Arm (a) exact; either structured W_4 rate <= 0.50. W_4 refutation
        is polynomial-set-specific; every quoted W_4 rate acquires the
        qualifier "on the polynomial subspace"; KN-OPEN-3c8f51 item (A)
        sharpens to the convolution tensor. No cost/exponent claim.
    - id: O-MIXED
      meaning: >-
        Arm (a) exact; structured W_4 rates between the E-SET and E-POLY
        thresholds. Report exact CP95 intervals; neither reading claimed.
    - id: O-ARTIFACT
      meaning: >-
        Arm (a) disagreement after instrument check; any S62 refutation;
        transferred certificate failure with verifying source; or
        saturation/M_4 contradiction under H1 read as instrument/
        proposition defect pending localisation. Nothing else read.
    - id: O-IMPEDIMENT
      meaning: >-
        Budget/infra stop with measured quantity; never negative evidence
        against Propositions B/F or H1.

  dominated_by: >-
    n/a (no result claimed on any cost axis). Rho at 2^60.81 and oracle A
    dominate everything at the cell; the record claims a control, not a
    row. Within CERTBIN: required building block for every closure-based
    cost law (including IDEA-20260926-89886c and DEC-20260926-901ea1 NA-2).
  sota_delta:
    time: >-
      Zero. Against the program's prior state, Proposition B retires the
      descent-basis confound for the closure instrument by proof plus
      instrument regression.
    memory: Zero.
    data_queries: Not applicable.

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
