hypothesis:
  id: H-DREG-2af583
  question_id: RQ-DREG-d7b6d6
  proposal_id: IDEA-20260922-881df9
  added: '2026-09-22'
  title: >-
    A within-class named-degree gap is an isogeny effect only when different-trace
    curves and support-matched non-elliptic systems do not match its range
  statement: >-
    Let range_A be the within-class range, on finished cells, of one named
    degree increment from EXP-DREG-ab3fee. Let range_B be the range of the
    same increment over four frozen ordinary F_4 curves of a different trace.
    Let range_C be the range of the same increment over one support-matched
    non-elliptic system and the base. A gap range_A >= 1 is an isogeny-class
    effect only when range_B = 0 and range_C = 0. If range_B >= range_A or
    range_C >= range_A, the gap is trace noise or monomial-shape noise. If
    all three ranges are 0, there is no gap to attribute. No ECDLP exponent
    is claimed. Same trace is the same F_4-isogeny class, so arm B cannot
    match the group order.
  mechanism: >-
    Three ensembles, one named degree. Arm A reuses the certified class.
    Arm B changes the trace. Arm C keeps the monomial support of the base
    chained system and replaces coefficients by a frozen uniform draw, which
    destroys the Weierstrass relation. The tracked object is the triple of
    ranges. It discards which system produced which degree. Coordinate-dependent.
    What is added beyond the slope census is the attribution rule. A volcano
    split, if the class has two levels, is believed only when shuffling the
    level labels kills the gap. That split is a degree-profile fact, not an
    attack-cost result for RQ-VOLC-f6253b.
  assumptions:
    - Named degrees and the ladder are those frozen in EXP-DREG-dd668d.
    - Arm B curves are ordinary and have a trace different from the base. Four curves, lex-first.
    - Arm C uses one frozen seed and does not get retuned if the range is large.
  proof_search_map:
    bottleneck: Attribution of a range, not discovery of a new system.
    baseline_embedding:
      parameter_slice: The finished class range from EXP-DREG-ab3fee, including a range of 0.
      reproduction_check: >-
        Recompute the base increment from the census artifacts and require the
        same integer before scoring arms B and C.
    observation_collision:
      observable: The triple (range_A, range_B, range_C).
      distinct_preimage_search: >-
        Two different assignments of degrees to curves can share a range.
        Log the per-curve degrees so the range is not the only record.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: the triple of ranges
        predicted_gain: >-
          Separates an isogeny-organized gap from trace noise and shape noise.
          No exponent gain.
    quantifier_order: >-
      A gap is an isogeny-class effect only if range_A >= 1 AND range_B = 0
      AND range_C = 0. Otherwise it is not. The quantifiers are the finished
      cells of the three frozen arms.
    method_ceiling:
      strongest_certifiable_claim: >-
        One of the labels A-only, trace-noise, shape-noise, flat, or
        unmeasured, on this toy ladder. Not an attack cost.
      nearby_object_control: >-
        A shuffle of volcano-level labels, used only when at least two levels
        exist. If the class has one level, the stratum is not applicable.
    proof_obligations:
      - claim: Arm B does not match the group order. The confound is stated.
        responsibility: scope
      - claim: A null range at least as large as range_A blocks an isogeny attribution.
        responsibility: strictness
    not_applicable_reason: null
  predictions:
    - metric: range_B compared with range_A
      direction: different
      minimum_effect: >-
        The isogeny-effect label requires range_B = 0 when range_A >= 1.
        range_B >= range_A means trace noise.
    - metric: range_C compared with range_A
      direction: different
      minimum_effect: >-
        The isogeny-effect label requires range_C = 0 when range_A >= 1.
        range_C >= range_A means shape noise.
  test_boundary:
    instances:
      - the certified class of EXP-DREG-ab3fee
      - four different-trace ordinary curves
      - one support-matched non-elliptic system
    parameters:
      seed_arm_C: 20260922
      rungs: [1, 2]
    implementation: experiments/EXP-DREG-6de989/specification.yaml
    budget:
      maximum_runs: 1
      maximum_memory_gb: 4
  falsification_conditions:
    - range_A >= 1 and range_B = 0 and range_C = 0 is the only isogeny-effect label. Any other finished pattern falsifies that label.
    - A label shuffle that preserves a volcano gap means the gap is not level-structured. The unshuffled gap is then not reported as a level effect.
  interpretation_limits:
    - Toy ladder only. No cryptographic curve. No ECDLP exponent.
    - An isogeny-effect label is still not an attack. The walk is not charged.
    - Does not answer RQ-VOLC-f6253b's attack-cost question.
  heuristic_assumptions:
    - id: HEUR-2af583
      formal_statement: >-
        The three ranges are a finite comparison. No distribution is fitted
        and no tail probability is claimed.
      random_model_justification: No random model. The uniform draw in arm C is a fixed seed, not a probability model of elliptic curves.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        Arm C is redrawn until its range shrinks. That retuning falsifies the
        control. The seed stays 20260922.
  asymptotic_claim: null
  citations:
    - ref: IDEA-20260922-881df9
      provenance: internal
      claim: The three-arm attribution proposal.
      verified_by: coordinator
    - ref: RQ-VOLC-f6253b
      provenance: internal
      claim: Asks whether volcano depth changes attack cost. This hypothesis scores only the degree profile.
      verified_by: coordinator
    - ref: EV-ISO-001
      provenance: internal
      claim: At prime-field m=3 the degree variation sat in both isogeny neighbors and controls. That is the pattern this control is built to detect on a different ladder.
      verified_by: coordinator
  status: approved
  proposed_by: coordinator
