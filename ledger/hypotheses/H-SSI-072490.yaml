hypothesis:
  id: H-SSI-072490
  question_id: RQ-SSI-1946c9
  idea_id: IDEA-20261004-e4c461
  statement: >-
    On the depth-two walk-action template below, for each prime
    p in {59, 419, 659} and each degree l in {3, 5}, the unlabeled public
    state (the j-invariant only) of the supersingular curve y^2 = x^3 + x
    over F_p admits two admissible hidden l-isogeny labelings that assign
    the same public view and send at least one ordered label pair to
    non-isomorphic depth-two targets. The same label pairs, evaluated with
    the CSIDH ideal action of (l, pi - 1) and its conjugate published, have
    zero disagreements with secret-side composition. This is a finite
    collision certificate for that API. It is not an impossibility theorem
    for public-key encryption or for every supersingular construction.
  mechanism: >-
    Build the depth-two rooted l-isogeny neighborhood of j = 1728. A hidden
    labeling is a choice, at each step, of an l-isogeny kernel that is not
    recorded in the public state. Canonicalize the public view as the
    codomain j-invariant. A certificate is a pair of labelings with equal
    public j-invariants and depth-two codomains that are not isomorphic.
    The positive control publishes the ideal-class direction and requires
    the public action to match secret-side composition on every label pair.
  assumptions:
    - >-
      p = 59, 419, and 659 are the primes 4*3*5-1, 4*3*5*7-1, and
      4*3*5*11-1. Each is congruent to 3 mod 4, and both 3 and 5 divide
      (p+1)/4, so the base curve y^2 = x^3 + x is supersingular over F_p
      and both degrees are Elkies for the CSIDH-shaped action.
    - >-
      The bare public state is the F_{p^2}-isomorphism class, recorded as
      a j-invariant. No orientation, kernel polynomial, or torsion basis
      is part of that state.
    - >-
      Automorphisms at j = 0 and j = 1728, and dual or backtracking edges,
      are quotiented before a pair counts as a conflict. Only
      non-isomorphic endpoint disagreements count.
  proof_search_map:
    bottleneck: >-
      Carrying a second-step isogeny label that stays meaningful after the
      public state is reduced to a j-invariant.
    baseline_embedding:
      parameter_slice: >-
        Primes 59, 419, and 659, degrees 3 and 5, base j = 1728, with the
        public CSIDH action of the ideals (l, pi - 1) and their conjugates.
      reproduction_check: >-
        For every prime, degree, and ordered label pair, the public
        oriented action equals secret-side ideal composition.
    observation_collision:
      observable: >-
        The codomain j-invariant together with the depth-two codomain of
        an ordered label pair.
      distinct_preimage_search: >-
        Enumerate kernel labelings with the same public j-invariant and
        test whether their depth-two codomains are non-isomorphic.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fiber of hidden kernel labelings over one public j-invariant.
        predicted_gain: >-
          One conflicting fiber is a certificate that a deterministic
          evaluator of that public state is not correct for both labelings.
      - transform: representation_reduction
        proposed_object: >-
          The same fiber after the ideal-class direction is published.
        predicted_gain: >-
          The oriented evaluator separates the fiber. Deleting only that
          direction is the nearby-object control.
    quantifier_order: >-
      For each of the six (prime, degree) cells, quantify over all
      admissible hidden labelings of the depth-two neighborhood, then over
      ordered label pairs drawn from {3, 5}. One conflicting pair disproves
      a deterministic bare-j evaluator on that cell.
    method_ceiling:
      strongest_certifiable_claim: >-
        An exact no-evaluator certificate, or its absence, for this
        j-invariant API on these six cells, plus a passing oriented control.
      nearby_object_control: >-
        With the CSIDH ideal direction published, composition disagreements
        are zero. Deleting only that data is the unlabeled API.
    proof_obligations:
      - claim: the two hidden labelings induce the same public j-invariant
        responsibility: correctness
      - claim: their depth-two codomains are non-isomorphic
        responsibility: correctness
      - claim: the oriented control matches secret-side composition
        responsibility: baseline
      - claim: the certificate is only for this API and these six cells
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        At least one of the six cells has a conflicting unlabeled fiber.
        The collision lemma is decided by exhaustive enumeration; this
        heuristic is only the prediction that the count is positive.
      random_model_justification: >-
        A depth-two l-isogeny neighborhood has more kernel sequences than
        codomain j-invariants, so distinct sequences can share a codomain.
        This is a counting expectation on these finite graphs, not a model
        of a random supersingular curve at cryptographic size.
      supporting_results: []
      validation_experiment_ids:
        - EXP-SSI-be32d2
      falsification_condition: >-
        Exhaustive enumeration of all six cells finds zero conflicting
        unlabeled fibers while the oriented control still passes.
  structural_ingredients:
    - description: >-
        Isogeny public-key encryption that needs a public-domain group
        operation does not obtain that operation from a bare SIDH or CSIDH
        action. This hypothesis uses that boundary only as the reason to
        test a two-step label collision.
      citation: IDEA-20261004-e4c461
      provenance: internal
      verified_by: >-
        idea-generator session on 2026-10-04, citation block of
        IDEA-20261004-e4c461, which records the key-updatable PKE paper
        DOI 10.1007/978-3-030-99277-4_22 as retrieved
      role: interface obstruction that this certificate specializes
    - description: >-
        SiGamal evaluates a public CSIDH action. The oriented control uses
        that shape and does not instantiate the scheme.
      citation: IDEA-20261004-e4c461
      provenance: internal
      verified_by: >-
        idea-generator session on 2026-10-04, citation block of
        IDEA-20261004-e4c461, which records SiGamal DOI
        10.1007/978-3-030-64834-3_19 as retrieved
      role: positive-control structure
  reduction_chain:
    core_problem: >-
      Deterministic evaluation of a depth-two isogeny label from a public
      j-invariant alone, on the six cells named above.
    corollaries: []
  predictions:
    - metric: conflicting_unlabeled_fibers
      direction: higher
      minimum_effect: at least 1 in at least one of the six cells
    - metric: oriented_composition_disagreements
      direction: lower
      minimum_effect: exactly 0 on every cell
  test_boundary:
    instances:
      - >-
        Supersingular curve y^2 = x^3 + x, j = 1728, over F_p for
        p in {59, 419, 659}
    parameters:
      degrees: [3, 5]
      depth: 2
      public_state_negative: j-invariant only
      public_state_positive: j-invariant plus CSIDH ideal direction
    implementation: >-
      A finite-field isogeny enumerator written for this experiment.
      No cryptographic-size walk, no third-party key, and no PKE
      implementation.
    budget:
      enforcement: advisory
      wall_clock_seconds_per_run: null
      maximum_memory_gb: 4
      maximum_runs: 1
  falsification_conditions:
    - >-
      On every cell, every pair of hidden labelings with the same public
      j-invariant has isomorphic depth-two codomains for every ordered
      label pair, and the oriented control has zero disagreements.
    - >-
      The oriented control reports a composition disagreement. That
      invalidates the harness rather than confirming the barrier.
  interpretation_limits:
    - The certificate does not show that public-key encryption from EndRing is impossible.
    - A passing oriented control is not evidence that SiGamal, SÉTA, LIT-SiGamal, or FESTA is insecure or incomplete.
    - Results do not transfer to primes outside {59, 419, 659} or to degrees other than 3 and 5.
    - This hypothesis does not replace the C-star symbolic-interface task on GOAL-SSI-2fa82a.
  status: specified
  proposed_by: coordinator
