    by TASK-20260917-43701b (TASK-20260917-34b637, TASK-20260917-52b4e6,
    TASK-20260917-5fa7d5), composed in DEC-20260917-793ae2.
    WHY `analyzed` AND NOT `supported`. Two reasons, either sufficient, and
    neither of them is a doubt about (A) or (B).
    (i) AGENTS.md takes `replicate`, not `support`, on the first observation
    of a surprising or high-impact result, and PD-6 records that no
    independent replication invocation was spent. What stands in its place is
    structural rather than procedural -- Stages 0, 1, 2, 3 and every control
    are exhaustive and seed-free, hence deterministic by construction, and
    the load-bearing n = 131 quantity was independently RE-DERIVED BLIND by a
    disjoint method with exact agreement -- and DEC-20260917-793ae2 judged
    that a fresh replication would buy nothing determinism does not already
    give. That judgement removes the case for dispatching `replicate`; it
    does not manufacture the case for `supported`.
    (ii) PROMOTION TOWARD `supported` OF AN ASYMPTOTIC OR CLOSURE CLAIM IS
    NOT THIS RECORD'S JOB, BECAUSE THIS RECORD MAKES NO SUCH CLAIM. It claims
    no attack exponent, prices no algorithm and touches no deployed curve.
    The four promotion gates of agents/coordinator.md are about
    asymptotic-complexity claims; gate (2) in particular has nothing to bind
    on here, because after (E) was split out there is NO conditional
    dependence in this record and H1 is carried as a pointer with an empty
    validation list (gate 2 N/A, not gate 2 failed). The gates are neither
    satisfied nor evaded: they do not apply.
    WHAT IS TRUE OF (A)/(B)/(C) IS SAID PLAINLY AND WITHOUT A STATUS WORD:
    they are SUPPORTED AT DERIVATION TIER ON THE TESTED SCOPE. They survived
    every attack named in the review plan and two that were not, across
    roughly 340000 candidates from two implementations with no shared lineage
    and four characteristics, with 0 violations of any kind; the bound is
    exactly ATTAINED at p = 2 and at odd p; the proves-too-much control's
    declared failure signature is absent on both known-false families; and
    the load-bearing target-scale quantity agrees exactly across two lineages.
    That is what KN-FIND-0cbdf6 records, and it is the highest claim the
    evidence supports.
    NOTHING IN THIS RECORD ASSERTS ANYTHING ABOUT ANY DEPLOYED CURVE, AND IT
    IS NOT OFFICIAL UNTIL THE LEDGER ARCHIVE CARRYING DEC-20260917-6b9a63
    (TASK-20260917-8cc9a3) IS COMMITTED AND THE POST-COMMIT VERIFIER ACCEPTS
    IT.
