  test_boundary:
    instances: >-
      Stage 1 (exhaustive F_2 fixtures): (n, n') in {(11, 6), (13, 7),
      (7, 3), (11, 4), (13, 5)}, every lambda in F_2[X] of degree 2..7 (252
      per cell). Stage 1b (K-coefficient fixture): n = 11 (n' = 6) and
      n = 13 (n' = 7), d in {3, 5, 7}, 200 uniformly random lambda in
      F_{2^n}[X] of exact degree d per (n, d) cell, seed 20260917. Stage 2
      (complete-splitting sweep): prime n in {7, 11, 13, 17, 19, 23, 29,
      31}, 2 <= n' <= 15 with n' < n and n' not dividing n, 2 <= d <=
      min(8, 2^{n'} - 1), every lambda in F_2[X] of degree d. Stage 3 (the
      n = 131 census): field F_2[z]/(z^131 + z^13 + z^2 + z + 1), n' in
      {33, 44, 66}, every non-linearized lambda in F_2[X] of degree 3..7
      (244 per n'). Stage 4 (rational lambda): (n, n') in {(11, 6),
      (23, 12)}, 200 random coprime pairs (a, b) in F_2[X] with deg a,
      deg b <= 3, b != 0, d = max(deg a, deg b) >= 1, seed 20260917.
      Fixtures: (12, 6, X); (7, 3, X^2 + X); (31, 15, X^{2^7} + X^{2^3} +
      X^2 + X); (3, 2, X^2 + X). FROM INDEPENDENT REVIEW ONLY, and declared
      as such because no cell of the experiment is odd-characteristic:
      p in {3, 5, 7} at n <= 13 (p = 3) and n <= 11 (p = 5, 7), n' <= 8,
      degree 2..4, plus 2400 K-coefficient draws at odd p
      (TASK-20260917-34b637). No curve is touched; no key is involved.
    parameters:
      p: 2 in every numerical cell of the experiment (the derivation is for every p); p in {3,5,7} from review only
      seed: 20260917 for every random arm, with named sub-streams per cell
      coefficient_fields: F_2 (exhaustive arms), F_{2^11} and F_{2^13} (K-coefficient fixture)
      bound: max(d^{q+1}, 2^{n'-r}) with n = q n' + r, 0 <= r < n'
      corollary_exact: n/(n + n' - r); corollary_conservative n(n' - 1)/(n'(n + n' - r))
      corollary_precondition: r >= 1 AND n' < n (the second derived from cardinality plus non-divisibility)
      rational_conjecture: d^{q+1} + 2^{n'-r} + q d^q -- WITHDRAWN AS STATED
    implementation: >-
      GF(2)[X] arithmetic on bit-packed integers (multiplication, modular
      squaring, gcd, distinct-degree factorisation) and field arithmetic in
      F_2[z]/(irreducible) for the closing tests; the counting instruments of
      experiments/EXP-QSP-33b442/implementation/ (field enumeration;
      deg gcd(X^{2^n} - X, L); D-root count with the closing test L(x) = 0),
      the C helper gf2rc, and -- from independent review -- a dense F_p[X]
      implementation at arbitrary p written against the STATEMENT, a
      131x131 F_2 linear-algebra route, and the composition-lemma instrument
      of KN-TECH-54c38e.
    budget: >-
      Historical and advisory (docs/research-budget-policy.md): the frozen
      contract declared wall-clock 7200 s per run, 4 CPU-hours total, 4 GB
      peak memory (machine protection), 1 worker, at most 6 runs. Six counted
      invocations were spent against maximum_runs 6. This record proposes no
      new run and therefore requests no budget; ECC budgets are unlimited
      (AGENTS.md "ECC comes first").
  falsification_conditions:
    - >-
      F0. The hand derivation fails (an identity in (A) does not hold, or the
      degenerate case is mischaracterised): (A) withdrawn; the record is
      superseded, not patched. OUTCOME: three independent sessions attacked
      six named joints and produced no refutation artifact of any tier against
      (A) or (B).
    - >-
      F1. Any non-degenerate lambda at any p, n, n' with N_K(L) >
      max(d^{q+1}, p^{n'-r}), certified by an explicit root list a wrapper
      re-verifies: (A) is false as stated. If N nonetheless satisfies
      N <= d^{q+1} + p^{n'-r}, the max form is false and the sum form
      survives (WEAKEN to the sum form); if N exceeds the sum form too, (A)
      is rejected in scope. THIS REMAINS THE MOST VALUABLE OUTCOME THIS LINE
      CAN PRODUCE. The unexplored directions where it would most plausibly
      live, in order (DEC-20260917-793ae2 revisit_conditions): p outside
      {2,3,5,7}; degree above 7 at n = 131; K-coefficient lambda at n = 131,
      which nothing has touched.
    - >-
      F2. Any completely splitting L at r >= 1 and n' < n with beta <
      n/(n + n' - r): (B) is false as stated (same weaken/reject split
      against the conservative threshold n(n' - 1)/(n'(n + n' - r))). An
      object with n' >= n is NOT such a witness: it is excluded by (B)'s
      hypotheses, and the boundary case n' = n, lambda = X with beta = 1/2
      exactly is the reason the exclusion is written out.
    - >-
      F3. Type 2 at n = 7 or Theorem 1's equality case not attaining the
      bound: the tightness claim in (C) is false (the bound may still hold).
    - >-
      F4. A rational-lambda instance exceeding d^{q+1} + p^{n'-r} + q d^q:
      nothing in this record is touched, (D)(ii) being already WITHDRAWN AS
      STATED.
    - >-
      F5. Instrument disagreement at any exhaustive cell, or a fixture
      returning other than its forced count: the RUN is invalid and returns
      to the Executor with the defect; this is never evidence about (A).
    - >-
      F6. Timeout, crash, memory cap, or budget exhaustion: an
      infrastructure outcome under AGENTS.md rule 5, never evidence.
  interpretation_limits:
    - >-
      A derivation-tier mechanism about FACTOR-BASE SIZE. No attack, no
      exponent, no statement about deployed curves, and -- unlike the record
      it supersedes -- no claim about what any algorithm can or cannot
      achieve. What it establishes, on the tested scope and by derivation
      beyond it, is that a completely splitting quasi-subfield polynomial with
      n' < n and n' not dividing n must have beta > 1/2. WHETHER THAT RULES
      OUT AN ATTACK IS A SEPARATE, CONDITIONAL QUESTION: it needs a cost model
      and a LOWER bound on the solver exponent kappa, and no frozen source in
      this program supplies the latter (KN-OPEN-ac409f). That question is
      H-QSP-542cfa and it is at `specified`.
    - >-
      THE QSP LINE IS NOT CLOSED AND MUST NOT BE REPORTED AS CLOSED. Four
      survivors stand: n' | n (Diem's subfield family; at n = 131 only n' in
      {1, 131}); correspondence shapes of conjugate degree >= 2
      (IDEA-20260916-a17f43); factor bases that are not root sets of a single
      X^{p^{n'}} - lambda; and rational lambda, (D)(ii) being WITHDRAWN AS
      STATED.
    - >-
      Everything numerical at n = 131 other than the Stage 3 census is
      arithmetic on (B). The census certifies 244 DISTINCT lambda examined at
      three n' -- 732 rows, 732 distinct L, 244 distinct lambda -- and is a
      measure-zero slice: K-coefficient lambda at n = 131 are entirely
      untouched and degree is capped at 7. Every other lambda at those n' is
      covered by the bound, which is a derivation, not by a list.
    - >-
      THE EMPIRICAL SUPPORT IS NARROWER THAN THE SUPERSEDED RECORD'S HEADLINE
      SAID, AND THE CORRECTED FORM IS THE ONLY ONE THAT MAY BE REPEATED: "732
      exact counts at n = 131, 546 of them certificate-bearing, under two
      independent determinations at Stage 1 over a shared primitive base and
      one instrument at n = 131." 720 of the 732 census rows are
      single-instrument and their re-verifier can falsify a listed root and
      cannot detect a missing one; 10 of the 65 complete splitters rest on
      instrument I2 alone; the degeneracy control is vacuous by construction
      ((q+1) | n holds at no declared cell); and no independent replication
      invocation was spent (PD-6). (EV-QSP-a6aa4b boundaries.)
    - >-
      'Supported' for this record would mean supported at DERIVATION tier
      (docs/claims-and-verification.md): a checkable argument plus
      certificate-bearing numerical checks at toy n and at n = 131, not a
      machine-verified proof. It is NOT at `supported`; see status_note.
    - >-
      KN-OPEN-020 class: implicit-membership; the record prices the
      membership fibre of that class for one family of descriptions and
      does not touch the universal statement.
