hypothesis:
  id: H-QSP-3fe0ab
  question_id: RQ-QSP-f9bbdb
  source_proposal: IDEA-20260916-5c9d6e
  supersedes: H-QSP-5540d7
  supersedes_scope: >-
    THE UNCONDITIONAL PARTS ONLY: claims (A), (B), (C) and (D) of
    H-QSP-5540d7. The conditional closure reading (E) of that record is NOT
    carried here; it is restated, narrowed and superseded separately by
    H-QSP-542cfa. Splitting the parent into two records is the whole point of
    this supersession: (A)/(B)/(C) survived the claim-changing review round
    opened by TASK-20260917-43701b and (E) did not, and a single record cannot
    carry both verdicts. A reader of the bound reads THIS record; a reader of
    the closure reads H-QSP-542cfa.
  supersession_decision: DEC-20260917-6b9a63
  added: '2026-09-17'
  proposed_by: coordinator
  statement: >-
    SETTING. K = F_{p^n}, sigma the p-Frobenius. For f in K[X] write f^{(k)}
    for f with every coefficient raised to the p^k-th power, so that
    f(z)^{p^k} = f^{(k)}(z^{p^k}) for every z in the algebraic closure
    (Frobenius is a ring homomorphism). Let lambda in K[X] have degree
    d >= 1, L = X^{p^{n'}} - lambda(X), and n = q n' + r with 0 <= r < n'
    (so q >= 1 whenever n' < n). N_K(L) denotes the number of DISTINCT roots
    of L in K. Define the twisted iterates Lambda_1 = lambda and
    Lambda_{k+1} = Lambda_k^{(n')} o lambda, of degree d^{k+1}. Write
    l := log_p d and beta := l n / n'^2 (Definition 2 of KN-LIT-4fe9d2).
    (A) THE TWISTED INJECTION BOUND, DERIVATION TIER. For every root x of L
    in the closure, x^{p^{(k+1)n'}} = Lambda_{k+1}(x) for every k >= 0:
    x^{p^{(k+1)n'}} = (x^{p^{kn'}})^{p^{n'}} = Lambda_k(x)^{p^{n'}} =
    Lambda_k^{(n')}(x^{p^{n'}}) = Lambda_k^{(n')}(lambda(x)) =
    Lambda_{k+1}(x). If moreover x in K then x^{p^n} = x, and since
    (q+1) n' = n + (n' - r), x^{p^{n'(q+1)}} = (x^{p^n})^{p^{n'-r}} =
    x^{p^{n'-r}}. Hence every K-root of L is a root of the DIFFERENCE
    POLYNOMIAL D(Y) := Lambda_{q+1}(Y) - Y^{p^{n'-r}}, and
        N_K(L) <= deg D <= max(d^{q+1}, p^{n'-r})   whenever D != 0.
    (No injection is needed in this form: x itself is the root of D. The
    proposal's form via y = x^{p^r} and H(Y) = Y^{p^{n'-r}} -
    lambda(Lambda_q^{(r)}(Y)) gives the weaker sum bound d^{q+1} +
    p^{n'-r}; for lambda in F_p[X] the twists are trivial, Lambda_{q+1} =
    lambda^{o(q+1)}, and D and H coincide up to sign, which is the F_2 form
    recorded in CORR-20260916-8d0b81.)
    THE r = 0 VACUITY, NOW STATED FOR BOTH FORMS, WHICH THE SUPERSEDED RECORD
    DID NOT DO. r enters the derivation in exactly one place, the exponent of
    Y^{p^{n'-r}}. At r = 0 that exponent IS n', so p^{n'-r} = p^{n'} = deg L
    and the MAX FORM max(d^{q+1}, p^{n'-r}) >= deg L is VACUOUS: subfield
    polynomials (r = 0, d = 1, N = p^{n'}) are untouched, which is the
    proves-too-much control. THE N <= deg D FORM IS NOT AUTOMATICALLY VACUOUS
    AT r = 0: when d^{q+1} = p^{n'} the leading terms of Lambda_{q+1}(Y) and
    Y^{p^{n'}} can cancel, so deg D < deg L is possible and the derivation
    still constrains such objects. It is CORRECT there and was measured to be
    -- 0 violations of N <= deg D in 65832 + 7244 candidates at r = 0, and of
    the 288 candidates where the derivation is non-vacuous at r = 0 NOT ONE
    splits completely (TASK-20260917-52b4e6 section 5, quoted via
    EV-QSP-a6aa4b) -- but the record claims vacuity only for the max form and
    claims none for the deg D form. (EV-QSP-a6aa4b unresolved_confounds item
    2; DEC-20260917-793ae2 NA-4 item (f).)
    THE DEGENERATE CASE, WITH ITS CITATION CORRECTED. D = 0 requires
    d^{q+1} = p^{n'-r}, i.e. d = p^j with j(q+1) = n' - r (so j >= 1 because
    r < n'), AND Lambda_{q+1} equal to the monomial Y^{p^{n'-r}} exactly. A
    composition f o g of polynomials over a field equals a monomial Y^m only
    if g = c Y^e + b and f = c'(Y - b)^{m/e} (every root a of f forces g - a
    to have 0 as its only root, so f has one root); applied along the chain
    this forces lambda = c X^{p^j} + b, hence L = X^{p^{n'}} - c X^{p^j} - b
    = M^{p^j} with M = X^{p^{n'-j}} - c' X - b'. HERE c' = c^{p^{-j}} AND
    b' = b^{p^{-j}} REQUIRE K FINITE, NOT MERELY "OVER A FIELD": the p^{-j}-th
    root exists because Frobenius is a bijection on a finite field, which is
    true in this setting and false in the generality the superseded record
    stated. Then N_K(L) = N_K(M) <= deg M = p^{n'-j} < p^{n'}, SO THE BOUND
    FOLLOWS FROM deg M ALONE and needs no classification of M whatever.
    CITATION CORRECTED (DEC-20260917-793ae2 NA-4 item (e); EV-QSP-a6aa4b
    unresolved_confounds item 1): for b = 0, M = X^{p^{n'-j}} - c' X is of
    the linearized / multiplicative family and IS covered by Appendix C.2 of
    KN-LIT-0a321c and Proposition 6 of KN-LIT-4fe9d2; for b != 0, M is an
    affine TRINOMIAL whose root set is a COSET OF AN ADDITIVE SUBGROUP and is
    covered by NEITHER of those results, both of which are the multiplicative
    family X^{q^{n'}} - X^a. The superseded record described the whole
    degenerate family as "a p^j-th power of an affine BINOMIAL of subfield or
    multiplicative type" and cited both; that description is wrong for
    b != 0 and is not repeated. Nothing in the bound depends on the
    classification -- the degenerate case never splits completely as a SET of
    distinct roots, is excluded from the max form of (A) by hypothesis, and is
    covered separately by N_K(M) <= deg M, verified on 164 full-K degenerate
    instances plus 26 constructed ones (EV-QSP-a6aa4b observations). For d not
    a power of p the degenerate case cannot occur.
    (B) THE BETA COROLLARY, WITH n' < n STATED EXPLICITLY. Let r >= 1
    (equivalently, n' does not divide n) and suppose L splits completely in K
    as a set, N_K(L) = p^{n'}.
    FIRST, n' < n, AND THE STEP NEEDS TWO CONJUNCTS, NOT ONE.
    (i) CARDINALITY: N_K(L) counts DISTINCT roots IN K, so N_K(L) <= |K| =
    p^n, and the antecedent N_K(L) = p^{n'} therefore forces p^{n'} <= p^n,
    i.e. n' <= n.
    (ii) NON-DIVISIBILITY: (B) hypothesises that n' does NOT divide n, and
    n' = n divides n, so n' != n.
    Together, n' < n, hence q = floor(n/n') >= 1.
    CARDINALITY ALONE IS NOT ENOUGH, AND SAYING SO IS THE POINT OF THIS
    CLAUSE: n' = n with lambda = X gives L = X^{p^n} - X, whose K-roots are
    all of K, so N = p^n = p^{n'} is a COMPLETE SPLITTING at n' = n; there
    q = 1, r = 0, and n/(n + n' - r) = n/(2n) = 1/2 EXACTLY, so the strict
    inequality beta > 1/2 fails at equality. That object is excluded by (B)'s
    own non-divisibility hypothesis and by nothing else. An earlier statement
    of this step asserted that cardinality alone gives n' < n, which does not
    follow, and it is not repeated. A THIRD, EXTERNAL ROUTE to n' <= n exists
    and is recorded for a reader who wants it from outside the derivation:
    Definition 3.1 of KN-LIT-0a321c requires L | X^{q^n} - X, which forces
    deg L = p^{n'} <= p^n. (EV-QSP-a6aa4b boundaries "beta > 1/2 REQUIRES
    n' < n" and observation "ADVERSE, SCOPE"; DEC-20260917-793ae2 NA-4 item
    (b).)
    THEN THE COROLLARY. L is non-degenerate (the degenerate case has
    N < p^{n'}), so p^{n'} <= max(d^{q+1}, p^{n'-r}); since p^{n'-r} < p^{n'}
    for r >= 1 this forces d^{q+1} >= p^{n'}, i.e. (q+1) l >= n' EXACTLY.
    Since (q+1) n' = n + n' - r,
        beta = l n / n'^2 >= n / ((q+1) n') = n / (n + n' - r) > 1/2,
    for every n' with n' < n and n' not dividing n. This is the EXACT
    corollary of the max form. The proposal's conservative form, beta >=
    n (n' - 1) / (n' (n + n' - r)) (from d^{q+1} >= p^{n'} - p^{n'-r} >=
    p^{n'-1}), is implied by it and is retained as the fallback threshold that
    survives if the max form fails while the sum form d^{q+1} + p^{n'-r}
    holds. Approximate splitting: if N_K(L) >= p^{n'}/c with c < p^r then
    d^{q+1} >= p^{n'}/c and beta >= n (n' - log_p c) / (n' (n + n' - r)). At
    n = 131 (prime, so every n' in 2..130 fails to divide n and every such n'
    satisfies n' < n): beta >= 131/(131 + n' - r) >= 131/260 = 0.504 at every
    n', and >= 131/132 = 0.992 at the ten n' with 131 = -1 mod n' (n' in
    {2, 3, 4, 6, 11, 12, 22, 33, 44, 66}, r = n' - 1). The premise (4) of
    RQ-QSP-f9bbdb that 131 = -1 mod n' is the best case is inverted: it is the
    worst.
    (C) RELATION TO THE PUBLISHED BOUNDS. Lemma 4.1 of KN-LIT-0a321c
    (q l + r >= n' for a QSP) and (A) ((q+1) l >= n' for complete
    splitting) are incomparable, (A) stronger iff l < r, and combine to
    q l + min(l, r) >= n'. Theorem 1 of KN-LIT-4fe9d2 (beta >= 3/4) is for
    linearized lambda with any n'; (B) is for any lambda with n' < n and n'
    not dividing n. (A) is attained with equality on Theorem 1's equality case
    X^{p^2} + X^p + X over F_{p^3} (n = 3, n' = 2, d = p, q = r = 1:
    max(p^2, p) = p^2 = N; beta = 3/4 = 3/(3 + 2 - 1)) and on Type 2 at
    n = 7 (n' = 3, lambda = X^2 + X, d = 2, q = 2, r = 1: max(8, 4) = 8 =
    N; beta = 7/9 = 7/(7 + 3 - 1)); it is consistent with Type 2 at n = 31
    (n' = 15, d = 2^7, q = 2, r = 1: 2^21 >= 2^15) and with X^8 - X^3 over
    F_{2^4} (beta = 0.70 >= 4/(4 + 3 - 1) = 0.667). Section 5 of
    KN-LIT-0a321c asks whether Lemma 4.1 is tight and notes that removing
    the n mod n' term would show the approach cannot beat generic
    algorithms; (B) is that removal by a complementary bound, not by
    sharpening Lemma 4.1. WHAT (C) DOES NOT DO: it does not license the
    closure sentence Section 5 gestures at. Converting the bound into a
    statement about what an ALGORITHM can achieve requires a cost model and a
    LOWER bound on its solver exponent, neither of which is in this record;
    see H-QSP-542cfa.
    (D) GENERALISATIONS, PRICED. (i) lambda in K[X]: covered by (A) as
    stated (the twists change no degree). (ii) Rational lambda = a/b, a, b
    in K[X] coprime, d = max(deg a, deg b): WITHDRAWN AS STATED. The
    conjectured count of x in K satisfying x^{p^{n'}} b(x) = a(x) by
    d^{q+1} + p^{n'-r} + q d^q (the last term for points that meet a pole
    along the chain) was recorded as a conjecture with its pole bookkeeping
    unwritten; RUN-QSP-33b442-S5 section 6 records the bookkeeping as still
    unwritten and withdraws the extension AS STATED. It is not refuted and it
    is not established; rational lambda are therefore NOT covered by this
    record and remain a live survivor of the quasi-subfield line.
    (iii) Isogeny-L (Section 5 of KN-LIT-0a321c citing its [20], RECALLED,
    not read): a correspondence of bidegree (d, deg psi) between x and
    sigma^{n'} x falls under the correspondence form of (A) recorded in
    IDEA-20260916-a17f43; when it is an endomorphism relation the factor base
    is a subgroup of E(K) and on ECC2K-130 (|E(K)| = 4 * prime, KN-LIT-661e97)
    has order <= 4 or >= the prime. (iv) Double-large-prime, unsymmetrised and
    unbalanced variants change the relation bookkeeping, not the factor base;
    (A) applies unchanged. (v) (A) holds for every p and every n; the only
    escape from the max form is r = 0, i.e. n' | n.
    WHAT THIS RECORD DOES NOT CLAIM, STATED AS A CLAUSE OF THE STATEMENT SO
    NO READER HAS TO INFER IT. There is NO attack, NO exponent movement and NO
    statement about any deployed curve. No curve, group or point was
    constructed anywhere in EXP-QSP-33b442. rho on ECC2K-130 stands at 2^60.9
    iterations (KN-LIT-096), untouched. The CONDITIONAL CLOSURE READING -- the
    claim that no quasi-subfield factor base of this shape beats generic
    algorithms -- is NOT part of this record. It lives, restated and narrowed,
    in H-QSP-542cfa, and it is at status `specified` there. The QSP line is
    NOT closed: four survivors stand (n' | n; correspondence shapes of
    conjugate degree >= 2; factor bases that are not root sets of a single
    X^{p^{n'}} - lambda; and rational lambda).
  mechanism: >-
    OBJECT FRAME. Representation: the x-coordinate in F_{p^n} together with
    its Frobenius conjugates x^{p^{kn'}} (R1 class). Operation set Sigma =
    {sigma^{n'}, substitution by lambda}, the two generators of the chain
    map phi of KN-LIT-0a321c Section 3.1. Attack stage: factor-base
    membership. Trichotomy: the priced quantity is coordinate-dependent
    (Class III) -- a property of the field representation's Frobenius, not
    of any group element -- and the algorithm whose factor base it prices is
    Class I partial-action index calculus. This record prices the FIBRE; it
    prices no algorithm, because pricing an algorithm needs the cost model
    that H-QSP-542cfa carries and this record does not.
    LOSSY-PROJECTION TEST AGAINST SIGMA. The quasi-subfield algorithm's
    object is K[X]/(L), the projection of K[X]/(X^{p^n} - X) that forgets
    every root outside V. Sigma-compatible: sigma^{n'} acts on K[X]/(L) as
    phi, the identity f^{p^{n'}} = phi(f) mod L the paper proves. Lossy: it
    keeps only |V| of the p^n points. (A) says the projection is lossy in
    the wrong direction -- its K-rational content is at most
    max(d^{q+1}, p^{n'-r}) points -- unless the projection is a subfield
    (r = 0), in which case it is Diem's object and the max form is vacuous. No
    new object is proposed; the record prices the membership fibre of the
    existing one, and the successor object is IDEA-20260916-a17f43, which
    DEC-20260917-793ae2 NA-9 hands the measured ceiling as a design
    constraint: a successor shape must RAISE deg D, not find a luckier lambda.
    WHY THE PROOF IS THREE LINES AND WHY THAT IS THE POINT. Appendix A.2 of
    KN-LIT-0a321c already contains x^{p^{kn'}} = lambda^{ok}(x) for
    lambda over F_p and applies sigma^r on the RIGHT to reach a polynomial
    G of degree d^q p^r; the only additions are (i) the coefficient twist
    that makes the identity hold for lambda in K[X], and (ii) running the
    chain one step FURTHER, to k = q + 1, where (q+1) n' = n + (n' - r)
    lets x in K collapse the left side to x^{p^{n'-r}} -- tiny exactly when
    r is close to n', the regime the paper identified as the attacker's
    best case. Comparing degrees does the rest.
    WHY IT CANNOT PROVE TOO MUCH. At r = 0 the max form reads
    N <= max(d^{q+1}, p^{n'}) >= deg L and is vacuous, so subfield
    polynomials (d = 1, N = p^{n'}) are untouched; Type 1, Type 1bis and
    Type 2 all satisfy the bound with room or with equality; the
    multiplicative example satisfies it; the degenerate case is exactly the
    p^j-th powers of the affine shapes characterised above and is excluded
    from the max form rather than bounded by it. These are the
    proves-too-much controls, and they were RUN: on all 3422 triples with
    n' | n, n <= 32, d <= 29 the bound is vacuous and the vacuity is
    STRUCTURAL; of the 288 candidates where the derivation is non-vacuous at
    r = 0, not one splits completely; and on the 1032 F_2-linearized complete
    splitters at n <= 40 enumerated by Proposition 2 ALONE (no instrument of
    the experiment) there are 0 violations of (B) and 0 objects with
    3/4 <= beta < (B)'s bound -- the object that would satisfy Theorem 1 and
    refute (B) (TASK-20260917-52b4e6 section 5, quoted via EV-QSP-a6aa4b).
    WHAT THE STAGES WERE, AND THAT THEY HAVE RUN. EXP-QSP-33b442 executed
    them: Stage 0 hand re-derivation of (A) in the twisted form and the
    degenerate case; Stage 1 exhaustive F_2 fixtures at five toy cells;
    Stage 1b the seeded K-coefficient fixture; Stage 2 the complete-splitting
    sweep at prime n <= 31; Stage 3 the n = 131 census at n' in {33, 44, 66};
    Stage 4 the rational-lambda fixture; Stage 5 the report. The outcome is
    EV-QSP-a6aa4b, reviewed by TASK-20260917-34b637, TASK-20260917-52b4e6 and
    TASK-20260917-5fa7d5 and composed in DEC-20260917-793ae2. This record is
    the narrowed statement that survived that round; it is not a fresh
    prediction awaiting a run.
  assumptions:
    - >-
      d >= 1 and D != 0 (non-degenerate) for the MAX form. The degenerate
      case is fully characterised in the statement and is handled separately
      by N_K(M) <= deg M; it never splits completely as a set.
    - >-
      N_K(L) counts DISTINCT roots. When lambda' = 0 (lambda a p-th power,
      e.g. a square at p = 2) L has repeated roots; the distinct-root count
      is what bounds |F| and is what is bounded. Square lambda are reported
      separately in the census with the n' - 1 reduction noted.
    - >-
      (B) assumes r >= 1, i.e. n' does not divide n, AND derives n' < n from
      that together with the cardinality bound N_K(L) <= |K|. n' < n is a
      CONCLUSION of (B)'s hypotheses and not an extra assumption, but it is
      load-bearing and is therefore written out: without the non-divisibility
      conjunct the corollary is false at equality (n' = n, lambda = X).
    - >-
      NO COST MODEL IS ASSUMED ANYWHERE IN THIS RECORD. (A) and (B) are
      unconditional statements about the root set of a polynomial; they bound
      |F| and need no model of what an algorithm does with F. The heuristic H1
      of the superseded record H-QSP-5540d7 -- the Theorem 3.2 /
      Proposition 8 cost model -- is NOT an assumption here and is NOT
      load-bearing for any claim in this record; it belongs to H-QSP-542cfa
      and is carried in heuristic_assumptions below as a POINTER ONLY.
      Consequently agents/coordinator.md promotion gate (2) (every conditional
      dependence is a numbered heuristic with validation) has nothing to bind
      on in this record: there is no conditional dependence.
    - >-
      p = 2 in every numerical cell of EXP-QSP-33b442; the derivation is for
      every p, and the transfer from p = 2 to general p is by the derivation,
      NEVER by measurement. p != 2 evidence exists at p in {3, 5, 7} over a
      narrow range and is a REVIEW artifact of TASK-20260917-34b637, not a run
      of the experiment.
    - >-
      OFF-LIMITS COMPONENTS DECLARED: F2 (factor-base decomposition) is the
      algorithm whose factor base is priced; the Frobenius-orbit reduction
      (RQ-FROB-7d8dd4) appears only inside the quoted table rows of
      analysis/qsp-ecc2k130/table.md; F6 (endomorphism orbit) appears in
      (D)(iii) only as the reason an endomorphism-defined factor base is a
      subgroup.
  proof_search_map:
    bottleneck: >-
      Lemma 4.1's dependence on n mod n', which left the r = n' - 1 cells at
      n = 131 (131 = -1 mod n', n' in {33, 44, 66}) open with beta as low as
      0.03 on paper. Removing it moves the QSP line at prime n from 'open at
      three cells' to 'every completely splitting shape at n' not dividing n
      needs beta > 1/2'. The decision it changes: whether RQ-QSP-f9bbdb's
      decision target (a) (an existence result at n' = 33) can be pursued
      for ANY coefficient field, or is void. NOTE ON SCOPE OF THE REMOVAL:
      the bottleneck removed is the one in the BOUND. Whether beta > 1/2 in
      turn rules out an attack is a separate question with its own separate
      bottleneck (a LOWER bound on the solver exponent kappa), which this
      record does not touch and H-QSP-542cfa carries.
    baseline_embedding:
      parameter_slice: >-
        (i) Lemma 4.1 of KN-LIT-0a321c is the slice of the same chain
        identity where sigma^r is applied on the right at step q; (A) runs
        the chain to step q + 1 and applies x^{p^n} = x on the left. The two
        are incomparable and combine to q l + min(l, r) >= n'. (ii) Theorem
        1's equality case (X^{p^2} + X^p + X over F_{p^3}) and Type 2 at
        n = 7 are the tightness slices: (B) must give exactly 3/4 and 7/9
        there, and does. (iii) r = 0 is the vacuity slice FOR THE MAX FORM:
        the bound is max(d^{q+1}, p^{n'}) >= deg L. It is NOT a vacuity slice
        for the N <= deg D form, where leading terms can cancel; see the
        statement. (iv) The F_p-coefficient case is the slice verified by the
        Coordinator session in CORR-20260916-8d0b81 and numerically audited in
        analysis/qsp-ecc2k130/explore/ (analysis, not evidence).
      reproduction_check: >-
        Symbolic on (i)-(iv), zero compute, archived as the Stage 0
        derivation note of EXP-QSP-33b442; then that contract's frozen
        numerical fixtures: the exhaustive F_2 sweep at (n, n') in
        {(11, 6), (13, 7), (7, 3), (11, 4), (13, 5)} for every lambda of
        degree 2..7 (252 per cell, 1260 candidates) with brute field
        enumeration, deg gcd(X^{2^n} - X, L), and the D-root count with the
        closing test all required to agree exactly and to satisfy N <=
        max(d^{q+1}, 2^{n'-r}); the K-coefficient fixture at n = 11 (n' =
        6) and n = 13 (n' = 7), seed 20260917; and the four forced fixtures
        (subfield (12, 6, X) = 64; Type 2 at n = 7 = 8 and n = 31 = 32768;
        Theorem 1 equality X^4 + X^2 + X over F_8 = 4). ALL RAN AND ALL
        AGREED: EV-QSP-a6aa4b records M2 = 0 mismatches on 1260 candidates
        and M6 = (64, 8, 32768, 4) exactly. Read with its boundary: the
        honest count of independent determinations is TWO at Stage 1 over a
        shared primitive base and ONE at n = 131, not three.
    observation_collision:
      observable: >-
        The bound max(d^{q+1}, p^{n'-r}) on N_K(L), and the corollary
        beta >= n/(n + n' - r) for every completely splitting L with
        r >= 1 and n' < n.
      distinct_preimage_search: >-
        Two shapes with the same (n, n', d) and different N exist trivially
        (most lambda give N in {0, 1, 2}; a Type 2 lambda gives p^{n'}); the
        bound is an upper bound and does not identify N, and does not claim
        to. The collision that WOULD matter is a completely splitting L with
        r >= 1 and d^{q+1} < p^{n'} (or, for the fallback threshold, d^{q+1}
        < p^{n'} - p^{n'-r}). Stage 2 of EXP-QSP-33b442 searched every prime
        n <= 31, n' <= 15, d <= 8 over F_2 and Stage 3 searched the n = 131
        cells: NONE EXISTS AMONG THEM -- 0 in 45436 producer candidates and 0
        in roughly 294400 independent ones at p in {2,3,5,7}. The other
        informative collision is a root of D that is NOT a root of L (the
        'slack' of the bound); it is counted and reported per candidate, and
        the four n = 131 maximisers carry slack 0.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Track the full Frobenius chain x, x^{p^{n'}}, ..., x^{p^{(q+1)n'}}
          rather than x alone: the extra step past q is what makes the
          K-rationality condition a low-degree polynomial relation (degree
          p^{n'-r}) instead of a degree-p^n one.
        predicted_gain: >-
          Replaces the degree comparison of Lemma 4.1 (d^q p^r vs p^{n'}) by
          the comparison max(d^{q+1}, p^{n'-r}) vs p^{n'}, which is strong
          exactly where Lemma 4.1 is weak (r close to n').
      - transform: observable_fiber
        proposed_object: >-
          Hold N = p^{n'} fixed and vary r: the fibre is {r = 0} union
          {r >= 1, n' < n, d >= p^{n'/(q+1)}}; the separating invariant is
          divisibility n' | n.
        predicted_gain: >-
          Converts the paper's question 'does a small-d QSP exist at some
          exceptional (q, n)' into 'only at n' | n, up to the beta > 1/2
          floor'.
    quantifier_order: >-
      FORALL p, n, n' with n' not dividing n, FORALL lambda in F_{p^n}[X] of
      degree d >= 1 with D != 0: N_K(L) <= deg D <= max(d^{q+1}, p^{n'-r}).
      The polynomial D depends only on (lambda, n, n'), never on an instance
      or a seed. Consequently FORALL such L that split completely as a set
      (which forces r >= 1 and, WITH THE NON-DIVISIBILITY HYPOTHESIS,
      n' < n and q >= 1): (q+1) l >= n' and beta >= n/(n + n' - r) > 1/2.
      THE n' < n CONJUNCT IS PART OF THE QUANTIFIER AND IS WRITTEN HERE
      BECAUSE THE SUPERSEDED RECORD OMITTED IT: over all 54356 pairs (n, n')
      with n' not dividing n, n/(n + n' - r) > 1/2 holds for 18614 and FAILS
      FOR 35742, every failing pair having q = 0 and n' >= 2n, with equality
      exactly at n' = 2n (TASK-20260917-34b637, quoted via EV-QSP-a6aa4b).
      Those failing pairs are not counterexamples to (B) -- they cannot host
      a complete splitting, since N_K(L) <= |K| = p^n < p^{n'} -- but a
      reader of the bare inequality must be told that, and now is.
      The degenerate lambda (D = 0) satisfy N_K(L) <= p^{n'-j} < p^{n'} by a
      separate argument. NO CLOSURE IS CLAIMED UNDER ANY QUANTIFIER IN THIS
      RECORD. The weaker reading 'for each lambda there exists some bound' is
      not what is claimed.
    method_ceiling:
      strongest_certifiable_claim: >-
        'For every p, n, n' with n' not dividing n and every lambda in
        F_{p^n}[X] of degree d with D != 0, the number of distinct K-rational
        roots of X^{p^{n'}} - lambda(X) is at most max(d^{q+1}, p^{n'-r}); and
        every such L that splits completely in K has n' < n and beta >=
        n/(n + n' - r) > 1/2.' THAT IS THE CEILING OF THIS RECORD AND IT IS A
        STATEMENT ABOUT A ROOT SET. It cannot certify anything about n' | n,
        about factor bases that are not such root sets, about rational lambda
        ((D)(ii) withdrawn as stated), about the isogeny-L reading if [20]
        means something other than the two forms in (D)(iii), or -- and this
        is the ceiling the superseded record exceeded -- ABOUT WHETHER ANY
        ALGORITHM BEATS ANY OTHER. Converting a bound on |F| into a
        non-existence claim about attacks requires a cost model and a LOWER
        bound on its solver exponent; neither is here.
      nearby_object_control: >-
        (i) n' | n, where the conclusion is KNOWN FALSE (Diem's subfield
        family): the max form must and does become vacuous; run numerically
        as the (12, 6, X) fixture, forced 64, and in review over all 3422
        triples with n' | n, n <= 32, d <= 29. (ii) Type 2 at n = 127 (the
        nearby object of RQ-QSP-f9bbdb, where a published QSP family exists
        with beta = 1 - 2^5/63^2 = 0.992): the bound must admit it -- n' = 63,
        q = 2, r = 1, d = 2^31: d^3 = 2^93 >= 2^63, admitted, and beta =
        0.992 >= 127/(127 + 63 - 1) = 0.672, consistent; run numerically at
        the executable analogue n = 31 (Type 2 at n' = 15, forced 32768).
        (iii) n = 129 = 3 * 43: n' = 43 divides n, the subfield F_{2^43}
        exists and the max form is vacuous there, correctly; at n' = 33
        (129 = 3 * 33 + 30, r = 30) the bound bites: N <= max(d^4, 8).
        (iv) NEW, AND THE ONE THE SUPERSEDED RECORD LACKED: n' = n with
        lambda = X, where complete splitting DOES occur and beta = 1/2
        exactly. (B) must not and does not cover it, because n' = n divides n.
    proof_obligations:
      - claim: f(z)^{p^k} = f^{(k)}(z^{p^k}) for f in F_{p^n}[X] and z in the closure.
        responsibility: correctness
      - claim: x^{p^{(k+1)n'}} = Lambda_{k+1}(x) for every root x of L and every k >= 0.
        responsibility: correctness
      - claim: >-
          x in K and (q+1) n' = n + n' - r imply x^{p^{n'(q+1)}} =
          x^{p^{n'-r}}; hence every K-root of L is a root of D.
        responsibility: correctness
      - claim: >-
          deg D <= max(d^{q+1}, p^{n'-r}); D = 0 only in the degenerate case
          d = p^j, j(q+1) = n' - r, lambda = c X^{p^j} + b, where L = M^{p^j}
          with deg M = p^{n'-j} and N_K(L) <= p^{n'-j} < p^{n'}. The
          p^{-j}-th roots c', b' exist because K is FINITE.
        responsibility: size
      - claim: >-
          Complete splitting with n' not dividing n forces n' < n, by
          cardinality (N_K(L) <= p^n) TOGETHER WITH non-divisibility
          (n' != n). Neither conjunct alone suffices.
        responsibility: scope
      - claim: >-
          Complete splitting with r >= 1 and n' < n forces d^{q+1} >= p^{n'},
          hence (q+1) l >= n' and beta >= n/(n + n' - r) exactly (and a
          fortiori beta >= n (n' - 1)/(n' (n + n' - r))).
        responsibility: strictness
      - claim: The bound is attained on Theorem 1's equality case and on Type 2 at n = 7.
        responsibility: baseline
      - claim: >-
          The max form is vacuous at r = 0 and the record admits Types 1,
          1bis, 2 and the multiplicative example X^8 - X^3 over F_{2^4}. The
          N <= deg D form is NOT claimed vacuous at r = 0.
        responsibility: scope
      - claim: >-
          The rational-lambda extension (D)(ii) is WITHDRAWN AS STATED, its
          pole bookkeeping never having been written out. Nothing in this
          record covers rational lambda.
        responsibility: feasibility
