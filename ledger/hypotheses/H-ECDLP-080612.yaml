    fifty-two by 2097152. The product of the two table sizes is
    8796093022208. Their sum is 6291456. Two width-22 tables each store
    2097152, so that gap is 0 and their product is 4398046511104.
  mechanism: >-
    The proposal writes the widths 23 and 22 and the sizes 4194304 and
    2097152. This contract checks those integers. It does not add a
    curve point.
