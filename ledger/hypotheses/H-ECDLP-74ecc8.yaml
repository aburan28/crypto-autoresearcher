  statement: >
    Fix the exact quadratic residue of
    affine x of one frozen toy before
    any Gamma orbit, Semaev S_m,
    nested LHW generator, pairing,
    Miller, Tate, or unary-closure
    census is built. Stage 0 asserts
    only that on REAL p=19, A=1,
    B=-1, P=(2,3) one has [2]P=(16,11),
    chi_2(x)=2^9=18 and chi_2(x')=16^9=1,
    and that the nearby KF invariance
    claim chi_2(x')=18 is false. NULL
    empty character rejected. x=0 is
    the zero fibre, not a quadratic
    class. This is not chi_3(y)
    (1eb65c), not a pairing, not a
    rho beat. Stages 1+ stay
    unauthorized.
  mechanism: >
    IDEA-20260913-d76b38 Stage 0 hard
    gate is the exact power map
    chi_2(u)=u^{(p-1)/2}=u^9 in F_19
    at x(P) and x([2]P). Form [2]P by
    affine doubling, then raise each x
    to the ninth power. Stage 0 freezes
    that identity as exact tables. No
    Gamma orbit. No Semaev S_m. No
    nested LHW. No Miller. No Tate.
    No unary-closure census. This is a
    new GOAL-ECDLP-001 object after
    P-S0-XPLUSY. It is not Stage 1 of
    EXP-ECDLP-dab70e and not Stage 1
    of EXP-ECDLP-f883e1.
  predictions:
    - id: P-S0-CHI2X
      metric: well-defined quadratic-residue identity on frozen toys
      direction: different
      minimum_effect: >
        After fixture_pass, REAL
        chi_2(x) equals 18 and
        chi_2(x') equals 1, and KF
        invariance claim chi_2(x')=18
        is rejected. NULL empty
        character is rejected. x=0
        is rejected as the zero
        fibre. One certified miss
        after fixture_pass is a
        scoped falsification of this
        instrument at the frozen
        toys.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KF
      statement: >
        After fixture_pass, KF claim
        chi_2(x')=18 is accepted as a
        generic doubling-character
        target. An encoding bug is
        failed_infrastructure.
    - id: F-S0-REAL
      statement: >
        After fixture_pass, REAL
        fails to match chi_2(x)=18 or
        chi_2(x')=1. That falsifies
        only P-S0-CHI2X at the frozen
        toy.
  test_boundary:
    instances:
      - frozen Stage 0 REAL / KF / NULL panel
    parameters:
      real_curve:
        p: 19
        A: 1
        B: -1
        P: [2, 3]
        P2: [16, 11]
        must_chi: 18
        must_chi_prime: 1
