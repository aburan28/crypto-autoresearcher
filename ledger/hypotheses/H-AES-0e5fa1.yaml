hypothesis:
  id: H-AES-0e5fa1
  question_id: RQ-AES-001

  statement: >-
    SCOPE: the F-LINEAR ROUND-INDEPENDENT PER-WORD PROJECTION CLASS of
    TASK-20260801-806 section 2, over F = GF(2^8) with q = 256, across ONE AES
    super-box interface Phi = ARK . MC . SR, plus a GF(2^4) analogue for the
    composition leg. CLAIM TIER toy. NO ATTACK, NO DISTINGUISHER, NO KEY
    RECOVERY, NO CLAIM ABOUT AES AT ANY ROUND COUNT, NO EXPONENT.
    Let pi : F^4 -> X = F^4/K be F-linear with 0 < dim K < 4, let
    S = { i : proj_i(K) != 0 }, s = |S|, and let W_S be the F-span of the
    MixColumns columns { m_i : i in S }. Define the CONFINEMENT TRANSLATION SET
      T_pi = { t in F^4 : pi(z + t) - pi(z) lies in pi(W_S) for every z in F^4 }.
    THE HYPOTHESIS IS THREEFOLD.
    (A) EXISTENCE. T_pi contains the subgroup W_S + K, so the bounded-index
        subgroup of translations that TASK-20260801-806 section 3.3 route 2
        names as a possible repair of PROP-701-I's Step-3 group closure EXISTS
        unconditionally in this class -- answering, in the affirmative and in
        closed form, a question that report leaves as "a genuine open question
        and is not answered here".
    (B) THE FORCED IDENTITY. With iota = [F^4 : W_S + K] = q^(4 - dim(W_S + K))
        and B = q^(s - dim(W_S int K)) -- Proposition 806-1's own per-word
        branching -- the two satisfy
          iota * B = q^(4 - dim K) = |X| = 2^(32 - L),  L = 8 dim K,
        EXACTLY, for every admissible K, with no tolerance and no fitted
        parameter.
    (C) THE CONSEQUENCE, WHICH IS THE WHOLE POINT. Because the product is
        pinned, "index bounded by a function of B alone, uniformly in the state
        space" is EQUIVALENT to "B is within that function of |X|", i.e. to
        Corollary 806-2's yield Y = log_2|X| - log_2 B being bounded by the
        logarithm of that function. Route 2 is therefore NOT an independent
        repair of the induction; it is Corollary 806-2 restated in the dual
        variable. Generically iota = 1 -- the subgroup is the whole translation
        group -- so route 2's statement is TRUE AND VACUOUS on almost every
        kernel, and where it is non-vacuous B is correspondingly small and the
        index is not bounded in B.
    IF (B) FAILS AT ANY KERNEL the hypothesis is refuted outright and (C) is
    withdrawn. IF (C)'s reading of "bounded index" is not the Coordinator's
    intended reading, (A) and (B) stand and (C) is restated. THE DELIVERABLE ON
    THE PREDICTED OUTCOME IS A SCOPED BARRIER STATEMENT WITH AN ARCHIVED
    DERIVATION AND NAMED FORWARD GUIDANCE -- GOAL-AES-001's second completion
    horn -- NOT A CLOSURE OF THE CAMPAIGN AND NOT A CLAIM ABOUT AES.

  mechanism: >-
    DERIVED IN-REPO from committed artifacts only. No external source is used and
    none is needed. Every ingredient is either proved here or quoted from a
    committed file whose path is given.

    SETUP AND NOTATION. F = GF(2^8), q = 256. Phi = ARK . MC . SR is the AES
    super-box interface. M is the MixColumns matrix, invertible (MDS), with
    columns m_0..m_3. pi : F^4 -> X = F^4/K is F-linear, applied
    round-independently to every super-box word, with 0 < dim K < 4; this is
    verbatim the object of TASK-20260801-806 section 2 (committed in snapshot
    cc660597e3bcc616521bce443b9a17eafa4393c2). L = 32 - log_2|X| = 8 dim K.
    S = { i : proj_i(K) != 0 }, s = |S|, W_S = span_F{ m_i : i in S }.

    LEMMA 1 (columns) -- ONE JOB: dim W_S = s. The m_i are columns of an
    invertible matrix, hence F-linearly independent, hence any s of them span an
    s-dimensional space. RESPONSIBILITY: correctness. Cost: nil. This is
    recomputed rather than assumed in stage 1.

    LEMMA 2 (the confining set is a coset of a FIXED subspace) -- ONE JOB:
    identify R_j(x). This is TASK-20260801-806's LEM-806-2, EMBEDDED not
    re-proved: at a fixed input pi-profile x, the reachable perturbation set of
    the pre-MixColumns vector y^(j) is exactly prod_i proj_i(K) = F^S, and
    MixColumns carries F^S onto W_S; ARK contributes a translation only. Hence
    R_j(x) = pi(c(x) + W_S) with c(x) depending on x and on the round key, and
    the SUBSPACE pi(W_S) is independent of x. RESPONSIBILITY: interface. The
    TASK-20260801-809 validator worked all four lemmas from its own arithmetic
    and reproduced the minimum exhaustively over 78,899 GF(2^4) subspaces and
    527 GF(2^2) subspaces (goal record, BATCH-004 check_a verdict), which is why
    this hypothesis embeds rather than re-litigates it. Stage 1 re-derives it
    independently anyway, because an embedded lemma that nobody re-checks is how
    a wrong step propagates.

    LEMMA 3 (size) -- ONE JOB: recover Proposition 806-1's B.
    |R_j(x)| = |pi(W_S)| = q^(dim W_S - dim(W_S int K)) = q^(s - dim(W_S int K))
    by Lemma 1. This is exactly Proposition 806-1's B, so the hypothesis
    REPRODUCES the committed baseline rather than competing with it.
    RESPONSIBILITY: baseline.

    LEMMA 4 (the dual object is a subgroup) -- ONE JOB: prove (A). Because
    R_j(x) is a coset of the FIXED subspace pi(W_S), "the two outputs lie in a
    common R_j-set" is exactly "their difference lies in pi(W_S)". Pulling back
    through pi, the set of state translations t with pi(z + t) - pi(z) in
    pi(W_S) for all z is pi^{-1}(pi(W_S)) = W_S + K, a subgroup of (F^4, +) of
    index iota = q^(4 - dim(W_S + K)). RESPONSIBILITY: correctness.

    ASSEMBLY (the forced identity) -- ONE JOB: prove (B).
    dim(W_S + K) = dim W_S + dim K - dim(W_S int K) = s + dim K - dim(W_S int K).
    Hence log_q iota = 4 - s - dim K + dim(W_S int K) and
    log_q B = s - dim(W_S int K), so log_q iota + log_q B = 4 - dim K, i.e.
    iota * B = q^(4 - dim K) = |X|. RESPONSIBILITY: correctness. The identity is
    parameter-free, derived before any run, and refuted by a single kernel with a
    nonzero residual.

    THE TWO END WITNESSES, DERIVED BEFORE ANY RUN AND USED AS THE INSTRUMENT'S
    DISCRIMINATING PAIR. At K = ker(M + I) = span(1,1,1,1) -- RT-1's kernel --
    every coordinate is nonzero so s = 4, W_S = F^4, dim(W_S int K) = 1, giving
    log_q B = 3 (B = 2^24) and log_q iota = 0 (iota = 1). At K = span(e_0),
    s = 1, W_S = span(m_0), and m_0 = (2,1,1,3)^T is not a scalar multiple of
    e_0 so dim(W_S int K) = 0, giving log_q B = 1 (B = q = 256, Proposition
    806-1's tight minimum) and log_q iota = 2 (iota = 2^16). The two witnesses
    sit at opposite ends of the identity and exhibit nonzero spread in BOTH
    coordinates, which is what makes the census an instrument rather than a
    decoration.

    STATEMENT (C) IN FULL, WITH BOTH HORNS EXPOSED. A repair of PROP-701-I's
    Step 3 needs the confinement relation to contain a subgroup whose index is
    bounded by g(B) for some function g, UNIFORMLY IN THE STATE SPACE, so that
    the induction's error does not grow with the object. By the Assembly,
    iota = |X| / B. Bounding iota <= g(B) is bounding |X| <= B g(B), i.e.
    Y = log_2|X| - log_2 B <= log_2 g(B): the yield is capped by log g, and the
    object carries at most that many bits across the interface. HORN (i):
    iota is small -- generically 1, since a kernel whose spanning vectors have
    all coordinates nonzero has s = 4 and W_S = F^4 -- so the subgroup is the
    WHOLE translation group, the statement is true and confines nothing, and no
    induction can be driven by it. HORN (ii): iota is large, so B = |X|/iota is
    small and the object is informative, but then iota is not bounded by any
    function of B independent of |X| and Step 3's group closure still fails.
    There is no third regime because the product is pinned. THAT IS THE BARRIER.

    WHAT IS NOT DERIVED, AND IS THE WEAKEST LINK. Everything above is ONE
    INTERFACE and F-LINEAR. The composed confinement translation set across n
    interfaces is NOT determined by the identity. RT-3 horn (b) says that if a
    nonlinear layer sits between interfaces then pi . SB is not F-linear and
    Lemma 4's pullback need not be a subgroup at all -- in which case route 2's
    premise fails for a reason this hypothesis does not analyse, and the identity
    says nothing about it. That gap is the reason the composition leg is a
    MEASUREMENT in the GF(2^4) analogue rather than a theorem, and the reason
    nothing here may be carried past one interface. DEC-20260731-029 already
    forbids carrying Proposition 806-1 beyond one interface; this hypothesis
    inherits that restriction deliberately and does not seek relief from it.

  assumptions:
  - >-
    LEM-806-2 IS EMBEDDED AS COMMITTED. If c(x) can change the SUBSPACE rather
    than only the translate -- i.e. if R_j(x) is not a coset of a single fixed
    pi(W_S) -- then Lemma 4 collapses and with it (A), (B) and (C). This is the
    single load-bearing import and it is named first rather than buried. Stage 1
    re-derives it independently; a disagreement STOPS the line and is routed to a
    correction record rather than absorbed.
  - >-
    dim W_S = s, from invertibility of M. Recomputed in stage 1 at every census
    kernel and reported as a per-kernel check, never assumed globally.
  - >-
    "BOUNDED INDEX" IN ROUTE 2 MEANS BOUNDED BY A FUNCTION OF B ALONE, UNIFORMLY
    IN THE STATE SPACE. If the intended reading is weaker -- e.g. bounded at a
    fixed |X| -- (A) and (B) survive unchanged and (C) does not follow. The
    reading is stated here BEFORE any evaluation and may not be changed after a
    result is seen; changing it would require a versioned amendment, exactly as
    EV-IC-002 records a lane retracting a verdict for revising a criterion after
    observing the prior one fail.
  - >-
    THE GF(2^4) ANALOGUE IS AN ANALOGUE. Its MixColumns is a different matrix
    over a different field, and the goal record already records that the GF(2^2)
    analogue is additionally NOT MDS. A composition law measured there is a fact
    about the analogue and transfers only as a stated heuristic, never as a fact
    about GF(2^8).
  - >-
    NUMPY IS PRESENT IN THIS CONTAINER (measured 2.4.6 this session), contrary to
    GOAL-AES-001's committed next_action, which declares it absent. The GF(2^8)
    census depends on that. If numpy is absent in the dispatch environment, the
    GF(2^8) legs are reported as INFRASTRUCTURE SIGNAL with their reached
    coverage stated and the GF(2^4) legs run instead -- never as a negative
    mathematical result (AGENTS.md rule 5). See IDEA-20260805-78d9bd.

  proof_search_map:
    bottleneck: >-
      TASK-20260801-806 section 3.3 route 2 -- "a bounded-index subgroup
      statement replacing the group closure" -- which the report leaves as "a
      genuine open question and is not answered here" and which
      DEC-20260731-030's next_action RANKS FIRST for BATCH-005 on the ground
      that it is the campaign's only exponent-relevant forward-looking item, is
      explicitly open and never attempted by anyone, and is the type-stable
      invariant a repair of the induction would need. If the index is pinned to
      |X|/B then no repair can come from this route, and every downstream effort
      to construct one is misdirected regardless of how well executed.
    baseline_embedding:
      parameter_slice: >-
        B = 1 (dim K such that s = dim(W_S int K), i.e. the branching is
        trivial) recovers PROP-701-I's hypothesis exactly: confinement becomes
        equality, T_pi is the full preimage of 0, and the group closure of Step 3
        runs. Setting iota = 1 recovers the trivial statement that the whole
        translation group confines. Both degenerate slices must come out of the
        formulas without special-casing.
      reproduction_check: >-
        SYMBOLIC AND EXACT, AND IT IS THE EMBEDDING RATHER THAN A RESEMBLANCE.
        Lemma 3 must return Proposition 806-1's B = q^(s - dim(W_S int K))
        verbatim, and the identity must return log_q iota = 0 at
        K = ker(M + I) with log_q B = 3, and log_q iota = 2 at K = span(e_0)
        with log_q B = 1. These are exact integer identities against a committed
        proposition, not a curve that looks similar. IF LEMMA 3 DOES NOT
        REPRODUCE PROPOSITION 806-1 THE HYPOTHESIS IS BUILDING ON A DIFFERENT
        OBJECT AND MUST STOP.
    observation_collision:
      observable: >-
        The integer pair (log_q B, log_q iota), and its measurable dual, the
        subgroup W_S + K itself.
      distinct_preimage_search: >-
        A COLLISION EXISTS, IS EXHIBITED RATHER THAN CONJECTURED, AND IS PART OF
        THE FINDING. The pair (3, 0) is attained by K = ker(M + I) =
        span(1,1,1,1), by K = span(m_0), and by every dim-1 kernel whose
        spanning vector has all four coordinates nonzero -- structurally
        different objects sharing the observable. So the pair does NOT identify
        K, and any argument that treats it as an intrinsic label of the
        projection is unsound. MORE SHARPLY, AND THIS IS THE CENTRAL COLLISION:
        the two coordinates of the pair are not independent -- the Assembly pins
        their sum -- so the observable carries ONE degree of freedom, not two,
        and a repair hoping to bound iota independently of B was hoping to bound
        the second coordinate of a one-dimensional object.
    constructive_transforms:
    - transform: observable_fiber
      proposed_object: >-
        Hold the observable (log_q B, log_q iota) fixed and vary the forgotten
        structure (K, and then M itself). If an intrinsic invariant separating
        the resulting objects exists inside the argument, name it; if not, the
        argument cannot depend on it.
      predicted_gain: >-
        None to any attack. The gain is a named obstruction: route 2 cannot
        distinguish objects the induction would need to distinguish, so it
        cannot drive the induction. This is the transform that produces the
        barrier statement.
    - transform: representation_reduction
      proposed_object: >-
        Replace the branching-size variable B by the index variable iota
        throughout Corollary 806-2, giving L + log_2|X| - log_2 iota <= 24 in
        place of L + Y <= 24. If the two statements are inter-derivable, the
        change of variable is exactly that and route 2 is Corollary 806-2 in
        disguise.
      predicted_gain: >-
        Makes the equivalence in (C) explicit and checkable by a reviewer in one
        substitution rather than by argument.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER: FOR ALL admissible kernels K (0 < dim K < 4),
      THERE EXISTS a subgroup of translations contained in the confinement
      relation, NAMELY W_S + K, whose index satisfies iota * B = |X|. The
      witness subgroup is ALLOWED to depend on K -- it is constructed from K and
      M -- and the identity is uniform in K. THE STRONGER ORDER IS NOT CLAIMED:
      there is no single subgroup working for all K, and no claim that the index
      is bounded uniformly in |X|. THE QUANTIFIER TRAP THIS AUDIT IS HUNTING is
      in route 2 itself: a repair needs a bound on iota that is uniform in the
      STATE SPACE while being allowed to depend on B, and the identity shows
      that any such bound is a bound on |X| -- so the hoped-for uniform
      conclusion requires a witness whose behaviour depends on the very
      parameter it must be uniform in. That is the collision, stated as a
      quantifier fact rather than as an intuition.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that in the F-LINEAR ROUND-INDEPENDENT class, at ONE super-box
        interface, over GF(2^8), the confinement translation set contains
        W_S + K with index exactly |X|/B, so route 2 supplies no repair
        independent of Corollary 806-2. IT CANNOT CERTIFY that PROP-701-I is
        unrepairable, that no type-stable invariant exists, that route 1 (a
        composing metric) fails, that non-linear pi behave the same way, or
        anything whatsoever about AES at any round count. Writing it up as if it
        could would be the premature-closure failure mode, which
        docs/inventor-protocol.md treats as symmetric with overclaiming.
      nearby_object_control: >-
        THE NEARBY OBJECT ON WHICH THE HOPED-FOR CONCLUSION IS KNOWN TO HOLD is
        the B = 1 case: PROP-701-I's own hypothesis, where confinement IS
        equality, the confinement relation IS an equivalence, Step 3's group
        closure DOES run, and the induction DOES close. A method that cannot
        separate B = 1 from B >= 2 has not identified the load-bearing
        structure, and running the identity at both is a REQUIRED ARM. The
        identity does separate them -- at B = 1, iota = |X| and the subgroup is
        as small as it can be while still confining, which is the informative
        extreme -- and demonstrating that separation is what licenses the
        barrier. A SECOND nearby object, also required: a uniformly random
        invertible mixing matrix M' in place of AES's M. The identity MUST still
        hold there, because its proof never uses MDS or any AES-specific
        structure. That is a limitation of the result and is declared here
        rather than discovered by a reviewer: this argument does not distinguish
        AES from any invertible linear mixing layer, and no citation of it may
        suggest otherwise.
    proof_obligations:
    - claim: dim W_S = s for every admissible S, from invertibility of M.
      responsibility: correctness
    - claim: >-
        R_j(x) is a coset of the fixed subspace pi(W_S) (LEM-806-2, embedded and
        independently re-derived, not assumed).
      responsibility: interface
    - claim: T_pi contains W_S + K, a subgroup, of index q^(4 - dim(W_S + K)).
      responsibility: correctness
    - claim: iota * B = q^(4 - dim K) exactly, for every admissible K.
      responsibility: correctness
    - claim: >-
        Lemma 3 reproduces Proposition 806-1's B verbatim, so the hypothesis
        embeds rather than replaces the committed baseline.
      responsibility: baseline
    - claim: >-
        The conclusion is scoped to one interface, the F-linear class, and
        GF(2^8) with a GF(2^4) analogue leg, and closes route 2 only -- routes 1
        and 3 remain open and are named.
      responsibility: scope
    - claim: >-
        The identity holds for a random invertible mixing matrix too, so nothing
        here is AES-specific.
      responsibility: strictness
    not_applicable_reason: null

  structural_ingredients:
  - description: >-
      LEM-806-2's characterisation of the reachable perturbation set as F^S and
      of MixColumns carrying it onto W_S.
    citation: >-
      coordination/goals/GOAL-AES-001/batches/BATCH-004/tasks/TASK-20260801-806/od4_branching_bound_report.md
      section 4.2, committed in snapshot cc660597e3bcc616521bce443b9a17eafa4393c2
      and independently re-derived by the TASK-20260801-809 validator per the
      GOAL-AES-001 BATCH-004 check_a verdict. READ IN FULL for this record.
    role: identifies the confining set as a coset of a fixed subspace
  - description: >-
      Proposition 806-1's B = q^(s - dim(W_S int K)) for the F-linear
      round-independent class.
    citation: >-
      Same report, section 4.1. READ IN FULL. Note that DEC-20260731-029 permits
      citing it at ONE interface only, for the F-linear subclass, never as a
      cost inequality and never with U-809-1 dropped; that restriction is
      inherited here in full and U-809-1 (the unrestricted state quantifier
      inherited via LEM-806-2) is carried, not dropped.
    role: supplies the branching side of the identity
  - description: >-
      The dimension formula dim(A + B) = dim A + dim B - dim(A int B) over a
      field.
    citation: Elementary; derived in this record. No external source is claimed.
    role: converts the two subspace dimensions into the forced identity
  - description: >-
      RT-1's identification of ker(M + I) = span(1,1,1,1) as the kernel at which
      the joint branching drops.
    citation: >-
      coordination/goals/GOAL-AES-001/batches/BATCH-004/tasks/TASK-20260801-810/redteam_findings.yaml
      RT-1, and redteam_report.md section 8. READ IN FULL. Its J = 2^24 is a
      JOINT branching over four words and MUST NOT be conflated with this
      hypothesis's per-word B, which also equals 2^24 at that kernel by a
      different route; the two are reported separately.
    role: supplies one of the two end witnesses

  reduction_chain:
    core_problem: >-
      Decide whether TASK-20260801-806 section 3.3 route 2 supplies a repair of
      PROP-701-I's induction that is independent of Corollary 806-2, in the
      F-linear round-independent per-word projection class at one AES super-box
      interface.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. There is no reduction from this object to any
      statement about AES, about any round count, about any attack cost, or
      about any exponent. Route 1 (a composing metric on X with subadditive
      degradation) and route 3 (argue at one interface, which is what Proposition
      806-1 already does) are UNTOUCHED by this hypothesis and are named as the
      open successors. Nothing here bears on PROP-701-I's status, on Proposition
      801-1, or on the withheld scoped closure of the round-independent
      single-word deterministic class -- which DEC-20260731-030 forbids
      considering until a control ISOLATES the ingredient it negates (V-804-1,
      undischarged for three consecutive batches), a constraint this hypothesis
      does not seek relief from and does not satisfy.

  heuristic_assumptions:
  - id: HEUR-0E5-1
    formal_statement: >-
      NONE LOAD-BEARING FOR (A) OR (B). The identity iota * B = q^(4 - dim K) is
      an exact consequence of the dimension formula together with dim W_S = s,
      and is proved rather than assumed. This entry records that the headline is
      UNCONDITIONAL, in deliberate contrast with TASK-20260801-806 section 5,
      which DEC-20260731-029 struck as unusable.
    random_model_justification: >-
      Not applicable: the statement is an algebraic identity, not a
      distributional claim, so no random model is invoked and none is needed.
      Recorded explicitly rather than left blank.
    supporting_results: []
    validation_experiment_ids: [EXP-AES-f4c746]
    falsification_condition: >-
      Any kernel K with log_q iota + log_q B != 4 - dim K. Exact integer
      comparison, zero tolerance, one counterexample suffices.
  - id: HEUR-0E5-2
    formal_statement: >-
      COMPOSITION HEURISTIC, LOAD-BEARING ONLY FOR THE MULTI-INTERFACE LEG AND
      NOWHERE IN (A), (B) OR (C). In the M-affine composition model the composed
      confinement translation set across n interfaces contains the intersection
      of the per-interface sets pulled back through the intervening maps, so
      iota^(n) <= iota^n.
    random_model_justification: >-
      Immediate for affine composition: the preimage of a subgroup under a group
      homomorphism is a subgroup, and the index of an intersection is at most the
      product of the indices. NOT SUPPORTED for the M-nonlinear model, where
      pi . SB is not F-linear and the pullback need not be a subgroup at all.
      That gap is RT-3 horn (b), it is MAJOR and DEMONSTRATED against the
      committed package, and it is carried here rather than assumed away.
    supporting_results: []
    validation_experiment_ids: [EXP-AES-f4c746]
    falsification_condition: >-
      Any n with iota^(n) > iota^n in the M-affine model, or any disagreement
      between the M-affine and M-nonlinear models at n = 2. Either outcome
      confines the identity to exactly one interface, which must then be said in
      every citation of it.
  - id: HEUR-0E5-3
    formal_statement: >-
      GENERIC-INDEX HEURISTIC. For dim K = 1, the fraction of kernels with
      iota = 1 is 1 - (1 - (255/256)^4) = (255/256)^4, approximately 0.9845.
    random_model_justification: >-
      Derived, not assumed: iota = 1 iff W_S + K = F^4, and for dim K = 1 a
      spanning vector with all four coordinates nonzero already gives s = 4 and
      W_S = F^4 by Lemma 1. The probability that a uniform nonzero vector in F^4
      has a zero coordinate is 1 - (255/256)^4. This is a counting statement
      about the kernel population, not a claim about AES.
    supporting_results: []
    validation_experiment_ids: [EXP-AES-f4c746]
    falsification_condition: >-
      A measured fraction below 0.95 over a seeded census of at least 10^4 dim-1
      kernels. That would mean S is not being derived from K as Lemma 2 says and
      the whole mechanism must be rechecked.

  predictions:
  - metric: >-
      G1 -- identity residual: max over the whole tested census of
      | log_q iota(K) + log_q B(K) - (4 - dim K) |, from independently
      recomputed subspace dimensions over GF(2^8)
    direction: lower
    minimum_effect: >-
      EXACTLY 0, with no tolerance, at every kernel. This is an integer
      identity, not a fit; a tolerance band here would make the gate vacuous in
      exactly the way EXP-SDEG's G2 records for a different lane.
  - metric: >-
      G2 -- end witness A: (log_q B, log_q iota) at K = ker(M + I) =
      span(1,1,1,1) over GF(2^8)
    direction: different
    minimum_effect: >-
      EXACTLY (3, 0). FORCED BEFORE ANY RUN. Report the per-word B and RT-1's
      joint J SEPARATELY; both equal 2^24 at this kernel by different routes and
      conflating them would manufacture a false corroboration.
  - metric: >-
      G3 -- end witness B: (log_q B, log_q iota) at K = span(e_0)
    direction: different
    minimum_effect: >-
      EXACTLY (1, 2). FORCED BEFORE ANY RUN. Together with G2 this exhibits
      nonzero spread in both coordinates and so demonstrates the instrument can
      move -- without which no negative may be reported.
  - metric: >-
      G4 -- baseline reproduction: whether Lemma 3's computed B equals
      Proposition 806-1's q^(s - dim(W_S int K)) at every census kernel
    direction: different
    minimum_effect: >-
      1.000, all kernels. A single disagreement means this hypothesis is
