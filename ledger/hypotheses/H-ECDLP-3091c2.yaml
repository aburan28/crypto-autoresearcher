  proof_search_map:
    bottleneck: >-
      Whether the two-free-digit-block residual over F_p admits a
      low-degree inverse (BOUNDED) or is generic (FULL) for plain Macaulay.
    baseline_embedding:
      parameter_slice: >-
        Easy unit f=c+a_0 must read deg(g)=1; S_3 must vanish on checked
        sums on the tiny curve p=19; sigma=1 analogue is the null FULL.
      reproduction_check: >-
        Independent check.py recomputes dual S_3 on a probe triple and
        dual Möbius degree on the n=8 easy control.
    observation_collision:
      observable: deg(f^{-1}) per unsatisfiable residual vs n
      distinct_preimage_search: >-
        Low degree could be (i) digit-S_3 structure, (ii) degenerate nearly
        constant f (value-spectrum filter |{f}|<4 drops), (iii) small-p
        Schwartz-Zippel exception (null calibration). Dual-route mismatch
        is an artifact, not a slope.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "run a Groebner engine" by deg(f^{-1}) via dual Möbius
          on the cube (identity D_ref^M = 4 + deg(g) for units).
        predicted_gain: Solver-free exact degree ladder at s≤6.
    quantifier_order: >-
      Exact: FORALL units f, 1∈M_D iff deg(f^{-1})≤D-4. Empirical: FOR
      cells s∈{4,5,6} with the frozen p-rule and 20 unsat draws, the
      deg distribution is as measured. NOT CLAIMED: s>6; W_D; any ECDLP cost.
    method_ceiling:
      strongest_certifiable_claim: >-
        At the named cells, dual-agreed deg(f^{-1}) distributions versus
        the null, plus the easy-control and S_3 identity. Nothing about
        F4, cvc5, s>6, or any deployed curve.
      nearby_object_control: >-
        Same-support null (FULL predicted); easy unit (deg=1 must hold);
        planted zeros (no inverse; counted as sat, never refuted).
    proof_obligations:
      - claim: Dual Möbius routes agree on every counted inverse.
        responsibility: baseline
      - claim: S_3 vanishes on checked Weierstrass sums (tiny curve).
        responsibility: correctness
      - claim: Easy control deg(g)=1.
        responsibility: baseline
      - claim: FULL/HALF/BOUNDED decided by frozen fractions on 20 unsat draws.
        responsibility: success_probability
      - claim: Nothing asserted at n≥131 or as an ECDLP exponent.
        responsibility: scope
    not_applicable_reason: null

