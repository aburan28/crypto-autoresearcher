  specified_at: '2026-10-03'
  approved_at: '2026-10-03'
  authorised_by: DEC-20261003-2cf084
  status: approved
  proposed_by: coordinator
  title: >-
    At s∈{4,5,6}, is deg(f^{-1}) of the unsatisfiable digit-S_3 residual over
    F_p equal to n=2s on ≥90% of instances (FULL), or does a HALF/BOUNDED
    slope appear, under dual Möbius meters?

  statement: >-
    CLAIM (exact_refutation_degree_instrument; NO ATTACK; NO EXPONENT).
    Let s∈{4,5,6}, n=2s, p the least prime above 2^{3s+1}, E: y^2=x^3+x+1
    over F_p. For u in F_p let f(a,b)=S_3(l(a),l(b),u) as an F_p-valued
    function on {0,1}^n. On unsatisfiable f (no Boolean zero), D_ref^M(f)
    = 4 + deg(f^{-1}) exactly in the Boolean function ring, and deg(f^{-1})
    is read by dual Möbius/ANF meters. FORALL authorized Stage-1 cells,
    either (FULL) deg(f^{-1})=n on ≥90% of 20 unsatisfiable draws, or
    (HALF) deg≤s+2 on ≥50% at s∈{5,6}, or (BOUNDED) deg≤2 on ≥90%, or
    mixed/inconclusive/artifact as labelled. Same-support null predicted
    FULL. Easy control f=c+a_0 has deg(g)=1. NO break. NO n≥131 transfer.
    Stage 2 mutant rung W_D is NOT authorized.

  mechanism: >-
    OBJECT FRAME. Representation R1 (base-2 digit coordinates of two legs).
    Tracked object: deg(f^{-1}) of the two-free-block Semaev residual over
    F_p. Dual meters: in-place subset Möbius vs naive inclusion-exclusion.
    Why binary and prime-field objects should differ: over F_{2^n} Weil
    descent yields n generators; here one principal residual, so plain
    Macaulay wins only if the pointwise inverse is low-degree. OFF-LIMITS:
    Stage-2 W_D mutant closure; cvc5; any ECDLP solve; Magma/Sage/AUXIN.

  predictions:
    - metric: deg(f^{-1}) on unsatisfiable inner residuals
      direction: different
      minimum_effect: >-
        FULL iff deg=n on ≥90% at every Stage-1 cell (honest prior ~0.8);
        HALF iff deg≤s+2 on ≥50% at s∈{5,6}; BOUNDED iff deg≤2 on ≥90%.
    - metric: null deg(f^{-1})
      direction: same
      minimum_effect: deg=n on ≥90% of same-support null draws per cell
    - metric: easy-control deg(g) for f=c+a_0
      direction: same
      minimum_effect: exactly 1 on both Möbius routes
    - metric: twin_agreement
      direction: same
      minimum_effect: Möbius-fast degree equals Möbius-naive degree

  test_boundary:
    instances:
      - 'Stage 0: freeze cells with integer n=2s, p(s), S_3 vs addition, easy control, column counts'
      - 'Stage 1 authorized: s∈{4,5,6} with 20 unsat / 8 sat / 10 null / 5 easy per cell'
    parameters:
      cells:
        - {n: 8, s: 4}
        - {n: 10, s: 5}
        - {n: 12, s: 6}
      curve_A: 1
      curve_B: 1
      stream_seed: 202610038184
    implementation: >-
      Pure Python under experiments/EXP-ECDLP-3abd24/implementation/;
      command surface implementation/run.py driven by trial-plan.json
      (byte-identical to trial-plan-v1.json). Dual meters in mobius_fp.py
      and fp_semaev.py. No Magma/Sage/AUXIN/Bedrock.
    budget:
      wall_clock_seconds: 7200
      memory_gb: 2
      maximum_runs: 4

  falsification_conditions:
    - Dual Möbius degrees disagree on any counted instance (O-ARTIFACT).
    - Easy control does not read deg(g)=1 (instrument void).
    - S_3 dual expansions disagree, or S_3 fails to vanish on a checked sum.
    - Null deg(g)<n on >10% of draws at any cell (calibration void).
    - Claiming an ECDLP exponent or n≥131 transfer from this toy ladder.
    - Opening Stage-2 W_D under this card.

  distinguishable_outcomes:
    - id: O-FULL
      meaning: >-
        Dual OK; easy OK; null FULL; deg(g)=n on ≥90% unsat at every cell.
        Prime-field two-leg residual looks generic for plain Macaulay.
    - id: O-HALF
      meaning: Dual OK; structural slope deg≤s+2 on ≥50% at s∈{5,6}; not FULL.
    - id: O-BOUNDED
      meaning: Dual OK; deg≤2 on ≥90% unsat — the only reading that would make
        plain Macaulay a poly-time inner oracle at these cells.
    - id: O-MIXED
      meaning: Cells disagree on FULL/HALF/BOUNDED after controls pass.
    - id: O-INCONCLUSIVE
      meaning: Shortfall of unsat draws below the frozen 20.
    - id: O-ARTIFACT
      meaning: Twin disagreement, easy-control fail, S_3 identity fail, or null calibration fail.
    - id: O-IMPEDIMENT
      meaning: Missing Stage-0 freeze / timeout / crash. Never negative evidence.
    - id: O-STAGE0-OK
      meaning: Stage-0 freeze completed with identity and easy-control pass.

  interpretation_limits:
    - Toy s≤6, p≤2^19-scale. Nothing about deployed prime-field curves.
    - Exact instrument bounds plain Macaulay only; Stage-2 W_D not authorized.
    - No exponent is claimed. FULL is the expected obstruction, not a break.
    - Synthetic u-stream (PCG64) is the authorized inner-target generator
      under this card; a curve-and-base sampler is a successor, not this EXP.
    - Interval factor-base membership remains in KN-OPEN-020's implicit class.

  heuristic_assumptions:
    - id: HEUR-ECDLP-ba8184-H1
      formal_statement: >-
        For f drawn with uniform F_p coefficients on the cube and no Boolean
        zero, deg(f^{-1})=n with probability ≥ 1 - c n/p (null genericity).
      random_model_justification: >-
        Top ANF coefficient of f^{-1} is a nonzero rational function of the
        values (easy unit 1+|x| has top coefficient ±1/(n+1)). Schwartz-Zippel
        is recalled, not opened; the null's measured FULL fraction is the
        calibration, not the bound.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-3abd24
      falsification_condition: >-
        Null deg(g)<n on more than 10% of draws at any Stage-1 cell.
    - id: HEUR-ECDLP-ba8184-H2
      formal_statement: >-
        Unsatisfiable digit-S_3 residuals behave like the same-support null
        for deg(f^{-1}) at s∈{4,5,6} (FULL). Expected true; BOUNDED is the
        exponent-bearing alternative and is expected false.
      random_model_justification: >-
        One principal generator over F_p, unlike n descended generators over
        F_{2^n} (KN-FIND-c3a917). No classical theorem claimed; this is the
        hypothesis under test.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-3abd24
      falsification_condition: >-
        O-BOUNDED or O-HALF at the authorized cells with dual agreement.

