hypothesis:
  id: H-SSI-001
  question_id: RQ-SSI-001
  class: cost_model
  source_proposal: IDEA-20260725-001
  statement: >-
    Under the pinned cost convention wiener_full_cost_plus_isogeny_step_count
    (KN-LIT-094 full-cost charging of large random-access tables, KN-LIT-012
    distinguished-point parallel collision search, isogeny-graph step counts
    pinned as formulas F1-F6 in EXP-SSI-001), the classical-cost ranking of
    pure supersingular path-finding algorithms changes relative to the quoted
    step-count ranking (KN-TECH-024, KN-TECH-029) in at least one of the two
    regimes the BATCH-001 red team required to be separated. In the F_p2
    regime, the defined low-memory distinguished-point collision-search
    analogue overtakes table-based meet-in-the-middle (MITM) once the
    sqrt(N)-entry table is charged at full cost (predicted modeled gap
    (2/3 - 1/2)*log2(p) at exponent level). In the F_p regime, the same
    analogue restricted to the F_p-rational subgraph overtakes the quoted
    Delfs-Galbraith O~(p^{1/4}) once DG's memory profile is charged
    (predicted modeled gap (1/3 - 1/4)*log2(p) under DG memory-profile case
    F5a; ranking survival under case F5b). The claim is methodological: it
    reprices the honest matched baseline for GOAL-SSI-001. It asserts no
    sub-p^{1/4} mechanism and is cost-model hygiene, not a cryptanalytic
    break of CGL, SQIsign, or CSIDH.
  mechanism: >-
    Charge every table-based method under KN-LIT-094: a sqrt(n)-entry
    random-access table over a search space of size n costs n^{2/3+o(1)}
    full cost (hardware x time), not n^{1/2} processor steps. Define the
    low-memory comparator explicitly: a two-flavored non-backtracking
    distinguished-point walk on the 2-isogeny graph (walk law keyed by a
    PRF on the current j-invariant, distinguished predicate on canonical
    j-encoding bits, golden-collision path reconstruction between walks
    seeded at the two input curves), after the KN-LIT-012 template. Compare
    three methods per regime at standardized parameter sets, with toy-scale
    instrumented anchors (per-step F_{p^2}-operation counts, measured
    peak_rss_bytes vs analytic table size, collision-step constants)
    feeding pinned formulas F1-F6; never mix measured and modeled numbers
    in one column.
  assumptions:
    - >-
      Pure path-finding instances: two supersingular curves, no torsion
      images under a secret isogeny, no SQIsign transcript, no CSIDH secret
      (proposal IDEA-20260725-001; SIDH/SIKE torsion-image regime forbidden).
    - >-
      Graph model per KN-TECH-024: supersingular 2-isogeny graph over F_p2
      is (ell+1)-regular Ramanujan on ~p/12 vertices; F_p-rational subgraph
      size ~ sqrt of the full graph per KN-LIT-078 / KN-TECH-024 (reported
      confidence, relayed from the abstract).
    - >-
      The KN-LIT-094 three-dimensional wiring / full-cost model applies to
      large random-access tables of j-invariants or path nodes; a documented
      escape of the isogeny-graph table access pattern from the wiring bound
      is a falsification route, not an inconvenience (candidate report,
      cheapest_falsification_gate).
    - >-
      The low-memory isogeny-graph collision-search analogue is definable
      with standard graph access and no uncharged oracle; if it is not, that
      comparator fails and the ranking question closes as stated (red-team
      objection N1 carried into falsification condition FC2).
    - >-
      Delfs-Galbraith memory profile is unresolved at design time (KN-LIT-078
      is abstract-relayed in corpus). Two pinned cases: F5a (DG is a
      table-based MITM on the F_p subgraph, memory Theta(p^{1/4})) and F5b
      (DG achieves O~(p^{1/4}) with polylog memory). The executor resolves
      the case from the KN-LIT-078 primary text (DOI
      10.1007/s10623-014-0010-1, arXiv:1310.7789) or tabulates both; an
      unresolved case split is a disclosure, not a failure.
    - >-
      All o(1) terms in KN-LIT-094 are unextracted (KN-TECH-035
      applicability limits); conclusions are exponent-level baseline-identity
      statements, never constant-factor or bit-security numbers.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        For primes p = 3 (mod 4) with N = |V(G_{2,p})| ~ p/12 the number of
        steps of the pinned non-backtracking 2-isogeny walk on the F_p2
        supersingular graph (seeded uniformly, after a declared mixing
        burn-in) until the first j-collision has expectation
        sqrt(pi*N/2)*(1+o(1)), uniformly over the tested size range.
      random_model_justification: >-
        The graph is (ell+1)-regular Ramanujan (theorem, relayed as
        established in KN-TECH-024), hence has a constant spectral gap and
        total-variation mixing in Theta(log N) steps; walk segments longer
        than the mixing time are modeled as independent uniform samples, to
        which the classical birthday law for uniform sampling with
        replacement (expected first collision at sqrt(pi*N/2)) applies.
      supporting_results:
        - Ramanujan property of the supersingular ell-isogeny graph (KN-TECH-024, confidence established in corpus)
        - Classical birthday / occupancy theorem for uniform sampling with replacement
      validation_experiment_ids: [EXP-SSI-001]
      falsification_condition: >-
        Measured mean first-collision steps at two consecutive anchor sizes
        fall outside [0.5, 2.0] x sqrt(pi*N/2) after burn-in, across the
        pre-registered seeds; the band is chosen wider than known
        walk-quality constant variation (Teske-style, KN-LIT-012).
    - id: HEUR-002
      formal_statement: >-
        The two-flavored distinguished-point instantiation of the HEUR-001
        walk (predicate survival probability 2^{-theta}, m processors) finds
        a golden collision between the two input curves' walks in expected
        wall-clock (sqrt(pi*N/2) + O(2^theta))/m steps, storing
        Theta(sqrt(N)/2^theta) distinguished points, matching the
        van Oorschot-Wiener analysis at constant level; cycle-trapping of
        reversible non-backtracking walks affects an o(1) fraction of walks.
      random_model_justification: >-
        KN-LIT-012's time/memory/processor tradeoff is proven under its
        random-walk heuristic for random mappings; HEUR-001's mixing
        argument licenses treating long walk segments as uniform samples,
        and the distinguished-point technique alters only what is stored,
        not the walk distribution. Short-cycle trapping is assumed
        negligible because the Ramanujan expansion makes short closed walks
        rare; this is measured, not assumed silently.
      supporting_results:
        - van Oorschot-Wiener parallel collision search time/memory tradeoff (KN-LIT-012)
        - Ramanujan spectral gap and mixing (KN-TECH-024)
      validation_experiment_ids: [EXP-SSI-001]
      falsification_condition: >-
        Measured distinguished-point count falls outside
        [0.5, 2.0] x sqrt(N)/2^theta, or more than 1% of walks trap in
        cycles shorter than the declared bound, or collision-to-path
        reconstruction fails without extra uncharged storage, at anchor
        sizes across seeds.
    - id: HEUR-003
      formal_statement: >-
        The set of F_p-rational supersingular j-invariants reachable from
        j = 1728 (p = 3 (mod 4)) under F_p-rational 2-isogenies has size
        n'(p) = p^{1/2+o(1)} (matching the corpus-reported subgraph size
        ~ sqrt of the full graph, KN-TECH-024 / KN-LIT-078) and supports
        the HEUR-001 collision law with N replaced by n'.
      random_model_justification: >-
        Reported subgraph size scaling (KN-LIT-078, confidence reported
        from the abstract; class-number origin) plus the same birthday law.
        Weaker than HEUR-001: subgraph regularity, connectedness, and the
        reachable-component fraction are NOT established in the corpus; the
        realized degree distribution and reachable-set size are therefore
        measured secondary metrics, and the falsification band is widened.
      supporting_results:
        - Delfs-Galbraith F_p-rational subgraph existence and ~p^{1/2} size (KN-LIT-078, reported)
        - Classical birthday law for uniform sampling with replacement
      validation_experiment_ids: [EXP-SSI-001]
      falsification_condition: >-
        The slope of log2(n'_measured) vs log2(p) across anchor sizes falls
        outside [0.35, 0.65], or the measured collision-step constant on the
        subgraph falls outside [0.25, 4.0] x sqrt(pi*n'/2), across seeds.
  structural_ingredients:
    - description: >-
        Wiener full-cost theorem: pricing attacks by hardware x time under a
        three-dimensional wiring bound makes a sqrt(n)-entry table cost
        n^{2/3+o(1)} full cost versus n^{1/2+o(1)} processor steps (BSGS
        result); parallel collision search retains its asymptotic advantage
        because per-processor storage is small.
      citation: KN-LIT-094 (Wiener 2004, J. Cryptology 17(2):105-124, DOI 10.1007/s00145-003-0213-5)
      role: memory/wiring charging law converting MITM and (case F5a) DG table memory into full cost
    - description: >-
        van Oorschot-Wiener parallel collision search with distinguished
        points: near-linear speedup on m processors, storage
        Theta(sqrt(n)/2^theta) for predicate survival 2^{-theta}, with an
        explicit memory/processor/time tradeoff including meet-in-the-middle
        applications.
      citation: KN-LIT-012 (van Oorschot-Wiener 1999, J. Cryptology 12(1):1-28, DOI 10.1007/PL00003816)
      role: algorithm template and tradeoff law for the low-memory comparator
    - description: >-
        Supersingular ell-isogeny graph structure: (ell+1)-regular Ramanujan
        graph on ~p/12 vertices over F_p2; pure path-finding cost reference
        O~(p^{1/2}) MITM time and space, O~(p^{1/4}) on the F_p subgraph.
      citation: KN-TECH-024 (corpus technique entry; sources KN-LIT-063, KN-LIT-078, KN-LIT-079)
      role: graph size/regularity inputs to pinned formulas F1-F5
    - description: >-
        Delfs-Galbraith classical algorithm exploiting the F_p-rational
        subgraph, quoted O~(p^{1/4}) for the F_p case; memory profile not
        stated in corpus (abstract-relayed), resolved at execution (case
        F5a/F5b).
      citation: KN-LIT-078 (Delfs-Galbraith 2016, DCC 78(2):425-440, DOI 10.1007/s10623-014-0010-1, arXiv:1310.7789)
      role: F_p-regime quoted baseline and subgraph existence/size
    - description: >-
        Program full-cost accounting discipline: the "fully charged"
        baseline convention, its applicability limits (asymptotic, o(1)
        unextracted, settles exponent-level comparisons only), and the
        caution that step-count-only numbers are defender-conservative but
        unsafe for declaring two algorithms equivalent.
      citation: KN-TECH-035 (corpus technique entry; source_refs KN-LIT-094, KN-LIT-012)
      role: accounting convention this hypothesis instantiates for isogeny graphs
  reduction_chain:
    core_problem: >-
      Classical matched-baseline identity for pure supersingular
      path-finding under full-cost accounting (F_p2 and F_p regimes kept
      separate).
    corollaries: []
  predictions:
    - metric: >-
        modeled full-cost exponent of F_p2 MITM minus its step-count
        exponent (formula F2 minus F1, in the exponent of p)
      direction: higher
      minimum_effect: >-
        separation >= 1/24 (the pre-declared noise band); predicted 1/6 by
        the KN-LIT-094 analogue (p^{1/2} steps to p^{2/3+o(1)} full cost)
    - metric: >-
        modeled full-cost ranking gap in regime F_p2:
        Delta_Fp2 = log2(FC_MITM) - log2(FC_low-memory-CS) at each
        standardized parameter set
      direction: higher
      minimum_effect: >-
        Delta_Fp2 >= (1/24)*log2(p) at all four standardized sets;
        predicted ~ (1/6)*log2(p) (42.7 bits at log2(p)=256); a flip is
        decided only beyond the band, a tie within it is survival
    - metric: >-
        modeled full-cost ranking gap in regime F_p:
        Delta_Fp = log2(FC_DG) - log2(FC_CS-on-subgraph) at each
        standardized parameter set
      direction: different
      minimum_effect: >-
        under case F5a: Delta_Fp >= (1/24)*log2(p) at all four sets,
        predicted ~ (1/12)*log2(p) (21.3 bits at log2(p)=256); under case
        F5b: |Delta_Fp| < (1/24)*log2(p) (survival). DG memory-profile case
        resolved from KN-LIT-078 primary text at execution; if unresolved,
        both cases are tabulated and the F_p verdict is stated conditionally
    - metric: >-
        step-count ranking consistency with quoted literature (formulas
        F1/F3/F5 versus KN-TECH-024/KN-TECH-029 exponents and the frozen
        P13 source's "previous methods" figures 2^128/2^192/2^256 at
        log2(p) = 256/384/512)
      direction: different
      minimum_effect: >-
        deviation <= 2.5 bits after constants disclosure (expected offset
        ~1.5 bits from the p/12 graph-size constant and the sqrt(pi/2)
        birthday constant omitted by the quoted figure); a larger deviation
        flags the formula implementation (control C1), not the hypothesis
    - metric: >-
        measured collision-step constant of the 2-isogeny
        distinguished-point walk at anchor sizes (HEUR-001/HEUR-002)
      direction: different
      minimum_effect: >-
        measured mean first-collision steps within [0.5, 2.0] x
        sqrt(pi*N/2) at two consecutive anchor sizes across seeds; outside
        the band falsifies HEUR-001 as stated
  test_boundary:
    instances:
      - >-
        F_p2 regime: pairs (E1, E2) of supersingular curves over F_p2,
        p = 3 (mod 4), E1 at j = 1728, E2 the endpoint of a seed-derived
        non-backtracking 2-isogeny walk of length 4*log2(N); no torsion
        images, no transcripts, no secrets
      - >-
        F_p regime: F_p-rational supersingular instances reached from
        j = 1728 under F_p-rational 2-isogenies, same seeds; reachable
        component used as the walk domain
      - >-
        synthetic control: seeded pseudorandom mappings (SHA-256-based
        random functions) on 2^14, 2^16, 2^18 states
    parameters:
      anchor_sizes_log2p: [28, 32, 36, 40]
      standardized_sets_log2p: [256, 384, 512, 768]
      standardized_set_names: [SQIsign NIST-I, SQIsign NIST-III, SQIsign NIST-V, large-768]
      isogeny_degree_ell: 2
      graph_size_model: N = p/12 (F_p2), n' ~ p^{1/2} (F_p, reported)
      distinguished_point_theta: 8
      noise_band_delta: (1/24)*log2(p) at each standardized set
      seeds: [101, 102, 103, 104, 105, 106, 107, 108, 109, 110, 111]
    implementation: >-
      New pure-Python module experiments/EXP-SSI-001/ssi_costlab.py
      (stdlib + sympy/pyyaml per the harness environment; no Sage, no
      network), executed under harness/runner.py (records command, git
      state, environment, peak_rss_bytes; refuses overwrite); reuses
      harness/toycurve.py field-arithmetic patterns; formula-table style
      follows experiments/EXP-WESOVOW-001/cost_model.py. F_p2 and F_p
      analyses are produced by separate code paths (control C3).
    budget:
      wall_clock_seconds_per_run: 3600
      total_wall_clock_seconds: 18900
      total_cpu_hours: 5.25
      maximum_memory_gb: 8
      maximum_runs: 12
  falsification_conditions:
    - id: FC1
      condition: >-
        Null refutation: both regimes reach a decided verdict and every
        modeled full-cost ranking gap lies within the noise band
        (|Delta| < (1/24)*log2(p)) at all four standardized sets. Then the
        motivating claim that full-cost accounting may change the
        classical-cost ranking is refuted for this exact pinned convention
        and scope (a null result); negative evidence closes only this scope.
    - id: FC2
      condition: >-
        The low-memory isogeny-graph collision-search analogue cannot be
        defined without uncharged oracles or nonstandard graph access (walk
        law, distinguished predicate, or collision-to-path reconstruction
        obstructed, recorded with the exact obstruction): the comparator,
        and hence the mechanism as stated, fails; this closes the ranking
        question, not a mathematical claim about path-finding.
    - id: FC3
      condition: >-
        A documented derivation shows the isogeny-graph table access
        pattern escapes the KN-LIT-094 wiring bound (the candidate's own
        escape clause): the full-cost/step-count separation collapses and
        the hypothesis is refuted.
    - id: FC4
      condition: >-
        HEUR-001 or HEUR-002 is falsified at toy scale and no repaired
        constant restores the pinned formulas' behavior: the experiment
        cannot decide the ranking as pinned and the hypothesis is
        inconclusive, never supported by this route. A timeout, crash, or
        resource exhaustion is an infrastructure outcome and is never
        evidence against the hypothesis (AGENTS.md rule 5).
  interpretation_limits:
    - Cost-model hygiene, not a cryptanalytic break of CGL, SQIsign, or CSIDH.
    - BATCH-001 red-team required F_p2 vs F_p regime split before any ranking claim; all ranking statements here are per-regime and never mix regimes.
    - Does not count toward GOAL-SSI-001 completion criteria unless a new attack mechanism appears.
    - >-
      The full-cost model is asymptotic with unextracted o(1) constants
      (KN-LIT-094, KN-TECH-035): it settles exponent-level baseline
      identity, not bit-security or constant-factor claims.
    - >-
      Measured anchors are toy-scale (log2(p) <= 40): they validate formula
      constants and walk behavior at toy scale only; standardized-set
      tables are formula extrapolations, never crypto-scale validation
      (AGENTS.md rule 7).
    - >-
      Step-count-only numbers remain defender-conservative (KN-LIT-094's
      own caution, preserved in KN-TECH-035); a ranking flip reprices
      baselines but breaks nothing by itself.
  status: approved
  proposed_by: coordinator
