hypothesis:
  id: H-CRYPTO-a928b6
  question_id: RQ-CRYPTO-001

  statement: >-
    SCOPE: a declared registry of recognized cryptographic prime-field curves,
    the bounded one-sided test "does p^i = 1 mod r for some i <= K" at K = 10^6,
    and a closed-form cost comparison with the subexponential o(1) set to zero.
    CLAIM TIER: theory for the cost half, exact-arithmetic measurement for the
    census half. NO SOLVE, NO ATTACK, NO EXPONENT CLAIM FOR ANY NON-PAIRING
    CURVE.
    The hypothesis has three conjuncts and each is separately falsifiable.
    (C1, CENSUS) Every curve in the registry falls into exactly one of two
    classes under the bounded test: a HIT at its constructed embedding degree
    (k in {2,3,4,6,12} for supersingular-shape and pairing-friendly rows), or a
    MISS at K = 10^6 (every standardized non-pairing row, specifically
    secp256k1, NIST P-256 and NIST P-384). The forced values are k = 2 exactly
    for the supersingular shape -- PROVED, not measured -- and k = 12 exactly for
    BN254 and BLS12-381, forced by their constructions.
    (C2, COST SPLIT) Under an operation-count charge with the NFS constant c
    transcribed from a primary source and the o(1) set to zero, the transfer's
    cost log2 L_{p^k}(1/3, c) lies BELOW matched rho's log2 sqrt(pi r / 4) on at
    least one deployed small-k registry row and ABOVE it on at least one other,
    with secp256k1 above by more than 1000 bits. The pre-registered values at
    c = (32/9)^{1/3} are 109.8 versus 127.0 for BN254, 130.0 versus 127.5 for
    BLS12-381, and 1987 versus 128.0 for secp256k1.
    (C3, CHARGE DEPENDENCE) The verdict on at least one row differs between the
    operation-count charge and a memory-charged (Wiener AT^2) charge, OR the
    AT^2 charge cannot be evaluated because the NFS linear-algebra memory
    exponent is not obtainable -- and WHICH of those two happens is itself the
    reported result. No value is pre-registered for the AT^2 exponent, and that
    absence is deliberate: pre-registering a guess for a quantity this
    hypothesis admits it does not know would manufacture a confirmation.
    IF ANY CONJUNCT FAILS, the failure is the deliverable and it is reported at
    the conjunct that produced it. The census (C1) is unconditional arithmetic;
    C2 and C3 are conditional on transcribed constants and on H3 below.

  mechanism: >-
    DERIVED IN-REPO WHERE POSSIBLE; EVERY RECALLED STEP IS LABELLED AND EVERY
    LABELLED STEP IS A CHECK IN THE EXPERIMENT, NEVER AN AUTHORITY.

    THE MAP. For E/F_p with a subgroup of prime order r > 3, let
    k = ord_r(p) = min{i >= 1 : p^i = 1 mod r}. The reduced Tate pairing gives a
    non-degenerate bilinear pairing into mu_r <= F_{p^k}^*; fixing P of order r
    and a suitable Q, psi(X) = e(X, Q) is an injective homomorphism from <P> into
    mu_r, so log_P(R) = log_{psi(P)}(psi(R)). Bilinearity, e(aP, Q) = e(P, Q)^a,
    makes the reduction exact rather than heuristic. Cost of the reduction: two
    Miller evaluations, O(k^2 log p) field operations, negligible on both sides.
    THE MAP AND ITS ATTRIBUTION (MOV; Frey-Ruck) ARE RECALLED, NOT READ; Stage 0
    of EXP-CRYPTO-d3e381 obtains a primary statement or records that it could
    not.

    WHY THE DECIDING QUANTITY IS COMPUTABLE WITHOUT FACTORING. Computing
    ord_r(p) in general requires factoring r - 1, infeasible at 256 bits. The
    ADMISSION question does not need ord_r(p); it needs to separate k <= K from
    k > K. Iterating x <- x p mod r from x = p and testing x = 1 decides that in
    exactly K modular multiplications, and the test is EXACT AND ONE-SIDED: a hit
    at index i proves k = i (i is the first such index by construction of the
    loop), and no hit proves k > K. No factoring, no library, no solver, no
    heuristic. This is why C1 is unconditional and why its absence from the
    corpus is a coverage gap rather than a budget decision.

    FORCED VALUE 1, PROVED: THE SUPERSINGULAR SHAPE HAS k = 2 EXACTLY. If E/F_p
    is supersingular with p > 3 then the trace of Frobenius is 0 and
    #E(F_p) = p + 1. Let r | p + 1 be prime, r > 2. Then p = -1 mod r, so
    p^2 = 1 mod r, giving k <= 2; and p = 1 mod r would force r | p - 1 and
    r | p + 1, hence r | 2, contradicting r > 2. Therefore k = 2 exactly. Two
    lines, no citation, no computation. This is the positive control: an
    implementation that returns anything else on this family is broken and no
    negative from any other arm may be reported. A pre-derivation executed
    outside the harness during ideation returned k = 2 at 106 of 106 instances of
    the shape p = 4r - 1 with p, r prime and p = 3 mod 4 and r < 5000 --
    SESSION-COMPUTED, NOT EVIDENCE, re-run in harness.

    FORCED VALUE 2, BY CONSTRUCTION: PAIRING-FRIENDLY ROWS. BN and BLS12 families
    are built so that r | p^12 - 1 with 12 minimal; MNT families so that
    r | p^k - 1 for k in {3,4,6}. The measured k must equal the constructed k.
    This is a TRANSCRIPTION CHECK, not a discovery, and it is reported as one: a
    mismatch means the parameters were copied wrong, and the census is void until
    repaired rather than being read as mathematics.

    FORCED VALUE 3, WITH A RIGOROUS BOUND IN PLACE OF A RECALLED THEOREM: THE
    NON-PAIRING ROWS MISS. The recalled statement is Balasubramanian-Koblitz,
    that a random curve has k of order r; it is NOT READ and this hypothesis does
    not rest on it. The self-contained substitute: the number of elements of
    (Z/r)^* of order at most K is at most sum_{d <= K} phi(d) <= sum_{d <= K} d
    <= K^2, so a uniformly random element of (Z/r)^* has order <= K with
    probability at most K^2/(r - 1). At K = 10^6 and r ~ 2^256 that is below
    2^-215. Under the uniform model a hit on a standardized non-pairing row is an
    event of probability below 2^-215, so a hit would falsify the uniform model
    rather than be dismissed as chance -- which is exactly what makes the null arm
    worth running instead of assuming.

    THE COST COMPARISON. Matched rho on the prime-order subgroup costs
    sqrt(pi r / 4) group operations at polylogarithmic memory (distinguished-point
    form). NFS-family DLP in F_Q, Q = p^k, costs
    L_Q(1/3, c) = exp((c + o(1))(ln Q)^{1/3}(ln ln Q)^{2/3}), memory dominated by
    the sparse linear-algebra stage. Two verdicts:
      OPERATION COUNT: transfer wins iff L_Q(1/3,c) < sqrt(pi r/4).
      WIENER AT^2:     transfer wins iff M_nfs L_Q^2 < M_rho (pi r/4).
    Because rho's memory is N^{o(1)}, the AT^2 comparison is far harsher on the
    transfer than the operation-count one, and it is the comparison no record in
    this corpus has performed for any transfer. C3 is the statement that this
    matters.

    SESSION-COMPUTED PRE-DERIVATION, LABELLED, NOT EVIDENCE. Executed in pure
    Python outside the harness on RECALLED curve parameters and RECALLED
    constants: the bounded test at K = 10^4 returned 12 for BN254 (alt_bn128),
    12 for BLS12-381, and MISS for secp256k1, NIST P-256 and NIST P-384;
    evaluating log2 L at c = (32/9)^{1/3} with o(1) = 0 gave 109.8 (BN254,
    Q = 3048 bits), 130.0 (BLS12-381, Q = 4572 bits) and 1987 (secp256k1 at the
    lower bound Q > 2.56 x 10^6 bits), against log2 rho of 127.0, 127.5 and
    128.0. Those six numbers are the pre-registration for C2 and the experiment
    must reproduce them from RE-TRANSCRIBED inputs or report the derivation as
    wrong.

    WHAT IS NOT DERIVED, AND IS THE WEAKEST LINK. The NFS constant c and the
    behaviour of the o(1) at 3000-4600 bit fields. The BLS12-381 row sits 2.5
    bits from the boundary, which is inside any honest o(1), so THAT ROW'S SIGN
    IS NOT CLAIMED -- only the qualitative split, driven by the BN254 and
    secp256k1 rows which are 17 and 1859 bits from the boundary respectively. The
    experiment declares any margin under 20 bits UNDECIDED before it sees a
    number.

  assumptions:
    - >-
      REGISTRY DEFINITION, FROZEN BEFORE ANY COMPUTATION. The registry is the
      declared list of (name, p, r, source document, source section) transcribed
      in Stage 0 of EXP-CRYPTO-d3e381. It must contain at least: secp256k1,
      NIST P-256, NIST P-384, BN254 (alt_bn128), BLS12-381; at least three
      supersingular-shape control instances; and at least three matched random
      nulls per standardized row. Rows may be ADDED before the treatment arm is
      read and never after.
    - >-
      K = 10^6 is frozen before the run. Raising K after a miss to hunt for a hit
      is a protocol amendment, not an analysis choice.
    - >-
      The o(1) in L is set to zero and that choice is printed on every output
      line carrying an L value. A margin below 20 bits is reported UNDECIDED.
      Both thresholds are fixed here, before any evaluation.
    - >-
      "Matched Pollard rho" means the distinguished-point parallel form with
      polylogarithmic memory, cost sqrt(pi r / 4) group operations. If the
      Coordinator's operative definition differs, C2 and C3 must be restated
      against that definition; C1 is unaffected.
    - >-
      EVERY CURVE PARAMETER IN THIS RECORD IS RECALLED AND NONE IS AN AUTHORITY.
      The pre-derivation used recalled parameters and its outputs are labelled
      SESSION-COMPUTED throughout. Transcription from primary standards is
      Stage 0 and the construction self-check is what catches a bad transcription.

  proof_search_map:
    bottleneck: >-
      The single step at which a candidate mechanism's advantage over matched rho
      is decided for a NAMED curve. GOAL-CRYPTO-001 has run thirteen batches
      without ever evaluating that step for any named curve, because it has no
      curve registry. Here the step reduces to one integer (k) and one inequality
      per row, so the bottleneck is removed by arithmetic rather than by research
      -- which is precisely why its absence is worth recording.
    baseline_embedding:
      parameter_slice: >-
        The supersingular slice, k = 2. There the transfer is the classical
        MOV-vulnerable case, the reason supersingular curves were abandoned for
        ECC, and the answer is known independently of this hypothesis. It is the
        exact old-method boundary the census must reproduce.
      reproduction_check: >-
        SYMBOLIC, AND ALREADY PASSED IN DERIVATION FORM: r | p + 1 and r > 2
        imply ord_r(p) = 2, proved above in two lines. Independently confirmed by
        an exhaustive session-computed enumeration over p = 4r - 1, r < 5000,
        which returned 2 at 106 of 106 instances. A curve on a plot resembling
        the baseline is not an embedding; this is an exact integer identity
        against a proved value.
    observation_collision:
      observable: >-
        The integer k = ord_r(p), together with the derived pair
        (log2 L_{p^k}(1/3,c), log2 sqrt(pi r/4)).
      distinct_preimage_search: >-
        A COLLISION EXISTS, IS EXPECTED, AND IS HANDLED RATHER THAN HIDDEN. Many
        non-isomorphic curves share a value of k -- BN254 and BLS12-381 both
        return 12 -- so k alone does NOT identify a curve and must not be used
        as if it did. The separating condition is the pair (k, size of Q = p^k)
        together with r's size, and it separates exactly the two rows that
        matter: BN254 at Q = 3048 bits versus BLS12-381 at Q = 4572 bits land on
        OPPOSITE sides of the rho boundary despite identical k. That the
        observable is refined enough to split a same-k pair, and is checked to
        do so, is the identifiability content of this hypothesis. A second
        collision is searched for deliberately: two registry rows with the same
        (k, Q-size, r-size) to three significant figures and different verdicts
        would falsify the cost model's determinism and is reported if found.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the ECDLP instance into F_{p^k}^*, where the hypothesis "is this
          curve transfer-vulnerable" becomes an exact inequality between two
          closed-form cost expressions rather than an open research question.
          Encoding obligation: the pairing is exact and log-preserving
          (bilinearity). Completeness: every curve with r | p^k - 1 admits the
          map. Soundness: the recovered logarithm is verified by kP = Q on the
          curve, so a wrong answer is caught by certificate. Transfer: none
          claimed to curves outside the registry. Cost loss: the Miller
          evaluations, O(k^2 log p), negligible against both sides.
        predicted_gain: >-
          For the attacker: nothing new -- the transfer is thirty years old.
          For the program: a per-curve admission verdict computed in seconds
          where thirteen batches produced none, plus the first memory-charged
          statement about a transfer in this corpus.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable k fixed at 12 and vary the forgotten structure
          (which family, which p-size): BN254 versus BLS12-381. The intrinsic
          invariant proposed to distinguish them is the size of Q = p^k, and the
          prediction is that it moves the verdict across the boundary.
        predicted_gain: >-
          If the two rows do NOT land on opposite sides, the cost model is not
          resolving the structure it claims to resolve and the C2 split is
          withdrawn while C1 stands.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER. C1: FOR ALL rows in the frozen registry, THERE
      EXISTS a verdict (hit at a stated k, or miss at K = 10^6) produced by the
      one FROZEN test procedure, and the procedure may NOT depend on the row.
      Note this is the strong order -- one procedure, all rows -- and the weak
      order (for each row, some procedure) would be vacuous and is explicitly not
      claimed. C2: THERE EXIST at least two registry rows whose operation-count
      verdicts have OPPOSITE signs under ONE fixed constant c and ONE fixed
      o(1) convention; the constant may not be chosen per row, and a result
      obtained by varying c across rows is inadmissible. C3: THERE EXISTS at
      least one row whose verdict depends on the charge, or the AT^2 charge is
      declared unevaluable -- and the quantifier trap being avoided is
      substituting "some charge makes some row flip" (trivial) for "one fixed
      pair of charges makes one identified row flip" (the claim).
    method_ceiling:
      strongest_certifiable_claim: >-
        AT MOST: a per-curve, closed-form, o(1)-free admission verdict for the
        transcribed registry under one named cost model, plus an exact integer
        census. It CANNOT certify that any curve is broken, cannot certify any
        concrete security level, cannot execute or cost any actual NFS
        computation, cannot satisfy GOAL-CRYPTO-001's completion criterion
        (which requires an executed certificate-verified solve), and cannot say
        anything whatever about a curve not in the registry. It also cannot
        establish that the transfer is the BEST attack on any row.
      nearby_object_control: >-
        THE NEARBY OBJECT WHERE THE HOPED-FOR CONCLUSION FAILS IS BLS12-381,
        and it is in the registry by design. It has the SAME embedding degree as
        BN254, the same family shape, the same r-size to within one bit, and the
        same construction philosophy -- and the pre-derived verdict is that the
        transfer LOSES there while WINNING at BN254. A method that cannot hold
        that pair apart is responding to "is it pairing-friendly" rather than to
        the cost, and has not identified the load-bearing structure, which is the
        size of Q. A SECOND nearby-object control, free and at the other end:
        secp256k1, where the method must return a miss and a margin above 1000
        bits.
    proof_obligations:
      - claim: >-
          ord_r(p) = 2 for supersingular E/F_p, p > 3, with prime r | p + 1,
          r > 2.
        responsibility: baseline
      - claim: >-
          The bounded loop decides k <= K exactly and one-sidedly, with no
          factoring and no heuristic.
        responsibility: correctness
      - claim: >-
          A uniformly random element of (Z/r)^* has order <= K with probability
          at most K^2/(r-1), hence below 2^-215 at K = 10^6, r ~ 2^256.
        responsibility: success_probability
      - claim: >-
          Every registry parameter is transcribed from a named primary document
          and section, and the pairing-friendly rows reproduce their constructed
          k.
        responsibility: interface
      - claim: >-
          The NFS constant c is transcribed from a primary source, or the cost
          stages are reported UNDERIVED.
        responsibility: strictness
      - claim: >-
          The o(1) is set to zero, the choice is printed on every L value, and
          margins under 20 bits are reported UNDECIDED.
        responsibility: scope
      - claim: >-
          The AT^2 comparison either uses a sourced NFS memory exponent or is
          reported unevaluable; it is never evaluated on a guessed exponent.
        responsibility: memory
      - claim: >-
          No statement about any curve outside the registry, and no statement
          that any registry curve is broken.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim:
    problem: >-
      ECDLP on a prime-order subgroup of a recognized prime-field curve, for the
      subclass of curves admitting a small-embedding-degree pairing transfer.
    prior_best: >-
      Matched Pollard rho at r^{1/2} time, r^{o(1)} memory, for a curve with no
      exploitable structure.
    time_exponent: >-
      For a registry row with embedding degree k: subexponential
      L_{p^k}(1/3, c) rather than r^{1/2}. THIS IS NOT A NEW EXPONENT AND IS NOT
      CLAIMED AS ONE -- it is the exponent of a thirty-year-old reduction, and
      this hypothesis censuses which registry rows it reaches. For every
      standardized non-pairing row the exponent is UNCHANGED at 1/2 and that is
      the predicted result.
    memory_exponent: >-
      rho: o(1). Transfer: subexponential, exponent NOT KNOWN TO THIS HYPOTHESIS
      and declared not known. Obtaining it is an obligation; guessing it is
      forbidden.
    hidden_cofactor: >-
      The subexponential o(1) in L, which at Q = 3048-4572 bits is not a small
      correction and is the reason the BLS12-381 row's sign is not claimed. Also
      the Miller-loop cost (negligible) and all NFS communication cost (charged
      only implicitly, and only if the AT^2 arm can be evaluated).
    claim_kind: exponent_improvement

  heuristic_assumptions:
    - id: HEUR-EMB-1
      formal_statement: >-
        FOR ALL registry rows constructed as pairing-friendly, the measured
        ord_r(p) equals the family's constructed embedding degree; FOR ALL
        standardized non-pairing rows and FOR ALL matched null rows, no i <= 10^6
        satisfies p^i = 1 mod r.
      random_model_justification: >-
        The first half is not a heuristic at all but a consequence of the
        construction, and is used as a transcription check. The second half has
        a RIGOROUS bound under the uniform model given in the mechanism:
        at most K^2 elements of (Z/r)^* have order <= K, so the probability is
        below K^2/(r-1) < 2^-215 at K = 10^6, r ~ 2^256. That bound is proved
        here rather than recalled, deliberately, so that the recalled
        Balasubramanian-Koblitz statement carries no weight.
      supporting_results: []
      validation_experiment_ids: [EXP-CRYPTO-d3e381]
      falsification_condition: >-
        Any hit at i <= 10^6 on a standardized non-pairing row or on a matched
        null. On a null this means the test finds coincidences at this size and
        every miss in the package is uninformative. On a standardized row it is
        an immediately certificate-checkable structural fact about a deployed
        curve and is routed to rule-12 review-breakthrough before any other work
        continues.
    - id: HEUR-EMB-2
      formal_statement: >-
        The cost of DLP in F_Q, Q = p^k, is L_Q(1/3, c)(1 + o(1)) for the
        transcribed constant c, and setting o(1) = 0 preserves the SIGN of the
        comparison against sqrt(pi r/4) whenever the margin exceeds 20 bits.
      random_model_justification: >-
        NONE IS OFFERED, AND THIS IS THE WEAKEST LINK IN THE HYPOTHESIS AND IS
        LABELLED AS SUCH RATHER THAN PAPERED OVER. The L-form is a relayed
        asymptotic with an unquantified cofactor at the sizes in question, and
        the 20-bit threshold is a declared convention chosen before any
        evaluation, not a derived bound on the o(1).
      supporting_results: []
      validation_experiment_ids: [EXP-CRYPTO-d3e381]
      falsification_condition: >-
        It CANNOT be validated within any plausible campaign budget -- validating
        it would mean running NFS at 3000 bits. The honest consequences are
        pre-registered instead: every reported margin carries the o(1) = 0
        declaration; every margin under 20 bits is UNDECIDED; and if c cannot be
        transcribed from a primary source the entire cost half is reported
        UNDERIVED while the census stands. The inability to validate HEUR-EMB-2
        is a limit on the claim, never a passed check.
    - id: HEUR-EMB-3
      formal_statement: >-
        Matched Pollard rho costs sqrt(pi r/4) group operations at r^{o(1)}
        memory on every registry row.
      random_model_justification: >-
        Birthday bound with distinguished points. The constant is
        RECALLED-UNVERIFIED and normalisation conventions differ; the margin
        thresholds above are wide enough to absorb a factor of 2 in it, and a
        factor of 2 is 1 bit against margins of 17 and 1859.
      supporting_results: []
      validation_experiment_ids: [EXP-CRYPTO-d3e381]
      falsification_condition: >-
        A matched baseline definition requiring r^{c} memory for c > 0, which
        would move rho's own AT^2 position and change every C3 comparison. This
        is definitional, not empirical, and fixing it is Stage 0.

  structural_ingredients:
    - description: >-
        The reduced Tate (or Weil) pairing as an injective, log-preserving
        homomorphism from a prime-order subgroup of E(F_p) into F_{p^k}^*,
        k = ord_r(p).
      citation: >-
        MOV (Menezes-Okamoto-Vanstone) and Frey-Ruck. NOT READ IN THIS SESSION
        -- RECALLED, UNVERIFIED. No citation is asserted as an authority;
        obtaining a primary statement is Stage 0 of EXP-CRYPTO-d3e381, and if it
        cannot be obtained the record says so and the census is reported without
        the attribution.
      role: exact reduction of ECDLP to finite-field DLP
    - description: >-
        Subexponential index calculus of NFS type in F_Q at L_Q(1/3, c).
      citation: >-
        NOT READ -- RECALLED. The constants c = (64/9)^{1/3} ~ 1.923 and
        (32/9)^{1/3} ~ 1.526 are the most load-bearing unverified items in this
        record and are candidates to check, never authorities.
      role: cost of the target-group DLP
    - description: >-
        Elementary counting bound: at most K^2 elements of (Z/r)^* have
        multiplicative order at most K.
      citation: >-
        Elementary; derived in this record. Offered deliberately IN PLACE OF the
        recalled Balasubramanian-Koblitz theorem so that the null arm's forced
        value rests on a proof rather than on a recall.
      role: forced value for the null and non-pairing arms
    - description: >-
        Supersingular trace-zero identity #E(F_p) = p + 1 for p > 3.
      citation: >-
        Standard; the consequence used here (r | p+1, r > 2 implies
        ord_r(p) = 2) is derived in full in the mechanism.
      role: positive control with a proved forced value

  reduction_chain:
    core_problem: >-
      Decide, for each curve in a frozen registry of recognized cryptographic
      prime-field curves, whether the pairing transfer yields a lower cost than
      matched Pollard rho under a named charge.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. There is NO reduction from this census to any statement
      about curves outside the registry, and none is claimed. In particular
      nothing here bears on the general prime-field ECDLP, on secp256k1's or
      P-256's security beyond the predicted null result, on Semaev-style index
      calculus, or on KN-OPEN-002. A negative census closes the transcribed
      registry under the declared model and nothing else, and its forward
      guidance is named in the associated idea record.

  predictions:
    - metric: >-
        G1 -- supersingular positive control: value returned by the bounded test
        on >= 100 instances of the shape p = 4r - 1, p and r prime, p = 3 mod 4
      direction: different
      minimum_effect: >-
        EXACTLY 2 at 100 of 100. Proved before any run. Tolerance is exact, not
        fractional: a single deviation means the implementation is wrong and NO
        result from any arm may be reported.
    - metric: >-
        G2 -- construction self-check: k for BN254 (alt_bn128) and BLS12-381 from
        re-transcribed primary parameters
      direction: different
      minimum_effect: >-
        EXACTLY 12 for both. A different value is a transcription failure and
        voids the census until repaired; it is reported as a transcription
        result and never as mathematics.
    - metric: >-
        G3 -- null and non-pairing arm: any i <= 10^6 with p^i = 1 mod r, for
        secp256k1, NIST P-256, NIST P-384 and every matched random null
      direction: lower
      minimum_effect: >-
        NONE, at every such row. Forced value MISS, with the uniform-model
        probability of a hit bounded above by 2^-215. This arm CAN fail and a
        failure is the largest possible finding in the package.
    - metric: >-
        G4 -- operation-count split: sign of log2 L_{p^k}(1/3,c) -
        log2 sqrt(pi r/4) per registry row, at one fixed c and o(1) = 0
      direction: different
      minimum_effect: >-
        NEGATIVE at BN254 with margin >= 10 bits, POSITIVE at secp256k1 with
        margin >= 1000 bits. Pre-registered session-computed values at
        c = (32/9)^{1/3}: 109.8 vs 127.0 (margin -17.2), 130.0 vs 127.5 (margin
        +2.5, DECLARED UNDECIDED IN ADVANCE because it is under 20 bits), 1987 vs
        128.0 (margin +1859). Reproducing the opposite signs of the BN254 and
        secp256k1 rows from re-transcribed inputs is the test; the BLS12-381 row
        is reported with its margin and NO sign is claimed for it.
    - metric: >-
        G5 -- graded monotonicity: log2 L_{p^k}(1/3,c) as a function of k at
        fixed p-size, over k in {2,3,4,6,12} and the miss class
      direction: higher
      minimum_effect: >-
        STRICTLY INCREASING in k, at every consecutive pair. A non-monotone cost
        curve localizes an arithmetic error in the L evaluation instead of
        leaving "the numbers looked odd", and monotonicity here is forced because
        L is increasing in Q and Q = p^k is increasing in k.
    - metric: >-
        G6 -- charge dependence: the AT^2 verdict on every row whose G4 verdict
        was negative
      direction: different
      minimum_effect: >-
        NO VALUE IS PRE-REGISTERED, DELIBERATELY. What is pre-registered is the
        reporting rule: each such row is reported as (operation-count win, AT^2
