  falsification_conditions:
    - ARM P returns anything other than exactly 1.000. Instrument broken.
    - ARM N1 passes above the binomial null at the declared level. Certificate path leaking; battery INVALID.
    - The ARM T minus ARM N1 gap falls below the declared threshold. The instrument cannot see transport.
    - The alpha fit misses its pre-declared slope, intercept or quality band.
    - Any deliberately broken map goes undetected by the isogeny certificate.
    - >-
      The degree-1 dilation-invariant control is at the chance baseline, which proves no map was
      applied.
    - >-
      Runs exceed budget before the battery completes. INFRASTRUCTURE outcome under AGENTS.md rule 5,
      recorded as such and never as a negative on transport.
  interpretation_limits:
    - >-
      Passing the battery proves the instrument works. It proves nothing about transport, about the
      isogeny class, or about the ECDLP.
    - >-
      Toy scale only. A crypto-scale null cannot be sampled by this design, because a uniformly
      random bijection on a crypto-sized group is not materialisable, and the record does not pretend
      otherwise.
    - >-
      Reconstructing a prior experiment's chance-baseline result inside this battery is not a
      criticism of that experiment's execution. It is a correction of the READING recorded downstream
      of it, and the distinction must survive into every citation.
    - >-
      A failure of the treatment-minus-null gap closes this lane on instrument grounds. That is a
      different and weaker statement than closing it on mathematics, and the two must never be
      conflated in a later summary.
