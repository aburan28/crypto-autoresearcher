# =============================================================================
# H-BINSTD-880e8b -- dim(V·V) predicts XOR-SAT N_var at fixed dim(V)=ℓ.
# Specified from IDEA-20261001-febbe1 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Approved DEC-20261003-672507. ZERO RUNS in this design packet.
# Stages 0-1 authorized. No AUXIN. No Bedrock. No curve attack / exponent claim.
# =============================================================================
hypothesis:
  id: H-BINSTD-880e8b
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261001-febbe1
  experiment_id: EXP-BINSTD-5b2fd0
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-03'
  approved_at: '2026-10-03'
  authorised_by: DEC-20261003-672507
  status: analyzed
  status_history:
    - from: proposed
      to: specified
      at: '2026-10-03'
      by: DEC-20261003-672507
    - from: specified
      to: approved
      at: '2026-10-03'
      by: DEC-20261003-672507
    - from: approved
      to: analyzed
      at: '2026-10-03'
      by: DEC-20261003-f82374
      note: >-
        Evidence review EV-BINSTD-a99d47 / DEC-20261003-f82374: first Stages
        0-1 package valid; Stage-0 freeze twin_ok; Stage-1 O-INCONCLUSIVE
        (distinct-value floors fail on (17,3) and (17,4)) → decision
        inconclusive; not supported; not O-FAIL-BAND.
  proposed_by: coordinator

  title: >-
    At fixed dim(V)=ℓ on toy binary cells, Spearman ρ between dim(V·V) and
    remaining XOR-SAT variable count N_var of Weil-descended S_3 is ≥ 0.70
    across a frozen ≥12-shape V catalog (or fails the band)

  statement: >-
    CLAIM (heuristic_validation / encoding-size instrument; NO ATTACK; NO
    EXPONENT). Let V ⊂ F_{2^n} be an F_2-subspace of dimension ℓ. Let
    dim(V·V) be the F_2-dimension of the span of pairwise products of
    elements of V (twin meters must agree). Let N_var be the number of
    Boolean variables that remain after Gaussian elimination of the pure
    F_2-linear part of the Weil-descended Semaev S_3 system with x1,x2 ∈ V
    and frozen (B, xR), under the frozen encoder pin (twin elimination
    paths must agree). FORALL Stage-1 cells (n,ℓ)∈{(17,3),(17,4)}, across
    the frozen catalog of ≥12 distinct dim-ℓ subspaces, Spearman's ρ
    between dim(V·V) and N_var satisfies ρ ≥ 0.70 — OR the correlation
    fails the band and is recorded as product-dim-not-predictive at this
    scale (O-FAIL-BAND). Distinct from IDEA-20261001-fbee3f (usable_dimensions
    emptiness) and IDEA-20261001-880180 (basis census). NO break. NO
    n≥131 transfer.

  mechanism: >-
    OBJECT FRAME. Representation: FB {P : x(P)∈V} with V an F_2-subspace;
    measure dim(V·V), then encode descended S_3 as a Boolean system and
    read remaining-variable count N_var after linear elimination
    (KR-IC-73db3f / KR-IC-5765d2). Operation set: sweep a frozen catalog of
    V shapes at fixed ℓ (poly, geometric, random). Trichotomy: Class I
    instrument (predictor of encoding size). Lossy-projection: N_var
    discards which clauses dominate. OFF-LIMITS: usable_dimensions
    emptiness (fbee3f); basis-only census (880180); τ-closed yield
    (0fcbe2); solver races. WHAT IS NEW: a pre-registered Spearman ≥0.70
    band linking dim(V·V) to XOR-SAT N_var at RQ-BINSTD toys.

  predictions:
    - metric: spearman_dimVV_vs_Nvar
      direction: lower_bounded
      minimum_effect: '≥ 0.70 at each Stage-1 (n,ℓ) cell'
    - metric: catalog_size
      direction: lower_bounded
      minimum_effect: '≥ 12 distinct V shapes per cell'
    - metric: distinct_dimVV_values
      direction: lower_bounded
      minimum_effect: '≥ 3 distinct dim(V·V) values, else O-INCONCLUSIVE'
    - metric: twin_agreement
      direction: same
      minimum_effect: >-
        dimVV path A = path B and N_var path A = path B on every measured V

  test_boundary:
    instances:
      - 'Stage 0: freeze catalogs for (n,ℓ)∈{17,19,23}×{3,4}; twin probe'
      - 'Stage 1 authorized: (n,ℓ)∈{(17,3),(17,4)} Spearman panels'
    parameters:
      spearman_band: 0.70
      catalog_seed: 2026100317
      bootstrap_reps: 200
      moduli:
        17: t^17+t^3+1
        19: t^19+t^5+t^2+t+1
        23: t^23+t^5+1
    implementation: >-
      Pure Python under experiments/EXP-BINSTD-5b2fd0/implementation/;
      command surface implementation/run.py driven by trial-plan-v1.json.
      Twin meters in product_space.py and encode_s3.py. No Magma/Sage/
      AUXIN/Bedrock.
    budget:
      wall_clock_seconds: 7200
      memory_gb: 2
      maximum_runs: 4

  falsification_conditions:
    - >-
      Twin meters disagree on any measured V (O-ARTIFACT; table void).
    - >-
      Editing the 0.70 band after seeing encodings (protocol invalid).
    - >-
      Claiming practical binary IC or an exponent move from a toy
      encoding correlation (KR-IC-1fcdbc).
    - >-
      Equating N_var prediction with usable_dimensions prediction (fbee3f).
    - >-
      Transferring the 0.70 band to n≥131 without a new contract.

  distinguishable_outcomes:
    - id: O-SUPPORT
      meaning: >-
        Twin OK; distinct-value floors met; Spearman ρ ≥ 0.70 on every
        Stage-1 cell. Encoding-size predictor holds at toys. No attack claim.
    - id: O-FAIL-BAND
      meaning: >-
        Twin OK; floors met; ρ < 0.70 on at least one Stage-1 cell.
        Product-dim-not-predictive of N_var at this scale.
    - id: O-INCONCLUSIVE
      meaning: >-
        Catalog collapses to <3 distinct dim(V·V) or <2 distinct N_var
        values on a Stage-1 cell; expand catalog or stop.
    - id: O-ARTIFACT
      meaning: Twin disagreement or freeze/regression failure. No ρ claim kept.
    - id: O-IMPEDIMENT
      meaning: >-
        Infrastructure timeout/crash/missing Stage-0 freeze. Never
        negative evidence against H-BINSTD-880e8b.

  interpretation_limits:
    - Encoding-size correlation only; does not predict yield or beat rho.
    - Shared XOR-SAT pin; a different encoder needs a new idea/contract.
    - Stage-2 (n=19,23 + random-Boolean null) not authorized under this card.
    - No attack at field degree ≥ 131. ECC2K-130 is not an instance.

  heuristic_assumptions:
    - id: HEUR-BINSTD-febbe1-H1
      formal_statement: >-
        FORALL (n,ℓ)∈ Stage-1 cells: across the frozen ≥12-shape V catalog,
        Spearman ρ(dim(V·V), N_var) ≥ 0.70 where N_var is the remaining
        XOR-SAT variable count of the Weil-descended S_3 instance after
        linear elimination.
      random_model_justification: >-
        Rigorous pointer: KR-IC-73db3f argues that smaller product spaces
        reduce descended variables after Weil restriction. Classical: if
        that channel dominates encoding size, dim(V·V) and N_var should
        correlate strongly; if trace/linear constraints dominate instead,
        correlation may fall below 0.70. The ≥0.70 band is the
        pre-registered transfer hypothesis at toys — not a claim that
        small V·V beats rho.
      supporting_results:
        - KR-IC-73db3f
        - KR-IC-5765d2
        - KR-IC-f5c584
      validation_experiment_ids:
        - EXP-BINSTD-5b2fd0
      falsification_condition: >-
        Spearman ρ < 0.70 at a completed Stage-1 cell (O-FAIL-BAND), OR
        twin failure (O-ARTIFACT), OR catalog collapses (O-INCONCLUSIVE).

  asymptotic_claim:
    problem: >-
      Encoding-size predictability of Weil-descended S_3 XOR-SAT from
      dim(V·V) at toy binary IC cells
    prior_best: >-
      KR-IC-73db3f (product-space V choice); KR-IC-5765d2 (XOR-SAT PDP path)
    time_exponent: >-
      NO EXPONENT MOVED. Encoding-size instrument only; a high Spearman
      does not move binary ECDLP vs rho (KR-IC-1fcdbc / KR-IC-9e610d).
    memory_exponent: Negligible — store per-V dim(V·V) and N_var
    hidden_cofactor: Catalog construction; encoder constants independent of V·V
    claim_kind: heuristic_validation

  proof_search_map:
    bottleneck: >-
      Whether dim(V·V) predicts remaining XOR-SAT variable count at fixed
      dim(V)=ℓ, or whether other channels dominate.
    baseline_embedding:
      parameter_slice: >-
        n=17, ℓ=3, poly basis V=span{1,t,t^2}; twin dimVV and twin N_var
        must agree on this probe before any Spearman is read.
      reproduction_check: >-
        Independent check.py recomputes twin meters on the Stage-0 probe
        and on Stage-1 row0; disagreement voids the table.
    observation_collision:
      observable: 'the pair (dim(V·V), N_var) per V'
      distinct_preimage_search: >-
        A high Spearman could arise from (i) the product-space channel
        (claim) or (ii) a catalog that only varies N_var through an
        accidental covariate. Separated by requiring ≥3 distinct dimVV
        values and ≥2 distinct N_var values; Stage-2 random-Boolean null
        (not authorized here) would further separate.
    constructive_transforms:
      - transform: measurement_instrument
        proposed_object: >-
          Twin dim(V·V) meters + twin linear-elim N_var meters + frozen
          Spearman band 0.70 on a ≥12-shape catalog.
        predicted_gain: >-
          A decidable support/fail label for the KR-IC-73db3f encoding-size
          reading at toys.
    quantifier_order: >-
      FORALL Stage-1 cells (17,3) and (17,4): ρ ≥ 0.70 is PREDICTED.
      NOT CLAIMED: n∈{19,23} under this card; n≥131; any attack.
    method_ceiling:
      strongest_certifiable_claim: >-
        On the named Stage-1 toy cells, Spearman ρ(dimVV, N_var) lies in
        [measured] relative to the 0.70 band, with twin agreement.
      nearby_object_control: >-
        Twin disagreement (artifact); distinct-value floor failure
        (inconclusive). Stage-2 random-Boolean null not authorized.
    proof_obligations:
      - claim: Twin dimVV paths agree on every measured V.
        responsibility: baseline
      - claim: Twin N_var paths agree on every measured V.
        responsibility: baseline
      - claim: Spearman ρ vs band 0.70 decides O-SUPPORT vs O-FAIL-BAND.
        responsibility: success_probability
      - claim: Nothing asserted at n≥131.
        responsibility: scope

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
