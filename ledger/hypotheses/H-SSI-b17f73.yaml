hypothesis:
  id: H-SSI-b17f73
  question_id: RQ-SSI-001
  statement: >-
    SCOPE, BINDING. Object: candidate per-vertex arithmetic filters used
    elsewhere in this slice (S1-1, S1-2, S1-7) to screen supersingular
    curves, exercised here against POSITIVE CONTROLS -- planted instances
    with a KNOWN small endomorphism of prescribed discriminant D, built by
    Deuring reduction of Hilbert class polynomials H_D mod an inert prime p.
    CLAIM TIER: instrumentation / control only. NO ATTACK, NO EXPONENT, NO
    HARDNESS CLAIM. THE HYPOTHESIS: for each candidate filter there exists a
    "sensitivity horizon" |D|_max at which its firing rate on planted
    instances crosses below 0.9, and that horizon obeys |D|_max ~
    (ball radius r explored by the filter)^2, i.e. |D|_max = C_test^2 where
    C_test is the filter's charged test cost. This identity is cross-checked
    against S1-2's independently derived cost exponent c: c = 1/2 is
    equivalent to "horizon = (test cost)^2". Agreement to within 10%
    corroborates both measurements by a route that does not share a
    derivation; disagreement localises which one is wrong.

  mechanism: >-
    Deuring reduction: for small class-number D, H_D has small degree and
    integer coefficients; reduced mod a prime p inert in Q(sqrt(D)), its
    roots are supersingular j-invariants with a guaranteed optimal embedding
    of O_D. build_isogeny_graph.py already performs exactly this
    construction for its seed vertex and already verifies supersingularity
    independently by point counting rather than trusting the construction --
    the constructor exists, is validated in this repository, and this
    hypothesis extends it over a discriminant ladder rather than one D. The
    ladder D in {-3,-4,-7,-8,-11,-19,-43,-67,-163} (class number 1, trivial
    H_D) is extended by small-class-number D up to |D| ~ p^{2/3}, where
    planting becomes vacuous because every curve qualifies -- charged as
    SPARSE at the top because class polynomials of degree ~ h(D) ~ p^{1/3}
    are infeasible even at toy scale beyond small h. For each candidate
    filter, the firing rate on planted versus matched random instances is
    measured and a four-cell confusion table is reported per (D, filter);
    the horizon is the fitted crossing point.

  assumptions:
    - >-
      Deuring reduction of H_D mod an inert prime yields the guaranteed
      optimal O_D-embedding, as already operationally relied upon by
      build_isogeny_graph.py's existing seed-vertex construction (not
      re-derived here; used as-is).
    - >-
      Independent point-counting supersingularity verification is available
      and cheap at the toy primes tested, so that gate (b) can run without
      trusting the CM construction that produced the candidate curve.
    - >-
      S1-2's candidate filter list and cost-exponent derivation are the
      correct comparison objects; this hypothesis measures against them
      rather than re-deriving them.

  proof_search_map:
    not_applicable_reason: >-
      Purely empirical/measurement hypothesis. No theorem, bound, or closure
      argument is claimed; the deliverable is a confusion table and a fitted
      horizon per filter, cross-checked against a sibling entry's
      independently derived exponent.

  rerandomization: null

  asymptotic_claim: null

  heuristic_assumptions:
    - id: HEUR-SSI-b17f73-1
      formal_statement: >-
        FOR EVERY ball-computable filter exploring radius r, the largest |D|
        at which the filter fires on planted instances at rate >= 0.9
        satisfies |D|_max = C_test(r)^2, where C_test(r) is the filter's
        charged per-instance test cost as defined in S1-2.
      random_model_justification: >-
        A ball of radius r around a vertex explores O(ell^r) neighbours;
        detecting a planted structure of "size" |D| requires the ball to
        reach a comparable combinatorial scale, motivating a quadratic
        relation between the linear test-cost budget and the detectable
        discriminant magnitude. This is a derived, session-level prediction,
        not a cited theorem.
      supporting_results: []
      validation_experiment_ids: [EXP-SSI-b52e7a]
      falsification_condition: >-
        A filter fires at rate >= 0.9 on planted instances with
        |D| >> C_test^2 (horizon law wrong, filters see further than their
        ball); or every filter, including exhaustive BFS at the exact
        planted radius, misses planted instances (constructor broken, most
        likely a splitting-field or inertness error).

  structural_ingredients:
    - description: >-
        Deuring correspondence / CM reduction of Hilbert class polynomials
        mod an inert prime, producing supersingular j-invariants with a
        guaranteed optimal endomorphism-ring embedding.
      citation: >-
        Standard Deuring reduction theory; operationally instantiated
        in-corpus by build_isogeny_graph.py's existing seed-vertex
        construction. No external citation asserted beyond that in-corpus
        usage.
      role: constructs the planted-instance positive control
    - description: >-
        Independent supersingularity verification by point counting, as a
        check separate from the constructive argument.
      citation: >-
        In-corpus: build_isogeny_graph.py's existing independent
        verification step.
      role: gate (b), prevents trusting the constructor that produced the instance

  reduction_chain:
    core_problem: >-
      Determine, per candidate per-vertex filter used elsewhere in this
      slice, the largest discriminant at which a planted small endomorphism
      is still detected at rate >= 0.9, and whether that horizon matches the
      independently derived cost-exponent identity from S1-2.
    corollaries: []

  predictions:
    - metric: >-
        per-filter sensitivity horizon |D|_max
      direction: different
      minimum_effect: >-
        |D|_max = C_test^2 to within 10%, cross-checked against S1-2's c=1/2
        identity.
    - metric: gate (a) known j-invariants
      direction: different
      minimum_effect: >-
        D=-4 at p=3 mod 4 gives j=1728; D=-3 at p=2 mod 3 gives j=0, exactly.
    - metric: gate (c) statistical invisibility at |D| >= p^{2/3}*C
      direction: different
      minimum_effect: >-
        Planted and random firing rates converge within sampling error.

  test_boundary:
    instances:
      - >-
        Toy supersingular curves over F_{p^2} at small primes, planted via
        Deuring reduction of H_D for D on the declared ladder, plus matched
        random instances.
    parameters:
      discriminant_ladder: [-3, -4, -7, -8, -11, -19, -43, -67, -163]
      extension_rule: "small-class-number D up to |D| ~ p^{2/3}, sparse at the top"
    implementation: >-
      Reuses build_isogeny_graph.py's existing Deuring-reduction and
      point-counting routines; extends the seed-vertex construction over the
      declared ladder rather than writing a new constructor.
    budget: {}

  falsification_conditions:
    - >-
      Some filter fires at rate >= 0.9 on planted instances with
      |D| >> C_test^2: HEUR-SSI-b17f73-1 fails and S1-2's c >= 1/2 bound is
      in question.
    - >-
      Every filter, including exhaustive BFS at the exact planted radius,
      misses planted instances: the constructor is broken and nothing else
      in the slice can be trusted until fixed.
    - Gate (a) fails: the hypothesis's instrument is not the claimed constructor; stop immediately.

  interpretation_limits:
    - >-
      Ceiling: control. Certifies nothing about the hardness of any
      supersingular-isogeny problem; certifies only that S1-1/S1-2/S1-7's
      filters are instruments that can fail, and exercises that failure
      mode.
    - >-
      Out of scope: the broken SIDH/SIKE torsion-image setting is not a
      positive target of this hypothesis or of GOAL-SSI-001; the constructor
      plants an endomorphism-ring structure (small D), not a torsion-point
      image.
    - >-
      The ladder is honestly sparse at |D| approaching p^{2/3} because
      class-polynomial degree grows as h(D) ~ p^{1/3}; any horizon fit must
      not be reported over the uncovered range.
    - >-
      No claim about attack cost, exponent, or crypto-scale hardness follows
      from any outcome of this hypothesis.

  status: proposed
  proposed_by: idea-generator
