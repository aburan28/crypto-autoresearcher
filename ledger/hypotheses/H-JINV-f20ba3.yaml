# =============================================================================
# H-JINV-f20ba3 — specified from IDEA-20261006-fc2714 (bytes copied
# unchanged from origin/design/frob-1e54b5-theta). Question
# RQ-JINV-8fc13a. The prediction under test is the idea's own: over
# F_29, some ordinary j=1728 curve and some ordinary curve with j
# outside {0, 1728}, with equal trace #E-(29+1), have orbit-normalised
# means of the Legendre symbol of the doubling slope differing by at
# least 1/10. A finished cross-j maximum strictly below 1/10, with the
# gates in EXP-JINV-7b3d63 passing, is the concrete negative. This
# record does not assert that the gap is at least 1/10.
# =============================================================================
hypothesis:
  id: H-JINV-f20ba3
  question_id: RQ-JINV-8fc13a
  source_idea_ids:
    - IDEA-20261006-fc2714
  added: '2026-10-06'
  status: approved
  proposed_by: coordinator
  title: >-
    Orbit-normalised doubling-slope character gap between j=1728 and a
    matched-trace ordinary curve over F_29
  statement: >-
    Over F_29, let trace mean #E(F_29)-(29+1), computed by enumerating
    points. Let the orbit-normalised mean of a curve be the average of
    the Legendre symbol (λ/29) of the doubling slope
    λ=(3x^2+A)/(2y) on Aut-orbit representatives of affine points with
    nonzero y. The idea's prediction is that there exist an ordinary
    curve of j-invariant 1728 and an ordinary curve with j-invariant
    outside {0, 1728}, with equal trace, whose orbit-normalised means
    differ by at least 1/10. The same maximum inside one j-class
    (both j=1728, or both outside {0, 1728}) is predicted to lie
    strictly below 1/10; if it does not, the cross-j comparison is not
    scored. A finished cross-j maximum strictly below 1/10, after an
    ordinary j=1728 curve and a matched-trace partner both exist, the
    same-j maximum is strictly below 1/10 or there is no same-j pair,
    and the doubling-slope character is not a function of itself under
    doubling, is the concrete negative. No exponent improvement is
    claimed. The exponent stays 1/2.
  mechanism: >-
    The tracked value is the Legendre symbol of the doubling slope on
    the short-Weierstrass model, not the character of a division
    polynomial. An isomorphism (x,y) mapped to (u^2 x, u^3 y)
    multiplies λ by u^{-1}, and a nonsquare u can flip the symbol, so
    the symbol is not a function of the abstract group element. Means
    are taken on rational Aut-orbit representatives so a raw gap that
    is only |Aut|=4 versus |Aut|=2 is removed before the claim is
    scored. Matched trace keeps the comparison inside one point count.
    Neither a gap of 1/10 nor its absence changes the automorphism
    discount √4 on j=1728 or the generic exponent 1/2.
  assumptions:
    - >-
      Trace is #E(F_29)-(29+1). Two curves are matched only when those
      integers are equal. A curve is ordinary when that integer is
      not 0. Supersingular models are excluded.
    - >-
      Orbit representatives are orbits under the rational automorphism
      group actually present: identity and negation always, and the
      two extra maps through a square root of -1 only when each map
      sends the curve to itself.
    - >-
      One lex-smallest short-Weierstrass model is kept per
      F_29-isomorphism class. j=0 models are census-only and are not
      a cross-j partner.
    - >-
      No walk is run and no factor base is built. The scored quantity
      is a character mean.
  proof_search_map:
    bottleneck: >-
      Whether any matched-trace pair still has an orbit-normalised
      character gap of at least 1/10 after Aut-orbit means replace
      point means.
    baseline_embedding:
      parameter_slice: >-
        The √4 versus √2 constants in KR-RHO-0528e7 and KN-TECH-018.
        No rho walk is reproduced.
      reproduction_check: >-
        For a j=1728 model, confirm the equation is preserved by every
        retained automorphism over F_29, including negation.
    observation_collision:
      observable: >-
        The orbit-normalised mean of (λ/29) on doubling-eligible
        Aut-orbit representatives.
      distinct_preimage_search: >-
        Two curves with the same trace and different j-class whose
        means differ by at least 1/10 are the positive instance. Two
        same-j curves with the same trace whose means already differ
        by at least 1/10 show the threshold is inside same-j
        dispersion, and the cross-j claim is then not scored.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The Aut-orbit mean of the doubling-slope character, which
          strengthens a raw point mean by killing orbit multiplicity.
        predicted_gain: >-
          A gap of at least 1/10, or a falsification that no matched
          pair reaches 1/10.
    quantifier_order: >-
      There exists an ordinary E with j(E)=1728 and an ordinary E'
      with j(E') not in {0, 1728}, both over F_29, such that
      trace(E)=trace(E') and the absolute difference of their
      orbit-normalised slope-character means is at least 1/10, and
      the same-j maximum is strictly below 1/10.
    method_ceiling:
      strongest_certifiable_claim: >-
        A toy gap or its absence on the finite set of isomorphism
        representatives over F_29. Not a rho speedup and not a
        statement at another prime.
      nearby_object_control: >-
        Pairs of ordinary curves with the same trace and the same
        j-class (both generic, or both j=1728). If those pairs already
        reach gap 1/10, the cross-j claim is not separable from
        same-j scatter and is not scored.
    proof_obligations:
      - claim: Trace equality is an enumerated point count, not an isogeny walk.
        responsibility: correctness
      - claim: A gap of 1/10 at p=29 does not change exponent 1/2.
        responsibility: scope
    not_applicable_reason: >-
      This is a measurement of a character mean, not a theorem, bound,
      certificate, reduction, or closure. The map audits that
      measurement only.
  rerandomization: >-
    No re-randomizing walk is used. The census is the full set of
    lex-smallest models over one prime. Nothing pulls a discrete
    logarithm back to an input instance.
  asymptotic_claim:
    problem: prime-field ECDLP
    prior_best: >-
      automorphism-discounted Pollard rho, iteration factor √4 on
      j=1728 and √2 on generic ordinary curves, exponent 1/2
    time_exponent: '1/2, unchanged; this hypothesis does not move it'
    memory_exponent: O(1) for rho, unchanged; the census stores O(1) models at p=29
    hidden_cofactor: none; no attack cost is proposed
    claim_kind: constant_factor
    claim_kind_note: >-
      The constant factor against rho is 1. claim_kind is filled so
      the non-claim is explicit. A character-mean gap is not an
      iteration count and is not claimed as a speedup past √4.
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        Inside one j-class and one trace, the orbit-normalised mean of
        a ±1 function on N_orb representatives disperses by about
        N_orb^{-1/2} if the signs were independent fair coins. The
        check used here is the idea's own tail gate: the most extreme
        same-j matched-trace gap is compared with 1/10. The comparison
        is exact rational arithmetic in EXP-JINV-7b3d63. It is not a
        model of large-p character sums, and it does not use a Weil
        estimate.
      random_model_justification: >-
        Binomial variance for independent fair signs on a fixed finite
        set. A Weil character-sum bound would be the classical theorem
        this imitates and is not used as support. KN-TECH-018, opened
        in this session, supplies the orbit normalisation, not the
        variance.
      supporting_results: []
      validation_experiment_ids:
        - EXP-JINV-7b3d63
      falsification_condition: >-
        The maximum same-j matched-trace orbit-normalised gap is at
        least 1/10. That observation means the cross-j comparison is
        not separable from same-j scatter. The cross-j claim is then
        not scored. The flag does not convert a gap below 1/10 into a
        gap of at least 1/10, or the reverse.
  structural_ingredients:
    - description: >-
        An automorphism group of order m multiplies rho iterations by
        √m. j=1728 carries √4. This hypothesis does not count
        iterations.
      citation: KR-RHO-0528e7
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-0528e7.yaml
        on 2026-10-06
      role: fence around the √4 iteration constant
    - description: >-
        The rho baseline already charges √|Aut|. A prime-field
        advantage must beat that discounted baseline. This measurement
        is scored only after orbit means.
      citation: KN-TECH-018
      provenance: internal
      verified_by: >-
        design session opened knowledge/techniques/KN-TECH-018.md
        on 2026-10-06
      role: orbit-normalisation calibration
    - description: >-
        Curves over a finite field are isogenous if and only if they
        have the same number of points, hence the same trace. Matched
        trace keeps the comparison inside one point count. This
        hypothesis does not walk an isogeny.
      citation: KR-RHO-755e35
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
        on 2026-10-06
      role: matched-trace control, not an isogeny walk
    - description: >-
        Weil descent of S_3 to F_2 has first fall degree 2 because the
        field trace of x is a group morphism to F_2. The trace in this
        hypothesis is the integer #E-(p+1).
      citation: KR-IC-f5c584
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-f5c584.yaml
        on 2026-10-06
      role: fence around binary trace descent
    - description: >-
        A generic algorithm on a prime-order group needs Ω(√p) group
        operations. A character mean at one prime does not change that
        exponent.
      citation: KR-RHO-13bf67
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
        on 2026-10-06
      role: unchanged complexity baseline
    - description: >-
        The negation map gives a √2 iteration factor and creates
        fruitless cycles. This hypothesis does not walk.
      citation: KR-RHO-fb88e6
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-fb88e6.yaml
        on 2026-10-06
      role: fence around negation-map walks
    - description: >-
        Bounded-degree algebraic factor bases over a generic
        prime-field subgroup are scoped out, and the universal
        statement is open. This hypothesis declares no factor base.
      citation: KN-OPEN-020
      provenance: internal
      verified_by: >-
        design session opened knowledge/open-problems/KN-OPEN-020.md
        on 2026-10-06
      role: fence around factor bases
  reduction_chain:
    core_problem: toy character-mean gap at one prime
    corollaries: []
  predictions:
    - metric: >-
        maximum, over matched-trace ordinary pairs with one j=1728
        curve and one j outside {0, 1728}, of the absolute difference
        of orbit-normalised means of (λ/29)
      direction: different
      minimum_effect: >-
        At least 1/10, the source idea's 0.10 written as an exact
        rational. A finished maximum strictly below 1/10, with the
        gates passing, is the concrete negative.
    - metric: >-
        the same maximum restricted to pairs inside one j-class, both
        j=1728 or both outside {0, 1728}
      direction: lower
      minimum_effect: >-
        Strictly below 1/10. If the same-j maximum is at least 1/10,
        the cross-j claim is not scored.
  test_boundary:
    instances:
      - lex-smallest short-Weierstrass models over F_29
    parameters:
      p: 29
      gap_numerator: 1
      gap_denominator: 10
      j_special:
        - 0
        - 1728
    implementation: >-
      Enumerate isomorphism representatives, drop singular and
      supersingular models, average (λ/29) on Aut-orbit
      representatives, and compare matched-trace gaps as exact
      rationals. No discrete-log search and no walk.
    budget:
      census: full
      maximum_runs: 1
  falsification_conditions:
    - >-
      Every matched-trace cross-j pair has orbit-normalised gap
      strictly below 1/10, an ordinary scoreable j=1728 curve exists,
      a matched partner exists, the same-j gate does not block
      scoring, and the doubling character is not a function of itself.
      That finished maximum is the concrete negative.
    - No ordinary j=1728 curve exists over F_29.
    - >-
      No ordinary curve with j outside {0, 1728} shares a trace with
      an ordinary j=1728 curve.
    - >-
      The same-j matched-trace gap already reaches 1/10, so the
      threshold does not isolate j and the cross-j claim is not scored.
    - >-
      (λ(2P)/29) is a function of (λ(P)/29) alone on a tested curve
      that has at least two doubling-eligible points with 2P also
      eligible, so the branching description is wrong for that curve
      and the mean is not scored.
  interpretation_limits:
    - >-
      A gap at or below the √|Aut| calibration is not an attack. This
      claim is about a character mean, not about iteration counts.
      KR-RHO-0528e7 already fixes the iteration constant.
    - Toy scope is F_29 only. No transfer to a larger prime.
    - >-
      The character is of the doubling slope. It is not the Legendre
      symbol of a division polynomial.
    - Not a factor base and not a KN-OPEN-020 description.
    - >-
      KR-IC-f5c584 is a binary S_3 descent statement. This census does
      not form S_3. The word trace here is #E-(p+1).
    - >-
      A point-count failure or an automorphism that fails its curve
      check is not a gap below 1/10.
