# =============================================================================
# H-BINSTD-958766 -- Schema-typed, write-once-sharded reachability-table
# carrier + CI-style validator for RQ-BINSTD-b6f698.
# Specified from IDEA-20260922-6028ed under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Approved DEC-20261002-11fcfd.
#
# ZERO RUNS in this design packet. Infrastructure / tooling only. Incorporates
# HOLD-F / review corrections: per-cell sharding, extended schema fields,
# ECC2K-130 hand row, seed only re-derived cells. No AUXIN. No Bedrock.
# Unlocks the maintained reachability-table decision target of RQ-BINSTD.
# =============================================================================
hypothesis:
  id: H-BINSTD-958766
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-6028ed
  experiment_id: EXP-BINSTD-1efa8e
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-11fcfd
  status: approved
  proposed_by: coordinator
  title: >-
    A write-once-sharded, schema-typed reachability-table carrier with
    certificate-hash and supersession checks catches the named Σ_ledger
    staleness modes on a six-case synthetic battery (6/6) without research
    compute

  statement: >-
    CLAIM (tooling / infrastructure). RQ-BINSTD-b6f698's decision target names
    a maintained reachability table (STRUCTURALLY_EMPTY / COMPUTED / OPEN per
    cell), but as of design time that object exists only as prose across
    proposals and audit README text — nothing detects when a cell's
    certificate artifact or cited input record goes stale. HYPOTHESIS: one
    write-once file per cell under
    analysis/binstd-curve-audit/reachability/<curve>/<column>.yaml (corrected
    from IDEA-20260922-6028ed's single-YAML proposal per HOLD-F /
    CLAUDE.md concurrency sharding), plus tools/validate_reachability_table.py
    following tools/validate_ledger.py's check_* pattern, jointly catch the
    named Σ_ledger staleness modes (certificate byte-change; missing input
    id; superseded input; malformed missing_quantity; false-positive on
    unrelated ledger append) on a six-case synthetic-mutation battery at
    6/6, with 100% transcription fidelity on seeded re-derived cells and a
    generated table view that is gitignored and rebuilt. CLAIM TIER:
    infrastructure instrument + synthetic battery. NO attack. NO exponent.
    NO curve cost bound. NO break.

  mechanism: >-
    OBJECT FRAME (tooling analogue). Tracked object: the reachability CELL
    as a typed record (verdict + pointers), not a curve point. Operation set
    Σ_ledger = {supersede(record_id), re-run_and_change(artifact),
    append(new_record)} — the mutations concurrent worktrees actually perform.
    Lossy projection: cell retains ~ten short fields and discards prose;
    truth value is forced stale (caught by validator) iff a named pointer is
    touched. CORRECTED STORAGE: one write-once file per cell with
    superseded_by; generated aggregate view is derived and gitignored
    (knowledge/INDEX.md pattern). CORRECTED SCHEMA fields beyond the idea's
    original list: unit (controlled vocabulary), m (arity, when applicable),
    floor_bits, budget_bits (with formula and N), rho_convention
    (CORR-20260922-81aeab), provenance_tier in
    {proposal_arithmetic, analysis, evidence}. Live checks: (i) certificate
    sha256 re-hash; (ii) input existence + no superseded_by; (iii)
    informational open-cell liveness grep (non-blocking). WHAT IS NEW: first
    schema-typed CI-checkable carrier for the RQ-BINSTD reachability table,
    with HOLD-F sharding and schema extensions frozen before seeding.

  assumptions:
    - >-
      Certificate-hash + supersession checks are sufficient for the three
      named Σ_ledger operations; content drift without formal supersession
      is out of scope (disclosed; program immutability makes it rare).
    - >-
      missing_quantity controlled vocabulary is maintained by hand; string
      match is not semantic understanding.
    - >-
      This hypothesis does not compute any curve cost; Stage-1 seeding is
      transcription of independently re-derived arithmetic only
      (provenance_tier: proposal_arithmetic).
    - >-
      ECC2K-130 is absent from the OpenSSL dump and must be hand-seeded from
      KN-LIT-661e97 (129-bit prime ℓ, h=4) and CORR-20260922-81aeab rho
      convention.
    - >-
      No group arithmetic, Magma/Sage, AUXIN, or Bedrock is required for
      any stage of EXP-BINSTD-1efa8e.

  proof_search_map:
    bottleneck: >-
      Whether the typed pointers (certificate hash, input record IDs, schema
      vocabulary) are sufficient to detect every named Σ_ledger staleness
      event. If a mutation silently invalidates a cell without touching a
      recorded pointer, the validator gives false confidence — worse than
      no tool. The six-case battery exists to probe this before any CI
      proposal.
    baseline_embedding:
      parameter_slice: >-
        Incumbent = prose-only reachability verdicts (analysis/binstd-curve-
        audit/README.md; IDEA-20260922-77bf31 claim prose; no machine check).
        Degenerate case of this proposal with the validator disabled.
      reproduction_check: >-
        Zero-compute: every required schema field for seeded cells must
        already have a prose analogue in the cited source arithmetic /
        audit; any required field without a prose analogue is reported as a
        schema gap (O-SCHEMA-GAP), not fabricated.
    observation_collision:
      observable: 'The reachability table says cell (curve, column) = X.'
      distinct_preimage_search: >-
        Four preimages currently collide in prose: (i) still-true + pointers
        intact; (ii) certificate bytes changed; (iii) cited input superseded;
        (iv) OPEN missing_quantity later supplied. Identifying tuple after
        this contract: (verdict, hash_status, supersession_status,
        open_liveness_flag).
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold printed verdict fixed; vary hidden staleness state across the
          four preimages via scratch-copy mutations.
        predicted_gain: >-
          Converts "table says X" into a machine-checked claim with a named
          failure mode per state. No research result about any curve.
      - transform: specialization_pack
        proposed_object: >-
          Six-case synthetic battery as specialisation of Σ_ledger's three
          operations plus valid and false-positive controls.
        predicted_gain: >-
          Makes "the validator works" a falsifiable, tested claim rather
          than design-by-inspection.
    quantifier_order: >-
      FOR EVERY seeded cell whose certificate re-hashes to the pinned sha256
      AND whose every input record_id exists with no superseded_by: validator
      emits no failure. FOR EVERY cell where either check fails: validator
      names the cell and the failing pointer. NOT CLAIMED: completeness of
      staleness detection beyond Σ_ledger; correctness of underlying research
      content; any ECDLP cost bound.
    method_ceiling:
      strongest_certifiable_claim: >-
        For the frozen per-cell schema and the six synthetic-mutation cases,
        the validator passes the two valid cases and fails each of the four
        injected-failure cases, naming the specific cell and pointer; seeded
        numbers match independent re-derivation to 0.01 bit.
      nearby_object_control: >-
        Case 6 (unrelated ledger append must PASS) distinguishes dependency
        tracking from a tripwire on ledger size; scratch-copy discipline
        prevents live corruption.
    proof_obligations:
      - claim: >-
          Seeded per-cell files validate cleanly against the schema with no
          fabricated verdicts (NOT_YET_ASSESSED for unfilled cells).
        responsibility: correctness
      - claim: >-
          Certificate-integrity check fires on a one-byte artifact change
          and does not fire when unchanged.
        responsibility: correctness
      - claim: >-
          Provenance-freshness check fires on superseded input and not on
          unrelated ledger change.
        responsibility: correctness
      - claim: Battery achieves 6/6 before any CI-integration proposal.
        responsibility: scope
      - claim: >-
          Storage is write-once per cell; generated table view is gitignored.
        responsibility: interface
      - claim: >-
          Every seeded cell carries unit, provenance_tier, and (where
          applicable) m / floor_bits / budget_bits / rho_convention.
        responsibility: schema

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Infrastructure only; no complexity claim on ECDLP or any attack family.

  heuristic_assumptions:
    - id: HEUR-BINSTD-6028ed-H0
      formal_statement: >-
        For the finite named set Σ_ledger = {supersede, re-run_and_change,
        append} and the validator's three mechanisms (hash re-verify,
        supersession lookup, informational liveness grep), every claim-(B)
        staleness scenario of IDEA-20260922-6028ed maps onto exactly one
        named operation and is caught by the corresponding mechanism on the
        six-case battery.
      random_model_justification: >-
        Not a distributional claim. Exhaustive enumeration of a finite
        named operation set (build-system dependency-graph analogue).
      supporting_results:
        - tools/validate_ledger.py check_schema_supersessions / check_cross_refs pattern (internal)
        - CLAUDE.md concurrency write-once / supersede-never-overwrite discipline (internal)
      validation_experiment_ids:
        - EXP-BINSTD-1efa8e
      falsification_condition: >-
        Any of battery cases 2–5 fails to name the injected cell/pointer, or
        case 6 falsely fails, or case 1 fails on the unmutated seed.

  structural_ingredients:
    - description: >-
        Existing ledger check_* / Ctx / supersession-lookup machinery to
        reuse rather than reimplement.
      citation: tools/validate_ledger.py
      provenance: internal
      verified_by: coordinator (design session 2026-10-02; function index via review)
      role: validator pattern
    - description: Write-once sharding precedent (goal checkpoints; derived INDEX.md).
      citation: CLAUDE.md concurrency section
      provenance: internal
      verified_by: coordinator (design session 2026-10-02)
      role: storage / concurrency discipline
    - description: Rho convention pointer for matched_rho cells.
      citation: CORR-20260922-81aeab
      provenance: internal
      verified_by: coordinator (path exists ledger/corrections/CORR-20260922-81aeab.yaml)
      role: schema field rho_convention
    - description: ECC2K-130 order / challenge parameters for hand-seeded row.
      citation: KN-LIT-661e97
      provenance: internal
      verified_by: coordinator (cited via IDEA-20260922-6028ed review ecc2k130_bearing)
      role: seed source for ECC2K-130 matched_rho and order facts
    - description: HOLD-F / queued_for_design disposition and concrete experiment.
      citation: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-6028ed.yaml
      provenance: internal
      verified_by: coordinator (read in full 2026-10-02)
      role: review corrections baked into this contract

  reduction_chain:
    core_problem: >-
      Give RQ-BINSTD-b6f698's decision target a checkable home that refuses
      silent certificate / supersession drift on seeded cells.
    corollaries:
      - problem: >-
          Downstream BINSTD / CERTBIN / FROB / QSP cells can be filed as
          write-once shards without inventing a fourth ad hoc prose format.
        reduction_ref: IDEA-20260922-6028ed claim (C) + HOLD-F sharding fix
        asymptotics_preserved: n/a (infrastructure)

  predictions:
    - metric: battery_pass_count
      direction: higher
      minimum_effect: 'FORCED 6/6; any score <6 blocks CI proposal and names the failing case'
    - metric: transcription_fidelity
      direction: higher
      minimum_effect: >-
        100% of seeded cells match independent re-derivation to 0.01 bit;
        any miss is O-SCHEMA-GAP or seed bug, not silently patched
    - metric: validator_runtime_seconds
      direction: lower
      minimum_effect: 'Advisory: sub-second on the seeded shard set (estimate)'
    - metric: open_cell_liveness_hit_rate
      direction: higher
      minimum_effect: >-
        Informational only on planted examples; a miss does not fail the
        battery

  test_boundary:
    instances:
      - schema_arm: 'per-cell YAML schema + validate_reachability_table.py'
      - seed_arm: >-
          ECC2K-130 hand row; FIPS / ANSI / selected dump rows; columns
          matched_rho, GHS_cover, subfield_rational_base,
          phi_stable_subspace_base, decomposition_m={2..8}, QSP, descent —
          only re-derived cells filled; else NOT_YET_ASSESSED
      - battery_arm: 'six named scratch-copy mutation cases'
      - view_arm: 'generated table view rebuild + gitignore discipline'
    parameters:
      storage: write_once_per_cell
      cell_root: analysis/binstd-curve-audit/reachability/
      generated_view: analysis/binstd-curve-audit/reachability_table.generated.yaml
      generated_view_gitignored: true
      battery_cases: 6
      seed_provenance_tier: proposal_arithmetic
      rho_convention: CORR-20260922-81aeab
      fidelity_tol_bits: 0.01
    implementation: >-
      experiments/EXP-BINSTD-1efa8e/implementation/ plus
      tools/validate_reachability_table.py; stdlib + PyYAML only; no
      Magma/Sage/cypari2; no AUXIN; no Bedrock.
    budget:
      maximum_runs: 5
      total_cpu_hours_advisory: 0.5
      wall_clock_seconds_advisory: 1800

  falsification_conditions:
    - battery_pass_count < 6 on first complete implementation → name failing case; revise before CI proposal.
    - Unmutated seed fails its own validator → schema/seed mismatch (O-SCHEMA-GAP).
    - Any seeded cell differs from re-derivation by >0.01 bit → transcription failure.
    - Single shared mutable YAML used as the live store → concurrency-contract violation (HOLD-F).
    - Claiming any ECDLP cost bound / break / exponent from this contract.

  interpretation_limits:
    - >-
      NO RESEARCH RESULT about any curve's cost, memory, or feasibility.
      Validator confirms pointer consistency, not scientific truth.
    - >-
      Seeded coverage is a small fraction of ~180 cells; NOT_YET_ASSESSED
      must not be read as STRUCTURALLY_EMPTY or OPEN.
    - >-
      Wiring into CI remains a separate Coordinator infrastructure decision
      after 6/6 (Stage 4 proposes, does not merge workflow edits as a
      research claim).
    - >-
      Scratch-copy battery does not exercise genuine concurrent-worktree
      races; that remains forward guidance.
    - >-
      Timeouts/crashes are failed_infrastructure (AGENTS.md rule 5), never
      refutation of HEUR-BINSTD-6028ed-H0.

  distinguishable_outcomes:
    - id: O-CARRIER-READY
      meaning: >-
        6/6 battery + 100% transcription fidelity + write-once shards +
        gitignored generated view → carrier ready to propose for CI.
    - id: O-SCHEMA-GAP
      meaning: >-
        Unmutated seed fails validator, or a required schema field has no
        prose analogue in seed sources — fix schema/seed before trusting
        any battery case.
    - id: O-BATTERY-FAIL
      meaning: >-
        Specific case among 2–6 fails (or case 1 after schema fix) — named
        design gap; revise validator; do not propose CI.
    - id: O-INSTRUMENT
      meaning: >-
        Implementation incomplete / paths missing with declared stop;
        do not read partial battery as math or infrastructure success.
    - id: O-IMPEDIMENT
      meaning: Budget/infra stop with measured quantity; never negative evidence.

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
