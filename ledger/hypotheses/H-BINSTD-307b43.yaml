# =============================================================================
# H-BINSTD-307b43 -- Subfield-rational FB STRUCTURALLY EMPTY on five c2pnb
# rows + deployed phi-stable F_{2^16}-subspace census. Specified from
# IDEA-20260922-6cf862 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Approved DEC-20261002-ad9ec8.
#
# ZERO RUNS in this design packet. Representation / certificate instrument.
# NO break. NO exponent. NO attack at m≥131. No AUXIN. No Bedrock.
# Unlocks reachability-table cells and is the prerequisite for
# IDEA-20260922-1b16d7 / IDEA-20260922-261004 graded constructions.
# =============================================================================
hypothesis:
  id: H-BINSTD-307b43
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-6cf862
  experiment_id: EXP-BINSTD-0fae5a
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-ad9ec8
  status: approved
  proposed_by: coordinator
  title: >-
    On the five composite-degree ANSI c2pnb curves the F_q-rational factor
    base is STRUCTURALLY EMPTY in G (certificate: h=#E(F_q), gcd(h,r)=1),
    and the phi-stable F_{2^16}-subspace census matches the preregistered
    (d,f,dim-set) table with c2pnb272w1 alone carrying every dimension 0..17

  statement: >-
    CLAIM (representation / certificate). Let q=2^16 and let the five
    composite-degree ANSI X9.62 rows be c2pnb176v1 (k=11), c2pnb208w1 (13),
    c2pnb272w1 (17), c2pnb304w1 (19), c2pnb368w1 (23), parameters as in
    analysis/binstd-curve-audit/ (OpenSSL 3.0.13 secondary source; primary
    re-derivation from ANSI X9.62 is in-scope for Stage 1 when available,
    else secondary is disclosed). Let G be the prime-order subgroup of
    order r and h the published cofactor. (A) For each of the five rows,
    E(F_q)=ker(φ−1) has order q+1−t equal to the published h, gcd(h,r)=1,
    and therefore G ∩ E(F_q)={O}: the F_q-rational factor base F_sub=E(F_q)
    is STRUCTURALLY EMPTY for targets in G, with emptying fact
    (h=#E(F_q) ∧ gcd(h,r)=1). (C) Independent factorization of T^k−1 over
    F_q yields factor counts (3,5,17,3,3) and phi-stable F_q-subspace counts
    (8,32,131072,8,8) with dimension sets exactly as preregistered in
    IDEA-20260922-6cf862 claim (C); only k=17 (c2pnb272w1) admits every
    dimension j∈{0..17}. Toy Stage-2 control: on admitted dk≤41 subfield
    cells, F_sub produces ZERO verified relations for targets in G and
    STRICTLY POSITIVE relations for matched cofactor-subgroup targets;
    Booth orbit-canonicalisation cost is O(k) word comparisons. CLAIM TIER:
    representation / certificate + toy observational control. NO break.
    NO exponent. NO transfer of toy relation rates to deployed m≥131 as an
    attack claim.

  mechanism: >-
    OBJECT FRAME. Representation: x-coordinates in the F_q[T]/(T^k−1)-module
    F_{q^k} (normal basis; φ = cyclic shift). Operation set Sigma:
    translation by factor-base elements together with ⟨φ⟩ of order k
    (PARTIAL-ACTION Class I). Tracked object: relation vector over the
    orbit-quotient base; ⟨φ⟩ acts on the index set. Lossy projection π
    discards which conjugate of an orbit representative a point is
    (log2 k bits/leg); degenerate fibre of π on F_q-rational points is
    exactly the empty part of F_sub under (A). Priced open number: Booth
    lexicographic-min of k cyclic rotations, O(k) word comparisons, charged
    per FB insertion and relation leg. OFF-LIMITS: Magma/Sage provisioning
    as the success path; AUXIN; deployed attacks; Semaev PDP races; Amazon
    Bedrock. WHAT IS NEW: deployed emptiness certificates for the five
    c2pnb rows plus the F_{2^16}-stable lattice census that no prior corpus
    record computed (IDEA-20260918-9abf42 scoped larger base field OUT).

  assumptions:
    - k odd prime, q=2^16; T^k−1=(T−1)Φ_k squarefree over F_q (all five rows).
    - r prime and r>h at published parameters (all five rows).
    - Normal-basis theorem for F_{q^k}/F_q (classical).
    - Arithmetic only; nothing here is an attack at m≥131.
    - OpenSSL 3.0.13 parameters are secondary; Stage 1 discloses provenance
      and prefers primary ANSI X9.62 when reachable without AUXIN provisioning.
    - General emptiness lemma of IDEA-20260906-a77711 is cited, not re-derived
      as new; this hypothesis instantiates it at deployed parameters.

  proof_search_map:
    bottleneck: >-
      Reachability of targets in G from the F_q-rational factor base F_sub,
      and the dimension lattice of phi-stable F_q-subspaces of F_{q^k} — the
      exact cells RQ-BINSTD-b6f698's reachability table needs before graded
      large-prime / rank-accounting successors can be designed.
    baseline_embedding:
      parameter_slice: >-
        analysis/binstd-curve-audit/ Weil-recursion cofactor certificates and
        OpenSSL-dumped A,B,h,r for the five c2pnb rows; IDEA-20260906-a77711
        general emptiness lemma at toy scale.
      reproduction_check: >-
        Recompute h=?#E(F_q) via Weil recursion from published cofactor and
        independently factor T^k−1 over F_{2^16}; agreement with preregistered
        (factor_counts, subspace_counts, dim_sets) is required before any
        STRUCTURALLY EMPTY cell is filed.
    observation_collision:
      observable: >-
        "STRUCTURALLY EMPTY (subfield-rational FB)" / "phi-stable dim lattice"
      distinct_preimage_search: >-
        Distinguish (i) hard-coded table playback without factorization,
        (ii) wrong field (F_2 lattice of IDEA-20260918-9abf42 mistaken for
        F_{2^16}), (iii) genuine independent factorization + Weil check.
        Planted wrong-factorization mutant and F_2-vs-F_{2^16} null separate
        these.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Certificate bundle: Weil h-check + gcd(h,r)=1 + T^k−1 factorization
          over F_{2^16} + stable-dimension set per k, plus toy F_sub
          zero/positive controls.
        predicted_gain: >-
          Fills five reachability-table cells and unlocks graded constructions
          that need a known non-empty stable lattice (esp. k=17 free dimension).
    quantifier_order: >-
      FORALL five c2pnb rows: EXISTS emptying certificate (h=#E(F_q) ∧
      gcd(h,r)=1) AND factorization agreeing with preregistered (C).
      FORALL admitted Stage-2 toy subfield cells: F_sub yield in G = 0 AND
      cofactor-arm yield > 0. NOT claimed: ECDLP break; exponent; deployed
      relation search; that high-degree algebraic FBs are empty for other
      reasons.
    method_ceiling:
      strongest_certifiable_claim: >-
        Five STRUCTURALLY EMPTY reachability-table cells with named emptying
        facts; deployed F_{2^16} phi-stable subspace census matching (C);
        toy F_sub zero/positive control confirming instrument can return
        both zeros and nonzeros.
      nearby_object_control: >-
        Positive control: same F_sub against cofactor-subgroup targets must
        produce relations. Null: prime-degree matched field (no intermediate
        F_{2^16}) must not admit an F_q-rational base of this form. Mutant:
        hard-coded factor table without running the factorizer must fail the
        Stage-0/1 audit.
    proof_obligations:
      - claim: h = #E(F_q) and gcd(h,r)=1 on all five rows
        responsibility: baseline
      - claim: T^k−1 factorization matches preregistered factor counts
        responsibility: correctness
      - claim: stable dim-sets and subspace counts match (C)
        responsibility: correctness
      - claim: toy F_sub yield in G is zero; cofactor arm positive
        responsibility: feasibility
      - claim: no Magma/Sage as success path; no break/exponent claim
        responsibility: scope
    not_applicable_reason: null

  asymptotic_claim: null

  heuristic_assumptions:
    - id: HEUR-BINSTD-6cf862-H0
      formal_statement: >-
        NONE FOR (A) OR (C). Emptiness certificates and the subspace census
        are unconditional finite arithmetic. Recorded so no reader supplies
        a heuristic that is not there.
      random_model_justification: >-
        Rigorous: Weil order formula, Lagrange + gcd(h,r)=1, normal-basis /
        F_q[T]/(T^k−1) ideal correspondence. No random model.
      supporting_results:
        - ref: IDEA-20260906-a77711
          provenance: internal
          claim: General emptiness of F_q-rational FB for targets in G.
        - ref: analysis/binstd-curve-audit/README.md
          provenance: internal
          claim: Five c2pnb rows are subfield curves over F_{2^16}; Weil check.
      validation_experiment_ids:
        - EXP-BINSTD-0fae5a
      falsification_condition: >-
        Independent factorization disagreeing with factor counts 3,5,17,3,3;
        OR a verified decomposition of a target in G over F_sub; OR a
        phi-stable subspace dimension outside the preregistered set.
    - id: HEUR-BINSTD-6cf862-H1
      formal_statement: >-
        FORALL admitted Stage-2 toy subfield cells with F_sub=E(F_q):
        relations_in_G = 0 exactly, AND relations_in_cofactor_arm > 0 at the
        rate of a size-matched random base inside a group of order h
        (positive control), over the frozen sample schedule.
      random_model_justification: >-
        Rigorous half: (A) forces zero yield in G. Classical: random-base
        hit rate inside a group of order h for the cofactor arm. Transfer:
        toy dk≤41 confirms the instrument; it does not transfer attack cost
        to deployed m.
      supporting_results: []
      validation_experiment_ids:
        - EXP-BINSTD-0fae5a
      falsification_condition: >-
        Any verified F_sub decomposition of a target in G on a toy cell;
        OR zero relations in the cofactor positive control (instrument
        defect — blocks reading (A)).

  structural_ingredients:
    - description: >-
        Pre-computed BINSTD curve audit (subfield membership + Weil recursion).
      citation: analysis/binstd-curve-audit/README.md
      provenance: internal
      verified_by: coordinator (design session 2026-10-02; README + scripts read)
      role: parameter/provenance substrate for Part 1
    - description: >-
        General F_q-rational emptiness lemma at toy scale.
      citation: IDEA-20260906-a77711
      provenance: internal
      verified_by: coordinator (cited via IDEA-20260922-6cf862; not re-opened)
      role: general lemma instantiated at deployed rows
    - description: >-
        Monic-divisor / phi-stable subspace correspondence over F_2
        (larger base field declared OUT of that record's scope).
      citation: IDEA-20260918-9abf42
      provenance: internal
      verified_by: coordinator (cited via IDEA-20260922-6cf862)
      role: lattice correspondence lifted to F_{2^16}
    - description: RQ-BINSTD reachability-table decision target.
      citation: ledger/questions/RQ-BINSTD-b6f698.yaml
      provenance: internal
      verified_by: coordinator (design session 2026-10-02)
      role: decision target / population

  reduction_chain:
    core_problem: >-
      Certificate that F_sub is empty in G on five c2pnb rows, plus the
      deployed F_{2^16} phi-stable dimension lattice.
    corollaries:
      - problem: >-
          Graded large-prime constructions that need a free dimension flag
          (IDEA-20260922-1b16d7) and rank accounting over the stable lattice
          (IDEA-20260922-261004).
        reduction_ref: >-
          Internal prerequisite named in IDEA-20260922-6cf862
          priority_rationale — not a published reduction.
        asymptotics_preserved: >-
          n/a — certificate/census; no asymptotic claim transferred.

  predictions:
    - metric: structurally_empty_cell_count
      direction: higher
      minimum_effect: '5/5 c2pnb rows STRUCTURALLY EMPTY with emptying certificate'
    - metric: factorization_factor_counts
      direction: different
      minimum_effect: 'exact match to (3,5,17,3,3) for k∈{11,13,17,19,23}'
    - metric: stable_subspace_counts
      direction: different
      minimum_effect: 'exact match to (8,32,131072,8,8)'
    - metric: toy_fsub_relations_in_G
      direction: lower
      minimum_effect: 'exactly 0 on every Stage-2 toy cell'
    - metric: toy_fsub_relations_in_cofactor
      direction: higher
      minimum_effect: 'strictly positive on every Stage-2 toy cell'
    - metric: booth_orbit_cost_word_comparisons
      direction: flat
      minimum_effect: '≤ 3k word comparisons; no field multiplications'

  test_boundary:
    instances:
      - deployed_arm: 'c2pnb{176v1,208w1,272w1,304w1,368w1} (k∈{11,13,17,19,23})'
      - toy_subfield_arm: 'admitted dk≤41 subfield cells (Stage 2)'
      - positive_control: 'F_sub vs cofactor-subgroup targets'
      - null_object: 'matched prime-degree field (no intermediate F_{2^16})'
      - mutant: 'hard-coded factor table without running factorizer'
    parameters:
      q: 65536
      k_values: [11, 13, 17, 19, 23]
      preregistered_factor_counts: [3, 5, 17, 3, 3]
      preregistered_subspace_counts: [8, 32, 131072, 8, 8]
      toy_dk_max: 41
      stdlib_preferred: true
    implementation: >-
      experiments/EXP-BINSTD-0fae5a/implementation/ (stdlib + reuse of
      analysis/binstd-curve-audit/ arithmetic patterns; may cite typed/gf2n.py
      patterns; no Magma/Sage/cypari2 as the success path).
    budget:
      maximum_runs: 16
      total_cpu_hours_advisory: 2
      wall_clock_seconds_advisory: 7200

  falsification_conditions:
    - Verified F_sub decomposition of a target in G (deployed certificate path or toy).
    - Independent T^k−1 factorization disagreeing with counts 3,5,17,3,3.
    - Explicit phi-stable subspace whose dimension is outside the preregistered set.
    - Zero relations in the cofactor positive control (instrument defect).
    - Booth cost measured superlinear in k (voids quotient pricing).
    - Claiming break / exponent / deployed attack from this contract.

  interpretation_limits:
    - >-
      STRUCTURALLY EMPTY is a reachability-table verdict with a named
      emptying fact; it is not evidence that all high-degree algebraic FBs
      fail (KN-OPEN-020 remains open for other constructions).
    - >-
      Toy Stage-2 confirms the instrument and the emptiness lemma at small
      scale; it does not transfer relation rates or attack cost to m≥131.
    - >-
      Timeouts/crashes/budget aborts are failed_infrastructure (AGENTS.md
      rule 5), never refutation of (A)/(C).
    - >-
      OpenSSL parameters are secondary; a primary ANSI mismatch is referred
      to Coordinator as provenance_disagree, not as math falsification of (A).

  distinguishable_outcomes:
    - id: O-CERT-EMPTY-5
      meaning: >-
        5/5 STRUCTURALLY EMPTY cells with certificates; factorization and
        dim-sets match (C); Stage-2 F_sub zero/positive controls pass →
        reachability-table column filled; unlocks 1b16d7/261004 design.
    - id: O-REFUTE-A
      meaning: Verified F_sub decomposition in G (emptiness refuted).
    - id: O-REFUTE-C
      meaning: Factorization or dim-set disagrees with preregistered (C).
    - id: O-INSTRUMENT
      meaning: >-
        Cofactor positive control yields zero, or mutant hard-coded table
        passes audit — instrument defect; (A)/(C) unread.
    - id: O-PROVENANCE
      meaning: >-
        Primary vs secondary parameter disagree; halt with both values;
        not math evidence against (A)/(C).
    - id: O-IMPEDIMENT
      meaning: >-
        Budget/infra stop with measured quantity; never negative math
        evidence.

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
