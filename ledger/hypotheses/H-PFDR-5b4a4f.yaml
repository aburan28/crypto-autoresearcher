hypothesis:
  id: H-PFDR-5b4a4f
  question_id: RQ-SBRG-f31cb2
  source_idea_id: IDEA-20260829-fa8235
  batch_id: BATCH-c64bee
  title: >-
    Batch reuse of a target-independent Macaulay row space is capped by the
    reciprocal of the target-dependent row fraction, 1/rho_D = t-1 -- but the
    source idea pre-registered discriminator, the 8-target xor_speedup with band
    [1.55, 2.00] and ceiling 2.00, IS WIDTH-ZERO BY ARITHMETIC: both competing
    explanations land at 1.78 and 1.88 inside the band and the ceiling is a
    supremum that no value of the rank ratio can exceed, so the discriminator is
    moved to the TARGET-BLOCK RANK ADMISSION RATIO, which separates them and
    which a planted dependent-row defect of known size is required to move by
    the predicted amount.
  statement: >-
    (A) THE ROW PARTITION, FIXED BEFORE ANY ARITHMETIC. In the Weil-descended
    chained system of EXP-SBRG-60c55e the generators split into S_struct (all
    S_3 constraints not involving the target x-coordinate) and P_R (the final
    target-specialised block). Over F_{2^n} a chain with t summands has t-1
    summation constraints, each descending to n boolean equations, of which
    exactly n belong to P_R and (t-2)n to S_struct. At Macaulay layer D the row
    count of a generator of boolean degree d is binomial(v, D-d) with v the
    boolean variable count, so the target-dependent row fraction is
    rho_D = [sum over P_R generators of binomial(v, D-d_i)] divided by the same
    sum over all generators. With a matched degree profile this collapses to
    rho_D = 1/(t-1), independent of D, of n, of the field basis, of the
    factor-base orientation and of the curve. Substituting the target as a
    constant can only LOWER boolean degrees, which RAISES binomial(v, D-d) and
    therefore RAISES rho_D, so rho_D >= 1/(t-1) in general and the asymmetry
    moves the ceiling in the safe direction.
    (B) THE CEILING. Under the elimination cost model "XOR count proportional to
    (rows reduced) x (pivots available) x (columns/64)" and the batch schedule
    "reduce S_struct once to a carrier, then reduce each target block against
    the carrier", the fully amortized speedup over a batch of K targets is
    speedup(K) = 1 / (rho_D + (1 - rho_D) (r_struct/r_full) / K), increasing
    monotonically in K to 1/rho_D. Consequences: the direct_t3 representation,
    which EXP-SBRG-60c55e declares with target_independent_groups 0 and the
    stated expectation of no batching benefit, has rho_D = 1 and ceiling exactly
    1.00; chain_t3 has ceiling 2.00; chain_t4 and balanced_t4 have ceiling 3.00.
    (C) THE BAND-NON-DEGENERACY FINDING, WHICH IS THIS RECORD PRINCIPAL
    ADDITION AND IS BLOCKING. IDEA-20260829-fa8235 pre-registers, at t = 3 and
    K = 8, the point prediction 1.78 with acceptance band [1.55, 2.00], and
    nominates "measured xor_speedup above 2.00" as its most valuable
    falsification -- the signature of the competing explanation that the target
    block is largely DEPENDENT on the fixed row space so its online rank
    contribution is sublinear. EVALUATING THE FORMULA SETTLES THIS WITHOUT ANY
    RUN. At rho_D = 1/2 and K = 8, speedup = 1/(0.5 + 0.5 r/8) where
    r = r_struct/r_full. The fully-dependent target block gives r = 1 and
    speedup = 1.778; the fully-independent target block gives r = 1/2 and
    speedup = 1.882; and the supremum over r in [0, 1] is attained at r -> 0
    with value exactly 2.000. SO BOTH COMPETING EXPLANATIONS LIE INSIDE THE
    BAND, ABOUT 0.10 APART IN A BAND OF WIDTH 0.45, AND THE NOMINATED
    FALSIFIER IS UNREACHABLE FOR EVERY POSSIBLE VALUE OF THE RANK RATIO. The
    xor_speedup band cannot fire in either direction and is retained only as a
    cost-model consistency check.
    (D) THE REPLACEMENT DISCRIMINATOR, WHICH DOES MOVE. Define the TARGET-BLOCK
    RANK ADMISSION RATIO a = (r_full - r_struct) / rows_targ, the fraction of
    the target block rows that add rank once the structural carrier is in place.
    Bookkeeping reuse predicts a = min(1, (cols - r_struct)/rows_targ), which at
    the under-determined parameters of the tested cells is 1 up to the generic
    deficit. Genuine reusable structural dependency predicts a strictly below
    that, and a is bounded in [0, 1] with the null at the top of its range, so
    the alternative has the entire interval to move into. The reported quantity
    is the EXCESS a(control) - a(real) against the degree-profile-matched
    planted boolean control at identical bipartition, degree histogram, D, n and
    K; the excess is zero under bookkeeping and positive under structural reuse.
    (E) THE DYNAMIC-RANGE REQUIREMENT. A planted defect of KNOWN SIZE is
    injected: exactly K_dep rows of the target block are replaced by known XOR
    combinations of structural rows. The measured a must fall by exactly
    K_dep / rows_targ. An instrument that does not move by the predicted amount
    when a dependency of known size is planted cannot be read when it fails to
    move on the real object, and its null means nothing.
    (F) THE FULLY CHARGED COMPOSITION AND THE HONEST HEADLINE. A reuse factor f
    applies to the per-trial decomposition cost D and to nothing else, because
    the conservation identity makes the mean yield geometry-invariant and the
    linear-algebra term a function of B alone. Composed through a two-term
    optimum of the form Theta((N D)^{2/(m+1)}), a factor f in D becomes
    f^{2/(m+1)} end to end, i.e. at most 2^{1/2} = 1.414 at m = t = 3 and
    3^{2/5} = 1.552 at m = t = 4. THIS LANE, AT ITS DERIVED CEILING AND WITH A
    FREE PRECOMPUTATION, IS WORTH AT MOST ABOUT 1.6x FULLY CHARGED AND MOVES NO
    EXPONENT. That composition inherits H-PFDR-064546 two-term model in full,
    including its unreviewed status; if that model is wrong, part (F) is wrong
    and parts (A)-(E) survive unchanged as statements about the instrument.
  mechanism: >-
    THE TRACKED OBJECT is the bipartition of the Macaulay row set into
    target-independent and target-dependent rows together with the four integers
    (rows_struct, rows_targ, r_struct, r_full). It discards every coefficient,
    every monomial label, the curve, the field basis, the factor-base
    orientation, the addition-tree topology and the target itself. It is lossy
    COMPATIBLY because the partition is determined by which generator produced
    each row, hence fixed before any arithmetic, and the batched schedule
    respects it exactly, so the retained counts propagate deterministically
    through the operation the algorithm performs.
    WHY THE XOR RATIO CANNOT SEPARATE THE EXPLANATIONS AND THE RANK RATIO CAN.
    Under the declared cost model the online arm is charged for reducing every
    target-derived row against the carrier, and that charge is a function of row
    COUNTS and pivot counts, not of whether a row turns out to be dependent -- a
    dependent row is discovered to be dependent only by being reduced. The rank
    ratio r_struct/r_full enters the formula only through a term divided by K,
    which at K = 8 damps it to a 0.10 effect. The rank admission ratio a, by
    contrast, IS the quantity the competing explanation is about, is measured
    directly by exact GF(2) rank rather than inferred from a cost, and is
    bounded in [0, 1] with the null at one end.
    WHERE THE ARGUMENT STOPS. It stops if the descended degree profiles of the
    structural and target blocks differ, which moves rho_D up and the ceiling
    down, so it stops in the safe direction and the exact rho_D is a measured
    degree histogram away. It stops for representations with no
    target-independent generator group, where rho_D = 1 by definition. It stops
    at any cost model with superlinear pivot cost or fill-in growth, which can
    violate the bound in EITHER direction.
  assumptions:
    - >-
      The elimination cost model "XOR count proportional to (rows reduced) x
      (pivots available) x (columns/64)" is the right first-order model for the
      specified in-tree bitset eliminator. If the implementation uses
      Four-Russians blocking the model acquires a log factor applying to BOTH
      arms, which cancels in the ratio to first order; this is checked by
      measuring the baseline arm XOR count against the model.
    - >-
      The batch schedule is frozen before any cell runs: reduce S_struct once to
      a carrier, then reduce each target block against the carrier. A different
      schedule has a different ceiling and the derivation does not apply to it.
    - >-
      r_struct/r_full is MEASURED, never assumed, and every point prediction is
      quoted at the measured value.
    - >-
      Reuse acts on the per-trial decomposition cost and on nothing else. This is
      forced by the conservation identity rather than chosen: mean yield is a
      geometry-independent double count, so no preprocessing can change it, and
      the linear-algebra term is a function of the factor-base size alone.
    - >-
      [verified verbatim] EXP-SBRG-60c55e declares targets_per_cell 8, the
      advance gate xor_speedup at least 1.25, direct_t3 with
      target_independent_groups 0 and the purpose note that no batching benefit
      is expected, chain_t3 with 1, chain_t4 and balanced_t4 with 2, the control
      CTRL-SBRG-DEGREE-PROFILE, and resource guards max_columns 200000 and
      max_rows 200000. Read by this coordinator by targeted search of the
      specification on 2026-09-04.
    - >-
      [inherited] The end-to-end composition in part (F) inherits the two-term
      model of H-PFDR-064546, which is itself a proposed hypothesis with no
      evidence behind it and whose own extension-field control has not been run.
  proof_search_map:
    bottleneck: >-
      The online per-target elimination cost. Everything the reuse mechanism can
      do lands there, and the exact step whose removal would change the answer is
      "reduce the target-derived Macaulay rows against the fixed carrier". The
      claim is that they cannot be skipped, because they are the only rows
      carrying the target.
    baseline_embedding:
      parameter_slice: >-
        The direct_t3 representation, where the target-independent generator
        count is zero, the formula returns rho_D = 1 and the ceiling is exactly
        1.00 for every K and every D. This is the specification own declared
        control and the derivation must reproduce its stated expectation as a
        number rather than as a sentence.
      reproduction_check: >-
        Symbolic plus a frozen fixture. Setting the structural generator count
        to zero must give speedup(K) = 1 identically; and at K = 1 the formula
        must give exactly 1 for every representation, since a single-target
        batch can amortize nothing. Any implementation reporting speedup above 1
        at K = 1 is measuring a different quantity and halts the line.
    observation_collision:
      observable: >-
        The single number xor_speedup for an 8-target batch -- and the point of
        this record is that the collision is TOTAL rather than partial.
      distinct_preimage_search: >-
        FOUND, EXHIBITED BY ARITHMETIC, AND IT IS BLOCKING. Pure bookkeeping
        reuse at rho_D = 1/2 with a fully dependent target block gives
        xor_speedup 1.778; a fully independent target block gives 1.882; the
        supremum over all rank ratios at K = 8 is exactly 2.000 and is not
        attained. Two structurally opposite situations therefore produce values
        0.10 apart inside a pre-registered band of width 0.45, and the nominated
        above-ceiling falsifier is unreachable for every rank ratio. The
        separating quantities are rows_targ, r_full - r_struct and the measured
        degree histogram, so a bare xor_speedup is PROHIBITED by this record and
        the primary discriminator is the rank admission ratio.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "how much can batch reuse save" by the row bipartition and its
          four counts, so the question becomes one ratio of binomial sums with no
          solver in it. Encoding: the partition is determined by generator
          provenance. Completeness: every row belongs to exactly one part.
          Soundness: the batched schedule respects the partition. Transfer:
          fails when degree profiles differ, and fails in the direction that
          lowers the ceiling. Cost loss: none.
        predicted_gain: >-
          Converts an open empirical gate into a derived ceiling at zero compute
          and supplies the number the specification control arm was written to
          expect. NO ATTACK EXPONENT IS MOVED IN EITHER DIRECTION.
      - transform: stronger_invariant
        proposed_object: >-
          Track the TARGET-BLOCK RANK ADMISSION RATIO
          a = (r_full - r_struct)/rows_targ rather than the cost ratio it is
          damped inside. It is measured by exact GF(2) rank, it is bounded in
          [0, 1], and the null sits at the top of its range.
        predicted_gain: >-
          A discriminator with demonstrated dynamic range, calibrated by a
          planted dependency of known size, in place of one that arithmetic
          shows cannot fire.
    quantifier_order: >-
      CLAIMED. FOR ALL n, FOR ALL Macaulay degrees D, FOR ALL field bases, FOR
      ALL factor-base orientations, FOR ALL chain topologies with t-1 summation
      constraints of which exactly one contains the target, FOR ALL batch sizes
      K, UNDER the stated elimination cost model and the stated batch schedule,
      xor_speedup <= 1/rho_D <= t-1.
      NOT CLAIMED, and load-bearing: FOR ALL cost models -- the bound is relative
      to the stated model, and a model with superlinear pivot cost or fill-in
      growth can violate it in either direction. NOT CLAIMED: FOR ALL reuse
      mechanisms -- this bounds row-space reuse and no other object, which is
      exactly why H-PFDR-05d754 exists beside it.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Under the stated elimination cost model and batch schedule, batch reuse
        of a target-independent Macaulay row space in a chained descended Semaev
        system cannot exceed a factor t-1, and the fully charged end-to-end gain
        cannot exceed (t-1)^{2/(m+1)}." It can NEVER certify anything about
        wall-clock solver time, about the Groebner solving degree, about reuse
        mechanisms based on other objects, or about the ECDLP.
      nearby_object_control: >-
        THE DEGREE-PROFILE-MATCHED PLANTED BOOLEAN CONTROL, which
        EXP-SBRG-60c55e already specifies and which is CURVE-FREE: a random
        boolean system with the identical degree profile and identical
        bipartition, containing no curve, no group law and no summation
        polynomial. The ceiling is a count and knows nothing about Semaev, so it
        MUST reproduce there. If the control shows a different value, the cost
        model is wrong or the implementation is sensitive to something the count
        does not see, and no conclusion may be drawn. If the control shows the
        same value and the real system does not exceed it, the measured reuse is
        bookkeeping and NOTHING may be described as a Semaev-specific or
        curve-specific effect.
    proof_obligations:
      - claim: 'A t-chain has t-1 summation constraints of which exactly one contains the target.'
        responsibility: baseline
      - claim: 'Row count at layer D is the sum over generators of binomial(v, D-d_i).'
        responsibility: correctness
      - claim: 'rho_D = 1/(t-1) under a matched degree profile and rho_D >= 1/(t-1) in general.'
        responsibility: strictness
      - claim: >-
          speedup(K) = 1/(rho_D + (1-rho_D)(r_struct/r_full)/K) with limit
          1/rho_D, and its value at K = 8, rho_D = 1/2 is 1.778 at rank ratio 1,
          1.882 at rank ratio 1/2, and has supremum exactly 2.000 that no rank
          ratio attains.
        responsibility: size
      - claim: 'speedup(1) = 1 identically, and direct_t3 gives 1.00 at every K.'
        responsibility: baseline
      - claim: >-
          The planted dependent-row defect of size K_dep moves the rank
          admission ratio by exactly K_dep/rows_targ.
        responsibility: feasibility
      - claim: >-
          The degree-profile-matched curve-free control reproduces the ceiling,
          and only the excess over it may be described as structural.
        responsibility: scope
      - claim: >-
          Measured XOR counts in the baseline arm track the cost model within a
          stated tolerance, or the model is reported as not applicable.
        responsibility: feasibility
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: 'fully charged relation-generation cost for chained descended Semaev systems'
    prior_best: 'no incumbent reuse pricing exists in this corpus'
    time_exponent: >-
      UNCHANGED. The bounded quantity is a constant reuse factor f <= t-1 on the
      per-trial decomposition cost; composed through a two-term optimum it is a
      factor (t-1)^{2/(m+1)}, about 1.41 at m = t = 3 and 1.55 at m = t = 4.
    memory_exponent: >-
      UNCHANGED for the attack. The precomputation adds a carrier of
      r_struct x C bits, under about 110 MB at the feasible cells, and does not
      change the factor-base or relation-matrix memory.
    hidden_cofactor: >-
      The ceiling is relative to one elimination cost model whose constant is
      fitted rather than derived; the composition inherits an unreviewed
      two-term model; the precomputation is treated as free on an asymptotic
      amortization that is FALSE at the 8-target batch actually measured, which
      is why the finite-K formula is quoted; and "constant at fixed arity" hides
      that t itself grows in the extension-field regime, where the ceiling
      becomes a polylog factor -- still not an exponent.
    claim_kind: constant_factor
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        GENERIC ROW INDEPENDENCE. At Macaulay layer D the target block
        contributes independent rows in proportion to its row count, so
        r_struct/r_full = 1 - Theta(rows_targ/rows_full) up to o(1) and the rank
        admission ratio a is 1 up to the generic deficit.
      random_model_justification: >-
        The rigorous ingredient is the exact row count, which is a definition of
        the Macaulay layer rather than an estimate, together with the bound
        rank <= min(rows, cols) and the fact that at the tested parameters rows
        is far below cols, so the rank is row-limited. The classical statement
        imitated is the generic-independence heuristic underlying every
        degree-of-regularity computation for semi-regular sequences. THE GAP is
        exactly the content of the question: if Semaev systems carry extra
        dependencies, HEUR-001 fails, and it fails in the direction that BREAKS
        the ceiling, which is why a broken ceiling is the most valuable outcome
        rather than a disappointment.
      supporting_results:
        - ref: EXP-SBRG-60c55e
          provenance: internal
          claim: >-
            The representations and their target_independent_groups counts, the
            8-target batch size, the 1.25x advance gate, the resource guards,
            and the degree-profile-matched control.
          verified_by: >-
            coordinator, TASK-20260904-9c61a9 (targeted search of the
            specification; the quoted fields read on the returned lines)
      validation_experiment_ids:
        - EXP-PFDR-726f4b
      falsification_condition: >-
        The excess rank admission ratio against the curve-free
        degree-profile-matched control exceeds the planted-defect resolution and
        persists over at least three increasing n and two master seeds.
    - id: HEUR-002
      formal_statement: >-
        ELIMINATION COST MODEL. The XOR count of reducing R rows against a
        carrier holding r pivots over C columns is c R r C / 64 for a constant c
        in [0.25, 1] depending only on the eliminator and not on n, t, D or the
        representation, so the ratio of two XOR counts under the same eliminator
        is independent of c.
      random_model_justification: >-
        The rigorous ingredients are that reducing one dense row against r pivots
        performs at most r word-XOR sweeps of C/64 words each, giving c = 1, and
        at least the number of pivots actually hit, which over GF(2) with dense
        rows is one half in expectation. The classical statement imitated is the
        standard dense-elimination operation count, and the imitation is exact
        because the specified eliminator is deterministic and its XOR count is
        reproducible bit for bit. THE GAP is sparsity: early rows are sparse and
        may skip whole words, lowering c more in the baseline arm than in the
        online arm and biasing the measured speedup DOWNWARD, away from the
        ceiling and in the safe direction.
      supporting_results: []
      validation_experiment_ids:
        - EXP-PFDR-726f4b
      falsification_condition: >-
        The fitted c falls outside [0.25, 1] or its residuals exceed 25 percent
        across at least a 20x range of rows times rank times columns. The model
        is not describing the eliminator and the ceiling must be restated as a
        row-count bound only.
  structural_ingredients:
    - description: >-
        The frozen chained-representation contract supplying the generator
        counts, the batch size, the control, and the resource guards.
      citation: 'experiments/EXP-SBRG-60c55e/specification.yaml'
      provenance: internal
      verified_by: coordinator, TASK-20260904-9c61a9 (targeted search; quoted fields read)
    - description: >-
        The conservation identity, used only to establish that a reuse mechanism
        can act on the decomposition cost and on nothing else.
      citation: KN-FIND-007
      provenance: internal
      verified_by: coordinator, TASK-20260904-9c61a9 (record read in full)
      role: forces the scope of what reuse can touch
    - description: >-
        The origin of the chained-S_3 boolean construction and the most likely
        location of prior art for the target-independence observation.
      citation: 'Semaev, New algorithm for the DLP on elliptic curves, arXiv 1504.01175'
      provenance: recalled
      verified_by: null
      role: >-
        possible prior art. NOT OPENED by any agent under this task, and the
        specification own reference block labels it retrieved on the authority
        of that contract author rather than of any agent here.
  reduction_chain:
    core_problem: >-
      No attack problem is reduced. The statement is a ceiling on one reuse
      mechanism under one cost model.
    corollaries: []
  predictions:
    - metric: >-
        P1 -- EXCESS RANK ADMISSION RATIO: a(curve-free control) - a(real), with
        a = (r_full - r_struct)/rows_targ measured by exact GF(2) rank at
        identical bipartition, degree histogram, D, n and K. UNITS:
        dimensionless fraction in [-1, 1]. THIS IS THE PRIMARY DISCRIMINATOR.
      direction: different
      minimum_effect: >-
        PREDICTED 0. A positive excess exceeding the planted-defect resolution
        and persisting over at least three increasing n and two master seeds is
        a genuine reusable structural dependency and breaks the ceiling account.
        The statistic is bounded in [0, 1] with the null at the top of its
        range, so the alternative has the whole interval to move into.
    - metric: >-
        P2 -- PLANTED-DEFECT CALIBRATION: the change in a when exactly K_dep
        rows of the target block are replaced by known XOR combinations of
        structural rows, for K_dep at 1, 2, 5 and 10 percent of rows_targ.
        UNITS: dimensionless fraction
      direction: different
      minimum_effect: >-
        FORCED to equal K_dep/rows_targ exactly. THIS IS THE DYNAMIC-RANGE
        DEMONSTRATION and it is blocking: an instrument that does not move by
        the predicted amount on a dependency of known size cannot be read when
        it fails to move on the real object, and every null from it is void.
    - metric: >-
        P3 -- measured xor_speedup at K = 8, chain_t3, against the derived
        formula at the measured rank ratio. UNITS: dimensionless ratio
      direction: different
      minimum_effect: >-
        RETAINED AS A COST-MODEL CONSISTENCY CHECK ONLY, and explicitly NOT as a
        discriminator between the two explanations. The arithmetic reason is in
        the statement: at rho_D = 1/2 and K = 8 the two explanations give 1.778
        and 1.882 and the supremum over every rank ratio is exactly 2.000, so
        the source idea band [1.55, 2.00] and its above-ceiling falsifier cannot
        fire. A measured value OUTSIDE [1.55, 2.00] therefore indicts the COST
        MODEL -- most plausibly online density growth -- and never the row
        partition.
    - metric: >-
        P4 -- measured xor_speedup for direct_t3, at every D and every K. UNITS:
        dimensionless ratio
      direction: different
      minimum_effect: >-
        FORCED 1.00 within 0.05. This representation has no target-independent
        generator group, so any reported reuse is an instrument artifact and
        halts the line. The cheapest integrity check in the design, one cell.
    - metric: >-
        P5 -- xor_speedup at K = 1. UNITS: dimensionless ratio
      direction: different
      minimum_effect: 'FORCED exactly 1.00. A one-target batch can amortize nothing.'
    - metric: >-
        P6 -- rho_D computed from the measured degree histograms, against
        1/(t-1). UNITS: dimensionless fraction
      direction: different
      minimum_effect: >-
        PREDICTED at or ABOVE 1/(t-1) and never below, because substituting the
        target as a constant can only lower boolean degrees and lowering d
        raises binomial(v, D-d). A measured rho_D below 1/(t-1) at any cell
        contradicts the substitution argument and must be hand-derived before
        anything else is reported.
    - metric: >-
        P7 -- ordering speedup(t = 4) against speedup(t = 3) at matched K.
        UNITS: dimensionless
      direction: higher
      minimum_effect: >-
        The t = 4 arms must exceed the t = 3 arms in EVERY seed. The ordering
        follows from the counts alone, so an inversion falsifies the partition
        account even if both land in band -- and unlike the band itself, the
        ordering is a comparison the arithmetic does not force to be
        indistinguishable.
    - metric: >-
        P8 -- charged end-to-end gain (measured f)^{2/(m+1)}, reported beside a
        matched Pollard rho operation count on the same instances under one
        frozen conversion. UNITS: dimensionless ratio
      direction: different
      minimum_effect: >-
        PREDICTED at most 1.6x and therefore exponent-neutral. Recorded in
        advance so no downstream summary can quote an XOR speedup as an ECDLP
        speedup. A charged gain above 2.0x at any cell means the composition
        through the two-term model is wrong and requires its own record.
    - metric: >-
        P9 -- sparse_density in the baseline and online arms, and peak resident
        memory per cell. UNITS: fraction; bytes
      direction: different
      minimum_effect: >-
        Density reported in BOTH arms per the specification own 4x caveat; peak
        memory predicted below 1 GiB and required to be reported so the
        prediction can fail. A resource stop is INFRASTRUCTURE signal and never
        negative mathematical evidence.
  test_boundary:
    instances:
      - 'ordinary binary curves, the Phase-A slice n in {8, 10, 12}, t in {3, 4}'
      - 'all four declared representations including the direct_t3 zero-reuse control'
      - 'CURVE-FREE: degree-profile-matched planted boolean systems at identical bipartition'
      - 'planted dependent-row variants at K_dep of 1, 2, 5 and 10 percent of rows_targ'
    parameters:
      n: '{8, 10, 12}; n = 14 and 16 at D = 5 are NOT run because the same arithmetic puts them past the specification own 200000-column guard'
      t: '{3, 4}'
      field_basis: '{power, normal}'
      orientation: '{prefix, random}'
      master_seeds: '3'
      K: '{1, 2, 4, 8} so the K-dependence can be fitted'
      schedule: 'frozen: reduce S_struct once to a carrier, then stream each target block against it'
      column_cap: 'about 1.0e5 at the largest admitted cell; dense matrix about 107 MB'
    implementation: >-
      Exact GF(2) rank for r_struct and r_full, never inferred; deterministic
      bitset eliminator with reproducible XOR counts; the reported quantity is a
