hypothesis:
  id: H-ECDLP-e32126
  question_id: RQ-JINV-8fc13a
  title: >-
    Replace the saturated degree meter with the graded Hilbert function of the
    m = 3 Semaev relation ideal, because a first-fall degree cannot fall below
    a null that already reads 2 and so cannot discriminate at all; the question
    is then whether special j moves the graded dimension vector after the
    automorphism grading is quotiented out, against a matched random curve at
    the same p and the same N
  statement: >-
    Source proposal IDEA-20260826-2259f8 (RQ-JINV-8fc13a, class
    representation).
    (A) THE INSTRUMENT GAP, RESTATED CORRECTLY AFTER READING THE EVIDENCE
    VERBATIM. The source proposal says the degree-of-regularity meter "reads
    d_reg = 2 flat in every arm at every factor-base degree (EV-REP-001,
    EV-REP-002)". THIS COORDINATOR SESSION READ BOTH RECORDS IN FULL AND THAT
    CHARACTERISATION IS PARTLY WRONG. EV-REP-001 records d_reg = 2 flat across
    d in {4, 6, 8, 12, 16} for the y-eliminated Weierstrass Semaev arm and for
    both Edwards arms, with vdim = 2. It ALSO records a third arm, W_native_x,
    the Weierstrass collinearity system with y explicit, whose d_reg GROWS from
    4 to 12 and whose vdim grows from 10 to 34. The meter therefore has
    demonstrated dynamic range; what is flat is the comparison BETWEEN the two
    well-formulated arms. EV-REP-002 extends the flat reading to m = 3 for both
    well-formulated arms across d in {4, 6, 8}, at vdim = 6, which is 3
    factorial.
    (B) THE CONSEQUENCE THE SOURCE PROPOSAL DOES NOT DRAW, AND IT IS FATAL TO
    ITS PROPOSED REPLACEMENT. The first-fall degree satisfies d_ff at most
    d_reg, and for a system of quadratics or higher d_ff is at least 2. If the
    matched-random null reads d_reg = 2, as the committed evidence indicates
    for the well-formulated m = 3 arm, then the null's d_ff is 2 and NO FALL OF
    AT LEAST ONE DEGREE IS AVAILABLE TO ANY SPECIAL-j CURVE. The proposed
    H-crack signature is forced to zero by the floor, not by the parameters,
    and swapping d_reg for d_ff does not restore dynamic range.
    (C) THE REPLACEMENT, COMPUTED RATHER THAN LOOSENED. The discriminating
    object is the GRADED HILBERT FUNCTION of the m = 3 relation ideal, namely
    the vector of dimensions of the degree-d graded pieces of the quotient ring
    for d from 0 to a declared bound, together with the total quotient
    dimension. That quantity is not floor-limited: the committed evidence shows
    it taking the values 2, 6, 10 and 34 across different arms in this very
    lane, so it demonstrably moves. CLAIM: after quotienting the zeta-grading
    induced by the automorphism action, the graded Hilbert vector of a
    special-j curve is IDENTICAL to that of a matched random curve at the same
    p and the same N, i.e. the special j-invariant is a support and coefficient
    relabelling the solving structure does not see.
    (D) THE CURVE-FREE OBLIGATION. The zeta-grading is a diagonal torus action
    and grades any polynomial ideal; a random graded system with no curve
    behind it reproduces the same grading structure. A curve-free null is
    therefore REQUIRED, and its consequence is pre-stated: if the artificially
    graded non-curve arm reproduces the special-j signature, the finding is
    about diagonally graded polynomial systems and not about CM curves.
    (E) NOT CLAIMED. Prime-field ECDLP has no known subexponential index
    calculus, so even a measured difference would be a structural finding and
    not an exponent move. It is reported as a test to run, never as a speedup.
  mechanism: >-
    The m = 3 Semaev system restricted to a factor base defines a
    zero-dimensional ideal whose solving structure is carried by its graded
    Hilbert function, not by a single degree scalar that has already saturated
    at its floor. Special j-invariants act on the DEFINING EQUATION: j = 0 sets
    a = 0 and j = 1728 sets b = 0, each removing a coefficient block. The
    automorphism zeta acts on the variables by the diagonal scaling x maps to
    zeta x, which grades the ideal by zeta-weight exactly. The automorphism
    discount lives entirely in that grading, since it partitions solutions into
    orbits of size |Aut|/2, so it appears as a symmetry of the graded
    dimensions rather than as a change in any single degree. Quotienting the
    grading first, then comparing graded dimension vectors, therefore separates
    the point-symmetry constant from any residual algebraic effect of special j,
    and the residual lives in the elimination ideal of the coordinate
    equations, not in the group law.
  assumptions:
    - >-
      Toy scale, p up to about 32 bits, N prime, m = 3 Semaev system
      constructible and its graded Hilbert function computable exactly.
    - >-
      The monomial order, the factor-base construction and the graded bound are
      FROZEN and hashed before any special-j curve is read. They are first-order
      determinants of every graded dimension and a change mid-run voids the
      comparison.
    - >-
      EV-REP-001 and EV-REP-002 concern the CURVE MODEL question, Weierstrass
      against twisted Edwards. Their flat readings have never been measured on
      the special-j question, and this hypothesis imports from them only the
      floor argument in limb (B), not any special-j conclusion.
  proof_search_map:
    bottleneck: >-
      Whether special j moves the graded Hilbert vector of the m = 3 relation
      ideal after the zeta-grading is quotiented out. That residual is the
      single quantity separating an algebraic solving effect from the
      point-symmetry constant.
    baseline_embedding:
      parameter_slice: >-
        A matched random curve with generic discriminant and |Aut| = 2 at the
        SAME p and the SAME N. Its graded Hilbert vector is the null. The
        committed m = 3 value of the total quotient dimension for the
        well-formulated arm is 6, and the null must reproduce it.
      reproduction_check: >-
        Frozen fixture: on a committed generic curve at a toy p, the graded
        Hilbert vector and the total quotient dimension must be reproduced by an
        INDEPENDENT Groebner implementation before any special-j curve is
        measured, and the total must equal 6 at m = 3 in agreement with
        EV-REP-002.
    observation_collision:
      observable: The graded Hilbert vector of the m = 3 relation ideal.
      distinct_preimage_search: >-
        A COLLISION EXISTS AND IT IS WHY THE GRADING IS QUOTIENTED FIRST. The
        zeta-grading produces a graded structure with |Aut|/2-periodic features
        that is IDENTICAL whether it arises from the automorphism discount or
        from a genuine solving effect. The separating datum is the graded
        vector AFTER quotienting; only a difference in the quotient is
        admissible as a special-j algebraic effect. A SECOND COLLISION IS ADDED
        HERE: a non-curve graded system reproduces the same structure, which is
        why the curve-free arm is blocking.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The zeta-graded quotient ring, in which the automorphism discount is
          an exact grading, so the hypothesis becomes a dimension comparison on
          graded pieces with separate encoding, completeness, soundness and
          transfer obligations.
        predicted_gain: >-
          Turns a vague question into an exact dimension comparison that cannot
          be confounded by the point-symmetry constant.
      - transform: stronger_invariant
        proposed_object: >-
          The graded Hilbert vector in place of the single degree scalar, chosen
          because the scalar is at its floor on the null and the vector is not.
        predicted_gain: >-
          Restores dynamic range to an instrument that has none, without
          weakening any threshold.
    quantifier_order: >-
      FOR EACH toy p and matched N, FOR the frozen monomial order, graded bound
      and factor-base construction, the graded Hilbert vector of a special-j
      curve either does or does not differ from the matched-random null after
      the zeta-grading is quotiented. NOT CLAIMED: a difference at some
      monomial order for some construction. Order-specific effects are
      instrument observations, not conclusions.
    method_ceiling:
      strongest_certifiable_claim: >-
        At toy N, in this monomial order and factor-base construction, the m = 3
        Semaev graded-quotient Hilbert vector of special-j curves does or does
        not differ from the matched-random null. It cannot certify a
        subexponential prime-field index calculus, which is not known to exist,
        an exponent move, or cryptographic-scale behaviour.
      nearby_object_control: >-
        A curve with random j but the SAME zeta-grading imposed artificially by
        a non-CM diagonal scaling of the equation. It carries the symmetry but
        not the CM order, so a difference present there and absent on the true
        special-j curve localises the effect in the grading rather than in the
        CM structure.
    proof_obligations:
      - claim: The null's graded Hilbert vector reproduces an independent
          Groebner implementation and totals 6 at m = 3.
        responsibility: baseline
      - claim: The first-fall degree cannot fall below a null that reads 2.
        responsibility: correctness
      - claim: The zeta-grading quotient removes the automorphism discount exactly.
        responsibility: strictness
      - claim: A planted extra solution raises the total quotient dimension by
          exactly the planted count.
        responsibility: soundness
      - claim: A non-curve graded system does or does not reproduce the signature.
        responsibility: scope
      - claim: No subexponential or exponent claim; prime-field ECDLP stays at 1/2.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: null
    prior_best: null
    time_exponent: null
    memory_exponent: null
    hidden_cofactor: null
    claim_kind: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        For a matched random ordinary curve, the m = 3 Semaev relation ideal
        under the frozen monomial order is zero-dimensional with total quotient
        dimension 6 and a graded Hilbert vector matching that of a generic
        system of the same degree sequence and variable count.
      random_model_justification: >-
        The relation ideal is expected to behave like a generic system of its
        Macaulay shape; deviations from genericity are exactly the signal
        sought, so the model is stated so it can fail.
      supporting_results:
        - ref: EV-REP-002
          provenance: internal
          claim: >-
            At m = 3 both well-formulated arms read d_reg = 2 flat across d in
            {4, 6, 8} with vdim = 6 equal to 3 factorial, and the planted
            3-decomposition is verified as a root, identical over 3 seeds.
          verified_by: >-
            coordinator, TASK-20260904-3baed3, read ledger/EV-REP-002.yaml in
            full
        - ref: EV-REP-001
          provenance: internal
          claim: >-
            At m = 2, d_reg = 2 flat with vdim = 2 for the y-eliminated
            Weierstrass Semaev arm and both Edwards arms, WHILE the W_native_x
            arm shows d_reg growing 4 to 12 and vdim growing 10 to 34. The
            record attributes that growth to explicit-y sign branches, i.e. to
            a suboptimal formulation and not to a model property.
          verified_by: >-
            coordinator, TASK-20260904-3baed3, read ledger/EV-REP-001.yaml in
            full; this is the record that refutes the claim that the meter is
            flat in every arm
      validation_experiment_ids: [EXP-ECDLP-815efc]
      falsification_condition: >-
        The matched-random null's total quotient dimension at m = 3 is not 6,
        or its graded Hilbert vector is not reproduced by an independent
        Groebner implementation.
    - id: HEUR-002
      formal_statement: >-
        The automorphism action x maps to zeta x induces an exact grading of the
        relation ideal by zeta-weight, and quotienting by it removes precisely
        the |Aut|/2 orbit collapse, leaving a residual graded Hilbert vector
        that is unchanged under the null hypothesis.
      random_model_justification: >-
        Diagonal torus actions grade polynomial ideals exactly, and the |Aut|/2
        orbit structure is a finite-group symmetry of the solution set rather
        than an asymptotic statement.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-815efc]
      falsification_condition: >-
        On a j = 0 curve the graded pieces do not reproduce the |Aut|/2 orbit
        count, or the artificially graded non-CM control shows a different
        graded structure from the true j = 0 curve at the same grading.
  structural_ingredients:
    - description: >-
        The automorphism-discounted rho baseline, against which any advantage at
        or below the square-root-of-|Aut| constant is baseline calibration
        rather than a finding.
      citation: KN-TECH-018
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-3baed3, confirmed the record exists at
        knowledge/techniques/KN-TECH-018.md; its constant is used only as a
        calibration boundary and a reviewer must read it before any advantage
        is compared against it
      role: the constant below which any effect is not a finding
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: graded_quotient_hilbert_vector_special_minus_null
      direction: different
      minimum_effect: >-
        PRE-REGISTERED NULL EXPECTATION: the two vectors are IDENTICAL entry by
        entry, and the total quotient dimension is 6 in both. Any single entry
        differing, surviving the artificial-grading control and the curve-free
        control, is the crack signature and triggers independent review before
        it is named.
    - metric: null_first_fall_degree_stage_0
      direction: different
      minimum_effect: >-
        MEASURED FIRST AND USED AS A GATE, NOT AS A RESULT. If the
        matched-random null's first-fall degree is 2, then no fall of at least
        one degree is available to any arm and the degree discriminator is
        DECLARED DEGENERATE, with the graded Hilbert vector serving as the
        primary statistic. The switch is pre-registered here so it cannot be
        chosen after seeing the special-j data.
    - metric: planted_extra_solution_recovery
      direction: higher
      minimum_effect: >-
        FORCED EXACT. Adjoining k extra known simple solutions to the relation
        ideal must raise the total quotient dimension from 6 to exactly 6 + k,
        for k in {1, 2, 4, 8}. A meter that cannot resolve k = 1 cannot resolve
        the effect under test and every number in the run is void.
    - metric: total_quotient_dimension_versus_discriminant_size
      direction: different
      minimum_effect: >-
        Flat under the null across the matched-order family. A monotone trend
        toward small discriminant surviving the twist and artificial-grading
        controls is reported with an exact permutation distribution, never as a
        bare dimension drop.
    - metric: curve_free_graded_system_signature
      direction: different
      minimum_effect: >-
        Reported with a PRE-STATED CONSEQUENCE. If a random polynomial system of
        the same degree sequence and variable count with an artificially
        imposed zeta-grading reproduces the special-j graded vector, the
        finding is about diagonally graded polynomial systems and NOT about CM
        curves, special j, or the ECDLP, and the evidence record must say so.
  test_boundary:
    instances:
      - matched random ordinary curves with generic discriminant and |Aut| = 2
      - j = 0 and j = 1728 curves at the SAME p and the SAME N
      - a random-j curve carrying an artificially imposed zeta-grading
      - a quadratic twist at matched discriminant
      - a curve-free random graded system at matched degree sequence
    parameters:
      m: 3
      primes: three toy primes up to about 2^32
      monomial_order: frozen and hashed before Stage 2
      graded_bound: declared before Stage 1
    implementation: >-
      Exact Groebner computation with graded dimension bookkeeping, plus an
      INDEPENDENT second implementation for the null.
    budget:
      wall_clock_seconds: 7200
      memory_gb: 8
      maximum_runs: 30
  falsification_conditions:
    - >-
      The null's graded Hilbert vector does not match the independent Groebner
      reimplementation. Instrument failure; no special-j comparison is reported.
    - >-
      The planted-solution ladder does not recover 6 + k exactly. The meter
      cannot resolve the magnitude under test and the run is void.
    - >-
      MAIN NEGATIVE, AND IT IS A RESULT. The graded-quotient Hilbert vectors of
      special-j curves equal the matched-random null across the discriminant
      sweep. The algebraic-solving channel of this question is closed at toy N
      with the named obstruction that special j is a support and coefficient
      relabelling the solving structure does not see.
    - >-
      A graded-quotient difference survives the artificial-grading control.
      Work STOPS for independent review before any record states an algebraic
      advantage.
    - >-
      The curve-free graded system reproduces the same signature. Any measured
      difference is then about graded polynomial systems and may not be
      reported as a statement about CM curves or the ECDLP.
  interpretation_limits:
    - >-
      claim_tier toy; toy N; no cryptographic-scale statement.
    - >-
      Prime-field ECDLP has no known subexponential index calculus, so even a
      measured graded difference is a structural finding and NOT an exponent
      move. It is reported as a test to run, never as a speedup.
    - >-
      THE SOURCE PROPOSAL'S CHARACTERISATION OF THE EVIDENCE IS CORRECTED HERE.
      EV-REP-001 does not show a flat meter in every arm; its W_native_x arm
      moves from d_reg 4 to 12 and vdim 10 to 34. What is flat is the
      comparison between the two well-formulated arms, and that flatness is
      exactly what makes the degree scalar unusable as a discriminator.
    - >-
      EV-REP-001 and EV-REP-002 answer the CURVE MODEL question, not the
      special-j question. Nothing in them measures special j, and this
      hypothesis imports only the floor argument from them.
    - >-
      Any advantage at or below the square-root-of-|Aut| discount is baseline
      calibration and is recorded as such, not as a finding.
    - >-
      No automorphism-stable or equivariant factor base is constructed; the
      object is the graded structure of a fixed relation ideal.
  status: proposed
  proposed_by: idea-generator
