  title: >-
    The integer 8191 has 12 doublings and 12 additions
  statement: >-
    The integer 8191 has bit length 13. Its bits are thirteen 1s.
    Reaching it by doubling and adding uses 12 doublings and 12
    additions. Thirteen exceeds twelve by 1. Twelve equals twelve, so
    that gap is 0. The product of 13, 12, and 12 is 1872. Their sum is
    37. Two readings of the addition count are both 12, so that gap is
    0 and their product is 144.
  mechanism: >-
    The proposal writes the counts 13, 12, and 12. This contract
    checks those integers. It does not add a curve point.
