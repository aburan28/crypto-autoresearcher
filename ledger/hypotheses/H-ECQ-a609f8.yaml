hypothesis:
  id: H-ECQ-a609f8
  question_id: RQ-ECQ-80f23c
  supersedes: H-ECQ-d60d07
  supersedes_reason: >-
    H-ECQ-d60d07 aimed at the ICARM r>=15 naive-height cell on the Coordinator's judgement that
    the cell was SOFT. The BATCH-f2341e red team broke that: program-conditioned permutation
    takes the 85.19 -> 118.77 step from p < 3.3e-5 to p = 0.21747, and restricted to Mestre-family
    specialisation the per-rank minima are 206.81(12) 136.69(13) 134.43(14) 118.77(15) 141.59(16)
    136.79(17) 159.97(18) 166.83(19) 200.28(20) -- so 118.77 at rank 15 is that method's GLOBAL
    BEST across every rank. The old hypothesis targeted the one cell where its own method had
    already peaked. This record replaces the target and the family; the height MECHANISM survives
    unfalsified and is carried forward narrowed.
  statement: >-
    NAGAO-1994, of generic Mordell-Weil rank EXACTLY 12 over Q(t) (Scholten, arXiv:math/9709235,
    Corollary 1), specialised at small rational t and certified by exact descent, produces curves
    over Q whose minimal models are small enough to take at least one PRE-DECLARED cell of the
    frozen ICARM frontier. The pre-declared targets, fixed here BEFORE any candidate curve exists,
    are, in priority order: minimum naive height at r>=12 (69.33878142645637), at r>=13
    (75.75973380404125), and at r>=14 (85.18925824647027).
  target_cells_predeclared:
  - {rank_threshold: 12, metric: naive_height, incumbent: 69.33878142645637, curve_id: 157}
  - {rank_threshold: 13, metric: naive_height, incumbent: 75.75973380404125, curve_id: 158}
  - {rank_threshold: 14, metric: naive_height, incumbent: 85.18925824647027, curve_id: 244}
  target_cells_excluded:
  - rank_threshold: 15
    reason: >-
      EXCLUDED DELIBERATELY. 118.77 is the Mestre-specialisation global best over all ranks, so
      aiming there means beating the best result that method class has ever produced. That was
      the old hypothesis's error and it is not repeated.
  - rank_threshold: 1
    reason: >-
      EXCLUDED DELIBERATELY. The red team showed three Cremona-table curves already beat the
      r>=1 cell (43a1 11.269579, 53a1 11.387464, 83a1 11.550443 vs 11.613603). Taking that cell
      with a textbook curve is a hollow closure and is forbidden by C1'.
  mechanism: >-
    Rank and size pull against each other in the record pipeline, so record curves are enormous.
    A base of generic rank r inverts that: by Silverman specialisation all but finitely many t0
    give rank >= r over Q with NO sieving, so t may be chosen SMALL. BATCH-f2341e measured what
    actually governs the height: it grows only LOGARITHMICALLY in the parameter (h ~ a + b log H(t)),
    so the binding constraint is the family's own (a, b), not the parameter size. Nagao is the
    right family to test that on because its rank is exactly known and 4 above the rank-8 cap,
    and because the board's own commentary attributes its high-rank small curves to Mestre and
    Fermigier families -- Nagao is not visibly represented, so the (a, b) it carries is unmeasured
    by the incumbents rather than already optimised by them.
  assumptions:
  - >-
    The Nagao transcription in candidate_families.json is SELF-CONSISTENT: the point
    ((t+703)/15, 1248*N(t)/75) lies on the transcribed quartic exactly, verified at all seven
    coefficients t^0..t^6 with constant ratio 1557504 = 1248^2. BATCH-f2341e recorded the opposite
    verdict; that was a false negative, corrected by the validator (J1-F1) and re-verified by the
    Coordinator. Self-consistency is strong evidence of a faithful transcription; it is NOT proof
    the coefficients are Nagao's published equation, and source retrieval remains owed.
  - >-
    Silverman specialisation motivates and NEVER certifies. Every rank over Q is recertified on
    the specialised curve by exhibited points in exact arithmetic.
  - >-
    Mestre-Nagao ordering is NEITHER validated NOR refuted (BATCH-f2341e: +0.633 at p = 0.068,
    arms overlapping, which the red team showed UNDERSTATES the effect -- attenuation 0.681,
    implying +0.930 disjoint). It is used only AFTER an exact height gate, never before, following
    the incumbents' own published finding that record fibres are not top Nagao scorers.
  falsification:
  - >-
    FALSIFIED if the measured height budget of Nagao gives an EMPTY admissible parameter box at
    all three pre-declared targets. Then this family cannot take those cells at any parameter,
    the measured (a, b) plus that statement is the result, and no further sieving is warranted.
  - >-
    FALSIFIED if the certified rank of small-t Nagao specialisations is below 12, which would
    contradict either the cited generic rank or the transcription's faithfulness. Either way the
    family is withdrawn and source retrieval becomes blocking.
  - >-
    NOT falsified by failing to take a cell after a non-empty box is found and searched; that is
    a bounded-search negative and must be reported with the volume covered.
  status: proposed
  created: '2026-08-23'
  owner: coordinator
