# =============================================================================
# H-BINSTD-85e778 -- HOLD-I modulus-weight confound control.
# Specified from IDEA-20260922-cdca3a under RQ-NISTBIN-06157b /
# GOAL-ECDLP2M-001. Approved DEC-20261002-b1f692.
#
# HOLD-I (DEC-20260924-99ce20): survivor IDEA-20260922-cdca3a consolidates
# IDEA-20260922-f37254, IDEA-20260922-9d12bd, IDEA-20260922-99294c as
# sections (reduction-polynomial as representation; sparsity as c_leaf-only
# lever; Weil-descent basis invariance). Shared generator with HOLD-J
# (EXP-BINSTD-644d2f / IDEA-20260922-8ac1ea already designed). Revisit_when
# (both NA-1 lanes compose) met: DEC-20260925-41f6dc and DEC-20260925-a84b16.
#
# ZERO RUNS in this design packet. No AUXIN. No Bedrock. No curve attack /
# exponent claim. Claim tier: control / measurement. Stages 0-3 authorized.
# =============================================================================
hypothesis:
  id: H-BINSTD-85e778
  question_id: RQ-NISTBIN-06157b
  source_idea: IDEA-20260922-cdca3a
  experiment_id: EXP-BINSTD-a8bfd8
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-b1f692
  status: analyzed
  status_updated_by: DEC-20261003-d7d09e
  status_updated_at: '2026-10-03'
  status_update_note: >-
    Stages 0-1 (EV-BINSTD-a894c0): (A)/(B) hold at toy m in {7,11,15}.
    Stages 2-3 (EV-BINSTD-7eacca / DEC-20261003-d7d09e): Stage-2 controls
    OK (same-weight / 9d12bd / 99294c / fixed-V) at m=15,l=6; Stage-3
    O-IMPEDIMENT (no Python WDSat/ANF, SR-5) — infra, not E1 falsification.
    Decision expand Stage-3 when solver clears. Full HOLD-I E1 not yet
    supported.
  proposed_by: coordinator
  title: >-
    Reduction-polynomial Hamming weight w is a constant-factor confound on
    descended-system support, XOR-clause length, per-conflict time and peak
    memory, and is predicted modulus-blind on WDSat/ANF conflict count (E1)
    under the exhaustive-core law — isolating w before any cross-modulus
    V-selection reading

  statement: >-
    CLAIM (control / measurement; HOLD-I; NO ATTACK). Setting: polynomial-basis
    F_2-multiplication tensors and Weil-descended summation systems at matched
    (m,t,l) over irreducible weight-3 (trinomial) and weight-5 (pentanomial)
    moduli, with same-weight and fixed-V controls; optional deferred WDSat/ANF
    arm when a vendored solver is present. HYPOTHESIS: (A) Tensor sparsity —
    distinct quadratic monomials and per-output XOR length scale with w;
    pentanomial/trinomial support ratio is bounded away from 1 and independent
    of m (constant factor). (B) Descended system — at matched (m,t,l) the
    pentanomial system has strictly larger total monomial support and mean
    XOR-clause length than the trinomial. (E1, predicted) Under
    IDEA-20260915-0d8e90's exhaustive-core law, WDSat/ANF UNSAT conflict count
    is equal within the c-band [0.9,1.0] across moduli; only per-conflict time
    and peak memory differ. (E2, surprise) Conflict count differs beyond the
    c-band — contradicts the exhaustive-core law through the modulus.
    (D) Operational confound — any kappa(V) / Frobenius-stability comparison
    across different moduli mixes a modulus term into wall-time and memory
    unless the modulus is pinned or the metric is conflict count. CLAIM TIER:
    control / measurement. NO exponent. NO NIST/ANSI break. NO Magma/Sage/
    AUXIN/Bedrock. Consolidated f37254 (representation), 9d12bd (c_leaf-only
    sparsity lever + relabelling null), 99294c (basis-invariance of the fully
    determined shape) are baked in as Stage arms / sections, not separate
    designs.

  mechanism: >-
    OBJECT FRAME. Representation R1: x(P) in F_{2^m} in the polynomial basis
    defined by reduction polynomial p(t) of Hamming weight w (NIST normative
    choice). Factor base B_V = {P : x(P) in V} unchanged (implicit-membership
    cheap). Tracked object: the descended Boolean/ANF equation system's
    monomial support and XOR-clause lengths. Sigma = {DPLL/XOR-Gauss unit
    propagation, XOR elimination, branch on a factor-base bit}. Trichotomy:
    COORDINATE-DEPENDENT — the support/clause statistics move under modulus
    change while the solution set (decompositions) does not. Lossy projection
    (system) -> (support size, mean XOR length) is Sigma-compatible and
    genuinely lossy. WHAT IS NEW relative to GOAL-FROB basis-blindness (varies
    F_2-basis within one modulus), kappa(V) (varies V at fixed modulus), and
    0d8e90 (states the exhaustive-core law without varying w): this isolates
    w as a priced, subtractable confound. Consolidated 9d12bd adds the
    c_leaf-vs-N_leaf separation and the matched-width random-relabelling null;
    f37254 adds the representation-not-background framing; 99294c adds the
    basis-invariance check of the fully-determined shape. Charged stage:
    forming and solving the descended system — not membership.

  assumptions:
    - >-
      Polynomial-basis representation modulo p(t) (NIST normative). Normal /
      tower bases are out of scope.
    - >-
      Exhaustive-core law of IDEA-20260915-0d8e90 is the E1 reference; if it
      fails independently of the modulus, E1/E2 lose their reference and (D)
      still stands on per-conflict time/memory from (A)-(B).
    - >-
      Within-m comparison requires both an irreducible trinomial and an
      irreducible pentanomial at that m (e.g. m in {7,11,15,23}); cross-degree
      NIST comparisons cannot isolate w from m.
    - >-
      Executable Stage 0-2 are arithmetic / system-build on this machine;
      Stage 3 (WDSat/ANF) is deferred if no vendored solver is available and
      records O-IMPEDIMENT rather than provisioning Magma/Sage/AUXIN.
    - >-
      Amazon Bedrock prohibited. No AUXIN. No Magma/Sage as success path.
    - >-
      HOLD-J's shared generator (EXP-BINSTD-644d2f) is a read-only input when
      present; this contract does not edit that experiment.

  proof_search_map:
    bottleneck: >-
      Whether the reduction-polynomial weight contributes to reported WDSat/ANF
      numbers — and therefore whether cross-modulus V comparisons are
      confounded — has never been isolated. Answering it prices a subtractable
      modulus term before any V-selection conclusion.
    baseline_embedding:
      parameter_slice: >-
        EC-Index-Calculus-Benchmarks / KN-LIT-036049 instances at one modulus
        are the baseline; regenerating the SAME (m,t,l,V) over a different-weight
        irreducible isolates w. Same-weight distinct irreducibles are the
        benign collision control.
      reproduction_check: >-
        Stage 0: at m in {7,11,15} build weight-3 and weight-5 multiplication
        tensors; confirm pentanomial distinct-quadratic-monomial count exceeds
        trinomial by a factor bounded away from 1. Stage 1: descended t=2
        systems at matched (m,l) confirm support and mean XOR length gap.
        Stage 2: two distinct trinomials (and two pentanomials) agree up to
        relabelling. Mismatch → O-ARTIFACT / O-A-FALSE / O-B-FALSE.
    observation_collision:
      observable: >-
        (total monomial support, mean XOR-clause length) of the descended
        system; (deferred) conflict count, per-conflict time, peak memory.
      distinct_preimage_search: >-
        Support gap from (i) w itself, (ii) specific term-spread of one
        pentanomial, (iii) V change. Separated by same-weight control, fixed-V
        across moduli, and (9d12bd) matched-width random relabelling null.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Fix (m,t,l,V); vary only the modulus weight w in {3,5} (and same-weight
          siblings); optionally run the matched-width random-relabelling null.
        predicted_gain: >-
          A priced, subtractable modulus term so V effects can be read cleanly
          after removing it; plus a c_leaf-only vs N_leaf separation.
      - transform: representation_reduction
        proposed_object: >-
          Promote the reduction polynomial from unstated background to a named
          R1 coordinate (f37254 section); test that the fully-determined
          Weil-descent shape is basis-invariant under linear change of F_2-basis
          at fixed modulus (99294c section).
        predicted_gain: >-
          Representation confound named; basis-invariance of solution-set shape
          separated from modulus-weight effects on support.
    quantifier_order: >-
      FORALL m at which both irreducible trinomial and pentanomial exist, and
      FORALL matched (t,l,V): pentanomial support and mean XOR length strictly
      exceed trinomial by a constant factor (theorem about the tensor / Stage
      0-1), AND (E1, predicted) conflict counts equal within the c-band.
      NOT CLAIMED: security difference from w; exponent move; any V effect.
    method_ceiling:
      strongest_certifiable_claim: >-
        The reduction-polynomial weight changes the descended summation
        system's monomial support and XOR-clause length by a constant factor
        and, under the exhaustive-core law, leaves the search exponent
        unchanged; therefore any cross-modulus V comparison is confounded on
        wall-time and memory but not on conflict count (E1). Certifies nothing
        about whether V itself moves any exponent, nothing outside the
        polynomial-basis representation, and nothing about the truth of the
        exhaustive-core law beyond the E1/E2 classification.
      nearby_object_control: >-
        PROVES-TOO-MUCH: reading "sparser modulus ⇒ cheaper attack" would
        predict trinomial degrees (233,409) weaker than pentanomial neighbours
        — FALSE under E1 (search exponent modulus-blind; rho margins order by
        m). NULL: two distinct trinomials of the same degree must give the
        same support and (E1) conflict count up to relabelling. 9d12bd null:
        matched-width random F_2-linear relabelling must not reproduce an
        unmatched-relabelling N_leaf blowup.
    proof_obligations:
      - claim: Product-coordinate XOR length and distinct-quadratic-monomial count scale with w.
        responsibility: correctness
      - claim: At matched (m,t,l) pentanomial support exceeds trinomial by a constant factor.
        responsibility: size
      - claim: Under exhaustive-core law, conflict count is modulus-blind (E1); beyond-band difference is E2.
        responsibility: success_probability
      - claim: Cross-modulus V comparison mixes modulus into wall-time and memory (D).
        responsibility: interface
      - claim: No factor-base membership class changes; c_leaf moves, N_leaf does not (9d12bd).
        responsibility: scope
      - claim: Fully-determined Weil-descent shape is basis-invariant at fixed modulus (99294c).
        responsibility: correctness
    not_applicable_reason: null

  heuristic_assumptions:
    - id: H-cdca3a-1
      formal_statement: >-
        For a degree-m reduction polynomial of Hamming weight w, the F_2
        bilinear multiplication tensor has O(m·w) nonzero structure constants
        beyond the schoolbook diagonal, so distinct quadratic monomials
        entering the m reduced outputs grow linearly in w and in m, and the
        pentanomial/trinomial ratio tends to a constant > 1 as m grows.
      random_model_justification: >-
        Polynomial reduction modulo t^m + r(t) replaces each t^k (k≥m) by
        t^{k-m} r(t); a weight-w modulus contributes w-1 fold terms per
        overflowing degree — exact sparse-modulus arithmetic.
      supporting_results:
        - >-
          Standard sparse-modulus field arithmetic (NIST FIPS 186-4 binary
          field polynomials; SRC-FIPS186-4-BINARY-CURVES).
        - IDEA-20260922-cdca3a claim (A) / H1 validation plan (m=7,11,15,23).
      provenance: internal
      falsification_condition: >-
        At matched m in {7,11,15}, weight-3 and weight-5 tensors give equal
        distinct-quadratic-monomial counts → (A) false → O-A-FALSE.
      validation_plan: >-
        Stage 0 arithmetic: build tensors, count monomials, fit
        pentanomial/trinomial ratio vs m; confirm constant > 1.
    - id: H-cdca3a-2
      formal_statement: >-
        Conditional on IDEA-20260915-0d8e90 (conflict count = c·2^{ml},
        c∈[0.9,1.0]), modulus weight w affects only per-conflict cost and peak
        memory (linear in clause length / support) and leaves conflict count
        within the c-band (E1).
      random_model_justification: >-
        An exhaustive core over the ml factor-base bits has SIZE set by (m,l)
        and not by the clause encoding; a change of encoding that preserves the
        solution set cannot change an exhaustive count, only per-node work.
      supporting_results:
        - IDEA-20260915-0d8e90 exhaustive-core law (must be re-read before pinning E1).
        - IDEA-20260922-cdca3a claim (C) E1/E2 split.
      provenance: internal
      falsification_condition: >-
        Conflict count differs between moduli beyond the c-band at matched
        (m,t,l,V) under fixed solver flags → E2 / O-E2 (law contradicted
        through the modulus); requires independent review before promotion.
      validation_plan: >-
        Stage 3 (deferred if no solver): compare conflict counts; report E1 vs
        E2 side by side; never re-score after the fact without amendment.

  predictions:
    - claim: H-cdca3a-A (tensor sparsity).
      metric: distinct quadratic monomials / per-output XOR length, w=5 vs w=3
      minimum_effect: >-
        pentanomial strictly greater; ratio bounded away from 1 and independent
        of m (constant factor).
      cites: H-cdca3a-1
    - claim: H-cdca3a-B (descended support).
      metric: total monomial support and mean XOR-clause length at matched (m,t,l)
      minimum_effect: pentanomial strictly larger, constant factor.
    - claim: H-cdca3a-E1 (conflict count modulus-blind).
      metric: WDSat/ANF UNSAT conflict count at matched (m,t,l,V)
      minimum_effect: >-
        PREREGISTERED: NO difference beyond the c-band (E1). Beyond-band
        difference is E2.
      cites: H-cdca3a-2
    - claim: H-cdca3a-D (confound on wall-time/memory).
      metric: per-conflict time and peak memory
      minimum_effect: pentanomial strictly larger by support / XOR-length ratio.
    - claim: H-9d12bd-Nleaf (c_leaf-only).
      metric: leaf_count_ratio pentanomial/trinomial at matched (m,l,n)
      minimum_effect: in [0.95, 1.05] (axis-pure on N_leaf); clause_width / seconds_per_leaf above 1.
    - claim: H-99294c-invariance (fixed-modulus basis change).
      metric: solution-set shape / fully-determined descent indicators under F_2-basis change at fixed p(t)
      minimum_effect: indicators agree; support may change but solution set does not.

  test_boundary: >-
    Stages 0-2: toy m in {7,11,15} (and 23 if machine-fast) where both
    irreducible trinomial and pentanomial exist; t=2 Weil descent; l in {6,7,8};
    fixed V across modulus arms. Stage 3: same cells under WDSat/ANF when a
    vendored solver exists; otherwise O-IMPEDIMENT recorded, Stages 0-2 still
    decide (A)/(B)/9d12bd-Nleaf/99294c. No NIST/ANSI deployed-degree solve as a
    claimed result. No Magma/Sage/AUXIN/Bedrock. Transfer of the constant-factor
    confound statement (D) to NIST degrees is labelled extrapolation from the
    within-m isolation design.

  falsification_conditions:
    - >-
      Weight-3 and weight-5 tensors give equal distinct-quadratic-monomial
      counts at matched m → (A) false → O-A-FALSE.
    - >-
      Descended-system support equal or larger for the trinomial at matched
      (m,t,l) → (B) false → O-B-FALSE.
    - >-
      Two distinct trinomials of the same degree give different conflict counts
      beyond the c-band → confound not clean → O-ARTIFACT.
    - >-
      Conflict count differs between moduli beyond the c-band (E2) → exhaustive-
      core law contradicted through the modulus → O-E2 (informative; needs
      independent review).
    - >-
      Matched-width random relabelling reproduces unmatched-relabelling N_leaf
      blowup while the sparsity arms do not separate on c_leaf → 9d12bd
      sparsity attribution false → O-9d12bd-FALSE.
    - >-
      Fixed-modulus F_2-basis change alters the solution set (not just support)
      → 99294c invariance false → O-99294c-FALSE.

  distinguishable_outcomes:
    - id: O-E1-CONFIRMED
      meaning: >-
        (A) and (B) hold; Stage 3 conflict counts within c-band (or Stage 3
        impeded and Stages 0-2 alone support the confound statement on
        time/memory); N_leaf ratio in [0.95,1.05]; 99294c invariance holds.
    - id: O-E2
      meaning: >-
        Conflict count differs beyond c-band; exhaustive-core law contradicted
        through the modulus; requires independent review before promotion.
    - id: O-A-FALSE
      meaning: Tensor sparsity claim (A) fails at Stage 0.
    - id: O-B-FALSE
      meaning: Descended support claim (B) fails at Stage 1.
    - id: O-9d12bd-FALSE
      meaning: Sparsity is not c_leaf-only / relabelling-null discriminator fails.
    - id: O-99294c-FALSE
      meaning: Fully-determined shape is not basis-invariant at fixed modulus.
    - id: O-ARTIFACT
      meaning: >-
        Same-weight control fails, fixed-V not held, solver flags differ across
        arms, or verification failure.
    - id: O-IMPEDIMENT
      meaning: >-
        Stage 3 solver unavailable or infra failure; never negative mathematical
        evidence against (A)/(B)/E1.

  status_note: >-
    Analyzed after Stages 0-1 (DEC-20261003-d323c0 / EV-BINSTD-a894c0):
    claims (A)/(B) hold at preliminary strength; expand to Stages 2-3.
    Idea status left proposed. No break / exponent / E1 claim from Stages 0-1.

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
