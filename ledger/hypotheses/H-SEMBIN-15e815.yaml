# =============================================================================
# H-SEMBIN-15e815 -- Table-3 recharge / Assumption-1 relocation
# (IDEA-20260913-9c54f9). Under RQ-SEMBIN-fa2e3f / GOAL-SEMBIN-5078bc.
# Approved DEC-20261002-3b2d41.
#
# Cost-model re-derivation: integer-k Table 3, fitted per-solve law, memory
# frontier, and the claim that FIPS needs only "bounded solving degree at some
# fixed k_0", not diagonal Assumption 1. ZERO RUNS in this design packet.
# No Magma/Sage/AUXIN/Bedrock. Claim tier: cost-model / sensitivity analysis.
# No curve attack. No exponent move.
# =============================================================================
hypothesis:
  id: H-SEMBIN-15e815
  question_id: RQ-SEMBIN-fa2e3f
  question_ids:
    - RQ-SEMBIN-fa2e3f
  source_idea: IDEA-20260913-9c54f9
  experiment_id: EXP-SEMBIN-d0d73b
  goal_id: GOAL-SEMBIN-5078bc
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-3b2d41
  status: approved
  proposed_by: coordinator
  title: >-
    The diagonal k = ceil(n/m) is not load-bearing for Semaev 2015's FIPS
    conclusion: recharging Table 3 at integer k with degree-growth models,
    a fitted per-solve law, and a memory column relocates the load-bearing
    assumption to "bounded solving degree at some fixed k_0"

  statement: >-
    CLAIM (cost-model / sensitivity analysis; NO ATTACK). Scope: Semaev 2015
    (KN-LIT-fa346d) Table 3 and eqs. (15)-(17) only; nothing about Assumption 2;
    no deployed-curve solve; no exponent. Four independently falsifiable parts,
    all derivable from the paper's own formulas plus its own 21 Table 1-2
    timings (inputs/SEMAEV-2015-310/). (C1) RELOCATION. Pinning k at a constant
    k_0 and paying m! with m = ceil(n/k_0) still beats 2^{n/2} at n = 571 under
    every degree-growth model calibrable from available data (constant-4;
    4+log2(k/20); 4+(k-20)/3 from the two Kosters points in KN-LIT-e77232;
    fitted 2^{a k}), so the FIPS conclusion needs only EXISTS k_0 uniform in n
    with solving degree bounded — strictly weaker than diagonal Assumption 1.
    (C2) THRESHOLD FRAGILITY. The published "n > 310" crossover moves to
    n* >= 330 under any model with d strictly increasing in k (paper's own
    formula gives 302; integer-k re-optimisation 303). (C3) PER-SOLVE LAW.
    Fitting the 21 published timings yields per-solve exponents in N of about
    4.75–5.40 and a per-unit-k exponent a ≈ 3.12 — inconsistent with the
    published 4ω ∈ [9.5, 12] at any reasonable noise model; the discrimination
    is decided by k, not n. (C4) MEMORY FLOOR. max(relation store, dense /
    sparse working set) at n = 571 is minimised near 2^{69.5} bits (sparse,
    m ≈ 10) with no useful T–M tradeoff below that floor; vOW parallel rho at
    matched memory stays cheaper on the memory axis. CLAIM TIER: cost-model
    measurement. Outcomes decide whether Assumption 1's diagonal form is
    load-bearing and supply the memory column KN-OPEN-86e7e1 asks for under
    degree-growth sensitivity — they do not assert any FIPS curve is broken.

  mechanism: >-
    OBJECT FRAME. Representation: the published cost surface
    (time, memory) over integer m with k = ceil(n/m), C = C(k) under named
    degree-growth models, and Semaev's stage-1/stage-2 formulas. Tracked
    object: the two-dimensional frontier, not Table 3's single printed row.
    Sigma = {re-optimise m, pin k, vary omega / block-solver on/off, fit
    C from Table 1-2 timings, charge memory terms}. Trichotomy:
    COORDINATE-INDEPENDENT (pure arithmetic on published formulas). Lossy
    projection: Table 3 ↦ single (n,m,time) row discards the (time, memory)
    surface and any C(k) dependence; the projection is Sigma-compatible and
    genuinely lossy (observation-collision: C = n^{12} and C = 2^{3.12 k}
    n^{-0.28} collide at n ≤ 21 and diverge at n = 571). WHAT IS NEW relative
    to EXP-SEMBIN-f4a17b / H-SEMBIN-83999d (memory-charged crossover under
    Assumption 1 held fixed) and EXP-SEMBIN-2c40bb / H-SEMBIN-97ea23 (coherent
    vOW baseline): this hypothesis VARIES the degree law and RELOCATES what
    must be measured, rather than charging memory under d ≡ 4.

  assumptions:
    - >-
      Frozen Semaev 2015 text and tables at inputs/SEMAEV-2015-310/ are the
      sole primary source for Table 3, eqs. (15)-(17), and Table 1-2 timings.
    - >-
      omega ∈ {2.376, 3} and omega' ∈ {2, 3} are tabulated; default match to
      Table 3 is omega = 3, omega' = 2.
    - >-
      Block-structured solver of Section 4.5.2 is an on/off axis, never assumed
      silently; without it stage-1 uses [n(m-1)]^{4 omega}.
    - >-
      Sparse working-set formulas are Semaev's as recorded in KN-LIT-e77232
      (H2); dense is Galbraith's C(N+3,4)^2-style column count. Both reported.
    - >-
      Degree-growth models other than constant-4 are HYPOTHESES calibrated from
      at most two unreproduced Kosters points or from 2–4-point ladders; every
      use is labelled assumed, not measured.
    - >-
      EXP-SEMBIN-f4a17b / EXP-SEMBIN-2c40bb results are cited as prior memory
      work under d ≡ 4; this contract does not re-litigate their rulings.
    - >-
      Amazon Bedrock prohibited. No AUXIN. No Magma/Sage as success path
      (pure Python + optional numpy). Resource exhaustion is O-IMPEDIMENT,
      never negative evidence (AGENTS.md rule 5).

  proof_search_map:
    bottleneck: >-
      Whether Table 3's printed row identifies the algorithm's actual cost once
      C may depend on k and memory is charged — i.e. whether Assumption 1's
      diagonal form is load-bearing for the FIPS conclusion.
    baseline_embedding:
      parameter_slice: >-
        d ≡ 4, non-integer k = n/m, omega = 3 must reproduce every Table 3
        cell; freezing session checked all 36 within 0.7%
        (inputs/SEMAEV-2015-310/tables.yaml derived_checks).
      reproduction_check: >-
        Stage 0 gate: re-derivation returns 2^{186.3} for stage 1 at n = 571
        with the paper's non-integer k, and agrees with all frozen Table 3
        cells within 0.7%. Failure → O-BASELINE-FAIL; no derived table reported.
    observation_collision:
      observable: A single (n, m, time) row as Table 3 prints it.
      distinct_preimage_search: >-
        C = n^{12} vs C = 2^{a k} n^{b} (and other named degree models) agree
        within Table 1-2 scatter at n ≤ 21 and diverge by many bits at
        n = 571; Stage 2 exhibits the collision quantitatively.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          Enlarge from "the single m minimising time at d = 4" to the whole
          (time, memory) surface over m ∈ [2, n/2] with integer k and d = d(k).
        predicted_gain: >-
          Exposes the ~2^{69.5}-bit memory floor, flatness of time across
          m = 10..14, and the k-pinning escape from degree growth.
      - transform: specialization_pack
        proposed_object: >-
          Resource measure max(relation store, per-solve working set) under
          m = ceil(n/k_0).
        predicted_gain: A memory column comparable with vOW at all.
    quantifier_order: >-
      Published conclusion: FORALL n > 310, method beats rho — support is FOR
      one m, EXISTS cost law C = n^{12}, EXISTS unimplemented block solver.
      Reframes as: EXISTS k_0 (uniform in n) such that FORALL n the solving
      degree at k = k_0 is bounded, THEREFORE FORALL n > n_0(k_0) method beats
      rho. Witness k_0 depends on nothing; that is what makes it testable.
    method_ceiling:
      strongest_certifiable_claim: >-
        Exact reproducible (time, memory) frontier as a function of
        (n, m, omega, d(.), block-solver on/off) with every input labelled
        assumed or measured, plus fitted per-solve exponents with honest
        degrees-of-freedom statements. Cannot measure d(.) (that is
        IDEA-20260913-9ba7fc / EXP-SEMBIN-35bf67); cannot claim a real
        implementation at n > 45.
      nearby_object_control: >-
        Apply the same frontier machinery to Petit-Quisquater's published
        n > 2000 threshold (as relayed by the frozen paper's introduction)
        and confirm it returns that number from that paper's stated
        parameters. Null cost law (time constant in every parameter) must
        produce a threshold that contradicts the paper's.
    proof_obligations:
      - claim: Table 3 reproduced at d = 4, non-integer k, omega = 3
        responsibility: baseline
      - claim: max(relation store, working set) minimised interior; floor ≥ 2^{69} bits at n = 571 sparse
        responsibility: memory
      - claim: Pinning k at k_0 beats 2^{n/2} whenever k_0 > 2 log2(n/k_0) + O(1)
        responsibility: runtime
      - claim: Fitted per-solve exponent inconsistent with 4ω ≥ 9.5
        responsibility: strictness
      - claim: vOW comparison uses source constants; units (field vs group ops) disclosed
        responsibility: interface

  asymptotic_claim: null

  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        (Bounded degree at pinned k.) There exists a constant k_0, independent
        of n, and a constant d_0, such that for all n and all instances of the
        Weil descent of eq. (5) with t = m = ceil(n/k_0) and dim V = k_0, the
        solving degree is at most d_0.
      random_model_justification: >-
        Rigorous ingredient: first fall degree is 4 (paper Section 4.5) for
        all-variable S_3. Distribution statement imitated: solving degree of
        an overdetermined Boolean system behaves like Bardet–Faugère–Salvy
        regularity at FIXED k_0 and growing auxiliary variables (m−2)n — an
        increasingly overdetermined regime that should not grow. Paper's own
        Tables 1–2 already report d_F4 = 4 on three fixed-k ladders.
      supporting_results:
        - KN-LIT-fa346d Section 4.5 (retrieved; frozen paper).
        - IDEA-20260913-9ba7fc / EXP-SEMBIN-35bf67 (Assumption-1 boundary; separate measurement of d(.)).
      provenance: internal
      falsification_condition: >-
        Pinning k at every constant k_0 ∈ {8..30} fails to beat 2^{n/2} at
        n = 571 under every degree model in the contract → C1 false →
        O-C1-FALSE (Assumption 1 is load-bearing after all).
      validation_plan: >-
        This contract tests the COST consequence of H1 under named degree
        models (Stage 1/3). Measuring d(.) itself is IDEA-20260913-9ba7fc;
        transfer assumption: nothing claimed at n > 30 by the degree route.
    - id: H2
      formal_statement: >-
        (Sparse working-set model.) The degree-4 Macaulay/XL matrix for the
        descended chained system in N = (m−2)n + km variables has about
        (nm)^4/4! columns with about n^3/m nonzeros per row, so the working
        set is about (nm)^4/4! · n^3/m bits.
      random_model_justification: >-
        None rigorous. Semaev's own formulas as recorded in KN-LIT-e77232;
        structural row-weight claim not derived in this program.
      supporting_results:
        - KN-LIT-e77232 (internal).
        - EXP-SEMBIN-f4a17b / EXP-SEMBIN-2c40bb (prior memory columns under d ≡ 4).
      provenance: internal
      falsification_condition: >-
        Under BOTH dense and sparse models, max(relation store, working set)
        admits a frontier point below 2^{60} bits at n = 571 → C4 false →
        O-C4-FLOOR-FALSE. (Direct matrix measurement at toy (n,m) is out of
        this contract's zero-algebra scope; labelled assumed.)
      validation_plan: >-
        Report both dense and sparse columns; cite EXP-SEMBIN-f4a17b /
        2c40bb as prior under d ≡ 4; do not claim H2 measured here.

  predictions:
    - metric: Table 3 stage-1 residual at n = 571, d = 4, non-integer k, omega = 3
      direction: equal
      minimum_effect: Absolute log2 residual ≤ 0.01 bit vs frozen 2^{186.3}; all 36 cells within 0.7%.
    - metric: fitted per-solve exponent in N from Table 1-2 ladders
      direction: lower
      minimum_effect: >-
        Upper end of the stated interval below 9.5 (= 4ω at omega = 2.376).
        Point estimates in the proposal: 4.75 (k = 4) and 5.40 (k = 3).
    - metric: fitted per-unit-k exponent a in time = 2^{a k} n^{b}
      direction: higher
      minimum_effect: >-
        a >= 2 with b indistinguishable from 0 (proposal point a = 3.12,
        b = -0.28).
    - metric: min_m max(relation store, working set) bits at n = 571 (sparse)
      direction: higher
      minimum_effect: ≥ 2^{69} bits.
    - metric: crossover n* with 2^{n/2} under any d strictly increasing in k
      direction: higher
      minimum_effect: n* ≥ 330 (paper states 310; own formula 302–303).
    - metric: total time at n = 571 under linear-in-k degree rate (Kosters calibration)
      direction: higher
      minimum_effect: 2^{233} ± 3 bits, still below rho's 2^{285.5}.

  test_boundary: >-
    Analytical / modelling only: n ∈ {163, 233, 283, 310, 350, 400, 409, 450,
    500, 571}; m ∈ [2, floor(n/2)]; omega ∈ {2.376, 3}; omega' ∈ {2, 3};
    block solver on/off; degree models {4, 4+log2(k/20), 4+(k-20)/3,
    4+sqrt(max(k-20,0)), fitted 2^{a k}}. Fitting input = the 21 published
    Table 1-2 timings only. No algebra, no solver, no curve instantiation.
    Instruments: python (+ optional numpy). Wall clock advisory ≤ 3600 s;
    memory ≤ 1 GiB; maximum_runs = 1 scientific derivation run.

  falsification: >-
    C3 withdrawn if the fitted per-solve exponent interval covers 4ω.
    C4 false if max(relation store, working set) < 2^{60} bits at n = 571
    under both storage readings. C1 false if pinning k never beats 2^{n/2}
    at n = 571 under every degree model. Baseline false if Table 3 cannot be
    reproduced at d = 4. Modelling untrustworthy if Petit-Quisquater n > 2000
    cannot be reproduced from that paper's stated parameters (nearby-object
    control) or if the null cost law fails to contradict the paper's threshold.

  distinguishable_outcomes:
    - id: O-RECHARGED
      meaning: >-
        Stages 0–3 complete; Table 3 reproduced; C1 holds under every named
        degree-growth model; threshold moves (C2); fit contradicts 4ω (C3);
        memory floor ≥ 2^{69} bits (C4); nearby-object and null controls pass.
    - id: O-C1-FALSE
      meaning: Pinning k never beats rho at n = 571 — Assumption 1 is load-bearing.
    - id: O-C2-STABLE
      meaning: Threshold stays within 5 of 310 under every growing-d model — C2 withdrawn.
    - id: O-C3-LAW-CONSISTENT
      meaning: Fitted exponent interval covers 4ω — C3 withdrawn.
    - id: O-C4-FLOOR-FALSE
      meaning: Memory frontier dips below 2^{60} bits at n = 571 under both readings.
    - id: O-BASELINE-FAIL
      meaning: Stage 0 cannot reproduce Table 3 within tolerance.
    - id: O-NEARBY-FAIL
      meaning: Petit-Quisquater nearby-object control fails.
    - id: O-ARTIFACT
      meaning: Pipeline bug, unit mismatch unhandled, or null-law control fails to contradict.
    - id: O-IMPEDIMENT
      meaning: Missing fixture / crash / budget abort — never mathematical evidence.

  dominated_by: >-
    The audited algorithm remains dominated by vOW parallel rho on the memory
    axis at every n (≈2^{40} bits vs ≈2^{69.5}-bit floor at n = 571) and on
    time below the recomputed threshold. This hypothesis's deliverable is a
    cost re-derivation and occupies no attack-frontier point. Checked rows:
    vOW rho; plain rho; Petit-Quisquater conditional; Gaudry/Diem (non-prime n,
    out of scope); Semaev 2015 as printed; EXP-SEMBIN-f4a17b / 2c40bb prior
    memory work under d ≡ 4.
  sota_delta: >-
    Moves no exponent and claims no attack. Supplies: memory column under
    degree-growth sensitivity; corrected threshold (302–303 → ≥330 once d
    grows in k); integer-k correction; relocation of the load-bearing
    assumption from diagonal Assumption 1 to bounded degree at fixed k_0.
    Cost: one analysis script, zero new algebra.

