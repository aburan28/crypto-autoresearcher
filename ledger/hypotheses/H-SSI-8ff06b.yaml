  heuristic_assumptions:
    - id: HEUR-CHARGE-1
      formal_statement: >-
        NO HEURISTIC IS LOAD-BEARING FOR THE THREE SEQUENTIAL SLOPES OR FOR THE FIVE-ROW
        IDENTITY. Given A(w) = w and T(w) = p^{1/2+o(1)} w^{-1/2}, the statements
        d log(w T^k)/d log w = 1 - k/2 for k = 0, 1, 2 are algebraic identities.
      random_model_justification: >-
        None required; there is no random quantity anywhere in the derivation. This entry
        exists to record that the record is UNCONDITIONAL where the goal's other lanes are
        conditional, and that its only assumptions are definitional (the area convention) and
        evidentiary (the fidelity of the transcription).
      supporting_results:
        - >-
          READ: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md sections 1.1 and 4.1, the source
          of the tradeoff expression and of the five-row table.
      validation_experiment_ids: [EXP-SSI-eca132]
      falsification_condition: >-
        Any of the five known-answer residuals is nonzero, or a measured slope differs from
        its derived value by more than 0.02.
    - id: HEUR-CHARGE-2
      formal_statement: >-
        FOR ALL w in [1, p^{1/3}] and FOR ALL admissible n, the expression
        T = p^{1/2+o(1)}/(w^{1/2} n) is valid, uniformly in p, INCLUDING at the boundary
        T ~ 1.
      random_model_justification: >-
        NOT ESTABLISHED. The expression is the paper's, quoted; van Oorschot-Wiener 1999 was
        not read; uniformity at the T ~ 1 corner is exactly where such formulas usually stop
        holding, and that corner is where mechanism (D)'s sign reversal lives.
      supporting_results: []
      validation_experiment_ids: [EXP-SSI-eca132]
      falsification_condition: >-
        If the expression's range of validity is later transcribed and excludes the T ~ 1
        corner, mechanism (D) is WITHDRAWN and mechanisms (B) and (C) stand unchanged. The
        contract requires (D) to be reported in a separately labelled section for exactly
        this reason.
    - id: HEUR-CHARGE-3
      formal_statement: >-
        UNRESOLVED, NOT ASSUMED: the programme's own `wiener_full_cost` functional has a
        definite functional form under which BSGS costs n^{2/3+o(1)}. This record does NOT
        know that form and does NOT guess it.
      random_model_justification: n/a
      supporting_results:
        - >-
          KN-TECH-035 (head READ) states the BSGS n^{2/3+o(1)} figure and attributes the
          model to KN-LIT-094. KN-LIT-094 WAS NOT READ.
      validation_experiment_ids: [EXP-SSI-eca132]
      falsification_condition: >-
        n/a -- this is a declared gap, not a claim. If the source cannot be obtained the
        fourth column is reported UNRUN under AGENTS.md rule 5, and an absent column is never
        shown as a column of zeros.

  structural_ingredients:
    - description: >-
        The van Oorschot-Wiener time-memory tradeoff for claw finding on two sets of size N,
        as applied to this problem: T = sqrt(N^3/w) = p^{1/2+o(1)}/w^{1/2} at memory w, and
        p^{1/2+o(1)}/(w^{1/2} n) with n processors.
      citation: >-
        inputs/P13-WESOLOWSKI-2026/paper_fulltext.md section 1.1, READ VERBATIM IN THIS
        SESSION. The primary source (van Oorschot-Wiener, J. Cryptology 12(1), 1999) WAS NOT
        READ.
      role: the one-parameter family on which all four functionals are evaluated
    - description: >-
        The five-row concrete cost table at standardised parameter sets, with the
        previous-methods column at negligible memory.
      citation: >-
        inputs/P13-WESOLOWSKI-2026/paper_fulltext.md section 4.1, READ VERBATIM; independently
        present at docs/target-result-profile.md lines 176-182.
      role: supplies the exact five-row known-answer gate
    - description: >-
        Full-cost accounting as hardware times time, with BSGS at n^{1/2+o(1)} steps and
        n^{2/3+o(1)} full cost.
      citation: >-
        knowledge/techniques/KN-TECH-035.md, head READ. Its source KN-LIT-094 WAS NOT READ,
        and the functional form is therefore UNRESOLVED in this record.
      role: the fourth, unresolved column; reported UNRUN if it cannot be transcribed

  reduction_chain:
    core_problem: >-
      Decide, for each named cost functional and parallelism regime, which point of the
      published supersingular time-memory frontier is optimal, and with what magnitude.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. A scalarisation register implies nothing about any other problem.
      In particular it does not transfer to lattice, code-based or MQ frontiers even though
      the same functionals apply there; a transfer would require their own quoted tradeoff
      expressions, which this record does not have.

