hypothesis:
  id: H-SSI-8ff06b
  question_id: RQ-SSI-001
  class: cost_model
  source_proposal: IDEA-20260805-bc8246

  statement: >-
    SCOPE: classical costs only; the one published time-memory curve of the 2026
    p^{1/3+o(1)} supersingular endomorphism algorithm and the classical p^{1/2}(log p)^{O(1)}
    polynomial-memory algorithms it interpolates to; three explicitly DEFINED cost
    functionals plus a fourth that is declared UNRESOLVED. CLAIM TIER derivation. NO ATTACK,
    NO ALGORITHM, NO EXPONENT MOVED, NO QUANTUM CLAIM.
    THE HYPOTHESIS IS THAT THE SIGN OF THIS GOAL'S CENTRAL COMPARISON IS DETERMINED BY THE
    CHOICE OF COST FUNCTIONAL AND BY THE PARALLELISM REGIME, NOT BY THE MATHEMATICS OF
    EITHER ALGORITHM, and that this is provable in four lines.
    Taking the paper's own tradeoff T(w, n) = p^{1/2+o(1)}/(w^{1/2} n) at memory w and n
    processors (READ VERBATIM), and charging area as A = w + n:
      (i)  SEQUENTIALLY (n = 1), d log(A T^2) / d log w = 0 EXACTLY. The whole van
           Oorschot-Wiener curve, from polynomial memory to w = p^{1/3}, is one AT^2 isocost
           point at p^{1+o(1)}. The memory axis is free and the comparison is a TIE.
      (ii) SEQUENTIALLY, d log(A T) / d log w = +1/2 EXACTLY. The polynomial-memory endpoint
           wins by p^{1/6} at every p, and the AT gap NEVER CHANGES SIGN -- there is no
           crossover to find.
      (iii) By time alone, d log T / d log w = -1/2. The p^{1/3} endpoint wins by p^{1/6}.
      (iv) WITH UNBOUNDED PARALLELISM the AT verdict REVERSES: min AT over the admissible
           region is ~2 p^{1/3} at w ~ p^{1/3}, against p^{1/2} for the polynomial-memory
           algorithm at any processor count.
    AND THE WHOLE CONSTRUCTION IS PINNED BY AN EXACT FIVE-ROW KNOWN-ANSWER GATE: charging the
    paper's own "previous methods" column (negligible memory; times 2^128 / 2^192 / 2^256 /
    2^288 / 2^384 at log2 p = 256 / 384 / 512 / 576 / 768) at A = 1 gives
    log2(A T^2) = 256 / 384 / 512 / 576 / 768 = log2 p, EXACTLY, IN ALL FIVE ROWS.
    CONSEQUENCE FOR THIS GOAL, WHICH IS THE POINT: completion criterion 1 requires a
    mechanism that "materially improves a matched baseline ... while charging memory". That
    sentence has no truth value until a functional is named, and this goal's 47 evidence
    records name none.

  mechanism: >-
    DEFINITIONS FIXED BEFORE ANY ARITHMETIC, SO THAT NOTHING DEPENDS ON AN UNREAD SOURCE.
    p prime; w = memory cells; n = processors; A = w + n (one area unit each); T = wall clock
    in unit local operations; no wiring latency and no communication charge. The three
    functionals TIME = T, AT = A*T, AT2 = A*T^2 are DEFINED HERE. A fourth -- this
    programme's own `wiener_full_cost_plus_isogeny_step_count` (KN-TECH-035, KN-TECH-050,
    H-SSI-001) -- IS DECLARED UNRESOLVED: KN-TECH-035 states "BSGS needs n^{1/2+o(1)}
    processor steps but has full cost n^{2/3+o(1)}", which is NOT plain A*T for a
    sqrt(n)-cell table (that gives n), so its functional form involves a three-dimensional
    wiring model living in KN-LIT-094, WHICH WAS NOT READ IN THIS SESSION. Transcribing it is
    a declared experiment stage with an UNRUN disposition, and NOTHING BELOW DEPENDS ON IT.

    (A) THE CURVE, QUOTED NOT RECALLED. inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
    section 1.1, READ VERBATIM: "its memory cost is essentially as high as the complexity
    p^{1/3+o(1)} ... the algorithm essentially resolves a claw-finding problem for two sets
    of size N = p^{1/3+o(1)}. The time-memory tradeoff of van Oorschot-Wiener [43] solves a
    claw-finding problem of this size in time essentially sqrt(N^3/w) =
    p^{1/2+o(1)}/w^{1/2} with memory w. This allows one to interpolate between the
    p^{1/3+o(1)} high-memory algorithm presented here and the classic p^{1/2+o(1)}
    algorithms with polynomial memory like [21]." And: "leading to an attack in time
    p^{1/2+o(1)}/(w^{1/2} n) with memory w and n parallel processors."
    INTERNAL CONSISTENCY CHECKED HERE, NOT ASSUMED: sqrt(N^3/w) = p^{1/2}/w^{1/2} forces
    N^3 = p, i.e. N = p^{1/3}, which is the claw-set size the same paragraph states; and the
    endpoints land where the paper says (w = p^{1/3} gives T = p^{1/3}; w = polylog gives
    T = p^{1/2}).

    (B) THE THREE SEQUENTIAL SLOPES. Substituting A = w and T = p^{1/2+o(1)} w^{-1/2}:
      TIME: T = p^{1/2} w^{-1/2}, slope -1/2.
      AT:   w * p^{1/2} w^{-1/2} = p^{1/2} w^{1/2}, slope +1/2. At w = p^{1/3} this is
            p^{2/3} against p^{1/2} at polynomial memory: A FIXED p^{1/6} DEFICIT AT EVERY p.
      AT2:  w * p w^{-1} = p, slope 0 EXACTLY.
    A fourth quantity, reported because it is what a parallel machine pays: TOTAL WORK
    n*T = p^{1/2} w^{-1/2}, slope -1/2.
    Each is one line of algebra; none is a heuristic; and no record in this goal contains any
    of them.

    (C) THE FIVE-ROW EXACT GATE. Section 4.1 of the same file (READ; independently present
    at docs/target-result-profile.md lines 176-182) gives at log2 p = 256/384/512/576/768:
    new algorithm log2 T = 106.5/157.5/204.2/230.9/302.4 and log2 M =
    92.5/138.6/181.3/206.0/272.2; previous methods log2 T = 128/192/256/288/384 at
    "negligible memory". Charging the previous column at A = 1:
      log2(AT2) = 2 log2 T = 256/384/512/576/768 = log2 p, EXACTLY, FIVE ROWS OUT OF FIVE.
    The asymptotic identity AT2 = p^{1+o(1)} is thus confirmed to the digit against numbers
    the paper's author computed under a different model. For the new algorithm the same
    functional gives log2(AT2) - log2 p = 49.5 / 69.6 / 77.7 / 91.8 / 109.0 bits, i.e.
    fractions of log2 p equal to 0.1934 / 0.1813 / 0.1518 / 0.1594 / 0.1419 -- DESCENDING
    OVERALL, CONSISTENT WITH o(1) -> 0, BUT NOT MONOTONE (0.1518 at 512 sits below 0.1594 at
    576). THAT KINK IS REPORTED, NEVER FITTED THROUGH. Under AT the corresponding excesses
    are 71.0 / 104.1 / 129.5 / 148.9 / 190.6 bits, fractions 0.2773 / 0.2711 / 0.2529 /
    0.2585 / 0.2482, descending toward the asymptotic 1/6 = 0.1667 and never reaching zero.

    (D) WHERE THE VERDICT FLIPS, DERIVED RATHER THAN HIDDEN. With A = w + n and
    T = p^{1/2}/(w^{1/2} n), subject to T >= 1:
      AT = p^{1/2} w^{1/2} n^{-1} + p^{1/2} w^{-1/2},
    the first term being idle-memory cost and the second the total work. At the boundary
    T = 1 (so n = p^{1/2} w^{-1/2}), AT = w + p^{1/2} w^{-1/2}, minimised at
    w^{3/2} = (1/2) p^{1/2}, i.e. w ~ p^{1/3}, giving AT ~ 2 p^{1/3}. Delfs-Galbraith
    parallelised (A = n, T = p^{1/2}/n) has AT = p^{1/2} for every n. SO UNDER AT WITH
    UNBOUNDED PARALLELISM THE ORDERING REVERSES AND THE HIGH-MEMORY POINT WINS BY p^{1/6} --
    the exact opposite of (B). The sign is a function of (functional, regime).
    THIS IS THE WEAKEST OF THE DERIVED STATEMENTS AND IS LABELLED SO: it sits at the T ~ 1
    corner where the quoted vOW expression's range of validity is unknown to this record.

    (E) A FALSIFIABLE PREDICTION ABOUT A SIBLING DELIVERABLE, NOT A CRITICISM OF IT.
    IDEA-20260803-48e258 (GOAL-P13-001) proposes emitting the crossover locus p*(w) between
    the corrected p^{1/3} cost and the matched Delfs-Galbraith / vOW baseline. Under AT2
    that locus is FORCED CONSTANT IN w (both curves have zero AT2 slope); under sequential AT
    it does not exist (the gap never changes sign); under time-only it is the object that
    proposal describes. The two records are complementary, neither depends on the other, and
    this one consumes none of GOAL-P13-001's committed measurements.

  assumptions:
    - >-
      A = w + n with unit area per cell and per processor, and T counting unit local
      operations with NO wiring latency and NO communication charge. This is a DEFINITION
      adopted here, not a claim about physical machines, and every verdict is scoped to it.
    - >-
      The quoted vOW expression is used as given. van Oorschot-Wiener 1999 WAS NOT READ, and
      the expression's range of validity -- especially at the T ~ 1 corner where (D) lives --
      is unknown to this record.
    - >-
      The o(1) is treated as a constant wherever a fraction is reported. THIS IS FALSE (the
      paper states the overhead is superpolynomial) and is exactly why no extrapolated
      crossover is claimed. A naive least-squares extrapolation of the five AT2 fractions to
      zero lands at log2 p ~ 2101; that number is reported as WHAT THE NAIVE FIT SAYS and is
      explicitly NOT a prediction.
    - >-
      Classical only. KN-OPEN-014's quantum cost-convention dispute is out of scope and this
      record must not be cited on it.
    - >-
      NO STATUS CHANGE to H-SSI-001, KN-TECH-035, KN-TECH-050, KN-LIT-094, KN-OPEN-013/014,
      or IDEA-20260803-48e258 is proposed or implied.

  proof_search_map:
    bottleneck: >-
      The unnamed scalarisation. Every comparison this goal makes between a high-memory and a
      low-memory supersingular algorithm passes through an implicit choice of cost functional,
      and that choice is never written down. Removing the ambiguity -- naming the functional --
      is what makes completion criterion 1 decidable; leaving it in place makes every future
      "materially improves a matched baseline" verdict unfalsifiable.
    baseline_embedding:
      parameter_slice: >-
        Baby-step giant-step over a space of size N: T = N/m, A = m, the most standard
        time-memory tradeoff in the subject. Under the three functionals the textbook
        behaviour is TIME slope -1, AT = N EXACTLY INVARIANT in m, AT2 = N^2/m with slope -1.
        This slice reproduces known behaviour exactly and is not merely similar to it.
      reproduction_check: >-
        Symbolic, and it is a HARD GATE: the register must return AT invariant and AT2
        decreasing on the BSGS slice before it is permitted to evaluate the isogeny curve.
        Separately, the five-row exact known-answer gate of mechanism (C) checks the
        transcription and the functional against numbers computed independently by the
        paper's author -- five exact zeros, not a resemblance.
    observation_collision:
      observable: >-
        A single real number M(A, T, n) per algorithm, and the sign of the difference between
        two such numbers.
      distinct_preimage_search: >-
        A COLLISION EXISTS, IS DERIVED IN ADVANCE, AND IS THE RECORD'S HEADLINE RATHER THAN
        ITS FALSIFIER: under AT2 the entire one-parameter vOW family collapses to the single
        value p^{1+o(1)}, so a p^{1/3}-fold range of memory and a p^{1/6}-fold range of time
        share one observable. Distinct ground-truth objects on OPPOSITE sides of the claimed
        conclusion -- the p^{1/3}-memory endpoint and the polynomial-memory endpoint -- are
        NOT separated by AT2. That is a genuine identifiability failure OF THAT FUNCTIONAL,
        and the additional condition that separates them is simply the choice of a different
        functional: AT and TIME both separate them, with opposite signs. The record's content
        is exactly this: the observable does not determine the verdict, the scalarisation
        does.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the comparison from an informal "is it better?" to an exact equality/sign
          question in a model where the answer is a derivative: d log M / d log w evaluated on
          a declared grid. Encoding obligation: the vOW curve is quoted, not re-derived.
          Completeness: four functionals cover the standard choices used in this corpus.
          Soundness: three are defined here and need no source; the fourth is declared
          unresolved. Transfer: NONE is claimed to physical machines. Cost-loss: the model
          charges no communication, and that gap is stated on every verdict.
        predicted_gain: >-
          Converts an unfalsifiable completion criterion into three signed statements with
          stated magnitudes, at zero compute.
      - transform: observable_fiber
        proposed_object: >-
          Hold AT2 fixed (it is constant along the curve) and vary the forgotten structure
          (w, n). The intrinsic invariants distinguishing the resulting machines are the
          memory footprint itself and the total work n*T, both of which vary by p^{1/3} and
          p^{1/6} across the fibre.
        predicted_gain: >-
          Names precisely what AT2 discards, which is what makes "AT2 says tie" a substantive
          statement rather than a null one.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER: FOR ALL p, FOR ALL w in [1, p^{1/3}], THE FUNCTION
      w -> A(w,1) T(w,1)^2 IS CONSTANT, and its constant value is p^{1+o(1)}. The witness
      (the constancy) may not depend on w -- that is the content. The weaker order -- FOR ALL
      w THERE EXISTS a constant matching that w -- is vacuous and is explicitly NOT claimed.
      THE SEPARATE QUANTIFIER TRAP THIS AUDIT IS HUNTING IN THE GOAL'S OWN LANGUAGE:
      "materially improves a matched baseline while charging memory" is written as if the
      improvement were a property of the mechanism (FOR ALL functionals THERE EXISTS an
      improvement), whereas the derivation shows it is a property of the pair (FOR EACH
      functional THERE EXISTS a verdict, and the verdicts disagree). A criterion written in
      the first order is not satisfiable by any mechanism, including the field's best result.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: three exact slopes and one exact five-row identity, under three functionals
        DEFINED IN THE RECORD, applied to one quoted tradeoff expression and one published
        five-row cost table. It cannot certify what a physical machine costs, cannot rank any
        algorithm under the programme's own unresolved `full cost` convention, cannot bear on
        the correctness of the p^{1/3+o(1)} result, cannot move any exponent, and cannot say
        anything about quantum cost.
      nearby_object_control: >-
        THE NEAREST OBJECT ON WHICH THE HOPED-FOR CONCLUSION FAILS IS AN ALGORITHM FAMILY
        WITH NO TIME-MEMORY TRADEOFF AT ALL: Kohel's p*(log p)^{O(1)} algorithm at polynomial
        memory, a single point rather than a curve. Every functional returns a w-INDEPENDENT
        number there, and the register must EMIT "no tradeoff; slope undefined" rather than a
        flat curve. A register that reports a flat AT2 curve for BOTH the vOW family and the
        Kohel point has not distinguished "the memory axis is free" from "there is no memory
        axis", and has therefore not identified the load-bearing structure. This is the
        required arm and it can fail.
    proof_obligations:
      - claim: d log(A T^2)/d log w = 0 on the sequential vOW curve.
        responsibility: correctness
      - claim: d log(A T)/d log w = +1/2 and d log T/d log w = -1/2 on the same curve.
        responsibility: correctness
      - claim: >-
          log2(A T^2) = log2 p exactly in all five rows of the previous-methods column.
        responsibility: baseline
      - claim: >-
          Under A = w + n and T >= 1, min AT is ~2 p^{1/3} at w ~ p^{1/3}, reversing the
          sequential verdict.
        responsibility: feasibility
      - claim: >-
          The BSGS slice reproduces AT invariant and AT2 decreasing.
        responsibility: baseline
      - claim: >-
          The programme's own `full cost` functional is UNRESOLVED here and is reported UNRUN
          rather than guessed.
        responsibility: interface
      - claim: >-
          Nothing transfers to physical machines, to quantum cost, or to any exponent claim.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    DELIBERATELY NULL. NO COMPLEXITY IMPROVEMENT IS CLAIMED AND NO ALGORITHM IS PROPOSED.
    The exponents appearing in this record -- p^{1/3+o(1)}, p^{1/2}(log p)^{O(1)},
    p^{1/2+o(1)}/w^{1/2} -- are all quoted from the frozen in-repo text and are not this
