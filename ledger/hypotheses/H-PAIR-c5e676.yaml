# H-PAIR-c5e676
# Null monic polynomials on the twelve large split primes.
hypothesis:
  id: H-PAIR-c5e676
  question_id: RQ-PAIR-21313f
  goal_id: GOAL-PAIR-001
  source_idea: IDEA-20261005-3a18d1
  experiment_id: EXP-PAIR-cc5e99
  specified_at: '2026-10-05'
  status: approved
  proposed_by: coordinator
  approved_by_decision: DEC-20261005-3052cb
  title: >-
    A fixed null polynomial misses the norm equation on the twelve split primes
  statement: >-
    On the twelve split cells of EXP-PAIR-c28df1, the monic
    polynomial whose lower coefficients are the next terms of
    c = (37*k + 11) mod p, with k starting at 0, has norm-equation
    hits on 0 cells. The root counts in cell order are 1, 1, 1,
    1, 0, 0, 3, 0, 1, 2, 1, and 3. Nine cells have a root and
    still no hit. Three cells have no root. The class polynomial
    on the same cells is already predicted to pass 12 of 12.
    This null passes 0 of 12. These counts are a design-session
    prediction, not a run.
  mechanism: >-
    The class polynomial is supposed to beat a monic polynomial
    of the same degree that was not built from the discriminant.
    The coefficient stream is fixed before any root is inspected.
    A hit is a twist trace of one of its F_p-roots for which
    (trace^2 - 4p) / D is a nonnegative square. A cell with no
    root has no hit.
  assumptions:
    - The twelve primes, discriminants, and degrees are the split cells of EXP-PAIR-c28df1, in that record's order. This record does not re-select them.
    - Coefficients are emitted constant term first. The leading coefficient is 1 and is not part of the stream. k increases by one after each coefficient and is not reset between cells.
    - The curve of j = 0 is y^2 = x^3 + 1. The curve of j = 1728 is y^2 = x^3 + x. Otherwise k = j / (1728 - j) and the curve is y^2 = x^3 + 3 k x + 2 k.
    - One point counter scores both twists. This record does not add a second counter.
  proof_search_map:
    bottleneck: >-
      Whether the separation is the class polynomial rather than
      the size of the primes.
    baseline_embedding:
      parameter_slice: >-
        The twelve named split primes and the one coefficient
        stream beginning at k = 0.
      reproduction_check: >-
        The twelve root counts match, and every twist trace of
        every root fails the norm equation.
    observation_collision:
      observable: a null root whose twist trace solves the norm equation
      distinct_preimage_search: >-
        The class polynomial on the same primes, which is predicted
        to pass all twelve and is not recomputed here.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The nine null polynomials that do have a root.
        predicted_gain: >-
          Those roots still fail the norm equation. No
          discrete-log exponent moves.
    quantifier_order: >-
      For each cell in order, emit its coefficients, then score
      every root of that one polynomial.
    method_ceiling:
      strongest_certifiable_claim: >-
        This one stream on these twelve primes. Not a claim
        about a random polynomial drawn again.
      nearby_object_control: >-
        The four degree-1 cells, each of which has one root and
        zero hits. A hit there is a pipeline failure.
    proof_obligations:
      - claim: Root counts match the twelve pre-registered numbers
        responsibility: baseline
      - claim: Norm-equation hits are 0
        responsibility: correctness
  predictions:
    - metric: null_cell_pass_count
      direction: lower
      minimum_effect: >-
        0 passes out of 12. The class-polynomial prediction on
        the same cells is 12, so the null is strictly below it.
    - metric: null_cells_with_a_root_and_no_hit
      direction: higher
      minimum_effect: >-
        9. A zero-root cell is not counted in this nine.
  falsification_conditions:
    - >-
      The root counts match and one twist trace of one null root
      solves the norm equation. That falsifies the separation on
      this stream.
    - >-
      A root-count mismatch is a failed reproduction. It does not
      by itself falsify the separation.
  interpretation_limits:
    - One coefficient stream is not a distribution. No probability is claimed.
    - The result does not transfer to another stream or another prime.
    - Pollard rho, grumpy giants, and the automorphism discount are unchanged.
  test_boundary: >-
    The twelve null polynomials named below. The class-polynomial
    traces, the height regression, and the inert cells are not
    part of this record.
