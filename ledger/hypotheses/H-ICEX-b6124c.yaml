  interpretation_limits:
  - >-
    FIELD SCOPE. Class groups of imaginary quadratic orders. There is no elliptic
    curve and no ECDLP here, and nothing in this record bears on either.
  - >-
    Scoped to one cost model, one named implementation family, the tested
    discriminants, the recorded storage formats and the tested machine. NOTHING
    HERE STATES THAT ANY DEPLOYED PARAMETER IS ADEQUATE OR INADEQUATE, which
    RQ-CLGRP-66ab7f forbids, and nothing here is a break of any deployed
    construction.
  - >-
    The bit figures are MODEL OUTPUTS with o(1) set to zero and constants outside
    the exponent dropped. They illustrate the shape of the memory constraint and
    are never security estimates.
  - >-
    UNTESTABLE AT REACHABLE SCALE, STATED PLAINLY, IN TWO PLACES. First, part (D)-
    the memory-bounded crossover cannot move under any bound in the declared range
    because the crossover sits at |D| about 2^{113} to 2^{235} where the optimal
    memory is under 2^15 words; a 2^30-word bound first binds at |D| about
    2^{790}, and no certified class-group computation at that size is reachable.
    Second, the transfer of a fitted omega- the fit is taken at matrix dimensions
    in the low thousands and the model implies dimensions of order 2^35 at
    deployed sizes. THAT TRANSFER IS UNJUSTIFIED AND IS RECORDED AS UNJUSTIFIED;
    it is the largest single source of error in c(W).
  - >-
    c(W) IS CLASS-GROUP-FREE BY CONSTRUCTION AND THAT IS RECORDED AS A PROOF
    RATHER THAN AS AN ARM. It is a function of beta, omega and W alone under the
    two-leg cost model and mentions no class group; a null arm on it would be the
    identical arithmetic. The MEASURED memory-to-time ratio is a different object
    and does require the structureless-matrix null of M5.
  - >-
    c(W) is a statement about the best configuration OF THIS ALGORITHM under a
    memory bound. It says nothing about what a different low-memory algorithm
    might achieve, and the gap between the two known corners of the (time, memory)
    frontier is explicitly left open and handed forward.
  - >-
    The omega = 2 branch's constant of 1 is COFACTOR-LEVEL relative to 3/sqrt(8),
    is explicitly not target-class, and is almost certainly published. It is
    recorded for completeness and must not be presented as an improvement by this
    program unless a primary read establishes otherwise.
  - >-
    THREE FRONTIER CELLS ARE UNCHECKED- the memory figures for Hafner-McCurley,
    for Biasse-Erukulangara, and for de Boer-Pellet-Mary-Wesolowski beyond page 4.
    That is recorded as a gap in this record's own frontier table rather than
    papered over.
