hypothesis:
  id: H-ICEX-b6124c
  question_id: RQ-CLGRP-66ab7f
  source_idea_id: IDEA-20260818-ffeddf
  title: >-
    The deployed class-group cost model quotes a time constant with no memory
    axis, and the same balance that fixes the constant also fixes the memory
    exponent- the general optimum is beta = 1/(2 sqrt(omega-1)) with constant
    omega/(2 sqrt(omega-1)) and memory-to-time exponent ratio 1/omega, so the
    proved 3/sqrt(8) is exactly the cubic-linear-algebra value; but two of the
    source idea's four measurable bands are computed here to be DEGENERATE - the
    1024-bit c(W) grid returns the unconstrained constant at four of its five
    points and its headline 24-bit spread is 6.37 bits, and the memory-bounded
    crossover of part (D) moves by EXACTLY ZERO bits because no memory bound in
    the declared range binds at the crossover discriminant
  statement: >-
    SCOPE FIELD, AND THE HANDOFF LABEL IS WRONG FOR THIS RECORD. This is index
    calculus for CLASS GROUPS OF IMAGINARY QUADRATIC ORDERS, as used in
    verifiable delay functions, RSA-free accumulators and hidden-order-group
    commitments, scoped by RQ-CLGRP-66ab7f which this task opened and read in
    full. There is no elliptic curve and no ECDLP anywhere in this record. The
    dispatching handoff describes all seven proposals in its batch as prime-field
    ECDLP; that label is provisional and is incorrect here.

    (A) THE BALANCE, WITH ITS GENERAL SOLUTION DERIVED HERE. Let d = ln|D| and
    write the factor-base bound as ln B = beta * sqrt(d ln d). The relation-
    collection leg has exponent coefficient beta + 1/(4 beta), by the
    Canfield-Erdos-Pomerance smoothness density applied to reduced-ideal norms of
    size |D|^{1/2}; the linear-algebra leg has omega * beta. The total constant is
    min over beta of max(beta + 1/(4 beta), omega * beta). The two legs cross at
    omega*beta = beta + 1/(4 beta), i.e. (omega - 1) beta = 1/(4 beta), i.e.
      beta_opt = 1/(2 sqrt(omega - 1)),  c(omega) = omega/(2 sqrt(omega - 1)).
    THAT CLOSED FORM IS DERIVED IN THIS RECORD AND IS THE FIXTURE. It gives, to
    six decimals-
      omega = 2      -> (0.500000, 1.000000)
      omega = 2.376  -> (0.426246, 1.012761)
      omega = 3      -> (0.353553, 1.060660)
    and 1.060660 = 3/sqrt(8) exactly. The crossing is the minimum of the max
    because beta + 1/(4 beta) is decreasing for beta below 1/2 while omega*beta
    is increasing, so the max is decreasing then increasing.

    (B) THE MEMORY EXPONENT, WITH THE DENSE ROWS ADDED. At the optimum the
    relation matrix has dimension L_{|D|}[1/2, beta], so sparse storage costs
    L_{|D|}[1/2, beta] machine words and dense storage L_{|D|}[1/2, 2 beta]. The
    memory-to-time exponent ratio is therefore beta/(omega beta) = 1/omega for
    sparse storage and 2/omega for dense. FORCED VALUES- 0.3333 and 0.6667 at
    omega = 3, and 0.5000 and 1.0000 at omega = 2. THE SOURCE IDEA'S
    PRE-REGISTERED BAND LISTS ONLY 0.333 plus or minus 0.05 AND 0.5 plus or minus
    0.05, OMITTING THE DENSE ROWS. A dense-storage run would land at 0.667 or
    1.000, outside both bands, and would be misread as evidence that the two-leg
    cost model is inadequate. The band is repaired here to the four forced values
    {0.3333, 0.5000, 0.6667, 1.0000}, each with a plus or minus 0.05 window, keyed
    by the RECORDED storage format. The four are separated by at least 0.1667 so
    the windows do not overlap.

    (C) THE c(W) HEADLINE IS ARITHMETICALLY WRONG AT 1024 BITS, AND THE ERROR IS
    COMPUTED HERE. Under a memory bound of W words the adversary is constrained
    to beta_W = min(ln W / sqrt(d ln d), 1/(2 sqrt 2)) and the best available
    constant is c(W) = beta_W + 1/(4 beta_W). At 1024 bits, d = 1024 ln 2 =
    709.783, ln d = 6.5650, sqrt(d ln d) = 68.262, so the unconstrained optimum
    needs W_opt = exp(0.353553 * 68.262) = 2^34.83 words - which is the source
    idea's own 2^{34.8} figure. At W = 2^30, ln W = 20.794, beta_W = 0.30462 and
    c(W) = 1.12532, an excess over 1.060660 of 0.06466, i.e.
    0.06466 * 68.262 / ln 2 = 6.37 BITS. THE SOURCE IDEA CLAIMS 'c(W) exceeds
    c(infinity) = 1.0607 by at least 0.35 at 1024 bits for W = 2^{30} words, i.e.
    at least 0.35*68.3 = 24 bits'. THE COMPUTED VALUE IS 0.0647 AND 6.37 BITS -
    the claim overstates by a factor of about 3.8, and it sits only 1.4 bits above
    the record's own 5-bit falsification line. THE 0.35 FIGURE IS CORRECT AT 2048
    BITS, NOT AT 1024- there d = 1419.565, ln d = 7.2580, sqrt(d ln d) = 101.505,
    W_opt = 2^51.78, and at W = 2^30 beta_W = 0.20486 with c(W) = 1.42522, an
    excess of 0.36456, i.e. 53.4 bits. The source appears to have transposed the
    two deployed sizes.

    (D) THE 1024-BIT W GRID IS DEGENERATE AT FOUR OF ITS FIVE POINTS, AND THE
    REPLACEMENT IS COMPUTED. The source declares W in {2^30, 2^35, 2^40, 2^45,
    2^50} words at both deployed sizes. At 1024 bits W_opt is 2^34.83, so
    2^40, 2^45 and 2^50 all leave the constraint slack and return c(infinity)
    EXACTLY, and 2^35 is marginal- only 2^30 binds. The spread over that grid is
    6.37 bits. REPLACEMENT AT 1024 BITS, COMPUTED SO EVERY POINT BINDS-
    W in {2^20, 2^24, 2^28, 2^31, 2^34} words, giving excesses of 36.77, 20.57,
    10.14, 4.76 and 0.86 bits respectively, a spread of 35.9 bits and far outside
    the 5-bit falsification line. AT 2048 BITS THE DECLARED GRID IS FINE- W_opt is
    2^51.78 so all five points bind, giving 53.39, 32.85, 18.71, 8.82 and 1.91
    bits, a spread of 51.5 bits.

    (E) PART (D) OF THE SOURCE IDEA IS DEGENERATE BY ALGEBRA AND IS DECLARED
    UNDERPOWERED. The memory-bounded crossover against the generic analytic
    family is claimed to 'move upward monotonically as W falls, by at least 30
    bits between W = 2^{50} and W = 2^{30} words'. Setting the generic family's
    |D|^{1/4} equal to exp(c sqrt(d ln d)) gives d/4 = c sqrt(d ln d), hence
    d / ln d = 16 c^2. At c = 3/sqrt(8) that is d/ln d = 18, so d = 78.5 and
    |D| = 2^{113.3}; at c = sqrt(2) it is d/ln d = 32, so d = 163.0 and
    |D| = 2^{235.2}. AT THOSE DISCRIMINANTS THE INDEX-CALCULUS OPTIMAL MEMORY IS
    exp(0.353553 * sqrt(d ln d)), which is 694 words at d = 78.5 and 26570 words
    at d = 163 - that is 2^9.4 and 2^14.7 words. NO MEMORY BOUND IN THE DECLARED
    RANGE 2^30 TO 2^50 WORDS BINDS THERE, so the crossover MOVES BY EXACTLY ZERO
    BITS and the 30-bit prediction cannot fire. A bound of 2^30 words first binds
    where exp(0.353553 sqrt(d ln d)) = 2^30, i.e. sqrt(d ln d) = 58.81,
    d ln d = 3459, d = 548, |D| = 2^{790.6}. PART (D) IS THEREFORE UNTESTABLE AT
    ANY REACHABLE DISCRIMINANT AND IS DECLARED UNDERPOWERED, with the condition
    stated- it requires |D| above about 2^{790} for a 2^30-word bound to bind at
    all. The repair for the tested part is to express the bound as a FRACTION f
    of W_opt(d), W = f * W_opt(d) with f in {2^-14, 2^-10, 2^-6, 2^-3, 2^0}, which
    binds by construction at every rung; the crossover is then the solution of the
    fixed point d = 4 L^2 / (L - ln d) with L = ln W, and is emitted as a model
    output with its own extrapolation distance stated.

    (F) THE LINEAR-ALGEBRA TIME-FRACTION BAND IS NOT A MODEL PREDICTION, AND IS
    REPLACED. The source pre-registers 'a fraction in [0.35, 0.65] and
    approximately CONSTANT across discriminant sizes'. The two-leg model at the
    optimum forces only that the two legs have EQUAL EXPONENTS; it says nothing
    about their constant ratio, so any fraction is consistent with it. A real
    implementation also picks its factor-base bound by an internal heuristic
    rather than at the modelled optimum, so the fraction at the default point is
    unconstrained. THE REPLACEMENT IS A STATISTIC THE MODEL DOES FORCE- over the
    five-point beta sweep at a fixed |D|, the beta minimising total time must
    coincide, within one sweep point, with the beta at which the linear-algebra
    time fraction crosses 0.5. Under a two-leg model those two betas are the same
    point; under a model with a third cost that is not a function of beta they
    need not be. That is non-degenerate and is measured on the sweep the record
    already requires.

    (G) WHAT IS NOT CLAIMED. No improvement to the unconstrained time exponent.
    The omega = 2 branch's constant of 1 against 3/sqrt(8) is a 6 percent
    COFACTOR-LEVEL move, explicitly not target-class, and is expected to be
    already published; it is recorded because a proposal that derived it and
    stayed silent would be hiding a result it did not check. NOTHING HERE IS A
    BREAK OF ANY DEPLOYED CONSTRUCTION, and RQ-CLGRP-66ab7f forbids any statement
    that a deployed parameter is adequate or inadequate.
  mechanism: >-
    Index calculus stores a factor base and a relation matrix whose sizes are tied
    to beta, and beta is exactly what buys the good time constant. Capping memory
    caps beta and pushes cost onto the 1/(4 beta) smoothness term, which grows
    without bound as beta falls. The competing generic and analytic family runs in
    |D|^{1/4+o(1)} with polynomial memory, or is itself tradeable along a
    distinguished-point time-memory curve. Two families with opposite responses to
    the same constraint- that is why a crossover between them moves under a memory
    bound at all, and why the movement is in principle a measurable quantity. The
    tracked object is the resource PAIR (log time, log memory) of one complete
    computation as beta varies, i.e. the algorithm's whole Pareto trace rather than
    its optimal point. Both coordinates are closed-form in beta under the cost
    model, so one step is a change of beta and is measurable exactly by re-running
    at a different factor-base bound. The trace DISSOLVES if a third cost appears
    that is not a function of beta, and integer coefficient growth in the
    Hermite or Smith normal form step is the named candidate.
  assumptions:
  - >-
    Total cost is the sum of exactly two legs, relation collection and linear
    algebra, with all other steps of lower order over the tested range. This is
    the standard modelling convention and is asserted, not proved; parts (B)
    through (E) all fail if a third leg is comparable.
  - >-
    Memory is charged in WORDS and time in the exponent coefficient of
    sqrt(d ln d). The two are never divided into each other except as the
    explicitly named memory-to-time EXPONENT ratio, which is a ratio of two
    dimensionless exponents.
  - >-
    Storage format is recorded per run and memory exponents are reported per
    format, never pooled. Sparse and dense differ by a factor of two in the
    exponent, so pooling them produces a meaningless fitted ratio.
  - >-
    Every reported bit figure is a MODEL OUTPUT with o(1) set to zero and
    constants outside the exponent dropped. It illustrates the shape of the
    memory constraint and is never a security estimate.
  proof_search_map:
    bottleneck: >-
      The integer linear-algebra step, the Hermite or Smith normal form of the
      relation matrix. Replacing structure recovery by order recovery pinned
      against an analytic estimate changes omega from 3 to 2, which by the closed
      form of statement (A) changes beta_opt from 0.353553 to 0.5, the constant
      from 1.060660 to 1, and the memory-to-time exponent ratio from 1/3 to 1/2.
      Nothing else in the algorithm changes.
    baseline_embedding:
      parameter_slice: >-
        omega = 3, beta = 1/(2 sqrt 2). This slice must reproduce 3/sqrt(8)
        exactly, and the omega = 3, beta free slice must reproduce the whole
        constant as a minimum.
      reproduction_check: >-
        FROZEN SYMBOLIC FIXTURE, ZERO COMPUTE, BLOCKING. A routine that, given
        omega, returns argmin over beta of max(beta + 1/(4 beta), omega beta) and
        its value, asserted against the CLOSED FORM
        beta = 1/(2 sqrt(omega-1)), c = omega/(2 sqrt(omega-1)) and against the
        literal triples (2, 0.500000, 1.000000), (2.376, 0.426246, 1.012761) and
        (3, 0.353553, 1.060660) to six decimal places. Separately, a PRIMARY READ
        of the Biasse-Erukulangara proof to check whether its balance is this one.
        If the primary read shows a different balance, part (A) is WITHDRAWN and
        the numerical coincidence is recorded as a coincidence.
    observation_collision:
      observable: >-
        The pair (measured wall clock, measured peak memory) of a completed
        computation.
      distinct_preimage_search: >-
        A COLLISION IS EXPECTED AND IS HANDLED IN ADVANCE. Two different
        (omega, beta) configurations can land on the same (T, M) point - dense
        cubic linear algebra at small beta against sparse quadratic at larger beta
        - so the observable does NOT identify the configuration. The separator is
        the SPLIT, the fraction of time spent in linear algebra, which differs
        between the two even when the totals agree. The split is therefore a
        REQUIRED metric and any conclusion drawn from (T, M) alone is
        inadmissible.
    constructive_transforms:
    - transform: specialization_pack
      proposed_object: >-
        Replace the integer Hermite or Smith computation by an ERH-conditional
        analytic estimate of h(D) from a truncated Euler product, sparse kernel
        computation modulo several small primes with memory O(M) words, and
        reassembly verified against the analytic interval.
      predicted_gain: >-
        omega from 3 to 2, constant from 1.060660 to 1 - EXPLICITLY
        COFACTOR-LEVEL, 6 percent, not target-class - and memory exponent from
        0.354 to 0.5 of sqrt(d ln d). That trade BUYS time and PAYS memory, the
        opposite of what a memory-bounded adversary wants, which is exactly why
        the c(W) curve is the right output rather than a single improved
        constant.
    - transform: boundary_lift
      proposed_object: >-
        Extend the certificate family from the computed structure to the computed
        structure together with the beta at which it was computed and the peak
        memory it required, so a cost record is a point on a trace.
      predicted_gain: >-
        Makes c(W) an artifact the program can accumulate across runs and goals.
        Low mathematical content, high reuse.
    quantifier_order: >-
      FOR ALL memory bounds W and FOR ALL discriminants D with d = ln|D|, THERE
      EXISTS beta_W = min(ln W / sqrt(d ln d), 1/(2 sqrt 2)) such that the
      index-calculus cost is exp((beta_W + 1/(4 beta_W) + o(1)) sqrt(d ln d))
      within memory W. beta_W depends on BOTH W and D, which is legitimate
      because an adversary knows both. What would be a quantifier error, and what
      no step of the analysis does, is choosing beta after seeing the instance's
      class group.
    method_ceiling:
      strongest_certifiable_claim: >-
        A statement about THIS COST MODEL and the measured behaviour of ONE
        implementation family- that the time-optimal configuration requires memory
        exponentially large in sqrt(d ln d), and that constraining memory degrades
        the time constant along the stated curve. It CANNOT certify that no
        low-memory algorithm with a better constant exists, and no record under
        this hypothesis may say so.
      nearby_object_control: >-
        Apply the identical analysis to integer factoring by the quadratic sieve,
        where the same balance structure holds and where record computations'
        memory use is publicly documented. If the analysis predicts a memory
        exponent grossly inconsistent with published record memory, the model is
        wrong in a way the class-group case would hide. This control is
        arithmetic plus a literature lookup and is the cheapest available sanity
        check.
    proof_obligations:
    - claim: 'ln|FB| = beta sqrt(d ln d)(1+o(1)).'
      responsibility: size
    - claim: 'ln(trials per relation) = (1/(4 beta)) sqrt(d ln d)(1+o(1)) via Canfield-Erdos-Pomerance.'
      responsibility: success_probability
    - claim: 'Linear algebra costs omega*beta in the exponent, coefficient growth inside polylog.'
      responsibility: runtime
    - claim: 'argmin over beta of max(beta + 1/(4 beta), omega beta) is 1/(2 sqrt(omega-1)) with value omega/(2 sqrt(omega-1)).'
      responsibility: baseline
    - claim: 'Memory is L[1/2, beta] sparse and L[1/2, 2 beta] dense, so the memory-to-time exponent ratio is 1/omega and 2/omega.'
      responsibility: memory
    - claim: 'Under memory bound W the best constant is beta_W + 1/(4 beta_W).'
      responsibility: strictness
    - claim: >-
        A memory bound binds at a given d only if W is below
        exp(beta_opt sqrt(d ln d)); at the family crossover it does not for any W
        in the declared range.
      responsibility: feasibility
    - claim: Claims are scoped to this cost model, this implementation family, and the tested discriminants.
      responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: >-
      Class group and structure computation for imaginary quadratic orders, the
      hardness assumption underlying class-group hidden-order constructions.
    prior_best: >-
      'L_{|D|}[1/2, 3/sqrt(8)] expected time under GRH for Hafner-McCurley, per
      Biasse-Erukulangara as retrieved by the source record at abstract level.
      NO MEMORY BOUND IS STATED IN THE RETRIEVED ABSTRACT - that frontier cell is
      recorded as UNCHECKED.'
    time_exponent: >-
      NO IMPROVEMENT CLAIMED. The record derives and proposes to measure the
      memory-constrained family exp((beta_W + 1/(4 beta_W) + o(1)) sqrt(d ln d)),
      which reduces to the known unconstrained constant at large W.
    memory_exponent: >-
      L_{|D|}[1/2, beta] words sparse and L_{|D|}[1/2, 2 beta] dense, with
      beta = 1/(2 sqrt(omega-1)); memory-to-time exponent ratio 1/omega sparse and
      2/omega dense. At omega = 3 that is 2^{34.8} words at a 1024-bit
      discriminant and 2^{51.8} at 2048 bits under the model with o(1) set to
      zero and before coefficient growth.
    hidden_cofactor: >-
      The o(1) is large at reachable sizes and the memory figures inherit it
      doubly. Integer coefficient growth in the Hermite or Smith step is hidden
      entirely inside polylog and is the most likely place for the model to be
      wrong by a large factor; it is not a function of beta, so if it dominates
      the whole one-parameter trace is the wrong object.
    claim_kind: cofactor_improvement
  heuristic_assumptions:
  - id: H1
    formal_statement: >-
      (GRH / ERH.) GRH holds for the relevant L-functions, underwriting the
      Bach-type bound that makes a polylogarithmic factor base generate Cl(D), the
      retrieved constant 3/sqrt(8), the analytic pinning of h(D) used in the
      specialisation transform, and the |D|^{1/4} generic row.
    random_model_justification: >-
      Unproved. Unconditional analogues exist with worse bounds, so its
      contribution is quantifiable rather than hidden. It is numbered because
      every complexity statement in this record inherits it.
    supporting_results:
    - >-
      None internal. The dependence is declared rather than discharged.
    validation_experiment_ids:
    - EXP-ICEX-432a29
    falsification_condition: >-
      Not falsifiable here. TESTABLE PROXY- the computed group order must match
      the ERH-interval analytic estimate at every tested discriminant. A mismatch
      is a bug until proved otherwise.
  - id: H2
    formal_statement: >-
      (SMOOTHNESS DENSITY.) Reduced-ideal norms of size |D|^{1/2} are B-smooth
      with probability u^{-u(1+o(1))}, u = (d/2)/ln B, uniformly for u in
      ((log|D|)^eps, (log|D|)^{1-eps}). This supplies the 1/(4 beta) leg and is
      load-bearing for c(W).
    random_model_justification: >-
      RIGOROUS SIZE INGREDIENT- Gauss reduction confines the candidate to
      [1, sqrt(|D|/3)] with counting measure near-uniform there. CLASSICAL
      DISTRIBUTION THEOREM IMITATED- Canfield-Erdos-Pomerance,
      Psi(X,B) = X u^{-u(1+o(1))}.
    supporting_results:
    - >-
      'Canfield, Erdos and Pomerance on smooth numbers. RECALLED- not opened by
      this task and no KN-LIT entry is cited by the source record. Pointer, not
      support.'
    validation_experiment_ids:
    - EXP-ICEX-432a29
    falsification_condition: >-
      Realised smoothness rate deviates from the predicted density by more than
      15 percent systematically across three consecutive u values.
  - id: H3
    formal_statement: >-
      (LINEAR ALGEBRA EXPONENT.) The integer Hermite or Smith computation on the
      relation matrix costs M^omega up to polylog factors and up to coefficient
      growth, with omega = 3 for dense structure recovery and omega = 2 for the
      sparse black-box kernel, uniformly over the tested matrix dimensions.
    random_model_justification: >-
      RIGOROUS INGREDIENT- the worst-case complexities of the underlying routines
      are known. THE GAP, AND IT IS THE RECORD'S CENTRAL WEAKNESS- integer
      coefficient growth in Hermite or Smith is not captured by an exponent in M
      at all, and if it dominates, omega is not a well-defined parameter for this
      matrix family. That is exactly what the structureless-matrix null and the
      largest-intermediate-coefficient metric measure.
    supporting_results:
    - >-
      'Wiedemann and block-Wiedemann sparse linear algebra; Buchmann-Duellmann on
      the class-group linear-algebra step. RECALLED by the source record with
      verified_by null; not opened by this task. Pointers, not support.'
    validation_experiment_ids:
    - EXP-ICEX-432a29
    falsification_condition: >-
      The measured linear-algebra time against matrix dimension, across the beta
      sweep at fixed |D|, is not consistent with any single omega in [2, 3] within
      intervals.
  - id: H4
    formal_statement: >-
      (COST-MODEL COMPLETENESS.) Total cost is the sum of exactly two legs, with
      all other steps - reduction, factor-base construction, certificate emission
      - of lower order, uniformly over the tested range.
    random_model_justification: >-
      No rigorous support; this is the standard modelling convention in the
      index-calculus literature and is asserted, not proved. It is numbered
      because the memory exponent, the c(W) curve and the crossover all fail if a
      third leg is comparable.
    supporting_results: []
    validation_experiment_ids:
    - EXP-ICEX-432a29
    falsification_condition: >-
      Measured 'other' time exceeds 20 percent of total at any ladder rung.
