      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-b0fcda.yaml
    - ref: KR-IC-5ea2f8
      provenance: internal
      claim: >-
        GHS Weil descent is a cover attack onto a hyperelliptic
        Jacobian. This hypothesis reports no cover genus.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5ea2f8.yaml
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        An isogeny walk cannot reach a different group-structure
        weakness. This hypothesis walks no isogeny.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
