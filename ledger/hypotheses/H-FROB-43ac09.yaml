      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
    - ref: KR-IC-b0fcda
      provenance: internal
      claim: >-
        A Frobenius-invariant factor base saves a factor up to n on
