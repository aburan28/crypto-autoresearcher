# H-FROB-43ac09 — specified from IDEA-20261005-bda728.
# Protocol approval is DEC-20261006-6d6850. The source idea lives on
# origin/design/qlwe-9f4777-logunit (PR 1880) and is not copied here.
# This record asserts no ECDLP exponent change. No field element was
# enumerated in this design.
hypothesis:
  id: H-FROB-43ac09
  question_id: RQ-FROB-7d8dd4
  source_proposal: IDEA-20261005-bda728
  goal_id: null
  goal_id_note: >-
    This design binds the question RQ-FROB-7d8dd4 and does not attach a
    goal record. It does not create one.
  status: approved
  status_note: >-
    approved means the dimension protocol in EXP-FROB-aacf57 is approved
    for a later executor. It does not mean the pair (1, 0) was observed.
    Status moves only by DEC-20261006-6d6850 under the standing user
    authorization of 2026-09-06. No field was enumerated in this design.
  proposed_by: coordinator
  conversion_note: >-
    The objects, the pair (1, 0), the span rank 5, and the refusal to
    move an exponent are carried from IDEA-20261005-bda728, which was
    read via git show of origin/design/qlwe-9f4777-logunit. The
    Coordinator froze the Semaev formula, the lex selection rules, and
    the cycle before any run of EXP-FROB-aacf57.

  statement: >-
    TEST BOUNDARY. One subfield curve and one null curve, one quadratic
    on each, at (q, n) = (11, 5). The subfield curve E is the first
    nonsingular ordinary short-Weierstrass curve y^2 = x^3 + A x + B
    over F_11 in lexicographic order of (A, B). The null curve E0 is
    the first nonsingular short-Weierstrass curve over F_{11^5} whose
    j-invariant is not in F_11, in the same lexicographic order on that
    field. The quadratic is Q_E(T) = S_3(alpha, beta, T), the third
    Semaev summation polynomial in its third variable, at the first
    pair (alpha, beta) in the first 64 lexicographic slots of
    F_{11^5}^2 for which Q_E has degree 2 and neither root lies in
    F_11. The null quadratic is Q_0(T) = S_3(alpha, beta, T) on E0 at
    that same pair. S_3 is the formula in KN-TECH-002. No factor base
    is built. The curve y^2 = x^3 + x + 1 is not this object.

    PRE-REGISTERED PREDICTION, fixed before any run. The shift-invariant
    dimension dim(V_E^{C_5}) equals 1 and dim(V_{E0}^{C_5}) equals 0.
    Any other pair of integers is a negative. The span rank dim V_E
    equals 5. That rank is required for success and is not a second
    copy of the pair (1, 0).

    DISTINGUISHABLE OUTCOMES. (1) Both linear-algebra methods agree,
    the controls pass, dim V_E = 5, and the dimension pair is (1, 0):
    success. (2) Both methods agree, the run is valid, and the
    dimension pair is any pair other than (1, 0): negative. (3) The
    pair is (1, 0) and dim V_E is not 5, or the transposition control
    also has invariant dimension 1: not success. (4) No admissible
    pair in the first 64 slots, the two methods disagree, E0 has j in
    F_11, or S_3 is identically zero: invalid or a failed existence
    clause, not the dimension-pair success. (5) A timeout or crash:
    failed_infrastructure, not evidence.

    No discrete-log exponent moves. The rho exponent stays 1/2.

  mechanism: >-
    Two readings of one descended quadratic are separated before any
    run. Reading A: the 11-power Frobenius contributes exactly the
    trivial cyclic symmetry of Q_E, one invariant line in a
    five-dimensional span, and the same formal cycle on the null
    curve E0, which has no model over F_11, has invariant dimension
    0. Reading B: the pair is not (1, 0). A drop on both curves would
    mean the cycle is an artifact of the coordinate permutation. The
    representation is the normal-basis coordinates of one
    x-coordinate in F_{11^5}. Sigma is the cyclic shift induced by
    the 11-power Frobenius, not translation on the group of points.
    The projection keeps the trivial isotypic component and discards
    the other four. That discard is not invertible. The integer under
    test is the invariant dimension. No factor base is chosen.

  assumptions:
    - >-
      A normal basis of F_{11^5}/F_11 is fixed by the rule in
      EXP-FROB-aacf57 before either arm runs, and both arms use it.
    - >-
      Characteristic 11 is greater than 3, so the classical shape of
      S_3 in KN-TECH-002 is the polynomial that is expanded. If that
      expansion is the zero polynomial, the run stops as invalid.
    - >-
      The integer 5 is invertible in F_11. The executor checks
      5 * 9 = 45 ≡ 1 (mod 11) before any dimension is reported. The
      inverse is used only as the trivial projector, not as a
      deleted-equation rewrite.
    - >-
      n = 5 is prime, so the only proper subfield of F_{11^5} is
      F_11, and j not in F_11 is the null test.
    - Toy scope is this one quadratic at q = 11 and n = 5. No factor base is built.

  proof_search_map:
    bottleneck: >-
      Whether one descended quadratic's F_11-span is a free cyclic
      module of rank 1, whose invariant line is exactly
      one-dimensional on E and zero-dimensional on E0.
    baseline_embedding:
      parameter_slice: >-
        The factor-n symmetry at n = 5, with no factor base, on one
        quadratic S_3(alpha, beta, T).
      reproduction_check: >-
        dim V_E = 5 and dim(V_E^{C_5}) = 1. Any other pair of those
        two integers fails the trivial-symmetry baseline.
    observation_collision:
      observable: the pair (dim(V_E^{C_5}), dim(V_{E0}^{C_5}))
      distinct_preimage_search: >-
        E0 carries the same formal cycle. Equal invariant dimensions
        on E and E0 mean the observable does not see the subfield model.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The five normal-basis coordinate quadrics of Q_E and of Q_0,
          and the trivial projector of C_5.
        predicted_gain: >-
          The integer pair (1, 0). No exponent.
    quantifier_order: >-
      There exist the first lex curve E/F_11, the first null curve E0,
      and the first admissible pair (alpha, beta) in the first 64
      slots, such that dim(V_E^{C_5}) = 1, dim V_E = 5, and
      dim(V_{E0}^{C_5}) = 0. This is not a statement for all curves.
    method_ceiling:
      strongest_certifiable_claim: >-
        At (q, n) = (11, 5), this one quadratic has invariant
        dimension 1 on E and 0 on E0, or it does not.
      nearby_object_control: >-
        E0, where the desired invariant dimension 1 is predicted to fail.
    proof_obligations:
      - claim: dim V_E = 5 and dim(V_E^{C_5}) = 1
        responsibility: correctness
      - claim: dim(V_{E0}^{C_5}) = 0
        responsibility: baseline
      - claim: each coordinate polynomial has degree at most 2
        responsibility: scope
    not_applicable_reason: >-
      The map applies to this one quadratic. It is not omitted. No
      exponent bookkeeping is claimed.

  asymptotic_claim:
    problem: none — no complexity improvement is claimed
    prior_best: >-
      Pollard rho at exponent 1/2, and KR-IC-b0fcda at a factor n on
      systems and n^2 on linear algebra. Neither is beaten.
    time_exponent: unchanged
    memory_exponent: unchanged
    hidden_cofactor: >-
      None in an o(1) term. The output is two integers, the dimension
      pair, plus the span rank. The discrete-log time exponent stays 1/2.
    claim_kind: not_applicable

  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        For the first admissible (alpha, beta) on E, the five descended
        quadrics are an F_11-basis of a free module of rank 1 over
        F_11[C_5], hence have invariant dimension 1, and the same pair
        on E0 has invariant dimension 0. This imitates the regular
        representation of a cyclic group of prime order, not a
        smoothness law. One quadratic. No transfer to n greater than 5.
      random_model_justification: >-
        The comparison distribution is a point mass at the pair (1, 0)
        inside a span of rank 5. This imitates no random integer. A
        free rank-1 module over F_11[C_5] has a one-dimensional trivial
        isotypic component. That is a theorem about the group algebra,
        not a theorem about S_3. The null curve is the object on which
        the desired dimension 1 is predicted to fail.
      supporting_results: []
      validation_experiment_ids:
        - EXP-FROB-aacf57
      falsification_condition: >-
        The measured pair (dim(V_E^{C_5}), dim(V_{E0}^{C_5})) is any
        pair of integers other than (1, 0).

  structural_ingredients:
    - description: >-
        KR-IC-5a43e5 states that S_3 vanishes when three x-coordinates
        are those of points summing to the identity up to signs, and
        that S_3 is quadratic in each variable. The explicit polynomial
        used here is the one in KN-TECH-002. This hypothesis does not
        build a factor base.
      citation: KR-IC-5a43e5
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
      role: shape of the quadratic
    - description: >-
        KN-TECH-002 records the classical S_3 formula for
        y^2 = x^3 + a x + b. That formula is the polynomial expanded
        in this protocol.
      citation: KN-TECH-002
      provenance: internal
      verified_by: knowledge/techniques/KN-TECH-002.md
      role: explicit polynomial
    - description: >-
        KR-IC-b0fcda states that a Frobenius-invariant factor base
        reduces the number of systems by up to 1/n and speeds linear
        algebra by n^2. This hypothesis builds no such factor base and
        does not claim that saving.
      citation: KR-IC-b0fcda
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-b0fcda.yaml
      role: unchanged factor-base baseline
    - description: >-
        KR-IC-5ea2f8 states that GHS Weil descent maps an
        extension-field ECDLP to a hyperelliptic Jacobian and is
        effective only for special fields and curves. This hypothesis
        reports no cover genus.
      citation: KR-IC-5ea2f8
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5ea2f8.yaml
      role: scope fence; no cover attack
    - description: >-
        KR-RHO-755e35 states that an isogeny walk cannot reach a
        different group-structure class of weakness. This hypothesis
        walks no isogeny and compares no point counts as a weakness.
      citation: KR-RHO-755e35
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
      role: scope fence; no isogeny walk
    - description: >-
        KR-RHO-13bf67 states that a generic discrete logarithm needs
        Omega(sqrt(p)) group operations. A dimension is not a discrete
        logarithm, and this hypothesis does not change that exponent.
      citation: KR-RHO-13bf67
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
      role: unchanged generic exponent

  reduction_chain:
    core_problem: >-
      Whether the shift-invariant dimension pair of one descended
      quadratic at 11^5 is (1, 0). Not an attack.
    corollaries: []

  predictions:
    - metric: invariant_dimension_object
      direction: different
      minimum_effect: >-
        Exactly 1 on E. Together with the null dimension, the predicted
        pair is (1, 0). Any other pair is the negative.
    - metric: invariant_dimension_null
      direction: lower
      minimum_effect: Exactly 0 on E0.
    - metric: span_rank_object
      direction: different
      minimum_effect: Exactly 5 on E.

  test_boundary:
    instances:
      - >-
        E, the first nonsingular ordinary short-Weierstrass curve over
        F_11 in lex order of (A, B)
      - >-
        E0, the first nonsingular short-Weierstrass curve over F_{11^5}
        whose j-invariant is not in F_11
      - Q_E(T) = S_3(alpha, beta, T) and Q_0 at the same pair
    parameters:
      field_prime: 11
      extension_degree: 5
      predicted_pair: [1, 0]
      predicted_span_rank_object: 5
      search_slots: 64
    implementation: >-
      A later executor expands one quadratic in a frozen normal basis.
      This design does not expand it.
    budget:
      enforcement: advisory
      maximum_runs: 2
      note: >-
        One quadratic on two curves, inside one run. The second run id
        is an infrastructure retry, not a second scientific sample.

  falsification_conditions:
    - >-
      The pair (dim(V_E^{C_5}), dim(V_{E0}^{C_5})) is not (1, 0). H1
      is then false for this quadratic.
    - dim V_E is not 5.
    - >-
      The transposition control on V_E also has invariant dimension 1,
      so the cycle is not distinguished from that permutation.
    - >-
      No pair in the first 64 enumeration slots makes Q_E quadratic
      with neither root in F_11.

  interpretation_limits:
    - >-
      Toy scope: one quadratic, q = 11, n = 5. No statement about a
      factor base, a decomposition degree, or a larger extension.
    - >-
      Dimension 1 does not bound the solving degree of an m = 3 system
      and does not move an exponent. The rho exponent stays 1/2.
    - >-
      A pair other than (1, 0) falsifies the trivial-symmetry reading
      for this quadratic only.
    - >-
      Nothing here is evidence about prime-field curves or about a GHS
      cover genus. The curve y^2 = x^3 + x + 1 is not used.

  citations:
    - ref: IDEA-20261005-bda728
      provenance: internal
      claim: >-
        Source proposal. The dimension pair (1, 0), the span rank 5,
        the subfield curve, the null curve, and the quadratic
        S_3(a, b, T) are copied from it. Read via git show of
        origin/design/qlwe-9f4777-logunit. The file is not on this
        branch and is not recreated.
      verified_by: origin/design/qlwe-9f4777-logunit:ledger/proposals/IDEA-20261005-bda728.yaml
    - ref: RQ-FROB-7d8dd4
      provenance: internal
      claim: >-
        Binding question, read from ledger/questions/RQ-FROB-7d8dd4.yaml.
        This hypothesis does not claim a Frobenius gain past the factor n.
      verified_by: ledger/questions/RQ-FROB-7d8dd4.yaml
    - ref: KN-TECH-002
      provenance: internal
      claim: >-
        The classical S_3 formula for y^2 = x^3 + a x + b, read from
