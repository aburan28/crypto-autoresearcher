        quadratic this protocol expands.
      verified_by: knowledge/techniques/KN-TECH-002.md
    - ref: KR-IC-5a43e5
      provenance: internal
      claim: >-
        S_3 is quadratic in each variable and vanishes on x-coordinates
        of points summing to the identity up to signs. No factor base
