hypothesis:
  id: H-RELN-f697be
  question_id: RQ-RELN-001
  goal_id: GOAL-RELN-001
  idea_id: IDEA-20260805-96cb3d

  statement: >-
    SCOPE: the p_exist / p_solve separation and the B-ladder of the frozen
    GOAL-RELN-001 protocol, at field_bits in {8, 10, 12, 16}, m in {2, 3}, under a
    complete fix-(m-1)-and-root-find decider implemented in the standard library.
    CLAIM TIER toy. NO ATTACK, NO EXPONENT MOVED, NO CLAIM THAT ANY GROEBNER
    SOLVER IS WORTHLESS.
    Claim, in three parts. (1) VACUITY: fixing any m-1 of the m factor-base
    unknowns leaves a univariate of degree at most 2^{m-1} in the last
    (KN-TECH-002), so root-finding plus membership testing is a COMPLETE decider
    for the decomposition system; therefore its success set equals the enumeration
    oracle's, and the protocol's solve_gap = hat_p_exist - hat_p_solve is
    identically 0 for any complete solver that finishes. Every nonzero value the
    campaign could report is censoring, and AGENTS.md rule 3 forbids treating
    censoring as negative mathematical evidence -- yet the protocol's
    censored_trials rule assigns Y_solve = 0, keeps the trial in the denominator,
    and declared_p_lower_solve computed from that denominator is what is fed to
    GOAL-ICEX-001. (2) BUDGET: at m = 2 the complete decider costs exactly B
    modular square roots per target, against a declared per-attempt budget of 120
    seconds -- headroom of at least 10^6 -- so any censoring at these cells is
    attributable to the chosen solver by an overwhelming margin. (3) INERTNESS:
    under that decider, cost per attempt ~ C(B+m-2, m-1) and success ~
    C(2B+m-1,m)/N, so end-to-end relation collection costs ~ m*N/2^m root-findings,
    INDEPENDENT OF B. The goal's single independent variable is therefore a control
    variable for the quantity ICEX needs, and the quantity that is not inert is the
    ratio (baseline cost)/(solver cost) at matched success set, which no record in
    this corpus charges. A nonzero solve gap at m = 2 under the complete decider
    with no censoring, or a measured non-flat cost product across the ladder,
    refutes this.

  mechanism: >-
    DERIVED IN-REPO. The completeness argument is a specialisation argument; the
    cost bookkeeping is one line of algebra; the protocol quotations are read from
    the frozen artifact.

    THE SYSTEM. Decomposing R at arity m over V means solving
    S_{m+1}(x_1,...,x_m, x(R)) = 0 with every x_i in V: ONE equation, m unknowns,
    each confined to a set of size B. The protocol's declared arm adds the vanishing
    polynomials f_V(x_i) = prod_{v in V}(x_i - v), degree B each, and runs a frozen
    grevlex Groebner basis.

    THE COMPLETE BASELINE. Enumerate the C(B+m-2, m-1) multisets of m-1 elements of
    V. For each, specialise those slots; KN-TECH-002 gives deg S_n in each variable
    = 2^{n-2}, so what remains is univariate of degree at most 2^{m-1}. Find its
    roots in F_p and test membership in V. COMPLETENESS: any solution
    (x_1,...,x_m) specialises m-1 of its coordinates to elements of V, so it appears
    among the roots of the corresponding univariate. Nothing is missed.
      At m = 2 the univariate is a quadratic -- the explicit S_3 in KN-TECH-002 is
      visibly degree 2 in each variable -- so the decider is exactly B discriminant
      evaluations and B modular square roots. For the protocol's largest m = 2 cell
      (bits = 16, B = 48) that is 48 square roots modulo a 16-bit prime.
      At m = 3 it is C(B,2)+B specialisations, each a degree-4 root-finding, which
      pure-Python Cantor-Zassenhaus handles at toy p with no library.

    PART 1 -- WHY THE GAP IS VACUOUS. Two complete deciders decide the same
    predicate. So for every trial in which both finish, Y_solve = Y_exist. The
    difference decomposes into exactly two causes: the declared solver being
    incomplete (a property of that solver, reportable as such and NOT as a
    decomposition probability), or censoring. The protocol's own text supplies the
    rest of the chain, quoted: censored_trials -- "TIMEOUT / RESOURCE_EXHAUSTION
    trials contribute Y_solve=0 if no verified certificate was produced, and remain
    in the denominator N of the sealed cohort"; metrics.primary --
    declared_p_lower_solve is the "one-sided Clopper-Pearson lower endpoint on
    p_solve"; icex_feed -- p_L_source_for_ICEX is declared_p_lower_solve. Three
    steps from a timeout to a relation-supply pin, each written down. The protocol
    is internally consistent and still routes infrastructure into mathematics; the
    remedy is a denominator and labelling rule, not a new campaign.

    PART 2 -- BUDGET HEADROOM. B square roots is microseconds at these sizes; the
    declared per-attempt budget is 120 s with maximum_groebner_degree_cap 32. The
    ratio is at least 10^6, and it means no censoring observed at an m = 2 cell can
    be a property of the problem. Note also that the declared arm cannot currently
    be instantiated in this container at all: sympy is absent, Sage is absent, and
    src/ic_first_fall_fast.py fails to import with ModuleNotFoundError on sage.all
    (verified this session). That is INFRASTRUCTURE SIGNAL and an infrastructure
    request; it is never evidence about a mathematical question, and the baseline
    arm is unaffected because it needs nothing beyond the standard library.

    PART 3 -- B-INERTNESS.
        cost per attempt      ~ C(B+m-2, m-1) ~ B^{m-1}/(m-1)!   root-findings
        success per attempt   ~ C(2B+m-1, m)/N ~ (2B)^m/(m! N)   (small-mu regime)
        attempts per relation ~ m! N / (2^m B^m)
        cost per relation     ~ m N / (2^m B)
        relations needed      ~ B
        TOTAL                 ~ m N / 2^m,  with no B in it.
    The ladder redistributes a fixed total between many-cheap and few-expensive
    attempts. Two corollaries, both useful and neither new as a conclusion:
    (i) the total is Theta(N), worse than rho's Theta(sqrt(N)), which reproduces
    KN-TECH-003's standing position -- a baseline-reproduction check the derivation
    must pass and does; the constant m/2^m is the only thing arity buys, and it is
    maximised at m = 1 and 2. (ii) The quantity ICEX actually needs is the speedup
    ratio of the declared solver against this baseline at matched success set, and
    NO VALUE FOR IT IS PREDICTED HERE -- pre-registering one would be exactly the
    error being audited.

    HONEST NOVELTY. The fix-(m-1)-and-root-find decider is a KNOWN BASELINE and
    this record claims no novelty for it. What is claimed is that the protocol's
    H-SOLVE-GAP discriminator is vacuous at its own primary cells, that the
    censoring path exists, and that the B-ladder is inert -- three statements about
    this program's frozen design, not about the literature.

  assumptions:
    - >-
      That the declared grevlex Groebner arm is complete on the ideals it is given.
      It should be (the ideal is zero-dimensional once the f_V are included). If a
      symmetry reduction makes it incomplete, the gap is real but is a property of
      that reduction and must be labelled one, not reported as a decomposition
      probability.
    - >-
      That root-finding of a degree-2^{m-1} univariate over F_p is available. At
      m = 2 this is one modular square root; at m = 3 a degree-4 factorisation. No
      external dependency is introduced.
    - >-
      That the ICEX consumer wants probability per unit of charged work. If it
      genuinely wants probability per attempt with a pinned solver, the finding
      reduces to a labelling requirement, which is still a defect but a smaller one.
    - >-
      Small-mu for the flat-line derivation. Cells with mu > 0.3 are outside the
      flat-line test by pre-registration and are reported separately, because
      coverage saturation bends the line for an honest reason.

  proof_search_map:
    bottleneck: >-
      The cost of deciding one decomposition attempt. Relation collection is
      (attempts) x (cost per attempt) and both factors are functions of B that
      cancel; the only place an exponent can move is the per-attempt decider. Every
      claim about prime-field point decomposition that does not name its decider is
      therefore under-specified, and the protocol's C_rel_trial is an instance.
    baseline_embedding:
      parameter_slice: >-
        B = N (the factor base is the whole curve) and m = 1. Then every target
        decomposes, the decider is a table lookup, and total cost is one lookup per
        target -- the degenerate boundary. The informative slice is m = 2 with the
        declared solver replaced by exhaustive enumeration over V^2: the classical
        naive decider, cost C(B+1,2) group operations per attempt, against which the
        root-finding baseline is a factor ~B/2 cheaper. Both endpoints are computed,
        so the baseline is embedded between two known procedures rather than
        asserted.
      reproduction_check: >-
        The end-to-end total m*N/2^m must reproduce KN-TECH-003's recorded standing
        position that prime-field point decomposition is uncompetitive with rho.
        Theta(N) against Theta(sqrt(N)) does. If the derivation had produced
        anything sub-sqrt(N), it would be wrong and the line stops there. Frozen
        regression fixture: exhaustive ground truth on a toy curve at bits = 8 for
        every target, against which both deciders' success sets are compared as
        SETS.
    observation_collision:
      observable: The pair (success bit, charged cost) per attempt.
      distinct_preimage_search: >-
        Decisive, and it is the whole of part 1: exhibit two deciders -- exhaustive
        enumeration and the root-finding baseline -- whose success bits are
        IDENTICAL on every trial by a completeness argument, while their charged
        costs differ by a factor ~B/2. The success coordinate has a fibre containing
        every complete decider; the cost coordinate does not. So p_solve cannot
        separate deciders and C_rel_trial can, which is the opposite of how the
        protocol uses them.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the ICEX pin declared_p_lower_solve with the pair (p_exist
          measured under a complete decider; solver speedup ratio against the
          baseline at matched success set).
        predicted_gain: >-
          The reported probability stops depending on the solver and on
          infrastructure; the solver dependence moves into a ratio with a defined
          denominator, where it belongs.
      - transform: telescoping_potential
        proposed_object: >-
          The invariant (attempts per relation) x (cost per attempt), tracked across
          the B-ladder as a single quantity rather than as two.
        predicted_gain: >-
          A pre-derived flat line that can fail, replacing two separately reported
          curves neither of which is interpretable alone.
    quantifier_order: >-
      The protocol's implicit claim: THERE EXISTS a solver such that FOR ALL
      strata, hat_p_solve estimates the probability that a target admits a
      findable decomposition, and that estimate is a property of the stratum. The
      counter-statement: FOR ALL complete solvers the success set is the SAME set,
      so hat_p_solve does not depend on the solver at all when the budget suffices,
      and depends ONLY on the solver when it does not. The quantity therefore
      measures the stratum in one regime and the infrastructure in the other, with
      no field in the record distinguishing which regime a stratum was in. That
      missing field is the concrete deliverable of the audit.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that at the tested cells, under a complete decider, the solve gap
        is zero and the end-to-end cost is flat in B; and that a specific chain of
        three rules in the frozen protocol carries censoring into an ICEX pin. It
        CANNOT certify that the Groebner arm is useless (its speedup ratio is
        explicitly unmeasured and unpredicted), that prime-field index calculus is
        hopeless (that is KN-TECH-003's position, restated not established), or
        anything at crypto scale.
      nearby_object_control: >-
        The nearby object where the hoped-for conclusion FAILS: extension fields
        F_{q^n} with a subfield factor base, where the decomposition test is exactly
        what Weil descent makes cheap and where index calculus IS subexponential
        (KN-TECH-003). The B-inertness derivation must not also apply there, and the
        reason it does not is that the success probability is 1/n! rather than
        (2B)^m/(m! N) -- a constant in N rather than a B-power -- so the two factors
        no longer cancel. A derivation that cannot produce that distinction has not
        located the load-bearing structure and must not be reported.
    proof_obligations:
      - claim: "Fix-(m-1)-and-root-find is a complete decider for the decomposition system."
        responsibility: correctness
      - claim: "At m = 2 the decider costs exactly B modular square roots per target."
        responsibility: runtime
      - claim: "solve_gap = 0 for any complete decider that finishes; nonzero values are censoring."
        responsibility: correctness
      - claim: "End-to-end total ~ m N / 2^m root-findings, independent of B, in the small-mu regime."
        responsibility: runtime
      - claim: "Theta(N) reproduces KN-TECH-003's standing position rather than contradicting it."
        responsibility: baseline
      - claim: "The three-step path from TIMEOUT to declared_p_lower_solve exists in the frozen text."
        responsibility: interface
      - claim: "The derivation does not apply to extension fields, and the reason is stated."
        responsibility: scope

  rerandomization: null

  asymptotic_claim:
    problem: >-
      Relation collection for prime-field point-decomposition index calculus over
      E(F_p), N = #E(F_p), at fixed arity m under a complete decider.
    prior_best: >-
      Pollard rho at O(sqrt(N)) group operations with negligible memory for the
      ECDLP itself (KN-TECH-003). For the decomposition route the corpus records no
      charged baseline at all, which is the gap this fills.
    time_exponent: >-
      1 in N (total ~ m*N/2^m root-findings). This is NOT an improvement and is not
      offered as one; it is a charged baseline, and it is WORSE than rho by a
      square root. Stating it is the honest half of the goal's own completion
      criterion.
    memory_exponent: >-
      0 in N: O(B) for the factor base plus O(1) working space per attempt. The
      linear-algebra stage, which a pure calibration campaign sets to zero, is the
      one stage that grows with B and is charged separately.
    hidden_cofactor: >-
      A factor Otilde(2^{m-1} log p) inside the "root-finding" unit, plus the
      relation-independence constant of HEUR-RELN-C3, which is unmeasured in this
      corpus by that corpus's own account and multiplies a B-independent quantity.
    claim_kind: constant_factor

  heuristic_assumptions:
    - id: HEUR-RELN-C1
      formal_statement: >-
        Completeness of the fix-(m-1)-and-root-find decider is unconditional: every
        solution specialises m-1 coordinates to elements of V and hence appears as
        a root of the corresponding univariate.
      random_model_justification: not applicable
      supporting_results:
        - "KN-TECH-002 (internal, established): deg S_n in each variable = 2^{n-2}."
      validation_experiment_ids: [EXP-RELN-66c1ab]
      falsification_condition: The baseline missing any decomposition found by exhaustive enumeration.
    - id: HEUR-RELN-C2
      formal_statement: >-
        Success probability per attempt ~ mu = C(2B+m-1,m)/N when mu << 1.
      random_model_justification: >-
        The mean is exact (KN-FIND-007); the step from mean to probability is
        small-mu Poissonisation, bounded above without heuristic by
        coverage <= min(1, mu).
      supporting_results:
        - "KN-FIND-007 (internal, established, derivation)."
      validation_experiment_ids: [EXP-RELN-66c1ab]
      falsification_condition: >-
        Measured success rate outside the Clopper-Pearson interval of mu at cells
        with mu < 0.1.
    - id: HEUR-RELN-C3
      formal_statement: >-
        Relations from distinct successful targets are independent often enough that
        Theta(B) relations fill the matrix.
      random_model_justification: >-
        Standard index-calculus practice, FLAGGED BECAUSE IT IS UNMEASURED IN THIS
        CORPUS: relation rank and independence are excluded from DEC-20260724-020's
        scope by that decision's own account (RELAYED via the 2026-08-05 scouting
        brief, decision not read in full). If the constant is not O(1) the total
        changes by that factor; the B-invariance itself does not, because the factor
        multiplies a B-independent quantity.
      supporting_results:
        - "RELAYED, unverified: relation rank and independence named as unmeasured."
      validation_experiment_ids: [EXP-RELN-66c1ab]
      falsification_condition: >-
        Rank deficiency growing with B at toy scale, which would make the relation
        count B-dependent and break the invariance.

  structural_ingredients:
    - description: Summation-polynomial degree 2^{n-2} in each variable, and explicit S_3.
      citation: "KN-TECH-002 (internal technique, read in this repository)"
      role: makes the specialised system univariate of bounded degree
    - description: Exact decomposition-yield conservation.
      citation: "KN-FIND-007 (internal finding, read in this repository)"
      role: supplies the success-probability factor in the cost product
    - description: Standing position on prime-field point decomposition versus rho.
      citation: "KN-TECH-003 (internal technique, read in this repository)"
      role: baseline-reproduction target for the Theta(N) total
    - description: Root-finding over F_p by gcd with X^p - X plus equal-degree splitting.
      citation: "Standard (Cantor-Zassenhaus). RECALLED, UNVERIFIED as to any specific source; implemented and tested against brute force at toy p rather than cited."
      role: the decider's inner primitive
    - description: The frozen protocol's censored_trials, metrics.primary and icex_feed rules.
      citation: "coordination/goals/GOAL-RELN-001/batches/BATCH-001/tasks/TASK-20260725-661/decomp_probability_protocol.yaml (READ in full)"
      role: the three-step path from censoring to the ICEX pin

  reduction_chain:
    core_problem: >-
      What p_solve measures, and whether the B-ladder can move the relation-supply
      cost this goal owes GOAL-ICEX-001.
    corollaries:
      - problem: GOAL-ICEX-001's relation-supply pin.
        reduction_ref: >-
          Direct: the protocol names declared_p_lower_solve as p_L_source_for_ICEX.
          No published reduction cited or needed.
        asymptotics_preserved: "n/a."

  predictions:
    - metric: "solve_gap at m = 2 under the complete baseline"
      direction: different
      minimum_effect: EXACTLY 0 with zero censored trials, at every cell.
    - metric: "baseline attempt cost at m = 2, in modular square roots"
      direction: different
      minimum_effect: EXACTLY B per target, independent of p and of the target.
    - metric: "success sets of enumeration and of the baseline, compared as sets"
      direction: different
      minimum_effect: IDENTICAL on every trial. Set equality, not rate equality.
    - metric: "budget headroom: 120 s divided by baseline wall clock at bits = 16, B = 48"
      direction: higher
      minimum_effect: ">= 10^6."
    - metric: "log-log slope of (attempts per relation) against B at fixed (p, m)"
      direction: lower
      minimum_effect: "-m, i.e. -2 at m = 2 and -3 at m = 3, within fit error."
    - metric: "log-log slope of (cost per attempt) against B"
      direction: higher
      minimum_effect: "+ (m-1), i.e. +1 at m = 2 and +2 at m = 3."
    - metric: "log-log slope of the PRODUCT against B"
      direction: different
      minimum_effect: >-
        ZERO within fit error, at the derived level m*N/2^m. A flat product obtained
        from two flat components does not count and is checked for separately.
    - metric: "solver speedup ratio against the baseline at matched success set"
      direction: different
      minimum_effect: >-
        NO PREDICTION AND NONE MAY BE INFERRED. Recorded as UNKNOWN with its
        measurement procedure fixed in advance; this is the quantity the audit
        argues should replace p_solve in the ICEX package.
    - metric: "instantiability of the declared Groebner arm in this container"
      direction: different
      minimum_effect: >-
        Pre-registered as EXPECTED-BLOCKED (sympy absent, Sage absent). If blocked
        it is infrastructure signal and an infrastructure request, never negative
        mathematical evidence.

  test_boundary:
    instances: >-
      Deterministically generated ordinary short-Weierstrass curves at field_bits
      in {8, 10, 12, 16}, uniformly drawn factor bases, planted and
      provably-undecomposable targets.
    parameters:
      field_bits: [8, 10, 12, 16]
      arity_m: [2, 3]
      factor_base_sizes: "the protocol's own default ladder, unmodified"
      deciders: [exhaustive_enumeration, fix_m_minus_1_root_find, declared_groebner_if_instantiable]
    implementation: >-
      Pure Python standard library for the baseline and the oracle. The declared
      Groebner arm is attempted and its outcome recorded either way.
    budget:
      wall_clock_seconds_total: 7200
      maximum_memory_gb: 2
      note: >-
        Cost is dominated by exhaustive ground truth at the largest cells; the
        baseline itself is microseconds per attempt.

  falsification_conditions:
    - A nonzero solve gap at m = 2 under the complete baseline with no censoring.
    - The baseline missing a planted decomposition; no negative may then be reported.
    - A measured product slope significantly different from zero across the ladder in the small-mu cells.
    - >-
      The protocol, on re-reading, excluding censored trials from the ICEX
      denominator after all. The rule-3 half is then withdrawn in those words.
    - >-
      The declared solver proving incomplete. The finding is then relabelled from
      "the gap is vacuous" to "the gap measures solver incompleteness", not
      suppressed.
    - A derived end-to-end total below Theta(N), which would contradict KN-TECH-003 and indicate an error.

  interpretation_limits:
    - >-
      Closes the H-SOLVE-GAP discriminator AS FROZEN at m = 2 and bounds what the
      B-ladder can show under one complete decider. Does not close the goal, does
      not evaluate the Groebner arm, does not touch PKM, and says nothing about
      extension fields, where the derivation explicitly does not apply.
    - >-
      Toy tier; the protocol's prohibited_claims list is inherited verbatim. The
      Theta(N) total restates KN-TECH-003's existing position with a constant and
      must not be presented as a new negative result about the ECDLP.
    - >-
      Infrastructure outcomes (sympy/Sage absent, solver not instantiable) are
      reported as infrastructure and are never mathematical evidence, in either
      direction.
    - >-
      No status change to any existing record is proposed or implied.

