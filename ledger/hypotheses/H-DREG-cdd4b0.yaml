    "title": "Complete consequence-wise persistence and minimum-derivation certificates",
    "statement": "For the fixed finite panel, complete iterated-closure and lower-rung certificates distinguish consequence availability from output/Hilbert summaries and one-shot representation degree, while exposing the full cost of a complete finite persistence description. The source Semaev compactness and uniformdegree conjecture is not assumed and remains unresolved beyond the tested scope.",
    "mechanism": {
      "ordinary": "V_F,E is the least k-linear subspace of O_<=E that contains every original generator f_i with degree at most E and is closed under g -> mu*g whenever mu is a monomial and deg(g)+deg(mu)<=E. Every integer E from 0 through Emax is retained. This is iterated closure. U_F,E denotes the separate one-shot span of original-generator multiples. A consequence never becomes an original generator and its derivation history is never reset.",
      "quotient": "W_F,E is the least F2-linear subspace of B_<=E containing the eligible normalized core generators and closed under g -> NF_B(mu*g) for every squarefree monomial mu satisfying deg(g)+deg(mu)<=E. The degree budget is tested before normalization. Testing only deg(NF_B(mu*g))<=E defines an incompatible instrument and is a known-false semantic control.",
      "raw_one_shot": "U_F,E is the span of the products of each original generator by every permitted monomialmu with deg(mu)+deg(f_i)<=E, without closure feedback. For Q mode products are normalized after this degree-sum test. Report its basis and target intersections separately; U is not renamedV orW.",
      "finite_object": "Let A_d be the complete ordinary or squarefree monomial space of degree<=d. Freeze target ceilingK for each family. For every0<=d<=K and0<=E<=Emax record P_d,E=V_F,E intersect A_d (O) or W_F,E intersect A_d (Q), including full bases, ranks and inclusion matrices in both indices. This finite bifiltration is the complete reported object. It is not a classification of an infinite ideal or a two-parameter barcode.",
      "minimal_degree": "For any nonzero reported consequencef, delta_F(f)=min{E:f belongs to the declared iterated space}. Store its actual polynomial degree d_f, all candidate-specific membership decisions and the interval[d_f,delta_F(f)) as a degree-gap descriptor. A raw representation minimum E_raw=min{E:f inU_F,E} is a different coordinate. E_exp is the maximum original-generator product degree after expanding the actual retained derivation; it can exceed delta_F.",
      "canonical_targets": "Construct a deterministic basis adapted to the nested P_K,E spaces. At eachE take the uniqueRREF basis ofP_K,E, reduce its rows against the retained adapted basis in fixed prior pivot order, then process nonzero residuals in column/pivot order; normalize and retain a new representative with birthE when independent. Preserve exact change-of-basis matrices and quotient-independent cosets. Include the source-named target consequences as additional labelled queries, deduplicated by polynomial bytes while retaining all queryroles.",
      "completeness": "The adapted vectors span P_K,E at everyE, their birthE cosets are independent moduloP_K,E-1, and their full coordinates are retained. This certifies delta(f)=max birth among its nonzero adapted coordinates for everyf inP_K,Emax. Verify this statement by complete inclusion/coordinate certificates; output degree of a combination is computed from actual coefficients. Consequences of the ideal outsideP_K,Emax are explicitly outside the resolved object unless endpoint completeness is certified.",
      "nonmembership": "Every claimed minimum carries a certificate at every smaller integer E, including degrees below deg(f). Embed the full iterated space and the same exact target f in the complete monomial ambient of degree at most max(E,deg(f)). Supply a linear functional lambda_E annihilating every vector of a certified complete basis of the iterated space, with lambda_E(f)=1. For E<deg(f), also exhibit a nonzero coefficient outside the allowed degree and the explicit zero-column embedding. A nonzero residual against an uncertified or incomplete span does not prove nonmembership.",
      "global_vs_bounded": "Report last_observed_fall_E separately from true last_fall_degree. A quiet interval, low output degree orEmax alone never proves stabilization. O mode may report true last fall/solving degree only after a complete Groebner basis of the original ideal, all its relevant delta minima, and the exact primary theorem interface are independently certified. Q mode reports its own finite closure metrics; the ordinary theorem is not imported without a separately proved interface.",
      "query_states": {
        "resolved": "Positive bounded derivation and all lower-rung exclusions.",
        "right_censored": "Target membership in the ideal may be separately known, but no admissible positive derivation through Emax; report delta_lower_bound and no numericminimum.",
        "not_in_ideal": "Independent complete GB/ideal certificate and nonzero normal form (or certified point-functional in applicable grid cases) establish nonmembership; delta is not a finite number.",
        "zero": "Zero polynomial flagged and excluded from birth/degree-gap lists."
      },
      "closure_fall_event": "For everyE>=1 additionally retain the full fall slice F_E=V_E intersect A_(E-1), orW_E intersect B_<=E-1, and its inclusion from the previous closed space. A closurefall is strict inclusion. These fall slices are required even whenE-1>K; do not infer them from the smaller targetrectangle. E0 has no fall event. first/last_observed_closure_fall are the min/max eventE in the searchedwindow, with no event recorded as none, not automatically true lastfall0.",
      "complete_object_boundary": "The fullreported object is everyP_d,E for0<=d<=K,0<=E<=Emax, plus all full closedspaces and fall slicesF_E. K bounds consequence queries, not the ambientcolumns or closure computation."
