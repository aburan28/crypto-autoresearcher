  proposed_by: idea-generator
  approved_by_decision: DEC-20261002-df3abe
  title: >-
    Uniform labels in Z/4 sum to 0 in exactly 4 of 16 pairs,
    and the level-2 increment is 4.
  statement: >-
    On the uniform alphabet {0, 1, 2, 3}, exactly 4 of the 16
    ordered pairs sum to 0 modulo 4, so 12 are unsatisfiable.
    Exactly 8 of the 16 sum to 0 modulo 2. The 4 pairs that pass
    the modulo-2 test and fail the modulo-4 test are the level-2
    increment. Each of the 4 prefixes has exactly one completing
    last label. At three labels, 16 of 64 tuples survive modulo 4
    and the increment is 16. Reduction modulo 2 sends Z/4 onto a
    group of order 2 with kernel {0, 2}. The written product
    4 times 32603 is 130412, and 32603 is prime. The floor gap
    777 hundredths minus 200 hundredths is 577, strictly above
    570 and strictly below 580.
  mechanism: >-
    The proposal says a Z/4 leg label removes a near-3/4 share
    and that the level-2 bit may add nothing. This contract
    counts the uniform label patterns. It does not build a curve.
  assumptions: []
  proof_search_map:
    bottleneck: The uniform pair count and the level-2 increment.
    baseline_embedding:
      parameter_slice: >-
        The Z/4 sum constraint written in IDEA-20260926-ae8f0a,
        read 2026-10-02. The pattern counts were enumerated in
        this design session. That enumeration is not a run.
      reproduction_check: >-
        One route enumerates the tuples. The other counts
        completions per prefix in a separate module. They must
        agree.
    observation_collision:
      observable: The m = 2 unsatisfiable count and the increment.
      distinct_preimage_search: >-
        An unsatisfiable count of 8 at modulo 4 is the modulo-2
        count. Reporting it as the modulo-4 count invalidates
        the run. An increment of 0 is the reading that the
        second bit adds nothing. That reading is false on this
        alphabet.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: Two arities on a four-element alphabet.
        predicted_gain: Integer comparisons. No attack cost.
    quantifier_order: >-
      The pairs are counted first, then the three-label tuples,
      then the kernel, then the written order, then the gap.
    method_ceiling:
      strongest_certifiable_claim: >-
        The uniform pattern counts, the kernel, the written
        product, and the reduced gap. Not a curve share and not
        a statement that a filter helps.
      nearby_object_control: >-
        The modulo-2 unsatisfiable count 8 used as the modulo-4
        count, and an increment of 0.
    proof_obligations:
      - claim: At m = 2 the modulo-4 survivors are 4 and the unsatisfiable count is 12.
        responsibility: correctness
      - claim: The level-2 increment is 4 at m = 2 and 16 at m = 3.
        responsibility: correctness
      - claim: The kernel of reduction modulo 2 is {0, 2}.
        responsibility: correctness
    not_applicable_reason: null
