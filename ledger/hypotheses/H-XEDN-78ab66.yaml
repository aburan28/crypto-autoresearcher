hypothesis:
  id: H-XEDN-78ab66
  question_id: RQ-XEDN-003
  derived_from_idea: IDEA-20260805-4ddf4e
  added: '2026-08-25'

  statement: >-
    SCOPE: the committed census data of EXP-XEDN-005 (and, for the chi = 2 null
    arm, EXP-XEDN-006 and EXP-XEDN-007), on the surface family
    y^2 = x^3 + a(t)x + b(t) over F_p(t) with deg a <= 4 and deg b = 6, at
    p in {7, 13, 19, 31}, plus synthetic root configurations constructed from
    E8. CLAIM TIER toy. NO ATTACK, NO EXPONENT, NO PRIME-FIELD TRANSFER, NO
    STATUS CHANGE REQUESTED, and DEC-20260724-021's forbidden-sentence list
    remains binding word for word.

    TWO INDEPENDENT CLAIMS. Either can be true with the other false, and they
    are measured separately.

    CLAIM D (THE DICHOTOMY). On the pure-root stratum -- squarefree
    discriminant, all fibres irreducible, every enumerated free-x section of
    Shioda height exactly 2 -- the enumerated section set is a SATURATED root
    subsystem of E8, and elementary simply-laced root-system algebra forces the
    lane's primary metric min-over-relations of the infinity norm to take only
    the value 1 (when some component is not A1) or to be UNDEFINED (when the
    system is A1^r, pairwise orthogonal, relation lattice zero). No third value
    is possible. Consequently the reported constancy across p, deg a and
    surface is a structural fact about the observable and not a measurement of
    p, and the reported slope-vs-log-p of 0.0 with CI [0,0] is arithmetic
    rather than data.

    CLAIM I (THE INSTRUMENT REACH). Independently of Claim D, the primary
    search shortest_relation_group_law as committed in EXP-XEDN-005 CANNOT
    return a value of 4 or more, because it enumerates supports of size 2 and 3
    with coefficients in [-3, 3] and a support-4 arm restricted to
    coefficients in {-1, +1}. H-XEDN-004's declared falsifier -- a verified
    shortest relation of infinity norm >= 4 -- is therefore outside the
    implemented search space. This is a property of committed code, decidable
    by reading it and by driving it with a synthetic configuration whose only
    relation has infinity norm 4.

    WHAT WOULD MAKE CLAIM D FALSE, AND IT IS ALREADY ON THE RECORD AS A RISK.
    The archived EXP-XEDN-005 planted control reports max_abs_coeff = 2 with 3
    slots and a passing specialisation check -- a value the dichotomy forbids
    among saturated height-2 roots at support 3. EITHER that surface violates a
    premise (non-squarefree discriminant, a reducible fibre, or a section of
    height not 2) OR Claim D is wrong. Resolving that single archived number is
    the sharpest and cheapest stage of the design.

  mechanism: >-
    DERIVED HERE FROM THE PARENT PROPOSAL. Every step is labelled DERIVED or
    RECALLED-UNVERIFIED, and every RECALLED step is itself a stage of the
    experiment rather than an authority.

    (1) chi = 1. [DERIVED modulo a RECALLED classification] For
    y^2 = x^3 + a(t)x + b(t) the minimal Weierstrass model over P^1 has
    arithmetic genus chi = ceil(max(3 deg a, 2 deg b) / 12); with deg b = 6 and
    deg a <= 4 this is ceil(12/12) = 1, a rational elliptic surface. The whole
    XEDN window sits at chi = 1 and only there.

    (2) HEIGHT 2. [DERIVED from the Shioda formula, itself RECALLED but ALSO
    stated in this corpus by DEC-20260724-021's own next_actions] For an
    integral section (x, y polynomial) the section meets the zero section
    nowhere in the affine chart so (P.O) = 0; with squarefree discriminant
    every fibre is I1, every local contribution vanishes, and
    hhat(P) = 2 chi = 2. Every free-x slot is then a norm-2 vector -- a ROOT --
    of a Mordell-Weil lattice that for chi = 1 with irreducible fibres is E8.

    (3) SATURATION. [DERIVED from the committed code] enumerate_slots_frozen_mod
    loops over ALL of F_p^3 for the x-coefficients and keeps every (x, y)
    passing the frozen square predicate, so the observed set is exhaustive for
    that shape. If r and s are observed roots with inner product -1 then r + s
    is again a root of the same lattice and again an integral section of the
    same shape, hence also observed. Saturation is a property of the
    enumeration, not an assumption about the surface.

    (4) THE DICHOTOMY. [DERIVED, elementary] Let Phi be a finite saturated root
    set in a positive-definite lattice, closed under negation, of rank r with N
    positive roots. Inside E8 it is simply laced, so its components are A, D or
    E. Every irreducible type other than A1 has strictly more positive roots
    than its rank, so N = r if and only if Phi = A1^r. CASE O (N = r) -- the
    positive roots are pairwise orthogonal, hence independent, the relation
    lattice is zero, and the metric is UNDEFINED. CASE R (N > r) -- some
    component is connected and non-A1, so two adjacent simple roots alpha, beta
    have inner product -1 and gamma = alpha + beta is a root of norm 2, hence
    observed by (3); then alpha + beta - gamma = 0 is a support-3 relation with
    coefficient vector (1, 1, -1) and infinity norm 1, which is the minimum
    possible for a nonzero integer vector. Hence the metric is 1 or undefined,
    and it sits at the FLOOR of its range wherever defined.

    (5) THE SELECTION THAT MATCHES THE METRIC. [DERIVED from the code] The
    sampler fiber_find_rich_surfaces does not draw surfaces from the family; it
    draws two candidate sections and SOLVES for (a, b), so every censused
    surface is conditioned on containing at least two roots, and eligibility
    then requires at least 2 slots. Conditioning on a large Frobenius-fixed
    root subsystem is conditioning on CASE R, where the metric is forced to 1.
    This is disclosed in the raw results as source fiber_over_sections; the
    observation is that the design and the metric select the same stratum, so
    the measurement cannot separate them.

    (6) THE PAIRING BUILT IS NOT THE PAIRING ORDERED. [DERIVED from the code]
    DEC-20260724-021 prescribes the SHIODA Gram. The implemented height_gram
    uses h_naive = max(deg num x, deg den x) with a polarisation that is not
    bilinear, so its rank and kernel are not the rank and relation lattice of
    the Mordell-Weil span. The committed data shows the two disagreeing --
    corank 0 with a group-law-verified relation present, and gram
    max_abs_coeff of 2 or 4 where the group-law value is 1. The audit replaces
    the naive Gram with the pairing the decision actually prescribed, and
    reports BOTH rather than reconciling them.

  assumptions:
    - >-
      Reading committed artifacts is not running an experiment. Every number in
      this record that came from an archived raw-result.json is labelled as
      read during design and MUST be re-extracted in-harness at stage 0 before
      it may be cited anywhere.
    - >-
      "Verified relation" means verified in the group law over F_p(t), not
      merely by specialisation at finitely many fibres. Specialisation is
      necessary and not sufficient; both are reported and one never substitutes
      for the other.
    - >-
      The committed census records b_squarefree, not discriminant-squarefree.
      The audit RECOMPUTES the discriminant and its squarefree-ness per surface
      rather than inheriting the recorded flag.
    - >-
      Sage and sympy are recorded absent from this container in prior lane
      records; the archived Sage implementation therefore cannot be re-executed
      here and every stage is designed in pure Python. Their absence must be
      re-checked and recorded at run time, and an attempt to install a solver
      is an infrastructure request, never an experiment.
    - >-
      Steps (1) and (2) rest on Shioda theory as RECALLED, not read. A second
      unsourced statement in the corpus (DEC-20260724-021) is not a source.
      Stage 1 must either obtain a primary text or replace the recalled
      statements with an in-repo derivation and must SAY WHICH IT DID.

  proof_search_map:
    bottleneck: >-
      The single inference "max_|coeff| was 1 at every tested prime, therefore
      the coefficient bound reflects geometry rather than the narrow window."
      If the observed value was not free to differ, every downstream statement
      treating it as a trend is measuring the apparatus. Repairing or
      condemning this one step consumes no other goal's budget.
    baseline_embedding:
      parameter_slice: >-
        The relation-bearing surfaces of the committed EXP-XEDN-005 archive,
        where the recomputed prediction must equal the committed integer
        max_abs_coeff exactly rather than resemble it.
      reproduction_check: >-
        SYMBOLIC PLUS FIXTURE. Symbolically, verify the Case-O / Case-R
        dichotomy mechanically on synthetic saturated root subsets constructed
        from an explicitly built 240-root E8. As a fixture, re-extract every
        committed coefficient vector and slot histogram and confirm the support
        profile. A plot resembling the archive is not a reproduction; these are
        exact integer comparisons against committed values.
    observation_collision:
      observable: >-
        The single integer min-over-relations of the infinity norm, reported
        per surface, and its slope against log p.
      distinct_preimage_search: >-
        A COLLISION IS ASSERTED AND IS THE CONTENT OF THE CLAIM. On one side,
        an elliptic surface over F_p whose free-x window carries a support-3
        relation. On the other, a random integral lattice of the same rank with
        no elliptic curve behind it, n vectors from its ball, one per plus/minus
        pair. If both produce the observable 1 at the same rates, the observable
        does not identify the elliptic-surface geometry at all. REFUTING the
        collision -- showing the null distribution differs materially -- would
        RESCUE the original conclusion, and is the outcome this hypothesis most
        wants to be wrong about.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable fixed at 1 and vary the forgotten structure --
          prime, deg a, deg b, isotriviality, and finally the existence of a
          curve at all. The proposed replacement invariant is the Dynkin type
          of the realised root system together with its Frobenius structure,
          not the coefficient.
        predicted_gain: >-
          If the Dynkin type explains every observed value, the coefficient
          carries no independent information and the lane's independent
          variable is wrong. If it does not, the residual is the geometry and
          is the first genuinely new quantity in the lane.
    quantifier_order: >-
      What was established by the census is FOR the surfaces on which a
      relation WAS FOUND, THERE EXISTS a relation -- the one the bounded search
      returned -- with infinity norm 1. "Shortest" is a superlative the
      instrument cannot certify, and "for all eligible surfaces" ranges only
      over those passing the slot-count filter. THE TRAP BEING HUNTED -- the
      witness may depend on the surface, but the claimed uniform conclusion (a
      bound holding across primes and windows) requires the BOUND not to depend
      on the configuration size, and by the root-system argument it does. This
      hypothesis states its own claim in the admissible order -- FOR ALL
      saturated root configurations of rank r with N positive roots, the metric
      is determined by whether N = r, and by nothing else.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most -- on the committed configurations that satisfy all three
        premises, the observed coefficient equals the only value the
        configuration's own root system permits, so the measurement is
        uninformative AT THOSE SIZES; and the committed search cannot return a
        value of 4 or more. It cannot certify that the coefficient bound is
        false, cannot certify anything about surfaces with more sections,
        cannot move any exponent, cannot bound any solver's cost, and cannot
        say anything about xedni calculus as an attack.
      nearby_object_control: >-
        TWO. (i) THE chi = 2 NULL FAMILY -- deg b = 10, deg a <= 2, whose slot
        data is already committed in EXP-XEDN-006 and -007. There the minimal
        integral-section height is 2 chi = 4, deg-x <= 2 sections are not
        minimal, and the E8 root argument DOES NOT APPLY. The recomputed Shioda
        diagonal must be 4 and the (rank, count) pairs must NOT be constrained
        to the ADE table. If the null family behaves identically to chi = 1,
        the audit is detecting a property of the code and NO conclusion may be
        drawn about either family. (ii) A GRADED SWEEP over deg b in
        {6,...,12}, where the dichotomy-holding fraction must be 1.00 at
        deg b = 6 and must FALL AWAY above it; a fraction flat at 1.00 across
        the sweep is the canonical artifact tell.
    proof_obligations:
      - claim: >-
          A finite saturated root set inside E8 with N > r admits a support-3
          relation with coefficient vector (1, 1, -1).
        responsibility: correctness
      - claim: >-
          A finite saturated root set with N = r is A1^r and has zero relation
          lattice.
        responsibility: correctness
      - claim: >-
          The recomputed prediction equals the committed max_abs_coeff exactly
          on the relation-bearing baseline slice.
        responsibility: baseline
      - claim: >-
          shortest_relation_group_law as committed cannot return a value of 4
          or more, established by reading and by a synthetic driver.
        responsibility: interface
      - claim: >-
          The matched synthetic null contains no elliptic-curve structure, so a
          matching distribution is a controlled null and not a corroboration.
        responsibility: interface
      - claim: >-
          Nothing transfers beyond the tested configuration sizes, beyond toy
          primes, or to any ECDLP cost statement.
        responsibility: scope
    not_applicable_reason: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. This is an audit of a measurement. It moves no exponent,
    makes no system easier to solve, adds no attack, and sota_delta is zero on
    every attack axis. Pollard rho remains the ECDLP baseline untouched.

  heuristic_assumptions:
    - id: HEUR-X3-1
      formal_statement: >-
        For simply-laced irreducible root systems the pair (rank, number of
        positive roots) is (k, k(k+1)/2) for A_k, (k, k(k-1)) for D_k with
        k >= 4, and (6,36), (7,63), (8,120) for E6, E7, E8; only A1 has rank
        equal to positive-root count. In any connected simply-laced diagram two
        adjacent simple roots have inner product -1 and their sum is a root.
      random_model_justification: >-
        NOT a distributional assumption. Both halves are standard and are
        RE-DERIVED MECHANICALLY in stage 0 from an explicitly constructed
        240-root E8 in exact integer arithmetic, rather than cited.
      supporting_results: []
      validation_experiment_ids: [EXP-XEDN-05ba0c]
      falsification_condition: >-
        A synthetic saturated root subset with N > r admitting no
        infinity-norm-1 relation, found by stage 0's mechanical check. The
        elementary argument is then wrong and that is a genuine surprise to be
        recorded as one.
    - id: HEUR-X3-2
      formal_statement: >-
        Squarefree discriminant of a chi = 1 Weierstrass model implies every
        fibre is of type I1, hence every local contribution is 0, hence every
        integral section has Shioda height 2 chi = 2.
      random_model_justification: >-
        Standard Kodaira/Tate reasoning, RECALLED and UNVERIFIED at the level
        of the precise statement over F_p for small p. Wild behaviour at
        p = 2, 3 is excluded by the family (all tested p >= 7), but
        quadratic-twist and additive-reduction edge cases are not, and are
        checked per surface rather than assumed.
      supporting_results: []
      validation_experiment_ids: [EXP-XEDN-05ba0c]
      falsification_condition: >-
        A surface with squarefree recomputed discriminant carrying a fibre that
        is not I1, or an integral free-x section whose recomputed Shioda height
        is not 2. Such surfaces are reported SEPARATELY and never pooled with
        the pure stratum, and the dichotomy is not claimed for them.
    - id: HEUR-X3-3
      formal_statement: >-
        Exhaustive enumeration over x-coefficients in F_p^3 yields a set closed
        under root addition, because a sum of two observed roots that is again
        a root is again an integral section with deg x <= 2.
      random_model_justification: >-
        Directly testable rather than assumed, and NOT independent of
        HEUR-X3-2 -- the deg-x <= 2 correspondence is the recalled half of the
        height statement, so this is not presented as extra support.
      supporting_results: []
      validation_experiment_ids: [EXP-XEDN-05ba0c]
      falsification_condition: >-
        A pair of observed sections with recomputed Shioda inner product -1
        whose group-law sum over F_p(t) is NOT in the observed slot list. A
        single failure refutes saturation and localises the error to the
        correspondence.

  predictions:
    - metric: >-
        D1 -- forced_dichotomy_violation_count -- censused surfaces on which
        (a) the recomputed discriminant is squarefree, (b) every observed
        section has recomputed Shioda height 2, and (c) the group-law shortest
        relation has infinity norm not in {1} and is not absent
      direction: lower
      minimum_effect: >-
        EXACTLY 0. Forced by the derivation before any run. Any single
        violation falsifies Claim D and is the most valuable outcome available,
        because it locates an error in one of the three premises or in
        elementary root-system algebra.
    - metric: >-
        D2 -- case_O_identification_rate -- fraction of surfaces reporting an
        undefined metric whose recomputed root system is exactly A1^r
        (pairwise orthogonal, N = r)
      direction: higher
      minimum_effect: >-
        1.00. Any undefined surface that is NOT A1^r means the coefficient
        bound missed a relation, which is Claim I's separate defect and must be
        reported as such rather than as a dichotomy failure.
    - metric: >-
        D3 -- ade_admissibility_rate -- fraction of censused surfaces whose
        recomputed (rank r, positive-root count N) pair is realisable by some
        rank-r ADE root subsystem of E8
      direction: higher
      minimum_effect: >-
        1.00 on the pure-root stratum. This has real teeth because most integer
        pairs are NOT admissible -- at rank 3 the only admissible counts are 3,
        4 and 6, so an observed (3, 5) is impossible. The parent proposal
        reports reading at least one non-admissible pair from the archive
        during design; under the derivation that must mean the NAIVE Gram's
        rank is not the true rank, and this metric decides which.
    - metric: >-
        I1 -- instrument_max_returnable_value -- the largest infinity norm
        shortest_relation_group_law returns when driven with a synthetic point
        set whose only relation has infinity norm 4
      direction: lower
      minimum_effect: >-
        The driver must return None or fall through to the Gram path -- NEVER
        4. If it returns 4, Claim I is wrong and must be withdrawn
        independently of everything else.
    - metric: >-
        P1 -- planted_control_premise_violation -- for the archived
        EXP-XEDN-005 planted control that reported max_abs_coeff = 2, which of
        (non-squarefree recomputed discriminant, a reducible fibre with nonzero
        contribution, a section of recomputed height not 2) holds
      direction: different
      minimum_effect: >-
        AT LEAST ONE must hold. If the recomputation finds squarefree
        discriminant, all fibres irreducible, and all slots at height 2, then
        the instrument is not broken and CLAIM D IS, and no negative statement
        about the lane's metric may be reported at all.
    - metric: >-
        N1 -- null_distribution -- fraction of matched synthetic integral
        lattices (rank 2 and 3, n closest vectors one per plus/minus pair)
        whose shortest relation has infinity norm 1
      direction: higher
      minimum_effect: >-
        Reported with its full distribution. If it materially DIFFERS from the
        archive's, the observation-collision claim is wrong and the lane's
        original conclusion is rescued. THE PARENT PROPOSAL'S SCOUT PILOT
        NUMBERS ARE NOT PRE-REGISTERED HERE as thresholds, because that pilot
        ran outside the harness; they are recorded in the parent record only.
    - metric: >-
        R1 -- dynkin_type_spread -- the number of DISTINCT Dynkin types of the
        recomputed root systems across the census
      direction: higher
      minimum_effect: >-
        AT LEAST 4 distinct types. Fewer than 4 means the sampler produces one
        stratum and the proposed replacement observable is no better than the
        one it replaces -- which is a real negative for the constructive half.
    - metric: >-
        C1 -- chi2_null_arm -- the recomputed Shioda diagonal and (rank, count)
        admissibility rate on the deg b = 10, deg a <= 2 family
      direction: different
      minimum_effect: >-
        Diagonal exactly 4, and (rank, count) pairs NOT constrained to the ADE
        table. If the chi = 2 family behaves identically to chi = 1, the
        recomputation is measuring the pipeline and NO conclusion may be drawn
        about either family.

  test_boundary:
    instances:
      - >-
        Every surface in the committed EXP-XEDN-005 raw results, recomputed
        under the Shioda pairing.
      - >-
        The committed EXP-XEDN-006 and EXP-XEDN-007 raw results as the chi = 2
        null arm.
      - >-
        The archived EXP-XEDN-005 planted control surface that reported
        max_abs_coeff = 2, as the primary positive control.
      - >-
        Synthetic matched null lattices -- random integral lattices of rank 2
        and 3, n closest vectors one per plus/minus pair.
      - >-
        A synthetic driver configuration whose only relation has infinity norm
        4, for the instrument-reach test.
      - >-
        A graded deg b sweep in {6, 7, 8, 9, 10, 11, 12} at fixed deg a <= 4.
      - >-
        OUT OF SCOPE -- any new curve generation beyond the graded sweep, any
        prime outside those already censused, and anything at cryptographic
        scale.
    parameters:
      committed_archives:
        - experiments/EXP-XEDN-005/runs/RUN-XEDN-005-MAIN/raw-result.json
        - experiments/EXP-XEDN-006/runs/RUN-XEDN-006-MAIN/raw-result.json
        - experiments/EXP-XEDN-007/runs/RUN-XEDN-007-MAIN/raw-result.json
      primes: [7, 13, 19, 31]
      deg_b_sweep: [6, 7, 8, 9, 10, 11, 12]
      synthetic_lattice_ranks: [2, 3]
      root_system: "E8, 240 roots, constructed in exact integer arithmetic"
    implementation: experiments/EXP-XEDN-05ba0c
    budget:
      stage0_wall_clock_seconds: 600
      stage1_wall_clock_seconds: 600
      stage2_wall_clock_seconds: 900
      stage3_wall_clock_seconds: 3600
      maximum_memory_gb: 4
      maximum_runs: 6

  distinguishable_outcomes:
    - outcome: >-
        D1 = 0, D2 = 1.00, D3 = 1.00 on the pure stratum, I1 never returns 4,
        the planted control violates at least one premise, the chi = 2 null arm
        behaves differently, and R1 >= 4.
      means: >-
        Both claims hold at the tested sizes. The lane's primary observable is
        pinned at the floor of its own range wherever defined, its zero slope
        is arithmetic rather than data, and the declared falsifier was
        unreachable by the instrument that ran. The forward deliverable is the
        replacement observable (Dynkin type plus Frobenius structure) with
        measured spread. This CLOSES THE OBSERVABLE, NOT THE ROUTE, and
        DEC-20260724-021's forbidden sentences remain binding.
    - outcome: >-
        D1 >= 1 -- a surface with squarefree recomputed discriminant, all slots
        at recomputed height 2, and a group-law-verified shortest relation of
        infinity norm 2 or more.
      means: >-
        CLAIM D IS FALSE and is withdrawn by a superseding record. The
        offending surface is archived verbatim as the counterexample
        certificate. This is the most informative outcome, because it means a
        saturated height-2 root set on a chi = 1 surface admits a minimal
        relation of norm above 1, contradicting elementary root-system algebra
        and locating the error in one of the three premises.
    - outcome: >-
        The planted control satisfies every premise while reporting 2.
      means: >-
        The instrument is not broken and CLAIM D IS. NO negative statement
        about the lane's metric may be reported at all from any arm.
    - outcome: >-
        I1 returns 4 on the synthetic driver.
      means: >-
        CLAIM I is FALSE and is withdrawn independently of Claim D. The
        "declared falsifier unreachable" statement cannot be made.
    - outcome: >-
        The chi = 2 null arm reproduces the chi = 1 behaviour exactly, or the
        graded deg b sweep holds flat at 1.00.
      means: >-
        The recomputation is measuring the pipeline rather than the surfaces.
        This is the canonical artifact tell; the audit reports an artifact and
        stops, and neither claim is supported.
    - outcome: >-
        R1 < 4 distinct Dynkin types.
      means: >-
        The proposed replacement observable has no more comparator spread than
        the one it replaces. The constructive half of the audit FAILS and must
        be reported as failed rather than quietly dropped.
    - outcome: >-
        Stage 0's mechanical check finds a saturated root set with N > r and no
        infinity-norm-1 relation.
      means: >-
        The elementary argument in step (4) is wrong. This ends the line before
        any archive is opened, and is the deliverable.

  falsification_conditions:
    - >-
      F1 -- any censused surface with squarefree recomputed discriminant, all
      slots at recomputed height 2, and a group-law-verified shortest relation
      of infinity norm >= 2. Claim D refuted.
    - >-
      F2 -- shortest_relation_group_law returns a value >= 4 on the synthetic
      driver. Claim I refuted, independently.
    - >-
      F3 -- the planted control satisfies every premise while reporting 2.
      Nothing negative may be reported about the lane's metric.
    - >-
      F4 -- the chi = 2 null arm reproduces the chi = 1 behaviour exactly, or
      the graded sweep's dichotomy-holding fraction stays at 1.00 across all
      deg b. Artifact; the audit stops.
    - >-
      F5 -- stage 0 finds a saturated root set with N > r and no
      infinity-norm-1 relation. The elementary argument is wrong.
    - >-
      F6 -- the group-law sum of two observed sections with recomputed inner
      product -1 is not in the observed slot list. Saturation (HEUR-X3-3)
      fails and the dichotomy loses its third premise.
    - >-
      F7 (THE PLANNED NEGATIVE) -- if every forced value comes out as
      predicted, the batch has NOT finished unless it also emits the exact
      configuration size at which the metric regains content, the matched
      null's full distribution, and the replacement observable's measured
      spread. A confirmed forced value producing no forward guidance is a
      fatigue report.

  interpretation_limits:
    - >-
      CLAIM TIER toy and no downstream citation may raise it. This is an audit
      of a measurement, not an attack. It moves no exponent, makes no system
      easier to solve, and sota_delta is zero on every attack axis.
    - >-
      NO STATUS CHANGE to GOAL-XEDN-001/002/003, to H-XEDN-004 or H-XEDN-005,
      to DEC-20260724-021 or any decision, to EV-XEDN-002 through -006, or to
      KN-FIND-005/010/011 is proposed, implied, or permitted. Only the
      Coordinator changes a status, and disagreement with a committed record is
      expressed by a superseding record, never an edit.
    - >-
      A confirmed dichotomy does NOT show H-XEDN-004 or H-XEDN-005 false. It
      shows that at the sizes reached the measurement could not have
      distinguished true from false. Conflating the two would repeat the error
      being audited.
    - >-
      A confirmed dichotomy closes the OBSERVABLE, not the route. It says
      nothing about whether a lifting-based relation source exists, and
      DEC-20260724-021's forbidden-sentence list remains binding word for word.
    - >-
      The census surfaces are two-section-PLANTED by the sampler. Any statement
      about "the family" from this data would be a statement about the planted
      stratum, and no claim about the uniform-measure family is made.
    - >-
      Comparing a recomputed canonical rank against a recorded naive rank and
      calling the difference a finding would be an error. Both are reported;
      only the recomputed one enters any conclusion.

