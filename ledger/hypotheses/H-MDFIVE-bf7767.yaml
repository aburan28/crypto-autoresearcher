hypothesis:
  id: H-MDFIVE-bf7767
  question_id: RQ-MDFIVE-6870c1
  goal_id: GOAL-MD5-001
  proposal_id: IDEA-20260821-e46061
  batch_id: BATCH-af29f6
  gated_by: TASK-20260821-a288f8
  gate_decision_id: DEC-20260821-b1a7b4
  statement: >-
    Within Round 1 (steps 1-16) of MD4/MD5, split at S=9, a meet-in-the-middle
    ("splice-and-cut") chunk-separation instrument restricted to exactly two
    free message words (word8 for chunk1 = steps 1-9; word9 for chunk2 =
    steps 10-16, each ranging over a declared 10-bit window, all other 14
    words held to a declared, pre-registered, non-zero pseudorandom
    constant), finds a match on a declared 20-bit partial target (the low 20
    bits of register A immediately after step 9) using
    O(2^{k1}+2^{k2}+2^{k1+k2-m}) chunk evaluations against a naive all-pairs
    baseline of O(2^{k1+k2}) evaluations over the SAME restricted 2-word
    search space, at the declared bounded parameter slice (S=9, k1=k2=10,
    m=12, k=20). This is a claim about a tiny, self-contained,
    RFC-schedule-derived model problem -- NOT about full 48-step MD4 or full
    64-step MD5 -- and is falsifiable at every numbered prediction below.
    Applying the IDENTICAL instrument (same S, k1, k2, m, k; the SAME 14
    fixed-word values) to MD5's own Round-1 step/constant set, substituting
    only MD5's shift amounts (S11=7,S12=12,S13=17,S14=22 for MD4's
    S11=3,S12=7,S13=11,S14=19) and per-step additive constants T[1..16] (for
    MD4's constant 0), is a licensed nearby-object control per KN-TECH-080
    audit 4: those two substitutions are exactly the two changes RFC 1321
    section 5 names as MD5's hardening over MD4. Under the null hypothesis
    that Round 1 alone carries none of MD5's added multi-round security
    margin, the MD4-Round-1 and MD5-Round-1 instruments are predicted, in
    advance, to show STATISTICALLY INDISTINGUISHABLE cost/success rates
    (R in [0.5, 2.0]) at this bounded scale.
  mechanism: >-
    RFC 1320 (MD4) and RFC 1321 (MD5) both specify Round 1 as 16 steps using
    message words X[0..15] in strict sequential order (step k+1 uses word
    k), with the IDENTICAL auxiliary function F(X,Y,Z) = (X AND Y) OR
    ((NOT X) AND Z) in both primitives' Round 1 (verified directly against
    both RFC texts by the idea-generator session). Because Round 1 uses each
    word exactly once and in index order, splitting at any interior step S
    yields two structurally disjoint word sets by construction: at S=9,
    chunk1 (steps 1-9) uses only words {0..8}; chunk2 (steps 10-16, computed
    backward from the declared Round-1 output state) uses only words
    {9..15}. Word 8 (last used at the boundary step 9) is chunk1's free
    word; word 9 (first used at step 10) is chunk2's free word. Fixing the
    other 14 words lets chunk1 be enumerated forward over word8's k1-bit
    window and chunk2 enumerated backward over word9's k2-bit window
    independently, joined via a hash table keyed on an m-bit window of
    register A after step 9. A negative control confirms the bottleneck: no
    interior split that extends to a full round leaves any free word (every
    one of the 16 words is used at least once inside any full round), which
    is why this instrument is restricted to a single-round, two-free-word
    slice rather than attempting a multi-round chunking.
  assumptions:
    - >-
      The Executor implements MD4/MD5 Round-1 step arithmetic with explicit
      `& 0xFFFFFFFF` masking after every addition and rotation (Python
      integers are arbitrary-precision and silently give wrong answers
      without it) -- validated by the H2 backward-inversion regression
      fixture below (no standard MD4/MD5 test vector covers a truncated
      16-step, no-feedforward primitive).
    - >-
      The 14 fixed message words (all of words {0..15} except free words 8
      and 9) and the fixed high-order bits of words 8/9 are generated by the
      deterministic, pre-registered procedure in this hypothesis's
      test_boundary.parameters (seed 20260821), fixed BEFORE any run, and
      are non-zero (mitigating the F-function degenerate-collapse
      confounder: F(X,Y,Z) evaluates to 0 whenever Y=Z=0 regardless of X).
    - >-
      The declared bounded scale (k1=k2=10, m=12, k=20) is frozen at the
      idea's proposed minimum, budget-safe floor. The Coordinator gate
      (DEC-20260821-b1a7b4) declines to scale it upward, per the gating
      discipline of not rewriting the proposal's design; a larger-scale
      replication is left as an explicit open direction (H3), not attempted
      here.
  proof_search_map:
    bottleneck: >-
      The step at which Round 1's word schedule stops being usable to
      partition the 16 steps into two disjoint, independently-enumerable
      word sets. Because Round 1 uses every word exactly once in index
      order, ANY interior split point S yields two disjoint word sets for
      free -- the actual bottleneck this program's compute budget imposes is
      finding a split that (a) leaves a large-enough matching window m to
      keep false-positive matching-point collisions rare, (b) lands the
      matching point on a register just updated, and (c) stays inside a
      single round, since crossing a round boundary eliminates every
      candidate free word (verified: a full-round chunk uses all 16 words,
      leaving none free).
    baseline_embedding:
      parameter_slice: >-
        Round 1 (steps 1-16) of MD4 and MD5, split at S=9: chunk1 = steps
        1-9 uses words {0,1,2,3,4,5,6,7,8}; chunk2 = steps 10-16 (computed
        backward from the declared Round-1 output state) uses words
        {9,10,11,12,13,14,15}. Free word for chunk1 = word 8; free word for
        chunk2 = word 9. All other 14 words held to the declared,
        pre-registered, non-zero constant.
      reproduction_check: >-
        Symbolic, done by direct line-by-line reading of both RFC texts (RFC
        1321 read locally in full; RFC 1320 via WebFetch): MD5 Round 1's 9th
        operation is "FF (a, b, c, d, x[8], S11, 0x698098d8); /* 9 */" and
        10th is "FF (d, a, b, c, x[9], S12, 0x8b44f7af); /* 10 */" (RFC 1321
        Appendix A.3) -- word 8 used exactly at step 9, word 9 exactly at
        step 10. MD4's corresponding entries ([ABCD 8 3] at step 9, [DABC 9
        7] at step 10) match the identical word-index pattern, differing
        only in shift amount and the absence of a per-step additive
        constant. Both primitives' Round-1 F is textually identical. A
        negative control was checked by hand: extending chunk1 to a full
        round (S=16) leaves NO free word for chunk1, confirming the
        bottleneck statement and establishing that any multi-round extension
        needs a genuinely different chunking strategy -- not attempted by
        this bounded instrument.
    observation_collision:
      observable: >-
        Matching-point equality: the low m=12 bits of register A after step
        9, compared between chunk1's forward-computed value (function of
        free word8) and chunk2's backward-computed value (function of free
        word9).
      distinct_preimage_search: >-
        Two DISTINCT (word8, word9) candidate pairs can agree on the 12-bit
        matching window while disagreeing on the full 20-bit target -- this
        is the EXPECTED, explicitly predicted case under the birthday
        heuristic H1: expected matching-window hits ~= 2^(10+10-12) = 2^8 =
        256, of which ~1 is expected to also satisfy the full 20-bit target.
        The 12-bit observable is therefore explicitly NOT sufficient alone
        to certify a solution; the separating condition is exact equality on
        the full 20 bits, checked independently after the matching-window
        filter. The paired heuristic-validation run (this contract) reports
        BOTH counts for every sampled target, characterizing this collision
        rate rather than assuming it away.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the naive O(2^{k1+k2}) all-pairs (word8,word9) equality
          search with a windowed hash table keyed on the 12-bit
          matching-point value of register A, built from chunk1's 2^{k1}
          forward candidates, probed by chunk2's 2^{k2} backward candidates.
        predicted_gain: >-
          O(2^{k1}+2^{k2}+2^{k1+k2-m}) ~= O(2^11 + 2^11 + 2^8) chunk
          evaluations at the declared scale versus O(2^20) naive, ~2^9-fold
          modeled reduction, ONLY over this tiny restricted 20-bit slice;
          does not extrapolate to the full 128-bit primitive.
      - transform: not_selected
        proposed_object: null
        predicted_gain: >-
          The other five KN-TECH-080 transform cards are not selected: this
          is a bounded computational demonstration and method-ceiling
          control, not a recursive/compositional proof, martingale-style
          argument, packed-measure lower bound, or rigidity/fiber question.
    quantifier_order: >-
      EXISTS (word8, word9) in {0,1}^10 x {0,1}^10 such that the
      matching-window observable agrees AND the full 20-bit target agrees,
      FOR A FIXED, DECLARED, PRE-REGISTERED TARGET STATE (fixed before the
      run) -- an existential, per-target claim, NOT "for all targets, a
      match exists at this declared cost." The paired heuristic-validation
      run independently repeats this existential search over many
      independently-drawn targets and reports the empirical success rate
      across that sample -- an empirical estimate of Pr_target[EXISTS...],
      never a proof of a universal guarantee; the witness (word8,word9) is
      explicitly allowed to depend on the target instance.
    method_ceiling:
      strongest_certifiable_claim: >-
        Against MD4's Round 1 restricted to this declared 20-bit,
        two-free-word slice, the strongest claim this bounded instrument
        could certify is: "a partial preimage on the declared 20-bit window
        of register A after step 9 of MD4's Round 1 was found using O(2^11)
        chunk evaluations, independently re-verified against the naive
        O(2^20) all-pairs baseline on a small control subset (k1=k2=6)."
        This says NOTHING about full 48-step MD4, nothing about the
        compression function's real 128-bit output, and nothing about MD4's
        actual (reported, unverified) 2^96/2^102 preimage complexity.
      nearby_object_control: >-
        MD5's Round 1, run through the IDENTICAL bounded instrument (same
        S=9, k1=k2=10, m=12, k=20; MD5's own shift constants and per-step
        additive constants substituted for MD4's), is the declared nearby
        object. Under the stated null hypothesis (Round 1 alone carries none
        of MD5's added multi-round security margin), MD4-round1 and
        MD5-round1 are predicted to be STATISTICALLY INDISTINGUISHABLE at
        this bounded scale (R in [0.5,2.0]) -- a controlled null, not a
        "ceiling" finding. A result distinguishing this pair would be
        genuinely surprising and would need a null-constant-control
        replication before being credited.
    proof_obligations:
      - claim: >-
          The two free-word sets (word8 for chunk1, word9 for chunk2) are
          disjoint from the OTHER chunk's used-word set, by construction of
          Round 1's sequential schedule.
        responsibility: baseline
      - claim: >-
          The MITM hash-table search's result set is IDENTICAL to the naive
          all-pairs search's result set on a shared small control subset
          (k1=k2=6, fully brute-forceable both ways).
        responsibility: correctness
      - claim: >-
          The declared search space (2^10 x 2^10 over words 8 and 9)
          contains at least one TRUE solution, by construction: target
          generation restricts the true word8/word9 to the same declared
          10-bit low-order window used by the search.
        responsibility: feasibility
      - claim: >-
          Backward step inversion (H2) is an exact algebraic identity, unit
          tested by composing forward and backward steps over a random
          sample and checking exact equality.
        responsibility: correctness
      - claim: >-
          The matching-window collision COUNT per target is well
          approximated by Poisson(lambda = 2^{k1+k2-m}) under heuristic H1;
          the conditional probability a matching-window hit also satisfies
          the full k-bit target is well approximated by 2^{-(k-m)}.
        responsibility: success_probability
      - claim: >-
          Any MD4-vs-MD5 cost/success comparison from this instrument is
          scoped strictly to the declared Round-1, 20-bit, two-free-word
          slice; it is not evidence about full-primitive preimage
          resistance and must not be reported as such.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-H1
      formal_statement: >-
        For a fixed target and fixed non-free words, as the free word
        (word8 in chunk1, word9 in chunk2) ranges uniformly over its
        declared 10-bit window, the resulting 12-bit matching-window value
        of register A after step 9 behaves as a uniformly random,
        pairwise-independent sample from {0,1}^12; consequently the count of
        matching-window collisions across the 2^10 x 2^10 candidate pairs is
        well approximated by Poisson(lambda=2^8=256), and the conditional
        probability a matching-window hit also satisfies the remaining 8
        target bits is well approximated by 2^-8.
      random_model_justification: >-
        RFC 1321 section 3.4 states, as a proved property of F, that if the
        bits of X,Y,Z are independent and unbiased, each bit of F(X,Y,Z) is
        independent and unbiased -- a genuine, RFC-stated single-step
        balance property. H1 extrapolates this single-step fact to the
        iterated 9-step composition (the classical move from "one mixing
        step is balanced" to "the iterated function looks random"). This
        extrapolation is NOT proved and is exactly what the validation
        route tests.
      supporting_results:
        - description: RFC 1321 section 3.4, single-step F balance property.
          citation: "RFC 1321 (MD5), https://www.rfc-editor.org/rfc/rfc1321"
          provenance: retrieved
          verified_by: idea-generator (TASK-20260821-420070, local pinned copy)
          role: single-step distributional justification, not a proof of H1 itself
      validation_experiment_ids: [EXP-MDFIVE-88f7d1]
      falsification_condition: >-
        The empirical matching-window-collision distribution shows a
        reproducible (>=3 independent target draws), non-shrinking
        heavier-than-Poisson tail.
    - id: HEUR-H2
      formal_statement: >-
        Given (a_new, b, c, d, X[k], shift s, additive constant T), the
        pre-step value of register a is uniquely recoverable as a_old =
        (((a_new - b) mod 2^32) >>> s) - F(b,c,d) - X[k] - T (mod 2^32),
        i.e. the MD4/MD5 Round-1 step function is exactly invertible given
        all other inputs. (Recorded as a numbered assumption because it is
        the class of implementation detail -- sign handling, masking,
        rotation direction -- that silently breaks in practice; it is a
        proved algebraic fact, not a distributional heuristic.)
      random_model_justification: >-
        Not applicable -- this is a proved bijection (rotation is invertible
        by rotation in the opposite direction; addition mod 2^32 is
        invertible by subtraction), not a random-model claim.
      supporting_results: []
      validation_experiment_ids: [EXP-MDFIVE-88f7d1]
      falsification_condition: >-
        Any single failure of backward_step(forward_step(a,b,c,d,X[k],s,T),
        b,c,d,X[k],s,T) == a over >=10,000 uniformly random 32-bit tuples.
    - id: HEUR-H3
      formal_statement: >-
        H1's uniformity/Poisson prediction, if confirmed at k1=k2=10,
        continues to hold with no new correlations emerging as k1,k2 grow
        toward the much larger values a real multi-round, full-primitive
        instrument would need.
      random_model_justification: >-
        None beyond H1's own unproved extrapolation; H3 is a SECOND-ORDER
        extrapolation of an already-unproved heuristic and is explicitly
        weaker than H1.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        NOT validated within this batch's budget. Open direction: repeat
        H1's sampling protocol at successive k1=k2 checkpoints (e.g. 10, 13,
        16, ...) in a future batch and confirm the prediction continues to
        hold with no systematic drift.
  structural_ingredients:
    - description: >-
        Exact MD5 Round 1 (FF) operation list, word order, shift constants,
        per-step additive constants, and F(x,y,z)=(x&y)|(~x&z).
      citation: "RFC 1321 (MD5), https://www.rfc-editor.org/rfc/rfc1321"
      provenance: retrieved
      verified_by: idea-generator (TASK-20260821-420070, local pinned copy, sha256 284a79d148400d9cd2a423211d1103b5cef0fb9256a4cbe6d7ebe5197c3149dd)
      role: exact operation schedule for the MD5 arm of the instrument
    - description: >-
        Exact MD4 Round 1 (F-round) operation list, word order, shift
        constants, and F(X,Y,Z)=XY OR (NOT X)Z.
      citation: "RFC 1320 (MD4), https://www.rfc-editor.org/rfc/rfc1320.txt"
      provenance: retrieved
      verified_by: idea-generator (TASK-20260821-420070, WebFetch this session)
      role: >-
        exact operation schedule for the MD4 control arm. NOTE: WebFetch
        passes content through a summarizing model, not byte-exact raw text
        -- NOT sha256-pinnable from this acquisition. Executor MUST fetch
        and sha256-pin RFC 1320's raw text with Bash/network tools before
        the run manifest cites it as a frozen input; recorded as an open
        acquisition item, not silently treated as done.
    - description: >-
        General splice-and-cut / initial-structure / partial-matching MITM
        preimage technique family for MD4/MD5-style compression functions.
      citation: "Aoki, Sasaki, 'Preimage Attacks on One-Block MD4, 63-Step MD5 and More', FSE 2009"
      provenance: recalled
      verified_by: null
      role: >-
        pointer for a future reader; NOT used as authority for any specific
        number in this hypothesis (WebSearch title/venue/summary only, no
        primary text read).
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: >-
        chunk-evaluation count to first full-20-bit-target match (MITM
        instrument) versus naive all-pairs search over the same restricted
        20-bit space
      direction: lower
      minimum_effect: >-
        at least 4x fewer chunk/step evaluations than the naive O(2^20)
        all-pairs baseline
    - metric: >-
        chi-square goodness-of-fit deviation between the observed
        matching-window-collision-count distribution (across N independent
        target draws) and the predicted Poisson(lambda=2^8=256)
      direction: lower
      minimum_effect: >-
        deviation statistic below the alpha=0.05 critical value for the
        declared degrees of freedom (failure to reject H1 is the validating
        outcome; a reproducible, non-shrinking excess tail across >=3
        independent target draws is the falsifier)
    - metric: >-
        ratio R of MD5-Round-1 to MD4-Round-1 cost/success rate to find a
        full-20-bit-target match, at the identical declared scale
      direction: different
      minimum_effect: >-
        R outside [0.5, 2.0], AND not reproduced when both primitives'
        constants are replaced by the same null variant (not executed this
        batch -- a future follow-up if R is surprising), is the threshold
        for treating R as a genuine, reportable finding rather than noise.
  test_boundary:
    instances:
      - "MD4 Round-1, 20-bit two-free-word slice (control, primary run)"
      - "MD4 Round-1, same slice, N-target heuristic-validation sampling run"
      - "MD5 Round-1, IDENTICAL slice and scale, conditional nearby-object run (authorized below)"
    parameters:
      S: 9
      k1: 10
      k2: 10
      m: 12
      k: 20
      fixed_word_generation:
        rng: "python stdlib random.Random(seed)"
        seed: 20260821
        procedure: >-
          rng = random.Random(20260821). For i in 0..15 in increasing order,
          draw w_i = rng.getrandbits(32) exactly once (16 draws total, fixed
          call order). For i not in {8,9}: fixed_words[i] = w_i, EXCEPT if
          w_i == 0, in which case fixed_words[i] = 1 (deterministic non-zero
          fallback; expected probability of triggering is 2^-32 per word).
          For i in {8,9}: word_i_high22 = w_i & 0xFFFFFC00 (top 22 bits;
          bottom 10 bits discarded and replaced per-candidate by the
          search), EXCEPT if word_i_high22 == 0, in which case
          word_i_high22 = 0x00000400 (sets bit 10, the lowest bit outside
          the free 10-bit window, keeping it non-zero while leaving the free
          window untouched). This procedure and seed are fixed before any
          run and immutable once this contract is frozen (fixed_before_acquisition).
      md4_primary_target:
        seed: 8975313
        procedure: >-
          rng_t = random.Random(8975313); true_word8_low10 =
          rng_t.getrandbits(10); true_word9_low10 = rng_t.getrandbits(10).
          Combine with word8_high22/word9_high22 from fixed_word_generation
          to form the true word8, word9. The declared target = the low 20
          bits of register A immediately after step 9 of the MD4 Round-1
          forward computation using these words and the 14 fixed words. This
          is the single pre-registered target for the MD4 primary run.
      md4_heuristic_validation_targets:
        seed: 8975314
        procedure: >-
          rng_t2 = random.Random(8975314). Draw N independent (word8_low10,
          word9_low10) pairs sequentially from this one stream (10 bits then
          10 bits per target, N times); each pair's resulting 20-bit
          register-A-after-step-9 value is that target's declared answer.
          N target: 1000, subject to the run's 300s ceiling; a halt before
          reaching 1000 truthfully reports the achieved N (>=200 still
          supports the chi-square test per the idea's validation_plan) and
          is a budget outcome, not a defect.
      md5_conditional_targets:
        seed: 8975315
        procedure: >-
          Identical to md4_heuristic_validation_targets, seed 8975315,
          same N intent (1000, same halt discipline). Applies ONLY if the
          MD5-side run is executed under this contract's authorization
          below. The 14 fixed words and word8/word9 high22 bits are the
          SAME values as fixed_word_generation (seed 20260821) -- i.e. the
          MD5 run's message-word inputs are byte-identical to the MD4
          heuristic-validation run's; only the shift amounts and per-step
          additive constants differ, isolating those as the sole structural
          difference between the two runs.
      brute_force_control_k6:
        seed: 8975316
        procedure: >-
          rng_c = random.Random(8975316); true_word8_low6 =
          rng_c.getrandbits(6); true_word9_low6 = rng_c.getrandbits(6).
          Fixed words and word8/word9 high-26 bits reuse
          fixed_word_generation's seed-20260821 draws (word_i_high26 = w_i &
          0xFFFFFFC0, with the same non-zero fallback convention extended to
          26 bits). One declared target at k1=k2=6, fully brute-forceable
          both ways (MITM hash-table search AND naive all-pairs), to confirm
          identical result sets.
      h2_regression_fixture:
        seed: 8975317
        procedure: >-
          rng_h2 = random.Random(8975317). Draw >=10,000 uniformly random
          32-bit tuples (a,b,c,d,X[k],s,T) (s in the declared shift-constant
          set actually used by Round 1; T in {0} for MD4, RFC1321's
          T[1..16] for MD5). Deterministic exact-identity check, no
          tail/statistical interpretation needed.
    implementation: >-
      Standalone MD4/MD5 Round-1 module (harness/run_md4_ceiling.py, no
      hashlib in the solver core): forward_step, backward_step, MITM
      hash-table search, naive all-pairs search (control subset only), H1
      sampling harness, H2 regression fixture. `--target md4|md5` selects
      the shift/constant table; all other logic shared between arms.
    budget:
      wall_clock_seconds_total_de817d: 1800
      implementation_ceiling_seconds: 900
      per_run_ceiling_seconds: 300
      maximum_runs: 4
  falsification_conditions:
    - >-
      The MITM result set differs from the naive brute-force all-pairs
      result set on the k1=k2=6 control subset -- falsifies the
      implementation or the mechanism as designed (baseline reproduction
      fails).
    - >-
      The empirical matching-window-collision distribution shows a
      reproducible (>=3 independent target draws), non-shrinking
      heavier-than-Poisson tail -- falsifies HEUR-H1 at this scale for this
      primitive.
    - >-
      The declared search space (2^10 x 2^10) fails to contain the true
      solution for the target-generation protocol used -- falsifies the
      feasibility proof obligation and invalidates any reported success
      rate.
    - >-
      Backward step inversion fails the regression fixture -- falsifies
      correctness before any search result can be trusted.
    - >-
      R (MD5/MD4 cost ratio) falls outside [0.5, 2.0] and survives a future
      null-constant control -- falsifies the null hypothesis that Round 1
      alone carries no MD4/MD5 security-margin difference at this scale, and
      is a reportable finding, not a defect to be explained away.
  interpretation_limits:
    - >-
      All results characterize ONLY the declared Round-1-restricted,
      2-free-word, 20-bit bounded slice of MD4/MD5; no claim is made, and
      none should be inferred, about full 48-step MD4 or full 64-step MD5.
    - >-
      A "no significant difference" (R within [0.5,2.0]) result for the
      MD4-vs-MD5 nearby-object control is a CONTROLLED NULL, not evidence
      that MD4 and MD5 are equally weak -- it means this bounded instrument
      has not yet found load-bearing structure at this scale, the currently
      expected outcome.
    - >-
      This hypothesis does not attempt, and must not be read as progress
      toward, RQ-MDFIVE-6870c1's actual full-primitive method-ceiling
      question; it is a necessary but far from sufficient
      mechanism-verification step.
    - >-
      Claim ceiling: this hypothesis and its experiment cannot exceed
      `analyzed` (CLAUDE.md's four supported-promotion gates cannot all be
      satisfied by one bounded-scale batch); it must never be recorded
      `supported`.
  status: weakened
  status_note: >-
    WEAKENED per DEC-20260821-1215e5 (BATCH-af29f6 closing decision), citing
    EV-MDFIVE-ab007d. The mechanism claim actually falsified: chunk2's
    backward-computed value of the declared matching quantity (register A
    immediately after step 9) is NOT a function of free word9 as this
    record's mechanism/observation_collision text asserted -- word9 is first
    consumed at step 10, so nothing computed at or before step 9 can depend
    on it. Proven algebraically (backward_step's return-tuple position 1 is
