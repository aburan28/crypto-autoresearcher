hypothesis:
  id: H-ECDLP-67fc66
  question_id: RQ-ECDLP-623a32
  goal_id: GOAL-ECDLP-001
  source_idea_ids:
    - IDEA-20261006-bc1250
  added: '2026-10-07'
  status: specified
  proposed_by: coordinator
  title: >-
    Maximum tangent-slope fiber on y^2 = x^3 + x + 6 over F_73
  statement: >-
    On the nonsingular curve E: y^2 = x^3 + x + 6 over F_73, the
    tangent-slope map λ(P) = (3x(P)^2 + 1)/(2y(P)), defined on affine
    points with y(P) ≠ 0, has maximum fiber cardinality exactly 4.
    The concrete negative is that every attained slope has at most 3
    preimages. No ECDLP exponent improvement is claimed.
  mechanism: >-
    Representation class R1: the chart function λ on the pinned
    short-Weierstrass model (A, B) = (1, 6). The operation set Sigma
    is the singleton {[2]}. The class is coordinate-dependent. Under
    (x, y) mapped to (u^2 x, u^3 y), λ scales by u^{-1}, so λ is a
    function of the chart. Expanding (3x^2 + 1)^2 = 4λ^2 (x^3 + x + 6)
    gives a degree-4 polynomial in x whose leading coefficient is 9,
    nonzero in F_73. Each simple root determines at most one point of
    that slope because λ(-P) = -λ(P). The Hasse window gives
    #E(F_73) ≥ 58 > 4, so keeping only λ is lossy. λ(2P) is not a
    function of λ(P) alone, because the duplication formula still
    needs x(P), so the discard is not a block system of ⟨[2]⟩. The
    priced number is the fiber cardinality.
  assumptions:
    - >-
      The model is fixed as y^2 = x^3 + x + 6 over F_73. A change of
      u rescales λ and is a different representation.
    - >-
      Discriminant -16(4A^3 + 27B^2) = -16·976 ≠ 0, so E is an
      elliptic curve. The characteristic is not 2 or 3, so λ is given
      by the displayed formula and the slope polynomial has degree 4.
    - >-
      Fibers are counted on affine points with y ≠ 0. The point at
      infinity and the points with y = 0 are outside the domain.
  proof_search_map:
    bottleneck: >-
      Whether any λ in F_73 has four distinct preimages on E(F_73).
      Removing that existence question leaves only the degree upper
      bound of 4, which does not say the bound is attained.
    baseline_embedding:
      parameter_slice: >-
        The negation identity λ(-P) = -λ(P) on this same curve. It
        pairs slopes and does not force any fiber to have size 4 or
        size at most 2.
      reproduction_check: >-
        Before the histogram is read, check λ(-P) = -λ(P) for every
        affine point with y ≠ 0. A single failure voids the run.
    observation_collision:
      observable: the maximum fiber cardinality of λ
      distinct_preimage_search: >-
        Search for two affine points with the same λ and distinct
        x-coordinates. A fiber of size 4 is four such points. Two
        slopes with the same fiber size are not a collision of the
        observable.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          For each attained λ, the univariate
          (3x^2 + 1)^2 - 4λ^2 (x^3 + x + 6) in F_73[x].
        predicted_gain: >-
          Replaces a search over points by counting F_73-roots, and
          certifies that no fiber can exceed 4. The predicted gain
          in the ECDLP exponent is zero.
    quantifier_order: >-
      There exists λ in F_73 such that there exist four distinct
      affine points of E(F_73) with that tangent slope. A universal
      statement over all curves is not claimed.
    method_ceiling:
      strongest_certifiable_claim: >-
        On this one curve the maximum fiber equals 4, or it is at
        most 3. The degree forbids a fiber of size 5 or more.
      nearby_object_control: >-
        A random monic degree-4 polynomial over F_73 can have four
        roots without being a slope polynomial of E. Counting those
        roots as successes would make the claim vacuous, so only
        slopes attained by points of E count.
    proof_obligations:
      - claim: The slope equation has degree exactly 4 over F_73.
        responsibility: size
      - claim: >-
          Two independent enumerations of E(F_73) produce the same
          maximum fiber.
        responsibility: correctness
      - claim: The statement is only about (A, B, p) = (1, 6, 73).
        responsibility: scope
    not_applicable_reason: >-
      No subfield is inapplicable. The fiber count is an exact
      integer on a 73-element field.
  asymptotic_claim:
    problem: >-
      Single-target discrete log on a prime-order subgroup, with this
      measurement pricing a coordinate fiber rather than group
      operations.
    prior_best: >-
      KR-RHO-13bf67, Omega(N^{1/2}) generic-group operations, met by
      rho up to a constant. The file was opened 2026-10-07.
    time_exponent: >-
      Unchanged at 1/2. A fiber count is not an exponent.
    memory_exponent: >-
      Unchanged. The histogram stores O(p) field elements at p = 73.
    hidden_cofactor: >-
      No o(1) term is introduced. The fiber cardinality is an integer.
    claim_kind: constant_factor
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        For this pinned curve, the factorization type of the degree-4
        slope polynomial, as λ varies over slopes attained by
        E(F_73), hits four distinct roots at least once. A uniform
        random element of S_4 is the identity with probability 1/24.
      random_model_justification: >-
        The slope polynomial has degree exactly 4 because its leading
        coefficient is 9 ≠ 0 in F_73. That bounds every fiber by 4.
        The probability 1/24 is the counting measure on S_4. Transfer
        from a uniform polynomial to this parametric family is the
        heuristic, checked on this curve rather than assumed at
        cryptographic size.
      supporting_results:
        - >-
          Leading coefficient 9 ≠ 0 in F_73, stated in
          IDEA-20261006-bc1250 heuristic H1. No external theorem is
          added beyond that degree count.
      validation_experiment_ids:
        - EXP-ECDLP-ced7a5
      falsification_condition: >-
        This curve has no slope with four distinct preimages, or the
        point histogram and the degree-4 root counter disagree.
  structural_ingredients:
    - description: >-
        The slope polynomial (3x^2 + 1)^2 - 4λ^2 (x^3 + x + 6) has
        degree 4 because the leading coefficient is 9 ≠ 0 in F_73.
      citation: IDEA-20261006-bc1250
      provenance: internal
      verified_by: ledger/proposals/IDEA-20261006-bc1250.yaml
      role: upper bound of 4 on every fiber
    - description: >-
        Generic-group lower bound of Omega(N^{1/2}) group operations.
      citation: KR-RHO-13bf67
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
      role: exponent this fiber count does not move
    - description: >-
        Negation sends a point to its negative and multiplies a rho
        walk's iteration count by about 1/sqrt(2) when the walk is on
        {±P}. This hypothesis uses only λ(-P) = -λ(P).
      citation: KR-RHO-fb88e6
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-fb88e6.yaml
      role: sign relation checked before the histogram
  predictions:
    - metric: >-
        Maximum number of affine points of E(F_73) with a common
        tangent slope λ.
      direction: higher
      minimum_effect: >-
        The maximum equals 4, which is at least 1 above the failure
        outcome in which every fiber has size at most 3.
  test_boundary:
    instances:
      - E: y^2 = x^3 + x + 6 over F_73
      - one frozen Möbius reparametrisation of x
      - 200 random monic degree-4 polynomials over F_73
    parameters:
      curve: (A, B, p) = (1, 6, 73)
      domain: affine points with y ≠ 0
      moebius: (x+1)/(x+2), excluded at x = 71
      random_polynomials: 200
    implementation: >-
      Missing. No committed program enumerates this curve, histograms
      λ, and compares the histogram with the degree-4 root counter.
    budget:
      enforcement: advisory
      maximum_memory_gb: 1
      maximum_runs: 1
  falsification_conditions:
    - >-
      Every tangent slope attained on E(F_73) has at most 3
      preimages, and the point histogram agrees with the degree-4
      root counter.
    - >-
      The point histogram and the degree-4 root counter disagree.
      The run is then void and is not evidence against the degree.
  interpretation_limits:
    - >-
      A fiber of size 4 on this curve does not change the Pollard
      rho exponent 1/2 and does not yield a homomorphism of a
      prime-order subgroup.
    - >-
      A miss at size at most 3 closes only (A, B, p) = (1, 6, 73).
    - >-
      The result is a coordinate statistic. It is not a charged cost
      for factor-base membership, decomposition, collision search, or
      linear algebra.
  rerandomization: >-
    No re-randomizing walk is part of this hypothesis. The comparison
    is an exact count on a 73-element field.
  status_note: >-
    Specified, not approved. EXP-ECDLP-ced7a5 is review_required
    because check_approval_capacity rejects an approval on
    GOAL-ECDLP-001 and because the fiber-census driver is missing.
