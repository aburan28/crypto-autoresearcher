    prose: >
      Toy scale. Stage 0 is exact
      boolean arithmetic on one
      frozen C1 iff. It is not an Aut
      census, not a Gaussian-integer
      box, not a Weierstrass fibre
      count, not a homomorphism gcd,
      not Stage 1 of EXP-ECDLP-6ffef4,
      not Stage 1 of EXP-ECDLP-11c247,
