  statement: >
    Fix n=7 and Gamma={1,6} with 6
    congruent to -1 mod 7, acting on
    the domain {1,2,3,4,5,6} by
    multiplication, before any
    orbit census is read. Stage 0
    asserts only IDEA-20260901-863e36
    (C1) as exact boolean arithmetic:
    a map v propagates under Gamma
    if and only if the fibre partition
    of v is a Gamma-invariant block
    system. REAL is the {x,-x} fibres
    v(1)=v(6)=0, v(2)=v(5)=1,
    v(3)=v(4)=2, which is invariant
    and does propagate. KF is the
    singleton-versus-rest map
    v(1)=0 and v(2)=...=v(6)=1,
    which is not invariant and does
    not propagate. NULL is the empty
    domain, which is rejected. n=0
    is rejected. This is not an Aut
    census, not a Gaussian-integer
    box, not a C1 fibre-count on a
    Weierstrass curve, not a
    homomorphism gcd, not a GL_2
    partition, and not a rho beat.
    Stages 1+ stay unauthorized.
  mechanism: >
    IDEA-20260901-863e36 (C1) says a
    map v from G to S propagates
    deterministically under Sigma
    iff the fibre partition of v is
    a Gamma-invariant partition of
    the Gamma-set. Stage 0 freezes
    that iff on one cyclic toy.
    The producer evaluates
    invariant(partition, gamma, n)
    and propagates(v, gamma, n) by
    exact integer arithmetic and
    reports whether they agree.
    The KF non-block object and the
    NULL empty domain are the
    proves-too-much and nearby-object
    controls. No curve is touched.
    No Aut is enumerated. This is a
    new RQ-ECDLP-002 object after
    Stage 0 of EXP-ECDLP-11c247 held
    as P-S0-DELTA
    (DEC-20260908-54c825). It is not
    Stage 1 of EXP-ECDLP-11c247 and
    not Stage 1 of this experiment.
    IDEA-20260902-2327a5 shares the
    W_n law already calibrated as
    P-S0-WTLAW and is not selected.
    P-S0-BOX, P-S0-AUT, P-S0-HOM, and
    P-S0-C1 calibrate other objects
    and are not this iff.
  predictions:
    - id: P-S0-BLOCK
      metric: well-defined exact C1 block-system iff on frozen n=7
      direction: different
      minimum_effect: >
        After fixture_pass, REAL is
        invariant and propagating so
        the iff is true. KF is not
        invariant and not propagating
        so the iff is true. NULL empty
        domain is rejected. n=0 is
        rejected. One certified miss
        after fixture_pass is a scoped
        falsification of this
        instrument at n=7.
      claim_tier: observational
    - id: P-S1-ORBIT
      metric: orbit-canonicalisation cost on a prime-order subgroup
      direction: different
      minimum_effect: >
        Stage 1+, unauthorized here.
        Stage 0 does not enumerate
        Aut, does not cost an orbit,
        and does not touch a curve.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KFCOUNT
      statement: >
        After fixture_pass, KF reports
        invariant or propagating equal
        to REAL. An encoding bug is
        failed_infrastructure.
    - id: F-S0-REALCNT
      statement: >
        After fixture_pass, REAL fails
        to be both invariant and
        propagating. That falsifies
        only P-S0-BLOCK at frozen n=7.
    - id: F-S1-ORBIT
      statement: >
        After an authorized later
        stage, a claimed orbit cost
        that misses the charged
        canonicalisation bound.
        Unauthorized here.
