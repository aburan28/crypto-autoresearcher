  proof_search_map:
    bottleneck: >
      Whether the C1 iff holds as exact
      boolean arithmetic on frozen n=7.
      Stage 0 only checks that identity,
      the non-block known-false, and the
      empty nearby object.
    baseline_embedding:
      parameter_slice: >
        The REAL, KF, and NULL fixtures.
        Disclosed tightening: C1 iff at
        frozen n=7 and Gamma={1,-1} only,
        not the proposal's orbit-cost
        measurement, not an Aut census.
      reproduction_check: >
        REAL invariant and propagating,
        iff true. KF not invariant and
        not propagating, iff true. NULL
        empty domain rejected. n=0
        rejected.
    observation_collision:
      observable: >
        invariant versus propagate
        versus the iff.
      distinct_preimage_search: >
        Hold n=7 and Gamma={1,6} and
        replace the {x,-x} fibres by
        singleton-versus-rest (KF).
        Hold n and replace the domain
        by empty (NULL).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Frozen exact C1 block-system iff.
        predicted_gain: >
          Exact known-false non-block
          gap on KF. Zero claimed attack
          improvement.
    quantifier_order: >
      Freeze n=7 and Gamma before
      reading the iff. Existential
      equality at one toy does not
      imply an orbit census and does
      not imply a rho beat.
    method_ceiling:
      strongest_certifiable_claim: >
        Instrument reproduction on the
        declared frozen n=7.
        Never an Aut census.
        Never an orbit cost.
        Never an ECDLP exponent.
      nearby_object_control: >
        NULL is the empty domain. An
        argument that still assigns it
        a true iff is wrong. KF is the
        non-block object; an argument
        that assigns every partition
        invariant=true is wrong.
    proof_obligations:
      - claim: well-defined exact C1 block-system iff
        responsibility: correctness
      - claim: exact REAL invariant-and-propagating at n=7
        responsibility: baseline
      - claim: exact KF non-block gap
        responsibility: baseline
      - claim: no Aut census, no orbit cost, no Stage 1 of 6ffef4/11c247/114eb2/821bc5/735974/fdae20/089e80/b3f975/daf1bb/0d1336/1aa0f8/79f8c4/628891/9e9536/90f602, no Stage 2 of 4be480
        responsibility: interface
    not_applicable_reason: null
