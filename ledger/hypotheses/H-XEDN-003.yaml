hypothesis:
  id: H-XEDN-003
  question_id: RQ-XEDN-002
  statement: >-
    On non-isotrivial surfaces y^2 = x^3 + a(t)x + b(t) over F_p with a ≠ 0,
    deg a ≤ 2, deg b = 6, and non-constant j, among free-x integral sections of
    shape deg x ≤ 2 and deg y ≤ 3, the infinity-norm of the shortest nonzero
    Mordell-Weil relation among the observed sections remains in {1,2,3} across
    p in {7,13,19,31} with no slope vs log p that excludes 0 — even though the
    μ₃ automorphism used on the a=0 family is unavailable. Growth that excludes
    a constant upper bound of 3, or any verified shortest relation with
    infinity-norm ≥ 4, falsifies the hypothesis and blocks transferring the
    GOAL-ICLIFT-001 coefficient-bound closure to non-isotrivial families.
  mechanism: >-
    For squarefree discriminant / irreducible-fibre rational elliptic surfaces,
    integral sections of bounded degree still have bounded canonical height, so
    the Mordell-Weil lattice they generate still admits a Z-basis of relations
    with coefficients bounded independently of p. Removing a=0 removes the μ₃
    root-of-unity automorphism that forced inf-norm 1 in EXP-XEDN-003, so any
    remaining bound must come from the geometric height lattice itself rather
    than from that automorphism. If low-degree sections nevertheless require
    relations with growing coefficients, the coefficient-bound obstruction does
    not transfer and the non-isotrivial relation-source route stays open at the
    level of this measurement.
  assumptions:
    - >-
      Surfaces are non-isotrivial: a ≠ 0 and j(t) is a non-constant rational
      function on every Gram/trend surface.
    - >-
      Free-x sections mean deg x ≤ 2, deg y ≤ 3, y ≠ 0, with x^3+a x+b a nonzero
      square in F_p[t] (predicate recorded in the experiment).
    - >-
      "Minimal relation" means a shortest nonzero vector of the integer relation
      lattice among the observed sections, measured in the infinity norm;
      verified by specialisation to O at smooth fibres.
  predictions:
    - metric: max_|coeff|(p) of the shortest nonzero relation among observed free-x sections
      direction: lower
      minimum_effect: >-
        max_|coeff|(p) stays in {1,2,3} at every tested p with slope vs log p
        whose uncertainty includes 0.
    - metric: fraction of eligible surfaces with a verified μ₃-type orbit sum to O
      direction: lower
      minimum_effect: >-
        Near 0: confirms μ₃ is absent as a relation source on this family
        (control that the isotrivial mechanism was removed).
  test_boundary:
    instances:
      - p in {7, 13, 19, 31}
      - section-rich non-isotrivial surfaces (target ≥4 free-x slots; prefer ≥10 surfaces/size)
      - free-x sections deg x ≤ 2, deg y ≤ 3
    parameters:
      surface_family: "y^2 = x^3 + a(t)x + b(t), a≠0, deg a≤2, deg b=6, j non-constant"
      relation_extraction: "group-law identity over F_p(t); specialisation ≥20 smooth fibres"
      height_diagnostic: "optional polarisation Gram; ranks are not geometric MW ranks without local corrections"
    implementation: experiments/EXP-XEDN-004
    budget:
      wall_clock_seconds: 3600
      maximum_memory_gb: 4
      maximum_runs: 6
  falsification_conditions:
    - >-
      max_|coeff|(p) grows so the slope vs log p excludes 0, OR any eligible
      surface has a verified shortest relation with infinity-norm ≥ 4.
    - >-
      The non-isotriviality control fails (a=0 or j constant on "eligible"
      surfaces): those surfaces are invalid for the trend, not negative evidence.
  interpretation_limits:
    - >-
      Boundedness here supports coefficient-bound closure only for THIS
      non-isotrivial degree window at these sizes. It does not close candidate B2,
      number-field xedni, or crypto-scale ECDLP.
    - >-
      Growth here reopens only the non-isotrivial function-field relation-source
      coefficient question for this window; it is not an attack result.
  status: approved
  proposed_by: coordinator
