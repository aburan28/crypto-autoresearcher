hypothesis:
  id: H-ICEX-8d9e17
  question_id: RQ-SIG-001
  statement: >-
    For the RQ-SIG-001 cascade statistic - the count of NON-REWRITABLE low-degree
    F5 signatures at a given degree D, together with #G* measured against the
    generic m * d^{m-1} - the between-curve variance component at D = 3 and D = 4
    is smaller than the within-curve (seed-to-seed) variance component, so a
    modest number of curves suffices to size the lane's deferred D >= 6 null
    recalibration. The deliverable is the required curve count at a stated effect
    size, compared against what the lane can afford.
  mechanism: >-
    A comparison between the Semaev condition and its null is powered by the
    ratio of the between-condition effect to the total variance of the statistic,
    and total variance decomposes into a within-curve part driven by system
    generation and a between-curve part driven by the curve. Measuring both
    components cheaply at low degree gives the curve count an expensive
    high-degree study would need, before that study is run.
  assumptions:
  - >-
    BAND NON-DEGENERACY, ADDED BY THIS CONTRACT AND NOT PRESENT IN THE SOURCE
    IDEA. H-SIG-001 records the low-degree syzygy family counts verbatim as 1 at
    D3 and 8n/3 at D4 - values determined by n alone. If the tracked statistic
    were that raw count, its between-curve variance would be ZERO BY
    CONSTRUCTION, the variance decomposition would be degenerate, the required
    curve count would be vacuously small, and no alternative hypothesis could
    move it. This contract therefore tracks the NON-REWRITABLE signature count
    and #G*, which are the quantities H-SIG-001 actually predicts to vary across
    its panel, and adds a blocking pre-run degeneracy gate. The change is stated
    rather than absorbed.
  - >-
    Within-curve replication is over SEEDS of system generation, not over repeats
    of a deterministic solve on a fixed instance. A deterministic engine returns
    an identical signature count on an identical instance, so a repeat-run null
    would have zero variance and could bound nothing.
  - >-
    Between-curve variance at D = 3 and D = 4 predicts its order of magnitude at
    D >= 6. THIS IS THE RECORD'S CENTRAL EXTRAPOLATION, it is unjustified, and it
    is stated rather than buried.
  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms:
    - transform: null
      proposed_object: null
      predicted_gain: null
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations:
    - claim: null
      responsibility: null
    not_applicable_reason: >-
      An experiment-sizing measurement. Variance decomposition is elementary and
      no theorem is sought; the deliverable is a required sample size.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: >-
      FOR the non-rewritable low-degree signature count at D = 3 and D = 4 on the
      declared curve panel, the between-curve variance component is at most the
      within-curve component, and the between-curve component measured at D = 4
      does not exceed the one measured at D = 3 by more than a factor 3.
    random_model_justification: >-
      The statistic is defined identically at every degree, so its curve
      dependence has the same source at each. THE GAP, STATED - higher-degree
      systems involve more of the curve's structure and their variance could grow
      with degree, in which case low-degree sizing systematically UNDER-powers the
      D >= 6 study, which is the direction that would let an inadequate
      experiment proceed.
    supporting_results:
    - >-
      H-SIG-001 test boundary, read in full - generic plus CM panel, n in
      {9, 12, 15, 18}, at least 3 seeds, m in {2, 3}, max_D 6, q from 2^16 to
      2^24.
    validation_experiment_ids:
    - EXP-ICEX-a0b21a
    falsification_condition: >-
      Measured D = 4 between-curve variance exceeding the D = 3 value by more
      than a factor 3, indicating growth with degree.
  structural_ingredients:
  - description: >-
      GOAL-SIG-001 next_action, read verbatim - Protocol repair PASS
      (SIG-D6-NULL-RECAL-v2). Defer calibration executor until campaign capacity
      prioritizes D >= 6 null recalibration; keep D <= 5 cascade admissible. This
      contract sizes that deferred work and does not perform it.
    citation: GOAL-SIG-001
    provenance: internal
    verified_by: coordinator (TASK-20260904-074465, goal head read directly)
    role: the deferred experiment this record sizes
  - description: >-
      H-SIG-001 predictions, read verbatim - count and degree histogram of
      non-rewritable low-degree signatures per n per panel family, with minimum
      effect a non-rewritable count growing in n on any family CI-separated from
      the null's rewritable-only profile; and #G* against generic m * d^{m-1}.
      Its status is supported_scoped under DEC-20260717-002.
    citation: H-SIG-001
    provenance: internal
    verified_by: coordinator (TASK-20260904-074465, file read in full)
    role: source of the tracked statistic
  reduction_chain: null
  predictions:
  - metric: degeneracy_gate_between_curve_sample_variance_at_d3
    direction: different
    minimum_effect: >-
      BLOCKING PRE-RUN GATE. If the between-curve sample variance of the chosen
      statistic is exactly zero across the first 20 curves at D = 3, the design
      can size nothing and the experiment terminates as design-infeasible. A zero
      here is NOT the finding few curves suffice; it means the statistic is
      constant by construction and the discriminator has no width.
  - metric: planted_between_curve_offset_recovery
    direction: different
    minimum_effect: >-
      A synthetic per-curve offset drawn from a normal distribution with standard
      deviation equal to 1x and to 3x the measured within-curve standard
      deviation is injected into the recorded statistic. Predicted magnitude,
      binding - the decomposition must recover the injected between-curve
      variance within a factor 2 at 1x, and must separate it from zero at 95
      percent at 3x. The graded plant is the demonstrated dynamic range.
  - metric: within_curve_variance_component_over_seeds
    direction: different
    minimum_effect: >-
      Establishes the measurement noise floor. Between-curve spread is
      interpretable only above it.
  - metric: between_curve_variance_component_of_the_cascade_statistic
    direction: different
    minimum_effect: >-
      Reported as a component with its interval, never as a total and never as a
      mean.
  - metric: curves_needed_for_a_stated_effect_size_at_d_at_least_six
    direction: different
    minimum_effect: >-
      The deliverable, computed from the two components at a pre-declared effect
      size, and compared against what the lane can afford.
  test_boundary:
    instances:
    - at least 20 curves from the declared panel, at least 5 generation seeds each
    - degrees D = 3 and D = 4 only
    parameters:
      n: as declared by the lane, held fixed within a variance cell
      m: as declared by the lane
      statistic: >-
        non-rewritable low-degree F5 signature count, and #G* against the
        generic m * d^{m-1}
    implementation: >-
      The lane's signature-tracked F5 instrumentation, unmodified, with the curve
      and the generation seed as the two varying factors.
    budget:
      wall_clock_seconds_per_run: 3600
      maximum_memory_gb: 24
      maximum_runs: 250
  falsification_conditions:
  - >-
    The between-curve sample variance at D = 3 is exactly zero. Design-infeasible;
    the statistic is constant by construction and nothing can be sized from it.
  - >-
    The planted between-curve offset is not recovered within a factor 2 at 1x, or
    is not separated from zero at 3x. The decomposition has no demonstrated
    dynamic range and no component it reports is admissible.
  - >-
    Within-curve variance dominates and the between-curve component's interval
    includes zero. The statistic is too noisy per curve for any between-curve
    comparison, and the lane must improve the statistic before proceeding.
  - >-
    The required curve count at D >= 6 exceeds what the lane can afford. The
    planned conclusion is currently unreachable and the lane must restate its
    target rather than run an under-powered study.
  - >-
    Between-curve variance at D = 4 exceeds D = 3 by more than a factor 3.
    HEUR-001 is falsified and low-degree sizing under-powers the D >= 6 study in
    the dangerous direction.
  interpretation_limits:
  - >-
    Sizes an experiment. Produces NO cascade verdict, no exponent, no attack and
    no cost model.
  - >-
    THIS RECORD DOES NOT BEAR ON H-SIG-001 IN EITHER DIRECTION. H-SIG-001 is
    supported_scoped under DEC-20260717-002. A variance component is not a test of
    its predictions, and no outcome here may be cited for or against it. The
    design deliberately measures dispersion, not the condition-versus-null
    contrast that H-SIG-001's predictions concern.
  - >-
    Scoped to the tested degrees, the declared curve panel and the lane's
    implementation. The degree extrapolation to D >= 6 is explicitly unjustified.
  - >-
    A sufficient-curve-count result is about POWER, not about what the experiment
    will find.
  - >-
    Curve-family bias understates between-curve variance - sampling from one
    family gives a smaller spread than a broader family would. The panel used is
    named and the limitation is not hidden behind the number.
  - >-
    The matched random-system arm is a curve-free object. If it reproduces the
    between-curve spread, the spread is a property of system shape rather than of
    the curve family, and nothing here may be quoted as a statement about
    elliptic curves.
  status: proposed
  proposed_by: coordinator
