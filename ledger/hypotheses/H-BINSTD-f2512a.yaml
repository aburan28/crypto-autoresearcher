  statement: >-
    C(131, 12) is 31725968343212000 and C(131, 13) is
    290414633295556000. The weight-12 pattern count
    C(131, 12)*2^12 is 129949566333796352000, at least 2^66 and
    strictly below 2^67, hence strictly below 2^{70.2}. The
    weight-13 pattern count C(131, 13)*2^13 is
    2379076675957194752000, strictly above 2^71 and strictly below
    2^72, hence strictly above 2^{70.2}. Weight 13 is the first
    positive integer at which the pattern count clears 2^71.
    C(131, 13) is strictly above 2^58 and strictly below 2^{58.1}.
    At l' = 130 the written exponent 131 - l'/2 is 66, and 660 is
    strictly above 608.
  mechanism: >-
    The proposal prices a tau-adic pattern count by a binomial.
    This contract checks that count. It does not enumerate scalars.
