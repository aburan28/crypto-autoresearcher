  statement: >-
    131 minus 1 is 130. 163 minus 1 is 162. The stable dimensions
    0, 1, 130, and 131 number 4 and sum to 262. The stable
    dimensions 0, 1, 162, and 163 number 4 and sum to 326. 326
    exceeds 262 by 64. 163 exceeds 131 by 32, and twice 32 is 64.
    The product of 131 and 163 is 21353. The list floor 10 exceeds
    the control floor 3 by 7, and their product is 30. The
    re-derive count 3 equals the control floor. 10 exceeds the run
    ceiling 8 by 2. The remainder after excluding the four stable
    dimensions is 0, and the written rate 1 exceeds that remainder
    by 1.
  mechanism: >-
    The proposal writes the integers 131 and 163, the rule n minus
    1, the stable set 0, 1, n minus 1, and n, the floors 10 and 3,
    the re-derive count 3, the run ceiling 8, and the rate 1. No
    further prime is named. This contract checks those integers.
    It does not build a factor base.
