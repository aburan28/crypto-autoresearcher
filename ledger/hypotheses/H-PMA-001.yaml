hypothesis:
  id: H-PMA-001
  question_id: RQ-PMA-001
  source_proposal: IDEA-20260726-012
  statement: >-
    Over F = k(t) with char k != 2, for prescribed reciprocal-minor data
    p_emptyset = 1 and p_S = (t+1)/(t+d_S) for every nonempty subset S of
    four indices, the divisor-parity obstruction predicate is an exact
    classifier of ordinary 4x4 principal-minor assignment on the tested
    small-instance grid: forming q_ij = p_i*p_j - p_ij,
    c_ijk = p_ijk - p_i*p_j*p_k + p_i*q_jk + p_j*q_ik + p_k*q_ij, and
    Delta_ijk = c_ijk^2 - 4*q_ij*q_jk*q_ki for the three anchored
    reconstruction triples, canonically reducing each Delta_ijk, and
    declaring OBSTRUCTED when any reduced Delta_ijk has odd valuation at a
    finite irreducible divisor or at infinity (or a nonsquare residual
    constant class in k*/k^{*2}), the predicate agrees with independent
    brute-force matrix existence on every tested instance over k = F_q
    (several small odd q) and k = Q, and the predicate is non-vacuous: at
    least one tested prescribed instance is genuinely obstructed by parity.
  mechanism: >-
    Ordinary PMA4 reconstruction turns the public reciprocal-minor data
    into three quadratic orientation equations. A matrix over k(t) can
    exist only if every required orientation root lies in k(t); in odd
    characteristic a nonzero rational function is a square only if every
    discrete valuation in its principal divisor, including the valuation at
    infinity, is even, and its residual constant class in k*/k^{*2} is also
    square. Canonically canceling each discriminant and exhibiting one
    surviving odd valuation therefore supplies a short rejection
    certificate without enumerating matrix branches or solving the full
    four-minor equation. The predicate is a public compatibility classifier
    returning OBSTRUCTED or NOT_OBSTRUCTED_BY_THIS_GATE; the underlying
    mechanism claims the obstruction direction only (an odd valuation is
    fatal to existence), while this hypothesis tests the stronger frozen
    exact-classifier reading on the toy grid, with the two disagreement
    directions recorded separately.
  assumptions:
    - The coefficient field is k(t) with char(k) != 2; characteristic 2 is refused or flagged by the predicate and is out of scope.
    - The prescribed d_S are public and represented exactly; no hidden source tuple, supplied matrix, or target-derived witness enters the symbolic parameters.
    - Each tested quadratic is genuinely nondegenerate -- the relevant q_ij, leading coefficients, and denominators are nonzero after canonical cancellation; degenerate cases (q_ij = 0, degree drop, zero discriminant) are branched and classified separately, never counted as obstructions.
    - Pole collisions d_S = d_T, cancellation at t = -1, repeated factors, and vanishing scale factors are recorded in an explicit exceptional locus and excluded from the agreement grid.
    - Divisor parity is supplemented by the residual constant square class over finite k.
    - Roots in a quadratic extension do not satisfy ordinary PMA4 over k(t).
  rerandomization: null
  asymptotic_claim: null
  predictions:
    - metric: predicate_bruteforce_agreement
      direction: higher
      minimum_effect: exactly 1.0 -- verdicts agree on 100% of the decided grid instances
    - metric: nonvacuous_obstruction_count
      direction: higher
      minimum_effect: ">= 1 tested instance OBSTRUCTED with an explicit, independently reverified odd-valuation witness and brute-force confirmation of non-existence"
    - metric: false_obstruction_count
      direction: lower
      minimum_effect: exactly 0 (no instance OBSTRUCTED by the predicate where a matrix exists)
    - metric: false_compatibility_count
      direction: lower
      minimum_effect: exactly 0 (no instance NOT_OBSTRUCTED_BY_THIS_GATE where no matrix exists)
    - metric: existence_witness_verification_failures
      direction: lower
      minimum_effect: exactly 0 (every EXISTS verdict carries a matrix whose 16 principal minors reverify by direct evaluation)
  test_boundary:
    instances:
      - "k = F_q for q in {3, 5, 7} and k = Q; per field a deterministic prescribed-instance grid (8 instances per finite field, 4 over Q) with d_S drawn from the frozen parameter box (distinct nonzero values != 1), plus per field >= 2 deterministically perturbed candidate-obstruction instances"
      - "one pre-declared grid-widening fallback per field if zero obstructions occur (widened parameter box, +8 instances), used at most once within budget"
      - degenerate and exceptional-locus instances are generated, branched, and counted separately; char-2 inputs (F_2, F_4) are fed only to the refusal control
    parameters:
      anchored_triples: "anchor index 1: (1,2,3), (1,2,4), (1,3,4)"
      grid_instance_cap: 60
      grobner_crosscheck_subsample: ">= 4 instances (2 obstructed, 2 not) where feasible"
    implementation: >-
      Two independent modules under experiments/EXP-PMA-001/: (A) the
      divisor-parity obstruction predicate (canonical gcd cancellation,
      squarefree divisor certificate including infinity, residual constant
      class); (B) an independent constructive existence decider that
      branches over all orientation roots, assembles candidate matrices,
      and emits witness matrices, with every EXISTS witness reverified by
      direct evaluation of all 16 principal minors. A groebner consistency
      cross-check over k(t) is run on the pre-declared subsample as a third
      check; tool and version recorded.
    budget:
      wall_clock_seconds_per_run: 1800
      total_wall_clock_seconds: 6300
      total_cpu_hours: 1.75
  falsification_conditions:
    - >-
      Direction 1 (soundness, fatal to the mechanism): the predicate
      declares OBSTRUCTED on an instance where the independent decider
      exhibits a valid matrix (witness reverified 16/16). One such instance
      falsifies the obstruction claim.
    - >-
      Direction 2 (exact-classifier failure): the predicate declares
      NOT_OBSTRUCTED_BY_THIS_GATE on an instance where no matrix exists.
      One such instance falsifies H-PMA-001 as frozen (exact classifier on
      the grid); per IDEA-20260726-012's stated semantics it does NOT
      refute the one-directional obstruction mechanism, and the record must
      say so.
    - >-
      The full grid, including the single widening fallback, yields zero
      non-vacuous obstructions: the predicate is vacuous on the tested
      scope and the non-vacuity prediction fails.
    - >-
      The predicate fails to refuse or flag char-2 inputs, or counts a
      degenerate-locus instance (q_ij = 0, degree drop, zero discriminant)
      as an obstruction: a discriminator-validity failure.
  interpretation_limits:
    - Toy-scale validation of a mechanism predicate; no generic-family, all-size PMA, or asymptotic theorem is established or refuted here (AGENTS.md rules 6 and 7).
    - The obstruction certificate is one-directional by design: even parity plus a square residual constant class is necessary, not sufficient; shared orientation consistency, every size-at-most-three minor, and the mask-15 four-minor gate remain independent requirements. NOT_OBSTRUCTED_BY_THIS_GATE is never a compatibility claim outside the frozen grid agreement test.
    - Scope excludes characteristic 2 (a separate Artin-Schreier / linearized-quadratic problem), bordered, block, augmented, shifted, algebra-valued, and extension-field representations, and any higher-genus or general-PMA claim.
    - The mechanism returns no occurrence-labelled source, factor-base log, target descent, or scalar: no rho/BSGS advantage, no Shoup-relevant content; candidate_count 0 per the proposal.
    - The F_211 fixture controls proposed in IDEA-20260726-012 depend on records (EV-ECDLP-023, TASK-20260726-756) that do not exist in this repository; they are not pinned in this design and the omission is reported at intake.
  status: superseded
  status_note: >-
    Moved to `superseded` by DEC-20260907-90a00d (`refine`) on independent
    Validator (VAL-20260907-ae3832, verdict passed) and Red Team
    (RT-20260907-0df70c) review of EXP-PMA-001's four-run package, composed
    in EV-PMA-fbdd4c. This statement, as literally frozen (the bidirectional
    exact-classifier reading: the predicate agrees with independent
    brute-force matrix existence on every tested instance), is FALSIFIED --
    reject_scoped-strength evidence, both a derivation-note-tier refutation
    artifact (an unconstrained Groebner basis over the algebraic closure of
    F_5(t) returning the trivial ideal, RT-20260907-0df70c's
    method_4_groebner_no_normalization) and independently replicated
    empirical evidence (Validator's full from-scratch recomputation plus a
    second, algorithmically distinct Red Team method) -- on the narrow,
    forced repeated-value F_5(t) table family this record's own frozen grid
    construction could produce (5 distinct instances, all of them; see
    `interpretation_note` below and CORR-20260907-ae8418's box-collision
    disclosure). It is NOT falsified anywhere else in the tested grid (F_3,
    F_7, Q all showed no such disagreement in this run), and this
    falsification does not extend to any non-repeating F_5(t) table or any
    other field, which remain untested.

    This record's own `mechanism` field already distinguished the
    bidirectional reading tested here from a narrower one-directional
    reading ("the underlying mechanism claims the obstruction direction
    only: an odd valuation is fatal to existence"), and that narrower
    reading is UNREFUTED: zero counterexamples across every decided
    instance (52 labeled / 14 distinct), non-vacuously confirmed on 8
    distinct instances (F_7:3, Q:5). `status: superseded` reflects that
    H-PMA-001 as a single frozen bidirectional statement does not survive,
    while the surviving narrower claim is carried forward as a distinct,
    separately trackable result rather than discarded with it -- see
    `interpretation_note`. Sample-size correction: CORR-20260907-ae8418
    (labeled 34/52/18/16 vs. distinct 9/14/5/8; both bases must be cited
    together per its immutability_note). Dirty-code-clause reconciliation:
    CORR-20260907-f41219 (run package not invalidated). Full statistics and
    reasoning: EV-PMA-fbdd4c, experiments/EXP-PMA-001/analysis.md's
    Coordinator addendum (2026-09-07).
  interpretation_note: >-
    Successor-hypothesis pointer, recorded per DEC-20260907-90a00d's
    `refine` decision rather than as a new hypothesis record (not minted in
    this decision; see its `next_actions`). The claim worth carrying
    forward is narrower than this record's `statement`: "over F_q(t) for
    small odd q and Q, an odd valuation (or nonsquare residual constant
    class) in a canonically reduced anchor discriminant Delta_ijk is fatal
    to ordinary 4x4 matrix existence" -- i.e. this record's own `mechanism`
    paragraph's one-directional reading, stripped of the bidirectional
    exact-classifier claim this record's `statement` field asserts and
    which is now superseded. A future design task should mint a dedicated
    H-* record for that narrower claim before further symbolic-derivation
    work treats it as load-bearing, and should incorporate the recommended
    F_11/F_13 or non-repeating-table follow-up (CORR-20260907-ae8418
    next_action) to test whether the sufficiency failure documented here is
    F_5-specific or general to the repeated-value table family at any
    field. See KN-FIND-c2e9a7 for the promoted, scoped negative finding.
  proposed_by: coordinator
