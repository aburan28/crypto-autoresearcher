  statement: >-
    CEILING FIRST: constant factor at most. No exponent moves, and parallel
    Pollard rho dominates this whole setting (IDEA-20260923-5d0b8e dominated_by).
    This is a scoped measurement of how stable one solver's trace is on one
    family. It makes no ECDLP cost claim.

    Setting. Regime A: the m = 2 relation attempt S_3(x_1, x_2, x_R) = 0 on a
    random ordinary binary curve Y^2 + XY = X^3 + AX^2 + B over F_{2^17}. The
    factor base is V = {x : deg x < 9} (l = 9) in the polynomial basis, the
    system is Weil-descended to 17 quadratic Boolean equations in 18 variables,
    and it is multilinearized by the field equations. The solver is the fixed-
    shape degree-D Macaulay (XL-type) matrix, D in {3, 4}, under the declared
    row order and degrevlex column order with the constant column LAST. It is
    reduced by one declared deterministic elimination (column-major, lowest
    unused row index with a nonzero entry).

    Claim, in three parts.
    (C1, exact; Proposition S of the idea.) A satisfiable attempt never has 1 in
    its degree-D row space R_D. So wherever an unsatisfiable reference has 1 in
    R_{D*}, no satisfiable attempt matches that reference's T_set at D*. In
    regime A the rank deficit cols_D - rank_D is also at least the rank of the
    evaluation matrix of the degree-<=D multilinear monomials on the attempt's
    s Boolean solutions. This is a theorem. Here it serves as an instrument
    check, not as a hypothesis under test.
    (C2, the hypothesis under test; heuristic HEUR-CERTBIN-TS1.) Every Macaulay
    entry is F_2-affine in the 17 target bits r = coords(x_R). A learned
    reference trace is therefore unstable under re-targeting: T_strict
    retention on the unsatisfiable arm is about 2^{-K}, where K counts the
    r-dependent pivots. Explanation E1 (generic F_2 coefficient degeneracy)
    predicts retention <= 0.01 at D = 4, per-pivot hazards in [0.4, 0.6], and
    no advantage over a same-support random affine family. Explanation E2
    (structural stability from the target-independent block) predicts
    retention >= 0.5 and at least 10x the affine null.
    (C3, consequence.) If E1 holds at this cell, the P-GPU premise ("learn the
    trace once, replay it branch-free, and degenerate pivots are rare") is
    falsified for STRICT replay in regime A at this cell. Any regime-A GPU
    design is then a trace-free masked elimination, whose gain over a CPU is
    ordinary SIMD throughput and at most the measured saving ratio.

  mechanism: >-
    The trace is a lossy projection of the eliminated matrix. It keeps the pivot
    pattern and discards every numerical entry. It is measured at four nested
    granularities:
    - T_rank: the rank at each D.
    - T_set: the canonical pivot-column set plus the zero-reduction row set Z.
    - T_strict: the exact (pivot row, pivot column) sequence of the declared
      deterministic elimination.
    - T_ops: T_strict plus the set of rows XORed at each step. This is exactly
      what a fixed-schedule branch-free replay needs in order to be valid.
    Each is finer than the next: T_ops equal implies T_strict equal, which
    implies T_set equal, which implies T_rank equal.

    The operation is re-targeting: x_R is replaced by the x-coordinate of a
    fresh subgroup point, while V, the curve, D and both orders stay fixed. The
    descended coefficients are F_2-affine in r because x_R enters S_3 only as
    x_R^2 and x_R, both F_2-linear in r. So M_D(r) = M_0 + sum_j r_j M_j for
    fixed matrices. Under a fixed-schedule replay of a reference's row
    operations (a fixed linear map L_<k before step k), each replayed pivot
    entry e_k(r) = (L_<k M_D(r))[p_k, c_k] is exactly affine in r. Consequences:
    - A nonconstant e_k vanishes on exactly half of F_2^17.
    - The replay-pivot survival set is an affine subspace of r-space.
    - For uniform r, fixed-schedule pivot retention equals 2^{-K_rank}, or 0
      when the conditions are inconsistent. K_rank is the F_2-rank of the
      linear parts of the nonconstant pivot forms, so K_rank <= 17.
    H1's "about 2^{-K} with near-independent pivots" is the statement that
    K_rank tracks K and that curve x-coordinates behave like uniform r on these
    affine conditions. Both are measured.

    The discriminating controls:
    - the same-support random affine family, which keeps "one family indexed by
      r" and removes S_3's algebra;
    - the same-support random F_2 family, a generic-coefficient null redrawn
      per target;
    - the random-x targets, uniform in F_{2^17}, which remove curve membership.

  assumptions:
    - >-
      Factor base V = span_F2{1, t, ..., t^8} in F_{2^17} = F_2[t]/(t^17 + t^3 + 1).
      The executor verifies the modulus is irreducible before any draw. The
      random-V replicate and the Koblitz form belong to later stages and are
      not in this boundary.
    - >-
      One random ordinary curve over F_{2^17}, with #E = h*q, h in {2, 4} and q
      prime, drawn from a declared seed. A single curve is a declared limitation
      of this cell and not a transfer claim.
    - >-
      Satisfiability means ALGEBRAIC satisfiability of the descended Boolean
      system: s >= 1 common zeros in F_2^18, i.e. ordered pairs (x_1, x_2) in V^2
      with S_3(x_1, x_2, x_R) = 0. That is the ideal-theoretic object Proposition
      S concerns. Whether a solution lifts to a rational relation +-P_1 +- P_2 =
      +-R is recorded as a separate flag and is not the stratification variable.
    - >-
      The engine is an in-repo pure-Python/numpy bit-packed GF(2) elimination,
      written for this contract under experiments/EXP-CERTBIN-4e92d7/impl/. It
      runs on fixed-shape matrices. src/macaulay_export.py's dynamic column set
      is NOT reused, because fixed shape is load-bearing for trace comparison.
      No Magma, PolyBoRi or GPU is used.
    - >-
      Joux-Vitse's F4' pair-list replay (KN-LIT-673219) is the only source-verified
      trace-reuse anchor, measured over F_{p^5} with large p. Results here concern
      the Macaulay/XL trace only and do not transfer to F4 pair-list replay
      without measurement.

  proof_search_map:
    bottleneck: >-
      P-GPU's premise that degenerate pivots are rare, i.e. the retention of a
      learned trace under re-targeting at this cell.
    baseline_embedding:
      parameter_slice: >-
        The dense full-Macaulay shape the idea derived in advance is reproduced
        exactly as a fixture: n = 17, N = 18, D = 3 gives 323 x 988, and D = 4
        gives 2924 x 4048. The large-base-field "stable trace" corner (regime B)
        is Stage 2 and is NOT reproduced in this boundary. That makes a regime-A
        instability reading at this cell conditional on the instrument checks
        below, rather than on a stable-corner reproduction. This is disclosed as
        a limitation.
      reproduction_check: >-
        (i) The fixture dimensions match exactly.
        (ii) Determinism: every S_3-family target re-eliminated in a separate
        process reproduces T_ops exactly, 1000 of 1000.
        (iii) Oracle A (O(2^l) root-finding over V) and oracle B (exhaustive
        2^18 enumeration of the descended system) agree on s for every S_3,
        random-x and planted instance.
        (iv) The affine identity E(r) = E^0 + sum_j r_j E^j holds for every
        instance.
        (v) On the random-x family, fixed-schedule pivot retention matches
        2^{-K_rank} within its 99.9% binomial interval.
    observation_collision:
      observable: The trace at each of the four granularities.
      distinct_preimage_search: >-
        Built in. The design reports trace-class sizes, the modal class and its
        composition by arm, the distinct-trace count and the plug-in entropy
        H(T) over the 1000 targets. Targets are sampled WITHOUT replacement in
        x_R, so that duplicate targets cannot manufacture collisions.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: The modal trace class per granularity and its arm composition.
        predicted_gain: The best-case replay coverage; decides E1 against E2.
      - transform: specialization_pack
        proposed_object: >-
          The split of reference pivots into r-independent ones (constant e_k)
          and r-dependent ones, with K, K_exact and K_rank.
        predicted_gain: >-
          A bound on the hybrid replay's saving over trace-free masked
          elimination. A constant.
    quantifier_order: >-
      Proposition S: FORALL unsatisfiable references r_0 with 1 in R_{D*}(r_0),
      FORALL satisfiable r: T_set(r) != T_set(r_0) at D*. Exact.

      Empirical claim, at THIS cell only (regime A, n = 17, m = 2, l = 9,
      D in {3, 4}, this curve, this V, these orders, this elimination):
      EXISTS a reference, among the 3 unsatisfiable ones and the modal one, with
      unsatisfiable-arm T_strict retention >= 0.5 (P-GPU survives here); or
      FORALL of them retention < 0.5 (strict P-GPU fails here). References are
      drawn before any test target, from a disjoint seed stream.
    method_ceiling:
      strongest_certifiable_claim: >-
        At this cell, with the named orders and elimination: retention per
        granularity and arm, hazard per reference pivot, K, K_rank, H(T), the
        first-divergence distribution, the saving ratio, and full and pruned
        matrix sizes. Nothing about GPU speed, n != 17, m = 3, regime B,
        F4 pair-list traces or any other curve.
      nearby_object_control: >-
        Proves-too-much: the same-support random affine family (3 independent
        draws) and the same-support random F_2 family. If they retain as well
        as S_3, "structure" explains nothing. Random-x: if retention is
        unchanged, curve membership is irrelevant to the trace.
    proof_obligations:
      - claim: Proposition S, and the regime-A rank-deficit bound from the s solutions.
        responsibility: correctness
      - claim: The regime-A Macaulay entries are F_2-affine in r, so replayed pivot entries are exactly affine.
        responsibility: correctness
      - claim: The nesting T_ops => T_strict => T_set => T_rank for the declared deterministic elimination.
        responsibility: correctness
      - claim: The fixture dimensions 323 x 988 (D = 3) and 2924 x 4048 (D = 4).
        responsibility: size
      - claim: >-
          The saving ratio, as defined in the contract, bounds any trace-based
          per-attempt constant over fixed-shape masked elimination at this cell.
        responsibility: runtime
    not_applicable_reason: >-
      This is a measurement hypothesis. The map is filled because Proposition S
      and the affine structure are small exact results the design leans on as
      instrument checks.

