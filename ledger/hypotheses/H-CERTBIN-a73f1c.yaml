  predictions:
    - id: P1
      metric: >-
        T_strict retention on the unsatisfiable arm against an unsatisfiable
        reference, S_3 family, n = 17, m = 2, l = 9, D = 4
      direction: lower
      minimum_effect: >-
        E1: <= 0.01. E2: >= 0.5. Values in between are reported as they fall,
        and the null gap (P6) decides the reading.
    - id: P2
      metric: >-
        Per-pivot hazard on r-dependent pivots (fixed-schedule replay: the
        fraction of targets whose replayed pivot entry is 0, given no earlier
        pivot divergence)
      direction: different
      minimum_effect: >-
        H1: within [0.4, 0.6] on at least 90% of r-dependent pivots with at
        least 200 surviving targets. A median hazard below 0.2 falsifies H1.
    - id: P3
      metric: K / total pivots (the fraction of r-dependent pivots), per cell
      direction: different
      minimum_effect: >-
        No directional prediction. E2 needs 2^{-K} >= 0.5, i.e. K <= 1 per trace.
    - id: P4
      metric: >-
        T_set match of satisfiable instances against an unsatisfiable
        reference's T_set at a D where that reference has 1 in R_D
      direction: lower
      minimum_effect: >-
        Exactly 0 (Proposition S). Any match is an instrument bug. This is
        vacuous at a D where no unsatisfiable reference has 1 in R_D; that is
        recorded as such.
    - id: P5
      metric: Normalised first-divergence position f_div in [0, 1], satisfiable arm vs unsatisfiable arm
      direction: different
      minimum_effect: >-
        Under E1: both arms diverge early, with median f_div <= 0.1 and no arm
        difference.
    - id: P6
      metric: Retention ratio, S_3 family vs same-support random affine family
      direction: different
      minimum_effect: E2 needs >= 10x. E1 predicts within [0.5, 2].
    - id: P7
      metric: Trace entropy H(T) in bits, and distinct-trace count, over N = 1000 targets, per granularity
      direction: different
      minimum_effect: >-
        P-GPU needs H(T_strict) <= h(P_sat) + 0.1 bit. E1 predicts
        H(T_strict) >= log2(1000) - 1 = 8.97 bits.
    - id: P8
      metric: Saving ratio ops(fixed-shape masked full elimination) / ops(trace replay), per D and granularity
      direction: higher
      minimum_effect: >-
        Predicted <= 10 (a constant). A ratio below 1.5 closes the trace idea as
        not worth a GPU port at this cell, independent of stability.
    - id: P9
      metric: Pruned per-D matrix dimensions and nnz (rows x cols, bit-packed dense bytes, sparse bytes)
      direction: lower
      minimum_effect: >-
        "Thousands of systems per warp" needs at most 32 B per system. "One
        system per SM" needs at most 228 KB. Predicted: no D = 4 matrix meets
        either in dense full form (1.41 MiB). The pruned sizes are unmeasured,
        so either outcome is possible.
