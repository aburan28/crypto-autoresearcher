  falsification_conditions:
    - >-
      Strict P-GPU is FALSIFIED at this cell if T_strict retention on the
      unsatisfiable arm is < 0.5 for every unsatisfiable reference and for the
      modal trace, at D = 4.
    - >-
      E1 is FALSIFIED at this cell if that retention is >= 0.5 for some such
      reference, or if the median hazard on r-dependent pivots with >= 200
      survivors is < 0.2, or if the S_3 family out-retains the same-support
      affine null by >= 10x (where estimable, per the contract's ratio rule).
    - >-
      A satisfiable instance with 1 in R_D at any D, or matching an
      unsatisfiable reference's T_set at a D where that reference has 1 in R_D,
      falsifies the INSTRUMENT, and the run is void. It is not evidence about
      the hypothesis.
    - >-
      The sizing premise "one system per SM" survives at this cell if the
      pruned D = 4 matrix fits in 228 KB. "Thousands per warp" fails if it
      exceeds 32 B per system.

  interpretation_limits:
    - >-
      CLAIM TIER: toy. This is a scoped measurement of the trace stability of
      THIS solver (the declared fixed-shape Macaulay elimination) on THIS family
      (m = 2 direct S_3 descent, n = 17, l = 9, one curve, polynomial-basis V,
      D in {3, 4}). It is never an ECDLP cost claim, and it asserts nothing
      about the security of any curve.
    - >-
      sota_delta: zero on every ECDLP cost axis. dominated_by: parallel Pollard
      rho with the negation map (and Frobenius on Koblitz curves). This holds at
      every Certicom binary size (about 2^{60.9} at ECC2K-130, from KN-LIT-096
      via IDEA-20260922-37e02e) and at n = 17 itself. No per-attempt Pareto
      claim is made against FES GPU exhaustive search (KN-LIT-287) or WDSat,
      which are not compared.
    - >-
      A negative result closes STRICT (and fixed-schedule) trace replay for
      regime A at this cell only. It does not close T_set-level masked replay
      if that survives, fixed-shape trace-free masked batching, SAT/exhaustive-
      search GPU engines, F4 pair-list replay, other n, m = 3 or regime B.
    - >-
      KN-OPEN-020 class: the factor base is an F_2-linear subspace. This record
      does not escape that class and does not try to.
    - >-
      No GPU is run. Python/numpy wall time is not GPU cost. Only op counts,
      sizes and stability are meant to transfer, and even those only as
      measured at this cell.

