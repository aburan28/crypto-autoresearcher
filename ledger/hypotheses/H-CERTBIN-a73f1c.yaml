  heuristic_assumptions:
    - id: HEUR-CERTBIN-TS1
      source_label: H1 of IDEA-20260923-5d0b8e
      formal_statement: >-
        (Balanced pivot degeneracy over F_2.) Take the S_3 family at this cell,
        with r = coords(x(R)) for R uniform in the prime-order subgroup (sampled
        without replacement in x_R). Fix a reference and its fixed-schedule
        replay. For every reference pivot k whose replayed entry e_k(r) is
        nonconstant over the sampled targets:
          Pr_r[e_k(r) = 0 | e_j(r) = 1 for all j < k] lies in [0.4, 0.6].
        The divergence events at distinct r-dependent pivots are close to
        independent, so strict retention is about 2^{-K}.
      random_model_justification: >-
        e_k is exactly F_2-affine in r (derived in mechanism). A nonconstant
        affine form is balanced on F_2^17. The heuristic content is twofold:
        first, that curve x-coordinates of subgroup points are distributed like
        uniform r on these affine conditions; second, that the linear parts of
        successive r-dependent pivots are mostly independent (K_rank close to K
        over the early pivots).
      supporting_results:
        - >-
          Derived here: the affinity of M_D(r) in r and of e_k under a fixed
          linear replay. This is an exact derivation (see mechanism) and is
          checked per instance by the affine identity.
        - >-
          A nonconstant affine Boolean function on F_2^N has exactly 2^{N-1}
          zeros. This is elementary linear algebra.
      validation_experiment_ids:
        - EXP-CERTBIN-4e92d7
      falsification_condition: >-
        The median hazard over r-dependent pivots with at least 200 surviving
        targets is below 0.2 (falsifies H1, per the idea). H1 is supported at
        this cell if at least 90% of those pivots have hazard in [0.4, 0.6].
    - id: HEUR-CERTBIN-TS4
      source_label: H4 of IDEA-20260923-5d0b8e (read only, partially)
      formal_statement: >-
        Within a cell, the degree D* at which the unsatisfiable arm first has 1
        in R_D is the same for at least 95% of instances.
      random_model_justification: >-
        Imitates the concentration of the degree of regularity of semi-regular
        systems of fixed shape. No rigorous support.
      supporting_results: []
      validation_experiment_ids:
        - EXP-CERTBIN-4e92d7
      validation_scope_note: >-
        This cell observes only whether D* <= 4. An instance with D* > 4 is
        recorded as "not reached at D <= 4", which is a scope limit and not a
        value. The full test belongs to later stages.
      falsification_condition: >-
        Two or more distinct D* values in {3, 4}, each held by more than 5% of
        the non-degenerate unsatisfiable arm.
    - id: HEUR-CERTBIN-TS3
      source_label: H3 of IDEA-20260923-5d0b8e (transfer in n)
      formal_statement: >-
        Along l = (n+1)/2 with m = 2, K(n) is nondecreasing and the hazard
        distribution does not drift with n.
      random_model_justification: Imitates scale-freeness of generic-coefficient statistics. No rigorous support.
      supporting_results: []
      validation_experiment_ids: []
      validation_scope_note: >-
        NOT tested here. It needs the Stage 3 ladder (n in {19, 23, 29, 31}),
        which has no contract. Any statement beyond n = 17 made from this
        hypothesis's evidence rides on this unvalidated heuristic and must be
        labelled extrapolation.
      falsification_condition: A decrease of K with n, or a median hazard drifting outside [0.4, 0.6], along the ladder.
  heuristic_assumptions_note: >-
    The idea's H2 (the large-field Schwartz-Zippel stability bound) concerns
    regime B only. It is out of this hypothesis's boundary and belongs to the
    Stage 2 contract.

