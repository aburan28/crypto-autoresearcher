# =============================================================================
# H-SEMBIN-558848 -- In-regime coset-typed Semaev solver-degree conservation
# test (IDEA-20260918-c05e71). Under RQ-SEMBIN-9fa4ba / GOAL-SEMBIN-cbf422.
# Approved DEC-20261002-5c465c.
#
# Successor to EXP-SEMBIN-92724f / EV-SEMBIN-4614e7: those cells were outside
# HEUR-YT's regime and measured no Groebner/F4 solving degree. This hypothesis
# moves into the declared in-regime ladder and charges actual solver work
# beside yield. ZERO RUNS in this design packet. No Magma/Sage/AUXIN/Bedrock
# as success path. Claim tier: measurement. No curve attack. No exponent.
# =============================================================================
hypothesis:
  id: H-SEMBIN-558848
  question_id: RQ-SEMBIN-9fa4ba
  source_idea: IDEA-20260918-c05e71
  related_idea_ids:
    - IDEA-20260913-c94e52
  predecessor_hypothesis_id: H-SEMBIN-c59e50
  predecessor_experiment_id: EXP-SEMBIN-92724f
  predecessor_evidence_id: EV-SEMBIN-4614e7
  experiment_id: EXP-SEMBIN-d830d5
  goal_id: GOAL-SEMBIN-cbf422
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-5c465c
  status: approved
  proposed_by: coordinator
  title: >-
    In HEUR-YT's declared regime, additive coset typing reaches ≥0.9 of the
    exact finite-k image cap on ≥2/3 ladder cells AND reduces complete cost
    per verified independent relation by ≥20% vs matched untyped Semaev at
    three increasing sizes with no rank loss; else the combinatorial gain is
    exchanged into solver degree / Macaulay growth

  statement: >-
    CLAIM (measurement / toy; SUCCESSOR to EXP-SEMBIN-92724f; NO ATTACK;
    NO EXPONENT). Setting: generated binary curves only; typed bases
    F_i = {P : x(P) ∈ V+v_i} vs a single symmetric base F = {P : x(P) ∈ V};
    Semaev chained Boolean presentation with explicit slots; same curve,
    targets, subspace dimension k, solver backends, and independent
    group-law verifier on every arm. (C1) IN-REGIME IMAGE. On the
    preregistered ladder cells satisfying mk ≤ n−3 and 2^k ≫ m² (candidate
    seed cells (n,k,m) ∈ {(24,6,3),(30,7,3),(36,8,4)}, subject to Stage-0
    feasibility), the median typed image_over_finite_k_cap is ≥ 0.9 in at
    least two of three cells. Score against the exact finite-k counting
    cap from EXP-SEMBIN-92724f, never asymptotic m! except as its large-k
    limit. (C2) COST CONSERVATION. Complete end-to-end cost per verified
    independent relation (setup + search + solver + extraction +
    verification + rank + final sparse LA) is ≥20% lower on the typed arm
    than on the matched untyped arm at three increasing feasible sizes,
    with independent_relation_rank not lower on typed. (C3) EXCHANGE
    READING. If (C1) holds and (C2) fails because maximum_solver_degree or
    maximum_macaulay_matrix_dimension growth erases ≥90% of the
    combinatorial gain at every size, report O-EXCHANGED (gain paid back
    by the solver) — a scientific negative of conservation, not an
    artifact. (C4) CONTROLS. Degenerate typing reproduces the untyped
    relation set; equal-cardinality randomized typed-null separates typing
    from special coset geometry; fresh held-out targets forbid
    target-conditioned coset selection. CLAIM TIER: measurement. No FIPS
    verdict. No deployed-curve solve. Missing solver backend →
    O-IMPEDIMENT for that arm, never evidence against C1–C3.

  mechanism: >-
    OBJECT FRAME. Representation R1: Boolean coordinates of the
    Weil-descended chained Semaev system with typed abscissa slots.
    Tracked object: the pair (verified independent relation yield,
    charged solver work) under typing. Sigma = {translation by
    factor-base elements within each typed class, slot permutation
    disabled by typing, solver ring action for degree/Macaulay metrics}.
    Trichotomy: Class I partial-action on the relation domain (typing
    removes the S_m quotient). LOSSY-PROJECTION TEST: the map from the
    full permutation-identified relation domain to typed slots is
    Sigma-compatible and genuinely lossy relative to the untyped
    presentation; whether that loss buys net cost is the measurement.
    WHAT IS NEW: not the typed bases (Nagao / Galbraith–Gebregiyorgis /
    EXP-SEMBIN-92724f) but the in-regime joint measurement of image-over-
    cap and actual solver degree/matrix/time/memory that EV-SEMBIN-4614e7
    named as missing.

  assumptions:
    - >-
      Generated/public benchmark curves only; no production keys or hidden
      private scalars.
    - >-
      Typed, untyped, degenerate-typed, and randomized typed-null arms use
      the same curve, targets, subspace dimension, solver backends, and
      verifier.
    - >-
      Score yield against the exact finite-k counting cap from
      EXP-SEMBIN-92724f / EV-SEMBIN-4614e7, not m! except as large-k limit.
    - >-
      Full cost includes setup, relation search, solver work, extraction,
      verification, rank, and final sparse linear algebra — consistently
      charged across arms.
    - >-
      Primary solver-degree instrument: msolve F4 step-degree trace when
      available (experiments/EXP-SEMBIN-7e1371/code/f4_trace.py convention),
      else pure-Python GF(2) Macaulay / degree-capped closure metrics from
      src/crypto_autoresearcher/gf2/ and related SEMBIN builders. Optional
      second backend: SAT/XOR (WDSat) when both consume the same descended
      predicate. Missing backend → O-IMPEDIMENT for that arm only.
    - >-
      Timeouts, crashes, OOM, and missing backends are infrastructure /
      O-IMPEDIMENT, never negative mathematical evidence (AGENTS.md rule 5).
    - Amazon Bedrock is prohibited. No AUXIN provisioning as success path.
    - Magma/Sage are NOT the success path.

  heuristics:
    - id: HEUR-YT
      statement: >-
        In the large-k, low-saturation regime (2^k ≫ m² and mk ≤ n−3), the
        typed factor-base image size approaches the exact finite-k counting
        cap (large-k limit m!), so combinatorial yield gain is available
        before solver work is charged.
      rigorous_support: >-
        Exact finite-k counting identity established under EXP-SEMBIN-92724f
        / EV-SEMBIN-4614e7 (outside regime). HEUR-YT is the regime clause
        that those cells did not satisfy; this contract tests it inside
        regime.
      falsification_condition: >-
        Median typed image_over_finite_k_cap < 0.9 on at least two of three
        in-regime cells (C1 fails) after controls pass.
      validation_plan: >-
        SAMPLE fresh matched targets on the Stage-0 feasible ladder.
        COMPARE typed image to exact finite-k cap. TAIL: per-cell minima.
        TRANSFER: none beyond the declared ladder; asymptotic ECDLP not
        claimed.
    - id: HEUR-CONSERVE
      statement: >-
        When HEUR-YT holds, the combinatorial gain survives as ≥20% lower
        complete cost per verified independent relation vs matched untyped
        Semaev at three increasing sizes, without independent-rank loss.
      rigorous_support: >-
        Leading-degree affine-invariance argument (typing is a coordinate
        change of explicit slots) predicts no leading-degree increase;
        lower terms, fibre geometry, and elimination order can still move
        real solver trajectories — that residual is the heuristic.
      falsification_condition: >-
        (C2) fails with controls passing; if ≥90% of the combinatorial gain
        is erased by degree/matrix growth at every size, record O-EXCHANGED.
      validation_plan: >-
        Charge identical cost model on all arms; report
        total_cost_per_verified_independent_relation with rank, degree,
        Macaulay dimension, wall time, and peak RSS beside each figure.

  heuristic_note: >-
    Disjoint/coset-typed bases are prior art (KN-LIT-ebd657; GG-2014-806;
    Nagao). EXP-SEMBIN-92724f localised the m! term without a solver. The
    open quantity is whether the symmetry saving is paid back by the actual
    solver inside HEUR-YT's regime.

  predictions:
    - metric: finite_k_image_over_cap
      direction: higher
      minimum_effect: >-
        Median typed image reaches ≥0.9 of the exact finite-k cap in at
        least two of three in-regime cells (C1).
    - metric: total_cost_per_verified_independent_relation
      direction: lower
      minimum_effect: >-
        ≥20% lower complete cost than matched untyped Semaev at three
        increasing feasible sizes with no independent-rank loss (C2).
    - metric: maximum_solver_degree
      direction: same_or_report
      minimum_effect: >-
        Reported per arm; leading-degree increase vs untyped is not
        predicted; growth that erases ≥90% of combinatorial gain →
        O-EXCHANGED.
    - metric: degenerate_typing_agreement
      direction: exact
      minimum_effect: >-
        Degenerate typing reproduces the untyped accepted relation set
        (control); disagreement → O-ARTIFACT.
    - metric: certificate_pass_rate
      direction: exact
      minimum_effect: >-
        Every accepted relation verifies under independent group-law
        check; any failure voids the cell before cost reading.

  test_boundary: >-
    Toy/medium generated binary curves on the Stage-0 feasible subset of
    {(24,6,3),(30,7,3),(36,8,4)} (or Coordinator-approved replacements that
    still satisfy mk≤n−3 and 2^k≫m²). One primary Groebner/F4-trace or
    pure-Python Macaulay instrument; optional SAT/XOR second backend.
    Nothing transfers to deployed FIPS curves, asymptotic ECDLP exponents,
    or revival of falsified frozen predictions of EXP-SEMBIN-92724f.
    Stage 0 is backend/feasibility freeze (may be zero scientific cells).
    Stages 1–2 are measurement.

  falsification_conditions:
    - >-
      Typed yield fails to approach the exact finite-k cap in the declared
      in-regime cells (C1 fails with controls passing).
    - >-
      Solver degree or Macaulay growth erases ≥90% of the combinatorial
      gain at every size (O-EXCHANGED; conservation falsified).
    - >-
      Any apparent speedup disappears on held-out targets or after
      independent-relation-rank accounting.
    - >-
      The typed arm requires target-conditioned basis selection or
      uncharged preprocessing.
    - >-
      Degenerate typing fails to reproduce the untyped relation set, or any
      accepted relation fails group-law verification (O-ARTIFACT).
    - Claiming any ECDLP speedup, exponent move, or FIPS verdict under this card.
    - Treating infra timeout/crash/missing-backend as negative evidence against C1–C3.

  distinguishable_outcomes:
    - id: O-CONSERVED
      label: symmetry_gain_conserved
      when: >-
        C1 and C2 hold; controls pass; certificates verify; RESULTS names
        O-CONSERVED with cited artifacts.
    - id: O-EXCHANGED
      label: gain_paid_back_by_solver
      when: >-
        C1 holds; C2 fails because degree/matrix growth erases ≥90% of the
        combinatorial gain at every size; controls pass.
    - id: O-NO-YIELD
      label: in_regime_image_miss
      when: >-
        C1 fails (typed image stays below 0.9 of cap on ≥2/3 cells) with
        controls passing.
    - id: O-ARTIFACT
      label: instrument_or_control_defect
      when: >-
        Degenerate-typing mismatch; verifier failure; held-out disappearance
        of an apparent gain; unequal point-set cardinalities after filtering
        not disclosed; or target-conditioned basis selection detected.
    - id: O-IMPEDIMENT
      label: infrastructure_stop
      when: >-
        Missing msolve/WDSat/backend, timeout, OOM, or budget abort with
        measured quantity recorded. Never negative mathematical evidence.

  proof_search_map:
    bottleneck: >-
      Whether the factorial-sized combinatorial gain of coset typing is
      conserved as lower complete cost per verified independent relation,
      or is exchanged into solving degree / Macaulay growth, inside
      HEUR-YT's declared regime (missing measurement per EV-SEMBIN-4614e7).
    baseline_embedding:
      parameter_slice: >-
        Untyped Semaev chain on the same (n,k,m,V,targets) plus EXP-SEMBIN-92724f
        builder/counting identities (finite-k cap) as the scoring baseline.
      reproduction_check: >-
        Stage 0 freezes feasible cells and backend probe. Stage 1 reproduces
        a conventional untyped Semaev solve path and the finite-k cap identity
        on at least one smoke cell before typed arms are scored. Mismatch →
        O-ARTIFACT stop.
    observation_collision:
      observable: >-
        Cost per verified independent relation plus solver degree, Macaulay
        dimension, monomials, wall time, peak RSS, and independent rank.
      distinct_preimage_search: >-
        Compare additive coset typing, degenerate typing, and equal-cardinality
        randomized typed-null on fresh matched targets; separates typing from
        special coset geometry and from raw-count inflation.
    constructive_transforms:
      - transform: symmetry_unquotient
        proposed_object: Distinct typed factor bases V+v_i in explicit Semaev slots.
        predicted_gain: >-
          Higher usable relation yield without predicted leading-degree
          increase; whether real solving work stays flat is the test.
    quantifier_order: >-
      EXISTS a preregistered in-regime ladder solved with identical backends
      and fresh held-out targets such that C1 and C2 hold. NOT CLAIMED:
      asymptotic ECDLP improvement; FIPS security change; revival of any
      falsified prediction of EXP-SEMBIN-92724f.
    method_ceiling:
      strongest_certifiable_claim: >-
        A scoped constant-factor or scaling trend on the declared ladder with
        charged solver metrics and verified independent rank; no asymptotic
        claim.
      nearby_object_control: >-
        Degenerate typing; randomized typed-null; held-out targets;
        optional SAT/XOR second backend on the same descended predicate;
        Magma-as-success-path forbidden.
    proof_obligations:
      - claim: Typed and untyped accepted relations decode to the same group-law predicate.
        responsibility: correctness
      - claim: Chosen cells satisfy preregistered in-regime inequalities.
        responsibility: scope
      - claim: Solver and linear-algebra costs are charged consistently across arms.
        responsibility: runtime
      - claim: Relation rank is measured, not inferred from raw count.
        responsibility: rank
      - claim: Finite-k counting cap identity matches EXP-SEMBIN-92724f scoring rule.
        responsibility: baseline

  interpretation_limits:
    - Measurement / toy–medium only; not an asymptotic ECDLP result.
    - Does not revive falsified frozen predictions of EXP-SEMBIN-92724f.
    - A positive ladder trend is not a FIPS or deployed-curve verdict.
    - Missing backend is an impediment, never evidence against conservation.
    - Leading-degree invariance does not imply full solver-trajectory invariance.

  dominated_by: >-
    n/a (no attack and no asymptotic cost result claimed). Checked against
    matched untyped Semaev on the same ladder (the baseline this measurement
    compares to) and against EXP-SEMBIN-92724f (outside-regime enumeration
    without solver degree). Time/memory/data: this record asserts a
    measurement protocol, not a row that could dominate rho or Semaev's
    published balance; Pareto honesty is deferred to RESULTS after runs.
  sota_delta:
    time: >-
      Unmeasured until RESULTS. Predicted scoped constant-factor only if
      O-CONSERVED; otherwise 0 with an exchange or image-miss reading.
    memory: Unmeasured; peak RSS reported beside time.
    data_queries: Single-target generated instances; no advice model.

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
