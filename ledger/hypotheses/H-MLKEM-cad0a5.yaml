hypothesis:
  id: H-MLKEM-cad0a5
  question_id: RQ-MLKEM-001

  statement: >-
    SCOPE: the nine archived ten-decimal cost figures in
    coordination/goals/GOAL-MLKEM-001/batches/BATCH-002/tasks/TASK-20260722-206/cost_baseline_report.yaml
    (three cost labels C0, CC, CN x three parameter sets ML-KEM-512/768/1024 x
    two arms unstructured_LWE and isometric_MLWE), plus at most one measured
    same-arm repeat study. CLAIM TIER: derivation for the arithmetic gates;
    toy for anything measured through a surrogate estimator. NO ATTACK, NO
    EXPONENT, NO SECURITY CLAIM, NO STATEMENT ABOUT MLWE HARDNESS.
    THE CLAIM. The quantity the corpus records as "the maximum matched isometry
    gain is 0.8 bit" is not separated from run-to-run randomization of the code
    that produced it, and the archived numbers already fail two consistency
    conditions that a structural gain is forced to satisfy. Specifically:
    (G1, RANK INVARIANCE) because the negacyclic isometry group of
    Z_q[X]/(X^n+1) has order 2n = 512 for every module rank k, a gain arising
    from that group must be approximately rank-invariant at a fixed cost label,
    with a max/min ratio across k in {2,3,4} of at most 2.0; the archived gaps
    give 5.80 for CN (0.7378447322 / 0.1271183697) and 31.4 for CC
    (0.6067860684 / 0.0193302861), both non-monotone in k.
    (G2, LABEL CONSISTENCY) if C0, CC and CN are three costings of one optimizer
    run, then arms whose C0 outputs agree to 0.0000000000 selected the same
    interior parameters, and every other label must therefore agree too; the
    archive shows C0 agreement of exactly 0.0000000000 at ML-KEM-512 and
    ML-KEM-768 alongside CN disagreement of 0.2286828660 and 0.7378447322 at
    those same parameter sets.
    (G3, THE MATCHED NULL) the same-arm spread sigma_null across repeats with
    only the unrecorded randomization varying satisfies sigma_null(C0) = 0
    exactly, and sigma_null(CN) is either below 0.10 bit (the gap is a resolved
    effect) or at least 0.30 bit (the gap is inside the noise). This hypothesis
    predicts the second branch.
    THE DELIVERABLE IF THE CLAIM FAILS IS EQUALLY DEFINITE: a demonstration that
    sigma_null is small and that the label contradiction has an innocent
    explanation would establish the 0.0-0.8 bit gain as a resolved measurement
    for the first time in this corpus, which no record currently does.

  mechanism: >-
    DERIVED IN THIS RECORD. Provenance is labelled at every step and no external
    paper is cited for anything.

    A. WHERE THE NUMBERS COME FROM. All nine decimals, the caveat, the
    cost_model_legend and the disputed-value entry D03 were READ THIS SESSION
    from the archived BATCH-002 task artifact named above. That artifact is an
    in-repo record written 2026-07-22 by a different runtime (its own inference
    block records resolved_model_id gpt-5.6-sol-xhigh). The external work behind
    it -- Ogilvie, Hou-Jiang, Carrier, MATZOV, Wu-Xu, source ids S08/S09/R01/R02
    -- is NOT READ, RELAYED. No page, theorem, table or figure number from any
    external source is asserted here, and stage 0 of the paired experiment
    exists to record which attributions can and cannot be checked.

    B. THE GROUP-ORDER COMPUTATION, WHICH IS EXACT. Let R = Z_q[X]/(X^n + 1),
    n = 256, q = 3329, and let the MLWE instance be b = A s + e with A in
    R^{k x k}, s, e in R^k. Multiplication by X is an R-module automorphism of
    R^k, and X^n = -1, so the group generated by multiplication by X together
    with negation has order 2n = 512. It acts on instances by
    (A, b) |-> (A, X^j b), and X^j b = A (X^j s) + X^j e is a valid MLWE
    relation with secret X^j s and error X^j e, whose coefficient distribution
    is the coefficient distribution of e permuted with signs -- hence unchanged
    for a centered symmetric law. THE ORDER 2n DOES NOT DEPEND ON k. This is the
    whole of ingredient (i) and it is exact.

    C. FROM RANK-INDEPENDENT ORBIT SIZE TO RANK-INVARIANT BITS. The step from
    "the number of free equal-norm targets is 2n for every k" to "the bit gain
    is approximately the same for every k" is NOT exact and is carried as
    HEUR-ISO-1 below. The conversion runs through the attack's interior optimum,
    which does depend on k. What the heuristic asserts is that the dependence is
    smooth and slowly varying, so that a 5.8x swing with an interior maximum is
    not producible by it. The heuristic is falsifiable and its falsifier is
    named: exhibit a mechanism by which a fixed-order target orbit yields
    0.229, 0.738, 0.127 bits at k = 2, 3, 4.

    D. THE LABEL ARGUMENT, AND EXACTLY WHAT IT DEPENDS ON. The archive's
    cost_model_legend describes C0 as "Core-SVP abstraction with one idealized
    SVP call and lower-order exponent terms suppressed", CC as the
    "classical-circuit/list-decoding-classical model used in the cited dual
    estimators", and CN as the "classical nearest-neighbor/query/
    list-decoding-naive-classical model". If these are three post-hoc costings
    of one optimizer's chosen interior parameters, then any two runs agreeing
    exactly in C0 agreed in those parameters, and CC and CN -- being functions of
    the same parameters -- must agree too, UNLESS they consume an input C0 does
    not. The archive names exactly such an input in its own caveat on these
    files: "randomized polar-code data without recorded seeds". So the observed
    pattern (C0 identical to ten decimals, CN differing by 0.74 bits) has a
    ready explanation that is not structure, and the hypothesis is that this is
    the correct one. THE ARGUMENT DIES IF the three labels are independently
    optimized; that is HEUR-ISO-2, it is an assumption about unread code, and it
    is the weakest link in this record.

    E. WHY A NULL IS THE ONLY THING THAT SETTLES IT. G1 and G2 are consistency
    conditions: failing them shows the gap is not what it is described as, but
    not what it is. Only repeating one arm with the randomization varied
    measures the noise floor, and no record in this corpus has ever run a repeat
    of any estimator output. The forced values are stated in G3 and both
    branches are pre-declared usable, which is what makes it a null rather than
    a rhetorical device.

    F. THE SURROGATE PROBLEM, STATED IN ADVANCE. If the external pinned
    repositories cannot be retrieved, the only runnable arm in this environment
    is the in-repo sage-free lattice-estimator harness
    (tools/sage_free_estimator, pinning lattice-estimator commit
    3e48ef421ec256afddb3e7d2249a77eab6e9ba12; README READ THIS SESSION, its
    known-answer control NOT RUN THIS SESSION). That harness is a DIFFERENT
    optimizer. A sigma_null measured on it bounds nothing about the Hou-Jiang
    code and may only be reported as: estimator pipelines of this shape can or
    cannot carry randomization noise of the observed size. Every sentence citing
    a surrogate measurement must carry that clause.

  assumptions:
    - >-
      FROZEN ARITHMETIC, fixed before any measurement. The nine differences are
      Delta(label, set) = unstructured - isometric computed from the archived
      ten-decimal raw_repository_outputs, namely
      C0: 0.0000000000 / 0.0000000000 / 0.0921807761,
      CC: 0.1836590645 / 0.0193302861 / 0.6067860684,
      CN: 0.2286828660 / 0.7378447322 / 0.1271183697
      at ML-KEM-512 / 768 / 1024. The gate thresholds are frozen here: G1 passes
      if max_k Delta / min_k Delta <= 2.0 at every label; G2 passes if every
      label's gap is 0 at every parameter set where the C0 gap is exactly 0;
      G3's decision rule is sigma_null(CN) < 0.10 (resolved) versus >= 0.30
      (noise), with the interval between reported as indeterminate. NO THRESHOLD
      MAY BE CHANGED AFTER ANY NUMBER IS OBSERVED; a change requires a versioned
      amendment marked exploratory_only and is never an edit.
    - >-
      The archived transcription is faithful. If the BATCH-002 task mis-copied a
      decimal, every argument here is about a typo. Stage 0 must attempt primary
      verification and must report failure to obtain it as failure.
    - >-
      "unstructured_LWE" and "isometric_MLWE" denote two runs of one codebase
      differing only in the isometry feature. If they denote different codebases
      the gap is meaningless, and that is the finding rather than a defect in the
      hypothesis.
    - >-
      No status change to any existing record is proposed by this hypothesis. A
      correction, if warranted, is a new superseding record under a new id
      (AGENTS.md rule 4).

  proof_search_map:
    bottleneck: >-
      The step at which the isometry feature is claimed to change a cost. If the
      two arms' interior parameter choices are identical -- which the exact
      ten-decimal C0 agreement at two of three parameter sets indicates -- then
      no such step occurred at those parameter sets, and every downstream number
      differing between the arms is produced by something other than the
      isometry. Locating or excluding that step is upstream of any future
      ring-exploiting mechanism, because it decides whether the corpus has a
      baseline that can register one.
    baseline_embedding:
      parameter_slice: >-
        The unstructured_LWE arm alone, at all three parameter sets, is the
        baseline this comparison is drawn against, and it is reproduced by
        construction: it is the arm the archive labels unstructured and against
        which the isometric column is differenced.
      reproduction_check: >-
        ARITHMETIC AND EXACT, and it is the gate: recompute all nine differences
        from the committed ten-decimal figures and confirm they equal the values
        frozen in the assumptions to all ten places. This is not a curve
        resembling a baseline; it is integer-precision decimal subtraction on
        committed numbers, and any mismatch invalidates the record before any
        interpretation is offered.
    observation_collision:
      observable: >-
        The scalar gap Delta(label, parameter set), together with the summary
        sentence "the maximum matched structure gain is 0.8 bit".
      distinct_preimage_search: >-
        A COLLISION IS EXHIBITED AND IT IS THE CONTENT OF THE HYPOTHESIS. Two
        distinct ground-truth situations produce the same observable
        Delta(CN, 768) = 0.7378447322: (i) the ring structure is worth 0.738
        bits at k = 3 under the CN model, and (ii) two draws of an unseeded
        polar code differ by 0.738 bits while the interior parameters are
        identical -- a situation the archive's own caveat says is possible and
        which the exact C0 agreement at the same parameter set positively
        indicates. The two lie on opposite sides of the claimed conclusion. No
        additional condition anywhere in the corpus separates them, and supplying
        one -- the same-arm repeat -- is the experiment.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable fixed (Delta = 0.738 bits at CN/768) and vary the
          forgotten structure: the randomization, the interior parameters, the
          codebase identity. The intrinsic invariant proposed to distinguish the
          resulting objects is sigma_null, the same-arm spread. If sigma_null
          does not distinguish them, the fibre is genuinely undecidable at this
          budget and the honest output is that the corpus does not know the gain
          to better than sigma_null bits.
        predicted_gain: >-
          None to any attacker. The gain is a resolution attached to the only
          structure-dependent number this goal produced, and hence a usable
          baseline for any future ring-exploiting proposal.
      - transform: representation_reduction
        proposed_object: >-
          Move the question from "is the gain real" (a statement about an
          unrunnable external codebase) to "is the difference larger than the
          same-arm spread" (a statement about two repeat runs), where it becomes
          an exact inequality between two measured numbers rather than a
          judgement about a paper.
        predicted_gain: >-
          Turns an unresolvable literature dispute into a two-number comparison.
          The ENCODING obligation is that the surrogate arm, if used, is not the
          object; that obligation is DECLARED UNMET whenever the surrogate is
          used, not deferred.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER: FOR THE ONE FIXED archived data set (nine figures,
      one date, one artifact), THERE EXISTS a non-structural explanation --
      unseeded randomization in the CC/CN cost path -- consistent with every one
      of the nine numbers. The stronger and NOT claimed order is: FOR ALL
      isometry-aware estimators, the structure gain is noise. That statement is
      not made, is not supported, and may not be inferred from any outcome of
      this hypothesis. Note also the quantifier trap being hunted in the corpus's
      own sentence: "the maximum matched isometry gain is 0.8 bit" reads as a
      bound holding FOR ALL parameter sets, while the evidence for it is a
      maximum over three observations of a quantity whose own archive declines to
      call its precision reproducible.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that the archived nine figures fail two derived consistency
        conditions, and that the same-arm spread of a NAMED arm is a measured
        number s. It cannot certify that the true isometry gain is zero, cannot
        certify anything about the correctness of any external estimator, cannot
        revise any ML-KEM security estimate, and cannot be cited as evidence
        about MLWE hardness. Writing it up as any of those would be the
        premature-closure failure mode.
      nearby_object_control: >-
        THE PLANTED-GAIN ARM, where the desired conclusion (a detectable gain)
        MUST hold: an arm in which the usable sample budget is doubled by a
        change that is not the isometry, forcing a gain of order one bit. It is
        the closest object to the treatment -- same code, same parameter sets,
        same cost labels -- and the effect is known to be present there. An
        instrument that cannot see a gain there cannot license any negative
        statement about a 0.7-bit gain, and no negative may be reported until it
        does.
    proof_obligations:
      - claim: >-
          The nine differences equal the frozen values to ten decimal places.
        responsibility: baseline
      - claim: >-
          The negacyclic isometry group has order 2n independent of k, and its
          action carries MLWE relations to MLWE relations.
        responsibility: correctness
      - claim: >-
          C0, CC and CN are three costings of one optimizer run (HEUR-ISO-2),
          established from code rather than inferred from the legend.
        responsibility: interface
      - claim: >-
          sigma_null is measured on a named arm with the repeat count, the
          varied input, and the arm's identity recorded; a surrogate arm is
          labelled a surrogate in every citation.
        responsibility: scope
      - claim: >-
          The planted-gain positive control fires before any negative is
          reported.
        responsibility: success_probability
      - claim: >-
          Nothing here transfers to any security claim, and the boundary is
          stated on every citation.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. There is NO complexity claim of any kind. This is an
    AUDIT OF A MEASUREMENT. It makes no system easier to solve, moves no
    exponent, and adds no attack; sota_delta is zero on time, memory, data and
    queries alike. The audited quantity is at most 0.8 bit against totals of
    121.9 to 259.6 bits.

  heuristic_assumptions:
    - id: HEUR-ISO-1
      formal_statement: >-
        FOR ALL cost labels L in {C0, CC, CN} and FOR ALL module ranks
        k in {2, 3, 4}, if Delta(L, k) is produced by the negacyclic isometry
        group, then max_k Delta(L, k) / min_k Delta(L, k) <= 2.0.
      random_model_justification: >-
        The group has order 2n = 512 for every k (proved above, exact). The
        number of free equal-norm targets an isometry-aware attack obtains is
        therefore rank-independent, and the bit value of a fixed number of free
        targets varies only through the attack's interior optimum, which is a
        smooth function of k. THE THRESHOLD 2.0 IS A JUDGEMENT AND IS DECLARED
        AS ONE: it is not derived from a distribution and no random model
        supports the specific number. It is frozen before observation, which is
        what it needs to be, and a reviewer is invited to argue for a different
        value -- noting that the archived ratios are 5.80 and 31.4, so the
        verdict is insensitive to any threshold below about 5.
      supporting_results: []
      validation_experiment_ids: [EXP-MLKEM-9fc13b]
      falsification_condition: >-
        A named mechanism producing a non-monotone 5.8x swing in the bit value
        of a fixed-order target orbit across k = 2, 3, 4. If such a mechanism is
        exhibited, HEUR-ISO-1 is refuted, gate G1 is withdrawn, and the exhibited
        mechanism is a more valuable finding than the audit.
    - id: HEUR-ISO-2
      formal_statement: >-
        C0, CC and CN are three deterministic costings of a single optimizer run,
        so that identical C0 outputs across two arms imply identical interior
        parameters and hence identical CC and CN outputs, absent an additional
        input consumed by CC and CN alone.
      random_model_justification: >-
        NONE, AND THIS IS RECORDED AS THE WEAKEST LINK RATHER THAN PAPERED OVER.
        It is an assumption about code this session has not read. The archive's
        cost_model_legend is consistent with it and does not establish it. If it
        fails, gate G2 is void and only G1 and G3 survive.
      supporting_results: []
      validation_experiment_ids: [EXP-MLKEM-9fc13b]
      falsification_condition: >-
        Code reading shows independent optimization per label, OR the measured
        sigma_null(C0) is nonzero. Either observation refutes HEUR-ISO-2
        directly, and the second one costs nothing extra because it falls out of
        the same repeat study that measures sigma_null(CN).

  structural_ingredients:
    - description: >-
        The negacyclic isometry group of Z_q[X]/(X^n+1) and its action on MLWE
        instances.
      citation: >-
        DERIVED IN THIS RECORD; elementary. No external citation is asserted.
        The archived report's module_rotation_prior_art block relays the same
        fact to Wu-Xu and others, and those attributions are NOT READ.
      role: forces the rank-independence of the orbit size, hence gate G1
    - description: >-
        The archived nine ten-decimal cost figures, their caveat, and the
        cost_model_legend.
      citation: >-
        coordination/goals/GOAL-MLKEM-001/batches/BATCH-002/tasks/TASK-20260722-206/cost_baseline_report.yaml,
        READ THIS SESSION. An in-repo archived task artifact, not a paper.
      role: supplies every number the gates are evaluated on
    - description: >-
        A Sage-free lattice-estimator harness with a known-answer control,
        available in-repo as a possible surrogate arm.
      citation: >-
        tools/sage_free_estimator/README.md, READ THIS SESSION. Its stated
        control output is a README transcript and was NOT reproduced in this
        session.
      role: candidate surrogate arm for the same-arm repeat study, declared a
        surrogate wherever used

  reduction_chain:
    core_problem: >-
      Decide whether the archived isometric-MLWE minus unstructured-LWE cost gap
      is separated from the same-arm randomization spread of the code that
      produced it.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. There is no reduction from this audit to any statement
      about MLWE hardness, about ML-KEM's security margin, or about whether ring
      structure helps lattice attacks in general. A future ring-exploiting
      proposal would consume this result as a statement about its BASELINE'S
      RESOLUTION and nothing more, and any citation that goes further is
      misciting it.

  predictions:
    - metric: >-
        G1 rank-invariance ratio max_k Delta(L,k) / min_k Delta(L,k), computed
        from the frozen archived differences, at L = CC and L = CN
      direction: higher
      minimum_effect: >-
        EXACTLY 31.393... at CC (0.6067860684 / 0.0193302861) and EXACTLY
        5.8028... at CN (0.7378447322 / 0.1271183697), both above the frozen
        threshold 2.0. C0 is excluded from this gate because two of its three
        gaps are exactly zero and the ratio is undefined; that exclusion is
        declared here, before evaluation, and not chosen afterwards.
    - metric: >-
        G2 label consistency: |Delta(CN, set)| at the parameter sets where
        Delta(C0, set) = 0.0000000000 exactly
      direction: higher
      minimum_effect: >-
        EXACTLY 0.2286828660 at ML-KEM-512 and 0.7378447322 at ML-KEM-768,
        against a forced value of 0.0 under HEUR-ISO-2. The gate is failed by
        the archived data as a matter of arithmetic; the experiment's job is to
        establish HEUR-ISO-2 well enough for that failure to mean something.
    - metric: >-
        G3a sigma_null(C0): standard deviation of the C0 output across >= 10
        repeats of one arm with only the unrecorded randomization varied
      direction: lower
      minimum_effect: >-
        EXACTLY 0.0. Forced by HEUR-ISO-2. A nonzero value refutes HEUR-ISO-2 and
        is the cheapest available refutation of this hypothesis.
    - metric: >-
        G3b sigma_null(CN): same-arm spread of the CN output over the same
        repeats
      direction: higher
      minimum_effect: >-
        >= 0.30 bit at at least one parameter set is what this hypothesis
        predicts, and < 0.10 bit at every parameter set refutes it. The interval
        [0.10, 0.30) is pre-declared INDETERMINATE at this repeat count and may
        not be resolved by choosing a side after the fact.
    - metric: >-
        Positive control: measured gain when the usable sample budget is doubled
        by a non-isometry change
      direction: higher
      minimum_effect: >-
        >= 0.50 bit, and it MUST appear. Below that the instrument cannot
        resolve effects of the size under discussion and NO negative result may
        be reported from any arm.
    - metric: >-
        Graded control: measured gain at sample-budget multipliers
        1.00x, 1.25x, 1.50x, 2.00x
      direction: higher
      minimum_effect: >-
        Monotone non-decreasing across the four levels, with the 1.00x cell
        returning a gain indistinguishable from 0 within sigma_null. A
        non-monotone graded response localises an instrument defect instead of
        leaving "the measurement was noisy".

  test_boundary:
    instances:
      - >-
        The nine archived ten-decimal figures for the corrected code-based dual
        estimates, two arms, three labels, three standardized parameter sets.
      - >-
        At most one repeat study on ONE named arm: preferentially the external
        pinned repository arm; failing that the in-repo sage-free
        lattice-estimator surrogate, declared as a surrogate.
      - >-
        NOT IN SCOPE: any other estimator, any other scheme, any other cost
        label, any security claim, and any statement about the correctness of
        the external code beyond its reproducibility under repetition.
    parameters:
      cost_labels: [C0, CC, CN]
      parameter_sets: [ML-KEM-512, ML-KEM-768, ML-KEM-1024]
      module_ranks: {ML-KEM-512: 2, ML-KEM-768: 3, ML-KEM-1024: 4}
      n: 256
      q: 3329
      isometry_group_order: 512
      frozen_thresholds:
        G1_max_over_min: 2.0
        G2_forced_gap_where_C0_gap_is_zero: 0.0
        G3a_sigma_null_C0: 0.0
        G3b_noise_branch: 0.30
        G3b_resolved_branch: 0.10
      minimum_repeats: 10
      graded_control_levels: [1.00, 1.25, 1.50, 2.00]
    implementation: >-
      Stage 1 is exact decimal arithmetic in pure Python (numpy 2.4.6 is present
      in this environment, MEASURED THIS SESSION; sympy, sage and estimator are
      absent, MEASURED THIS SESSION). Stage 2 requires either an external
      repository checkout or the in-repo sage-free harness plus a
      lattice-estimator checkout at commit
      3e48ef421ec256afddb3e7d2249a77eab6e9ba12; both need network access. The
      Executor records instrument paths and sha256 values at setup; this session
      has not computed them.
    budget:
      stage0_wall_clock_seconds: 3600
      stage1_wall_clock_seconds: 1800
      stage1_compute: "zero; decimal arithmetic on committed numbers only"
      stage2_wall_clock_seconds_ceiling: 10800
      stage2_maximum_memory_gb: 8
      stage2_note: >-
        Stage 2 is NOT authorized by this record. GOAL-MLKEM-001 is closed at
        budget and authorizes nothing; a Coordinator approval on a successor
        goal is required, and a failure to obtain the instrument is an
        infrastructure outcome (AGENTS.md rule 5), never a negative result.

  falsification_conditions:
    - >-
      F1 (ZERO COMPUTE, PRIMARY). Recomputation of the nine differences does not
      reproduce the frozen values to ten decimal places. The record is then
      arithmetically wrong and is withdrawn by supersession before any
      interpretation is offered.
    - >-
      F2. Stage-0 code reading establishes that C0, CC and CN are independently
      optimized. HEUR-ISO-2 fails, gate G2 is withdrawn, and the hypothesis
      continues on G1 and G3 alone in an explicitly weakened form.
    - >-
      F3. sigma_null(C0) is measured nonzero. HEUR-ISO-2 fails from the data
      side; same consequence as F2.
    - >-
      F4. sigma_null(CN) < 0.10 bit at every parameter set while the planted
      positive control fires. The gap is then resolved at the 0.1-bit level, this
      hypothesis is refuted, and the corpus gains its first controlled
      measurement of the isometry gain -- a strictly better outcome for the
      program than the one this record predicts.
    - >-
      F5. A reviewer exhibits a mechanism making the isometry gain legitimately
      rank-dependent by 5.8x. HEUR-ISO-1 fails and G1 is withdrawn.
    - >-
      F6 (NOT A FALSIFICATION, PRE-REGISTERED BEFORE EVALUATION). If the two
      arms turn out not to be matched at all -- different codebases, different
      inputs, different revisions -- the honest reading is FIRST that the nine
      numbers are not comparable and only SECOND that the gain is noise. That
      ordering is fixed here and may not be selected after seeing a result.
    - >-
      F7 (THE PLANNED NEGATIVE IS A DELIVERABLE). If no arm can be obtained, the
      package must still emit the stage-1 gate table, the frozen thresholds, the
      retrieval log, and a statement naming exactly which measurement is missing
      and what it would cost. A negative that does not emit that has not
      finished.

  interpretation_limits:
    - >-
      CLAIM TIER derivation for the gates and toy for anything measured through
      a surrogate, and neither may be raised by any downstream citation. THIS IS
      AN AUDIT OF A MEASUREMENT, NOT AN ATTACK. It moves no exponent, recovers no
      key, and bears on no security claim. Pollard-rho-style baselines are not in
      play; the relevant baseline is the archived dual/primal cost frontier and
      it is untouched.
    - >-
      A supported outcome establishes ONLY that the archived gap is not separated
      from the same-arm spread of a named arm. It does NOT establish that the
      isometry gain is zero, that ring structure is unexploitable, or that the
      external work is wrong. The correct downstream statement is a RESOLUTION
      attached to an existing number.
    - >-
      NO STATUS CHANGE to EV-MLKEM-001, EV-MLKEM-002, IDEA-20260722-001,
      DEC-20260724-019 or GOAL-MLKEM-001 is proposed or implied, and GOAL-MLKEM-001
      remains closed at budget. Any correction is a new record.
    - >-
      A surrogate-arm measurement is a measurement of the surrogate. It bounds
