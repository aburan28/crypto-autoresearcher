  statement: >-
    A window of width 4 stores 8 entries. A window of width 3
    stores 4. Two to the power 3 is 8. Two to the power 2 is 4.
    Eight exceeds four by 4. The product of the two table sizes
    is 32. Their sum is 12. Two width-3 tables each store 4, so
    that gap is 0 and their product is 16.
  mechanism: >-
    The proposal writes the widths 4 and 3 and the sizes 8 and 4.
    This contract checks those integers. It does not add a curve
    point.
