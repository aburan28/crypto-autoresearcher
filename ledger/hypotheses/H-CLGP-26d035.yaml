hypothesis:
  id: H-CLGP-26d035
  question_id: RQ-CLGP-b99df5
  title: >-
    The n-torsion edge character chi is the explicit bridge map the question demands -- a 1-cocycle of
    the Cl(O)-torsor valued in (Z/N)^*, free on principal ideals, with the ECDLP direction foreclosed by
    a cardinality bound -- and under the least-x labelling chi is NOT predictable from cheap poly-time
    vertex labels
  statement: >-
    Let E/F_p be ordinary with Frobenius pi, O = End_{F_p}(E), and N a prime with N exactly dividing
    #E(F_p); set n = (N, pi - 1), so G = E(F_p)[N] = E[n] is free of rank one over O/n isomorphic to
    F_N. For an O-ideal a coprime to n, phi_a restricts to an O/n-isomorphism, and for a labelling rho
    assigning a generator to each curve of the level, define
    chi_rho(a, E) = log_{rho(a*E)}(phi_a(rho(E))) in (Z/N)^*. THE HYPOTHESIS ASSERTS FIVE THINGS. (C1)
    chi is a well-defined explicit bridge map from the torsor to Aut of the N-part. (C2) It is a
    1-cocycle: chi_rho(ab,E) = chi_rho(b, a*E) chi_rho(a, E), and relabelling changes it by a coboundary
    -- so every composition-compatible edge scalar equals chi_rho for some labelling and chi is the
    UNIVERSAL one. (C3) On principal ideals it is FREE: for alpha = u + v pi coprime to n, using
    pi = 1 mod n, chi = alpha mod n = u + v mod N, computable in polynomial time with NO discrete
    logarithm, so all non-trivial content sits in the torsor coordinate. (C4) The forward reduction dies
    on cardinality: h(D) = O(sqrt(|D|) log|D|) while |G| = N of size about p, so routing a target through
    chi compresses about p possibilities into at most h about p^{1/2} classes, leaving at least
    N/h about p^{1/2} candidates; composing a PERFECT vectorization oracle with generic search still
    costs p^{1/2+o(1)}, and no vectorization improvement can repair it, because the bound is on the size
    of the acting group. NAMED OBSTRUCTION: OBS-CARD. (C5, THE ONLY MEASURED PART) For the least-x
    labelling and split primes l coprime to the conductor, chi_l(E) is NOT predictable, better than
    chance beyond the stated minimum detectable effect, from poly(log p)-computable labels of E and
    l*E.
  mechanism: >-
    The point group and the isogeny class are related by exactly one natural structure: G = E[n] is an
    O/n-module, so Cl(O) acts on the curves and simultaneously on their N-torsion, and comparing the two
    actions produces a scalar per edge. The comparison requires choosing a generator on each curve, and
    there is no canonical generator of a group of prime order -- that is the entire obstruction, and it
    is a TORSOR obstruction, not a computational one. Two consequences run in opposite directions.
    DOWNWARD: because Cl(O) is square-root-small, even a free trivialisation would not move the ECDLP
    exponent, which is C4. UPWARD: because the trivialising function psi (with
    chi_rho(a,E) = psi(a*E)/psi(E)) is obtained by transporting from a base curve, computing psi IS
    solving vectorization; so any cheap statistical handle on chi is a handle on vectorization, which is
    the p^{1/4} problem underlying class-group-action constructions on ordinary curves. The honest place
    to spend compute is therefore NOT the ECDLP direction, which a counting bound closes, but the
    vectorization direction, which is open and which this lane has never measured. The measurement is
    feasible precisely because N is small enough that the discrete logarithm defining chi is exhaustive,
    so no hardness assumption enters the measurement itself.
  assumptions:
    - >-
      The toy target is a p = 4001, t = 30 class with #E = 3972 = 2^2 * 3 * 331, so N = 331 and G has
      order 331; discrete logarithms in G are exhaustive at negligible cost, which is what makes chi
      directly measurable. The executor must CONFIRM 331 exactly divides 3972 before relying on the
      O-module identification.
    - >-
      Split primes coprime to the conductor exist and give HORIZONTAL isogenies constructible by the
      existing point-based tooling. For D_0 = -59 the Kronecker symbols make l = 3, 5, 7 split, and
      3 divides #E = 3972 so a rational 3-torsion kernel exists. NO VERTICAL ISOGENY IS NEEDED, which is
      deliberate: the vertical/conductor-prime construction is recorded as unimplemented and this design
      must not depend on it.
    - >-
      The least-x labelling is computable: enumerate x = 0, 1, 2, ..., lift, and multiply by the cofactor
      #E/N = 12 to land in G, keeping the first non-zero result, ASSERTING order exactly 331. At toy
      scale this is trivial; at cryptographic scale it is poly(log p) only when the cofactor is small,
      and that restriction is stated rather than assumed away.
    - >-
      The identification G = E[n] with n = (N, pi - 1) is taken from prior internal records but MUST be
      re-derived independently by the executor rather than inherited, since it was read only as a
      one-line digest claim.
  proof_search_map:
    bottleneck: >-
      The absence of any map from the point group G to the Cl(O)-torsor. Every proposed reduction in this
      lane needs one and none exists; C1 supplies the map in the OTHER direction (torsor to Aut(G)) and
      C4 shows why reversing it cannot help. For C5 the bottleneck is different and is the one worth
      attacking: computing the trivialising function psi, which is the vectorization problem itself.
    baseline_embedding:
      parameter_slice: >-
        The principal-ideal slice a = (alpha). There chi_rho((alpha), E) = alpha mod n, phi_a is an
        endomorphism, and the construction degenerates to the already-committed statement that every
        endomorphism acts on a prime-order subgroup as a scalar. That is the exact old-method boundary
        this object must reproduce.
      reproduction_check: >-
        SYMBOLIC: verify alpha = u + v pi and pi = 1 mod n give alpha = u + v mod N, then instantiate on
        one toy curve by computing [alpha]P directly and comparing with [u + v mod N]P for several alpha
        in O. FROZEN FIXTURE: archive the (alpha, u, v, residue, point) tuples. A failure here means the
        O-module identification is wrong and every later arm is void.
    observation_collision:
      observable: >-
        chi_l(E), the edge character value in (Z/N)^*.
      distinct_preimage_search: >-
        A COLLISION EXISTS BY CONSTRUCTION AND IS THE REASON C1 CANNOT BE PUSHED FURTHER. Two labellings
        rho and rho' = [c(.)] o rho differing by any function c into (Z/N)^* produce edge characters
        differing by the coboundary c(a*E)/c(E); in particular for any target value there is a labelling
        realising it on a given edge. TWO GROUND-TRUTH OBJECTS ON OPPOSITE SIDES OF THE CONCLUSION: the
        labelling making chi identically 1 on a spanning tree (which exists and encodes NO torsor
        information) and a labelling for which chi is injective on a cyclic subgroup of Cl(O) (which also
        exists and encodes ALL of it). So chi is identifying only RELATIVE to a fixed labelling, no
        intrinsic conclusion about torsor position may be read from a chi value alone, and the experiment
        is therefore about ONE concrete poly-time labelling and generalises to no other.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move to O/n, where the endomorphism action is an exact equality alpha -> u + v mod N rather
          than an isogeny evaluation. Obligations: encoding (writing alpha in the pi-basis), completeness
          (every alpha coprime to n is reached), soundness (the residue really is the scalar), transfer
          (the identification O/n isomorphic to Z/N depends on N exactly dividing #E), cost-loss (none;
          the reduction is exact and poly-time).
        predicted_gain: >-
          Makes the principal part free, which isolates the torsor coordinate as the sole residual content
          and lets the counting argument be applied to it cleanly.
      - transform: observable_fiber
        proposed_object: >-
          Hold chi_l fixed and vary the ideal class; search for an intrinsic invariant of the curve pair
          separating the resulting classes. If none exists at toy scale, the compression bound is tight
          and the lane's closure is measured rather than asserted.
        predicted_gain: >-
          Converts OBS-CARD from a counting bound into a bound with a measured companion, which is what
          makes it re-scopable by a later reader.
    quantifier_order: >-
      THE HOPED-FOR STATEMENT, WRITTEN OUT AND THEN DENIED: "FOR ALL p, FOR ALL orders O, FOR ALL levels,
      THERE EXISTS a poly(log p)-time labelling rho such that FOR ALL ideals a coprime to n,
      chi_rho(a, E) is computable in poly(log p) time from (E, a*E) alone." This is FALSE unless
      vectorization is easy, because such a rho yields psi and psi solves vectorization. The witness rho
      may depend on the LEVEL but not on the ideal, and it is exactly that uniformity which fails. THE
      STATEMENT ACTUALLY TESTED IS WEAKER AND HAS ITS QUANTIFIERS IN A DIFFERENT ORDER: "FOR THE ONE
      FIXED labelling rho = least-x, and FOR EACH tested split prime l, THERE EXISTS a poly-time
      predictor F from cheap labels to (Z/N)^* whose accuracy on held-out curves exceeds chance by more
      than the stated minimum effect." A positive is a statement about one labelling and finitely many
      primes, never about all labellings.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On this toy class at this N, for the least-x labelling and these split primes, a predictor built
        from this feature set does (or does not) beat chance by delta, with the stated minimum detectable
        effect." It can NEVER certify that no poly-time labelling trivialises the torsor -- that is a
        statement about all labellings and no finite experiment reaches it -- and it can never certify an
        ECDLP consequence, which C4 forecloses independently of any measurement.
      nearby_object_control: >-
        A LEVEL WHERE VECTORIZATION IS TRIVIALLY EASY: the crater of the same class, where h(-59) = 3, so
        the torsor has three elements and any predictor MUST succeed. If the predictor fails at h = 3 it
        is broken and no negative may be read from its failure at the larger level. SECOND NEARBY OBJECT:
        a randomly relabelled torsor of the same size, where chi is uniform by construction and the
        predictor MUST fail -- a predictor that succeeds there is fitting the label set, not chi.
    proof_obligations:
      - claim: "n = (N, pi-1) has norm N and G = E[n] is free of rank one over O/n isomorphic to F_N."
        responsibility: baseline
      - claim: "phi_a restricts to an O/n-isomorphism when gcd(N(a), N) = 1."
        responsibility: correctness
      - claim: >-
          chi_rho(ab,E) = chi_rho(b,a*E) chi_rho(a,E), and relabelling changes chi by a coboundary.
        responsibility: interface
      - claim: "chi_rho((alpha),E) = alpha mod n = u+v mod N, poly-time, no discrete logarithm."
        responsibility: feasibility
      - claim: >-
          h(D) at most O(sqrt(|D|) log|D|), so the compression leaves at least N/h about p^{1/2}
          candidates.
        responsibility: size
      - claim: >-
          Composing a perfect vectorization oracle with generic search costs p^{1/2+o(1)}.
        responsibility: runtime
      - claim: >-
          The least-x predictor beats, or does not beat, chance by delta on held-out curves.
        responsibility: success_probability
      - claim: "Toy tier: one class, N = 331, finitely many primes and one labelling."
        responsibility: scope
    not_applicable_reason: null
  asymptotic_claim:
    problem: >-
      Cl(O)-vectorization on an ordinary prime-field isogeny class (NOT the ECDLP, which C4 forecloses on
      this route).
    prior_best: >-
      Classically about h^{1/2} = p^{1/4+o(1)} meet-in-the-middle time and memory, or a low-memory random
      walk at the same time with O(1) memory and a van Oorschot-Wiener parallel interpolation; quantumly
      subexponential by abelian hidden shift. BOTH RECALLED and to be confirmed by a reviewer with
      retrieval before any comparison is recorded.
    time_exponent: >-
      NO EXPONENT IS CLAIMED FOR ECDLP, AND C4 SHOWS NONE IS AVAILABLE ON THIS ROUTE: a perfect
      vectorization oracle composed with the residual search still costs p^{1/2+o(1)}. The only exponent
      that could move is VECTORIZATION's, and only in the optimistic branch of C5: a poly-time predictor
      of b bits would take h^{1/2} = p^{1/4+o(1)} to (h/2^b)^{1/2}. NO SUCH PREDICTOR IS CLAIMED TO
      EXIST; the prior is low.
    memory_exponent: >-
      The vectorization incumbent is a meet-in-the-middle at about p^{1/4} TIME AND MEMORY, or a
      low-memory random walk at the same time with O(1) memory. Any positive must be charged in BOTH
      models; a gain existing only in the large-memory model is a different and weaker claim and must be
      labelled as one. The experiment itself uses O(#E) memory.
    hidden_cofactor: >-
      Three disclosures. (i) h(D) = |D|^{1/2+o(1)} rests on Siegel and is INEFFECTIVE, so "h about
      p^{1/2}" carries an incomputable constant; C4 uses only the UNCONDITIONAL upper bound, so the
      ineffectivity does not weaken the obstruction. (ii) The o(1) in the vectorization incumbent hides
      the cost of evaluating the group action, which is polynomial but not small. (iii) The least-x
      labelling is poly(log p) only when the cofactor #E/N is small; for large cofactors it is not
      poly-time and the whole construction changes character.
    claim_kind: constant_factor
  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        LABEL-INDEPENDENCE. For the least-x labelling and split primes l coprime to the conductor, the
        edge characters chi_l(E) behave, as E ranges over one level, like independent uniform draws from
        (Z/N)^*, independent of every poly(log p)-computable vertex label of E and l*E.
      random_model_justification: >-
        RIGOROUS INGREDIENT: chi is a cocycle for a SIMPLY TRANSITIVE action, so for a uniformly random
        labelling it is exactly uniform on each edge -- a theorem, not an assumption, and it is what the
        random-relabelling null instantiates. CLASSICAL STATEMENT IMITATED: that a concrete,
        arithmetically defined choice (least x) behaves like a uniform choice, the same shape of
        assumption as treating the least quadratic non-residue or the least primitive root as generic,
        and equally unproved.
      supporting_results:
        - >-
          Simple transitivity of the Cl(O)-action on a level (Deuring / standard CM theory). RECALLED and
          not checked in this session.
      validation_experiment_ids:
        - EXP-CLGP-63c850
      falsification_condition: >-
        Any predictor beating the permutation null's 99th percentile by more than the reported minimum
        detectable effect, replicated on a second level or a second prime.
    - id: H2
      formal_statement: >-
        HORIZONTAL CONSTRUCTIBILITY. For each tested split prime l, both horizontal l-isogenies from each
        curve of the level are constructible by the existing point-based tooling, so the measured graph
        is the TRUE horizontal graph and not a sub-graph biased toward curves with convenient rational
        kernels.
      random_model_justification: >-
        RIGOROUS INGREDIENT: l splits in O and does not divide the conductor, so exactly two horizontal
        l-isogenies exist from each curve of the level, and 3 divides #E supplies rational 3-torsion for
        l = 3. CLASSICAL STATEMENT IMITATED: that Velu's formulas on a rational kernel realise BOTH
        horizontal directions -- true only when the kernel points are F_p-rational, and for l = 5, 7 with
        l not dividing #E = 3972 they are NOT, so the tooling may reach only a sub-graph. THIS IS THE
        MOST LIKELY PRACTICAL FAILURE OF THE DESIGN and it is pre-registered as such.
      supporting_results: []
      validation_experiment_ids:
        - EXP-CLGP-63c850
      falsification_condition: >-
        The constructed graph is not 2-regular at every vertex for a given l, or its connected components
        do not have size h. Then the experiment runs on l = 3 alone and SAYS SO; it does not substitute a
        different construction silently.
  structural_ingredients:
    - description: >-
        For ordinary E/F_p with End = O, Frobenius pi and prime N with N^2 not dividing #E(F_p):
        G = E[n] for the O-ideal n = (N, pi - 1) of norm N, dividing (pi - 1).
      citation: IDEA-20260807-02b7b2 and IDEA-20260807-5158fa
      provenance: internal
      verified_by: >-
        Read only as a one-line claim in a session prior-art digest; the primary proposals were not
        opened. The executor MUST re-derive this identity independently rather than inherit it.
      role: the O-module identification the whole construction rests on
    - description: >-
        The two sizes side by side: h(O) = O(sqrt(|D|) log|D|) unconditionally and |D|^{1/2+o(1)} by
        Siegel (ineffective), against N.
      citation: IDEA-20260807-bbdcf3
      provenance: internal
      verified_by: Read only as a one-line digest claim; primary not opened
      role: the compression bound restated as a barrier
    - description: >-
        Simple transitivity of the Cl(O)-action on the set of F_p-isomorphism classes of ordinary curves
        with End = O.
      citation: Deuring / standard CM theory
      provenance: recalled
      verified_by: null
      role: the structural fact behind the cocycle and the trivialisation argument
    - description: >-
        The classical vectorization incumbent on an ordinary class, about sqrt(h) = p^{1/4} group-action
        evaluations, and the quantum subexponential incumbent.
      citation: >-
        Galbraith-Hess-Smart / Galbraith-Stolbunov style meet-in-the-middle; Childs-Jao-Soukharev and
        Kuperberg for the quantum case
      provenance: recalled
      verified_by: null
      role: >-
        the incumbent a C5 positive would have to beat; a reviewer with retrieval must confirm the exact
        exponents and their memory charges before any comparison is recorded
  reduction_chain:
    core_problem: >-
      Predictability of the edge character chi_l under one concrete poly-time labelling, which is a
      partial trivialisation of the Cl(O)-torsor.
    corollaries:
      - problem: Cl(O)-vectorization on ordinary prime-field classes of the tested shape.
        reduction_ref: >-
          No published reduction is cited. The relationship is that the trivialising function psi IS the
          vectorization solution, derived here, so a predictor of chi is a partial trivialisation; its
          end-to-end cost must be charged against a sqrt(h) baseline before the word "faster" is used.
        asymptotics_preserved: null
  predictions:
    - metric: loop_certificate_pass_rate
      direction: different
      minimum_effect: >-
        100 percent, zero tolerance. The product of chi around every closed walk must equal the
        independently computed residue alpha mod n of the principal ideal the loop represents. Anything
        below is an implementation error and halts the experiment; this is a solver-independent
        certificate re-verifiable by code that never touches the isogeny construction.
    - metric: principal_residue_agreement
      direction: different
      minimum_effect: >-
        100 percent, zero tolerance. This is the baseline-embedding reproduction check.
    - metric: predictor_accuracy_of_chi_from_cheap_labels
      direction: higher
      minimum_effect: >-
        Must exceed the permutation null's 99th percentile by at least the stated minimum detectable
        effect. At N = 331 chance is 1/330 = 0.0030 and with 72 curves per level the effect floor is
        coarse; the run must REPORT the minimum detectable effect and REFUSE to interpret an effect below
        it, rather than quoting a p-value.
    - metric: chi_uniformity_statistic
      direction: different
      minimum_effect: >-
        Reported with its power. A significant departure from uniform on (Z/N)^* is itself a finding about
        the least-x labelling, independent of any predictor.
    - metric: crater_control_accuracy
      direction: higher
      minimum_effect: >-
        Near 1.0 at the h = 3 crater level. Failure here VOIDS every negative read from the larger level.
    - metric: random_relabelling_null_accuracy
      direction: lower
      minimum_effect: >-
        At chance, 1/330 within Monte-Carlo error. Success here means the predictor is fitting labels, not
        chi, and the positive arm is void.
    - metric: compression_ratio_N_over_h
      direction: higher
      minimum_effect: >-
        At least sqrt(N) up to the class-number constant. This is arithmetic, reported to make OBS-CARD a
        measured obstruction with units rather than a verdict.
  test_boundary:
    instances:
      - >-
        One level of the p = 4001, t = 30 ordinary class (the h = 72 floor is the richest), with the
        horizontal l = 3, 5, 7 isogeny graph
      - The h = 3 crater level of the same class, as the nearby-object positive control
      - >-
        A randomly relabelled torsor of the same size, where chi is uniform by construction
      - >-
        An adversarially chosen labelling for which chi IS a known function of a cheap label, as the
        instrument positive control
    parameters:
      p: 4001
      t: 30
      group_order: 3972 = 2^2 * 3 * 331
      N: 331
      cofactor: 12
      split_primes: [3, 5, 7]
      floor_level_size: 72
      crater_level_size: 3
      permutation_draws: 10000
      labelling: least-x
    implementation: >-
      Exhaustive discrete logarithm in a group of order 331 to compute chi on every edge; the existing
      point-based horizontal isogeny tooling for the graph; a predictor fitted with strict held-out
      splitting and a permutation test, run identically on the real, random-relabelling and crater arms.
      NO VERTICAL ISOGENY IS USED.
    budget:
      wall_clock_seconds: 7200
      cpu_hours: 4.0
      maximum_memory_gb: 8
      maximum_runs: 16
  falsification_conditions:
    - >-
      The loop certificate fails anywhere. The implementation is wrong; NO mathematical conclusion of any
      kind may be drawn, and the failure is an instrument finding rather than evidence.
    - >-
      The predictor's held-out accuracy sits within Monte-Carlo error of 1/330 on every feature subset and
      every tested l, WHILE the crater control and the instrument positive control both pass. C5's
      optimistic branch is refuted at this scope: the least-x labelling carries no torsor information
      recoverable from these cheap labels, the obstruction is MEASURED with a stated minimum detectable
      effect, and the lane gains a closure rather than a fatigue report.
    - >-
      The predictor beats chance materially and survives the random-relabelling null and the permutation
      test. C5's optimistic branch SURVIVES; the record becomes a VECTORIZATION lead rather than an ECDLP
      lead, must be routed to an independent review-adversarial session before any statement, and its
      end-to-end cost charged against the sqrt(h) baseline before the word "faster" is used.
    - >-
      The crater control fails at h = 3. The instrument cannot detect a signal it is guaranteed to face,
      no negative may be recorded, and the run is marked attempted and inconclusive.
    - >-
      C4's compression bound is found wrong, i.e. some class has h comparable to N. That would require
      |D| about p^2, impossible for D = t^2 - 4p with |t| at most 2 sqrt(p), so a failure here would
      indicate an ARITHMETIC ERROR in this record rather than a mathematical surprise. It is listed
      because a falsification condition that cannot fire should be identified as such rather than padded
      into the list silently.
  distinguishable_outcomes:
    label_independence_measured: >-
      The predictor is at chance on every feature subset and every tested l, while the crater control and
      the instrument positive control pass and the loop certificate is 100 percent. MEANING: H1 holds at
      this scope; cheap labels carry no torsor information under the least-x labelling, and the
      obstruction is MEASURED with a stated minimum detectable effect. Scoped to ONE labelling, ONE class
      and finitely many primes.
    vectorization_lead: >-
      The predictor beats chance materially and survives both nulls. MEANING: a partial poly-time
      trivialisation of the torsor exists for this labelling; this is a VECTORIZATION lead, NOT an ECDLP
      result (C4 forecloses that independently), and it must be charged end-to-end against the sqrt(h)
      meet-in-the-middle baseline before any comparative statement.
    predictor_fits_labels: >-
      The predictor succeeds on the RANDOM-RELABELLING null, where chi is uniform by construction.
      MEANING: it is fitting the label set rather than chi; the positive arm is VOID.
    instrument_without_power: >-
      The crater control fails at h = 3, or the adversarial-labelling positive control is not found.
      MEANING: attempted and inconclusive; the instrument cannot detect a signal it is guaranteed to
      face, and no negative may be recorded.
    implementation_error: >-
      The loop certificate fails, or the principal-residue rule does not hold. MEANING: the pipeline is
      wrong; nothing mathematical is reportable, and this is detected WITHOUT reference to the hypothesis
      under test.
    scope_reduced_to_l3: >-
      The horizontal graph is not 2-regular for l = 5 or l = 7, because their kernel points are not
      F_p-rational. MEANING: H2 fails for those primes; the experiment runs on l = 3 alone and SAYS SO. It
      does not substitute a different construction silently. This is the most likely practical failure.
    chi_non_uniform: >-
      The chi distribution departs significantly from uniform on (Z/N)^*. MEANING: a finding about the
      least-x labelling itself, independent of any predictor, and reported separately because the
      x-coordinate distribution of G is not uniform in F_p.
  interpretation_limits:
    - >-
      TOY TIER. p = 4001 (12 bits), N = 331 (9 bits), one class, one labelling, three split primes.
      Nothing transfers to cryptographic scale and no transfer is offered.
    - >-
      C4 FORECLOSES THE ECDLP DIRECTION INDEPENDENTLY OF EVERY MEASUREMENT. No outcome of the experiment
      can produce an ECDLP claim through this bridge, and this record may not be cited as if it could.
    - >-
      A POSITIVE IN C5 IS A VECTORIZATION LEAD, NOT AN ECDLP RESULT, and it is scoped to ordinary
      prime-field classes of the tested shape. Its relevance to constructions living on supersingular
      curves over F_p with a different endomorphism structure is NOT asserted and would need its own
      argument.
    - >-
      THE COCYCLE LANGUAGE IS DESCRIPTIVE, NOT LOAD-BEARING. Every claim can be stated without
      cohomology; the language makes the labelling-dependence explicit and no theorem is imported from it.
    - >-
      TINY N IS THE SINGLE LARGEST LIMITATION. At N = 331 chance accuracy is 0.30 percent and 72 curves
      per level give a predictor almost no data; overfitting is the default outcome and only strict
      held-out splitting plus a permutation test can control it. A null at this N bounds only LARGE
      effects, and the minimum detectable effect must be computed and reported BEFORE the fit.
    - >-
      Feature collinearity: the rational-2-torsion count, the group structure and the ell = 2 volcano
      level are the SAME quantity on this class. Treating them as three features triples the apparent
      search without adding information and inflates the multiple-comparison burden; they must be declared
      as ONE feature.
    - >-
      Cofactor 12: G is reached by multiplying by 12, so a point of order dividing 12 maps to the
      identity and the least-x search must skip it. The lifting routine must assert order exactly 331;
      this degeneracy family has already cost this campaign a retracted measurement.
