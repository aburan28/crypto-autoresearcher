# H-VOLC-520108 — specified from IDEA-20261006-52015b.
# The proposal file is the byte-for-byte copy from
# origin/design/ntru-bd02d9-fatigue. Protocol approval is
# DEC-20261006-e791e0. This record asserts no change in the discrete-log
# exponent 1/2. The design session did not build a volcano and did not
# compute Y.
hypothesis:
  id: H-VOLC-520108
  question_id: RQ-VOLC-f6253b
  source_proposal: IDEA-20261006-52015b
  status: approved
  status_note: >-
    approved means the measurement protocol in EXP-VOLC-75c6bd is
    approved for a later executor. It does not mean the floor mean of
    Y and the crater mean of Y differ by at least 0.25. Status moves
    only by DEC-20261006-e791e0 under the standing user authorization
    of 2026-09-06. This design session wrote no run artifact and did
    not evaluate Y.
  proposed_by: coordinator
  conversion_note: >-
    The gap 0.25, the search from 307 through primes below 2000, the
    exclusion of j in {0, 1728}, the floor-size floor of two curves,
    and the strict inequality below 0.25 as the negative are carried
    from IDEA-20261006-52015b. The Coordinator pinned the short
    Weierstrass S_3, the reduced model, the Vélu edge rule, the
    2-core crater, the abscissa rule for a rational 2-torsion point,
    and the integer comparison 4*|n_c*F - n_f*C| >= n_f*n_c.

  statement: >-
    TEST BOUNDARY. Search primes upward from 307 inclusive while
    p < 2000. The sample is the first prime whose ordinary rational
    2-isogeny graph, built by the frozen rules in EXP-VOLC-75c6bd,
    has a qualifying component: a nonempty crater (the 2-core), a
    floor at graph distance at least 1 from that crater, at least
    two floor vertices, and no vertex of j-invariant 0 or 1728.
    Ties at that prime are broken by smallest trace, then smallest
    crater j, before Y is computed. On each curve of that component,
    x1 < x2 are the two smallest liftable abscissae in {0, ..., p-1},
    and Y is the number of distinct roots X in F_p of the frozen
    S_3(x1, x2, X) that are themselves liftable. Y is an integer in
    {0, 1, 2}. Let F be the sum of Y on the floor, n_f the floor
    size, C the sum of Y on the crater, and n_c the crater size.

    PRE-REGISTERED PREDICTION, fixed before any executor run. After
    the graph, formula-check, point-count, and BSGS gates pass, the
    integer comparison 4*|n_c*F - n_f*C| >= n_f*n_c holds. That is
    the absolute gap of the two means being at least 1/4. The same
    gates with the strict opposite inequality are the negative. A
    component that fails the depth or floor-size rule is replaced
    by continuing the search and is not scored as a zero gap. If no
    prime below 2000 qualifies, that is no_qualifying_volcano, not
    a zero gap. The exponent 1/2 is not claimed to move.

    DISTINGUISHABLE OUTCOMES. (1) The gates pass and the integer
    comparison holds: the prediction holds on this one volcano.
    (2) The gates pass and 4*|n_c*F - n_f*C| < n_f*n_c: the gap is
    strictly below 0.25. (3) The collinear-triple audit disagrees
    with the S_3 root set: the formula is wrong and the gap is not
    evidence. (4) No prime below 2000 yields a qualifying component.
    (5) The four-trace null cannot be built: the between-class
    control is missing and the gap is not scored. (6) BSGS returns
    a scalar other than 2: the cell is void. (7) A timeout:
    infrastructure, not a mathematical negative.

  mechanism: >-
    The tracked object is Y(E), the number of liftable F_p-roots of
    one univariate slice S_3(x1(E), x2(E), X). Semaev's third
    summation polynomial has degree 2 in the free variable, so Y is
    in {0, 1, 2}. The representation is the reduced short-Weierstrass
    model of one j, together with the ordered field elements
    x1 < x2. The operation set used to label levels is the set of
    rational 2-isogenies, not translation on the prime-order
    subgroup. A vertical 2-isogeny identifies prime-order subgroups
    and preserves any cost that factors through the abstract triple
    (group, base, target). It does not preserve the field ordering
    of abscissae. Y reads that ordering, so a level gap in Y is a
    coordinate-dependent statistic. The projection discards the
    kernel polynomial, the conductor, and every abscissa except
    x1, x2, and the liftable roots. Whether the floor mean and the
    crater mean differ by at least 0.25 is the measurement. This
    is not a first-fall degree, not a division-polynomial root, and
    not a claim that index calculus beats rho.

  assumptions:
    - The sample is the first prime p with 307 <= p < 2000 whose ordinary 2-isogeny graph contains a qualifying component under the frozen tie-break. A rejected component is not a zero gap.
    - Level is graph distance to the 2-core in the undirected rational 2-isogeny graph of one trace. The floor is the set of vertices at maximal distance, and that distance is at least 1, with at least two floor vertices.
    - x1 and x2 are the two smallest distinct liftable abscissae in {0, 1, ..., p-1}, including a rational 2-torsion abscissa once. A curve with fewer than two liftable abscissae is unscored and the component is replaced.
    - S_3 is the frozen degree-2 polynomial in EXP-VOLC-75c6bd. One reduced model per j is fixed before Y is computed. j in {0, 1728} disqualifies the component.

  proof_search_map:
    bottleneck: >-
      Whether the absolute floor-crater gap of the mean of Y is at
      least 0.25 on the one volcano the search returns. The exponent
      1/2 is a different quantity.
    baseline_embedding:
      parameter_slice: >-
        Primes from 307 inclusive to the first qualifying p below
        2000, the reduced model, the frozen S_3, and the integer
        comparison in EXP-VOLC-75c6bd.
      reproduction_check: >-
        On the audit curve, the liftable roots of S_3 agree with the
        collinear-triple search. Every Vélu edge joins two curves of
        equal point count. BSGS on the planted scalar 2 returns 2.
    observation_collision:
      observable: absolute gap of the floor mean of Y and the crater mean of Y
      distinct_preimage_search: >-
        The collinear-triple set on the audit curve must equal the
        liftable root set of S_3. If it does not, the polynomial is
        not the summation polynomial and the gap is not scored.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The pair of rational means, compared by the integer
          inequality 4*|n_c*F - n_f*C| >= n_f*n_c.
        predicted_gain: >-
          The inequality holds, or the strict opposite holds as the
          named negative.
    quantifier_order: >-
      There exists the first qualifying volcano below 2000 such that,
      after the gates, the floor mean and the crater mean of Y differ
      by at least 1/4. Not for all primes, and not for all slices of
      S_3.
    method_ceiling:
      strongest_certifiable_claim: >-
        On this one volcano, either the gap is at least 0.25 or the
        gap is strictly below 0.25, after the gates. No ECDLP solve
        and no exponent change is certifiable from Y.
      nearby_object_control: >-
        Four ordinary curves of four other traces at the same p. Their
        Y range is the between-class comparison. It is recorded and it
        is not the primary gap.
    proof_obligations:
      - claim: The gap comparison is the integer inequality 4*|n_c*F - n_f*C| >= n_f*n_c.
        responsibility: correctness
      - claim: A finished strict inequality the other way is a negative, and a missing volcano is not.
        responsibility: baseline
      - claim: No exponent change is inferred.
        responsibility: scope
    not_applicable_reason: >-
      The map above audits one mean-gap comparison on one toy volcano.
      It is not a proof that a summation polynomial beats or fails the
      generic bound beyond KR-RHO-13bf67.

  rerandomization: >-
    There is no re-randomizing walk. The volcano is a full enumeration
    under a frozen tie-break. The four other traces are a null of the
    same shape at the same p, not a reduction from a worst-case
    discrete log.

  asymptotic_claim:
    problem: >-
      Whether the floor-crater gap of mean Y is at least 0.25 on the
      one volcano returned by the search. ECDLP is not claimed to be
      faster.
    prior_best: >-
      Pollard rho at exponent 1/2 (KR-RHO-13bf67). Isogenous curves
      share group order (KR-RHO-755e35). Naive prime-field Semaev
      index calculus does not beat generic algorithms (KR-IC-5931ee).
      The exponent stays 1/2.
    time_exponent: unchanged
    memory_exponent: unchanged
    hidden_cofactor: >-
      No algorithmic o(1) term is claimed. The polynomial degree is 2
      and Y is capped at 2. The threshold 0.25 is the pre-registered
      gap, not a hidden cofactor.
    claim_kind_note: >-
      No exponent improvement, cofactor improvement, or constant-factor
      improvement of ECDLP is claimed, so none of those three labels
      is applied.

  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        For the frozen liftable x1 and x2 on each curve of the chosen
        volcano, the two roots of S_3(x1, x2, X) behave as candidates
        for liftable abscissae like two uniform draws in F_p, so the
        mean of Y is on the order of 2 times (number of liftable
        abscissae) / p. The pre-registered effect is not a fit to that
        model. It is an absolute floor-crater gap of at least 0.25.
      random_model_justification: >-
        Degree 2 is the structural half, recorded on KR-IC-5a43e5.
        Uniformity of the roots among field elements is the
        distributional half and is not a theorem used as support here.
        The gap 0.25 is the comparison named in IDEA-20261006-52015b.
      supporting_results:
        - ref: IDEA-20261006-52015b
          provenance: internal
          claim: >-
            The proposal states the absolute floor-crater gap of at
            least 0.25, and the strict inequality below 0.25 as
            falsification.
          verified_by: ledger/proposals/IDEA-20261006-52015b.yaml
        - ref: KR-IC-5a43e5
          provenance: internal
          claim: >-
            S_3 is explicit and has degree 2 in each variable. Using
            summation polynomials to decompose over a factor base is
            the index-calculus framework. This hypothesis does not
            decompose a target.
          verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
        - ref: KR-RHO-13bf67
          provenance: internal
          claim: >-
            Generic algorithms for a prime-order discrete logarithm
            need Omega(sqrt(N)) group operations. This hypothesis
            does not beat that floor.
          verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
      validation_experiment_ids:
        - EXP-VOLC-75c6bd
      falsification_condition: >-
        The gates pass and 4*|n_c*F - n_f*C| < n_f*n_c. A formula
        disagreement, a missing volcano, or a wrong BSGS answer does
        not falsify the heuristic.

  structural_ingredients:
    - description: >-
        S_3 vanishes when three points with those abscissae sum to
        zero up to signs, and it has degree 2 in the free variable.
      citation: KR-IC-5a43e5
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
      role: degree bound for Y, not a solver
    - description: >-
        A generic-group discrete logarithm in a prime-order group
        needs Omega(sqrt(N)) group operations.
      citation: KR-RHO-13bf67
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
      role: exponent ceiling this hypothesis does not cross
    - description: >-
        Over a finite field, isogenous curves have the same number of
        points, and walking the isogeny class does not reach a
        different group-structure weakness.
      citation: KR-RHO-755e35
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
      role: scope limit, Y is not a group-order gap
    - description: >-
        Rational ell-isogenies organise an ordinary isogeny class
        into levels. This session did not open Kohel's thesis.
      citation: Kohel ell-isogeny volcanoes
      provenance: recalled
      verified_by: null
      role: name of the level decomposition the graph distance implements

  reduction_chain:
    core_problem: >-
      The numerical comparison of two means of an integer in {0, 1, 2}
      on the floor and the crater of one toy 2-volcano.
    corollaries: []

  predictions:
    - metric: floor_minus_crater_mean_Y
      direction: different
      minimum_effect: >-
        4*|n_c*F - n_f*C| >= n_f*n_c, which is an absolute difference
        of the two means of at least 0.25.

  test_boundary:
    instances:
      - the first qualifying ordinary 2-volcano for a prime p with 307 <= p < 2000
    parameters:
      prime_start: 307
      prime_limit_exclusive: 2000
      minimum_gap: '1/4'
      minimum_floor_curves: 2
      minimum_level_gap: 1
      excluded_j: [0, 1728]
    implementation: >-
      Exact field arithmetic, the frozen S_3, Vélu edges with equal
      point counts, and full enumeration of one component.
    budget:
      maximum_runs: 1
      enforcement: advisory

  falsification_conditions:
    - The gates pass and 4*|n_c*F - n_f*C| is strictly less than n_f*n_c. That is an absolute mean gap strictly below 0.25.
    - The collinear-triple audit disagrees with the liftable roots of S_3, in which case the formula is wrong and the gap is not evidence.
    - Every curve in the chosen component receives the same level, in which case there is no depth contrast and the gap is not scored.

  interpretation_limits:
    - A gap in Y is not a gap in rho steps and does not move the exponent 1/2.
    - Costs that factor through the transported prime-order subgroup are outside this claim. Y uses field-absolute abscissae.
    - The result closes only this slice of S_3 on the one volcano the search returns, at claim tier toy.
    - This is not a first-fall-degree comparison and not a claim that index calculus beats rho.
    - KR-RHO-13bf67 remains the generic-group floor. This hypothesis does not contradict it.

  citations:
    - ref: IDEA-20261006-52015b
      provenance: internal
      claim: >-
        Source prediction and falsifier, carried into this hypothesis
        without a change of threshold.
      verified_by: ledger/proposals/IDEA-20261006-52015b.yaml
    - ref: RQ-VOLC-f6253b
      provenance: internal
      claim: >-
        Depth may be admitted as an attack-cost effect only if it
        survives stratified nulls and is routed through a named
        non-generic resource. On the prime-order subgroup every
        endomorphism acts as a scalar.
      verified_by: ledger/questions/RQ-VOLC-f6253b.yaml
    - ref: KR-IC-5a43e5
      provenance: internal
      claim: >-
        S_3 vanishes exactly when points with those x-coordinates sum
        to zero up to signs, and the degree in each variable is 2.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Isogenous curves over a finite field have the same number of
        points. Walking the class does not reach a different
        group-structure weakness.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        Generic algorithms for a prime-order discrete logarithm need
        Omega(sqrt(N)) group operations.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-IC-5931ee
      provenance: internal
      claim: >-
        Under the stated statistical assumptions, naive Semaev index
