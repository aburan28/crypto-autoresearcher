        The counts 11, 10, and 10. Not a scalar multiplication.
      nearby_object_control: >-
        Two readings of the addition count. Both are 10, and the gap is 0.
    proof_obligations:
      - claim: The bit length of 2047 is 11.
        responsibility: correctness
      - claim: The doubling count is 10 and the addition count is 10.
        responsibility: correctness
      - claim: The nearby gap is 0 and the nearby product is 100.
        responsibility: scope
    not_applicable_reason: null
