  title: >-
    The integer 2047 has 10 doublings and 10 additions
  statement: >-
    The integer 2047 has bit length 11. Its bits are eleven 1s.
    Reaching it by doubling and adding uses 10 doublings and 10
    additions. Eleven exceeds ten by 1. Ten equals ten, so that gap
    is 0. The product of 11, 10, and 10 is 1100. Their sum is 31.
    Two readings of the addition count are both 10, so that gap is 0
    and their product is 100.
  mechanism: >-
    The proposal writes the counts 11, 10, and 10. This contract
    checks those integers. It does not add a curve point.
  assumptions: []
  proof_search_map:
    bottleneck: The gap between bit length 11 and addition count 10.
    baseline_embedding:
      parameter_slice: >-
        The counts 11, 10, and 10 in IDEA-20261004-91520b, read
        2026-10-04. The gaps, the product, and the sum were
        recomputed in this design session. That computation is
        not a run.
      reproduction_check: >-
        One route reads the bits of 2047. The other counts the
        doublings and additions. They must agree that the counts
        are 11, 10, and 10.
    observation_collision:
      observable: The addition count 10 and the product 1100.
      distinct_preimage_search: >-
        Reporting the addition count as 11 drops the gap against
        the bit length. Two readings of the addition count make
        that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The counts 11, 10, and 10.
        predicted_gain: Integer counts. No curve addition.
    quantifier_order: >-
      The bit length 11 comes first, then the doubling count 10,
      then the addition count 10, then the nearby gap 0.
    method_ceiling:
