  title: >-
    The integer 11 has 3 doublings and 2 additions
  statement: >-
    The integer 11 has bit length 4 and binary weight 3. Reaching
    it by doubling and adding uses 3 doublings and 2 additions.
    Four exceeds three by 1. Three exceeds two by 1. The product
    of 4, 3, and 2 is 24. Their sum is 9. Two readings of the
    addition count are both 2, so that gap is 0 and their product
    is 4.
  mechanism: >-
    The proposal writes the counts 4, 3, and 2. This contract
    checks those integers. It does not add a curve point.
  assumptions: []
  proof_search_map:
    bottleneck: The gap between bit length 4 and addition count 2.
    baseline_embedding:
      parameter_slice: >-
        The counts 4, 3, and 2 in IDEA-20261003-7a264e, read
        2026-10-03. The gaps, the product, and the sum were
        recomputed in this design session. That computation is
        not a run.
      reproduction_check: >-
        One route reads the bits of 11. The other counts the
        doublings and additions. They must agree that the counts
        are 4, 3, and 2.
    observation_collision:
      observable: The addition count 2 and the product 24.
      distinct_preimage_search: >-
        Reporting the addition count as 3 drops the gap against
        the doubling count. Two readings of the addition count
        make that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The counts 4, 3, and 2.
        predicted_gain: Integer counts. No curve addition.
    quantifier_order: >-
      The bit length 4 comes first, then the doubling count 3,
      then the addition count 2, then the nearby gap 0.
    method_ceiling:
      strongest_certifiable_claim: >-
        The counts 4, 3, and 2. Not a scalar multiplication.
      nearby_object_control: >-
        Two readings of the addition count. Both are 2, and the gap is 0.
    proof_obligations:
      - claim: The bit length of 11 is 4.
        responsibility: correctness
      - claim: The doubling count is 3 and the addition count is 2.
        responsibility: correctness
      - claim: The nearby gap is 0 and the nearby product is 4.
        responsibility: scope
    not_applicable_reason: null
