hypothesis:
  id: H-ECDLP-29400c
  question_id: RQ-ECDLP-002
  statement: >-
    Formalises IDEA-20260808-c5f9a2, WITH ITS ENTIRE PREDICTED BAND REMOVED
    BECAUSE THE ORACLE IT DESCRIBES IS CONSTANT ON THE OBJECT IT IS RUN ON. The
    source proposes an endomorphism-image oracle
    O_phi : E(F_p) -> {yes, no}, answering whether a point lies in phi(E(F_p)),
    and predicts Y_phi / Y_exhaust = m/d for an endomorphism of degree d, with a
    ladder d in {1, 2, 4, 9} on which the ratio must decay like 1/d.
    THAT LADDER CANNOT MOVE. The source's own test boundary places the target in
    a PRIME-ORDER subgroup G = <P> of order N. Every endomorphism phi of E with
    gcd(deg phi, N) = 1 acts on G as multiplication by a scalar lambda in
    (Z/N)^*, because End(E) acts on the one-dimensional F_N-vector space G
    through a ring map to Z/N. Multiplication by a unit is a bijection, so
    phi(G) = G and O_phi restricted to G answers "yes" for EVERY point, for
    EVERY d. Its Shannon information about anything is exactly 0 bits,
    identically, at d = 1, d = 2, d = 4 and d = 9 alike. In particular the
    source's phi_2, multiplication by 2, is a bijection on any odd-order group,
    and its phi_1, the j = 0 automorphism, is surjective on all of E. The
    probability "R - P_i lies in phi(E)" is 1, not 1/d, so the predicted m/d
    ladder is unreachable for every parameter value in the declared range and
    both arms return the same multiplicity artifact.
    WHAT THIS RECORD CLAIMS INSTEAD, in three separable parts.
    (A, DERIVATION, not an arm) phi(G) = G for every endomorphism with
    gcd(deg phi, N) = 1 on a prime-order subgroup, so the image oracle carries
    exactly 0 bits about any property of a point of G. Its falsifier would be a
    contradiction in elementary group theory, so it is archived as a derivation
    note and not measured.
    (B, MEASURED, on the only object where the test is non-trivial) On the FULL
    group E(F_p) of even order, the image of multiplication by 2 has index 2^t
    where t is the F_2-rank of E(F_p)[2], so the coset indicator is a genuine
    2^t-to-1 partition. The claim under test is that the empirical mutual
    information, in BITS, between that indicator and the event "this point
    completes a relation over the factor base" is exactly 0.
    (C, MEASURED, cost) Charging the coset test, filtering candidates by coset
    membership multiplies the cost per distinct relation by exactly 2^t plus the
    oracle's own cost, because it discards a 1 - 2^{-t} fraction of candidates
    without reducing the per-candidate decomposition cost. The predicted cost
    ratio is therefore at or above 2^t, which is the OPPOSITE direction from the
    source proposal's advantage.
  mechanism: >-
    An image oracle is a coset indicator. On a prime-order subgroup there are no
    proper subgroups other than the identity, so every endomorphism prime to the
    order is an automorphism of that subgroup and the indicator is constant.
    That is the whole reason the source's ladder is inert. On the full group
    with even order the indicator is informative about the coset and therefore
    about 2-divisibility, but relation completion over a factor base is a
    property of subset sums, and there is no mechanism by which 2-divisibility
    constrains subset sums; measuring their mutual information is the honest
    test of whether one exists.
    On cost, restricting to one coset examines B/2^t candidates instead of B
    while leaving the per-candidate arity-(m-1) completion cost unchanged, so
    the work per relation rises by 2^t. Deciding membership in 2E(F_p) requires
    a point halving or a character computation at O(log^2 p) field operations,
    which is charged on top.
  assumptions:
    - >-
      For part B and part C only, E(F_p) has even order and its 2-torsion rank
      t is computed exactly per curve and reported per curve. Curves are
      hygiene-screened with the factored group order and an explicit
      "#E(F_p) != p" check.
    - >-
      The endomorphism is known and efficiently computable, and its degree is
      known. Its image test is implemented concretely and charged, never assumed
      free.
    - >-
      The arity-(m-1) completion is exact and exhaustive, so the only difference
      between the filtered and unfiltered arms is which candidates are examined.
    - >-
      Relations are counted as deduplicated unordered multisets, so no arm can
      gain from re-counting the same relation under a different distinguished
      element.
  proof_search_map:
    bottleneck: >-
      Whether any coset partition of the ambient group carries information about
      factor-base decomposability, which is the only way an image oracle could
      reduce relation-search work.
    baseline_embedding:
      parameter_slice: >-
        The prime-order subgroup, where the image test is provably constant.
        The filtered and unfiltered arms must then be bit-identical, and any
        measured difference there is an implementation defect.
      reproduction_check: >-
        Symbolic. For each tested curve, verify computationally that
        phi(G) = G by checking that phi restricted to G is a bijection, and
        record the scalar lambda with phi(Q) = [lambda]Q for a generator Q.
    observation_collision:
      observable: The coset indicator of a point under an endomorphism image.
      distinct_preimage_search: >-
        COLLISION IS TOTAL ON THE PRIME-ORDER SUBGROUP. Every point of G has
        the same indicator value, so the observable has a single fibre and
        separates nothing. On the full group the fibres are the 2^t cosets, and
        the question is whether they separate decomposable from non-decomposable
        points, which is what the mutual information measures.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Partition the ambient group by endomorphism-image coset and search one
          coset.
        predicted_gain: >-
          NEGATIVE, and computed as such. Cost per distinct relation rises by
          exactly 2^t plus the oracle's own cost.
    quantifier_order: >-
      FOR ALL tested curves with even order and FOR ALL tested 2-torsion ranks t
      in {1, 2}, the measured mutual information between the coset indicator and
      relation completion is reported with an interval. No endomorphism is
      selected after seeing a measurement, and the curve panel is fixed before
      any target is drawn.
    method_ceiling:
      strongest_certifiable_claim: >-
        At toy sizes, a measured mutual information in bits and a measured cost
        ratio for coset filtering, on curves of even order, plus a derivation
        that the whole construction is inert on the prime-order subgroup where
        the ECDLP actually lives. Nothing about cryptographic scale and nothing
        about endomorphisms in general.
      nearby_object_control: >-
        The abstract pair (Z/2N', +) with the index-2 subgroup 2(Z/2N'), which
        reproduces the coset structure with no curve and no endomorphism.
    proof_obligations:
      - claim: phi(G) = G on a prime-order subgroup for gcd(deg phi, N) = 1.
        responsibility: correctness
      - claim: The filtered and unfiltered arms are bit-identical on the prime-order subgroup.
        responsibility: baseline
      - claim: The mutual-information estimator returns a planted leak at its planted value.
        responsibility: correctness
      - claim: The coset test's own cost is charged in the same unit as everything else.
        responsibility: runtime
      - claim: Relations are deduplicated as unordered multisets in every arm.
        responsibility: correctness
      - claim: The curve-free abelian null separates coset structure from elliptic structure.
        responsibility: strictness
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        For a random target R and a random factor base V of size B, the
        probability that R decomposes over V at arity m is B^m / (m! N) up to
        1 + o(1), assuming subset sums of V behave like independent uniform
        elements of the group.
      random_model_justification: >-
        The classical occupancy model; the union bound gives the upper bound
        with no independence assumption and the heuristic is tightness.
      supporting_results:
        - Union bound, elementary and internal.
      validation_experiment_ids:
        - EXP-ECDLP-3997af
      falsification_condition: >-
        Measured decomposition fraction deviates systematically from
        B^m / (m! N) beyond the sampling interval at the largest B.
  structural_ingredients:
    - description: >-
        Source proposal. The endomorphism-image oracle for structural
        partitioning, and the m/d ladder that this record shows to be inert on
        the declared object.
      citation: IDEA-20260808-c5f9a2
      provenance: internal
      verified_by: >-
        TASK-20260904-c063e5 coordinator. Full read of
        ledger/proposals/IDEA-20260808-c5f9a2.yaml, 383 lines, Read tool,
        2026-09-04.
      role: originating claim, corrected here
    - description: >-
        The rejected x-oracle MITM yield hypothesis, status "rejected", and its
        committed exact equality Y_A = Y_B across 40 configurations.
      citation: H-XOR-d1a480
      provenance: internal
      verified_by: >-
        TASK-20260904-c063e5 coordinator. Full read of
        ledger/hypotheses/H-XOR-d1a480.yaml, 103 lines, Read tool, 2026-09-04.
      role: the obstruction the source proposal claims to avoid
    - description: >-
        reject_scoped on H-XOR-d1a480, recording Y_A_mean = Y_B_mean =
        0.01212636 and disclosing that EV-ECDLP-65b004's four artifact hashes
        are fabricated placeholders.
      citation: DEC-20260808-6a7ac4
      provenance: internal
      verified_by: >-
        TASK-20260904-c063e5 coordinator. Full read of
        ledger/decisions/DEC-20260808-6a7ac4.yaml, 210 lines, Read tool,
        2026-09-04.
      role: committed baseline and its disclosed integrity defect
  reduction_chain:
    core_problem: >-
      Whether a coset partition of the ambient curve group reduces relation
      search over a factor base, at toy prime-field sizes.
    corollaries: []
  predictions:
    - metric: >-
        oracle_information_on_prime_order_subgroup, in bits
      direction: lower
      minimum_effect: >-
        Exactly 0 bits, DERIVED not measured, because phi(G) = G makes the
        indicator constant. Archived as a derivation note under
        docs/claims-and-verification.md refutation artifacts. No band, no
        interval, no arm.
    - metric: >-
        mutual_information_bits, empirical mutual information between the
        coset indicator of R - P_i under multiplication by 2 and the event that
        R - P_i completes a relation over V, on the FULL group E(F_p) of even
        order, in bits
      direction: lower
      minimum_effect: >-
        0 bits. Pre-registered null band [0, 0.01] bits. The plug-in estimator's
        upward bias at n = 100000 samples and a 2-by-2 table is
        1/(2 n ln 2) = 7.2e-6 bits, so the band is more than three orders of
        magnitude above the bias floor and is not a threshold chosen to be easy
        to clear. The planted-leak control at exactly 0.25 bits is 25 band
        widths away and fixes the instrument's dynamic range.
    - metric: >-
        coset_filter_cost_ratio, dimensionless, charged cost per distinct
        verified relation for the coset-filtered arm divided by the unfiltered
        arm, in one unit of F_p multiplications with the coset test charged
      direction: higher
      minimum_effect: >-
        At or above 2^t. At t = 1 the predicted value is 2.0 with band
        [1.9, 2.3]; the source proposal's advantage requires a value strictly
        below 1.0, which is at least 0.9 from the band's lower edge. The
        direction of this prediction is the OPPOSITE of the source proposal's.
    - metric: >-
        curve_free_agreement, the (Z/2N', +) null's mutual information and cost
        ratio minus the elliptic arm's, dimensionless and in bits
      direction: different
      minimum_effect: >-
        Predicted 0 within the pooled interval. CONSEQUENCE PRE-STATED,
        agreement means the finding is about index-2^t subgroup filtering in
        finite abelian groups and may NOT be reported as a statement about
        elliptic curves, endomorphisms, or the ECDLP.
  test_boundary:
    instances:
      - >-
        Toy prime-field curves at p in {101, 103, 107, 211, 1009, 2003},
        selected so that at least three have E(F_p) of even order with
        2-torsion rank t = 1 and at least two with t = 2, each reported per
        curve. Curves with j = 0 or j = 1728 are reported as a separate stratum
        and never pooled with the random-curve panel.
      - >-
        Curve-free null instances (Z/2N', +) with the index-2 subgroup
        2(Z/2N'), at matched order and matched factor-base size.
    parameters:
      claim_tier: toy
      arity: 3
      samples_per_cell: 100000
      targets_per_cell: 2000
      endomorphisms: multiplication by 2 on the full group; identity and the j=0 automorphism as inert reference points
    implementation: >-
      Not yet written. EXP-ECDLP-3997af declares the required artifacts.
    budget:
      wall_clock_seconds_per_run: 1800
      maximum_memory_gb: 8
      maximum_runs: 6
  falsification_conditions:
    - >-
      TOY-TIER FALSIFIER, and the informative one. Measured mutual information
      exceeds 0.01 bits at any cell while the planted-leak control returns 0.25
      bits within tolerance. Coset membership then does carry information about
      decomposability, the source proposal's mechanism is live in a form it did
      not state, and the arm must be re-specified as a positive experiment.
    - >-
      TOY-TIER FALSIFIER on cost. The coset filter cost ratio falls below 1.0 at
      any cell with the accounting verified. The filter would then be paying for
      itself, which the candidate-count argument says it cannot.
    - >-
      INSTRUMENT VOID. The planted-leak control does not return 0.25 bits within
      plus or minus 0.03; or the filtered and unfiltered arms are not
      bit-identical on the prime-order subgroup; or relations are not
      deduplicated.
    - >-
      SCOPE FALSIFIER. The curve-free (Z/2N', +) null reproduces the elliptic
      arm. The conclusion is then about abelian coset filtering and no elliptic
      or ECDLP statement follows.
    - >-
      INFRASTRUCTURE, NOT EVIDENCE. Timeouts, crashes, memory exhaustion, per
      AGENTS.md rule 5.
  interpretation_limits:
    - >-
      Toy scale, 7 to 11 bit prime fields, arity 3. No claim about
      cryptographic parameters, per AGENTS.md rule 7.
    - >-
      THE MECHANISM IS INERT WHERE THE ECDLP LIVES. Part A is a derivation, not
      a measurement, and it says that on the prime-order subgroup the image
      oracle is constant for every endomorphism prime to the order. Parts B and
      C are therefore run on the FULL group, which is not where the discrete
      logarithm problem is posed, and no result from them transfers to the
      subgroup.
    - >-
      The source proposal's m/d ladder is not measured, because it cannot fire.
      Reporting a measured value near m as confirmation would be reporting the
      same multiplicity artifact that H-ECDLP-cd7072 removes from the
      y-oracle record.
    - >-
      Endomorphism availability is a real limit. A generic curve has no
      endomorphism beyond multiplication by an integer, so parts B and C are a
      statement about multiplication-by-2 coset filtering and nothing wider.
    - >-
      A null result here closes the IMAGE-ORACLE-AS-PARTITION reading only. It
      says nothing about endomorphism-based speedups that act on the search
      itself, such as automorphism-discounted rho, which are a different
      mechanism entirely.
  status: proposed
  proposed_by: idea-generator
