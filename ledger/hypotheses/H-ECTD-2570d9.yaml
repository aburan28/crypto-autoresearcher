# H-ECTD-2570d9 — specified from IDEA-20261005-e7ad98.
# Protocol approval is DEC-20261006-a0a55f. The source idea lives on
# origin/design/pair-3a18d1-hcp and is not copied here.
# This record asserts no trapdoor and no ECDLP algorithm. No point
# enumeration was archived as a run of EXP-ECTD-6b7a5b.
hypothesis:
  id: H-ECTD-2570d9
  question_id: RQ-ECTD-001
  source_proposal: IDEA-20261005-e7ad98
  goal_id: null
  goal_id_note: >-
    This design binds the question RQ-ECTD-001 and does not attach a
    goal record. It does not create one.
  status: approved
  status_note: >-
    approved means the conductor-and-torsion protocol in EXP-ECTD-6b7a5b
    is approved for a later executor. It does not mean conductor 3 or
    the absent 5-torsion was observed in a run. Status moves only by
    DEC-20261006-a0a55f under the standing user authorization of
    2026-09-06. No experiment run was executed in this design.
  proposed_by: coordinator
  conversion_note: >-
    The predicted point count 18, the conductor 3, the absent full
    rational 5-torsion, and the j-residue 7 are carried from
    IDEA-20261005-e7ad98, which was read from
    origin/design/pair-3a18d1-hcp. The Coordinator froze the point-count
    procedure, the fundamental-discriminant extractor, and the controls
    before any run of EXP-ECTD-6b7a5b.

  statement: >-
    TEST BOUNDARY. One curve, E: y^2 = x^3 + x + 1, reduced at the
    single prime p = 13. The instrument enumerates E(F_13) twice, sets
    t = 14 minus the agreed count, sets Delta = t^2 - 52, and extracts
    the conductor of Z[pi] as the largest positive integer f such that
    f^2 divides Delta and Delta/f^2 is a fundamental discriminant. It
    records whether 25 divides the agreed count. It reduces the rational
    j-invariant 6912/31 modulo 13.

    PRE-REGISTERED PREDICTION, fixed before any run. The agreed count is
    18, the conductor is 3, 25 does not divide the count, and the residue
    of j modulo 13 is 7. The headline pair is conductor 3 together with
    absent full rational 5-torsion. A different conductor is a negative.
    The presence of that torsion, meaning 25 divides the agreed count, is
    a negative. A count other than 18, or a j-residue other than 7, is
    also a negative of this same pre-registered package. Success can fail.

    DISTINGUISHABLE OUTCOMES. (1) The controls pass, the two enumerations
    agree, the count is 18, the conductor is 3, 25 does not divide the
    count, and the j-residue is 7: success for the prediction. (2) The
    controls pass, the two enumerations agree, and at least one of these
    holds: the conductor is an integer other than 3, 25 divides the
    count, the count is not 18, or the j-residue is not 7: negative.
    (3) A control fails, the two enumerations disagree, the cubic is
    singular at 13, or the trace is divisible by 13: invalid, not
    evidence. (4) A timeout or crash: failed_infrastructure, not evidence.

    No trapdoor is claimed. No discrete-logarithm algorithm is claimed.
    No exponent moves. The conductor of Z[pi] is public isogeny-class
    data. Toy scope is the one prime p = 13.

  mechanism: >-
    The trace of Frobenius is t = p + 1 - #E(F_p). The discriminant of
    the Frobenius polynomial X^2 - t X + p is Delta = t^2 - 4p. The
    conductor of the quadratic order Z[pi] is the largest positive
    integer f with f^2 dividing Delta such that Delta/f^2 is a
    fundamental discriminant: either congruent to 1 modulo 4 and
    square-free, or divisible by 4 with quotient square-free and
    congruent to 2 or 3 modulo 4. A core that is not congruent to 0 or
    1 modulo 4 is not a discriminant and is rejected. Full rational
    5-torsion would be a subgroup isomorphic to Z/5 x Z/5, hence of
    order 25, so the bit is 1 exactly when 25 divides the agreed point
    count. Heuristic H1 says that on this one ordinary good reduction
    the extractor returns 3 and the bit returns 0. The integers are
    read from the enumeration. They are not written in from the
    prediction. A second enumeration in the opposite x-order must
    agree before either integer is accepted.

  assumptions:
    - The curve is y^2 = x^3 + x + 1 and the prime is 13. A quadratic twist is a different curve.
    - Good reduction means 13 does not divide the discriminant -496 of the cubic.
    - The conductor is the largest f in the definition above, not the largest f whose square divides Delta with the fundamental-discriminant test omitted.
    - The point at infinity is counted once.
    - Toy scope is one prime. No distribution over primes and no transfer to a cryptographic field.

  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
    not_applicable_reason: >-
      Measurement of four pre-registered integers on one prime. No proof
      is attempted, and no exponent is assembled from per-attempt cost
      times inverse success probability.

  asymptotic_claim:
    problem: none — no complexity improvement is claimed
    prior_best: >-
      KR-RHO-13bf67, Omega(sqrt(p)) group operations for a generic-group
      discrete logarithm in a prime-order group. Not beaten.
    time_exponent: unchanged
    memory_exponent: unchanged
    hidden_cofactor: >-
      None in an o(1) term. The output is a point count, a conductor, a
      torsion bit, and a j-residue. No discrete-log walk is stored.
    claim_kind: not_applicable

  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        For E: y^2 = x^3 + x + 1 reduced at p = 13, if the reduction is
        ordinary and good, the conductor of Z[(t + sqrt(t^2 - 4p))/2]
        extracted from the enumerated trace equals 3, and 25 does not
        divide the enumerated group order. The sample is one prime.
      random_model_justification: >-
        The sample is one curve at one prime, plus instrument controls.
        There is no random draw and no tail across primes. The Hasse
        bound |t| <= 2*sqrt(13) is the only size constraint, and the
        predicted trace -4 satisfies it.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECTD-6b7a5b
      falsification_condition: >-
        The controls pass, the two enumerations agree, and the extracted
        conductor is an integer other than 3, or 25 divides the agreed
        count.

  structural_ingredients:
    - description: >-
        KR-RHO-755e35 states that over a finite field, curves are
        isogenous if and only if they have the same number of points, so
        the trace and the conductor of Z[pi] are public isogeny-class
        data. This hypothesis does not hide a weak curve behind an
        isogeny.
      citation: KR-RHO-755e35
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
      role: public-invariant fence; the conductor is not a secret endpoint
    - description: >-
        KR-RHO-13bf67 states that a generic-group discrete logarithm in a
        prime-order group needs Omega(sqrt(p)) group operations. This
        measurement does not beat that bound.
      citation: KR-RHO-13bf67
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
      role: unchanged discrete-log exponent
    - description: >-
        KR-RHO-53c89f states that anomalous curves are the trace-one case
        and that MOV/Frey-Rueck applies when the embedding degree is
        small. The predicted trace here is -4, not 1. No embedding degree
        is computed.
      citation: KR-RHO-53c89f
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-53c89f.yaml
      role: scope fence; this reduction is not the anomalous case
    - description: >-
        KR-RHO-0528e7 states that an automorphism group of order m
        multiplies rho iterations by 1/sqrt(m) and does not change the
        exponent 1/2. This measurement does not use an automorphism walk.
      citation: KR-RHO-0528e7
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-0528e7.yaml
      role: unchanged constant-factor baseline
    - description: >-
        KR-RHO-fbd7b1 states a better average-case ordering at square-root
        memory. This measurement stores no collision table.
      citation: KR-RHO-fbd7b1
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-fbd7b1.yaml
      role: unchanged memory baseline
    - description: >-
        Recalled pointer, text not opened: CM j-invariants are algebraic
        integers, so a non-integral rational j is read as non-CM. This
        record uses the computed denominator of 6912/31 instead of that
        citation. The pointer is not support.
      citation: Silverman, The Arithmetic of Elliptic Curves, CM j-invariants are algebraic integers
      provenance: recalled
      verified_by: null
      role: pointer only; the recorded non-integrality is the denominator of 6912/31

  reduction_chain:
    core_problem: >-
      Whether the ordinary good reduction of y^2 = x^3 + x + 1 at p = 13
      has conductor 3 for Z[pi] and has no full rational 5-torsion.
      Not an attack.
    corollaries: []

  predictions:
    - metric: conductor_of_Z_pi
      direction: different
      minimum_effect: >-
        The conductor equals 3. Any other integer is the negative.
    - metric: full_rational_5_torsion_bit
      direction: lower
      minimum_effect: >-
        The bit equals 0. The value 1, meaning 25 divides the agreed
        count, is the negative.
    - metric: enumerated_point_count_over_F_13
      direction: different
      minimum_effect: The agreed count equals 18. Any other count is a negative of the pre-registered package.
    - metric: j_residue_mod_13
      direction: different
      minimum_effect: The residue equals 7. Any other residue is a negative of the pre-registered package.

  test_boundary:
    instances:
      - E given by y^2 = x^3 + x + 1 over F_13
      - the quadratic twist y^2 = 2(x^3 + x + 1), labeled and not substituted
      - the extractor fixtures Delta = -4, Delta = -3, and Delta = -36
    parameters:
      prime: 13
      predicted_point_count: 18
      predicted_trace: -4
      predicted_discriminant: -36
      predicted_conductor: 3
      predicted_full_rational_5_torsion_bit: 0
      predicted_j_residue: 7
    implementation: >-
      A later executor enumerates the points and extracts the conductor.
      This design does not archive a run.
    budget:
      enforcement: advisory
      maximum_runs: 2
      note: One prime. The second run id is an infrastructure retry, not a second scientific sample.

  falsification_conditions:
    - The controls pass, the enumerations agree, and the extracted conductor is an integer other than 3.
    - The controls pass, the enumerations agree, and 25 divides the agreed count.
    - The controls pass, the enumerations agree, and the agreed count is not 18.
    - The controls pass, the enumerations agree, and the residue of j modulo 13 is not 7.
    - An extractor fixture returns the wrong conductor. That failure is invalid, not a curve negative: the curve conductor is not read.
    - The cubic is singular at 13, the two enumerations disagree, or the trace is divisible by 13. Those failures are invalid.

  interpretation_limits:
    - Toy scope: one ordinary reduction at p = 13. No statement about a cryptographic prime.
    - The conductor of Z[pi] is determined by the trace. By the opened row KR-RHO-755e35 it is public inside the isogeny class. It is a negative control, not a secret endpoint and not a trapdoor.
    - No ECDLP algorithm is claimed. The discrete-log time exponent stays 1/2. The delta versus Pollard rho is 0.
    - The recalled sentence on CM j-invariants is not support. The protocol records the denominator of 6912/31.
    - RQ-ECTD-001 withholds a trapdoor experiment until the Teske primary source is filed. This hypothesis is the measurement named by the idea. It does not file that source and it does not design a trapdoor.
    - q = 13 is one prime. A conductor of 3 here does not say the same curve has conductor 3 at every ordinary prime.

