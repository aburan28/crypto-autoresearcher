        product, and the sum were recomputed in this design
        session. That computation is not a run.
      reproduction_check: >-
        One route computes 2 to the power 21. The other computes 2
        to the power 20. They must agree that the sizes are 2097152
        and 1048576.
    observation_collision:
      observable: The table-size gap 1048576 and the product 2199023255552.
      distinct_preimage_search: >-
        Reporting both tables as size 1048576 drops the gap. Two width-21
        tables make that gap 0.
    constructive_transforms:
