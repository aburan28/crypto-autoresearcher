        The table sizes 2097152 and 1048576. Not a scalar multiplication.
      nearby_object_control: >-
        Two width-21 tables. Both store 1048576, and the gap is 0.
    proof_obligations:
      - claim: Two to the power 21 is 2097152.
        responsibility: correctness
      - claim: Two to the power 20 is 1048576.
