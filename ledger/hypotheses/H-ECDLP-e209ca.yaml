  title: >-
    2097152 exceeds 1048576 by 1048576
  statement: >-
    A window of width 22 stores 2097152 entries. A window of width 21
    stores 1048576. Two to the power 21 is 2097152. Two to the power 20
    is 1048576. Two million ninety-seven thousand one hundred fifty-two
    exceeds one million forty-eight thousand five hundred seventy-six by
    1048576. The product of the two table sizes is 2199023255552. Their
    sum is 3145728. Two width-21 tables each store 1048576, so that gap
    is 0 and their product is 1099511627776.
  mechanism: >-
    The proposal writes the widths 22 and 21 and the sizes 2097152 and
    1048576. This contract checks those integers. It does not add a
    curve point.
  assumptions: []
  proof_search_map:
    bottleneck: The table-size gap 1048576.
