hypothesis:
  id: H-SLHDSA-3a403a
  question_id: RQ-SLHDSA-001
  goal_id: GOAL-SLHDSA-001

  statement: >-
    SCOPE: the FORS layer of SLH-DSA only, at the six FIPS 205 parameter sets,
    under a random-oracle idealization of the message-digest split, against the
    known generic interleaved-target attack. CLAIM TIER: toy for every number
    whose parameter constants are unverified; medium at most after Stage 0
    verification, and NEVER crypto. NO ATTACK IS PROPOSED. NO EXPONENT MOVES.
    NOTHING HERE TOUCHES THE FAULT / MEMORY-CORRUPTION CLAIM CLASS.

    THE CLAIM. The FORS multi-target term of SLH-DSA is carried in its entirety
    by one integer-valued function of the parameters and the signature budget,
    and the "slack" GOAL-SLHDSA-001 asks for is a difference of computable
    integers rather than an opinion. Precisely: writing gamma_i for the number
    of the q issued signatures that landed on hypertree leaf i, lambda = q/2^h,
    S(k,j) for Stirling numbers of the second kind, and
    m(g) = 2^a (1 - (1 - 2^{-a})^g),
      (i)   the per-attempt success probability of the generic interleaved-target
            forgery is EXACTLY 2^{-h} SUM_i PROD_t (|S_{i,t}|/2^a);
      (ii)  under an unbiasable index its expectation is EXACTLY
            2^{-ak} T_k(lambda), T_k(lambda) = SUM_{j=1..k} S(k,j) lambda^j,
            with the 2^h from the leaf count cancelling the 2^{-h} weight;
      (iii) the leaf-collision refinement replaces T_k(lambda) by
            E_{X~Poisson(lambda)}[m(X)^k], which is strictly smaller, so the
            refinement can only RAISE the attack cost;
      (iv)  no bound quantifying over WORST-CASE occupancy can be non-vacuous at
            these parameters, because max SUM gamma_i^k over the simplex is q^k
            by convexity and the resulting per-attempt probability exceeds 1 by
            665 to 1857 bits depending on parameter set;
      (v)   the attack's memory is at least q*k cells, so under a memory-access
            exponent theta the charged cost is 2^{ak} (q k)^{theta} / T_k(lambda),
            and at theta = 1/2, q = 2^64 the charge (1/2)log2(qk) is the SAME
            SIZE as the multi-target amplification log2(T_k(lambda)/lambda) --
            exceeding it at SLH-DSA-128s and not at the other five sets.
    CONSEQUENCE, AND THE DELIVERABLE: the honest answer to "how much slack" is a
    CURVE over q crossed with a REGISTER over cost conventions, not a number;
    and at any q a real deployment can reach the multi-target amplification is
    worth single-digit bits.

    THE PLANNED NEGATIVE IS A DELIVERABLE. If Stage 0 shows the published
    parameter-selection formula already uses (ii) or (iii) exactly, the finding
    is a CONFIRMED-TIGHT verdict with tracked constants -- which is precisely
    what GOAL-SLHDSA-001's next_action asks for first, and it is recorded as the
    single most likely outcome, not as a failure.

  mechanism: >-
    DERIVED IN-REPO. NO PRIMARY TEXT HAS BEEN READ BY THIS PROGRAM. Every
    structural fact about SLH-DSA below carries the label RECALLED-UNVERIFIED
    and is a CANDIDATE TO CHECK, never an authority; replacing each with a
    quotation is Stage 0 of EXP-SLHDSA-9cbad4 and is the tier-limiting step of
    the whole hypothesis. The mathematics after the constants is derived here
    and is independent of who is right about them.

    (A) THE STRUCTURE (RECALLED-UNVERIFIED). A signature computes
    R = PRF_msg(SK.prf, opt_rand, M) and
    (md, idx_tree, idx_leaf) = H_msg(R, PK.seed, PK.root, M). The pair
    (idx_tree, idx_leaf) selects one of 2^h bottom-layer hypertree leaves, each
    holding one FORS key pair; md splits into k chunks of a bits giving
    (j_1..j_k) in [0,2^a)^k; signing reveals leaf j_t of FORS tree t for each t,
    with authentication paths. Parameter sets as (h, d, a, k), n in bytes:
      128s (63, 7, 12, 14) n=16    128f (66, 22, 6, 33) n=16
      192s (63, 7, 14, 17) n=24    192f (66, 22, 8, 33) n=24
      256s (64, 8, 14, 22) n=32    256f (68, 17, 9, 35) n=32
    with lg_w = 4 and a maximum of q = 2^64 signatures per key pair.

    (B) THE ATTACK AND ITS EXACT SUCCESS PROBABILITY. Holding q signatures, the
    adversary knows S_{i,t} subset [0,2^a), the revealed leaves of tree t at each
    observed hypertree leaf i. It draws trial pairs (R', M'), computes the
    digest, and wins iff the digest's leaf is an observed i and j'_t in S_{i,t}
    for every t; the authentication path above i is already public. Hence
    p(gamma, S) = 2^{-h} SUM_i PROD_{t=1..k} (|S_{i,t}|/2^a), exactly, and the
    generic cost is 1/p digest evaluations. This is the whole attack; nothing is
    improved here.

    (C) WHY THE OCCUPANCY IS MULTINOMIAL, AND WHERE THAT COULD FAIL. SK.prf is
    secret and M is committed before R exists, so the adversary can neither
    compute nor choose the index of an unsigned message; its interface is
    exactly "choose q, choose the messages, observe the indices". Under the
    random-oracle idealization this induces Mult(q; 2^{-h},...,2^{-h}) and
    nothing else. THIS IS THE LOAD-BEARING STRUCTURAL CLAIM (HEUR-SLHDSA-OCC-1).
    It is false in the nearby object VARIANT-P below, and verifying that no
    SLH-DSA signing mode makes the index publicly computable is the single
    highest-value reading task in this goal.

    (D) THE MOMENT IDENTITY. With B = 2^h bins and lambda = q/B, Poissonization
    gives E[SUM_i gamma_i^k] = B * E[X^k] for X ~ Poisson(lambda), and
    E[X^k] = T_k(lambda) = SUM_{j=0..k} S(k,j) lambda^j with S(k,0) = 0 for
    k >= 1 (Touchard polynomial / Dobinski relation). The factor B cancels the
    2^{-h} weight EXACTLY, leaving
      E[p] = 2^{-ak} T_k(lambda),
    in which h appears only through lambda. Two forced values fall straight out
    and are the hypothesis's cheapest falsifiers:
      T_1(lambda) = lambda identically, so the amplification A = T_k/lambda is
      EXACTLY 1 at k = 1 for every lambda;
      T_k(1) = B_k, the k-th Bell number, an exact integer.

    (E) THE LEAF-COLLISION REFINEMENT. |S_{i,t}| = gamma_i only if the gamma_i
    signatures at leaf i chose distinct FORS leaves in tree t. In general the
    draws are uniform on [0,2^a) so E[|S_{i,t}| | gamma_i = g] = m(g) =
    2^a(1-(1-2^{-a})^g), and given g the k trees are independent, giving
      E[p]_corr = 2^{-ak} E_{X~Poisson(lambda)}[ m(X)^k ].
    Since m(g) <= g the refinement strictly lowers p and raises the cost. Its
    size is governed by k*g/2^a at the g dominating the sum, so it is
    NEGLIGIBLE at large a and MATERIAL at small a. That split across the 's' and
    'f' families is a prediction made before any run, and it is what
    distinguishes a real mechanism from a fitted correction.

    (F) THE QUANTIFIER, AND WHAT IT EXCLUDES WITHOUT READING THE PROOF. Convexity
    of x -> x^k on [0,inf) puts the maximum of SUM_i gamma_i^k over the simplex
    SUM gamma_i = q at a vertex, value q^k. So a worst-case-occupancy bound gives
    p_wc = 2^{k(64-a)-h} at q = 2^64, i.e. 2^{665}, 2^{1848}, 2^{787}, 2^{1782},
    2^{1036}, 2^{1857} for the six sets -- all vacuously above 1. The published
    bound therefore MUST contain a probabilistic occupancy argument, and the only
    live question is which rung of the surrogate ladder it stands on:
      S0 worst case q^k                                     (excluded, vacuous)
      S1 max-load tail bound: SUM gamma^k <= q * G^{k-1}
      S2 exact moment 2^h T_k(lambda)
      S3 exact moment with leaf collisions 2^h E[m(X)^k]
    with S0 >= S1 >= S2 >= S3 forced by the power-mean inequality and m(g) <= g.
    slack_1 = log2(q G^{k-1}) - log2(2^h T_k(lambda)) is exactly computable and
    is the measurement of the PROOF that the goal's first criterion needs. NOTE
    THE DIRECTION: S1 upper-bounds the adversary's success, so slack there means
    the proof is CONSERVATIVE and the true margin is larger than it asserts.

    (G) THE CHARGE. The attack holds at least q*k index cells and random-accesses
    them once per trial. Under a memory-access exponent theta the charged cost is
    W_theta(q) = 2^{ak} (qk)^{theta} / T_k(lambda). The multi-target amplification
    is log2 A = log2(T_k(lambda)/lambda); the theta = 1/2 charge is
    (1/2)log2(qk). Their difference net = log2 A - (1/2)log2(qk) is a subtraction
    of two independently derived quantities and CAN COME OUT EITHER SIGN. It is
    predicted negative at 128s alone. Separately and needing no convention at
    all: q = 2^64 signatures under one key at 10^6 per second is about 2^{44}
    seconds, of order 5.8 x 10^5 years, so the headline multi-target figure is
    quoted at a q no deployment reaches, and at a reachable q ~ 2^{48} the
    amplification is under 8 bits at every set.

    (H) WHAT THE MECHANISM DOES NOT DO, STATED SO IT CANNOT BE READ IN. It does
    not improve any attack. It does not bear on SHA-2 or SHAKE. It does not
    cover WOTS+ or the hypertree, so it supplies ONE TERM of a security figure
    that is a minimum over layers. It says nothing whatever about fault,
    Rowhammer, or memory-corruption chains, which RQ-SLHDSA-001 requires to be a
    strictly separate claim class.

  proposal_ids:
