  assumptions:
    - >-
      A1. THE RECALLED PARAMETER SETS AND SIGNING STRUCTURE ARE CORRECT. This is
      the tier-limiting assumption of the whole hypothesis and it is EVIDENTIARY,
      not mathematical. If one (h, a, k) triple is wrong every numeric prediction
      moves and the affected predictions are VOID rather than FALSIFIED -- stated
      here, before any run, so that a parameter correction cannot later be
      presented as a model failure or a model failure disguised as a parameter
      correction.
    - >-
      A2. The digest split behaves as k independent uniform a-bit values and the
      index as a uniform h-bit value. This is the only cryptographic assumption
      anywhere in the hypothesis and it is a random-oracle idealization of
      H_msg, identical in kind to the one any such bound uses.
    - >-
      A3. Poissonization is used for the MOMENT, where it is exact up to an
      O(1/B) term with B = 2^h >= 2^63. The residual is bounded numerically in
      Stage 1 rather than waved away, and the bound is a required artifact.
    - >-
      A4. M = q*k index cells is a LOWER bound on the attack's working set. The
      asymmetry matters and is recorded: "charging changes the answer" is
      conservative under a lower bound, "charging does not change the answer" is
      NOT and may not be concluded from this hypothesis.
    - >-
      A5. The convention formulas -- M^theta random access from the diameter
      argument, and about N/D total gates for depth-capped Grover -- are RECALLED
      standard forms, each re-derived from its one-line argument in the
      experiment. NIST MAXDEPTH values and the AES-referenced category
      definitions are RECALLED-UNVERIFIED and enter only as ROW LABELS.
    - >-
      A6. NOTHING IN THIS HYPOTHESIS IS EVIDENCE. No run exists. Every number
      below is a PRE-REGISTERED FORCED VALUE computed by the proposing session
      outside the harness on 2026-08-05 in pure-Python exact integer arithmetic,
      to be independently reproduced in-harness. Where the in-harness value
      differs, the defect is in this record.

  proof_search_map:
    bottleneck: >-
      The step at which the occupancy of FORS key pairs enters the bound. Every
      concrete FORS multi-target figure, every parameter choice made against one,
      and every statement about SLH-DSA's remaining margin passes through the
      single quantity SUM_i gamma_i^k (or its leaf-collision refinement). Nothing
      upstream of it is contested here and nothing downstream of it can be
      repaired without it. Removing or replacing that step is what changes the
      number; it is therefore the only step this hypothesis attacks.
    baseline_embedding:
      parameter_slice: >-
        TWO independent slices, both exactly reducing to a known answer.
        SLICE 1: k = 1. A single FORS tree removes the multi-target structure
        entirely; T_1(lambda) = lambda, the amplification is exactly 1, and S0,
        S1, S2 all coincide because SUM_i gamma_i^1 = q for EVERY occupancy.
        SLICE 2: lambda -> 0 (q << 2^h). The moment collapses to its j = 1 term
        and E[p] -> q 2^{-h-ak}, which is the naive single-target union bound.
        Both are exact limits, not approximations.
      reproduction_check: >-
        SYMBOLIC, plus an exact-integer fixture. The Stirling recurrence must
        return S(k,1) = 1 and S(k,k) = 1 for every k; T_1(lambda) = lambda must
        hold identically as a rational function; and T_k(1) must equal the exact
        Bell numbers B_14 = 190899322, B_17 = 82864869804,
        B_22 = 4506715738447323, B_33 = 1629595892846007606764728147,
        B_35 = 281600203019560266563340426570. A curve that merely resembles the
        baseline is not an embedding; these are exact integer identities.
        A THIRD, WEAKER BASELINE SIGNAL, RECORDED WITH ITS CAVEAT: computing
        2^{ak}/T_k(q/2^h) at q = 2^64 for the six recalled parameter sets gives
        133.729 / 128.405 / 193.898 / 194.405 / 255.999 / 255.599 bits against
        nominal categories 128/128/192/192/256/256 -- all six at or just above
        target, none below. Six-way agreement is a strong indication that the
        derivation reproduces the quantity the parameters were chosen against.
        IT IS EXPLICITLY NOT ACCEPTED AS A PASSED AUDIT, because the parameters
        and the security levels are recalled from the same memory and the
        agreement may be self-fulfilling (see confounders). Only Stage 0's
        primary-text read converts it into a baseline reproduction.
    observation_collision:
      observable: >-
        The scalar SUM_i PROD_t |S_{i,t}| -- equivalently, after the projection,
        the pair (occupancy multiset, within-bin distinct counts) -- and, at the
        proof level, the surrogate rung a bound stands on.
      distinct_preimage_search: >-
        A COLLISION EXISTS, IS EXHIBITED, AND IS THE REASON THE AUDIT HAS
        CONTENT. Take SLH-DSA (randomized, unbiasable index) and VARIANT-P
        (identical except R = H(M) publicly computable). The two objects have
        IDENTICAL (h, a, k, n), identical signing cost, identical signature
        format, identical hash function, and identical EXPECTED occupancy under
        a passive adversary -- so every observable that this program's analysis
        computes from parameters alone agrees on them. They differ only in the
        REACHABLE SET of occupancies, which is the multinomial's support for the
        first and the whole simplex for the second. A bound, an analysis, or an
        instrument that returns the same answer for both has collided two
        ground-truth objects lying on opposite sides of the conclusion, and has
        therefore not identified the load-bearing structure. Running both through
        the identical pipeline is a REQUIRED ARM, not an optional check.
        A SECOND, WEAKER COLLISION, ALSO PRE-REGISTERED: at fixed lambda the
        amplification A(lambda) depends on (a, k) only through k, while the cost
        2^{ak}/T_k depends on both. So two parameter sets with equal k and
        different a share the amplification observable and differ in cost --
        128f and 192f (both k = 33) are exactly such a pair among the six, and
        their predicted amplifications are identical to the digit (+71.595).
        Any instrument that reports different amplifications for 128f and 192f
        is reading a. Any instrument that reports the same COST for them is not
        reading a. Both failures are detectable in one line.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the security-game quantity (an expectation over adversary
          strategies) by an exact combinatorial identity in Stirling numbers:
          E[p] = 2^{-ak} SUM_{j=1..k} S(k,j) lambda^j. The model moves from
          "bound an adversary" to "evaluate a polynomial with integer
          coefficients", where the hypothesis is an EXACT EQUALITY rather than
          an inequality with unspecified slack.
        predicted_gain: >-
          Converts every claim in this goal into a checkable integer. Encoding
          obligation: the projection to gamma is information-preserving for p
          (proved in the lossy-projection audits of the paired ideas).
          Completeness: the identity covers all occupancies, not typical ones.
          Soundness: the random-oracle idealization A2, which is DECLARED and
          not discharged. Transfer: to the real scheme only through A1, which is
          DECLARED UNMET until Stage 0. Cost-loss: none, the evaluation is free.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (the parameter tuple and the passive-adversary
          occupancy distribution) fixed and vary the forgotten structure (the
          control interface), giving the SLH-DSA / VARIANT-P pair. The intrinsic
          invariant proposed to distinguish them is the extremal k-th power sum
          over the reachable set: 2^h T_k(lambda) versus q^k.
        predicted_gain: >-
          If the invariant does not separate the pair, the analysis is blind to
          the only structure it was built to see, and the whole hypothesis fires
          its own falsifier at zero compute. Predicted separation at 128s,
          q = 2^64: about 800 bits at the level of the power sum, and about 57
          bits at the level of attack cost.
      - transform: specialization_pack
        proposed_object: >-
          Build the cost-convention register as a resource measure realized by
          specializing theta, and add charges only over provably disjoint
          resources: trials (time), table cells (memory), signatures obtained
          (data), circuit depth (quantum). No resource is charged twice, and
          each row states which are charged.
        predicted_gain: >-
          Turns "the multi-target advantage" from a claim into a signed quantity
          net = log2 A - theta log2(qk) that changes sign across the six
          standardized parameter sets at theta = 1/2 -- a discriminating
          prediction rather than a uniform one.
    quantifier_order: >-
      WRITTEN OUT EXPLICITLY, IN THE ORDER CLAIMED.
      THE BOUND UNDER AUDIT, as this hypothesis reads it:
        EXISTS a function f  FOR ALL adversaries A making at most q signing and
        at most Q hash queries:  Adv_ITSR(A) <= f(q, Q, h, a, k).
      THE HYPOTHESIS'S OWN CLAIM, which is deliberately weaker and in a
      different order:
        FOR ALL parameter tuples (h, a, k) and FOR ALL q,  EXISTS an exactly
        computable integer expression E(h, a, k, q) such that the EXPECTED
        per-attempt success probability of the described attack equals E,
        where the expectation is over the multinomial occupancy and the
        random-oracle digest.
      THE TRAP BEING HUNTED, NAMED: a bound whose occupancy witness is allowed
      to depend on the adversary would be the reversed order
      "FOR ALL A EXISTS gamma", which is trivially satisfiable and asserts
      nothing uniform; whereas a bound quantifying over the WORST gamma
      uniformly is excluded outright by the convexity computation in mechanism
      (F). The published bound must therefore sit strictly between the two, and
      identifying where is a reading question, not a derivation.
      A SECOND ORDERING OBLIGATION, ON THIS HYPOTHESIS ITSELF: the expression E
      may NOT depend on the parameter set, the seed, or the arm. One E, fixed
      before evaluation, must produce every predicted number. The weaker order
      "for each set, exists an E" is trivially satisfiable, is NOT claimed, and
      is not admissible as a result.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: an exact evaluation of the EXPECTED per-attempt success
        probability of ONE described attack against ONE layer of SLH-DSA, under
        a random-oracle idealization of the digest, at parameter constants whose
        provenance is a reading task; plus an unconditional exclusion of
        worst-case-occupancy bounds at those constants; plus a cost register
        whose rows are stated conventions. IT CANNOT CERTIFY that the attack is
        optimal, that the published bound is loose, that SLH-DSA is secure, or
        that any parameter set should change. It cannot say anything about
        WOTS+, the hypertree, SHA-2, SHAKE, or any fault or memory-corruption
        chain. A run of this hypothesis that produced a sentence of the form
        "SLH-DSA-128x has N bits of security" would be outside the ceiling and
        the contract's invalidation rules fire on it.
      nearby_object_control: >-
        VARIANT-P, defined in mechanism (C) and in IDEA-20260805-705614: SLH-DSA
        with the secret-keyed message randomizer replaced by a publicly
        computable R = H(M), everything else identical. It is the closest object
        to SLH-DSA on which the hoped-for conclusion (the multi-target term is
        governed by the exact moment) is FALSE -- there the reachable occupancy
        set is the whole simplex and a grinding adversary approaches the vertex.
        Pre-registered separation at 128s: about 2^{133.7} versus about
        2^{76.7}, i.e. roughly 57 bits, with a floor of 30 bits set well below
        the estimate so a rough re-derivation cannot manufacture a pass. THE
        CONTROL IS MANDATORY AND CAN FAIL: an analysis returning no separation
        has not identified the load-bearing structure and no negative result of
        any kind may be reported from a run in which it fails.
        A SECOND NEARBY OBJECT, IN THE OPPOSITE DIRECTION: AES-128 exhaustive
        key search pushed through the identical cost-charging pipeline, where
        the memory charge MUST be exactly 0 bits for every theta. One nearby
        object where the effect must appear and one where it must vanish bracket
        the instrument.
    proof_obligations:
      - claim: >-
          E[p] = 2^{-ak} T_k(q/2^h) exactly, with the 2^h cancellation shown and
          the Poissonization residual bounded numerically rather than assumed.
        responsibility: correctness
      - claim: >-
          T_1(lambda) = lambda identically and T_k(1) = B_k for the five k values
          in play, as exact integers.
        responsibility: baseline
      - claim: >-
          m(g) <= g for all g >= 0, hence the leaf-collision refinement is
          monotone in the defender's direction; with the inequality proved, not
          observed.
        responsibility: strictness
      - claim: >-
          max SUM gamma_i^k over the simplex is q^k, by convexity, and the
          resulting p_wc exceeds 1 at all six parameter sets.
        responsibility: correctness
      - claim: >-
          M >= q*k cells is a lower bound on the described attack's working set,
          with the omitted items enumerated.
        responsibility: memory
      - claim: >-
          The parameter constants are established from primary text, or their
          absence is recorded and every dependent number is labelled conditional.
        responsibility: baseline
      - claim: >-
          The adversary cannot bias the index in ANY SLH-DSA signing mode,
          established from the signing algorithm and not inferred from the
          numbers.
        responsibility: interface
      - claim: >-
          Every reported figure names its cost convention, its q, and its layer;
          no figure is reported as a security level for SLH-DSA.
        responsibility: scope
      - claim: >-
          Nothing in this hypothesis is combined, cited, or reported alongside
          fault or memory-corruption results.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    DELIBERATELY NULL, AND THE OMISSION IS THE HONEST ANSWER RATHER THAN AN
    OVERSIGHT. No complexity claim of any kind is made. No exponent moves. This
    hypothesis computes the cost of a KNOWN attack and audits the quantifiers
    and cost conventions of a KNOWN bound; it makes no system easier to break.
    Measured against docs/target-result-profile.md's exponent-first bias, this
    is explicitly not an exponent proposal, and the record says so rather than
    dressing a constant-tracking exercise as one. It is worth running because
    GOAL-SLHDSA-001's first completion criterion IS a measurement with tracked
    constants, because area SLHDSA currently holds zero verified constants, and
    because the whole thing costs seconds of compute.

  heuristic_assumptions:
    - id: HEUR-SLHDSA-OCC-1
      formal_statement: >-
        FOR ALL adversaries A making at most q signing queries to an SLH-DSA
        instance, the induced distribution of the occupancy vector gamma over the
        2^h FORS key pairs is EXACTLY Mult(q; 2^{-h},...,2^{-h}), independent of
        A's message choices and of A's offline computation.
      random_model_justification: >-
        The index is extracted from H_msg(R, ...) with R a PRF output under the
        secret SK.prf, and A commits to M before R exists; so A can neither
        predict nor choose the index of an unsigned message. Its only control is
        over q. Modelled as a random oracle this gives the uniform multinomial
        exactly.
      supporting_results:
        - >-
          NONE CITED. The design rationale for the message randomizer is
          RECALLED-UNVERIFIED as published (KN-LIT-4938's title points at it);
          that entry is a 2026-07-24 bulk-seeded stub with null identifiers and
          an unverified body and is NOT cited as support.
      validation_experiment_ids: [EXP-SLHDSA-9cbad4]
      falsification_condition: >-
        Any input path by which an adversary influences (idx_tree, idx_leaf)
        without SK.prf, in ANY signing mode. Discovery of one refutes the
        heuristic, voids every number in this hypothesis, and is an AGENTS.md
        rule 12 event to be escalated rather than written up.
    - id: HEUR-SLHDSA-OCC-2
      formal_statement: >-
        E[ PROD_{t=1..k} |S_{i,t}| | gamma_i = g ] = m(g)^k with
        m(g) = 2^a(1 - (1-2^{-a})^g), i.e. the k per-tree distinct-count
        variables are conditionally independent given g and each appears to the
        first power.
      random_model_justification: >-
        The k index chunks of a digest occupy disjoint bit ranges and each
        signature contributes one index per tree, drawn independently across
        trees under A2. Each tree appears to the first power in the product, so
        no within-tree moment beyond the mean is required -- which is exactly the
        exponent bookkeeping a reviewer should check rather than take on trust.
      supporting_results: []
      validation_experiment_ids: [EXP-SLHDSA-9cbad4]
      falsification_condition: >-
        A Monte-Carlo estimate of E[PROD_t |S_t|] at a toy cell differing from
        m(g)^k by more than 4 standard errors. Under A2 the identity is a
        theorem, so a mismatch indicts the simulator first and the derivation
        second; the experiment reports which.
    - id: HEUR-SLHDSA-QO-2
      formal_statement: >-
        The published FORS multi-target bound stands on rung S1 or S2 of the
        surrogate ladder, not on S0.
      random_model_justification: >-
        Not applicable: this is a claim about a document, not about a random
        object. S0 is excluded unconditionally by mechanism (F); which of S1 and
        S2 holds is not derivable and is a reading question. The heuristic exists
        to record what this hypothesis does not know.
      supporting_results: []
