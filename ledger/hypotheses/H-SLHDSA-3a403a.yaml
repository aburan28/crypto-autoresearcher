        m_{j+1} = lambda SUM_i C(j,i) m_i) which must agree exactly.
      role: converts the occupancy power sum into an exact integer polynomial
    - description: >-
        Convexity of x -> x^k on [0, infinity) for k >= 1, hence the maximum of a
        power sum over a simplex is attained at a vertex.
      citation: ELEMENTARY AND DERIVED IN-REPO. No citation asserted.
      role: excludes worst-case-occupancy bounds at FIPS 205 parameters
