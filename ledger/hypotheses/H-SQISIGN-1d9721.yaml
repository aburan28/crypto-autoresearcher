hypothesis:
  id: H-SQISIGN-1d9721
  question_id: RQ-SQISIGN-39f231
  derived_from_idea: IDEA-20260821-211586
  status: proposed
  added: '2026-08-25'

  statement: >-
    SCOPE FIRST, AS THIS QUESTION'S CONSTRAINTS REQUIRE. EVERY TECHNICAL STATEMENT ABOUT
    SQIsign BELOW IS UNVERIFIED. No Round-3 specification and no primary
    higher-dimensional-design paper has been read by this program, and the template's
    exact inequality is carried at provenance RECALLED. The deliverable proposed is a
    DOCUMENTARY LEDGER plus null controls; no attack is proposed, and no cell may be
    filled from memory or from a search snippet. CLAIM TIER toy without exception,
    academic and defensive only.

    THE HYPOTHESIS, IN FOUR PARTS.
    (K1) THE CONDITION IS QUANTITATIVE. The SIDH/Kani attack template's applicability is
      governed by an INEQUALITY between a published torsion modulus N and a secret degree
      d, with an exponent c depending on the embedding dimension. If so, the obstruction
      is a MARGIN IN BITS, not a verdict. THIS IS THE SINGLE ASSUMPTION ON WHICH THE
      RECORD STANDS OR FALLS, and it is settled by reading, not by computing.
    (K2) THE THREE MARGINS ARE EXTRACTABLE AND INDEPENDENT. Per published image of a
      secret map: M1 = c log2(N) - log2(d), the modulus margin; M2 = H(d | all published
      data), the degree entropy in bits; M3 in {0, 1, 2}, the number of independent
      order-N points whose images are published, each tagged deterministic or
      secret-dependent. They do not combine by multiplication.
    (K3) THE PRICE COMBINES AS A MINIMUM, NOT A PRODUCT. Each deficit carries a search
      exponent e closing it, and the adversary picks the cheapest item AFTER seeing the
      parameters, so the ledger's verdict is the MINIMUM of e over published items. A
      ledger that multiplies deficits systematically OVERSTATES security, and that is the
      single most likely way this instrument returns a wrong verdict.
    (K4) STRUCTURAL VERSUS PARAMETRIC IS A DERIVATIVE. For each tweakable parameter t,
      dM1/dt and dM2/dt in bits per unit. A margin no parameter moves is STRUCTURAL; a
      margin a named parameter moves at a stated rate is PARAMETRIC with that much slack.
      "Would a variant publishing slightly more survive?" is exactly the question of
      whether some derivative is nonzero, and a binary audit cannot answer it.

    THE DECISION RULE, PRE-REGISTERED. An avenue is LIVE if and only if
    2^e * poly(log p) is below the matched endomorphism-ring baseline, WITH THE TIER
    NAMED: p^{1/3+o(1)} time and memory conditional on Heuristic 1 of the frozen source,
    or p^{1/2}(log p)^{O(1)} time at polynomial memory unconditionally. A deficit
    recorded without e is an unpriced verdict and does not satisfy this question's
    closure standard.

  mechanism: >-
    The template embeds a secret isogeny of degree d into an isogeny of principally
    polarised abelian varieties using an auxiliary isogeny that completes d to a norm
    form, and recovers the secret in polynomial time from the embedded object. Every
    ingredient except the inequality is either present or structurally absent; THE
    INEQUALITY IS THE ONLY INGREDIENT PRESENT TO A DEGREE. Recording it as present or
    absent throws away the quantity, and the quantity is exactly what a design tweak
    moves.
    THE THREE MARGINS SEPARATE THREE DIFFERENT SITUATIONS. M1 < 0 with M2 = 0 and M3 = 2
    is a modulus deficit - the adversary knows the degree and has a full basis image but
    at too small a modulus. M1 >= 0 with M2 > 0 is a degree-uncertainty deficit - the
    surface would be consumable if the degree were known, priced as a search over
    candidate degrees at one template invocation each. M3 < 2 is a basis deficit whose
    price depends on the template's tolerance for partial data, which the audit must
    EXTRACT rather than assume.
    THE NULL CONTROL IS A PRECONDITION AND IS CONSTRUCTED, NOT ASSUMED. Per this
    question's own methods constraint, no conclusion that the template fails may be
    recorded before the identical ledger has been shown to FIRE when the ingredient is
    present. SQIsign-WEAK is the same scheme with the published torsion modulus raised
    until M1 >= 0 at M2 = 0 and M3 = 2; the ledger must return LIVE, e = 0, cost poly. If
    it does not, the ledger is broken and every negative it reports about the real scheme
    is void. SIDH at its published parameters is the second, HISTORICAL control - not a
    construction of ours and therefore not tunable to pass.
    THE BASELINE COUPLING IS LIVE AND IS RECORDED SO IT DOES NOT BECOME AN ACCOUNTING
    SEPARATION. A published-surface avenue costing 2^e template invocations is
    interesting only while it sits below the endomorphism-ring baseline, and that
    baseline has moved down; a ledger fixed at the older tier mis-ranks its own cells.

  assumptions:
    - >-
      That the template's applicability is governed by an inequality with a published
      modulus on one side and a secret degree on the other. If the primary sources show
      it is governed by something else - a divisibility, a smoothness condition on the
      auxiliary degree, or a condition on the base curve's endomorphism ring - the ledger
      gains a column and the margin framing survives only for the conditions that are
      quantitative. CHECKABLE BY READING; this is (K1).
    - >-
      That deficits are chosen by the adversary, so prices combine as a MINIMUM over
      strategies. A ledger that multiplies them overstates security.
    - >-
      That the auxiliary completion the template needs is available at negligible cost
      when the inequality holds. Whether smoothness of the completion is additionally
      required is a LEDGER COLUMN, not an assumption.
    - >-
      That the Round-3 documents fix the published surface unambiguously. A quantity
      fixed by a reference implementation but not by the specification is not a scheme
      property and its cell is UNDETERMINED-BY-SPECIFICATION, which is itself a finding.

  proof_search_map:
    bottleneck: >-
      Extracting, from the Round-3 specification and the primary design papers, the pair
      (N, d) for each published image of a secret map, and the exponent c in the
      template's embedding condition. EVERY NUMBER IN THE LEDGER IS DOWNSTREAM OF THAT
      EXTRACTION and no computation substitutes for it.
    baseline_embedding:
      parameter_slice: >-
        SIDH ITSELF is the exact parameter slice at which the ledger must reproduce a
        known outcome: there M1 >= 0, M2 = 0 and M3 = 2, so the ledger must return LIVE
        with e = 0 and cost poly, reproducing the published break.
      reproduction_check: >-
        SYMBOLIC AND DOCUMENTARY. Instantiate the ledger's columns on SIDH/SIKE parameters
        as reported in the FILED primary sources and require the verdict LIVE, e = 0. A
        ledger that does not reproduce the SIDH break on SIDH parameters is measuring
        nothing, and this check runs and is recorded BEFORE any SQIsign cell is filled. It
        is a sibling of, not a substitute for, the SQIsign-WEAK null: one is historical and
        cannot be tuned, one is parameter-swept.
    observation_collision:
      observable: 'a ledger cell verdict: CLOSED with exponent e / LIVE / UNDETERMINED'
      distinct_preimage_search: >-
        THE COLLISION IS NAMED AND IT IS THE FAILURE MODE OF EVERY PRIOR BINARY AUDIT.
        "The template does not apply" is returned identically by a surface missing the
        inequality by 2 bits, by one missing it by 200, and by one where the secret is not
        of the exploitable form at all. THREE DISTINCT GROUND TRUTHS, ONE OBSERVABLE. The
        separating condition is the entire proposal: REPORT e, NOT A VERDICT. A second
        collision, recorded because it is easy to miss: "no image is published" and "an
        image is published but of a secret-dependent point" both read as absent in a byte
        inventory and are different for the template, which is why M3 tags each published
        point deterministic or secret-dependent.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Carry a SIGNED MARGIN in bits and a SEARCH EXPONENT where previous audits
          carried a boolean, and a DERIVATIVE where previous audits carried "structural or
          parametric" as a judgement.
        predicted_gain: >-
          No attack and no cost gain. The audit's output becomes comparable with a baseline
          exponent and differentiable in the scheme's own parameters, which converts a
          verdict into an object a tweak proposal can be checked against.
      - transform: observable_fiber
        proposed_object: >-
          Hold the verdict fixed at "does not apply" and vary the size of the deficit,
          exhibiting two schemes in the same fibre with wildly different e.
        predicted_gain: >-
          A disqualification rule for binary audits, available at zero compute.
    quantifier_order: >-
      FOR EACH published item x of the Round-3 surface, THERE EXISTS an adversary strategy
      costing 2^{e(x)} template invocations supplying what x leaves missing; and the
      surface is safe against this template IFF FOR ALL x, 2^{e(x)} exceeds the matched
      baseline. THE ORDER MATTERS IN ONE SPECIFIC WAY: the adversary picks x AFTER seeing
      the parameters, so the verdict is the MINIMUM of e over items. A per-item audit
      reporting each item's safety separately, without taking that minimum, has quantified
      over x in the wrong place - and a boolean per item has no minimum to take, which is
      precisely how prior inventories are structurally vulnerable here.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Against THIS template, with the embedding condition as stated in the FILED primary
        sources, the Round-3 published surface leaves a deficit of e bits, minimised over
        published items." It certifies nothing about other templates, nothing about future
        higher-dimensional embeddings that might weaken the inequality, and nothing about
        the scheme's security generally. A LARGE e IS NOT A SECURITY PROOF: the template's
        exponent c has already moved once in the literature, and a future move rescales
        every M1 by a multiplicative factor. The ledger must record its c prominently and
        be RE-RUNNABLE when c moves; that re-runnability is a design requirement, not a
        caveat.
      nearby_object_control: >-
        SIDH, where "the template does not apply" is KNOWN FALSE, and SQIsign-WEAK,
        constructed to make it known false by one parameter change. An audit that cannot
        distinguish either from the real scheme has not identified the load-bearing
        structure. Both are mandatory and both are cheap.
    proof_obligations:
      - claim: The template's applicability is governed by a quantitative inequality whose two sides are extractable from the specification.
        responsibility: interface
      - claim: Each deficit has a search exponent e closing it, and the combined price is the minimum over items.
        responsibility: feasibility
      - claim: The ledger returns LIVE with e = 0 on SIDH parameters and on SQIsign-WEAK.
        responsibility: baseline
      - claim: dM1/dt and dM2/dt are well defined for each tweakable parameter and are computed, not judged.
        responsibility: strictness
      - claim: No cell is filled from any source not filed as KN-LIT; unfillable cells are recorded UNDETERMINED-BY-SPECIFICATION.
        responsibility: scope
      - claim: The comparison baseline's TIER is named in every verdict.
        responsibility: correctness

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Explicitly null for the ledger itself, which is a documentary instrument claiming no
    algorithm. The quantity the ledger PRODUCES is a search exponent in template
    invocations, compared at the exponent level against a named baseline tier. No exponent
    is claimed to move and no attack is proposed. The conditional baseline's o(1) is
    superpolynomial by its own author's disclosure, so no concrete-parameter conclusion is
    computed above it.

  heuristic_assumptions:
    - id: HEUR-SQI-1
      formal_statement: >-
        SEARCH-PRICE ADDITIVITY IN THE EXPONENT. If a published surface leaves a deficit an
        adversary closes by guessing a quantity of entropy e bits, and each guess is
        testable by ONE independent template invocation whose failure is detectable, then
        the expected cost is 2^{e-1} template invocations, and the strategy space's cost is
        the minimum of 2^{e(x)} over items x.
      random_model_justification: >-
        The rigorous part is elementary - independent uniform guessing with detectable
        failure has geometric hitting time. THE PART THAT IS NOT RIGOROUS, NAMED RATHER
        THAN ASSUMED AWAY: that a wrong guess is DETECTABLE at unit cost. In the SIDH
        setting the template's output is checkable against the public key, which is why the
        guessing argument works there; whether the same check exists for a
        partially-specified higher-dimensional response is a property of the Round-3
        verification equation and MUST BE EXTRACTED, not assumed. This imitates the standard
        cryptanalytic convention that an attack with a verifiable candidate costs search
        space times test cost - exactly the convention that fails when candidates are not
        testable.
      supporting_results: []
      validation_experiment_ids: [EXP-SQISIGN-e15acb]
      falsification_condition: >-
        At toy primes, instantiating the template with a deliberately withheld quantity of e
        bits for e in {4, 8, 12}, measured invocations to success departing from 2^{e-1} by
        more than a factor 4 at two or more values of e, or a false-acceptance rate above
        2^{-e} in the verification check.

  predictions:
    - metric: ledger verdict and search exponent e on SIDH/SIKE published parameters
      direction: different
      minimum_effect: >-
        FORCED VALUES - verdict LIVE, e = 0. A miss voids the instrument and NO SQIsign
        cell may be filled.
    - metric: ledger verdict and e on SQIsign-WEAK
      direction: different
      minimum_effect: >-
        FORCED VALUES - verdict LIVE, e = 0. This is the question's mandatory null control
        and is a precondition, not a robustness check.
    - metric: M1 in bits, per published image of a secret map in the Round-3 surface
      direction: different
      minimum_effect: >-
        NO VALUE IS PREDICTED - the specification has not been read and predicting it would
        be fabrication. What IS pre-registered is the DECISION RULE: M1 >= 0 escalates
        immediately to independent review; -80 < M1 < 0 is a live avenue requiring the
        priced search to be compared against the baseline; M1 <= -128 is a closed cell with
        a number.
    - metric: minimum over published items of e, against the matched baseline exponent
      direction: different
      minimum_effect: >-
        The decision quantity. LIVE iff 2^e * poly is below the baseline, with the TIER
        named and with the note that the conditional tier's superpolynomial o(1) forbids a
        concrete-parameter conclusion.
    - metric: dM1/dt and dM2/dt per tweakable parameter, in bits per unit
      direction: different
      minimum_effect: >-
        A nonzero derivative for any t means the obstruction is PARAMETRIC and the tweak
        window carries risk at that rate; all-zero derivatives across the full declared
        parameter list mean STRUCTURAL, and that is the only form in which the word
        structural may be used.
    - metric: count of cells recorded UNDETERMINED-BY-SPECIFICATION
      direction: different
      minimum_effect: >-
        Reported, not minimised. A zero count before the Round-3 package is filed as KN-LIT
        would itself be a red flag.
    - metric: graded sweep of e across the M1 = 0 crossing
      direction: lower
      minimum_effect: >-
        e must fall MONOTONICALLY to zero as the published torsion exponent rises through
        the crossing. A ledger whose e does not move monotonically with the parameter it is
        a function of is mis-implemented.

  test_boundary:
    instances: >-
      The Round-3 SQIsign published surface, item by item, once filed as KN-LIT; SIDH/SIKE
      at published parameters as the historical control; SQIsign-WEAK as the constructed
      null; a scheme publishing NO image of any secret map as the negative historical
      control; and, only if some cell is LIVE and only under a separate contract, a
      toy-prime end-to-end instantiation.
    parameters:
      documentary_stages: 'all of stages 0 through 5 are ZERO COMPUTE'
      graded_sweep: 'published torsion exponent swept across the M1 = 0 crossing, at least three interior points'
      heuristic_validation_e: [4, 8, 12]
      claim_tier_ceiling: 'toy, without exception, per the question record'
    implementation: >-
      Documentary. A ledger table with fixed columns, each cell carrying its source line
      and the theorem or page it was extracted from. Any toy-prime arm validating HEUR-SQI-1
      runs under a SEPARATE contract at toy primes only and is not authorized here.
    budget:
      wall_clock_seconds: 600
      total_cpu_hours: 0.2
      memory_gb: 2
      maximum_runs: 10

  distinguishable_outcomes:
    - outcome: 'STAGE 0 CANNOT COMPLETE. The Round-3 package or the primary design papers cannot be filed as KN-LIT.'
      what_observing_it_would_mean: >-
        The ledger is EMPTY and stays empty. That is the honest and complete result: this
        question's own constraint forbids filling a cell from memory, and reporting the
        gate as unmet is the deliverable. It is not a negative about SQIsign in any
        direction.
    - outcome: 'SIDH CONTROL MISSES. The ledger does not return LIVE, e = 0 on SIDH parameters.'
      what_observing_it_would_mean: >-
        The instrument does not reproduce a published break and NOTHING ELSE IS RECORDED.
        No SQIsign cell may be filled, and the miss is the deliverable.
    - outcome: 'SQIsign-WEAK CONTROL MISSES. The ledger does not fire on the constructed null.'
      what_observing_it_would_mean: >-
        Per this question's binding constraint, NO NEGATIVE CONCLUSION ABOUT THE REAL
        SCHEME MAY BE RECORDED AT ALL. An audit never shown to fire when the ingredient is
        present has demonstrated something about the audit and nothing about the scheme.
    - outcome: >-
        LEDGER FILLED, ALL CELLS CLOSED WITH LARGE e. Both controls fire, and the minimum e
        over items is far above the named baseline exponent.
      what_observing_it_would_mean: >-
        (K1) through (K4) hold and the surface leaves a PRICED deficit of that many bits
        against THIS template with THIS c. It is a documentary result at toy tier. IT IS
        NOT "SQIsign is safe from SIDH-style attacks" and must never be reported as such: a
        large e is a distance to one attack, not a security measure, and a future move in c
        rescales it.
    - outcome: >-
        SOME CELL IS LIVE - the minimum e sits below the baseline exponent - or some item
        has M1 >= 0 with M2 = 0 and M3 = 2.
      what_observing_it_would_mean: >-
        THIS WOULD BE A CLAIMED BREAK OF A ROUND-3 NIST CANDIDATE AND IS THE ONE OUTCOME
        THIS RECORD'S MACHINERY MAY NOT REPORT. It is treated as an EXTRACTION ERROR until
        independently confirmed, escalated immediately to an independent review-breakthrough
        session per AGENTS.md rule 12, and never published from a single session's reading.
    - outcome: 'THE CONDITION IS NOT QUANTITATIVE. The filed primary sources show the template turns on something other than an inequality.'
      what_observing_it_would_mean: >-
        (K1) fails. The margin framing dies for the non-quantitative conditions and the
        honest deliverable is the list of conditions that ARE quantitative and those that
        are not - which is a real finding and is the outcome a sibling record already points
        at.
    - outcome: 'ALL DERIVATIVES ZERO over a parameter list a reviewer shows to be incomplete.'
      what_observing_it_would_mean: >-
        The STRUCTURAL verdict is unsupported and the cell reverts to unverified. "Structural"
        earned from an incomplete parameter list is a judgement wearing a derivative's
        clothes.
    - outcome: 'MANY CELLS UNDETERMINED-BY-SPECIFICATION.'
      what_observing_it_would_mean: >-
        The published surface is partly implementation-defined rather than specified. That
        is a finding about the specification, is reported as one, and each undetermined cell
        blocks the minimum-over-items computation from being complete - which must travel
        with the verdict.

  falsification_conditions:
    - The ledger fails to return LIVE with e = 0 on SIDH parameters.
    - >-
      The ledger fails to fire on SQIsign-WEAK, after which no negative conclusion about the
      real scheme may be recorded.
    - >-
      The primary sources show the template's applicability is NOT governed by a quantitative
      inequality, falsifying (K1).
    - >-
      Some published item has M1 >= 0 with M2 = 0 and M3 = 2, which triggers mandatory
      escalation rather than a report.
    - >-
      e fails to fall monotonically across the graded sweep of the M1 = 0 crossing, which
      means the ledger is mis-implemented.
    - >-
      Every derivative is zero across a parameter list a reviewer shows to be incomplete.
    - >-
      Measured invocations to success depart from 2^{e-1} by more than a factor 4 at two or
      more e, or the false-acceptance rate exceeds 2^{-e}, falsifying HEUR-SQI-1 and
      requiring the pricing to charge disambiguation.

  interpretation_limits:
    - >-
      EVERY TECHNICAL STATEMENT ABOUT SQIsign HERE IS UNVERIFIED. No Round-3 specification
      has been read by this program, and the ledger is entirely empty until the reading gate
      completes. This record proposes an INSTRUMENT, not a result.
    - >-
      THE LEDGER MEASURES DISTANCE TO ONE TEMPLATE, NOT SECURITY. A large minimum e means
      this template does not consume this surface at these parameters; it says nothing about
      other attacks, other templates, or future embeddings with a smaller c.
    - >-
      TOY TIER WITHOUT EXCEPTION for any attack behaviour. A negative closes only the exact
      template, published surface and parameters examined, and is NEVER reported as "SQIsign
      is safe from SIDH-style attacks".
    - >-
      SCOPE SEPARATION IS BINDING. This record does not touch endomorphism-ring hardness or
      transcript distinguishability; the endomorphism-ring baseline enters only as the
      yardstick in the decision rule, with its tier named.
    - >-
      ACADEMIC AND DEFENSIVE ONLY. Nothing here is applied to a live deployment, and the one
      outcome that would constitute a break carries a mandatory escalation rather than a
      report.
    - >-
      A MARGIN QUOTED WITHOUT ITS c IS MEANINGLESS. The template's exponent has already moved
      once in the literature and a future move rescales every M1.

