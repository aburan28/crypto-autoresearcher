hypothesis:
  id: H-FROB-4aba8e
  question_id: RQ-FROB-7d8dd4
  goal_id: GOAL-FROB-6333a9
  source_idea_ids:
    - IDEA-20261006-aa03f9
  added: '2026-10-07'
  status: specified
  proposed_by: coordinator
  title: >-
    One-step branching of the field norm of x on y^2 = x^3 + x + 1
    over F_7
  statement: >-
    Let E be y^2 = x^3 + x + 1 over F_7, and let affine points be
    taken in E(F_343). Let the norm send an affine point P to the
    field norm of x(P) down to F_7. L is log2 of the mean fibre size,
    and b is the mean, over ordered pairs of image values, of the
    number of distinct projections of A+B. The prediction taken from
    IDEA-20261006-aa03f9 is b(norm) <= 4 and L(norm) >= 2, together
    with b(random label) >= 6 and with the x-coordinate at b = 2 and
    L = 1. The concrete negative is that the calibrations pass and
    b(norm) > 4 while L(norm) >= 2. L(norm) < 2 with the calibrations
    passed is a second negative. A failed calibration is neither.
    The discrete-log time exponent stays 1/2.
  mechanism: >-
    The representation is R1, the affine x-coordinate, then the field
    norm down to F_7. The operation set is full translation: A and B
    range over fibres and the step is A+B. The claim is the branching
    reading, not saturation at the image size. Explanation 1 says no
    chord-tangent identity bounds the norm of a sum, so b saturates.
    Explanation 2 says the norm of a sum takes at most 4 values on a
    pair of fibres. The priced pair is the measured (L, b). No walk
    and no factor base are proposed.
  assumptions:
    - >-
      The point at infinity is omitted from the domain. Fibres are
      computed on the affine points only. A sum equal to infinity
      contributes no projection, except on the identity control,
      where infinity is one label so that each singleton pair
      contributes one value.
    - >-
      The x-coordinate calibration must return mean fibre size 2 and
      b = 2, which is L = 1 and b = 2, before the norm pair is
      scored. A miss voids the run.
    - >-
      The random label is the frozen function that enumerates affine
      points in lexicographic order and assigns successive integers
      mod 7. It is not redrawn after seeing b. The gate uses it only
      when all seven bins are nonempty.
    - >-
      4A^3+27B^2 = 31 and 31 mod 7 is 3, not 0, so E is nonsingular.
      The run recomputes that residue.
  proof_search_map:
    bottleneck: >-
      The one-step branching b of the norm. If b > 4, explanation 1
      holds on this curve.
    baseline_embedding:
      parameter_slice: >-
        The x-coordinate projection on this same curve, predicted
        L = 1 and b = 2 by the negation identity in IDEA-20260802-002.
      reproduction_check: >-
        Compute that pair first. Score the norm only if the pair is
        exactly mean fibre 2 and b = 2.
    observation_collision:
      observable: the value of the norm in F_7
      distinct_preimage_search: >-
        The run reports the image size and the mean fibre. Two
        affine points with the same norm are the fibre. That report
        is not itself the success gate.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The field norm of the affine x-coordinate, fibres taken on
          E(F_343).
        predicted_gain: >-
          A measured pair with L >= 2 and b <= 4. No smaller
          discrete-log exponent.
    quantifier_order: >-
      There exists a computation on this one curve for which L >= 2
      and b <= 4, and for which the random label on a 7-set has
      b >= 6. Not a statement for every q or every n.
    method_ceiling:
      strongest_certifiable_claim: >-
        The rationals L and b on this one curve, plus the two
        calibration readings. Nothing about a second prime.
      nearby_object_control: >-
        The random label onto seven bins, where b >= 6 is required.
        A norm reading with b > 4 is explanation 1.
    proof_obligations:
      - claim: The x-coordinate pair is exactly L = 1, b = 2 before the norm is scored.
        responsibility: baseline
      - claim: b is the mean image size from IDEA-20260802-002, not a wall-clock proxy.
        responsibility: correctness
      - claim: The gate is one curve and one extension.
        responsibility: scope
      - claim: b <= 4 is strictly stronger than the random-label reading b >= 6 on this instance.
        responsibility: strictness
    not_applicable_reason: >-
      None. The record does not claim an exponent change.
  predictions:
    - metric: one-step branching b of the norm of x
      direction: lower
      minimum_effect: >-
        b(norm) <= 4 and L(norm) >= 2, with b(random label) >= 6 and
        with the x-coordinate at b = 2 and L = 1
  test_boundary:
    instances:
      - y^2 = x^3 + x + 1 over F_7, affine points over F_343
    parameters:
      field_cardinality: 7
      extension_degree: 3
      gate_b: 4
      gate_L: 2
    implementation: experiments/EXP-FROB-884337/implementation/run.py
    budget:
      maximum_runs: 1
      maximum_memory_gb: 1
  falsification_conditions:
    - >-
      The calibrations pass and b(norm) > 4 while L(norm) >= 2.
      That selects explanation 1. The source text says b >= 5; b is
      a rational mean, so the complement of b <= 4 is b > 4.
    - >-
      The calibrations pass and L(norm) < 2, so the norm is not
      lossy enough on this curve.
  interpretation_limits:
    - Toy scope: F_7 and F_343 only.
    - The discrete-log time exponent stays 1/2 and the delta versus Pollard rho is 0, whether or not b <= 4.
    - A passed gate is one rational pair on one curve. It is not a claw algorithm and not a factor base.
    - A failed x-coordinate calibration, a random label with b < 6, and a timeout are not the negative.
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        The number of distinct norms of x(A+B), as A and B range over
        a pair of norm fibres, has mean at most 4.
      random_model_justification: >-
        This imitates the exact identity that x(A+B) and x(A-B)
        exhaust the image of the x-projection on a pair of negation
        fibres, scaled by a factor 2. The scaling is not proved for
        the norm.
      supporting_results:
        - IDEA-20260802-002 records b = 2 for the x-coordinate.
      validation_experiment_ids:
        - EXP-FROB-884337
      falsification_condition: >-
        On this curve the measured mean b is greater than 4, or the
        maximum over fibre pairs is at least 7 while the mean is at
        most 4. The maximum is reported and does not choose the
        reading row.
