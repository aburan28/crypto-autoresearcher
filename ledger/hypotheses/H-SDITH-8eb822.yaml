hypothesis:
  id: H-SDITH-8eb822
  question_id: RQ-SDITH-001
  added: '2026-08-25'
  derived_from_idea: IDEA-20260805-43d6df
  statement: >-
    Building a memory-charged information-set-decoding baseline by taking a published
    free-memory optimum and adding a memory penalty to it is a PROCEDURALLY WRONG
    construction, and the error is one-sided and materially large. Four limbs are asserted.
    (S1) THE CHARGING MODEL REPRODUCES THE PROGRAM'S OWN ANCHOR. Under an access-latency
    charge in which a random access into a store of M cells costs the square root of M, a
    direct search over baby-step giant-step table sizes recovers both the two-thirds
    full-cost exponent and the two-thirds-exponent optimal table size, at three problem
    sizes, within one bit. A model that cannot reproduce the anchor this program already
    records may not be used to charge anything.
    (S2) THE OPTIMUM MOVES. Re-optimizing the Dumer or Stern tuning parameters UNDER the
    charge lands on a strictly smaller list parameter than the free-memory optimum wherever
    the free optimum is not already at the minimum, so the charged optimum is a different
    point of the same parametric family rather than a rescaling of the same point.
    (S3) THE RE-OPTIMIZATION ERROR IS STRICTLY POSITIVE AND EXCEEDS THREE BITS. Charging the
    free optimum without re-optimizing overstates the charged minimum. Positivity is forced
    by the definition of a minimum; what is asserted and falsifiable is that the magnitude
    exceeds three bits at every illustrative parameter set evaluated.
    (S4) CHARGING DOES NOT REORDER DUMER AGAINST PRANGE AT THESE SHAPES. The charged
    advantage of Dumer over Prange stays strictly positive at every illustrative parameter
    set, so the hoped-for reordering of which exponent is the baseline does NOT occur at
    Dumer level.
    The hypothesis is FALSE in these specific senses: the anchor gate missing by more than
    one bit refutes S1 and terminates the line; a charged optimum whose list parameter does
    not fall refutes S2 and withdraws the mechanistic account even if the error persists; an
    error under one bit at every set downgrades S3 from a headline to a footnote; and a
    NEGATIVE charged Dumer-Prange gap at any set refutes S4 and CONFIRMS the reordering
    hypothesis, which would be the more consequential outcome and is pre-registered here so
    it cannot be claimed after the fact.
  mechanism: >-
    Published ISD cost tables report the optimum of a two-parameter family taken under FREE
    memory. The natural way to build a memory-charged baseline - take the published row and
    add the memory penalty - evaluates the charged objective at the FREE minimizer, which is
    not the charged minimizer. Evaluating a function at a non-minimizer can only overstate
    its minimum, so the error is one-sided by construction rather than noise that averages out.
    Why the minimizer moves is mechanistic and predicts the direction. The running time and
    the memory are both increasing in the list parameter, while the merge cost falls with the
    modulus parameter and the list size rises with it. Free-memory optimization pushes the list
    parameter up until the collision term balances the list-building term. The charge multiplies
    BOTH terms by a factor that is itself increasing in the list parameter, so the charged
    objective has a strictly steeper penalty there and its minimizer sits at a smaller list
    parameter. The size of the gap is second-order in the curvature of the log cost around the
    free optimum, which is exactly why it is a few bits rather than a few hundred and exactly
    why it is invisible unless it is looked for.
    The reason to check the charging model against baby-step giant-step first is that a charging
    model which fails the program's own recorded anchor would produce numbers nobody can use,
    and checking costs nothing. The reason to sweep the latency exponent rather than pick one is
    that the answer depends on it, and reporting a curve is honest where reporting a chosen
    column is not.
  assumptions:
    - >-
      That the square root is the right latency exponent for a random access into a store of M
      cells, on a two-dimensional layout argument. A three-dimensional layout gives a cube root
      and an idealized random-access machine gives a constant. All three are cheap and the
      experiment evaluates all of them as a swept curve rather than choosing one.
    - >-
      That list construction is a random-access operation and is therefore charged. If a variant
      can be implemented as sorted streaming merges, only the probe phase pays; the sensitivity
      of the conclusion to this is reported rather than assumed away.
    - >-
      That the Gaussian elimination is not charged for memory access, its working set being
      polynomial and its access pattern regular. Charging it would move Prange in the same
      direction, so the comparison is insensitive to this at first order - and the experiment
      recomputes under two different elimination cost choices to check that.
    - >-
      That published tables optimize under free memory. RECALLED and UNVERIFIED as a general
      statement about the literature; a table that already optimizes under a charge would not
      exhibit the error at all, and the reading stage checks which kind any transcribed table is.
    - >-
      That the parameter sets evaluated are ILLUSTRATIVE SHAPES and not any scheme's real
      parameters. The specification of any deployed scheme is NOT READ by the parent proposal,
      and no conclusion here is scoped to a deployed parameter set.
  proof_search_map:
    bottleneck: >-
      Whether the charged objective's minimizer differs from the free objective's minimizer. If
      the two coincided, the whole construction would be a change of coordinates and the error
      would be exactly zero. Everything else is arithmetic on a declared cost model.
    baseline_embedding:
      parameter_slice: >-
        Baby-step giant-step at three problem sizes, where this program's own KN-TECH-035 records
        the full-cost exponent and the optimal table size independently of this hypothesis.
      reproduction_check: >-
        The charging model must recover both the two-thirds full-cost exponent and the
        two-thirds-exponent optimal table size within one bit at all three sizes, by direct search
        rather than by fitting. The model was not tuned to hit that exponent, which is what makes
        it a check.
    observation_collision:
      observable: >-
        The pair consisting of the time exponent and the memory exponent at an algorithm's own
        optimum.
      distinct_preimage_search: >-
        SUCCEEDS TRIVIALLY AND IS DISCLOSED. The fibre over a single such pair contains an unbounded
        family of algorithms - two entirely different algorithms with the same curve are
        indistinguishable under this projection. The projection is nevertheless compatible with the
        operation being studied, because the charging functionals are functions of that pair alone by
        construction. What the collision forbids is reading any charged number as a statement about
        HOW an algorithm works.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Track the whole parametric curve traced by the tuning parameters, rather than the single
          point published tables report.
        predicted_gain: >-
          Makes the re-optimization error visible at all; a scalar-cost framing cannot see it,
          because the error is precisely the difference between two points of that curve.
      - transform: specialization_pack
        proposed_object: >-
          Sweep the latency exponent over a declared range and report the charged optimum, the memory
          exponent and the Dumer-Prange gap at each, rather than at one chosen exponent.
        predicted_gain: >-
          Converts a model-dependent answer into a curve, and locates the crossing exponent - if one
          exists in range - at which the reordering question is answered in a model-independent way.
    quantifier_order: >-
      CLAIMED. FOR ALL evaluated illustrative parameter sets, the charged objective evaluated at the
      free minimizer strictly exceeds the charged objective at the charged minimizer, and the excess
      exceeds three bits. NOT CLAIMED. That this holds for every parameter set, for every ISD variant,
      or for any deployed scheme's real parameters. In particular the representation-technique variants,
      whose advantage is most memory-bought and which are therefore the real test of the reordering
      question, are NOT MODELLED and nothing here bears on them.
    method_ceiling:
      strongest_certifiable_claim: >-
        For the two variants modelled, at the illustrative parameter sets evaluated, under the declared
        charging models, the charged optimum sits at a stated point, the re-optimization error is a
        stated number of bits, and the charged Dumer-Prange gap has a stated sign and magnitude. It can
        never certify a security level, never certify anything about unmodelled variants, and never
        certify that any published table commits the error - the claim is about a downstream procedure,
        not about any paper.
      nearby_object_control: >-
        A parameter set whose FREE optimum already sits at the minimal list parameter with no merge
        modulus. There the free and charged optima coincide and the re-optimization error must be
        EXACTLY zero. An implementation that adds a memory penalty unconditionally, or that mis-computes
        the list size at the minimal parameter, returns a nonzero value there and is caught.
    proof_obligations:
      - claim: The charging model reproduces the recorded baby-step giant-step full-cost anchor.
        responsibility: baseline
      - claim: The re-optimization error is non-negative by the definition of a minimum.
        responsibility: correctness
      - claim: The charged minimizer's list parameter is strictly smaller wherever the free one is not minimal.
        responsibility: strictness
      - claim: The charged Dumer-Prange gap has the stated sign at the evaluated sets.
        responsibility: correctness
      - claim: The swept-latency-exponent responses are monotone in the declared quantities.
        responsibility: feasibility
      - claim: Nothing here is a security level or a statement about unmodelled variants.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    Explicitly null rather than omitted. No exponent is moved by this hypothesis and no algorithm is
    proposed. The quantity computed is which exponent should be treated as the BASELINE, which is an
    exponent-level bookkeeping question rather than a complexity improvement, so the four promotion
    gates of agents/coordinator.md have no target here and may not be invoked to elevate any number
    produced.
  heuristic_assumptions:
    - id: HEUR-SDITH-43D-1
      formal_statement: >-
        ACCESS-LATENCY EXPONENT. A random access into a store of M cells costs time proportional to the
        square root of M in a two-dimensional physical layout, and this per-access charge is the correct
        aggregate model for the list operations of a Dumer-style information-set decoder.
      random_model_justification: >-
        The geometric half is standard - M cells in a plane occupy area proportional to M and have
        diameter proportional to its square root, and a signal must cross it. What is NOT rigorous is
        that a per-access charge is the right aggregate for a pipelined parallel implementation with
        many accesses in flight. This program's KN-TECH-035 is the authority for the doctrine and its own
        source is not read here.
      supporting_results:
        - 'knowledge/techniques/KN-TECH-035, read by the parent session, supplying the charging doctrine and the baby-step giant-step anchor.'
      validation_experiment_ids:
        - EXP-SDITH-042f1f
      falsification_condition: >-
        The charging model misses the recorded baby-step giant-step full-cost anchor by more than one bit
        in either the exponent or the optimal table size, at any of the three sizes. The model is refuted
        before it is used, and that refutation is itself the reported result.
    - id: HEUR-SDITH-43D-2
      formal_statement: >-
        MODEL FIDELITY. The declared Prange and Dumer cost expressions are faithful enough that the
        DIFFERENCE between the free and charged optima is preserved, even where their absolute values are
        not.
      random_model_justification: >-
        None beyond a structural argument - the error is second-order in the curvature of the log cost
        near the free optimum, and curvature is a more robust feature of a cost model than its level.
        This is an argument rather than a proof and is the weakest link in the hypothesis, which is why
        it carries its own validation arm.
      supporting_results: []
      validation_experiment_ids:
        - EXP-SDITH-042f1f
      falsification_condition: >-
        The re-optimization error changes by more than one bit between two deliberately different
        Gaussian-elimination cost choices. The robustness argument is then refuted and every error figure
        must be reported with that spread attached.
  structural_ingredients:
    - description: >-
        Full-cost accounting - charging memory, wiring and communication - and the baby-step giant-step
        anchor used as the charging model's reproduction target.
      citation: 'knowledge/techniques/KN-TECH-035, as this program records it.'
      provenance: internal
      verified_by: 'Read by the parent proposal session; cited as that record''s claim, not as its own source''s.'
      role: charging doctrine and known-answer calibration target
    - description: >-
        The Prange and Dumer or Stern cost expressions.
      citation: >-
        DECLARED IN THE PARENT PROPOSAL, not taken from a source. Every line of the model is stated there
        so that a reviewer can attack the model rather than the arithmetic.
      provenance: internal
      verified_by: 'The parent proposal IDEA-20260805-43d6df, mechanism block.'
      role: the parametric family whose free and charged optima are compared
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: bsgs_anchor_reproduction
      direction: different
      minimum_effect: >-
        Both the full-cost exponent and the optimal table size within 1.0 bit of two thirds of the problem
        exponent, at all three sizes. THIS GATE RUNS FIRST AND CAN TERMINATE THE LINE.
    - metric: reoptimization_error_bits
      direction: higher
      minimum_effect: >-
        Strictly positive at every parameter set - forced by the definition of a minimum - and predicted
        to exceed 3 bits at all three. Under 1 bit at all three downgrades the headline to a footnote.
    - metric: charged_optimum_list_parameter_movement
      direction: lower
      minimum_effect: >-
        The charged optimum's list parameter is STRICTLY LESS than the free optimum's at every parameter
        set where the free optimum is not already minimal. If it does not move, the mechanistic account is
        wrong even if the error is not.
    - metric: charged_dumer_prange_gap_bits
      direction: higher
      minimum_effect: >-
        Strictly positive at every illustrative set. A NEGATIVE value at any set falsifies this prediction
        and CONFIRMS the reordering hypothesis, which is the more consequential outcome and is pre-registered
        here precisely so it cannot be claimed after the fact.
    - metric: latency_exponent_sweep_monotonicity
      direction: different
      minimum_effect: >-
        The charged optimum's list parameter, its memory exponent and the Dumer-Prange gap must each be
        non-increasing in the swept latency exponent, with the zero-latency-exponent column reproducing the
        free-memory table EXACTLY. A non-monotone point localizes a fault to a specific exponent rather than
        leaving an unlocated anomaly.
  test_boundary:
    instances:
      - >-
        Three illustrative syndrome-decoding parameter shapes spanning a non-binary regime and a binary
        regime, as declared in the parent proposal. These are SHAPES, not any scheme's parameters.
      - >-
        A deliberately constructed parameter set whose free optimum is already at the minimal list parameter
        with no merge modulus, as the null object.
      - >-
        Baby-step giant-step at three problem sizes, as the positive control.
      - >-
        A synthetic algorithm whose memory grows exponentially at a declared rate, as a closed-form check on
        the charging arithmetic itself.
    parameters:
      variants: 'Prange and Dumer or Stern only. Representation-technique variants are NOT modelled.'
      charging_models: 'free memory; square-root access latency; area-time-squared reported as its own column'
      latency_exponent_sweep: '0, 1/6, 1/4, 1/3, 1/2, 2/3'
      tuning_grid: 'list parameter even from 2 to 24; merge modulus from 0 to 49'
      gaussian_elimination_variants: 'two deliberately different cost choices, both reported'
    implementation: >-
      Pure Python integer and float arithmetic under experiments/EXP-SDITH-042f1f/driver/. No solver, no
      algebra library, no external dependency. Nothing under harness/ is modified.
    budget:
      wall_clock_seconds_total: 600
      maximum_memory_gb: 2
      maximum_runs: 6
  falsification_conditions:
    - >-
      The charging model fails to reproduce the recorded baby-step giant-step anchor within one bit. The model
      is refuted BEFORE it is used, and that IS the result - it would mean this program's charging doctrine and
      its arithmetic realization disagree, which is worth more than any decoding number.
    - >-
      The re-optimization error is under one bit at every parameter set. The headline downgrades from a
      materially wrong procedure to a very slightly wrong one, and the record must say so in those words.
    - >-
      The charged optimum's list parameter does not fall below the free optimum's. The mechanistic account is
      wrong and must be withdrawn even if the error persists.
    - >-
      The charged Dumer-Prange gap is negative at any illustrative set. Limb S4 is falsified and the reordering
      hypothesis is CONFIRMED at Dumer level, which reverses this hypothesis's conclusion and sharply raises the
      priority of modelling the representation-technique variants.
    - >-
      The latency-exponent sweep is non-monotone in any of the three reported quantities. An implementation
      fault, localized to the offending exponent.
    - >-
      The null object - a set whose free optimum is already minimal - returns a nonzero re-optimization error.
      The instrument adds a penalty unconditionally and NO error figure from it is trustworthy.
  interpretation_limits:
    - >-
      CLAIM TIER cost-model derivation. No decoding is performed, no certificate is produced, no instance is
      solved. Nothing here may be reported as a break, a weakness or a security level.
    - >-
      Variant coverage is the dominant limitation. Prange and Dumer are modelled; the representation-technique
      variants, whose advantage is most memory-bought and which are the real test of the reordering question,
      are NOT READ and NOT MODELLED. A negative at Dumer level is weak evidence about them and must never be
      reported as settling the family.
    - >-
      The illustrative parameter sets are SHAPES, not any scheme's parameters. Every conclusion is scoped to the
      shapes actually evaluated.
    - >-
      The re-optimization error is a statement about a PROCEDURE, not about any published paper. No published
      table is accused of committing it; the claim is that a downstream analyst charging a published optimum
      would.
    - >-
      The cost-model conservatism cuts both ways and is stated because it works against this hypothesis's own
      conclusion: a cheaper Gaussian elimination lowers Prange more than Dumer and would SHRINK the charged
      Dumer advantage.
  status: proposed
  proposed_by: idea-generator
  specified_by: coordinator
  prior_evidence_refs:
    - RQ-SDITH-001
    - IDEA-20260805-43d6df
    - IDEA-20260805-cbd93d
    - KN-TECH-035
    - KN-OPEN-017
  distinguishable_outcomes:
    - outcome: >-
        The anchor gate passes within one bit, the charged optimum's list parameter falls at every non-minimal
        set, the re-optimization error exceeds 3 bits everywhere, the charged Dumer-Prange gap is positive
        everywhere, the sweep is monotone, and the null returns exactly zero.
      meaning: >-
        All four limbs hold. This question owns a memory-charged decoding baseline whose charging model passed a
        reproduction check it was not tuned for, together with a quantified one-sided defect in the standard way
        such baselines are built. Scoped to two variants, three shapes and the declared models; the reordering
        question remains OPEN for the unmodelled variants and the record must say so.
    - outcome: >-
        The charged Dumer-Prange gap is NEGATIVE at any illustrative set.
      meaning: >-
        Limb S4 is FALSE and the reordering hypothesis is CONFIRMED at Dumer level - once memory is charged, the
        memory-bought variant loses to the simplest one at that shape. This reverses the hypothesis's headline,
        is the more consequential result, and was pre-registered so it cannot be claimed post hoc. It sharply
        raises the priority of modelling the representation-technique variants and requires independent
        replication before being recorded.
    - outcome: >-
        The charging model misses the baby-step giant-step anchor by more than one bit.
      meaning: >-
        Limb S1 is FALSE and the LINE TERMINATES. No charged decoding number may be reported at all. The finding
        is that this program's charging doctrine and its arithmetic realization disagree, which is more valuable
        than any number the line would have produced.
    - outcome: >-
        The error is strictly positive but under one bit at every set, or the charged optimum's list parameter
        does not fall.
      meaning: >-
        Limb S3 downgrades to a footnote in the first case; limb S2 and the mechanistic account are FALSE in the
        second, and the account is withdrawn even though positivity is forced and survives. Either way the
        charged baseline itself remains a usable deliverable and the headline does not.
    - outcome: >-
        The null object returns a nonzero re-optimization error, or the sweep is non-monotone.
      meaning: >-
        INSTRUMENT FAULT, localized. The null failure means a penalty is being added unconditionally and no error
        figure is trustworthy; the non-monotonicity localizes the fault to a specific latency exponent. In both
        cases the run set is invalid rather than negative.
