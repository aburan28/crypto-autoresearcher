  title: >-
    One F_5 S_3 first-fall gap against a support-matched null
  statement: >-
    On the first short-Weierstrass curve y^2 = x^3 + A x + B over F_5, in
    lexicographic order of (A, B), whose trace of Frobenius is nonzero,
    frozen before any matrix is built, the raw Weil descent of S_3 at
    m=3 and n'=1 has a first positive new_falls degree that differs by at
    least 1 from the median of the same degree on 20 support-matched null
    systems. new_falls(D) is rank(M_D) minus the rank of the
    degree-exactly-D columns of M_D minus rank(M_{D-1}). The degree cap is
    6. A value with no positive new_falls through degree 6 is recorded as
    7 for the comparison only. Equal comparison values falsify a structural
    gap at this cell. No subexponential ECDLP cost is claimed.
  mechanism: >-
    OBJECT FRAME. Representation R2: the curve equation and the descended
    polynomials, not a coordinate of a point. Operation set Sigma:
    multiplication by degree-1 monomials that appends the next Macaulay
    block. Sigma is not translation on the prime-order subgroup.
    Trichotomy: branching. The integer new_falls(D) does not determine the
    new rows, so the fall count does not propagate as a function of the
    previous integer alone. Two row spaces of equal rank collide, so the
    projection from the row space onto the fall sequence is lossy. The
    open number is the gap between the Semaev first positive degree and
    the null median. S_3 is the system under test, which is the framework
    of KR-IC-5a43e5, and the addition is the prime-field null comparison
    at this one cell. This does not propose a factor base and does not
    claim an escape from the bounded-degree algebraic factor-base scope. A
    gap of at least 1 means the support-matched null does not reproduce
    the Semaev fall at this cell. Equal values mean the support accounts
    for the fall at this cell, including the censored pair (7, 7). The
    descent here is the polynomial system at n'=1. It is not the GHS map
    to a hyperelliptic Jacobian.
  assumptions:
    - >-
      Over F_5, trace of Frobenius nonzero is the ordinary test used to
      freeze the curve. If the frozen curve is later shown supersingular,
      the cell is void, not a negative.
    - >-
      The monomial order is grevlex and is frozen before the null draws.
    - >-
      The null keeps the Semaev support and replaces nonzero coefficients
      by independent uniform nonzero field elements. The zero pattern is
      not redrawn.
    - >-
      Degree cap 6. The sentinel 7 means no positive new_falls through
      degree 6. It is not a measured degree of 7.
  proof_search_map:
    bottleneck: >-
      The integer ceil of nothing here: the deciding step is the
      first-positive-new_falls comparison between one Semaev profile and
      the median of 20 support-matched null profiles at the frozen cell.
    baseline_embedding:
      parameter_slice: >-
        q=5, m=3, n'=1, raw (unsymmetrized) S_3, grevlex, degree cap 6,
        sentinel 7, 20 null draws, one ordinary curve frozen by the
        lexicographic nonzero-trace rule.
      reproduction_check: >-
        A second, independently written implementation of new_falls
        recomputes one null draw. Disagreement voids the cell.
    observation_collision:
      observable: >-
        The first positive new_falls degree, and the absolute gap between
        the Semaev comparison value and the null median.
      distinct_preimage_search: >-
        Two row spaces of equal rank collide onto the same fall integer,
        so the profile is lossy by construction. The censored pair
        (7, 7) is recorded as agreement, not as a measured degree.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The raw descended S_3 system at the frozen F_5 cell plus its 20
          support-matched nulls.
        predicted_gain: >-
          One integer gap deciding whether the support accounts for the
          Semaev fall at this cell. No attack cost.
    quantifier_order: >-
      For the frozen curve and the frozen support, for all degrees D in
      1..6, the Semaev comparison value and the median of the 20 null
      comparison values are computed; there exists a gap of at least 1 or
      the cell falsifies a structural gap.
    method_ceiling:
      strongest_certifiable_claim: >-
        Either the absolute gap is at least 1 at this cell, or the support
        accounts for the fall at this cell. Neither outcome bounds a last
        fall degree, varies an extension degree, or moves an exponent.
      nearby_object_control: >-
        The second-implementation repeat on one null draw must agree; the
        censored pair (7, 7) must read as agreement; a dense random system
        of different support is inadmissible as the control.
    proof_obligations:
      - claim: The gap depends only on the frozen support comparison.
        responsibility: correctness
      - claim: The sentinel 7 is a cap, not a fall at degree 7.
        responsibility: scope
    not_applicable_reason: >-
      One-cell rank-profile measurement. Not a proof that the first-fall
      assumption fails or holds in general, and not a proof about the
      last-fall bound. The audits above are the cheap pre-compute checks;
      no theorem is assembled from them.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        With the zero pattern held fixed, independent uniform nonzero
        coefficients on that support produce a first-positive new_falls
