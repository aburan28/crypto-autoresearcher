hypothesis:
  id: H-XEDN-fe3446
  question_id: RQ-XEDN-002
  statement: >-
    On every surface admitted to the EXP-XEDN-004 census -- y^2 = x^3 + a(t)x +
    b(t) over F_p(t) with a != 0, deg a <= 2, deg b = 6 exactly, j non-constant,
    Delta = 4a^3 + 27b^2 not identically zero, p in {7, 13, 19, 31} -- the
    observed value max_|coeff| = 1 for the shortest verified Mordell-Weil
    relation is FORCED by the geometry of the surface and by the range of the
    search instrument, jointly and independently of the removal of the mu_3
    automorphism. Specifically, three statements are asserted together:
      (S1) deg Delta = 12, the fibre at t = infinity is smooth, and when Delta is
           squarefree every bad fibre is of Kodaira type I_1 and therefore
           irreducible; hence by Shioda-Tate rank E(F_p(t)) = 8 - sum_v (m_v - 1)
           = 8, all local contribution terms contr_v vanish, and the Mordell-Weil
           lattice under the Shioda height pairing is the E_8 root lattice.
      (S2) every free-x section of the censused shape (x, y polynomial,
           deg x <= 2, deg y <= 3, y != 0) satisfies (P . O) = 0 and therefore
           has canonical height h(P) = 2*chi = 2 EXACTLY -- for deg x equal to
           2, 1 or 0 alike -- so every such section is a root of that E_8, there
           are at most 240 of them, and consequently for n enumerated sections
           the integer relation lattice has rank at least n - 8.
      (S3) whenever two enumerated sections P, Q satisfy <P,Q> = -1, the element
           -(P + Q) is again a root, again a section of the same shape, and
           therefore -- the census enumeration being an exhaustive loop over
           F_p^3 -- again enumerated; the three then satisfy a support-3 relation
           with all coefficients +-1 and infinity norm exactly 1. The mu_3 orbit
           sum S + wS + w^2 S = O on the isotrivial j = 0 family is one instance
           of this configuration, so removing mu_3 removes one construction of
           such triples and leaves the E_8 root system intact.
    The hypothesis therefore predicts that a matched null object -- n roots drawn
    uniformly from the 240 roots of E_8, with n equal to a censused surface's
    slot count, subjected to the identical shortest-relation search -- reproduces
    max_|coeff| = 1 at the slot counts occurring in the census. If it does, the
    census statistic is a property of E_8 rather than of a != 0 or of j
    non-constant, and the correct claim boundary of EV-XEDN-003 is narrower than
    recorded. If it does not, S3 is wrong, the surfaces carry structure the null
    lacks, and the completed goal's measurement gains rather than loses value.
    This hypothesis asserts nothing about whether the measurement was correctly
    performed; it is about what the measured number means. No status change to
    any existing record is proposed or implied.
  mechanism: >-
    The derivation runs in five steps and each is separately falsifiable.

    STEP 1 -- the surface is rational and all-I_1. For deg a <= 2 and deg b = 6
    exactly, deg(4a^3) <= 6 while deg(27 b^2) = 12, so deg Delta = 12 with
    leading coefficient 27 * lc(b)^2 != 0. Substituting u = 1/t with
    x -> x/u^2, y -> y/u^3 sends a(t) to u^4 a(1/u), of u-adic valuation >= 2,
    and b(t) to u^6 b(1/u), of valuation 0 because deg b = 6 exactly; hence the
    transformed discriminant is a unit at u = 0, the fibre over t = infinity is
    smooth, and the model is minimal there. All 12 units of Euler number
    therefore sit over the finite roots of Delta. If Delta is squarefree it has
    12 simple roots, each with v(Delta) = 1 and v(a), v(b) = 0, which is Kodaira
    type I_1: a nodal cubic, ONE component, m_v = 1. Then sum_v (m_v - 1) = 0.

    STEP 2 -- rank and lattice. Shioda-Tate for a rational elliptic surface
    (chi = 1, Euler number 12) gives rank E(k) = 8 - sum_v (m_v - 1), hence
    rank = 8 on an all-I_1 surface, with trivial torsion and with the
    Mordell-Weil lattice equal to E_8 under the Shioda pairing
    <P,Q> = chi + (P.O) + (Q.O) - (P.Q) - sum_v contr_v(P,Q), all contr_v being
    0 because every fibre is irreducible. THE IMMEDIATE CONSEQUENCE IS A HARD
    CEILING: no honest rank statistic on such a surface may exceed 8.

    STEP 3 -- every free-x section is a root. h(P) = 2*chi + 2*(P.O) -
    sum_v contr_v(P) = 2 + 2*(P.O). For a polynomial section, X = u^2 x(1/u) is
    regular at u = 0 whenever deg x <= 2, so P does not meet the zero section and
    (P.O) = 0; hence h(P) = 2 identically, for deg x in {0, 1, 2} alike. Note
    what this separates: h(P) is the constant 2 while the census's diagonal
    quantity h_naive(P) = max(deg num x, deg den x) takes values 0, 1 and 2. A
    Gram matrix whose diagonal is h_naive is not the height Gram, its kernel is
    not the relation lattice, and its rank is not the Mordell-Weil rank.

    STEP 4 -- the coefficient bound is a root-system identity. In a simply-laced
    root system every root has norm 2 and distinct non-opposite roots pair to 0
    or +-1. If <P,Q> = -1 then R := -(P + Q) has <R,R> = 2 + 2 - 2*1 = 2, so R is
    a root, so h(R) = 2, so by step 3 read backwards R is again a free-x section
    of the censused shape. The census enumerates ALL (x_0, x_1, x_2) in F_p^3, so
    R is enumerated. Then P + Q + R = O has infinity norm 1. Hence
    max_|coeff| = 1 follows from the existence of a single pairing of -1 among
    the enumerated sections, with a, j and mu_3 appearing nowhere in the argument.

    STEP 5 -- the forced value that can refute this hypothesis. Step 2's ceiling
    is checkable against material already committed. The archived
    experiments/EXP-XEDN-004/runs/RUN-XEDN-004-MAIN/raw-result.json records a
    per-surface field "span_rank", the rank of the census's pseudo-Gram, with
    values including 18 (p = 13, 19 slots), 13 (p = 13, 15 slots), 11 (p = 31, 11
    slots) and 10 (p = 19, 13 slots). If S1 and S2 hold on those surfaces, those
    numbers are impossible and the pseudo-Gram is refuted as a rank instrument;
    the corresponding coranks (reported as 0, 1 or 2) are likewise wrong, since
    S2 forces corank >= n - 8, i.e. >= 11 on the 19-slot surface. Conversely, if
    a source check or a recomputation shows the rank ceiling does not apply, THIS
    HYPOTHESIS is refuted and the census diagnostic stands. The experiment is
    ordered so that this comparison runs first, at zero compute.

    WHAT THE MECHANISM DOES NOT SAY. It does not say the census's primary metric
    was mismeasured. Those relations were verified by group-law identity over
    F_p(t) and by specialisation at >= 20 smooth fibres, and TASK-20260725-005
    independently recomputed one p = 7 surface. It does not say the completed
    goal failed its criteria. It says that a number equal to the floor of its own
    range, produced by a search that early-returns on that floor, on an object
    where elementary geometry forces that floor, is not evidence about the
    property the goal was set up to discriminate.
  assumptions:
    - >-
      The recalled statements of Shioda-Tate, of the Shioda height formula, and
      of contr_v = 0 for an irreducible fibre are the real ones. NOT VERIFIED
      AGAINST A READ SOURCE. This is the largest risk in the hypothesis and
      stage 1 of EXP-XEDN-affa94 exists solely to remove it; the experiment may
      not proceed past it on memory.
    - >-
      The Weierstrass model is relatively minimal and minimal at t = infinity for
      every admitted (a, b). Argued in step 1 from deg b = 6 exactly; to be
      checked, and any surface failing it is excluded rather than counted.
    - >-
      E(F_p(t))_tors is trivial on the admitted surfaces. The census excludes
      y = 0 (2-torsion) only; a 3-torsion section would have h = 0, would not be a
      root, and would break step 3 for that surface.
    - >-
      enumerate_slots_frozen_mod is exhaustive over free-x sections of the
      declared shape. It loops over all (x_0, x_1, x_2) in F_p^3 and
      canonicalises y against -y, which is exhaustive by inspection for
      deg x <= 2; step 4's "hence also enumerated" depends on it and it must be
      confirmed by re-reading the frozen predicate.
    - >-
      p > 3, so the short Weierstrass form and Delta = 4a^3 + 27b^2 are the right
      objects. All censused p satisfy this.
  proof_search_map:
    bottleneck: >-
      The single step whose removal changes the conclusion is the identification
      of the census's diagonal quantity h_naive(P) = deg x(P) with the canonical
      Shioda height h(P). If they coincide, the pseudo-Gram is the height Gram,
      its rank is the Mordell-Weil rank, and no anomaly exists. If they do not,
      every rank and corank in the archive is uninterpretable and the observed
      max_|coeff| = 1 has to be explained by something else -- which is what
      steps 3 and 4 supply. Everything in the hypothesis reduces to that
      identification and to the value of contr_v on an I_1 fibre.
    baseline_embedding:
      parameter_slice: >-
        The exact baseline to reproduce is the census itself at p = 7 on the
        single surface independently recomputed by TASK-20260725-005 (a = [2,2,6]
        family; the validation notes record n_slots = 3, max_|coeff| = 1,
        specialisation 20/20, mu_3 absent). Reproducing that cell is the boundary
        at which any reimplementation is allowed to be compared with the Sage
        original.
      reproduction_check: >-
        Frozen fixture, not a resemblance: the reimplementation must return the
        identical slot set, the identical verified shortest relation vector, and
        the identical specialisation count on that surface. A curve that "looks
        similar" is not a reproduction. If the fixture does not reproduce, the
        reimplementation differs from the original, the discrepancy is an
        infrastructure signal under AGENTS.md rule 5, and no mathematical
        conclusion about the census may be drawn from it.
    observation_collision:
      observable: >-
        The reported statistic max_|coeff| = 1, together with the derived
        slope-vs-log-p of 0.
      distinct_preimage_search: >-
        The collision search is the heart of the hypothesis and it is cheap:
        exhibit two ground-truth objects on opposite sides of the claimed
        conclusion that share the observable. Object A: a censused non-isotrivial
        surface (a != 0, j non-constant, mu_3 absent), which the census reports
        at max_|coeff| = 1. Object B: the isotrivial j = 0 family of
        EXP-XEDN-003, where mu_3 IS present and available as the relation source,
        which EXP-XEDN-003 also reports at max_|coeff| = 1. Object C, the null:
        n roots drawn uniformly from E_8, which carry no surface, no a, no j and
        no mu_3 at all, and which the hypothesis predicts also give 1. A, B and C
        sit on both sides of "mu_3 is the mechanism" and the observable does not
        separate them. That is a direct falsifier of identifiability unless an
        additional condition separates them, and the hypothesis asserts that no
        such condition is present in the census design. THE COLLISION CAN FAIL:
        if C returns a value above 1 at the census's slot counts, A and C are
        separated and the hypothesis is wrong.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable fixed at max_|coeff| = 1 and vary the forgotten
          structure -- the fibre configuration of the surface. The intrinsic
          invariant that distinguishes the resulting objects is the local
          contribution profile (contr_v(P))_v, which is identically zero on an
          all-I_1 surface and nonzero as soon as a fibre is reducible. This is
          the counterexample construction the transform prescribes: it produces
          objects with the same observable and different intrinsic structure, and
          it simultaneously supplies the experiment's positive control.
        predicted_gain: >-
          None to any attacker. The gain is a named obstruction: the observable
          is blind to the only invariant that varies within the tested family,
          and the region where that invariant does vary -- surfaces with
          reducible fibres -- has never been made a treatment arm in this lane.
      - transform: stronger_invariant
        proposed_object: >-
          Replace the reported scalar max_|coeff| by the pair (height spectrum,
          relation-lattice rank), i.e. preserve more state than the final
          question requires. The rank alone carries a hard ceiling of 8 that the
          scalar does not, and it is the ceiling that makes the archive
          checkable at zero compute.
        predicted_gain: >-
          Converts an unfalsifiable scalar into a quantity with a derived upper
          bound, which is what makes stage 0 of the experiment decisive.
    quantifier_order: >-
      The census's operative claim, written with explicit quantifiers: THERE
      EXISTS a constant B = 3 such that FOR ALL p in {7,13,19,31} and FOR ALL
      eligible non-isotrivial surfaces S, the shortest verified relation among
      the free-x sections of S has infinity norm <= B, with no slope against
      log p. The hypothesis's counter-statement inverts the order of discovery
      rather than of quantification: FOR ALL all-I_1 rational elliptic surfaces
      and FOR ALL free-x sections, h(P) = 2, so THE SAME constant 1 is forced by
      a fact that is uniform in p, in a, and in j -- meaning the universal
      quantifier over p in the census's claim is satisfied vacuously rather than
      informatively. The quantifier trap being hunted is on the WITNESS: the
      census's witness (a verified short relation) is allowed to depend on the
      surface, but the hypothesis asserts the witness is produced by a
      construction (the root triangle) that depends on nothing the census varied.
      A uniform conclusion whose witness is instance-independent is not evidence
      about the instance.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most, the audit can certify that on all-I_1 surfaces in the frozen
        degree window, the canonical height of every free-x section is 2 and
        that a matched E_8-root null reproduces max_|coeff| = 1 at the observed
        slot counts. It CANNOT certify that Mordell-Weil relation coefficients
        are bounded on non-isotrivial families in general, cannot certify
        anything at any p outside {7,13,19,31} without rerunning, cannot close
        candidate B2, and cannot bear on crypto scale. Writing it up as more than
        that would be the premature-closure failure mode the protocol names.
      nearby_object_control: >-
        The closest object where the hoped-for conclusion FAILS is a surface in
        the same degree window with a NON-squarefree Delta, hence a reducible
        fibre, hence contr_v > 0 for sections meeting a non-identity component.
        There S1 gives rank <= 7 and S2 fails: the height spectrum splits away
        from the constant 2 (an I_2 fibre contributes 1/2, giving h = 3/2). A
        method that returns h = 2 and rank 8 on both members of that pair has not
        identified the load-bearing structure and no negative may be reported
        from it. Four such surfaces are already in the archive by recomputation
        of Delta, so the control costs nothing to populate; a graded version with
        k = 0, 1, 2, 3 forced reducible fibres is specified in the experiment.
    proof_obligations:
      - claim: deg Delta = 12 and the fibre at infinity is smooth for the admitted (a, b).
        responsibility: correctness
      - claim: Delta squarefree implies every bad fibre is I_1, hence irreducible, hence contr_v = 0.
        responsibility: baseline
      - claim: Shioda-Tate rank = 8 - sum_v (m_v - 1); hence rank <= 8 always.
        responsibility: baseline
      - claim: (P . O) = 0 and h(P) = 2 for every polynomial section with deg x <= 2.
        responsibility: correctness
      - claim: for roots P, Q with <P,Q> = -1, -(P+Q) is a root and is enumerated.
        responsibility: feasibility
      - claim: n uniformly random E_8 roots admit a +-1 relation at the census's slot counts.
        responsibility: success_probability
      - claim: the reimplementation reproduces the TASK-20260725-005 fixture exactly.
        responsibility: interface
      - claim: the audit narrows a claim boundary and closes nothing.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: null
    prior_best: null
    time_exponent: null
    memory_exponent: null
    hidden_cofactor: null
    claim_kind: null
  heuristic_assumptions:
    - id: HEUR-XEDN-A1
      formal_statement: >-
        NONE LOAD-BEARING for S1-S3. Each is a consequence of a cited theorem
        applied to a family whose discriminant degree is computed exactly. No
        distributional or asymptotic assumption enters. This entry records that
        explicitly rather than leaving the field empty, and records that the only
        assumption is evidentiary: that the recalled theorem statements are the
        real ones.
      random_model_justification: >-
        Not applicable; there is no random model in S1-S3.
      supporting_results: >-
        Shioda 1990 (Mordell-Weil lattices) and the Kodaira fibre-type table.
        BOTH NOT READ -- RECALLED, UNVERIFIED. Only one entry of the Kodaira
        table is load-bearing and it is the trivial one, contr_v(I_1) = 0 because
        an I_1 fibre has a single component.
      validation_experiment_ids: [EXP-XEDN-affa94]
      falsification_condition: >-
        A source check shows any of the three recalled statements differs from
        the real one. S1-S3 are then withdrawn before any compute.
    - id: HEUR-XEDN-A2
      formal_statement: >-
        FOR THE NULL ARM ONLY. n roots drawn uniformly and independently from the
        240 roots of E_8 are a faithful null for "the n free-x sections of an
        all-I_1 surface in the frozen family", in the sense that the distribution
        of the shortest +-1-relation statistic agrees. Quantifiers: for each n
        occurring among the archived slot counts, over the uniform draw.
      random_model_justification: >-
        Under S2 the sections ARE roots, so the null has exactly the right
        support. The measure may still be wrong: sections arising from an actual
        surface need not be uniform among the 240, and the archived surfaces were
        found by a two-section Weierstrass solve, which certainly biases them.
      supporting_results: >-
        The E_8 root system has 240 roots with pairwise inner products in
        {0, +-1, +-2}; standard. NOT CITED TO A READ SOURCE HERE.
      validation_experiment_ids: [EXP-XEDN-affa94]
      falsification_condition: >-
        The empirical pairwise-inner-product histogram of the surface sections
        differs materially from the uniform-root histogram. The null is then
        mis-specified in a stated direction, and that mis-specification is itself
        reported as a finding -- it says what structure the surfaces carry beyond
        being roots -- rather than suppressed.
  structural_ingredients:
    - description: >-
        Shioda-Tate rank formula for a rational elliptic surface: rank E(k(t)) =
        8 - sum_v (m_v - 1), giving the hard ceiling 8 against which the archived
        span_rank values are compared.
      citation: >-
        T. Shioda, "On the Mordell-Weil lattices", Comment. Math. Univ. St.
        Pauli 39 (1990). NOT READ -- RECALLED, UNVERIFIED. Volume, year and the
        exact statement must be checked before this record is cited.
      role: rank bound converting an unbounded diagnostic into a checkable ceiling
    - description: >-
        Shioda height pairing with local contribution terms, h(P) = 2*chi +
        2*(P.O) - sum_v contr_v(P), giving the constant height 2 on all-I_1
        surfaces and the height split on surfaces with reducible fibres.
      citation: >-
        Same source. NOT READ -- RECALLED, UNVERIFIED.
      role: converts "shortest relation" into a root-system question
    - description: >-
        Kodaira classification of singular fibres; only contr_v(I_1) = 0 is used.
      citation: >-
        K. Kodaira, classification of elliptic surface fibres. NOT READ --
        RECALLED, UNVERIFIED.
      role: identifies the family as having no reducible fibres when Delta is squarefree
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: >-
        max_span_rank_over_delta_squarefree_archived_surfaces, from
        experiments/EXP-XEDN-004/runs/RUN-XEDN-004-MAIN/raw-result.json with
        Delta squarefreeness independently recomputed
      direction: higher
      minimum_effect: >-
        FORCED VALUE, derived pre-run: must be <= 8 if the pseudo-Gram is a
        height Gram. The archive is read as reporting up to 18. A recomputation
        finding all values <= 8 refutes this hypothesis and the audit stops.
    - metric: canonical_height_spectrum on all-I_1 surfaces
      direction: different
      minimum_effect: >-
        FORCED VALUE: exactly {2, 2, ..., 2}; predicted spread 0. One section
        with h != 2 falsifies S2 as stated.
    - metric: >-
        relation_lattice_corank vs n - 8 on surfaces with n > 8 slots
      direction: higher
      minimum_effect: >-
        FORCED VALUE: corank >= n - 8, i.e. >= 11 on the archived 19-slot
        surface, >= 7 on the 15-slot, >= 5 on the 13-slot, >= 3 on the 11-slot.
        The archive is read as reporting 1, 2, 3 and 0 respectively.
    - metric: >-
        null_arm_max_abs_coeff: max_|coeff| from the identical search run on n
        uniformly random E_8 roots, at each n occurring among archived slot
        counts, over >= 200 draws per n
      direction: different
      minimum_effect: >-
        Predicted 1 at every n >= 3 occurring in the census. CAN FAIL: it is not
        a theorem that n random roots admit a +-1 relation -- an A_1^8 subsystem
        of 8 mutually orthogonal roots admits none -- and n = 3 is the most
        common archived slot count, where failure is most likely. A null value
        above 1 at the census's slot counts falsifies S3's sufficiency and means
        the surfaces carry structure the null lacks.
    - metric: >-
        mu3_deletion_control: max_|coeff| on the isotrivial EXP-XEDN-003 family
        with every mu_3 orbit triple deleted from the section list before the
        search
      direction: different
      minimum_effect: >-
        Predicted still 1, on the same root-system grounds. A rise above 1
        falsifies the claimed equivalence of mu_3 orbit sums with generic root
        triangles and restores mu_3 as the load-bearing isotrivial mechanism.
    - metric: >-
        positive_control_height_split: canonical height spectrum on archived
        surfaces with NON-squarefree Delta
      direction: different
      minimum_effect: >-
        Must show at least two distinct height values, and rank ceiling <= 7. If
        the instrument returns h = 2 and rank 8 there, it cannot see fibre
        contributions, it is broken, and no negative may be reported from any arm.
  test_boundary:
    instances:
      - The 24 surfaces recorded as eligible in RUN-XEDN-004-MAIN, at p in {7,13,19,31}
      - Newly constructed surfaces in the same degree window with k = 0,1,2,3 forced reducible fibres
      - Synthetic root sets drawn from the 240 roots of E_8, n = 2..20
      - The isotrivial a = 0 EXP-XEDN-003 family, for the mu_3-deletion control only
    parameters:
      surface_family: "y^2 = x^3 + a(t)x + b(t), a != 0, deg a <= 2, deg b = 6, j non-constant"
      degree_window: "UNCHANGED from EXP-XEDN-004. Raising it is the declared scope of GOAL-XEDN-002 and GOAL-XEDN-003 and is out of scope here."
      height_definition: "canonical Shioda height, not deg x; the distinction is the subject of the hypothesis"
      rank_ceiling: 8
    implementation: experiments/EXP-XEDN-affa94
    budget:
      wall_clock_seconds: 7200
      maximum_memory_gb: 2
      maximum_runs: 4
  falsification_conditions:
    - >-
      A source check shows Shioda-Tate, the height formula, or contr_v(I_1) = 0
      is not as recalled. S1-S3 withdrawn before compute.
    - >-
      Recomputation finds every archived span_rank <= 8 on Delta-squarefree
      surfaces, i.e. the archive was misread.
    - >-
      The recomputed canonical height is not constant 2 on an all-I_1 surface.
      S2 is false.
    - >-
      The random-E_8-root null does not return max_|coeff| = 1 at the census's
      slot counts. S3 is insufficient and the surfaces carry real structure.
    - >-
      Deleting mu_3 orbits raises max_|coeff| above 1 on the isotrivial family.
      The claimed equivalence is wrong.
    - >-
      The positive control fails (no height split, no rank drop on a surface with
      a reducible fibre). Nothing negative may be reported at all.
    - >-
      The reimplementation fails to reproduce the TASK-20260725-005 fixture. That
      is an infrastructure signal under AGENTS.md rule 5, never mathematical
      evidence, and it blocks every arm.
  interpretation_limits:
    - >-
      Confirmation narrows the claim boundary of EV-XEDN-003 and DEC-20260725-001
      to "the generic relation lattice of all-I_1 surfaces in the frozen degree
      window at p in {7,13,19,31}". It does NOT withdraw the measurement, does
      NOT show the census was executed incorrectly, does NOT close candidate B2,
      does NOT touch number-field xedni, and does NOT bear on crypto-scale ECDLP
      (AGENTS.md rules 6 and 7).
    - >-
      Confirmation does NOT show GOAL-XEDN-001 should have been left open. Its
      declared completion criteria concerned producing a committed decision with
      a stated boundary and archived independent review, and that was done. An
      audit can change the boundary's width; the mechanism is a superseding
      record under a new id (AGENTS.md rule 4), created only by the Coordinator
      (rule 1).
    - >-
      Toy scale throughout. p <= 31. Nothing here supports, weakens or bears on
      any statement about a deployed curve.
    - >-
      The forward guidance carried by a confirming outcome is explicit and must
      be recorded with it: the coefficient-bound question becomes informative
      exactly where contr_v is nonzero, i.e. on surfaces with reducible fibres,
      which no XEDN experiment has made a treatment arm. That is a successor
      object, not a closure.
  status: proposed
  proposed_by: idea-generator
