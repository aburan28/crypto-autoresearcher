hypothesis:
  id: H-AFB-d42351
  question_id: RQ-RELN-001
  statement: >-
    Within the restricted interface consisting of a target-independent, single
    bounded-degree plane predicate F(x,y) on a nonsingular prime-field
    short-Weierstrass curve, with explicit membership and source recovery, the
    measured factor-base size is bounded by the recorded intersection degree and
    the fully charged bounded-arity descent does not beat its matched random
    subset on coverage or charged work. This is a scoped interface hypothesis,
    not the universal KN-OPEN-020 statement: a positive counterexample in this
    interface falsifies the scope, while a confirming census leaves high-degree,
    multiple-predicate, implicit, and target-dependent descriptions open.
  mechanism: >-
    A degree-d plane predicate intersects the projective cubic in at most 3d
    points, subject to the exact multiplicity and component checks recorded by
    the experiment. For an m-fold descent, the reachable target set is bounded
    by B^m, so the target-trial term is N/B^m before membership, source
    recovery, relation, storage, and linear-algebra charges. A size-matched
    random subset is the nearby object: it preserves B and therefore tests
    whether observed coverage is cardinality-only rather than a benefit of the
    algebraic description.
  assumptions:
    - Curves are nonsingular, ordinary short-Weierstrass curves over F_p with p > 3.
    - The predicate is nonzero, target-independent, and its degree and coefficient encoding are explicit.
    - Membership and source recovery enumerate or certify the actual subgroup points; a predicate hit is not treated as a relation witness by itself.
    - The toy exhaustive census is not evidence about cryptographic-size curves or about descriptions outside this interface.
  proof_search_map:
    bottleneck: >-
      The universal quantifier in KN-OPEN-020 is not experimentally enumerable.
      The bounded-degree/interface boundary must therefore be stated exactly,
      and every charged cost must be exposed before any negative is interpreted.
    baseline_embedding:
      parameter_slice: >-
        Reproduce the Bezout/intersection bound and the target-trial inequality
        symbolically before constructing any curve or factor base.
      reproduction_check: >-
        Exact integer arithmetic must recover B <= 3d and the N/B^m trial term
        from the declared definitions, with no fitted constant.
    observation_collision:
      observable: charged coverage and target-trial cost at fixed (N,B,m)
      distinct_preimage_search: >-
        Compare the algebraic predicate base with independently sampled random
        subsets of the same cardinality; equal coverage is a deliberate collision
        showing that coverage cannot identify usefulness.
    quantifier_order: >-
      The measured statement is FOR ALL TESTED predicates in the declared finite
      family and cells, not FOR ALL algebraic descriptions. The latter remains an
      open theorem question.
    method_ceiling:
      strongest_certifiable_claim: >-
        A bounded-degree, explicit-membership interface audit with complete toy
        cost accounting and a named counterexample path if any gate fails.
      nearby_object_control: >-
        A toy extension-field subfield base, where algebraic structure is known
        to supply a different factor-base interface, is included only as a
        positive control for the accounting instrument; it is not a prime-field
        result and cannot be used to prove the universal no-go.
  asymptotic_claim: null
  predictions:
    - metric: bezout_margin
      direction: lower
      minimum_effect: 0 at every explicit plane-predicate cell
    - metric: target_coverage_random_vs_algebraic
      direction: same
      minimum_effect: >- 
        Coverage distributions agree within the pre-registered finite-sample
        band at matched (N,B,m), or the discrepancy is recorded as a structural
        observation rather than hidden in a mean.
    - metric: charged_trial_lower_bound
      direction: lower
      minimum_effect: >- 
        Every target-trial count is at least the declared N/B^m term before
        source-recovery and verification costs are added.
  test_boundary:
    instances:
      - prime-field curves at p in [101, 103, 107, 211]
      - bounded-degree predicate family with d in [1, 2, 3, 5]
      - descent arities m in [2, 3]
      - toy extension-field control cells (q,n) in [[2,3], [3,2]]
    parameters:
      random_predicates_per_cell: 5
      random_subset_nulls_per_cell: 20
      target_sampling: exhaustive on toy groups
    implementation: >-
      New implementation under the experiment directory, using exact finite-field
      and group arithmetic. Existing factor-base and Semaev run artifacts are
      read-only comparators; no prior run is amended.
    budget:
      wall_clock_seconds: 7200
      memory_gb: 4
      maximum_runs: 24
  falsification_conditions:
    - Any valid explicit predicate violates the declared intersection bound after multiplicities and components are checked.
    - A bounded-degree predicate produces a verified charged target-descent path below the pre-registered N/B^m trial term.
    - The random-subset null or extension-field control fails its own coverage and enumeration controls; this invalidates interpretation rather than proving a no-go.
  interpretation_limits:
    - This hypothesis does not close KN-OPEN-020.
    - No claim is made about high-degree interpolation, multiple predicates, implicit membership, source solvers, or target-dependent descriptions.
    - Toy coverage and field-operation counts are not group-operation-equivalent costs and do not establish an ECDLP exponent.
  source_refs:
    - knowledge/open-problems/KN-OPEN-020.md
    - ledger/proposals/IDEA-20260801-021.yaml
  status: proposed
  proposed_by: coordinator
