# H-SEMBIN-ce9e29
# Stage-0 labelled fall certificate for IDEA-20261006-8f4f02.
# One summation polynomial. Not a Groebner run.
hypothesis:
  id: H-SEMBIN-ce9e29
  question_id: RQ-SEMBIN-9e8f82
  goal_id: GOAL-SEMBIN-fcb7a2
  source_idea: IDEA-20261006-8f4f02
  added: '2026-10-12'
  status: specified
  statement: >-
    On the single summation polynomial S_3 over F_2[z]/(z^3+z+1),
    with B = 1, the shift x1 -> x1+1 keeps the Boolean first-fall
    label at most 4, and either the unreduced first-fall label
    exceeds 4 or the degree-4 Macaulay syzygy label flips or moves
    by at least one degree. The unshifted polynomial is the matched
    side. No batch and no n = 24 system is this statement.
  test_boundary: >-
    Nine bit variables, degree cap 4, one unshifted polynomial and
    one shift by the field element 1. Column count must be
    C(13,4) = 715. Full disjoint-coset EQS4, odd characteristic,
    and any deployed curve are outside this boundary.
  mechanism: >-
    Definition 5 keeps squares. Definition 6 reduces Xi^2 to Xi
    before the degree is read. The Macaulay label is a syzygy to
    zero among formal multiples, which is not the same as a degree
    drop. The bound 4 is the idea's bound.
  distinguishable_outcomes:
    - >-
      The planted checks hold, the shifted Boolean label is at most
      4, and the unreduced label exceeds 4 or the Macaulay label
      disagrees with the unshifted side.
    - >-
      The planted checks hold, and that compound reading fails.
    - >-
      A planted check fails. That outcome invalidates the run.
  falsification: >-
    The planted checks hold and the compound reading does not.
  not_claimed: >-
    No Groebner basis, no polynomial-time claim, and no statement
    about a deployed curve.
