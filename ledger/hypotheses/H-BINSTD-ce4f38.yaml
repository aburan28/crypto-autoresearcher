# H-BINSTD-ce4f38 -- the relation-yield unit of a Frobenius row, stated in
# three named bases, plus the deployed ord_n(2) census and the k | r - 1 check.
# Specified by TASK-20260924-34ada8 (lane B of BATCH-7d29e8, GOAL-ECDLP2M-001)
# from IDEA-20260922-261004 Part 1 and the per-conjugate-family rank readout of
# its Part 2, absorbing IDEA-20260922-b19793 and IDEA-20260922-dacfc2 as
# sections, under DEC-20260924-99ce20 S2 and design_conditions C1-C5.
#
# ZERO RUNS. Every number below is hand arithmetic written out in
# EXP-BINSTD-178742 and in the audit sheet of this task, labelled a DESIGN
# FIGURE, never a result. No AUXIN census value, reviewer finding value,
# RUN-FROB-627924 value or EXP-FROB-30006a outcome is stated or was read.
# =============================================================================
hypothesis:
  id: H-BINSTD-ce4f38
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-261004
  absorbed_idea_ids:
    - IDEA-20260922-b19793
    - IDEA-20260922-dacfc2
  experiment_id: EXP-BINSTD-178742
  goal_id: GOAL-ECDLP2M-001
  batch_id: BATCH-7d29e8
  task_id: TASK-20260924-34ada8
  authorised_by: DEC-20260924-99ce20 (selected S2, design_conditions C1-C5)
  review_plan_id: REVIEW-BINSTD-20260924-7d29e8
  composing_decision: DEC-20260924-286589
  specified_at: '2026-09-24'
  title: >-
    The k Frobenius conjugates of one relation are k rows in a raw basis and one
    row in the orbit-quotient basis, with the exact raw rank given by an
    evaluation lemma; the deployed ord_n(2) census and the k | r - 1 verdicts
    say on which standardized rows that accounting is stated at all.

  statement: >-
    Let E be a binary curve defined over F_q and used over F_{q^k} with k an odd
    prime, G its subgroup of prime order r with r^2 not dividing the group order
    and G meeting E(F_q) only in O, and tau the q-power Frobenius. (A) tau acts on
    G as multiplication by a scalar lambda of multiplicative order exactly k, so k
    divides r - 1. At the standardized rows the design's hand arithmetic from the
    primary parameters finds r = 1 mod k at K-163, K-233, K-283, K-409, K-571
    (FIPS 186-4 Appendix D.1.3) and ECC2K-130 (Bailey et al. Appendix A); the five
    c2pnb rows are predicted TRUE by the same argument and are NOT COMPUTED here
    because ANSI X9.62 was unreachable to the producer. (D) ord_n(2) = 130, 162,
    29, 94, 204, 114 at n = 131, 163, 233, 283, 409, 571, with the stable-dimension
    sets frozen in EXP-BINSTD-178742 structural_certificate. (B) For every
    relation whose legs lie in a tau-stable factor base, write f_O(X) for the
    orbit polynomial of the relation on each Frobenius orbit O of columns. In the
    unknown-indexed raw basis the k conjugate rows have rank equal to the number
    of k-th roots of unity zeta in F_r at which some f_O is nonzero. That is
    exactly k whenever some orbit is hit by exactly one column, and exactly k - 1
    for the two-leg relations P and -tau^d(P). In the orbit-quotient basis the
    rank is exactly 1 for every relation with target not O. In the ker-g basis
    defined in EXP-BINSTD-178742 the rank is the number of those zeta that are
    also roots, mod r, of the 0/1 integer lift of the F_2-divisor g defining the
    base. Consequently one solve contributes exactly one row, in the unit the
    quotient linear algebra consumes, to a system of dimension |V|/k. The
    single-lambda-eigenblock collapse of IDEA-20260922-b19793 is that same
    dimension reduction, not a second one.

  statement_note: >-
    This refines IDEA-20260922-261004 (B), which stated raw rank EXACTLY k for
    every relation with all legs in size-k orbits. The derivation in this design
    (EXP-BINSTD-178742 derivation, lemma L3) shows that the disjoint-support
    argument also needs the legs to occupy distinct orbits. The two-leg relation
    with legs P and -tau^d(P) has both legs in one class orbit with opposite
    signs, orbit polynomial X^e (1 - X^d), which vanishes at zeta = 1, so its raw
    class-basis rank is k - 1 while its quotient rank is still 1. The proposal is
    not edited; the refinement is recorded here and in the audit sheet as design
    correction DC-B1, and the experiment tests it with constructed targets.

  mechanism: >-
    The conjugate family of a relation is the orbit of one row vector under the
    cyclic shift that tau induces on the columns. Each Frobenius orbit of columns
    is a copy of F_r[X]/(X^k - 1), with the column at shift e identified with X^e
    and conjugation acting as multiplication by X. Because k divides r - 1, X^k -
    1 splits over F_r into k distinct linear factors (X - zeta). The Chinese
    remainder theorem turns each orbit block into k evaluation coordinates, and
    the j-th conjugate row becomes the vector (zeta^j f_O(zeta)). The k rows
    therefore span one coordinate per root zeta at which some f_O is nonzero
    (Vandermonde in the distinct zeta). The three bases are three annihilators h
    dividing X^k - 1, and the rank in each is the count of roots of h at which
    some f_O is nonzero. The raw basis is h = X^k - 1. The orbit quotient is h = X
    - lambda: its coordinate on orbit O is f_O(lambda), the same for all k
    conjugates. The ker-g basis is h = gcd(g-hat mod r, X^k - 1). The true
    discrete-log vector satisfies x at shift e = lambda^e y_O. It pairs with a row
    only through f_O(lambda), so the reduction raw to quotient loses nothing
    about the logarithms. What it discards is which conjugate was found first,
    and that is information about the search. Representation R1; the stage
    whose accounting it fixes is RELATION ACCOUNTING and LINEAR-ALGEBRA DIMENSION.
    Declared off-limits components F2 (factor-base decomposition) and F6
    (endomorphism orbit); no new tracked object is proposed.

  assumptions:
    - >-
      k (equal to n on a Koblitz row) is an odd prime, so -1 is not a k-th root of
      unity mod r and lambda^e = -1 has no solution.
    - >-
      G is cyclic of prime order r, r^2 does not divide the group order, and r
      does not divide #E(F_q). Then G meets E(F_q) only in O and lambda is not 1.
      At toy cells this is an admission rule; at deployed rows it is read from
      the primary parameters (r prime, cofactor small).
    - >-
      Unknowns are discrete logarithms of G-parts. A factor-base point P
      contributes through pi_G(P) = [h (h^{-1} mod r)] P; points with pi_G(P) = O
      are not factor-base elements. Columns of the raw class basis are the G-parts
      up to sign.
    - >-
      The factor base is tau-stable as a set: W = ker g(tau) for a monic divisor g
      of X^n - 1 over F_2 (the correspondence relayed by IDEA-20260915-8fe0ef and
      IDEA-20260918-9abf42, re-derived in EXP-BINSTD-178742 lemma L9).
    - >-
      The ker-g lift is the 0/1 integer lift of the F_2 polynomial g itself (not a
      product of lifts). This is a declared choice of this contract. No claim is
      made that it is the basis of eprint 2020/1315, which was not read.

  proof_search_map:
    bottleneck: >-
      The relation-yield unit of every Koblitz and subfield row. Relations are
      counted k per solve in a raw basis while linear-algebra dimension is counted
      as |V|/k in the quotient basis, and nobody reports both on the same
      relations. Until the unit is fixed, every Frobenius row's index-calculus
      relation column is ambiguous by log2 k bits (7.86 on K-233, 3.46 on
      c2pnb176v1, per IDEA-20260922-261004 sota_delta), and IDEA-20260922-1a081a
      C3 and IDEA-20260922-c48e7d Saving-B wait on it.
    baseline_embedding:
      parameter_slice: >-
        The n = 17 cell of KN-OPEN-095df5 on the a = 1 Koblitz curve (the curve
        IDEA-20260915-8fe0ef calls the Trimoska curve): r = 65587, lambda = 17184,
        Phi_17 = f1 f2 over F_2 with two degree-8 factors. It is the only cell
        where the corpus records the quantities a rank readout depends on. The
        null-object slice k = 1 (ordinary curve, b not in F_2) is the second
        embedding: there the three bases coincide.
      reproduction_check: >-
        Frozen regression fixture G1 in EXP-BINSTD-178742, run before any new
        cell. Checks: #E = 131174 = 2 x 65587; 65587 prime; lambda^17 = 1 mod r,
        lambda not 1, and [lambda]P = tau(P) on a generator; hence 17 | 65586
        (hand check here, 17 x 3858 = 65586); Phi_17(lambda) = 0 mod r; and both
        degree-8 factors of Phi_17 over F_2, lifted to 0/1 integer polynomials,
        nonzero mod r at lambda. Hand check here: f1 = x^8+x^5+x^4+x^3+1 and f2 =
        x^8+x^7+x^6+x^4+x^2+x+1 (the bit patterns IDEA-20260915-8fe0ef records)
        multiply over F_2 to 1 + x + ... + x^16 (written out in the audit sheet).
        On any fixture failure the instrument is wrong and nothing downstream is
        read.
    observation_collision:
      observable: >-
        The rank over F_r of the k-row conjugate family of one relation, read in
        four places on the identical relation: raw class basis, raw point basis,
        orbit-quotient basis and ker-g basis. Each is reported with the
        orbit-length histogram of the base and of the relation's legs and with the
        relation's per-orbit multiplicity profile.
      distinct_preimage_search: >-
        Four collisions were searched for and named. (1) A raw rank below k from
        short orbits versus from a genuine submodule. Separated by construction,
        since legs with pi_G(P) = O are not factor-base elements and every class
        orbit has length exactly k (lemma L2). The histogram then acts as a
        tripwire: a short orbit invalidates the run before any rank is read. (2)
        FOUND IN DESIGN. A raw class-basis rank of k - 1 arises from a genuine
        same-orbit cancellation (legs P and -tau^d(P)) and could also arise from
        an instrument error. Separated by the evaluation lemma, which predicts
        the exact rank per relation from the multiplicity profile, and tested
        with constructed targets RS-4. The same relation has point-basis rank k,
        so the raw rank itself depends on whether negation is identified. (3) A
        quotient rank of 1 from genuine absorption versus from an instrument
        that never applies tau and copies row 0 k times. Separated because the raw
        readout of the same family must show the lemma value, the null object
        must show k = 1, and the non-stable control must refuse every family. (4)
        A ker-g rank equal to n' from the lemma-as-relayed versus from a
        coincidental count of common roots. Separated by reporting deg h_g and
        g-hat(lambda) mod r per divisor.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The relation row in the orbit-quotient basis, dimension |V|/k, with the
          shift absorbed as lambda^e.
        predicted_gain: >-
          Linear-algebra dimension and relation storage divided by k, at the
          charged orbit-canonicalisation cost. The yield is restated as one row
          per solve in the unit that system consumes. Relative to accounting that
          takes both the k-per-solve count and the /k dimension as independent,
          that is a factor-k correction against the attacker.
      - transform: observable_fiber
        proposed_object: >-
          The conjugate family as one object, holding the quotient row fixed and
          varying which conjugate was found first and whether negation is
          identified.
        predicted_gain: >-
          None in cost. It puts on record that the k-to-1 collapse discards
          search-side information only, and that raw rank is basis-dependent even
          before the quotient.
    quantifier_order: >-
      FOR EVERY admitted toy cell (n in {17, 23, 31, 41}, a in {0, 1}, r the
      admitted prime, lambda determined by the curve and r alone), FOR EVERY
      tau-stable W used, FOR EVERY target R in G minus O, and FOR EVERY
      decomposition of R with legs in the factor base: quotient rank = 1; raw
      class rank = #{zeta in mu_k(F_r) : some f_O(zeta) != 0}; raw point rank =
      the same count on point orbits; ker-g rank = #{zeta : h_g(zeta) = 0 and
      some f_O(zeta) != 0}. lambda depends on the curve and r, never on the
      relation. The choice of orbit representatives and of class-representative
      signs changes f_O by a unit multiple X^s or -1 and changes no rank. The
      statement is universal and its proof is the derivation. The sampled
      relations are a consistency check, and one verified counterexample refutes
      it.
    method_ceiling:
      strongest_certifiable_claim: >-
        On the tested toy Koblitz cells (n in {17, 23, 31, 41}, two curves each),
        every relation read satisfies the three rank identities, and so do the
        constructed same-orbit relations. The six ord_n(2) values and the
        stable-dimension sets are exact. k | r - 1 holds at every standardized
        row whose r was read from a primary source. Certifies nothing about
        assembled-matrix rank growth (H-261004-1, excluded), pipeline cost
        (Part 3, excluded), the text of eprint 2020/1315 (unread), factor bases
        that are not tau-stable, or the cost or security of any deployed curve.
      nearby_object_control: >-
        Four, all blocking. (i) Null object: an ordinary curve over the same
        F_{2^n} with b not in F_2, where k = 1 and the bases coincide. (ii)
        Proves-too-much: a size-matched non-stable F_2-subspace base on the same
        Koblitz curve, whose stable core has dimension at most 1, so every
        conjugate family leaves the base. (iii) Forced-negative degrees n in {19,
        29, 37}, where no usable stable subspace exists. (iv) An admission
        self-test on a subfield curve whose chosen prime-order subgroup lies in
        E(F_q), so lambda = 1 and the cell must be rejected before any rank is
        read.
    proof_obligations:
      - claim: lambda^k = 1 and lambda != 1 in F_r, hence ord(lambda) = k and k | r - 1 (lemma L1).
        responsibility: correctness
      - claim: Every Frobenius orbit of G-classes up to sign has length exactly k (lemma L2).
        responsibility: correctness
      - claim: >-
          Evaluation lemma L3. For h dividing X^k - 1 over F_r, the k conjugate
          rows reduced mod h span a space of dimension #{zeta : h(zeta) = 0, some
          f_O(zeta) != 0}.
        responsibility: correctness
      - claim: The quotient coordinate is f_O(lambda), identical for all k conjugates, and nonzero for some O whenever the target is not O (lemma L4).
        responsibility: correctness
      - claim: >-
          Interface L5. The raw-to-quotient map is reduction mod (X - lambda) and
          loses no information about the discrete logarithms.
        responsibility: interface
      - claim: >-
          Interface L5b. The point-to-class map pi_G up to sign may merge
          columns. Class rank is at most point rank, and the difference is
          reported, not hidden.
        responsibility: interface
      - claim: The single-lambda-eigenblock of IDEA-20260922-b19793 is the orbit-quotient system (lemma L8); no second reduction exists.
        responsibility: strictness
      - claim: ord_n(2) = 130, 162, 29, 94, 204, 114 and the stable-dimension sets {j d, j d + 1} (lemma L9).
        responsibility: correctness
      - claim: >-
          Every rank is reported with the orbit-length histogram and the
          multiplicity profile, and every relation carries an on-curve
          certificate.
        responsibility: strictness
      - claim: Nothing here is a statement about the text of eprint 2020/1315, pipeline cost, or any deployed curve's security.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    No complexity claim. The content is an accounting unit (a factor k in one
    column) and exact finite arithmetic. No exponent moves in either direction.

  heuristic_assumptions: []
  heuristic_note: >-
    None. Claims (A), (B) and (D) are unconditional finite arithmetic and linear
    algebra over F_r (IDEA-20260922-261004 H-261004-0). The one heuristic of the
    proposal, H-261004-1 (generic position across different relation families,
    governing assembled-matrix rank growth), is EXCLUDED from this hypothesis
    under DEC-20260924-99ce20 S2 and is not tested. H-261004-2 was a baseline
    convention, not a heuristic. It is replaced by the convention in
    EXP-BINSTD-178742 rho_convention per CORR-20260922-0d365e. No conditional
    result is dispatched, so no validation pairing is owed.

  structural_ingredients:
    - description: >-
        Chinese remainder theorem for F_r[X]/(X^k - 1) when X^k - 1 splits into
        distinct linear factors, and Vandermonde independence of distinct
        evaluation points.
      citation: EXP-BINSTD-178742 derivation (lemma L3), written out in this design
      provenance: internal
      verified_by: TASK-20260924-34ada8 (derived in this session; to be checked by review joint J1)
      role: exact rank of a cyclic family of rows
    - description: >-
        tau-stable F_2-subspaces of F_{2^n} are ker g(tau) for monic g dividing X^n
        - 1, of dimension deg g, by the normal basis theorem.
      citation: IDEA-20260918-9abf42 and IDEA-20260915-8fe0ef, as relayed by IDEA-20260922-261004 (D) and IDEA-20260922-b19793 (A)
      provenance: internal
      verified_by: >-
        Not verified by TASK-20260924-34ada8. The two source proposals were not
        read in full this session, only the relays. The normal basis theorem
        itself is recalled standard algebra. The executor re-derives every
        dimension set by factoring X^n - 1 over F_2.
      role: stable-dimension sets and factor-base construction
    - description: >-
        Frobenius on a Koblitz curve over F_2 satisfies pi^2 - t pi + 2 = 0, so its
        eigenvalue on G is a root of X^2 - t X + 2 mod r.
      citation: recalled standard fact; used only to generate lambda candidates, each confirmed by [lambda]P = tau(P)
      provenance: recalled
      verified_by: null
      role: computing lambda at toy cells

  reduction_chain: null

  predictions:
    - metric: ord_n_of_2_at_deployed_n
      direction: flat
      minimum_effect: >-
        EXACT. 130, 162, 29, 94, 204, 114 at n = 131, 163, 233, 283, 409, 571
        (design figures, hand derivations in EXP-BINSTD-178742
        structural_certificate). The 131 row must also agree with KN-OPEN-095df5.
    - metric: stable_dimension_set_at_deployed_n
      direction: flat
      minimum_effect: >-
        EXACT. {j d, j d + 1 : 0 <= j <= f} with d = ord_n(2) and f = (n - 1)/d,
        which is f = 1, 1, 8, 3, 2, 5. That gives 2^(1+f) = 4, 4, 512, 16, 8, 64
        stable subspaces.
    - metric: k_divides_r_minus_1_verdict_per_standardized_row
      direction: flat
      minimum_effect: >-
        TRUE at K-163, K-233, K-283, K-409, K-571 and ECC2K-130, with r mod k = 1
        by hand at each (design figures). TRUE predicted at the five c2pnb rows,
        NOT COMPUTED here. A single FALSE is tripwire TB-3.
    - metric: rank_orbit_quotient_basis_per_relation
      direction: flat
      minimum_effect: EXACTLY 1 on every admitted relation. One verified relation with quotient rank other than 1 refutes lemma L4.
    - metric: rank_raw_class_basis_per_relation
      direction: flat
      minimum_effect: >-
        EXACTLY the lemma-L3 value #{zeta in mu_k : some f_O(zeta) != 0}. That is
        k when some orbit is hit by exactly one column, k - 1 on every
        constructed relation with legs P and -tau^d(P), and k on every
        constructed relation with legs P and tau^d(P).
    - metric: rank_raw_point_basis_per_relation
      direction: flat
      minimum_effect: EXACTLY the lemma-L3 value on point orbits; k on every m = 2 relation.
    - metric: rank_ker_g_basis_per_relation_per_divisor_g
      direction: different
      minimum_effect: >-
        EXACTLY the lemma-L3 value with h = h_g. No value of deg h_g is
        predicted. The column is reported per g with deg h_g and g-hat(lambda)
        mod r, without a preferred outcome among 0, 1, n' or anything else.
    - metric: orbit_length_histograms
      direction: flat
      minimum_effect: Every class orbit of every base has length k, and every leg's point orbit length n; any other length is an instrument defect.
    - metric: quotient_rows_per_solve_and_quotient_dimension
      direction: flat
      minimum_effect: >-
        One quotient row per relation, which is P4. The quotient dimension equals
        |V|/k exactly at every sub-cell, as the derived dacfc2 column.
    - metric: null_object_readout
      direction: flat
      minimum_effect: k = 1 computed, and raw rank = quotient rank = 1 on every relation. No conjugate row is formed.
    - metric: non_stable_subspace_readout
      direction: flat
      minimum_effect: Every conjugate family leaves the base, and zero families are admitted as relations over it.
    - metric: forced_negative_arm_readout
      direction: flat
      minimum_effect: No usable (2 <= l <= n - 2) stable subspace at n in {19, 29, 37}, so nothing is measured.

  test_boundary:
    instances:
      - >-
        Toy Koblitz curves y^2 + xy = x^3 + a x^2 + 1 over F_{2^n}, a in {0, 1}, n
        in {17, 23, 31, 41}, each admitted per EXP-BINSTD-178742 cell-admission
        rule E1.
      - Null-object curves y^2 + xy = x^3 + x^2 + b over the same fields, b not in F_2, one per n.
      - Forced-negative degrees n in {19, 29, 37} (subspace enumeration only).
      - One subfield curve over F_8 used over F_{2^15} for the admission self-test.
      - >-
        Deployed rows, arithmetic only: K-163, K-233, K-283, K-409, K-571
        (FIPS 186-4), ECC2K-130 (Bailey et al. Appendix A; the Certicom
        publication where reachable), and five c2pnb rows (ANSI X9.62, if
        reachable).
    parameters:
      stable_subspaces: dims {j d, j d + 1} with the smallest j such that 2 j d >= n - 1, four subspaces per n in the canonical order of the contract
      arities: m = 2 at all cells; m = 3 exhaustive at n = 17 and planted at all n
      rank_field: F_r, r the admitted prime of the cell
    implementation: >-
      Executor's choice of language and libraries, named with versions in the
      manifest. Two independent Gaussian-elimination routines over F_r, plus the
      evaluation route of lemma L3. Exact integer arithmetic for all deployed-row
      checks.
    budget:
      enforcement: advisory
      maximum_runs: 4
      maximum_memory_gb: 4
      note: See EXP-BINSTD-178742 budget. Two scientific runs plus at most two infrastructure reruns.

  falsification_conditions:
    - >-
      A verified admitted relation whose conjugate family has quotient rank other
      than 1. Refutes lemma L4 and puts the factor-k linear-algebra reduction in
      question. The most damaging outcome.
    - >-
      A verified admitted relation whose raw class, raw point or ker-g rank
      differs from the lemma-L3 value, confirmed by the second elimination
      routine. Refutes lemma L3 in that basis.
    - >-
      Any standardized row, with r and k read from a primary source, at which k
      does not divide r - 1. Refutes (A) for that row or shows the parameter
      source wrong. Tripwire TB-3.
    - >-
      An independent computation disagreeing with any of the six ord_n(2) values
      or stable-dimension sets. Then the hand derivation in this design is wrong
      for that value.
  falsification_note: >-
    An instrument failure (a failed planted-rank control, fixture, null,
    non-stable or forced-negative control, or a short orbit) invalidates the run
    and is never evidence against this hypothesis. Nor is a timeout, crash or
    unreachable source (AGENTS.md core rule 5).

  interpretation_limits:
    - Specified, not approved. No run exists. Approval is solely the act of DEC-20260924-286589.
    - >-
      Toy range n <= 41 for the rank readout. Lemmas L1-L4 are general; the
      measured agreement is scoped to the tested cells, two curves per n, and
      the sampled relations. Deployed rows enter only as exact arithmetic (Part
      1) and carry no extrapolation.
    - >-
      The per-orbit unit is stated for ONE conjugate family. How the assembled
      quotient system's rank grows with the number of solves (H-261004-1) is
      excluded and owned by the RELN questions. Pipeline cost (Part 3) is
      excluded and owned by FROB and RELN.
    - >-
      At n = 131 and n = 163 the stable-SUBSPACE sets are {0, 1, n - 1, n}. This
      is a statement about F_2-subspaces only. Frobenius-stable SETS (orbit
      unions) exist at every n, and nothing about any line or row is closed.
    - >-
      Nothing is stated about the text of eprint 2020/1315 (unread, impediment).
      Claim (C) of IDEA-20260922-261004 stays scoped to KN-OPEN-095df5's relay.
      The ker-g basis is this contract's operationalisation, not an attribution.
    - >-
      This hypothesis lowers a claimed gain. It asserts nothing about the cost
      or the security of any standardized curve and moves no exponent.

