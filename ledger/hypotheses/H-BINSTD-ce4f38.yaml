    mechanism_addition: >-
      V2 (D2, D3). Carried v1 mechanism, plus: the orbit-quotient row of a
      relation is the true equation sum_O f_O(lambda) y_O = log pi_G(R) only
      when every leg is correctly labelled and every conjugate row is tau^j of
      row 0; version 2 certifies both per relation (CERT-LABEL, CERT-QUOT,
      CERT-BIND), because every rank of L3 is invariant under X -> X^{-1} on
      mu_k and so cannot certify a labelling.
    assumptions_last_item: >-
      V2 (O-5, O-7). The ker-g lift is the 0/1 integer lift of the F_2
      polynomial g itself (not a product of lifts), a declared choice of this
      contract. It is the characteristic-2 reading of eprint 2020/1315 equation
      (4); read over Z that equation uses X^{n'} - sum_{j<n'} c_j X^j, and the
      source fixes no integer lift (as read by TASK-20260924-eaf78a, provenance
      retrieved by that agent; cited from its archived report, not re-read at
      source by this producer). No claim is made that it is the basis of the
      lemma.
    proof_search_map_bottleneck: >-
      V2 (D7). The relation-yield column of every Frobenius row must name its
      basis (raw class, raw point, orbit quotient or ker-g); this contract fixes
      the per-conjugate-family rank in each. No bit movement of any row's
      column is stated, and no c2pnb figure is used (the v1 figures resting on
      an unverified c2pnb k are dropped). IDEA-20260922-1a081a C3 and
      IDEA-20260922-c48e7d Saving-B still wait on the contract as a dependency
      (CORR-20260925-649e25 item 2).
    ggmp_basis_dependence: >-
      V2 (O-6; RL-O6). L3 and eprint 2020/1315 Lemma 3.3 are statements in
      different bases. L3 gives rank k - deg gcd(X^k - 1, all f_O) in the raw
      class and raw point bases (k on a relation with an orbit hit by exactly
      one column), at most 1 in the orbit quotient (L4), and at most deg h_g in
      the ker-g basis. Lemma 3.3, as TASK-20260924-eaf78a read it, bounds by n'
      the linearly independent relations the Frobenius action provides for a
      factor base of dimension n' defined by l(X) | X^n - 1 in F_q[X]. The bound
      holds trivially in the orbit quotient and in any quotient where l(lambda)
      = 0 mod r; L3 does not imply it in the raw bases when n' < k. The basis and
      coefficient ring in which the lemma counts linear independence are not
      fixed by this record. That report's O-6 reading, that the bound is
      inconsistent with L3 in the raw factor-base basis, is recorded as its
      pointer (RL-O6: not a tripwire). THIS BLOCK DOES NOT STATE THAT GGMP LEMMA
      3.3 FAILS AS STATED; any record that proposes it runs at
      review-breakthrough at max (AGENTS.md rule 12).
