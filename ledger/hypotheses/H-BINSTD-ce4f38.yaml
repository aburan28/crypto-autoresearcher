        - metric: per_divisor_g_hat_at_mu_k
          direction: different
          minimum_effect: V2 (D5). The vector g-hat(lambda^i) mod r, i in [0, k - 1], reported per divisor and cell; its zero count equals deg h_g.
        - metric: certificates_per_relation
