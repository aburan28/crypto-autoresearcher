hypothesis:
  id: H-ECDLP-42f434
  question_id: RQ-ECDLP-bc7a54
  source_idea: IDEA-20261003-0c5564
  derived_from_idea: IDEA-20261003-0c5564
  experiment_id: EXP-ECDLP-9090ce
  goal_id: null
  goal_ids: []
  goal_ids_note: >-
    RQ-ECDLP-bc7a54 copies GOAL-ECDLP-001 from its record. This design does not edit any
    goal head (including GOAL-ECDLP2M-001.yaml, which is out of write-scope).
    Attachment to a goal is a later record if a Coordinator so decides.
  specified_at: '2026-10-04'
  approved_at: '2026-10-04'
  authorised_by: DEC-20261004-b76b5a
  proposed_by: coordinator
  status: approved
  title: >-
    On a planted generic-group null, the graded partial-omega exchange law
    (G1/G2/G3) matches measured tau-hat within 0.07 at the executed cells
    (O-LAW-HOLDS), or else a shape-dependent hitting defect (O-SHAPE-EFFECT)
    or instrument artifact is localised

  statement: >-
    SETTING (Stages 0-1 of IDEA-20261003-0c5564). A hint family is a triple
    (D, chi, omega). Lemma V: a TOTAL coordinate omega is its own chi by one
    scalar multiplication. A PARTIAL omega returns a window J(Q) of width
    E = n^{1-beta} containing log_g Q on D of density n^{alpha-1}. With costs
    written as n^{exponent} (polylog suppressed, gamma = kappa = o(1) on the
    planted null):
      tau_chi  = max(1 - alpha + kappa, gamma, (1 - beta)/2)           (G1)
      tau_claw = 1 - (alpha + beta - gamma)/2  if beta <= alpha - gamma
                 else 1 - alpha + gamma                               (G2)
      tau_kang = 1 - alpha + max(gamma, (1 - beta)/2)                 (G3)
    Phase diagram (gamma = kappa = o(1)): chi-less candidates beat rho on
    {alpha > 1/2, alpha + beta > 1}; a free native chi enlarges that to
    {alpha > 1/2, beta > 0}. Recognition is worth exactly the strip
    {alpha > 1/2, 0 < beta <= 1 - alpha}. The law is achievability only, not
    a lower bound (alpha = 1 bit-security amplification is the named ceiling).
    Idea Stage 2 (curve D_x hit-rate / j=0 factor-3) is OUT OF SCOPE for this
    Stages 0-1 authorization (successor DEC, same deferral as EXP-ECDLP-9e8926
    Stages 2-3).

    CLAIMS UNDER TEST at the approved cells:
    (S0) Zero-run worksheet: Lemma V, G1-G3 closed forms including both G2
    branches and the G1 multi-hit check, phase diagram, pricing table with a
    source per row, alpha=1 ceiling, H1-H3 statements, executed-taper
    disclosure.
    (P1) Planted pipeline on NULL-1 (keyed relabelled Z/n): M1 tau-hat on the
    executed (alpha, beta) cells for arms G1/G2/G3; M2 first-hit ratios for
    D in {random, interval-of-logs, low-weight logs}; M3 Lemma V false
    certificates (forced 0); M4 beta=0 kangaroo/rho constants; M5 biased-
    offset nearby-object control.
    (HOLD) O-LAW-HOLDS: |tau-hat - tau_law| <= 0.07 at every executed M1 cell
    of every arm; M2 ratios in [0.8, 1.25] at the largest executed n for all
    three shapes; M3/M4/M5 pass.
    (SHAPE) O-SHAPE-EFFECT: M2 leaves [0.8, 1.25] for any log-structured
    shape at the largest executed n (H1 falsified on that shape).
    (ART) O-ARTIFACT: any Lemma V false certificate, kangaroo/rho constant
    outside 10 percent, or biased-offset gain outside [2.5, 6].

  mechanism: >-
    OBJECT FRAME from IDEA-20261003-0c5564. Tracked object: the window J(Q)
    a partial omega attaches to a walk point, propagated by the known walk
    offset a. Representation: generic labels on NULL-1. Operation set:
    translation by walk step multipliers (windows shift by known a) and claw
    lookup of window-relative points against a tame table. Class: partial
    action along the walk trajectory only (not a sum-compatible bucket,
    KN-FIND-ffe1df Theorem C). Priced open numbers: tau-hat per cell and the
    hit-rate ratio versus |D|/n. Stage 0 is zero-instance arithmetic. Stage 1
    plants oracles on Z/n and reads the law.

  assumptions:
    - n prime; r-adding walk with r >= 16 and uniformly random step multipliers.
    - Planted omega places log_g Q uniformly in J(Q) (H3 by construction);
      s = 0.9 on D; off-D windows are independent garbage.
    - gamma = kappa = 0 on the planted null (oracle cost 1).
    - Off-limits F1 used as plumbing only (walk, kangaroo, claw table).
    - No factor base; KN-OPEN-020 is not engaged.
    - Python is the engine; timeouts/crashes are O-IMPEDIMENT, never negatives.
    - Idea Stage 2 (real-curve D_x / j=0) is out of this authorization.

  proof_search_map:
    bottleneck: >-
      The hit process: every exponent assumes the walk hits D at rate |D|/n
      independently of D's shape. Log-structured D can deviate exactly on the
      note's invertible column.
    baseline_embedding:
      parameter_slice: >-
        beta = 0: G1 and G3 reduce to full-range kangaroo, tau = 1/2;
        beta = 1, gamma = o(1), alpha = 1 (anomalous corner): tau = o(1);
        beta = 1 total omega: G2's Lemma-V branch equals verification walk,
        tau = 1 - alpha + gamma.
      reproduction_check: >-
        Symbolic: three slices evaluated from closed forms at Stage 0.
        Executable: beta=0 planted pipeline reproduces kangaroo 2 sqrt(n)
        and rho 0.886 sqrt(n) each within 10 percent; beta=1 Lemma V arm
        shows zero false certificates.
    observation_collision:
      observable: measured exponent tau-hat per cell and hit rate per walk step
      distinct_preimage_search: >-
        Equal 4-vectors are priced identically. A non-uniform window offset
        leaks the exponent through early claws. Uniform-offset construction
        plus a biased-offset arm (law MUST be beaten by about 4x) separate them.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Per-candidate charges: walk n^{1-alpha} per hit, omega n^gamma,
          finish sqrt(E) or claw table T; added only across disjoint stages.
        predicted_gain: Closed forms of G1-G3 and the phase diagram.
      - transform: observable_fiber
        proposed_object: >-
          Hold (alpha, beta) fixed; vary native chi versus absent. The
          invariant that separates the two costs is the strip 0 < beta <= 1 - alpha.
        predicted_gain: Locates the price of recognition as a region.
    quantifier_order: >-
      FOR EACH candidate 4-vector (alpha, beta, gamma, kappa) and constant s,
      THERE EXISTS an algorithm (G1, G2 or G3) with expected cost n^{tau+o(1)}
      under H1-H3 -- achievability. NOT a forall-algorithms lower bound.
    method_ceiling:
      strongest_certifiable_claim: >-
        Under H1-H3 the stated costs are achievable; on the planted generic
        null at the executed n the measured exponents match the law within
        0.07 at the executed cells; M2 hit rates sit in the geometric band
        or else H1 is falsified on that shape. Cannot certify that any
        natural omega with beta > 0 exists, nor any lower bound.
      nearby_object_control: >-
        Biased-offset oracle (log always in the first E/16 of J(Q)): G2 MUST
        beat uniform-offset G2 by about a factor 4 (sqrt of 16). A pipeline
        that does not see this cannot certify the law's accounting.
    proof_obligations:
      - claim: Lemma V exact (chi_V has no false positives or negatives).
        responsibility: correctness
      - claim: G1, G2 (both branches), G3 closed forms and G1 multi-hit check.
        responsibility: runtime
      - claim: G2 memory n^{tau_claw}; G3 polylog; G2-G3 interpolation open.
        responsibility: memory
      - claim: Phase diagram regions and the strip.
        responsibility: size
      - claim: Pricing table rows (hand arithmetic) with a source per row.
        responsibility: interface
      - claim: Law is achievability only; alpha=1 amplification ceiling.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        For an r-adding walk with r >= 16 on a prime-order group, and for D in
        each of {random set, interval of logs, low-weight log set} of density
        delta with n^{-1/2} < delta < 1/2, the number of steps to the first
        hit of D is geometric with mean (1+o(1))/delta, independently of class.
      random_model_justification: >-
        Rigorous: additive walks mix to within a sqrt(log n) factor of a random
        mapping for collisions (KR-RHO-93979e). Classical (recalled pointer,
        not support): hitting time of a set of mass delta is approximately
        exponential with mean 1/delta when delta times mixing time is small.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-9090ce
      falsification_condition: >-
        M2 hit-rate ratio outside [0.8, 1.25] for any planted D shape at the
        largest executed n.
    - id: H2
      formal_statement: >-
        An interval DLP of width E is solved by parallel kangaroo in
        (2+o(1)) sqrt(E) group operations on average; a cutoff of 4 sqrt(E)
        fails with probability below 0.05.
      random_model_justification: >-
        Montenegro-Tetali mean (proved per KR-RHO-898783); cutoff tail is the
        standard exponential-tail behaviour of kangaroo collision time.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-9090ce
      falsification_condition: >-
        Mean kangaroo cost at beta=0 outside 10 percent of 2 sqrt(n), or
        cutoff failure rate inconsistent with the 0.05 bound in a way that
        voids M4.
    - id: H3
      formal_statement: >-
        For the omegas priced by the law, log_g Q is uniform within J(Q)
        conditional on the walk's history.
      random_model_justification: >-
        True by construction for the planted oracle. For a natural omega it
        is modelling; a biased placement only helps the attacker (M5), so
        the law remains an achievability statement.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-9090ce
      falsification_condition: >-
        On the planted uniform oracle, chi-squared of log position in J(Q)
        across 16 bins rejects uniformity at the frozen 0.001 level AND the
        instrument still claims O-LAW-HOLDS (that combination is O-ARTIFACT).

  structural_ingredients:
