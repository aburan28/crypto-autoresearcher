    - 'F2. Hit-rate ratio outside [0.8, 1.25] for any planted D shape at the largest executed n: H1 falsified on that shape (O-SHAPE-EFFECT).'
    - 'F3. Any false certificate in the Lemma V arm: implementation bug; O-ARTIFACT.'
    - 'F4. Kangaroo or rho constant not reproduced at beta=0, or biased-offset gain not in [2.5, 6]: instrument void (O-ARTIFACT).'
    - 'F5. Timeouts or crashes: O-IMPEDIMENT (AGENTS.md rule 3), never evidence.'

  interpretation_limits:
