  reduction_chain:
    core_problem: achievability exponents for a partial omega of density n^{alpha-1} supplying beta bits of the log, with and without a native chi
    corollaries: []

  predictions:
    - metric: Stage-0 Lemma V / G1-G3 / phase-diagram self-checks
      direction: same
      minimum_effect: All Stage-0 self-checks pass before any planted trial.
    - metric: M1 tau-hat versus tau_law on executed (alpha, beta) cells
      direction: different
      minimum_effect: '|tau-hat - tau_law| <= 0.07 at every executed cell/arm, else law falsified at executed scale if CI excludes the law at three or more cells of one arm.'
    - metric: M2 hit-rate ratio by D shape
      direction: different
      minimum_effect: Within [0.8, 1.25] at the largest executed n for random, interval, and low-weight D.
    - metric: M3 Lemma V false certificates
      direction: lower
      minimum_effect: FORCED exactly 0.
    - metric: M4 beta=0 kangaroo and rho constants
      direction: different
      minimum_effect: Kangaroo 2 sqrt(n) and rho 0.886 sqrt(n) each within 10 percent.
    - metric: M5 biased-offset G2 cost ratio versus uniform
      direction: lower
      minimum_effect: Ratio in [2.5, 6] (predicted about 4).

