hypothesis:
  id: H-ICEX-70ddd4
  question_id: RQ-FIND-001
  source_idea_id: IDEA-20260808-d830c6
  title: >-
    THE ONE REPRODUCIBLE ENDOMORPHISM EFFECT IS THE CLASSICAL AUTOMORPHISM-QUOTIENT
    CONSTANT r = 3 AND THE LINEAR-ALGEBRA CLAIM IS OPEN IN BOTH DIRECTIONS- the
    ratio reproduces in [2.4, 3.6] under a frozen contract and is FLAT in B, a
    curve with 3 not dividing N-1 drives it to 1, and a CURVE-FREE MULTIPLICATIVE-
    ORBIT NULL over Z/N reproduces it too, in which case the r-factor is orbit
    counting and may never be quoted as an endomorphism advantage
  statement: >-
    (A) WHAT IS ESTABLISHED, QUOTED VERBATIM FROM THE LEDGER. DEC-20260727-009
    rationale R5 records that across all four EXP-STR-003 instances the phi arm
    needs a factor of about 3 fewer relation-collection searches per relation row
    than the random arm- searches per row 0.692/1.811, 0.364/1.154, 0.383/1.136
    and 0.770/2.466, i.e. ratios 2.62x, 3.17x, 2.97x and 3.20x - identifies this
    as r = 3, the classical automorphism-quotient saving already quantified in the
    literature, and states that it is a CONSTANT FACTOR and therefore not
    target-class.
    (B) WHAT IS NOT ESTABLISHED, ALSO QUOTED VERBATIM. The same decision records
    instrument_question_disposition with verdict UNADJUDICATED, and states that
    the claimed super-constant linear-algebra saving is exactly the part that is
    not supported. It also records that no downstream record may call phi_alpha an
    artifact and none may call it validated.
    (C) THE CLAIM. Under a contract frozen in advance, with base-row budgets
    matched, the orbit-versus-point matching convention declared, and the dedup
    and zero-filter policy reported per policy rather than pooled, the
    searches-per-relation-row ratio between a phi-stable and a size-matched random
    factor base REPRODUCES IN [2.4, 3.6] at every instance with 3 dividing N-1,
    and is FLAT IN B across at least four values of B. A ratio materially above r
    means the arms differ in something besides the automorphism quotient; a ratio
    GROWING WITH B contradicts the constant-factor characterisation and is the
    single most interesting outcome available in this lane.
    (D) THE CURVE-FREE NULL, WHICH THIS HYPOTHESIS ADDS AND THE SOURCE DOES NOT
    CARRY. The r-fold saving is a consequence of a finite group of order 3 acting
    on the factor base, so that a decomposition found for one orbit representative
    yields r relations by equivariance. NOTHING IN THAT ARGUMENT READS THE CURVE
    EQUATION OR THE GROUP LAW. A NON-CURVE OBJECT OF THE SAME SHAPE - a size-B
    subset of (Z/NZ, +) stable under multiplication by a primitive cube root of
    unity modulo N, which exists exactly when 3 divides N-1, with m-subsets
    summing to the target playing the role of relations - must therefore reproduce
    the ratio near 3. PRE-STATED CONSEQUENCE, FROZEN HERE- IF IT DOES, THE
    r-FACTOR IS A STATEMENT ABOUT ORBIT COUNTING UNDER A MULTIPLICATIVE ACTION ON
    Z/N AND MAY NOT BE QUOTED AS AN ELLIPTIC-CURVE, ENDOMORPHISM OR ECDLP
    ADVANTAGE OF ANY KIND.
    (E) THE PROMOTION PRECONDITION, STATED SO IT CANNOT BE MISREAD. RQ-FIND-001
    constrains promotion VERBATIM to strength replicated or strong evidence.
    EV-STR-003 is preliminary and DEC-20260727-009 is a weaken. THEREFORE NO
    KNOWLEDGE PROMOTION IS AUTHORISED BY THIS HYPOTHESIS OR ITS CONTRACT UNDER ANY
    OUTCOME. The deliverable is a DRAFT boundary statement plus the replication
    that would make a promotion decision possible; the promotion itself is a
    Coordinator decision that this record does not make and cannot make.
    (F) A PARAPHRASE CORRECTED. The source attributes the phrase -claim boundaries
    no stronger than cited EV/DEC scope- to the goal own completion criterion. IT
    IS THE decision_target OF RQ-FIND-001. The substance is unchanged and the
    attribution is corrected rather than inherited.
  mechanism: >-
    THE EXACT ORBIT ARGUMENT, WHICH IS WHY THE EFFECT IS EXPECTED AND WHY THE NULL
    IS EXPECTED TO REPRODUCE IT. A phi-stable factor base of B points covers B/r
    orbits under an order-r action. A decomposition found for one orbit
    representative yields r relations by equivariance. So the searches needed per
    relation ROW fall by a factor r while the searches needed per orbit are
    unchanged. That is an exact statement about orbit counting; it uses the fact
    that phi is an automorphism and nothing else about the curve.
    WHY THE B-DEPENDENCE IS THE INFORMATIVE HALF. The orbit argument predicts a
    CONSTANT r, independent of B. A ratio that GREW with B would mean the phi arm
    is gaining something the orbit count does not explain, which is the only route
    by which this lane could acquire a super-constant effect, and it is precisely
    the claim DEC-20260727-009 records as unsupported. Measuring the slope in B is
    therefore worth more than remeasuring the level.
    WHY THE CONVENTIONS ARE BLOCKING RATHER THAN ADVISORY. DEC-20260727-009
    records that the committed harness mixes three dedup and zero-filter policies,
    so the ratio must be reported PER POLICY and never pooled. Separately, a
    phi-stable base of size B covers only B/r orbits, so the two arms differ in
    effective factor-base size unless B is matched in ORBITS rather than in
    POINTS; the choice must be declared and BOTH matchings reported, because
    reporting one silently is how a factor of r appears or disappears for free.
    WHY THE NULL WITH 3 NOT DIVIDING N-1 IS THE DECAY CONTROL. On such a curve the
    order-3 structure is absent, there is no phi-stable base, and the ratio must
    fall to 1. That is a demonstrated dynamic range of a factor 3 between the
    control and the effect, and it does not appear in any prior arm of this lane.
  assumptions:
    - >-
      The quoted values from DEC-20260727-009 R5 and its
      instrument_question_disposition are as recorded. This agent read those
      passages verbatim this task.
    - >-
      The classical automorphism-quotient attributions repeated in the source are
      taken from DEC-20260727-009 R5 and were NOT independently verified. They are
      marked recalled and support nothing here.
    - >-
      Base-row budgets are MATCHED between arms, and the matching convention -
      orbits or points - is DECLARED BEFORE EXECUTION with both reported.
    - >-
      The dedup and zero-filter policy is declared per cell and the ratio is
      reported PER POLICY, never pooled across policies.
    - >-
      UNITS. Searches per relation row is a COUNT divided by a COUNT and is
      dimensionless; both sides of the arm-to-arm ratio carry that same unit. No
      wall-clock quantity enters any ratio in this record.
  proof_search_map:
    not_applicable_reason: >-
      A replication measurement plus a boundary draft. No theorem, bound,
      certificate family, reduction or closure argument is proposed- the orbit
      argument that predicts r is a one-line consequence of phi being an
      automorphism and is not in doubt, and the record measures whether the
      harness reproduces it rather than proving anything about it. Recorded rather
      than omitted per docs/inventor-protocol.md section 8.
    bottleneck: null
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms:
      - transform: null
        proposed_object: null
        predicted_gain: null
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations:
      - claim: null
        responsibility: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-RFACTOR-1
      formal_statement: >-
        The searches-per-relation-row ratio between a phi-stable and a
        size-matched random factor base converges to r = |Aut(E)|/2 as B grows,
        with fluctuation of order 1/sqrt(number of relations) at fixed B, and with
        NO systematic dependence on B.
      random_model_justification: >-
        RIGOROUS INGREDIENT- the orbit-counting fact that a phi-stable base of B
        points has B/r orbits and that a decomposition found for one orbit
        representative yields r relations by equivariance. That is exact, not
        modelled. THE HEURISTIC PART IS ONLY THE FLUCTUATION LAW- binomial
        fluctuation of hit counts around their mean, the standard model for
        relation-collection yield already used elsewhere in this corpus.
      supporting_results:
        - ref: DEC-20260727-009
          provenance: internal
          claim: >-
            VERBATIM from rationale R5- searches per row 0.692/1.811, 0.364/1.154,
            0.383/1.136 and 0.770/2.466, i.e. ratios 2.62x, 3.17x, 2.97x and
            3.20x, identified as r = 3 and characterised as a CONSTANT FACTOR and
            therefore not target-class; and VERBATIM from
            instrument_question_disposition, verdict UNADJUDICATED, with the
            claimed super-constant linear-algebra saving recorded as exactly the
            part that is not supported and the instrument question open in BOTH
            directions.
          verified_by: >-
            coordinator, TASK-20260904-65b023 - the R5 block, the
            instrument_question_disposition block and the limitations block of
            DEC-20260727-009 read verbatim this task (pattern-scoped read with
            surrounding context). PARTIAL READ, DECLARED- the remainder of the
            decision was not opened and nothing else from it is relied on.
        - ref: RQ-FIND-001
          provenance: internal
          claim: >-
            VERBATIM- the decision target of a Coordinator-approved set of KN-FIND
            entries or explicit not_warranted justifications per evidence record,
            with claim boundaries no stronger than the cited EV/DEC scope; and the
            constraint, VERBATIM, to promote only from strength replicated or
            strong evidence. The second is what forbids any promotion from the
            current preliminary evidence.
          verified_by: >-
            coordinator, TASK-20260904-65b023 - RQ-FIND-001 read in full this
            task, 28 lines.
        - ref: >-
            Wiener-Zuccherato; Duursma-Gaudry-Morain - automorphism-quotient
            speedups for rho at sqrt(r), and the factor-r factor-base quotient for
            index calculus
          provenance: recalled
          claim: >-
            The classical published statement that the automorphism quotient saves
            a factor sqrt(r) for rho and a factor r in the factor base for index
            calculus. ATTRIBUTION TAKEN FROM DEC-20260727-009 R5 AND NOT
            INDEPENDENTLY VERIFIED; no source was opened by this agent. It is a
            pointer for the reviewer and supports nothing here.
          verified_by: null
      validation_experiment_ids:
        - EXP-ICEX-607974
      falsification_condition: >-
        A fitted slope of the ratio against log B whose interval excludes zero at
        the declared replication, i.e. a ratio that GROWS or SHRINKS with B. The
        constant-factor characterisation is then wrong and this is the most
        consequential outcome available in the lane.
    - id: HEUR-RFACTOR-2
      formal_statement: >-
        The ratio is produced by orbit counting alone, so a curve-free object of
        the same shape - a size-B subset of (Z/NZ, +) stable under multiplication
        by a primitive cube root of unity mod N, with m-subsets summing to the
        target as relations - reproduces the ratio in the same band.
      random_model_justification: >-
        The orbit argument is exact and reads no curve structure, so under the
        hypothesis that the effect is orbit counting the null must reproduce it.
        The distribution imitated is the same binomial hit-count model as
        HEUR-RFACTOR-1, applied to a subset of Z/N rather than to x-coordinates.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ICEX-607974
      falsification_condition: >-
        The curve-free null ratio falls outside [2.4, 3.6] while the elliptic arm
        lies inside it, at matched B and matched matching convention. Then
        something curve-specific is acting beyond orbit counting, which would be
        the genuinely interesting outcome and would require its own contract.
  structural_ingredients:
    - description: >-
        The decision that weakened H-STR-002 while explicitly NOT weakening the
        r = 3 effect, supplying the four committed ratio values, the UNADJUDICATED
        instrument disposition, the three-mixed-policy defect, and the record that
        no right-hand side has ever been assembled.
      citation: DEC-20260727-009
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-65b023 - PARTIAL READ, DECLARED (R5,
        instrument_question_disposition and limitations blocks read verbatim).
      role: the committed anchor for the ratio and for every scope exclusion here
    - description: >-
        The promotion constraint that forbids a KN-FIND from preliminary evidence,
        and the decision target this draft boundary is written against.
      citation: RQ-FIND-001
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-65b023 - read in full this task, 28 lines.
      role: the gate that makes this a draft-plus-replication and never a promotion
    - description: >-
        The automorphism-discounted rho baseline, under which any factor at or
        below sqrt(6) is baseline calibration and never an attack. RELAYED- this
        agent did NOT open knowledge/techniques/KN-TECH-018.md. The statement is
        taken from two records this agent DID read verbatim this task-
        DEC-20260727-009 rationale R5, which names the automorphism-discounted
        baseline, and RQ-JINV-8fc13a decision_target and constraints, which state
        VERBATIM that a constant factor at or below sqrt(6) is baseline
        calibration and is recorded as such, never as an attack. Marked recalled
        rather than internal because the technique note itself was not opened.
      citation: KN-TECH-018
      provenance: recalled
      verified_by: null
      role: >-
        the comparator against which the r-factor must be charged; the sqrt(6)
        threshold is relayed from RQ-JINV-8fc13a and DEC-20260727-009
  reduction_chain:
    core_problem: >-
      Whether the one reproducible endomorphism effect in this lane - the
      searches-per-relation-row ratio r = 3 - reproduces under a frozen contract,
      is flat in B, and is reproduced by a curve-free orbit null.
    corollaries:
      - problem: >-
          Whether a KN-FIND boundary record separating the supported constant from
          the unsupported super-constant claim becomes promotable.
        reduction_ref: >-
          Internal- promotion is a Coordinator decision under RQ-FIND-001 and no
          published reduction is cited.
        asymptotics_preserved: >-
          Not applicable. A constant factor at or below sqrt(6) is baseline
          calibration under KN-TECH-018 and never an attack.
  predictions:
    - metric: >-
        P1- searches-per-relation-row ratio, random arm over phi arm, per instance,
        per dedup policy, at matched base-row budget (dimensionless, counts over
        counts)
      direction: different
      minimum_effect: >-
        IN [2.4, 3.6] at every instance with 3 dividing N-1 and a phi-stable base.
        The committed four values are 2.62, 3.17, 2.97 and 3.20 with sample
        standard deviation about 0.27, so the band is roughly plus or minus 2.2
        instance standard deviations around their mean of 2.99. A ratio MATERIALLY
        ABOVE r indicates the arms differ in something besides the automorphism
        quotient and is not a stronger confirmation.
    - metric: >-
        P2- slope of the ratio against log2 B over at least four B values spanning
        at least 8x (dimensionless per log2 B)
      direction: different
      minimum_effect: >-
        AN INTERVAL CONTAINING ZERO. Sizing- with per-cell standard deviation
        about 0.27, S seeds per cell and four B values whose log2 spread has
        standard deviation about 1.06, the standard error on the slope is
        0.27/(sqrt(4*S)*1.06); at S = 3 that is about 0.073, so a slope of 0.5 per
        log2 B - which over the tested range would move the ratio by about 1.4 and
        out of the P1 band - is detectable at nearly 7 sigma. THREE SEEDS PER CELL
        ARE THEREFORE SUFFICIENT AND THE CONTRACT DECLARES THAT COUNT RATHER THAN
        DISCOVERING IT. A slope interval excluding zero FALSIFIES the
        constant-factor characterisation.
    - metric: >-
        P3- decay control- the ratio on a curve with 3 NOT dividing N-1, where no
        order-3 structure exists (dimensionless)
      direction: lower
      minimum_effect: >-
        AT OR BELOW 1.3, i.e. the effect must COLLAPSE TO 1 when the parameter that
        creates it is removed. This is a demonstrated dynamic range of a factor
        about 3 between control and effect. A ratio near 3 on such a curve means
        the harness is measuring something other than the automorphism quotient
        and EVERY POSITIVE IN THIS RECORD IS VOID.
    - metric: >-
        P4- curve-free null- the same ratio on a size-B subset of (Z/NZ, +) stable
        under multiplication by a primitive cube root of unity mod N
      direction: different
      minimum_effect: >-
        PREDICTED IN [2.4, 3.6], the same band as the elliptic arm. PRE-STATED
        CONSEQUENCE- if it reproduces, the r-factor is orbit counting under a
        multiplicative action on Z/N and MAY NOT BE QUOTED AS AN ELLIPTIC-CURVE,
        ENDOMORPHISM OR ECDLP ADVANTAGE. A departure is the curve-specific content
        and is the interesting outcome.
    - metric: >-
        P5- matching-convention sensitivity- the ratio computed under
        POINT-matched B and under ORBIT-matched B, reported side by side
      direction: different
      minimum_effect: >-
        BOTH REPORTED AT EVERY CELL. A phi-stable base of B points covers only B/r
        orbits, so the two conventions differ by construction and a ratio quoted
        without naming its convention is INADMISSIBLE. The gap between the two is
        itself reported, because that gap is exactly where a factor of r can appear
        or disappear silently.
    - metric: >-
        P6- seed spread- the per-seed minimum and maximum ratio per cell, and
        whether the spread narrows as B grows
      direction: lower
      minimum_effect: >-
        THE SPREAD MUST NARROW APPROXIMATELY AS 1/sqrt(number of relations) as B
        grows. A spread that does not narrow indicates the ratio is not a yield
        effect at all, which would undercut the orbit reading independently of the
        level.
    - metric: >-
        P7- STRETCH ARM, end-to-end solve with an actual right-hand side- phi-arm
        solve cost against the folded (B/r) by (B/r) system and against plain
        Wiedemann, at the smallest instance
      direction: different
      minimum_effect: >-
        PREDICTED EQUAL to the folded system within a small constant, i.e. the
        entire structured saving is the folding already accounted for by r. A
        phi-arm cost MATERIALLY BELOW the folded system would be genuine residual
        structure. DEC-20260727-009 R3 records that no right-hand side has ever
        been assembled, so this arm has a BLOCKING PREREQUISITE; if the right-hand
        side cannot be assembled within budget the arm is UNRUN and is reported as
        unrun, NEVER as negative.
  test_boundary:
    instances:
      - >-
        Toy prime-field curves with j = 0 and 3 dividing N-1, at four values of B
        spanning at least 8x, with phi-stable and size-matched random factor bases.
      - >-
        DECAY CONTROL- a curve with 3 NOT dividing N-1, identical pipeline.
      - >-
        CURVE-FREE ARM- a size-B subset of (Z/NZ, +) stable under multiplication
        by a primitive cube root of unity mod N, with m-subsets summing to the
        target as relations, through the identical counters and reporting path and
        with NO curve arithmetic.
      - >-
        E-PRIME ARM- the phi-free closure that isolates closure convention from
        endomorphism content, as named in the DEC-20260727-009 next actions.
    parameters:
      B: 'four values spanning at least 8x, declared before the run'
      seeds: 'at least 3 per cell, from the P2 slope power computation'
      matching_convention: 'BOTH point-matched and orbit-matched, reported side by side'
      dedup_policy: 'declared per cell; the ratio is reported PER POLICY and never pooled'
      m: '2, as in the committed instances'
    implementation: >-
      The existing relation-collection harness with the searches-per-relation-row
      counter it already computes, exposed per arm per policy, plus a curve-free
      arm that replaces the group and the relation predicate only. ONE counter,
      ONE reporting path, ONE seed list shared across arms.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 4.0
      maximum_memory_gb: 8
      maximum_runs: 40
  falsification_conditions:
    - >-
      F1. The ratio is not in [2.4, 3.6] under the frozen contract. THE ONE
      REPRODUCIBLE EFFECT DOES NOT REPRODUCE, no boundary draft may be promoted,
      and the non-reproduction is itself the finding about the only effect this
      line of work has.
    - >-
      F2. The ratio slope against log2 B has an interval excluding zero. The
      constant-factor characterisation is WRONG and this is the most consequential
      outcome available in the lane; it requires independent review before any
      description.
    - >-
      F3. The ratio is at or near 1 on curves with 3 dividing N-1 and a genuinely
      phi-stable base. The automorphism-quotient mechanism is not operating in this
      harness and no positive is admissible.
    - >-
      F4. The decay control on a curve with 3 NOT dividing N-1 does NOT collapse to
      at most 1.3. The harness is measuring something other than the automorphism
      quotient; every positive here is VOID and the run is INVALID rather than
      negative.
    - >-
      F5. The curve-free null reproduces the ratio, as predicted. Then the
      r-factor is orbit counting under a multiplicative action on Z/N and NOTHING
      HERE IS AN ELLIPTIC-CURVE, ENDOMORPHISM OR ECDLP STATEMENT.
    - >-
      F6. The seed spread does not narrow as B grows. The ratio is not a yield
      effect and the orbit reading is undercut independently of the level.
    - >-
      F7. The right-hand side cannot be assembled within budget. The stretch arm is
      UNRUN and is reported as unrun; that is an infrastructure receipt under
      AGENTS.md rule 5 and is never evidence about residual structure.
  interpretation_limits:
    - >-
      NO KNOWLEDGE PROMOTION IS AUTHORISED BY THIS RECORD OR ITS CONTRACT UNDER ANY
      OUTCOME. RQ-FIND-001 constrains promotion VERBATIM to strength replicated or
      strong; EV-STR-003 is preliminary and DEC-20260727-009 is a weaken. The
      deliverable is a DRAFT boundary plus the replication a promotion decision
      would need. Only the Coordinator may promote, in a separate decision.
    - >-
      A PROMOTED FINDING HERE WOULD RECORD A CONSTANT FACTOR THAT IS ALREADY
      PUBLISHED. It is a boundary record, not a discovery, and it must never be
      cited as an endomorphism advantage over rho. Under KN-TECH-018 any factor at
      or below sqrt(6) is baseline calibration and never an attack.
    - >-
      THIS RECORD ADJUDICATES NOTHING ABOUT phi_alpha. DEC-20260727-009 records the
      instrument question as open in BOTH directions and forbids any downstream
      record from calling phi_alpha an artifact or validated. That prohibition is
      respected here.
    - >-
      IT CREATES NO PERMISSION TO RE-ASSERT H-STR-002, which remains weakened with
      an open replication obligation.
    - >-
      IF THE CURVE-FREE NULL REPRODUCES THE RATIO, NOTHING HERE IS AN
      ELLIPTIC-CURVE OR ENDOMORPHISM STATEMENT. Pre-stated so it cannot be
      renegotiated after the data.
    - >-
      THE r-FOLD COLLECTION SAVING PRESUPPOSES THAT phi IS EVALUABLE IN A CONSTANT
      NUMBER OF FIELD OPERATIONS, which is true for j = 0 and j = 1728 and FALSE IN
      GENERAL. Nothing here extends beyond those j.
    - >-
      TOY SCOPE- four instances at at most 20 field bits, B at most 397, arity 2.
      WHETHER THE RATIO REMAINS CONSTANT AT CRYPTOGRAPHIC B IS NOT TESTABLE AT ANY
      SCALE THIS PROGRAM CAN REACH; the slope is measured over an 8x range in B and
      no extrapolation beyond it is claimed.
    - >-
      At the smallest instance a factor of 3 is a handful of searches and variance
      across seeds may exceed the effect; that cell is reported with its spread and
      is excluded from the slope fit by a rule declared before the run.
    - >-
      claim_tier toy. sota_delta zero. The effect is the published baseline; the
      delta is a claim boundary that prevents an unsupported super-constant claim
      from re-attaching to a supported constant one.
