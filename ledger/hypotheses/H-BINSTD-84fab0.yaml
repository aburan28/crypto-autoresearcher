      total_cpu_hours_advisory: 8
      wall_clock_seconds_advisory: 28800

  falsification_conditions:
    - Stage-1 (B) or (C) recomputation disagrees beyond stated tolerances.
    - Filing the cell as DEFINED from (B) alone without (C)+(D) disclosure.
    - Null object returns a numeric per-trial cost (instrument defect).
    - Claiming a deployed-curve break from the naive number or from toy g≤8.
    - Silently tuning preregistered naive/rho_reg tables after Stage-1 outputs.
    - Treating toy g≤8 growth as settling deployed g=22 without stating extrapolation distance.

  interpretation_limits:
    - >-
      THIS HYPOTHESIS DOES NOT CLAIM A BREAK. The naive number exists to be
      audited and disclaimed, not reported as a cost.
    - >-
      OPEN is the honest reachability-table verdict; neither STRUCTURALLY
      EMPTY (that is 6cf862's F_q-rational base) nor DEFINED WITH A COST.
    - >-
      Toy Stage-2 reaches g≤8 against deployed g≤22; extrapolation distance
      is large and must be stated.
    - >-
      Gaudry primary source and Gorla–Massierer paper are recalled until a
      session opens them; Stage-2 literature arm is optional calibration.
    - >-
      Matched-rho margins depend on the 2k symmetry ledger
      (IDEA-20260922-c07598 / EXP-BINSTD-e6fc82 path); revision there
      revises margins here.
    - >-
      Timeouts/crashes/budget aborts are failed_infrastructure (AGENTS.md
      rule 5), never refutation of (A)/(B)/(C).

  distinguishable_outcomes:
    - id: O-OPEN-CELL
      meaning: >-
        Stage-1 certificates match preregistered (A)/(B)/(C); five
        reachability cells filed OPEN with named missing per-trial cost;
        Stage-0 naive-as-DEFINED mutant caught; Stage-2 toy growth law
        (possibly partial) with controls and stated extrapolation —
        portfolio-honesty deliverable complete.
    - id: O-ARITH-REFUTE
      meaning: >-
        Stage-1 recomputation disagrees with preregistered bits/rho_reg
        beyond tolerance — supersede arithmetic, do not patch in place.
    - id: O-REVISE-DEFINED
      meaning: >-
        Toy growth slower than caution assumes (e.g. polynomial in g) AND
        controls hold — move cell toward DEFINED with fitted law replacing
        (k-1)! placeholder; requires independent review before any
        attack-cost reading.
    - id: O-REVISE-INERT
      meaning: >-
        Toy growth explosive (doubly exponential / hard instrument wall
        at modest g) with controls — strengthen OPEN toward "line inert,
        obstruction: per-trial solving cost" with measured obstruction
        block.
    - id: O-CONTROL-VOID
      meaning: >-
        Null returns a cost, or non-T_k control is missing while TZV costs
        were still read — instrument defect; (D) unread from that session.
    - id: O-LIT-GAP
      meaning: >-
        Gorla–Massierer measured costs not obtainable without AUXIN /
        network; recorded as gap; does not block Stage-2 toy arm.
    - id: O-IMPEDIMENT
      meaning: >-
        Budget/infra stop with measured quantity; never negative math
        evidence against (A)/(B)/(C).

