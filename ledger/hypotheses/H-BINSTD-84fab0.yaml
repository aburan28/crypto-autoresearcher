      - deployed_arm: 'c2pnb{176v1,208w1,272w1,304w1,368w1} (k∈{11,13,17,19,23})'
      - toy_tzv_g: '(d,k′) with g=k′-1∈{2,4,6,8}, dk′≤41 (e.g. d=4, k′∈{3,5,7,9})'
      - null_object: 'curve over F_{2^{dk}} not defined over any proper subfield'
      - matched_non_tk: 'same-arity decomposition system on a non-T_k factor base'
      - baseline_g2: 'g=2 reproduction slice (a77711 / Gorla–Massierer regime)'
    parameters:
      q: 65536
      k_values: [11, 13, 17, 19, 23]
      g_deployed: [10, 12, 16, 18, 22]
      toy_g_values: [2, 4, 6, 8]
      toy_dk_max: 41
      preregistered_naive_bits: [50.6, 58.2, 74.3, 82.7, 100.5]
      preregistered_rho_reg: [0.625, 0.750, 1.000, 1.125, 1.375]
