# =============================================================================
# H-BINSTD-84fab0 -- Trace-zero-variety Arm B at five c2pnb rows: naive
# (k-1)!-charged cost sits 27-73 bits below matched rho, but regime ratio
# rho_reg = g/log2(q) >= 1 at three rows invalidates the formula; file the
# reachability cell OPEN with named missing per-trial cost at arity 10-22.
#
# Source: IDEA-20260922-8278db under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Experiment: EXP-BINSTD-0e74e4. Approval: DEC-20261002-584659.
# NO break. NO trusted cost filing from the naive number. NO AUXIN. NO Bedrock.
# =============================================================================
hypothesis:
  id: H-BINSTD-84fab0
  id_provenance: >-
    Minted via `python3 tools/allocate_id.py --next hypothesis --area BINSTD`
    and confirmed free with `--check` on 2026-10-02.
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-8278db
  experiment_id: EXP-BINSTD-0e74e4
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-584659
  status: approved
  proposed_by: coordinator
  title: >-
    Trace-zero-variety Arm B on five c2pnb rows: naive charged cost is a
    regime-invalid trap; file the cell OPEN with named missing per-trial
    decomposition cost at arity 10-22

  statement: >-
    CLAIM (certificate + cost-audit control; NOT a break). Setting:
    E/F_q with q=2^16 over F_{q^k}, k∈{11,13,17,19,23} prime (the five
    composite-degree ANSI X9.62 c2pnb rows; parameters from
    analysis/binstd-curve-audit/). Let T_k = ker(Tr : Res_{F_{q^k}/F_q}(E)
    → E) be the trace-zero variety of dimension g=k-1 containing G
    (IDEA-20260906-a77711 Arm B). (A) STRUCTURAL FIT: audited r agrees
    with q^{k-1} to within one Hasse bit at every row (160/192/256/288/352
    vs 161/193/257/289/353). (B) NAIVE NUMBER (arithmetic only, DISCLAIMED
    as a cost): charging a77711's q^{2-2/g} and disclosed (k-1)! overhead
    yields 50.6, 58.2, 74.3, 82.7, 100.5 bits against matched rho
    2^{77.9}…2^{173.3} (from IDEA-20260922-d11575 / IDEA-20260922-c07598
    path) — margins 27.3…72.8 bits GROWING with k. (C) REGIME FAILURE:
    rho_reg = g/log2(q) = (k-1)/16 equals 0.625, 0.750, 1.000, 1.125,
    1.375; at k≥17 it meets or exceeds 1, exactly a77711's "n growing
    with the field" disclaimer made quantitative. (D) VERDICT: the
    reachability-table cell for TZV decomposition IC on these five rows
    must be filed OPEN with named missing quantity = per-trial
    decomposition solving cost at arity g∈{10,12,16,18,22} over F_{2^16}
    — not STRUCTURALLY EMPTY and not DEFINED WITH A COMPUTED COST. (E)
    TOY (Stage 2, dk≤41): construct descended TZV decomposition systems
    at g∈{2,4,6,8} and measure per-trial wall/op cost vs g; null
    (no-subfield) must report no-construction; matched non-T_k same-arity
    control isolates arity vs TZV-specific growth. CLAIM TIER:
    certificate arithmetic + toy observational measurement with stated
    extrapolation distance. NO break. NO filing of (B) as a trusted cost.
    NO deployed attack. NO transfer of toy g≤8 costs to deployed g≤22 as
    a settled law.

  mechanism: >-
    OBJECT FRAME. Representation R1: x-coordinate of a T_k(F_{q^k}) point
    restricted to its F_q-rational structure (a77711 Arm B, cited).
    Operation set Sigma: translation by the factor base inside T_k
    (partial action, Class I). WHAT THIS HYPOTHESIS ADDS is a COST AUDIT
    at deployed parameters: (i) hand-checkable arithmetic for (A)/(B)/(C);
    (ii) the regime-validity quantity rho_reg; (iii) OPEN verdict with
    named missing per-trial cost; (iv) first toy measurement of that
    missing quantity at g≤8. Lossy-projection test: the naive (B) number
    is a projection that discards per-trial solving cost — the audit
    restores that discarded term as the named open quantity. OFF-LIMITS:
    reporting (B) as a DEFINED cost without (C)+(D); Magma/Sage/cypari2
    as success path; AUXIN; Amazon Bedrock; deployed attacks; rewriting
    IDEA claim text; editing shared GOAL-ECDLP2M-001.yaml.

  assumptions:
    - k odd prime, q=2^16; audited h~q and r~q^{k-1} (checked in (A)).
    - >-
      H-8278db-1 / a77711 H2: decomposition probability ~ 1/(k-1)! is
      retained for the probability half of the naive charge only; this
      hypothesis does NOT assume a value for per-trial cost (H-8278db-2).
    - >-
      Matched-rho figures 2^{77.9}…2^{173.3} (with 2k symmetry divisor)
      are cited from IDEA-20260922-d11575 / IDEA-20260922-c07598 path;
      if that symmetry ledger is later revised, margins in (B) must be
      recomputed, not silently reused.
    - Arithmetic / toy measurement only; nothing here is an attack at m≥131.
    - >-
      Toy g≤8 does not settle deployed g≤22; any fitted law carries an
      explicit extrapolation distance.

  proof_search_map:
    bottleneck: >-
      Per-trial solving cost of one Weil-descended arity-(k-1) decomposition
      attempt over F_{2^16} at g∈{10,12,16,18,22} — unmeasured in this
      program at arity ≥4 (IDEA-20260807-32f96d), and not captured by
      a77711's H1/H2 or the q-exponent alone.
    baseline_embedding:
      parameter_slice: >-
        k'=3 (g=2) and k'=5 (g=4): a77711's own toy ladder and
        Gorla–Massierer implemented cases; naive number at g=2 is
        16*(2-2/2)+log2(2!)=17 bits (deep inside g<<log2(q) regime,
        rho_reg=0.125) — the sanity control where the formula is expected
        to be cheap and valid.
      reproduction_check: >-
        Stage 1: recompute (A)/(B)/(C) programmatically from audited
        parameters and stated formulas; disagreement >0.5 bit or >0.01
        in rho_reg refutes the arithmetic. Stage 2: measure per-trial
        cost at g=2 as the reproduction slice against H2-only prediction.
    observation_collision:
      observable: >-
        Gap between (i) naive (k-1)!-charged bits and (ii) a real
        measured per-relation cost at growing arity; plus the regime
        ratio rho_reg crossing 1.
      distinct_preimage_search: >-
        Separate (a) genuine fast TZV line despite rho_reg≥1 (surprising
        high-consequence reading this contract does not claim), from
        (b) formula-invalid with large per-trial cost (stated prior
        expectation), from (c) instrument that cannot construct T_k at
        all (null-object control), from (d) growth due to arity alone
        rather than TZV structure (matched non-T_k control).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          T_k as (k-1)-dimensional subvariety of Res(E) with F_q-linear
          trace-zero factor base (a77711 construction, cited unmodified).
        predicted_gain: >-
          NONE CLAIMED as an attack gain. Deliverable is the audit that
          the naive predicted gain is untrustworthy at these rows, plus
          the first toy measurement of the missing per-trial term.
    quantifier_order: >-
      FOR EACH of five rows: naive charged bits and rho_reg are exact
      arithmetic consequences of stated formulas (Stage 1). SEPARATELY:
      THERE EXISTS no measured per-trial cost at arity ≥4 in this
      program, so TRUE cost at arity 10-22 is UNKNOWN; OPEN verdict
      follows from the second statement. FOR ANY record citing this
      hypothesis's naive numbers: it MUST also cite (C) and (D) or it
      misuses the record.
    method_ceiling:
      strongest_certifiable_claim: >-
        Naively evaluating a77711 Arm B + (k-1)! at these five rows gives
        numbers 27–73 bits below matched rho growing with k; rho_reg≥1
        at three rows; the cell is OPEN with named missing per-trial
        cost; toy g≤8 yields a measured growth law with stated
        extrapolation distance to g=22. Certifies NOTHING about whether
        TZV actually beats or loses to rho on any deployed row.
      nearby_object_control: >-
        BLOCKING. (i) Proves-too-much at k'=3 (g=2): formula must look
        sanely cheap (rho_reg=0.125). (ii) Null: curve not over a
        subfield → no T_k; instrument reports no-construction, not a
        cost. (iii) Matched non-T_k same-arity decomposition: isolates
        arity-driven vs TZV-specific growth.
    proof_obligations:
      - claim: r ~ q^{k-1} within one bit at all five rows
        responsibility: baseline
      - claim: Factorial magnitudes and log2 values in (B) are arithmetically correct
        responsibility: correctness
      - claim: q^{2-2/g} evaluations in (B) are arithmetically correct
        responsibility: correctness
      - claim: rho_reg = g/log2(q) correctly operationalizes a77711's regime disclaimer
        responsibility: scope
      - claim: Per-trial cost at arity 10-22 is unmeasured in this program (cite 32f96d)
        responsibility: scope
      - claim: Naive number is never filed as a DEFINED trusted cost
        responsibility: scope
      - claim: Toy null and non-T_k controls hold; no break claimed
        responsibility: feasibility
    not_applicable_reason: null

  asymptotic_claim:
    problem: >-
      Decomposition-based index calculus via the trace-zero variety T_k
      on the prime-order subgroup of the five composite-degree ANSI
      binary curves
    prior_best: >-
      Pollard rho with negation and Frobenius classes,
      0.886·sqrt(r)/sqrt(2k) (matched rho; 2k from IDEA-20260922-c07598 path)
    time_exponent: >-
      UNKNOWN. Naive a77711 reading disclaimed outside g≪log2(q);
      this hypothesis does not establish a time exponent.
    memory_exponent: >-
      Roughly order-q factor base (~2^{15} entries) if H1 holds —
      comparatively more trustworthy than the time claim; still not a
      filed DEFINED attack cost here.
    hidden_cofactor: >-
      Per-trial decomposition solving cost at arity 10-22 over F_{2^16},
      wholly unmeasured; the (k-1)! placeholder may severely UNDERESTIMATE.
    claim_kind: open_question_with_named_missing_quantity

  heuristic_assumptions:
    - id: HEUR-BINSTD-8278db-H0
      formal_statement: >-
        NONE FOR (A)/(B)/(C) ARITHMETIC. r~q^{k-1}, the bit table, and
        rho_reg are unconditional evaluations of stated formulas on
        audited inputs. Recorded so the absence of a heuristic for the
        arithmetic half is explicit.
      random_model_justification: >-
        Rigorous: Hasse interval + audited cofactor; standard factorial
        magnitudes; direct evaluation of Gaudry/a77711 exponent form.
      supporting_results:
        - ref: IDEA-20260922-8278db
          provenance: internal
          claim: (A)/(B)/(C) arithmetic and regime ratio stated.
        - ref: IDEA-20260922-6cf862
          provenance: internal
          claim: h~q cofactor identity used in (A).
      validation_experiment_ids:
        - EXP-BINSTD-0e74e4
      falsification_condition: >-
        Stage-1 recomputation disagrees by >0.5 bit (B) or >0.01
        (rho_reg) at any row.
    - id: HEUR-BINSTD-8278db-H1
      formal_statement: >-
        Decomposition probability ~ 1/(k-1)! (a77711 H2 / H-8278db-1),
        used ONLY for the probability half of the naive charge. Not
        re-validated at k up to 23 in this contract.
      random_model_justification: >-
        Classical imitation: unordered arity-g factor-base
        decomposition succeeds at rate ~1/g! when expected solution
        count is 1 (same family as Gaudry–Diem / Dickman–de Bruijn
        heuristics named by IDEA-20260922-6cf862).
      supporting_results:
        - ref: IDEA-20260906-a77711
          provenance: internal
          claim: H2 decomposition probability ~1/(n-1)!.
        - ref: IDEA-20260922-8278db
          provenance: internal
          claim: H-8278db-1 imports H2 unmodified.
      validation_experiment_ids:
        - EXP-BINSTD-0e74e4
      falsification_condition: >-
        Toy g=2/4 exact enumeration showing success rate far from
        1/g! (orders of magnitude), OR a retrieved Gorla–Massierer
        measured rate that contradicts H2 at implemented g.
    - id: HEUR-BINSTD-8278db-H2
      formal_statement: >-
        PER-TRIAL COST IS EXPLICITLY UNASSUMED. Neither O(1)/polylog
        (what a77711's formula needs) nor any specific growth law is
        assumed a priori; Stage 2 measures at g≤8 and states
        extrapolation distance to g=22.
      random_model_justification: >-
        n/a by construction; recorded so absence cannot be misread as
        an implicit O(1) assumption.
      supporting_results:
        - ref: IDEA-20260807-32f96d
          provenance: internal
          claim: Arity m≥4 has zero measured cost cells in the corpus.
        - ref: IDEA-20260922-8278db
          provenance: internal
          claim: H-8278db-2 and named missing quantity (D).
      validation_experiment_ids:
        - EXP-BINSTD-0e74e4
      falsification_condition: >-
        Not a falsifiable value-claim; Stage-2 measurement that shows
        polylog-in-g growth would WEAKEN the caution in (D) and move
        the cell toward DEFINED — that is a success path for revising
        the OPEN verdict, not a falsification of a stated law.

