  reduction_chain:
    core_problem: >-
      File the TZV / Gaudry-AV reachability-table cell on five c2pnb rows
      as OPEN with checkable (A)/(B)/(C) certificates and a named missing
      per-trial cost, plus a toy g≤8 growth measurement.
    corollaries:
      - problem: >-
          Downstream records that would otherwise cite the naive (B)
          number as a DEFINED cost (overclaim trap this audit blocks).
        reduction_ref: >-
          Internal portfolio-honesty obligation (inventor-protocol §4 /
          AGENTS.md rule 5) — not a published reduction.
        asymptotics_preserved: >-
          No attack exponent transferred; OPEN cell is a scheduling and
          honesty result, not a complexity improvement.

  predictions:
    - metric: naive_charged_cost_bits_per_row
      direction: exact
      minimum_effect: >-
        50.6, 58.2, 74.3, 82.7, 100.5 for k=11,13,17,19,23 (±0.5 bit)
    - metric: regime_ratio_rho_reg_per_row
      direction: exact
      minimum_effect: >-
        0.625, 0.750, 1.000, 1.125, 1.375 for k=11,13,17,19,23 (±0.01);
        exactly 1.000 at k=17
    - metric: r_vs_q_to_k_minus_1_bit_agreement
      direction: exact
      minimum_effect: Within one bit at all five rows
    - metric: reachability_cell_verdict
