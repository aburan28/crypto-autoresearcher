  title: >-
    The direct system has 18 variables and Boolean degree at most 6,
    and the degree-10 series coefficient is negative.
  statement: >-
    At m = 3 the product m*(m-1) is 6, while the algebraic degree
    4+4+4 is 12. The Hamming weight of 4 is 1, so three such
    exponents sum to 3. The variable count 3*6 is 18, and
    18+(3-2)*17 is 35. The degree-9 series coefficient is
    48620-13872 = 34748, which is positive. The degree-10
    coefficient is 43758-52020 = -8262, which is negative, so the
    first non-positive index at d = 6 is 10. The column counts
    through degree 10 end at 199140, and the degree-10 row count
    is 68816. Their product has 1713002280 bytes, strictly above
    1700000000 and strictly below 1800000000, and strictly below
    3000000000.
  mechanism: >-
    The proposal prices a direct descent by an exponent-weight
    bound and a semi-regular series. This contract checks those
    integers. It does not build a matrix.
