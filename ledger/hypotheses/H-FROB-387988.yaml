# =============================================================================
# H-FROB-387988 — specified from IDEA-20261006-7300c0 (bytes copied
# unchanged from origin/design/hyper-79cb0a-prym, blob
# 43db777291b1ebd0bba6757b18ca67935cb38371). Question RQ-FROB-7d8dd4.
# The prediction under test is the idea's own: the orbit-over-random
# S_3 hit-rate ratio on the object lies in the closed interval
# [1/2, 2], and the ratio of two random 5-sets on the null curve lies
# in the same interval. The concrete negative is that both object
# rates are at least 1/40 and their ratio lies strictly outside that
# interval. A ratio of 5 is not the prediction. This record does not
# move Gaudry's exponent 8/5 or rho's exponent 5/2.
# =============================================================================
hypothesis:
  id: H-FROB-387988
  question_id: RQ-FROB-7d8dd4
  source_idea_ids:
    - IDEA-20261006-7300c0
  added: '2026-10-06'
  status: approved
  proposed_by: coordinator
  title: >-
    Size-matched S_3 hit-rate ratio of one Frobenius orbit versus a
    random 5-set lies in [1/2, 2] on an ordinary curve over F_{3^5}
  statement: >-
    Let E be the first ordinary short-Weierstrass curve
    y^2 = x^3 + A x + B over F_3, in lexicographic order of (A, B),
    whose group E(F_{3^5}) has a prime-order subgroup G of order at
    least 41 that is not contained in E(F_3). Let B_orbit be one
    Frobenius orbit of five points of G, the orbit whose
    lexicographically least x-coordinate is smallest. Let B_rand be
    a 5-point subset of G drawn from a frozen seed and not equal to
    a single Frobenius orbit. Let rho(B) be the fraction of 40
    frozen targets in G that equal P+Q for some ordered pair P, Q
    in B. The prediction taken from IDEA-20261006-7300c0 is that
    rho(B_orbit)/rho(B_rand) lies in the closed interval [1/2, 2],
    and that the ratio of two independent random 5-sets on the null
    curve also lies in [1/2, 2]. The concrete negative is that both
    object hit counts are at least 1 and the object ratio lies
    strictly outside [1/2, 2], while the null ratio lies inside
    [1/2, 2]. A ratio equal to the orbit length 5 is outside the
    interval and is that negative when the null instrument is quiet.
    A ratio equal to 1/2 or equal to 2 meets the closed interval and
    is not the negative. This cell does not move the opened Gaudry
    exponent q^{8/5} at n = 5, and it does not move rho's exponent
    q^{5/2}.
  mechanism: >-
    The tracked objects are two 5-point subsets of one prime-order
    subgroup, one a Frobenius orbit and one a seed-drawn set that
    is not an orbit. The operation is the group law. A target is a
    hit when it equals P+Q for some ordered pair from the base.
    The projection keeps the two hit counts and discards which pair
    produced the hit. Distinct pairs can share one target. The null
    curve has no q-power Frobenius endomorphism to exploit, and its
    two bases are both random. A ratio strictly outside [1/2, 2]
    on the object, with the null ratio inside the interval, is the
    negative observation that cardinality matching did not remove
    the yield gap. A zero hit count leaves the ratio undefined and
    is not a confirmation of the interval.
  assumptions:
    - The curve model is y^2 = x^3 + A x + B with A, B in F_3. Singular curves, those with A = 0, are skipped. Ordinary means the trace of Frobenius on E(F_3) is not divisible by 3.
    - The search visits every pair (A, B) in lexicographic order. If none is ordinary with a prime-order subgroup of order at least 41 outside E(F_3), the cell is unmeasured.
    - A free Frobenius orbit in that subgroup has size 5. A point fixed by the 3-power Frobenius is discarded. If no size-5 orbit exists, the cell is unmeasured.
    - Forty targets are frozen after both bases are frozen and before any hit bit is computed. The denominator is 40. A zero numerator makes the ratio undefined.
    - The null curve is ordinary, defined over F_{3^5}, and its j-invariant does not lie in F_3. Two random 5-sets replace the orbit arm.
  proof_search_map:
    bottleneck: >-
      The per-attempt S_3 hit fraction at factor-base cardinality 5,
      which IDEA-20261006-7300c0 isolates from the linear-algebra
      factor n.
    baseline_embedding:
      parameter_slice: >-
        q = 3, n = 5, base size 5, 40 targets, one object curve and
        one null curve. The closed interval [1/2, 2] is the
        pre-registered band. The orbit length 5 is not the band.
      reproduction_check: >-
        Every reported hit is re-added by a second group-law
        implementation. Disagreement voids the cell.
    observation_collision:
      observable: the hit-count pair (h_orbit, h_rand) with denominator 40
      distinct_preimage_search: >-
        Record whether two distinct ordered pairs sum to the same
        target. If no target has two pairs, record that each hit
        fibre was a singleton on this cell.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: one ordinary curve over F_3 and one null curve over F_{3^5}
        predicted_gain: >-
          Two ratios. No change to the Gaudry exponent 8/5.
    quantifier_order: >-
      For this one object curve and this one null curve, both
      ratios lie in [1/2, 2] when every rate is at least 1/40. A
      universal quantifier over all curves and all n is not claimed.
    method_ceiling:
      strongest_certifiable_claim: >-
        The two ratios on this cell. They do not prove a factor-base
        theorem at n = 131 and do not change an exponent.
      nearby_object_control: >-
        The null curve, which is not defined over F_3. Its ratio of
        two random 5-sets is the instrument control. A null ratio
        outside [1/2, 2] means the object ratio is not interpreted.
    proof_obligations:
      - claim: Both object rates and both null rates are reported as hit counts over 40, or the cell is unmeasured.
        responsibility: size
      - claim: Every hit agrees under the second addition.
        responsibility: correctness
      - claim: A ratio strictly outside [1/2, 2] is a negative for the band, not a confirmation.
        responsibility: scope
    not_applicable_reason: >-
      One-cell success-fraction control. Not a theorem about
      Gaudry's exponent and not a closure of Frobenius-invariant
      factor bases. The map audits that cell only.
  rerandomization: >-
    No re-randomizing walk is used. The random 5-sets and the 40
    targets are drawn from frozen seeds. Nothing pulls a discrete
    logarithm back to an input point.
  asymptotic_claim:
    problem: >-
      per-attempt S_3 hit fraction at cardinality 5 on one toy
      extension of degree 5
    prior_best: >-
      Opened KR-IC-46d822 gives the heuristic Gaudry exponent
      2 - 2/n = 8/5 in q at n = 5. Opened KR-IC-b0fcda gives a
      factor up to n on the number of systems and n^2 on linear
      algebra. Rho remains exponent n/2 = 5/2 in q. This hypothesis
      moves none of those exponents.
    time_exponent: '8/5, unchanged'
    memory_exponent: >-
      unchanged. Five points and forty targets. Linear algebra is
      not run.
    hidden_cofactor: >-
      The n! and summation-degree pieces inside Gaudry's Õ are not
      measured. This cell has no o(1) attack term because no attack
      is run.
    claim_kind: constant_factor
    claim_kind_note: >-
      The constant factor against the opened Gaudry exponent is 1.
      claim_kind is filled so the non-claim is explicit. A ratio of
      hit counts is not a runtime.
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        At cardinality 5, one Frobenius orbit and one uniform random
        5-subset of G have S_3 hit rates on 40 targets that differ
        by at most a factor of 2, and the same band holds for two
        random 5-sets on the null. The orbit is not assumed uniform.
        The factor-2 band is the pre-registered tolerance. The model
        imitated is a hypergeometric hit rate for a fixed 5-set
        against uniform targets, not a Dickman law.
      random_model_justification: >-
        For a fixed 5-set the hit indicator of a uniform target is
        an average over G of a checkable group-law predicate.
        KR-IC-b0fcda, opened, bounds the number of systems by 1/n
        after orbits are collapsed. It does not bound this hit rate.
        The factor-2 band is a tolerance, not a theorem.
      supporting_results: []
      validation_experiment_ids:
        - EXP-FROB-b9818d
      falsification_condition: >-
        Both object hit counts are at least 1 and the object ratio
        lies strictly outside [1/2, 2], while both null hit counts
        are at least 1 and the null ratio lies inside [1/2, 2].
        That observation refutes the band on this cell. It does not
        refute Gaudry's exponent.
  structural_ingredients:
    - description: >-
        Frobenius-invariant factor bases on a subfield curve reduce
        the number of systems by up to 1/n and speed linear algebra
        by n^2. This cell does not measure that speedup.
      citation: KR-IC-b0fcda
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-b0fcda.yaml
        on 2026-10-06
      role: fence around a linear-algebra reading of the ratio
    - description: >-
        S_3 vanishes when three x-coordinates are x-coordinates of
        points summing to the identity, up to signs. The check here
        is the group law.
      citation: KR-IC-5a43e5
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
        on 2026-10-06
      role: the summation predicate, via the group law
    - description: >-
        For fixed n, Gaudry decomposition on E(F_{q^n}) is heuristic
        Õ(q^{2-2/n}). At n = 5 that exponent is 8/5.
      citation: KR-IC-46d822
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-46d822.yaml
        on 2026-10-06
      role: unchanged time exponent
    - description: >-
        On ordinary binary curves the trace forces first fall degree
        2 for the Weil descent of S_3. The field here is F_{3^5}, and
        no Macaulay matrix is built.
      citation: KR-IC-f5c584
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-f5c584.yaml
        on 2026-10-06
      role: fence around a binary first-fall reading
    - description: >-
        On a binary Koblitz curve, Frobenius-class rho reduces work
        by about sqrt(2m). The matched baseline named by the question
        is rho on the same G, and this cell does not run rho.
      citation: KR-RHO-037e22
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-037e22.yaml
        on 2026-10-06
      role: fence around a rho-constant reading
  reduction_chain:
    core_problem: >-
      one ratio of S_3 hit counts at cardinality 5 over F_{3^5}
    corollaries: []
  predictions:
    - metric: success_rate_ratio_orbit_over_random
      direction: different
      minimum_effect: >-
        The object ratio lies in the closed interval [1/2, 2], and
        the null ratio of two random 5-sets also lies in [1/2, 2].
        The orbit length 5 is outside that interval.
  test_boundary:
    instances:
      - the first qualifying ordinary short-Weierstrass curve over F_3
      - one null curve over F_{3^5} whose j-invariant is not in F_3
    parameters:
      field_base: 3
      extension_degree: 5
      base_size: 5
      target_count: 40
      field_polynomial: a^5 + 2*a + 1
      band: '[1/2, 2]'
    implementation: >-
      Search (A, B) in lexicographic order. Skip A = 0. Require the
      trace on F_3 not divisible by 3, then a prime-order subgroup
      of order at least 41 not contained in E(F_3). Freeze one
      size-5 Frobenius orbit and one seeded 5-set. Freeze 40
      targets. Score ordered-pair sums. Repeat on the null with two
      seeded 5-sets. Re-add every hit. Do not build a Macaulay
      matrix and do not search for a discrete logarithm.
    budget:
      cell: one object curve and one null curve
      maximum_runs: 1
  falsification_conditions:
    - >-
      Both object hit counts are at least 1 and the object ratio
      lies strictly outside [1/2, 2], while the null ratio lies
      inside [1/2, 2]. That is the concrete negative.
    - >-
      Both null hit counts are at least 1 and the null ratio lies
      strictly outside [1/2, 2]. The object ratio is then not
      interpreted.
    - A hit fails the second addition. The cell is void.
  interpretation_limits:
    - One cell, q = 3, n = 5, base size 5, 40 targets. No statement at n = 131 and no exponent change.
    - The factor base remains in the bounded-degree algebraic class. No escape is claimed.
    - A ratio inside [1/2, 2] does not close Frobenius-invariant linear algebra.
    - Gaudry's Õ(q^{8/5}) and rho's q^{5/2} are untouched. 8/5 is 1.6 and 5/2 is 2.5. This cell does not measure that race.
    - If either hit count is 0, the ratio is undefined and the interval is not confirmed.
    - If the search finds no ordinary curve, or no subgroup of order at least 41, the cell is unmeasured. That outcome is not a ratio and not the negative.
