hypothesis:
  id: H-RELN-246a2f
  question_id: RQ-RELN-61638a
  source_proposal: IDEA-20260906-b26c06
  statement: >-
    On the m = 3 index-calculus relation-collection pipeline over prime-order
    short-Weierstrass curves E/F_p (factor base D of B x-classes,
    B ~ (6N)^{1/3}, KN-FIND-007's conservation mean mu = C(B+2,3)/N about 1),
    a learned search policy trained on the two live decision channels --
    the Semaev-system solve trajectory (g1: S-pair/critical-pair selection,
    guess-variable and guess-value/class choice, branch-abandon timing under
    a hybrid guess-and-determine schedule) and the relation-matrix linear-
    algebra pivot order (g2: structured Gaussian elimination before a sparse
    solve) -- earns a STRUCTURE-SPECIFIC gain Gamma(p) = G_obj(p)/G_null(p)
    (trained-policy speedup on the curve's own Semaev system, divided by the
    same speedup on a support-matched semi-regular random system of
    identical shape) that is a CONSTANT independent of p along the toy ladder
    log2 p in {16, 20, 24, 28}, predicted about 1 (|log2 Gamma| <= 0.15 at
    every rung, fitted slope of log Gamma against log p containing 0 in a
    Holm-corrected 95% interval). The target-selection channel (bandit over
    which R to process) and the decomposition-existence channel (order the B
    meet-in-the-middle lookups) are REDUCED AWAY from this hypothesis before
    any policy is trained: target selection is the representation-decidable
    predictor problem of the sibling predictor-panel line (not re-tested
    here), and existence-ordering has an in-record derived ceiling of a
    constant below 2 (stage 0 of this contract re-derives and checks that
    ceiling at zero compute, but does not itself license a policy on that
    channel). ALIVE (falsifies the constant-Gamma claim): a fitted slope
    whose Holm-corrected 95% interval excludes 0 with positive lower end,
    Gamma >= 1.25 at the top rung, replicated across >= 3 curves and >= 5
    training seeds, surviving the permuted-reward, planted-needle and leak
    controls -- in which case the policy's learned guess rule is extracted
    by symbolic regression (sibling H-RELN-427bfd's engine and candidate-list
    discipline) as a proof obligation on the guessed Semaev ideal
    I_R = <S_4(x(R), x_1, x_2, x_3), f_V(x_1), f_V(x_2), f_V(x_3)>.
  mechanism: >-
    OBJECT FRAME (docs/object-frame-ideation.md section 3), inherited
    verbatim from IDEA-20260906-b26c06's mechanism section: representation
    is the affine x-coordinate on the short-Weierstrass model in which S_4
    and the set-theoretic membership polynomial f_V (degree B, KN-OPEN-020
    class) are written. The policy does NOT act on the group's translation
    action (Sigma is not group operations); it acts on the SOLVER'S own
    computation, Sigma = {reduce one S-pair / F4 degree batch, specialise
    one variable to a factor-base value or ordered class, abandon a branch,
    eliminate one pivot}. Trichotomy: COORDINATE-DEPENDENT -- the policy's
    state is a function of x(R), the base's x-values, and the solver's
    internal degree/pair-queue/fill statistics; no discrete logarithm enters
    the state or the reward. The state is a LOSSY, non-Sigma-compatible
    projection (coefficients and exact monomial supports are discarded,
    degree profiles and queue statistics retained) -- a branching object in
    the IDEA-20260802-002 sense, which is exactly why the guess/pivot rule
    must be LEARNED rather than derived, and why this hypothesis's claim is
    about a MEASURED gain against a null, never about a new invariant by
    itself. WHY Gamma ~ 1 IS PREDICTED (three stacked reasons, from the
    idea record, not re-derived here): (i) the membership generators f_V are
    identical on the object and the null and dominate the residual solving
    degree at every guess depth k, so the policy sees mostly the same degree
    profile on both arms; (ii) no committed corpus measurement supports a
    Semaev-specific degree deficit from a learned schedule at toy scale
    (IDEA-20260807-1354d8; the one early anomaly, EV-ALPF-001, was never
    replicated under a validated meter with a matched null); (iii) any guess
    rule that is a function of x(R) and the base's x-values alone is a
    representation-decidable predicate, and this lane's evidence on such
    predicates points at constants. WHAT WOULD MAKE Gamma GROW: only a
    schedule under which the EFFECTIVE solving degree of some branch of the
    guessed ideal falls below the semi-regular reference
    ceil(((3-k)(B-1)+D_S)/2) by a margin growing with B -- da1428's escape
    (E2). This hypothesis's method ceiling is therefore the polynomial-
    calculus refutation degree of the guessed ideal (H-PCD-03be5a): no
    selection policy, however trained, moves below it; a policy can only
    change the ideal by guessing, charged at its branching factor.
  assumptions:
    - >-
      OFF-LIMITS COMPONENT NAMED: the host pipeline is m = 3 factor-base
      index calculus (Class I partial-action) with the lane's set-theoretic
      membership f_V of degree B; this hypothesis adds a learned choice of
      solver trajectory and nothing else -- no new factor base, no new
      representation, no new relation mechanism.
    - >-
      The solver whose trajectory is learned must be an instrumented
      Groebner-order solver (Buchberger/F4 family over F_p) with an exposed
      pair queue and guess schedule, or a Macaulay/XL layer with an exposed
      guess schedule -- NOT the program's existing sympy wrapper, which does
      not expose its pair queue and whose degree outputs are a proxy with no
      dynamic range (IDEA-20260807-1354d8).
    - >-
      The k = m-1 (full-guess) leaf is charged by root-finding plus an O(1)
      hash lookup (da1428's leaf-costing control), never by a further
      Macaulay solve, so that "guess everything" stays honestly cheap.
    - >-
      Toy scale only, log2 p <= 28, one curve family, one base geometry
      (x-interval and QR-class bases), one solver family, one policy
      architecture. No transfer to cryptographic-scale curves is licensed by
      any outcome of this hypothesis (AGENTS.md rules 4 and 6).
    - >-
      This hypothesis inherits IDEA-20260906-b26c06's own sequencing
      condition: it is designed and its Stage 0 (below) is authorized now,
      but Stages 1-4 -- building the instrumented solver, the MDP wrapper,
      and training the policy -- are NOT authorized by this record and
      require a separate Coordinator expand decision, informed by Stage 0's
      own results and by this session's demonstrated environment
      constraints (see the experiment contract's budget_interpretation).
  proof_search_map:
    bottleneck: >-
      Whether the guessed Semaev ideal I_R admits a cheap guess order --
      which coordinate to specialise, to which value or ordered class, and
      at what degree to branch -- under which the EFFECTIVE solving degree
      of the residual ideal falls below the semi-regular reference
      ceil(((3-k)(B-1)+D_S)/2) by a margin growing with B. If it does, the
      hybrid optimum moves interior (da1428's escape E2) and the solve cost
      s(B) changes; if it does not, every policy (learned or oracle) is
      constant-factor on both live channels and this hypothesis's claim
      holds. This single step is what the whole experiment measures, viewed
      through the policy as a search over schedules.
    baseline_embedding:
      parameter_slice: >-
        The zero-learning slice: the untrained policy replaced by the
        default strategy (sugar/normal S-pair selection; degree-by-degree
        F4 batching; the lane's frozen hybrid convention with the k = m-1
        leaf charged by root-finding). At this slice
        G_obj = G_null = Gamma = 1 identically, by definition -- this is
        the fixed point Stage 1's instrumented solver must reproduce before
        any policy is trained.
      reproduction_check: >-
        Deferred to Stage 1 (not authorized by this record): the
        instrumented solver, run with the default strategy on frozen
        toy fixtures (p in {1009, 4099}, B in {6, 8, 12}, m = 3), must
        reproduce the committed semi-regular graded rank profile and
        d_reg = ceil((3(B-1)+D_S)/2) on the random-support null to the
        digit, and the da1428 k-ladder cost table (cost versus k at
        omega = 2) to within a stated constant. A failure voids every
        downstream cell and blocks Stage 2.
    observation_collision:
      observable: >-
        The pair (charged cost profile, terminal certificate) of one
        episode: the vector of counted operations per step, and the
        certified decomposition or certified exhaustive-oracle failure at
        the end. Two policies are observationally identical iff they
        produce the same cost profile and the same certificate on every
        held-out target.
      distinct_preimage_search: >-
        Search for two policies with equal cost profiles on the object that
        differ on the semi-regular null (or vice versa): if such a pair
        exists at every rung, the observable cannot separate structure-
        specific from generic gain and Gamma is not identifiable from cost
        alone. Operational test (Stage 3, not authorized by this record):
        train >= 5 seeds per arm; if the seed-to-seed spread of G_obj
        exceeds |G_obj - G_null| at every rung, the cell reports
        "unidentifiable" rather than a Gamma.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The learned policy's ACTION RULE restricted to guess decisions,
          as a function of coordinates-only features (x(R), the QR class of
          x(R), the x-values/classes of the base, the current degree
          profile) -- the fibre of the cost observable over the guess
          schedule. This is the object handed to symbolic regression
          (sibling H-RELN-427bfd's engine) in the alive branch.
        predicted_gain: >-
          Null outcome: the rule is indistinguishable from the default
          schedule; predicted gain over the null exactly 1. Alive outcome:
          a rule of expression complexity <= 12 nodes predicting the
          policy's guess on >= 90% of held-out episodes and reproducing
          >= 80% of Gamma when substituted for the policy at the held-out
          rung.
      - transform: specialization_pack
        proposed_object: >-
          The planted positive control: I_R with f_V(x_1) replaced by a
          product g_1 g_2 of two degree-~B/2 factors with disjoint,
          experimenter-known root sets, so guessing x_1 among g_1's roots
          first provably reduces the residual to a system of semi-regular
          degree about ceil((2(B-1) + (B/2-1) + D_S)/2) on half the
          branches. This is the instrument's own positive-control fixture;
          its predicted gain factor is a Stage-0 (zero-compute) obligation
          of this record, emitted below from the closed form.
        predicted_gain: >-
          A known, exactly computable factor in counted operations at each
          B (Stage 0 deliverable). The trained policy (Stage 2, not
          authorized) must recover >= 80% of it or the instrument is void.
    quantifier_order: >-
      For the tested curve family, for every rung p on the toy ladder
      {16, 20, 24, 28}, for every policy architecture and training budget
      in the (future, unauthorized) declared grid, there EXISTS a constant
      C (predicted about 1, independent of p) such that the structure-
      specific gain Gamma(p) = G_obj(p)/G_null(p) satisfies
      |log Gamma(p)| <= log C at every rung; equivalently the fitted slope
      of log Gamma against log p has a confidence interval containing 0.
      ALIVE NEGATION: there exists a channel and an architecture in the
      grid for which the slope's Holm-corrected interval excludes 0 with
      positive lower end, replicated across >= 3 curves and >= 5 seeds.
    method_ceiling:
      strongest_certifiable_claim: >-
        At toy scale, on the tested curves, base geometry, solver and
        budget: a constant Gamma with an interval per channel and a slope
        interval per channel; or, in the alive branch, a stated guess rule
        as a candidate invariant with its held-out accuracy -- never a
        theorem. The intrinsic ceiling on the solve channel is the
        polynomial-calculus refutation degree / effective d_reg of the
        GUESSED ideal (H-PCD-03be5a): no selection policy reaches below it,
        and a guess policy is charged at its branching factor, so the
        certifiable claim is bounded above by da1428's (E2) effect size at
        the tested B. On the existence channel (re-derived at zero compute
        in Stage 0, not trained on) the ceiling is a constant below 2. On
        the linear-algebra channel the ceiling is the fill-in gap between
        the object matrix and a random matrix of the same row-weight
        profile.
      nearby_object_control: >-
        The support-matched semi-regular random system (N1: S_4 replaced
        by a random polynomial of the same multidegree support, f_V kept)
        and the relabelled Z/N instance (N2, existence/target arms only),
        plus a random sparse matrix of the same row-weight profile for the
        linear-algebra channel. A policy gain appearing on the object and
        N1 alike is a fact about degree-B membership polynomials, not about
        E; a gain on the object and N2 alike is a fact about (N, B), not
        about the curve's coordinates.
    proof_obligations:
      - claim: >-
          The existence-channel ceiling: the ratio of expected lookups
          under random order to expected lookups under a perfect ordering
          oracle is a constant below 2 for every mu, tending to 1 as
          mu -> 0. Exact value per first-element convention, at mu in
          {1, 1/2, 1/4}.
        responsibility: baseline
      - claim: >-
          The planted positive control's predicted gain factor, from the
          semi-regular closed form, at each B in {6, 8, 12, 16, 24}.
        responsibility: feasibility
      - claim: >-
          The da1428 k-ladder cost table (cost versus guess depth k at
          omega = 2) reproduced at the same B grid, as the Stage-1
          reproduction target (deferred; stated here as the obligation
          Stage 1 must discharge before any policy is trained).
        responsibility: correctness
      - claim: >-
          In the alive branch (future, not authorized here): the extracted
          guess rule, substituted for the policy, lowers the effective
          solving degree of I_R by the measured margin (strictness), and
          does NOT do so on the semi-regular null (scope).
        responsibility: strictness
    not_applicable_reason: null
  heuristic_assumptions:
    - id: HEUR-RELN-H1-b26c06
      formal_statement: >-
        The support-matched null system (S_4's multidegree support replaced
        by a random polynomial, f_V(x_1), f_V(x_2), f_V(x_3) kept) is
        semi-regular in the Bardet-Faugere-Salvy sense, with graded rank
        profile given by the Hilbert-series coefficients and solving degree
        ceil((3(B-1)+D_S)/2), persisting after specialising k coordinates
        (da1428's HA-1).
      random_model_justification: >-
        Froberg's conjecture / Bardet-Faugere-Salvy semi-regularity for
        generic overdetermined polynomial sequences, imitating the classical
        distribution-theorem role in this program's other heuristics; the
        box-convolution factor from f_V is exact since the f_V form a
        regular sequence.
      supporting_results:
        - >-
          Froberg's conjecture / Bardet-Faugere-Salvy semi-regularity
          (recalled, not fetched this session; provenance inherited from
          IDEA-20260808-da1428's HA-1).
      validation_experiment_ids: []
      falsification_condition: >-
        The measured graded rank profile of the null (Stage 1, not
        authorized here) departs from the closed form coefficient-by-
        coefficient at any tested B, beyond the stated tail check.
    - id: HEUR-RELN-H2-b26c06
      formal_statement: >-
        The generic gain G_null(p) of a fixed policy architecture and
        training budget is a constant independent of p along the ladder
        (dependence is on B and system shape, not on the prime).
      random_model_justification: >-
        Imitates the empirical regularity, recalled from the external
        learned-selection-strategy literature (Peifer, Stillman, Halpern-
        Leistner, ICML 2020; provenance recalled, not fetched -- hedged
        accordingly), that selection-strategy speedups on generic ideals
        are constant factors. This is what makes Gamma a well-defined
        ratio rather than an artifact of a growing G_null.
      supporting_results:
        - >-
          Peifer, Stillman, Halpern-Leistner, "Learning selection
          strategies in Buchberger's algorithm", ICML 2020 (recalled,
          hedged; supports only "G_null > 1 is expected", nothing about
          this hypothesis's Gamma claim).
      validation_experiment_ids: []
      falsification_condition: >-
        A fitted slope of log G_null against log p at fixed B whose
        confidence interval excludes 0 (Stage 3, not authorized here): the
        null would then have its own growing structure and Gamma would not
        be a clean ratio.
    - id: HEUR-RELN-H3-b26c06
      formal_statement: >-
        At the lane's base size, the decomposition count c_D(R) of a
        uniformly chosen target is Poisson(mu) to within the Janson bracket
        of IDEA-20260906-86cd30, which the existence-channel ceiling
        derivation uses.
      random_model_justification: >-
        Conservation of the mean (KN-FIND-007, exact) plus the m = 3 Janson
        two-sided bracket on P[c = 0] (IDEA-20260906-86cd30), matching the
        m = 2 exact random-base law already established in this lane.
      supporting_results:
        - >-
          KN-FIND-007 (conservation identity, internal, exact).
        - >-
          IDEA-20260906-86cd30 (Janson two-sided bracket, internal,
          unreviewed proposal status).
      validation_experiment_ids: []
      falsification_condition: >-
        The Stage-0 oracle-ratio computation below (already authorized)
        disagrees with the Poisson prediction beyond the k-rich tail
        check's declared tolerance, using the committed exhaustive c_D
        tables already available from EXP-FB3-001 and the FB3 geometries.
  structural_ingredients:
    - description: >-
        Polynomial-calculus refutation degree as a solver-independent lower
        bound on the maximum degree reached by every Groebner-order solver
        (every monomial order, every selection strategy, F4, F5, XL) --
        the floor this hypothesis's method ceiling rests on.
      citation: H-PCD-03be5a
      provenance: internal
      verified_by: >-
        H-PCD-03be5a read in full by the idea-generator session that
        produced IDEA-20260906-b26c06 (2026-09-06); re-cited here without
        re-reading.
      role: solve-channel lower bound
    - description: >-
        Semi-regular reference solving degree d_reg = ceil((m(B-1)+D_S)/2)
        for the Semaev system with degree-B set-theoretic membership.
      citation: IDEA-20260808-093497
      provenance: internal
      verified_by: >-
        Quoted as restated in RQ-PFDR-ae2fba; not independently re-opened
        this session.
      role: semi-regular baseline formula
    - description: >-
        Hybrid guess-and-determine optimum under the semi-regular null is
        full guessing (k = m-1); the k = m-2 to k = m-1 cost ratio is
        Theta(B^{2 omega - 1}); the three escapes E1/E2/E3, of which E2
        (severe semi-regularity failure) is this hypothesis's alive-branch
        mechanism.
      citation: IDEA-20260808-da1428
      provenance: internal
      verified_by: >-
        Title, claim, mechanism, controls and heuristic_assumptions read by
        the idea-generator session that produced IDEA-20260906-b26c06
        (2026-09-06); re-cited here without re-reading.
      role: solve-channel default strategy and escape taxonomy
  predictions:
    - metric: >-
        Existence-channel oracle ratio (Stage 0, authorized): expected
        lookups under random order divided by expected lookups under a
        perfect ordering oracle, from the Poisson law at mu in {1, 1/2, 1/4}
        under both first-element conventions.
      direction: lower
      minimum_effect: >-
        < 2 at every mu, decreasing toward 1 as mu decreases. A computed
        ratio >= 2 refutes the in-record derivation and re-opens the
        existence channel as a live channel for a policy.
    - metric: >-
        Gamma_solve(p) = G_obj(p)/G_null(p), solve channel (Stage 2-3,
        NOT authorized by this record).
      direction: different
      minimum_effect: >-
        NULL (predicted): |log2 Gamma| <= 0.15 at every rung, slope
        interval contains 0. ALIVE: slope interval excludes 0 with positive
        lower end, Gamma >= 1.25 at the top rung, replicated across >= 3
        curves and >= 5 seeds, surviving permuted-reward/planted-needle/
        leak controls.
    - metric: >-
        Gamma_LA(p), linear-algebra channel (Stage 2-3, NOT authorized by
        this record).
      direction: different
      minimum_effect: Predicted |log2 Gamma_LA| <= 0.15 at every rung; alive as above.
  test_boundary:
    instances: >-
      Stage 0 (authorized): symbolic/closed-form computation only, no
      curve instances. Stage 1-4 (not authorized): one short-Weierstrass
      prime-order curve family, 3 curves per rung, toy ladder
      log2 p in {16, 20, 24, 28}.
    parameters:
      m: 3
      B_existence_and_target_arms: round((6N)^(1/3))
      B_solve_arm_grid: [8, 12, 16, 24]
    implementation: >-
      Stage 0 requires only Python arithmetic over the closed forms already
      named (Poisson/binomial ratio, semi-regular degree formula, da1428
      k-ladder). Stage 1-4 require an instrumented Buchberger/F4 solver
      with an exposed pair queue and guess schedule (the program's sympy
      wrapper is explicitly disqualified, IDEA-20260807-1354d8) -- none of
      that implementation is authorized by this hypothesis or its paired
      experiment contract.
    budget: {}
  falsification_conditions:
    - >-
      Gamma_solve or Gamma_LA with a fitted slope whose Holm-corrected 95%
      interval excludes 0 with positive lower end, Gamma >= 1.25 at the top
      rung, replicated across >= 3 curves and >= 5 seeds, with the
      permuted-reward control at parity, the planted control recovered, and
      the leak audit passed (Stage 2-3 only; not reachable by Stage 0).
    - >-
      A measured existence-channel oracle ratio >= 2 at any tested mu under
      either first-element convention (reachable by Stage 0 alone).
    - >-
      A trained policy's counted cost on a k = 0 branch falling below the
      Macaulay cost implied by the branch's measured effective d_reg
      (Stage 2-3 only) -- this would indicate a cost- or solver-model
      defect, reported as an instrument finding, not a policy gain.
  interpretation_limits:
    - >-
      CONSTANT-FACTOR UNLESS THE GROWTH ARM SAYS OTHERWISE: a non-growing
      Gamma is reported as a constant (RQ-RELN-61638a constraint 3); a
      G_null > 1 is generic solver overhead, never a finding about E.
    - >-
      NOTHING ABOUT CRYPTOGRAPHIC SCALE: toy ladder log2 p <= 28 only; no
      transfer to P-256-class curves is licensed by any outcome.
    - >-
      A LEARNED RULE IS NOT A THEOREM: in the alive branch (not reachable
      by this record alone), the extracted guess rule is a candidate
      invariant carrying a proof obligation, becoming a result only through
      a proof record or a replicated null-separated measurement at a
      further rung.
    - >-
      This hypothesis's Stage 0 is a zero-compute re-derivation and
      falsification check on the existence-channel ceiling and the
      Stage-1-4 predicted quantities; it does not itself measure Gamma on
      either live channel and cannot alone confirm or refute the
      constant-Gamma claim.
    - >-
      Timeouts, OOM, training divergence and solver crashes are
      failed_infrastructure, never evidence (AGENTS.md rule 3); an episode
      exceeding its budget carries no cost and no certificate.
  status: proposed
  proposed_by: coordinator
