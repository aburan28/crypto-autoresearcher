    IDEA-20260905-0e0982 uses that Frobenius acts as a 3-cycle on E[2] and that the centraliser in S_3 has order 3, giving two F_p-rational (2,2)-gluings. Stage 0 freezes |S_3|=6 and the 3-cycle count 2. No Cantor. No Semaev S_m. No DLP.
