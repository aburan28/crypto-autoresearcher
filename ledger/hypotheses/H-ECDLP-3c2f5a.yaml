    Fix the exact rational-gluing count identities of IDEA-20260905-0e0982 before any Mumford divisor, any genus-2 index calculus, or any discrete logarithm is claimed. Stage 0 asserts only that |S_3|=6 and that S_3 contains exactly two 3-cycles. A nearby claim that all 6 permutations yield rational gluings is rejected. The dummy count 0 is rejected. This is not a Jacobian construction and not a rho beat. Stages 1+ stay unauthorized.
