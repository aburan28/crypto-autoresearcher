  reduction_chain:
    core_problem: >-
      Determine the exponent of rho_p(Y), the density of supersingular curves
      admitting an isogeny of degree at most Y to their Frobenius conjugate, and
      hence the time-memory frontier of the frozen paper's algorithm family.
    corollaries:
    - >-
      If the exponent is 3/2, the frontier is TIME * MEMORY^{1/2} = p^{1/2+o(1)},
      the p^{1/3} corner is structural, and no improvement to the claw-search
      technique can move it -- which redirects effort in this goal away from
      search-technique work and toward the o(1), where its own committed residual
      lies.
    - >-
      If the exponent exceeds 3/2 on any reachable family, both the time and the
      memory exponent of the frozen paper's Theorem 1.1 improve, to
      1/3 - eps where Y0 = p^{1/3-eps} is where the density reaches 1.
    corollaries_note: >-
      DELIBERATELY SHORT. There is no reduction from this hypothesis to any
      statement about Heuristic 1, which concerns the SMOOTHNESS of the minimal
      degree rather than its SIZE; the two are different functionals of the same
      object and this record must never be cited as bearing on Heuristic 1. Nor
      is there any reduction to this goal's completion criterion 1, which
      concerns a per-entry cost calibration untouched here.

