hypothesis:
  id: H-WESO-9dc201
  question_id: RQ-WESO-8aff57
  title: >-
    The conjugate-degree density law and the Y-parameterised family: rho_p(Y) has
    exponent 3/2, Delfs-Galbraith and Wesolowski are its two endpoints, and the
    memory corner at 1/3 is pinned by a class number

  statement: >-
    SCOPE OF THE MEASURED PART: supersingular elliptic curves over F_{p^2} for
    primes p in a toy ladder with p <= 2 * 10^5, delta measured by exhaustive
    l-isogeny-graph enumeration over all primes l up to the ladder's declared
    degree ceiling, exact integer counts, one instrument lineage, single
    deterministic construction. CLAIM TIER toy for every measured number and
    derivation for every algebraic statement. NO ATTACK IS CLAIMED, NO EXPONENT
    IS MOVED, AND NOTHING HERE IS CRYPTOGRAPHIC-SCALE EVIDENCE.
    THE HYPOTHESIS, in three parts, each separately falsifiable.
    (H-A) DENSITY LAW. Define delta(E) = min{deg phi : 0 != phi in
    Hom(E, E^{(p)})} and rho_p(Y) = #{E supersingular /F_{p^2} : delta(E) <= Y}
    / #{E supersingular /F_{p^2}}. Then rho_p(Y) = Y^{3/2} p^{-1/2 + o(1)}
    uniformly for 1 <= Y <= (p/2)^{1/3}. The exponent 3/2 is asserted; the
    constant is not.
    (H-B) THE TWO ANCHORS ARE EXACT AND FORCE THE EXPONENT INDEPENDENTLY OF THE
    DERIVATION. rho_p(1) = #(S_p ∩ F_p)/#S_p = p^{-1/2 + o(1)}, because
    delta(E) = 1 iff j(E) in F_p and the number of such j is a class number; and
    rho_p((p/2)^{1/3}) = 1 exactly, by the frozen paper's Theorem 1.5. Any pure
    power law through those two points has exponent (1/2)/(1/3) = 3/2. The
    generic rank-4 lattice heuristic predicts exponent 2 instead and is therefore
    REFUTED BY THE ANCHORS ALONE, by a factor p^{1/6}, before any measurement.
    (H-C) THE FAMILY AND ITS TRADEOFF IDENTITY. Running the frozen paper's
    Algorithm 2 with the constant (p/2)^{1/3} replaced by a free parameter
    Y in [1, (p/2)^{1/3}] -- i.e. X_Y = B^{1/2} Y^{1/2} -- yields memory
    Y^{1+o(1)} and expected time p^{1/2+o(1)} Y^{-1/2}, hence
      TIME * MEMORY^{1/2} = p^{1/2 + o(1)}
    identically along the family, with Y = 1 reproducing the Delfs-Galbraith
    exponent pair and Y = (p/2)^{1/3} reproducing Theorem 1.1's. This is the same
    curve the frozen paper attributes to van Oorschot-Wiener, reached by a
    mechanism containing no collision search. Consequently the p^{1/3} corner is
    a property of the claw STRUCTURE, not of the search technique, and it is
    located exactly where the retry exponent 3/2 of (H-A) crosses the table
    exponent 1.
    WHAT WOULD FALSIFY THE WHOLE THING, STATED AS THE DELIVERABLE RATHER THAN AS
    A HAZARD: if the measured exponent of rho_p is materially above 3/2 on any
    reachable family, then rho_p reaches 1 at some Y0 < (p/2)^{1/3} and the
    algorithm's time AND memory both drop to Y0^{1+o(1)}, i.e. the exponent 1/3
    was never the right corner. The hypothesis asserts that this does not happen
    on the full supersingular population; it deliberately asserts nothing about
    restricted families, and names them as open.
    IF NO PART SURVIVES, THE DELIVERABLE IS A NAMED NO-GO WITH ITS BOUNDARY: the
    class-number route does not determine the conjugate-degree density over the
    tested range, stated with the exact primes, the exact degree ceiling, and the
    measured exponent that replaced 3/2.

  mechanism: >-
    DERIVED IN-REPO. Every external input is labelled. Natural logarithms.
    Write S_p for the supersingular j-invariants over F_{p^2}, #S_p = p/12 + O(1);
    sigma(j) = j^p, an involution on S_p with fixed locus S_p ∩ F_p.

    (1) THE CORRESPONDENCE. Let phi : E -> E^{(p)} have degree d and let
    iota : E^{(p)} -> E be the p-power Frobenius. Then theta = iota o phi lies in
    End(E) with inseparable degree p and deg(theta) = pd; the frozen paper uses
    exactly this composition in Section 1.4 and in the proof of Theorem 1.1 to
    manufacture a non-scalar endomorphism. Adjusting phi within its coset modulo
    Z to make the reduced trace zero gives theta^2 = -pd, i.e. an embedding
    Z[sqrt(-pd)] -> End(E). Conversely, an embedding of an order containing
    sqrt(-pd) yields an isogeny of degree d to the conjugate. DERIVED HERE; the
    trace-normalisation step is elementary but is listed as a proof obligation
    because it is where a factor of 2 or a parity condition can hide.

    (2) THE COUNT. By the Deuring correspondence and Eichler's optimal-embedding
    count, the number of supersingular curves admitting such a theta, summed with
    the natural weights, is h(-4pd) up to factors that are p^{o(1)}; and by
    Siegel, h(-4pd) = (pd)^{1/2 + o(1)}. Hence
      SUM_{d <= Y} #{E : exists isogeny of degree d to E^{(p)}}
        = p^{1/2+o(1)} SUM_{d<=Y} d^{1/2} = (2/3) Y^{3/2} p^{1/2 + o(1)},
    and dividing by #S_p = p/12 + O(1),
      rho_p(Y) <= 8 Y^{3/2} p^{-1/2 + o(1)}.
    THE INEQUALITY IS NOT AN ACCIDENT OF PRESENTATION. The sum counts PAIRS
    (E, d), so a curve with several admissible degrees is counted several times;
    the overcount factor is exactly the multiplicity k_isog that the frozen
    paper's Remark 1 names and does not quantify, and that
    IDEA-20260805-b4bc59 proposes to measure. The matching LOWER bound is NOT
    DERIVED HERE and is declared unproved: it requires either a second-moment
    argument bounding the multiplicity or an inclusion-exclusion over d. THIS IS
    THE SINGLE LARGEST GAP IN THE MECHANISM and it is stated as a gap.

    (3) THE ANCHORS, WHICH DO NOT DEPEND ON (1) OR (2). delta(E) = 1 iff E is
    isomorphic to E^{(p)} iff j(E) = j(E)^p iff j(E) in F_p. The count of
    supersingular j in F_p is h(-p) or 2h(-p) according to p mod 4, hence
    p^{1/2+o(1)}, so rho_p(1) = p^{-1/2+o(1)} -- and this is precisely the
    density Delfs-Galbraith exploits, which is why that algorithm costs p^{1/2}.
    At the other end, Theorem 1.5 of the frozen paper gives delta(E) <=
    (p/2)^{1/3} for EVERY supersingular E, so rho_p((p/2)^{1/3}) = 1 exactly.
    A pure power law rho_p(Y) = c Y^a p^{-1/2} through both points forces
    a = 3/2. THE ARITHMETIC OF (2) AND THE ANCHORS OF (3) ARE INDEPENDENT ROUTES
    AND THEY AGREE. That agreement is the strongest pre-compute evidence
    available and it is also the reason the hypothesis is worth testing rather
    than merely asserting: two routes agreeing on 3/2 while a third standard
    route (the Gaussian heuristic for a rank-4 form, see (4)) says 2 is a
    genuine three-way situation with a decidable answer.

    (4) WHY THE GENERIC LATTICE HEURISTIC IS THE WRONG MODEL, AND WHY SAYING SO
    IS PART OF THE MECHANISM. Section 4.2 of the frozen paper states that
    Hom(E, E^{(p)}) with the form deg is isometric to the two-sided ideal of
    reduced norm p in the corresponding maximal order, with form Nrd/p. For a
    rank-4 positive form of determinant D the Gaussian heuristic gives
    #{x : q(x) <= Y} ~ (pi^2/2) Y^2 / sqrt(D), so the CDF of the minimum would
    have exponent 2, and with the determinant of deg on this lattice being of
    order p^2 (RECALLED, UNVERIFIED -- see HW-3) the typical minimum would sit at
    p^{1/2}. THEOREM 1.5 SAYS IT IS ALWAYS AT MOST p^{1/3}. So this lattice
    family is systematically non-generic: it carries a vector shorter by a factor
    p^{1/6} than a random lattice of the same determinant would. The exponent-2
    model additionally predicts p^{1/3} curves with j in F_p against a true count
    of p^{1/2}, so it is refuted by an exact count and not merely disfavoured.
    Carrying the refuted model explicitly through the experiment as a competing
    fit is deliberate: a single model fitted to data it was built for is not a
    test, and reporting both fits on the same grid is what makes it one.

    (5) THE FAMILY. Take Algorithm 2 verbatim and replace (p/2)^{1/3} by Y. The
    only place the bound is used is the display in the proof of Lemma 3.4,
      deg(eta) = deg(phi)/deg(psi) <= l_{k+1} (p/2)^{1/3} / X <= B (p/2)^{1/3} /
                 (B^{1/2}(p/2)^{1/6}) = B^{1/2}(p/2)^{1/6} = X,
    which under deg(phi) <= Y and X_Y = B^{1/2} Y^{1/2} becomes
      deg(eta) <= B Y / (B^{1/2} Y^{1/2}) = B^{1/2} Y^{1/2} = X_Y,
    so the lemma goes through unchanged. Note the consistency check at the
    endpoint: u_Y = log Y / log B equals the paper's u = log(p/2)/(3 log B)
    exactly when Y = (p/2)^{1/3}. With B = p^{o(1)}: table size and memory
    M_Y = Psi(X_Y, B) X_Y = Y^{1+o(1)}; per-attempt success rho_p(Y) P0(Y,B) =
    Y^{3/2} p^{-1/2+o(1)}; expected time M_Y / (rho_p P0) = p^{1/2+o(1)} Y^{-1/2}.
    Hence TIME * MEMORY^{1/2} = p^{1/2+o(1)} along the whole family.

    (6) WHAT THIS PINS, STATED AT THE CLOSURE STANDARD RATHER THAN AS A TALLY.
    The corner is where the table exponent (1, in log_p Y) meets the retry
    exponent (3/2), i.e. at log_p Y = 1/3. To move it one must raise the density
    exponent above 3/2, hence raise the growth of SUM_{d<=Y} h(-4pd) above
    Y^{3/2} p^{1/2}, hence break Siegel's law on average -- which is a theorem.
    THE OBSTRUCTION IS NAMED (Siegel's class-number law composed with the
    d^{1/2} summation), THE ARGUMENT IS GIVEN (steps 1-3), AND THE FORWARD
    GUIDANCE IS: it constrains only the FULL supersingular population under the
    MINIMAL-degree statistic reached by the counting route. Explicitly left open,
    and none of it is claimed closed: (i) restricted families with anomalous
    class numbers, in particular j = 0 and small-CM curves, which this program
    has repeatedly named as an unrun nearby-object control; (ii) the joint
    distribution of (delta, smoothness), since the algorithm needs a smooth
    witness and the correlation between minimality and smoothness has never been
    measured; (iii) non-minimal and non-cyclic isogenies, which Remark 1 says are
    plentiful and which the counting route treats only through the unproved
    multiplicity; (iv) higher-dimensional generalisations, entirely outside this
    analysis.

  assumptions:
  - >-
    FROZEN DEFINITIONS AND GRID, fixed before any evaluation. delta(E) is the
    minimum of deg over the nonzero elements of Hom(E, E^{(p)}), measured as the
    least d for which a chain of l-isogeny steps of total degree d carries j to
    j^p, with l ranging over ALL primes up to the declared degree ceiling C_p.
    The ladder is p in {1019, 10007, 100003} unless a prime is excluded by the
    construction rule, with C_p = floor((p/2)^{1/3}) and the requirement that
    every integer <= C_p be C_p-smooth over the primes used -- which is
    automatic in this range and is CHECKED AND RECORDED per prime rather than
    assumed. The Y-grid is every integer in [1, C_p]. No parameter is adjusted
    after any number is observed; any adjustment requires a versioned
    protocol_amendment and is never an edit.
  - >-
    MODULAR POLYNOMIALS ARE FETCHED, NEVER RECALLED. The coefficients of Phi_l
    are obtained from the same provenance route this goal's own BATCH-002 and
    BATCH-003 runs used (Sutherland's tables at
    https://math.mit.edu/~drew/modpolys/jfiles/phi_j_%d.txt), with URL, UTC
    timestamp, byte length and SHA-256 recorded per l. HARDCODING PHI_2 FROM
    MEMORY IS FORBIDDEN: a recalled coefficient that is silently wrong would
    corrupt the entire enumeration in a way no downstream control detects.
  - >-
    THE ENVIRONMENT IS AS MEASURED IN THIS SESSION, NOT AS ASSUMED. Verified by
    direct import: Python 3.11.15 and numpy 2.4.6 are present; sympy is NOT;
    SageMath is NOT. The instrument is therefore pure Python plus numpy, with
    F_{p^2} implemented explicitly. The session angle brief records two scouts
    disagreeing about numpy's presence; this record resolves the disagreement by
    measurement and states which way.
  - >-
    THE COMMITTED EXTERNAL NUMBERS ARE READ AS-IS. Theorem 1.5's bound
    (p/2)^{1/3} and the five-row cost table are taken verbatim from
    inputs/P13-WESOLOWSKI-2026/paper_fulltext.md. arXiv 2607.14624 itself is NOT
    READ; if its statement differs from the frozen paper's paraphrase, anchor
    (A2) changes and this hypothesis must be re-derived rather than adjusted.
    Checking it is IDEA-20260805-332316's job and is a declared dependency.
  - >-
    NO NUMBER, ESTIMATOR, BRACKET OR MARGIN ROW FROM THIS GOAL'S PER-ENTRY COST
    LANE (EXP-PEC-6be870, EXP-PEC-49c773, EV-PEC-2e67ff, EV-PEC-857664) IS USED,
    CITED AS SUPPORT, OR CONTRADICTED. A per-entry constant multiplies M_Y
    identically at every Y and therefore translates the frontier without moving
    its corner; that is the only interaction between the two lanes and it is
    recorded so a reviewer can verify no other is smuggled in.

  proof_search_map:
    bottleneck: >-
      The retry exponent. Every cost statement about this algorithm family is
      (table exponent) minus (density exponent) in log_p Y, and the density
      exponent is the only one nobody has computed. The frozen paper never needs
      it because it works at the single point where the density is 1 by Theorem
      1.5; the moment Y becomes free, the density is the whole cost model.
      Establishing or refuting the exponent 3/2 is upstream of every
      memory-tradeoff statement in GOAL-P13-001 and consumes no other lane's
      budget.
    baseline_embedding:
      parameter_slice: >-
        Y = 1 and Y = floor((p/2)^{1/3}), the two exact anchors. At Y = 1 the
        family must reproduce the Delfs-Galbraith setting exactly: the level set
        is S_p ∩ F_p, its cardinality is a class number, and the cost pair is
        (p^{1/2}, p^{o(1)}). At Y = (p/2)^{1/3} it must reproduce Theorem 1.1's
        pair (p^{1/3+o(1)}, p^{1/3+o(1)}) with rho = 1.
      reproduction_check: >-
        EXACT INTEGER IDENTITIES, not curve similarity. (i) The enumerated count
        #{j in S_p : delta = 1} must equal, integer for integer, the count of
        supersingular j in F_p obtained by a DISJOINT code path -- counting
        reduced binary quadratic forms of discriminant -p or -4p. Two
        independent computations of the same integer either agree or one is
        wrong. (ii) max_E delta(E) <= floor((p/2)^{1/3}) at every ladder prime,
        with no exception. (iii) rho_p at the top of the grid equals exactly 1.
        A plot of rho_p that merely looks like a power law is NOT an embedding
        and does not discharge this audit.
    observation_collision:
      observable: >-
        The single integer delta(E) per curve, and its empirical CDF rho_p.
      distinct_preimage_search: >-
        A COLLISION EXISTS, IS MASSIVE, AND IS THE POINT RATHER THAN A DEFECT:
        delta has fibres of size p^{1-o(1)}/Y, so delta does not identify E even
        approximately, and no statement in this hypothesis may be read as
        recovering anything about a curve from its delta. The identifiability
        question that DOES bite is at the level of MODELS, and there a collision
        is deliberately hunted: the two competing density laws, exponent 3/2 and
        exponent 2, both satisfy the constraint rho_p((p/2)^{1/3}) = 1 and are
        separated ONLY by the second anchor rho_p(1). Two models sharing one
        observable and differing on another is exactly the configuration this
        audit is for, and the resolution is that the exponent-2 model predicts
        p^{1/3} curves with j in F_p against a measured p^{1/2} -- an exact
        integer separation, computed on the same run, by the same code, at the
        same primes. If BOTH models fitted the whole grid within tolerance, the
        grid would be too short to separate them and the honest report would be
        "not separated at this scale" rather than a verdict.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        Replace "the cost of a claw search in memory w" by "the density of curves
        with delta <= Y", moving the tradeoff question into a model where it is
        an exact counting statement about class numbers rather than an
        approximate statement about a search technique.
      predicted_gain: >-
        The tradeoff curve becomes derivable rather than quoted, its corner
        becomes attributable to a specific arithmetic quantity, and the question
        "can the memory corner move" becomes the question "can the class-number
        exponent move", which is answerable. Encoding, completeness, soundness,
        transfer and cost-loss obligations are listed under proof_obligations;
        the transfer obligation to CRYPTOGRAPHIC SCALE IS DECLARED UNMET, not
        deferred: a toy ladder to 10^5 cannot certify an asymptotic exponent.
    - transform: observable_fiber
      proposed_object: >-
        Hold the observable rho_p fixed and vary the forgotten structure: compare
        the full supersingular population against the sub-population of curves
        with extra automorphisms or small-discriminant CM orientations (j = 0,
        j = 1728). The intrinsic invariant proposed to distinguish them is the
        class number of the orienting order.
      predicted_gain: >-
        Either the sub-population has the same density exponent -- in which case
        the law is robust and the nearby-object control passes -- or it does not,
        in which case a restricted family with anomalous density has been
        exhibited, and that is the ONLY route in this analysis by which the
        memory corner could move. Both outcomes are deliverables and the arm is
        cheap because the sub-population is tiny.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER: THERE EXISTS an exponent a = 3/2 and a function
      p^{o(1)} SUCH THAT FOR ALL p and FOR ALL Y in [1, (p/2)^{1/3}],
      rho_p(Y) = Y^a p^{-1/2} * p^{o(1)}. The witness a MAY NOT depend on p, on
      Y, or on the curve family. THE WEAKER ORDER -- for all p and Y there exists
      a local exponent matching the data -- is trivially satisfiable by any
      monotone function and is EXPLICITLY NOT CLAIMED AND NOT ADMISSIBLE as a
      result; the graded local-slope readout exists precisely to prevent a global
      fit being reported when only the weak order holds.
      A SECOND QUANTIFIER OBSERVATION, about the frozen paper rather than about
      this hypothesis, obtained free by running the audit on it: Theorem 1.1 is
      "for all E", but Heuristic 1 is stated for a UNIFORMLY RANDOM E. The
      universal quantifier in Theorem 1.1 is purchased entirely by Algorithm 3's
      re-randomising walk and the mixing bound it cites; so the mixing bound is
      load-bearing for the QUANTIFIER, not merely for efficiency, and any
      weakening of it weakens Theorem 1.1 from "for all" to "for random". This
      observation is recorded here, is not a defect claim, and is offered to the
      Coordinator for independent checking.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: a toy-tier measured density exponent over p <= 2*10^5 and
        Y <= floor((p/2)^{1/3}), on one instrument lineage, together with a
        derivation-tier algebraic identity relating that exponent to the
        time-memory frontier. It CANNOT certify the asymptotic exponent, cannot
        move any exponent, cannot bound any solver's cost at cryptographic scale,
        cannot validate or refute Heuristic 1 (a different statement about a
        different statistic), and cannot decide this goal's completion criterion
        1, which concerns an empirical per-entry calibration that this hypothesis
        deliberately does not touch. The toy ladder spans roughly one decade in Y
        and the p^{o(1)} factors are of the same order as the effect at those
        sizes; a measured 1.5 is consistent with an asymptotic 3/2 and does not
        establish it.
      nearby_object_control: >-
        TWO, both cheap and both required.
        (i) THE PAPER'S OWN SAFE LIST. The frozen paper names CSIDH and all
        group-action constructions as explicitly safe, and those are built on
        F_p-RATIONAL curves -- which are exactly the Y = 1 level set of this
        family. So the safe list and the anchor are the same object seen from two
        sides, and the hypothesis must explain why a density of p^{-1/2} at
        Y = 1 makes those schemes safe rather than the reverse. If the family
        cannot recover the paper's own affected/safe split, it has not identified
        the load-bearing structure.
        (ii) THE SMALL-CM SUB-POPULATION at j = 0 and j = 1728, where the class
        number of the orienting order is minimal and the hoped-for genericity
        FAILS by construction. A density law that returns the same exponent on a
        population selected for anomalous class number is responding to the size
        of the ball rather than to the arithmetic, and that is a direct
        falsification of the mechanism even if the global fit succeeds.
    proof_obligations:
    - claim: >-
        The trace-normalisation in step (1) is valid, including any parity or
        factor-of-2 condition, so that degree-d isogenies to the conjugate
        correspond to embeddings of Z[sqrt(-pd)] and not of an index-2 relative.
      responsibility: correctness
    - claim: >-
        Eichler's optimal-embedding count applies with local factors that are
        p^{o(1)} AND INDEPENDENT OF d over d <= p^{1/3}. A d-dependent local
        factor carrying a power of d changes the exponent 3/2 outright.
      responsibility: correctness
    - claim: >-
        Siegel's h(-D) = D^{1/2+o(1)} is used only for an exponent, and the
        ineffectiveness of its constant is carried into every downstream
        statement rather than dropped.
      responsibility: strictness
    - claim: >-
        The matching LOWER bound on rho_p is NOT PROVED. The counting route gives
        an upper bound; the lower bound needs the multiplicity to be controlled.
      responsibility: feasibility
    - claim: >-
        Lemma 3.4 survives (p/2)^{1/3} -> Y, verified on the single display where
        the bound is used.
      responsibility: correctness
    - claim: >-
        The enumeration's delta is the true minimum and not merely the minimum
        over the primes used; the degree ceiling's smoothness is checked per
        prime and recorded.
      responsibility: interface
    - claim: >-
        Nothing here transfers to cryptographic scale, and every citation of a
        measured number carries the toy boundary explicitly.
      responsibility: scope
    - claim: >-
        The enumeration is exhaustive over S_p and each curve is visited exactly
        once; the count #S_p is checked against p/12 + O(1) with the exact
        correction term for p mod 12.
      responsibility: correctness
    not_applicable_reason: null

  rerandomization: >-
    INHERITED, NOT PROPOSED. The family relies on Algorithm 3's re-randomising
    non-backtracking 2-isogeny walk of length n = O(log p) to make rho_p, a
    POPULATION density, the correct per-attempt success probability. The frozen
    paper cites [37] and [6, Lemma 14] for the mixing bound; NEITHER IS READ. The
    dependence is stated rather than assumed away: if the walk does not mix to
    within the required distance, the per-attempt probability is a local rather
    than a population quantity and the whole family's cost analysis is a
    statement about a different measure. This is the same load-bearing role the
    quantifier audit above identifies for Theorem 1.1's universal quantifier.

  asymptotic_claim: >-
    TIME * MEMORY^{1/2} = p^{1/2 + o(1)} along the Y-family, with endpoints
    (p^{1/2+o(1)}, p^{o(1)}) and (p^{1/3+o(1)}, p^{1/3+o(1)}). This is stated as
    a DERIVATION conditional on the density law (H-A), and it MOVES NO EXPONENT:
    it coincides with the interpolation the frozen paper already states. Its
    content is that the curve is derivable from an arithmetic density rather than
    postulated from a generic claw-search cost, and that the corner's location is
    therefore attributable. Promotion of this claim toward `supported` requires
    the four gates in agents/coordinator.md, of which the archived proof
    decomposition and the concrete-cost table are partially addressed here and
    the independent breakthrough-tier review is NOT AVAILABLE in this harness;
    no promotion is requested.

  heuristic_assumptions:
  - id: HW-1
    formal_statement: >-
      (Siegel) For discriminants -D < 0, h(-D) = D^{1/2 + o(1)} as D -> infinity;
      used as h(-4pd) = (pd)^{1/2+o(1)} for 1 <= d <= p^{1/3}. For non-fundamental
      discriminants the conductor factor f * prod_{l | f} (1 - chi(l)/l) is
      absorbed into the p^{o(1)}, which is legitimate only because f <= p^{1/6}
      in the range used.
    random_model_justification: >-
      This is a theorem, not a random model, but its constant is INEFFECTIVE,
      which is why it appears here rather than as background: it licenses an
      exponent and nothing finer, and it cannot be turned into a bound at a
      specific p. RECALLED, UNVERIFIED -- no theorem number, page or venue is
      asserted anywhere in this record.
    supporting_results: []
    validation_experiment_ids: [EXP-WESO-f5166c]
    falsification_condition: >-
      Direct computation at the ladder primes: count reduced binary quadratic
      forms of discriminant -4pd for every d <= C_p and check
      SUM_{d<=Y} h(-4pd) against (2/3) Y^{3/2} p^{1/2} within the declared
      tolerance. If the measured sum has exponent materially different from 3/2
      in Y, HW-1 or its conductor absorption fails at the tested sizes and the
      density derivation must be redone before any curve is enumerated. THIS IS A
      PURE INTEGER COMPUTATION AND IT PRECEDES ALL CURVE WORK.
  - id: HW-2
    formal_statement: >-
      (Eichler / Deuring) The number of supersingular E/F_{p^2} admitting an
      isogeny of degree exactly d to E^{(p)}, counted with the natural weights,
      equals h(-4pd) up to a factor that is p^{o(1)} and INDEPENDENT OF d over
      1 <= d <= p^{1/3}.
    random_model_justification: >-
      RECALLED, UNVERIFIED, AND THE WEAKEST LINK IN THE MECHANISM, stated as a
      hazard rather than softened into a caveat. The part that is derived here is
      the correspondence theta^2 = -pd; the COUNTING statement needs Eichler's
      optimal-embedding theorem with its local factors at p and at each prime
      dividing d, and "up to p^{o(1)} independent of d" is exactly what those
      local factors could violate. If a local factor carries a power of d, the
      exponent is not 3/2 and the hypothesis is wrong in its principal assertion.
    supporting_results: []
