# H-ECDLP-18c7f7
# Stage-0 square-bias worksheet for IDEA-20261006-30b5f6.
# One prime at most 120. Not a discrete logarithm.
hypothesis:
  id: H-ECDLP-18c7f7
  question_id: RQ-ECDLP-623a32
  goal_id: GOAL-ECDLP-001
  source_idea: IDEA-20261006-30b5f6
  added: '2026-10-12'
  status: specified
  statement: >-
    On y^2 = x^3 + 6x + 2, at the smallest prime p from 23 through 120
    with at least 24 affine points of nonzero y, the absolute deviation
    of the nonzero-square rate of x(P+Q) x(P-Q) - x(P) x(Q) is strictly
    above order statistic 285 of 300 x-shuffles. Q is the lexicographic
    first eligible point.
  test_boundary: >-
    One curve and one prime in that window. The lex-second point is
    recorded and does not set the cutoff. No walk and no factor base
    are inside this boundary.
  mechanism: >-
    The tracked object is one field element built from four
    x-coordinates. The null keeps the addition graph and permutes those
    x-coordinates. Beating rank 285, and falling at or below it, are
    the two finished readings.
  distinguishable_outcomes:
    - >-
      A prime and a nonempty sample are found, the points lie on the
      curve, and the absolute numerator is strictly above rank 285.
    - >-
      A prime and a nonempty sample are found, the points lie on the
      curve, and the absolute numerator is at most rank 285.
    - >-
      No prime qualifies, the sample is empty, or a planted check
      fails. That outcome invalidates the run.
  falsification: >-
    The worksheet is valid and the absolute numerator is at most
    shuffle rank 285.
  not_claimed: >-
    No change to the generic exponent 1/2, no sum-compatible bucket
    index, and no security level.
