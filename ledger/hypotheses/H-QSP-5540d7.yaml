hypothesis:
  id: H-QSP-5540d7
  question_id: RQ-QSP-f9bbdb
  source_proposal: IDEA-20260916-5c9d6e
  added: '2026-09-17'
  proposed_by: coordinator
  statement: >-
    SETTING. K = F_{p^n}, sigma the p-Frobenius. For f in K[X] write f^{(k)}
    for f with every coefficient raised to the p^k-th power, so that
    f(z)^{p^k} = f^{(k)}(z^{p^k}) for every z in the algebraic closure
    (Frobenius is a ring homomorphism). Let lambda in K[X] have degree
    d >= 1, L = X^{p^{n'}} - lambda(X), and n = q n' + r with 0 <= r < n'
    (so q >= 1 whenever n' < n). N_K(L) denotes the number of DISTINCT roots
    of L in K. Define the twisted iterates Lambda_1 = lambda and
    Lambda_{k+1} = Lambda_k^{(n')} o lambda, of degree d^{k+1}.
    (A) THE TWISTED INJECTION BOUND, DERIVATION TIER. For every root x of L
    in the closure, x^{p^{(k+1)n'}} = Lambda_{k+1}(x) for every k >= 0:
    x^{p^{(k+1)n'}} = (x^{p^{kn'}})^{p^{n'}} = Lambda_k(x)^{p^{n'}} =
    Lambda_k^{(n')}(x^{p^{n'}}) = Lambda_k^{(n')}(lambda(x)) =
    Lambda_{k+1}(x). If moreover x in K then x^{p^n} = x, and since
    (q+1) n' = n + (n' - r), x^{p^{n'(q+1)}} = (x^{p^n})^{p^{n'-r}} =
    x^{p^{n'-r}}. Hence every K-root of L is a root of the DIFFERENCE
    POLYNOMIAL D(Y) := Lambda_{q+1}(Y) - Y^{p^{n'-r}}, and
        N_K(L) <= deg D <= max(d^{q+1}, p^{n'-r})   whenever D != 0.
    (No injection is needed in this form: x itself is the root of D. The
    proposal's form via y = x^{p^r} and H(Y) = Y^{p^{n'-r}} -
    lambda(Lambda_q^{(r)}(Y)) gives the weaker sum bound d^{q+1} +
    p^{n'-r}; for lambda in F_p[X] the twists are trivial, Lambda_{q+1} =
    lambda^{o(q+1)}, and D and H coincide up to sign, which is the F_2 form
    recorded in CORR-20260916-8d0b81.)
    THE DEGENERATE CASE. D = 0 requires d^{q+1} = p^{n'-r}, i.e. d = p^j
    with j(q+1) = n' - r (so j >= 1 because r < n'), AND Lambda_{q+1} equal
    to the monomial Y^{p^{n'-r}} exactly. A composition f o g of polynomials
    over a field equals a monomial Y^m only if g = c Y^e + b and f = c'
    (Y - b)^{m/e} (every root a of f forces g - a to have 0 as its only
    root, so f has one root); applied along the chain this forces lambda =
    c X^{p^j} + b, hence L = X^{p^{n'}} - c X^{p^j} - b = M^{p^j} with
    M = X^{p^{n'-j}} - c' X - b' (c' = c^{p^{-j}}, b' = b^{p^{-j}}). Then
    N_K(L) = N_K(M) <= p^{n'-j} < p^{n'}: the degenerate case is a
    p^j-th power of an affine binomial of subfield or multiplicative type
    (Appendix C.2 of KN-LIT-0a321c; Proposition 6 of KN-LIT-4fe9d2), it
    never splits completely as a SET of distinct roots, and it is excluded
    from (A) by hypothesis and covered separately by the trivial bound
    N_K(M) <= deg M. For d not a power of p the degenerate case cannot
    occur.
    (B) THE BETA COROLLARY. Let r >= 1 and suppose L splits completely in
    K as a set, N_K(L) = p^{n'}. Then L is non-degenerate (the degenerate
    case has N < p^{n'}), so p^{n'} <= max(d^{q+1}, p^{n'-r}); since
    p^{n'-r} < p^{n'} for r >= 1 this forces d^{q+1} >= p^{n'}, i.e. with
    l := log_p d, (q+1) l >= n' EXACTLY. Since (q+1) n' = n + n' - r,
        beta := l n / n'^2 >= n / ((q+1) n') = n / (n + n' - r) > 1/2,
    for every n' not dividing n. This is the EXACT corollary of the max
    form. The proposal's conservative form, beta >= n (n' - 1) / (n' (n +
    n' - r)) (from d^{q+1} >= p^{n'} - p^{n'-r} >= p^{n'-1}), is implied by
    it and is retained as the fallback threshold that survives if the max
    form fails while the sum form d^{q+1} + p^{n'-r} holds. Approximate
    splitting: if N_K(L) >= p^{n'}/c with c < p^r then d^{q+1} >= p^{n'}/c
    and beta >= n (n' - log_p c) / (n' (n + n' - r)). At n = 131 (prime, so
    every n' in 2..130 fails to divide n): beta >= 131/(131 + n' - r) >=
    131/260 = 0.504 at every n', and >= 131/132 = 0.992 at the ten n' with
    131 = -1 mod n' (n' in {2, 3, 4, 6, 11, 12, 22, 33, 44, 66}, r = n' -
    1). The premise (4) of RQ-QSP-f9bbdb that 131 = -1 mod n' is the best
    case is inverted: it is the worst.
    (C) RELATION TO THE PUBLISHED BOUNDS. Lemma 4.1 of KN-LIT-0a321c
    (q l + r >= n' for a QSP) and (A) ((q+1) l >= n' for complete
    splitting) are incomparable, (A) stronger iff l < r, and combine to
    q l + min(l, r) >= n'. Theorem 1 of KN-LIT-4fe9d2 (beta >= 3/4) is for
    linearized lambda with any n'; (B) is for any lambda with n' not
    dividing n. (A) is attained with equality on Theorem 1's equality case
    X^{p^2} + X^p + X over F_{p^3} (n = 3, n' = 2, d = p, q = r = 1:
    max(p^2, p) = p^2 = N; beta = 3/4 = 3/(3 + 2 - 1)) and on Type 2 at
    n = 7 (n' = 3, lambda = X^2 + X, d = 2, q = 2, r = 1: max(8, 4) = 8 =
    N; beta = 7/9 = 7/(7 + 3 - 1)); it is consistent with Type 2 at n = 31
    (n' = 15, d = 2^7, q = 2, r = 1: 2^21 >= 2^15) and with X^8 - X^3 over
    F_{2^4} (beta = 0.70 >= 4/(4 + 3 - 1) = 0.667). Section 5 of
    KN-LIT-0a321c asks whether Lemma 4.1 is tight and notes that removing
    the n mod n' term would show the approach cannot beat generic
    algorithms; (B) is that removal by a complementary bound, not by
    sharpening Lemma 4.1.
    (D) GENERALISATIONS, PRICED. (i) lambda in K[X]: covered by (A) as
    stated (the twists change no degree). (ii) Rational lambda = a/b, a, b
    in K[X] coprime, d = max(deg a, deg b): CONJECTURE, same route, with
    the count of x in K satisfying x^{p^{n'}} b(x) = a(x) bounded by
    d^{q+1} + p^{n'-r} + q d^q (the last term for points that meet a pole
    along the chain); the pole bookkeeping is not written out here and the
    extension is stated as a conjecture with the verification route of
    Stage 4 of EXP-QSP-33b442. (iii) Isogeny-L (Section 5 of KN-LIT-0a321c
    citing its [20], RECALLED, not read): a correspondence of bidegree
    (d, deg psi) between x and sigma^{n'} x falls under the correspondence
    form of (A) recorded in IDEA-20260916-a17f43; when it is an
    endomorphism relation the factor base is a subgroup of E(K) and on
    ECC2K-130 (|E(K)| = 4 * prime, KN-LIT-661e97) has order <= 4 or >= the
    prime. (iv) Double-large-prime, unsymmetrised and unbalanced variants
    change the relation bookkeeping, not the factor base; (A) applies
    unchanged. (v) (A) holds for every p and every n; the only escape is
    n' | n.
    (E) THE CLOSURE, CONDITIONAL. Under the cost model of Theorem 3.2 of
    KN-LIT-0a321c / Proposition 8 of KN-LIT-4fe9d2 (heuristic H1 below),
    no factor base of the form {x in K : x^{p^{n'}} = lambda(x)} with
    lambda polynomial and n' not dividing n beats generic algorithms, at
    any p, n, n': the required beta < 1/(2 kappa) is unreachable because
    beta > 1/2 forces kappa < 1, five times below Rojas' 4.876. At n = 131
    the Proposition 8 exponent at the bound is >= 0.898 (2^117.7) at every
    n' against rho's 2^60.9 (KN-LIT-096). Named obstruction: the K-rational
    fibre of the quasi-subfield relaxation is bounded by the degree of the
    difference polynomial D. Forward guidance: what survives is n' | n
    (Diem's subfield family; at n = 131 only n' in {1, 131}), correspondence
    shapes of conjugate degree >= 2 (IDEA-20260916-a17f43), and factor
    bases that are not root sets of a single X^{p^{n'}} - lambda. NO ATTACK,
    NO EXPONENT, NO STATEMENT ABOUT DEPLOYED CURVES.
  mechanism: >-
    OBJECT FRAME. Representation: the x-coordinate in F_{p^n} together with
    its Frobenius conjugates x^{p^{kn'}} (R1 class). Operation set Sigma =
    {sigma^{n'}, substitution by lambda}, the two generators of the chain
    map phi of KN-LIT-0a321c Section 3.1. Attack stage: factor-base
    membership. Trichotomy: the priced quantity is coordinate-dependent
    (Class III) -- a property of the field representation's Frobenius, not
    of any group element -- and the algorithm it prices is Class I
    partial-action index calculus.
    LOSSY-PROJECTION TEST AGAINST SIGMA. The quasi-subfield algorithm's
    object is K[X]/(L), the projection of K[X]/(X^{p^n} - X) that forgets
    every root outside V. Sigma-compatible: sigma^{n'} acts on K[X]/(L) as
    phi, the identity f^{p^{n'}} = phi(f) mod L the paper proves. Lossy: it
    keeps only |V| of the p^n points. (A) says the projection is lossy in
    the wrong direction -- its K-rational content is at most
    max(d^{q+1}, p^{n'-r}) points -- unless the projection is a subfield
    (r = 0), in which case it is Diem's object and the bound is vacuous. No
    new object is proposed; the record prices the membership fibre of the
    existing one, and the successor object is IDEA-20260916-a17f43.
    WHY THE PROOF IS THREE LINES AND WHY THAT IS THE POINT. Appendix A.2 of
    KN-LIT-0a321c already contains x^{p^{kn'}} = lambda^{ok}(x) for
    lambda over F_p and applies sigma^r on the RIGHT to reach a polynomial
    G of degree d^q p^r; the only additions are (i) the coefficient twist
    that makes the identity hold for lambda in K[X], and (ii) running the
    chain one step FURTHER, to k = q + 1, where (q+1) n' = n + (n' - r)
    lets x in K collapse the left side to x^{p^{n'-r}} -- tiny exactly when
    r is close to n', the regime the paper identified as the attacker's
    best case. Comparing degrees does the rest.
    WHY IT CANNOT PROVE TOO MUCH. At r = 0 the bound reads N <= max(d^{q+1},
    p^{n'}) >= deg L and is vacuous, so subfield polynomials (d = 1, N =
    p^{n'}) are untouched; Type 1, Type 1bis and Type 2 all satisfy the
    bound with room or with equality; the multiplicative example satisfies
    it; the degenerate case is exactly the p^j-th powers of subfield-type
    binomials and is excluded rather than bounded. These are the
    proves-too-much controls; EXP-QSP-33b442 runs them numerically through
    the same instrument that produces every other count.
    STAGES (full detail in the contract). Stage 0: hand re-derivation of
    (A) in the twisted form, the degenerate case, and the symbolic slices
    of baseline_embedding and method_ceiling, archived as a derivation
    note. Stage 1: exhaustive F_2 fixtures at five toy cells with three
    independent counting instruments required to agree, plus the seeded
    K-coefficient fixture. Stage 2: the complete-splitting sweep at prime
    n <= 31 with every complete splitter checked against (B). Stage 3: the
    n = 131 census at n' in {33, 44, 66} with an explicit root-list
    certificate per candidate. Stage 4: the rational-lambda conjecture
    check. Stage 5: the report with the closure block.
  assumptions:
    - >-
      d >= 1 and D != 0 (non-degenerate). The degenerate case is fully
      characterised in the statement and is handled separately; it never
      splits completely as a set.
    - >-
      N_K(L) counts DISTINCT roots. When lambda' = 0 (lambda a p-th power,
      e.g. a square at p = 2) L has repeated roots; the distinct-root count
      is what bounds |F| and is what is bounded. Square lambda are reported
      separately in the census with the n' - 1 reduction noted.
    - >-
      'Beats generic algorithms' means alpha_beta > 1 in Proposition 8 of
      KN-LIT-4fe9d2 with kappa the exponent of the solver; the closure (E)
      is a closure UNDER THAT COST MODEL (H1) and is stated as such. A
      solver model in which the cost does not grow with d is not excluded by
      (E); it is constrained by (A) directly, which bounds |F| and needs no
      cost model.
    - >-
      p = 2 in every numerical cell; the derivation is for every p, and the
      transfer from p = 2 to general p is by the derivation, not by
      measurement.
    - >-
      OFF-LIMITS COMPONENTS DECLARED: F2 (factor-base decomposition) is the
      algorithm priced; the Frobenius-orbit reduction (RQ-FROB-7d8dd4)
      appears only inside the quoted table rows of
      analysis/qsp-ecc2k130/table.md; F6 (endomorphism orbit) appears in
      (D)(iii) only as the reason an endomorphism-defined factor base is a
      subgroup.
  proof_search_map:
    bottleneck: >-
      Lemma 4.1's dependence on n mod n', which left the r = n' - 1 cells at
      n = 131 (131 = -1 mod n', n' in {33, 44, 66}) open with beta as low as
      0.03 on paper. Removing it moves the QSP line at prime n from 'open at
      three cells' to 'closed under the paper's cost model at every n' not
      dividing n'. The decision it changes: whether RQ-QSP-f9bbdb's
      decision target (a) (an existence result at n' = 33) can be pursued
      for ANY coefficient field, or is void.
    baseline_embedding:
      parameter_slice: >-
        (i) Lemma 4.1 of KN-LIT-0a321c is the slice of the same chain
        identity where sigma^r is applied on the right at step q; (A) runs
        the chain to step q + 1 and applies x^{p^n} = x on the left. The two
        are incomparable and combine to q l + min(l, r) >= n'. (ii) Theorem
        1's equality case (X^{p^2} + X^p + X over F_{p^3}) and Type 2 at
        n = 7 are the tightness slices: (B) must give exactly 3/4 and 7/9
        there, and does. (iii) r = 0 is the vacuity slice: the bound is
        max(d^{q+1}, p^{n'}) >= deg L. (iv) The F_p-coefficient case is the
        slice already verified by the Coordinator session in
        CORR-20260916-8d0b81 and numerically audited in
        analysis/qsp-ecc2k130/explore/ (analysis, not evidence).
      reproduction_check: >-
        Symbolic on (i)-(iv), zero compute, archived as the Stage 0
        derivation note of EXP-QSP-33b442; then the frozen numerical
        fixtures of that contract: the exhaustive F_2 sweep at (n, n') in
        {(11, 6), (13, 7), (7, 3), (11, 4), (13, 5)} for every lambda of
        degree 2..7 (252 per cell, 1260 candidates) with brute field
        enumeration, deg gcd(X^{2^n} - X, L), and the D-root count with the
        closing test all required to agree exactly and to satisfy N <=
        max(d^{q+1}, 2^{n'-r}); the K-coefficient fixture at n = 11 (n' =
        6) and n = 13 (n' = 7), seed 20260917; and the four forced fixtures
        (subfield (12, 6, X) = 64; Type 2 at n = 7 = 8 and n = 31 = 32768;
        Theorem 1 equality X^4 + X^2 + X over F_8 = 4).
    observation_collision:
      observable: >-
        The bound max(d^{q+1}, p^{n'-r}) on N_K(L), and the corollary
        beta >= n/(n + n' - r) for every completely splitting L with
        r >= 1.
      distinct_preimage_search: >-
        Two shapes with the same (n, n', d) and different N exist trivially
        (most lambda give N in {0, 1, 2}; a Type 2 lambda gives p^{n'}); the
        bound is an upper bound and does not identify N, and does not claim
        to. The collision that WOULD matter is a completely splitting L with
        r >= 1 and d^{q+1} < p^{n'} (or, for the fallback threshold, d^{q+1}
        < p^{n'} - p^{n'-r}). The record predicts none exists; Stage 2 of
        EXP-QSP-33b442 searches every prime n <= 31, n' <= 15, d <= 8 over
        F_2 for one, and Stage 3 searches the n = 131 cells. The other
        informative collision is a root of D that is NOT a root of L (the
        'slack' of the bound); it is counted and reported per candidate
        because a large slack at small n calibrates how loose (A) is.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Track the full Frobenius chain x, x^{p^{n'}}, ..., x^{p^{(q+1)n'}}
          rather than x alone: the extra step past q is what makes the
          K-rationality condition a low-degree polynomial relation (degree
          p^{n'-r}) instead of a degree-p^n one.
        predicted_gain: >-
          Replaces the degree comparison of Lemma 4.1 (d^q p^r vs p^{n'}) by
          the comparison max(d^{q+1}, p^{n'-r}) vs p^{n'}, which is strong
          exactly where Lemma 4.1 is weak (r close to n').
      - transform: observable_fiber
        proposed_object: >-
          Hold N = p^{n'} fixed and vary r: the fibre is {r = 0} union
          {r >= 1, d >= p^{n'/(q+1)}}; the separating invariant is
          divisibility n' | n.
        predicted_gain: >-
          Converts the paper's question 'does a small-d QSP exist at some
          exceptional (q, n)' into 'only at n' | n, up to the beta > 1/2
          floor'.
    quantifier_order: >-
      FORALL p, n, n' with n' not dividing n, FORALL lambda in F_{p^n}[X] of
      degree d >= 1 with D != 0: N_K(L) <= max(d^{q+1}, p^{n'-r}). The
      polynomial D depends only on (lambda, n, n'), never on an instance or
      a seed. Consequently FORALL completely splitting such L (r >= 1):
      (q+1) l >= n' and beta >= n/(n + n' - r). The degenerate lambda (D =
      0) satisfy N_K(L) <= p^{n'-j} < p^{n'} by a separate argument. The
      closure (E) is claimed only for the shapes enumerated in (D) and only
      under H1. The weaker reading 'for each lambda there exists some bound'
      is not what is claimed.
    method_ceiling:
      strongest_certifiable_claim: >-
        'Under the cost model of Theorem 3.2 / Proposition 8 (H1), no factor
        base of the form {x : x^{p^{n'}} = lambda(x)} (lambda polynomial in
        F_{p^n}[X], or rational subject to the pole bookkeeping of (D)(ii))
        with n' not dividing n beats generic algorithms, for any p, n, n'.'
        It cannot certify anything about n' | n, about factor bases that are
        not such root sets, about a solver whose cost is independent of d,
        or about the isogeny-L reading if [20] means something other than
        the two forms in (D)(iii).
      nearby_object_control: >-
        (i) n' | n, where the conclusion is KNOWN FALSE (Diem's subfield
        family): the argument must and does become vacuous; run
        numerically as the (12, 6, X) fixture, forced 64. (ii) Type 2 at
        n = 127 (the nearby object of RQ-QSP-f9bbdb, where a published QSP
        family exists with beta = 1 - 2^5/63^2 = 0.992): the bound must
        admit it -- n' = 63, q = 2, r = 1, d = 2^31: d^3 = 2^93 >= 2^63,
        admitted, and beta = 0.992 >= 127/(127 + 63 - 1) = 0.672,
        consistent; run numerically at the executable analogue n = 31 (Type
        2 at n' = 15, forced 32768). (iii) n = 129 = 3 * 43: n' = 43
        divides n, the subfield F_{2^43} exists and the bound is vacuous
        there, correctly; at n' = 33 (129 = 3 * 33 + 30, r = 30) the bound
        bites: N <= max(d^4, 8).
    proof_obligations:
      - claim: f(z)^{p^k} = f^{(k)}(z^{p^k}) for f in F_{p^n}[X] and z in the closure.
        responsibility: correctness
      - claim: x^{p^{(k+1)n'}} = Lambda_{k+1}(x) for every root x of L and every k >= 0.
        responsibility: correctness
      - claim: >-
          x in K and (q+1) n' = n + n' - r imply x^{p^{n'(q+1)}} =
          x^{p^{n'-r}}; hence every K-root of L is a root of D.
        responsibility: correctness
      - claim: >-
          deg D <= max(d^{q+1}, p^{n'-r}); D = 0 only in the degenerate case
          d = p^j, j(q+1) = n' - r, lambda = c X^{p^j} + b, where L = M^{p^j}
          with deg M = p^{n'-j} and N_K(L) <= p^{n'-j} < p^{n'}.
        responsibility: size
      - claim: >-
          Complete splitting with r >= 1 forces d^{q+1} >= p^{n'}, hence
          (q+1) l >= n' and beta >= n/(n + n' - r) exactly (and a fortiori
          beta >= n (n' - 1)/(n' (n + n' - r))).
        responsibility: strictness
      - claim: The bound is attained on Theorem 1's equality case and on Type 2 at n = 7.
        responsibility: baseline
      - claim: >-
          The bound is vacuous at r = 0 and admits Types 1, 1bis, 2 and the
          multiplicative example X^8 - X^3 over F_{2^4}.
        responsibility: scope
      - claim: >-
          The rational-lambda extension's pole bookkeeping is written out as
          a derivation note or the extension is recorded as withdrawn.
        responsibility: feasibility
      - claim: >-
          The closure (E) rests on H1 and on nothing else beyond (A) and (B);
          the interface between |F| and cost is Proposition 8, cited, not
          re-derived.
        responsibility: interface
    not_applicable_reason: null
  rerandomization: null
  # asymptotic_claim is filled to state explicitly that NO complexity
  # improvement is claimed; claim_kind is null because none of the three
  # kinds applies (the record bounds a factor-base size, it improves no cost).
  asymptotic_claim:
    problem: >-
      NONE IMPROVED. The record bounds the K-rational root count of
      X^{p^{n'}} - lambda(X) and, through it, the admissible quality beta of
      any quasi-subfield factor base with n' not dividing n. It is a
      structural bound about the ECDLP index-calculus line of KN-LIT-0a321c,
      not an ECDLP algorithm.
    prior_best: >-
      For the bound: Lemma 4.1 / Lemma C.2 of KN-LIT-0a321c (q l + r >= n')
      and Theorem 1 of KN-LIT-4fe9d2 (beta >= 3/4, linearized lambda only).
      For the ECDLP on ECC2K-130: rho at 2^60.9 iterations (KN-LIT-096),
      unaffected.
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED. The admissible beta at n = 131
      moves from '0.03-0.19 at the open cells' to '>= 0.992 at those cells
      and >= 0.504 everywhere'; under H1 the Proposition 8 exponent is
      >= 0.898 at every n', i.e. >= 2^117.7 against rho's 2^60.9.
    memory_exponent: not applicable to the bound; the numerical cells run in megabytes.
    hidden_cofactor: >-
      Two disclosures. (1) The closure's 'cannot beat generic' is relative
      to the Proposition 8 cost model (H1). (2) The rational-lambda and
      isogeny-L items in (D) are conjectural extensions with stated
      verification routes, not derived here.
    claim_kind: null
  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        (Scope of the closure (E), not of the theorem (A)/(B).) For the
        chain system S of KN-LIT-0a321c Section 3.1 at parameters (n, n',
        d, m), the cost of one decomposition attempt is at least M(E) =
        2^{m(m-1)} d^{m(m-1)/2} field operations, uniformly in the instance;
        equivalently the total cost is governed by Proposition 8 of
        KN-LIT-4fe9d2 with some kappa >= 1, so that a factor base with
        beta > 1/2 cannot be compensated by a cheap solver.
      random_model_justification: >-
        Rigorous ingredient: the univariate eliminant h of Lemma 3.1 of
        KN-LIT-0a321c has degree M(E) (Appendix A.1, lambda_k = d^{k-1}
        2^{m-1}, product 2^{m(m-1)} d^{m(m-1)/2}), and root-finding a
        polynomial of degree M(E) costs at least M(E) operations. Classical
        statement imitated: the BKK / mixed-volume count is generically
        attained by systems with the given supports, so the eliminant does
        not collapse for a generic instance. NEEDED ONLY for (E); (A) and
        (B) are unconditional.
      supporting_results:
        - >-
          KN-LIT-0a321c Appendix A.1 (degree of the eliminant; provenance
          retrieved, read by the idea-generator in TASK-20260916-a93a2a and
          re-checked against the frozen text by the Coordinator session that
          wrote CORR-20260916-8d0b81) and Proposition 8 of KN-LIT-4fe9d2
          (retrieved, same session). The generic-attainment statement is
          RECALLED and supports nothing by itself.
      validation_experiment_ids: []
      falsification_condition: >-
        A measured per-attempt decomposition at an executable cell (n, m,
        d) whose univariate degree or solution count over the closure is
        below M(E) by a factor that grows with d, i.e. a solver whose cost
        does not grow like d^{m(m-1)/2}. Validation route (scheduled, not
        yet designed): IDEA-20260916-b84e2d -- SAMPLE (n, m, d) in {17, 23,
        29, 41} x {2, 3, 4} x {2, 3}; COMPARISON of measured univariate
        degree / solution count against 2^{m(m-1)} d^{m(m-1)/2}; TAIL the
        cell with the largest deficit; TRANSFER none to n = 131. Its
        engine impediment (no Groebner / resultant engine in the container,
        analysis/qsp-ecc2k130/explore/README.md) is recorded there and must
        be resolved before that experiment is designed. Until H1 is
        validated, (E) stays conditional whatever EXP-QSP-33b442 returns.
    - id: H2
      formal_statement: >-
        (Null-object model, used only for the tail check of the n = 131
        census and the K-coefficient fixture; not load-bearing for (A) or
        (B).) For lambda drawn uniformly from polynomials of degree d over
        F_2 (or over F_{2^n}), the number of Frobenius orbits of F_{2^n}-
        roots of L of size n is approximately Poisson with mean 1/n, and the
        number of roots in F_2 is Binomial(2, 1/2); over C candidates the
        number of orbit-carrying candidates is approximately Poisson(C/n).
      random_model_justification: >-
        Rigorous ingredient: (A) holds for every lambda, random or
        structured, so the null and the structured arm live under the same
        ceiling. Classical statement imitated: the expected number of
        irreducible factors of degree k of a uniformly random polynomial of
        degree >= k over F_q is about 1/k (RECALLED, Flajolet-Gourdon-
        Panario style statistics; not opened by this program).
      supporting_results:
        - >-
          None retrieved. The recalled statistic supports the design of the
          control only; the control's outcome is measured directly in
          EXP-QSP-33b442 (K-coefficient fixture histogram and the n = 131
          orbit count).
      validation_experiment_ids:
        - EXP-QSP-33b442
      falsification_condition: >-
        An orbit-carrying-candidate count at some n = 131 cell (244
        candidates, mean 1.86) or at a K-coefficient fixture cell whose
        upper-tail Poisson probability is below 0.01. That refutes the null
        MODEL at that cell and is reported as an unexpected observation
        (AGENTS.md rule 8); it does not bear on (A), whose ceiling holds
        regardless, and it is not evidence of a large factor base (N stays
        <= d^{q+1}).
