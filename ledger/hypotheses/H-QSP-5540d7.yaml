  reduction_chain:
    core_problem: >-
      Bounding the K-rational root count N_K(L) of L = X^{p^{n'}} -
      lambda(X) for n' not dividing n (claim (A)).
    corollaries:
      - problem: >-
          The admissible quality beta of every completely splitting
          quasi-subfield polynomial with n' not dividing n (claim (B)):
          beta >= n/(n + n' - r) > 1/2.
        reduction_ref: internal, one line from (A) by comparing p^{n'} with max(d^{q+1}, p^{n'-r})
        asymptotics_preserved: not applicable (exact inequality, no asymptotics)
      - problem: >-
          The Proposition 8 cost of the quasi-subfield algorithm at any
          (p, n, n') with n' not dividing n, under H1 (closure (E)).
        reduction_ref: KN-LIT-4fe9d2 Proposition 8 (retrieved), alpha_beta = 1/(2 kappa beta)
        asymptotics_preserved: >-
          Conditional on H1; the exponent max(2 alpha_beta/m, 1 -
          alpha_beta(1/2 - 1/m)) is evaluated at integer m for n = 131 and
          reported as arithmetic on (B), never as a measurement.
  predictions:
    - metric: >-
        M1 -- per cell (n, n', d), max over lambda of N_K(L) / max(d^{q+1},
        2^{n'-r}) with the attaining lambda, over the Stage 1 exhaustive F_2
        cells, the K-coefficient fixture cells, and the Stage 3 n = 131
        cells (degenerate lambda excluded and listed separately)
      direction: lower
      minimum_effect: >-
        <= 1 for every lambda at every cell (the bound holds); EQUAL to 1 at
        (7, 3) (attained by X^2 + X and X^2 + X + 1 with N = 8) and at
        (7, 4) for the d = 4 complete splitters (N = 16); predicted values
        elsewhere: <= 0.52 at (11, 6), <= 0.56 at (13, 7), <= 0.25 at
        (11, 4) and (13, 5) (pre-registered from the audit; the run must
        reproduce them from scratch). A single lambda with ratio > 1
        falsifies (A).
    - metric: >-
        M2 -- the instrument agreement matrix: number of Stage 1 candidates
        (5 cells x 252 lambda = 1260) on which brute field enumeration,
        deg gcd(X^{2^n} - X, L), and the D-root count with the closing test
        do not all return the same N
      direction: different
      minimum_effect: >-
        EXACTLY 0 mismatches. A single mismatch invalidates the run (not the
        hypothesis) until localised by hand.
    - metric: >-
        M3 -- for every completely splitting L (N = 2^{n'}) found in the
        Stage 2 sweep (prime n in {7, ..., 31}, n' <= 15, n' not dividing n,
        2 <= d <= min(8, 2^{n'} - 1), lambda in F_2[X]): beta - n/(n + n' -
        r), and beta - n(n' - 1)/(n'(n + n' - r))
      direction: higher
      minimum_effect: >-
        >= 0 for every complete splitter on the EXACT corollary (and a
        fortiori on the conservative one); equal to 0 at (7, 3) (beta = 7/9)
        and at (7, 4) (beta = 7/8, d = 4). Pre-registered from the audit:
        complete splittings occur only at (n, n') in {(7, 3), (7, 4),
        (31, 5), (31, 6)} with 65 complete splitters in total. A complete
        splitter with beta below the exact corollary falsifies (B) as
        stated; if it nonetheless satisfies the conservative form, the max
        form of (A) is wrong somewhere and the hypothesis is WEAKENED to the
        sum form d^{q+1} + p^{n'-r}, not rejected.
    - metric: >-
        M4 -- n = 131 census: per candidate (every non-linearized lambda in
        F_2[X] of degree 3..7, 244 per n', at n' in {33, 44, 66}) the exact
        N_K(L) with its explicit root list, orbit count and slack
      direction: lower
      minimum_effect: >-
        N <= d^{q+1} for every candidate (<= 2401 / 343 / 49 at d = 7);
        pre-registered exact values from the audit that the run must
        reproduce: max N = 132 at n' = 33 with histogram {0: 62, 1: 118,
        2: 60, 132: 4}, the four N = 132 candidates being X^7 + X^2,
        X^7 + X^5 + 1, X^7 + X^6 + X^3 + X^2, X^7 + X^6 + X^5 + X^4 + X^3 +
        X + 1; max N = 2 at n' = 44 and n' = 66 with histogram {0: 62, 1:
        122, 2: 60}. Every candidate at least 20 bits below the 2^32 /
        2^43 / 2^65 the table rows need. Any candidate with N > d^{q+1}
        falsifies (A); any candidate with N >= 2^{n'-1} answers RQ-QSP-
        f9bbdb (a) positively and falsifies (A) loudly.
    - metric: >-
        M5 -- rational-lambda fixture at (11, 6) and (23, 12): per draw the
        count of x in K with x^{2^{n'}} b(x) = a(x), against the conjectured
        d^{q+1} + 2^{n'-r} + q d^q
      direction: lower
      minimum_effect: >-
        <= the conjectured bound on every draw (at d <= 3, q = 1: <= 9 + 2
        + 3 = 14); typical value 0..3. A draw above it withdraws (D)(ii) as
        stated; it does not bear on (A).
    - metric: >-
        M6 -- forced fixture counts through the same instrument: subfield
        (12, 6, lambda = X); Type 2 at n = 7 (n' = 3, X^2 + X) and n = 31
        (n' = 15, X^{2^7} + X^{2^3} + X^2 + X); Theorem 1 equality
        X^4 + X^2 + X over F_8 (n = 3, n' = 2, lambda = X^2 + X)
      direction: different
      minimum_effect: >-
        FORCED 64, 8, 32768, 4. Anything else is an instrument failure and
        invalidates the run.
    - metric: >-
        M7 -- arithmetic on (B), reported not measured: the smallest beta
        admitted at n = 131 over n' in 2..130, and the Proposition 8
        exponent at that beta with kappa = 4.876
      direction: higher
      minimum_effect: >-
        beta >= 0.504 (n' = 130) and >= 0.992 at the ten n' with 131 = -1
        mod n'; exponent >= 0.898, i.e. cost >= 2^117.7 at every n' under
        H1, against 2^60.9; alpha_beta > 1 at beta = 0.504 would need
        kappa < 0.992.
  test_boundary:
    instances: >-
      Stage 1 (exhaustive F_2 fixtures): (n, n') in {(11, 6), (13, 7),
      (7, 3), (11, 4), (13, 5)}, every lambda in F_2[X] of degree 2..7 (252
      per cell). Stage 1b (K-coefficient fixture): n = 11 (n' = 6) and
      n = 13 (n' = 7), d in {3, 5, 7}, 200 uniformly random lambda in
      F_{2^n}[X] of exact degree d per (n, d) cell, seed 20260917. Stage 2
      (complete-splitting sweep): prime n in {7, 11, 13, 17, 19, 23, 29,
      31}, 2 <= n' <= 15 with n' < n and n' not dividing n, 2 <= d <=
      min(8, 2^{n'} - 1), every lambda in F_2[X] of degree d. Stage 3 (the
      n = 131 census): field F_2[z]/(z^131 + z^13 + z^2 + z + 1), n' in
      {33, 44, 66}, every non-linearized lambda in F_2[X] of degree 3..7
      (244 per n'). Stage 4 (rational lambda): (n, n') in {(11, 6),
      (23, 12)}, 200 random coprime pairs (a, b) in F_2[X] with deg a,
      deg b <= 3, b != 0, d = max(deg a, deg b) >= 1, seed 20260917.
      Fixtures: (12, 6, X); (7, 3, X^2 + X); (31, 15, X^{2^7} + X^{2^3} +
      X^2 + X); (3, 2, X^2 + X). No curve is touched; no key is involved.
    parameters:
      p: 2 in every numerical cell (the derivation is for every p)
      seed: 20260917 for every random arm, with named sub-streams per cell
      coefficient_fields: F_2 (exhaustive arms), F_{2^11} and F_{2^13} (K-coefficient fixture)
      bound: max(d^{q+1}, 2^{n'-r}) with n = q n' + r, 0 <= r < n'
      corollary_exact: n/(n + n' - r); corollary_conservative n(n' - 1)/(n'(n + n' - r))
      rational_conjecture: d^{q+1} + 2^{n'-r} + q d^q
    implementation: >-
      GF(2)[X] arithmetic on bit-packed integers (multiplication, modular
      squaring, gcd, distinct-degree factorisation) and field arithmetic in
      F_2[z]/(irreducible) for the closing tests; three counting
      instruments at Stage 1 (field enumeration; deg gcd(X^{2^n} - X, L);
      D-root count with the closing test L(x) = 0). The code in
      analysis/qsp-ecc2k130/explore/ (qsp_explore.py, gf2rc.c) MAY be
      reused under experiments/EXP-QSP-33b442/implementation/, but every
      number of the run is produced by the run itself under the harness
      with a manifest; the analysis JSONs are not artifacts of this
      experiment and may not be copied into it.
    budget: >-
      Advisory (docs/research-budget-policy.md): wall-clock 7200 s per run,
      4 CPU-hours total, 4 GB peak memory (machine protection), 1 worker,
      at most 6 runs. See EXP-QSP-33b442.
  falsification_conditions:
    - >-
      F0. Stage 0 hand derivation fails (an identity in (A) does not hold,
      or the degenerate case is mischaracterised): (A) withdrawn; the record
      is superseded, not patched.
    - >-
      F1. Any non-degenerate lambda at any cell with N_K(L) > max(d^{q+1},
      2^{n'-r}), certified by an explicit root list the run wrapper
      re-verifies: (A) is false as stated. If N nonetheless satisfies
      N <= d^{q+1} + 2^{n'-r}, the max form is false and the sum form
      survives (WEAKEN to the sum form); if N exceeds the sum form too, (A)
      is rejected in scope.
    - >-
      F2. Any completely splitting L at r >= 1 in the Stage 2 sweep with
      beta < n/(n + n' - r): (B) is false as stated (same weaken/reject
      split against the conservative threshold n(n' - 1)/(n'(n + n' - r))).
    - >-
      F3. Type 2 at n = 7 or Theorem 1's equality case not attaining the
      bound: the tightness claim in (C) is false (the bound may still hold).
    - >-
      F4. A rational-lambda instance exceeding d^{q+1} + 2^{n'-r} + q d^q:
      the extension (D)(ii) is withdrawn as stated; (A) is untouched.
    - >-
      F5. Instrument disagreement at any Stage 1 cell, or a fixture
      returning other than its forced count: the RUN is invalid and returns
      to the Executor with the defect; this is never evidence about (A).
    - >-
      F6. Timeout, crash, memory cap, or budget exhaustion: an
      infrastructure outcome under AGENTS.md rule 5, never evidence.
  interpretation_limits:
    - >-
      A derivation-tier mechanism about factor-base size. No attack, no
      exponent, no statement about deployed curves. If supported it closes,
      under review, the polynomial-lambda quasi-subfield factor base at
      every n' not dividing n for every coefficient field, with the closure
      reading (E) conditional on H1; it leaves n' | n, the rational-lambda
      conjecture (D)(ii) beyond its Stage 4 fixture, the isogeny-L reading
      if [20] means otherwise, and the correspondence shapes of
      IDEA-20260916-a17f43 open.
    - >-
      Everything numerical at n = 131 other than the Stage 3 census is
      arithmetic on (B). The Stage 3 census certifies exactly 3 x 244
      polynomials; every other lambda in F_{2^131}[X] at those n' is covered
      by the bound (a derivation), not by a list.
    - >-
      'Supported' for this hypothesis means supported at DERIVATION tier
      (docs/claims-and-verification.md): a checkable argument plus
      certificate-bearing numerical checks at toy n and at n = 131, not a
      machine-verified proof. Because (E) is a closure of a research line,
      the review round that could promote it routes to review-breakthrough
      at max (AGENTS.md rule 12); the review_plan is written on that
      handoff by the Coordinator, not here.
    - >-
      KN-OPEN-020 class: implicit-membership; the record prices the
      membership fibre of that class for one family of descriptions and
      does not touch the universal statement.
