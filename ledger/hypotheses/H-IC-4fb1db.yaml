hypothesis:
  id: H-IC-4fb1db
  question_id: RQ-IC-a39c7e
  statement: On the fixed toy polynomial schedule, exact certificates discriminate correct interfaces and useful
    output from the listed adverse controls; coverage/new-rank benefit is unknown and may be zero.
  mechanism: "Admit curves/G; F_W consists of actual nonzero G points with canonical 0<=x<W, both signs retained;\
    \ W is not M. Exact dynamic-programming group-sum counts for all targets,m2/3/5, full first moment M^m/r and\
    \ coverage, with a separate reconstructible witness. Oracle cost charged and never called a lattice recovery.;\
    \ m2 polynomial is S3(x1,x2,xR); S3=(x1-x2)^2*x3\xB2-2*((x1+x2)*(x1*x2+A)+2B)*x3+(x1*x2-A)^2-4B*(x1+x2). m3\
    \ uses exact resultant_T S3(x1,x2,T),S3(x3,xR,T); coefficients reduced modp then lifted centered, preserve degenerate\
    \ cases. Target O uses separate group oracle, not fake x(O).; Dense shifts x^a*f^b*p^(t-b), b0..t, |a|<=L. Sparse-support\
    \ target K=union_{j=0..t}(supp(f^j)+A_L), actual integer coefficient supports after cancellation; candidate\
    \ a in nonnegative coordinate box0..max(K_i), retain iff a+supp(f^b) subsetK. This exact finite support arm\
    \ is a prospective sharpening, not a claimed implementation of the original full convex Newton-polytope arm.\
    \ Order descendingb,totaldegree,lex.; Build integer weighted rows with column weights product W_i^e_i; retain\
    \ exact unimodular/HNF membership certificates so no arbitrary rational-dependence row dropping changes the\
    \ Z-lattice. Compute actual candidate rows, monomial support D, row rank n and Gram determinant before classifying\
    \ a cap. Reject n>64,D>256 or coefficientbits>4096 as explicitly derived instrument-stop; do not assert uncomputed\
    \ overflow.; Actual LLL reduced vectors plus row-lattice membership certificate; strict achieved D*norm\xB2\
    <p^(2t), unweight exactly to integer g. Compute Groebner ideal dimension; only certified zero-dimensional extracted\
    \ equations qualify as finite-system success. Perform exact bounded integer-root extraction and original modular/rational-y/sign/subgroup/sum\
    \ checks; retain all exceptional branches. Exhaustive-box extraction is a separate charged oracle, not free\
    \ lattice success.; Univariate slices fix x2 at0,1, compare direct finite-field factorization and certified\
    \ lattice root outputs. Positive-dimensional multiples of x-y and x(x-y) are required false-sufficiency controls.\
    \ Nonrational repeated-coordinate S4(t,t,xR,xR) with RHS nonsquare is an adverse lift control; actual modular\
    \ root required before reporting it.; m5 has executed density and addition-tree/height accounting only, NOT\
    \ expanded S6 or lattice/root-solver coverage. Fixed tiny split tree preserves group/witness constraints and\
    \ records intermediate coordinates; label expanded m5 solver outside initial instrument explicitly."
  assumptions:
  - All field/curve/subgroup/map admissions must be independently certified in-run.
  - Known families retained by explicit user instruction; no new method or speedup established.
  proof_search_map:
    bottleneck: Actual valid field/decomposition certificates, independent reduced rank and charged complete pipeline.
    baseline_embedding:
      parameter_slice: dense same-cap shifts
      reproduction_check: Preserve exact baseline and mandatory nearby-object controls on the frozen schedule.
    observation_collision:
      observable:
      - exact M and uniform valid target coverage
      - actual n,D,covolume,membership and achieved strict norm certificate
      - zero-dimensional independent equations and actual valid roots
      - new valid quotient rank per paid phase, or explicit zero yield
      distinct_preimage_search: Preserve degenerate witnesses, invalid lifts, duplicate orbit rows and positive-dimensional
        short-vector controls where applicable.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: Exact polynomial interface certificates
      predicted_gain: Discrimination only; no cost improvement assumed.
    quantifier_order: For every admitted frozen fixture/case verify certificates; existential successful or faster
      solving remains unproved. No transfer beyond the finite schedule.
    method_ceiling:
      strongest_certifiable_claim: Toy observations and exact implementation witnesses pending independent review.
      nearby_object_control:
      - dense same-cap shifts
      - same-box exact/DP oracle
      - size-matched random point base
      - permuted coordinate labels
      - generic relabeled cyclic group
      - planted versus uniform law
      - coefficient-independent but positive-dimensional multiples
      - nonrational/outsideG modular roots
      - univariate finite-field root finding
    proof_obligations:
    - claim: Exact admission, valid output and complete accounting in every declared panel
      responsibility: correctness
    not_applicable_reason: null
  predictions:
  - metric: exact M and uniform valid target coverage
    direction: different
    minimum_effect: Exact valid output, zero yield, rejected adverse control or explicit instrument stop, as preregistered;
      no benefit threshold asserted.
  - metric: actual n,D,covolume,membership and achieved strict norm certificate
    direction: different
    minimum_effect: Exact valid output, zero yield, rejected adverse control or explicit instrument stop, as preregistered;
      no benefit threshold asserted.
  - metric: zero-dimensional independent equations and actual valid roots
    direction: different
    minimum_effect: Exact valid output, zero yield, rejected adverse control or explicit instrument stop, as preregistered;
      no benefit threshold asserted.
  - metric: new valid quotient rank per paid phase, or explicit zero yield
    direction: different
    minimum_effect: Exact valid output, zero yield, rejected adverse control or explicit instrument stop, as preregistered;
      no benefit threshold asserted.
