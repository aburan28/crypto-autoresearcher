hypothesis:
  id: H-SQISIGN-c0488f
  question_id: RQ-SQISIGN-39f231

  statement: >-
    SCOPE, STATED FIRST AND BINDING ON EVERY CITATION. Object: the PUBLISHED-DATA
    SURFACE of SQIsign as specified in "SQIsign Algorithm specifications and
    supporting documentation, Version 2.0.1" (2025-07-07), at the three declared
    parameter sets NIST-I, NIST-III, NIST-V. Template: the Kani glue-and-split
    higher-dimensional embedding family as recorded in KN-TECH-026. CLAIM TIER:
    documentary and derivational for the inventory and the counting arguments;
    TOY WITHOUT EXCEPTION for any executed attack behaviour. NO ATTACK, NO
    EXPONENT, NO HARDNESS CLAIM, NO STATEMENT ABOUT SQIsign AT DEPLOYED
    PARAMETERS.
    THE HYPOTHESIS. The SIDH/Kani template is not instantiable against that
    published surface, and the reason is a SINGLE NAMED MISSING INGREDIENT rather
    than a parameter margin, an unknown degree, or a general structural
    difference. Precisely, four conjuncts, each independently falsifiable:
    (C1) SEPARATION. SQIsign COMPUTES the SIDH-shape auxiliary datum -- the pair
    (phi_sk(P_0), phi_sk(Q_0)) of images of the deterministic public basis of
    E_0[2^f] under the secret isogeny -- at KeyGen Algorithm 4.1 step 5, packages
    it as the change-of-basis matrix M_sk at step 9, and places it in the SECRET
    key at step 11 while the public key at step 10 is (E_pk, hint_pk) only.
    (C2) EMPTY CHANNEL. The only per-key datum besides the curve, hint_pk, is a
    deterministic function of the curve, because Algorithm 2.1
    TorsionBasisToHint takes exactly (A, e) as input; hence I(hint_pk ; phi_sk |
    E_pk) = 0 exactly, and the per-key auxiliary surface carries zero free bits.
    (C3) SURPLUS, NOT DEFICIT. The torsion available to an embedding of phi_sk
    EXCEEDS its degree. With deg phi_sk = nrd(I_sk) approximately sqrt(p) by the
    specification's own Section 3.1.6.2 heuristic, and available torsion order
    2^f, the surplus f - log2(deg phi_sk) equals f - e_rsp = e_chl EXACTLY by
    Appendix B's own definitions: 122, 184, 247 bits at NIST-I, III, V. The
    obstruction is therefore a publication boundary and NOT a parameter margin.
    (C4) COLLAPSE TO ONE INGREDIENT. The degree is not a second independent
    missing ingredient, because Weil-pairing compatibility makes d * det(M_sk)
    mod 2^f publicly computable from E_0, E_pk and their deterministic bases,
    so publishing M_sk yields d exactly (d < 2^{e_rsp} <= 2^f, so the reduction
    mod 2^f is an equality). Hence exactly ONE field of 4 x TORSION_2POWER_BYTES
    = 128 / 192 / 252 bytes separates the real surface from an instantiable one.
    THE PLANNED NEGATIVE IS THE DELIVERABLE, AND IT IS BLOCKED UNTIL THE NULL
    FIRES. No statement that the template is inapplicable may be recorded until
    the identical audit has been shown to FIRE against SQIsign-LEAK(k), the
    weakened variant publishing M_sk mod 2^k, with the transition bracketing the
    PRE-DERIVED threshold k = ceil(log2 nrd(I_sk)) approximately e_rsp = 126 /
    192 / 253, and to fire against SIDH/SIKE's surface, and to fire against an
    adversarially disguised x-only leak of the same ingredient.
    IF ANY CONJUNCT FAILS the deliverable is the located failure, which is more
    valuable than the conjunction.

  mechanism: >-
    DERIVED FROM PRIMARY TEXT READ IN THIS SESSION. Source: the SQIsign v2.0.1
    specification, fetched 2026-08-06 from
    https://sqisign.org/spec/sqisign-20250707.pdf (HTTP 200, 1,087,080 bytes) and
    extracted with a pure-zlib stream extractor written here because pdftotext is
    absent from this container and pypdf raises pyo3_runtime.PanicException on
    import. EXTRACTION DAMAGE IS THE PRIMARY EVIDENTIARY RISK and every figure is
    a candidate to check; the check is Stage 0 of EXP-SQISIGN-1177f2.

    A. THE INVENTORY, ITEM BY ITEM, WITH ITS SOURCE LINE.
    PER KEY (Section 4.6, Appendix B, Algorithm 4.1):
      E_pk -- Montgomery coefficient A in F_{p^2}, EC_CURVE_ENCODED_BYTES = 64 /
        96 / 128 bytes. PUBLISHED. REQUIRED by verification (Algorithm 4.9 lines
        3, 8, 9).
      hint_pk -- one byte, (h_A, h). PUBLISHED. Required only for SPEED: Algorithm
        2.2 with h = 0 recomputes the basis from A alone, so the verifier can
        proceed without it. Classified PUBLISHED / NOT-REQUIRED / ZERO-CONTENT.
      B_pk = (P_pk, Q_pk) -- a full basis of E_pk[2^f]. NOT TRANSMITTED but
        PUBLICLY DERIVABLE from (A, hint) by Algorithm 2.2. This row is the one an
        inventory most easily gets wrong in the safe-looking direction: a torsion
        BASIS is public on every curve in the scheme. What is not public is any
        IMAGE of a basis under a secret map.
      phi_sk(P_0), phi_sk(Q_0) -- COMPUTED at Algorithm 4.1 step 5. NOT PUBLISHED.
      M_sk -- COMPUTED at step 9, 4 x TORSION_2POWER_BYTES = 128 / 192 / 252
        bytes. IN THE SECRET KEY (step 11).
      I_sk, hence deg phi_sk = nrd(I_sk) -- IN THE SECRET KEY.
    PER SIGNATURE (Section 4.6, Algorithms 4.2 and 4.9): E_aux (curve, PUBLISHED,
      REQUIRED); n_bt (1 byte, PUBLISHED, REQUIRED); r_rsp (1 byte, PUBLISHED,
      REQUIRED); M_chl (2x2 integers, 4 x floor((e_rsp+7)/8) bytes, PUBLISHED,
      REQUIRED -- and this IS torsion-image data, expressing the interpolation
      points in the deterministic basis of E_chl); chl (lambda/8 bytes,
      PUBLISHED, REQUIRED); hint_aux, hint_chl (1 byte each, PUBLISHED,
      NOT-REQUIRED, ZERO-CONTENT by the same Algorithm 2.1 argument).
    THE BOUNDARY IS THEREFORE ONE LINE OF ONE ALGORITHM, and the inventory's own
    completeness is sealed by the byte budget of EXP-SQISIGN-e10747.

    B. WHY M_chl IS NOT THE INGREDIENT. M_chl is genuinely torsion-image data,
    and a reading that stopped at "SQIsign publishes no torsion images" would be
    wrong. But the map it interpolates is phi_rsp / the (2,2)-isogeny Phi, and
    Algorithm 4.9 lines 24-26 has the VERIFIER compute that (2,2)-chain from
    exactly this data. So the Kani construction does not fail to apply to
    SQIsign's published surface -- IT IS THE VERIFICATION ALGORITHM. Its output
    is a deterministic function of the signature and therefore carries zero
    conditional entropy given the signature. The correct question is not
    applicability but information gain, and the correct answer is that the only
    map whose torsion images are published is one the verifier is entitled to
    reconstruct in full.

    C. THE COUNTING ARGUMENT FOR C2. Algorithm 2.1 TorsionBasisToHint(A, e):
    h_A is 1 if A is a square and 0 otherwise; h is incremented from 0 until a
    stated non-residuosity-and-on-curve condition holds; if h reaches 128 it is
    reset to 0. Its inputs are (A, e) and nothing else. Algorithm 2.2
    TorsionBasisFromHint with h = 0 calls TorsionBasisToHint. Therefore hint_pk =
    g(A_pk) for a public function g depending only on the public parameter e = f,
    and conditioning on E_pk fixes hint_pk. A deterministic function of a
    conditioned variable adds no information: I(hint_pk ; X | E_pk) = 0 for every
    X. The 8-bit channel is a memoised search index, not an auxiliary datum.

    D. THE SURPLUS DERIVATION FOR C3. Appendix B: f = 248 / 376 / 500; e_rsp =
    ceil(log2 sqrt(p)) = 126 / 192 / 253; e_chl := f - e_rsp = 122 / 184 / 247.
    Section 5.2: p = 5*2^248 - 1, 65*2^376 - 1, 27*2^500 - 1. Section 3.1.6.2,
    on RandomEquivalentPrimeIdeal: "Heuristically, we can expect the norm of the
    output ideal to be approximately sqrt(p) which should be much smaller than
    the norm of the input in SQIsign." Since KeyGen (Section 4.3) replaces the
    sampled I_sk of norm D_mix by that output, log2 deg phi_sk is approximately
    log2(p)/2, i.e. e_rsp up to rounding. Hence surplus = f - e_rsp = e_chl. THIS
    IS A DEFINITIONAL CONSEQUENCE, NOT A FITTED NUMBER: e_chl is defined as f -
    e_rsp and e_rsp is defined as ceil(log2 sqrt(p)), so the identity holds by
    construction of the parameter set, and the only empirical content is the
    sqrt(p) heuristic, carried as HEUR-SQ-1 with its own falsification condition
    and its own measurement plan.
    WHAT THIS DOES AND DOES NOT SETTLE. It settles that the template's TORSION
    requirement, in the form recorded by KN-TECH-026 (known action on a torsion
    basis, with the embedding needing room above the degree), is satisfied at
    SQIsign's own parameters if the action were known. It does NOT settle the
    exact form of that requirement in dimensions 4 and 8, which is RECALLED AND
    UNVERIFIED and is a Stage-0 literature obligation. If dimension 8 needs no
    surplus, C3 becomes decorative and C1 carries the obstruction alone -- a
    weaker but still complete statement, and the hypothesis says so in advance
    rather than being repaired afterwards.

    E. THE PAIRING DERIVATION FOR C4. nrd(I_sk) is an odd prime, so phi_sk
    restricts to an isomorphism E_0[2^f] -> E_pk[2^f]. Weil pairing
    compatibility: e_{2^f}(phi_sk(P_0), phi_sk(Q_0)) = e_{2^f}(P_0, Q_0)^d with
    d = deg phi_sk. The specification's M_sk satisfies M_sk * (phi_sk(P_0);
    phi_sk(Q_0)) = (P_pk; Q_pk), and the pairing is alternating bilinear, so
    e_{2^f}(P_pk, Q_pk) = e_{2^f}(phi_sk(P_0), phi_sk(Q_0))^{det M_sk} =
    e_{2^f}(P_0, Q_0)^{d * det(M_sk)}. Both pairings are computable by anyone,
    since B_0 is a scheme parameter and B_pk is derivable from E_pk by Algorithm
    2.2, and the discrete logarithm lives in mu_{2^f}, of 2-power-smooth order,
    hence is easy. So w := d * det(M_sk) mod 2^f is PUBLIC. Publishing M_sk
    therefore yields d = w * det(M_sk)^{-1} mod 2^f, exactly, since d is
    approximately sqrt(p) < 2^{e_rsp} <= 2^f.
    AND THE MIRROR QUESTION, ANSWERED HERE RATHER THAN LEFT OPEN: is w itself a
    leak in real SQIsign? No. It is one equation in two unknowns; det(M_sk)
    ranges over units of Z/2^f, so the fibre over an observed w has 2^{f-1}
    elements. The obligation this creates -- that Algorithm 2.1's normalisation
    (permuting so that R + S lies above (0,0)) constrains the basis only modulo
    2 and not det(M_sk) modulo higher powers -- is listed under
    proof_obligations and must be discharged, not assumed.

    F. WHAT WOULD MAKE THE OBSTRUCTION FALL -- THE FORWARD GUIDANCE, WHICH IS THE
    PART A CLOSURE MUST CARRY (docs/inventor-protocol.md section 4). A SQIsign
    variant would have to publish, per key, a determination of phi_sk's action on
    E_0[2^k] for some k exceeding log2(deg phi_sk). Concretely, publishing M_sk
    mod 2^k for k > e_rsp suffices; publishing it for k <= log2(deg phi_sk) should
    not. Publishing the degree alone should not, and publishing the images alone
    should suffice by the pairing argument. A variant designer can check their own
    design against a single inequality: does the published data determine the
    secret map's action on torsion of order exceeding its degree? That is the
    usable form of this negative and is the reason it is worth producing.

  assumptions:
    - >-
      THE SOURCE DOCUMENT. Every structural fact is from SQIsign v2.0.1, which
      self-describes in Section 1.3 as "the present round-2 SQIsign submission".
      GOAL-SQISIGN-002 and RQ-SQISIGN-39f231 presuppose a distinct ROUND-3
      specification whose existence is UNVERIFIED. If a Round-3 document exists
      and differs, this hypothesis is about the wrong object and must be
      re-scoped, not repaired. Establishing which document is the Round-3
      submission is Stage 0 and is a deliverable in itself. This also bears on the
      goal's second pause_condition: the sources were obtained, so that condition
      does not fire.
    - >-
      THE TEMPLATE REQUIREMENT. That the Kani family needs both the exact degree
      and the action on a torsion basis of order exceeding the degree is taken
      from KN-TECH-026, an in-corpus technique record written 2026-07-23 from
      secondary sources. The primary sources (Castryck-Decru, Maino-Martindale,
      Robert) were NOT READ. Whether the dimension-4 and dimension-8 variants
      relax the order requirement is the single most load-bearing unread fact
      here and is a Stage-0 obligation.
    - >-
      "PUBLISHED" MEANS TRANSMITTED, per Section 4.6. Data an implementation holds
      in memory but does not transmit is a side-channel question, out of this
      goal's scope by construction, and this hypothesis makes no statement about
      it. Note this is a real limitation: M_sk exists in the signer's memory on
      every signature.
    - >-
      EXTRACTION FIDELITY. All figures come from a hand-written zlib stream
      extractor. Table numerals are the most fragile part; one known residual
      already exists (the NIST-III signature-size reconciliation of
      IDEA-20260805-244f78) and is carried as an open item rather than resolved.

  proof_search_map:
    bottleneck: >-
      The single step at which instance-specific information about phi_sk could
      enter an attacker's Kani construction. If no published item determines
      phi_sk's action on any torsion subgroup, then no improvement to the
      embedding dimension, to the isogeny arithmetic, or to the auxiliary-degree
      search can repair an input that does not depend on the secret. Establishing
      the presence or absence of that one step is upstream of every other
      question this goal asks, and it consumes no hard-problem budget, which is
      also why it does not encroach on GOAL-SSI-001.
    baseline_embedding:
      parameter_slice: >-
        SIDH/SIKE itself is the exact parameter slice that reproduces the known
        baseline: published surface (E_A, phi_A(P_B), phi_A(Q_B)) with both
        degrees public and the torsion order exceeding the degree by
        construction. The audit instrument must reproduce the KNOWN outcome there
        -- template instantiable, all ingredients present -- before it is allowed
        to report anything about SQIsign. A second slice inside SQIsign itself:
        SQIsign-LEAK(f), which publishes M_sk in full and must also reproduce
        instantiability.
      reproduction_check: >-
        SYMBOLIC AND ADVERSARIAL, not a curve that looks similar. The ingredient
        checker is run on SIKE's surface with its rule set frozen beforehand and
        must return the complete ingredient set, 5 of 5, with each ingredient
        traced to a named published item. It is ALSO run on an adversarially
        disguised x-only encoding of the same ingredient; a checker that passes
        the first and fails the second is a syntactic matcher and its negative on
        SQIsign is worthless. Both cells are run BEFORE the SQIsign cell.
    observation_collision:
      observable: >-
        The publicly computable quantity w = dlog_{e(P_0,Q_0)} e(P_pk, Q_pk) =
        d * det(M_sk) mod 2^f, together with the published curve E_pk. This is
        the strongest observable the public key affords about the secret map, and
        naming it is the point of the audit: it is a nontrivial function of the
        secret that anyone can compute in O(f) work.
      distinct_preimage_search: >-
        PERFORMED, AND IT RETURNS A COLLISION SET RATHER THAN A FALSIFIER, WHICH
        IS THE HONEST OUTCOME AND IS REPORTED AS SUCH. For any observed w, and
        for every unit u in (Z/2^f)^*, the pair (d, det M_sk) = (w * u^{-1}, u)
        is consistent, so the fibre has 2^{f-1} elements -- 2^247 at NIST-I. Two
        ground-truth secret keys with different degrees therefore share the
        observable. Identifiability from w alone is thus refuted, and no
        additional published condition separates them, because no other function
        of the secret is published per key. The mirror search -- for two SIGNING
        transcripts sharing an observable while differing in a secret-relevant way
        -- is NOT performed here and is named as a residual.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the published surface fixed and vary the forgotten structure:
          enumerate, at a toy prime, the set of (I_sk, phi_sk, M_sk) consistent
          with a fixed (E_pk, hint_pk), and ask whether any intrinsic invariant
          inside the Kani construction distinguishes its members. If none exists,
          the construction cannot depend on the secret; if one exists, name it,
          and it becomes the most important object in this goal.
        predicted_gain: >-
          None to an attacker. The gain is a named obstruction for the whole
          higher-dimensional-embedding family against this surface, at a stated
          scope, replacing an assertion.
      - transform: representation_reduction
        proposed_object: >-
          Move the question from "can an attack be built" into a model where it
          is an exact availability condition: define the ingredient set
          {domain curve, codomain curve, torsion basis of order N, images of that
          basis under the map, exact degree d, N > d} and reduce "template
          instantiable" to "the published surface determines all six". The
          encoding obligation is that this set is what KN-TECH-026 requires; the
          soundness obligation is that determining all six really does suffice
          (tested by the SIKE positive control); the completeness obligation is
          that missing any one really does block (tested by the graded
          SQIsign-LEAK(k) control); the transfer obligation to dimension 8 is
          DECLARED UNMET pending Stage 0.
        predicted_gain: >-
          Converts an open-ended attack-construction question into a checkable
          six-item availability test that costs minutes, and makes the null
          control's firing threshold a derived number rather than a discovered
          one.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER, AND THE ORDER IS THE CONTENT.
      FOR ALL honestly generated public keys pk and FOR ALL signatures sigma
      valid under pk, THERE IS NO published item in (pk, sigma) that determines
      the action of phi_sk on E_0[2^k] for any k >= 1.
      The witness (the missing determination) may NOT depend on the key, the
      message, or the signature; the claim is uniform over instances because it
      is a statement about the ENCODING (Section 4.6), which is instance-
      independent by construction. This is why the audit can be documentary
      rather than statistical.
      THE WEAKER ORDER IS EXPLICITLY NOT CLAIMED AND IS NOT ADMISSIBLE AS A
      RESULT: "FOR ALL keys THERE EXISTS an attack that fails" would be a
      statement about attacks tried, i.e. a fatigue report
      (docs/inventor-protocol.md section 4).
      THE CONVERSE DIRECTION, WHICH THE AUDIT DOES NOT ESTABLISH AND MUST NOT BE
      READ AS ESTABLISHING: it is NOT claimed that FOR ALL adversaries the
      template yields nothing. An adversary combining published data across MANY
      signatures, or exploiting a relation this record has not enumerated, is
      outside the quantifier. That gap is the residual named in
      interpretation_limits.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that the Kani glue-and-split template AS RECORDED IN KN-TECH-026
        is not instantiable against the v2.0.1 published surface at the three
        declared parameter sets, for the single named reason that no published
        item determines phi_sk's action on any torsion subgroup, with the
        secondary quantitative statement that the torsion order available exceeds
        the secret degree by e_chl bits so the obstruction is not a parameter
        margin. IT CANNOT CERTIFY that SQIsign resists higher-dimensional
        attacks in general, that no auxiliary-information attack exists, that the
        endomorphism ring problem is hard, or anything about a Round-3 document
        it has not read. It cannot move any exponent and it cannot bound any
        solver's cost.
      nearby_object_control: >-
        TWO, IN OPPOSITE DIRECTIONS, AND BOTH ARE REQUIRED.
        (i) THE OBJECT WHERE THE HOPED-FOR CONCLUSION FAILS: SIDH/SIKE. Same
        family, same primes-of-the-shape, same curves, same torsion bases -- and
        the template DOES apply, provably and historically. An instrument that
        cannot separate SQIsign from SIKE has not found the load-bearing
        structure, and running it on SIKE is a gate on reporting anything.
        (ii) THE OBJECT WHERE THE CONCLUSION HOLDS FOR A DIFFERENT REASON: CSIDH
        and the group-action constructions, which the frozen Wesolowski text
        names on its explicitly-safe list against an affected list containing the
        SQIsign family. The instrument must return "not instantiable" there too,
        AND MUST NAME A DIFFERENT REASON. If it returns the same reason for
        SQIsign and CSIDH, it is reporting a property of itself.
    proof_obligations:
      - claim: >-
          The seven signature components and two public-key components of
          Section 4.6 are the COMPLETE published surface, sealed by the byte
          budget closing exactly at every level.
        responsibility: interface
      - claim: >-
          hint_pk = g(A_pk) for a public g, hence I(hint_pk ; phi_sk | E_pk) = 0.
        responsibility: correctness
      - claim: >-
          e(P_pk, Q_pk) = e(P_0, Q_0)^{d * det M_sk}, and the fibre over an
          observed w has 2^{f-1} elements, i.e. Algorithm 2.1's normalisation
          constrains the basis only modulo 2 and does not pin det M_sk modulo
          higher powers of 2.
        responsibility: correctness
      - claim: >-
          deg phi_sk = nrd(I_sk) is approximately sqrt(p), so the surplus is
          e_chl. Measured from KAT secret keys, not assumed.
        responsibility: size
      - claim: >-
          The Kani family requires known action on torsion of order exceeding the
          degree, in dimension 2 and in dimensions 4 and 8. NOT DISCHARGED;
          Stage-0 literature obligation, and C3 is void without it.
        responsibility: baseline
      - claim: >-
          The ingredient checker fires on SIKE, fires on SQIsign-LEAK(k) for
          k > e_rsp, does not fire for k <= log2 deg phi_sk, and fires on the
          disguised x-only cell.
        responsibility: strictness
      - claim: >-
          Nothing here transfers to a Round-3 document not read, to SQIsign
          variants (2D-West and others), or to any other template; and no
          hardness figure is originated, so GOAL-SSI-001's scope is untouched.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    DELIBERATELY NULL. There is no complexity claim of any kind. This hypothesis
    proposes no algorithm, moves no exponent, and makes no system easier to
    solve. sota_delta is ZERO on every attack axis (time, memory, data, queries,
    advice, preprocessing) and dominated_by is not applicable because no Pareto
    point is claimed. The exponent AT STAKE if the obstruction were absent is the
    whole of it -- the template against a surface supplying its ingredient is
    polynomial time per KN-TECH-026 -- and stating that is not a claim that
    anything here approaches it.

  heuristic_assumptions:
    - id: HEUR-SQ-1
      formal_statement: >-
        FOR ALL security levels L in {I, III, V} and FOR ALL honestly generated
        secret keys at level L, |log2 nrd(I_sk) - log2(p_L)/2| <= 3.
      random_model_justification: >-
        The specification states it as its own heuristic (Section 3.1.6.2:
        "Heuristically, we can expect the norm of the output ideal to be
        approximately sqrt(p)"). The structural reason is that
        RandomEquivalentPrimeIdeal reduces a rank-4 lattice of covolume of order
        p^2 in a quaternion order and reads off short vectors, whose norms are of
        order sqrt(p) under the usual Minkowski/Gaussian-heuristic reasoning for
        such lattices. NO RIGOROUS BOUND IS ASSERTED AND NO DISTRIBUTION THEOREM
        IS CITED, because none was read; this is the specification's heuristic
        carried forward as a heuristic, which is the only honest handling.
      supporting_results: []
      validation_experiment_ids: [EXP-SQISIGN-1177f2]
      falsification_condition: >-
        MEASURED BEFORE ANY CONCLUSION ABOUT C3 IS REPORTED. Decode nrd(I_sk)
        from every obtainable KAT secret key (it is encoded in the clear per
        Section 4.6) and report the distribution of f - ceil(log2 nrd(I_sk))
        against the predicted e_chl. If any measured surplus is <= 0, C3 IS
        FALSE, the obstruction is parametric as well as publication-based, and the
        hypothesis must be restated in the strictly weaker form rather than
        repaired. If the median surplus differs from e_chl by more than 3 bits,
        the sqrt(p) heuristic is refuted at the tested sizes and the identity
        surplus = e_chl is reported as approximate rather than exact.
    - id: HEUR-SQ-2
      formal_statement: >-
        NOT A HEURISTIC, RECORDED HERE TO SAY SO EXPLICITLY. C2 and C4 are
        identities, not distributional claims: hint_pk = g(A_pk) follows from
        Algorithm 2.1's argument list, and the pairing relation follows from
        bilinearity and the degree formula for the Weil pairing. Neither invokes
        a random model.
      random_model_justification: >-
        None required. A deterministic function of a conditioned variable carries
        no information beyond it; the Weil pairing is bilinear and satisfies
        e(phi P, phi Q) = e(P, Q)^{deg phi} for a separable isogeny phi with the
        pairing taken on the appropriate torsion.
      supporting_results: []
      validation_experiment_ids: [EXP-SQISIGN-1177f2]
      falsification_condition: >-
        A single KAT public key whose hint byte differs from
        TorsionBasisToHint(A_pk, f) recomputed from the curve, or a single KAT key
        for which the pairing relation fails. Either refutes the corresponding
        identity outright and is reported before anything else.

  structural_ingredients:
    - description: >-
        Kani glue-and-split higher-dimensional embedding: given a secret isogeny
        of known degree and its action on a known torsion basis, build a
        reducible isogeny between products of abelian varieties and recover the
        secret map.
      citation: >-
        knowledge/techniques/KN-TECH-026.md (in-corpus, confidence: reported,
        written 2026-07-23 from secondary sources). THE PRIMARY SOURCES WERE NOT
        READ IN THIS SESSION and no primary citation is asserted. Reading them
        is Stage 0 of EXP-SQISIGN-1177f2 and the requirement that the torsion
        order exceed the degree is RECALLED, UNVERIFIED.
      role: the template whose ingredient list defines the audit
    - description: >-
        Deterministic torsion-basis generation from a curve coefficient plus an
        8-bit hint, and its inverse.
      citation: >-
        SQIsign v2.0.1 Algorithms 2.1 (TorsionBasisToHint) and 2.2
        (TorsionBasisFromHint), READ this session.
      role: establishes that the hint channel is a function of the public curve
    - description: >-
        Weil-pairing compatibility e(phi P, phi Q) = e(P, Q)^{deg phi} for a
        separable isogeny, plus bilinearity under a change of basis.
      citation: >-
        Standard; no external citation asserted because none was read. Derived in
