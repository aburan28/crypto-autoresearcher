  # (DEC-20260921-4d1b40); this update changes only the status field.
  approved_by: DEC-20260921-4d1b40

  statement: >-
    For each statistic v in the frozen registry of natural coordinate
    statistics on F_p (interval indicator, AP indicator, digit-sums in bases
    2/3/10, multiplicative-coset indicators for index-ell in {2,3,5},
    quadratic-residue indicator, low-bit mask, plus the all-ones and
    random-sign analytic controls), the exponent lambda(v) defined by
    ||vhat||_1 = n^{lambda(v)+o(1)} -- where vhat is the exact additive
    Fourier transform of the L2-normalised v over F_p -- is measurable by
    exact Bluestein transform over a frozen ladder of primes in O~(p) time
    per cell with no sampling error, and the two-sided gate
    [lambda > 1/4 opens the spectral-learning conversion route of
    IDEA-20260904-f68c7f (D); lambda >= 1/6 unblocks the n^{1/3} corner of
    cost model M1 under the IDEA-20260920-b6ad24 floor] then decides, per
    statistic and with no further heuristic, whether the branching-window
    lane may key a construction on it. The census falsifies or confirms the
    lane's implicit prior that natural statistics beyond the committed
    digit-sum measurement (KN-FIND-ffe1df: L1 growth ~ p^{0.39}) populate
    the band; either outcome is a recorded result with a named successor.
    GATES ARE NECESSARY, NOT SUFFICIENT: no gate verdict certifies an
    attack.

  mechanism: >-
    lambda(v) is a property of v on F_p alone, computable exactly by
    chirp-z (Bluestein) over the prime p -- a census of an exact quantity,
    not an estimate of a distribution. The two gates it feeds are committed
    on file: IDEA-20260904-f68c7f (E) supplies the bias upper bound
    eps <= ||vhat||_1 * n^{-1/2+o(1)} and (D) the conversion threshold
    A(v) > n^{-1/4+o(1)} (i.e. lambda > 1/4); IDEA-20260920-b6ad24 (A1)-(A3)
    supplies the Parseval floor M*sqrt(2b) >= n^{1/2-o(1)}/n^lambda and the
    optimised cost floor T >= n^{(4-2*lambda)/11} for lambda <= 1/6, with
    the n^{1/3} corner requiring lambda >= 1/6. One measured exponent per
    statistic therefore decides both reachability questions the lane's next
    construction step needs. The tracked-object frame (IDEA-20260921-6a29df
    mechanism): the fibre statistic v(x(R)) is a branching object under the
    a5757d one-step additive branching operation set, R1 representation,
    attack stage COLLISION STRUCTURE; this hypothesis asserts only the
    measurability of the gate quantity and the decisiveness of the gate
    readout, not any construction.

  assumptions:
    - The transform is over the ADDITIVE characters of F_p (e_p(kx) =
      exp(-2*pi*i*k*x/p)), exact via Bluestein chirp-z over the prime p;
      never a composite-length surrogate DFT and never the log coordinate.
    - Each statistic is L2-normalised (||v||_2 = 1) before the transform;
      lambda is read from log||vhat||_1 against log p under this fixed
      normalisation, so normalisation drift cannot masquerade as exponent.
    - All stochastic elements (random signs, random curves for the
      coset-restriction rows, random Moebius maps) come from frozen
      SHA256(experiment:cell:purpose:counter) hash streams declared in the
      specification before any run.
    - The registry and both ladders are frozen in EXP-ECDLP-fac9ea v1; no
      row or prime may be added, removed, or re-spaced after any cell
      outcome (amendments are additive only).
    - Toy/medium ladder only (p <= 2^26); no crypto-scale claim of any
      kind, and no claim about statistics outside the frozen registry.

  proof_search_map:
    bottleneck: >-
      The lane cannot say, for any candidate key statistic v, whether the
      n^{1/3} corner (lambda >= 1/6) or the learning route (lambda > 1/4)
      is in principle available to a construction keyed on v; the census
      converts that open design question into one measured number per
      statistic.
    baseline_embedding:
      parameter_slice: >-
        Digit-sum at lambda ~ 0.39 (KN-FIND-ffe1df via f68c7f (D)) is the
        exact reproduction target; the committed p^{0.39} measurement must
        be reproduced within the fitted-exponent error before any other
        row's lambda is believed.
      reproduction_check: >-
        Fitted lambda(popcount/digit-sum base 2) in [0.36, 0.42] across at
        least 6 ladder points with monotone residuals; failure blocks the
        whole census as an infrastructure defect, not evidence.
    observation_collision:
      observable: >-
        ||vhat||_1 as a function of p, an exactly computable quantity; the
        collision risk is numerical (wrong transform domain) and structural
        (two visibly different statistics sharing lambda): the registry
        reports lambda as a gate readout never as an identification of the
        statistic, and carries the fibre geometry beside the number.
      distinct_preimage_search: >-
        Interval and AP indicators are both expected near lambda = 0; the
        census must keep them as separate rows with their geometry recorded
        so a shared reading is visible rather than collapsed.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The reachability question per statistic reduced to the single
          measured exponent lambda(v) via the two committed gates.
        predicted_gain: >-
          Converts an open design question into a table row per statistic;
          no complexity gain claimed.
    quantifier_order: >-
      For every named statistic v in the frozen registry there exists a
      measured lambda(v) (exact computation); gate statements are
      per-statistic one-sided decisions and introduce no unmeasured
      generality.
    method_ceiling:
      strongest_certifiable_claim: >-
        Per-statistic gate verdicts at the measured ladder sizes with a
        stated fitted-exponent error bar; nothing about statistics not in
        the registry, and nothing asserting that lambda >= 1/6 suffices
        for an attack.
      nearby_object_control: >-
        Random-sign null must read lambda ~ 1/2 + o(1) (Parseval trivial
        level) and the all-ones statistic lambda = 0 exactly; either
        failing calibrates the pipeline as defective and voids the census.
    proof_obligations:
      - claim: the transform computes the exact additive Fourier transform over F_p
        responsibility: correctness
      - claim: the ladder fit yields lambda with a stated error bar
        responsibility: size
      - claim: gates are applied one-sidedly (necessary conditions only)
        responsibility: scope
    not_applicable_reason: null
