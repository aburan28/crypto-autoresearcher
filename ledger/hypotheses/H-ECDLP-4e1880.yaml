  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        LADDER EXTRAPOLATION. For each registry statistic v, log||vhat||_1
        is linear in log p over the frozen ladders up to a residual of
        order O(1/log p), and the exponent lambda(v) fitted on
        p in [2^12, 2^26] equals the asymptotic exponent.
      random_model_justification: >-
        Not a distributional heuristic: the fitted sequence is exactly
        computable at every ladder point, so the assumption concerns only
        interpolation regularity. The failure mode it excludes is genuine
        oscillatory correction (e.g. digit-sum anomalies at powers of the
        base), which the residual plot and the two-spacing ladder
        agreement expose.
      supporting_results:
