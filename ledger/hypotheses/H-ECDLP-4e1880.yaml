      random_model_justification: >-
        Not distributional: this is the composability of two inequalities
        already committed on file, exactly the composition b6ad24 (A2)
        performs. No new mathematical content is asserted.
      supporting_results:
        - internal: IDEA-20260904-f68c7f (E) and (D)
        - internal: IDEA-20260920-b6ad24 (A1)-(A3)
        - internal: IDEA-20260921-6a29df H2
      validation_experiment_ids: [EXP-ECDLP-fac9ea]
      falsification_condition: >-
