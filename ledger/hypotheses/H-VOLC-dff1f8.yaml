hypothesis:
  id: H-VOLC-dff1f8
  question_id: RQ-VOLC-f6253b
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-d7e255
  source_design: >-
    analysis/endomorphism-isogeny-decomposition/MATCHED-ORDER-DESIGN.md
    section 4, E2 WITHIN-CLASS ARM plus E3 (the reachability gate)

  statement: >-
    SCOPE. The matched-order family N = 19507 (prime), within-class arm only:
    relation-collection density against TRUE volcano level, inside single isogeny
    classes of that family, with the level assigned by explicit Velu isogeny
    construction. Plus the T5 reachability gate of DECOMPOSITION.md section 3,
    evaluated where the design document says it is sharp and cheap: the class
    t = 211, p = 19717, D = -34347 = -3 * 107^2, a depth-1 107-volcano whose
    crater is a single j = 0 vertex among an enumerated ~37. CLAIM TIER toy. NO
    ATTACK, NO EXPONENT, NO SPEEDUP, sota_delta ZERO.

    CLAIM (H1, THE WITHIN-CLASS LEVEL ARM). Inside a single isogeny class every
    quantity the campaign regresses against -- disc End(E), volcano depth at ell,
    N(alpha_min), |Aut| -- is a function of the single integer f_E | f (T4;
    MATCHED-ORDER-DESIGN.md section 1). The within-class contrast is therefore
    ONE axis, not several, and its effective sample size is the number of VOLCANO
    LEVELS, not the number of curves. H1 is the claim that this axis is
    nonetheless worth measuring exactly once on a matched-order family, with the
    level assigned correctly, and that the honest deliverable is the measurement
    together with its own detection floor -- not a verdict dressed up as one.

    CLAIM (H2, THE T5 REACHABILITY GATE). A within-class variance result is NOT
    an attack. Under T5 a cost-minimising vertex is useful only if goodness is
    (i) common enough to hit by random walk, or (ii) decided by a LOCAL test
    evaluable at each step of a walk. H2 is the claim that on the t = 211 class
    both branches are directly measurable: the crater fraction is exactly
    1/(enumerated class size), and the local test is the count of F_p-rational
    107-isogenies from a vertex, which on a depth-1 volcano separates crater from
    floor. H2 asserts that this gate is evaluated and reported BEFORE any
    minimiser found by H1 is described as useful, and that the walk length is
    reported as a DISTRIBUTION OVER SEEDS and never as a point estimate.

    THE FIVE MANDATORY CONTROLS, EACH DISCHARGING A NAMED COMMITTED FAILURE, ARE
    PART OF THE CLAIM AND NOT OF THE IMPLEMENTATION. (1) Targets are sampled with
    targets_B (harness/exp_icinv_fullgroup.py:485); targets_uniform is
    PROHIBITED. (2) Every measurement is stratified on
    r = #{x in F_p : x^3 + a x + b = 0} and the strata are reported. (3) The
    volcano is built by VELU ISOGENIES; two_torsion_x_count is prohibited as a
    level proxy. (4) The factor-base density is SWEPT; the saturated row is never
    run alone. (5) The T5 gate is evaluated and reported with the walk-length
    distribution.

    WHAT IS NOT CLAIMED. No attack, no exponent, no speedup. No advantage beyond
    the automorphism-discounted rho baseline (KN-TECH-018), under which a factor
    at or below sqrt(6) is baseline calibration. H-ENDO-001 is the admissibility
    filter and is not retested; on the prime-order subgroup the volcano level is
    invisible because every endomorphism acts as a scalar, which is exactly why
    any effect must be routed through R1 (x-coordinates as field elements) and
    R3 (End(E) as a ring) and never through a group-operation output. Nothing
    here bears on H-STR-002 in either direction, so pause condition P2 is not
    triggered. Nothing here presumes H-ICINV-6c7920 true or false; this contract
    simply does not reuse the sampler that hypothesis disputes.

  mechanism: >-
    STEP 0 -- THE IDENTIFIABILITY CEILING, STATED FIRST BECAUSE IT BOUNDS
    EVERYTHING BELOW. On the campaign's own committed deep volcano (p = 4001,
    t = 30, D = -59 * 16^2) the true level distribution built by Velu is
    {0: 3, 1: 9, 2: 18, 3: 36, 4: 72} = 138, and the measured per-level m = 3
    rates were 0.4800 (n = 3), 0.4456 (n = 9), 0.4489 (n = 18), 0.4411 (n = 36),
    0.4519 (n = 72) with no monotone trend (red_team_notes.md section 10). At
    n = 3 the campaign's own chi-square detection-bound table
    (red_team_notes.md section 6) gives a floor of variance-ratio 3.668, i.e.
    nothing below a 9.8% excess is detectable at the crater. THE EFFECTIVE
    SAMPLE SIZE OF A WITHIN-CLASS LEVEL REGRESSION IS THE NUMBER OF LEVELS, AND
    THE MAXIMAL-ORDER LEVEL IS ALWAYS THE SMALLEST. This is a property of T4, not
    of p = 4001, and it applies unchanged to every class in the matched-order
    family. It is recorded here, before execution, so that a null result cannot
    later be reported as though the design had power it never had.

    STEP 1 -- WHAT DEPTH IS ACTUALLY AVAILABLE IN THE N = 19507 FAMILY, AND THE
    CONSEQUENCE. The family's conductor arm is f in {1, 3, 107}
    (MATCHED-ORDER-DESIGN.md section 3, derived in that session and not
    committed). Classes at f = 1 have NO within-class level axis at all; classes
    at f = 3 and f = 107 are DEPTH-1 volcanoes, so the within-class level
    contrast in this family is a two-level crater-versus-floor comparison and
    nothing deeper. On the f = 107 class the crater has ONE vertex, which
    supports a rank statement and no variance statement. On the f = 3 class the
    crater carries h(D_0) vertices and the floor about 3 h(D_0), which is the
    ONLY usable two-level contrast at reasonable n anywhere in this family. The
    run must report the ACTUAL enumerated per-level counts and the exact
    detection floor implied by them before reporting any level effect, and must
    say plainly that depth beyond 1 is untested by this contract.

    STEP 2 -- WHY THE LEVEL MUST BE BUILT BY VELU AND NOT COUNTED. The committed
    "volcano level" in this campaign was the 2-torsion count:
    ell_subgroup_count(E, ., 2) and exp_icinv.two_torsion_x_count are
    character-for-character the same expression, and their strata on the p = 4001
    class were {1: 72, 3: 66} -- the floor, and levels 0-3 POOLED
    (3 + 9 + 18 + 36 = 66). It resolved 2 of 5 levels (red_team_notes.md section
    10). The repair is to construct the ell-isogeny graph explicitly by Velu with
    an ell-torsion kernel, resolve edges up to the isomorphism
    (a, b) ~ (u^4 a, u^6 b), and assign each vertex its level by distance to the
    floor. On the p = 4001 class this reproduced {0: 3, 1: 9, 2: 18, 3: 36,
    4: 72}, matching h(D_0 f'^2) exactly. This contract requires the same
    construction at ell in {3, 107} on the matched-order family, with the
    per-level counts cross-checked against the class numbers of the corresponding
    orders and against the Hurwitz-Kronecker enumeration.

    STEP 3 -- WHY THE SAMPLER IS targets_B AND WHY THAT IS NOT A POSITION ON
    H-ICINV-6c7920. targets_uniform samples [h mod gen_order] G for a single base
    point G, so its support is the cyclic subgroup <G>; on r = 3 curves
    gen_order <= #E/2 and the estimand is uniform on at most half the group,
    while on r = 1 curves it is uniform on all of it, and r varies inside a
    single class. H-ICINV-6c7920 (status `specified`, live, NOT adjudicated)
    holds that the campaign's entire reported over-dispersion follows from this.
    THIS CONTRACT TAKES NO POSITION ON THAT QUESTION IN EITHER DIRECTION. It
    declines to reuse a sampler whose estimand is under dispute, because a
    within-class level contrast measured with a sampler whose coverage varies
    with r would confound level with r wherever the two are associated. Using
    targets_B and additionally stratifying on r makes that confound reportable
    rather than assumed away.

    STEP 4 -- WHY THE DENSITY MUST BE SWEPT. On the committed p = 4001 class the
    within-class over-dispersion decays monotonically as the factor base
    shrinks: variance ratio 2.037 at density 0.5306 (fb = 13), 1.826 at 0.3690,
    1.337 at 0.2237, 1.265 at 0.1144, 1.175 at 0.0745, 1.032 at 0.0437, 0.930 at
    0.0234 (red_team_notes.md section 4). The batch that produced the campaign's
    headline ran only the saturated row. The operating density for m = 3 is
    1/m! ~ 0.167, which sits between the 1.265 and 1.337 rows. A level effect
    that exists only at saturation is a statement about the factor base, not
    about the curve, and the sweep is what distinguishes them.

    STEP 5 -- THE T5 GATE, MADE OPERATIONAL. T5's two admissible branches are
    measured directly on the t = 211 class.
      BRANCH (i) COMMONNESS. The crater fraction is exactly 1 / (enumerated class
      size). A random walk on the volcano is run from recorded seeds, and the
      number of steps to first reach a crater vertex is recorded PER SEED. The
      deliverable is the empirical distribution over seeds -- minimum, median,
      maximum and the full list -- never a mean presented as the answer, and
      never a single draw. This is the direct discharge of committed failure mode
      N5, where a 94.7%-of-ceiling walk result rested on a single draw while the
      8-seed mean sat on the ceiling (BATCH-cb71b5 what_was_withdrawn).
      BRANCH (ii) LOCALITY. The candidate local test is the number of
      F_p-rational ell-isogenies from a vertex. On a depth-1 volcano a floor
      vertex has exactly one rational ell-isogeny, the ascending one, while a
      crater vertex has more, the exact count depending on the splitting of ell
      in the CM field. The run MEASURES the counts on every vertex of the class
      and reports whether the test separates crater from floor with no error,
      rather than assuming the textbook counts. A local test that separates makes
      goodness reachable in this class; a local test that does not makes the
      minimiser unreachable and kills the lane on cost even if H1 finds large
      variance -- which is the outcome DECOMPOSITION.md section 3 explicitly
      warns is the likely one.
      BOTH BRANCHES ARE SCOPED TO THIS CLASS. At a 37-vertex volcano a crater is
      1 in 37; at cryptographic scale a crater is one vertex among ~sqrt(p), and
      reaching a SPECIFIED curve is the vectorization problem underlying CSIDH,
      about p^{1/4} classically at best. Nothing measured here transfers, and the
      record must say so in the same breath as any positive reachability result.

    STEP 6 -- THE INSTRUMENT GATE. Every statistic used here is blocked behind
    both directions of EXP-INSTR-36c8cf under GOAL-ENDO-001 criterion C4. NULL-C
    is DISQUALIFIED outright for the within-class contrast by its own committed
    characterisation as a between-class MEAN detector with power 1.00 at a 0.9%
    shift (red_team_notes.md section 5) -- it is maximally sensitive to exactly
    the quantity this contrast holds fixed and says nothing about within-class
    structure. It may not be used here in either direction, and a result quoting
    it is inadmissible regardless of what it says.

  assumptions:
    - >-
      [fact] T4. Fixing the class fixes t, p, N, D, D_0 and f; within the class
      disc End(E) = D_0 f_E^2, the ell-volcano depth at a vertex is v_ell(f_E),
      N(alpha_min) ~ |D_0| f_E^2 / 4, and |Aut| = 2 unless D_0 in {-3, -4}. All
      four are functions of the single integer f_E.
    - >-
      [fact] On a depth-d ell-volcano, a floor vertex has exactly one
      F_p-rational ell-isogeny (ascending). The crater's count depends on the
      splitting of ell in the CM field and is MEASURED here, not assumed.
    - >-
      [committed] The true 2-volcano level distribution at p = 4001, t = 30 is
      {0: 3, 1: 9, 2: 18, 3: 36, 4: 72}, built by Velu and matching
      h(D_0 f'^2) exactly; the committed "levels_observed" strata {1: 72, 3: 66}
      were the 2-torsion count and resolved 2 of 5 levels. red_team_notes.md
      section 10. Used as the reason for the Velu requirement, not re-measured.
    - >-
      [committed] The density-decay table at p = 4001, variance ratio 2.037 ->
      0.930 as density falls 0.5306 -> 0.0234. red_team_notes.md section 4. Used
      as the reason for the density-sweep requirement.
    - >-
      [committed] NULL-C is a between-class mean detector with power 1.00 at a
      0.9% shift and median p = 0.059 at zero planted shift.
      red_team_notes.md section 5. Used as the reason NULL-C is prohibited here.
    - >-
      [derived in the design session, NOT COMMITTED, NOT EVIDENCE] The N = 19507
      family inventory and the structure of the t = 211, p = 19717,
      D = -3 * 107^2 class. Re-derived under an immutable run record in Stage 1
      of EXP-VOLC-9f5571; disagreement triggers PREMISE-FAILED.
    - >-
      [caveat, binding] For D_0 in {-3, -4} the Deuring correspondence weights
      j = 0 by 1/3 and j = 1728 by 1/2, so class numbers are not vertex counts;
      the campaign's Hurwitz-Kronecker enumeration is the authority on the exact
      vertex count of the t = 211 class.
    - >-
      [scope] Within-class depth in this family is 1. Depth beyond 1 is UNTESTED
      by this contract; the only deep volcano the campaign has enumerated is at
      p = 4001 and is not re-measured here. claim_tier toy.

  proof_search_map:
    bottleneck: >-
      Two committed defects sit between this campaign and any within-class level
      statement: the level variable was the 2-torsion count and resolved 2 of 5
      levels, and the only within-class dispersion statistic in use is disputed
      as a sampler artifact by a live hypothesis. Repairing the level variable by
      Velu construction and replacing the sampler with a certified full-group one
      is the whole of the bottleneck; neither repair requires a new idea, and
      until both are done no within-class number means anything.
    baseline_embedding:
      parameter_slice: >-
        The committed per-level table on the correct rebuilt volcano at
        p = 4001, t = 30: levels {0: 3, 1: 9, 2: 18, 3: 36, 4: 72} with mean
        rate_m3 0.4800 / 0.4456 / 0.4489 / 0.4411 / 0.4519 and sd 0.0173 /
        0.0430 / 0.0311 / 0.0382 / 0.0366, no monotone trend. That is the exact
        boundary of what the campaign's within-class level measurement has
        reached.
      reproduction_check: >-
        FROZEN REGRESSION FIXTURE, AND IT IS A GATE. Before any N = 19507
        measurement, the run must rebuild the p = 4001 2-volcano by Velu and
        reproduce the level distribution {0: 3, 1: 9, 2: 18, 3: 36, 4: 72}
        exactly, and must reproduce agreement between two_torsion_x_count and
        ell_subgroup_count(., 2) on all 138 curves (they are the same
        computation). This checks the Velu construction, which is the new
        machinery, against a committed object. Failure makes the run INVALID and
        returns it to the executor as a defect; it is not evidence about levels.
    observation_collision:
      observable: >-
        Per-level mean relation density inside one isogeny class, at a fixed
        factor-base density.
      distinct_preimage_search: >-
        A per-level difference has at least four distinct preimages and the
        contract separates them by construction: (i) a genuine endomorphism-ring
        effect; (ii) an r-composition difference between levels, since r varies
        within a class and may correlate with level -- separated by the mandatory
        r-stratification, and reported as a contingency table of r against level
        whether or not an effect is seen; (iii) a sampler-coverage difference,
        removed by using targets_B with certified full-group support;
        (iv) a saturation artifact, separated by the mandatory density sweep. A
        level effect that does not survive all four is not attributable to the
        endomorphism ring, and the record must say which one it failed.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Replace the scalar "level effect" by the quadruple (per-level mean and
          sd, r composition per level, per-density-row profile, and the T5
          reachability verdict with its walk-length distribution). The fibre of a
          level effect over its causes is then resolved by construction rather
          than by argument, and the T5 component makes the difference between a
          variance result and a usable one explicit in the deliverable itself.
        predicted_gain: >-
          Encoding: exact for the level assignment (Velu construction,
          cross-checked against class numbers) and exact for the sum sets;
          estimated only for the relation density, whose estimand is certified
          identical across vertices by the targets_B support certificate.
          Completeness: the quadruple reconstructs every claim the arm can make.
          Soundness: the level variable is constructed, not proxied. Transfer:
          DECLARED UNMET -- depth 1 only, one matched N, toy scale. Cost: one
          Velu graph construction per class plus the swept sum-set enumeration.
    quantifier_order: >-
      CLAIMED IN THIS ORDER FOR H1: FORALL classes in the conductor arm, FORALL
      density rows in the frozen grid, FORALL r strata with at least the declared
      reporting floor, the per-level means and their exact detection floor are
      reported; and the class-level statement is that a level association EXISTS
      or does not exist AT A SIZE THE DESIGN CAN DETECT. The weaker order
      (EXISTS a density row or a stratum at which a level difference appears) is
      explicitly NOT claimed. FOR H2: for the single t = 211 class, FORALL
      recorded seeds, the walk length to first crater is reported, and the local
      test is evaluated on EVERY vertex of the class -- an exhaustive statement
      about one class, quantified over nothing else.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that within depth-1 volcanoes of one matched-order family at
        N = 19507, with levels assigned by explicit Velu construction, under one
        factor-base rule, one certified full-group sampler and one declared
        density grid, relation density does or does not differ between crater and
        floor by more than the design's own detection floor; and that on one
        37-vertex class the crater is or is not reachable by random walk within a
        measured number of steps and is or is not separated by a local
        rational-isogeny count. It cannot certify anything about volcano depth
        greater than 1, about solving degree, about any attack, about any
        exponent, about reachability at any larger scale, or about the ECDLP in
        the prime-order subgroup.
      nearby_object_control: >-
        THE f = 1 CLASSES OF THE SAME FAMILY. They have the same N, the same
        construction, the same enumeration, the same sampler, the same factor-
        base rule and the same statistics -- and NO within-class level axis at
        all, because f_E = 1 is forced. Splitting an f = 1 class into two
        arbitrary declared halves and running the identical level comparison must
        produce NO effect. If it does produce one, the within-class statistic is
        detecting something other than level and every level result in this
        contract is withdrawn. This control is free and mandatory, and it is run
        and written to the record BEFORE the real level contrast is read.
    proof_obligations:
      - claim: >-
          The Velu-constructed ell-volcano reproduces the committed p = 4001
          level distribution {0: 3, 1: 9, 2: 18, 3: 36, 4: 72} exactly.
        responsibility: baseline
      - claim: >-
          Per-level vertex counts in the matched-order family agree with the
          class numbers of the corresponding orders and with the
          Hurwitz-Kronecker enumeration, with the Deuring weighting caveat
          honoured for D_0 = -3.
        responsibility: correctness
      - claim: >-
          targets_B's support equals E(F_p) as a set on every measured vertex,
          certified by enumeration.
        responsibility: correctness
      - claim: >-
          The reported detection floor is computed from the ACTUAL per-level
          vertex counts and target count, and no effect below it is reported as
          an effect.
        responsibility: strictness
      - claim: >-
          The T5 walk length is reported as a distribution over recorded seeds,
          and the local test is evaluated exhaustively on every vertex.
        responsibility: success_probability
      - claim: >-
          Nothing transfers to depth greater than 1, to another N, to any
          exponent, to reachability at scale, or to the ECDLP in G.
        responsibility: scope
    not_applicable_reason: null
    not_applicable_reason_note: >-
      Filled rather than excused. The hypothesis is empirical, but the T5 gate is
      a cost argument and the identifiability ceiling is a pre-compute
      falsification check; both are exactly what the four audits exist to force
      into the open before compute is spent.

  rerandomization: null
  rerandomization_note: >-
    The random walk of the T5 gate is a REACHABILITY MEASUREMENT, not a
    worst-to-average-case device. No instance is re-randomised and no solution is
    pulled back; the walk is on curves, not on points, and it is measured rather
    than assumed to mix. The GRH-conditional rapid mixing of the class-group
    Cayley graph cited in DECOMPOSITION.md section 3 is CITED, NOT PROVED, and is
    not load-bearing for anything measured here, because at 37 vertices the walk
    is measured exhaustively.

  asymptotic_claim: null
  asymptotic_claim_note: >-
    NO COMPLEXITY CLAIM OF ANY KIND. sota_delta ZERO on every axis.
    dominated_by: parallel Pollard rho with distinguished points at
    0.886 sqrt(N) group operations and O(1) memory (KN-TECH-001, KN-TECH-006),
    and on CM curves its automorphism-discounted variant (KN-TECH-018) where a
    factor at or below sqrt(6) is baseline calibration. A reachability
    measurement on a 37-vertex volcano is not a cost model and must never be
    reported as one; at cryptographic scale reaching a SPECIFIED curve is the
    CSIDH vectorization problem at about p^{1/4} classically at best.

  heuristic_assumptions:
    - id: HEUR-VOLC-1
      formal_statement: >-
        The number of F_p-rational ell-isogenies from a vertex is a LOCAL test
        that separates crater from floor on the depth-1 ell-volcanoes of the
        N = 19507 family: it takes one value on every crater vertex and a
        different value on every floor vertex, with no exceptions, and it is
        computable from the vertex alone without knowing the rest of the graph.
      random_model_justification: >-
        Not probabilistic. On a depth-d ell-volcano a floor vertex has exactly
        one rational ell-isogeny (ascending) and a non-floor vertex has more, the
        crater count depending on the splitting of ell in the CM field. This is
        standard volcano structure; it is recorded as a numbered heuristic
        because the operational claim -- that the count computed by this
        implementation separates the levels with zero error on every vertex of
        the class -- is an implementation fact that can fail, and because T5's
        entire branch (ii) rests on it.
      supporting_results: []
      supporting_results_note: >-
        No external citation asserted. The structure is standard and the
        separation is MEASURED exhaustively on all vertices of the class rather
        than assumed from the textbook counts.
      falsification_condition: >-
        Any vertex of the t = 211 class on which the rational-ell-isogeny count
        does not agree with its Velu-constructed level. Then the local test does
        not decide goodness, T5 branch (ii) fails for this class, and a
        cost-minimising crater is UNREACHABLE unless branch (i) carries it alone.
      validation_experiment_ids: [EXP-VOLC-9f5571]
    - id: HEUR-VOLC-2
      formal_statement: >-
        At the ACTUAL per-level vertex counts of the matched-order family's
        conductor arm and at the declared target count, the within-class
        dispersion statistic detects a PLANTED per-level shift of the smallest
        size the campaign would call meaningful, and does NOT fire on the f = 1
        matched null in which a class with no level axis is split into two
        arbitrary halves.
      random_model_justification: >-
        This is GOAL-ENDO-001 criterion C4 applied to this contract's own
        statistic, and it is stated as a heuristic rather than assumed because
        the campaign's own detection-bound table (red_team_notes.md section 6)
        shows the floor moving from variance-ratio 1.250 at n = 138 to 3.668 at
        n = 3 -- power is a strong function of stratum size, and the crater is
        always the smallest stratum. Assuming transfer of power across designs is
        the error this campaign has already made once with NULL-C.
      supporting_results: []
      supporting_results_note: >-
        No external citation. The prior characterisation is the campaign's own
        red-team measurement and is cited as the reason the heuristic cannot be
        assumed.
      falsification_condition: >-
        EXP-INSTR-36c8cf reports either direction failing at the actual per-level
        counts. Then GOAL-ENDO-001 pause condition P1 fires, every level
        measurement is marked attempted_and_inconclusive, and none of it is read
        as negative evidence about the endomorphism-ring mechanism.

  structural_ingredients:
    - description: >-
        Velu's formulae for constructing the quotient curve of an ell-isogeny
        with a given rational kernel, used to build the ell-isogeny graph
        explicitly and assign levels by distance to the floor.
      citation: >-
        Standard; the campaign's own red team implemented the ell = 2 case
        (kernel from a 2-torsion x-coordinate, v = 3 x0^2 + a, w = x0 v,
        a' = a - 5v, b' = b - 7w) and reproduced the class-number level counts
        exactly (red_team_notes.md section 10). No external citation asserted
        beyond that.
      role: constructs the level variable that replaces the 2-torsion proxy
    - description: >-
        Volcano structure of the ell-isogeny graph of an ordinary curve: levels
        indexed by v_ell(f_E), floor vertices with exactly one rational
        ell-isogeny, crater a Cayley graph of Cl(O).
      citation: >-
        Standard; used qualitatively and stated in DECOMPOSITION.md section 3.
        The crater's rational-isogeny count is measured rather than cited.
      role: supplies the local test for T5 branch (ii)
    - description: >-
        Hurwitz-Kronecker class-number mass formula for certifying complete class
        enumeration, with Deuring weights 1/3 at j = 0 and 1/2 at j = 1728.
      citation: >-
        Implemented in harness/isogeny_class.py:class_census; no external
        citation asserted beyond what that module documents.
      role: completeness certificate and per-level count cross-check

  reduction_chain:
    core_problem: >-
      Decide whether relation-collection density inside one isogeny class differs
      between correctly-assigned volcano levels by more than the design's own
      detection floor, and whether a cost-minimising vertex, if one exists, is
      reachable under T5.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. There is no corollary about the ECDLP, about solving
      degree, about volcano depth greater than 1, about any exponent, or about
      any curve at cryptographic scale, and none is claimed. The only downstream
      consequences permitted are a Coordinator decision on RQ-VOLC-f6253b scoped
      to N = 19507 and depth 1, and prioritisation within GOAL-ENDO-001.

  predictions:
    - metric: >-
        P1 -- Velu reconstruction gate: the level distribution of the p = 4001,
        t = 30 2-volcano rebuilt by this implementation
      direction: different
      minimum_effect: >-
        EXACTLY {0: 3, 1: 9, 2: 18, 3: 36, 4: 72} summing to 138, matching
        h(D_0 f'^2) at every level. Anything else is an implementation defect and
        makes the run INVALID. Costs minutes and can kill the contract before any
        matched-order measurement.
    - metric: >-
        P2 -- per-level vertex counts and the implied detection floor in the
        N = 19507 conductor arm
      direction: different
      minimum_effect: >-
        Reported BEFORE any level effect, as exact counts per level per class
        together with the chi-square dispersion detection floor those counts
        imply at the declared target count. No level effect below its own floor
        may be reported as an effect. The pre-registered expectation, from T4 and
        the design document's section 1, is that within-class depth in this
        family is 1 and the crater of the f = 107 class has exactly one vertex,
        which supports a rank statement and no variance statement.
    - metric: >-
        P3 -- crater-versus-floor difference in decomposition_rate_m3 inside each
        conductor-arm class, per density row, per r stratum
      direction: different
      minimum_effect: >-
        DIRECTION DELIBERATELY NOT FIXED, BECAUSE THE DESIGN DOCUMENT PREDICTS
        NONE AND NO FIGURE IS INVENTED HERE. DECOMPOSITION.md section 5
        prediction 2 records the campaign's standing expectation of NO effect
        stratified by volcano level, and the committed p = 4001 per-level table
        shows no monotone trend. The reported quantity is the per-level mean and
        sd with the exact detection floor of P2 alongside, at every density row.
        A difference is claimed only if it exceeds that floor at a majority of
        density rows in the swept grid and has the same sign in every r stratum
        with at least the reporting floor of members.
    - metric: >-
        P4 -- MATCHED NULL, READ FIRST: the identical level comparison run on an
        f = 1 class of the same family split into two arbitrary declared halves
      direction: different
      minimum_effect: >-
        NO effect at any density row. This verdict is computed and written to the
        run record BEFORE the real level contrast is read (null-first,
        docs/inventor-protocol.md). If the null class shows an effect, every
        level result in this contract is withdrawn and the deliverable is the
        instrument finding.
    - metric: >-
        P5 -- r composition against level, per class
      direction: different
      minimum_effect: >-
        Reported as an exact contingency table whether or not any level effect is
        seen. If r is associated with level, the level effect and the r effect
        are confounded within that class and the record must say so rather than
        attributing the difference to the endomorphism ring.
    - metric: >-
        P6 -- T5 BRANCH (i): number of random-walk steps to first reach a crater
        vertex of the t = 211 class, over recorded seeds
      direction: different
      minimum_effect: >-
        Reported as the FULL DISTRIBUTION over at least the declared seed count
        -- every per-seed value listed, plus minimum, median and maximum. A point
        estimate is prohibited. This directly discharges committed failure mode
        N5, where a single-draw walk result was withdrawn because the 8-seed mean
        sat on the ceiling.
    - metric: >-
        P7 -- T5 BRANCH (ii): agreement between the F_p-rational
        107-isogeny count and the Velu-assigned level, on EVERY vertex of the
        t = 211 class
      direction: different
      minimum_effect: >-
        EXHAUSTIVE, zero exceptions required for the local test to be declared
        available. The observed counts are reported as measured; the textbook
        expectation is NOT assumed. One disagreeing vertex refutes HEUR-VOLC-1
        and closes T5 branch (ii) for this class.
    - metric: >-
        P8 -- T5 VERDICT
      direction: different
      minimum_effect: >-
        A single recorded verdict in {reachable_by_commonness,
        reachable_by_local_test, both, neither}, computed inside the run from P6
        and P7 by a rule frozen here, and NOT selected afterwards. A `neither`
        verdict means any variance found by P3 is not usable and the lane dies on
        cost, which is an archivable result. A reachable verdict is scoped to
        this 37-vertex class ONLY and carries the mandatory statement that at
        cryptographic scale the corresponding problem is CSIDH vectorization.

  test_boundary:
    instances:
      - >-
        WITHIN-CLASS LEVEL ARM: the conductor-arm classes of the N = 19507
        matched-order family, f in {3, 107}, each certified complete by
        class_census, with levels assigned by explicit Velu ell-isogeny
        construction at ell = 3 and ell = 107 respectively.
      - >-
        MATCHED NULL: an f = 1 class of the same family, which has no level axis
        by construction, split into two arbitrary declared halves.
      - >-
        T5 GATE: the class t = 211, p = 19717, D = -34347 = -3 * 107^2; all
        enumerated vertices; crater (j = 0) versus floor.
      - >-
        FROZEN REGRESSION FIXTURE: the committed p = 4001, t = 30 class, used
        ONLY to gate the Velu construction against its committed level
        distribution. No new relation-density conclusion is drawn from it.
      - >-
        OUT OF SCOPE: volcano depth greater than 1; the between-class |D_0|
        contrast, which belongs to EXP-JINV-bd141d and may not be run here nor
        pooled with these results; a second matched N; supersingular classes;
        extension fields; any solving-degree or Groebner quantity; and every
        statement about the ECDLP in the prime-order subgroup.
    parameters:
      matched_order_N: 19507
      conductor_arm: [3, 107]
      t5_class: "t = 211, p = 19717, D = -34347 = -3 * 107^2"
      level_construction: "Velu ell-isogeny graph, edges up to (a,b) ~ (u^4 a, u^6 b), level by distance to floor"
      level_proxy_prohibited: >-
        two_torsion_x_count and ell_subgroup_count(., 2) are PROHIBITED as level
        variables. They are the same computation and resolved 2 of 5 levels on
        the committed class.
      sampler_required: "harness/exp_icinv_fullgroup.py:485 targets_B (full-group, two-generator)"
      sampler_prohibited: "targets_uniform (exp_icinv.targets_uniform) is PROHIBITED in every arm"
      stratification_required: "r = #{x in F_p : x^3 + a x + b = 0}, reported per stratum"
      density_sweep_required: true
      saturated_row_alone_prohibited: true
      operating_density_target: 0.16666666
      statistic_prohibited: >-
        exp_icinv.permutation_null (NULL-C) may NOT be used anywhere in this
        experiment, in either direction. It is a between-class MEAN detector with
        power 1.00 at a 0.9% shift and is disqualified for any within-class
        contrast.
      null_first_ordering: >-
        The f = 1 matched-null verdict is computed and written to the run record
        BEFORE the real level contrast is read.
      t5_walk_reporting: "full per-seed distribution; a point estimate is prohibited"
      t5_local_test: "count of F_p-rational ell-isogenies per vertex, measured exhaustively"
      instrument_gate: >-
        BLOCKING. No conclusion may be drawn from any statistic that has not
        passed both directions of EXP-INSTR-36c8cf at the ACTUAL per-level vertex
        counts of this design (GOAL-ENDO-001 criterion C4).
    implementation: >-
      New driver and new module over harness/isogeny_class.py, harness/toycurve.py
      and harness/exp_icinv_fullgroup.py, plus a new Velu ell-isogeny graph
      builder for general odd ell. harness/exp_icinv.py MUST NOT BE EDITED.
      Exact m = 2 and m = 3 sum-set enumeration; no solver, no Groebner basis.
      Sum sets are seed- and arm-independent and must be computed once per
      (vertex, factor-base size) and reused across every density row, seed and
      statistic. Run manifests must pin the hash of every source file executed
      (harness/runner.py:source_provenance, audited by
      tools/check_run_source_provenance.py --strict), the standing A6
      precondition carried from EXP-ICINV-4d33aa amendment v2.
    budget:
      wall_clock_seconds_per_run: 21600
      total_cpu_hours: 36
      maximum_memory_gb: 8
      maximum_runs: 24
      budget_provenance: >-
        COORDINATOR-SET. The design document states no budget for E2's
        within-class arm or for E3. These figures bound the task and are not
        derived from any measurement; exhausting them is a budget event under
        AGENTS.md rule 5, never a result.
      dominant_cost: >-
        Exact m = 3 sum-set enumeration over the conductor-arm vertices at
        #E = 19507, plus one Velu ell-isogeny graph construction per class at
        ell = 107 (degree-107 kernels, the heaviest single item). The T5 walk is
        negligible at 37 vertices.

  falsification_conditions:
    - >-
      F1 (MINUTES, THE PRIMARY GATE). The Velu construction fails to reproduce
      the committed p = 4001 level distribution {0: 3, 1: 9, 2: 18, 3: 36,
      4: 72}. Implementation defect; the run is INVALID and returns to the
      executor. Not evidence about levels.
    - >-
      F2. Stage 1 fails to reproduce the N = 19507 family or the t = 211 class
      structure. PREMISE-FAILED; the hypothesis is withdrawn as mis-specified
      rather than refuted.
    - >-
      F3. targets_B's certified support is not the full group on some measured
      vertex. PREMISE-FAILED.
    - >-
      F4 (THE MATCHED-NULL FAILURE). The f = 1 class split into arbitrary halves
      shows a level effect. The within-class statistic detects something other
      than level; every level result here is withdrawn and the deliverable is the
      instrument finding. Read FIRST, before the real contrast.
    - >-
      F5 (THE MAIN NEGATIVE, AND IT IS A RESULT). No crater-versus-floor
      difference exceeds the detection floor implied by the actual per-level
      counts, at a majority of density rows, in either statistic. Then
      DECOMPOSITION.md section 5 prediction 2 is strengthened at depth 1 on a
      matched-order family, RQ-VOLC-f6253b's level axis is closed AT DEPTH 1 AND
      AT N = 19507 with a named obstruction and an explicit test boundary, and
      the named successor is a deeper volcano at matched order.
    - >-
      F6 (T5 KILLS THE LANE ON COST). The T5 verdict is `neither`: the crater is
      not commonly hit by random walk within the declared seed budget and the
      local rational-isogeny test does not separate the levels without error.
      Then any variance found by P3 is unusable and the lane dies on cost even if
      the variance is large. This is an archivable result and is the outcome
      DECOMPOSITION.md section 3 warns is likely.
    - >-
      F7. EXP-INSTR-36c8cf fails either direction at the actual per-level counts
      (HEUR-VOLC-2 refuted). Pause condition P1 fires; every level measurement is
      marked attempted_and_inconclusive and NEVER read as negative evidence.
    - >-
      F8. Any within-class result is quoted from NULL-C, or from a
      targets_uniform draw, or from the saturated density row alone, or from a
      2-torsion level proxy, or from a single-seed walk. Any one of these makes
      the run INVALID as a contract violation, not a result.
    - >-
      F9 (PLANNED NEGATIVE, PRE-REGISTERED). If the level arm is null, the batch
      does not get to emit "no effect" and stop. It must emit the per-level
      counts, the detection floor those counts imply, the matched-null verdict,
      the r-against-level contingency tables, the full density profile, the T5
      walk distribution and local-test result, and a named successor with its
      cost -- at minimum a matched-order family with depth greater than 1. A
      negative that names no successor has not finished and its honest status is
      unverified (docs/inventor-protocol.md closure standard).

  interpretation_limits:
    - >-
      claim_tier toy and no downstream citation may raise it. N = 19507, p near
      2^14.3, 37-vertex volcano. Nothing here is a statement about any
      cryptographic parameter.
    - >-
      DEPTH 1 ONLY. The within-class level axis in this family is a
      crater-versus-floor contrast; depth greater than 1 is untested here. The
      only deep volcano the campaign has enumerated is at p = 4001 and is used in
      this contract solely as a gate on the Velu construction.
    - >-
      A VARIANCE RESULT IS NOT AN ATTACK. T5 is binding: without a reachable
      minimiser the lane dies on cost regardless of variance. Even a `reachable`
      verdict here is a statement about a 37-vertex volcano at 14 bits; at
      cryptographic scale reaching a specified curve is CSIDH vectorization, at
      best about p^{1/4} classically, and the record must say so alongside any
      positive reachability finding.
    - >-
      THE EFFECTIVE SAMPLE SIZE IS THE NUMBER OF LEVELS, NOT THE NUMBER OF
      CURVES, and the maximal-order level is always the smallest. That is T4, not
      a property of any particular prime. A null here is bounded by the
      detection floor reported in P2 and may not be stated more strongly than
      that floor allows.
    - >-
      H-ENDO-001 is the admissibility filter and is NOT retested; on the
      prime-order subgroup the level is invisible, so any effect must route
      through R1/R3. KN-FIND-b7e091's generic-group closure is binding and is not
      revisited.
    - >-
      Nothing here bears on H-STR-002 in either direction, so pause condition P2
      is not triggered; and nothing here presumes H-ICINV-6c7920 true or false --
      it declines to reuse the disputed sampler, which is a different act from
      adjudicating it.
    - >-
      RESULTS FROM THIS CONTRACT AND FROM EXP-JINV-bd141d MAY NOT BE POOLED. The
      between-class and within-class contrasts answer different questions and the
      design document requires them reported separately.

