    test_boundary:
      instances:
        - K-571 and B-571 for the surface; K-283 and B-283 for the proves-too-much control (PTM-A)
        - K-163, B-163, K-233, B-233, ECC2-238 and ECC2K-238 for PTM-B and G4 (239 replaces 131, D-6)
        - every curve at the fifteen claim-(A) degrees, each only as a parameter label in a cost formula; no curve is instantiated
      parameters:
        model: the restricted model (dense, fixed omega, block size n); M5, M7 and M8 outside it
        D_grid: integers 2 to 64
        omega_scored: [3.0]
        omega_unscored_in_domain: [2.376, 2.807]
        omega_out_of_domain: [2.0]
        omega_note: >-
          Only omega = 3 is scored and gated (D-6). The unscored in-domain
          blocks and the out-of-domain 2.0 block are reported, flagged, and
          enter no prediction, class or threshold.
        readings: [R-B, R-M]
        m_range: integers 2 to 30, t = m, for the threshold table; m* = 12 at 571 for the scored cells
        k_reading: unceiled k = n/m (MI-1); ceiled reported as the non-gating column C-CEIL
        kappa: 1 for the time-only surface
      implementation: >-
