      - id: H2
        name: D_solve(n, m, k) law of the true solving degree
        defects: D-5 H2-N and D-8 FD-H2 carried; one k reading at the comparison (O-J4-3) carried; VERSION 4 the refusal at another k or t (RV3-8) and the comparison column under PF-2 (DI-MI2)
        formal_statement: >-
          The true (U-4-discharged) solving degree D_solve(n, m, k) of the
          m-shape Weil-descent summation system (5) on a subspace factor base,
          at extension degree n with t = m and integer factor-base dimension k
          (the paper's k = ceil(n/m); k = 48 at n = 571, m = 12), read in
          Semaev's d_F4 convention as IR-2 of the contract pins it, follows a
          law in (n, m) that a toy ladder at n in N_toy can identify and
          extrapolate to (n, m, k) = (571, 12, 48) with a stated band. The
          cost model's unceiled k = n/m (MI-1) is a choice of the cost side and
          is not an argument of H2. H2 is a statement about D_solve only: a
          first fall degree, a maximal step degree or a fake degree d'_F is not
          D_solve and enters only through H6 (first fall) or the U-4
          bookkeeping of KN-FIND-936151 section 4 (fake degree); H2 has no
          first-fall route of its own (FD-H2). ONE k READING AT THE COMPARISON
          (O-J4-3, carried): wherever a D_solve under H2 is compared with a
          threshold of EXP-NISTBIN-451dfa (E1, E2, the contract's input rule
          IR-2), the comparison is made against the C-CEIL-T entry at the same
          m, whose A(571, m) uses the same integer k = ceil(571/m) as the
          measured system and, VERSION 4 (DI-MI2), the in-force P form PF-2,
          with the in-force MI-1 entry beside it; every MI-1 entry is no later
          than its C-CEIL-T entry. VERSION 4 (RV3-8): a D_solve measured at an
          integer k other than ceil(n/m), or at a chain length t other than m,
          is not compared with any threshold of this contract for E1 or E2; it
          is refused for both, and still routes under RT-3.
        rigorous_support: >-
          None. Assumption 1 asserts a bound (d_F4 <= 4) that is checked in this
          program only at n <= 21, and KN-FIND-936151 removes the route by which
          a measured fake degree could bound the true one universally.
        random_model_justification: >-
          The comparison distribution named by the proposal is the generic
          degree of regularity of a random system of matched shape (the random
          system null), which belongs with Part 3.
        supporting_results: []
        validation_route: >-
