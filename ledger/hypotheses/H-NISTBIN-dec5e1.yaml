    proof_search_map:
      note: >-
        Summary of version 2. The five audits, the revised frozen C2 fixture
        and the C1-C8 table are in the version-2 design audit sheet
        coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-b67954/design/TASK-20260925-c38ac6/proof-search-map-audit.yaml.
      bottleneck: >-
        D-8 S-4. The per-solve cost n^(4 omega) of block_n4w, whose degree
        bound 4 this contract replaces by the axis D. It is one of several
        modelling inputs of comparable leverage at 571, not the one integer on
        which the margin rests (mechanism above: 27.47 bits per R-B degree
        step at omega 3 with 9.16 bits of Macaulay rows; 22.86 bits for omega
        from 3 to 2.376 with no memory change; 26.75 bits for block_n4w against
        macaulay4, whose Macaulay-row memory is missing, not estimated).
        Replacing it by an axis is decision-changing because it
        fixes, as D*(m) over m, the threshold a later true-degree measurement
        is read against.
      baseline_embedding:
