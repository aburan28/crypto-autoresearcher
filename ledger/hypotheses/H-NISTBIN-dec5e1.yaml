  proof_search_map:
    note: >-
      Summary. The full five audits, the frozen C2 regression fixture, the
      interface lemma and every hand computation are in the design audit sheet.
    bottleneck: >-
      The sign of the 571 margin in Semaev's own model is set by one integer,
      the solving degree of the m = 12 descended system, which enters the
      per-solve cost as an exponent and has never been measured near n = 571.
      The step whose removal changes the conclusion is the degree bound 4 in
      n^(4 omega). Replacing it by an axis D and locating the zero D* is the
      bottleneck removal. It is decision-changing because it fixes the
      threshold any later true-degree measurement must be read against.
    baseline_embedding:
      parameter_slice: >-
        D = 4, omega = 3, n = 571, stage 1 only, t = m, m in 2..30, unceiled k,
        cofactor charged: the frozen instrument's own evaluation, reported by
        EXP-SEMBIN-992e73 (RUN-SEMBIN-a7a2f3) as log2 cost 186.307 with
        m* = 12 and by the approved instrument run RUN-SEMBIN-aa5161 as the
        same value.
      reproduction_check: >-
        Frozen regression fixture F1 (the design audit's frozen_c2_fixture):
        the instrument, loaded read-only through the declared call
        convention, must return |log2 cost - 186.307| <= 5.0e-4 bits with
        m* = t* = 12 before anything else is computed. Identity checks F2 then
        require R-B and R-M at D = 4 to equal the instrument to 1e-9 bits at
        every omega on the grid. No D* is computed unless F1, F2, the rho
        gate G1 and the control gate G4 pass.
    observation_collision:
      observable: >-
        The pair (D*_B(omega), D*_M(omega)) per 571 curve, read from the sign of
        the time-only margin against the corrected column.
      distinct_preimage_search: >-
        Known collision, exhibited rather than searched for: R-B and R-M agree
        exactly at D = 4, so the fixture cannot distinguish them, yet they
        diverge by omega times (log2 D! - log2 4!) to first order off D = 4.
        A single reconciled D* read from either alone would be a collision
        reading. Resolved by reporting the interval. The second known
        collision is a fake degree d'_F <= 4 presented as the D that feeds the
        surface; it is excluded by input rule IR-1 (no measured degree of any
        kind is an input).
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The surface cost_571(D, omega) under R-B and R-M with the zero locus
          D*(omega) and the memory figure beside every time figure.
        predicted_gain: >-
          Replaces an unqualified point estimate with a threshold that a
          later true-degree measurement can be read against.
    quantifier_order: >-
      FOR EACH curve c in {K-571, B-571}, reading R in {R-B, R-M} and omega in
      the declared grid, D*_R(c, omega) is DEFINED as the least integer D in
      2..64 with margin > 0, and the derived statement is that FOR ALL integer
      D in 2..64 the margin is negative iff D < D*_R(c, omega), conditional on
      H1, H3 and H4. No quantifier ranges over the true solving degree. The
      cliff is derived; which side the true degree falls on is measured
      elsewhere (Part 3, not designed).
    method_ceiling:
      strongest_certifiable_claim: >-
        D*(omega) in the reconciled model, assuming H1: for each 571 curve and
        in-domain omega, the interval [D*_B, D*_M] at which the model's
        time-only cost first exceeds the corrected matched-rho figure.
        Nothing about the true solving degree, nothing about any other
        solving method, and nothing about the security of any curve.
      nearby_object_control: >-
        The 283 proves-too-much control and PTM-B at 163, 233 and 131
        (ECC2K-130, ECC2-131), at D = 4 and omega = 3 against the corrected
        column: the rules must place each on the rho-wins side, as the frozen
        evaluation does. The random-system null belongs with Part 3.
    proof_obligations:
      - {claim: 'F1 fixture reproduces the frozen 571 row', responsibility: baseline}
      - {claim: 'L-EXT, R-B and R-M coincide with the instrument at D = 4', responsibility: baseline}
      - {claim: 'L-ARG, the optimising m is independent of D and omega', responsibility: size}
      - {claim: 'L-INT, illustrative-to-block_n4w interface with named multipliers', responsibility: interface}
      - {claim: 'L-MON, margin strictly increasing in D on 2..64', responsibility: correctness}
      - {claim: 'L-SPREAD, R-B cost >= R-M cost for D >= 4, so D*_B <= D*_M', responsibility: interface}
      - {claim: 'L-UB, matched rho < naive rho on every ordinary binary curve', responsibility: scope}
      - {claim: 'L-MONO, time-only loss implies coherent product-metric loss', responsibility: scope}
      - {claim: 'L-ASM, assembly of the D* statement from the lemmas and gates', responsibility: runtime}
    not_applicable_reason: null

