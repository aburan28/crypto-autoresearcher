      - id: H5
        name: transfer of H1 from the toy range to n = 571 at every m of the M-SET under both k readings, and to n = 283 at m = 9
        defects: D-5 H1-Q and H1-S carried; restated for H1's upper edge (RD-5) carried; VERSION 4 route T of RV3-7 (OBJ-J4-4, O-RT-04), with its random-model justification, falsification condition, validation pointer and the per-m span beside the table
        route_chosen: >-
          ROUTE T of RV3-7, not route S. Why: the threshold handed to
          GOAL-SEMBIN-fcb7a2 is, by DEC-20260924-124667 D-4 and every version
          since, the table D*(m) over the M-SET, never a value at one m (V-9),
          and E1 and E2 quantify over m; scoping them to m = 12 by rule (route
          S) would change the object handed on and make the table unscored
          context, so that a toy ladder could no longer be read against the
          table at its own m. Route T keeps the handed object and makes its
          extrapolation explicit at every m, with the span printed beside each.
        formal_statement: >-
          The upper edge of H1, with the same reading S_B, the same one-step
          tolerance, the same omega domain and the same solving-degree
          convention (IR-2), holds at n = 571 at EVERY m = t of the M-SET 2..30,
          under BOTH k readings: k = 571/m (MI-1), at which the cost model and
          the in-force threshold table are evaluated, and k = ceil(571/m), at
          which a system (5) is actually built and the comparison column
          C-CEIL-T is evaluated; and at n = 283 with m = t = 9 (the
          nearby-object surface); at every grid degree at which a D*, a
          threshold-table entry or a comparison-column entry is read. No lower
          edge is transferred, because H1 asserts none.
        random_model_justification: >-
          The transfer rests on the source's own modelling of system (5) as a
          generic system of its shape: Semaev 2015 prices every m and n by the
          same block-structured estimate with block size n and degree bound 4
          (Assumption 1 and the block conjecture H1a, both stated in the source
          as heuristics), so that under that model the per-solve cost depends
          on (n, m, k) only through the block size n and the solving degree,
          and the upper edge of H1 carries over uniformly in m and in the k
          reading. The comparison distribution is the matched-shape random
          null: the solving degree and per-solve cost of a random Boolean
          system with the same number of variables (N5 of system (5) at that
          (n, m, k)), equations and equation degrees. H5 asserts that system (5)
          is not costlier than that model allows at any m of the M-SET; it is
          a modelling transfer, not a distributional result, and no source read
          by this program supports it beyond the toy range.
        extrapolation_span: >-
          Design figures (the contract's code block CB-3, output per_m_span,
          allowed session computation C-4), as RQ-NISTBIN-06157b requires,
          against the source's measurements as the red team
          TASK-20260924-e0a065 reads them (n <= 21 with one row at 40, t <= 6,
          at most 60 Boolean variables, D = 4 only; the reviewer's reading,
          attributed, not re-read here). At EVERY m of the M-SET the span is
          printed on its own line beside the threshold table: the Boolean
          variable count N5 = m k + (m - 2) 571 of system (5) at t = m under
          MI-1 and under the ceiled reading, its ratio to 60 (from about 9.5 at
          m = 2 to about 276 at m = 30, under either k reading), the
          chain-length ratio m/6, the n ratios 571/21 = 27.2 and 571/40 = 14.3,
          and one measured degree against the grid 2..64. At the scored
          m* = 12 the variable ratio is 104.7 (6281/60 under MI-1). No time
          figure stands in this span.
        rigorous_support: None. H5 is an extrapolation.
        supporting_results: []
        validation_route: >-
          SCHEDULED AS A POINTER to GOAL-SEMBIN-fcb7a2 (Part 3, not designed
          here under DEC-20260924-99ce20 S1; the goal head read under C4 by
          S-P4 shows no D_solve sensitivity surface): a toy ladder of system
          (5) at growing n and over m, m = 2 included, at k = ceil(n/m) and
          t = m, with the matched-shape random null at each rung, is the
          experiment that would test the uniformity in n and in m that H5
          presupposes. Not reachable at n = 571 by any direct computation named
          in this program.
        validation_experiment_ids: []
        falsification_condition: >-
          Over a toy ladder (GOAL-SEMBIN-fcb7a2), any of (a) a trend in n of
          the measured per-solve cost of system (5) at the d_F4 solving degree
          relative to H1's upper edge, the cost staying within one degree step
          above S_B at small n and exceeding that edge as n grows; (b) a trend
          in m at fixed n, the same drift as m grows, or the edge failing at
          m = 2 (the M-SET's lower end, where N5 = n under MI-1 and system (5)
          is one block); (c) a dependence on the shape the k reading builds,
          the edge holding at one integer k and failing at k = ceil(n/m); (d)
          disagreement with the matched-shape random null, the measured cost
          of system (5) exceeding the upper edge by more than one degree step
          at a rung at which the random system of matched shape stays within
          it. Each would show that the transfer is not uniform in n, in m or in
          the system's structure.
    predictions:
      - id: P-T
        declared_by: version 4 (RV3-6, RV3-7); supersedes and restates the version_3 P-T
        metric: >-
          the threshold table D*_R(c, 3.0, m) over the M-SET 2..30, both curves
          and both readings, under MI-1 and MI-2's PF-2, with the ceiled column
          C-CEIL-T, the first-order column C-PF1-T and the per-m span of H5
