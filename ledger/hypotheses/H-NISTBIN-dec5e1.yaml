    approval_note_version_3: >-
      Version 3 moves to approved only together with EXP-NISTBIN-451dfa
      version 3, and only if DEC-20261002-353743 is official with decision
      approve naming 'EXP-NISTBIN-451dfa version 3'. The status field is
      advanced by the first card of a successor execution batch
      (DEC-20260924-f0a9c7 R4), never by this block.
    mechanism: >-
      VERSION 3 (D-8 S-3 carried; RD-2; RD-5). PER-ATTEMPT COST x INVERSE
      SUCCESS PROBABILITY. Section 4.5.2 of Semaev 2015 prices stage 1 as 2^k
      relations needed, each costing one solve of system (5) divided by the
      per-attempt relation probability P(n, m, m, k) ~ 2^(mk-n)/m!. In log2,
      stage 1 = A(n, m) + S, where A(n, m) = k - log2 P is the D-independent
      relation-count and inverse-yield part (k = n/m under MI-1) and S is the
      per-solve cost. The frozen block_n4w reading sets S = 4 omega log2 n,
      the 4 being the degree bound of Assumption 1 (d_F4 <= 4) applied to a
      block of n Boolean variables. The 571 margin that EXP-SEMBIN-992e73
      reports (a design artifact under DEC-20260918-4b7e21, not evidence) does
      not rest on that integer alone. Design figures at n = 571: one R-B degree
      step moves the cost by 27.47 bits at omega 3 and the Macaulay rows by
      9.16 bits (relation store unchanged at 2^47.58); moving omega from 3 to
      2.376 moves the D = 4 cost by 22.86 bits and no memory (rows 2^36.63 or
      2^32.04 and relation store 2^47.58 at both omegas); and the choice
      between the block_n4w and macaulay4 readings moves it by 26.75 bits
      (213.0618 against 186.307; the macaulay4 figure is RUN-SEMBIN-aa5161's,
      total-cost joint convention at its own argmin m = t = 10 under MI-1),
      with memory beside both: block_n4w has Macaulay rows 2^36.63 (R-B form)
      and relation store 2^47.58 at m* = 12, and macaulay4 has Macaulay rows
      2^44.72 = W(N5, 4), N5 = 5139 Boolean variables of system (5), and
      relation store 2^57.10 at m = t = 10, so the reading move adds 8.09
      bits of Macaulay rows and 9.52 bits of relation store (time figures
      carried from the version-2 sheet WC5, cited; memory
      from the contract's code block CB-2, allowed session computation C-4).
      Each is of the same order as the others and each is a fraction of the
      margin, 93.4 bits (K-571) to 98.5 bits (B-571) in magnitude at D = 4,
      omega 3, with Macaulay rows 2^36.63 (R-B) or 2^32.04 (R-M) and relation
      store 2^47.58 beside it. The degree is the input this contract turns
      into an axis because it is the input a later true-degree measurement can
      be read against; omega is scored at 3 only and the reading choice is
      held fixed by the restricted model. Making D an axis turns a point
      estimate into a line, and the line crosses the rho column at D*. Because
      S does not depend on m or t in either reading, the model's optimising m
      is the same at every D and omega (L-ARG); the true solving degree may
      depend on m (H2), so the threshold is carried as D*(m) over the M-SET,
      each entry at most D*(m*) (M8). R-B and R-M differ off D = 4 by the
      degree normaliser, so D* is reported as the interval spanned by the two
      readings: an interval between readings, not a bound on any true cost in
      either direction; H1 (version 3) bounds the per-solve cost from above
      only (RD-5).
    heuristic_assumptions:
      - id: H1
        name: XL / block-structured cost model for the per-solve cost, over the toy range, upper edge only
        defects: D-5 H1-Q, H1-V and H1-C carried; H1-L discharged by removing the lower edge (RD-5); D-7 MI-1 carried in, with its direction and consequence (RD-3, RD-8)
        formal_statement: >-
          For every extension degree n in the TOY RANGE N_toy (the degrees at
          which the source measured, n <= 21 with one row at 40 as the red team
          TASK-20260924-e0a065 reads Semaev 2015, and the degrees of any toy
          ladder GOAL-SEMBIN-fcb7a2 runs on the descended system), every
          m = t in 2..30 at which system (5) is defined there, with k = n/m in
          the cost model (MI-1), a solve of the Weil-descended system (5) of
          Semaev 2015 completing at maximal degree D (grid 2..64) costs 2^S
          operations with S AT MOST S_B(n, D, omega) + omega log2 n, that is,
          at most the R-B reading S_B(n, D, omega) = D omega log2 n plus one
          degree step (omega log2 n bits), where omega is the dense
          linear-algebra constant in Semaev's domain 2.376 <= omega <= 3. It
          includes H1a, Semaev's conjecture that a block-structured Groebner
          algorithm with block size n applies to (5) ("We think the same
          approach is applicable", Section 4.5.2). H1 asserts NO LOWER EDGE:
          neither S_M(n, D, omega) = omega (W(n, D) - W(n, 4) + 4 log2 n),
          with W(n, D) = log2 of the sum over d <= D of binom(n, d), nor any
          other quantity is claimed to bound S from below. H1 asserts nothing
          at n = 571 or 283; that step is H5.
        lower_edge: >-
          H1-L DISCHARGED BY REMOVAL (RD-5, the second route
          DEC-20260925-41f6dc offers). The lower edge is gone from BOTH the
          formal statement above and the falsification condition below; S_M is
          not claimed to bound any solving cost. R-M remains a second reading
          of the per-solve cost that the contract carries (reading_R_M),
          anchored to the instrument at D = 4, and [S_M, S_B] is an interval
          between readings, not a bound in either direction. WHY REMOVAL AND
          NOT SUPPORT: the standard XL/Macaulay argument bounds ONE dense
          elimination of the degree-D Macaulay matrix from above; no source
          read by this program bounds every algorithm that solves (5) at
          degree D from below, so supporting S_M as a lower bound would need an
          argument the program does not have. CONSEQUENCE: E2 (the contract's
          definitions.e1_e2) now names the lower edge it would need instead of
          resting on H1, and its "+ 1" is reconciled with the one-step
          tolerance. The R-M anchor (omega g(4) = 13.77 bits of time at 571,
          omega 3; version-2 sheet WC4, cited; Macaulay rows 2^32.04 = W(571, 4)
          in both the anchored and unanchored R-M forms, so the anchor moves
          time only) is a property of the R-M reading, not of H1.
        mi_1: >-
          D-7 with RD-3 and RD-8: k = n/m is the numbered model-identification
          choice MI-1 of the contract (the paper defines k = ceil(n/m) and
          evaluates its Section 4.5.2 optimisation at k = n/m). DIRECTION: the
          ceiled reading LOWERS the stage-1 cost, the sense of Semaev's "at
          most". CONSEQUENCE at every degree where MI-1 is used (design
          figures, the contract's code block CB-2 under allowed session
          computation C-4; memory beside each): at 571, C_I 186.3070 at
          m* = 12 becomes 175.1383 at m* = 15 (11.1686 bits lower), Macaulay
          rows unchanged at 2^36.63 (R-B) or 2^32.04 (R-M), relation store
          2^47.58 to 2^39; at the 283 pass-rule target, 147.6495 at m* = 9
          becomes 141.5270 at m* = 10 (6.1225 bits lower), rows unchanged at
          2^32.58 or 2^27.98, relation store 2^31.44 to 2^29; at 359, 159.5451
          at m* = 10 becomes 156.1046 at m* = 11 (3.4406 bits lower), rows
          unchanged at 2^33.95 or 2^29.36, relation store 2^35.90 to 2^33;
          every other claim-(A) degree in the audit sheet's CB-2 output
          kreading_table, where every move is downward. The BATCH-b67954
          reviewers' figures at these three degrees, as DEC-20260924-124667
          and DEC-20260925-41f6dc record them (provenance internal, attributed,
          not this producer's), agree. F1 identifies the frozen instrument's
          reading, not a model the published text alone determines. The per-m
          threshold D*(m) is read under MI-1, with the ceiled column C-CEIL-T
          reported and handed beside it; every MI-1 entry is no later than its
          C-CEIL-T entry (the contract's MI-1.bias_of_the_handed_table).
        rigorous_support: >-
          As version 1: the degree-D Macaulay matrix of a Boolean system in n
          variables has 2^W(n, D) columns, at most n^D for n >= 2 and D >= 2,
          and dense elimination costs (dimension)^omega, a rigorous upper bound
          on one elimination at degree D. Not rigorous: H1a; that one
          elimination at the solving degree is the whole solve; and that row
          weight, block count and unit conversion are negligible (M5, M6,
          kappa). Nothing here is a lower bound.
        random_model_justification: None claimed. H1 is a cost-model heuristic, not a distributional one.
        supporting_results:
          - >-
            Semaev 2015 Section 4.5.2, eq. (15) (inputs/SEMAEV-2015-310/paper_fulltext.md
            lines 1060-1091), provenance retrieved, read by TASK-20260924-fda726
            (carried from version 1; not re-read by S-P3).
        validation_route: >-
          H1-C: NOT validated inside EXP-NISTBIN-451dfa. Its in-contract
          checks (F1 and F2 at D = 4; G4 at the known-truth degrees 163, 233,
          239 and 283) are INSTRUMENT CONSISTENCY: they show the surface is the
          frozen instrument and does not prove too much, and they bear on the
          instrument, not on H1. H1 is externally testable at toy n by a
          measured per-solve cost against degree; that is scheduled only as a
          pointer to GOAL-SEMBIN-fcb7a2 (SDEG/ICPERF territory), not designed.
        validation_experiment_ids: []
        falsification_condition: >-
          H1-V, external only, at n in N_toy, and ONE-SIDED (RD-5): a measured
          per-solve cost of system (5) at a solving degree D that EXCEEDS
          S_B(n, D, omega) by more than one degree step (omega log2 n bits). A
          measured cost below S_M, or below any other quantity, falsifies
          nothing, because H1 asserts no lower edge. A failure of F1, F2 or G4
          is not a falsification of H1: under the contract's VOID rules it
          voids the run as an instrument inconsistency, and no outcome of
          EXP-NISTBIN-451dfa falsifies H1.
      - id: H2
        name: D_solve(n, m, k) law of the true solving degree
        defects: D-5 H2-N and D-8 FD-H2 carried; one k reading at the comparison under O-J4-3
        formal_statement: >-
          The true (U-4-discharged) solving degree D_solve(n, m, k) of the
          m-shape Weil-descent summation system (5) on a subspace factor base,
          at extension degree n with t = m and integer factor-base dimension k
          (the paper's k = ceil(n/m); k = 48 at n = 571, m = 12), read in
          Semaev's d_F4 convention as IR-2 of the contract pins it, follows a
          law in (n, m) that a toy ladder at n in N_toy can identify and
          extrapolate to (n, m, k) = (571, 12, 48) with a stated band. The
          cost model's unceiled k = n/m (MI-1) is a choice of the cost side and
          is not an argument of H2. H2 is a statement about D_solve only: a
          first fall degree, a maximal step degree or a fake degree d'_F is not
          D_solve and enters only through H6 (first fall) or the U-4
          bookkeeping of KN-FIND-936151 section 4 (fake degree); H2 has no
          first-fall route of its own (FD-H2). VERSION 3 (O-J4-3), ONE k
          READING AT THE COMPARISON: wherever a D_solve under H2 is compared
          with a threshold of EXP-NISTBIN-451dfa (E1, E2, the contract's input
          rule IR-2), the comparison is made against the C-CEIL-T entry at the
          same m, whose A(571, m) uses the same integer k = ceil(571/m) as the
          measured system, with the MI-1 entry beside it; every MI-1 entry is
          no later than its C-CEIL-T entry.
        rigorous_support: >-
          None. Assumption 1 asserts a bound (d_F4 <= 4) that is checked in this
          program only at n <= 21, and KN-FIND-936151 removes the route by which
          a measured fake degree could bound the true one universally.
        random_model_justification: >-
          The comparison distribution named by the proposal is the generic
          degree of regularity of a random system of matched shape (the random
          system null), which belongs with Part 3.
        supporting_results: []
        validation_route: >-
          SCHEDULED AS A POINTER to GOAL-SEMBIN-fcb7a2 (Part 3 under
          DEC-20260924-4f8a03 R2 and DEC-20260924-99ce20 S1), with the
          per-instance discharge requirement IR-2. Not designed, not validated
          and not used by any prediction below.
        validation_experiment_ids: []
        falsification_condition: >-
          A toy-ladder fit over (n, m) whose residuals grow with m or with n (a
          masked super-linear term), or disagreement with the random-system
          null of matched shape.
      - id: H5
        name: transfer of H1 from the toy range to n = 571 and n = 283
        defects: D-5 H1-Q and H1-S carried; restated for H1's upper edge under RD-5
        formal_statement: >-
          The upper edge of H1, with the same reading S_B, the same one-step
          tolerance and the same omega domain, holds at n = 571 with
          m = t = 12 and k = 571/12 (MI-1), and at n = 283 with m = t = 9, at
          every grid degree at which a D* or a threshold-table entry is read.
          No lower edge is transferred, because H1 asserts none.
        extrapolation_span: >-
          Design figures, hand arithmetic (version-2 sheet WC6, cited), as
          RQ-NISTBIN-06157b requires. Against the source's measurements as the
          red team TASK-20260924-e0a065 reads them (n <= 21 with one row at 40,
          t <= 6, at most 60 Boolean variables, D = 4 only; the reviewer's
