        plus read-only import of the frozen instrument, with an independent
        second implementation that imports neither. No solver, no Groebner,
        XL, SAT or F4 engine, no curve, no field arithmetic, no measured degree
        of any kind.
      budget:
        runs: 1
        wall_clock_seconds_per_run: 900
        memory_gb: 1
