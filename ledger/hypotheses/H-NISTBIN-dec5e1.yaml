        beyond D*(m) in the reconciled model under its numbered readings
        assuming H1 (with H5), a second MODEL-CLASS-IC degree, 571
        MODEL-CLASS-RHO under BR-1, or any degree other than 571 whose
        corrected time-only margin sign at any grid omega differs from the
        contract's pre-registered routing.rt4_expectation_table (RT4-CERTAIN),
        is routed to its own review-breakthrough round at max. If that tier
        cannot be served, the claim stays un-promoted and the impediment is
        recorded on the active goal; the tier is never lowered.
      e1_e2_note: >-
        E1 and E2 are Part-3 outcomes, defined in the contract so that no
        output of this hypothesis can be read as either; a comparison at one m
        or under one reading is neither. This hypothesis has no input from
        which the true solving degree could be read.
    interpretation_limits:
      - >-
        Version-1 limits above are carried; these are added. Every D* and the
        threshold table are properties of the restricted model. Its three
        outside multipliers each move D* one way only: M5 (sparsity) is
        omitted, which places D* too EARLY at in-domain omega; M7 (block-size
        exponent above D = 4) would place D* EARLIER than R-B; M8 (the
        optimising m under H2) can only move it earlier, since D*(m) <= D*(m*).
      - >-
        No heuristic is validated by EXP-NISTBIN-451dfa. F1, F2 and G4 are
        instrument-consistency checks (H1-C). The step from the toy range to
        n = 571 is H5 and spans 27.2 times in n and 104.7 times in variable
        count from one measured degree.
      - >-
        MODEL-CLASS-IC, MODEL-CLASS-RHO and UNRESOLVED are classes of a degree
        in a cost model at one parameter point, never cell statuses (S-12).
