        random_model_justification: >-
          The source's heuristic that the summation-polynomial decomposition
          behaves like a random map of its size (Semaev 2015 Section 4.3,
          lines 400-403, re-read at source by S-P4).
        supporting_results: []
        validation_route: >-
          Pointer only: joint_balance.py names EXP-SEMBIN-354a75 and
