          territory), not designed.
        validation_experiment_ids: []
        falsification_condition: >-
          H1-V, external only, at n in N_toy, and ONE-SIDED (RD-5): a measured
          per-solve cost of system (5) completing at solving degree D in the
          d_F4 convention of IR-2 that EXCEEDS S_B(n, D, omega) by more than one
          degree step (omega log2 n bits). A measured cost below S_M, or below
          any other quantity, falsifies nothing, because H1 asserts no lower
          edge; a cost read at a first fall degree, a maximal step degree or a
