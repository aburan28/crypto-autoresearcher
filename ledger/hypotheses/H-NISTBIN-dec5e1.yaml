    statement: >-
      Take the frozen Semaev-2015 cost instrument that EXP-SEMBIN-992e73
      evaluates (experiments/EXP-SEMBIN-81dc96/code/joint_balance.py, solving
      reading block_n4w, stage 1 only, t = m, cofactor charged, unceiled
      k = n/m under the numbered model-identification choice MI-1 of the
      contract, eq. (11) yield) and replace the degree bound 4 in its
      per-solve cost by a grid degree D, in the two written-out readings R-B
      and R-M, which coincide with the instrument exactly at D = 4. Work only
      inside the RESTRICTED MODEL: dense linear algebra, fixed omega, block
      size n; sparsity (M5), the block-size exponent above D = 4 (M7) and the
      optimising m under H2 (M8) lie outside it. Against the corrected
      matched-rho column sqrt(pi r/(4k)) of CORR-20260922-81aeab, the
      time-only margin at extension degree 571 is strictly increasing in D
      (L-MON), with a least positive grid degree D*_R(c, omega, m) for each
      curve, reading, omega and m. THE HYPOTHESIS UNDER TEST is
      IDEA-20260922-7d6d43's claim (C), scored at omega = 3 only: at the
      model's m* = 12, 12 <= D* <= 20 for both 571 curves under both readings
      (four cells); and its claim (A): at D = 4 and omega = 3, under baseline
      rule BR-1 (H-SEMBIN-97ea23's coherent baseline, pinned slice, shifted to
      the corrected column; the naive 2^(n/2) column never counts a degree),
      571 is the only MODEL-CLASS-IC degree among the fifteen FIPS, Certicom
      and Oakley degrees. The statement is conditional on H1 (stated over the
      toy range), its separately numbered transfer H5 to n = 571, and the
      inherited H3 and H4. It says nothing about the true solving degree of
      the m = 12 descended system. The strongest statement any outcome can
      certify is D*(m) in the reconciled model, under its numbered readings,
      assuming H1 (with H5). No outcome changes the status of the 571 cell,
      and no outcome states E1 or E2 (the contract's definitions.e1_e2).
    approval_note_version_2: >-
      Version 2 moves to approved only together with EXP-NISTBIN-451dfa
      version 2, and only if DEC-20260925-41f6dc is official with decision
      approve naming 'EXP-NISTBIN-451dfa version 2'. The status field is
      advanced by the first card of a successor execution batch
      (DEC-20260924-f0a9c7 R4), never by this block.
    mechanism: >-
      VERSION 2 (D-8 S-3). PER-ATTEMPT COST x INVERSE SUCCESS PROBABILITY.
      Section 4.5.2 of Semaev 2015 prices stage 1 as 2^k relations needed,
      each costing one solve of system (5) divided by the per-attempt
      relation probability P(n, m, m, k) ~ 2^(mk-n)/m!. In log2, stage 1 =
      A(n, m) + S, where A(n, m) = k - log2 P is the D-independent
      relation-count and inverse-yield part (k = n/m under MI-1) and S is the
      per-solve cost. The frozen block_n4w reading sets S = 4 omega log2 n,
      the 4 being the degree bound of Assumption 1 (d_F4 <= 4) applied to a
      block of n Boolean variables. The 571 margin that EXP-SEMBIN-992e73
      reports (a design artifact under DEC-20260918-4b7e21, not evidence) does
      not rest on that integer alone. Design figures, hand arithmetic, at
      n = 571: one R-B degree step moves the cost by 27.47 bits at omega 3 and
      the Macaulay rows by 9.16 bits; moving omega from 3 to 2.376 moves the
      D = 4 cost by 22.86 bits and no memory; and the choice between the
      block_n4w and macaulay4 readings moves it by 26.75 bits (prior-version
      audit OC-4; the macaulay4 reading's Macaulay-row memory is missing, not
      estimated, as the audit sheet discloses). Each is of the same order as
      the others and each is a fraction of the margin, 93.4 bits (K-571) to
      98.5 bits (B-571) in magnitude at D = 4, omega 3, with Macaulay rows
      2^36.63 (R-B) or 2^32.04 (R-M) and relation store 2^47.58 beside it.
      The degree is the input this contract turns into
      an axis because it is the input a later true-degree measurement can be
      read against; omega is scored at 3 only and the reading choice is held
      fixed by the restricted model. Making D an axis turns a point estimate
      into a line, and the line crosses the rho column at D*. Because S does
      not depend on m or t in either reading, the model's optimising m is the
      same at every D and omega (L-ARG); the true solving degree may depend
      on m (H2), so the threshold is carried as D*(m) over the M-SET, each
      entry at most D*(m*) (M8). R-B and R-M differ off D = 4 by the degree
      normaliser, so D* is reported as the interval spanned by the two
      readings: an interval between readings, not a bound on any true cost
      (H1-L).
    heuristic_assumptions:
      - id: H1
        name: XL / block-structured cost model for the per-solve cost, over the toy range
        defects: D-5 H1-Q, H1-V, H1-C, H1-L; D-7 (MI-1 carried in)
        formal_statement: >-
          For every extension degree n in the TOY RANGE N_toy (the degrees at
          which the source measured, n <= 21 with one row at 40 as the red team
          TASK-20260924-e0a065 reads Semaev 2015, and the degrees of any toy
          ladder GOAL-SEMBIN-fcb7a2 runs on the descended system), every
          m = t in 2..30 at which system (5) is defined there, with k = n/m in
          the cost model (MI-1), a solve of the Weil-descended system (5) of
          Semaev 2015 completing at maximal degree D (grid 2..64) costs 2^S
          operations with S in the READING INTERVAL between
          S_M(n, D, omega) = omega (W(n, D) - W(n, 4) + 4 log2 n) and
          S_B(n, D, omega) = D omega log2 n, within one degree step
          (omega log2 n bits), where W(n, D) = log2 of the sum over d <= D of
          binom(n, d) and omega is the dense linear-algebra constant in
          Semaev's domain 2.376 <= omega <= 3. It includes H1a, Semaev's
          conjecture that a block-structured Groebner algorithm with block size
          n applies to (5) ("We think the same approach is applicable",
          Section 4.5.2). H1 asserts nothing at n = 571 or 283; that step is
          H5.
        lower_edge: >-
          H1-L, RELABELLED rather than supported. S_M is the lower edge of a
          reading interval for D >= 4 (L-SPREAD) and is not claimed to bound
          any solving cost. It is anchored to the instrument at D = 4: it
          equals the unanchored Macaulay count omega W(n, D) plus omega g(4),
          with g(D) = D log2 n - W(n, D). At n = 571, g(4) = 36.6293876 -
          32.0394122 = 4.5899754, so the anchor adds omega g(4) = 13.77 bits at
          omega 3 (design figure, hand arithmetic; the red team reports the
          same 13.77, which this session read first: informed, not blind).
          Memory beside it: the anchor changes time only; the Macaulay rows
          are 2^32.04 (W(571, 4)) in both the anchored and unanchored forms.
        mi_1: >-
          D-7: k = n/m is the numbered model-identification choice MI-1 of the
          contract (the paper defines k = ceil(n/m) and evaluates its Section
          4.5.2 optimisation at k = n/m). It moves the fixture value by about
          11.2 bits and m* from 12 to 15 (DEC-20260924-124667 D-7, R-J5), and
          F1 identifies the frozen instrument's reading, not a model the
          published text alone determines. The per-m threshold D*(m) is read
          under MI-1, with the ceiled column C-CEIL reported beside it.
        rigorous_support: >-
          As version 1: the degree-D Macaulay matrix of a Boolean system in n
          variables has 2^W(n, D) columns, at most n^D for n >= 2 and D >= 2,
          and dense elimination costs (dimension)^omega, a rigorous upper bound
          on one elimination at degree D. Not rigorous: H1a; that one
          elimination at the solving degree is the whole solve; and that row
          weight, block count and unit conversion are negligible (M5, M6,
          kappa).
        random_model_justification: None claimed. H1 is a cost-model heuristic, not a distributional one.
        supporting_results:
          - >-
            Semaev 2015 Section 4.5.2, eq. (15) (inputs/SEMAEV-2015-310/paper_fulltext.md
            lines 1060-1091), provenance retrieved, read by TASK-20260924-fda726
            (carried from version 1; not re-read by this session).
        validation_route: >-
          H1-C: NOT validated inside EXP-NISTBIN-451dfa. Its in-contract
          checks (F1 and F2 at D = 4; G4 at the known-truth degrees 163, 233,
          239 and 283) are INSTRUMENT CONSISTENCY: they show the surface is the
          frozen instrument and does not prove too much, and they bear on the
          instrument, not on H1. H1 is externally testable at toy n by a
          measured per-solve cost against degree; that is scheduled only as a
          pointer to GOAL-SEMBIN-fcb7a2 (SDEG/ICPERF territory), not designed.
        validation_experiment_ids: []
        falsification_condition: >-
          H1-V, external only and at n in N_toy: a measured per-solve cost of
          system (5) whose growth in the solving degree falls outside the
          reading interval by more than one degree step. A failure of F1, F2
          or G4 is not a falsification of H1: under the contract's VOID rules
          it voids the run as an instrument inconsistency, and no outcome of
          EXP-NISTBIN-451dfa falsifies H1.
      - id: H2
        name: D_solve(n, m, k) law of the true solving degree
        defects: D-5 H2-N; D-8 FD-H2
        formal_statement: >-
          The true (U-4-discharged) solving degree D_solve(n, m, k) of the
          m-shape Weil-descent summation system (5) on a subspace factor base,
          at extension degree n with t = m and integer factor-base dimension k
          (the paper's k = ceil(n/m); k = 48 at n = 571, m = 12), read in
          Semaev's d_F4 convention as IR-2 of the contract pins it, follows a
          law in (n, m) that a toy ladder at n in N_toy can identify and
          extrapolate to (n, m, k) = (571, 12, 48) with a stated band. The
          cost model's unceiled k = n/m (MI-1) is a choice of the cost side and
          is not an argument of H2. H2 is a statement about D_solve only: a
          first fall degree, a maximal step degree or a fake degree d'_F is not
          D_solve and enters only through H6 (first fall) or the U-4
          bookkeeping of KN-FIND-936151 section 4 (fake degree); H2 has no
          first-fall route of its own (FD-H2).
        rigorous_support: >-
          None. Assumption 1 asserts a bound (d_F4 <= 4) that is checked in this
          program only at n <= 21, and KN-FIND-936151 removes the route by which
          a measured fake degree could bound the true one universally.
        random_model_justification: >-
          The comparison distribution named by the proposal is the generic
          degree of regularity of a random system of matched shape (the random
          system null), which belongs with Part 3.
        supporting_results: []
        validation_route: >-
          SCHEDULED AS A POINTER to GOAL-SEMBIN-fcb7a2 (Part 3 under
          DEC-20260924-4f8a03 R2 and DEC-20260924-99ce20 S1), with the
          per-instance discharge requirement IR-2. Not designed, not validated
          and not used by any prediction below.
        validation_experiment_ids: []
        falsification_condition: >-
          A toy-ladder fit over (n, m) whose residuals grow with m or with n (a
          masked super-linear term), or disagreement with the random-system
          null of matched shape.
      - id: H5
        name: transfer of H1 from the toy range to n = 571 and n = 283
        defects: D-5 H1-Q (the transfer numbered separately), H1-S (span ratio)
        formal_statement: >-
          The reading interval of H1 holds, with the same readings and the same
          omega domain, at n = 571 with m = t = 12 and k = 571/12 (MI-1), and at
          n = 283 with m = t = 9, at every grid degree at which a D* or a
          threshold-table entry is read.
        extrapolation_span: >-
          Design figures, hand arithmetic, as RQ-NISTBIN-06157b requires.
          Against the source's measurements as the red team
          TASK-20260924-e0a065 reads them (n <= 21 with one row at 40, t <= 6,
          at most 60 Boolean variables, D = 4 only; the reviewer's reading,
          not re-read here), the step to n = 571 spans 571/21 = 27.2 in n
          (571/40 = 14.3 against the single larger row), n(t - 1) = 571 x 11 =
          6281 Boolean variables against 60, a factor 104.7, and one measured
          degree against the 63 grid degrees 2..64. Memory beside it: at
          n = 571, D = 4 the model's Macaulay rows are 2^36.63 under R-B
          (2^32.04 under R-M) and the relation store 2^47.58.
        rigorous_support: None. H5 is an extrapolation.
        random_model_justification: None claimed.
        supporting_results: []
        validation_route: >-
          Not validated here, and not reachable at n = 571 by any direct
          computation named in this program. A toy ladder at growing n on
          GOAL-SEMBIN-fcb7a2 can test the uniformity in n that H5 presupposes
          (pointer, not designed).
        validation_experiment_ids: []
        falsification_condition: >-
          Over a toy ladder, a trend in n of the measured per-solve cost
          relative to the reading interval: the interval holding at small n
          and drifting out of it as n grows, which would show that its
          validity is not uniform in n.
      - id: H6
        name: first-fall-to-solving-degree bridge
        defects: D-5 H2-U; D-8 FD-H2
        formal_statement: >-
          At the (n, m, k) where it is used, the first fall degree of system (5)
          equals D_solve(n, m, k) of H2 in the d_F4 convention of IR-2.
          Semaev 2015 uses a relation of this kind while calling it "Although
          not generally correct" (paper line 519, as the red team
          TASK-20260924-e0a065 quotes it; not re-read by this session). H6 is
          invoked only where a first fall degree is offered in place of
          D_solve; no output of EXP-NISTBIN-451dfa uses it.
        rigorous_support: None; the source states that the relation is not generally correct.
        random_model_justification: None claimed.
        supporting_results: []
        validation_route: >-
          Any toy-ladder instance at which both the first fall degree and the
          d_F4 solving degree are recorded (GOAL-SEMBIN-fcb7a2, pointer, not
          designed).
        validation_experiment_ids: []
        falsification_condition: >-
          One recorded instance of system (5), at an (n, m, k) where H6 is
          used, whose first fall degree and d_F4 solving degree differ.
      - id: H3
        carried_unchanged: true
        note: version-1 H3 above (eq. (11) yield realised, inherited), unchanged
      - id: H4
        carried_unchanged: true
        note: version-1 H4 above (matched-rho iteration count, inherited convention), unchanged; checked by C-RHOCONV
    predictions:
      - id: P-A
        defects: D-1 (degree list), D-8 S-12 (tokens)
        metric: >-
          the MODEL-CLASS-IC set under baseline rule BR-1 at D = 4, omega = 3,
          kappa = 1, over the fifteen degrees FIPS {163, 233, 283, 409, 571},
          Certicom {79, 89, 97, 109, 131, 163, 191, 239, 359} (Appendix A of
          inputs/CERTICOM-CHALLENGE-2009/, fifteen curves at nine degrees) and
