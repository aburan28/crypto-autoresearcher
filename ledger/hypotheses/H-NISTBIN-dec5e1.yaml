  statement: >-
    Take the frozen Semaev-2015 cost instrument that EXP-SEMBIN-992e73
    evaluates (experiments/EXP-SEMBIN-81dc96/code/joint_balance.py, solving
    reading block_n4w, stage 1 only, t = m, cofactor charged, unceiled
    k = n/m, eq. (11) yield, m minimised over 2..30) and replace the degree
    bound 4 in its per-solve cost by a solving degree D, in either of two
    readings that coincide with the instrument exactly at D = 4, namely R-B
    (block power, per-solve cost n^(D omega)) and R-M (degree-D Macaulay width
    of an n-variable block, normalised to n^(4 omega) at D = 4). Against the
    corrected matched-rho column sqrt(pi r/(4k)) of CORR-20260922-81aeab, with
    r, h and k read from primary parameters, the time-only margin at extension
    degree 571 is then a strictly increasing function of D with a unique zero
    D*_R(omega) for each curve (K-571, B-571), each reading and each omega. THE
    HYPOTHESIS UNDER TEST is IDEA-20260922-7d6d43's quantitative claim (C) that
    this zero lies in the low-to-mid teens, 12 <= D* <= 20, at every in-domain
    omega (2.376, 2.807, 3.0), for both 571 curves and both readings, together
    with its claim (A) that at D = 4 and omega = 3, under baseline rule BR-1
    (H-SEMBIN-97ea23's coherent baseline shifted to the corrected column; the
    naive 2^(n/2) column never counts a degree), 571 is the only live degree
    among the FIPS, Certicom and Oakley degrees. The whole statement is
    conditional on heuristic H1 and the inherited assumptions H3 and H4. It
    says nothing about what the true solving degree of the m = 12 descended
    system is. The strongest statement any outcome can certify is D*(omega) in
    the reconciled model, assuming H1. No outcome of this hypothesis opens or
    closes the 571 cell.

  mechanism: >-
    PER-ATTEMPT COST x INVERSE SUCCESS PROBABILITY. Section 4.5.2 of Semaev
    2015 prices stage 1 as 2^k relations needed, each costing one solve of
    system (5) divided by the per-attempt relation probability
    P(n, m, m, k) ~ 2^(mk-n)/m!. In log2, stage 1 = A(n, m) + S, where
    A(n, m) = k - log2 P is the D-independent relation-count and
    inverse-yield part and S is the per-solve cost. The frozen block_n4w
    reading sets S = 4 omega log2 n, the 4 being the degree bound of
    Assumption 1 (d_F4 <= 4) applied to a block of n Boolean variables. The
    whole 571 margin reported by EXP-SEMBIN-992e73 therefore sits on one
    integer, the solving degree, which the program has checked only at
    n <= 21 (EXP-SEMBIN-992e73 specification, inherited_assumptions). Making
    that integer an explicit axis D turns a point estimate into a line per
    omega, and the line crosses the rho column at D*. Because S does not
    depend on m or t in either reading, the optimising m is the same at every
    D and omega (lemma L-ARG in the design audit), so the D-dependence is
    carried entirely by S and the crossing is located without re-optimising
    anything else. The illustrative XL surface of the proposal,
    2^l binom(nvar, D)^omega, omits the inverse-yield factor m! (28.84 bits at
    m = 12), reads k with a ceiling, and normalises the per-solve cost by the
    Macaulay binomial; the interface lemma L-INT names each omitted
    multiplier and shows which ones depend on D. The one that does, the
    degree normaliser (log2 D! and a falling-factorial term), is exactly what
    separates R-B from R-M, so D* is reported as the interval spanned by the
    two readings rather than as a point.

