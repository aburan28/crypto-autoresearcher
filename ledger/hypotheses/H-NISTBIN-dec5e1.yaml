        supporting_results:
          - >-
            Bailey et al. 2009/541 (inputs/BAILEY-2009-541-ECC2K130/paper_fulltext.md
            line 166), provenance retrieved: sqrt(pi l/(2 * 2 * 131)) * 1.069993,
