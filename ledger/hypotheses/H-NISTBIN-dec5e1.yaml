  heuristic_assumptions:
    - id: H1
      name: XL / block-structured cost model for the per-solve cost
      formal_statement: >-
        For the Weil-descended system (5) of Semaev 2015 at n = 571, m = t = 12,
        a solve completing at maximal degree D costs 2^S operations with S in
        the closed interval between S_M(D, omega) and S_B(D, omega), where
        S_B = D omega log2 n and S_M = omega (W(n, D) - W(n, 4) + 4 log2 n),
        W(n, D) = log2 of the sum over d <= D of binom(n, d), and omega is the
        dense linear-algebra constant in Semaev's stated domain
        2.376 <= omega <= 3. This includes H1a, Semaev's own conjecture that a
        block-structured Groebner algorithm with block size n applies to (5)
        ("We think the same approach is applicable", Section 4.5.2).
      rigorous_support: >-
        The degree-D Macaulay matrix of a Boolean system in n variables has
        2^W(n, D) columns, a count bounded above by n^D for n >= 2 and D >= 2, and dense elimination
        costs (dimension)^omega. That is the standard XL/Macaulay bound and it
        is rigorous as an upper bound on one elimination at degree D. What is
        NOT rigorous is (i) that the block structure reduces the variable count
        to n (H1a, a conjecture in the source), (ii) that one elimination at the
        solving degree is the whole solve, and (iii) that row weight, block
        count and unit conversion factors are negligible (named multipliers
        M5, M6 and the kappa unit in the audit sheet).
      random_model_justification: >-
        None claimed. H1 is a cost-model heuristic, not a distributional one.
      supporting_results:
        - >-
          Semaev 2015 Section 4.5.2, eq. (15) (inputs/SEMAEV-2015-310/paper_fulltext.md
          lines 1060-1091), provenance retrieved, read by TASK-20260924-fda726.
      validation_route: >-
        INSIDE THIS CONTRACT, at D = 4 only: fixture F1 and identities F2
        (instrument consistency) and the 283 control with PTM-B (the rules do
        not place known losers below rho). These validate nothing about H1's
        shape off D = 4; that shape is carried as the R-B/R-M bracket. The
        off-D shape is externally testable by any measured solving cost versus
        degree at toy n; that is SDEG/ICPERF measurement territory and is
        named as a pointer, not designed.
      validation_experiment_ids: [EXP-NISTBIN-451dfa]
      falsification_condition: >-
        Inside this contract: F1 fails, F2 fails, or the rules place K-283,
        B-283, 163, 233 or 131 below rho at D = 4, omega = 3 (G4). Outside it:
        a measured per-solve cost at toy n whose growth in the solving degree
        falls outside the [S_M, S_B] bracket by more than one degree-step.
    - id: H2
      name: D_solve(m) growth law of the true solving degree
      formal_statement: >-
        The true (U-4-discharged) solving degree D_solve(m) of the m-shape
        Weil-descent summation system on a subspace factor base follows a
        law in m that a toy ladder can identify and extrapolate to the m = 12,
        n = 571 shape with a stated band.
      rigorous_support: >-
        None. Assumption 1 asserts a bound (d_F4 <= 4) that is checked in this
        program only at n <= 21, and KN-FIND-936151 removes the route by which
        a measured fake degree could bound the true one universally.
      random_model_justification: >-
        The comparison distribution named by the proposal is the generic
        degree of regularity of a random system of matched shape (the random
        system null), which belongs with Part 3.
      supporting_results: []
      validation_route: >-
        SCHEDULED AS A POINTER to GOAL-SEMBIN-fcb7a2 (Part 3 under
        DEC-20260924-4f8a03 R2 and DEC-20260924-99ce20 S1), with the
        per-instance discharge requirement IR-2 of EXP-NISTBIN-451dfa. Not
        designed, not validated and not used by any prediction below. H2 is
        stated because the E1/E2 reading that would follow Part 3 needs it.
      validation_experiment_ids: []
      falsification_condition: >-
        A toy-ladder fit whose residuals grow with m (a masked super-linear
        term), or disagreement with the random-system null of matched shape.
    - id: H3
      name: eq. (11) yield realised (inherited)
      formal_statement: >-
        The relation probability per solve is P(n, m, t, k) =
        1 - exp(-2^(tk-n)/t!) of Semaev 2015 eq. (11), taken as realised rather
        than as an upper bound.
      rigorous_support: >-
        None beyond the source's derivation; inherited unchanged from the
        frozen instrument, whose docstring records that it is not corrected.
      random_model_justification: >-
        The source's heuristic that the summation-polynomial decomposition
        behaves like a random map of its size.
      supporting_results: []
      validation_route: >-
        Pointer only: joint_balance.py names EXP-SEMBIN-354a75 and
        H-SEMBIN-c5b2e0 as measuring realised yield. Not read by this session.
      validation_experiment_ids: []
      falsification_condition: >-
        A realised yield at t = m differing from eq. (11) by a factor that
        moves A(571, 12) by more than the D-step of the surface.
    - id: H4
      name: matched-rho iteration count (inherited convention)
      formal_statement: >-
        Pollard rho with the negation map and, where k > 1, the order-k
        Frobenius class map needs sqrt(pi r/(4k)) group operations in
        expectation on the prime-order subgroup of order r.
      rigorous_support: >-
        Heuristic (random-mapping) expectation; the convention itself is fixed
        by CORR-20260922-81aeab. Per-iteration cost and distinguished-point
        memory are not charged (unit kappa = 1).
      random_model_justification: >-
        The iteration function behaves like a random map on the class set of
        size r/(2k).
      supporting_results:
        - >-
          Bailey et al. 2009/541 (inputs/BAILEY-2009-541-ECC2K130/paper_fulltext.md
          line 166), provenance retrieved: sqrt(pi l/(2 * 2 * 131)) * 1.069993,
          about 2^60.9 iterations for ECC2K-130, the same expression at k = 131
          times a walk-randomness factor.
      validation_route: >-
        Control C-RHOCONV of EXP-NISTBIN-451dfa reproduces Bailey's printed
        figure from the convention.
      validation_experiment_ids: [EXP-NISTBIN-451dfa]
      falsification_condition: >-
        C-RHOCONV fails its 0.05-bit print tolerance.

