      budget_note: >-
        One row: the wall-clock budget of the single derivation run and its
        memory budget stand together (DI-INDEX); both are machine-protection
        figures of the run, not cost-model figures.
    falsification_conditions:
      - >-
        Claim (C) in scope: any of the four scored cells (K-571 and B-571 under
        R-B and R-M at omega = 3, m* = 12, restricted model, MI-1 and PF-2) has
        D* outside 12..20, including no crossing at D <= 64.
      - >-
        Claim (A) in scope: under BR-1 at D = 4, omega = 3, kappa = 1, a degree
        other than 571 is MODEL-CLASS-IC, or 571 is MODEL-CLASS-RHO.
      - >-
        VOID, not refuted, if F1, F2 or G1 fails: the instrument call path, the
        extension or the rho column is then not the object named, and no D* or
        claim-(A) count is read.
      - >-
        VOID, not refuted, if G4 fails at omega = 3 under MI-1 and PF-2 (163,
        233, 239 or 283): the rules would then prove too much at D = 4. As the
        contract's falsification_criterion states, the HYPOTHESIS is void, not
        only its D* reading: stopping rule SR-1 stops the run at stage 4,
        before claim (A) at stage 5, so neither the D* table nor the claim-(A)
        count is read.
      - >-
        The interface lemma L-INT failing its numerical check F3 does NOT
        falsify this hypothesis. It withdraws every illustrative-derived figure
        and the R-M reading, and D* is then read in R-B alone (DEC-20260924-99ce20
        S1).
      - >-
        H1-V: no outcome of EXP-NISTBIN-451dfa falsifies H1, H2, H3, H5 or H6.
        A failure of F1, F2 or G4 is an instrument inconsistency that voids the
        run; each heuristic's own falsification condition is external and
        stated above; H1's is one-sided at the d_F4 solving degree, and H5's
        covers trends in n and in m (m = 2 included), the k reading's shape
        and the matched-shape random null.
      - >-
        The unscored omega blocks, the C-CEIL columns, the C-PF1-T column, the
        per-m span and the threshold table falsify nothing.
    proof_search_map:
      note: >-
        VERSION 4. Summary of version 4. The five audits, the frozen C2
        fixture, the restated lemmas (L-SPREAD scoped to D >= 4, L-INT with
        the M7-BIN lemma form, L-ASM with MI-2), the committed code blocks
        CB-1, CB-3 and CB-4 with their session outputs, the C1-C8 table and
        the RV3-1 to RV3-14 table are in the version-4 design audit sheet
        coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-bc5bd5/design/TASK-20261002-e11714/proof-search-map-audit.yaml.
        This note supersedes the version-1, version-2 and version-3 notes.
      bottleneck: >-
        D-8 S-4 and RD-2 carried; figures repointed under VERSION 4 (RV3-1). The
        per-solve cost n^(4 omega) of block_n4w, whose degree bound 4 this
        contract replaces by the axis D. It is one of several modelling inputs
        of comparable leverage at 571, not the one integer on which the margin
        rests (mechanism above): one R-B degree step costs 27.47 bits at omega
        3 and multiplies the Macaulay rows by 571 (+9.16 bits of rows; relation
        store unchanged at 2^47.58); moving omega from 3 to 2.376 moves the
        D = 4 time by 22.86 bits and no memory (rows 2^36.63 or 2^32.04 and
        relation store 2^47.58 at both omegas); and the reading choice between
        block_n4w and the instrument's macaulay4 reading moves it by 26.75 bits
        (213.0618 against 186.307, RUN-SEMBIN-aa5161's figure in the
        total-cost joint convention at its own argmin m = t = 10 under MI-1),
        with memory beside both: block_n4w at m* = 12 has Macaulay rows 2^36.63
        (R-B form) and relation store 2^47.58, and macaulay4 at m = t = 10 has
        N5 = 5139 Boolean variables, Macaulay rows 2^44.72 (W(N5, 4)), dense
        entries 2^89.45 and relation store 2^57.10. The f4_std reading's
        226.8183 at the same point has Macaulay rows 2^49.31 in its power form
        or 2^44.72 in monomial form, dense entries 2^98.62 or 2^89.45, and
        relation store 2^57.10 (the contract's code block CB-3, outputs
        bottleneck_figures and joint_points_571, allowed session computation
        C-4). Replacing the degree bound by an axis is decision-changing
        because it fixes, as D*(m) over m, the threshold a later true-degree
        measurement is read against.
      baseline_embedding:
        parameter_slice: >-
          D = 4, omega = 3, n = 571, stage 1 only, t = m, m in 2..30, unceiled
          k (MI-1), the eq. (11) form of P (MI-2, PF-2), cofactor charged: the
          frozen instrument's own evaluation, reported by EXP-SEMBIN-992e73
          (RUN-SEMBIN-a7a2f3, a reproduction target and design artifact under
          DEC-20260918-4b7e21 ITEM-1, not evidence) as log2 cost 186.307 with
          m* = 12, beside which the model's Macaulay rows are 2^36.63 under R-B
          (4 log2 571) or 2^32.04 under R-M (W(571, 4)) and its relation store
          is 2^(571/12) = 2^47.58 relations. The approved instrument run
          RUN-SEMBIN-aa5161 records the same value 186.307 at m = 12, beside
          which the model's memory is the same, Macaulay rows 2^36.63 or
          2^32.04 and relation store 2^47.58.
        reproduction_check: >-
          VERSION 4 (RV3-1, J2-D2; J8-N1). Frozen regression fixture F1 (the
          version-4 design audit's frozen_c2_fixture, identical in every number
          to version 3's), the contract's frozen_c2_fixture.pass_rule restated
          in full: PASS iff |C_I(571, 3.0) - 186.307| <= 5.0e-4 bit with
          m* = t* = 12, beside which target the memory is Macaulay rows
          2^36.63 or 2^32.04 and relation store 2^47.58 (memory is not part of
          the rule), AND |C_I(283, 3.0) - 147.649| <= 5.0e-4 bit with
          m* = t* = 9, beside which target the memory is Macaulay rows 2^32.58
          or 2^27.98 and relation store 2^31.44 (memory is not part of the
          rule). F1 is evaluated at Stage 2 under MI-1 and PF-2, after Stage 0
          (custody and primary-input pins) and Stage 1 (the rho column and
          G1), and must pass before Stage 3 begins; identities F2 then require
          R-B and R-M at D = 4 to equal the instrument to 1e-9 bit at every
          omega on the grid. No D* is computed unless F1, F2, G1 and G4 pass
          and gates.json records it.
      quantifier_order: >-
        VERSION 4 (D-4, S-13 and RD-5 carried; RV3-8, RV3-9). FOR EACH curve c
        in {K-571, B-571}, reading R in {R-B, R-M}, the scored omega = 3 and
        each m in the M-SET 2..30, D*_R(c, 3.0, m) is DEFINED as the least
        integer D in 2..64 with margin > 0, and FOR ALL integer D in 2..64 the
        margin at that m is negative iff D < D*_R, conditional on H1, H5, H3
        and H4 inside the restricted model, under MI-1 and MI-2. An E1-type
        statement needs SOME m with a true degree, measured at k = ceil(571/m)
        and t = m, at most the R-B comparison entry minus 2 (H1's one-step
        upper tolerance, R-B only); an E2-type statement would need EVERY m,
        BOTH readings at the same k and t, a true degree at least the
        comparison entry plus 1 (the one-step tolerance) and a lower edge on
        the per-solve cost that H1 does not assert; no quantifier ranges over
        the true solving degree.
      proof_obligations:
        - claim: F1 fixture reproduces the frozen 571 and 283 rows under MI-1 and PF-2
          responsibility: baseline
        - claim: L-EXT, R-B and R-M coincide with the instrument at D = 4
          responsibility: baseline
        - claim: L-ARG, the optimising m is independent of D and omega
          responsibility: size
        - claim: L-INT, illustrative-to-block_n4w interface with named multipliers, M7 stated in the M7-BIN lemma form relative to the cumulative crossover
          responsibility: interface
        - claim: L-MON, margin strictly increasing in D on 2..64
          responsibility: correctness
        - claim: L-SPREAD, R-B cost >= R-M cost for D >= 4, so D*_B <= D*_M at every entry whose R-M crossing is at D >= 4
          responsibility: interface
        - claim: L-UB, matched rho < naive rho on every ordinary binary curve
          responsibility: scope
        - claim: L-MONO, time-only loss implies coherent product-metric loss
          responsibility: scope
        - claim: L-ASM, assembly of the D* statement from the lemmas and gates under MI-1 and MI-2
          responsibility: runtime
    routing:
      tier: review-breakthrough at max, non-degradable
      rule: >-
        Pre-registered, as version 3 with version-4 wording (RV3-8, RV3-9). The
        evidence review of any run of EXP-NISTBIN-451dfa is at
        review-breakthrough at max whatever its outcome (tripwire T1 of
        DEC-20260924-99ce20). In addition, any result, sentence or reading that
        reads as E1 or E2 (e1_e2 above, word for word the contract's
        definitions.e1_e2: E1 needs some m with a true degree measured at
        k = ceil(571/m) and t = m at most the R-B comparison entry minus 2; E2
        needs every m in the M-SET, both readings, a true degree at least the
        comparison entry plus 1 and a lower edge H1 does not assert, within the
        restricted model; a closure sentence lacking any of these still reads
        as E2), any verdict on the 571 cell beyond D*(m) in the reconciled
        model under its numbered readings assuming H1 (with H5), a second
        MODEL-CLASS-IC degree, 571 MODEL-CLASS-RHO under BR-1, or any degree
        other than 571 whose corrected time-only margin sign, read from the
        in-force MI-1 figure only and never from C-CEIL-A, at any grid omega
        differs from the contract's pre-registered
        routing.rt4_expectation_table (RT4-CERTAIN), is routed to its own
        review-breakthrough round at max. If that tier cannot be served, the
        claim stays un-promoted and the impediment is recorded on the active
        goal; the tier is never lowered.
      e1_e2_note: >-
        E1 and E2 are Part-3 outcomes, defined in the contract so that no
        output of this hypothesis can be read as either; a comparison at one m
        or under one reading is neither. This hypothesis has no input from
        which the true solving degree could be read.
    interpretation_limits:
      in_force_list_rule: >-
        VERSION 4 (DI-INDEX). The interpretation_limits in force for version 4
        are exactly the entries below. The first five restate the five
        version-1 entries word for word; the rest replace the version-2 and
        version-3 entries. Every earlier interpretation_limits entry is
        superseded (in_force_index).
      entries:
        - >-
          A cost-model derivation. Every number is modelled, none is measured.
          D* is a property of the model, not of any system or curve.
        - >-
          Scoped to Semaev 2015's model as frozen in EXP-SEMBIN-81dc96 with the
          block_n4w reading and its two D-extensions. A different decomposition
          method, factor-base shape, solving algorithm or yield law needs its own
          surface.
        - >-
          The index-calculus side is n-level: the model charges no Frobenius
          saving on the index-calculus side, so K-571 and B-571 share one cost
          curve and differ only in their rho figure. Any index-calculus-side orbit
          saving is FROB's and lane B's quantity and is not included.
        - >-
          Time-only surface with the Macaulay-matrix memory figure beside every
          time figure. A memory-charged crossing degree is at most the time-only
          D* when the index-calculus working set is at least 6n bits (L-MONO); it
          is not computed.
        - >-
          Nothing here is a statement about the security of any curve, standard
          or deployed system, in either direction.
        - >-
          Every D* and the threshold table are properties of the restricted
          model. Its three outside multipliers: M5 (sparsity) is omitted, which
          places D* too EARLY at in-domain omega; M8 (the optimising m under H2)
          can only move D* earlier, since D*(m) <= D*(m*) under MI-1; and M7
          (the block-size exponent above D = 4) has a CONDITIONAL direction
          (the contract's definitions.restricted_model.m7_direction): a reading
          whose per-solve cost is at least R-B's at the R-B crossing places D*
          no later than R-B, and one whose cost is at most R-B's one degree
          below that crossing places it no earlier. For the binomial reading
          M7-BIN the direction is stated relative to its CUMULATIVE crossover
          D_cum(m), never its per-step crossover D_ps(m) (RV3-3,
          m7_direction.m7_bin_lemma_form): no later for R-B crossings below
          D_cum(m), no earlier for crossings above D_cum(m), undetermined at
          D_cum(m). The BATCH-b67954 red team's range for crossings at high
          degree (BA-J4-2, attributed) is read as no earlier there, not
          strictly later. No one-way M7 direction is asserted outside that
          range-restricted form.
        - >-
          No heuristic is validated by EXP-NISTBIN-451dfa. F1, F2 and G4 are
          instrument-consistency checks (H1-C). H1 bounds the per-solve cost
          from above only (RD-5), at a solving degree in the d_F4 convention of
          IR-2. The step from the toy range to n = 571 is H5, stated at every m
          of the M-SET under both k readings (route T, RV3-7); it spans 27.2
          times in n, from about 9.5 (m = 2) to about 276 (m = 30) times in
          Boolean variable count, and one measured degree against the grid, and
          the per-m span travels beside the table.
        - >-
          MI-1 (RD-8): the ceiled reading the paper defines gives a LOWER
          stage-1 cost at every claim-(A) degree, so the handed MI-1 threshold
          table is biased toward EARLIER thresholds than the ceiled column
          C-CEIL-T handed beside it.
        - >-
          MI-2 (DI-MI2): the first-order form PF-1 gives a LOWER A(n, m) at
          every cell, so every in-force threshold is no later than its C-PF1-T
          entry (equal at every entry of the table at 571, omega 3, CB-3 output
          threshold_table_comparisons); the in-force PF-2 form is the
          instrument's and the pessimistic one for index calculus.
        - >-
          TWO OPPOSING BIASES (4cb903 OBS-2): MI-1 and MI-2 bias the handed
          table toward EARLIER thresholds; being time-only, it is no earlier
          than a memory-charged crossing, a bias toward LATER thresholds. Both
          travel with the table (the contract's d_star_of_m.two_opposing_biases);
          neither is quantified against the other.
        - >-
          Every time figure is total work, never parallel wall-clock time, on
          both sides; no margin, D* or class depends on a processor count (the
          contract's interpretation_limits, parallelization entry, UNOWNED-3).
        - >-
          MODEL-CLASS-IC, MODEL-CLASS-RHO and UNRESOLVED are classes of a degree
          in a cost model at one parameter point, never cell statuses (S-12).
          Which class a valid run can reach is a design figure of the
          contract's what_the_run_adds, never a finding.
