    approval_note_version_4: >-
      Version 4 moves to approved only together with EXP-NISTBIN-451dfa
      version 4, and only if DEC-20261002-09e2be is official with decision
      approve naming 'EXP-NISTBIN-451dfa version 4'. The status field is
      advanced by the first card of a successor execution batch
      (DEC-20260924-f0a9c7 R4), never by this block.
    statement: >-
      VERSION 4 (RV3-6, RV3-7; DI-MI2). Take the frozen Semaev-2015 cost
      instrument that EXP-SEMBIN-992e73 evaluates
      (experiments/EXP-SEMBIN-81dc96/code/joint_balance.py, solving reading
      block_n4w, stage 1 only, t = m, cofactor charged, unceiled k = n/m under
      the numbered model-identification choice MI-1 of the contract, and the
      decomposition probability in its eq. (11) form PF-2 under the numbered
      model-identification choice MI-2) and replace the degree bound 4 in its
      per-solve cost by a grid degree D, in the two written-out readings R-B
      and R-M, which coincide with the instrument exactly at D = 4. Work only
      inside the RESTRICTED MODEL: dense linear algebra, fixed omega, block
      size n; sparsity (M5), the block-size exponent above D = 4 (M7, whose
      direction is conditional and, for the binomial reading, stated relative
      to its cumulative crossover) and the optimising m under H2 (M8) lie
      outside it. Against the corrected matched-rho column sqrt(pi r/(4k)) of
      CORR-20260922-81aeab, the time-only margin at extension degree 571 is
      strictly increasing in D (L-MON), with a least positive grid degree
      D*_R(c, omega, m) for each curve, reading, omega and m. THE HYPOTHESIS
      UNDER TEST is IDEA-20260922-7d6d43's claim (C), scored at omega = 3
      only: at the model's m* = 12, 12 <= D* <= 20 for both 571 curves under
      both readings (four cells); and its claim (A): at D = 4 and omega = 3,
      under baseline rule BR-1 (H-SEMBIN-97ea23's coherent baseline, pinned
      slice, shifted to the corrected column; the naive 2^(n/2) column never
      counts a degree), 571 is the only MODEL-CLASS-IC degree among the
      fifteen FIPS, Certicom and Oakley degrees. The statement is conditional
      on H1 (stated over the toy range, an upper edge only), its separately
      numbered transfer H5 (to n = 571 at EVERY m of the M-SET 2..30 under
      both k readings, and to n = 283 at m = t = 9), H3 (stated for PF-2) and
      H4. It says nothing about the true solving degree of any descended
      system. The strongest statement any outcome can certify is D*(m) in the
      reconciled model, under its numbered readings (MI-1, MI-2), assuming H1
      (with H5). No outcome changes the status of the 571 cell, and no
      outcome states E1 or E2 (e1_e2 below, word for word the contract's
      definitions.e1_e2).
    mechanism: >-
      VERSION 4 (D-8 S-3, RD-2 and RD-5 carried; RV3-1; DI-MI2). PER-ATTEMPT
      COST x INVERSE SUCCESS PROBABILITY. Section 4.5.2 of Semaev 2015 prices
      stage 1 as 2^k relations needed, each costing one solve of system (5)
      divided by the per-attempt relation probability P(n, m, m, k), whose
      form is the numbered model-identification choice MI-2 of the contract:
      in force, the eq. (11) form PF-2, P = 1 - exp(-2^(mk-n)/m!); beside it,
      the first-order form PF-1, P = 2^(mk-n)/m!, in which the paper writes
      its stage-1 cost (15). In log2, stage 1 = A(n, m) + S, where A(n, m) =
      k - log2 P is the D-independent relation-count and inverse-yield part
      (k = n/m under MI-1, P under MI-2) and S is the per-solve cost. At
      m* = 12 under MI-1 the inverse-yield term -log2 P is 28.8355 bits under
      PF-2, equal to log2 12! at that precision, with Macaulay rows 2^36.63
      (R-B form) or 2^32.04 (R-M form) and a relation store of 2^47.58 beside
      it (the contract's code block CB-3, output bottleneck_figures, allowed
      session computation C-4). The frozen block_n4w reading sets
      S = 4 omega log2 n, the 4 being the degree bound of Assumption 1
      (d_F4 <= 4) applied to a block of n Boolean variables. The 571 margin
      that EXP-SEMBIN-992e73 reports (a design artifact under
      DEC-20260918-4b7e21, not evidence) does not rest on that integer alone.
      Design figures at n = 571 (CB-3 outputs bottleneck_figures and
      joint_points_571), each with its memory: one R-B degree step moves the
      cost by 27.47 bits at omega 3 and the Macaulay rows by 9.16 bits, with
      the relation store unchanged at 2^47.58; moving omega from 3 to 2.376
      moves the D = 4 cost by 22.86 bits and no memory, with rows 2^36.63 or
      2^32.04 and relation store 2^47.58 at both omegas; and the choice
      between the block_n4w and macaulay4 readings moves it by 26.75 bits
      (213.0618 against 186.307; the macaulay4 figure is RUN-SEMBIN-aa5161's,
      total-cost joint convention at its own argmin m = t = 10 under MI-1),
      with memory beside both, block_n4w having Macaulay rows 2^36.63 (R-B
      form) and relation store 2^47.58 at m* = 12 and macaulay4 having
      Macaulay rows 2^44.72 = W(N5, 4), N5 = 5139 Boolean variables of system
      (5), dense entries 2^89.45 and relation store 2^57.10 at m = t = 10, so
      that the reading move adds 8.09 bits of Macaulay rows and 9.52 bits of
      relation store. Each is of the same order as the others and each is a
      fraction of the margin, which at D = 4, omega 3 is 93.44 bits (K-571) to
      98.52 bits (B-571) in magnitude, with Macaulay rows 2^36.63 (R-B) or
      2^32.04 (R-M) and relation store 2^47.58 beside it. The degree is the
      input this contract turns into an axis because it is the input a later
      true-degree measurement can be read against; omega is scored at 3 only
      and the reading choice is held fixed by the restricted model. Making D
      an axis turns a point estimate into a line, and the line crosses the
      rho column at D*. Because S does not depend on m or t in either
      reading, the model's optimising m is the same at every D and omega
      (L-ARG); the true solving degree may depend on m (H2), so the threshold
      is carried as D*(m) over the M-SET, each entry at most D*(m*) (M8), and
      every entry is read through H5 at its own m. R-B and R-M differ off
      D = 4 by the degree normaliser, so D* is reported as the interval
      spanned by the two readings: an interval between readings, not a bound
      on any true cost in either direction; H1 bounds the per-solve cost from
      above only (RD-5). The P form moves no memory figure: Macaulay rows and
      relation store do not depend on it.
    e1_e2:
      identical_wording_rule: >-
        VERSION 4 (RV3-9). E1 and E2 below, and the formal statements of H1
        and H5 in heuristic_assumptions below, are word for word the texts of
        definitions.e1_e2.E1, definitions.e1_e2.E2 and
        definitions.heuristics_as_stated H1 and H5 of EXP-NISTBIN-451dfa
        version 4; a difference between the two files is a defect.
      E1: >-
        Routing label, never an output of this contract: there EXISTS an m in
        the M-SET at which the true solving degree D_true(m) of the m-shape
        descended system at n = 571, in Semaev's d_F4 convention (input rule
        IR-2), MEASURED ON A SYSTEM WHOSE FACTOR BASE HAS INTEGER DIMENSION
        k = ceil(571/m) AT CHAIN LENGTH t = m, satisfies D_true(m) <=
        D*cmp_B(c, omega, m) - 2, where D*cmp_B(c, omega, m) is the R-B entry
        of the ONE-k COMPARISON COLUMN at that m, the C-CEIL-T entry (A(571, m)
        at k = ceil(571/m) under MI-2's in-force form PF-2), with the in-force
        MI-1 entry reported beside it, in the restricted model, under its
        numbered readings, assuming H1 and H5 (and H2, and H6 wherever a first
        fall degree is used). ONE-STEP UPPER TOLERANCE, R-B ONLY: H1 bounds
        the per-solve cost at a true degree D by S_B(571, D, omega) + omega
        log2 571 = S_B(571, D + 1, omega), so the model margin at D_true(m) is
        at most the R-B margin at D_true(m) + 1, which is non-positive only
        when D_true(m) + 1 <= D*cmp_B - 1; hence the "- 2". R-M does not enter
        E1, because H1 asserts no R-M edge. TOKENS: at an m whose comparison
        entry under R-B is "D* <= 2", E1 cannot hold at that m; an entry "no
        crossing at D <= 64" is read as 65 for this clause. A degree measured
        at any k other than ceil(571/m), or at any t other than m, is not an
        E1 reading and is refused for E1 (it still routes under RT-3).
      E2: >-
        Routing label, never an output of this contract ("the 571 cell
        closed"): for EVERY m in the M-SET and under BOTH readings R in {R-B,
        R-M}, the true solving degree D_true(m) at that m, in Semaev's d_F4
        convention (input rule IR-2), MEASURED ON A SYSTEM WHOSE FACTOR BASE
        HAS INTEGER DIMENSION k = ceil(571/m) AT CHAIN LENGTH t = m, is AT
        LEAST D*cmp_R(c, omega, m) + 1, where D*cmp_R(c, omega, m) is the entry
        under R of the ONE-k COMPARISON COLUMN at that m, the C-CEIL-T entry
        (A(571, m) at k = ceil(571/m) under MI-2's in-force form PF-2), with
        the in-force MI-1 entry reported beside it, in the restricted model,
        under its numbered readings, assuming H1 and H5 (and H2, and H6
        wherever a first fall degree is used) TOGETHER WITH a lower edge on the
        per-solve cost at D_true(m), namely S at least S_R(571, D_true(m) - 1,
        omega), which H1 (H-NISTBIN-dec5e1 version_4) does NOT assert and no
        record of this program states. RECONCILIATION WITH THE ONE-STEP
        TOLERANCE: with a per-solve cost no lower than the reading one degree
        step below the true degree, the least true degree at which the model
        margin is positive is D*cmp_R + 1, not D*cmp_R; hence the "+ 1".
        TOKENS: at an m whose comparison entry under R is "D* <= 2", the model
        margin is positive at every per-solve cost, so E2's clause at that m
        and R holds for every D_true(m); at an m whose entry under R is "no
        crossing at D <= 64", E2's clause cannot hold at that m and R. Because
        H1 has no lower edge, E2 cannot be reached on this contract's account
        under H1 alone. A sentence that asserts closure from a true degree
        equal to D*cmp_R, at one m, under one reading, at another k or t, or
        without the named lower edge still READS AS E2 for routing (RT-2) and
        is also caught by RT-3. A degree measured at any k other than
        ceil(571/m), or at any t other than m, is not an E2 reading and is
        refused for E2. A comparison at one m, or under one reading, is
        neither E1 nor E2 as a conclusion.
    heuristic_assumptions:
      - id: H1
        name: XL / block-structured cost model for the per-solve cost, over the toy range, upper edge only, at the d_F4 solving degree
        defects: D-5 H1-Q, H1-V and H1-C carried; H1-L discharged by removal (RD-5) carried; D-7 MI-1 (RD-3, RD-8) carried; VERSION 4 RV3-9 (wording identical to the contract), DI-MI2 (MI-2 carried in), RV3-1 (lower_edge and mi_1 restated with memory)
        formal_statement: >-
          For every extension degree n in the TOY RANGE N_toy (the degrees at
          which the source measured, n <= 21 with one row at 40 as the red team
          TASK-20260924-e0a065 reads Semaev 2015, and the degrees of any toy
          ladder GOAL-SEMBIN-fcb7a2 runs on the descended system), every m = t
          in 2..30 at which system (5) is defined there, with k = n/m in the
          cost model (MI-1) and the decomposition probability in its eq. (11)
          form in the cost model (MI-2, PF-2), a solve of the Weil-descended
          system (5) of Semaev 2015 completing at SOLVING DEGREE D in Semaev's
          d_F4 convention as input rule IR-2 of EXP-NISTBIN-451dfa pins it (grid
          2..64) costs 2^S operations with S AT MOST S_B(n, D, omega) + omega
          log2 n, that is, at most the R-B reading S_B(n, D, omega) = D omega
          log2 n plus one degree step (omega log2 n bits), where omega is the
          dense linear-algebra constant in Semaev's domain 2.376 <= omega <= 3.
          It includes H1a, Semaev's conjecture that a block-structured Groebner
          algorithm with block size n applies to (5) ("We think the same
          approach is applicable", Section 4.5.2). H1 asserts NO LOWER EDGE:
          neither S_M(n, D, omega) = omega (W(n, D) - W(n, 4) + 4 log2 n), with
          W(n, D) = log2 of the sum over d <= D of binom(n, d), nor any other
          quantity is claimed to bound S from below. H1 asserts nothing at
          n = 571 or 283; that step is H5.
        lower_edge: >-
          H1-L DISCHARGED BY REMOVAL (RD-5, carried), restated under VERSION 4
          (RV3-1). The lower edge is absent from both the formal statement
          above and the falsification condition below; S_M is not claimed to
          bound any solving cost. R-M remains a second reading of the
          per-solve cost that the contract carries (reading_R_M), anchored to
          the instrument at D = 4, and [S_M, S_B] is an interval between
          readings, not a bound in either direction. WHY REMOVAL AND NOT
          SUPPORT: the standard XL/Macaulay argument bounds ONE dense
          elimination of the degree-D Macaulay matrix from above; no source
          read by this program bounds every algorithm that solves (5) at
          degree D from below. CONSEQUENCE: E2 (e1_e2 above) names the lower
          edge it would need instead of resting on H1, and its "+ 1" is
          reconciled with the one-step tolerance. The R-M anchor at 571 and
          omega 3 is omega g(4) = 13.77 bits of time, with Macaulay rows
          2^32.04 = W(571, 4) in both the anchored and unanchored R-M forms
          (and 2^36.63 under R-B), so the anchor moves time only (CB-3 output
          bottleneck_figures, R_M_anchor_omega_g4); it is a property of the
          R-M reading, not of H1.
        mi_1: >-
          D-7 with RD-3 and RD-8 carried; figures repointed under VERSION 4
          (RV3-1). k = n/m is the numbered model-identification choice MI-1 of
          the contract (the paper defines k = ceil(n/m) and evaluates its
          Section 4.5.2 optimisation at k = n/m). DIRECTION: the ceiled reading
          LOWERS the stage-1 cost, the sense of Semaev's "at most". CONSEQUENCE
          at the three degrees where MI-1 carries a pass-rule target or a
          claim-(A) import (design figures, the contract's code block CB-3,
          output kreading_table, under allowed session computation C-4, both
          readings under MI-2's PF-2, with memory beside each move): at 571,
          C_I 186.3070 at m* = 12 becomes 175.1383 at m* = 15 (11.1686 bits
          lower), Macaulay rows unchanged at 2^36.63 (R-B) or 2^32.04 (R-M),
          relation store 2^47.58 to 2^39; at the 283 pass-rule target,
          147.6495 at m* = 9 becomes 141.5270 at m* = 10 (6.1225 bits lower),
          rows unchanged at 2^32.58 or 2^27.98, relation store 2^31.44 to 2^29;
          at 359, 159.5451 at m* = 10 becomes 156.1046 at m* = 11 (3.4406 bits
          lower), rows unchanged at 2^33.95 or 2^29.36, relation store 2^35.90
          to 2^33. Every other claim-(A) degree is on its own line of CB-3
          output kreading_table with its memory, and every move there is
          downward. The BATCH-b67954 reviewers' figures at these three degrees,
          as DEC-20260924-124667 and DEC-20260925-41f6dc record them
          (provenance internal, attributed, not this producer's), agree with
          these. F1 identifies the frozen instrument's reading, not a model the
          published text alone determines. The per-m threshold D*(m) is read
          under MI-1, with the ceiled column C-CEIL-T reported and handed
          beside it; every MI-1 entry is no later than its C-CEIL-T entry (the
          contract's MI-1.bias_of_the_handed_table; CB-3 output
          threshold_table_comparisons gives the counts).
        mi_2: >-
          VERSION 4 (DI-MI2). The decomposition probability of the cost model
          is the eq. (11) form PF-2, P = 1 - exp(-2^(mk - n)/m!), the numbered
          model-identification choice MI-2 of the contract, whose textual basis
          (Semaev 2015 Section 4.3, paper lines 400-427, and Section 4.5.2,
          lines 1065-1086) and consequence are disclosed in the contract's
          definitions.model_identification_choices MI-2; the first-order form
          PF-1, P = 2^(mk - n)/m!, enters only the diagnostic column C-PF1-T.
          CONSEQUENCE (design figures, CB-3 output MI2_consequence; MI-2 moves
          no memory figure, and the memory stands beside each figure): at 571
          under MI-1, C_I is 186.3069518 under PF-2 and PF-1 is lower by
          1.506e-9 bit, both at m* = 12, with Macaulay rows 2^36.63 or 2^32.04
          and relation store 2^47.58 under either form; at the 283 target under
          MI-1, C_I is 147.6494784 under PF-2 and PF-1 is lower by 1.988e-6
          bit, both at m* = 9, with rows 2^32.58 or 2^27.98 and relation store
          2^31.44; at 359 under MI-1, C_I is 159.5451417 under PF-2 and PF-1 is
          lower by 1.988e-7 bit, both at m* = 10, with rows 2^33.95 or 2^29.36
          and relation store 2^35.90. The frozen C2 fixture passes under both
          forms (CB-3 output MI2_fixture), so F1 does not identify MI-2; F2
          ties the surface's P form to the instrument's, PF-2. H1 itself is a
          statement about the per-solve cost S, which the P form does not
          enter.
        rigorous_support: >-
          As version 1: the degree-D Macaulay matrix of a Boolean system in n
          variables has 2^W(n, D) columns, at most n^D for n >= 2 and D >= 2,
          and dense elimination costs (dimension)^omega, a rigorous upper bound
          on one elimination at degree D. Not rigorous: H1a; that one
          elimination at the solving degree is the whole solve; and that row
          weight, block count and unit conversion are negligible (M5, M6,
          kappa). Nothing here is a lower bound.
        random_model_justification: None claimed. H1 is a cost-model heuristic, not a distributional one.
        supporting_results:
          - >-
            Semaev 2015 Section 4.5.2, eq. (15) (inputs/SEMAEV-2015-310/paper_fulltext.md
            lines 1060-1091), provenance retrieved, read by TASK-20260924-fda726
            and, at lines 1065-1086, re-read at source by S-P4 on 2026-10-02.
        validation_route: >-
          H1-C: NOT validated inside EXP-NISTBIN-451dfa. Its in-contract
          checks (F1 and F2 at D = 4; G4 at the known-truth degrees 163, 233,
