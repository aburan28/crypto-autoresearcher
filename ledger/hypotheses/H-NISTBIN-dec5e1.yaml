      - id: H4
        name: matched-rho iteration count (inherited convention)
        defects: VERSION 4 DI-INDEX (the version-1 H4 restated here so that its supporting result stands WITH a memory figure); otherwise the version-1 H4 word for word
        formal_statement: >-
          Pollard rho with the negation map and, where k > 1, the order-k
          Frobenius class map needs sqrt(pi r/(4k)) group operations in
          expectation on the prime-order subgroup of order r.
        rigorous_support: >-
