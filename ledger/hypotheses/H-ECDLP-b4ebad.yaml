# H-ECDLP-b4ebad
# Stage-0 joint-versus-separate step ratio for IDEA-20261006-6374b1.
# One additive group of order 503. Not an exponent claim.
hypothesis:
  id: H-ECDLP-b4ebad
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  source_idea: IDEA-20261006-6374b1
  added: '2026-10-12'
  status: specified
  statement: >-
    On Z/503Z with generator 1, four planted coefficients, distinguishing
    modulus 16, and sixteen frozen seeds, the lower median of the summed
    separate-walk steps is at least 7/5 times the lower median of the
    joint-walk steps whenever at least 12 seeds finish on both the
    identity labeling and the permuted labeling.
  test_boundary: >-
    One modulus, sixteen seeds, and a cap of 2000 steps on each walk.
    No elliptic curve is inside this boundary.
  mechanism: >-
    One shared generator walk stores distinguished points. Each target
    walk carries a second coefficient. Separate walks repeat that
    storage. A scored ratio, and an unscored census, are different
    finished states.
  distinguishable_outcomes:
    - >-
      At least 12 seeds finish on both labelings, and the identity
      ratio is at least 7/5 while the permuted ratio is not strictly below.
    - >-
      At least 12 seeds finish on both labelings, and the identity ratio
      is strictly below 7/5 or the permuted ratio is strictly below 7/5
      after the identity ratio met the threshold.
    - >-
      Fewer than 12 seeds finish on a labeling, or the two step
      implementations disagree. Disagreement voids the run. Too few
      finished seeds leaves the ratio unscored.
  falsification: >-
    Both labelings are scored and the identity ratio is strictly below
    7/5, or the identity ratio meets 7/5 while the permuted ratio is
    strictly below 7/5.
  not_claimed: >-
    No change to the generic exponent 1/2, no curve discrete logarithm,
    and no transfer to a cryptographic group order.
