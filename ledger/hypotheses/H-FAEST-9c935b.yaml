    - >-
      F4: the positive control does not report E[S] ~ 257 at c = kappa - 8.
      Instrument broken; nothing reported.
    - >-
      F5: the null cell (faest_192s/f) reports E[S] ~ 2. The computation is
      keyed to the set name rather than to (kappa, c); nothing reported.
    - >-
      F6: HEUR-FF-2 is refuted -- a transcript-derived fresh OWF pair is
      exhibited. nu rises and the gate must be recomputed. This outcome
