  falsification_conditions:
    - >-
      F1: the biclique attack requires at most 8 pairs. (B1) is void,
      2^{126.1} is admissible, and the deliverable shrinks to (B2). THE MOST
      LIKELY SINGLE FAILURE.
    - >-
      F2: the pinned faest-ref table gives different nu or c values. The
      reading is wrong; supersede, do not patch.
    - >-
      F3: HEUR-FF-1's reduced-scale validation fails. The multiplicity
      correction becomes a measured rather than derived quantity and must be
