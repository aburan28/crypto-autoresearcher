  title: >-
    The first fifteen restart lengths sum to 32.
  statement: >-
    The restart lengths begin 1, 1, 2, 1, 1, 2, 4, 1, 1, 2, 1, 1, 2, 4, 8.
    Their sum is 32. The block ending at index 2^k - 1 has sum k times
    2 to the power k - 1. For k = 1 through 5 those sums are 1, 4, 12,
    32 and 80, and the block-ending lengths are 1, 2, 4, 8 and 16. A
    geometric completion time with success probability p has squared
    coefficient of variation 1 - p. At p = 1/2 that square is 1/2, which
    is strictly below 1. An exponential completion time has coefficient
    of variation 1, which is not strictly above 1. Two orders of
    magnitude are 100. The power 2^6 is 64, which is 36 below 100, and
    the power 2^7 is 128, which is 28 above 100.
  mechanism: >-
    The proposal names a restart schedule and two tail conditions. This
    contract checks the schedule sums and the light-tail coefficients.
    It does not run a racer.
