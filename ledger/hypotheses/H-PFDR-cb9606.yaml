hypothesis:
  id: H-PFDR-cb9606
  question_id: RQ-ICEX-001
  source_idea_id: IDEA-20260830-f2e5b7
  batch_id: BATCH-c64bee
  title: >-
    THE RESIDUAL IS THE OBJECT. Crediting only the residuals that land in the
    factor base discards, at rate 2 per charged operation, partial relations that
    combine in pairs; keeping them gives alpha(beta) = max((1+beta)/2, lambda
    beta) for a factor base of size N^beta, so the achievable m = 2 exponent is
    N^{2/3} at beta = 1/3 with NO free oracle and tends to N^{1/2} as beta tends
    to 0 -- where the pipeline has degenerated into a birthday search, which is
    why the CURVE-FREE null is decisive: a gain that survives it in both branches
    is generic collision finding wearing an index-calculus costume.
  statement: >-
    (A) THE OMITTED CHANNEL, AS A SPECIFIC DEFECT IN A SIBLING RECORD OF THIS
    BATCH. At arity m = 2 over a prime-order group of order N, the signed-sum
    sweep against a factor base F of size B computes the 2B residual
    x-coordinates x(R plus or minus P_v) for one target at a charged cost of
    Theta(B) group operations. H-PFDR-064546 part (B2) credits that sweep only
    with the FULL relations and therefore derives a relation-collection charge of
    Theta(N) independent of B. The step under dispute is the CREDITING step, not
    the arithmetic: every residual that misses F is a partial relation with a
    single unknown point, and two partials sharing that point combine exactly
    into a linear equation over the factor-base logarithms and the target
    logarithm. Those partials are produced at rate 2 per charged operation and
    are thrown away.
    (B) THE CORRECTED TWO-CHANNEL ACCOUNTING. Let W be the large-prime pool size,
    at most the number of rational x-coordinates. Per target the sweep costs B,
    yields about 4 B^2 / N full relations and about 4 B W / N partials. Collecting
    P partials over W pool slots yields about P^2/(2W) combined relations, so
    B+1 relations require P = Theta(sqrt(B W)) partials, hence
    Theta(N sqrt(1/(B W))) targets and a relation-collection charge
    T_rel = Theta(N sqrt(B/W)) with Theta(sqrt(B W)) stored partials. The pool
    may be the whole x-coordinate set, where membership is a tautology and costs
    nothing to store, so W = Theta(N) is admissible and
    T = Theta(sqrt(N B)) + c_LA B^2 with memory Theta(sqrt(N B)).
    (C) THE CLOSED FORM AND THE THREE NUMBERS IT FORCES. With B = N^beta and
    linear-algebra exponent lambda, alpha(beta) = max((1+beta)/2, lambda beta)
    and the memory exponent is mu(beta) = max((1+beta)/2, beta). (C1) At
    beta = 1/3 with lambda = 2, alpha = 2/3: the free-oracle floor asserted by
    H-PFDR-064546 part (B1) is reached with the ACHIEVABLE sweep oracle and no
    oracle improvement, so that part is not a floor. (C2) For beta below 1/3,
    alpha = (1+beta)/2 < 2/3, strictly below it. (C3) alpha(beta) exceeds 1/2 for
    every positive beta, with infimum exactly 1/2 as beta tends to 0; at beta = 0
    the pipeline stores two residuals per step with collision detection, which is
    a birthday search, and under the distinguished-point transform it is Pollard
    rho exactly.
    (D) WHAT THIS DECIDES FOR THE QUESTION. RQ-ICEX-001 asks whether a charged
    toy exponent confidence interval EXCLUDES 1/2. Within this family the answer
    is structural: 1/2 is the INFIMUM of the achievable set and is attained only
    where the factor base has constant size, which is outside any reasonable
    definition of an index-calculus pipeline. An interval excluding 1/2 FROM
    BELOW is therefore unreachable; an interval excluding 1/2 FROM ABOVE is the
    generic outcome and is the honest form of the decision.
    (E) THE ATTRIBUTION PROBLEM, WHICH IS THE DECISIVE CONTROL AND NOT A
    FOOTNOTE. The lower branch of alpha(beta) IS the birthday bound, and a
    birthday bound is a property of collision search over a key space with no
    curve, no group law and no summation polynomial in it. THE CURVE-FREE NULL IS
    THEREFORE MANDATORY: replace the group by a random bijection on the same key
    space with the same charged costs and re-run the two-channel arm. The
    BIRTHDAY branch MUST survive unchanged, because it is generic; the FULL
    relation branch MUST collapse, because it depends on the factor base being a
    structured subset the group law maps into. A two-channel gain that survives
    the null in BOTH branches is generic collision finding wearing an
    index-calculus costume and MUST be reported as a statement about collision
    search, with no elliptic-curve or ECDLP language anywhere in the deliverable.
    (F) NOT CLAIMED. No advantage over Pollard rho anywhere. The best point in
    the family ties rho in time and loses to it by N^{1/2} in memory. The
    positive content is that a live sibling record m = 2 exponent is wrong by up
    to N^{1/2} within its own model; the negative content is that correcting it
    does not produce an attack.
  mechanism: >-
    THE TRACKED OBJECT is the RESIDUAL of a failed decomposition attempt -- the
    group element left over -- carried as the pair (collision key, bookkeeping
    vector of factor-base indices and target coefficients). It is a genuinely
    lossy projection of the swept candidate: it forgets which target produced it,
    which factor-base index was used at which enumeration position, and the sign
    branch. It is lossy COMPATIBLY because the retained key propagates
    deterministically under exactly the operation the pipeline performs -- two
    candidates with equal residual key compose by group subtraction into an exact
    linear relation whose coefficients are read off the retained bookkeeping
    alone, with the discarded sign branch re-entering only as a factor 2 resolved
    by one check.
    THE CONTRAST IS THE MECHANISM. Every full-relation-only charge in this lane
    projects each candidate to the 0/1 indicator that the residual lies in the
    factor base. That indicator is the coarsest possible function of the
    residual: it is not a change of coordinates, it is a projection that discards
    so much that the retained part no longer propagates at all, because a 0
    carries no information forward -- and the model then charges full price for
    producing information it immediately deletes.
    WHY THE CANDIDATE-PRODUCTION RATE IS THE INVARIANT. One sweep operation
    produces exactly one residual, so residuals arrive at rate Theta(1) per
    charged operation. A birthday search over Theta(N) keys needs Theta(sqrt(N))
    keys, hence Theta(sqrt(N)) operations. That is why the family infimum is
    exactly the birthday bound and why no rebalancing of B reaches below it: B
    controls only how many relations must be assembled, a pure penalty raising
    the requirement to Theta(sqrt(N B)), and how expensive the linear algebra is,
    a second pure penalty. THE FACTOR BASE AT m = 2 IS A TAX, NOT A LEVER.
    WHY IT DOES NOT CONTRADICT THE CONSERVATION IDENTITY. That identity is about
    the mean number of size-m multisets from F summing to a target, and it states
    in its own words that it is silent about the cost of FINDING a decomposition.
    Partial relations are not decompositions over F at all -- they are elements of
    the orbit F plus the pool, which the identity does not count. Nothing here
    disputes the identity; the point is that it bounds one of two channels.
  assumptions:
    - >-
      Prime-order group of order N with an x-coordinate factor base of size B
      drawn from the rational x-coordinates; targets rerandomised as
      [a]P + [b]Q, which is exactly uniform at prime order.
    - >-
      ONE CHARGED OPERATION IS ONE GROUP OPERATION, and hash-set probes and pool
      membership tests are charged at the SAME declared rate as in the rho arm.
      The convention is frozen before any cell runs and is SHARED WITH
      H-PFDR-064546, because the two records disagree about a number and the
      disagreement is decidable only under one convention on one instance set.
    - >-
      The conclusion is parameterised in the linear-algebra exponent lambda in
      [1, 2]: alpha(beta) = max((1+beta)/2, lambda beta), whose infimum over
      positive beta is 1/2 for every lambda at least 1. No part of the headline
      depends on lambda = 2.
    - >-
      Combined relations have weight 2 in the factor base plus the target
      coefficients, so B+1 independent relations suffice. Rank deficiency is not
      modelled and can only raise the true cost, which is the SAFE direction for
      the negative limb and the UNSAFE direction for the claimed improvement --
      so the improvement is stated as a within-model exponent and must be
      confirmed by measurement before it is quoted.
    - >-
      Sign ambiguity from an x-only pool is a factor 2 resolved by one check per
      collision and is carried as a constant, never as an exponent.
    - >-
      [BLOCKING QUESTION-LEVEL CONSTRAINT, recorded because it governs approval
      and not this design] RQ-ICEX-001 states in its own constraints that it is
      blocked until three named goals each have a committed protocol or scoped
      measurement decision. This hypothesis and its contract are DESIGN ONLY and
      do not lift that block; the contract may not be moved out of draft until
      the Coordinator records that the constraint is satisfied or amends it under
      a versioned protocol_amendment.
  proof_search_map:
    bottleneck: >-
      The crediting rule that converts swept candidates into usable relations.
      The charged sweep cost of Theta(B) per target is not in dispute and is
      shared by both models; the exact step whose replacement changes the theorem
      is "credit a candidate if and only if its residual lies in F" versus "store
      every residual and credit collisions".
    baseline_embedding:
      parameter_slice: >-
        beta tending to 0 with the pool set to the whole x-coordinate set. The
        family degenerates to storing two residuals per step and detecting
        collisions -- a birthday search at (N^{1/2}, N^{1/2}) -- and applying the
        distinguished-point transform to that slice is Pollard rho at
        (N^{1/2}, O(1)). RHO IS THE BOUNDARY OF THIS FAMILY rather than an
        external comparator, which is the strongest available form of a
        baseline-reproduction audit.
      reproduction_check: >-
        Frozen regression fixture. The beta = 0 arm of the SAME implementation,
        on the SAME instances with the SAME counters, must reproduce
        0.886 sqrt(N) group operations within the seed spread for the
        distinguished-point variant, and c sqrt(N) with c in [1.0, 1.6] for the
        plain stored-collision variant. If the family own boundary member does
        not reproduce the textbook constant, the counting convention is broken
        and no ratio from any other cell may be reported. Separately, setting the
        pool to empty must reproduce the committed 2RN/B charge symbolically.
    observation_collision:
      observable: >-
        Total charged operations for a complete m = 2 solve at one (p, B) cell.
      distinct_preimage_search: >-
        COLLISION EXHIBITED, AND IT IS WHY THIS RECORD EXISTS. At beta = 1/3 the
        corrected two-channel model and the sibling FREE-ORACLE model both emit
        N^{2/3}, from completely different preimages: one with a Theta(B) sweep
        plus a partial channel, the other with a Theta(1) oracle and no partial
        channel. A single N^{2/3} measurement therefore does not identify which
        mechanism produced it. THE SEPARATOR IS THE B-SWEEP, NOT THE SIZE LADDER:
        the two-channel model predicts total operations RISING as sqrt(B) on the
        lower branch while the full-relation-only model predicts FLAT in B, and
        that discriminator is available at ONE field size.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the 0/1 decomposability indicator with the residual point
          itself, carried as a collision key plus a bookkeeping vector --
          preserving more state than the final goal requires, because that
          stronger state is what survives the failure of a candidate.
        predicted_gain: >-
          Moves the m = 2 within-model exponent from alpha = 1 to
          alpha = max((1+beta)/2, lambda beta), a gain of N^{1/3} at beta = 1/3
          and up to N^{1/2} below it. NO EXPONENT BELOW 1/2 IS CLAIMED OR
          REACHED.
      - transform: boundary_lift
        proposed_object: >-
          Read rho as the beta tending to 0 boundary member of the family rather
          than as an external baseline, then ask whether the family improves
          strictly inward.
        predicted_gain: >-
          A negative answer with a mechanism: alpha(beta) is strictly increasing
          on positive beta in both branches, so the family provably does not
          improve inward. A closure with a named obstruction rather than a
          fatigue report.
    quantifier_order: >-
      CLAIMED. FOR ALL prime N, FOR ALL beta in (0, 1], FOR ALL pool sizes W at
      most the number of rational x-coordinates, FOR ALL factor-base geometries
      of size N^beta, the two-channel charge satisfies
      T >= c N^{max((1+beta)/2, lambda beta)}, hence T is strictly above N^{1/2}
      for every fixed positive beta. The FOR ALL over geometry is DELIVERED for
      the full channel by the conservation identity and for the partial channel
      by the birthday count over W keys, which is geometry-free.
      NOT CLAIMED, and load-bearing: NOT for all oracles. The derivation FIXES
      the sweep oracle at Theta(B) per target. An oracle producing candidate
      decisions at rate growing faster than constant per charged operation is
      outside this quantifier and is exactly what the forward guidance hands on.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Within the two-channel cost model at arity m = 2 over a prime-order
        group with a rate-constant sweep oracle, the achievable exponent is
        alpha(beta) = max((1+beta)/2, lambda beta), strictly above 1/2 for every
        positive beta with infimum 1/2 at the degenerate boundary." It can NEVER
        certify anything about m >= 4, about oracles of superconstant rate, about
        the truth of the model, or about ECDLP hardness. Any summary dropping
        "rate-constant oracle" or "m = 2" is overclaiming.
      nearby_object_control: >-
        THE EXTENSION-FIELD GATE, SHARPENED FROM A SIGN CHECK TO AN EXPONENT
        CHECK. Instantiate the identical two-channel accounting over an extension
        field with the subfield-line base and a polylog algebraic oracle, whose
        rate is superconstant rather than constant. It must return an exponent
        that beats rho for extension degree at least 3 and ties it at degree 2. A
        model returning "worse than rho at every degree" is broken; a model
        returning the right SIGN but the wrong EXPONENT at degree 2 is exactly
        the failure this record attributes to the full-relation-only charge, and
        the same test is applied to this record without mercy.
    proof_obligations:
      - claim: >-
          Two partials sharing a residual combine into a valid linear relation
          over the factor-base logarithms and the target logarithm, with sign
          ambiguity resolvable in constant time.
        responsibility: correctness
      - claim: 'P = Theta(sqrt(B W)) partials suffice for B+1 combined relations.'
        responsibility: success_probability
      - claim: 'T_rel = Theta(N sqrt(B/W)) with memory Theta(sqrt(B W)).'
        responsibility: size
      - claim: 'alpha(beta) = max((1+beta)/2, lambda beta) with infimum 1/2 on positive beta.'
        responsibility: runtime
      - claim: 'The beta = 0 boundary arm reproduces 0.886 sqrt(N).'
        responsibility: baseline
      - claim: 'Setting the pool empty reproduces the committed 2RN/B charge.'
        responsibility: baseline
      - claim: 'The extension-field instantiation ties rho at degree 2 and beats it at degree at least 3.'
        responsibility: scope
      - claim: >-
          The CURVE-FREE null reproduces the birthday branch unchanged and
          collapses the full-relation branch; a gain surviving in both branches is
          reported as generic collision search.
        responsibility: scope
      - claim: >-
          Memory is reported beside every time row; a time-only comparison
          against rho is forbidden in any deliverable.
        responsibility: memory
    not_applicable_reason: null
  rerandomization: >-
    Targets are rerandomised as [a]P + [b]Q, exactly uniform at prime order, and
    the solution is pulled back to the input instance by the recorded
    coefficients. Independence across trials is not assumed for the birthday
    count, which is over residual KEYS rather than over trials.
  asymptotic_claim:
    problem: 'prime-field ECDLP by two-channel point-decomposition index calculus at arity m = 2'
    prior_best: >-
      Pollard rho at 0.886 sqrt(N) time and O(1) memory; BSGS at
      (N^{1/2}, N^{1/2}); in-lane, the sibling record m = 2 pair (N^{2/3}, N).
    time_exponent: >-
      alpha(beta) = max((1+beta)/2, lambda beta), i.e. 2/3 at beta = 1/3 with
      lambda = 2, with infimum 1/2 approached but NOT attained on positive beta.
      NO EXPONENT BELOW 1/2 IS CLAIMED.
    memory_exponent: >-
      mu(beta) = max((1+beta)/2, beta), i.e. N^{1/2} at the boundary and N^{2/3}
      at beta = 1/3. Memory equals time along the entire lower branch, so the
      family traces the diagonal of the time-memory plane outward from the BSGS
      point and NEVER holds the O(1) memory of rho.
    hidden_cofactor: >-
      The combining-stage constant is not derived and its rank behaviour is a
      heuristic. Coupon-collector and rank-deficiency corrections are omitted and
      both raise the true cost, which is the safe direction for the negative limb
      and the UNSAFE direction for the claimed improvement. The sign ambiguity
      costs a factor 2 per collision check. And "within the two-channel model" is
      the whole of the remaining overhead.
    claim_kind: exponent_improvement
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        RESIDUAL EQUIDISTRIBUTION. For a factor base of size B and a uniform
        target, the 2B residual x-coordinates behave as independent uniform draws
        from the set X of rational x-coordinates, so the number landing in a pool
        of size W is Binomial(2B, W/|X|) up to o(1), and P residuals collected
        over W pool slots produce about P^2/(2W) coincident pairs.
      random_model_justification: >-
        The MEAN of the full channel is not a heuristic: it is the exact double
        count of the conservation identity, which holds for every base of every
        geometry with measured deviation exactly 0 over 144 cells, and the pool
        channel is the same count with the factor base replaced by the pool. What
        is assumed is only that the 2B algebraically determined residuals behave
        like uniform draws from X with respect to pool membership -- the
        classical independent-uniform imitation, the identical move by which the
        extension-field decomposition probability is obtained. The birthday count
        over keys is the same classical statement used for distinguished-point
        collision search.
      supporting_results:
        - ref: KN-FIND-007
          provenance: internal
          claim: >-
            Mean per-target yield binomial(B+m-1, m)/N exactly for every base,
            geometry-independent, measured deviation exactly 0 over 144 cells,
            with the explicit statement that the identity says nothing about the
            cost of finding a decomposition or about the linear-algebra stage.
          verified_by: coordinator, TASK-20260904-9c61a9 (record read in full)
        - ref: KN-FIND-8f2c90
          provenance: internal
          claim: >-
            Commits the m = 2 per-trial charge as B check operations with total
            2RN/B, and reports the BKK constant explicitly as not
            exponent-moving.
          verified_by: coordinator, TASK-20260904-9c61a9 (record read in full)
      validation_experiment_ids:
        - EXP-PFDR-9187e7
      falsification_condition: >-
        Combined relations fall short of the predicted pair count by more than a
        factor 4, or the residual triple-coincidence rate exceeds the Poisson
        prediction. The residuals are not equidistributed and the birthday count
        over keys is wrong.
    - id: HEUR-002
      formal_statement: >-
        COMBINING-GRAPH RANK. The graph on collected partials -- vertices the used
        pool residuals, edges the partials -- has at the collection point enough
        independent cycles that the rank of the combined system is proportional
        to the pair count and not merely to the number of connected components.
      random_model_justification: >-
        Rigorous for the EDGE COUNT, which is a pure double count. Heuristic only
        in the rank clause, where the classical statement imitated is the
        giant-component and cycle-space behaviour of a sparse random graph, in
        which the cycle rank is edges minus vertices plus components and the
        relation matrix is full rank with probability tending to 1 once the
        average degree exceeds 1. The same assumption underlies every published
        large-prime variation and is stated here rather than hidden.
      supporting_results: []
      validation_experiment_ids:
        - EXP-PFDR-9187e7
      falsification_condition: >-
        Measured rank falls short of the cycle-rank prediction by more than 20
        percent. The combining stage rather than the collection stage is the
        binding constraint, the exponent changes, and no alpha may be quoted
        until it is restated.
  structural_ingredients:
    - description: >-
        The conservation identity, supplying the full-relation channel mean and
        its geometry-independence.
      citation: KN-FIND-007
      provenance: internal
      verified_by: coordinator, TASK-20260904-9c61a9 (record read in full)
      role: the full channel, and the boundary of what it bounds
    - description: >-
        The committed m = 2 per-trial charge 2RN/B, reproduced by the empty-pool
        slice.
      citation: KN-FIND-8f2c90
      provenance: internal
      verified_by: coordinator, TASK-20260904-9c61a9 (record read in full)
      role: the empty-pool baseline reproduction
    - description: >-
        The large-prime / partial-relation variation, classical in adjacent
        settings, and the fixed-genus index-calculus complexity whose value at
        extension degree 2 coincides with the boundary value derived here.
      citation: >-
        Gaudry, index calculus for abelian varieties of small dimension and the
        ECDLP; the double-large-prime line for fixed-genus class groups
      provenance: recalled
      verified_by: null
      role: >-
        prior art for the variation and a known-answer consistency lead. NO
        primary source was opened by any agent under this task; the source idea
        records HTTP 403 and 405 on the publisher pages. Used nowhere as support.
  reduction_chain:
    core_problem: >-
      No attack problem is reduced. The core statement is a corrected within-model
      exponent for one algorithm family at one arity, plus a structural answer to
      the question decision target.
    corollaries: []
  predictions:
    - metric: >-
        P1 -- total charged group operations of a complete m = 2 solve,
        two-channel arm, at fixed p = 2^16 across B in
        {8, 16, 32, 64, 128, 256}. UNITS: group operations
      direction: higher
      minimum_effect: >-
        On the lower branch the count must RISE as sqrt(B): each doubling of B
        multiplies relation-collection operations by 1.41 with a tolerance of
        plus or minus 25 percent, i.e. an admitted interval of [1.06, 1.76] per
        doubling. The competing full-relation-only reading predicts FLAT in B,
        i.e. 1.00 per doubling, which lies OUTSIDE that interval -- so the
        discriminator has genuine width and the two explanations cannot both
        satisfy it. A count flat in B within a factor 1.2 across a 32x range
        falsifies the two-channel derivation and corroborates the sibling record.
    - metric: >-
        P2 -- ratio of full-relation-only arm operations to two-channel arm
        operations at p = 2^16, B = 64, both arms on the identical frozen
        instance set. UNITS: dimensionless ratio
      direction: higher
      minimum_effect: >-
        PRE-REGISTERED POINT PREDICTION FROM THE CLOSED FORM, with the arithmetic
        recomputed and confirmed by this coordinator: with the pool the whole
        x-coordinate set of size about 2^15, the sweep produces 128 residuals per
        target, P = sqrt(B W) is about 1448 so 16 targets suffice at 2048 stored
        partials, the pair count 2048^2/(2 times 2^15) is exactly 64 combined
        relations, and the charged cost is 16 times 64 = 1024 operations against
        about N/2 = 32768 for the full-relation-only arm. Predicted ratio 32,
        required at least 10, and a ratio below 3 falsifies the partial channel
        as exponent-moving at this cell.
    - metric: >-
        P3 -- partials produced per charged operation, measured directly at every
        cell. UNITS: partials per group operation
      direction: different
      minimum_effect: >-
        PREDICTED EXACTLY 2, invariant in B and in p to within 5 percent. This is
        the candidate-production-rate invariant the whole mechanism rests on. A
        measured rate that grows with B means the sweep is not being charged what
        the model charges it and every operation count is void.
    - metric: >-
        P4 -- matched Pollard rho operations on the identical instances under the
        identical frozen convention. UNITS: group operations
      direction: different
      minimum_effect: >-
        FORCED to 0.886 sqrt(N) within the seed spread. A baseline arm that does
        not reproduce the textbook constant is not measuring a ratio and blocks
        the report.
    - metric: >-
        P5 -- the beta = 0 boundary arm of the same implementation. UNITS: group
        operations
      direction: different
      minimum_effect: >-
        FORCED within a factor 2 of the matched rho arm. If the family own
        boundary member does not reproduce rho, the claimed baseline embedding is
        false and the closure argument does not stand.
    - metric: >-
        P6 -- CURVE-FREE NULL-OBJECT RERUN: the group replaced by a random
        bijection on the same key space with the same charged costs, both
        branches. UNITS: group operations and dimensionless ratio
      direction: different
      minimum_effect: >-
        FORCED SHAPE: the BIRTHDAY branch must survive UNCHANGED because it is
        generic, and the FULL-relation branch must COLLAPSE. BLOCKING FOR
        ATTRIBUTION: a two-channel gain that survives in BOTH branches is generic
        collision finding wearing an index-calculus costume, must be reported as
        a statement about collision search, and NO elliptic-curve, Semaev or
        ECDLP language may appear anywhere in the deliverable.
    - metric: >-
        P7 -- symbolic alpha(beta) and mu(beta) at lambda in {1, 1.5, 2}. UNITS:
        exponents
      direction: different
      minimum_effect: >-
        FORCED EXACT: the infimum over positive beta of alpha equals 1/2 at every
        lambda at least 1, verified to 1e-12 on a grid, and the branch crossover
        at beta = 1/3 with alpha = 2/3 at lambda = 2. Any deviation is an algebra
        error and halts the record.
    - metric: >-
        P8 -- peak stored residuals and peak matrix memory per arm, in stored
        group elements, reported on EVERY time row. UNITS: group elements
      direction: different
      minimum_effect: >-
        Memory equals time along the lower branch, so a time-only comparison
        against rho is FORBIDDEN. At the boundary the family pays N^{1/2} memory
        where rho pays O(1), and that row must appear beside every quoted time.
    - metric: >-
        P9 -- probe-cost sensitivity row: the arm ratio recomputed at hash-probe
        costs of 0.1, 1 and 10 group operations. UNITS: dimensionless ratio
      direction: different
      minimum_effect: >-
        REPORTED AT ALL THREE. The two-channel arm performs many more hash probes
        per group operation than the full-relation arm, so an unfair probe charge
        could manufacture the entire claimed separation. If the ratio drops below
        3 at probe cost 10, the result is convention-dependent and must be
        labelled so.
  test_boundary:
    instances:
      - 'generated prime-order curves at p in {2^12, 2^14, 2^16}, one frozen instance set shared with the sibling record'
      - 'CURVE-FREE: a random bijection on the same key space with identical charged costs'
      - 'the extension-field instantiation (symbolic only)'
    parameters:
      B: 'swept over a 32x range at each p, up to 256'
      seeds: '5 per cell; derived exponents are seed-free and must be bit-identical across seeds'
      arms: >-
        A full-relations-only; B two-channel with the pool the whole
        x-coordinate set; C the beta = 0 boundary; D matched Pollard rho with the
        negation map disabled -- ONE sweep routine, THREE crediting rules, ONE
        operation counter
      saturation_screen: 'cells with mean full yield outside [0.05, 2] or fewer than 4 targets excluded BEFORE the run'
      convention: 'frozen before any cell runs and SHARED with H-PFDR-064546 so the two records are decidable against each other'
    implementation: >-
      Pure Python. No Macaulay matrix and no Groebner basis. The largest object
      is a hash table of at most sqrt(B N) residuals, about 2^12 at p = 2^16 with
      B = 256, plus a B by B matrix over the integers modulo N -- under 10 MB.
      Every recovered logarithm carries a certificate re-verified independently
      of the solver.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 4
      maximum_memory_gb: 8
      maximum_runs: 300
  falsification_conditions:
    - >-
      F1 DERIVATION FALSIFIED. Arm B operation counts are FLAT in B within a
      factor 1.2 over a 32x range. The two-channel derivation falls and the
      sibling record part (B2) stands.
    - >-
      F2 CHANNEL NOT EXPONENT-MOVING. The arm ratio at p = 2^16, B = 64 is below
      3. The headline is withdrawn.
    - >-
      F3 BASELINE EMBEDDING FALSE. Arm C does not reproduce Arm D within a factor
      2, or Arm D does not reproduce 0.886 sqrt(N). Nothing else in the record
      may be reported.
    - >-
      F4 ATTRIBUTION DENIED. The curve-free null reproduces the two-channel gain
      in the FULL-relation branch as well as the birthday branch. The gain is
      generic collision search and the record must be re-described as a statement
      about collision finding, with no curve language anywhere.
    - >-
      F5 BIRTHDAY COUNT WRONG. Combined relations fall short of the predicted
      pair count by more than a factor 4. HEUR-001 falls.
    - >-
      F6 COMBINING STAGE BINDS. Measured rank falls short of the cycle-rank
      prediction by more than 20 percent. HEUR-002 falls and no alpha may be
      quoted until the exponent is restated.
    - >-
      F7 KNOWN-ANSWER GATE FAILED. The extension-field instantiation does not tie
      rho at degree 2 and beat it at degree at least 3. The two-channel
      accounting fails the same gate it accuses the full-relation-only model of
      failing, and the record is withdrawn rather than re-scoped.
    - >-
      F8 CONVENTION-DEPENDENT. The arm ratio drops below 3 at probe cost 10. The
      separation is a counting-convention artifact and must be labelled so on
      every row.
    - >-
      F9 EVERYTHING HOLDS. RQ-ICEX-001 decision target has a structural answer at
      m = 2 -- alpha ranges over the open interval above 1/2 with infimum 1/2 at
      the degenerate boundary, so an interval excluding 1/2 from below is
      unreachable for this family -- and the sibling record parts (B1) and (B2)
      both require correction by reference, proposed to the Coordinator and never
      as an edit.
  interpretation_limits:
    - >-
      NOT AN ECDLP HARDNESS RESULT AND NOT A LOWER BOUND ON ANY ALGORITHM OUTSIDE
      THE FAMILY. It characterises one rate-constant family at one arity under
      one cost model. It does not interact with the generic-group bound, which
      bounds generic algorithms while this bounds a specific non-generic family.
    - >-
      SCOPED TO m = 2 AND TO RATE-CONSTANT ORACLES. FORWARD GUIDANCE, which is
      the most valuable part of the record: the factor base pays for itself only
      if the oracle decides asymptotically more candidate tuples than it performs
      operations. Every oracle this program has charged -- signed-sum sweep,
      enumeration, meet-in-the-middle -- has constant rate and is therefore inside
      the family and capped at infimum 1/2. The classes that REMAIN OPEN are
      exactly the superconstant-rate ones.
    - >-
      NO ADVANTAGE OVER RHO IS CLAIMED ANYWHERE. The best point in the family
      ties rho in time and loses to it by N^{1/2} in memory.
    - >-
      Because the family lower branch IS the birthday bound, a confirming result
      is expected to be reproduced in part by an object with no curve in it. That
      is stated in advance and is why the curve-free null governs the attribution
      rather than decorating it.
    - >-
      A CORRECTION IS NOT A VERDICT. Only a Coordinator decision may supersede or
      amend the sibling record, and the correction discipline forbids editing it.
      The two records must be adjudicated on shared instances under the shared
      frozen convention before either is cited as settling the other.
    - >-
      THE QUESTION IS UNDER A STANDING BLOCK. RQ-ICEX-001 constraints state it is
      blocked until three named goals each have a committed protocol or scoped
      measurement decision. This design does not lift that block.
    - >-
      THE EXTERNAL LITERATURE IS NOT ADJUDICATED. The large-prime variation is
      classical in adjacent settings and no novelty is claimed for it; what is
      claimed as new IN THIS CORPUS is the m = 2 instantiation, the unrestricted
      pool, and the closed form with its boundary reading.
