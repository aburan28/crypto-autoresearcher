hypothesis:
  id: H-KIC-baee02
  question_id: RQ-KIC-7502b9
  idea_id: IDEA-20260930-4ebd85
  statement: >-
    For the lexicographic bases at n=7 with m in {8, 12} and at n=11 with
    m in {12, 16}, the absolute relative gap
    |cov_curve - cov_cyclic| / max(cov_cyclic, 1/r) is at most 0.25 and the
    ratio cov_curve / cov_cyclic lies in [0.75, 1.25]. That is explanation G.
    Explanation N is a lexicographic cell whose gap exceeds 0.25. The
    arithmetic-progression control must exit that band. No exponent moves.
  mechanism: >-
    B is an explicit subset of the order-r subgroup. Coverage is the
    fraction of the r subgroup elements, including the identity, hit by an
    unordered triple of distinct points of B. M = m(m-1)(m-2)/6. The curve
    law uses the frozen addition formulas. The cyclic law applies one frozen
    bijection to Z/rZ and adds there. p_occ = 1-(1-1/r)^M is the expected
    coverage of M independent uniform throws. The decision compares the
    curve with the cyclic law. The random-label draw is reported against
    p_occ and is not the decision bit.
  assumptions:
    - >-
      The n=7 curve is y^2 + xy = x^3 + x^2 + 1 over F2[x]/(x^7+x+1), with
      group order 142 and r=71. The n=11 field is F2[x]/(x^11+x^2+1). Its
      group order is computed in the run.
    - >-
      Lexicographic B takes whole x-coordinate pairs until |B|=m. The random
      B is one frozen m-subset and is not optimized on coverage.
    - Identity is a legal sum and is included in the denominator r.
    - Distinct summands only. An S_3 orbit is one triple.
    - No smoothness probability and no first-fall degree is assumed.
  proof_search_map:
    bottleneck: >-
      Whether a coverage gap between the curve and a relabelled cyclic group
      is visible at these two toy scales. No algorithm step is removed.
    baseline_embedding:
      parameter_slice: >-
        n=7, r=71, m in {8, 12}, exhaustive image of every unordered
        distinct triple, compared with one frozen bijection to Z/rZ.
      reproduction_check: >-
        Affine addition with Fermat inversion and projective addition with
        extended-Euclid inversion produce the same n=7 hit set.
    observation_collision:
      observable: the hit set inside the subgroup, with orbit multiplicities
      distinct_preimage_search: >-
        A hit element with two S_3-orbits is a collision of the sum map.
        Multiplicities are retained. Mean multiplicity 1 means L=0.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: fibers of the sum map on distinct-triple orbits
        predicted_gain: >-
          Separates a coverage match from a structured multiplicity pattern.
      - transform: specialization_pack
        proposed_object: the same measurement at n=7 and n=11
        predicted_gain: >-
          A gap at only one scale is not reported as a property of the family.
    quantifier_order: >-
      For every frozen (n, m, bijection seed, subset seed) compute the three
      coverages. The bijection is not redrawn after cov_curve is known.
    method_ceiling:
      strongest_certifiable_claim: >-
        At these degrees and these m, the lexicographic curve sumset either
        matches the cyclic null within relative gap 0.25 or it does not.
        A match is not genericity at n=131. A mismatch is not an
        index-calculus exponent.
      nearby_object_control: >-
        The arithmetic progression {0, 1, ..., m-1} in Z/rZ must exit the
        band against its own frozen bijection. If it stays inside, the
        instrument is void.
    proof_obligations:
      - claim: the two n=7 addition routines agree on the hit set
        responsibility: correctness
      - claim: p_occ equals 1-(1-1/r)^M
        responsibility: baseline
      - claim: the arithmetic-progression control exits the match band
        responsibility: strictness
      - claim: no runtime or memory exponent is inferred
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        For M independent uniform throws into a set of size r, the expected
        hit fraction equals p_occ = 1-(1-1/r)^M. Separately, the curve
        coverage at the tested (n, m) lies within relative gap 0.25 of the
        relabelled cyclic coverage. The test decides the second sentence.
      random_model_justification: >-
        The first sentence is the classical occupancy expectation for
        independent uniform throws. No elliptic sumset theorem is assumed.
        Cauchy-Davenport is not claimed for this subgroup.
      supporting_results: []
      validation_experiment_ids:
        - EXP-KIC-976649
      falsification_condition: >-
        A lexicographic cell has absolute relative gap above 0.25, or the
        arithmetic-progression control stays inside the band.
  structural_ingredients:
    - description: >-
        n=7 parameters a=1, modulus x^7+x+1, group order 142, r=71. This
        session recomputed 141 affine points of
        y^2 + xy = x^3 + x^2 + 1, hence 142 points with infinity.
        x^11+x^2+1 is irreducible over F2 by trial division. The doubling
        slope lambda = x + y/x follows from the partial derivatives in
        characteristic 2.
      citation: IDEA-20260930-4ebd85
      provenance: internal
      verified_by: >-
        coordinator session 2026-10-05, direct enumeration and derivative
        check, using the parameter line recorded on IDEA-20260930-4ebd85
      role: frozen curve, field, and addition slope
    - description: >-
        The Feller occupancy sentence on the proposal is provenance recalled
        and is not support. The contract uses the finite formula
        1-(1-1/r)^M as the random-throw expectation and checks it
        arithmetically.
      citation: IDEA-20260930-4ebd85
      provenance: internal
      verified_by: >-
        idea-generator citation block of IDEA-20260930-4ebd85, which marks
        the Feller sentence recalled
      role: reminder that the occupancy formula is not an elliptic theorem
  reduction_chain:
    core_problem: >-
      Whether the triple-sum coverage of these explicit bases matches a
      relabelled cyclic group within the frozen band.
    corollaries: []
  predictions:
    - metric: abs_relative_gap_cov_curve_vs_cov_cyclic
      direction: lower
      minimum_effect: at most 0.25 on every lexicographic cell
    - metric: ap_control_exits_match_band
      direction: higher
      minimum_effect: 1 on every arithmetic-progression cell
  test_boundary:
    instances:
      - n=7, m in {8, 12}, lexicographic B and one random B
      - n=11, m in {12, 16}, lexicographic B and one random B
      - arithmetic progression of length m in Z/rZ at each of those four cells
    parameters:
      n7_modulus: x^7+x+1
      n11_modulus: x^11+x^2+1
      curve: y^2 + xy = x^3 + x^2 + 1
      n7_group_order: 142
      n7_r: 71
      bijection_seed: 5160325
      sensitivity_bijection_seed: 5160326
      subset_seeds:
        n7_m8: 5160327
        n7_m12: 5160329
        n11_m12: 5160330
        n11_m16: 5160331
      random_label_seed: 5160328
    implementation: >-
      Pair table of unordered distinct pairs, then a probe for the third
      point. Two addition routines at n=7. One primary bijection and one
      sensitivity bijection.
    budget:
      enforcement: advisory
      wall_clock_seconds_per_run: null
      maximum_memory_gb: 2
      maximum_runs: 1
  falsification_conditions:
    - >-
      On a lexicographic B, at either n and either pre-registered m, the
      absolute relative gap exceeds 0.25. Explanation G is false at that cell.
    - >-
      An arithmetic-progression cell stays inside the band. The instrument
      is void and no curve conclusion is drawn.
    - >-
      The two n=7 addition routines disagree on a hit set. The run is invalid.
    - >-
      The sensitivity bijection flips any lexicographic cell across the 0.25
      cut. The result is unresolved.
    - >-
      Mean orbit multiplicity is 1 and the gap is inside the band. L=0.
      Explanation G may still hold, and the write-up must not call that cell
      a lossy-projection finding.
  interpretation_limits:
    - >-
      A match at n=7 and n=11 is not genericity at cryptographic size.
      Pollard rho remains the ECDLP algorithm, with time exponent 1/2.
      The exponent delta is 0.
    - A mismatch is not an attack and is not a subexponential claim.
    - The explicit point set is an accounting fixture, not a new factor base.
    - A gap on the random B alone is not a property of every set of size m.
    - >-
      The recalled occupancy citation is not support. p_occ is computed
      from the displayed formula.
  status: specified
  proposed_by: coordinator
