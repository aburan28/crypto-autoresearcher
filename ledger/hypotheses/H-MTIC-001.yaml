hypothesis:
  id: H-MTIC-001
  question_id: RQ-ECDLP-002
  source_proposal: IDEA-20260726-001
  statement: >-
    For toy prime-field curves at 16, 20, and 24 bits with factor base
    B = ceil(sqrt(N)) and decomposition arity m = 3, the multi-target
    index-calculus crossover K* — the smallest K for which the amortized
    per-target cost of point-decomposition index calculus (KN-TECH-003)
    beats per-target Pollard rho — is either infinite, because the measured
    per-target descent cost T_desc meets or exceeds sqrt(N), or finite with
    the amortized cost at K* lying on or above the generic preprocessing
    frontier S*T^2 = Omega~(N) (KN-LIT-013, KN-TECH-005) when the IC
    preprocessing S = S_rel + S_LA is charged as advice and the per-target
    online cost T = T_desc + T_verify is charged as online time. That is:
    no non-generic multi-target advantage exists at toy scale. A finite K*
    whose amortized cost lies strictly below the frontier contradicts this
    hypothesis and is a non-generic signal requiring review-breakthrough
    scrutiny before any promotion (AGENTS.md rule 12). Every quantity —
    S_rel, S_LA, T_desc, T_verify, and the matched rho baseline — is
    measured on the same instances, not estimated from heuristics or quoted
    from literature.
  mechanism: >-
    In point-decomposition index calculus (KN-TECH-003) the factor-base
    logarithm table is computed once from relation collection (S_rel) plus
    sparse linear algebra (S_LA) and then reused for every target; the
    per-target cost is one descent (an S_{m+1} Groebner solve for Q + [t]P)
    plus verification. For K targets on the same fixed curve,
    C_IC(K) = S_rel + S_LA + K*(T_desc + T_verify), matched rho costs
    K*sqrt(N), and the generic preprocessing bound (KN-LIT-013) charges any
    fixed-curve advice scheme S*T^2 = Omega~(N). The crossover is
    K* = ceil((S_rel + S_LA) / (sqrt(N) - T_desc - T_verify)); if the
    denominator is non-positive, K* is infinite and the route is closed at
    toy scale. This hypothesis completes the measurement H-IC-001 began:
    EV-IC-001 (748 runs, B = 14, m = 2) found T_desc < sqrt(N) only for
    N > ~10^9 and K* finite on 4/4 such instances, but S_rel was never
    measured at bits >= 16 (a blocking objection in EV-ECDLP-006) and the
    S*T^2 frontier comparison was dropped from its protocol. In the
    B = ceil(sqrt(N)), m = 3 regime measured here, decompositions are
    plentiful (expected ~C(B,3)/N ~ sqrt(N)/6 per random target), so S_rel
    is directly measurable by enumeration-assisted harvesting, S_LA by a
    real Wiedemann solve, and the frontier point (S, T) can be plotted
    against S*T^2 = N. The factor-base log table is target-independent by
    construction (built only from the curve, the factor base, and harvested
    relations); EXP-MTIC-001 proves this by content-hash equality under
    target permutation and target withholding, the non-interference control
    the frontier comparison stands on.
  assumptions:
    - >-
      The factor-base log table is target-independent: no target-derived
      material enters preprocessing. This is enforced by construction and
      verified by the non-interference control (content-hash equality of
      tables built before target disclosure, under permuted target order,
      and under a withheld-target protocol).
    - >-
      T_desc is measurable at toy scale as the median Groebner solve cost
      for S_4 systems over the frozen factor base, including all failed and
      capped attempts at their full cap cost (censoring rule frozen before
      execution), and is convertible to group-operation equivalents by a
      frozen per-size rho calibration (EV-IC-001 precedent).
    - >-
      The advice-model mapping S = S_rel + S_LA (preprocessing) and
      T = T_desc + T_verify (per-target online) is the correct charging of
      this algorithm into the Corrigan-Gibbs--Kogan preprocessing model
      (KN-LIT-013), and S*T^2 = Omega~(N) is the correct reference frontier
      for the fixed-curve multi-target setting (KN-TECH-005).
    - >-
      At B = ceil(sqrt(N)) and m = 3 the expected decomposition count per
      random target (~sqrt(N)/6 at these sizes) makes relation collection
      by enumeration-assisted harvesting feasible within budget, so S_rel
      is measured, not estimated — the gap that blocked EXP-IC-001 v1.
    - >-
      Toy-scale measurements (16-24 bit primes, sqrt(N) ~ 2^8-2^12) can
      distinguish the sign of sqrt(N) - T_desc and the side of the frontier
      on which (S, T) lies, but cannot settle the asymptotic regime; EV-IC-001
      localized a finite-K* boundary near N ~ 10^9 (~30 bits) for a different
      (B, m) regime, and nothing here contradicts or extends that boundary.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        For every tested instance, the sign of (sqrt(N) - T_desc - T_verify)
        and the side of the S*T^2 = N frontier on which the measured point
        (S, T) = (S_rel + S_LA, T_desc + T_verify) lies are invariant between
        (i) group-operation-equivalent accounting via the frozen per-size rho
        calibration and (ii) raw wall-clock accounting, and between the two
        frozen calibrations (rho-walk rate and BSGS-construction rate) whose
        per-operation constants differ by a factor of at most 2. Equivalently:
        no crossover or frontier conclusion flips under any of these three
        accounting choices.
      random_model_justification: >-
        Both algorithms being compared are ultimately sequences of the same
        primitive (curve additions and doublings), and the calibration factor
        is itself measured per bit size from the matched rho baseline
        (harness/rho.py total_group_operations over wall seconds). A
        bounded-multiplier perturbation of a measured conversion factor can
        flip an inequality only when the two sides are already within that
        factor; the pre-registered dual-accounting audit detects exactly that
        borderline case instead of hiding it.
      supporting_results:
        - >-
          KN-TECH-001: Pollard rho expected cost ~sqrt(pi*N/2) group
          operations, the matched-baseline cost model the calibration
          converts through.
        - >-
          KN-LIT-013 / KN-TECH-005: the S*T^2 = Omega~(N) frontier is a
          theorem about group-operation counts, so group-operation
          equivalents are the theorem's native unit; wall-clock is the
          proxy that must be audited against it.
        - >-
          EV-IC-001 (internal, preliminary): the same calibration method was
          stable across 8-36 bits on 748 runs; cited as precedent for the
          method, not as evidence for this hypothesis.
      validation_experiment_ids: [EXP-MTIC-001]
      falsification_condition: >-
        The sign of (sqrt(N) - T_desc - T_verify) or the frontier-side of
        (S, T) differs between the group-operation accounting and the
        wall-clock accounting, or between the two frozen calibrations, for
        any tested instance. Refutation of HEUR-001 makes the cost-model
        comparison inconclusive; it is not evidence for or against the
        mathematical frontier itself.
  structural_ingredients:
    - description: >-
        Corrigan-Gibbs--Kogan tight generic preprocessing tradeoff
        S*T^2 = Omega~(N) for fixed-group discrete log with advice.
      citation: KN-LIT-013
      role: reference frontier (lower bound) for the advice-regime comparison
    - description: >-
        Shoup generic-group Omega(sqrt(N)) lower bound and its preprocessing
        form; defines what a non-generic signal must clear.
      citation: KN-TECH-005
      role: baseline theorem delimiting "non-generic advantage"
    - description: >-
        Pollard rho matched baseline with full group-operation accounting
        (precompute + walk + verify), measured in-run on the same targets.
      citation: KN-TECH-001
      role: control cost model for the per-target comparison
  predictions:
    - metric: per_target_descent_cost_vs_sqrt_n
      direction: higher
      minimum_effect: >-
        Median T_desc / sqrt(N) >= 1.0 on at least 2/3 of tested instances,
        making K* infinite and closing the multi-target IC route at toy
        scale. The competing outcome is T_desc / sqrt(N) < 1.0 (finite K*).
        Decisiveness requires IQR(T_desc) <= median(T_desc) among
        uncensored solves; capped solves count at full cap cost, which can
        only push the ratio upward, so heavy censoring cannot manufacture a
        finite K*.
    - metric: crossover_K_star
      direction: different
      minimum_effect: >-
        K* is computed per instance from measured S_rel, S_LA, T_desc, and
        T_verify — never from the heuristic S_rel estimate whose use blocked
        EXP-IC-001 v1 (EV-ECDLP-006). K* is either infinite or finite with
        value >= 2. A finite K* = 1 would mean IC already beats rho for a
        single target, contradicting KN-OPEN-001, and triggers investigation
        rather than promotion.
    - metric: amortized_cost_vs_generic_frontier
      direction: higher
      minimum_effect: >-
        For every instance with finite K*, the measured frontier product
        (S_rel + S_LA)*(T_desc + T_verify)^2 is >= N, i.e., the measured IC
        operating point lies on or above the S*T^2 = N reference curve and
        the amortized cost C_IC(K*)/K* shows no non-generic advantage. The
        competing outcome — product strictly below N — is the falsifier.
  test_boundary:
    instances:
      - >-
        3 toy prime-field short-Weierstrass curves with prime-order subgroup
        of order N, one per bit size {16, 20, 24}, seeds {1, 2, 3} mapped
        one-to-one to sizes; harness/toycurve.py generate_instance.
      - 50 descent targets per curve (R_i = a_i*P + b_i*Q, seeded uniform a_i, b_i).
      - 2000 known-log harvesting targets per curve for enumeration-assisted
        relation collection.
    parameters:
      factor_base_size: B = ceil(sqrt(N))
      decomposition_arity: m = 3 (S_4 systems)
      relation_target: ceil(1.2 * B) independent verified relations per instance
      enumeration_cap_per_instance: 50000000 tuple evaluations / 1500 s cumulative
      per_solve_cap_seconds: 60
      b_ablation_at_20bit: [ceil(N^(1/3)), ceil(N^(2/5))]
      calibrations: [rho_walk_rate, bsgs_construction_rate]
    implementation: >-
      harness/toycurve.py (instances), harness/semaev.py (factor base, S_4
      decomposition measurement; sympy Buchberger — implementation-bound
      proxies per its honesty note), harness/rho.py (matched baseline and
      calibration, verified discrete-log certificates), harness/runner.py
      (immutable run records). New glue confined to
      experiments/EXP-MTIC-001/.
    budget:
      wall_clock_seconds_per_run: 1800
      total_wall_clock_seconds: 13200
      total_cpu_hours: 3.7
      maximum_memory_gb: 4
      maximum_runs: 10
  falsification_conditions:
    - >-
      Non-generic signal: for any tested instance, T_desc < sqrt(N) AND the
      measured product (S_rel + S_LA)*(T_desc + T_verify)^2 < N, i.e., the
      amortized cost at K* lies strictly below the S*T^2 = N frontier. This
      contradicts the hypothesis, is not promoted on Executor authority, and
      requires review-breakthrough scrutiny (AGENTS.md rule 12) before any
      further claim.
    - >-
      K* = 1 for any tested instance, meaning IC beats rho for a single
      target at toy scale, contradicting KN-OPEN-001 and requiring
      investigation of the measurement before any interpretation.
    - >-
      Non-interference failure: the factor-base log table content hash
      differs across targets or under the permuted/withheld-target protocols
      — preprocessing is then not target-independent, the frontier charging
      is inapplicable, and the affected runs are invalid (evidence-integrity
      failure, not a mathematical result).
    - >-
      Inconclusive outcome (recorded, not falsified): the crossover sign is
      undecidable because HEUR-001 is refuted (accounting units disagree on
      the sign) or because IQR(T_desc) > median(T_desc) on a majority of
      instances with censoring too weak (cap below sqrt(N) equivalents) to
      bound the sign — per the frozen censoring rule the cap is ~60 s at
      calibration ~8e5 group-ops/s, far above sqrt(N) <= 2^12, so this
      outcome requires calibration collapse, not ordinary solver noise.
  interpretation_limits:
    - >-
      Toy scale only (16-24 bits, sqrt(N) <= 2^12). K* at these sizes says
      nothing about crypto-scale behavior; a finite K* would be a scaling
      signal, not cryptographic evidence, and K* = infinity closes only the
      tested scope (these sizes, B = ceil(sqrt(N)), m = 3, sympy Buchberger,
      frozen caps) — it does not prove K* = infinity asymptotically or in
      other regimes (EV-IC-001 found finite K* at N > ~10^9 for B = 14,
      m = 2).
    - >-
      All cost comparisons are implementation-bound (sympy Groebner vs
      Python rho on one machine, calibrated per EV-IC-001 precedent). Only
      within-machine, within-implementation, within-accounting conclusions
      are valid; a different solver (F4/F5, Sage) shifts absolute numbers.
    - >-
      The S*T^2 frontier applies to generic algorithms; IC preprocessing is
      non-generic, so the comparison is between a concrete non-generic
      scheme and the generic frontier — a below-frontier point is the
      non-generic signal the falsification condition names, and it requires
      independent review before any promotion.
    - >-
      The measurement proposes no new mechanism; it measures whether
      existing IC structure provides a multi-target amortization advantage
      at toy scale, and it repairs the specific evidentiary gaps of
      EV-IC-001 (unmeasured S_rel, dropped frontier comparison, missing
      non-interference receipt).
  status: approved
  proposed_by: coordinator
