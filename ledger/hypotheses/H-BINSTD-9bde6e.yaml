    - description: Sparse/structured LA engines (Wiedemann, block, structured GE)
      citation: KN-TECH-008
      provenance: internal
      verified_by: coordinator (via idea citation; corpus technique entry)
      role: three-engine control baseline
    - description: Completed binary ECDLP / sect113r2 public record set
      citation: KN-TECH-036
      provenance: internal
      verified_by: coordinator (via idea citation)
      role: Stage 0 second anchor; realisable-P reality check
    - description: g_rho := sqrt(|Aut|) symmetry-gain pin
      citation: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-2e2a58.yaml
      provenance: internal
      verified_by: coordinator (design absorption of HOLD-M / review defect)
      role: unit pin for nearby-object binding-axis control

  reduction_chain:
    core_problem: resource-space crossover (T, M, P) between IC and matched rho
    corollaries: []

  predictions:
    - metric: measured_rho_relative_overhead_vs_P_over_2D
      direction: different
      minimum_effect: >-
        Track P/(2D) within 20% across a three-decade theta sweep at fixed P.
        Systematic departure falsifies limb (B) floor application.
    - metric: krylov_chain_length_real_vs_null
      direction: lower
      minimum_effect: >-
        PREREGISTERED: scales as B'/n0 with coefficient constant within 20%
        across n0 in {1,8,32,64}. Real within 5% of null => generic; real
        below 0.5x null => structure finding (high-value surprise).
    - metric: P_star_per_row
      direction: higher
      minimum_effect: >-
        (E1): P* > 10^3 times largest realisable width in KN-TECH-036 record
        set at every row and every L_mv. Any row with P* < 10^6 concurrent
        walks falsifies (E1).
    - metric: memory_ratio_per_row
      direction: higher
      minimum_effect: >-
        (E2): > 2^20 at every row where IC ops within 2^10 of matched rho
        (epsilon=0.01, P=10^9). Ratio < 2^4 falsifies (E2) on that row.
    - metric: binding_axis_label
      direction: different
      minimum_effect: >-
        Single-valued per row (TIME|MEMORY|WIDTH) or labelled sweep-dependent.
        Nearby-object B-m vs K-m under pinned g_rho must not flip the axis
        from the symmetry constant alone.

  test_boundary:
    instances:
      - Stage 0 zero-compute: KN-LIT-096 + KN-TECH-036 reproduction; g_rho pin; symbolic region model
      - Stage 1 parallel rho on toy binary n in {23,29,31,37,41} Koblitz + matched ordinary
      - Stage 2 LA engine implementation + real matrices B' in [2^6,2^10] + shape-matched null
      - Stage 3 region table (zero compute) after Stage 0-2 gates
    parameters:
      P: [16, 256, 4096]
      theta_decades: 3
      n0: [1, 8, 32, 64]
      L_mv_seconds: [1.0e-4, 1.0e-3, 1.0e-2]
      seeds_per_rho_cell: 30
      matrices_per_LA_cell: 10
      g_rho_unit: sqrt_Aut
    implementation: >-
      Pure-Python where possible; optional EXP-CERTBIN-e94b27 gf2n/curve.
      Stage 2 builds block Wiedemann / block Lanczos / structured GE under
      experiments/EXP-BINSTD-a3fa22/implementation/ (~1000-1500 LOC).
    budget:
      wall_clock_seconds: 86400
      maximum_memory_gb: 4
      maximum_runs: 200

  falsification_conditions:
    - >-
      Measured rho relative overhead departs systematically from P/(2D): limb
      (B) floor application fails; memory side of region must be rebuilt.
    - >-
      Krylov chain on real matrices materially below B'/n0 while null matches:
      structure finding; IC floor drops — report before quoting region table.
    - >-
      Any standardized row with P* < 10^6 concurrent walks: (E1) falsified.
    - >-
      Any competitive row (IC ops within 2^10 of rho) with memory ratio < 2^4:
      (E2) falsified.
    - >-
      Stage 0 fails to reproduce KN-LIT-096 or KN-TECH-036 anchors: withdraw
      rather than re-scope.
    - >-
      Binding axis unstable across input ranges at most rows: honest output is
      the list of inputs whose tightening would decide it.
    - >-
      Nearby-object B-m vs K-m under pinned g_rho flips binding axis from the
      symmetry constant alone: unit/accounting defect, not a structural verdict.

  interpretation_limits:
    - >-
      NO ATTACK PROPOSED; NO EXPONENT MOVED. Deliverable is a region, two
      corrected premises (one known-tradeoff application, one recalled-then-
      measured floor), and per-row binding axis.
    - >-
      Limb (B) does not claim novelty of P/(2D); novelty is applying the known
      floor to this population's region table.
    - >-
      Chain-length law measured at B' <= 2^10; deployed extrapolation prints
      distance; no security statement about named curves.
    - >-
      B' unsettled (double reading); quoting one without the other misrepresents.
    - >-
      LA algorithms outside the three engines are out of scope.
    - >-
      IDEA-20260922-2e2a58 claim text remains as proposed historical proposal.

  dominated_by: >-
    CHECKED ROW BY ROW. As an ATTACK this record mounts none; matched rho with
    negation and Frobenius (KN-LIT-012/096), BSGS, multi-target pooled rho,
    kangaroo where applicable, S*T^2 preprocessing (excluded by assumption),
    and the 117.35-bit completed record (KN-TECH-036) all dominate on attack
    axes. This is a measurement of where two existing algorithms sit in
    resource space, not a third algorithm. NOT NULL ON ANY AXIS.
  sota_delta:
    time: >-
      Zero attack speedup. Quantified: per-row P*; measured Krylov chain-length
      law replacing a recalled model; corrected rho parallel accounting that
      keeps linear speedup but attaches known Theta(P) storage floor.
    memory: >-
      (i) rho memory stated as known Theta(P) floor applied to this population
      (not claimed as new formula). (ii) IC memory exponent identified as the
      only axis of power-of-N separation.
    data_queries: Neither side makes queries; stored DPs / relation columns on memory axis.

  distinguishable_outcomes:
    E1_E2_confirmed: >-
      Width binds at no row; memory binds at every competitive row — replace
      parallelism slogan with memory-loss summary B'/(g_rho-corrected P/(2 eps)).
    E1_falsified: >-
      Some row has P* < 10^6 — width axis operative; write the number.
    E2_falsified: >-
      Competitive row with memory ratio < 2^4 — memory not the obstacle there.
    structure_finding: >-
      Real Krylov chain << null while null matches 2B'/n0 — first measured
      spectral-structure statement; floor drops.
    limb_B_breaks: >-
      Overhead departs from P/(2D) — rebuild memory side before any row quote.
    stage0_fail: >-
      Cannot reproduce published anchors — withdraw / infrastructure.
    sweep_dependent: >-
      Binding axis flips inside L_mv or input sweeps — label unstable; list
      deciding inputs.
    infrastructure: >-
      Crash/timeout/missing dependency — failed_infrastructure, never a
      mathematical miss (AGENTS.md rule 5).

  status: approved
  status_note: >-
    specified then approved under DEC-20260930-982e92 (standing user
    authorization 2026-09-06). Approval is of the protocol form, not of the
    mathematical claims. Scientific execution of Stages 0-3 is authorized by
    that decision, with Stage 3 gated on Stage 0-2 pass criteria and the
