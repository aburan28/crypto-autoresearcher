# =============================================================================
# H-BINSTD-9bde6e -- Resource-space crossover surface (time, memory, parallel
# width) for standardized binary ECDLP: rho storage floor Theta(P) as known
# van Oorschot-Wiener tradeoff applied as FLOOR; IC Krylov wall-clock floor;
# preregistered (E1)/(E2) binding-axis verdicts.
# Specified and approved under DEC-20260930-982e92 from IDEA-20260922-2e2a58
# under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001, absorbing the 2026-09-26 review
# defects (analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-2e2a58.yaml)
# as protocol corrections: limb (B) novelty = application-as-floor (known
# tradeoff); chain-length constant RECALLED + measured; LA engine built under
# this EXP write_scope; g_rho := sqrt(|Aut|) pinned.
#
# ZERO RUNS in this design packet. IDEA-20260922-2e2a58 claim text is not
# edited (proposals immutable); this hypothesis cites it and freezes the
# corrected novelty / unit / engine notes for experimental purposes.
# =============================================================================
hypothesis:
  id: H-BINSTD-9bde6e
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-2e2a58
  experiment_id: EXP-BINSTD-a3fa22
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-09-30'
  approved_at: '2026-09-30'
  authorised_by: DEC-20260930-982e92
  review_cited: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-2e2a58.yaml
  proposed_by: coordinator
  title: >-
    Index-calculus-vs-rho crossover is a surface in (T, M, P): rho storage
    floor Theta(P) (known vOW tradeoff applied as floor to the standardized
    binary population); IC Krylov wall-clock floor (2B'/n0)*L_mv; width axis
    binds at no row and memory axis binds at every competitive row

  statement: >-
    SETTING. Standardized binary ECDLP population of RQ-BINSTD-b6f698.
    Comparator: matched van Oorschot-Wiener parallel Pollard rho carrying every
    symmetry the curve grants, with g_rho PINNED as sqrt(|Aut|) (see g_rho_pin
    below). Challenger: decomposition-based index calculus with effective
    matrix dimension B' (swept in both B and B/g readings on orbit-collapse
    rows).

    (A) THE SCALAR CROSSOVER IS UNDER-DETERMINED. Per-curve "does any IC line
    beat matched rho" has no scalar answer: each algorithm is a REGION in
    (wall-clock T, peak memory M, parallel width P). This hypothesis replaces
    the scalar with the closed-form region for both sides.

    (B) RHO STORAGE FLOOR — KNOWN TRADEOFF APPLIED AS FLOOR (NOT NOVEL FORMULA).
    Under van Oorschot-Wiener (KN-LIT-012) with distinguished-point probability
    theta, total iterations T_rho, and P concurrent walks: stored points
    D = theta * T_rho; end-of-run waste P/(2 theta); relative overhead
    P/(2D). Eliminating theta: rho attains relative overhead epsilon at storage
    D = P/(2 epsilon). ITS MEMORY FLOOR IS Theta(P) RECORDS, proportional to
    parallel width and independent of the group order. NOVELTY OF THIS LIMB:
    application of the known vOW storage/overhead tradeoff AS A FLOOR to the
    standardized binary population and its region table — NOT novelty of the
    P/(2D) derivation itself (frontier_check / review: mark known). The
    published 2^35.63 ECC2K-130 distinguished points (KN-LIT-096) are a
    granularity CHOICE, not a requirement.

    (C) INDEX-CALCULUS WALL-CLOCK FLOOR. Relation collection parallelises like
    rho. The LINEAR-ALGEBRA phase does not: block Wiedemann (Coppersmith,
    KN-LIT-017) has a Krylov sequence of length about 2B'/n0 matrix-vector
    products forming a SEQUENTIAL CHAIN. Chain-length CONSTANT 2/n0 is RECALLED
    (KN-LIT-017 body not yet quoted as support for deployed rows); Stage 2
    measures it against a shape-matched null before any Stage 3 deployed row
    is emitted. Floor: T_IC_floor = (2 B'/n0) * L_mv, independent of P.

    (D) FEASIBILITY REGION. IC preferable at (T, M, P) iff (D1) TIME, (D2)
    MEMORY, and (D3) WIDTH all hold as in IDEA-20260922-2e2a58 claim (D), with
    g_rho under the pinned unit below.

    (E) PREREGISTERED VERDICT. With n0 = 64, L_mv in {1e-4, 1e-3, 1e-2} s, and
    f from KN-LIT-096 (~54.03e6 iter/s on GTX 295): (E1) WIDTH axis binds at NO
    standardized row (P* exceeds realisable width by >10^3); (E2) MEMORY axis
    binds at EVERY competitive row (memory ratio > 2^20 where IC ops within
    2^10 of matched rho). Consequence if both hold: the lane's "rho
    parallelises and IC does not" slogan measures the wrong axis; honest
    one-line summary is "IC loses on memory, not on parallelism".

  g_rho_pin:
    definition: >-
      g_rho := sqrt(|Aut|) — the Pollard rho symmetry gain from the curve's
      automorphism / equivalence-class reduction used in the walk.
    negation_only_rows: >-
      |Aut| = 2 (negation map); g_rho = sqrt(2) = √2 ≈ 1.41421356237.
    koblitz_frobenius_rows: >-
      Negation plus Frobenius class reduction of orbit size n on F_{2^n}
      Koblitz; |Aut| = 2n; g_rho = sqrt(2n).
    unit_note: >-
      PINNED EXPLICITLY (review defect / HOLD-M). Nearby-object control
      (B-m vs K-m) MUST use this unit so binding-axis sensitivity is meaningful.
      The source idea's nearby-object prose that wrote "g_rho = 2" for
      pseudorandom rows is CORRECTED here to g_rho = sqrt(2); do not inherit
      the ambiguous unit.
    verified_by: coordinator (design session 2026-09-30)

  statement_note: >-
    Absorbs analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-2e2a58.yaml
    (verdict sound_with_corrections): (1) limb (B) known-tradeoff-as-floor;
    (2) chain-length recalled + Stage 2 measure + KN-LIT-017 body gate before
    Stage 3 quotes; (3) sparse LA engine (~1000-1500 LOC) authorized as Stage 2
    implementation under this EXP write_scope (GOAL-ICPERF-e6b6a4 historical
    ownership noted; shareable code path); (4) g_rho unit pinned as above.
    IDEA-20260922-2e2a58 claim text remains immutable at status proposed.

  mechanism: >-
    OBJECT FRAME. Representation: a PHASE of the pipeline as its DEPENDENCY
    CHAIN (partially ordered charged operations with sequencing edges).
    Tracked object: RESOURCE TRIPLE (critical-path length in latency units,
    peak live words, maximum useful concurrency). Operation set Sigma =
    {REPLICATE across independent instances; RE-BLOCK Krylov by n0;
    RE-GRANULATE distinguished-point predicate by theta}. Class III,
    coordinate-dependent (schedule property, not group-element property).
    Lossy-projection discards arithmetic detail; compatible with Sigma.
    Priced open number: L_mv (swept over three decades). Lens is the schedule
    object; F1 (rho) and F2 (factor-base) are COMPONENTS, not the lens. No F7
    preprocessing charged on either side.

  assumptions:
    - >-
      A stored distinguished point is one record of declared size; default 32
      bytes; every storage figure reported at 16, 32, 64 bytes.
    - >-
      P counts CONCURRENT WALKS, not machines. Machine count reported separately.
    - >-
      g_rho uses the pinned unit (sqrt(|Aut|)): negation-only sqrt(2);
      Koblitz/Frobenius sqrt(2n). Comparisons against a stripped baseline are
      not computed.
    - >-
      C_att, p, R_need, B, l are INPUTS owned by RQ-SDEG-001 / RQ-RELN-001 /
      RQ-ICPERF-94c86e; every output row reported over declared ranges.
    - >-
      B' double reading (B and B/g) on every Koblitz/subfield row
      (IDEA-20260922-b19793 settles which holds; this record does not).
    - >-
      No preprocessing; single-instance amortisation only.
    - >-
      Deployed curves are ARITHMETIC ONLY in Stage 3; executable cells are toy
      binary n <= 41 plus Stage 0 published-attack reproductions.
    - >-
      Limb (B) P/(2D) derivation is treated as KNOWN (KN-LIT-012); contribution
      is applying it as a floor to this population.
    - >-
      Chain-length constant 2B'/n0 is RECALLED until Stage 2 measurement and
      KN-LIT-017 body read gate the Stage 3 region table.

  proof_search_map:
    bottleneck: >-
      The SEQUENTIAL KRYLOV CHAIN in the linear-algebra phase. If product i+1
      did not need product i, IC would parallelise as freely as rho and limb
      (C) would be vacuous. The whole width axis lives or dies on that dependency.
    baseline_embedding:
      parameter_slice: >-
        P = 1 collapses (D1) to the operation-count comparison; epsilon = 1
        collapses rho storage to P/2; L_mv -> 0 collapses (C) to "IC
        parallelises freely". Each incumbent is an exact parameter slice.
      reproduction_check: >-
        At P = 1 the region's time condition must reproduce the operation-count
        comparison for the same cell. Model must reproduce KN-LIT-096's
        ECC2K-130 triple (2^60.9, 2^35.63, 2^25.27) exactly from T_rho and
        theta, and 54.03e6 iter/s -> 1263 GPUs/year within 5 percent. Also
        reproduce KN-TECH-036 sect113r2 anchor. Mismatch halts Stage 0.
    observation_collision:
      observable: '"Index calculus beats rho on this curve" as a scalar verdict'
      distinct_preimage_search: >-
        Same scalar from incompatible operating points: (i) fewer ops unbounded
        memory P=1; (ii) fewer ops bounded memory (may be infeasible); (iii)
        lower wall clock at small P, reversed at large P; (iv) lower wall clock
        at large P only because L_mv=0. Identifying tuple: (charged ops, peak
        words, max useful P, L_mv).
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold scalar verdict fixed; vary operating point; exhibit four
          incompatible preimages.
        predicted_gain: >-
          Converts headline from scalar to region. NO ATTACK EXPONENT MOVED.
      - transform: specialization_pack
        proposed_object: >-
          Resource triple under (replicate, re-block, re-granulate) with L_mv
          the priced open number.
        predicted_gain: >-
          Makes width-axis slogan a computable falsifiable number per row.
    quantifier_order: >-
      CLAIMED, DERIVED (known vOW arithmetic applied as floor): FOR ALL P,
      FOR ALL theta, relative overhead P/(2D); FOR ALL epsilon EXISTS D >=
      P/(2 epsilon); rho storage floor Theta(P) independent of N.
      CLAIMED, CONDITIONAL ON RECALLED CHAIN MODEL AND MEASURED IN STAGE 2:
      FOR ALL P, IC wall clock >= (2B'/n0) L_mv.
      PREREGISTERED: FOR ALL standardized rows and FOR ALL L_mv in the swept
      range, width does not bind and memory does (on competitive rows).
      NOT CLAIMED: lower bound on L_mv; that no shorter-critical-path LA exists;
      any attack exponent for either algorithm; novelty of the P/(2D) formula.
    method_ceiling:
      strongest_certifiable_claim: >-
        Per standardized binary row and declared input ranges: the set of
        (T, M, P) where the named IC column is preferable to matched rho, plus
        which of TIME/MEMORY/WIDTH binds. Cannot certify crossover non-existence,
        hardware L_mv, or LA algorithms outside the compared set.
      nearby_object_control: >-
        (1) Instantiate identical accounting on KN-LIT-096 ECC2K-130 and
        KN-TECH-036 sect113r2 / 117.35-bit record; must reproduce published
        tuples AND place them at DIFFERENT tradeoff-curve points.
        (2) B-m vs K-m null-curve control with PINNED g_rho: negation-only
        g_rho = sqrt(2); Koblitz g_rho = sqrt(2n). Binding axis must not change
        under the symmetry-constant shift alone; if it does, the region is driven
        by the unit, not the structural asymmetry. (Source idea's "g_rho = 2"
        for pseudorandom rows is corrected to sqrt(2) under this pin.)
    proof_obligations:
      - claim: >-
          Model reproduces KN-LIT-096 (2^60.9, 2^35.63, 2^25.27) and 1263-GPU
          one-year figure within 5 percent; KN-TECH-036 sect113r2 anchor.
        responsibility: baseline
      - claim: >-
          Measured rho relative overhead equals P/(2D) within 20 percent across
          a theta sweep of three decades (application of known floor).
        responsibility: correctness
      - claim: >-
          Block Wiedemann Krylov chain length on real toy matrices equals
          2B'/n0 within 20 percent, or measured law replaces recalled law
          before Stage 3; shape-matched null required.
        responsibility: runtime
      - claim: >-
          IC peak live words equal c_M B' with c_M measured on the toy pipeline.
        responsibility: memory
      - claim: >-
          Every deployed row emits extrapolation distance from nearest measured
          toy cell; g_rho uses pinned unit.
        responsibility: scope
      - claim: >-
          KN-LIT-017 body read before Stage 3 quotes the chain-length constant
          as literature support (Stage 2 measurement is the hedge regardless).
        responsibility: scope
    not_applicable_reason: null

  asymptotic_claim:
    problem: >-
      ECDLP on the standardized binary population — resource-space comparison
      between decomposition-based index calculus and matched van Oorschot-Wiener
      rho
    prior_best: >-
      Matched rho with curve symmetries: c sqrt(N)/g_rho group operations
      (g_rho = sqrt(|Aut|)), storage on the known vOW D = P/(2 epsilon) curve,
      near-linear parallel speedup (KN-LIT-012).
    time_exponent: >-
      Unchanged for both sides. Adds a P-independent floor term to the IC side;
      removes an unstated zero from rho's memory accounting. NO EXPONENT MOVE.
    memory_exponent: >-
      IC N^{1/(m+1)} words vs rho N^0 records (Theta(P) in width). Statement that
      this is the axis on which they differ by an exponent — not a new algorithm.
    hidden_cofactor: >-
      L_mv (hardware), n0 (blocking), c_M (measured), epsilon, factor g between
      B' readings, g_rho under pinned sqrt(|Aut|).
    claim_kind: cost_model_correction
    claim_kind_note: >-
      asymptotic_claim is cost-model-only. No attack exponent is moved. Promotion
      gates for supported asymptotic claims do not apply to a cost-model
      correction of this kind; evidence still scoped to tested cells.

  heuristic_assumptions:
    - id: H-BINSTD-XOVER-1
      formal_statement: >-
        In van Oorschot-Wiener parallel collision search with P concurrent walks
        and distinguished-point probability theta, expected wasted work at
        termination is P/(2 theta) iterations and stored distinguished points
        at termination are theta T_rho, so relative overhead is P/(2D) and rho's
        storage floor at relative overhead epsilon is D = P/(2 epsilon) records.
        This is the known vOW tradeoff (KN-LIT-012) applied as a FLOOR.
      random_model_justification: >-
        RIGOROUS: geometric walk residuals give inspection-paradox mean
        1/(2 theta); D = theta T_rho by linearity. GAP: assumes genuine random
        function iterate (no cycling, no fruitless negation/Frobenius collisions,
        no predicate–step correlation). Koblitz class reduction can break
        memorylessness — tested gap.
      supporting_results:
        - KN-LIT-012 van Oorschot-Wiener distinguished-point tradeoff (kb/internal)
      validation_experiment_ids:
        - EXP-BINSTD-a3fa22
      falsification_condition: >-
        Measured relative overhead departs systematically from P/(2D) (>20%
        across the theta sweep) on toy cells with passing counters.
    - id: H-BINSTD-XOVER-2
      formal_statement: >-
        Block Wiedemann Krylov stage on a B' x B' relation matrix with blocking
        parameter n0 requires a sequential chain of about 2B'/n0 matrix-vector
        products that cannot be reordered, so phase wall clock >= (2B'/n0) L_mv
        for any processor count. CONSTANT 2/n0 is RECALLED pending Stage 2
        measurement and KN-LIT-017 body read.
      random_model_justification: >-
        RIGOROUS: Krylov product i+1 data-depends on product i. GAP: constant
        2/n0 recalled from block-Wiedemann literature (KN-LIT-017 body not yet
        opened as support); matrices with low-degree minimal polynomials have
        shorter chains — shape-matched null detects structure.
      supporting_results:
        - KN-LIT-017 Coppersmith block Wiedemann (front matter only until Stage 2 gate)
        - KN-TECH-008 sparse LA baseline (internal)
      validation_experiment_ids:
        - EXP-BINSTD-a3fa22
      falsification_condition: >-
        Real-matrix chain length materially below B'/n0 while shape-matched
        null matches 2B'/n0 (structure finding); OR both depart >20% from
        2B'/n0 with no replacement law before Stage 3.

