      citation: KN-LIT-012
      provenance: kb
      verified_by: coordinator (read KN-LIT-012 corpus entry this session)
      role: known rho memory/processor/time tradeoff; limb (B) floor source
    - description: ECC2K-130 published work/DP/rate figures (Stage 0 reproduction)
