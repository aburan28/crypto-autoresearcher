hypothesis:
  id: H-NGCC-f74578
  question_id: RQ-NGCC-f52138
  idea_id: IDEA-20261001-b458c1
  statement: >-
    On the official NGCC round-1 Tins submission (sign-29), for every
    parameter set the package declares, one honestly generated signature
    determines a signing witness from which a fresh message can be signed
    so that a separately compiled official verifier accepts it.
  mechanism: >-
    The mechanism under test is the published sign-29-1 argument: linear
    algebra over F2 on at most 1,044 unknowns extracted from one signature,
    as reported by Saarinen, ePrint 2026/2266. This hypothesis does not
    restate that argument's internal equations. The executor reads them
    from the finding and the specification before any recovery run. A
    witness is accepted only through the scheme's verification API.
  assumptions:
    - The official package's reference implementation matches the specification on honest key generation, signing, and verification.
    - The published unknown-count of at most 1,044 is the claim being tested, not an assumption this hypothesis adds.
  proof_search_map:
    not_applicable_reason: >-
      This hypothesis is an empirical reproduction of a published concrete
      claim. It asserts no theorem, asymptotic bound, or reduction.
    bottleneck: null
    baseline_embedding:
      parameter_slice: null
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms: []
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations: []
  predictions:
    - metric: fresh_message_signatures_accepted_by_separate_verifier
      direction: higher
      minimum_effect: >-
        At least one accepted fresh-message signature on each of two
        independent keys, for every declared parameter set.
  test_boundary:
    instances:
      - sign-29 Tins, official round-1 zip named in inputs/ngcc-round1-20260920/candidates.yaml
    parameters:
      parameter_sets: every set the official package declares, recorded before recovery runs
      keys_per_set: 2
      keygen_seeds: [0, 1]
    implementation: >-
      Reference C compiled by this program from submission sources.
      Nothing shipped as a binary, object file, or submission build script
      is executed.
    budget:
      enforcement: advisory
      wall_clock_seconds_per_run: null
      maximum_memory_gb: 8
  falsification_conditions:
    - >-
      For some declared parameter set, both seeds fail to yield a
      fresh-message signature accepted by the separate verifier, and the
      run manifest records a completed recovery attempt rather than a
      build failure, timeout, or crash.
  interpretation_limits:
    - A success is scoped to the tested package, parameter set, and seeds. It does not transfer to a later revision.
    - A failure of this reproduction does not clear Tins. It refutes only this published argument on the tested instances.
    - Placeholder hash behavior is out of scope. The test uses the submission's own signing and verification API.
  status: specified
  proposed_by: coordinator
