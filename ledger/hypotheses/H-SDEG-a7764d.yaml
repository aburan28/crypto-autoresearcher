# =============================================================================
# H-SDEG-a7764d — specified from IDEA-20261006-e1215a (bytes copied
# unchanged from origin/design/mlkem-0e9abf-isometry). Question
# RQ-SDEG-001. The prediction under test is the idea's own: on the
# F_61, B = 8 cell, the miss mean of d_solve and the hit mean either
# differ by strictly less than 1, or the miss mean exceeds the hit
# mean by at least 1. A finished gap of at least 1 in the other
# direction (hit mean exceeds miss mean) is a negative. This record
# does not assert which of the two supportive readings occurs.
# =============================================================================
hypothesis:
  id: H-SDEG-a7764d
  question_id: RQ-SDEG-001
  source_idea_ids:
    - IDEA-20261006-e1215a
  added: '2026-10-06'
  status: approved
  proposed_by: coordinator
  title: >-
    Hit versus miss grevlex solving degree on one F_61, B = 8 cell
  statement: >-
    For one ordinary short-Weierstrass curve over F_61, m = 3, and
    one recorded factor base of B = 8 x-coordinates, let D be the
    mean grevlex solving degree on targets that do not decompose
    over the base, minus the mean on targets that do. The idea's
    prediction is that either the absolute value of D is strictly
    less than 1, or D is at least 1. The same comparison on a
    second recorded base of size 8 on the same curve must fall on
    the same side of the threshold 1. Absolute difference strictly
    less than 1 is one shared degree. A gap of at least 1 with the
    miss mean larger is two populations. A finished D at most -1
    on the primary base, both classes having at least four targets,
    is the concrete negative: the hit systems are harder by a full
    degree, and the idea's disjunction does not allow that sign.
    No exponent improvement is claimed.
  mechanism: >-
    The tracked object is the pair of conditional means of d_solve
    given the branch "the target decomposes" and the branch "it
    does not". The decomposition check is a sum of three distinct
    base points compared with the target or its negative. That
    check selects the sample. The degree is measured separately
    on each branch by one grevlex solver, and the witness tuple
    is discarded. The priced quantity is D, the difference of the
    two means. Agreement and a positive gap of at least 1 are the
    two readings the source idea treats as supportive. The wrong
    sign is the reading it does not. Exhaustive addition at B = 8
    supplies the labels. The solver is not the labeler.
  assumptions:
    - >-
      A target is a hit if and only if some ordered triple of
      distinct base points sums to it or its negative, checked by
      point addition. The solver is not the labeler.
    - >-
      Hits and misses are solved with the same grevlex parameters,
      the same membership polynomial, and the same omission of
      degree-p field equations.
    - >-
      At least four hits and four misses occur, and at least
      twelve targets are drawn. If either class has fewer than
      four after the enlargement cap of 96 targets, the cell is
      inconclusive for lack of one class.
    - >-
      The component under measurement is the conditional degree
      on this cell. No new base shape and no new relation shape
      are introduced.
  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: >-
        One shared degree for hits and misses, or a miss-minus-hit
        gap of at least 1, on p = 61 and B = 8.
      reproduction_check: >-
        A second solver build recomputes every scored primary-base
        target and must return the same integer degree on each.
    observation_collision:
      observable: conditional mean of d_solve
      distinct_preimage_search: >-
        Several targets in one class may share a degree. That
        collision is recorded and is not a discrete logarithm.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: the set of targets with a given d_solve inside one branch
        predicted_gain: none as an attack
    quantifier_order: >-
      The claim is an empirical statement about two sample means
      on one declared cell and one second base, not a quantified
      security theorem.
    method_ceiling:
      strongest_certifiable_claim: >-
        On this cell, the two conditional means lie on one side of
        the threshold 1, the same side on both bases, or they do
        not.
      nearby_object_control: >-
        support-matched random systems labeled by empty versus
        nonempty variety
    proof_obligations:
      - claim: no theorem is offered
        responsibility: scope
    not_applicable_reason: >-
      Control experiment for a mixture of two instance classes.
      The nearby object is the random arm, not a proof obligation.
  rerandomization: >-
    No re-randomizing walk is used. Targets are drawn once from
    the prime-order subgroup and then labeled.
  asymptotic_claim:
    problem: prime-field ECDLP
    prior_best: Pollard rho at Theta(N^{1/2}) group operations
    time_exponent: '1/2, unchanged; this hypothesis does not move it'
    memory_exponent: polylogarithmic per rho walk, unchanged
    hidden_cofactor: none; no attack cost is proposed
    claim_kind: constant_factor
    claim_kind_note: >-
      The constant factor against rho is 1. claim_kind is filled so
      the non-claim is explicit. The separator is a difference of
      two toy means, not a cheaper discrete logarithm.
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        Conditional on the generator degrees and the monomial
        order, the grevlex solving degree of an empty S_4 fiber
        and of a nonempty S_4 fiber are equal in mean, for targets
        drawn uniformly, at p = 61 and B = 8.
      random_model_justification: >-
        No identity forces the two conditional means to agree.
        The assumption imitates the model in which a random
        consistent zero-dimensional system and a random
        inconsistent system of the same degrees share a Macaulay
        degree, with emptiness decided only by coefficient
        specialisation. That model is classical for random
        polynomials and is not a theorem for summation
        polynomials. KR-IC-5a43e5, opened in this session, fixes
        the degree pattern and does not fix these conditional
        means.
      supporting_results: []
      validation_experiment_ids:
        - EXP-SDEG-703c40
      falsification_condition: >-
        On the primary base the miss mean exceeds the hit mean by
        at least 1, and the support-matched random arm shows a
        difference within strictly less than 1 of that gap, with
        the random difference itself at least 1.
  structural_ingredients:
    - description: >-
        S_m vanishes when points with those x-coordinates sum to
        the identity up to signs, and S_m is the resultant of two
        earlier summation polynomials. Degree 2^{m-2} in each
        variable. S_4 is the resultant in one variable of two S_3
        factors, one of them specialised at the target abscissa.
      citation: KR-IC-5a43e5
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
      role: degree pattern and the resultant recursion
    - description: >-
        Explicit S_3(x1, x2, x3) over a short-Weierstrass curve,
        opened in this session.
      citation: >-
        coordination/reviews/pfdr-battery-20260904/reviews/TASK-20260904-642cf5/v1_blind_rederive.py
      provenance: internal
      verified_by: >-
        coordination/reviews/pfdr-battery-20260904/reviews/TASK-20260904-642cf5/v1_blind_rederive.py
      role: frozen cubic factor of the resultant
    - description: >-
        Growth of prime-field solving degree with bit size and m
        is open. A hit-versus-miss split is a possible confounder
        of any single growth curve.
      citation: KN-OPEN-002
      provenance: internal
      verified_by: knowledge/open-problems/KN-OPEN-002.md
      role: the open question this control sits under
  reduction_chain:
    core_problem: toy conditional grevlex solving degree of one S_4 factor-base ideal
    corollaries: []
  predictions:
    - metric: >-
        mean d_solve on misses minus mean d_solve on hits, on the
        F_61, B = 8 cell, and the same difference on a second
        recorded base of size 8
      direction: different
      minimum_effect: >-
        absolute difference strictly less than 1 supports one
        shared degree; difference at least 1 supports two
        populations. The sign required by the two-population
        reading is miss mean minus hit mean at least 1. A finished
        difference at most -1 on the primary base is the concrete
        negative.
  test_boundary:
    instances:
      - one ordinary short-Weierstrass curve over F_61
    parameters:
      prime: 61
      cardinality: 8
      arity: 3
      minimum_per_class: 4
      minimum_targets: 12
      enlargement_cap: 96
      bases: 2
      random_systems: 20
      monomial_order: grevlex
    implementation: >-
      Exhaustive point-addition labels, one grevlex solver for
      every S_4 system and every random system, and one second
      build on the primary-base targets. No discrete-log search.
    budget:
      scientific_systems_cap: 308
      maximum_runs: 1
  falsification_conditions:
    - >-
      The primary base is complete and the miss mean minus the hit
      mean is at most -1. That wrong-sign gap is the concrete
      negative named for this contract. It is a finished
      mathematical outcome.
    - >-
      The absolute difference of means is at least 1 on one base
      and strictly less than 1 on the other base. The population
      gap is then base-dependent and is not a law for the curve.
    - >-
      The random-system arm matches the S_4 difference to within
      less than 1, and that difference is at least 1. The gap is
      then the empty variety, and the summation polynomial is not
      the cause.
    - >-
      After the enlargement cap, one class still has fewer than
      four targets. The comparison is inconclusive, not a
      confirmation of either explanation.
  interpretation_limits:
    - >-
      One prime, one arity, B = 8. A shared degree here does not
      imply a shared degree at larger B or at m = 4.
    - >-
      Exhaustive labels are available only while the number of
      ordered triples is small. The result does not supply a
      certificate format for misses at large B.
    - >-
      A gap of at least 1 is a statement about degrees on this
      cell. It is not a statement about wall-clock cost and not a
      bit-security claim.
    - >-
      No comparison with Pollard rho is implied by a degree
      pattern. KR-IC-5931ee, opened in this session, remains the
      prime-field Semaev negative under its stated assumptions.
