hypothesis:
  id: H-CERTBIN-9b629f
  question_id: RQ-CERTBIN-836ce2
  source_idea: IDEA-20260926-0d1d74
  experiment_id: EXP-CERTBIN-ad3e87
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-2d67d3
  status: approved
  proposed_by: coordinator
  title: >-
    Subspace and orbit-union membership of roots of a degree-D polynomial
    costs O(l D^2) field ops independent of |V|=2^l (P1); the last-two-
    summands residual route is a bounded constant over half-trace
    enumeration across the n=19 ladder (P2); RR/Nagao at m=5,6 is the
    (m-1)-loop with that constant

  statement: >-
    CLAIM (instrument / measurement; HOLD-X8; NO ATTACK). Setting: binary
    curves over F_{2^n}, n in {17,19}; V={deg<l} or an orbit union of a
    random 4-dim V' on the Koblitz n=19 sibling. HYPOTHESIS: (A) For every
    h in F_{2^n}[X] of degree D and every F_2-subspace V of dimension l,
    L_V(X)=prod_{v in V}(X-v) is a 2-polynomial with l+1 terms; computing
    L_V mod h by repeated squaring then gcd(h, L_V mod h) returns exactly
    the roots of h in V in O(l D^2) schoolbook field operations, with no
    |V| dependence (P1: fitted D-exponent in [1.7,2.3], l-slope in
    [0.8,1.2]). Orbit unions inherit the same shape under sigma^j on
    coefficients (131/n conjugate gcds). (B) The last-two-summands residual
    h_{R'}=Res_Y(S_3(X,Y,x_{R'}), L_V(Y)) has deg_X = 2^{l+1}; the
    resultant-plus-gcd route versus 2^l half-trace enumerations has cost
    ratio in [0.1,10] and does NOT fall by more than 4x across l in
    {8,10,12} at n=19 (P2). (C) Under H1 the RR/Nagao parameter scan at
    m in {5,6} is astronomically above both product-law budgets; fixing
    m-2 summands reduces to (B), so the RR/Nagao row is the (m-1)-loop
    with a measured constant. (D) Residual-count criterion named: an
    encoding beats the loop iff residual count < 2^{(m-1)l}/(l D_res^2);
    no such residual is exhibited here. TW-04 arm: Stage-0 arithmetic of
    IDEA-20260926-3c6a19 above-cap mu=B^m/(m! N) calls column, labelled
    derived/extrapolation, not measured. CLAIM TIER: measurement. NO
    exponent. NO ECC2K-130 break. NO Magma/Sage/AUXIN.

  mechanism: >-
    OBJECT FRAME. Representation R1 with factor base described implicitly
    by its membership polynomial L_V (or  n conjugate polynomials of an
    orbit union). Operation set Sigma: translation by factor-base elements
    (Class I partial action). Tracked object: ordinary relation vector;
    the primitive changes how membership of a candidate root set is
    decided, not what is tracked. Lossy-projection test: no new projection
    — algorithm change on the same object. WHAT IS NEW: the O(l D^2)
    membership law for subspace and orbit-union bases, the measured
    last-two-summands constant (P2), residual-count criterion (D), and the
    priced RR/Nagao closure at m=5,6 as "loop with a constant". Charged
    stage: membership half of a decomposition oracle.

  assumptions:
    - >-
      Field arithmetic charged per schoolbook op; fast polynomial arithmetic
      not assumed (polylog disclosed as not used).
    - >-
      RC-1: n=17, f=t^17+t^3+1, A=97044, B=126251, #E=4*32603, V={deg<9}.
      n=19 cell: f=t^19+t^5+t^2+t+1, A=46693, B=306147, h=2; V={deg<l},
      l in {6,8,10,12}. Koblitz n=19 sibling y^2+xy=x^3+1, order 4*130873
      (re-counted), orbit union of a random 4-dim V' (19 conjugates).
    - Every gcd root verified as a root and as a factor-base member by enumeration on toy cells (P3=1.0 blocking).
    - >-
      OFF-LIMITS: F2 family; RR encoding (prior); subspace polynomial
      (KN-LIT-4fe9d2 prior). KN-OPEN-020: subspace scoped-out; orbit union
      charged as implicit-membership.
    - Executable work is toy-tier only; n=131 statements are arithmetic.

  proof_search_map:
    bottleneck: >-
      Whether any encoding of m-summand decomposition on a subspace /
      orbit-union base presents unknown summands as roots of a SMALL-degree
      univariate residual with residual count below |F_V|^{m-1}; the cheap
      gcd makes such a residual decisive, and none is known.
    baseline_embedding:
      parameter_slice: >-
        V=F_q inside F_{q^n}: L_V=X^q-X and the primitive is classical
        gcd(h,X^q-X); m=3 on ECC2K-130 at d=6 is EV-ICPERF-10c5fc's panel
        whose Theta(|F|^2) the last-two-summands route must reproduce as a
        constant (Stage 3 cross-check at RC-1).
      reproduction_check: >-
        (i) Symbolic: (A) at V=F_q reduces to X^q mod h. (ii) Frozen
        fixture: on RC-1 (n=17,l=9) roots of 50 random degree-8 h in V by
        gcd equal roots by evaluating h on all 512 elements (P3).
    observation_collision:
      observable: >-
        Field ops per membership as a function of (l,D), and per-attempt
        cost of last-two-summands route versus half-trace enumeration.
      distinct_preimage_search: >-
        Flat-in-l cost from (i) genuine |V|-independence or (ii) toy
        artifact where 2^l is too small; separated by sweeping l at fixed
        D on n=19 (l up to 12) and reporting both costs in one unit.
        Random 2^l-subset (dense membership poly) is the nearby-object
        control where the claim fails by construction (P4).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Membership of a candidate set given as roots of h, decided by
          L_V mod h and a gcd. Completeness/soundness: gcd(h,L_V) has
          exactly the roots of h in V.
        predicted_gain: >-
          Constant over enumeration on the named encodings (P2);
          exponent-relevant only if a small residual exists (D) — none
          exhibited.
    quantifier_order: >-
      FOR ALL h and all subspaces V, roots of h in V cost O(l deg(h)^2)
      (unconditional). FOR the last-two-summands residual, deg h = 2^{l+1}
      (unconditional). PREDICTED: at RC-1 and n=19 the gcd and enumeration
      routes differ by a bounded constant across l. NOT CLAIMED: existence
      of any small residual at m>=5.
    method_ceiling:
      strongest_certifiable_claim: >-
        Subspace and orbit-union membership of roots of a degree-D
        polynomial costs O(l D^2) field ops; on a subspace base the
        RR/Nagao encoding at any m is the (m-1)-loop up to a constant
        measured at n=17,19. Certifies nothing about encodings not priced
        here, about n=131 beyond arithmetic, or about any ECDLP exponent.
      nearby_object_control: >-
        Random 2^l-element SUBSET (not a subspace): dense membership
        polynomial costs ~2^l; where the claim fails by construction.
        Satisfiable planted residual targets for Stage 2 must agree on
        both routes (P3).
    proof_obligations:
      - claim: L_V is a 2-polynomial with l+1 terms; sigma^j(V') has subspace polynomial sigma^j(L_{V'}).
        responsibility: correctness
      - claim: L_V mod h costs l squarings modulo h plus l scalar multiplications.
        responsibility: runtime
      - claim: deg Res_Y(S_3(X,Y,c), L_V(Y)) = 2^{l+1} in X.
        responsibility: size
      - claim: RR/Nagao parameter scan costs 2^{131(m-1)} m! / |F_V|^m per success under H1.
        responsibility: success_probability
      - claim: Residual-count criterion (D) is the correct comparator against the loop.
        responsibility: correctness
      - claim: Nothing asserted at n=131 beyond arithmetic; TW-04 above-cap figures labelled derived.
        responsibility: scope
    not_applicable_reason: null

  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        For a uniformly random monic degree-m polynomial in the RR parameter
        family over F_{2^n}, the probability it splits completely with all
        roots in V is |F_V|^m / (m! 2^{n m}) up to a constant.
      random_model_justification: >-
        Exact count of m-subsets of V over monic degree-m polynomials;
        uniformity of the parameter family is the transfer assumption
        (KN-FIND-007 means-level support, internal).
      supporting_results:
        - >-
          IDEA-20260926-0d1d74 H1; EV-ICPERF-10c5fc RR panel at m=3
          (internal).
      validation_experiment_ids: [EXP-CERTBIN-ad3e87]
      falsification_condition: >-
        At RC-1 m=3, 10^5 random parameters: split fraction outside a
        factor-2 band of |F_V|^3/(6*2^{51}) → H1 false at that cell;
        Stage-3 RR reading then labelled conditional.
    - id: H-SIZE
      formal_statement: >-
        Fitted membership cost scales as Theta(l D^2) schoolbook field
        multiplications across the Stage-1 (l,D) grid (P1 bands).
      random_model_justification: >-
        Exact algorithm analysis (l modular squarings + gcd O(D^2));
        empirical fit confirms constants, not the asymptotics.
      supporting_results:
        - IDEA-20260926-0d1d74 claim (A); classical 2-polynomial reduction (recalled).
      validation_experiment_ids: [EXP-CERTBIN-ad3e87]
      falsification_condition: >-
        P1 slope in l above 1.5, or D-exponent outside [1.7,2.3] →
        |V|-independence claim false as implemented; withdraw or correct.

  predictions:
    - metric: P1 gcd_membership_ops vs (l,D) at n=19, l in {6,8,10,12}, D in {4,8,16,32}
      direction: same
      minimum_effect: >-
        Fitted D-exponent in [1.7,2.3] and l-slope in [0.8,1.2]; enumeration
        shows slope ~1 in log2 cost per unit l. Gcd l-slope >1.5 falsifies.
    - metric: P2 route_cost_ratio (resultant+gcd) / (2^l half-trace) at RC-1 l=9 and n=19 l in {8,10,12}, 100 residuals
      direction: same
      minimum_effect: >-
        Within [0.1,10] and not decreasing with l by more than 2x across
        the ladder; fall by >4x across l=8..12 is outcome O-SURPRISE.
    - metric: P3 roots_agreement (gcd vs enumeration)
      direction: same
      minimum_effect: 'exactly 1.0; any disagreement voids the instrument (O-ARTIFACT).'
    - metric: P4 subset_control_ops at matched |V|
      direction: higher
      minimum_effect: 'at least 2^{l-2} field ops per membership vs subspace l D^2; failure to separate → O-ARTIFACT.'
    - metric: TW-04 above-cap calls column (Stage 0 arithmetic only)
      direction: different
      minimum_effect: >-
        Derived mu=B^m/(m! N) and B/mu figures at named (m,B) from
        3c6a19; labelled extrapolation; never read as a measurement.

  test_boundary:
    instances:
      - stage0_derivations: >-
          Re-derive (A)-(D); write L_V coefficients for each cell; freeze
          TW-04 above-cap arithmetic table from 3c6a19; write
          preregistered-predictions.json.
      - stage1_primitive: >-
          Implement L_V mod h + gcd; validate P3 on 50 fixtures; measure
          P1 grid; run P4 random-subset control.
      - stage2_last_two: >-
          100 residual targets per cell (seed 2026092711); resultant+gcd
          vs half-trace enumeration; union arm on Koblitz n=19; report P2.
      - stage3_rr_crosscheck: >-
          RR/Nagao form at m=3 on RC-1: enumerate one summand, one
          parameter t, check split condition reproduces Stage-2 root sets
          (correctness cross-check only; EV-ICPERF-10c5fc reproduction).
    parameters:
      n_cells: [17, 19]
      l_rc1: 9
      l_n19: [6, 8, 10, 12]
      D_grid: [4, 8, 16, 32]
      residual_targets_per_cell: 100
      seeds:
        residual_stream: 2026092711
        V_prime: 20261002
      p1_l_slope_band: [0.8, 1.2]
      p1_D_exponent_band: [1.7, 2.3]
      p2_ratio_band: [0.1, 10]
      p2_ladder_fall_max: 4.0
    implementation: >-
      experiments/EXP-CERTBIN-ad3e87/implementation/ reading
      experiments/EXP-CERTBIN-e94b27/impl/{gf2n,curve}.py (copy/wrap under
      write_scope). NEW: F_{2^n}[X] modular squaring, gcd, subspace-
      polynomial builder, resultant recursion (~400 lines). Pure Python;
      numpy optional. No Magma/Sage/cypari2; no AUXIN; no Bedrock.
    budget:
      maximum_runs: 4
      total_cpu_hours_advisory: 4.0
      wall_clock_seconds_advisory: 14400

  falsification_conditions:
    - 'P1 l-slope >1.5 or D-exponent outside [1.7,2.3]: |V|-independence false as implemented; withdraw/correct.'
    - 'P2 falling by more than 4x across l=8..12 at n=19: claim (B) wrong; O-SURPRISE; review before any use.'
    - 'P3 < 1.0: instrument defect; O-ARTIFACT; nothing read.'
    - 'P4 fails to separate subspace from random subset: O-ARTIFACT.'
    - 'Claiming any ECDLP speedup, exponent move, or ECC2K-130 break under this card.'
    - 'Reading TW-04 Stage-0 arithmetic as a measured result.'

  interpretation_limits:
    - Toy tier n in {17,19}; instrument plus priced RR/Nagao closure; no attack, no exponent.
    - Residual-count criterion (D) is a comparator, not an existence claim.
    - KN-OPEN-020 classes charged; not escaped.
    - n=131 statements and TW-04 above-cap figures are arithmetic / labelled extrapolation.
    - Stage 3 is a correctness cross-check at m=3 only, not a new m=5,6 measurement.

  distinguishable_outcomes:
    - id: O-POSITIVE
      meaning: >-
        P1-P4 in band; primitive filed as CERTBIN instrument; RR/Nagao row
        at m=5,6 entered as "loop with a constant" with measured Stage-2
        constant; TW-04 table frozen as derived arithmetic.
    - id: O-SURPRISE
      meaning: >-
        P2 falls with l beyond the band: resultant has exploitable
        structure; replicate at n=23 before any interpretation; do not
        enter the RR/Nagao row as a constant.
    - id: O-ARTIFACT
      meaning: >-
        P3<1 or P4 not separating or Stage-0 fixture mismatch: defect;
        nothing else read.
    - id: O-IMPEDIMENT
      meaning: Budget/infra stop with measured quantity; never negative evidence.

  dominated_by: >-
    Checked row by row. Matched rho at 2^60.81 dominates every priced row;
    the (m-1)-loop and two-list MITM dominate or tie RR/Nagao-with-gcd on
    time; the loop dominates on memory; the subfield gcd of Joux-Vitse /
    Nagao is the classical instance and is not improved. The record claims
    no attack row; the primitive is an instrument. n/a (no result claimed).
  sota_delta:
