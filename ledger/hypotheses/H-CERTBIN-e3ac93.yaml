  recorded_at: '2026-09-24'

  statement: >-
    CEILING FIRST. No cost claim. At m = 2 oracle A (2^10 root-findings per
    attempt at l = 10) decides each attempt outright and parallel Pollard rho
    dominates the DLP. The claim concerns only the REFUTATION DEGREE of the
    descended S_3 system under declared degree-4 closures, at one cell.

    Setting (EXP-CERTBIN-060020 object). F_{2^19} = F_2[t]/(t^19 + t^5 + t^2 +
    t + 1); curve Y^2 + XY = X^3 + AX^2 + B with A = 46693, B = 306147,
    #E = 2 * 261823 (reused from RUN-CERTBIN-0b8f3a, re-verified in-run);
    m = 2, l = 10, V = {deg < 10}; x_1 = sum_{j<10} v_j t^j,
    x_2 = sum_{j<10} v_{10+j} t^j; B = F_2[v_0..v_19]/(v_i^2 + v_i); f_0..f_18
    the coordinates of S_3(x_1, x_2, x_R). M_D and W_D are the closures of
    EXP-CERTBIN-e94b27 object (macaulay_M_D, mutant_closure_W_D) with
    nv = 20, neq = 19. A system is REFUTED by X iff 1 is in X. The primary arm
    is the first 400 unsatisfiable non-degenerate subgroup targets (x(2E); the
    curve has h = 2) drawn by the frozen stream, UNCONDITIONED on any closure
    outcome.

    Claim C-P (E-PERSIST; the claim under test). W_4 refutes at least 90% of
    the primary arm (w >= 360 of 400), each with a verified degree-disciplined
    certificate, while the same-support nulls (N-F219, N-AFF19) and the
    one-linear-fall control N-ELL19 stay at or below 10%.
    Competing reading E-DECAY. The degree-4 refutation observed at n = 17 is a
    small-n effect: W_4 refutes at most 10% of the primary arm (w <= 40), like
    the nulls.
    Claim C-M (mechanism persistence; co-primary). S_3's non-semi-regularity
    persists: on at least 90% of the primary arm the ell-substituted degree-4
    Macaulay space R'_4 has dim(R'_4 cap B'_{<=3}) > 360, the semi-regular
    value for 18 quadratics in 19 Boolean variables. Competing: = 360 on at
    least 90% (the substituted system is semi-regular at n = 19).

  mechanism: >-
    SOUNDNESS AND MONOTONICITY (exact; H-CERTBIN-5e71c9 mechanism, n-free).
    M_D and W_D lie in the ideal of B generated by the f_k, so a refutation is
    an unsatisfiability certificate; M_4 <= W_4.

    THE LINEAR CONSEQUENCE AT n = 19 (Coordinator derivation). S_3 =
    phi(x_1 x_2) + x_R^2 (x_1 + x_2)^2 + B, phi(y) = y^2 + x_R y. For any
    a in F_{2^n}, sum_k Tr(a t^k) f_k is the Boolean form of Tr(a S_3). With
    a = x_R^{-2}: Tr(phi(y) / x_R^2) = Tr((y / x_R)^2) + Tr(y / x_R) = 0 and
    Tr((x_1 + x_2)^2) = Tr(x_1) + Tr(x_2), so
    ell = sum_k Tr(t^k / x_R^2) f_k = Tr(x_1) + Tr(x_2) + Tr(B / x_R^2)
        = sum_{j<10, Tr(t^j) = 1} (v_j + v_{10+j}) + Tr(B / x_R^2).
    n odd gives Tr(1) = 1, so v_0 + v_10 always occurs. By the Coordinator's
    reading of RUN-CERTBIN-0b8f3a cells.json (tau), Tr(t^j) = 0 for 1 <= j <= 9
    under this modulus, so ell = v_0 + v_10 + Tr(B / x_R^2). Checked on every
    S_3 system (C-ELL). The quadratic part lies in the span of the 19
    convolution forms Q_s = sum_{i+j=s} v_i v_{10+j} (s = 0..18) through phi,
    of rank 18; c_k = Tr(t^k / x_R^2) spans the left kernel of the 19 x 190
    quadratic-column matrix (checked, C-ELL).

    SUBSTITUTION (T4, T5 of RT-20260924-d95e70 j9-ptm/o2-declaration.yaml,
    proved there for v_0 := v_9 + c at n = 17; the proof uses only that the
    substitution is a ring map B -> B' with kernel ell * B, so it holds for
    v_0 := v_10 + c at n = 19 with 1160 = dim B_{<=3} in 19 variables in place
    of 834). T4: W_4 = pi^{-1}(W'_4) cap B_{<=4}, dim W_4 = dim W'_4 + 1160,
    and 1 in W_4 iff 1 in W'_4. T5: if R'_4 cap B'_{<=3} = rowspace(R'_3) then
    W'_4 = R'_4. Checked per instance on declared subsets (C-T4).

    SEMI-REGULAR REFERENCE POINTS (RT-20260924-d95e70 J8, verified there;
    arithmetic here is the Coordinator's). 19 quadratics in 20 variables:
    (1+z)^20 / (1+z^2)^19 = 1, 20, 171, 760, 1425, -2356, D_reg 5; so rank
    M_3 = 1351 - 952 = 399, rank M_4 = 6196 - 2377 = 3819, M_4 profile
    [0, 0, 19, 399, 3819], and 4009 - 3819 = 190 = C(19,2) + 19 trivial
    syzygies. 18 quadratics in 19 variables (after substituting ell):
    (1+z)^19 / (1+z^2)^18 = 1, 19, 153, 627, 969, -2565, D_reg 5; so rank
    R'_3 = 360 and the R'_4 profile [0, 0, 18, 360, 3267]. With T5 an exactly
    semi-regular substituted system gives W_4 not refuted, final dim
    3267 + 1160 = 4427, dims_by_deg [0, 1, 38, 551, 4427], fixpoint at
    iteration 1. These are applied ONLY to controls and ONLY on systems whose
    per-instance profile check confirms them (RC-B). No semi-regular
    prediction is applied to S_3: prior (a) of EXP-CERTBIN-e94b27 failed
    exactly that way (EV-CERTBIN-4a9d2f O-7, OBJ-2).

    WHY C-P. At n = 17 the load-bearing ingredient was S_3's non-semi-regular
    M_4: 964-978 fallen dimensions against 323, 4-12 linear forms, and a
    substituted degree-3 space equal to all of B'_{<=3} on 61/62 against the
    semi-regular 288 (EV-CERTBIN-4a9d2f O-7, O-8). Its algebraic source (phi's
    rank-(n-1) image, the cokernel fall) is n-uniform.
    WHY E-DECAY. The semi-regular deficit at degree 4 grows: h_4 = 612 at
    n = 17 (17 in 18) and 1425 at n = 19 (19 in 20). M_4's rows grow more
    slowly than its columns (2924 x 4048 against 4009 x 6196), so S_3's falls
    must fill proportionally more of B_{<=4} for W_4 to reach 1. The
    refutation at n = 17 filled W^(1) = B_{<=4} completely
    (EV-CERTBIN-4a9d2f O-8); nothing says the same fill occurs at n = 19.

    L-TOP (H-CERTBIN-be6cbd mechanism; its proof does not use n). The rank P
    of the degree-4 projection of M_4 depends only on the quadratic parts, so
    S_3 and N-CONV19 at the same x_R share P (C-TOP19).

  assumptions:
    - Satisfiability is decided exactly (exhaustive over all 2^20 assignments, and oracle A on curve-algebra systems), never by a closure.
    - The primary arm is fixed by seed and draw order, not by any closure outcome. Unlike U62 of RC-1 it is not conditioned on M_4.
    - >-
      The n = 17 references are quoted, not recomputed: W_4 386/386 (82
      certified plus 304 Stage-1 flags, OBJ-7) and M_4 324/386, CP95
      [0.799, 0.875]. C-ENGINE's full RC-1 replay re-checks the 82 certified
      records' engine side before any draw.
    - >-
      TRANSFER ASSUMPTION, stated and NOT assumed true: reading an n = 19
      versus n = 17 difference as an effect of n assumes the change of curve
      (h = 4 to h = 2) and of subgroup-target class (x(4E) to x(2E)) does not
      matter. It is recorded as a confound until EXP-CERTBIN-3f06d1's h = 2
      cell at n = 17 is reviewed.

  proof_search_map:
    bottleneck: >-
      KN-OPEN-3c8f51 item (B): whether the degree-4 (W_4) refutation of
      unsatisfiable S_3 subgroup-target descents on the diagonal, 386/386 at
      n = 17, persists at n = 19 or decays toward the nulls. It decides
      whether any m = 3 pricing is ever warranted (DEC-20260923-f25b97 NA-5;
      DEC-20260924-e61f3b NA-3) and whether the non-semi-regular reading of
      S_3's M_4 is stable along n.
    baseline_embedding:
      parameter_slice: >-
        The n = 17 cell is the slice n = 17, l = 9 of the same pipeline.
        (i) C-ENGINE replays all 1062 RC-1 closure records and 268
        certificates through the pinned engine before any draw. (ii) C-SLICE17:
        the run's own instance builder, run with n = 17 parameters (modulus
        t^17 + t^3 + 1, curve A = 97044, B = 126251), reproduces the archived
        E_hex of the 144 curve instances in
        experiments/EXP-CERTBIN-e94b27/runs/RUN-CERTBIN-c417e0/instance-sets.json,
        and its rc_b step reproduces the red-team substituted profile
        [1, 18, 154, 834, 2213] on U62 idx 27 (RT-20260924-d95e70 J7 (b)).
      reproduction_check: >-
        (i) 0 mismatches over 1062 records and 268 certificates; (ii) 144/144
        E_hex equal and the idx-27 profile equal; (iii) fixture dimensions
        M_3 399 x 1351, M_4 4009 x 6196 (the value in DEC-20260923-f25b97
        NA-5), R'_3 380 x 1160, R'_4 3629 x 5036.
    observation_collision:
      observable: >-
        "1 in W_4" with a verified wdag-v1 certificate; "1 in M_4" with a
        verified flat certificate of max |mu| <= 2; and, for non-refutation of
        a primary-arm system, a verified ann-v1 annihilator certificate.
      distinct_preimage_search: >-
        Known collision: a flat certificate with max |mu| = 3 fits both a W_4
        refutation and an M_5-only refutation (RT-20260924-d95e70 J7 (a),
        fiber exhibited). wdag-v1's per-node degree bound separates it, and
        C-VERIFIER's degree-violation negative controls test the separation.
        For the adverse direction (non-refutation) the collision is an engine
        that under-computes W_4. It is separated by the ann-v1 certificate (a
        closed superspace of M_4 not containing 1), by C-BACKEND (the numpy
        reference backend), by C-LIT (a literal W_4) and by the exact T5
        dimension 4427 on semi-regular N-ELL19 systems. The satisfiable
        controls in every arm are the explicit search for a false refutation.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the closure fixed and vary n (17 -> 19), and at n = 19 vary the
          system around S_3: keep phi_{x_R}(Q) with random lower part
          (N-CONV19), keep only a linear fall (N-ELL19), keep only the support
          (N-F219, N-AFF19).
        predicted_gain: Separates persistence of the S_3 property from generic behaviour at the larger n.
      - transform: stronger_invariant
        proposed_object: The ell-substituted fall profile of R'_4 (RC-B), per instance
        predicted_gain: Decides whether the n = 17 mechanism (non-semi-regular M_4) survives, independently of whether 1 is reached.
    quantifier_order: >-
      FOR the frozen modulus and curve (fixed by rule before this record),
      FOR the frozen stream S_tgt, the primary arm is the first 400 draws with
      s = 0 in draw order (non-degenerate, distinct x_R); FOR each, a verified
      wdag-v1 certificate for 1 in W_4 EXISTS or NOT. Thresholds 360 / 40 /
      200 and the C-M threshold (90% of the arm) are fixed now. Control arms
      are fixed by their own seeds and keep rules; no draw depends on a
      closure outcome.
    method_ceiling:
      strongest_certifiable_claim: >-
        At this cell: the W_4 and M_4 refutation counts of the unsatisfiable
        subgroup-target arm with certificates, the per-instance substituted
        fall profile, the same closures on the control arms, and the x(2E)
        split. Not F4 step degree; not any n other than 19 (and 17 by
        reference); not m = 3; not a cost; not evidence about Semaev's
        Assumption 1. A non-refutation is a degree-4 statement only.
      nearby_object_control: >-
        Proves-too-much objects: N-ELL19 (ell present, generic otherwise;
        derived non-refutation wherever T5 applies with the semi-regular
        profile) and the same-support nulls (derived non-refutation wherever
        the M_4 profile is exactly semi-regular). A method that refuted those
        at S_3's rate would identify nothing.
    proof_obligations:
      - claim: ell identity at n = 19 and its variable support (derivation above; C-ELL on every S_3 system)
        responsibility: correctness
      - claim: T4 for the substitution v_0 := v_10 + c with the constant 1160; T5
        responsibility: correctness
      - claim: wdag-v1 soundness (every node in W_4 by induction; output 1 implies refuted)
        responsibility: correctness
      - claim: ann-v1 soundness (a closed superspace of M_4 without 1 contains W_4, so 1 is not in W_4)
        responsibility: correctness
      - claim: L-TOP at n = 19 (H-CERTBIN-be6cbd; C-TOP19)
        responsibility: correctness
      - claim: Fixture dimensions and the semi-regular reference profiles at n = 19
        responsibility: size
      - claim: The curve's order, the subgroup and the x(2E) classification (C-CURVE)
        responsibility: interface
    not_applicable_reason: null

