      - >-
        n = 19, f = t^19 + t^5 + t^2 + t + 1, m = 2, l = 10, V = {deg < 10}, curve
        A = 46693, B = 306147 (h = 2, q = 261823). Primary: 400 unsatisfiable
        subgroup-target attempts and 100 satisfiable controls (stream S_tgt).
      - Controls N-CONV19, N-ELL19, N-F219 (200 unsatisfiable + 50 satisfiable each), N-AFF19 (5 families x (40 + 10)).
      - F-RANDX19 x(2E) split: 200 unsatisfiable per stratum (x(2E), x(E) \ x(2E), twist).
    parameters:
