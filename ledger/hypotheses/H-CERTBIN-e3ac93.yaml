      reviewed.
    - Not evidence for or against Semaev's Assumption 1. W_4 is a Macaulay-type closure, not F4.
    - >-
      dominated_by: oracle A per attempt (2^10 root-findings); parallel
      Pollard rho for the DLP (about 450 group operations at q = 261823).
      sota_delta zero on every ECDLP cost axis.
    - Two values of n are not a trend. Nothing is said about n >= 23.

