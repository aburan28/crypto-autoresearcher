  falsification_conditions:
    - C-P (E-PERSIST) is falsified iff w <= floor(N / 2) (200 at N = 400).
    - E-DECAY is falsified iff w > floor(N / 2).
    - C-M is falsified iff sigma = 0 on >= 90% of the primary arm; its competitor iff sigma > 0 on >= 90%.
    - >-
      A refuted satisfiable control, a counted refutation whose certificate
      fails verification, an ann-v1 certificate that fails for an engine
      non-refutation, a C-TOP19 / C-T4 / C-ELL violation, or an
      engine-provenance or regression failure falsifies the INSTRUMENT. The
      run is void and is not evidence about this hypothesis.

  interpretation_limits:
    - >-
      CLAIM TIER: toy. n = 19, one curve (h = 2), one V. A comparison with
      n = 17 compares two cells that also differ in curve and cofactor; it is
      quoted as "the n = 19 cell (h = 2) against the n = 17 cell (h = 4)",
