  predictions:
    - id: PP-1
      metric: w = number of the 400 primary unsatisfiable attempts with a verified wdag-v1 certificate for 1 in W_4
      direction: different
      minimum_effect: >-
        E-PERSIST: w >= 360. E-DECAY: w <= 40. The claim under test is
        E-PERSIST. w <= 200 falsifies E-PERSIST; w >= 201 falsifies E-DECAY.
        Thresholds scale as ceil(0.9 N), floor(0.1 N), floor(N / 2) if N < 400
        (EXP-CERTBIN-060020 N19-DR-1).
    - id: PP-2
      metric: substituted degree-3 fall excess sigma = dim(R'_4 cap B'_{<=3}) - 360, per primary system
      direction: higher
      minimum_effect: >-
        C-M: sigma > 0 on >= 90% of the primary arm. Competing: sigma = 0 on
        >= 90%. MIXED otherwise.
    - id: PP-3
      metric: M_4 refutation rate of the primary arm against the n = 17 value 324/386 = 0.839, CP95 [0.799, 0.875]
      direction: different
      minimum_effect: No directional claim. CONSISTENT iff the CP95 intervals overlap; LOWER / HIGHER otherwise.
    - id: PP-4
      metric: W_4 refutations of N-F219, N-AFF19 and N-ELL19 unsatisfiable systems
      direction: lower
      minimum_effect: >-
        0 on every system whose per-instance profile check confirms the
        semi-regular (nulls) or T5 semi-regular (N-ELL19) reference (derived);
        any refutation there is an instrument defect. Overall CP95 upper bound
        <= 0.10 per arm under C-P.
    - id: PP-5
      metric: Satisfiable-control refutations in every arm
      direction: lower
      minimum_effect: Exactly 0 (soundness); codim(W_4) >= s on every control.
    - id: PP-6
      metric: P = rank of the degree-4 projection of M_4, N-CONV19 against S_3 at the same x_R
      direction: different
      minimum_effect: Equal on every slot (L-TOP). Any difference is an instrument defect.
  predictions_source: >-
    PP-1 thresholds mirror H-CERTBIN-5e71c9 PA-1 and H-CERTBIN-be6cbd PN-1
