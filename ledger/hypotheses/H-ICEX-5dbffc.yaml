hypothesis:
  id: H-ICEX-5dbffc
  question_id: RQ-ECDLP-001
  statement: >-
    The toy S_3 decomposition measurement that RQ-ECDLP-001 exists to settle -
    frozen as EXP-SEMAEV-001, hypothesis H-SEMAEV-001, status analyzed - is
    independently reproducible from its frozen contract on a clean checkout. Run
    with the contract's declared grid and seeds, an independent reproduction
    recovers every DISCRETE metric of the twelve committed run records exactly,
    and recovers the wall-clock metric only to within an order of magnitude,
    because wall clock is machine-bound and is not a reproducible quantity.
  mechanism: >-
    The frozen contract declares the protocol; the run manifests record the
    resolved environment, the exact command and the seeds. Rebuilding every
    artifact from scratch at the recorded commit and re-running with the recorded
    seeds exercises exactly the path the reproducibility discipline exists to
    guarantee, and a field-by-field comparison localises any disagreement to a
    named metric rather than to the experiment as a whole.
  assumptions:
  - >-
    The frozen contract and its recorded commit are reachable and the environment
    is reconstructible. If they are not, the foundation is unreproducible and
    that is the finding.
  - >-
    The original run records report enough metrics for a field-by-field
    comparison. Metrics the original did not report cannot be checked and are
    listed explicitly rather than treated as agreeing.
  - >-
    UNITS. Discrete metrics - the max-degree proxy, basis size, decomposition
    flag, trivial-ideal flag, rho group-operation count and the raw target and
    summand x-coordinates - are integers or booleans and are compared for EXACT
    equality. The wall-clock metric is in seconds and is machine-bound; it is
    compared only as an order-of-magnitude band and is never required to agree
    exactly, and it is never divided into any count.
  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms:
    - transform: null
      proposed_object: null
      predicted_gain: null
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations:
    - claim: null
      responsibility: null
    not_applicable_reason: >-
      A reproduction of an existing measurement. No theorem is sought and no new
      mathematics is claimed; the deliverable is agreement or a localised
      disagreement.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: >-
      FOR ALL twelve committed EXP-SEMAEV-001 run records, the frozen contract
      plus its recorded seeds and resolved environment determine every discrete
      metric that record reports.
    random_model_justification: >-
      The rigorous ingredient is that the contract declares the protocol and each
      manifest records the resolved environment and seeds, which is what the
      reproducibility discipline exists to guarantee. THE GAP, STATED - solver
      libraries can change behaviour across patch versions in ways a version pin
      may not capture, and symbolic Groebner implementations are particularly
      prone to this, so an unreproduced metric may indicate library drift rather
      than an error in either run.
    supporting_results:
    - >-
      EXP-SEMAEV-001 specification, read in full - status approved, inputs bits
      [8, 10, 12] and seeds [1, 2], maximum_runs 12, primary metrics
      groebner_basis_max_degree_proxy and groebner_seconds.
    validation_experiment_ids:
    - EXP-ICEX-1aae89
    falsification_condition: >-
      A discrete metric disagreeing while the resolved environment matches the
      manifest exactly.
  structural_ingredients:
  - description: >-
      The reference values, read verbatim from the committed
      experiments/EXP-SEMAEV-001/analysis.md table - (bits, seed, max-deg proxy,
      gb seconds, decomposition, rho group ops) = (8, 1, 2, 0.173, yes, 15),
      (8, 2, 4, 0.160, yes, 30), (10, 1, 0, 0.157, no, 6), (10, 2, 2, 0.167, yes,
      12), (12, 1, 0, 0.166, no, 15), (12, 2, 0, 0.161, no, 6). Cross-checked
      against the raw record experiments/EXP-SEMAEV-001/runs/RUN-SEMAEV-gb-b10-s1/raw-result.json,
      read directly - decomposition_found false, groebner_basis_max_degree_proxy
      0, groebner_basis_size 1, groebner_seconds 0.156982, is_trivial_ideal true,
      rho_baseline_group_operations 6, raw target_x 202. The analysis table
      rounds 0.156982 to 0.157 and is otherwise consistent with the raw record.
    citation: EXP-SEMAEV-001
    provenance: internal
    verified_by: coordinator (TASK-20260904-074465, analysis.md and one raw-result.json read directly)
    role: the reference the reproduction is compared against
  - description: >-
      KN-OPEN-5b3a08, read in full. Its CONFIRMED bug is in harness/semaev.py's
      s4_expr, the FOURTH summation polynomial, whose second .subs() call is not
      simultaneous. EXP-SEMAEV-001 is an S_3 length-2 experiment and its result
      path does not call s4_expr. The applicable exposure for this reproduction
      is that entry's Q2 - build_factor_base draws x-coordinates from the full
      curve E(F_p) rather than from the order-n subgroup - so this contract
      records the cofactor of every instance as a required artifact.
    citation: KN-OPEN-5b3a08
    provenance: internal
    verified_by: coordinator (TASK-20260904-074465, file read in full)
    role: scope of the shared-harness defect that does and does not apply
  reduction_chain: null
  predictions:
  - metric: discrete_metric_exact_agreement_with_the_committed_run_records
    direction: different
    minimum_effect: >-
      FORCED exact on every discrete metric of every committed run. A
      disagreement requires a superseding correction record, never an edit to the
      original.
  - metric: seed_perturbation_planted_defect
    direction: different
    minimum_effect: >-
      Re-running bits 10 with seed 2 in place of seed 1 must reproduce the
      archived difference EXACTLY - max-degree proxy 0 to 2, decomposition_found
      false to true, rho group operations 6 to 12. This is the defect of known
      size and its predicted magnitude, and the magnitude is read off committed
      artifacts rather than assumed. If seed-dependent metrics do not move, the
      seeds are not wired through and the original determinism claim is wrong.
  - metric: factor_base_corruption_planted_defect
    direction: different
    minimum_effect: >-
      Dropping one declared element from the factor base must change at least one
      discrete metric on at least one of the six gb cells. If it does not, the
      comparison is insensitive to the input it is supposed to be measuring and
      no agreement from it is meaningful.
  - metric: wall_clock_order_of_magnitude_band
    direction: different
    minimum_effect: >-
      Within a factor 10 of the archived 0.157 to 0.173 s range. A wall-clock
      disagreement inside that band is NOT a reproduction failure and is not
      reported as one.
  - metric: metrics_the_original_did_not_report
    direction: different
    minimum_effect: >-
      Listed explicitly. Unreported metrics cannot be reproduced and bound what
      the reproduction establishes.
  test_boundary:
    instances:
    - the twelve committed EXP-SEMAEV-001 runs at bits 8, 10, 12 and seeds 1, 2
    parameters:
      factor_base_size: 14
      decomposition_length: 2
      commit: the commit recorded in the original manifests
    implementation: >-
      harness/semaev.py at the recorded commit, on a clean checkout, with every
      artifact rebuilt from scratch rather than reused.
    budget:
      wall_clock_seconds_per_run: 600
      maximum_memory_gb: 8
      maximum_runs: 30
  falsification_conditions:
  - >-
    The frozen contract or its recorded commit is unreachable, or the environment
    is not reconstructible. The foundation is unreproducible; that is the finding
    and it is recorded as such, not as a negative about the mathematics.
  - >-
    Seed-dependent metrics do not respond to the seed perturbation at the
    archived magnitude. The original determinism claim is wrong.
  - >-
    The factor-base corruption plant changes nothing. The comparison is
    insensitive and no agreement from it is meaningful.
  - >-
    A discrete metric disagrees while the resolved environment matches the
    manifest exactly. The foundation measurement is not reproducible as reported,
    a superseding correction is required, and every lane built on it inherits the
    consequence.
  - >-
    Every discrete metric agrees. The tier path's foundation is independently
    reproduced, which is worth having explicitly given how much rests on it.
  interpretation_limits:
  - >-
    Reproduces one measurement. Establishes nothing new mathematically, and
    establishes NOTHING about elliptic curves beyond what EXP-SEMAEV-001 already
    established - agreement here is a statement about the software and the
    environment, not about the ECDLP.
  - >-
    Scoped to the reproduced configuration - S_3, length 2, factor base 14, bits
    8, 10 and 12, seeds 1 and 2 - and to the metrics the original reported.
  - >-
    Any disagreement is handled by a superseding correction record, never by
    editing the original, per AGENTS.md rule 4 and rule 2 of CLAUDE.md.
  - >-
    A READING FLAGGED, NOT ADOPTED. The source idea motivates this work by
    citing KN-OPEN-5b3a08's confirmed bug in the shared implementation. Read
    verbatim, that confirmed bug is in s4_expr and concerns the fourth summation
    polynomial; the S_3 path reproduced here does not call it. The paraphrase is
    recorded as a reading and the applicable exposure - whole-curve factor-base
    sampling - is carried into the artifact list instead.
  - >-
    A CONTRACT-VERSUS-TREE DISCREPANCY OBSERVED AND NOT RESOLVED HERE. The frozen
    specification declares bits [8, 10, 12], seeds [1, 2] and maximum_runs 12,
    and analysis.md reports six gb and six rho runs. A directory listing of
    experiments/EXP-SEMAEV-001/runs/ also shows directories named for bits 14 and
    for seeds 3 and 4, outside the declared grid. This contract compares against
    the twelve runs the contract declares and lists the additional directories as
    out-of-contract; no claim is made about what they are, because only their
    names were observed and not their manifests.
  status: proposed
  proposed_by: coordinator
