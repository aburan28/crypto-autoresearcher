hypothesis:
  id: H-ECDLP-004445
  question_id: RQ-SDEG-001
  goal_id: GOAL-SDEG-001
  status: proposed
  proposed_by: coordinator
  derived_from_idea: IDEA-20260815-66496a
  supersedes_hypothesis: H-ECDLP-c9e189
  experiment_id: EXP-ECDLP-ac7e8b
  statement: >-
    A fully specified typed-field counter can produce exact reproducible
    operation vectors for a declared S3/S4 decomposition algorithm while
    paired wall-time behavior varies with controlled load and size. The
    complete finite study can distinguish practical slope agreement from
    disagreement and sign-unspecified monotone wall/weighted-operation drift,
    with independent certificates and full resource costs retained.
  mechanism: >-
    Force an explicit Python coefficient domain and Buchberger/grevlex path,
    replacing hidden division/power routes with one declared kernel shared
    by separate timing/counting processes. Calibrate every M/S/I/A event and
    preserve full S3/S4 construction, provenance, enumeration, independent
    verification and matched controls. Pair identical sealed inputs across
    loads/modes, report typed/stage vectors beside a fixed supplementary
    weight, and make statistical decisions on paired slope differences.
  assumptions:
    - The instrumented arithmetic and provenance algorithm is a declared modification of stock SymPy and has unmeasured overhead; no almost-free claim.
    - Source-level coverage is a prospective design argument, not empirical proof of an active backend or complete implementation.
    - Twenty separately seeded fixtures per cell do not establish a universal random-instance law or IID success floor; duplicate realized fixtures and all rejections are retained.
    - WeightedFp statistic M+S+100I+A is a fixed model quantity, not hardware equivalence or the governing ICEX numerator; independent verifier Fp and rankFell vectors remain distinct.
    - Timing profile boundaries measure library-time allocation, not omitted-arithmetic counts; paired single-host and curve-free comparisons do not prove unique causation.
  predictions:
    - metric: Exact calibrated typed counts and same-input load invariance
      direction: different
      minimum_effect: Zero disagreement with all five independent calibrator formulas and zero count-vector change across loads0,1,2,4; any mismatch is an instrument defect.
    - metric: Timing load response
      direction: higher
      minimum_effect: Nondecreasing medians across load and highest/zero-load factor>=1.5 for each complete declared panel; valid misses are finite target failures.
    - metric: Wall/weighted-operation drift across sizes
      direction: different
      minimum_effect: Either nondecreasing or nonincreasing median ratio sequence with max/min>2 at load0, separately by family/arm; no one-sided sign assumption.
    - metric: Paired local timing-minus-weighted-operation slope
      direction: different
      minimum_effect: Classify practical agreement/disagreement/inconclusive using the fixed paired estimate/interval and +/-0.05 tolerance, with no assumed direction or favorable outcome.
  test_boundary:
    instances: [Full ordinary prime-field S3 six-cell ladder, Full ordinary prime-field S4 four-cell ladder, Matched curve-free systems, Same-subgroup rho/BSGS controls, Separate F5 conservation fixture]
    parameters:
      S3_bits: [8, 10, 12, 16, 20, 24]
      S4_bits: [8, 10, 12, 16]
      instances_per_cell: 20
      master_labels: [0, 1, 2, 3, 4]
      loads: [0, 1, 2, 4]
      calibration_multipliers: [1, 2, 4, 8, 16]
      logical_jobs: 1600
      components_per_job: 30
      measured_components: 48000
      warmup_components: 48000
      profiled_timing_audit_components: 24000
      bootstrap_resamples: 2000
    implementation: Complete scientific choices are fixed in EXP-ECDLP-ac7e8b and its normative appendix; genuine independent protocol review precedes implementation.
    budget: {maximum_runs: 1600, maximum_workers: 6, maximum_memory_gb: 8, wall_clock_seconds: null, total_cpu_hours: null}
  falsification_criterion: Exact independent counter/certificate/coverage failure invalidates the instrument. Valid complete data outside a load/drift target or paired practical band give the specified finite outcome, not global hypothesis rejection. Missing/censored data, excluded sizes or insufficient pairs are inconclusive.
  falsification_conditions:
    - A complete typed calibrator or deliberate fault control fails despite verified inputs, or count vectors change under load for the identical sealed algorithm/input.
    - Valid complete load or sign-unspecified drift panels fail their exact finite thresholds.
    - Paired delta estimate and interval both lie wholly outside +/-0.05, yielding disagreement for that local finite panel; other configurations use the fixed mutually exclusive rule.
  proof_search_map:
    bottleneck: Source-backed complete event accounting and independently certified full-workflow scope, not a timer around only the Gröbner call.
    baseline_embedding:
      parameter_slice: Explicit known-count programs for all four event types, actual planted-positive S3/S4 solver cases, matched rho/BSGS and nine conservation controls.
      reproduction_check: Independent blind count derivation, full solver certificates and legally derived wrong-field-rank control precede belief; no executed control PASS is asserted now.
    observation_collision:
      observable: Similar slopes, weighted totals or low library-boundary fraction
      distinct_preimage_search: Retain distinct typed vectors/fields, profile classifications, null-family differences and full shared costs. Equal weighted values can hide different arithmetic or omitted stages; known nonfield library time can dominate without missing arithmetic.
    constructive_transforms:
      - transform: specialization_pack
        description: Pin a private coefficient kernel and explicit algorithm with full typed coverage and provenance DAG.
        proposed_object: Reproducible finite cost/certificate interface
        predicted_gain: Measurement validity and scoped comparison, no cryptanalytic speedup.
    quantifier_order: Freeze every scientific algorithm/fixture/control/seed/count/weight/statistical choice before implementation; independent protocol review precedes code; actual admitted hashes and sealed schedules precede measurement; independent evidence review precedes claim reliance.
    method_ceiling:
      strongest_certifiable_claim: Exact finite calibration and paired timing/count behavior for the chosen modified backend, admitted host and full declared panel, with complete resource/certificate scope.
      nearby_object_control: SchoolbookM/A-only success cannot validateS/I; wrong-field rank must differ on legal relation rows; a precise0.01 slope difference inside tolerance is not simultaneous primary agreement/disagreement; a planted-positive S3 control cannot replace S4 solver coverage.
    proof_obligations:
      - {claim: Typed kernel and coefficient-callgraph coverage and calibrator identities, responsibility: correctness}
      - {claim: Full S3/S4 ideal and group/certificate interfaces, responsibility: interface}
      - {claim: Complete stage/provenance/verification/load accounting, responsibility: runtime}
      - {claim: Aggregate limits and unique shared/retained work, responsibility: memory}
      - {claim: Finite paired inference without causal/asymptotic overclaim, responsibility: scope}
    not_applicable_reason: No asymptotic ECDLP improvement is asserted; finite correctness/cost/interface audits are required.
  formalization:
    smallest_obligation: Define finite typed-event traces and prove the declared repetition/POW/calibrator count recurrences, then separately refine selected source coefficient operations and provenance DAG identities to those traces.
    missing_binding: No implemented trace/backend refinement or formal verifier exists yet. Bare count identities do not verify solver coverage, independent certificates or performance. Revisit after independent protocol review and permitted implementation representation freeze; no broad library-absence assertion.
  heuristic_assumptions: []
  asymptotic_claim: null
  novelty_status: unverified
  dominated_by: Tooling comparison against the existing Gröbner timer and full governing rho/BSGS/certificate framework; no complete attack time-memory-data frontier or optimal solver claim is made.
  sota_delta: No attack improvement is claimed or measured; finite timing/count differences remain prospective unmeasured quantities.
