  statement: >
    Fix the grading deg x_i = 1, deg a = 2,
    deg b = 3 and the base weight W_3 = 4
    before any summation polynomial is
    expanded. Stage 0 asserts only T1 of
    IDEA-20260902-7952e7 as exact integer
    arithmetic: the Sylvester-weight
    recurrence
    w_res(d_f, w_f, d_g, w_g) =
    d_g w_f + d_f w_g - d_f d_g
    with the frozen splits
    W_4 = Res(S_3, S_3) using d=2, w=4,
    W_5 = Res(S_3, S_4) using
    (d_f,w_f,d_g,w_g)=(2,4,4,12),
    W_6 = Res(S_4, S_4) using d=4, w=12,
    and the alternative split
    W_6_alt = Res(S_3, S_5) using
    (2,4,8,32), equals the closed form
    W_n = (n-1) * 2^{n-2} at n in
    {3,4,5,6}. (i) REAL values are
    W_3=4, W_4=12, W_5=32, W_6=80,
    W_6_alt=80; (ii) KF omits the
    -d_f d_g term, so KF W_4=16 which
    is not 12; (iii) NULL is the zero
    sequence, so W_n=0 which is not the
    closed form; (iv) n=2 and n=0 are
    rejected. This W_n is the
    summation-polynomial weighted
    degree, not the O2-line second
    moment W of H-ECDLP-2ade73. This
    is not a sympy expansion of S_4 or
    S_5, not a specialised-support
    census, not an Aut arm, not a
    sigma ladder, not a crater hunt,
    and not a rho beat. Stages 1+ stay
    unauthorized.
  mechanism: >
    IDEA-20260902-7952e7 names T1 as the
    zero-compute weight law of every
    S_n under deg(x,a,b)=(1,2,3).
    Stage 0 freezes that law as an
    exact integer identity on n in
    {3,4,5,6} whose closed form is
    (n-1) 2^{n-2}, plus the alternative
    n=6 split as a consistency check.
    The producer evaluates the
    recurrence by exact integer
    arithmetic on the frozen splits.
    The KF omitted-Sylvester-term
    object and the NULL zero sequence
    are the proves-too-much and
    nearby-object controls. No S_4 is
    expanded. No sympy is run. No Aut
    group is enumerated. No sigma is
    fitted. This is a new RQ-ECDLP-002
    object after Stage 0 of
    EXP-ECDLP-735974 held as P-S0-HILB
    (DEC-20260908-ad2dc1). It is not
    Stage 1 of EXP-ECDLP-735974 and not
    Stage 1 of this experiment.
  predictions:
    - id: P-S0-WTLAW
      metric: well-defined exact W_n identity on the frozen Sylvester splits
      direction: different
      minimum_effect: >
        After fixture_pass, REAL W_n at
        n in {3,4,5,6} equals
        (4,12,32,80) and W_6_alt equals
        80. KF omitted-term W_4 equals
        16. NULL zero-sequence equals 0
        at those n. n=2 and n=0 are
        rejected. One certified miss
        after fixture_pass is a scoped
        falsification of this instrument
        on the frozen splits.
      claim_tier: observational
    - id: P-S1-SUPPORT
      metric: specialised S_4/S_5 support equality at a=0 and b=0
      direction: different
      minimum_effect: >
        Stage 1+, unauthorized here.
        Stage 0 does not expand S_4 or
        S_5, does not specialise x_n to
        x_R, and does not hunt a crater.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KFOMIT
      statement: >
        After fixture_pass, KF omitted-term
        W_4 reports 12, equal to REAL.
        An encoding bug is
        failed_infrastructure.
    - id: F-S0-REALWT
      statement: >
        After fixture_pass, REAL W_n fails
        to equal (4,12,32,80) or W_6_alt
        fails to equal 80. That
        falsifies only P-S0-WTLAW on
        these frozen splits.
    - id: F-S1-SUPPORT
      statement: >
        After an authorized later stage, a
        claimed specialised-support miss
        or sigma gap. Unauthorized here.
