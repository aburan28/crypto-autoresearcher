    prose: >
      Toy scale. Stage 0 is exact integer
      arithmetic on one frozen weight
      law. It is not a sympy expansion,
      not an Aut arm, not a sigma
      ladder, not a crater hunt, not
      Stage 1 of EXP-ECDLP-821bc5, not
      Stage 1 of EXP-ECDLP-735974, not
