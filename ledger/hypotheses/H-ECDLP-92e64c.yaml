        The REAL, KF, and NULL fixtures.
        Disclosed tightening: T1
        weight-law identity only, not
        the proposal's sympy S_4/S_5
        expansion, specialised-support
        census, Aut arm, or sigma
        ladder.
      reproduction_check: >
        REAL W_n=(4,12,32,80) and
        W_6_alt=80.
        KF omitted-term W_4=16\neq12.
        NULL zero-sequence W_n=0\neq closed form.
    observation_collision:
