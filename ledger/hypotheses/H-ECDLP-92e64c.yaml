        responsibility: correctness
      - claim: exact REAL identity and n=6 alternative split
        responsibility: baseline
      - claim: exact KF omitted-term gap
        responsibility: baseline
      - claim: no sympy expansion, no Aut arm, no sigma ladder, no crater hunt, no Stage 1 of 821bc5/735974/fdae20/089e80/b3f975/daf1bb/0d1336/1aa0f8/79f8c4/628891/9e9536/90f602, no Stage 2 of 4be480
