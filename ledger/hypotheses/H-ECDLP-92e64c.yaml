        W_n versus the closed form,
        versus the omitted-Sylvester-term
        recurrence, versus the zero
        sequence.
      distinct_preimage_search: >
        Hold the splits and drop
        -d_f d_g (KF). Hold n and
        replace the recurrence by 0
        (NULL).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Frozen exact W_n identity.
        predicted_gain: >
          Exact known-false omitted-term
          gap on KF. Zero claimed attack
          improvement.
    quantifier_order: >
      Freeze the splits and W_3 before
      reading W_n. Existential equality
      at n in {3,4,5,6} does not imply
      a specialised-support census and
      does not imply a rho beat.
    method_ceiling:
      strongest_certifiable_claim: >
        Instrument reproduction on the
        declared frozen splits. Never a
        sympy expansion. Never an Aut
        count. Never a sigma. Never an
        ECDLP exponent.
      nearby_object_control: >
        NULL is the zero sequence. An
        argument that still assigns it
        W_4=12 is wrong. KF is the
        omitted-term object; an
        argument that assigns every
        recurrence W_4=12 is wrong.
    proof_obligations:
