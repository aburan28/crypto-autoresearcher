  proof_search_map:
    bottleneck: >
      Whether W_n of the frozen
      Sylvester splits equals
      (n-1) 2^{n-2} as exact integer
      arithmetic. Stage 0 only checks
      that identity, the alternative
      n=6 split, the omitted-term
