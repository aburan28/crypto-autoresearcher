hypothesis:
  id: H-QSP-cba939
  question_id: RQ-QSP-f9bbdb
  idea_id: IDEA-20260918-6c07e1
  statement: >-
    For every n' from 2 through 129 and every lambda in F2[X] of degree less
    than 2^n', the polynomial X^(2^n') + lambda(X) does not split completely
    over F_(2^131). The obstruction is the single residue 2^n' mod 131, which
    lies in {1, 2} for n' from 1 through 131 only at n' in {1, 130, 131}.
    Permission at those three values is not a construction. No attack
    exponent moves.
  mechanism: >-
    A root set of an F2-coefficient polynomial is stable under x |-> x^2.
    Because 131 is prime, every Frobenius orbit on F_(2^131) has size 1 or
    131, and the size-1 orbits are the two roots of x^2 + x. A stable set
    therefore has size a + 131*b with a in {0, 1, 2}. Complete splitting
    requires size 2^n'. For odd prime p, 2^n' is never 0 mod p, so the
    residue must be 1 or 2. The order of 2 modulo 131 is 130, so those
    residues occur only at the three named exponents.
  assumptions:
    - 131 is prime, and lambda has coefficients in F2.
    - Degree of lambda is strictly less than 2^n', so the polynomial has degree 2^n'.
    - Complete splitting means the root set has size exactly 2^n', with distinct roots.
    - The same residue claim is not made at composite extension degree.
  proof_search_map:
    bottleneck: >-
      The exact-splitting question at prime degree 131 reduces to one modular
      exponentiation per n'. No root-counting gcd is required for this claim.
    baseline_embedding:
      parameter_slice: >-
        n' in {1, 130, 131} at modulus 131, plus the cells (7, 3) and (31, 15).
      reproduction_check: >-
        2^1, 2^130 and 2^131 modulo 131 are 2, 1 and 2. 2^3 modulo 7 is 1.
        2^15 modulo 31 is 1. All five residues lie in {1, 2}, so none of
        these cells is excluded.
    observation_collision:
      observable: the residue 2^n' mod 131 and the predicate that it lies in {1, 2}
      distinct_preimage_search: >-
        The residue depends on n' alone. Every lambda at that n' shares it.
        The dangerous collision is an n' from 2 through 129 whose residue is
        1 or 2.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: the residue of the root-set size modulo the prime degree
        predicted_gain: >-
          Replaces a per-polynomial root count by one modular exponentiation.
      - transform: specialization_pack
        proposed_object: the same residue test at the recorded cells (7, 3) and (31, 15)
        predicted_gain: >-
          Checks that the argument permits every complete-splitter cell named
          in the proposal.
    quantifier_order: >-
      For all n' from 2 through 129 and all lambda in F2[X] of degree less
      than 2^n', the polynomial does not split completely over F_(2^131).
      There is no existential witness.
    method_ceiling:
      strongest_certifiable_claim: >-
        For prime n and lambda in F2[X] of degree less than 2^n', complete
        splitting over F_(2^n) requires 2^n' congruent to 1 or 2 modulo n.
        Nothing is claimed about approximate splitting, coefficients outside
        F2, composite n, or existence at the permitted exponents.
      nearby_object_control: >-
        The subfield of 8 elements inside F_(2^15) is Frobenius-stable and
        has size 8, which is 8 modulo 15, outside {0, 1, 2}. If the checker
        calls that size legal for the prime-degree residue rule, the
        instrument is void. Separately, n' = 130 must stay permitted.
    proof_obligations:
      - claim: 131 is prime and ord_131(2) = 130
        responsibility: correctness
      - claim: size-1 orbits of x |-> x^2 are exactly the two roots of x^2 + x
        responsibility: correctness
      - claim: the permitted set on n' from 1 through 131 is exactly {1, 130, 131}
        responsibility: baseline
      - claim: the composite-degree control exits {0, 1, 2}
        responsibility: strictness
      - claim: no approximate-splitting or exponent claim is inferred
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: >-
        Design-time arithmetic, recomputed in this session and frozen as the
        prediction the executor must reproduce. 131 is prime. 2^130 ≡ 1,
        2^65 ≡ 130, 2^26 ≡ 53 and 2^10 ≡ 107 modulo 131, so the order is 130.
        No n' from 2 through 129 has residue 1 or 2. The edge residues are
        2, 1 and 2. 2^3 ≡ 1 modulo 7 and 2^15 ≡ 1 modulo 31.
      citation: IDEA-20260918-6c07e1
      provenance: internal
      verified_by: coordinator session 2026-10-05, direct modular arithmetic
      role: pre-registered residue table
    - description: >-
        The published Type 1bis splitter at n' = 130 is cited by the proposal
        at second hand. This hypothesis uses it only as the cell the residue
        test must permit. It does not re-verify that a published polynomial
        splits.
      citation: IDEA-20260918-6c07e1
      provenance: internal
      verified_by: >-
        idea-generator citation block of IDEA-20260918-6c07e1, which marks
        the splitter attribution as not read from the paper in that session
      role: non-exclusion cell, not a re-checked construction
  reduction_chain:
    core_problem: >-
      Whether exact complete splitting of this F2-coefficient shape is
      possible at n=131 for n' from 2 through 129.
    corollaries: []
  predictions:
    - metric: permitted_exponents_mod_131
      direction: different
      minimum_effect: exactly the set {1, 130, 131}
    - metric: excluded_residue_count
      direction: lower
      minimum_effect: zero n' from 2 through 129 with residue in {1, 2}
    - metric: composite_control_residue
      direction: different
      minimum_effect: 8 modulo 15 equals 8, outside {0, 1, 2}
  test_boundary:
    instances:
      - n' from 1 through 131 at modulus 131
      - orbit census of F_(2^7)
      - the 8-element subfield of F_(2^15)
      - permission checks at (7, 3) and (31, 15)
    parameters:
      modulus: 131
      excluded_range: [2, 129]
      permitted_set: [1, 130, 131]
      order_witnesses:
        full: 1
        half: 130
        by_5: 53
        by_13: 107
    implementation: >-
      Exact integer arithmetic and one enumeration of F_(2^7) and of the
      roots of x^8 + x in F_(2^15). No polynomial census at degree 2^33.
    budget:
      enforcement: advisory
      wall_clock_seconds_per_run: null
      maximum_memory_gb: 2
      maximum_runs: 1
  falsification_conditions:
    - >-
      Some n' from 2 through 129 has 2^n' mod 131 in {1, 2}. The exclusion
      is false.
    - >-
      The permitted set on n' from 1 through 131 is not exactly
      {1, 130, 131}. In particular, excluding 130 refutes the argument.
    - >-
      The n=7 orbit census has an orbit size other than 1 or 7, or a number
      of size-1 orbits other than 2. The orbit checker is invalid.
    - >-
      The 8-element subfield of F_(2^15) is reported as size congruent to
      0, 1, or 2 modulo 15. The instrument is void.
  interpretation_limits:
    - >-
      This is an exclusion of one shape. It does not close the
      quasi-subfield line, and it says nothing about approximate splitting.
    - >-
      Pollard rho on the binary challenges is untouched. The time-exponent
      delta is 0.
    - Permission at n' in {1, 130, 131} is not an existence proof.
    - >-
      A census row cannot confirm the exclusion. Only a residue
      counterexample or a failed control can decide it from computation.
    - >-
      GOAL-ECDLP2M-001 next_action names TASK-20261005-34c6e8 and opens no
      batch. This hypothesis does not replace that action.
    - >-
      TASK-20260918-190055 remains the adversarial review of the derivation.
      This hypothesis is the arithmetic self-test, not that review's verdict.
  status: specified
  proposed_by: coordinator
