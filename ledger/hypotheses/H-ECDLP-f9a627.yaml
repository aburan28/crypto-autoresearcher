hypothesis:
  id: H-ECDLP-f9a627
  question_id: RQ-ECDLP-002
  title: >-
    The same-field genus-g cover-transfer barrier is held in this program only
    as a blacklist STRING with no quantity, units, error bars or scope, which
    under the inventor protocol is a verdict and not a datum; this hypothesis
    is that the barrier can be converted into a measured obstruction block, and
    that its own mechanism supplies a self-falsifying arm nobody has run
  statement: >-
    PROVENANCE AND DISPOSITION, RECORDED FIRST BECAUSE IT CHANGES HOW THIS
    RECORD MAY BE USED. The source, IDEA-20260817-f63307, is NOT a live
    proposal. It carries status withdrawn, withdrawn_at 2026-08-17, and its own
    status_note says in terms that it is "specifically not available to
    /design-experiment" because "a confirmed duplicate carried as status:
    proposed would be a candidate for compute behind a barrier the program
    already holds". This coordinator session read that record in full and
    confirms the withdrawal is a duplication withdrawal, not an error
    withdrawal. THIS HYPOTHESIS IS THEREFORE NOT THE WITHDRAWN TRANSFER CLAIM
    AND MUST NOT BE READ AS RE-FILING IT. It is the successor the withdrawal
    record itself endorses: its preserved_for_successor section states that
    converting the barrier "into an obstruction block with the self-falsifying
    conorm arm is worth doing in an obstruction-recording task rather than a
    proposal". A dispatching Coordinator that disagrees should refuse approval
    on that ground; the disagreement is surfaced here rather than buried.
    THE HYPOTHESIS. The program holds a no-go result for same-field
    fixed-genus index-calculus cover transfers over F_p as the blacklist entry
    D3-Gaudry-fixed-genus-over-F-p-IC-cost-barrier-delimiting-the-RM-escape-B1
    at 0717b2, paired with the candidate it closes,
    B1-Kani-torsion-glued-genus-2-Jacobian-with-real-multiplication-REPRESENTATION-CANDIDATE
    at 0717b2. BOTH STRINGS WERE READ VERBATIM IN outputs/_blacklist_compact.txt
    BY THIS COORDINATOR SESSION AND EXIST EXACTLY AS QUOTED. Neither carries a
    quantity, a unit, an error bar, a measured-by reference, or a claimed
    scope. CLAIM (1): the barrier's content is measurable as a per-factor
    decomposition of the relation-supply cost rather than as an aggregate
    verdict, so that a later reader can say WHERE the loss sits and re-scope it.
    CLAIM (2), THE SELF-FALSIFYING ARM, WHICH A BARRIER STRING CANNOT CONTAIN:
    the barrier's mechanism is that relation collection is governed by the
    ambient group order p^g and cannot see the order-n subgroup. That mechanism
    makes a hard prediction --- the decomposition rate of elements RESTRICTED TO
    THE IMAGE OF THE CONORM MAP equals the rate for uniformly random Jacobian
    elements. A conorm-image rate materially above the uniform rate refutes the
    mechanism and reopens the lane with a witness. Any obstruction record for
    this barrier that omits this arm is asserting the mechanism rather than
    measuring it.
  mechanism: >-
    For E/F_p ordinary whose group order n is prime, a transfer into Jac(C) for C of
    genus g carrying a nonconstant F_p-morphism to E raises the ambient group
    order from about p to about p^g while the target subgroup stays at n about
    p. Relation collection samples the ambient group, so the decomposition
    probability is set by p^g and not by n. That is the whole of the barrier,
    and it is a statement with an observable consequence: two decomposition
    rates measured by the same routine in the same invocation, one on conorm
    images and one on uniform elements, must agree. The measurement is
    therefore a test of the barrier's mechanism, not a search for a speedup,
    and this hypothesis predicts its own candidate route loses.
  assumptions:
    - >-
      A genus-2 curve C over F_p with a nonconstant F_p-morphism to a given
      ordinary E is constructible at the tested primes. The construction is
      recalled from Kani-style gluing and has NOT been verified by any agent in
      this program; if it cannot be built within budget that is a feasibility
      outcome under AGENTS.md rule 5, never evidence about the barrier.
    - >-
      The conorm image of E(F_p) in Jac(C)(F_p) is enumerable at the tested
      primes. It has about p elements, which at 24 bits is about 1.7 times 10^7
      and is exhaustible; this is what makes the treatment arm EXACT rather
      than sampled.
    - >-
      The decomposition test is the same routine for both arms, invoked in the
      same process with the same factor base and the same reduction code, so
      the two sides of every ratio are counted in the same unit.
  proof_search_map:
    bottleneck: >-
      Not an algorithmic bottleneck but an evidential one: the step at which
      the program cites a barrier. A barrier held as a string cannot be
      compared, re-scoped or inverted by any later reader, so every later
      decision that leans on it leans on a verdict.
    baseline_embedding:
      parameter_slice: >-
        The extension-field contrast case, where the same machinery is known to
        win. It is labelled CONTRAST throughout and is never used as
        prime-field evidence, per the warning carried in KN-LIT-002.
      reproduction_check: >-
        The contrast arm must reproduce a decomposition rate materially above
        the prime-field arm at matched group size. Without it a prime-field
        null is uninterpretable, because a routine that decomposes nothing
        anywhere would produce the same null.
    observation_collision:
      observable: The measured decomposition rate.
      distinct_preimage_search: >-
        A COLLISION EXISTS AND IT IS WHY THE CONTRAST ARM IS BLOCKING. A rate
        of zero is produced equally by a genuine barrier and by a broken
        decomposition routine. The contrast arm, at matched group size and in
        the same invocation, is the condition that separates them.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the decomposition routine fixed and vary the source of the
          element: uniform ambient, conorm image, and extension-field contrast.
          The fibre of the rate over these three sources is the measurement.
        predicted_gain: >-
          Either an obstruction block with a measured value, or a witness that
          the barrier's mechanism is wrong.
    quantifier_order: >-
      FOR the tested primes, the tested genus-2 constructions and the named
      factor bases, THERE EXISTS a measured decomposition rate for uniform
      ambient elements and for conorm images, and they are equal within the
      stated interval. NOT CLAIMED: any statement over all g, all p, all cover
      constructions, or any asymptotic exponent. The withdrawn source itself
      priced the legitimacy of a toy-scale exponent claim at 0.4, its lowest
      number, and no exponent is extrapolated here.
    method_ceiling:
      strongest_certifiable_claim: >-
        At the tested primes and constructions, the decomposition rates of
        conorm-image and uniform ambient elements are the stated numbers with
        the stated intervals, and the per-factor cost decomposition is the
        stated table. It CANNOT certify the barrier for any other genus, prime,
        or construction, and it cannot certify an asymptotic exponent.
      nearby_object_control: >-
        The extension-field contrast, where the conclusion "index calculus does
        not pay here" is KNOWN FALSE. If the machinery reports the contrast case
        as also barren, it is not measuring decomposition and the prime-field
        null is worthless.
    proof_obligations:
      - claim: The blacklist strings exist verbatim and carry no quantity.
        responsibility: baseline
      - claim: The conorm image is enumerable at the tested primes.
        responsibility: feasibility
      - claim: The two rates are measured by one routine in one invocation.
        responsibility: interface
      - claim: The contrast arm produces a materially higher rate.
        responsibility: correctness
      - claim: The cost decomposition separates the linear-algebra term.
        responsibility: runtime
      - claim: No exponent is extrapolated from three rungs.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: null
    prior_best: null
    time_exponent: null
    memory_exponent: null
    hidden_cofactor: null
    claim_kind: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        For a genus-2 Jacobian over F_p and a factor base of B degree-1 places,
        the probability that a uniformly random reduced divisor of degree 2
        decomposes over the factor base is (B/p)^2 times (1 + o(1)), and with
        the plain balance B = p^(2/3) that rate is p^(-2/3).
      random_model_justification: >-
        A reduced divisor of degree 2 is a sum of two degree-1 places up to the
        usual exceptional set, and the places are modelled as uniform over the
        about p degree-1 places, which is the standard smoothness model for
        fixed-genus index calculus.
      supporting_results:
        - ref: KN-LIT-002
          provenance: internal
          claim: >-
            Gaudry's index calculus for abelian varieties of small dimension
            gives heuristic exponents over extension fields, with the explicit
            warning that a prime-field claim must not silently borrow
            extension-field asymptotics. Relied on for the WARNING and the
            shape of the exponent family, never for a prime-field number. The
            corpus record states its own full source was not read.
          verified_by: >-
            idea-generator in IDEA-20260817-f63307 (corpus record read in full,
            underlying paper NOT opened); this coordinator session did not
            re-open KN-LIT-002 and marks the entry relayed on that basis
        - ref: >-
            Enge-Gaudry and Diem-Thome, index calculus for Jacobians of
            fixed-genus curves
          provenance: recalled
          claim: >-
            Heuristic cost of the form q^(2 - 2/g) for the DLP in a fixed-genus
            Jacobian with a double-large-prime variation. Pointer only, never
            verified in this program, and it is the PREDICTION this measurement
            fits against rather than an established input.
          verified_by: null
      validation_experiment_ids: [EXP-ECDLP-26065d]
      falsification_condition: >-
        The measured uniform-element decomposition rate differs from (B/p)^2 by
        more than a factor of 2 at any tested prime, which would mean the
        smoothness model does not describe the tested construction and the
        per-factor cost decomposition is being read against the wrong baseline.
  structural_ingredients:
    - description: >-
        The recorded no-go closing same-field fixed-genus index-calculus cover
        transfers over F_p, scoped as delimiting the paired Kani-glued
        real-multiplication representation candidate.
      citation: >-
        outputs/_blacklist_compact.txt, entry
        D3-Gaudry-fixed-genus-over-F-p-IC-cost-barrier-delimiting-the-RM-escape-B1@0717b2
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-3baed3, resolved the exact string in
        outputs/_blacklist_compact.txt and confirmed the paired entry
        B1-Kani-torsion-glued-genus-2-Jacobian-with-real-multiplication-REPRESENTATION-CANDIDATE@0717b2
        is present verbatim in the same file. Confirmed directly that neither
        entry carries a quantity, unit, error bar, measured-by reference or
        scope, which is the premise of this hypothesis.
      role: the verdict this hypothesis proposes to convert into a datum
    - description: >-
        Kani's lemma and the gluing of two elliptic curves into a genus-2
        Jacobian, giving an explicit conorm embedding over the same field.
      citation: Kani gluing of elliptic curves into genus-2 Jacobians
      provenance: recalled
      verified_by: null
      role: >-
        the construction the treatment arm needs. Pointer only. If it cannot be
        executed within budget the experiment reports a feasibility outcome and
        no obstruction value is recorded.
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: conorm_image_decomposition_rate_minus_uniform_rate
      direction: different
      minimum_effect: >-
        PREDICTED EXACTLY ZERO, within the stated interval. The treatment arm
        is EXACT by exhaustive enumeration of the conorm image, which has about
        p elements; all sampling error sits in the uniform arm. A conorm-image
        rate above the uniform rate by a factor of 2 or more REFUTES the
        barrier's mechanism and reopens the lane with a witness, and is the
        outcome this hypothesis exists to make reachable.
    - metric: per_factor_cost_decomposition
      direction: different
      minimum_effect: >-
        Reported, not predicted, per prime: decomposition probability, realised
        factor-base size, relations needed, and cost per relation, each with
        its own unit, plus the sparse-linear-algebra term REPORTED SEPARATELY
        rather than absorbed. The deliverable is where the loss sits.
    - metric: extension_field_contrast_rate_over_prime_field_rate
      direction: higher
      minimum_effect: >-
        Materially above 1 at matched group size. A contrast arm that is also
        barren means the routine decomposes nothing anywhere and the
        prime-field null is uninterpretable. LABELLED CONTRAST THROUGHOUT AND
        NEVER USED AS PRIME-FIELD EVIDENCE.
    - metric: obstruction_block_completeness
      direction: different
      minimum_effect: >-
        Binary. The produced obstruction block must carry statement, quantity,
        value with units and interval, measured_by run identifiers, scope, and
        a resource_check with examined true and a written reading. A block
        missing any of these fails the protocol regardless of what was measured.
  test_boundary:
    instances:
      - E/F_p ordinary with prime order, p in {65537, 1048583, 16777259}
      - genus-2 C over the same F_p with a nonconstant morphism to E
      - extension-field contrast instance at matched group size, labelled CONTRAST
    parameters:
      genus: 2
      factor_base_exponent: 2/3
      conorm_arm: exhaustive over the image
      uniform_arm_samples: [58000, 367000, 2400000]
    implementation: >-
      One decomposition routine, one factor base, both arms in the same
      invocation. Operation counts reported alongside wall clock.
    budget:
      wall_clock_seconds: 7200
      memory_gb: 8
      maximum_runs: 12
  falsification_conditions:
    - >-
      The conorm-image decomposition rate exceeds the uniform rate by a factor
      of 2 or more at any tested prime. The barrier's mechanism is refuted with
      a witness, the lane reopens at the tested scope, and the result must go to
      independent adversarial review before any wider phrasing is used.
    - >-
      The extension-field contrast arm reports a rate indistinguishable from the
      prime-field arm. The routine is not decomposing anything and no
      obstruction value may be recorded.
    - >-
      The genus-2 construction cannot be built at any tested prime within
      budget. That is a feasibility outcome under AGENTS.md rule 5 and is never
      evidence for or against the barrier.
    - >-
      The measured uniform rate differs from (B/p)^2 by more than a factor of 2.
      HEUR-001 does not describe the tested construction and the cost
      decomposition is being read against the wrong baseline.
  interpretation_limits:
    - >-
      THE SOURCE RECORD IS WITHDRAWN AND FORBIDS ITS OWN RE-FILING. This
      hypothesis is scoped to the obstruction-recording successor the
      withdrawal explicitly endorses, and it asserts no part of the withdrawn
      transfer claim. It carries no permission; only a committed Coordinator
      decision can approve the contract, and a Coordinator that reads the
      withdrawal as forbidding even this successor should refuse.
    - >-
      THIS ROUTE IS DOMINATED AND SAYS SO. Pollard rho at n^(1/2+o(1)) time and
      O(1) memory and BSGS at n^(1/2) time and n^(1/2) memory dominate the
      described transfer on BOTH axes; the withdrawn record priced its own
      predicted loss at a factor of at least p^(1/2). No speedup of any kind is
      claimed, sought, or reachable here.
    - >-
      NO ASYMPTOTIC EXPONENT IS EXTRAPOLATED. Three rungs from 16 to 24 bits
      cannot separate a fixed-genus asymptotic from the sparse-linear-algebra
      term, which at these sizes is not lower-order. Per-size data with the
      linear-algebra term reported separately is the deliverable, exactly as
      the withdrawal note anticipated.
    - >-
      The extension-field arm is a CONTRAST and its numbers may never be
      transferred to the prime-field case; KN-LIT-002's own warning is the
      reason and is carried here.
    - >-
      Scope: genus 2, three prime fields from 2^16 to 2^24, one factor-base
      exponent, one decomposition routine, one gluing construction. Nothing
      transfers to other genera, other constructions, or cryptographic
      parameters.
  status: proposed
  proposed_by: idea-generator
