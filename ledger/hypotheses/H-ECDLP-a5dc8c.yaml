  statement: >-
    The integer 16777215 has bit length 24. Its bits are twenty-four 1s.
    Reaching it by doubling and adding uses 23 doublings and 23
    additions. Twenty-four exceeds twenty-three by 1. Twenty-three
    equals twenty-three, so that gap is 0. The product of 24, 23, and
    23 is 12696. Their sum is 70. Two readings of the addition count
    are both 23, so that gap is 0 and their product is 529.
  mechanism: >-
