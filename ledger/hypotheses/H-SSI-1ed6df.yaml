hypothesis:
  id: H-SSI-1ed6df
  question_id: RQ-SSI-1946c9
  idea_id: IDEA-20261004-edbd24
  statement: >-
    On the curve y^2 = x^3 + x at p in {59, 419, 659}, with N = 5 and one
    secret 3-isogeny, decryption that reads only the normalized action of
    that isogeny on a basis of E[5] returns the same plaintext for every
    valid ciphertext after the secret is replaced by that action table.
    At least two distinct basis presentations normalize to the same table.
    A request for a connecting ideal of norm 7 is not answered by the
    table. No reverse reduction from the table to a full End(E) basis is
    claimed, so this interface does not by itself depend on the full
    endomorphism-ring problem.
  mechanism: >-
    Fix the base curve and one 3-isogeny phi. The full witness presentation
    is phi together with an ordered basis of E[5]. The quotient Q is the
    normalized table of phi on that basis, modulo GL_2(Z/5Z) and negation.
    Decryption of a valid ciphertext reads only Q. Replay replaces the
    presentation by Q and compares plaintexts. The negative control asks
    for an ideal of norm 7, which is outside that table.
  assumptions:
    - >-
      p = 59, 419, and 659 are congruent to 3 mod 4, and 5 divides p+1, so
      y^2 = x^3 + x is supersingular over F_p and E[5] is defined over
      F_{p^2}.
    - >-
      Decryption is deterministic on the frozen ciphertext set. Basis
      changes and negation are normalized before two witnesses are called
      distinct.
    - >-
      The norm-7 query is not part of decryption. It exists only to show
      that the tracer does not answer every endomorphism-ring request from
      the N = 5 table.
  proof_search_map:
    bottleneck: >-
      A reverse reduction from the normalized 5-torsion action table to a
      basis of End(E) for the curve distribution used here.
    baseline_embedding:
      parameter_slice: >-
        p in {59, 419, 659}, base j = 1728, N = 5, one 3-isogeny, ciphertexts
        drawn from the frozen message set {0, 1}.
      reproduction_check: >-
        Every valid ciphertext decrypts to its message before any quotient
        substitution. After substitution of the normalized torsion table,
        the plaintext is unchanged.
    observation_collision:
      observable: >-
        The normalized torsion-action table, the plaintext, and the
        accept bit.
      distinct_preimage_search: >-
        Enumerate GL_2(Z/5Z) basis changes of one fixed isogeny and record
        which presentations share a normalized table.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fiber of basis presentations over one normalized 5-torsion
          action table.
        predicted_gain: >-
          A fiber of size at least 2 shows decryption does not need the
          basis presentation, only the table.
    quantifier_order: >-
      For each prime, quantify over every basis presentation of the fixed
      3-isogeny, then over both valid messages. One plaintext mismatch
      refutes sufficiency of that table.
    method_ceiling:
      strongest_certifiable_claim: >-
        Program factorization of this toy decryption through the normalized
        5-torsion table, plus an explicit missing reverse arrow to End(E).
      nearby_object_control: >-
        A norm-7 connecting-ideal request is unanswered by the same table.
    proof_obligations:
      - claim: equal normalized tables imply equal plaintexts on {0, 1}
        responsibility: correctness
      - claim: normalization identifies basis changes of one action
        responsibility: correctness
      - claim: the table does not answer a norm-7 ideal request
        responsibility: interface
      - claim: no reverse reduction to End(E) is supplied
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        Exhaustive collisions at these three primes show which secret
        calls this decryption uses. They say nothing about hardness at
        larger primes.
      random_model_justification: >-
        GL_2(Z/5Z) has more than one element, so more than one basis
        presentation exists for a single isogeny. That is a finite group
        count, not a model of a random endomorphism ring.
      supporting_results: []
      validation_experiment_ids:
        - EXP-SSI-10147c
      falsification_condition: >-
        After normalization, every prime has fiber size 1, or a valid
        ciphertext decrypts to two different plaintexts from one table.
  structural_ingredients:
    - description: >-
        SÉTA's published trapdoor is a finite torsion action, not a
        serialization of a maximal order. This hypothesis copies that
        interface shape at toy size and does not instantiate SÉTA.
      citation: IDEA-20261004-edbd24
      provenance: internal
      verified_by: >-
        idea-generator session on 2026-10-04, citation block of
        IDEA-20261004-edbd24, which records ePrint 2019/1291 as retrieved
      role: finite-trapdoor baseline
  reduction_chain:
    core_problem: >-
      Whether this toy decryption factors through the normalized action
      on E[5].
    corollaries: []
  predictions:
    - metric: plaintext_disagreements_after_quotient_substitution
      direction: lower
      minimum_effect: exactly 0 on every prime
    - metric: normalized_presentation_fiber_size
      direction: higher
      minimum_effect: at least 2 on every prime
    - metric: unresolved_reverse_arrows
      direction: higher
      minimum_effect: >-
        exactly 1, the missing arrow from the torsion table back to an
        End(E) basis
  test_boundary:
    instances:
      - y^2 = x^3 + x over F_p for p in {59, 419, 659}
    parameters:
      torsion: 5
      isogeny_degree: 3
      fresh_norm: 7
      messages: [0, 1]
    implementation: >-
      A finite-field tracer written for this experiment. It does not
      implement a deployed PKE and it does not search at larger primes.
    budget:
      enforcement: advisory
      wall_clock_seconds_per_run: null
      maximum_memory_gb: 4
      maximum_runs: 1
  falsification_conditions:
    - >-
      Two presentations with the same normalized table decrypt one valid
      ciphertext to different plaintexts.
    - >-
      The norm-7 request is answered from the 5-torsion table. That
      invalidates the tracer.
  interpretation_limits:
    - A factorization through the table is not an attack and is not a proof that EndRing is unnecessary for every PKE.
    - No result is claimed for SÉTA, SiGamal, LIT-SiGamal, or FESTA at their published parameters.
    - The missing reverse arrow stays missing unless a later record proves it.
    - This hypothesis does not replace the C-star symbolic-interface task.
  status: specified
  proposed_by: coordinator
