hypothesis:
  id: H-ICEX-31f4e3
  question_id: RQ-RELN-001
  source_idea_id: IDEA-20260808-5e257f
  title: >-
    A BINARY SUCCESS BIT UNDER A WALL BUDGET IS A THRESHOLDED TRANSFORM OF A
    MONOTONE ORDINAL, AND THE ORDINAL IS STRICTLY MORE EFFICIENT AT THE SAME
    COMPUTE- with three corrections to the source record that change what may be
    claimed- the p_exist/p_solve separation lives in EV-RELN-001 and not in the
    GOAL-RELN-001 head; the ICEX feed is committed as a CLOPPER-PEARSON LOWER
    BOUND p_L on a probability and NOT as a cost exponent; and the reference E2-02
    on which the sufficiency claim rests RESOLVES TO NOTHING IN THE CORPUS
  statement: >-
    (A) WHAT IS ACTUALLY COMMITTED, QUOTED, AND WHERE. EV-RELN-001 records
    VERBATIM that TASK-20260725-661 froze a review-only P(decomp) versus
    factor-base-size protocol under snapshot 7efaf655b540 with DUAL METRICS -
    oracle p_exist versus charged p_solve and Clopper-Pearson p_L - and that the
    independent red team returned PASS with, VERBATIM, the ICEX feed restricted to
    charged p_L. THE GOAL-RELN-001 HEAD CONTAINS NEITHER THE STRING p_exist NOR
    p_solve NOR ANY CENSORING CONVENTION; the source proposal attributes the
    protocol to the goal record, and that attribution is a READING. It is
    corrected here rather than inherited.
    (B) THE CLAIM THIS HYPOTHESIS MAKES, WHICH IS PURELY ABOUT ESTIMATOR
    EFFICIENCY. For a DEGREE-GRADED algebraic solver under a wall budget, the
    largest Macaulay degree at which a full graded reduction completed before the
    budget expired, written D_reached, is (i) recoverable from every attempt
    including every exhausted one, (ii) non-decreasing in the budget for a fixed
    instance and seed, and therefore (iii) right-censored rather than missing. A
    binary success indicator is the INDICATOR OF D_reached EXCEEDING A THRESHOLD,
    so it discards the ordering. CLAIM- on data generated from a known
    power-law parameter with imposed censoring, a right-censored
    accelerated-failure-time fit on D_reached recovers the parameter with nominal
    coverage and a CONFIDENCE INTERVAL AT LEAST 1.5 TIMES NARROWER than the
    binary logistic fit at censoring fraction 0.5, and AT LEAST 3 TIMES NARROWER
    at censoring fraction 0.75.
    (C) WHERE THAT FACTOR OF 3 COMES FROM, DERIVED SO IT IS NOT A GUESS. At
    censoring fraction c the binary estimator sees only the events- its Fisher
    information for the slope scales as n times c times (1-c), and as c
    approaches 1 the information vanishes. The censored ordinal estimator retains
    all n observations, contributing a full likelihood term for each uncensored
    attempt and a one-sided survival term for each censored one, so its
    information degrades far more slowly. At c = 0.75 the binary interval width
    scales as 1/sqrt(n*0.1875) against the ordinal roughly 1/sqrt(n*k) for a
    constant k of order 1, giving a ratio near 2.3 to 3.3; at c = 0.9 the
    predicted ratio is near 3.3. THE BAND 1.5 AT c = 0.5 AND 3 AT c = 0.75 IS
    THEREFORE SET FROM THE INFORMATION ARITHMETIC AND FROZEN BEFORE ANY DATA.
    (D) THE THREE SCOPE EXCLUSIONS THIS HYPOTHESIS MAKES EXPLICITLY, AGAINST ITS
    OWN SOURCE.
      EXCLUSION 1 - SUFFICIENCY. The source claims D_reached is SUFFICIENT for the
      ICEX input because -by E2-02- what ICEX needs is theta, the exponent of the
      oracle cost in B. THE STRING E2-02 OCCURS ONLY INSIDE SEVEN
      IDEA-20260808-prefixed PROPOSALS AND IN NO COMMITTED LEDGER RECORD,
      EXPERIMENT OR KNOWLEDGE ENTRY. It resolves to nothing a later reader can
      open. Moreover EV-RELN-001 restricts the ICEX feed to charged p_L, a
      PROBABILITY LOWER BOUND, not an exponent. THE SUFFICIENCY CLAIM IS THEREFORE
      OUTSIDE THE SCOPE OF THIS HYPOTHESIS and no result here may be quoted as
      showing that D_reached can replace p_L in any ICEX input.
      EXCLUSION 2 - NO RE-ANALYSIS IS POSSIBLE. The source minimal test begins
      with re-analysing an existing RELN run set. GOAL-RELN-001 HAS NO RUN SET-
      EV-RELN-001 carries empty experiment_ids and empty run_ids and the goal head
      records that no decomposition-probability measurement was performed. The
      re-analysis limb is therefore UNRUNNABLE and is replaced by a synthetic
      validation plus an instrument audit.
      EXCLUSION 3 - NO CURVE ENTERS. The efficiency claim is a statement about
      right-censored regression on a monotone ordinal. THE SYNTHETIC ARM CONTAINS
      NO CURVE, NO GROUP AND NO FACTOR BASE, and this is recorded as a PROOF
      RATHER THAN AS AN ARM- the object is curve-free BY CONSTRUCTION, so a
      curve-free null would be the identical computation. PRE-DECLARED- NO OUTCOME
      OF THE SYNTHETIC ARM IS AN ELLIPTIC-CURVE STATEMENT OF ANY KIND.
    (E) WHAT THIS DOES. It changes what is LOGGED - one integer per attempt - and
    how the logged quantity is estimated. It changes no claim, produces no attack,
    and cannot make a negative result positive. It can only make an underpowered
    measurement powered.
  mechanism: >-
    THE DECISIVE STRUCTURAL FACT. A degree-graded solver visits Macaulay degrees
    in increasing order, so the set of degrees completed at any moment is an
    interval starting at 1 and the observation at budget exhaustion is
    RIGHT-CENSORED rather than missing. That is precisely the setting in which
    right-censored maximum likelihood is consistent and a binary success-rate
    estimator is not.
    WHY THE BINARY BIT IS THE WRONG FUNCTIONAL AND NOT MERELY A NOISY ONE.
    Success is the event that D_reached reached the degree at which the system
    resolves. Thresholding a monotone ordinal at a budget maps every attempt that
    got to degree 2 and every attempt that got to degree 9 onto the same value
    zero, so the estimator cannot distinguish a solver that was one degree short
    from one that never started. The information in that ordering is discarded by
    construction, not lost to noise.
    WHERE THE MODEL CAN FAIL, AND THE CHECK THAT DETECTS IT. A real F5 with degree
    falls does not visit degrees in a clean increasing order. If D_reached is not
    non-decreasing in the budget for a fixed instance and seed, the
    interval-censoring model does not apply to that solver at all. That is a
    GENUINE LIMITATION and not a nuisance, and it is detected by running the same
    instance at three budgets and requiring monotonicity at every instance.
    WHY MEMORY EXHAUSTION IS CODED SEPARATELY. Time exhaustion and memory
    exhaustion are different censoring mechanisms with different dependence on the
    covariate. They are coded as distinct event types and never pooled, and an
    instance with no decomposition at all is coded as a THIRD event type distinct
    from both, because -no solution exists- and -not enough budget- are different
    events and an estimator that confuses them is wrong.
  assumptions:
    - >-
      The solver is degree-graded within a single frozen lineage, and comparisons
      are made only within that lineage. D_reached depends on implementation as
      much as on the system.
    - >-
      Budgets are declared before the attempt and are NEVER adapted to observed
      progress. An adapted budget makes the censoring informative and breaks the
      estimator.
    - >-
      The power-law specification D_trial = Theta(B^theta) is an ASSUMPTION, and
      the fit reports a lack-of-fit statistic rather than a bare interval, so a
      drifting theta shows as misfit instead of as a wrong number.
    - >-
      UNITS. D_reached is a DEGREE, a dimensionless non-negative integer. Budgets
      are WALL-CLOCK SECONDS. The two are never divided into each other; the
      budget enters the model only as the censoring time, and the estimated
      quantity theta is dimensionless.
    - >-
      Three event types are coded distinctly and never pooled- completed, censored
      by time, censored by memory; plus a fourth code for instances with no
      decomposition, which is a property of the instance and not of the budget.
  proof_search_map:
    not_applicable_reason: >-
      A statistical instrument record. The one rigorous ingredient - consistency
      of right-censored maximum likelihood under correct model specification - is a
      classical theorem cited rather than proved, and no new theorem, bound,
      certificate family, reduction or closure argument is proposed. The
      information arithmetic in statement (C) sizes a band before compute and
      claims nothing. Recorded rather than omitted per
      docs/inventor-protocol.md section 8.
    bottleneck: null
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms:
      - transform: null
        proposed_object: null
        predicted_gain: null
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations:
      - claim: null
        responsibility: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-CENS-1
      formal_statement: >-
        For a degree-graded solver in one frozen lineage, log D_trial is affine in
        log B with slope theta, so theta is identifiable from right-censored
        observations of D_reached by a parametric accelerated-failure-time fit,
        and the fitted interval attains nominal coverage.
      random_model_justification: >-
        RIGOROUS INGREDIENT- right-censored maximum-likelihood estimation is
        consistent and asymptotically efficient under correct model
        specification; that is a theorem and not a heuristic. THE HEURISTIC PART
        IS ONLY THE POWER-LAW SPECIFICATION, and the distribution imitated is the
        accelerated-failure-time family, standard for monotone durations with
        covariates. The specification is the same one any exponent fit on this
        quantity already assumes, so the heuristic adds nothing new; what it does
        is make the assumption checkable through a reported lack-of-fit statistic.
      supporting_results:
        - ref: EV-RELN-001
          provenance: internal
          claim: >-
            VERBATIM- a review-only P(decomp) versus factor-base-size protocol
            frozen under snapshot 7efaf655b540 with DUAL METRICS, oracle p_exist
            versus charged p_solve and Clopper-Pearson p_L, and an independent
            red-team PASS with the ICEX feed restricted to charged p_L. This is
            the record that carries the separation; the GOAL-RELN-001 head does
            not.
          verified_by: >-
            coordinator, TASK-20260904-65b023 - the observations block of
            EV-RELN-001 read directly this task (pattern-scoped read with
            context). PARTIAL READ, DECLARED- the remainder of the record was not
            opened and nothing else from it is relied on.
        - ref: GOAL-RELN-001
          provenance: internal
          claim: >-
            The goal head contains NO occurrence of p_exist, p_solve, E2-02 or any
            censoring convention, and its own note records that EV-RELN-001 is the
            only committed RELN evidence record, that its experiment_ids and
            run_ids are both empty, and that no decomposition-probability
            measurement was performed. This is a NEGATIVE finding about the record
            content and it is what removes the source re-analysis limb.
          verified_by: >-
            coordinator, TASK-20260904-65b023 - GOAL-RELN-001.yaml read in full
            this task, 172 lines, and separately searched for the four strings
            across the whole ledger/goals tree.
        - ref: EV-R6-001
          provenance: internal
          claim: >-
            The nearest run set in the corpus that records per-cell degree
            information- d_reg median per cell 2.0, d_reg max observed 10, and an
            explicit censored-cell inventory with budgets. Named here as the only
            candidate real-data arm; whether it records per-ATTEMPT degree
            progress rather than per-cell summaries is an OPEN QUESTION this
            hypothesis does not assume either way.
          verified_by: >-
            coordinator, TASK-20260904-65b023 - EV-R6-001 read in full this task,
            77 lines.
      validation_experiment_ids:
        - EXP-ICEX-c93308
      falsification_condition: >-
        On synthetic data generated from a KNOWN theta with imposed censoring, the
        censored-ordinal interval is NOT narrower than the binary interval at any
        censoring level, or its nominal 95 percent coverage falls outside
        [0.92, 0.98] over at least 200 replicates per level. The premise fails and
        the record is withdrawn rather than re-scoped.
    - id: HEUR-CENS-2
      formal_statement: >-
        D_reached is non-decreasing in the budget for a fixed instance and a fixed
        seed within one frozen solver lineage.
      random_model_justification: >-
        This is not a distributional heuristic at all but a property of the solver
        control flow, and it is stated as an assumption precisely because a real
        F5 with degree falls can violate it. No random model is imitated and none
        is needed; the check is direct.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ICEX-c93308
      falsification_condition: >-
        Any instance whose D_reached decreases when its budget increases. The
        interval-censoring model DOES NOT APPLY to that solver, the whole framing
        is inapplicable to it, and the record must be restated for that solver
        rather than the violation absorbed.
  structural_ingredients:
    - description: >-
        The committed dual-metric protocol and the restriction of the ICEX feed to
        charged Clopper-Pearson p_L, which is what fixes the scope exclusion on
        sufficiency.
      citation: EV-RELN-001
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-65b023 - PARTIAL READ, DECLARED (observations
        block read directly with context).
      role: >-
        the record that actually carries the p_exist/p_solve separation, and the
        source of the p_L restriction that bounds this hypothesis
    - description: >-
        The goal head, cited for a NEGATIVE fact- it carries neither the protocol
        strings the source attributes to it nor any run set, so no re-analysis is
        possible under this goal.
      citation: GOAL-RELN-001
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-65b023 - read in full this task, 172 lines.
      role: the record whose characterisation by the source proposal is corrected
    - description: >-
        Right-censored maximum-likelihood estimation and the accelerated-failure-
        time family, used as the estimator and as the source of the consistency
        theorem. NO SOURCE WAS OPENED for this; it is standard textbook material
        and is marked recalled so a reviewer can supply the reference.
      citation: >-
        Standard survival analysis - Kaplan-Meier for the marginal, parametric AFT
        for the covariate model, consistency of right-censored MLE under correct
        specification
      provenance: recalled
      verified_by: null
      role: the estimator whose efficiency advantage is the claim
  reduction_chain:
    core_problem: >-
      The efficiency of estimating a power-law exponent from a right-censored
      monotone ordinal against estimating it from the thresholded binary
      indicator, at equal compute.
    corollaries:
      - problem: >-
          The logging convention for any future degree-graded solver battery in
          this program - one additional integer per attempt.
        reduction_ref: >-
          Internal- no published reduction is cited and none is needed; the
          corollary is an engineering consequence, not a mathematical one.
        asymptotics_preserved: >-
          Not applicable. No attack, no exponent, no cost claim.
  predictions:
    - metric: >-
        P1- ratio of confidence-interval widths for theta, binary logistic over
        censored AFT, on synthetic data with KNOWN theta, per censoring fraction
        (dimensionless, widths in the same units)
      direction: higher
      minimum_effect: >-
        AT LEAST 1.5 at censoring fraction 0.5 and AT LEAST 3.0 at censoring
        fraction 0.75, over at least 200 replicates per level. DERIVED, NOT
        GUESSED- the binary Fisher information for the slope scales as
        n*c*(1-c) while the censored ordinal retains a full likelihood term per
        uncensored attempt and a survival term per censored one; at c = 0.75 that
        gives a predicted ratio near 2.3 to 3.3. A RATIO AT OR BELOW 1.0 AT ANY
        LEVEL FALSIFIES THE PREMISE.
    - metric: >-
        P2- fraction of attempts contributing to the estimate, per estimator
        (dimensionless)
      direction: higher
      minimum_effect: >-
        1.00 for the censored estimator against (1 - censoring fraction) for the
        binary one. THIS IS A FORCED ARITHMETIC CONSEQUENCE OF THE TWO ESTIMATOR
        DEFINITIONS AND NOT AN EMPIRICAL PREDICTION; it is reported as a
        construction check and is explicitly NOT counted as evidence for the
        efficiency claim.
    - metric: >-
        P3- nominal 95 percent coverage of the censored AFT interval on synthetic
        data with known theta, per censoring level (dimensionless)
      direction: different
      minimum_effect: >-
        IN [0.92, 0.98] at every censoring level tested, over at least 200
        replicates per level. Coverage outside that band means the estimator is
        mis-specified for this data-generating process and NO efficiency claim may
        be read from it, however narrow its intervals are.
    - metric: >-
        P4- monotonicity check- fraction of instances whose D_reached is
        non-decreasing across three increasing budgets, same instance, same seed
      direction: higher
      minimum_effect: >-
        1.00, i.e. NO violations. Any violation means the solver is not
        degree-graded in the required sense and the interval-censoring model does
        not apply to it. This is a genuine limitation of the model, not a
        nuisance, and it ends the applicability claim for that solver.
    - metric: >-
        P5- event-type separation- estimator behaviour when instances with NO
        decomposition are present
      direction: different
      minimum_effect: >-
        FORCED SEPARATION. With a declared fraction of no-solution instances
        planted, the estimator must return the SAME theta as on the arm without
        them, within its interval, PROVIDED they are coded as a distinct event
        type. An estimator that shifts when no-solution instances are added has
        confused -no solution- with -not enough budget-, which is exactly the
        error the record exists to prevent, and its output is void.
    - metric: >-
        P6- instrument audit- whether any committed run artifact in this corpus
        records PER-ATTEMPT degree progress rather than per-cell summaries
      direction: different
      minimum_effect: >-
        REPORTED AS A YES OR NO WITH THE PATHS INSPECTED LISTED. If no artifact
        records it, the finding is that the lane instrument does not emit its own
        most informative variable, which is reportable at zero compute and is a
        deliverable in its own right. THIS IS AN AUDIT AND ITS NEGATIVE ANSWER IS A
        RESULT, not a failure.
  test_boundary:
    instances:
      - >-
        SYNTHETIC ARM- data generated from a declared power law with known theta in
        {0.5, 1.0, 2.0}, with artificial budgets imposed to give censoring
        fractions {0.0, 0.25, 0.5, 0.75, 0.9}. NO CURVE, NO GROUP, NO FACTOR BASE
        AND NO SOLVER APPEARS IN THIS ARM.
      - >-
        MONOTONICITY ARM- real attempts from one frozen degree-graded solver
        lineage, each instance run at three increasing budgets with the same seed.
      - >-
        AUDIT ARM- the committed run artifacts of this corpus, inspected for
        per-attempt degree progress. Read-only; no run is executed and no artifact
        is modified.
    parameters:
      theta_true: '0.5, 1.0, 2.0'
      censoring_fraction: '0.0, 0.25, 0.5, 0.75, 0.9'
      replicates: 'at least 200 per (theta, censoring) cell'
      budgets: 'three increasing values per instance for the monotonicity arm, declared before the run'
      event_types: 'completed, censored_time, censored_memory, no_solution - coded distinctly and never pooled'
    implementation: >-
      A standalone estimator harness- a synthetic generator, a binary logistic
      fit and a parametric AFT fit with right censoring, sharing one random-number
      stream and one reporting path. The monotonicity arm calls the frozen solver
      lineage without modifying it. THE SYNTHETIC ARM IMPORTS NO CURVE CODE AT
      ALL and the run record must show that by naming the modules.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 2.0
      maximum_memory_gb: 8
      maximum_runs: 20
  falsification_conditions:
    - >-
      F1. The censored interval is not narrower than the binary one at any
      censoring level on synthetic data with known theta. THE PREMISE FAILS and
      the record is withdrawn rather than re-scoped.
    - >-
      F2. Coverage of the censored interval falls outside [0.92, 0.98] at any
      level. The estimator is mis-specified for this process and no efficiency
      claim may be read from it.
    - >-
      F3. Monotonicity fails for the solver in use. The interval-censoring model
      DOES NOT APPLY to that solver; the record must be restated for it, and the
      failure is a genuine limitation rather than a nuisance.
    - >-
      F4. Adding planted no-solution instances shifts the estimated theta outside
      its interval even when they are coded as a distinct event type. The
      estimator confuses two events and its output is void.
    - >-
      F5. Existing artifacts DO record per-attempt degree progress and a
      re-analysis changes nothing. The instrument was already adequate and this
      record is a null - which is a result and is reported as one.
    - >-
      F6. Everything holds. Then the logging change - one integer per attempt - is
      justified for future degree-graded batteries, and NOTHING ABOUT ELLIPTIC
      CURVES, THE ECDLP OR ANY ICEX INPUT FOLLOWS FROM IT.
  interpretation_limits:
    - >-
      PURELY AN INSTRUMENT RECORD. It changes no claim, produces no attack, and
      cannot make a negative result positive. It can only make an underpowered
      measurement powered.
    - >-
      THE SUFFICIENCY CLAIM IS OUT OF SCOPE AND IS NOT TESTED. The source rests it
      on E2-02, a label that occurs only inside seven IDEA-20260808-prefixed
      proposals and in NO committed ledger record, experiment or knowledge entry;
      and EV-RELN-001 restricts the committed ICEX feed to charged Clopper-Pearson
      p_L, a probability bound rather than a cost exponent. NO RESULT HERE MAY BE
      QUOTED AS SHOWING THAT D_reached CAN REPLACE p_L IN ANY ICEX INPUT.
    - >-
      NO RE-ANALYSIS OF A RELN RUN SET IS POSSIBLE. GOAL-RELN-001 has none-
      EV-RELN-001 carries empty experiment_ids and run_ids and records that no
      decomposition-probability measurement was performed. The audit arm reports
      what exists; it does not manufacture a re-analysis.
    - >-
      THE SYNTHETIC ARM IS CURVE-FREE BY CONSTRUCTION. It is a function of a
      declared power law, a declared censoring rule and a random-number stream.
      That is recorded here as a PROOF rather than discharged by an arm, because a
      curve-free null would be the identical computation. PRE-DECLARED- NO OUTCOME
      OF THE SYNTHETIC ARM IS AN ELLIPTIC-CURVE OR ECDLP STATEMENT.
    - >-
      D_reached depends on implementation as much as on the system, so comparisons
      are valid only within one frozen solver lineage. A cross-lineage comparison
      is inadmissible.
    - >-
      Memory exhaustion is a DIFFERENT censoring mechanism from time exhaustion and
      is coded separately; pooling them is a specification error, and under
      AGENTS.md rule 5 neither is negative mathematical evidence about anything.
    - >-
      If censoring is near-total at the largest covariate value, the fit is
      EXTRAPOLATING and must say so rather than quote an interval. The censoring
      fraction per cell is a mandatory reported quantity for exactly that reason.
    - >-
      This record does not repair any binary-versus-prime-field scope mismatch
      elsewhere in the lane and takes no position on it.
    - >-
      claim_tier toy. No attack, no exponent moved, sota_delta zero on every
      attack axis. On the narrow axis of estimator efficiency for a censored
      monotone observable, right-censored maximum likelihood is the TEXTBOOK
      INCUMBENT and this record is an application of it, not an improvement on it.
