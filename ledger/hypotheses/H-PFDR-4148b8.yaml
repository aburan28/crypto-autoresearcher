hypothesis:
  id: H-PFDR-4148b8
  question_id: RQ-PFDR-ae2fba
  source_idea_id: IDEA-20260903-e1e38b
  title: >-
    The first fall degree of the d = 2 digit-presented Semaev system is a
    closed form in (m, s) alone -- d_ff(m, 2, s) = m 2^{m-1} +
    floor((s - 2^{m-1})/2) + 1 -- curve- and target-independent, reproduced
    exactly by a block-factored random null and strictly below the
    support-matched null, so IDEA-20260830-84cdb7's H1 ('d_ff bounded in s')
    is refuted by derivation and its Outcome 3 exponent stake is closed at
    d = 2
  statement: >-
    SETTING. m >= 2, p > 3, E/F_p non-singular, affine target x_R, the base-2
    digit map of IDEA-20260830-84cdb7 with s digits per unknown (2^s <= p,
    hence p > s), n = ms digit variables, linear forms ell_k = sum_i 2^i
    a_{k,i}, function ring B = F_p[a]/(a^2 - a), squarefree top-form algebra
    A = F_p[a]/(a^2) = A_1 tensor ... tensor A_m. The digit-presented
    generator is S~ = S_{m+1}(ell_1, ..., ell_m, x_R) reduced in B, with top
    form S~_top of degree delta.
    (D1) A degree fall at D in B is exactly a g in A of degree D - delta with
    g S~_top = 0 in A, so d_ff = delta + AI_p(S~) where AI_p is the least
    degree of a nonzero graded annihilator of S~_top (first fall in the
    fall_dim sense of the boolean Macaulay meter, transported to F_p).
    (D2) Dimension counting forces a kernel when binom(n, j) > binom(n,
    j + delta), so d_ff <= D_null(n, delta) = floor((n + delta)/2) + 1, the
    first forced fall of the support-matched null.
    (D3, H-TOP) The top form of S_{m+1}(x, x_R) in x is c prod_k
    x_k^{2^{m-1}}: derived at m = 2 (degree-4 part x_1^2 x_2^2), inferred at
    m = 3 from the archived EXP-ALPF-011 profile [4, 4, 4, 12], a symbolic
    obligation at m >= 3.
    (D4) Under the block-linear substitution S~_top is the tensor product of
    the per-block maps 'multiply by ell_k^e' on A_k with e = 2^{m-1}, and
    ker(M_1 tensor ... tensor M_m) = sum_k (... ker M_k ...), so AI_p(S~) =
    min_k a_0(A_k, ell_k^e) exactly. UNCONDITIONAL upper bound: a_0 <=
    floor((s - e)/2) + 1. EXACTNESS, conditional on Wilson's rank theorem
    (H-WIL): rescaling makes ell_k = sum_i a_i, multiplication by (sum a_i)^e
    from degree j to j + e is e! times the transpose of the inclusion matrix
    W_{j, j+e}, and for p > s every binom(k - i, t - i) is a positive integer
    below p, so the rank is binom(s, j) and a_0 = floor((s - e)/2) + 1
    exactly. HENCE d_ff(m, 2, s) = m 2^{m-1} + floor((s - 2^{m-1})/2) + 1
    for 2^{m-1} <= s, with fall_dim(d_ff) = m [binom(s, a_0) - binom(s,
    a_0 + e)].
    (D5) NUMBERS. m = 2: d_ff = 4 + floor(s/2), D_null = s + 3; s = 2..6
    gives d_ff = 5, 5, 6, 6, 7 against D_null = 5, 6, 7, 8, 9 with
    fall_dim(d_ff) = 4, 4, 10, 10, 28; s = 2 is the boundary cell (no strict
    early fall), s = 3 the first strict one. m = 3 (e = 4, s >= 4): d_ff =
    11 + floor(s/2); s = 4, 5 gives 13, 13 against D_null = 13, 14. The slope
    in s is 1/2 at every m against the null's m/2.
    (D6) Nothing in (D4) uses a, b, x_R or p beyond p > s: the first fall is
    curve- and target-independent; the block-factored null (a random
    degree-e form per digit block, multiplied) reproduces d_ff and fall_dim
    exactly, and the support-matched null falls at D_null.
    (D7) A first fall is not a solving degree, not a cost, not an exponent:
    even under d_solve = d_ff the reduced column count sum_{j <= D}
    binom(ms, j) is about B^{m H(1/(2m))}, sigma >= 1 in the sense of
    IDEA-20260808-812554, so 84cdb7's conditional N^{2/(m+1)+o(1)} stake is
    closed at d = 2 and the residual open object is the solving degree,
    where the curve first enters.
  mechanism: >-
    TRACKED OBJECT: the top-form class S~_top in A_delta, followed through
    the Macaulay computation by g -> g S~_top, equivalently the graded
    annihilator ideal Ann_A(S~_top) and its initial degree AI_p. The
    projection S~ -> S~_top discards every sub-top term, which is exactly
    where the curve coefficients, the target and the digit offsets live; the
    retained part propagates homomorphically under the Macaulay layer
    operation (top of (g S~) equals g_top S~_top in A), so the projection is
    compatible with the target's operation and its horizon is precisely the
    first fall degree. WHY THE DIGIT PRESENTATION: in the direct
    presentation the membership top forms x_k^B and the monomial top form
    give their first non-Koszul syzygy at degree B + 2 > D_null = B + 1 at
    m = 2 (no early fall, consistent with IDEA-20260808-afe4ce's floor); the
    digit map replaces the single power x_k^B by a squarefree block algebra
    in which powers of a LINEAR form have large annihilators, so the early
    fall is bought by the change of algebra, not by the curve. MEASUREMENT:
    per degree D form the F_p rows {mu S~ reduced in B : mu a squarefree
    monomial of degree D - delta}, take rank of the full row space and of
    its top-degree projection; fall_dim(D) = rank_full - rank_top, the
    macaulay.py identity over F_p; predicted fall_dim(D) = 0 for D < d_ff
    and the exact integer m [binom(s, a_0) - binom(s, a_0 + e)] at d_ff.
  assumptions:
    - >-
      d = 2, p > 3, 2^s <= p (hence p > s), s >= 2^{m-1}; for s < 2^{m-1}
      the power ell_k^{2^{m-1}} vanishes in A_k and the closed form does not
      apply (excluded regime, reported as such).
    - >-
      H-TOP holds at the tested m: derived at m = 2; checked symbolically
      at m = 3 before any m = 3 cell is read.
    - >-
      'First fall' is the top-form fall_dim definition; with a single
      non-field generator it coincides with the ALPF leading-form meter's
      'nontrivial(D) > 0' up to the trivial syzygies subtracted, asserted
      at Stage 1, not assumed.
    - >-
      Exact ranks over F_p; no CAS termination event is read as a degree.
    - >-
      The F_p Macaulay meter has passed its p = 2 known answer against
      KN-FIND-006 and the planted-syzygy positive control.
  proof_search_map:
    bottleneck: >-
      The step '84cdb7 Stage 2 measures the slope of d_ff in s'. This
      hypothesis claims the slope is derivable (1/2) and the measured
      quantity curve-blind; replacing a fitted 5-point slope with a two-cell
      exact-integer check changes the lane's plan, not any attack cost.
    baseline_embedding:
      parameter_slice: >-
        s = 1 is excluded (s >= 2^{m-1} is needed); the embedding into the
        direct presentation is through the direct-presentation syzygy
        computation: at m = 2 the top forms (x_1^2 x_2^2, x_1^B, x_2^B) have
        first non-Koszul syzygy at degree B + 2 > D_null = B + 1,
        reproducing IDEA-20260808-afe4ce's 'no early fall'. The digit arm at
        s = 2 (n = 4, d_ff = 5 = D_null) is the boundary cell; s = 3 is the
        first cell with a strict early fall and is the deciding cell.
      reproduction_check: >-
        Symbolic: expand S_3(ell_1, ell_2, x_R) at s = 2 by hand and verify
        the degree-4 part equals ell_1^2 ell_2^2 = 16 a_{1,0} a_{1,1} a_{2,0}
        a_{2,1} in A; verify multiplication by it kills A_1 (degree 5) and
        not A_0. Frozen fixture: the s = 2 and s = 3 cells at m = 2,
        p = 4099, one generic curve, one target, full rank profile
        committed.
    observation_collision:
      observable: >-
        d_ff(m, 2, s) and fall_dim(d_ff), read by the F_p Macaulay meter.
      distinct_preimage_search: >-
        DESIGNED TO SUCCEED, and that is the content: the block-factored
        null is predicted to have identical d_ff and identical fall_dim to
        the Semaev arm at every s, and two different curves or targets at
        the same (m, s) are predicted to collide exactly. The collision is
        the proof that the observable carries no curve information at the
        first fall. The collision that must NOT occur is with the
        support-matched null, predicted at D_null.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the first-fall question into the squarefree algebra A as the
          exact statement ker(mult by S~_top) in degree j, then into the
          tensor decomposition, then into Wilson's inclusion-matrix rank.
          Encoding exact; completeness exact (every fall is a top-form
          annihilator); soundness exact; transfer fails outside d = 2.
        predicted_gain: >-
          Replaces a fitted slope with a closed form and a per-cell exact
          integer fall_dim; converts 84cdb7's 3-outcome ladder into a
          two-cell check.
      - transform: observable_fiber
        proposed_object: >-
          Hold S~_top fixed and vary the discarded structure (curve, target,
          lower digits): d_ff is constant on the fibre; the invariant that
          DOES vary on it is the solving degree, named as the forward
          object.
        predicted_gain: >-
          A closure of the first-fall route for the d = 2 digit presentation
          with a named residual (solving degree).
    quantifier_order: >-
      CLAIMED: FOR ALL m >= 2, FOR ALL p > 3, FOR ALL s with 2^{m-1} <= s and
      2^s <= p, FOR ALL non-singular E/F_p, FOR ALL affine targets, IF H-TOP
      holds at m THEN d_ff(m, 2, s) <= m 2^{m-1} + floor((s - 2^{m-1})/2) + 1
      (unconditional given H-TOP), AND equality holds (conditional on
      Wilson's rank theorem). NOT CLAIMED: anything about d > 2 beyond the
      upper bound, anything about the solving degree, anything at
      s < 2^{m-1}.
    method_ceiling:
      strongest_certifiable_claim: >-
        'The first fall degree of the d = 2 digit presentation is a
        closed-form function of (m, s) alone, verified by exact ranks at
        m = 2, s <= 6 and m = 3, s in {4, 5}, and coincides with that of a
        block-factored random null.' It cannot certify any solving degree,
        any cost, any statement at cryptographic s, or exactness at d > 2.
      nearby_object_control: >-
        MIXED-BLOCK linear map (x_k = sum_i c_{k,i} a_i with the a_i shared
        across k), on which the top form is no longer a tensor product and
        d_ff is predicted to rise toward D_null; a method reporting the
        closed form there is reading the degree profile, not the block
        structure. Second nearby object: a NON-monomial top form of the same
        degree (x_1^2 x_2^2 + x_1^4 at m = 2), for which d_ff is predicted
        between the block value and D_null.
    proof_obligations:
      - claim: >-
          Top form of S_{m+1}(x, x_R) is c prod_k x_k^{2^{m-1}} (derived at
          m = 2, symbolic at m = 3).
        responsibility: correctness
      - claim: >-
          The degree-D part of (g S~) reduced in B equals g_top S~_top in A.
        responsibility: correctness
      - claim: >-
          The kernel of a tensor product of linear maps is the sum of the
          block kernels, hence AI_p = min_k a_0.
        responsibility: correctness
      - claim: >-
          Dimension counting gives a_0 <= floor((s - e)/2) + 1
          unconditionally.
        responsibility: size
      - claim: >-
          Wilson's rank formula with p > s gives full rank, hence a_0 and
          fall_dim exactly.
        responsibility: strictness
      - claim: >-
          The support-matched null falls at D_null and the block-factored
          null at the Semaev value.
        responsibility: interface
      - claim: >-
          No exponent moves; sigma >= 1 even under d_solve = d_ff.
        responsibility: scope
      - claim: >-
          Every Macaulay layer stays within 2^{ms} squarefree columns (4096
          at m = 2, s = 6; 32768 at m = 3, s = 5).
        responsibility: memory
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        H-TOP. For every m >= 2 and every affine target x_R, the top
        homogeneous part of S_{m+1}(x_1, ..., x_m, x_R) in (x_1, ..., x_m) is
        c prod_k x_k^{2^{m-1}} with c a nonzero constant, so
        delta = m 2^{m-1}.
      random_model_justification: >-
        Rigorous at m = 2 by expansion. At m = 3 the archived EXP-ALPF-011
        profile (total degree 12, per-variable degree 4) forces the single
        monomial x_1^4 x_2^4 x_3^4 with nonzero coefficient. The classical
        fact imitated: S_{m+1} is symmetric of degree 2^{m-1} in each
        variable and the resultant recursion multiplies leading
        coefficients, so the top term of the resultant is generically the
        product of the top terms. This is a finite symbolic identity per m,
        not a distributional statement.
      supporting_results:
        - ref: experiments/EXP-ALPF-011/source/round006_exp010_validated_resweep_result.md
          provenance: internal
          claim: >-
            Archived x-ring leading-form profile [4, 4, 4, 12] for S_4 at
            m = 3.
          verified_by: coordinator, TASK-20260903-b5d2ae (as cited in IDEA-20260903-e1e38b; file not reopened)
        - ref: IDEA-20260903-e1e38b
          provenance: internal
          claim: >-
            Claims (D3)-(D5): the m = 2 expansion, the m = 3 inference, the
            closed form and its numbers.
          verified_by: coordinator, TASK-20260903-b5d2ae (record read in full)
      validation_experiment_ids:
        - EXP-PFDR-5726af
      falsification_condition: >-
        A symbolic computation of S_4 (or S_5) with x_R symbolic whose top
        homogeneous part is not the single monomial, or whose coefficient c
        vanishes on a locus of (a, b, x_R); the derivation is then scoped to
        m = 2 and the m >= 3 claims are withdrawn.
    - id: HEUR-002
      formal_statement: >-
        H-WIL. For p > s and 0 <= j, j + e <= s, multiplication by ell^e on
        the squarefree algebra F_p[a_1..a_s]/(a_i^2) from degree j to degree
        j + e has maximal rank min(binom(s, j), binom(s, j + e));
        equivalently the inclusion matrix W_{j, j+e} has full rank mod p.
      random_model_justification: >-
        Wilson (1990), retrieved at snippet level by the proposing session:
        rank_p W_{tk} equals the sum over i <= t with p not dividing
        binom(k - i, t - i) of [binom(v, i) - binom(v, i - 1)]; with v = s <
        p no term is dropped. The classical statement imitated is the strong
        Lefschetz property of the squarefree algebra in characteristic zero,
        made exact in characteristic p > s by the rank formula.
      supporting_results:
        - ref: 'R. M. Wilson, A diagonal form for the incidence matrices of t-subsets vs. k-subsets, European J. Combin. 11 (1990) 609-615'
          provenance: retrieved
          claim: >-
            The diagonal form of W_{tk} with entries binom(k - i, t - i) of
            multiplicity binom(v, i) - binom(v, i - 1) for t <= min(k, v - k),
            hence the rank formula mod p. SNIPPET LEVEL ONLY (WebSearch by
            the idea-generator, 2026-09-03); the paper was not fetched.
            Load-bearing only for exactness; the upper bound does not depend
            on it.
          verified_by: 'idea-generator, TASK-20260903-22c36b lane B, WebSearch snippet 2026-09-03, primary not opened; relayed by coordinator TASK-20260903-b5d2ae'
      validation_experiment_ids:
        - EXP-PFDR-5726af
      falsification_condition: >-
        A direct exact F_p rank of multiplication by ell^2 from degree j to
        j + 2 for some s in {2, ..., 8}, j, p in {4099, 65537} strictly below
        min(binom(s, j), binom(s, j + 2)); exactness is then withdrawn at
        that cell and the closed form becomes an upper bound there.
  structural_ingredients:
    - description: >-
        The tensor-kernel identity ker(M_1 tensor M_2) = ker M_1 tensor A_2
        + A_1 tensor ker M_2 for linear maps over a field, applied to the
        block structure of the digit substitution.
      citation: IDEA-20260903-e1e38b (D4), elementary linear algebra
      provenance: internal
      verified_by: coordinator, TASK-20260903-b5d2ae (record read in full; the identity is elementary and is a Stage 0 obligation)
      role: reduces AI_p to per-block annihilator degrees
    - description: >-
        Wilson's rank formula for inclusion matrices of t-subsets versus
        k-subsets in characteristic p.
      citation: 'R. M. Wilson, European J. Combin. 11 (1990) 609-615'
      provenance: retrieved
      verified_by: 'idea-generator, TASK-20260903-22c36b lane B, snippet level only (2026-09-03)'
      role: exactness of a_0 (strictness)
    - description: >-
        The digit presentation and its support-matched null.
      citation: IDEA-20260830-84cdb7
      provenance: internal
      verified_by: coordinator, TASK-20260903-b5d2ae (record read in full)
      role: the presentation and the null being compared against
  reduction_chain:
    core_problem: >-
      No attack problem is reduced. The core statement is a closed form for
      a generator-level invariant of one presentation, and its consequence
      is a CLOSURE of one conditional stake (84cdb7 Outcome 3 at d = 2), not
      an algorithm.
    corollaries: []
  predictions:
    - metric: >-
        P1 -- d_ff at m = 2, d = 2, s = 3 (deciding cell), exact F_p Macaulay
        ranks, 3 curves x 2 targets, p in {4099, 65537}
      direction: different
      minimum_effect: >-
        FORCED EXACT 5 on the Semaev arm at every (curve, target, p);
        support-matched null predicted at D_null = 6 (semi-regular);
        block-factored null forced 5. Any Semaev cell differing by 1 or more
        refutes (D4) at that cell.
    - metric: >-
        P2 -- fall_dim(d_ff) at the deciding cell
      direction: different
      minimum_effect: >-
        FORCED EXACT 4 (= 2 [binom(3, 1) - binom(3, 3)]) under H-WIL; a
        mismatch of 1 or more refutes exactness at that cell.
    - metric: >-
        P3 -- block-factored null minus Semaev arm, for d_ff and for
        fall_dim, per cell
      direction: different
      minimum_effect: >-
        FORCED 0 at every cell (controlled null with respect to the curve).
        A nonzero value is the most valuable negative for this hypothesis
        and a lead for the RQ.
    - metric: >-
        P4 -- the ladder d_ff at s in {2, 4, 5, 6}, m = 2, if the deciding
        cell passes
      direction: different
      minimum_effect: >-
        FORCED EXACT 5, 6, 6, 7 with fall_dim 4, 10, 10, 28 and null 5, 7,
        8, 9; the gap D_null - d_ff must grow as ceil(s/2) - 1 (the artifact
        tell: a constant gap contradicts the derivation and is an
        instrument issue first).
    - metric: >-
        P5 -- d_ff on the mixed-block nearby object at m = 2, s = 3
      direction: higher
      minimum_effect: >-
        At least 1 above the Semaev value 5; predicted 6 = D_null. If it
        equals 5, the method is reading the degree profile and the
        mechanism claim is withdrawn.
    - metric: >-
        P6 -- d_ff at m = 3, d = 2, s in {4, 5}, p = 65537 (secondary,
        conditional on H-TOP passing symbolically at m = 3)
      direction: different
      minimum_effect: >-
        FORCED EXACT 13, 13 against D_null 13, 14; s = 4 is the boundary
        cell, s = 5 the first strict early fall at m = 3.
  test_boundary:
    instances:
      - >-
        m = 2, d = 2, s = 3 (deciding), s in {2, 4, 5, 6} (ladder); p in
        {4099, 65537}; 3 generic-j curves per p; 2 planted targets per curve
      - >-
        m = 3, d = 2, s in {4, 5}, p = 65537, one curve, two targets
        (secondary, gated on H-TOP at m = 3)
      - >-
        H-WIL direct rank check: s in {2, ..., 8}, all j, p in {4099, 65537}
        (at most binom(8, 4) = 70 rows; curve-free)
    parameters:
      D_max: 'D_null + 1 per cell (at most 10 at m = 2, s = 6; 15 at m = 3, s = 5)'
      column_space: 'squarefree monomials, 2^{ms} columns (64 at the deciding cell)'
      arms: 'Semaev; NULL-1 support-matched; NULL-2 block-factored; NULL-3 curve/target scramble; mixed-block and non-monomial nearby objects'
    implementation: >-
      The F_p port of experiments/EXP-SBRG-60c55e/driver/macaulay.py (rows
      reduced by a^2 = a, coefficients mod p, exact rank over F_p), validated
      on the p = 2 known answer against KN-FIND-006 and the planted-syzygy
      positive control, plus the s = 2 hand fixture; symbolic S_4 for the
      H-TOP check built by resultant from S_3 and checked against the
      archived [4, 4, 4, 12] profile (the harness s4_expr defect of
      KN-OPEN-5b3a08 is not relied on).
    budget:
      wall_clock_seconds_per_run: 1800
      total_cpu_hours: 2
      maximum_memory_gb: 8
      maximum_runs: 10
  falsification_conditions:
    - >-
      F1. P1 fails at the deciding cell: (D4) is wrong there; if measured
      d_ff is BELOW 5 an annihilator not of tensor form exists (the kernel
      identity or H-TOP is wrong); if ABOVE, the block annihilator does not
      produce a fall in B, which (D1) forbids unless the meter is wrong --
      instrument finding first.
    - >-
      F2. P3 nonzero: the Semaev arm differs from the block-factored null,
      so the first fall carries curve or target information at d = 2 -- the
      most valuable negative, re-run at the next s and against NULL-3
      before it is named.
    - >-
      F3. H-TOP fails symbolically at m = 3: the derivation is scoped to
      m = 2 and the m >= 3 predictions are withdrawn, not silently
      re-scoped.
    - >-
      F4. NULL-1 also falls at the Semaev value: the observable is a
      degree-profile property, not a block property; the mechanism claim is
      withdrawn.
    - >-
      F5. The mixed-block nearby object reproduces the closed form: the
      method cannot distinguish block structure from degree profile.
    - >-
      F6 (predicted). P1-P5 hold: 84cdb7's H1 is refuted by
      derivation-plus-check at d = 2, its Outcome 3 stake is closed at
      d = 2, and the forward object is the solving degree (EXP-PFDR-cbdefb's
      last fall degree is the next invariant up).
  interpretation_limits:
    - >-
      A first fall degree is not a solving degree, not a cost, and not an
      exponent; this hypothesis moves nothing on any attack axis.
    - >-
      Exactness is conditional on Wilson's theorem (snippet-level retrieval)
      and on H-TOP at m >= 3; the upper bound is unconditional given H-TOP.
    - >-
      Scoped to d = 2, s >= 2^{m-1}, 2^s <= p, and to the top-form
      first-fall definition; d > 2 carries only the upper bound.
    - >-
      Nothing transfers to cryptographic s; the s <= 6 check tests Wilson's
      rank statement where it is computable, not the digit presentation at
      scale.
    - >-
      Novelty is unverified; the argument may be folklore in the
      Boolean-function literature.
