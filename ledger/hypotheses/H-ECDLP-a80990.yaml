hypothesis:
  id: H-ECDLP-a80990
  question_id: RQ-SIG-001

  statement: >-
    SCOPE: the SIG lane s syzygy cascade statistic, one curve family, summation
    arity as run by the lane, degrees D in {3, 4} only. CLAIM TIER toy.
    NO ATTACK, NO EXPONENT, NO STATUS CHANGE TO H-SIG-001 OR ANY OTHER RECORD.
    Syzygy modules are properties of a chosen generating set, not of the ideal
    alone. The claim under test is that the lane s cascade statistic is a
    PRESENTATION artifact - that it moves under a randomised invertible change of
    generating set which provably preserves the ideal, by more than the movement
    of a matched curve-free random system under the identical operation. The
    complementary outcome, survival under every re-presentation, is a genuine
    ideal-level robustness result the lane does not currently have and would put
    its exploitability question on much firmer ground.
    THIS IS A WELL-DEFINEDNESS GATE, NOT AN EXPLOITABILITY TEST. Survival is
    necessary and nowhere near sufficient for exploitability, and the record
    claims nothing about the latter.

  mechanism: >-
    Construct at least three generating sets for the SAME decomposition ideal -
    the standard Semaev generators, a randomised invertible basis change, and a
    set derived from a different elimination order - and prove they generate one
    ideal by comparing reduced Groebner bases before any statistic is read. Then
    measure the cascade statistic under each, paired per curve, and report where
    it moves and which operation moved it.
    THE FIRST GATE IS WHETHER THE QUESTION IS EVEN WELL POSED, AND IT IS CHEAP.
    If the lane s cascade statistic is computed from the ideal s MINIMAL FREE
    RESOLUTION rather than from the chosen presentation s syzygy module, then it
    is a graded Betti number of the ideal, it is invariant by construction, the
    permutation and basis-change nulls both have width exactly zero, and the
    experiment can never fire in either direction. That is a degenerate
    discriminator and it is the single likeliest way for this record to be worth
    nothing. Stage 0 therefore reads the statistic s implementation and declares
    which object it computes, BEFORE any curve is drawn, and the run stops with a
    reported finding if the answer is the resolution.
    WHY A CURVE-FREE ARM IS MANDATORY HERE. Any system of the same shape - the
    same variable count, degree sequence and sparsity - has a syzygy module that
    also moves under a random basis change, for reasons that have nothing to do
    with elliptic curves. Without measuring that movement the lane cannot tell a
    curve-specific dissolution from generic algebra.

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Null deliberately. No algorithm, no complexity claim, no exponent. Compute
    cost is three Groebner computations per curve where the lane presently runs
    one, plus the reduced-basis equality checks.

  rerandomization: null

  proof_search_map:
    bottleneck: >-
      The step that turns a syzygy computation into a claim about the
      decomposition variety. Every exploitability argument the lane can make
      passes through it, and it is load-bearing only if the statistic is a
      property of the ideal rather than of the generators that were written down.
    baseline_embedding:
      parameter_slice: >-
        The identity change of generators, where the new presentation is the old
        one. The statistic must be bit-identical. This is the degenerate slice
        the implementation must reproduce before any nontrivial re-presentation
        is trusted.
      reproduction_check: >-
        Symbolic and exact - identical presentation gives identical statistic and
        an identical reduced Groebner basis hash. Failure here is an
        implementation defect, not a mathematical finding.
    observation_collision:
      observable: >-
        The cascade statistic at a given degree.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, and its success is the record s point.
        Exhibit two objects with the same cascade statistic and opposite standing
        - the Semaev system under its standard generators, and a curve-free
        matched-shape random system under a basis change tuned to land on the
        same value. If the observable cannot separate them, the statistic alone
        does not carry a curve claim, and the claim must be carried by the PAIR
        of the statistic and its movement under re-presentation. The design
        records both.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the presentation-level cascade statistic with the graded Betti
          numbers of the ideal s minimal free resolution, which are invariants,
          wherever they are computable at the tested degrees.
        predicted_gain: >-
          A statistic that cannot be an artifact of generator choice, at the cost
          of a more expensive computation. If it is affordable at D in {3, 4},
          the lane s question becomes well posed by construction.
      - transform: observable_fiber
        proposed_object: >-
          Hold the ideal fixed and vary the presentation, recording the fibre of
          statistic values a single ideal can produce. Its WIDTH is the quantity
          that decides whether any single-presentation cascade number in the
          corpus means anything.
        predicted_gain: >-
          Converts the lane s existing cascade numbers from point values into
          values with a presentation-induced spread, which is a strictly more
          honest reading of measurements already committed.
    quantifier_order: >-
      CLAIMED - FOR ALL curves in the tested family, FOR ALL pairs of the three
      constructed presentations that are PROVED to generate the same ideal, the
      paired difference of the cascade statistic exceeds the matched curve-free
      system s difference under the identical operation. NOT CLAIMED - anything
      about presentations not constructed here, about degrees above 4, or about
      exploitability under any presentation.
    method_ceiling:
      strongest_certifiable_claim: >-
        That at the tested curves and degrees, the lane s cascade statistic does
        or does not move under a specific set of ideal-preserving
        re-presentations by more than a matched curve-free system does. It can
        never certify that the cascade is exploitable, that it is a variety
        invariant, or that it behaves the same way at D at or above 6.
      nearby_object_control: >-
        THE CURVE-FREE MATCHED-SHAPE RANDOM SYSTEM, put through the identical
        three re-presentations. It is the object on which the conclusion "the
        cascade is curve structure" is KNOWN FALSE, because it has no curve in
        it. A pipeline that reports the same dissolution signature on it has not
        identified anything about elliptic curves.
    proof_obligations:
      - claim: The three presentations generate one ideal.
        responsibility: correctness
      - claim: The statistic is invariant under generator permutation.
        responsibility: baseline
      - claim: >-
          The statistic as implemented is a function of the presentation, not of
          the minimal free resolution.
        responsibility: interface
      - claim: >-
          A planted syzygy of known multiplicity moves the statistic by the
          predicted amount.
        responsibility: feasibility
      - claim: >-
          Nothing transfers to D at or above 6, to other curve families, or to
          exploitability.
        responsibility: scope
    not_applicable_reason: null

  assumptions:
    - >-
      Ideal equality across presentations is checkable at D in {3, 4} by reduced
      Groebner basis comparison within budget. If a reduced basis is not
      computable for a presentation, equality is UNVERIFIED and every comparison
      involving that presentation is inadmissible - not merely caveated.
    - >-
      The cascade statistic is computable from an arbitrary generating set. If it
      is defined only for the standard Semaev generators, the record s question
      is answered trivially and negatively at Stage 0, and that answer is the
      deliverable.
    - >-
      A randomised invertible basis change raises generator degrees. The degree
      profile of every presentation is a required reported quantity, because a
      statistic that moves for degree reasons is not a statistic that moves for
      structural reasons.

  heuristic_assumptions:
    - id: HEUR-PRES-1
      formal_statement: >-
        If the cascade statistic reflects structure of the decomposition variety
        rather than of the chosen generators, then it is invariant under every
        invertible change of generating set that preserves the ideal, up to the
        run-to-run spread of the statistic under generator permutation.
      random_model_justification: >-
        The rigorous ingredient is that the ideal and its variety are unchanged
        by a change of generators, and that graded Betti numbers of the IDEAL are
        invariants of the ideal. THE GAP, WHICH IS LARGE AND IS THE REASON THIS
        IS A HEURISTIC - the statistic as the lane defines it may be a property
        of the chosen presentation s syzygy module, which is NOT an invariant, in
        which case non-invariance is expected and the negative outcome is simply
        correct rather than informative. Stage 0 exists to tell those two cases
        apart before any compute is spent.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-661f07]
      falsification_condition: >-
        Movement of the statistic under a basis change that is PROVED by reduced
        Groebner basis comparison to preserve the ideal, exceeding both the
        permutation spread and the matched curve-free system s movement.

  structural_ingredients:
    - description: >-
        The SIG lane s declared instrumented object and its decision target -
        whether the T2 syzygy family is rewritable/Koszul or contains a growing
        non-rewritable low-degree component.
      citation: ledger/RQ-SIG-001.yaml
      provenance: internal
      verified_by: >-
        coordinator subagent under TASK-20260904-c0edda, 2026-09-04, read
        ledger/RQ-SIG-001.yaml in full (33 lines). Its constraint that the
        instrumented object is #G* / NS(Syz) / signatures and NOT the normal()
        proxy is quoted from that file.
      role: defines the statistic whose well-definedness is under test
    - description: >-
        Generator-dependence of syzygy modules, and invariance of the graded
        Betti numbers of a minimal free resolution.
      citation: >-
        Standard commutative algebra. NO SPECIFIC TEXT WAS OPENED for this
        record; the statement is reproduced so a reviewer can check it without a
        library.
      provenance: recalled
      verified_by: null
      role: the algebraic fact the whole gate rests on
    - description: >-
        The lane s existing single-presentation cascade measurements, whose
        reading this record would change in either direction.
      citation: >-
        Taken from IDEA-20260815-6aa3e3 and from RQ-SIG-001 s motivation text.
        THE UNDERLYING RUN AND EVIDENCE RECORDS WERE NOT OPENED BY THIS AGENT,
        so the numeric values of those measurements are not asserted here and
        must be resolved from committed artifacts at Stage 0.
      provenance: internal
      verified_by: >-
        coordinator subagent under TASK-20260904-c0edda, 2026-09-04 - read
        ledger/RQ-SIG-001.yaml and ledger/proposals/IDEA-20260815-6aa3e3.yaml
        only. The characterisation is taken from those two records and is NOT an
        independent reading of the underlying runs.
      role: the incumbent measurement whose presentation-dependence is tested

  predictions:
    - metric: >-
        P1 - Stage 0 declaration of which object the implemented statistic
        computes (chosen presentation s syzygy module, or the ideal s minimal
        free resolution)
      direction: different
      minimum_effect: >-
        A binary declaration with the code path cited. IF IT IS THE MINIMAL FREE
        RESOLUTION, every null in this design has width exactly zero, the
        experiment can never fire, and the run STOPS and reports that as the
        finding. This gate exists because a null that cannot differ from the
        treatment teaches nothing.
    - metric: >-
        P2 - ideal equality across all pairs of the three presentations, by
        reduced Groebner basis comparison
      direction: different
      minimum_effect: >-
        FORCED EQUAL for every pair, by exact basis comparison. A single failure
        voids every comparison involving that presentation.
    - metric: >-
        P3 - cascade statistic under generator permutation, at least 5
        permutations per curve
      direction: different
      minimum_effect: >-
        FORCED UNCHANGED, spread exactly 0. Any movement is a defect in the
        statistic and, if it occurs, the lane s existing cascade numbers are
        suspect and that is the headline.
    - metric: >-
        P4 - PLANTED SYZYGY dynamic range - a syzygy of known multiplicity r
        injected into a curve-free random system, r swept over {1, 2, 4, 8}
      direction: higher
      minimum_effect: >-
        The measured statistic must rise MONOTONICALLY in r and must match the
        pre-computed predicted rise at every r within the permutation spread. A
        statistic that fires only at one planted size has no demonstrated
        dynamic range and cannot support the absence of a cascade.
    - metric: >-
        P5 - paired per-curve movement of the cascade statistic under randomised
        invertible basis change, in units of the statistic (integer count of
        syzygy generators at the measured degree)
      direction: different
      minimum_effect: >-
        DISSOLUTION is declared if the movement exceeds the maximum of the
        permutation spread and the curve-free arm s movement, on at least 3 of 5
        curves. SURVIVAL is declared if the movement is within the permutation
        spread on at least 4 of 5. The band between is pre-declared
        INCONCLUSIVE.
    - metric: >-
        P6 - CURVE-FREE ARM - movement of the same statistic on a matched-shape
        random system under the identical three re-presentations
      direction: different
      minimum_effect: >-
        No direction pre-committed and this is the record s scope gate. IF THE
        CURVE-FREE ARM REPRODUCES THE SEMAEV ARM S MOVEMENT SIGNATURE WITHIN ITS
        SPREAD, nothing from this experiment may be quoted as a statement about
        elliptic curves or the ECDLP - the finding is then about syzygies of
        systems of that shape and must be reported under that scope.

  test_boundary:
    instances: >-
      One curve family from the SIG lane s declared panel, at least 5 curves, at
      D in {3, 4}; three presentations per curve; a matched-shape curve-free
      random system arm at the identical shapes.
    parameters:
      degrees: [3, 4]
      curves: 5
      presentations: [standard_semaev, randomised_invertible_basis, alternate_elimination_order]
      permutations_per_curve: 5
      planted_syzygy_multiplicities: [1, 2, 4, 8]
    implementation: >-
      The lane s existing Groebner and syzygy instrumentation, extended with a
      presentation constructor and a reduced-basis equality checker. The
      curve-free arm reuses the same code path with a random generator source.
    budget:
      wall_clock_seconds_per_run: 3600
      maximum_memory_gb: 8
      maximum_runs: 200

  falsification_conditions:
    - >-
      F1 - the implemented statistic is a minimal-free-resolution invariant. The
      question is malformed as posed, every null has width zero, and the run
      stops at Stage 0 with that as its reported result.
    - >-
      F2 - presentations do not generate the same ideal. Comparison void; the
      construction must be repaired before anything is read.
    - >-
      F3 - the statistic moves under permutation. The statistic is buggy and no
      cascade number in the lane is admissible until it is fixed.
    - >-
      F4 - the planted syzygy does not move the statistic monotonically in r. The
      instrument cannot see a defect it was told about, so its silence about a
      cascade means nothing and no negative may be reported.
    - >-
      F5 - the cascade dissolves under randomised basis change beyond the
      curve-free arm s movement. It is a presentation artifact at the tested
      degrees and is not exploitable there.
    - >-
      F6 - the cascade survives every re-presentation within permutation spread.
      It is ideal-level structure at the tested degrees and the lane s
      exploitability question stands on firmer ground.
    - >-
      F7 - the curve-free arm reproduces the signature. Scope collapses to
      systems of that shape and no elliptic-curve statement may be made.

  interpretation_limits:
    - >-
      CLAIM TIER toy. Scoped to the tested curves, D in {3, 4}, three
      presentations, one solver and one monomial-order convention.
    - >-
      Tests WELL-DEFINEDNESS, not exploitability. Survival is necessary and not
      sufficient, and a survival result may not be described as evidence that the
      cascade is usable.
    - >-
      NOT TESTABLE AT REACHABLE SCALE, STATED PLAINLY. The lane s live question
      is the cascade s behaviour at D at or above 6, and this record cannot reach
      those degrees within any budget it can be given. A verdict at D in {3, 4}
      does not transfer upward, and the record does not shrink its claim to
      pretend otherwise - it says the higher-degree question stays open.
    - >-
      A dissolution closes exploitability for the tested presentations only,
      although a dissolution under a mere basis change is strong evidence about
      the statistic itself.
    - >-
      Changes no status. Any consequence for H-SIG-001 or GOAL-SIG-001 is a
      Coordinator decision made elsewhere on committed evidence.

  status: proposed
  proposed_by: coordinator

  source_refs:
    - ledger/proposals/IDEA-20260815-6aa3e3.yaml
    - ledger/RQ-SIG-001.yaml
    - ledger/handoffs/TASK-20260904-c0edda.yaml
    - docs/inventor-protocol.md
    - templates/research-records.md

  authoring_note: >-
    Written under TASK-20260904-c0edda (DESIGN ONLY) from IDEA-20260815-6aa3e3.
    RQ-SIG-001 was read in full before its characterisation was adopted. The
    source idea did not contain the Stage 0 degeneracy gate (P1) or the planted-
    syzygy dynamic-range arm (P4); both are added because a null of width zero
    and a control with no demonstrated dynamic range are the two failure modes
    this batch is required to prevent.
