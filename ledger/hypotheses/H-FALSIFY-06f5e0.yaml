hypothesis:
  id: H-FALSIFY-06f5e0
  question_id: RQ-FALSIFY-a2c501
  added: '2026-08-25'
  derived_from_idea: IDEA-20260815-80db36
  status: proposed
  proposed_by: coordinator

  statement: >-
    SCOPE. Every EXECUTED ECC experiment in this repository that cites an
    originating proposal, audited against the falsification_conditions that
    proposal declared, using the experiment's own declared metric list as the
    evidence of what it could have detected. This is a PROCESS audit of this
    corpus. It establishes nothing mathematical, and no outcome of it is evidence
    about any cryptographic question.
    THE CLAIM. A SUBSTANTIAL SHARE of declared falsifiers - operationalised as at
    least 30 percent of auditable falsifier-experiment pairs - were UNCOVERED, i.e.
    the executed experiment's declared metrics could not have detected the
    condition its originating proposal declared would falsify it. If so, the
    program's negatives are weaker than their form suggests, because an experiment
    that runs without testing its proposal's declared falsifiers is not a test of
    that proposal whatever it reports.
    THE CLAIM CAN FAIL, AND ITS FAILURE IS WORTH ESTABLISHING. If most falsifiers
    are covered - under 15 percent uncovered - the falsifiability discipline is
    OPERATIVE, which this program currently assumes without ever having checked.
    Between 15 and 30 percent is a declared INCONCLUSIVE band, fixed before any
    audit, so the audit cannot be read as confirming whatever it happens to find.
    A THIRD OUTCOME IS TREATED AS FIRST-CLASS AND NOT FOLDED INTO EITHER. A
    falsifier that is UNTESTABLE AS DECLARED - one requiring a measurement nobody
    could have made - is flagged as untestable, never scored as uncovered. Many
    untestable falsifiers would be a different and equally serious process finding -
    proposals writing falsifiers that cannot be tested - and conflating the two
    categories would hide it.

  mechanism: >-
    Every proposal in this program declares falsification_conditions. A falsifier is
    a condition on measurable quantities, so DETECTING it requires the experiment to
    have measured those quantities, which is checkable from the experiment's
    declared metric list. For each executed ECC experiment, retrieve its originating
    proposal's falsification_conditions VERBATIM - so the audit cannot substitute an
    easier condition - and judge, per falsifier, whether the experiment's declared
    metrics could have detected it.
    The mechanism's own weak point is named rather than hidden. A falsifier can
    sometimes be detected INDIRECTLY through a metric it does not name, so a purely
    syntactic match understates coverage; and a vaguely stated falsifier can be read
    as covered by almost any metric, which overstates it. The audit therefore
    requires JUDGEMENT, and the design's central instrument is not the judgement but
    the measurement of whether that judgement is stable - a blind second
    adjudication of a random subsample, scored by Cohen's kappa. An audit whose own
    inter-rater agreement is poor cannot support a coverage number in either
    direction, and that is a stopping condition rather than a caveat.
    Two further categories must be kept separate from uncovered. SCOPE EVOLUTION - an
    experiment's contract may legitimately NARROW a proposal's scope, in which case
    an uncovered falsifier is out of scope rather than untested. And EXPERIMENTS
    CITING NO ORIGINATING PROPOSAL, which cannot be audited at all and are the key
    category precisely because they are invisible to the audit.

  assumptions:
  - >-
    Experiments cite originating proposals identifiably. Those that do not are
    REPORTED as a distinct count rather than assumed sound. The parent proposal's
    honest prior is 0.7 that citation is identifiable.
  - >-
    Falsifiers are stated concretely enough to check against declared metrics. Vague
    falsifiers are the audit's second key category and are recorded with the specific
    metric matched and the judgement made.
  - >-
    An experiment's DECLARED metric list is a fair proxy for what it could have
    detected. This is HEUR-FALSIFY-1 and it is the audit's load-bearing assumption;
    it is tested by the untestable-falsifier null and by the blind re-adjudication.

  proof_search_map:
    not_applicable_reason: >-
      A process audit of this corpus. No theorem, asymptotic bound, algorithm,
      reduction or closure argument is proposed, and no mathematical object is
      measured. The KN-TECH-080 audits have nothing to bind. NOTE that this audit
      could CHANGE how proof-oriented work is reviewed here - if falsifier coverage
      is poor, the program's existing negatives need re-reading - but that
      consequence is a Coordinator decision downstream of the measurement and is not
      a claim of this hypothesis.
    bottleneck: null
    baseline_embedding:
      parameter_slice: null
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms: []
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations: []

  asymptotic_claim: null

  heuristic_assumptions:
  - id: HEUR-FALSIFY-1
    formal_statement: >-
      An experiment's declared metrics determine which of its originating proposal's
      falsifiers it could have detected - i.e. for every falsifier F and experiment
      E, F is detectable by E if and only if F is a condition on quantities in E's
      declared metric list.
    random_model_justification: >-
      Not a distributional assumption. RIGOROUS INGREDIENT - a falsifier is a
      condition on measurable quantities, so detection requires the experiment to
      measure those quantities, which is checkable from the declared metric list.
      THE GAP, stated in the parent proposal and carried here - a falsifier can
      sometimes be detected indirectly through a metric it does not name, so a purely
      syntactic match understates coverage, and the audit needs judgement it must
      RECORD rather than a mechanical rule.
    supporting_results: []
    validation_experiment_ids:
    - EXP-FALSIFY-07dcc1
    falsification_condition: >-
      A falsifier scored uncovered that a blind second adjudicator judges the
      experiment could in fact have detected. The rate of such disagreements is
      measured directly as the blind re-adjudication's disagreement rate, and a
      Cohen's kappa below 0.6 on the resampled subset means the coverage numbers are
      not reproducible and no percentage may be quoted from them in either direction.

  structural_ingredients:
  - description: >-
      The program's own falsifiability requirement - every proposal declares
      falsification_conditions, and every experiment contract declares metrics and a
      falsification_criterion.
    citation: docs/inventor-protocol.md and templates/research-records.md
    provenance: internal
    verified_by: In-repo contract documents, read directly.
    role: the source of both the falsifier list and the metric list
  - description: >-
      Cohen's kappa as the inter-rater agreement statistic for a categorical
      four-way verdict.
    citation: null
    provenance: recalled
    verified_by: >-
      Standard and elementary; its formula is written from the definition in the
      contract's implementation and is checked against a hand-computed example
      before use. Not an appeal to any citation.
    role: measures whether the audit's judgement is stable enough to support a number

  reduction_chain:
    core_problem: null
    corollaries: []

  predictions:
  - metric: clean-experiment null verdict
    direction: different
    minimum_effect: >-
      FORCED clean. An experiment chosen because it demonstrably tests its own
      falsifiers must audit with zero uncovered falsifiers. A flag there means the
      criterion is too strict and every uncovered count is inflated.
  - metric: untestable-falsifier null verdict
    direction: different
    minimum_effect: >-
      FORCED flagged as untestable rather than scored uncovered, since the two mean
      different things. If the instrument scores it uncovered, the two categories are
      not separated and the headline number conflates them.
  - metric: per-falsifier coverage across executed ECC experiments
    direction: different
    minimum_effect: >-
      The deliverable. At least 30 percent uncovered supports the claim; under 15
      percent refutes it; between the two is the declared inconclusive band. All three
      thresholds are fixed before any experiment is read.
  - metric: count of executed experiments citing no originating proposal
    direction: different
    minimum_effect: >-
      Reported separately as a raw count and as a fraction of executed ECC
      experiments. These cannot be audited at all and are the key category.
  - metric: Cohen's kappa between the primary audit and a blind re-adjudication
    direction: higher
    minimum_effect: >-
      At least 0.6 on a randomly sampled 20 percent of auditable pairs. Below that the
      coverage numbers are not reproducible and no percentage may be quoted.

  test_boundary:
    instances:
    - >-
      ALL executed ECC experiments in this repository - i.e. those with at least one
      completed run record under experiments/<EXP-ID>/runs/ - together with their
      originating proposals where identifiable.
    - >-
      NULL 1 - an experiment selected in advance as demonstrably testing its own
      falsifiers, which must audit clean.
    - >-
      NULL 2 - a falsifier that is untestable by construction, e.g. one requiring a
      measurement no available instrument produces, which must be flagged rather than
      scored uncovered.
    parameters:
      verdict_categories: 'covered, uncovered, untestable_as_declared, out_of_scope_by_contract'
      thresholds: 'uncovered fraction at least 0.30 supports; at most 0.15 refutes; between is inconclusive; all fixed before any experiment is read'
      reliability: 'Cohen kappa at least 0.6 on a random 20 percent blind re-adjudication'
      exclusions: 'non-ECC areas; experiments with no completed run; proposals whose falsification_conditions field is absent, which are counted separately'
    implementation: >-
      Mechanical retrieval of falsification_conditions VERBATIM from the originating
      proposal and of the metric list from the experiment specification, followed by a
      recorded per-pair judgement, followed by an independent blind re-adjudication of
      a random subsample by an agent that has not seen the first verdicts.
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 1.0
      maximum_memory_gb: 4

  distinguishable_outcomes:
  - outcome: >-
      At least 30 percent of auditable falsifier-experiment pairs are UNCOVERED, both
      nulls behave, and kappa is at least 0.6.
    means: >-
      Experiments are running without testing what their proposals declared. The
      program's negatives are weaker than their form suggests - each affected
      experiment is not a test of its proposal in that respect - and the affected
      records need re-reading. This is the finding with the widest consequences and it
      changes how future contracts must be gated.
  - outcome: >-
      At most 15 percent uncovered, both nulls behave, and kappa is at least 0.6.
    means: >-
      The falsifiability discipline is OPERATIVE rather than ceremonial. This claim is
      FALSE, and establishing that is worth having, because the program currently
      assumes it without evidence. The audit becomes a baseline that a future audit can
      be compared against.
  - outcome: >-
      Between 15 and 30 percent uncovered.
    means: >-
      INCONCLUSIVE by pre-declaration. The audit does not discriminate between an
      operative and a ceremonial discipline at this resolution, and the correct report
      says so rather than picking the nearer threshold.
  - outcome: >-
      A large share of falsifiers is flagged UNTESTABLE AS DECLARED.
    means: >-
      Proposals are writing falsifiers that cannot be tested. This is a DIFFERENT and
      equally serious process finding from uncovered falsifiers, it implicates the
      ideation stage rather than the execution stage, and it must be reported
      separately rather than merged into either verdict.
  - outcome: >-
      Either null misbehaves - the clean experiment is flagged, or the
      untestable-by-construction falsifier is scored uncovered.
    means: >-
      The criterion is miscalibrated. No coverage number may be quoted in either
      direction and the deliverable is the miscalibration itself.
  - outcome: >-
      Cohen's kappa below 0.6 on the blind re-adjudication.
    means: >-
      The audit's own judgements are not reproducible. HEUR-FALSIFY-1 is not
      operationalisable at this level of rigour, no percentage may be quoted, and the
      deliverable is that the audit as specified cannot be made reliable - which is
      itself a process finding about auditability.
  - outcome: >-
      A large share of executed ECC experiments cite no identifiable originating
      proposal.
    means: >-
      Those experiments cannot be audited at all. The count is reported separately and
      it BOUNDS what any coverage percentage can claim about the corpus, since the
      audited subset is not the corpus.

  falsification_conditions:
  - >-
    At most 15 percent of auditable falsifier-experiment pairs are uncovered, with
    both nulls behaving and kappa at least 0.6. The falsifiability discipline is
    operative and this claim is false.
  - >-
    Either null misbehaves - a clean experiment is flagged, or an untestable-by-
    construction falsifier is scored uncovered. The criterion is miscalibrated and no
    coverage number is admissible.
  - >-
    Cohen's kappa is below 0.6 on the blind re-adjudication. The coverage numbers are
    not reproducible and no percentage may be quoted.
  - >-
    Fewer than 10 auditable falsifier-experiment pairs exist. The audit has no power
    at any threshold and reports UNREADABLE rather than a percentage.

  prior_evidence_refs:
  - RQ-FALSIFY-a2c501
  - RQ-ECDLP-002
  - KN-TECH-056
  - KN-TECH-080

  interpretation_limits:
  - >-
    Audits PROCESS. Establishes nothing mathematical and is not evidence about any
    cryptographic question.
  - >-
    Scoped to executed ECC experiments citing identifiable originating proposals.
    Experiments without one are counted but not audited, and the audited subset is not
    the corpus.
  - >-
    An UNCOVERED falsifier means the experiment did not test that condition. It does
    NOT mean the proposal is wrong, that the experiment's result is wrong, or that the
    conclusion drawn from it is wrong - only that the conclusion is not supported in
    that respect by that experiment.
  - >-
    The audit's judgements are judgements. Their reliability is measured by kappa and
    is reported alongside every coverage number; a coverage number quoted without its
    kappa is a misuse of this record.
  - >-
    A falsifier out of scope by contract is not a defect. An experiment may
    legitimately narrow a proposal's scope, and conflating narrowing with omission
    would manufacture a finding.
