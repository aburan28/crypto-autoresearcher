hypothesis:
  id: H-MLKEM-011
  question_id: RQ-MLKEM-003
  goal_id: GOAL-MLKEM-003
  title: >-
    Carrier Fig 4.1 Pwrong experiments do not cover the Pgood≈1/2 threshold
  statement: >-
    In the authors' archived Fig 4.1 left-panel simulation outputs
    (q=241,m=40,n=43,N≈25971), every recorded Pgood score lies strictly above
    the maximum T at which empirical Pwrong is positive, so the operating
    threshold with Pgood≈1/2 is outside the experimentally measured Pwrong
    T-range; furthermore the Kyber-512 CC Table C.2 log2(Pwrong)=−119.57 lies
    at least 80 bits below the deepest positive toy Pwrong mass (≈−36).
  mechanism: >-
    Approximation 4.9 / ε = R·q^{kfft}·Pwrong is backed in the paper by Fig 4.1
    simulations. If those simulations never measure Pwrong at the T where
    Pgood≈1/2, then the experimental pillar does not cover the threshold used
    in the cost table — a scope gap distinct from table-arithmetic errors.
  assumptions:
    - Archived CodedDualAttack verifyModel .out files are the Fig 4.1 artifacts.
    - Pwrong line i is P(F≥i) and Pgood values are scores F(solution) on the same scale.
  asymptotic_claim: null
  predictions:
    - metric: fraction_Pgood_inside_Pwrong_T_range
      direction: lower
      minimum_effect: equals_0
    - metric: log2_extrapolation_Kyber512_vs_toy_floor
      direction: lower
      minimum_effect: at_most_-80
  falsification_conditions:
    - fraction_Pgood_inside_Pwrong_T_range > 0.5 on the archived left-panel files
    - Pwrong and Pgood are shown to use incommensurate score normalizations
  interpretation_limits:
    - Does not by itself falsify Approx 4.9; it bounds what Fig 4.1 empirically covers.
    - Not a cryptanalytic break of ML-KEM.
  status: analyzed
  proposed_by: coordinator
  approved_by: coordinator
  approved_at: '2026-07-31'
  evidence_ids: [EV-MLKEM-011]
