# H-GFPN-d48ae1
# Side-dichotomy lemma of IDEA-20261004-31991f on y^2 = x^3 + x.
# Curve-point contract. The integer slice H-GFPN-d3c9a1 is a different record.
hypothesis:
  id: H-GFPN-d48ae1
  question_id: RQ-GFPN-c01af8
  goal_id: GOAL-GFPN-380702
  source_idea: IDEA-20261004-31991f
  experiment_id: EXP-GFPN-8da8d4
  specified_at: '2026-10-05'
  status: approved
  proposed_by: coordinator
  approved_by_decision: DEC-20261005-165cdc
  title: >-
    On y^2 = x^3 + x, every F_p-rational sum of two factor-base points
    has its side-1 subsum in the rational 2-torsion
  statement: >-
    Let p be in {7, 11, 19} and let E be y^2 = x^3 + x over F_p.
    For x in F_p with f(x) = x^3 + x nonzero, the side is 0 when
    f(x) is a square in F_p and 1 otherwise. A design-session
    partition, which is not a run, is
    p=7 roots {0}, side 0 {1, 3, 5}, side 1 {2, 4, 6};
    p=11 roots {0}, side 0 {5, 7, 8, 9, 10}, side 1 {1, 2, 3, 4, 6};
    p=19 roots {0}, side 0 {3, 4, 5, 8, 9, 12, 13, 17, 18},
    side 1 {1, 2, 6, 7, 10, 11, 14, 15, 16}.
    Take every ordered pair of affine points whose x-coordinates
    lie in those side sets, with both square roots of f(x) in
    F_{p^2}. Whenever the sum lies in E(F_p), including the point
    at infinity, the sum of the side-1 points in the pair is the
    identity or (0, 0). The same design session counted 48, 120,
    and 360 such sums, and 0 failures of that torsion condition.
  mechanism: >-
    The nontrivial Galois element of F_{p^2}/F_p fixes a side-0
    point and negates a side-1 point. Subtracting a sum relation
    from its conjugate forces twice the side-1 subsum to be zero.
    On this model the only F_p-rational 2-torsion points are the
    identity and (0, 0). The experiment evaluates every pair by
    two addition laws and counts violations.
  assumptions:
    - n = 1, so K = F_p and the factor base is F_p.
    - Points with f(x) = 0 are excluded from the pairs.
    - A sum is F_p-rational when it is infinity or both coordinates lie in F_p.
    - F_{p^2} = F_p[i]/(i^2+1).
  proof_search_map:
    bottleneck: >-
      Whether a side-1 subsum of an F_p-rational pair sum can escape
      {identity, (0, 0)}.
    baseline_embedding:
      parameter_slice: >-
        Lemma (L) of IDEA-20261004-31991f at n = 1, m = 2, on
        y^2 = x^3 + x. This slice does not run Gaudry descent.
      reproduction_check: >-
        Affine slope addition and Jacobian addition must agree on
        the side sets, the rational-sum counts, and the violation
        count. The design-session counts are recomputed. They are
        not a run.
    observation_collision:
      observable: >-
        The side of each x, the sum of each pair, and the side-1 subsum.
      distinct_preimage_search: >-
        A pair with exactly one side-1 point cannot have that point
        equal to (0, 0), so such a pair is predicted never to sum
        into E(F_p).
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: the side bit
        predicted_gain: >-
          Classifies pair sums. No change to a Gaudry exponent.
    quantifier_order: >-
      For each fixed prime, enumerate every allowed x, then both
      square roots, then every ordered pair, then test the sum.
    method_ceiling:
      strongest_certifiable_claim: >-
        The torsion condition on this model at these three primes.
        Not a cost for EcMasFp5 and not a descent yield at n > 1.
      nearby_object_control: >-
        Pairs of two side-0 points. Their side-1 subsum is the
        identity, which satisfies the condition.
    proof_obligations:
      - claim: The side partition matches the pre-registered sets
        responsibility: size
      - claim: Every F_p-rational pair sum has side-1 subsum in the rational 2-torsion
        responsibility: correctness
      - claim: The condition is checked on 48, 120, and 360 sums
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        A zero violation count at these primes supports the lemma
        only on y^2 = x^3 + x at n = 1. It does not price Gaudry
        at larger n.
      random_model_justification: >-
        The pairs are enumerated in full. There is no sampling model.
      supporting_results: []
      validation_experiment_ids:
        - EXP-GFPN-8da8d4
      falsification_condition: >-
        A later record that treats this violation count as a
        cryptographic Gaudry cost.
  structural_ingredients:
    - description: >-
        IDEA-20261004-31991f states lemma (L) and the side bit.
        This hypothesis tests that statement on one model.
      citation: ledger/proposals/IDEA-20261004-31991f.yaml
      provenance: internal
      verified_by: coordinator session 2026-10-05, proposal file read
