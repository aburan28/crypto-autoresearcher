  reduction_chain:
    core_problem: >-
      The side-1 subsum condition for pair sums on this model.
    corollaries: []
  predictions:
    - metric: side_partition
      direction: equal
      minimum_effect: the three pre-registered partitions
    - metric: lemma_violations
      direction: equal
      minimum_effect: "0 at each prime"
    - metric: rational_sum_count
      direction: equal
      minimum_effect: "48 at p=7, 120 at p=11, 360 at p=19"
  test_boundary:
    instances:
      - y^2 = x^3 + x over F_p for p in {7, 11, 19}
    parameters:
      primes: [7, 11, 19]
      degree_n: 1
      pair_length: 2
    implementation: >-
      Affine slope addition and Jacobian addition. Both construct
      square roots in F_{p^2} by search, not from a stored table
      of sums.
    budget:
      maximum_runs: 6
      maximum_memory_gb: 2
  falsification_conditions:
    - >-
      Both addition laws agree and lemma_violations is positive
      at any prime.
    - >-
      Both addition laws agree and a side set or a rational-sum
      count differs from the statement.
  interpretation_limits:
    - H-GFPN-d3c9a1 remains the integer slice. This record does not replace it.
    - The model has rational 2-torsion (0, 0). EcMasFp5 is not tested.
    - No Gaudry exponent, twist cost, or n greater than 1 is claimed.
    - A timeout, a crash, or an addition-law disagreement is not evidence against the statement.
  dominated_by:
