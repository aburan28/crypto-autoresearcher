    The written ratio cap is 4 over 5 and the written dual-finish
    floor is 20 on a batch of 30. Four times 30 is 120, and 20 times
    5 is 100, so 20 over 30 falls short of 4 over 5 by 20.
    Twenty-four times 5 equals 120, so 24 over 30 meets the cap with
    gap 0. Nineteen falls short of the floor 20 by 1. Four minus 1
    is 3, so the cap numerator exceeds the success-gap numerator.
    The product of 20, 1, and 3 is 60. Three n values times two
    dimensions is 6 cells. Six times 20 is 120.
  mechanism: >-
