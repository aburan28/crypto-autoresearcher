hypothesis:
  id: H-CANL-b9033d
  question_id: RQ-CANL-63098f
  goal_id: GOAL-ENDO-001
  source_idea_ids:
    - IDEA-20261006-9deda5
  added: '2026-10-07'
  status: specified
  proposed_by: coordinator
  title: >-
    Doubling-denominator size on y^2 = x^3 + 1 is not smaller than
    on y^2 = x^3 + x + 1 by more than a factor of 13
  statement: >-
    Let E_cm be the integer model y^2 = x^3 + 1 and let E_gen be the
    integer model y^2 = x^3 + x + 1. Reduce both modulo 13. For each
    affine point over F_13 that is not 2-torsion, lift x and y to
    integers in {0, 1, ..., 12} and form the doubling slope over Q.
    Let H be the maximum of the absolute values of the denominators of
    those slopes, written in lowest terms. The prediction is
    13 * H(E_cm) >= H(E_gen). A strictly smaller left side is a
    negative. This is a denominator proxy for the height that makes
    Xedni fail, not a Néron-Tate height and not a lift attack. No
    discrete logarithm is computed, and the generic-group exponent 1/2
    is unchanged.
  mechanism: >-
    PAIR (representation, Sigma), carried from IDEA-20261006-9deda5.
    The representation is the denominator of the doubling slope on the
    naive integer model. Sigma is the chord-and-tangent double of one
    lifted point, not translation on E(F_13). Trichotomy class:
    coordinate-dependent, because the slope is a coordinate formula
    and discards the point at infinity. The projection keeps the
    largest denominator and discards the numerator and the
    y-coordinate of 2P. Many points can share one denominator, so the
    projection is lossy. It is not a block system of the translation
    group. Explanation A: complex multiplication does not shrink this
    denominator by more than one factor of 13, so the quantity that
    makes Xedni fail is not improved on this CM model. Explanation B:
    13 * H(E_cm) is strictly less than H(E_gen), so the CM model is
    smaller in this proxy. KR-IC-cd159a, opened, says Xedni succeeds
    with negligible probability. This comparison does not claim a
    successful lift. No factor base is built.
  assumptions:
    - >-
      The integer model is the same equation, not a p-adic canonical
      lift. Calling H a Néron-Tate height is invalid.
    - >-
      A point with y divisible by 13 is skipped. If every point is
      skipped, H is undefined and the comparison is refused.
    - >-
      E_cm has j-invariant 0 modulo 13 and is ordinary. E_gen has
      j-invariant neither 0 nor 1728 and is ordinary.
  proof_search_map:
    bottleneck: >-
      Whether the CM integer model shrinks the largest doubling
      denominator by more than a factor of 13.
    baseline_embedding:
      parameter_slice: >-
        Two integer models and one prime, p = 13. No point is lifted
        to a global rank computation.
      reproduction_check: >-
        The slope of a doubled point, reduced modulo 13, matches the
        group-law double on the reduced curve. A mismatch invalidates H.
    observation_collision:
      observable: the integer 13 * H(E_cm) - H(E_gen)
      distinct_preimage_search: >-
        Two non-isomorphic models can share a denominator. A negative
        value of that integer is the collision that kills explanation A.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          E_gen, the non-CM integer model at the same prime, paired
          with E_cm.
        predicted_gain: >-
          One inequality of two positive integers. No exponent.
    quantifier_order: >-
      At p = 13, for these two models, 13 * H(E_cm) is at least
      H(E_gen), when both maxima are defined. This is not every CM
      discriminant.
    method_ceiling:
      strongest_certifiable_claim: >-
        This denominator proxy does not shrink under the CM model by
        more than a factor of 13, or it does.
      nearby_object_control: >-
        E_gen. If H(E_gen) is undefined, there is no comparison.
    proof_obligations:
      - claim: both reduced models are ordinary
        responsibility: baseline
      - claim: each retained slope reduces to the group-law double
        responsibility: correctness
      - claim: 13 * H(E_cm) >= H(E_gen)
        responsibility: strictness
    not_applicable_reason: >-
      No exponent is claimed. The map is still filled for this pair.
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        On a random integral short-Weierstrass model with coefficients
        in {0, 1}, the largest doubling denominator of the nonnegative
        lifts of the F_p-points is not smaller on the CM model
        y^2 = x^3 + 1 than on y^2 = x^3 + x + 1 by more than a factor
        p. This imitates a uniform denominator up to size O(p). It is
        not the Néron-Tate height machine.
      random_model_justification: >-
        The slope (3x^2 + A) / (2y) of a lift with coordinates in
        {0, ..., p-1} has a denominator dividing 2y after reduction
        to lowest terms. Treating the largest such denominator as
        uniform up to O(p), and asking only whether the CM model
        beats the generic model by more than one factor p, is the
        heuristic. Transfer of that shape onto this pair at p = 13
        is not a theorem.
      supporting_results:
        - >-
          KR-IC-cd159a, opened in this session, says xedni succeeds
          with negligible probability because of the height
          obstruction, and it does not evaluate this denominator at
          p = 13. KR-RHO-13bf67, opened in this session, bounds
          generic algorithms and does not mention doubling
          denominators.
      validation_experiment_ids: []
      falsification_condition: >-
        At this pair, 13 * H(E_cm) is strictly less than H(E_gen),
        with both maxima defined and the group-law check passed. If
        either maximum is undefined, refuse the comparison.
  structural_ingredients:
    - description: >-
        Silverman's xedni calculus was shown by
        Jacobson-Koblitz-Silverman-Stein-Teske to succeed with
        negligible probability. Lifting-based ECDLP approaches inherit
        that obstruction.
      citation: KR-IC-cd159a
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-cd159a.yaml
      role: height obstruction this proxy does not remove
    - description: >-
        A generic algorithm needs a square-root number of group
        operations. This proxy does not beat that bound.
      citation: KR-RHO-13bf67
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
      role: exponent ceiling
  predictions:
    - metric: 13 * H(E_cm) - H(E_gen)
      direction: higher
      minimum_effect: at least 0
    - metric: >-
        number of non-2-torsion points contributing a slope on each model
      direction: higher
      minimum_effect: at least 1 on each model
  test_boundary:
    instances:
      - y^2 = x^3 + 1 over F_13, lifted to integers in {0, ..., 12}
      - y^2 = x^3 + x + 1 over F_13, lifted the same way
    parameters:
      prime: 13
      A_cm: 0
      B_cm: 1
      A_gen: 1
      B_gen: 1
    implementation: >-
      Enumerate the nonnegative lifts, compute each doubling slope
      over Q in lowest terms, and compare the two maxima. No driver
      is bound in this record. No Xedni search and no rho walk.
    budget:
      maximum_runs: 1
  falsification_conditions:
    - >-
      13 * H(E_cm) is strictly less than H(E_gen), with both H
      defined, both models ordinary and nonsingular, j(E_gen) neither
      0 nor 1728, and a retained slope on each model matching the
      group law modulo 13.
    - >-
      Either model has no retained slope, or a retained slope does
      not match the group law. No comparison from that run is
      admissible, and the failure is not the concrete negative above.
    - >-
      Either model is singular or supersingular, or j(E_gen) is 0 or
      1728. No denominator from that run is admissible.
  interpretation_limits:
    - >-
      A denominator ratio is not a successful Xedni lift and does not
      contradict KR-IC-cd159a.
    - No discrete logarithm is computed. The exponent 1/2 is unchanged.
    - The scope is these two models at p = 13.
  status_note: >-
    specified means the protocol is written. It does not mean
    approved. EXP-CANL-5b859e is review_required.
