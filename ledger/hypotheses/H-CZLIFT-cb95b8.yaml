hypothesis:
  id: H-CZLIFT-cb95b8
  question_id: RQ-CZLIFT-b9f765
  goal_id: GOAL-CZLIFT-1516d5
  source_proposal: IDEA-20261009-7b0abf
  designed_from: IDEA-20261009-7b0abf
  added: '2026-10-09'
  proposed_by: coordinator
  designed_by: coordinator
  approval_decision: DEC-20261009-296cee
  title: >-
    Xedni lifts of two or three random points are never dependent within a
    relation bound of 6, while a planted dependence is always detected
  statement: >-
    For p in {101, 211, 401, 809, 1601, 3203, 6421, 12809}, random
    y^2 = x^3 + a x + b over F_p, and r in {2, 3} random points lifted to
    symmetric integer representatives with the Weierstrass model fitted
    through them, the exact search for sum m_i P~_i = O with max |m_i| <= 6
    finds no relation in any of 100 trials per cell on either seed
    (dependence_rate_overall = 0, upper 95 percent bound below 0.002), while
    the planted control P~_2 = [2] P~_1 is detected in every one of 24
    controls. The lifted points have naive log-height about 0.7 log p.
  mechanism: >-
    A dependence among the lifted points is a rational point of small height
    on a curve whose coefficients have height about 2 log p; the
    Jacobson-Koblitz-Silverman-Stein-Teske analysis (KR-IC-cd159a) gives the
    probability of such a configuration as negligible, and the exact bounded
    search measures the count directly where the attack would need it.
  assumptions:
    - Symmetric integer lifts; the curve fit is the unique model through the lifted points (r = 2 short model, r = 3 with an X^2 term).
    - Relation bound 6; coefficients larger than 6 are not searched.
  proof_search_map:
    not_applicable_reason: a counting measurement of a known negative result at its only cheap scale.
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: xedni calculus and its analysis
      citation: knowledge/frontiers/ecdlp/index-calculus/KR-IC-cd159a.yaml
      provenance: internal
      verified_by: coordinator, this session (2026-10-09), read the row on disk
      role: the prediction under test
  reduction_chain:
    core_problem: whether global lifts of random points are ever cheaply dependent
    corollaries: []
  predictions:
    - metric: dependence_rate_overall
      direction: different
      minimum_effect: 'exactly 0 on 1600 valid trials per seed'
    - metric: control_detection_rate
      direction: different
      minimum_effect: 'exactly 1.0'
  test_boundary:
    instances: ['8 primes from 101 to 12809, r in {2, 3}, 100 trials per cell, 24 planted controls']
    parameters: {relation_bound: 6}
    implementation: experiments/EXP-CZLIFT-ed8113/implementation/run.py
    budget: {wall_clock_seconds_per_run: 3600}
  falsification_conditions:
    - dependence_rate_overall above 0.01 on both seeds
    - control_detection_rate below 1.0 (instrument; the run is invalid)
  interpretation_limits:
    - r <= 3 and relation bound 6 only; nothing about larger relation coefficients or more points.
    - Symmetric lifts only; the attack's freedom to pick other lifts is not explored.
  status: approved
  status_note: Pre-run approval paired to EXP-CZLIFT-ed8113 under DEC-20261009-296cee; asserts nothing about truth.
