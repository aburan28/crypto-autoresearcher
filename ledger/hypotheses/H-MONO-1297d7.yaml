hypothesis:
  id: H-MONO-1297d7
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  derived_from_idea: IDEA-20260904-4f614a
  status: inconclusive_confirms_additive_form_non_discriminating_at_coincidence_point
  added: '2026-09-04'

  status_note_2026_09_04: >-
    EXP-MONO-98abb2 executed, independently reviewed (Validator + Red
    Team), and decided in DEC-20260904-c4be2f (evidence: EV-MONO-b967e0).
    The fixed search found p=103, A=1, B=11 (h_+=1, h_-=1) -- the SINGLE
    point in the admissible domain where D_sum and D_prod are
    algebraically identical (proven: D_prod-D_sum =
    h_-(h_+-1)n_+ + h_+(h_--1)n_-, zero iff h_+=h_-=1). The additive form
    matched exactly, but the named rival was not excluded, so this
    hypothesis's own two-sided prediction does not cleanly resolve.
    Self-disclosed by the Coordinator (CORR-20260904-e526e0, superseded by
    CORR-20260904-b9f9c1 after independent review upgraded its severity
    and replaced its proposed fix with the proven-tight
    "max(h_+,h_-)>=2" condition). Successor: H-MONO-dd666a /
    EXP-MONO-8ec0e5, using that corrected filter.

  statement: >-
    SCOPE: m=4 only, symmetric-base Semaev cover, prime fields F_p, p>3,
    toy range, ordinary curves with the distinct-split (Z=3) residual
    stratum, on a curve with BOTH h_+ >= 1 AND h_- >= 1 simultaneously
    (the joint regime neither EXP-MONO-4e6faa nor EXP-MONO-ee06e2 tested
    -- both of those curves have h_+=0). Claim tier toy for measurement,
    derivation tier for the closed form under test.

    THE HYPOTHESIS. KN-FIND-edd62c promotes the D3 closed form's h_-
    term (with h_+ held at 0) as an established, independently re-derived
    result. But every curve tested so far has h_+=0, so the h_+ n_- term
    and any possible h_+/h_- INTERACTION (e.g. a cross term the additive
    derivation does not predict, or a subtle double-counting between the
    two families of halvable points when BOTH exist simultaneously on the
    same curve) remain completely untested. This hypothesis targets
    exactly that gap: on a curve with h_+ >= 1 and h_- >= 1 simultaneously,
    does the full bivariate closed form D = h_+ n_- + h_- n_+ (a SUM of
    the two, per IDEA-20260904-4f614a's own STEP 4 argument) survive
    exactly, with no interaction term needed?

    PRE-REGISTERED, TWO-SIDED. Let D_sum = h_+ n_- + h_- n_+ (the frozen,
    unmodified D3 formula, now tested with BOTH terms simultaneously
    nonzero) and D_prod = h_+ * h_- * (n_+ + n_-) as a named alternative
    that would arise if the two families of halvable points interacted
    multiplicatively rather than contributing additively and
    independently (a plausible failure mode if, contrary to the STEP 4/5
    disjointness argument, some fixed-point pairs were shared or
    double-counted when both h_+ and h_- are nonzero). (I) The census
    matches D_sum exactly and NOT D_prod (D_sum != D_prod whenever both
    h_+, h_- >= 1 and n_+, n_- > 0) -- this is the first empirical test of
    the FULL closed form, with a real interaction-shaped alternative
    excluded, completing the picture KN-FIND-edd62c left open. (II) The
    census matches neither D_sum nor D_prod, or matches D_prod instead --
    falsifying the simple additive/independent-pairs picture for the
    joint regime specifically, requiring a corrected cross-term even
    though the pure h_- and pure h_+ slices (by the derivation's own
    symmetry) would remain individually supported.

  mechanism: >-
    Reuses IDEA-20260904-4f614a's own STEP 4/5 derivation (already
    independently re-derived and confirmed structurally sound for the
    h_+=0 slice by EXP-MONO-ee06e2's own Red Team review) and
    EXP-MONO-ee06e2's own already-independently-verified search/census/
    comparison pipeline, unmodified in its core logic except: (1) the
    Stage-0 filter now requires h_+ >= 1 AND h_- >= 1 simultaneously; (2)
    Stage 2 computes D_sum (the frozen linear form, applied bivariately)
    and D_prod (the named multiplicative-interaction rival) before
    reading Stage 1's own results.

  falsification_condition: >-
    Any exact mismatch between the observed census and D_sum's own
    prediction on a found h_+>=1, h_->=1 curve falsifies the additive,
    non-interacting form of the closed form for the joint regime. If no
    such curve exists within the declared toy prime range, that is a
    reportable, non-evidentiary occupancy fact -- though a specific
    candidate (p=103, A=1, B=11, h_+=1, h_-=1) has already been found by
    an independent reviewer and must be independently re-verified, not
    assumed, by this experiment's own Stage 0.

  heuristic_assumptions:
    - id: H1
      statement: >-
        HEUR-CELL-3: a curve with Z=3, h_+ >= 1 AND h_- >= 1 simultaneously
        exists within the declared toy prime search range. Strong prior
        evidence: EXP-MONO-ee06e2's own independent Red Team review
        already derived and computationally confirmed p=103, A=1, B=11
        qualifies (h_+=1, h_-=1). This experiment's own Stage 0 must
        independently re-verify this by its own fixed, declared search
        order, not assume or hard-code it.
      rigorous_support: >-
        Not distributional; an existence claim, with strong independent
        prior support (a red-team-derived, computationally confirmed
        candidate) but not yet re-verified by an approved-contract run.
      validation_plan: >-
        SAMPLE: scan ordinary curves (varying A,B) at toy primes in
        [101,2000], same fixed ascending order as EXP-MONO-4e6faa/
        EXP-MONO-ee06e2, requiring Z=3 AND h_+ >= 1 AND h_- >= 1 this
        time, first hit taken. COMPARE AGAINST: both D_sum's and
        D_prod's exact predictions on that curve's own exhaustive
        distinct-split-stratum census. TAIL CHECK: not applicable,
        exact-integer test. TRANSFER ASSUMPTION, STATED: a confirmed
        match on ONE joint curve supports but does not prove the additive
        form for every possible (h_+, h_-) combination.
      falsification_condition: >-
        Any exact mismatch between the observed census and D_sum's own
        prediction on a found qualifying curve; or exhaustion of the
        declared range with none found (unlikely, per the Red Team's own
        prior finding).

  target_complexity:
    time_exponent: O(p) per curve tested.
    memory_exponent: O(1).
    best_known: Not applicable; no ECDLP complexity claim. Pollard rho (KN-OPEN-001) untouched.

  claim_boundary_and_test_boundary: >-
    Tests ONLY whether the D-term's additive form D = h_+ n_- + h_- n_+
    survives when BOTH terms are simultaneously nonzero, on the
    distinct-split (Z=3) stratum, at toy scale. Does NOT test the
    non-split strata. Does NOT make any relation-rate, cost, or exponent
    claim. A confirmed match completes (does not merely extend) the
    picture KN-FIND-edd62c already promotes for the h_+=0 slice. Does not
    re-scope H-MONO-93bc4d.

