hypothesis:
  id: H-ECQ-d60d07
  question_id: RQ-ECQ-80f23c
  statement: >-
    A published elliptic family of generic Mordell-Weil rank r > 8 over Q(t), specialised at SMALL
    rational parameters and certified by exact descent, yields curves over Q of rank >= 15 whose
    naive height is below 118.770 -- the pre-registered minimum over all rank >= 15 curves on the
    ICARM leaderboard as of 2026-08-23 (snapshot sha256 118db069...cadc59). Equivalently: on that
    board the r>=15 size cell is soft, and generic rank bought from the base rather than from the
    sieve is the lever that reaches it.
  mechanism: >-
    Rank and size pull against each other in the usual record pipeline: extra rank is bought by
    sieving ever-larger specialisations, so the record curves are enormous (the rank-30 curve has
    63-digit coefficients, naive height 442). A base family of generic rank r inverts that trade.
    By Silverman specialisation all but finitely many t0 give rank >= r over Q with NO sieving at
    all, so the parameter may be chosen SMALL, which keeps the specialised coefficients small and
    the height low. The sieve is then only asked for the last +1 or +2 above r, not for the whole
    rank. Concretely, at r = 12-14 (Nagao, Kihara) a specialisation at small t starts at rank >= 12
    with a small model, and needs only a modest excess to land at 15 -- where the incumbent record
    holder sits at height 118.77 while the r>=14 incumbent sits at 85.19.
  assumptions:
  - >-
    Silverman specialisation motivates the search and is NEVER used to certify. Every reported rank
    over Q is recertified by exhibiting points on the specialised curve and verifying independence
    by exact descent, exactly as in GOAL-ECQ-001.
  - >-
    The Mestre-Nagao statistic is a heuristic ORDERING prefilter only and never contributes to a
    certified rank. GOAL-ECQ-001's red team established the signal is real on rank-8 families
    (dose-response, p = 6.1e-8), which licenses using it to order, not to claim.
  - >-
    The published generic rank of any borrowed family is treated as a CLAIM TO REPRODUCE, not a
    given. A family whose rank this repo cannot re-certify is not used as a base.
  - >-
    Naive height, Faltings height and conductor are computed to the leaderboard's own definitions;
    where a definition is ambiguous the ICARM verifier's returned values are authoritative, and any
    disagreement with our computation is reported rather than silently adopted.
  falsification:
  - >-
    FALSIFIED for the height claim if a bounded search over the reproduced families yields no
    rank >= 15 curve under naive height 118.770. Reporting the best (rank, height) pair actually
    reached, and the volume searched, is then the result.
  - >-
    FALSIFIED for the mechanism if specialising at small parameters does NOT keep the height low --
    i.e. if minimal models of small-parameter specialisations are not small. This is a cheap
    pre-compute check and should be run before any large sieve.
  proof_search_map:
    bottleneck: >-
      Obtaining a family of generic rank > 8 over Q(t) whose rank this repo can re-certify. Every
      downstream claim rests on it; GOAL-ECQ-001 stopped exactly here, at the rational-elliptic-surface
      ceiling of 8 (Shioda-Tate, 10d-2 at d=1).
    baseline_embedding:
      parameter_slice: >-
        The ICARM frontier by rank threshold, frozen 2026-08-23. This campaign embeds at r>=15,
        NOT near the rank-30 top of the board.
      reproduction_check: >-
        The pipeline must first reproduce a KNOWN leaderboard curve's reported rank and height from
        its a-invariants alone before any new curve is claimed. GOAL-ECQ-001's rank-30 fixture
        (RUN-ECRANK-e1e30e-003) remains the certificate-shape reference.
    observation_collision:
      observable: the pair (certified rank, naive height) of a specialisation
      distinct_preimage_search: >-
        Distinct parameters giving the same rank are the normal case; the search is for the tail
        where rank is high AND height is low, which is a different tail from the one the record
        pipeline chases.
    method_ceiling: >-
      A base of generic rank r cannot produce a certified rank below r, but neither does it produce
      arbitrarily high rank: the ceiling is Shioda-Tate for the surface's degree d (10d-2), i.e. 8
      for rational, 18 over C and 17 over Q for K3. Naming d fixes the ceiling before the search,
      so an over-claim is visible immediately.
    nearby_object_control: >-
      A null base: specialise a family of generic rank 0-1 over the SAME small parameter range and
      confirm it does NOT produce rank >= 15 at low height. If it does, the generic rank is not what
      is doing the work and the mechanism above is wrong.
  status: proposed
  created: '2026-08-23'
  owner: coordinator
