  proof_search_map:
    bottleneck: >
      Whether C_prep(M, σ*) equals 2√(M n)
      as exact integer arithmetic on the
      frozen pair. Stage 0 only checks that
      identity, the M=1 baseline, the
      suboptimal-σ known-false, and the
      cheap-offline nearby object.
    baseline_embedding:
      parameter_slice: >
        The REAL, KF, and NULL fixtures.
        Disclosed tightening: one frozen
        (n, M)=(16, 4) plus the bundled
        M=1 baseline, exact integer
        identities only, not the proposal's
        ledger audit, stored-walk
        calibration, or frontier table.
      reproduction_check: >
        REAL C_prep(4, 1/2)=16=2√(4·16).
        M=1 baseline C_prep(1, 0)=8=2√16.
        KF C_prep(4, 0)=20≠16.
        NULL cheap-offline=8≠16.
    observation_collision:
      observable: >
        C_prep versus 2√(M n) at σ* versus
        at a suboptimal σ, versus cheap
        offline.
      distinct_preimage_search: >
        Hold (n, M) and change σ from σ*
        to 0. Hold (n, M, σ*) and zero the
        offline term.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Frozen exact charged-bar identity.
        predicted_gain: >
          Exact known-false suboptimal-σ
          gap on KF. Zero claimed attack
          improvement.
    quantifier_order: >
      Freeze (n, M) before reading C_prep.
      Existential equality at one pair
      does not imply a ledger audit and
      does not imply a rho beat.
    method_ceiling:
      strongest_certifiable_claim: >
        Instrument reproduction on the declared
        frozen pair. Never a stored-walk
        result. Never an ECDLP exponent.
        Never a ledger-audit classification.
      nearby_object_control: >
        NULL is the cheap-offline object.
        An argument that still assigns it
        C_prep = 2√(M n) is wrong. KF is
        the suboptimal-σ object; an argument
        that assigns every σ the bar is
        wrong.
    proof_obligations:
      - claim: well-defined exact charged-bar identity
        responsibility: correctness
      - claim: exact REAL identity and M=1 baseline
        responsibility: baseline
      - claim: exact KF suboptimal gap
        responsibility: baseline
      - claim: no ledger audit, no stored walk, no frontier table, no Stage 1 of fdae20/089e80/b3f975/daf1bb/0d1336/1aa0f8/79f8c4/628891/9e9536/90f602, no Stage 2 of 4be480
        responsibility: interface
    not_applicable_reason: null
