  assumptions:
    - id: A1
      statement: >
        n=16 is a fourth power of two, so
        n^{k/4} is the integer 2^k and
        √(M n) is the integer 8. No
        floating-point log is required.
      status: explicit
    - id: A2
      statement: >
        The identity C_prep(M, σ*) = 2√(M n)
        is the idea's model identity under
        offline = S·T and S T^2 = Θ(n).
        Stage 0 tests the identity as
        arithmetic, not the identification
        of offline with S·T on any stored
        walk.
      status: explicit
    - id: A3
      statement: >
        Standing user authorization 2026-09-06
        covers protocol approval once the
        contract is complete.
      status: explicit
    - id: A4
