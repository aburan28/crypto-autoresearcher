  statement: >
    Fix the integer pair (n, M) = (16, 4)
    before any cost is evaluated. Stage 0
    asserts only the charged-bar identity
    of IDEA-20260904-ca8865 as exact
    integer arithmetic: under offline = S·T
    and S T^2 = Θ(n),
    C_prep(M, σ) = n^{(1+σ)/2} + M n^{(1-σ)/2}
    and at σ* = log M / log n the two terms
    are equal and C_prep(M, σ*) = 2√(M n).
    (i) REAL at (16, 4, σ*=1/2) evaluates
    to 16 = 2√(64); the bundled M=1 baseline
    at (16, 1, σ=0) evaluates to 8 = 2√n;
    (ii) KF is the same (16, 4) at suboptimal
    σ=0, which evaluates to 20 and is not 16;
    (iii) NULL is cheap-offline (offline=0)
    at σ*, which evaluates to 8 and is not 16;
    (iv) n=1 and M=0 are rejected. This is
    not a stored walk, not a ledger audit,
    not a frontier table, not a decoder, and
    not a rho beat. Stages 1–3 stay
    unauthorized.
  mechanism: >
    The idea's charged-bar model identifies
    offline cost with S·T on the CGK
    frontier S T^2 = Θ(n). Substituting
    S = n^σ yields C_prep(M, σ) =
    n^{(1+σ)/2} + M n^{(1-σ)/2}. AM-GM
    (or a derivative in σ) puts the unique
    interior minimum at n^σ = M, where the
    two terms are equal and the sum is
    2√(M n). Stage 0 evaluates that
    identity on one frozen pair where every
    required root is an integer power of
    two (n=16=2^4). The M=1 baseline is
    the idea's reproduction_check, bundled
    not as a second experiment. The KF
    suboptimal σ and the NULL cheap-offline
    table are the proves-too-much and
    nearby-object controls. No walk is
    stored. No ledger is scanned. This is
    a new RQ-ECDLP-002 object after Stage 0
    of EXP-ECDLP-089e80 held as P-S0-C1
    (DEC-20260908-7ab983). It is not
    Stage 1 of EXP-ECDLP-089e80 and not
    Stage 1 of this experiment.
  predictions:
    - id: P-S0-BARS
      metric: well-defined exact charged-bar identity on the frozen (n, M) pair
      direction: different
      minimum_effect: >
        After fixture_pass, REAL C_prep at
        σ* equals 2√(M n) equals 16, and
        the M=1 baseline equals 2√n equals 8.
        KF suboptimal σ=0 evaluates to 20.
        NULL cheap-offline evaluates to 8.
        n=1 and M=0 are rejected. One
        certified miss after fixture_pass
        is a scoped falsification of this
        instrument on the frozen pair.
      claim_tier: observational
    - id: P-S1-LEDGER
      metric: ledger-audit bar classification
      direction: different
      minimum_effect: >
        Stage 1+, unauthorized here. Stage 0
        does not scan the ledger, does not
        implement a stored walk, and does
        not emit a frontier table.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KFSUBOPT
      statement: >
        After fixture_pass, KF at σ=0
        reports C_prep equal to the bar 16.
        An encoding bug is
        failed_infrastructure.
    - id: F-S0-REALBARS
      statement: >
        After fixture_pass, REAL C_prep at
        σ* fails to equal 2√(M n), or the
        M=1 baseline fails to equal 2√n.
        That falsifies only P-S0-BARS on
        this frozen pair.
    - id: F-S1-LEDGER
      statement: >
        After an authorized later stage, a
        claimed bar classification of a
        committed threshold. Unauthorized
        here.
