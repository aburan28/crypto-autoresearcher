      citation: Gauss reduction of positive-definite binary quadratic forms
      provenance: recalled
      verified_by: null
      role: shared subroutine of both circuits
    - description: >-
        Ideals of the quadratic order Z[(1+sqrt(-59))/2] multiply, and
        ideal classes correspond to form classes of the same discriminant.
        Not opened as a primary text in this session.
      citation: ideal arithmetic in quadratic orders
      provenance: recalled
      verified_by: null
      role: the Circuit-I operation
    - description: >-
        NOT, CNOT and Toffoli form a universal gate set for reversible
        Boolean functions, so both maps are classically simulable
        reversible Boolean functions. Not opened as a primary text in this
        session.
      citation: NCT universality for reversible Boolean functions
      provenance: recalled
      verified_by: null
      role: both maps are classically simulable reversible circuits
    - description: >-
        The note estimates how often a prime fails to divide a class
        number. It does not count ancilla qubits and does not predict
        this ratio.
      citation: KN-LIT-508
      provenance: kb
      verified_by: knowledge/literature/KN-LIT-508.md
      role: orthogonal fence, not the width claim
  reduction_chain:
    core_problem: >-
      the ancilla width of one class-group composition step in two
      representations at discriminant -59
    corollaries: []
  predictions:
    - metric: ratio of the ideal-circuit ancilla width to the form-circuit ancilla width
      direction: higher
      minimum_effect: at least 2
  test_boundary:
    instances:
      - discriminant -59
      - the frozen pair (A, B)
      - the frozen pair (P, P)
      - the non-fundamental control pair at discriminant -60
    parameters:
      bit_width: 16
      gate_set: NOT, CNOT, Toffoli (NCT)
      gauss_reduction_bound: 8
      congruence_fix_bound: 3
      allocation: fresh-bit-per-temporary, no uncomputation
    implementation: >-
      Build both circuits as classically simulable reversible Boolean
      functions over the shared NCT substrate, simulate them on the
      frozen pairs and on the discriminant -60 control, check agreement
      and the accounting guards, and count ancilla bits under the
      identical policy for both circuits. No quantum hardware, no
      discrete-logarithm search, and no full group-action oracle.
    budget:
      cell: both pairs, both circuits, one run id
      maximum_runs: 1
  falsification_conditions:
    - >-
      Both circuits agree on both frozen pairs, the instrument checks
      pass, and the ratio width_I / width_F is strictly below 2. That
      ratio is the negative observation.
    - F has fewer than three forms as re-derived by the run.
    - The two circuits disagree on a pair that is then used in the ratio.
  interpretation_limits:
    - >-
      The ratio is not a CSIDH-512 gate count and is not a Kuperberg
      cost.
    - >-
      A ratio below 2 closes only this discriminant, this encoding, and
      these two frozen circuits.
    - >-
      The full group-action oracle is not built. One composition step
      is not an action evaluation.
    - >-
      A programmer gap between the two circuits is acknowledged and
      scoped: the negative stands for the circuits that were written,
      and it is not a theorem that every ideal circuit is wider.
    - >-
      No exponent moves. Two integers and one ratio are not a runtime.
