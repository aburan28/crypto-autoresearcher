  statement: >
    Fix the exact affine sum S=x+y
    of one frozen toy before any
    Gamma orbit, Semaev S_m, nested
    LHW generator, pairing, Miller,
    Tate, or unary-closure census is
    built. Stage 0 asserts only that
    on REAL p=19, A=1, B=-1, P=(2,3)
    one has [2]P=(16,11), S=2+3=5,
    S'=16+11≡8, and that the nearby
    KF invariance claim S'=5 is
    false. NULL empty sum rejected.
    y=0 is invalid for the doubling
    formula used to form [2]P. This
    is not the product xy (904d99)
    and not Hessian x+y as a Semaev
    model coordinate (dadcd2).
    Stages 1+ stay unauthorized.
  mechanism: >
    IDEA-20260913-1c047d Stage 0 hard
    gate is the exact field sum
    S=x+y at P and at [2]P. Form
    [2]P by affine doubling, then
    add the affine coordinates.
    Stage 0 freezes that identity as
    exact tables. No Gamma orbit. No
    Semaev S_m. No nested LHW. No
    Miller. No Tate. No unary-
    closure census. This is a new
    GOAL-ECDLP-001 object after
    P-S0-DBLSLP. It is not Stage 1
    of EXP-ECDLP-56137b and not
    Stage 1 of EXP-ECDLP-895a0f.
  predictions:
    - id: P-S0-XPLUSY
      metric: well-defined affine-sum identity on frozen toys
      direction: different
      minimum_effect: >
        After fixture_pass, REAL
        S equals 5 and S' equals 8,
        and KF invariance claim
        S'=5 is rejected. NULL empty
        sum is rejected. y=0 is
        rejected. One certified miss
        after fixture_pass is a
        scoped falsification of this
        instrument at the frozen
        toys.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KF
      statement: >
        After fixture_pass, KF claim
        S'=5 is accepted as a
        generic affine-sum target.
        An encoding bug is
        failed_infrastructure.
    - id: F-S0-REAL
      statement: >
        After fixture_pass, REAL
        fails to match S=5 or S'=8.
        That falsifies only
        P-S0-XPLUSY at the frozen
        toy.
  test_boundary:
    instances:
      - frozen Stage 0 REAL / KF / NULL panel
    parameters:
      real_curve:
        p: 19
        A: 1
        B: -1
        P: [2, 3]
        P2: [16, 11]
        must_S: 5
        must_S_prime: 8
    claim_tier: observational
    not_in_scope:
