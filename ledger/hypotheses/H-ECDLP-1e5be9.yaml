  title: >
    Exact affine sum x+y Stage 0
    identity — S=5 and S'=8;
    claiming S'=5 is rejected
  status: specified
  proposed_by: idea-generator
  designed_by: coordinator
  designed_under_task: TASK-20260913-da7e14
