# =============================================================================
# H-BINSTD-ad480d -- n−1 decomposition attempt cost vs two chained S_3 at toys.
# Specified from IDEA-20261002-5ebfcd under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Approved DEC-20261003-fdf02f. ZERO RUNS in this design packet.
# Stages 0-2 authorized. No AUXIN. No Bedrock. No curve attack / exponent claim.
# Distinct from IDEA-20261001-161102, engine races, 99487f.
# =============================================================================
hypothesis:
  id: H-BINSTD-ad480d
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261002-5ebfcd
  experiment_id: EXP-BINSTD-8be7c5
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-03'
  approved_at: '2026-10-03'
  authorised_by: DEC-20261003-fdf02f
  status: approved
  status_history:
    - from: proposed
      to: specified
      at: '2026-10-03'
      by: DEC-20261003-fdf02f
    - from: specified
      to: approved
      at: '2026-10-03'
      by: DEC-20261003-fdf02f
  proposed_by: coordinator

  title: >-
    At toy binary cells (n,ℓ)∈{17,19}×{3}, is one n−1 decomposition attempt
    ≥2× cheaper in median wall time than two chained S_3 attempts under a
    shared encoder/solver pin?

  statement: >-
    CLAIM (heuristic_validation / attempt-cost instrument; NO ATTACK; NO
    EXPONENT). Let V ⊂ F_{2^n} be a frozen F_2-subspace of dimension ℓ=3.
    FORALL cells (n,ℓ)∈{17,19}×{3}, over ≥20 independent targets from a
    frozen catalog shared by both arms, under a shared encoder/solver pin:
    median wall time of one Joux–Vitse-style n−1 decomposition attempt
    satisfies median T_{n−1} ≤ (1/2)·median (T_{S3,1} + T_{S3,2}) — OR the
    ≥2× band fails and is recorded as n-1-not-cheaper-than-chained-S3 at
    this scale (O-FAIL-BAND). If the n−1 or chained-S_3 attempt path is
    absent, the cell is O-IMPEDIMENT (infrastructure; never negative
    evidence). Distinct from IDEA-20261001-161102 (S_4 vs two S_3),
    Crossbred/Karabina engine races, and 99487f (halving). NO break.
    NO n≥131 transfer. CLAIM TIER: heuristic_validation.

  mechanism: >-
    OBJECT FRAME. Representation: FB {P : x(P)∈V} with fixed dim ℓ=3;
    Operation A: one n−1 decomposition attempt (KR-IC-081a58 / KR-IC-46d822
    family); Operation B: two chained S_3 attempts (KR-IC-5a43e5); Observable:
    median wall-time ratio T_{n−1} / chained-S_3 under a shared pin.
    Trichotomy: Class I instrument (attempt-cost meter). Lossy-projection:
    wall time discards which polynomial path dominates; null is a matched
    random Boolean system of the same N_var solved twice whose ratio is
    independent of Semaev structure. OFF-LIMITS: S_4 vs two S_3 (161102);
    engine races; torsion/halving (99487f). WHAT IS NEW: a frozen ≥2× band
    for n−1 vs chained S_3 at RQ-BINSTD toys. If attempt launchers are not
    already admitted, the executable contract is a detector that emits
    O-IMPEDIMENT — not a fake solver.

  novelty_status: unverified
  assumptions:
    - Frozen V (ℓ=3), seeds, shared encoder/solver pin, ≥2× band.
    - n−1 and S_3 attempt paths already admitted or cell is O-IMPEDIMENT.
    - Attempt-cost ratio ≠ S_4 comparison ≠ engine bake-off.
    - Ratio ≤ 1/2 ≠ practical binary IC (KR-IC-1fcdbc).
    - Dual independent median aggregators must agree before a band verdict.

  predictions:
    - metric: median_wall_time_ratio_n1_over_chained_S3
      direction: upper_bounded
      minimum_effect: '≤ 1/2 at each completed (n,ℓ) cell'
    - metric: targets_completed
      direction: lower_bounded
      minimum_effect: '≥ 20 independent targets per completed cell'
    - metric: null_random_boolean_ratio_near_one
      direction: near_one
      minimum_effect: 'null median ratio ∈ [0.75, 1.25] on Stage 2'
    - metric: dual_median_agreement
      direction: same
      minimum_effect: 'median_path_a == median_path_b on every scored arm'

  test_boundary:
    instances:
      - 'Stage 0: freeze V (ℓ=3), seeds, pin, ≥2× band, ≥20-target catalog, launcher probe'
      - 'Stage 1 authorized: n=17 timings or O-IMPEDIMENT'
      - 'Stage 2 authorized: n=19 + random-Boolean matched-N_var null'
    parameters:
      band: 0.5
      ell: 3
      n_targets: 20
      catalog_seed: 2026100305
      pin_seed: 2026100306
      null_ratio_interval: [0.75, 1.25]
      moduli:
        17: t^17+t^3+1
        19: t^19+t^5+t^2+t+1
    implementation: >-
      Pure Python under experiments/EXP-BINSTD-8be7c5/implementation/;
      command surface implementation/run.py driven by trial-plan-v1.json.
      Encoder pin: copied encode_s3.py. Attempt launchers probed, not
      provisioned. Dual median aggregators + combinadic twins.
      No Magma/Sage/AUXIN/Bedrock.
    budget:
      wall_clock_seconds: 36000
      memory_gb: 2
      maximum_runs: 4

  falsification_conditions:
    - >-
      Median T_{n−1} > (1/2)·median chained-S_3 at a completed cell
      (O-FAIL-BAND / n-1-not-cheaper-than-chained-S3).
    - Editing the ≥2× band after seeing timings (protocol invalid).
    - Changing the encoder/solver pin between arms (protocol invalid).
    - Claiming practical binary IC or an exponent move from a toy cost band.
    - Equating this meter with S_4 vs two S_3 (161102).
    - Transferring the band to n≥131 without a new contract.
    - Treating O-IMPEDIMENT / missing launchers as negative mathematical evidence.

  distinguishable_outcomes:
    - id: O-SUPPORT
      meaning: >-
        Attempt paths admitted; ≥20 targets complete; dual medians agree;
        median T_{n−1} ≤ (1/2)·median chained S_3 on every completed
        authorized cell; Stage-2 null ratio ∈ [0.75, 1.25]. Toy attempt-cost
        band holds. No attack claim.
    - id: O-FAIL-BAND
      meaning: >-
        Paths admitted; ≥20 targets complete; dual medians agree; band
        fails on at least one completed cell (n-1-not-cheaper-than-chained-S3).
    - id: O-NULL-FAIL
      meaning: >-
        Stage-2 timings complete but null median ratio outside [0.75, 1.25];
        Semaev-structure reading of the ratio is not separated from the meter.
    - id: O-INCONCLUSIVE
      meaning: >-
        Paths admitted but <20 targets complete on a required cell; band not
        read as support/fail.
    - id: O-ARTIFACT
      meaning: >-
        Dual-median or combinadic/dimVV twin disagreement, or freeze/regression
        failure. No band claim kept.
    - id: O-IMPEDIMENT
      meaning: >-
        n−1 and/or chained-S_3 attempt launcher absent, timeout, crash, or
        missing Stage-0 freeze. Infrastructure; never negative evidence
        against H-BINSTD-ad480d / HEUR-BINSTD-5ebfcd-H1.
    - id: O-STAGE0-OK
      meaning: Stage-0 freeze twins agree; no scientific timing yet.

  interpretation_limits:
    - Attempt wall-time ratio only; success probability is reported, not used to claim an exponent.
    - Shared pin; a different encoder/solver needs a new contract.
    - Asymptotic n≥5 advantage over F_{q^n} does not transfer to these toys.
    - No attack at field degree ≥ 131. ECC2K-130 is not an instance.
    - Missing launchers are O-IMPEDIMENT, not O-FAIL-BAND.

  heuristic_assumptions:
    - id: HEUR-BINSTD-5ebfcd-H1
      formal_statement: >-
        FORALL (n,ℓ)∈{17,19}×{3}: over ≥20 independent targets under the
        shared pin, median T_{n−1} ≤ (1/2) · median (T_{S3,1} + T_{S3,2}).
      random_model_justification: >-
        Rigorous: KR-IC-081a58 gives a factorial/poly cost for n−1 systems;
        KR-IC-5a43e5 fixes S_3 degree 2^{1} per variable. Classical: at tiny
        binary n the n−1 system may be larger than two S_3 systems despite
        the asymptotic story for n≥5, so the ≥2× band is a pre-registered
        transfer hypothesis that can fail honestly at toys — not a claim that
        n−1 beats rho.
      supporting_results:
        - KR-IC-081a58
        - KR-IC-5a43e5
        - KR-IC-1fcdbc
      citations:
        - ref: KR-IC-081a58
          provenance: retrieved
          claim: Joux–Vitse n−1 decomposition cost formula / static DH.
          verified_by: IDEA-20261002-5ebfcd frontier_map rows_checked (build_frontier_map.py).
        - ref: KR-IC-5a43e5
          provenance: retrieved
          claim: Semaev S_3 / resultant recursion for the chained baseline.
          verified_by: IDEA-20261002-5ebfcd frontier_map rows_checked (build_frontier_map.py).
        - ref: KR-IC-1fcdbc
          provenance: retrieved
          claim: Binary summation stays slower than rho; cost band ≠ beat-rho.
          verified_by: IDEA-20261002-5ebfcd frontier_map rows_checked (build_frontier_map.py).
      validation_experiment_ids:
        - EXP-BINSTD-8be7c5
      falsification_condition: >-
        Median T_{n−1} > (1/2)·median chained-S_3 cost at a completed cell
        (n-1-not-cheaper-than-chained-S3), OR n−1/S_3 path absent
        (infrastructure stop / O-IMPEDIMENT), OR <20 targets complete
        (O-INCONCLUSIVE).

  structural_ingredients:
    - description: Joux–Vitse n−1 decomposition cost formula
      citation: KR-IC-081a58
      provenance: retrieved
      verified_by: IDEA-20261002-5ebfcd frontier_map
      role: n-1 attempt-cost baseline
    - description: Semaev S_3 chained resultant
      citation: KR-IC-5a43e5
      provenance: retrieved
      verified_by: IDEA-20261002-5ebfcd frontier_map
      role: chained-S3 attempt baseline

  asymptotic_claim: null

  dominated_by: >-
    CHECKED KR-IC-081a58 dominates as the n−1 decomposition framework; this
    record only adds a frozen ≥2× wall-time band against chained S_3 at toys.

  sota_delta:
    time: >-
      First pre-registered ≥2× band for one n−1 attempt vs two chained S_3
      attempts on RQ-BINSTD toys (distinct from S_4 comparisons).
    memory: n/a
    data_queries: n/a

  proof_search_map:
    bottleneck: >-
      Whether one n−1 attempt is ≥2× cheaper in wall time than two chained
      S_3 attempts at (n,ℓ)∈{17,19}×{3}, or whether toy n−1 systems are
      larger despite the n≥5 F_{q^n} story.
    baseline_embedding:
      parameter_slice: >-
        n=17, ℓ=3, poly basis V=span{1,t,t^2}; encoder pin encode_s3;
        ≥20 frozen targets; band 1/2 written before any timing.
      reproduction_check: >-
        Independent check.py recomputes dimVV twins, combinadic rank, and
        (when timings exist) dual medians; refuses band outcomes without
        admitted launchers; refuses band ≠ 0.5 after freeze.
    observation_collision:
      observable: 'median wall-time ratio T_n-1 / chained-S_3'
      distinct_preimage_search: >-
        A cheap-looking ratio could be (i) the n−1 vs S_3 structure (claim)
        or (ii) a pin/solver artifact. Separated by shared pin, same target
        catalog both arms, dual median aggregators, and Stage-2 random-Boolean
        matched-N_var null whose ratio should lie in [0.75, 1.25].
    constructive_transforms:
      - transform: measurement_instrument
        proposed_object: >-
          Frozen ≥2× band + dual median aggregators + launcher-probe detector
          (O-IMPEDIMENT if attempt paths absent; never a fake solver).
        predicted_gain: >-
          A decidable support/fail/impediment label for HEUR-BINSTD-5ebfcd-H1
          at toys.
    quantifier_order: >-
      FORALL cells (17,3) and (19,3): median T_{n−1} ≤ (1/2)·median chained S_3
      is PREDICTED on completed cells. NOT CLAIMED: n≥131; any exponent; any
      ECDLP solve; S_4 comparison; engine races.
    method_ceiling:
      strongest_certifiable_claim: >-
        On named toy cells, either attempt paths are absent (O-IMPEDIMENT) or
        the ≥2× wall-time band decides support/fail with dual-median agreement
        and a Stage-2 null check.
      nearby_object_control: >-
        Dual-median/combinadic/dimVV disagreement (O-ARTIFACT); <20 targets
        (O-INCONCLUSIVE); random-Boolean null outside [0.75,1.25] (O-NULL-FAIL);
        missing launchers (O-IMPEDIMENT).
    proof_obligations:
      - claim: Dual median aggregators agree on every scored arm.
        responsibility: baseline
      - claim: Combinadic twins agree on the frozen target catalog.
        responsibility: baseline
      - claim: Band 1/2 is frozen before any scientific timing.
        responsibility: baseline
      - claim: Missing n−1/S_3 attempt launchers are O-IMPEDIMENT, not O-FAIL-BAND.
        responsibility: interface
      - claim: Nothing asserted at n≥131.
        responsibility: scope

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
