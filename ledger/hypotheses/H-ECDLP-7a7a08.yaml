hypothesis:
  id: H-ECDLP-7a7a08
  question_id: RQ-CLGRP-66ab7f

  statement: >-
    SCOPE: class groups of imaginary quadratic orders at prime discriminants
    D = -p with p congruent to 3 mod 4, over a reachable measurement window of
    roughly 64 to 224 bits of the absolute discriminant, on one machine.
    CLAIM TIER measurement and extrapolation only, per RQ-CLGRP-66ab7f s declared
    claim_tier_ceiling. NO ATTACK. NO STATEMENT THAT ANY DEPLOYED PARAMETER IS
    ADEQUATE OR INADEQUATE. NO STATEMENT ABOUT ELLIPTIC CURVES OR THE ECDLP.
    NO STATUS CHANGE TO ANY RECORD.
    Two algorithm families with DIFFERENT asymptotic forms are simultaneously
    live for computing the class group - a subexponential index calculus, and a
    generic or analytic order computation - and under the record s stated cost
    model their curves cross inside the window in which any sweep this program
    can afford would take its data. The claim under test is that the crossing is
    OBSERVABLE - that racing both families on the SAME discriminants at each rung
    locates it as a measured quantity with an interval, rather than leaving it to
    be inferred from a single-regime fit.
    A single-regime fit over data spanning a crossover is misspecified, and the
    misspecification propagates into every extrapolated bit count. The
    deliverable is a statement about a cost MODEL and about the width of an
    interval, and it is nothing else.

  mechanism: >-
    A RACE, NOT A SWEEP. At each rung, run both families to completion on
    identical discriminants under identical certificate requirements, and record
    wall clock AND two machine-independent unit counters - class-group
    compositions and smoothness tests - so the crossover can be reported in units
    that do not move with implementation quality. Fit the local log-log slope per
    family per rung by finite differences over a rung spacing fixed in advance,
    and report the chord-versus-tangent bias as a stated systematic rather than
    as noise.
    THE ARITHMETIC OF THE PREDICTED CROSSING IS ELEMENTARY AND IS STATED SO IT
    CAN BE CHECKED BY HAND. With d the natural logarithm of the absolute
    discriminant, equating a subexponential form c times the square root of
    d log d against a pure power d over 4 gives d = 16 c squared times log d. The
    record does NOT assert the resulting bit numbers as security estimates; they
    set every o(1) to zero and drop all constants outside the exponent, and they
    are an illustration of how much the choice of c matters.
    WHY THE MEASUREMENT NEEDS AN INSTRUMENT WITH DEMONSTRATED DYNAMIC RANGE. A
    pipeline that reports a crossover has not shown it can find one. The design
    therefore stubs both families with the modelled asymptotics and a KNOWN
    injected crossover, sweeps the injected location over several values, and
    requires the pipeline to recover each within one rung. If it cannot recover a
    crossover known to be there at several locations, it cannot be trusted to
    report one that may not be.
    WHY A STRUCTURE-FREE NULL IS MANDATORY. The generic family s cost is supposed
    to depend on the group ORDER, not on ideal structure. A black-box abelian
    group of the same order and invariant factors, with no ideal structure and a
    calibrated operation cost, tests exactly that. Index calculus cannot run on
    it at all, and that is the point - the twin quantifies how much of the
    subexponential family s advantage is ideal structure.

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Null deliberately. NO NEW ALGORITHM AND NO ATTACK EXPONENT IS CLAIMED. The
    deliverable is a MEASUREMENT of the local exponent for two existing families
    in a declared window plus the location of their crossing. The asymptotic
    forms used to frame the prediction are all external and are cited, not
    re-derived.

  rerandomization: null

  proof_search_map:
    not_applicable_reason: >-
      A measurement and control design, not a proof-oriented proposal - no
      theorem, reduction, certificate family or new asymptotic is asserted, and
      every asymptotic form used is external. Recorded as non-applicable rather
      than omitted, per docs/inventor-protocol.md section 8. The one
      proof-adjacent element, the crossover arithmetic in the mechanism, is
      elementary, stated in full, and falsifiable by inspection.

  assumptions:
    - >-
      Both families complete with verified certificates on the same discriminants
      at each rung within the declared per-rung budget. Where one does not, that
      rung is a measurement against a non-measurement and is withdrawn; a
      budget-exhausted computation is a statement about this program s solver and
      never about the hardness of the problem (AGENTS.md core rule 5, and
      RQ-CLGRP-66ab7f s own constraint).
    - >-
      Both families are reported in unit counters as well as seconds. A crossover
      that moves by more than one rung between the two views is reported as
      IMPLEMENTATION-DETERMINED and not as an algorithmic boundary.
    - >-
      Certificate cost is counted SEPARATELY per family. The two families produce
      different natural certificates, and folding certificate cost into one
      side s timing moves the crossover.
    - >-
      ERH appears on both sides of the ledger - it underwrites the subexponential
      cost model AND the cheap correctness certificate - so the generic family is
      run in both a conditional and an unconditional configuration and the two
      are reported separately. A configuration using ERH on one side only
      corresponds to no coherent adversary model.

  heuristic_assumptions:
    - id: HEUR-CLGRP-1
      formal_statement: >-
        ASYMPTOTIC LEGIBILITY AT REACHABLE SIZE. For each family, measured cost
        at absolute discriminants in the tested window is within a factor F of
        its asymptotic form with the literature constant and o(1) set to zero,
        with F bounded and slowly varying over the window, so that finite
        differences of log cost estimate the local exponent to within the stated
        error.
      random_model_justification: >-
        The rigorous ingredient is the existence of the proved asymptotic forms
        themselves. The classical distribution statement imitated is the standard
        smoothness-density input to index calculus, which is what makes the
        subexponential form the right functional shape. THE GAP, AND IT IS LARGE
        AND IS THIS RECORD S CENTRAL WEAKNESS - over the reachable window the
        quantity inside the subexponential exponent spans only a small range, so
        an o(1) of modest size moves cost by a large factor. F IS NOT KNOWN TO BE
        SMALL and is not assumed to be.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-e70944]
      falsification_condition: >-
        Measured local exponent for either family inconsistent with EVERY
        retrieved literature row for that family at the two-sigma level across
        three consecutive rungs.
    - id: HEUR-CLGRP-2
      formal_statement: >-
        DISCRIMINANT-FAMILY REPRESENTATIVENESS. Prime discriminants D = -p with
        p congruent to 3 mod 4, sampled uniformly within each rung, have
        class-group computation cost whose dispersion at fixed size is captured
        by the per-rung sample to within the reported interval.
      random_model_justification: >-
        The rigorous ingredient is that the analytic class number formula pins
        the class number to an explicit expression, and under ERH the relevant
        L-value lies in a band of controlled width. The classical distribution
        imitated is the Cohen-Lenstra heuristic for the odd part of the class
        group. THE GAP - Cohen-Lenstra is a heuristic, and a small per-rung
        sample cannot see its tail.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-e70944]
      falsification_condition: >-
        Per-rung cost dispersion exceeding a factor of 4 between the fastest and
        slowest sample at any rung, which means the sample cannot support a
        per-rung point estimate and the design needs more samples before any fit
        is admissible.

  structural_ingredients:
    - description: >-
        The question s declared claim_tier_ceiling - measurement and
        extrapolation claims only, no computation at a deployed discriminant
        size, and no record may state that a deployed parameter is adequate or
        inadequate - and its constraint that every class group computation emits
        a certificate re-verified by an independent checker.
      citation: ledger/questions/RQ-CLGRP-66ab7f.yaml
      provenance: internal
      verified_by: >-
        coordinator subagent under TASK-20260904-c0edda, 2026-09-04, read
        ledger/questions/RQ-CLGRP-66ab7f.yaml in full (79 lines). The
        claim_tier_ceiling and constraint strings quoted here are verbatim from
        that file.
      role: the binding scope ceiling on every number this record can produce
    - description: >-
        The subexponential index-calculus row for imaginary quadratic class
        groups, its originally proved constant, and the improved constant proved
        under a generalized Riemann Hypothesis.
      citation: >-
        Hafner and McCurley (1989); Biasse and Erukulangara. RETRIEVED BY THE
        SOURCE IDEA S SESSION VIA WEB SEARCH, NOT PRIMARY-READ THERE, AND NOT
        OPENED AT ALL BY THIS AGENT. The constants are carried here only as the
        source idea records them and must be re-verified against the papers
        before any number derived from them is quoted.
      provenance: recalled
      verified_by: null
      role: sets the predicted crossover interval, conditionally
    - description: >-
        The generic and analytic rows for computing the class number - a
        conditional fourth-root-of-the-discriminant exponent and an unconditional
        square-root exponent, and a generic order algorithm applied to
        discriminants of more than 100 decimal digits.
      citation: >-
        Booker (2006); Sutherland (2007). SAME STATUS - retrieved by the source
        idea s session at abstract level, NOT PRIMARY-READ THERE, NOT OPENED BY
        THIS AGENT. The source idea flags the 100-decimal-digit feasibility datum
        as load-bearing and requiring a primary read before the experiment is
        designed; that obligation is carried forward here unresolved.
      provenance: recalled
      verified_by: null
      role: the second family s predicted exponent and the feasibility premise
    - description: >-
        The source idea s own derivation of the crossover equation and its
        illustrative bit numbers.
      citation: ledger/proposals/IDEA-20260818-ec1740.yaml
      provenance: internal
      verified_by: >-
        coordinator subagent under TASK-20260904-c0edda, 2026-09-04, read
        ledger/proposals/IDEA-20260818-ec1740.yaml in full (700 lines). The
        crossover equation is reproduced in this record s mechanism so it can be
        checked by hand; the specific bit values in that idea are NOT reproduced
        as claims here because they depend on constants this agent did not
        verify.
      role: the model arithmetic the measurement is designed to replace

  predictions:
    - metric: >-
        P1 - CORRECTNESS NULL - both families reproduce independently tabulated
        class-group invariants exactly at every rung where a tabulation exists
      direction: different
      minimum_effect: >-
        FORCED EXACT. A single mismatch voids that rung and every timing from it.
        If more than one rung is void the whole race is void.
    - metric: >-
        P2 - SYNTHETIC-ORACLE DYNAMIC RANGE - both families stubbed with the
        modelled asymptotics and a KNOWN injected crossover, the injected
        location swept over at least 4 values across the window
      direction: different
      minimum_effect: >-
        The pipeline must recover EVERY injected crossover to within one rung,
        and the recovered locations must be monotone in the injected ones.
        Recovering one injected crossover is not a pass - an instrument that
        cannot track a moving planted signal cannot report where an unplanted one
        is.
    - metric: >-
        P3 - STRUCTURELESS-TWIN NULL - a black-box abelian group of the same
        order and invariant factors with no ideal structure and a calibrated
        operation cost, run against the GENERIC family only
      direction: different
      minimum_effect: >-
        Generic-family cost on the twin must match its cost on the real class
        group to within the operation-cost calibration error. IF IT DOES NOT, the
        generic timing is driven by class-group arithmetic rather than by group
        order and the measured generic exponent is an implementation artifact.
        CONSEQUENCE PRE-DECLARED - if the twin reproduces the generic arm s WHOLE
        cost curve including its exponent, that arm is a statement about generic
        group order, not about class groups, and must be reported under that
        scope.
    - metric: >-
        P4 - observed crossover location, in bits of the absolute discriminant,
        at which measured index-calculus cost first falls below measured generic
        cost on the same discriminants, median over the per-rung samples, with a
        bootstrap interval
      direction: different
      minimum_effect: >-
        The two-regime reading predicts a crossover strictly interior to the
        sampled window. The single-regime reading predicts index calculus faster
        at EVERY rung including the lowest. These are mutually exclusive at every
        rung and the test is decided by direct comparison, not by a fit.
    - metric: >-
        P5 - locally fitted exponent of the generic family over the lowest three
        rungs (dimensionless log-log slope, with finite-difference error)
      direction: different
      minimum_effect: >-
        An observed slope inconsistent with EVERY retrieved literature row for
        that family means the implementation realises none of them and the race
        is measuring an unidentified third thing; report and stop. The specific
        literature values are re-verified at Stage 0 rather than taken from this
        record.
    - metric: >-
        P6 - IMPLEMENTATION-ASYMMETRY CONTROL - the crossover location computed
        under wall clock and under unit counts, separately
      direction: different
      minimum_effect: >-
        A crossover that moves by more than one rung between the two views is
        reported as IMPLEMENTATION-DETERMINED and NOT as a property of the
        algorithms. This is the dominant confounder and this control is the only
        thing that catches it.
    - metric: >-
        P7 - spread, in bits, of the extrapolated cost at 1024 and 2048 bits
        across the fitted and literature-constant cost models
      direction: higher
      minimum_effect: >-
        Reported as an INTERVAL, never as a point, per the question s own
        constraint. A measured spread materially smaller than the
        literature-constant spread would mean the data pin the constant more
        tightly than the published proofs do, which is a positive result for the
        cost model and must be reported as such rather than buried.

  test_boundary:
    instances: >-
      Prime discriminants D = -p with p congruent to 3 mod 4, at 6 rungs spanning
      roughly 64 to 224 bits of the absolute discriminant, at least 5
      discriminants per rung; a structureless-twin arm; a synthetic-oracle arm.
    parameters:
      rungs_bits: [64, 96, 128, 160, 192, 224]
      discriminants_per_rung: 5
      injected_crossover_locations: at least 4, spanning the window
      unit_counters: [class_group_compositions, smoothness_tests]
      erh_configurations: [conditional, unconditional]
      rung_spacing: fixed in advance; chord-versus-tangent bias computed and reported
    implementation: >-
      One index-calculus implementation and one analytic-plus-generic
      implementation, run on identical hardware with identical certificate
      requirements, plus a structureless-twin group and a synthetic cost oracle.
    budget:
      wall_clock_seconds_per_run: 21600
      maximum_memory_gb: 16
      maximum_runs: 200

  falsification_conditions:
    - >-
      F1 - a tabulated class group is not reproduced at any rung. That rung is
      void; more than one void rung voids the race.
    - >-
      F2 - the synthetic oracle does not recover every injected crossover within
      one rung. The pipeline cannot find a crossover it was told about, so its
      report about an unplanted one is inadmissible.
    - >-
      F3 - NO CROSSOVER IS OBSERVED anywhere in the reachable window and index
      calculus is faster at every rung. The two-regime claim is FALSE as stated
      at the tested scope; the residual value is the measured single-regime
      exponent and a corrected crossover estimate.
    - >-
      F4 - a crossover is observed but moves by more than one rung between wall
      clock and unit counts. It is implementation-determined and may not be
      reported as an algorithmic boundary.
    - >-
      F5 - the structureless twin does not reproduce the generic arm s cost. The
      generic timing is driven by ideal arithmetic and the measured exponent is
      an implementation artifact.
    - >-
      F6 - the structureless twin reproduces the generic arm s entire curve.
      Scope for that arm collapses to generic group order.
    - >-
      F7 - per-rung dispersion exceeds a factor of 4 at any rung. The sample
      cannot support a point estimate there and no fit is admissible until it is
      enlarged.
    - >-
      F8 - either family exhausts its per-rung budget. INFRASTRUCTURE OUTCOME
      under AGENTS.md core rule 5. Report the largest bit-length at which both
      families completed with a verified certificate; never convert it into a
      statement about the hardness of class group computation.

  interpretation_limits:
    - >-
      CLAIM TIER measurement and extrapolation only. Scoped to the tested
      discriminants, implementations, certificate standard and hardware. NOTHING
      HERE IS A STATEMENT ABOUT THE ADEQUACY OR INADEQUACY OF ANY DEPLOYED
      PARAMETER, and nothing here is a break of any deployed construction.
    - >-
      NOTHING HERE IS A STATEMENT ABOUT ELLIPTIC CURVES OR THE ECDLP. The objects
      are class groups of imaginary quadratic orders and no transfer to elliptic
      curves is claimed, implied or available.
    - >-
      Bit numbers derived from the crossover arithmetic are DERIVED FROM A COST
      MODEL, not measured. They set o(1) to zero and drop all constants outside
      the exponent. They illustrate how much the constant matters and must never
      be quoted as a security estimate.
    - >-
      The crossover, if observed, is a property of two IMPLEMENTATIONS at one
      maturity level on one machine. It bounds where a measurement programme s
      data come from; it does not establish which algorithm an adversary would
      choose.
    - >-
      NOT TESTABLE AT REACHABLE SCALE, STATED PLAINLY. Deployed discriminant
      sizes are far outside the reachable window and no computation at those
      sizes is proposed or possible here. The extrapolation to them is an
      explicitly uncertain fit whose interval is the deliverable, and the record
      does not shrink its claim to pretend the deployed regime was measured.
    - >-
      A crossover coincident with the machine memory limit is a MACHINE boundary,
      not an algorithmic one, and peak resident memory is recorded per rung for
      exactly that reason.
    - >-
      Changes no status. Any consequence for GOAL-CLGRP-001 is a Coordinator
      decision made elsewhere on committed evidence.

  status: proposed
  proposed_by: coordinator

