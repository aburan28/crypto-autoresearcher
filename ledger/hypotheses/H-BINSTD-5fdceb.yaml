hypothesis:
  id: H-BINSTD-5fdceb
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260926-120d6a
  experiment_id: EXP-BINSTD-591d28
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-397fcd
  status: rejected
  proposed_by: coordinator
  title: >-
    On ECC2K-130 at every balanced l, S_m-symmetrisation of S_{m+1} over a
    polynomial-basis subspace saturates V^{(k)} so the e-space has more
    Boolean unknowns than the plain descent; the spurious-lift factor at
    RC-1 tracks m! 2^{sum dim V^{(k)} - ml}; Frobenius extension is a77711's
    free-action null

  statement: >-
    CLAIM (structural certificate + toy validation; HOLD-X7; NO ATTACK).
    Setting: binary curves; subspace factor base V = span{1,z,...,z^{l-1}}
    in a polynomial basis; S_m-symmetrised summation-polynomial descent in
    elementary symmetric coordinates e_k in V^{(k)}. HYPOTHESIS: (A) At
    n = 131, for every balanced (m,l) in {(5,23),(5,28),(6,22),(6,24),(8,20)},
    dim V^{(k)} = min(k(l-1)+1, 131) before field reduction, so the
    symmetrised unknown count sum_k dim V^{(k)} strictly exceeds ml (e.g.
    335 vs 115 at (5,23)); without the Vieta lift the system is
    underdetermined by ≥200 unknowns and relocates the m! into that lift.
    (B) The Frobenius extension <sigma> acts freely on the union of 131
    conjugate systems (a77711 Lemma A2); invariant generators need degree
    131; the extension buys the GGMP 1/131 constant and no solving-degree
    drop (preregistered null P4). (C) At RC-1 (n=17), m=3, l in {4,5,6},
    the measured spurious factor
    (e-space solutions)/(genuine V^m decompositions) lies within a factor
    4 of m! 2^{sum dim V^{(k)} - ml}; a ratio near 1 with exact lifts is
    the surprise branch that overturns (A). (D) Size-matched random
    subspaces saturate at least as fast (P3 ≥ P1). CLAIM TIER: structural
    certificate (A)(B) + toy measurement (C)(D). NO exponent. NO ECC2K-130
    break. NO Magma/Sage/AUXIN.

  mechanism: >-
    OBJECT FRAME. Representation R1: elementary symmetric coordinates
    (e_1,...,e_m) in product spaces V^{(k)} of a polynomial-basis subspace.
    Operation set Sigma: S_m on tuples, negation, and (for B) diagonal
    Frobenius on (tuple, target). TRICHOTOMY: Class I partial-action under
    S_m (block system on ordered tuples); does not propagate under
    translation by a factor-base element. LOSSY-PROJECTION: discards
    summand ordering (m!→1); Sigma-compatible (e_k is S_m-invariant);
    lossy because the e-vector does not determine the ordered tuple. WHAT
    IS NEW: product-space saturation count at ECC2K-130's balanced l for
    m≥5; relocation of m! into the Vieta lift; spurious-lift measurement
    design at RC-1. Charged stage: per-attempt decomposition solve
    (coordinate choice), not a solve cost claim with the lift imposed.

  assumptions:
    - >-
      V is the polynomial-basis coordinate subspace (best case for
      symmetrisation; random subspaces saturate faster). Arithmetic at
      n=131; executable cells at n=17.
    - >-
      RC-1: n=17, f=t^17+t^3+1, A=97044, B=126251, #E=4*32603. Koblitz
      sibling y^2+xy=x^3+x^2+1, order 2*65587 (re-counted before use).
    - >-
      Genuine count by exact enumeration over V^m; every e-solution lifted
      by factoring X^m + e_1 X^{m-1}+...+e_m and testing roots in V.
    - >-
      OFF-LIMITS: F2 family; FGHR/JV symmetrisation (KR-IC-955fd6); small
      product spaces (KR-IC-73db3f); a77711 for Frobenius. KN-OPEN-020
      subspace class unchanged.
    - >-
      HOLD-X7 revisit_when cited Proposition B of HOLD-X5 (917981,
      consolidated into EXP-CERTBIN-a14350) and the n=17 successor of
      DEC-20260926-cb4487 NA-2. Prop B is already stated in
      IDEA-20260926-917981 (closure depends on set V and x_R). Stage 0 of
      this contract is zero-compute dimension tables that do not consume
      those results; Stage 3 (Frobenius arm) preregisters a77711's null
      and does not wait on the n=17 successor for its blocking reads.
      Residual sequencing disclosed, not waived as evidence.

  proof_search_map:
    bottleneck: >-
      Whether S_m-symmetrisation reduces the Boolean unknown count of the
      descended decomposition on a subspace base as it does on a subfield
      base; the answer is a dimension count plus a spurious-lift rate.
    baseline_embedding:
      parameter_slice: >-
        Subfield case V=F_q in F_{q^n} (IDEA-20260922-70a67c Oakley slice):
        V^{(k)}=F_q for all k, unknowns m log2 q; symmetrisation works
        (JV 2010). Same formula with V^{(k)}=V must reproduce "no
        saturation".
      reproduction_check: >-
        Symbolic on the subfield slice. Frozen fixture: at RC-1 (n=17,
        l=6, m=3) dimensions 6,11,16 by explicit Python span must match
        k(l-1)+1 exactly (P2 blocking).
    observation_collision:
      observable: dim V^{(k)} per (l,k) and spurious-lift factor per cell.
      distinct_preimage_search: >-
        A large spurious factor could be (i) the missing Vieta lift (claim)
        or (ii) an e-space solver overcount; separated by lifting each
        e-solution (factor the degree-m polynomial; test roots in V) —
        exact per solution. Instrument disagreement with enumeration →
        O-ARTIFACT.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the symmetrised equation fixed; vary constraint set: (a) e_k
          free in V^{(k)}; (b) e_k constrained by the Vieta lift (exact =
          plain system). Fibre of (a) over (b) is the spurious set.
        predicted_gain: none; certificate is that the fibre is huge.
      - transform: specialization_pack
        proposed_object: >-
          Stage-0 n=131 dimension table at balanced (m,l); RC-1 table;
          predicted spurious factors 2^{9.6}, 2^{13.6}, 2^{17.6} at l=4,5,6.
        predicted_gain: Zero-compute certificate row for the reachability table.
    quantifier_order: >-
      FORALL l≥27 and m≥5 at n=131: dim V^{(m)}=131 for the
      polynomial-basis subspace (counting, unconditional). FORALL subspace
      bases: symmetrised unknown count exceeds ml once k(l-1)+1 > l for
      some k (always for m≥2). PREDICTED at RC-1: spurious factor within
      4× of m! 2^{sum dim − ml}. Frobenius part is a77711's forall,
      preregistered null.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On ECC2K-130 at every balanced l, the S_m-symmetrised descent over
        a polynomial-basis subspace has sum_k min(k(l-1)+1, 131) Boolean
        unknowns (≥335 at m=5 vs 115 plain), and without the Vieta lift its
        RC-1 solution count exceeds the genuine count by [measured
        factor]." Certifies nothing about solving cost WITH the lift
        imposed (that is the plain system).
      nearby_object_control: >-
        Subfield slice (symmetrisation works; V^{(k)}=V) as proves-too-much;
        size-matched random subspace at RC-1 (faster saturation, larger
        spurious factor).
    proof_obligations:
      - claim: dim V^{(k)} = min(k(l-1)+1, n) for the coordinate subspace before reduction; reduction cannot raise it.
        responsibility: size
      - claim: n=131 dimension table at (m,l) in {(5,23),(5,28),(6,22),(6,24),(8,20)}.
        responsibility: correctness
      - claim: Every e-solution is lifted or refuted exactly by factoring the degree-m polynomial.
        responsibility: correctness
      - claim: Frobenius part adds nothing beyond a77711 (preregistered null P4).
        responsibility: scope
    not_applicable_reason: null

  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        (Spurious count.) The symmetrised descended equation with e_k free
        in V^{(k)} has about 2^{sum_k dim V^{(k)} − n} solutions — one
        uniformly random Boolean equation set of n equations on that many
        unknowns. Genuine count 2^{ml−n}/m! is conservation; spurious
        factor ≈ m! 2^{sum dim − ml}.
      random_model_justification: >-
        Uniform-fibre statement for a polynomial map F_2^N → F_2^n with
        N>n having fibres of size about 2^{N−n}. Dimension count in (A) is
        exact and needs no heuristic.
      supporting_results:
        - KN-FIND-007 conservation (internal); IDEA-20260926-120d6a H1.
      validation_experiment_ids: [EXP-BINSTD-591d28]
      falsification_condition: >-
        P1 outside [1/4, 4] of the formula at two of three l at RC-1 with
        lift_agreement=1.0 → H1 false at tested scale; if P1 near 1,
        certificate (A) overturned (O-SURPRISE).
    - id: H0
      formal_statement: >-
        NONE FOR (A) DIMENSION COUNT AND (B) FROBENIUS FREE ACTION. Finite
        linear algebra over F_2 and a77711 Lemmas A1–A3.
      random_model_justification: Exact counting; Noether bound attained by orbit product (a77711 A3).
      supporting_results:
        - IDEA-20260906-a77711; product-space dimension formula (exact for coordinate subspaces).
      validation_experiment_ids: [EXP-BINSTD-591d28]
      falsification_condition: >-
        P2 not exact → formula wrong. Replicated P4 drop on Koblitz absent
        on ordinary null → a77711 A2 fails at this cell (report for review).

  predictions:
    - metric: P1_spurious_factor
      direction: higher
      minimum_effect: >-
        Within factor 4 of m! 2^{sum dim V^{(k)} − ml} at RC-1 m=3,
        l in {4,5,6} (predicted 2^{9.6}, 2^{13.6}, 2^{17.6}); factor below
        8 at l=6 is the surprise branch.
    - metric: P2_product_space_dims
      direction: same
      minimum_effect: exactly min(k(l-1)+1, 17) at RC-1 for k=1..3, l=4..9.
    - metric: P3_random_subspace_spurious_factor
      direction: higher
      minimum_effect: at least the polynomial-basis P1 value (faster saturation).
    - metric: P4_frobenius_orbit_closure_ratio
      direction: same
      minimum_effect: >-
        Preregistered NULL: no drop of W_4 work / first-iteration on the
        Koblitz 17-conjugate orbit vs 17× one instance; ordinary RC-1 with
        17 unrelated targets is the null. A replicated Koblitz-only drop is
        a77711 F2, reported for review.
    - metric: lift_agreement
      direction: same
      minimum_effect: exactly 1.0 (blocking); any disagreement → O-ARTIFACT.

  test_boundary:
    instances:
      - stage0_tables: >-
          Zero-compute n=131 dimension table at balanced (m,l); RC-1
          dimension table; predicted spurious factors; subfield-slice
          symbolic baseline; freeze preregistered-predictions.json before
          Stage 1.
      - stage1_symmetrised_descent: >-
          Build symmetrised S_4 in (e_1,e_2,e_3,x_R); descend with e_k over
          V^{(k)}; exhaustive e-space count at l in {4,5}; at l=6 sample
          2^24 assignments + closure.py lower bound; lift every e-solution;
          exact enumeration over V^3 as ground truth; report P1, P2,
          lift_agreement. 50 subgroup targets, seed 2026092731.
      - stage2_random_null: >-
          Repeat Stage 1 with a size-matched random subspace (P3).
      - stage3_frobenius_arm: >-
          Koblitz sibling, V=ker g(sigma) dim 8 (stable); compare W_4 work
          and first-iteration for one target vs 17-conjugate orbit;
          ordinary RC-1 with 17 unrelated targets as null (P4).
    parameters:
      n_primary: 17
      m_toy: 3
      l_cells: [4, 5, 6]
      l_koblitz_stable: 8
      n_targets: 50
      n_koblitz_targets: 5
      seed: 2026092731
      p1_band_factor: 4
      p1_surprise_threshold_l6: 8
      sample_assignments_l6: 16777216
    implementation: >-
      experiments/EXP-BINSTD-591d28/implementation/ wrapping
      EXP-CERTBIN-e94b27/impl/{macaulay,closure,gf2n,curve}.py under
      write_scope. NEW: symmetrised S_4 builder, e-space enumerator with
      lift-by-factoring, Frobenius-stable subspace constructor (~400 lines).
      Pure Python; numpy optional. No Magma/Sage; no AUXIN; no Bedrock.
    budget:
      maximum_runs: 4
      total_cpu_hours_advisory: 8.0
      wall_clock_seconds_advisory: 28800

  falsification_conditions:
    - 'P1 outside [1/4, 4] of the formula at two of three l (with lift_agreement=1): H1 false at tested scale.'
    - 'P1 within factor 8 of 1 at l=6 with lift_agreement=1: symmetrised equation enforces Vieta lift; (A) overturned (O-SURPRISE).'
    - 'P2 not exact: product-space formula wrong; corrected before use (O-ARTIFACT if instrument, O-NEGATIVE if math).'
    - 'lift_agreement < 1.0 on any genuine decomposition: instrument defect (O-ARTIFACT).'
    - 'P4 shows replicated closure-work drop on Koblitz absent on ordinary null: a77711 A2 fails at this cell; report for review.'
    - 'Claiming any ECDLP speedup, exponent move, or ECC2K-130 break under this card.'

  interpretation_limits:
    - NO ATTACK, NO EXPONENT. Structural certificate with toy validation.
    - Does NOT say symmetrisation is useless on subfield bases (Oakley) or that FGHR torsion symmetrisation is closed beyond 29b1c5.
    - Does NOT price solving cost with the Vieta lift imposed (that is the plain system).
    - KN-OPEN-020 subspace class: scoped-out; unchanged.
    - n=131 dimension counts are arithmetic; only the direction of the spurious count transfers, and the certificate's dimension count needs no heuristic.

  distinguishable_outcomes:
    - id: O-POSITIVE
      meaning: >-
        P1 within band, P2 exact, P3≥P1, P4 null, lift_agreement=1 →
        symmetrisation row of the m≥5 reachability table entered as "no
        unknown reduction on subspace bases at ECC2K-130's balanced l;
        Frobenius part constant 1/131".
    - id: O-SURPRISE
      meaning: >-
        P1 near 1 with exact lifts → symmetrised equation carries the lift;
        certificate withdrawn; symmetrised descent re-priced (Boolean
        degree ~ m 2^{m-1} named as next obstruction).
    - id: O-NEGATIVE
      meaning: >-
        P1 outside band at two of three l (not near 1) or P3 < P1 →
        formula/null reading fails; report measured values; do not enter
        the certified row.
    - id: O-ARTIFACT
      meaning: >-
        lift_agreement failure, P2 inexact from instrument error, or C-BASE
        fixture mismatch → run void; says nothing about (A).
    - id: O-IMPEDIMENT
      meaning: >-
        Infra/budget abort; never negative mathematical evidence
        (AGENTS.md rule 3).

