hypothesis:
  id: H-ICPERF-a2284c
  question_id: RQ-ICPERF-94c86e
  status: specified
  proposed_by: coordinator
  statement: A fixed-window repeated-base generator for aP+bQ can reduce complete
    native toy-IC solve time on the fixed public workload after charging setup and
    final verification.
  mechanism: Cache digit multiples of the same P and Q; retain identical seeded a,b
    targets so decomposition, relation ordering and elimination are unchanged.
  assumptions:
  - Prime-order public toy curves generated by the bound package.
  - The scalar ranges and group law are unchanged.
  - No amortization across independent solves; each candidate builds and pays for
    its own table.
  proof_search_map:
    not_applicable_reason: Empirical implementation comparison; algebraic correctness
      is independently checked, but no new theorem, attack bound or asymptotic claim
      is proposed.
  asymptotic_claim: null
  predictions:
  - id: P-target
    metric: complete_solve_seconds
    direction: lower
    minimum_effect: C-target gate in the prospective frozen experiment; no measured
      effect exists yet.
  test_boundary:
    instances: 9 public generated prime-order toy curves; 18 curve/solver-seed cells
    parameters:
      bits:
      - 12
      - 14
      - 16
      curve_seeds:
      - 0
      - 1
      - 2
      solver_seeds:
      - 0
      - 1
      repetitions: 3
      m: 2
      factor_base: small_x
      engine: mitm
      accelerate: false
      harvest: 'off'
      window: 4
      arms:
      - reference_a
      - fixed_window
      - reference_b
      worker_timeout_seconds: 60
      bootstrap_replicates: 5000
      bootstrap_seed: 3065
    implementation:
    - tools/ic_target_benchmark.py
    - src/crypto_autoresearcher/__init__.py
    - src/crypto_autoresearcher/index_calculus/__init__.py
    - src/crypto_autoresearcher/index_calculus/__main__.py
    - src/crypto_autoresearcher/index_calculus/_accel.py
    - src/crypto_autoresearcher/index_calculus/curve.py
    - src/crypto_autoresearcher/index_calculus/decompose.py
    - src/crypto_autoresearcher/index_calculus/factor_base.py
    - src/crypto_autoresearcher/index_calculus/harvest.py
    - src/crypto_autoresearcher/index_calculus/linalg.py
    - src/crypto_autoresearcher/index_calculus/msolve.py
    - src/crypto_autoresearcher/index_calculus/polyfp.py
    - src/crypto_autoresearcher/index_calculus/rho.py
    - src/crypto_autoresearcher/index_calculus/semaev.py
    - src/crypto_autoresearcher/index_calculus/solver.py
    - src/crypto_autoresearcher/index_calculus/stats.py
    - src/crypto_autoresearcher/index_calculus/tails.py
    - src/crypto_autoresearcher/index_calculus/targets.py
    - src/crypto_autoresearcher/index_calculus/wide_tails.py
    budget:
      maximum_workers: 1
      maximum_memory_gb: 1
  falsification_conditions:
  - A valid complete paired workload has geometric speedup <= 1.
  - Any same-seed target or relation differs, or independent recovery verification
    fails (implementation correctness failure, not mathematical impossibility).
  interpretation_limits:
  - Only 12-, 14- and 16-bit prime-field curves, m=2, small_x, mitm, no vector acceleration,
    harvest off.
  - No production-curve, Pollard-rho, exponent, frontier or measured-bound claim.
  - Wall time is a machine observation and not a cryptanalytic work bound.
