  statement: A complete qualifying public pipeline can improve verified cold-start ECDLP recovery cost over the
    current matched IC baseline on at least one fresh prime-subgroup toy size, under the predeclared simultaneous
    control rule.
  mechanism: Combine an admitted source-labelled constructor and optional selector with full relation solving, blind
    target descent and independent scalar verification; charge every phase and compare the exact current baseline.
    No new algorithm is supplied by this statement.
  assumptions:
  - Exact finite inputs and public algorithms are fixed before trials.
  - Independent checks validate source equations and all required controls.
  - No target/factor-base scalar oracle, uncharged advice or rejected-attempt omission.
  predictions:
  - metric: Blind verified complete IC cost over fresh subgroup-size strata
    direction: lower
    minimum_effect: A qualifying pipeline yields lower fully charged S than the current matched baseline in at least
      one size under the simultaneous interval/control rule. No effect magnitude, sub-rho result or exponent is
      predicted.
  - metric: Public-input recovery and source verification
    direction: lower
    minimum_effect: Every claimed k_hat verifies on the original source and no source/target secret is supplied
      to the attack.
  test_boundary:
    instances:
    - Ten independent fresh public instances per subgroup-bit size; three paired seeds [0,1,2] per instance. Total
      40 curves and 120 seed-paired workloads per arm; seeds are not independent instances.
    parameters:
      stage: E
      specification: experiments/EXP-ECDLP-e193fa/specification.yaml
      replication:
        seeds:
        - 0
        - 1
        - 2
        independent_instances: 40
      scope: toy finite family; no deployed curve extrapolation
    implementation: Unimplemented exact candidate/interface obligations listed in specification.approval_blockers.
    budget:
      enforcement: advisory
      wall_clock_seconds_per_run: null
      total_cpu_hours: null
      maximum_memory_gb: 2
      maximum_runs: null
      maximum_workers: 1
  falsification_conditions:
  - 'P-E-total/C-E-total: no predeclared size meets the complete-S improvement rule on a valid fully completed panel;
    this bounds only this pipeline and tested population. P-E-recovery/C-E-source: any reproducible incorrect answer
    challenges that implementation. Failed controls, censored solves or missing admission are indeterminate/infrastructure,
    not mathematical evidence of impossibility or security.'
  interpretation_limits:
  - 'Design only: no scientific run, measured gain, new asymptotic exponent, novelty certificate or security conclusion.'
  - The unsourced historical 32-cover quotation is not an input catalog; no identification or completeness claim
    is made.
  - P1546 remains a scoped fixed-branch counting gate; this design does not execute or reopen the IDEA-002 frozen
    contract.
  - A cover, Frobenius overlap, auxiliary cancellation or faster known-scalar multiplication alone does not solve
    ECDLP.
  - Missing code, access, admission or verification is an implementation/infrastructure impediment, not mathematical
    falsification.
  - This initial proposed record is not an official approval or evidence-supported hypothesis transition.
