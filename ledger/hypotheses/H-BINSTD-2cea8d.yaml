# =============================================================================
# H-BINSTD-2cea8d -- Matched-density normal- vs polynomial-basis HW-filter
# Semaev m=2 yield on toy Koblitz. Specified from IDEA-20261001-d53638
# under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001. Approved DEC-20261003-a9a886.
# ZERO RUNS in this design packet. Stages 0-1 authorized. No AUXIN.
# No Bedrock. Claim tier: observational / composition. No attack / exponent.
# IDEA-20261001-d53638 claim text is not edited.
# =============================================================================
hypothesis:
  id: H-BINSTD-2cea8d
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261001-d53638
  experiment_id: EXP-BINSTD-88a926
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-03'
  approved_at: '2026-10-03'
  authorised_by: DEC-20261003-a9a886
  status: approved
  proposed_by: coordinator
  title: >-
    At matched Hamming-weight density on toy Koblitz n=17, does a
    normal-basis HW≤c pool change Semaev m=2 mitt yield versus a
    polynomial-basis HW≤c pool of equal size (uniform control; no walk)?

  statement: >-
    CLAIM (composition measurement / observational; NO ATTACK; NO EXPONENT).
    Setting: binary Koblitz analog E: Y^2+XY=X^3+1 over F_{2^n} at n=17
    (Stage 1). Freeze cutoffs (c_nb, c_pb) so binomial HW densities match
    within 10% and build equal-size pools by rejection sampling only:
    (A) type-2-normal-basis analog HW(x)≤c_nb; (B) polynomial-basis
    HW(x)≤c_pb; (C) uniform size-matched control. Run identical dual-route
    mitt Semaev m=2 search (≥200 attempts/arm; Route A table-field hash
    lookup; Route B schoolbook P+Q re-verify; certificate.kind=
    decomposition). Pre-registered null HEUR-BINSTD-d53638-H1: all pairwise
    yield ratios among {A,B,C} lie in [0.7,1.4]. A single-cell out-of-band
    ratio is O-FAIL-BAND, not H_alt (replication at a second n is Stage 2
    and is NOT authorized under this card). Uniform-arm inline M2/M1
    relative error >0.5 on both formulas makes out-of-band ratios
    O-INCONCLUSIVE (instrument), not H_alt. NO walk. NO break.

  mechanism: >-
    OBJECT FRAME from IDEA-20261001-d53638. Representation R1: the same
    curve point's x-coordinate in two F_2-bases (normal vs polynomial).
    Operation set Sigma: F2 mitt translation by pool elements (Class I).
    The HW filter is sampling, not propagation (lossy-projection named;
    Sigma-compatibility not claimed for the filter). OFF-LIMITS: F2 as
    relation search; F1 unused. WHAT IS NEW vs EXP-BINSTD-a3cfee: walk
    removed; BASIS is the independent variable at matched density.
    Dual meters: TableField mitt vs schoolbook re-add.

  assumptions:
    - Matched binomial density within 10% is an adequate control.
    - Uniform mitt baseline is an instrument check (inline M1/M2), not an
      attack. Out-of-band pairwise ratios are not H_alt unless that check
      passes (min relative error ≤0.5 on at least one of M1,M2).
    - No walk; rejection sampling only.
    - Toy cell only under this card; Stage 2 n=23 is specified but not
      authorized.
    - certificate.kind=decomposition with independent schoolbook re-verify
      for every counted hit.

  predictions:
    - metric: yield_ratio_normalHW_over_polyHW
      direction: different
      minimum_effect: 'in [0.7,1.4] under H1; out-of-band at n=17 is O-FAIL-BAND not H_alt'
    - metric: certificate_pass_rate
      direction: higher
      minimum_effect: '1.0'
    - metric: density_rel_err
      direction: lower
      minimum_effect: '≤ 0.10'
    - metric: twin_add_agreement
      direction: same
      minimum_effect: 'table-field add equals schoolbook add on every counted hit'

  test_boundary:
    instances:
      - 'Stage 0: freeze (c_nb,c_pb,N), density match, dual #E, empty-pool null, twin add'
      - 'Stage 1 authorized: n=17 three-arm mitt ≥200 attempts, N=96, c=4'
    parameters:
      field_degree_n: 17
      curve: Y^2+XY=X^3+1
      attempts: 200
      pool_size_N: 96
      cutoff_c_nb: 4
      cutoff_c_pb: 4
      yield_ratio_band: [0.7, 1.4]
      density_match_max: 0.10
      walk: false
    implementation: >-
      Pure Python under experiments/EXP-BINSTD-88a926/implementation/;
      command surface implementation/run.py driven by trial-plan.json
      (byte-identical to trial-plan-v1.json). Dual meters in mitt.py.
      No Magma/Sage/AUXIN/Bedrock.
    budget:
      wall_clock_seconds: 7200
      memory_gb: 2
      maximum_runs: 4

  falsification_conditions:
    - Reporting H_alt from the single Stage-1 cell.
    - Running with density mismatch >10% without disclosure.
    - Retuning [0.7,1.4] after Stage 1 without protocol_amendment.
    - Using a walk as a pool source.
    - certificate_pass_rate < 1.0 on counted hits (O-ARTIFACT).
    - Twin table vs schoolbook add disagreement (O-ARTIFACT).
    - Empty-pool null produces a hit (O-ARTIFACT).
    - Claiming a break or exponent from toy ratios.

  distinguishable_outcomes:
    - id: O-SUPPORT
      meaning: >-
        Twin OK; certs pass; density match; empty-pool 0; uniform instrument
        OK; all pairwise yield ratios in [0.7,1.4] at n=17. H1 not rejected
        at this cell. No attack claim.
    - id: O-FAIL-BAND
      meaning: >-
        Twin OK; certs pass; density match; uniform instrument OK; at least
        one pairwise ratio outside [0.7,1.4] at n=17. Single-cell surprise;
        not H_alt (no second-n replication under this card).
    - id: O-INCONCLUSIVE
      meaning: >-
        Uniform-arm min(relerr_M1, relerr_M2) > 0.5, so pairwise ratios are
        not read as H1 support or fail.
    - id: O-ARTIFACT
      meaning: Twin disagreement, certificate fail, empty-pool hit, density freeze fail, or walk used.
    - id: O-IMPEDIMENT
      meaning: >-
        Infrastructure timeout/crash/missing Stage-0 freeze. Never negative
        evidence against H-BINSTD-2cea8d.

  interpretation_limits:
    - Toy composition measurement only; does not transfer to ECC2K-130.
    - Stage 2 n=23 replication is not authorized under this card.
    - Does not re-test EXP-BINSTD-a3cfee walk-vs-HW; walk is excluded.
    - Uniform M1/M2 check is an instrument gate, not a mitt-calibration claim
      (that claim belongs to IDEA-20261001-5e859e / EXP-BINSTD-0f2222).
    - No break; no exponent.

  heuristic_assumptions:
    - id: HEUR-BINSTD-d53638-H1
      formal_statement: >-
        FORALL tested toy cells: pairwise yield ratios among
        {normal-HW, poly-HW, uniform} lie in [0.7,1.4] at m=2 when densities
        match within 10% and pool sizes are equal.
      random_model_justification: >-
        Rigorous ingredient: Hamming weight in any fixed F_2-basis of an
        n-bit string is Binomial(n,1/2) under the uniform measure on field
        elements. Classical: basis change is an F_2-linear automorphism, so
        weight distributions agree in law for uniform field elements.
        Heuristic transfer: Semaev decomposability is a statement about
        curve arithmetic, conjectured independent of the bit-level weight
        predicate once density is matched.
      supporting_results:
        - IDEA-20261001-d53638
        - KN-LIT-661e97
        - EXP-BINSTD-a3cfee
      validation_experiment_ids:
        - EXP-BINSTD-88a926
      falsification_condition: >-
        A pairwise ratio outside [0.7,1.4] at the authorized n=17 cell with
        certificates intact, density match, and uniform instrument OK
        (O-FAIL-BAND). H_alt requires a second independently seeded cell
        not authorized here.

  asymptotic_claim: null

  dominated_by: >-
    CHECKED: not an attack row. Rho and IC records dominate any attack
    reading. As a composition measurement it is not dominated by
    EXP-BINSTD-a3cfee (different confounder: basis vs walk).

  sota_delta:
    time: zero attack delta
    memory: zero
    data_queries: >-
      First matched-density normal- vs polynomial-basis HW-filter Semaev
      m=2 yield bake-off in this program (walk removed).

  proof_search_map:
    bottleneck: >-
      Whether the BASIS of a matched-density HW filter (normal vs
      polynomial) moves Semaev m=2 mitt yield relative to a uniform
      control, after removing the Bailey-walk confounder isolated by
      EXP-BINSTD-a3cfee.
    baseline_embedding:
      parameter_slice: >-
        n=17, E: Y^2+XY=X^3+1, N=96, attempts=200, c_nb=c_pb=4, no walk;
        dual #E and empty-pool null frozen before any yield ratio is read.
      reproduction_check: >-
        Independent check.py recomputes schoolbook #E at Stage 0, binomial
        densities, and schoolbook P+Q==R on a Stage-1 hit example; re-checks
        in_band_nb_pb polarity against the frozen [0.7,1.4] band.
    observation_collision:
      observable: 'pairwise yield ratios among {normal-HW, poly-HW, uniform}'
      distinct_preimage_search: >-
        An out-of-band ratio could arise from (i) basis-dependent
        decomposability (H_alt, not claimed from one cell), (ii) residual
        density mismatch (gated at 10%), (iii) mitt-instrument misspecification
        (uniform M1/M2 gate), (iv) certificate/twin artifact. Separated by
        dual-route re-verify, density freeze, empty-pool null, and the
        uniform instrument gate.
    constructive_transforms:
      - transform: measurement_instrument
        proposed_object: >-
          Three-arm matched-density HW-filter mitt with dual-route
          arithmetic and no walk.
        predicted_gain: >-
          A scoped in-band or out-of-band reading at n=17 so a later n=23
          replication can decide H_alt without the walk confounder.
    quantifier_order: >-
      FORALL the authorized Stage-1 cell at n=17: pairwise ratios are
      PREDICTED to lie in [0.7,1.4]. NOT CLAIMED: n=23 under this card;
      H_alt; any attack; any exponent.
    method_ceiling:
      strongest_certifiable_claim: >-
        On the named Stage-1 toy cell, measured pairwise yield ratios lie
        inside or outside the frozen [0.7,1.4] band, with twin agreement
        and certificate_pass_rate=1.
      nearby_object_control: >-
        Empty pool (must give zero hits); uniform arm (instrument);
        twin disagreement (artifact). n=23 replication not authorized.
    proof_obligations:
      - claim: Dual #E (table vs schoolbook trace-count) agrees.
        responsibility: baseline
      - claim: Schoolbook P+Q equals R on every counted hit.
        responsibility: correctness
      - claim: Empty pool yields zero hits.
        responsibility: baseline
      - claim: Density match ≤10% is frozen before Stage 1.
        responsibility: baseline
      - claim: No walk is used as a pool source.
        responsibility: interface
      - claim: Band polarity uses the frozen [0.7,1.4] interval.
        responsibility: success_probability
      - claim: Nothing asserted as an attack or exponent.
        responsibility: scope

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
