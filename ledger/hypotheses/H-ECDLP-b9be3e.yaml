        2026-10-04. The gaps, the product, and the sum were
        recomputed in this design session. That computation is
        not a run.
      reproduction_check: >-
        One route reads the bits of 511. The other counts the
        doublings and additions. They must agree that the counts
        are 9, 8, and 8.
    observation_collision:
      observable: The addition count 8 and the product 576.
      distinct_preimage_search: >-
        Reporting the addition count as 9 drops the gap against
        the bit length. Two readings of the addition count make
        that gap 0.
    constructive_transforms:
