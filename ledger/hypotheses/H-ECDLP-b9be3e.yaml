  title: >-
    The integer 511 has 8 doublings and 8 additions
  statement: >-
    The integer 511 has bit length 9. Its bits are 1, 1, 1, 1, 1, 1,
    1, 1, and 1. Reaching it by doubling and adding uses 8 doublings
    and 8 additions. Nine exceeds eight by 1. Eight equals eight, so
    that gap is 0. The product of 9, 8, and 8 is 576. Their sum is 25.
    Two readings of the addition count are both 8, so that gap is 0
    and their product is 64.
  mechanism: >-
    The proposal writes the counts 9, 8, and 8. This contract
    checks those integers. It does not add a curve point.
  assumptions: []
