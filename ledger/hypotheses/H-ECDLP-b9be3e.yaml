        proposed_object: The counts 9, 8, and 8.
        predicted_gain: Integer counts. No curve addition.
    quantifier_order: >-
      The bit length 9 comes first, then the doubling count 8,
      then the addition count 8, then the nearby gap 0.
    method_ceiling:
