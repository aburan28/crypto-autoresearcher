        The counts 9, 8, and 8. Not a scalar multiplication.
      nearby_object_control: >-
        Two readings of the addition count. Both are 8, and the gap is 0.
    proof_obligations:
      - claim: The bit length of 511 is 9.
        responsibility: correctness
      - claim: The doubling count is 8 and the addition count is 8.
