  title: >-
    The probe ratio 2 exceeds the blind ratio 1 by 1
  statement: >-
    Discriminant -419 has 9 reduced binary quadratic forms. The
    written bit length of that class number is 4. Two to the power
    ceil of the square root of 4 is 4. With the oracle factor 1, the
    probe cost at memory cap 2 is 8 and the probe cost at memory cap
    4 is 4, so their ratio is 2. The memory-blind ratio is 1. Two
    exceeds one by 1. The product of 2 and 1 is 2. Their sum is 3.
    Two readings of the blind ratio are both 1, so that gap is 0
    and their product is 1.
  mechanism: >-
    The proposal writes the class number of discriminant -419 and
    the probe formula. This contract checks those integers. It does
    not run a hidden-shift probe.
  assumptions: []
  proof_search_map:
    bottleneck: The ratio gap 1.
    baseline_embedding:
      parameter_slice: >-
        The class number 9, the memory cap 4, and the ratios 2 and 1
        in IDEA-20261005-1896e8, read 2026-10-07. The forms, the
        powers, and the costs were recomputed in this design session.
        That computation is not a run.
      reproduction_check: >-
        One route counts the reduced forms of discriminant -419. The
        other evaluates the written costs at caps 2 and 4. They must
        agree that the class number is 9 and the probe ratio is 2.
    observation_collision:
      observable: The probe ratio 2 and the blind ratio 1.
      distinct_preimage_search: >-
        Reporting both ratios as 1 drops the gap. Two readings of
        the blind ratio make that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The ratios 2 and 1.
        predicted_gain: Integer gap. No hidden-shift probe.
    quantifier_order: >-
      The class number 9 comes first, then the memory cap 4, then
      the probe ratio 2, then the blind ratio 1.
    method_ceiling:
      strongest_certifiable_claim: >-
        The class number 9 and the ratios 2 and 1. Not a CSIDH security level.
      nearby_object_control: >-
        Two readings of the blind ratio. Both are 1, and the gap is 0.
    proof_obligations:
      - claim: Discriminant -419 has 9 reduced forms.
        responsibility: correctness
      - claim: The probe ratio at caps 2 and 4 is 2.
        responsibility: correctness
      - claim: The blind ratio is 1.
        responsibility: scope
    not_applicable_reason: null
