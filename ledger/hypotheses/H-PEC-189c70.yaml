hypothesis:
  id: H-PEC-189c70
  question_id: RQ-SSI-001
  source_idea: IDEA-20260803-48e258
  title: >-
    The crossover locus p*(w) is conditioned on the SIGN of this campaign's
    modelled margin, which BATCH-003 established as robust, rather than on its
    MAGNITUDE, which BATCH-003 established as not robust - so the locus can be
    reported conclusively where the scalar margin cannot
  class: assessment_reporting_object

  statement: >-
    Reporting this campaign's own modelled comparison as a CROSSOVER LOCUS
    p*(w) - the field size at which the corrected p^(1/3+o(1)) cost curve, as
    charged by this campaign, crosses this campaign's own frozen
    Delfs-Galbraith / van Oorschot-Wiener middle-memory baseline, as a function
    of the memory budget w - yields a decidable object where the scalar margin
    at the single committed point (NIST-I, w = 2^30) does not. The scalar's
    committed band is [8.3498, 13.1544] bits across all eighteen measured-gamma
    readings (EV-PEC-857664 OBS-M), and once assumption L4 is admitted the
    defensible span widens to [8.3498, 22.2927] (width 13.9429) at alpha = 1
    throughout or [8.3498, 24.9708] (width 16.6210) allowing
    alpha in {0, 1, alpha_hat} - four to seven times the 2.2309-bit and
    3.5133-bit irreproducibility bands (EV-PEC-857664 OBS-M;
    DEC-20260802-48c72c completion_criteria_assessment.criterion_1). A quantity
    whose band exceeds its own value cannot be anything but INCONCLUSIVE. The
    SIGN of that same quantity is nonetheless robust: the worst of the eighteen
    readings clears the 2.2309-bit band by 6.1 bits and the 3.5133-bit band by
    4.8 bits (DEC-20260802-48c72c
    official_positions_after_this_decision.concrete_threat_nist1). A crossover
    is a SIGN CHANGE. THIS HYPOTHESIS IS THAT THE LOCUS THEREFORE INHERITS THE
    ROBUST PART OF THE COMMITTED UNCERTAINTY AND NOT THE UNROBUST PART, and
    that its band, expressed as a fraction of its own value in log2(p), is
    narrower than the margin band is as a fraction of the margin at the matched
    w = 2^30 point.
  statement_is_not: >-
    This is NOT a claim about the security of any deployed parameter set, NOT a
    cryptanalytic improvement, and NOT a statement about the attack that any
    number here does not already say at w = 2^30. It is a claim about the
    CONDITIONING OF A REPORTING OBJECT. If it is false, the honest deliverable
    is that the curve buys nothing over the scalar (falsification condition F2).

  mechanism: >-
    THE TWO COSTS SCALE DIFFERENTLY IN p, SO THEIR RATIO IS MONOTONE AND ITS
    ZERO CROSSING IS A FUNCTION OF w. The assessed method is charged at
    p^(1/3+o(1)) with a large measured overhead; the matched baseline is charged
    at p^(1/2) with a memory-dependent van Oorschot-Wiener term. This
    campaign's committed model writes the comparison as
    margin(w) = 128 - (108.73088958800618 - 0.5*log2(w) + overhead_bits) at
    NIST-I (EV-PEC-857664 OBS-M, which cites log2 T_full =
    108.73088958800618, T_DG = 2^128 and log2 B_opt = 14.2 to
    RUN-WESOVOW-001), with base margin 34.2691 at zero overhead.
    WHY THE SAME UNCERTAINTY IS BADLY CONDITIONED FOR A MARGIN AND WELL
    CONDITIONED FOR A CROSSING. A margin evaluated at one p inherits the FULL
    WIDTH of the overhead band as an additive error in bits. A crossing point
    inherits only how fast the ratio moves through zero, which is governed by
    the DIFFERENCE of the two exponents rather than by either of them. That is
    the entire mechanism and it is elementary; the contribution claimed here is
    recognising that the campaign's committed uncertainty has this shape, not
    the calculus.
    WHY THE MECHANISM IS ALSO THE HYPOTHESIS'S OWN LARGEST RISK. The same
    division that narrows the band in log2(p) can widen it without bound as the
    exponent difference is charged at smaller and smaller effective values, and
    the divisor is exactly the quantity the campaign has NOT measured across p:
    the p-scaling exponent alpha of the overhead law carries the
    MECHANISM-INCONSISTENT designation from the FC-4 firing on
    ell in {3,5,7,11,13} (gap 0.1661896244 > 0.15; EV-PEC-857664 OBS-K), later
    retired BY MEASUREMENT only within the operating range ell in
    {47,101,151,211} (GOAL-P13-001 batch_checkpoints BATCH-403f13 outcome), and
    the fits themselves stand at a SINGLE p = 1099511627563. A locus in p built
    on a single-p fit is therefore conditioned by a declared heuristic, not by
    an interpolation, and the contract must say so on the object rather than in
    a footnote.
    THE L4 TERM IS WHERE A CURVE CAN BEAT A POINT WITHOUT NEW COMPUTE. Batched
    or quasi-linear evaluation removes the gamma*log2(B_opt) term: 11.502 bits
    of a 21.233-to-23.911-bit total for S-B/S-MIN W-MID, and 13.247 bits of a
    22.545-to-25.223-bit total for S-A W-MID - 48 to 59 per cent, and still the
    single largest residual term (EV-PEC-857664 OBS-L). As a point estimate that
    is a two-valued ambiguity sitting on top of an already-inconclusive margin.
    As a scenario pair on a locus it is two loci, and if both fall on the same
    side of the pre-registered threshold the ambiguity is DISCHARGED FOR THIS
    QUESTION without building the subroutine.

  assumptions:
    - id: A-COMMITTED-ONLY
      statement: >-
        Every input is a number read out of a committed record of this
        repository, or transcribed from a primary source with a quoted excerpt
        and a hash. No number is invented, recalled, or interpolated beyond its
        fitted window. A required quantity that is neither committed nor
        transcribable makes the corresponding segment UNDEFINED rather than
        estimated (AGENTS.md rule 9).
    - id: A-C-AS-BRACKET
      statement: >-
        c is used ONLY as the bracket - NIST-I [1.327077, 1.576444] and the four
        further per-field-size rows of DEC-20260802-48c72c citability_ruling -
        with all eight mandatory attachments MA-1..MA-8, and NEVER as a single
        number. The permanent prohibition SP-1 on citing c = 0.864 (and 0.771 /
        0.868 / 1.0389 / the c_kappa values) binds without exception, and the
        bracket is labelled a span across two declared modelling choices rather
        than a confidence interval.
    - id: A-FC4-STANDS-WHERE-IT-FIRED
      statement: >-
        The FC-4 MECHANISM-INCONSISTENT designation STANDS on the ell set it
        fired on, {3,5,7,11,13} (EV-PEC-857664 OBS-K; DEC-20260802-48c72c
        adjudication E, SP-10), and is retired BY MEASUREMENT only within
        ell in {47,101,151,211} (GOAL-P13-001 BATCH-403f13 outcome). Every
        alpha = 1 and alpha = alpha_hat locus inherits the label at the ell
        where the label still stands. SEPARATELY BINDING: the two frozen
        contracts under which that retirement was run,
        experiments/EXP-P13-NC2b/specification.yaml and
        experiments/EXP-P13-NC2d/specification.yaml, DO NOT CURRENTLY PARSE
        (defect D-8, GOAL-P13-001 head_correction_20260810 and BATCH-403f13
        outcome), so the retirement may not be cited as contract-verified until
        D-8 is repaired.
    - id: A-L2-SIGNED-NOT-ABSORBED
      statement: >-
        The charging point at ell = B_opt overstates the entry-weighted cost by
        0.60 to 1.00 bits at every field size (EV-PEC-857664 OBS-J: exact
        enumeration 0.598 at (X,B) = (10^7,100) and 0.625 at (10^8,215) for
        gamma 0.810, Dickman 0.868 at NIST-I and 0.899 at log2 p = 768). That
        overstatement is carried as an explicit SIGNED correction on every
        emitted object, in the attack's favour, and is never netted against any
        anti-attack term.
    - id: A-PREFACTOR-SUPERSEDED
      statement: >-
        THE VALUE 2^8.92 IS NOT AVAILABLE AS A PREFACTOR HERE AND IS NOT USED.
        The intercept 8.924066290325673 belongs to the SUPERSEDED mixed-response
        W-MID fit of RUN-PEC-6be870-a (EV-PEC-2e67ff
        proof_refs_loci.measured_intercept; carried as a superseded input in
        EV-PEC-857664 OBS-B). The seam-free fitted levels at ell = 1 are
        9.2983509117 (S-A) and 9.7307533347 (S-B) (EV-PEC-857664 OBS-G;
        DEC-20260802-48c72c SP-2 companion set). The contract's binding pairing
        rule forbids using an intercept with the slope of a different fit
        (EV-PEC-857664 OBS-H), so pairing 8.924066290325673 with a seam-free
        gamma is prohibited. CORR-3 additionally withdraws "the run measured A
        directly": the level is a FITTED value at an unobserved abscissa and the
        only correct phrasing is that the fitted per-entry cost curve, evaluated
        at ell = B_opt, is 21.2 to 25.2 bits above Section 4.1's convention.
    - id: A-SP3-BINDS-THE-W-AXIS
      statement: >-
        STANDING PROHIBITION SP-3 STANDS UNCHANGED: modelled margins are quoted
        at w = 2^30 only, and larger-w rows are NOT read as improvements
        (DEC-20260802-48c72c standing_prohibitions SP-3). Its ground is
        physical, not procedural: the model's +0.5-bit-of-margin-per-bit-of-
        memory credit is approximately cancelled by real access latency beyond
        DRAM (EV-PEC-857664 pareto, memory axis). A locus over w is therefore
        emitted as a MODEL LOCUS with SP-3 attached to every row, and no
        absolute margin at w != 2^30 is quoted, unless and until a separate
        committed Coordinator decision lifts SP-3 after independent review.

  proof_search_map:
    not_applicable_reason: >-
      NOT a proof-oriented hypothesis. No theorem, asymptotic bound,
      certificate family, reduction, or closure argument is proposed. The object
      is an assessment-reporting rearrangement of committed numbers, and the
      four audits of docs/inventor-protocol.md section 8 have no target here:
      there is no bottleneck whose removal changes a theorem or a cost, no
      baseline to reproduce symbolically beyond the committed model itself, no
      observable carrying a claim, and no method ceiling to certify. The
      structurally equivalent audits that DO apply are carried as the four
      first-class controls of EXP-PEC-27c7a3 (known-answer gate, fitted-window
      guard, null-baseline control, adversarial-corner check), and the method
      ceiling that governs the underlying lane is already recorded as
      gamma = exponent(M) - 1 <= 1 for this pipeline (EV-PEC-857664 CORR-4).
    bottleneck: null
    baseline_embedding:
      parameter_slice: null
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms: []
    quantifier_order: >-
      Stated even though the map is not_applicable, because it is the field most
      easily overclaimed: "FOR THIS campaign's frozen cost model, FOR THIS
      implementation pair's committed fits, THERE EXISTS a locus p*(w) such that
      FOR ALL w in the five plotted values the modelled sign changes at p*(w)".
      The uniform form over implementations, over primes, over cost models, or
      over real machines is NOT claimed anywhere.
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations: []

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    NULL DELIBERATELY AND THAT IS LOAD-BEARING. No complexity improvement is
    claimed, so the four asymptotic promotion gates of agents/coordinator.md are
    not engaged and this record may never be cited as satisfying any of them.
    The exponents that appear in the deliverable - p^(1/3+o(1)) for the assessed
    method and p^(1/2) for the matched Delfs-Galbraith baseline - are taken from
    the committed record (H-WESO-001 statement; GOAL-P13-001 objective) and are
    inputs here, never outputs.

  heuristic_assumptions:
    - id: HEUR-XO-1
      formal_statement: >-
        For all ell up to the operating point ell ~ B_opt ~ 2^14.2, and for all
        p in the plotted range, the per-entry cost of Algorithm 1's table
        construction continues to follow per_entry(ell) = A * ell^gamma with the
        SAME (log2 A, gamma) pair fitted over 11 <= ell <= 211 at
        p = 1099511627563, up to the declared p-scaling factor alpha.
      random_model_justification: >-
        NONE AVAILABLE AND NONE OFFERED. This is the assumption the campaign's
        own reviewers single out as the only one on the list with NEITHER a
        falsification condition NOR a random-model justification, and the only
        one able to move the answer by more than a few bits (EV-PEC-857664
        unresolved_confounds, L1 / RT3-H1). Stating that plainly is the honest
        handling; manufacturing a justification here would be worse than the
        gap.
      supporting_results:
        - >-
          Structural, not distributional: per_entry(ell) ~ 4*log2(p) *
          M(ell)/(ell+1), so gamma = exponent(M) - 1 and M is at most schoolbook
          Theta((ell+1)^2), giving gamma <= 1 exactly for this pipeline
          (EV-PEC-857664 CORR-4, the_method_ceiling...). This bounds the
          exponent; it does not license the extrapolation.
        - >-
          NC2b-SLOPE passes all ten W-MID synthetic-slope checks, which is the
          only committed gate with power against L1 (GOAL-P13-001 BATCH-403f13
          outcome). It validates the ESTIMATOR's ability to recover a known
          non-zero exponent; it does not validate the extrapolation itself, and
          the contract that froze it is defect D-8 (non-parsing).
      validation_experiment_ids: []
      validation_experiment_note: >-
        EMPTY, AND THAT IS A DECLARED GAP RATHER THAN AN OVERSIGHT. The
        extrapolation spans about 6.48 octaves at NIST-I and about 18 at
        log2 p = 768 (EV-PEC-857664 boundaries), and no experiment in this
        repository reduces that gap by a single octave. NC2a-BAND is the named
        carried control (DEC-20260802-48c72c carried_controls_not_scheduled...).
      falsification_condition: >-
        Any measurement of gamma at ell substantially above 211 that lands
        outside the committed (gamma_A, gamma_B) pair by more than the
        modelling-choice bracket already published. If NC2a-BAND or a successor
        fires, every locus emitted under this hypothesis is RECOMPUTED with the
        measured exponent and is never defended.
    - id: HEUR-XO-2
      formal_statement: >-
        The Delfs-Galbraith / van Oorschot-Wiener middle-memory baseline is
        correctly charged at each plotted w, including its collision-detection
        and memory-access costs, with an end-to-end constant k that the absolute
        locus requires and that this repository does not contain.
      random_model_justification: >-
        Not a distributional assumption; a cost-accounting one. No random model
        applies and none is claimed.
      supporting_results:
        - >-
          NOT ESTABLISHED IN THIS CORPUS. The baseline constant k from the
          frozen bibliography's [15] (Santos-Costello-Shi) and [3] (Adj et al.)
          is unquantified (EV-PEC-857664 unresolved_confounds). The
          bibliographic subtask HAS NOW BEEN EXECUTED - all three named sources
          were retrieved in BATCH-403f13 - AND k REMAINS UNQUANTIFIED
          (GOAL-P13-001 batch_checkpoints BATCH-403f13 outcome). Retrieval was
          therefore necessary and is not sufficient, which corrects the
          expectation IDEA-20260803-48e258 carried.
        - >-
          SP-9 binds the nearest tempting substitute: C-NULL's measured
          per-step cost 2^12.26 to 2^12.32 at p ~ 2^40 may NEVER be cited as a
          Delfs-Galbraith per-step measurement (DEC-20260802-48c72c SP-9;
          EV-PEC-857664 OBS-N).
      validation_experiment_ids: []
      validation_experiment_note: >-
        NC2f is the named carried control for the asymmetric-realism term,
        plausibly worth 5-7 bits back to the attack, unmeasured and applied to
        no number (DEC-20260802-48c72c carried_controls_not_scheduled...).
      falsification_condition: >-
        A transcribed k differing from 1 by more than the width of the emitted
        ratio-form band, which would move the absolute locus outside the band
        this hypothesis predicts. Absent a transcribed k, the absolute locus is
        reported UNRUN and the pre-registered bound is NOT evaluated - that is
        falsification condition F5 and it is a live outcome, not a hedge.

  structural_ingredients:
    - description: >-
        The van Oorschot-Wiener time-memory interpolation as this campaign
        already charges it, entering the committed model as the
        +0.5*log2(w) term in margin(w).
      citation: RUN-WESOVOW-001 (via EV-PEC-857664 OBS-M)
      provenance: internal
      verified_by: >-
        Read from EV-PEC-857664 OBS-M in this design session; the underlying
        vOW publication was NOT read here and is not cited as read.
      role: memory axis of the baseline cost model
    - description: >-
        Sutherland (ANTS X, 2013) modular-polynomial evaluation, and the frozen
        bibliography's [15] and [3], as the route to the baseline constant k.
      citation: >-
        Retrieved in BATCH-403f13 per GOAL-P13-001; not read in this design
        session and relied on for nothing here.
      provenance: internal
      verified_by: >-
        GOAL-P13-001 batch_checkpoints BATCH-403f13 outcome, which records
        retrieval AND records that k remains unquantified.
      role: >-
        Would pin the absolute locus. Absent a quantified k, the deliverable is
        ratio-form only.

  reduction_chain:
    core_problem: >-
      None. No problem is solved and no reduction is claimed. This field is
      filled with an explicit negative rather than left null so that no reader
      infers an omission.
    corollaries: []

  predictions:
    - metric: crossover_locus_lower_bound
      direction: different
      minimum_effect: >-
        p*(w) > 2^512 for every w in {2^20, 2^25, 2^30, 2^35, 2^40}, under EVERY
        one of the eighteen measured-gamma readings and BOTH L4 scenarios, with
        the L2 correction applied in the attack's favour. A single admissible
        reading placing p*(w) at or below 2^512 falsifies this (F3) and is the
        concrete-threat finding the campaign has been unable to reach.
        EVALUABLE ONLY IF the baseline constant k is transcribed; otherwise this
        prediction is NOT EVALUATED and F5 fires.
    - metric: crossover_band_width_ratio
      direction: lower
      minimum_effect: >-
        THE CENTRAL CLAIM. width(p* band in log2 p) / |p* in log2 p| must be
        strictly less than width(margin band) / |margin| at the matched
        w = 2^30 point, where the margin comparator is the committed
        [8.3498, 13.1544] over its own midpoint 10.7521. If the ratio is not
        strictly smaller, the reconditioning argument is FALSE, the curve buys
        nothing over the scalar, and that negative result is the honest
        deliverable (F2).
    - metric: L4_scenario_separation
      direction: different
      minimum_effect: >-
        The two L4 scenarios are emitted as SEPARATE loci - batched evaluation
        absent (the full gamma*log2 B_opt term charged) and present (the term
        removed) - each using its OWN reading's gamma*log2(B_opt), which is
        11.502 bits for S-B/S-MIN W-MID and 13.247 for S-A W-MID
        (EV-PEC-857664 OBS-L), never a single pair of extremes applied across
        readings it does not belong to. An explicit statement is made of whether
        BOTH satisfy the pre-registered bound. Joint satisfaction discharges the
        L4 ambiguity FOR THIS QUESTION ONLY and does not close L4; a split is
        reported as a split and the ambiguity stands.
    - metric: margin_reproduction_at_the_committed_point
      direction: different
      minimum_effect: >-
        Evaluated at w = 2^30 and the NIST-I prime, the locus machinery must
        return a modelled margin inside [8.3498, 13.1544] bits for every one of
        the eighteen readings, and must reproduce the two committed endpoints -
        S-A W-TOP at alpha_hat (overhead 25.9193, c 1.619957, margin 8.3498) and
        S-B W-ALL at alpha 0 (21.1147, 1.319669, 13.1544) - to within 0.001
        bits. KNOWN-ANSWER GATE: a locus that cannot reproduce the point it
        generalizes is VOID and nothing else may be emitted (F1).
    - metric: undefined_segment_disclosure
      direction: different
      minimum_effect: >-
        Every (p, w) at which any required input falls outside its declared
        fitted window is reported as an UNDEFINED SEGMENT naming the missing
        input, and is drawn as a gap rather than interpolated. The historical
        instance this exists to prevent is the BATCH-002 extrapolation defect -
        a law that discarded its measured intercept and returned c ~ 0 for an
        object measured at 2^12.26 to 2^12.32 multiplications per entry
        (EV-PEC-2e67ff OBS-E; DEC-20260802-48c72c SP-1).

  test_boundary:
    what_this_is: >-
      AN ASSESSMENT-REPORTING OBJECT, NOT AN ATTACK. No new cryptanalysis, no
      exponent moves, zero new compute beyond arithmetic on committed numbers.
      Nothing is faster, cheaper, or newly feasible because of this record.
    what_it_is_scoped_to: >-
      The corrected p^(1/3+o(1)) method AS CHARGED BY THIS CAMPAIGN, against
      THIS CAMPAIGN'S OWN frozen Delfs-Galbraith / van Oorschot-Wiener
      middle-memory baseline, using THIS CAMPAIGN'S OWN committed fits from one
      pure-Python implementation pair measured at p = 1099511627563 over
      2 <= ell <= 211, at the parameter sets stated below - AND NOWHERE ELSE.
      It is scoped to no other cost model, no other baseline, no other
      implementation, and no real machine: implementation constants,
      parallelism, and the memory hierarchy are outside the model entirely.
    instances:
      - "NIST-I as this campaign charges it: log2 T_full = 108.73088958800618, T_DG = 2^128, log2 B_opt = 14.2 (EV-PEC-857664 OBS-M, citing RUN-WESOVOW-001)"
      - "the four further committed field sizes of DEC-20260802-48c72c citability_ruling: NIST-III, NIST-V, log2 p = 576, log2 p = 768"
      - "the source measurement: p = 1099511627563 (80-bit F_{p^2}), 47 prime degrees 2 <= ell <= 211, IMPL-A schoolbook / IMPL-B Karatsuba sharing every line but poly_mul"
    parameters:
      w: ["2^20", "2^25", "2^30", "2^35", "2^40"]
      w_caveat: "SP-3 binds every w != 2^30; see assumption A-SP3-BINDS-THE-W-AXIS"
      gamma_readings: "eighteen = 6 fits (S-A, S-B x W-ALL, W-MID, W-TOP) x 3 alphas (0, 1, alpha_hat = 1.1596976732)"
      L4_scenarios: 2
      L2_correction_bits: "[0.60, 1.00], signed in the attack's favour"
    implementation: >-
      Deterministic arithmetic over committed constants. No isogeny computation,
      no field arithmetic at scale, no sampling, no randomness.
    budget:
      compute: "none beyond arithmetic; the binding cost is review capacity"
      authorization_gap: >-
        GOAL-P13-001 is `closed_at_budget` with batches_remaining 0 and no
        executor batch authorized. See EXP-PEC-27c7a3
        inputs.blocking_preconditions: this hypothesis is specified, and no work
        under it is dispatchable until a fresh campaign_budget authorization is
        recorded.

  falsification_conditions:
    - >-
      F1 - the known-answer gate does not reproduce the committed margin band
      [8.3498, 13.1544] at (NIST-I, w = 2^30) for all eighteen readings, or
      misses either committed endpoint by more than 0.001 bits: the locus
      machinery is WRONG and NOTHING may be emitted. Hard blocker.
    - >-
      F2 - the crossover band is proportionally NO NARROWER than the margin band
      at the matched point: the reconditioning claim of this hypothesis is
      FALSE, the curve buys nothing over the scalar, and that negative result is
      the honest deliverable. This is the falsification of the CENTRAL claim.
    - >-
      F3 - any admissible reading puts p*(w) at or below 2^512 for some
      w <= 2^40: the pre-registered lower bound fails and the campaign has a
      concrete threat finding at the model level. This is the outcome the record
      most wants to be able to detect, and it is a statement about a MODEL, not
      a security claim about any parameter set.
    - >-
      F4 - the null-baseline control shows the locus barely moves when the
      corrected overhead is replaced by Section 4.1's one-operation-per-entry
      convention: the corrected overhead is not driving the locus, the whole
      BATCH-002/003 contribution is not doing the work claimed for it here, and
      the record must be re-described rather than defended.
    - >-
      F5 - the baseline constant k cannot be quantified: only the ratio-form
      locus is emitted, the absolute locus is reported UNRUN under AGENTS.md
      rule 5, and the pre-registered bound of F3 is NOT EVALUATED. Note this is
      the LIKELY outcome on the committed record, since BATCH-403f13 retrieved
      all three named sources and k remained unquantified.
    - >-
      F6 - the declared fitted-window predicate, applied literally, marks every
      point of the deliverable UNDEFINED: the guard and the deliverable are
      mutually annihilating as specified, the contract is defective rather than
      the hypothesis refuted, and the remedy is a superseding contract with an
      explicitly re-derived window predicate. Recorded as a falsification
      condition of the CONTRACT so it cannot be resolved by quietly loosening
      the guard mid-run.

  distinguishable_outcomes:
    - "F1 fires -> machinery void; no locus exists; nothing is learned about the mechanism."
    - "F1 passes, F2 fires -> the mechanism claim is REFUTED on committed numbers at zero compute. The scalar remains the honest reporting object."
    - "F1 passes, F2 passes, F5 fires -> the mechanism claim is SUPPORTED IN RATIO FORM only; the absolute locus and F3 are UNRUN. Distinguishable from F2 by the band-ratio metric, which is computable without k."
    - "F1 and F2 pass, k transcribed, bound holds under all 36 readings-by-scenarios -> the strongest available statement: asymptotically real, concretely irrelevant across the plotted range, AS A MODEL LOCUS."
    - "F3 fires -> a model-level concrete-threat finding, which triggers independent review before any citation and moves no security position by itself."
    - "F4 fires -> the record is re-described; the locus may be real but is not attributable to this campaign's measurement."

  interpretation_limits:
    - >-
      CONDITIONAL ON HEURISTIC 1, WHICH REMAINS UNVALIDATED. NC-3/NC-6 has never
      successfully executed once across GOAL-P13-001's entire budgeted history;
      its single attempt was a failed_infrastructure outcome and is never
      evidence about Heuristic 1 either way (AGENTS.md rule 5; GOAL-P13-001
      status_note and BATCH-403f13 outcome). P0 multiplies every one of the
      eighteen margin rows identically. This record does not validate Heuristic
      1, does not substitute for that pairing, and MUST NOT be cited as reducing
      the need for it.
    - >-
      concrete_threat_nist1 REMAINS INCONCLUSIVE unless F3 fires, and SP-4
      stands: nothing moves it without evidence clearing the irreproducibility
      band (DEC-20260802-48c72c SP-4). A locus above the deployed range is a
      statement about a MODEL and never a security proof for any parameter set.
    - >-
      THE o(1) IN p^(1/3+o(1)) IS NOT A CONSTANT AND THE DELIVERABLE TREATS IT
      AS ONE OVER THE PLOTTED RANGE. This is the largest modelling gap, it is
      exactly the kind of term a locus is most sensitive to at large p - which
      is where the pre-registered bound lives - and it is stated on the emitted
      object rather than in a footnote.
    - >-
      The eighteen gamma readings are NOT independent: they share the same 47
      acquired ell and the same two implementations, whose exponents are
      themselves non-independent estimates under a fixed split structure
      (EV-PEC-857664 OBS-F, MA-8). Their spread is NOT a confidence interval and
      may never be reported as one.
    - >-
      gamma_B = 0.8100336227 is a TRANSIENT of the unimproved shared schoolbook
      reduction, so THE BRACKET'S LOW END IS THE OPTIMISTIC ONE and may not be
      treated as a conservative bound; the high end is the defensible reading
      for this implementation family (EV-PEC-857664 OBS-I; MA-5). If the
      Karatsuba gain saturates and gamma_B -> gamma_A = 0.9328644281, the low
      end rises to c = 1.436129 and the NIST-I margin falls from 13.036 to
      11.291 bits.
    - >-
      A crossover in an asymptotic cost model is not a crossover in practice.
      Nothing here supports any security-parameter action, and nothing here
      bears on ECDLP, SIDH/SIKE, CSIDH, SQIsign security, (qt-)Pegasis, or
      torsion-based constructions. NIST-III and NIST-V retain comfortable
      margins under every tested scenario and are not re-examined.
    - >-
      No review-breakthrough tier is available in this campaign and none is
      claimed (DEC-20260802-48c72c; AGENTS.md rule 12). The claim tier is capped
      at `medium`, inherited from the 80-bit-field inputs, and only for segments
      inside declared fitted windows with the bibliographic constants
      transcribed; the locus itself carries NO claim tier, exactly as the
      extrapolated c does not.

  pareto:
    dominated_by_is_null: false
    dominated_by: >-
      Not applicable ON ANY ATTACK AXIS, and that is checked rather than
      asserted: no attack is proposed, no cost is reduced, and the assessed
      method's own position against Delfs-Galbraith is the OUTPUT rather than a
      competitor. On the REPORTING axis the incumbent is the committed scalar
      margin at (NIST-I, w = 2^30) with its band [8.3498, 13.1544], and F2 is
      precisely the finding that the incumbent is not dominated.
    sota_delta: >-
      ZERO on every attack axis - time, memory, data, queries. Nothing is
      improved and no cost is reduced for anyone. The ASSESSMENT delta is a
      change of SHAPE: from a scalar at one (p, w) point whose band exceeds its
      usable precision, to a locus over a memory range carrying a
      pre-registered lower bound that can fail. BATCH-003 already moved the
      margin band width 17.27 -> 13.9429 (-19.3 per cent, low end +2.95 bits;
      EV-PEC-857664 sota_delta); this record does NOT narrow it further and does
      not claim to.

