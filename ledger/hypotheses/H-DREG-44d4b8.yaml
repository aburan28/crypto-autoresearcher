# Finite-field check of IDEA-20260916-71ab94 claim (A) at n = 5.
# Not a reproduction of KN-FIND-006. Approval: DEC-20261001-77eb55.
hypothesis:
  id: H-DREG-44d4b8
  question_id: RQ-DREG-bd6c86
  source_idea: IDEA-20260916-71ab94
  experiment_id: EXP-DREG-c3d5d9
  specified_at: '2026-10-01'
