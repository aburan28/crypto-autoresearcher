  proposed_by: idea-generator
  approved_by_decision: DEC-20261001-77eb55
  title: >-
    Over F_2^5 with modulus x^5 + x^2 + 1, the closing S_3 has exactly one
    nonzero multiplier lambda = R_X^{-2} that kills the degree-2 term, and
    the survivor is the affine trace form.
  statement: >-
    Let F be F_2[z]/(z^5 + z^2 + 1), V the F_2-span of {1, z}, R_X = z, and
    B = z + 1. Among lambda in F, the bilinear term in u and x_t inside
    Tr(lambda * S_3(u, x_t, R_X)) vanishes for every u in F and every x_t in
    V if and only if lambda is 0 or lambda = R_X^{-2}. At that nonzero
    lambda the surviving value equals Tr(u) + Tr(x_t) + Tr(B * R_X^{-2})
    for every such pair. The input R_X = 0 is refused.
  mechanism: >-
    The proposal expands Tr(lambda S_3) and solves mu + lambda R_X = 0.
    This contract checks that algebra by exhaustive enumeration in one
    small field. It does not measure a degree-3 deficit on a large system.
  assumptions: []
  proof_search_map:
    bottleneck: Exhaustive search for lambda and comparison of the survivor with the affine form.
    baseline_embedding:
      parameter_slice: >-
        The expansion in IDEA-20260916-71ab94 claim (A), read 2026-10-01.
        The field polynomial was checked irreducible in this session.
      reproduction_check: >-
        One route enumerates lambda and evaluates the trace. The other
        solves lambda^{1/2} = lambda * R_X. They must name the same nonzero
        lambda.
    observation_collision:
      observable: The set of killing lambdas and the pointwise match of P.
      distinct_preimage_search: >-
        Enumeration versus the closed-form inverse. R_X = 0 must not be
        reported as a unique nonzero lambda.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: One field of 32 elements and a 2-dimensional V.
        predicted_gain: A witnessed identity. No attack cost.
    quantifier_order: >-
      For this fixed field, V, B, and nonzero R_X, the set of lambda that
      kill the bilinear term is {0, R_X^{-2}}, and the survivor matches P
      on all 32 * 4 pairs.
    method_ceiling:
      strongest_certifiable_claim: >-
        The identity on this one field and these constants. Not the
        measured deficit at n >= 12.
      nearby_object_control: >-
        R_X = 0. Reporting a unique nonzero killing lambda invalidates
        the run.
    proof_obligations:
      - claim: Exactly one nonzero killing lambda, equal to R_X^{-2}.
        responsibility: correctness
      - claim: The survivor matches the affine trace form on every pair.
        responsibility: correctness
      - claim: R_X = 0 is refused.
        responsibility: scope
    not_applicable_reason: null
