  title: >-
    After EV-BINSTD-56c2bc, n∈{19,23} catalogs with unique-pair floors ≥4
    meet Spearman ρ(r_Tr, N_nl) ≤ −0.70, and shuffled-linear null fails the
    anti-band

  statement: >-
    CLAIM (heuristic_validation / encoding-structure instrument; NO ATTACK;
    NO EXPONENT). Successor after EV-BINSTD-56c2bc (O-SUPPORT / replicate of
    EV-BINSTD-d3a6be on n=17; 3-point (17,4) support; Stage-2 unauthorized
    on EXP-BINSTD-dbca92). Using NEW diversity catalog seed 202610033364 ∉
    {202610038196, 202610038782, 202610039715, 202610034821} and Twin-B
    meters under EXP-BINSTD-791e4c, FORALL Stage-1 cells
    (n,ℓ)∈{19,23}×{3,4}: (i) ADMISSION — twin meters agree and catalog yields
    ≥4 distinct r_Tr, ≥4 distinct N_nl, and ≥4 unique (r_Tr,N_nl) pairs;
    (ii) only after (i), Spearman's ρ(r_Tr, N_nl) ≤ −0.70 (O-SUPPORT) OR
    fails the band (O-FAIL-BAND). If (i) fails → O-INCONCLUSIVE. (iii) If
    Stage-1 is O-SUPPORT, Stage-2 shuffled-linear null (permute r_Tr vs
    fixed N_nl; resample r_Tr from observed support) has ci95_lo > −0.70 on
    FORALL cells (O-NULL-FAILS-ANTI-BAND) OR remains in-band
    (O-NULL-ALSO-IN-ANTI-BAND). NO break. NO n≥131 transfer. Do NOT re-run
    EXP-BINSTD-dbca92 / 871156 / 6fd454 / 8196d7. Do NOT open Stage-2 under
    EXP-BINSTD-dbca92. Do NOT promote KN-FIND.

  mechanism: >-
    Same OBJECT FRAME and encoder pin as H-BINSTD-b334a6 / IDEA-20261003-4f41d0.
    WHAT IS NEW: (1) clean Stage-0 freeze on n∈{19,23} (not n=17 package;
    not dbca92 catalog continuity); (2) unique-pair floor ≥4 against 3-point
    Spearman collapse; (3) Stage-2 shuffled-linear null of the same shape
    authorized on this card.

  predictions:
    - metric: distinct_rTr_values
      direction: lower_bounded
      minimum_effect: '≥ 4 distinct r_Tr values per Stage-1 cell (admission)'
    - metric: distinct_Nnl_values
      direction: lower_bounded
      minimum_effect: '≥ 4 distinct N_nl values per Stage-1 cell (admission)'
    - metric: unique_rTr_Nnl_pairs
      direction: lower_bounded
      minimum_effect: '≥ 4 unique (r_Tr, N_nl) pairs per Stage-1 cell'
    - metric: spearman_rTr_vs_Nnl
      direction: upper_bounded
      minimum_effect: '≤ −0.70 at each Stage-1 cell after admission'
    - metric: shuffled_linear_null_ci95_lo
      direction: lower_bounded
      minimum_effect: '> −0.70 on FORALL cells after live O-SUPPORT'
    - metric: catalog_size
      direction: lower_bounded
      minimum_effect: '≥ 24 distinct V shapes per Stage-1 cell'
    - metric: twin_agreement
      direction: same
      minimum_effect: >-
        r_Tr path A = path B and N_nl path A = path B on every measured V

  test_boundary:
    instances:
      - 'Stage 0: rank-diversity-seeking freeze for (n,ℓ)∈{19,23}×{3,4}; twin probe; Stage-2 auth'
      - 'Stage 1 authorized: (n,ℓ)∈{19,23}×{3,4} unique-pair floors then Spearman'
      - 'Stage 2 authorized: shuffled-linear null when Stage-1 is O-SUPPORT'
    parameters:
      spearman_band: -0.70
      catalog_seed: 202610033364
      bootstrap_seed: 202610033365
      null_seed: 202610033366
      bootstrap_reps: 200
      null_reps: 200
      min_catalog: 24
      max_catalog: 128
      floor_rTr: 4
      floor_Nnl: 4
      floor_unique_pairs: 4
      forbidden_seeds: [202610038196, 202610038782, 202610039715, 202610034821]
      moduli:
        17: t^17+t^3+1
        19: t^19+t^5+t^2+t+1
        23: t^23+t^5+1
    implementation: >-
      Pure Python under experiments/EXP-BINSTD-791e4c/implementation/;
      command surface implementation/run.py driven by trial-plan-v1.json.
      Twin-B meters in encode_s3.py. No Magma/Sage/AUXIN/Bedrock.
    budget:
      wall_clock_seconds: 14400
      memory_gb: 2
      maximum_runs: 6

  falsification_conditions:
    - Twin meters disagree on any measured V (O-ARTIFACT; table void).
    - Editing the Spearman band after Stage-0 freeze (protocol invalid).
    - Re-using any forbidden seed in {202610038196, 202610038782, 202610039715, 202610034821}
      (O-ARTIFACT).
    - Claiming practical binary IC or an exponent move from a toy Trace-rank
      correlation (KR-IC-1fcdbc).
    - Transferring the band to n≥131 without a new contract.
    - Catalog collapses below admission floors (O-INCONCLUSIVE).
    - Opening Stage-2 under EXP-BINSTD-dbca92 or promoting KN-FIND under this card.

  distinguishable_outcomes:
    - id: O-SUPPORT
      meaning: >-
        Twin OK; admission floors (including unique_pairs≥4) met on every
        Stage-1 cell; ρ(r_Tr, N_nl) ≤ −0.70 on every Stage-1 cell. Stage-2
        still required for the null HEUR. No attack claim.
    - id: O-FAIL-BAND
      meaning: Twin OK; floors met; ρ > −0.70 on at least one Stage-1 cell.
    - id: O-INCONCLUSIVE
      meaning: >-
        Catalog collapses below distinct_rTr≥4 or distinct_Nnl≥4 or
        unique_pairs≥4 on a completed cell after diversity-seeking freeze.
    - id: O-NULL-FAILS-ANTI-BAND
      meaning: >-
        Stage-1 O-SUPPORT and permutation OR resample null ci95_lo > −0.70
        on FORALL Stage-1 cells (live pairing is not reproduced by shuffled
        r_Tr).
    - id: O-NULL-ALSO-IN-ANTI-BAND
      meaning: >-
        Stage-1 O-SUPPORT but both null arms fail to put ci95_lo > −0.70 on
        every cell (same-shape confound still in anti-band).
    - id: O-STAGE2-SKIPPED
      meaning: Stage-1 was not O-SUPPORT; null not read.
    - id: O-ARTIFACT
      meaning: Twin disagreement, freeze/regression failure, or forbidden seed reuse.
    - id: O-IMPEDIMENT
      meaning: >-
        Infrastructure timeout/crash/missing Stage-0 freeze. Never negative
        evidence against H-BINSTD-336a46 / H-BINSTD-b334a6.

  interpretation_limits:
    - Encoding-structure instrument only; does not predict yield or beat rho.
    - Does not rewrite EV-BINSTD-56c2bc or EV-BINSTD-d3a6be.
    - Not Stage-2 under EXP-BINSTD-dbca92.
    - No attack at field degree ≥ 131. ECC2K-130 is not an instance.
    - Not a re-run of EXP-BINSTD-dbca92 / 871156 / 6fd454 / 8196d7.
    - No KN-FIND from this card alone.

  heuristic_assumptions:
    - id: HEUR-BINSTD-878222-H1
      formal_statement: >-
        FORALL (n,ℓ)∈{19,23}×{3,4} Stage-1 cells: AFTER ≥4 distinct r_Tr,
        ≥4 distinct N_nl, and ≥4 unique (r_Tr,N_nl) pairs across the frozen
        rank-diversity-seeking catalog under seed 202610033364, Spearman
        ρ(r_Tr, N_nl) ≤ −0.70 where r_Tr is the rank of the Trace-derived
        linear block and N_nl is the residual nonlinear XOR-SAT clause count
        after eliminating those linears.
      random_model_justification: >-
        Same as H-BINSTD-b334a6. Asks whether the n=17 replicate extends to
        n∈{19,23} after unique-pair floors that block 3-point collapse.
      supporting_results:
        - EV-BINSTD-56c2bc
        - EV-BINSTD-d3a6be
        - KR-IC-f5c584
      validation_experiment_ids:
        - EXP-BINSTD-791e4c
        - EXP-BINSTD-dbca92
        - EXP-BINSTD-871156
      falsification_condition: >-
        Floors met and Spearman ρ > −0.70 at a completed Stage-1 cell
        (O-FAIL-BAND), OR twin failure (O-ARTIFACT), OR floors unmet
        (O-INCONCLUSIVE), OR Trace extractor absent (O-IMPEDIMENT).
    - id: HEUR-BINSTD-3dbdad-H2-NULL
      formal_statement: >-
        After Stage-1 O-SUPPORT, FORALL Stage-1 cells the shuffled-linear
        null (permutation of r_Tr vs fixed N_nl, or r_Tr resampled from its
        observed support) has Spearman 95% lower CI strictly greater than −0.70.
      random_model_justification: >-
        Destroying the live (r_Tr, N_nl) pairing should move ρ off the
        anti-band if Trace-rank is the driver rather than catalog shape.
      supporting_results:
        - EV-BINSTD-56c2bc
        - IDEA-20261001-878222
      validation_experiment_ids:
        - EXP-BINSTD-791e4c
      falsification_condition: >-
        Live O-SUPPORT and both null arms have ci95_lo ≤ −0.70 on some cell
        (O-NULL-ALSO-IN-ANTI-BAND).

  asymptotic_claim:
    problem: >-
      Whether Trace-linear rank remains an anti-correlated predictor of residual
      nonlinear XOR-SAT clause count on n∈{19,23} after unique-pair floors,
      and whether a shuffled-linear null of the same shape fails the anti-band
    prior_best: >-
      EV-BINSTD-56c2bc (n=17 replicate of EV-BINSTD-d3a6be; 3-point (17,4);
      Stage-2 not run)
    time_exponent: >-
      NO EXPONENT MOVED. Encoding-structure instrument only.
    memory_exponent: Negligible — store per-V r_Tr and N_nl.
    hidden_cofactor: Encoder constants + diversity-seeking catalog + Stage-2 null.
    claim_kind: heuristic_validation

  proof_search_map:
    bottleneck: >-
      Whether HEUR-H1 at n∈{19,23} survives unique-pair floors ≥4 (blocking
      3-point collapse seen on EV-BINSTD-56c2bc (17,4)), and whether shuffled
      r_Tr fails the anti-band.
    baseline_embedding:
      parameter_slice: >-
        n∈{19,23}, ℓ∈{3,4}; seed 202610033364; forbidden
        {202610038196, 202610038782, 202610039715, 202610034821}; twin r_Tr
        and N_nl must agree; unique_pairs≥4 before Spearman or null.
      reproduction_check: >-
        Independent check.py recomputes twin r_Tr/N_nl on the Stage-0 n=19
        ℓ=3 probe, verifies catalog seed ∉ forbidden quadruple, checks
        unique-pair floors, and Stage-2 null-results labels.
    observation_collision:
      observable: 'Spearman ρ(r_Tr, N_nl) vs −0.70 after unique-pair floors; null ci95_lo vs −0.70'
      distinct_preimage_search: >-
        Held band could arise from Trace-dominated removable work (claim),
        catalog/seed artifact (forbidden priors + new n), twin-encode artifact
        (Twin B), or 3-point collapse (unique-pair floor). Shuffled-linear
        null is the named same-shape control.
    constructive_transforms:
      - transform: measurement_instrument
        proposed_object: >-
          New n∈{19,23} diversity seed + unique-pair floors ≥4 + Twin B +
          shuffled-linear Stage-2 null.
        predicted_gain: >-
          Decide HEUR-H1 off n=17 and whether the pairing is destroyed by
          shuffling r_Tr.
    quantifier_order: >-
      FORALL Stage-1 cells (19,3),(19,4),(23,3),(23,4): AFTER unique-pair
      floors, ρ ≤ −0.70 is PREDICTED; THEN FORALL those cells null ci95_lo
      > −0.70 is PREDICTED. NOT CLAIMED: n=17 re-test as package; n≥131;
      attack; KN-FIND; Stage-2 under EXP-BINSTD-dbca92.
    method_ceiling:
      strongest_certifiable_claim: >-
        On the named Stage-1 toy cells, after unique-pair floors, measured
        Spearman ρ lies ≤ or > −0.70 with twin agreement, and shuffled-linear
        null ci95_lo lies > or ≤ −0.70.
      nearby_object_control: >-
        Shuffled-linear permutation and resample-from-support ARE the nearby
        objects. Twin disagreement (artifact); floors unmet (inconclusive);
        forbidden prior seed (artifact).
    proof_obligations:
      - claim: Twin r_Tr and N_nl paths agree on every measured V.
        responsibility: baseline
      - claim: Unique-pair ≥4 floors gate any band or null verdict.
        responsibility: baseline
      - claim: >-
          Catalog seed is none of 202610038196, 202610038782, 202610039715,
          202610034821.
        responsibility: baseline
      - claim: Band polarity is Spearman ≤ −0.70 (not ≥).
        responsibility: baseline
      - claim: Null fails anti-band iff ci95_lo > −0.70.
        responsibility: baseline

