hypothesis:
  id: H-DREG-152cff
  question_id: RQ-DREG-001

  statement: >-
    SCOPE: boolean chained Semaev built by src/semaev_tree.py at t = 3, ti = 0
    (m = 3), Weil-descended to GF(2); degrees D >= 3; sizes n >= 6 on and off the
    n/3 lattice. CLAIM TIER toy. NO ATTACK, NO EXPONENT, NO RANK CLAIM, NO
    PRIME-FIELD TRANSFER.
    The Macaulay column set at degree D of this family is determined completely
    by the variable-block incidence pattern of the two equation families, and the
    count of MISSING degree-j monomials is the parameter-free closed form, with
    k = ceil(n/3), nb = n + 3k:
      u_D(n,D)     = C(3k,D) + 2*C(n+k,D) - 2*C(k,D) - C(n,D)
      u_{D-1}(n,D) = 2*C(k,D-1)
      u_j(n,D)     = 0            for every j <= D-2
      ncols(n,D)   = N(nb,D) - u_D - u_{D-1},   N(v,D) = sum_{j<=D} C(v,j)
    depending on (n, D) alone - not on the seed, the curve E, the point R, the
    constant B_curve, or the basis alpha. THE ENTIRE CONTENT OF THE HYPOTHESIS IS
    THAT THIS IS AN IDENTITY AND NOT A FIT: it has no free parameter, it was
    derived from the equation supports before being compared to anything, and it
    must reproduce EXACTLY, with zero tolerance, six committed integers from
    three independent experiment lineages - 1,584 (n=9 D5 missing) and 1,848
    (n=9 D6 missing); 16,016 (n=12 D6 missing, seed 2026); 29,332 (n=9 D6 ncols,
    EV-SIG-006 N1); 174,035 (n=12 D6 ncols, seed 2026); and 778,394 (n=21 D5
    ncols, EXP-DREG-004) - the last of which lands only if the separately derived
    u_{D-1} = 2*C(7,4) = 70 term is included, a term no record in this lane
    contains. THE CONSEQUENCE, which is why the hypothesis is worth stating: the
    support-gap quantity that has governed this goal since BATCH-002, that
    BATCH-002 used to quarantine the 17,947 headline, and that TASK-20260731-016
    obtained by a chunked 15-unit run at 1,623.8 s and 7.16 GB peak RSS, is a
    binomial identity available at zero compute at every rung, including every
    rung past the n = 21 memory wall. IF NO SUCH IDENTITY HOLDS - if any
    committed integer is missed - the deliverable is the NAMED NEGATIVE: the
    block reading of the builder is wrong at a specific, exhibited monomial, and
    the up-closure column law (EV-SIG-006) does not compose with the char-2
    Frobenius expansion of S_3 in the way asserted here.

  mechanism: >-
    DERIVED FROM SOURCE. Every algebraic step below is read from
    src/semaev_tree.py (lines 50-52, 55-87, 90-171) and re-derived here; nothing
    is recalled from literature and no citation is asserted.

    STEP 1 - THE t = 3 CHAIN HAS EXACTLY TWO S_3 EQUATIONS, AND THEY LIVE ON
    DIFFERENT VARIABLE SETS. build_chained_system_symbolic emits
    S_3(u_1, x_1, x_2) then, for i in range(t-3), the middle links - which at
    t = 3 is an EMPTY RANGE - then S_3(u_{t-2}, x_t, R_X) = S_3(u_1, x_3, R_X).
    So the F_q-level system is exactly
      (B)  S_3(u_1, x_1, x_2) = 0
      (A)  S_3(u_1, x_3, R_X) = 0,   R_X constant.
    x_3 never meets x_1 or x_2 in any equation. This is the block structure and
    it is a fact about the builder, not a modelling choice.

    STEP 2 - CHAR-2 FROBENIUS FIXES THE BOOLEAN DEGREES AND THE SUPPORTS.
    S_3(a,b,c) = (ab+ac+bc)^2 + abc + B_curve, and in characteristic 2 squaring
    is additive, so (ab+ac+bc)^2 = a^2b^2 + a^2c^2 + b^2c^2 and
      S_3(a,b,c) = a^2 b^2 + a^2 c^2 + b^2 c^2 + a b c + B_curve.
    Weil descent writes u_1 = sum_{j<n} u_{1,j} alpha^j (all n coordinates free)
    and x_i = sum_{l<k} x_{i,l} alpha^l (only k = ceil(n/m) coordinates, m = t = 3).
    Since a boolean coordinate satisfies y^2 = y, the SQUARE of an F_q-variable
    is F_2-LINEAR in its coordinates: u_1^2 = sum_j u_{1,j} alpha^{2j}. Hence a
    squared product is F_2-bilinear (boolean degree 2) and the single unsquared
    product abc is boolean degree 3 - dropping to 2 when one argument is a
    constant. Taking the coefficient of alpha^l for l = 0..n-1 gives n boolean
    equations per S_3, so 2n in all, in nb = n + 3k unknowns. Family A therefore
    consists of n boolean QUADRICS with
      supp(A) subset {u_{1,j} x_{3,i}} U {u_{1,j}} U {x_{3,i}} U {1},
    and family B of n boolean CUBICS with
      supp(B) subset {deg-2 pairs among U, X1, X2} U {u_{1,j} x_{1,i} x_{2,i'}} U {1},
    where U, X1, X2, X3 are the coordinate blocks of sizes n, k, k, k. Note
    supp(B) contains NO degree-1 monomial - every non-constant term of
    S_3(u,x_1,x_2) is at least bilinear after descent. This recovers, as a
    derivation rather than an observation, the degree histogram "n equations of
    degree 2 and n of degree 3" that every record in the lane quotes.

    STEP 3 - THE UP-CLOSURE LAW APPLIED TO THESE SUPPORTS. Macaulay at degree D
    multiplies f_i (degree d_i) by every monomial of degree <= D - d_i, so a
    squarefree monomial m of degree D' is a column iff some m' in supp(f_i)
    divides m with deg(m') >= D' - (D - d_i). This is EV-SIG-006's machine-checked
    column law (zero cancellation, zero parity deviation at n = 9 across D=3..6
    on both arms) and it is the one empirical ingredient. Evaluating it:
      D' <= D-2 : family A's constant term (deg m' = 0) reaches every monomial,
                  so EVERY column of degree <= D-2 is present, u_j = 0.
      D' = D-1  : A needs deg(m') >= 1, i.e. m meets U or X3; B needs
                  deg(m') >= 2, i.e. m meets at least two of U, X1, X2. The
                  missing set is therefore {m subset X1} U {m subset X2},
                  disjoint, giving u_{D-1} = 2*C(k, D-1).
      D' = D    : A needs deg(m') >= 2, i.e. m contains a U variable AND an X3
                  variable; B needs deg(m') >= 3, i.e. m contains a U, an X1 and
                  an X2 variable. Writing (a,b1,b2,b3) for the block occupancies,
                  m is MISSING iff a = 0, or (b3 = 0 and (b1 = 0 or b2 = 0)).
                  Inclusion-exclusion over {a=0}, {b3=0,b1=0}, {b3=0,b2=0}:
                    |a=0| = C(3k,D); the other two are C(n+k,D) each;
                    the pairwise intersections with {a=0} are C(k,D) each and
                    {b1=b2=b3=0} is C(n,D); the triple intersection is 0.
                  u_D = C(3k,D) + 2*C(n+k,D) - 2*C(k,D) - C(n,D).

    STEP 4 - FORCED VALUES, COMPUTED BEFORE COMPARISON.
      n=9  (k=3, nb=18): u_5 = 2*C(12,5) = 1,584; u_6 = 2*C(12,6) = 1,848;
                         ncols(9,6) = 31,180 - 1,848 = 29,332.
      n=12 (k=4, nb=24): u_6 = 924 + 2*8,008 - 0 - 924 = 16,016; u_5 = 2*C(4,5)
                         = 0; ncols(12,6) = 190,051 - 16,016 = 174,035.
      n=21 (k=7, nb=42): u_5 = 20,349 + 2*98,280 - 42 - 20,349 = 196,518;
                         u_4 = 2*C(7,4) = 70; N(42,5) = 974,982;
                         ncols(21,5) = 974,982 - 196,518 - 70 = 778,394.
    All six are committed integers in this goal's artifacts and all six land
    exactly. THIS IS A REPRODUCTION, NOT A PREDICTION, and every downstream
    statement must say so: the numbers were available when the form was written.
    What is NOT in-sample, and is the hypothesis's real test, is the forward set
      ncols(15,5) = 143,421   ncols(17,5) = 314,472   ncols(18,5) = 358,678
      ncols(24,5) = 1,522,577 ncols(30,5) = 4,669,266
      ncols(15,6) = 690,690   ncols(18,6) = 2,122,294 ncols(21,6) = 5,467,260
    none of which appears in any record read while writing this. n = 17 is the
    discriminating cell: it is off-lattice (k = 6, nb = 35), so any closed form
    written with the common shorthand nb = 2n returns a different answer there.

    THE TWO RESIDUALS, CARRIED AND NOT HIDDEN. (i) The committed u_6 at n = 12
    seed 2 is 16,018, two more than the law's 16,016. The law gives the GENERIC
    maximum column set (it assumes the union over the n alpha-coefficient
    equations of family A contains every (u,x_3) pair, and similarly for B), so a
    seed missing two support pairs has exactly two extra missing columns. The
    validation must EXHIBIT the two absent pairs by name; a residual explained
    by hand-waving is a failure of the test. (ii) H-SDEG-0dd021 cites u_5 = 8,746
    for the n = 12 D5 ARM-R column-matched null against this law's sem value
    8,736, a gap of 10. NO CLAIM IS MADE HERE THAT EITHER NUMBER IS WRONG: the
    arm-R null is a seeded greedy set-cover construction and is a different
    object from the sem, so its column set need not agree. What the hypothesis
    asserts is only that the two are not the same quantity, and that no record
    currently states which one "the sem's u_5" refers to.

  assumptions:
    - >-
      The pinned builder for every cited cell is src/semaev_tree.py at t = 3,
      ti = 0. Several copies exist under experiments/*; the validation diffs them
      and reports rather than assuming.
    - >-
      GENERIC SUPPORT (HEUR-BLK-2 below). The union over the n coefficient
      equations of family A covers every (u_{1,j}, x_{3,i}) pair and the union
      over family B covers every (u_{1,j}, x_{1,i}, x_{2,i'}) triple. This makes
      u_D a generic MINIMUM; a seed violating it has a strictly larger u_D. Not
      proved; measured.
    - >-
      No claim of any kind is made about RANK. The hypothesis is about which
      columns exist, and a rank statement derived from it would be a
      non-sequitur.

  proof_search_map:
    bottleneck: >-
      The support-gap term in every deficit this goal reports. Since BATCH-002
      the lane's headline number has been quarantined on the ground that the sem
      is "missing 16016 degree-6 columns vs the full-support null, so >= ~89% of
      17947 is a degree-6 support gap"; BATCH-003 deferred CTRL-B to pin it;
      EV-DREG-006/007/008 spent a protocol freeze, a red-team pass and a chunked
      1,623.8 s / 7.16 GB run obtaining it. Every one of those steps needed one
      integer that is a binomial identity. Settling how that integer is obtained
      is upstream of the goal's own next_action and consumes none of its compute.
    baseline_embedding:
      parameter_slice: >-
        n = 9, D = 5 and D = 6, where BOTH missing counts (1,584 and 1,848) are
        committed by a different lineage (EV-SIG-006 / H-SDEG-0dd021) from the
        n = 12 and n = 21 cells, and where the full-support saturation
        rank = ncols - |V| = 31,179 is machine-confirmed. This is the slice at
        which any competing account of the column set must also agree.
      reproduction_check: >-
        SYMBOLIC AND EXACT, ALREADY RUN BEFORE THIS RECORD WAS WRITTEN. The
        closed form returns 1,584 / 1,848 / 29,332 at n = 9; 16,016 / 174,035 at
        n = 12; 778,394 at n = 21. Separately, and as a check that the ambient
        conventions match the lane's, the same reconstruction returns
        N(24,6) = 190,051, nrows(9,6) = 45,324, nrows(12,6) = 183,312 and
        nrows(12,5) = 31,512, all committed. A curve that merely resembles the
        baseline is not an embedding; these are exact integer identities.
    observation_collision:
      observable: >-
        The integer u_D (equivalently ncols) at a cell, and the degree histogram
        of the missing columns.
      distinct_preimage_search: >-
        A COLLISION EXISTS BY CONSTRUCTION AND IS THE HYPOTHESIS'S MAIN
        LIMITATION, stated rather than discovered later: the observable is
        constant across every system with the same block incidence pattern, so
        the sem system, a block-matched random null, and any of the 2^{sum
        |supp f_i|} members of that ensemble ALL share it. u_D therefore cannot
        distinguish the sem from a random system on the same supports and must
        never be cited as evidence of Semaev-specific structure. The collision on
        the OTHER side - two systems with the same u_D but different block
        patterns - is searched for by the graded control (adding cross-block
        monomials changes u_D monotonically) and by the block-permuted control;
        if a permuted block pattern gives the identical u_D, the observable is
        responding to block SIZES rather than to incidence and the derivation's
        step 3 is under-determined.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "the Macaulay column set", an object that must be built and
          enumerated, by the block occupancy vector (a, b1, b2, b3) and a
          reachability predicate on it. The count then becomes an
          inclusion-exclusion over four binomials - an exact equality rather than
          an enumeration.
        predicted_gain: >-
          Encoding: exact (the predicate is derived from the supports, not
          fitted). Completeness: every column of the real object is counted -
          checked by set hash, not by count, in stage 2. Soundness: no column is
          counted that the real object lacks - same check. Transfer: DECLARED
          UNMET for t >= 4 (where u-to-u links make the block graph a path) and
          for prime fields. Cost loss: none; the identity is cheaper than the
          object on every axis.
      - transform: observable_fiber
        proposed_object: >-
          Hold u_D fixed and vary the forgotten structure - coefficients, curve,
          R_X, basis, seed. The intrinsic invariant proposed to distinguish the
          resulting objects is NONE: the hypothesis asserts they are
          indistinguishable by this observable.
        predicted_gain: >-
          The gain is a prohibition, which is the useful kind here: it forbids
          any future record from reading arithmetic structure out of a column
          count. That prohibition is the direct answer to the BATCH-002
          quarantine's implicit assumption that the support gap says something
          about the sem.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER: EXISTS one closed form U (fixed, parameter-free,
      written before any comparison) FORALL (n, D, seed, curve E, point R, basis
      alpha) in the declared boundary, such that the measured missing-column
      count equals U(n,D) exactly. The witness U may NOT depend on n, D, seed,
      curve, R or alpha - it is one formula in two integer arguments. The weaker
      order, FORALL cells EXISTS a formula, is trivially satisfiable and is
      explicitly NOT claimed. THE SEED QUANTIFIER IS THE ONE AT RISK: the
      committed n = 12 pair (16,016 at seed 2026, 16,018 at seed 2) already shows
      the FORALL-over-seeds failing by 2, so the honest statement of the claim is
      the generic-case one - U(n,D) is the minimum, attained for generic seeds -
      and the exact-for-all-seeds form is FALSE as written and is recorded here
      as false rather than quietly weakened later.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: an exact, toy-tier, BOOLEAN-ONLY, t = 3 column-count identity,
        validated at the six committed cells and at whatever forward cells are
        built. It cannot certify a rank, a deficit, a solving degree, a
        first-fall degree, a cost, or anything about H-DREG-001's mathematical
        content. It cannot close RQ-DREG-001, cannot support or weaken the
        polynomial-solve scenario, and cannot be cited toward any prime-field
        statement.
      nearby_object_control: >-
        THE FULL-SUPPORT RANDOM NULL at the same n and D - same ring, same degree
        histogram (n quadrics, n cubics), same nb, supports drawn from all four
        blocks. It is the closest object to the sem in every respect the lane
        currently records, and the hoped-for conclusion FAILS there: its forced
        u_D is EXACTLY 0 at every D >= 2. A method that returns a nonzero missing
        count for the full-support null is responding to its own partitioning of
        the variables rather than to the equations, and has not identified the
        load-bearing structure. A SECOND nearby control, also zero-compute: the
        BLOCK-PERMUTED system, in which the degree-3 family is placed on (U,X3)
        and the degree-2 family on (U,X1,X2). Its forced u_D differs from the
        true one in a computable way (the roles of the "needs a U and an X3" and
        "needs U, X1 and X2" conditions swap), so a measurement that cannot
        separate the pair is measuring block sizes, not incidence.
    proof_obligations:
      - claim: >-
          The char-2 expansion S_3(a,b,c) = a^2b^2 + a^2c^2 + b^2c^2 + abc + B
          and the F_2-linearity of coordinate squaring.
        responsibility: correctness
      - claim: >-
          Family A's support omits X1 and X2 entirely, family B's omits X3
          entirely, and supp(B) has no degree-1 monomial.
        responsibility: correctness
      - claim: >-
          The up-closure column law composes with those supports to give exactly
          the reachability predicate of step 3.
        responsibility: completeness
      - claim: >-
          u_j = 0 for j <= D-2, so the entire deficiency sits in the top two
          degrees - and in the top degree alone whenever C(k,D-1) = 0.
        responsibility: correctness
      - claim: >-
          The inclusion-exclusion has no missing term (verified independently by
          direct enumeration at n = 9 and n = 12, where enumeration is cheap).
        responsibility: strictness
      - claim: >-
          The identity is a column-set statement and carries no rank consequence.
        responsibility: scope
      - claim: >-
          Nothing transfers to t >= 4 or to prime fields; the block graph and the
          field both change.
        responsibility: scope
    not_applicable_reason: null

  heuristic_assumptions:
    - id: HEUR-BLK-1
      formal_statement: >-
        UP-CLOSURE COMPOSITION. For every cell in the declared boundary, the
        degree-D Macaulay column set equals the union over equations f_i and
        multiplier monomials mu with deg(mu) <= D - d_i of supp(f_i)*mu, with no
        column lost to coefficient cancellation and none gained.
      random_model_justification: >-
        Not a distributional claim; it is a structural one, and its only
        empirical risk is cancellation. EV-SIG-006 machine-verified exactly this
        at n = 9 seed 1 across D = 3..6 on both arms with zero cancellation and
        zero parity deviation. That is one n and one seed, and the hypothesis
        needs it at all of them.
      supporting_results: []
      validation_experiment_ids: [EXP-DREG-519ad9]
      falsification_condition: >-
        Rebuild the column SET (not its count) from committed supports at n = 9
        and n = 12 and compare set hashes against the predicate of step 3. Any
        column present in one and absent in the other falsifies the composition
        at an exhibited monomial.
    - id: HEUR-BLK-2
      formal_statement: >-
        GENERIC SUPPORT COVERAGE. For every admissible basis alpha and constant
        R_X, the union over the n coefficient equations of family A contains
        every pair u_{1,j} x_{3,i}, and the union over family B contains every
        triple u_{1,j} x_{1,i} x_{2,i'}.
      random_model_justification: >-
        NONE THAT SURVIVES SCRUTINY, AND IT IS ALREADY KNOWN TO FAIL SLIGHTLY.
        The claim is about the F_2-linear "coefficient of alpha^l" functionals
        applied to products of basis elements, and it can fail for particular
        bases. The committed data show one seed attaining the generic value
        (16,016) and one exceeding it by 2 (16,018), which is the behaviour of a
        near-generic property, not of a theorem.
      supporting_results: []
      validation_experiment_ids: [EXP-DREG-519ad9]
      falsification_condition: >-
        MEASURED FIRST, AND REPORTED BEFORE ANY MODEL ERROR. For each cell with
        more than one committed seed, report the seed-to-seed spread of the
        measured u_D before reporting the law's error there. If the spread is
        comparable to or larger than the error, the law is describing seed noise
        and must be reported as a generic bound with a measured fluctuation, not
        as an identity. Concretely: the n = 12 D6 pair must be explained by
        exhibiting exactly two absent support pairs by name, or HEUR-BLK-2 is
        reported unvalidated.

  structural_ingredients:
    - description: >-
        Characteristic-2 Frobenius additivity and the F_2-linearity of coordinate
        squaring under Weil descent.
      citation: >-
        Elementary; derived in this record from src/semaev_tree.py lines 50-52
        and 90-171, which were READ. No external citation is asserted.
      role: fixes the boolean degree histogram and the support of each family
    - description: >-
        Up-closure column-formation law with degree slack.
      citation: >-
        ledger/evidence/EV-SIG-006.yaml, observation (1), machine-checked at
        n = 9 seed 1 across D3..D6 on both arms.
      role: converts equation supports into the exact column set
    - description: >-
        Inclusion-exclusion over block occupancy vectors.
      citation: Elementary; derived in this record.
      role: converts the column set into a closed-form count

  reduction_chain:
    core_problem: >-
      Determine, without building the system, exactly which degree-D monomials
      appear as Macaulay columns for the boolean chained Semaev family at t = 3,
      and how many do not.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. There is no corollary about rank, deficit, d_reg,
      first-fall degree, cost, or any prime-field statement, and none is claimed.
      A column-count identity constrains the SHAPE of the matrix and says nothing
      about its rank. Any future record that cites this hypothesis toward a d_reg
      or cost conclusion is making an unsupported inference and this note exists
      to make that visible.

  predictions:
    - metric: >-
        G1 - exact reproduction of the six committed column integers
        (1,584; 1,848; 16,016; 29,332; 174,035; 778,394)
      direction: different
      minimum_effect: >-
        'EXACT equality on all six, zero tolerance. In-sample; must be reported
        as reproduction, never as prediction.'
    - metric: >-
        G2 - forward, out-of-sample column counts at the unbuilt rungs
      direction: different
      minimum_effect: >-
        'EXACTLY ncols(15,5) = 143,421; ncols(17,5) = 314,472; ncols(18,5) =
        358,678; ncols(24,5) = 1,522,577; ncols(30,5) = 4,669,266; ncols(15,6) =
        690,690; ncols(18,6) = 2,122,294; ncols(21,6) = 5,467,260. Frozen here
        before any of them exists. n = 17 is the discriminating cell because it
        is off-lattice.'
    - metric: >-
        G3 - full-support null control: measured u_D of a random boolean system
        with the same degree histogram and full supports
      direction: different
      minimum_effect: >-
        'EXACTLY 0 at every D >= 2 and every n. This control CAN fail and its
        failure voids the whole experiment: a nonzero value means the up-closure
        implementation is wrong.'
    - metric: >-
        G4 - degree histogram of the missing set
      direction: different
      minimum_effect: >-
        'Missing columns occur at degree D and degree D-1 ONLY, never below.
        At n = 12 D6 this predicts all 16,016 at degree exactly 6, matching the
        committed admission metric deleted_degree_histogram_equals_6_16016. At
        n = 21 D5 it predicts 196,518 at degree 5 and exactly 70 at degree 4.'
    - metric: >-
        G5 - seed residual at n = 12 D6
      direction: lower
      minimum_effect: >-
        'The seed-2 excess over 16,016 is EXACTLY 2 and is accounted for by
        exactly two named absent support monomials. A residual that cannot be
        exhibited monomial-by-monomial is reported as an unmodelled term.'
    - metric: >-
        G6 - block-permuted nearby control: u_D of the system with the degree-3
        family on (U,X3) and the degree-2 family on (U,X1,X2)
      direction: different
      minimum_effect: >-
        'Different from the true u_D, by the computable amount that swapping the
        two reachability conditions produces. If identical, the observable
        responds to block sizes rather than incidence and step 3 is
        under-determined.'
    - metric: >-
        G7 - graded control, 5 interior points, monotonicity reported: u_D as a
        fraction f of the forbidden cross-block monomials is added to the
        supports, f in {0, 0.25, 0.5, 0.75, 1}
      direction: lower
      minimum_effect: >-
        'Strictly decreasing in f and EXACTLY 0 at f = 1. A quantity that fails
        to decay as the parameter meant to destroy it increases is the canonical
        artifact tell; this arm exists to trigger it, and a non-monotone curve
        localises the residual to a named monomial class.'

  test_boundary:
    instances:
      - >-
        Boolean chained Semaev, t = 3, ti = 0, m = 3, builder src/semaev_tree.py
        (and the EXP-SIG-*/EXP-DREG-* copies, diffed).
      - >-
        Sizes n in {9, 12, 15, 17, 18, 21} for validation against committed or
        buildable cells; n in {24, 27, 30} for forward prediction only, where no
        system need be built.
      - >-
        Degrees D in {5, 6} primarily; D in {3, 4} as anchor-reproduction
        controls. D >= 7 is outside the validated boundary and the law is stated
        for it only as an extrapolation of the same derivation.
      - >-
        t >= 4 is OUT OF SCOPE. The chain then has u-to-u links, the block graph
        becomes a path rather than two blocks sharing a vertex, and the
        reachability predicate changes. No claim is made about it.
      - >-
        Prime fields are OUT OF SCOPE entirely. The derivation uses char-2
        Frobenius at its first step.
