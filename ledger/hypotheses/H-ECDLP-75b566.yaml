hypothesis:
  id: H-ECDLP-75b566
  question_id: RQ-ECDLP-002
  source_proposal: IDEA-20260904-f7ee90
  added: '2026-09-07'
  proposed_by: coordinator
  goal_id: null
  goal_id_note: >-
    RQ-ECDLP-002 is bound to GOAL-ECDLP-001. This hypothesis does not open a
    batch on that head and does not edit goal.yaml. The standing campaign is
    a pointer, not a lane claim.
  statement: >-
    SETTING. E/F_p a self-generated toy prime-field curve, P of prime order
    n, Q = [k]P with k chosen by the sampler. No live key, wallet, or
    deployed system. No discrete logarithm is solved except inside the
    planted-atypicality calibration, where k is known by construction.

    CLAIM. For every cell of the frozen EXP-ECDLP-df601f ladder (eight prime
    orders in the 17-27 bit band, four curves per order, five auxiliary
    discriminants), the three named heuristics of the auxiliary-order
    smoothness-splitting family hold within the pre-registered bands:

      HEUR-A (coset typicality). The normalised minimum of the instance
      coset phi_d^{-1}(k) of R_d = Z[sqrt(-d)] has the same distribution as
      a uniformly random coset of ker(phi_d).

      HEUR-B (norm smoothness). The largest-prime-factor statistic of
      N(alpha_min) matches a uniformly random integer of the same size
      after the binary-form representability correction shared with NULL-I.

      HEUR-C (class equidistribution). Balanced prefixes of a B-smooth
      ideal of R_d are equidistributed in Cl(R_d), so the principal
      fraction is 1/h(-4d).

    CLOSURE READING. All three heuristics sit inside their pre-registered
    bands, the sham-modulus null is indistinguishable from the on-curve
    sample, and the planted calibration recovers the dialled atypicality
    including the n^{-1/6} point. Honest headline: three named heuristics
    measured over the declared toy ladder with four nulls and two planted
    positives, all consistent. This validates heuristics, not the cost
    formula of IDEA-20260904-982159, and proves no bound.

    LEAD READING. A median on-curve / NULL-R minimum ratio below 0.5 in
    three or more cells, growing in n and not in M, is the ECDLP analogue
    of the exemplar's Theorem 1.5 (true object smaller than counting
    predicts). Through IDEA-20260904-7caed1 it would move the implied
    exponent to 1/2 - c/2. It is still no attack: a measured median is not
    a theorem, and converting it requires a separate proposal.

    INSTRUMENT READING. The d = 1 closed form fails, or the planted
    n^{-1/6} calibration is not recovered: nothing is reported
    (AGENTS.md rule 3 / inventor-protocol section 3).

    SHAM-CHANNEL READING. The sham-modulus null disagrees with the
    on-curve sample: the family is suspended until the unmodelled channel
    is identified.
  mechanism: >-
    THE TRACKED OBJECT is the triple (minimum norm of phi_d^{-1}(k),
    largest prime factor of that norm, principal fraction among its
    balanced prefixes), followed across resampling of k, of the curve,
    and of the auxiliary d. It is a lossy projection of the ECDLP
    instance: three real numbers retained of log2 n bits; the fibre is
    enormous; the discard is compatible with resampling k, which is the
    only operation this hypothesis performs.

    HOW EACH QUANTITY IS COMPUTED WITHOUT SOLVING A DISCRETE LOGARITHM.
    The sampler chooses k, so the coset is available directly. Rank-2
    minima are Lagrange-Gauss; higher-rank minima (if any d-cell uses
    them) are LLL in the Minkowski embedding. The norm is at most about
    n^{5/3} < 50 bits on this ladder and is factored by trial division
    and integer Pollard rho. The principal fraction is ideal reduction
    in Cl(R_d) with h computed exactly. THE ENTIRE MEASUREMENT IS LATTICE
    AND INTEGER ARITHMETIC; the elliptic curve supplies n, and NULL-S
    (sham modulus, no curve) is the control that checks that claim.

    THE PLANTED CALIBRATION. Cosets are shifted so that the minimum is
    smaller than typical by a known factor f taking the five frozen
    values {1, n^{-1/12}, n^{-1/8}, n^{-1/6}, n^{-1/4}}. An instrument
    that cannot recover f, especially at n^{-1/6} (the exemplar's own
    gain, translated), cannot report the absence of atypicality.

    STAGES (full detail in EXP-ECDLP-df601f). Stage 0: formal statements
    and pre-registered bands (zero compute). Stage 1: samplers plus
    POSITIVE CONTROL A (d = 1 closed form) and POSITIVE CONTROL B
    (planted sweep) as a hard gate. Stage 2: the three measurements over
    the full ladder with NULL-R, NULL-S, NULL-I, NULL-H. Stage 3: the
    (n, M) decay surfaces. Stage 4: only if a lead fires, stop and route
    to independent review. No attack is run.
  assumptions:
    - >-
      n prime, gcd(n, p) = 1, curve and scalar self-generated at toy
      scale. NO LIVE KEY, WALLET, OR DEPLOYED SYSTEM.
    - >-
      The sampler knows k by construction. Every measurement code path
      is statically checked not to read k except the coset constructor.
      A statistic that reads k measures its own input.
    - >-
      Anomalous (#E = p) and smooth-order curves are excluded before a
      curve enters the run set (KN-TECH-034 as stated in
      IDEA-20260901-b4e6eb and H-ECDLP-a4be60). Satisfied by construction
      of the frozen ladder (N prime, N != p).
    - >-
      Ladder: eight prime-order cells spanning three decades in the 17-27
      bit band, four curves per cell, five auxiliary d in {1, 2, 5, 13, 23}.
      Transfer to cryptographic n is an explicit unlicensed extrapolation.
    - >-
      Independent seeds for the on-curve arm and each of NULL-R, NULL-S,
      NULL-I, NULL-H. Seed reuse across nulls voids the comparison.
  proof_search_map:
    bottleneck: >-
      Not a proof bottleneck; this hypothesis proves nothing. The
      MEASUREMENT bottleneck is exact computation of h(-4d) and of the
      class of each balanced prefix, which caps |disc| near 2^40 and
      therefore caps what HEUR-C can be validated over. On this frozen
      d-list every |disc| is below 100, so the cap is not binding.
    baseline_embedding:
      parameter_slice: >-
        d = 1. The auxiliary lattice degenerates to Z, the coset is
        k + nZ, its absolute minimum is the least residue of k, and that
        law is uniform on [0, n/2]. The principal fraction is identically
        1 because Z is a PID.
      reproduction_check: >-
        FROZEN FIXTURE. At d = 1 the empirical CDF of the coset minimum
        must match the uniform law on [0, n/2] with a Kolmogorov-Smirnov
        p-value above 0.01 at every rung, in exact integer arithmetic.
        The HEUR-C estimator must return exactly 1.000. A pipeline that
        fails the one case with a closed-form answer is not measuring
        what it claims and no other cell is reportable.
    observation_collision:
      observable: >-
        The triple (normalised coset minimum, largest prime factor of
        its norm, principal fraction).
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED. The on-curve sample and the
        SHAM MODULUS sample are structurally different objects and are
        predicted to produce the SAME observable. That collision
        calibrates the conclusion to "the auxiliary construction sees
        nothing about the curve". A failure to collide is the most
        interesting outcome and suspends every exponent claim in the
        family until explained.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable fixed and vary the forgotten structure
          (curve, the curve's own CM discriminant, auxiliary d, bit
          size) and test whether any intrinsic invariant distinguishes
          the samples. The prediction is that none does.
        predicted_gain: >-
          Either closes the family on a measured ground or produces the
          one inequality the exemplar's method needs and prime-field
          ECDLP is not known to have.
      - transform: specialization_pack
        proposed_object: >-
          Build the resource measure as a per-cell record
          (curve, n, d, M, statistic, seed) and add charges only over
          proved-disjoint cells, so the ladder can be extended later
          without re-running what exists.
        predicted_gain: >-
          A reusable calibration artifact rather than a single verdict,
          which is what IDEA-20260807-347a83 says the corpus is missing.
    quantifier_order: >-
      FOR ALL cells in the DECLARED ladder, the on-curve empirical
      distribution of each of the three statistics is within the
      pre-registered band of its matched null. The quantifier is over
      the declared ladder and the declared statistics only. The stronger
      reading -- typicality for every curve, every n, every auxiliary
      parameter -- is NOT claimed.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: on the tested toy ladder the three heuristics hold
        within the pre-registered bands, with the stated
        Kolmogorov-Smirnov statistics and sample sizes, and the
        sham-modulus null is indistinguishable from the on-curve sample.
        It can NEVER certify the cost formula that depends on them, it
        certifies nothing at cryptographic n, and it proves no bound.
      nearby_object_control: >-
        The nearby object where the desired conclusion FAILS is the
        exemplar's own setting, where the analogous typicality assertion
        is FALSE by a theorem: the minimal isogeny degree is p^{1/3}
        against a pigeonhole p^{1/2}. The planted-atypicality calibration
        is the in-scope stand-in, and an instrument that cannot detect a
        planted factor n^{-1/6} has not shown it could see the phenomenon
        it is reporting absent. That planted value is a REQUIRED
        calibration point.
    proof_obligations:
      - claim: >-
          The d = 1 slice reproduces the closed-form uniform law and
          principal fraction 1.
        responsibility: baseline
      - claim: >-
          The planted-atypicality calibration recovers the dialled factor
          at all five values including n^{-1/6}.
        responsibility: feasibility
      - claim: >-
          No measurement code path reads k except the coset constructor.
        responsibility: interface
      - claim: >-
          Every reported statistic names the curve, n, d, M, the
          estimator and the seed.
        responsibility: scope
      - claim: >-
          Reported deviations are decomposed into n-dependence and
          M-dependence; any deviation flat in n and decaying in M is a
          controlled null.
        responsibility: correctness
    not_applicable_reason: null
  rerandomization: >-
    Not a worst-to-average-case walk. The sampler draws k uniformly in
    Z/n, so the instance-defined coset is already a uniformly random
    fibre of phi_d. Mixing is exact because a coset is enumerated, not
    walked. No pull-back of a solution is required: no discrete logarithm
    is solved.
  asymptotic_claim: null
  asymptotic_claim_note: >-
    This hypothesis validates three heuristics. It claims no complexity
    improvement. IF the P1 lead branch fired at deficiency n^{-c}, the
    implied exponent through IDEA-20260904-7caed1 would be 1/2 - c/2;
    that is a conditional consequence of another record and is not a
    claim of this one.
  heuristic_assumptions:
    - id: HEUR-A
      formal_statement: >-
        For a prime n, an auxiliary order R_d = Z[sqrt(-d)] with a ring
        homomorphism phi_d onto Z/n, and k uniform in Z/n, the
        normalised minimum of the coset phi_d^{-1}(k) has the same
        distribution as that of a uniformly random coset of ker(phi_d),
        uniformly over the frozen ladder of curves of order n and over
        the frozen d-list.
      random_model_justification: >-
        The fibre is a coset of a full-rank lattice of covolume
        n * sqrt(d). Under the Gaussian heuristic a random such coset
        has minimum of order V^{2/r} with an explicit limiting law in
        rank 2 (RECALLED). The curve enters only by supplying n.
      supporting_results:
        - >-
          Rigorous half: Minkowski's convex body theorem bounds the
          minimum from above unconditionally (RECALLED). Classical
          distribution: the Gaussian heuristic for a random coset,
          explicit in rank 2 (RECALLED). THE LOWER BOUND IS NOT
          AVAILABLE, and the exemplar's setting is a known
          counterexample to the analogous assertion, which is why this
          is measured and not assumed.
      validation_experiment_ids:
        - EXP-ECDLP-df601f
      falsification_condition: >-
        A median on-curve / NULL-R minimum ratio below 0.5 in three or
        more cells, with the deficiency GROWING in n and not in M
        (P1 lead branch / F4). A sham-modulus disagreement (P4 / F3)
        also falsifies the "curve supplies only n" half.
    - id: HEUR-B
      formal_statement: >-
        N(alpha_min) is B-smooth with the probability of a uniformly
        random integer of its size after the form-representability
        correction that NULL-I shares: the distribution of
        log(largest prime factor) / log N matches that of a random
        integer of the same size conditioned on being represented by
        the same quadratic form, uniformly over the ladder.
      random_model_justification: >-
        Values of a binary quadratic form represent only integers whose
        prime factors split or ramify, an n^{o(1)} effect already
        carried in the sibling cost formula. After that correction the
        remaining smoothness law is the classical Dickman-de Bruijn
        law for a random integer of the same size.
      supporting_results:
        - >-
          Rigorous half: Canfield-Erdos-Pomerance count of smooth
          integers (RECALLED). Classical distribution: Dickman-de Bruijn
          rho(u) (RECALLED). Known slack: form-representability, isolated
          by NULL-I.
      validation_experiment_ids:
        - EXP-ECDLP-df601f
      falsification_condition: >-
        A curve-specific smoothness excess not shared by NULL-I, or a
        tail (smoothest sample of M draws) whose rho(u_s) is outside a
        factor 4 of 1/M and not shared by NULL-I (P2 lead).
    - id: HEUR-C
      formal_statement: >-
        Balanced prefixes of a B-smooth ideal of R_d are equidistributed
        in Cl(R_d), so the principal fraction is 1/h(-4d), uniformly
        over the frozen d-list and the frozen smoothness bound.
      random_model_justification: >-
        Split prime ideals of norm at most B generate the class group
        and equidistribute by Chebotarev (RECALLED). A product of omega
        independent uniform class elements is uniform for omega of
        order log h. THE PREFIXES OF ONE alpha ARE NOT INDEPENDENT; that
        is why HEUR-C is the heuristic most likely to fail.
      supporting_results:
        - >-
          Rigorous half: Chebotarev equidistribution of split primes in
          the class group (RECALLED). Imitated statement: a product of
          omega independent uniform class elements is uniform. The
          composition from prefixes of one ideal to independence is
          unwritten in this program.
      validation_experiment_ids:
        - EXP-ECDLP-df601f
      falsification_condition: >-
        A measured principal fraction reproducibly above 4/h in the
        cells with h > 1 (P3 lead / F5). At d = 1 the fraction must be
        exactly 1; any other value is an implementation failure, not a
        mathematical falsification (F1).
  structural_ingredients:
    - description: >-
        Auxiliary-order smoothness splitting for prime-field ECDLP: the
        construction, the element-split pin, and the cost formula
        T = n^{1/2} (h(-4d)/sqrt(d))^{1/2} n^{o(1)} that these three
        heuristics underwrite.
      citation: IDEA-20260904-982159
      provenance: internal
      verified_by: >-
        ledger/proposals/IDEA-20260904-982159.yaml read in full in this
        design session (TASK-20260907-f2e745 authorship).
      role: sibling algorithm whose heuristics this hypothesis measures
    - description: >-
        Y_min versus Y_gen criterion: a measured deficiency n^{-c} in
        the coset minimum moves the implied exponent to 1/2 - c/2.
      citation: IDEA-20260904-7caed1
      provenance: internal
      verified_by: >-
        Title and claim of ledger/proposals/IDEA-20260904-7caed1.yaml
        read in this design session; the criterion is cited as a
        conditional consequence, not discharged.
      role: conversion of a HEUR-A lead into an exponent statement
    - description: >-
        Wesolowski's heuristic-validation design (sampling via a
        correspondence, empirical CDF of the log of the largest prime
        factor against Dickman-de Bruijn rho(u), zoom on the smoothest
        samples, explicit tail consistency).
      citation: docs/target-result-profile.md section A7
      provenance: internal
      verified_by: >-
        docs/target-result-profile.md section A7 used as the template;
        inputs/P13-WESOLOWSKI-2026/paper_fulltext.md was NOT opened in
        this session. Second-hand from the profile document.
      role: experimental-design template
    - description: >-
        Parallel Pollard rho with distinguished points and the negation
        map at about 0.886 sqrt(n) group operations.
      citation: KN-TECH-006
      provenance: internal
      verified_by: >-
        Second-hand from H-ECDLP-a4be60 structural_ingredients and
        IDEA-20260904-f7ee90 citations. Not re-opened in this session.
      role: matched cost-comparator, not an attack under test
    - description: >-
        One-instance-per-cell calibration hole: every yield and
        smoothness band in the campaign calibrated on one curve
        instance per cell.
      citation: IDEA-20260807-347a83
      provenance: internal
      verified_by: >-
        Cited from IDEA-20260904-f7ee90 novelty_screen (title and
        summary). The record body was NOT re-opened in this session.
      role: design constraint (four curves per prime-order cell)
  reduction_chain:
    core_problem: >-
      Distributional typicality of the auxiliary-order coset attached to
      a prime-field ECDLP instance (three named heuristics).
    corollaries: []
  predictions:
    - metric: >-
        P1 -- two-sample Kolmogorov-Smirnov statistic between the
        on-curve and NULL-R distributions of the normalised coset
        minimum, per (curve, n, d) cell
      direction: different
      minimum_effect: >-
        PRE-REGISTERED TWO-BRANCH RULE. p-value above 0.01 in at least
        95 percent of cells, with no systematic sign to the median
        shift across the ladder, records the CLOSURE branch for HEUR-A.
        A median ratio below 0.5 in three or more cells, deficiency
        GROWING in n and not in M, records the LEAD branch. Between is
        INCONCLUSIVE in advance.
    - metric: >-
        P2 -- empirical CDF of log(largest prime factor of
        N(alpha_min))/log N against NULL-I primarily and rho(u)
        secondarily, with a zoom on the 500 smoothest samples per cell
      direction: different
      minimum_effect: >-
        On-curve CDF agrees with NULL-I at KS p above 0.01. Tail: the
        smoothest sample of M draws is s-smooth with rho(u_s) within a
        factor 4 of 1/M. A curve-specific smoothness excess not shared
        by NULL-I is a lead.
    - metric: >-
        P3 -- measured principal fraction of balanced prefixes against
        1/h, per (d, n) cell, and against NULL-H
      direction: different
      minimum_effect: >-
        Within a factor 2 of 1/h in at least 90 percent of cells with
        h > 1 records HEUR-C as validated in scope. A measured fraction
        reproducibly above 4/h is the most consequential negative
        (class-number penalty smaller than derived). At d = 1 the
        fraction is exactly 1.
    - metric: >-
        P4 -- Kolmogorov-Smirnov statistic between the on-curve and
        NULL-S samples on all three statistics
      direction: different
      minimum_effect: >-
        p above 0.01 in at least 95 percent of cells. Disagreement is
        a BLOCKING finding: the family is suspended.
    - metric: >-
        P5 -- recovered planted factor in POSITIVE CONTROL B, at the
        five frozen dialled values including n^{-1/6}
      direction: different
      minimum_effect: >-
        Recovered within 20 percent at all five values. Failure at
        n^{-1/6} means P1 may return only INCONCLUSIVE, never a closure.
    - metric: >-
        P6 -- decomposition of every reported deviation into its
        n-dependence and its M-dependence
      direction: different
      minimum_effect: >-
        Any deviation flat in n and decaying like M^{-1/2} is reported
        as a CONTROLLED NULL and not as structure.
  test_boundary:
    instances: >-
      The frozen ladder of EXP-ECDLP-df601f: eight prime-order cells
      T in {17, 18, 19, 21, 23, 24, 25, 27}, four curves per cell,
      model y^2 = x^3 + x + b over F_p, a = 1, selected by
      experiments/EXP-ECDLP-df601f/design/select_ladder.py with output
      experiments/EXP-ECDLP-df601f/design/ladder.json. All
      self-generated, toy, no key involved. Auxiliary d in
      {1, 2, 5, 13, 23}.
    parameters:
      n_bits_band: '17 to 27 (eight rungs, span n_max/n_min >= 1000)'
      curves_per_cell: 4
      auxiliary_d: [1, 2, 5, 13, 23]
      samples_P1_P2: 10000
      samples_P3: 1000
      samples_HEUR_B_factorizations: 100000
      planted_factors: ['1', 'n^{-1/12}', 'n^{-1/8}', 'n^{-1/6}', 'n^{-1/4}']
      cm_exclusion: 'j not in {0, 1728}; N prime; N != p'
    implementation: >-
      Lagrange-Gauss (rank 2) or LLL (higher rank) for the coset
      minimum; complete integer factorisation of N(alpha_min); exact
      class-group reduction for prefixes; two-sample Kolmogorov-Smirnov
      against the named nulls. No discrete logarithm is solved except
      in POSITIVE CONTROL B, where k is known by construction.
    budget: >-
      See EXP-ECDLP-df601f. Advisory wall-clock and CPU; peak memory
      sized for the T=27 QR-table and the 10^5-sample factorisation
      buffers. Memory and worker limits remain machine protection.
  falsification_conditions:
    - >-
      F1. POSITIVE CONTROL A fails: the d = 1 slice does not reproduce
      the closed-form uniform law or returns a principal fraction other
      than 1. Implementation failure; nothing is reported
      (AGENTS.md rule 3).
    - >-
      F2. POSITIVE CONTROL B fails at the n^{-1/6} calibration point.
      The instrument cannot see an effect the size of the exemplar's
      own gain. P1 may then return only INCONCLUSIVE, never a closure.
    - >-
      F3. P4 fails: the sham modulus disagrees with the on-curve
      sample. THE FAMILY IS SUSPENDED.
    - >-
      F4. P1 fires the lead branch: curve-defined coset minima
      systematically below random ones, deficiency growing in n.
      THE LEAD. Still no attack; a measured median is not a theorem.
    - >-
      F5. P3 fires: principal fractions reproducibly above 4/h. The
      class-number penalty is smaller than derived. Independent review
      before any interpretation.
    - >-
      F6. All three heuristics validate within their bands and all
      nulls agree. THE PREDICTED OUTCOME. Heuristics validated in the
      tested scope; the cost formula is not certified; no bound is
      proved.
    - >-
      F7. Class-group or factorisation budget exhausted before the
      ladder resolves. INFRASTRUCTURE outcome under AGENTS.md rule 3,
      never mathematical evidence; the ladder is truncated and the
      scope shrinks with it.
  interpretation_limits:
    - >-
      THIS HYPOTHESIS VALIDATES HEURISTICS, NOT A COST FORMULA. No
      conclusion about any algorithm's exponent may be drawn from it
      alone; that requires IDEA-20260904-982159's own Stage 3.
    - >-
      A closure branch closes the DECLARED LADDER on the TESTED toy
      family. It does not close the auxiliary-ring family at
      cryptographic n and no extrapolation is licensed.
    - >-
      A lead branch is a MEASURED distributional statement, not a
      theorem. The criterion it feeds requires a rigorous bound.
    - >-
      Every external distributional statement (Dickman-de Bruijn,
      Gaussian heuristic, Brauer-Siegel, Chebotarev) is `recalled`
      until a later record verifies the source.
    - >-
      Disjoint from H-ECDLP-a4be60 / EXP-ECDLP-56ee42: nothing here is
      a digit statistic, a Fourier coefficient, or a majority
      advantage, and no arm may be run inside that contract or on its
      frozen six-rung single-curve ladder as a substitute.
  drafting_provenance:
    drafted_by: >-
      The Coordinator role, exercised in the top-level cloud-agent
      session that ran /design-experiment on 2026-09-07. The
      design-experiment skill directs this drafting to the coordinator
      subagent; this session holds coordinator authority and authored
      the records directly against the selected proposal
      IDEA-20260904-f7ee90, the hypothesis/experiment templates, and
      the EXP-ECDLP-56ee42 heuristic-validation pattern.
    design_time_computations:
      performed_by: 'top-level orchestration session (shell), 2026-09-07'
      artifacts:
        - experiments/EXP-ECDLP-df601f/design/select_ladder.py
        - experiments/EXP-ECDLP-df601f/design/ladder.json
      facts:
        - 'ladder selection (deterministic; table in the experiment contract)'
        - 'each overlapping T-cell in {17,19,21,23,25,27} contains the EXP-ECDLP-56ee42 curve, by the shared scan, used here as a baseline-embedding fixture (it need not be curve_index 0)'
  status: specified
  proposed_at: '2026-09-07'
