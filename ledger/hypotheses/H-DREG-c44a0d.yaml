hypothesis:
  id: H-DREG-c44a0d
  question_id: RQ-DREG-d7b6d6
  proposal_id: IDEA-20260922-469f79
  added: '2026-09-22'
  title: >-
    The eliminated graph of one certified Vélu edge does not lower last-fall
    degree or grevlex solving degree by more than a random enrichment of the
    same generator degree
  statement: >-
    On the certified edge produced by EXP-DREG-dd668d, at rung n=1, let
    I_native be the codomain chained ideal, I_graph the same ideal after
    eliminating the domain variables from the domain ideal plus the cleared
    isogeny equations, and I_random the native ideal plus the same number of
    extra generators of total degree at most ell with the Vélu monomial
    support and frozen non-Vélu coefficients. For each named degree D in
    {last-fall degree, grevlex solving degree}, the drop D(I_native) - D(I_graph)
    is strictly larger than the drop D(I_native) - D(I_random), or it is not.
    A strictly larger graph drop is a presentation effect. An equal or smaller
    drop is generic enrichment. Agreement of I_graph with I_native is a
    presentation that does not move D. No new factor base is claimed. No
    ECDLP exponent is claimed.
  mechanism: >-
    The representation is the graph of the certified degree-2 isogeny inside
    the product of the domain and codomain charts (R3, an E times E' gluing,
    not a Kummer line). The operation set is translation by the domain
    subspace factor base, pushed forward by the isogeny. That is the partial
    action of index calculus, not full translation. The tracked object is the
    pair of named degrees after elimination. deg(phi) = 2 is charged as the
    degree of the extra generators. The identity encoding, with phi replaced
    by the identity, must reproduce I_native. If it does not, the encoding is
    wrong and no presentation claim is read.
  assumptions:
    - The edge, the native ideals, and the metric definitions come from EXP-DREG-dd668d. This hypothesis does not choose a second edge.
    - I_random is drawn once from seed 20260922 and is rejected only if its coefficients equal the cleared isogeny coefficients. It is not redrawn to change a degree.
    - Elimination uses grevlex with domain variables first, degree bound D_max = 4. An elimination that needs a higher degree is unmeasured.
  proof_search_map:
    bottleneck: >-
      Whether the isogeny equations, rather than the mere addition of
      degree-ell generators, move a named degree.
    baseline_embedding:
      parameter_slice: Identity encoding. phi replaced by the identity.
      reproduction_check: I_graph and I_native agree on both named degrees. Disagreement voids the encoding.
    observation_collision:
      observable: The pair of named degrees of the eliminated graph ideal.
      distinct_preimage_search: >-
        I_random is a second preimage with the same generator count and degree
        bound. If it drops at least as far, the saving is not the isogeny.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: eliminated graph ideal
        predicted_gain: >-
          A presentation comparison with deg(phi) charged. No exponent gain.
          No KN-OPEN-020 escape.
    quantifier_order: >-
      FOR ALL named degrees D that finished, the graph drop is compared with
      the random drop. There is no existential claim over edges beyond the
      one certified edge.
    method_ceiling:
      strongest_certifiable_claim: >-
        On one toy edge, the graph either agrees, drops more than the random
        enrichment, drops no more than the random enrichment, or is more
        expensive. Not an algorithm.
      nearby_object_control: I_random, same number of extra generators, same degree bound, frozen seed.
    proof_obligations:
      - claim: Identity encoding agrees before any drop is read.
        responsibility: baseline
      - claim: ell = 2 is the generator degree charged to both the graph and the random arm.
        responsibility: size
      - claim: phi of the factor base is not offered as a new factor base.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: graph drop minus random drop, per finished named degree
      direction: lower
      minimum_effect: >-
        0 means the graph does not beat generic enrichment. A positive
        difference of at least 1 is a presentation effect.
  test_boundary:
    instances:
      - the single certified edge of EXP-DREG-dd668d
      - the identity encoding
      - one random enrichment
    parameters:
      ell: 2
      rung_n: 1
      D_max: 4
      seed: 20260922
    implementation: experiments/EXP-DREG-c3e8c9/specification.yaml
    budget:
      maximum_runs: 1
      maximum_memory_gb: 4
  falsification_conditions:
    - The identity encoding disagrees with I_native. Encoding failure. No presentation result.
    - I_graph agrees with I_native on every finished named degree. The graph does not move them.
    - I_random drops by at least as much as I_graph. The saving is not the isogeny.
    - A named degree of I_graph is larger by at least 1. Charging ell made the presentation worse.
  interpretation_limits:
    - One edge. No class census. No cryptographic curve. No ECDLP exponent.
    - The pushed-forward factor base is not a KN-OPEN-020 escape.
    - Kummer-line and degree-d-function-on-E representations are not used.
  heuristic_assumptions:
    - id: HEUR-c44a0d
      formal_statement: >-
        One frozen random enrichment is a control object, not a sample from a
        distribution whose tail is being estimated.
      random_model_justification: >-
        No distribution theorem is invoked. The comparison is three ideals.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        The random system is resampled after seeing its degree. That retuning
        falsifies the control.
  asymptotic_claim: null
  citations:
    - ref: IDEA-20260922-469f79
      provenance: internal
      claim: The graph-presentation proposal.
      verified_by: coordinator
    - ref: KN-OPEN-020
      provenance: internal
      claim: A bounded-degree algebraic factor base is scoped out. This hypothesis does not claim an escape.
      verified_by: coordinator
    - ref: RQ-ECDLP-623a32
      provenance: internal
      claim: R3 includes E times E' gluings. Kummer-line representations stay closed at model lever 1.
      verified_by: coordinator
  status: approved
  proposed_by: coordinator
