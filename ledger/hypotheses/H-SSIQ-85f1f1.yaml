hypothesis:
  id: H-SSIQ-85f1f1
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  source_idea_ids:
    - IDEA-20261006-14ca06
  added: '2026-10-10'
  status: approved
  proposed_by: coordinator
  title: >-
    Factor order changes which cofactor exceeds 30 for at least one
    7-smooth integer from 31 through 180
  statement: >-
    Let S be every 7-smooth integer D with 30 < D <= 180. Factor each D
    with multiplicity into primes from {2, 3, 5, 7}. In the ascending and
    descending orders separately, let P be the product of the longest
    prefix whose product is at most 30, and let C = D/P. Count a D when
    the larger of its two P values is at least twice the smaller and
    exactly one of its two C values exceeds 30. The prediction from
    IDEA-20261006-14ca06 is that the complete count is at least one.
    A complete count of zero with all instrument controls passing is
    the negative. This is a finite arithmetic claim about the written
    splitting rule, not a claim about an isogeny degree or an algorithm.
  mechanism: >-
    Reversing the order of the same prime multiset can change the
    maximal prefix product at X = 30. Dividing the fixed D by each
    prefix can consequently put its two cofactors on opposite sides
    of X. The measured object is the count of such D, with a complete
    row for every eligible integer. The experiment varies only factor
    order and does not construct a curve or evaluate an isogeny.
  assumptions:
    - A positive integer is 7-smooth exactly when trial division by 2, 3, 5, and 7 leaves 1.
    - Prime factors retain multiplicity; the factorization of 12 is 2, 2, 3.
    - All products, divisions, and comparisons use exact integers. The first factor is at most 7, so the prefix is nonempty.
    - The full domain is the 150 integers from 31 through 180 inclusive; 30 is outside it.
  proof_search_map:
    not_applicable_reason: >-
      This hypothesis scores a complete finite integer scan. It
      proposes no proof of a new asymptotic bound, representation
      transfer, or closure of a research direction.
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: >-
        The proof of Lemma 3.4 factors a smooth degree and takes the
        largest prefix product at most X. This experiment varies the
        order in that written rule on a fixed set of integers.
      citation: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
      provenance: retrieved
      verified_by: >-
        coordinator design session 2026-10-10 opened the archived
        paper, including the proof of Lemma 3.4
      role: source of the finite splitting rule under test
  predictions:
    - metric: qualifying_integer_count
      direction: higher
      minimum_effect: at least 1 after a complete valid scan
  test_boundary:
    instances:
      - every integer D from 31 through 180 inclusive
    parameters:
      B: 7
      X: 30
      allowed_prime_factors: [2, 3, 5, 7]
      factor_orders: [ascending, descending]
    implementation: >-
      One deterministic standard-library integer enumerator records
      the factor multiset, both longest prefixes and cofactors, and
      both predicates for every eligible D. A checker independently
      enumerates the full 150-integer domain and compares its eligible
      list with the raw rows. Controls check 11, 30, and 32 before
      the count is scored.
    budget:
      enforcement: advisory
      maximum_runs: 1
      maximum_workers: 1
  falsification_conditions:
    - >-
      The complete scan records qualifying_integer_count = 0 and
      every factorization, boundary, and equality control passes.
  interpretation_limits:
    - >-
      A control failure or incomplete scan invalidates the instrument
      and does not count as a negative observation.
    - >-
      The D values are smooth integers, not certified minimal degrees
      of isogenies. Either count says nothing about the frequency of
      smooth minimal degrees or the paper's Heuristic 1.
    - >-
      The paper's complementary-degree bound assumes its choice of X
      and a bound on the total degree. This finite scan does not use
      those parameters or challenge that bound.
    - >-
      Neither outcome changes the conditional p^{1/3+o(1)} time or
      memory exponent of the archived algorithm.
