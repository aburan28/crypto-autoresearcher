      maximum_runs: 4
    scope_note: >-
      Toy n <= 23, m in {2,3}, UNSAT arm only; SAT cost and cost per relation are not measured; nothing at n = 131;
      no speedup claim: the whole Frobenius lever is at most log2(131) = 7.03 bits (orbit union) and V_nb prices
      about 0.76 bit of it; no exponent moves. The k0+1 cell at n = 23, m = 3 may be dropped for cost and is then a
      recorded scope reduction, not a result.
  distinguishable_outcomes:
  - 'support_scoped: P1 and P2 hold (R in [0.7,1.4] in >= 90% of cells in both modes; D_W equal in >= 90% of cells
    with columns ratio in [0.5,2]), the N0 spread is <= 1.4, every planted target is found by every arm, g_nb is in
    [1.6,2.4], and check.py exits 0 on every run; the E1/E2/E3 reading is set by P3.'
  - 'falsify: R above 2 in half the cells in both modes (the V_nb bit is cancelled), or D_W differs by 1 or more on
    over 10% of cells (V_nb is not free), on checker-valid runs with the controls passing.'
  - 'inconclusive: N0 spread above 1.4 (noise floor too high; not support); g_nb outside [1.6,2.4] (pilot input not
    reproduced); or fewer than 20 UNSAT in more than half the cells.'
  - 'surprise (not falsification): R below 0.7 in half the cells; priority up and re-run with larger k (IDEA notes
    section 4), after independent review.'
  - 'not evidence (run invalid): enumerator disagreement, model-check failure, a planted target missed by an arm,
    or check.py exit 3.'
  - 'not evidence: timeouts, memory kills and crashes are censoring or failed_infrastructure (AGENTS.md rule 5).'
  falsification_conditions:
  - 'R above 2 in half the cells, both modes: the V_nb bit is cancelled; V_orb (log2 n bits, non-subspace,
    KN-FIND-47da4e) is the only Frobenius lever'
  - 'D_W differs by 1 or more on over 10% of cells: V_nb is not free'
  - 'N0 spread above 1.4: inconclusive, not support'
  - 'g_nb outside [1.6,2.4]: pilot input not reproduced'
  confounders:
  - 'FB size differs by the Tr(1/x) and halving split; pair by target, record |FB|'
  - 'Dense random normal element versus sparse optimal normal basis'
  interpretation_limits:
  - 'UNSAT only; SAT cost and cost per relation not measured; toy n up to 23; conflicts are a search property, not a
    degree'
  - 'W_4 is saturated and cannot rank systems (KN-FIND-c3a917); read D_W, columns, W_3'
  - 'No statement about ECC2K-130 or any deployed curve; no speedup is claimed; the Frobenius ceiling is the
    orbit-union log2(n) and this prices a sub-ceiling, subspace-compatible option (IDEA notes section 5).'
  - 'The tau factor-base pilot is exploratory provenance for the cells, g and the 0.6-0.8 bit figure only, never
    evidence.'
  - 'A conjugate relation is never used inside one system (EV-BINSTD-780165); the gain is a count of unknowns
    (orbits), not a per-instance constraint.'
