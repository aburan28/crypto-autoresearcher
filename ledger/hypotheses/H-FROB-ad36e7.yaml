  title: 'Is the normal-basis window V_nb as cheap per decomposition attempt as V_poly? Paired WDSat conflicts and
    closure degree D_W on certified UNSAT toy Koblitz systems'
  statement: >-
    (From the IDEA-20261017-fd3924 claim.) On toy Koblitz curves y^2+xy=x^3+ax^2+1 over F_2^n (n in 11,13,17,19,23;
    m in 2,3; k in k0,k0+1; k0=ceil(n/m)) the descended S_(m+1) system over V_nb (span of k consecutive conjugates of
    a normal element) costs the same per attempt as over V_poly = deg<k: median paired WDSat UNSAT-conflict ratio
    R = nb/poly in [0.7,1.4], and equal minimal refuting closure degree D_W, in at least 90% of cells. The
    exploratory tau pilot measured the other half (orbit shrink g = 1.9-2.0 at birthday-matched yield: 0.6-0.8 bit
    net of V_poly's own 0.2). This prices the solver half: B_net = log2(g_nb/g_poly) - log2(R). Tested by
    EXP-FROB-fc007f on enumeration-certified UNSAT instances, WDSat in both -b and XG-ext modes, D_W over D in
    {3,4,5}, with the V_rand and N0 controls; nothing at n = 131; the log2(n) = 7.03-bit orbit-union ceiling is the
    maximum of the whole Frobenius lever and no exponent moves.
  mechanism: >-
    (Verbatim from IDEA-20261017-fd3924.) OBJECT FRAME. R1: V_nb is a window of k consecutive coordinates in a
    normal basis. Sigma = <tau,-1> on the factor base (tau = cyclic coordinate shift). Class: partial-action (a
    relation maps to its conjugate inside V only if all summands stay in the window: about 1.67 of n at m=2).
    Lossy-projection test: the tracked object is the <tau,-1>-orbit of a factor-base point; it discards the shift j
    (a block system of <Sigma>, IDEA-20260901-863e36), is lossy (about 2-to-1: V_nb and tau V_nb share k-1
    dimensions) and propagates deterministically. Canonicalisation: at most n cyclic shifts. Priced number: R. Arms
    V_poly, V_nb, V_rand separate three explanations. E1: cost depends on (n,m,k) only, all R near 1. E2: cost
    follows the product space V.V (dim 2k-1 for poly, near n generic), so R(nb) near R(rand), not 1. E3: window or
    sparse-tensor structure matters, so R(nb) differs from R(rand). A basis change alone is a ring automorphism
    (Prop. B), so differences belong to the set V. KN-OPEN-020: scoped-out linear base, no escape claimed.
  assumptions:
  - 'Net gain is 0.6-0.8 bit defined against V_poly (which has 0.18-0.22 bit of its own tau coincidence), not ~1
    (IDEA notes section 1.1); B_net uses g only, usable conjugates are a diagnostic (notes 1.2).'
  - 'R in [0.7,1.4] alone is the null prediction of the exhaustive-core law (IDEA-20260915-0d8e90); the risk is
    carried by the V_rand arm, D_W and columns, and the symmetry-pruned mode (IDEA notes 1.3).'
  - 'D_W = 4 at m=3 is the handoff figure, unverified (KN-FIND-c3a917); D_W is recorded over D in {3,4,5} with
    columns at D_W and the first refuting iteration, not a pass/fail at D = 4 (IDEA notes 1.4).'
  - 'Labels are ground truth only when two independent enumerators agree (the pilot log-table meet-in-the-middle
    and a second implementation sharing no code); the same x_R is used across arms.'
  - 'Optimal normal bases exist at n = 11 and 23; at n in {13,17,19} the type is not asserted and the executor
    falls back to random normal elements (IDEA notes section 2).'
  proof_search_map:
    not_applicable_reason: Measurement of a constant factor; no theorem or exponent claimed.
  asymptotic_claim: null
  target_complexity:
    time_exponent: 'unchanged; relation count divided by at most about 2'
    memory_exponent: 'unchanged; matrix dimension divided by about 2'
    best_known: 'rho on <tau,-1> classes (KR-RHO-482ed3); no index calculus beats it at prime degree'
    hidden_overhead: 'none claimed; whole Frobenius lever at most log2(131) = 7.03 bits at n=131 (orbit union)'
  dominated_by: 'KR-RHO-482ed3 / KR-RHO-1c2928 (rho on signed-Frobenius classes) on the time axis; the orbit-union
    route (log2 n bits) on relation count; V_nb dominates it only on keeping a single subspace system (IDEA notes
    section 7)'
  sota_delta: 'relation count / about 1.7 (0.76 bit) at most, matrix dimension / about 2, exponent unchanged; the
    Frobenius ceiling at n=131 is 7.03 bits (orbit union). No attack claimed.'
  novelty_status: unverified
  heuristic_assumptions:
  - id: H1
    statement: 'UNSAT cost depends on (n,m,k) and the shape of V, not the basis: conflicts = c * 2^(mk) / |G|, c in
      [0.9,1.0] for every V.'
    rigorous_support: 'Prop. B (IDEA-20260926-917981) and the exhaustive-core law (IDEA-20260915-0d8e90): uniform
      visit of all 2^(mk) leaves.'
    validation_plan: 'Fit c per arm on 20 cells x 20 targets, both modes; compare c(nb), c(rand), c(poly); worst
      target per cell.'
    validation_experiment_ids:
    - EXP-FROB-fc007f
    falsification_condition: 'R above 2 in half the cells, both modes (IDEA falsification condition 1); or c
      outside [0.9,1.0] for an arm on complete cells'
  - id: H2
    statement: 'As k grows g_nb tends to 2 and usable conjugates per relation to 1+2/(2^m-1): 1.667 at m=2, 1.286
      at m=3.'
    rigorous_support: 'For uniform coordinates the end zero-runs are geometric(1/2): E[1/shifts] = 1/2, E[min run]
      = 1/(2^m-1) (notes).'
    validation_plan: 'Field-only sampling, 10^6 elements of V_nb at n in 31,61,127,131,163, m in 2,3, against 2 and
      the formula.'
    validation_experiment_ids: []
    falsification_condition: 'g_nb outside [1.6,2.4] on the recomputed pilot accounting (IDEA falsification
      condition 4: pilot input not reproduced); the field-only sampling at n up to 163 is not part of
      EXP-FROB-fc007f'
  - id: H3
    statement: 'Decomposition yield of V_nb at matched |FB| is birthday (eff = 1 within 0.1 bit).'
    rigorous_support: 'Counting: C(|FB|,m)/r decompositions expected.'
    validation_plan: 'Recompute eff, 12000 targets per cell, Poisson errors.'
    validation_experiment_ids: []
    falsification_condition: 'eff outside 1 +- 0.1 bit at a cell with more than a handful of orbits; the 12000-target
      recomputation is the pilot''s accounting, secondary in EXP-FROB-fc007f and not a criterion there'
  structural_ingredients:
  - description: a basis change alone is a ring automorphism and moves no closure (Prop. B); the multiplication
      tensor of V is the live variable
    citation: IDEA-20260926-917981
    provenance: internal
    verified_by: idea-generator read IDEA-20260926-917981.yaml
    role: premise of E1 and of the N0 control
  - description: WDSat UNSAT conflicts = c * 2^(ml) (exhaustive-core law)
    citation: IDEA-20260915-0d8e90
    provenance: internal
    verified_by: idea-generator read IDEA-20260915-0d8e90.yaml
    role: null prediction R = 1 for any V of dimension k
  - description: W_4 saturated at m=2 and unable to rank systems; mutant-closure cost unmeasured at any m >= 3
    citation: KN-FIND-c3a917
    provenance: internal
    verified_by: idea-generator read KN-FIND-c3a917.md
    role: why D_W is read over D in {3,4,5} with columns, not as a pass/fail at 4
  - description: Frobenius orbit-union encoding cost-neutral at m=2
    citation: KN-FIND-47da4e
    provenance: internal
    verified_by: idea-generator read KN-FIND-47da4e.md
    role: the solve-cost question of the orbit-union route is already scoped; this prices the subspace window
  reduction_chain:
    core_problem: whether the set V_nb changes the per-attempt solve cost of the descended decomposition system
      relative to V_poly at matched (n, m, k)
    corollaries: []
  predictions:
  - id: P1
    metric: R, median paired conflicts(V_nb)/conflicts(V_poly), WDSat -b and XG-ext
    direction: different
    minimum_effect: 'R in [0.7,1.4] in 90% of 20 cells; outside refutes E1'
    source: IDEA-20261017-fd3924 prediction 1
  - id: P2
    metric: D_W and columns at D_W, nb vs poly, same targets
    direction: different
    minimum_effect: 'D_W equal in 90% of cells (4 at m=3, handoff figure); columns ratio in [0.5,2]'
    source: IDEA-20261017-fd3924 prediction 2 (the memo wrote D_W identical only; the idea wins and adds columns)
  - id: P3
    metric: abs(log2 R(nb) - log2 R(rand))
    direction: lower
    minimum_effect: 'below 0.5 bit separates E3 from E2'
    source: IDEA-20261017-fd3924 prediction 3 (the memo's P3 was the random-subspace ratio in [0.7,1.4]; the idea
      wins)
  - id: P4
    metric: B_net bits on the same instances
    direction: higher
    minimum_effect: 'mean 0.5-0.9 at R near 1; at most 0 if R is 2 or more'
    source: IDEA-20261017-fd3924 prediction 4
  test_boundary:
    instances:
    - 'Koblitz curves y^2+xy=x^3+a x^2+1, n in {11,13,17,19,23}, a per the pilot (h = 2 or 4, r prime); m in {2,3};
      k in {k0, k0+1}, k0 = ceil(n/m): 20 cells'
    - 'arms per cell: V_poly; V_nb with 3 random normal elements (plus an optimal normal basis at n = 11, 23);
      V_rand (size-matched random k-dim subspace, fixed seed); N0 (V_poly re-encoded in a random field basis)'
    - 'targets in the order-r subgroup until 20 are certified UNSAT for every arm by two independent enumerators;
      same x_R across arms; up to 2,000 targets drawn, a short cell recorded rather than the 20 relaxed'
    - 'planted decomposable targets, which every arm must find'
