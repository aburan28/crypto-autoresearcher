hypothesis:
  id: H-ECTD-ac8627
  question_id: RQ-ECTD-001
  added: '2026-08-25'
  derived_from_idea: IDEA-20260731-017
  statement: >-
    For ordinary elliptic curves over F_p whose endomorphism rings differ by a vertical
    isogeny of prime degree q >= 17 (a conductor step in the q-volcano), the algebraic
    ECDLP meter vector - Semaev first-fall degree, factor-base yield, Macaulay rank
    profile and degree of regularity, computed under identical factor-base and solver
    conventions on both endpoints - is CONTINUOUS across that vertical edge at toy scale
    (N in 40 to 56 bits), in the sense that every primary meter ratio lies in [0.1, 10]
    and the multiset of vertical ratios is exchangeable with the multiset of matched
    horizontal ell-neighbour ratios. The interesting alternative, pre-registered with
    equal weight, is DISCONTINUITY - at least one vertical edge with a primary-meter
    ratio at or above 100 (or a degree-of-regularity delta at or above 2) together with a
    Kolmogorov-Smirnov rejection of exchangeability against the horizontal sample.
  mechanism: >-
    Galbraith's treatment of isogeny-based ECDLP equivalence identifies the large-prime
    conductor gap as the case where the equivalence is least complete, because computing
    the connecting isogeny may itself be hard. Horizontal ell-isogenies within a volcano
    level are governed by expander-type mixing and preserve the endomorphism ring;
    vertical q-isogenies change it, replacing the order O by an order of index q. A
    Teske-style trapdoor that places a secret curve at a different volcano level from the
    public curve needs an endpoint weakness that is LEVEL-SPECIFIC - a secret GLV
    endomorphism alone gives only a constant factor. The question this hypothesis makes
    testable is whether any algebraic ECDLP meter responds to the End-ring change at all.
    If the meter laws depend on the curve only through quantities invariant under the
    vertical step, ratios concentrate near 1 and the vertical edge is a barrier for the
    Semaev-meter channel; if some meter jumps, the crater or floor becomes a candidate
    private endpoint for a later path-hiding test.
  assumptions:
  - >-
    Conductor and endomorphism ring are computed correctly by Kohel-style volcano
    algorithms, and the computed End ring agrees with the volcano degree on every edge.
    Disagreement on more than one edge voids the harness.
  - >-
    Vertical isogenies of degree q are constructed and independently verified by kernel
    and degree certificates on both endpoints.
  - >-
    The isogeny degree is coprime to the subgroup order N on every measured edge, so the
    ECDLP instance transports without a change of group structure.
  - >-
    Factor-base construction, solver, term order, and budget are IDENTICAL on both
    endpoints of every edge. Any asymmetry here manufactures a ratio.
  proof_search_map:
    not_applicable_reason: >-
      Purely empirical measurement. No theorem is claimed, no asymptotic bound is asserted,
      no certificate family is constructed and no reduction is offered. The deliverable is
      a pair of ratio samples and a two-sample statistic between them. KN-TECH-080's
      pre-compute audits - baseline reproduction, observation-collision search, quantifier
      order, method ceiling - have no proof to audit here, and this field records that
      rather than nulling the map silently. Should a discontinuity be observed and a
      mechanism proposed for it, THAT proposal is proof-oriented and requires its own map.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-ECTD-VERT-1
    formal_statement: >-
      FOR ALL ordinary E/F_p with prime subgroup order N, and FOR ALL vertical q-isogenies
      E -> E' with q >= 17 in the same imaginary quadratic field K, conditional on N and
      K, the Semaev/Macaulay meter laws at adjacent conductors differ only through the
      End-module structure; absent a solver that names that structure explicitly, the
      meter ratio M(E')/M(E) concentrates near 1 with the same dispersion as a matched
      horizontal ell-neighbour ratio.
    random_model_justification: >-
      No theorem. Motivated by the failure of class-invariant weaknesses to vary within an
      isogeny class and by the horizontal homogeneity recorded for H-ISO-001. The random
      model imitated is that the summation-polynomial system's coefficients behave like a
      generic system of the same shape once the group order and the factor base are fixed,
      so that a change of endomorphism ring which no solver step reads cannot move the
      meter. That is an appeal, not a proof, and it is what the experiment tests.
    supporting_results: []
    validation_experiment_ids:
    - EXP-ECTD-29faa0
    falsification_condition: >-
      A vertical edge with a primary-meter ratio at or above 100, or a degree-of-regularity
      delta at or above 2, on an edge that passes both End-ring and isogeny certificates
      and whose two endpoints were solved under identical conventions.
  structural_ingredients:
  - description: >-
      Kohel's volcano structure for ordinary curves - the q-isogeny graph is a volcano of
      height v_q(c) where c is the conductor of Z[pi] in O_K, and vertical edges change the
      endomorphism ring by index q.
    citation: KN-LIT-7630
    provenance: kb
    verified_by: >-
      Checked per edge at run time by computing the endomorphism ring on both endpoints and
      requiring agreement with the volcano degree; disagreement on more than one edge voids
      the harness.
    role: structure of the object the experiment stratifies by
  - description: >-
      The ECDLP meter vector definition - Semaev first-fall degree, factor-base yield,
      Macaulay rank profile and degree of regularity under a fixed factor-base and solver
      convention.
    citation: IDEA-20260731-016
    provenance: internal
    verified_by: EXP-ECTD-001
    role: the instrument whose response is measured
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
  - metric: >-
      Two-sample Kolmogorov-Smirnov distance between the multiset of vertical meter ratios
      and the multiset of matched horizontal ell-neighbour meter ratios, same primary
      meters and identical factor-base and solver conventions
    direction: different
    minimum_effect: >-
      PRIMARY PRE-REGISTERED STATISTIC. Under continuity, KS does not reject exchangeability
      at alpha = 0.05 by a permutation test with the permutation count declared in advance.
      Under discontinuity, KS rejects AND at least one vertical edge shows a primary-meter
      ratio at or above 100.
  - metric: Maximum primary-meter ratio over all vertical edges
    direction: different
    minimum_effect: >-
      Continuity branch requires every vertical ratio inside [0.1, 10] across at least 8
      independent prime conductor steps. Discontinuity branch requires at least one edge at
      or above 100, or a degree-of-regularity delta at or above 2.
  - metric: Maximum primary-meter ratio over all matched horizontal edges
    direction: different
    minimum_effect: >-
      Expected inside [0.1, 10] on every edge, since horizontal steps preserve the
      endomorphism ring. A horizontal sample that is itself wide is a statement about the
      instrument's noise floor and it CAPS the vertical effect size the experiment can
      resolve; that cap must be reported with any negative.
  - metric: >-
      Endomorphism-evaluation-cost channel on one known GLV/CM curve pair, reported as a
      separate channel
    direction: different
    minimum_effect: >-
      Must show its expected move on the GLV pair, confirming the harness can see an
      endomorphism-cost effect at all. Any Semaev-meter movement on this instrument pair is
      recorded but MUST NOT be promoted as vertical-discontinuity evidence.
  - metric: >-
      Agreement between the computed endomorphism ring and the volcano degree, per edge
    direction: different
    minimum_effect: >-
      100 percent agreement. Disagreement on more than one edge voids the harness and no
      mathematical claim may be drawn.
  test_boundary:
    instances: >-
      Ordinary curves over prime fields with subgroup order N in 40 to 56 bits, whose
      Frobenius conductor [O_K - Z[pi]] is divisible by a prime q in {17, 19, 23, 29, 31}.
      At least 8 independent vertical q-edges (one climb or descent each) and a matched
      sample of at least 8 horizontal ell-pairs at the same levels. One known GLV/CM curve
      pair as an isolated instrument check on the endomorphism-evaluation-cost channel
      only.
    parameters:
      subgroup_order_bits_min: 40
      subgroup_order_bits_max: 56
      conductor_primes:
      - 17
      - 19
      - 23
      - 29
      - 31
      minimum_vertical_edges: 8
      minimum_horizontal_edges: 8
      alpha: 0.05
      discontinuity_threshold_ratio: 100
      continuity_band:
      - 0.1
      - 10
      d_reg_delta_threshold: 2
    implementation: >-
      The IDEA-20260731-016 / EXP-ECTD-001 meter instrument at frozen factor-base and
      solver conventions, with Kohel-style volcano and endomorphism-ring computation, and
      per-edge isogeny certificates. Both endpoints of every edge are solved under the same
      convention in the same invocation.
    budget:
      wall_clock_seconds_per_run: 21600
      total_cpu_hours: 120.0
      maximum_runs: 40
  falsification_conditions:
  - >-
    CONTINUITY BRANCH, which falsifies the trapdoor-useful discontinuity - across at least
    8 independent prime conductor steps, all primary meter ratios lie in [0.1, 10] AND the
    KS test does not reject exchangeability against the horizontal sample, with both
    instrument checks passing. Equation-dependent Semaev discontinuity is then absent at
    the tested scale, and the named obstruction is scoped to the Semaev-meter channel only.
  - >-
    INSTRUMENT VOID - endomorphism-ring computation disagrees with the volcano degree on
    more than one edge, or the GLV/CM endomorphism-cost channel fails its expected move on
    the known pair while Semaev meters are simultaneously being attributed as the
    discontinuity signal. No mathematical claim may be drawn.
  - >-
    A vertical ratio at or above 100 on an edge whose two endpoints were NOT solved under
    identical conventions, or whose solver budget truncated one side, is not evidence of
    discontinuity - it is an invalid measurement and the edge is discarded with its reason
    recorded.
  interpretation_limits:
  - >-
    Continuity of Semaev meters does not prove that isogeny evaluation is as hard as rho.
    It closes equation-dependent Semaev trapdoors across the tested conductor steps at toy
    scale and nothing more.
  - >-
    Galbraith's algorithmic conductor-gap hardness is a claim about PATH FINDING and is not
    measured here. A continuity result must never be reported as bearing on it.
  - >-
    Discontinuity, if observed, NOMINATES a crater or floor as a candidate private endpoint
    for a later path-hiding test. It does not establish a trapdoor, does not establish path
    hardness, and does not constitute an attack.
  - >-
    Scoped to ordinary curves over prime fields at 40 to 56 bits with conductor primes in
    {17, 19, 23, 29, 31}. Nothing transfers to other q, to supersingular curves, to
    extension fields, or to cryptographic sizes.
  distinguishable_outcomes:
  - outcome: >-
      All instrument checks pass; at least 8 vertical edges measured; every primary meter
      ratio inside [0.1, 10]; KS does not reject exchangeability against the matched
      horizontal sample.
    means: >-
      CONTINUITY, SCOPED. The vertical conductor step is a barrier for the Semaev-meter
      channel at the tested scale - an algebraic ECDLP meter does not see the End-ring
      change. Forward guidance - a vertical Teske-analogue trapdoor cannot be built on
      equation-dependent Semaev structure across these steps, while path-finding hardness
      and non-Semaev private advantages remain open. This is a genuine negative for the
      discontinuity hypothesis and is recorded with the horizontal sample's dispersion as
      the sensitivity floor.
  - outcome: >-
      All instrument checks pass; KS rejects exchangeability at alpha = 0.05 AND at least
      one vertical edge shows a primary-meter ratio at or above 100 or a d_reg delta at or
      above 2.
    means: >-
      DISCONTINUITY, which nominates the crater or floor as a candidate private endpoint
      for a later path-hiding experiment. It does NOT establish Galbraith path-finding
      hardness and does NOT establish a trapdoor. The next decision is a dedicated
      path-hiding design plus an independent replication of the discontinuous edge, because
      a surprising and implementation-sensitive result is exactly the case AGENTS.md
      escalation requires replication for.
  - outcome: >-
      KS rejects exchangeability but no vertical edge reaches the 100x or d_reg-delta-2
      threshold.
    means: >-
      INCONCLUSIVE at the pre-registered thresholds. The two ratio samples differ in
      distribution without any edge reaching a trapdoor-relevant magnitude. The evidence
      cannot discriminate between a small genuine End-ring effect and a solver-convention
      asymmetry, and the decision is inconclusive with a named follow-up - a matched-seed
      replication with the convention symmetry independently audited.
  - outcome: >-
      End-ring computation disagrees with the volcano degree on more than one edge, or the
      GLV/CM instrument channel fails its expected move.
    means: >-
      HARNESS VOID. Infrastructure signal under AGENTS.md rule 5, never negative
      mathematical evidence. The run returns to the Executor with the failing edges listed.
  - outcome: >-
      Fewer than 8 valid vertical edges are produced inside the budget.
    means: >-
      BUDGET-EXHAUSTED, not a negative. The sample is insufficient for the pre-registered
      KS test; the partial ratios are reported as such and neither branch may be declared.
  prior_evidence_refs:
  - IDEA-20260731-017
  - IDEA-20260731-016
  - EXP-ECTD-001
  - KN-LIT-7630
  - H-ISO-001
  status: proposed
  proposed_by: idea-generator
