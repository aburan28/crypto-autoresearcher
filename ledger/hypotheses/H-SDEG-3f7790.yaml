  - >-
    'F5 - the small-u nearby-object control fails, i.e. the driver also misses at
    u = 2 by more than 2 per cent. The finding becomes "the implementation is
    wrong everywhere", a different and weaker statement than the error-floor
    diagnosis, and must be reported as that.'
  - >-
    'F6 - the verdict-invariance prediction G5 fails, i.e. some comparator flips a
