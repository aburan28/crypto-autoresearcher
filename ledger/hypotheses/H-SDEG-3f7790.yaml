    presented as the finding; it is a pre-registered surprise whose correct
    handling is to report it, rescope C4, and route the discrepancy to a
    correction record.'
  - >-
    'F7 (THE PLANNED NEGATIVE) - if C1-C4 all fail, the batch does NOT emit a
    statement that the comparator is sound at the tested cells, with its exact
    boundary and with the explicit clearance that the ladder extension to 28 and
    32 bits is safe to run. A negative that does not produce that clearance HAS
    NOT FINISHED. The negative disposition is a DELIVERABLE, not a failure.'

  interpretation_limits:
  - >-
    CLAIM TIER toy, and it may not be raised by any downstream citation. This is
    an audit of a numerical comparator inside one toy experiment. It is NOT an
    attack, NOT a cost model, NOT a statement about any curve, and it MOVES NO
    EXPONENT. Pollard rho remains the ECDLP baseline; sota_delta is zero on every
    attack axis.
  - >-
    A CONFIRMED COMPARATOR DEFECT DOES NOT VALIDATE HEUR-DS-1. It establishes
    that the recorded 3/3 FAIL does not measure what it was read as measuring.
    Deciding HEUR-DS-1 additionally needs the realised size distribution (D3) and
    an adequate sample size (D4), neither of which the committed data contains.
  - >-
    NO EVIDENCE RECORD IS CONTRADICTED BY THIS HYPOTHESIS. Twelve evidence
    records reference HEUR-DS-1 (MEASURED by grep at HEAD: EV-DS-001, -002, -003,
    -004, -006, EV-DS-84d006, EV-DS-1e5e91, EV-DS-8da1cf, EV-DS-8ddf9e,
    EV-EQD-001, EV-LPF-001, EV-DEP-001). Their conclusions were NOT all read and
    nothing is asserted about them beyond the fact of the reference. Whether any
    needs rescoping is a Coordinator judgement on a record-by-record basis.
  - >-
    INSTRUMENT FINDING, NOT MECHANISM FINDING. Nothing here supports or weakens
    H-DS-001, H-SMTH-001, H-SDEG-0dd021, or any hypothesis about the degree-split
    claw, the Semaev system, or the solving degree. It is about the yardstick.
  - >-
    C3 IS CONDITIONAL AND MUST NEVER BE QUOTED UNCONDITIONALLY. The forecast PASS
    at 28 and 32 bits depends on HEUR-CMP-2, a two-point extrapolation. Its value
    is as a WARNING before the ladder is extended, not as a prediction to be
    scored afterwards.
  - >-
    FORWARD GUIDANCE, MANDATORY UNDER inventor-protocol section 4. Open
    regardless of outcome: (a) the realised size distribution of the sampled
    integers, never recorded; (b) whether KS-DS-1 and TAIL-DS-1 inherit the same
    defect, with TAIL-DS-1's p_ext = 1.0 at all three cells the obvious first
    place to look; (c) exact smooth counts at B = 128 and B = 256, which need a
    bounded-memory counting routine; (d) if the excess of p_hat over both correct
    comparators survives D3, the mechanism producing structurally smooth Semaev
    intermediate integers -- a research question, and the most valuable thing this
    hypothesis could uncover.

