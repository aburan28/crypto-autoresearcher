  falsification_conditions:
  - >-
    'F1 (ZERO COMPUTE, THE PRIMARY FALSIFIER) - rho_driver(8, h)/h is not
    constant to 1 per cent across the four grid steps. The error-floor mechanism
    is refuted, C1 fails, and the hypothesis is restated as an unexplained
    implementation discrepancy, which is weaker and must be reported as weaker.'
  - >-
    'F2 - the two independent reference schemes disagree by more than 1 per cent
    at any u in scope. No comparator is established and the batch emits an
    infrastructure report, not a finding (AGENTS.md rule 5).'
  - >-
    'F3 - the committed rho_u_star values are NOT reproduced by the committed
    recurrence. The audit''s subject is unidentified. Report and stop.'
  - >-
    'F4 - the hand-checked control Psi(100, 5) = 34 fails, or the 200,000-draw
    sampling positive control misses [80, 140]. NO NEGATIVE MAY BE REPORTED FROM
