hypothesis:
  id: H-SEMBIN-97ea23
  question_id: RQ-SEMBIN-fa2e3f
  goal_ids: [GOAL-SEMBIN-5078bc]

  statement: >-
    The indeterminacy that COST-SEMBIN-8d123b reports at n = 409 -- a 46.6-bit swing
    straddling zero "between two defensible storage readings of the same algorithm" --
    is NOT a property of the storage reading. It is a property of the operating point
    at which the van Oorschot-Wiener baseline is charged, together with the absence of
    any fixed memory scale in a multiplicative metric. Concretely, three claims, each
    separately falsifiable:

    (C1) BASELINE COHERENCE. The record charges vOW the memory of a 2^30-point
    distinguished-point store and the time of a single processor. Those are different
    points on vOW's own time-memory curve, and the combination is dominated. Charging
    the baseline at ANY single point on its own curve -- equivalently, at the minimum
    of its own T x Mem, which is attained anywhere w ~ M -- raises the crossover by
    the same amount under both storage readings, and both then exceed 409.

    (C2) THE STRADDLE IS A ONE-PARAMETER ARTEFACT. The crossover is a function of two
    parameters, the cost metric AND the distinguished-point store size, and it is more
    sensitive to the second than to the first. Over the store values the parent
    contract itself declared, the sparse crossover ranges more widely than it does
    over the whole metric set. A crossover quoted without its store is underdetermined
    in exactly the way COST-SEMBIN-8d123b says a crossover quoted without its metric
    would be.

    (C3) A FIXED MEMORY SCALE REMOVES THE DISAGREEMENT. Under any cost model that
    fixes a physical memory budget rather than charging memory multiplicatively, the
    dense and sparse readings AGREE on the verdict at every FIPS label outside one
    narrow band of budgets, and below roughly 2^65 bits they agree that n = 409 is a
    loss. The band inside which they disagree is what the parent record mistook for a
    property of the algorithm.

  mechanism: >-
    vOW's parallel rho with distinguished points is a TUNABLE algorithm, and the
    record compares a tunable algorithm against another tunable algorithm by picking
    one endpoint of each. Model the baseline honestly: with total work
    W = 0.886 x 2^{n/2}, M processors, and w stored distinguished points at
    theta = w/W, wall time is T = W(1/M + 1/w) and memory is Mem = 3n max(w, M) bits.
    Then

        T x Mem = 3n W (max(w,M)/M + max(w,M)/w) >= 2 x 3n x W,

    with equality anywhere w ~ M. The product is therefore INVARIANT along the whole
    curve, and its minimum is 2 x 3n x W. The record's charge -- M = 1 with w = 2^30 --
    sits 29.0 bits above that minimum, identically at n = 283, 310, 409 and 571,
    because it pays the store's memory while collecting none of the parallelism that
    store exists to buy. At M = 1 a single walk needs O(1) points under Brent/Floyd
    cycle detection, which is what this program's own KN-TECH-001 and KN-TECH-035
    record.

    Semaev's side is not advantaged by the same treatment: parallelising his stage 1
    across M workers gives time T0/M and memory max(relation store, M x working set),
    and since the working set dominates at every FIPS n under both readings his
    product is M-invariant at T0 x WS. So charging EACH algorithm the minimum of its
    own curve is symmetric, and it is the dominated_by check the inventor protocol
    requires and the parent record lacks.

    The metric-versus-store sensitivity has the same root. A multiplicative metric
    leaves the memory scale free, so the comparison inherits whatever store the
    baseline was handed; fixing a budget B removes that freedom and forces both
    algorithms onto the same physical constraint, at which point the dense/sparse gap
    stops deciding anything except inside the band where one reading fits B and the
    other does not.

  assumptions:
    - >-
      HEUR-VOW-CURVE: the distinguished-point method's time-memory tradeoff is
      T = W(1/M + 1/w), Mem = 3n max(w, M). This is a restatement from KN-TECH-006 and
      KN-LIT-012, both internal records; the primary van Oorschot-Wiener 1999 paper has
      NOT been opened by any agent in this program (KN-LIT-012 records that its own full
      text was not re-read). The load-bearing consequence -- product invariance along
      the curve, and the record's point being dominated -- follows from the structure
      rather than from any constant, and is confirmed by a numeric grid over (w, M).
      FALSIFIED BY: a reading of the primary source under which the product is not
      invariant, or under which M = 1 with w = 2^30 is an occupiable point.
    - >-
      Semaev's Assumption 1 (degree bound <= 4) is consumed UNCHANGED and UNVALIDATED,
      exactly as the parent record consumes it. No degree is measured anywhere in this
      hypothesis or its experiment; there is no Groebner engine on this host
      (IMP-SEMBIN-ENGINE). Where Assumption 1 fails, every memory figure is an
      underestimate one-sidedly against Semaev, by amounts LARGER than every effect
      claimed here.
    - >-
      The sparse working-set formula (nm)^4/24 columns at n^3/m nonzeros per row is
      Semaev's own, from the ellipticnews exchange recorded at KN-LIT-e77232
      (provenance retrieved, receipt at inputs/ELLIPTICNEWS-CHAR2-2015/provenance.json).
      It is currently computed in EXACTLY ONE implementation in this repository and
      corroborated at exactly ONE parameter point (n = 571). Supplying a second,
      genuinely independent implementation of it is a deliverable of the experiment,
      because the round that should have checked it could not.
    - >-
      Operation units on the two sides are not identical and no conversion is applied by
      default. Under this program's own kappa discipline (EXP-ICEX-c32447: kappa in
      {1, 10, 100}, and a conclusion flipping across that range may not be quoted
      without kappa) the crossover moves about 20 in n. Every crossover reported must
      carry its kappa.

  proof_search_map:
    bottleneck: >-
      The undeclared operating point. COST-SEMBIN-8d123b's crossover is a function of
      (metric, store_log2, processors_log2, kappa) and was published as a function of
      metric alone, with the other three fixed at defaults that appear only in a Python
      keyword argument.
    baseline_embedding:
      parameter_slice: >-
        The parent record itself, at store_log2 = 30, processors = 1, kappa = 1. This
        experiment must reproduce COST-SEMBIN-8d123b's four published crossovers
        (303 time-only both readings, 435 dense product, 375 sparse product) and its
        n = 409 margins (+37.78 time-only, -8.79 dense, +11.52 sparse) EXACTLY at that
        slice, before varying anything. The parent's arithmetic has already been
        reproduced three times independently and must not be re-litigated; reproducing
        it here is the check that the new surface contains the old point.
      reproduction_check: >-
        Bit-exact agreement with COST-SEMBIN-8d123b at the (30, 1, 1) slice, and with
        the red team's independent reimplementation to within its stated 4.8e-5 bits.
        A discrepancy at the reproduction slice stops the experiment: it means the new
        implementation differs from three that already agree.
    observation_collision:
      observable: The crossover n.
      distinct_preimage_search: >-
        The collision is already known to exist and must be exhibited rather than
        searched for: (store_log2 = 20, sparse) and (store_log2 = 30, dense) are
        different physical situations returning crossovers 405 and 435 that a reader of
        the parent record would attribute entirely to the storage reading. Search the
        two-parameter grid for every pair of cells returning the same crossover for
        different reasons and report them, because their existence is what makes the
        crossover alone the wrong observable.
      consequence_if_found: >-
        The reportable object is the SURFACE, not a crossover per metric. Any single
        crossover must be quoted with (metric, store_log2, processors_log2, kappa) or
        not at all.
    quantifier_order: >-
      The parent record's headline reads, incorrectly, as: THERE EXIST two defensible
      storage readings such that FOR the FIPS label n = 409 the verdict differs. The
      statement this hypothesis makes is: FOR ALL single coherent operating points on
      vOW's curve, and FOR ALL fixed memory budgets below 2^65 bits, the two storage
      readings AGREE that n = 409 favours the baseline; and THERE EXISTS a band of
      budgets (2^65 to 2^89 bits) inside which they disagree. The order matters because
      the parent's claim is an existence statement over metrics presented as a property
      of the algorithm.
    method_ceiling:
      ceiling: >-
        This method can decide which cost model favours which algorithm at which n. It
        can NEVER decide whether the chained algorithm works, because it measures no
        degree, computes no relation, and produces no certificate. Its ceiling is a
        statement about two heuristic estimates, and Assumption 1's failure mode is
        larger than its entire dynamic range.
      nearby_object_control: >-
        The prime-field index-calculus arm the parent contract specified and the parent
        run substituted away from. EXP-ICEX-c32447 supplies a specified model with a
        multi-target rho arm and a shared distinguished-point table -- the exact
        comparison shape needed. If the machinery reports index calculus beating rho for
        prime-field ECDLP at cryptographic size, it is mischarging memory or parallelism
        and every row is void. Unlike the eq. (4) substitute, this control's threshold
        sits inside the record's own error envelope, which is what makes it a control.

  asymptotic_claim:
    problem: >-
      ECDLP on E(F_{2^n}), n prime: chained-S_3 index calculus against van
      Oorschot-Wiener parallel rho, compared under memory-charged cost metrics.
    prior_best: >-
      COST-SEMBIN-8d123b's published memory-charged crossovers, 435 dense and 375
      sparse, with the n = 409 verdict reported as indeterminate between them.
    time_exponent: >-
      unchanged. This hypothesis claims no movement in any time exponent and no
      improvement to any algorithm. It corrects a comparison.
    memory_exponent: >-
      unchanged from H-SEMBIN-83999d's 2^{Theta(sqrt(n ln n))} relation store. What
      changes is the BASELINE's memory charge, which the parent set at a fixed 2^30
      points and this hypothesis sets on vOW's own curve.
    hidden_cofactor: >-
      the 29.0-bit gap between the record's baseline charge and the minimum of vOW's own
      T x Mem product, constant across n = 283 to 571; and the kappa unit-conversion
      factor, worth about 20 in n and quoted nowhere in the parent.
    claim_kind: cost_model_correction

  heuristic_assumptions:
    - id: HEUR-VOW-CURVE
      statement: >-
        vOW total work W = 0.886 x 2^{n/2} is independent of the store size w and the
        processor count M; wall time is W(1/M + 1/w); memory is 3n max(w, M) bits.
      random_model_justification: >-
        The 1/w term is the expected tail to the next distinguished point at
        theta = w/W, which is the standard birthday-with-DP accounting KN-TECH-006
        records. The max(w, M) is the larger of the shared table and the per-processor
        state.
      falsification_condition: >-
        A store size or processor count at which measured total work departs from
        0.886 x 2^{n/2} by more than the 0.5 bits separating the corpus's two walk
        constants, or a documented implementation for which the product is not invariant
        along the curve.
      validation_plan: >-
        Calibrate against the one public operating point in this program's corpus:
        sect113r2 (KN-TECH-036), 82.2M ~ 2^26.3 distinguished points on up to 120 FPGAs,
        i.e. w/M ~ 2^13.3. That ratio must be a reportable row of the surface.
      supporting_results: [KN-TECH-006, KN-TECH-035, KN-TECH-036, KN-TECH-001]
      status: unvalidated

  structural_ingredients:
    - >-
      Product invariance along vOW's tradeoff curve, which converts "which store size is
      fair" from a judgement call into an algebraic identity with a unique minimum.
    - >-
      The fixed-budget metric, which removes the free memory scale that a multiplicative
      metric leaves open and is the only metric under which the two storage readings are
      comparable at all.
    - >-
      This program's own kappa discipline from EXP-ICEX-c32447, which already states the
      rule the parent record's crossovers violate.
    - >-
      The 34 unused MAGMA memory measurements in the frozen source's Tables 1-2, which
      the validator showed bracket the record's two readings in 21 of 27 non-trivial
      rows and are the only measurements of this object at any scale.

  reduction_chain:
    core_problem: >-
      The memory-charged comparison between chained-S_3 index calculus and parallel rho
      over F_{2^n}, as a surface over (metric, store, processors, kappa) rather than a
      crossover per metric.
    corollaries:
      - problem: >-
          Whether the n = 409 FIPS labels leave the affected scope of Semaev's
          Section 4.5.2 four-curve claim.
        reduction_ref: >-
          Direct: read off the surface per cell. This concerns the MODEL's conclusion
          under a stated metric and asserts nothing about any curve's security.
        asymptotics_preserved: >-
          'yes: the time exponent is untouched; what moves is which n the concrete
          comparison favours, and by how much.'
      - problem: >-
          Whether KN-OPEN-86e7e1's memory-charged crossover question is well posed as a
          single number.
        reduction_ref: >-
          If C2 holds the question is malformed and must be restated as "at which
          (metric, budget, baseline operating point) does the verdict at each FIPS label
          change, and which of those points is physically occupiable".
        asymptotics_preserved: not_applicable

  predictions:
    - metric: reproduction_at_parent_slice
      direction: different
      minimum_effect: >-
        At (store_log2 = 30, processors = 1, kappa = 1) the new implementation returns
        COST-SEMBIN-8d123b's figures exactly: crossovers 303 / 303 / 435 / 375 and
        n = 409 margins +37.78 / -8.79 / +11.52. Any disagreement stops the experiment
        as a procedure defect, since three independent implementations already agree
        here.
    - metric: coherent_baseline_crossover_shift
      direction: higher
      minimum_effect: >-
        Charging the baseline at the minimum of its own T x Mem raises the crossover by
        at least 50 in n under BOTH storage readings, and both resulting crossovers
        exceed 409. Predicted values 460 sparse and 520 dense, shift +85, with the
        n = 409 sparse margin turning negative (predicted -17.48). A shift below 50, or
        either crossover landing at or below 409, refutes C1.
    - metric: store_versus_metric_sensitivity
      direction: higher
      minimum_effect: >-
        The crossover's range over store_log2 in {30, 40, 48, 60} -- the four values the
        PARENT CONTRACT declared -- strictly exceeds its range over the metric set, for
        the sparse reading. Predicted 96 in n against 72. If the metric range is the
        larger, C2 is refuted and the parent's one-parameter framing was adequate.
    - metric: fixed_budget_agreement_band
      direction: different
      minimum_effect: >-
        Under a hard memory budget, the dense and sparse readings return the SAME
        verdict at n = 409 for every budget below 2^65 bits and for every budget above
        2^89 bits, and differ only inside that band. Predicted band boundaries are
        Semaev's own cheapest memory over m: 2^65.33 sparse at m = 8 and 2^80.07 dense
        at m = 6, at n = 409. A budget below 2^65 at which the two readings disagree
        refutes C3.
    - metric: sparse_working_set_second_implementation
      direction: different
      minimum_effect: >-
        An independently written evaluation of (nm)^4/24 x n^3/m agrees with
        memory_charged_cost.py's semaev_memory_log2 to within 0.01 bits at every
        (n, m) cell, AND reproduces KN-LIT-e77232's own arithmetic at n = 571
        (2^46.38 columns, 2^23.89 nonzeros, 2^70.3 total against the record's 70.2718).
        This discharges the round's carried-forward finding that the term is computed
        once in this repository.
    - metric: matched_null_decomposition
      direction: different
      minimum_effect: >-
        Against an informative null -- a baseline charged the 3n bits it actually needs
        rather than zero memory -- the crossover shift decomposes as +219 dense / +159
        sparse from Semaev's memory and -87 from the baseline's store, netting the
        parent's reported +132 / +72. The parent's "matched-null share = 0" must be
        reported as SUPERSEDED with this decomposition in its place. A degenerate
        (null-returning) control at any metric must be reported as degenerate and never
        as zero.
    - metric: cofactor_direction_corrected
      direction: lower
      minimum_effect: >-
        Charging the FIPS cofactor h in {1, 2, 4} makes the baseline CHEAPER by
        0.5 log2 h bits and raises the crossover by 1 to 3 in n, confirming that taking
        q = 2^n overcharges the baseline and flatters Semaev -- the OPPOSITE of the
        parent record's stated direction. Additionally K-409 must be charged separately
        from B-409, with the Koblitz Frobenius discount beyond negation worth about
        4.34 bits and 11 in n.
    - metric: prime_field_nearby_object_control
      direction: different
      minimum_effect: >-
        Instantiated from EXP-ICEX-c32447's specified model, the machinery must NOT
        report index calculus beating rho for prime-field ECDLP at cryptographic size.
        If it does, the machinery mischarges memory or parallelism and every row of both
        this experiment and its parent is void. This is the control the parent
        substituted away from on a premise that was false.

  test_boundary:
    instances:
      - >-
        Semaev's chained-S_3 time model unchanged (stage 1 = m! 2^{n/m} n^{4 omega},
        stage 2 = 2^{2n/m}), with the memory terms of COST-SEMBIN-8d123b unchanged.
        THE ARITHMETIC OF THE PARENT IS NOT UNDER TEST; only the comparison is.
      - >-
        van Oorschot-Wiener parallel rho charged at points ON ITS OWN CURVE, including
        its product minimum and the sect113r2-calibrated ratio w/M ~ 2^13.3.
      - >-
        Prime-field index calculus against rho, instantiated from EXP-ICEX-c32447, as
        the nearby-object control with a settled reference answer in KN-OPEN-001.
    parameters:
      n_values: [163, 233, 283, 310, 409, 571]
      n_dense_sweep: every integer n in [3, 700] for the crossover curve, so that the
        low-n artefact is SEEN rather than excluded by an undeclared scan window
      m_range: every integer m in [2, 30], argmin computed rather than asserted, and
        re-optimised under each metric rather than at the argmin of stage-1 time
      store_log2_grid: [0, 10, 20, 30, 40, 48, 60]
      processors_log2_grid: [0, 20, 40]
      baseline_charging_modes:
        - record_point_M1_w30
        - own_curve_product_minimum
        - sect113r2_calibrated_ratio
      kappa_grid: [1, 10, 100]
      cofactor_grid: [1, 2, 4]
      memory_budget_log2_grid: [30, 40, 50, 60, 64, 65, 70, 80, 89, 90]
      budget_readings: [hard_does_not_fit_does_not_run, soft_external_memory_passes]
      alpha_grid: [0.0, 0.25, 0.5, 0.75, 0.811, 1.0]
      omega_variants: [2.376, 2.807, 3.0]
      degree_bound_variants: [4, 5, 6]
      storage_readings: [dense_row_echelon, semaev_sparse, rows_times_cols_dense,
        nonzeros_with_index_sparse]
      k_readings: [unceiled_n_over_m_as_in_table3, ceil_n_over_m]
      curve_labels_separated: [B-409, K-409, B-571, K-571]
    implementation: >-
      Arbitrary-precision arithmetic only: Python integers and mpmath. No curve, no
      factor base, no Groebner engine, no field arithmetic, NO DEGREE MEASUREMENT. The
      sparse working set must be implemented independently of
      memory_charged_cost.py rather than imported from it, and the two compared.
    budget:
      wall_clock_seconds_per_run: 1800
      maximum_memory_gb: 2
      maximum_runs: 20
      enforcement: advisory

  falsification_conditions:
    - >-
      C1 FALSIFIED if charging the baseline at any single coherent point on its own
      curve moves the crossover by less than 50 in n, or if either resulting crossover
      lands at or below 409. Also falsified if the T x Mem product is NOT invariant
      along the curve, since the uniqueness of the minimum is what makes "any single
      point" well defined.
    - >-
      C2 FALSIFIED if the crossover's range over the parent contract's own declared
      store values does not exceed its range over the metric set. In that case the
      parent's one-parameter framing was adequate and only its store value was
      undeclared.
    - >-
      C3 FALSIFIED if the two storage readings disagree at n = 409 under a hard memory
      budget below 2^65 bits, i.e. if the disagreement extends into physically
      realisable budgets rather than being confined to a band above four exabytes.
    - >-
      THE WHOLE HYPOTHESIS IS VOID, not merely refuted, if the reproduction slice fails:
      if the implementation cannot return COST-SEMBIN-8d123b's four crossovers at
      (30, 1, 1), it is not computing the same object and nothing downstream means
      anything.
    - >-
      THE WHOLE HYPOTHESIS IS VOID if the prime-field nearby-object control reports index
      calculus beating rho at cryptographic size, which would show the machinery
      mischarges memory or parallelism on both sides.

  interpretation_limits:
    - >-
      NOTHING HERE IS A STATEMENT ABOUT THE SECURITY OF B-409, K-409, B-571, K-571 OR ANY
      OTHER CURVE, IN EITHER DIRECTION. Showing that a cost comparison favours parallel
      rho at n = 409 does not make those curves safe, and showing the reverse would not
      make them attackable. Both are statements about two heuristic estimates.
    - >-
      This hypothesis CORRECTS A COMPARISON. It proposes no algorithm, improves no
      exponent, and finds no new attack. Its best possible outcome is that a published
      crossover figure in this program's own ledger is replaced by a surface.
    - >-
      It does not impeach COST-SEMBIN-8d123b's arithmetic, which has been reproduced
      independently three times to 4.8e-5 bits. It impeaches the comparison the
      arithmetic was put to, and it supersedes that record in SCOPE rather than
      withdrawing it.
    - >-
      Every figure inherits Assumption 1 unvalidated. The degree-5 sensitivity the parent
      tabulates (+19.4 bits at n = 409) is LARGER than the 29.0-bit baseline correction
      and larger than the 18 to 21-bit dense/sparse gap, so the single largest
      uncertainty in this whole family of numbers is untouched by anything here and
      remains impeded (IMP-SEMBIN-ENGINE).
    - >-
      HEUR-VOW-CURVE rests on two internal records and not on the primary van
      Oorschot-Wiener paper, which no agent in this program has opened. That is the
      first thing a reviewer should attack, and retrieving the primary source is a
      cheap way to do it.

