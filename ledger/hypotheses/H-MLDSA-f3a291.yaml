hypothesis:
  id: H-MLDSA-f3a291
  question_id: RQ-MLDSA-001
  goal_id: GOAL-MLDSA-001
  source_idea: IDEA-20260805-a8d531
  experiment_id: EXP-MLDSA-a8d531
  status: specified
  title: >-
    The Shin et al. (2026) challenge-sampling DFA against ML-DSA operates outside
    the formal fault-injection security proof guarantee
  mechanism: >-
    The Shin DFA (KN-LIT-340675) exploits knowledge of challenge coefficients
    computed from public information. If the challenge is recoverable from the
    public signature and key, an adversary can identify which computations were
    targeted. The formal security proofs for ML-DSA (KN-LIT-3907 EasyCrypt, ROM)
    cover an adversary model in which the challenge is uniformly random from C
    conditioned on public randomness. A DFA that targets faults based on
    challenge value may fall outside this model if the adversary's power to
    identify the challenge exceeds what the ROM reduction assumes.
  prediction: >-
    The formal coverage gap is: no existing formal proof (KN-LIT-3907, KN-LIT-8ce0b5)
    explicitly models an adversary that uses public-information challenge recovery
    to select fault targets. The Shin DFA's attack surface is therefore in a
    formally uncharacterised region.
  falsification_criteria:
    - >-
      If KN-LIT-3907's full text explicitly models a challenge-aware fault
      adversary and proves security against it, this hypothesis is falsified.
    - >-
      If the Shin DFA cannot actually recover the challenge from public information
      (contradiction of KN-LIT-340675's claim), the hypothesis base is falsified.
  scope: laboratory_analysis_only
  claim_tier: theoretical_analysis
  created_at: '2026-08-05'
  created_by: coordinator
  approved_by: coordinator
  batch_id: BATCH-214d98
