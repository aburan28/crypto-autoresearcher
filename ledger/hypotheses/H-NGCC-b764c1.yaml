hypothesis:
  id: H-NGCC-b764c1
  question_id: RQ-NGCC-f52138
  idea_id: IDEA-20261002-273e65
  statement: >-
    On the official NGCC round-1 Chinith submission (sign-05), for every
    parameter set the package declares, a signature produced by the
    ordinary signer on a witness that is not the target secret key is
    accepted by a separately compiled verifier under that target public key.
  mechanism: >-
    The mechanism under test is the published sign-05-1 argument, as
    reported by Saarinen, ePrint 2026/2266. This hypothesis does not
    restate how the challenge is formed. The executor reads that argument
    from the finding and the specification before any signing run. The
    signer is not given the target secret key. Acceptance is decided only
    by the scheme's verification API in a separate process.
  assumptions:
    - The official package's reference implementation matches the specification on honest key generation, signing, and verification.
    - Finding sign-05-1 identifies what counts as the false witness. If it does not, the run is invalid rather than a falsification.
  proof_search_map:
    not_applicable_reason: >-
      This hypothesis is an empirical reproduction of a published concrete
      claim. It asserts no theorem, asymptotic bound, or reduction.
    bottleneck: null
    baseline_embedding:
      parameter_slice: null
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms: []
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations: []
  predictions:
    - metric: false_witness_signature_accepted_under_target_public_key
      direction: higher
      minimum_effect: >-
        Acceptance under both independent target public keys, for every
        declared parameter set.
  test_boundary:
    instances:
      - sign-05 Chinith, official round-1 zip named in inputs/ngcc-round1-20260920/candidates.yaml
    parameters:
      parameter_sets: every set the official package declares, recorded before signing
      target_keys_per_set: 2
      target_keygen_seeds: [0, 1]
    implementation: >-
      Reference C compiled by this program from submission sources.
      Nothing shipped as a binary, object file, or submission build script
      is executed.
    budget:
      enforcement: advisory
      wall_clock_seconds_per_run: null
      maximum_memory_gb: 8
  falsification_conditions:
    - >-
      For some declared parameter set, the separate verifier rejects the
      false-witness signature under both target public keys, the honest
      self-test passed, and an honest signature from one key is rejected
      under the other key.
  interpretation_limits:
    - A success is scoped to the tested package, parameter sets, and target keys. It does not transfer to a later revision.
    - A failure of this reproduction does not clear Chinith. It refutes only this published argument on the tested instances.
    - An honest signature that verifies under the wrong key is recorded separately and is not counted as confirmation of sign-05-1.
  status: specified
  proposed_by: coordinator
