  title: >-
    2048 exceeds 1024 by 1024
  statement: >-
    A window of width 12 stores 2048 entries. A window of width 11
    stores 1024. Two to the power 11 is 2048. Two to the power 10
    is 1024. Two thousand forty-eight exceeds one thousand twenty-four
    by 1024. The product of the two table sizes is 2097152. Their sum
    is 3072. Two width-11 tables each store 1024, so that gap is 0 and
    their product is 1048576.
  mechanism: >-
    The proposal writes the widths 12 and 11 and the sizes 2048 and
    1024. This contract checks those integers. It does not add a
    curve point.
  assumptions: []
  proof_search_map:
    bottleneck: The table-size gap 1024.
    baseline_embedding:
      parameter_slice: >-
        The widths 12 and 11 and the sizes 2048 and 1024 in
        IDEA-20261004-84f1aa, read 2026-10-04. The powers, the
        product, and the sum were recomputed in this design
        session. That computation is not a run.
      reproduction_check: >-
        One route computes 2 to the power 11. The other computes 2
        to the power 10. They must agree that the sizes are 2048
        and 1024.
    observation_collision:
      observable: The table-size gap 1024 and the product 2097152.
      distinct_preimage_search: >-
        Reporting both tables as size 1024 drops the gap. Two width-11
        tables make that gap 0.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The sizes 2048 and 1024.
        predicted_gain: Integer gap. No curve addition.
    quantifier_order: >-
      The size 2048 comes first, then the size 1024, then the nearby
      gap 0.
    method_ceiling:
      strongest_certifiable_claim: >-
        The table sizes 2048 and 1024. Not a scalar multiplication.
      nearby_object_control: >-
        Two width-11 tables. Both store 1024, and the gap is 0.
    proof_obligations:
      - claim: Two to the power 11 is 2048.
        responsibility: correctness
      - claim: Two to the power 10 is 1024.
        responsibility: correctness
      - claim: The nearby gap is 0 and the nearby product is 1048576.
        responsibility: scope
    not_applicable_reason: null
