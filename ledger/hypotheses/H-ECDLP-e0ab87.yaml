        the Anomalous curve.
      citation: RQ-SCURVE-84a540
      provenance: internal
      verified_by: >-
        TASK-20260904-c063e5 coordinator. PARTIAL read of
        ledger/questions/RQ-SCURVE-84a540.yaml, Grep tool returning the eight
