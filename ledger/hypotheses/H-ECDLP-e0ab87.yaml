      role: the Anomalous row's parameters and their disclosed provenance status
    - description: >-
        The independent certificate verifier, providing short-Weierstrass
        arithmetic over F_p with exact Python-integer modular operations, with a
        docstring scoping it to fields up to about 32 bits.
      citation: harness/toycurve.py
      provenance: recalled
      verified_by: null
      role: >-
        NOT OPENED by this Coordinator. The source proposal read lines 1 to 70
        and explicitly flagged its own reading of the 32-bit scope note as
