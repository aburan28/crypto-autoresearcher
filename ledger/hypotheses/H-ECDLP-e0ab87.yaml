hypothesis:
  id: H-ECDLP-e0ab87
  question_id: RQ-SCURVE-d9b7d2
  statement: >-
    Formalises IDEA-20260829-f89a3a. The campaign's additive-transfer lane is a
    syntactic check that has never been shown to fire, testing whether a
    computed trace equals one; an instrument hard-wired to answer "not one"
    would pass every negative row and be undetectable from those rows alone.
    This hypothesis raises the bar from flag to SOLVE.
    CLAIM, in four separable parts.
    (A) For a curve E over F_p with "#E(F_p)" equal to p, the ECDLP in E(F_p) is
    solvable in O(log p) field operations by lifting P and Q to a curve over the
    integers modulo p squared, multiplying each by p to land in the kernel of
    reduction, and taking the ratio of their formal-group logarithms in the
    additive group of F_p. This is textbook and is NOT claimed as new; it ties
    the frontier on trace-one curves rather than advancing it.
    (B) An implementation of (A) can produce a discrete_log certificate that an
    independent verifier re-checks by recomputing k times P from scratch, at
    every tested size including the roughly 204-bit Anomalous row.
    (C) The identical solver, on the same code path, produces ZERO verified
    successes on a trace-two curve built by the same complex-multiplication
    route at matched field size and matched discriminant, and on Curve25519 and
    BN(2,254). The trace-two control is the sharp one because it differs in one
    unit of trace and nothing else.
    (D) The solve rate on instances where Q is drawn as a RANDOM CURVE POINT,
    with no k ever computed, equals the rate on instances built as k times P.
    Any gap is direct evidence that the harness is leaking k and voids every
    solve.
    NOTHING HERE IS A BREAK. The Anomalous row exists in the family to be
    broken, and reproducing that is instrument validation.
  mechanism: >-
    The tracked object is the formal-group logarithm coordinate of a point, the
    image of a point of the kernel of reduction under the formal logarithm, read
    to first order as an element of F_p. The projection discards the entire
    group structure of E(F_p), the addition law's nonlinearity and both
    coordinates, retaining one field element. It is not a change of coordinates,
    because the formal logarithm is a GROUP HOMOMORPHISM from an elliptic
    addition law onto the additive group of F_p, and it discards precisely the
    structure that makes the ECDLP hard.
    The compatibility holds only for trace one. When "#E" is not p,
    multiplication by p does not land in the kernel of reduction and the
    projection stops propagating; KN-TECH-033 records this as the attacks not
    degrading gracefully but simply not applying. That single-value survival
    boundary IS the negative control.
    CONSTRUCTION CORRECTION, COMPUTED, AND IT NARROWS THE SOURCE IDEA'S LADDER.
    The proposal builds toy anomalous curves by complex multiplication with
    4p = t^2 + |D| s^2 at t = 1, that is p = (1 + |D| s^2)/4, and says to draw
    D from "the class-number-one list of minus 3, minus 4, minus 7, minus 8,
    minus 11, minus 19, minus 43, minus 67 and minus 163", nine values. Only
    SEVEN of those nine can host a trace-one curve by this construction. For p
    to be an integer, 1 + |D| s^2 must be divisible by 4; when |D| is even, that
    is |D| in {4, 8}, the quantity is congruent to 1 modulo 4 and is NEVER
    divisible, for any s. The usable set is the odd discriminants
    {3, 7, 11, 19, 43, 67, 163}, and within those, s must be ODD, since
    |D| congruent to 3 modulo 4 and s odd give |D| s^2 congruent to 3 modulo 4
    as required. This matters because the proposal's own stated confounder is
    toy-scale construction bias and its mitigation is to run across several
    discriminants; the available pool is seven, not nine.
  assumptions:
    - >-
      The Executor has a shell and Python 3 with arbitrary-precision integers.
      No Sage and no PARI are assumed. Every step is elementary integer
      arithmetic, and the complex-multiplication constructions use only linear
      Hilbert class polynomials so that no class-polynomial machinery is needed.
    - >-
      The Anomalous row's parameters are re-sourced before the roughly 204-bit
      run is treated as a control for anything. It is a positive-control
      CANDIDATE, not a verified one, and RQ-SCURVE-84a540 records it as a
      constructed illustration rather than a standardised curve, so it may have
      no primary specification at all. If none exists the run remains valid as a
      SELF-CONTAINED solve, because the certificate proves k times P equals Q on
      the stated curve regardless of provenance, but the row may not then be
      cited as reproducing any published example.
    - >-
      No live keys. Every instance is generated in session by drawing k
      uniformly, computing Q equal to k times P, and discarding k before the
      solver starts.
    - >-
      Curve25519 must be converted to short Weierstrass form, or the solver
      extended to Montgomery form, BEFORE its negative control runs. A negative
      that fails because of a model mismatch rather than because of the trace is
      worthless and is the most likely way to obtain a vacuous negative.
    - >-
      harness/toycurve.py can perform exact arithmetic at 204 bits. RELAYED from
      IDEA-20260829-f89a3a, which itself marks the reading as its own and
      requiring re-check. NOT verified by this Coordinator, who did not open the
      file. It is a blocking precondition in the contract.
  proof_search_map:
    bottleneck: >-
      That the family's transfer lane, replicated identically across twenty
      goals, rests on an instrument that has never produced a positive output.
      Removing this bottleneck changes no cost and no theorem; it changes
      whether the lane's negative verdicts mean anything.
    baseline_embedding:
      parameter_slice: >-
        At 30 bits the additive-transfer solver's output must equal the
        baby-step giant-step output on the same instance, exactly. BSGS at 30
        bits is the best-known baseline that is actually runnable, and agreement
        on the returned INTEGER, not merely both certificates verifying, is the
        embedding.
      reproduction_check: >-
        A frozen fixture of three 30-bit anomalous instances with their k values
        recorded, run before any larger size is attempted, checked by exact
        integer equality against BSGS and against the discarded generating k.
    observation_collision:
      observable: >-
        The discrete_log certificate consisting of curve, P, Q and k, together
        with its verification outcome.
      distinct_preimage_search: >-
        THE BENIGN COLLISION. Two integers k and k prime with k times P equal to
        k prime times P equal to Q exist exactly when they agree modulo the
        order of P, so the certificate identifies k only modulo the point order
        and the record must state the order of P alongside k or the certificate
        is ambiguous.
        THE MALIGN COLLISION IS THE ONE THAT MATTERS. Two distinct curves, one
        anomalous and one not, on which the solver produces a verifying
        certificate. Predicted NOT to exist, because verification recomputes k
        times P on the stated curve. Finding one would mean either that the
        verifier is not independent of the solver or that the instance was not
        genuinely hard, and both are instrument failures that void everything.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the problem from E(F_p) to the additive group of F_p via the
          formal logarithm, where the hypothesis that "#E" equals p becomes the
          exact condition that multiplication by p lands in the kernel of
          reduction.
        predicted_gain: >-
          From p to the one half down to log p to the O(1), on this family only.
          The soundness obligation is discharged by the certificate rather than
          by the derivation, which is the honest division of labour here.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable "trace equals one" fixed and vary the forgotten
          structure, the CM discriminant, the field size and the curve model,
          across the toy ladder.
        predicted_gain: >-
          Distinguishes "the solver works because the curve is anomalous" from
          "the solver works because our toy curves are small or share one
          discriminant", which a single toy curve cannot separate.
    quantifier_order: >-
      Claimed PER INSTANCE, EXISTENTIALLY. For THIS curve and THIS pair of
      points, THERE EXISTS an integer k with k times P equal to Q, exhibited and
      independently re-verified. NOT claimed, that for all anomalous curves the
      solver succeeds. NOT claimed, that for all instances on any curve it
      succeeds. NOT claimed, anything about non-anomalous curves beyond the
      recorded failure of this specific solver on the tested ones.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On the stated curve, k solves Q equal to k times P, verified by
        independent recomputation." It certifies nothing about any other curve,
        nothing about ECDLP hardness in general, and a success here is not
        evidence that any other lane's instrument works.
      nearby_object_control: >-
        A curve with trace t equal to two at the SAME bit size, constructed by
        the same complex-multiplication route, one integer of trace away, with
        the same discriminant, field size and construction pedigree. The solver
        MUST fail on it. This is far sharper than Curve25519, which differs in
        field, size, model and provenance simultaneously.
    proof_obligations:
      - claim: The lift of E and of P to the integers modulo p squared is well-defined and reduces correctly.
        responsibility: correctness
      - claim: >-
          When the order of E(F_p) equals p, p times the lift of P lies in the
          kernel of reduction and the formal logarithm is additive on it.
        responsibility: correctness
      - claim: The recovered k satisfies k times P equal to Q, checked by an independent module.
        responsibility: correctness
      - claim: The solver runs in O(log p) field operations.
        responsibility: runtime
      - claim: >-
          The constructed toy curves genuinely have order of E(F_p) equal to p,
          certified by p times G being the identity plus Hasse uniqueness.
        responsibility: baseline
      - claim: The solver FAILS, with a verification failure rather than a silently accepted wrong answer, on the trace-two control and on Curve25519 and BN(2,254).
        responsibility: strictness
      - claim: The instance is genuinely unknown to the solver, since k is drawn, used to form Q, and discarded before the solver runs.
        responsibility: interface
      - claim: The certificate schema matches docs/claims-and-verification.md and the verifier is independent of the solver's code path.
        responsibility: interface
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: >-
      ECDLP on anomalous, that is trace-one, prime-field elliptic curves, where
      "#E(F_p)" equals p.
    prior_best: >-
      On this family, the additive transfer itself at O(log p) field operations,
      per KN-TECH-033. On general curves, Pollard rho at about 0.886 times the
      square root of N.
    time_exponent: >-
      log p to the O(1) field operations, concretely O(log p) field operations
      and O(log^3 p) bit operations with schoolbook arithmetic. TEXTBOOK, NOT
      NEW, and applying to trace-one curves only.
    memory_exponent: >-
      O(log p), a handful of field elements and one lift. The certificate is
      O(log p) bytes and verification is one scalar multiplication.
    hidden_cofactor: >-
      No o(1) and nothing superpolynomial in the cost itself. The genuine hidden
      cost is SCOPE. The algorithm applies to a set of curves whose density
      among Hasse-admissible orders is about four times the square root of p
      divided by p, vanishing at cryptographic size as KN-TECH-033 states, so
      the exponent is spectacular and the applicability is negligible. Reporting
      the first without the second would be the central dishonesty available
      here.
    claim_kind: exponent_improvement
  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        A complex-multiplication construction with 4p equal to one plus the
        absolute value of D times s squared, for D in the ODD class-number-one
        discriminants and s odd, followed by selecting among the curve's twists
        the one satisfying that p times G is the identity for several
        independent random G, yields a curve with "#E(F_p)" equal to p exactly.
      random_model_justification: >-
        RIGOROUS ONCE THE CHECK PASSES, NOT HEURISTIC, AND IT IS RECORDED THEN
        DISCHARGED RATHER THAN CARRIED. p is prime and lies in its own Hasse
        interval, and the Hasse interval of width four times the square root of
        p contains at most one multiple of p for p greater than 16, so p times G
        being the identity forces "#E" equal to p by Lagrange plus uniqueness.
        For p prime the only proper divisor of p is 1, so a single G other than
        the identity already suffices.
      supporting_results:
        - >-
          KN-TECH-033, read in full in this task, for the trace-one condition
          and the applicability limit. The Hasse-interval uniqueness argument is
          elementary and internal.
      falsification_condition: >-
        Any constructed toy curve fails its own p-times-G check, or its
        brute-force point count at 30 bits disagrees with p.
      validation_experiment_ids:
        - EXP-ECDLP-249327
    - id: H2
      formal_statement: >-
        An additive-transfer implementation validated against an independent
        solver at 30 to 40 bits and against certificate verification at 60 to 80
        bits is correct at 204 bits; formally, it has no size-dependent failure
        mode first appearing above 80 bits.
      random_model_justification: >-
        NONE. This is the weakest item in the record and is labelled as such.
        Partial mitigation, stated as mitigation and not as support, the
        certificate check runs at EVERY size including 204 bits, so a wrong
        answer at 204 bits is CAUGHT even though it cannot be prevented.
      supporting_results:
        - >-
          None. No corpus record supports size-independence of an
          implementation, and none is cited as if it did.
      falsification_condition: >-
        Any solve at any size whose certificate fails independent verification,
        or a failure at 204 bits after full success at 80 bits.
      validation_experiment_ids:
        - EXP-ECDLP-249327
    - id: H3
      formal_statement: >-
        The instances solved are genuinely unknown to the solver; the harness's
        generate-then-discard protocol leaves no channel by which k reaches the
        solver.
      random_model_justification: >-
        Not a mathematical assumption but a software one, and the failure mode
        that would most flatter this record. Its rigorous counterpart is that in
        a group of prime order p every non-identity point is a multiple of P, so
        a uniformly random curve point is a valid instance with NO k ever having
        existed, which removes the channel rather than trusting it to be closed.
      supporting_results:
        - Lagrange, elementary and internal.
      falsification_condition: >-
        The random-Q null succeeds at a materially lower rate than instances
        constructed as k times P.
      validation_experiment_ids:
        - EXP-ECDLP-249327
  structural_ingredients:
    - description: >-
        Source proposal. Fire the additive transfer, emit a re-verified
        certificate, and the four-rung validation ladder with its trace-two
        nearby control and random-Q leakage null.
      citation: IDEA-20260829-f89a3a
      provenance: internal
      verified_by: >-
        TASK-20260904-c063e5 coordinator. Full read of
        ledger/proposals/IDEA-20260829-f89a3a.yaml, 785 lines, Read tool,
        2026-09-04.
      role: originating claim, with its CM discriminant pool corrected here
    - description: >-
        Anomalous, trace-one curves and the additive transfer. Read verbatim.
        "When #E(F_p) = p, the curve group of order p sits in characteristic p,
        and there is an explicit isomorphism from that group onto the additive
        group (F_p, +)... the ECDLP is linear time." Applicability limits read
        verbatim, "Strictly the trace-one case. For trace t != 1 there is no
        known analogue: the attacks do not degrade gracefully as t moves away
        from 1, they simply do not apply, because the additive target group
        disappears." Its own "Verified vs reported" section states that none of
        its three source papers was read in full, and that limitation is
        inherited here rather than laundered.
      citation: KN-TECH-033
      provenance: internal
      verified_by: >-
        TASK-20260904-c063e5 coordinator. Full read of
        knowledge/techniques/KN-TECH-033.md, 63 lines, Read tool, 2026-09-04.
      role: the technique this record proposes to execute rather than cite
    - description: >-
        Governing question, the Curve25519 audit. Its controls block names as
        the POSITIVE control "Reproduce the described Anomalous
        additive-transfer behavior and BN(2,254) multiplicative-transfer/small-
        discriminant behavior only after source and parameter verification",
        which is exactly this record's design. Its claim_boundaries state that
        the Anomalous and BN(2,254) rows are positive-control CANDIDATES and not
        newly discovered attacks, and its scope forbids live keys and restricts
        targets to public named-curve parameters, generated controls and public
        certificates.
      citation: RQ-SCURVE-d9b7d2
      provenance: internal
      verified_by: >-
        TASK-20260904-c063e5 coordinator. Full read of
        ledger/questions/RQ-SCURVE-d9b7d2.yaml, 145 lines, Read tool,
        2026-09-04.
      role: the governing question, which admits the anomalous run as its own positive control
    - description: >-
        The Anomalous row's intake tuple. Its scope records a field bit length
