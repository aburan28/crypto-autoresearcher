  reduction_chain:
    core_problem: >-
      ECDLP on a trace-one prime-field curve, solved and certified.
    corollaries: []
  predictions:
    - metric: >-
        verified solves on constructed anomalous curves at 30, 40, 60 and 80
        bits, 25 instances each, count
      direction: higher
      minimum_effect: >-
        100 out of 100. The algorithm is deterministic with no failure
        probability, so anything below 100 percent means the implementation is
        wrong and no larger run may proceed.
    - metric: >-
        agreement between the additive-transfer solver and baby-step giant-step
        on the returned k at 30 and 40 bits, count of exact integer matches
      direction: different
      minimum_effect: >-
        Exact equality on all 25 instances per size. This is the one rung with
        an independent SOLVER rather than only an independent verifier, and the
        only place a systematically wrong but self-consistent implementation can
        be caught.
    - metric: >-
        verified solves on the roughly 204-bit Anomalous row, 10 instances,
        count
      direction: higher
      minimum_effect: >-
        10 out of 10, each with a certificate. The single headline artifact. A
        failure here after full success at 80 bits indicates a size-dependent
        defect and falsifies H2.
    - metric: >-
        verified solves on the trace-two nearby control, 100 attempts, count,
        at matched field size and matched CM discriminant
      direction: lower
      minimum_effect: >-
        Exactly zero. This is the control that isolates the trace, and a success
        here means the solver is exploiting something other than
        anomalousness.
    - metric: >-
        verified solves on Curve25519 and on BN(2,254), 100 attempts each, count,
        together with the FAILURE MODE recorded per attempt
      direction: lower
      minimum_effect: >-
        Exactly zero. THE COUNT IS FORCED and is therefore not the informative
        part, see the band note in EXP-ECDLP-249327; the FAILURE MODE
        distribution is what is measured. A single verified success would be
        either a catastrophic implementation error or a result requiring
        immediate independent review-breakthrough scrutiny, and this record
        pre-commits to treating implementation error as overwhelmingly the
        likelier explanation, to halting, and to making no statement outside the
        repository until it is excluded.
    - metric: >-
        random-Q null solve rate, 100 instances where Q is drawn as a random
        curve point and no k is ever computed, dimensionless in [0,1]
      direction: higher
      minimum_effect: >-
        1.000, identical to the k-times-P instances, because in a group of prime
        order p every non-identity point is a multiple of P. At n = 100 the
        probability of observing zero failures under a true 10 percent leak
        effect is 0.9 to the 100th, about 2.7e-5, so this test has power above
        0.9999 against a 10 percent gap. Any gap voids every solve.
    - metric: >-
        measured solver cost in field operations at 204 bits, against the
        ARITHMETIC EVALUATION of 0.886 times the square root of p
      direction: lower
      minimum_effect: >-
        Below 10^4 field operations against a rho figure of about 2^101.8. THE
        COMPARISON IS BETWEEN A MEASURED COST AND AN EVALUATED FORMULA, not
        between two measurements, and must be reported as such; rho is not run
        at 204 bits and no claim about its measured cost is made.
    - metric: >-
        whether the Anomalous row's parameters can be re-sourced to any primary
        or authoritative document
      direction: different
      minimum_effect: >-
        Reported as a yes or no with the search recorded. A no does not block
        the solve but bounds what the solve may be cited for, and it is a
        finding about the family's designated positive control.
  test_boundary:
    instances:
      - >-
        Constructed anomalous curves at 30, 40, 60 and 80 bits, across at least
        three distinct CM discriminants drawn from the SEVEN usable
        class-number-one values {3, 7, 11, 19, 43, 67, 163} with s odd.
      - Trace-two nearby controls at each size, same discriminant, same construction.
      - The roughly 204-bit Anomalous row from RQ-SCURVE-84a540.
      - Curve25519 and BN(2,254) at full size, as cross-curve negative controls.
    parameters:
      claim_tier: crypto at the 204-bit row, toy at 30 bits, medium in between
      instances_per_toy_size: 25
      instances_at_204_bits: 10
      negative_control_attempts: 100
      random_Q_null_instances: 100
    implementation: >-
      Not yet written. EXP-ECDLP-249327 declares the required artifacts and its
      blocking preconditions.
    budget:
      wall_clock_seconds_per_run: 600
      maximum_memory_gb: 8
      maximum_runs: 6
  falsification_conditions:
    - >-
      Any solve at any size whose certificate fails independent verification.
      Per the certificate discipline this is invalid_measurement, NOT a negative
      observation; the run is void and the implementation is wrong.
    - >-
      The additive-transfer solver and baby-step giant-step disagree on k at 30
      or 40 bits. The implementation is wrong in a way certificate verification
      alone might not have caught. Halt.
    - >-
      Any verified success on the trace-two nearby control, on Curve25519, or on
      BN(2,254). HALT, exclude implementation error first, escalate to
      independent review-breakthrough scrutiny per AGENTS.md rule 12, and make
      no statement outside the repository.
    - >-
      The random-Q null succeeds at a materially lower rate than the instances
      constructed as k times P. The harness is leaking the answer and every
      solve is void.
    - >-
      Failure at 204 bits after 100 percent success at 80 bits. A size-dependent
      defect; the headline certificate is withdrawn and the threshold size is
      reported, which is a useful negative for every other instrument in this
      campaign.
    - >-
      A constructed toy curve fails its own p-times-G check, or its 30-bit
      brute-force point count disagrees with p. The CM construction is wrong and
      no solve on it means anything.
  interpretation_limits:
    - >-
      A SOLVE ON A DELIBERATELY BROKEN CURVE IS NOT A BREAK OF ANYTHING. The
      Anomalous row exists in the family precisely to be broken; reproducing
      that is instrument validation, not discovery, and RQ-SCURVE-d9b7d2's own
      claim_boundaries call it a positive-control candidate.
    - >-
      A successful solve validates THIS instrument only. It says nothing about
      whether the rho, discriminant, ladder or indistinguishability lanes can
      fire, and no record may cite it as general evidence of the campaign's
      instrumentation.
    - >-
      TRANSFER STATED EXACTLY. As an ATTACK, zero transfer; the attack applies
      to trace one and to nothing else. As a CONTROL, full transfer, and this is
      the record's family-wide value, since every additive sub-lane in the
      family could then cite a fired instrument rather than an asserted one. As
      a TEMPLATE, the same flag-to-solve upgrade is available for the
      multiplicative transfer on BN(2,254), which is forward guidance and NOT
      attempted here.
    - >-
      The exponent statement, from p to the one half down to log p to the O(1),
      is about the trace-one family only, is textbook, and is not a bid against
      docs/target-result-profile.md. This record TIES that frontier and does not
      advance it.
    - >-
      CONSTRUCTION POOL CORRECTED. Only seven of the nine class-number-one
      discriminants can host a trace-one curve by the stated construction, and s
      must be odd. The source proposal's mitigation for toy-scale construction
      bias is bounded by that pool.
    - >-
      TWO SOURCES THE PROPOSAL RELIED ON WERE NOT OPENED HERE.
      harness/toycurve.py and docs/claims-and-verification.md are recorded as
      recalled in this record; the contract makes reading both a blocking
      precondition rather than inheriting the proposal's readings.
  status: proposed
  proposed_by: idea-generator
