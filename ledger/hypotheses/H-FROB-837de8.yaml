# =============================================================================
# H-FROB-837de8 — specified from IDEA-20261006-56d83f. The prediction is
# the source idea's own pair of gaps: g_obj >= 0.15 and g_null <= 0.05.
# The concrete negative is that the instrument checks pass, both samples
# have size at least 100, the trace map is lossy, and at least one of
# those two inequalities fails. This record does not enumerate
# E(F_{125}).
# =============================================================================
hypothesis:
  id: H-FROB-837de8
  question_id: RQ-FROB-7d8dd4
  source_idea: IDEA-20261006-56d83f
  goal_id: GOAL-FROB-6333a9
  added: '2026-10-06'
  status: specified
  proposed_by: coordinator
  title: >-
    Odd-character trace gap of summing triples versus shifted triples
    on y^2 = x^3 + x + 1 over F_5, against a null curve
  statement: >-
    On E: y^2 = x^3 + x + 1 over F_5, among ordered triples of pairwise
    distinct affine points of E(F_{125}) with P+Q+R = O that remain
    pairwise distinct and affine after replacing R by R+T, let p_rel be
    the fraction with relative trace Tr_{F_125/F_5}(x(P)+x(Q)+x(R)) = 0,
    and let p_shift be the fraction for the matched triples (P, Q, R+T),
    where T is the first affine point in the frozen lexicographic
    enumeration. Let g_obj = |p_rel - p_shift|. Define g_null the same
    way on y^2 = x^3 + x + z over F_5[z]/(z^3 + z + 1), or on
    y^2 = x^3 + x + (z+1) if the discriminant of the first null model
    is zero. The claim is g_obj >= 0.15 and g_null <= 0.05. The
    discrete-log time exponent stays 1/2 and the delta versus Pollard
    rho is 0.
  mechanism: >-
    Two explanations are distinguished before any count is seen.
    Explanation A: the linear trace constraint of KR-IC-f5c584 uses a
    group morphism onto F_2 on ordinary binary curves, and KN-FIND-ffe1df
    Theorem C says an exactly sum-compatible index is a homomorphism,
    which x-coordinates do not give in odd characteristic, so g_obj < 0.15.
    Explanation B: merely defining the curve over F_5 forces the trace
    of the sum of x-coordinates on every relation into a biased subset
    of F_5, so g_obj >= 0.15 and the same bias is absent on the null
    curve. The claim is explanation B. The measured object is the
    trace of three x-coordinates, not a relation vector and not a
    discrete logarithm.
  assumptions:
    - >-
      Triples containing the point at infinity are dropped, because x
      is undefined there. A relation sample of size under 100 on either
      curve voids the comparison.
    - >-
      T is the first affine point in lexicographic order of (x, y),
      fixed before the proportions are computed, and the same rule is
      used on the null curve.
    - >-
      A pair enters both arms only when (P, Q, R) and (P, Q, R+T) are
      pairwise distinct affine points, so the two sample sizes on one
      curve are equal by the shared list.
    - >-
      The extension is F_5[z]/(z^3 + z + 1). The design session checked
      that t^3 + t + 1 has no root in F_5, that z^3 + z + 1 = 0, that
      4 + 27 z^2 is the nonzero element 4 + 2 z^2, and that the relative
      trace on the whole field is zero on exactly 25 elements. It did
      not enumerate either curve.
  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
    not_applicable_reason: >-
      This is a control that separates two explanations by two
      proportions on toy curves. It does not certify a dropped variable
      or a new exponent.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        If explanation B holds, the expectation of the indicator
        Tr(x(P)+x(Q)+x(R)) = 0 on relations is at least 1/5 + 0.15,
        while a uniform map from triples of field elements to F_5 has
        expectation 1/5. The uniform figure is the model being
        imitated. The bias is the unproved transfer of the
        characteristic-2 trace constraint to odd characteristic.
      random_model_justification: >-
        For a uniform F_5-valued function the zero locus has density
        1/5. The relative trace on F_125 is exactly balanced: the
        design session counted 25 zeros among 125 field elements. That
        balance does not prove a bias on relation triples.
      supporting_results:
        - KR-IC-f5c584
        - KN-FIND-ffe1df
      validation_experiment_ids:
        - EXP-FROB-c3bc90
      falsification_condition: >-
        The instrument checks pass, both samples have size at least
        100, the trace map on the object relation sample has mean fibre
        at least 2, and either g_obj < 0.15 or g_null > 0.05. A
        half-sample gap above 0.05 does not by itself refute HEUR-1;
        it is reported and does not choose the reading row.
  structural_ingredients:
    - description: >-
        On ordinary binary curves the Weil descent of S_3 has first
        fall degree 2 because a morphism onto F_2 produces a linear
        polynomial. The row is scoped to characteristic 2.
      citation: KR-IC-f5c584
      provenance: internal
      verified_by: >-
        coordinator design session, 2026-10-06, opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-f5c584.yaml
      role: characteristic-2 trace constraint that explanation B tries to imitate
    - description: >-
        Theorem C: exact sum-compatibility plus associativity forces a
        surjective homomorphism onto the bucket group.
      citation: KN-FIND-ffe1df
      provenance: internal
      verified_by: >-
        coordinator design session, 2026-10-06, opened
        knowledge/findings/KN-FIND-ffe1df.md
      role: obstruction to an exactly sum-compatible bucket map that is not a homomorphism
    - description: >-
        Gaudry's fixed-n cost is Õ(q^{2-2/n}). A single linear bias at
        n=3, even if present, is not given an exponent in this record.
      citation: KR-IC-46d822
      provenance: internal
      verified_by: >-
        coordinator design session, 2026-10-06, opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-46d822.yaml
      role: cost ceiling this hypothesis does not claim to move
  reduction_chain:
    core_problem: >-
      Whether the trace of x(P)+x(Q)+x(R) on summing triples is biased
      by at least 0.15 relative to a frozen shift, on one curve over
      F_5 and not on the null curve.
    corollaries: []
  predictions:
    - metric: >-
        absolute gap between trace-zero proportions on summing triples
        and on shifted triples
      direction: different
      minimum_effect: "g_obj >= 0.15 and g_null <= 0.05"
  test_boundary:
    instances:
      - y^2 = x^3 + x + 1 over F_5, points in F_5[z]/(z^3 + z + 1)
      - the null model y^2 = x^3 + x + z, replaced by z+1 only if its discriminant is zero
    parameters:
      q: 5
      n: 3
      gap_object_minimum: "0.15"
      gap_null_maximum: "0.05"
      minimum_sample: 100
    implementation: experiments/EXP-FROB-c3bc90/implementation/run.py
    budget:
      maximum_runs: 1
      maximum_memory_gb: 1
  falsification_conditions:
    - >-
      g_obj < 0.15 after the instrument checks pass, both samples have
      size at least 100, and the object trace map is lossy. That
      selects explanation A on this instance.
    - >-
      g_null > 0.05 under the same instrument conditions, so a gap of
      that size is not tied to the curve being defined over F_5.
    - Any of the 20 Frobenius-trace checks fails. That voids the run.
    - >-
      The single-element trace proportion lies outside [0.15, 0.25],
      so the trace implementation is not believed. That voids the run.
    - Either sample has size under 100. That voids the run.
  interpretation_limits:
    - >-
      Toy scope: F_5 and F_125 only. A gap here does not drop a
      variable in Gaudry's system at general n.
    - The discrete-log time exponent stays 1/2 and the delta versus Pollard rho is 0.
    - >-
      Explanation A remains available if the inequality fails. Failure
      is about this trace, not about every linear functional.
    - >-
      This is not the binary trace morphism of KR-IC-f5c584, and it
      does not restate a point count.
