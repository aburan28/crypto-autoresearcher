hypothesis:
  id: H-ECDLP-39d8b0
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  source_proposal: IDEA-20260808-621df3
  statement: >-
    Within the exact 60-cell ordinary prime-field corpus of EXP-ECDLP-03a8c9,
    every conductor level with 4B < |D_f| has rho_f(B)=2 floor(sqrt(B)); every
    prior G3>4 excursion is confined to curves whose levels are all in that
    sparse regime; and density-valid levels retain the prior normalized
    conservation deviation below 0.01. This is a toy reanalysis claim only.
  mechanism: >-
    The principal norm form has its first nonzero y-row at |D_f|/4. When that
    exceeds B, only y=0 contributes, so rho is exactly the two x-axis rows.
    The prior product then tracks h_f alone, explaining excursions that are not
    evidence against the asymptotic conservation identity.
  assumptions:
    - Prior source files are bound by exact SHA-256 values in the specification.
    - The source implementation's process_curve function is imported without
      modification and its arithmetic is independently checked.
    - No result is generalized beyond the prior corpus, B, or implementation.
  proof_search_map:
    bottleneck: finite-density cutoff versus conductor-level conservation
    baseline_embedding:
      parameter_slice: all prior 60 (p,t) cells at B=1000000
      reproduction_check: exact source hashes and prior G3 values
    observation_collision:
      observable: G3 and level rho values
      distinct_preimage_search: density-valid levels versus sparse levels and lower-B control
    quantifier_order: >-
      For all source-bound curves, for all f|c, verify exact row arithmetic before
      aggregating any explanation rate.
    method_ceiling:
      strongest_certifiable_claim: finite-corpus density explanation only
      nearby_object_control: matched lower-B sparse cutoff with no product claim
  predictions:
    - metric: sparse_level_rho_identity_rate
      direction: equal
      minimum_effect: 1.0
    - metric: g3_exceedance_explained_rate
      direction: equal
      minimum_effect: 1.0
    - metric: density_valid_normalized_deviation
      direction: lower
      minimum_effect: '< 0.01'
  falsification_conditions:
    - source hash or prior G3 reproduction mismatch
    - sparse rho identity failure
    - G3>4 curve containing a density-valid level
    - density-valid normalized deviation >= 0.01
  interpretation_limits:
    - no ECDLP solve, attack, asymptotic, or crypto-scale claim
    - no closure of ordinary-isogeny or endomorphism lanes
    - prior run approval defects are not repaired by this reanalysis
  dominated_by: Pollard rho on the declared prime-field ECDLP scope
  sota_delta:
    generic_time_exponent: 0.0
    memory_exponent: 0.0
    data_query_improvement: 0
    cryptographic_security_bits_reduced: 0
  status: proposed
