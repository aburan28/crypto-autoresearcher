# H-OAKLEY-2fae30
# Stage-0 chain identity for IDEA-20261007-424b6f.
# Solver timings and the binary cells are not this hypothesis.
hypothesis:
  id: H-OAKLEY-2fae30
  question_id: RQ-OAKLEY-264353
  goal_id: GOAL-ECDLP2M-001
  source_idea: IDEA-20261007-424b6f
  added: '2026-10-12'
  status: specified
  statement: >-
    On y^2 = x^3 + x + 1 over F_17, every ordered quadruple of
    x-coordinates has the same answer under a sign search for a
    four-point sum to infinity and under the Semaev chain that asks
    whether both pairs are inverse or some auxiliary q satisfies
    S3(x1, x2, q) = S3(q, x3, x4) = 0.
  test_boundary: >-
    One prime, one curve, one chain split, and all 17^4 ordered
    quadruples. No SAT encoding, no Groebner basis, no second prime,
    and no binary field.
  mechanism: >-
    S3(x1, x2, x3) = 0 is the condition that points with those
    x-coordinates can sum to infinity. The chain eliminates the
    auxiliary between two such factors. The sign search is the same
    relation written with the chord-and-tangent law. IDEA-20261007-424b6f
    requires this identity before a t=5 cost comparison.
  distinguishable_outcomes:
    - >-
      The planted sum has S3 = 0, and no quadruple disagrees.
    - >-
      The planted sum has S3 = 0, and at least one quadruple disagrees.
    - >-
      The planted sum does not have S3 = 0. That outcome invalidates
      the run.
  falsification: >-
    The planted identity holds and the disagreement count is strictly
    positive.
  not_claimed: >-
    No cost ratio, no statement about S6, and no statement about the
    Oakley endpoint curves.
