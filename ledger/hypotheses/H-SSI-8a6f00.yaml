# =============================================================================
hypothesis:
  id: H-SSI-8a6f00
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  source_idea_ids:
    - IDEA-20261006-fec972
  added: '2026-10-07'
  status: specified
  proposed_by: coordinator
  title: >-
    Full rational 2-torsion on every supersingular class over F_{p^2}
    at p = 23
  statement: >-
    For p = 23, every F_{p^2}-isomorphism class of supersingular
    elliptic curves has three distinct points of order 2 rational
    over F_{p^2}. The concrete negative is that at least one such
    class has fewer than three, so the fraction is at most 1 - 1/C,
    where C is the number of classes. No supersingular isogeny
    exponent is claimed.
  mechanism: >-
    Object frame, carried from IDEA-20261006-fec972. The
    representation is the short-Weierstrass cubic
    f_E = x^3 + Ax + B of a model over F_{p^2}. Its roots are the
    x-coordinates of the three nontrivial geometric 2-torsion points.
    Sigma is the p^2-power Frobenius on those roots. The count of
    roots in F_{p^2} is 0, 1, or 3. The census asks whether that
    count is 3 for every supersingular F_{p^2}-isomorphism class at
    p = 23. A positive answer would mean rational 2-torsion is
    implied by the supersingular distribution at this prime. A
    negative answer would mean it is an extra restriction. Neither
    answer is an attack or a change to the p^{1/3+o(1)} or p^{1/4}
    supersingular bounds.
  assumptions:
    - >-
      Supersingularity is tested over F_{p^2} by the trace of
      Frobenius, or by an equivalent criterion recorded with the
      class list.
    - >-
      Two models are the same class when an isomorphism over
      F_{p^2} exists. Quadratic twists that are not isomorphic over
      F_{p^2} are distinct classes and are both counted.
    - >-
      p = 23 is odd, so the 2-torsion is etale and is cut out by a
      separable cubic in a short Weierstrass model.
    - >-
      No claim is made that the group order equals (p - 1)^2 or
      (p + 1)^2. That formula was not opened in a source this session.
  proof_search_map:
    bottleneck: >-
      The splitting type of f_E over F_{p^2} for each supersingular
      class at p = 23. The claim dies if any class has 0 or 1 root
      in F_{p^2}.
    baseline_embedding:
      parameter_slice: >-
        Uniform factorization types of cubics, identified with S_3.
        The identity has density 1/6 under that counting measure.
      reproduction_check: >-
        On y^2 = x^3 - x over F_23, the cubic x^3 - x has roots
        0, 1, and -1. The same root counter used for the census
        must return 3 before any supersingular class is scored.
        That checks the counter. It does not assert that the curve
        is supersingular.
    observation_collision:
      observable: >-
        The fraction of supersingular F_{p^2}-isomorphism classes
        whose 2-division cubic has three roots in F_{p^2}.
      distinct_preimage_search: >-
        Two non-isomorphic classes with the same splitting type
        collide in this observable. Keep the j-invariant and the
        twist parameter so a second count can see whether two
        classes were merged.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The set of supersingular classes at p = 23 whose cubic
          splits completely, against the classes whose cubic has a
          linear or irreducible cubic factor.
        predicted_gain: >-
          Turns the claim into a fiber count. One class outside the
          complete-split fiber falsifies fraction 1. The predicted
          gain in the supersingular isogeny exponent is zero.
    quantifier_order: >-
      For every F_{p^2}-isomorphism class of supersingular curves
      at p = 23, the 2-division cubic has three roots in F_{p^2}.
      Existence of one split class is not the claim.
    method_ceiling:
      strongest_certifiable_claim: >-
        The fraction equals 1 at p = 23, or it does not. The census
        says nothing about other primes and nothing about isogeny
        path-finding.
      nearby_object_control: >-
        Ordinary curves over F_{p^2} with the same point count as a
        supersingular class, when any exist, and 100 random monic
        cubics over F_{p^2}. If the ordinary matches also all split,
        supersingularity is not distinguished by this count. If the
        random complete-split frequency lies outside [0, 1/3], the
        factorizer is void.
    proof_obligations:
      - claim: The identity element of S_3 has density 1/6.
        responsibility: baseline
      - claim: Each class is scored by roots of its own cubic over F_{p^2}.
        responsibility: correctness
      - claim: The universal quantifier stops at p = 23.
        responsibility: scope
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        Under the counting measure on S_3, the complete-split type
        has density 1/6. The supersingular F_{p^2} distribution at
        p = 23 is assumed to put every class in that single type.
        No mixing-time theorem was opened to force that bias.
      random_model_justification: >-
        S_3 has six elements and one identity. A cubic has 0, 1, or
        3 roots in the base field. Transfer of the counting measure
        onto the supersingular locus is the heuristic.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        Any single prime p with 19 <= p <= 80, including p = 23,
        has complete-split fraction at most 5/6 on a direct
        enumeration of supersingular classes over F_{p^2}.
  structural_ingredients:
    - description: >-
        Supersingular j-invariants in characteristic p live in
        F_{p^2}. This is a pointer for the census, not a proof that
        2-torsion is rational.
      citation: >-
        Deuring correspondence, standard textbook statement; the
        book was not opened
      provenance: recalled
      verified_by: null
      role: field of definition of supersingular j-invariants
  predictions:
    - metric: >-
        fraction of supersingular F_{p^2}-isomorphism classes at
        p = 23 with three rational points of order 2
      direction: higher
      minimum_effect: >-
        The fraction equals 1, which is 6 times the S_3 identity
        density 1/6.
  test_boundary:
    instances:
      - supersingular F_{p^2}-isomorphism classes at p = 23
    parameters:
      prime: 23
      instrument: y^2 = x^3 - x over F_23
      random_cubics: 100
    implementation: >-
      Direct enumeration. No Deuring sampling shortcut. No driver
      is bound in this record.
    budget:
      maximum_runs: 1
  falsification_conditions:
    - >-
      At least one supersingular F_{p^2}-isomorphism class at
      p = 23 has fewer than three points of order 2 rational over
      F_{p^2}. The fraction is then at most 1 - 1/C.
    - >-
      The instrument check on y^2 = x^3 - x fails. No supersingular
      fraction from that run is admissible, and the failure is not
      the concrete negative above.
  interpretation_limits:
    - >-
      Fraction 1 at p = 23 does not change the supersingular
      isogeny exponents and is not a path-finding algorithm.
    - >-
      Fraction 1 does not say rational 2-torsion is free auxiliary
      data at cryptographic size. Toy effects stay
      hypothesis-generating under RQ-SSI-001.
    - >-
      A single counterexample class closes the universal claim at
      p = 23 only.
  status_note: >-
    specified means the protocol is written. It does not mean
    approved. EXP-SSI-0d35ba is review_required.
