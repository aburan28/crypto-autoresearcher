  statement: >
    Fix the prime n=5 before any
    partition of F_n^2 minus zero is
    enumerated. Stage 0 asserts only
    the M1/M2/M3 count identities of
    IDEA-20260902-63dbc0 as exact
    integer arithmetic: M1 equals
    d(n-1)+1, M2 equals 2, and M3
    equals n+1. At n=5, d(4)=3 so
    REAL is M1=4, M2=2, M3=6. KF
    replaces d(n-1) by d(n), so
    KF M1=d(5)+1=3 which is not 4.
    NULL is the zero count, so M1=0
    which is not 4. n=4 (composite)
    and n=1 are rejected. This is
    not a complete GL_2/AGL_2
    partition census at n in
    {5,7,11,13}, not a Z/6 nearby-
    object census, not an E[ell]
    kernel count, not a rho cost
    identification, and not a rho
    beat. Stages 1+ stay unauthorized.
  mechanism: >
    IDEA-20260902-63dbc0 names the
    GL_2 block-system count as
    d(n-1)+1 (one Gamma-orbit
    partition per subgroup of the
    cyclic group F_n^*, plus the
    one-block partition), AGL_2
    count 2 by 2-transitivity, and
    image floor n+1. Stage 0 freezes
    those three integers at n=5.
    The producer evaluates the
    divisor function by exact
    integer arithmetic. The KF
    wrong-divisor object and the
    NULL zero count are the
    proves-too-much and nearby-
    object controls. No partition
    is enumerated. No matrix group
    is generated. No curve is
    touched. This is a new
    RQ-ECDLP-002 object after
    Stage 0 of EXP-ECDLP-821bc5
    held as P-S0-WTLAW
    (DEC-20260908-959b48). It is
    not Stage 1 of EXP-ECDLP-821bc5
    and not Stage 1 of this
    experiment.
  predictions:
    - id: P-S0-TUPLE
      metric: well-defined exact M1/M2/M3 identity at frozen n=5
      direction: different
      minimum_effect: >
        After fixture_pass, REAL M1
        equals 4, M2 equals 2, M3
        equals 6. KF wrong-divisor
        M1 equals 3. NULL zero-count
        M1 equals 0. n=4 and n=1
        are rejected. One certified
        miss after fixture_pass is a
        scoped falsification of this
        instrument at n=5.
      claim_tier: observational
    - id: P-S1-ENUM
      metric: complete GL_2/AGL_2 invariant-partition census at n in {5,7,11,13}
      direction: different
      minimum_effect: >
        Stage 1+, unauthorized here.
        Stage 0 does not enumerate
        partitions, does not generate
        GL_2, and does not touch Z/6
        or E[ell].
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KFCOUNT
      statement: >
        After fixture_pass, KF
        wrong-divisor M1 reports 4,
        equal to REAL. An encoding
        bug is failed_infrastructure.
    - id: F-S0-REALCNT
      statement: >
        After fixture_pass, REAL M1
        fails to equal 4, or M2
        fails to equal 2, or M3
        fails to equal 6. That
        falsifies only P-S0-TUPLE
        at frozen n=5.
    - id: F-S1-ENUM
      statement: >
        After an authorized later
        stage, a claimed partition
        that is GL_2-invariant but
        not a Gamma-orbit. Unauthorized
        here.
  test_boundary:
    instances:
      - frozen Stage 0 REAL / KF / NULL panel
    parameters:
      n_frozen: 5
      real:
        M1: 4
        M2: 2
        M3: 6
      known_false: {M1_wrong_divisor: 3, must_not_equal_real: true}
      matched_null: {kind: zero_count, must_M1: 0, must_not_equal_real: true}
      stage0_only_at_specify: true
    implementation: EXP-ECDLP-114eb2 Stage 0 runner
    budget:
      wall_clock_seconds: 120
    prose: >
      Toy scale. Stage 0 is exact
      integer arithmetic on one
      frozen divisor-count identity.
      It is not a GL_2 census, not
      a Z/6 nearby-object census,
      not an E[ell] kernel count,
      not a rho cost identification,
      not Stage 1 of EXP-ECDLP-114eb2,
      not Stage 1 of EXP-ECDLP-821bc5,
      not Stage 1 of EXP-ECDLP-735974,
      not Stage 1 of EXP-ECDLP-fdae20,
      not Stage 1 of EXP-ECDLP-089e80,
      not Stage 1 of EXP-ECDLP-b3f975,
      not Stage 1 of EXP-ECDLP-daf1bb,
      not Stage 1 of EXP-ECDLP-0d1336,
      not Stage 1 of EXP-ECDLP-1aa0f8,
      not Stage 1 of EXP-ECDLP-79f8c4,
      not Stage 1 of EXP-ECDLP-628891,
      not Stage 1 of EXP-ECDLP-9e9536,
      not Stage 1 of EXP-ECDLP-90f602,
      and not Stage 2 of
      EXP-ECDLP-4be480. No
      cryptographic transfer. No
      rho beat.
  assumptions:
    - id: A1
      statement: >
        n=5 is frozen. d(4)=3 is
        the divisor count of n-1.
        Stage 0 does not enumerate
        subgroups of F_5^* by
        listing elements.
      status: explicit
    - id: A2
      statement: >
        M1=d(n-1)+1, M2=2, M3=n+1
        of IDEA-20260902-63dbc0
        Stage 1 (a)-(c) are the
        zero-compute count laws.
        Stage 0 tests those laws as
        arithmetic, not a partition
        census.
      status: explicit
    - id: A3
      statement: >
        Standing user authorization 2026-09-06
        covers protocol approval once the
        contract is complete.
      status: explicit
    - id: A4
      statement: >
        Recalled GL_m / AGL_m
        textbook facts remain
        pointers until an authorized
        later stage enumerates
        partitions. Stage 0 uses
        only the frozen integers
        recorded here.
      status: explicit
  heuristic_assumptions: []
  proof_search_map:
    bottleneck: >
      Whether M1 at frozen n=5 equals
      d(n-1)+1 as exact integer
      arithmetic. Stage 0 only checks
      that identity, M2=2, M3=n+1,
      the wrong-divisor known-false,
      and the zero nearby object.
    baseline_embedding:
      parameter_slice: >
        The REAL, KF, and NULL fixtures.
        Disclosed tightening: M1/M2/M3
        count identity at n=5 only, not
        the proposal's complete GL_2
        census at n in {5,7,11,13},
        not Z/6, not E[ell], not rho
        cost identification.
      reproduction_check: >
        REAL M1=4, M2=2, M3=6.
        KF wrong-divisor M1=3\neq4.
        NULL zero-count M1=0\neq4.
    observation_collision:
      observable: >
        M1 versus d(n-1)+1, versus
        d(n)+1, versus 0.
      distinct_preimage_search: >
        Hold n=5 and replace d(n-1)
        by d(n) (KF). Hold n and
        replace the count by 0 (NULL).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Frozen exact M1/M2/M3 identity.
        predicted_gain: >
          Exact known-false wrong-divisor
          gap on KF. Zero claimed attack
          improvement.
    quantifier_order: >
      Freeze n=5 before reading M1.
      Existential equality at one
      prime does not imply a complete
      GL_2 census and does not imply
      a rho beat.
    method_ceiling:
      strongest_certifiable_claim: >
        Instrument reproduction on the
        declared frozen n=5 integers.
        Never a partition census.
        Never a rho cost identification.
        Never an ECDLP exponent.
      nearby_object_control: >
        NULL is the zero count. An
        argument that still assigns it
        M1=4 is wrong. KF is the
        wrong-divisor object; an
        argument that assigns every
        divisor formula M1=4 is wrong.
    proof_obligations:
      - claim: well-defined exact M1/M2/M3 identity
        responsibility: correctness
      - claim: exact REAL identity at n=5
        responsibility: baseline
      - claim: exact KF wrong-divisor gap
        responsibility: baseline
      - claim: no GL_2 census, no Z/6 census, no E[ell] kernel count, no rho cost identification, no Stage 1 of 114eb2/821bc5/735974/fdae20/089e80/b3f975/daf1bb/0d1336/1aa0f8/79f8c4/628891/9e9536/90f602, no Stage 2 of 4be480
        responsibility: interface
    not_applicable_reason: null
