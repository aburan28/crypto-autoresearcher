hypothesis:
  id: H-SQISIGN-481eaf
  question_id: RQ-SQISIGN-001
  added: '2026-08-25'
  derived_from_idea: IDEA-20260805-18a4d4
  status: proposed
  proposed_by: coordinator

  statement: >-
    SCOPE. A SQIsign-SHAPED protocol, meaning one in which the response of signature
    i corresponds to a left O_A-ideal J_i with [J_i] equal to
    [conj(I_tau) I_{psi_i} I_{phi_i}], where I_tau is the secret connecting ideal and
    psi_i, phi_i are that signature's commitment and challenge. THE PROTOCOL SHAPE IS
    RECALLED AND UNVERIFIED - no SQIsign specification of any version has been read by
    this program, RQ-SQISIGN-001's provenance says so, and verifying the shape is a
    gate rather than an assumption. Claim tier - theory for the derivation, toy for
    any measurement. NO ATTACK, NO EXPONENT, NO CLAIM THAT ANY SCHEME IS BROKEN OR
    SAFE.
    C1, THE CANCELLATION. Writing K_i for I_{psi_i} I_{phi_i}, the connecting ideal
    class between two response codomains satisfies
    [conj(J_i) J_j] equal to [conj(K_i) K_j], because
    conj(conj(I_tau)) conj(I_tau) equals I_tau conj(I_tau) equals n(I_tau) O_0, a
    rational-integer scalar, and scalars act trivially on ideal classes. THE SECRET
    CANCELS EXACTLY. Therefore EVERY statistic that is a function of the pair of
    response codomains alone - their graph distance, the degree of the minimal
    connecting isogeny, any invariant of the connecting class, any do-two-signatures-
    land-suspiciously-close test - is independent of the secret key, at every
    parameter, at every scale, with no heuristic.
    C2, THE ASYMMETRY, AND IT IS THE SHARPEST OUTPUT. The same family is NOT dead as a
    DISTINGUISHER. The honest pair's minimal connecting degree is bounded by
    n(K_i) n(K_j) equal to (D_psi D_phi)^2, while a simulated pair's codomains are
    endpoints of independent degree-D_sigma walks from E_A whose minimal connecting
    degree is generically about p. So if (D_psi D_phi)^2 is less than p, the pair
    statistic separates honest from simulated - a distinguisher with a PROVEN ABSENCE
    of any conversion path to key information.
    C3, THE HYBRID FACTOR. If the zero-knowledge property is stated per transcript,
    multi-signature indistinguishability follows by a hybrid over the signing budget q
    at a cost of a factor q, so a scheme targeting lambda bits with a q-query budget
    needs per-transcript statistical distance at most 2^-(lambda + log2 q), not
    2^-lambda. THE CLAIM IS NOT THAT ANY DESIGNER OMITTED THIS. The claim is that THIS
    CORPUS has never written q down, so a program record comparing a measured
    transcript bound against 2^-lambda is comparing against the wrong threshold.
    WHAT IS DECIDABLE HERE AND WHAT IS NOT. C1's falsifier is a MEASUREMENT with real
    teeth - the number of distinct pair classes over R independent secrets at fixed
    commitments is FORCED to 1 by the identity, so more than 1 refutes it outright.
    C3's resolution requires reading a specification this harness may not be able to
    reach, and that arm is expected to be recorded blocked.

  mechanism: >-
    DERIVED IN-REPO, and every external theorem below is RECALLED, UNVERIFIED and is a
    candidate to check rather than an authority.
    NOTATION. B a quaternion algebra ramified at p and infinity, O_0 a fixed maximal
    order with End(E_0) equal to O_0. Deuring - isogenies from E_0 correspond to left
    O_0-ideals; the codomain's endomorphism ring is the ideal's RIGHT order; composition
    of isogenies corresponds to the product of ideals when the right order of the first
    equals the left order of the second; the dual isogeny corresponds to the conjugate
    ideal; and the degree equals the reduced norm. Standard - I conj(I) equals
    n(I) O_left(I) and conj(I) I equals n(I) O_right(I).
    THE SIGNING RELATION. Secret tau from E_0 to E_A with ideal I_tau. Signature i -
    commitment psi_i from E_0 to E_{1,i}, challenge phi_i from E_{1,i} to E_{2,i},
    response sigma_i from E_A to E_{2,i} with ideal J_i. Since the composite
    E_A to E_0 to E_{1,i} to E_{2,i} has the same endpoints as sigma_i, and connecting
    ideals between a fixed pair of orders form a single class,
    [J_i] equals [conj(I_tau) I_{psi_i} I_{phi_i}].
    THE COMPUTATION. With K_i equal to I_{psi_i} I_{phi_i},
    conj(J_i) J_j equals conj(conj(I_tau) K_i) (conj(I_tau) K_j)
    equals conj(K_i) conj(conj(I_tau)) conj(I_tau) K_j
    equals conj(K_i) (I_tau conj(I_tau)) K_j
    equals conj(K_i) (n(I_tau) O_0) K_j
    equals n(I_tau) (conj(K_i) K_j).
    n(I_tau) is a rational integer, so it scales the module without changing its class,
    and [conj(J_i) J_j] equals [conj(K_i) K_j], a class determined by the two
    commitments and the two challenges ALONE.
    WHY THE PROJECTION IS SIMULTANEOUSLY PERFECT AND INFORMATION-FREE. The projection
    takes the two full transcripts plus all signer-internal state to the ideal class
    [conj(J_i) J_j]. It is genuinely lossy - the class functor forgets the
    representative and the fibre over a class is large - and it is compatible with the
    target's own operation in the strongest sense, since ideal multiplication descends
    to the class groupoid. That compatibility is exactly why the cancellation goes
    through and exactly why the projection is useless for key recovery. Checked for the
    change-of-coordinates failure - negative. Checked for the MIRROR failure, a
    projection constant across instances - POSITIVE with respect to the secret and
    NEGATIVE with respect to the simulator. Zero spread in the secret direction means
    zero key information; nonzero spread between the honest and simulated worlds means
    a distinguisher. A projection can be both, and this is a worked instance.
    WHERE THE INFORMATION MUST BE - the forward guidance the closure standard requires.
    The cancellation happened because conj(I_tau) appears with net multiplicity zero.
    Any functional with NONZERO net I_tau multiplicity can retain information. Three
    named survivors - (S1) single-transcript functionals of the emitted REPRESENTATIVE
    J_i, its norm form, its reduced basis, the 2-adic shape of its generator, which is
    where the ideal-to-isogeny conversion's output distribution lives; (S2) triple
    products conj(J_i) J_j conj(J_k) and higher ODD combinations, where one conj(I_tau)
    survives; (S3) functionals coupling a response to the PUBLIC KEY's own structure,
    e.g. the pair (E_A, E_{2,i}) rather than (E_{2,i}, E_{2,j}). Each is stated so a
    later agent can attack it; none is claimed to work.

  assumptions:
  - >-
    That the response ideal satisfies [J_i] equal to [conj(I_tau) K_i]. IF THE ROUND-3
    DESIGN BUILDS THE RESPONSE DIFFERENTLY - and a higher-dimensional redesign is
    RELAYED, NOT READ, as sampling the response from a more natural distribution - the
    relation may differ and the cancellation must be RE-DERIVED against the actual
    construction. The derivation's SHAPE survives any construction in which the response
    connects the public key to a curve reached from E_0, because that is all the
    cancellation uses; the details do not.
  - >-
    That [J_i] equal to [conj(I_tau) K_i] is equality of CLASSES in the relevant
    groupoid rather than of specific ideals. The record is written in classes throughout
    and never treats a class statement as a representative statement.
  - >-
    That left ideal classes form a GROUPOID, not a group. They do, and this is the
    standard objection to sloppy quaternion-class reasoning. The derivation above is
    groupoid-safe - every product written has matching orders and no commutativity is
    used anywhere - and checking that is the independent re-derivation's explicit job.

  proof_search_map:
    not_applicable_reason: null
    bottleneck: >-
      Whether the recalled protocol shape is the real one. The algebra is four lines
      and uses only I conj(I) equal to n(I) O and conj(AB) equal to conj(B) conj(A);
      the likeliest failure is not that it is wrong but that it is aimed at the wrong
      construction. That is why Stage 0 is a re-derivation and Stage 1 is a reading
      gate, and why the toy measurement is designed to test the identity AS APPLIED
      rather than the algebra in the abstract.
    baseline_embedding:
      parameter_slice: >-
        Setting the net I_tau multiplicity to zero recovers the cancellation; setting it
        to nonzero recovers the ordinary situation in which a functional can depend on
        the secret. The multiplicity is therefore the single parameter of the frame, and
        the graded control below sweeps it explicitly rather than arguing about it.
      reproduction_check: >-
        FROZEN REGRESSION FIXTURE - a DELIBERATELY BROKEN variant in which the response
        is built as conj(I_tau) K_i but the pair statistic is formed as [J_i J_j]
        instead of [conj(J_i) J_j]. There the I_tau multiplicities ADD rather than
        subtract, so the secret does NOT cancel and the measured number of distinct
        classes MUST exceed 1 and should be about R. This is computed and frozen before
        the main arm is read.
    observation_collision:
      observable: >-
        The ideal class [conj(J_i) J_j] of the connecting module between two response
        codomains, canonicalised by a stated, SECRET-INDEPENDENT rule.
      distinct_preimage_search: >-
        Search over R independent secrets at frozen commitments and challenges for two
        secrets giving DIFFERENT canonical class representatives. The derivation says
        there are none; a single one refutes it. Search also, across the graded family
        m equal to 2 to 6, for a multiplicity pattern other than the predicted
        1, R, 1, R, 1 - which would localise exactly which multiplicity bookkeeping is
        wrong. Both searches are EXECUTED, not argued.
    constructive_transforms:
    - transform: observable_fiber
      proposed_object: >-
        The split between the ideal CLASS, which is provably secret-blind, and the
        CHOICE OF REPRESENTATIVE within it, which is what the ideal-to-isogeny
        conversion emits and where any surviving secret information must live.
      predicted_gain: >-
        NO COST GAIN. The gain is evidentiary and negative - it removes an entire family
        of candidate transcript statistics from consideration before any is budgeted,
        and it names S1, S2, S3 as where a later agent should look instead.
    quantifier_order: >-
      FOR ALL I_tau, FOR ALL K_i and K_j with matching orders,
      [conj(J_i) J_j] equals [conj(K_i) K_j]. The quantification over I_tau is the
      content - the class is fixed once the commitments and challenges are fixed, and
      the secret is quantified over freely INSIDE that. Reversing the order, fixing the
      secret first and then quantifying over commitments, would say nothing. The
      distinguisher statement C2 has a different order - THERE EXISTS a parameter regime,
      namely (D_psi D_phi)^2 less than p, in which FOR ALL honest pairs the connecting
      degree is bounded while FOR TYPICAL simulated pairs it is not.
    method_ceiling:
      strongest_certifiable_claim: >-
        An identity in a quaternion order, re-derivable by a reviewer with pen and paper
        in minutes, plus a toy-scale measurement confirming it AS APPLIED to a
        SQIsign-shaped construction at a toy prime with its positive control and graded
        control firing. It CANNOT certify anything about any deployed scheme, cannot say
        anything about the single-transcript functionals S1 where the interesting risk
        is, cannot establish unforgeability or its absence, and cannot be cited as a
        statement that SQIsign transcripts are safe.
      nearby_object_control: >-
        The nearby object on which the desired conclusion FAILS is the m-fold ODD
        alternating product, where the net I_tau multiplicity is 1 rather than 0 and the
        distinct-class count must be about R rather than 1. It is the sharpest control
        available because it differs from the main arm only in the multiplicity
        bookkeeping the derivation turns on, and no plausible instrument artifact
        reproduces an alternating 1, R, 1, R, 1 pattern.
    proof_obligations:
    - claim: >-
        I conj(I) equals n(I) O_left(I), conj(AB) equals conj(B) conj(A), and scalars act
        trivially on ideal classes
      responsibility: correctness
    - claim: >-
        Every product in the derivation has matching orders, so no groupoid violation is
        committed and no commutativity is used
      responsibility: correctness
    - claim: >-
        [J_i] equals [conj(I_tau) K_i] holds for the ACTUAL construction, not merely for
        the recalled shape
      responsibility: interface
    - claim: >-
        The honest pair's minimal connecting degree is bounded by (D_psi D_phi)^2 while a
        simulated pair's is generically about p
      responsibility: strictness
    - claim: >-
        The class canonicalisation rule used in any measurement is secret-independent, so
        the measurement cannot leak the secret back in through normalisation
      responsibility: correctness
    - claim: >-
        The hybrid bound SD at most q times delta is an UPPER bound, so C3 is a statement
        about what must be charged absent a better argument, not about what is achievable
      responsibility: scope

  asymptotic_claim:
    problem: >-
      Multi-signature transcript analysis for a SQIsign-shaped protocol. NO IMPROVEMENT
      IS CLAIMED - the field is filled rather than nulled so the ceiling is explicit.
    prior_best: >-
      KN-TECH-057's matched full-cost baselines for the underlying isogeny problems -
      MITM p^{2/3}, Delfs-Galbraith p^{1/3}, van Oorschot-Wiener p^{1/2} and p^{1/4}
      conditional, read in-repo. Not competed with.
    time_exponent: 'NO EXPONENT MOVED. This is not exponent work and does not pretend to be.'
    memory_exponent: not_applicable
    hidden_cofactor: >-
      For C3 - the factor q in the hybrid, which raises the required per-transcript
      statistical distance from 2^-lambda to 2^-(lambda + log2 q). That is the whole
      content of C3 and it is a cofactor in a security parameter, not in a running time.
    claim_kind: constant_factor

  heuristic_assumptions:
  - id: HEUR-SC-1
    formal_statement: >-
      NONE LOAD-BEARING FOR THE CANCELLATION. It is an identity in a quaternion order -
      FOR ALL I_tau, FOR ALL K_i, K_j with matching orders,
      [conj(J_i) J_j] equals [conj(K_i) K_j] - and is proved, not assumed. This entry
      exists to record that the headline is UNCONDITIONAL and that the only assumption
      in the vicinity is EVIDENTIARY - that the recalled protocol shape is the real one.
    random_model_justification: >-
      Not applicable; no distribution is imitated. The identity holds pointwise.
    supporting_results:
    - >-
      I conj(I) equals n(I) O_left(I); scalars act trivially on classes;
      conj(AB) equals conj(B) conj(A). All elementary, all RECALLED and all
      re-derivable; their re-derivation is a declared proof obligation rather than an
      appeal to a citation. No theorem number, page, author or venue is asserted
      anywhere in this record.
    validation_experiment_ids:
    - EXP-SQISIGN-8be511
    falsification_condition: >-
      The toy measurement returns more than one distinct pair class across secrets at
      frozen commitments, while the positive control fires. The identity is false AS
      APPLIED and the whole record collapses - the cheapest and most decisive falsifier
      available.
  - id: HEUR-SC-2
    formal_statement: >-
      The q-query hybrid is the correct accounting for the scheme's stated security
      model - i.e. the model charges signing queries and the zero-knowledge statement is
      per-transcript rather than per-transcript-set.
    random_model_justification: >-
      The hybrid inequality itself is rigorous. What is assumed is WHICH STATEMENT the
      specification makes, which is a fact about a document and is settled by reading it,
      not by argument.
    supporting_results: []
    validation_experiment_ids:
    - EXP-SQISIGN-8be511
    falsification_condition: >-
      The specification's zero-knowledge statement, quoted verbatim, turns out to be
      per-transcript-set rather than per-transcript, or its parameter derivation already
      compares against 2^-(lambda + log2 q). The accounting half is then void as an
      external observation and becomes an internal correction to THIS program's own
      comparison threshold - which is worth exactly as much and is stated in advance so
      the less flattering outcome cannot be quietly dropped.

  structural_ingredients:
  - description: >-
      The Deuring dictionary - isogeny to left ideal, composition to product, dual to
      conjugate, degree to reduced norm - and the identity I conj(I) equals n(I) O.
    citation: null
    provenance: recalled
    verified_by: >-
      RECALLED, UNVERIFIED but re-derivable, and its re-derivation is a declared proof
      obligation discharged by the Stage 0 independent re-derivation. A recalled
      ingredient is a pointer for the reviewer, not support.
    role: the entire algebraic content of the cancellation
  - description: >-
      Matched full-cost baselines for the underlying supersingular isogeny problems.
    citation: KN-TECH-057
    provenance: internal
    verified_by: In-repo technique entry, read directly.
    role: the frontier this record does not compete with; cited to justify dominated_by
  - description: >-
      A reported result that SQIsign is not SUF-CMA with concrete malleability in the
      v2.0 specification.
    citation: null
    provenance: recalled
    verified_by: >-
      RELAYED, NOT READ, and NOT USED. It is listed only because a malleability result
      is also a statement that two related transcripts exist, which is adjacent to this
      record's object, and a later agent should check whether it interacts with the
      cancellation. No claim about it is made here.
    role: adjacency note only

  reduction_chain:
    core_problem: null
    corollaries: []

  predictions:
  - metric: >-
      secret_dependence_of_the_pair_class - the number of distinct canonical values of
      [conj(J_i) J_j] observed at a toy parameter set as the SECRET I_tau is varied over
      R independent keys with commitments and challenges held fixed by seed
    direction: lower
    minimum_effect: >-
      EXACTLY 1, derived before any run. More than one means the derivation is WRONG and
      must be withdrawn as a superseding record. This is the derived null that can
      actually fail.
  - metric: >-
      graded multiplicity pattern - the distinct-class count for the m-fold alternating
      product with m equal to 2, 3, 4, 5, 6
    direction: different
    minimum_effect: >-
      The pattern 1, R, 1, R, 1, since the net I_tau multiplicity is 0 for even m and 1
      for odd m. No plausible instrument artifact reproduces an alternating pattern, and
      its failure localises exactly which multiplicity bookkeeping is wrong.
  - metric: >-
      pair_separation - the minimal connecting degree between two response codomains,
      honest arm against simulated arm, at a toy parameter set
    direction: different
    minimum_effect: >-
      Honest arm bounded by (D_psi D_phi)^2; simulated arm generically about p. The
      PRE-RUN DISCRIMINATOR is the inequality (D_psi D_phi)^2 less than p read off the
      specification's parameters. If it holds, the deliverable is a proven-key-blind
      distinguisher; if it fails, the family is closed for distinguishing too and that
      closure carries its named obstruction and forward guidance.
  - metric: >-
      hybrid_threshold_check - whether the specification's own zero-knowledge parameter
      derivation compares its statistical distance against 2^-lambda or against
      2^-(lambda + log2 q)
    direction: different
    minimum_effect: >-
      A BINARY ANSWER read from the document. Either outcome is a deliverable and both
      are stated in advance.

  test_boundary:
    instances:
    - >-
      A SQIsign-SHAPED construction at a TOY prime, with R independent secrets, frozen
      commitments and challenges, and quaternion ideal arithmetic implemented from
      scratch. The container is recorded in the parent proposal as having no Sage, no
      PARI and no sympy, so the arithmetic is written from the definitions.
    - >-
      The deliberately broken positive control - the same construction with the pair
      statistic formed as [J_i J_j] instead of [conj(J_i) J_j].
    - >-
      The graded control - m-fold alternating products for m equal to 2, 3, 4, 5, 6.
    parameters:
      toy_prime: 'fixed at Stage 0 and recorded'
      R: 'number of independent secrets, fixed at Stage 0, at least 8'
      graded_m: '2, 3, 4, 5, 6'
      canonicalisation: 'a stated, SECRET-INDEPENDENT rule for choosing a class representative, recorded before any measurement'
    implementation: >-
      Quaternion ideal arithmetic with canonical class representatives, written from
      the definitions in this container. The Stage 0 re-derivation is pen and paper by an
      INDEPENDENT reviewer.
    budget:
      wall_clock_seconds_per_run: 1800
      total_cpu_hours: 1.0
      maximum_memory_gb: 8

  distinguishable_outcomes:
  - outcome: >-
      The independent Stage 0 re-derivation confirms the cancellation with every order
      match checked, the toy measurement returns EXACTLY 1 distinct pair class over R
      secrets, the positive control returns about R, and the graded family returns
      1, R, 1, R, 1.
    means: >-
      C1 holds as applied. An entire family of multi-signature transcript statistics -
      every function of the pair of response codomains alone - is removed from
      consideration by an IDENTITY rather than by a screening count, at essentially zero
      compute, with forward guidance naming S1, S2, S3 as where the information must be
      instead. THIS IS A NEGATIVE RESULT ABOUT A FAMILY OF ATTACKS and must never be
      cited as a claim that SQIsign transcripts are safe.
  - outcome: >-
      The toy measurement returns MORE THAN ONE distinct pair class across secrets while
      the positive control fires correctly.
    means: >-
      C1 is FALSE as applied. The identity does not hold for the construction as built -
      most likely because the recalled protocol shape is wrong, or because the
      canonicalisation leaked the secret back in. The record collapses and must be
      withdrawn by a superseding record. This is the cheapest and most decisive falsifier
      available and it is the reason the toy arm exists at all.
  - outcome: >-
      The independent re-derivation finds a step where orders do not match, or where a
      class statement was used as a representative statement.
    means: >-
      The cancellation is WITHDRAWN at zero compute. Per unit spend this is the most
      valuable possible outcome, and the groupoid structure is a real trap, which is why
      the re-derivation's explicit job is checking every order match.
  - outcome: >-
      The positive control returns 1 distinct class as well.
    means: >-
      The instrument is measuring NOTHING - it would report cancellation for a statistic
      in which the secret provably does not cancel. No conclusion may be drawn from any
      arm.
  - outcome: >-
      The graded family returns a pattern other than 1, R, 1, R, 1 while the main arm and
      the positive control both behave.
    means: >-
      The multiplicity bookkeeping is wrong somewhere, and the position of the first
      deviating m localises where. The cancellation may still hold at m equal to 2 while
      the general multiplicity argument does not, and those are different claims.
  - outcome: >-
      The specification cannot be obtained, so the (D_psi D_phi)^2 against p comparison
      and the threshold check cannot be made.
    means: >-
      C2's pre-run discriminator and C3's binary answer are BLOCKED. C1 stands or falls
      on its own arms, and the blockage is recorded as the state of the question rather
      than filled with an assumed parameter set. This is the expected outcome given
      RQ-SQISIGN-001's recorded provenance.
  - outcome: >-
      The specification is obtained and already charges the q factor.
    means: >-
      C3 is void as an external observation and becomes an internal correction to THIS
      program's own comparison threshold - future records must compare against
      2^-(lambda + log2 q). Stated in advance so the less flattering outcome cannot be
      quietly dropped; the parent proposal's own prior is 0.6 for it.

  falsification_conditions:
  - >-
    An independent re-derivation finds a step where orders do not match or where a class
    statement was used as a representative statement. The cancellation is withdrawn.
  - >-
    The toy measurement returns more than one distinct pair class across secrets at fixed
    commitments, with the positive control firing. The identity is false as applied and
    the proposal collapses.
  - >-
    The positive control does not fire - it returns 1 distinct class. Nothing may be
    concluded from any arm.
  - >-
    The graded family returns a pattern other than 1, R, 1, R, 1. The multiplicity
    bookkeeping is wrong and the first deviating m localises where.
  - >-
    The Round-3 or actual response is not built from a path through E_0, so
    [J_i] equal to [conj(I_tau) K_i] does not hold. The derivation must be redone against
    the actual construction - the shape survives, the details do not.
  - >-
    The specification already charges the q factor. C3's accounting half is void as an
    external observation.
  - >-
    The pre-run discriminator (D_psi D_phi)^2 less than p FAILS at the real parameters.
    The family is closed for distinguishing too, and that closure carries its named
    obstruction and its forward guidance.

