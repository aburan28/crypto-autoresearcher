  interpretation_limits:
  - >-
    CLAIM TIER - theory for the derivation, toy for any measurement. No
    cryptographic-scale statement is licensed by either.
  - >-
    This is a NEGATIVE RESULT ABOUT A FAMILY OF ATTACKS, delivered at the closure
    standard - obstruction, the exact cancellation; argument, the four-line computation;
    forward guidance, S1, S2, S3. It is NOT a claim that SQIsign transcripts are safe and
    IT MUST NEVER BE CITED AS ONE.
  - >-
    PROVABLY NO KEY INFORMATION IS SCOPED TO THIS FUNCTIONAL FAMILY. It says nothing
    about the single-transcript functionals S1, which is where the interesting risk is. A
    write-up blurring the two would be exactly the premature closure the inventor
    protocol forbids.
  - >-
    A key-blind distinguisher, if the pair-separation inequality holds, is a statement
    about the ZERO-KNOWLEDGE ARGUMENT only, never about unforgeability.
  - >-
    THE HYBRID BOUND IS AN UPPER BOUND. q times delta is tight in the worst case but a
    specific scheme may do better; C3 is about what must be CHARGED absent a better
    argument, not about what is achievable.
  - >-
    The protocol shape is RECALLED, UNVERIFIED. No SQIsign specification of any version
    has been read by this program, and every protocol-level statement here is a candidate
    to check rather than an established fact.
  - >-
    This record costs NO hard problem and enters neither GOAL-SSI-001's endomorphism-ring
    lane nor GOAL-SQISIGN-002's published-data-surface lane.
