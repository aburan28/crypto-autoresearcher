# =============================================================================
# H-BINSTD-490c76 -- Descent-lattice dichotomy for five composite-degree ANSI
# c2pnb curves: c|16 STRUCTURALLY EMPTY (C1) + Artin-Schreier m pin (C2) +
# memory-charged cost table (C3). Specified from IDEA-20260922-d11575 under
# RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001. Approved DEC-20261002-3f6252.
#
# ZERO RUNS in this design packet. Representation / certificate + toy control
# + cost-model table instrument. NO break. NO deployed attack. No AUXIN.
# No Bedrock. Unlocks the GHS cover half of the RQ-BINSTD reachability table.
# =============================================================================
hypothesis:
  id: H-BINSTD-490c76
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-d11575
  experiment_id: EXP-BINSTD-ee23dc
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-3f6252
  status: approved
  proposed_by: coordinator
  title: >-
    Descent-lattice dichotomy on five c2pnb rows: every GHS base field with
    c|16 is STRUCTURALLY EMPTY by subfield-trace collapse; the four live
    lanes c∈{k,2k,4k,8k} have Artin-Schreier level m pinned into [n/2+1,n];
    the 5×10 table is decided by four F_{2^16} level computations per curve

  statement: >-
    CLAIM (certificate + toy observational + cost-model table). Let E be any
    of c2pnb176v1, c2pnb208w1, c2pnb272w1, c2pnb304w1, c2pnb368w1, so
    (analysis/binstd-curve-audit/) A,B∈F_{2^16}, the smallest subfield
    containing B is F_{2^16} exactly, N=16k with k∈{11,13,17,19,23} prime,
    cofactor h=#E(F_{2^16}), and prime-subgroup order ℓ has 161/193/257/289/353
    bits. Divisors of N are exactly
    {1,2,4,8,16,k,2k,4k,8k,16k}. (C1) For every base field F_{2^c} with
    c|16, the conorm-norm image of the prime-order subgroup is the identity
    (STRUCTURALLY EMPTY with elementary certificate: Frobenius orbit collapse
    + subfield-trace Tr_{F_{2^{16k}}/F_{2^16}} annihilates the prime
    subgroup). (C2) For live lanes c∈{k,2k,4k,8k} the conjugate period equals
    n=16/(c/k), there is no collapse, and the Artin-Schreier level m of
    β=B^{1/2} under α↦α^{2^{c mod 16}} satisfies n/2+1 ≤ m ≤ n (pinned by
    the audited bit that B∉F_{2^8}). (C3) Under the generic outcome m=n the
    only lane whose GTTD time exponent nominally undercuts matched rho is
    c=4k (g=8), and under van Oorschot–Wiener memory accounting the
    preregistered verdict is WASH OR WORSE on every row — written before any
    census output. CLAIM TIER: certificate (C1/C2) + toy observational control
    of the collapse consequence + cost-model table (C3). NO break. NO
    transfer of toy relation rates to deployed N≥176 as an attack claim.

  mechanism: >-
    OBJECT FRAME. Tracked object: class of the conorm of P∈Jac(C)(F_q) modulo
    the degree-one place factor base of the GHS cover C of E over F_q=F_{2^c}.
    Representation: R1 affine (x,y)∈F_{2^{16k}}, pushed to a reduced divisor
    on C. Operation set Sigma: translation by degree-one places of C
    (PARTIAL-ACTION Class I; not full E-translation, so IDEA-20260806-c5d183
    rigidity does not close it). Lossy projection π = conorm-norm mod
    ⟨factor base⟩; for c|16 the projection is LOSSLESS-TO-ZERO on the prime
    subgroup (C1), which is the inventor-protocol lossy-projection test
    returning a NEGATIVE. Declared component: F2 of IDEA-20260802-002 with
    the factor base on a COVER curve rather than on E. Priced open number:
    Artin-Schreier level m of β=B^{1/2} inside F_{2^16} (four integers per
    curve decide the live half of the table). OFF-LIMITS: Magma/Sage as
    success path; AUXIN; deployed attacks; Amazon Bedrock; Semaev PDP races.
    WHAT IS NEW TO THIS PROGRAM: collapse certificate for every c|16 cell at
    once; pinning of m from one audited bit; memory-charged per-curve table.

  assumptions:
    - Five curves' parameters match analysis/binstd-curve-audit/; Stage 0
      re-derives A,B from primary ANSI X9.62 when reachable, else discloses
      OpenSSL secondary provenance.
    - k odd prime in every row ⇒ divisor lattice of N=16k is the ten-element set.
    - ℓ prime and ℓ>h ⇒ gcd(ℓ,h)=1 ⇒ λ≠1 in (C1).
    - GHS genus is 2^{m-1} or 2^{m-1}-1; re-derivation obligation in Stage 0/1,
      not a retained assumption.
    - Matched rho uses 0.886√ℓ/√(2k) with ℓ≈2^{s-0.5}; convention stated per cell.
    - ARITHMETIC ONLY on deployed rows; executable attack arm is toy dk≤41 only.
    - >-
      GTTD exponent 2-2/g and Enge–Gaudry large-genus law are recalled
      (provenance recalled) until a primary source is opened; margins <2^16
      labelled WASH.

  proof_search_map:
    bottleneck: >-
      Genus of the GHS cover over each admissible base field — four integers
      m per curve decide which index-calculus regime applies and what it costs.
    baseline_embedding:
      parameter_slice: >-
        c=16 (base F_{2^16}, n=k): conjugate period 1, m=1, g=1, construction
        returns E over F_{2^16} itself — must reproduce recorded Koblitz-like
        m=1 / GHS-resistant behaviour with F_2 replaced by F_{2^16}.
      reproduction_check: >-
        (i) Binary Koblitz control: level routine returns m=1 for every base
        field. (ii) Synthetic curve with B∈F_{2^8}: routine returns m≤n/2.
        Failure of either voids all other cells.
    observation_collision:
      observable: 'integer m per (curve, base field) and derived (g, rho ratio)'
      distinct_preimage_search: >-
        Separate (i) m small because curve is defined over a subfield
        (collapse, C1 — USELESS, image zero) from (ii) m small because B sits
        low in a live lane with no collapse (DANGEROUS). Census MUST report
        conjugate period 16/gcd(c,16) alongside m in every cell. A cell with
        period n but m<n/2+1 contradicts (C2).
    constructive_transforms:
      - transform: base_field_enumeration
        proposed_object: Degree-one places of the GHS cover over F_{2^c}, one object per divisor c of N
        predicted_gain: >-
          Relation collection moves from elliptic decomposition to polynomial
          factorisation over F_{2^c} at genus 2^{m-1}; five c|16 cells close
          with certificates rather than costs.
      - transform: lossy_projection_negative
        proposed_object: Conorm-norm image for c|16
        predicted_gain: >-
          NONE — deliverable is the zero image certificate closing half the lattice.
    quantifier_order: >-
      FORALL five curves AND FORALL ten divisors c of N=16k, THERE EXISTS a
      certified cell verdict in {STRUCTURALLY EMPTY with certificate, DEFINED
      WITH A COMPUTED COST, OPEN with missing quantity named}. Witness that
      breaks (C1): EXISTS curve and c|16 with conorm-norm image of an ℓ-order
      point non-zero — checkable on toy cells.
    method_ceiling:
      strongest_certifiable_claim: >-
        A 5×10 table of (conjugate period, m, g, transfer-existence, regime,
        charged time exponent, charged FB memory, matched rho, ratio) derived
        from published parameters, plus collapse certificates for c|16 cells.
        NO statement that any curve is broken or safe beyond a cost with
        disclosed uncertainty.
      nearby_object_control: >-
        (i) Prime-degree ANSI / FIPS binary controls: lattice collapses to
        {1,N}; small genus is a bug. (ii) Synthetic uniform-B over F_{2^176}:
        m=n in every live lane w.h.p. (iii) Binary Koblitz: m=1 everywhere.
    proof_obligations:
      - claim: >-
          Hess (KN-LIT-6987) conorm-norm theorem hypotheses exclude the
          collapsed case c|16; if unconditional, (C1) is false.
        responsibility: correctness
      - claim: Galois-sum grouping by residue mod 16/c is valid.
        responsibility: correctness
      - claim: GHS genus formula re-derived (not only summariser-relayed).
        responsibility: correctness
      - claim: Transfer-existence g·c ≥ log2 ℓ is necessary, not sufficient.
        responsibility: scope
      - claim: Census compared to MMT tables when body text is obtainable.
        responsibility: scope
      - claim: Koblitz and c=16 baseline embeddings return m=1.
        responsibility: baseline
    not_applicable_reason: null

  asymptotic_claim:
    problem: >-
      ECDLP in the prime-order subgroup of E(F_{2^{16k}}) for E/F_{2^16},
      k odd prime, at the five deployed ANSI composite-degree rows
    prior_best: >-
      Pollard rho with negation and Frobenius classes, 0.886√ℓ/√(2k)
    time_exponent: >-
      Under generic m=n, best live lane c=4k gives q^{2-2/g}=2^{7k} → ℓ^{7/16}
      (recalled GTTD; constant uncharged) against ℓ^{1/2}; disclosed as known
      composite-degree phenomenon, not a new exponent claim for this program
    memory_exponent: >-
      q^{1-1/g}=2^{3.5k} (ℓ^{7/32}) shared random-access FB against rho ℓ^0
    hidden_cofactor: >-
      GTTD constant ~g!=2^{15.3} at g=8 consumes the entire 2^{0.9} margin on
      c2pnb176v1; Enge–Gaudry o(1) used only to show n=8/16 lanes hopeless
    claim_kind: >-
      exponent_on_a_known_mechanism (table instantiation + collapse certificates);
      not claimed as a new asymptotic result

  heuristic_assumptions:
    - id: HEUR-BINSTD-d11575-H0
      formal_statement: >-
        NONE FOR (C1) OR (C2). Collapse and level bounds are unconditional
        finite-field algebra on published constants.
      random_model_justification: >-
        Rigorous: Galois period arithmetic; λ^k=1 and λ≠1 from π_q^k=1 and
        gcd(ℓ,h)=1; free-module structure of F_{2^16} over F_2[u]/(u+1)^n
        (normal basis; IDEA-20260918-9abf42). No random model.
      supporting_results:
        - ref: IDEA-20260918-9abf42
          provenance: internal
          claim: F_{2^n} free of rank one over F_2[σ]; stable subspaces = ker of divisors of x^n−1.
        - ref: analysis/binstd-curve-audit/README.md
          provenance: internal
          claim: A,B∈F_{2^16}; B not in F_{2^8}; h=#E(F_{2^16}); gcd(ℓ,h)=1.
      validation_experiment_ids:
        - EXP-BINSTD-ee23dc
      falsification_condition: >-
        Toy cell with c|d where conorm-norm image of an ℓ'-order point is
        non-trivial; OR live cell with period n but m outside [n/2+1,n]; OR
        Koblitz control returns m≠1.
    - id: HEUR-BINSTD-d11575-H1
      formal_statement: >-
        SMOOTHNESS-AND-YIELD (small-genus). A uniformly random reduced
        divisor of degree g on C/F_q splits into g degree-one places with
        probability 1/g!+O(g^2/q), trials independent enough that collecting
        |F| relations costs |F|·g! trials up to polylog.
      random_model_justification: >-
        Classical: 1/g! density of totally split monic degree-g polynomials
        over F_q (Panario–Gourdon–Flajolet / Dickman analogue). Heuristic
        half: GHS cover divisors obey the same density and trials multiply.
      supporting_results: []
      validation_experiment_ids:
        - EXP-BINSTD-ee23dc
      falsification_condition: >-
        On Stage-2 toy covers with explicit C, empirical split density of
        ≥2^{20} samples disagrees with 1/g! beyond disclosed sampling error
        AND the disagreement survives the uniform-polynomial control.
    - id: HEUR-BINSTD-d11575-H2
      formal_statement: >-
        COMPLEXITY-CONSTANT. Reported GTTD exponent 2−2/g taken as the time
        law with constant ≤ g!·polylog(q), applied uniformly so no row is
        flattered; margins <2^{16} labelled WASH.
      random_model_justification: >-
        None obtained here. Exponent is recalled; constant is a convention.
      supporting_results: []
      validation_experiment_ids:
        - EXP-BINSTD-ee23dc
      falsification_condition: >-
        Toy fit of F_q-ops to collect |F| relations at g∈{2,3,4} yields a
        constant ≫ g!·polylog that would reverse a claimed non-wash margin;
        then escalate, do not absorb.

  structural_ingredients:
    - description: Pre-computed BINSTD curve audit (subfield membership + Weil recursion).
      citation: analysis/binstd-curve-audit/README.md
      provenance: internal
      verified_by: coordinator (design session 2026-10-02; README cited via idea)
      role: parameter/provenance substrate
    - description: Normal-basis free-module / Frobenius-stable subspace lattice.
      citation: IDEA-20260918-9abf42
      provenance: internal
      verified_by: coordinator (cited via IDEA-20260922-d11575)
      role: lattice underlying (C2)
    - description: Frobenius / subfield IC accounting boundary (decomposition lane).
      citation: IDEA-20260906-6da433
      provenance: internal
      verified_by: coordinator (cited via IDEA-20260922-d11575)
      role: boundary — that record owns Gaudry/JV; this owns the cover lane
    - description: >-
        Maurer–Menezes–Teske GHS analysis of the exact five ANSI composite-
        degree curves (abstract retrieved; body not read in ideation).
      citation: 'M. Maurer, A. Menezes, E. Teske, eprint 2001/084; LMS JCM 5 (2002) 127-174'
      provenance: retrieved
      verified_by: idea-generator (abstract only; body not rendered)
      role: dominating prior art; Stage-1/3 must diff when body obtainable
    - description: RQ-BINSTD reachability-table decision target.
      citation: ledger/questions/RQ-BINSTD-b6f698.yaml
      provenance: internal
      verified_by: coordinator (design session 2026-10-02)
      role: decision target / population

  reduction_chain:
    core_problem: >-
      Certified 5×10 GHS-applicability / cost table for the five composite-
      degree ANSI rows, with collapse certificates on c|16.
    corollaries:
      - problem: >-
          Reachability-table GHS-cover column for RQ-BINSTD-b6f698 half of the
          composite-degree population.
        reduction_ref: IDEA-20260922-d11575 first_deliverable
        asymptotics_preserved: >-
          n/a for certificates; C3 exponent comparison is recalled-constant
          and labelled WASH when margin <2^16.

  predictions:
    - metric: structurally_empty_c_dividing_16_cell_count
      direction: exact
      minimum_effect: '25 of 50 cells (five per row, c∈{1,2,4,8,16}) with collapse certificate'
    - metric: artin_schreier_level_m_bounds
      direction: bounded
      minimum_effect: >-
        n/2+1 ≤ m ≤ n in all twenty live cells; m=2 at n=2; m∈{3,4} at n=4;
        m∈[5,8] at n=8; m∈[9,16] at n=16
    - metric: toy_conorm_norm_image_order_on_l_part
      direction: exact
      minimum_effect: 'exactly 1 (identity) for every toy c|d cell on odd-k analogues'
    - metric: minimum_log2_time_minus_log2_matched_rho_generic_m_n
      direction: lower
      minimum_effect: >-
        Under generic m=n, between −12.3 and −0.9 bits in the c=4k lane
        (time-only, GTTD constant uncharged); VOW-charged prediction = WASH
        or worse on every row
    - metric: factor_base_memory_entries_minimising_lane
      direction: higher
      minimum_effect: '≥2^38 on c2pnb176v1 and ≥2^80 on c2pnb368w1'
    - metric: koblitz_and_c16_baseline_m
      direction: exact
      minimum_effect: 'm=1 on every Koblitz control lane and every c=16 deployed cell'

  test_boundary:
    instances:
      - deployed_census_arm: 'c2pnb{176v1,208w1,272w1,304w1,368w1} × ten divisors of N'
      - toy_collapse_arm: 'subfield cells (d,k′)∈{(4,5),(4,7),(8,5),(2,11)} with d·k′≤41'
      - positive_control_c1: 'toy cell with k′ EVEN (collapse arithmetic changes; image NON-trivial expected)'
      - null_prime_degree: 'c2tnb191v1 / c2tnb239v1 matched rows — lattice {1,N}'
      - null_uniform_B: 'synthetic F_{2^176} curve with B uniform in F_{2^176}'
      - null_koblitz: 'binary Koblitz curve — m=1 every lane'
      - baseline_embedding: 'c=16 on real rows — m=1, g=1'
    parameters:
      q_subfield: 65536
      k_values: [11, 13, 17, 19, 23]
      live_lanes: [k, 2k, 4k, 8k]
      empty_lanes: [1, 2, 4, 8, 16]
      toy_dk_max: 41
      wash_margin_bits: 16
      stdlib_preferred: true
    implementation: >-
      experiments/EXP-BINSTD-ee23dc/implementation/ (stdlib + reuse of
      analysis/binstd-curve-audit/ arithmetic patterns; may cite typed/gf2n.py
      patterns; no Magma/Sage/cypari2 as the success path).
    budget:
      maximum_runs: 20
      total_cpu_hours_advisory: 4
      wall_clock_seconds_advisory: 14400

  falsification_conditions:
    - Toy cell with c|d where conorm-norm image of an ℓ'-order point is non-trivial → (C1) dead.
    - Live cell with conjugate period n but m outside [n/2+1,n] → (C2) dead.
    - Re-derived GHS genus is not 2^{m-1} or 2^{m-1}-1 (or m not level of B^{1/2}) → every genus void.
    - Hess conorm-norm theorem unconditional → (C1) false.
    - Koblitz control returns m≠1 → level routine wrong; no cell readable.
    - MMT published m values disagree with census → census wrong until reconciled.
    - Claiming break / exponent / deployed attack from this contract.

  interpretation_limits:
    - >-
      STRUCTURALLY EMPTY / DEFINED-WITH-COST are reachability-table verdicts
      with named facts; they are not security claims that a curve is broken
      or safe.
    - >-
      Toy Stage-2 confirms collapse consequence at dk≤41; extrapolation to
      c2pnb176v1 is 135 bits of field and 6 units of k — stated per row, not
      absorbed.
    - >-
      C3 margins under 2^16 are WASH under disclosed GTTD constant; a
      time-only table that looks faster is not a VOW win.
    - >-
      Cover attacks outside GHS/Hess Artin–Schreier family are untouched.
    - >-
      Timeouts/crashes/budget aborts are failed_infrastructure (AGENTS.md
      rule 5), never refutation of (C1)/(C2)/(C3).
    - >-
      MMT body unavailable → O-PROVENANCE / open prior-art-diff gate; not math
      falsification of the census arithmetic.

  distinguishable_outcomes:
    - id: O-CENSUS-TABLE
      meaning: >-
        25 STRUCTURALLY EMPTY c|16 cells certified; 20 live cells with
        (period,m,g,cost) filled; Koblitz/c=16 baselines m=1; Stage-2 collapse
        checks pass; VOW-charged verdict WASH-or-worse under generic m=n →
        GHS-cover column of reachability table filled.
    - id: O-LOW-M-MOVE
      meaning: >-
        Census returns m < n in a live lane that moves a deployed row under
        charged accounting (e.g. m=3 at n=4 or m=5 at n=8 on c2pnb176v1) —
        escalate; do not absorb into WASH without Coordinator review.
    - id: O-REFUTE-C1
      meaning: Non-trivial conorm-norm image on a c|d toy (or Hess unconditional).
    - id: O-REFUTE-C2
      meaning: Live cell with period n but m outside [n/2+1,n].
    - id: O-INSTRUMENT
      meaning: >-
        Koblitz or c=16 baseline fails m=1; or EVEN-k′ positive control fails
        to show non-trivial image; (C1)/(C2) unread.
    - id: O-PROVENANCE
      meaning: >-
        Primary vs secondary parameter disagree, or MMT body unavailable /
        table disagreement pending reconciliation; halt with both values;
        not math evidence against (C1)/(C2).
    - id: O-IMPEDIMENT
      meaning: Budget/infra stop with measured quantity; never negative math evidence.

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
