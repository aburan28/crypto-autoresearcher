        THAT entry's, read by that agent, and not the two proposal records it
        summarises - which were NOT opened by anyone and are cited as
        pointers below.
      role: >-
        supplies the open cell this record populates and the form of the
        Bezout bound the base is checked against
    - description: >-
        A Bezout bound limiting a factor base cut out by a degree-d plane
        predicate to three times d, composed with an arity threshold.
      citation: IDEA-20260801-021 and IDEA-20260803-e2f5bd
      provenance: recalled
      verified_by: null
      role: >-
