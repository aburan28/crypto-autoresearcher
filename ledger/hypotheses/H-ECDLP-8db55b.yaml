  design_note: >-
    DESIGN ONLY. The factor-base construction, the size law, the membership
    device and the two-explanation split are the idea-generator's. The
    Coordinator's own contributions are three. (1) A PLANTED-STRUCTURE ARM at
    three known densities, because the source's control set is all nulls plus
    one calibration and therefore shows the pipeline can distinguish
    "nothing" from a known-answer histogram but never that it can resolve a
    departure of the size it intends to rule out. (2) A CURVE-CONTENT AUDIT
    with a pre-declared consequence, which here yields an unusually sharp
    result stated in advance: two of the four measured quantities are
    functions of the discrete-log multiset ALONE and therefore carry ZERO
    elliptic-curve content by construction, whatever they measure. (3) A unit
    repair on the solver metric, which the source states as a ratio of
    wall-clock time to a charged operation count - mixed units that cannot be
    a ratio. No status of any record is changed and nothing here is evidence.

  status: proposed
  proposed_by: idea-generator

  statement: >-
    TEST BOUNDARY FIRST. Toy scale, p at most 2^20, exhaustive construction
    and brute-force discrete logarithms. NO ATTACK IS CLAIMED: if this base
    were used in prime-field index calculus its exponent, at the size floor
    and predicted solver behaviour derived below, would be WORSE than Pollard
    rho by about N^{1/2}. The record's value is what it does to an open
    problem's axes, not to any cost.

    THE OBJECT. For E/F_p ordinary with G a prime-order subgroup, and for
    j in F_p outside the two special j-invariants, let E'_j be a fixed
    representative curve with that j-invariant and t(j) its trace of
    Frobenius. Fix an integer t0 with t0^2 < 4p and p not dividing t0. Define
    the CM-TRACE FACTOR BASE F_t0 = the set of P in G whose x-coordinate is a
    j-invariant with t(x(P)) equal to plus or minus t0. The condition is
    twist-invariant by construction, so the choice of representative does not
    matter.

    FIVE STATEMENTS, THE FIRST FOUR STRUCTURAL AND THE FIFTH THE ONE UNDER
    TEST.
    (S1) SIZE. The number of j with trace plus or minus t0 equals the
    Kronecker class number H(4p - t0^2), and each such j is the x-coordinate
    of a point of G with probability about 1/2 and then of exactly two
    points, so |F_t0| = H(4p - t0^2) up to a factor 1 + o(1) under an
    independence heuristic. By the classical ineffective class-number
    estimate this is |D0|^{1/2 + o(1)} for D0 = t0^2 - 4p.
    (S2) TUNABLE SIZE, WITH A FLOOR AT EXPONENT 1/4. Writing t0 as the Hasse
    edge minus s, |D0| is about 4 s sqrt(p), so |F_t0| is
    p^{1/4 + o(1)} times (4s)^{1/2 + o(1)}, and every exponent in [1/4, 1/2]
    is realised. NO single trace condition realises an exponent below 1/4:
    the Hasse interval has length 4 sqrt(p) and the smallest nonempty trace
    class near its edge has class number of order p^{1/4}. The
    index-calculus admissible region below 1/4 is therefore reachable only at
    the edge, or by intersecting with a second cheap predicate, and this
    record says so rather than hiding it.
    (S3) MEMBERSHIP. Deciding membership is ONE point count on the auxiliary
    curve - polylog in log p heuristically, and polynomial rigorously - with
    no class polynomial ever evaluated. This is the same cost class as the
    known cheap-membership bases and is obtained from a completely different
    structure.
    (S4) DESCRIPTION. F_t0 is the preimage under the x-map of the zero set of
    a product of ring class polynomials, of degree equal to |F_t0| up to
    1 + o(1), every root F_p-rational because p is a norm in each relevant
    order. So F_t0 is a CLOSED algebraic factor base that MEETS the standing
    Bezout-type bound rather than evading it, and whose membership polynomial
    splits completely over F_p.
    (S5) THE CONSEQUENCE UNDER TEST. A standing open problem lists "implicit
    membership or source-recovery algorithms" among the reasons a universal
    no-go for algebraically defined factor bases is open. F_t0 shows that
    cell is INHABITED at every size in [p^{1/4}, p^{1/2}] by a closed,
    Bezout-tight set with polylog implicit membership whose structure is
    neither a multiplicative subgroup nor a composed rational map but a class
    group acting on auxiliary j-invariants. THEREFORE a universal no-go
    cannot be proved on the membership-cost axis or on the
    description-degree axis; it must be proved on the SOLVER axis. Which is
    what the experiment measures.
    TWO EXPLANATIONS ARE DISCRIMINATED. E1 (predicted): F_t0 is log-random -
    its exact decomposition yield, its maximal Fourier coefficient along the
    discrete-log coordinate, and its Groebner solve cost all match a
    size-matched random subset within pre-registered bands, so the class-group
    structure of the auxiliary j-values leaves no trace in the group law of
    E. E2: one of those statistics deviates, reproducibly, and not for the
    null - which would be the first coordinate-defined base in this corpus
    with a measurable additive signal in the discrete-log coordinate.

    WHAT IS NOT CLAIMED. No attack, no exponent, no no-go. E1 does not close
    the open problem, only its membership-cost and description-degree
    readings. No status change to any record.

  mechanism: >-
    INGREDIENT-FIRST. Three external ingredients are converted: the count of
    curves with prescribed trace by Kronecker class numbers (the size law);
    point counting as a polylog implicit membership oracle for a set of
    degree p^beta (the membership device); and the complete splitting of ring
    class polynomials at a prime that is a norm (the description). The
    generic conversion is "a predicate on an auxiliary object indexed by a
    coordinate" - the same SHAPE as the known cheap-membership base, with the
    auxiliary object changed from the multiplicative group of the field to
    the moduli of elliptic curves.

    WHY E1 IS PREDICTED, STATED AS A MECHANISM RATHER THAN A HOPE. The set of
    auxiliary j-values underlying F_t0 carries a computable transitive class
    group action. BUT THAT ACTION MOVES AUXILIARY CURVES, NOT POINTS OF E. It
    induces no symmetry of E-relations - unlike Frobenius on an
    extension-field base, which is an endomorphism of the target curve and
    acts on relations directly. So there is no route by which the auxiliary
    CM structure could reach the group law of E, and the predicted outcome is
    that every E-side statistic matches the random null.

    WHERE THE MEASUREMENT ACTUALLY BITES, AND WHERE IT CANNOT. Of the four
    quantities the experiment reports, TWO ARE FUNCTIONS OF THE DISCRETE-LOG
    MULTISET OF THE BASE AND OF NOTHING ELSE: the exact arity-3
    representation count of a target, and the maximal Fourier coefficient
    along the discrete-log coordinate. Both are computed from the multiset of
    logarithms of the base elements; the curve, the x-coordinates and the
    trace condition enter only through WHICH multiset arises. Consequently
    those two arms are CURVE-FREE BY CONSTRUCTION, and no outcome of them -
    E1 or E2 - is a statement about elliptic curves. The one arm that can
    carry curve content is the SOLVER arm, whose input is a membership
    polynomial built from the x-coordinates rather than from the logarithms.
    This is recorded here, before the run, so that E1 cannot afterwards be
    presented as a discovery about CM structure.

  assumptions:
    - >-
      E ordinary, G of prime order, toy curves screened for anomalous and
      smooth order before entering the run set; the two special j-invariants
      excluded from the base, at most four points.
    - >-
      t0 chosen with p not dividing t0 and D0 not a special discriminant
      times a square, so the weights in the count are the generic ones. The
      special discriminants are EXCLUDED, not handled.
    - >-
      Membership is CHARGED at one point count per test. A yield count that
      omits the membership cost is a count, not a cost, and this record
      refuses to report the former as the latter.
    - >-
      Toy scale only: p at most 2^20 for exhaustive construction and
      brute-force logarithms. The size law's o(1) is ineffective, so the
      experiment compares against EXACT class numbers rather than against the
      asymptotic form.
    - >-
      The auxiliary class group action moves auxiliary curves and not points
      of E. This is the mechanism behind the E1 prediction and it is an
      argument, not a measured fact; E2 would refute it.

  proof_search_map:
    bottleneck: >-
      The decomposition SOLVER over F_t0. Size, membership and description
      are settled by the structural statements; the exponent question lives
      entirely at the solver, and that is exactly where the open problem must
      go if a universal no-go is to be proved at all.
    baseline_embedding:
      parameter_slice: >-
        The known cheap-membership base (the multiplicative-subgroup one) at
        equal size, run as an arm at every cell. The record must reproduce
        its committed mean yield, its committed membership cost, and the
        split-quotient exhaustiveness predicted for it. Second slice: the
        Bezout-type bound with degree equal to the membership polynomial's
        degree must be MET, not exceeded.
      reproduction_check: >-
        FROZEN FIXTURE, BLOCKING: at the smallest prime, the FULL TRACE
        HISTOGRAM over every j in F_p, computed by exhaustive point counting,
        must equal the Kronecker class numbers computed independently, TO THE
        POINT. This is the known-answer calibration and it is what makes the
        size law load-bearing at toy scale despite the ineffective o(1).
        Second fixture: the comparison base's size must equal the direct
        count of its defining residues among the x-coordinates of G.
    observation_collision:
      observable: >-
        The membership indicator of F_t0 together with the three statistics
        of the base - yield, maximal Fourier coefficient, solve cost.
      distinct_preimage_search: >-
        EXPECTED AND DESIGNED FOR. Two different traces t0 and t0' with EQUAL
        class number give two different bases of equal size with the same
        predicate cost; E1 predicts their statistics coincide with each other
        and with the random null. THAT COLLISION IS THE NULL OF THIS RECORD.
        The collision that would matter is the opposite one: F_t0 and the
        random null having DIFFERENT statistics at equal size, which is E2.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the size and the membership cost fixed and vary the auxiliary
          structure: random subset, second trace, multiplicative-subgroup
          base, interval base. Any intrinsic invariant separating them in the
          E-side statistics is the finding.
        predicted_gain: "Converts a prose cell of an open problem into four numbers per size."
      - transform: representation_reduction
        proposed_object: >-
          Represent membership as a point count rather than as an evaluation
          of a degree-p^beta polynomial. Encoding exact by complete
          splitting; completeness and soundness exact; cost polylog per test
          and CHARGED.
        predicted_gain: >-
          Shows description degree and membership cost are DECOUPLED, which
          is the structural content of the consequence under test.
    quantifier_order: >-
      STRUCTURAL: FOR ALL p, FOR ALL beta in [1/4, 1/2], THERE EXISTS a
      PUBLIC, TARGET-INDEPENDENT t0 depending on p and beta only, such that
      F_t0 has size p^{beta + o(1)}, polylog membership, and a completely
      split membership polynomial of degree |F_t0| times (1 + o(1)). The
      witness t0 depends on p, which the claim permits; it does NOT depend on
      the instance.
      CONSEQUENCE: FOR ALL no-go arguments resting only on membership cost or
      description degree, F_t0 is a counterexample to universality.
      NOT CLAIMED: anything about the solver exponent being below 1.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "the implicit-membership cell contains, at every size in
        [p^{1/4}, p^{1/2}], a closed Bezout-tight base with polylog
        membership; on the tested toy cells its yield, its maximal Fourier
        coefficient and its Groebner cost matched the random null within the
        stated bands, as did the second-trace and comparison arms." It cannot
        certify that no solver exploits the class-group structure, and it
        proves no no-go.
      nearby_object_control: >-
        THE OBJECT WHERE A CLOSED ALGEBRAIC BASE DOES ADMIT A SOLVER
        ADVANTAGE: the Frobenius-defined base of an extension-field curve
        under Weil descent. There the auxiliary structure IS an endomorphism
        of the target curve and acts on relations; here the auxiliary
        structure acts on auxiliary j-values and never touches E. A method
        that could not tell these apart would be measuring the wrong thing;
        the solver arm tells them apart by construction, because a solver
        advantage shows in the solve-cost ratio.
    proof_obligations:
      - claim: "The number of j with trace plus or minus t0 equals H(4p - t0^2) with the quoted weights, for p not dividing t0."
        responsibility: size
      - claim: "Every root of the relevant ring class polynomials lies in F_p."
        responsibility: correctness
      - claim: "One point count decides membership; the cost is polylog and is CHARGED."
        responsibility: runtime
      - claim: "The comparison bases have equal size within 5 percent and run through byte-identical routines."
        responsibility: interface
      - claim: "The multiplicative-subgroup arm reproduces its committed count and its predicted exhaustiveness."
        responsibility: baseline
      - claim: >-
          The yield and Fourier arms are functions of the discrete-log
          multiset alone, hence carry zero curve content by construction; the
          solver arm is the only arm that can carry curve content.
        responsibility: scope
      - claim: >-
          The planted-structure arm is resolved at each declared density, so
          the pipeline's sensitivity is measured rather than assumed.
        responsibility: size
      - claim: "No cell claims anything beyond the tested parameters, base, routine and budget."
        responsibility: scope

  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null AS A CLAIM. NO ATTACK IS CLAIMED, and the honest
    accounting runs the other way: if F_t0 were used in prime-field index
    calculus at its size floor beta = 1/4 with the predicted unit solver
    behaviour, the total would sit at exponent 1 in N, WORSE than Pollard rho
    by about N^{1/2} - roughly 2^{128} at a 256-bit N. That negative delta is
    stated here rather than omitted. At the edge beta = 1/4 the linear
    algebra alone costs N^{1/2}, equal to rho's time, which is the boundary
    the base sits on and cannot cross by itself. Memory would be N^{beta} for
    the base and the relation matrix; the membership test needs O(log p)
    working memory. DISCLOSED HIDDEN OVERHEAD: the o(1) in the class-number
    estimate is an ineffective constant, replaced at toy scale by exact class
    numbers; the point-counting cost hides a polylog factor and a heuristic
    prime-availability assumption, neither of which matters for a polylog
    membership claim. Nothing superpolynomial is hidden because nothing is
    claimed.

  heuristic_assumptions:
    - id: HEUR-CM-1
      formal_statement: >-
        The set of j-invariants with trace plus or minus t0 meets the
        x-coordinate set of G as a random subset of F_p of the same size
        would: the number of points of G whose x-coordinate lies in that set
        equals 2 times its size times 1/2, up to a relative error of order
        the inverse square root of that size, uniformly for sizes between
        p^{1/4} and p^{1/2}.
      random_model_justification: >-
        RIGOROUS BOUNDS: the exact count of j-invariants with prescribed
        trace, and the exact density 1/2 of x-coordinates of E among F_p.
        CLASSICAL DISTRIBUTION IMITATED: that the quadratic residuosity of
        the curve's cubic on a structured set behaves as a fair coin - the
        same statement a Weil bound proves for a set that is algebraic of LOW
        degree, which is VACUOUS here because the set's degree is comparable
        to its size. THE HEURISTIC CONTENT is exactly that the CM j-set is
        uncorrelated with the quadratic character of the curve's cubic, and
        no bound is available for it.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-8e50bd]
      falsification_condition: >-
        The measured ratio of base size to class number falls outside
        [0.8, 1.2] at two consecutive primes wherever the class number is at
        least 200. Then either the size law or this independence assumption
        is wrong as stated, and it is re-derived before any other arm is read.
    - id: HEUR-CM-2
      formal_statement: >-
        F_t0 is LOG-RANDOM: the discrete logarithms of its elements with
        respect to a generator of G are distributed, for the purposes of
        arity-3 representation counts and of the maximal Fourier coefficient,
        as those of a uniformly random subset of Z/N of the same size,
        uniformly for sizes between p^{1/4} and p^{1/2}.
      random_model_justification: >-
        RIGOROUS BOUND: the exact mean identity for representation counts,
        which holds for EVERY subset and therefore constrains the mean but
        not the distribution. CLASSICAL DISTRIBUTIONS IMITATED: the Poisson
        law of representation counts and the extreme-value law of the maximal
        Fourier coefficient for a random subset of a cyclic group. THE GAP is
        a circularity this corpus already records: no algebraic method bounds
        these Fourier coefficients without knowing the logarithms, so this is
        genuinely a heuristic and is exactly what the yield and Fourier arms
        measure. THIS ASSUMPTION IS STATED SO THAT ITS REFUTATION IS E2.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-8e50bd]
      falsification_condition: >-
        A yield or Fourier excess for F_t0 outside its band, ABSENT on both
        the random null and the equal-class-number second-trace arm, and
        persisting at the next larger prime. That is E2 - and, by the
        curve-content audit, it would be a statement about a subset of Z/N
        rather than about elliptic curves.

  structural_ingredients:
    - description: >-
        The universal algebraic-factor-base no-go is open because
        "algebraically defined" can include high-degree interpolation
        descriptions, multiple constructible predicates, target-dependent
        descriptions, and IMPLICIT MEMBERSHIP OR SOURCE-RECOVERY ALGORITHMS;
        and the entry reproduces the bounded-degree theorem's statement that
        a Bezout bound limits the factor base to three times the describing
        degree.
      citation: KN-OPEN-020
      provenance: internal
      verified_by: >-
        idea-generator of IDEA-20260902-701458, which records reading
        knowledge/open-problems/KN-OPEN-020.md IN FULL on 2026-09-02 under
        TASK-20260902-51b6ce lane B. RELAYED, NOT RE-READ by coordinator
