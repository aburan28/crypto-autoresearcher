  reduction_chain:
    core_problem: >-
      Whether the implicit-membership cell of the universal no-go question is
      inhabited by a closed, Bezout-tight, cheaply-decidable factor base, and
      whether such a base is log-random on the E-side statistics.
    corollaries: []
  reduction_chain_note: >-
    Deliberately empty. E1 would close the membership-cost and
    description-degree READINGS of one open problem; it reaches no downstream
    problem and asserts no reduction.

  predictions:
    - metric: "Y1 = |F_t0| divided by H(4p - t0^2), per (p, E, t0); dimensionless"
      direction: different
      minimum_effect: >-
        Within [0.8, 1.2] wherever the class number is at least 200, from
        binomial fluctuation of the x-coordinate intersection plus the o(1)
        of the twist count. Outside at two consecutive primes means the size
        law or the independence heuristic is wrong as stated.
    - metric: >-
        Y2 = ratio of mean exact arity-3 decomposition counts, F_t0 over the
        random null, and the same for the second-trace and comparison arms;
        dimensionless
      direction: different
      minimum_effect: >-
        Within 1 plus or minus three times the inverse square root of
        (targets times the mean), with variance and coverage in the same
        band. E2 requires F_t0 OUTSIDE the band with the second-trace and
        comparison arms INSIDE it, reproduced at the next larger prime.
    - metric: >-
        Y3 = the maximal Fourier coefficient of F_t0 along the discrete-log
        coordinate, divided by the in-run extreme-value prediction for a
        random subset of the same size; dimensionless
      direction: different
      minimum_effect: >-
        Within the 95 percent band of the null's extreme-value law at every
        cell, with the interval reference arm reproducing its recorded
        constant as calibration. An excess above the band, persisting in p
        and absent on the second-trace arm, is E2.
    - metric: >-
        Y4 = Groebner solve cost on the membership-adjoined decomposition
        ideal, divided by the charged exhaustive enumeration cost on the same
        targets, BOTH MEASURED IN F_p MULTIPLICATIONS; dimensionless
      direction: different
      minimum_effect: >-
        At least 0.5 for F_t0 and for the random null at every size,
        corresponding to unit solver behaviour up to constants. The
        multiplicative-subgroup arm may sit below by a polynomial factor from
        sparsity, and THAT IS PRE-REGISTERED AS NOT AN EXPONENT. A fitted
        solver exponent below 0.9 for F_t0 across three sizes, absent for the
        random null, is E2 on the solver axis and triggers independent review.
        NOTE THE UNIT REPAIR: both sides are charged in F_p MULTIPLICATIONS
        via the solver's own operation counter and the enumeration's counted
        operations. Wall clock is reported SEPARATELY as a secondary
        diagnostic and is never used as the numerator of this ratio.
    - metric: >-
        Y5 = recovery of a PLANTED arithmetic progression of declared density
        in the discrete-log coordinate; the excess of Y3 over the null band,
        dimensionless
      direction: higher
      minimum_effect: >-
        Monotone in the planted density and resolved at each declared
        density, with the smallest declared density chosen at the edge of the
        Y3 band so the pipeline's floor is MEASURED. A pipeline that cannot
        resolve the smallest planted rung cannot honestly declare E1 at that
        band, and the band must be widened to the smallest resolved rung
        BEFORE the F_t0 arms are read.

  test_boundary:
    instances:
      - "p in {2^12, 2^16, 2^20}, three prime-order curves per p, screened for anomalous and smooth order."
      - "Three sizes per curve, via three shifts of t0, giving |F_t0| about p^{1/4}, p^{1/3} and p^{1/2}."
      - "Five comparison arms at matched size: random subset; second trace with equal class number; multiplicative-subgroup base; interval base; planted-AP base."
      - "One blocking known-answer calibration: the full trace histogram at the smallest prime against exact Kronecker class numbers."
    parameters:
      p: "{2^12, 2^16, 2^20}"
      beta: "{1/4, 1/3, 1/2} approximately, via three shifts s"
      targets_per_cell: 200
      solver_targets_per_cell: 20
      planted_densities: "three declared values, the smallest at the edge of the Y3 band"
      exclusions: "special j-invariants; p dividing t0; special discriminants; anomalous and smooth-order curves"
    implementation: >-
      Exhaustive construction of F_t0 by point-counting the auxiliary curve
      for every point of G at toy scale; brute-force discrete logarithms for
      the Fourier arm; exact pair-enumeration for the yield arm; a Groebner
      engine for the solver arm, with an operation counter so both sides of
      Y4 are in the same units.
    budget: >-
      See EXP-ECDLP-8e50bd. The dominant costs are 10^6 point counts at the
      largest prime and the Groebner solve on a dense membership polynomial
      of degree up to about 2^10.

  falsification_conditions:
    - >-
      G1. The trace-histogram calibration fails: the histogram does not match
      the exact class numbers. The instrument or the quoted theorem is wrong;
      NOTHING IS REPORTED from any arm.
    - >-
      G2. Y1 outside its band at two consecutive primes. The size law or
      HEUR-CM-1 is wrong; it is re-derived before any other arm is read.
    - >-
      G3. Y2 or Y3 excess for F_t0, absent on both the random null and the
      equal-class-number second-trace arm, persisting at the next larger
      prime. E2. Lead outcome; routed to independent review; still no attack.
      AND, BY THE CURVE-CONTENT AUDIT, still not a statement about elliptic
      curves - see interpretation_limits.
    - >-
      G4. Y4 gives a fitted solver exponent below 0.9 for F_t0 at three sizes
      and not for the random null. E2 ON THE SOLVER AXIS - the only axis that
      can carry curve content - and it must be understood before it is called
      a gain.
    - >-
      G5. All bands met, which is predicted. E1: the membership axis of the
      open problem is closed with a mechanism, and the honest headline is
      that a universal no-go, if it exists, is a statement about solvers.
    - >-
      G6. A blocking control fails, or the planted-AP arm is not resolved at
      the smallest declared density. The run set is void, or the band is
      widened and amended before proceeding.
    - >-
      G7. Budget exhaustion. INFRASTRUCTURE outcome under AGENTS.md rule 5.

  interpretation_limits:
    - >-
      THE CONSEQUENCE UNDER TEST IS A STATEMENT ABOUT WHICH AXES a universal
      no-go may use. It is NOT a no-go and NOT an attack, and E1 does not
      close the open problem - only its membership-cost and
      description-degree readings.
    - >-
      THE CURVE-CONTENT AUDIT, STATED BEFORE THE RUN AND BINDING. Y2 and Y3
      are functions of the DISCRETE-LOG MULTISET of the base and of nothing
      else. A size-and-log-matched subset of Z/N reproduces them EXACTLY, by
      construction, with no curve present. Therefore NO OUTCOME OF Y2 OR Y3 -
      neither E1 nor E2 - IS A STATEMENT ABOUT ELLIPTIC CURVES, ABOUT CM
      STRUCTURE, OR ABOUT THE ECDLP. The only arm that can carry curve
      content is Y4, whose input is a membership polynomial built from
      x-coordinates rather than from logarithms.
    - >-
      The base's size floor at exponent 1/4 means it NEVER enters the strict
      interior of the admissible region on its own. Nothing is claimed about
      composite predicates beyond naming them.
    - >-
      ALL FOUR EXTERNAL THEOREM CITATIONS ARE RECALLED and were opened by no
      agent in this program. The Stage 0 quotation and the exhaustive trace
      histogram are what make the size law load-bearing at toy scale despite
      that.
    - >-
      Three internal records this design leans on for framing were NOT
      opened by anyone, and are cited as recalled pointers with verified_by
      null. Nothing in the deliverable rests on them: the Bezout statement
      used is the open problem's own, the solver prediction is MEASURED, and
      the Fourier null band is computed in-run.
    - >-
      THE ASYMPTOTIC STATEMENTS (S1)-(S2) CANNOT BE TESTED AT REACHABLE
      SCALE. They involve an ineffective o(1) in the class-number estimate;
      the toy run checks EXACT class numbers at three primes and nothing
      more, and no extrapolation to cryptographic p is licensed.
    - >-
      Toy tier throughout; every number is scoped to the tested parameters,
      base, routine and budget.
    - >-
      NO STATUS CHANGE to any record is proposed or implied.

