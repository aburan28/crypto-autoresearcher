  statement: >
    Fix the exact subgroup-order identity of IDEA-20260829-4b34c5 before any bilinear character-sum bound, any acceptance-matrix discrepancy, or any discrete logarithm is claimed. Stage 0 asserts only that for p=7 and L=3 the L-th powers H in F_p* have order (p-1)/L=2 and H={1,6}. A nearby claim that |H|=p-1 (every residue accepted) is rejected. The empty subgroup is rejected. This is not a Shparlinski bound and not a rho beat. Stages 1+ stay unauthorized.
  mechanism: >
    IDEA-20260829-4b34c5 replaces an order-theoretic accepted set by the L-th-power subgroup of F_p*. Stage 0 freezes |H|=(p-1)/L on one tiny field. No curve character sum. No Semaev S_m. No DLP.
  predictions:
    - id: P-S0-CHISUB
      metric: closed-form identities on the frozen REAL / KF / NULL panel
      direction: different
      minimum_effect: >
        After fixture_pass, REAL identities hold and the nearby KF
        claim is rejected. NULL is rejected.
      claim_tier: observational
  falsification_criteria:
