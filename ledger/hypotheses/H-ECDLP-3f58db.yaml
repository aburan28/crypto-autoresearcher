      statement: >
        After fixture_pass, the KF claim is accepted. An encoding
        bug is failed_infrastructure.
    - id: F-S0-REAL
      statement: >
        After fixture_pass, REAL misses a frozen identity. That
        falsifies only P-S0-CHISUB at the frozen arithmetic.
  test_boundary:
