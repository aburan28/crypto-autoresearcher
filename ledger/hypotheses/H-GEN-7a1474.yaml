hypothesis:
  id: H-GEN-7a1474
  question_id: RQ-SSI-001
  proposal_id: IDEA-20260806-a3ef00
  added: '2026-08-06'
  statement: >-
    The information distinguishing supersingular curves at a fixed p decomposes
    additively over three proved-disjoint strata of the Gross lattice -- the
    ternary quadratic lattice attached to a maximal order -- as
    I(EndRing) = 0 + log2(#spinor genera) + log2(h), where h ~ p/12 is the class
    number. Specifically: (B1) ALL supersingular curves at a fixed p have Gross
    lattices in ONE genus, so the complete local invariant contributes exactly
    zero bits; (B2) the number of spinor genera in that genus is 1 or 2, so at
    most one bit; and therefore (B3) the DEFI-style collapse recorded in
    KN-LIT-7648, where genus = spinor genus = equivalence class made a hard
    isomorphism problem polynomial, PROVABLY CANNOT OCCUR HERE.
  mechanism: >-
    All maximal orders in a quaternion algebra are locally conjugate at every
    place, so under a fixed lattice convention the associated ternary lattices
    are locally isometric everywhere and lie in one genus. The genus symbol --
    local data at every prime including p, and at infinity -- is therefore
    identical across the whole class set, and B1 follows.
    The number of spinor genera in a genus of ternary forms is a power of 2
    determined by local spinor norm groups, computable FROM THE GENUS SYMBOL
    ALONE. That is what makes this experiment feasible despite EndRing being
    hard: the spinor count is a property of the genus, not of any individual
    unknown lattice, so it can be computed without solving EndRing for any curve.
    B1's practical payoff is a single named obstruction covering an entire family
    of candidate invariants: no invariant computed from PURELY LOCAL ARITHMETIC
    DATA -- completions, genus symbols, Hasse invariants, local conditions at any
    finite set of places -- can distinguish two supersingular curves at the same
    p. IT MUST BE STATED CAREFULLY AND THIS RECORD STATES IT CAREFULLY: "local"
    in the ISOGENY-GRAPH sense (a neighbourhood of a vertex) is NOT "local" in
    the ARITHMETIC sense (a completion at a place). Graph-neighbourhood data is
    global arithmetic information, so B1 does not touch
    IDEA-20260804-170692 or IDEA-20260804-4c9ac0; what it supplies is the reason
    their information must come from the graph structure.
  assumptions:
    - >-
      All maximal orders in the quaternion algebra ramified at p and infinity are
      locally conjugate at every place. Standard; derived rather than assumed in
      Step 2 and verified computationally at toy p.
    - >-
      A single lattice convention is fixed and named. Trace-zero elements versus
      Gross's {2x - Tr(x)} versus scaled reduced-norm forms differ by factors
      that MATTER at the prime 2, and the genus symbol and spinor count depend on
      the choice. Fixing it is Step 1 and skipping it is the fastest route to a
      wrong spinor count that nobody notices.
    - >-
      h ~ p/12 up to the standard correction terms depending on p mod 12, used as
      an INDEPENDENT cross-check rather than as an input.
    - >-
      Toy p (up to roughly 10^4), where the full supersingular vertex set and its
      orders can be enumerated. Derivations are what would carry to cryptographic
      p; the computations would not, and the record does not pretend otherwise.
  proof_search_map:
    bottleneck: >-
      The number of spinor genera in the genus of the Gross lattice. If it is 1,
      the decomposition contributes nothing beyond B1's assurance. If it is large
      AND computable from p alone, it is a coarse computable invariant of a
      supersingular curve -- which is exactly what nobody has. One integer
      carries the entire experiment.
    baseline_embedding:
      parameter_slice: >-
        The smallest p with more than one supersingular curve (p = 11 upward),
        where the whole class set and all orders can be written down by hand.
      reproduction_check: >-
        Frozen fixture: the number of supersingular j-invariants at each toy p
        must match the classical mass-formula count exactly, computed
        independently, BEFORE any lattice is built.
    observation_collision:
      observable: the genus symbol of the Gross lattice
      distinct_preimage_search: >-
        NOT A SEARCH BUT A DERIVATION, AND IT IS EXPECTED TO SUCCEED MAXIMALLY:
        B1 asserts that all h ~ p/12 curves share one genus symbol, so the
        collision class is the entire class set. The audit is inverted -- the
        computation must CONFIRM total collision, and finding even one curve with
        a different genus symbol refutes B1 and is the single most interesting
        possible outcome of the whole experiment.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A resource measure charging information bits separately over the
          proved-disjoint blocks local / spinor / class, so additivity holds by
          construction rather than by assertion.
        predicted_gain: >-
          A closed, exhaustive accounting of where EndRing's difficulty lives:
          0 + <=1 + log2(p/12). A complete index set, not a speedup.
      - transform: observable_fiber
        proposed_object: >-
          Hold the genus symbol fixed (automatic under B1), vary the class, and
          seek an intrinsic invariant distinguishing the lattices that is
          computable WITHOUT solving EndRing.
        predicted_gain: >-
          Predicted none below EndRing cost. Any exception is a distinguisher on
          the supersingular set and supersedes this record.
    quantifier_order: >-
      B1, explicitly: FORALL p, FORALL supersingular E, E' over F_{p^2}, the
      Gross lattices lie in the SAME genus -- i.e. FORALL places v EXISTS a local
      isometry at v. The local isometry may depend on the place AND on the pair.
      A reader who reverses this to EXISTS an isometry FORALL v has read a false
      statement: that would be a GLOBAL isometry and would say all supersingular
      curves are isomorphic. THE GAP BETWEEN THE TWO ORDERS IS EXACTLY
      I_global, which is the point of the decomposition.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The information distinguishing supersingular curves at fixed p is 0 bits
        local, at most log2(#spinor genera) bits spinor, and the rest
        class-level." It can NEVER certify that EndRing is hard, and never that
        the class-level bits are inaccessible -- only that they are not
        accessible through the genus stratification.
      nearby_object_control: >-
        DEFI's own quadratic forms, where genus = spinor genus = class and the
        problem collapsed. The method must give the OPPOSITE answer there and
        must be able to show why. A pipeline reporting "irreducibly global" for
        both DEFI's forms and the Gross lattices is not measuring the
        stratification -- it is asserting a conclusion. Cheapest and sharpest
        check in the record, because the DEFI-side forms are small.
    proof_obligations:
      - claim: Local conjugacy of maximal orders implies a common genus.
        responsibility: correctness
      - claim: The spinor-genus count is computable from the genus symbol alone.
        responsibility: feasibility
      - claim: The bit budget is additive over the three strata.
        responsibility: correctness
      - claim: log2(h) matches the mass-formula count independently.
        responsibility: baseline
      - claim: The pipeline can report more than one spinor genus.
        responsibility: interface
      - claim: The DEFI-side control gives the opposite verdict.
        responsibility: scope
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-GEN-1
      formal_statement: >-
        The number of spinor genera in the genus of the Gross lattice is a
        function of p through congruence conditions on p alone (p mod 4, 8 and
        12), and not through finer arithmetic of p.
      random_model_justification: >-
        Rigorous side: the spinor-genus count is determined by local spinor norm
        groups, which for a quaternion algebra ramified exactly at p and infinity
        are governed by local conditions at 2, at p and at infinity. Heuristic
        side: that no further dependence on p appears -- that the local
        conditions capture everything -- imitating the classical behaviour of
        ternary genera of prime-power discriminant.
      supporting_results:
        - KN-TECH-081 (the principal ideal problem beyond commutative orders),
          which records the genus/spinor machinery as the adjacent threat
        - KN-LIT-7648 (the DEFI collapse), supplying the failure mode this
          hypothesis says cannot occur here
      validation_experiment_ids: [EXP-GEN-62f9ac]
      falsification_condition: >-
        A count that varies within a residue class mod 24 across the tested prime
        ladder, refuting the congruence-only dependence. That would not refute B1
        or B3, but it would mean the spinor term must be computed per prime
        rather than predicted, and it would be worth reporting on its own.
  structural_ingredients:
    - description: >-
        The Gross lattice: the ternary quadratic lattice attached to a maximal
        order in the quaternion algebra ramified at p and infinity.
      citation: >-
        Classical; ABSENT from this program's records ("Gross lattice" returns
        zero hits). NOT re-read in this session; Stage 0 fixes the convention and
        obtains statements.
      role: supplies the object the stratification acts on
    - description: >-
        Genus and spinor-genus theory for ternary quadratic forms, and the
        classical-polynomial-time collapse it produced against DEFI.
      citation: KN-LIT-7648, KN-TECH-081
      role: >-
        supplies the threat model this hypothesis tests, and the nearby-object
        control on which the method must give the opposite answer
  reduction_chain:
    core_problem: >-
      Where the information distinguishing supersingular curves actually lives,
      and whether the DEFI-style arithmetic collapse threatens EndRing.
    corollaries: []
  predictions:
    - metric: distinct genus symbols among Gross lattices at a fixed p
      direction: different
      minimum_effect: >-
        Exactly 1, at every tested p, zero exceptions. A single exception refutes
        B1 and is the most valuable outcome available: a locally computable
        distinguisher on the supersingular set.
    - metric: number of spinor genera in that genus, as a function of p
      direction: different
      minimum_effect: >-
        Predicted 1 or 2. A value of 4 or more at any tested p, together with a
        computable separator, is a material result and changes the bit budget.
        The p-dependence through p mod 4, 8, 12 is reported whatever the value.
    - metric: computed log2(h) versus the mass-formula prediction log2(p/12)
      direction: different
      minimum_effect: >-
        Agreement within the standard correction terms at every tested p.
        Disagreement is an instrument failure, not a finding, and halts the run.
  test_boundary:
    instances: >-
      Supersingular curves over F_{p^2} for p in a ladder of at least 20 primes
      covering every residue class mod 24, p up to roughly 10^4, with the vertex
      set built by two independent constructions required to agree exactly.
    parameters:
      prime_ladder: >-
        >= 20 primes, chosen to cover every residue class mod 24, spanning a
        factor 100 in p
      lattice_convention: fixed at Stage 1 and named in every reported number
      positive_control_family: >-
        Classical ternary lattices known to lie in at least two spinor genera
    implementation: >-
      Existing quaternion-order machinery; genus symbols and spinor-genus counts
      computed from local data, never from an individually solved EndRing
      instance.
    budget:
      total_cpu_hours: 60
      maximum_memory_gb: 16
  falsification_conditions:
    - >-
      Two supersingular curves at the same p have different genus symbols. B1
      REFUTED, and this is the highest-value outcome in the record: it would be a
      locally computable distinguisher and becomes the successor proposal.
    - >-
      The positive control fails to report >= 2 spinor genera. The instrument
      cannot distinguish spinor genera at all; B2 is unfalsifiable as measured
      and nothing about it may be reported.
    - >-
      The DEFI-side contrast gives the same verdict as the supersingular side.
      The pipeline is not measuring the stratification; halt.
    - >-
      The class number disagrees with the mass formula. Instrument failure.
    - >-
      The Stage-1 convention turns out to change the spinor count. Then the count
      is not an invariant of the curve and the budget's spinor term is
      meaningless as stated; the record must be SUPERSEDED with the
      convention-dependence made explicit, never quietly fixed.
  interpretation_limits:
    - >-
      The bit budget is information-theoretic, not computational. Class-level
      bits being "where the hardness lives" does not mean they are hard to
      extract; it means the genus stratification does not extract them.
    - >-
      Computations are toy-scale. Derivations are what carry to cryptographic p,
      and a derivation error would not be caught at that scale by anything here.
    - >-
      Nothing here is a security claim about SQIsign, CSIDH or CGL. It is a
      statement about one stratification of one lattice invariant.
    - >-
      B1 forbids ARITHMETIC-local invariants. It does NOT forbid
      graph-neighbourhood invariants, delta-type global statistics, orientation
      data, or theta-series truncations. Conflating the two senses of "local"
      would be a serious misreading and it is flagged here, in the mechanism, and
      in the experiment's forward guidance.
  status: specified
  proposed_by: idea-generator
  specified_by: coordinator
  specified_at: '2026-08-06'
