  test_boundary:
    instances:
      - >-
        R_n = Z[x]/(x^n + 1), n = 2^{ell-1}, ell in {3,4,5,6}, i.e.
        n in {4,8,16,32}. n >= 64 is OUT OF SCOPE for this hypothesis.
      - >-
        B in SL_2(R_n) generated by the declared deterministic rule in
        EXP-HAWK-a2f34a. HAWK-SHAPED, NOT HAWK: the Round-3 specification is
        unread and no HAWK key-generation procedure is reproduced. Proposition
        4.5 as reported quantifies over all B in SL_2(R), which is what makes
        the weaker rule sufficient for THIS test and insufficient for anything
        else.
      - >-
        Involution tau only. The third involution c*tau and non-2-power
        conductors are the sibling hypothesis H-HAWK-a28be6 and are outside this
        boundary.
      - >-
        Arms: treatment (genuine Q), NULL-1 (random Hermitian), NULL-1b
        (unit-determinant twist), NULL-2 (graded perturbation, five points).
