hypothesis:
  id: H-HAWK-c7a551
  question_id: RQ-HAWK-001
  goal_id: GOAL-HAWK-001
  source_idea: IDEA-20260805-6eac55

  statement: >-
    SCOPE: power-of-two cyclotomic conductors m = 2^ell for ell in {3,4,5,6},
    i.e. ring degrees n in {4,8,16,32}; arbitrary short B in SL_2(R_n) generated
    by a declared deterministic rule (HAWK-SHAPED, NOT HAWK -- the Round-3
    specification is unread and no HAWK key-generation procedure is used);
    exact integer arithmetic; pure Python; ONE instrument lineage. CLAIM TIER
    toy. NO ATTACK, NO EXPONENT, NO STATEMENT ABOUT DEPLOYED HAWK PARAMETERS.

    THE CLAIM. Define, from the PUBLIC Gram matrix Q = B* B alone,
      Lambda_B^(tau) := { Y = [[a,b],[c,d]] in M_2(R_n) :
                          tau(a) = d, tau(d) = a, tau(b) = -b, tau(c) = -c,
                          and Q Y = ((c tau)(Y))^T tau(Q) },
    where tau(zeta) = -zeta and c is complex conjugation, equipped with the
    rational quadratic form Q^(tau)(Y) = Tr_{F/Q}(det Y), F = K^{<c,tau>} of
    degree n/4. THEN, IF Proposition 4.5 of KN-LIT-7592 holds as reported --
    Lambda_B^(tau) isometric to sqrt(n/4) Z^{n/2+1} (+) sqrt(n/2) Z^{n/2-1} --
    FOUR INTEGERS ARE FORCED, and they are stated here before any computation:
      F1  Z-rank = n exactly;
      F2  det(Gram) = (n/4)^{n/2+1} * (n/2)^{n/2-1}, i.e. 2, 2048,
          549755813888, 2596148429267413814265248164610048 at n = 4,8,16,32;
      F3  #{v : Q^(tau)(v) = n/4} = n + 2, i.e. 6, 10, 18, 34;
      F4  #{v : Q^(tau)(v) = n/2} = n^2/2 + 2n - 2, i.e. 14, 46, 158, 574.
    AND the secret-derived cocycle V_tau = B^{-1} tau(B) lies in that lattice
    with Q^(tau)(V_tau) = n/4 exactly and V_tau congruent to I mod 2.

    WHAT IS ACTUALLY BEING TESTED, STATED WITHOUT FLATTERY. The defining system
    above is DERIVED IN IDEA-20260805-6eac55 from three algebraic identities
    (V tau(V) = I, det V = 1, tau(Q) = V* Q V); the paper's Lemmas 4.1 and 4.3,
    which state the real constraints, were NOT READ. So a failure of F1-F4 is
    FIRST evidence against this derivation and only SECOND evidence about
    Proposition 4.5, and the record's reporting rule fixes that ordering before
    any run. The positive control -- V_tau must lie in the constructed lattice
    at squared length exactly n/4 -- is what separates the two readings, and it
    can genuinely fail.

    THE PLANNED NEGATIVE IS A DELIVERABLE. If the derivation is wrong, the
    output is the derivation itself, the exact failure mode, and a named request
    for the two lemma statements -- which is strictly more than this goal holds
    today, since GOAL-HAWK-001 has produced ZERO computed quantities in two
    batches (EV-HAWK-001: "This program has run no HAWK experiment").

  mechanism: >-
    DERIVED IN-REPO. Sources available to this session: KN-LIT-7592 (read at
    abstract/introduction level by TASK-20260802-004; its own body lists
    Lemma 4.1, Lemma 4.3, Proposition 4.5, Theorem 5.1, Proposition D.2 and
    Theorem 6.1 as NOT verified) and the verbatim fragments in
    coordination/goals/GOAL-HAWK-001/batches/BATCH-001/tasks/TASK-20260802-004/
    disclosed_attack_transcription.md, which EV-HAWK-001 records as carrying at
    least four unmarked extraction damages. Nothing below is a citation.

    SETUP. m = 2^ell, K = Q(zeta_m), R = Z[zeta_m], n = phi(m) = m/2. HAWK's
    secret key is B in SL_2(R); the public key is Q = B* B with B* = c(B)^T.

    STEP 1 -- THE COCYCLE IS AN INVOLUTIVE INVERSE. V := B^{-1} tau(B) gives
    tau(V) = tau(B)^{-1} tau^2(B) = tau(B)^{-1} B = V^{-1}, and
    det V = det(B)^{-1} tau(det B) = 1 because det B = 1 and tau fixes 1. For a
    2x2 matrix of determinant 1, V^{-1} = adj(V) = [[d,-b],[-c,a]]. Equating
    entries of tau(V) and adj(V) gives the four conditions of the statement.
    They are Z-LINEAR: in the power basis 1, zeta, ..., zeta^{n-1},
    tau(zeta^j) = (-1)^j zeta^j, so tau is the diagonal sign matrix
    diag((-1)^j). Hence tau(b) = -b annihilates the even-index coordinates of b
    (n/2 conditions), likewise for c, while tau(a) = d determines d from a. Rank
    after step 1: n + n/2 + n/2 = 2n out of the 4n coordinates of M_2(R).

    STEP 2 -- THE PUBLIC CONDITION, LINEARISED. Galois is abelian so c and tau
    commute and tau(B*) = tau(B)*. From tau(B) = B V,
      tau(Q) = tau(B)* tau(B) = (B V)* (B V) = V* Q V.
    Left-multiplying by (V*)^{-1} and using
      (V*)^{-1} = (c(V)^T)^{-1} = (c(V^{-1}))^T = (c(tau(V)))^T
                = ((c tau)(V))^T
    (the middle equality is V^{-1} = tau(V) from step 1) yields
      Q V = ((c tau)(V))^T tau(Q),
    which is Z-linear in V's 4n coordinates with coefficients built from the
    public Q. THE HYPOTHESIS ASSERTS THAT THESE CONDITIONS CUT THE RANK FROM 2n
    TO EXACTLY n; that assertion is F1 and it is a prediction of the derivation,
    not an input to it.

    STEP 3 -- THE LENGTH FORM AND THE GENERIC UPPER BOUND. For Y satisfying
    step 1, tau(det Y) = tau(a)tau(d) - tau(b)tau(c) = d a - (-b)(-c) = det Y,
    so det Y lies in K^tau. THAT det Y IS ALSO c-INVARIANT, HENCE IN F, IS NOT
    DERIVED HERE and is carried as HEUR-HAWK-2 with an explicit instrument test.
    Granting it, Q^(tau)(Y) = Tr_{F/Q}(det Y) is a rational quadratic form on a
    rank-n lattice and
      Q^(tau)(V_tau) = Tr_{F/Q}(det V_tau) = Tr_{F/Q}(1) = [F : Q] = n/4,
    reproducing the transcribed sentence "its squared length is the minimum
    TrF(1) = n/4" exactly. So lambda_1^2 <= n/4 UNCONDITIONALLY for every
    B in SL_2(R). NOTE THE SEPARATION THIS MAKES, WHICH IS THE HYPOTHESIS'S
    STRUCTURAL CONTENT: the UPPER BOUND is generic and follows from det B = 1
    alone; the ORTHOGONAL SPLITTING is 2-power-specific and is the only part
    that gives Ducas's block reduction its dimension-(n/2+1) foothold. F2, F3
    and F4 test the second part; F1 and the bound test the first.

    STEP 4 -- WHY FOUR NUMBERS AND NOT ONE. For
    L = sqrt(a) Z^{k1} (+) sqrt(b) Z^{k2} with a = n/4, b = n/2 = 2a and
    k1 = n/2 + 1, k2 = n/2 - 1:
      det(Gram) = a^{k1} b^{k2};
      #{|v|^2 = a} = 2 k1 = n + 2, because b > a so only first-block unit
        vectors reach a;
      #{|v|^2 = b} = 4*C(k1,2) + 2*k2 = n^2/2 + 2n - 2, from two first-block
        coordinates at +/-1 (four sign patterns per unordered pair) or one
        second-block coordinate at +/-1.
    F4 is QUADRATIC in n and is therefore the discriminating member: a form with
    the right rank and covolume but a different splitting will generically miss
    it. F3 independently reproduces the paper's own downstream arithmetic --
    the transcription records "exactly two of the 2(n/2+1) shortest-vector
    candidates, +/- V_tau, satisfy Y == I (mod 2)", and 2(n/2+1) = n + 2 = F3 --
    which is a consistency check of this derivation against the source performed
    BEFORE any run.

    STEP 5 -- COST BOOKKEEPING, PER-ATTEMPT COST TIMES INVERSE SUCCESS
    PROBABILITY. Success probability is 1: nothing here is randomised except the
    choice of B, and F1-F4 are predicted to be independent of B. Per attempt:
    building the constraint matrix is O(n) Galois applications plus one exact
    kernel over Q of a matrix at most 4n x 4n (128 x 128 at n = 32); F2 is one
    Bareiss determinant, O(n^3) big-integer operations; F3 and F4 are a
    Fincke-Pohst enumeration whose tree is nearly branch-free IF the hypothesis
    holds and may not be if it does not. That asymmetry is charged explicitly:
    the contract sets a node budget, and exhaustion is reported as an
    infrastructure outcome, never as evidence against the hypothesis
    (AGENTS.md rule 5).

  assumptions:
    - >-
      FROZEN INSTRUMENT DEFINITION, complete and parameter-free, fixed BEFORE
      any evaluation. (1) R = Z[x]/(x^n + 1) with n = 2^{ell-1}, power basis
      1..x^{n-1}. (2) c(x^j) = -x^{n-j} for j >= 1, c(1) = 1 (the standard
      negacyclic conjugation). (3) tau(x^j) = (-1)^j x^j. (4) c*tau computed as
      the composite, never separately defined. (5) Lambda is the Z-kernel of the
      stacked linear system of statement conditions, in Hermite normal form with
      a declared pivot order. (6) Q^(tau)(Y) = Tr_{F/Q}(det Y) evaluated as
      Tr_{K/Q}(det Y)/4 -- VALID ONLY IF det Y in F, which is checked per basis
      element as CHK-3 and never assumed. (7) F1-F4 as printed in the statement.
      NO OTHER DEGREE OF FREEDOM EXISTS. Any change to (1)-(7) after any measured
      number has been observed requires a versioned protocol_amendment with
      confirmatory_status exploratory_only, and is never an edit. EV-IC-002 is
      this program's precedent for a lane retracting a verdict because a
      criterion was revised after the prior criterion was seen to fail.
    - >-
      BASELINE-REPRODUCTION AUDIT, PARTLY RUN PRE-COMPUTE AND PARTLY OWED. What
      is already reproduced symbolically, in this session, with no run: the
      closed forms of F2, F3, F4 recomputed independently from the orthogonal-sum
      description and printed above; the identity F3 = 2(n/2+1), which matches
      the source's own parity arithmetic; and Q^(tau)(V_tau) = Tr_{F/Q}(1) = n/4,
      which matches the transcribed sentence verbatim. What is NOT reproduced and
      is owed at Stage 1: the rank-n claim, which this derivation predicts rather
      than recovers, and which is the audit's real test.
    - >-
      THE SOURCE NUMBERS ARE READ AS-IS AND NOT RE-INTERPRETED TO MAKE THEM
      AGREE. If a measured invariant disagrees with a forced value, the contract
      reports the disagreement and the two candidate explanations in the frozen
      order (derivation first, source second). A record that reconciles them by
      re-reading Proposition 4.5's statement after seeing the number is
      inadmissible.
    - >-
      PROVENANCE ASYMMETRY, CARRIED NOT HIDDEN. The transcription file that
      supplies the length form is a pdfminer.six extraction of two-column LaTeX
      which EV-HAWK-001 records as leaving "at least four damaged renderings
      unmarked". The sentence relied upon is prose, which is the least
      damage-prone class, but this is a stated risk and not a discharged one.
      Every downstream statement carries it.
    - >-
      ENVIRONMENT, MEASURED THIS SESSION RATHER THAN ASSUMED. numpy 2.4.6
      imports; sympy, sage, fpylll are ABSENT; no PARI/GP binary is on PATH.
      The instrument therefore uses Python arbitrary-precision integers and
      hand-written HNF, Bareiss and Fincke-Pohst routines and depends on none of
      the absent packages. If a future executor finds a different environment,
      that is recorded in the run manifest and does not change the contract.

  proof_search_map:
    bottleneck: >-
      Proposition 4.5 -- the assertion that the publicly computable cocycle
      lattice is EXACTLY an orthogonal sum of two scaled integer lattices. Every
      downstream step of the disclosed attack rests on it: Theorem 5.1's
      dimension-(n/2+1) SVP calls require Ducas's block reduction, which
      requires the near-hypercubic shape; the parity selection among 2(n/2+1)
      candidates requires the kissing number; and the gate figures 2^108 and
      2^182 are conversions of the resulting dimension. If the shape claim is
      not what is reported, nothing downstream survives in the reported form.
      It is also the ONE step that can be checked with no solver, which is why
      it is the bottleneck worth attacking first.
    baseline_embedding:
      parameter_slice: >-
        n = 4 (ell = 3, m = 8). Then F = K^{<c,tau>} has degree 1, so F = Q and
        Tr_{F/Q}(1) = 1 = n/4; the lattice has rank 4; the claimed splitting is
        sqrt(1) Z^3 (+) sqrt(2) Z^1, determinant 2, kissing number 6, second
        theta coefficient 14. The whole object is a 4-dimensional integral form
        with 16 ambient coordinates and is HAND-CHECKABLE.
      reproduction_check: >-
        EXACT INTEGER, not visual. At n = 4 the constraint matrix is at most
        16 x 16 and its kernel, Gram matrix, determinant and complete
        short-vector list are computable by exhaustive means with no algorithm
        beyond Gaussian elimination. A plot that "looks near-hypercubic" is not
        an embedding; the reproduction is an equality of integers. NOT YET RUN
        -- this record has no shell and computes nothing; the check is Stage 1
        of EXP-HAWK-a2f34a.
    observation_collision:
      observable: >-
        The quadruple (rank, Gram determinant, theta_{n/4}, theta_{n/2}) of the
        cocycle lattice, i.e. the first four GL_n(Z)-invariants of the form.
      distinct_preimage_search: >-
        A COLLISION IS NOT MERELY POSSIBLE, IT IS PREDICTED, AND SAYING SO IS
        THE POINT. Proposition 4.5 asserts the isometry class is INDEPENDENT OF
        B, so every secret key in SL_2(R_n) is a distinct ground-truth object
        with the SAME observable. The observable therefore identifies NOTHING
        about the secret and no measurement of F1-F4 may be cited as key
        information. The separating condition that restores identifiability is
        named and is the attack's own: among the n+2 vectors realising
        theta_{n/4}, exactly two satisfy Y == I (mod 2), and those two are
        +/- V_tau. The contract keeps the invariant measurement and the
        parity-selection measurement in DIFFERENT ARMS so the constant one
        cannot be mistaken for the informative one. A SECOND, ADVERSE collision
        is also searched for and would be a real falsifier: a lattice of the
        right rank and determinant that is NOT the orthogonal sum -- which is
        exactly why theta_{n/2} (quadratic in n) is measured and not only the
        determinant.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "run a lattice solver and see whether a key comes out" by
          "compute an integral quadratic form and compare four integers". The
          hypothesis moves into a model where it is an exact equality rather
          than a success rate, with separate encoding (the linear system),
          completeness (does V_tau lie in the kernel: PC-1), soundness (is the
          kernel no larger than rank n: F1), transfer (nothing transfers to
          deployed n; declared UNMET, not deferred) and cost-loss (the
          enumeration node budget) obligations.
        predicted_gain: >-
          Removes the fpylll/Sage dependency from the critical path entirely --
          decisive here, because those packages are absent from this container
          and an infrastructure request is not an experiment.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (F1-F4) fixed and vary the forgotten structure:
          the secret B across 20 independent draws per n, and separately the
          conductor family (the sibling hypothesis H-HAWK-a28be6 does this).
          The intrinsic invariant proposed to distinguish the resulting objects
          is the parity class of the shortest vectors, not the theta series.
        predicted_gain: >-
          If the theta series varies across B at fixed n, Proposition 4.5 as
          reported is false and the instrument has found it at Stage 2 cost.
          If it does not vary, the identifiability limit above is confirmed
          empirically as well as derived.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER: FOR ALL n in {4,8,16,32} and FOR ALL B in
      SL_2(R_n) drawn by the declared rule, THE FOUR INTEGERS F1-F4 TAKE THE
      SINGLE PRE-DECLARED VALUE that depends on n alone. The witness (the value)
      may NOT depend on B, on the seed, or on the basis chosen for Lambda. The
      weaker order -- FOR ALL B THERE EXISTS a quadruple -- is trivially true
      and is explicitly NOT claimed and NOT admissible as a result. A SECOND
      quantifier point, which is where the disclosed attack's own claim could
      hide a dependence and which this contract does not test: Theorem 5.1
      asserts poly(n) oracle calls FOR ALL instances, and if the call count were
      allowed to depend on the instance the uniform claim would fail; that is
      outside this hypothesis and is named as outside rather than omitted.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that a lattice constructed by THIS DERIVED linear system, at
        four toy degrees, over ONE instrument lineage, has the four invariants
        Proposition 4.5 forces, and (if Stage 4 runs) that a key can be
        recovered from it and certified at n <= 16. It CANNOT certify
        Proposition 4.5 itself (that is a theorem about all n), cannot certify
        Theorem 5.1 (a statement about a block-reduction algorithm this contract
        does not implement), cannot produce any cost, exponent or gate figure,
        and cannot say anything whatever about HAWK-512 or HAWK-1024. AGENTS.md
        rule 7 governs every citation.
      nearby_object_control: >-
        THREE, in increasing distance, and each has a pre-derived forced value.
        (i) NEAREST AND MOST ADVERSE: Q'' = U* Q U with U in GL_2(R) whose
        determinant is a non-trivial unit of R. This is still a genuine Gram
        matrix of a rank-2 module -- same shape, same size, same positivity --
        but breaks the det = 1 normalisation that step 1 used. The hoped-for
        conclusion MUST FAIL here: the corresponding cocycle does not satisfy
        the adj-pattern, so PC-1 must fail on this arm. An instrument that
        passes PC-1 on it is responding to Q being Hermitian and not to B being
        unimodular, and has not identified the load-bearing structure.
        (ii) A random Hermitian positive-definite Q' of matched entry size with
        no factorisation B* B: predicted rank strictly below n, and predicted 0.
        (iii) The graded perturbation Q_e = Q + e E, e in {0,1,2,4,8}: rank must
        DECAY in e. A rank that does not decay as the parameter meant to destroy
        the structure grows is the canonical artifact tell of
        docs/inventor-protocol.md section 3 and voids the instrument.
    proof_obligations:
      - claim: >-
          The derived linear system has Z-kernel of rank exactly n at every
          tested n (F1).
        responsibility: correctness
      - claim: >-
          V_tau computed from the secret lies in that kernel with squared length
          exactly n/4 and V_tau == I (mod 2) (PC-1).
        responsibility: completeness
      - claim: >-
          det Y lies in F for a basis of the kernel, so Tr_{F/Q}(det Y) is the
          right form (CHK-3), and the Gram matrix is positive definite (CHK-4).
        responsibility: interface
      - claim: >-
          The forced values F2, F3, F4 are the correct consequences of the
          claimed isometry, recomputed independently.
        responsibility: baseline
      - claim: >-
          The null arms cannot pass: rank < n on random Hermitian Q', PC-1 fails
          on the unit-determinant twist.
        responsibility: soundness
      - claim: >-
          Nothing here transfers to n in {256, 512, 1024}, to any cost figure,
          or to any statement about HAWK's security; the gap is stated on every
          citation.
        responsibility: scope
      - claim: >-
          Enumeration node budget exhaustion is reported as infrastructure, not
          as a negative result.
        responsibility: runtime
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. THIS HYPOTHESIS ADVANCES NO COMPLEXITY CLAIM OF ANY KIND.
    It checks the input to someone else's asymptotic claim at four toy degrees.
    It makes no system easier to solve, moves no exponent, and adds no attack.
    dominated_by is not applicable because no Pareto point is offered;
    sota_delta is zero on every attack axis (time, memory, data, queries,
    advice). The disclosed attack's own reported exponent, 2^{(n/2+1)+o(n)} with
    the provable [ADRS15] sieve, is RELAYED AND UNVERIFIED and is neither
    adopted nor contested here.

  heuristic_assumptions:
    - id: HEUR-HAWK-1
      formal_statement: >-
        The derived conditions -- {tau(a) = d, tau(d) = a, tau(b) = -b,
        tau(c) = -c} together with Q Y = ((c tau)(Y))^T tau(Q) -- define exactly
        the lattice Lambda_B^(tau) of the source's Lemma 4.3, i.e. they are both
        sound (every solution is in the source's lattice) and complete (the
        source's lattice contains no further constraint).
      random_model_justification: >-
        NOT A DISTRIBUTIONAL ASSUMPTION AND NO RANDOM MODEL APPLIES; it is an
        identification claim between a derived object and an unread one. The
        support for it is that each ingredient is forced: V tau(V) = I and
        det V = 1 follow from B in SL_2(R), and the linearisation of
        tau(Q) = V* Q V is algebra. WHAT IS NOT SUPPORTED is exhaustiveness --
        the source's "two conditions" (transcription) may be a different pair,
        and a missing constraint would leave the kernel at rank 2n rather than
        n. THIS IS THE WEAKEST LINK IN THE RECORD.
      supporting_results: []
      validation_experiment_ids: [EXP-HAWK-a2f34a]
      falsification_condition: >-
        MEASURED FIRST AND REPORTED BEFORE ANY OTHER NUMBER. PC-1 at n = 4: if
        V_tau is not in the kernel, or its squared length is not n/4, HEUR-HAWK-1
        is refuted, the contract STOPS, and no statement about Proposition 4.5
        is made. Separately, F1 returning 2n rather than n is the signature of a
        missing constraint specifically, and the report must distinguish that
        from F1 returning any other value.
    - id: HEUR-HAWK-2
      formal_statement: >-
        For every Y in Lambda_B^(tau), det Y is fixed by complex conjugation as
        well as by tau, hence lies in F = K^{<c,tau>}, so
        Tr_{F/Q}(det Y) = Tr_{K/Q}(det Y)/4 is well defined and equals the
        source's length form.
      random_model_justification: >-
        None applies; it is an algebraic claim. tau-invariance IS derived
        (step 3). c-invariance is NOT, and must come from the public condition
        of step 2 if it comes from anywhere. Recorded as an assumption rather
        than papered over.
      supporting_results: []
      validation_experiment_ids: [EXP-HAWK-a2f34a]
      falsification_condition: >-
        CHK-3: compute c(det Y) - det Y exactly for every element of an HNF
        basis at every n. A single non-zero difference refutes HEUR-HAWK-2, and
        the contract must then re-derive the length form from step 2 BEFORE
        comparing any forced value -- not adjust the forced values to fit.
    - id: HEUR-HAWK-3
      formal_statement: >-
        The four invariants F1-F4 are INDEPENDENT OF THE SECRET B at fixed n,
        i.e. constant over the 20 declared draws per n.
      random_model_justification: >-
        This is Proposition 4.5's own content restated as a measurable
        invariance, and it is the assumption whose failure would be most
        informative. No random model is invoked: the prediction is exact
        constancy, not concentration, so a single deviation refutes it and no
        distributional tolerance is available or wanted.
      supporting_results: []
      validation_experiment_ids: [EXP-HAWK-a2f34a]
      falsification_condition: >-
        Any variation of any of F1-F4 across the 20 draws at any n. Reported
        BEFORE the comparison against the pre-declared values, so that
        key-to-key spread is known before model error is discussed -- the
        ordering H-SDEG-0dd021 established for this program.

  structural_ingredients:
    - description: >-
        The second order-2 Galois involution tau : zeta -> -zeta of a 2-power
        cyclotomic field, and the cocycle V = B^{-1} tau(B) it induces.
      citation: >-
        KN-LIT-7592, read at abstract/introduction level only; the construction
        itself is re-derived in this record from B in SL_2(R) and Q = B* B. No
        lemma number is asserted as read.
      role: supplies the lens and the object being tracked
    - description: >-
        The linearisation identity (V*)^{-1} = ((c tau)(V))^T, valid because
        V^{-1} = tau(V) and c commutes with tau.
      citation: >-
        Derived in this record. Elementary; requires no literature.
      role: turns a quadratic constraint on V into a Z-linear one, which is what
        makes the lattice publicly computable
    - description: >-
        Theta-series arithmetic of an orthogonal sum of two scaled integer
        lattices.
      citation: >-
        Elementary; recomputed in this session. No source cited and none needed.
      role: converts the isometry claim into four exactly checkable integers
    - description: >-
        Ducas's block reduction for (near-)hypercubic lattices [Duc23; BN24] and
        the van Gent-Pulles descent [GP25].
      citation: >-
        NOT READ. Named in KN-LIT-7592 and in the transcription; NEITHER SOURCE
        WAS OBTAINED BY THIS SESSION, and note that KN-LIT-7673 (the van
        Gent-Pulles entry) is cited by four records in this repository while NO
        FILE knowledge/literature/KN-LIT-7673.md EXISTS on this branch. Neither
        algorithm is used by this hypothesis: Stage 4's optional recovery uses
        brute-force enumeration at n <= 16 in their place, which is honest at
        toy scale and useless at any other.
      role: named as the downstream consumers of the shape claim, and explicitly
        NOT relied upon

  reduction_chain:
    core_problem: >-
      Decide, by exact integer computation from the public key alone, whether
      the cocycle lattice of a HAWK-shaped instance has the four invariants that
      the reported near-hypercubic isometry forces.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. There is no reduction from this check to any statement
      about HAWK at deployed parameters, about the SVP dimension, or about any
      cost, and none is claimed. A confirmation corroborates the INPUT to
      Theorem 5.1 at four toy degrees; it does not corroborate Theorem 5.1,
      whose content is about a block-reduction algorithm that this contract does
      not implement. Any citation toward a cost or a security level must carry
      that gap explicitly.

  predictions:
    - metric: >-
        G1 -- PC-1, the positive control: fraction of the 20 declared keys per n
        for which V_tau lies in the constructed lattice with
        Q^(tau)(V_tau) = n/4 and V_tau == I (mod 2), at n = 4, 8, 16, 32
      direction: different
