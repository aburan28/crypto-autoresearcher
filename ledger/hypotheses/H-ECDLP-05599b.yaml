  design_note: >-
    DESIGN ONLY. The mathematical content - the definitional split between
    ideal invariants and generating-set invariants, the exactly-matched null
    with an identical ideal, and the two-way outcome rule - is the
    idea-generator's. The Coordinator's own contribution is the
    planted-generator ladder that gives the graded-rank engine a demonstrated
    dynamic range at known effect sizes, and the curve-free arm with a
    pre-declared consequence. No status of any record is changed and nothing
    here is evidence.

  statement: >-
    TEST BOUNDARY FIRST. This is an INSTRUMENT CALIBRATION at toy scale
    (prime fields, short Weierstrass, m = 2 with m = 3 optional, B at most
    32, p at most 2^16, one frozen monomial order). It is not a mathematical
    result about the ECDLP or about summation polynomials, it is not a cost
    model, and it moves no exponent in either direction.

    THE DEFINITIONAL SPLIT, PROVED IN ONE LINE RATHER THAN CITED. The reduced
    Groebner basis of an ideal in a fixed monomial order is an invariant of
    the pair (ideal, order). The SOLVING DEGREE of a system F - the largest
    degree reached while computing a Groebner basis of F - is NOT, and the
    counterexample is uniform: let I have reduced basis G in the chosen
    order and let F generate I with max_deg(F) large; then F' = F union G
    generates the SAME ideal I and has solving degree at most max_deg(G),
    which can be arbitrarily smaller. So solving degree, first fall degree,
    last fall degree and the whole graded Macaulay rank filtration are
    invariants of the GENERATING SET, not of the ideal. An ideal-invariant
    argument therefore cannot settle the quantity this question is named
    after, and this record's first content is that the two must be reported
    separately.

    THE EXPERIMENT THE SPLIT MAKES AVAILABLE. Take F_sem = (S_3(x1,x2,xR),
    fV(x1), fV(x2)). Construct F_null = (r(x1,x2), fV(x1), fV(x2)) with r
    drawn uniformly from the 9-dimensional space of bidegree-(2,2)
    polynomials subject to r(v_i,v_j) = 0 on exactly the cells of the
    solution set Z and r nonzero on every other grid cell. Then F_sem and
    F_null generate the IDENTICAL IDEAL - not a similar one, the same one -
    so their reduced bases, staircases, quotient dimensions and
    trivial-ideal flags agree exactly and carry ZERO discriminating power BY
    CONSTRUCTION. Every remaining difference is a pure generating-set effect,
    with the two arms matched in variable count, generator count, multidegree
    support and exact solution set.

    THE PRE-REGISTERED TWO-WAY OUTCOME, BOTH BRANCHES DECISION-BEARING.
    OUTCOME I, CONTROLLED NULL - the graded rank filtrations agree at every
    degree in at least 95 percent of at least 200 cells, and the last fall
    degrees agree in at least 95 percent. Then no observable available to
    this encoding distinguishes the Semaev polynomial from an arbitrary
    bidegree-(2,2) polynomial with the same zeros; the lane's numerator is a
    statistic of the point set Z and the membership degree B; and the answer
    to the decision target is REDESIGN with a derivation attached rather than
    a scaling study.
    OUTCOME II, SEPARATION - the filtrations differ at one or more degrees in
    at least 20 percent of cells, in a consistent direction in at least two
    thirds of those cells. Then the difference IS the Semaev-specific
    content, isolated from the point set for the first time, and the lane has
    a legitimate numerator whose scaling in B is worth fitting - conditional,
    stated in advance, on it being a GENERATING-SET-SPECIFIC number reported
    with the solver and order frozen and never quoted as an ideal invariant.
    An intermediate result is reported as intermediate and settles nothing,
    which is a permitted and disclosed outcome.

    WHAT IS NOT CLAIMED. No attack, no exponent, no hardness claim. Outcome
    II would be a distinguisher between two generating sets, never an
    algorithm; converting a distinguisher into a cost advantage requires a
    separate argument this record does not supply and does not gesture at.
    No status change to any record is proposed or implied.

  mechanism: >-
    THE TRACKED OBJECT is the graded piece of the ideal generated so far: the
    F_p-vector space V_D(F) inside S_D spanned by all products (monomial of
    degree D - deg g) times g over generators g in F with deg g at most D.
    The object is the FILTRATION D maps to dim V_D(F), and its one-step
    propagation is exactly defined and exactly measurable, because V_{D+1}
    contains S_1 times V_D and the quantity of interest is the EXCESS,
    dim V_{D+1} - dim(S_1 times V_D), which is where a degree fall shows up
    as a drop in the leading forms.

    THE LOSSY-PROJECTION TEST, APPLIED. The projection F maps to
    (dim V_D(F))_{D <= D_max} is genuinely lossy: it forgets every
    coefficient, forgets which generator contributed which row, forgets the
    curve and the target, and above all forgets the ideal above degree D_max
    - which is precisely the information the reduced Groebner basis retains
    and this object throws away. It is lossy in the OPPOSITE DIRECTION from
    the ideal-level object of the sibling record, which is why the two do not
    collide. What is discarded is discarded COMPATIBLY with the operation
    driving the computation, because multiplication by degree-one forms maps
    V_D into V_{D+1}, so the retained part propagates deterministically one
    degree at a time - exactly one step of any F4-style algorithm.

    WHY THE MATCHED NULL IS CONSTRUCTIBLE. The bidegree-(2,2) space is
    9-dimensional; imposing vanishing at the |Z| cells of Z is |Z| linear
    conditions and |Z| is at most 3 at these parameters, so at least a
    6-dimensional family survives. Requiring non-vanishing on the remaining
    B^2 - |Z| cells excludes a union of hyperplane slices and is satisfied by
    a uniformly random member with probability at least 1 - (B^2 - |Z|)/p,
    checked per draw and resampled on failure. So the matched null exists, is
    cheap, and is matched on the four things that could otherwise confound -
    variable count, generator count, multidegree support and solution set.

    WHY THIS IS THE CHEAPEST VALID DISCRIMINATOR FOR THE LANE'S DECISION
    TARGET. The question asks whether a frozen protocol yields a cost model
    suitable as an index-calculus numerator. Under Outcome I no protocol over
    this encoding can, at any scale, because the quantity being fitted is a
    function of Z and B and the summation polynomial is not in it. That
    verdict is reachable at toy scale for minutes of compute, before any
    larger protocol is approved, and it is reachable in NO other way: a
    scaling study that finds a clean power law cannot tell whether the law is
    about Semaev or about interpolation.

  assumptions:
    - >-
      p > 3, E non-singular short Weierstrass over F_p, factor base of
      DISTINCT on-curve x-coordinates, affine target. Distinctness is checked
      per cell, not assumed: it is the precondition that makes the two arms
      share an ideal.
    - >-
      The matched null exists at each cell, i.e. the linear conditions admit
      a solution nonzero on every other grid cell. Checked per draw and
      resampled, capped at 100 draws; a cell where no such r is found is
      recorded as a FAILED CONSTRUCTION and reported, never silently dropped.
    - >-
      Graded ranks are computed by EXACT linear algebra over F_p, never
      inferred from a computer-algebra termination event.
    - >-
      The monomial order is frozen before any cell runs. Grevlex is primary;
      lex is a sensitivity arm only and no conclusion is drawn from a single
      order.
    - >-
      The absolute value of a measured last fall degree in this encoding is
      uninformative, because the membership generators floor it at B for
      reasons unrelated to the summation polynomial. Only DIFFERENCES between
      matched arms are interpretable and no absolute value is reported as a
      result.

  proof_search_map:
    bottleneck: >-
      The step "read a solving degree, first fall degree or Macaulay rank
      profile off the decomposition system and treat it as the numerator of
      an index-calculus cost model". Removing that step, or establishing that
      its output does not depend on the summation polynomial, changes the
      meaning of every number this question intends to produce while changing
      no mathematics.
    baseline_embedding:
      parameter_slice: >-
        Two exact slices. (i) B = 1: the system is (s(x1,x2), x1 - v,
        x2 - v) and the whole filtration is computable by hand in both arms;
        the two arms MUST agree because the ideal is generated in degree 1
        either way, and an instrument reporting a difference here is broken.
        (ii) The univariate edge m = 1, system (S_2(x1,xR), fV(x1)), where
        the answer is a gcd degree the instrument must reproduce.
      reproduction_check: >-
        A frozen regression fixture - the exact instance, seed, factor base
        and target of an existing committed run in this family - with the
        harness-reported reduced basis reproduced by the graded rank engine's
        own Groebner path, and the two arms verified to produce the SAME
        reduced basis before any filtration is compared. If they do not, the
        structure theorem underlying the design fails at that cell, the
        design is void there, and that is checked FIRST at zero extra cost.
    observation_collision:
      observable: >-
        The graded rank filtration (dim V_D)_{D <= D_max} of the generating
        set, with the derived last fall degree and solving degree, in the
        frozen order.
      distinct_preimage_search: >-
        THIS RECORD IS THE COLLISION SEARCH, in the sharpest available form.
        Two distinct ground-truth objects - the Semaev system and a random
        bidegree-(2,2) system - are constructed to have the SAME IDEAL, hence
        the same reduced basis, and the search is for whether the filtration
        separates them. A collision (Outcome I) directly falsifies
        identifiability of Semaev structure from any Groebner observable in
        this encoding and is a first-class deliverable. A separation (Outcome
        II) establishes identifiability at the generator level and bounds it
        quantitatively. There is no design in which this measurement returns
        nothing.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the ideal-level observable fixed - reduced basis, staircase,
          quotient dimension, trivial flag, all exactly equal by construction
          - and vary the forgotten structure, the generating set. Then look
          for an intrinsic invariant of the generating set that separates the
          two preimages. The candidate is the graded rank filtration and its
          derived last fall degree, chosen because the last fall degree is
          order-independent and therefore not an artifact of the frozen order.
        predicted_gain: >-
          Either an exhibited invariant separating Semaev from a matched
          random generator, or a demonstrated collision that closes the
          lane's observable set. No attack exponent moves on either branch.
      - transform: stronger_invariant
        proposed_object: >-
          Replace the single integer "solving degree" by the whole filtration
          and the excess sequence dim V_{D+1} - dim(S_1 times V_D). A single
          integer can coincide by accident; a filtration of length 2B
          coinciding at every degree is a much stronger statement and its
          failure at one degree is a much finer signal.
        predicted_gain: >-
          Converts a two-integer comparison of unknown power into a
          multiple-degree paired comparison with a well-defined per-degree
          effect size and a paired confidence interval.
    quantifier_order: >-
      Two claims at deliberately different strengths.
      CLAIM A, DEFINITIONAL AND PROVED HERE - THERE EXIST an ideal I, an
      order, and two generating sets F, F' of I with solving degree of F
      strictly greater than that of F'. Witness given by adjoining the
      reduced basis. This is an EXISTS statement and nothing stronger is
      claimed from it; it establishes only that an ideal-invariant argument
      cannot settle a generator-level quantity.
      CLAIM B, THE MEASURED ONE - FOR ALL primes in the tested ladder, FOR
      ALL tested curves, FOR ALL factor bases of distinct rational
      x-coordinates in the tested sizes, FOR ALL affine targets with |Z| in
      the tested strata, and for the frozen order, the filtration of F_sem
      EQUALS (Outcome I) or DIFFERS FROM (Outcome II) that of F_null. The
      dangerous weaker reading, NOT claimed, is "there exists a random
      generator with a different filtration", which is vacuous because the
      degree-unmatched arm supplies one by construction. The content is
      UNIFORMITY over the matched family at fixed bidegree.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Over the tested prime ladder, curve set, factor-base sizes and
        frozen order, the graded rank filtration of the toy Semaev
        decomposition system is / is not distinguishable from that of a
        bidegree-matched, zero-set-matched random system." It can NEVER
        certify anything about a different monomial order beyond the
        sensitivity arm, about a production F4 or F5 implementation's
        internal degrees, about untested p or B, about higher arities, or
        about the ECDLP. It cannot certify that an observed separation is
        exploitable.
      nearby_object_control: >-
        THE DEGREE-UNMATCHED INTERPOLATED NULL, and it is blocking. Its
        generator has bidegree up to (B-1, B-1) and generates the same ideal,
        so any instrument with power must separate it from F_sem. If the
        instrument reports NO separation there, it has no power at all,
        Outcome I would be unreadable, and the correct conclusion is
        INSTRUMENT FAILURE rather than a controlled null. A second nearby
        object, weaker but free: the same Semaev generator with x1 and x2
        swapped, which must produce an IDENTICAL filtration by symmetry and
        catches a class of implementation bugs.
    proof_obligations:
      - claim: "F_sem and F_null generate the same ideal whenever their grid vanishing sets coincide and fV is squarefree."
        responsibility: correctness
      - claim: "Solving degree is not determined by the ideal and the order."
        responsibility: strictness
      - claim: "A bidegree-(2,2) polynomial vanishing exactly on Z within the grid exists with probability at least 1 - (B^2 - |Z|)/p per uniform draw."
        responsibility: feasibility
      - claim: "The graded rank engine reproduces the gcd answer at m = 1 and the hand answer at B = 1."
        responsibility: baseline
      - claim: "The degree-unmatched arm separates, establishing that the instrument has power."
        responsibility: interface
      - claim: "Each planted redundant generator of degree d raises dim V_d by exactly 1 and changes no dim V_D for D < d."
        responsibility: size
      - claim: "The reported effect size has a stated per-degree resolution and a paired confidence interval, not a single mean."
        responsibility: size
      - claim: "Every Macaulay matrix stays inside the declared column and memory contract, enforced by a pre-flight count that aborts before allocation."
        responsibility: memory

  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. NO ATTACK EXPONENT IS CLAIMED; this record proposes no
    algorithm. What it could CHANGE is the MEANING of the lane's numerator:
    under Outcome I the numerator is a function of |Z| and B only, and the
    unconditional enumerative oracle at 2^{m-1} B^{m-1} group operations plus
    the B^{ceil(m/2)} meet-in-the-middle already dominate it, so the
    algebraic route contributes nothing; under Outcome II the numerator
    retains a generating-set-specific term whose B-scaling becomes the
    quantity to fit, and whether it beats B^{m-1} is a SEPARATE question this
    record does not answer. Pollard rho at 0.886*sqrt(N) with O(1) memory
    remains the prime-field baseline and is untouched.

  heuristic_assumptions:
    - id: HEUR-SDEG-1
      formal_statement: >-
        For a factor base V of B distinct rational x-coordinates and a target
        R with |Z| at most 3, a polynomial drawn uniformly from the
        9-dimensional F_p-space of bidegree-(2,2) polynomials, conditioned on
        vanishing at the |Z| cells of Z, is nonzero at every one of the
        remaining B^2 - |Z| grid cells with probability at least
        1 - (B^2 - |Z|)/p.
      random_model_justification: >-
        The RIGOROUS ingredient is exact and elementary: the evaluation map
        from the bidegree-(2,2) space to F_p at a fixed grid cell is
        F_p-linear and, restricted to the subspace vanishing on Z, is either
        identically zero or surjective; when surjective its kernel is a
        hyperplane of density exactly 1/p, so the union bound over the
        remaining cells is exact and not asymptotic. The classical statement
        imitated is the Schwartz-Zippel bound. THE HEURISTIC CONTENT is only
        that the evaluation is not identically zero on the conditioned
        subspace, which fails exactly when a grid cell is forced to vanish by
        the |Z| conditions - a degenerate configuration DETECTED per cell
        rather than assumed away.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-ecc607]
      falsification_condition: >-
        The observed rejection rate departs from (B^2 - |Z|)/p per draw by a
        binomial test at the 1 percent level in more than 5 percent of cells,
        or any cell rejects all 100 draws without that cell being reported
        individually as a forced-vanishing configuration.
    - id: HEUR-SDEG-2
      formal_statement: >-
        The exact graded rank of the degree-D Macaulay matrix over F_p, as
        computed by the engine, equals the dimension of the degree-D graded
        piece of the ideal generated by the input system, for every D at most
        D_max and every cell in the declared envelope.
      random_model_justification: >-
        This is an IMPLEMENTATION property, not a mathematical one, and it is
        recorded as a heuristic because this program has standing reason to
        test rather than trust it - a confirmed harness defect in this exact
        module previously sat on the result path of 21 archived runs. The
        rigorous anchor is that the graded piece is a well-defined
        F_p-vector space whose dimension is order- and
        implementation-independent, so two correct implementations must agree
        exactly, which converts the assumption into a testable equality.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-ecc607]
      falsification_condition: >-
        Any disagreement between the engine and an independent
        exact-linear-algebra path on the 20-cell subsample, or a failure to
        reproduce the m = 1 gcd edge or the B = 1 hand cell exactly. Such a
        disagreement is an INSTRUMENT FAILURE and is reported as such, never
        as a finding about solving degree.
    - id: HEUR-SDEG-3
      formal_statement: >-
        Conditional on Outcome II, the paired difference Delta_lf between the
        matched arms behaves, across cells at fixed (p, B, |Z|), like
        independent draws from a fixed distribution with finite variance, so
        a bootstrap confidence interval on its median has nominal coverage.
      random_model_justification: >-
        The RIGOROUS ingredient is the pairing itself: both arms run on the
        SAME curve, factor base, target and ideal, so every cell-level
        nuisance parameter cancels within the pair by construction. The
        classical statement imitated is ordinary bootstrap consistency for a
        median of i.i.d. draws. THE HEURISTIC CONTENT is independence ACROSS
        cells, which is not guaranteed because cells share curves and seeds.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-ecc607]
      falsification_condition: >-
        The blocked bootstrap (resampling whole curves) and the naive cell
        bootstrap differ by more than a factor 1.5 in interval width, in
        which case the naive interval is DISCARDED and only the blocked one
        is reported.

  structural_ingredients:
    - description: >-
        A rigorous framework relating the solving degree, the last fall
        degree, the degree of regularity and the Castelnuovo-Mumford
        regularity of a polynomial system, used here for the existence of
        that framework and for the fact that these are invariants OF A
        SYSTEM. The abstract page does NOT state whether the solving degree
        depends on the generating set; that fact is used here only via the
        self-contained one-line argument, not on this paper's authority.
      citation: "arXiv:2112.05579 (Caminata and Gorla)"
      provenance: retrieved
      verified_by: >-
        idea-generator of IDEA-20260830-ad0be4, which records a WebFetch of
        the arXiv ABSTRACT PAGE ONLY on 2026-08-30; the full PDF was not
        retrieved and no theorem statement, numbering or proof was inspected.
        RELAYED, NOT RE-FETCHED by coordinator TASK-20260904-ae82ce.
      role: names the classical invariants this record does not improve
    - description: >-
        The last fall degree is MONOMIAL-ORDER-INDEPENDENT, unlike the degree
        of regularity, and yields complexity bounds for system solving. The
        corpus entry also carries a standing consequence: no proposal may
        claim as new that Weil-descended Semaev systems violate the
        semi-regular prediction without citing it and stating what it adds.
        THIS RECORD MAKES NEITHER SUCH CLAIM - it works over prime fields,
        not over a Weil descent, and claims no deficit.
      citation: KN-LIT-7607
      provenance: internal
      verified_by: >-
        idea-generator of IDEA-20260830-ad0be4, which records reading
        knowledge/literature/KN-LIT-7607.md in full (80 lines) on 2026-08-30,
        including its own note that the paper's full text was not read by
        that entry either. RELAYED, NOT RE-READ by coordinator
        TASK-20260904-ae82ce.
      role: >-
        justifies reporting the last fall degree as the headline and the
        solving degree per order, never pooled
    - description: >-
        The m = 2 structure theorem establishing that a bidegree-(2,2)
        generator with the same grid vanishing set generates the identical
        ideal, so the reduced basis, staircase, quotient dimension and
        trivial-ideal flag are all determined by the point set Z. This is
        what makes the exactly-matched null constructible at all.
      citation: IDEA-20260829-bdca13
      provenance: internal
      verified_by: >-
        idea-generator of IDEA-20260830-ad0be4, which records reading
        ledger/proposals/IDEA-20260829-bdca13.yaml in full (698 lines) on
        2026-08-30. RELAYED, NOT RE-READ by coordinator TASK-20260904-ae82ce.
        Because the entire design is void if this theorem fails at a cell,
