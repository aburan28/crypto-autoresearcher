  reduction_chain:
    core_problem: >-
      Whether any Groebner observable available to the current toy encoding
      of prime-field point decomposition depends on the summation polynomial
      at all, once the point set is held exactly fixed.
    corollaries: []
  reduction_chain_note: >-
    Deliberately empty. Outcome I would close the OBSERVABLE SET of this
    encoding; it would not close the open question of how the solving degree
    grows for prime-field summation-polynomial systems, and no reduction to
    that question is claimed.

  predictions:
    - metric: "equality of the reduced Groebner bases of F_sem and F_null at matched Z; boolean per cell"
      direction: same
      minimum_effect: >-
        FORCED IDENTICAL, polynomial by polynomial, in 100 percent of cells
        with a squarefree factor base. This is not a hypothesis, it is the
        PRECONDITION of the experiment. A single inequality means the
        structure theorem fails at that cell and the record commits in
        advance to reporting THAT instead of the intended comparison.
    - metric: >-
        per-degree agreement of the graded rank filtrations of F_sem and
        F_null over the degree range 0..2B, paired within cell; dim V_D is an
        integer F_p-vector-space dimension
      direction: different
      minimum_effect: >-
        NO DIRECTION IS PRE-COMMITTED - this is the unknown the record exists
        to measure, and pre-committing a direction would be dishonest. What
        IS pre-committed is the decision rule: OUTCOME I when the filtrations
        agree at every degree in at least 95 percent of at least 200 cells,
        with the disagreeing cells listed individually; OUTCOME II when they
        disagree at one or more degrees in at least 20 percent of cells with
        a CONSISTENT direction in at least two thirds of those; anything else
        INTERMEDIATE, which settles nothing and is a disclosed outcome.
    - metric: >-
        Delta_lf = last fall degree of F_null minus last fall degree of
        F_sem; integer DEGREES, resolution 1
      direction: different
      minimum_effect: >-
        Minimum reportable effect is a paired median |Delta_lf| >= 1 with a
        bootstrap 95 percent confidence interval excluding 0. A median of
        exactly 0 with an interval containing 0 is the quantitative form of
        Outcome I.
    - metric: "Delta_lf on the DEGREE-UNMATCHED interpolated arm; integer degrees"
      direction: higher
      minimum_effect: >-
        FORCED POSITIVE AND LARGE - at least B - 4 in at least 90 percent of
        cells with B >= 8, since the generator degree alone differs by B - 3.
        A near-zero value means the instrument cannot see generator degree
        and the line HALTS as an instrument failure. Blocking positive
        control.
    - metric: "Delta_lf under the variable-swap arm; integer degrees"
      direction: same
      minimum_effect: >-
        FORCED EXACTLY ZERO in 100 percent of cells, by symmetry of S_3. Any
        nonzero value is an engine bug and blocks every other number.
    - metric: >-
        planted-generator ladder: dim V_d and dim V_{d-1} of F_sem plus one
        redundant generator of degree d, against F_sem alone; integer
        dimensions
      direction: higher
      minimum_effect: >-
        FORCED EXACTLY +1 at degree d and EXACTLY 0 at every degree below d,
        for each planted d in the declared ladder, in 100 percent of cells.
        This is the graded dynamic-range demonstration: a defect of known
        size must fire at the predicted degree and nowhere else.
    - metric: >-
        scaling of Delta_lf with B at fixed p, and with p at fixed B,
        CONDITIONAL on Outcome II; fitted log-log slope, dimensionless
      direction: different
      minimum_effect: >-
        Reported as a fitted slope with a confidence interval in both
        variables, and ONLY if Outcome II is declared. Under Outcome I this
        metric is NOT REPORTED AT ALL: fitting a scaling law to a quantity
        that failed its own null is the failure mode this design exists to
        prevent.

  test_boundary:
    instances:
      - "p in {2^8, 2^10, 2^12} in scope, plus 2^14 and 2^16 as flagged out-of-scope calibration."
      - "8 curves with generic j-invariant, 5 seeds, at least 200 cells."
      - "Targets STRATIFIED so |Z| takes each of 0, 1, 2, 3 at least 40 times."
      - "Arms: F_sem; F_null (degree- and zero-set-matched); the degree-unmatched interpolated null; the variable-swap arm; a sparsity-matched null; the planted-generator ladder; the curve-free arm."
      - "m = 3 is OPTIONAL and runs only if the m = 2 grid is clean, so a memory or instrument problem at m = 3 cannot invalidate the m = 2 result."
    parameters:
      m: 2
      B: "{4, 8, 16, 32}"
      D_max: "2B at m = 2"
      order: "grevlex primary; lex on a 10 percent subsample as a sensitivity arm"
      planted_generator_degrees: "{3, 5, 9, B-1}"
    implementation: >-
      An exact graded rank engine over F_p: construct the degree-D Macaulay
      matrix by multiplying each generator by every monomial of complementary
      degree, take EXACT rank, emit dim V_D for D = 0..D_max. NO
      computer-algebra termination event is used anywhere. A pre-flight
      column-and-row count runs before every allocation.
    budget: >-
      See EXP-ECDLP-ecc607. At m = 2 the ambient is bivariate, so degree D
      has exactly binom(D+2,2) monomials; at the worst declared cell B = 32,
      D_max = 64 that is 2145 columns and at most about 6500 rows, roughly
      56 MB dense at 4 bytes per entry. At m = 3, B = 8, D_max = 24 it is
      binom(27,3) = 2925 columns and about 8000 rows, roughly 94 MB.

  falsification_conditions:
    - >-
      The two arms produce DIFFERENT reduced Groebner bases at any squarefree
      cell. The structure theorem fails there, the design is void, and the
      finding is about the theorem or the implementation rather than about
      solving degree.
    - >-
      The degree-unmatched arm shows |Delta_lf| below 1 in more than 10
      percent of cells with B >= 8. The instrument cannot see generator
      degree; the line HALTS as an instrument failure and NO controlled null
      may be declared from it.
    - >-
      The variable-swap arm shows any nonzero difference. Engine bug; every
      other number in the run is inadmissible.
    - >-
      Any planted redundant generator fails to raise dim V_d by exactly 1 at
      its own degree, or changes any dimension below it. The engine's
      per-degree resolution is not what the design assumes and no per-degree
      claim may be made.
    - >-
      OUTCOME I - filtrations agree at every degree in at least 95 percent of
      cells WHILE the degree-unmatched arm separates cleanly. No Groebner
      observable in this encoding carries summation-polynomial information;
      the lane's numerator is a function of Z and B; the answer to the
      decision target is REDESIGN with a derivation attached.
    - >-
      OUTCOME II - filtrations separate under the pre-registered rule. The
      Semaev generator carries generator-level information that survives the
      exactly matched null, and Delta_lf's scaling in B becomes the quantity
      to fit.
    - >-
      An intermediate result under the pre-registered rule. Reported as
      settling nothing, with the cell-level pattern published, and explicitly
      NOT converted into a scaling fit.
    - >-
      Delta_lf nonzero but not decaying as B grows while |Z| is held fixed. A
      signal that does not decay when the parameter meant to dilute it
      increases is the canonical artifact tell and MUST be reported as
      suspected artifact before it is reported as signal.
    - >-
      Any timeout, crash, or aborted cell. INFRASTRUCTURE outcome under
      AGENTS.md rule 5, never negative mathematical evidence.

  interpretation_limits:
    - >-
      INSTRUMENT CALIBRATION, not a mathematical result about the ECDLP or
      about summation polynomials, and not a cost model. Outcome II is a
      distinguisher between two generating sets, never an algorithm.
    - >-
      Every number here is a property of a GENERATING SET, a monomial order
      and an exact-rank convention. It must never be quoted as an invariant
      of the ideal; a downstream citation that drops the generating set is a
      claim-tier violation.
    - >-
      "Solving degree" here means an EXACT GRADED RANK threshold, not what a
      production F4 or F5 would reach. A real solver with degree falls can
      terminate below it and this record must never claim otherwise.
    - >-
      Absolute values are floored at B by the encoding, so only differences
      are interpretable, and the floor is disclosed in every downstream
      summary.
    - >-
      Scoped to m = 2 (m = 3 optional), prime fields, short Weierstrass,
      squarefree completely split membership, B at most 32, p at most 2^16,
      the frozen order. Nothing transfers to extension fields or to
      cryptographic scale, and no extrapolation is licensed.
    - >-
      Outcome I would close the OBSERVABLE SET of this encoding, not the open
      question of how the solving degree grows. What Outcome I establishes is
      that the current encoding cannot answer that question because its
      observables do not depend on the summation polynomial.
    - >-
      The paired contract carries a CURVE-FREE ARM with a pre-declared
      consequence, because the entire measurement is on an ideal in
      F_p[x1,x2] and a random bidegree-(2,2) system with a random grid could
      reproduce the whole signature.
    - >-
      NO STATUS CHANGE to any record is proposed or implied.

