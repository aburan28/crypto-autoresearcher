      role: enables the exactly-matched null
    - description: >-
        The measured system is [s3_expr(a,b).subs(x3, xR), fV1, fV2] with
        grevlex over F_p, and s3_expr has bidegree (2,2) in (x1,x2) after
        substituting x3 = xR - which is what makes the degree-matched null
