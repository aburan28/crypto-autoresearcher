hypothesis:
  id: H-PATH-89d1d0
  question_id: RQ-RELN-001

  statement: >-
    SCOPE: the frozen interface of the bounded-degree algebraic factor-base
    theorem (ideas/artifacts/IDEA-20260801-021/
    bounded_degree_factor_base_theorem.md, Theorems 1, 1G, 2, 3) and the open
    universal question KN-OPEN-020, examined against two external
    index-calculus families. CLAIM TIER: derivation for the counting
    statements, toy for every measured cell. NO ATTACK, NO ALGORITHM, NO
    EXPONENT MOVED, NO PRIME-FIELD ECDLP CLAIM.
    THE CLAIM, IN THREE PARTS.
    (P1) EQUIVALENCE. Theorem 1G's hypothesis Delta^m <= N^{1-epsilon} is
      exactly chi <= 1 - epsilon, where chi := m*log(Delta)/log(N) is the
      COVERAGE EXPONENT, and Theorem 3's success bound reads
      Pr[T in mF] <= 2^C * N^{chi-1}. The no-go's entire quantitative content is
      the single scalar chi.
    (P2) THE SEPARATING PREDICATE IS chi, NOT "ALGEBRAIC DESCRIPTION". Evaluated
      on the two families where subexponential or sub-rho index calculus
      demonstrably exists:
        NFS rational side: F = {primes <= B}, arity m = u = log(M)/log(B) by the
          definition of B-smoothness, so chi = u*log(B)/log(M) = 1 IDENTICALLY,
          for every B.
        Gaudry/Diem over E(F_{q^n}): F = {P : x(P) in F_q}, |F| ~ q, m = n,
          N ~ q^n, so chi = n*log(q)/(n*log(q)) = 1 EXACTLY.
      Both factor bases ARE algebraically described. Therefore KN-OPEN-020's
      universal statement, quantified over "every algebraically described factor
      base", is FALSE AS QUANTIFIED, with NFS as an explicit witness; the
      theorem itself is NOT contradicted, because its hypothesis chi <= 1-epsilon
      excludes both witnesses. The bounded-degree prime-field family has
      chi = m*log(3d)/log(N) -> 0 (computed cells: 0.1533, 0.2300, 0.1014,
      0.0643 at (m,d,log2 N) = (2,10,64), (3,10,64), (4,30,256), (2,100,256)).
    (P3) THE MECHANISM IS AN INFORMATION RATE, NOT AN ALGEBRAIC PROPERTY.
      Define the DESCRIPTION DENSITY delta := |desc(F)| / |F| in bits per
      factor-base element. For a plane curve of degree d over F_p,
      |desc| = C(d+2,2)*log2(p) while Bezout caps |F| <= 3d, so
      delta >= (d+1)(d+2)log2(p)/(6d) ~ (d/6)*log2(p) - LINEAR in d. For NFS and
      Gaudry the entire predicate is O(log B) resp. O(log q) bits over an
      unbounded base, so delta -> 0. Raising d buys chi only LOGARITHMICALLY
      (chi = m log(3d)/log N) while costing delta LINEARLY. That trade is the
      obstruction's actual mechanism, and it is chargeable under KN-OPEN-020's
      own requirement that "description ... costs" be charged.
    THE CORRECTED OPEN QUESTION, WHICH THIS HYPOTHESIS DOES NOT ANSWER: is there
    a prime-field factor base with chi -> 1 and delta polylogarithmic, whose
    membership test and decomposition search are charged? Three escapes from the
    theorem's interface are named and NOT graded: tuple predicates (the
    summation polynomial is one, and single-point Bezout does not bound it);
    predicates on a cover, where the intersection with E is not a plane Bezout
    product; and a pulled-back size or valuation function playing the role NFS's
    archimedean "norm below B" plays - E(F_p) has no archimedean place, and that
    absence is the sharpest available statement of why the prime-field case is
    hard.

  mechanism: >-
    DERIVED HERE FROM THE THEOREM RECEIPT, WHICH WAS READ IN FULL. Every step is
    counting; nothing is imported from an unread source, and every recalled item
    is labelled.

    STEP 1 - THE INTERFACE, QUOTED. E/F_p a nonsingular geometrically
    irreducible plane cubic; G <= E(F_p) of prime order N = Theta(p); Z_p a
    target-independent projective locus sharing no component with the projective
    closure of E, with finite geometric intersection degree Delta_p; factor base
    F subset of G intersect (Ebar intersect Z_p)(F_p); descent of integer arity
    m_p using exactly m_p ordered factors with repetitions allowed; targets of
    min-entropy at least log2(N) - C. Theorem 1: Bezout gives
    sum_P I_P(Ebar, V(f)) = 3d, and every rational affine point of F contributes
    at least 1, so |F| <= 3d; the generalisation replaces 3d by Delta. Theorem 2:
    sigma : F^m -> G has image mF and |mF| <= |F|^m <= Delta^m. Theorem 3:
    Pr[T in mF] <= 2^C |mF| / N.

    STEP 2 - THE REWRITE. chi := log(Delta^m)/log(N) = m log(Delta)/log(N). Then
    Delta^m <= N^{1-epsilon} <=> chi <= 1-epsilon, and Theorem 3 becomes
    Pr[T in mF] <= 2^C N^{chi-1}. chi < 1 is the no-go; chi = 1 is the boundary
    it excludes; chi > 1 is coverage saturation, at which point Theorem 2's
    counting bound stops binding and only the ACTUAL image size matters. This
    step gains nothing on its own and the record says so; the gain is in
    STEP 3, where the same scalar is evaluated OUTSIDE the interface.

    STEP 3 - NEARBY OBJECT 1: NFS, WHERE THE CONCLUSION IS KNOWN FALSE. Rational
    side. F = primes <= B, |F| = pi(B) ~ B/ln B. A relation is an integer of
    size ~M that factors completely over F. The arity is NOT bounded
    independently of the target: an integer of size M that is B-smooth is a
    product of about u = log M / log B elements of F with multiplicity, and u is
    exactly the parameter the sieve optimises. Substituting Delta ~ B and m = u,
      chi_NFS = (log M/log B)(log B)/(log M) = 1.
    IDENTICALLY, FOR EVERY B. The tighter, non-counting version agrees: the count
    of B-smooth integers up to M is Psi(M,B) = M*rho(u)(1+o(1)) with
    log rho(u) = -u log u (1+o(1)) (DICKMAN ASYMPTOTIC: RECALLED, UNVERIFIED -
    no source was read - and MEASURED EXACTLY at toy M in the paired
    experiment), so log Psi/log M = 1 + log rho(u)/log M -> 1 throughout the
    sieve's range. So NFS is not merely outside the no-go's hypothesis; it sits
    on the excluded boundary by construction.

    STEP 4 - NEARBY OBJECT 2: GAUDRY/DIEM, AN ELLIPTIC CURVE, ALSO KNOWN FALSE.
    Over E(F_{q^n}), F = {P : x(P) in F_q}, so |F| ~ q; decompose a target into
    m = n factor-base points; N ~ q^n. chi = n log q / (n log q) = 1 EXACTLY.
    That the family beats rho for n >= 3 is RECALLED, UNVERIFIED and is NOT
    load-bearing: only the three cardinalities matter, and the paired experiment
    ENUMERATES all three exhaustively at small (q,n) rather than assuming them.
    WHAT MAKES chi = 1 AVAILABLE THERE is that the ambient group has a SUBFIELD,
    so a predicate of description length O(log q) selects q of q^n points. A
    prime field has no subfield. That single structural fact, not any statement
    about algebra in general, is what the prime-field case lacks.

    STEP 5 - THE BOUNDED-DEGREE FAMILY, AND THE DEGREE chi = 1 WOULD REQUIRE.
    chi = m log(3d)/log N. At log2 N = 256 and m = 4, chi = 1 needs
    3d >= 2^64, i.e. d >= 6.1 x 10^18. Computed cells: chi = 0.1533 at
    (m=2, d=10, 64 bits); 0.2300 at (3,10,64); 0.1014 at (4,30,256); 0.0643 at
    (2,100,256). SCOUT-COMPUTED this session; re-derive in-harness before citing.

    STEP 6 - DESCRIPTION DENSITY AND THE LINEAR-VERSUS-LOGARITHMIC TRADE. A
    plane curve of degree d over F_p is specified by C(d+2,2) = (d+1)(d+2)/2
    coefficients of log2(p) bits. Bezout caps the points it can select at 3d.
    Hence delta = |desc|/|F| >= (d+1)(d+2)log2(p)/(6d) ~ (d/6) log2(p) bits per
    element. For NFS the predicate is "prime and <= B" - O(log B) bits TOTAL over
    a base of size B/ln B - so delta = O(log B * ln B / B) -> 0; for Gaudry it is
    "x in F_q", O(log q) bits total, delta -> 0. Therefore, inside the
    interface, chi rises as log d while delta rises as d. Storing a factor base
    at the degree chi = 1 demands is (d^2/2)log2(p) bits, i.e. a table, not a
    subexponential preprocessing. THIS IS A CHARGE NO RECORD IN THIS CORPUS HAS
    LEVIED, and KN-OPEN-020's own text demands it ("with all description,
    membership, relation, descent, time, and memory costs charged", verbatim).

    STEP 7 - WHAT chi DOES NOT MEASURE, STATED BEFORE ANYONE CITES IT. chi is a
    coverage statistic and NOTHING ELSE. A uniformly random subset R of G with
    |R| = B and m = log N/log B has chi = 1 exactly and is useless, because
    finding which m-tuple sums to a given target is as hard as the original
    problem. chi = 1 IS NECESSARY, NOT SUFFICIENT. The paired experiment builds
    that random subset as an explicit matched null so the limit is MEASURED
    rather than asserted, and the deliverable carries it permanently.

    STEP 8 - WHAT IS NOT CLAIMED. Not that the theorem is defective: its
    hypothesis correctly excludes both witnesses, so there is no contradiction.
    Not that a universal no-go is impossible. Not that any of the three named
    escapes is promising. The claim is about SCOPE and QUANTIFIER, and the
    restated question is strictly harder to answer than the current phrasing.

  assumptions:
    - >-
      THE ARITY ATTRIBUTION FOR NFS. Setting m = u = log M/log B is definitional
      for smoothness but is a modelling choice a reviewer may reject; a
      different convention changes chi. This is the first thing to attack. The
      paired experiment MEASURES the empirical arity distribution of B-smooth
      integers by exhaustive enumeration rather than assuming it.
    - >-
      THE CARDINALITIES FOR GAUDRY. |F| ~ q and N ~ q^n are assumed in the
      derivation and ENUMERATED EXACTLY in the experiment at small (q,n), where
      the Hasse interval makes the relative deviation large - which is why the
      pre-registered tolerance on chi is +/- 0.05 rather than exact.
    - >-
      THAT DESCRIPTION LENGTH IS AN ADMISSIBLE CHARGE. An implicit membership
      predicate (an algorithm, not a polynomial) can be short and expensive to
      evaluate, and delta does not charge evaluation. KN-OPEN-020 names implicit
      solvers as an open residual, and delta does NOT close that gap - it
      isolates a different one. STATED SO IT CANNOT BE OVERSOLD.
    - >-
      THAT NO NFS OR GAUDRY PAPER WAS READ IN THIS SESSION. Both constructions
      are stated from their definitions so a reviewer can reject the
      identification directly, and no complexity claim about either is
      load-bearing.

  proof_search_map:
    bottleneck: >-
      The quantifier in KN-OPEN-020: "every ALGEBRAICALLY DESCRIBED factor
      base". If the operative predicate is instead chi <= 1-epsilon, then no
      amount of work on "what counts as an algebraic description" - the direction
      the entry's own "Required next result" section points, asking for "a formal
      complexity class for algebraic descriptions" - can produce the universal
      theorem, because the class contains counterexamples. Changing the
      quantifier is upstream of every attempt to prove the universal statement
      and costs nothing.
    baseline_embedding:
      parameter_slice: >-
        Delta = 3d with d and m FIXED as p grows - the exact slice Theorem 1
        covers, on which chi = m log(3d)/log N -> 0 and Theorem 3's bound
        Pr <= 2^C N^{chi-1} -> 0. On that slice the incumbent negative is
        reproduced exactly and this hypothesis adds nothing; it agrees with the
        theorem completely there.
      reproduction_check: >-
        SYMBOLIC AND EXACT, not a resemblance: substituting Delta^m = N^chi into
        Theorem 3 gives Pr[T in mF] <= 2^C N^{chi-1}, which is Theorem 3
        verbatim after taking logarithms, so the rewrite reproduces the incumbent
        identically rather than approximately. A FROZEN FIXTURE additionally
        checks Bezout itself: on an explicit toy curve and an explicit plane
        predicate of degree d, exhaustive enumeration must give |F| <= 3d at
        every d in the sweep. A violation means the interface has been misread
        and everything downstream is void.
    observation_collision:
      observable: >-
        The pair (chi, delta) computed from a factor-base construction.
      distinct_preimage_search: >-
        THE COLLISION IS REAL, CONSTRUCTIBLE, AND IS DELIBERATELY RETAINED
        RATHER THAN EXPLAINED AWAY. Three ground-truth objects share the
        observable (chi, delta) = (1, ~0):
          OBJECT A: the NFS rational-side factor base - a working subexponential
            index calculus.
          OBJECT B: the Gaudry subfield factor base - a working sub-rho index
            calculus on an elliptic curve.
          OBJECT C: a uniformly random subset of G of size B with
            m = log N/log B, specified by a seed (so delta ~ 0 as well) - which
            is USELESS, because decomposition search is as hard as the original
            problem.
        A and C lie on OPPOSITE SIDES of the conclusion "this factor base yields
        a usable index calculus", with an identical observable. THIS IS A DIRECT
        FALSIFIER OF IDENTIFIABILITY for (chi, delta) as a sufficiency criterion,
        and the hypothesis therefore claims (chi, delta) as NECESSARY CONDITIONS
        and as a SEPARATOR OF THE THEOREM'S SCOPE ONLY. The additional condition
        that separates A from C is the cost of the decomposition search - which
        is exactly what the corrected open question adds back ("with membership
        and decomposition charged"). Object C is built and measured in the
        paired experiment as the matched null so that the collision is on the
        record before anyone cites chi.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move Theorem 1G's hypothesis from an inequality between two large
          integers (Delta^m and N^{1-epsilon}) into a statement about a single
          scalar on [0, infinity), where families outside the interface can be
          evaluated on the same axis.
        predicted_gain: >-
          Makes NFS and Gaudry-Diem COMPARABLE to the bounded-degree family for
          the first time, which is what produces the witness. Encoding is exact
          (a logarithm), completeness holds (every family with a finite Delta and
          m has a chi), soundness holds (the inequality is preserved), and the
          COST-LOSS OBLIGATION IS DECLARED UNMET: chi discards all cost
          information and the record says so in STEP 7.
      - transform: observable_fiber
        proposed_object: >-
          Hold (chi, delta) fixed at (1, ~0) and vary the forgotten structure,
          producing objects A, B and C above; then look for an intrinsic
          invariant separating A and B from C.
        predicted_gain: >-
          The invariant is identified by the search itself: the cost of
          inverting sigma on a given target - trial division for A, summation-
          polynomial solving for B, and nothing better than brute force for C.
          Naming it is what converts the restated open question into a
          well-posed one.
      - transform: boundary_lift
        proposed_object: >-
          Enlarge the certificate family from single-point membership predicates
          to TUPLE predicates (a locus in E^m rather than in E), where the plane
          Bezout bound does not apply.
        predicted_gain: >-
          NOT CLAIMED AS A GAIN. It is named because it is the escape the
          summation polynomial already occupies, and because the theorem's
          interface explicitly quantifies over single-point membership. Whether
          a tuple predicate can be turned into a factor base at all is open and
          is NOT asserted here.
    quantifier_order: >-
      KN-OPEN-020 AS POSED, written out: FORALL sequences of algebraically
      described factor bases (F_p), THERE IS NO subexponential index-calculus
      algorithm using them. THE WITNESS THIS HYPOTHESIS SUPPLIES: NFS's factor
      base is a sequence of algebraically described factor bases for which a
      subexponential algorithm DOES exist, so the FORALL is false as stated,
      UNLESS "algebraically described" is read to exclude a bound on a norm -
      in which case the term is doing all the work and must be defined before
      the question is meaningful.
      THEOREM 1G AS PROVED, written out: FORALL target-independent loci Z_p with
      no component equal to E and finite Delta_p, FORALL epsilon in (0,1),
      FORALL sequences with Delta_p^{m_p} <= N^{1-epsilon}, the coverage cap and
      cost lower bound hold. That is a correct and much narrower statement, and
      the witness does not touch it. THE GAP BETWEEN THE TWO QUANTIFICATIONS IS
      THE HYPOTHESIS.
      NOTE THE TRAP BEING HUNTED: Delta_p and m_p are allowed to depend on p,
      and the hypothesis chi <= 1-epsilon is a UNIFORM bound on that dependence.
      A family in which m_p grows with p - as NFS's does - is not excluded by any
      fixed-arity intuition, and the uniform reading is what makes the theorem
      true and the universal claim false.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that Theorem 1G's hypothesis is equivalent to chi <= 1-epsilon;
        that two named external families have chi = 1 while the bounded-degree
        family has chi -> 0; that delta separates them the same way with a
        linear-versus-logarithmic trade; and that KN-OPEN-020's universal
        statement is therefore false as quantified. It CANNOT certify that no
        universal no-go exists, cannot certify that any escape is viable, cannot
        move any exponent, cannot produce a factor base, and cannot say anything
        about the cost of decomposition.
      nearby_object_control: >-
        THE NEARBY OBJECTS ARE THE POINT OF THE HYPOTHESIS AND ARE BOTH FREE.
        NFS is the closest object at which the hoped-for conclusion (no
        subexponential index calculus from an algebraically described factor
        base) is KNOWN FALSE, and its factor base is algebraically described by
        any ordinary reading. Gaudry/Diem is the closest ELLIPTIC-CURVE object
        at which it is known false, which removes the objection that NFS is a
        different kind of group. A method that cannot distinguish the
        bounded-degree family from these two has not identified the load-bearing
        structure - and the hypothesis is precisely that "algebraic description"
        does not distinguish them while chi does. A THIRD control runs the other
        way: the random-subset object C, where chi = 1 and the conclusion is
        known false in the OPPOSITE direction (the construction does not work),
        bounding what chi can be used to claim.
    proof_obligations:
      - claim: Delta^m <= N^{1-epsilon} is equivalent to chi <= 1-epsilon.
        responsibility: correctness
      - claim: chi_NFS = 1 identically under the arity attribution m = u.
        responsibility: baseline
      - claim: chi_GaudryDiem = 1 from enumerated cardinalities.
        responsibility: baseline
      - claim: "|F| <= 3d holds on the explicit toy plane predicate."
        responsibility: correctness
      - claim: delta >= (d/6) log2 p for a plane predicate of degree d.
        responsibility: size
      - claim: chi = 1 is necessary and NOT sufficient; object C witnesses it.
        responsibility: strictness
      - claim: >-
          The three named escapes are outside the theorem's interface for the
          stated structural reasons (tuple, cover, non-Zariski size condition).
        responsibility: scope
      - claim: >-
          Nothing here bears on decomposition-search cost, membership-evaluation
          cost, linear algebra, relation rank, or any ECDLP hardness statement.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    DELIBERATELY NULL. NO COMPLEXITY IMPROVEMENT IS CLAIMED. This is a SCOPE AND
    QUANTIFIER AUDIT of an existing negative result. It proposes no algorithm,
    makes no system easier to solve, and moves no exponent. Pollard rho remains
    the ECDLP baseline; sota_delta is zero on every attack axis - time, memory,
    data, queries, advice, preprocessing. dominated_by is not applicable because
    no Pareto point is claimed.

  heuristic_assumptions:
    - id: HEUR-CHI-1
      formal_statement: >-
        FORALL B in the sieve's parameter range and FORALL M, the count of
        B-smooth integers up to M satisfies log Psi(M,B)/log M -> 1;
        equivalently u log u = o(log M) with u = log M/log B.
      random_model_justification: >-
        The Dickman model gives Psi(M,B) = M rho(u)(1+o(1)) with
        log rho(u) = -u log u (1+o(1)), so the ratio tends to 1 whenever u grows
        more slowly than log M/log log M. THE DICKMAN ASYMPTOTIC IS RECALLED,
        UNVERIFIED: no source was read for it in this session and none is cited.
      supporting_results: []
      validation_experiment_ids: [EXP-PATH-d71abd]
      falsification_condition: >-
        Measured log Psi(M,B)/log M, from exact enumeration at toy M over a grid
        of B, drifts away from 1 in a way the model does not predict. The NFS
        arm of the comparison then rests on a model the data rejects and must be
        restated on the counting bound alone.
    - id: HEUR-CHI-2
      formal_statement: >-
        For a uniformly random subset R of a cyclic group of order N with
        |R| = B, E|mR|/N ~ 1 - exp(-B^m/N).
      random_model_justification: >-
        Balls-in-bins, treating the B^m ordered tuples as independent uniform
        draws. INDEPENDENCE IS FALSE - sums share summands - so this is a
        heuristic and is labelled one. It is used ONLY to set the null's pre-run
        prediction and never as a result.
      supporting_results: []
      validation_experiment_ids: [EXP-PATH-d71abd]
      falsification_condition: >-
        Measured |mR|/N falls outside the pre-registered band at any cell over
        at least 20 seeds. The null's forced value was wrong and must be
        re-derived before the treatment arm is interpreted.
    - id: HEUR-CHI-3
      formal_statement: >-
        The arity attributable to a B-smooth relation of size M is u = log
        M/log B, uniformly over the parameter range, for the purpose of
        evaluating chi.
      random_model_justification: >-
        NONE THAT IS UNCONDITIONAL, AND THIS IS THE WEAKEST LINK. It is a
        definitional convention, not a distributional fact: the number of prime
        factors with multiplicity of a random B-smooth integer near M is a random
        variable, and its mean is not exactly u. The chi comparison is only as
        good as this convention.
      supporting_results: []
      validation_experiment_ids: [EXP-PATH-d71abd]
      falsification_condition: >-
        The measured mean arity of B-smooth integers, from exhaustive
        enumeration, differs from u by enough that chi_hat departs materially
        from 1 across the grid. The NFS witness then needs restating on
        log Psi/log M rather than on the counting bound, and the record must say
        which version it is claiming.

  structural_ingredients:
    - description: >-
        Bezout's intersection theorem for a projective plane curve of degree d
        against an irreducible cubic, giving total intersection multiplicity 3d.
      citation: >-
        ideas/artifacts/IDEA-20260801-021/bounded_degree_factor_base_theorem.md,
        Theorem 1, READ IN FULL this session. The underlying classical theorem is
        not separately cited because the receipt states and uses it.
      role: caps |F| by Delta, hence caps chi for bounded m
    - description: >-
        An image is no larger than its domain, applied to sigma : F^m -> G.
      citation: >-
        Same receipt, Theorem 2. Elementary.
      role: the coverage bound |mF| <= Delta^m
    - description: >-
        Min-entropy to hitting-probability conversion.
      citation: Same receipt, Theorem 3.
      role: turns coverage into the success bound 2^C N^{chi-1}
    - description: >-
        Dickman's rho and the count of smooth integers.
      citation: >-
        NOT RETRIEVED, NOT VERIFIED. RECALLED, UNVERIFIED - a candidate to test,
        never an authority. Measured exactly at toy M in the paired experiment.
      role: the tight version of the NFS coverage statement
    - description: >-
        The Gaudry/Diem subfield factor base and decomposition via S_{n+1}.
      citation: >-
        NO PAPER READ. RECALLED, UNVERIFIED. Only the three cardinalities are
        used and all three are enumerated exhaustively at small (q,n).
      role: the second nearby object, on an elliptic curve

  reduction_chain:
    core_problem: >-
      Determine the operative separating predicate of the bounded-degree
      algebraic factor-base no-go, and whether KN-OPEN-020's universal statement
      is true as quantified.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. There is no reduction from this scope audit to any
      statement about ECDLP hardness, to any construction, or to any cost. A
      confirmed finding restates an open problem; it makes nothing easier and
      closes nothing. Any citation toward a hardness or feasibility statement
      must carry that gap explicitly.

  predictions:
    - metric: chi for the NFS rational-side factor base across the B grid
      direction: different
      minimum_effect: >-
        EXACTLY 1.000, independent of B, within the arity estimator's declared
        discretisation. B-dependence falsifies the arity attribution and the
        central comparison.
    - metric: >-
        chi for Gaudry/Diem from exhaustively enumerated cardinalities at
        (q,n) in {(5,3),(7,3),(11,2),(13,2)}
      direction: different
      minimum_effect: >-
        1.000 +/- 0.05 at every cell, the tolerance covering Hasse deviation.
        Any cell below 0.9 withdraws the elliptic-curve half of the witness.
    - metric: log2 of the plane degree d required for chi = 1 at 256 bits, m = 4
      direction: higher
      minimum_effect: >-
        log2 d >= 62.4 (d >= 2^64/3). Derived, not measured.
    - metric: >-
        coverage fraction |mF|/N, Gaudry subfield base versus size-matched
        uniformly random null, per cell
      direction: different
      minimum_effect: >-
        BOTH above 0.3 wherever |F|^m >= N, and the two AGREEING within a factor
        of 2. The prediction is that they agree; agreement is what establishes
        that chi measures coverage and not usefulness, and it must be on the
        record before chi is cited anywhere.
    - metric: delta in bits per factor-base element across the four families
      direction: different
      minimum_effect: >-
        Separation of at least 6 orders of magnitude at the 256-bit cell
        (delta -> 0 for NFS and Gaudry against >= 4.3e17 bits/element at
        d = 2^64/3). No separation kills the description-density half and leaves
        only the chi rewrite.
    - metric: >-
        |F| against 3d on the explicit toy plane predicate, per degree in the
        sweep
      direction: lower
      minimum_effect: >-
        |F| <= 3d at EVERY degree, with no exception. This is Bezout, so it MUST
        hold; a violation means the interface was misread and no conclusion may
        be reported.

  test_boundary:
    instances:
      - >-
        Exact enumeration of B-smooth integers up to a toy M over a grid of B
        (pure Python integer arithmetic).
      - >-
        Exhaustively enumerated E(F_{q^n}) at (q,n) in {(5,3),(7,3),(11,2),
        (13,2)} over an explicit polynomial basis, with the subfield factor base
        and a size-matched uniformly random null.
