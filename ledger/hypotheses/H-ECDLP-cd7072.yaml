hypothesis:
  id: H-ECDLP-cd7072
  question_id: RQ-ECDLP-002
  statement: >-
    Formalises IDEA-20260808-a3f7c1, WITH ITS CENTRAL PREDICTION REPLACED
    BECAUSE THAT PREDICTION CANNOT DISCRIMINATE. The source proposes a
    y-coordinate oracle O_y(x_0) used GENERATIVELY, iterate x_0 over a
    factor-base x-set V, construct P_0 = (x_0, O_y(x_0)), and check whether
    R - P_0 decomposes at arity m-1. Its prediction is a yield ratio
    Y_guided / Y_exhaust = m, that is 3.0 at m = 3.
    THAT RATIO IS A COUNTING ARTIFACT AND IS NOT EVIDENCE OF ANYTHING. The
    guided procedure enumerates ordered pairs (distinguished element, remaining
    multiset), so each unordered m-element relation is reached m times, once per
    choice of which member is distinguished. Deduplicated, the two procedures
    search the SAME space, and exhaustive search at arity m over V returns EVERY
    m-subset relation by definition, so the distinct-relation sets satisfy
    Rel_guided is a subset of Rel_exhaust ALWAYS. A yield advantage is therefore
    refuted by set inclusion, not by measurement, for every parameter value.
    WHAT THIS RECORD CLAIMS INSTEAD, in two separable parts.
    (P1, curve-specific, measured) A single-sign y-oracle recovers a strictly
    determinable fraction of the exhaustive relation set, namely 1 - 2^{-m},
    equal to 0.875 at m = 3, because a relation is reached only when the
    oracle's sign at some member matches that member's sign in the relation. A
    both-signs oracle recovers exactly 1.000. This is a real, sharp,
    curve-specific prediction that the x-only representation forces and that no
    curve-free object reproduces.
    (P2, cost, and NOT an elliptic claim) Charging every operation, the guided
    procedure costs Theta(B^2) group operations per target at m = 3 against
    Theta(B^3) for exhaustive search, a fitted exponent gap of 1.0 in B. This
    saving is the ordinary meet-in-the-middle restructuring of a 3-sum and is
    reproduced exactly in (Z/N, +) with no curve present, so it may not be
    reported as a statement about elliptic curves, about the ECDLP, or about
    oracles.
  mechanism: >-
    The oracle O_y : F_p -> F_p union {bottom} returns a y with (x_0, y) on E,
    or bottom. Its information content is the object under test, but its
    implementation cost is not hypothetical, THE ORACLE IS FREELY REALISABLE.
    Given x_0, compute f(x_0) = x_0^3 + a x_0 + b and take a square root, one
    exponentiation for p congruent to 3 mod 4 and Tonelli-Shanks in general, at
    O(log^2 p) field operations. The "oracle model" framing is therefore
    vacuous and the object under test is simply the standard sort-or-hash
    decomposition algorithm. This contract charges the square root explicitly
    rather than assuming the oracle free, which is what the source proposal
    lists as its own dominant confounder.
    The single-sign restriction is where the curve enters. A square root returns
    one of two roots, so P_0 carries a sign the algorithm did not choose. A
    relation R = eps_1 P_1 + eps_2 P_2 + eps_3 P_3 with x(P_i) in V is reached
    by the guided arm exactly when the oracle's sign at some x(P_i) equals
    eps_i; the probability that none of the m members matches is 2^{-m}, so
    recall is 1 - 2^{-m}. In (Z/N, +) there is no sign, so the corresponding
    null recall is exactly 1.000 and the gap between the two is the whole
    elliptic content of the record.
  assumptions:
    - >-
      E is a prime-field short-Weierstrass curve y^2 = x^3 + ax + b with a
      prime-order subgroup G = <P> of order N about p, hygiene-screened with a
      factored group order and an explicit "#E(F_p) != p" check.
    - >-
      V is a random subset of F_p of size B chosen independently of the target
      R, so V determines 2B points up to sign.
    - >-
      The oracle is EXACT and its cost is CHARGED at the measured square-root
      cost. It is not assumed free.
    - >-
      The arity-(m-1) completion is exact and exhaustive over both signs, so
      the only sign restriction in the guided arm is at the distinguished
      element.
    - >-
      Relation sign vectors are uniform over {+1,-1}^m for a random target.
      This is the assumption the 1 - 2^{-m} prediction tests, and a measured
      deviation is a result about the curve, not an instrument failure.
  proof_search_map:
    not_applicable_reason: >-
      Empirical measurement at toy scale. The one derivational component, that
      Rel_guided is a subset of Rel_exhaust so no yield advantage can exist, is
      recorded in the statement above as a refutation by set inclusion and is
      not a proof-oriented research programme.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        For a random target R and a random factor base V of size B, the
        probability that R decomposes over V at arity m is B^m / (m! N) up to
        1 + o(1), on the assumption that the subset sums of V behave like
        independent uniform elements of Z/N.
      random_model_justification: >-
        The classical occupancy model for uniform independent placements. The
        union bound gives B^m / (m! N) as an upper bound with no independence
        assumption; the heuristic is that the bound is tight.
      supporting_results:
        - >-
          Union bound, elementary and internal. No external citation is claimed
          and none is needed for the upper bound.
      validation_experiment_ids:
        - EXP-ECDLP-552738
      falsification_condition: >-
        The measured decomposition fraction deviates systematically from
        B^m / (m! N) beyond the sampling interval at the largest B, where the
        predicted probability is closest to 1 and dependence would show first.
  structural_ingredients:
    - description: >-
        Source proposal. The y-coordinate oracle used generatively, and the
        factor-m yield prediction that this record replaces.
      citation: IDEA-20260808-a3f7c1
      provenance: internal
      verified_by: >-
        TASK-20260904-c063e5 coordinator. Full read of
        ledger/proposals/IDEA-20260808-a3f7c1.yaml, 356 lines, Read tool,
        2026-09-04.
      role: originating claim, corrected here
    - description: >-
        The rejected x-oracle MITM yield hypothesis. Record status is
        "rejected". Its falsification_conditions include, verbatim, "Y_A
        (exhaustive) equals Y_B (x-oracle MITM) exactly, indicating any
        measured advantage is relative to the random-predictor null only".
      citation: H-XOR-d1a480
      provenance: internal
      verified_by: >-
        TASK-20260904-c063e5 coordinator. Full read of
        ledger/hypotheses/H-XOR-d1a480.yaml, 103 lines, Read tool, 2026-09-04.
      role: the obstruction this record must not re-enact
    - description: >-
        reject_scoped on H-XOR-d1a480. Records that Y_A and Y_B are EQUAL,
        EXACTLY, in every one of the 40 measured configurations, at
        Y_A_mean = Y_B_mean = 0.01212636. ALSO records, and this is material to
        any reuse, that EV-ECDLP-65b004's four artifact hashes are FABRICATED
        PLACEHOLDERS, 62 hex characters each and rotations of a cyclic filler
        pattern, which evaded all three embedded reviews. The substantive
        numbers were independently spot-checked by that Coordinator against
        runs/RUN-SEMAEV-f48dd1-grid/analysis.yaml directly.
      citation: DEC-20260808-6a7ac4
      provenance: internal
      verified_by: >-
        TASK-20260904-c063e5 coordinator. Full read of
        ledger/decisions/DEC-20260808-6a7ac4.yaml, 210 lines, Read tool,
        2026-09-04.
      role: the committed comparison baseline, and its disclosed integrity defect
  reduction_chain:
    core_problem: >-
      Semaev-style relation finding over a factor base at arity 3, at toy
      prime-field sizes.
    corollaries: []
  predictions:
    - metric: >-
        single_sign_recall, dimensionless in [0,1], distinct relations found by
        the single-sign guided arm divided by distinct relations found by
        exhaustive search on the identical instance
      direction: lower
      minimum_effect: >-
        0.875 at m = 3, that is 1 - 2^{-m}. Pre-registered band [0.855, 0.895],
        about 2.7 standard errors at 2000 recorded relations per cell. The
        both-signs oracle arm is forced to 1.000 and fixes the upper end of the
        instrument's range; the planted all-negative-sign factor base forces
        0.000 and fixes the lower end.
    - metric: >-
        distinct_relation_set_difference, count of relations found by the
        both-signs guided arm and NOT by exhaustive search, integer
      direction: lower
      minimum_effect: >-
        Exactly 0. Any positive value means exhaustive search is not
        exhaustive and the instrument is broken. This is the operational form
        of the set-inclusion refutation and is a check, not evidence.
    - metric: >-
        charged_cost_exponent_gap, dimensionless, the fitted exponent of total
        charged cost against B for exhaustive search minus that for the guided
        arm, both in the same unit of F_p multiplications with the square-root
        oracle charged
      direction: higher
      minimum_effect: >-
        1.0 plus or minus 0.15 at m = 3, from Theta(B^3) against Theta(B^2).
        THIS IS NOT AN ELLIPTIC RESULT. See the curve-free prediction below.
    - metric: >-
        curve_free_cost_exponent_gap minus elliptic_cost_exponent_gap,
        dimensionless
      direction: different
      minimum_effect: >-
        Predicted 0 within the pooled interval, because the B^3-to-B^2
        restructuring is the ordinary 3-sum meet-in-the-middle and uses no
        elliptic structure. CONSEQUENCE PRE-STATED, agreement means the cost
        saving may NOT be reported as a statement about elliptic curves, the
        y-oracle, or the ECDLP, whatever its magnitude.
    - metric: >-
        curve_free_recall minus elliptic_single_sign_recall, dimensionless
      direction: higher
      minimum_effect: >-
        Predicted 1.000 - 0.875 = 0.125 at m = 3, because (Z/N, +) has no sign
        ambiguity and its single-element-fixed arm has recall exactly 1.000.
        This gap is the ONLY curve-specific quantity in the contract and it is
        the one the elliptic conclusion may rest on.
  test_boundary:
    instances:
      - >-
        Toy prime-field curves at p in {101, 103, 107, 211, 1009, 2003},
        hygiene-screened, factor base V a random x-subset of size B.
      - >-
        Curve-free null instances in (Z/N, +) at matched N and matched B.
    parameters:
      claim_tier: toy
      arity: 3
      B_over_p_ladder: [0.015625, 0.0625, 0.25, 0.5]
      B_ladder_for_cost_fit: at least four values per p, reported per p
      targets_per_cell: 2000
      recorded_relations_per_cell: at least 2000
    implementation: >-
      Not yet written. EXP-ECDLP-552738 declares the required artifacts.
    budget:
      wall_clock_seconds_per_run: 1800
      maximum_memory_gb: 8
      maximum_runs: 8
  falsification_conditions:
    - >-
      TOY-TIER FALSIFIER on P1. Single-sign recall lies outside [0.855, 0.895]
      at any cell while the both-signs arm returns 1.000 and the planted
      all-negative control returns 0.000. Relation sign vectors are then not
      uniform, which is a measured statement about the curve and the factor
      base and is reported as such rather than as an instrument failure.
    - >-
      TOY-TIER FALSIFIER on P2. The fitted cost exponent gap lies outside
      1.0 plus or minus 0.15 at m = 3 with the fit-quality rule satisfied. The
      cost model for one of the two arms is wrong.
    - >-
      SCOPE FALSIFIER, EXPECTED TO FIRE. The curve-free (Z/N, +) arm reproduces
      the elliptic cost exponent gap within the pooled interval. The cost
      saving is then generic 3-sum meet-in-the-middle and carries no elliptic
      content. This is the anticipated outcome and is recorded as informative,
      not as a failure.
    - >-
      INSTRUMENT VOID. Exhaustive search misses a relation that the both-signs
      guided arm finds; or the planted all-negative-sign control does not drive
      single-sign recall to 0.000; or the random-y control returns recall above
      its sampling noise. Nothing is admissible.
    - >-
      INFRASTRUCTURE, NOT EVIDENCE. Timeouts, crashes, or memory exhaustion,
      per AGENTS.md rule 5.
  interpretation_limits:
    - >-
      Toy scale, 7 to 11 bit prime fields, arity 3 only. No claim about
      cryptographic parameters, per AGENTS.md rule 7.
    - >-
      NO YIELD ADVANTAGE IS CLAIMED OR TESTABLE. Rel_guided is a subset of
      Rel_exhaust by construction, so the source proposal's factor-m yield
      prediction is refuted by set inclusion and no measurement can support it.
      The record says so before any run rather than measuring a multiplicity.
    - >-
      The cost saving is the standard meet-in-the-middle restructuring of a
      3-sum. It is not novel, it is not elliptic, and the curve-free null is in
      the contract precisely so that it cannot be reported as either.
    - >-
      The oracle is not free and is not hypothetical. It is a square root at
      O(log^2 p) field operations and is charged. Any framing of this work as
      an "oracle model" result is unsupported by this contract.
    - >-
      REUSE CAVEAT ON THE COMMITTED BASELINE. Where this contract compares its
      exhaustive arm against the committed x-oracle grid, the comparison must
      be made against runs/RUN-SEMAEV-f48dd1-grid/analysis.yaml recomputed
      directly. EV-ECDLP-65b004's four artifact hashes are disclosed as
      fabricated placeholders in DEC-20260808-6a7ac4, so that record's
      hash-backed integrity claim cannot be relied on even though its
      substantive numbers were spot-checked.
  status: proposed
  proposed_by: idea-generator
