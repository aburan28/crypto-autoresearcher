  title: >-
    The three published cells have column counts binom(N, <=4), and the
    two m = 2 degree-4 row counts are n times binom(N, <=2).
  statement: >-
    With k = ceil(n/m) and N = n*(t-2) + k*t, the cells (40, 2, 2),
    (45, 2, 2) and (25, 3, 3) have (k, N) = (20, 40), (23, 46) and
    (9, 52). The degree-at-most-4 column counts are 102091, 179447 and
    294204. For the two m = 2 cells the degree-4 row count n * binom(N,
    <=2) is 32840 and 48690. At n = 45 the degree-5 shape is 731790 by
    1550201. The bit-dense hundredths of a GiB, (rows*cols*100 + 2^32)
    // 2^33, are 39, 102 and, using the proposal's written row count
    35800 at n = 25, 123. The degree-5 product rounds to 132 GiB. The
    equation excesses n - k*t are 0, -1 and -27.
  mechanism: >-
    A degree-4 Boolean Macaulay matrix has one column per squarefree
    monomial of degree at most 4. If each of the n Boolean equations has
    degree 2, the rows that reach degree 4 are the multiples by monomials
    of degree at most 2. This contract checks those integers. It does not
    build a matrix.
