hypothesis:
  id: H-ICPERF-195806
  question_id: RQ-ICPERF-94c86e
  goal_id: GOAL-ICPERF-e6b6a4
  idea_ids: [IDEA-20261017-3f46a5]
  title: Bounded solver-to-certificate viability of matched k11 ordinary-binary bases
  statement: >-
    On the certified ordinary curve y^2+xy=x^3+31 over GF(2^61), with prime
    subgroup order 576460752557211763, a fixed one-thread CryptoMiniSat
    configuration returns a checked XCNF model and full-point relation within
    300 seconds and a sampled 8 GiB RSS guard on each of two separately
    planted m=8, B=316 positive controls; over eight base-independent public
    subgroup targets and four raw lift channels per target, at least one
    distinct projected relation is certified in either of the two B=316 arms.
    This is a finite-cap instrument hypothesis, not an ECDLP cost advantage.
  mechanism: >-
    The weighted k11 torsion-coordinate base and its same-width local random
    control use the same seven chained S3 field equations. Only their exact
    accepted-coordinate predicates differ. Native-XOR SAT finds coordinate
    roots; a separate full-point checker restores signs, excludes poles and
    nonbase values, checks the raw sum and projects by the cofactor four.
    Four channels are lifts of one prime-subgroup target and cannot multiply
    the number of independent targets or useful relation rows.
  assumptions:
    - Both factor bases and their complete selection scans were frozen before target generation.
    - A solver model is useful only after CNF, native-XOR and full-point checks pass.
    - Solver-reported UNSAT has no independent proof in the present launcher.
    - Sampled RSS may overshoot between watchdog polls; a memory stop is censored.
  proof_search_map:
    bottleneck: Whether the prepared k11 systems produce exact point relations within fixed solver resources.
    baseline_embedding:
      parameter_slice: Same curve, B=316 projected columns, seven chained S3 equations and four raw channels in both arms.
      reproduction_check: Recheck each separately planted Boolean and full-point positive witness before natural-target calls.
    observation_collision:
      observable: SAT models, conflicts and certified projected relation rows.
      distinct_preimage_search: >-
        Deduplicate signs, torsion pair presentations and channel repetitions
        by exact projected coefficient row; compare model counts with distinct
        certified rows for each arm and target.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Weighted torsion-coordinate membership with exact projection to subgroup columns.
        predicted_gain: A finite-cap certified relation interface for a later powered comparison.
    quantifier_order: >-
      Freeze the curve, both bases, binary, target derivation and caps first;
      then run both arms on every admitted target and every channel without
      retuning any of them.
    method_ceiling:
      strongest_certifiable_claim: Bounded solver and certificate viability on this exact fixture and schedule.
      nearby_object_control: Equal-column local random base with the same XCNF circuit and separate planted target.
    proof_obligations:
      - {claim: Every accepted model satisfies the serialized CNF and native XOR rows, responsibility: correctness}
      - {claim: Every accepted signed point tuple sums to its raw target and projects to a valid row, responsibility: interface}
      - {claim: Setup, failures, time, memory and repeated rows are charged or preserved, responsibility: runtime}
    not_applicable_reason: null
  predictions:
    - metric: planted_model_solver_and_certificate_recovery
      direction: higher
      minimum_effect: Both separate positive controls return a checked model and point certificate within 300 seconds and an 8 GiB sampled RSS cap per call.
    - metric: natural_common_target_certificates
      direction: higher
      minimum_effect: At least one distinct certified projected row in either arm over eight common targets and all four channels.
  test_boundary:
    instances: [ordinary_binary_gf2_61_b31_weighted_k11_b316, ordinary_binary_gf2_61_b31_local_random_k11_b316]
    parameters: {summands: 8, natural_targets: 8, raw_channels_per_target: 4, solver_threads: 1, max_primary_models_per_call: 64}
    implementation: EXP-ICPERF-018b0c
    budget: {wall_seconds_per_call: 300, sampled_rss_bytes_per_call: 8589934592, total_wall_seconds: 25200}
  falsification_conditions:
    - Both planted witnesses recheck independently, but a validly completed positive-control call cannot produce a checked model and point certificate within its admitted cap; this weakens only the bounded solver instrument prediction.
    - Both positive controls pass and all 64 natural arm/channel calls complete with independently verified exhaustive absence of point relations; this weakens only the exact finite-panel viability prediction. The current solver output alone cannot establish that exhaustion.
    - A timeout, sampled-memory stop, crash, unproved UNSAT, invalid solver model or invalid certificate is censored or an implementation defect; none tests the mathematical base or proves zero relation yield.
  interpretation_limits:
    - Eight common targets cannot resolve a 1.25x candidate-versus-control advantage.
    - Censoring, reported UNSAT and infrastructure stops are distinct from verified zero natural yield.
    - SAT conflicts do not measure degree of regularity; useful rank, linear algebra, target work, matched rho and end-to-end cost are outside this experiment.
  status: inconclusive
  approved_by: DEC-20261017-ae9e63
