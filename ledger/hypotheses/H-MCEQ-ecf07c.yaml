hypothesis:
  id: H-MCEQ-ecf07c
  question_id: RQ-MCEQ-fcb504
  derived_from_idea: IDEA-20260808-0b3072
  added: '2026-08-25'

  statement: >-
    SCOPE: matrix codes C, D contained in the n-by-n matrices over F_q, of
    dimension k, at n = k in {3, 4, 5} and q in {5, 7, 11, 13}, with the
    equivalence D = A C B for A, B in GL_n. The rectangular case m not equal to
    n is OUT OF SCOPE. CLAIM TIER toy. NO ATTACK IS PROPOSED, NO CLAIM ABOUT
    MEDS OR ANY DEPLOYED MATRIX-CODE SCHEME FOLLOWS, and none may be reported.

    THREE CLAIMS, MEASURED SEPARATELY, WITH DIFFERENT PRIORS.

    CLAIM A (THE OBSTRUCTION). The hull under the trace form is NOT invariant
    under matrix code equivalence, because left and right multiplication by
    invertible matrices is not an isometry of that form unless the matrices are
    orthogonal. Consequently the hull-based support-splitting route, which
    works for permutation equivalence of linear codes precisely because the
    hull is preserved and generically small, DOES NOT TRANSFER, and any
    proposal assuming it does is mis-specified. IF THE HULL TURNS OUT TO BE
    PRESERVED under general (A, B), Claim A is FALSE -- and that would be a
    strictly MORE useful finding than Claim B, because it would resurrect
    support splitting for matrix codes.

    CLAIM B (THE REPLACEMENT INVARIANT). The determinantal form
    Delta_C(x) = det(x_1 M_1 + ... + x_k M_k), for a basis M_1..M_k of C,
    satisfies Delta_{ACB}(x) = det(A) det(B) Delta_C(x) EXACTLY, with the same
    variables, so Delta is invariant up to a scalar under the whole group and
    transforms by a linear substitution under change of code basis. This is an
    identity; it serves as the instrument's null, and any coefficient-wise
    discrepancy is an implementation bug rather than a finding.

    CLAIM C (THE FIBRE IS SMALL AND DOES NOT GROW). The number of GL_k
    substitutions matching the determinantal forms of two equivalent codes is
    finite and bounded by a function of n and k alone, NOT growing with q. If
    the count GROWS WITH q on the exhaustively enumerated cells, Claim C is
    FALSE and the reduction loses exponentially much information.

    THE OUTCOME THE PARENT PROPOSAL CALLS MOST LIKELY, AND WHICH THIS DESIGN
    MUST BE WILLING TO REPORT. Even with A, B and C all holding, solving the
    resulting form-equivalence problem may be empirically no easier than
    solving matrix code equivalence directly, in which case the reduction is
    correct and useless -- a named closure, recorded as one.

  mechanism: >-
    THE LOSSY-PROJECTION TEST, APPLIED BEFORE ANY COMPUTE.

    (1) WHY DELTA IS A GENUINELY LOSSY PROJECTION THAT PROPAGATES. Delta_C
    retains only the locus where a codeword drops rank and discards which
    codeword, its kernel, and the code's metric structure. What it discards is
    discarded COMPATIBLY with the group's operations, because left and right
    multiplication by invertible matrices scales the determinant without
    touching the variables. That is exactly the compatibility the inventor
    protocol's lossy-projection test requires -- the retained part propagates
    deterministically under the group.

    (2) WHY THE HULL IS THE MIRROR CASE. The hull is a projection that is NOT
    compatible with the acting group. That is Claim A restated in the
    protocol's own vocabulary, and it is why the transfer from
    permutation-equivalence cryptanalysis fails. The ORTHOGONAL-SUBGROUP
    CONTROL is what separates "the hull is not invariant" from "the hull
    measurement is broken" -- restricted to the subgroup where B is the inverse
    transpose of A, the hull SHOULD be preserved, and if it is not, the
    measurement is at fault rather than the group.

    (3) WHY CLAIM C IS THE WEAK LINK AND IS RECORDED AS SUCH. It rests on the
    classical theory of determinantal representations -- that a smooth
    hypersurface admits only finitely many inequivalent determinantal
    representations. That statement is RECALLED FROM MEMORY AND UNVERIFIED in
    the parent proposal, and its extension to higher-dimensional determinantal
    hypersurfaces is exactly the point that must be checked before Claim C is
    used. The experiment therefore MEASURES the fibre size rather than assuming
    finiteness, and reports its q-dependence as the decisive quantity.

    (4) WHY THE INEQUIVALENT-PAIR NULL IS BLOCKING. If the substitution search
    returns a non-empty solution set on random INEQUIVALENT codes with matching
    rank distribution, the invariant is too coarse and the reduction is NOT
    SOUND -- Delta would identify codes that are not equivalent. No positive
    fibre-size measurement means anything until this null returns empty.

    (5) WHY THE SCALAR IS CHECKED RATHER THAN FITTED. The identity predicts the
    observed scalar to be det(A) det(B) exactly. Recovering it as a prediction,
    rather than fitting it to make the identity hold, is what makes Claim B a
    check instead of a tautology.

  assumptions:
    - >-
      n = m, so the determinant is defined. The rectangular case requires
      replacing the invariant by maximal minors and changes the whole analysis;
      it is OUT OF SCOPE and any run must state which case it handled.
    - >-
      The code contains a full-rank element, so Delta is not identically zero.
      Codes contained in the singular locus -- for example codes of matrices
      with a common kernel vector -- MUST be excluded and their density
      reported, not silently dropped.
    - >-
      Over small q a degree-n form in k variables has few points and solver
      behaviour is atypical. q is therefore SWEPT rather than fixed, and any
      q-dependence is reported as such.
    - >-
      EXHAUSTIVE ENUMERATION OF GL_k IS FEASIBLE ONLY AT SMALL (k, q). The
      q-growth question in Claim C is decided ONLY on cells where the
      enumeration is exhaustive; cells searched non-exhaustively yield a LOWER
      BOUND on the solution count, and the direction of that bias must be
      stated with every such number.
    - >-
      The parent proposal's characterisation of the published matrix-code
      equivalence algorithms is RECALLED FROM MEMORY AND UNVERIFIED. No
      comparison against them is made here, and none may be reported.

  proof_search_map:
    bottleneck: >-
      The size and q-dependence of the fibre of the map from a matrix code to
      its determinantal form. If the fibre is small and q-independent, the
      reduction from matrix code equivalence to projective equivalence of a
      degree-n form loses only a finite ambiguity; if it grows with q, the
      reduction hides an exponential factor and the whole structural statement
      is worthless as a route.
    baseline_embedding:
      parameter_slice: >-
        n = k = 3 over q = 5 and q = 7, where GL_3(F_q) is small enough to
        enumerate EXHAUSTIVELY, so the solution count is an exact integer
        rather than a search result.
      reproduction_check: >-
        On that slice, the exhaustive enumeration must (a) find the KNOWN
        planted substitution used to construct the equivalent pair, and (b)
        return a count that is stable under re-running with a different
        generating basis of the same code. A search that cannot rediscover the
        substitution it was given is not measuring a fibre.
    observation_collision:
      observable: >-
        The determinantal form Delta_C up to scalar and GL_k substitution.
      distinct_preimage_search: >-
        THE CENTRAL AUDIT -- search for two INEQUIVALENT codes with matching
        rank distribution whose determinantal forms are related by a GL_k
        substitution. Such a pair is a collision showing the invariant is too
        coarse and the reduction unsound. The inequivalent-pair null is
        precisely this search, and it must return EMPTY; if it does not, the
        collision is the deliverable and the reduction is withdrawn.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the naive group search over GL_n x GL_n, of size about
          q^(2 n^2), by a GL_k substitution search of size about q^(k^2)
          followed by linear algebra to recover (A, B). Encoding obligation --
          Delta must not be identically zero and the code must contain a
          full-rank element. Completeness -- every equivalence induces a
          substitution. Soundness -- a substitution corresponds to an
          equivalence only up to the fibre, which is what Claim C bounds.
          Transfer -- to nothing outside the tested (n, k, q).
        predicted_gain: >-
          A SEARCH-SPACE statement only, and only when k is smaller than
          2 n^2. NO speedup is claimed, because the cost of form equivalence is
          NOT claimed to be small and polynomial equivalence is itself a hard
          problem family.
    quantifier_order: >-
      CLAIM B is -- FOR ALL A in GL_n, FOR ALL B in GL_n, FOR ALL codes C,
      Delta_{ACB} = det(A) det(B) Delta_C. The witness scalar depends on
      (A, B) and on nothing else, which is what makes it an identity rather
      than a per-instance coincidence. CLAIM C is -- FOR ALL generic C at the
      tested (n, k), THERE EXISTS a bound f(n, k), independent of q, on the
      number of matching substitutions. THE TRAP, NAMED -- allowing f to depend
      on q would make Claim C vacuous, and the whole content of the measurement
      is the q-dependence.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most -- "at n = k in {3,4,5} and q in the tested set, the hull
        dimension changed under random (A, B) at rate [r] and was preserved
        under the orthogonal subgroup; the determinantal identity held
        coefficient-wise on every tested instance; and the number of matching
        GL_k substitutions was [count], exhaustively at [these cells] and as a
        lower bound at [those cells]." It can NEVER certify that form
        equivalence is easier than matrix code equivalence, that any attack
        exists, or anything about MEDS or any deployed scheme.
      nearby_object_control: >-
        THE ORTHOGONAL SUBGROUP, where B is the inverse transpose of A. There
        the hull MUST be preserved. A pipeline reporting hull change there is
        measuring its own arithmetic, not the group, and every Claim-A number
        from it is void. The second nearby object is the INEQUIVALENT-PAIR
        null, where the substitution set must be empty.
    proof_obligations:
      - claim: >-
          The hull dimension changes under random (A, B) at a rate approaching
          1 as q grows.
        responsibility: correctness
      - claim: >-
          The hull dimension is PRESERVED under the orthogonal subgroup.
        responsibility: interface
      - claim: >-
          Delta_{ACB} equals det(A) det(B) Delta_C coefficient-wise over F_q,
          with the scalar RECOVERED rather than fitted.
        responsibility: correctness
      - claim: >-
          The substitution set is EMPTY on inequivalent pairs with matching
          rank distribution.
        responsibility: interface
      - claim: >-
          The substitution count on exhaustively enumerated cells does not grow
          with q.
        responsibility: strictness
      - claim: >-
          Codes with identically zero Delta are excluded and their density is
          reported.
        responsibility: scope
      - claim: >-
          Nothing transfers to the rectangular case, to larger parameters, or
          to any deployed scheme.
        responsibility: scope
    not_applicable_reason: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. NO ATTACK EXPONENT IS CLAIMED. What the reduction
    changes is a SEARCH SPACE -- the naive group search of size about q^(2 n^2)
    is replaced by a GL_k substitution search of size about q^(k^2) plus linear
    algebra -- and whether that is progress depends entirely on whether k is
    smaller than 2 n^2 at the parameters in question AND on the cost of form
    equivalence, which is NOT claimed to be small. Polynomial equivalence is
    itself a hard problem family. The parent proposal's characterisation of the
    published matrix-code equivalence algorithms is recalled and unverified, so
    no comparison against them is made.

  heuristic_assumptions:
    - id: HEUR-MCEQ-1
      formal_statement: >-
        For a uniformly random k-dimensional matrix code in the n-by-n matrices
        over F_q with k >= 3, the determinantal hypersurface Delta_C = 0 is
        reduced and irreducible with singular locus of the expected
        codimension, so the classical finiteness of determinantal
        representations applies.
      random_model_justification: >-
        Genericity in the sense of algebraic geometry -- a random linear system
        of matrices is assumed to behave as the generic one, the standard
        Bertini-type expectation. The rigorous ingredient offered is the
        classical determinantal-variety dimension formula giving the
        rank-at-most-r locus the expected codimension. THE FINITENESS STATEMENT
        ITSELF IS RECALLED AND UNVERIFIED in higher dimension, and that is the
        exact gap.
      supporting_results: []
      validation_experiment_ids: [EXP-MCEQ-e6fcab]
      falsification_condition: >-
        A measured fraction of random codes failing the expected-codimension
        prediction that is not accounted for by the degenerate families (common
        kernel, common image). An unexplained failure class falsifies the
        genericity assumption and Claim C loses its stated support.
    - id: HEUR-MCEQ-2
      formal_statement: >-
        A non-exhaustive substitution search at (k, q) cells too large to
        enumerate returns a count that is a LOWER bound on the true fibre size,
        with no upward bias.
      random_model_justification: >-
        Not distributional -- it is a monotonicity property of search. A search
        can only find solutions that exist, so its count cannot exceed the
        truth. THE CONSEQUENCE, STATED -- a non-exhaustive cell can therefore
        DEMONSTRATE growth but can never DEMONSTRATE absence of growth, so
        Claim C's q-growth test is decided ONLY on exhaustive cells.
      supporting_results: []
      validation_experiment_ids: [EXP-MCEQ-e6fcab]
      falsification_condition: >-
        A non-exhaustive search returning a count HIGHER than the exhaustive
        count on a cell where both were run. That would mean the search is
        returning non-solutions and every count it produced is void.

  predictions:
    - metric: >-
        A1 -- hull_change_rate -- fraction of random (A, B) in GL_n x GL_n for
        which dim(C intersect C-perp) under the trace form CHANGES, per
        (n, k, q)
      direction: higher
      minimum_effect: >-
        Approaching 1 as q grows, and strictly above 0 at every tested cell. A
        rate of EXACTLY 0 at any cell where the orthogonal control passes
        falsifies Claim A and would RESURRECT support splitting for matrix
        codes -- the more consequential outcome.
    - metric: >-
        A2 -- orthogonal_control_preservation_rate -- fraction of (A, B) drawn
        from the subgroup with B the inverse transpose of A for which the hull
        is PRESERVED
      direction: higher
      minimum_effect: >-
        EXACTLY 1.00. Below 1.00, the hull measurement itself is at fault
        rather than the group, and every A1 number is void.
    - metric: >-
        B1 -- determinantal_identity_match_rate -- fraction of tested instances
        where Delta_{ACB} equals det(A) det(B) Delta_C coefficient-wise over
        F_q, with the scalar RECOVERED and compared, not fitted
      direction: higher
      minimum_effect: >-
        EXACTLY 1.000. This is a theorem and serves as the instrument's null;
        ANY discrepancy is an implementation bug and blocks every other metric
        until fixed. If it persists after the implementation is verified, the
        invariant is mis-stated and the whole idea dies at zero cost.
    - metric: >-
        C1 -- substitution_solution_count -- the number of GL_k substitutions
        matching the determinantal forms of an equivalent pair, per (n, k, q),
        labelled EXHAUSTIVE or LOWER-BOUND
      direction: different
      minimum_effect: >-
        Finite and NOT growing with q on the EXHAUSTIVE cells. Growth with q
        there falsifies Claim C and makes the reduction lose exponentially much
        information. Lower-bound cells may demonstrate growth but can never
        demonstrate its absence.
    - metric: >-
        C2 -- inequivalent_pair_solution_count -- the number of matching
        substitutions on random INEQUIVALENT codes with matching rank
        distribution
      direction: lower
      minimum_effect: >-
        EXACTLY 0. A non-empty result means the invariant is too coarse and the
        reduction is NOT SOUND. BLOCKING -- no positive fibre-size result means
        anything until this returns empty.
    - metric: >-
        C3 -- planted_substitution_recovery -- whether the exhaustive search on
        the baseline slice rediscovers the substitution used to construct the
        equivalent pair
      direction: higher
      minimum_effect: >-
        RECOVERED at every baseline cell. Failure means the search is not
        measuring a fibre and no count is admissible.
    - metric: >-
        G1 -- degenerate_code_density -- fraction of random codes with Delta
        identically zero, or contained in the singular locus, excluded from
        every other metric
      direction: different
      minimum_effect: >-
        Reported per (n, k, q). Exclusions must be counted and reported, not
        silently dropped, since a large exclusion changes what "random code"
        means in every other number.
    - metric: >-
        H1 -- expected_codimension_agreement -- fraction of random codes whose
        singular-locus dimension and irreducible-factor count of Delta match
        the expected-codimension prediction
      direction: higher
      minimum_effect: >-
        Reported with the failing codes examined for whether they are exactly
        the degenerate families. An unexplained failure class falsifies
        HEUR-MCEQ-1.

  test_boundary:
    instances:
      - >-
        Random k-dimensional matrix codes in the n-by-n matrices over F_q at
        n = k in {3, 4, 5} and q in {5, 7, 11, 13}, with random (A, B) in
        GL_n x GL_n applied to form equivalent pairs.
      - >-
        The orthogonal subgroup where B is the inverse transpose of A, as the
        hull-preservation control.
      - >-
        Random INEQUIVALENT code pairs with matching rank distribution, as the
        soundness null.
      - >-
        Deliberately degenerate codes (common kernel vector, common image), as
        the exclusion class whose density is reported.
      - >-
        EXHAUSTIVE GL_k enumeration cells -- n = k = 3 at q in {5, 7}, where
        the enumeration is feasible; all larger cells are LOWER-BOUND searches.
      - >-
        OUT OF SCOPE -- the rectangular case m not equal to n; any parameter at
        or near a deployed matrix-code scheme; and any comparison against
        published matrix-code equivalence algorithms, whose complexities are
        recalled and unverified in this program.
    parameters:
      dimensions: [3, 4, 5]
      field_sizes: [5, 7, 11, 13]
      exhaustive_cells: "n = k = 3 at q in {5, 7}"
      random_group_elements_per_cell: 200
      random_codes_per_cell: 1000
      inequivalent_pairs_per_cell: 200
    implementation: experiments/EXP-MCEQ-e6fcab
    budget:
      stage1_wall_clock_seconds: 600
      stage2_wall_clock_seconds: 1800
      stage3_wall_clock_seconds: 10800
      maximum_memory_gb: 8
      maximum_runs: 8

  distinguishable_outcomes:
    - outcome: >-
        A2 = 1.00, B1 = 1.000, C2 = 0, C3 recovered; A1 approaching 1; and C1
        finite and flat in q on the exhaustive cells.
      means: >-
        All three claims hold at the tested parameters. The hull-based transfer
        is obstructed with a named reason, the determinantal form is a
        correctly-transforming replacement invariant, and the reduction loses
        only a small fibre at these sizes. THIS IS A STRUCTURAL STATEMENT, NOT
        AN ATTACK -- polynomial equivalence is itself hard and nothing here
        claims it is easier, and no statement about any deployed scheme
        follows.
    - outcome: >-
        A2 = 1.00 but A1 = 0 at some cell -- the hull is PRESERVED under
        general (A, B).
      means: >-
        CLAIM A IS FALSE and support splitting may transfer to matrix codes
        after all. This is a strictly MORE useful finding than Claim B and must
        be reported prominently rather than treated as a failed prediction.
    - outcome: >-
        B1 < 1.000.
      means: >-
        Either the implementation is wrong or the invariant is mis-stated.
        BLOCKING -- every other metric is void until the implementation is
        verified. If the discrepancy survives verification, the whole idea dies
        at zero further cost, which is the cheapest possible outcome.
    - outcome: >-
        C2 > 0 -- inequivalent codes admit a matching substitution.
      means: >-
        The invariant is TOO COARSE and the reduction is NOT SOUND. The
        collision is the deliverable and the reduction is withdrawn. No
        fibre-size result means anything.
    - outcome: >-
        C1 GROWS with q on the exhaustive cells.
      means: >-
        CLAIM C IS FALSE. The reduction hides an exponentially growing
        ambiguity and is not a reduction in any useful sense. Reported as a
        named obstruction with the measured growth as the obstruction quantity.
    - outcome: >-
        A2 < 1.00.
      means: >-
        The hull measurement is at fault rather than the group. Every Claim-A
        number is VOID and the deliverable is the instrument defect.
    - outcome: >-
        All three claims hold but solving form equivalence at the tested sizes
        is empirically no cheaper than solving matrix code equivalence
        directly.
      means: >-
        THE PARENT PROPOSAL'S OWN MOST-LIKELY OUTCOME -- the reduction is
        correct and useless. This is a named closure with its evidence and is
        recorded as a result, not buried. It closes the route, not the
        question, and names what a successor would have to improve.

  falsification_conditions:
    - >-
      F1 -- the hull is PRESERVED under general (A, B) while the orthogonal
      control passes. Claim A is FALSE; support splitting may transfer, which
      is the more useful finding.
    - >-
      F2 -- the determinantal identity fails coefficient-wise after the
      implementation is verified. Claim B is FALSE, the invariant is
      mis-stated, and the idea dies at zero further cost.
    - >-
      F3 -- the substitution count GROWS with q on exhaustively enumerated
      cells. Claim C is FALSE and the reduction loses exponentially much
      information.
    - >-
      F4 -- the inequivalent-pair null returns a non-empty solution set. The
      invariant is too coarse and the reduction is unsound.
    - >-
      F5 -- the orthogonal control fails to preserve the hull. Instrument
      defect; every Claim-A number is void.
    - >-
      F6 -- the planted substitution is not recovered on the baseline slice.
      The search is not measuring a fibre and no count is admissible.
    - >-
      F7 -- an unexplained class of random codes fails the expected-codimension
      prediction. HEUR-MCEQ-1 is falsified and Claim C loses its stated
      support.
    - >-
      F8 -- a non-exhaustive search returns a HIGHER count than the exhaustive
      search on a cell where both ran. HEUR-MCEQ-2 fails, the search is
      returning non-solutions, and every count is void.

  interpretation_limits:
    - >-
      A REDUCTION TO HYPERSURFACE EQUIVALENCE IS NOT AN ATTACK. Polynomial
      equivalence is itself a hard problem family and nothing here claims it is
      easier. The honest positive outcome is a correctly-scoped structural
      statement plus a toy-scale fibre measurement.
    - >-
      NO CLAIM ABOUT MEDS OR ANY DEPLOYED MATRIX-CODE SCHEME follows from any
      outcome, and none may be reported.
    - >-
      No comparison against published matrix-code equivalence algorithms is
      made, because this program's characterisation of them is recalled and
      unverified. Their absence from the comparison is a disclosed gap, not an
      implied claim of superiority.
    - >-
      The rectangular case m not equal to n is out of scope entirely; there the
      determinant is undefined and the invariant must be replaced by maximal
      minors, which changes the whole analysis.
    - >-
      CLAIM TIER toy at n = k <= 5 and q <= 13. Small q makes solver behaviour
      atypical, which is why q is swept, and nothing extrapolates beyond the
      tested cells.
    - >-
      The q-growth question is decided ONLY on exhaustively enumerated cells.
      A lower-bound count that is flat in q is NOT evidence that the fibre is
      flat in q.

