  statement: >-
    A window of width 24 stores 8388608 entries. A window of width 23
    stores 4194304. Two to the power 23 is 8388608. Two to the power 22
    is 4194304. Eight million three hundred eighty-eight thousand six
    hundred eight exceeds four million one hundred ninety-four thousand
    three hundred four by 4194304. The product of the two table sizes is
    35184372088832. Their sum is 12582912. Two width-23 tables each store
    4194304, so that gap is 0 and their product is 17592186044416.
  mechanism: >-
    The proposal writes the widths 24 and 23 and the sizes 8388608 and
    4194304. This contract checks those integers. It does not add a
    curve point.
