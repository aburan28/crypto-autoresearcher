hypothesis:
  id: H-QRUOV-e0fb7b
  question_id: RQ-QRUOV-001
  derived_from_idea: IDEA-20260805-8d9ac0
  added: '2026-08-25'
  status: proposed
  proposed_by: coordinator
  statement: >-
    The matched extension-field-UOV baseline and QR-UOV share every attack exponent EXACTLY, because
    the compression parameter ell cancels in both quantities the standard attacks read. Formally,
    for a QR-UOV instance at (q, V, M, ell) presenting over the base field as n = (V + M) ell
    variables and m = M ell equations, and over the extension as N = V + M variables and M
    equations: (i) n - 2m = ell (V - M) and N - 2M = V - M, so the solver costs q^{(V-M)ell} and
    (q^ell)^{V-M} are EQUAL, exactly and not asymptotically; and (ii) n/m = (V + M)/M = N/M, which
    contains no ell, so any attack whose applicability is a threshold on the variables-to-equations
    ratio has the SAME threshold on both sides. The only surviving difference is a polynomial
    cofactor of order ell^{omega - log_2 3} in favour of the extension-field side. SECOND CLAIM, and
    the reason this is not merely bookkeeping: the attacker's oil-space HAYSTACK does not cancel -
    the candidate count falls from about q^{M V ell^2} to about q^{M V ell}, a factor ell IN THE
    EXPONENT - while the best-known attack exponent does not move by a single unit. Generic
    meet-in-the-middle cannot spend that reduction at any parameter set with M at least 2.
  mechanism: >-
    The two presentations are related by a change of presentation, so any quantity defined from the
    presentation SHAPE alone propagates deterministically across it and any FAILURE of invariance
    would localise a real difference. Substituting the parameter relations gives n - 2m = (V + M) ell
    - 2 M ell = (V - M) ell against N - 2M = V - M, whose cost expressions coincide exactly; and n/m
    = (V + M)/M identically, with ell absent. A threshold condition such as n < 3m becomes (V + M)
    ell < 3 M ell, i.e. V < 2M, a condition on V/M alone. The cofactor arises because linear algebra
    on M x M matrices over the degree-ell extension costs about M^omega ell^{log_2 3} base-field
    operations under Karatsuba multiplication, versus (M ell)^omega over the base field, a ratio of
    ell^{omega - log_2 3}. The haystack is counted by the Gaussian binomial for base-field subspaces
    against the module count for free submodules of rank M, giving exponents M V ell^2 and M V ell.
    A generic meet-in-the-middle over the reduced haystack costs about its square root, q^{ell M V /
    2}, which beats q^{ell (V - M)} exactly when M V / 2 < V - M, i.e. V(M - 2) < -2M; for M at least
    2 the left side is non-negative and the right side is negative, so the inequality is NEVER
    satisfied, and only M = 1 with V > 2 admits it.
  assumptions:
  - >-
    The QR-UOV parameter semantics - which of V, M, ell means what, and whether n and m are as
    stated. RECALLED and UNVERIFIED. If the submitted scheme indexes its parameters differently every
    identity must be recomputed, and a reading stage exists for exactly that.
  - >-
    The defining polynomial is irreducible, so the coefficient ring is the extension field and
    'extension-field UOV' is even defined. For a reducible polynomial the matched baseline is not a
    single extension-UOV instance at all; that case is deliberately out of scope.
  - >-
    The linear-algebra exponent omega is not a single agreed value. The cofactor is reported at BOTH
    omega = 2.37 and omega = 3, never at one chosen value, because a cofactor claim depending on an
    unstated omega is not a claim.
  - >-
    A table computed from parameters that could not be READ is a symbolic exercise. Numeric columns
    are either sourced with a locator or marked unavailable; they are never filled from memory.
  proof_search_map:
    bottleneck: >-
      The step that decides the audit is whether the assumed parameter semantics are the scheme's.
      Every identity is one line of substitution downstream of that; if the semantics are wrong,
      every column is wrong, and the identity residual check is what detects it at zero cost.
    baseline_embedding:
      parameter_slice: >-
        Plain UOV at (q, n, m) with n = (V + M) ell and m = M ell is the exact matched slice - the
        SAME base-field system - where the cancellation must hold by construction.
      reproduction_check: >-
        The table must report an exponent ratio of exactly 1.000 between that plain-UOV row and the
        QR-UOV row. Anything else means the arithmetic pipeline is broken.
    observation_collision:
      observable: 'The integer tuple (q, V, M, ell, n, m) and the derived exponents n - 2m, n/m, log_q haystack.'
      distinct_preimage_search: >-
        The projection is trivially and completely lossy - the fibre over a tuple is every key at
        those parameters. THE HONEST READING IS THAT THIS IS VERY CLOSE TO THE MIRROR FAILURE, a
        projection so lossy it is constant, and the constancy IS the finding rather than a defect:
        n - 2m and n/m are pre-computed to be INVARIANT under the descent, and the audit's value is
        that the invariance is derived and stated rather than assumed. The record does not pretend to
        have found a discriminating object; it has found that the two obvious discriminators do not
        discriminate, and names the haystack exponent as the one quantity that DOES vary.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        The pair of exponents (n - 2m, n/m) plus the log haystack, carried across the descent between
        the base-field and extension-field presentations.
      predicted_gain: >-
        Not an attack gain. The gain is a matched baseline that currently does not exist in this
        program, plus the identification of the single quantity that fails to be invariant.
    quantifier_order: >-
      FOR ALL (q, V, M, ell) with the defining polynomial irreducible, the two exponents are equal
      and the shape ratio is ell-free. THERE EXISTS no parameter set at which they differ - and that
      universal statement is exactly what the exhaustive integer sweep tests, rather than a sampled
      check.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest claim a run may support is the audited baseline table, two invariance facts,
        one cofactor, one haystack observation and one derived disposal of generic MITM. The MITM
        disposal closes GENERIC ENUMERATION ONLY; it says nothing about structure-aware attacks over
        the extension, which are named as OPEN rather than described as mined.
      nearby_object_control: >-
        A DELIBERATELY MISMATCHED baseline - UOV over the extension at (N, M) = (V + M, M ell) rather
        than (V + M, M), the wrong descent that confuses equation count with oil dimension. Its
        exponent is ell (V + M - 2 M ell), NEGATIVE for ell at least 2 over a wide range, hence
        manifestly not a matched baseline. The instrument MUST flag it as mismatched; if it reports
        it as comparable, the instrument cannot detect a wrong baseline and NO matched-baseline claim
        may be made from it.
    proof_obligations:
    - claim: '(n - 2m) - ell (V - M) is identically zero under the assumed parameter semantics.'
      responsibility: correctness
    - claim: 'n/m contains no ell.'
      responsibility: correctness
    - claim: 'The recalled solver cost form is the form the literature states.'
      responsibility: baseline
    - claim: 'The haystack exponent ratio is exactly ell up to the Gaussian-binomial o(1).'
      responsibility: size
    - claim: 'Generic MITM never beats the solver for M at least 2, by exhaustive integer enumeration.'
      responsibility: strictness
    - claim: 'The cofactor is a cofactor and moves no exponent.'
      responsibility: scope
    not_applicable_reason: null
  asymptotic_claim:
    problem: null
    prior_best: null
    time_exponent: null
    memory_exponent: null
    hidden_cofactor: null
    claim_kind: null
  heuristic_assumptions:
  - id: HEUR-QRUOV-BASE-1
    formal_statement: >-
      FOR ALL fields F and all n' at least 3m', UOV key recovery over F with n' variables and m'
      equations costs |F|^{n' - 2m'} times a polynomial in (n', m'), with the polynomial factor free
      of |F| beyond the cost of one field operation.
    random_model_justification: >-
      NONE SUPPLIED. Recalled from the multivariate literature, not read by this program.
      Load-bearing for the exponent COLUMNS of the table but NOT for the two identities, which are
      pure arithmetic and unconditional.
    supporting_results: []
    validation_experiment_ids:
    - EXP-QRUOV-0436d5
    falsification_condition: >-
      A primary source states a solver cost incompatible with the recalled form. The recalled form is
      withdrawn and every derived column recomputed; the identities survive and only the
      interpretation changes, which is why the record is built in that order.
  - id: HEUR-QRUOV-BASE-2
    formal_statement: 'The two-map intersection attack applies exactly when n < 3m.'
    random_model_justification: >-
      NONE SUPPLIED. Recalled. Used only to convert a relayed phrase about 'linear solution space'
      into a checkable inequality. If the true condition is a DIFFERENT threshold on n/m, the
      ell-cancellation conclusion is UNCHANGED, because ell cancels in n/m for any threshold
      whatsoever. That robustness is deliberate and is why the ratio, not the threshold, is the
      tracked object.
    supporting_results: []
    validation_experiment_ids:
    - EXP-QRUOV-0436d5
    falsification_condition: >-
      A primary source states a threshold that is not a function of n/m at all. The conversion to
      V < 2M is then void and the applicability column must be recomputed under the true rule.
  structural_ingredients:
  - description: 'The two-map intersection attack applicability threshold on UOV-family schemes.'
    citation: 'Beullens intersection attack - NOT READ, relayed'
    provenance: recalled
    verified_by: null
    role: >-
      Supplies the threshold converted into V < 2M. Only the threshold is used, never a cost, and its
      verification is a reading stage.
  - description: 'Kipnis-Shamir and reconciliation key recovery cost for UOV.'
    citation: 'Kipnis-Shamir / reconciliation - NOT READ, relayed, RECALLED'
    provenance: recalled
    verified_by: null
    role: Used as a RATIO between two presentations, never as an absolute cost.
  - description: >-
      The relayed explanation that a truncated-polynomial-ring UOV framework does not improve on
      MAYO and QR-UOV because their parameter sets do not yield a large enough linear solution space
      for the intersection attack.
    citation: 'ePrint framework paper - ABSTRACT ONLY, not read'
    provenance: recalled
    verified_by: null
    role: >-
      Turned into the falsifiable inequality V >= 2M at every declared set, which is the whole point
      of preferring falsifiable relayed claims over vague ones.
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
  - metric: exponent_invariance_residual
    direction: different
    minimum_effect: >-
      EXACTLY 0 at every declared parameter set and at 10^4 randomly drawn (V, M, ell). A single
      nonzero residual means the assumed parameter semantics are wrong, which terminates the audit
      and redirects it - the cheapest possible failure.
  - metric: shape_ratio_ell_dependence
    direction: different
    minimum_effect: 'EXACTLY 0. n/m = (V + M)/M contains no ell.'
  - metric: intersection_applicability_flag
    direction: different
    minimum_effect: >-
      Pre-registered as FALSE at every declared set, i.e. V at least 2M everywhere. A single declared
      set with V < 2M FALSIFIES the relayed explanation as stated and is the most informative outcome
      available.
  - metric: haystack_exponent_ratio
    direction: higher
    minimum_effect: >-
      EXACTLY ell up to the Gaussian-binomial o(1), and at least 3 at every declared set with ell at
      least 3. Any value near 1 would mean the module constraint is not a real constraint and the
      whole framing is wrong.
  - metric: mitm_beats_solver_flag
    direction: different
    minimum_effect: >-
      FALSE everywhere with M at least 2, TRUE only for M = 1 with V > 2. This is a complete integer
      enumeration over the declared ranges, so the prediction is exact and exhaustive rather than
      statistical.
  test_boundary:
    instances:
    - Every declared QR-UOV parameter set, or a symbolic-only table if none can be read
    - 10^4 randomly drawn integer triples for the identity sweep
    - A deliberately mismatched extension-UOV baseline, as the null object
    - Plain UOV at the matched base-field shape, as the positive control
    parameters:
      arithmetic: exact integer, no floating point in any identity check
      omega: 'both 2.37 and 3, always reported together'
      ell_sweep: '{1, 2, 3, 4, 5, 6, 8} at fixed (V, M) for the graded control'
      mitm_enumeration_range: '1 <= M <= 16, 1 <= V <= 256, exhaustive'
    implementation: >-
      Exact integer arithmetic in Python. No solver, no algebra system, no randomness beyond the
      declared sweep's seed, no network beyond a reading stage.
    budget:
      wall_clock_seconds_per_run: 600
      maximum_memory_gb: 2
  falsification_conditions:
  - >-
    Either identity fails at any parameter set or anywhere in the random sweep. The assumed parameter
    semantics are wrong; the audit STOPS and is redirected.
  - >-
    A primary source states a solver or intersection cost incompatible with the recalled form. The
    recalled form is withdrawn and every derived column recomputed; the record is superseded, never
    edited.
  - >-
    Some declared parameter set has V < 2M. The relayed explanation for QR-UOV's survival is then
    wrong as stated, the reason it survives is something else, and that becomes the new question.
  - >-
    The positive control - plain UOV at the same base-field shape - does not report exponent ratio
    exactly 1.000. The instrument is broken; NOTHING may be reported.
  - >-
    The null object - the deliberately mismatched baseline - is reported as comparable. The
    instrument cannot detect a wrong baseline and no matched-baseline claim may be made from it.
  - >-
    The haystack ratio is not ell. Either the Gaussian-binomial estimate or the module count is
    wrong, and the second half of the record is void.
  interpretation_limits:
  - >-
    THIS HYPOTHESIS MOVES NO EXPONENT AND CLAIMS NO ATTACK. Its deliverable is a baseline, two
    invariance facts, one cofactor, one haystack observation, and one derived disposal of the obvious
    way to spend the haystack.
  - >-
    Everything is conditional on the defining polynomial being irreducible. The reducible case is a
    different object entirely and is out of scope.
  - >-
    A table computed from parameters that could not be READ is a symbolic exercise. Numeric columns
    are sourced with a locator or marked unavailable, never filled from memory (AGENTS.md rule 5).
  - >-
    The MITM disposal closes GENERIC ENUMERATION ONLY. It says nothing about structure-aware attacks
    formulated over the extension - specifically a MinRank or intersection variant where the variable
    count drops by a factor ell before the modelling degree is chosen - and those are named as OPEN
    rather than described as mined. Premature closure is a failure mode symmetric with overclaiming.
  - >-
    The cofactor ell^{omega - log_2 3} is a COFACTOR. It moves no exponent, and the record says so
    explicitly rather than dressing it up.
  prior_evidence_refs: []
