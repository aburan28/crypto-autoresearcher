hypothesis:
  id: H-ICPERF-5f038b
  question_id: RQ-ICPERF-94c86e
  question_ids:
    - RQ-ICPERF-94c86e
  goal_id: GOAL-ICPERF-e6b6a4
  proposal_id: IDEA-20260915-5c407a
  proposal_note: >-
    Designed from IDEA-20260915-5c407a (descent layer of the three-record graph
    reframing filed 2026-09-15 under RQ-ICPERF-94c86e). The idea carries
    novelty_status: unverified and every literature citation in it is
    `recalled`; this hypothesis inherits that status and asserts nothing about
    priority. Designing is not approving: EXP-ICPERF-025a52 sits at
    approved_by: null until a separate committed Coordinator decision, and the
    novelty screen TASK-20260915-532164 is a precondition of that decision.
  title: >-
    In a declared degree-decreasing descent over F_2[x], the tree-to-DAG sharing
    ratio rho_j = T_j/U_j is measurable, is 1 exactly when the memo table is off,
    and first exceeds 2 within one level of the pigeonhole crossover computed
    analytically and frozen BEFORE the measurement
  statement: >-
    Fix the frozen descent rule D(n, b, alpha, d_a, K_try) of
    EXP-ICPERF-025a52 section `descent_rule`: in F_{2^n} = F_2[x]/(f) with f a
    declared irreducible of prime degree n, factor base FB(b) = all monic
    irreducibles of degree <= b, a descent step on a monic target t of degree
    d_t > b draws a b-smooth multiplier a, forms w = (a*t) mod f, and accepts
    when every irreducible factor of w has degree <= max(b, ceil(alpha*d_t))
    and strictly below d_t; the children of t are the distinct factors of w of
    degree > b; the relation choice at a node is a deterministic function of
    that node's canonical form and a global seed, so the tree unrolling is
    exactly the path-count expansion of the measured DAG. Over the frozen grid
    n in {61, 89, 127}, b in {3, 4, 5}, alpha in {0.6, 0.7, 0.8}, 20 declared-seed
    targets per cell, and with T_j (level-j node occurrences in the tree
    unrolling), U_j (distinct level-j nodes), rho_j = T_j/U_j, M_j (the exact
    count of monic irreducibles in the level-j degree window), and
    j* = the pre-registered pigeonhole crossover level of Stage A:
    (P1) INSTRUMENT. Every emitted relation satisfies (a*t) mod f = w and
    w = product of its reported factors, re-verified by a checker written
    without reading the descent implementation; every memo hit is a byte-equal
    canonical form; and with the memo table DISABLED the instrument reports
    rho_j = 1 exactly at every level of every cell.
    (P2) SHARING EXISTS. In at least one feasible grid cell whose measured
    descent depth is >= 4, rho_j >= 1.5 at the deepest level carrying >= 50 tree
    occurrences.
    (P3) MECHANISM, PRE-REGISTERED. In the cells satisfying P2, rho_j is
    non-decreasing in j over levels 1..depth, and the smallest level at which
    rho_j > 2 lies within one level of j*, where j* was computed in Stage A from
    exact M_j and the declared branching model and frozen (hashed into the Stage
    B manifest) before any rho_j was measured.
    (P4) NULL OBJECT. At the deepest level common to both, the measured rho_j
    exceeds the rho_j of the matched random branching process -- same per-level
    branching-factor distribution, same per-level pool sizes M_j, children drawn
    uniformly from the level pool, >= 20 seeds -- by at least two standard
    deviations of the null's own seed-to-seed spread.
  mechanism: >-
    A descent step replaces a target by strictly smaller elements, so the
    recursion is a DAG whose acyclicity is free from the same strict-decrease
    property that makes descent terminate. Cost analyses in this program and (per
    the recalled pointers below, unverified) in the literature charge descent by
    the node count of the TREE unrolling, which equals the DAG node count only if
    every level-j node is distinct. The level-j nodes are drawn from a pool of
    monic irreducibles whose size M_j is exactly computable, so once the level-j
    occurrence count approaches M_j, repetition is FORCED by pigeonhole and the
    tree over-counts the distinct work. A memoising (DAG) implementation solves
    each distinct node once; the achievable saving is exactly rho_j. Whether
    rho_j stays at 1 (R1: tree analysis tight), settles at a constant (R2:
    constant-factor engineering item), or grows with j (R3: the descent phase's
    charged cost is an over-estimate that grows with depth) is the whole
    question, and it is decided by measurement, not by this paragraph. Only R3
    has exponent content, and even R3 at toy depth licenses no asymptotic claim
    (see interpretation_limits).
  assumptions:
    - >-
      The descent rule of EXP-ICPERF-025a52 is a DECLARED, SIMPLIFIED
      degree-decreasing descent over F_2[x]. It is not the FFS special-q descent,
      not Joux's L(1/4) descent, and not the Granger-Kleinjung-Zumbraegel
      quasi-polynomial descent. Every number produced is about THIS rule; transfer
      to any published descent is not licensed by this hypothesis and is not
      claimed by it.
    - >-
      Relation choice is deterministic per node (seed derived from the node's
      canonical bytes), which is what makes the tree unrolling computable by path
      counting instead of by re-solving. A re-randomising tree implementation
      would build a different and generally larger tree, so the measured rho_j is
      the sharing available to a memoising implementation that makes the same
      choice at the same node -- not a universal statement about tree
      implementations.
    - >-
      Canonicalisation is exact for F_2[x]: two nodes are equal iff their monic
      canonical byte forms are equal. The over-merge failure mode that
      IDEA-20260915-5c407a flags as silent for general element types is
      DECIDABLE here, which is one reason this object was chosen first. The
      under-merge direction remains: rho_j is a lower bound on true sharing.
    - >-
      No discrete logarithm is computed anywhere in this design. Correctness is
      carried by per-relation algebraic identities, not by a known-answer log, so
      no full DLP solve in F_{2^n} is required. A statement about recovered
      logarithms would need the linear-algebra phase, which is out of scope here.
    - >-
      A node that finds no accepting relation within K_try draws is a PARAMETER
      or INFRASTRUCTURE outcome (AGENTS.md rule 5); it is excluded from rho_j with
      its count reported, and it is never evidence that sharing is absent.
  proof_search_map:
    applicability: >-
      Measurement hypothesis with a cost-model consequence. It is not a theorem
      proposal, but the R3 branch would revise a charged exponent, so the section-8
      audits are run rather than waived.
    bottleneck: >-
      The individual-logarithm / descent phase's charged cost, which
      RQ-ICPERF-94c86e names as its own column and which every internal cost model
      in this program currently charges by tree node count.
    baseline_embedding:
      parameter_slice: >-
        The baseline is the SAME instrumented descent with the memo table
        disabled, on the same targets and seeds. It is reproduced exactly by
        construction (one implementation, one flag), which is why no external
        baseline reproduction is claimed.
      reproduction_check: >-
        Control C-MEMO-OFF: the memo-off run must report rho_j = 1 exactly at
        every level. Published descent timings are NOT reproduced and enter no
        ratio.
    observation_collision:
      observable: >-
        rho_j = T_j / U_j at each level, plus the in-degree distribution of shared
        nodes.
      distinct_preimage_search: >-
        The collision that would make rho_j uninformative is that a matched random
        branching process produces the same rho_j -- i.e. the observable sees
        pigeonhole counting and nothing about the descent. That collision is
        searched for directly by control C-NULL and is prediction P4; a null-matched
        rho_j is reported as a real saving with no structural content, not as a
        finding.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The memoised descent DAG: common-subexpression elimination on the
          recursion, keyed on the exact canonical form of the node.
        predicted_gain: >-
          sum_j U_j relation-finding calls in place of sum_j T_j. Whether that
          ratio is 1, a constant, or growing is measured, not predicted.
    quantifier_order: >-
      For each feasible grid cell (n, b, alpha) and each of the 20 declared-seed
      targets in it, for each level j of the measured DAG: T_j, U_j, rho_j and
      M_j are reported per target and aggregated per cell as medians with the
      seed-to-seed spread. Nothing is claimed for any n, b, alpha, target,
      descent rule, field, or curve outside the frozen grid. j* is a function of
      (n, b, alpha) fixed in Stage A before any Stage B measurement exists.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For the declared descent rule on the declared grid, the tree unrolling
        over-counts distinct descent work by the measured factor rho_j, with the
        stated spread, and the growth of rho_j in j is as measured." Nothing
        asymptotic, nothing about ECDLP, nothing about any published descent.
      nearby_object_control: >-
        The matched random branching process (C-NULL): same branching-factor
        distribution, same pool sizes, uniform children. It is the nearby object
        for which the "sharing" conclusion is true for a reason that has nothing
        to do with descent, and P4 is its discriminating prediction.
    proof_obligations:
      - claim: Every emitted relation is an identity in F_2[x]/(f).
        responsibility: correctness
      - claim: The tree unrolling equals the path-count expansion of the DAG.
        responsibility: correctness
      - claim: M_j is the exact count of monic irreducibles in the level window.
        responsibility: size
      - claim: rho_j measured is a lower bound on true sharing.
        responsibility: scope
      - claim: >-
          Any statement that a smaller sum_j U_j reduces charged descent cost
          must charge the memo table's MEMORY beside the time it saves.
        responsibility: memory
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. This hypothesis claims no complexity improvement and no
    exponent. Regime R3, if measured, would say that a charged cost model
    over-states descent work at the tested depths; converting that into any
    asymptotic statement would require the four promotion gates in
    agents/coordinator.md and is not attempted, proposed, or implied here.
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        For a descent whose level-j nodes are drawn from a pool of size M_j with
        per-level branching factor distribution B_j, the number of DISTINCT
        level-j nodes behaves like the occupancy count of T_j balls thrown
        uniformly into M_j boxes: U_j ~ M_j (1 - exp(-T_j / M_j)), and the
        pigeonhole crossover level j* is the least j with T_j >= M_j.
      random_model_justification: >-
        The accepting relation at a node is selected by a smoothness criterion on
        w = (a*t) mod f that is not known to correlate with which sibling branch
        requested the node, so sibling branches are modelled as independent draws
        from the level pool. This is the standard occupancy heuristic. It is
        TESTED here rather than assumed: control C-NULL instantiates exactly this
        model and P4 is its falsification test, while P3 uses its crossover
        prediction j* as a PRE-REGISTERED quantity.
      supporting_results: []
      supporting_results_note: >-
        Empty on purpose. The occupancy bound and the F_2[x] smoothness-density
        results that would justify it are known to this record only as recalled
        pointers, and AGENTS.md rule 9 forbids a recalled reference from
        discharging supporting_results. The novelty screen TASK-20260915-532164
        is the task that may convert them.
      validation_experiment_ids:
        - EXP-ICPERF-025a52
      falsification_condition: >-
        Measured U_j departing from the occupancy prediction by more than the
        null's own seed-to-seed spread in EITHER direction: below means the
        descent concentrates on a smaller effective pool than its nominal size
        (the interesting case); above means it anti-concentrates.
  structural_ingredients:
    - description: >-
        Exact count of monic irreducible polynomials of degree d over F_2,
        (1/d) * sum_{e | d} mu(e) 2^{d/e}, which supplies M_j without estimation.
      citation: Gauss's necklace / Moebius-inversion count of irreducibles over a finite field (standard).
      provenance: recalled
      role: exact pool size M_j; cross-checked by direct enumeration for d <= 12
    - description: >-
        Recursive descent in index calculus over small-characteristic fields; the
        recursions whose depth makes the phenomenon reachable at all.
      citation: >-
        A. Joux, "A new index calculus algorithm with complexity L(1/4+o(1))",
        SAC 2013; R. Granger, T. Kleinjung, J. Zumbraegel, "On the discrete
        logarithm problem in finite fields of fixed characteristic", Trans. AMS
        370 (2018). RECALLED pointers for the reviewer; not support, and NOT the
        descent rule measured here.
      provenance: recalled
      role: context only; the measured rule is the declared one, not these
    - description: >-
        Special-q descent in NFS/FFS, the individual-logarithm phase whose cost is
        conventionally charged on the descent tree.
      citation: >-
        A. Commeine, I. Semaev, "An algorithm to solve the discrete logarithm
        problem with the number field sieve", PKC 2006. RECALLED pointer.
      provenance: recalled
      role: the tree-charged convention this hypothesis questions
    - description: >-
        Recursive decomposition over E/F_{q^n}: the ECDLP instance of the same
        structure, deliberately NOT measured in this contract.
      citation: >-
        C. Diem, "On the discrete logarithm problem in elliptic curves",
        Compositio Math. 147 (2011). RECALLED pointer.
      provenance: recalled
      role: names the successor contract's object, not this one's
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: relation identity verification rate and memo-off rho_j (P1)
      direction: different
      minimum_effect: 100% identities verified; memo-off rho_j exactly 1.0 at every level
    - metric: rho_j at the deepest level with >= 50 occurrences, depth >= 4 cells (P2)
      direction: higher
      minimum_effect: rho_j >= 1.5 in at least one feasible cell
    - metric: level at which rho_j first exceeds 2, against pre-registered j* (P3)
      direction: different
      minimum_effect: within one level of j*, with rho_j non-decreasing in j
    - metric: rho_j real minus rho_j null at the deepest common level (P4)
      direction: higher
      minimum_effect: at least 2 standard deviations of the null's seed-to-seed spread
  test_boundary:
    instances:
      - >-
        F_{2^n} for n in {61, 89, 127}, each with the declared irreducible modulus
        recorded in the run manifest and re-checked for irreducibility by the
        independent checker
      - 20 declared-seed random monic targets per (n, b, alpha) cell
      - >-
        matched random branching processes, >= 20 seeds per cell, parameterised
        from the measured branching distribution and the exact M_j
    parameters:
      b: [3, 4, 5]
      alpha: [0.6, 0.7, 0.8]
      d_a: 4*b (degree bound on the b-smooth multiplier a)
      K_try: 100000 draws per node before the node is recorded as a descent failure
      memo_key: the monic canonical byte form of the polynomial, frozen before any run
      primary_unit: >-
        node occurrences T_j and distinct nodes U_j per level (hardware
        independent); wall time and peak RSS secondary
      seeds: global seed 20260915; per-target seed 20260915000 + 1000*n + target_index
    implementation: >-
      New module under experiments/EXP-ICPERF-025a52/code/. One descent
      implementation, one relation finder, one memo flag: the tree and DAG
      readings differ only by that flag and by path counting, so the comparison
      cannot be confounded by two implementations of the same step. The
      certificate checker is written WITHOUT reading the descent implementation.
      No edit to any frozen ICPERF harness. Promotion to tools/ only after a
      validator has run it.
    budget:
      stage_a_wall_clock_seconds: 600
      stage_b_wall_clock_seconds: 7200
      maximum_memory_gb: 2
      network: none
      note: >-
        Advisory per docs/research-budget-policy.md; the campaign budget of
        GOAL-ICPERF-e6b6a4 is unlimited (ECC). These numbers size machine
        headroom and stopping rules, not permission.
  falsification_conditions:
    - >-
      F0 (instrument): P1 fails -- a relation identity does not verify, a memo hit
      merges two non-identical canonical forms, or the memo-off control reports
      rho_j != 1. The instrument is then invalid and NO rho_j number means
      anything until it is repaired. This is an instrument failure, not evidence
      about descent.
    - >-
      F1: P2 fails -- rho_j <= 1.1 at every level of every feasible cell. Regime
      R1 at the tested scale: the tree analysis is tight for this descent rule on
      this grid, and the direction closes AT THAT SCOPE with a measured number.
    - >-
      F2: P3 fails -- rho_j flat in j (regime R2: constant-factor engineering item,
      no exponent content, goes in the boundary table's descent column and nowhere
      else), or rho_j rises at a level unrelated to the pre-registered j* (the
      number stands, the pigeonhole explanation does not, and no extrapolation is
      licensed).
    - >-
      F3: P4 fails -- real and matched-random rho_j are indistinguishable. The
      sharing is then pure occupancy counting: a genuine saving, but carrying no
      information about the descent's mathematics.
    - >-
      F4: descent failures dominate (a declared majority of nodes exhaust K_try)
      so that no rho_j can be measured within budget. INFRASTRUCTURE/PARAMETER
      outcome under AGENTS.md rule 5 -- never negative evidence about sharing, and
      never evidence that any instance has no relation.
  interpretation_limits:
    - >-
      THIS IS NOT AN ECDLP RESULT AND NOT AN ELLIPTIC-CURVE MEASUREMENT. It
      measures a declared descent over F_2[x] because that is where depth exists
      at executable cost. Its bearing on GOAL-ICPERF-e6b6a4 is on the DESCENT
      COLUMN of the boundary table's cost model; the ECDLP arm that
      IDEA-20260915-5c407a proposes (and predicts negative) is deliberately NOT in
      this contract and needs its own.
    - >-
      Every rho_j is a LOWER BOUND on true sharing: canonicalisation can only
      under-merge here, so a measured rho_j = 1 does not prove that no sharing
      exists.
    - >-
      rho_j is measured for the declared descent rule under deterministic
      per-node relation choice. It is not a measurement of FFS special-q descent,
      of Joux's or GKZ's descents, or of any re-randomising tree implementation.
    - >-
      R3 at toy depth does not establish R3 asymptotically. The pigeonhole
      mechanism gives a reason to expect persistence; a reason is not a proof, and
      any extrapolation to cryptographic sizes is arithmetic on numbered
      assumptions and must be labelled as such.
    - >-
      Memoised descent trades time for MEMORY. No cost statement may leave this
      line without charging the memo table, whose size is sum_j U_j entries.
    - >-
      novelty_status of the originating idea is `unverified` and all of its
      literature is `recalled`. If the screen finds rho_j measured and published,
      or finds the published analyses already stated on the DAG, this hypothesis
      is dominated or emptied of exponent content by argument and should be
      superseded rather than run.
