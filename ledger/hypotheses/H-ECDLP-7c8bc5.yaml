hypothesis:
  id: H-ECDLP-7c8bc5
  question_id: RQ-DREG-001
  statement: >-
    The crypto-scale generic baseline committed in GOAL-DREG-001's BATCH-001
    checkpoint - quoted verbatim from the record as "(t=7 n=161 -> d_reg=150,
    Grobner 2^1194 vs rho 2^80.5)" - is the square of the Macaulay column count
    N(966,150) at linear-algebra exponent omega = 2, carries no memory term, and
    rests on an unnamed global semi-regularity assumption that the chained
    system's block support structure demonstrably violates. The hypothesis is
    that (i) the figure reconstructs exactly as N(966,150)^omega with omega = 2;
    (ii) the per-block freeze degrees at t = 7 are strictly below the global 150;
    (iii) the memory requirement is at least the column count, about 2^597 bits,
    against Pollard rho at negligible memory. NO ATTACK IS CLAIMED OR IMPLIED:
    even the most favourable reading examined is hundreds of bits above rho.
    Source proposal: IDEA-20260805-e732ed.
  mechanism: >-
    At t = 7 the chained system has six summation equations, hence 6n = 966
    boolean equations after Weil descent, in n(t-2) + kt = 966 boolean unknowns
    with k = ceil(161/7) = 23. A summation polynomial whose three arguments are
    all variables descends to boolean degree 3 and one with a constant argument
    to degree 2, so the degree histogram is 161 quadrics and 805 cubics, and the
    freeze degree of (1+z)^966 (1+z^2)^(-161) (1+z^3)^(-805) is the quoted 150.
    The cost figure is then the column count raised to omega. Three audits
    follow. (1) omega = 2 is a theoretical floor for matrix multiplication and is
    not attained by any implemented GF(2) linear algebra, so the same formula
    gives a 600-bit family across omega in {2, 2.37, 3}. (2) The matrix has
    2^597 columns, so memory is at least 2^597 bits and is the binding
    constraint, while the comparator has negligible memory. (3) The semi-regular
    series models 966 polynomials in general position on 966 variables, but each
    equation's support lies in the subring generated by the boolean coordinates
    of its three arguments - 184, 207 or 345 variables of 966 - and evaluating
    the same series per block gives freeze degrees far below 150. Which way the
    resulting error goes is NOT asserted: support restriction removes columns and
    tends to raise the solving degree, while early block saturation supplies
    relations and tends to lower it.
  assumptions:
    - >-
      That the committed 2^1194 is N(966,150)^2 at omega = 2. Supported by the
      source proposal's exact reconstruction to 0.4 bits, but NOT CONFIRMED
      against the original derivation, which neither the proposal nor this
      design session opened. Stage 1 of the experiment opens the archived cost
      script and settles it; a different formula that coincidentally lands
      within 0.4 bits would require the first two audits to be restated.
    - >-
      That the t = 7 parameter reading (k = 23, nb = 966, 161 quadrics, 805
      cubics) matches the one the committed checkpoint used. Supported by the
      freeze degree coming out at exactly 150.
    - >-
      That the block support structure claim - each equation's support lies in a
      proper subring - is a property of the committed system source, not of a
      paraphrase. The proposal states it was read from the system builder
      source; this design session did not open that source and Stage 1 must
      re-read it.
  proof_search_map:
    bottleneck: >-
      The step whose removal changes the goal's headline is the projection of a
      (omega, memory model, genericity assumption) triple onto a single scalar
      2^1194, followed by a binary comparison against rho on the time axis only.
    baseline_embedding:
      parameter_slice: >-
        The exact old-method boundary is the committed cell itself: nb = 966,
        degree histogram (161, 805), freeze degree 150, log2 column count
        597.19.
      reproduction_check: >-
        A frozen regression fixture. The pipeline must return exactly 150 and
        597.19 for the committed cell before any audit finding is credited. If
        it does not, the reconstruction is aimed at the wrong expression and no
        finding stands.
    observation_collision:
      observable: >-
        The scalar log2 cost, 1194.
      distinct_preimage_search: >-
        PERFORMED, AND THE FIBRE IS LARGE. Every (omega, memory model,
        genericity assumption) triple landing on 1194 is in the fibre, and those
        triples give answers spanning 2^787 to 2^1792. The projection is also
        incompatible with the comparison it is used for, because the comparator
        differs on the discarded memory axis by 2^597.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          A cost BRACKET with its conditions attached: omega in {2, 2.37, 3}
          crossed with reading in {global, block-bounded}, crossed with {time,
          memory}, with rho's row beside it and every cell labelled with the
          assumption that produces it.
        predicted_gain: >-
          Replaces one unlabelled exponent with a bracket, a memory exponent,
          and a named heuristic carrying a falsification condition, which is the
          minimum a cost claim must meet under the program's own target profile.
    quantifier_order: >-
      FOR ALL three block shapes at t = 7, the per-block freeze degree is
      strictly less than the global freeze degree 150; and FOR ALL rungs of the
      t = 3 toy ladder, the gap between the full-support and block freeze degrees
      is at least 2. The existential that breaks it is THERE EXISTS a block whose
      freeze degree is at least 150, or a rung whose gap is below 2.
    method_ceiling:
      strongest_certifiable_claim: >-
        That the committed headline is the most optimistic member of a family, is
        stated without a memory column, and rests on a genericity assumption the
        system violates in a visible way. It CANNOT certify the direction of the
        resulting error, cannot certify any cost figure, and certainly cannot
        certify an attack.
      nearby_object_control: >-
        t = 3, where the block gap is only 2 to 3 degrees and where actual
        measurements exist. If the block story cannot be seen at t = 3, claiming
        it at t = 7 on series arithmetic alone is unsupported and the audit must
        say so.
    proof_obligations:
      - claim: The archived formula is N(nb, d_reg)^omega with omega = 2
        responsibility: baseline
      - claim: Every per-block freeze degree at t = 7 is strictly below 150
        responsibility: size
      - claim: Memory is at least the column count
        responsibility: memory
      - claim: The full-support null shows a gap of exactly zero
        responsibility: interface
      - claim: No reading in the bracket is presented as an attack
        responsibility: scope
  rerandomization: null
  asymptotic_claim:
    problem: >-
      Boolean chained-summation Groebner solving cost at t = 7, n = 161, as a
      baseline against Pollard rho for prime-field ECDLP at the same group order.
    prior_best: 'Pollard rho / van Oorschot-Wiener at 2^80.5 time, negligible memory'
    time_exponent: >-
      NO NEW EXPONENT IS CLAIMED. The exponent AUDITED is 1194 (log2, at t=7
      n=161, omega=2), and the bracket this audit opens on it is [787, 1792] once
      omega and the block reading are varied. Nothing in that bracket is an
      attack; every reading is hundreds of bits above rho.
    memory_exponent: >-
      At least 597 (log2 bits) for the Groebner route at the quoted parameters,
      versus O(log p) for rho. Currently absent from every record in this lane.
    hidden_cofactor: >-
      The cost of CONSTRUCTING the degree-150 Macaulay matrix at all, which the
      system builder's own module documentation records as the gating
      bottleneck, and which no cost figure in this lane includes.
    claim_kind: cofactor_improvement
  heuristic_assumptions:
    - id: HEUR-DREG-GEN-1
      formal_statement: >-
        GLOBAL SEMI-REGULARITY. For the boolean chained summation system at
        parameters (t, n), the Macaulay rank at every degree D equals the
        semi-regular prediction derived from H(z) = (1+z)^nb * prod_i
        (1+z^(d_i))^(-1), i.e. the system behaves as though its polynomials were
        in general position on all nb variables, notwithstanding that each
        polynomial's support lies in a proper subring.
      random_model_justification: >-
        The semi-regularity framework is the standard model for random systems
        of given degrees; applying it to a SUPPORT-STRUCTURED system is an
        extrapolation with no justification offered in this corpus, and naming
        that is the point of this entry.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-0ecf02
      falsification_condition: >-
        The measured Macaulay rank of the real system departs from the
        semi-regular prediction at any tested degree. The source proposal
        reports that this lane's own toy ladder ALREADY shows a nonzero deficit
        at every measured rung, so the heuristic is already falsified as an
        EQUALITY at toy scale; the open question is its magnitude and scaling,
        and its unlabelled use at t = 7, n = 161 is the defect this record
        reports. The experiment re-measures the deficit rather than relying on
        the proposal's numbers.
    - id: HEUR-DREG-GEN-2
      formal_statement: >-
        COST MODEL. Solving cost equals the Macaulay column count at the solving
        degree raised to omega, with omega = 2 and memory not charged.
      random_model_justification: >-
        None. omega = 2 is a theoretical floor for matrix multiplication not
        achieved by any implemented GF(2) linear algebra, and the memory
        omission has no support at all - the column count IS a memory lower
        bound.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-0ecf02
      falsification_condition: >-
        The archived derivation is found to use a different formula. Then this
        heuristic is misattributed and both cost audits are restated against
        what the archive actually says.
  structural_ingredients:
    - description: >-
        The committed crypto-scale baseline text of GOAL-DREG-001's BATCH-001
        checkpoint, quoted verbatim from the record: "the crypto-scale generic
        baseline (t=7 n=161 -> d_reg=150, Grobner 2^1194 vs rho 2^80.5)".
      citation: ledger/goals/GOAL-DREG-001.yaml
      provenance: internal
      verified_by: >-
        Coordinator subagent under TASK-20260904-43152a located and read this
        line by pattern search in ledger/goals/GOAL-DREG-001.yaml on 2026-09-04
        and reproduces it verbatim above; the source proposal's quotation is
        CONFIRMED faithful, including the absence of any omega and any memory
        term on that line. The read was by pattern match, not a full-file read;
        the absence claim is therefore scoped to the matched lines and to the
        patterns searched (2^1194, d_reg=150, 2^80.5), and Stage 1 must
        establish the absence over the whole record.
      role: >-
        Fixes the exact expression the audit is aimed at.
    - description: >-
        The semi-regular Hilbert series and its freeze degree as the standard
        model for the solving degree of a system of given degrees.
      citation: >-
        Bardet, Faugere and Salvy, on the complexity of Groebner basis
        computation for semi-regular overdetermined systems. Named as the
        nearest work this design session can recall; the source proposal records
        that this primary literature is NOT RETRIEVED AND NOT VERIFIABLE FROM
        THAT ENVIRONMENT, and no agent in this program has opened it for this
        record.
      provenance: recalled
      verified_by: null
      role: >-
        Supplies the series whose freeze degree is computed. Being `recalled` it
        is a pointer for the reviewer and may not discharge any supporting
        result.
  reduction_chain:
    core_problem: >-
      What the committed crypto-scale baseline of this lane actually asserts,
      and under which assumptions.
    corollaries: []
  predictions:
    - metric: >-
        reconstruction of the committed figures - freeze degree (integer,
        degrees) and log2 cost (bits) - from the archived cost script
      direction: different
      minimum_effect: >-
        Exactly 150 and 1194 to within 0.5 bits. This is the positive control on
        the reconstruction; it can fail, and if it does no audit finding stands.
    - metric: >-
        per-block freeze degrees at t = 7, n = 161 for the three block shapes
        with (n+k), (n+2k) and (2n+k) variables (integers, degrees)
      direction: lower
      minimum_effect: >-
        Exactly 25, 43 and 80, all strictly below 150. Forced pre-run. If any
        block freeze equals or exceeds 150, the genericity finding is void.
    - metric: >-
        gap between full-support and block freeze degrees at t = 3 across the toy
        ladder (integer, degrees)
      direction: higher
      minimum_effect: >-
        At least 2 at every rung. If the gap is not at least 2 at every rung, the
        block effect is not present even in the model and the third finding
        collapses at zero compute.
    - metric: 'omega sensitivity of the headline, log2 cost (bits)'
      direction: higher
      minimum_effect: >-
        1194 / 1415 / 1792 at omega = 2 / 2.37 / 3, a 598-bit span against a
        headline reported as one number.
    - metric: 'memory exponent of the Groebner route at the quoted parameters, log2 bits'
      direction: higher
      minimum_effect: >-
        At least 597, forced by the column count, against rho at O(log p). No
        record in this lane states any memory figure; if one is found, that
        finding is withdrawn.
    - metric: >-
        toy-scale sign test - measured saturation degree of the block-A
        subsystem alone versus the full system, at the two smallest toy rungs
        (integer, degrees)
      direction: lower
      minimum_effect: >-
        The block-A subsystem must saturate at a degree at least 2 below the full
        system's, matching the series prediction. If it does not, the block model
        is wrong about the real systems and not merely about the series.
  test_boundary:
    instances:
      - 'The committed t = 7, n = 161 cell, evaluated as series arithmetic only.'
      - 'The t = 3 toy ladder at n in {9, 12, 15, 18, 21, 24, 30}, series arithmetic.'
      - 'A full-support synthetic system with the same nb and the same degree histogram, as the null.'
      - 'A curve-free random GF(2) system with the same block support pattern, for the optional measured stage.'
      - 'Optional and separately authorised: measured saturation degrees at n = 9 and n = 12.'
    parameters:
      t_values: '3 and 7'
      nb_at_t7: 966
      degree_histogram_at_t7: '161 quadrics, 805 cubics'
      omega_values: '2, 2.37, 3'
      block_variable_counts_at_t7: '184, 207, 345'
    implementation: >-
      Power-series arithmetic over the integers in pure Python; the freeze degree
      is the first index at which the series coefficient becomes non-positive.
      The optional measured stage needs a GF(2) linear-algebra routine and is
      separately authorised.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 1
      maximum_memory_gb: 8
      maximum_runs: 4
  falsification_conditions:
    - >-
      The archived derivation shows the committed figure is not the column count
      raised to omega = 2. Findings (1) and (2) are restated against the real
      formula or withdrawn.
    - >-
      Any t = 7 block freeze degree is at least 150, or any t = 3 gap is below 2.
      The genericity finding is void.
    - >-
      The full-support null shows a nonzero gap. The instrument is broken and
      nothing may be reported.
    - >-
      A memory figure is found on the record for this baseline. Finding (2) is
      withdrawn.
    - >-
      The curve-free random GF(2) system with the same block pattern reproduces
      the measured block-versus-full saturation gap. The effect is then a
      property of block support in GF(2) systems generally and NOT of summation
      polynomials or elliptic curves, and nothing may be quoted as a statement
      about elliptic curves or the ECDLP.
  interpretation_limits:
    - >-
      NO ATTACK, NO EXPONENT MOVED, NO STATUS CHANGE. The audit produces a
      conditioned baseline and a named heuristic. It does not weaken or support
      the lane's hypothesis, does not close its research question, and does not
      authorise revising the committed checkpoint, which is immutable and whose
      correction, if warranted, is a superseding Coordinator record.
    - >-
      SIGN UNKNOWN. The audit establishes that the genericity assumption is
      violated; it does NOT establish the direction of the resulting error. The
      two candidate mechanisms point opposite ways, and anyone citing this record
      to argue the true cost is LOWER is misusing it.
    - >-
      Crypto-scale ARITHMETIC on a toy-validated model is not crypto-scale
      EVIDENCE. Every number at t = 7, n = 161 here is the output of a heuristic
      series, is labelled model-derived, and carries the prohibition on toy-to-
      crypto extrapolation.
    - >-
      NOT TESTABLE AT REACHABLE SCALE, STATED PLAINLY RATHER THAN SHRUNK. The
      sign of the block correction at t = 7, n = 161 cannot be measured by any
      reachable computation: the Macaulay matrix at degree 150 has about 2^597
      columns, so constructing it is infeasible by an astronomical margin. The
      experiment measures the sign only at t = 3 toy rungs and states that a
      toy-scale sign does not transfer.
    - >-
      A reader skimming a number such as 2^787 out of this record without its
      conditions would be reading an attack claim into a record that makes none.
  status: proposed
  proposed_by: coordinator
  source_refs:
    - ledger/proposals/IDEA-20260805-e732ed.yaml
    - ledger/goals/GOAL-DREG-001.yaml
    - ledger/RQ-DREG-001.yaml
    - experiments/EXP-ECDLP-0ecf02/specification.yaml
