hypothesis:
  id: H-HPSC-e76e8e
  question_id: RQ-MONO-001
  question_id_note: >-
    Attached to the nearest existing question rather than minting a new RQ. This
    hypothesis is about the H-PSEUDO constant, not about monodromy; a properly
    constituted Coordinator should either mint RQ-HPSC-* or re-point this field.
    Recorded as a known imperfection rather than silently inventing a question record.
  added: '2026-08-07'
  status: measured_scoped

  statement: >-
    Let E/F_p have prime order N, G a generator, F_t = {P in E(F_p) : x(P) < t} with
    t = floor(p/2), and
        C = max_{k != 0} | sum_{P in F_t} e(2 pi i k DL_G(P) / N) | / sqrt(|F_t|).
    (H1) The corpus's recorded characterization C(p) ~ p^0.079 (KN-FIND-e7a3b1,
    KN-FIND-4c9e71 as corrected) is FALSE for both the curve-mean and the
    curve-maximum of C, when the number of curves is held equal across primes.
    (H2) More important: over any prime range reachable at toy scale, a power law, a
    sqrt(log p) law and a log p law fit C(p) within noise of each other, while their
    extrapolations to p = 2^256 differ by orders of magnitude. The functional FORM of
    C(p) is therefore not determined by the data the corpus has, and the crypto-scale
    yield-error claim that rests on it is unsupported in either direction.

  mechanism: >-
    (H1) The prior measurements compared a MAXIMUM over unequal sample sizes: 152 curves
    at p=1009 against 6 at p=50021 (KN-FIND-4c9e71's own table). The maximum of a sample
    is an increasing function of the sample size, so an unmatched comparison confounds
    growth in p with growth in n. Two of the four primes in KN-FIND-d4f820 also used a
    truncated k-range (k = 1..300 rather than 1..N-1), which biases the max downward at
    exactly those points. Matching n and using the full k-range removes both confounds.

    (H2) The textbook heuristic for a pseudorandom subset of size B in Z/N gives
    max_k |1hat_F(k)| ~ sqrt(B log N), i.e. C ~ sqrt(log p). A logarithm and a small
    power are nearly collinear over a few hundred-fold range of p. Fitting a power law
    without testing it against a logarithm will always return a small positive exponent,
    whether or not any power law exists -- and the exponent is only ever used to
    extrapolate ~240 bits, exactly where the two models diverge.

  assumptions:
    - C is defined on prime-order curves with the full k-range; a truncated range measures
      a different quantity and the two must not be pooled.
    - Curve order is verified independently by [N]P = O. A wrong order truncates the group
      walk and inflates C without any visible symptom.

  proof_search_map:
    bottleneck: >-
      Whether the corpus's crypto-scale claim (yield error O(2^-110), hence negligible)
      survives when the FORM of C(p) is treated as unknown rather than assumed to be a
      power law. If it does not, then H-PSEUDO's role in KN-FIND-5c1a03 and
      KN-FIND-f8c290 is weaker than those records state.
    baseline_embedding:
      parameter_slice: >-
        The four primes of KN-FIND-d4f820 (1009, 4001, 9001, 50021) are contained in this
        experiment's ladder, so the prior measurement is a sub-slice and must be
        reproduced within noise before any disagreement is attributed to the corpus.
      reproduction_check: >-
        C values at the shared primes must land in the same range (~2-4). They do:
        2.25, 2.45, 2.50, 2.68 against the recorded 3.0, 3.5, 3.7, 3.84.
    observation_collision:
      observable: The fitted exponent, and the RMS residual of four competing models.
      distinct_preimage_search: >-
        The same C data is fitted under four different models with equal parameter counts.
        If several fit equally well, the observable does not determine the model, which is
        itself the finding.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace "the fitted exponent" by "the spread of extrapolations across models
          that fit within noise". The latter is decision-relevant; the former is not.
        predicted_gain: >-
          Converts a disagreement about a number into a statement about what the data can
          and cannot support.
    quantifier_order: >-
      FOR the stated definition of C and FOR primes in [1009, 400009]: the exponent lies
      in a bootstrap interval excluding 0.079. NOTHING is asserted for p outside that
      range, which is the whole point.
    method_ceiling:
      strongest_certifiable_claim: >-
        A measurement at toy scale with matched samples and bootstrap intervals. NOT a
        determination of C(p)'s asymptotic form, which this experiment argues is
        undetermined by any toy-scale data.
      nearby_object_control: >-
        The constant model C = a is fitted alongside, and is decisively worse (RMS 0.29
        vs 0.10), so the instrument does detect growth when growth is present.
    proof_obligations:
      - claim: Matching sample size across primes changes the fitted max-exponent.
        responsibility: correctness
      - claim: Four models fit within noise and diverge at 2^256.
        responsibility: correctness
    not_applicable_reason: null

  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    NO ASYMPTOTIC CLAIM. This hypothesis asserts that an asymptotic claim recorded
    elsewhere is unsupported. It does not substitute one of its own.

  heuristic_assumptions: []

  predictions:
    - The bootstrap CI for C_max's power-law exponent excludes 0.079.
    - Power law, sqrt(log) and log fit C(p) within ~0.005 RMS of each other.
    - Their 2^256 extrapolations differ by more than two orders of magnitude.

  falsification:
    - 0.079 lies inside both bootstrap CIs, in which case KN-FIND-4c9e71's correction
      stands and this hypothesis is wrong.
    - The power law has materially lower RMS than sqrt(log) and log, in which case the
      corpus's model choice is supported by its own data.

  pareto_integrity:
    dominated_by: Pollard rho at exponent 1/2
    sota_delta: {time_exponent: not_applicable, memory_exponent: not_applicable}
    note: A measurement-quality finding about an existing record. No cost claim.

  experiment_ids: [EXP-HPSC-74991c]
  evidence_ids: [EV-HPSC-a23ace]
  owner: top-level session
