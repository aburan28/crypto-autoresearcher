hypothesis:
  id: H-XEDN-f40aba
  question_id: RQ-XEDN-004
  derived_from_idea: IDEA-20260805-4efae0
  added: '2026-08-25'
  status: proposed
  proposed_by: coordinator
  title: >-
    Resolving the confound the archived instrument could not: at p = 31 the
    zero-relation cell is a genuine relation-DENSITY obstruction, not a censored
    coefficient blow-up - an unbounded search over the same committed slot lists finds
    no relation of support >= 5 or infinity-norm >= 4
  relation_to_existing_records: >-
    H-XEDN-58867e (committed, same question, same parent proposal) carries the
    instrument-image argument: that the archived search's reachable output set is
    disjoint from the falsification region, so the executed protocol could not have
    falsified the hypothesis it was meant to test. THIS RECORD DOES NOT RESTATE THAT
    AND MUST NOT BE READ AS A DUPLICATE. It takes the image-set finding as the
    PRECONDITION that makes its own question meaningful, and asks the one thing the
    parent proposal explicitly refuses to pre-register a value for and that nobody has
    measured: over the surfaces the archive labels as having no relation, does an
    UNBOUNDED search over the same committed slot lists find one? No status of
    H-XEDN-58867e, of the audited hypothesis, or of any completed record is proposed,
    implied or permitted to change here.
  statement: >-
    SCOPE: the committed slot lists archived by the two census runs at p = 31, the
    surfaces those runs labelled with the no-relation skip reason, and an unbounded
    integer-relation search over the SPECIALISED FIBRE IMAGES of exactly those slots -
    which needs only F_p point arithmetic and no function-field arithmetic. CLAIM TIER
    toy, one lane, one instrument lineage. NO ATTACK IS CLAIMED AND NO STATUS CHANGE IS
    PROPOSED.
    THE CLAIM. Let U be the set of archived p = 31 surfaces recorded as eligible-or-analysed
    and returning no relation. For each surface in U, run an unbounded relation search
    over the archived slot list and retain only relations that pass the SAME generic
    verification the census used - a group-law identity over the function field, not a
    coincidence at one fibre. Then the count of surfaces in U admitting such a relation
    with support >= 5 or infinity-norm >= 4 is ZERO.
    WHY THAT IS THE WHOLE QUESTION. Those are exactly the relations the archived
    instrument's reachable output set excludes, and they are exactly the falsification
    condition of the audited hypothesis. A count above 0 falsifies that hypothesis at
    p = 31 by its own stated condition. A count of 0 converts the archived
    density reading from an ASSUMPTION into a MEASUREMENT. Both outcomes are
    first-class deliverables, which is why the run is worth its minutes in either
    direction.
  mechanism: >-
    The archived search draws coefficients from a bounded alphabet at bounded support,
    so three disjoint ground-truth states collapse to one recorded label: no relation
    exists among the enumerated slots; a relation exists at support beyond the ceiling;
    or a relation exists within the support ceiling but with a coefficient outside the
    alphabet. The archived record cannot separate them, and the reading it was given -
    that the cell is a density obstruction - is one of the three, chosen. Separating
    them requires only a search WITHOUT those bounds over the same slots, and at p = 31
    the specialised fibres are small enough that this is seconds of integer arithmetic.
    The one thing that search must not do is manufacture falsifications: at p = 31 the
    fibres are tiny, so a relation holding at one fibre is often a coincidence rather
    than a function-field identity. The generic verification the census itself applied is
    therefore applied here IN THE OPPOSITE DIRECTION, and a relation that passes only at
    fibres is counted as spurious rather than as a falsification.
  assumptions:
    - >-
      The archived slot lists in the committed run artifacts are the slots the archived
      analysis actually used. Checked to the extent possible from the committed manifests
      and implementation directory; NOT re-executed, because the archived implementation's
      runtime is absent from this container - which is itself an infrastructure fact the
      contract records rather than routes around.
    - >-
      The reimplementation used to search must be shown to REPRODUCE the archived search's
      behaviour on the archived configurations' recorded slot lists and coefficient
      vectors. If it does not, it is a different instrument and every count from it is
      about a different object.
    - >-
      The generic verification is available over the archived slot data. If only fibre
      specialisation is available, the unbounded search cannot distinguish a genuine
      relation from a coincidence at p = 31, and the honest report is that the confound
      cannot be resolved with the archived artifacts alone.
  proof_search_map:
    bottleneck: >-
      Whether any archived p = 31 no-relation surface admits a relation outside the
      archived instrument's reachable output set. It is decision-changing because that
      single count decides whether an existing knowledge finding's density reading is a
      measurement or an assumption, and because a count above 0 falsifies the audited
      hypothesis by its own stated condition.
    baseline_embedding:
      parameter_slice: >-
        The archived instrument itself, run over the same slots with its original bounds,
        is the exact old-method boundary. Its output on those slots must reproduce the
        archived record exactly.
      reproduction_check: >-
        Frozen fixture: the reimplementation, run with the archived bounds on the archived
        slot lists, must reproduce the archived coefficient vectors and skip reasons on the
        relation-bearing configurations, entry for entry. A mismatch means the
        reimplementation measures a different instrument and NO count from it is admissible.
    observation_collision:
      observable: >-
        The archived no-relation label.
      distinct_preimage_search: >-
        The collision IS the subject: three ground-truth states - no relation; a relation of
        support beyond the ceiling; a relation with a coefficient outside the alphabet - map
        to that one label. This record's entire content is separating them by removing the
        bounds. A FOURTH preimage must also be separated and is easy to overlook: a relation
        that holds at fibres but not generically, which at p = 31 is common. The generic
        check is what separates it, and without that check the search manufactures
        falsifications rather than finding them.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          The identical relation search with the coefficient alphabet and the support
          ceiling REMOVED, run over the archived slots' specialised fibre images, with the
          census's own generic verification applied to every hit.
        predicted_gain: >-
          No speed gain. It converts a censored observation into an uncensored one and
          decides, at the cost of minutes, whether an existing density reading is a
          measurement.
    quantifier_order: >-
      The audited hypothesis is falsified if THERE EXISTS a verified shortest relation with
      infinity-norm at or above the threshold. This record therefore searches for an
      existential witness over a FIXED, archived population, and the population is fixed
      BEFORE the search so that the count is a property of the archive rather than of the
      searcher. The trap named: searching over a population enlarged after seeing early
      results would make any count uninterpretable, and the population is frozen for
      exactly that reason.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "over the archived p = 31 no-relation surfaces, an unbounded search over
        the archived slot lists found this many relations passing the census's own generic
        verification, of which this many had support at or above 5 or infinity-norm at or
        above 4." It certifies NOTHING about surfaces outside the archive, nothing about
        other primes, and nothing about whether the audited hypothesis is true - only
        whether the archived cell falsifies it.
      nearby_object_control: >-
        A slot set of the same size drawn from a random abelian group of comparable order
        with NO planted relation. The forced expected number of spurious hits is computable
        in advance from the slot count, the coefficient alphabet and the group order, and at
        p = 31 it is NOT negligible - so the null has real content and may well fire. That
        computed expectation is the check on the search's own false-positive rate.
    proof_obligations:
      - claim: The reimplementation reproduces the archived instrument on the archived data.
        responsibility: baseline
      - claim: The searched population is the archived no-relation set, frozen before the search.
        responsibility: scope
      - claim: Every hit passes the census's own generic verification, not merely fibre specialisation.
        responsibility: correctness
      - claim: The spurious-hit rate is measured against its computed expectation.
        responsibility: success_probability
      - claim: The count is reported per surface with the witnessing relation, not as an aggregate.
        responsibility: size
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-XEDN-f40aba-1
      formal_statement: >-
        The expected number of SPURIOUS relations among n randomly chosen elements of an
        abelian group of order M, under a coefficient alphabet of size a and support s, is
        approximately (n choose s) * a^s / M. Quantifiers: for the slot counts and group
        orders appearing in the archived p = 31 configurations.
      random_model_justification: >-
        Elementary counting under a uniformity assumption on the group elements - which is
        exactly the assumption a null object is supposed to instantiate, and which is NOT
        claimed to hold for the curve-derived slots. It is numbered because at p = 31 the
        group is tiny and the expected spurious count is NOT negligible, so a search that
        does not measure its own false-positive rate would report coincidences as
        falsifications.
      supporting_results: []
      validation_experiment_ids:
        - EXP-XEDN-ad2158
      falsification_condition: >-
        The measured spurious rate in the null arm departs materially from the computed
        expectation. The counting model is wrong, the search's false-positive rate is
        unknown, and no count from the signal arm may be read as a falsification.
    - id: HEUR-XEDN-f40aba-2
      formal_statement: >-
        The census's generic verification, applied to a candidate found by an unbounded
        search, is as reliable a filter against fibre coincidences as it was when applied to
        candidates found by the bounded search.
      random_model_justification: >-
        None beyond symmetry of the check. It is numbered because the unbounded search
        proposes MANY more candidates than the bounded one did, so the same filter faces a
        far larger candidate stream and its false-acceptance rate matters where it
        previously did not.
      supporting_results: []
      validation_experiment_ids:
        - EXP-XEDN-ad2158
      falsification_condition: >-
        The filter accepts candidates from the null arm - where no genuine relation exists -
        at a non-negligible rate. The filter cannot carry the larger candidate stream and no
        hit from the signal arm is admissible.
  structural_ingredients:
    - description: >-
        The committed census implementation, its archived slot lists, and its recorded
        skip reasons and coefficient vectors.
      citation: null
      provenance: internal
      verified_by: >-
        Read directly from the committed run artifacts and implementation directory. NOT
        re-executed, because the archived implementation's runtime is absent from this
        container; that absence is an infrastructure fact recorded as such rather than
        worked around, and it is why the reimplementation-fidelity check exists.
      role: the archive being re-read, and the instrument being reproduced
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: >-
        p31_unbounded_hit_count - the number of archived p = 31 no-relation surfaces on
        which an unbounded search finds a relation passing the generic verification with
        support >= 5 or infinity-norm >= 4
      direction: different
      minimum_effect: >-
        NO VALUE IS PRE-REGISTERED, and that refusal is deliberate: this is the quantity
        nobody has measured and inventing a number for it would be a fabrication. What IS
        pre-registered is the DISPOSITION. Any count above 0 falsifies the audited
        hypothesis at p = 31 by its own stated condition. A count of 0 converts the
        archived density reading from an assumption into a measurement. Both are
        first-class deliverables.
    - metric: reimplementation_fidelity
      direction: different
      minimum_effect: >-
        EXACT reproduction of the archived coefficient vectors and skip reasons on the
        archived relation-bearing configurations, entry for entry. POSITIVE CONTROL with a
        forced value: a mismatch means the reimplementation is a different instrument and NO
        count from it is admissible.
    - metric: spurious_hit_rate
      direction: different
      minimum_effect: >-
        Agreement with the computed expectation from the slot count, coefficient alphabet
        and group order, within a declared tolerance. NULL CONTROL: at p = 31 the expected
        spurious count is NOT negligible, so this null has real content and may fire.
    - metric: generic_filter_false_acceptance
      direction: lower
      minimum_effect: >-
        Zero acceptances from the null arm, where no genuine relation exists. If the filter
        accepts null-arm candidates, it cannot carry the enlarged candidate stream and no
        signal-arm hit is admissible.
    - metric: population_freeze_verification
      direction: different
      minimum_effect: >-
        The searched surface set matches the frozen archived no-relation set exactly. A
        population enlarged or narrowed after the search began makes the count a property of
        the searcher rather than of the archive.
  test_boundary:
    instances: >-
      Exactly the archived p = 31 surfaces recorded as eligible-or-analysed and returning no
      relation, taken from the committed run artifacts and frozen before the search; plus
      matched null slot sets drawn from random abelian groups of comparable order.
    parameters:
      search_bounds: >-
        UNBOUNDED in coefficient magnitude and in support, subject only to a declared
        computational ceiling that is recorded and checked non-binding.
      verification: the census's own generic check, applied to every candidate
      null_draws: at least 1000 per (slot count, group order) cell
    implementation: >-
      Pure Python with exact integer arithmetic; no SageMath, which is absent from this
      container. F_p point arithmetic only - the search runs over the specialised fibre
      images of the archived slots and needs no function-field arithmetic, which is what
      makes it minutes rather than hours.
    budget:
      total_cpu_hours: 0.5
      maximum_runs: 10
  falsification_conditions:
    - >-
      p31_unbounded_hit_count is above 0, with the fidelity control passing, the null arm
      matching its computed expectation, and every hit passing the generic verification.
      The hypothesis is FALSIFIED: the archived cell is not a density obstruction, it is a
      censored coefficient or support blow-up, and the audited hypothesis is falsified at
      p = 31 by its own stated condition. The witnessing relation is the counterexample
      certificate.
    - >-
      The reimplementation does not reproduce the archived instrument on the archived data.
      A different instrument was measured; nothing about the archive is reportable.
    - >-
      The measured spurious rate departs materially from its computed expectation. The
      search's false-positive rate is unknown and no count may be read as a falsification.
    - >-
      The generic filter accepts null-arm candidates. The filter cannot carry the enlarged
      candidate stream and every signal-arm hit is inadmissible.
    - >-
      The generic verification is unavailable over the archived slot data. The confound
      CANNOT be resolved from the archived artifacts alone at p = 31, and that is the honest
      report - not a count.
  interpretation_limits:
    - >-
      NO status change to any goal, hypothesis, decision, evidence record or knowledge
      finding is proposed, implied, or permitted by this record. Only the Coordinator changes
      a status, and the vehicle for a disagreement with a committed record is a superseding
      record under a new id, never an edit.
    - >-
      A count of 0 does NOT show the audited hypothesis is true. It shows that the archived
      p = 31 cell does not falsify it, which is a different and much narrower statement, and
      conflating them would repeat the error being audited.
    - >-
      A count above 0 does NOT show the audited hypothesis is false in general. It falsifies
      it AT p = 31 by the hypothesis's own stated condition, on the archived surfaces, under
      the census's own verification standard.
    - >-
      Toy scale, one prime, one lane, one instrument lineage. Nothing transfers to any other
      goal's instruments without the same reading being performed on them.
    - >-
      SELECTION IS BUILT IN AND IS STATED: the search looks only at surfaces that returned no
      relation. That is the right population for the confound and a biased one for anything
      else, and no other conclusion may be drawn from it.
    - >-
      AUTHORSHIP ASYMMETRY. Auditing a completed goal is cheap and reads as rigour. The
      fidelity control, the null arm and the pre-registered disposition exist so that a
      negative outcome for the archive costs something to reach and a clean bill of health is
      equally reportable.
  prior_evidence_refs:
    - RQ-XEDN-004
    - IDEA-20260805-4efae0
    - H-XEDN-58867e
  distinguishable_outcomes:
    - outcome: >-
        Fidelity control reproduces the archive exactly; the null arm matches its computed
        expectation; the generic filter rejects all null candidates; and the unbounded search
        finds ZERO qualifying relations over the frozen population.
      means: >-
        SUPPORTS the hypothesis. The archived density reading is converted from an assumption
        into a measurement, with a stated sensitivity. Next decision: record the measurement
        and its scope; the audited hypothesis is NOT thereby supported, and the record must
        say so in the same sentence.
    - outcome: >-
        Controls behave and the search finds at least one qualifying relation passing the
        generic verification.
      means: >-
        FALSIFIES the hypothesis, and falsifies the audited hypothesis at p = 31 by its own
        stated condition. Next decision: archive the witnessing relation as a COUNTEREXAMPLE
        CERTIFICATE before any decision that rests on it, route to independent adversarial
        review, and supersede - never edit - the affected records through new ids.
    - outcome: >-
        Controls behave but the null arm's spurious rate is high and comparable to the signal
        arm's hit rate.
      means: >-
        INCONCLUSIVE, identifiably. At p = 31 the fibres are small enough that the search
        cannot separate genuine relations from coincidences at this slot count. Next decision:
        the confound is not resolvable at p = 31 with these slots; report that and propose the
        same audit at a larger prime rather than picking a reading.
    - outcome: >-
        The reimplementation does not reproduce the archived instrument, or the generic
        verification is unavailable over the archived data.
      means: >-
        NO EVIDENCE EITHER WAY. Instrument or archive-availability outcome (AGENTS.md rule 5),
        and the absent runtime is itself an infrastructure finding. Next decision: return the
        concrete blocker; do not report a count from a different instrument.
