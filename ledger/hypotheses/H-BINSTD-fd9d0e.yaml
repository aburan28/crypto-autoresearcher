  title: >-
    Dimension 66 is inside the vacuous range and 67 is outside.
  statement: >-
    The comparison 2^{l-1} against 2^{n/2} is an integer test on
    2(l-1) and n. At n = 131, twice 65 is 130, which is at most 131,
    and twice 66 is 132, which exceeds 131. So l = 66 is inside and
    l = 67 is outside. The ceilings of 131/4 and 131/3 are 33 and 44.
    Both are at most 66, and the gaps are 33 and 22. At n = 17, twice
    8 is 16, which is at most 17, and twice 9 is 18, which exceeds 17.
    So l = 9 is inside and l = 10 is outside. Over the field of 4
    elements the curve y^2 + xy = x^3 + 1 has 8 points, counting the
    point at infinity. The element 0 has one solution and each of the
    three nonzero elements has two. The trace is 0 on 0 and on 1, and
    1 on the other two elements. All three nonzero elements satisfy
    the equal-trace test. The power 2^4 is 16, and 60 minus 4 is 56.
  mechanism: >-
    The proposal says the error term exceeds the main term through
    dimension 66. This contract checks that threshold and the field
    of 4 elements. It does not sample a subspace.
