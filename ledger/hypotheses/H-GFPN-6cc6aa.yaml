hypothesis:
  id: H-GFPN-6cc6aa
  question_id: RQ-GFPN-c01af8
  goal_id: GOAL-GFPN-380702
  source_idea_ids:
    - IDEA-20261006-aaf1a8
  added: '2026-10-07'
  status: specified
  proposed_by: coordinator
  title: >-
    Degree-4 Macaulay rank ratio of the double-odd 2-torsion quotient
    against a cofactor-1 null
  statement: >-
    On a double-odd curve over F_{p'^5} with exactly one
    F_{p'^5}-rational 2-torsion point, the rank of the degree-4
    Macaulay matrix of the (Z/2)^4 rtimes S_5 quotient of the m=5
    summation system is at most half the degree-4 Macaulay rank of
    the S_5-only symmetrization of the same system. On a cofactor-1
    curve over the same field, the formal substitution t = u + c/u,
    which is not translation by a rational 2-torsion point, does not
    drop the degree-4 rank by that factor: that ratio is greater than
    1/2. The concrete negative is a double-odd ratio greater than 1/2
    after the S_5-only ranks are nonzero and the run is not a memory
    abort. A cofactor-1 ratio at most 1/2 is a second negative. The
    curve y^2 = x^3 + x + 1 is not used, and p' = 4111 is not used.
    Gaudry's exponent at n = 5 stays 8/5.
  mechanism: >-
    The representation is R1: Weil-restriction digits of the
    symmetrized summands as elements of F_{p'}. The operation set is
    the finite group (Z/2)^4 rtimes S_5, which permutes the five
    summands and flips signs coming from translation by the rational
    2-torsion point. The tracked object is the quotient ideal. The
    degree-4 Macaulay rank is a proxy for whether the 2-torsion
    relations remove generators. It is not the ideal degree D, and it
    is not a factor base. The cofactor-1 arm uses the same formal
    substitution so a drop caused only by the coordinate change is
    visible.
  assumptions:
    - >-
      The factor base is the published degree-1 rescaled predicate.
      It is not a KN-OPEN-020 escape. No new factor base is built.
    - >-
      A memory abort of the linear algebra is an infrastructure
      outcome and is not a mathematical negative.
    - >-
      The degree-4 rank is not the ideal degree D. Equality of ranks
      at degree 4 says nothing about D = 2^16.
    - >-
      This session did not compute a rank. The thresholds <= 1/2 and
      > 1/2 are the source idea's predictions.
  proof_search_map:
    bottleneck: >-
      The degree-4 piece of one m = 5 PDP system. The exponent
      2 - 2/5 stays in place. The bottleneck inside this test is
      that matrix rank.
    baseline_embedding:
      parameter_slice: >-
        S_5-only symmetrization of the same m = 5 system. KN-OPEN-9b4a2b
        records that symmetrized ideal degree as 2^20. This test does
        not remeasure D. It requires the degree-4 S_5 rank to be
        computed on each arm before the quotient is compared.
      reproduction_check: >-
        On the cofactor-1 arm the quotient rewriting is not a group
        translation. A zero rank on an S_5-only arm voids the
        instrument. A memory abort voids the instrument.
    observation_collision:
      observable: >-
        The degree-4 Macaulay rank of the quotient presentation,
        which forgets the ordered signed tuple and keeps the
        Sigma-invariant generators.
      distinct_preimage_search: >-
        Two ordered 5-tuples with the same (sigma, w) and different
        underlying point-sums, if found at the toy p', show the
        observable does not determine the relation. That search is
        part of a later run. It was not executed here.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The ideal of Sigma-invariants inside the Weil-descended
          m = 5 summation ideal, generated by elementary symmetric
          polynomials in t_i = u_i + beta/u_i and by w.
        predicted_gain: >-
          A drop of the degree-4 rank by a factor of at least 2 on
          the double-odd arm only. The exponent 8/5 is unchanged.
    quantifier_order: >-
      For the smallest admissible prime p' in the frozen ladder, the
      double-odd arm has a degree-4 rank ratio at most 1/2 and the
      cofactor-1 arm has a ratio greater than 1/2. A second prime is
      the decay check for HEUR-1. This is not a statement at
      p = 2^64 - 2^32 + 1.
    method_ceiling:
      strongest_certifiable_claim: >-
        A constant-factor change in the degree-4 piece of one PDP
        system on one toy field. It cannot certify D = 2^16 and it
        cannot move the exponent 8/5.
      nearby_object_control: >-
        A cofactor-1 ordinary curve over the same F_{p'^5}, and one
        ordinary curve with a rational 2-torsion point that is not
        double-odd. If the drop appears only on the double-odd
        equation, the 2-torsion-translation reading fails.
    proof_obligations:
      - claim: >-
          The S_5-only degree-4 rank is nonzero on each scored arm
          before the quotient is compared.
        responsibility: baseline
      - claim: >-
          The quotient generators are invariant under (Z/2)^4 rtimes
          S_5. A later run must record the presentation it ranked.
        responsibility: correctness
      - claim: >-
          A factor-of-two rank drop at degree 4 is a constant and
          does not change the exponent 2 - 2/5.
        responsibility: runtime
      - claim: >-
          The rank drop is absent on the cofactor-1 arm.
        responsibility: strictness
      - claim: >-
          The test prices one system at toy p' and does not charge a
          full relation collection. p' = 4111 is excluded.
        responsibility: scope
    not_applicable_reason: >-
      Boundary lift and telescoping potential are not the transform
      in use. The selected transform is stronger_invariant.
  asymptotic_claim:
    problem: >-
      Gaudry decomposition on E(F_{q^5}) at fixed n = 5.
    prior_best: >-
      O-tilde(q^{8/5}) from KR-IC-46d822, opened 2026-10-07.
    time_exponent: >-
      Unchanged at 8/5. A factor 2 in a degree-4 rank is inside the
      constant n! times 2^{n(n-1)}.
    memory_exponent: >-
      Unchanged. One toy degree-4 matrix is not a new memory exponent.
    hidden_cofactor: >-
      The O-tilde hides n! times 2^{n(n-1)} and one Gröbner basis.
      A later confirmation of D = 2^16 would still sit inside that
      constant. This hypothesis does not confirm D.
    claim_kind: constant_factor
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        For fixed n = m = 5, the degree-4 Macaulay rank of each
        frozen presentation, divided by the S_5-only rank, is
        independent of the base prime p' once p' is large enough
        that the system is not identically degenerate.
      random_model_justification: >-
        KN-OPEN-9b4a2b records the mixed volume of the raw m = 5
        system as 5! times 2^20, a combinatorial count with no p'
        in it. HEUR-1 imitates that p'-free count. It is not a
        theorem about Macaulay ranks.
      supporting_results:
        - >-
          KN-OPEN-9b4a2b, opened 2026-10-07. The 2^20 figure is the
          recorded S_5 ideal degree, not a measured degree-4 rank.
      validation_experiment_ids:
        - EXP-GFPN-ef0adf
      falsification_condition: >-
        The rank ratios at the two smallest admissible primes differ
        by more than a factor of 2. Then no p'-independent degree is
        inferred. No transfer to p = 2^64 - 2^32 + 1 is used.
  structural_ingredients:
    - description: >-
        Gaudry decomposition costs O-tilde(q^{2-2/n}) for fixed n,
        which is q^{8/5} at n = 5.
      citation: KR-IC-46d822
      provenance: internal
      verified_by: >-
        coordinator, 2026-10-07, opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-46d822.yaml
      role: prior exponent, unchanged by this hypothesis
    - description: >-
        S_m symmetry and small-order torsion are priced as a constant
        about 2^{omega(n-1)}. The ecGFp5 quotient ideal degree is open.
      citation: KR-IC-955fd6
      provenance: internal
      verified_by: >-
        coordinator, 2026-10-07, opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-955fd6.yaml
      role: constant, not a new exponent
    - description: >-
        The open degree question at n = m = 5 is whether D equals
        2^16. The S_5-symmetrized system is recorded as D = 2^20.
      citation: KN-OPEN-9b4a2b
      provenance: internal
      verified_by: >-
        coordinator, 2026-10-07, opened
        knowledge/open-problems/KN-OPEN-9b4a2b.md
      role: scope of what a degree-4 rank does not certify
  predictions:
    - metric: >-
        Ratio of the degree-4 Macaulay rank of the (Z/2)^4 rtimes S_5
        quotient to the degree-4 Macaulay rank of the S_5-only system,
        on the double-odd arm.
      direction: lower
      minimum_effect: "<= 1/2"
    - metric: >-
        The same rank ratio for the formal substitution t = u + c/u
        on the cofactor-1 arm.
      direction: higher
      minimum_effect: "> 1/2"
  test_boundary:
    instances:
      - >-
        The smallest prime p' >= 3 such that F_{p'^5} contains a
        nonsingular double-odd curve y^2 = x(x^2 + a x + b) with b
        nonsquare and exactly one rational 2-torsion point, and a
        nonsingular cofactor-1 ordinary curve. One further ordinary
        curve with a rational 2-torsion point that is not double-odd.
        A second prime p'' > p' at which degree 4 still fits.
    parameters:
      m: 5
      n: 5
      macaulay_degree: 4
      excluded_prime: 4111
      excluded_curve: y^2 = x^3 + x + 1
    implementation: >-
      Not present in this session. A later approval may add a driver
      that builds the two presentations and the degree-4 Macaulay
      matrices and writes the ranks. No Gröbner basis to completion
      is in scope. This session did not run that driver because it
      does not exist.
    budget:
      enforcement: advisory
      maximum_memory_gb: 4
      maximum_runs: 1
  falsification_conditions:
    - >-
      The S_5-only ranks are nonzero, the run is not a memory abort,
      and the double-odd degree-4 rank ratio is greater than 1/2.
    - >-
      The instrument checks pass and the cofactor-1 formal
      substitution drops the degree-4 rank by a factor of 2 or more,
      so the ratio is at most 1/2.
    - >-
      The double-odd arm drops and the ordinary curve that has a
      rational 2-torsion point but is not double-odd does not. The
      2-torsion-translation reading is then false on this sample.
  interpretation_limits:
    - >-
      No ECDLP exponent improvement is claimed. Gaudry's exponent at
      n = 5 remains 8/5.
    - >-
      A toy rank is claim_tier toy. It does not speak to the 2^142
      designer estimate in KR-IC-e2d81b, which was opened 2026-10-07
      and is not a measured rank.
    - >-
      Equality of degree-4 ranks is not a proof that D is unchanged.
    - >-
      KN-OPEN-020 is not entered. The bounded-degree factor base is
      not escaped.
  rerandomization: null
  status_note: >-
    specified, not approved. EXP-GFPN-ef0adf stays review_required
    until a driver exists and a later decision approves it.
