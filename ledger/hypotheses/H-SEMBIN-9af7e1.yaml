# =============================================================================
# H-SEMBIN-9af7e1 -- Chaining-topology closure for Semaev 2015 (GOAL-SEMBIN-cbf422
# sub-objective 3). Specified from IDEA-20260913-c94e52 under RQ-SEMBIN-9fa4ba.
# Approved DEC-20261002-15b02c.
#
# Load-bearing content: (C1) four invariants (equations, auxiliaries, N,
# three-variable blocks) across every binary merge tree; (C2) Semaev's own
# n^{4 omega} charge is topology-blind; (C5) d_ff analysis invariant; (C3)/(C4)
# sigma_top axis bounded (factor ~4 at FIPS labels; path not optimal; balanced
# near-worst for t>=5); (C6) arity axis loses under HEUR-ARITY. Stage 2
# measures whether HEUR-TOP (sigma_top tracks solve time) is predictive,
# inert, or misleading at one cell. ZERO RUNS in this design packet.
# No Magma/Sage/AUXIN/Bedrock. Claim tier: control / closure. No attack.
# No exponent. Singular success/falsification criteria live on the EXP.
# =============================================================================
hypothesis:
  id: H-SEMBIN-9af7e1
  question_id: RQ-SEMBIN-9fa4ba
  source_idea: IDEA-20260913-c94e52
  experiment_id: EXP-SEMBIN-509d41
  goal_id: GOAL-SEMBIN-cbf422
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-15b02c
  status: running
  status_note: >-
    Moved approved→running by DEC-20261003-c77494 after Stages 0-1
    S0-FREEZE-OK / S1-INVARIANTS-OK (EV-SEMBIN-d1cf99). Combinatorial
    Stage-1 half supported at preliminary strength; Stage 2 HEUR-TOP
    remains under TASK-20261002-d67dd7. Not supported as a whole.
  evidence_ids:
    - EV-SEMBIN-d1cf99
  decision_ids:
    - DEC-20261002-15b02c
    - DEC-20261003-c77494
  proposed_by: coordinator
  title: >-
    Every binary merge tree over t leaves has N=(t-2)n+tk auxiliaries/equations
    invariant, so Semaev's charged cost is topology-blind; sigma_top spans at
    most factor ~4 at FIPS labels (path not optimal; balanced near-worst for
    t>=5); HEUR-TOP at (n,t,k)=(16,5,4) is predictive / inert / misleading

  statement: >-
    CLAIM (control / closure / measurement; GOAL-SEMBIN-cbf422 sub-objective 3;
    NO ATTACK; NO EXPONENT). Setting: Semaev 2015 chained S_3 Boolean systems
    (KN-LIT-fa346d / KN-TECH-b18366) over full binary merge trees with t leaves
    in a k-dimensional subspace of F_{2^n}. (C1) EXACT. For every full binary
    merge tree: equations = t-1, auxiliaries = t-2, Boolean variables
    N = (t-2)n + tk, three-variable blocks = t-2 (exactly one constant-slot
    root block). (C2) EXACT CONSEQUENCE. Semaev Section 4.2 / eq. (15) charge
    O[(n(m-1))^{4 omega}] is a function of N alone, hence topology-blind.
    (C5) EXACT. Semaev's d_ff=4 derivation applies to every topology's t-2
    three-variable blocks. (C3)/(C4) EXACT COMBINATORICS (re-verified Stage 1).
    Under monomial-occurrence proxy sigma_top, min/path < 1 for t>=4 and rises
    with t; balanced/path > 1 for t>=5; whole axis max/min ~4.00 at (571,8).
    Proxy-minimiser is caterpillar-with-cherry, not path or balanced. (C6)
    CONDITIONAL ON HEUR-ARITY. j-ary merges cut N but raise charged
    N^{omega(j^2+1)} by >=140 bits/step at FIPS labels under the cited
    m^2+1 bound. HEUR-TOP (Stage 2): at (n,t,k)=(16,5,4), three shapes
    (path, cherry-caterpillar, balanced) plus random-Boolean null, Spearman
    sign and path/minimiser median ratio decide PREDICTIVE / INERT /
    MISLEADING. CLAIM TIER: control/closure + one-cell measurement. No FIPS
    verdict. No Magma/Sage/AUXIN/Bedrock.

  mechanism: >-
    OBJECT FRAME. Representation: slot-size profile of the merge tree (multiset
    of (|left|,|right|,|self|) with leaf=k, internal=n, root-self=0) — a lossy
    projection of tree shape compatible with Weil descent of one S_3 block.
    Operation set: tree rewiring within the binary-merge class (and, for C6,
    arity change). Trichotomy: Class I partial-action for the relation vector;
    topology is a presentation choice of the same decomposition, not a group
    action. LOSSY-PROJECTION TEST: profile forgets leaf labelling and most
    shape detail; propagates through system generation; several shapes can
    share one sigma_top. WHAT IS NEW: invariance theorem (C1)/(C2)/(C5)
    retiring the goal's false premise that balanced trees change auxiliary
    count or d_ff analysis; quantitative sigma_top census; arity closure
    under HEUR-ARITY; one-cell HEUR-TOP meter test.

  assumptions:
    - >-
      Full binary merge trees only for (C1)-(C5). Merge DAGs are the known-false
      control (Stage 1) and are outside the closure class.
    - >-
      Uniform arity for (C6); mixed-arity trees out of scope.
    - >-
      Single subspace V (same k for all leaves). Distinct per-leaf subspaces
      (coset-typed sibling IDEA-20260913-8138a0 / EXP-SEMBIN-d830d5 lane) are
      out of scope; leaf ordering then ceases to be a relabelling.
    - >-
      Semaev's charged model is the primary cost model for (C2). sigma_top is
      a finer PROXY only; Stage 2 decides whether it tracks solve time.
    - >-
      OFF-LIMITS: Magma/Sage/AUXIN/Bedrock as success path; deployed-curve
      ECDLP solves; editing IDEA-20260913-c94e52 claim text; editing shared GOAL-SEMBIN-cbf422.yaml.
    - >-
      Missing open-source Groebner / Macaulay backend → O-IMPEDIMENT for
      Stage 2, never evidence against (C1)-(C5).

  heuristics:
    - id: HEUR-TOP
      statement: >-
        Topology-cost proportionality: for two chained systems at identical
        (n,f,B,t,k,V,order,instance set) from two binary merge trees with
        sigma_1 <= sigma_2 and agreeing measured d_ff / max step degree,
        1 <= T_2/T_1 <= (sigma_2/sigma_1)^omega with 2.376 <= omega <= 3,
        over >=100 matched instances.
      rigorous_support: >-
        RIGOROUS: sigma_top bounds nonzero count of the degree-D Macaulay
        matrix up to a combinatorial factor; N is invariant so column set is
        identical. HEURISTIC: fill-in behaves as for generic sparsity.
      falsification_condition: >-
        Matched pair with agreeing degrees, sigma_2>sigma_1, and median
        T_2/T_1 < 0.9 or > (sigma_2/sigma_1)^3 at >=100 instances and
        p<0.01. (C1)/(C2)/(C5)/(C6) survive untouched.
      validation_plan: >-
        Stage-2 cell (n,t,k)=(16,5,4), three shapes + random-Boolean null;
        Spearman(sigma_top, median T) sign; path/minimiser ratio vs [1.0,1.5]
        (proxy predicts 1.331); 95th-percentile tail check. Transfer: one cell
        only; no n/t extrapolation.
    - id: HEUR-ARITY
      statement: >-
        Solving degree of descended S_{j+1} grows at least linearly in j^2
        (bound m^2+1 used as realised degree in charged cost), so charged
        N(j)^{omega d} increases in j for the FIPS parameter labels.
      rigorous_support: >-
        RIGOROUS: N(j) formula. HEURISTIC: using m^2+1 as realised degree
        (Semaev cites [11]; j=2 realises 4 vs bound 5 — bound is loose).
      falsification_condition: >-
        A read-source first-fall bound for j=3 at or below 5, OR measured
        solving degree for ternary arm at/below 5 at the HEUR-ARITY cells.
        Not executed under this card's Stage 2 (separate optional amendment);
        listed so (C6) remains conditional and hostage-named.
      validation_plan: >-
        Out of authorized Stages 0-2 for this card. Named as follow-on;
        (C6) arithmetic is frozen Stage 0 and labelled conditional.

  heuristic_note: >-
    (C1)/(C2)/(C5) are exact. (C3)/(C4) are exact combinatorics under the
    named proxy. (C6) is conditional on HEUR-ARITY. Stage 2 only tests
    HEUR-TOP; a MISLEADING proxy weakens (C3)'s cost reading without
    refuting the load-bearing invariance.

  predictions:
    - metric: equations_aux_N_three_var_blocks per tree
      direction: exact
      minimum_effect: >-
        equations=t-1, auxiliaries=t-2, N=(t-2)n+tk, three-var blocks=t-2
        on every enumerated tree for t=3..8 (tree counts (2t-3)!!).
    - metric: sigma_top(min)/sigma_top(path) at n=571, t in {4,5,6,8}
      direction: lower
      minimum_effect: >-
        Strictly below 1 for t>=4; monotone nondecreasing in t toward 1;
        design figures 0.407, 0.641, 0.741, 0.832 (re-verify Stage 1).
    - metric: sigma_top(balanced)/sigma_top(path) for t>=5
      direction: higher
      minimum_effect: Strictly above 1 for every t>=5 tested.
    - metric: charged_log2_cost N(j)^{omega(j^2+1)} at omega=3, FIPS labels
      direction: higher
      minimum_effect: >-
        Strictly increasing in j by >=140 bits/step under HEUR-ARITY;
        design figures at n=571,t=12,k=48: 189.3→348.6→562.8→828.5.
    - metric: heur_top_verdict at (16,5,4)
      direction: report
      minimum_effect: >-
        Exactly one of PREDICTIVE (Spearman right sign and path/minimiser
        median ratio in [1.0,1.5]), INERT (pairwise medians within 1.3),
        or MISLEADING (ordering inverted).

  test_boundary: >-
    Combinatorial re-verify t=3..8; sigma_top tables at reported (n,t,k)
    including FIPS labels; Stage-2 solver cell ONLY (16,5,4) three shapes +
    null. Nothing transfers to merge DAGs, mixed arity, distinct per-leaf
    subspaces, n>21 solver claims, or any FIPS security verdict. Closes
    sub-objective 3 inside the binary-merge-tree class only.

  falsification_criteria:
    - >-
      Any full binary merge tree with auxiliaries≠t-2, equations≠t-1, or
      N≠(t-2)n+tk → (C1) false; O-C1-FAIL; headline.
    - >-
      Three-variable block count ≠t-2 or >1 constant-slot block → (C5) false.
    - >-
      Path is sigma_top minimiser at any t>=4, or balanced beats path at any
      t>=5 (within Stage-1 re-verify) → (C3)/(C4) false at that cell.
    - >-
      max/min sigma_top >16 at any reported (n,t,k) with t<=12 → bounded-axis
      claim false.
    - >-
      Stage-2 median solve-time ordering inverted vs sigma_top → HEUR-TOP
      MISLEADING; (C3) cost reading inert; (C1)/(C2) stand.
    - >-
      Tree-count ≠ (2t-3)!! or fixture/control failure → O-ARTIFACT; void.
    - >-
      Missing solver backend / timeout / OOM → O-IMPEDIMENT; never evidence
      against (C1)-(C5).

  distinguishable_outcomes:
    - id: O-CLOSURE
      label: topology_axis_closed
      when: >-
        Stage-1 re-verify confirms (C1)/(C3)/(C4)/(C5) counts and ratios;
        DAG known-false control passes; Stage 2 returns PREDICTIVE or INERT
        (or Stage 2 stopped as O-IMPEDIMENT with Stage-1 closure intact).
    - id: O-C1-FAIL
      label: invariance_refuted
      when: A binary merge tree violates equations/aux/N/three-var invariants.
    - id: O-PROXY-MISLEAD
      label: sigma_top_misleading
      when: Stage-2 ordering inverted vs sigma_top; (C1)/(C2) still hold.
    - id: O-ARTIFACT
      label: instrument_or_enumeration_defect
      when: Tree-count mismatch, fixture fail, arm mismatch, or void export.
    - id: O-IMPEDIMENT
      label: infrastructure_stop
      when: >-
        Missing Groebner/Macaulay backend, timeout, OOM, or other infra
        failure on Stage 2. Never negative mathematical evidence (rule 5).
        Stage-0/1 combinatorial closure may still stand.

  proof_search_map:
    bottleneck: >-
      Whether GOAL-SEMBIN-cbf422 sub-objective 3's premise (balanced trees
      change auxiliary count and d_ff analysis) survives exact counting;
      whether any finer proxy worth measuring remains after (C2).
    baseline_embedding:
      parameter_slice: >-
        Semaev eq. (5) path at t=m; Table 2 cell (16,4,4,4) as Stage-2
        path-arm calibration (d_F4=4 and satisfiability rate, not wall clock).
      reproduction_check: >-
        Stage 1: tree counts match (2t-3)!!; Semaev path recovered as a
        caterpillar; sigma_top ratios re-derived; DAG counterexample written.
        Stage 2: path arm d_F4=4 and sat rate vs Table 2; realised monomial
        count matches sigma_top arithmetic.
    observation_collision:
      observable: Measured median solve time across shapes.
      distinct_preimage_search: >-
        Time differences may be (i) true topology/sparsity effect (HEUR-TOP),
        (ii) pure sparse-LA (random-Boolean null agrees), (iii) degree change
        (d_ff/max-step covariates), (iv) instrument bug (arm mismatch).
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: Slot-size profile holding N fixed.
        predicted_gain: None on Semaev's charged cost; proxy-only variation.
      - transform: stronger_invariant
        proposed_object: (C1) counting identity + (C2) model blindness.
        predicted_gain: Retires sub-objective 3 premise; closure.
    quantifier_order: >-
      (C1)/(C2)/(C5): FORALL full binary merge trees, FORALL (n,t,k) —
      exact. (C3)/(C4): FORALL shapes at enumerated (n,t,k) — exact under
      sigma_top. HEUR-TOP: FOR the single Stage-2 cell — heuristic. No
      forall-n solver claim.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Inside the uniform-arity binary-merge-tree class, topology cannot
        change Semaev's charged decomposition cost; sigma_top varies by at
        most [measured factor] at the reported cells; at (16,5,4) HEUR-TOP
        is [PREDICTIVE|INERT|MISLEADING]." Certifies nothing about DAGs,
        mixed arity, coset-typed leaves, or FIPS security.
      nearby_object_control: >-
        Merge-DAG known-false control (blocking for argument soundness);
        random-Boolean null at matched profile (blocking for Stage-2 reading);
        reversed monomial order on every Stage-2 arm.
    proof_obligations:
      - claim: (C1) four invariants (tree combinatorics).
        responsibility: correctness
      - claim: (C2) Semaev charge depends on N alone (reading of eq. 15 / §4.2).
        responsibility: correctness
      - claim: (C5) d_ff sentence topology-invariant.
        responsibility: correctness
      - claim: Stage-1 sigma_top tables match idea's published extremes within rounding.
        responsibility: baseline
      - claim: DAG known-false control exhibits auxiliaries ≠ t-2.
        responsibility: strictness
      - claim: No sentence states a speedup, exponent move, or FIPS verdict.
        responsibility: scope
    not_applicable_reason: null

  confounders:
    - sigma_top is input-size proxy; Macaulay column count C(N,<=D) is invariant.
    - Balanced trees may exploit block structure Semaev notes — can invert proxy.
    - Leaf ordering under distinct per-leaf subspaces out of scope.
    - omega choice moves arity margins but not ordering under HEUR-ARITY.
    - Absolute wall-clock will not match Table 2 (2015 hardware); d_F4 and sat rate must.

  interpretation_limits:
    - Closes sub-objective 3 inside binary merge trees only; DAGs / mixed arity / coset-labelled leaves remain open.
    - Stage-2 one-cell HEUR-TOP; no asymptotic claim from it.
    - (C6) conditional on HEUR-ARITY; not validated under this card's Stage 2.
    - Approval does not assert the hypothesis is true.
    - Related IDEA-20260918-c05e71 / EXP-SEMBIN designs are separate coset-typing work; this card does not amend them.

  claim_tier: control
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
