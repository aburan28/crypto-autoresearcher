hypothesis:
  id: H-FRODO-3fae9a
  question_id: RQ-FRODO-a2dbe2
  derived_from_idea: IDEA-20260821-c05d5f
  added: '2026-08-25'

  statement: >-
    SCOPE: the free variables of the FrodoKEM IND-CCA bound AS TRANSCRIBED by
    the GOAL-FRODO-002 BATCH-001 transcription task, classified against the
    enumerated FrodoKEM standardization document closure, at the three
    published parameter sets. CLAIM TIER split -- crypto tier for the
    documentary and arithmetic content (a document either states a number or
    does not; an inequality either evaluates or does not), and NO tier at all
    for any security consequence, because none is claimed. NO ATTACK, NO
    BREAK, NO LWE RE-ESTIMATION, NO CLAIM THAT ANY PUBLISHED FAILURE RATE IS
    RIGHT OR WRONG.

    THE HYPOTHESIS, IN THREE TWO-SIDED PARTS.

    C1 (DELEGATION). At least one delegation chain from the FrodoKEM
    standardization surface terminates in a document that states NO number for
    the variable delegated. ZERO IS A REAL AND REPORTABLE OUTCOME and would
    mean FrodoKEM's surface, unlike ML-KEM's, always terminates in a value --
    the one chain already followed by the parent proposal's author
    (LAMPS certificates -> security-considerations -> I-D.FrodoKEM) terminates
    WITH a value, so the count is not forced upward.

    C2 (HETEROGENEITY AMONG CAPPABLE VARIABLES). At each parameter set, the
    dominant additive term contains at least two DISTINCT provenance classes
    among its variables AFTER EXCLUDING the two classes whose presence is
    structural -- P1 spec-fixed lengths and P6 offline query counts. ZERO OR
    ONE IS THE CLEAN NEGATIVE and is entirely reachable -- a dominant term of
    the shape (constant * q_RO / |M|) contains only excluded classes and
    returns zero.

    C3 (NORMATIVE-FORCE DISAGREEMENT). Beyond the ONE SEEDED ROW already
    established by the parent proposal's author, the enumerated closure
    contains at least one further pair of documents stating the SAME number
    for the SAME symbol with different deontic modality or different binder.
    ZERO ADDITIONAL ROWS IS A COMPLETE ANSWER and reduces the finding to a
    single historical row.

    WHAT IS EXPLICITLY NOT THE HYPOTHESIS, AND WHY. "At least one dominant-term
    variable is bounded by no retrieved normative document" is FORCED by this
    design's own frozen taxonomy plus NULL-3 plus the shape of every FO-family
    bound. It is retained as a REPORTED quantity with its forced value derived
    in advance and is never a discriminator and never evidence.

  mechanism: >-
    ADAPTED FROM GOAL-MLKEM-005's census method, with the provenance declared
    rather than hidden. Four things are new relative to that parent -- the
    scheme, a VARIABLE SET rather than one variable, a frozen six-way
    provenance taxonomy, and a deontic-modality coordinate that lets a
    delegation terminating in a differently-shaped clause be recorded as
    something other than a hit or a miss.

    (1) THE OBJECT IS A CLASS, NOT A VALUE. For each free variable of the
    transcribed bound, record the KIND of authority that could fix its value,
    over a taxonomy frozen before any document is opened -- P1 spec-fixed
    constant; P2 normatively bounded by a COUNT in a retrieved document; P3
    bounded only in TIME (certificate validity, cryptoperiod, rotation
    recommendation); P4 bounded only by a rate-limiting SHOULD; P5 delegated
    to another document that states no number; P6 bounded only by the
    adversary's own compute budget, i.e. offline and uncappable by any
    protocol clause. Freezing the taxonomy first is what prevents a
    classification tuned to the answer.

    (2) THE PROPAGATION LAW, WHICH IS WHAT MAKES THE PROJECTION USEFUL. A
    P1/P2 variable contributes a finite sourced ceiling to a monotone term. A
    P3/P4 variable contributes a ceiling only after a time-to-count conversion
    requiring a RATE no document supplies, so it propagates as "unsourced with
    a named missing quantity". A P5 variable propagates as "unsourced with a
    named terminating chain". A P6 variable propagates as "unsourced by
    construction". A variable whose delegation terminates in a clause stating
    a number under a different binder or modality propagates as
    "sourced-but-divergent", carrying both readings forward. Five outcomes,
    five different remedies.

    (3) WHERE THE PROJECTION DIES, REPORTED RATHER THAN CAVEATED. The class
    determines the outcome only while every term is monotone increasing in the
    variable. The moment two variables of the same class enter with opposite
    monotonicity -- which happens in FO bounds, where a larger message space
    helps and a larger query count hurts -- the class stops determining
    anything and the numbers must be read. The exact term at which this
    happens is part of the deliverable.

    (4) WHY AN ABSENCE MUST BE CHECKABLE. Every "not stated" row carries the
    exact full-text search terms used to establish it, and acquisition
    failures are tabulated SEPARATELY with HTTP status and attempt count.
    GOAL-MLKEM-005's census lost CNSA 2.0 to a 403 and recorded it as MISSING
    rather than EMPTY; a paywalled ISO amendment is the obvious repeat here,
    and merging the two categories would turn a retrieval failure into a
    documentary finding.

  assumptions:
    - >-
      HARD DEPENDENCY -- the transcribed bound exists, as an explicit
      inequality with every symbol bound to its printed definition, before this
      experiment runs. Without it the variable set is unknown and there is
      nothing to classify. This is a blocking prerequisite on GOAL-FRODO-002
      BATCH-001, not a soft one, and running ahead of it is not permitted.
    - >-
      The six-way taxonomy and the modality coordinate are frozen before
      retrieval begins and are not revised after any document is read. A
      taxonomy tuned post hoc can classify anything as anything.
    - >-
      "Dominant term" is well defined at each evaluation point, i.e. no tie
      within the arithmetic precision used. Ties are REPORTED as ties, never
      broken.
    - >-
      A stated absence established by named full-text search terms is a
      different epistemic object from an acquisition failure, and the two are
      never merged.
    - >-
      Every clause is bound to a document revision and a retrieval timestamp.
      A later revision may harmonize two clauses and thereby close the C3
      question by itself, which is a documentary fact about drafts and not a
      defect.
    - >-
      No conclusion transfers to any scheme other than FrodoKEM, and none
      transfers to a deployment mode not enumerated in the census.

  proof_search_map:
    bottleneck: >-
      The substitution step -- the exact point in the published accounting
      where a numeric query, user or ciphertext count is inserted into the
      bound to produce a bit figure. If that number has no source, or has two
      sources that disagree in shape, every figure downstream inherits the
      defect. Removing or confirming this step changes what the published
      category assignment means.
    baseline_embedding:
      parameter_slice: >-
        The paper's own stated inputs for its own stated IND-CCA (ROM) figure,
        per parameter set.
      reproduction_check: >-
        TWO ARMS, AND THE SEPARATION IS LOAD-BEARING. (i) REDUCTION ARM -- the
        transcribed bound, evaluated at the paper's own stated inputs, must
        reproduce the paper's own stated IND-CCA (ROM) bit figure per
        parameter set, held as a frozen regression fixture with its inputs and
        tolerance. THE NUMERIC TARGET IS DELIBERATELY LEFT UNFILLED -- it is a
        required BATCH-001 transcription output and no unverified number is
        copied into a frozen fixture here. (ii) CRYPTANALYSIS ARM -- the
        figures 149.8 / 212.6 / 266.8 enter as GIVEN INPUT SYMBOLS with their
        beyond-core-SVP provenance recorded; re-deriving them is forbidden by
        GOAL-FRODO-002 non_duplication and a pipeline that reproduced them from
        the transcribed bound would be WRONG, since they are lattice-
        cryptanalysis outputs and not outputs of any FO/SFO reduction. A
        pipeline that cannot recover the reduction-arm figure has not earned
        the right to report a sourced evaluation anywhere.
    observation_collision:
      observable: >-
        The dominant-term provenance signature -- an ordered tuple of classes
        over the variables of the largest term.
      distinct_preimage_search: >-
        Search for two deployment profiles with the SAME signature but
        materially different reachable bit security -- a static certified key
        (unbounded per-key ciphertext count, no stated count) against an
        ephemeral-per-handshake key (one ciphertext per key, very many keys).
        If both project to the same signature, the signature is not identifying
        and the record must report the collision and add the distinguishing
        coordinate (the variable's monotonicity direction in the dominant term)
        rather than suppress it. A second live collision -- a variable sourced
        by two documents with different modality projects to the same class
        under the six-way taxonomy alone -- is why the modality coordinate is
        recorded alongside.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the numeric grid by the class lattice P1..P6 ordered by "has
          a document-sourced finite supremum", so the question becomes an exact
          documentary condition per parameter set rather than a swept table.
        predicted_gain: >-
          Converts an infinite sweep into a finite documentary decision. The
          gain is in what can be CONCLUDED, not in compute; no exponent is
          claimed. DISCLOSED -- for the FO family the exact condition has a
          forced answer, so the gain is realized on the CAPPABLE variables and
          on the delegation structure, not on the headline yes/no.
    quantifier_order: >-
      A category claim should read -- FOR ALL adversaries with resources
      (t, q_G, q_H, q_D) in a stated region, FOR ALL deployments with (user
      count, per-key ciphertext count) in a stated region, THERE EXISTS a
      reduction B such that Adv(A) <= f(...). The audit question is whether the
      published figure instead instantiates THERE EXISTS over the resource and
      deployment variables -- i.e. whether the analyst's chosen point was
      universally quantified in the text and existentially quantified in the
      arithmetic. This record does not assume the answer; it records which the
      primary text states. The question must be asked of the paper's own
      IND-CCA figure, NOT of 149.8 / 212.6 / 266.8, which are cryptanalysis
      outputs on a different axis.
    method_ceiling:
      strongest_certifiable_claim: >-
        "No document in the enumerated retrieval set states a numeric bound on
        variable X, and every delegation chain from those documents terminates
        without a value or in a clause binding a different symbol or modality."
        That is the ceiling. The method can NEVER certify that X is unbounded
        in the world, that a large X is reachable, that any attacker exists,
        that FrodoKEM is insecure, or that any draft is defective. It cannot
        even certify that the enumerated retrieval set is complete.
      nearby_object_control: >-
        ML-KEM, where the same census has already been run and returned "no
        specification states any numeric M greater than 1" while ML-KEM is
        nonetheless a FIPS standard in wide deployment. That is the nearby
        object on which the hoped-for reading -- "an unsourced variable means a
        real security problem" -- demonstrably FAILS. Any run of this record
        that reads its own absences as a security consequence has been refuted
        in advance by its own control.
    proof_obligations:
      - claim: >-
          The transcribed bound's variable list is complete and each symbol is
          bound to its printed definition.
        responsibility: interface
      - claim: >-
          The paper's own IND-CCA (ROM) figure reproduces from the transcribed
          bound at the paper's own inputs.
        responsibility: baseline
      - claim: >-
          Each "not stated" row is supported by named full-text search terms
          over a retrieved document.
        responsibility: correctness
      - claim: >-
          Acquisition failures are enumerated separately and never counted as
          absences.
        responsibility: scope
      - claim: >-
          The dominant term is identified correctly at each evaluation point in
          exact or interval arithmetic.
        responsibility: correctness
      - claim: >-
          Every metric whose value is forced by the taxonomy or the controls is
          labelled forced, with its derivation recorded before the run.
        responsibility: strictness
    not_applicable_reason: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. No complexity claim, no attack, no exponent, no LWE
    hardness estimate produced or consumed beyond taking published figures as
    given input symbols. sota_delta is zero on every attack axis.

  heuristic_assumptions:
    - id: HEUR-FRODO-1
      formal_statement: >-
        The enumerated document set -- the FrodoKEM standard proposal and the
        CiC/ePrint paper, draft-longa-cfrg-frodokem,
        draft-longa-cfrg-frodokem-security-considerations,
        draft-smyslov-lamps-frodokem-certificates, the ISO/IEC 18033-2
        amendment, and any governing NIST or IETF clause a FrodoKEM deployment
        would inherit -- is the closure a deployer would actually consult.
      random_model_justification: >-
        NOT a distributional assumption. It is a completeness assumption about
        a hand-enumerated set, and it is UNVERIFIABLE by this method -- the
        method_ceiling says so explicitly. It is recorded because every "not
        stated" row is conditional on it.
      supporting_results: []
      validation_experiment_ids: [EXP-FRODO-da7207]
      falsification_condition: >-
        A document reachable from the enumerated set by a citation or normative
        reference, which states a number for a variable classified P5, and
        which the enumeration omitted. The classification for that variable is
        then wrong and the closure must be re-enumerated.
    - id: HEUR-FRODO-2
      formal_statement: >-
        A clause's deontic modality (MUST, MUST NOT, SHOULD, RECOMMENDED,
        informative) and its binder (the symbol it actually constrains) are
        determinable from the clause text alone, independently of the numeric
        value it states.
      random_model_justification: >-
        Not distributional. It is the separability assumption the C3 metric
        rests on, and NULL-4 is built to test it directly -- restate one
        retrieved clause with its RFC-2119 keyword changed and nothing else,
        and require the same class and value with a different modality.
      supporting_results: []
      validation_experiment_ids: [EXP-FRODO-da7207]
      falsification_condition: >-
        NULL-4 moves the class, or fails to move the modality. Modality is then
        leaking into the classification or is not measurable, and the C3 metric
        is void.

  predictions:
    - metric: >-
        C1 -- number of delegation chains, over the enumerated closure, that
        terminate in a document stating no number for the variable delegated,
        with the full path recorded
      direction: higher
      minimum_effect: >-
        AT LEAST 1. Zero is a real and reportable outcome and is the clean
        negative. HEADLINE METRIC. The one chain already followed by the parent
        proposal's author terminates WITH a value, so this count is not forced
        upward.
    - metric: >-
        C2 -- number of distinct provenance classes among the variables of a
        single dominant term AFTER EXCLUDING P1 and P6, per parameter set
      direction: higher
      minimum_effect: >-
        AT LEAST 2. Zero or one is the clean negative and is entirely
        reachable. HEADLINE METRIC. The un-excluded version of this count was
        near-forced and is not used.
    - metric: >-
        C3 -- number of ADDITIONAL pairs of retrieved documents stating the
        same number for the same symbol with different deontic modality or
        different binder, beyond the seeded row
      direction: higher
      minimum_effect: >-
        AT LEAST 1 additional row. Zero additional rows is a complete answer
        and reduces the finding to a single historical row, reported as such.
        The seeded row is entered with its provenance and is NEVER counted as a
        discovery.
    - metric: >-
        F1 (REPORTED, FORCED, NEVER EVIDENCE) -- number of dominant-term free
        variables carrying class P5 or P6, per parameter set
      direction: higher
      minimum_effect: >-
        AT LEAST 1, ENTAILED BEFORE ANY DOCUMENT IS OPENED by the frozen
        taxonomy plus NULL-3 plus the shape of every FO-family bound. Reported
        for completeness with its derivation, never as a discriminator, and
        NULL-3 may not be cited as evidence for it since NULL-3 forces it.
    - metric: >-
        G1 -- signed gap, in bits, between the bit figure at the largest
        SOURCED value of each P2 variable and the paper's own published
        IND-CCA figure for that parameter set
      direction: different
      minimum_effect: >-
        Report the number with its sign and its interval. NO minimum magnitude
        is declared, because a gap of zero is a meaningful result -- it would
        mean the sourced point IS the published point. The comparison target is
        the paper's own IND-CCA figure, NOT the beyond-core-SVP cryptanalysis
        figures.
    - metric: >-
        A1 -- count of acquisition failures, with HTTP status, attempt count
        and timestamp, tabulated separately from stated absences
      direction: different
      minimum_effect: >-
        Reported whatever its value. A census with zero acquisition failures
        and a paywalled ISO amendment in its source list is not credible and
        must be re-examined.

  test_boundary:
    instances:
      - >-
        The free variables of the FrodoKEM IND-CCA bound as transcribed by
        GOAL-FRODO-002 BATCH-001, at the three published parameter sets.
      - >-
        The enumerated FrodoKEM standardization document closure, at stated
        revisions with retrieval timestamps.
      - >-
        Controls -- the 2^8 per-public-key ciphertext clause (NULL-1, run
        separately against BOTH documents stating it); a spec-fixed length
        parameter, len_salt preferred because it takes the value 0 for
        ephemeral sets (NULL-2); the offline hash-query count q_G (NULL-3); and
        one retrieved clause with its RFC-2119 keyword altered (NULL-4).
      - >-
        NEARBY OBJECT -- the completed ML-KEM census of GOAL-MLKEM-005, used to
        show that an unsourced variable does NOT imply a security problem.
      - >-
        OUT OF SCOPE -- any scheme other than FrodoKEM; any re-derivation of
        LWE hardness or of the beyond-core-SVP figures; any statement about
        whether a published failure rate is correct; any deployment mode not
        enumerated in the census.
    parameters:
      taxonomy_classes: [P1, P2, P3, P4, P5, P6]
      extra_coordinate: deontic_modality_and_binder
      parameter_sets: 3
      arithmetic: exact or certified interval
      evaluation_points: "paper's own inputs; sourced supremum of every P2 variable; declared ladder for P3-P6"
    implementation: experiments/EXP-FRODO-da7207
    budget:
      agent_hours_estimate: 8
      compute_seconds: 600
      maximum_memory_gb: 2
      maximum_runs: 4

  distinguishable_outcomes:
    - outcome: >-
        All four nulls pass, the reduction-arm baseline reproduces, and
        C1 >= 1, C2 >= 2, C3 >= 1 additional row.
      means: >-
        FrodoKEM's standardization surface has the same structural gap ML-KEM's
        does, its dominant term consumes cappable deployment quantities of more
        than one authority kind, and the seeded normative-force disagreement is
        not isolated. This is a DOCUMENTARY finding about documents at stated
        revisions. It is not a security claim, not a defect claim, and the
        ML-KEM nearby object refutes in advance any reading of it as one.
    - outcome: >-
        All four nulls pass, the baseline reproduces, and C1 = 0, C2 <= 1,
        C3 = 0 additional rows.
      means: >-
        THE CLEAN NEGATIVE, and it is fully reachable. FrodoKEM's surface
        always terminates in a value; the dominant term is a pure
        modelling-convention term containing only spec-fixed lengths and
        offline query counts; the seeded pair is the only normative-force
        divergence in the closure. The hypothesis is FALSE on all three
        headline parts and that is a real result to be reported as such rather
        than buried.
    - outcome: >-
        NULL-1 returns "not stated" for the 2^8 clause, or merges the two
        documents into one row; or NULL-2 returns P5 for a spec-fixed length;
        or NULL-4 moves the class or fails to move the modality.
      means: >-
        INSTRUMENT FAILURE. The procedure cannot recognize a bound that IS
        stated, or cannot see the modality coordinate. No absence it reports is
        admissible and C3 is void. The deliverable is the instrument defect.
    - outcome: >-
        NULL-3 returns a numeric bound for q_G.
      means: >-
        The procedure is treating a modelling convention (an analyst's chosen
        2^64 or 2^128) as a sourced deployment quantity. That is exactly the
        error the whole design exists to detect; the taxonomy is void and the
        run is discarded.
    - outcome: >-
        The reduction-arm baseline fails to reproduce the paper's own IND-CCA
        figure at the paper's own inputs.
      means: >-
        No census result may be published on top of an unreproduced baseline.
        The discrepancy becomes the deliverable and this hypothesis is
        suspended pending its resolution.
    - outcome: >-
        The dominant term changes identity across the region an unsourced
        variable ranges over.
      means: >-
        "The dominant-term variables" is not a well-defined set. The record
        must report a dominance-region decomposition instead of a single
        signature, or withdraw.
    - outcome: >-
        The BATCH-001 transcription does not exist at execution time.
      means: >-
        BLOCKED, not negative. The experiment does not run and no metric is
        reported. This is a dependency state, never evidence in either
        direction.

  falsification_conditions:
    - >-
      C1 REFUTED -- every delegation chain in the enumerated closure terminates
      in a document stating a number.
    - >-
      C2 REFUTED -- at every parameter set the dominant term contains no
      variable outside classes P1 and P6.
    - >-
      C3 REFUTED beyond its seed -- the closure contains no further
      differently-shaped pair, and a current revision harmonizes the seeded
      pair.
    - >-
      NULL-1 or NULL-2 fails, or NULL-1 merges the two 2^8 documents, or NULL-4
      moves the class or fails to move the modality. No absence is admissible
      and C3 is void.
    - >-
      NULL-3 returns a numeric bound for q_G. The taxonomy is void.
    - >-
      The repaired baseline reproduction fails. The record is suspended and the
      discrepancy is the deliverable.
    - >-
      All controls return the same class, showing the taxonomy does not
      discriminate on its own control set.

  interpretation_limits:
    - >-
      An unsourced variable is an ABSENCE OF A STATED NUMBER, symmetric in both
      directions. It is not a ceiling, not a permission, not evidence that a
      large value is reachable, and not evidence that it is not.
    - >-
      A difference in normative shape between two drafts is a documentary
      observation about two drafts at stated revisions. It is not a defect
      claim and not a security claim; drafts are revised routinely.
    - >-
      FrodoKEM's deployment surface is thinner and younger than ML-KEM's. An
      absence may record immaturity of the standardization track rather than a
      structural gap in the accounting, and the census CANNOT tell those apart.
      Every conclusion must say so.
    - >-
      No statement about any attacker. No LWE hardness estimate produced or
      consumed beyond taking published figures as given inputs; in particular
      149.8 / 212.6 / 266.8 are beyond-core-SVP cryptanalysis outputs and are
      never re-derived here.
    - >-
      No statement about whether any published failure rate is correct; the
      failure rate is a symbol here.
    - >-
      The classification depends entirely on the transcription. If BATCH-001
      transcribes a variable under a different name or folds two variables into
      one, the class signature changes without anything in the world changing.

