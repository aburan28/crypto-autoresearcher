hypothesis:
  id: H-ECDLP-79fa89
  question_id: RQ-RELN-001
  goal_id: null
  source_proposal: IDEA-20260830-d2ebb5
  status: proposed
  proposed_by: idea-generator
  designed_by: coordinator
  designed_under_task: TASK-20260904-ae82ce
  design_note: >-
    DESIGN ONLY, AND THIS RECORD IS PART VERIFICATION PROTOCOL. It defines a
    certificate class for the NEGATIVE half of an exhaustive-enumeration
    measurement, proves by an explicit observation collision that three cheap
    invariants are jointly insufficient, and then MEASURES the suite's power
    by replanting defects of known size. The mathematical content is the
    idea-generator's. The Coordinator's own contribution is the curve-free
    arm and its pre-declared consequence, which turns out to separate exactly
    which invariants carry curve content and which do not. No status of any
    record is changed and nothing here is evidence.

  statement: >-
    TEST BOUNDARY FIRST. Toy scale throughout, p at most 6007, factor bases
    of at most 22 x-coordinates, k at most 100 spot checks. No attack, no
    exponent, no algorithm. This is verification infrastructure for one
    measurement.

    THE GAP. The program's own policy requires a certificate for every
    claimed solve or relation and states plainly, in words quoted verbatim
    from docs/claims-and-verification.md, that there is "No certification that
    a *negative* result generalizes - a certificate proves a positive witness
    is real; absence of a witness within budget is only ever a scoped
    negative observation". A decomposition-probability measurement is an
    estimate of a PROPORTION, and at the densities this lane operates at most
    of the evidence is NEGATIVES. The committed enumerators return a
    verifiable certificate when a decomposition is found and no certificate
    otherwise, and the density sweeps write certificate kind "none" for the
    whole run. So the half of the measurement carrying most of its
    information is backed by nothing but the enumerator's own control flow.

    THE REGIME DISTINCTION THAT MAKES THIS FIXABLE, AND ITS LIMIT. The policy
    sentence is exactly right for a BUDGETED SEARCH: a solve that times out
    has found no witness and proved nothing. It is not the regime this lane
    is in. The rates here are produced by EXACT ENUMERATION of the m-fold
    signed sumset, and an exhaustive enumeration's negative is "no witness
    EXISTS", a completeness claim about a finite computation, checkable by
    exact identities in the same cheap independent way a positive witness is.
    This record proposes that certificate class and NOTHING WIDER. It does
    not certify budgeted negatives, it does not weaken or reinterpret the
    policy sentence, and it does not certify that any negative generalizes
    beyond the enumerated instance.

    THE FOUR INVARIANTS. E1 CONSERVATION CHECKSUM: an enumerator counting
    MULTIPLICITIES must satisfy the sum over g of c_W(g) equal to
    binom(2B+m-1, m) exactly, for W = V union -V of size 2B; recomputable
    from two integers. E2 NEGATION SYMMETRY: c_W(g) = c_W(-g) for every g,
    forced because W = -W. E3 IDENTITY COUNT: c_W(O) = B at m = 2 on a
    2-torsion-free base, forced. E4 SPOT-CHECKED NON-MEMBERSHIP: k targets
    declared non-decomposable are re-decided by an INDEPENDENT
    meet-in-the-middle test sharing no code with the enumerator, with k
    declared before the run. Plus, whenever targets are sampled rather than
    exhausted, S1 SAMPLER CERTIFICATE: the base point's exact order with its
    factorization witness, the count of distinct targets against the birthday
    prediction with a z-score, the count of dropped draws, and the declared
    target support.

    THE CENTRAL TECHNICAL CLAIM, WHICH IS WHY E4 IS NOT DECORATION. E1, E2
    and E3 are all invariant under composing the multiset-to-target map with
    any group automorphism that commutes with negation - multiplication by a
    unit u modulo N. Such a relabelled enumerator reports the identical
    total, the identical negation symmetry and the identical identity count
    while being WRONG about every membership question. Two distinct
    ground-truth objects therefore share the (E1,E2,E3) observable, one on
    each side of the conclusion. E4 separates them, and its power is bounded
    and stateable: a defect changing membership on a fraction eps of targets
    survives k independent spot checks with probability (1 - eps)^k, so the
    suite's detection floor is of order 3/k and MUST be published with every
    certificate rather than left implicit.

    THE POWER MEASUREMENT, WHICH IS THE EXPERIMENT. A certificate suite never
    shown to catch anything is a ritual. Seven defects are replanted - four
    reconstructed from this program's own instrument-defect history, two
    synthetic, one adversarial and designed to evade E1-E3 - and the
    detection rate of each invariant against each defect is measured against
    a matrix pre-registered before any defect is planted. The predicted
    matrix contains FORCED MISSES as well as forced hits, and saying so in
    advance is what distinguishes a measured suite from an advertised one.

  mechanism: >-
    THE TRACKED OBJECT is the MULTIPLICITY HISTOGRAM of the multiset-sum map,
    projected to the triple (total mass, negation-symmetry defect,
    identity-fibre size) - three integers computed from an object with N
    components. This is violently lossy: the fibre over any admissible triple
    contains every enumerator that gets the counts right, correct or not, and
    the collision above exhibits an explicit infinite family inside one
    fibre. It is lossy COMPATIBLY with the operation the measurement
    performs, which is what makes it usable at all: the total mass is
    preserved by the group operation because every size-m multiset sums to
    exactly one element, and the negation symmetry is preserved because
    negating every element of a multiset is an involution on multisets. So
    both retained coordinates propagate deterministically through the
    enumeration, and a truncation, a duplication, a set-versus-multiset
    conflation or a sign-convention error necessarily perturbs one of them.
    It is emphatically NOT a change of coordinates - the histogram is not
    recoverable from the triple - and this record's central content is the
    demonstration that the loss is large enough to admit wrong answers.

    WHY THE DEFECT-INJECTION DESIGN DISCRIMINATES RATHER THAN CONFIRMS. Two
    competing accounts of this program's defect history make opposite
    predictions. ACCOUNT 1: the historical defects were caught because the
    campaign was attentive, and a checklist adds paperwork without power.
    ACCOUNT 2: they were caught late, by an impossible printed value and by a
    post-hoc validator recomputation, and cheap forced identities would have
    caught most of them at the moment of computation. The detection matrix
    separates these: under ACCOUNT 1 the invariants fire on few of the seven
    planted defects and the honest deliverable is that the suite is
    decoration; under ACCOUNT 2 they fire on the pre-registered subset with
    the pre-registered signatures. Neither outcome is assumed and the
    negative outcome is publishable as-is.

    WHY THE CERTIFICATE IS NEARLY FREE, WITH THE COST STATED. The committed
    enumerators already build the sumset as a SET of points. Counting
    multiplicities instead costs the same loop with a counter, and the memory
    moves from a set of |mW| points to a map of at most min(|mW|, N) counters
    - at toy scale a small constant factor, at larger N a real cost that is
    disclosed rather than hidden and measured in the battery. E2 and E3 are
    one pass each; E4 costs k meet-in-the-middle probes; S1 costs one
    point-order computation and one distinct-count.

  assumptions:
    - >-
      The enumerator under certification is EXHAUSTIVE over the declared
      multiset space. The certificate class is defined ONLY for that regime;
      a budgeted or heuristic search may not emit it, and the certificate
      records the regime as a field so a reader can tell.
    - >-
      The factor base is a set of x-coordinates lifted to W = V union -V,
      2-torsion-free unless the 2-torsion arm is running. If a later
      construction changes that convention, E1 and E3's forced integers
      change and must be re-derived before use; the certificate records the
      convention.
    - >-
      The independent meet-in-the-middle re-decider for E4 genuinely shares
      no code with the enumerator, enforced by an import-graph check and an
      AST-level structural diff rather than by inspection.
    - >-
      The group order N and the target support are known exactly, which they
      are at toy scale by direct enumeration.
    - >-
      Toy scale binds. Every planted defect is replanted at p at most 6007
      with factor bases of at most 22 x-coordinates; no crypto-scale claim is
      made or implied.

  proof_search_map:
    bottleneck: >-
      The enumerator's transition from a multiset enumeration to a SET of
      reached points, which destroys the one quantity (total multiplicity)
      that is independently predictable, together with the emission of
      certificate kind "none" that records that destruction as intentional.
    baseline_embedding:
      parameter_slice: >-
        A correct multiplicity-counting enumerator on a 2-torsion-free base
        at m = 2 must reproduce total binom(2B+1, 2) = 2B^2 + B, c_W(O) = B,
        and perfect negation symmetry, and must agree with the committed
        set-based enumerator on the SUPPORT of the histogram at densities
        where the cancelling-pair route is covered. That agreement embeds the
        existing instrument as a boundary case.
      reproduction_check: >-
        A frozen fixture at p = 101, a = 2, b = 3 with B in {5, 8, 12} and m
        in {2, 3}: the totals are exact integers computable by hand before
        the run, stored in the contract, and the enumerator is compared
        AGAINST the stored file rather than the file against the enumerator.
    observation_collision:
      observable: >-
        The triple (E1 total, E2 symmetry fraction, E3 identity count)
        emitted by an enumerator.
      distinct_preimage_search: >-
        COLLISION EXHIBITED, NOT MERELY SOUGHT. Let u be any unit modulo N
        with u not equal to plus or minus 1, and let A be an enumerator that
        computes the true histogram c and reports g maps to c(u*g). Then the
        total is unchanged (a bijection of the group permutes the fibres),
        negation symmetry is preserved (u commutes with negation) and the
        identity count is preserved (u fixes the identity). So A and the true
        enumerator share the observable EXACTLY while disagreeing about
        membership on a 1 - o(1) fraction of targets, one on each side of the
        conclusion "this target does not decompose". E1-E3 are therefore NOT
        identifying, and the record says so rather than claiming a complete
        check. E4 separates the pair with probability 1 - (1 - eps)^k and its
        floor is published.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Certify the multiplicity HISTOGRAM rather than the reached set:
          carry the total, the symmetry defect and the identity fibre through
          the computation, because that stronger state is what survives the
          enumerator's own recursion and what a truncation cannot fake.
        predicted_gain: >-
          Converts four classes of enumerator defect - truncation,
          duplication, set-versus-multiset conflation, sign-convention error
          - from silent to forced-detected, at the cost of one counter map
          and one extra pass.
      - transform: observable_fiber
        proposed_object: >-
          Hold (E1,E2,E3) fixed and vary the forgotten structure by the unit
          relabelling; the intrinsic invariant distinguishing the resulting
          enumerators is membership itself, which is exactly what E4 samples.
        predicted_gain: >-
          Turns "the checks passed" into "the checks passed, and here is the
          class of defect they cannot see, with its detection floor".
    quantifier_order: >-
      FOR ALL 2-torsion-free bases V of size B on a curve of order N, and FOR
      ALL m >= 2, THERE EXISTS a triple of integers, computable from (B, m)
      ALONE without reference to the curve, that any exhaustive
      multiplicity-counting enumerator must reproduce exactly. The witness is
      NOT allowed to depend on the curve, the base, the seed or the
      enumerator, and that prohibition is the falsifiable content: an
      enumerator whose total depends on which base it was given is wrong,
      without appeal.
    method_ceiling:
      strongest_certifiable_claim: >-
        "This specific exhaustive enumeration over this specific declared
        multiset space is internally consistent with three forced identities,
        and k independently re-decided negatives agreed, so a defect touching
        more than about 1/k of targets is excluded at the stated
        confidence." It CANNOT certify that no decomposition exists under a
        different arity, base, sign convention or budgeted search; it
        certifies nothing about untested targets; and it makes no toy
        negative transfer to any larger parameter. It is a completeness
        certificate for a finite computation, nothing more.
      nearby_object_control: >-
        A genuinely CORRECT enumerator run on a base seeded with t 2-torsion
        x-coordinates, where |W| = 2B - t and the forced total is
        binom(2B-t+m-1, m) rather than binom(2B+m-1, m). A suite that flags
        this correct enumerator as defective, or that passes it while using
        the wrong forced constant, has not identified the load-bearing
        structure and its verdicts are worthless. This arm is MANDATORY, and
        a false alarm here is DISQUALIFYING - worse than missing a defect.
    proof_obligations:
      - claim: "The sum over g of c_W(g) equals binom(2B+m-1, m) exactly for W of size 2B, for every base and every curve."
        responsibility: correctness
      - claim: "c_W(g) = c_W(-g) for all g, and c_W(O) = B at m = 2 on a 2-torsion-free base."
        responsibility: correctness
      - claim: "The unit-relabelling enumerator preserves all three invariants and is wrong, so the triple is not identifying."
        responsibility: strictness
      - claim: "A defect of reach eps survives k spot checks with probability (1 - eps)^k, so the published detection floor is honest."
        responsibility: success_probability
      - claim: "The E4 re-decider shares no code path with the enumerator, verified by import graph and AST diff."
        responsibility: interface
      - claim: "The certificate costs one counter map, one pass, k MITM probes and one point-order computation, with the memory change from |mW| points to min(|mW|, N) counters disclosed."
        responsibility: memory
      - claim: "Every invariant that is curve-free is identified as such, so no certificate is quoted as an elliptic-curve statement it cannot support."
        responsibility: scope

  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. NO ATTACK EXPONENT IS CLAIMED AND NONE IS MOVED. Under
    docs/target-result-profile.md this is explicitly NON-TARGET-CLASS. The
    suite's own cost is O(binom(2B+m-1,m)) for an enumeration already
    performed, plus O(k * B^ceil(m/2)) for the spot checks and
    O(min(|mW|, N)) for the counter map. Its priority rests entirely on being
    a correctness precondition for the negative half of every decomposition
    rate this program reports. Pollard rho at 0.886*sqrt(N) with O(1) memory
    remains the prime-field baseline and is untouched.

  heuristic_assumptions:
    - id: HEUR-CERT-1
      formal_statement: >-
        A defect that alters the enumerator's membership verdict on a
        fraction eps of targets, chosen independently of the k targets drawn
        for the E4 spot check, is detected with probability exactly
        1 - (1 - eps)^k, so the suite's detection floor at confidence 0.95 is
        eps = 1 - 0.05^(1/k), approximately 3/k for large k.
      random_model_justification: >-
        The RIGOROUS ingredient is elementary and exact: independent
        Bernoulli trials give the stated detection probability with no
        approximation. The classical statement imitated is the rule of three
        for zero observed events in k trials, standard in acceptance
        sampling. THE GAP IS REAL and is the independence clause: an
        adversarial or structured defect can correlate with the spot-check
        sampler - for instance a defect confined to a subgroup while the
        sampler draws from that same subgroup - and then the formula does not
        apply. That is why the spot-check targets are drawn from the DECLARED
        target support with a recorded seed and why the certificate publishes
        both, and why a structured-defect arm is run alongside the
        independent one.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-f7ae55]
      falsification_condition: >-
        The measured detection rate departs from 1 - (1 - eps)^k by an exact
        binomial test at the 5 percent level in more than 5 percent of cells,
        or the structured-defect arm's rate is NOT lower than the independent
        arm's, in which case the independence concern is empirically inert at
        these parameters and must be reported as such.
    - id: HEUR-CERT-2
      formal_statement: >-
        For a 2-torsion-free factor base of B distinct x-coordinates on
        E(F_p), the signed point set W = V union -V has size exactly 2B and
        every size-m multiset from W sums to exactly one group element, so
        the forced total binom(2B+m-1, m) is exact and curve-independent.
      random_model_justification: >-
        NOT HEURISTIC AT ALL, and this entry exists to record that rather
        than to smuggle an assumption in. The double count is established and
        the |W| = 2B step holds because x(P) = x(-P) and y is nonzero off the
        2-torsion. The only assumption is the 2-torsion-free convention,
        which is a CHECKABLE property of the base rather than a
        distributional claim, and the 2-torsion-seeded arm exercises the
        other branch with its own forced constant.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-f7ae55]
      falsification_condition: >-
        Exact integer inequality with the forced total on any clean cell,
        with zero tolerance, or a failure of the 2-torsion-seeded arm to
        match binom(2B-t+m-1, m) at t in {1, 2, 3}.

  structural_ingredients:
    - description: >-
        The policy requires every run claiming a solve or relation to emit a
        certificate re-verified by code independent of the solver, defines
        certificate kinds discrete_log / decomposition / none, and states
        under "What this does NOT provide" that there is no certification
        that a negative result generalizes, because absence of a witness
        within budget is only ever a scoped negative observation.
      citation: docs/claims-and-verification.md
      provenance: internal
      verified_by: >-
        coordinator TASK-20260904-ae82ce, which read the "What this does NOT
        provide" section of docs/claims-and-verification.md directly in this
        session and confirms the sentence quoted in `statement` appears there
        verbatim at that location. The remainder of the file (the certificate
        kinds and the refutation-artifact ladder) is RELAYED from
        IDEA-20260830-d2ebb5, which records reading all 297 lines on
        2026-08-29, and was not re-read here.
      role: >-
        fixes the policy boundary this record operates inside and must not
        widen
    - description: >-
        The committed enumerator returns (True, summands, certificate) on
        success and (False, [], None) on failure, so a NEGATIVE carries no
        certificate at all; the verification routine re-checks only positive
        certificates. The density sweep writes certificate kind "none" for
        the whole run, and its enumerators build the intermediate sets as
        SETS of points, discarding multiplicity.
      citation: harness/semaev.py, harness/run_saturation.py, harness/exp_icinv.py
      provenance: internal
      verified_by: >-
        idea-generator of IDEA-20260830-d2ebb5, which records reading
        harness/semaev.py in full (233 lines), harness/run_saturation.py in
        full (203 lines), and harness/exp_icinv.py lines 1-232 and 278-478 on
        2026-08-29. RELAYED, NOT RE-READ by coordinator TASK-20260904-ae82ce.
        Because the defect-replanting arm D2 is defined as a property of the
        committed control flow, the paired contract makes re-reading these
        files a BLOCKING Stage 0 obligation with recorded sha256 values.
      role: >-
        establishes the gap - the negative half is backed by the enumerator's
        own control flow and nothing else
    - description: >-
        The three forced identities applied to the signed point set: total
        binom(2B+m-1, m) for W of size 2B, the forced negation-symmetry
        fraction of exactly 1.000, and c_W(O) = B at m = 2 on a
        2-torsion-free base; plus the 2-torsion-seeded arm whose forced total
        becomes binom(2B-t+m-1, m).
      citation: IDEA-20260805-5ac0a2
      provenance: internal
      verified_by: >-
        idea-generator of IDEA-20260830-d2ebb5, which records reading
        ledger/proposals/IDEA-20260805-5ac0a2.yaml in full (519 lines) on
        2026-08-29. RELAYED, NOT RE-READ by coordinator TASK-20260904-ae82ce.
      role: >-
        supplies E1, E2 and E3, which are ADOPTED AND CREDITED and not
        re-derived; this record adds the packaging, the collision proof, the
        sampler check and the measured power
    - description: >-
        The mean per-target yield identity with measured deviation exactly 0
        over 144 cells, and the coverage bound; the source of the
        conservation double count E1 instantiates on the signed set.
      citation: KN-FIND-007
      provenance: internal
      verified_by: >-
        idea-generator of IDEA-20260830-d2ebb5, which records reading
        knowledge/findings/KN-FIND-007.md in full (96 lines) on 2026-08-29.
        RELAYED, NOT RE-READ by coordinator TASK-20260904-ae82ce.
      role: supplies the conservation identity
    - description: >-
        A fourth instrument defect found during construction of a sweep, by
        an impossible printed value traced to a target sampler degenerating
        to a single repeated point when its unchecked base point was
        2-torsion; present in 4 of 8 already-committed classes; and a
        completed independent review that reproduced the defect and the fix,
        matching a birthday-collision approximation of 278.4 distinct targets
        against 275 observed.
      citation: EV-ENDO-10109d
      provenance: internal
      verified_by: >-
        idea-generator of IDEA-20260830-d2ebb5, which records reading
        ledger/evidence/EV-ENDO-10109d.yaml in full (189 lines) on
        2026-08-29. RELAYED, NOT RE-READ by coordinator TASK-20260904-ae82ce.
        The paired contract requires the executing agent to re-read the
        correction record before reconstructing planted defect D1, since D1
        is a RECONSTRUCTION rather than the original code path.
      role: supplies planted defect D1 and the S1 forced-detection prediction

  reduction_chain:
    core_problem: >-
      Whether the negative half of an exhaustive decomposition-rate
      measurement can be independently certified, and with what measured
      power and what published detection floor.
    corollaries: []
  reduction_chain_note: >-
    Deliberately empty. Adopting a certificate schema into the program's
    templates is a Coordinator decision that nothing here performs.

  predictions:
    - metric: >-
        E1 total multiplicity emitted by a corrected multiplicity-counting
        enumerator against binom(2B+m-1, m) on every clean cell; ABSOLUTE
        INTEGER COUNT of size-m signed multisets
      direction: different
      minimum_effect: >-
        EXACTLY EQUAL, deviation 0, no tolerance. Any nonzero deviation on a
        clean cell is an implementation fault and the battery halts rather
        than reporting.
    - metric: >-
        E1 shortfall on planted defect D2 (the committed cancelling-pair
        severance) at m = 3; ABSOLUTE INTEGER COUNT
      direction: lower
      minimum_effect: >-
        A shortfall of EXACTLY 2B^2 multisets - the count of size-3 multisets
        from W containing a plus-minus pair - at every cell, i.e. 32 at B = 4
        and 968 at B = 22. FORCED INTEGER, computed before the run. A
        shortfall of any other value means either the derivation or the
        replanting is wrong and the arm halts.
    - metric: >-
        Detection matrix: which of E1, E2, E3, E4, S1 fires on each of seven
        planted defects; 7 by 5 boolean matrix
      direction: different
      minimum_effect: >-
        PRE-REGISTERED WITH FORCED MISSES INCLUDED. D1 2-torsion sampler
        degeneracy: S1 fires with a z-score above 10 on the distinct-target
        count, E1-E4 MISS BY CONSTRUCTION. D2 cancelling-pair severance: E1
        fires exactly. D3 truncated enumeration at 90 percent: E1 fires. D4
        sign convention dropped: E1 fires with total binom(B+m-1,m) and E2
        fires. D5 off-by-one base size: E1 fires. D6 unit relabelling: E1,
        E2, E3 ALL MISS by the collision proof, E4 fires with probability
        1 - (1-eps)^k. D7 membership flipped on a random 1 percent of
        targets: E1-E3 miss, E4 fires with probability 1 - 0.99^k, which at
        k = 100 is 0.63 - chosen deliberately to sit NEAR THE FLOOR so the
        floor is measured and not asserted. A suite firing on fewer than five
        of seven, or firing where a forced miss is predicted, is reported as
        a FAILED SUITE.
    - metric: >-
        S1 z-score of the distinct-target count against the birthday
        prediction on the historical 2-torsion configuration; dimensionless
        standard deviations
      direction: higher
      minimum_effect: >-
        The historical defect produced 1 distinct target where the birthday
        prediction for 300 draws from a pool of about 2083 is 278.4 with a
        standard deviation of order 1.5, i.e. a z-score above 100. FORCED
        DETECTION. If S1 does not fire here the sampler certificate is
        mis-specified and must be rewritten before use.
    - metric: >-
        Nearby-object control: the suite's verdict on a CORRECT enumerator
        over a base seeded with t 2-torsion x-coordinates; boolean PASS/FAIL
      direction: same
      minimum_effect: >-
        MUST PASS, using the forced total binom(2B-t+m-1, m). A false alarm
        here means the suite rejects correct instruments, which is a WORSE
        failure than missing a defect and is DISQUALIFYING.
    - metric: >-
        D7 detection rate over 20 independent plantings at each (eps, k);
        dimensionless proportion in [0,1] with a binomial interval
      direction: different
      minimum_effect: >-
        Within the exact binomial 95 percent interval of 1 - (1 - eps)^k at
        every (eps, k) cell, with the STRUCTURED-defect arm reported
        separately and expected LOWER. This is the measurement of the floor.
    - metric: >-
        Certificate overhead: wall time and peak RSS of a certified run
        against the same run uncertified; dimensionless ratios
      direction: higher
      minimum_effect: >-
        Predicted below 1.5x wall time and below 3x peak RSS at p = 6007 with
        m = 3 and B up to 22. If overhead exceeds 5x wall time or 10x memory,
        the obligation cannot be universal and the deliverable changes from
        "mandatory" to "mandatory below a stated cell size".

  test_boundary:
    instances:
      - "Hand-computed fixture at p = 101, a = 2, b = 3, B in {5, 8, 12}, m in {2, 3}, totals stored in the contract before the run."
      - "Clean cells over the committed factor-base ladder at p = 4001 and p = 6007, m in {2, 3}."
      - "Seven planted defects, one at a time, behind flags."
      - "The 2-torsion-seeded nearby-object arm at t in {1, 2, 3}."
      - "A null-defect arm: a flagged no-op refactor that changes nothing."
      - "A curve-free arm on Z/N with a symmetric 2B-subset."
    parameters:
      p: "{101 fixture, 4001, 6007}"
      B: "at most 22"
      m: "{2, 3}"
      k: "{30, 100, 300}"
      eps: "{0.01, 0.03, 0.10}"
      plantings_per_cell: 20
    implementation: >-
      A multiplicity-counting enumerator and a DISJOINT meet-in-the-middle
      re-decider, disjointness enforced by an import-graph check and an
      AST-level structural diff rather than by inspection. Exact enumeration
      only; no solver, no Groebner basis, no Macaulay matrix.
    budget: >-
      See EXP-ECDLP-f7ae55. All arms are exact enumeration at p at most 6007
      with B at most 22 and k at most 100 probes on the main matrix, plus 360
      planting events for the floor measurement.

  falsification_conditions:
    - >-
      The unit-relabelling collision does not hold. E1-E3 would then be
      identifying, E4 could be dropped, and the record is re-scoped to a
      cheaper and STRONGER suite - a better outcome than the one proposed.
    - >-
      The suite fires on fewer than five of the seven planted defects. The
      certificate class as specified has low power and the honest deliverable
      is that finding, not a schema.
    - >-
      An enumerator-level invariant fires on D1, the sampler defect. The
      analysis of what each invariant measures is wrong and must be redone
      before any schema is proposed.
    - >-
      The nearby-object control false-alarms. The suite rejects correct
      instruments and is DISQUALIFIED as written.
    - >-
      E1 deviates from binom(2B+m-1,m) on a clean cell. Implementation fault;
      nothing is reported from any arm.
    - >-
      The null-defect arm fires. The suite has a false-positive rate and its
      usable threshold must be restated before any detection number is
      quoted.
    - >-
      Certificate overhead exceeds 5x wall time or 10x memory. The obligation
      cannot be universal and the protocol must scope it.
    - >-
      D2 replanting does not produce an E1 shortfall of exactly 2B^2 at
      m = 3. Either the multiset derivation or the reading of the committed
      control flow is wrong, and the discrepancy is reported before anything
      else in the batch.
    - >-
      Any timeout or crash. INFRASTRUCTURE outcome under AGENTS.md rule 5,
      never negative mathematical evidence.

  interpretation_limits:
    - >-
      NO ATTACK, NO EXPONENT, NO ALGORITHM. Verification infrastructure for
      one measurement at toy scale.
    - >-
      The certificate class covers EXHAUSTIVE enumeration only. It does not
      weaken, amend or reinterpret the policy statement about budgeted
      negatives, and any run using a budgeted search must continue to report
      a scoped negative observation with certificate kind none.
    - >-
      A passing certificate says the computation is internally consistent and
      spot-check-consistent. It does not say the rate is interesting, does
      not license any cross-cell comparison, and does not transfer to any
      other arity, base, curve or scale.
    - >-
      THE DETECTION FLOOR IS THE HONEST HIDDEN COST: a defect touching fewer
      than about 3/k of targets is invisible to E4, so a certificate is a
      BOUNDED statement and must publish its k. A suite quoted without its
      floor overstates itself, which is why the floor is a mandatory schema
      field rather than a recommendation.
    - >-
      SPOT-CHECK BLIND SPOT, REAL AND UNREMOVABLE: if the re-decider shares
      the curve-arithmetic module with the enumerator - which it must, to be
      comparable - then a defect IN THE CURVE ARITHMETIC is invisible to
      both. Stated in the certificate rather than patched over; the
      mitigation is that curve arithmetic is separately covered by existing
      point-order and group-order checks.
    - >-
      E1, E2 and E3 are identities about multisets from a symmetric subset of
      ANY finite abelian group, so most of this suite is CURVE-FREE by
      construction. The paired contract measures exactly which invariants
      carry curve content, with a pre-declared consequence.
    - >-
      Replanted defects are NOT the historical defects. D1 is a
      reconstruction from a correction record, not the original code path;
      the reconstruction is published alongside its detection result and no
      claim is made that the historical batch would have been saved.
    - >-
      Adopting the schema into templates/research-records.md is a Coordinator
      decision. Nothing here performs it and no hypothesis status is moved.

