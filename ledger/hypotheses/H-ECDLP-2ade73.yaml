  proposal_id: IDEA-20260904-f7d47d
  title: >
    Relative bucket variance W of the O2 agreement kernel decays
    slower than 1/sqrt(N) (LARGE-W) or faster (SMALL-W) on the
    covered residue and character families
  status: specified
  proposed_by: idea-generator
  designed_by: coordinator
  designed_under_task: TASK-20260907-b92ce2
  specified_by: DEC-20260907-28ff2a
  specified_at: '2026-09-07'
  created: '2026-09-07'
  updated: '2026-09-07'
  depends_on:
    - H-ECDLP-07c7c6
    - KN-FIND-ffe1df
    - EXP-ECDLP-a98ea9
    - DEC-20260907-e00eda
  related_hypotheses:
    - H-ECDLP-07c7c6
    - H-ECDLP-001
    - H-ECDLP-004
  statement: >
    Let E/F_p have prime order N, let h : E(F_p) -> [M] be a cheap
    filter, and for uniform independent P, Q write
    delta = Pr[h(P+Q) = f(h(P), h(Q))],
    pi_c the same rate conditioned on target bucket c, and
    q_c the weight of bucket c. Define the relative bucket variance
    W = Sum_c q_c * (pi_c/delta - 1)^2.
    On the two covered families (x mod M; floor(M x / p) as the
    interval form of the same residue family; and a quadratic-character
    filter when later stages are authorized), W = Theta(N^{-a}) with
    either a < 1/2 (SMALL-W) or a >= 1/2 / non-decaying (LARGE-W).
    SMALL-W licenses a second-moment repair of Lemma 5 of
    IDEA-20260901-b4e6eb; LARGE-W closes that repair and leaves only
    the attacker-favourable reading of Cauchy-Schwarz, which is still
    not an attack. Neither outcome is an attack, a supported claim on
    H-ECDLP-07c7c6, or authorization of Stage 5 of EXP-ECDLP-a98ea9.
  mechanism: >
    Lemma 5 of IDEA-20260901-b4e6eb bounds average delta.
    Cauchy-Schwarz is one-sided: max_c pi_c/delta <= 1 + sqrt(W / min_c q_c),
    so the attacker-relevant quantity is the heaviest bucket, not the
    average. The missing object is W. If W decays faster than 1/sqrt(N)
    the heaviest-bucket excess is o(N^{-1/4}) and a second-moment repair
    of Lemma 5 is live. If W is Theta(1/sqrt(N)) or larger, the repair
    is closed and only the attacker-favourable side of CS remains.
    EXP-ECDLP-a98ea9 Stage 4 (DEC-20260907-e00eda) computed D on 16-19-bit
    primes and held two_branch_official_disposition false; it did not
    measure W. KN-FIND-ffe1df (internal) already showed at the frozen
    fixture p=65539, M=40 that M·delta ≈ 1.002 while M·max_c π_c ≈ 1.084
    (SHA null ≈ 1.082), so the average/max gap is the load-bearing hole.
  predictions:
    - id: P-S0-FIXTURE
      metric: M*delta, M*max_c pi_c, SHA-null M*max_c pi_c
      direction: different
      minimum_effect: >-
        On the frozen fixture (p=65539, a=0, b=11, N=65287, M=40,
        residue family floor(Mx/p) and x mod M) Stage 0 reproduces
        KN-FIND-ffe1df / RT-20260803-be45a8 digits:
        floor(Mx/p) M*delta in [1.001, 1.004], M*max_c pi_c in
        [1.082, 1.086]; SHA-256-truncated-to-M M*max_c pi_c in
        [1.080, 1.084]. W is recorded for covered, SHA, shuffle, and
        dlog-interval arms. Failure is infrastructure, not mathematics.
      claim_tier: observational
    - id: P-SMALL-W
      metric: fitted exponent a in W = C * M^a * p^{-1/2}
      direction: lower
      minimum_effect: fitted a < 1/2 on covered families. Stage 0 does not test this.
      claim_tier: observational
    - id: P-LARGE-W
      metric: fitted exponent a
      direction: higher
      minimum_effect: fitted a >= 1/2 or W not decaying in p. Stage 0 does not test this.
      claim_tier: observational
    - id: P-NULL-DECAY
      metric: SHA and shuffle null W
      direction: lower
      minimum_effect: >-
        Null W decays at least as fast as the covered family. Stage 0
        records fixture values only.
      claim_tier: observational
    - id: P-KNOWN-LARGE
      metric: W for the dlog-interval pullback
      direction: higher
      minimum_effect: >-
        Known-large arm W exceeds SHA/shuffle nulls at the same (p, M).
        Stage 0 records the fixture-scale value only.
      claim_tier: observational
  falsification_criteria:
    - id: F-FIXTURE
      statement: >
        Stage 0 fixture misses the KN-FIND-ffe1df windows.
        Classified failed_infrastructure; no mathematical claim about W.
    - id: F-SMALL-W
      statement: >
        Fitted a >= 1/2 or W non-decaying on covered families after an
        authorized Stage 2 ladder. Closes the second-moment repair;
        does not create an attack.
    - id: F-LARGE-W
      statement: >
        Fitted a < 1/2 on covered families after an authorized Stage 2
        ladder. Keeps the repair live; does not prove Lemma 5 and does
        not support H-ECDLP-07c7c6.
    - id: F-ARTIFACT
      statement: >
        SHA or shuffle null W fails to decay while the covered family
        is read as LARGE-W. The LARGE-W reading is then an artifact.
  test_boundary:
    instances:
      - frozen fixture p=65539 a=0 b=11 N=65287 M=40
    parameters:
      N_max: 65539
      stage0_only_at_specify: true
    implementation: EXP-ECDLP-5cad48 Stage 0 runner
    budget:
      wall_clock_seconds: 600
    prose: >
      Toy scale only. Stage 0 is the single frozen fixture p=65539,
      M=40, residue family, plus SHA and shuffle nulls and a
      dlog-interval pullback arm at that same (p, M). N <= 65539.
      No 20-26-bit claims. No secp256k1 / P-256 / Curve25519 transfer.
      Stages 1-2 of EXP-ECDLP-5cad48 are not authorized by the specify
      decision. Stage 5 of EXP-ECDLP-a98ea9 is not authorized.
      H-ECDLP-07c7c6 remains specified.
  assumptions:
    - id: A1
      statement: >
        The KN-FIND-ffe1df fixture numbers are the reproduction target,
        not a prior on W decay.
      status: explicit
    - id: A2
      statement: >
        Cauchy-Schwarz is one-sided; a large W is not an attack by itself.
      status: explicit
    - id: A3
      statement: >
        Standing user authorization 2026-09-06 covers protocol approval
        once the contract is complete.
      status: explicit
  heuristic_assumptions:
    - id: H1
      formal_statement: >
        On a random prime-order elliptic curve over F_p, for the two
        covered families, the relative bucket variance of the O2
        agreement kernel satisfies W = Theta(N^{-a}) for some a.
        SMALL-W is a < 1/2; LARGE-W is a >= 1/2 or W not decaying in p.
      random_model_justification: >
        If the kernel were a pairwise-independent hash onto M bins, W
        would be Theta(1/n_pairs) sampling noise. A structural kernel
        can put mass on a sparse set of bins and inflate W. No theorem
        forces a. The rigorous half is Theorem A-prime as corrected
        (eps <= 1/M + max_{t != 0}|T_t|) together with Weil-Bombieri
        at the p^{-1/2} scale; a is the surviving frequency count
        after orthogonality collapse and is the measured quantity.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-5cad48
      falsification_condition: >
        Authorized Stage 2 ladder fit with a crossing 1/2 the wrong
        way, or W non-monotone in N after jackknife CIs exclude a
        constant.
    - id: H2
      formal_statement: >
        For all declared filters and M in the grid, min_c q_c >= c_0/M
        for an absolute c_0 > 0 on the sampled ladder.
      random_model_justification: >
        x mod M equidistributes x-coordinates of E(F_p) in F_p to
        within Hasse and character-sum error.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-5cad48
      falsification_condition: >
        Measured min_c q_c = o(1/M) on a covered family. That family
        is then excluded from the fit and reported separately.
  proof_search_map:
    bottleneck: >
      Lemma 5's passage from delta to max_c pi_c. Removing it converts
      the O2 level-1 bound from a statement about an average into a
      statement about the attacker's actual rate.
    baseline_embedding:
      parameter_slice: >
        At W = 0 the bound G <= 1 + sqrt(M*W) returns G <= 1, which is
        Lemma 5's conclusion. At p=65539, M=40 the pipeline must
        reproduce M*delta = 1.002 and M*max_c pi_c = 1.084 and the
        SHA null at 1.082.
      reproduction_check: >
        Frozen Stage 0 fixture. Failure is infrastructure, not a result.
    observation_collision:
      observable: W and the derived bound on G
      distinct_preimage_search: >
        W is not D, not delta, not max_c pi_c, and not a two-branch
        LEAD/CLOSURE cell. A LARGE-W reading is not an attack and is
        not Stage 5 of a98ea9. Two objects can share delta and differ
        in W; CS is one-sided so LARGE W does not exhibit an attack.
    quantifier_order: >
      FOR ALL covered-family filters and FOR ALL M in the declared
      grid, THERE EXIST C and a such that FOR ALL p on the ladder
      W <= C * M^a * p^{-1/2}. Stage 0 tests none of this; it only
      reproduces the fixture.
    method_ceiling:
      strongest_certifiable_claim: >
        Level-1, covered-family, toy-scale measurement of W and G at
        the tested primes. Never levels >= 2, never cryptographic
        scale, never a theorem from a fitted a.
      nearby_object_control: >
        SHA-256 truncated to M; matched-marginal shuffle; dlog-interval
        pullback (known-large; any argument bounding its G by 1+o(1)
        proves too much).
    proof_obligations:
      - claim: 'max_c pi_c/delta <= 1 + sqrt(W / min_c q_c)'
        responsibility: correctness
      - claim: 'G = M * max_c pi_c and M*delta = 1 + o(1) for covered families'
        responsibility: baseline
    not_applicable_reason: null
