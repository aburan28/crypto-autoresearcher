  proposal_id: IDEA-20260905-4dca34
  title: >
    F = x^2/A on a unique n-torsion section is invariant under
    admissible short-Weierstrass unit scalings; first-lift-digit
    comparison to certified noncanonical lifts is a later stage
  status: specified
  proposed_by: idea-generator
  designed_by: coordinator
  designed_under_task: TASK-20260908-25fceb
  specified_by: DEC-20260908-36385f
  specified_at: '2026-09-08'
  created: '2026-09-08'
  updated: '2026-09-08'
  depends_on:
    - IDEA-20260905-4dca34
    - DEC-20260908-495d43
    - KN-OPEN-3417fc
    - KN-FIND-1ba0fe
  related_hypotheses:
    - H-ECDLP-77caa5
    - H-ECDLP-07c7c6
    - H-ECDLP-2ade73
  statement: >
    Fix an ordinary short-Weierstrass model y^2 = x^3 + A x + B over
    Z/p^2 Z with p > 3, A a unit, and a frozen odd-order subgroup of
    order n > 3 coprime to p. Let F = x^2 / A on the unique n-torsion
    section of each non-identity residue point, using representatives
    0..p^2-1. Stage 0 asserts only the scaling law: for every unit u
    in (Z/p^2 Z)^*, the admissible change (A,B,x,y) ->
    (u^4 A, u^6 B, u^2 x, u^3 y) leaves F unchanged in Z/p^2 Z.
    A later unauthorized stage may compare the first lift digit
    d(F) = (F - lift(F mod p))/p mod p between a certified canonical
    lift and certified noncanonical coefficient perturbations.
    Neither reading is a canonicality detector, a scalar coordinate,
    or an ECDLP advantage.
  mechanism: >
    Admissible short-Weierstrass unit scaling multiplies x by u^2 and
    A by u^4, so the ratio x^2/A is unchanged in any ring where A and
    u are units. Unique n-torsion lifting for n coprime to p is Hensel
    on [n]P = O and does not by itself classify the first-order
    response of F. Stage 0 tests the ring identity on a frozen tiny
    ordinary panel before any canonical-versus-arbitrary comparison.
    This is a control for the lift conventions used by charged-advice
    C3 (H-ECDLP-77caa5), not a continuation of EXP-ECDLP-420e73.
  predictions:
    - id: P-S0-SCALING
      metric: number of changed F values under two frozen unit scalings
      direction: lower
      minimum_effect: >
        Predicted count zero on the frozen four-curve panel, every
        non-identity n-torsion section, both scalings, in Z/p^2.
        One certified mismatch is either a setup error or a
        falsification of the stated invariance.
      claim_tier: observational
    - id: P-S1-DIGIT
      metric: first-lift-digit differences versus certified noncanonical lifts
      direction: different
      minimum_effect: >
        Stage 1+, unauthorized here. Predicted at least one difference
        on a later frozen panel. Stage 0 does not inspect those digits.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-SCALING
      statement: >
        A certified mismatch of F under a frozen unit scaling on the
        Stage 0 panel, after A and u are units and the point is a
        non-identity n-torsion section. If the mismatch is a
        representative or Hensel bug, classify failed_infrastructure.
    - id: F-S1-INSENSITIVE
      statement: >
        After an authorized later stage, the frozen panel has zero
        first-digit differences from every certified noncanonical
        perturbation. That falsifies only that panel's sensitivity
        prediction, not canonical-lift methods generally.
  test_boundary:
    instances:
      - frozen Stage 0 four-curve ordinary panel, 13 <= p <= 37
    parameters:
      precision: 2
      n_scalings: 2
      stage0_only_at_specify: true
    implementation: EXP-ECDLP-6a97f4 Stage 0 runner
    budget:
      wall_clock_seconds: 120
    prose: >
      Toy scale. Stage 0 is a scaling-invariance instrument on four
      synthetic ordinary residue curves. It is not a Serre-Tate
      canonical-lift certification, not a digit audit, not an H1
      measurement, and not Stage 17 of EXP-ECDLP-420e73. No
      20-26-bit claims. No secp256k1 / P-256 / Curve25519 transfer.
      Stage 5 of EXP-ECDLP-a98ea9 is not authorized. H-ECDLP-77caa5,
      H-ECDLP-07c7c6, and H-ECDLP-2ade73 remain specified. W is not
      classified.
  assumptions:
    - id: A1
      statement: >
        Coefficient lift of (A,B) in 0..p-1 to Z/p^2 is the Stage 0
        working model. It is not certified as the Serre-Tate
        canonical lift. Canonicality certification is a Stage 1+
        obligation. If a later stage cannot certify canonicality,
        that comparison is inconclusive, not a positive.
      status: explicit
    - id: A2
      statement: >
        Unique n-torsion sections exist because n is coprime to p.
        Identity and even-order points are excluded by n odd.
      status: explicit
    - id: A3
      statement: >
        Standing user authorization 2026-09-06 covers protocol
        approval once the contract is complete.
      status: explicit
  heuristic_assumptions: []
  proof_search_map:
    bottleneck: >
      Separate the scaling-invariant ring identity for F from
      canonicality of the lift and from any scalar-recovery reading.
    baseline_embedding:
      parameter_slice: >
        One ordinary residue curve, prime-to-p odd n, precision r=2,
        two frozen unit scalings.
      reproduction_check: >
        Symbolic identity F(u^2 x, u^4 A) = F(x, A) in any ring
        where A and u are units, then exact Z/p^2 evaluation on
        the frozen panel.
    observation_collision:
      observable: F = x^2/A in Z/p^2 and, later, d(F)
      distinct_preimage_search: >
        An admissible scaling must give the same F. A noncanonical
        lift may give the same F; collisions delimit what F can
        certify. Stage 0 does not inspect those collisions.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >
          Coordinate-change equivalence class of F on n-torsion
          sections.
        predicted_gain: >
          Possible removal of model artifacts. Zero claimed solver
          improvement.
    quantifier_order: >
      Freeze the panel, precision, scalings, and observable before
      evaluating F. Any existential counterexample is confined to
      that frozen class.
    method_ceiling:
      strongest_certifiable_claim: >
        Invariance or noninvariance of F under the declared scalings
        on the frozen panel. Never a canonicality detector. Never
        an ECDLP exponent.
      nearby_object_control: >
        Coefficient lift plus two unit scalings. Canonical versus
        arbitrary lifts are a later nearby-object family, not Stage 0.
    proof_obligations:
      - claim: scaling identity for F holds in any ring with A,u units
        responsibility: baseline
      - claim: n-torsion sections exist and are unique for n coprime to p
        responsibility: feasibility
      - claim: a mismatch is confined to the frozen panel and observable
        responsibility: scope
      - claim: no scalar recovery and no EXP-ECDLP-420e73 Stage 17
        responsibility: interface
    not_applicable_reason: null
  novelty_status: unverified
  novelty_claim: >
    Structural control of one Weierstrass ratio under declared
    model equivalence. Not a new attack. Novelty is unverified.
    KN-FIND-1ba0fe and KN-OPEN-3417fc are internal pointers read
