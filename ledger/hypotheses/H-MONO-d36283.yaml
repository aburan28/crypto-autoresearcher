hypothesis:
  id: H-MONO-d36283
  question_id: RQ-MONO-001
  derived_from_idea: IDEA-20260805-a9a95d
  status: proposed
  added: '2026-08-25'

  duplication_note: >-
    RECORDED BEFORE ANYTHING ELSE, BECAUSE A READER MUST SEE IT FIRST. A paired
    hypothesis and contract for the SAME parent proposal IDEA-20260805-a9a95d already
    exist in the ledger as H-MONO-663fb4 and EXP-MONO-c819ba, both review_required. This
    record was drafted under identifiers assigned by the dispatching session, which is
    the only reason it exists separately; the coordinator subagent that wrote it mints
    no identifiers and did not choose to duplicate. A COORDINATOR MUST ADJUDICATE BEFORE
    EITHER PAIR IS APPROVED - one supersedes the other under a decision record, or one
    is withdrawn. Approving both would put two contracts on one proposal, which is a
    bookkeeping failure, not a replication design.

  statement: >-
    SCOPE. Prime fields F_p with p up to about 3000; G = E(F_p) as a finite abelian
    group of order N (abelianness is all that is used, so non-cyclic E(F_p) is covered);
    factor bases FB that are SYMMETRIC subsets (FB = -FB); arity m in {1, 2, 3, 4};
    targets R ranging over ALL of G by exhaustive computation. CLAIM TIER toy for every
    measurement, DERIVATION tier for the identity and the bound. NO ATTACK, NO EXPONENT,
    NO CRYPTO-SCALE TRANSFER.

    THE HYPOTHESIS, IN FOUR PARTS.
    (M1) THE IDENTITY, EXACT. With Shat(chi) = sum_{P in FB} chi(P) and
      N_m(R) = #{(P_1,...,P_m) in FB^m : P_1 + ... + P_m = R}:
        mean_R N_m(R) = F^m / N                                       [exact]
        Var_R N_m(R) = (1/N^2) sum_{chi != 1} |Shat(chi)|^{2m}        [exact]
      with no error term and no asymptotics. At m = 1 both sides reduce to F(N-F)/N^2
      for EVERY set of size F, which is a self-check that cannot be fitted.
    (M2) THE BOUND. With C = max_{chi != 1} |Shat(chi)|,
      max_R |N_m(R)/(F^m/N) - 1| <= (C/F)^{m-2} (N/F) for m >= 2, by Parseval.
    (M3) THE RELOCATION, WHICH IS THE CONTRIBUTION. The relation-rate half of
      KN-OPEN-009 is governed by the normalized character bias C/F of the FACTOR BASE
      as a subset of the group, and by nothing about the Galois group of the summation
      cover. Consequently the MEAN is geometry-independent and can never exhibit an
      exceptional locus, so the question lives in the SECOND moment; and the
      exceptional-locus hunt belongs over factor-base constructions, not over curve
      families.
    (M4) THE MEASURED PREDICTION, WHICH CAN FAIL IN BOTH DIRECTIONS. The real
      x-coordinate factor base behaves like a matched random symmetric subset of the
      same size: Var_real/Var_null in [0.7, 1.4] at m = 3 and 4, and
      (C/F)_real/(C/F)_null in [0.85, 1.15], at every tested cell.

    THE RECORD PREDICTS ITS OWN NULL AND SAYS SO. A ratio above the band is the
    exceptional locus KN-OPEN-009 asks for, found in the correct argument slot; a ratio
    below it means the factor base is MORE uniform than random, which is also a finding.

  mechanism: >-
    DERIVED IN-REPO; no source read, none cited, and none needed since the derivation is
    self-checking at m = 1.
    (1) INVERSION. N_m is the m-fold convolution of the indicator 1_FB with itself, and
    convolution is pointwise multiplication on the Fourier side of a finite abelian
    group, so N_m(R) = (1/N) sum_chi Shat(chi)^m conj(chi(R)). Splitting off chi = 1,
    where Shat(1) = F, gives the mean F^m/N and the exact error expansion.
    (2) VARIANCE. Orthogonality applied to the mean-subtracted expansion gives (M1)'s
    second line with NO error term. The m = 1 case is a complete self-check: N_1 = 1_FB
    has variance F/N - (F/N)^2 = F(N-F)/N^2, and the character side is (1/N^2)(NF - F^2)
    by Parseval. They agree identically for EVERY set, which is exactly why m = 1 is
    declared in advance to be NON-DISCRIMINATING and can never be reported as a null
    result.
    (3) THE BOUND follows by pulling out C^{m-2} and applying Parseval to what remains.
    (4) WHY THIS IS THE RELATION RATE AND NOT A PROXY. A prime-field index-calculus
    relation IS a decomposition of a target into m factor-base elements, so N_m(R) is
    the ordered count of relations at R. The multiset count differs by a reordering
    convention, and that convention is precisely where this corpus already suspects a
    double count, so BOTH conventions are reported at every cell rather than one.
    (5) THE SUBGROUP EXTREME IS THE POSITIVE CONTROL AND IT IS EXACT. If FB is a
    subgroup H of order h, then Shat is h on the N/h characters trivial on H and 0
    elsewhere, so N_m(R) = h^{m-1} on H and 0 off it: relative deviation EXACTLY
    N/h - 1, and C/F = 1. This is a factor base with an exceptional relation rate, it
    exists on every curve with a proper subgroup, and any instrument that cannot see it
    is broken.
    (6) THE CROSS-GOAL COLLISION, STATED AS A LINK AND NOT A RESULT. C has the same
    shape as the character sum about which this corpus carries several mutually
    inconsistent recorded values and an unreconciled dispute over whether the maximum is
    O(1) or grows with p. NONE OF THOSE RECORDS IS READ HERE; they are candidates to
    check, never authority, and reading them is a stage of the contract rather than an
    assumption of this record. The structural point does not depend on which value is
    right: if the relation-rate half of KN-OPEN-009 reduces to C, then two goals have
    been asking one question in two vocabularies.

  assumptions:
    - >-
      FB IS SYMMETRIC. Shat(chi) is real when FB = -FB. A factor base defined by
      x-coordinates IS symmetric; one defined by a choice of sign per point is not, and
      several statements change. The convention is fixed and recorded per cell.
    - >-
      E(F_p) NEED NOT BE CYCLIC. The derivation uses only abelianness, but an
      implementation that hard-codes a cyclic discrete log to index characters is
      silently wrong on curves with full 2-torsion, and the pinned panels include such
      curves.
    - >-
      Var_R is over ALL R in G. At toy scale the exhaustive computation is affordable
      and is required; a sampled estimate carries its own error and would need it
      reported.
    - >-
      Toy scale. The IDENTITY is scale-free and may be cited as a derivation; the
      MEASURED bias is toy and no measured C may be extrapolated.

  proof_search_map_ref: >-
    The four inventor-protocol section 8 audits for this proof-oriented proposal are
    carried in the proof_search_map below rather than by reference, so this record is
    self-contained; the parent proposal points at a sibling hypothesis for them and that
    sibling is named in duplication_note.

  proof_search_map:
    bottleneck: >-
      Whether the ordered decomposition count N_m is the quantity index-calculus
      relation search actually collects, up to a convention factor depending only on m.
      Every consequence of the identity for KN-OPEN-009 is downstream of that
      identification, and it is a definitional question that a stage of reading settles,
      not a computation.
    baseline_embedding:
      parameter_slice: >-
        m = 1 is the slice where both sides of the identity reduce to F(N-F)/N^2 for
        every set of size F, independently of the group and the set. The claimed family
        therefore contains an exactly known answer as a slice.
      reproduction_check: >-
        Exact-arithmetic residual at m = 1 on EVERY tested (curve, factor base) cell,
        required to be 0 in exact arithmetic. This is a forced value that cannot be
        fitted, and a nonzero residual voids the cell rather than being reported.
    observation_collision:
      observable: 'the scalar Var_R N_m(R), and the derived ratio Var_real/Var_null'
      distinct_preimage_search: >-
        THE PROJECTION IS MASSIVELY MANY-TO-ONE AND THAT IS DECLARED RATHER THAN
        DISCOVERED. Translating FB by a group element, or applying an automorphism,
        leaves the unsigned spectrum |Shat| invariant, so the fibre over an observed
        spectrum contains at least the whole translate/automorphism orbit and generically
        far more. THE SEPARATING CONDITION: the tracked object is the MODULI |Shat| and
        the scalar Var, NOT the transform with phases - the full spectrum with phases
        would be equivalent to the set by Fourier inversion and tracking it would be a
        mere change of coordinates. Declaring the moduli as the object is what keeps this
        from being a relabelling.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace a Galois/monodromy statistic on the summation cover with a
          subset-uniformity statistic on the factor base, computed as the m-th power of a
          one-step spectrum because the character transform turns the decomposition
          convolution into pointwise multiplication.
        predicted_gain: >-
          A statistic that is provably non-constant on the sublocus where the incumbent
          census is provably constant, with a closed form and an exact positive control.
          No attack and no exponent.
      - transform: observable_fiber
        proposed_object: >-
          Hold the statistic fixed and vary the factor base across subgroup,
          coset-union, real x-coordinate base and matched random set, exhibiting a
          computed spread before any run.
        predicted_gain: >-
          Comparator spread established in advance by two sets of equal size with
          provably different values, which the incumbent instrument cannot exhibit at all.
    quantifier_order: >-
      CLAIMED. FOR ALL finite abelian G and ALL symmetric FB subset G and ALL m >= 1,
      the identity of (M1) holds exactly - this is proved, not measured. FOR the pinned
      curve panel and factor-base families at the declared p, the MEASURED ratios lie in
      the declared bands. NOT CLAIMED: any statement about C at cryptographic scale, and
      any statement that the measured band persists as p grows. Consequence (M3)'s
      barrier reading for the full x-coordinate base is CONDITIONAL on HEUR-CHR-2 and is
      worthless without it, which is why HEUR-CHR-2 is numbered and paired with a
      measurement.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On the pinned curve panel at p up to about 3000, for symmetric factor bases in
        the declared families, the exact identity holds to exact arithmetic, the subgroup
        positive control returns exactly N/h - 1, and the real x-coordinate base's
        variance and character bias sit at the reported ratios against a matched random
        symmetric subset." It certifies nothing at cryptographic scale, nothing about
        the linear-algebra stage, nothing about any cost, and it does not close
        KN-OPEN-009 - it relocates the relation-rate half of it.
      nearby_object_control: >-
        The matched random symmetric subset of identical size on the SAME curve with the
        SAME m and the SAME target set, which is the closest object on which the
        exceptional-locus conclusion must fail. Reporting raw statistics instead of
        ratios against it would hide exactly this.
    proof_obligations:
      - claim: The exact identity holds at m = 1 with residual 0 for every set.
        responsibility: correctness
      - claim: The exact identity holds at m = 2, 3, 4 within the declared numerical tolerance.
        responsibility: correctness
      - claim: The subgroup control returns relative deviation exactly N/h - 1 and C/F = 1.
        responsibility: baseline
      - claim: The graded F-ladder decays as F increases, as the bound requires.
        responsibility: strictness
      - claim: Ordered and multiset conventions are both reported and their ratio matches the combinatorial prediction.
        responsibility: interface
      - claim: Every relayed cross-goal claim is checked against the record it came from before any compute.
        responsibility: scope

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Explicitly null. No exponent moves. The relative deviation bound multiplies the
    expected trials per relation, so it is a constant-factor statement unless C/F is
    bounded away from 0 - in which case it becomes a statement about which factor-base
    constructions are usable at all, which is still not an exponent.

  heuristic_assumptions:
    - id: HEUR-CHR-1
      formal_statement: >-
        NONE LOAD-BEARING FOR THE IDENTITY OR THE BOUND. Both are exact consequences of
        Fourier inversion, orthogonality and Parseval on a finite abelian group. This
        entry exists to record that the headline is unconditional rather than to assume
        anything.
      random_model_justification: 'Not applicable: nothing is modelled as random here.'
      supporting_results: []
      validation_experiment_ids: [EXP-MONO-ccc068]
      falsification_condition: >-
        The identity failing at any m in exact arithmetic. The derivation is then wrong
        and this record is withdrawn by a superseding record, never repaired in place.
    - id: HEUR-CHR-2
      formal_statement: >-
        C = max_{chi != 1} |Shat(chi)| = O(sqrt(N) log N) for the full x-coordinate
        factor base of a generic ordinary curve - that is, square-root cancellation
        holds.
      random_model_justification: >-
        The heuristic that a structureless subset's character sums cancel like those of a
        random set of the same size. NOT PROVED HERE AND EXPLICITLY NOT ASSERTED:
        consequence (M3)'s barrier reading is stated CONDITIONALLY on it and is worthless
        without it. This corpus itself carries mutually inconsistent recorded values for
        the analogous quantity and an unreconciled dispute over its growth, all of them
        unread here.
      supporting_results: []
      validation_experiment_ids: [EXP-MONO-ccc068]
      falsification_condition: >-
        Measured C/sqrt(F) trending upward in p across the tested panel rather than
        staying bounded. The barrier reading is then withdrawn and the corpus dispute is
        reported rather than resolved.
    - id: HEUR-CHR-3
      formal_statement: >-
        The ordered count N_m(R) is the quantity index-calculus relation search collects,
        up to a convention factor depending only on m.
      random_model_justification: >-
        Not distributional. A relation IS a decomposition into m factor-base elements and
        the ordered/multiset distinction is a labelling convention - but it is exactly
        where this corpus already suspects a double count, so it is not treated as
        harmless.
      supporting_results: []
      validation_experiment_ids: [EXP-MONO-ccc068]
      falsification_condition: >-
        The measured ratio of ordered to multiset counts departing from the combinatorial
        prediction at any cell.

  predictions:
    - metric: exact-identity residual at m = 1, per (curve, factor base) cell
      direction: lower
      minimum_effect: >-
        0 EXACTLY in exact arithmetic, or below 1e-12 relative if floating-point
        characters are used. Forced for every set of size F, so a nonzero residual is an
        implementation defect and voids the cell. It is the calibration, not the finding.
    - metric: exact-identity residual at m = 2, 3, 4, relative
      direction: lower
      minimum_effect: Below 1e-10 relative. Forced by the derivation; a failure halts the record.
    - metric: >-
        (C/F)_real over (C/F)_null for the x-coordinate factor base against at least 30
        matched random symmetric subsets of the same size
      direction: same
      minimum_effect: >-
        1.00 plus or minus 0.15. Above 1.5 is the exceptional-locus signal; below 0.7
        means the base is MORE uniform than random. Two-sided by construction.
    - metric: Var_real over Var_null at m = 3 and m = 4 on the same cells
      direction: same
      minimum_effect: >-
        Within [0.7, 1.4]. This is the direct relation-rate deviation test and is the
        primary discriminating metric.
    - metric: subgroup positive control, max_R |N_m(R)/(F^m/N) - 1| for FB a subgroup of order h
      direction: higher
      minimum_effect: >-
        EXACTLY N/h - 1, derived before the run. If the instrument returns anything else
        it cannot see an exceptional factor base and NO NEGATIVE MAY BE REPORTED from any
        other arm.
    - metric: >-
        curve-panel spread of (C/F)_real across random ordinary, CM, j = 0 and j = 1728
        at fixed p and fixed F
      direction: lower
      minimum_effect: >-
        Coefficient of variation below 0.10. A CM or j = 0 curve standing beyond 3 sigma
        of the random-ordinary panel is the exceptional locus, relocated to the statistic
        that can see it.
    - metric: >-
        graded F-ladder, relative deviation as F rises over {N/16, N/8, N/4, N/2}
      direction: lower
      minimum_effect: >-
        Monotone decay. A statistic that does not decay when the parameter meant to
        destroy it increases is the canonical artifact tell and voids the reduction.

  test_boundary:
    instances: >-
      A pinned curve panel at each p - one random ordinary curve, one CM curve, one
      j = 0 curve and one j = 1728 curve - with factor-base families: the real
      x-coordinate base, at least 30 matched random symmetric subsets of identical size,
      a proper subgroup, and a union of two subgroup cosets.
    parameters:
      p_range: 'toy primes up to about 3000, at least four values so a trend in p is visible'
      m: [1, 2, 3, 4]
      factor_base_sizes: [N/16, N/8, N/4, N/2]
      null_draws: 30
      target_set: 'all R in G, exhaustively'
      conventions: 'ordered AND multiset counts reported at every cell'
    implementation: >-
      Python 3.11 with numpy; exhaustive convolution over E(F_p) as the primary
      computation, in exact integer arithmetic, so no floating point is required for the
      primary metric; the character side computed in floating point only as a cross-check
      with a declared tolerance; character indexing via the group's actual structure, not
      a hard-coded cyclic discrete log.
    budget:
      wall_clock_seconds: 3600
      total_cpu_hours: 3.0
      memory_gb: 8
      maximum_runs: 30

  distinguishable_outcomes:
    - outcome: 'IDENTITY FAILS. Nonzero residual at any m in exact arithmetic.'
      what_observing_it_would_mean: >-
        (M1) is false as derived, or the implementation is wrong. The whole record halts
        and is withdrawn by a superseding record rather than repaired. Cheap, immediate
        and decisive.
    - outcome: >-
        POSITIVE CONTROL FAILS. The subgroup arm does not return relative deviation
        exactly N/h - 1 and C/F = 1.
      what_observing_it_would_mean: >-
        The instrument cannot detect an exceptional factor base that provably exists.
        NO NEGATIVE MAY BE REPORTED FROM ANY OTHER ARM. The deliverable is the
        instrument defect.
    - outcome: >-
        NULL CONFIRMED. All controls pass, Var_real/Var_null in [0.7, 1.4] and
        (C/F) ratio in [0.85, 1.15] at every cell, and the F-ladder decays.
      what_observing_it_would_mean: >-
        (M4) holds. The real x-coordinate factor base is indistinguishable from a matched
        random symmetric subset on this statistic at toy scale. This is a CONTROLLED NULL
        on the correct statistic - the record predicts it - and it is a deliverable
        because the corpus's own alternative is a census that is provably constant on
        this sublocus. It closes nothing and it does not transfer to cryptographic scale.
    - outcome: >-
        DEVIATION FOUND. Var_real/Var_null outside [0.7, 1.4] at m = 3 or 4 with all
        controls passing.
      what_observing_it_would_mean: >-
        (M4) is FALSIFIED and this is the positive outcome the goal was created to find:
        a relation-rate deviation located in the correct argument slot, the factor base.
        It is listed as a falsification condition deliberately, because the record
        predicts no deviation. It is NOT an attack - converting it to a cost claim would
        require charging relation collection AND the linear-algebra stage, which nothing
        here does.
    - outcome: >-
        EXCEPTIONAL CURVE. A CM or j = 0 curve's (C/F)_real stands beyond 3 sigma of the
        random-ordinary panel at fixed p and F.
      what_observing_it_would_mean: >-
        The exceptional locus KN-OPEN-009 hypothesizes, found on a curve rather than a
        base. Given the corpus's own unreconciled dispute about the analogous constant,
        this requires independent replication before any status change.
    - outcome: 'LADDER DOES NOT DECAY while the controls pass.'
      what_observing_it_would_mean: >-
        The measured quantity is not the one the bound governs, and the whole reduction
        (M3) is suspect. No relation-rate conclusion may be drawn from any arm.
    - outcome: >-
        STAGE-1 READING OVERTURNS A RELAYED CLAIM - for instance the conservation mean is
        not the ordered mean F^m/N under any convention.
      what_observing_it_would_mean: >-
        HEUR-CHR-3 and step (4) of the mechanism are wrong and the identification of N_m
        with the relation rate must be redone. This is a zero-compute outcome that can
        change the record's status by itself, which is why the reading stage runs first.
    - outcome: 'INFRASTRUCTURE. The exhaustive convolution exceeds budget at the larger p.'
      what_observing_it_would_mean: >-
        NOTHING ABOUT THE STATISTIC (AGENTS.md rule 5). failed_infrastructure; the panel
        is truncated to the reached p and the trend claim is weakened accordingly and
        reported as weakened.

  falsification_conditions:
    - The exact identity failing at any m in exact arithmetic.
    - The subgroup positive control not returning exactly N/h - 1.
    - >-
      Var_real/Var_null outside [0.7, 1.4] at m = 3 or 4 with all controls passing, which
      falsifies the pre-registered no-deviation prediction and is the positive outcome.
    - The graded F-ladder failing to decay while the controls pass.
    - >-
      A Stage-1 reading finding that a relayed cross-goal claim is misdescribed here, in
      particular the identification of the conservation mean with the ordered mean.
    - Measured C/sqrt(F) trending upward in p, which falsifies HEUR-CHR-2.

  interpretation_limits:
    - >-
      CLAIM TIER toy for every measurement. The identity and the bound are DERIVATIONS
      and must be cited as derivations, never as measurements.
    - >-
      NO EXPONENT MOVES IN EITHER DIRECTION BY THE EXPECTED OUTCOME. If the no-deviation
      prediction holds, the result is a barrier-shaped statement about one factor-base
      family at toy scale. Pollard rho remains the baseline.
    - >-
      A LARGE MEASURED C/F WOULD NOT BE AN ATTACK. It is one term in a cost model, and
      converting it into a cost claim requires charging the linear-algebra stage, which
      this record does not do.
    - >-
      THIS DOES NOT CLOSE KN-OPEN-009. It relocates the relation-rate half to a
      better-posed quantity and gives it a measurable statistic. The imprimitivity half
      belongs to a different record.
    - >-
      NO STATUS CHANGE to any record, goal, finding or open problem is proposed or
      implied. Any correction arising from the reading stage SUPERSEDES under a new id
      and never edits.

