  goal_id: GOAL-ECDLP-001
  source_proposal: IDEA-20260808-bba3dc
  proposal_id: IDEA-20260808-bba3dc
  title: >
    Stage 0 closed-form torsion-order
    escape identities — generic k(M)=M
    versus (log2 p)^2 — before any curve
    is chosen
  status: specified
  proposed_by: idea-generator
  designed_by: coordinator
  designed_under_task: TASK-20260913-c9f84b
  specified_by: DEC-20260913-8070bf
  specified_at: '2026-09-13'
  created: '2026-09-13'
  updated: '2026-09-13'
  depends_on:
    - IDEA-20260808-bba3dc
    - RQ-ECDLP-002
  related_hypotheses: []
  statement: >
    Fix the closed-form torsion-order
    escape identities of
    IDEA-20260808-bba3dc before any
    ordinary curve is constructed, any
    M-torsion basis is computed, or any
    discrete logarithm is solved. Stage
    0 asserts only that under the
    generic assignment k(M)=M, with
    p_bits=20 and T=(log2 p)^2=400, M=13
    is an escape and M=401 is not. A
    nearby claim that ordinary k(M)=1
    for every M is rejected. A dummy
    constant k=1 is rejected as an order
    table. This is not a Kani attack and
    not a rho beat. Stages 1+ stay
    unauthorized.
  mechanism: >
    IDEA-20260808-bba3dc tracks
    k(M)=ord(pi mod M) as the extension
    degree of a full M-torsion basis on
    ordinary E/F_p. Stage 0 freezes the
    generic comparison k(M)=M versus
    T=(log2 p)^2 so a later enumeration
    cannot move the escape gate. No
    curve. No isogeny. No Semaev S_m. No
    Coppersmith. No DLP solve.
  predictions:
    - id: P-S0-TORORD
      metric: closed-form identities on the frozen REAL / KF / NULL panel
      direction: different
      minimum_effect: >
        After fixture_pass, REAL reports
        T=400, M=13 escapes, M=401 does not.
        KF ordinary-k-always-1 is rejected.
        NULL constant-k=1 is rejected.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KF
      statement: >
        After fixture_pass, the KF
        claim is accepted. An encoding
        bug is failed_infrastructure.
    - id: F-S0-REAL
      statement: >
        After fixture_pass, REAL misses
        a frozen identity. That
        falsifies only P-S0-TORORD
        at the frozen arithmetic.
  test_boundary:
    instances:
      - frozen Stage 0 REAL / KF / NULL arithmetic panel
    parameters:
      real_grid:
        p_bits: 20
        T: 400
        M_escape: 13
        M_blocked: 401
        generic_k_of_M: M
        must_T_eq_400: true
        must_M13_escape: true
        must_M401_blocked: true
      known_false:
        kind: ordinary_k_always_one
        must_reject: true
      matched_null:
        kind: constant_k_one
        must_reject: true
      stage0_only_at_specify: true
    implementation: EXP-ECDLP-3ed5dd Stage 0 runner
    budget:
      wall_clock_seconds: 120
    prose: >
      Toy / closed-form arithmetic
      only. No curve construction.
      No Semaev S_m evaluation. No
      Coppersmith. No DLP. No rho
      beat. The frozen numbers are
      the proposal's own identities,
      not a fitted result.
  assumptions:
    - id: A1
      statement: >
        Stage 0 evaluates only the
        frozen closed-form identities.
        It does not execute an attack
        and does not solve a DLP.
      status: explicit
    - id: A2
      statement: >
        Standing user authorization
        2026-09-06 covers protocol
        approval once the contract is
        complete.
      status: explicit
  heuristic_assumptions: []
  proof_search_map:
    bottleneck: >
      Whether M=13<=400 and M=401>400
      under generic k(M)=M.
    baseline_embedding:
      parameter_slice: >
        The REAL grid, the KF claim,
        and the NULL dummy. Disclosed
        tightening: arithmetic
        calibrator only, not later
        stages of the proposal.
      reproduction_check: >
        REAL identities hold. KF
        rejected. NULL rejected.
    observation_collision:
      observable: generic order k(M)=M versus the polynomial threshold (log2 p)^2
      distinct_preimage_search: >
        Hold T=400 and claim k=1 always
        (KF). Hold the method and drop
        M-dependence (NULL).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Frozen Stage 0 identity table.
        predicted_gain: >
          Exact known-false reject on
          KF. Zero claimed attack
          improvement.
    quantifier_order: >
      Freeze the formula and grid
      before reading the table.
      Existential equality at one
      grid does not imply an attack.
    method_ceiling:
      strongest_certifiable_claim: >
        Instrument reproduction on
        the declared frozen
        arithmetic. Never an attack.
        Never a DLP solve. Never a
        rho beat. Never an ECDLP
        exponent.
      nearby_object_control: >
        NULL is a constant k=1. An argument
        that still calls it an order table
        is proves-too-much.
  knowledge_promotion:
    promoted: []
    not_warranted: Stage 0 design only. Nothing to promote.
  scientific_boundary: >
    Stage 0 P-S0-TORORD only. Not a
    Kani/Clapoti/PEGASIS run. Not an
    M-torsion basis. Not Semaev S_m. Not
    Coppersmith. Not a DLP solve. Not a
    rho beat. No Stage 1 of
