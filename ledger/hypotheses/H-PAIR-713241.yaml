hypothesis:
  id: H-PAIR-713241
  question_id: RQ-PAIR-21313f
  derived_from_idea: IDEA-20260807-30868b
  added: '2026-08-25'
  statement: >-
    For an ordinary elliptic curve E over a prime field F_p (p > 3) whose group
    order M = p + 1 - t is exactly divisible by an odd prime N distinct from p,
    and for G the subgroup of order N, the following three booleans are
    EQUIVALENT and agree curve for curve with no exception: (i) N divides
    disc(End(E)); (ii) the embedding degree k = ord_N(p) equals 1, equivalently
    p is congruent to 1 modulo N; (iii) the reduced Tate self-pairing t(P, P)
    is non-trivial for some (equivalently every) generator P of G. Consequently
    no self-pairing in the Weil, Tate, or Castryck-Houben-Merz oriented families
    is non-trivial on the cryptographic subgroup unless k = 1, and in the k = 1
    case the non-trivial self-pairing IS the classical Frey-Ruck pairing landing
    in F_p, so the "computable from one point" route and the classical MOV /
    Frey-Ruck transfer coincide exactly on their common domain.
  mechanism: >-
    Two logically independent arguments force the same boundary, and their
    agreement is the internal check. ARGUMENT B (discriminant route). The
    Castryck-Houben-Merz constraint states that a non-trivial self-pairing with
    cyclic domain, compatible with isogenies of O-oriented curves, has order m
    dividing Delta_O. Non-triviality on G forces m = N, hence N divides Delta_O,
    which divides disc(Z[pi]) = t^2 - 4p. The elementary identity
    t^2 - 4p = (t - 2)^2 - 4M with N dividing M reduces to N dividing (t - 2)^2;
    N prime gives N dividing (t - 2), so t is congruent to 2 mod N, so
    p = M + t - 1 is congruent to 1 mod N, i.e. k = 1. The converse is the same
    computation read backwards. ARGUMENT C (Galois route, independent of B).
    The Tate-Lichtenbaum pairing is Galois equivariant: t(pi(P), pi(Q)) =
    t(P, Q)^p. Points of G lie in ker(pi - 1), so t(P, Q) = t(P, Q)^p, hence
    t(P, Q) lies in mu_N intersect F_p. If k > 1 then N does not divide p - 1,
    that intersection is trivial, and the Tate pairing restricted to G x G is
    identically 1, self-pairings included. If k = 1 then mu_N is contained in
    F_p, Frey-Ruck non-degeneracy holds over the base field, and with M exactly
    divisible by N both E(F_p)[N] and E(F_p)/N E(F_p) are cyclic of order N
    generated by the class of P, so non-degeneracy forces t(P, P) to be a
    primitive N-th root of unity. The mechanism is therefore a projection of the
    whole pairing to a single integer m (a divisor of Delta_O) compared against
    N; the projection is strongly lossy but propagates deterministically under
    oriented isogenies, which is why it survives the operation set.
  assumptions:
    - >-
      [open, Stage-0 blocking] The Castryck-Houben-Merz constraint m | Delta_O,
      as transcribed in KN-LIT-7489, matches the primary text and applies to a
      cyclic subgroup of an ORDINARY curve over a prime field oriented by its
      own endomorphism ring. KN-LIT-7489 is a bulk-seeded abstract relay and
      KN-OPEN-3f7a21 records that citation_verified markings in this corpus are
      unreliable. Argument B is void without this verification; argument C does
      not depend on it, which is why two arguments are carried.
    - >-
      [textbook, not transcribed in this repository] Galois equivariance of the
      Tate-Lichtenbaum pairing and Frey-Ruck non-degeneracy when mu_N is
      contained in the base field. A KN-LIT transcription is owed and is not
      asserted as verified here.
    - >-
      N is an odd prime EXACTLY dividing M, N is not p, and E is ordinary. The
      corollary "N > 2 sqrt(p) + 2 forces t = 2 exactly" additionally assumes
      that bound, which holds when the cofactor is below roughly sqrt(p)/2.
    - >-
      Delta_O divides t^2 - 4p, via Z[pi] contained in End(E) contained in O_K
      so that the conductor of End(E) divides that of Z[pi]. Stated explicitly
      because the divisibility direction is easy to invert by accident.
  proof_search_map:
    bottleneck: >-
      The step "N prime and N | (t - 2)^2 implies N | (t - 2)". It uses nothing
      but primality of N, and it is the step that converts a divisibility about
      a CURVE invariant (the discriminant) into a congruence on p modulo N, a
      SUBGROUP invariant. Everything downstream is substitution.
    baseline_embedding:
      parameter_slice: >-
        The k = 1 slice. Setting p congruent to 1 mod N must reproduce the known
        positive: Frey-Ruck applies over F_p with no extension, the self-pairing
        is non-degenerate, and the transfer is the classical one.
      reproduction_check: >-
        Symbolic derivation plus a frozen toy fixture - one curve of group order
        p - 1 on which t(P, P) is computed, its exact multiplicative order
        verified to be N, and a full ECDLP solve via the F_p DLP certified by an
        independent check [k]P = Q per docs/claims-and-verification.md.
    observation_collision:
      observable: >-
        The boolean "t(P, P) is non-trivial", equivalently the integer k
        compared against 1.
      distinct_preimage_search: >-
        REQUIRED and EXPECTED TO SUCCEED. Search for two curves sharing the
        observable's value but differing in Delta_O, |D_0|, j-invariant,
        automorphism group and volcano level. Abundant collisions are the
        content, not a defect: they establish that the observable is a function
        of (p, N) alone and of NO CM datum, which is exactly why the answer to
        "which CM families admit a self-pairing" is "none, as a function of CM
        data". Reporting a CM-conditioned conclusion without running this search
        is prohibited by this hypothesis.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the open-ended question "does a non-trivial self-pairing exist
          on G" by the arithmetic predicate "p is congruent to 1 mod N".
        predicted_gain: >-
          Converts a search over pairing constructions into a decidable test
          costing one modular reduction per curve, and makes the lane's scope
          statement machine-checkable.
      - transform: observable_fiber
        proposed_object: >-
          The fibre of the observable over k = 1 at fixed p: the trace-two
          isogeny class, plus classes with t congruent to 2 mod N when the
          cofactor is large.
        predicted_gain: >-
          Turns the residual case into a finite enumerable family auditable
          against deployed parameters rather than an unquantified exception.
    quantifier_order: >-
      CLAIMED - for all primes p > 3, for all ordinary E/F_p, for all odd primes
      N exactly dividing #E(F_p) and distinct from p, [ there EXISTS a
      self-pairing in the Weil, Tate, or CHM-oriented families that is
      non-trivial on G ] IF AND ONLY IF p is congruent to 1 mod N. NOT CLAIMED -
      the same statement quantified over ALL self-pairings whatsoever. Pairings
      outside the three named families, pairings into groups other than mu_N,
      and bilinear maps that are not pairings of divisors are not quantified
      over and are left explicitly open.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For ordinary prime-field curves whose group order is exactly divisible
        by the odd prime N, no self-pairing in the Weil, Tate, or CHM-oriented
        families is non-trivial on the cryptographic subgroup unless p is
        congruent to 1 mod N, in which case it is the Frey-Ruck pairing." It
        certifies nothing about self-pairings outside those families, nothing
        about supersingular curves, and nothing about ECDLP hardness generally.
      nearby_object_control: >-
        The cyclic subgroup of order m for m a nontrivial divisor of Delta_O
        with m much smaller than N - the closest object where the desired
        conclusion is FALSE. There the CHM pairing IS non-trivial and the method
        must say so. An argument that also kills those pairings proves too much
        and is void. This control separates "the constraint m | Delta_O bites"
        from "self-pairings do not exist".
    proof_obligations:
      - claim: Delta_O divides t^2 - 4p.
        responsibility: correctness
      - claim: >-
          The identity t^2 - 4p = (t - 2)^2 - 4M holds with M = p + 1 - t.
        responsibility: correctness
      - claim: N prime and N divides (t - 2)^2 implies N divides (t - 2).
        responsibility: correctness
      - claim: >-
          The Tate pairing is Galois equivariant and Frey-Ruck is non-degenerate
          at k = 1.
        responsibility: correctness
      - claim: >-
          At k = 1 with M exactly divisible by N, both sides of the Tate pairing
          are cyclic of order N generated by P.
        responsibility: strictness
      - claim: The CHM constraint applies to ordinary prime-field curves.
        responsibility: scope
      - claim: The planted k = 1 positive returns a primitive N-th root of unity.
        responsibility: baseline
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: >-
        Castryck-Houben-Merz constraint - a non-trivial self-pairing with cyclic
        domain compatible with O-oriented isogenies has order m dividing
        Delta_O, with 2-adic refinements.
      citation: KN-LIT-7489
      provenance: recalled
      verified_by: null
      role: divisibility constraint supplying argument B
    - description: >-
        Galois equivariance of the Tate-Lichtenbaum pairing and Frey-Ruck
        non-degeneracy when mu_N lies in the base field.
      citation: null
      provenance: recalled
      verified_by: null
      role: triviality at k > 1 and non-degeneracy at k = 1, supplying argument C
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: >-
        three-way agreement rate of the booleans [N | disc(End(E))],
        [ord_N(p) = 1], [t(P,P) != 1] over the toy curve sweep
      direction: higher
      minimum_effect: >-
        100 percent agreement, zero tolerance. Even one surviving disagreement
        falsifies argument B, or argument C, or the instrument.
    - metric: >-
        fraction of sweep curves with k > 1 on which the reduced Tate
        self-pairing is non-trivial
      direction: lower
      minimum_effect: exactly zero, with no tolerance
    - metric: >-
        fraction of trace-two curves (group order p - 1) on which t(P,P) has
        exact multiplicative order N
      direction: higher
      minimum_effect: 100 percent
    - metric: >-
        association between [t(P,P) non-trivial] and any CM datum (|D_0|,
        j = 0 or 1728, conductor, class number, volcano level) at FIXED (p, N)
      direction: different
      minimum_effect: >-
        exactly zero association; a non-zero association at fixed (p, N) is
        logically impossible under B and C and therefore indicates instrument or
        bookkeeping error, not a CM effect
  test_boundary:
    instances:
      - ordinary elliptic curves over prime fields F_p with p in [2^12, 2^20]
      - a constructed trace-two family with group order exactly p - 1
      - subgroups of order coprime to Delta_O, as a forced-null family
    parameters:
      curve_sweep_size: 500
      p_range: '[2^12, 2^20]'
      embedding_degrees_sampled: k = 1 and small k >= 2 selected by construction so F_{p^k} arithmetic stays feasible
      auxiliary_points_per_pairing_evaluation: 20
    implementation: >-
      Sage or an equivalent CAS for curve construction, trace, group order,
      endomorphism-ring discriminant and Tate pairing with explicit final
      exponentiation by (p^k - 1)/N. No claim is made here about which CAS the
      Executor uses; the contract fixes it.
    budget:
      estimated_wall_clock_seconds: 3600
      note: >-
        Charged at the parent proposal's declared estimated_cost.compute of
        "low". Stage 0 and the derivation are zero compute; the sweep is minutes
        and the trace-two solve is under an hour at toy scale.
  distinguishable_outcomes:
    - outcome: >-
        Perfect three-way agreement across the sweep, the k = 1 planted positive
        returns a primitive N-th root of unity, the k > 1 forced null returns
        exactly 1 on every curve and every auxiliary point, and the trace-two
        solve certifies.
      means: >-
        Both arguments stand and agree. The novel branch of RQ-PAIR-21313f is
        EMPTY: the one-point self-pairing route reduces to the classical
        Frey-Ruck transfer on the k = 1 family and is identically trivial
        elsewhere. This supports closing the lane's self-pairing branch with an
        obstruction measured as "fraction of k > 1 curves with a non-trivial
        self-pairing = 0" over the tested scope.
    - outcome: >-
        Some curve with k > 1 returns a non-trivial reduced Tate self-pairing
        that survives every instrument control (auxiliary-point invariance,
        broken-instrument arm, final exponentiation check).
      means: >-
        Argument C is refuted. This is the most consequential observation the
        lane could produce and would reopen the one-point route; it demands
        immediate independent replication before any interpretation.
    - outcome: >-
        Some curve with k = 1 and M exactly divisible by N returns a TRIVIAL
        self-pairing, with instrument controls passing.
      means: >-
        The non-degeneracy step is wrong and the exceptional family is empty
        too, making the closure STRONGER rather than weaker. Reported as such,
        never as a failure.
    - outcome: >-
        A curve on which N divides disc(End(E)) but ord_N(p) is not 1.
      means: >-
        Arithmetically impossible under argument B, so the discriminant or the
        order computation is wrong. Halt and repair the instrument; no
        mathematical conclusion is drawn.
    - outcome: >-
        The fraction of points with non-trivial self-pairing DECLINES GRADUALLY
        as k grows rather than stepping from 1 at k = 1 to 0 at k >= 2.
      means: >-
        The canonical artifact tell of docs/inventor-protocol.md - the
        measurement is an instrument property, most likely an omitted or
        incorrect final exponentiation by (p^k - 1)/N. Nothing about
        self-pairings may be reported.
    - outcome: >-
        Stage 0 finds the CHM constraint materially different from KN-LIT-7489's
        transcription, or inapplicable to ordinary prime-field curves.
      means: >-
        Argument B is void. Argument C survives independently, and the
        hypothesis must be superseded by a narrower one resting on C alone.
