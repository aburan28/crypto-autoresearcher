    - KN-OPEN-3f7a21
  falsification_conditions:
    - >-
      Any k > 1 curve with a non-trivial reduced Tate self-pairing surviving all
      instrument controls. Refutes argument C.
    - >-
      Any k = 1 curve with M exactly divisible by N whose self-pairing is
      trivial with controls passing. Refutes the non-degeneracy step.
    - >-
      Any curve with N | disc(End(E)) and ord_N(p) != 1. Refutes B or the
      instrument; the pre-committed diagnostic order is instrument first, then
      C, then B.
    - >-
      Non-zero association between the observable and a CM datum at fixed
      (p, N). Under B and C this is impossible, so it indicts the instrument.
    - >-
      Stage 0 refutation of the CHM transcription. Voids B only.
  interpretation_limits:
    - >-
      A closure of THREE NAMED FAMILIES of self-pairings, not of all conceivable
      bilinear maps. Self-pairings incompatible with oriented isogenies,
      pairings into groups other than mu_N, and non-divisorial bilinear maps
      remain open and must be carried into every summary.
    - >-
      Scoped to ordinary E/F_p with group order exactly divisible by the odd
      prime N. Nothing about supersingular curves, extension fields, or
      composite subgroup order.
    - >-
      Moves no exponent, produces no algorithm, and makes no curve safer than a
      standing embedding-degree screen already does. sota_delta is zero on every
      cost axis.
    - >-
      The k = 1 branch is NOT a new attack. It is MOV / Frey-Ruck at its most
      favourable parameter, and its cost is a DLP in F_p charged in full,
      applying to a family of density zero among curves from standard generation
      procedures.
    - >-
      Toy-scale numerical agreement over 500 curves is not a proof of the
      equivalence; the proof burden sits on the derivation, and the sweep is a
      consistency check on it.
  status: proposed
  proposed_by: idea-generator
