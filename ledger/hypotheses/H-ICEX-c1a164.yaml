  heuristic_assumptions:
    - id: HEUR-KEMB-1
      formal_statement: >-
        For a fixed prime N, the elements of multiplicative order at most B - that
        is, the |R_B(N)| = Sigma over k dividing N-1 with k at most B of phi(k)
        elements - are equidistributed modulo N relative to short intervals of length
        about 4 sqrt(N), APART FROM the two exceptional residues +1 and -1, so the
        count of admissible traces with k_emb at most B is Poisson with mean
        lambda(N, B) = |R_B(N)| * A(N) / (N - 1).
      random_model_justification: >-
        RIGOROUS INGREDIENTS- |R_B(N)| is EXACTLY Sigma over k dividing N-1 with k at
        most B of phi(k), since (Z/N)* is cyclic of order N - 1; and the Hasse
        interval has length exactly 4 sqrt(p) + O(1). The classical distribution
        imitated is equidistribution of the roots of a fixed cyclotomic polynomial
        modulo N in short intervals. THE CORRECTION TO THE SOURCE IS IN THE RIGOROUS
        HALF, NOT THE HEURISTIC HALF- Sigma over k at most B of phi(k) is an upper
        bound attained only when every such k divides N - 1.
      supporting_results:
        - ref: >-
            analysis/endomorphism-isogeny-decomposition/MATCHED-ORDER-DESIGN.md
          provenance: internal
          claim: >-
            VERBATIM- the recommended instance N = 19507 (prime), marked
            [derived here], with 59 isogeny classes and about 2000 curves total, all
            with group order exactly 19507, of which 51 classes at conductor 1 carry
            46 distinct fundamental discriminants spanning |D_0| from 1299 to 78027.
            THE 59-CLASS FIGURE IS MARKED AS DERIVED IN THAT NOTE AND IS NOT
            COMMITTED EVIDENCE, WHICH IS WHY VERIFYING IT IS PART OF THE TEST.
          verified_by: >-
            coordinator, TASK-20260904-65b023 - the recommended-instance section of
            MATCHED-ORDER-DESIGN.md read directly this task (pattern-scoped read with
            surrounding context). PARTIAL READ, DECLARED- the remainder of the note
            was not opened and nothing else from it is relied on.
        - ref: >-
            The published density result on the improbability that a random elliptic
            curve has small embedding degree
          provenance: recalled
          claim: >-
            That a random curve is very unlikely to have subexponentially small
            embedding degree, established asymptotically in the published literature.
            NO SOURCE WAS OPENED BY THIS AGENT and the source proposal itself marks
            this attribution recall-confident and NOT verified. Under AGENTS.md rule 9
            it discharges nothing and supports nothing; it is a pointer for the
            reviewer and the reason this record claims NO novelty for its substance.
          verified_by: null
        - ref: >-
            The identity k_emb = ord_N(t - 1) for N prime dividing the group order
          provenance: recalled
          claim: >-
            The standard identity relating the embedding degree to the multiplicative
            order of t - 1 modulo N. RECALLED, NOT VERIFIED AT SOURCE by this agent.
            The contract verifies it computationally on constructed instances rather
            than relying on the recollection.
          verified_by: null
      validation_experiment_ids:
        - EXP-ICEX-10be30
      falsification_condition: >-
        The aggregated observed count exceeds twice the aggregated exact
        lambda(N, B), at an aggregate expected count of at least 25 so the test has
        power. The equidistribution heuristic fails, the tail is heavier than the
        standard model predicts, and that would matter for curve-selection guidance.
