hypothesis:
  id: H-ICEX-c1a164
  question_id: RQ-PAIR-21313f
  source_idea_id: IDEA-20260811-8783a5
  title: >-
    THE SMALL-EMBEDDING-DEGREE TAIL, ENUMERATED EXACTLY - with the source aggregate
    band corrected because the attainable order set is Sigma over k DIVIDING N-1 of
    phi(k), NOT Sigma over all k at most B, so 2B^2/sqrt(N) is an UPPER BOUND that
    most N never approach and a per-N comparison against it reads as a systematic
    deficit; and with the prime ladder sized here so the aggregate expected count
    reaches 25, below which a factor-2 test cannot fire at all
  statement: >-
    (A) THE ARITHMETIC, EXACT. For E over F_p with N dividing the group order and N
    prime, N greater than 4, one has p congruent to t - 1 modulo N, hence
    k_emb = ord_N(t - 1). Therefore k_emb DIVIDES N - 1 always, and k_emb at most B
    holds if and only if t - 1 modulo N lies in the set R_B of elements of
    multiplicative order at most B.
    (B) THE FIRST CORRECTION, WHICH CHANGES THE PREDICTION. The source writes
    |R_B| = Sigma over k at most B of phi(k), at most B^2/2. THAT IS ONLY CORRECT
    WHEN EVERY k AT MOST B DIVIDES N - 1. Since (Z/N)* is cyclic of order N - 1, the
    elements of order exactly k exist only when k divides N - 1, so the CORRECT
    attained count is
        |R_B(N)| = Sigma over k dividing N - 1 with k at most B of phi(k).
    CONSEQUENCE- for the source own NULL FAMILY, N - 1 = 2q with q prime, the only
    admissible small orders are 1 and 2, so R_B(N) = {+1, -1} and the predicted count
    is EXACTLY ZERO for every B below q. A per-N comparison against 2B^2/sqrt(N)
    would read as a systematic deficit at almost every N, not because the
    equidistribution heuristic failed but because the bound is not attained. THE
    PREDICTED MEAN IS THEREFORE RESTATED AS THE EXACT
        lambda(N, B) = |R_B(N)| * A(N) / (N - 1),
    with A(N) the number of admissible traces, and 2B^2/sqrt(N) is retained ONLY as a
    stated upper bound.
    (C) THE SECOND CORRECTION, A POWER COMPUTATION. The source asks that the
    aggregated count over at least 20 primes N between 2^15 and 2^30 match its
    prediction within a factor 2. AT 2^15 THE EXPECTED COUNT PER PRIME AT B = 6 IS OF
    ORDER 0.4 AND AT 2^30 IT IS OF ORDER 0.002, so 20 primes spread across that range
    give an aggregate of order 1 and a factor-2 band is meaningless on a Poisson
    variable with mean 1. THE LADDER IS THEREFORE SIZED HERE- primes are chosen,
    BEFORE ANY COUNT IS OBSERVED, so that the SUM OF THE EXACT lambda(N, B) REACHES
    AT LEAST 25 at the smallest tested B, which at 15-bit N requires roughly 63
    primes and costs seconds. At an aggregate mean of 25 a factor-2 deviation is
    about 2.5 standard deviations and the test can fire.
    (D) THE DESIGN-INSTANCE PREDICTION, EXACT AND CHECKABLE IN SECONDS. At
    N = 19507, N - 1 = 19506 = 2 * 3 * 3251 with 3251 prime, so the attainable
    embedding degrees are exactly the eight divisors {1, 2, 3, 6, 3251, 6502, 9753,
    19506} AND THERE IS NO INTERMEDIATE VALUE- a class in this family has k_emb at
    most 6 or at least 3251. Exactly six residues have order dividing 6, of which two
    are the exceptional +1 and -1, and those two are excluded for concrete arithmetic
    reasons rather than by the model- t = 0 is supersingular for p greater than 3 and
    outside the ordinary scope, and t = 2 forces p = N + 1 = 19508, which is even and
    hence not prime. PREDICTION- ALL 59 CLASSES OF THE MATCHED-ORDER FAMILY HAVE
    k_emb AT LEAST 3251, i.e. the family contains no pairing-vulnerable class.
    (E) THE CURVE-FREE STATUS, RECORDED AS A PROOF RATHER THAN AN ARM. k_emb is
    ord_N(t - 1), a function of TWO INTEGERS. NO CURVE IS CONSTRUCTED ANYWHERE IN
    THIS DESIGN- the entire measurement is integer arithmetic modulo N, and a
    curve-free version of it would be the identical computation. PRE-DECLARED- NO
    OUTCOME OF THIS RECORD IS AN ELLIPTIC-CURVE STATEMENT BEYOND THE CITED ARITHMETIC
    FACT THAT N DIVIDING THE GROUP ORDER FORCES p CONGRUENT TO t - 1 MODULO N.
    (F) WHAT THIS IS FOR. A SCOPING DELIVERABLE, NOT A RESULT. That random curves are
    not pairing-friendly is a published theorem and no novelty is claimed for it. The
    contribution is a per-N CHECKABLE FINITE STATEMENT obtained by factoring N - 1
    alone, the divisor-gap observation that makes the prediction binary at this N,
    and a tail check the lane existing sampling proposal does not carry.
  mechanism: >-
    WHY THE TAIL IS THE QUANTITY THAT MATTERS. Embedding degree is the multiplicative
    order of a small integer modulo a large prime. Orders are constrained by the
    factorisation of N - 1, and small orders are attained only at the few roots of
    unity of that order. The Hasse window has length of order sqrt(N), so it contains
    a vanishing fraction of the residues modulo N; a curve therefore has small k_emb
    only if an arithmetically special residue happens to fall in a short window, a
    coincidence of density of order 1/sqrt(N). Distributions are validated in the
    BULK and fail in the TAIL, and the cryptographically relevant quantity is
    precisely the tail probability of k_emb at most B.
    WHY THE DIVISOR STRUCTURE IS THE WHOLE STORY, WHICH THE SOURCE BOUND HIDES. Two
    primes of the same size can have wildly different R_B- one with N - 1 highly
    composite admits many small orders, one with N - 1 = 2q admits only the two
    exceptional residues. The bound B^2/2 describes the first and is unattainable for
    the second. Replacing it by the exact lambda(N, B) turns the null-family contrast
    from a vague -more versus fewer- into an exact zero-versus-computed comparison,
    and turns the aggregate test from a comparison against an upper bound into a
    Poisson goodness-of-fit with a computable mean.
    WHY THE ORDER COMPUTATION IS THE INSTRUMENT RISK. An order computation performed
    without the FULL factorisation of N - 1 silently returns a MULTIPLE of the true
    order, which would systematically UNDER-report small k_emb and bias the result
    TOWARD the prediction. That is a bias in the direction of confirmation, which is
    why two independent implementations, at least one factoring N - 1 completely, are
    blocking rather than advisory.
  assumptions:
    - >-
      N prime, N dividing the group order, N greater than 4, and gcd(N, p) = 1, so
      k_emb = ord_N(p) = ord_N(t - 1). This is the standard identity and it is
      RECALLED rather than verified at source by this agent.
    - >-
      The matched-order construction is as recorded- N fixed, p = N + t - 1 required
      prime, D = (t - 2)^2 - 4N. THE 59-CLASS FIGURE FOR N = 19507 IS MARKED
      [derived here] IN THE DESIGN NOTE AND IS NOT COMMITTED EVIDENCE; VERIFYING IT
      IS PART OF THE TEST rather than an input to it.
    - >-
      Ordinary curves only; t = 0 is excluded as supersingular for p greater than 3.
    - >-
      UNITS. k_emb, B, N, t and every count are INTEGERS. lambda(N, B) is an
      EXPECTED COUNT, dimensionless. The observed-over-predicted ratio is COUNT OVER
      COUNT. NO TIME QUANTITY ENTERS ANY REPORTED STATISTIC.
    - >-
      The number of admissible traces A(N) is reported ALONGSIDE every ratio, so the
      non-uniform thinning caused by requiring p = N + t - 1 prime is visible rather
      than absorbed into the ratio.
