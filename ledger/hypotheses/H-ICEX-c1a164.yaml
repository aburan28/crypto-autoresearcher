  reduction_chain:
    core_problem: >-
      The exact count of matched-order classes with small embedding degree at a fixed
      prime N, and the aggregate agreement of that count with the exact Poisson mean
      derived from the factorisation of N - 1.
    corollaries:
      - problem: >-
          Whether the campaign matched-order design instance is contaminated by
          pairing-vulnerable classes, which is a prerequisite for reading any cost
          measurement on it.
        reduction_ref: >-
          Internal- the design instance is this campaign own construction and no
          published reduction is cited.
        asymptotics_preserved: >-
          Not applicable. No attack is proposed. MOV and Frey-Ruck are classical and
          nothing here is novel as an attack route.
  predictions:
    - metric: >-
        P1- number of matched-order classes at N = 19507 with k_emb at most 6 (count)
      direction: different
      minimum_effect: >-
        EXACTLY ZERO. One such class falsifies the prediction and is IMMEDIATELY
        INTERESTING, because it would be an unconstructed pairing-friendly ordinary
        curve at toy size. THE ALTERNATIVE CAN MOVE THIS- there are four
        non-exceptional residues of order 3 or 6 among 19506, and the admissible
        trace window is roughly 559 wide, so the prior probability that one lands in
        the window is about 4 * 559/19506, near 0.11. The prediction is therefore an
        11-percent-risk bet and not a foregone conclusion.
    - metric: >-
        P2- the set of attained embedding degrees at N = 19507 (set of integers)
      direction: different
      minimum_effect: >-
        A SUBSET OF THE EIGHT DIVISORS OF 19506, namely {1, 2, 3, 6, 3251, 6502,
        9753, 19506}, with every attained value AT LEAST 3251. ANY ATTAINED VALUE
        STRICTLY BETWEEN 6 AND 3251 FALSIFIES THE ARITHMETIC AND MEANS THE
        IMPLEMENTATION IS COMPUTING SOMETHING OTHER THAN ord_N(t - 1).
    - metric: >-
        P3- aggregated observed count of classes with k_emb at most B against the
        AGGREGATED EXACT lambda(N, B), over the sized prime ladder, for B in
        {2, 3, 4, 6, 12} (count over count)
      direction: different
      minimum_effect: >-
        WITHIN A FACTOR 2, AT AN AGGREGATE EXPECTED COUNT OF AT LEAST 25 SO THE TEST
        HAS POWER. THE PREDICTED MEAN IS THE EXACT
        lambda(N, B) = |R_B(N)| * A(N)/(N - 1) WITH
        |R_B(N)| = Sigma over k DIVIDING N-1 with k at most B of phi(k), NOT the
        source 2B^2/sqrt(N), which is an UPPER BOUND most N never attain and against
        which almost every N would read as a systematic deficit. The upper bound is
        retained as a reported reference line only.
    - metric: >-
        P4- null-family contrast- the count for primes with N - 1 = 2q, q prime,
        against primes with N - 1 highly composite, at matched size (count)
      direction: higher
      minimum_effect: >-
        EXACTLY ZERO IN THE N - 1 = 2q FAMILY for every B below q, because R_B there
        is exactly the two exceptional residues; and STRICTLY POSITIVE, matching its
        own exact lambda, in the highly composite family. A FORCED SEPARATION WITH A
        COMPUTED FLOOR OF ZERO ON ONE SIDE. No difference between the two families
        means the instrument is not reading the factorisation of N - 1 at all and
        every result is void.
    - metric: >-
        P5- planted-construction detection- a constructed pair (N, t) with a KNOWN
        small embedding degree
      direction: different
      minimum_effect: >-
        REPORTED AT EXACTLY THE CONSTRUCTED VALUE. A planted signal of known size that
        the enumerator MUST return. AN ENUMERATOR THAT MISSES A CONSTRUCTED
        PAIRING-FRIENDLY INSTANCE IS VOID and every zero it reports is meaningless.
    - metric: >-
        P6- cross-implementation agreement on ord_N(t - 1)
      direction: different
      minimum_effect: >-
        100 PERCENT between two independent implementations, AT LEAST ONE OF WHICH
        FACTORS N - 1 COMPLETELY. This is blocking rather than advisory because an
        order computation with an incomplete factorisation silently returns a
        MULTIPLE of the true order and would systematically UNDER-report small k_emb,
        biasing the result TOWARD the prediction.
    - metric: >-
        P7- admissible-trace count A(N), reported alongside every ratio (count)
      direction: different
      minimum_effect: >-
        REPORTED AT EVERY N. The primality requirement on p = N + t - 1 thins the
        trace set NON-UNIFORMLY and could correlate with t modulo small primes, so
        the thinning must be visible rather than absorbed into a ratio.
    - metric: >-
        P8- verification of the 59-class figure at N = 19507 (count)
      direction: different
      minimum_effect: >-
        RE-DERIVED FROM THE ENUMERATION RATHER THAN ASSUMED. The figure is marked
        [derived here] in the design note and is NOT committed evidence. A
        disagreement is a finding about the design note and is reported as one.
  test_boundary:
    instances:
      - >-
        N = 19507, reported separately and in full as the campaign design instance,
        with every attained embedding degree listed against its trace.
      - >-
        A SIZED LADDER of primes N between 2^15 and 2^30, chosen BEFORE ANY COUNT IS
        OBSERVED so that the aggregated exact lambda reaches at least 25 at the
        smallest tested B, which at 15-bit N requires roughly 63 primes.
      - >-
        NULL FAMILY- primes with N - 1 = 2q, q prime, where R_B is exactly the two
        exceptional residues and the predicted count is exactly zero.
      - >-
        CONTRAST FAMILY- primes with N - 1 highly composite, at matched size.
      - >-
        PLANTED ARM- a constructed pair (N, t) with a known small embedding degree.
      - >-
        NO CURVE IS CONSTRUCTED ANYWHERE. The entire instance set is pairs of
        integers.
    parameters:
      N_range: '2^15 to 2^30, with the ladder sized so aggregate lambda is at least 25 at the smallest B'
      B: '2, 3, 4, 6, 12'
      trace_condition: 'absolute value of t at most 2 sqrt(N + t - 1), p = N + t - 1 prime, D = (t - 2)^2 - 4N negative'
      exclusions: 't = 0 supersingular, excluded and counted; t = 2 forcing p = N + 1, excluded and counted'
      implementations: 'two independent order computations, at least one factoring N - 1 completely'
    implementation: >-
      PURE INTEGER ARITHMETIC, NO CURVES, minutes of compute. For each N- factor
      N - 1 completely; enumerate every admissible t; compute ord_N(t - 1) by testing
      prime-power quotients of N - 1; tabulate counts with k_emb at most B; compare
      to the exact lambda(N, B).
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 0.5
      maximum_memory_gb: 8
      maximum_runs: 10
  falsification_conditions:
    - >-
      F1. A matched-order class at N = 19507 with k_emb at most 6. The prediction
      fails; report the trace and the class, since an accidental pairing-friendly
      ordinary curve at toy size is worth having.
    - >-
      F2. Aggregated counts exceeding twice the aggregated EXACT lambda, at an
      aggregate expected count of at least 25. HEUR-KEMB-1 equidistribution fails and
      the tail is heavier than the standard heuristic predicts, which would matter
      for curve-selection guidance.
    - >-
      F3. The planted construction is not detected at its constructed value. THE
      ENUMERATOR IS VOID and every zero it reports is meaningless.
    - >-
      F4. An attained embedding degree not dividing N - 1. THE IMPLEMENTATION IS
      WRONG; this cannot be a mathematical outcome.
    - >-
      F5. The null family with N - 1 = 2q shows a nonzero count at any B below q, or
      the two families show the same count. In the first case the arithmetic is
      violated; in the second the instrument is not reading the factorisation of
      N - 1 and every result is void.
    - >-
      F6. The two order implementations disagree. An incomplete factorisation of
      N - 1 is the likely cause and it biases TOWARD the prediction; nothing is
      established until reconciled.
    - >-
      F7. The 59-class figure at N = 19507 does not re-derive. That is a finding about
      the design note, which marks the figure as derived rather than committed, and
      is reported as one.
  interpretation_limits:
    - >-
      TOY TO MEDIUM SCALE, claim_tier toy. NO ATTACK, NO EXPONENT, NO SPEEDUP,
      sota_delta zero. MOV and Frey-Ruck are classical and nothing here is novel as
      an attack route.
    - >-
      THIS IS A SCOPING AND CURVE-SELECTION STATEMENT WHOSE PRACTICAL CONTENT IS A
      NEGATIVE- that the matched-order family the campaign intends to use is not
      contaminated by pairing-vulnerable classes, which is a PREREQUISITE for reading
      any cost measurement on it and is not itself a result about the ECDLP.
    - >-
      THE OBJECT IS CURVE-FREE BY CONSTRUCTION. k_emb = ord_N(t - 1) is a function of
      two integers and NO CURVE IS CONSTRUCTED ANYWHERE IN THE DESIGN. That is
      recorded here as a PROOF rather than discharged by a curve-free arm, because a
      curve-free version would be the identical computation. PRE-DECLARED- NO OUTCOME
      IS AN ELLIPTIC-CURVE STATEMENT beyond the cited arithmetic fact that N dividing
      the group order forces p congruent to t - 1 modulo N.
    - >-
      DOMINATED BY THE PUBLISHED LITERATURE on the substance. The improbability of
      small embedding degree is already established asymptotically; this record is a
      finite checkable specialisation and records that as DOMINATION rather than as
      novelty. The published attribution is RECALLED and unverified by this agent.
    - >-
      AT 15-BIT N THE PREDICTED COUNT PER PRIME IS OF ORDER 1, SO NO CONCLUSION ABOUT
      THE LAW MAY BE DRAWN FROM N = 19507 ALONE - only about that family. The
      aggregation over a sized ladder exists precisely because of this.
    - >-
      THE ENUMERATION IS INFEASIBLE AT CRYPTOGRAPHIC N. At 256-bit N the Hasse window
      contains about 2^129 integers and exhaustive enumeration IS NOT REACHABLE AT
      ANY SCALE THIS PROGRAM CAN SPEND. The approach is confined to N at most 2^30
      and NO TRANSFER IS CLAIMED; at crypto scale only a sampling design applies.
      Stated rather than the claim being quietly shrunk.
    - >-
      Factoring N - 1 is free at these sizes and is a GENUINE COST at cryptographic
      scale; no cheapness is claimed there.
    - >-
      The primality requirement on p = N + t - 1 thins the trace set non-uniformly,
      so the admissible-trace count is reported alongside every ratio and the thinning
      is visible rather than absorbed.
    - >-
      Every within-class quantity here is CONSTANT- every F_p-isogeny preserves t
      hence preserves k_emb - so this axis is closed within a class by identity and
      no walk can change it. Reaching a small-k_emb curve means changing the trace,
      hence the group order, hence the problem instance, which is not a move available
      to an attacker given the instance.
