hypothesis:
  id: H-MLDSA-12f563
  question_id: RQ-MLDSA-001
  goal_id: GOAL-MLDSA-001

  statement: >-
    SCOPE: ML-DSA at the three approved parameter sets, restricted to the
    CONCRETE COST MODEL of its three underlying problems (MLWE, MSIS,
    SelfTargetMSIS). CLAIM TIER: the exact integer quantities (zeta and its
    decomposition, |B_tau|) are evaluated at the real parameter sets and are not
    toy; every quantity derived through a BKZ block size is UNTIERED until the
    calibration gate below passes, and is reported at no tier at all if it does
    not. NO ATTACK, NO FORGERY, NO EXPONENT MOVED, NO STATEMENT ABOUT ANY
    IMPLEMENTATION.
    THE CLAIM, IN FOUR PARTS.
    (C1) DECOMPOSITION, an identity. SelfTargetMSIS's admissible solution norm
    is zeta = max(gamma1 - beta, 2*gamma2 + 1 + 2^(d-1)*tau), whose second
    argument contains a term 2^(d-1)*tau contributed by the PUBLIC-KEY
    COMPRESSION parameter d and by nothing else. At the assumed parameter table
    that term is 45.6 / 27.7 / 31.9 per cent of zeta at ML-DSA-44 / -65 / -87,
    and removing it (d = 0) would multiply zeta by 0.5439 / 0.7234 / 0.6811.
    (C2) SIGN, a theorem. Under any cost model monotone in the BKZ block size,
    the map zeta -> block size is non-increasing, so the compression term can
    only lower the lattice-side floor of SelfTargetMSIS, never raise it.
    Delta_bits > 0 strictly at every parameter set. A measured Delta_bits <= 0
    refutes the INSTRUMENT, not the standard.
    (C3) NON-REORDERING, a theorem with a stated qualifier. When two lattice
    arms are costed with the SAME solver family, their ordering is invariant
    under every monotone cost-model change -- charging memory as 2^(0.2075 b),
    applying Wiener AT^2, or switching to quantum sieve constants. Hence no
    charging convention can make MSIS bind where MLWE bound. The residue this
    does NOT close is the enumeration-versus-sieving crossover, which
    KN-OPEN-017 already owns and states has never been computed under full cost
    in this corpus.
    (C4) THE ONLY PLACE THE ANSWER CAN MOVE, and a forced value. The
    lattice-versus-HASH ordering is NOT covered by C3, because the hash arm's
    cost |B_tau| = C(256, tau)*2^tau -- exactly 2^192.760 / 2^225.345 /
    2^257.015 -- is not a function of any block size and carries O(1) memory
    against the lattice arm's 2^(0.2075 b). Therefore "which of the three binds"
    is convention-dependent at exactly one junction, and the campaign's
    deliverable is the table of which arm binds under which named convention,
    with the memory-price and MAXDEPTH crossovers computed.
    (C5) THE GATE THAT COMES FIRST AND MAY END EVERYTHING. A SCOUT-COMPUTED pass
    with the textbook root-Hermite criterion returns block size 778 for
    ML-DSA-44 against a RECALLED-UNVERIFIED published value of about 423, and at
    423 that criterion reaches only length 2^22.79, approximately q. The two are
    not the same convention. Until the discrepancy is resolved, NO number in
    this hypothesis that passes through a block size may be reported, and the
    resolution is itself the first deliverable.

  mechanism: >-
    DERIVED IN-REPO. No primary source has been read by this program: KN-LIT-4dadec
    records the FIPS 204 body as NOT READ and DEC-20260805-0d59ff gate 1 permits
    ideation on that basis while forbidding an experiment that claims to test a
    FIPS 204 parameter set until the body is obtained. Every recalled item below
    is labelled and becomes a checkable stage rather than an authority.

    STEP 1 -- THE OBJECT. Verification accepts a signature when three separate
    slacks hold: the signature-norm slack gamma1 - beta on z; a rounding slack
    2*gamma2 + 1 absorbing the HighBits/hint machinery; and a compression slack
    absorbing <<c t0>>, where t0 is the discarded low part of the public key and
    ||t0||_inf <= 2^(d-1) by the definition of Power2Round. Because c has
    exactly tau nonzero coefficients each in {-1, +1}, every coefficient of
    c*t0 is a signed sum of exactly tau terms of magnitude at most 2^(d-1), so
      ||<<c t0>>||_inf <= tau * 2^(d-1)   EXACTLY, unconditionally.
    (The identical inequality is derived independently, for a different purpose
    and in a different goal, by IDEA-20260805-bb52fa and H-MLDSA-2d4123; that is
    corroboration of the algebra and not of the parameter values.) Hence
      zeta = max( gamma1 - beta , 2*gamma2 + 1 + 2^(d-1)*tau ).

    STEP 2 -- THE FORCED INTEGERS (SCOUT-COMPUTED this session in exact Python
    integer arithmetic, OUTSIDE the harness; re-run in-harness before citing).
      ML-DSA-44: gamma1-beta = 130994; 2*gamma2+1 = 190465; 2^12*tau = 159744;
                 zeta = 350209; zeta/q = 0.04179; compression share 0.4561;
                 zeta(d=0) = 190465; ratio 0.5439.
      ML-DSA-65: 524092; 523777; 200704; zeta = 724481; 0.08645; 0.2770;
                 zeta(d=0) = 524092; ratio 0.7234.
      ML-DSA-87: 524168; 523777; 245760; zeta = 769537; 0.09183; 0.3193;
                 zeta(d=0) = 524168; ratio 0.6811.
    TRIVIALITY GATE, recorded because a gate that passes is still a gate: zeta
    is 4.2 to 9.2 per cent of q at every set, so no zeta reaches q and the
    lattice arm is not vacuous. Had any zeta reached q, the vector (q, 0, ..., 0)
    would solve the homogeneous relaxation and the arm would carry no hardness
    at all.

    STEP 3 -- THE HASH ARM'S FORCED VALUE. The self-consistency constraint
    c = H(mu, [A | t | I] y) is satisfied by a generic grind: choose short z and
    a challenge c, compute w, query H, win iff the answer equals the chosen c.
    In the random-oracle model the trials are independent with success
    probability 1/|B_tau|, and B_tau is exactly the set of ring elements with
    tau nonzero coefficients in {-1, +1}, so |B_tau| = C(256, tau) * 2^tau.
    SCOUT-COMPUTED: log2 = 192.760 / 225.345 / 257.015. That these reproduce the
    widely quoted "at least 2^192 / 2^225 / 2^257" to within a bit is a joint
    consistency check on tau and on the ring degree and is the strongest
    corroboration available for the recalled table without the standard's body.
    RESOURCE PROFILE: memory O(1), queries |B_tau|, depth irrelevant
    classically and equal to about sqrt(|B_tau|) sequential Grover iterations
    quantumly.

    STEP 4 -- THE TWO THEOREMS.
    (a) MONOTONICITY IN zeta. If b(zeta) is the least block size whose
    root-Hermite factor satisfies min_m delta(b)^m q^(n k / m) <= zeta, then
    zeta' < zeta implies b(zeta') >= b(zeta), because the left-hand side is
    decreasing in b at fixed m and the minimum over m preserves the order.
    Composing with any monotone cost f gives C4's sign claim.
    (b) NON-REORDERING. If two problems cost f(b) and f(b') with f monotone
    increasing, then the ordering is decided by (b, b') alone and survives
    replacing f by any monotone g. Charging memory 2^(0.2075 b), Wiener AT^2
    (a monotone function of two quantities each monotone in b), and quantum
    sieve constants are all such replacements. QUALIFIER, LOAD-BEARING: this
    requires ONE f for both arms, i.e. the same solver family. Enumeration
    against sieving is not of this form and CAN reorder -- that is exactly
    KN-OPEN-017's open question and the theorem names it as the residue rather
    than absorbing it.

    STEP 5 -- WHY THE ANSWER CAN ONLY MOVE AT ONE JUNCTION. Combining (b) with
    the hash arm's profile: the only ordering in the goal's first completion
    criterion that any convention change can flip is lattice-versus-hash. On
    RECALLED-UNVERIFIED classical lattice figures of roughly 123 / 182 / 252
    bits, the margins Hsh - L are about +70 / +43 / +5 bits, decreasing
    monotonically across the categories; at ML-DSA-87 five bits is smaller than
    the disagreement between two ordinary conventions. Two computable
    crossovers follow: alpha_star, the memory price at which
    0.292 b + alpha*0.2075 b = log2|B_tau|; and the MAXDEPTH budget at which the
    Grover-bounded hash arm |B_tau| / D rises back above the quantum lattice arm.

    STEP 6 -- THE CALIBRATION PROBLEM, WHICH GOVERNS EVERYTHING DOWNSTREAM.
    Instantiating STEP 4(a) with delta(b) = ((b/(2 pi e)) (pi b)^(1/b))^(1/(2(b-1)))
    (RECALLED) and rank n(k+l) with volume q^(n k), a SCOUT-COMPUTED pass gives
    b(zeta) = 778 / 1182 / 1688 and b(zeta_0) = 905 / 1278 / 1849, hence
    Delta_beta = 127 / 96 / 161 and Delta_bits = 37.1 / 28.0 / 47.0 under
    0.292 b. THESE ARE PRE-REGISTERED IN ORDER TO BE SHOWN WRONG. Against a
    recalled published block size of about 423 at ML-DSA-44 the residual is
    about 355 in beta, roughly 104 bits of core-SVP; and at b = 423 the same
    criterion reaches only 2^22.79, which is approximately q, i.e. trivially.
    The internal minimisation also lands on the boundary m = n(k+l) at every b
    tested, an independent tell that the admissible subdimension range is
    mis-stated. AT LEAST ONE OF {the parameter table, the recalled published
    beta, the norm convention, the rank/volume assignment} is wrong. Producing an
    attribution table on this instrument would be exactly the failure the
    inventor protocol's baseline-reproduction audit exists to prevent, so the
    hypothesis subordinates every block-size quantity to the gate and says so in
    its success criterion.

  assumptions:
    - >-
      PARAMETER TABLE, RECALLED-UNVERIFIED, corroborated in part.
      q = 8380417, n = 256, d = 13;
      ML-DSA-44 (k,l,eta,tau,gamma1,gamma2) = (4,4,2,39,2^17,(q-1)/88);
      ML-DSA-65 = (6,5,4,49,2^19,(q-1)/32);
      ML-DSA-87 = (8,7,2,60,2^19,(q-1)/32); beta = tau*eta.
      Corroboration is twofold and neither is a reading of the standard:
      (i) the sibling-goal records IDEA-20260805-bb52fa and H-MLDSA-2d4123 quote
      gamma2 = 95232 / 261888, tau = 39 / 49 / 60, d = 13 and derive
      tau*2^(d-1) = 159744 / 200704 / 245760, matching exactly; (ii) the
      challenge-space sizes this table forces reproduce 192 / 225 / 257 to
      within a bit. RAISED AND NOT RESOLVED: those sibling records cite
      "FIPS 204 Table 1" while KN-LIT-4dadec records the body as unread. This
      hypothesis edits nothing and reports the inconsistency to the Coordinator.
    - >-
      That the SelfTargetMSIS norm bound has the stated form up to a small
      additive constant. RECALLED-UNVERIFIED. The compression term is forced by
      the exact inequality in STEP 1 regardless.
    - >-
      That the published SelfTargetMSIS estimate is produced by a lattice cost
      model evaluated at zeta. MOST LIKELY OF ALL THE ASSUMPTIONS TO BE FALSE.
      If it is produced some other way, locating how is the answer to the goal's
      question and is a better outcome than confirming the assumption.
    - >-
      No claim is made or implied about MLWE's, MSIS's or SelfTargetMSIS's
      hardness. Every statement is about a COST MODEL evaluated at published
      parameters.

  proof_search_map:
    bottleneck: >-
      The single step converting a norm budget zeta into a block size b. Every
      "which binds" statement, every attribution figure and every crossover in
      this hypothesis passes through it, and it is the one step this program
      cannot currently perform in agreement with the published numbers. Repair
      or condemnation of that step is upstream of both of GOAL-MLDSA-001's
      completion criteria on the assumption side and consumes no other budget.
    baseline_embedding:
      parameter_slice: >-
        MLWE and MSIS at ML-DSA-44 under the source's own stated convention --
        the two arms whose block sizes the primary literature publishes and
        which are therefore the only place this instrument can be checked
        against a known answer.
      reproduction_check: >-
        NUMERIC, AND IT HAS ALREADY FAILED ONCE OUTSIDE THE HARNESS. The gate is
        |b_instrument - b_published| <= 10. The SCOUT-COMPUTED pass returns 778
        against a recalled 423, missing by about 355; and the diagnostic that
        the subdimension optimum sits on the boundary at every b tested is a
        second, independent failure signal. This is recorded as a FAILED
        pre-compute audit, not as a pending one, and the hypothesis is written
        so that the repair is the first result rather than a precondition
        assumed away.
    observation_collision:
      observable: >-
        The pair (block size b, core-SVP bit count) attached to a problem name
        in a security table.
      distinct_preimage_search: >-
        A COLLISION IS ALREADY VISIBLE AND IS THE REASON THIS MAP MATTERS. Two
        distinct objects -- "the least b reaching an infinity-norm target zeta
        in a q-ary module lattice" and "the b published beside the name MSIS for
        ML-DSA-44" -- carry the same label and differ by about 355. Either they
        are different problems wearing one name, or one of the two computations
        is wrong. A SECOND, SHARPER COLLISION: at b = 423 the naive criterion is
        satisfied by vectors of length about q, which every q-ary lattice
        contains trivially; so under that criterion b = 423 is a preimage of "no
        work at all", and it cannot simultaneously be a preimage of "2^123
        classical operations". Resolving which observable the published number
        actually is IS the calibration gate, restated.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The d-ladder: the family zeta_j = 2*gamma2 + 1 + 2^(d_j - 1)*tau for
          d_j in {0, 4, 7, 10, 13} at fixed (k, l, q, tau, gamma2). Five
          instances of one problem differing only in the compression parameter.
        predicted_gain: >-
          Converts a single attribution number into a monotone curve with five
          points, so a flat curve (block size insensitive to the norm budget at
          these dimensions) is DISTINGUISHABLE from a broken instrument, and the
          obstruction is localised instead of leaving "it did not work".
      - transform: observable_fiber
        proposed_object: >-
          Hold the block size fixed and vary the arm: what else, besides zeta,
          would have to change to move b by the observed 355? Enumerate the
          candidates (norm convention, rank, volume, subdimension range,
          published-value error) and eliminate them one at a time.
        predicted_gain: >-
          Turns "the instrument disagrees" into a named cause, which is the
          reportable deliverable whether or not the attribution table is ever
          produced.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER. FOR ALL parameter sets P in {44, 65, 87} and FOR
      ALL cost models f monotone increasing in the block size, THERE EXISTS no
      pair of lattice arms costed under the same solver family whose ordering
      differs from their ordering by block size. Note the direction: the FOR ALL
      over models is outside, so a single model exhibiting a reordering refutes
      C3 outright. The WEAKER order -- for each model there exists an ordering
      -- is trivially true and is explicitly NOT claimed.
      SEPARATELY, AND WITH THE OPPOSITE STRUCTURE: THERE EXISTS a cost model f
      and THERE EXISTS a parameter set P such that the lattice-versus-hash
      binding arm under f differs from that under the memory-free classical
      model. This is an EXISTENTIAL claim and one witness suffices; it is not
      claimed for all models, and a record asserting "the hash arm binds"
      without naming its model would have promoted an existential to a
      universal, which is the failure this audit is written to avoid.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: a per-term attribution of SelfTargetMSIS's norm budget and a
        table of which attack arm is cheapest under each of several NAMED cost
        conventions, at three published parameter sets, conditional on a
        parameter table whose provenance is recorded per row. It cannot certify
        that ML-DSA meets or fails any security category -- that comparison
        needs the category definitions, which this program has not read and
        which are explicitly out of scope. It cannot certify that any published
        estimate is wrong; it can only exhibit a discrepancy and attribute it.
        It moves no exponent and improves no attack.
      nearby_object_control: >-
        MLWE AT THE SAME PARAMETER SET is the nearest object at which the hoped
        conclusion must NOT appear. MLWE has no self-consistency constraint and
        no hash arm, so its binding arm is the lattice one under every
        convention; if the machinery reports a convention-dependent binding arm
        for MLWE, it is responding to the convention rather than to the hash
        constraint and every C4 row is void. A SECOND nearby object, free:
        the d = 0 instance, where the compression term is absent and Delta_bits
        is forced to exactly 0.
    proof_obligations:
      - claim: "zeta = max(gamma1-beta, 2*gamma2+1+2^(d-1)*tau) with ||<<c t0>>||_inf <= tau*2^(d-1) exact."
        responsibility: correctness
      - claim: "|B_tau| = C(256,tau)*2^tau, log2 = 192.760 / 225.345 / 257.015."
        responsibility: correctness
      - claim: "b(zeta) is non-increasing in zeta; hence Delta_bits > 0."
        responsibility: correctness
      - claim: "Two lattice arms under one monotone cost and one solver family cannot reorder."
        responsibility: strictness
      - claim: "The instrument reproduces published MLWE and MSIS block sizes at ML-DSA-44 to within 10."
        responsibility: baseline
      - claim: "The parameter table used is the one in the primary standard."
        responsibility: interface
      - claim: "Every reported bit count carries its cost convention and its memory column."
        responsibility: memory
      - claim: "No statement here bears on any implementation, fault or side channel."
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. NO COMPLEXITY IMPROVEMENT IS CLAIMED AND NO EXPONENT IS
    MOVED. This is an audit of a published cost model at fixed parameters. It
    makes no instance easier to solve, proposes no algorithm, and adds no
    attack. sota_delta on every attack axis (time, memory, data, queries,
    advice) is exactly zero. dominated_by is not applicable because no Pareto
    point is claimed; the per-proposal dominated_by_check blocks in
    IDEA-20260805-591f9d and -5194f9 list what was checked before that null was
    written.

  heuristic_assumptions:
    - id: HEUR-STM-1
      formal_statement: >-
        For a q-ary module lattice of rank n(k+l) and volume q^(n k), the least
        BKZ block size producing a vector of infinity-norm at most zeta is the
        least b with min over admissible subdimensions m of
        delta(b)^m * q^(n k / m) <= zeta, where
        delta(b) = ((b/(2 pi e)) (pi b)^(1/b))^(1/(2(b-1))).
      random_model_justification: >-
        The root-Hermite-factor form is the standard heuristic for BKZ output
        quality on random q-ary lattices (RECALLED-UNVERIFIED; no source read by
        this program). It is a heuristic about output length, not a theorem, and
        it is used HERE ONLY BECAUSE IT IS THE CONVENTION UNDER AUDIT: replacing
        it with a different model would attribute any discrepancy to the
        substitution rather than to the published estimate.
      supporting_results: []
      validation_experiment_ids: [EXP-MLDSA-1c66ac]
      falsification_condition: >-
        ALREADY FIRED ONCE, OUTSIDE THE HARNESS, AND RECORDED AS SUCH: the
        instrument returns 778 at ML-DSA-44 against a recalled published 423,
        and at 423 the criterion is satisfied by length about q. As instantiated
        here HEUR-STM-1 is REFUTED at ML-DSA parameters until the convention is
        reconciled, and no downstream block-size number may be reported in the
        meantime. The in-harness re-run either reproduces the refutation, in
        which case reconciliation is the deliverable, or it does not, in which
        case the scout computation was wrong and that is reported too.
    - id: HEUR-STM-2
      formal_statement: >-
        Sieve cost is 2^(0.292 b) classical and 2^(0.265 b) quantum with memory
        2^(0.2075 b), uniformly in b.
      random_model_justification: >-
        RECALLED-UNVERIFIED constants attributed in memory to the
        sieving-complexity literature; not read. Load-bearing only for
        converting a block-size difference into bits. Every SIGN claim in this
        hypothesis is independent of the constants because they are monotone.
      supporting_results: []
      validation_experiment_ids: [EXP-MLDSA-1c66ac]
      falsification_condition: >-
        Report Delta_beta as primary and Delta_bits as derived, with the
        constant printed beside it, so a later correction rescales the table
        rather than invalidating it. If a sourced convention uses different
        constants, the table is recomputed under both and both are reported.
    - id: HEUR-STM-3
      formal_statement: >-
        In the random-oracle model the generic grind against c = H(mu, ...) has
        expected cost |B_tau| trials with O(1) memory, and no cheaper published
        attack on the self-consistency constraint exists.
      random_model_justification: >-
        The trial count is exact combinatorics under the random oracle and is
        derived, not assumed. The SECOND clause -- that no cheaper attack is
        published -- is a literature claim this program cannot currently support
        and is the one that would most change the conclusion if false.
      supporting_results: []
      validation_experiment_ids: [EXP-MLDSA-1c66ac]
      falsification_condition: >-
        A published attack on the self-consistency constraint cheaper than
        |B_tau|. The hash column is then replaced and this hypothesis's C4 is
        superseded -- an outcome strictly better than its confirmation, and
        Stage 0 of the paired experiment is written to look for it.

  structural_ingredients:
    - description: >-
        Exact combinatorics of the challenge set B_tau (tau nonzero
        coefficients, each in {-1, +1}, in a degree-256 ring).
      citation: >-
        DERIVED IN-REPO. No external citation is asserted. The value
        |B_tau| = C(256, tau) * 2^tau is elementary counting; its agreement with
        the widely quoted 192 / 225 / 257 figures is noted as corroboration and
        NOT cited as a source, since no source was read.
      role: exact size of the hash arm's search space
    - description: >-
        Exact bound ||<<c t0>>||_inf <= tau * 2^(d-1) for c in B_tau and
        ||t0||_inf <= 2^(d-1).
      citation: >-
        DERIVED IN-REPO. Independently derived, for a different purpose, in
        ledger/proposals/IDEA-20260805-bb52fa.yaml and
        ledger/hypotheses/H-MLDSA-2d4123.yaml (RQ-MLDSA-ffa0f5, GOAL-MLDSA-002).
        Cited as internal corroboration of the algebra only.
      role: isolates the compression contribution to the norm budget
    - description: >-
        Root-Hermite-factor model of BKZ output quality and the core-SVP cost
        constants 0.292 / 0.265 / 0.2075.
      citation: >-
        RECALLED-UNVERIFIED. NOT RETRIEVED AND NOT VERIFIED BY THIS PROGRAM.
        Recorded as a candidate to check, never as an authority. No citation is
        asserted; the calibration gate is the check.
      role: converts a norm budget into a block size and a bit count

  reduction_chain:
    core_problem: >-
      Determine, at each approved ML-DSA parameter set and under each named cost
      convention, which of MLWE, MSIS and the two arms of SelfTargetMSIS is the
      cheapest to attack, and attribute SelfTargetMSIS's norm budget to its
      three structural sources.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. Nothing here reduces to a statement about any other
      scheme, about ML-DSA's compliance with any security category, or about any
      implementation. In particular the compression attribution does NOT reduce
      to, support, or weaken GOAL-MLDSA-002's audit of the t0-secrecy sentence:
      that goal measures what t0 leaks, this one measures what discarding t0
      costs a norm budget, and the two share only an inequality.

  predictions:
