      direction: different
      minimum_effect: "EXACTLY 350209 / 724481 / 769537. Any deviation withdraws every downstream number."
    - metric: "G1 -- compression share 2^(d-1)*tau / zeta"
      direction: different
      minimum_effect: "EXACTLY 0.4561 / 0.2770 / 0.3193 to four places; above 0.25 at every set."
    - metric: "G2 -- log2 |B_tau| = log2(C(256,tau)*2^tau)"
      direction: different
      minimum_effect: "EXACTLY 192.760 / 225.345 / 257.015 to three places, computed two independent ways agreeing to 0.1 bit."
    - metric: "G3 -- triviality gate zeta/q"
      direction: lower
      minimum_effect: "Strictly below 1; pre-registered 0.04179 / 0.08645 / 0.09183."
    - metric: "G4 (THE GATE) -- |b_instrument - b_published| at ML-DSA-44, MLWE and MSIS arms"
      direction: lower
      minimum_effect: >-
        <= 10 to pass. The SCOUT-COMPUTED value of this quantity is about 355,
        so the pre-registered expectation is FAILURE ON FIRST ATTEMPT and the
        deliverable is the reconciliation. A pass on first attempt means the
        recalled published beta is wrong, which is equally reportable.
    - metric: "G5 -- NULL CONTROL: Delta_bits computed between two IDENTICAL d = 0 shapes"
      direction: different
      minimum_effect: "EXACTLY 0. Nonzero means the pipeline carries a term not derived from zeta and every attribution is void."
    - metric: "G6 -- NULL CONTROL: reordering count for MLWE vs MSIS over 3 sets x 4 conventions"
      direction: lower
      minimum_effect: "EXACTLY 0, forced by C3. Nonzero is an instrument fault and blocks all reporting."
    - metric: "G7 -- POSITIVE CONTROL: constructed arm pair with a +1 bit classical margin, charged at alpha > 0"
      direction: different
      minimum_effect: "Binding arm MUST flip. If it does not, the machinery cannot detect flips and no 'no flip' finding may be reported."
    - metric: "G8 -- graded d-ladder, 5 points, block size monotonicity"
      direction: lower
      minimum_effect: "Strictly non-increasing in zeta. One inversion is an instrument failure. A FLAT ladder (spread <= 1) is a real, reportable finding: the norm budget does not drive the block size at these dimensions."
    - metric: "G9 -- graded memory-price sweep alpha in {0, 0.05, 0.10, 0.25, 0.50, 1.00}"
      direction: different
      minimum_effect: "The binding-arm sequence must be monotone: once the hash arm binds it must keep binding. Non-monotone localises the fault to the cost composition."
    - metric: "G10 -- margin_bits = log2|B_tau| - classical lattice bits, per set"
      direction: lower
      minimum_effect: >-
        SHAPE pre-registered: positive at all three sets and STRICTLY DECREASING
        across 44 -> 65 -> 87. On recalled inputs about +70 / +43 / +5. No
        magnitude is pre-registered because the lattice column is recalled and
        the instrument is uncalibrated.
    - metric: "G11 -- quantum swap count under unconstrained Grover"
      direction: higher
      minimum_effect: "Pre-registered 3 of 3. If 0 of 3, either the recalled quantum lattice figures or the sqrt(|B_tau|) Grover costing is wrong, and finding out which is the more valuable outcome."

