hypothesis:
  id: H-EWALK-f9ebe4
  question_id: RQ-EWALK-8fa147
  added: '2026-08-25'
  derived_from_idea: IDEA-20260821-cae674
  statement: >-
    The committed result reading the automorphism-quotient rho walk as sitting ON the
    square-root-of-automorphism-count ceiling is an UNDERPOWERED NULL, and the fruitless-cycle counter
    that accompanies it does not measure what its name implies. Two separable claims, both about one
    committed evidence record, neither an attack and neither moving an exponent.
    (A) THE POWER CLAIM, ARITHMETIC ONLY. From the committed per-arm standard deviations at the
    committed seed count, the standard error and hence the minimum detectable effect of the
    ratio-to-ceiling statistic are computable directly. The claim is that the recomputed minimum
    detectable effect EXCEEDS 0.06 in ratio-to-ceiling units in both arms, so the committed result
    excludes only a cycle-mitigation-and-canonicalisation tax LARGER than about seven percent of the
    ideal quotient gain - it does not support sitting on the ceiling, and it is compatible with a tax
    at the scale the literature is recalled to report. The decision-relevant output of the committed
    run is therefore the seed count required to resolve a one-percent effect, not its mean.
    (B) THE ZERO-COUNT CLAIM, THE MORE CONSEQUENTIAL. The committed record reports fruitless-cycle
    counts of exactly zero in nearly every curve-seed sample. Under a Bernoulli entry model with the
    walk's realised step count, that observation is incompatible with EVERY per-step entry rate down to
    roughly one in five thousand. The claim is that exactly one of four explanations holds and a cheap
    experiment decides which: the counter records unescaped or fatal cycles rather than entries, so zero
    is a success rate for the escape mechanism and carries no information about the tax; or the walk's
    branch count is large enough that the true entry rate is far below the rate this campaign
    pre-registered, in which case the zeros are correct and every statement referenced to that rate is
    mis-referenced; or the counter is not incremented on the code path the committed run took, which
    would be a further instrument defect in a campaign that has already found several; or the walks are
    short distinguished-point segments rather than full rho tails, so the step count used in the
    arithmetic is wrong.
    Claim A is FALSE if the recomputed minimum detectable effect is at or below 0.01, in which case the
    committed run does bound the tax at the scale that matters. Claim B's anomaly EVAPORATES if the
    planted-cycle control passes, the instrumented counter still reports near-zero entries, and the
    analytic entry rate computed from the frozen walk is below roughly one in five thousand - the zeros
    are then correct and the deliverable is the corrected reference rate.
  mechanism: >-
    A ratio-to-ceiling statistic divides two heavy-tailed collision-search lengths, so its sampling
    distribution is wide and twenty seeds buy little resolution. Reading that width as symmetric noise
    rather than a systematic shortfall is a statement about the point estimate; the WIDTH itself is the
    finding, and it has never been computed. The consequence is governance-level: this campaign's own
    pause condition fires when a candidate appears to exceed the automorphism-discounted baseline, and an
    instrument with a seven-percent minimum detectable effect cannot trigger that condition honestly in
    either direction.
    Separately, the fruitless-cycle counter is the only instrument in the lane that could show WHERE a tax
    is paid. A counter reporting exact zeros in nearly every sample is either measuring a different event
    from the one its name suggests or is not firing. Both failures have the same consequence: the lane's
    incumbent baseline, which every prime-field advantage claim in this program must beat, is currently
    calibrated by an instrument whose resolution and whose event definition are both unstated.
    The decisive observation is that the reported zero has TWO distinct preimages - a walk in which no
    cycle was entered, and a walk in which cycles were entered and escaped before the counter's test point
    - lying on opposite sides of the conclusion that the walk pays no cycle tax. The observable is
    therefore not identifying, and separating the preimages requires an additional condition, which is
    what the counter-semantics probe supplies.
  assumptions:
    - >-
      The committed run's sample layout - how many seeds on how many curves per arm - must be read off the
      committed artifacts BEFORE any binomial arithmetic is quoted in any record. The arithmetic depends on
      it.
    - >-
      The walks are full collision-search walks rather than distinguished-point segments. If they are
      segments, the step count used in the zero-count arithmetic is wrong and the committed step counts
      settle it immediately at zero compute.
    - >-
      The committed seeds are independent. If the seed derivation shares state across arms, the effective
      sample size is smaller and every minimum detectable effect computed here is OPTIMISTIC - that is, the
      obstruction is understated, never overstated, by this assumption.
    - >-
      The pre-registered per-step entry rate this campaign uses as its reference must be confirmed from the
      frozen contract that declared it, not from a secondary summary, before it is used as the reference.
    - >-
      Toy tier. One prime, two special curves, twenty seeds. Nothing transfers to cryptographic scale and no
      transfer is offered.
  proof_search_map:
    bottleneck: >-
      The step at which the campaign converts an observed ratio-to-ceiling near one into the statement that
      the walk sits ON the ceiling. That step requires a resolution claim, and no resolution has ever been
      computed. Removing it changes what this campaign's pause condition can detect.
    baseline_embedding:
      parameter_slice: >-
        The committed twenty-seed, two-arm run at the committed prime, together with the earlier single-draw
        artifact at smaller bit sizes.
      reproduction_check: >-
        Recompute mean, standard deviation, range, exceedance counts and fruitless-cycle counts for both arms
        directly from the committed raw run artifacts and require exact agreement with the committed summary
        values. This is the frozen regression fixture and costs seconds; a disagreement means the committed
        summary and its artifacts diverge and nothing downstream is interpretable.
    observation_collision:
      observable: The reported per-walk fruitless-cycle count.
      distinct_preimage_search: >-
        A COLLISION IS ASSERTED, NOT MERELY SEARCHED FOR, AND IT IS THE POINT. Two distinct ground-truth
        objects produce the identical observable zero: a walk in which no cycle was ever entered, and a walk in
        which cycles were entered and escaped before the counter's test point. One lies on each side of the
        conclusion that the walk pays no cycle tax. The observable is therefore NOT IDENTIFYING and no
        conclusion about the tax may rest on it until the counter-semantics probe separates the preimages.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the single per-walk count by the triple of entries, escapes and fatal terminations, recorded
          per step, preserving more state than the final statistic needs.
        predicted_gain: >-
          Distinguishes the wrong-semantics explanation from the not-firing explanation in one run; the single
          count cannot, by the collision above.
      - transform: specialization_pack
        proposed_object: >-
          Express the cycle tax as extra group operations spent on detection, escape and canonicalisation divided
          by total group operations, charged over the provably disjoint blocks of steps inside and outside an
          escape.
        predicted_gain: >-
          Makes the tax additive and directly comparable to a literature figure quoted as a fraction of
          iterations, which a ratio-to-ceiling statistic can never be.
    quantifier_order: >-
      THE COMMITTED CLAIM, WRITTEN OUT: for all seeds in the tested set the realised gain equals the ceiling -
      which is what sitting on the ceiling reads as, and is NOT what was tested. What was tested is that THERE
      EXISTS a sample of twenty seeds whose mean gain is within a small margin of the ceiling, a statement about
      a sample mean that permits a per-seed shortfall anywhere inside the minimum detectable effect. THIS
      HYPOTHESIS CLAIMS: FOR ALL per-step entry rates above roughly one in five thousand, the probability that
      nearly all forty independent walks report exactly zero entries is negligible - a universally quantified
      statement over the rate with no witness freedom, which is why it is robust to not knowing the branch count.
    method_ceiling:
      strongest_certifiable_claim: >-
        At the committed prime with the committed seed count, the committed instrument excludes a cycle tax
        larger than the recomputed minimum detectable effect in each arm, and its fruitless-cycle counter is or
        is not counting entries. It can NEVER certify that the walk attains the ceiling, and it cannot adjudicate
        any effect at the one-percent scale without roughly a thousand seeds per arm.
      nearby_object_control: >-
        A GENERIC CURVE with trivial automorphism structure, where the orbit-quotient cycle mechanism this counter
        is named for does not exist in the same form and the counter's reading is a direct read of what it counts.
        If it reports non-zero counts there at the same rate, it is measuring something other than orbit-induced
        fruitless cycles. SECOND nearby object: a walk with the escape mechanism DISABLED, where the wrong-semantics
        explanation predicts the count jumps to tens per walk and the other explanations predict it stays near zero.
    proof_obligations:
      - claim: The standard error and minimum detectable effect follow from the committed standard deviation and seed count.
        responsibility: baseline
      - claim: The seed count required for a one-percent minimum detectable effect follows from the observed standard deviation.
        responsibility: size
      - claim: The expected collision-search length on the quotient follows the birthday law on the quotient class count.
        responsibility: runtime
      - claim: The probability of an all-zero count follows from the Bernoulli entry model and the realised step count.
        responsibility: success_probability
      - claim: The reported zero has two distinct preimages.
        responsibility: correctness
      - claim: The planted-cycle control must increment the counter or the not-firing explanation holds.
        responsibility: feasibility
      - claim: Toy tier, one prime, two curves, twenty seeds, no transfer asserted.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    Explicitly null. The subject is a CONSTANT FACTOR on the square-root exponent, and this hypothesis is about
    whether the program can MEASURE that constant rather than about beating it. No exponent moves in either
    direction and the promotion gates have no target here.
  heuristic_assumptions:
    - id: HEUR-EWALK-H1
      formal_statement: >-
        RHO LENGTH LAW ON THE QUOTIENT. The total collision-search length, tail plus cycle, of the additive walk on
        the automorphism quotient of a group of order N is distributed as the birthday law on the quotient's class
        count, with the standard shape and the standard mean.
      random_model_justification: >-
        The rigorous ingredient is that for a uniformly random function on a finite set the expected rho length has
        a known closed form - a theorem about random functions with no cryptographic content. The classical statement
        imitated is that the additive walk behaves like a uniformly random function on the quotient, which is the
        modelling assumption every published analysis of this method makes and which a sibling record questions for
        real partitions.
      supporting_results:
        - 'The random-function rho length theorem, classical.'
        - 'knowledge/techniques/KN-TECH-018, as this program records the automorphism-discounted baseline.'
      validation_experiment_ids:
        - EXP-EWALK-4e2a3c
      falsification_condition: >-
        The empirical mean step count in the committed run departs from the law's prediction by more than 25 percent,
        or the empirical distribution fails a Kolmogorov-Smirnov test against the rho-length law at the one-percent
        level.
    - id: HEUR-EWALK-H2
      formal_statement: >-
        BERNOULLI ENTRY MODEL. Fruitless-cycle entries occur as an independent Bernoulli process across steps with a
        single per-step probability inversely proportional to the branch count, so the per-walk count is binomial in
        the realised step count and the probability of a zero count is the complement raised to that count.
      random_model_justification: >-
        The rigorous ingredient is that for the standard two-cycle, entry requires two consecutive steps to select the
        same branch on the same orbit representative, an event whose probability is exactly the reciprocal of the
        branch count under the random-function model for branch selection, and consecutive-step events overlap in at
        most one step so the dependence is short-range. The classical statement imitated is the rare-event Poisson
        approximation for short cycles in random mappings.
      validation_experiment_ids:
        - EXP-EWALK-4e2a3c
      falsification_condition: >-
        The measured per-step entry rate fails to scale inversely with the branch count across the swept branch counts,
        or the per-walk counts are materially over-dispersed relative to the binomial, indicating clumping the model
        does not capture.
      supporting_results: []
  structural_ingredients:
    - description: >-
        The committed evidence record whose per-arm means, standard deviations, ranges and fruitless-cycle counts are
        the input to every arithmetic claim here.
      citation: 'ledger/evidence/EV-ENDO-10109d.'
      provenance: internal
      verified_by: 'Read in full by the parent proposal session.'
      role: the numbers the power and zero-count arithmetic operate on
    - description: >-
        The automorphism-discounted collision-search baseline, recorded as a constant-factor speedup on the square-root
        exponent, and the statement that negation walks require fruitless-cycle handling.
      citation: 'knowledge/techniques/KN-TECH-018.'
      provenance: internal
      verified_by: 'Read in source by the parent proposal session.'
      role: the incumbent this lane calibrates against
    - description: >-
        The published analysis of correct use of the negation map in collision search, recalled as reporting the wasted
        iteration fraction at the sub-one-percent scale.
      citation: >-
        RECALLED, NOT READ. Two retrieval attempts failed in the parent session and no agent in this program has opened
        the source. It is a POINTER for a reviewer with retrieval and is used only to state the scale at which the
        instrument would need to resolve; the arithmetic of the power claim does not depend on it.
      provenance: recalled
      verified_by: null
      role: the scale the required sample size is computed against
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: recomputed_minimum_detectable_effect
      direction: higher
      minimum_effect: >-
        At least 0.06 in ratio-to-ceiling units in both arms. If the recomputation instead gives at most 0.01, claim A is
        FALSE and the committed result really does bound the tax at the scale that matters.
    - metric: seeds_required_for_one_percent_resolution
      direction: higher
      minimum_effect: >-
        At least 500 per arm. A number below 100 would mean the committed seed count was nearly adequate and claim A
        overstates the gap.
    - metric: planted_cycle_counter_increment
      direction: higher
      minimum_effect: >-
        At least 1, deterministically, on a walk instance constructed so that two consecutive steps provably take the same
        branch on the same orbit. A zero here is DECISIVE for the not-firing explanation and means no negative may be
        recorded from this counter anywhere in the campaign.
    - metric: entries_per_walk_instrumented
      direction: higher
      minimum_effect: >-
        A mean above 5 per walk selects the wrong-semantics explanation - the committed zero was counting fatal cycles. A
        mean below 0.5 with the planted control passing selects the wrong-reference-rate explanation.
    - metric: analytic_entry_rate_from_frozen_branch_count
      direction: different
      minimum_effect: >-
        Reported together with the branch count. Above roughly one in sixty-four, the committed zeros are impossible under
        any entry-counting semantics and one of the first two explanations must hold; below roughly one in five thousand,
        the zeros are expected and the reference rate is simply wrong.
    - metric: entry_rate_decay_exponent
      direction: lower
      minimum_effect: >-
        A fitted exponent of the entry rate against the reciprocal branch count within 0.7 to 1.3 across the swept range. A
        rate that does NOT decay as the branch count grows is the canonical artifact tell and VOIDS the counter regardless
        of every other arm.
    - metric: matched_unquotiented_denominator_agreement
      direction: different
      minimum_effect: >-
        Within 2 percent of the committed denominator, re-measured on identical seeds rather than carried forward. A larger
        disagreement means the ratio's two halves came from different conditions and the ceiling comparison is not matched.
  test_boundary:
    instances:
      - The committed two-arm, twenty-seed run at the committed prime, re-read from its raw artifacts.
      - >-
        An instrumented copy of the same walk at the same prime and the same two curves with byte-identical seed derivation.
      - A constructed walk instance in which a fruitless two-cycle is forced, as the planted positive control.
      - A generic curve with trivial automorphism structure, as the null object.
      - A walk with the escape mechanism disabled, as the separating arm.
      - The same walk swept over a declared set of branch counts, as the decay control.
    parameters:
      prime: 'the committed prime of the target evidence record, at 17 bits'
      seeds: '20 per arm, byte-identical to the committed derivation, for the instrumented copy'
      branch_count_sweep: '4, 8, 16, 32, 64'
      walks_per_sweep_point: '200'
      alpha_and_power: 'two-sided at 0.05 with power 0.80, both stated with the formula used'
    implementation: >-
      A new standalone driver under experiments/EXP-EWALK-4e2a3c/driver/ containing the instrumented copy of the walk, the
      planted-cycle constructor, the null and escape-disabled arms, and the analysis. The committed walk implementation is
      READ but not modified. Nothing under harness/ is modified.
    budget:
      wall_clock_seconds_total: 3600
      maximum_memory_gb: 4
      maximum_runs: 20
  falsification_conditions:
    - >-
      The recomputed minimum detectable effect is at most 0.01. Claim A is FALSE - the committed twenty-seed run does bound
      the cycle tax at the scale that matters and the lane's calibration is adequate. A clean, cheap, fully available negative.
    - >-
      The planted cycle increments the counter, the instrumented copy still reports near-zero entries, AND the analytic entry
      rate from the frozen branch count is below roughly one in five thousand. The wrong-reference-rate explanation holds;
      claim B's anomaly EVAPORATES, the zeros are correct, and the deliverable is the corrected rate together with a note that
      every campaign statement referenced to the old rate is mis-referenced.
    - >-
      The planted cycle does NOT increment the counter. The not-firing explanation holds; this is a further instrument defect,
      every fruitless-cycle number in the campaign becomes attempted-and-inconclusive, and no negative may be read from any of
      them.
    - >-
      The entry rate does not decay as the branch count increases. The counter is measuring an artifact and NO reading of it -
      zero or otherwise - supports anything.
    - >-
      The re-measured unquotiented denominator disagrees with the committed one by more than 2 percent. The ratio was not
      matched and the ceiling comparison must be redone before any of the above is interpreted.
    - >-
      The committed raw artifacts do not reproduce the committed summary values exactly. The regression fixture fails and
      nothing downstream is interpretable.
  interpretation_limits:
    - >-
      TOY TIER. One prime at 17 bits, two special curves, twenty seeds. Nothing transfers to cryptographic scale and no
      transfer is offered.
    - >-
      NO EXPONENT MOVES IN EITHER DIRECTION AND NO ATTACK IS PROPOSED. The automorphism discount is and remains a constant
      factor on the square-root exponent; this is about whether the program can MEASURE that constant.
    - >-
      A DEMONSTRATION THAT THE INSTRUMENT IS UNDERPOWERED IS NOT EVIDENCE THAT THE WALK PAYS A TAX. It is evidence that the
      committed run cannot say either way, which is a different and weaker statement, and it must be written in those words.
    - >-
      The recalled sub-one-percent literature figure is a POINTER, not support. If the real tax is larger the required sample
      size shrinks and the obstruction is milder; the power arithmetic is independent of it.
    - >-
      Results bear on THIS walk implementation. A different escape strategy has a different rate and a different tax, and
      none of this transfers between them.
    - >-
      The ceiling the committed statistic is normalised against already assumes zero cycle tax and zero canonicalisation cost,
      so a measured ratio near one is consistent with a real implementation paying both and the ceiling being defined too
      generously. That is a DEFINITIONAL caveat and applies at any sample size.
  status: proposed
  proposed_by: idea-generator
  specified_by: coordinator
  prior_evidence_refs:
    - RQ-EWALK-8fa147
    - IDEA-20260821-cae674
    - EV-ENDO-10109d
    - KN-TECH-018
    - IDEA-20260807-6355c6
    - IDEA-20260807-cbbcfd
    - IDEA-20260807-15b468
    - IDEA-20260815-08fbb3
    - CORR-20260807-3ee25d
    - GOAL-ENDO-001
  distinguishable_outcomes:
    - outcome: >-
        The recomputed minimum detectable effect exceeds 0.06 in both arms, the planted-cycle control passes, and the
        instrumented copy reports a mean above 5 entries per walk on the same seeds.
      meaning: >-
        Claim A holds and the WRONG-SEMANTICS explanation is selected. The committed counter was recording unescaped or fatal
        cycles, so its zero is a success rate for the escape mechanism and carries NO information about the tax. The committed
        disposition that there was no persistent shortfall to explain rests on a quantity that could not have shown one, and
        must be superseded. The lane's calibration is restated with a measured resolution and a required sample size.
    - outcome: >-
        The minimum detectable effect exceeds 0.06, the planted control passes, the instrumented copy reports a mean below 0.5
        entries per walk, and the analytic rate from the frozen branch count is below roughly one in five thousand.
      meaning: >-
        Claim A holds and claim B's ANOMALY EVAPORATES. The zeros are correct; the walk's true entry rate is far below the rate
        this campaign pre-registered, and every campaign statement referenced to that rate is mis-referenced and must be
        restated. The deliverable is the corrected reference rate, which is a real and useful correction.
    - outcome: >-
        The planted cycle does NOT increment the counter.
      meaning: >-
        The NOT-FIRING explanation holds. This is a further instrument defect in a campaign that has already recorded several.
        Every fruitless-cycle number in the campaign becomes attempted-and-inconclusive, no negative may be read from any of
        them, and the defect is the reported result.
    - outcome: >-
        The recomputed minimum detectable effect is at most 0.01.
      meaning: >-
        Claim A is FALSE. The committed twenty-seed run does bound the cycle tax at the scale that matters, the lane's
        calibration is adequate, and this hypothesis's power limb is withdrawn. A clean, cheap, complete negative available at
        zero compute.
    - outcome: >-
        The entry rate does not decay with the branch count, or the re-measured unquotiented denominator disagrees with the
        committed one by more than 2 percent, or the committed artifacts do not reproduce the committed summary.
      meaning: >-
        INSTRUMENT OR FIXTURE FAILURE. In the first case the counter is measuring an artifact and no reading of it supports
        anything; in the second the ratio was never matched and the ceiling comparison must be redone before anything else is
        interpreted; in the third the committed summary and its artifacts diverge, which is a correction-record matter. None of
        these is a result about the walk.
