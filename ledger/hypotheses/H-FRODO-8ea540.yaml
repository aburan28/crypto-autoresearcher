hypothesis:
  id: H-FRODO-8ea540
  question_id: RQ-FRODO-3260cc

  statement: >-
    SCOPE: FrodoKEM-640 / -976 / -1344 as specified in the primary standardisation
    text, once that text is filed as a KN-LIT entry; the Renyi-divergence step that
    bridges the tabulated error distribution and the rounded Gaussian; exact
    rational arithmetic; no lattice-hardness estimate of any kind. CLAIM TIER:
    SPLIT -- CRYPTO for the arithmetic assertion that a recomputed divergence does
    or does not equal a printed one, TOY for every bit-security statement derived
    from it. NO ATTACK, NO EXPONENT, NO STATEMENT ABOUT DEPLOYED FRODOKEM.

    THE HYPOTHESIS. The divergence-to-bit-security conversion decomposes exactly
    into two loss terms, T1 = lambda/a (exponent sharpening) and
    T2 = N * log2 R_a(chi||psi) (accumulation over N samples), of which ONLY T2
    depends on the number of samples and does so LINEARLY, by multiplicativity of
    the Renyi divergence over independent samples. Three consequences are asserted,
    each independently falsifiable:

    (A) INVERTIBILITY. Because T1 falls in the order a and T2 rises in it, the
    printed order is a receipt for a sample budget: with log2 R_a locally linear in
    a with slope c, the loss-minimising order is a* = sqrt(lambda/(N c)), so the
    printed pair (a, divergence) plus the target level lambda determines
    N* = lambda/(c a^2), the sample count for which that order is optimal. IF the
    designers tuned a, THEN N* agrees with the scheme's actual chi sample count to
    within a small factor.

    (B) READING DETERMINATION. The printed divergence is a PER-SAMPLE quantity
    rather than a whole-scheme one, and the balance test decides this at zero
    compute: under the per-sample reading the two loss terms are comparable, under
    the whole-scheme reading they differ by more than four orders of magnitude.

    (C) QUANTIFIER. The additive loss is linear in the TOTAL sample count an
    adversary's view contains, so under a multi-target reading with T targets it is
    T * N * log2 R_a. The hypothesis asserts that the document binds N per instance
    and handles multi-target separately, and that stating this explicitly -- with
    the sample count at which the bound degrades -- is a derivation the document
    does not contain.

    THE PRE-REGISTERED ANOMALY, WHICH IS THE PART THAT CAN EMBARRASS THIS RECORD.
    Evaluated on the extraction-damaged excerpt in RQ-FRODO-3260cc.provenance with
    recalled sample counts and security levels, (A) holds at Frodo-640 (ratio 1.34)
    and Frodo-976 (1.51) and FAILS at Frodo-1344 (ratio 5.99, implied optimal order
    409 against a printed 1000). The hypothesis does NOT predict that anomaly away.
    It asserts that the anomaly has exactly one of four causes -- wrong recalled
    lambda, wrong recalled N, extraction damage in the printed divergence, or a
    genuinely untuned order at level 5 -- and that reading the primary text
    distinguishes them. THE MOST LIKELY OUTCOME IS THAT THIS PROGRAM'S OWN RECALLED
    INPUTS ARE WRONG, and that is stated before the run so it cannot be discovered
    afterwards as a concession.

    IF ALL THREE CONSEQUENCES HOLD AND NO DISCREPANCY IS FOUND, the deliverable is
    the conversion derivation and the sample-count sensitivity curve that the
    document omits, at TOY tier, plus a CRYPTO-tier arithmetic reproduction of the
    printed divergences. That is a complete and sufficient outcome and is not a
    failure.

  mechanism: >-
    DERIVED IN THIS RECORD. The two properties of the Renyi divergence it rests on
    are RECALLED AS STANDARD and are NOT cited to any paper, theorem number, page or
    venue, because none has been checked by this program. They are CANDIDATES TO
    TEST and their verification is a stage of EXP-FRODO-02bbaa, never an authority
    appealed to here.

    DEFINITION AND THE TWO PROPERTIES. For distributions P, Q on a common support
    with Supp(P) contained in Supp(Q), and a > 1,

      R_a(P||Q) = ( sum_z P(z)^a Q(z)^{1-a} )^{1/(a-1)}.

    PROPERTY 1 (probability preservation): for every event E,
    Q(E) >= P(E)^{a/(a-1)} / R_a(P||Q). RECALLED. The short derivation this record
    proposes to reproduce rather than cite: apply Holder's inequality with exponents
    a and a/(a-1) to the pair of functions 1_E * (P/Q)^{...} against Q; the stated
    inequality is the rearrangement. Reproducing that derivation in full is the
    first stage of the experiment and it is where this hypothesis is cheapest to
    refute.
    PROPERTY 2 (multiplicativity): R_a(P_1 x ... x P_N || Q_1 x ... x Q_N) =
    prod_i R_a(P_i || Q_i). RECALLED. Immediate from the product structure of the
    defining sum, and reproducible in two lines.

    THE CONVERSION. Let chi be the deployed tabulated distribution, psi the rounded
    Gaussian whose LWE hardness is inherited, N the number of independent chi
    samples in the adversary's view, and lambda the bit security assumed against
    psi, i.e. every adversary's success probability against psi is at most
    2^{-lambda}. Let E be the event that a fixed adversary succeeds. Applying
    Property 2 to the N-fold products and then Property 1,

      2^{-lambda} >= psi^N(E) >= ( chi^N(E) )^{a/(a-1)} / R_a(chi||psi)^N,

    hence

      chi^N(E) <= ( 2^{-lambda} * R_a(chi||psi)^N )^{(a-1)/a}
                = 2^{ -((a-1)/a) * ( lambda - N log2 R_a(chi||psi) ) },

    so the deployed bit security is

      lambda' = ((a-1)/a) * ( lambda - N log2 R_a )
              = lambda - lambda/a - N log2 R_a + (N log2 R_a)/a
              = lambda - T1 - T2 + (second order),
      T1 = lambda / a,      T2 = N * log2 R_a(chi||psi).

    THE DECOMPOSITION IS EXACT; ONLY THE DISCARDED CROSS TERM (N log2 R_a)/a IS AN
    APPROXIMATION, and at the excerpt figures it is below 0.01 bits, so the audit
    reports both the exact inequality and the two-term reading.

    WHY THE ORDER IS A RECEIPT. T1 is decreasing in a and T2 is increasing in a
    (R_a is non-decreasing in its order -- a theorem, and the experiment's
    monotonicity instrument check). For small divergences the second-order expansion
    around a = 1 gives log R_a ~ (a/2) * chi2(P||Q), i.e. log2 R_a = c*a with
    c = chi2/(2 ln 2). Then

      L(a) = lambda/a + N c a,    L'(a) = -lambda/a^2 + N c = 0,
      a* = sqrt( lambda / (N c) ),      N* = lambda / ( c a^2 ).

    AT THE OPTIMUM T1 = T2 EXACTLY, which is why the RATIO T2/T1 is the diagnostic
    rather than either term: a designer who tuned a leaves that ratio near 1
    regardless of the absolute loss.

    THE RATIO EVALUATED. SCOUT-COMPUTED on this machine outside the harness, from
    the excerpt orders 200/500/1000, excerpt divergences 0.324e-4 / 0.140e-4 /
    0.264e-4, recalled sample counts N = 2*n*nbar + 2*nbar*n + nbar^2 with nbar = 8
    (20544 / 31296 / 43072) and RECALLED security levels 143 / 209 / 274. RE-RUN
    IN-HARNESS BEFORE CITING:

      Frodo-640 : T1 = 0.715, T2 = 0.960 bits, T2/T1 = 1.34, a* = 173, N* = 15297
      Frodo-976 : T1 = 0.418, T2 = 0.632 bits, T2/T1 = 1.51, a* = 407, N* = 20696
      Frodo-1344: T1 = 0.274, T2 = 1.641 bits, T2/T1 = 5.99, a* = 409, N* = 7194

    Two parameter sets land within 20 per cent of the balance point computed from a
    sample count nobody told this program. That is the evidence for (A) and (B), it
    was obtained before any source was read, and it is a genuine pre-run result
    rather than a hope. The third does not, and the hypothesis carries that as an
    anomaly rather than smoothing it.

    WHY THE QUANTIFIER IS THE PART THAT HIDES. T2 is linear in N and N is a declared
    budget, not a property of the distributions. Whether the document binds N before
    or after the adversary chooses a target count is invisible in the printed
    numbers: a conversion error there produces no wrong number anywhere in the
    document, which is exactly what RQ-FRODO-3260cc means by the link where an error
    would survive longest. At the excerpt figures a single target costs about 1 bit
    and T targets would cost T bits, so a multi-target reading of the bound
    collapses it at any interesting T -- which strongly suggests the argument is
    NOT intended that way, and the deliverable is to establish what the document
    actually says and state the scope.

    WHAT THIS MECHANISM DOES NOT DO. It does not compute R_a: that requires the
    filed table and the filed definition of psi, and it is the experiment's job. It
    does not derive lambda, which is read from the document and never disputed here
    -- GOAL-FRODO-001.non_duplication assigns lattice hardness to GOAL-MLKEM-003
    and GOAL-MLKEM-004 and this hypothesis makes no claim in that lane. It does not
    establish that FrodoKEM's argument is correct or incorrect.

  assumptions:
    - >-
      FROZEN BEFORE ANY EVALUATION, and no clause may be adjusted after a number is
      observed without a versioned amendment recorded as exploratory_only:
      (1) T1 = lambda/a and T2 = N log2 R_a, with the cross term reported separately.
      (2) log2 R_a = c*a over the tested order range, with c fitted from at least
          seven orders and the fit residual reported.
      (3) a* = sqrt(lambda/(N c)) and N* = lambda/(c a^2).
      (4) The balance diagnostic is the ratio T2/T1; "tuned" means the ratio lies in
          [1/3, 3] and "anomalous" means outside it. THE THRESHOLD IS FIXED HERE,
          before any primary text is read, and the excerpt values 1.34 / 1.51 / 5.99
          were computed before it was chosen -- which is disclosed rather than
          concealed, and is the reason the band is stated as [1/3, 3] rather than as
          a band that happens to include exactly two of the three.
      (5) The per-sample reading and the whole-scheme reading of the printed
          divergence are the ONLY two candidates considered, and both are evaluated
          and reported.
    - >-
      Every FrodoKEM figure used above is RECALLED or read from an
      extraction-damaged excerpt. lambda = 143/209/274 is the weakest of them and
      T1 is directly proportional to it. The experiment reads all of them and
      re-instantiates before interpreting anything.
    - >-
      The source gate of RQ-FRODO-3260cc.constraints[0] is SHUT. No stage of any
      experiment on this hypothesis that consumes a FrodoKEM figure may execute
      until the specification and the primary divergence analysis are filed as
      KN-LIT entries with provenance levels and extraction damage marked. The
      source-free stages may be designed and reviewed now; that is why they are
      ordered first.

  proof_search_map:
    bottleneck: >-
      The single step at which a divergence bound becomes a number of bits. Every
      other link in FrodoKEM's chain is either a printed number that can be checked
      by recomputation (the table, the divergence, the failure rate) or an inherited
      hardness assumption this goal is forbidden to re-derive. The conversion is the
      only link that is neither: it is an argument whose inputs are printed and
      whose output is not.
    baseline_embedding:
      parameter_slice: >-
        a -> infinity with N fixed recovers the max-log-divergence bound
        (T1 -> 0, the loss becomes purely additive), and a -> 1+ recovers the
        Kullback-Leibler regime where T1 diverges and the bound is vacuous. Both
        limits are known-answer slices of the same formula. A second slice: chi =
        psi, where R_a = 1 exactly at every order and both loss terms vanish
        identically.
      reproduction_check: >-
        SYMBOLIC, plus a frozen fixture. The chi = psi slice must return lambda' =
        lambda*(a-1)/a exactly, and the Bernoulli fixture (P = (p,1-p), Q = (q,1-q))
        must return R_a^{a-1} = p^a q^{1-a} + (1-p)^a (1-q)^{1-a} as an exact
        Fraction at every tested order. A curve that merely resembles the expected
        behaviour is not a reproduction; these are exact rational identities.
    observation_collision:
      observable: >-
        The printed pair (order a, divergence value), which is the entire visible
        output of the conversion step in the document.
      distinct_preimage_search: >-
        A COLLISION EXISTS AND IT IS THE HYPOTHESIS'S CENTRAL DIFFICULTY, so it is
        stated here rather than left for a reviewer. The pair (a, R_a) does NOT
        determine the sample count N, the security level lambda, or the loss: the
        same printed pair is consistent with any (N, lambda) satisfying the balance
        relation, and with infinitely many distribution pairs (chi, psi). The
        printed observable is therefore NOT identifying, and the hypothesis's
        inversion is only possible because it imports two ADDITIONAL quantities
        from elsewhere in the document -- the sample structure and the target level.
        THE INVERSION IS THEREFORE CONDITIONAL ON THOSE TWO BEING READ CORRECTLY,
        and if either is misread the recovered N* is wrong in a way the printed
        numbers cannot detect. This is exactly the Frodo-1344 anomaly's most likely
        cause. A SECOND collision, sharper: the per-sample and whole-scheme readings
        of the printed divergence are two distinct preimages of the same printed
        digit string, differing by a factor of about 2^14.3 in the loss they imply.
        The separating condition is the balance ratio, and stating that a separating
        condition is REQUIRED -- rather than assuming the reading -- is the whole
        content of consequence (B).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the claim from "the divergence bound is adequate" into the model
          where it is an exact scalar equation: L(a) = lambda/a + N c a with c
          measured, so that adequacy becomes an inequality between computed numbers
          rather than a judgement.
        predicted_gain: >-
          Converts an unstated modelling choice (N) into a recovered quantity (N*)
          and an unstated sensitivity (dloss/dN) into a forced slope (log2 R_a bits
          per sample). Encoding, completeness, soundness, transfer and cost-loss
          obligations are listed under proof_obligations; the transfer obligation to
          any statement about LWE hardness is DECLARED UNMET AND OUT OF LANE, not
          deferred.
      - transform: observable_fiber
        proposed_object: >-
          Hold the printed observable (a, divergence) fixed and vary the forgotten
          structure (N, lambda, and the pair (chi, psi) itself). The intrinsic
          invariant proposed to distinguish the resulting objects is the balance
          ratio T2/T1, which is computable only once the forgotten structure is
          supplied.
        predicted_gain: >-
          If the ratio does not distinguish a tuned from an untuned parameter set,
          the diagnostic is worthless and consequence (A) is refuted at zero compute.
          The excerpt already shows spread (1.34, 1.51, 5.99), which is weak evidence
          it does distinguish them.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER. FOR ALL adversaries A whose view contains at most N
      independent chi samples, THERE EXISTS a bound of the form
      Pr[A succeeds against chi] <= 2^{-((a-1)/a)(lambda - N log2 R_a)}, where a is
      chosen BEFORE A and N is a declared budget fixed BEFORE A. The witness (the
      order a) may NOT depend on the adversary, on the instance, or on the target
      count -- if it did, the conclusion would be a family of bounds rather than one
      claim, and the printed single order would not represent it.
      THE TRAP BEING HUNTED, STATED EXPLICITLY: the weaker and much easier statement
      is FOR ALL A THERE EXISTS an order a(A) making the bound hold, which is nearly
      vacuous because a can be re-optimised per adversary. The audit's job is to
      determine which order the document's sentence actually has, and in particular
      whether N is bound before or after the adversary's TARGET COUNT T. If N is
      bound before T, the honest statement of the bound in a T-target setting
      replaces N by T*N and the loss is multiplied by T -- and whether the document
      says so is the audit's single most valuable output, because it is invisible in
      every printed number.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: (i) a CRYPTO-tier arithmetic statement that an exactly recomputed
        R_a(chi||psi) at the printed order equals or differs from the printed figure
        at each standardised parameter set, with the difference's size; (ii) a
        TOY-tier statement of the loss the conversion costs at a stated sample count
        under a stated reading, with a sensitivity curve; (iii) a documented
        statement of the quantifier order the document uses. IT CANNOT CERTIFY that
        FrodoKEM is secure, that it is insecure, that the divergence technique is
        sound in general, that lambda is correct, or anything at all about LWE at
        Frodo's dimensions. It cannot move any exponent. Writing it up as if it
        could is the premature-closure failure mode pointed at the flattering
        direction.
      nearby_object_control: >-
        THE NEARBY OBJECT WHERE THE HOPED-FOR CONCLUSION FAILS is a parameter set
        whose order is deliberately DE-TUNED: take the filed FrodoKEM table and
        compute the loss at orders a/8 and 8a instead of the printed a. The balance
        ratio MUST move far outside [1/3, 3] there, by construction. If the
        diagnostic reports "tuned" at a deliberately de-tuned order, it is
        responding to something other than tuning and consequence (A) is dead. A
        SECOND nearby object, and the better one: chi = psi exactly, where the
        divergence is 1, both loss terms are computable in closed form, and the
        balance ratio is exactly 0 -- the method must distinguish that degenerate
        case from FrodoKEM's, or it is measuring the arithmetic rather than the
        design.
    proof_obligations:
      - claim: >-
          Property 1 (probability preservation) holds in the form used, with its
          side conditions, reproduced rather than cited.
        responsibility: correctness
      - claim: >-
          Property 2 (multiplicativity) holds for the scheme's sample structure,
          i.e. the chi samples in the adversary's view are genuinely independent.
        responsibility: interface
      - claim: >-
          log2 R_a is linear in a over the tested range, with a measured residual;
          otherwise a* is obtained numerically and the closed form withdrawn.
        responsibility: strictness
      - claim: >-
          R_a is computed in exact rational arithmetic with no floating point, and
          the monotonicity-in-a instrument check passes.
        responsibility: correctness
      - claim: >-
          N and lambda are read from primary text with references, not recalled.
        responsibility: baseline
      - claim: >-
          The quantifier order is quoted from the document, not inferred.
        responsibility: scope
      - claim: >-
          No statement about LWE hardness at Frodo's dimensions is made, and no
          sieve cost is derived (GOAL-FRODO-001.non_duplication).
        responsibility: scope
      - claim: >-
          Arithmetic and security claims are recorded at separate tiers throughout.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. NO COMPLEXITY CLAIM OF ANY KIND IS MADE. This hypothesis is
    an audit of a conversion step. It makes no scheme easier to attack, moves no
    exponent, and adds no algorithm. sota_delta on every attack axis -- time,
    memory, data, queries, advice -- is exactly zero, and dominated_by is not
    applicable because no Pareto point is claimed. The one exponent anywhere in
    reach of GOAL-FRODO-001 is the query exponent of a failure-boosting attack, and
    it belongs to a different hypothesis.

  heuristic_assumptions:
    - id: HEUR-FR-1
      formal_statement: >-
        (Independence of the adversary's samples) The N chi samples in the
        adversary's view are mutually independent, so that Property 2 applies and
        R_a(chi^N || psi^N) = R_a(chi||psi)^N exactly.
      random_model_justification: >-
        FrodoKEM's error matrices are, as RECALLED, drawn entry-wise independently
        from chi via independent calls to the sampler on independent uniform bit
        strings. That is a construction-level statement rather than a distributional
        heuristic, so if the recollection is right the assumption is not a heuristic
        at all. IT IS LISTED HERE BECAUSE THE RECOLLECTION HAS NOT BEEN CHECKED, and
        because the entire linearity of T2 in N -- which is the hypothesis's
        principal quantitative content -- rests on it. If any coupling exists,
        multiplicativity gives only a bound and the equality form is wrong.
      supporting_results: []
      validation_experiment_ids: [EXP-FRODO-02bbaa]
      falsification_condition: >-
        Primary text shows any coupling among the error entries used in one
        adversary view. The equality form of Property 2 is then withdrawn, T2 is
        restated as an upper bound, and the inversion for N* loses its exactness --
        reported as such, never quietly retained.
    - id: HEUR-FR-2
      formal_statement: >-
        (Local linearity of the log divergence in the order)
        log2 R_a(chi||psi) = c*a for a constant c over the range of orders in use,
        with c = chi2(chi||psi)/(2 ln 2) to leading order.
      random_model_justification: >-
        A second-order expansion of the Renyi divergence about a = 1 for a small
        divergence. NOT RE-DERIVED HERE AND NOT CITED TO ANY SOURCE. It is
        LOAD-BEARING ONLY for the closed forms a* and N*; the exact recomputation of
        R_a, the sensitivity curve in N, and the quantifier audit are all
        independent of it.
      supporting_results: []
      validation_experiment_ids: [EXP-FRODO-02bbaa]
      falsification_condition: >-
        The measured log2 R_a across at least seven orders spanning the printed one
        deviates from linearity by more than 10 per cent at any tested order. The
        closed forms are then withdrawn and a* is obtained by numerical minimisation
        of L(a); the audit continues with a stated correction. Cost of being wrong:
        seconds.
    - id: HEUR-FR-3
      formal_statement: >-
        (Design intent) The published Renyi order was chosen to minimise the total
        loss at the sample count the designers charged, so that the balance ratio
        T2/T1 lies in [1/3, 3].
      random_model_justification: >-
        NONE, AND THIS IS THE WEAKEST LINK IN THE RECORD, stated as such rather than
        dressed up. This is an assumption about human intent, not about mathematics.
        Its only support is empirical and pre-run: the excerpt figures put two of
        three parameter sets inside the band. A designer might equally have chosen a
        round number, inherited an order from a prior draft, or optimised a
        different objective. IF HEUR-FR-3 IS FALSE THE INVERSION RECOVERS NOTHING,
        consequence (A) fails, and the Frodo-1344 anomaly has no significance -- and
        that outcome must be reported as a refutation of this hypothesis rather than
        as a finding about FrodoKEM.
      supporting_results: []
      validation_experiment_ids: [EXP-FRODO-02bbaa]
      falsification_condition: >-
        The document states the sample count it charged, and N* computed from the
        printed order disagrees with it by more than a factor of 3 at TWO OR MORE
        parameter sets. HEUR-FR-3 is then refuted and the recovered-budget framing
        is withdrawn. Note the asymmetry deliberately built in: a failure at ONE
        parameter set is the pre-registered anomaly and is not a refutation; a
        failure at two is.

  structural_ingredients:
    - description: >-
        Renyi divergence as a replacement for statistical distance in lattice
        security proofs, with probability preservation and multiplicativity.
      citation: >-
        NOT RETRIEVED, NOT READ, AND NOT CITED TO ANY PAPER. Attributed in model
        memory to the Bai-Langlois-Lepoint-Stehle-Steinfeld line of work; NO
        theorem number, page, venue or year is asserted, and the attribution itself
        is a CANDIDATE TO CHECK. The forms used here were derived in this record and
        are to be verified in the experiment.
      role: the tool whose conversion into bits is the object of the audit
    - description: >-
        Holder's inequality with conjugate exponents a and a/(a-1).
      citation: Elementary; the derivation is reproduced in the experiment rather than cited.
      role: supplies probability preservation without an external authority
    - description: >-
        The exact-rational sampling table and its normalisation convention.
      citation: >-
        ledger/proposals/IDEA-20260805-390957.yaml, identities C1 and C3. NOT YET
        EVALUATED against primary text; evaluated only against the
        extraction-damaged excerpt, where C1 returns exactly 2^16.
      role: supplies chi as an exact rational measure, without which R_a cannot be computed exactly

  reduction_chain:
    core_problem: >-
      Determine, at each standardised FrodoKEM parameter set, the exact rational
      value of the Renyi divergence between the specified sampling distribution and
      the rounded Gaussian at the specified order; the bit-security loss that
      divergence implies as a function of the sample count; and the sample count the
      published order corresponds to.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. There is no reduction from this hypothesis to any
      statement about the hardness of LWE, about FrodoKEM's overall security, or
      about any other scheme. GOAL-FRODO-001.non_duplication reserves the
      lattice-estimator lane for GOAL-MLKEM-003 and GOAL-MLKEM-004; lambda enters
      here as a number read from a document and leaves unchanged. Any citation of
      this hypothesis toward a security conclusion must carry that gap explicitly,
      and the TOY ceiling on every security reading is not liftable by any
      downstream record.

  predictions:
    - metric: "G1 - instrument check: monotonicity of exactly computed R_a across at least seven orders spanning the printed one"
      direction: higher
      minimum_effect: >-
        Non-decreasing at EVERY consecutive pair, with zero exceptions. This is
        forced by theorem; a violation is a pipeline defect and NOT a FrodoKEM
        finding. Must be reported before any comparison to a printed figure.
    - metric: "G2 - Bernoulli fixture: R_a on P=(1/3,2/3), Q=(1/2,1/2) at a in {2,3,5} as exact Fractions"
      direction: different
      minimum_effect: >-
        EXACT equality with the closed form
        R_a^{a-1} = p^a q^{1-a} + (1-p)^a (1-q)^{1-a}, as Fractions, with no
        tolerance. Zero-compute, absolutely decisive, and it tests the pipeline
        without any FrodoKEM input.
    - metric: "G3 - reading determination: balance ratio T2/T1 under the per-sample reading, per parameter set"
      direction: different
      minimum_effect: >-
        Inside [1/3, 3] at AT LEAST TWO of the three parameter sets. Excerpt values
        1.34 / 1.51 / 5.99 (SCOUT-COMPUTED). Under the whole-scheme reading the
        ratio is of order 1e-5 everywhere, so the two readings are separated by
        four orders of magnitude and the test cannot be ambiguous.
    - metric: "G4 - budget recovery: N* from the printed order against the sample count read from the specification"
      direction: different
      minimum_effect: >-
        Agreement within a factor of 3 at Frodo-640 and Frodo-976. NO AGREEMENT IS
        PREDICTED AT FRODO-1344, where the excerpt gives a factor of 6.0; that cell
        is pre-registered as an anomaly to resolve, and predicting agreement there
        would be predicting against this record's own computation.
    - metric: "G5 - sensitivity slope: d(total loss)/dN, in bits per sample"
      direction: different
      minimum_effect: >-
        EXACTLY log2 R_a(chi||psi), by construction, since T2 is linear in N and T1
        is independent of it. A computed slope differing from that value indicates
        an implementation error, not a feature of FrodoKEM. Free instrument check.
    - metric: "G6 - reproduction: |exactly recomputed log R_a - log(printed divergence)| under the determined reading, per parameter set"
      direction: lower
      minimum_effect: >-
        NO PREDICTION OF AGREEMENT IS MADE, deliberately -- that is the question the
        goal exists to ask. The pre-registered DECISION RULE, fixed here and not
        revisable after any number is seen: a relative difference below 1e-2 is
