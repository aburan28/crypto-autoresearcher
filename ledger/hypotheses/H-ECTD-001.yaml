hypothesis:
  id: H-ECTD-001
  question_id: RQ-ECTD-001
  source_proposal: IDEA-20260731-016
  linked_control_proposal: null
  goal_id: GOAL-ECTD-001
  statement: >-
    In ordinary prime-field isogeny classes at toy sizes (prime-order subgroup
    N with bitlength in [40,56], class size >=64), the per-curve distribution of
    frozen Semaev/FB/Macaulay meters is heavy-tailed: at least one curve E_s in
    at least one of >=5 enumerated classes has a primary meter better than the
    class median by a factor >=100 (or solving degree lower by >=2) while sharing
    the same group order N. The outlier must survive (i) same-p outside-class
    null curves, (ii) a Semaev-shaped multi-homogeneous degree-profile null, and
    (iii) a within-class curve-label permutation null; and a mandatory planted
    >=100x (or d_reg-2) positive control must be recovered as an outlier, else
    the instrument is void. Homogeneity (all primary meters within a factor-10
    band of the class median across all >=5 classes) is a scoped null under the
    frozen meters at toy N — not a crypto-scale or family-wide barrier. An
    outlier meter is not a trapdoor; path-hiding and public detection are out of
    scope for this hypothesis.
  mechanism: >-
    Teske hides a GHS-weak endpoint behind an isogeny. Over F_p, order-based
    weaknesses are class invariants, so the remaining Teske-shaped signal is an
    equation-dependent algebraic weakness (Semaev ideal / factor-base geometry /
    Macaulay syzygies) that varies inside the class. This hypothesis asks whether
    any such rare endpoint exists at toy scale before investing in path-hiding.
    Distinct from H-ISO-001 (short ell-neighbor d_reg/yield only) and from
    IDEA-20260731-008 (public charged transfer to special families).
  assumptions:
    - Ordinary classes are fully enumerable at chosen toy sizes via ell in {2,3,5,7}.
    - Isogeny degree coprime to N on measured edges so DL transports.
    - Meters use a fixed factor-base convention and solver budget recorded in EXP-ECTD-001.
    - Timeouts/crashes are infrastructure, not mathematical negatives (AGENTS.md rule 5).
    - Class-invariant weak curves (anomalous/MOV/smooth-order/supersingular) appear
      only in negative-control arms, never as secret endpoints.
  rerandomization: null
  asymptotic_claim:
    problem: ordinary F_p ECDLP trapdoor endpoint existence (measurement only)
    prior_best: Pollard rho at exponent 1/2; H-ISO-001 short-neighbor homogeneity (scoped)
    time_exponent: >-
      No asymptotic claim. Seeking empirical private exponent <1/2 only if a later
      EXP converts an outlier into a certified full solve; H-ECTD-001 itself is
      measurement-only at claim_tier toy.
    memory_exponent: GB-scale Macaulay matrices at toy N
    hidden_cofactor: class enumeration and per-curve GB cost
    claim_kind: constant_factor
  heuristic_assumptions:
    - id: HEUR-ECTD-TAIL-1
      formal_statement: >-
        Conditional on End ring and N, Semaev/Macaulay meters behave like nearly
        exchangeable draws across the class except for a sparse endpoint set of
        relative density o(1/sqrt(class size)).
      random_model_justification: >-
        JMV expander mixing (KN-LIT-237) motivates near-uniformity of ECDLP
        difficulty on an End level; it does NOT rigorously justify Semaev meter
        exchangeability (different object). Treat as a test hypothesis only;
        validate via KS/exceedance against an explicit exchangeability null
        (within-class permutation), not via JMV citation alone.
      supporting_results:
        - KN-LIT-237 / KN-LIT-7631 (JMV expanders) — mixing motivation only
        - No theorem forces Semaev meter constancy across a class
      validation_experiment_ids:
        - EXP-ECTD-001
      falsification_condition: >-
        Within-class label permutation changes which curve is called the outlier
        while the meter multiset is fixed; or empirical meter CDF KS distance to
        the pre-registered exchangeability null exceeds the EXP-ECTD-001 threshold
        without a surviving planted-control-validated outlier.
  structural_ingredients:
    - description: Teske elliptic-curve trapdoor via secret isogeny to weak endpoint
      citation: KN-LIT-7261
      role: shape of the designer question (endpoint behind secret path)
    - description: Isogenies and ECDLP / conductor-gap boundary
      citation: KN-LIT-7630
      role: motivates searching equation-dependent rather than class-invariant endpoints
    - description: Semaev summation polynomials and Gröbner/Macaulay meters
      citation: KN-LIT-001 / KN-TECH-002 (as used elsewhere in ledger)
      role: primary algebraic meters
  reduction_chain:
    core_problem: presence/absence of class-internal Semaev/Macaulay heavy tails at toy N
    corollaries: []
  status: weakened
  status_scope:
    scoped_to_decision: DEC-20260806-4a9604
    prior_status: specified
    transition_note: >-
      This ledger record's status field was never advanced through approved /
      running / analyzed as EXP-ECTD-001 moved through those stages (the same
      D-1-style prophylaxis convention documented in
      experiments/EXP-ECTD-001/specification.yaml's approved_by_note applied
      here too -- the intermediate states are implicit in DEC-20260731-013
      (approval) and this batch's now-verified run + independent validation
      (running/analyzed), not separately recorded). This transition moves the
      status field directly from specified to weakened rather than silently
      backfilling the skipped intermediate values, and says so rather than
      leaving the jump unexplained.
    what_is_weakened: >-
      SOLELY the reading that GOAL-ECTD-001 BATCH-fca4e2's 5-class
      Semaev/Macaulay heavy-tail screen (RUN-ECTD-001-screen, classes
      class_seed_201..205, all at exactly 40-bit N) contains a confirmed
      heavy-tail outlier. It does not: no class passed the full
      confirmed-outlier gate (permutation-stable, null-passing, excludes the
      planted curve). decision_branch: scoped_homogeneity, independently
      re-derived by TASK-20260806-5bc785 directly from raw per-class data,
      not read off the producer's summary field.
    what_is_not_weakened:
      - >-
        H-ECTD-001's broader mechanism (an equation-dependent algebraic
        weakness varying inside an isogeny class) is untouched -- one
        unreplicated toy-scale screen at a single 40-bit N cannot bear that
        weight in either direction.
      - >-
        HEUR-ECTD-TAIL-1 itself is neither validated nor refuted. Its own
        falsification_condition (a permutation changing which curve is called
        the outlier, or empirical-CDF KS distance exceeding the pre-registered
        threshold without a surviving planted-control-validated outlier) did
        not fire either way -- no candidate outlier ever reached the point
        where the heuristic could be tested against it, because none survived
        the confirmed-outlier gate to be a candidate.
      - >-
        Path-hiding, public detection, the vertical lane (IDEA-20260731-017)
        and the trapdoor-DDH lane (IDEA-20260731-018) remain fully open and
        unaffected in either direction; this hypothesis was never about them.
      - >-
        RUN-ECTD-001-impl (decision_branch: resource_incomplete, 1 completed
        class, designed only as an implementation smoke test) contributes no
        homogeneity reading at all -- explicitly not a second confirming data
        point for the screen run's finding.
      - No trapdoor claim in either direction. No crypto-scale claim.
    scope_boundary_note: >-
      Per independent Validator finding F-3 (TASK-20260806-5bc785), the
      achieved N-bit coverage is narrower than EXP-ECTD-001's disclosed
      deviation text implies: every completed class landed at exactly 40
      bits, never 41-44, because driver/fp.py's random_prime returns an
      exact-width prime and Hasse's theorem then confines N to the 40-bit
      window regardless of the declared [40,44] acceptance band passed to
      find_seed_curve. The status above is scoped to exactly 40-bit N, not to
      the disclosed [40,44] range.
    mechanism_test_status:
      exercised: false
      reason: >-
        No path-hiding or public-detection mechanism has ever been exercised
        by this hypothesis's evidence base; BATCH-fca4e2 measures algebraic
        per-curve meter homogeneity only, under a disclosed plain-rho
        (not negation-map) baseline substitution -- see
        CORR-20260806-2f98f4 for the justification-text defect found in
        that substitution's documentation, which does not touch this
        determination (independently re-derived from raw data).
    forbidden_dispositions_on_this_set:
      - reject_scoped, on a single unreplicated empirical_only run
      - support, or any reading that HEUR-ECTD-TAIL-1 is validated
      - any closure of GOAL-ECTD-001 or of the RQ-ECTD-001 lane
      - any trapdoor, path-hiding-strength, or crypto-scale claim
      - any statement that class-internal algebraic heavy tails are
        impossible; the evidence covers 5 classes at one bit-length only
  claim_tier: toy
  created_at: '2026-07-31'
  updated_at: '2026-08-06'
  archived_by_task: TASK-20260806-411ffd
  notes:
