      Admit conditions from independent review TASK-20260731-049 embedded:
      permutation null, mandatory planted outlier, Semaev-shaped degree-profile
      null, scoped null wording, HEUR-ECTD-TAIL-1 not credited from JMV alone.
    - IDEA-20260731-017/018 revised separately; not part of this hypothesis statement.
    - >-
      BATCH-fca4e2 (DEC-20260806-4a9604): first execution of EXP-ECTD-001.
      scoped_homogeneity on the 5-class screen weakens only the confirmed-
      outlier reading at 40-bit N; see status_scope above for the full,
      itemized boundary. CTRL-NO-CLASS-INVARIANT-ENDPOINT is on the merits a
      genuine structural N/A (this hypothesis never nominates a secret
