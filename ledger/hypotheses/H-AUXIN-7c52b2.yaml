hypothesis:
  id: H-AUXIN-7c52b2
  question_id: RQ-AUXIN-f8d8c0
  derived_from_idea: IDEA-20260906-81648b
  goal_ids: [GOAL-AUXIN-a93442]
  statement: >-
    For the supplied-input r-1 branch, independently certified first-stage residues
    of k=log_zeta(x) modulo divisors m_i of n=r-1 combine into exactly one coset
    modulo M=lcm(m_i), or reject if incompatible. A correct implementation must
    enumerate precisely n/M candidate exponents, preserve coverage under repeated
    and nested constraints, and detect incompatible residues. Consistency alone
    does not authenticate auxiliary powers against the original target.
  mechanism: >-
    For prime r and nonzero x, choose a certified primitive zeta in F_r. Supplied
    Q_i=[x^d_i]P with d_i dividing n supports a source-defined first stage giving
    a_i=k mod m_i, m_i=n/d_i. Fold generalized CRT with gcd consistency checks,
    yielding k0 in [0,M). The candidates k0+M*t, 0<=t<n/M, contain the correct
    exponent when every input residue concerns the same target. Recover x by
    checking [zeta^(k0+M*t)]P against the original Q=[x]P. The finite calibration
    begins with synthetic residues; it implements neither Cheon's first stage
    nor an elliptic-curve attack. Future group interfaces are specified separately.
  assumptions:
    - r is prime; P has exact order r in the prospective source group.
    - n=r-1 has the complete checked factorization declared in the finite contract.
    - zeta has exact multiplicative order n; x=0 uses a separate identity branch.
    - Each m_i divides n and d_i=n/m_i; residue inputs are canonical integers.
    - Correct supplied powers and their acquisition are explicit inputs, not derived for free from Q.
    - Synthetic residue fixtures disclose their stronger arithmetic information and cannot certify a group first stage.
    - The r+1 branch, deployment applicability, and ordinary-input ECDLP are outside this hypothesis.
  proof_search_map:
    bottleneck: >-
      Separate actual independent modulus coverage from redundant inputs, and
      separate residue arithmetic from legal acquisition and group-operation costs.
    baseline_embedding:
      parameter_slice: A single m dividing n; M=m and residual length L=n/m=d.
      reproduction_check: >-
        The arithmetic implementation must reproduce the independent enumeration
        oracle for every finite exponent. The source's single-divisor expression
        sqrt(m)+sqrt(d), with its logarithmic factors, is recorded only as a model;
        reproducing actual group work is a later independently approved experiment.
    observation_collision:
      observable: M, the complete candidate exponent set, and L=n/M.
      distinct_preimage_search: >-
        Compare panels [20], [4,10], [4,5], [5,10,20], [4,5,20,20], and [1,4,10]
        for every same r,k and order variant. They have identical coverage but
        different supplied lists and modeled first-stage costs.
    constructive_transforms:
      - transform: specialization_pack
        description: Append a repeated or divisibility-redundant constraint.
        proposed_object: P02 relative to P01; P03 and P07 relative to P06.
        predicted_gain: Zero additional coverage; input and first-stage costs remain charged.
      - transform: specialization_pack
        description: Add a compatible constraint with a new coprime factor.
        proposed_object: P05 and P09 with their explicitly supplied powers.
        predicted_gain: Exact LCM coverage only; no established net computational improvement.
      - transform: observable_fiber
        description: Shift all residues by one while keeping the original target fixed.
        proposed_object: Every informative positive panel's wrong-target control.
        predicted_gain: CRT remains consistent but final target verification must find zero matches.
    quantifier_order: >-
      For every allowed prime r, every nonzero x, and every list of correctly
      supplied powers, each authentic residue concerns the same k. For every such
      list CRT has exactly n/M solutions. Favorable cost requires additional
      existence, supply, algorithm, memory, and success assumptions; those
      assumptions are not inferred from coverage and are not validated here.
    method_ceiling:
      strongest_certifiable_claim: >-
        Exhaustive arithmetic correctness and functioning artifact-detection
        controls at r=101 and 241, plus explicitly labeled model comparisons.
      nearby_object_control: >-
        Compatible residues of k+1 paired with the original target x must not
        recover x for M>1. Incompatible residues must reject; nonprimitive zeta
        must fail the input gate. These defeat consistency-as-authentication,
        multiplication-of-overlapping-moduli, and unvalidated-generator arguments.
    proof_obligations:
      - claim: The two-congruence gcd condition and CRT fold produce the full intersection.
        responsibility: correctness
        owner: Design derivation; later independent arithmetic verifier and reviewer.
      - claim: Every M divides n and a compatible coset contains exactly n/M exponents.
        responsibility: size
        owner: Design derivation; exhaustive reference enumeration in the future run.
      - claim: Primitive zeta gives distinct candidate scalars and correct original-target verification.
        responsibility: correctness
        owner: Design derivation; independent verifier and generator-gate controls.
      - claim: Supplied powers support certified first stages and residual group search at stated costs.
        responsibility: interface
        owner: Future source-group protocol and independent review; unresolved by this calibration.
      - claim: Any end-to-end advantage survives supply, time, peak memory, data, and success accounting.
        responsibility: runtime
        owner: Future cost and frontier review; includes memory/data/success; no advantage asserted here.
    not_applicable_reason: null
  predictions:
    - metric: Exact candidate-set agreement with independent exhaustive enumeration.
      direction: different
      comparison_meaning: Detect any departure from exact set agreement; expected mismatch count is zero.
      minimum_effect: All 26520 scalar-constraint cases agree; no tolerated mismatch.
    - metric: Artifact-control sensitivity.
      direction: different
      comparison_meaning: Distinguish the declared false objects from correct positive fixtures.
      minimum_effect: All incompatible and wrong-target controls are distinguished; product-LCM mutant caught in 5100 positive cells.
    - metric: Net acquired-input group cost per certified recovery.
      direction: different
      minimum_effect: Not measured by EXP-AUXIN-684adf; no positive end-to-end claim is permitted.
  test_boundary:
    instances:
      - Exhaustive n=100 exponent set with twelve positive, four inconsistent and ten wrong-target panels.
      - Exhaustive n=240 exponent set with the same declared panel families.
      - Twelve malformed fixtures and one zero-target boundary per prime.
    parameters:
      primes: [101, 241]
      scalar_positions: [100, 240]
      positive_panels_per_prime: 12
      inconsistent_panels_per_prime: 4
      wrong_target_panels_per_prime: 10
      order_variants: 3
      malformed_fixtures: 24
      zero_boundaries: 2
      total_cases: 26546
    implementation: Pure arithmetic CRT fold and independently written full-domain enumeration; prospective code only.
    budget:
      maximum_runs: 1
      maximum_workers: 1
      memory_gb: 4
      wall_clock_seconds: null
      total_cpu_hours: null
  falsification_conditions:
    - A valid completed calibration has any mismatch with independently enumerated candidate sets or verification outcomes.
    - Repetition or equal-LCM substitution changes the predicted residual count at fixed target.
    - Incompatible residues are accepted or a wrong-target residue system is reported as a certified recovery.
    - The intentionally faulty product-of-moduli rule escapes its declared matched controls.
  interpretation_limits:
    - A counterexample first triggers artifact and implementation diagnosis; it is not evidence against the CRT theorem.
    - Infrastructure failure or incomplete artifacts yield inconclusive calibration, not mathematical falsification.
    - Passing cells establish finite arithmetic implementation behavior, not measured Cheon cost or a new exponent.
    - Generalized CRT is elementary; Cheon's published Corollary 1 already combines multiple powers using CRT.
    - The historical proposal's illustrative exponent budget is not adopted as a new asymptotic claim.
    - Contextual GOAL-AUXIN-a93442 remains unchanged; this design neither activates nor completes it.
