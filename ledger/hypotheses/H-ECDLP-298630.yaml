  title: >-
    One lambda fills all 36 pair sums, and the other stops at 28.
  statement: >-
    On y^2 = x^3 + x + 3 over the field of 151 elements, the point
    (1, 55) lies on the curve and 167 times that point is the
    identity. The integer 167 is prime. Thirteen squared is 169,
    which is above 151, so twice the square root is strictly below
    26, and 167 is the only multiple of 167 in the resulting
    interval around 152. The invariant is 72. The residue of 1728
    is 67, so the invariant is neither 0 nor 67. The multipliers 5
    and 23 both have order 166 modulo 167. Their length-8 exponent
    lists are 1, 5, 25, 125, 124, 119, 94, 136 and 1, 23, 28, 143,
    116, 163, 75, 55. The multiset pair-sum count C(9, 2) is 36.
    The first window meets that count. The second window has 28
    sums, short by 8. A window of length 8 keeps the first seven
    steps inside and leaves on the last index, so the escape
    fraction is 1/8. The ratio sqrt(8) is strictly above 2.828 and
    strictly below 2.829, so the written comparison with the group
    order is strictly above 472.276 and strictly below 472.443.
    The logarithm of 167/9 is strictly above 4.21 and strictly
    below 4.22.
  mechanism: >-
    The proposal prices membership in a length-B scalar window.
    This contract checks the two frozen windows, the pair-sum
    counts, and the cost comparison at B = 8. It does not search
    for an index.
