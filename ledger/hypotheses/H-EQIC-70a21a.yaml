hypothesis:
  id: H-EQIC-70a21a
  question_id: RQ-EQIC-8cb959
  derived_from_idea: IDEA-20260807-1ea327
  status: proposed
  added: '2026-08-25'

  statement: >-
    SCOPE. Prime fields F_p with p = 1 mod 3 at field_bits in {12, 16, 20}; curves
    E/F_p with j = 0, i.e. a = 0 and E of the form y^2 = x^3 + b; arity 2 only;
    factor bases V that are unions of m complete mu_3-orbits with |V| = 3m and the
    degenerate orbit x = 0 excluded; monomial order grevlex; solver sympy.groebner
    over modulus p. CLAIM TIER toy for every measurement, derivation tier for the
    symbolic degree statements. NO ATTACK, NO EXPONENT MOVED, NO CRYPTO-SCALE CLAIM.

    THE HYPOTHESIS, IN FOUR PARTS.
    (S1) SYMBOLIC, EXACT. The third summation polynomial S_3 of y^2 = x^3 + a x + b
      satisfies S_3(z x1, z x2, z x3) = z S_3(x1, x2, x3) for z a primitive cube root
      of unity IF AND ONLY IF a = 0; that is, S_3 is a weight-1 relative invariant of
      the diagonal mu_3-action exactly on the j = 0 family.
    (S2) SYMBOLIC, EXACT. For a mu_3-stable V of size 3m the membership polynomial
      factors as f_V(x) = g(x^3) with deg g = m, and the two norm forms built as
      resultants have degrees deg_u1 T_rel = 2, deg_x2 T_rel = 6,
      deg_u1 T = deg_u2 T = 6, total degree of T = 12.
    (S3) THE COST CLAIM UNDER TEST. At matched |V| = 3m and matched targets, at least
      one of the two invariant encodings ENC-ASYM and ENC-SYM attains a Groebner
      wall-time ratio against the incumbent ENC-X of at least 2.0 at the largest
      affordable m, with the ratio increasing in m, and a maximum-total-degree proxy
      lower by at least 2.
    (S4) THE ATTRIBUTION CLAIM, WHICH IS THE ONE THE RECORD IS REALLY ABOUT. Whatever
      saving (S3) finds is attributable to the mu_3 ENDOMORPHISM and not merely to the
      cube substitution u = x^3, measured as the difference between the ENC-X/ENC-SYM
      wall-time ratio at a = 0 and the same ratio at a != 0 where the substitution
      still formally goes through but no automorphism exists.

    PRE-REGISTERED COMPETING EXPLANATION, HELD AS THE MORE LIKELY ONE. The r-fold
    per-variable degree inflation (2 -> 6) and the r^2-fold candidate deflation
    (9 m^2 -> m^2) cancel to within measurement noise, so the invariant encoding is a
    change of coordinates with no cost consequence and (S3) fails. Under the
    lossy-projection test of docs/inventor-protocol.md that verdict is a controlled
    null and is a deliverable, not a disappointment.

  mechanism: >-
    The mu_3-action x -> z x on the x-line of a j = 0 curve is linear and by scalars,
    so its invariant ring is the polynomial ring F_p[u] with u = x^3 and the quotient
    map is 3-to-1 away from x = 0. Two exact consequences drive the design.
    FIRST, the factor-base membership constraint collapses in degree: a union of m
    complete orbits has f_V(x) = prod_j (x^3 - u_j) = g(u) with deg g = m, so "x lies
    in a base of size 3m" becomes a degree-m condition in u instead of degree 3m in x.
    SECOND, the decomposition condition survives the quotient as a NORM: with
    T_rel(u1, x2) = Res_x1(S_3(x1, x2, x_R), x1^3 - u1) and
    T(u1, u2) = Res_x2(T_rel(u1, x2), x2^3 - u2), T vanishes at (u1, u2) if and only
    if some mu_3-conjugate tuple decomposes x_R, because the action permutes the
    factors of the norm. The price is per-variable degree 2 -> 6; the gain is
    candidate count 9 m^2 -> m^2 and membership degree 3m -> m. Groebner cost is
    governed by the highest degree reached, roughly (n + D choose D)^omega
    (KN-TECH-011), so the sign of the product of an inflation and two deflations is
    not derivable and must be measured on one fixed solver with the encoding as the
    only varied factor. Relation arithmetic is unchanged by construction: a solved
    ENC-SYM system yields exactly ONE independent relation over the m reduced
    unknowns, because phi acts on the group as a scalar lambda with
    lambda^2 + lambda + 1 = 0 and the other eight conjugate solutions give
    lambda-multiples of the same equation. The reformulation therefore changes the
    algebraic cost of finding a relation and nothing else.

  assumptions:
    - >-
      p = 1 mod 3 and a primitive cube root of unity exists in F_p, re-verified per
      instance (zeta != 1 and zeta^3 = 1).
    - >-
      p > 3, so u = x^3 is separable away from 0 and each nonzero cube has exactly
      three cube roots in F_p.
    - >-
      x = 0 is a degenerate mu_3-orbit of size 1 and is excluded from every factor
      base; including it silently breaks f_V(x) = g(x^3) and is the most likely way
      to obtain wrong degrees.
    - >-
      sympy resultant and Groebner over modulus p are correct at these sizes; checked
      by degree verification and by independent certificate re-verification of every
      claimed decomposition.
    - >-
      Solving-degree proxies are IMPLEMENTATION-BOUND (KN-TECH-004). Only trends
      across encodings on the identical solver are interpretable; absolute timings
      are never a crypto-scale statement.

  proof_search_map:
    bottleneck: >-
      The Groebner solve of the arity-2 decomposition system. It is the only step
      this hypothesis proposes to change; base construction, certificate checking and
      linear algebra are held fixed across the three encodings by construction.
    baseline_embedding:
      parameter_slice: >-
        ENC-X is the r = 1 slice of the claimed family. Setting the order of the
        automorphism acting on the x-line to 1 makes the norm a single factor, so
        T = S_3 and g = f_V, and ENC-SYM degenerates to ENC-X symbolically.
      reproduction_check: >-
        Frozen regression fixture. On a fixed instance and target, assert as an exact
        polynomial identity that T built with the one-element conjugate set equals
        S_3(x1, x2, x_R) under u_i = x_i, and that the two Groebner runs return
        identical reduced bases. A mismatch halts the line before any comparative
        number is produced.
    observation_collision:
      observable: >-
        The pair (maximum total degree of the reduced Groebner basis, Groebner wall
        time), which is what carries the cost conclusion.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, which is why the a != 0 null is blocking.
        Two systems can share the observable, one arising from a genuine mu_3
        automorphism (a = 0) and one from the formally identical cube substitution on
        a curve with a != 0 where no automorphism exists. A collision does not
        falsify the measurement; it BOUNDS what the measurement may be attributed to.
        Reporting an ENC-SYM saving without having run this search is prohibited.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the decomposition test from F_p[x1, x2] to the invariant subring
          F_p[u1, u2], where base membership is the exact degree-m condition
          g(u_i) = 0 and decomposition is the exact vanishing of a norm. Completeness
          from the norm identity; soundness from independent point-sum certificates;
          transfer via one relation over m reduced unknowns.
        predicted_gain: >-
          Candidate count 9 m^2 -> m^2 at the price of per-variable degree 2 -> 6.
          Whether the product is below 1 is exactly the measurement, and both signs
          are pre-registered.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable fixed and vary the forgotten structure, comparing the
          same u-system arising from a = 0 (real automorphism) against a != 0 (no
          automorphism). The intrinsic invariant separating them is the weight-1
          semi-invariance of (S1), which is a symbolic identity and not a measurement.
        predicted_gain: >-
          Either the observable separates the two, in which case the endomorphism is
          load-bearing, or it does not, in which case the honest headline is that the
          cube substitution lowers the membership degree and the endomorphism is
          irrelevant to the solver.
    quantifier_order: >-
      INTENDED. FOR ALL j = 0 curves in the declared toy family, FOR ALL mu_3-stable
      bases V of size 3m in the declared family, FOR ALL targets R in the declared
      stream, THERE EXISTS an encoding among {ENC-ASYM, ENC-SYM} whose measured
      solving-degree proxy is at most that of ENC-X. NOT CLAIMED, and explicitly
      audited against: the weaker order in which the winning encoding may depend on
      the target, which would make the result unusable because the choice cannot be
      made before solving. The contract reports per cell whether one encoding wins
      UNIFORMLY over the target stream; a varying winner downgrades the claim.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On j = 0 prime-field curves in this toy family, at arity 2, with this solver
        and this factor-base family, the invariant encoding reaches a solving-degree
        proxy lower by a measured factor F." It can never certify an exponent change,
        anything about a != 0 curves, anything at higher arity, anything about an
        optimized F4/F5, or anything about the ECDLP.
      nearby_object_control: >-
        The a != 0 curve carrying the formally identical cube substitution, which is
        the closest object on which an endomorphism-attributed conclusion must fail.
    proof_obligations:
      - claim: S_3 is weight-1 mu_3-semi-invariant if and only if a = 0.
        responsibility: correctness
      - claim: f_V(x) = g(x^3) with deg g = m for a mu_3-stable V of size 3m.
        responsibility: correctness
      - claim: T_rel and T have the stated bidegrees.
        responsibility: size
      - claim: T(u1, u2) = 0 if and only if some conjugate tuple decomposes x_R.
        responsibility: completeness
      - claim: every reported decomposition carries a re-verified certificate.
        responsibility: soundness
      - claim: ENC-SYM at r = 1 reproduces ENC-X as an exact identity.
        responsibility: baseline
      - claim: one solved system yields exactly one independent relation.
        responsibility: scope

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Explicitly null. No exponent moves. At arity 2 over a prime field the
    relation-collection cost is linear in N in either search convention; this
    hypothesis changes the per-search algebraic cost only, and says so.

  heuristic_assumptions: []
  heuristic_assumptions_note: >-
    Empty by design. Every load-bearing statement in (S1) and (S2) is a symbolic
    identity checkable at zero compute; (S3) and (S4) are measurements, not
    conditional claims. Nothing here is conditioned on an unproved distributional
    assumption, and recording an empty list is the honest form of that.

  predictions:
    - metric: >-
        maximum total degree of the reduced Groebner basis, ENC-SYM against ENC-X,
        same instance and target, |V| = 3m fixed
      direction: lower
      minimum_effect: >-
        A reduction of at least 2 at the largest affordable m, sustained over at
        least 20 targets. A reduction of 0 or 1 is pre-registered as CANCELLATION
        and is recorded as a controlled null, never as a weak positive.
    - metric: Groebner wall-time ratio ENC-X over ENC-SYM, and ENC-X over ENC-ASYM
      direction: higher
      minimum_effect: >-
        At least 2.0 at the largest affordable m for at least one invariant encoding,
        with the ratio INCREASING in m. A ratio above 1 but flat in m is a fixed
        overhead difference, not a structural saving, and is reported as such.
    - metric: constructed degrees of T_rel and T
      direction: different
      minimum_effect: >-
        Exactly deg_u1 T_rel = 2, deg_x2 T_rel = 6, deg_u1 T = deg_u2 T = 6, total
        degree 12. Zero tolerance; any deviation falsifies the degree bookkeeping
        cheaply and immediately.
    - metric: >-
        NULL-1 separation, defined as the ENC-X/ENC-SYM wall-time ratio at a = 0
        minus the same ratio at a != 0 under the formal cube substitution
      direction: higher
      minimum_effect: >-
        At least 0.5. Below 0.5 means the endomorphism contributes nothing beyond the
        substitution. THIS IS THE PREDICTION MOST LIKELY TO FAIL and is first-class
        for that reason.
    - metric: independent relations recovered per solved ENC-SYM system
      direction: different
      minimum_effect: >-
        Exactly 1.000. Above 1 contradicts the relation arithmetic and H-ENDO-001;
        below 1 means solutions are not being converted and the pipeline is broken.

  test_boundary:
    instances: >-
      j = 0 curves y^2 = x^3 + b over F_p with p = 1 mod 3, one curve per
      (field_bits, seed) cell, plus one matched a != 0 curve per cell at the same p
      and comparable group order for the blocking null.
    parameters:
      field_bits: [12, 16, 20]
      seeds: [1, 2, 3]
      arity: 2
      factor_base_size: >-
        |V| = 3m a multiple of 3, with 3m the largest multiple of 3 not exceeding
        floor(sqrt(N)); x = 0 excluded
      targets_per_cell: 20
      monomial_order: grevlex
      encodings: [ENC-X, ENC-ASYM, ENC-SYM]
    implementation: >-
      Pure Python with sympy for resultants and Groebner over modulus p; the existing
      harness/semaev.py call path with the system swapped, and
      harness/semaev.py verify_decomposition_certificate for independent
      re-verification. No Sage. Recorded through harness/runner.py.
    budget:
      wall_clock_seconds: 5400
      total_cpu_hours: 8.0
      memory_gb: 8
      maximum_runs: 60

  distinguishable_outcomes:
    - outcome: >-
        SYMBOLIC GATE FAILS. S_3 is not weight-1 semi-invariant at a = 0, or it IS
        semi-invariant at a != 0, or the constructed norms do not have the declared
        degrees.
      what_observing_it_would_mean: >-
        (S1) or (S2) is false. The hypothesis is refuted at zero compute by a
        symbolic counterexample certificate, and it is SUPERSEDED under a new id
        rather than repaired. Every cost prediction built on the degree bookkeeping
        is void and no comparative number may be reported.
    - outcome: >-
        SAVING PRESENT AND ATTRIBUTED. Wall-time ratio at least 2.0 and increasing in
        m for an invariant encoding, degree proxy lower by at least 2, AND NULL-1
        separation at least 0.5, with the r = 1 fixture and all certificates passing.
      what_observing_it_would_mean: >-
        (S3) and (S4) both hold in scope. The mu_3 endomorphism, not the cube
        substitution, lowers the algebraic cost of the arity-2 decomposition step on
        j = 0 prime-field curves at toy scale with this solver. This is the maximal
        supportable reading; it is still a constant-factor improvement to one step of
        a method dominated by rho, and it transfers to no standardized curve because
        no curve in this program's target set has j = 0.
    - outcome: >-
        SAVING PRESENT BUT NOT ATTRIBUTED. Ratio at least 2.0 but NULL-1 separation
        below 0.5, i.e. the same saving appears on the a != 0 curve.
      what_observing_it_would_mean: >-
        (S3) holds and (S4) FAILS. The measured saving is a property of the cube
        substitution, which lowers the membership degree, and the endomorphism is not
        load-bearing. The honest headline is exactly that; no phi-attributed claim
        may be made anywhere in the campaign, and the lossy-projection verdict is
        that the projection u = x^3 discards nothing the solver was using about phi.
    - outcome: >-
        CANCELLATION. Ratios within [0.8, 2.0] at every m, or above 1 but flat in m,
        with all gates passing.
      what_observing_it_would_mean: >-
        (S3) FAILS and the pre-registered competing explanation is confirmed: the
        r-fold degree inflation and the r^2-fold candidate deflation cancel, so the
        invariant encoding is a change of coordinates with no cost consequence. This
        is a controlled null and is the deliverable; the obstruction is named as
        per-variable degree inflation and the forward pointer is the arity-scaling
        record IDEA-20260807-5ddccf.
    - outcome: >-
        INVARIANT ENCODING STRICTLY WORSE. ENC-SYM wall time exceeds ENC-X at every
        tested m, or the winner varies target by target within a cell.
      what_observing_it_would_mean: >-
        (S3) is refuted in the stronger direction, or the quantifier order is the
        weak one and the result is algorithmically unusable. Either way the invariant
        encoding is not adopted at arity 2, and the measured degree-inflation cost is
        the recorded obstruction over the tested scope only.
    - outcome: >-
        INFRASTRUCTURE. Resultant construction or Groebner exceeds the memory or time
        budget, or sympy raises.
      what_observing_it_would_mean: >-
        NOTHING ABOUT ENCODINGS (AGENTS.md rule 5). The run is
        failed_infrastructure, is never negative mathematical evidence, and the
        contract is re-dispatched at smaller field_bits or returned to the Executor.

  falsification_conditions:
    - The symbolic semi-invariance gate fails in either direction.
    - The constructed norms do not have the degrees declared in (S2).
    - ENC-SYM at r = 1 does not reproduce ENC-X as an exact identity.
    - >-
      NULL-1 shows the same saving at a != 0, which refutes (S4) and forbids any
      phi-attributed claim.
    - >-
      Wall-time ratios stay within noise of 1 across all m, which refutes (S3) and
      records the cancellation verdict.
    - Independent relations per solved system is not exactly 1.

  interpretation_limits:
    - >-
      NO EVIDENCE ABOUT H-STR-002 IS PRODUCED IN EITHER DIRECTION. No displacement
      rank, no relation matrix, no linear-algebra cost. DEFER-BATCH009-001 is
      untouched.
    - >-
      Toy tier at p up to about 20 bits in pure Python. No crypto-scale statement.
    - >-
      Scoped to j = 0, CM discriminant -3, a measure-zero curve family. No
      standardized curve in this program's target set has j = 0, and a j = 0 curve
      cannot be reached by isogeny walking from a class that lacks one.
    - >-
      A maximal positive is a constant-factor improvement to one step of a method
      already dominated by parallel rho over prime fields (KN-LIT-006, KN-TECH-018).
    - Arity 2 only. The arity ceiling is a separate record and is not covered here.

