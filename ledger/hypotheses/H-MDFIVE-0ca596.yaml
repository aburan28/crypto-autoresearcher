  falsification_conditions:
    - >-
      PO-2 fails in EITHER direction (distinct_fwd or distinct_bwd equals 1 at
      any of the four held-fixed values): the two-free-word construction is
      falsified AT THIS SEPARATION AND COMPONENT, the separation and
      branch-coverage reasoning is shown to be an insufficient design criterion,
      and NO declared-scale run happens. This is the single most informative
      possible negative outcome and it costs seconds.
    - >-
      distinct_fiber_sets = 1 while both per-side counts exceed 1: the match
      condition factorizes, the instrument is two decoupled univariate searches
      wearing a MITM costume, STOP.
    - >-
      PO-1 PASSES on the batch-4 slice: the detector cannot see a proved
      degeneracy, the gate is void, and the batch stops and reports a broken
      instrument rather than any mathematical result.
    - >-
      PO-3 fails (direction A's four held-fixed repetitions are not
      byte-identical): chunk1_observable reads free word B, contrary to its
      specification. Implementation defect, STOP.
    - >-
      PO-4 fails (certificate-verified MITM set differs from the naive
      Y-reproducing set at k1 = k2 = 6): the construction or its implementation
      is wrong. In particular a MISS of the planted pair falsifies the claim that
      both free words' influence reaches component p.
    - >-
      PO-5 fails (a raw projection covers its full window, or the raw candidate
      count exceeds 4): a degenerate word channel survived the gate. STOP and
      report -- this would mean PO-2's predicate is weaker than believed, which
      is itself a finding about the gate.
    - >-
      PO-6 fails: exact invertibility is broken in the new module and nothing
      downstream of it in that run is trustworthy.
    - >-
      PO-9 fails: the component identity is off by one and the declared
      observable is not the declared observable.
    - >-
      Matching-window collision variance < 64 across N targets: instrument
      degeneracy of the ANOM-1 class, classified as a STOP and explicitly NOT as
      an H1 falsification -- the classification is frozen here, before the data
      exists.
    - >-
      Chi-square p <= 0.05 with sample variance inside [128, 512]: HEUR-H1 is
      genuinely falsified at this bounded scale for this primitive. A reportable
      finding, not a defect.
    - >-
      HEUR-H1b's contrast shows v6 below 48 distinct 32-bit values over a
      64-value sweep on either side: H1b falsified at these parameters and the
      component choice must be revisited before any statistical reading.
    - >-
      Any MD5-versus-MD4 difference in the GATE's verdict: an implementation
      defect in the shift, constant or add_b substitution, STOP -- the schedule
      and F are shared, so the dependence structure cannot legitimately differ.

  interpretation_limits:
    - >-
      CLAIM CEILING: `analyzed`, NEVER `supported`, for every record derived from
      this hypothesis (DEC-20260821-84a8f1 claim_ceiling; DEC-20260821-1215e5
      F-5; BATCH-7215fa claim_ceiling). The gate-by-gate basis, stated rather
      than rounded up: this hypothesis carries NO asymptotic_claim, so
      CLAUDE.md's four supported-promotion gates are assessed for honesty rather
      than because anything is near clearing them. GATE 1 (proof decomposition
      into single-responsibility lemmas with per-attempt-cost times
      inverse-success-probability bookkeeping) NOT MET and not attempted. GATE 2
      (numbered heuristics validated) NOT MET -- a passing run moves HEUR-H1 from
      untested to tested-once-at-toy-scale, which is not validation, and HEUR-H3
      remains untested by design. GATE 3 (concrete-cost table at standardized
      parameter sets addressing the approximately 2^64-block gap) NOT MET,
      explicitly out of scope, and PROHIBITED from being computed from batch 4's
      degenerate throughput. GATE 4 (independent review-adversarial plus red-team
      pass) planned and budgeted, and clears nothing on its own.
    - >-
      Everything here is scoped to MD4 Round 1 (16 of 48 steps), two free words
      of sixteen, a 20-bit target, the declared bounded k1/k2, the declared
      seeds, this single-core unoptimized Python instrument, and this batch's
      declared budget. No transfer to full 48-step MD4, full 64-step MD5, SHA-2,
      or any literature complexity figure is claimed or licensed.
    - >-
      A PASSING GATE PROVES ONLY that the observable varies with each free word
      at k1 = k2 = 4 for the four tested held-fixed values, on this fixed-word
      seed. It does not prove the construction is a good MITM, does not validate
      HEUR-H1, and makes no statement whatever about MD4's preimage resistance.
      The gate is not quantified over fixed-word seeds; that residual is stated,
      not solved.
    - >-
      The instrument can only recover a PLANTED pair -- 64 bits of freedom
      against a 128-bit output state. NO RUN OF IT IS A PREIMAGE OF ANYTHING.
    - >-
      PARETO HONESTY, CARRIED FORWARD RATHER THAN BURIED. On the object "recover
      the two planted free words at this bounded scale", a DECOUPLED
      option-(c)-style construction at (word8, word9, S = 9) STRICTLY DOMINATES
      R1-SEP10: forward position 0 is constant in word8 and backward position 0
      is the affine map C - word9, so word9 falls out of one modular subtraction
      and word8 out of a 2^k1 sweep -- about 2^k1 time and O(1) memory, against
      R1-SEP10's 2^k1 + 2^k2 time and 2^k1 memory. The gate re-derived and
      CONFIRMED this dominance. It is not disqualifying because that construction
      answers NEITHER question this batch asks -- its match condition factorizes,
      so it exhibits no joint two-word MITM and produces no matching-window
      collision distribution for HEUR-H1 to be tested against. CONSEQUENCE, AND
      IT IS BINDING: no record downstream of this hypothesis may present
      R1-SEP10's modeled 1490x or 512x ratio as evidence that R1-SEP10 is the
      cheapest way to recover two planted words. It is a ratio against the naive
      all-pairs baseline over the same restricted space, and a cheaper
      non-MITM alternative is on record.
    - >-
      NOVELTY IS UNVERIFIED AND NO NOVELTY CLAIM IS MADE. IDEA-20260821-ea35d1's
      `search_knowledge` attempt found the kb retrieval tools ABSENT from that
      session's tool surface; Grep over knowledge/ and ledger/ plus WebSearch
      were used as substitutes and their recall is a floor, not a measurement.
      Absence of a corpus hit licenses no inference (AGENTS.md knowledge
      retrieval policy). Both external references (Aoki-Sasaki FSE 2009;
      Zhong-Lai eprint 2010/583) carry provenance `recalled`, no primary text has
      been read by any agent in this program, and they support nothing. NO RECORD
      DOWNSTREAM OF THIS HYPOTHESIS MAY DESCRIBE THE SEPARATION RULE
      (j - i >= 4) OR THE BRANCH-COVERAGE REFINEMENT AS NOVEL, NEW, OR FIRST. A
      session that reads either primary text could reasonably downgrade the label
      to `known` or `adaptation` in a new record, and that would be a normal
      outcome, not a defect.
    - >-
      The literature figures 2^96, 2^102, 2^116.9 and 2^123.4 remain UNVERIFIED
      provenance in this corpus (KN-LIT-4878 bulk-seed relay; KN-LIT-582d77
      metadata-only) and are cited only as distant reference points establishing
      a distance this program is not attempting to cross. Provenance is never
      upgraded by assertion.
    - >-
      EVERY BATCH-af29f6 RAW METRIC cited anywhere in this record or downstream
      of it -- the 2048 chunk evaluations, the 1,048,576 naive baseline, the
      derived 512x, R = 1.0, and the 102899 to 289607 chunk-evals/sec throughput
      band -- CARRIES THE ANOM-1 CAVEAT (SC-4; KN-TECH-bb7e9f). Those are correct
      measurements of a degenerate instrument. The throughput band is used for
      exactly one purpose here, a feasibility check that an N = 1000 H1 run fits
      inside a 300 s ceiling, and for NO projection of any kind (SC-3;
      DEC-20260821-1215e5 F-8).
    - >-
      The propagation calculus and the mirror-image resolution are SYMBOLIC
      derivations, produced independently twice (idea-generator at
      TASK-20260821-6b78d4, coordinator at TASK-20260821-fad775). They are
      offered for a third, BLIND re-derivation by the review round
      (review-plan-2de43d blind_rederivation), not treated as settled by
      assertion. They prove INDEPENDENCE where independence holds -- a theorem --
      and only SUGGEST dependence where a position is inside the reachable set,
      because syntactic reachability over-approximates. That gap is exactly the
      gap batch 4 fell into and is why PO-2 is a mandatory measurement.

