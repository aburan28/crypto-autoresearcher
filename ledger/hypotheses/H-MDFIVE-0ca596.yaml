  statement: >-
    CONSTRUCTION R1-SEP10. In MD4 Round 1 (steps 1 to 16, word k consumed at
    step k+1), with the 14 words other than word 2 and word 12 held to
    pre-registered non-zero constants, split at S = 8 (chunk1 = steps 1 to 8
    forward from the standard IV over words 0 to 7; chunk2 = steps 9 to 16
    inverted backward from a declared Round-1 output state Y over words 8 to
    15), the boundary-state component at tuple position p = 3 of state8 --
    which under the module's rotating convention is v6, the register value
    produced at step 6 -- is a NON-DEGENERATE joint matching quantity for the
    free-word pair (word2, word12). Concretely, the declared matching
    observable low_m(v6) is a non-constant function of word2 computed forward
    and a non-constant function of word12 computed backward from Y, so that a
    two-chunk meet-in-the-middle search over the declared (k1, k2)-bit windows
    locates the planted (word2, word12) pair reproducing Y in (2^k1 + 2^k2)
    chunk evaluations rather than 2^(k1+k2), with every claimed pair
    independently re-verified by a straight-line 16-step forward recomputation
    against Y.
    THIS IS A CLAIM ABOUT A BOUNDED ROUND-1 TOY SLICE OF MD4 -- 16 of 48 steps,
    2 of 16 message words, a 20-bit target, k1 = k2 = 10 -- AND ABOUT NOTHING
    ELSE. It is not a claim about MD4 preimage resistance, not a claim about
    MD5, not an asymptotic claim, and not a novelty claim.

  mechanism: >-
    THE GOVERNING QUANTITY IS THE SCHEDULE SEPARATION BETWEEN THE TWO FREE
    WORDS, NOT THE SPLIT POINT AND NOT THE TUPLE INDEX. Write i for the step
    consuming the forward chunk's free word, j for the step consuming the
    backward chunk's free word, and read the boundary state after step S with
    i <= S < j. From the module's own return-tuple algebra
    (harness/run_md4_ceiling.py), forward_step maps tuple positions by
    new0 <- old3, new1 <- (all four positions, and the supplied word),
    new2 <- old1, new3 <- old2; backward_step maps them by
    new0 <- (all four positions, and the supplied word), new1 <- old2,
    new2 <- old3, new3 <- old0. Propagating the set of positions functionally
    reachable from the free word gives, forward, E_0 = {1}, E_1 = {1,2},
    E_2 = {1,2,3}, E_d = {0,1,2,3} for d >= 3; and, backward, D_0 = {0},
    D_1 = {0,3}, D_2 = {0,2,3}, D_r = {0,1,2,3} for r >= 3. Both chains are
    monotone increasing, d = S - i, r = j - 1 - S, and therefore
    d + r = j - i - 1 INDEPENDENT OF S. E_d intersect D_r is empty for
    d + r <= 2 and non-empty for d + r >= 3, so a single boundary component
    can carry BOTH dependencies exactly when j - i >= 4.
    R1-SEP10 takes i = 3 (word2) and j = 13 (word12), separation 10, far past
    that threshold. Separation alone is not sufficient, because the Round-1
    auxiliary function F(X,Y,Z) = (X AND Y) OR (NOT X AND Z) is BITWISE AND
    SELECTING -- a component whose only word-carrying input enters a single
    branch of one F inherits the word only where the gating register admits it,
    so its low-m window can be partly or wholly frozen by the fixed words. The
    construction therefore chooses the component into which the free word
    enters ALL THREE arguments of the F that produces it, on both sides.
    At S = 8, state8 = (v5, v8, v7, v6) and the four components carry
    (forward step-distance from word2, backward step-distance from word12) of
    v5 = (2,4), v8 = (5,1), v7 = (4,2), v6 = (3,3). Position 3 = v6 is the
    balanced maximum and is the declared choice. Position 1 = v8 -- the
    position batch 4 read, and the one the module docstring advertises as
    "the value most recently computed" -- is backward step-distance 1 even at
    separation 10 and is the WORST of the four.
    The instrument is then the ordinary meet-in-the-middle: enumerate word2's
    k1-bit window forward from a once-computed state2 (6 steps each) into a
    hash table keyed on low_m(v6); enumerate word12's k2-bit window backward
    from a once-computed state13 (5 inversions each) and probe; promote an
    m-bit hit to a k-bit hit only on exact equality; promote a k-bit hit to a
    solution only when an independent straight-line 16-step forward
    recomputation reproduces Y exactly.

  coordinator_derivation_note: >-
    THE PROPAGATION CALCULUS ABOVE WAS RE-DERIVED INDEPENDENTLY BY THE GATE
    (TASK-20260821-fad775) FROM harness/run_md4_ceiling.py's forward_step and
    backward_step source and their return tuples, NOT taken on the proposer's
    word. The gate's derivation AGREES with IDEA-20260821-ea35d1's on every
    load-bearing step, including the threshold j - i >= 4, the
    split-point-independence of d + r, and the conclusion that at the batch-4
    separation j - i = 1 no choice of S and no choice of component could have
    produced a jointly discriminating single-component matching quantity. That
    also independently CONFIRMS the Coordinator's pre-committed prior P-R1
    (review-plan-2de43d) and the previously UNSETTLED mirror-image paragraph of
    KN-TECH-bb7e9f, which is hereby recorded as SETTLED BY TWO INDEPENDENT
    SYMBOLIC DERIVATIONS (idea-generator at TASK-20260821-6b78d4; coordinator
    at TASK-20260821-fad775) and offered to the review round for a third,
    blind one. It is NOT recorded as measured, and KN-TECH-bb7e9f is not edited
    by this record.
    TWO LOCALISED CORRECTIONS THE GATE RECORDS RATHER THAN ABSORBS, both stated
    here before any run so that neither is discovered after the fact --
    (C-A) TERMINOLOGY. IDEA-20260821-ea35d1 calls the numbers (3,3) and
    (2,4)/(5,1)/(4,2) "F-layers" or "F-depth". They are STEP DISTANCES, not
    counts of F compositions. The minimum F-composition depth from word2 to v6
    is 1, since v6 = rotl(v2 + F(v5,v4,v3) + word5, s) and v3 carries word2
    directly. The load-bearing property IS true at those parameters and the
    gate verified it independently: word2 enters ALL THREE of v5, v4, v3, hence
    all three arguments of the F producing v6; and word12 enters ALL THREE of
    v9, v8, v7, hence all three arguments of the F producing v6 on the backward
    side. By contrast v8 backward has only v9 word12-dependent, entering as the
    Z-argument of F(v11,v10,v9) and gated bit-by-bit by v11 -- exactly the
    depth-1 selection risk. This record uses "step distance" and states the
    branch-coverage property explicitly; the design and its parameters are
    UNCHANGED.
    (C-B) A PREDICTED VALUE, NOT A CRITERION. IDEA-20260821-ea35d1 predicts
    distinct_fiber_sets "~16" at the k1 = k2 = 4 gate. The gate derives 2. With
    m = 12 the 16 forward and 16 backward window values fall in 4096 bins, so
    the expected number of non-planted matching pairs is 16 x 16 / 4096 =
    0.0625; the planted pair matches exactly by HEUR-H2, so the fiber map has
    one non-empty fiber and fifteen empty ones, giving exactly 2 distinct sets,
    with 3 acceptable (one spurious match, probability about 6%). BOTH
    predictions are pre-registered here, attributed, before any run. THE
    CRITERION distinct_fiber_sets >= 2 IS UNCHANGED AND IS NOT WEAKENED; the
    gate verified that it still separates the cases it exists to separate -- a
    construction degenerate in the backward word yields exactly 1 distinct
    fiber set whether or not the constant backward value happens to match, so
    the batch-4 slice fails it, as does any construction whose match condition
    factorizes on a single component.

  assumptions:
    - >-
      A-1 (THE EXPLICIT REPLACEMENT FOR BATCH 4's FALSE AND UNCHECKED
      BOTTLENECK CLAIM). For the declared (word2, word12, S = 8, p = 3) and the
      declared fixed-word seed, the forward-computed low_m window of v6 takes
      more than one value as word2 ranges over its window, AND the
      backward-computed low_m window of v6 takes more than one value as word12
      ranges over its window. The propagation calculus proves only that neither
      is FORCED constant; syntactic reachability over-approximates actual
      variation, and algebraic cancellation can still annihilate it. ACTUAL
      VARIATION IS AN EMPIRICAL CLAIM. DISCHARGED BY PROOF OBLIGATION PO-2
      (the mandatory k1 = k2 = 4 two-directional gate) AND BY NOTHING ELSE --
      not by the symbolic derivation, not by the RFC vectors, not by the H2
      inversion fixture, and not by the brute-force completeness control.
    - >-
      A-2. The implementation masks every addition and rotation to 32 bits and
      selects add_b correctly per primitive (MD4 has NO "+= b"; MD5 does). This
      exact distinction was a caught bug in the batch-4 module, whose first
      draft failed all seven RFC 1320 Appendix A.5 vectors. Discharged by PO-6
      and PO-7.
    - >-
      A-3. The 14 fixed words are generated from the declared seed BEFORE any
      run and are non-zero; an all-zero fixed word can collapse F.
    - >-
      A-4. The target-generation stream and the search enumeration are
      independently seeded, and the search never reads the planted words.
    - >-
      A-5. The declared window contains the planted pair by construction --
      the target generator draws the true low bits of words 2 and 12 from the
      same declared k1/k2-bit window the search enumerates, at every scale the
      contract declares (gate, control, and declared scale alike).
    - >-
      A-6 (COORDINATOR-ADDED, IMPLEMENTATION IDENTITY). G-0, the gate, the
      k1 = k2 = 6 controls, the declared-scale runs and any authorized MD5
      computation all invoke the SAME two named observable functions with only
      the declared parameter tuple (primitive, i, j, S, p, k1, k2, m, k)
      differing. No primitive-specific or parameter-specific branching exists
      inside those two functions beyond that tuple. Discharged by PO-8.

  proof_search_map:
    audit_rerun_attestation: >-
      All four audits were re-derived by the idea-generator against R1-SEP10 at
      TASK-20260821-6b78d4 and re-checked, not merely re-read, by the gate at
      TASK-20260821-fad775. No audit text from IDEA-20260821-e46061 is carried
      forward. Audit 1's bottleneck is a different bottleneck and now names its
      load-bearing assumption EXPLICITLY as A-1 with a single named discharge;
      audit 2's observable is different and its collision search is RUN rather
      than asserted; audit 3 adds a claim the previous record did not make and
      names its own quantifier weakness; audit 4's ceiling is a ceiling on the
      OBJECT rather than on the tuning. Joint R2 of review-plan-2de43d is
      invited to diff them.

    bottleneck: >-
      THE DECISION-CHANGING STEP IS THE CHOICE OF FREE-WORD SEPARATION TOGETHER
      WITH THE BRANCH-COVERAGE OF THE MATCHED COMPONENT -- not the split point
      and not the tuple index. Precisely, the step whose removal changes the
      result is "place the two free words at schedule distance j - i >= 4 AND
      read a boundary component into which each free word enters more than one
      argument of the F that produces it". Remove the first half (take
      j - i <= 3) and E_d intersect D_r is empty, so NO single-component
      matching quantity is jointly discriminating and the instrument degenerates
      to a one-free-word locator -- which is ANOM-1, now a derived prediction
      rather than a surprise. Remove the second half (keep the separation but
      read a step-distance-1 component such as tuple position 1 = v8, which is
      backward step-distance 1 even at separation 10) and the free word survives
      into the observable through a single gated F branch, so the low-m window
      can be partly or wholly frozen by the fixed words -- a partial,
      seed-dependent degeneracy a single lucky seed could hide. Both halves are
      load-bearing; both are MEASURED (PO-2 and PO-5), not assumed.
    bottleneck_contrast_with_batch_4: >-
      Batch 4's bottleneck claim (b) was "lands the matching point on a register
      that was just updated, so the comparison is meaningful". That is FALSE AS
      A DESIGN PRINCIPLE, and this record inverts it. "Just updated" is exactly
      tuple position 1, which is forward step-distance 0 and, at any useful
      separation, backward step-distance 1 or 0 -- the worst component of the
      four, not the best. R1-SEP10 deliberately reads the OLDEST boundary
      component still well inside the backward free word's reach.

    baseline_embedding:
      parameter_slice: >-
        The batch-4 construction is an EXACT PARAMETER SLICE of R1-SEP10's
        family: free_word_A = 8, free_word_B = 9, S = 9, p = 1, with the same
        (k1, k2, m, k). Same code path, same two observable functions, same
        extractor; only the parameter tuple differs.
      reproduction_check: >-
        A FROZEN NEGATIVE REGRESSION FIXTURE, not a numerical resemblance. At
        that slice the new module MUST REPRODUCE ANOM-1: through the SAME
        chunk2_observable function the declared-scale run calls, the
        backward-side distinct-value count over the free-word-B window must be
        EXACTLY 1 while the forward-side count over the free-word-A window must
        EXCEED 1. If the new module does not reproduce ANOM-1 at the old
        parameters, it does not implement the old construction and no comparison
        between them means anything. This fixture is proof obligation PO-1 and
        doubles as the NULL OBJECT for the batch's own detector -- the strongest
        available answer to KN-TECH-9d21c4's "can this null fail" line, because
        the null's verdict is not merely expected but already proved
        (EV-MDFIVE-ab007d, ANOM-1 caveat carried).
      symbolic_half: >-
        The fixture's expected outcome is DERIVED IN ADVANCE, twice
        independently. At (i = 9, j = 10, S = 9) the propagation rules give
        d = 0 and r = 0, so E_0 = {1} and D_0 = {0}, which are disjoint; and the
        backward pass-through is exact and window-independent, so
        distinct_bwd = 1 holds at any window width, including the gate's k = 4.
      carried_forward_prior_result: >-
        IDEA-20260821-e46061's negative baseline fact -- no neutral word
        survives a chunk spanning a full round, since Round 1 alone consumes
        every word exactly once -- still holds and still bounds any multi-round
        extension. Re-stated for the new object: R1-SEP10 requires both free
        words strictly inside Round 1 and at least 4 steps apart, so a
        round-crossing instrument cannot be obtained by widening this one.

    observation_collision:
      observable: >-
        The low m = 12 bits of v6, the boundary component at tuple position
        p = 3 of state8, computed forward from the IV as a function of word2 and
        computed backward from Y as a function of word12, compared for equality.
        Promotion to a full hit requires exact equality on the full k = 20 bits;
        promotion to a solution requires the independent 16-step certificate.
      distinct_preimage_search: >-
        COLLISIONS EXIST AND ARE PREDICTED IN ADVANCE WITH COUNTS, not argued
        away. Distinct (word2, word12) pairs sharing the 12-bit observable while
        differing in the 20-bit target -- expected 2^(k1+k2-m) = 2^8 = 256 per
        target at the declared scale. Distinct pairs sharing the full 20-bit
        target while only one reproduces Y, which is the pair this audit
        actually asks for -- expected 2^(k1+k2-k) = 2^0 = 1 besides the planted
        pair at the declared scale. THE OBSERVABLE IS THEREFORE INSUFFICIENT ON
        ITS OWN, and the separating condition is part of the construction: an
        independent straight-line 16-step forward recomputation reproducing Y
        exactly.
        THE SEARCH IS RUN, NOT REASONED ABOUT. At k1 = k2 = 6 the pair space
        (4096) is exhaustively enumerated, every pair whose low-20 bits agree is
        reported, and which of them reproduce Y is reported. Expected: the
        planted pair plus about 4096 / 2^20 = 0.004 others, i.e. usually none.
        At the declared scale the count of non-Y-reproducing full-target
        collisions must be REPORTED AS A NUMBER, never assumed to be zero.
      structural_collision_family_check: >-
        Searched for symbolically and NOT FOUND at step distances (3,3). This is
        reported as "none found symbolically", NOT as a claim that none exists.
        A forced family would show as a distinct-value count far below the sweep
        width, and the gate and the k1 = k2 = 6 controls both report those counts
        as integers, so a family would be detected rather than inferred. The
        batch-4 slice by contrast DOES have a forced family -- its entire
        free-word-B window is one, the fiber map being constant, which is what
        ANOM-1 is.

    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the naive 2^(k1+k2)-pair full-recomputation search over the
          restricted two-word space with a hash table keyed on low_12(v6), built
          from chunk1's 2^k1 forward candidates (6 steps each after a shared
          2-step prefix) and probed by chunk2's 2^k2 backward candidates
          (5 inversions each after a shared 3-inversion suffix).
        predicted_gain: >-
          MODELED at k1 = k2 = 10: 2^10 x 6 + 2^10 x 5 + 5 fixed = 11,269
          step-evaluations (about 2^13.46), plus about 256 window probes and
          about 2 certificate checks of 16 steps each, against 2^20 x 16 = 2^24
          step-evaluations for the literal naive all-pairs baseline over the SAME
          restricted two-word space -- a modeled ratio of about 2^10.5 (about
          1490x). In the coarser chunk-evaluation unit the ratio is
          (2^10 + 2^10) against 2^20, i.e. 512x.
          THAT 512x IS NUMERICALLY THE SAME AS BATCH 4's HEADLINE AND MUST NOT
          BE CONFUSED WITH IT. Batch 4's 512x was measured over a space its
          instrument searched as ONE effective free word
          (EV-MDFIVE-ab007d O-2; RUN-MDFIVE-primary-md4-v2; ANOM-1 CAVEAT,
          KN-TECH-bb7e9f), so its denominator did not mean what it appeared to
          mean. Here the same ratio would be over a genuinely two-word space IF
          AND ONLY IF the PO-2 gate passes. MODELED, NOT MEASURED, true only at
          these parameters, and projected nowhere.
      - transform: observable_fiber
        proposed_object: >-
          The fiber map wB -> {wA : the m-bit windows agree}, enumerated
          exhaustively at k1 = k2 = 4 and k1 = k2 = 6.
        predicted_gain: >-
          Not a speedup -- a DETECTOR. A constant fiber map is the exact
          operational signature of ANOM-1 (batch 4's fiber map was constant).
          Requiring the fiber map to be non-constant is part (iii) of the gate
          and catches what per-side distinct-value counts alone can miss,
          including any construction whose match condition factorizes on a
          single component.
      - transform: not_selected
        proposed_object: null
        predicted_gain: >-
          boundary_lift, stronger_invariant, telescoping_potential and
          specialization_pack are NOT selected and are recorded as inapplicable
          rather than omitted. R1-SEP10 is a bounded computational instrument --
          nothing composes over a recursion, there is no conditioning cost to
          telescope, and there is no additivity to prove.

    quantifier_order: >-
      CLAIM 1 (THE SEARCH CLAIM, EXISTENTIAL AND PER-TARGET). FOR the declared
      primitive P in {md4}, FOR the pre-registered fixed-word seed sigma, FOR
      each target t drawn from the declared seeded stream -- t fixing the planted
      pair (wA*, wB*) and hence Y(t) and target_low20(t) -- THERE EXIST
      (wA, wB) in W_A x W_B with low_m(v6_fwd(wA)) = low_m(v6_bwd(wB, Y(t))) AND
      low_k(v6_fwd(wA)) = target_low20(t) AND the 16-step certificate verifying.
      The witness IS ALLOWED to depend on t, sigma, P and (k1, k2, m, k). The
      witness IS NOT ALLOWED to depend on (wA*, wB*): the search may not read the
      planted words, and the feasibility obligation, not the search, is what
      guarantees the space contains them. NOT CLAIMED: "for all targets a match
      is found within the declared cost". NOT CLAIMED: any statement quantified
      over fixed-word seeds.
      CLAIM 2 (THE DISTRIBUTIONAL CLAIM, HEUR-H1, A PER-DRAW RANDOM VARIABLE).
      FOR the declared sigma and P, the matching-window collision count C_t, as
      t ranges over N independent draws, is claimed to be distributed as
      Poisson(lambda = 2^(k1+k2-m)). This is a claim about a DISTRIBUTION over
      the draw, not a bound holding for every draw, and it is tested by a
      goodness-of-fit statistic with lambda FIXED A PRIORI, so no parameter is
      estimated from the data and df = bins - 1.
      CLAIM 3 (THE GATE CLAIM, AND THE ONE WHOSE QUANTIFIER ORDER BATCH 4 GOT
      WRONG BY OMISSION). What must be true is: FOR ALL held-fixed values of the
      other free word, the map (this free word) -> observable is non-constant.
      What the mandatory gate tests is that property at FOUR pre-registered
      held-fixed values per direction. That is an EXISTENTIAL witness of
      non-degeneracy, strictly weaker than the universal statement, and this
      record says so rather than eliding it. It is a 4-fold-stronger existential,
      labeled as such, and it is not the universal claim.
      COORDINATOR ADDENDUM TO CLAIM 3, RECORDED RATHER THAN GLOSSED. In
      direction A the four held-fixed values of free word B are STRUCTURALLY
      INERT, because chunk1_observable does not read free word B at all. The
      four repetitions are therefore four identical computations and buy no
      quantifier strength whatsoever in that direction. They are retained for
      procedural symmetry AND are converted by PO-3 into a real, if narrow,
      implementation check: all four must be BYTE-IDENTICAL, and if they are not,
      chunk1_observable is reading free word B somewhere it must not, which is a
      defect and a STOP. Direction B's four held-fixed values of free word A are
      NOT inert: each regenerates the target Y, so each is a genuinely different
      backward computation.

    method_ceiling:
      strongest_certifiable_claim: >-
        UNDER IDEAL TUNING the strongest thing R1-SEP10 could ever certify is:
        "for MD4's Round 1, with 14 message words fixed and words 2 and 12 free,
        the planted pair reproducing a declared Round-1 output state Y is
        recovered by a two-chunk meet-in-the-middle search in (2^k1 + 2^k2)
        chunk evaluations rather than 2^(k1+k2), with the pair independently
        re-verified against a straight-line 16-step forward recomputation, and
        the matching-window collision counts either are or are not consistent
        with Poisson(2^(k1+k2-m))."
      hard_ceiling_on_the_object: >-
        THE INSTRUMENT CAN ONLY EVER RECOVER A PLANTED PAIR; IT CAN NEVER INVERT
        AN ARBITRARY Y. Two free 32-bit words supply 64 bits of freedom against a
        128-bit Round-1 output state, so for an arbitrary Y no solution exists
        with probability about 1 - 2^-64, and every "success" this instrument
        reports is conditioned on Y having been generated from a pair inside the
        declared window. This is a ceiling on the OBJECT, not on the tuning; no
        choice of k1, k2, m, k, split point or component escapes it. It is stated
        in advance so that no downstream record can read a successful run as a
        preimage result.
      free_word_capacity_ceiling: >-
        Within Round 1 at S = 8 and component v6, requiring step distance >= 2
        from both sides admits forward free words only at steps i <= 4 (words 0
        to 3) and backward free words only at steps j >= 12 (words 11 to 15) --
        at most 4 + 5 = 9 free words, 288 bits of freedom, still filtered through
        a single 32-bit component. Matching on ALL FOUR boundary components (a
        full 128-bit Round-1 connection) requires step distance >= 2 on every
        component, i.e. i <= 3 and j >= 14, for example (word2, word13). Both
        counts were re-derived and confirmed by the gate. That variant is
        reachable in this family and is named as the natural next rung; it is NOT
        attempted this batch.
      nearby_object_control: >-
        CONTROL 1, VERDICT ALREADY KNOWN FALSE -- THE BATCH-4 SLICE
        (word8, word9, S = 9, p = 1), where the hoped-for conclusion is proved
        false four independent ways (EV-MDFIVE-ab007d strength_note; ANOM-1
        caveat carried). R1-SEP10's own gate is REQUIRED TO DISTINGUISH THE PAIR:
        PASS on (2, 12, S = 8, p = 3) and FAIL on (8, 9, S = 9, p = 1), through
        the same code path. A method that cannot distinguish them has not
        identified the load-bearing structure and is simply a broken detector.
        This is the sharpest nearby-object control available anywhere in this
        goal, because the nearby object's verdict is not merely expected but
        already proved.
        CONTROL 2 -- MD5's ROUND 1 AT IDENTICAL PARAMETERS. PREDICTIONS STATED
        BEFORE ANY RUN. (i) The dependence structure is IDENTICAL, because the
        two primitives share the word schedule and F, and neither the "+= b" term
        nor the additive constants change WHICH tuple positions depend on the
        supplied word -- re-derived and confirmed by the gate. The gate MUST
        therefore pass for MD5 too; a gate that passes for MD4 and fails for MD5
        indicates an implementation defect in the shift, constant or add_b
        substitution, NOT a structural finding, and is a STOP. (ii) The
        full-target-hit ratio R = MD5/MD4 is expected to be about 1 by birthday
        counting alone for ANY non-degenerate instrument at these parameters and
        is DECLARED IN ADVANCE TO CARRY ESSENTIALLY NO INFORMATION; this
        pre-commitment exists to stop a repeat of EV-MDFIVE-ab007d O-4, where
        R = 1.0 was near-mechanically forced by the shared schedule (ANOM-1
        caveat). (iii) The INFORMATIVE comparison is the SHAPE statistic -- the
        chi-square p-value and the sample variance of the matching-window
        collision counts -- where the two primitives' different shift tables and
        additive constants genuinely can differ. A distinguishing result there is
        reportable only after a null-constant replication, which is NOT in this
        batch's scope or budget.

    proof_obligations:
      - claim: >-
          PO-1 (DETECTOR NULL CONTROL, RUNS FIRST, BEFORE PO-2). At
          k1 = k2 = 4 on the BATCH-4 PARAMETER SLICE (free words 8 and 9, S = 9,
          component p = 1), through the SAME two observable functions the
          declared-scale run uses, the two-directional predicate MUST REPORT
          FAIL, with distinct_bwd EXACTLY 1 and distinct_fwd > 1. PASS/FAIL
          PREDICATE: the obligation is discharged only if the predicate returns
          FAIL on this slice. If the predicate PASSES here, the detector cannot
          see a degeneracy that is already proved to exist, the whole gate is
          void, and the batch STOPS regardless of what R1-SEP10 does.
        responsibility: correctness
      - claim: >-
          PO-2 (THE MANDATORY TWO-DIRECTIONAL DEPENDENCE GATE -- HARD STOP).
          At k1 = k2 = 4, on the SAME declared matching observable through the
          SAME code path the declared-scale run uses: (i) sweeping free word A
          over its 16 window values with free word B held fixed must yield
          distinct_fwd_32bit >= 2 AND distinct_fwd_12bit >= 2, at each of four
          pre-registered held-fixed values; (ii) sweeping free word B with free
          word A held fixed must yield distinct_bwd_32bit >= 2 AND
          distinct_bwd_12bit >= 2, at each of four pre-registered held-fixed
          values; (iii) distinct_fiber_sets >= 2; (iv) a simultaneous both-word
          sweep DOES NOT DISCHARGE ANY PART OF THIS and must not be substituted
          for any part of it, though it may be reported as a clearly labeled
          supplement. All counts are reported AS INTEGERS. PASS if and only if
          PO-1 returned FAIL and (i), (ii) and (iii) all hold; any other outcome
          is FAIL. FAILURE IS A STOP: no declared-scale run happens, the measured
          counts are reported as integers, and the batch records the failure as a
          genuine finding about the construction. The full implementable form is
          in EXP-MDFIVE-a8e71e mandatory_dependence_gate, which is binding.
        responsibility: correctness
      - claim: >-
          PO-3 (COORDINATOR-ADDED, DIRECTION-A INERTNESS CHECK). Direction A's
          four held-fixed values of free word B must produce BYTE-IDENTICAL
          results, because chunk1_observable is specified not to read free word B
          at all. A discrepancy means chunk1_observable reads free word B
          somewhere it must not, which is an implementation defect and a STOP.
          This converts an admittedly inert repetition into a narrow but real
          check rather than leaving it as decoration.
        responsibility: correctness
      - claim: >-
          PO-4 (COMPLETENESS CONTROL, NON-VACUOUS BY CONSTRUCTION). At
          k1 = k2 = 6, the set of CERTIFICATE-VERIFIED MITM solutions equals the
          set found by a naive search that enumerates all 4096 pairs and, for
          each, runs an INDEPENDENT straight-line 16-step forward recomputation
          and compares the resulting Round-1 output state to Y. THE NAIVE SIDE
          NEVER CALLS backward_step, NEVER READS COMPONENT p, AND NEVER READS THE
          MATCHING WINDOW, so the two sides do not read the same potentially
          degenerate quantity -- which is precisely what made batch 4's
          k1 = k2 = 6 control vacuous (EV-MDFIVE-ab007d O-2; ANOM-1 caveat). THIS
          CONTROL CAN FAIL: if the separation or branch-coverage reasoning is
          wrong, the MITM misses the planted pair and the naive search still
          finds it.
          STATED LIMIT, HONESTLY: PO-4 tests COMPLETENESS, NOT NON-DEGENERACY. A
          construction degenerate in one free word would emit every value of that
          word as a raw candidate, all but one would fail the certificate, and the
          surviving sets would still match. PO-4 ALONE WOULD THEREFORE STILL PASS
          VACUOUSLY AGAINST ANOM-1. That is why PO-5 exists and why PO-2 is the
          gate.
        responsibility: baseline
      - claim: >-
          PO-5 (DEGENERACY CONTROL ON THE RAW SOLUTION SET -- THE CHECK BATCH 4
          DID NOT HAVE). At k1 = k2 = 6, the RAW PRE-CERTIFICATE MITM candidate
          set (pairs passing the full k = 20 bit equality, before the 16-step
          certificate) must satisfy BOTH: (a) the number of distinct wA appearing
          is strictly less than 2^k1 AND the number of distinct wB appearing is
          strictly less than 2^k2, i.e. neither projection covers its entire
          window; and (b) the raw candidate count is at most 4, against an
          expected value of about 1 + 4096 / 2^20. Batch 4's analogous raw set was
          exactly a full row -- one wA paired with every wB (EV-MDFIVE-ab007d O-1;
          ANOM-1 caveat) -- and would have failed BOTH parts. FAIL on either part
          is a STOP.
        responsibility: correctness
      - claim: >-
          PO-6 (EXACT INVERTIBILITY, HEUR-H2). backward_step composed with
          forward_step is the identity on at least 10,000 uniformly random
          (a, b, c, d, x, s, t) tuples, EXACTLY, for BOTH add_b conventions.
          Established for the batch-4 module (RUN-MDFIVE-buildcheck) but MUST be
          re-established for the new sibling module, which is new code and
          inherits nothing.
        responsibility: correctness
      - claim: >-
          PO-7 (PRIMITIVE CORRECTNESS). The new module reproduces all seven RFC
          1320 Appendix A.5 MD4 test vectors, and its MD5 T[1..16] table matches
          the RFC 1321 section 3.4 sine definition under the module's own
          self-check.
        responsibility: correctness
      - claim: >-
          PO-8 (COORDINATOR-ADDED, CODE-PATH IDENTITY). Every phase -- PO-1,
          PO-2, the k1 = k2 = 6 controls, the declared-scale runs, and any
          authorized MD5 computation -- records in the run manifest a
          code_path_fingerprint naming the fully qualified names of the two
