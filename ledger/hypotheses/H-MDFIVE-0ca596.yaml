  status_note: >-
    WEAKENED per DEC-20260822-40bf14 (BATCH-7215fa closing decision, findings F-4,
    F-5 and F-12), citing EV-MDFIVE-24e077. WHAT SURVIVES, STATED FIRST BECAUSE IT
    IS THE LARGER PART - this record's load-bearing MECHANISM claim is CONFIRMED,
    not falsified. At free-word separation j - i = 10 the declared matching
    observable genuinely depends on BOTH free words; ANOM-1 is cured at this slice
    and NOT relocated. That was established twice independently and blind - by a
    re-derivation from RFC 1320's step table alone (TASK-20260821-2de43d) and by a
    replication from the producer's own artifacts with a from-scratch
    implementation (TASK-20260821-26ba34) - and it settled the E/D propagation
    calculus, the split-independence identity d + r = j - i - 1, and the threshold
    that jointly dependent components exist for every legal split point iff
    j - i >= 4.
    WHAT IS WEAKENED - the NEAR-INJECTIVITY premise underlying this record's
    audit-2 expected count and CTL-PO5(b)'s ceiling of 4, together with proof
    obligation PO-5 which rested on it. The premise was never numbered as a
    heuristic; it appears only as arithmetic in two load-bearing places, and it is
    the thing that broke. Measured, at fixed-word seed 20260821 and k1 = k2 = 6 -
    the raw pre-certificate candidate set has EXACTLY 8 members against a declared
    ceiling of 4 and a modeled expectation of 1.0039, and the 8 is exactly the
    4 x 2 product of two per-side fiber multiplicities the gate had ALREADY
    MEASURED and recorded as a PASS, because GATE-PO2's criterion `>= 2` tests
    non-constancy while the arithmetic beneath it needs near-injectivity. Two
    reviewers reached that same defect down independent paths that could not see
    each other. Additionally HEUR-H1b, one of this record's four numbered
    heuristics, is FALSIFIED AT THESE PARAMETERS by its own frozen pre-registered
    text (v6 gives 33 forward and 24 backward distinct 32-bit values over a
    64-value sweep, both below the frozen threshold of 48, on BOTH sides);
    HEUR-H1 was NOT TESTED AT ALL, because run 4 never executed, and remains OPEN.
    ONE OF THIS RECORD'S OWN DIAGNOSES IS WRONG AND IS CORRECTED RATHER THAN
    INHERITED - the PO-5 falsification clause reads "a degenerate word channel
    survived the gate". NO CHANNEL IS DEGENERATE; both are non-constant at every
    held-fixed value and are LOSSY, i.e. strongly many-to-one. Those are different
    failure modes with different remedies, and a successor acting on the frozen
    diagnosis will look for the wrong defect. The clause's second half - "this
    would mean PO-2's predicate is weaker than believed, which is itself a finding
    about the gate" - is CORRECT and was pre-registered before the data existed.
    Likewise the dominated_by row-1 ruling's stated reason ("its match condition
    factorizes") applies identically to this record's own construction and is
    superseded by DEC-20260822-40bf14 F-11; the ruling's conclusion survives on the
    corrected, quantitative discriminator.
    `weaken`, NOT `reject_scoped`, and NOT A CLOSURE - the refutation artifact is a
    `derivation` over a bounded exhaustive enumeration at ONE fixed-word seed, and
    this record's own quantifier_order CLAIM 3 declines to quantify over seeds; a
    reviewer sweep of the same quantity over 120 seeds ranges 2 to 928, and 9 of
    those 120 seeds PASS the failing control with 6 giving a fully injective
    forward map. A passing construction demonstrably exists inside the current
    parameter family. No record may read this weakening as evidence that the
    Round-1 splice-and-cut lane is obstructed, dead or closed.
    CLAIM CEILING UNCHANGED - `analyzed`, never `supported`. Three of CLAUDE.md's
    four promotion gates are unmet and the fourth is met with two named defects in
    the review round itself.
