  reduction_chain:
    core_problem: >-
      Recovering a planted two-word pre-image pair for a declared MD4 Round-1
      output state at a bounded, declared toy scale.
    corollaries: []
    corollaries_note: >-
      NONE. No reduction to any downstream problem is claimed. In particular
      nothing here reduces to, bounds, or bears on MD4 or MD5 preimage
      resistance at any scale.

  predictions:
    - metric: >-
        distinct_bwd_32bit and distinct_bwd_12bit -- distinct values of the
        declared matching observable as free word B sweeps its k2 = 4 window with
        free word A held fixed, at each of four pre-registered held-fixed values
      direction: higher
      minimum_effect: >-
        >= 2 is the MANDATORY HARD FLOOR; anything less is a STOP. Predicted
        value 16 for both, with 15 acceptable at 12 bits since two of sixteen
        values collide in a 4096-bin window with probability about 2.9 percent.
        The same statistic on the batch-4 slice is predicted to be EXACTLY 1,
        which is the discriminating contrast: the two constructions must differ
        on this number or the detector is broken.
    - metric: >-
        distinct_fwd_32bit and distinct_fwd_12bit -- the same sweep in the
        forward direction
      direction: higher
      minimum_effect: >-
        >= 2 mandatory. Predicted 16 for both, 15 acceptable at 12 bits.
        Predicted 16 on the batch-4 slice as well -- the batch-4 forward channel
        was never the degenerate one, and requiring distinct_fwd > 1 there is the
        positive control that stops a uniformly broken apparatus from
        masquerading as a detection.
    - metric: >-
        distinct_fiber_sets -- distinct m-bit match sets induced across the
        free-word-B window at k1 = k2 = 4
      direction: higher
      minimum_effect: >-
        >= 2 MANDATORY (the criterion). TWO PRE-REGISTERED PREDICTIONS ARE ON
        RECORD AND THEY DISAGREE, deliberately. IDEA-20260821-ea35d1 predicts
        about 16. The COORDINATOR GATE derives exactly 2, with 3 acceptable,
        because at m = 12 the expected number of non-planted matching pairs is
        16 x 16 / 4096 = 0.0625 while the planted pair matches exactly, so one
        fiber is non-empty and fifteen are empty. Predicted EXACTLY 1 on the
        batch-4 slice and EXACTLY 1 for any construction whose match condition
        factorizes on this single component. Whichever value is observed, the
        deviation from the other prediction is legible as a result rather than
        absorbed.
    - metric: >-
        step-evaluations to recover the planted pair, MITM against the naive
        all-pairs baseline over the SAME restricted two-word space
      direction: lower
      minimum_effect: >-
        at least 100x fewer -- a conservative floor well below the modeled
        approximately 1490x, absorbing hash-table and interpreter overhead.
        MODELED, bounded scale only; no extrapolation to any larger k1/k2 and
        none whatsoever toward the approximately 2^64-block gap.
    - metric: >-
        chi-square goodness-of-fit of the matching-window collision counts across
        N independent targets against Poisson(lambda = 2^(k1+k2-m) = 256), lambda
        FIXED a priori
      direction: lower
      minimum_effect: >-
        p-value > 0.05 is the H1-consistent outcome at this scale; p <= 0.05 WITH
        a sample variance in [128, 512] is a genuine H1 falsification at this
        scale and is a reportable structural finding, not a defect.
    - metric: sample variance of the matching-window collision counts across N targets
      direction: different
      minimum_effect: >-
        PRE-COMMITTED THREE-WAY SPLIT, declared before any run (SC-9). Variance
        in [128, 512], i.e. within 2x of lambda = 256, is the non-degenerate
        band. Variance < 64 is classified as INSTRUMENT DEGENERACY (the ANOM-1
        signature; batch 4 measured variance EXACTLY 0 across 1000 targets, ANOM-1
        caveat) and is a STOP, explicitly NOT an H1 falsification. Variance in the
        healthy band with chi-square p <= 0.05 is a genuine H1 falsification. These
        three outcomes mean three different things and the classification rule is
        frozen now.
    - metric: raw pre-certificate MITM candidate-set projection widths at k1 = k2 = 6
      direction: lower
      minimum_effect: >-
        strictly fewer than 64 distinct wA AND strictly fewer than 64 distinct wB
        in the raw set, with total raw candidates <= 4. Batch 4's analogous raw
        set covered its entire second-word window (ANOM-1 caveat).
    - metric: >-
        HEUR-H1b paired contrast at k1 = k2 = 6 -- distinct 32-bit values over a
        64-value sweep, for v6 (step distance 3) against v8 (backward step
        distance 1)
      direction: different
      minimum_effect: >-
        v6 predicted near 64 on both sides; v8 backward predicted materially
        below 64. If BOTH are near 64 the step-distance refinement is recorded as
        not doing work at these parameters rather than retained as decoration.
    - metric: MD5 arm (conditional) -- chi-square p-value and variance profile against the MD4 arm
      direction: different
      minimum_effect: >-
        A difference is credited ONLY if one arm's p-value is > 0.05 and the
        other's <= 0.05 AND the difference survives a null-constant replication,
        which is NOT in this batch's scope or budget. R, the MD5/MD4
        full-target-hit ratio, is DECLARED IN ADVANCE to carry essentially no
        information at these parameters and MAY NOT BE REPORTED AS A FINDING IN
        EITHER DIRECTION.

  test_boundary:
    instances:
      - MD4 Round 1 (steps 1 to 16), the control, at every declared scale
      - >-
        MD4 Round 1 at the BATCH-4 PARAMETER SLICE (free words 8 and 9, S = 9,
        p = 1), as the detector null control PO-1, at k1 = k2 = 4 only
      - >-
        MD5 Round 1 at IDENTICAL R1-SEP10 parameters, as the nearby-object
        control, ONLY under EXP-MDFIVE-a8e71e's md5_run_authorization, never
