  heuristic_assumptions:
    - id: HEUR-H1
      status: >-
        OPEN -- neither validated nor falsified. Its batch-4 test was
        INVALIDATED by ANOM-1 (DEC-20260821-1215e5 F-3; EV-MDFIVE-ab007d O-3).
        This batch would be its FIRST GENUINE TEST. This is a NEW numbered
        heuristic for a NEW construction, declared before any run; it is not a
        reinterpretation of H-MDFIVE-bf7767's HEUR-H1 (SC-9, HR-7). Once frozen
        here it may not be reinterpreted after outcomes are seen.
      formal_statement: >-
        FOR the declared fixed words and a fixed target, as free word A ranges
        uniformly over its k1-bit window and free word B independently over its
        k2-bit window, the m-bit values low_m(chunk1_observable(wA)) and
        low_m(chunk2_observable(wB, Y)) behave as independent uniform samples
        from the set of m-bit strings. Consequently the number of
        matching-window collisions among the 2^(k1+k2) candidate pairs is
        approximated by Poisson(lambda = 2^(k1+k2-m)), and the conditional
        probability that a matching-window hit also matches the remaining
        (k - m) target bits is approximated by 2^-(k-m).
      random_model_justification: >-
        RFC 1321 section 3.4 states as a property of F that if the bits of X, Y
        and Z are independent and unbiased then each bit of F(X,Y,Z) is
        independent and unbiased -- a genuine single-step balance property. H1
        extrapolates that one-step fact to an iterated composition (three
        F-carrying steps forward from word2 to v6, three backward from word12),
        imitating the classical move from "one mixing step is balanced" to "the
        iterate looks like a random function" that underlies every birthday
        argument. THE EXTRAPOLATION IS NOT PROVED and this record does not claim
        it is.
      supporting_results:
        - >-
          RFC 1321 section 3.4's stated single-step balance property of F.
          provenance internal (pinned copy at
          coordination/goals/GOAL-MD5-001/batches/BATCH-1f30fe/inputs/rfc1321-md5.txt,
          sha256 284a79d1...3149dd, pinned at TASK-20260821-420070). Supports the
          ONE-STEP fact only; it does not support the iterated extrapolation.
      validation_experiment_ids: [EXP-MDFIVE-a8e71e]
      falsification_condition: >-
        FROZEN, PRE-COMMITTED, AND CLASSIFICATION-SPLIT. Over N >= 200
        independently drawn targets at k1 = k2 = 10, m = 12, with lambda = 256
        FIXED A PRIORI and df = bins - 1, HEUR-H1 is FALSIFIED AT THIS SCALE if
        and only if the chi-square goodness-of-fit p-value is <= 0.05 AND the
        sample variance of the matching-window collision counts lies in
        [128, 512]. If the sample variance is < 64 the outcome is classified as
        INSTRUMENT DEGENERACY and HEUR-H1 is recorded as still OPEN -- NOT
        falsified -- because a near-deterministic observable cannot test a
        distributional claim. If the variance is > 512 with p <= 0.05 the outcome
        is an over-dispersed genuine falsification. The Poisson survival
        probability of the single largest observed count is reported alongside in
        every case. THE THREE-WAY CLASSIFICATION IS FROZEN NOW, BEFORE ANY DATA
        EXISTS, and moving it later requires a versioned protocol_amendment.
    - id: HEUR-H1b
      status: NEW this record, declared before any run.
      formal_statement: >-
        An observable at step distance >= 2 from a free word receives that word
        through at least two arguments of the F that produces it, so no single
        gating register value can annihilate the dependence; an observable at
        step distance exactly 1 receives the word through exactly one branch of
        one F, gated bit-by-bit by the selecting register X, so output bit t
        moves with the word only where X_t selects that branch and the low-m
        window can be partly or entirely frozen by the fixed words alone.
        Formally, at step distance 1 the observable has the shape
        Const -/+ F(X, Y, Z) with exactly one of Y, Z carrying the word; at step
        distance >= 2 more than one argument carries it; and at step distance 3
        (the declared choice, v6) all three arguments carry it.
      random_model_justification: >-
        The reachability half is a PROVED statement about which bits are
        syntactically reachable, derived from F being bitwise together with the
        E/D propagation rules above, and independently re-derived by the gate.
        The variation half imitates the classical "complete diffusion after r
        rounds" heuristic: syntactic reachability is proved, actual variation is
        assumed. That gap is the whole reason PO-2 is a measurement rather than a
        formality.
      supporting_results:
        - >-
          The E/D propagation rules of this record's mechanism, derived from
          harness/run_md4_ceiling.py's forward_step and backward_step return
          tuples. provenance internal; derived independently at
          TASK-20260821-6b78d4 and re-derived at TASK-20260821-fad775.
      validation_experiment_ids: [EXP-MDFIVE-a8e71e]
      falsification_condition: >-
        At k1 = k2 = 6, if the step-distance-3 component v6 shows fewer than 48
        distinct 32-bit values over a 64-value sweep on EITHER side, HEUR-H1b's
        "step distance >= 2 gives full-bit dependence" claim is falsified at these
        parameters and the component choice must be revisited before any
        statistical reading of the collision counts. The PAIRED CONTRAST is run
        in the same phase and is a genuine two-outcome test, not a confirmation:
        the same 64-value sweep is reported for the step-distance-1 component v8
        (tuple position 1) on the backward side at the same separation. Predicted:
        v6 near 64 distinct on both sides, v8 backward materially below 64. IF
        BOTH ARE NEAR 64 the step-distance refinement is not doing work at these
        parameters and must be RECORDED AS SUCH rather than retained as
        decoration.
    - id: HEUR-H2
      status: >-
        CARRIED FORWARD, CONFIRMED. A proved algebraic fact, not a distributional
        heuristic; already validated at >= 10,000 random tuples for both add_b
        conventions in RUN-MDFIVE-buildcheck (all_ok true) and independently
        re-derived by two reviewers at BATCH-af29f6. It is numbered only because
        sign handling, rotation direction and masking break silently in practice,
        and it must be re-established for the new module because that is new code.
      formal_statement: >-
        The Round-1 step function is exactly invertible given all other inputs:
        old_a = rotr((new_a - old_b*), s) - F(old_b, old_c, old_d) - x - t
        (mod 2^32), where the "- old_b" term is present for MD5 and absent for
        MD4, and old_b, old_c, old_d are pass-throughs of the successor state.
      random_model_justification: >-
        None required and none claimed. Rotation by s is a bijection on the
        32-bit integers with inverse rotation by 32 - s, and addition modulo 2^32
        is invertible by subtraction. No conjecture is involved.
      supporting_results:
        - >-
          RUN-MDFIVE-buildcheck (BATCH-af29f6), all_ok true at >= 10,000 tuples
          per primitive. provenance internal. This supports the batch-4 module,
          NOT the new one; PO-6 re-establishes it for the new module.
      validation_experiment_ids: [EXP-MDFIVE-a8e71e]
      falsification_condition: >-
        Any single tuple on which backward_step composed with forward_step is not
        the exact identity, in either add_b convention, falsifies it and
        invalidates everything downstream in the same run.
    - id: HEUR-H3
      status: >-
        CARRIED FORWARD, HONESTLY UNTESTED. Not validated in batch 4 and NOT
        validatable within this batch's budget. Recorded as an open direction,
        explicitly untested, so that its absence is legible.
      formal_statement: >-
        HEUR-H1's Poisson prediction, if it holds at k1 = k2 = 10, continues to
        hold with no new correlations emerging as k1 and k2 grow.
      random_model_justification: >-
        None beyond HEUR-H1's own unproved extrapolation. H3 is a SECOND-ORDER
        extrapolation of an already-unproved heuristic and is strictly weaker
        than H1.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        NOT TESTED THIS BATCH and no test is proposed for it here. The route for a
        future batch is to repeat H1's protocol at successive k1 = k2 checkpoints
        (10, 13, 16) and check the prediction holds as a MEASURED ratio rather
        than an extrapolated one. Until then no record may treat H3 as anything
        other than untested.

