hypothesis:
  id: H-ECDLP-a0d3ea
  question_id: RQ-MONO-001
  statement: >-
    Formalises IDEA-20260807-5126f4. DEC-20260804-4f37d5 records that the
    splitting field of S_m in x_1 over F_p(x_2..x_{m-1}, c) has Galois group
    C_2^{m-2}, universally and with no exceptional locus, and sets
    "kn_open_009_disposition: CLOSED" while disposing of the exploitable
    branch in one clause that carries no evidence reference, no experiment id
    and no run. This hypothesis prices what that group buys.
    CLAIM, RESTATED AFTER READING EV-MONO-a0a89c OBS-5, WHICH FORCES THE
    QUANTITY AN EARLIER DRAFT OF THIS RECORD PROPOSED TO MEASURE.
    OBS-5 establishes unconditionally, at every m, by the group law, that if
    x_1..x_{m-1} are x-coordinates of F_p-rational points then the roots of
    S_m(x_1..x_{m-1}, T) are exactly x(eps_1 P_1 + ... + eps_{m-1} P_{m-1})
    over sign vectors, 2^{m-2} values matching deg_T S_m, and EVERY ONE LIES IN
    F_p. So on the factor-base locus S_m splits completely over F_p.
    The consequence for a quadratic-character filter is immediate and it is not
    a measurement. A true factor-base member makes every coordinate rational,
    so every character in the C_2^{m-2} tower is trivial and the bit-vector is
    identically zero. SENSITIVITY IS THEREFORE EXACTLY 1.000, FORCED, and the
    selectivity lift rho_filter = 1/Pr[accept] is forced to about 2^{m-2}
    whenever the factor base is sparse and the non-member characters are
    generic. Neither number is open, so neither can decide anything.
    WHAT REMAINS OPEN, AND IS THIS RECORD'S CLAIM, IS IN TWO PARTS.
    (C1, empirical) The filter's false-positive rate on NON-members equals
    2^{-(m-2)}, that is the tower's characters on non-factor-base coordinates
    are uncorrelated. This is the one distributional quantity OBS-5 does not
    settle, and a measured rate materially above 2^{-(m-2)} means the
    characters are correlated and the filter is weaker than its structure
    suggests.
    (C2, cost, and the only part that can change a decision) Charging the tower
    construction and all m-2 Legendre symbols, the resolvent route costs fewer
    F_p operations per confirmed membership decision than the committed
    enumerate-and-test route. A filter with sensitivity 1 and false-positive
    rate 2^{-(m-2)} still leaves factor-base membership to be decided among the
    F_p-rational roots it admits, so its ceiling is the removal of a
    1 - 2^{-(m-2)} fraction of candidates and nothing more.
  mechanism: >-
    A C_2^{m-2} Galois group makes the degree-2^{m-2} root-finding problem for
    x_1 a tower of m-2 quadratic extensions. On the partial locus the fibre
    does not split completely by the group law, so a root's position in the
    C_2^{m-2} orbit is recorded by a bit-vector in {0,1}^{m-2} obtained from
    m-2 quadratic-character tests, each costing O(log p) field operations. The
    projection root -> bit-vector is lossy by design, 2^{m-2} roots map to m-2
    bits and distinct roots share a bit-vector, so the bit-vector can only ever
    be a FILTER on membership and never a decision procedure.
    OBS-5 then settles the filter's QUALITY in advance and leaves only its
    PRICE open. A true member forces every coordinate rational and the fibre to
    split completely over F_p, so every character in the tower is trivial on a
    member and the filter never rejects one: sensitivity is exactly 1 and the
    selectivity lift is about 2^{m-2} for a sparse base. The mechanism
    therefore does NOT stand or fall on whether the bit-vector correlates with
    membership, which OBS-5 already answers. It stands or falls on whether m-2
    Legendre symbols plus a tower construction cost less than the
    enumerate-and-test route they would replace, given that the filter's
    ceiling is removing a 1 - 2^{-(m-2)} fraction of candidates and leaving
    factor-base membership still to be decided among the rest.
    On the FULL factor-base locus, where every coordinate is a base element,
    the same theorem makes the filter accept everything, so its false-positive
    rate there is forced to 1. That forcing is the instrument's vacuity check.
  assumptions:
    - The C_2^{m-2} tower is constructible explicitly at m = 4 and 5 on toy prime-field curves.
    - >-
      The partial locus, m-2 coordinates fixed and one free, is the locus on
      which relation search operates. VERIFIED FIRST-HAND against
      ledger/goals/GOAL-MONO-001/goal.yaml, whose next_action states that the
      imprimitivity half of KN-OPEN-009 "stays LIVE and is non-degenerate at
      m >= 4, where deg_T S_m = 2^{m-2} >= 4". DEC-20260810-2f86db D-4 adds the
      sharper statement that index-calculus relation search FIXES T = x(R) and
      searches for (x_1..x_{m-1}) in FB^{m-1} on the fibre of the projection to
      the T-line, which is a different projection from the one this record
      filters on; that difference is recorded in interpretation_limits and is
      not elided.
    - >-
      Legendre-symbol cost is O(log p) with a constant that matters at toy p
      and is charged, never amortised away.
    - >-
      Results depend on WHICH m-2 coordinates are fixed. Every quantity is
      reported per choice of fixed-coordinate set and never pooled across
      choices.
  proof_search_map:
    bottleneck: >-
      The per-decision cost of the factor-base membership test inside relation
      collection, which is where the resolvent could replace a degree-2^{m-2}
      root-find by m-2 character tests.
    baseline_embedding:
      parameter_slice: >-
        The full locus, where the fibre splits completely by the group law.
        There the filter is forced vacuous and the resolvent route must reduce
        exactly to enumerate-and-test with the tower cost added on top.
      reproduction_check: >-
        Symbolic. The tower construction at m = 4 must reproduce the known
        deg_T(S_4) = 4 and at m = 5 the known deg_T(S_5) = 8, both of which
        EXP-MONO-12ce1c's committed dual-path fixture already verified, the
        first as a fully symbolic identity. Any disagreement is an
        implementation defect and blocks the run.
    observation_collision:
      observable: The bit-vector of m-2 quadratic characters attached to a root.
      distinct_preimage_search: >-
        COLLISION EXISTS AND IS ADMITTED. 2^{m-2} roots map to m-2 bits, so
        distinct roots necessarily share a bit-vector. The observable
        certifies orbit position, never membership, which is a condition on the
        root's VALUE. OBS-5 supplies the missing half in ONE direction only,
        a member forces every character trivial, which is why sensitivity is 1
        and why the residual question is the non-member rate and the price.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace a degree-2^{m-2} root-find by m-2 quadratic-character tests
          used as a pre-filter on factor-base membership.
        predicted_gain: >-
          A constant-factor reduction in the relation-collection membership
          cost. Explicitly NOT an exponent move.
    quantifier_order: >-
      FOR ALL tested arities m in {4,5}, FOR ALL three tested primes, and FOR
      ALL declared choices of the fixed m-2 coordinates, THERE EXISTS a
      measured non-member false-positive rate and a measured charged operation
      ratio, each reported with an interval. The choice of fixed coordinates is
      declared before any measurement and never selected after seeing a result.
    method_ceiling:
      strongest_certifiable_claim: >-
        At m in {4,5} on three toy primes, a measured non-member false-positive
        rate and a measured F_p-operation count per confirmed membership
        decision for the resolvent route against the enumerate-and-test route,
        with the tower charged. Sensitivity is NOT certified by measurement
        here; it is forced by OBS-5 and is checked only as an instrument
        property. Nothing about the relation-collection EXPONENT, nothing about
        cryptographic scale, and no change to KN-OPEN-009's status, which is a
        knowledge-curation act.
      nearby_object_control: >-
        A random multiquadratic tower of the same degree over the same F_p,
        with a size-matched random x-subset standing in for the factor base.
        A lift shared with that object is a property of multiquadratic towers,
        not of the Semaev cover.
    proof_obligations:
      - claim: The tower reproduces deg_T(S_4) = 4 and deg_T(S_5) = 8.
        responsibility: baseline
      - claim: >-
          Sensitivity on the partial locus is 1.000 and the false-positive rate
          on the full factor-base locus is 1.000, both forced by OBS-5.
        responsibility: correctness
      - claim: >-
          The rate estimator returns a planted false-positive rate at its
          planted value.
        responsibility: correctness
      - claim: Tower construction and discriminant computation are charged, not amortised.
        responsibility: runtime
      - claim: Every quantity is reported per fixed-coordinate choice.
        responsibility: scope
      - claim: The curve-free multiquadratic null separates tower structure from Semaev structure.
        responsibility: strictness
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-MONOIMP-1
      formal_statement: >-
        The non-member false-positive rate of the tower filter equals
        2^{-(m-2)} at the tested m and primes and remains 2^{-(m-2)} at larger
        m and larger p; equivalently, the m-2 quadratic characters of the tower
        are jointly uncorrelated on coordinates that are not factor-base
        elements. No claim is made about the member side, which OBS-5 forces.
      random_model_justification: >-
        The tower's m-2 characters are Legendre symbols of discriminants that
        are distinct non-constant functions of the free coordinate, so on a
        coordinate carrying no rational-point structure they should behave like
        independent fair coins. This is the ONLY distributional assumption the
        record makes; the sensitivity side needs none.
      supporting_results:
        - >-
          EV-MONO-a0a89c OBS-5, read in this task, which forces the MEMBER side
          exactly and thereby isolates this heuristic to the non-member side.
          The uncorrelatedness itself is supplied by no corpus result and is
          UNDISCHARGED; it is flagged as the record's weakest point rather than
          dressed with a citation.
      validation_experiment_ids:
        - EXP-ECDLP-1a7928
      falsification_condition: >-
        The measured non-member false-positive rate departs from 2^{-(m-2)} by
        more than 0.010 at any cell while the forced-value controls fire. The
        tower's characters are then correlated on non-factor-base coordinates.
        That is a result about the tower, not an infrastructure failure, and is
        reported as such.
