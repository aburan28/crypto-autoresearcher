    budget:
      wall_clock_seconds_per_run: 3600
      maximum_memory_gb: 8
      maximum_runs: 6
  falsification_conditions:
    - >-
      TOY-TIER FALSIFIER ON C1. The measured false-positive rate on non-members
      lies outside 2^{-(m-2)} plus or minus 0.010 at any tested m, prime and
      fixed-coordinate choice, while the forced-value controls fire. The
      tower's characters are then correlated on non-factor-base coordinates and
      the filter is weaker than its structure implies.
    - >-
      TOY-TIER FALSIFIER ON C2, AND THE ONE THAT DECIDES THE RECORD. The
      charged F_p-operation ratio is at or above 1.00 at every tested m. The
      filter's selectivity is forced by OBS-5 and is not in question, so a
      ratio at or above 1 means the imprimitivity is real, sensitivity is
      perfect, and it STILL does not pay once the tower and the m-2 Legendre
      symbols are charged. That is a complete and argued answer to what the
      C_2^{m-2} monodromy BUYS, which DEC-20260804-4f37d5 disposed of in one
      clause with no evidence reference.
    - >-
      INSTRUMENT VOID. Sensitivity on the partial locus is below 1.000, or the
      false-positive rate on the full factor-base locus is below 1.000. Both
      are forced by OBS-5, so either means the tower is built wrong and nothing
      is admissible.
    - >-
      SCOPE FALSIFIER. The curve-free multiquadratic null reproduces the Semaev
      arm's non-member false-positive rate within the pooled interval. That
      rate is then a property of multiquadratic towers over F_p and may not be
      reported as a statement about the Semaev cover, factor bases, or the
      ECDLP. Note that the SENSITIVITY side cannot be reproduced by the null,
      because it comes from the group law via OBS-5 and a curve-free tower has
      no group law; the two halves are therefore scoped separately.
    - >-
      INFRASTRUCTURE, NOT EVIDENCE. Tower construction fails, or the symbolic
      degree fixture disagrees with deg_T(S_4) = 4 or deg_T(S_5) = 8. Reported
      as an infrastructure or implementation outcome per AGENTS.md rule 5.
  interpretation_limits:
