  reduction_chain:
    core_problem: >-
      The per-decision cost of factor-base membership testing inside
      prime-field Semaev relation collection, at toy scale.
    corollaries: []
  predictions:
    - metric: >-
        filter sensitivity, dimensionless, the fraction of true factor-base
        members the m-2 character filter accepts, on the partial locus
      direction: higher
      minimum_effect: >-
        Exactly 1.000, FORCED BY EV-MONO-a0a89c OBS-5, not measured. A member
        makes every coordinate rational, the fibre splits completely over F_p,
        and every character in the tower is trivial. Retained as an INSTRUMENT
        CHECK with a forced value; a sensitivity below 1.000 means the tower is
        built wrong and nothing in the run is admissible. It is not evidence.
    - metric: >-
        false-positive rate of the m-2 character filter on NON-members, on the
        partial locus, dimensionless
      direction: lower
      minimum_effect: >-
        Predicted 2^{-(m-2)}, that is 0.250 at m = 4 and 0.125 at m = 5, under
        the assumption that the tower's characters on non-factor-base
        coordinates are uncorrelated. THIS IS THE ONE DISTRIBUTIONAL QUANTITY
        OBS-5 DOES NOT SETTLE. The alternative is correlation, which raises the
        rate toward 1; at 100,000 candidates per cell the standard error at
        0.250 is 0.0014, so a band of 0.250 plus or minus 0.010 is about seven
        standard errors and separates cleanly from any correlated regime.
    - metric: >-
        F_p operations per confirmed factor-base membership decision, resolvent
        route divided by enumerate-and-test route, dimensionless, with tower
        construction and all m-2 Legendre symbols charged to the resolvent side
      direction: lower
      minimum_effect: >-
        Strictly below 1.00 at m = 4 and again at m = 5, reproduced at all
        three primes. A ratio at or above 1.00 at any tested m means the
        decomposition is not a cheaper predicate even though its sensitivity is
        perfect, which is the decisive outcome for this record.
    - metric: >-
        false-positive rate on the FULL factor-base locus, where every
        coordinate is a factor-base element, dimensionless
      direction: different
      minimum_effect: >-
        Exactly 1.000, FORCED BY OBS-5, because there the fibre splits
        completely and every candidate is accepted. The filter is vacuous on
        that locus by theorem. Retained as an instrument check with a forced
        value; a value below 1.000 there means the implementation is wrong.
  test_boundary:
    instances:
      - >-
        Toy prime-field curves at three primes in the range used by
        EXP-MONO-12ce1c's panel, hygiene-screened, with the interval factor
        base declared before any measurement.
      - >-
        Curve-free null, a random multiquadratic tower of degree 2^{m-2} over
        the same F_p with a size-matched random x-subset.
    parameters:
