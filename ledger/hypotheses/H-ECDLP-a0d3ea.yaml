      leaves the relation-count side of the cost model untouched;
      FINDING-PF-IC-001's structural argument is that the total is dominated by
      the |F|-size linear algebra, not by the solve." The attribution is
      therefore what a second corpus entry says the finding argues, and the
      finding's own text remains unread because its file cannot be located. The
      low-leverage disclosure in this record's interpretation_limits rests on
