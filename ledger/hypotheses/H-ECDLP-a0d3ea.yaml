    - >-
      VERIFICATION GAP, DISCLOSED. FINDING-PF-IC-001 could not be located as a
      record file anywhere in the repository. It is referred to by KN-TECH-052,
      KN-TECH-053, KN-LIT-134 and KN-LIT-135. KN-TECH-052, read verbatim,
      attributes to it "a total-cost exponent of 2.05 with 90% CI [1.86, 2.29]
      against rho's 0.5, measured at toy scale (p <= 2^16, m <= 3, d <= 24)".
      IDEA-20260807-5126f4's further attribution, that FINDING-PF-IC-001 says
      the linear-algebra stage DOMINATES, is CORROBORATED at one remove but not
      at the source. KN-TECH-053, read in full by TASK-20260904-c063e5, states
