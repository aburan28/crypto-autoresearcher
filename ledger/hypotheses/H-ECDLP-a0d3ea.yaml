    budget:
      wall_clock_seconds_per_run: 3600
      maximum_memory_gb: 8
      maximum_runs: 6
  falsification_conditions:
    - >-
      TOY-TIER FALSIFIER. rho_filter lies inside [0.97, 1.03] on the partial
      locus at every tested m, prime and fixed-coordinate choice, while the
      planted-lift control returns its planted value. The imprimitivity buys
      nothing, and the program obtains its first ARGUED rather than asserted
      closure of KN-OPEN-009's second half, at the tested scope.
    - >-
      TOY-TIER FALSIFIER. The charged F_p-operation ratio is at or above 1.00
      at every tested m even where rho_filter exceeds 1. The tower is real but
      does not pay for itself.
    - >-
      INSTRUMENT VOID. The full-locus vacuity check does not return
      rho_filter in [0.97, 1.03], or the planted-lift control does not return
      its planted value within its stated tolerance. Nothing is admissible.
    - >-
      SCOPE FALSIFIER. The curve-free multiquadratic null reproduces the
      Semaev arm's rho_filter within the pooled interval. Any lift is then a
      property of multiquadratic towers over F_p and may not be reported as a
      statement about the Semaev cover, factor bases, or the ECDLP.
    - >-
      INFRASTRUCTURE, NOT EVIDENCE. Tower construction fails, or the symbolic
      degree fixture disagrees with deg_T(S_4) = 4 or deg_T(S_5) = 8. Reported
      as an infrastructure or implementation outcome per AGENTS.md rule 5.
  interpretation_limits:
    - >-
      Toy scale, m at most 5, three primes. No cryptographic-scale claim.
    - >-
      A cheaper membership predicate affects a relation-collection CONSTANT,
      not an exponent. This is explicitly low-leverage work and the record says
      so before any measurement.
    - >-
      This record does not change KN-OPEN-009's status, does not supersede
      DEC-20260804-4f37d5, and does not reopen it. Superseding a knowledge
      entry is a curation act and a decision record is superseded only by a new
      decision record.
    - >-
      VERIFICATION CORRECTION, MATERIAL. IDEA-20260807-5126f4's novelty screen
      states "EXP-MONO-12ce1c and EXP-MONO-c819ba are unrun". BOTH ARE RUN.
      EXP-MONO-12ce1c completed RUN-MONO-12ce1c-1 and -2 at 123.19 s and
      121.19 s; EXP-MONO-c819ba completed RUN-MONO-c819ba-1 and -2 at 1.900 s
      and 1.877 s. Both carry full execution reports with controls, findings
      and per-cell tables. The claim that this object is unmeasured is
      therefore false as stated, and the contract cites EXP-MONO-12ce1c
      Stage 3 as prior art on the factor-base sublocus rather than
      re-measuring it.
    - >-
      CORRECTION OF AN EARLIER DRAFT OF THIS RECORD, RECORDED RATHER THAN
      SILENTLY FIXED. An earlier draft asserted that GOAL-MONO-001 has no
      record under ledger/goals/. THAT ASSERTION WAS FALSE AND THE METHOD THAT
      PRODUCED IT WAS INVALID. The record exists, sharded, at
      ledger/goals/GOAL-MONO-001/goal.yaml with a checkpoints/ directory
      beside it. The draft rested on a files-only listing of ledger/goals/,
      which cannot show a directory and therefore could not have found a
      sharded goal. THE GENERAL RULE, stated here because this trap has now
      caught more than one batch, is that AN ABSENCE CLAIM REQUIRES A CHECK
      THAT COULD HAVE FOUND THE THING; a listing that cannot enumerate
      directories cannot support "no record exists". Both
      ledger/goals/GOAL-X.yaml and ledger/goals/GOAL-X/goal.yaml are valid
      layouts.
    - >-
      THE SOURCE IDEA'S ATTRIBUTION TO GOAL-MONO-001 IS CONFIRMED, NOT
      UNLOCATABLE. IDEA-20260807-5126f4 states that the goal's committed
      next_action says to "carry forward only its imprimitivity half, which at
