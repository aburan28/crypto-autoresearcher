        the same F_p with a size-matched random x-subset.
    parameters:
      claim_tier: toy
      arities: [4, 5]
      primes: 3
      candidates_per_cell: 100000
      fixed_coordinate_choices: at least 3, declared in advance, reported separately
    implementation: >-
