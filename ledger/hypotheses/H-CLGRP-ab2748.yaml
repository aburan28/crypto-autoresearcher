hypothesis:
  id: H-CLGRP-ab2748
  question_id: RQ-CLGRP-66ab7f
  added: '2026-08-25'
  derived_from_idea: IDEA-20260809-83cbc7
  statement: >-
    The structural sub-cases in which a class group of binary quadratic forms carries an
    element of small KNOWN order - the failure mode that the low-order and adaptive-root
    assumptions are stated against - are finitely enumerable from the discriminant's
    factorization alone, an explicit witness form can be CONSTRUCTED for each in
    milliseconds, and every named countermeasure can be checked against every case to
    produce a complete case-by-countermeasure table. Three limbs are asserted.
    (G1) ENUMERATION. The number of structural sub-cases at a discriminant is determined
    exactly by the number of prime factors of that discriminant, so a prime discriminant
    yields the minimal case count. The predicted count is computed from the factorization
    before any form is constructed.
    (G2) WITNESS CONSTRUCTION AND VERIFICATION. For each enumerated case an explicit binary
    quadratic form is constructed whose order is then VERIFIED by direct composition rather
    than inferred from the theory the witness is meant to instantiate. Verified orders agree
    with the enumeration's prediction in every cell.
    (G3) COVERAGE. Every enumerated case is removed by at least one of the named
    countermeasures - working in a quotient, restricting to a subgroup, choosing prime
    discriminants. A SURVIVING cell under a deployed countermeasure would be the most
    valuable finding this question can produce and would require immediate independent
    re-verification before being recorded at all.
    The hypothesis is FALSE if verified witness orders disagree with the enumeration's
    prediction in any cell (G1 or G2 fails and the enumeration is wrong), if the enumeration
    cannot be made exhaustive within the declared class of discriminants (G1's completeness
    limb fails and the boundary is stated with no completeness claimed), or if any cell
    survives every countermeasure (G3 fails, which is the high-value outcome).
  mechanism: >-
    An element of small known order in a hidden-order group breaks the low-order assumption
    directly, and the adaptive-root assumption through it. Classical genus theory says
    exactly where such elements come from in a class group of binary quadratic forms: the
    ambiguous forms, which are tied to the factorization of the discriminant, generate the
    two-torsion, and their number is a function of how many primes divide the discriminant.
    That makes the failure set enumerable from public data rather than discovered by search.
    The gap this hypothesis addresses is not knowledge of the issue - the countermeasures
    exist BECAUSE of it - but the absence in one place of an exhaustive
    case-by-countermeasure table with a constructed witness per cell. That is the difference
    between knowing an issue and having checked the fix. Constructing the witness explicitly
    and verifying its order by composition, rather than by citing the theory that predicts
    it, is what turns each cell from an assertion into a check; a witness whose order does
    not verify says the enumeration is wrong, which is exactly the outcome a table built
    from theory alone could never surface.
  assumptions:
    - >-
      Composition of binary quadratic forms is implemented correctly, and its correctness is
      established independently by known-answer tests on discriminants whose class group
      structure is computable by exhaustive reduction, before any witness order is trusted.
    - >-
      The declared class of discriminants over which exhaustiveness is claimed is fixed
      before enumeration. Exhaustiveness outside a declared class is not claimed and is not
      claimable by this design.
    - >-
      Each named countermeasure is stated precisely enough to be evaluated per cell - as a
      predicate on the witness - before any cell is evaluated. A countermeasure described only
      in prose cannot be checked and is recorded as not evaluable rather than as passing.
    - >-
      Small discriminants only. Whatever holds at the sizes enumerated is a statement about
      those discriminants, and the structural argument's extension to deployment-sized
      discriminants is a separate claim that this hypothesis does not make.
  proof_search_map:
    bottleneck: >-
      Whether the enumeration is EXHAUSTIVE within its declared class. Everything else is
      construction and verification; the completeness of the case list is the only step whose
      failure changes the table's meaning, because a table that is complete-looking but not
      complete is worse than one that declares its boundary.
    baseline_embedding:
      parameter_slice: >-
        Discriminants small enough that the entire class group can be computed by exhaustive
        reduction of forms, so the true two-torsion is known independently of the enumeration.
      reproduction_check: >-
        At every such discriminant the enumeration's predicted case set must match the
        exhaustively computed two-torsion EXACTLY, as sets, not merely in count. A mismatch
        blocks every larger discriminant.
    observation_collision:
      observable: >-
        The pair consisting of a constructed witness form and its verified order.
      distinct_preimage_search: >-
        REQUIRED. Two structurally distinct cases can produce forms of the SAME order, so
        order alone does not identify the case. The table must therefore key cells by the
        structural case - the divisor of the discriminant the ambiguous form corresponds to -
        and carry the order as a verification, not as an identifier. A table keyed on order
        would silently merge distinct cases.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Key each cell by the discriminant divisor generating the ambiguous form together
          with the verified order, rather than by order alone.
        predicted_gain: >-
          Prevents distinct structural cases from collapsing into one row, which is the
          failure mode a coverage claim is most exposed to.
      - transform: specialization_pack
        proposed_object: >-
          Express each countermeasure as an explicit predicate on the witness form, evaluated
          per cell, rather than as a described policy.
        predicted_gain: >-
          Makes a SURVIVING cell detectable at all; a prose countermeasure can absorb any
          witness.
    quantifier_order: >-
      CLAIMED. FOR ALL discriminants in the declared class, and FOR ALL structural cases the
      enumeration produces at that discriminant, THERE EXISTS a constructed witness whose
      verified order matches the prediction, and THERE EXISTS at least one named countermeasure
      removing it. NOT CLAIMED. That the enumeration covers cases outside the declared class,
      or that a countermeasure removing a case at a small discriminant removes it at any larger
      one - the countermeasure predicates are checked where they are checked and nowhere else.
    method_ceiling:
      strongest_certifiable_claim: >-
        At the enumerated discriminants, the structural case set is exactly this, each case has
        this constructed witness of this verified order, and each case is or is not removed by
        each named countermeasure. It can never certify that any deployed system is secure or
        insecure, that the countermeasures are sufficient in general, or that the case list is
        complete outside its declared class.
      nearby_object_control: >-
        A PRIME DISCRIMINANT, where the enumeration must yield the minimal case set. If the
        enumeration returns the same case count for a prime discriminant as for a highly
        composite one, it is not tracking the factorization and the whole construction is
        measuring something else.
    proof_obligations:
      - claim: The case count at a discriminant is determined by its number of prime factors.
        responsibility: correctness
      - claim: Each constructed form's order is what the enumeration predicts, verified by composition.
        responsibility: correctness
      - claim: Form composition is implemented correctly, established by known-answer tests.
        responsibility: baseline
      - claim: The enumeration is exhaustive within the declared class of discriminants.
        responsibility: feasibility
      - claim: Each countermeasure is a predicate evaluable per cell.
        responsibility: interface
      - claim: Nothing here evaluates any deployed parameter or records any security verdict.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: >-
        Genus theory for binary quadratic forms - the correspondence between ambiguous forms,
        the two-torsion of the class group, and the factorization of the discriminant.
      citation: >-
        Classical. The parent proposal IDEA-20260809-83cbc7 lists its references as RECALLED and
        REQUIRED READS, and none was opened.
      provenance: recalled
      verified_by: null
      role: supplies the enumeration rule that this experiment checks against exhaustive computation
    - description: >-
        The low-order and adaptive-root assumptions as stated for hidden-order groups, and the
        named countermeasures against elements of small known order.
      citation: >-
        Hidden-order group construction literature. RECALLED, REQUIRED READS, none opened.
      provenance: recalled
      verified_by: null
      role: defines which structural cases matter and which countermeasures the table's columns are
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: predicted_versus_exhaustive_case_set_agreement
      direction: different
      minimum_effect: >-
        Exact set equality at every discriminant small enough for exhaustive class group
        computation. Any mismatch means the enumeration rule is wrong and blocks the larger
        discriminants.
    - metric: witness_order_verification_agreement
      direction: different
      minimum_effect: >-
        The composition-verified order equals the enumeration's predicted order in 100 percent
        of cells. A single disagreement falsifies the enumeration as instantiated.
    - metric: case_count_versus_number_of_prime_factors
      direction: higher
      minimum_effect: >-
        Strictly increasing in the number of prime factors of the discriminant, and MINIMAL at a
        prime discriminant. A flat case count across factorization structures means the
        enumeration is not tracking the factorization.
    - metric: surviving_cell_count
      direction: lower
      minimum_effect: >-
        Zero cells survive all named countermeasures. A count above zero is the high-value
        outcome, is reported with the surviving cell's witness, and may not be recorded as a
        finding without independent re-verification.
    - metric: countermeasure_evaluability
      direction: lower
      minimum_effect: >-
        Zero countermeasures recorded as not evaluable. A countermeasure that cannot be expressed
        as a predicate on the witness is a gap in the table, not a passing column, and its cells
        are reported empty rather than removed.
  test_boundary:
    instances:
      - >-
        A declared class of small discriminants spanning varied factorization structures, from
        prime to several prime factors.
      - >-
        A sub-range small enough for the entire class group to be computed by exhaustive form
        reduction, used as the baseline reproduction gate.
      - >-
        At least one prime discriminant, as the minimal-case control.
    parameters:
      discriminant_class: declared before enumeration and recorded, with its boundary stated in every deliverable
      exhaustive_subrange: discriminants small enough for full class group computation by reduction
      countermeasures: 'working in a quotient; restricting to a subgroup; choosing prime discriminants; each stated as a predicate before any cell is evaluated'
    implementation: >-
      A new standalone driver under experiments/EXP-CLGRP-a76097/driver/ implementing form
      composition, reduction, order verification by repeated composition, ambiguous-form
      enumeration from the factorization, and the countermeasure predicates. Nothing under
      harness/ is modified.
    budget:
      wall_clock_seconds_total: 1800
      maximum_memory_gb: 4
      maximum_runs: 8
  falsification_conditions:
    - >-
      A composition-verified witness order disagrees with the enumeration's prediction in any
      cell. The enumeration as instantiated is wrong; the table is not emitted and the
      disagreement is the reported result.
    - >-
      The predicted case set differs from the exhaustively computed two-torsion at any
      discriminant in the exhaustive sub-range. The enumeration rule is wrong and nothing larger
      is attempted.
    - >-
      The case count does not vary with the number of prime factors, or is not minimal at a prime
      discriminant. The enumeration is not tracking the factorization and the completeness claim
      has no basis.
    - >-
      The enumeration cannot be made exhaustive within the declared class. The boundary is stated
      explicitly and NO completeness is claimed; the table is emitted as a partial table labelled
      as such.
    - >-
      At least one cell survives every named countermeasure. Limb G3 is FALSE. This is the highest
      value outcome available here and it is recorded only after independent re-verification, with
      the surviving witness archived.
  interpretation_limits:
    - >-
      A structural witness is a statement about the GROUP, not about any system using it. No
      deployed parameter is evaluated and no security verdict is recorded.
    - >-
      Small discriminants only. Nothing here extends to deployment-sized discriminants, and the
      structural argument's extension is a separate claim not made here.
    - >-
      Exhaustiveness is claimed only within the DECLARED class of discriminants and is void
      outside it. A table that looks complete but is not is worse than one that states its
      boundary, and the boundary is therefore restated in every deliverable.
    - >-
      A countermeasure recorded as removing a case removes it at the discriminants where the
      predicate was evaluated. Nothing about its behaviour elsewhere follows.
    - >-
      Nothing here is an attack. No group order is computed, no assumption is broken, and no
      claim of a break is available from any outcome.
  status: proposed
  proposed_by: idea-generator
  specified_by: coordinator
  prior_evidence_refs:
    - RQ-CLGRP-66ab7f
    - IDEA-20260809-83cbc7
    - GOAL-CLGRP-001
  distinguishable_outcomes:
    - outcome: >-
        The predicted case sets match the exhaustive computation, every witness order verifies by
        composition, the case count is minimal at the prime discriminant and grows with the number
        of prime factors, and every cell is removed by at least one countermeasure.
      meaning: >-
        G1, G2 and G3 all hold at the enumerated discriminants. The question owns a complete
        case-by-countermeasure table with a constructed and verified witness in every cell, scoped
        explicitly to the declared discriminant class. This is a checked-fix result, not a security
        verdict about any system.
    - outcome: >-
        At least one cell survives every named countermeasure.
      meaning: >-
        G3 is FALSE, and this is the HIGH-VALUE outcome. A structural case exists that the named
        countermeasures do not remove. It is recorded only after independent re-verification, with
        the surviving witness archived, and it is stated as a statement about the group at the
        discriminants tested - not as a break of any deployed system, which this design cannot
        support.
    - outcome: >-
        A composition-verified witness order disagrees with the prediction, or the predicted case
        set differs from the exhaustive computation.
      meaning: >-
        The enumeration as instantiated is WRONG. No table is emitted. The disagreement is the
        reported result and the next target is the enumeration rule or the composition
        implementation, distinguished by whether the known-answer composition tests passed.
    - outcome: >-
        The case count does not track the number of prime factors, or is not minimal at a prime
        discriminant.
      meaning: >-
        The instrument is not measuring what it claims - the enumeration is not driven by the
        factorization - so neither the coverage claim nor any negative from it is available. The
        prime-discriminant control is what surfaces this, and its failure voids the run set.
    - outcome: >-
        Exhaustiveness cannot be established within the declared class.
      meaning: >-
        G1's completeness limb is UNRESOLVED. The table is emitted as explicitly PARTIAL with its
        boundary stated, which is a smaller but honest deliverable, and no coverage claim is made
        over the unenumerated remainder.
