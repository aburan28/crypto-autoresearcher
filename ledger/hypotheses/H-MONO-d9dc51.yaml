hypothesis:
  id: H-MONO-d9dc51
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  derived_from_idea: IDEA-20260831-3fa5c9
  status: proposed
  added: '2026-09-05'

  known_erratum_correction: >-
    IDEA-20260831-3fa5c9's own `known_errata` field discloses that an
    out-of-band commit (725401e05, CORR-20260831-ca3ec5) changed its
    falsification_conditions[2] from "the statistic's power ceiling sits
    ABOVE this entire tested range" to "...sits BELOW...", framed as
    fixing a "reversed polarity," and that the Coordinator at the time
    independently re-verified the ORIGINAL "above" reading was the
    logically correct one (the erroneous "fix" was never applied to the
    idea's own on-disk text, per this program's immutability discipline,
    so that file still literally reads "below"). This hypothesis's own
    `falsification_conditions` below uses the CORRECTED "above" reading
    throughout, so that no future reader of THIS record ever has to
    re-derive the correction or risk copying the idea's literal erroneous
    text forward again. The reasoning, restated once here: if the oracle
    perturbed-only arm fails to reject even at the single MOST favorable
    tested cell (10% perturbation, 15 curves -- the largest per-curve
    effect and the most curves pooled), then no weaker cell in the grid
    could have rejected either, so the effect size/panel size actually
    needed to reach adequate power lies BEYOND (above) everything tested,
    not below it; "below" would imply the required threshold was already
    achievable well within the tested range, directly contradicting the
    stated premise that even the strongest cell failed.

  statement: >-
    SCOPE: identical to H-MONO-663fb4's own (prime fields F_p, p in
    [100, 3000]; E(F_p) a finite abelian group; symmetric factor bases;
    m=4 as the primary tested moment, matching this three-experiment
    lane's own choice; claim tier toy for every measurement). NO ATTACK,
    NO EXPONENT, NO CRYPTO-SCALE TRANSFER, NO ECDLP CLAIM OF ANY KIND.

    THE DISCRIMINATION, restated from IDEA-20260831-3fa5c9 and carried
    here PRECISELY, two mutually exclusive outcomes neither of which is
    assumed or resolved by this record itself (that is what the paired
    experiment is for):

    (A) The Fisher-combined panel-level statistic H-MONO-663fb4 introduced
    as a co-equal primary metric DOES reject the null at a realistic,
    graded, multi-curve effect size (2-10% of a curve's factor base
    replaced by elements of a fixed proper-subgroup coset, across 5-15
    curves), even though EXP-MONO-b1423c already showed it could NOT
    reject a single maximally-extreme exact-subgroup outlier (C/F=1.0) at
    k~49-191 curves. This would mean the permutation-floor cap that
    defeated the statistic in the single-extreme-outlier regime does NOT
    bind in the many-mild-curves regime -- because Fisher combination
    pools evidence multiplicatively across independent cells, so k
    moderately-informative p-values can jointly cross a threshold no
    single p-value individually can, even when no single cell's own floor
    is itself threshold-crossing -- confirming the statistic has SOME
    genuine detection capability distinct from, and complementary to, the
    per-curve Holm test.

    (B) The Fisher-combined statistic ALSO fails to reject in the
    many-mild-curves regime at a realistic effect size, at the SAME
    sample budget already spent in this three-experiment lane (n=20000
    permutation draws per cell). This would mean the statistic has never
    been shown to detect ANY real deviation, in either its introduced
    regime (many-mild-curves) or its already-tested regime
    (single/few-extreme-outlier) -- a specific, actionable finding about
    a "co-equal primary metric" (per KN-TECH-a810e4's own framing) that
    the Coordinator should weigh explicitly rather than leave as an open
    qualification.

    Both (A) and (B) are reportable outcomes; this record commits to
    neither in advance, per its own falsification_conditions below and per
    IDEA-20260831-3fa5c9's own explicit prohibition on pre-resolving a
    two-sided design.

  mechanism: >-
    Reuses H-MONO-663fb4's own established machinery UNMODIFIED: the
    character-bias identities (I1)-(I3) (see H-MONO-663fb4's own
    mechanism steps (1)-(3)); the Fisher-combined p-value statistic
    exactly as implemented, twice-reviewed, and cross-checked against
    scipy to 4.4e-14 max error in EXP-MONO-b19c6b's `stats.py`
    (`fisher_combined_pvalue`, `permutation_pvalue`, `holm_bonferroni`),
    reused byte-identical again in EXP-MONO-b1423c; the permutation-null
    calibration already validated at n=20000 draws per KN-TECH-95a42b's
    design-time floor-vs-threshold check; and the exact subgroup-spectrum
    closed form (Shat(chi)=h on the annihilator of H, 0 elsewhere, per
    H-MONO-663fb4 mechanism step (5)) that gives the exact positive
    control EXP-MONO-b1423c already realized (RO3, p=307, N=288, exact
    C/F=1.0 at h=N/2 and h=N/4).

    ONE NEW INGREDIENT: a PLANTED, GRADED, MULTI-CURVE perturbation,
    exactly as IDEA-20260831-3fa5c9 specifies. STEP 1: select up to 15
    curves from EXP-MONO-b19c6b's own already-realized, already-archived
    random-ordinary panel (RUN-MONO-b19c6b-1's `stage3_per_curve_raw_pvalues`
    background, 48 curves). For each of the k selected curves (k in
    {5,10,15}), construct a PERTURBED factor base by replacing a disclosed
    fraction (2%, 5%, or 10% of |F|) of its real x-coordinate factor
    base's elements with elements drawn from a FIXED proper-subgroup
    coset of that curve's own group, elevating that curve's own C/F by a
    modest, EXACTLY COMPUTABLE amount (derived from the same closed-form
    subgroup spectrum, before any sampling occurs) above its matched-
    random-subset null -- NOT the exact C/F=1.0 extreme EXP-MONO-b1423c
    already tested. STEP 2: compute each perturbed curve's own per-curve
    permutation p-value for Var and C/F at m=4 exactly as the existing
    validated instrument does, at n=20000 draws (the SAME null population
    size already shown powered for this instrument; because the null
    population for a curve of a given factor-base size F does not depend
    on which F-sized subset is being tested, one 20000-draw null
    population per curve suffices and is reused across every perturbation-
    fraction and panel-size cell that curve appears in -- stated explicitly
    here because it is the compute-saving fact the paired experiment's
    budget depends on). STEP 3: form the FULL-PANEL Fisher combination by
    mixing the k perturbed curves' raw p-values with the REMAINING,
    UNPERTURBED curves from the same archived 48-curve background (exactly
    mirroring EXP-MONO-b1423c's own single-perturbed-cell-plus-background
    construction, generalized here to k simultaneously-perturbed cells),
    and separately form the ORACLE Fisher combination over the k perturbed
    curves ALONE (an upper bound on best-case sensitivity, disclosed as an
    oracle comparator, not a realistic operating condition). STEP 4:
    repeat across the fraction ladder {2%,5%,10%} and, at the middle rung
    (5%), across the panel-size ladder {5,10,15}, to locate -- rather than
    assert -- a detectable/undetectable boundary if one exists in the
    tested grid. A MATCHED NULL-PANEL CONTROL is run at every panel size:
    the same k curve identities used for perturbation, WITH NO
    perturbation applied (their real, unperturbed factor base), combined
    with the identical background composition, through the identical
    full-panel and oracle pipelines -- confirming the statistic does not
    spuriously reject a genuinely null k-curve subset before any planted
    cell is interpreted.

    WHY THIS DIRECTLY DISCHARGES THE NAMED GAP, NOT A DIFFERENT ONE (relayed
    from IDEA-20260831-3fa5c9, verified there): EXP-MONO-c819ba's null-object
    gate already established the Fisher-combined statistic's SPECIFICITY
    (it does not fire on null-vs-null); EXP-MONO-b1423c established its
    INSENSITIVITY at one extreme (single maximally-biased outlier). Neither
    establishes SENSITIVITY at the graded, multi-curve regime the statistic
    was actually introduced for. This is that missing measurement.

  assumptions:
    - >-
      The subgroup-coset perturbation mechanism (replacing a disclosed
      fraction of a curve's factor base with elements from a fixed proper
      subgroup coset) produces an EXACTLY COMPUTABLE, non-extreme
      elevation in that curve's own C/F, derivable in closed form from the
      subgroup spectrum H-MONO-663fb4's mechanism step (5) already
      supplies, so the planted effect size at each perturbation fraction
      is known exactly before any run, not merely hoped for. This is a
      Stage-0 gate in the paired experiment, not asserted here.
    - >-
      The already-validated permutation-null instrument (n=20000 draws,
      Holm-corrected per-curve thresholds, Fisher-combined panel statistic)
      from EXP-MONO-b19c6b/EXP-MONO-b1423c is reused unmodified; no new
      instrument is built.
    - >-
      The null population for a curve at a fixed factor-base size F does
      not depend on which specific F-sized subset (perturbed or not) is
      being scored against it, so one 20000-draw null population per
      selected curve can be reused across every fraction/panel-size cell
      that curve participates in, rather than redrawn per cell.
    - >-
      5-15 curves is enough for the Fisher combination's own floor-vs-
      threshold arithmetic to be checked before any run (a required Stage
      0 gate per KN-TECH-95a42b's discipline, extended from per-cell
      permutation floors to the combination's own effective degrees of
      freedom at k in {5,10,15}).

  proof_search_map:
    bottleneck: >-
      Whether the Fisher-combined statistic has ANY demonstrated ability
      to detect a real, non-extreme, multi-curve effect at the sample
      budget this lane has already validated -- as opposed to having only
      ever been shown either to correctly stay silent (null-object gate)
      or to correctly-but-uninformatively stay silent on a case it was
      never designed to catch (the single-extreme-outlier positive
      control, EXP-MONO-b1423c).
    baseline_embedding:
      parameter_slice: >-
        EXP-MONO-b1423c's own already-run subgroup positive control
        (C/F=1.0 exact, single curve, RO3 at h=N/2 and h=N/4) is the
        extreme end of this record's own perturbation-fraction ladder;
        reproducing that cell's already-committed non-rejection result
        under the SAME implementation is the hard gate before any new,
        milder, multi-curve cell is interpreted.
      reproduction_check: >-
        Re-run the exact RO3 single-curve, exact-subgroup cells (h=N/2,
        h=N/4) and require exact reproduction of EXP-MONO-b1423c's own
        S5/S1-S4 values (both cells at the permutation floor 1/20001 on
        both statistics; both mixed-panel Fisher combinations failing to
        reject at 0.05), using the identical Fisher-combination code path
        this record's multi-curve arms will also use.
    observation_collision:
      observable: >-
        The Fisher-combined p-value, as a function of (perturbation
        fraction, number of perturbed curves in the panel, panel
        composition).
      distinct_preimage_search: >-
        FOUND, and it is exactly what motivates a graded design rather
        than a single cell: a null panel (no genuine effect) and a
        genuinely mildly-affected panel (small effect spread across
        several curves) can in principle produce statistically
        indistinguishable Fisher-combined p-values if the effect size is
        too small or too few curves are affected relative to the panel
        size -- which is precisely the boundary this record's ladder is
        designed to locate rather than assume away.
    quantifier_order: >-
      FOR the tested perturbation-fraction ladder {2%,5%,10%} and
      panel-size ladder {5,10,15}, THERE EXISTS a combination at which the
      Fisher-combined statistic rejects the null at the pre-registered
      alpha (bounded, falsifiable existential over the tested grid); if no
      such combination exists within the tested range, that absence is
      reported as a bounded negative result over the tested grid, not as
      "Fisher-combined has no power at any effect size."
    method_ceiling:
      strongest_certifiable_claim: >-
        Whether the Fisher-combined statistic, at this lane's own
        already-validated sample budget, can detect a planted effect of
        the tested magnitudes and panel compositions. Cannot certify the
        statistic's power at effect sizes or panel sizes outside the
        tested grid, and cannot certify anything about whether any REAL
        curve exhibits such an effect (this record plants a known effect;
        it does not search for one).
      nearby_object_control: >-
        The already-run exact-subgroup single-curve cells (RO3, C/F=1.0)
        are the nearby-object control on which the statistic is already
        known to fail to reject, for a STRUCTURAL reason (the permutation
        floor, per EV-MONO-0e7ace). A method that ALSO fails at every
        tested milder, multi-curve combination has not merely failed once;
        it has failed across the entire tested design space, which is a
        materially stronger and more actionable finding than the
        single-cell result already on record.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The already-validated per-curve permutation-null instrument,
          applied to a DELIBERATELY PLANTED, exactly-known, graded
          perturbation across a multi-curve panel rather than to real,
          unknown curves.
        predicted_gain: >-
          Converts an open sensitivity qualification into a measured
          detection-power curve as a function of effect size and panel
          composition, at zero new instrument-development cost.
    proof_obligations:
      - claim: >-
          The planted perturbation's exact C/F elevation is computed in
          closed form from the subgroup spectrum before any sampling
          occurs.
        responsibility: baseline
      - claim: >-
          The RO3 single-curve, exact-subgroup cells reproduce
          EXP-MONO-b1423c's own already-committed non-rejection result
          under this record's own paired-experiment implementation.
        responsibility: correctness
      - claim: >-
          The Fisher combination's own floor-vs-threshold arithmetic (at
          5-15 combined p-values) is checked and reported before any run.
        responsibility: strictness
      - claim: >-
          A detection-power surface (reject/no-reject) is reported across
          the full perturbation-fraction x panel-size grid, not a single
          cell.
        responsibility: interface
      - claim: >-
          The matched null-panel arm does not spuriously reject at any
          tested panel size.
        responsibility: soundness
    not_applicable_reason: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. This record makes no complexity claim of any kind;
    it measures the practical detection power of an already-existing
    statistical instrument on a planted, exactly-known effect. sota_delta
    is zero on every attack axis; dominated_by is not applicable.

  heuristic_assumptions:
    - id: HEUR-MONO-FISHER-1
      formal_statement: >-
        Fisher's combined-probability statistic, applied to k independent
        per-curve permutation p-values each individually powered at
        n=20000 draws, has detection power that increases with both the
        per-curve effect size and the number of affected curves, following
        the classical chi-squared(2k) null distribution of
        -2*sum(log p_i) under the null hypothesis of no effect anywhere in
        the panel.
      random_model_justification: >-
        The chi-squared(2k) null distribution of Fisher's statistic under
        independent uniform p-values is a classical, exact result (Fisher
        1932); the gap, stated plainly, is whether the per-curve p-values
        in THIS instrument are genuinely independent across curves (no
        shared randomness, prime, or curve-family artifact) at the panel
        sizes tested -- a property KN-TECH-95a42b's own addendum flags as
        needing explicit per-test verification within a composite gate,
        not assumed.
      supporting_results: []
      validation_experiment_ids: [EXP-MONO-2114ea]
      falsification_condition: >-
        The matched null-panel arm's empirical rejection rate deviating
        materially from the nominal alpha at any tested panel size,
        indicating the combined statistic's independence assumption fails
        for this instrument's actual per-curve p-value generation process.

  structural_ingredients:
    - description: >-
        The subgroup spectrum identity Shat(chi)=h on the annihilator of a
        subgroup H, 0 elsewhere, used here to compute the exact,
        closed-form C/F elevation produced by replacing a disclosed
        fraction of a factor base with elements of a fixed subgroup coset.
      citation: >-
        Derived in H-MONO-663fb4's own mechanism step (5); no new
        derivation is performed here, only reuse of that closed form at a
        partial (non-exhaustive) replacement fraction rather than a full
        subgroup substitution.
      provenance: internal
      verified_by: coordinator (this session, read H-MONO-663fb4's mechanism
        section and EXP-MONO-b1423c's implementation/controls.py in full)
      role: >-
        Supplies the exact, pre-sampling C/F elevation for each
        perturbation-fraction cell (Stage 0 gate in the paired experiment).
    - description: >-
        Fisher's method (-2*sum(log p_i) ~ chi2(2k) under independence).
      citation: Fisher 1932, classical result; standard, not re-derived.
      provenance: internal
      verified_by: >-
        coordinator (this session, read EXP-MONO-b1423c's own
        implementation/stats.py `fisher_combined_pvalue` and
        `chi2_sf_even_df`, which this record reuses unmodified).
      role: supplies the panel-level combination statistic under test.

  reduction_chain:
    core_problem: >-
      Whether H-MONO-663fb4's Fisher-combined panel-level statistic, as
      actually implemented and already validated for specificity, has any
      demonstrated sensitivity to a genuine, non-extreme, multi-curve
      effect -- the regime it was introduced to catch.
    corollaries:
      - problem: >-
          Whether the Fisher-combined statistic should continue to be used
          as a "co-equal primary metric" in this lane's own protocol
          (KN-TECH-a810e4's framing), or whether its continued use should
          be reconsidered given a demonstrated, actionable sensitivity gap.
        reduction_ref: null
        asymptotics_preserved: not_applicable
    corollaries_note: >-
      DELIBERATELY EXCLUDED: any statement about H-MONO-663fb4's own
      overall K3/K4 disposition (unaffected, per its own status_note); any
      ECDLP cost, exponent, or cryptographic-scale claim; any claim about
      whether any REAL curve exhibits the planted-style effect.

  predictions:
    - metric: >-
        Fisher-combined p-value at the RO3 single-curve, exact-subgroup
        reproduction cells (h=N/2, h=N/4)
      direction: same
      minimum_effect: >-
        Reproduces EXP-MONO-b1423c's own already-committed non-rejection
        result exactly (hard gate; a mismatch here means the paired
        experiment's implementation differs from the prior lane's and
        nothing downstream is interpretable).
    - metric: >-
        Fisher-combined p-value across the perturbation-fraction x
        panel-size grid, full planted panel (perturbed curves plus
        unperturbed background)
      direction: lower
      minimum_effect: >-
        PRE-REGISTERED, TWO-SIDED, NO PRE-COMMITTED DIRECTION OF THE FINAL
        VERDICT: at the mildest cell (2% perturbation, 5 curves), the
        statistic is predicted MORE LIKELY THAN NOT to fail to reject,
        matching the extreme-outlier finding's structural cause; at the
        strongest tested cell (10% perturbation, 15 curves), the statistic
        is predicted to have a REALISTIC CHANCE of rejecting, since
        pooling across more curves and a larger per-curve effect both
        favor detection. Both directions are reportable outcomes and
        neither is assumed.
    - metric: >-
        Fisher-combined p-value, oracle perturbed-curves-only subset
        (upper bound on best-case sensitivity)
      direction: lower
      minimum_effect: >-
        At the strongest tested cell, predicted to reject more readily
        than the full-panel arm (since diluting with unperturbed
        background curves can only weaken the combined signal); a failure
        of the oracle arm to reject even at the strongest tested cell
        would be the single most informative possible outcome (see
        `known_erratum_correction` above and the corrected
        `falsification_conditions[2]` below).
    - metric: >-
        per-curve Holm-corrected test outcome on the same planted panels
      direction: different
      minimum_effect: >-
        Reported alongside every Fisher-combined result as the existing,
        already-power-verified comparator; the per-curve test is predicted
        to detect the individually-perturbed curves directly at the
        stronger perturbation fractions, giving an independent check on
        whether the planted effect is real and detectable by SOME
        instrument even where Fisher-combined is not.

  test_boundary:
    instances:
      - >-
        Up to 15 curves drawn from EXP-MONO-b19c6b's own already-realized
        random-ordinary panel (RUN-MONO-b19c6b-1, field_bits in
        [7,8,9,10,11], prime range [100,3000]), reused by curve_ordinal,
        not reconstructed.
      - >-
        Factor bases: (a) each selected curve's real x-coordinate factor
        base at F=N/4 (matching this lane's own primary tested F), mildly
        perturbed at 2%/5%/10% of |F| by a fixed subgroup-coset
        substitution; (b) the RO3 exact-subgroup reproduction cells
        (h=N/2, h=N/4), reused unmodified from EXP-MONO-b1423c/
        EXP-MONO-c819ba; (c) matched null-panel curves, same identities,
        unperturbed.
      - m = 4 only (the primary tested moment in this three-experiment
        lane; m=1-3 out of scope for this record).
      - >-
        Targets: ALL R in E(F_p), exhaustively, per-curve, unchanged from
        this lane's existing instrument.
    parameters:
      m_value: 4
      perturbation_fraction_ladder: [0.02, 0.05, 0.10]
      panel_size_ladder: [5, 10, 15]
      null_draws_per_curve: 20000
      curve_source: EXP-MONO-b19c6b RUN-MONO-b19c6b-1 random-ordinary panel (48 curves)
      reproduction_cells: RO3 (p=307, A=269, B=6, N=288) at h=N/2=144, h=N/4=72
    implementation: >-
      Reuse experiments/EXP-MONO-b19c6b/implementation/{fields,curve,conv,
      groupstate,stats}.py byte-identical, and
      experiments/EXP-MONO-b1423c/implementation/{controls.py's
      subgroup_control, draw_symmetric_null_subset pattern}, per the paired
      experiment's own frozen contract. No new statistical instrument is
      built; only a new panel/perturbation-construction module.
    budget: {}

  falsification_conditions:
    - >-
      The RO3 single-curve, exact-subgroup reproduction cells fail to
      match EXP-MONO-b1423c's own already-committed non-rejection result.
    - >-
      The matched null-panel arm rejects at a rate materially above the
      declared alpha at any panel size (specificity failure at the new
      panel sizes).
    - >-
      CORRECTED READING (see `known_erratum_correction` above; the
      source idea's own on-disk text still reads "below" and is
      superseded by this wording, not edited in place): the oracle
      perturbed-only arm fails to reject even at the strongest tested
      cell (10% perturbation, 15 curves) -- the single most informative
      negative, indicating the statistic's power ceiling sits ABOVE this
      entire tested range (the effect size/panel size actually needed to
      reach adequate power lies beyond everything tested, not below it).
    - >-
      The full-panel arm rejects at a rate materially different from what
      the per-curve Holm test independently confirms as a real, detectable
      planted effect, without a stated mechanism for the discrepancy.

  interpretation_limits:
    - "CLAIM TIER toy for every measurement."
    - "NO ECDLP CLAIM OF ANY KIND, in either direction. This is an instrument-sensitivity measurement, not a curve-specific or relation-rate finding."
    - >-
      A positive result (Fisher-combined detects the planted effect at
      some tested cell) does NOT establish that any REAL curve exhibits
      such an effect; a negative result across the whole grid does NOT
      prove the statistic has zero power at every conceivable effect
      size, only across the tested grid.
    - >-
      DOES NOT CHANGE H-MONO-663fb4's overall K3/K4 disposition, which its
      own status_note already states rests on the per-curve Holm reading
      independent of this qualification.
    - >-
      PERTURBATION MECHANISM SPECIFICITY: the measured detection power is
      a property of THIS perturbation mechanism (subgroup-coset
      substitution) and this record's own grid, not of "any mild deviation
      whatsoever."
    - >-
      GRID COARSENESS: three perturbation fractions and three panel sizes
      is a coarse grid; a detectable/undetectable boundary, if one exists,
      is located only to the grid's own resolution.
    - "NO STATUS CHANGE to any other record is proposed or implied by this record alone (Coordinator authority alone, AGENTS.md rule 1)."

  status_note: >-
