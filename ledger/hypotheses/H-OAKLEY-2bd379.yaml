  title: >-
    Both Oakley b values lie outside F_{2^p}, and the written floor 2^{40}
    sits above 2^{38.9} and below 2^{48.4}.
  statement: >-
    Group 3 is F_2[u]/(u^155+u^62+1) with b = 471951 and p = 31. Group 4 is
    F_2[u]/(u^185+u^69+1) with b = 7913 and p = 37. On both fields, b raised
    to 2^p, to 2^5, and to 2^1 is different from b. The degree identities
    are 5! = 120, 2^{20} squared equals 2^{40}, and 2^{20}/16 = 2^{16}.
    Also 120^10 > 2^69 and 120 < 128, so log2(120) lies strictly between
    6.9 and 7. In tenths, 758 - 310 - 59 = 389 and 913 - 370 - 59 = 484,
    and 400 is greater than 389 and less than 484.
  mechanism: >-
    The map x -> sqrt(b)/x preserves the subfield factor base only when b
    lies in F_{2^p}. Squaring is bijective, so that happens exactly when
    b^{2^p} = b. This contract checks that equality and the integer
    comparisons written next to the degree 2^{20}. It does not compute a
    Groebner basis.
