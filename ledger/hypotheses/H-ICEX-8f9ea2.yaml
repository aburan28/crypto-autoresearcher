  interpretation_limits:
  - >-
    The balance law is an identity about a FAMILY of attacks, not a lower bound on
    the ECDLP. It says nothing about attacks that do not re-randomise and must
    never be cited as a hardness result.
  - >-
    T(W) at least sqrt(|W|) is an empirical regularity of the known classes and is
    NOT claimed as a theorem; the record exists because it might be false.
  - >-
    THE CASCADE IS REMOVED, NOT WEAKENED. The source idea's predicted outcome
    rested on reading KN-FIND-ffe1df as 'no cheap sum-compatible filter on
    E(F_p)'. That reading is wrong- the finding's headline is withdrawn, its
    independent validation returned failed, and it states in its own words that
    the lane is narrowed rather than closed and that j = 2 is UNPROVED. No
    conclusion in this record depends on it in either direction, and a controlled
    null here may not be attributed to a filter barrier.
  - >-
    Claim (D) is a portability audit of a template, not a statement about what any
    future ingredient could do. It names a search target - a guaranteed-existence
    theorem placing the witness in a space of size n^{1-delta} with delta above 0,
    or a promise class with R below 1 - and naming a target is not declaring the
    direction impossible.
  - >-
    UNTESTABLE AT REACHABLE SCALE, STATED PLAINLY, IN TWO SENSES. First, the
    strongest form of the claim quantifies over ALL promise classes and ALL
    solvers and is not certifiable by any experiment, at any scale. Second, at
    l = 24 a low-weight class can be a large fraction of the group - at w = 12 the
    class is about 16 percent of n - so the n/|W| factor is small and the
    wrapper's cost is dominated by a single solver run, biasing the absolute R
    DOWNWARD, toward a false break. The l ladder is the only defence and it stops
    at 36 bits because both solvers must run to completion at least 200 times per
    cell.
  - >-
    Memory. SOLVER-R's lists are larger than SOLVER-I's at equal weight, so a cost
    model counting only group operations flatters it. Peak memory is a required
    metric and any rho below 1 must be restated in the fully charged parallel
    model before it is called a speedup.
  - >-
    Multiple representations inflate the apparent success rate- a solution with
    many representations is found sooner per unit of list, which is the technique's
    point and is legitimate, but the counting must not ALSO credit it in the n/|W|
    factor. Double-counting there is the most likely route to a spurious break and
    the derivation must state where the multiplicity is charged.
  - >-
    Toy tier throughout. Every number is scoped to the tested l, w, curves,
    solvers, filters, counting convention and budget, and no transfer to
    cryptographic n is licensed.
