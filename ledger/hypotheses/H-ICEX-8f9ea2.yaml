  - metric: curve_free_group_arm_difference
    direction: different
    minimum_effect: >-
      'rho(elliptic) minus rho(Z/n cyclic group with the same low-weight class and
      the same power-of-two basis), at matched (l, w). See
      falsification_conditions for the pre-stated consequence of agreement.'
  test_boundary:
    instances:
    - >-
      Generated toy prime-field curves with prime subgroup order n at
      l = 24, 30 and 36 bits, anomalous and smooth-order curves excluded, at least
      200 random instances per (l, w) cell with the scalar known for verification
      and structurally withheld from every solver code path.
    - >-
      CURVE-FREE GROUP ARM- the identical solvers on (Z/n, +) with the same
      low-weight class and the same power-of-two basis, so the group law carries
      no curve structure.
    - >-
      PLAIN-INTEGER ARM- the identical solvers on integer subset-sum instances of
      the same sizes, where the filter is a prefix of the integer.
    parameters:
      l_bits: [24, 30, 36]
      weight_w: 'chosen per l so that the class size spans at least three orders of magnitude'
      instances_per_cell_minimum: 200
      solvers: [SOLVER-I splitting meet-in-the-middle, SOLVER-R representation style]
      arms: [elliptic, curve-free cyclic, plain integer]
      declared_group_filter: 'declared before the run; a bucket of the x-coordinate or a quadratic character'
    implementation: >-
      One frozen group-operation counter that charges list construction, table
      probes and candidate checks, used identically by every solver and every arm.
      One shared solver skeleton parameterised by the group and the filter, so the
      three arms differ only in the group and the filter.
    budget:
      wall_clock_seconds_per_run: 900
      maximum_memory_gb: 16
      maximum_runs: 200
  falsification_conditions:
  - >-
    G1. The uniformity step fails for some x. The law is misstated and the record
    is superseded rather than amended. NOTE- statement (A) shows it cannot fail,
    since b alone gives uniformity; this condition is retained as an instrument
    check on the implementation of the wrapper.
  - >-
    G2 INTEGER POSITIVE CONTROL, BLOCKING. The integer arm does not show
    rho_int below 1. SOLVER-R is not a representation solver, no group-arm
    negative is admissible, and the cell is reported UNTESTED rather than closed.
    This is the failure mode that would turn the record into a fatigue report.
  - >-
    G3 CALIBRATION, BLOCKING. The interval or vacuous calibration misses its
    closed form by more than the stated factor. The cost accounting is wrong;
    nothing is reported.
  - >-
    G4 THE BREAK. Delta at most 0.25 times |log2 rho_int| at all three l, with
    rho(group) below 1 and a negative slope in log |W|, reproduced with the
    integer arm passing and NOT reproduced by the keyed-random-filter null. A
    promise class with a sub-square-root solver exists on an elliptic curve and by
    the balance law the exponent question reopens. It would still be no attack at
    cryptographic scale and would require independent replication and its own cost
    table before any interpretation.
  - >-
    G5 THE CONTROLLED NULL. Delta at least 0.75 times |log2 rho_int| with slope 0
    everywhere. The re-randomisation family is closed for the DECLARED classes and
    the DECLARED filters at the tested sizes. THE MECHANISM MAY NOT BE STATED AS
    'the unavailability of a sum-compatible filter', because KN-FIND-ffe1df does
