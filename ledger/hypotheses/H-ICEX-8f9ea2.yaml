hypothesis:
  id: H-ICEX-8f9ea2
  question_id: RQ-ECDLP-002
  source_idea_id: IDEA-20260901-133fd3
  title: >-
    The promise-class balance law C(W) = T(W) n / |W| is an exact identity that
    reduces the whole free-re-randomisation family to one ratio R(W) =
    T(W)/sqrt(|W|), but the source idea's pre-registered band on R is computed
    here to be DEGENERATE - the same splitting solver yields R from 0.64 to 15.4
    at one cell purely by changing what the operation counter charges, so the
    cascade branch is entailed by bookkeeping - and the cascade's cited premise
    is FALSE- KN-FIND-ffe1df was opened in full for this record and its headline
    is WITHDRAWN by red team, its independent validation returned failed, and it
    states in its own words that j = 2 is UNPROVED, not refuted
  statement: >-
    SCOPE FIELD. Prime-field ECDLP over E/F_p with P of prime order n. The
    handoff label is correct for this record.

    (A) THE BALANCE LAW, WITH ITS UNIFORMITY STEP WRITTEN OUT. Two
    re-randomisations are free and exact- the shift x to x + b, realised by
    Q to Q + [b]P, and the scale x to a x for a invertible mod n, realised by
    Q to [a]Q. Call a subset W of Z/n a PROMISE CLASS with solve cost T(W) if
    some algorithm, given (P, Q) with the promise that the logarithm lies in W,
    returns it in T(W) group operations. For an attack that draws (a, b)
    uniformly, forms Q' = [a]Q + [b]P and runs the W-solver, repeating on
    failure, each attempt succeeds with probability exactly |W| / n, so the
    expected total is
      C(W) = T(W) * n / |W|.
    THE UNIFORMITY STEP IS TRIVIAL AND x = 0 IS NOT SPECIAL- b is uniform on Z/n
    and independent of a, so a x + b is uniform on Z/n for EVERY fixed value of
    a x, including a x = 0. The source idea treats x = 0 as 'the degenerate case
    the derivation must handle rather than assume away'; it is handled by
    observing that the shift alone suffices for uniformity, and the scale is
    needed only to preserve invertibility of the pullback. Writing
    R(W) = T(W)/sqrt(|W|) gives C(W) = R(W) * n / sqrt(|W|), so the family is
    controlled by one dimensionless number.

    (B) WHAT THE LAW SETTLES AT ZERO COMPUTE. R is of order 1 for every
    incumbent- about 2 for kangaroo on an interval and about 0.886 for rho on the
    vacuous class W = Z/n - and never decays with |W|, which is why the family
    has produced nothing. Separately, the exemplar template's enabling ingredient
    places a witness in a space of size p^{1/3} inside an ambient of size p; the
    ECDLP's best available guaranteed-existence statement, rational
    reconstruction, has witness space of size exactly n, a reduction of ZERO, and
    zero is FORCED for any instance-independent representation by pigeonhole -
    x is uniform on n values, so a family covering all of them has at least n
    witnesses. THAT PIGEONHOLE ARGUMENT IS CORRECT AS STATED and is adopted.

    (C) THE CASCADE'S CITED PREMISE IS FALSE, AND THIS IS THE RECORD'S SINGLE
    MOST IMPORTANT CORRECTION. IDEA-20260901-133fd3 builds its predicted outcome
    on 'the finding it cites as KN-FIND-ffe1df (no cheap sum-compatible filter on
    E(F_p))', explicitly marked in that record as LOCATED BY GREP AND NOT OPENED.
    TASK-20260904-f2b3db OPENED IT AND READ IT IN FULL. Its own title reads-
    '(O2) a conditional, class-restricted, level-1, BUCKET-AVERAGED barrier for
    sum-compatible filters on E(F_p) - NOT a closure of the Wagner k-tree lane'.
    Its own section heading reads 'THE HEADLINE CLAIM IS WITHDRAWN - red team
    RT-20260803-be45a8', and the body states that 'Every theorem here bounds the
    wrong quantity', that the closure 'bounds a lower bound on the attacker's
    rate, which establishes nothing about the attacker', and that 'The narrowest
    valid statement- j = 2 is UNPROVED, not refuted.' An independent Validator
    pass returned verdict `failed` with five confirmed errors. The entry states
    'It does not retire the lane' and that 'the lane is narrowed, not closed',
    with families D, I, J, the non-x members of A and B, and all levels at or
    above 2 uncovered. THE CASCADE OF CLAIM (B) THEREFORE HAS NO SUPPORT IN THIS
    CORPUS. It is REMOVED from this hypothesis's predicted outcome and is
    recorded only as a defeated inherited premise. One consequence is favourable-
    because the filter question is genuinely open, the alternative under which a
    representation-style solver works in the group is LIVE, and the measurement
    has real dynamic range rather than a foregone conclusion.

    (D) THE PRE-REGISTERED BAND ON R IS DEGENERATE, AND THE COMPUTATION IS HERE.
    The source pre-registers 'R at or above 0.9 ... records the CASCADE branch'
    and 'R at or below 0.7 ... records the BREAK branch'. R depends on what the
    operation counter charges, and at one cell three defensible conventions give
    three different verdicts. Take l = 24, w = 4, so the class size is
    binomial(24,4) = 10626 with square root 103.08, and split the 24 positions
    into two halves of 12.
      Convention 1, ONE BALANCED LIST, charge only binomial(12,2) = 66 list
      constructions- R = 66/103.08 = 0.64, INSIDE THE BREAK BAND, with no
      representation technique present at all.
      Convention 2, balanced list plus its complement lookup, charge
      2 * 66 = 132 and divide by the balanced split's success probability
      66^2/10626 = 0.41- expected 322, R = 3.12.
      Convention 3, ALL WEIGHT SPLITS ON EACH HALF, charge
      3 * sum over k of binomial(12,k) for k = 0..4, i.e. 3 * 794 = 2382-
      R = 23.1.
    THE SAME SOLVER ON THE SAME INSTANCES SPANS 0.64 TO 23.1. Under Convention 3,
    which is the honest one because it charges list construction as the source's
    own assumptions require, R at l = 24 is 23.1 at w = 4, 13.3 at w = 8 and 7.47
    at w = 12 - so the CASCADE band R at least 0.9 is satisfied at every cell by
    bookkeeping, and a real-but-partial representation gain would be scored as
    confirming the cascade.

    (E) THE COMPUTED REPLACEMENT, WHICH IS SELF-CALIBRATING AND
    CONVENTION-IMMUNE. Fix one operation counter, use it for every arm, and make
    the statistic a RATIO OF TWO SOLVERS ON THE SAME INSTANCES-
      rho(arm; l, w) := T(SOLVER-R) / T(SOLVER-I),
      Delta(l, w)    := log2 rho(group) - log2 rho(integer).
    The counting convention cancels because it is applied identically to both
    numerator and denominator. THE DYNAMIC RANGE IS SUPPLIED BY THE INTEGER ARM,
    MEASURED IN THE SAME RUN- under the recalled representation figures
    rho(integer) would be about 2^{-0.21 l}, i.e. about 0.030 at l = 24, giving
    |log2 rho(integer)| about 5.04. PRE-REGISTERED, with rho_int the MEASURED
    integer-arm ratio-
      CASCADE if Delta is at least 0.75 * |log2 rho_int| at every l with
        non-negative slope in l;
      BREAK if Delta is at most 0.25 * |log2 rho_int| at all three l AND
        rho(group) is below 1 with a negative slope in log |W|;
      INCONCLUSIVE otherwise;
      UNTESTED if rho_int is at least 1, because then SOLVER-R is not a
        representation solver and no group-arm number is admissible.
    The absolute R(W) is still REPORTED for every cell, because the balance law
    needs it, under the single frozen convention; it is not the discriminator.

    (F) WHAT IS NOT CLAIMED. The balance law is an identity about a FAMILY of
    attacks, not a lower bound on the ECDLP, and it must never be cited as a
    hardness result. T(W) at least sqrt(|W|) is an empirical regularity of the
    known classes and is NOT claimed as a theorem - the record exists because it
    might be false. Nothing here is an attack at cryptographic scale.
  mechanism: >-
    THE TRACKED OBJECT is the PROMISE CLASS itself, a subset of the exponent
    group carried through the computation as a restriction on the input
    distribution rather than as a function of the state. The shift-and-scale group
    acts transitively on Z/n, so any class can be moved onto any instance, which
    is exactly what makes the balance law an identity rather than an inequality.
    What the class discards is the n - |W| instances it cannot solve, and the
    discard is charged in full as the factor n/|W|. The experiment implements two
    solvers for the low-Hamming-weight class - a plain meet-in-the-middle with
    weight splitting, and a representation-style variant whose two halves overlap
    in weight so each solution has many representations, filtered on a DECLARED
    statistic of the group element - and runs them on the elliptic instance, on a
    curve-free group instance, and on the plain-integer instance where the
    representation technique is known to work. The group arm is the measurement;
    the integer arm is the instrument's dynamic range; the curve-free group arm
    separates what the curve contributes from what any cyclic group contributes.
  assumptions:
  - >-
    n prime and known. Scale re-randomisation needs a invertible mod n, which for
    prime n is every non-zero a; composite n is excluded because the uniformity
    step changes.
  - >-
    The promise-class solver is charged in GROUP OPERATIONS INCLUDING the cost of
    building every list it uses. A solver charged only for its collision search is
    measuring an idealised count.
  - >-
    (a, b) drawn uniformly and independently per attempt, so attempts are
    independent and the geometric expectation n/|W| is exact rather than
    heuristic.
  - >-
    ONE frozen operation counter is used for every arm and every solver, and the
    counting convention is declared before any run. The discriminator is a ratio
    of two solvers under that one counter, so the convention cancels.
  - >-
    Toy scale only- l in the 24 to 36 bit range, so that both solvers run to
    completion many times and T(W) is a measured mean rather than an
    extrapolation.
  proof_search_map:
    bottleneck: >-
      Not the balance law, which is one line, but T(W) for the low-weight class
      IN THE GROUP- whether a representation-style solver with a declared
      group-element filter beats splitting. Every exponent statement here is a
      function of that one measured ratio.
    baseline_embedding:
      parameter_slice: >-
        W = Z/n, the vacuous promise, where |W| = n, T(W) is plain rho and the law
        returns C = 0.886 sqrt(n). The second slice is W an interval of length L,
        where T = 2 sqrt(L) by kangaroo and C = 2 n / sqrt(L), minimised at L = n
        back to 2 sqrt(n).
      reproduction_check: >-
        FROZEN FIXTURE, BLOCKING. At a toy n, run the kangaroo solver on intervals
        of three declared lengths and assert measured T within a stated factor of
        2 sqrt(L); run rho on the vacuous promise and assert measured cost within
        a stated factor of 0.886 sqrt(n). If either misses, the cost accounting is
        wrong and no R or rho value is interpretable.
    observation_collision:
      observable: >-
        The ratio R(W) = T(W)/sqrt(|W|) at a given class size.
      distinct_preimage_search: >-
        REQUIRED, AND TWO COLLISIONS ARE ALREADY EXHIBITED BY COMPUTATION. FIRST,
        the counting-convention collision of statement (D)- one solver on one
        instance set gives R in {0.64, 3.12, 23.1} under three defensible
        conventions, so R does not identify the solver's behaviour at all until a
        convention is frozen. SECOND, the instance collision the source names- the
        GROUP low-weight instance and the PLAIN-INTEGER low-weight instance have
        the same nominal class size and the same nominal solver, and they must NOT
        give the same rho. If they do, the group solver is exploiting integer
        structure a real attacker does not have and every group-arm number is
        void.
    constructive_transforms:
    - transform: telescoping_potential
      proposed_object: >-
        Charge the whole re-randomisation family to one global budget- per-attempt
        cost T(W) against inverse success probability n/|W| - with the promise
        class as the randomised location of the unstable increment.
      predicted_gain: >-
        Collapses an open-ended family to one dimensionless ratio and makes the
        exemplar template's non-portability a computation rather than an
        intuition.
    - transform: representation_reduction
      proposed_object: >-
        Move the low-weight promise from the group to the plain-integer subset-sum
        model where the representation technique is known to work, and identify
        exactly the interface that fails to transfer- the partial-sum filter.
        Encoding exact, completeness exact, soundness LOST at the filter, and the
        loss delegated to the measurement.
      predicted_gain: >-
        Localises the whole question to one named object, a sum-compatible filter,
        whose status in this corpus is OPEN rather than closed - see statement (C)
        - so the measurement is genuinely two-sided.
    quantifier_order: >-
      BALANCE LAW- FOR ALL n prime, FOR ALL W contained in Z/n, FOR ALL solvers A
      with promise W and cost T(W), the shift-and-scale wrapper around A has
      expected cost exactly T(W) n / |W| on a uniform instance. The solver is
      quantified INSIDE, so the law constrains a family and not one algorithm.
      THE WEAKER READING NOT CLAIMED- that T(W) is at least sqrt(|W|) for all W.
      That is an empirical regularity of the known classes, it is the very thing
      the measurement probes, and treating it as a theorem would make the record
      unfalsifiable.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most- for the declared promise classes, solvers, filters, counting
        convention and tested sizes, the measured ratios were these numbers with
        this slope, against these controls. It can NEVER certify that no promise
        class has R below 1, because that quantifies over all classes and all
        solvers, and no outcome here bears on the ECDLP's hardness.
      nearby_object_control: >-
        The PLAIN-INTEGER low-weight instance, where R below 1 is expected to be
        achievable by the representation technique. A method that cannot
        distinguish the integer instance from the group instance has not
        identified the load-bearing structure, which is the availability of a
        sum-compatible filter.
    proof_obligations:
    - claim: >-
        a x + b is uniform on Z/n for uniform (a, b) with a invertible, for every
        fixed x including 0.
      responsibility: correctness
    - claim: 'The expected number of attempts is exactly n/|W| and attempts are independent.'
      responsibility: success_probability
    - claim: T(W) is charged in group operations including list construction, under one frozen counter.
      responsibility: runtime
    - claim: The vacuous and interval slices reproduce rho and kangaroo within the stated factors.
      responsibility: baseline
    - claim: The group-arm filter reads only the group element, never the integer exponent or the known randomiser.
      responsibility: interface
    - claim: Any instance-independent representation covering all of Z/n has at least n witnesses.
      responsibility: size
    - claim: >-
        The discriminator is a ratio of two solvers under one counter, so no
        verdict depends on the counting convention.
      responsibility: strictness
    - claim: Every conclusion is scoped to the tested l, w, curves, solvers, filters and budget.
      responsibility: scope
    not_applicable_reason: null
  rerandomization: >-
    THE SHIFT-AND-SCALE ACTION IS THE RE-RANDOMISATION DEVICE AND IT IS EXACT,
    NOT MIXING. x to a x + b is realised by Q to [a]Q + [b]P at a cost of two
    scalar multiplications, is invertible, and pulls a solution back exactly. No
    mixing-time argument is needed or claimed- the action is transitive on Z/n and
    the induced distribution is exactly uniform after ONE step, which is why the
    attempt count n/|W| is an exact geometric expectation rather than a heuristic.
  asymptotic_claim: null
  heuristic_assumptions:
  - id: H1
    formal_statement: >-
      FOR the low-Hamming-weight promise class W(l, w) on a prime-order elliptic
      subgroup, the certified solve cost of the best declared solver satisfies
      T(W) = |W|^{1/2 + o(1)}, uniformly for w between l/8 and l/2.
    random_model_justification: >-
      The rigorous half is the meet-in-the-middle upper bound- splitting the
      weight between a prefix and a suffix gives T at most about sqrt(|W|) times a
      polynomial factor, so the assumption asserts that upper bound is TIGHT. The
      classical statement it imitates is the birthday heuristic for two lists of
      group elements with no exploitable relation between them, the same heuristic
      charged for BSGS and for splitting attacks generally. It is refutable on its
      own terms and the BREAK branch is exactly its refutation.
    supporting_results:
    - >-
      'None internal. knowledge/findings/KN-FIND-ffe1df.md was OPENED AND READ IN
      FULL by TASK-20260904-f2b3db and DOES NOT SUPPORT THIS ASSUMPTION- its
      headline is withdrawn by red team, its independent validation returned
      failed, it states that j = 2 is UNPROVED rather than refuted, and it states
      that the lane is narrowed, not closed. It is recorded as an explicit
      NON-support.'
    - >-
      'Becker, Coron and Joux on improved generic algorithms for hard knapsacks;
      Howgrave-Graham and Joux on subset-sum; Coppersmith's splitting method and
      Stinson's variants for low-Hamming-weight discrete logarithms; May and
      Ozerov on decoding and representations. RECALLED, NOT OPENED by any agent in
      this program. Pointers for the reviewer, not support.'
    validation_experiment_ids:
    - EXP-ICEX-850e41
    falsification_condition: >-
      The BREAK branch fires- Delta at most 0.25 times |log2 rho_int| at all three
      l, with rho(group) below 1 and a negative slope in log |W|, with the integer
      positive control passing and the keyed-random-filter null not reproducing
      it.
  - id: H2
    formal_statement: >-
      FOR a declared statistic v of a group element with image size s, the
      probability that v(A + B) is predictable from (v(A), v(B)) exceeds 1/s by at
      most O(n^{-1/2}) times the statistic's defining degree, so a
      representation-style filter on group elements gains at most a factor
      1 + O(s n^{-1/2}) per merge.
    random_model_justification: >-
      The rigorous ingredient is square-root cancellation in character sums over
      the points of an elliptic curve. THE COMPOSITION WITH THE MERGE ARGUMENT IS
      UNWRITTEN and this is genuinely a heuristic, stated here at the tier this
      program can justify.
    supporting_results:
    - >-
      'None. The corresponding line in analysis/o2-sum-compatible-filters is
      summarised by KN-FIND-ffe1df, which TASK-20260904-f2b3db read in full and
      which states its own theorems bound the wrong quantity - the bucket-averaged
      rate rather than the single-bucket rate a Wagner attacker pays - so it
      supplies no bound on this statistic. Recorded as a NON-support.'
    validation_experiment_ids:
    - EXP-ICEX-850e41
    falsification_condition: >-
      The measured per-bucket excess of v(A+B) predictability over 1/s does not
      shrink like n^{-1/2} across the three field sizes. An excess flat in n is
      the canonical artifact tell and voids the heuristic on the tested scope.
  structural_ingredients:
  - description: >-
      The nearest internal work on sum-compatible filters, whose status the source
      idea mischaracterises and which is corrected here.
    citation: knowledge/findings/KN-FIND-ffe1df.md
    provenance: internal
    verified_by: >-
      TASK-20260904-f2b3db, coordinator- OPENED AND READ IN FULL on 2026-09-04.
      Its title, its 'THE HEADLINE CLAIM IS WITHDRAWN' section, its 'j = 2 is
      UNPROVED, not refuted' sentence, its Validator verdict `failed`, and its 'It
      does not retire the lane' paragraph are quoted in statement (C).
    role: >-
      Recorded as a DEFEATED inherited premise. It supports nothing in this
      hypothesis and the cascade that rested on it is removed.
  - description: >-
      The adjacent internal record reaching the interval-extremality conclusion by
      a different route.
    citation: ledger/proposals/IDEA-20260815-f558e4.yaml
    provenance: recalled
    verified_by: null
    role: >-
      Consistency check only. The source idea reports reading its claim section
      on 2026-09-01; TASK-20260904-f2b3db did NOT open it, so this record marks
      the reference recalled with a null verifier rather than inheriting the
      source's verification. Both records trace to the same fact about arithmetic
      progressions, so agreement is a consistency check and never independent
      corroboration.
  - description: >-
      The fully charged parallel rho baseline that any claimed improvement must
      beat, including per-processor memory.
    citation: 'KN-TECH-006 (this corpus)'
    provenance: recalled
    verified_by: null
    role: >-
      Baseline row. The source idea records it as 'NOT read in this session;
      quoted at second hand'. TASK-20260904-f2b3db did not open it either. It is a
      blocking first-stage read for the executor and supports nothing until read.
  - description: >-
      Representation techniques for subset sum and for low-Hamming-weight discrete
      logarithms, which supply the integer arm's expected behaviour.
    citation: >-
      'Becker, Coron and Joux; Howgrave-Graham and Joux; Coppersmith and Stinson;
      May and Ozerov'
    provenance: recalled
    verified_by: null
    role: >-
      The reason the integer arm is expected to show a ratio below 1. RECALLED,
      NOT OPENED. The integer arm is MEASURED, so nothing depends on the recalled
      exponent 0.29 being right - it only motivates the expectation.
  reduction_chain:
    core_problem: >-
      The measured ratio of a representation-style solver to a splitting solver
      for the low-Hamming-weight promise class, on an elliptic curve, on a
      curve-free cyclic group, and on the plain integers, at toy scale under one
      frozen operation counter.
    corollaries: []
  predictions:
  - metric: solver_ratio_delta_group_minus_integer
    direction: different
    minimum_effect: >-
      'Delta := log2 rho(group) - log2 rho(integer), with
      rho(arm) := T(SOLVER-R)/T(SOLVER-I) on the same instances under one frozen
      counter. PRE-REGISTERED with rho_int the MEASURED integer-arm ratio-
      CASCADE if Delta is at least 0.75 * |log2 rho_int| at every l with
      non-negative slope in l; BREAK if Delta is at most 0.25 * |log2 rho_int| at
      all three l AND rho(group) is below 1 with a negative slope in log |W|;
      INCONCLUSIVE otherwise; UNTESTED if rho_int is at least 1. Under the
      recalled integer figures |log2 rho_int| would be about 5.04 at l = 24,
      putting the two lines at 3.78 and 1.26; the actual lines are set by the
      MEASURED rho_int.'
  - metric: slope_of_log_rho_group_against_log_class_size
    direction: different
    minimum_effect: >-
      'A slope statistically indistinguishable from 0 records the cascade branch.
      A NEGATIVE slope is the only thing that could move an exponent, because a
      fixed ratio below 1 changes a constant while a negative slope changes the
      exponent. This distinction is pre-registered so that a constant-factor
      result is not reported as an exponent result.'
  - metric: absolute_ratio_R_reported_not_decisive
    direction: different
    minimum_effect: >-
      'R(W) = T(W)/sqrt(|W|) is REPORTED for every cell under the single frozen
