      FORCED CALIBRATION VALUES for SOLVER-I at l = 24 under the frozen
      convention, which charges list construction and probes- about 23.1 at
      w = 4, 13.3 at w = 8 and 7.47 at w = 12. A measured SOLVER-I R far from
      these means the counter is not the declared one.'
  - metric: interval_class_calibration
    direction: different
    minimum_effect: >-
      Measured T against 2 sqrt(L), within a factor of 2 at every tested L.
      KNOWN-ANSWER CALIBRATION; a miss means the cost accounting is wrong and
