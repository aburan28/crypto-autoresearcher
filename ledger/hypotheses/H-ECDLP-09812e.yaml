# H-ECDLP-09812e
# Point count and coordinate shift on the Hesse cubic C_27 over F_97.
# No group law. Approval: DEC-20261001-ebbc28.
hypothesis:
  id: H-ECDLP-09812e
  question_id: RQ-ECDLP-002
  source_idea: IDEA-20260913-11d3cb
  experiment_id: EXP-ECDLP-080496
  specified_at: '2026-10-01'
  status: approved
  proposed_by: idea-generator
  approved_by_decision: DEC-20261001-ebbc28
  title: >-
    The Hesse cubic x^3 + y^3 + z^3 = 81 xyz over F_97 has 117 rational
    points, and the coordinate cycle has no fixed point on them.
  statement: >-
    Let C be x^3 + y^3 + z^3 = 3*27*xyz over F_97. It has 117 projective
    rational points. O = (1 : 96 : 0) lies on C. The map sigma(x : y : z) =
    (y : z : x) sends C to itself, satisfies sigma^3 = id, and fixes none of
    the 117 points. sigma(O) = (1 : 0 : 96).
  mechanism: >-
    The coordinate cycle is a degree-1 automorphism of the plane and
    preserves the symmetric Hesse equation. This contract checks the point
    set and that symmetry. It does not check that sigma is translation by
    a 3-torsion point.
  assumptions: []
  proof_search_map:
    bottleneck: Enumerating the projective points and applying sigma.
    baseline_embedding:
      parameter_slice: >-
        The cell C_27 over F_97 in IDEA-20260913-11d3cb, read 2026-10-01.
        A design-time count found 117 points and 0 fixed points. It is not
        a run.
      reproduction_check: >-
        One enumeration uses the chart z = 1 and then z = 0. The other uses
        x = 1 and then x = 0, and normalizes. The point sets must agree.
    observation_collision:
      observable: Point count, fixed-point count, and sigma(O).
      distinct_preimage_search: >-
        Two charts. A fixed point is a point equal to its image after
        normalizing the first nonzero coordinate to 1.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The coordinate cycle on C_27.
        predicted_gain: A symmetry check. No discrete logarithm.
    quantifier_order: >-
      For every rational point found by either chart, sigma of that point
      is again on C, and the fixed-point count is 0. The total is 117.
    method_ceiling:
      strongest_certifiable_claim: >-
        The point count and the fixed-point-free cycle on this one curve.
        Not a proof that no model makes a large multiplication linear.
      nearby_object_control: >-
        The identity map. It fixes every point. An implementation that
        reports the identity fixed-point-free is invalid.
    proof_obligations:
      - claim: There are 117 points.
        responsibility: size
      - claim: sigma preserves C, has order 3, and fixes none of them.
        responsibility: correctness
      - claim: The identity-map control is not reported as fixed-point-free.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions: []
