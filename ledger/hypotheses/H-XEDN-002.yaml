hypothesis:
  id: H-XEDN-002
  question_id: RQ-XEDN-001
  statement: >-
    On the frozen EXP-XEDN-001 / EXP-XEDN-002 surface family
    (y^2 = x^3 + b(t) over F_p with a(t) = 0 and deg b = 6 exactly), among the
    free-x integral sections of shape deg x <= 2 and deg y <= 3, the maximum
    absolute coefficient of a Z-basis vector of the Mordell-Weil relation lattice
    of the span of those sections is absolutely bounded independent of p
    (specifically O(1), and in practice in {-1,0,+1} on every tested surface),
    rather than growing with p. Boundedness is the literature obstruction that
    decides the function-field lifting relation-source route
    (KN-LIT-021 / ECFG-P1543 C_0/p); growth would reopen that route and force
    withdrawal of the scoped closure in DEC-20260724-008.
  mechanism: >-
    For squarefree b of degree 6 the surface is a rational elliptic surface with
    six type-II fibres and a smooth fibre at infinity, so sum_v (m_v - 1) = 0 and
    the Shioda-Tate formula gives geometric Mordell-Weil rank r = 8. Shioda's
    height pairing on integral sections reduces to <P,P> = 2*chi = 2 and
    <P,Q> = 1 - (P.Q) (chi = 1, (P.O) = 0, fibre contributions zero), so every
    free-x integral section of the frozen degree shape is a ROOT of the
    Mordell-Weil lattice, which is E_8 when all fibres are irreducible. Relations
    among E_8 roots have absolutely bounded coefficients. A specialised relation
    sum n_i P_i = O with |n_i| <= C then expresses only O(C^2) of the ~p possible
    discrete logs, giving success probability O(1/p) — the coefficient-bound
    obstruction — without needing Lang's height conjecture, because the height
    bound is geometric. Escaping it requires sections of height growing with p,
    which the frozen degree shape excludes by construction.
  assumptions:
    - >-
      The surface family, free-x section shape, and squarefree-b fibre type are
      those of EXP-XEDN-002; the iso-triviality (j = 0) of the family is accepted
      and recorded, not repaired.
    - >-
      Height pairing is the Shioda pairing on the Mordell-Weil lattice of the
      generic fibre; specialisation of a relation is via evaluation at a smooth
      fibre.
    - >-
      "Minimal relation" means a shortest nonzero vector of the integer kernel of
      the height Gram matrix of the observed free-x sections (or, equivalently,
      of the Z-module they generate), measured in the infinity norm of its
      coefficients in the observed section basis.
  predictions:
    - metric: >-
        max_|coeff|(p) = max over section-rich surfaces at that p of the
        infinity-norm of the shortest nonzero relation among the observed free-x
        sections
      direction: lower
      minimum_effect: >-
        max_|coeff|(p) stays in {1, 2, 3} across p in {7, 13, 19, 31}, with no
        trend vs log p that excludes slope 0. Boundedness SUPPORTS the hypothesis
        and closes the relation-source route by the coefficient-bound mechanism;
        growth that excludes a constant upper bound of 3 FALSIFIES it and forces
        withdrawal of DEC-20260724-008's scoped closure.
    - metric: Mordell-Weil span rank of the observed free-x sections
      direction: different
      minimum_effect: >-
        Rank is at most 8 (Shioda-Tate) and typically far below the distinct-slot
        count, confirming the distinct-vs-independent conflation recorded in
        EV-XEDN-001.
  test_boundary:
    instances:
      - p in {7, 13, 19, 31}
      - section-rich surfaces of the frozen family (prefer those with >= 4 free-x slots; include every surface with >= 9 free-x slots when any exist)
      - free-x sections with deg x <= 2, deg y <= 3, y != 0, under the frozen is_square_poly predicate
    parameters:
      surface_family: "y^2 = x^3 + b(t), deg b = 6 exactly, a(t) = 0"
      height_formula: "<P,P>=2, <P,Q>=1-(P.Q) for integral sections; verified by deg(num x(nS))=2 n^2 for n=1..12 on at least one surface per size"
      relation_extraction: "exact integer kernel of the height Gram matrix over Q, reduced to a Z-basis; report infinity-norm of the shortest nonzero vector"
    implementation: experiments/EXP-XEDN-003
    budget:
      wall_clock_seconds: 1800
      maximum_memory_gb: 4
      maximum_runs: 6
  falsification_conditions:
    - >-
      max_|coeff|(p) grows with p so that a linear fit of max_|coeff| vs log p
      has slope CI excluding 0, OR any surface at any tested p has a shortest
      relation with infinity-norm >= 4 that is not explained by a verified
      arithmetic bug: the relation-source route reopens and DEC-20260724-008's
      scoped closure must be withdrawn.
    - >-
      The height formula fails its deg(num x(nS))=2 n^2 control on a
      non-degenerate surface: the experiment is invalid, not a mathematical
      result.
  interpretation_limits:
    - >-
      Boundedness here closes the relation-source reading of THIS family under
      THIS section-degree window. It does not close lifting, xedni over number
      fields, non-iso-trivial families, or higher-degree sections.
    - >-
      Growth here reopens only the function-field relation-source question for
      this family; it is not an attack and not crypto-scale evidence.
    - >-
      The E_8 / root-system argument in the mechanism is a literature-backed
      interpretation that this experiment tests numerically; the experiment does
      not prove the lattice is E_8, and a red-team challenge to that
      identification is in scope.
  status: approved
  proposed_by: coordinator
