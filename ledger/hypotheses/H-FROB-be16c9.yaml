# H-FROB-be16c9 — specified from IDEA-20261006-83c197. Source bytes are
# blob 2ab555fdf1972ad118d0f5200b9b6936a617688a on
# origin/design/frob-bda728-descent. The file parsed as YAML. No quote
# was changed. Question RQ-FROB-7d8dd4, goal GOAL-FROB-6333a9. The
# prediction under test is the idea's own: the number of
# abelian-surface isogeny classes over F_2 whose rational point count
# is divisible by the smallest excluded prime differs from 0, and,
# when an explicit quotient is written, the total degree of one
# Weil-descended S_3 system on that quotient set exceeds the total
# degree of one S_3 system on a matched-cardinality subspace by at
# least 1. The concrete negative, once the dimension-1 degree
# instrument returns a number and the recomputed prime is 7, is a
# dimension-2 count of 0. A written quotient whose degree gap is at
# most 0 is a second negative. This record does not move the rho
# exponent 1/2. This session did not enumerate a Weil class and did
# not compute an S_3 degree. Approval is withheld because
# check_approval_capacity rejects an approval while GOAL-FROB-6333a9
# holds five approved contracts with no run, and because no S_3
# degree driver exists.
# =============================================================================
hypothesis:
  id: H-FROB-be16c9
  question_id: RQ-FROB-7d8dd4
  goal_id: GOAL-FROB-6333a9
  source_idea_ids:
    - IDEA-20261006-83c197
  added: '2026-10-07'
  status: specified
  proposed_by: coordinator
  title: >-
    Dimension-2 Weil class count and one S_3 degree at the smallest
    excluded prime over F_2
  statement: >-
    Let n be the smallest prime that fails both dimension-1
    conditions recorded in KN-OPEN-095df5 over F_2: n does not divide
    q + 1, and n lies outside the elliptic Hasse interval (0.17,
    5.83). That prime is predicted to be 7, and the contract
    recomputes it before any degree is scored. The number of
    abelian-surface isogeny classes over F_2 whose rational point
    count is divisible by that prime is different from the
    dimension-1 count at the same prime, which is 0 by the Hasse
    bound. When an explicit quotient by a rational cyclic subgroup
    of order n is written, the total degree of one Weil-descended
    S_3 system on the resulting Galois-invariant subset of F_{2^n}
    exceeds the total degree of one S_3 system on an F_2-subspace
    factor base of the same cardinality by at least 1. The concrete
    negative is a dimension-2 count of 0 after the dimension-1
    control returns a numeric S_3 degree and the recomputed prime is
    7. A written quotient whose degree gap is at most 0 is a second
    negative. If no explicit quotient is written, the degree clause
    is not a success. The curve y^2 = x^3 + x + 1 is not used. No
    ECDLP exponent improvement is claimed.
  mechanism: >-
    The representation is R3: a field element of F_{2^n} is named,
    when it lies in the subset, by a rational point of an auxiliary
    commutative algebraic group G over F_2. The operation set is
    translation on G by a fixed rational cyclic subgroup T of order
    n, the kernel of the quotient isogeny G to G/T. That is not
    translation on the prime-order subgroup of a target elliptic
    curve. The quotient map is constant on T-cosets. One affine
    coordinate of the image is the membership predicate. The charged
    observable is the total degree of one Weil-descended S_3 system
    on that set, compared with the same degree on a matched
    subspace. Relation collection, descent, and a discrete-log solve
    are not in this hypothesis.
  assumptions:
    - >-
      F3 enters only as the quotient isogeny of the auxiliary group.
      It is not an attack path on a target curve.
    - >-
      F2 enters only as one S_3 degree measurement. No relation
      matrix is built.
    - >-
      A missing explicit addition law is a failed success condition,
      not evidence that the degree is high.
    - >-
      This session did not enumerate a class and did not compute a
      degree. The thresholds "different from 0" and "gap at least 1"
      are the source idea's predictions.
  proof_search_map:
    bottleneck: >-
      Writing a Galois-invariant subset whose descended summation
      system has degree no higher than a subspace base of the same
      size, at a prime n where the written dimension-1 constructions
      are excluded. The 1/n symmetry gain of KR-IC-b0fcda is already
      the best orbit-folding factor recorded there and is not this
      bottleneck.
    baseline_embedding:
      parameter_slice: >-
        An F_2-subspace factor base of the same cardinality, as in
        KR-IC-73db3f, and the dimension-1 elliptic quotient at the
        largest prime that still lies in the q = 2 Hasse interval,
        which is 5.
      reproduction_check: >-
        Recompute the smallest excluded prime from the two conditions
        in KN-OPEN-095df5 before using n = 7. On the dimension-1
        control the instrument must return a numeric S_3 degree. If
        it cannot, the dimension-2 measurement is void.
    observation_collision:
      observable: >-
        The total degree of one Weil-descended S_3 system built from
        the invariant set. Two subsets with the same degree are not
        distinguished by this observable.
      distinct_preimage_search: >-
        Search the T-coset: n preimages in G of one image point. That
        search is part of a later run. It was not executed here.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The quotient G to G/T for an abelian surface over F_2 with
          a rational point of order n, with one affine coordinate
          used as a membership predicate on F_{2^n}.
        predicted_gain: >-
          A numeric degree, predicted to be strictly higher than the
          matched subspace system's degree. No exponent change is
          predicted.
    quantifier_order: >-
      There exists an abelian-surface isogeny class over F_2 whose
      rational point count is divisible by the smallest excluded
      prime n, and for every explicit model of a quotient by a
      rational subgroup of order n the descended S_3 degree is
      strictly greater than the degree of one S_3 system on a
      matched-cardinality subspace base. This is not a statement at
      n = 131.
    method_ceiling:
      strongest_certifiable_claim: >-
        A comparison of two toy degrees at n equal to the smallest
        excluded prime. The method cannot certify non-existence of a
        useful group at n = 131, and it cannot certify a descent
        exponent.
      nearby_object_control: >-
        The dimension-1 elliptic quotient at a prime inside the
        q = 2 Hasse interval, where the same degree instrument must
        return a number before the dimension-2 degree is scored.
    proof_obligations:
      - claim: >-
          The smallest excluded prime is recomputed from the two
          written conditions before n = 7 is used.
        responsibility: baseline
      - claim: >-
          The dimension-1 control returns a numeric S_3 degree, or
          the dimension-2 measurement is void.
        responsibility: correctness
      - claim: >-
          A degree gap of at least 1 at this toy prime does not
          change the rho exponent 1/2.
        responsibility: runtime
      - claim: >-
          A count of 0 falsifies the existence half. A missing model
          does not.
        responsibility: strictness
      - claim: >-
          The test prices one system at the toy prime and does not
          charge a relation collection. n = 131 is not decided.
        responsibility: scope
    not_applicable_reason: >-
      Boundary lift and telescoping potential are not the transform
      in use. The selected transform is representation_reduction.
  asymptotic_claim:
    problem: >-
      Index calculus on a subfield curve E(F_{2^n}) against
      Frobenius-class rho.
    prior_best: >-
      KR-RHO-037e22, exponent 1/2 with a sqrt(2m) constant on a
      Koblitz curve, and KR-IC-b0fcda, at most a factor 1/n on the
      number of systems. Both files were opened 2026-10-07.
    time_exponent: >-
      Unchanged at 1/2. A toy degree gap is not an exponent.
    memory_exponent: >-
      Unchanged. One S_3 basis at field size 2^n with n the smallest
      excluded prime is the memory of that one system.
    hidden_cofactor: >-
      No o(1) term is introduced. The degree, if high, is reported
      as an integer.
    claim_kind: constant_factor
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        For q = 2 and g = 2, the integer point counts inside the Weil
        interval that are divisible by the smallest excluded prime
        are decided by an exact Weil-polynomial census, not by a
        density estimate.
      random_model_justification: >-
        The Weil bound #A(F_q) <= (1 + sqrt(q))^{2g} is the size
        constraint. HEUR-1 replaces a uniform-integer picture of
        multiples inside that interval by the exact census. No
        smoothness law is assumed.
      supporting_results:
        - >-
          KN-OPEN-095df5, opened 2026-10-07. The Hasse interval at
          q = 2 is (0.17, 5.83). The file does not state the
          dimension-2 count at n = 7.
      validation_experiment_ids:
        - EXP-FROB-05cbda
      falsification_condition: >-
        The instrument does not decide every dimension-2 class
        exactly, or the unfiltered class count at g = 2 over F_2 is
        not 35. Then no divisibility count is inferred. The figure
        35 is the calibration stated in
        analysis/couveignes-lercier-131/weil_census.py, which was
        opened 2026-10-07 and was not re-run here.
    - id: HEUR-2
      formal_statement: >-
        When an explicit quotient exists, the total degree of one
        descended S_3 system is at least the kernel order n. This is
        a statement about the toy ladder only.
      random_model_justification: >-
        A separable quotient by a cyclic group of order n has
        isogeny degree n. HEUR-2 asks whether the descended
        summation degree tracks that isogeny degree. The isogeny
        degree is the kernel size. The summation degree is not
        thereby proved.
      supporting_results:
        - >-
          KN-OPEN-095df5, opened 2026-10-07, records the quotient
          construction as named by GGMP section 4.2. It does not
          state an S_3 degree at n = 7.
      validation_experiment_ids:
        - EXP-FROB-05cbda
      falsification_condition: >-
        An explicit model exists and the S_3 degree is strictly less
        than the kernel order n. Then HEUR-2 fails. If only one
        model exists, the ratio-of-degrees check against a second
        excluded prime is untested and is not used in the claim.
  structural_ingredients:
    - description: >-
        Both written dimension-1 Couveignes-Lercier constructions
        are excluded over F_2 when n does not divide q + 1 and n
        lies outside the Hasse interval (0.17, 5.83).
      citation: KN-OPEN-095df5
      provenance: internal
      verified_by: >-
        coordinator, 2026-10-07, opened
        knowledge/open-problems/KN-OPEN-095df5.md
      role: exclusion conditions that name the toy prime
    - description: >-
        Frobenius-invariant factor bases reduce the number of
        systems to solve by up to 1/n and speed linear algebra by
        n^2.
      citation: KR-IC-b0fcda
      provenance: internal
      verified_by: >-
        coordinator, 2026-10-07, opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-b0fcda.yaml
      role: symmetry factor this hypothesis does not improve
    - description: >-
        A subspace factor base V lowers degree after Weil descent.
        That subspace system is the degree baseline.
      citation: KR-IC-73db3f
      provenance: internal
      verified_by: >-
        coordinator, 2026-10-07, opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-73db3f.yaml
      role: matched subspace degree baseline
    - description: >-
        Weil descent to F_2 of S_3 on ordinary binary curves has
        first fall degree 2 because the trace of x is a group
        morphism onto F_2. First fall degree 2 is not the total
        degree priced here.
      citation: KR-IC-f5c584
      provenance: internal
      verified_by: >-
        coordinator, 2026-10-07, opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-f5c584.yaml
      role: a different integer from the total-degree gap
    - description: >-
        On a Koblitz curve, walking on classes of the group
        generated by Frobenius and negation reduces parallel rho by
        sqrt(2m). The exponent stays 1/2.
      citation: KR-RHO-037e22
      provenance: internal
      verified_by: >-
        coordinator, 2026-10-07, opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-037e22.yaml
      role: rho baseline, unchanged
  predictions:
    - metric: >-
        Number of abelian-surface isogeny classes over F_2 whose
        rational point count is divisible by the smallest excluded
        prime.
      direction: different
      minimum_effect: >-
        Different from the dimension-1 count at that same prime,
        which is 0 by the Hasse bound.
    - metric: >-
        Total degree of one descended S_3 system on the quotient
        set, minus the total degree of one S_3 system on a
        matched-cardinality subspace base, when an explicit quotient
        exists.
      direction: higher
      minimum_effect: ">= 1"
  test_boundary:
    instances:
      - >-
        Dimension-2 Weil polynomials over F_2, filtered by
        divisibility of the point count by the recomputed smallest
        excluded prime. One explicit model and one quotient
        coordinate if the count is positive. One S_3 system on that
        subset and one on a subspace of the same cardinality. The
        dimension-1 control is the elliptic quotient at prime 5.
    parameters:
      q: 2
      genus: 2
      predicted_excluded_prime: 7
      hasse_interval: "(0.17, 5.83)"
      dimension_1_control_prime: 5
      excluded_curve: y^2 = x^3 + x + 1
      unfiltered_class_count_g2: 35
    implementation: >-
      Not present in this session. The missing driver is a program
      that recomputes the smallest excluded prime, enumerates the
      dimension-2 classes over F_2, and, when a model is written,
      reports the two S_3 total degrees.
      analysis/couveignes-lercier-131/weil_census.py enumerates
      classes for the modulus 131 and does not emit an S_3 degree.
      It was opened and was not run. This session did not compute a
      class count or a degree.
    budget:
      enforcement: advisory
      maximum_memory_gb: 4
      maximum_runs: 1
  falsification_conditions:
    - >-
      The dimension-1 control returns a numeric S_3 degree, the
      recomputed smallest excluded prime is 7, and the dimension-2
      count is 0.
    - >-
      A class exists, an explicit quotient is written, and the
      descended S_3 degree is less than or equal to the matched
      subspace degree.
    - >-
      The recomputed smallest excluded prime is not 7. The parameter
      slice is then wrong.
    - >-
      A class exists but no explicit quotient is written. The degree
      clause is untested and is not support.
  interpretation_limits:
    - >-
      No ECDLP exponent improvement is claimed. The rho exponent
      stays 1/2 with the sqrt(2m) factor of KR-RHO-037e22.
    - >-
      A positive degree gap at n = 7 is not evidence about n = 131.
    - >-
      Non-existence at dimension 2 does not extend the dimension-4
      census of KN-OPEN-095df5.
    - >-
      A low degree would still not be an algorithm. The proposal
      stops after one system.
  rerandomization: null
  status_note: >-
    specified, not approved. EXP-FROB-05cbda stays review_required.
    check_approval_capacity would reject an approval: GOAL-FROB-6333a9
    holds five approved contracts with no run, against cap 3. The
    S_3 degree driver is also missing.
