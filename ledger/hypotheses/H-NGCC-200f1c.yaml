hypothesis:
  id: H-NGCC-200f1c
  question_id: RQ-NGCC-f52138
  idea_id: IDEA-20261002-63bdb2
  statement: >-
    On the official NGCC round-1 Neulaser submission (hash-21), for every
    instance named by the published hash-21-2 witness, that witness is a
    pair of distinct messages with equal full-round digests under a
    separately compiled official hasher.
  mechanism: >-
    The mechanism under test is the published state-merger witness, not a
    search for a new collision. The executor reads the message pair and the
    claimed instances from finding hash-21-2 before hashing. Equality is
    decided by a second compilation of the submission hash. This hypothesis
    does not restate the merger construction. Finding hash-21-1 is not
    part of the statement.
  assumptions:
    - The official package implements full-round Neulaser for each instance the witness names.
    - Finding hash-21-2 supplies a message pair and names the instances it claims. If it does not, the run is invalid rather than a falsification.
  proof_search_map:
    not_applicable_reason: >-
      This hypothesis is an empirical check of a published colliding pair.
      It asserts no theorem, asymptotic bound, or reduction.
    bottleneck: null
    baseline_embedding:
      parameter_slice: null
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms: []
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations: []
  predictions:
    - metric: distinct_messages_with_equal_full_round_digests
      direction: higher
      minimum_effect: >-
        At least one published pair for each instance the witness names,
        messages unequal, full-round digests equal under the separate hasher.
  test_boundary:
    instances:
      - hash-21 Neulaser, official round-1 zip named in inputs/ngcc-round1-20260920/candidates.yaml
    parameters:
      instances: those named by finding hash-21-2, recorded before hashing
      rounds: full
    implementation: >-
      Reference C compiled by this program from submission sources.
      Nothing shipped as a binary, object file, or submission build script
      is executed.
    budget:
      enforcement: advisory
      wall_clock_seconds_per_run: null
      maximum_memory_gb: 4
  falsification_conditions:
    - >-
      For some instance the witness names, the published pair is hashed to
      completion and the two full-round digests differ.
  interpretation_limits:
    - A success is scoped to the tested package and the instances the witness names. It does not transfer to a later revision or to unnamed instances.
    - A failure refutes the published pair on that instance. It does not by itself prove that no collision exists.
    - Finding hash-21-1 and ePrint 2026/2152 are not tested here.
  status: specified
  proposed_by: coordinator
