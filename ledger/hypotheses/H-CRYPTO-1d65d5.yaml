hypothesis:
  id: H-CRYPTO-1d65d5
  question_id: RQ-CRYPTO-001
  status: specified
  proposed_by: coordinator
  derived_from_idea: IDEA-20260807-fa706a
  supersedes_hypothesis: H-CRYPTO-7dd003
  experiment_id: EXP-CRYPTO-3759c6
  approval_decision_id: DEC-20260907-b8bd3e
  statement: >-
    A complete known-reference audit of the pinned proposal/literature corpus
    can measure recorded-query recovery, its separation from a uniform-entry
    baseline, and the signed effect of an offline sparse ranking remedy on
    an identical title/abstract top-20 comparison. The prospective remedy
    prediction is positive sparse-minus-Boolean hit-rate difference on the
    admitted common pair set. It can fail without invalidating sound raw
    recall measurements or establishing a verdict about unknown literature.
  mechanism: >-
    Enumerate all direct source-reference candidate pairs, hide those references
    from query reconstruction, and label relevance through two independent
    information-need judgments plus blinded adjudication. Freeze recorded
    predicates, corpus views and incumbent sparse parameters, then join
    deterministic returned sets to labels only after mechanical controls and
    seed-specific random-entry reports are written. Matched view, cutoff and
    pair denominators separate ranking effects from field/return-budget effects.
  assumptions:
    - Source-linked author-known pairs are a selected finite benchmark, not all relevant literature and not a mathematical upper bound on unknown recall.
    - Corpus-record relevance can be judged with excerpt-supported uncertainty without claiming external paper truth, full source reading or novelty validity.
    - Exact replay and explicitly reconstructed summary-term replay are different fidelity strata; unsupported queries are not misses.
    - The existing sparse implementation/config is a frozen offline comparator; its historical curated-question report is not a result on these proposal/reference pairs.
    - At least 50 judged relevant candidate pairs is a study-level adequacy threshold, not 50 independent queries or a stronger threshold on the narrow matched subset.
    - Three null seeds and proposal-cluster resampling are finite sensitivity devices, not independent repeated retrieval experiments or calibrated population inference.
  predictions:
    - metric: Signed paired sparse20-minus-Boolean20 known-reference micro hit-rate delta
      direction: higher
      minimum_effect: Strictly positive exact fraction on the common exact/uncontaminated/representable pair set; zero or negative is a finite negative outcome, empty set is NA.
    - metric: Known-reference recovery compared with weighted random-entry hits
      direction: higher
      minimum_effect: R>=3*q AND R-q>=0.20, separately for each of three seeds and the exact set-size expectation. Failure is descriptive separation failure, not proof of chance.
    - metric: Full-document all-match known-reference hit rate
      direction: different
      minimum_effect: Report the original motivating split R<0.5 versus R>=0.5 without making either branch required success or a global bound.
  test_boundary:
    instances:
      - All committed knowledge/literature/KN-LIT-*.md records at the pinned source commit
      - All committed ledger/proposals/IDEA-*.yaml records and their direct source-reference candidate pairs at that commit
      - Separate fixed 27-document mechanical control corpus
    parameters:
      source_commit: 5401431c1576bf0e75fac70df1cc54f409ed7c85
      minimum_relevant_candidate_pairs: 50
      return_cutoff: 20
      null_seeds: [20260904, 20260905, 20260906]
      null_draws_per_proposal_per_seed: 20
      sampling_with_replacement: true
      retrieval_arms: 4
      seed_invocations: 3
      control_obligations_per_invocation: 6
      shared_cluster_resamples: 2000
      actual_corpus_pair_proposal_counts: Future admission outputs of frozen exhaustive procedures; no census was performed in this design.
    implementation: EXP-CRYPTO-3759c6 fixes corpus routes/views, label/query access, compiler semantics, sparse model, deterministic sampling, metrics, exclusions, artifacts and independent-check gates.
    budget:
      maximum_runs: 3
      maximum_workers: 2
      maximum_memory_gb: 8
      wall_clock_seconds: null
      total_cpu_hours: null
      interpretation: One scientific invocation at a time, one runner plus at most one rg child; preparation handoff permits zero scientific runs.
  falsification_criterion: >-
    With complete bindings and passing mechanical/integrity controls, a
    nonpositive signed matched delta fails the finite remedy prediction;
    failure of either null-margin inequality fails that descriptive target.
    Missing data/query semantics, empty matched set or failed evaluator
    controls produce their separately declared NA/inconclusive/invalid outcomes.
    No such outcome proves a global novelty, acquisition or security claim.
  falsification_conditions:
    - Valid common-pair sparse minus Boolean delta is zero or negative.
    - Valid recovery does not meet the fixed factor-three and absolute-0.20 null separation.
    - A mechanical witness, deterministic output comparison or independently reconstructed set-membership/count identity contradicts the evaluator, invalidating the instrument rather than the retrieval hypothesis.
  proof_search_map:
    bottleneck: Recover a reproducible finite information-need/reference denominator and separate ranking, field, cutoff and label-selection effects without turning selection into an unsupported recall bound.
    baseline_embedding:
      parameter_slice: Exact recorded Boolean predicate on full corpus bodies, plus matched title/abstract Boolean top-20 and the pinned incumbent sparse model on the same view.
      reproduction_check: Finite mechanically known hit/miss/AND/OR/case/tie/empty witnesses precede corpus scoring; incumbent reuse requires exact source/config binding and reports the older benchmark's different label scope.
    observation_collision:
      observable: A single aggregate recall number or apparent remedy hit union
      distinct_preimage_search: Hold the common pair set/view/K fixed while varying Boolean versus sparse ordering; expose title-only and query-fidelity strata, unequal return-set sizes, duplicate null draws, selected known labels and per-proposal failures. Identical aggregate rates can hide opposite cluster effects.
    constructive_transforms:
      - transform: specialization_pack
        description: Fix one full-corpus information-need/reference benchmark and a safe recorded-query compiler before retrieval.
        proposed_object: Hash-bound census, label/query manifests and exact finite returned-set metrics
        predicted_gain: Reproducible retrieval diagnosis; no cryptanalytic speedup.
      - transform: observable_fiber
        description: Separate full-body/all-match effects from identical-view/top-20 ranking effects.
        proposed_object: Signed paired difference and per-proposal four-way hit table, with no union remedy
        predicted_gain: Permit both positive and negative remedy outcomes without hiding a return-budget confounder.
    quantifier_order: Freeze commit, complete candidate extraction, rubric, query grammar/views, K, sparse parameters, three null seeds and bootstrap rule before labels are joined to retrieval outputs. Independent labeling and extraction precede scoring; no query/rank tuning from results.
    method_ceiling:
      strongest_certifiable_claim: Known-reference finite corpus recovery and a paired offline remedy effect for the declared labels, queries and strata.
      nearby_object_control: A return-all predicate has perfect known-reference recall but exact random-entry hit probability one and fails the null margins; a union-only remedy cannot expose negative delta. Missing abstracts, semantic off-topic word matches and empty zero-score queries expose unsupported control expectations.
    proof_obligations:
      - claim: Candidate/route/view extraction and evaluator set-membership identities match the exact corpus and declared labels.
        responsibility: correctness
        owner: Future independent checker and source/corpus admission reviewers
      - claim: Safe compiler preserves supported argv semantics and rejects unsupported shell/flag/regex operations.
        responsibility: interface
        owner: Future independently reviewed query implementation
      - claim: Controls/null reporting precede positive joins, and independent label/blind-review access is real.
        responsibility: scope
        owner: Future independent label sessions and preregistered review owner
      - claim: All extraction, labeling, index construction, query, checking and serialization work is charged.
        responsibility: runtime
        owner: Future executor and cost reviewer
      - claim: Aggregate 8 GiB resource enforcement and complete artifact byte accounting.
        responsibility: memory
        owner: Future runtime admission and integrity checker
    not_applicable_reason: Cryptographic parameter/exponent and attack-success proof obligations do not apply to this retrieval measurement; measurement correctness obligations remain required.
  formalization:
    smallest_obligation: For a finite corpus D, returned set S and uniform entry X, prove Pr[X in S]=|S|/|D| when D is nonempty; for shared pair indicators prove signed delta=(n_01-n_10)/N under an explicitly declared four-way orientation.
    missing_binding: This experiment has no formally bound corpus/query/label representation, weighted micro-count evaluator or sparse-result refinement in this design. A finite-set identity alone does not validate labels, compiler fidelity or external-paper relevance.
    revisit: Freeze implementation representations and an independent count oracle, then define exact Lean statements and dependency bindings before any formal-verification claim. No broad library-absence claim.
  heuristic_assumptions: []
  asymptotic_claim: null
  novelty_status: unverified
  dominated_by: The current offline sparse components and historical curated-question evaluation are inspected comparators with different corpus/question/label scope. No full attack time-memory-data frontier comparison is applicable to this tooling result; no unchecked null or absence-of-index claim.
  sota_delta: No cryptographic attack improvement is claimed or measured. Retrieval improvement remains an unmeasured signed paired delta under the frozen contract.
