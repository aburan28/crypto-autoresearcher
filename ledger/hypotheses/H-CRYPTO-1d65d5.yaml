    - reference: https://nlp.stanford.edu/IR-book/html/htmledition/assessing-relevance-1.html
      provenance: retrieved
      verified_by: parent_control_plane/01a07d9c-ceb4-7892-ae01-260e4b5f0374
      scope: Parent read relevance-to-need and assessor variation; this design specifies its own prospective rubric and independent labels.
    - reference: https://nlp.stanford.edu/IR-book/html/htmledition/okapi-bm25-a-non-binary-model-1.html
