hypothesis:
  id: H-HAWK-a28be6
  question_id: RQ-HAWK-001
  goal_id: GOAL-HAWK-001
  source_idea: IDEA-20260805-128f35

  statement: >-
    SCOPE: cyclotomic conductors m <= 2000 for the census half; conductors
    m in {8, 16, 32, 64} (2-power arm) and m in {12, 20, 28, 36, 44} (nearby
    non-2-power arm) for the lattice half, i.e. ring degrees n <= 32; exact
    integer arithmetic; pure Python; ONE instrument lineage, INHERITED from
    EXP-HAWK-a2f34a. CLAIM TIER toy. NO ATTACK, NO EXPONENT, NO STATEMENT ABOUT
    HAWK'S SECURITY OR ABOUT ANY ROUND-3 PARAMETER DECISION.

    THE CLAIM, IN THREE PARTS, THE FIRST TWO ZERO-COMPUTE AND EXACT.
    (P1) COUNT. For K = Q(zeta_m) the number of elements of order dividing 2 in
    Gal(K/Q) = (Z/m)^x is exactly 2^{r + delta}, where r is the number of
    distinct odd primes dividing m and delta is 0, 1, 2 according as v_2(m) is
    <= 1, = 2, >= 3. Hence the number of INVOLUTIONS is 2^{r+delta} - 1, and a
    conductor has a UNIQUE involution -- so admits no second order-2 lens at all
    -- exactly when m is in {4} union {p^k} union {2 p^k} for odd primes p.
    FOR HAWK'S OWN FIELDS m = 2^ell with ell >= 3 THE COUNT IS EXACTLY THREE:
    c = sigma_{m-1}, tau = sigma_{m/2+1}, and c*tau = sigma_{m/2-1}.
    (P2) SEPARATION. The disclosed attack's lens tau : zeta -> -zeta equals
    sigma_{1+m/2} and is an order-2 automorphism distinct from c exactly when
    4 | m and m > 4. THE SET {m : 4 | m} IS A PROPER SUBSET OF
    {m : at least two involutions}: the difference is the odd composites and
    their doubles (15, 21, 30, 33, 35, 45, ...), which possess a second
    involution but not tau. The reported evasion criterion and the construction
    requirement are therefore DIFFERENT CONDITIONS, and the corpus records only
    the first, relayed, without derivation.
    (P3) NECESSARY IS NOT SUFFICIENT, AND THE SPLIT IS DERIVABLE. For ANY
    involution sigma with sigma not in {1, c}, so that <c, sigma> is Klein four
    and F = K^{<c,sigma>} has degree n/4, the cocycle V_sigma = B^{-1} sigma(B)
    of B in SL_2(R) satisfies sigma(V_sigma) = V_sigma^{-1} and det V_sigma = 1,
    whence the adj-pattern conditions and the linearised public condition hold
    verbatim as in H-HAWK-c7a551, and
      Q^(sigma)(V_sigma) = Tr_{F/Q}(1) = n/4,
    so lambda_1^2 <= n/4 GENERICALLY. What does NOT follow generically is the
    ORTHOGONAL SPLITTING of Proposition 4.5, which is what gives Ducas's block
    reduction a dimension-(n/2+1) foothold. The hypothesis predicts that the
    generic half survives at every conductor with a second involution and
    4 | n, while the splitting FAILS at m = 4p -- and it predicts, WITH NO
    PREFERRED DIRECTION AND A DECISION RULE FROZEN IN ADVANCE, that the third
    2-power lens c*tau either yields a genuinely distinct lattice or is a change
    of coordinates on the tau lattice, in which case the honest deliverable is a
    recorded null and the statement that the symmetry budget of a 2-power
    cyclotomic field is spent.

  mechanism: >-
    DERIVED IN-REPO. The only external input is one relayed sentence in
    KN-LIT-7592: "Conductors m in {p^k, 2p^k} for odd prime p -- i.e. the m > 4
    with cyclic (Z/m)^x -- evade it, because they have no second involution to
    use; the authors expect many other composite conductors do not evade it."
    The paper's appendix on conductor scope was NOT READ. Everything below is a
    re-derivation, and the relayed sentence is the thing being checked.

    STEP 1 -- THE 2-TORSION COUNT. By CRT,
    (Z/m)^x = (Z/2^e)^x x prod_{i=1..r} (Z/p_i^{e_i})^x for
    m = 2^e p_1^{e_1} ... p_r^{e_r}. Each odd factor is cyclic of even order
    p_i^{e_i-1}(p_i - 1) and so contributes exactly one element of order 2. The
    2-part is trivial for e <= 1, is C_2 for e = 2, and is
    C_2 x C_{2^{e-2}} for e >= 3, contributing 2^delta elements of order
    dividing 2 with delta = 0, 1, 2 respectively. The 2-torsion of a direct
    product is the product of the 2-torsions, so
      #{t in (Z/m)^x : t^2 = 1} = 2^{r + delta}.
    Unique involution <=> 2^{r+delta} = 2 <=> r + delta = 1 <=> (r,delta) is
    (1,0) or (0,1) <=> m in {p^k, 2p^k} or m = 4. THIS RE-DERIVES THE RELAYED
    EVASION SET EXACTLY, which is the first non-trivial corroboration available
    and it costs nothing. SPOT-CHECKED IN THIS SESSION by direct enumeration at
    m in {3,4,5,6,8,9,10,12,15,16,20,21,24,25,28,32,36,40,64,1024}; every value
    matched. That is a spot check performed while drafting, NOT a run: the
    census over m <= 2000 is Stage 1 of EXP-HAWK-c8231a and has not been
    executed.

    STEP 2 -- WHICH ELEMENT tau IS. -zeta_m = zeta_2 zeta_m = zeta_m^{1+m/2}, so
    tau = sigma_{1+m/2}. Unit condition: if an odd prime p divides m then
    p | m/2, so 1 + m/2 == 1 mod p; and 1 + m/2 is odd exactly when 4 | m; hence
    gcd(1 + m/2, m) = 1 iff 4 | m. Order: (1 + m/2)^2 = 1 + m + m^2/4 ==
    1 + m^2/4 mod m, which is 1 iff 4 | m. Distinctness from c = sigma_{-1}:
    1 + m/2 == -1 mod m iff m divides m/2 + 2, which for m > 4 is impossible
    since 0 < m/2 + 2 < m. Therefore tau exists as an order-2 automorphism
    distinct from c IFF 4 | m AND m > 4. The gap set of (P2) follows
    immediately: {m : >= 2 involutions} minus {m : 4 | m} = {m : delta = 0,
    r >= 2} = odd composites and their doubles.

    STEP 3 -- THE GENERIC HALF. Verbatim as in H-HAWK-c7a551 steps 1-3 with tau
    replaced by an arbitrary second involution sigma: sigma(V) = V^{-1},
    det V = 1, hence sigma(a) = d, sigma(d) = a, sigma(b) = -b, sigma(c) = -c;
    and sigma(Q) = V* Q V linearises to Q V = ((c sigma)(V))^T sigma(Q) using
    (V*)^{-1} = ((c sigma)(V))^T. The length form is Tr_{F/Q}(det Y) with
    F = K^{<c,sigma>} of degree n/4 whenever <c,sigma> is Klein four, giving
    Q^(sigma)(V_sigma) = n/4. NONE OF THIS USES 4 | m OR m = 2^ell. It is the
    portion of the argument that transfers, and isolating it is what lets the
    hypothesis say precisely what a second involution does and does not buy.

    STEP 4 -- THE THIRD LENS, AND THE RELATION THAT MAKES IT NON-TRIVIAL. For
    m = 2^ell, <c, tau> = <c, c*tau>, so c*tau's Klein-four group and hence its
    fixed field F are IDENTICAL to tau's, and the length form is the same. But
    the degree-n/2 fixed field of c*tau is neither K^c (totally real, used by
    all prior module-LIP work) nor K^tau (the smaller cyclotomic field, used by
    the disclosed attack). The three cocycles satisfy
      V_{c tau} = B^{-1}(c tau)(B) = B^{-1} c(B) . c(B)^{-1} c(tau(B))
                = V_c . c(V_tau),
    where V_c = B^{-1} c(B) is the conjugation cocycle. So the three lattices
    are TIED BY A COCYCLE IDENTITY rather than being independent, and knowledge
    of a shortest vector of any one constrains the others. WHETHER THAT COUPLING
    CAN CUT THE SVP DIMENSION BELOW n/2 + 1 IS THE EXPONENT-RELEVANT QUESTION
    AND IT IS NOT ATTEMPTED HERE -- it is named as forward guidance, and
    attempting it before knowing whether the two lattices are even distinct
    would be the premature step.

    STEP 5 -- THE EXHAUSTION STATEMENT, AT THE CLOSURE STANDARD OF
    docs/inventor-protocol.md SECTION 4. NAMED OBSTRUCTION:
    Gal(Q(zeta_{2^ell})/Q) = C_2 x C_{2^{ell-2}} has exactly three elements of
    order 2. ARGUMENT: step 1 with r = 0, delta = 2. FORWARD GUIDANCE, naming
    what remains open rather than declaring anything impossible --
    (i) the c*tau lattice, unexamined anywhere in this corpus;
    (ii) NON-INVOLUTIVE lenses: an element sigma of order 4 gives a cocycle
    obeying the length-4 relation V . sigma(V) . sigma^2(V) . sigma^3(V) = I,
    which is NOT an adj-pattern and is a genuinely different construction never
    attempted in this corpus;
    (iii) non-Galois symmetries of the module, i.e. the unit group of R acting
    on R^2, which this census does not touch at all;
    (iv) the gap-set conductors of (P2), where a second involution exists but
    tau does not.
    THIS IS A CLOSURE OF THE ORDER-2 GALOIS LENS CLASS ONLY. It is not a claim
    that HAWK's fields have no other exploitable structure, and item (ii) in
    particular is a live and cheap successor.

  assumptions:
    - >-
      FROZEN DEFINITIONS, fixed before any evaluation. (1) An involution is an
      element of (Z/m)^x of order exactly 2. (2) c = sigma_{-1}; tau =
      sigma_{1+m/2} when 4 | m; c*tau = sigma_{m/2-1}. (3) The census set is
      every integer m with 3 <= m <= 2000 and m not congruent to 2 mod 4
      excluded -- i.e. ALL m in that range, with the convention
      Q(zeta_m) = Q(zeta_{2m}) for odd m recorded but NOT used to deduplicate,
      so the raw count is reported and the deduplicated one separately.
      (4) The lattice arms reuse EXP-HAWK-a2f34a's frozen instrument definition
      unchanged, with only the involution and the conductor varied.
      (5) The C5 equivalence rule is: two lattices are declared EQUIVALENT iff
      rank, Gram determinant, and theta coefficients at n/4, n/2 and 3n/4 all
      agree; DISTINCT otherwise. No other statistic may be added after any value
      is observed.
      NO OTHER DEGREE OF FREEDOM EXISTS. Any change after observation requires a
      versioned protocol_amendment with confirmatory_status exploratory_only.
    - >-
      THE C5 RULE IS AN EQUIVALENCE HEURISTIC, NOT A DECISION PROCEDURE. Matching
      invariants do NOT prove GL_n(Z)-equivalence; they only fail to distinguish.
      So a "declared EQUIVALENT" verdict is stated as "not distinguished by five
      invariants at n = 8 and 16", never as "proved isometric". This is written
      in before the run so that the weaker reading cannot be strengthened after.
    - >-
      HARD DEPENDENCY, DECLARED NOT HIDDEN. The lattice arms cannot run unless
      EXP-HAWK-a2f34a's positive control PC-1 passes at m = 2^ell. If it does
      not, the instrument is measuring an unknown object and a failure at m = 4p
      would be indistinguishable from an instrument fault. Only the census half
      (Stage 1) is independent of that dependency.
    - >-
      SMALL-n DEGENERACY. At n = 4 (m = 8 or m = 12), F = Q and several
      quantities collapse to 1; those cells are retained as controls but may not
      be extrapolated, and the contract says so per cell rather than globally.
    - >-
      ENVIRONMENT, MEASURED THIS SESSION: numpy 2.4.6 present; sympy, sage,
      fpylll absent; no PARI/GP on PATH. Stage 1 needs none of them. Stages 2-3
      inherit EXP-HAWK-a2f34a's pure-Python instrument.

  proof_search_map:
    bottleneck: >-
      The step at which the disclosed attack's applicability is decided by the
      arithmetic of the conductor rather than by anything about the key. Every
      statement of the form "conductor family X evades / does not evade" rests
      on it, and HAWK's own Round-3 tweak decision (deadline recorded as
      2026-08-14 in KN-OPEN-028) is a decision in exactly that space. It is also
      the cheapest bottleneck in this goal: it is elementary group theory and
      needs no gated source, no solver and no key.
    baseline_embedding:
      parameter_slice: >-
        m = 8 (n = 4) and m = 16 (n = 8). At these the involution set is
        {7, 5, 3} and {15, 9, 7} respectively, which are c, tau, c*tau in the
        notation of step 2 -- small enough to enumerate by hand and to verify
        each squares to 1, is a unit, and that no fourth exists.
      reproduction_check: >-
        SYMBOLIC AND EXHAUSTIVE, not a resemblance: the closed form
        2^{r+delta} - 1 is checked against a complete enumeration of
        {t in (Z/m)^x : t^2 = 1} at every m <= 2000, so the "reproduction" is an
        equality of two integers at 2000 points, not a fit. Twenty of those
        points were spot-checked while drafting and all matched; THE FULL SWEEP
        HAS NOT BEEN RUN and this record makes no claim that it has.
    observation_collision:
      observable: >-
        Two, deliberately kept apart. OBS-A: the involution count of a
        conductor. OBS-B: the invariant quintuple (rank, determinant, theta at
        n/4, n/2, 3n/4) of a cocycle lattice.
      distinct_preimage_search: >-
        FOR OBS-A A COLLISION IS CERTAIN AND MUST BE STATED, because it is the
        precise limit of what the census can conclude: every conductor with
        r + delta = 2 has the same count 3, whether it is 2^ell (where the
        attack is reported to work) or 4p (where the splitting is expected to
        fail) or an odd composite (where tau does not even exist). SO THE COUNT
        DOES NOT DETERMINE APPLICABILITY, and any record that reads a census row
        as an applicability verdict has made exactly the error this entry exists
        to forestall. The separating condition is OBS-B, which is why the
        contract measures it at the collision-mates m = 12, 20, 28, 36, 44.
        FOR OBS-B the search is C5 itself: are Lambda^(tau) and Lambda^(c tau)
        distinct ground-truth objects with the same observable? The pre-frozen
        rule handles both answers and neither is treated as the hoped-for one.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (the involution count, = 3) fixed and vary the
          forgotten structure (the conductor's factorisation: 2^ell versus 4p
          versus odd composite). The intrinsic invariant proposed to distinguish
          the resulting objects is the theta series of the cocycle lattice.
        predicted_gain: >-
          Converts "these conductors are all in the same census row" into a
          measured statement about which of them retain the near-hypercubic
          structure. If the theta series does NOT distinguish them, the census
          row is the whole story and the 2-power specificity claimed for
          Proposition 4.5 is broader than reported -- the surprise outcome, and
          the more interesting one.
      - transform: baseline_as_boundary_lift
        proposed_object: >-
          Enlarge the lens family from {c} (all prior work) to {c, tau} (the
          disclosed attack) to the full 2-torsion {c, tau, c*tau}, and prove a
          strict inward improvement or record its absence. The boundary is the
          exhaustion statement of step 5: the family cannot be enlarged further
          within order-2 Galois lenses.
        predicted_gain: >-
          Either a third usable lens, or a closure at the section-4 standard
          with the order-4 successor named. Both are deliverables; neither is an
          attack.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER: THERE EXISTS one closed form, 2^{r+delta} - 1,
      with delta determined by v_2(m) alone, such that FOR ALL m in the census
      range the enumerated involution count equals it. The witness (the formula)
      may NOT depend on m, on r, or on which primes divide m beyond their count.
      The weaker order -- FOR ALL m THERE EXISTS a count -- is vacuous and is
      explicitly NOT claimed.
      SECOND, AND THIS IS THE QUANTIFIER TRAP THE HYPOTHESIS IS HUNTING IN THE
      RELAYED SENTENCE: "conductors m in {p^k, 2p^k} evade it" is a FOR ALL over
      a family, whereas "the authors expect many other composite conductors do
      not evade it" is an EXISTS-flavoured expectation with no witness supplied.
      The two are not complementary and the corpus has been reading them as if
      they were. The census makes the first exact; the lattice arms probe the
      second at five named witnesses and refuse to generalise from them.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: an exact involution census over m <= 2000; an exhaustion
        statement for order-2 Galois lenses over 2-power cyclotomic fields; and,
        at n <= 32 on one instrument lineage, a measured comparison of the tau
        and c*tau lattices and of the four forced values at five non-2-power
        conductors. It CANNOT certify that any conductor is or is not
        attackable, cannot price any SVP instance, cannot support a parameter
        recommendation, and cannot close the order-4 lens class.
      nearby_object_control: >-
        THE ENTIRE m = 4p ARM IS THE NEARBY-OBJECT CONTROL, and it is chosen for
        the reason inventor-protocol section 8 audit 4 gives: m = 12, 20, 28,
        36, 44 are the closest conductors to 2-powers that still admit tau
        (4 | m) and at which the hoped-for conclusion -- the exact orthogonal
        splitting -- is expected to FAIL. A method that cannot tell these apart
        from 2^ell has not identified the load-bearing structure and its
        "2-power specificity" claim is unsupported. A SECOND nearby object, in
        the other direction: m = 4 itself, where tau = c and the second lens
        does not exist at all; the instrument must report the degenerate case
        rather than silently producing a number.
    proof_obligations:
      - claim: 2^{r+delta} matches exhaustive enumeration at every m <= 2000.
        responsibility: correctness
      - claim: >-
          The unique-involution set equals {4} union {p^k} union {2p^k} on the
          census range, with no exceptions.
        responsibility: baseline
      - claim: >-
          The gap set {>= 2 involutions, 4 does not divide m} is non-empty and
          consists of odd composites and their doubles.
        responsibility: completeness
      - claim: >-
          lambda_1^2 = n/4 is attained (not merely bounded) at every tested
          (m, involution) pair with 4 | n.
        responsibility: correctness
      - claim: >-
          The C5 verdict is reported as "not distinguished by five invariants",
          never as "proved isometric".
        responsibility: strictness
      - claim: >-
          A census row is never presented as an applicability verdict, and no
          Round-3 parameter recommendation is issued.
        responsibility: scope
      - claim: >-
          The exhaustion statement is scoped to order-2 Galois lenses and names
          three open successor classes.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. NO COMPLEXITY CLAIM IS ADVANCED. The census is a
    decidability map for a construction's precondition; the lattice arms measure
    invariants without pricing any solver. The one route by which this line
    could touch an exponent -- intersecting the coupled cocycle lattices of
    step 4 to obtain an SVP instance below dimension n/2 + 1 -- is NAMED AS
    SPECULATIVE AND NOT PROPOSED FOR EXECUTION, and it is not attempted before
    C5 answers whether the two lattices are distinct at all. sota_delta is zero
    on every attack axis; dominated_by is not applicable because no Pareto point
    is offered.

  heuristic_assumptions:
    - id: HEUR-CENSUS-1
      formal_statement: >-
        Every lens usable by the cocycle construction is an INVOLUTION of
        Gal(K/Q), so the count 2^{r+delta} - 1 is complete for the construction.
      random_model_justification: >-
        None applies; it is a structural claim, not a distributional one. It is
        SUPPORTED for the construction as derived -- the adj-pattern comes from
        sigma^2 = 1 -- and is NOT SUPPORTED as a claim that no non-involutive
        construction could work. That gap is the reason step 5(ii) exists, and
        it BOUNDS the exhaustion statement rather than undermining it. This is
        the weakest link in the closure half of the record.
      supporting_results: []
      validation_experiment_ids: [EXP-HAWK-c8231a]
      falsification_condition: >-
        Not experimentally falsifiable; it is a scope statement. It is
        discharged by writing the bound into the exhaustion claim's wording,
        which interpretation_limits does, and by naming the order-4 successor
        concretely enough that a later session can attempt it.
    - id: HEUR-CENSUS-2
      formal_statement: >-
        The generic half of step 3 -- adj-pattern, linearised public condition,
        and lambda_1^2 <= n/4 -- holds for every second involution at every
        conductor with 4 | phi(m), independently of the conductor's
        factorisation.
      random_model_justification: >-
        Derived rather than assumed: each ingredient uses only sigma^2 = 1,
        det B = 1, and the commutativity of the Galois group, none of which
        refers to m's factorisation. What is NOT derived is that the resulting
        Z-kernel has rank exactly n away from 2-powers; the rank is predicted to
        survive because its derivation is generic, but that prediction is a
        measurement target and not a theorem here.
      supporting_results: []
      validation_experiment_ids: [EXP-HAWK-c8231a]
      falsification_condition: >-
        C7: if lambda_1^2 is not exactly n/4 at any tested (m, involution) pair
        with 4 | n, or if the rank is not n at m = 12 or 20, HEUR-CENSUS-2 is
        refuted and the "generic half" framing must be withdrawn before any
        conductor statement is made.
    - id: HEUR-CENSUS-3
      formal_statement: >-
        The orthogonal splitting of Proposition 4.5 is specific to 2-power
        conductors and FAILS at m = 4p.
      random_model_justification: >-
        THIS IS THE HYPOTHESIS'S ONE GENUINE GUESS AND IT IS LABELLED ONE. The
        reasons to expect it: the source is reported to prove the splitting
        using the 2-power structure, and ramification at the odd prime p changes
        the trace form on F. The reasons it might be wrong: neither the proof
        nor the appendix was read, and the source itself says "the authors expect
        many other composite conductors do not evade it", which points the other
        way. Prior stated in IDEA-20260805-128f35: 0.15 that all four forced
        values survive at m = 4p.
      supporting_results: []
      validation_experiment_ids: [EXP-HAWK-c8231a]
      falsification_condition: >-
        C6: if all four forced values hold at m = 12 AND m = 20, HEUR-CENSUS-3
        is refuted, the near-hypercubic structure is not 2-power-specific, and
        the batch reports that as its headline -- the surprise outcome, and the
        more consequential one.

  structural_ingredients:
    - description: >-
        CRT decomposition of (Z/m)^x and the structure of (Z/2^e)^x.
      citation: >-
        Standard elementary number theory; re-derived in this record and
        spot-checked by enumeration in this session. No source is cited and none
        is needed; asserting a textbook reference not consulted would be a
        fabricated citation.
      role: supplies the exact involution count
    - description: >-
        The cocycle construction and its linearisation, transferred unchanged
        from an arbitrary second involution.
      citation: >-
        Derived in H-HAWK-c7a551 steps 1-3 and re-derived here for general
        sigma. The source's Lemmas 4.1 and 4.3 were NOT READ.
      role: supplies the generic half of the argument
    - description: >-
        The cocycle identity V_{c tau} = V_c . c(V_tau) relating the three
        2-power lenses.
      citation: Derived in this record; two lines.
      role: makes the third lens non-independent, and names the speculative
        exponent route without proposing it
    - description: >-
        The relayed conductor-evasion sentence of KN-LIT-7592.
      citation: >-
        KN-LIT-7592, whose own body lists "the conductor-based evasion criterion"
        under NOT verified here. RELAYED, and it is the object being checked
        rather than an authority.
      role: the claim under audit

  reduction_chain:
    core_problem: >-
      Determine exactly which cyclotomic conductors admit a second order-2
      Galois lens, separate that necessary condition from the sufficient
      structural condition the disclosed attack actually needs, and measure the
      difference at named nearby conductors.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. No corollary about HAWK's security, about any
      conductor's vulnerability, or about a Round-3 parameter choice follows
      from this hypothesis, and none is claimed. A conductor outside the evasion
      set is NOT thereby shown attackable -- that is the entire content of (P3)
      and the reason the record separates necessary from sufficient at length.

