      minimum_effect: >-
        EXACT AGREEMENT at every m, i.e. 0 mismatches out of ~1998. A single
        mismatch refutes (P1) and the census with it.
    - metric: >-
        C2 -- set equality between {m <= 2000 : exactly one involution} and
        {4} union {p^k} union {2p^k}
      direction: different
      minimum_effect: EXACT SET EQUALITY, symmetric difference empty.
    - metric: >-
        C3 -- cardinality and smallest element of the gap set
        {m <= 2000 : >= 2 involutions and 4 does not divide m}
      direction: higher
      minimum_effect: >-
        NON-EMPTY with smallest element 15. If empty, (P2) is vacuous and is
        withdrawn.
    - metric: >-
        C4 -- involution count and explicit residues at m = 16, 32, 64
      direction: different
      minimum_effect: >-
        EXACTLY 3 at each, namely {m-1, m/2+1, m/2-1}. This is the EXHAUSTION
        claim.
    - metric: >-
        C5 -- the five-invariant comparison of Lambda^(tau) and Lambda^(c tau)
        at n = 8 and n = 16
      direction: different
      minimum_effect: >-
        NO DIRECTION IS PRE-REGISTERED AND THAT IS DELIBERATE. The DECISION RULE
        is pre-registered instead: all five agree at both n => report
        "not distinguished; the third lens is plausibly a change of coordinates
