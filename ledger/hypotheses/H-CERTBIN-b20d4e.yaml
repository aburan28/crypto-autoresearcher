  test_boundary:
    instances:
      - (n, l) in {(17, 6), (19, 6)}  -- requested cells; regime B at D = 66 = 2^l + 2 (not a solving degree)
      - (n, l) in {(17, 5), (19, 5)}  -- deciding cells; regime B at D = 66 = 2^{l+1} + 2
      - regime A at every cell, D in {3, 4}, identical target bytes
    parameters:
      references: 3 unsat + 2 sat + modal, per cell and regime
      counts: per EXP-CERTBIN-a58c63 (standard or reduced schedule, chosen by an outcome-blind timing pilot)
      nulls_regime_B: F-NULLB, F-AFFB
      nulls_regime_A: F-AFF (one draw), F-NULLF2
    implementation: experiments/EXP-CERTBIN-a58c63/impl/
    budget:
      enforcement: advisory
    excluded_from_boundary:
      - regime B at D = 130 (the generic refutation degree at l = 6); a successor contract if the l = 5 result warrants it
      - F4 pair-list traces; GPU execution; m = 3; random V; n >= 23

  falsification_conditions:
    - TS2B is falsified at a cell per its falsification condition.
    - E3 (C3) is falsified at an l = 5 cell if more than 5% of the satisfiable arm diverges before its first non-pivot column.
    - The contrast (C4) is not confirmed at a cell if regime A retains >= 0.5 or regime B < 0.9.
    - TS2G is falsified per its condition.
    - >-
      A C-DELTA or C-RANKB mismatch contradicts Lemma B-S or the
      implementation. The regime-B metrics are held as INVALID until the
      review round adjudicates which; it is never evidence about C2-C4.

