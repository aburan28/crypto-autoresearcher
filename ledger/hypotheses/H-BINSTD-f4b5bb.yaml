# =============================================================================
# H-BINSTD-f4b5bb -- F2 mitt success-probability bake-off (M1/M2/M3)
# on toy binary Koblitz. Specified from IDEA-20261001-5e859e under
# RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001. Approved DEC-20261003-c943ba.
# ZERO RUNS in this design packet. Stages 0-1 authorized. No AUXIN.
# No Bedrock. Claim tier: observational / instrument. No attack / exponent.
# IDEA-20261001-5e859e claim text is not edited.
# =============================================================================
hypothesis:
  id: H-BINSTD-f4b5bb
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261001-5e859e
  experiment_id: EXP-BINSTD-0f2222
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-03'
  approved_at: '2026-10-03'
  authorised_by: DEC-20261003-c943ba
  status: approved
  proposed_by: coordinator
  title: >-
    On toy Koblitz n=17, does empirical mitt P(R in Pool+Pool) match exactly
    one of M1/M2/M3 within 25% relative error on ≥3 frozen cells?

  statement: >-
    CLAIM (instrument calibration / observational; NO ATTACK; NO EXPONENT).
    Setting: binary Koblitz analog E: Y^2+XY=X^3+1 over F_{2^n} at n=17
    (Stage 1). Draw a size-N uniform pool of affine curve points and a
    uniform random target R. Let p_hat be the empirical probability that
    R = P+Q for some P,Q in the pool (mitt search; certificate.kind=
    decomposition; Route A table-field hash lookup; Route B independent
    schoolbook re-add). Compare p_hat against three formulas frozen BEFORE
    any yield run: (M1) N(N-1)/(2|G|); (M2) N^2/|G|; (M3) 1-exp(-N^2/|G|),
    with |G| = #E(F_{2^n}) (all of E, not a prime-order subgroup; disclosed).
    FORALL three Stage-1 cells with pre-registered E_M2 ∈ {5,15,40} at
    attempts=200: exactly one of {M1,M2,M3} stays within relative error
    0.25 on all three cells (winning model), OR the bake-off fails / ties.
    Successor instrument to EV-BINSTD-8edd9b (uniform count 38 vs E≈8.80
    at n=17, N=96, attempts=250). Does not revive HEUR-H1 of
    EXP-BINSTD-a3cfee. NO break. NO n≥131 transfer.

  mechanism: >-
    OBJECT FRAME. Representation R1: curve points on E/F_{2^n}. Operation
    set Sigma: translation by pool elements only (Class I partial-action —
    identical to F2 mitt decomposition). Trichotomy: Class I instrument.
    Lossy-projection: not applicable (calibrates an existing F2 meter; no
    new projection). OFF-LIMITS: F2 named as the meter under calibration;
    F1 unused; KN-OPEN-020 not proposing a new factor-base class. WHAT IS
    NEW: an explicit three-model bake-off for the mitt success probability
    that EV-BINSTD-8edd9b showed is load-bearing and currently wrong under
    M1-as-used in EXP-BINSTD-a3cfee Stage 0. Dual meters: table-field hash
    search vs schoolbook P+Q re-verify.

  assumptions:
    - >-
      Toy Koblitz analog Y^2+XY=X^3+1 over F_{2^n} is an admissible
      instrument; transfer to ECC2K-130 is NOT claimed.
    - >-
      Sampling universe is all of E (affine + O excluded from random R);
      |G| in the formulas is #E, disclosed vs a prime-order subgroup.
    - certificate.kind=decomposition with independent schoolbook re-verify
      for every counted hit.
    - OFF-LIMITS F2 named as the meter; no new Sigma.
    - Stage 2 (n=23 replication of the winning model) is specified but NOT
      authorized under this card.

  predictions:
    - metric: uniform_mitt_relative_error_vs_winning_model
      direction: lower
      minimum_effect: '≤0.25 on ≥3 Stage-1 cells for exactly one of M1/M2/M3'
    - metric: certificate_pass_rate
      direction: higher
      minimum_effect: '1.0'
    - metric: empty_pool_hit_count
      direction: exact
      minimum_effect: '0'
    - metric: twin_add_agreement
      direction: same
      minimum_effect: 'table-field add equals schoolbook add on every counted hit'

  test_boundary:
    instances:
      - 'Stage 0: freeze M1/M2/M3, relerr band 0.25, dual #E, N grid, empty-pool null, twin add'
      - 'Stage 1 authorized: n=17, three cells E_M2∈{5,15,40}, attempts=200'
    parameters:
      field_degree_n: 17
      curve: Y^2+XY=X^3+1
      attempts: 200
      e_m2_targets: [5, 15, 40]
      relerr_band: 0.25
      tie_band: 0.05
      pool_seed: 202610015859
      r_seed: 202610015860
    implementation: >-
      Pure Python under experiments/EXP-BINSTD-0f2222/implementation/;
      command surface implementation/run.py driven by trial-plan-v1.json.
      Dual meters: TableField hash lookup (Route A) and Field schoolbook
      re-add (Route B) in mitt.py. No Magma/Sage/AUXIN/Bedrock.
    budget:
      wall_clock_seconds: 7200
      memory_gb: 2
      maximum_runs: 4

  falsification_conditions:
    - >-
      Claiming a winning model after retuning formulas to Stage-1 data
      without protocol_amendment.
    - certificate_pass_rate < 1.0 on counted hits (O-ARTIFACT).
    - Twin table vs schoolbook add disagreement (O-ARTIFACT).
    - Empty-pool null produces a hit (O-ARTIFACT).
    - Claiming n≥131 transfer or break from calibration cells.
    - No model stays within 25% relative error on ≥3 cells (O-FAIL-BAND).
    - Two or more models each hold ≥3 cells (O-INCONCLUSIVE bake-off).

  distinguishable_outcomes:
    - id: O-SUPPORT
      meaning: >-
        Twin OK; cert_pass_rate=1; empty-pool 0 hits; exactly one of
        {M1,M2,M3} has relative error ≤0.25 on all three Stage-1 cells.
        Instrument calibration succeeds at n=17. No attack claim.
    - id: O-FAIL-BAND
      meaning: >-
        Twin OK; cert OK; no model holds all three cells within 0.25.
        Mitt success probability remains misspecified at this scale.
    - id: O-INCONCLUSIVE
      meaning: >-
        Two or more models each hold ≥3 cells, or models tie within 5%
        on every cell so a unique winner cannot be named.
    - id: O-ARTIFACT
      meaning: Twin disagreement, certificate fail, empty-pool hit, or freeze drift.
    - id: O-IMPEDIMENT
      meaning: >-
        Infrastructure timeout/crash/missing Stage-0 freeze. Never negative
        evidence against H-BINSTD-f4b5bb.

  interpretation_limits:
    - Toy calibration only; no HEUR-H1 re-test in this experiment.
    - No n≥131 transfer; no break; no exponent.
    - Winning model at toy n may still fail at larger n — disclosed.
    - >-
      |G| is #E, not a prime-order subgroup; formulas would change if
      sampling were restricted to a subgroup.
    - Stage 2 n=23 replication is not authorized under this card.

  heuristic_assumptions:
    - id: HEUR-BINSTD-5e859e-H1
      formal_statement: >-
        FORALL tested (n,N) with E_M2 = attempts·N^2/|G| in [5,50]: the
        empirical p_hat satisfies |p_hat - p_M*| / p_M* ≤ 0.25 for exactly
        one of {M1,M2,M3} consistently across ≥3 cells (the winning model).
      random_model_justification: >-
        Rigorous ingredient: for a fixed pool of N points, the number of
        ordered pairs (P,Q) is N^2; if sums were uniform in a group of
        order |G|, P(R hit) ≈ 1-exp(-N^2/|G|). Classical distribution:
        birthday / occupancy for random maps G×G → G. Transfer to curve
        points on E(F_{2^n}) is the heuristic under test. Unordered M1
        was the formula used in EXP-BINSTD-a3cfee Stage 0 (EV-BINSTD-8edd9b
        relative error ≈3.32).
      supporting_results:
        - EV-BINSTD-8edd9b
        - EXP-BINSTD-a3cfee
      validation_experiment_ids:
        - EXP-BINSTD-0f2222
      falsification_condition: >-
        No model stays within 25% relative error on ≥3 cells, OR two models
        each hold ≥3 cells, OR any certificate_pass_rate < 1.0, OR twin fail.

  asymptotic_claim: null

  dominated_by: >-
    CHECKED: not an attack row. Matched rho, Gaudry/Diem IC, and Semaev
    PDP rows dominate any attack reading; this record claims none.
    Instrument calibration is not dominated as a measurement task.

  sota_delta:
    time: zero attack delta
    memory: zero
    data_queries: >-
      First three-model mitt success-probability bake-off on binary
      Koblitz in this program, spawned from EV-BINSTD-8edd9b.

  proof_search_map:
    bottleneck: >-
      Whether the empirical mitt hit probability on uniform pools matches
      a named occupancy formula (M1/M2/M3) within 25% relative error, or
      whether curve-sum non-uniformity / subgroup vs full-E sampling
      misspecifies the meter (the EV-BINSTD-8edd9b obstruction).
    baseline_embedding:
      parameter_slice: >-
        n=17, E: Y^2+XY=X^3+1, attempts=200, E_M2 targets {5,15,40};
        dual #E and empty-pool null frozen before any p_hat is read.
      reproduction_check: >-
        Independent check.py recomputes schoolbook #E at Stage 0 and
        schoolbook P+Q==R on a Stage-1 hit example; re-checks in_band_M2
        polarity against the frozen 0.25 band.
    observation_collision:
      observable: 'p_hat vs {M1,M2,M3} relative-error band per cell'
      distinct_preimage_search: >-
        A held band could arise from (i) the named occupancy law (claim),
        (ii) sampling |G| as #E vs a prime-order subgroup (disclosed and
        frozen), (iii) certificate/twin artifact. Separated by dual-route
        re-verify and empty-pool null.
    constructive_transforms:
      - transform: measurement_instrument
        proposed_object: >-
          Frozen three-model mitt bake-off with dual-route arithmetic and
          empty-pool null.
        predicted_gain: >-
          A named winning model (or a scoped misspecification) so a later
          HEUR-H1 re-test can trust its uniform arm.
    quantifier_order: >-
      FORALL Stage-1 cells at n=17 with E_M2 in {5,15,40}: exactly one of
      M1/M2/M3 is PREDICTED to hold the 0.25 band. NOT CLAIMED: n=23 under
      this card; n≥131; any attack.
    method_ceiling:
      strongest_certifiable_claim: >-
        On the named Stage-1 toy cells, measured p_hat lies inside or
        outside the frozen 0.25 band of each named model, with twin
        agreement and certificate_pass_rate=1.
      nearby_object_control: >-
        Empty pool (must give zero hits); twin disagreement (artifact).
        n=23 replication not authorized.
    proof_obligations:
      - claim: Dual #E (table vs schoolbook trace-count) agrees.
        responsibility: baseline
      - claim: Schoolbook P+Q equals R on every counted hit.
        responsibility: correctness
      - claim: Empty pool yields zero hits.
        responsibility: baseline
      - claim: Band polarity uses |p_hat-p_M|/p_M ≤ 0.25, formulas frozen.
        responsibility: success_probability
      - claim: Nothing asserted at n≥131.
        responsibility: scope

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
