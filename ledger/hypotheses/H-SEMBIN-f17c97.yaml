# H-SEMBIN-f17c97 — stage-0 closure for IDEA-20261016-d0335b.
# The chain-length slope stays proposed.
hypothesis:
  id: H-SEMBIN-f17c97
  question_id: RQ-SEMBIN-9e8f82
  source_idea: IDEA-20261016-d0335b
  derived_from_idea: IDEA-20261016-d0335b
  experiment_id: EXP-SEMBIN-222128
  goal_id: GOAL-SEMBIN-5078bc
  specified_at: '2026-10-17'
  proposed_by: coordinator
  status: specified
  title: Stage-0 HKYY closure on x, y, xy+1 and on x+1, y+1
  statement: >-
    Over GF(2), the HKYY space of x, y, and xy+1 first contains the
    constant 1 at degree 2. The space of x+1 and y+1 contains each of
    those linear forms at degree 1 and does not contain the constant 1
    at degree at most 4. This stage does not fit a slope in the chain length.
  mechanism: >-
    IDEA-20261016-d0335b defines D_ref as the least degree whose HKYY
    space contains 1, and D_pin as the least degree whose space contains
    the linear forms of a unique decomposition. Stage 0 checks that
    definition on two hand-sized ideals. Agreement is an instrument check.
    It is not a measurement of D(m).
  assumptions:
    - >-
      A generator is admitted at degree D only when its total degree is
      at most D, and a variable multiple is admitted only when every term
      stays inside that degree. Truncating a high term is not closure.
    - A timeout is an instrument failure, not evidence about Theorem 1.
  proof_search_map:
    bottleneck: Whether these two ideals have the frozen degrees.
    baseline_embedding:
      parameter_slice: Two variables, degree cap 4, the two frozen ideals.
      reproduction_check: d_ref 2, d_pin 1, d_pin_second 1, sat_contains_one false.
    observation_collision:
      observable: d_ref, d_pin, d_pin_second, sat_contains_one, pins_agree.
      distinct_preimage_search: The degrees are closure degrees. They are not a slope.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: The two toy ideals.
        predicted_gain: none; this stage records whether the closure matches the freeze
    quantifier_order: For these two ideals only. No claim is made for every chain length.
    method_ceiling:
      strongest_certifiable_claim: The instrument accepts or rejects these two ideals.
      nearby_object_control: The satisfiable ideal is the control that must not contain 1.
    proof_obligations:
      - claim: closure does not truncate high-degree terms
        responsibility: baseline
      - claim: the run writes the degrees; this record is not a result
        responsibility: runtime
      - claim: the chain-length slope is not an input
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: d_ref_equals_2
      direction: different
      minimum_effect: d_ref is 2
    - metric: d_pin_equals_1
      direction: different
      minimum_effect: d_pin and d_pin_second are 1
    - metric: sat_excludes_one
      direction: different
      minimum_effect: sat_contains_one is false
  test_boundary:
    instances:
      - GF(2) ideal generated by x, y, xy+1
      - GF(2) ideal generated by x+1, y+1
    parameters:
      nvars: 2
      d_max: 4
    implementation: >-
      experiments/EXP-SEMBIN-222128/implementation/run.py, pure Python
    budget:
      enforcement: advisory
      note: one deterministic closure; machine protection is on the handoff
  falsification_conditions:
    - >-
      Instrument invalid if any frozen degree or flag differs. That reading
      does not decide the slope claim of IDEA-20261016-d0335b.
    - >-
      Typed chains, a fitted slope, and Theorem 1 stay outside this boundary.
  interpretation_limits:
    - A pass checks two toy ideals. It is not evidence that D(m) is linear.
    - A fail invalidates this instrument cell only.
    - Negative evidence closes only the exact tested scope.
    - No deployed curve is in scope.
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        Not under test beyond these ideals. The parent idea's slope is
        about typed chains. This cell draws the closure directly.
      random_model_justification: No random system is drawn.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: Not applicable beyond the two frozen ideals.
  structural_ingredients:
    - description: HKYY space closed under multiplication up to a degree cap.
      citation: IDEA-20261016-d0335b
      provenance: internal
      verified_by: design session 2026-10-17 read ledger/proposals/IDEA-20261016-d0335b.yaml
      role: names the closure; the degrees evaluated are in the runner
  asymptotic_claim: null
  dominated_by: >-
    The parent idea's chain-length law. A toy closure that matches its own
    definition is the instrument, not a degree law. This hypothesis claims
    no exponent delta.
  sota_delta: >-
    None in exponent. The counted delta is two frozen ideals. The parent
    idea's slope table is not produced.
  citations:
    - ref: IDEA-20261016-d0335b
      provenance: internal
      claim: parent proposal, write-once, not modified by this hypothesis
      verified_by: design session 2026-10-17 read ledger/proposals/IDEA-20261016-d0335b.yaml
