# =============================================================================
# H-CERTBIN-a3d441 -- Target-law separation of the tuple ceiling (U / P / W)
# Specified from IDEA-20260930-f1d8ff under RQ-CERTBIN-836ce2 /
# GOAL-ECDLP2M-001. Approved DEC-20261003-f561a3. ZERO RUNS in this packet.
# Stages 0-1 authorized. No AUXIN. No Bedrock. Toy n=19 only. No exponent.
# =============================================================================
hypothesis:
  id: H-CERTBIN-a3d441
  question_id: RQ-CERTBIN-836ce2
  source_idea: IDEA-20260930-f1d8ff
  experiment_id: EXP-CERTBIN-0f4599
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-03'
  approved_at: '2026-10-03'
  authorised_by: DEC-20261003-f561a3
  status: approved
  proposed_by: coordinator
  title: >-
    On E_0 / F_{2^19}, m=3, one enumerable cell, do uniform / planted /
    independent-x-slice hit rates obey the pre-registered null, or does the
    x-slice concentrate?

  statement: >-
    CLAIM (control / law-index instrument; NO ATTACK; NO EXPONENT).
    Representation class R1 (x-coordinate in a polynomial basis). Charged
    stage: relation-collection success probability only. On the Koblitz
    curve E_0: y^2 + xy = x^3 + 1 over F_{2^19} (prime degree, ord_19(2)=18),
    m=3, at the smallest B with C(B+2,3)/r ≥ 2^{-6} and C ≤ 10^7, FORALL
    two frozen seeds of independent subspaces (V, W) of equal dimension
    with dim(W ∩ V)=0: (i) rate(U) = |image|/r where image is the unordered
    3-multiset sumset of F_V = {P in the prime-order subgroup : x(P) in V};
    (ii) rate(P) = 1 on every planted multiset; (iii) either
    rate(W)/rate(U) ∈ [1/2, 2] on every seed (E-NULL / O-NULL) or
    rate(W)/rate(U) ≥ 4 on every seed (E-SLICE / O-SLICE). E-SLICE prices
    only "targets already known to have x in W". It does not move generic
    ECDLP or any Certicom exponent. Distinct from IDEA-20260930-d2d20c
    (k-orbit collisions vs birthday) and does not restate the uniform-law
    cap of IDEA-20260926-3c6a19 / 4b65e3. No 8bdf86 / 591d28 reopen.

  mechanism: >-
    OBJECT FRAME. Operation set Sigma: the three sampling maps U (uniform
    in the order-r subgroup), P (uniform among unordered m-multisets of
    F_V, summed), W (uniform in S_W). Tracked object: hit bit π(T)=1 iff
    T lies in the image of the unordered m-multiset sum map. LOSSY
    PROJECTION: keep the hit bit and the law tag; discard the multiset
    and the discrete log. OPEN NUMBER: L = log2(r)-log2(|image|) and
    branching b = C(B+m-1,m)/|image|. Null object of the same shape: the
    triple (U, W, P) itself — P is the object on which "hit ≤ p_ceil" is
    known false whenever p_ceil < 1.

  assumptions:
    - >-
      F2 is a component. The factor base is {P : x(P) in V} intersected
      with the prime-order subgroup. KN-OPEN-020 scoped-out class; no
      escape claim.
    - >-
      Unordered multisets, matching C(B+m-1, m), not C(B, m).
    - >-
      Exact census rates are the primary metrics. The idea's 200 draws
      remain as the planted checksum and an MC cross-check. This is a
      pre-data refinement (image is enumerable by construction).

  predictions:
    - metric: rate_P
      direction: higher
      minimum_effect: equals 1 on every planted target; any miss voids the census
    - metric: rate_U
      direction: same
      minimum_effect: equals |image|/r on the exact census
    - metric: rate_W_over_rate_U
      direction: lower
      minimum_effect: >-
        null band [1/2, 2] on every seed; ≥ 4 on every seed is E-SLICE
    - metric: branching_b
      direction: lower
      minimum_effect: b ≤ 1 + 2*(C/r) at this cell under the birthday null

  test_boundary:
    instances:
      - 'Stage 0: freeze E_0/F_2^19, order, r, two (V,W) pairs, C twins'
      - 'Stage 1: enumerate image; exact rates U/W plus planted checksum'
    parameters:
      n: 19
      m: 3
      equation: 'y^2 + xy = x^3 + 1'
      modulus: 't^19 + t^5 + t^2 + t + 1'
      expected_order: 523492
      p_ceil_floor: 2^{-6}
      max_enumerable_C: 10000000
      n_targets: 200
      seeds: [2026100319, 2026100320]
    implementation: >-
      Pure Python under experiments/EXP-CERTBIN-0f4599/implementation/;
      run.py driven by trial-plan-v1.json; check.py independent. No
      Magma/Sage/AUXIN/Bedrock. No Gröbner solver.
    budget:
      wall_clock_seconds: 7200
      memory_gb: 2
      maximum_runs: 4

  distinguishable_outcomes:
    - id: O-NULL
      alias: E-NULL
      meaning: >-
        rate(P)=1, rate(U)=|image|/r, rate(W)/rate(U) in [1/2, 2] on every
        seed. The r-denominator prices every law an attacker can sample
        without already knowing a decomposition.
    - id: O-SLICE
      alias: E-SLICE
      meaning: >-
        Census checksum OK and rate(W)/rate(U) ≥ 4 on every seed. p_ceil
        is the wrong denominator for that slice. Restricted problem only.
        Certicom challenge points are not known to lie in W.
    - id: O-INCONCLUSIVE
      meaning: >-
        Ratios land in (2, 4) or the two seeds disagree (one null-band,
        one slice). Expand seeds or stop; do not pick a law reading.
    - id: O-ARTIFACT
      meaning: >-
        rate(P)<1, C twin fail, dim(W∩V)>0, order mismatch, or image
        checksum fail. No law comparison is read.
    - id: O-IMPEDIMENT
      meaning: >-
        Timeout, crash, or missing Stage-0 freeze. Never negative
        evidence against H-CERTBIN-a3d441.

  falsification_conditions:
    - rate(P) < 1 on any planted target: census wrong; no law comparison
    - >-
      rate(W)/rate(U) ≥ 4 on every seed with checksum OK: E-NULL is false
      at this n=19 cell. Not a uniform-target exponent improvement.
    - >-
      rate(W)/rate(U) in [1/2, 2] and b ≤ 1+2*(C/r) on both seeds:
      E-SLICE is false at this cell.
    - Claiming an n≥131 or ECC2K-130 exponent move from this cell.

  interpretation_limits:
    - One cell at n=19. Counting identity transfers; measured ratio does not.
    - E-SLICE prices a restricted target law, not a public Certicom point.
    - Full-cost S and matched-rho stay null. No discrete logarithm is solved.
    - Does not restate IDEA-20260926-3c6a19 / 4b65e3. Sibling d2d20c is a
      different observable (k-orbit collisions vs birthday).

  heuristic_assumptions:
    - id: HEUR-CERTBIN-f1d8ff-H1
      formal_statement: >-
        At this cell, with C = C(B+m-1, m) ≤ r/64, the multiset-sum map of
        a uniform random subspace factor base pushes forward like a uniform
        random function of size C into a set of size r: |image| =
        C(1-Theta(C/r)) and b = 1+Theta(C/r). Law W, W independent of V,
        has conditional hit rate within a factor 2 of |image|/r.
      random_model_justification: >-
        Classical occupancy / birthday: expected collisions C(C-1)/(2r).
        Pairwise independence of elliptic sums is the part that can fail.
      supporting_results:
        - IDEA-20260930-f1d8ff
        - KN-OPEN-020
      validation_experiment_ids:
        - EXP-CERTBIN-0f4599
      falsification_condition: >-
        O-SLICE at this cell, or birthday tail failure (heaviest fiber > 8),
        or O-ARTIFACT (instrument).

  asymptotic_claim:
    problem: law-indexed hit rate of an enumerable m=3 sumset at n=19
    prior_best: uniform-law cap mu = C(B+m-1,m)/r (IDEA-20260926-3c6a19)
    time_exponent: >-
      UNCHANGED r^{1/2}. No outcome of this control moves the exponent of
      a uniform or fixed public target.
    memory_exponent: r^{0} beyond the enumerated image (≤ 10^7 points)
    hidden_cofactor: Theta(C) group additions as measurement cost, not attack cost
    claim_kind: heuristic_validation

  proof_search_map:
    bottleneck: >-
      Whether p_ceil may be used as the hit probability for a law other
      than uniform.
    baseline_embedding:
      parameter_slice: >-
        Audit identity support ≤ min(r, C(B+m-1,m)) at archived m=83 cells
        is NOT re-run. Toy cell is the same identity at n=19.
      reproduction_check: >-
        Recompute C(B+2,3)/r from the curve order at the chosen B before
        any rates are read. Twin combinadic vs nested-loop count. A
        mismatch voids the cell.
    observation_collision:
      observable: the hit bit π(T), tagged by the law that produced T
      distinct_preimage_search: >-
        Distinct multisets with the same sum are one fiber of b. The
        enumeration computes b. Sibling EXP for d2d20c (k-orbit collisions)
        is a different observable and is not this contract.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: fiber of π under each of U, P, W
        predicted_gain: Separates E-NULL from E-SLICE. No exponent gain.
    quantifier_order: >-
      FOR ALL seeds of (V,W) at n=19: rate(P)=1 and rate(U)=|image|/r.
      EXISTS a reading of rate(W)/rate(U): null says every seed in [1/2,2];
      slice says every seed ≥ 4.
    method_ceiling:
      strongest_certifiable_claim: >-
        At this n=19 cell, either the uniform denominator prices law W to
        within a factor 2, or it does not. Nothing certified about m=83,
        solver cost, or a uniform public target's exponent.
      nearby_object_control: >-
        Law P: "hit ≤ p_ceil" is known false when p_ceil<1. Cofactor-4
        torsion: same formula with N=4 has ceiling ≥ 1 once C≥4.
    proof_obligations:
      - claim: rate(U) equals |image|/r on the exact census
        responsibility: correctness
      - claim: rate(P)=1 by construction of the planted multiset
        responsibility: correctness
      - claim: b = 1 + Theta(C/r) for C ≤ r/64 under a random-sum model
        responsibility: success_probability
      - claim: E-SLICE does not change the exponent of a uniform challenge
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  citations:
    - ref: IDEA-20260930-f1d8ff
      provenance: internal
      claim: Source proposal; law index on the tuple-ceiling hit bit
      verified_by: coordinator file read 2026-10-03
    - ref: IDEA-20260926-3c6a19
