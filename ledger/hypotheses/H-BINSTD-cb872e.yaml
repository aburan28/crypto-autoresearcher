# H-BINSTD-cb872e
# Cap-versus-span arithmetic for IDEA-20261001-20561e.
# No RSS probe. Approval: DEC-20261003-f2ca94.
hypothesis:
  id: H-BINSTD-cb872e
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261001-20561e
  experiment_id: EXP-BINSTD-afb5ee
  specified_at: '2026-10-03'
  status: approved
  proposed_by: idea-generator
  approved_by_decision: DEC-20261003-f2ca94
  title: >-
    The n-span falls short of the cap 2 by 3
  statement: >-
    The written n values are 17, 19, 23, 29, and 31. Twice 17 is 34,
    and 34 minus 31 is 3, so 31 over 17 lies strictly below the
    written cap 2. The consecutive cross-gaps are 15, 15, 17, and
    27. The product of the span gap 3 with those four gaps is
    309825. Their sum is 77. Reading the cap as 20 over 10 gives
    the tenths gap 30, and 30 divided by 10 is 3. Five n values
    times two dimensions is 10 cells. The written band formula does
    not contain n, so the distinct bound count is 2, and 10 divided
    by 2 is 5.
  mechanism: >-
    The proposal writes an n-insensitivity cap of 2 and the n list
    17, 19, 23, 29, 31. This contract checks that list against the
    cap and counts cells. It does not measure RSS and does not name
    a numeric alpha or M0.
  assumptions: []
  proof_search_map:
    bottleneck: The span gap 3 of twice 17 against 31.
    baseline_embedding:
      parameter_slice: >-
        The n list and the cap 2.0 in IDEA-20261001-20561e, read
        2026-10-03. The cross-gaps were recomputed in this design
        session. That computation is not a run.
      reproduction_check: >-
        One route subtracts each larger n from twice the previous
        n. The other reads the cap as 20 over 10 and divides the
        tenths gap 30 by 10. They must agree that the span gap is 3.
    observation_collision:
      observable: The span gap 3 and the product 309825.
      distinct_preimage_search: >-
        Reporting 31 over 17 as at least 2 drops the span gap 3.
        Reporting the cell count as 5 drops the factor 2 from the
        two dimensions.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The five n values and the cap 2.
        predicted_gain: Integer comparisons. No RSS probe.
    quantifier_order: >-
      The span gap 3 comes first, then the four consecutive gaps,
      then their product 309825, then the cell count 10.
    method_ceiling:
      strongest_certifiable_claim: >-
        The span gap 3 and the product 309825. Not a measured RSS
        and not a memory law.
      nearby_object_control: >-
        The span reported as meeting the cap 2, and the tenths gap
        reported as 3 rather than 30.
    proof_obligations:
      - claim: Twice 17 minus 31 is 3.
        responsibility: correctness
      - claim: The product of 3, 15, 15, 17, and 27 is 309825.
        responsibility: correctness
      - claim: Five times two is 10, and 10 divided by 2 is 5.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions: []
