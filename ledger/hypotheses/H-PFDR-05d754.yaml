hypothesis:
  id: H-PFDR-05d754
  question_id: RQ-SBRG-f31cb2
  source_idea_id: IDEA-20260829-57b1eb
  batch_id: BATCH-c64bee
  title: >-
    The reachable chain-node set W of a Weil-descended chained Semaev system
    carries NO low-degree boolean vanishing relations beyond the trivial count
    (excess_d = 0) -- and because the competing explanation attributes any
    excess to W being the image of a low-degree map from a low-dimensional
    domain, which is a property of low-degree maps and NOT of elliptic curves,
    a CURVE-FREE image null is mandatory and a nonzero excess it reproduces may
    not be quoted as a statement about Semaev structure, elliptic curves, or
    the ECDLP.
  statement: >-
    (A) THE OBJECT AND THE STATISTIC. Fix an ordinary curve E over F_{2^n}, a
    factor base of B points whose x-coordinates lie in a chosen F_2-subspace of
    dimension b, and the chained representation of EXP-SBRG-60c55e. Let W be the
    image in F_2^n, under a fixed field basis, of the auxiliary chain-node
    x-coordinates x(eps_1 P_1 + ... + eps_{t-1} P_{t-1}) as the P_i range over
    the factor base and the signs over {+, -}. Let
    L_d(W) = {g in F_2[z_1..z_n]/(z_i^2 - z_i) : deg g <= d, g vanishes on W},
    s_d = dim L_d(W), M_d = sum_{i <= d} binom(n, i), and
    excess_d = s_d - max(0, M_d - |W|).
    (B) THE NULL IS AN EXACT INTEGER. dim L_d = M_d - rank(Ev_d) is an integer
    identity, not a statistic, because the evaluation map is linear. For a
    uniformly random point set of size at least M_d the evaluation matrix has
    full column rank with probability 1 - O(2^{-(|W| - M_d)}). So the predicted
    null value is exactly 0 and needs no control battery to establish -- the
    controls exist to establish that the instrument has POWER, which is a
    different and equally blocking obligation.
    (C) THE TWO EXPLANATIONS, STATED BEFORE THE MEASUREMENT. E1 INHERITED LOW
    DEGREE: W is the image of a low-degree map from a domain of (t-1)*b boolean
    coordinates into F_2^n with (t-1)*b < n, and images of low-degree maps from
    low-dimensional domains satisfy low-degree relations; E1 predicts
    excess_d > 0 growing with n at fixed d. E2 DEGREE PSEUDORANDOMNESS: the
    x-map is a quotient by inversion and the group law is not compatible with
    the F_2-linear structure the descent imposes, so W behaves like a random
    subset of the rational-x locus with respect to low-degree conditions; E2
    predicts excess_d = 0 exactly at every admitted cell.
    (D) THE ATTRIBUTION PROBLEM THIS RECORD ADDS TO THE SOURCE IDEA, AND IT IS
    THE LOAD-BEARING ADDITION. E1 as stated is NOT a claim about elliptic
    curves. It is a claim about images of low-degree maps from low-dimensional
    boolean domains, and a curve-free object of exactly that shape -- the image
    of a random F_2-polynomial map of matched algebraic degree from a matched
    (t-1)*b-dimensional domain into F_2^n -- has the same property for the same
    reason. THEREFORE THE CURVE-FREE IMAGE NULL IS BLOCKING AND ITS RESULT
    GOVERNS EVERY ATTRIBUTION. If the curve-free image null reproduces a nonzero
    excess at matched (n, d, domain dimension, map degree, cardinality), the
    excess is a fact about low-degree map images and NOTHING in the run may be
    described as a property of Semaev structure, of the summation polynomial, of
    elliptic curves, or of the ECDLP. Only the EXCESS OVER THE CURVE-FREE IMAGE
    NULL may carry a curve-specific reading.
    (E) THE HONEST OVERHEAD, IN THE STATEMENT AND NOT A FOOTNOTE. Computing
    L_d(W) requires ENUMERATING W at cost Theta(B^{t-1}), which is the table
    cost the compressed-representation class exists to avoid. A positive
    measurement is therefore a STRUCTURE PROBE AND NOT AN ALGORITHM; a usable
    filter would require the vanishing polynomials to be derived in closed form
    from the summation recursion, an obligation this record does not discharge.
    A negative measurement is immediately conclusive for the low-degree class at
    the tested cells and costs the same.
  mechanism: >-
    THE TRACKED OBJECT is L_d(W), the low-degree part of the vanishing ideal of
    the reachable set. It is genuinely lossy: its common zero set strictly
    contains W below the interpolation threshold, so W is not recoverable from
    it, and it discards which tuple produced each element, the fibre
    multiplicities, the factor base, the curve coefficients and the field basis.
    It is lossy COMPATIBLY with the operation the algorithm performs, because
    the final chain equation consults the structural part only through a
    membership question and a vanishing polynomial answers a sound one-sided
    version of exactly that question: g(u) nonzero implies u not in W, with no
    false negatives. Contrast the full vanishing ideal I(W), which loses nothing
    and is a change of coordinates on the table.
    WHY THE INSTRUMENT NEEDS A PLANTED POSITIVE. The predicted value is zero, so
    the measurement is an assertion that nothing is there, and such an assertion
    is worthless from an instrument that could not see something if it were.
    The planted positive is exact and hand-derivable: at t = 2 the reachable set
    is the factor-base subspace itself, which satisfies exactly n - b independent
    linear relations, so the instrument must return excess_1 = n - b with zero
    tolerance. That is a defect of KNOWN SIZE and it fires at a KNOWN MAGNITUDE.
    WHERE THE ARGUMENT STOPS. It stops at d for which M_d exceeds |W|, where a
    nonzero L_d exists for counting reasons alone, which is why excess_d
    subtracts max(0, M_d - |W|) and why the cardinality screen is enforced
    BEFORE the run. It stops at representations other than boolean polynomial
    degree: a set can be degree-pseudorandom and still compressible by another
    sketch, so a zero excess closes the LOW-DEGREE class and not compression in
    general. It says nothing about prime fields, where there is no boolean ring.
  assumptions:
    - >-
      [basis] The field basis is fixed before any cell runs and reported. W as a
      subset of F_{2^n} is basis-free, but L_d(W) is NOT, because degree under
      Weil descent is a basis-dependent notion. Both power and normal bases are
      measured and any basis dependence is a reportable result, not a nuisance.
    - >-
      [screen, enforced before the run] Cells are admitted only when
      |W| >= 10 * M_d. ARITHMETIC VERIFIED BY THIS COORDINATOR from the source
      idea and recomputed independently: at n = 16, M_2 = 137, M_3 = 697,
      M_4 = 2517, M_5 = 6885; at n = 20, M_3 = 1351, M_4 = 6196, M_5 = 21700;
      at n = 24, M_3 = 2325, M_4 = 12951, M_5 = 55455. CORRECTION TO THE SOURCE
      IDEA: the cell n = 16, d = 5 is INADMISSIBLE for every possible W, because
      10 * M_5 = 68,850 exceeds 2^16 = 65,536 and therefore exceeds the entire
      ambient space. IDEA-20260829-57b1eb lists d = 5 in its n = 16 grid and
      separately describes that cell as merely the tightest on the grid. It is
      not tight, it is impossible, and it is excluded here by arithmetic rather
      than by a screen firing at run time.
    - >-
      [independence] W is computed by direct group arithmetic from the factor
      base with NO summation polynomial anywhere on that code path. That
      independence is the value of the measurement and is enforced, not assumed;
      any path touching a summation polynomial voids the cell.
    - >-
      [ceiling] The filter power is bounded above by n - log2 |W| computed from
      the MEASURED |W| per cell, never from a nominal cardinality. The source
      idea quotes a 5.0-bit ceiling at n = 24 from |W| = 2^19; the measured |W|
      after deduplication is the only admissible input to that ceiling.
    - >-
      [inherited] The motivating cost frame -- that every explicit
      representation of the target-independent structure costs Omega(B^{t-1})
      words -- comes from IDEA-20260829-66a876, which THIS COORDINATOR DID NOT
      OPEN. It is a motivation, not a premise: the measurement is well defined
      independently of it, and no number in this record depends on it.
  proof_search_map:
    bottleneck: >-
      The SIZE of the reusable object. The exact step whose removal would change
      the conclusion is "store or enumerate the reachable set". A low-degree
      filter would remove it by answering the only question ever asked of the
      set without holding the set.
    baseline_embedding:
      parameter_slice: >-
        Two slices. (i) d at the interpolation threshold, where M_d exceeds |W|
        and the formula must return s_d = M_d - |W| exactly with excess_d = 0.
        (ii) t = 2, where W is the factor-base subspace itself and the
        instrument must return excess_1 = n - b exactly.
      reproduction_check: >-
        Exact integer equality on both slices, hand-derivable and
        hand-checkable. A miss on the t = 2 planted slice halts the line before
        any real cell runs; the instrument is not computing the vanishing
        dimension.
    observation_collision:
      observable: 'the single integer excess_d'
      distinct_preimage_search: >-
        REQUIRED, with FOUR named preimages of a nonzero excess and each given
        its own arm. (i) Genuine Semaev-specific inherited low degree. (ii) An
        artifact of the FIELD BASIS or the factor-base subspace, a coordinate
        property and not a curve property, separated by requiring persistence
        across both bases and at least three subspace seeds. (iii) The
        RATIONALITY CONDITION -- W lies inside the density-about-one-half set of
        x-coordinates admitting a rational point -- a known target-independent
        dependency measured separately so it is subtracted rather than
        rediscovered. (iv) THE CURVE-FREE PREIMAGE, added by this record: the
        image of a random low-degree F_2-map from a matched-dimension domain,
        which has no curve, no group law and no summation polynomial and which
        E1 predicts should show the same excess for the same reason. Arm (iv)
        governs attribution and is blocking.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the reachable SET by the low-degree part of its vanishing
          ideal: an object of M_d bits describing a set of size
          Theta(B^{t-1}). Encoding is exact because the evaluation map is
          linear; completeness holds because a vanishing polynomial never
          rejects a true member; soundness fails only as false positives, whose
          rate is the measured filter power; transfer is basis-dependent and
          stated; the cost loss is that computing it needs an enumeration.
        predicted_gain: >-
          If the excess is nonzero with filter power p bits, an online per-trial
          charge falls by 2^p at a storage cost of M_d bits. THE PREDICTED VALUE
          OF p IS ZERO and no positive value is asserted anywhere.
      - transform: observable_fiber
        proposed_object: >-
          Hold excess_d = 0 fixed and vary the forgotten structure -- curve,
          basis, subspace, t -- to check the zero is uniform rather than an
          accident of one cell.
        predicted_gain: >-
          A closure that names where it stops, rather than a count of failed
          cells.
    quantifier_order: >-
      CLAIMED, in the direction the measurement can settle. FOR ALL n in the
      tested set, FOR ALL ordinary E over F_{2^n} in the tested sample, FOR ALL
      tested factor-base subspaces, FOR ALL field bases in {power, normal}, FOR
      ALL admitted d, excess_d = 0.
      NOT CLAIMED: FOR ALL n. Three values of n cannot establish a growth law
      and none is fitted. NOT CLAIMED: anything about compression by sketches
      other than low-degree boolean polynomials, about prime fields, or about
      the ECDLP.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Over the tested curves, subspaces, bases and degrees, the reachable
        chain-node set carries no low-degree boolean vanishing relations beyond
        the trivial count, so no degree-at-most-d filter of size M_d bits exists
        for it -- and, where a nonzero excess is found, only the part exceeding
        the curve-free image null is a statement about the curve."
        It can NEVER certify that no compressed representation exists, only that
        no low-degree polynomial one does, and nothing about untested n, prime
        fields, or the ECDLP.
      nearby_object_control: >-
        THE PLANTED-STRUCTURE POSITIVE, blocking: the factor-base subspace,
        excess_1 forced to exactly n - b, plus a random affine-image set of
        matched size and known relation count. An instrument that cannot detect
        known structure has no power and its zero on the real object means
        nothing. SECOND: the RATIONALITY LOCUS itself, whose low-degree
        vanishing dimension is measured and reported so any excess on W is
        checked against it rather than double-counted. THIRD, and added here:
        the CURVE-FREE IMAGE NULL.
    proof_obligations:
      - claim: 'dim L_d(W) = M_d - rank(Ev_d(W)) as an integer identity.'
        responsibility: correctness
      - claim: >-
          For a uniformly random subset of the rational-x locus of size at least
          M_d, excess_d = 0 with failure probability at most
          2^{-(|W| - M_d + 1)}.
        responsibility: baseline
      - claim: 'The t = 2 planted slice returns excess_1 = n - b exactly.'
        responsibility: baseline
      - claim: >-
          The curve-free image null is built with matched domain dimension,
          matched algebraic degree and matched cardinality, and its excess is
          reported beside every W excess.
        responsibility: scope
      - claim: 'A vanishing polynomial gives a one-sided filter with no false negatives.'
        responsibility: correctness
      - claim: >-
          Filter power p is MEASURED by sampling and quoted at the measured
          value, never inferred from s_d, and is capped by n - log2 of the
          MEASURED |W|.
        responsibility: size
      - claim: >-
          Peak resident memory is bounded by M_d squared over 8 bytes plus the
          bitmap of W.
        responsibility: memory
      - claim: >-
          Computing L_d costs an enumeration of W, so a positive result is a
          probe and never an algorithm.
        responsibility: interface
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        DEGREE PSEUDORANDOMNESS OF THE REACHABLE SET. For a uniformly random
        subset W' of the rational-x locus of F_{2^n} with |W'| >= M_d, the
        evaluation matrix Ev_d(W') has full column rank M_d, so
        dim L_d(W') = 0 with failure probability at most
        2^{-(|W'| - M_d + 1)}; and W behaves like such a set with respect to
        low-degree boolean conditions.
      random_model_justification: >-
        The rigorous half needs no assumption: dim L_d is the corank of a linear
        map, and for uniformly drawn points the probability that a fixed nonzero
        degree-at-most-d boolean function vanishes on all of them is bounded by
        a union bound over the function space, made explicit by the standard
        statement that a nonzero degree-d boolean function is nonzero on at
        least a 2^{-d} fraction of points. The classical distribution imitated
        is the uniform-random-set model for the image of an algebraic map. THE
        GAP IS EXACTLY WHAT IS MEASURED: W is the image of a low-degree map from
        a domain of (t-1)*b < n boolean coordinates, and such images are a
        classical source of low-degree relations. This heuristic is therefore
        the NULL HYPOTHESIS of the experiment rather than a supporting
        assumption.
      supporting_results:
        - ref: KN-FIND-a8990a
          provenance: internal
          claim: >-
            Theorem C -- on good factor-base tuples the summation polynomial
            splits completely with root set exactly the signed sums, verified on
            16107 of 16107 good samples -- which is what makes W an EXACT
            enumeration of the reachable chain-node coordinates rather than a
            subset.
          verified_by: >-
            RELAYED from IDEA-20260829-57b1eb, whose author states a full read
            on 2026-08-29. THIS COORDINATOR DID NOT OPEN KN-FIND-a8990a under
            TASK-20260904-9c61a9.
        - ref: EXP-SBRG-60c55e
          provenance: internal
          claim: >-
            Defines the chained representations, the boolean ring, the Weil
            descent construction, both field bases and both factor-base
            orientations, and the target-independent split; declares
            targets_per_cell 8, resource guards max_columns 200000 and
            max_rows 200000, and the degree-profile-matched control
            CTRL-SBRG-DEGREE-PROFILE.
          verified_by: >-
            coordinator, TASK-20260904-9c61a9 (targeted search of the
            specification; the quoted fields read on the returned lines)
      validation_experiment_ids:
        - EXP-PFDR-b4a4b6
      falsification_condition: >-
        excess_d >= 1 persisting across both field bases, at least three
        subspace seeds and at least three increasing n, AND exceeding the
        curve-free image null at matched parameters.
    - id: HEUR-002
      formal_statement: >-
        FILTER INDEPENDENCE. If s_d = dim L_d(W) is positive, the common zero
        set has size about 2^{n - s_d}, so the filter power is p = s_d bits, up
        to the floor p <= n - log2 |W| imposed by the fact that the zero set
        contains W.
      random_model_justification: >-
        Two rigorous ingredients: the zero set contains W, so
        p <= n - log2 |W| unconditionally; and a single nonzero degree-d boolean
        function has at least a 2^{-d} fraction of nonzeros, so one filter has
        at least 2^{-d} of a bit of power in the worst case. The classical
        statement imitated is the independence heuristic for the codimension of
        an intersection of hypersurfaces. THE GAP is that the s_d polynomials
        are the low-degree part of one ideal and are highly non-generic if they
        exist at all, so p is MEASURED by sampling and never inferred from s_d.
      supporting_results: []
      validation_experiment_ids:
        - EXP-PFDR-b4a4b6
      falsification_condition: >-
        A measured rejection rate materially below the independence prediction
        1 - 2^{-s_d}. The filters are dependent and p is quoted at the measured
        value only.
  structural_ingredients:
    - description: >-
        The exactness of the reachable-set enumeration on good factor-base
        tuples (complete splitting of the summation polynomial with root set the
        signed sums).
      citation: KN-FIND-a8990a
      provenance: internal
      verified_by: >-
        RELAYED from IDEA-20260829-57b1eb; not opened by this coordinator
      role: makes W an exact enumeration rather than a subset
    - description: >-
        First-fall-degree literature for descended summation-polynomial systems,
        the most likely external home for explanation E1.
      citation: >-
        Hodges, Petit and Schlather, First fall degree and Weil descent; Kosters
        and Yeo, Notes on summation polynomials, arXiv 1503.08001; Kousidis and
        Wiemers, On the first fall degree of summation polynomials; and
        Point Decomposition Problem in Binary Elliptic Curves, arXiv 1504.02347
      provenance: recalled
      verified_by: null
      role: >-
        the plausibility of E1 and the most likely location of prior art. No
        agent in this program has opened any of them under this task.
  reduction_chain:
    core_problem: >-
      No attack problem is reduced. The statement is a structural measurement of
      the low-degree algebraic content of a descended reachable set.
    corollaries: []
  predictions:
    - metric: >-
        P1 -- excess_d over the admitted grid. UNITS: dimension (integer)
      direction: different
      minimum_effect: >-
        PREDICTED EXACTLY 0 in every admitted cell. A confirmed positive
        requires excess_d >= 1 persisting across both bases, at least three
        subspace seeds and at least three increasing n. An excess in one basis
        only is recorded as a coordinate artifact.
    - metric: >-
        P2 -- excess_d on the t = 2 PLANTED POSITIVE (the factor-base subspace).
        UNITS: dimension (integer)
      direction: different
      minimum_effect: >-
        FORCED EXACTLY n - b, zero tolerance, in every cell. This is the
        known-magnitude defect that demonstrates the instrument has dynamic
        range; a miss halts the line and is an instrument defect, never a
        finding.
    - metric: >-
        P3 -- excess_d on the EXACT RANDOM NULL, a uniformly random subset of
        the rational-x locus at matched cardinality. UNITS: dimension (integer)
      direction: different
      minimum_effect: >-
        FORCED 0 in every cell. A nonzero value means the cardinality screen is
        violated or the rank routine is wrong, and voids the battery.
    - metric: >-
        P4 -- excess_d on the CURVE-FREE IMAGE NULL: the image of a random
        F_2-polynomial map of matched algebraic degree from a matched
        (t-1)*b-dimensional boolean domain into F_2^n, at matched cardinality.
        UNITS: dimension (integer)
      direction: different
      minimum_effect: >-
        MEASURED AND REPORTED BESIDE EVERY W VALUE, with NO predicted value
        committed. BLOCKING FOR ATTRIBUTION: if this null reproduces the excess
        found on W, the excess is a property of low-degree map images and
        nothing in the run may be described as a statement about Semaev
        structure, elliptic curves or the ECDLP. Only excess_d(W) minus
        excess_d(curve-free null) may carry a curve-specific reading.
    - metric: >-
        P5 -- excess_d on the RATIONALITY LOCUS itself. UNITS: dimension
        (integer)
      direction: different
      minimum_effect: >-
        MEASURED AND REPORTED with no prediction committed, and subtracted
        before any excess on W is attributed. Reporting an excess on W without
        this arm is prohibited.
    - metric: >-
        P6 -- filter power p = n - log2 |Z(L_d(W))|, estimated by uniform
        sampling with at least 10^6 samples per cell and a Clopper-Pearson
        interval. UNITS: bits
      direction: different
      minimum_effect: >-
        REPORTED ONLY WHEN excess_d >= 1 and only after P4 licenses a
        curve-specific reading. Required to exceed 1.0 bit to be of any use, and
        quoted against the ceiling n - log2 of the MEASURED |W| at that cell.
    - metric: >-
        P7 -- measured |W| against the predicted cardinality, with the
        deduplication collision count. UNITS: elements (integer)
      direction: different
      minimum_effect: >-
        REPORTED PER CELL so the cardinality screen can be audited after the
        fact and so the filter-power ceiling rests on a measured number.
    - metric: >-
        P8 -- peak resident memory against M_d squared over 8 bytes plus 2^n
        over 8 bytes. UNITS: bytes
      direction: different
      minimum_effect: >-
        The formula must predict the measured peak within 25 percent across the
        grid. A cell exceeding 1 GiB means the rank routine is materialising the
        evaluation matrix and the grid is not extended until it is fixed.
  test_boundary:
    instances:
      - 'ordinary binary curves over F_{2^n} for n in {16, 20, 24}, at least 8 curves'
      - 'the t = 2 planted-positive slice (the factor-base subspace)'
      - 'uniformly random subsets of the rational-x locus at matched cardinality'
      - 'the rationality locus itself'
      - 'CURVE-FREE: images of random low-degree F_2-maps at matched domain dimension, degree and cardinality'
    parameters:
      n: '{16, 20, 24}'
      d: '{2, 3, 4, 5} subject to the admissibility screen; n = 16 with d = 5 is INADMISSIBLE by arithmetic'
      t: '{3, 4}'
      field_basis: '{power, normal}'
      subspace_seeds: 'at least 3'
      screen: '|W| >= 10 * M_d, enforced before the run and audited after'
      instrument_memory: 'M_d squared over 8 bytes; 384 MB at the largest admitted cell (n = 24, d = 5)'
    implementation: >-
      W built by direct group arithmetic with no summation polynomial on that
      path; rank(Ev_d) computed by STREAMING the |W| evaluation columns against
      an M_d by M_d echelon carrier, so the evaluation matrix is never
      materialised. No Macaulay matrix and no Groebner basis is built anywhere.
    budget:
      wall_clock_seconds_per_run: 1800
      total_cpu_hours: 24
      maximum_memory_gb: 8
      maximum_runs: 320
  falsification_conditions:
    - >-
      F1 INSTRUMENT DEAD. The t = 2 planted positive does not return
      excess_1 = n - b exactly. Nothing is reported and no zero from the
      instrument means anything.
    - >-
      F2 BATTERY VOID. The exact random null returns nonzero excess. Either the
      cardinality screen is violated or the rank routine is wrong.
    - >-
      F3 E2 FALSIFIED WITH ATTRIBUTION. excess_d >= 1 persisting across both
      bases, three subspace seeds and three increasing n, AND exceeding the
      curve-free image null. A target-independent low-degree dependency exists
      and its filter power becomes the priority measurement.
    - >-
      F4 ATTRIBUTION DENIED. excess_d >= 1 but the CURVE-FREE IMAGE NULL
      reproduces it at matched parameters. The finding is about images of
      low-degree maps and NOT about elliptic curves; every artifact must say so
      in its own words and no ECDLP or Semaev language is permitted.
    - >-
      F5 COORDINATE ARTIFACT. excess_d >= 1 in one basis only. Recorded as such;
      the basis dependence of boolean degree under Weil descent is itself
      reportable and this program has never measured it.
    - >-
      F6 KNOWN DEPENDENCY REDISCOVERED. The rationality-locus arm accounts for
      the excess found on W. An instrument calibration, nothing more.
    - >-
      F7 MEMORY MODEL WRONG. Peak resident memory exceeds the M_d squared
      formula by more than 25 percent. The rank routine is materialising the
      evaluation matrix; the grid is not extended until it is fixed. This is an
      INFRASTRUCTURE finding and never negative mathematical evidence.
    - >-
      F8 E2 HOLDS. excess_d = 0 everywhere on the admitted grid. The low-degree
      compressed-filter class is closed over the tested cells with a named
      obstruction, an exact argument and forward guidance naming the surviving
      classes.
  interpretation_limits:
    - >-
      A STRUCTURE PROBE, NOT AN ALGORITHM AND NOT AN ATTACK. No exponent is
      claimed in either direction and a positive result carries an explicitly
      named remaining obligation -- closed-form derivation of the filters --
      before it could become an algorithm.
    - >-
      Scoped to ordinary binary curves, Weil descent, chained S_3
      representations, subspace factor bases, boolean polynomial degree, and
      n in {16, 20, 24}. It does not transfer to prime fields, to non-subspace
      factor bases, to other notions of compression, or to cryptographic scale.
    - >-
      A negative closes the LOW-DEGREE POLYNOMIAL compression class over the
      tested cells only, and is written with its named obstruction, argument and
      forward guidance rather than as an exhaustion claim.
    - >-
      Any excess that the curve-free image null reproduces is NOT a statement
      about elliptic curves, and the design is arranged so that this cannot be
      discovered after the fact.
    - >-
      NOVELTY IS NOT ADJUDICATED. The first-fall papers and arXiv 1504.02347 are
      the most likely locations of prior art and none was opened by any agent
      under this task.
