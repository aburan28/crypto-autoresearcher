  statement: >-
    The recurrence a, b goes to 3a+4b, 2a+3b from (3, 2) produces the
    six pairs (3, 2), (17, 12), (99, 70), (577, 408), (3363, 2378)
    and (19601, 13860). The integers 2a-1 are 5, 33, 197, 1153, 6725
    and 39201. The integers 2a are one larger. The counts of positive
    multiples of 131 at most those floors are 0, 0, 1, 8, 51 and 299.
    In particular 131*51 = 6681 is at most 6725, and 131*52 = 6812 is
    strictly larger, and 131*299 = 39169 is at most 39201, and
    131*300 = 39300 is strictly larger. The g = 5 head product
    31*163*455*643 equals 1478330945, which is strictly below
    1480000000 by 1669055. The g = 6 product
    37*243*907*1923*2175 equals 34107809623425, which is strictly
    above 34100000000000 and strictly below 34200000000000. Of the
    eight multiples of 131 at most 1153, exactly three are at most
    475. The written gaps 215-211 and 1645-1624 are 4 and 21.
    181 squared is strictly below 32768, and 182 squared is strictly
    above it. 512 equals 2^9.
  mechanism: >-
    The proposal prices a census by these ceilings and box sizes.
    This contract checks the integers. It does not enumerate classes.
