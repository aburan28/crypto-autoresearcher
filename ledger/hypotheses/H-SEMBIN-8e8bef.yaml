# Approved DEC-20261002-5a576d.
#
# Unlocks GOAL-SEMBIN-5078bc next_action item (3) (GF(2) degree-4 closure
# predicate) and is the prerequisite for IDEA-20260913-9ba7fc's Assumption-1
# boundary surface. ZERO RUNS in this design packet. No Magma/Sage/AUXIN/
# Bedrock as success path. Claim tier: control / measurement. No curve attack.
# =============================================================================
hypothesis:
  id: H-SEMBIN-8e8bef
  question_id: RQ-SEMBIN-fa2e3f
  question_ids:
    - RQ-SEMBIN-fa2e3f
    - RQ-SEMBIN-ade131
    - RQ-DREG-001
  source_idea: IDEA-20260913-449d2b
  experiment_id: EXP-SEMBIN-79a02d
  goal_id: GOAL-SEMBIN-5078bc
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-5a576d
  status: approved
  proposed_by: coordinator
  title: >-
    Four Semaev/DREG degree quantities are separated by construction on the
    Weil-descended chained S_3 system: productive d_F4, first-fall d_ff,
    SOLV4 (degree-4 capped GF(2) closure predicate), and Macaulay-rank-vs-nrows
    — deciding whether GOAL-DREG-001's numbers bear on Assumption 1 at all

  statement: >-
    CLAIM (control / measurement; NO ATTACK). Scope: Semaev 2015 Assumption 1
    ONLY (KN-LIT-fa346d Section 4.4–4.5); nothing about Assumption 2, no
    deployed curve, no exponent. Four independently falsifiable parts on the
    identical Weil-descended chained S_3 Boolean system family GOAL-DREG-001
    and EXP-DREG-001 already instrument. (C1) Semaev's reported d_F4 = 4 is
    the MAXIMUM OVER PRODUCTIVE F4 steps only; satisfiable instances exhibit
    trailing raw step degrees 5/6/7 with "No pairs to reduce" (paper Section
    4.5.1). Any reproduction reporting RAW max step degree will report ≥5 on
    satisfiable instances and appear to contradict Assumption 1 while measuring
    a different statistic. (C1b) The published Semaev-4 / Kosters-5
    "contradiction" (KN-LIT-e77232) is consistent with productive-vs-raw
    counting and is independently testable by a step-degree TRACE split into
    productive and no-pairs-to-reduce steps. (C2) SOLV4(I) — the degree-4
    capped GF(2) closure predicate of IDEA-20260913-449d2b — is an
    algorithm-independent surrogate: echelonize span{m·f : deg(m·f)≤4} to
    fixed point R_4; SOLV4 holds iff R_4 determines V(I) (1∈R_4 when UNSAT;
    dim(degree-≤4 quotient) = independently enumerated solution count when
    SAT). Predicted chain: d_ff ≤ d_solv ≤ d_F4-productive. (C3) GOAL-DREG-001's
    instrument (src/h012c_block_m4ri.py) computes GF(2) Macaulay rank and
    deficit against nrows, outputs no degree, and never reaches rank=nrows at
    D≥4 on measured cells (EXP-DREG-001/analysis.md; KN-FIND-006 trivial
    syzygies). That quantity is therefore NOT Semaev's d_F4 by construction.
    CLAIM TIER: control / measurement. Outcomes decide whether DREG numbers
    bear on Assumption 1 — they do not assert Assumption 1 true or false at
    cryptographic scale.

  mechanism: >-
    OBJECT FRAME. Representation R1: Boolean coordinates of the Weil-descended
    chained S_3 system (eq. (5) of Semaev 2015) over F_2. Tracked objects: four
    named degree/rank quantities on the SAME ideal I — (i) productive max
    step-degree d_F4-prod, (ii) first-fall d_ff, (iii) SOLV4 as a span/rank
    condition on the degree-≤4 truncation, (iv) Macaulay rank(M_D) vs nrows at
    D∈{4,5}. Sigma for SOLV4 = {multiplication by variables inside B_{≤4},
    F_2-linear combination, re-echelon}. Trichotomy: COORDINATE-DEPENDENT in
    the weak sense only (Boolean ring / monomial-order for step-degree traces;
    SOLV4 itself is order-independent by construction). Lossy projection
    I ↦ (d_ff, SOLV4, rank/nrows, productive-vs-raw step trace) is
    Sigma-compatible and genuinely lossy. WHAT IS NEW: separating four
    quantities that the literature and KN-OPEN-d218ec conflate, with competing
    reconciliations for Semaev/Kosters 4-vs-5 and an explicit prediction that
    DREG's rank=nrows operationalization is unreachable at D≥4.

  assumptions:
    - >-
      Frozen Semaev 2015 text at inputs/SEMAEV-2015-310/ is the sole primary
      source for d_F4 / d_ff definitions and Section 4.5.1 trailing-step claim.
    - >-
      EXP-DREG-001 / src/h012c_block_m4ri.py comparison target is nrows (to be
      confirmed verbatim in Stage 0); if it is instead degree-exactly-D
      monomial count, C3's "unreachable by construction" clause is refuted.
    - >-
      SOLV4 is decided by two independent GF(2) rank routines on the identical
      matrix; disagreement invalidates the cell (never averaged).
    - >-
      Magma/Sage are NOT the success path. Stage-3 step-degree traces use a
      vendored open-source engine if present; otherwise O-IMPEDIMENT. Stages
      0–2 do not require Magma.
    - >-
      Amazon Bedrock prohibited. No AUXIN. Satisfiability must be stratified
      (planted vs uniform-z) with independently enumerated solution counts.
    - >-
      Resource exhaustion / timeout is failed_infrastructure / O-IMPEDIMENT,
      never negative evidence against C1–C4 or Assumption 1 (AGENTS.md rule 5).

  proof_search_map:
    bottleneck: >-
      Whether GOAL-DREG-001's Macaulay-rank measurements bear on Semaev
      Assumption 1 at all — i.e. whether the four named degree/rank quantities
      coincide on the identical system — has never been decided by construction
      on this program's instruments.
    baseline_embedding:
      parameter_slice: >-
        EXP-DREG-001 cells at n∈{12,15} (and n=12 m=t=3 k=4 builder-equality
        cell); Semaev Table-2 scale cells only if Stage-3 engine available.
        Same generators as eq. (5) descent.
      reproduction_check: >-
        Stage 0: definition table + verbatim DREG nrows citation. Stage 1:
        coefficient-wise builder equality at n=12,m=t=3,k=4. Stage 2: SOLV4
        + d_ff + rank/nrows on calibration and known-false arms with dual
        GF(2) rank. Mismatch → O-BUILDER-MISMATCH / O-C3-FALSE / O-ARTIFACT.
    observation_collision:
      observable: >-
        (d_ff, SOLV4 verdict, rank(M_D)/nrows, productive vs raw max
        step-degree) on identical I.
      distinct_preimage_search: >-
        Separated by: null arm; known-false off-diagonal family; planted vs
        uniform-z satisfiability stratification; dual GF(2) rank; optional
        monomial-order/strategy control if Stage-3 engine present.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: SOLV4 degree-4 capped GF(2) closure predicate
        predicted_gain: >-
          Algorithm-independent cost-bearing reading of Assumption 1 at
          reachable cells without Magma; unlocks IDEA-20260913-9ba7fc.
    quantifier_order: >-
      EXISTS cells in the DREG-reachable band such that the four quantities
      disagree (C1/C3), AND FORALL calibration cells SOLV4 agrees with
      independent enumeration (C2), AND FORALL measured (n,D≥4) cells
      rank < nrows (C3). NOT CLAIMED: Assumption 1 false at cryptographic
      scale; any deployed-curve statement; Magma bit-exact reproduction.
    method_ceiling:
      strongest_certifiable_claim: >-
        On this program's instruments the four quantities are separated by
        construction, so GOAL-DREG-001's rank/deficit numbers do not by
        themselves support or refute Semaev Assumption 1; SOLV4 is the
        transferable cost-bearing surrogate. Never certifies a curve break.
      nearby_object_control: >-
        Null arm; known-false objects where SOLV4 must refuse or disagree with
        a collapsed identification; dual GF(2) rank; satisfiability
        stratification; Magma-as-success-path forbidden.
    proof_obligations:
      - claim: Stage-0 definition table with explicit quantifiers for all four degrees
        responsibility: baseline
      - claim: Verbatim DREG rank-comparison target (file:line) is nrows
        responsibility: baseline
      - claim: Builder equality at n=12,m=t=3,k=4
        responsibility: interface
      - claim: SOLV4 agrees with enumeration on every calibration cell and both known-false arms
        responsibility: correctness
      - claim: rank < nrows at every measured (n,D≥4) cell
        responsibility: size
      - claim: Exactly one O-* label in RESULTS.md
        responsibility: scope

  asymptotic_claim: null

  heuristic_assumptions:
    - id: H-449d2b-C1
      formal_statement: >-
        On satisfiable instances of the descended chained S_3 system at cells
        Semaev reports as d_F4=4, RAW max F4 step degree exceeds 4 on ≥50% of
        instances under at least one open-source engine when a step-degree
        TRACE separates productive from no-pairs-to-reduce steps; the
        unsatisfiable stratum stays at raw max 4.
      random_model_justification: >-
        Semaev Section 4.5.1 states this behaviour for his own MAGMA runs;
        the claim is that the productive/raw split — not SAT-vs-UNSAT alone —
        reconciles the published 4-vs-5 reports.
      supporting_results:
        - KN-LIT-fa346d Section 4.5.1 (retrieved; frozen paper).
        - KN-LIT-e77232 Semaev/Kosters exchange (internal).
      provenance: internal
      falsification_condition: >-
        Open-source engine reports raw max step degree 4 with no trailing
        5/6/7 on satisfiable instances → C1 false for that engine → O-C1-FALSE.
      validation_plan: >-
        Stage 3 when engine present; else O-IMPEDIMENT and C1 left undecided
        (Stages 0–2 still decide C2/C3).
    - id: H-449d2b-C2
      formal_statement: >-
        SOLV4(I) is decided exactly by GF(2) degree-4 capped closure and agrees
        with independently enumerated solution counts on every calibration cell
        and both known-false arms; dual rank routines agree.
      random_model_justification: >-
        SOLV4 is a deterministic span/rank condition; agreement with enumeration
        is a correctness gate, not a probabilistic claim.
      supporting_results:
        - IDEA-20260913-449d2b claim (C2).
        - KN-FIND-006 degree-4 trivial syzygies (internal).
      provenance: internal
      falsification_condition: >-
        SOLV4 disagrees with enumeration on a calibration cell, or dual GF(2)
        ranks disagree → O-C2-FALSE / O-ARTIFACT.
      validation_plan: Stage 2 dual-rank SOLV4 on calibration + known-false arms.
    - id: H-449d2b-C3
      formal_statement: >-
        At every measured (n, D≥4) cell on the DREG instrument, rank(M_D) < nrows,
        so the code's "full rank" operationalization of d_reg is unreachable at
        D≥4 by construction (trivial degree-4 syzygies), and therefore is not
        Semaev's d_F4.
      random_model_justification: >-
        KN-FIND-006: generic degree-4 syzygies are Frobenius + Koszul; exact
        count forces rank < nrows independent of the instance content once
        generators are present.
      supporting_results:
        - KN-FIND-006 (internal).
        - EXP-DREG-001/analysis.md rank < nrows at n=15,18 D=5 (internal).
      provenance: internal
      falsification_condition: >-
        rank = nrows at any measured (n,D≥4) cell, OR Stage-0 code citation
        shows comparison against degree-exactly-D monomial count rather than
        nrows → O-C3-FALSE.
      validation_plan: Stage 0 code citation + Stage 2 rank/nrows census.

  predictions:
    - claim: H-449d2b-C1 (productive vs raw)
      metric: raw_max_step_degree vs productive_max_step_degree, stratified by SAT/UNSAT
      minimum_effect: >-
        SAT stratum raw max ≥5 on ≥50% when Stage 3 runs; UNSAT raw max = 4.
        Stage-3 impediment leaves C1 undecided without blocking C2/C3.
      cites: H-449d2b-C1
    - claim: H-449d2b-C2 (SOLV4 correctness)
      metric: SOLV4 verdict vs independent solution count; dual GF(2) rank agreement
      minimum_effect: exact agreement on every calibration and known-false cell
      cites: H-449d2b-C2
    - claim: H-449d2b-C3 (DREG ≠ d_F4)
      metric: rank(M_D) / nrows at D∈{4,5}
      minimum_effect: rank < nrows on every measured cell; Stage-0 confirms nrows target
      cites: H-449d2b-C3
    - claim: H-449d2b-chain
      metric: d_ff, SOLV4-implied d_solv, productive d_F4 when available
      minimum_effect: d_ff ≤ d_solv ≤ d_F4-productive whenever all three are observed

  test_boundary: >-
    Stages 0–2: DREG-reachable toy cells n∈{12,15} (primary), builder-equality
    cell n=12 m=t=3 k=4; GF(2) M4RI / existing src tools; dual independent rank;
    planted and uniform-z strata with independent enumeration. Stage 3:
    step-degree TRACE only if a vendored open-source F4/XL-style engine is
    importable; else O-IMPEDIMENT. No Magma/Sage/AUXIN/Bedrock. No deployed-
    degree Semaev solve as a claimed result. Transfer of "DREG does not bear
    on Assumption 1" beyond measured cells is labelled scope-limited.

  falsification_conditions:
    - >-
      All four degrees coincide on every reproduced cell including the
      off-diagonal known-false family → C1–C4 die together → O-COINCIDE.
    - >-
      DREG code compares rank against degree-exactly-D monomial count, not
      nrows → C3 unreachable-by-construction clause false → O-C3-FALSE.
    - >-
      Open-source engine reports raw max step degree 4 with no trailing 5/6/7
      on satisfiable instances → C1 false for that engine → O-C1-FALSE.
    - >-
      No SAT/UNSAT split in raw max step degree when Stage 3 runs → C1b false
      → O-C1b-FALSE.
    - >-
      Builder generators are not the descent of Semaev eq. (5) → reconciliation
      void as posed → O-BUILDER-MISMATCH.
    - >-
      SOLV4 false at a cell the paper reports as d_F4=4 under every strategy
      and both strata → Assumption 1 fails in cost-bearing reading at that
      cell → O-A1-COST-FAIL (escalate review-breakthrough; not a summary claim).
    - >-
      d_ff on rebuilt generators below 4 → contradicts Semaev Section 4.5 proof
      → O-DFF-ANOMALY (escalate).

  distinguishable_outcomes:
    - id: O-SEPARATED
      meaning: >-
        C2 and C3 hold; Stage-0 definitions frozen; builder equality passes;
        four quantities disagree as predicted; Stage 3 either supports C1/C1b
        or records O-IMPEDIMENT without blocking Stages 0–2. DREG numbers do
        not by themselves bear on Assumption 1.
    - id: O-COINCIDE
      meaning: All four quantities coincide including known-false family; separation claim dies.
    - id: O-C1-FALSE
      meaning: Stage-3 engine shows no trailing raw steps on SAT instances.
    - id: O-C1b-FALSE
      meaning: No SAT/UNSAT raw-max split when Stage 3 runs.
    - id: O-C2-FALSE
      meaning: SOLV4 disagrees with enumeration on a calibration/known-false cell.
    - id: O-C3-FALSE
      meaning: rank=nrows at D≥4, or Stage-0 shows non-nrows comparison target.
    - id: O-BUILDER-MISMATCH
      meaning: Stage-1 builder equality fails; stop before later comparisons.
    - id: O-A1-COST-FAIL
      meaning: SOLV4 false at a paper d_F4=4 cell under all controls; escalate.
    - id: O-DFF-ANOMALY
      meaning: Rebuilt d_ff < 4; escalate.
    - id: O-ARTIFACT
      meaning: Dual-rank disagreement, unstratified pooling, or verification failure.
    - id: O-IMPEDIMENT
      meaning: >-
        Stage-3 engine unavailable, or RSS/wall-clock cap; never negative
        mathematical evidence against C1–C4.

  status_note: >-
    Approved under standing user authorization for protocol completeness.
    Approval does not assert the hypothesis is true. Idea status left proposed.
    Exactly one next_action after DEC-20261002-5a576d: /run EXP-SEMBIN-79a02d.

