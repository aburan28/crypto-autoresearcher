hypothesis:
  id: H-RELN-66c079
  question_id: RQ-RELN-001
  goal_id: GOAL-RELN-001
  idea_id: IDEA-20260805-a25f11

  statement: >-
    SCOPE: prime-field Semaev decomposition over a +/- symmetric factor base
    W = V union -V of size 2B on deterministically generated ordinary curves at
    field_bits in {8, 10, 12, 16}, m in {2, 3}, with a Z/N control group.
    CLAIM TIER toy. NO ATTACK, NO EXPONENT MOVED.
    Claim, in three parts. (1) CEILING: at m = 2 exactly B of the
    C(2B+1,2) = 2B^2 + B multisets from W consist of a point and its negative and
    sum to the identity, so no factor base of size B can cover more than 2B^2 + 1
    targets and coverage/mu <= (2B^2+1)/(2B^2+B); at m = 3 exactly 2B^2 multisets
    contain a +/- pair and land on only 2B distinct targets. (2) THRESHOLD: a
    collision-minimising base beats a matched uniformly drawn base only when
    2N(B-1) < (2B^2+B)^2, i.e. essentially B > (N/2)^{1/3}; BELOW that threshold
    the best conceivable factor base is STRICTLY WORSE than a random one, because
    the negation-forced waste exceeds the random-collision loss it removes.
    (3) BOUND: the achievable coverage gain over a matched random base at this
    goal's own sixteen m = 2 ladder cells lies in [0.968, 1.525], against a global
    ceiling of max over mu of min(1,mu)/(1 - e^{-mu}) = 1.58198 attained only at
    mu = 1. The operational consequence, which is the falsifiable content: the mean
    mu = C(2B+m-1,m)/N is forced by (B, m, N) alone, so the only free coordinate of
    the P(decomp) curve this goal is chartered to measure is the collision deficit
    D = mu - coverage, and that deficit is exactly the additive energy of the
    factor base seen inside E(F_p). A single arm exceeding its derived ceiling, or
    a collision-minimising base beating random below the threshold, refutes this.

  mechanism: >-
    DERIVED IN-REPO from one imported identity. Every count below is integer-exact
    and independently checkable by enumeration.

    IMPORTED. KN-FIND-007 (internal, established, derivation): every size-m
    multiset from a set sums to exactly one group element, hence
    sum_g c(g) = C(size + m - 1, m) and the mean per target is that over N; and
    coverage <= min(1, mu) with equality iff no target is hit twice. Applied to
    W = V union -V, |W| = 2B (the set the summation polynomial actually searches;
    see H-RELN-96e3ba), this gives mu(B,m) = C(2B+m-1, m)/N for EVERY base of size
    B on EVERY curve of order N.

    THE FORCED FLOOR. W = -W is not an artifact of encoding; it is what "up to
    signs" means in the decomposition condition. It forces collisions that no
    design removes.
      m = 2. The multisets {P_i, -P_i}, i = 1..B, all sum to O. B multisets, one
      target. Every other multiset may in principle hit a distinct target, so
      distinct targets <= (2B^2 + B) - B + 1 = 2B^2 + 1 and
          coverage <= (2B^2 + 1)/N = mu * (2B^2+1)/(2B^2+B) ~ mu * (1 - 1/(2B)).
      m = 3. A size-3 multiset contains at most one +/- pair; choosing the pair
      (B ways) and the third element (2B ways) gives exactly 2B^2 such multisets,
      each summing to its third element, hence landing on exactly the 2B elements
      of W. Distinct targets <= C(2B+2,3) - 2B^2 + 2B.
      General m. Multisets containing a +/- pair biject with (pair, size-(m-2)
      multiset) and re-cover the (m-2)-level image; the wasted fraction is
      ~ m(m-1)/(4B). The floor is therefore a 1/B effect: real at toy B, decaying
      asymptotically, and it must never be extrapolated as if it were not.

    THE THRESHOLD. Write mu = (2B^2+B)/N at m = 2. A matched uniformly drawn base
    has, under balls-in-bins, coverage 1 - e^{-mu} = mu - mu^2/2 + O(mu^3). The
    best possible base has coverage mu(1 - (B-1)/(2B^2+B)). Best beats random iff
        mu (B-1)/(2B^2+B) < mu^2/2
      <=> 2N(B-1) < (2B^2+B)^2  <=>  B > roughly (N/2)^{1/3}.
    This reproduces the SIGN of the computed maximum gain at all sixteen m = 2
    ladder cells with no fitted parameter: at bits = 16 the threshold is B ~ 25.4
    and the gains are 0.968, 0.989 (B = 12, 20; below) then 1.017, 1.062 (B = 32,
    48; above); at bits = 12 the threshold is B ~ 10.1 and the gains are 0.980
    (B = 8) then 1.067, 1.185, 1.414. Sixteen sign predictions, sixteen matches,
    zero free parameters -- which is why the threshold is stated as a prediction
    rather than a fit, and why a single sign mismatch refutes it.

    WHAT THE DEFICIT IS. At m = 2, sum_g c_W(g)^2 is the additive energy of W up to
    diagonal terms, and coverage = mu - (mass at c >= 2). So factor-base geometry
    enters P(decomp) through additive energy and through nothing else, at fixed
    (B, m, N). That is the constructive content: it names the single channel and
    bounds its width.

    WHY THE OPTIMUM IS AN INSTRUMENT, NOT AN ATTACK -- stated in advance so it
    cannot be discovered in review. Minimising the energy of a SYMMETRIC set means
    the exponent set S must have distinct sums AND distinct differences AND avoid
    s_i + s_j = s_k - s_l, i.e. S must be a B_3 (Sidon-of-order-3) set, not merely
    B_2. Bose-Chowla is the standard B_3 construction (RECALLED, UNVERIFIED as to
    any specific source; DEC-20260724-020's red team is RELAYED as having reached a
    coverage ratio of 1.1071 with one). But a B_3 base is built by exponentiating
    known integers, so its discrete logarithms are known, and then a single
    decomposition of R = aP + bQ yields k directly -- the whole index calculus
    collapses to a one-relation search, whose cost obeys the AM-GM two-table bound
    |A| + |B| >= 2 sqrt(N) that this program recorded as R10. The low-energy
    optimum is therefore a measuring rod for the width of the deficit channel and
    is not, and must never be written up as, a route to an attack.

    WHAT THIS DOES NOT SAY. It does not say structured factor bases cannot help
    index calculus -- that sentence is on DEC-20260724-020's forbidden list and is
    not written here. It bounds the COVERAGE channel at fixed B and m. Relation
    rank and independence, which DEC-20260724-020's scope (RELAYED) explicitly
    excluded, are untouched and are named as the successor.

  assumptions:
    - >-
      The signed convention W = V union -V. If decomposition is unsigned, the
      negation floor and the threshold both vanish and only the conservation half
      survives. The paired experiment tests the convention first.
    - >-
      The one-relation-per-target harvest convention. Under harvest-all the
      relevant quantity is the mean, which is exactly geometry-invariant, and the
      deficit channel is worth nothing at all (KN-FIND-007 says so). Which
      convention GOAL-ICEX-001 consumes is not settled here; both are reported.
    - >-
      Curves whose group is cyclic or near-cyclic, so that "Sidon set in the group"
      is meaningful. Excluded curves are recorded, not silently dropped.
    - >-
      No 2-torsion x-coordinates in V and no small-cofactor pathology; both are
      checked rather than assumed.

  proof_search_map:
    bottleneck: >-
      The step at which factor-base design can influence P(decomp) at all. If the
      mean is forced and the deficit is bounded, then every proposal in the
      factor-base-design family is bounded by the same number, and the bottleneck
      of the whole family is located in one quantity: the additive energy of W.
    baseline_embedding:
      parameter_slice: >-
        m = 1. Coverage = 2B/N exactly for every base, deficit identically 0, and
        the ceiling and the random value coincide -- so the entire geometry channel
        is provably empty at m = 1. This is the exact boundary at which the claimed
        effect must vanish, and it is the cheapest reproduction check available.
        Second slice: B = 1, where C(2B+m-1,m) = C(m+1,m) = m+1 and the counts can
        be verified by hand.
      reproduction_check: >-
        Symbolic plus a frozen fixture: at m = 1 every arm of the graded ladder must
        return identical coverage 2B/N. If arms differ at m = 1, the enumerator is
        reading something other than the multiset structure and no m >= 2 result may
        be read.
    observation_collision:
      observable: >-
        The multiplicity histogram of c_W, of which p_exist is one coordinate.
      distinct_preimage_search: >-
        Performed, and the result is the reason the hypothesis exists. In the FIRST
        MOMENT the collision is total and provable: the uniformly drawn base and the
        small-multiples base V = {x(iG)} have IDENTICAL mu by conservation, at every
        B, on every curve. In the SECOND moment they do not collide -- KN-FIND-007
        records coverage ratios of ~1.0 and 0.0021 respectively at N ~ 2^18. So the
        observable separates the pair only if the deficit is read. Any protocol that
        reads only the mean has an observable with a full-space fibre.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace p_exist by the pair (mu forced, D = mu - coverage measured), and
          report D normalised by its derived floor and ceiling.
        predicted_gain: >-
          The reported quantity acquires non-zero within-stratum spread -- three
          decades, per the corpus's own measured endpoints -- where the mean has
          exactly zero.
      - transform: specialization_pack
        proposed_object: >-
          The graded family V_k = union of k arithmetic progressions of length B/k
          in the exponent, k = 1, 2, 4, 8, B, plus a B_3 arm: a one-parameter
          interpolation from maximum to minimum additive energy at fixed (B, m, N).
        predicted_gain: >-
          Localises any failure to a specific k instead of returning "it did not
          work", and turns a two-point comparison into a monotonicity test.
      - transform: boundary_lift
        proposed_object: >-
          Push B across the derived threshold (N/2)^{1/3} at fixed N, which the
          protocol's bits = 12 and bits = 16 ladders already straddle.
        predicted_gain: >-
          A SIGN CHANGE in the geometry effect, which is a far stronger signature
          than a magnitude and cannot be produced by a monotone artifact.
    quantifier_order: >-
      The family's implicit claim: THERE EXISTS a factor-base geometry such that
      FOR ALL sizes B the decomposition probability exceeds that of a random base
      of the same size. The counter-statement proved here: FOR ALL geometries and
      FOR ALL B < (N/2)^{1/3}, coverage is at most (2B^2+1)/N which is BELOW the
      random-base value -- so the existential cannot be satisfied uniformly in B,
      and any geometry claim must carry its B-range. The corresponding audit of the
      prior art is that DEC-20260804-2bfc30 (RELAYED: three geometries, one scale,
      no growth clause) tested a single B-regime and therefore could not have seen
      the sign change either way.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that at the tested toy cells, under the signed convention and the
        one-relation-per-target harvest rule, coverage is bounded by the derived
        ceiling and the achievable gain over a matched random base lies in the
        derived interval. It CANNOT certify that structured factor bases are
        useless, that the coverage channel is closed, that relation rank behaves the
        same way, or anything about crypto-scale N. Those sentences are forbidden
        here by name.
      nearby_object_control: >-
        Two are required. (a) The Z/N group with the curve removed: every forced
        value must be identical, because none uses the curve; a difference is an
        artifact of the point arithmetic. (b) The object where the hoped-for
        conclusion is known FALSE -- an extension field F_{q^n} with a subfield
        factor base, where structured factor bases demonstrably do help and index
        calculus is subexponential (KN-TECH-003). The derivation must explain why
        it does not also forbid that, and the answer must be the one it actually
        gives: there the factor base is not a size-B subset of a group of order N
        with forced +/- symmetry but a subfield of relative size, so the
        conservation count is over a different index. A derivation that cannot
        articulate that difference has not found the load-bearing structure.
    proof_obligations:
      - claim: "Exactly B multisets sum to O at m = 2; exactly 2B^2 contain a pair at m = 3, landing on 2B targets."
        responsibility: correctness
      - claim: "coverage <= (2B^2+1)/N at m = 2, for every base of size B."
        responsibility: correctness
      - claim: "Sign of the max gain flips at 2N(B-1) = (2B^2+B)^2."
        responsibility: strictness
      - claim: "m = 1 slice: deficit identically 0, all arms equal."
        responsibility: baseline
      - claim: "The derivation does not forbid the extension-field case where structured bases do help."
        responsibility: scope
      - claim: "The low-energy optimum needs known discrete logarithms and is bounded by AM-GM; it is not an attack."
        responsibility: feasibility

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Null on purpose. This hypothesis moves no exponent; it BOUNDS A CONSTANT, and
    the constant is currently unbounded in this program's records. Stated against
    docs/target-result-profile.md's exponent-first bias: this is a ceiling result
    on a design lane, and its value is that it closes the lane in scope with a
    number rather than with a tally, and names relation rank as the successor.

  heuristic_assumptions:
    - id: HEUR-RELN-B1
      formal_statement: >-
        The conservation identity, the m = 2 identity count B, the m = 3 pair count
        2B^2 and the ceilings derived from them are unconditional counting
        statements.
      random_model_justification: not applicable
      supporting_results:
        - "KN-FIND-007 (internal, established, derivation)."
      validation_experiment_ids: [EXP-RELN-0a979f]
      falsification_condition: Any enumerated count differing from its forced integer value.
    - id: HEUR-RELN-B2
      formal_statement: >-
        For a uniformly drawn base on a toy curve of order N, c_W behaves like a
        balls-in-bins allocation of C(2B+m-1,m) balls into N bins, so
        coverage = 1 - e^{-mu} + o(1).
      random_model_justification: >-
        Standard for a sumset with no additive structure. It is load-bearing only
        for the THRESHOLD (which compares an exact ceiling against this baseline),
        and its known failure direction is favourable: additive structure only
        decreases coverage, so the threshold as derived is conservative.
      supporting_results:
        - "KN-FIND-007 consequence 3 bounds it above without heuristic."
      validation_experiment_ids: [EXP-RELN-0a979f]
      falsification_condition: >-
        Uniform-arm coverage outside its Clopper-Pearson interval at three or more
        cells.
    - id: HEUR-RELN-B3
      formal_statement: >-
        A Bose-Chowla B_3 exponent set attains, up to the forced floor, the minimum
        additive energy available at size B in Z/N.
      random_model_justification: >-
        B_3 sets have all three-term sums distinct, which is the condition the
        symmetric point set imposes. RECALLED, UNVERIFIED: no source for the
        Bose-Chowla construction or its extremality has been read in this session,
        and verifying it is a stage of the experiment, not an authority to cite.
      supporting_results:
        - "RELAYED, not reproduced: DEC-20260724-020's red team reported coverage ratio 1.1071 with a Bose-Chowla B_3 base."
      validation_experiment_ids: [EXP-RELN-0a979f]
      falsification_condition: >-
        A constructed base with measured additive energy below the B_3 arm at the
        same B.

  structural_ingredients:
    - description: Multiset conservation and the coverage ceiling min(1, mu).
      citation: "KN-FIND-007 (internal finding, read in this repository)"
      role: exact mean and ceiling
    - description: Summation-polynomial degree and the "up to signs" decomposition condition.
      citation: "KN-TECH-002 (internal technique, read in this repository)"
      role: justifies the symmetric searched set W
    - description: Standing position that prime-field point decomposition is uncompetitive with rho.
      citation: "KN-TECH-003 (internal technique, read in this repository)"
      role: baseline against which no improvement is claimed
    - description: Bose-Chowla B_3 (Sidon-of-order-3) sets and their extremal size.
      citation: "RECALLED, UNVERIFIED. No source read. To be checked as an experiment stage; a greedy B_3 construction is used as the fallback so the arm does not depend on the recollection."
      role: minimum-energy arm of the graded ladder
    - description: The AM-GM two-table lower bound |A| + |B| >= 2 sqrt(N).
      citation: "Internal, RELAYED via the 2026-08-05 scouting brief as this program's result R10. Not re-derived here beyond the AM-GM step, which is one line."
      role: reason the low-energy optimum is an instrument and not an attack

  reduction_chain:
    core_problem: >-
      How much decomposition probability factor-base design can buy at fixed size
      for prime-field Semaev constructions.
    corollaries:
      - problem: The relation-supply pin owed to GOAL-ICEX-001.
        reduction_ref: >-
          Direct: the ICEX package's p_solve versus B ladder is bounded above by
          coverage, which is bounded by this ceiling. No published reduction needed
          or cited.
        asymptotics_preserved: "n/a -- no asymptotic statement is transported."

  predictions:
    - metric: "identity multiset count at m = 2, 2-torsion-free base"
      direction: different
      minimum_effect: EXACTLY B.
    - metric: "multisets containing a +/- pair at m = 3, and the number of distinct targets they cover"
      direction: different
      minimum_effect: EXACTLY 2B^2 multisets covering EXACTLY 2B targets.
    - metric: "coverage/mu, any arm, m = 2"
      direction: lower
      minimum_effect: >-
        <= (2B^2+1)/(2B^2+B): 0.9167, 0.9359, 0.9485, 0.9633 at B = 4, 6, 8, 12;
        0.9768 at B = 20; 0.9899 at B = 48. A single exceedance refutes the ceiling.
    - metric: "sign of (best-arm coverage minus uniform-arm coverage) as a function of B"
      direction: different
      minimum_effect: >-
        NEGATIVE below B = (N/2)^{1/3} and POSITIVE above, crossover reproduced to
        within one ladder step. Derived max gains: bits 8 -- 1.048, 1.242, 1.525,
        1.113; bits 10 -- 1.008, 1.163, 1.394, 1.261; bits 12 -- 0.980, 1.067,
        1.185, 1.414; bits 16 -- 0.968, 0.989, 1.017, 1.062.
    - metric: "graded ladder coverage/mu across k = 1, 2, 4, 8, B plus the B_3 arm"
      direction: higher
      minimum_effect: >-
        Strictly increasing in k with at least three interior points separated by
        more than their Clopper-Pearson intervals, and the B_3 arm at or above
        k = B. Corpus-anchored endpoints, RELAYED from KN-FIND-007: 0.0021 for
        small-multiples, 1.1071 for Bose-Chowla B_3, both at toy scale.
    - metric: "max over all arms and B of structured/random coverage at matched B"
      direction: lower
      minimum_effect: <= 1.58198. An exceedance means conservation or the measurement is broken.
    - metric: "m = 1 deficit, every arm"
      direction: different
      minimum_effect: EXACTLY 0, every arm identical at 2B/N.

  test_boundary:
    instances: >-
      Deterministically generated ordinary short-Weierstrass curves at field_bits
      in {8, 10, 12, 16}; a Z/N control group; six factor-base families per cell.
    parameters:
      field_bits: [8, 10, 12, 16]
      arity_m: [1, 2, 3]
      factor_base_sizes: "the protocol's own default ladder, unmodified"
      base_families: [ap_k1, ap_k2, ap_k4, ap_k8, uniform_random, sidon_b3]
    implementation: >-
      Pure Python standard library. Exact integer enumeration of c_W; no solver, no
      Groebner, no sympy (verified absent), no Sage (verified absent).
    budget:
      wall_clock_seconds_total: 7200
      maximum_memory_gb: 2
      note: >-
        The largest enumeration is C(2*48+1, 2) = 4656 multisets at m = 2 and
        C(2*28+2, 3) = 32,509 at m = 3; six arms and four bit-sizes keep the total
        under a few million group operations.

  falsification_conditions:
    - Any arm exceeding its derived coverage ceiling at m = 2.
    - A collision-minimising arm beating the uniform arm at a cell with B < (N/2)^{1/3}.
    - Any structured/random coverage ratio above 1.58198 at matched B.
    - The m = 1 slice showing any difference between arms.
    - The small-multiples positive control failing to collapse; no negative may then be reported.
    - The Z/N nearby-object arm disagreeing with the curve arm on any forced value.

  interpretation_limits:
    - >-
      Toy tier, and the negation floor is a 1/B effect by construction. Nothing
      about crypto-scale decomposition probability follows; the protocol's
      prohibited_claims list is inherited verbatim.
    - >-
      Bounds the COVERAGE channel only. Relation rank and independence -- excluded
      from DEC-20260724-020's scope by that decision's own account (RELAYED) -- are
      untouched and are the named successor. The sentences "the coverage channel is
      closed" and "structured factor bases cannot help index calculus" are on that
      decision's forbidden list and are not written here.
    - >-
      The low-energy optimum is an instrument, not an attack, for the reason given
      in the mechanism. Any writeup presenting it otherwise is wrong.
    - >-
      No status change to any existing record is proposed or implied.

