  statement: >-
    A window of width 6 stores 32 entries. A window of width 5
    stores 16. Two to the power 5 is 32. Two to the power 4 is 16.
    Thirty-two exceeds sixteen by 16. The product of the two table
    sizes is 512. Their sum is 48. Two width-5 tables each store 16,
    so that gap is 0 and their product is 256.
  mechanism: >-
    The proposal writes the widths 6 and 5 and the sizes 32 and 16.
    This contract checks those integers. It does not add a curve
    point.
