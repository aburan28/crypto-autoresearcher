id: H-SSI-2c8bba
title: Selector-robust saturation is not implied by ordinary RWER success
area: SSI
question_id: RQ-SSI-1946c9
proposal_id: IDEA-20261007-0024cc
status: proposed
added: 2026-10-07
hypothesis: >-
  In the exact endpoint-preimage RWER syntax without public binding, ordinary
  relation-inversion success does not imply any positive uniform probability
  of extracting non-scalar independent loops that saturate End(E), and the
  minimal selected-message mask adapter does not supply a correctly directed
  attacker-to-inverter compiler.
mechanism: >-
  Public validity constrains only endpoints. A deterministic selector can
  correlate all outputs, while the reduction's saturation predicate depends
  on hidden sampled walks. Fiber-dependent masking breaks decryption through
  arbitrary inverses; fiber-constant masking lacks a decision-to-search proof.
predictions:
  - id: P1
    statement: the selector-robust saturation lower bound derivable from ordinary success is zero
    metric: infimum_u_I
    threshold: 0
  - id: P2
    statement: arbitrary valid inverse outputs need not preserve the mask predicate
    metric: cross_fiber_correctness_failures
    threshold: at_least_one_unless_fiber_constant
  - id: P3
    statement: every-basis routing remains undefined after a generic basis change
    metric: complete_polynomial_route
    threshold: absent
falsification:
  - exhibit and prove a public binding mechanism with every-basis polynomial inversion
  - prove selector-robust rank-four maximal-order saturation with a positive explicit bound
  - give a selected-message attacker-to-interface reduction with explicit quantitative accounting
test_boundary: >-
  Zero-run symbolic audit of public explicit-walk endpoint relations only;
  no claim about richer interfaces or all EndRing-based PKE constructions.
evidence_required:
  - exact game definitions and encodings
  - proof of conditional-fiber loop distribution
  - maximal-order saturation certificate
  - two-hop reduction bound and runtime
decision_impact:
  supports: retire this exact RWER repair and seek a materially different binding interface
  refutes: reopen RWER under the supplied theorem without promoting it to a scheme
scientific_runs: 0
