  title: >-
    The first-lag intersection has dimension 5 at n = 17 and 17 at
    n = 131, and the tuple ratio is exactly 2^{-64}.
  statement: >-
    For the degree window below 9, the doubled degrees run up to 16,
    which is strictly below 17, so no reduction occurs. The even
    degrees 0, 2, 4, 6 and 8 are five, not four and not nine. For
    the degree window below 33, the doubled degrees run up to 64,
    which is strictly below 131, and the even degrees from 0 through
    32 are 17, not 16. The overlap count 2^{4*17} over 4! divided by
    2^{132} over 4! is exactly 2^{-64}, because 68 - 132 = -64 and
    4! is 24 on both sides. The overlap power 2^{2*5 - 1} is 512,
    and 2*17 - 1 is 33.
  mechanism: >-
    The proposal prices conjugate attempts by the intersection of a
    degree window with its square. This contract checks those
    dimensions. It does not run a census.
