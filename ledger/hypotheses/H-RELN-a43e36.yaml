    "statement": "Test all M1–M5 spectral, hitting-time and row-weight predictions using actual EC walks; distinguish stationary covariance, stationary forward hits and Palm returns.",
    "mechanism": "Spectral theory of reversible chains on abelian groups. The walk is the Markov chain with transition operator T = (1/2B) sum_w (shift by l_w); on Z/N the characters diagonalise every shift, so T's spectrum is the character sums and the covariance of any function f along the chain is sum_j lambda_j^k |hat f(j)|^2. With f = 1_{mW} this is exact. The classical distribution statement imitated by HEUR-1 is Alon- Roichman / Landau-Russell: O(log|G|) uniformly random generators give an expander with high probability; on a cyclic group the sub-Gaussian tail of the cosine sums gives the explicit sqrt(ln(N/2)/B) scale. The hit process is a function of the chain, so its hitting-time law is controlled by lambda_2 and by the spectral weight of 1_{mW} on the near-top eigenspaces; both are computed, not assumed, at toy scale.",
