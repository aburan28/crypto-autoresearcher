# H-MONO-2f05e9
# Arithmetic monodromy of the four signed sums on the ordered base.
# H-MONO-9df9c0 reads the symmetric base and is not edited.
hypothesis:
  id: H-MONO-2f05e9
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  source_idea: IDEA-20261005-70b25b
  experiment_id: EXP-MONO-49ce45
  specified_at: '2026-10-05'
  status: approved
  proposed_by: coordinator
  approved_by_decision: DEC-20261005-5b87ad
  title: >-
    On the ordered base at p=101 the signed-sum image has order 4
    and contains no 4-cycle
  statement: >-
    Fix p=101 and m=3. Let E be y^2 = x^3 + A x + B over F_p.
    The ordinary panel is (A, B) = (1, 1), (2, 3), (4, 1), (1, 2),
    with point counts 105, 96, 112, and 100. The artifact panel is
    (0, 1), which has j=0 and 102 points, and (1, 0), which has
    j=1728 and 100 points. The curve (0, 1) is supersingular.
    The base point is an ordered pair (x1, x2) in F_p^2 with
    x1 distinct from x2. Psi is {P+Q, -(P+Q), P-Q, -(P-Q)} when
    those four points are distinct. The sample is the first 64
    indices k >= 0 that pass that test. The index map is
    u = (37 k + 11) mod p^2, x1 = u mod p, x2 = floor(u / p).
    Square roots are taken in F_p[z]/(z^8 + 2). The design-session
    count, which is not a run, gives Frobenius image order 4 on
    Psi for every curve, with no 4-cycle and no inverse-pair
    partition break. The ordinary split and inert counts of the
    two sum x-coordinates are 33 and 31, 33 and 31, 34 and 30,
    and 33 and 31. The artifact counts are 30 and 34, then 31
    and 33. Every good pair agrees with the product of the
    Legendre symbols of f(x1) and f(x2). A null of 64 separable
    quartics has 20 factorizations of type 3+1.
  mechanism: >-
    Over the ordered base the swap of x1 and x2 is not a loop.
    The two sign changes generate a group of order 4 inside the
    wreath product. An element of order 4, or a group of order
    8, would mean the image left that sign group. The quotient
    that remembers only the two sum x-coordinates splits exactly
    when f(x1) f(x2) is a square in F_p.
  assumptions:
    - Characteristic is 101 and each panel polynomial is squarefree.
    - A pair with x1 = x2, a zero y-coordinate, or fewer than four distinct sums is dropped.
    - The artifact curves are reported and are excluded from the ordinary tally.
    - No factor base is built and no discrete logarithm is solved.
  proof_search_map:
    bottleneck: >-
      Whether Frobenius on Psi over ordered pairs generates a
      group of order 4, a group of order 8, or a proper subgroup
      of order dividing 2.
    baseline_embedding:
      parameter_slice: >-
        The same six curves as the symmetric-base contract
        H-MONO-9df9c0. That hypothesis uses elementary symmetric
        coordinates (e1, e2). This one uses ordered (x1, x2).
      reproduction_check: >-
        On every good pair the split or inert type of the two
        sum x-coordinates matches the product of Legendre
        symbols. A mismatch invalidates the cell.
    observation_collision:
      observable: a 4-cycle, or a permutation that breaks the inverse-pair partition
      distinct_preimage_search: >-
        Two ordinary curves whose Psi images have different orders.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The same four signed sums, with the base ordered so
          the swap of the summands is not a deck transformation.
        predicted_gain: >-
          Separates the sign group of order 4 from the wreath
          group of order 8. No decomposition exponent moves.
    quantifier_order: >-
      For each of the six curves, for each of 64 good ordered
      pairs, one Frobenius permutation in S_4.
    method_ceiling:
      strongest_certifiable_claim: >-
        The arithmetic image generated by this frozen sample
        at p=101. Not a statement for every ordinary j, and
        not generation by inertia.
      nearby_object_control: >-
        The symmetric-base contract on the same curves, which
        predicts order 8, and the two artifact curves.
    proof_obligations:
      - claim: Each ordinary Psi image has order 4 and no 4-cycle
        responsibility: correctness
      - claim: Character disagreements are 0
        responsibility: baseline
      - claim: No ordinary permutation breaks the inverse-pair partition
        responsibility: correctness
  predictions:
    - metric: order of the Frobenius group on Psi
      direction: different
      minimum_effect: >-
        Order 4 against order 8 and against an order dividing 2.
        The ordinary panel is predicted at order 4 on all four curves.
    - metric: count of cycle type 4 on Psi
      direction: different
      minimum_effect: >-
        Zero 4-cycles on every curve. A positive count is an
        element the sign group does not contain.
  falsification_conditions:
    - >-
      Psi order 8 on an ordinary curve falsifies the claim that
      these coordinates lie in an extension of degree at most 4.
    - >-
      A 4-cycle on an ordinary curve falsifies the identification
      of the image with the group generated by the two sign changes.
    - >-
      Psi order 4 and zero 4-cycles on all four ordinary curves,
      with a clean character control, falsifies an exceptional
      drop inside this panel. It does not decide the symmetric base.
  interpretation_limits:
    - p=101 and m=3 only. No transfer to another prime or to m greater than 3.
    - The artifact curves do not count as ordinary exceptional loci.
    - Order 4 here does not decide the image over the symmetric base.
    - Inertia along f(x1) = 0 is out of scope.
  test_boundary: >-
    One prime, six explicit curves, 64 ordered pairs per curve,
    and one null of 64 quartics. H-MONO-9df9c0 is not edited.
