hypothesis:
  id: H-ICI-063e91
  question_id: RQ-ECDLP-002
  source_proposal: IDEA-20260804-027a00
  sub_goal_id: SG-ECDLP-002
  goal_id: GOAL-ECDLP-001
  statement: >-
    For a random ordinary prime-field curve E/F_p with prime-order subgroup
    G of order N, and a Semaev index-calculus factor base F of size B
    (points with x-coordinate < p/B), the augmented factor base
    F* = F ∪ phi^{-1}(F) for a random ordinary 2-isogeny phi: E -> E'
    (within the same isogeny class) has augmentation ratio
    |F*| / |F| > 1 + epsilon for some epsilon > 0 that does NOT vanish as
    N increases. If this holds, the effective index-calculus smoothness
    probability is increased by a non-vanishing multiplicative factor.
  mechanism: >-
    The ordinary 2-isogeny phi: E -> E' (within the same trace-t isogeny
    class) maps factor-base points to points on E'. The preimage phi^{-1}(F)
    on E consists of points P such that phi(P) ∈ F. If the isogeny acts
    "incoherently" on the factor base (i.e., phi^{-1}(F) is approximately
    independent of F), then F* brings new coverage. The null hypothesis is
    that phi approximately PERMUTES F (maps F to F bijectively), giving
    phi^{-1}(F) ≈ F and no augmentation. The mechanism predicts the opposite.
  predictions:
    - metric: augmentation_ratio
      direction: higher
      minimum_effect: >-
        |F ∪ phi^{-1}(F)| / |F| > 1.05 at B = N/10, measured over
        >= 10 random primes p at bits in {20, 24, 28}.
    - metric: null_map_augmentation
      direction: similar
      minimum_effect: >-
        For a RANDOM bijection psi (not an isogeny), |F ∪ psi^{-1}(F)| / |F|
        ≈ 2 - B/N (two independent sets). If the isogeny gives < 2-B/N, it
        ANTI-augments (structure-destroyer). If it gives ≈ 2-B/N, no advantage
        over random. If it gives > 2-B/N, something unusual and worth exploring.
  falsification_conditions:
    - >-
      If |F ∪ phi^{-1}(F)| / |F| ≤ 1.01 for all tested (p, phi), the augmentation
      is negligible and the mechanism provides no advantage.
    - >-
      If the augmentation ratio EQUALS the null-map ratio 2-B/N, the isogeny
      provides no structural advantage over a random map.
  test_boundary:
    instances:
      - random prime-field curves at bits in {20, 24, 28} with prime order N
      - ordinary 2-isogenies phi computed via 2-torsion kernel enumeration
    parameters:
      B: [N/10, N/5, N/3]
      replications: ">= 10 random primes per bit size"
    budget:
      wall_clock_seconds_per_run: 300
      total_cpu_hours: 1
      maximum_memory_gb: 4
  asymptotic_claim:
    problem: prime-field ECDLP via isogeny-augmented Semaev index calculus
    prior_best: exp(c * sqrt(log N * log log N)) for standard Semaev
    time_exponent: ">= 1/2 for generic E (sub-rho only if augmentation grows with N)"
    claim_kind: potential_constant_factor
    note: >-
      Exponent improvement requires augmentation ratio to GROW with N, not
      merely be a constant > 1. This is the central open question.
  heuristic_assumptions:
    - id: HEUR-ICI-1
      formal_statement: >-
        For a random ordinary 2-isogeny phi: E -> E', the points phi^{-1}(P)
        for P in the factor base F have x-coordinates approximately uniformly
        distributed in [0, p), independent of F.
      random_model_justification: >-
        Conjectural; motivated by the "random isogeny" heuristic common in
        CM theory. A controlled experiment (the density amplification test)
        is the minimal discriminating evidence.
      falsification_condition: >-
        Augmentation ratio ≤ 1.01 OR equals the random-map baseline 2-B/N.
  status: weakened
  status_scope_note: >-
    Weakened for Elkies ell-isogeny (ell <= 23) preimage augmentation mechanism
    at toy scale (bits 20-28) on prime-order ordinary prime-field curves.
    Scope note: the stated "2-isogeny" mechanism is algebraically untestable
    on prime-order curves (Atkin condition); the tested ell-isogeny variant is
    the nearest feasible proxy. The hypothesis text requires a scope correction
    (2-isogeny -> ell-isogeny) before any further status transition. Other
    variants (ell > 23, isogeny chains, extension-field isogenies) remain open.
  status_history:
    - status: specified
      decision_id: DEC-20260804-760bae
      decided_at: '2026-08-04'
      reason: >-
        Specified from IDEA-20260804-027a00 under BATCH-050 TASK-20260804-010.
        Awaiting experiment design and independent pre-exec review before approval.
  proposed_by: coordinator
  does_not_modify:
    - H-IT-001
    - H-DS-001
    - H-IC-001
    - H-STR-002
    - status: weakened
      decision_id: DEC-20260804-d0c452
      decided_at: '2026-08-04'
      reason: Elkies ell<=23 augmentation ratio indistinguishable from null map at 8/9 cells.
