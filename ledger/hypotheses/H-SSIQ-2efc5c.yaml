hypothesis:
  id: H-SSIQ-2efc5c
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  source_idea_ids:
    - IDEA-20260805-de1490

  statement: >-
    SCOPE: the descent instrument of lever L4 as frozen in the EXP-SSIQ-58b642 /
    EXP-SSIQ-a85692 lineage, applied to the four supersingular 2-isogeny graphs
    at p = 2437, 3889, 5737, 7333 with N = 203, 324, 478, 611 and the real
    in-session delta_E labels committed in RUN-SSIQ-a85692-b (terminal label
    CONTROL-FAILURE-VOID; its numbers are instrument inputs, not admitted
    evidence). CLAIM TIER toy. NO ATTACK, NO EXPONENT, NO STATEMENT ABOUT
    CRYPTOGRAPHIC SCALE.

    (H-B1, THE ANCHOR) The descent instrument contains a forced value it has
    never been asked to reproduce. The random arm measures the hitting time of
    the descent target set -- the F_p-rational locus, of size Theta(N^{1/2})
    inside N vertices -- by a random walk on an expander, so its growth exponent
    gamma_random IS 1/2, exactly, as a matter of theorem rather than
    measurement. The committed run reports gamma_random = 0.4014. THE
    HYPOTHESIS IS THAT THIS RESIDUAL IS AN ESTIMATOR PROPERTY, NOT A PROPERTY
    OF THE GRAPHS: the exactly computed mean hitting time, obtained by solving
    (I - P')h = 1 on each graph, will have exponent 0.500 +/- 0.05, and the
    frozen estimator applied to the same exact hitting times will return a
    materially smaller number.

    (H-B2, THE TRANSFER) The estimator's additive bias is a function of the
    true exponent and the fitting range, so measuring it on planted labellings
    with known hitting exponents at four rungs (1/4, 1/3, 1/2, 2/3) determines
    it at the greedy arm's operating point. Under H-B1 and H-B2 jointly, the
    bias-corrected greedy exponent EXCEEDS 1/4 -- i.e. the campaign's headline
    gamma_greedy = 0.2335, which currently clears this goal's target by 0.017,
    does not survive its own calibration. THIS HALF IS STATED IN THE DIRECTION
    THAT WEAKENS THE CAMPAIGN'S BEST LEVER, deliberately, so that confirming it
    costs as much as refuting it.

    (H-B3, THE MATCHED NULL AND THE UNCALIBRATED CUT) The frozen contract's
    inherited trapped_fraction > 0.5 exclusion has no derivation anywhere in
    this campaign. Its correct reference is not a constant but a matched null:
    a uniformly random permutation of the same delta_E multiset over the same
    graph, whose trapped fraction is forced to 1 - Theta(N^{-1/2}), predicted in
    [0.88, 0.98] at the achievable sizes. The committed real values are 0.8374,
    0.7222, 0.8201, 0.8511. THE HYPOTHESIS IS THAT THE MATCHED NULL LIES ABOVE
    THE REAL ARM AT ALL FOUR PRIMES, so that the escape ratio
    (1 - trapped_real)/(1 - trapped_null) exceeds 1 -- and hence that applying
    the 0.5 cut, as this goal's next_action item (2) proposes, would report
    DATA-UNAVAILABLE on a labelling that is measurably beating its own null.

    NOTHING HERE ASSERTS THAT LEVER L4 WORKS OR THAT IT FAILS. It asserts that
    the campaign's terminal readings rest on an estimator with an unexercised
    forced-value anchor and on a filter constant with no derivation, and that
    both are decidable at zero new search cost on committed data.

  mechanism: >-
    DERIVED IN-RECORD. Numbers quoted from
    experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-b/raw-result.json were read
    from that committed artefact in this session; nothing is re-measured here
    and no run is claimed.

    (A) THE FORCED VALUE OF THE RANDOM ARM, IN FULL.
    The supersingular 2-isogeny graph over F_{p^2} is 3-regular (frozen source
    line 99: for prime l there are exactly l+1 distinct l-isogenies with domain
    E, up to post-composition by an isomorphism) on N = #SS(p) ~ p/12 vertices,
    and is an expander (Pizer, the frozen source's [37], cited at line 193;
    NOT READ -- relayed). The descent target is the F_p-rational locus, i.e.
    exactly {E : E is isomorphic to E^{(p)}} = {delta_E = 1}, which is this
    goal's own L4 framing: "E lies on the F_p locus exactly when E is congruent
    to E^{(p)}, i.e. when the minimal E -> E^{(p)} degree is 1". Its size is
    h(-p) + h(-4p) up to bounded factors, i.e. p^{1/2+o(1)} by the class number
    formula (RECALLED, UNVERIFIED -- REPLACED IN THE EXPERIMENT BY A DIRECT
    COUNT of F_p-rational vertices in each constructed graph, which is exact at
    these sizes). Hence density d = Theta(N^{-1/2}) and the expected hitting
    time is Theta(1/d) = Theta(N^{1/2}), so gamma_random = 1/2.
    CONSISTENCY OF THE COMMITTED DATA WITH THE FORCED VALUE, computed here from
    the run's own per_prime medians and offered as motivation rather than as a
    finding: random_median / sqrt(N) = 22/14.25 = 1.544, 20/18.00 = 1.111,
    24/21.86 = 1.098, 36/24.72 = 1.456. An endpoint slope on the same four
    points is log(36/22)/log(611/203) = 0.446. The run's four-point fit is
    0.4014. All three readings sit below 1/2, and the ratios are consistent
    with exponent 1/2 times a constant near 1.1-1.5 with visible noise.
    THE EXPERIMENT DOES NOT RELY ON THE RELAYED EXPANDER BOUND: it computes the
    mean hitting time EXACTLY from each graph's transition matrix by solving a
    linear system of size at most 611, which settles the forced value on these
    graphs without any citation.

    (B) WHY A DIFFERENCE OF TWO FITTED EXPONENTS IS NOT AUTOMATICALLY SAFE.
    m_gap = gamma_random - gamma_greedy is a difference, and a purely additive
    bias would cancel. That cancellation is the assumption on which this
    campaign's only real measurement rests, and it is not obviously true. This
    goal's own instrument_calibration block decomposes a previously found -0.36
    bias into "saturation inside the retained window (~-0.15) plus finite-T
    discreteness at T <= 45 (~-0.21)", and DISCRETENESS IS MAGNITUDE-DEPENDENT.
    The two arms differ in magnitude by a factor of two to three: greedy medians
    are 10, 11, 12, 13 -- four consecutive integers across a factor of three in
    N -- while random medians are 22, 20, 24, 36. A slope fitted through four
    consecutive integers is the regime where discreteness bites hardest, so the
    prior should be that the greedy arm's bias is LARGER in magnitude, not
    equal. The hypothesis makes that a measurement rather than an argument.

    (C) WHY IT DECIDES SOMETHING ABOUT THE GOAL.
    The goal record's L4 correction states the lever's ceiling: if the descent
    is the whole cost, Delfs-Galbraith's F_p-restricted phase makes the ideal
    ceiling exactly p^{1/4}, and L4 is "the only lever of which that is true".
    In the instrument's units, the descent must reach the F_p locus in
    N^{gamma_greedy} steps with gamma_greedy <= 1/4. The committed 0.2335 clears
    that by 0.017 -- less than half the random arm's own residual from its
    forced value. So the question "is L4 at its ceiling" is currently decided by
    a quantity smaller than the instrument's demonstrated error, and nobody has
    measured that error.
    A SEPARATE AND LARGER CAVEAT, PRICED ELSEWHERE AND NOT RE-ARGUED HERE: the
    descent must evaluate delta_E at every visited vertex, and the committed
    runs supply that label by brute force, which at cryptographic scale is the
    original problem. H-SSIQ-90e07b charges that cost. A clean gamma_greedy
    below 1/4 is necessary and not sufficient.

    (D) THE TRAPPED-FRACTION NULL, DERIVED BEFORE ANY RUN.
    Greedy descent halts when no neighbour has a strictly smaller label. Under a
    UNIFORMLY RANDOM labelling of a 3-regular graph, a vertex is a local minimum
    with probability 1/4, so there are ~N/4 of them; the target set contributes
    at most Theta(N^{1/2}). Modelling a greedy walk from a uniform start as
    ending at a local minimum chosen proportionally to basin size, and treating
    basins as exchangeable under a random labelling, the escape probability is
    Theta(N^{-1/2}) and
      trapped_fraction_null = 1 - Theta(N^{-1/2}),
    which with implied constant 1 is about 0.93, 0.94, 0.95, 0.96 at
    N = 203, 324, 478, 611.
    THE MODEL IS CRUDE AND ITS CRUDENESS IS WHY THE NULL IS MEASURED RATHER THAN
    ASSERTED: basins are not exchangeable, and a random labelling is not the
    right null anyway because it destroys the delta value distribution as well
    as the geometry. THE OPERATIVE NULL IS MATCHED: a uniformly random
    permutation of the SAME delta_E multiset over the SAME graph. Two variants
    are specified and both are run, because they answer different questions:
      NULL-P: permute all labels freely. This moves the delta = 1 vertices,
        hence moves the TARGET SET, and measures whether the graph plus the
        label distribution alone produce the observed behaviour.
      NULL-Q: permute all labels EXCEPT the delta = 1 vertices, which stay
        pinned. The target set is preserved and only the gradient is destroyed.
    CONFLATING THEM WOULD BE A DESIGN ERROR and it is named here so a reviewer
    can check it. NULL-Q is the one that isolates the gradient; NULL-P is the
    one whose trapped fraction the derivation above predicts.

    (E) WHAT THE 0.5 CUT IS. GD-8 records that the M-GAMMA-GREEDY definition
    inherited from EXP-SSIQ-58b642 states a trapped_fraction > 0.5 exclusion in
    prose, that no code path in compute_delta_e.py or compute_delta_e_v2.py
    implements it, and that all four contributing primes exceed it. No
    derivation of 0.5 exists in any record of this campaign. The scale-free
    replacement is the escape ratio
      R = (1 - trapped_real) / (1 - trapped_null_matched),
    with forced value 1.000 under the null and an interpretable growth exponent
    in N. A cut on R at a stated multiple of the null's own bootstrap spread is
    a calibrated filter; a cut at 0.5 on the raw fraction is a number nobody
    derived.

  assumptions:
    - >-
      That the descent target set in the committed runs is the F_p-rational
      locus. This is the goal record's L4 framing and EXP-SSIQ-58b642's stated
      object, but it MUST be confirmed against
      experiments/EXP-SSIQ-58b642/implementation/descent_hitting_time.py before
      the forced value 1/2 is applied. If the target is a different set, the
      forced value becomes 1 - log_N(|target|) and the audit proceeds with that
      number. THE ANCHOR IS RECOMPUTED, NEVER ABANDONED.
    - >-
      That the four graphs are connected and 3-regular. The committed run's
      correctness_gates block records connectivity and degree_sequence checks
      for twelve primes; per GD-6's standing repair the audit RE-READS those
      records in full rather than citing their headline.
    - >-
      That the estimator invoked on the anchor is BIT-IDENTICAL to the one that
      produced gamma_greedy. GD-9's lesson is precisely that a control which was
      never wired still emits a report block, so the audit calls the same
      function object and records the call site rather than reimplementing the
      fit.
    - >-
      That the delta_E labels are correctly normalised. GD-6 records one
      normalisation failure of exactly this shape already (WISDE indexing by
      abstract order type rather than j-invariant). A mismatch is an
      INVALIDATION, not a negative result.
    - >-
      Environment, measured this session and recorded rather than assumed:
      numpy 2.4.6 imports; sympy does not; no Sage, no Pari. An N x N dense
      solve at N <= 611 is trivial under numpy. No stage of this hypothesis
      needs quaternion arithmetic.

  proof_search_map:
    bottleneck: >-
      THE FITTED EXPONENT. Every terminal reading this lever has produced --
      m_gap, its CI, the CONTROL-FAILURE-VOID branch, and the campaign's
      judgement that L4 is closest to its target -- passes through one
      four-point log-log slope. Whether that slope resolves the quantity asked
      of it is upstream of every conclusion in the lane and consumes none of the
      lane's search budget.
    baseline_embedding:
      parameter_slice: >-
        The RANDOM ARM on the four committed graphs. Its exponent is fixed by
        the target set's density and the expander property at 1/2, and the exact
        mean hitting time is computable in closed form from the transition
        matrix at these sizes -- so the baseline is not a curve that resembles
        another curve, it is an exact number the estimator either returns or
        does not.
      reproduction_check: >-
        EXACT, TWO-LEVEL. (1) Solve (I - P')h = 1 on the non-target vertices of
        each graph and fit the exponent of the mean hitting time; this must
        return 0.500 +/- 0.05 or the forced value does not apply at this scale
        and the anchor itself is what needs rescoping. (2) Run the FROZEN
        estimator on the same exact hitting times and record its residual.
        Level (1) tests the mathematics; level (2) tests the instrument; the
        difference between them is the entire deliverable and conflating them
        would destroy it.
    observation_collision:
      observable: >-
        The fitted exponent pair (gamma_greedy, gamma_random) and their
        difference m_gap.
      distinct_preimage_search: >-
        A COLLISION IS SEARCHED FOR DIRECTLY AND IS THE DESIGN'S CENTRE. Two
        ground-truth objects on opposite sides of the claimed conclusion:
        (a) the real delta_E labelling, where a descent gradient is hypothesised
        to exist; (b) NULL-Q, the same labels permuted with the target pinned,
        where NO gradient exists by construction. If the estimator returns
        indistinguishable m_gap on both, the observable does not identify the
        presence of a gradient and every reading in the lane is uninterpretable.
        A SECOND COLLISION, on the other side: the planted-distance labelling,
        where a maximal gradient exists by construction (greedy follows the
        distance function to the target in at most diam(G) steps). The estimator
        must separate (b) from that. The pair (NULL-Q, planted) brackets the
        real arm, and a method that cannot separate the bracket has not
        identified what it is measuring.
        A THIRD, subtler collision that must be reported: greedy_median takes
        the values 10, 11, 12, 13 over the whole measured range. Any two
        labellings whose greedy medians round to the same four integers are
        indistinguishable to this observable, and the number of distinguishable
        outcomes is therefore small. Reporting the observable's resolution --
        how many distinct m_gap values the four-point fit can produce given
        integer medians -- is a required metric.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Build a problem-specific resource measure -- the residual of the
          fitted exponent against a forced exponent -- and realise it by
          specialising to labellings whose hitting exponent is known by
          construction (planted target sets of size N^{1-e} for e in
          {1/4, 1/3, 1/2, 2/3}). Charges are added only over rungs that are
          disjoint by construction.
        predicted_gain: >-
          Converts "the estimator might be biased" into a table of residuals
          with a monotonicity statement, and makes any corrected exponent
          reportable with its correction visible rather than folded in.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (m_gap) fixed and vary the forgotten structure
          (which labelling produced it). The intrinsic invariant proposed to
          distinguish the resulting objects is the escape ratio R, which is
          scale-free and has forced null value 1.000.
        predicted_gain: >-
          If R does not separate the real arm from NULL-Q while m_gap appears
          to, then m_gap is responding to the label DISTRIBUTION rather than to
          the gradient, and the lane's central statistic is misattributed.
      - transform: stronger_invariant
        proposed_object: >-
          Preserve more state than the final answer requires: report the full
          per-start hitting-time distribution and the basin-size distribution,
          not the median alone, because the median through four consecutive
          integers is what makes the fit fragile.
        predicted_gain: >-
          A distribution-level comparison against the null survives finite-size
          effects that a slope through four medians does not, and it is the same
          move the frozen source itself makes in its Section 4.2 validation
          (comparing a full cumulative distribution against the prediction
          rather than a single fitted number).
    quantifier_order: >-
      CLAIMED, IN THIS ORDER: THERE EXISTS a bias function b(gamma_true,
      N-range), independent of the labelling's construction, such that FOR ALL
      labellings in the tested family the fitted exponent equals the true
      exponent plus b. The witness b may depend on the true exponent and on the
      fitting range; it may NOT depend on which labelling realises that
      exponent, and the ladder tests exactly that independence by realising the
      same forced exponent through two different constructions.
      THE WEAKER ORDER -- FOR ALL labellings THERE EXISTS a bias -- is vacuous
      (it is the definition of the residual) and is explicitly NOT claimed.
      SEPARATELY, for H-B1: FOR ALL four graphs, the exactly computed hitting
      exponent is 1/2 + o(1). This is a statement about these graphs and does
      not quantify over p; extending it to large p would require the expander
      bound this record only relays.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that on four supersingular 2-isogeny graphs of at most 611
        vertices, one named estimator has a measured residual against a forced
        value, that the residual behaves in a stated way across a four-rung
        ladder, and that a matched null relabelling produces a stated trapped
        fraction and escape ratio. IT CANNOT CERTIFY that greedy descent on
        delta_E does or does not beat a random walk asymptotically; it cannot
        move any exponent; it cannot close lever L4; and a corrected
        gamma_greedy above 1/4 closes only the claim that the CURRENT toy
        measurement shows the descent meeting its own ceiling. Writing it as
        more would be exactly the overreach this campaign has already recorded
        three times.
      nearby_object_control: >-
        THE PLANTED-GRADIENT LABELLING is the nearby object where the
        hoped-for conclusion is known TRUE, and NULL-Q is the nearby object
        where it is known FALSE. The instrument must separate them. A THIRD
        nearby object where the conclusion is known false in a different way:
        a random 3-regular graph on the same N with a random target set of the
        same size and a distance-based labelling -- here the gradient is real
        but the graph has no supersingular structure at all, so if the real
        arm's m_gap matches this object's, the measurement is about descent on
        expanders in general and not about delta_E. That third object is what
        separates "greedy descent works on labelled expanders" from "delta_E is
        a useful label", and no record in this lane has ever run it.
    proof_obligations:
      - claim: >-
          The descent target set is the F_p-rational locus, verified against the
          implementation rather than inherited from the goal record's prose.
        responsibility: interface
      - claim: >-
          |F_p locus| = Theta(N^{1/2}) on the four graphs, MEASURED by direct
          count, not recalled from the class number formula.
        responsibility: baseline
      - claim: >-
          The exactly computed mean hitting time of the target has exponent
          1/2 + o(1) on these graphs.
        responsibility: correctness
      - claim: >-
          The frozen estimator's residual against that exact exponent, reported
          before any greedy number is corrected.
        responsibility: strictness
      - claim: >-
          b is independent of the labelling construction at fixed forced
          exponent (HEUR-SS-3). NOT ESTABLISHED.
        responsibility: feasibility
      - claim: >-
          The matched nulls NULL-P and NULL-Q are kept distinct and both are
          reported.
        responsibility: strictness
      - claim: >-
          Every reused control is exhibited failing on at least one synthetic
          input before it is applied to real data (GD-9's standing repair,
          executed rather than promised).
        responsibility: correctness
      - claim: >-
          Nothing here transfers to cryptographic scale, and every citation
          carries that boundary.
        responsibility: scope

  rerandomization: null
  rerandomization_note: >-
    Not applicable. This hypothesis studies an instrument on fixed graphs; there
    is no worst-to-average-case device and none is claimed. Recorded explicitly
    rather than left null without explanation.

  asymptotic_claim: null
  asymptotic_claim_note: >-
    NULL AND REQUIRED TO BE. No complexity improvement of any kind is claimed.
    This is an instrument audit of a measurement baseline. It makes no problem
    easier, moves no exponent, and adds no attack. sota_delta is zero on every
    axis (time, memory, data, queries, advice) and dominated_by is not
    applicable because no Pareto point is claimed. The incumbent remains
    p^{1/3+o(1)} time and memory conditional on Heuristic 1 -- and, for the
    supersingular isogeny problem specifically, additionally on GRH (goal
    standing condition SC-1).

  heuristic_assumptions:
    - id: HEUR-SS-3
      formal_statement: >-
        BIAS TRANSFER. There exists a function b(g, R) of the true hitting
        exponent g and the fitting range R such that for every labelling
        construction in the tested family, fitted_exponent = g + b(g, R) +
        epsilon with |epsilon| below the ladder's own spread. In particular b
        does not depend on which construction realises g.
      random_model_justification: >-
        NONE THAT SURVIVES SCRUTINY, and it is recorded as a weakness rather
        than papered over. The usual argument -- that a log-log slope through
        medians of a power law is biased only by finite-size truncation, which
        depends on the exponent and the range -- predicts a bias of the right
        shape but says nothing about its dependence on the shape of the hitting
        distribution, which differs sharply between a greedy walk (short,
        integer-valued, heavy-tailed through trapping) and a random walk
        (geometric-ish). THE HYPOTHESIS'S FINDING (H-B1) DOES NOT DEPEND ON
        THIS HEURISTIC; only its correction (H-B2) does.
      supporting_results:
        - >-
          ledger/goals/GOAL-SSIQ-001/goal.yaml instrument_calibration: two
          independent null ensembles, different lattice families and different
          code, agreeing to 0.005, decomposing a -0.36 bias into saturation
          (~-0.15) and finite-T discreteness (~-0.21) for a DIFFERENT estimator
          in this same campaign. Precedent for the shape of the effect, not
          evidence for its transferability here.
      validation_experiment_ids: [EXP-SSIQ-c45ea2]
      falsification_condition: >-
        Two rungs of the ladder realising the SAME forced exponent through
        different constructions return fitted exponents differing by more than
        0.10. HEUR-SS-3 is false, NO corrected gamma_greedy may be reported,
        and the deliverable reduces to the uncorrected anchor residual plus the
        statement that the estimator is not correctable at this scale -- which
        is itself decisive about the lane.
    - id: HEUR-SS-9
      formal_statement: >-
        TARGET DENSITY. |{E : delta_E = 1}| = Theta(N^{1/2}) on the tested
        graphs, so the random-walk hitting exponent is 1/2.
      random_model_justification: >-
        The F_p-rational locus has size h(-p) + h(-4p) up to bounded factors and
        h(-p) = p^{1/2+o(1)} by the class number formula. RECALLED, UNVERIFIED
        as a citation. REPLACED BY DIRECT MEASUREMENT: the count is exact at
        N <= 611, so the heuristic is used only to say why 1/2 is the right
        anchor and the measurement decides whether it is.
      supporting_results:
        - >-
          The frozen source line 51 and the goal record's L4 framing both
          identify the F_p locus with the delta_E = 1 stratum; the locus size
          ~p^{1/2} inside ~p/12 curves is stated in the goal record's L4
          obstruction field.
      validation_experiment_ids: [EXP-SSIQ-c45ea2]
      falsification_condition: >-
        Directly measured F_p-rational vertex counts across the four graphs
        whose fitted exponent in N differs from 1/2 by more than 0.05. The
        anchor is then recomputed from the measured exponent, not abandoned.

  structural_ingredients:
    - description: >-
        Hitting time of a density-d set by a random walk on an expander is
        Theta(1/d).
      citation: >-
        Standard; the expander property of the supersingular l-isogeny graph is
        the frozen source's [37] (Pizer), cited at line 193 and NOT READ.
        DELIBERATELY NOT LOAD-BEARING: the experiment computes the mean hitting
        time exactly by linear solve on each graph, so the relayed citation is
        replaced by a measurement and no conclusion rests on it.
    - description: >-
        Local minima of a uniformly random labelling of a k-regular graph occur
        with density 1/(k+1).
      citation: >-
        Elementary and derived in this record: a vertex is a local minimum iff
        its label is smallest among itself and its k neighbours, which for
        exchangeable labels has probability 1/(k+1) = 1/4 at k = 3.
      role: supplies the derived trapped-fraction null before it is measured
    - description: >-
        The delta_E = 1 stratum is exactly the F_p-rational locus.
      citation: >-
        ledger/goals/GOAL-SSIQ-001/goal.yaml lever L4; frozen source line 51
        and Section 2.1. Used to identify the descent target and to construct
        NULL-Q's pinning rule.
      role: defines the target set and hence the forced exponent

  reduction_chain:
    core_problem: >-
      Whether greedy descent on delta_E in the supersingular 2-isogeny graph
      reaches the F_p-rational locus asymptotically faster than a random walk,
      and by an exponent rather than a constant -- lever L4's descent branch.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. There is no reduction from an instrument audit to any
      statement about the supersingular isogeny problem. Even a fully repaired
      and favourable descent measurement would not yield an algorithm, because
      the descent must evaluate delta_E at every visited vertex and that cost is
      charged by H-SSIQ-90e07b, not here. No record may cite this hypothesis
      toward a cost, an exponent, or a scheme.

  predictions:
    - metric: "P1 -- exactly computed hitting exponent of the F_p locus, four graphs"
      direction: different
      minimum_effect: >-
        '0.500, tolerance +/- 0.05. If the EXACT computation itself returns
        ~0.40, the forced value does not apply at this scale, the anchor is what
        needs rescoping rather than the greedy arm, and that is an equally
        reportable and arguably more important outcome.'
    - metric: "P2 -- anchor residual: frozen estimator on the exact hitting times, minus 0.500"
      direction: different
      minimum_effect: >-
        'FORCED VALUE 0.000. Tolerance |residual| <= 0.03 means the estimator is
        fit for purpose and gamma_greedy may be read as measured. Beyond that,
        every greedy exponent is reported with the residual attached, always.'
    - metric: "P3 -- measured F_p-rational vertex count per graph, and its exponent in N"
      direction: different
      minimum_effect: >-
        'Exponent 0.5 +/- 0.05. Measured by direct count, replacing the recalled
        class-number asymptotic.'
    - metric: "P4 -- ladder residuals at forced exponents 1/4, 1/3, 1/2, 2/3"
      direction: different
      minimum_effect: >-
        'Monotone in the forced exponent, and at each rung the two different
        constructions realising the same forced exponent must agree within 0.10
        (HEUR-SS-3). Non-monotonicity or disagreement above 0.10 blocks any
        correction.'
    - metric: "P5 -- corrected gamma_greedy = 0.2335 + b(gamma_greedy-range)"
      direction: higher
      minimum_effect: >-
        'PRE-REGISTERED DIRECTIONAL PREDICTION: exceeds 0.25. If it does not,
        the campaign''s headline survives its first calibration and that is the
        finding. Reported only if P4 passes; otherwise reported as
        NOT-CORRECTABLE.'
    - metric: "P6 -- trapped_fraction of NULL-P (free permutation), per graph"
      direction: higher
