  mechanism_test_status:
    recorded_by: DEC-20260801-010
    recorded_at: '2026-08-01'
    exercised: false
    statement: >-
      AS OF THE BATCH-025 OPENING THIS MECHANISM HAS NEVER BEEN TESTED AND NO INTEGER HAS
      EVER BEEN FACTORED IN THIS CAMPAIGN. No largest prime factor of any Semaev
      intermediate has been computed anywhere in this program, at any scale, in
