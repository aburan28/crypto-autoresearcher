hypothesis:
  id: H-LPF-001
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-001
  batch_id: BATCH-025
  source_proposal: null
  source_proposal_note: >-
    NO IDEA-* RECORD IS THE SOURCE AND THAT IS RECORDED RATHER THAN PAPERED OVER. This
    hypothesis is the direct promotion of OPEN-BATCH023-A, the owed direct smoothness
    measurement, which has been carried as an open debt of GOAL-ECDLP-001 across
    twenty-four batches and is adopted on the merits by DEC-20260801-010 as the single
    next action. It carries no ideation lineage because it is not a new mechanism - it
    is the measurement the campaign's exponent claims already rest on, made falsifiable.
  source_open_item: OPEN-BATCH023-A
  authorizing_decision_id: DEC-20260801-010
  experiment_ids:
    - EXP-LPF-001

  # ==================================================================
  statement: >-
    THIS HYPOTHESIS IS THE SMOOTHNESS CLAIM ITSELF. IT IS NOT AN INPUT TO IT AND IT IS
    NOT AN INSTRUMENT FOR IT, AND THAT DISTINCTION IS THE WHOLE REASON THIS RECORD
    EXISTS. For genuine half-arity Semaev partial-map intermediates under the frozen map
    INT-1 and encoding ENC-B, computed exhaustively over the 130816 unordered
    half-tuples i < j of the frozen 512-element deterministic factor base at the two toy
    cells generate_instance(2301, 16) and generate_instance(2301, 20), with m = 4,
    d_half = 2 and D = 2**32 and 2**40 respectively - the empirical probability that an
    intermediate is B-smooth, p_hat(u), IS WITHIN THE FROZEN CONSTANT FACTOR 8 OF DICKMAN
    rho(u) at every powered rung u in {2, 3, 4, 5} of the frozen Bsm ladder at both
    cells (LIMB B, ABSOLUTE), AND every certifying statistic of CERT-LPF-1 lies inside
    the measured band of 200 matched-bitlength uniform-integer replicate sample sets at
    the same n and the same X at both cells (LIMB A, RELATIVE). THE INTEGERS ARE ACTUALLY
    FACTORED. This is a toy-scale claim about the distribution of a structured algebraic
    object and about nothing else.
  what_makes_this_different_from_every_prior_hypothesis_in_this_lane: >-
    STATED PLAINLY BECAUSE THE DISTINCTION IS THE POINT. H-SMTH-001 stated this claim and
    its experiment was never approved and never run. H-EQD-001 measured the fibre
    invariants (e_1, e_2) against a matched null - a load-bearing INPUT to the smoothness
    claim, and not the claim. H-DEP-001 measured the DETECTION POWER of the statistics
    that made that comparison - an INSTRUMENT for that input, one step further removed
    again, and its contract failed review. H-LPF-001 IS THE B-SMOOTHNESS CLAIM. It
    factors integers, records largest prime factors, and compares the resulting
    distribution to Dickman rho. NO EXPERIMENT IN THIS CAMPAIGN HAS EVER FACTORED AN
    INTEGER, and every asymptotic cost statement this program has entertained in the
    Gaudry-Semaev lane rests on the quantity this hypothesis is about.

  mechanism: >-
    The half-arity partial map sends a pair of factor-base x-coordinates to the root
    multiset of a quadratic over F_p, and ENC-B encodes the two elementary symmetric
    functions of that multiset bijectively into [1, p**2]. The mechanism of this
    hypothesis is that the arithmetic of that encoding is uncorrelated with
    multiplicative structure - that knowing a number arises as e_1 * p + e_2 + 1 for a
    Semaev fibre tells you nothing about its factorization - so its largest prime factor
    behaves as for a uniform integer of the same size and the Dickman law applies within
    a constant. THE COMPETING MECHANISM, WHICH THE EXPERIMENT IS EQUALLY DESIGNED TO
    DETECT AND WHICH THIS CAMPAIGN HAS ALREADY SEEN ONCE, is that a structured algebraic
    intermediate carries multiplicative structure the random model does not predict.
    RT049-B2 supplied exactly such an instance in the neighbouring quantity - the
    birthday model for the fibre-invariant collision count is flatly wrong for a
    structural reason, while appearing right at one cell by numerical coincidence - and
    RT048-H2 records the general concern unrepaired. That should RAISE, not lower, the
    prior that a random model for the SMOOTHNESS of these intermediates is also wrong.
    Both mechanisms are live and the measurement discriminates them at toy scale.

  absolute_versus_relative_carried_verbatim:
    id: ABS-REL-LPF-1
    carried_verbatim_from: 'experiments/EXP-LPF-001/specification.yaml, absolute_versus_relative.text'
    text: >-
      HEUR-DS-1 IS AN ABSOLUTE CLAIM AGAINST A THEORETICAL REFERENCE, NOT A RELATIVE
      CLAIM AGAINST A SECOND SAMPLE, AND THIS EXPERIMENT IS BUILT ON THAT DISTINCTION
      RATHER THAN AROUND IT. The heuristic has two limbs and they are measured
      separately, read separately and reported separately. LIMB B, THE ABSOLUTE LIMB, is
      the claim that the probability an intermediate is B-smooth is within a constant
      factor of Dickman rho(u); it is tested by the ratio R(u) = p_hat(u) / rho(u) read
      against the FROZEN constant-factor band [1/8, 8] inherited unchanged from
      EXP-DS-001, and the reference rho(u) is THEORETICAL and is never replaced by a
      sample. LIMB A, THE RELATIVE LIMB, is the claim that the intermediates behave for
      B-smoothness purposes like uniform random integers of the same bitlength; it is
      tested by reading each certifying statistic against the MEASURED order-statistic
      band of 200 uniform-integer replicate sample sets at the SAME n and the SAME X.
      THE MATCHED-BITLENGTH UNIFORM-INTEGER ARM IS A CALIBRATION OF THE APPARATUS AND IS
      NOT THE COMPARISON. Its first duty is to measure how far a KNOWN-UNIFORM sample of
      this exact size at this exact X departs from the asymptotic Dickman prediction, so
      that the finite-X error of the reference is separated from any Semaev-specific
      departure; IF THE UNIFORM ARM ITSELF LEAVES THE [1/8, 8] BAND AT A RUNG, THEN LIMB
      B IS NOT DECIDABLE AT THAT RUNG BY THIS APPARATUS, and that is reported as a
      statement about the apparatus and the reference, never as a result about the
      Semaev map in either direction. A TWO-SAMPLE COMPARISON IS BLIND BY CONSTRUCTION TO
      ANY DEVIATION BOTH ARMS SHARE - this is ALT-CLASS-DEP-1's U1, established in this
      campaign and not hypothetical - and a departure from an asymptotic reference at a
      finite X is exactly the kind of deviation both arms share; therefore NO BRANCH OF
      RR-LPF-1 MAY BE SATISFIED BY A TWO-SAMPLE AGREEMENT ALONE, the two-sample statistic
      STAT-KS2-CAL is declared NON-CERTIFYING for both limbs, and no deliverable may
      report a two-sample agreement as evidence for HEUR-DS-1. CONFLATING THE CALIBRATION
      WITH THE COMPARISON IS WHAT MADE BATCH-023's RESULT BOUND HALF OF WHAT IT APPEARED
      TO, AND THIS CLAUSE EXISTS TO MAKE THAT CONFLATION IMPOSSIBLE TO COMMIT BY ACCIDENT.

  assumptions:
    - 'Toy prime-field curves at field sizes 16 and 20 bits; no live keys; no discrete logarithm is computed or claimed.'
    - >-
      THE SAME TWO CURVE INSTANCES AS EV-EQD-001 ARE USED DELIBERATELY, so that this
      measurement and the equidistribution measurement are of the SAME 130816 objects.
      THIS IS THEREFORE EXPRESSLY NOT A REPLICATION of anything and may never be counted
      toward `replicated`. RT049-CTRL-5, the actual replication at a different curve
      instance per bit size, remains owed and is not run here.
    - >-
      EVERY THRESHOLD IS A MEASURED ORDER STATISTIC OF A MEASURED NULL AT THE ACTUAL X.
      No threshold is derived from an analytic law (RV012-A1) and AP-2 binds. The
      analytic law enters through the STATISTIC, which is what makes the comparison
      absolute; it never enters through the threshold, which is what makes the test
      attainable at a finite X.
    - >-
      EVERY REPORTED LARGEST PRIME FACTOR IS RE-VERIFIED BY THE DRIVER AT 100 PERCENT OF
      SAMPLES - each factor tested for primality and the product asserted equal to N. A
      FACTORIZATION THIS EXPERIMENT DID NOT VERIFY IS NOT A MEASUREMENT.
    - >-
      A PERTURBATION THAT IS NOT DEMONSTRATED TO MOVE THE STATISTIC IT CERTIFIES AGAINST
      CERTIFIES NOTHING. PERTURB-MOVE-1 requires per-rung measured movement for both
      ladders, and a rung with no recorded movement is uncertified. This is the direct
      lesson of the BATCH-024 failure and it is an assumption of the design, not an
      afterthought.
    - >-
      A timeout, crash, resource exhaustion, budget cancellation, pilot-projection abort,
      hash mismatch or factorization-verification failure is infrastructure or instrument
      signal and is NEVER evidence about this hypothesis in either direction
      (AGENTS.md rule 5).

  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    DELIBERATELY NULL, AND THE NULL IS LOAD-BEARING RATHER THAN PRO FORMA. HEUR-DS-1 is a
    heuristic INSIDE an asymptotic cost model, so it is tempting to read a favourable
    outcome here as movement on that model. IT IS NOT. This hypothesis asserts no
    exponent, no complexity and no asymptotic behaviour, all four promotion gates G1
    through G4 remain OPEN, and there is no path from this record under any outcome to
    hypothesis status `supported` on any asymptotic claim anywhere in this program. The
    uncertified class V6 states the reason - the toy D is 2**32 and 2**40, the Dickman
    asymptotics and their finite-X corrections both differ at cryptographic D, and
    nothing measured here transfers upward by any argument this contract offers.

  heuristic_assumptions:
    - id: HEUR-DS-1
      relation: >-
        THIS HYPOTHESIS IS THE TOY-SCALE INSTANCE OF HEUR-DS-1 AND NOT A PROXY FOR IT.
        This is the first record in this campaign that can say that.
      inherited_from: H-DS-001.heuristic_assumptions
      validation_status: >-
        NEVER VALIDATED AND NEVER REFUTED, AT ANY SCALE, AS OF THE BATCH-025 OPENING.
        EXP-SMTH-001 was never approved and never run; EXP-EQD-001 measured a
        load-bearing input and factored nothing; EXP-DEP-001 measured the power of the
        instrument that measured that input and its contract failed review. A FAVOURABLE
        OUTCOME OF THIS EXPERIMENT DOES NOT VALIDATE HEUR-DS-1 EITHER - it validates its
        toy instance at D = 2**32 and 2**40 and nothing above, and the branch
        dispositions of RR-LPF-1 forbid any stronger statement under every branch.

  predictions:
    - metric: 'LIMB B - R(u) = p_hat(u) / rho(u) on OBJ-REAL at every powered rung u in {2, 3, 4, 5}'
      direction: same
      minimum_effect: 'Inside the frozen band [1/8, 8] at BOTH cells. This is the confirmatory prediction of the absolute limb.'
    - metric: 'LIMB A - every certifying statistic of CERT-LPF-1 against its archived measured band'
      direction: same
      minimum_effect: 'Inside the [2nd, 199th] order-statistic band of the 200 uniform replicates at BOTH cells.'
    - metric: 'DECAY-LPF-1 - p_hat(u) across the frozen u sweep'
      direction: decreasing
      minimum_effect: >-
        Strictly decreasing in u beyond sampling noise on the real arm AND on the uniform
        arm. THIS IS THE ARTIFACT TELL AND A BREACH FALSIFIES THE APPARATUS, not this
        hypothesis.
    - metric: 'PERTURB-MOVE-1 - measured shift of each certifying statistic at each rung of each ladder'
      direction: increasing
      minimum_effect: >-
        Monotonically increasing in gamma beyond noise, RECORDED AT EVERY RUNG. A rung
        with no recorded movement is uncertified; a ladder whose top rung shows no
        movement is struck from the certified list. THIS FALSIFIES THE PLANT MACHINERY,
        not this hypothesis.
    - metric: 'OBJ-CTRL-PRODUCT detection by at least one certifying statistic'
      direction: same
      minimum_effect: >-
        DETECTED AT BOTH CELLS. A PRE-REGISTERED POINT PREDICTION THAT CAN FAIL - a
        product of two integers each below p is derivably smoother than a uniform integer
        below p**2. Failure to detect is APPARATUS FAILURE under L-5 and suspends the rule.
    - metric: 'factorization_verification - fraction of samples whose factorization was re-verified and passed'
      direction: same
      minimum_effect: 'Exactly 1.0. A pre-registered point prediction. Any failure is L-0 and stops the run.'
  family_wise_statement: >-
    DECLARED IN ADVANCE. LIMB A reads three certifying statistics at two cells against
    two-sided bands with an exact per-comparison false-fire probability of
    4/201 = 0.0199, and R(u) adds four powered rungs at two cells. The branches L-2 and
    L-3 are conjunctions across BOTH cells in the SAME direction, which is what controls
    the family-wise rate rather than a correction factor - a single-cell excursion lands
    in L-4 and is `inconclusive` by design, not by post-hoc judgement. EVERY RATE AND
    EVERY BAND POSITION IN EVERY DELIVERABLE CARRIES ITS EXACT CLOPPER-PEARSON INTERVAL,
    and the reading rule must record the end-to-end probability that a correct uniform
    sample reaches L-2, computed from the measured bands before the measurement runs.

  test_boundary:
    instances:
      - 'toy prime fields at bits in {16, 20}, the SAME two instances as EV-EQD-001, from master seed 2301'
    parameters:
      arity_m: 4
      d_half: 2
      D_by_cell: {bits_16: 4294967296, bits_20: 1099511627776}
      factor_base_size_Bfb: 512
      intermediate_map: INT-1
      encoding: ENC-B
      enumeration: 'unordered half-tuples (i, j) with i < j, diagonal excluded by construction'
      n_per_sample_set: 130816
      Bsm_ladder_bits_16: [65536, 1626, 256, 84, 40]
      Bsm_ladder_bits_20: [1048576, 10321, 1024, 256, 102]
      powered_rungs: [2, 3, 4, 5]
      underpowered_rung_recorded_not_read: 6
      R_CAL: 200
      R_PLANT: 20
      smooth_ladder: [0.0005, 0.001, 0.002, 0.005, 0.01, 0.02, 0.05]
      rough_ladder: [0.0005, 0.001, 0.002, 0.005, 0.01, 0.02, 0.05]
      gamma_star: 0.01
      constant_factor_c: 8
      thresholds: 'THR-LPF-1, the [2nd, 199th] order-statistic bands of the 200 measured uniform replicates per statistic per cell.'
      baselines: >-
        NONE APPLY AS COST BASELINES. This hypothesis makes no cost claim, so matched
        Pollard rho and matched BSGS are not baselines for it and are not measured. Its
        Pareto position is recorded in the evidence record as a distributional
        measurement with no cost axis, and `dominated_by: null` remains forbidden.
    implementation: >-
      New driver experiments/EXP-LPF-001/implementation/lpf001_driver.py under the frozen
      contract experiments/EXP-LPF-001/specification.yaml. It WRITES, EDITS, RENAMES AND
      STAGES NOTHING under experiments/EXP-SMTH-001/, experiments/EXP-DS-001/,
      experiments/EXP-EQD-001/ or experiments/EXP-DEP-001/. A factorization primitive is a
      NEW and REQUIRED dependency, recorded in environment.json with its exact version.
    budget:
      calibration_run_wall_clock_seconds: 14400
      measurement_run_wall_clock_seconds: 5400
      total_cpu_hours: 6
      maximum_memory_gb: 8
      maximum_runs: 2

  falsification_conditions:
    - >-
      F-LPF-1 - branch L-3 of the frozen reading rule RR-LPF-1. At least one certifying
      statistic outside its archived measured band at BOTH cells in the SAME direction,
      or R(u) outside [1/8, 8] at a powered rung at BOTH cells while the uniform arm's
      R(u) at that rung lies inside. H-LPF-001 is then reported FAILED AT TOY SCALE,
      scoped exactly to INT-1, ENC-B, Bfb = 512, the i < j enumeration, the two tested
      cells, the frozen Bsm ladder and the archived bands. Disposition `weaken` on
      HEUR-DS-1's TOY INSTANCE. A REFUTATION ARTIFACT IS MANDATORY BEFORE THAT DECISION -
      deviation_certificate.json with an INDEPENDENT re-verification of the largest prime
      factor of a stated random subsample by a second factorization path, proof_status
      `counterexample_certificate`. `reject_scoped`, and in particular
      reject_scoped-as-impossibility, IS FORBIDDEN on this single unreplicated run. THE
      DIRECTION MUST BE STATED - smoother than reference and rougher than reference have
      opposite consequences for an index calculus and are never reported as one outcome.
    - >-
      F-LPF-2 - branch L-1, the artifact tell. p_hat(u) fails to decay across the frozen
      u sweep, or the PERTURB-MOVE-1 table records no movement at the top rung of a
      certified ladder. THIS FALSIFIES THE APPARATUS, not the hypothesis. Disposition
      `inconclusive` with a named repair.
    - >-
      F-LPF-3 - branch L-5. The apparatus-identity count exceeds its frozen exact-binomial
      cut, or OBJ-CTRL-PRODUCT is not detected at either cell, or the driver's Dickman
      solution differs from the frozen table by more than 1 percent. APPARATUS FAILURE,
      no disposition in either direction.
    - >-
      F-LPF-4 - branch L-0. Any integrity failure, hash mismatch, stream collision,
      tripwire, factorization-verification failure, pilot-projection abort or budget
      event. INSTRUMENT OR INFRASTRUCTURE FAILURE, no disposition in either direction.

  interpretation_limits:
    - id: IL-LPF-ALTCLASS
      title: the alternative-class declaration, carried VERBATIM from the frozen contract
      carried_verbatim_from: 'experiments/EXP-LPF-001/specification.yaml, process_disciplines.alternative_class_declaration.text'
      text: >-
        CERTIFIED AGAINST, AFTER THIS EXPERIMENT, CONDITIONAL ON A VALID RUN AND ONLY AT
        THE RUNGS WHERE PERTURB-MOVE-1 RECORDS MEASURED MOVEMENT - (S1) an excess of
        B-smooth integers at a gamma fraction of the samples, as generated by
        OBJ-PLANT-SMOOTH-gamma, at the ladder fractions measured and only those; (S2) an
        excess of rough integers at a gamma fraction, as generated by
        OBJ-PLANT-ROUGH-gamma, at the fractions measured; (S3) the derivable
        product-encoding smoothness excess of OBJ-CTRL-PRODUCT, which is a single object
        and not a ladder. CARRIED FORWARD AND NOT RE-MEASURED - (C0) the e_1-marginal
        re-randomization class certified at delta = 0.05 with a branch-level floor of
        delta = 0.02 by EV-EQD-001, which is a statement about a DIFFERENT measurement and
        does not transfer to this one. UNCERTIFIED AFTER THIS EXPERIMENT, AND THIS LIST IS
        PART OF THE RESULT - (V1) ANY DEPARTURE FROM THE DICKMAN LAW THAT A
        MATCHED-BITLENGTH UNIFORM SAMPLE EXHIBITS AT THE SAME MAGNITUDE AND SIGN, which
        LIMB A's measured band absorbs by construction and which only LIMB B can see;
        (V2) any departure of magnitude below the smallest ladder rung gamma = 0.0005,
        about 65 of the 130816 samples; (V3) any departure visible only in the joint law
        of the largest and second-largest prime factors, in the full factorization
        pattern, or in the arithmetic of the factors themselves, none of which is
        measured; (V4) any departure at u outside the frozen sweep [2, 6], and in
        particular any departure at u > 6 where this design is underpowered by its own
        declared arithmetic; (V5) any object other than the two frozen toy cells, INT-1,
        ENC-B, m = 4, d_half = 2, Bfb = 512 and the i < j enumeration; (V6) THE ENTIRE
        QUESTION OF BEHAVIOUR AT CRYPTOGRAPHIC D - the toy D here is 2**32 and 2**40, the
        Dickman asymptotics and their finite-X corrections both differ at crypto-scale D,
        and NOTHING MEASURED HERE TRANSFERS UPWARD BY ANY ARGUMENT THIS CONTRACT OFFERS;
        (V7) the determinism-versus-small-x-window confound RT049-B6, untouched here as it
        was in BATCH-024. NO DELIVERABLE MAY DESCRIBE THIS EXPERIMENT AS HAVING POWER
        AGAINST "DEPARTURES FROM DICKMAN" WITHOUT NAMING WHICH OF S1, S2 OR S3 THE CLAIM
        RESTS ON AND WITHOUT CARRYING V1 THROUGH V7.
    - id: IL-LPF-TOY-IS-NOT-CRYPTO
      title: a toy-scale consistency is not the heuristic
      text: >-
        THE SINGLE MOST LIKELY OVERCLAIM AVAILABLE FROM A FAVOURABLE OUTCOME, NAMED IN
        ADVANCE. HEUR-DS-1 is used in this program's cost reasoning at cryptographic D.
        This experiment measures its instance at D = 2**32 and D = 2**40. A consistency at
        toy D is EVIDENCE ABOUT TOY D. It is not a validation of the heuristic, it is not
        a heuristic-validation experiment at target scale in the sense of
        docs/target-result-profile.md, and it does not discharge the validation obligation
        that a conditional exponent claim would carry. What it DOES do is make the
        heuristic falsifiable somewhere for the first time in this campaign, and supply the
        smallest-scale rung of a validation ladder whose upper rungs do not yet exist.
    - id: IL-LPF-NOT-A-REPLICATION
      title: deliberately not a replication
      text: >-
        The same two curve instances are used on purpose, so this batch cannot move
        H-EQD-001 or anything else toward `replicated`, and no deliverable may present it
        as a second confirmation of EV-EQD-001. RT049-CTRL-5 remains owed.
    - id: IL-LPF-NO-COST
      title: no cost consequence under any outcome
      text: >-
        No cost consequence follows from any outcome. This experiment measures no
        wall-clock time as a decision variable, no charged unit, no operation count, no
        cost ratio and no R. Wall-clock appears only as a budget and as an infrastructure
        signal.
    - id: IL-LPF-GATES
      title: promotion gates
      text: >-
        All four asymptotic-claim promotion gates G1 through G4 remain OPEN and nothing in
        this record moves any of them under any outcome. S1_met, F1_met, F2_met and
        structure_gate_passed cannot be evaluated at all, because this experiment runs no
        search.
    - id: IL-LPF-UNTOUCHED
      title: records this hypothesis does not move
      text: >-
        H-SMTH-001 remains `specified` with no evidence in either direction and its file is
        not edited; H-EQD-001 remains `analyzed` with SCOPE-EQD-ANALYZED-1 unaltered;
        H-DEP-001 remains `specified`; H-DS-001 remains `weakened`; H-IC-001 and H-STR-002
        remain weakened; EV-EQD-001 and EV-DS-001 through EV-DS-004 are not re-scored; and
        every file under experiments/EXP-SMTH-001/, experiments/EXP-DS-001/,
        experiments/EXP-EQD-001/ and experiments/EXP-DEP-001/ is untouched.
    - id: IL-LPF-REVIEW-INDEPENDENCE
      title: review independence under this harness
      text: >-
        Under this Claude Code harness the authoring, executing, validating and reviewing
        sessions all resolve to claude-opus-5. Reviews are independent in the AGENTS.md
        sense - a separate session that did not author the artifact - but NOT in the model
        sense, and no review produced here is admissible toward the three-model closure
        quorum of AGENTS.md rule 13. Every review must RECOMPUTE rather than reason
        wherever recomputation is possible; that compensation is what caught all four
        BATCH-024 defects.

