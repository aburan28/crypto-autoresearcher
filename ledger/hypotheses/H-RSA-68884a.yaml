hypothesis:
  id: H-RSA-68884a
  question_id: RQ-RSA-afe33c
  goal_id: GOAL-RSA-001
  source_idea_ids:
    - IDEA-20260805-1775f2
    - IDEA-20260805-72bcb5

  statement: >-
    SCOPE: general number field sieve, single key, heuristic asymptotics in
    L-notation, with the standard Buhler-Lenstra-Pomerance parameterization
    (smoothness bound B = L[beta], sieving region A = L[alpha], polynomial
    degree d+1 = delta (log n / log log n)^(1/3)). CLAIM TIER: statements about
    a COST MODEL only. NO FACTORIZATION, NO ATTACK, NO EXPONENT OF THE
    FACTORING PROBLEM IS MOVED, AND NOTHING HERE IS A STATEMENT ABOUT A
    DEPLOYED RSA KEY.
    The claim, in one sentence: the corpus's unreconciled core-year-versus-
    area-time disagreement about NFS cost is a single free parameter, and that
    parameter is the exponent theta with which the linear-algebra stage's
    SHARED matrix of size S is charged as S^theta while relation collection is
    charged its step count alone.
    Concretely, under HEUR-NFS-1 (smoothness), HEUR-NFS-2 (storage asymmetry)
    and HEUR-NFS-3 (density and dimension), re-optimizing the GNFS parameters
    for each theta yields the closed forms, exact as rationals,
      delta(theta)^3 = 12 (1 + theta) / (2 + theta)^2,
      beta(theta)^3  =  4 (2 + theta) / (9 (1 + theta)^2),
      c(theta)^3     =  4 (2 + theta)^4 / (9 (1 + theta)^2),
    with c = (2 + theta) beta and total heuristic full cost L[1/3, c(theta)].
    The hypothesis is falsified unless ALL of the following hold simultaneously:
    (G1) c(0)^3 = 64/9 exactly, reproducing the classical GNFS exponent;
    (G2) beta(0)^3 = 8/9 and delta(0)^3 = 3 exactly;
    (G3) c(1/2)^3 = 625/81 exactly, i.e. c(1/2) = 1.976052, agreeing to every
         digit the relayed KN-LIT-2663 single-key area-time figure carries;
    (G4) the SAME machinery applied to Shanks baby-step giant-step returns
         exactly n^(1/2) at theta = 0 and exactly n^(2/3) at theta = 1/3, the
         latter being the result KN-TECH-035 independently attributes to
         Wiener - this is the POSITIVE CONTROL and its failure forbids any
         negative conclusion about NFS whatsoever;
    (G5) the NULL OBJECT - an NFS variant whose linear-algebra stage holds
         O(1) shared state - returns c = (64/9)^(1/3) and beta = (8/9)^(1/3)
         for EVERY theta, i.e. no theta-dependence at all;
    (G6) on the ladder theta in {0, 1/6, 1/4, 1/3, 5/12, 1/2}, c is strictly
         increasing and beta is strictly decreasing, with exact cubes
         c^3 in {64/9, 28561/3969, 729/100, 2401/324, 707281/93636, 625/81}
         and beta^3 in {8/9, 104/147, 16/25, 7/12, 464/867, 40/81}.
    The value the family predicts and that appears nowhere in this corpus is
    c(1/3) = (2401/324)^(1/3) = 1.949616, which is what KN-TECH-035's and
    KN-TECH-057's own three-dimensional wiring convention forces for integer
    factorization. If any of G1-G6 fails, the deliverable is a NAMED NEGATIVE
    with its exact boundary - which gate failed, at which theta, and by how
    much - and not a fatigue report.

  mechanism: >-
    DERIVED IN-REPO AND CHECKED IN EXACT RATIONAL ARITHMETIC BEFORE THIS RECORD
    WAS WRITTEN. Primary sources for the classical NFS analysis were NOT
    retrieved for this record; every step is re-derived here and the two
    endpoint values are afterwards COMPARED against published figures. Where a
    figure is relayed it is labelled.

    NOTATION. l = log n; L[c] = exp((c + o(1)) l^(1/3) (log l)^(2/3));
    B = L[beta] the smoothness bound; N ~ B the matrix dimension; A = L[alpha]
    the number of candidate pairs; d + 1 = delta (l / log l)^(1/3) the degree.

    STEP 1, NORM SIZE. With m = n^(1/(d+1)) the common root of the two
    polynomials, the product of the two norms at a pair (a, b) with
    |a|, |b| <= A^(1/2) has logarithm
      (alpha delta / 2 + 2 / delta) l^(2/3) (log l)^(1/3)
    to leading order. The first term is the sieving-region contribution
    ((d+1)/2 . log A), the second the common-root contribution
    (2/(d+1) . log n).

    STEP 2, SMOOTHNESS. u = log(norm product)/log B
      = (alpha delta / 2 + 2 / delta) / beta . (l / log l)^(1/3),
    and under HEUR-NFS-1 the probability of both norms being B-smooth is
    u^(-u(1+o(1))) = L[ -(alpha delta / 2 + 2 / delta) / (3 beta) ], the factor
    1/3 arising because log u = (1/3) log l to leading order.

    STEP 3, RELATION CONDITION. About B relations are needed for a kernel:
      (i) alpha - (alpha delta / 2 + 2 / delta) / (3 beta) = beta.

    STEP 4, THE ASYMMETRIC CHARGE - THE ONLY PLACE theta ENTERS. Relation
    collection carries O(1) live state per processor (a bounded sieve region,
    or streamed cofactorization), so under HEUR-NFS-2 its full cost is its
    step count L[alpha] for every theta. Block Wiedemann on the N x N sparse
    matrix has step count N^2 d_row = L[2 beta] and holds ONE SHARED OBJECT of
    size S = N d_row = L[beta] (HEUR-NFS-3), so its full cost is
    L[2 beta] . L[beta]^theta = L[(2 + theta) beta]. This is exactly the
    asymmetry KN-TECH-057 uses in the isogeny setting when it gives MITM a
    clock cycle tau = S^(1/3) and van Oorschot-Wiener tau = O(1); the present
    record applies the identical rule to factoring, which no record in this
    corpus does.

    STEP 5, BALANCE, SOLVE, OPTIMIZE. Balancing (ii) alpha = (2 + theta) beta
    and substituting into (i) gives
      3 (1 + theta) beta^2 - ((2 + theta) delta / 2) beta - 2 / delta = 0,
    positive root
      beta = [ (2+theta) delta / 2
               + sqrt( (2+theta)^2 delta^2 / 4 + 24 (1+theta) / delta ) ]
             / ( 6 (1 + theta) ).
    Minimizing over delta (set d beta / d delta = 0, isolate the surd, square
    once) gives (iii) delta^3 = 12 (1 + theta) / (2 + theta)^2. Substituting
    (iii) into the radicand: 24(1+theta)/delta = 2 delta^2 (2+theta)^2, so the
    radicand is (9/4) delta^2 (2+theta)^2 and the surd collapses EXACTLY to
    (3/2) delta (2+theta). Hence
      (iv) beta(theta) = delta(theta) (2 + theta) / (3 (1 + theta)),
      (v)  c(theta) = (2 + theta) beta(theta),
    and cubing with (iii) removes every radical, giving the two closed forms in
    the statement.

    THE INTERNAL CONSISTENCY CHECK THAT IS NOT A RESTATEMENT. Substituting
    (iii) and (iv) back into the quadratic of Step 5 reduces it, after
    cancellation, to delta^3 (2 + theta)^2 / (6 (1 + theta)) = 2 - which IS
    (iii). The stationarity condition and the relation condition close on each
    other. A derivation that gets either one wrong will not close, so this
    residual (which must be exactly zero as a rational) is a second independent
    gate on the algebra and it costs nothing.

    WHAT THE ALTERNATIVE CHARGING GIVES, RECORDED SO THE CHOICE IS VISIBLE. If
    BOTH stages are charged S^theta with S = B, the balance becomes
    alpha + theta beta = (2 + theta) beta, i.e. alpha = 2 beta, (i) reverts to
    3 beta^2 = beta delta + 2/delta with delta^3 = 3 and beta = (8/9)^(1/3),
    and the full cost is (2 + theta)(8/9)^(1/3) - which is 2.2435 at
    theta = 1/3 and 2.4038 at theta = 1/2. NEITHER reproduces the relayed
    1.976. That the ASYMMETRIC charging is the one whose theta = 1/2 endpoint
    lands on the published figure is weak evidence for HEUR-NFS-2 and is
    reported with that weakness attached, never as a derivation of it.

    THE SECOND CONSEQUENCE, WHICH IS THE CHECKABLE ONE. beta(theta) is
    strictly decreasing: 0.961500, 0.891057, 0.861774, 0.835550, 0.811895,
    0.790421 across the ladder. Charging memory does not merely raise the cost,
    it moves the OPTIMAL PARAMETERS toward a smaller factor base, a smaller
    matrix and more sieving. This is the bridge to the record-calibration arm
    (IDEA-20260805-72bcb5) and it is a DIRECTIONAL prediction about how record
    computations should have been parameterized if their operators were
    implicitly pricing memory. It is stated as a direction and not as a fit,
    because at 795 and 829 bits the o(1) terms are not controlled and no
    quantitative extraction of theta from a record's choice of B is licensed.

    WHAT IS NOT DERIVED, AND IS THE WEAKEST LINK. HEUR-NFS-2. The claim that
    relation collection can be scheduled with per-processor storage bounded
    independently of B is architectural, not proved, and it has one named hole:
    if the factor base must be REPLICATED across P processors the area becomes
    P . B and the asymmetry collapses. The hypothesis stands or falls with it
    and says so here rather than in a footnote.

  assumptions:
    - >-
      THE FROZEN CLOSED FORM, STATED COMPLETELY WITH EVERY PARAMETER FIXED
      BEFORE ANY EVALUATION. (1) delta(theta)^3 = 12(1+theta)/(2+theta)^2.
      (2) beta(theta)^3 = 4(2+theta)/(9(1+theta)^2).
      (3) c(theta)^3 = 4(2+theta)^4/(9(1+theta)^2).
      (4) c(theta) = (2+theta) beta(theta), alpha(theta) = c(theta).
      (5) The residual of the Step-5 quadratic at (iii),(iv) is exactly 0.
      (6) NULL: an NFS variant with S = L[o(1)] in the linear algebra has
          c = (64/9)^(1/3) and beta = (8/9)^(1/3) for every theta.
      (7) POSITIVE CONTROL: BSGS with step count n^(1/2) and storage n^(1/2)
          has full cost n^(1/2 + theta/2), hence n^(1/2) at theta = 0 and
          n^(2/3) at theta = 1/3.
      NO OTHER DEGREE OF FREEDOM EXISTS. theta is NOT fitted: the treatment
      value theta = 1/3 is fixed by this program's own declared convention
      (KN-TECH-035, KN-TECH-057) before any datum is seen, and theta = 0 and
      theta = 1/2 are the two endpoints the corpus already holds. Any
      adjustment to (1)-(7) after any evaluated number has been observed
      requires a versioned protocol amendment with exploratory-only
      confirmatory status, and is never an edit.
    - >-
      ALL ARITHMETIC IS EXACT RATIONAL ARITHMETIC ON THE CUBES. The gates are
      stated as equalities between rationals (64/9, 8/9, 3, 625/81, 2401/324,
      and the ladder), never as decimal tolerances, so there is no tolerance to
      tune and no floating-point reproducibility question. Decimals appear only
      as reported conveniences.
    - >-
      THE RELAYED COMPARISON TARGET IS NOT AN AUTHORITY. KN-LIT-2663's
      "L^1.976...+o(1) for a single key" is relayed from an abstract in a
      2026-07-24 bulk-seeded entry with null year, null venue, all four
      identifiers null, and a "Relevance to this program" paragraph about
      MOV/Frey-Ruck that plainly belongs to a different paper. G3 is a
      COMPARISON, and a G3 mismatch has two possible causes - a wrong
      derivation or a wrong transcription - which the contract requires to be
      reported jointly, never resolved in the convenient direction.
    - >-
      NO CONCRETE COST TABLE IS AUTHORIZED BY THIS HYPOTHESIS. GOAL-RSA-001's
      next_action states that the RSA-1024 / 2048 / 3072 table may not be built
      before the record-reproduction gate passes. This record moves no
      exponent of the factoring problem, controls no o(1), and licenses no
      statement at any concrete modulus size.

  proof_search_map:
    bottleneck: >-
      The single step in which memory is or is not charged in the
      linear-algebra stage of NFS. Every downstream statement this program
      might make about factoring cost - the RSA-2048 table, any cross-primitive
      comparison against "the RSA line", any parameter equivalence taken on
      inheritance - passes through that one step, and the program currently
      has no value for it at all. Removing the ambiguity there changes what
      every later cost statement means; nothing else in the chain does.
    baseline_embedding:
      parameter_slice: >-
        theta = 0. At theta = 0 the model IS the classical uncharged GNFS
        analysis and must return the exact classical optimum: delta^3 = 3,
        beta = (8/9)^(1/3), total exponent (64/9)^(1/3). A second, independent
        slice is the alternative symmetric charging, which must return
        beta = (8/9)^(1/3) again with total exponent (2+theta)(8/9)^(1/3).
      reproduction_check: >-
        SYMBOLIC AND ALREADY RUN, IN EXACT RATIONALS, BEFORE THIS RECORD WAS
        WRITTEN: c(0)^3 = 4 . 2^4 / (9 . 1) = 64/9; beta(0)^3 = 4 . 2 / 9 =
        8/9; delta(0)^3 = 12 . 1 / 4 = 3. These are integer-ratio identities
        against the classical constants, not a curve resembling a plot. The
        check is repeated as G1 and G2 of the paired contract by an
        independent re-derivation rather than by re-evaluating the closed form.
    observation_collision:
      observable: >-
        The single real number c, the L-notation exponent of total full cost.
      distinct_preimage_search: >-
        A COLLISION EXISTS, IT IS EXHIBITED HERE, AND IT IS THE REASON THE
        HYPOTHESIS IS NOT VACUOUS. Two structurally different cost models
        return the SAME c: (a) the asymmetric charging at theta = 1/2, giving
        c = (625/81)^(1/3) = 1.976052, and (b) whatever model produced
        KN-LIT-2663's relayed single-key area-time figure 1.976...+o(1), which
        this program has not read and cannot currently identify. Agreement of
        the observable does NOT establish that the two models agree, and the
        contract is written so that G3 passing is reported as "the observable
        collides", not as "the models are the same". THE SEPARATING CONDITION,
        if it exists, is the optimal smoothness exponent beta: the asymmetric
        model forces beta(1/2)^3 = 40/81, and if primary text reports a
        different optimal smoothness exponent for the same claimed c, the two
        models are distinguished and the collision is broken by an invariant
        finer than c. Extracting beta from primary text is therefore a required
        artifact and not an optional one.
        A SECOND, LESS INTERESTING COLLISION IS ALSO PRE-DECLARED: solving
        c(theta) = target for theta is always possible, so c alone can never
        identify theta. That is why theta = 1/3 is fixed a priori by the
        program's declared convention rather than being read off any datum.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the informal question "is memory free" by the exact algebraic
          condition "S enters the linear-algebra cost as S^theta", moving the
          disagreement into a model where the answer is a single rational
          exponent and every claim is an equality between rationals rather
          than an approximate agreement between narratives.
        predicted_gain: >-
          Turns an unreconciled pair of authorities into a one-parameter curve
          with two pinned endpoints, and turns "which costing is right" into
          "which theta", a question with a stated answer under the program's
          own convention. Encoding, completeness, soundness and transfer
          obligations are listed under proof_obligations; the TRANSFER
          obligation to concrete sizes is DECLARED UNMET, not deferred.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable c fixed at 1.976052 and vary the forgotten
          structure - the charging convention, the wiring dimension, the
          stage the charge is applied to. The intrinsic invariant proposed to
          distinguish the resulting models is the optimal smoothness exponent
          beta, which the asymmetric model forces to 40/81 in cube.
        predicted_gain: >-
          If beta does not distinguish models that share c, the family has not
          identified the load-bearing structure and the endpoint agreement at
          G3 carries no information beyond coincidence. Naming the invariant
          in advance is what makes the G3 pass interpretable.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER: THERE EXISTS one closed-form triple (delta, beta,
      c) as a function of theta - fixed, parameter-free, frozen before any
      evaluation - such that FOR ALL theta in [0, 1] it is the optimum of the
      stated GNFS parameter problem under HEUR-NFS-1..3. The witness may NOT
      depend on theta beyond being evaluated at it, and it may not depend on n,
      on the machine, or on which record is being discussed.
      THE WEAKER ORDER - FOR ALL theta THERE EXISTS an optimum - is trivially
      true (a minimum of a continuous function on a compact set) and is
      explicitly NOT the claim and NOT admissible as a result.
      THE QUANTIFIER TRAP BEING HUNTED, STATED SO A REVIEWER CAN CHECK IT: the
      o(1) in L[c + o(1)] is a function of n, and the claim is uniform in
      theta but NOT uniform in n. Every statement here is therefore an
      asymptotic statement in n with an unquantified rate, and any sentence of
      the form "at 2048 bits the charged cost is X" would be a quantifier
      violation. The contract forbids such sentences explicitly.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: a closed-form family of HEURISTIC ASYMPTOTIC exponents for
        single-key GNFS under three named heuristics, with two endpoints
        matching independently stated figures, one of which (theta = 0) is the
        classical result and one of which (theta = 1/2) is relayed and unread.
        It cannot certify that any concrete factorization costs any particular
        amount; it cannot certify which theta describes any real machine; it
        cannot bound the o(1); it cannot speak to batch NFS, to special NFS, or
        to any many-key regime; and it moves no exponent of the factoring
        problem itself. It also cannot certify HEUR-NFS-1, which every
        published NFS exponent including the classical one already assumes.
      nearby_object_control: >-
        TWO, BOTH ALREADY IN THIS PROGRAM'S CORPUS AND BOTH ZERO-COMPUTE.
        FIRST, THE OBJECT WHERE THE EFFECT MUST APPEAR: Shanks baby-step
        giant-step, the closest algorithm with a shared table, where
        KN-TECH-035 independently states the answer - n^(1/2) processor steps,
        n^(2/3+o(1)) full cost. The identical S^theta machinery must return
        n^(2/3) at theta = 1/3. A method that cannot reproduce the program's
        own established full-cost result on the simplest possible algorithm
        has not identified the load-bearing structure, and G4 makes that
        failure fatal to any NFS conclusion.
        SECOND, THE OBJECT WHERE THE EFFECT MUST NOT APPEAR: van
        Oorschot-Wiener collision search, which KN-TECH-057 records as keeping
        its exponent under full cost precisely because per-processor storage is
        O(1). The machinery must return NO theta-dependence for it. That is
        structurally the same statement as the NULL object G5, and the two
        being the same statement is a coherence check on the whole charging
        rule rather than two independent successes - which the contract must
        report as one control, not two.
    proof_obligations:
      - claim: >-
          c(0)^3 = 64/9, beta(0)^3 = 8/9, delta(0)^3 = 3, by an independent
          re-derivation rather than by evaluating the closed form.
        responsibility: baseline
      - claim: >-
          The Step-5 residual at (iii),(iv) is exactly zero as a rational.
        responsibility: correctness
      - claim: >-
          The surd collapse (radicand = (9/4) delta^2 (2+theta)^2 at the
          stationary delta) holds identically in theta, not just at the three
          named points.
        responsibility: correctness
      - claim: >-
          BSGS returns n^(2/3) at theta = 1/3 under the identical rule.
        responsibility: interface
      - claim: >-
          The null object returns a theta-independent exponent.
        responsibility: strictness
      - claim: >-
          HEUR-NFS-2's storage asymmetry is stated, its named hole (factor-base
          replication across processors) is recorded, and the symmetric
          alternative and its different answer are reported alongside.
        responsibility: feasibility
      - claim: >-
          Memory is reported beside time at every theta - beta(theta) is the
          memory exponent and is never omitted from a citation of c(theta).
        responsibility: memory
      - claim: >-
          No concrete-size statement, no exponent claim about the factoring
          problem, and no statement about a deployed key is derived from this
          record.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim:
    problem: >-
      Integer factorization of a balanced semiprime by the general number field
      sieve. NOTE CAREFULLY: the claim is about the COST MODEL of a fixed
      algorithm, not about a new algorithm, and the exponent that moves is an
      accounting exponent.
    prior_best: >-
      L[1/3, (64/9)^(1/3)] = L[1/3, 1.922999] heuristic time with memory
      uncharged; L^1.976...+o(1) area-time for a single key as RELAYED and
      UNREAD from KN-LIT-2663.
    time_exponent: >-
      c(theta) = (4(2+theta)^4/(9(1+theta)^2))^(1/3); in particular
      c(1/3) = (2401/324)^(1/3) = 1.949616 under the three-dimensional wiring
      convention this program has already declared.
    memory_exponent: >-
      beta(theta) = (4(2+theta)/(9(1+theta)^2))^(1/3); in particular
      beta(1/3) = (7/12)^(1/3) = 0.835550, down from (8/9)^(1/3) = 0.961500.
    hidden_cofactor: >-
      The entire o(1) in L[1/3, c + o(1)], uncontrolled and not small at 829
      bits; the polylogarithmic post-merge density d_row, treated as L[o(1)]
      but relayed as 252 at RSA-250; filtering and merge, charged nowhere;
      polynomial selection, charged nowhere; and the constant in the wiring
      model, which KN-TECH-035's own applicability limits describe as
      asymptotic with unextracted constants.
    claim_kind: cofactor_improvement
    claim_kind_note: >-
      Recorded as cofactor_improvement rather than exponent_improvement, and
      the choice is deliberate and conservative. Nothing here makes factoring
      cheaper or more expensive; it makes an ACCOUNTING exponent explicit where
      the program previously had none. Calling it exponent_improvement would
      invite exactly the misreading rule 4 forbids.

  heuristic_assumptions:
    - id: HEUR-NFS-1
      formal_statement: >-
        FOR ALL fixed epsilon > 0 THERE EXISTS n_0 such that FOR ALL n > n_0
        and FOR ALL (alpha, beta, delta) in the compact parameter region
        considered, the number of relations obtained from A candidate pairs
        differs from A . u^(-u) by a factor L[o(1)], where u is the ratio of
        the logarithm of the product of the two norms to log B. Equivalently:
        the two norms behave, for smoothness purposes, like independent
        uniformly random integers of their size.
      random_model_justification: >-
        The Canfield-Erdos-Pomerance theorem is a rigorous statement about
        UNIFORMLY RANDOM integers. The norms are not uniformly random: they are
        values of two homogeneous forms on a lattice region and carry
        systematic divisibility bias, the algebraic side being biased toward
        primes that split in K. The standard NFS position is that the bias
        contributes only to the o(1). NO RIGOROUS SUPPORT FOR THAT POSITION IS
        OFFERED HERE AND NONE IS CLAIMED. It is the single load-bearing
        heuristic of every published NFS exponent, including the (64/9)^(1/3)
        that G1 reproduces.
      supporting_results: []
      supporting_results_note: >-
        Deliberately empty. No citation is asserted because none was read for
        this record. Naming Canfield-Erdos-Pomerance and Dickman above is
        naming standard results, not claiming to have verified a statement of
        them; theorem numbers, pages and venues are absent because they were
        not checked.
      validation_experiment_ids: [EXP-RSA-3511df]
      falsification_condition: >-
        NOT falsified by this hypothesis and NOT NEEDED BY IT, which is the
        point of listing it. The heuristic enters Step 2 identically for every
        theta and therefore CANCELS in every comparison across theta; the
        DIFFERENCE c(theta) - c(0) is independent of it. That cancellation is
        itself a checkable algebraic claim and is gate G7 of the contract. If
        the cancellation fails to hold symbolically, the family's whole
        interpretation as a theta-comparison collapses even if each individual
        c(theta) is right.
    - id: HEUR-NFS-2
      formal_statement: >-
        STORAGE ASYMMETRY. THERE EXISTS a scheduling of NFS relation collection
        such that FOR ALL theta in [0,1] its full-cost exponent equals its step
        -count exponent alpha, the per-processor live storage being bounded by
        a function of the machine rather than of B; and FOR ALL schedulings of
        block Wiedemann on the post-merge matrix, the full-cost exponent is at
        least 2 beta + theta beta, the matrix being one shared object of size
        L[beta].
      random_model_justification: >-
        Not a distributional claim; an architectural one. Lattice sieving
        processes a bounded region per special-q and ECM-style cofactorization
        carries O(1) state per candidate, so neither needs a working set that
        grows with B. THE NAMED HOLE: the factor base must be reachable by each
        sieving processor, and if it must be REPLICATED across P processors the
        area becomes P . B and the asymmetry fails. This is stated as a hole,
        not defended. The second half is the same argument KN-TECH-057 makes in
        reverse when it gives MITM tau = S^(1/3) and van Oorschot-Wiener
        tau = O(1) for exactly this reason.
      supporting_results: []
      validation_experiment_ids: [EXP-RSA-3511df]
      falsification_condition: >-
        Falsified if the record computations' reported sieving deployments
        carried per-node working sets scaling with the factor base, which is a
        Stage-0 reading question. ALSO falsified analytically in the sense that
        the symmetric alternative gives 2.2435 at theta = 1/3 and 2.4038 at
        theta = 1/2, neither reproducing the relayed 1.976 - which is weak
        evidence FOR the asymmetric charge and is reported with that weakness
        attached rather than as a proof.
    - id: HEUR-NFS-3
      formal_statement: >-
        FOR ALL n, the post-merge matrix dimension N and the smoothness bound B
        satisfy N = B^(1+o(1)), and the average post-merge row density d_row is
        L[o(1)].
      random_model_justification: >-
        The first half is structurally forced: one column per factor-base
        element, and filtering only removes rows and columns. The second half
        is the weak one. At RSA-250 the relayed post-merge density is 252,
        which is not small, and calling it L[o(1)] hides a factor of a few
        hundred at every size a human will ever compute at.
      supporting_results: []
      validation_experiment_ids: [EXP-RSA-3511df]
      falsification_condition: >-
