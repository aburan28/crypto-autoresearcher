# H-ECDLP-cba67a
# Stage-0 Semaev S_3 worksheet for IDEA-20261006-06fe5e.
# One curve over F_41. Not a discrete logarithm.
hypothesis:
  id: H-ECDLP-cba67a
  question_id: RQ-ECDLP-001
  goal_id: GOAL-ECDLP-001
  source_idea: IDEA-20261006-06fe5e
  added: '2026-10-12'
  status: specified
  statement: >-
    On y^2 = x^3 + x + 2 over F_41, S_3 from KN-TECH-002 vanishes at
    each of the six chord sums of (0, 17), (1, 2), (3, 14), and (5, 3),
    and the six values at third coordinate 7 are 13, 33, 35, 11, 28,
    and 38 in the pair order (0, 1), (0, 3), (0, 5), (1, 3), (1, 5),
    (3, 5).
  test_boundary: >-
    One prime field, four points, and six pairs. No factor base, no
    S_4, and no cryptographic prime are inside this boundary.
  mechanism: >-
    The tracked object is the integer value of one explicit polynomial.
    The true third coordinate is the x-coordinate of the chord sum.
    Six zeros, and any other residue at coordinate 7, are the two
    finished readings.
  distinguishable_outcomes:
    - >-
      The points lie on the curve, the two evaluations agree, every
      true-sum value is 0, and the six values at 7 match the list.
    - >-
      The points lie on the curve, the two evaluations agree, and
      either a true-sum value is nonzero or a value at 7 differs.
    - >-
      A point leaves the curve, the evaluations disagree, or a sum is
      the point at infinity. That outcome invalidates the run.
  falsification: >-
    The worksheet is valid and either a true-sum value is nonzero or
    a value at third coordinate 7 differs from the pre-registered list.
  not_claimed: >-
    No index-calculus speedup, no comparison with Pollard rho, and no
    transfer to S_4 or to a cryptographic prime.
