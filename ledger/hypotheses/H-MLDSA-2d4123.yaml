  reduction_chain:
    core_problem: >-
      Decide, for each rejection predicate of FIPS 204 Algorithm 7 and each
      approved parameter set, whether the predicate can fire at all, whether a
      verifier can detect its omission, and at what rate it fires when it can.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. There is no reduction from any statement here to any
      statement about MLWE, MSIS, SelfTargetMSIS, EUF-CMA, SUF-CMA, or the
      difficulty of forging an ML-DSA signature, and none is claimed. A
      predicate that cannot fire is a fact about integer arithmetic at chosen
      parameters; it implies nothing about the scheme's security in either
      direction, and any citation of this hypothesis toward a security
      statement must carry that gap explicitly. RQ-MLDSA-ffa0f5's
      claim_tier_ceiling makes this binding rather than advisory.

