  interpretation_limits:
  - >-
    CLAIM TIER crypto for P1-P4 because they are evaluated at the real FIPS 204
    parameters with no scaling argument, and toy for any reduced cell. The tier
    may not be raised or lowered by any downstream citation, and the two must
    never be merged into one number.
  - >-
    NOT A BREAK, NOT A FORGERY, NOT A VULNERABILITY, NOT A DEFECT REPORT. A
    rejection branch that cannot fire is a fact about arithmetic at chosen
    parameters. Nothing here bears on MLWE, MSIS or SelfTargetMSIS in any
    direction, and under RQ-MLDSA-ffa0f5's claim_tier_ceiling any downstream
    sentence readable as such is defective regardless of what it measured.
  - >-
    P1-P3 ARE UNCONDITIONAL; P4 IS NOT. R_44 and the 0.991 are conditional on
    HEUR-MLDSA-T0U and HEUR-MLDSA-BND respectively and stay conditional however
    much sampling is done -- docs/claims-and-verification.md is explicit that
    experimental validation at any scale does not discharge a heuristic. Any
    summary, status line or cross-reference dropping the qualifier is a
    claim-tier violation.
  - >-
    THE PROOF ROLE IS NOT DETERMINED. GOAL-MLDSA-002's first criterion asks
    what the security argument loses when a signer omits a check. This
    hypothesis answers only the CORRECTNESS half. Writing "omitting the check
    leaks s2" or "the zero-knowledge property fails" is NOT licensed here and
    is named as the successor, which would have to engage KN-LIT-3907 and the
    published Dilithium analysis, neither of which this session has read.
  - >-
    THE UNREACHABILITY RESULT COVERS THE FIRST DISJUNCT OF LINE 28 ONLY.
    The second disjunct is reachable at all three sets; conflating them
    misstates the result.
  - >-
    A ZERO RATE BY THEOREM AND A ZERO COUNT BY SAMPLING ARE DIFFERENT OBJECTS
    AND MUST BE REPORTED DIFFERENTLY. RQ-MLDSA-ffa0f5's constraint that a zero
    observed count be reported as an upper bound with its sample size applies to
    ML-DSA-44 and does NOT apply to ML-DSA-65 or -87, where the correct report
    is the bound and its proof.

