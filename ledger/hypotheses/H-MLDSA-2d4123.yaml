  - >-
    F1 (ZERO COMPUTE, PRIMARY) -- any of tau, d, gamma2 re-reads differently
    from Table 1, or ||.||_inf turns out not to be the centred norm. P1-P2 fall
    and the hypothesis is withdrawn by a superseding record. The ML-DSA-87
    margin is 6.2 per cent, so this is the likeliest single failure.
  - >-
    F2 (ZERO COMPUTE) -- an explicit sk accepted by skDecode and a c in B_tau
    are exhibited at ML-DSA-65 or ML-DSA-87 with ||<<c t0>>||_inf >= gamma2.
    P1 is then false, which would be far more interesting than P1, and the
    record is superseded rather than amended.
  - >-
    F3 (MINUTES) -- the r0-omitted signer's emissions verify at 500/500. STEP 4
    is wrong, the census collapses to two cells, and the goal's original
    framing is vindicated against this hypothesis.
  - >-
    F4 -- the conforming arm does not verify 500/500 under the independent
    verifier. The implementation is wrong and NOTHING in the package may be
    reported, positive or negative.
  - >-
    F5 -- the G8 positive control does not fire at the synthetic reachable
    cell. The instrument cannot see the event; no negative result may be
    reported from any arm.
  - >-
    F6 -- the measured hint weight or the measured |<<c t0>>| quantiles depart
    from HEUR-MLDSA-T0U beyond the stated bands. R_44 is withdrawn. P1, P2 and
    P3 are UNAFFECTED, and the record must state which half survived which
    failure rather than reporting a single verdict.
  - >-
    F7 (THE PLANNED NEGATIVE, PRE-REGISTERED) -- if the hypothesis survives,
    the batch must still emit the statement that GOAL-MLDSA-002's first
    completion criterion is satisfiable at ML-DSA-65 and -87 by theorem and is
