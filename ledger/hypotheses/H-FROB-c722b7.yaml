  title: >-
    Odd degrees 3, 11 and 13 have genera 1, 5 and 6
  statement: >-
    Three minus 1 is 2, and 2 divided by 2 is 1. Eleven minus 1 is 10,
    and 10 divided by 2 is 5. Thirteen minus 1 is 12, and 12 divided by
    2 is 6. Twelve minus 1 is 11, which is odd, so degree 12 has no
    integer value of that quotient. Eleven plus 1 divided by 2 is 6,
    which is one above 5 and is the genus of degree 13, not of degree
    11. Two to the 3 is 8. Two to the 11 is 2048. Two to the 13 is
    8192. One hundred thirty-one times 51 is 6681, and 6725 minus 6681
    is 44, so 51 multiples of 131 lie at most 6725. One hundred
    thirty-one times 299 is 39169, and 39201 minus 39169 is 32, so 299
    multiples lie at most 39201.
  mechanism: >-
    The proposal reads the genus of y squared plus y equals f of odd
    degree d as (d minus 1) divided by 2. This contract checks that
    quotient at degrees 3, 11 and 13, and the two written multiple
    counts. It does not enumerate a curve.
  assumptions: []
