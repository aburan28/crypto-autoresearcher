hypothesis:
  id: H-SSI-125654
  title: Source-EndRing routing and collision loops for random-walk endpoints
  area: SSI
  question_ids: [RQ-SSI-1946c9]
  goal_ids: [GOAL-SSI-2fa82a]
  source_idea_ids: [IDEA-20261007-7625cc]
  status: proposed
  statement: >-
    For the exact bare-curve EndRing challenge distribution and fixed small
    ell, there may exist a polynomial Route(E,B,y) that accepts every complete
    evaluable basis B of End(E) and returns a bounded ell-isogeny path to an
    honest random-walk endpoint y; moreover, oracle access to successful
    endpoint relation inversion may yield enough collision loops to reconstruct
    a complete evaluable End(E) basis. Neither conjunct is established.
  mechanism: >-
    Publicly sample pi from E and publish only its endpoint. Trapdoor inversion
    would use the source ring basis to route to that endpoint. For extraction,
    compose a known sampled path with the dual of an inverter-returned path to
    obtain source endomorphisms, then generate and saturate their order.
  predictions:
    - >-
      Route remains correct and polynomial after every GL_4(Z) change of a
      certified full basis.
    - >-
      Collision loops obtained from a relation inverter span rank four and
      saturate to End(E) with an explicit polynomial success bound.
    - >-
      Any polynomial smaller witness sufficient for global routing either
      reconstructs a complete evaluable basis or supplies a counterexample to
      the necessity claim.
  falsification_criteria:
    - >-
      Source-ring-only Route cannot be defined without undeclared endpoint or
      alignment data for the exact interface.
    - >-
      A polynomial smaller witness routes all honest endpoints but does not
      reconstruct the complete ring.
    - >-
      An inverter can systematically return paths whose collision loops carry
      no rank-four or saturation information.
  test_boundary: >-
    This is a zero-run proof-search hypothesis. No PKE, security game theorem,
    parameter claim, or scientific observation is attached. The current packet
    records a typed obstruction at the missing Route algorithm.
  controls:
    - CEST/RWCT finite-evaluator regression
    - explicit edge/dual-edge endpoint collision
    - arbitrary GL_4(Z) basis-change audit
    - leaked-full-path publicly invertible control
  heuristic_assumptions:
    - source_ring_routing
    - collision_loop_generation
  target_complexity:
    time: polynomial in lambda and L for fixed ell
    memory: polynomial in lambda and L
    achieved: false
  proof_search_map: coordination/design/TASK-20261007-d54864/tasks/TASK-20261007-61dd3f/proof-search-map.yaml
  obstruction:
    type: missing_any_basis_inversion_algorithm
    affected_claim: first conjunct
    resource_check: >-
      Scoped symbolic search found no typed polynomial Route algorithm; no
      computation was launched because the missing object is definitional.
    argument: >-
      A full source basis is an input representation, not an algorithm for
      obtaining endpoint order data or a connecting path. Assuming such a
      router would assume the claim under test.
    forward_guidance: >-
      Construct a basis-invariant source-ring router or provide a scoped
      counterexample before any experimental design.
  dominated_by: unresolved
  sota_delta:
    quantitative_value: null
    reason: The target is polynomial, but no achieved algorithm exists.
  scientific_runs: 0
  created_at: '2026-10-07'
  producer_task_id: TASK-20261007-61dd3f
