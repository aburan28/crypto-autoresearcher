hypothesis:
  id: H-BINSTD-0f9bf7
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-493606
  experiment_id: EXP-BINSTD-6cca48
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-03'
  approved_at: '2026-10-03'
  authorised_by: DEC-20261003-4da874
  status: approved
  proposed_by: coordinator
  title: >-
    Pre-registered leaf-count affordability table for Koblitz-shaped m=4,l=8
    at n=37 is within factor 1.73 of the m=3,l=8 anchor, while the matched
    mu=1 null is ~64x that anchor (arithmetic Stages 0-1)

  statement: >-
    CLAIM (measurement / arithmetic corollary; NO ATTACK; NO EXPONENT; NO
    competitiveness with rho). Under IDEA-20260904-3c7a91's closed form
    N_conf(l,m,|G|)=round(2^{ml}/|G|) and IDEA-20260922-7ab503's |G|=m!*mu
    extension (assumed, not re-derived at m=4 under Stages 0-1), the
    Stage-0-frozen affordability table evaluates exactly to:
      (m=3,l=8,|G|=6) -> 2,796,203
      (m=4,l=8,mu=1,|G|=24) -> 178,956,971
      (m=4,l=8,mu=37,|G|=888) -> 4,836,675
      (m=5,l=6,mu=1,|G|=120) -> 8,947,849
      (m=5,l=6,mu=29,|G|=3480) -> 308,547
    with admissibility m(l-1)<=n holding for (4,8,37) and (5,6,29). Stages 0-1
    independently recompute these integers and ratios and emit exactly one
    O-* label. The expensive CNF-XOR m=4 cell (proposal Stage 3) is NOT
    authorized under this card. NO break. NO n>=131 transfer. NO rho claim.

  mechanism: >-
    OBJECT FRAME. Representation: leaf-count closed form over the CNF-XOR
    pdp model with symmetry group order |G|=m!*mu (mu=n on Koblitz-shaped
    a,b in F_2; mu=1 on the matched pseudorandom-shaped null). Operation set:
    nearest-integer arithmetic on 2^{ml}/|G| plus the admissibility predicate
    m(l-1)<=n. Trichotomy: Class II arithmetic corollary of an already-filed
    stabilizer mechanism (IDEA-20260922-7ab503). Lossy-projection: Stage 1's
    null is independent recomputation of the same closed form (must agree).
    OFF-LIMITS: claiming m=4 beats rho; treating a censored m=4 timeout as
    negative math evidence. WHAT IS NEW: a curve-shape-indexed affordability
    table closing one OPEN cell of the reachability table for binary CNF-XOR m>=4.

  predictions:
    - metric: leaf_count_table_match
      direction: flat
      minimum_effect: >-
        Independent Stage-1 recomputation equals every Stage-0-frozen
        integer exactly (O-ARITH-OK); any mismatch is O-ARITH-FAIL.
    - metric: ratio_koblitz_m4_to_anchor
      direction: flat
      minimum_effect: 4836675 / 2796203 approx 1.729 within relative 1e-9.
    - metric: ratio_null_m4_to_anchor
      direction: flat
      minimum_effect: 178956971 / 2796203 approx 64.0 within relative 1e-9.
    - metric: admissibility_cells
      direction: flat
      minimum_effect: m(l-1)<=n true for (4,8,37) and (5,6,29).

  test_boundary:
    instances:
      - Stage 0: freeze affordability table, forward-condition disclaimer, dependency gate
      - Stage 1: independent recomputation of all leaf counts + ratios + admissibility; RESULTS.md
    parameters:
      cells:
        - {m: 3, l: 8, mu: 1, n: null, predicted_leaves: 2796203}
        - {m: 4, l: 8, mu: 1, n: 37, predicted_leaves: 178956971}
        - {m: 4, l: 8, mu: 37, n: 37, predicted_leaves: 4836675}
        - {m: 5, l: 6, mu: 1, n: 29, predicted_leaves: 8947849}
        - {m: 5, l: 6, mu: 29, n: 29, predicted_leaves: 308547}
      anchor_leaves: 2796203
      koblitz_m4_ratio_bound: 1.73
    implementation: >-
      Pure Python under experiments/EXP-BINSTD-6cca48/implementation/;
      command surface implementation/run.py driven by trial-plan-v1.json
      (twin trial-plan.json). No Magma/Sage/cypari2/AUXIN/Bedrock. No CDCL.
    budget:
      wall_clock_seconds: 600
      memory_gb: 1
      maximum_runs: 3

  falsification_conditions:
    - Independent recomputation disagrees with any frozen leaf count (O-ARITH-FAIL).
    - Admissibility predicate fails for either authorized cell (O-ARITH-FAIL).
    - Editing frozen predictions after Stage-0 (protocol invalid).
    - Claiming rho competitiveness or n>=131 attack from this arithmetic (protocol invalid).
    - Treating later m=4 solver timeout as negative evidence under this card (protocol invalid).

  distinguishable_outcomes:
    - id: O-ARITH-OK
      meaning: >-
        Every frozen leaf count, ratio, and admissibility check matches
        independent Stage-1 recomputation. Arithmetic corollary stands as
        derivation; no CNF-XOR run claimed.
    - id: O-ARITH-FAIL
      meaning: >-
        At least one recomputed integer or admissibility check disagrees
        with the Stage-0 freeze. Proposal arithmetic error; table withdrawn
        pending correction via amendment.
    - id: O-ARTIFACT
      meaning: Freeze corruption, pin drift, or missing Stage-0 artifacts. No arithmetic claim kept.
    - id: O-IMPEDIMENT
      meaning: Infrastructure timeout/crash. Never negative evidence against H-BINSTD-0f9bf7.

  interpretation_limits:
    - Stages 0-1 verify ARITHMETIC only; they do not run a CDCL/CNF-XOR cell.
    - Central m=4 completion claim remains conditional on IDEA-20260922-7ab503 H1 at m=4.
    - Explicitly NOT a competitiveness-with-rho claim (proposal section E).
    - Toy / derived table only; no deployed-curve insecurity.
    - Stage 2+ (anchor reproduction run, m=4 CNF-XOR cell) needs a later decision.

  heuristic_assumptions:
    - id: HEUR-BINSTD-493606-H1
      formal_statement: >-
        FORALL cells in the Stage-0-frozen affordability table T, the
        nearest-integer evaluation of 2^{m*l}/(m!*mu) equals the frozen
        predicted leaf count, and m(l-1)<=n holds for every cell that names an n.
      random_model_justification: >-
        Rigorous: nearest-integer division of powers of two by factorials and mu.
        Classical: IDEA-20260904-3c7a91's N_conf law and IDEA-20260922-7ab503's
        |G|=m!*mu extension supply the closed forms; Stages 0-1 only audit
        the arithmetic evaluation, not the law's empirical validity at m=4.
      supporting_results:
        - IDEA-20260904-3c7a91
        - IDEA-20260922-7ab503
        - IDEA-20260904-b40e6d
      validation_experiment_ids:
        - EXP-BINSTD-6cca48
      falsification_condition: >-
        Any Stage-1 recomputed leaf count or admissibility check disagrees
        with the Stage-0 freeze (O-ARITH-FAIL).

  asymptotic_claim:
    problem: >-
      Whether standardized Koblitz shape makes an m=4 CNF-XOR cell affordable
      to measure on this lane's existing leaf budget (arithmetic gate only
      under Stages 0-1)
    prior_best: >-
      IDEA-20260807-32f96d reports zero measured m>=4 cells; no shape-indexed
      affordability table existed on the binary CNF-XOR side
    time_exponent: 'NO EXPONENT MOVED. Affordability arithmetic only.'
    memory_exponent: O(1) integer ops under Stages 0-1
    hidden_cofactor: Later CNF-XOR cells inherit 7ab503 normal-basis constructibility
    claim_kind: measurement_arithmetic_corollary

  proof_search_map:
    bottleneck: >-
      Whether the five leaf-count integers and two admissibility predicates
      evaluate exactly as claimed before any CDCL cell is attempted.
    baseline_embedding:
      parameter_slice: >-
        Stage 0 freezes T and the forward-condition disclaimer; Stage 1
        recomputes from closed forms alone.
      reproduction_check: >-
        Checker independently recomputes round(2^{ml}/(m!*mu)) and m(l-1)<=n.
    observation_collision:
      observable: the pair (cell_id, predicted_leaves)
      distinct_preimage_search: >-
        Broken by requiring the checker to recompute from (m,l,mu) alone and
        by pinning the closed-form source hash.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: Per-arity, per-shape affordability table at admissible (n,l) pairs.
        predicted_gain: Converts "m>=4 unmeasured" into a ranked affordability list.
    quantifier_order: >-
      FORALL cells in frozen table T the arithmetic identity holds. NOT claimed:
      that 7ab503 H1 holds at m=4; that any CDCL cell completes; that m=4 approaches rho.
    method_ceiling:
      strongest_certifiable_claim: >-
        O-ARITH-OK or O-ARITH-FAIL on the frozen table. Cannot certify CDCL
        completion or rho competitiveness.
      nearby_object_control: >-
        Independent checker recomputation; closed-form source pin;
        forward-condition disclaimer frozen before Stage 1.
    proof_obligations:
      - claim: Leaf-count integers equal round(2^{ml}/(m!*mu)).
        responsibility: correctness
      - claim: Admissibility m(l-1)<=n holds for (4,8,37) and (5,6,29).
        responsibility: correctness
      - claim: Forward-condition disclaimer (no rho claim) is frozen before Stage 1.
        responsibility: scope
      - claim: No CDCL/CNF-XOR cell is run under Stages 0-1.
        responsibility: scope
    not_applicable_reason: null

  dominated_by: >-
    CHECKED IDEA-20260922-7ab503 and IDEA-20260807-32f96d dominate as research
    objects; this record only adds the arithmetic affordability table corollary.
  sota_delta:
