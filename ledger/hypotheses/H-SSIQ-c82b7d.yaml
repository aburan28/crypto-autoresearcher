hypothesis:
  id: H-SSIQ-c82b7d
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  source_idea_ids:
    - IDEA-20261006-592877
  added: '2026-10-07'
  status: specified
  proposed_by: coordinator
  title: >-
    Max fiber of the z-coefficient of y on y^2 = x^3 + x over F_361,
    against y^2 = x^3 + 2x + 3
  statement: >-
    Let p = 19 and F_361 = F_19[z]/(z^2 - 2). Let E_A be y^2 = x^3 + x
    and E_N be y^2 = x^3 + 2x + 3, both over F_19 and base-changed to
    F_361. Write y(P) = y0 + y1 z with y0, y1 in F_19. Let m(E) be the
    maximum, over c in F_19, of the number of affine points P in
    E(F_361) with y1(P) = c. The prediction taken from
    IDEA-20261006-592877 is that m(E_A) - m(E_N) is at least 4. The
    concrete negative is that the instrument checks pass and
    m(E_A) - m(E_N) is at most 3, including a tie and a gap whose sign
    is opposite. A gap of at least 4 that is strictly smaller than the
    absolute difference of the two affine counts is neither success
    nor that negative: the source idea treats it as explained by
    sample size. The conditional isogeny exponent stays 1/3 and the
    rho exponent stays 1/2. No point-count integer is predicted.
  mechanism: >-
    The representation is the F_19-coordinate y1 of the Weierstrass
    y-coordinate in the basis {1, z}. The operation set is the
    singleton {pi}, the 19-power Frobenius, not the translation group.
    The class is partial-action: both equations are defined over F_19
    and z^2 - 2 splits in F_361, so pi sends y0 + y1 z to y0 - y1 z
    and y1(pi(P)) = -y1(P) depends only on y1(P). The open number is
    the max fiber of y1. E_N is the null curve of the same shape. The
    rectangle of all field elements, whose y1 fiber is 19, is an
    instrument check. No isogeny path is walked and no factor base is
    built.
  assumptions:
    - >-
      z^2 - 2 is irreducible over F_19. The source idea enumerated the
      squares and excluded 2. The driver recomputes the Legendre
      symbol of 2 and treats a square as an instrument failure.
    - >-
      E_N is nonsingular because 4*(2^3) + 27*(3^2) = 275 is congruent
      to 9 modulo 19. E_A is nonsingular because its B coefficient is
      0 and A is 1. The driver recomputes both residues.
    - >-
      Points at infinity have no y and are excluded. The sign-flip
      check is y1(pi(P)) = -y1(P) on every affine point, computed by
      powering, and one failure voids that arm.
    - >-
      If the fiber gap is smaller than the absolute difference of the
      affine counts, the gap is explained by sample size and is not
      success. Both counts are recorded and neither is predicted.
  proof_search_map:
    not_applicable_reason: >-
      This is a pre-registered fiber comparison at one prime, not a
      proof that any factor of the p^{1/3+o(1)} algorithm moves.
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
  predictions:
    - metric: max fiber gap of y1, m(E_A) minus m(E_N)
      direction: higher
      minimum_effect: at least 4
  test_boundary:
    instances:
      - y^2 = x^3 + x over F_19, affine points over F_361
      - y^2 = x^3 + 2x + 3 over F_19, affine points over F_361
    parameters:
      p: 19
      basis: z^2 - 2
      minimum_gap: 4
    implementation: experiments/EXP-SSIQ-9812bc/implementation/run.py
    budget:
      maximum_runs: 1
  falsification_conditions:
    - >-
      The instrument checks pass and m(E_A) - m(E_N) is at most 3.
    - >-
      A rectangle fiber other than 19, a failed sign flip, a zero
      discriminant, or a reducible basis polynomial is an invalid
      instrument, not this falsification.
  interpretation_limits:
    - >-
      A gap of at least 4 at p = 19 is a toy fiber gap. It does not
      move the exponent 1/3, does not shrink a cryptographic
      Wesolowski list, and does not show that y1 is a block of an
      isogeny action.
    - >-
      A negative closes only these two equations at p = 19 in this
      basis.
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        For these two short-Weierstrass equations over F_19, the
        histogram of y1 on E(F_361) has maximum bin on E_A at least 4
        larger than the maximum bin on E_N.
      random_model_justification: >-
        The source idea imitates a character sum that would bias one
        bin. The Hasse bound controls the point count only. The fiber
        gap is the unproved imitation.
      supporting_results: []
      validation_experiment_ids:
        - EXP-SSIQ-9812bc
      falsification_condition: >-
        The instrument checks pass and m(E_A) - m(E_N) is at most 3.
        A gap whose sign flips at the source idea's second scale,
        p = 31 with basis z^2 - 3, is outside this contract and would
        falsify the stability reading of HEUR-1, not this p = 19 row.
  structural_ingredients:
    - description: >-
        Generic discrete logarithms need Omega(sqrt(N)) group
        operations. This hypothesis claims exponent difference 0
        against that bound.
      citation: KR-RHO-13bf67
