        point_count: 98
        j_mod_p: 14
        role: ordinary_panel
      - id: artifact-j0
        equation: y^2 = x^3 + 1
        A: 0
        B: 1
        trace: 0
        point_count: 102
        j_mod_p: 0
        role: artifact_panel
        note: supersingular at p = 101
      - id: artifact-j1728
        equation: y^2 = x^3 + x
        A: 1
        B: 0
        trace: 2
        point_count: 100
        j_mod_p: 11
        role: artifact_panel
        note: j ≡ 1728 (mod 101); ordinary, extra automorphisms
    parameters:
      p: 101
      m: 3
      sample_size_primary: 64
      sample_size_redraw: 256
      base_field: F_101[z]/(z^2 + 2)
      frobenius: p^2-power
    implementation: >-
      Exact arithmetic in a deterministic splitting-field tower. No floating
      point. No monodromy computation was run while specifying this record.
    budget:
      maximum_runs: 2
      scientific_sample_cap: 256
      note: >-
        The sample counts 64 and one redraw to 256 are frozen. The run cap
        allows one infrastructure retry under a new run id.

  falsification_conditions:
    - >-
      Any scored permutation of Psi that does not preserve the inverse-pair
      partition falsifies containment of the image in W.
    - >-
      Image order 8 on all four ordinary curves, partition preserved, a
      4-cycle present, controls passing, and inertia agreeing, is the
      full-wreath reading on this panel. It falsifies the claim that this
      panel contains an exceptional ordinary curve. It does not prove the
      image equals W for every ordinary j.
    - >-
      Image order dividing 4 on all four ordinary curves, partition
      preserved, input-fibre control showing 8 distinct permutations, null
      quartic emitting cycle type 3+1, and inertia agreeing, falsifies the
      full-wreath reading on this panel.
    - >-
      Image order 8 on at least one ordinary curve and order dividing 4 on
      another, under the same controls and with inertia agreeing on curve
      ordinary-1 and on every curve scored as order dividing 4, is the
      exceptional-locus reading inside the panel.
    - >-
      Input-fibre control still below 8 distinct permutations after the one
      redraw to 256, a null quartic sample with no cycle type 3+1, or an
      inertia disagreement, makes the run inconclusive.

  interpretation_limits:
    - m = 3 and p = 101 only. No statement at cryptographic size and no transfer to m >= 4 or to any other prime.
    - No ECDLP exponent, no relation rate, and no decomposition algorithm.
    - Full image W on these four curves does not prove emptiness of an exceptional locus outside the panel.
    - The j = 0 artifact is supersingular at this prime. It is reported and then excluded from the ordinary tally.
    - Sorted-label Frobenius permutations can fabricate a group. An order reading is withheld when that group disagrees with the inertia subgroup.

