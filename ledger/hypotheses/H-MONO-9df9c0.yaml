# H-MONO-9df9c0 — specified from IDEA-20261005-ddbf31.
# Protocol approval is DEC-20261005-e74c17. This record asserts nothing
# about the image. No run has been performed.
hypothesis:
  id: H-MONO-9df9c0
  question_id: RQ-MONO-001
  source_proposal: IDEA-20261005-ddbf31
  goal_id: null
  goal_id_note: >-
    ledger/questions/RQ-MONO-001.yaml does not name a goal. This design does
    not attach one and does not edit GOAL-MONO-001.
  status: approved
  status_note: >-
    approved means the test protocol in EXP-MONO-220932 is approved for a
    later executor. It does not mean the image claim is supported. Status
    moves only by DEC-20261005-e74c17 under the standing user authorization
    of 2026-09-06. No monodromy permutation was computed in this design.
  proposed_by: coordinator
  conversion_note: >-
    The mechanism, the order-8 versus proper-subgroup split, the four-curve
    panel, the controls, and the falsification conditions are carried from
    IDEA-20261005-ddbf31. The Coordinator added only operational pins: the
    four ordinary curves and the two artifact curves at p=101, the field
    polynomial, the CPython sample streams, and the labelling-invariant form
    of the inertia comparison. Those pins were fixed before any run.

  statement: >-
    TEST BOUNDARY. m = 3, p = 101, char > 3. E is a nonsingular short
    Weierstrass curve y^2 = x^3 + A x + B over F_101. The base is the
    symmetric configuration space U_sym of unordered pairs, with coordinates
    (e1, e2), excluding the discriminant locus e1^2 - 4 e2 = 0 and excluding
    specializations whose signed-sum fibre Psi fails to have four distinct
    affine points. The fibre is Psi = {P+Q, -(P+Q), P-Q, -(P-Q)}, where
    {x(P), x(Q)} is the unordered pair with elementary symmetric coordinates
    (e1, e2). The tested homomorphism is rho_sym, the action on a labelling
    of Psi, compared with the wreath group W = (Z/2) wr S_2 of order 8, the
    setwise stabiliser of the inverse-pair partition
    {{P+Q, -(P+Q)}, {P-Q, -(P-Q)}}. No claim is made for m other than 3, for
    any prime other than 101, for a singular curve, or for the ordered base.
    The input fibre of the four points lying over {x(P), x(Q)} is an
    instrument control, not the object under test. H-MONO-0b3def already
    concerns that input fibre.

    PRE-REGISTERED PREDICTION, fixed before any run. On each ordinary curve
    in the panel below, the group generated by the Frobenius permutations of
    Psi is the full wreath W (order exactly 8, every permutation preserves
    the inverse-pair partition, and the group contains a 4-cycle). The
    negative side of the same prediction is a proper subgroup of W (order
    dividing 4) or a permutation that does not preserve the partition.

    DISTINGUISHABLE OUTCOMES. (1) Order 8, partition preserved, a 4-cycle
    present, on all four ordinary curves, with the controls and the inertia
    check passing: assigns the panel to the full-wreath reading. This does
    not prove the image equals W for every ordinary j. (2) Order dividing 4,
    partition preserved, on all four ordinary curves, controls and inertia
    passing: assigns the panel to a proper subgroup of W and falsifies the
    full-wreath reading on this panel. (3) Order 8 on at least one ordinary
    curve and order dividing 4 on another, controls and inertia passing:
    assigns an exceptional locus inside the panel. (4) Any Psi permutation
    that moves a point to the other x-coordinate without swapping the whole
    block: assigns non-containment in W. (5) A failed control or an inertia
    disagreement: inconclusive, and not a negative result.

  mechanism: >-
    Psi is a function of the unordered pair of x-coordinates. The deck
    transformations under test are the swap of the two summands and the
    negation of either summand, not the translation action of E. The
    projection that forgets y-coordinates sends Psi to the two-element set
    {x(P+Q), x(P-Q)} and discards the sign inside each inverse pair. That
    partition is a block system of the generated group if and only if every
    measured permutation preserves it; in that case the image lands in W.
    A permutation that sends one point of a block to the other x-coordinate
    without taking its inverse with it shows the partition is not a block
    system. The two x-roots of the summation polynomial are a different
    representation; this hypothesis permutes the four points.

  assumptions:
    - Characteristic greater than 3 and f squarefree, so E is nonsingular and the x-map is separable.
    - A specialization is scored only when Psi has four distinct affine points. Shorter fibres are dropped, not recorded as a smaller group.
    - j = 0 and j = 1728 are an artifact panel. They are computed and excluded from the ordinary tally.
    - At p = 101 every j = 0 curve is supersingular, because 101 ≡ 2 (mod 3). The pinned j = 0 artifact is therefore a supersingular-plus-automorphism curve. A small image there is not an ordinary exceptional locus.
    - No factor base is built and no discrete logarithm is solved.

  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
    not_applicable_reason: >-
      This is a measurement of one monodromy image at a pinned toy prime.
      It is not a proof, an asymptotic bound, a certificate family, a
      reduction, or a closure argument. No proof-search audit is required
      before the census, and none was omitted in order to skip one.

  asymptotic_claim:
    problem: none — no complexity improvement is claimed
    prior_best: unchanged rho exponent 1/2
    time_exponent: unchanged
    memory_exponent: unchanged
    hidden_cofactor: none introduced
    claim_kind: not_applicable

  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        For this cover, the p^2-power Frobenius permutations at 64 uniform
        good points (e1, e2) in F_{101^2} generate the arithmetic monodromy
        on Psi whenever every conjugacy class has positive density. The same
        sentence for the input fibre is the instrument check: that control
        must exhibit 8 distinct permutations.
      random_model_justification: >-
        Carried from IDEA-20261005-ddbf31, which points at the Chebotarev
        note KN-LIT-039. This design session did not re-open that note.
        The census does not treat H1 as proved. If the input-fibre control
        misses 8 distinct permutations, the image reading is withheld.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        The input-fibre control, on a redraw to 256 good points of the same
        curve, still shows fewer than 8 distinct permutations. That withholds
        the Psi reading. It is a failure of this sample as an instrument,
        not a disproof of Chebotarev for every cover, and not by itself a
        drop in the Psi image.
    - id: H2
      formal_statement: >-
        On a pinned ordinary curve at p = 101, the geometric image is
        generated by the tame inertia elements at the simple roots, along
        one transverse line, of the discriminant of the degree-4 encoding
        polynomial of Psi.
      random_model_justification: >-
        The source idea records a generation-by-inertia statement as
        provenance recalled and says no source was opened. This design
        session also opened no source for that statement. H2 is used only
        as a pre-registered agreement check against the Frobenius sample.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        The inertia subgroup and the Frobenius subgroup on the same curve
        disagree in order or in cycle-type inventory. The group-order
        reading is then withheld. The disagreement is not scored as a
        proper subgroup.

  predictions:
    - metric: order of the permutation group generated on Psi
      direction: different
      minimum_effect: >-
        Order 8, versus order dividing 4. Order 8 with the partition
        preserved is the full wreath on that curve. Order dividing 4 with
        the partition preserved is a proper subgroup of W.
    - metric: presence of a 4-cycle in the generated group on Psi
      direction: different
      minimum_effect: >-
        At least one 4-cycle, versus zero 4-cycles. A 4-cycle lies in W
        and does not lie in the subgroup that only flips signs inside blocks.

  test_boundary:
    instances:
      - id: ordinary-1
        equation: y^2 = x^3 + x + 1
        A: 1
        B: 1
        trace: -3
        point_count: 105
        j_mod_p: 34
