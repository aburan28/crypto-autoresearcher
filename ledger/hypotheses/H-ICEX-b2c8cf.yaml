hypothesis:
  id: H-ICEX-b2c8cf
  question_id: RQ-ECDLP-002
  source_idea_id: IDEA-20260808-f7e6e7
  title: >-
    Multi-target amortisation does not rescue exhaustive-solver prime-field
    index calculus against the CORRECT Kuhn-Struik baseline sqrt(T*N)- at
    sigma = 1 the shared cost is m!*N charged group operations independent of
    B and m, so the multi-target crossover T* is unattainable for every
    T <= N, and the honest replacement for 'index calculus wins with enough
    targets' is one admission inequality in (tau, sigma, beta, m)
  statement: >-
    (A) THE COMPARATOR IS FIXED FIRST, BECAUSE THE ERROR THIS RECORD TARGETS
    IS A BASELINE ERROR. Solving T discrete logarithms in one group of order
    N does NOT cost T*sqrt(N). Multi-target rho with a shared
    distinguished-point table costs about sqrt(T*N) charged group operations
    (Kuhn-Struik shape), at distinguished-point-table memory that must be
    charged on that side too. Every comparison below is against sqrt(T*N),
    never against T*sqrt(N).
    (B) THE CHARGED T-TARGET INDEX-CALCULUS TOTAL, in the cost frame of
    IDEA-20260808-f7e6e7 (which the source record labels E1-03), with factor
    base size B = N^{beta}, arity m, and solver cost a power B^{sigma*(m-1)}
    of the candidate count- C_total(T) = C_rel + C_LA + T*C_descent
    = m! N B^{(m-1)(sigma-1)} + m B^2 + T m! N B^{(m-1)sigma - m}.
    (C) CLAIM A, NEGATIVE AND EXACT WITHIN THE MODEL. At sigma = 1 the first
    term collapses to m!*N, INDEPENDENT OF B AND OF m- the solver's
    exhaustive cost exactly cancels the factor-base-size gain. Since the
    shared cost alone is m!*N, amortised index calculus beats sqrt(T*N) only
    if m!*N < sqrt(T*N), i.e. only if T > (m!)^2 * N. That is impossible
    because T <= N, and at T = Theta(N) every logarithm is obtainable by
    enumeration anyway. THEREFORE the multi-target crossover T* in the
    exhaustive-solver regime is not merely large, it is UNATTAINABLE- no
    target count rescues an exhaustive-solver prime-field index calculus
    inside this model.
    (D) CLAIM B, THE ADMISSION CONDITION, which is what replaces the informal
    argument rather than merely refuting it. Amortisation does relax the
    requirement once sigma < 1- the condition becomes
    m! N B^{(m-1)(sigma-1)} < sqrt(T*N) with 2*beta < log_N sqrt(T*N), which
    for T = N^{tau} gives sigma < 1 - (1 - (1+tau)/2)/(beta*(m-1)). Read as a
    lever- d(sigma_max)/d(tau) = 1/(2*beta*(m-1)), so each additional decade
    of targets buys exactly a (1+tau)/2 shift in the budget exponent and
    nothing more. At beta = 1/4 and m = 5 the derivative is 2, so ten decades
    of targets buy 2*(log_N of ten decades) in the sigma budget, which is
    negligible at cryptographic N. AMORTISATION IS A WEAK LEVER, AND THE
    INEQUALITY IS THE SCREENING TEST THAT SAYS SO.
    (E) UNCONDITIONALLY- nothing about ECDLP hardness. (C) and (D) are
    statements INSIDE the stated cost frame, and their only external
    dependence is that the multi-target baseline really is sqrt(T*N) with its
    memory charged, which EXP-ICEX-c32447 measures rather than assumes.
  mechanism: >-
    WHY THE CANCELLATION IS STRUCTURAL AND NOT A PARAMETER ACCIDENT. Relation
    collection and linear algebra are one-time costs shared across all T
    targets; only the descent is per-target. The shared relation cost is
    (number of candidate targets to try) x (cost of deciding one), i.e.
    (m! N / B^{m-1}) x B^{(m-1)sigma} up to constants. At sigma = 1 the two
    factors of B^{m-1} cancel identically, leaving m!*N with no B and no m
    dependence at all. That is why no choice of factor base can push the
    shared cost below N, and why the beta and m sweeps carry no information
    in this regime- they are an intended observation collision, and the
    experiment exhibits it deliberately.
    WHY THE CORRECT BASELINE CHANGES THE ANSWER. Against T*sqrt(N) an
    amortised one-time cost of m!*N looks favourable for large T; against
    sqrt(T*N) it never is, because the baseline itself already absorbs the
    amortisation. The whole disagreement between 'multi-target rescues index
    calculus' and this record is a disagreement about which curve the
    comparison is drawn against, which is exactly the class of defect this
    batch exists to price.
    WHAT IS NEW HERE AND WHAT IS INHERITED. The cost frame and the
    correction that M logs do not cost M*sqrt(N) are inherited
    (IDEA-20260807-406fef, cited internally by the source record). The new
    content is the closed-form consequence at sigma = 1 and the (tau, sigma,
    beta, m) admission inequality, neither of which appears in the prior
    records.
  assumptions:
    - >-
      COST UNIT- one charged operation is one GROUP OPERATION on E(F_p) (one
      point addition or one point doubling). Any quantity natively counted in
      F_p field operations is tagged as such and converted at a frozen
      declared rate kappa field multiplications per group operation, with
      kappa in {1, 10, 100} reported as separate rows. NO TOTAL MAY MIX
      UNITS- a field-operation count is never added to or subtracted from a
      group-operation total without its conversion recorded beside it.
    - >-
      MEMORY UNIT- stored group elements. Memory is reported beside time and
      is never added to it. The multi-target rho baseline is charged its
      distinguished-point table of about sqrt(T*N)/w elements for w
      processors; index calculus is charged N^{beta}. The comparison is
      therefore not memory-free on either side.
    - >-
      Relation count is Theta(B); sparse linear algebra is charged m*B^2 in
      the declared unit; targets are uniform; solver cost is a power
      B^{(m-1)sigma} of the candidate count. These are the source record's
      frame and are inherited, not validated here.
    - >-
      Kuhn-Struik multi-target rho attains sqrt(T*N) up to constants for the
      tested T with the distinguished-point table sized to the target count.
      This is HEUR-MT-1 below and is MEASURED by the contract, not assumed.
    - >-
      m! is superpolynomial in the large-m regime and is what makes Claim A's
      threshold (m!)^2 * N rather than N; it is disclosed rather than
      absorbed into a constant.
  proof_search_map:
    bottleneck: >-
      Whether the ONE-TIME cost of relation collection can be amortised below
      the multi-target rho baseline. The exact step whose removal changes the
      conclusion is the charge for deciding one candidate target, B^{(m-1)
      sigma}, against the number of candidates that must be tried,
      m! N / B^{m-1}.
    baseline_embedding:
      parameter_slice: >-
        T = 1 must reproduce the single-target statement of the same frame-
        max(C_rel, C_LA) against sqrt(N), with no amortisation term
        surviving.
      reproduction_check: >-
        Symbolic- substituting T = 1 into C_total collapses the amortisation
        term and recovers the single-target comparison identically. Frozen
        fixture- the measured shared cost at T = 1 must equal the measured
        shared cost at T = 64 to within the seed spread, since the shared
        cost does not depend on T by construction; a difference is an
        instrumentation defect, not a finding.
    observation_collision:
      observable: >-
        Amortised charged cost per target.
      distinct_preimage_search: >-
        COLLISION EXHIBITED DELIBERATELY. At sigma = 1, distinct (B, m) pairs
        give the SAME shared cost m!*N up to the m! factor, so the observable
        does not identify the configuration and the beta and m sweeps carry
        no information in this regime. The identifying tuple is
        (shared cost, per-target descent cost, memory), and the experiment
        reports all three separately for exactly this reason.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The (tau, sigma, beta, m) admission inequality
          sigma < 1 - (1 - (1+tau)/2)/(beta*(m-1)) as a single screening test.
        predicted_gain: >-
          Replaces an open-ended amortisation argument with one inequality
          that can be evaluated before any measurement is funded. NO ATTACK
          EXPONENT IS MOVED IN EITHER DIRECTION.
    quantifier_order: >-
      CLAIMED. FOR ALL T <= N and FOR ALL B, m- IF sigma = 1 THEN the
      amortised index-calculus total exceeds sqrt(T*N) in the declared unit.
      CLAIMED. EXISTS (T, sigma, beta, m) satisfying the stated inequality IF
      AND ONLY IF amortised index calculus beats the multi-target baseline in
      the declared unit. NOT CLAIMED- anything about extension fields, where
      sigma is effectively 0 and amortisation genuinely helps; anything about
      solvers outside the power-of-candidate-count family; any lower bound on
      ECDLP.
    method_ceiling:
      strongest_certifiable_claim: >-
        A comparator statement inside a stated cost model, at the tested toy
        sizes, with both sides' memory charged. NEVER a lower bound on ECDLP
        and never a statement about any solver whose cost is not a power of
        the candidate count.
      nearby_object_control: >-
        EXTENSION FIELDS, where sigma is effectively 0 and the SAME
        inequality predicts that amortisation DOES help- matching the
        published behaviour of Weil-descent index calculus. This is the
        control that the inequality is not vacuously negative. A method that
        returns 'amortisation never helps' on that object too has not
        identified the load-bearing quantity and is measuring nothing.
    proof_obligations:
      - claim: >-
          The shared cost is m!*N at sigma = 1, independent of B and of m.
        responsibility: runtime
      - claim: >-
          The multi-target baseline is sqrt(T*N) with its distinguished-point
          table memory charged.
        responsibility: baseline
      - claim: >-
          The admission inequality in (tau, sigma, beta, m) and its
          derivative d(sigma_max)/d(tau) = 1/(2*beta*(m-1)).
        responsibility: strictness
      - claim: >-
          Every reported total carries one unit tag and no total mixes group
          and field operations.
        responsibility: interface
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-MT-1
      formal_statement: >-
        Multi-target rho with a shared distinguished-point table solves T
        discrete logarithms in a group of order N in Theta(sqrt(T*N)) charged
        group operations, uniformly for 1 <= T <= N^{1/2}, with the
        distinguished-point table sized to the target count.
      random_model_justification: >-
        The birthday count for T targets in one group is exactly T*N/2 pairs,
        which gives the sqrt(T*N) shape rigorously; the constant depends on
        the walk and on the distinguished-point rate, and is what the
        measurement pins down. The imitation is the standard
        parallel-collision-search model in which the pseudorandom walk
        behaves like a uniform random function.
      supporting_results:
        - ref: KN-TECH-006
          provenance: internal
          claim: >-
            VERBATIM- 'expected ~0.886*sqrt(n) group operations serial;
            ~sqrt(n)/m wall-clock on m processors; small per-processor
            memory', the distinguished-point machinery, and the binding
            requirement that 'a claimed improvement must beat the
            fully-charged parallel cost -- including memory traffic and
            distinguished-point overhead -- not an idealized serial count'.
            WHAT IT DOES NOT SAY, AND THIS MATTERS FOR HEUR-MT-1- it states
            the SINGLE-TARGET constant only and contains NO multi-target
            sqrt(T*N) statement, so it supports the baseline's charging
            discipline and its single-target anchor but NOT the multi-target
            shape, which is why the contract MEASURES that shape instead of
            citing it.
          verified_by: >-
            coordinator, TASK-20260904-e87737 (technique abstract read in
            full this task, 38 lines; both quoted passages are verbatim)
        - ref: >-
            Kuhn and Struik, Random walks revisited- extensions of Pollard's
            rho algorithm to the multi-target setting
          provenance: recalled
          claim: >-
            The sqrt(T*N) multi-target shape. POINTER ONLY- no agent in this
            program has opened this source, it backs nothing here, and the
            contract measures the baseline instead of citing it.
          verified_by: null
      validation_experiment_ids:
        - EXP-ICEX-c32447
      falsification_condition: >-
        The measured multi-target rho arm's fitted exponent in (T*N) departs
        from 0.5 by more than 0.03 over the tested (T, N) grid. That is an
        instrument failure- the baseline implementation is wrong and EVERY
        comparison drawn against it is void, in either direction.
  structural_ingredients:
    - description: >-
        The parallel-collision-search baseline with distinguished points-
        the 0.886*sqrt(n) single-target constant, the memory/steps tradeoff
        set by the distinguished-point granularity, and the requirement that
        a claimed improvement beat the FULLY-CHARGED PARALLEL cost including
        memory traffic. The MULTI-TARGET sqrt(T*N) shape is NOT in this
        source and is measured in-contract rather than cited.
      citation: KN-TECH-006
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-e87737 (read in full this task, 38 lines)
      role: single-target baseline anchor and the memory-charging discipline
    - description: >-
        The two-term charged cost frame for prime-field index calculus and
        the instruction that amortised precomputation is charged separately
        and never folded into the per-trial cost.
      citation: IDEA-20260808-f7e6e7
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-e87737 (source proposal read in full,
        155 lines)
      role: the cost frame being evaluated
  reduction_chain:
    core_problem: >-
      Comparison of amortised T-target prime-field index calculus against
      multi-target collision search, inside a declared charged cost model at
      toy sizes.
    corollaries: []
  predictions:
    - metric: >-
        P1- shared cost (relation collection plus linear algebra) in charged
        group operations, at fixed N, as B is swept over a 16x range with an
        exhaustive solver
      direction: different
      minimum_effect: >-
        PRE-REGISTERED FLAT. The measured shared cost must vary by less than
        15 percent across the whole 16x range in B. A monotone trend
        exceeding 15 percent falsifies the cancellation identity of statement
        (C) and invalidates the records that rest on it.
    - metric: >-
        P2- shared cost in charged group operations against m!*N at fixed N,
        exhaustive solver
      direction: different
      minimum_effect: >-
        PRE-REGISTERED. Within a factor 2 of m!*N at every tested (B, m)
        cell. A measured shared cost below m!*N/2 at any cell falsifies
        statement (C).
    - metric: >-
        P3- ratio of the amortised charged index-calculus total to the
        MEASURED multi-target rho total on the same instances, in the same
        unit, at T in {1, 4, 16, 64}
      direction: higher
      minimum_effect: >-
        PRE-REGISTERED ABOVE 1 AT EVERY T. A single measured cell with ratio
        below 1 at any T <= N falsifies Claim A at the tested scale and the
        cost frame must be repaired before any record cites it again.
    - metric: >-
        P4- fitted exponent of the multi-target rho arm in (T*N)
      direction: different
      minimum_effect: >-
        FORCED 0.5 +/- 0.03. Outside that interval the baseline is
        mis-implemented, the run is an infrastructure outcome under AGENTS.md
        rule 5, and no comparison may be read from it.
    - metric: >-
        P5- d(sigma_max)/d(tau) evaluated symbolically over the (beta, m)
        grid
      direction: different
      minimum_effect: >-
        FORCED EXACT 1/(2*beta*(m-1)), verified to 1e-12 against the
        closed form; at beta = 1/4, m = 5 the value is exactly 2. Any
        deviation is an algebra error and halts the record.
  test_boundary:
    instances:
      - toy prime-field short-Weierstrass curves of prime order N
      - >-
        a CURVE-FREE arm on the additive group (Z/NZ, +) at matched N, with
        the factor base an interval of residues and 'decomposition' realised
        as subset-sum membership
    parameters:
      N: 'toy prime orders spanning 2^20 to 2^30'
      T: '1, 4, 16, 64'
      beta: 'swept over a 16x range in B at each N'
      m: '2, 3, 4'
      sigma: '1 (exhaustive solver) for the measured arms; swept symbolically in [0, 1] for the inequality'
      kappa: '1, 10, 100 field multiplications per group operation'
    implementation: >-
      Pure Python with an explicit operation counter; the existing toy index
      calculus harness instrumented to report the shared cost and the
      per-target descent cost as SEPARATE counters, plus a genuine
      multi-target rho implementation with a shared distinguished-point table
      whose memory is counted in stored group elements.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 2.0
      maximum_memory_gb: 8
      maximum_runs: 24
  falsification_conditions:
    - >-
      F1. A measured toy configuration in which amortised index calculus with
      an exhaustive solver beats the MEASURED multi-target rho arm at any
      T <= N in the declared unit. Claim A is wrong at the tested scale and
      the cost frame must be repaired.
    - >-
      F2. The measured shared cost varies with B by more than 15 percent
      under an exhaustive solver at fixed N. The cancellation identity of
      statement (C) is wrong, which invalidates several records at once and
      is the highest-value outcome available here.
    - >-
      F3. The multi-target rho arm's fitted exponent departs from 0.5 by more
      than 0.03. INSTRUMENT FAILURE- an infrastructure outcome under AGENTS.md
      rule 5, never negative mathematical evidence, and no verdict may be
      read from the run.
    - >-
      F4. The CURVE-FREE arm on (Z/NZ, +) FAILS to reproduce the flat-in-B
      shared cost that the curve arm shows. Then the flatness is not the
      counting identity it is claimed to be, and the discrepancy must be
      explained before either arm is cited.
    - >-
      F5. Everything holds. Then the multi-target crossover in the
      exhaustive-solver regime is recorded as unattainable within the model
      and at the tested sizes, the admission inequality becomes the lane's
      screening test, and no further multi-target measurement is funded until
      an input moves sigma below 1.
  interpretation_limits:
    - >-
      SCOPED TO THE STATED COST MODEL. Claim A is exact INSIDE the model
      (relation count Theta(B), sparse linear algebra, uniform targets,
      solver cost a power of the candidate count). It is not a lower bound on
      ECDLP and not a statement about any solver outside that family.
    - >-
      NOT A STATEMENT ABOUT EXTENSION FIELDS, where sigma is effectively 0
      and the same inequality predicts that amortisation genuinely helps.
      That object is the nearby-object control, not a counterexample.
    - >-
      THE CURVE-FREE NULL IS EXPECTED TO REPRODUCE THE SIGNATURE. The
      flat-in-B shared cost is a property of a counting identity, not of
      elliptic curves. If the (Z/NZ, +) arm reproduces it, as predicted, then
      NOTHING measured here may be quoted as a statement about elliptic
      curves or about the ECDLP; the result is about the cost frame.
    - >-
      TESTED AT TOY SIZES ONLY (N up to 2^30, T up to 64). The 'for all
      T <= N' quantifier of Claim A is a DERIVATION inside the model and is
      NOT testable at reachable scale- neither T = Theta(N) nor cryptographic
      N is reachable, and no measurement here bears on them.
    - >-
      One recalled pointer (Kuhn-Struik) backs nothing; the baseline is
      measured in-contract precisely because the citation could not be
      opened.
