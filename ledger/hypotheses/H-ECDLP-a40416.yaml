hypothesis:
  id: H-ECDLP-a40416
  question_id: RQ-ECDLP-002
  statement: >-
    On a small ordinary E/F_p (p around 1009) with S of prime order n coprime
    to p on a minimal Weierstrass model, the canonical order-n prime-to-p
    torsion lift S-hat and the functional D1(j,k) = v_p(x([k]S-hat) -
    x([j]S-hat)), truncated at precision r=8, take EXACTLY the two values
    {0, at least 8} predicted by ECDLP-IDEA-436's re-founded Proposition E
    (per DEC-20260901-255ebd): 0 off the fibre k = +/-j mod n, and at least 8
    on it -- with NO intermediate value strictly between 1 and 7 observed for
    any j, k pair. A structurally identical tabulation using an arbitrary
    Hensel lift of S that does NOT satisfy the order-n condition (so Lemma 1's
    torsion-freeness step does not apply) is predicted to show genuine
    intermediate valuations, discriminating the canonical-lift mechanism from
    a p-adic-library precision artifact.
  mechanism: >-
    Proposition E (ggm_simulability_gate_erratum_20260831.md section C.2,
    independently re-derived and confirmed by DEC-20260901-255ebd): the
    canonical torsion lift's reduction map is a group isomorphism
    E(Q_p)[n] to E(F_p)[n] (KN-TECH-73630e), so every lifted x-coordinate
    reduces exactly to its F_p value (Lemma 1), and on a Weierstrass model
    x(P) = x(P') implies P' = +/-P (Lemma 2), giving a two-valued fibre
    structure for the pairwise x-coordinate difference with no p-adic
    machinery beyond the deterministic lift itself.
  assumptions:
    - >-
      E/F_p ordinary, good reduction, p >= 3 (inherited from ECDLP-IDEA-436
      Assumption 1; per DEC-20260901-255ebd this is broader than strictly
      needed but is kept for consistency with the frozen idea record).
    - S of order n on E(F_p) with gcd(n, p) = 1.
    - Weierstrass model over Z_p realising the good reduction (v_p(discriminant) = 0), per R-F1.
    - Canonical order-n prime-to-p torsion lift at fixed p-adic precision r = 8.
  proof_search_map:
    not_applicable_reason: >-
      This hypothesis is a bounded empirical measurement (a toy-scale
      tabulation confirming or falsifying an already-derived Proposition), not
      a proof-oriented claim seeking a new asymptotic result; the derivation
      itself (Proposition E) was already produced, independently re-derived,
      and audited at derivation tier under
      ideas/artifacts/ECDLP-IDEA-436/ggm_simulability_gate_erratum_20260831.md
      and DEC-20260901-255ebd. This experiment supplies RC-1, the
      discriminating measurement control those records identify as the single
      remaining undischarged item before any KN-FIND promotion is warranted.
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: >-
        Reduction red : E(Q_p)[n] -> E(F_p)[n] restricted to prime-to-p
        torsion is a group isomorphism (surjective by good reduction,
        injective because the formal group kernel is pro-p and hence
        torsion-free away from p).
      citation: knowledge/techniques/KN-TECH-73630e.md
      provenance: internal
      verified_by: >-
        Independently re-derived from scratch by this orchestrating session
        (DEC-20260901-255ebd, coordinator-review.yaml claim
        proposition-E-derivation) and separately by the validator
        (TASK-20260831-c6ceb9, sealed blind re-derivation) on the prior
        review round.
      role: >-
        Establishes Lemma 1 (every lifted x-coordinate reduces exactly to its
        F_p value), the load-bearing fact this hypothesis measures.
  reduction_chain:
    core_problem: >-
      Whether the coordinate/valuation profile D1 on the canonical torsion
      lift supplies any computational leverage on ECDLP beyond the {+/-1}
      quotient Pollard rho's negation map already exploits (KN-OPEN-3417fc).
    corollaries: []
  predictions:
    - metric: 'image of D1 = v_p(x([k]S-hat) - x([j]S-hat)) truncated at r=8, over all 1 <= j < k < n'
      direction: different
      minimum_effect: >-
        Predicted image is exactly the two-element set {0, 8} (8 standing in
        for "at least 8" at this fixed truncation precision); ANY observed
        value strictly between 1 and 7 falsifies the Proposition outright.
    - metric: 'image of the identical D1 tabulation on a null (non-order-n-condition) Hensel lift'
      direction: different
      minimum_effect: >-
        Predicted to show genuine intermediate valuations (values strictly
        between 1 and 7), discriminating the canonical-lift mechanism from a
        p-adic-library precision artifact. If the null lift ALSO shows only
        {0, 8}, the observed flatness on the canonical lift is an artifact of
        precision handling, not a consequence of the isomorphism mechanism,
        and Proposition E's mechanism claim (not its bare tabulated values)
        would be undermined.
    - metric: >-
        Vandermonde (rigid, three pairwise differences) vs. one non-rigid
        three-point functional (e.g. x([k1]S-hat)*x([k2]S-hat) -
        x([k3]S-hat)), both on the canonical lift
      direction: different
      minimum_effect: >-
        Predicted (RTF-1, red-team TASK-20260831-62019a): the Vandermonde
        remains two-valued exactly as D1; the non-rigid functional takes
        finite values at least 1, showing the two-valued collapse is a
        property of rigidity (pairwise-difference / group-law-relation
        structure), not of p-adic lifts or coordinates generally.
  test_boundary:
    instances: >-
      One small ordinary E/F_p with p approximately 1009 (exact curve and n
      chosen by the executor at dispatch time and recorded in the run
      manifest), S of prime order n coprime to p, minimal Weierstrass model.
    parameters:
      p_approx: 1009
      precision_r: 8
      curve_selection: executor_chosen_recorded_in_manifest
    implementation: >-
      A single short Python script using exact integer/rational or a
      dedicated p-adic arithmetic library (e.g. sympy or a hand-rolled
      Z/p^r-Newton-Hensel lift); no cryptographic-scale arithmetic; no
      external network dependency.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 0.02
      maximum_memory_gb: 1
      maximum_runs: 1
  falsification_conditions:
    - >-
      Part 1: any observed v_p value strictly between 1 and 7 on the
      canonical lift falsifies Proposition E's literal tabulated claim
      outright.
    - >-
      Part 2: if the null (non-order-n) lift also shows only {0, 8}, the
      canonical-lift mechanism claim (not necessarily the bare two-valued
      fact) is undermined -- the observed flatness would then be attributable
      to precision-handling rather than the isomorphism argument.
    - >-
      Part 3: if the non-rigid three-point functional is ALSO exactly
      two-valued (matching the Vandermonde), the rigidity reading (RTF-1) is
      falsified and the collapse extends further than currently understood.
  interpretation_limits:
    - >-
      A finite-precision computation can only observe "at least r"; it can
      never observe or confirm infinity. Any record reporting this
      experiment's outcome must state this explicitly per red-team control
      RC-1's own disclosed limitation.
    - >-
      This is a toy-scale (p approximately 1009) measurement. Per
      docs/claims-and-verification.md's claim-tier table, a toy-tier result
      may assert direct measurements plus explicitly stated transfer
      arguments; it may not by itself assert anything about cryptographic-
      scale curves without an explicit, separately argued transfer claim,
      which this hypothesis does not make.
    - >-
      This result, however it resolves, does not touch disjunct D2 of
      ECDLP-IDEA-436, does not close KN-OPEN-3417fc (which quantifies over
      any computable non-group-theoretic invariant), and does not retier
      KN-FIND-002 or KN-FIND-b7e091 (routed separately per
      DEC-20260831-a9716f).
  status: approved
  proposed_by: coordinator
  approved_by: coordinator
  approval_note: >-
    Approved concurrently with proposal, per ordinary Coordinator authority
    (AGENTS.md rule 1). This hypothesis operationalizes RC-1, a control
    already commissioned by two committed Coordinator decisions
    (DEC-20260831-a9716f's Q-1, reaffirmed by DEC-20260901-255ebd's
    next_actions) as the single remaining undischarged item before any
    KN-FIND promotion on the ECDLP-IDEA-436/D1 derivation is warranted. No
    new Coordinator judgment is exercised beyond executing that
    already-recorded decision.
