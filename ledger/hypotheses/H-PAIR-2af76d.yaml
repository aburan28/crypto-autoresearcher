# H-PAIR-2af76d
# Coefficient bit length of Hilbert class polynomials on the
# fundamental discriminants with class number at most 16.
hypothesis:
  id: H-PAIR-2af76d
  question_id: RQ-PAIR-21313f
  goal_id: GOAL-PAIR-001
  source_idea: IDEA-20261005-3a18d1
  experiment_id: EXP-PAIR-894a7f
  specified_at: '2026-10-05'
  status: approved
  proposed_by: coordinator
  approved_by_decision: DEC-20261005-e86fbf
  title: >-
    Coefficient bit length tracks sqrt of the absolute discriminant
    inside class number 16
  statement: >-
    Let S be the fundamental discriminants D with -2000 <= D <= -3,
    class number h(D) at most 16, excluding D = -3 and D = -4.
    There are 611 fundamental discriminants in that closed interval,
    172 of them have class number above 16, and S has 437 elements.
    For each D in S, let b(D) be the bit length of the absolute value
    of the largest coefficient of the monic Hilbert class polynomial
    H_D, with the bit length of 0 equal to 0, and let
    c(D) = h(D) * b(D). A design-session enumeration, not a run,
    gives sum b(D) = 129230 and sum c(D) = 1324762. The average-rank
    Spearman correlation of c(D) with sqrt(|D|) is 0.616752204791,
    of h(D) with sqrt(|D|) is 0.444241687030, and of b(D) with
    sqrt(|D|) is 0.757850483701. The type-7 quartiles of
    b(D)/sqrt(|D|) are 8.15368529646991, 10.4308504094358, and
    13.0425542769067, so the upper-to-lower ratio is 1.59959009977408.
    The excluded rows are D = -3 with b = 1 and D = -4 with b = 11.
    No prime, pairing, or discrete logarithm is involved.
  mechanism: >-
    The constructor cost named by the idea is the class number times
    the largest-coefficient bit length, paid when the polynomial is
    written down. Class number alone is the control: on this sample
    its correlation with sqrt(|D|) stays below one half, while the
    coefficient bit length and the product stay above one half. The
    j = 0 and j = 1728 discriminants are kept out of the correlation
    because their extra automorphisms are a named confounder.
  assumptions:
    - >-
      A fundamental discriminant is a negative integer congruent to
      0 or 1 mod 4. If it is 1 mod 4 it is squarefree. If it is 0
      mod 4 then D/4 is 2 or 3 mod 4 and squarefree. D = -4 is
      fundamental and D = -2000 is not.
    - >-
      h(D) is pari qfbclassno. H_D is the monic polynomial returned
      by Sage hilbert_class_polynomial. Its degree equals h(D).
    - >-
      Spearman correlation is the Pearson correlation of average
      ranks. Tied values share the mean of their 1-based positions.
      The Pearson ratio uses sums of squares about the mean, and the
      sample-size factor cancels.
    - >-
      Quartiles use the type-7 rule. With 437 samples the positions
      0.25, 0.5, and 0.75 times 436 are the integers 109, 218, and
      327, so each quartile is that 0-based entry of the sorted
      ratios.
  proof_search_map:
    bottleneck: >-
      Whether the largest-coefficient bit length, rather than the
      class number, is what puts the constructor cost in step with
      sqrt(|D|) inside this cap.
    baseline_embedding:
      parameter_slice: >-
        Fundamental D from -2000 through -3, class number at most
        16, with -3 and -4 removed from the correlation.
      reproduction_check: >-
        Two constructions of each H_D agree as integer polynomials,
        the degree equals the class number, and the 437-row table
        matches the pre-registered checksum.
    observation_collision:
      observable: >-
        A reproduced table whose product correlation is at most 0,
        or whose quartile ratio exceeds 2.
      distinct_preimage_search: >-
        The class-number correlation on the same rows. It is
        pre-registered below one half and is not the cost metric.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The same polynomials, scored by coefficient bit length
          instead of by the product with the class number.
        predicted_gain: >-
          The bit-length correlation is larger than the product
          correlation. No discrete-log exponent moves.
    quantifier_order: >-
      For each fundamental D in the closed interval, accept it into
      S or record why not, then score S once.
    method_ceiling:
      strongest_certifiable_claim: >-
        The three correlations, the quartile ratio, and the table
        checksum on these 437 discriminants.
      nearby_object_control: >-
        D = -3 and D = -4, reported beside the sample and excluded
        from every correlation and quartile.
    proof_obligations:
      - claim: Degree equals class number on all 437 rows
        responsibility: baseline
      - claim: The table checksum and the three correlations match
        responsibility: correctness
      - claim: The quartile ratio is at most 2
        responsibility: size_bound
  predictions:
    - metric: spearman_output_bits
      direction: higher
      minimum_effect: >-
        0.616752204791 on S. The idea's threshold of 0.5 is met.
        A reproduced value at most 0 falsifies the cost shape.
    - metric: spearman_class_number
      direction: lower
      minimum_effect: >-
        0.444241687030 on the same rows. This control stays below
        the idea's 0.5 threshold.
    - metric: quartile_ratio
      direction: lower
      minimum_effect: >-
        1.59959009977408. A reproduced ratio above 2 falsifies
        HEUR-CM-HEIGHT-1 on this sample.
  falsification_conditions:
    - >-
      The two constructions agree, every degree equals the class
      number, and the Spearman correlation of c(D) with sqrt(|D|)
      is at most 0.
    - >-
      The same validity conditions hold and the upper-to-lower
      quartile ratio of b(D)/sqrt(|D|) is greater than 2.
    - >-
      A checksum mismatch, a degree mismatch, or a disagreement
      between the two constructions is a failed reproduction. It
      does not by itself falsify the cost shape.
  interpretation_limits:
    - The cap is |D| at most 2000 and class number at most 16. No cryptographic discriminant is claimed.
    - D = -3 and D = -4 are not evidence for or against the slope.
    - The 172 discriminants with larger class number are counted and not scored.
    - Pollard rho, grumpy giants, and the automorphism discount are unchanged.
  test_boundary: >-
    The regression sample S and the two excluded rows. Split
    traces, inert roots, truncation, conductor polynomials, and
    the large prime bins are not part of this record.
