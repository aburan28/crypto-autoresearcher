hypothesis:
  id: H-CLGRP-6f6b58
  question_id: RQ-CLGRP-66ab7f
  added: '2026-08-25'
  derived_from_idea: IDEA-20260809-843eb6
  statement: >-
    A certified sweep of imaginary quadratic class group computations at at least five
    declared discriminant sizes yields a MEASURED cost curve - operations and peak memory per
    algorithm phase - whose fitted subexponential parameters are stable under leave-one-out
    resampling, in the sense that omitting any single size moves the fitted leading parameter
    by less than 25 percent of its central value. If the fit is that stable, the sweep is a
    measured anchor for the discriminant sizes this program currently justifies by analogy to
    a different problem. If it is not, the sweep is too short to support any extrapolation and
    that must be stated rather than extrapolated through.
  mechanism: >-
    A standard subexponential relation-collection algorithm for the class group of an
    imaginary quadratic order proceeds in phases - factor-base construction, relation
    collection, linear algebra over the relation lattice, and structure determination - whose
    costs scale differently in the discriminant size and in the tuned factor-base parameter.
    Running that algorithm across a ladder of discriminant sizes, with the factor-base size
    and relation surplus DECLARED per size, and instrumenting operations and peak memory per
    phase, produces a cost curve rather than a single record. Emitting generators, relations
    and a structure statement as a certificate at each size makes each point independently
    checkable - a relation set that does not generate, or a structure statement inconsistent
    with the relation lattice, is not a data point. Fitting a declared model form to that
    curve and reporting residuals and leave-one-out movement is what converts a set of
    timings into a statement with an interval; the leave-one-out test is what decides whether
    the ladder is long enough for the fitted parameters to mean anything at all.
  assumptions:
  - >-
    The class number and group structure computed at every control size can be independently
    verified. At the small end this is by exhaustive enumeration of reduced binary quadratic
    forms, an exact and algorithmically independent method; at every size it is by
    re-verifying the emitted relations and structure certificate.
  - >-
    Algorithm parameters - factor-base size and relation surplus - are declared per size
    before the run. A tuning difference across sizes that is not declared would distort the
    curve and would be indistinguishable from a genuine cost effect.
  - >-
    Operation counts are instrumented counters, not wall-clock timings, so the fitted curve is
    a statement about the algorithm rather than about the host. Wall clock is reported
    separately and is never fitted.
  - >-
    Peak memory is a first-class cost, and the dominant data structure - the relation matrix
    over the factor base - is sized ANALYTICALLY from the declared parameters and reconciled
    against the measured peak resident set.
  proof_search_map:
    not_applicable_reason: >-
      Purely empirical cost measurement. No theorem is claimed, no asymptotic bound is
      improved, no certificate family is constructed in the KN-TECH-080 sense, and no
      reduction is offered. The deliverable is a measured curve with residuals and a stability
      test. Any later record that converts this curve into an extrapolated security statement
      IS proof-oriented and requires its own map; that separation is deliberate and is the
      reason the extrapolation is excluded from this hypothesis.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-CLGRP-6F6-1
    formal_statement: >-
      FOR ALL discriminant sizes in the declared ladder, the total operation count of the
      relation-collection phase is well described by a single subexponential model form
      L_{|D|}[1/2, c] with ONE fitted parameter c, uniformly across the ladder, so that the
      fitted c does not depend on which sizes are included.
    random_model_justification: >-
      The standard smoothness heuristic - that the norms of the reduced forms tested for
      smoothness behave like uniformly random integers of their size with respect to the
      factor base - is what makes the relation yield, and hence the exponent, take the
      subexponential form. That is a uniform-model appeal offered as such. The leave-one-out
      test is what checks it empirically over the tested range; it is not a proof and no
      distribution theorem is cited here.
    supporting_results: []
    validation_experiment_ids:
    - EXP-CLGRP-52980d
    falsification_condition: >-
      Leave-one-out omission of any single ladder size moves the fitted c by 25 percent or
      more of its central value, or the residuals show systematic curvature in one direction
      across the ladder. Either means one model form does not describe the whole ladder and no
      extrapolation is admissible from this sweep.
  - id: HEUR-CLGRP-6F6-2
    formal_statement: >-
      The declared per-size factor-base size and relation surplus are near-optimal at every
      size, so the measured curve is a curve of the ALGORITHM rather than a curve of the
      tuning schedule.
    random_model_justification: >-
      Not a distributional claim. It is a statement about the experimental schedule, recorded
      as a heuristic because a tuning schedule that is optimal at one end of the ladder and
      poor at the other produces a growth shape indistinguishable from a mathematical one -
      which is exactly the failure mode this record exists to expose rather than to commit.
    supporting_results: []
    validation_experiment_ids:
    - EXP-CLGRP-52980d
    falsification_condition: >-
      A parameter-perturbation probe at the largest and smallest ladder sizes - factor base
      scaled by 0.5 and 2.0 - that changes the measured operation count by more than the
      difference between adjacent ladder points. The schedule then dominates the curve and the
      fit is reported as a fit to the schedule.
  structural_ingredients:
  - description: >-
      Subexponential relation-collection algorithms for imaginary quadratic class groups, and
      the L-notation model form used for their cost.
    citation: null
    provenance: recalled
    verified_by: null
    role: the algorithm being measured and the declared model form for the fit. RECALLED - the parent proposal lists source references as REQUIRED READS that have not been retrieved, and no published cost figure is used in any derivation here.
  - description: >-
      Exhaustive enumeration of reduced binary quadratic forms of a given discriminant, which
      computes the class number and group structure exactly at small |D| by an independent
      method.
    citation: null
    provenance: internal
    verified_by: >-
      Executed at every control size as the known-value control; agreement is exact or the run
      is void.
    role: independent ground truth at the small end of the ladder
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
  - metric: Operation count and peak memory per algorithm phase, per discriminant size
    direction: higher
    minimum_effect: >-
      Growth consistent with the declared subexponential model form across the ladder. A
      materially different growth shape indicates an implementation or parameter-tuning problem
      rather than a mathematical finding, and the record must say so rather than report a new
      exponent.
  - metric: Leave-one-out movement of the fitted leading parameter c
    direction: lower
    minimum_effect: >-
      Below 25 percent of the central value when any single ladder size is omitted. Larger
      movement means the sweep is too short to support extrapolation, which must then be stated
      as the finding.
  - metric: Agreement of computed class number and structure with the independent enumeration at control sizes
    direction: different
    minimum_effect: >-
      EXACT agreement at every control size, with no tolerance. Any disagreement voids the
      instrument and no cost number may be used.
  - metric: Relation-certificate re-verification rate
    direction: higher
    minimum_effect: >-
      100 percent. Every emitted relation must be re-verified independently and the relation set
      must be shown to generate the claimed group. A size whose certificate fails is not a data
      point.
  - metric: Ratio of measured peak resident set to the analytically sized dominant structure
    direction: different
    minimum_effect: >-
      Within a factor 2 at every size. A larger discrepancy means the memory model does not
      describe the implementation and the memory column must be reported as measured-only, with
      the model withdrawn.
  test_boundary:
    instances: >-
      Imaginary quadratic orders of fundamental discriminant, at at least five declared sizes
      spanning a declared range, with the exact discriminants named before the run. Control
      sizes at the small end where exhaustive reduced-form enumeration is affordable.
    parameters:
      minimum_ladder_sizes: 5
      declared_range_bits: to be fixed in the frozen contract before approval
      control_sizes: the two smallest ladder sizes, where exhaustive reduced-form enumeration is affordable
      leave_one_out_threshold: 0.25
      parameter_perturbation_factors:
      - 0.5
      - 2.0
      instances_per_size: 3
    implementation: >-
      A single instrumented implementation used unchanged at every size, with per-phase
      operation counters and peak resident set sampling, and a certificate emitter for
      generators, relations and the structure statement. An independent re-verifier that does
      not share code with the producer checks every certificate.
    budget:
      wall_clock_seconds_per_run: 21600
      total_cpu_hours: 80.0
      maximum_runs: 30
  falsification_conditions:
  - >-
    Computed class number or group structure disagrees with the independent reduced-form
    enumeration at any control size. The instrument is void and no cost number from any size may
    be used.
  - >-
    Leave-one-out omission of any single ladder size moves the fitted leading parameter by 25
    percent or more. The fit is unstable, no extrapolation is admissible from this sweep, and
    that is the reported finding.
  - >-
    Residuals show systematic curvature in one direction across the ladder. One model form does
    not describe the whole range and the fit must be reported as local rather than as a law.
  - >-
    A parameter-perturbation probe moves the measured operation count by more than the
    difference between adjacent ladder points. The curve is a curve of the tuning schedule and
    is reported as such.
  - >-
    Any relation or structure certificate fails independent re-verification. That size is not a
    data point and the fit is recomputed without it, with the omission recorded.
  interpretation_limits:
  - >-
    Measured at the sizes actually run and at the declared parameters. The extrapolation to any
    deployed discriminant size is a SEPARATE record with its own interval, and is never a
    security verdict.
  - >-
    No attack is proposed and no cryptanalytic claim follows from any outcome. A cost curve is
    not a break.
  - >-
    The fitted parameter describes THIS implementation on THIS host at THESE tuned parameters.
    A different implementation would move the constant, and possibly the shape, and the record
    must not be cited as a property of the algorithm in general.
  - >-
    A stable fit does not license extrapolation beyond the ladder's range. It licenses the
    statement that the ladder is long enough for the fitted parameters to be reported with an
    interval - which is strictly weaker and is the whole claim.
  distinguishable_outcomes:
  - outcome: >-
      Every control size agrees exactly with the independent enumeration, every certificate
      re-verifies, at least five sizes complete, the fit's residuals show no systematic
      curvature, and leave-one-out movement of the leading parameter is below 25 percent.
    means: >-
      The program owns a measured cost curve with intervals for class group computation over
      the tested range. The next decision is whether to commission a separate extrapolation
      record - which is proof-oriented and gated - rather than to read a security consequence
      off this curve.
  - outcome: >-
      Controls and certificates pass, but leave-one-out movement is at or above 25 percent, or
      the residuals curve systematically.
    means: >-
      The sweep is TOO SHORT to support extrapolation. This is a genuine negative for the
      hypothesis as stated and is reported as one - the measured points stand as measurements,
      the fitted parameters do not stand as a law, and the forward guidance is the number of
      additional ladder sizes the observed movement implies would be needed.
  - outcome: >-
      A parameter-perturbation probe moves the operation count by more than an adjacent-size
      gap.
    means: >-
      The measured curve is dominated by the tuning schedule rather than by the algorithm's
      scaling. The result is reported as a curve of the schedule, and a re-tuned sweep with a
      declared optimality criterion per size is the named successor.
  - outcome: >-
      Any control size disagrees with the independent enumeration, or any certificate fails
      re-verification.
    means: >-
      INSTRUMENT VOID. Infrastructure signal under AGENTS.md rule 5, never negative mathematical
      evidence about class group cost. The run returns to the Executor with the failing size and
      certificate named.
  - outcome: >-
      Fewer than five sizes complete inside the budget.
    means: >-
      BUDGET-EXHAUSTED, not a negative. No fit is reported; the completed sizes stand as
      individual measured points with their certificates, and the ladder is re-planned.
  prior_evidence_refs:
  - IDEA-20260809-843eb6
  - GOAL-CLGRP-001
  status: proposed
  proposed_by: idea-generator
