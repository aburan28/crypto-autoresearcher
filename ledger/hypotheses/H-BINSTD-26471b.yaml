      Byte-level parse of the two curve blocks, and expansion of S_3 as a
      polynomial in x1, x2, x3, a, b.
    baseline_embedding:
      parameter_slice: >-
        Lines read on 2026-10-01: both Polynomial blocks are the hex integer
