  title: >-
    sect163k1 and sect163r2 share the field polynomial, a = 1 and cofactor 2,
    and differ in b; S_3 reads b and not a.
  statement: >-
    Parsed from analysis/binstd-curve-audit/binary-curve-params.txt, sect163k1
    and sect163r2 have the same reduction polynomial
    x^163 + x^7 + x^6 + x^3 + 1, the same A = 1 and the same cofactor 2.
    The Hamming weight of B is 1 on sect163k1 and 69 on sect163r2. In the
    polynomial S_3 = (x1*x2 + x1*x3 + x2*x3)^2 + x1*x2*x3 + b, every monomial
    coefficient of a is 0 and b occurs only as a degree-0 term in x1, x2, x3.
  mechanism: >-
    The summation polynomial written in the proposal depends on the curve
    only through the constant b. The deployed pair isolates that coefficient
    because the parameter file gives them the same field, a, and cofactor.
    This contract checks those identities. It does not run a solver.
  assumptions: []
  proof_search_map:
