        proposed_object: The coefficient of a in S_3, and the weight of B.
        predicted_gain: Separates the b-only term from a. No exponent movement.
    quantifier_order: >-
      After both curve blocks are parsed, the polynomials, A values and
      cofactors are equal and the B weights are 1 and 69. Separately, for
      every monomial in the expanded S_3, the exponent of a is 0, and every
      term that contains b has x-degree 0.
    method_ceiling:
      strongest_certifiable_claim: >-
        The parameter identity and the S_3 coefficient statement. Not a
        decomposition cost and not a comparison of the four toy cells.
      nearby_object_control: >-
        The mutant S_3 + a*x1. A checker that reports this mutant a-free is
