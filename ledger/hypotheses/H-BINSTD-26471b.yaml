        "1 (0x1)"; both cofactors are 2.
      reproduction_check: >-
        Two parsers recover those integers from the file and compare them
        with each other before any symbolic check is scored.
    observation_collision:
      observable: polynomial equality, B weights, and the a-coefficient of S_3.
      distinct_preimage_search: >-
        One expansion distributes the square. The other builds the polynomial
        from monomials. A mutant formula that adds a*x1 must be flagged as
        containing a.
    constructive_transforms:
