    98/111. The written tenth 9/10 exceeds 98/111 by 19/1110. The ratio
    of the two exact quotients is 37. Dividing 2^20 by 24 leaves quotient
    43690 and remainder 16. Dividing 2^24 by 24 leaves quotient 699050
    and remainder 16. The binomial C(35, 4) is 52360 and C(67, 4) is
    766480. The orders of 2 modulo 17, 23, 29, 31, 37 and 41 are 8, 11,
    28, 5, 36 and 20. The largest admissible dimensions at arity 4 are
    5, 6, 8 and 11. Among the stable dimensions, only 5 and 6 at degree
    31 meet that bound. The quotient (31 - 1)/5 is 6. The withdrawn
    ratio 1/31 lies strictly below 4/5, and the gap is 119/155.
  mechanism: >-
    The proposal says a factor n in the leaf count cancels on the orbit
    system, and that one toy degree hosts an admissible stable cell.
    This contract checks the divisions and the orders. It does not run
    a solver.
