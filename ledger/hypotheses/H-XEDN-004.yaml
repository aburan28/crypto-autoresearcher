hypothesis:
  id: H-XEDN-004
  question_id: RQ-XEDN-003
  statement: >-
    On non-isotrivial surfaces y^2 = x^3 + a(t)x + b(t) over F_p with a≠0,
    deg a≤4, deg b=6, and non-constant j, among free-x integral sections of
    shape deg x≤2 and deg y≤3, the infinity-norm of the shortest nonzero
    Mordell-Weil relation among the observed sections remains in {1,2,3}
    across p in {7,13,19,31} with no slope vs log p that excludes 0. Growth
    that excludes a constant upper bound of 3, or any verified shortest
    relation with infinity-norm ≥4, falsifies the hypothesis and blocks
    transferring the GOAL-XEDN-001 coefficient-bound closure to this raised
    deg-a window.
  mechanism: >-
    Expanding the a-degree window enlarges the moduli of non-isotrivial
    surfaces while keeping the free-x shape that makes f=x³+ax+b have even
    degree compatible with polynomial squares under deg b=6. If short relations
    persist, the coefficient bound is not an artifact of the narrower deg a≤2
    sample; if coefficients grow, that transfer must be withdrawn.
  assumptions:
    - Surfaces are non-isotrivial: a≠0 and j non-constant.
    - Free-x means deg x≤2, deg y≤3 under the frozen square predicate with content scaling.
    - Shortest relation means shortest nonzero integer relation in the infinity
      norm among observed sections, verified by group law / specialisation.
  predictions:
    - metric: max_|coeff|(p) of the shortest nonzero relation among observed free-x sections
      direction: lower
      minimum_effect: >-
        max_|coeff|(p) stays in {1,2,3} at every tested p with slope vs log p
        whose uncertainty includes 0.
  test_boundary:
    instances:
      - p in {7, 13, 19, 31}
      - section-rich non-isotrivial surfaces (target ≥2 free-x slots; prefer ≥5/size, ≥10 at p=31)
      - free-x sections deg x≤2, deg y≤3
    parameters:
      surface_family: "y^2 = x^3 + a(t)x + b(t), a≠0, deg a≤4, deg b=6, j non-constant"
      relation_extraction: "group-law short search primary; specialisation ≥20 fibres"
    implementation: experiments/EXP-XEDN-005
    budget:
      wall_clock_seconds: 3600
      maximum_memory_gb: 4
      maximum_runs: 6
  falsification_conditions:
    - >-
      max_|coeff|(p) grows so the slope vs log p excludes 0, OR any eligible
      surface has a verified shortest relation with infinity-norm ≥4.
  interpretation_limits:
    - Boundedness supports only this raised deg-a window at these sizes. Not B2 / crypto-scale.
  status: approved
  proposed_by: coordinator
