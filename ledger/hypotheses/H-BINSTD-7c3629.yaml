# =============================================================================
# H-BINSTD-7c3629 -- U-LABEL trace-parity / E/4E census lead.
# Specified from IDEA-20261001-39014f under RQ-BINSTD-b6f698 /
# GOAL-ECDLP2M-001. Approved DEC-20261002-0f09f5.
#
# U-LABEL (DEC-20260929-7257b2 portfolio rank 7): Stages 0-2 of the
# corrected Semaev-window parity rule with 153a90 closure section (T5) and
# IDEA-20260926-ae8f0a as constructive arm (HOLD-X11). Supersedes
# IDEA-20260922-1b16d7 (HOLD-K). ZERO RUNS in this design packet. No AUXIN.
# No Bedrock. No curve attack / exponent claim. Claim tier: mechanism
# measurement (at most one bit at matched window size). Stages 0-2 authorized.
# =============================================================================
hypothesis:
  id: H-BINSTD-7c3629
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261001-39014f
  experiment_id: EXP-BINSTD-f58be3
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-0f09f5
  status: approved
  proposed_by: coordinator
  title: >-
    At odd n, within the Newton bound, the half {c_0 = Tr(a)} of Semaev's
    polynomial-basis window is parity-aligned at every arity and its
    complement is exactly empty for odd-order targets at odd arity; on the
    eleven FIPS/SEC prime-degree rows the aligned half is the one-bit
    parameter rule of IDEA-20261001-39014f; at toy n=19 the yield factor and
    depth-2 class census match the preregistered bands

  statement: >-
    CLAIM (mechanism measurement; U-LABEL; NO ATTACK). Setting: binary curves
    E: y^2 + xy = x^3 + a x^2 + b over F_{2^n}; Semaev window
    V_k = span{1,t,...,t^{k-1}} with k <= n - s; pi(P) = Tr(x_P) + Tr(a)
    the E/2E quotient. HYPOTHESIS: (S0) D1-D6, the eleven-row per_row_table,
    Proposition C1, and the yield identity 2/(1+(1-2theta)^m) re-verify as
    written in IDEA-20261001-39014f (blocking zero-compute gate). (S1) At
    n=19, a in {0,1}, l=10: parity_violations = 0; complementary half at
    m=3 yields exactly 0 on odd-order targets while nonzero at m=2;
    aligned/random-hyperplane yield ratio within the P-3 band; mirror
    targets exchange half roles exactly (P-4). (S2) On a=0: beta_2 matches
    direct [r']P membership; class_sum_violations = 0; depth-2 histogram
    balanced within 3 binomial SD of 1/2 (or a named structure finding);
    no affine hyperplane of the aligned window is class-pure beyond the
    random-label null (P-8); a=1 reports beta_2 undefined; curve/replica
    ratios in [0.5,2] (P-9). CLAIM TIER: measurement. Net gain at most one
    bit at matched window size under H-39014f-1. NO exponent. NO ECC2K-130
    break. NO Magma/Sage/AUXIN. Tripwire T5 (153a90 closure / C1 filing)
    is carried, not adjudicated as a KN-OPEN closure under this card.

  mechanism: >-
    OBJECT FRAME. Representation R1 (x-coordinate in an F_2-affine window).
    Operation set Sigma: translation by factor-base elements (Class I),
    refined by the quotient homomorphism pi: E(F_q) -> E/2E. Tracked
    object: the relation vector over the factor base; pi labels each LEG.
    Trichotomy: partial-action. Lossy projection P -> pi(P) is
    Sigma-compatible (homomorphism) and lossy (fibres are cosets of 2E).
    WHAT IS NEW relative to superseded IDEA-20260922-1b16d7 and nearest
    IDEA-20260915-3119c9 / IDEA-20260913-cedd2f / IDEA-20260915-8fe0ef:
    (i) corrected odd-m emptiness direction; (ii) per-row c_0 = Tr(a) rule
    from primary standards; (iii) all-m yield factor with matched-size
    comparator; (iv) D1-D6 derived in-record; (v) closure section reduced
    to Sigma_T with solver-free E/4E census. Charged stage: factor-base
    window label / leg-side 2-power class — not a solve and not a rho
    comparison. ae8f0a (HOLD-X11) is the constructive Z/4 arm under this
    unit's shared H1 metric with 5628bc (cited, not redesigned).

  assumptions:
    - >-
      Group-law facts D1-D6 as derived in IDEA-20261001-39014f; nothing
      relayed from the superseded 1b16d7 claim text.
    - >-
      Per-row a, n, f read from frozen FIPS 186-4 and SEC 2 texts under
      inputs/; OpenSSL dumps are out of scope.
    - >-
      Yield factor 2 under H-39014f-1 is an expectation over targets, not
      uniform per target; exact emptiness at odd m for the complementary
      half is combinatorial (no heuristic).
    - >-
      Executable work is toy-tier n=19 only; deployed-row figures are
      Stage-0 parameter rules, not measured costs.
    - >-
      OFF-LIMITS: KN-OPEN-020 affine-subspace class inherited; not escaped.
    - >-
      Amazon Bedrock prohibited. No AUXIN. No Magma/Sage as success path.
    - >-
      Tripwire T5: whether Proposition C1 is filed as a closure is a
      review-breakthrough question; this contract measures the census and
      does not promote a KN-OPEN closure.

  proof_search_map:
    bottleneck: >-
      Which half of a polynomial-basis window carries the target class at
      each arity on each deployed row, what that choice is worth at matched
      size, and whether the depth-2 E/4E label is affine on the aligned
      window (census P-8).
    baseline_embedding:
      parameter_slice: >-
        Even-n window (both halves identical; rule must have no content);
        at odd n with theta=1/2 the factor formula reproduces 3119c9's 2x
        class-alignment gain at m=3.
      reproduction_check: >-
        Stage 0: symbolic D4 at even n and theta=1/2,m=3 identity check;
        Stage 1: F0/F1 reporting and mirror-target role exchange; any
        disagreement localises to D4 or the counting identity.
    observation_collision:
      observable: >-
        Decompositions per target per window half; depth-2 class histogram
        of the aligned window.
      distinct_preimage_search: >-
        Zero at odd m could be parity (claimed) or a window too small —
        separated by nonzero m=2 on the same half and by mirror targets.
        Yield ratio near 2 could be alignment or side-bit imbalance —
        separated by measured theta, RH, and RS controls. Depth-2 imbalance
        separated by relabelled Z/(4r') replica and random-label null.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Aligned half {c_0 = Tr(a)} of V_k (or matched-size affine slice
          A_k), selected by one linear condition.
        predicted_gain: >-
          Factor 2/(1+(1-2theta)^m) ≈ 2 in decompositions per target at
          matched size, every m; exact zero for the complementary half at
          odd m.
      - transform: observable_fiber
        proposed_object: >-
          Hold parity label fixed; vary forgotten depth-2 class (W_0 vs W_2)
          on the cofactor-4 cell.
        predicted_gain: >-
          Yield ratio 2^{1-m} vs parent; 2 vs size-matched random half; no
          affine hyperplane of the aligned window is class-pure.
    quantifier_order: >-
      FOR EVERY curve of the stated form, EVERY odd n, EVERY k <= n-s,
      EVERY odd-order target R and EVERY odd m: the half {c_0 = 1+Tr(a)}
      yields zero decompositions of R (exact). FOR EVERY prime-order G and
      EVERY S ≠ O in G: no nontrivial <S>-invariant partition (C1). The
      yield factor ≈2 is an expectation under H-39014f-1, NOT uniform per
      target. NOT CLAIMED: solver cost, solving degree, total IC vs rho,
      non-polynomial bases beyond the normal-basis weight statement.
    method_ceiling:
      strongest_certifiable_claim: >-
        At odd n within the Newton bound the half {c_0 = Tr(a)} is
        parity-aligned at every arity and its complement is exactly empty
        for odd-order targets at odd arity; on the eleven FIPS/SEC rows the
        aligned half is as per_row_table; at n=19 the yield factor and
        depth-2 census match P-1..P-9. Never certifies solver cost, solving
        degree, total cost against rho, or a deployed break.
      nearby_object_control: >-
        Even-n window; mirror targets in E\2E; cofactor-2 sibling for
        depth-2 (undefined); relabelled generic-group replica; random
        hyperplane RH; random subspace RS; random-label null for purity.
    proof_obligations:
      - claim: Halving criterion and pi a homomorphism with pi=0 on G (D1-D3).
        responsibility: correctness
      - claim: Tr(t^j)=0 for 1<=j<=n-s-1 and Tr(1)=n mod 2 (D4).
        responsibility: correctness
      - claim: Per-row a,n,f from FIPS 186-4 and SEC 2 (per_row_table).
        responsibility: baseline
      - claim: Exact odd-m emptiness of the complementary half.
        responsibility: correctness
      - claim: Yield factor under H-39014f-1 within P-3 band at n=19.
        responsibility: success_probability
      - claim: Proposition C1 stated with scope; T5 filing deferred.
        responsibility: scope
      - claim: Depth-2 bit formula defined exactly when Tr(a)=0 (D5,D6).
        responsibility: correctness
      - claim: Nothing here bounds solver cost, solving degree, or cost vs rho.
        responsibility: scope
    not_applicable_reason: null

  asymptotic_claim:
    problem: >-
      ECDLP index-calculus factor-base window selection on odd-degree
      FIPS/SEC binary curves (parity / 2-power leg labels)
    prior_best: >-
      Semaev full V_k; class-aligned slices (3119c9) at m=3; superseded
      1b16d7 with reversed even-m emptiness
    time_exponent: >-
      unchanged; at most one bit in decompositions per target at matched
      window size (requirement on yield, not a measured solver cost)
    memory_exponent: unchanged (window description O(k))
    hidden_cofactor: >-
      depth-2 membership cost if non-linear (open number); H-39014f-1
      transfer from n=19 to deployed n
    claim_kind: constant_factor

  heuristic_assumptions:
    - id: H-39014f-1
      formal_statement: >-
        Admissible m-sums equidistribute on the coset 2E (respectively on
        the relevant E/4E class for Stage 2), so expected decompositions
        per odd-order target scale by 2/(1+(1-2theta)^m) for an aligned
        window versus a size-matched control with label fraction theta.
      random_model_justification: >-
        Exact counting identity for the fraction of m-multisets satisfying
        the parity constraint; equidistribution imitates classical
        occupancy on the coset. Failure mode: coset concentration or
        window too small.
      supporting_results:
        - IDEA-20260915-3119c9 (internal; H2 / class-alignment at m=3)
        - IDEA-20260913-cedd2f (internal; parity mechanism)
      validation_experiment_ids:
        - EXP-BINSTD-f58be3
      falsification_condition: >-
        Aligned/RH yield ratio outside [0.71,1.41] times
        2/(1+(1-2theta)^m) at n=19 after measured theta (P-3).
    - id: H-39014f-2
      formal_statement: >-
        On the aligned window of the cofactor-4 cell, the depth-2 bit
        beta_2 behaves like a balanced random bit (histogram within 3
        binomial SD of 1/2) and is not an F_2-affine function of the
        window coordinates.
      random_model_justification: >-
        D5 gives a well-defined bit on 2E when Tr(a)=0; no reason for
        affinity on V_k is derived. Failure mode: a class-pure affine
        hyperplane (positive surprise).
      supporting_results:
        - IDEA-20261001-39014f D5-D6 (internal)
        - IDEA-20260926-ae8f0a (internal; constructive Z/4 successor)
      validation_experiment_ids:
        - EXP-BINSTD-f58be3
      falsification_condition: >-
        Histogram beyond 3 SD of 1/2 not reproduced by the replica, or a
        class-pure / beyond-null hyperplane in the exhaustive scan (P-6,P-8).

  structural_ingredients:
    - description: >-
        Halving criterion Tr(x)=Tr(a) iff P in 2E; pi homomorphism E->Z/2.
      citation: IDEA-20261001-39014f D1-D3 (derived); FHLM CACR CORR 2003-18 §4 as pointer only
      provenance: internal
      verified_by: coordinator (this design; D1-D3 read from the idea record)
      role: exact emptiness / alignment certificates
    - description: Newton's identities for Tr(t^j) on the polynomial basis window.
      citation: IDEA-20261001-39014f D4
      provenance: internal
      verified_by: coordinator (this design)
      role: c_0 = Tr(x) at odd n inside Newton bound
    - description: Matched rho / ambient conventions (not used as a cost claim here).
      citation: CORR-20260922-81aeab; CORR-20260928-4cb669
      provenance: internal
      verified_by: coordinator (cited for scope honesty only)
      role: scope — no IC-vs-rho claim under this card

  reduction_chain:
    core_problem: >-
      Parity / 2-power leg-label measurement on Semaev windows at toy n=19
      with Stage-0 deployed-row parameter rule
    corollaries: []

  predictions:
    - metric: parity_violations
      direction: lower
      minimum_effect: exactly 0 (P-1)
    - metric: complementary_half_yield_m3_odd_targets
      direction: lower
      minimum_effect: exactly 0 while nonzero at m=2 (P-2)
    - metric: aligned_over_RH_yield_ratio
      direction: higher
      minimum_effect: within P-3 band of 2/(1+(1-2theta)^m)
    - metric: mirror_target_half_roles
      direction: different
      minimum_effect: roles exchange exactly (P-4)
    - metric: class_sum_violations_a0
      direction: lower
      minimum_effect: exactly 0 (P-5)
    - metric: depth2_histogram_balance
      direction: different
      minimum_effect: within 3 binomial SD of 1/2 or named structure finding (P-6)
    - metric: class0_over_parent_yield_ratio
      direction: lower
      minimum_effect: within [0.5,2] times 2^{1-m} (P-7)
    - metric: max_affine_hyperplane_class_purity
      direction: lower
      minimum_effect: no class-pure beyond random-label null (P-8)
    - metric: curve_over_generic_ratio
      direction: different
      minimum_effect: within [0.5,2] on Stage-2 metrics (P-9)

  distinguishable_outcomes:
    - id: O-POSITIVE
      when: >-
        P-1..P-9 hold (or P-6 reports a named structure finding with
        replica separation); Stage 0 re-verify passes.
      means: >-
        Corrected per-row rule and one-bit pricing stand at toy scale;
        depth-2 label balanced and not affine (membership cost remains
        the open number for ae8f0a).
    - id: O-NEGATIVE-MECHANISM
      when: >-
        Parity violation, odd-m complementary-half decomposition, or
        yield ratio outside P-3 band.
      means: >-
        D2/D4 fails for this shape, or H-39014f-1 fails; one-bit statement
        withdrawn for the tested cell.
    - id: O-DEPTH2-AFFINE
      when: Class-pure or beyond-null hyperplane (P-8 fail).
      means: >-
        Positive surprise: depth-2 label is affine on this window; report
        as finding and route to review before interpretation.
    - id: O-ARTIFACT
      when: >-
        RH/RS with F0=0 or zero yield; a=1 reports defined beta_2;
        certificate/replica instrument failure; Stage-0 setup
        irreducibility/order check fails.
      means: Run void; asserts nothing about the mechanism (AGENTS.md rule 3).
    - id: O-IMPEDIMENT
      when: Advisory budget / dependency missing (numpy etc.).
      means: Infrastructure stop; not negative mathematical evidence.

  test_boundary:
    instances:
      - >-
        Toy Koblitz pair at n=19, a in {0,1}, one irreducible f with
        n-s >= 11 (candidate t^19+t^5+t^2+t+1), windows at l=10.
      - >-
        Stage-0 arithmetic on the eleven FIPS/SEC prime-degree rows
        (parameter rule only; no deployed decomposition runs).
    parameters:
      n: 19
      l: 10
      m: [2, 3]
      targets_odd: 40
      targets_mirror: 20
      arms: [a0_koblitz, a1_twist]
    implementation: >-
      Pure-Python (+numpy optional) over EXP-CERTBIN-e94b27/impl gf2n/curve
      primitives or equivalent under this experiment's write_scope; exhaustive
      m=2/m=3 census; no external CDCL/Groebner as success path.
    budget:
      wall_clock_seconds: 14400
      memory_gb: 4
      maximum_runs: 6

  falsification_conditions:
    - 'P-1: any parity_violation > 0 voids POSITIVE.'
    - 'P-2: any odd-m complementary-half decomposition on odd-order targets.'
    - 'P-3: aligned/RH ratio outside the stated band after measured theta.'
    - 'P-5: any class_sum_violation on the a=0 cell.'
    - 'Instrument: a=1 reports defined beta_2; RH/RS artifact; Stage-0 setup fail.'
    - >-
      Infra timeout/crash is O-IMPEDIMENT, never evidence against
      H-39014f-1/2 (AGENTS.md rule 5).

  interpretation_limits:
    - Toy tier n=19; deployed rows are Stage-0 parameter rules only.
    - At most one bit at matched window size; not free on top of full V_k.
    - No solver-cost, solving-degree, or IC-vs-rho claim.
    - Proposition C1 / T5 closure filing is out of scope for promotion here.
    - KN-OPEN-020 class not escaped.

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
