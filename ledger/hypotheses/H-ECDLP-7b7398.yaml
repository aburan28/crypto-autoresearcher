  statement: >
    Fix the multiplicative N^2-th-root
    uniqueness on F_p^* before any
    cubical point, division polynomial,
    Tate pairing, DL-spectrum, Coppersmith
    solve, Semaev polynomial, or Velu map
    is read. Stage 0 asserts only that
    lambda |-> lambda^(N^2) is a bijection
    of F_p^* exactly when gcd(N, p-1)=1,
    and that the same construction rejects
    the embedding-degree-1 nearby object
    N | (p-1). For REAL p=19, N=5,
    gcd(5,18)=1. The frozen power table
    of x^(25) for x=1..18 is
    [1, 14, 2, 6, 16, 9, 7, 8, 4, 15, 11,
    12, 10, 3, 13, 17, 5, 18]. The unique
    N^2-th roots for c=1..18 are
    [1, 3, 14, 9, 17, 4, 7, 8, 6, 13, 11,
    12, 15, 2, 10, 5, 16, 18]. KF is
    p=19, N=3 (gcd(3,18)=3, so N | p-1):
    the unique-root construction is
    rejected. NULL empty c-list is
    rejected. p=0 is rejected. This is
    not a cubical lift, not a Miller
    function, not Tate, not a
    DL-spectrum, not Coppersmith, not
    Semaev S_m, not Velu, not a yield
    ratio k, and not a rho beat.
    Stages 1+ stay unauthorized.
  mechanism: >
    IDEA-20260906-86cc17 Stage 0 hard
    gate is uniqueness of the N^2-th
    root in F_p^* when gcd(N, p-1)=1.
    That is the bottleneck of the
    proposal's proof_search_map: remove
    it (N | p-1) and the canonical
    cubical section ceases to exist.
    Stage 0 freezes that field identity
    as exact tables on one coprime toy
    and rejects the embedding-degree-1
    nearby object. The producer
    evaluates x^(N^2) by repeated
    multiplication and compares the
    power table and the unique-root
    table to the frozen tuples. No
    cubical point is constructed. No
    division polynomial is evaluated.
    No Tate pairing is formed. This
    is a new GOAL-ECDLP-001 object
    after Stage 0 of EXP-ECDLP-a294b6
    held as P-S0-QRESIDUE
    (DEC-20260908-46a011). It is not
    Stage 1 of EXP-ECDLP-a294b6 and
    not Stage 1 of this experiment.
  predictions:
    - id: P-S0-N2ROOT
      metric: well-defined unique N^2-th-root table on a frozen F_p^* toy
      direction: different
      minimum_effect: >
        After fixture_pass, REAL power
        table equals [1, 14, 2, 6, 16,
        9, 7, 8, 4, 15, 11, 12, 10, 3,
        13, 17, 5, 18] and unique roots
        equal [1, 3, 14, 9, 17, 4, 7,
        8, 6, 13, 11, 12, 15, 2, 10, 5,
        16, 18]. KF embed p=19 N=3 is
        rejected. NULL empty c-list is
        rejected. p=0 is rejected. One
        certified miss after fixture_pass
        is a scoped falsification of this
        instrument at the frozen toys.
      claim_tier: observational
    - id: P-S1-CUBICAL
      metric: cubical identities G1-G4 on toy curves
      direction: different
      minimum_effect: >
        Stage 1+, unauthorized here.
        Stage 0 does not construct a
        cubical point and does not
        evaluate a division polynomial.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-EMBED
      statement: >
        After fixture_pass, KF embed
        p=19 N=3 is accepted as a
        unique-root table. An encoding
        bug is failed_infrastructure.
    - id: F-S0-REALROOT
