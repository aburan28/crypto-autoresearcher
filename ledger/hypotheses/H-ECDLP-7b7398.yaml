  proof_search_map:
    bottleneck: >
      Whether lambda |-> lambda^(N^2) is
      bijective on F_p^* exactly when
      gcd(N, p-1)=1. Stage 0 only checks
      that identity, the embed known-false,
      and the empty nearby object.
    baseline_embedding:
      parameter_slice: >
        The REAL, KF, and NULL fixtures.
        Disclosed tightening: F_p^*
        N^2-power-map bijectivity
        calibrator only, not the
        proposal's cubical lift, not
        Tate, not a DL-spectrum.
      reproduction_check: >
        REAL power table equals
        [1, 14, 2, 6, 16, 9, 7, 8, 4,
        15, 11, 12, 10, 3, 13, 17, 5,
        18]. Unique roots equal
        [1, 3, 14, 9, 17, 4, 7, 8, 6,
        13, 11, 12, 15, 2, 10, 5, 16,
        18]. KF embed p=19 N=3
        rejected. NULL empty c-list
        rejected. p=0 rejected.
    observation_collision:
      observable: >
        unique N^2-th roots versus the
        frozen 18-tuple.
      distinct_preimage_search: >
        Hold p=19 and replace N=5 by
        N=3 with N | (p-1) (KF). Hold
        the field and replace the c-list
        by empty (NULL).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Frozen exact unique N^2-th-root table.
        predicted_gain: >
          Exact known-false embed reject
          on KF. Zero claimed attack
          improvement.
    quantifier_order: >
      Freeze p and N before reading the
      table. Existential equality at one
      toy does not imply a cubical
      section and does not imply a rho
      beat.
    method_ceiling:
      strongest_certifiable_claim: >
        Instrument reproduction on the
        declared frozen toys. Never a
        cubical lift. Never Tate. Never
        a DL-spectrum. Never an ECDLP
        exponent.
      nearby_object_control: >
        NULL is the empty c-list. An
        argument that still assigns it
        a true unique-root table is
        wrong. KF is N | (p-1); an
        argument that assigns every
        (p,N) a unique N^2-th root is
        wrong.
    proof_obligations:
      - claim: well-defined unique N^2-th-root table
        responsibility: correctness
      - claim: exact REAL 18-tuples at p=19 N=5
        responsibility: baseline
      - claim: exact KF embed reject at p=19 N=3
        responsibility: baseline
      - claim: no cubical lift, no Tate, no DL-spectrum, no Coppersmith, no Semaev S_m, no Velu, no Stage 1 of eab4d7/a294b6/835df6/5f3822/6ffef4/11c247/114eb2/821bc5/735974/fdae20/089e80/b3f975/daf1bb/0d1336/1aa0f8/79f8c4/628891/9e9536/90f602, no Stage 2 of 4be480
        responsibility: interface
    not_applicable_reason: null
