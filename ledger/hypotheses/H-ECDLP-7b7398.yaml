        or unique-root table. That
        falsifies only P-S0-N2ROOT at
        the frozen coprime toy.
    - id: F-S1-CUBICAL
      statement: >
        After an authorized later
        stage, a claimed cubical
        identity miss. Unauthorized
        here.
