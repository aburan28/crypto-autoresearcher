    prose: >
      Toy scale. Stage 0 is exact
      F_p^* arithmetic on one frozen
      coprime pair and one embed
      reject. It is not a cubical
      lift, not Tate, not a
      DL-spectrum, not Coppersmith,
      not Semaev S_m, not Velu, not
      Stage 1 of EXP-ECDLP-eab4d7,
      not Stage 1 of EXP-ECDLP-a294b6,
      and not Stage 1 of the earlier
      Stage-1-blocked experiments.
      No cryptographic transfer. No
      rho beat.
