  id: H-XEDN-4a5b50
  statement: 'Conjecture for testing: the frozen synthetic sign-pattern search in
    parameters.json contains at least one unplanted rational lift of a prescribed
    finite-field point pair with two certified non-torsion points and a primitive,
    exact dependency with both coefficients nonzero having coefficient infinity norm
    at most 8, outside the full hypotheses of H-XEDN-0ea2b6.'
  mechanism: Same-sign squareclasses or different discriminant factor patterns remove
    sufficient conditions of the independence lemma. Removing those conditions may
    permit dependence; it does not prove dependence.
  assumptions:
  - Input target corpus frozen before fitting.
  - All four sign patterns retained, including zero-eligibility strata.
  - Parameters are a design draft; no follow-up results exist yet.
  proof_search_map:
    bottleneck: Compatible residues, rational point membership and small rational
      dependencies must hold together.
    baseline_embedding:
      parameter_slice: Original opposite-sign, distinct-prime branch and Xedni V2
        baseline
      reproduction_check: Preserve the two independent candidates; planted Q=[2]P
        must be recognized as dependent.
    observation_collision:
      observable: Collapsed squareclasses or small finite-field relation coefficients
      distinct_preimage_search: Require exact rational group-law certificates; finite-field
        coefficients alone are insufficient.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: Same-sign or nonprime-pattern prescribed-point lifts
      predicted_gain: Potential escape from the sufficient independence hypotheses,
        not guaranteed dependence.
    quantifier_order: Targets fixed first from four synthetic finite fields, then
      bounded lift search. Existence within this frozen finite set only; no arbitrary-target
      or asymptotic quantifier.
    method_ceiling:
      strongest_certifiable_claim: One exact unplanted dependency in the frozen toy
        corpus.
      nearby_object_control: Independence of historical certified pairs despite successful
        residue fitting.
    proof_obligations:
    - claim: Every accepted lift preserves both input point residues and good reduction.
      responsibility: correctness
    - claim: Every claimed dependency is checked by exact rational group law.
      responsibility: correctness
    - claim: All rejections, eligibility gaps and setup costs are included.
      responsibility: cost
    not_applicable_reason: null
  predictions:
  - metric: exact unplanted rational dependencies in the frozen corpus
    direction: higher
    minimum_effect: at least one
  test_boundary:
    instances:
    - 32 synthetic point pairs, eight per prime
    parameters: analysis/xedni-cheon/20261007-certificates/parameters.json
    implementation: Not implemented; requires reviewed runner, frozen target corpus,
