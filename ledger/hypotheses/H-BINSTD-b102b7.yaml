# =============================================================================
# H-BINSTD-b102b7 -- Trace-linear rank predicts residual nonlinear XOR-SAT
# clause count N_nl (Spearman ≤ −0.70) at fixed dim(V)=ℓ.
# Specified from IDEA-20261001-878222 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Approved DEC-20261003-7d1fec. ZERO RUNS in this design packet.
# Stages 0-1 authorized. No AUXIN. No Bedrock. No curve attack / exponent claim.
# =============================================================================
hypothesis:
  id: H-BINSTD-b102b7
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261001-878222
  experiment_id: EXP-BINSTD-8196d7
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-03'
  approved_at: '2026-10-03'
  authorised_by: DEC-20261003-7d1fec
  status: approved
  proposed_by: coordinator
  title: >-
    At fixed dim(V)=ℓ on toy binary cells, Spearman ρ(r_Tr, N_nl) ≤ −0.70
    across a frozen ≥12-shape V catalog, or Trace-rank is not predictive

  statement: >-
    CLAIM (heuristic_validation / encoding-structure instrument; NO ATTACK;
    NO EXPONENT). Let V ⊂ F_{2^n} be an F_2-subspace of dimension ℓ. Encode
    the Weil-descended Semaev S_3 PDP with x1,x2 ∈ V under a frozen XOR-SAT
    pin. Let r_Tr be the F_2-rank of the Trace-derived pure-linear block
    (KR-IC-f5c584 on this pin) and N_nl the residual nonlinear XOR-SAT clause
    count after eliminating those linears. FORALL Stage-1 cells
    (n,ℓ)∈{(17,3),(17,4)}, across a frozen catalog of ≥12 distinct dim-ℓ
    subspaces, Spearman's ρ(r_Tr, N_nl) ≤ −0.70 — OR the correlation fails
    and is recorded as Trace-rank-not-predictive of N_nl at this scale
    (O-FAIL-BAND). Distinct from IDEA-20261001-febbe1 (dim(V·V)→N_var),
    20561e (peak-RSS), 214fd3 (last-fall), 556cea (solving vs first-fall),
    and solver races. NO break. NO n≥131 transfer.

  mechanism: >-
    OBJECT FRAME. Representation: FB {P : x(P)∈V} with V an F_2-subspace of
    fixed dimension ℓ; Operation: descend S_3, extract Trace-linear block,
    eliminate it, count residual nonlinear clauses under a frozen encoder pin
    (KR-IC-5765d2); Observable: Spearman(r_Tr, N_nl). Trichotomy: Class I
    instrument (predictor of residual nonlinear work). Lossy-projection: N_nl
    discards which nonlinear clauses are hard; null is a shuffled-linear-rank
    catalog (Stage 2, not authorized here). OFF-LIMITS: total N_var vs
    dim(V·V) (febbe1); peak RSS (20561e); usable_dimensions emptiness;
    solver races; degree-of-regularity claims. WHAT IS NEW: a pre-registered
    Spearman ≤−0.70 band linking Trace-linear rank to residual nonlinear
    clause count.

  predictions:
    - metric: spearman_rTr_vs_Nnl
      direction: upper_bounded
      minimum_effect: '≤ −0.70 at each Stage-1 (n,ℓ) cell'
    - metric: catalog_size
      direction: lower_bounded
      minimum_effect: '≥ 12 distinct V shapes per cell'
    - metric: distinct_rTr_values
      direction: lower_bounded
      minimum_effect: '≥ 3 distinct r_Tr values, else inconclusive'
    - metric: twin_agreement
      direction: same
      minimum_effect: 'r_Tr and N_nl path A = path B on every measured V'

  test_boundary:
    instances:
      - 'Stage 0: freeze V catalog (≥12), seeds, XOR-SAT pin, Spearman band −0.70; twin Trace check'
      - 'Stage 1 authorized: (n,ℓ)∈{(17,3),(17,4)} Spearman panels'
    parameters:
      spearman_band: -0.70
      catalog_seed: 202610038782
      moduli:
        17: t^17+t^3+1
        19: t^19+t^5+t^2+t+1
        23: t^23+t^5+1
    implementation: >-
      Pure Python under experiments/EXP-BINSTD-8196d7/implementation/;
      command surface implementation/run.py driven by trial-plan-v1.json.
      Twin meters in encode_s3.py (Trace rank + N_nl). No Magma/
      Sage/AUXIN/Bedrock.
    budget:
      wall_clock_seconds: 7200
      memory_gb: 2
      maximum_runs: 4

  falsification_conditions:
    - >-
      Twin meters disagree on any measured V (O-ARTIFACT; table void).
    - >-
      Editing the Spearman band after Stage-0 freeze (protocol invalid).
    - >-
      Claiming practical binary IC or an exponent move from a toy Trace-rank
      correlation (KR-IC-1fcdbc).
    - >-
      Equating N_nl prediction with total N_var (febbe1) or peak RSS (20561e).
    - >-
      Transferring the band to n≥131 without a new contract.
    - >-
      Catalog collapses to <3 distinct r_Tr values (O-INCONCLUSIVE; expand or stop).

  distinguishable_outcomes:
    - id: O-SUPPORT
      meaning: >-
        Twin OK; ≥3 distinct r_Tr; ρ(r_Tr, N_nl) ≤ −0.70 on every Stage-1
        cell. Trace-rank predicts residual nonlinear clause count at toys.
        No attack claim.
    - id: O-FAIL-BAND
      meaning: >-
        Twin OK; distinctness OK; ρ > −0.70 on at least one Stage-1 cell.
        Trace-rank-not-predictive at this scale.
    - id: O-INCONCLUSIVE
      meaning: >-
        Catalog collapses to <3 distinct r_Tr (or <2 distinct N_nl) on a
        completed cell.
    - id: O-ARTIFACT
      meaning: Twin disagreement or freeze/regression failure. No band claim kept.
    - id: O-IMPEDIMENT
      meaning: >-
        Infrastructure timeout/crash/missing Stage-0 freeze / Trace extractor
        unavailable at Stage 0. Never negative evidence against H-BINSTD-b102b7.

  interpretation_limits:
    - Encoding-structure instrument only; does not predict yield or beat rho.
    - Shared XOR-SAT pin; a different pin needs a new idea/contract.
    - Stage-2 (n∈{19,23} + shuffled-linear null) not authorized under this card.
    - No attack at field degree ≥ 131. ECC2K-130 is not an instance.
    - High Trace rank may cut N_nl but leave hard nonlinear cores — this meter
      measures only residual clause count.

  heuristic_assumptions:
    - id: HEUR-BINSTD-878222-H1
      formal_statement: >-
        FORALL (n,ℓ)∈{17}×{3,4} Stage-1 cells: across the frozen ≥12-shape V
        catalog, Spearman ρ(r_Tr, N_nl) ≤ −0.70 where r_Tr is the rank of the
        Trace-derived linear block and N_nl is the residual nonlinear XOR-SAT
        clause count after eliminating those linears.
      random_model_justification: >-
        Rigorous: KR-IC-f5c584 shows Trace contributes structural linears after
        descent. Classical: if those linears dominate the removable work, higher
        r_Tr should leave fewer residual nonlinear clauses; if product-space or
        encoder artifacts dominate residual size instead (KR-IC-73db3f),
        correlation may fail the −0.70 band. The band is the pre-registered
        transfer hypothesis at toys — not a claim that Trace alone beats rho.
      supporting_results:
        - KR-IC-f5c584
        - KR-IC-5765d2
        - KR-IC-73db3f
      validation_experiment_ids:
        - EXP-BINSTD-8196d7
      falsification_condition: >-
        Spearman ρ > −0.70 at a completed Stage-1 cell (O-FAIL-BAND), OR twin
        failure (O-ARTIFACT), OR catalog collapses to <3 distinct r_Tr
        (O-INCONCLUSIVE), OR Trace extractor absent (O-IMPEDIMENT).

  asymptotic_claim:
    problem: >-
      Trace-linear rank as predictor of residual nonlinear XOR-SAT clause
      count on toy binary IC cells
    prior_best: >-
      KR-IC-f5c584 (Trace linear); KR-IC-5765d2 (XOR-SAT PDP); KR-IC-1fcdbc
      (binary IC slower than rho)
    time_exponent: >-
      NO EXPONENT MOVED. Encoding-structure instrument only; a high |ρ|
      does not move binary ECDLP vs rho (KR-IC-1fcdbc / KR-IC-9e610d).
    memory_exponent: Negligible — store per-V r_Tr and N_nl.
    hidden_cofactor: Encoder constants independent of Trace rank.
    claim_kind: heuristic_validation

  proof_search_map:
    bottleneck: >-
      Whether Trace-linear rank Spearman-correlates (≤ −0.70) with residual
      nonlinear clause count N_nl across a frozen V catalog at fixed ℓ, or
      whether product-space / encoder artifacts dominate residual size.
    baseline_embedding:
      parameter_slice: >-
        n=17, ℓ=3, poly basis V=span{1,t,t^2}; twin r_Tr and N_nl must agree
        before any Spearman panel is read.
      reproduction_check: >-
        Independent check.py recomputes twin r_Tr/N_nl on the Stage-0 probe
        and re-checks in_band polarity against the frozen ≤−0.70 band.
    observation_collision:
      observable: 'Spearman ρ(r_Tr, N_nl) vs −0.70 band per (n,ℓ)'
      distinct_preimage_search: >-
        A held band could arise from (i) Trace-dominated removable work
        (claim), (ii) catalog collapse / constant r_Tr (ruled out by
        distinct_rTr≥3), or (iii) twin-encode artifact. Separated by twin
        agreement and by Stage-2 shuffled-linear null (not authorized here).
    constructive_transforms:
      - transform: measurement_instrument
        proposed_object: >-
          Frozen Spearman ≤−0.70 band + twin Trace-rank / N_nl meters on a
          ≥12-shape V catalog.
        predicted_gain: >-
          A decidable support/fail label for the Trace→N_nl predictor at toys.
    quantifier_order: >-
      FORALL Stage-1 cells (17,3) and (17,4): ρ(r_Tr, N_nl) ≤ −0.70 is
      PREDICTED. NOT CLAIMED: n∈{19,23} under this card; n≥131; any attack.
    method_ceiling:
      strongest_certifiable_claim: >-
        On the named Stage-1 toy cells, measured Spearman ρ lies ≤ or > the
        frozen −0.70 band, with twin agreement and distinct_rTr≥3.
      nearby_object_control: >-
        Twin disagreement (artifact); catalog collapse (inconclusive).
        Stage-2 shuffled-linear null not authorized.
    proof_obligations:
      - claim: Twin r_Tr and N_nl paths agree on every measured V.
        responsibility: baseline
      - claim: Band polarity is Spearman ≤ −0.70 (not ≥).
        responsibility: baseline
      - claim: ρ vs band decides O-SUPPORT vs O-FAIL-BAND.
        responsibility: success_probability
      - claim: Nothing asserted at n≥131.
        responsibility: scope

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
