  statement: >-
    The binomial binom(8, 3) is 56, binom(9, 4) is 126, and binom(20, 3)
    is 1140. The ratio 1140/56 is 285/14, which exceeds 10 by 145/14.
    Raising the degree index by one multiplies the dimension by 9/4,
    which exceeds 2 by 1/4. Squaring that factor gives 81/16, which
    lies 79/16 below 10. Cubing it gives 729/64, which exceeds 10 by
    89/64. The squares of the two dimensions are 3136 and 1299600.
    Ten times 3136 is 31360. The ratio of the larger square to that
    product is 16245/392, which exceeds 41 by 173/392. The cube of 56
    is 175616, and that cube divided by the square is 56.
  mechanism: >-
    The proposal says the matrix size is the binomial in the variable
    count and the degree of regularity, and that a scheduling spread
    is a constant on that size. This contract checks those binomials.
    It does not run a solver.
