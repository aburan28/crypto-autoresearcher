    "statement": "Resolve all four literal source predictions on the exact nine historical STR-002 cases, retaining adverse cases and separating raw incidence, valid logarithm equations, orbit quotient dimensions, actual solver work and modeled structured cost.",
    "mechanism": "On a prime-order subgroup of order n, an efficiently computable endomorphism phi acts as multiplication by a public eigenvalue lambda satisfying lambda^2 + lambda + 1 = 0 mod n for CM discriminant -3. Therefore log(phi^i(P)) = lambda^i * log(P) mod n for every point P in the subgroup. The columns of a phi-orbit of length r are consequently NOT independent unknowns - a phi-invariant factor base of size B carries only B/r independent logarithms, and the remaining B - B/r columns are exact linear images of the representatives with publicly known coefficients. The block-circulant commutation M * Phi = Phi * M and the resulting O(r) displacement rank are the matrix-level shadow of that determinacy, not new compressibility of independent data. Once the orbits are quotiented the system is a generic sparse system of dimension B/r, whose Wiedemann cost is 2 (B/r)^2 = (2/r^2) B^2 - exactly the r^2 linear-algebra saving and r relation-count saving that Galbraith, Granger, Merz and Petit prove for Frobenius-invariant factor bases on subfield curves, with their orbit length n replaced here by the constant r = 3. A second, independent mechanism can produce the same measured signature without any structure: the displacement operator image (Z1 M - M Z2) has small rank whenever M itself has few nonzero rows or is rank-deficient, so alpha = 1 is equally consistent with an almost-empty matrix. EV-STR-002 records that all Groebner solves ran on trivial ideals with no decompositions at B >= 27, so the matrices at B = 204 and B = 397 were not built from harvested decompositions, and their rank was never reported. The control therefore discriminates three explanations of the same EXP-STR-002 numbers - (i) genuine structural compressibility beyond orbit collapse, (ii) the known automorphism orbit reduction restated in displacement-rank language, and (iii) a rank-degenerate matrix artifact.",
