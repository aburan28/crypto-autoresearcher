  title: >-
    An all-ones label is empty at odd arity and full at arity 2.
  statement: >-
    On four labels split two and two, the even-parity counts at
    arities 1, 2, 3 and 5 are 2, 8, 32 and 512. The all-zero label
    accepts every tuple, twice the balanced count. The all-ones
    label accepts 0 tuples at the odd arities and all 16 tuples at
    arity 2. A half-size all-zero window accepts 8 of the 32
    balanced successes at arity 3, which is 1/4, and the attempt
    multiplier for a half-size matrix is 2. On
    F_2[t]/(t^5+t^2+1) the trace of each of the eight elements
    span{1, t, t^2} equals its constant bit. The trace of t^3 is 1.
  mechanism: >-
    The proposal gives a parity rule and a factor of 2 at matched
    size. This contract counts the tuples and the toy traces. It
    does not build a curve.
