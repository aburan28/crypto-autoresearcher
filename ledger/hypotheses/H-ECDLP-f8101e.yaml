hypothesis:
  id: H-ECDLP-f8101e
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  source_proposal: coordination/goals/GOAL-ECDLP-001/proposals/NON-INDEX-ECDLP-III-20260807/INPUT-CAPSULE.md
  added: '2026-08-08'
  statement: >-
    Within an ordinary prime-field ECDLP isogeny class, publicly selecting an
    isogenous representative using j-invariant or readily computable
    endomorphism features can reduce end-to-end search cost after transfer,
    preprocessing, memory, and matched-null costs are charged.
    This is a toy-scale, falsifiable hypothesis; it does not assert an
    asymptotic improvement or a crypto-scale result.
  mechanism: >-
    A low-degree public isogeny preserves the ordinary trace and subgroup order
    while changing the curve model and potentially changing visible
    endomorphism/torsion predicates. If one of those predicates changes the
    Pollard-style walk or decomposition cost without being reproduced by an
    isomorphic-coordinate or random-cyclic control, the transfer could be
    algorithmically useful. The transfer must be public, invertible, and paid
    for in the same cost unit as the search.
  assumptions:
    - The selected curves are ordinary and have a declared prime-order subgroup.
    - Every transfer map and inverse used by the lane is public and executable.
    - Null controls have the same field, subgroup-order, and operation-budget shape.
    - Toy observations are not extrapolated to cryptographic parameters.
  proof_search_map:
    not_applicable_reason: >-
      This record specifies an empirical mechanism and its controls; it makes
      no theorem, asymptotic bound, certificate hierarchy, or reduction claim.
  predictions:
    - metric: control-adjusted_end_to_end_search_cost
      direction: lower
      minimum_effect: >-
        At least one held-out family has a reproducible reduction after forward,
        inverse, preprocessing, memory, and multiplicity costs.
    - metric: j_or_endomorphism_feature_effect
      direction: different
      minimum_effect: >-
        The effect survives isomorphic-coordinate and matched random-cyclic nulls.
  test_boundary:
    instances:
      - Three bounded ordinary isogeny families in NON-INDEX-ECDLP-III-20260807.
    parameters:
      isogeny_degree_cap: 5
      field_sizes: toy
      seeds: frozen in seed_register.yaml
      controls: isomorphic-coordinate, random-cyclic, matched Pollard baseline
    implementation: >-
      coordination/goals/GOAL-ECDLP-001/proposals/NON-INDEX-ECDLP-III-20260807/artifacts/build_l1_isogeny_corpus_generator.sage
    budget:
      maximum_runs: 1
      wall_clock_seconds: 7200
  falsification_conditions:
    - No candidate reduces normalized end-to-end cost after transfer overhead.
    - A candidate effect is reproduced by an isomorphic-coordinate or random-cyclic null.
    - Transfer is not invertible or requires hidden scalar-dependent preprocessing.
  interpretation_limits:
    - The declared field sizes are toy scale and the negative outcome is scoped only to them.
    - No universal statement about j-invariants, endomorphism rings, or ECDLP is made.
    - A null result leaves larger-parameter and non-isogeny mechanisms open.
  status: analyzed
  proposed_by: coordinator
  pareto_integrity:
    dominated_by: Pollard rho at exponent 1/2 on the tested subgroup
    sota_delta:
      time_exponent: no measured improvement
      memory_exponent: no measured improvement
      data_or_query_exponent: not_applicable
    note: >-
      The batch reports no positive lane, so this hypothesis is not on a
      claimed attack frontier. The comparison is explicit rather than null.
  experiment_ids: []
  evidence_ids:
    - EV-ECDLP-3dc2db
  supersedes: []
  owner: coordinator
