hypothesis:
  id: H-SSI-0e38a2
  question_id: RQ-SSI-1946c9
  idea_id: IDEA-20261008-305a07
  statement: >-
    For the exact RCF-Bind grammar, any two accepted noncentral endomorphism
    maps with the same reduced trace t and norm n are in one rational
    B_(p,infinity)^* conjugacy class. Nevertheless the submitted interface is
    a typed obstruction rather than a public-binding PKE component: it has no
    polynomial bare-E sampler, no polynomial inverse uniform over every
    complete basis, no nonpublic selected-message recovery functional proved
    invariant on that class, and no quantitative conversion from one or more
    accepted quadratic-order embeddings to a complete saturated End(E) basis.
    This statement concerns the supplied packet only and does not assert that
    such algorithms or another EndRing relation are impossible.
  mechanism: >-
    R_E verifies alpha_dual o alpha=[n] and alpha+alpha_dual=[t] as exact
    rational-map identities. Reduced characteristic data supplies the proposed
    conjugacy binding. Honest generation would first need to produce a
    noncentral alpha from bare E; inversion from B becomes an integral
    trace/norm representation problem; any successful output embeds only the
    quadratic order defined by Z^2-tZ+n.
  assumptions:
    - >-
      D_ER is the exact bare curve distribution and supplies no orientation,
      torsion basis, connecting ideal, ring-correlated tag, or planted basis.
    - >-
      Canonical rational-map parsing, composition, addition, degree and dual
      verification have the semantics in binding-interface.yaml.
    - >-
      The quaternion conjugacy lemma applies to every accepted negative-
      discriminant fiber; its source and formal proof remain open.
    - >-
      Every valid saturated evaluable basis and every GL_4(Z) presentation
      change are quantified; attacker outputs across calls may be correlated.

  proof_search_map:
    bottleneck: >-
      Supply bare-E noncentral sampling and upgrade a quadratic embedding to a
      complete saturated maximal-order basis with quantitative loss.
    baseline_embedding:
      parameter_slice: "scalar alpha=[a], with y=(2a,a^2)"
      reproduction_check: >-
        Unique binding and public inversion hold simultaneously, showing that
        binding alone does not give asymmetric functionality.
    observation_collision:
      observable: "(t,n), exact R_E accept bit, and any proposed Rec output"
      distinct_preimage_search: >-
        Hold y fixed, seek distinct accepted maps, verify conjugacy, and test
        whether Rec is constant on the entire fiber.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: "joint trace Gram data from several noncommuting maps"
        predicted_gain: >-
          may expose rank and saturation but worsens the bare-E sampling burden
      - transform: representation_reduction
        proposed_object: >-
          separate Sample, trace/norm solving, quadratic embedding and
          maximal-order reconstruction
        predicted_gain: "prevents a smaller witness from being relabeled EndRing"
      - transform: observable_fiber
        proposed_object: "complete-ring bases compatible with one accepted embedding"
        predicted_gain: "a collision blocks black-box reconstruction or identifies a missing premise"
    quantifier_order: >-
      For every lambda,E,honest y, accepted preimage, complete basis and
      GL_4(Z) change, then every adaptive polynomial transcript and reduction
      coin. The reduction cannot depend on hidden honest witnesses.
    method_ceiling:
      strongest_certifiable_claim: >-
        Conditional conjugacy binding and public decision for already supplied
        polynomial-size maps.
      nearby_object_control: "the scalar fiber is uniquely binding and fully public"
    proof_obligations:
      - {claim: "exact conjugacy-fiber lemma", responsibility: correctness}
      - {claim: "polynomial bare-E SampleNoncentralEnd", responsibility: feasibility}
      - {claim: "polynomial every-basis Inv", responsibility: runtime}
      - {claim: "fiber-invariant nonpublic Rec", responsibility: interface}
      - {claim: "accepted embeddings reconstruct complete End(E)", responsibility: security_reduction}
    not_applicable_reason: null

  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
