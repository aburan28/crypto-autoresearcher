  title: >-
    On Z/l toys, the three-class pair-count envelope bounds |C_n|, and
    interleaved BSGS attains its envelope before saturation

  statement: >-
    CLAIM (heuristic_validation / generic-group instrument; NO ATTACK; NO
    EXPONENT). LET l∈{101,257} (prime order of Z/l; not a field-degree n≥131
    instance). FOR the frozen PLAIN-matching schedules bsgs_interleaved
    (k=2, rates (1,1), two free starts) and grumpy_eq_s2 (k=3, rates (1,1,1),
    s=2, three free starts): (M1) the dual meters agree and |C_n| ≤ P_n ≤
    envelope_bound(n,k) at every integer n on the freeze list, and the
    all-target mean numerator E_num ≥ F_num; (M2) on bsgs_interleaved,
    |C_n|=P_n for every n with P_n < l (zero overlap before saturation).
    Stage-2 negation conventions and E1/E2 delta_ovl bands are NOT authorized.
    NO break. NO exponent. NO elliptic solve.

  mechanism: >-
    OBJECT FRAME from IDEA-20260930-79c17d. Route A (envelope.py) reads only
    class cardinalities (n_i) and forms P_n = sum_{i<j} n_i n_j and the AM-QM
    bound. Route B (covered.py) reconstructs (alpha,beta) lists on Z/l and
    returns |C_n| by two independent pair scans. Lossy projection: Route A
    forgets alphas; the overlap P_n-|C_n| is the residual. Null/nearby:
    interleaved BSGS must show overlap 0 before saturation; a dual-scan
    disagreement is O-ARTIFACT.

  assumptions:
    - l prime in the frozen list {101,257}; 2 is a unit.
    - Cost unit is one counted addition after the declared free starts.
    - PLAIN matching only (no negation map) under this card.
    - Collision detection is immediate and pair-complete.
    - Encoder/CAS libraries are not used; pure Python integer arithmetic.

  predictions:
    - metric: E_num_minus_F_num
      direction: lower_bounded
      minimum_effect: '≥ 0 at every (l, schedule) (M1)'
    - metric: C_n_le_P_n_le_bound
      direction: same
      minimum_effect: 'holds at every integer n row'
    - metric: bsgs_overlap_before_saturation
      direction: equal
      minimum_effect: '0 (M2)'
    - metric: dual_covered_agreement
      direction: same
      minimum_effect: 'pair-product |C_n| equals reversed-scan |C_n|'

  test_boundary:
    instances:
      - 'Stage 0: freeze floor-table.json list rows with integer n for l∈{101,257}'
      - 'Stage 1 authorized: PLAIN bsgs_interleaved and grumpy_eq_s2 on those l'
    parameters:
