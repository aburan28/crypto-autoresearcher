      Dual meters envelope.py vs covered.py. No Magma/Sage/AUXIN/Bedrock.
    budget:
      wall_clock_seconds: 1800
      memory_gb: 2
      maximum_runs: 2

  falsification_conditions:
    - Dual covered scans disagree (O-ARTIFACT).
    - '|C_n| > P_n or P_n > envelope_bound at any integer n (O-ARTIFACT).'
    - E_num < F_num on a completed cell (O-FAIL-M1; instrument or model assignment).
    - BSGS overlap nonzero before P_n ≥ l (O-FAIL-M2).
    - Claiming an exponent move or n≥131 transfer from these toys.
    - Timeout/crash: O-IMPEDIMENT, never negative evidence.

  distinguishable_outcomes:
    - id: O-STAGE0-OK
