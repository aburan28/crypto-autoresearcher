  falsification_conditions:
    - NULL-3 fails exact reproduction on any algebraic metric. Instrument fault; halt.
    - NULL-5 fails to detect the planted g = 4 signal. Battery blind; every negative it would produce is void.
    - Per-variable degree varies under a Moebius substitution. Substitution machinery is wrong.
    - Monomial support does not return to exactly 13 as beta goes to 0. Canonical artifact tell.
    - The identity element of PGL_2 is not a no-op. Implementation error.
    - >-
      The symmetry checks pass on a curve lacking the relevant rational torsion, which withdraws the
      symmetry claims of the sibling records.
    - >-
      The solving-cost spread at r = m is narrow, which refutes this record's own headline
      expectation that reparametrisation noise swallows the lane's model differences.
  interpretation_limits:
    - >-
      This hypothesis claims nothing about the ECDLP, no exponent change, and no cost improvement.
      It bounds what the other L11 records may assert; it asserts nothing itself about attack cost.
    - >-
      The battery covers degree-2 coordinates only. A coordinate of degree n other than 2 needs a
      different group and is out of scope by construction.
    - >-
      A null result bounds attribution, not existence: showing that support 27 is generic does not
      show that no coordinate has small support, only that any small-support coordinate is atypical.
    - >-
      Toy tier. Claim tier is capped at toy per docs/claims-and-verification.md and nothing here
      transfers to a standardized parameter set.
