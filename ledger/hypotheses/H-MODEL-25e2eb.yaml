hypothesis:
  id: H-MODEL-25e2eb
  question_id: RQ-MODEL-e61cb2
  derived_from_idea: IDEA-20260807-4fc635
  added: '2026-08-25'
  statement: >-
    Every quantity the L11 curve-model lane reports on a degree-2 coordinate falls into exactly one
    of two classes under the action of PGL_2(F_p)^m acting by per-variable Moebius substitution on
    the summation and membership polynomials, and the class is decidable by measurement without any
    reference to a named model. CLASS I (reparametrisation-invariant): per-variable degree and the
    Bezout number are constant over the whole orbit, with zero variance across independent draws.
    CLASS II (reparametrisation artifact): monomial support size is 13 at r = 0 randomised
    variables and jumps to the generic dense value 27 for every r >= 1, so the smaller support a
    named model exhibits is a property of the substitution and not of the curve model. CLASS III is
    the open cell the hypothesis refuses to pre-assign: the Groebner solving-degree proxy and wall
    time may be either, and the measured spread of that distribution at r = m is what decides
    whether the lane's existing single-baseline wall-time comparisons are resolvable at all.
    Two calibration claims accompany the classification and are asserted with zero tolerance. The
    translation-conjugate shifted-Kummer coordinate x_R(P) := x(P - R), which is a genuinely
    different degree-2 coordinate rather than a Moebius transform of x, must reproduce EVERY
    algebraic metric of the Weierstrass baseline EXACTLY after the target is retargeted to
    target - mR, because the two setups are conjugate by translation. And a coordinate with a
    genuinely larger rational deck group - x^2 on a j = 1728 curve with 4 | p - 1, deck group of
    order 4 - must be DETECTED, with the measured Bezout number tracking B^(m-1)/g as the deck order
    g sweeps 2, 4, 6.
  mechanism: >-
    Each of the named models this lane compares (Montgomery, Edwards, Hessian, Jacobi quartic,
    Kummer) is, on the coordinate that carries the decomposition, a Moebius reparametrisation of
    the Weierstrass x-coordinate. A Moebius substitution t_i -> mu_i(t_i) followed by clearing
    denominators is a degree-preserving change of the projective line, so it cannot alter the
    per-variable degree or the Bezout count; but it generically densifies the coefficient support,
    because the numerators of a substituted monomial spread over the whole (2,2,2) box. Hence the
    theoretical split into Class I and Class II. The group is the right null object precisely
    because model change IS an element of it: applying a named model change permutes the PGL_2 orbit
    and leaves the orbit distribution fixed, so a quantity whose orbit distribution is a point mass
    is a model invariant and a quantity whose orbit distribution is spread is not. NULL-3 works by a
    different mechanism and is therefore an independent check: writing P_i = R + P_i' turns the
    condition sum P_i = target into sum P_i' = target - mR, so the entire decomposition system in
    the shifted coordinate is the standard one relabelled, and exact equality is forced rather than
    predicted. NULL-5 works by yet a third mechanism: the deck group of the covering E -> P^1 given
    by x^2 on a j = 1728 curve with 4 | p - 1 has order 4 rather than 2, which divides the Bezout
    count by 4 instead of 2 and raises the per-variable degree to 4^(m-2).
  assumptions:
    - >-
      Every arm compared under the random-Moebius null uses a degree-2 coordinate, so PGL_2 acting
      on the target line is the correct group. The Hessian x arm uses a coordinate of degree
      different from 2 and is excluded from this hypothesis by construction, not by omission.
    - >-
      "Exact agreement" under NULL-3 means exact for the algebraic quantities (per-variable degree,
      total degree, support size, Bezout number, solving-degree proxy) and within a noise band
      declared before the run for wall time. The noise band is frozen in the contract.
    - >-
      PGL_2(F_p) is sampled uniformly by rejection from 2x2 matrices of nonzero determinant, and
      the sampler is itself checked for uniformity at small p before any draw is used.
    - >-
      Toy scale only, roughly 16 to 32 field bits, pure Python symbolic algebra. Wall time at this
      scale is dominated by library overhead rather than by the mathematics, so the wall-time arm is
      weak evidence and the algebraic metrics carry the weight.
    - >-
      j = 1728 curves with 4 | p - 1 and j = 0 curves with 6 | p - 1 are constructible at toy scale.
      This is checked at run time; failure to construct one is an infrastructure outcome under
      AGENTS.md rule 5, not a blindness finding.
  test_boundary:
    instances: >-
      Toy prime-field curves at roughly 16 to 32 field bits generated by the committed instance
      generator, plus one constructed j = 1728 curve with 4 | p - 1 and one constructed j = 0 curve
      with 6 | p - 1 for the planted-signal arm, plus one curve with no rational 2-torsion for the
      symmetry null.
    parameters: >-
      Summation arity m = 3 (so r sweeps 0, 1, 2, 3); 30 independent PGL_2 draws per value of r;
      affine sub-battery with beta swept from random to exactly 0 at fixed alpha; deck order g in
      {2, 4, 6}; symmetry two-by-two of (rational 2-torsion present or absent) x (diagonalising
      coordinate or random Moebius).
    quantities: >-
      Per-variable and total degree, monomial support size, Bezout number, Groebner solving-degree
      proxy, wall time, and the pass/fail verdicts of the two hard gates.
    out_of_scope: >-
      Coordinates of degree other than 2; any statement about the ECDLP itself; any crypto-scale
      claim; any statement about which model is faster in a deployed implementation.
  distinguishable_outcomes:
    - outcome: >-
        Both gates pass; degree is exactly 2 in all 30 x (m+1) draws; support is 13 at r = 0 and 27
        for every r >= 1 in at least 28 of 30 draws; support returns to exactly 13 at beta = 0; and
        the measured spread of the solving-cost proxy at r = m is WIDE, with interquartile range
        exceeding the largest model-versus-baseline gap the lane has recorded.
      means: >-
        The classification holds and Class III falls to "artifact". Support size is a
        reparametrisation artifact and no model claim may rest on it; and the lane's wall-time
        comparisons were never resolvable against a single baseline, which is the strongest result
        this instrument can produce and would bound every sibling record's headline number.
    - outcome: >-
        Both gates pass and the degree and support predictions hold, but the solving-cost spread at
        r = m is NARROW - interquartile range strictly below the smallest model-versus-baseline gap
        the lane has recorded.
      means: >-
        Solving cost is reparametrisation-invariant, Class III falls to Class I, and the lane's
        existing single-baseline wall-time comparisons are legitimate as stated. This is a negative
        outcome for the record's own headline expectation and must be reported as such.
    - outcome: >-
        NULL-3 fails exact equality on any algebraic metric after retargeting.
      means: >-
        INSTRUMENT FAULT. The pipeline cannot reproduce itself under a translation, so no other
        number it produces is interpretable. The L11 measurement programme halts and no sibling
        record's numbers may be reported until it is fixed. This is not evidence about models.
    - outcome: >-
        NULL-5 fails to report the predicted Bezout drop at g = 4 (or the Bezout number does not
        track B^(m-1)/g across g = 2, 4, 6).
      means: >-
        INSTRUMENT BLIND. A battery that reports "no effect" for an object where an effect is
        predicted by theory cannot license any negative. Every null this battery would produce is
        void.
    - outcome: >-
        Per-variable degree varies under the random-Moebius null, or the identity element of PGL_2
        is not a no-op, or support does not return to exactly 13 at beta = 0.
      means: >-
        The substitution machinery is wrong - denominators uncleared, normalisation inconsistent, or
        the squarefree reduction dropping a factor. An implementation defect, located to a named
        step, and never mathematical evidence.
    - outcome: >-
        The symmetry checks (parity grading, palindrome) PASS on a curve with no rational 2-torsion.
      means: >-
        The symmetry-derived sparsity claims of the sibling records are implementation artifacts and
        must be withdrawn. This is the single most consequential negative the battery can produce
        about another record.
