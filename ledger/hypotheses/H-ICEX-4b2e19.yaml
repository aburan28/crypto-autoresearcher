hypothesis:
  id: H-ICEX-4b2e19
  question_id: RQ-QRE-6dba8c
  source_idea_id: IDEA-20260815-1570fe
  title: >-
    SHOR ON ECDLP IS COSTED AS A CIRCUIT AND NEVER AS AN ATTACK- assembling
    the end-to-end cost (expected repetitions from the per-run success
    probability, classical post-processing, and error-corrected execution)
    on top of a published logical-circuit estimate raises the number by a
    factor that is a property of the ASSEMBLY, not of elliptic curves, and
    the assembly's dominant term is the error-correction layer that the
    program's only extracted source does not contain at all
  statement: >-
    (A) THE OBJECT. Published quantum resource estimates for ECDLP report
    LOGICAL QUBITS and TOFFOLI COUNTS for ONE circuit run. An attack needs
    successful runs- expected repetitions from the algorithm's per-run
    success probability, classical post-processing of the measured outcomes,
    and execution under an error-correction model with a stated cycle time.
    The end-to-end number and the circuit number are different quantities in
    different units, and only the first is what any downstream argument
    depends on.
    (B) THE ASSEMBLY, STATED SO IT CAN BE CONTRADICTED. End-to-end cost
    = r * (logical circuit cost converted to physical execution under a
    declared error-correction model) + (classical post-processing), where
    r = 1/P_success is the expected repetition count under a geometric-trial
    argument. Each of the three terms carries its OWN unit and no two are
    added without a declared conversion.
    (C) WHAT THIS PROGRAM CAN ACTUALLY EVALUATE TODAY, AND WHERE IT STOPS.
    KN-LIT-099 is the corpus's only ECDLP resource-estimate entry with an
    extracted input table and citation_verified 'read'. It reports, for
    256-bit prime-field ECDLP, 2330 logical qubits and 1.26e11 Toffoli gates
    at Toffoli depth 1.16e11, AND it records explicitly that these are
    LOGICAL qubits in a FAULT-FREE model with NO error-correction overhead
    included. It does not record a per-run success probability. THEREFORE-
    r is UNKNOWN and is swept over a declared range, never estimated; and the
    error-correction layer, which is where the entire end-to-end factor
    lives, CANNOT be evaluated from that source. A second primary source with
    an extracted input table is a BLOCKING PRECONDITION, per RQ-QRE-6dba8c's
    own constraint that no pipeline output is recorded before two such
    entries exist.
    (D) THE FALSIFIABLE PREDICTION. Over the declared grid of
    (code distance, cycle time, repetition count r), the ratio F =
    (end-to-end cost) / (circuit-only cost), both expressed in the declared
    physical-qubit-second unit, is predicted to exceed 10^3 at EVERY grid
    point. A single grid point with F < 10^3 falsifies the prediction and
    means the circuit count is a good proxy over part of the range- which is
    a useful and reassuring result, not a failure.
    (E) THE PREDICTION THAT MATTERS MORE, AND IT IS A SCOPE PREDICTION.
    F is predicted to be the SAME, within a factor 2, for the non-curve
    instance (RSA factoring) costed through the identical assembly from the
    same source's comparison row. If it is, F is a property of the
    error-correction and repetition assembly and NOT of elliptic curves, and
    no number produced under this hypothesis may be quoted as an
    ECDLP-specific finding.
    (F) UNCONDITIONALLY- nothing about quantum feasibility, nothing about
    hardware, and, per RQ-QRE-6dba8c's binding constraint, NO date, timeline,
    arrival probability or policy recommendation of any kind.
  mechanism: >-
    WHY THE PROJECTION IS LOSSY IN EXACTLY THE WAY THIS PROGRAM ALREADY
    FORBIDS CLASSICALLY. A circuit count projects away repetitions and
    classical work. This program refuses that projection in its classical
    charged comparisons- a per-attempt success rate is not a cost, and a
    total that omits failed attempts is not a total. The same rule applied to
    a quantum estimate is the whole mechanism; nothing methodological is new.
    WHY THE UNIT DISCIPLINE IS THE LOAD-BEARING PART HERE AND NOT
    BOOKKEEPING. Five distinct units appear- logical Toffoli gates, logical
    qubits, physical qubits, seconds, and classical word operations. A ratio
    of a Toffoli count to a classical operation count is meaningless, and a
    'total' formed by adding them is worse than meaningless because it reads
    as a number. A red-team pass on this program's own records found a total
    denominated in field operations from which group operations had been
    subtracted, which flipped a headline. The same failure mode is available
    here five ways, so the assembly declares one comparison unit
    (physical-qubit-seconds), declares the conversion into it for each term,
    and refuses every cross-unit operation.
    WHY THE MISSING TERMS ARE REPORTED AS MISSING. The source reports no
    success probability and no error-correction layer. Estimating them would
    convert an assembly into a guess while retaining the language of a
    computation. They are swept over declared ranges with the answer reported
    PER LEVEL, and the absence itself is recorded as a finding about the
    estimate's completeness.
  assumptions:
    - >-
      UNITS, DECLARED AND FROZEN- U1 logical Toffoli gates (count); U2
      logical qubits (count); U3 physical qubits (count); U4 seconds; U5
      classical 64-bit word operations; U6 PHYSICAL-QUBIT-SECONDS = U3 * U4,
      the single unit in which any two costs may be compared. Every number
      carries its unit tag. NO TWO NUMBERS WITH DIFFERENT TAGS ARE ADDED,
      SUBTRACTED OR DIVIDED without an explicitly declared conversion
      recorded beside the result.
    - >-
      The circuit-level inputs are taken from a filed corpus entry with an
      extracted table and are NOT re-derived here; the reversible-arithmetic
      constructions are out of scope and are the subject of a separate
      contract (EXP-ICEX-640aef).
    - >-
      The per-run success probability is NOT reported by the available
      source, so the repetition count r is a SWEPT PARAMETER over a declared
      range and is never assigned a value as if it were known.
    - >-
      The error-correction layer is absent from the available source, so
      every physical-resource and time-denominated figure is BLOCKED until a
      second primary source is filed with its input table extracted
      (RQ-QRE-6dba8c constraint 1).
    - >-
      Repetitions are modelled as independent geometric trials with no shared
      setup. This is HEUR-E2E-1 and it is an UPPER bound on the repetition
      term, not the cost.
  proof_search_map:
    bottleneck: >-
      The conversion from a logical circuit count to an executed attack cost.
      The exact step whose removal changes the number is the
      error-correction and repetition assembly- everything else is
      arithmetic on the source's own table.
    baseline_embedding:
      parameter_slice: >-
        DEGENERATE PARAMETERS- per-run success probability 1, zero classical
        cost, cycle time 1, code distance 1. The assembly must then return
        the source's circuit-only numbers unchanged.
      reproduction_check: >-
        Frozen fixture- at n = 256 the assembly under degenerate parameters
        must return 2330 logical qubits and 1.26e11 Toffoli gates, and at
        n = 110 it must return 1014 and 9.44e9, exactly as recorded in
        KN-LIT-099. A mismatch means the harness differs from the published
        estimate and halts the record.
    observation_collision:
      observable: >-
        The end-to-end cost in physical-qubit-seconds.
      distinct_preimage_search: >-
        THE COLLISION IS THE POINT. The same end-to-end figure is produced by
        many distinct (r, code distance, cycle time) triples, so a single
        end-to-end number does not identify the assumption set that produced
        it. The identifying tuple is (circuit cost, r, code distance, cycle
        time, classical term), and every row must carry all five or it is
        unidentifiable- the same identifiability failure this batch's m = 2
        record (H-ICEX-6f3e4b) finds on the classical side.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The end-to-end assembly as an explicit five-term function with one
          declared comparison unit and a refusal rule for cross-unit
          operations.
        predicted_gain: >-
          Converts a quoted constant into a function whose sensitivity can be
          read. NO QUANTUM OR CLASSICAL EXPONENT IS MOVED IN EITHER
          DIRECTION.
    quantifier_order: >-
      CLAIMED. FOR ALL grid points (r, code distance, cycle time) in the
      declared ranges, F > 10^3 in the declared unit. CLAIMED. FOR ALL such
      grid points, F(ECDLP) / F(RSA) lies in [0.5, 2]. NOT CLAIMED- anything
      about actual hardware, about any architecture outside the declared
      ranges, about whether the source's circuit counts are correct, or about
      when any machine might exist.
    method_ceiling:
      strongest_certifiable_claim: >-
        'Under the stated source table, the stated error-correction model and
        the declared sweep ranges, the end-to-end assembly gives X
        physical-qubit-seconds, of which term Y dominates.' It can NEVER
        certify the source's circuit counts, a success probability the source
        does not report, an error-correction model the source does not
        contain, or anything about hardware.
      nearby_object_control: >-
        THE NON-CURVE INSTANCE- RSA factoring costed through the identical
        assembly from the same source's comparison row. The assembly must
        behave the same way there; if it does, the result is about the
        assembly. A finding that appeared only on the curve side would be the
        interesting one and would require explanation before any citation.
    proof_obligations:
      - claim: >-
          The degenerate-parameter slice reproduces the source's recorded
          circuit-only figures exactly at both calibration points.
        responsibility: baseline
      - claim: >-
          Every emitted number carries one unit tag and no cross-unit
          operation occurs without a recorded conversion.
        responsibility: interface
      - claim: >-
          The repetition term is an upper bound (geometric trials, no shared
          setup) and is labelled as such wherever it is quoted.
        responsibility: success_probability
      - claim: >-
          No date, timeline, arrival probability or policy recommendation
          appears in any artifact.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-E2E-1
      formal_statement: >-
        The end-to-end attack cost equals the per-run circuit cost times the
        expected repetition count r = 1/P_success, plus the classical
        post-processing cost, with the circuit cost converted at a FIXED
        cycle time independent of circuit depth and with no reuse between
        repetitions.
      random_model_justification: >-
        The rigorous ingredient is exact- the expected number of independent
        Bernoulli trials to first success is 1/P_success. THE GAP, AND WHY
        THIS IS A HEURISTIC- repetitions may share setup or admit partial
        reuse, and error-corrected cycle time is not constant across circuit
        depth, so the product form is an UPPER BOUND on the cost rather than
        the cost. The bound direction is disclosed with every quoted number.
      supporting_results:
        - ref: KN-LIT-099
          provenance: internal
          claim: >-
            The 256-bit and 110-bit logical qubit and Toffoli figures, the
            closed-form interpolations, and the explicit record that all
            counts are fault-free logical counts with NO error correction
            included and NO per-run success probability stated.
          verified_by: >-
            coordinator, TASK-20260904-e87737 (corpus entry read in full,
            69 lines; the entry itself records citation_verified 'read' with
            the ePrint table reproduced)
      validation_experiment_ids:
        - EXP-ICEX-b8c865
      falsification_condition: >-
        A filed end-to-end analysis whose cost falls materially below the
        product form at matched assumptions, or a measured demonstration of
        setup reuse between repetitions. Either shows the product form is not
        merely an upper bound but a loose one, and every number quoted from
        it must be re-scoped.
  structural_ingredients:
    - description: >-
        The only ECDLP quantum resource estimate in this corpus with an
        extracted input table- logical qubit and Toffoli counts for
        110/160/192/224/256/384/521-bit prime-field ECDLP, the closed-form
        interpolations, the RSA-3072 comparison row, and the explicit
        fault-free / no-error-correction caveat.
      citation: KN-LIT-099
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-e87737 (read in full this task)
      role: the circuit-level input the assembly is built on top of
    - description: >-
        The geometric-trial identity giving expected repetitions 1/P for
        independent Bernoulli attempts.
      citation: elementary probability; no external source relied on
      provenance: internal
      verified_by: coordinator, TASK-20260904-e87737
      role: the repetition term's rigorous half
  reduction_chain:
    core_problem: >-
      Assembling an end-to-end attack cost from a published logical-circuit
      resource estimate under a declared error-correction model and declared
      sweep ranges.
    corollaries: []
  predictions:
    - metric: >-
        P1- degenerate-parameter reproduction of the source's circuit-only
        figures, in LOGICAL QUBITS (count) and LOGICAL TOFFOLI GATES (count)
      direction: different
      minimum_effect: >-
        FORCED EXACT at both calibration points- 2330 / 1.26e11 at n = 256
        and 1014 / 9.44e9 at n = 110, matching KN-LIT-099's recorded values
        to the digits recorded there. A mismatch halts the record; it is an
        implementation failure and never a mathematical result.
    - metric: >-
        P2- F = (end-to-end cost) / (circuit-only cost), both in
        PHYSICAL-QUBIT-SECONDS, over the declared (r, code distance, cycle
        time) grid
      direction: higher
      minimum_effect: >-
        PRE-REGISTERED ABOVE 10^3 AT EVERY GRID POINT. A single grid point
        with F < 10^3 falsifies this prediction and establishes that the
        circuit count is an adequate proxy over part of the range.
    - metric: >-
        P3- the ratio F(ECDLP) / F(RSA) computed through the identical
        assembly, dimensionless
      direction: different
      minimum_effect: >-
        PRE-REGISTERED IN [0.5, 2]. If it holds, F is a property of the
        assembly and NOT of elliptic curves, and no number here may be quoted
        as an ECDLP-specific finding. A ratio outside [0.5, 2] is the
        interesting outcome and requires explanation before any citation.
    - metric: >-
        P4- share of the end-to-end cost carried by the classical
        post-processing term, dimensionless fraction after conversion into
        the declared unit
      direction: lower
      minimum_effect: >-
        PRE-REGISTERED BELOW 1e-6 at every grid point. A classical share
        above 1e-6 falsifies the assumption that post-processing is
        negligible and relocates the argument.
    - metric: >-
        P5- identity of the dominant end-to-end term, reported per grid point
      direction: different
      minimum_effect: >-
        The deliverable. PRE-REGISTERED EXPECTATION- the error-correction
        layer dominates at every grid point, and since the available source
        contains no such layer, the expectation is that the dominant term
        cannot be evaluated at all from the currently filed corpus. That
        blocked state is itself the reportable finding.
  test_boundary:
    instances:
      - >-
        No curve, no group, no quantum hardware, no circuit simulation- a
        static arithmetic assembly over a filed input table.
      - >-
        NON-CURVE CONTROL INSTANCE- RSA factoring from the same source's
        comparison row, costed through the identical assembly.
    parameters:
      n: '110 and 256 (the two calibration points) plus the remaining recorded rows 160, 192, 224, 384, 521'
      r: 'swept over 1, 10, 100, 1000 - declared range, never estimated as known'
      code_distance: 'swept over a declared range once a second source supplies the error-correction layer'
      cycle_time: 'swept over at least three declared values, since the wall clock scales directly with it'
      comparison_unit: 'physical-qubit-seconds (U6)'
    implementation: >-
      A derivation-aid script performing exact arithmetic on the filed table,
      with unit tags carried on every value and a refusal rule for cross-unit
      operations. No quantum simulation, no circuit synthesis, no curve
      arithmetic.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 0.5
      maximum_memory_gb: 8
      maximum_runs: 6
  falsification_conditions:
    - >-
      F1. The degenerate reproduction fails at either calibration point. The
      harness differs from the published estimate; HALT. Implementation
      failure, never a mathematical result (AGENTS.md rule 5).
    - >-
      F2. F < 10^3 at any declared grid point. The prediction of statement
      (D) is falsified and the circuit count is an adequate proxy over that
      part of the range- a reassuring result and a real one.
    - >-
      F3. F(ECDLP) / F(RSA) outside [0.5, 2]. The assembly behaves
      differently on the curve instance; that difference, not the magnitude
      of F, becomes the finding and must be explained before citation.
    - >-
      F4. The classical post-processing share exceeds 1e-6. Post-processing
      is not negligible and the argument relocates to it.
    - >-
      F5. No second primary source can be filed with an extracted input
      table. Then the error-correction layer cannot be evaluated at all, the
      end-to-end cost is NOT COMPUTABLE from this corpus, and that is the
      reported finding- about the completeness of the available estimates,
      not about quantum feasibility.
  interpretation_limits:
    - >-
      EXTENDS A PUBLISHED ESTIMATE AND MAKES NO INDEPENDENT QUANTUM-FEASIBILITY
      CLAIM. It inherits every assumption of the source circuit estimate,
      including that the source's counts are correct, which is not checked
      here.
    - >-
      NO DATE, TIMELINE, ARRIVAL PROBABILITY OR POLICY RECOMMENDATION may
      appear in any artifact under this hypothesis. This is RQ-QRE-6dba8c's
      binding constraint and it is an invalidation rule, not a style
      preference.
    - >-
      THE NON-CURVE CONTROL IS EXPECTED TO REPRODUCE THE SIGNATURE. If it
      does, nothing here is a statement about elliptic curves. This limit is
      recorded before any run so that a confirmation cannot be upgraded
      afterwards.
    - >-
      THE REPETITION TERM IS AN UPPER BOUND, not a cost- shared setup and
      depth-dependent cycle times both push the true figure down, and neither
      is modelled.
    - >-
      THE SOURCE CONTAINS NO ERROR-CORRECTION LAYER AND NO SUCCESS
      PROBABILITY. Those terms are swept over declared ranges and reported
      per level; a single-point end-to-end number quoted without its range is
      not admissible under RQ-QRE-6dba8c constraint 5.
    - >-
      QUESTION REASSIGNMENT, DISCLOSED. The source proposal
      IDEA-20260815-1570fe carries question_id RQ-QALG-457b41, which is
      scoped exclusively to QUANTUM ALGORITHMS AGAINST MODULE-LWE / ML-KEM
      and whose constraints forbid any cost figure transferring in or out.
      An ECDLP quantum cost assembly cannot be filed there without violating
      that scope, so this hypothesis is filed under RQ-QRE-6dba8c, whose
      declared targets include exactly this pipeline and the ECDLP-versus-RSA
      comparison under one model. The source proposal is immutable and is not
      edited; the reassignment is recorded here and reported to the
      orchestrating session.
