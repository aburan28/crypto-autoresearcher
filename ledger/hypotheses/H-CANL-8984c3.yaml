hypothesis:
  id: H-CANL-8984c3
  question_id: RQ-CANL-63098f
  added: '2026-08-25'
  derived_from_idea: IDEA-20260807-6533fd
  statement: >-
    For any lift-based attack that covers a prime-order subgroup of E(F_p) by
    reductions of global points of bounded canonical height, the REPRESENTATION cost of
    a single usable lift is governed by a covering exponent that is measurable at toy
    scale, and that exponent places the mechanism strictly behind Pollard rho at low
    arity. Four limbs are asserted, each separately falsifiable.
    (B1) THE COVERING EXPONENT TRACKS THE RANK. Defining the covering exponent beta as
    the local slope of log of the number of distinct reductions against log of the
    height budget, beta equals r divided by 2 on non-CM curves of exhibited
    Mordell-Weil rank r, within a stated fit interval, across at least four ranks.
    (B2) THE CM EFFECTIVE RANK IS HALVED BELOW A KNEE. On CM curves, beta equals the
    O-rank divided by 2 below a predicted knee in the height budget and steps toward the
    Z-rank divided by 2 above it, with the knee located within a factor 3 of its
    predicted position. This is the limb most likely to fail and the one that decides
    whether the representation threshold sits at Z-rank above 4 or above 8.
    (B3) THE REDUCTION MAP IS INJECTIVE BELOW THE BIRTHDAY POINT. The ratio of distinct
    reductions to enumerated low-height points is 1 minus a vanishing quantity while the
    point count remains far below the subgroup order. A collapse of this ratio well
    before the birthday point is a structured non-injectivity that would reopen the lane.
    (B4) THE MEET-IN-THE-MIDDLE CARRIES A MEASURABLE COORDINATE PENALTY. The measured
    bytes per stored table entry grow with table size like a power determined by the
    rank, so the mechanism's bit-model time and memory exponents both exceed rho's, and
    the deficit does not vanish under parallelization.
    The hypothesis is FALSE in the specific senses enumerated in its distinguishable
    outcomes: no knee where one is predicted and reachable refutes B2; a beta that does
    not track r over 2 leaves B1 UNVALIDATED rather than refuted and the record must say
    which; a collapsing injectivity ratio refutes B3 and reopens the lane; a flat
    bytes-per-entry curve leaves B4 unverified rather than refuted.
  mechanism: >-
    Counting lattice points of a positive definite quadratic form gives the number of
    global points of canonical height below a budget as a constant times the budget to
    the power rank over two, divided by the square root of the regulator. For the
    reductions of those points to cover a constant fraction of a subgroup of order N,
    the budget must therefore grow like N to the power two over r. Separately, the
    standard comparison between canonical and naive height differs by a bounded additive
    term, so a point of canonical height B has coordinates of bit-size proportional to B.
    Composing the two gives the representation cost of ONE usable lift as N to the power
    two over r - a SIZE bound that holds even for an adversary handed the right point for
    free, which is what makes it a cost statement rather than a search statement.
    At low arity that size alone equals or exceeds the cost of running the whole attack
    by a generic method, which relocates the classical failure of lift-based attacks from
    the coefficient bound to pure representation size and identifies a threshold arity.
    Above the threshold the size obstruction disappears and only the search obstruction
    remains; the only generic strategy available there is a meet-in-the-middle whose
    entries carry global coordinates, and in the bit-cost model that coordinate size is a
    penalty that shrinks with rank but never turns into a gain.
    Where CM enters is the one place this could have moved an exponent. The endomorphism
    structure doubles the Z-rank, but the second half of the lattice is longer, so inside
    a ball of the relevant radius the EFFECTIVE rank is the O-rank rather than the Z-rank
    until the budget passes a computable knee. That halving makes the identity worse
    rather than better, and the knee is the measurable signature that distinguishes this
    object from a pure lattice-shape statistic.
  assumptions:
    - >-
      The lattice-point asymptotic for the canonical height form, with its standard error
      term. Shared with the sibling proposal IDEA-20260807-44ba75 as one ingredient and
      cited from there rather than assumed independently, so the two records are not
      counted as independent evidence for the same conclusion.
    - >-
      The bounded difference between canonical and naive height. RECALLED, NOT READ. The
      constant matters at toy scale, so it is MEASURED per curve rather than assumed, and
      the empirical maximum difference is a required metric.
    - >-
      Arity is FIXED. Growing or correlated bases are outside this hypothesis entirely.
    - >-
      The regulator is computed from exhibited generators, which may generate a
      finite-index sublattice. That inflates the regulator and shifts the intercept of
      every fit but not its slope, which is why only slopes are interpreted.
    - >-
      Every enumerated height budget reachable at toy scale is small, so the asymptotic's
      error term is a constant fraction of the main term. Only slopes and
      control-versus-signal ratios are interpreted, never absolute counts.
    - >-
      Toy scale. The crypto-size rows of the identity are ARITHMETIC EVALUATIONS of a
      formula, labelled as such, and are not experiments.
  proof_search_map:
    bottleneck: >-
      The height-to-bit-size comparison, that a point of canonical height B has
      coordinates of bit-size proportional to B. If a representation existed in which a
      height-B point were writable in polylogarithmically many bits - a straight-line
      program, a divisibility-sequence index, a theta-coordinate compression - the size
      obstruction would evaporate entirely and only the search obstruction would remain.
      That is the single most valuable thing to attack in this hypothesis and it is named
      here as forward guidance rather than dismissed.
    baseline_embedding:
      parameter_slice: >-
        A rank-1 curve over the rationals with a known generator, at a named prime. The
        number of distinct reductions of points below a budget is then exactly the number
        of multiples of the generator whose square index times the generator's height is
        within budget, capped at the order of the reduced generator - an exact closed form.
      reproduction_check: >-
        A frozen fixture of the curve, generator, prime and the exact integer sequence of
        distinct-reduction counts on a declared budget ladder, requiring EXACT INTEGER
        EQUALITY. A mismatch is an instrument failure and blocks every other arm.
    observation_collision:
      observable: The covering exponent beta.
      distinct_preimage_search: >-
        SUCCEEDS AND IS BLOCKING. A genuine Mordell-Weil lattice and a random lattice of
        the same rank and regulator give the same beta. So beta ALONE attributes nothing
        to arithmetic. The hypothesis therefore does not rest on beta; it rests on the CM
        knee, which is a feature of the height spectrum that a matched random lattice does
        not have. If the knee is also reproduced by the random null, the hypothesis has no
        arithmetic content and must be reported that way.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace finding a global point reducing to a prescribed target by finding a
          lattice vector in a prescribed coset of the kernel of reduction, encoded as the
          Mordell-Weil lattice with that kernel as a sublattice of index N.
        predicted_gain: >-
          None as a speedup. The value is a cross-check: the kernel sublattice's inflated
          successive minima reproduce the same exponent from a second direction, so the
          reduction is consistent with the identity rather than an escape from it.
      - transform: stronger_invariant
        proposed_object: >-
          Track the full profile of distinct reductions against budget, including the ratio
          of distinct reductions to enumerated points, rather than only the exponent.
        predicted_gain: >-
          Exposes a structured non-injectivity if one exists; the exponent alone would
          average it away.
    quantifier_order: >-
      CLAIMED. FOR ALL global models of rank r reducing to E over F_p, and FOR ALL height
      budgets at which the reductions cover a constant fraction of the subgroup, the budget
      grows like N to the power two over r and the bit-size of a witness is proportional to
      the budget. THE TRAP, EXPLICITLY REJECTED: the inviting weaker reading that THERE
      EXISTS a small-height point reducing to the target, which is true for SOME targets -
      the reductions of the generators - and false for a uniformly random one. The claim is
      UNIFORM over targets, and that uniformity is what makes it a cost bound; any
      downstream use that quietly picks a favourable target is invalid.
    method_ceiling:
      strongest_certifiable_claim: >-
        On the tested toy curves, the covering exponent matches the effective rank over two
        with the effective rank equal to the O-rank in the CM arm; hence the representation
        cost of a usable lift and the meet-in-the-middle cost take the stated forms. It
        CANNOT certify a lower bound on lift attacks in general, since a compressed
        representation would evade it; cannot certify anything about growing arity; and
        cannot bear on cryptographic scale. It is NOT an ECDLP lower bound.
      nearby_object_control: >-
        A SKEW LATTICE - a rank-r lattice that is nearly rank-1 in the metric sense. There
        the distinct-reduction count grows with a much smaller slope, and a method that
        reports rank over two uniformly would be refuted on it. At least two such skew cases
        must be constructed synthetically and run.
    proof_obligations:
      - claim: The lattice-point count for the canonical height form has the stated leading term.
        responsibility: baseline
      - claim: The canonical-naive height difference is bounded, so bit-size is proportional to height.
        responsibility: size
      - claim: Covering a constant fraction forces the stated budget growth.
        responsibility: correctness
      - claim: The meet-in-the-middle bit-model time exponent takes the stated form.
        responsibility: runtime
      - claim: The CM effective rank inside a ball below the knee radius is the O-rank.
        responsibility: correctness
      - claim: The index-N kernel sublattice derivation reproduces the same exponent.
        responsibility: correctness
      - claim: No lower bound on lift attacks in general is claimed.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: >-
      The elliptic curve discrete logarithm problem in a prime-order subgroup, approached
      by lifting to a global model.
    prior_best: >-
      Parallel Pollard rho with distinguished points, at a constant times the square root
      of N group operations and constant memory, as this program records in KN-TECH-001
      and KN-TECH-006.
    time_exponent: >-
      One half plus one over r in the bit-cost model for the meet-in-the-middle variant
      this hypothesis prices - a DEFICIT relative to rho's one half, not an improvement.
    memory_exponent: >-
      One half plus one over r in bits, against rho's constant memory and BSGS's one half.
    hidden_cofactor: >-
      Three disclosed items. The error term in the lattice count is a constant fraction of
      the main term at every reachable budget. The additive height-comparison constant
      dominates at small budgets, which is why only slopes are interpreted. And the cost of
      constructing a canonical lift at all is excluded from every exponent above and
      dominates all of them for a generic curve.
    claim_kind: cofactor_improvement
    claim_kind_note: >-
      NEITHER an improvement nor a cofactor gain. The field is filled with the nearest
      permitted value because the schema offers no term for a quantified DEFICIT, which is
      what this hypothesis asserts. No exponent moves in the attacker's favour; the
      deliverable is a threshold arity and a measured penalty. The promotion gates of
      agents/coordinator.md do not apply, because nothing here may transition toward
      supported as a complexity improvement.
  heuristic_assumptions:
    - id: HEUR-CANL-B1
      formal_statement: >-
        FOR ALL tested curve and prime pairs and FOR ALL height budgets below the birthday
        point, the reduction map is injective on the set of global points of canonical
        height within budget up to a factor of one plus a vanishing quantity - that is,
        distinct low-height global points have distinct reductions.
      random_model_justification: >-
        Rigorously, two global points sharing a reduction differ by an element of the
        kernel of reduction, a subgroup of index at least N in the image, so a collision
        below the birthday point requires a kernel element of small height while the
        kernel's minimum is inflated by the index bound. That argument makes the statement
        a theorem below a computable budget. The classical statement imitated for the
        remaining range is the birthday bound for a uniform map into a set of size N.
      supporting_results:
        - 'The index bound on the kernel of reduction, derived within the parent proposal IDEA-20260807-6533fd.'
        - 'The birthday bound for a uniform map, classical.'
      validation_experiment_ids:
        - EXP-CANL-b50c7d
      falsification_condition: >-
        A measured injectivity ratio below 0.5 while the enumerated point count is still far
        below the square root of N. That is a structured non-injectivity of reduction on
        low-height points and reopens the lane with a concrete new object.
    - id: HEUR-CANL-B2
      formal_statement: >-
        The effective rank governing the count of points of canonical height within budget
        on a CM lattice is the O-rank below a knee at a computable budget, and the Z-rank
        above it, with the transition occurring over less than one decade in the budget.
      random_model_justification: >-
        Both regimes are rigorous consequences of the CM lattice's two-scale structure - no
        vector from the companion direction below the knee radius, and the full count above
        it. Only the SHARPNESS of the transition is heuristic; a slow transition would blur
        the knee without changing either asymptote. The classical analogue is the standard
        two-regime lattice-point count for a very skew form, whose crossover is governed by
        the ratio of successive minima.
      supporting_results:
        - 'The two-scale lemmas of the sibling record IDEA-20260807-fd5a24, cited as that record''s claims.'
      validation_experiment_ids:
        - EXP-CANL-b50c7d
      falsification_condition: >-
        A measured transition spanning more than two decades in the budget, or NO transition
        at all on a curve where the knee is predicted inside the searched range. The latter
        refutes the CM effective-rank halving and moves the threshold back.
  structural_ingredients:
    - description: >-
        The lattice-point asymptotic for a positive definite quadratic form, applied to the
        canonical height pairing.
      citation: >-
        Standard; shared with IDEA-20260807-44ba75 as one ingredient and cited from that
        record rather than re-derived.
      provenance: internal
      verified_by: 'The sibling proposal record, cited as its claim.'
      role: point count within a height budget
    - description: >-
        The bounded difference between canonical height and naive height on an elliptic curve.
      citation: 'Silverman''s height difference bound. RECALLED, NOT READ.'
      provenance: recalled
      verified_by: null
      role: converts a height budget into a coordinate bit-size; its constant is MEASURED here rather than assumed
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: covering_exponent_beta_non_cm
      direction: different
      minimum_effect: >-
        Equal to r over 2 with a fit interval excluding r over 2 plus or minus 0.4,
        measured on at least four ranks so the linear-in-rank prediction is tested rather
        than a single point.
    - metric: cm_knee_location
      direction: different
      minimum_effect: >-
        Within a factor 3 of the predicted knee budget. NO knee at all, on a curve where
        the knee is predicted inside the searched range, falsifies the CM limb and moves
        the threshold.
    - metric: injectivity_ratio
      direction: different
      minimum_effect: >-
        One minus a vanishing quantity while the enumerated count remains far below N. A
        ratio below 0.5 well before the birthday point refutes HEUR-CANL-B1 and reopens
        the lane.
    - metric: bytes_per_mitm_entry_versus_table_size
      direction: higher
      minimum_effect: >-
        Growth like table size to the power two over r. A FLAT curve means the coordinate
        penalty is absent at toy scale, leaving the deficit UNVERIFIED rather than refuted.
    - metric: full_cost_exponents
      direction: higher
      minimum_effect: >-
        Time and memory exponents each one half plus one over r, both strictly above rho's
        one half and zero respectively. These are the decision numbers.
  test_boundary:
    instances:
      - >-
        At least eight curves over the rationals of exhibited Mordell-Weil rank spanning 1
        to 4, both CM with class number 1 and non-CM, each reduced at three primes.
      - >-
        A rank-1 curve with a known generator, as the exact closed-form positive control.
      - >-
        At least two synthetic skew lattices of nominal rank r that are nearly rank-1 in
        the metric sense, as the nearby-object control.
      - >-
        Random lattices of matched rank and regulator with a random surjection onto the
        cyclic group of order N, as the null object.
    parameters:
      exhibited_ranks: '1, 2, 3, 4'
      cm_discriminants: 'absolute values in {3, 4, 7, 8, 11}, class number 1'
      primes_per_curve: '3'
      enumeration_box: 'points with x = u over w squared, |u| at most U and w at most W, with U and W declared before the run'
      budget_ladder: declared before the run and identical across arms
    implementation: >-
      A new standalone driver under experiments/EXP-CANL-b50c7d/driver/ performing point
      enumeration in the declared box, numerical canonical height computation, reduction
      modulo each prime, distinct-image counting, local slope fitting, and a small
      meet-in-the-middle with instrumented per-entry byte counts. Nothing under harness/ is
      modified.
    budget:
      wall_clock_seconds_total: 28800
      maximum_memory_gb: 32
      maximum_runs: 40
  falsification_conditions:
    - >-
      The rank-1 closed-form fixture does not reproduce EXACTLY. Instrument failure; nothing
      is reported from any arm.
    - >-
      beta does not track r over 2 across ranks. The lattice count is inapplicable at
      reachable budgets and limb B1 is UNVALIDATED rather than refuted; the record must say
      which and must not report the identity as confirmed.
    - >-
      No CM knee on a curve where one is predicted and reachable. Limb B2 is FALSE; the CM
      effective-rank halving is withdrawn and the representation threshold returns to the
      lower arity.
    - >-
      The injectivity ratio collapses well before the birthday point. HEUR-CANL-B1 and limb
      B3 are refuted; the lane reopens with a concrete new object, namely structured
      non-injectivity of reduction on low-height points.
    - >-
      The random-lattice null reproduces the CM knee. The knee is a lattice artifact, the
      hypothesis has NO arithmetic content, and that is the finding.
    - >-
      The covering fraction at fixed budget fails to decay as N grows. Artifact tell; no
      exponent may be reported from that run set.
    - >-
      A method reporting beta equal to rank over two uniformly also reports it on the skew
      lattices. The fit is not responding to lattice shape and every slope is suspect.
  interpretation_limits:
    - >-
      Toy scale. The crypto-size rows are arithmetic evaluations of the identity, labelled
      as such, and are not experiments.
    - >-
      This is a SIZE bound and NOT a lower bound on lift attacks. A compressed representation
      of high-height points would evade it entirely, and that escape is named in the
      proof_search_map as the most valuable thing to attack.
    - >-
      The threshold applies to REPRESENTATION cost only. Clearing it does not produce an
      attack; the search cost above it is unsolved and the only generic strategy priced here
      loses to rho.
    - >-
      Nothing here bears on any deployed curve and no claim about ECDLP hardness is made in
      either direction.
    - >-
      This record and the sibling IDEA-20260807-44ba75 share the lattice-count ingredient and
      MUST NOT be counted as independent evidence for the same conclusion.
  status: proposed
  proposed_by: idea-generator
  specified_by: coordinator
  prior_evidence_refs:
    - RQ-CANL-63098f
    - IDEA-20260807-6533fd
    - IDEA-20260807-fd5a24
    - IDEA-20260807-44ba75
    - IDEA-20260807-ee6ef7
    - KN-TECH-001
    - KN-TECH-006
    - KN-TECH-018
    - KN-TECH-031
    - KN-FIND-b7e091
  distinguishable_outcomes:
    - outcome: >-
        The rank-1 fixture reproduces exactly, beta tracks r over 2 across at least four
        ranks, the CM knee appears within a factor 3 of its predicted position and is NOT
        reproduced by the random null, injectivity holds below the birthday point, and
        bytes per entry grow as predicted.
      meaning: >-
        All four limbs hold at toy scale. The identity is validated, the representation
        thresholds are established at the stated arities, and the lane's cost model is
        settled: a lift-based attack pays a quantified deficit against rho on both time and
        memory at every point of the tradeoff. This is a scoped NEGATIVE about an attack
        family, which is the deliverable, and it is scoped to the tested curves, ranks,
        primes and budgets.
    - outcome: >-
        Everything else holds but there is NO CM knee on curves where it is predicted and
        reachable.
      meaning: >-
        Limb B2 and HEUR-CANL-B2 are FALSE. The CM effective-rank halving is withdrawn and
        the representation threshold moves back to the lower arity, which is a modest
        improvement in the attacker's direction and must be reported as such rather than
        buried. The rest of the identity is unaffected.
    - outcome: >-
        The injectivity ratio collapses well before the birthday point.
      meaning: >-
        HEUR-CANL-B1 and limb B3 are REFUTED. Reductions cover the subgroup faster than the
        lattice count predicts, which is a structured non-injectivity of the reduction map on
        low-height points. This REOPENS the lane with a concrete successor object and is the
        most consequential positive outcome available here, requiring independent replication
        before anything is claimed from it.
    - outcome: >-
        The random-lattice null reproduces beta AND the CM knee.
      meaning: >-
        The measurement has NO arithmetic content - it is measuring lattice shape only. No
        arithmetic conclusion may be drawn from any arm, and the record reports that as the
        finding. The null reproducing beta ALONE is expected and is a passing control, not
        this outcome.
    - outcome: >-
        The rank-1 closed-form fixture fails, or the covering fraction fails to decay with N,
        or the skew-lattice control returns rank over two.
      meaning: >-
        INSTRUMENT FAILURE. The run set is invalid, not negative; it returns to the executor
        with the failing fixture named, and no exponent, knee or ratio from it is
        interpretable.
    - outcome: >-
        Bytes per MITM entry are flat in table size while everything else holds.
      meaning: >-
        Limb B4 is UNVERIFIED rather than refuted - the coordinate penalty is simply not
        visible at reachable table sizes. The full-cost exponents may then be reported only
        as derivations, never as measurements, and the record must say so.
