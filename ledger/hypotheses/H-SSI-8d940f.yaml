# H-SSI-8d940f
# Total variation of a multiplicity-weighted Phi_2 walk.
# The three-compiler contract is a different object and is not edited.
hypothesis:
  id: H-SSI-8d940f
  question_id: RQ-SSI-1946c9
  goal_id: GOAL-SSI-2fa82a
  source_idea: IDEA-20261004-a09dd4
  experiment_id: EXP-SSI-435a2c
  specified_at: '2026-10-05'
  status: approved
  proposed_by: coordinator
  approved_by_decision: DEC-20261005-92a50c
  title: >-
    A multiplicity-weighted Phi_2 walk on the supersingular
    j-set leaves uniform at one step and, at p=19, does not move
    again at the second step
  statement: >-
    Let S_7 = {6}, S_11 = {0, 1}, and S_19 = {7, 18}. Weight an
    ordered pair inside S_p by the multiplicity of the second
    j-invariant as a root of Phi_2 in the second variable. A
    design-session expansion, which is not a run, gives weights
    6 to 6 with multiplicity 3; 0 to 1 with multiplicity 3;
    1 to 0 with multiplicity 2 and 1 to 1 with multiplicity 1;
    and both 7 and 18 send mass 2 to 7 and mass 1 to 18. Each
    row sums to 3. Start from the uniform law on S_p and step
    with probability proportional to those weights. Total
    variation against uniform is 0, 0, 0 at p=7 for times
    0, 1, 2; it is 0, 1/6, 1/18 at p=11; and it is 0, 1/6, 1/6
    at p=19. At p=19 the laws at times 1 and 2 are equal.
  mechanism: >-
    The one-vertex graph at p=7 has nowhere to put nonuniform
    mass, so the distance stays 0. At p=11 the two rows differ,
    so the second step moves the law again, from (1/3, 2/3) to
    (4/9, 5/9) on (0, 1). At p=19 both rows are (2/3, 1/3) on
    (7, 18), so one step reaches that law and the next step
    stays there.
  assumptions:
    - The walk uses root multiplicity. A simple edge without multiplicity is a different chain.
    - The start is uniform on S_p. Time is exactly 0, 1, or 2.
    - Neighbors outside S_p are not present. Each row sums to 3.
  proof_search_map:
    bottleneck: >-
      Whether two steps of this weighted walk change the distance
      to uniform after the first step.
    baseline_embedding:
      parameter_slice: >-
        The same three supersingular sets used for the Phi_2
        neighbor graph. The compiler contract measures three
        static maps, not this walk.
      reproduction_check: >-
        The monomial Phi_2 and the cubic in the second variable
        must yield the same multiplicities.
    observation_collision:
      observable: >-
        The law of the walk position at times 0, 1, and 2.
      distinct_preimage_search: >-
        A time at which that law differs from the frozen table.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: total variation of the walk law against uniform on S_p
        predicted_gain: >-
          Records the three distance triples. No key-distribution
          theorem.
    quantifier_order: >-
      For each prime, for each start j in S_p, for each root
      multiplicity, then for times 0, 1, and 2.
    method_ceiling:
      strongest_certifiable_claim: >-
        Three exact finite-state distributions. Not a compiler
        from a PKE key distribution to a plain endomorphism-ring
        challenge.
      nearby_object_control: >-
        p=7, where the distance stays 0, and p=19, where time 2
        copies time 1.
    proof_obligations:
      - claim: The weights and row sums match the statement
        responsibility: correctness
      - claim: The distances are 0, 0, 0; 0, 1/6, 1/18; and 0, 1/6, 1/6
        responsibility: size
      - claim: Both Phi_2 formulas agree
        responsibility: interface
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
