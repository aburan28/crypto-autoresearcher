# H-ECDLP-32f0c0
# Band-edge arithmetic for IDEA-20261002-760272.
# No energy is measured. Approval: DEC-20261002-11bb4d.
hypothesis:
  id: H-ECDLP-32f0c0
  question_id: RQ-ECDLP-002
  source_idea: IDEA-20261002-760272
  experiment_id: EXP-ECDLP-8dac2e
  specified_at: '2026-10-02'
  status: approved
  proposed_by: idea-generator
  approved_by_decision: DEC-20261002-11bb4d
  title: >-
    At N = 2^20 the power threshold sits below the factor 6.
  statement: >-
    Six squared is 36. Six to the fourth is 1296. Six to the eighth is
    1679616. Two to the twentieth is 1048576, which is 631040 below
    1679616, so N to the 1/8 at N = 2^20 is strictly below 6. Two to
    the twenty-first is 2097152, which exceeds 1679616 by 417536, so
    N to the 1/8 at N = 2^21 is strictly above 6. Six times one sixth
    equals 1. The square of the order-6 rho factor is 6, the upper
    edge of the constant band.
  mechanism: >-
    The proposal treats a ratio inside 1/6 to 6 as the constant arm
    and a ratio of at least N to the 1/8 as the power arm. This
    contract checks whether those two cuts are disjoint at the written
    toy size. It does not measure energy and it does not build a curve.
  assumptions: []
  proof_search_map:
    bottleneck: The gap 631040 between 6^8 and 2^20.
    baseline_embedding:
      parameter_slice: >-
        The band [1/6, 6] and the toy size N near 2^20 in
        IDEA-20261002-760272, read 2026-10-02. The powers were
        computed in this design session. That computation is not a run.
      reproduction_check: >-
        One route squares 6 three times. The other subtracts 2^20
        from 6^8. They must agree on 1679616 and on the gap 631040.
    observation_collision:
      observable: The gap 631040, and the excess 417536 at 2^21.
      distinct_preimage_search: >-
        Reporting 2^20 as at least 6^8 drops the gap 631040. Reporting
        2^21 as at most 6^8 drops the excess 417536.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The band edge 6 and the two powers of two.
        predicted_gain: Integer comparisons. No energy.
    quantifier_order: >-
      The eighth power of 6 comes first, then the comparison with
      2^20, then the comparison with 2^21.
    method_ceiling:
      strongest_certifiable_claim: >-
        The gap 631040 and the excess 417536. Not a measured energy
        and not an attack cost.
      nearby_object_control: >-
        Two to the twentieth reported as at least six to the eighth,
        and two to the twenty-first reported as at most that power.
    proof_obligations:
      - claim: 2^20 is 631040 below 6^8.
        responsibility: correctness
      - claim: 2^21 exceeds 6^8 by 417536.
        responsibility: correctness
      - claim: Six times one sixth equals 1.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: >-
        Comparing 2^20 with 6^8 is an integer subtraction. Those
        powers were computed in this design session. That work is not
        a run.
      citation: ledger/proposals/IDEA-20261002-760272.yaml
      provenance: internal
      verified_by: coordinator session 2026-10-02 (the powers recomputed; no energy measured)
      role: the constant band
  reduction_chain:
    core_problem: Check whether N to the 1/8 clears 6 at the written sizes.
    corollaries: []
  predictions:
    - metric: gap_at_20
      direction: different
      minimum_effect: 2^20 is 631040 below 6^8.
    - metric: excess_at_21
      direction: different
      minimum_effect: 2^21 exceeds 6^8 by 417536.
  test_boundary:
    instances: [two powers of two]
    parameters:
      six_eighth: 1679616
      two_20: 1048576
      gap_20: 631040
      two_21: 2097152
      excess_21: 417536
    implementation: Two arithmetic modules that must not import each other.
    budget:
      maximum_runs: 2
      maximum_memory_gb: 1
      maximum_workers: 1
  falsification_conditions:
    - Both implementations agree that 6^8 is 1679616, and 2^20 is not 631040 below it.
  interpretation_limits:
    - This does not measure additive energy and does not build a curve.
    - The papers named in the proposal were not reopened for this approval.
  dominated_by: No attack is claimed.
  sota_delta:
    time: No attack cost.
    memory: Not measured.
    data_queries: Not applicable.
