hypothesis:
  id: H-ECDLP-c41c87
  question_id: RQ-UOV-001
  title: >-
    Four multivariate goals declare a shared plain-UOV accounting basis a
    prerequisite and no such knowledge entry exists, so three private cost
    conventions are already committed; the fix is one adopted accounting basis
    plus one family-level object, and the exponent-neutrality identities must be
    stated on the Macaulay DEFICIT rather than on the rank, because the rank
    ratio is forced to k, ell and ell squared by variable counting alone
  statement: >-
    Source proposal IDEA-20260807-b63f08 (RQ-UOV-001, class tooling). FIELD
    NOTE: the object is the plain-UOV multivariate signature family and its
    Round-3 derivatives. No elliptic curve and no ECDLP instance appears
    anywhere; the ECDLP token in the identifier is an allocation artifact.
    (A) THE AUDIT FINDING, VERIFIED VERBATIM BY THIS COORDINATOR SESSION.
    GOAL-UOV-001's next_action reads, exactly: "Run /propose-ideas RQ-UOV-001
    first among the multivariate goals: GOAL-MAYO-001, GOAL-QRUOV-001, and
    GOAL-SNOVA-001 all consume this baseline, and three independently derived
    UOV cost conventions would make their Pareto comparisons meaningless."
    Searching knowledge/techniques for any multivariate or UOV costing entry
    returns exactly two files, KN-TECH-011 and KN-TECH-053, and KN-TECH-053's
    own title is "MQ and Boolean polynomial-system solving - XL, BooleanSolve,
    and the crossbred hybrid" with tags placing it in the index-calculus
    calibration thread. NEITHER STATES WHAT A UOV OIL-SPACE-RECOVERY FIGURE
    COUNTS, AT WHAT RATE, WITH WHAT MEMORY CHARGE, OR IN WHAT UNIT. The
    declared prerequisite therefore does not exist as a knowledge entry, and
    the risk GOAL-UOV-001 names in its own words is live.
    (B) DELIVERABLE ONE, A VERIFICATION ARTIFACT NOT AN EXPERIMENT. A
    scheme-independent accounting basis, parameterless and containing no
    arithmetic, fixing for the whole family: what an oil-space-recovery figure
    counts, field operations against gates; the memory charge model and its
    exponent AS A DECLARED ROW rather than an assumption; whether key-expansion
    and seed-expansion preprocessing are charged; and the signature-query
    budget. Its adoption is a Coordinator decision, which this hypothesis
    proposes and cannot perform.
    (C) DELIVERABLE TWO, AND THE IDENTITY IS RESTATED HERE ON COMPUTED GROUNDS.
    One family-level object, the oil-space-recovery Macaulay profile of a public
    map, computed at matched parameters on five arms: plain UOV, whipped,
    quotient-ring, matrix-ring, and an unstructured random null. THE SOURCE
    PROPOSAL PRE-REGISTERS THE IDENTITIES AS RATIOS OF PROFILES EQUAL TO k, ell
    AND ell SQUARED. THAT TEST IS FORCED AND CANNOT FALSIFY ANYTHING: at
    Macaulay degree 3 a generic quadratic sequence has no linear syzygies, so
    the rank equals the row count m times N exactly, and since the structured
    shapes multiply the variable count N by exactly k, ell and ell squared, the
    rank ratio is those same factors BY VARIABLE COUNTING ALONE, with no
    structure involved. The identities are therefore restated on the MACAULAY
    DEFICIT, namely rows minus rank minus C(m,2), which is 0 in degree 3 and
    the Koszul count in degree 4 for every generic arm INDEPENDENTLY of N. The
    exponent-neutrality prediction becomes: the excess deficit above C(m,2) is
    exactly 0 for each structured arm at matched parameters. That statement can
    fail, and its failure names which structural lifting is not
    exponent-neutral.
  mechanism: >-
    A cost convention fixes what is counted so that two goals' figures can be
    subtracted. Without one, each goal derives its own and their Pareto rows are
    not comparable, which is precisely the failure GOAL-UOV-001 predicted. The
    family-level object supplies the second half: if the three structural
    liftings are exponent-preserving changes of presentation, then at matched
    parameters they add no algebraic dependencies beyond the generic Koszul
    ones, so their excess Macaulay deficit is zero. A structured arm with a
    nonzero excess deficit is presenting the same problem in a form that has
    strictly fewer independent equations, which is a statement about that
    lifting and not about the convention.
  assumptions:
    - >-
      A stated correspondence exists that matches parameters across four
      differently shaped public keys. Getting it wrong makes every ratio
      meaningless, so the correspondence is declared and frozen before any arm
      is computed and is itself a reviewable artifact.
    - >-
      Macaulay profiles depend on the monomial order and the degree bound; both
      are pinned before any arm runs.
    - >-
      Toy parameters may not exhibit structure that appears at Round-3
      parameters. Stated as a limit, not designed away.
  proof_search_map:
    bottleneck: >-
      The absence of a shared unit. Every cross-scheme margin claim in this
      family passes through it, and three hypotheses have already each derived
      their own basis in-repo with no source read.
    baseline_embedding:
      parameter_slice: >-
        The plain-UOV arm at its own parameters, which must reproduce the
        published intersection-attack profile.
      reproduction_check: >-
        A forced value on the plain arm. If the plain arm cannot reproduce the
        published profile, the instrument is not measuring oil-space recovery
        and no structured ratio is admissible.
    observation_collision:
      observable: The Macaulay profile of a public map.
      distinct_preimage_search: >-
        COLLISION FOUND AND IT IS WHY THE IDENTITY IS RESTATED. Many maps share
        a profile, and worse, the RANK ratio between two arms is fixed by their
        variable counts alone at low degree. The additional condition that
        makes the observable identifying is the DEFICIT above the generic
        Koszul count, which is variable-count-free.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A parameterless accounting basis fixing counted quantity, memory
          charge, preprocessing charge and query budget as declared rows.
        predicted_gain: >-
          Four goals' Pareto rows become subtractable, which is the only thing
          that makes any later margin claim admissible.
      - transform: stronger_invariant
        proposed_object: >-
          The excess Macaulay deficit above C(m,2), in place of the raw profile
          ratio.
        predicted_gain: >-
          A quantity independent of the variable count, so the
          exponent-neutrality identities become falsifiable instead of forced.
    quantifier_order: >-
      FOR the two declared matched settings and FOR each structured arm, the
      excess Macaulay deficit above the generic Koszul count is 0. NOT CLAIMED:
      any statement at Round-3 parameters, any statement about attack cost, and
      any statement that the accounting basis is correct rather than merely
      declared and adopted.
    method_ceiling:
      strongest_certifiable_claim: >-
        At the tested toy settings and the declared correspondence, each
        structured arm's excess Macaulay deficit is the stated integer, and the
        accounting basis fixes the stated rows. It cannot certify anything
        about any scheme's Round-3 security level.
      nearby_object_control: >-
        The unstructured random arm at matched parameters. If all four
        structured arms match it, structure is invisible to this profile and the
        instrument says nothing about any of them.
    proof_obligations:
      - claim: No multivariate or UOV costing knowledge entry exists.
        responsibility: baseline
      - claim: The rank ratio at low degree is forced by variable counting.
        responsibility: correctness
      - claim: The excess deficit is independent of the variable count.
        responsibility: strictness
      - claim: The plain arm reproduces the published intersection-attack profile.
        responsibility: baseline
      - claim: The cross-shape parameter correspondence is declared and frozen.
        responsibility: interface
      - claim: Toy settings do not transfer to Round-3 parameters.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: null
    prior_best: null
    time_exponent: null
    memory_exponent: null
    hidden_cofactor: null
    claim_kind: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        The Macaulay deficit above the generic Koszul count at a fixed degree is
        a faithful ordering proxy for oil-space-recovery cost across the four
        structural shapes at matched parameters.
      random_model_justification: >-
        None available. This is the weakest link in the design and is stated as
        such: the three source proposals derive identities but none measures a
        profile, so the proxy has no supporting result behind it.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-f0be53]
      falsification_condition: >-
        Every structured arm matches the unstructured null's excess deficit,
        which would mean the profile does not discriminate structure and the
        proxy carries no information; or the plain arm fails to reproduce the
        published intersection-attack profile, which would mean the proxy is not
        tracking oil-space recovery at all.
  structural_ingredients:
    - description: >-
        The declared prerequisite that three sibling goals consume the plain-UOV
        baseline and that three independently derived conventions would make
        their Pareto comparisons meaningless.
      citation: GOAL-UOV-001
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-3baed3, read the next_action field of
        ledger/goals/GOAL-UOV-001.yaml verbatim and confirmed the quoted
        sentence appears exactly as reproduced in the statement above
    - description: >-
        The absence of any multivariate or UOV costing entry in the knowledge
        corpus, with KN-TECH-011 and KN-TECH-053 being the only two entries
        mentioning the family and both written for the index-calculus thread.
      citation: knowledge/techniques
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-3baed3, searched knowledge/techniques for
        UOV, MAYO, multivariate and oil-space and found exactly two matching
        files, then read KN-TECH-053's front matter and confirmed its title and
        tags
    - description: >-
        The code-based half of this repository's analogous accounting basis,
        referenced as ISD-FC-2026.
      citation: ISD-FC-2026
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-3baed3, confirmed the string appears in
        several proposals and questions in this repository and NOT in any
        adopted decision record; it is therefore a template for the shape of
        the artifact and is itself unadopted, which the source proposal states
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: uov_fc_2026_row_completeness
      direction: different
      minimum_effect: >-
        Binary per row. The accounting basis must fix, as declared rows with
        their alternatives named: counted quantity, memory charge model and its
        exponent, preprocessing charge for key and seed expansion, and the
        signature-query budget. A missing row is a FAIL regardless of what else
        the document contains.
    - metric: excess_macaulay_deficit_per_structured_arm
      direction: different
      minimum_effect: >-
        Predicted EXACTLY 0 for each of the whipped, quotient-ring and
        matrix-ring arms at matched parameters, against a generic Koszul count
        of C(m,2). A nonzero excess on any arm falsifies exponent-neutrality for
        that lifting and names it. THIS REPLACES the source proposal's ratio
        test, which is forced to k, ell and ell squared by variable counting.
    - metric: forced_rank_ratio_check
      direction: different
      minimum_effect: >-
        FORCED VALUES, RETAINED AS AN INSTRUMENT CHECK AND NOT AS A
        DISCRIMINATOR. At degree 3 the rank ratio between a structured arm and
        the plain arm must equal exactly k, ell and ell squared, because the
        rank is the row count m times N and N scales by exactly those factors.
        A deviation means the variable-count correspondence is wrong and every
        deficit in the run is void.
    - metric: unstructured_null_excess_deficit
      direction: different
      minimum_effect: >-
        Predicted exactly 0. If every structured arm equals the null, structure
        is invisible to this profile and nothing may be concluded from it.
  test_boundary:
    instances:
      - plain UOV at two matched settings
      - whipped, quotient-ring and matrix-ring arms at the same settings under
        a declared and frozen parameter correspondence
      - an unstructured random multivariate-quadratic arm at matched parameters
    parameters:
      degrees: [3, 4]
      settings: two matched settings declared before any arm runs
      seeds_per_arm: 20
    implementation: exact linear algebra over the declared field, no floating point
    budget:
      wall_clock_seconds: 3600
      memory_gb: 8
      maximum_runs: 30
  falsification_conditions:
    - >-
      All three identities hold, i.e. every structured arm has excess deficit 0.
      One conditional statement then covers four Round-3 candidates and is
      stated on numbered heuristics.
    - >-
      One arm has a nonzero excess deficit. The conjunction is killed cheaply,
      which is the point of stating it as one object, and that scheme's
      structural lifting is NOT exponent-neutral at the tested settings.
    - >-
      Every arm matches the unstructured null. The profile is not a
      discriminating instrument and nothing may be concluded from it.
    - >-
      The plain arm fails to reproduce the published intersection-attack
      profile. The instrument is not measuring oil-space recovery.
    - >-
      The forced degree-3 rank ratio is not exactly k, ell or ell squared. The
      parameter correspondence is wrong and every number in the run is void.
  interpretation_limits:
    - >-
      NOT AN ECDLP RECORD AND NOT A CURVE RECORD. Every object is a
      multivariate public map. The curve-free-null requirement is discharged BY
      CONSTRUCTION because no object here is a curve; the structure-free null
      the design does require, and runs, is the unstructured random arm.
    - >-
      Toy scale. No claim about any scheme's Round-3 security level, in either
      direction.
    - >-
      AN ACCOUNTING BASIS IS ADOPTED BY A COORDINATOR DECISION. This hypothesis
      proposes it and does not adopt it, per AGENTS.md rule 1. A written basis
      that is not adopted changes nothing, which is exactly what happened to the
      analogous ISD-FC-2026 artifact.
    - >-
      The deficit proxy has NO supporting result behind it. HEUR-001 is stated
      with an empty supporting_results list rather than dressed up, and the
      unstructured null plus the published-profile forced value together bound
      how much faith it can carry.
    - >-
      No published MAYO, QR-UOV or SNOVA number is asserted anywhere here; no
      agent in this program has read those specifications.
  status: proposed
  proposed_by: idea-generator
