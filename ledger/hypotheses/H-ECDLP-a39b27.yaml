    is 131072. Two hundred sixty-two thousand one hundred forty-four
    exceeds one hundred thirty-one thousand seventy-two by 131072. The
    product of the two table sizes is 34359738368. Their sum is 393216.
    Two width-18 tables each store 131072, so that gap is 0 and their
    product is 17179869184.
  mechanism: >-
    The proposal writes the widths 19 and 18 and the sizes 262144 and
    131072. This contract checks those integers. It does not add a
    curve point.
