      verified_by: efaa5e0b09:ledger/proposals/IDEA-20261005-e211ac.yaml
    - ref: RQ-SSI-001
      provenance: internal
      claim: >-
        Binding question, read from ledger/questions/RQ-SSI-001.yaml.
