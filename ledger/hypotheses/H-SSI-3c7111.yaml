# H-SSI-3c7111 — specified from IDEA-20261005-e211ac.
# Protocol approval is DEC-20261006-f59943. The source idea lives in
# commit efaa5e0b09 on design/qlwe-9f4777-logunit (PR 1880) and is not
# copied here. This record asserts no path-finding algorithm and no
# change to the p^{1/4} or p^{1/3+o(1)} bounds.
# The design session counted supersingular j-invariants by the Hasse
# invariant and did not build a 2-isogeny or a distance.
hypothesis:
  id: H-SSI-3c7111
  question_id: RQ-SSI-001
  source_proposal: IDEA-20261005-e211ac
  goal_id: null
  goal_id_note: >-
    This design binds the question RQ-SSI-001 and does not attach a
    goal record. It does not create one.
  status: approved
  status_note: >-
    approved means the distance protocol in EXP-SSI-1dfe66 is approved
    for a later executor. It does not mean the ratio was observed.
    Status moves only by DEC-20261006-f59943 under the standing user
    authorization of 2026-09-06.
  proposed_by: coordinator
  conversion_note: >-
    The objects, the ratio 3/2, the window of 8 to 24 vertices, and the
    refusal to move an exponent are carried from IDEA-20261005-e211ac,
    which was read via git show efaa5e0b09. The Coordinator named the
    prime p = 83 and froze the graphs G_full and G_rat before any run
    of EXP-SSI-1dfe66.

  statement: >-
    TEST BOUNDARY. One prime and two simple graphs. The prime is p = 83,
    the least prime congruent to 11 mod 12 whose supersingular
    j-invariant count lies in 8 to 24. The count predicted by the
    classical formula floor(p/12)+2 is 8. The executor recomputes the
    count by the Hasse invariant and does not trust the formula. Let S
    be the set of supersingular j-invariants in F_{83^2}. Let S_83 be
    the subset of those j that lie in F_83. Let G_full be the simple
    graph on S with an edge when a separable 2-isogeny exists over
    F_{83^2}. Let G_rat be the simple graph on S_83 with an edge when a
    separable 2-isogeny exists over F_83. G_rat is not the induced
    subgraph of G_full.

    PRE-REGISTERED PREDICTION, fixed before any distance is computed.
    Both graphs are connected, 0 and 1728 lie in S, every vertex of
    G_full outside {0, 1728} has degree 3, and the ratio of mean
    pairwise distances d(G_full)/d(G_rat) is at least 3/2. A ratio
    strictly less than 3/2, on a run where that ratio is defined, is a
    negative.

    DISTINGUISHABLE OUTCOMES. (1) The setup checks pass, the two
    distance methods agree, and the ratio is at least 3/2: success.
    (2) The setup checks pass, the methods agree, and the ratio is
    strictly less than 3/2: negative. (3) Some vertex outside {0, 1728}
    has degree not equal to 3: the ratio is not interpreted. (4) Either
    graph is disconnected, or |S_83| is less than 2: the ratio is
    undefined. (5) 0 or 1728 is missing, the enumerated |S| is outside
    8 to 24, or a smaller prime congruent to 11 mod 12 has its
    enumerated count inside that window: failed setup. (6) The path-graph
    null has mean distance less than or equal to d(G_full), or the two
    methods disagree: the statistic is not read. (7) A timeout or crash:
    failed_infrastructure, not evidence.

    No torsion image is used. No endomorphism ring is returned. No
    path-finding algorithm is claimed. The soft-O of p to the 1/4 bound
    in KN-OPEN-013 and the p to the 1/3 plus o(1) pattern in KN-TECH-055
    are not changed.

  mechanism: >-
    The surviving object is the supersingular 2-isogeny graph at p = 83,
    not an ECDLP instance. Two explanations are separated before the
    search. Explanation A: restricting to F_83-rational vertices and
    F_83-rational kernels shortens mean distance by a factor at least
    3/2, which is a constant-factor orientation effect on this one graph.
    Explanation B: the ratio is strictly less than 3/2, so the
    F_83-structure does not shorten paths by that factor on this graph.
    A third outcome, degree not equal to 3 off {0, 1728}, means the
    enumerated simple graph is not the 3-regular graph path-finding cost
    models use, and the ratio is then not interpreted. The representation
    is the j-invariant. Sigma is the set of separable 2-isogenies, a
    partial action on the finite set S. The projection discards the
    kernel subgroup and the isogeny map and keeps the codomain j.
    Distinct kernels can share a codomain j, so the projection is not
    injective on kernels. Vertices 0 and 1728 are the nearby objects
    where extra automorphisms can drop the distinct-neighbor count.
    No SIDH torsion basis is published into the test.

  assumptions:
    - >-
      Supersingular j-invariants used here lie in F_{83^2}. The test
      enumerates them by the Hasse invariant of one short-Weierstrass
      model per j. It does not trust the closed count floor(p/12)+2.
    - >-
      p = 83 is congruent to 11 mod 12. A recalled congruence predicts
      that 0 and 1728 are supersingular. Membership is checked. If
      either is absent, the setup fails.
    - >-
      Distances are in the simple graph of distinct neighbor
      j-invariants, excluding the source itself. Multiple kernels with
      the same codomain j contribute one edge. A kernel whose codomain
      j equals the source is not an extra vertex and is not a loop in
      the degree.
    - >-
      G_rat uses only kernels whose x-coordinate lies in F_83. An
      isogeny defined over F_{83^2} between two rational j-invariants
      is not an edge of G_rat.
    - >-
      Toy scope is this one prime. No cryptographic prime is in the
      test, and no transfer to one is claimed.

  proof_search_map:
    bottleneck: >-
      The mean-distance ratio between G_full and G_rat at p = 83.
    baseline_embedding:
      parameter_slice: >-
        Exact distances on a graph whose vertex count is predicted to
        be 8, which is smaller than every parameter in the p to the
        1/4 path-finding bound.
      reproduction_check: >-
        Every vertex of G_full outside {0, 1728} has degree 3, and both
        graphs are connected. Otherwise the ratio is not a path-finding
        datum.
    observation_collision:
      observable: d(G_full)/d(G_rat)
      distinct_preimage_search: >-
        Two non-isomorphic graphs can share a mean distance. A ratio
        strictly below 3/2 is that collision on this prime.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The prime p = 83 and the two simple graphs G_full and G_rat.
        predicted_gain: >-
          A ratio of two exact means, predicted at least 3/2. No exponent.
    quantifier_order: >-
      At the prime p = 83, every vertex of G_full outside {0, 1728} has
      degree 3, and the mean-distance ratio is at least 3/2. Failure at
      this single prime falsifies the claim at this prime only.
    method_ceiling:
      strongest_certifiable_claim: >-
        A constant-factor gap between two mean distances on the
        supersingular 2-isogeny graph at p = 83, or the absence of that
        gap.
      nearby_object_control: >-
        The vertices 0 and 1728, where degree 3 is not required. A
        distinct-neighbor count of 3 or more at either vertex falsifies
        the automorphism exception used as the control.
    proof_obligations:
      - claim: degree 3 off {0, 1728}
        responsibility: correctness
      - claim: both graphs connected
        responsibility: feasibility
      - claim: ratio at least 3/2
        responsibility: size
    not_applicable_reason: >-
      The map applies to this one prime. It is not omitted. No exponent
      bookkeeping is claimed.

  asymptotic_claim:
    problem: none — no complexity improvement is claimed
    prior_best: >-
      KN-OPEN-013 records pure supersingular path-finding at soft-O of
      p to the power 1/4. KN-TECH-055 abstracts a p to the 1/3 plus o(1)
      pattern. Neither is run and neither is beaten.
    time_exponent: unchanged
    memory_exponent: unchanged
    hidden_cofactor: >-
      None in an o(1) term. The output is one ratio of two means on a
      graph of at most 24 vertices. The path-finding exponents stay
      where the opened notes put them.
    claim_kind: not_applicable

  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        Mean distance in G_full is at least 3/2 times mean distance in
        G_rat when both are connected and G_full is 3-regular off
        {0, 1728}. This imitates the Moore lower bound on the diameter
        of a 3-regular graph, diameter at least log(|V| - 1) / log(2),
        together with the heuristic that the mean distance is at most
        twice that lower bound. The Moore bound was not opened in a
        paper in this design session.
      random_model_justification: >-
        The comparison is a point prediction at one prime, not a draw
        from a random integer. A finite 3-regular graph on |V| vertices
        has diameter at least log(|V| - 1) / log(2) under the recalled
        Moore bound. That bound does not force the ratio of two means
        to be 3/2. KN-OPEN-013 records a path-finding exponent and does
        not state this ratio.
      supporting_results: []
      validation_experiment_ids:
        - EXP-SSI-1dfe66
      falsification_condition: >-
        The measured ratio d(G_full)/d(G_rat) is strictly less than 3/2
        on a run where the ratio is defined. Separately, if either mean
        exceeds twice its Moore lower bound, the expander reading fails
        at this prime and the ratio is not exported as an asymptotic.

  structural_ingredients:
    - description: >-
        KN-OPEN-013 records that after the SIDH break, pure
        supersingular path-finding has best known cost soft-O of p to
        the power 1/4, classical and quantum. This hypothesis does not
        run a path-finding algorithm and does not change that figure.
      citation: KN-OPEN-013
      provenance: internal
      verified_by: knowledge/open-problems/KN-OPEN-013.md
      role: unchanged path-finding exponent
    - description: >-
        KN-TECH-055 abstracts a p to the power 1/3 plus o(1) pattern
        from a structural degree bound, a smoothness heuristic, and a
        meet-in-the-middle. This hypothesis does not run that pattern.
      citation: KN-TECH-055
      provenance: internal
      verified_by: knowledge/techniques/KN-TECH-055.md
      role: scope fence; the 1/3 pattern is not instantiated
    - description: >-
        KN-LIT-062 describes SIDH as walks on the supersingular
        2-isogeny and 3-isogeny graphs over F_{p^2}. The contribution
        section that was opened contains no diameter table.
      citation: KN-LIT-062
      provenance: internal
      verified_by: knowledge/literature/KN-LIT-062.md
      role: the graph this protocol measures
    - description: >-
        KN-OPEN-015 records that publishing torsion images collapsed
        SIDH. This test publishes no torsion image.
      citation: KN-OPEN-015
      provenance: internal
      verified_by: knowledge/open-problems/KN-OPEN-015.md
      role: auxiliary-data fence
    - description: >-
        KR-RHO-5b1c0a states that a representation and subset-sum
        approach to ECDLP over F_{p^2} costs p^{1.314}, worse than rho
        at O(p). This hypothesis builds no representation list.
      citation: KR-RHO-5b1c0a
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-5b1c0a.yaml
      role: scope fence; not an F_{p^2} ECDLP attack

  reduction_chain:
    core_problem: >-
      Whether the mean-distance ratio of G_full to G_rat at p = 83 is
      at least 3/2. Not an attack.
    corollaries: []

  predictions:
    - metric: ratio of mean pairwise distances d(G_full)/d(G_rat)
      direction: higher
      minimum_effect: at least 3/2
    - metric: degree of each vertex in G_full outside {0, 1728}
      direction: different
      minimum_effect: exactly 3
    - metric: distinct-neighbor count of j = 0 and of j = 1728
      direction: lower
      minimum_effect: at most 2

  test_boundary:
    instances:
      - G_full, the simple supersingular 2-isogeny graph on S at p = 83
      - G_rat, the simple F_83-rational 2-isogeny graph on S_83
      - the path graph on |S| vertices, used only as the null
    parameters:
      prime: 83
      residue: 11 mod 12
      vertex_window: [8, 24]
      predicted_vertex_count: 8
      predicted_ratio_at_least: 3/2
      field: F_83[z]/(z^2+1)
    implementation: >-
      A later executor enumerates S, builds both graphs by Vélu, and
      computes the two means. This design does not build the graphs.
    budget:
      enforcement: advisory
      maximum_runs: 2
      note: >-
        One prime, inside one run. The second run id is an infrastructure
        retry, not a second scientific prime.

  falsification_conditions:
    - >-
      The ratio d(G_full)/d(G_rat) is strictly less than 3/2 on a run
      where the ratio is defined. H1 is then false at p = 83.
    - Some vertex of G_full outside {0, 1728} has degree not equal to 3.
    - Either graph is disconnected, or |S_83| is less than 2.
    - >-
      The enumerated |S| at p = 83 is outside 8 to 24, or a smaller
      prime congruent to 11 mod 12 has enumerated count inside that
      window.
    - >-
      The path-graph null has mean distance less than or equal to
      d(G_full).

  interpretation_limits:
    - >-
      A ratio of 3/2 on at most 24 vertices is a constant factor. It
      does not beat soft-O of p to the 1/4 and it does not instantiate
      the p to the 1/3 plus o(1) pattern.
    - >-
      Failure of degree 3 falsifies the enumerated simple graph as a
      cost-model carrier at p = 83. It is not a break of CSIDH or SQIsign.
    - >-
      A ratio below 3/2 falsifies the orientation reading at p = 83
      only.
    - No quantum query cost is measured.

