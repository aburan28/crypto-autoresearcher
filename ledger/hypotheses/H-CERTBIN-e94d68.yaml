# H-CERTBIN-e94d68
# Trace-membership counts for IDEA-20260926-a79052.
# No oracle. Approval: DEC-20261002-e81831.
hypothesis:
  id: H-CERTBIN-e94d68
  question_id: RQ-CERTBIN-836ce2
  source_idea: IDEA-20260926-a79052
  experiment_id: EXP-CERTBIN-2fc630
  specified_at: '2026-10-02'
  status: approved
  proposed_by: idea-generator
  approved_by_decision: DEC-20261002-e81831
  title: >-
    The nonzero trace classes are unequal, and at n = 17 with a = 0
    they are 65485 and 65586.
  statement: >-
    The count of nonzero field elements, 2^n-1, is odd, so it is
    not divisible by 2. On F_2[t]/(t^17+t^3+1) the trace is zero on
    exactly 65536 field elements. For a = 0 the nonzero classes of
    Tr(x + x^{-2}) are 65485 and 65586, differing by 101. For a = 1
    the classes swap. Neither class equals 65536. On
    F_2[t]/(t^5+t^2+1) with a = 0 the nonzero classes are 21 and 10,
    differing by 11. The written floor gap 68.58 minus 60.81 is
    7.77 bits, strictly above 7.7 and strictly below 7.8, and it
    stays positive after subtracting one bit.
  mechanism: >-
    The proposal says the membership condition holds for exactly
    half the nonzero field elements. This contract counts those
    classes. It does not run an oracle.
  assumptions: []
  proof_search_map:
    bottleneck: Two field counts and one bit gap.
    baseline_embedding:
      parameter_slice: >-
        The identity Tr(x) = Tr(1/x) + Tr(a) for b = 1, written in
        IDEA-20260926-a79052, read 2026-10-02. The class sizes were
        counted in this design session. That count is not a run.
      reproduction_check: >-
        One route counts the trace classes. The other repeats the
        count in a separate module. They must agree.
    observation_collision:
      observable: The two class sizes at n = 17 and the oddness of 2^n-1.
      distinct_preimage_search: >-
        An equal split of the 131071 nonzero elements is false.
        Reporting that invalidates the run.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: Two binary fields and one bit gap.
        predicted_gain: Integer comparisons. No attack cost.
    quantifier_order: >-
      The nonzero count is tested for parity, then the trace
      classes are counted, then the floor gap is subtracted.
    method_ceiling:
      strongest_certifiable_claim: >-
        The class sizes and the bit gap. Not a refutation share
        and not a statement that the filter helps.
      nearby_object_control: >-
        The written equal half, and the round count 65536.
    proof_obligations:
      - claim: At n = 17 and a = 0 the classes are 65485 and 65586.
        responsibility: correctness
      - claim: 2^n-1 is odd.
        responsibility: correctness
      - claim: An equal split is rejected.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: >-
        The membership bit is the trace of x + a + x^{-2}. The
        class sizes were counted on the two named fields. The
        floor gap is a subtraction of hundredths.
      citation: ledger/proposals/IDEA-20260926-a79052.yaml
