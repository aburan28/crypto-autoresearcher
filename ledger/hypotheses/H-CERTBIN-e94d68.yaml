  reduction_chain:
    core_problem: Check the class sizes and the odd nonzero count.
    corollaries: []
  predictions:
    - metric: class_sizes
      direction: different
      minimum_effect: 65485 and 65586 at n = 17, a = 0.
    - metric: equal_split
      direction: flat
      minimum_effect: Impossible, because 2^n-1 is odd.
  test_boundary:
