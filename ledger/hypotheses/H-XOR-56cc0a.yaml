hypothesis:
  id: H-XOR-56cc0a
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  experiment_id: EXP-XOR-62b256
  status: approved
  statement: >-
    At matched unique-relation coverage on the frozen toy Semaev m=3
    instrument, x-oracle MITM has lower fully charged cost per recovered
    relation than a uniform-from-F_p MITM null because the null requires
    Theta(p) queries per source point to reach constant coverage.
  mechanism: >-
    Arm B queries the correct x-coordinate once for each source point and
    therefore selects every compatible right-half bucket. Arm D replaces that
    information with q independent uniform field queries per source point.
    A valid tuple is recovered by D only when one of those q values equals its
    required bucket key, with probability 1-(1-1/p)^q. Charging table
    construction, each query, and every candidate verification exposes the
    information value separately from generic MITM structure.
  predictions:
    - >-
      For every cell, measured D coverage at q is consistent with
      1-(1-1/p)^q and q=1 coverage is approximately 1/p.
    - >-
      At the preregistered 50% and 90% coverage points, D candidate
      verifications are consistent with q*N*T/p, where N=|F| and T is the
      total right-table bucket population.
    - >-
      Arm B has lower charged cost per unique recovered relation than D at
      matched coverage in all eight (p,b) cells.
  test_boundary:
    primes: [101, 103, 107, 211]
    b_values: [0.4, 0.5]
    arity_m: 3
    seeds: [1, 2, 3, 4, 5]
    claim_tier: toy
  falsification_criteria:
    - >-
      F1: D's 95% binomial interval excludes the predicted unique-coverage
      probability in at least two cells at either matched-coverage q.
    - >-
      F2: D charged cost per unique recovered relation is no larger than B's
      in any matched-coverage cell.
    - >-
      F3: the frozen machinery control R_A=R_B fails in any cell; this
      invalidates the cell rather than supporting or rejecting the mechanism.
  dominated_by: Pollard rho at exponent 1/2
  sota_delta:
    time_exponent: 0
    memory_exponent: 0
    note: >-
      This is a toy instrumentation hypothesis about a constant-factor
      information advantage. It claims no ECDLP exponent improvement.
  approved_by: coordinator
  approved_at: '2026-08-08'
  created_by: coordinator
  created_at: '2026-08-08'
  claim_tier: toy
