hypothesis:
  id: H-ECDLP-51f052
  question_id: RQ-ECDLP-002
  proposal_id: IDEA-20260909-4c5ee9
  experiment_ids:
  - EXP-ECDLP-ad0ffe
  goal_ids:
  - GOAL-ECDLP-001
  - GOAL-ICEX-001
  statement: A qualifying public native relation constructor yields correctly source-labelled equations and full
    rank in the actual unknown norm logarithms on fresh toy fixtures, without secret scalar access.
  mechanism: A native principal-divisor certificate plus independently certified norm equation provides M*x=b; canonical
    norm columns remove duplicate/sign/known-log artefacts. An explicit new source locator remains missing.
  assumptions:
  - Exact finite inputs and public algorithms are fixed before trials.
  - Independent checks validate source equations and all required controls.
  - No target/factor-base scalar oracle, uncharged advice or rejected-attempt omission.
  predictions:
  - metric: Public source-labelled row validity and source-information audit
    direction: different
    minimum_effect: A qualifying constructor produces independently checkable equations with public labels, rejects
      all false labels and supplies an explicit source inverse/locator, unlike the post-hoc and tuple-first controls.
  - metric: Projected affine relation rank
    direction: different
    minimum_effect: On each declared fresh holdout fixture, qualifying row collection reaches rank U with consistency;
      otherwise the tested constructor does not support complete base-log recovery under this protocol.
  - metric: Historical and planted correctness fixtures
    direction: different
    minimum_effect: Known internal fixtures and planted cases reproduce their specified algebraic checks; this calibrates
      the instrument only.
  test_boundary:
    instances:
    - For each p in [101,211,431,4099], enumerate (A,B) lexicographically with 0<=A<p, 1<=B<p. Exclude historical
      (42,60),(127,142),(62,120),(4041,4067) for the corresponding p. Require smooth C:y^2=x^6+A*x^2+B, smooth E1:Y^2=U^3+A*U+B
      and E2:V^2=W^3+A*W^2+B^2, prime odd r=#E1(Fp), and eight distinct nonzero E1 images up to sign of rational
      C points. Retain the first two eligible pairs per p (8 fresh curves); archive all inspected pairs and failures.
      Exact constants and UIDs must be materialized and committed before approval.
    parameters:
      stage: W
      specification: experiments/EXP-ECDLP-ad0ffe/specification.yaml
      replication:
        seeds:
        - 0
        - 1
        - 2
        independent_instances: 8
      scope: toy finite family; no deployed curve extrapolation
    implementation: Unimplemented exact candidate/interface obligations listed in specification.approval_blockers.
    budget:
      enforcement: advisory
      wall_clock_seconds_per_run: null
      total_cpu_hours: null
      maximum_memory_gb: 2
      maximum_runs: null
      maximum_workers: 1
  falsification_conditions:
  - 'P-W-source/C-W-source: a validly audited candidate only returns unknown-scalar endpoints or post-hoc residual
    certificates and has no source-return mechanism. P-W-rank/C-W-rank: the exact frozen finite stream yields rank
    below U or inconsistent source rows on fresh cells. This rejects only the tested constructor/stream as a complete
    source-labelled base-log mechanism; instrument/control failures are invalidity.'
  interpretation_limits:
  - 'Design only: no scientific run, measured gain, new asymptotic exponent, novelty certificate or security conclusion.'
  - The unsourced historical 32-cover quotation is not an input catalog; no identification or completeness claim
    is made.
  - P1546 remains a scoped fixed-branch counting gate; this design does not execute or reopen the IDEA-002 frozen
    contract.
  - A cover, Frobenius overlap, auxiliary cancellation or faster known-scalar multiplication alone does not solve
    ECDLP.
  - Missing code, access, admission or verification is an implementation/infrastructure impediment, not mathematical
    falsification.
  - This initial proposed record is not an official approval or evidence-supported hypothesis transition.
  status: proposed
  proposed_by: coordinator under TASK-20261019-a55a7a; owner-requested staged design
  asymptotic_claim: null
  proof_search_map:
    bottleneck: Known public source information and independent projected rank before any complete cost advantage.
    baseline_embedding:
      parameter_slice: Current exact matched IC protocol per admitted finite fixture/size remains to be bound; PO003
        only calibrates algebra.
      reproduction_check: Reproduce exact baseline workload and S before any performance claim; G/W are correctness
        prerequisites only.
    observation_collision:
      observable: Zero companion component / apparent native smoothness or rank.
      distinct_preimage_search: Split-product control also cancels auxiliary components while leaving unknown elliptic
        scalar; duplicate/sign columns and post-hoc residuals test retained-information collisions.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: A native principal-divisor certificate plus independently certified norm equation provides
        M*x=b; canonical norm columns remove duplicate/sign/known-log artefacts. An explicit new source locator
        remains missing.
      predicted_gain: No established gain; exact finite stage criterion only.
    quantifier_order: Freeze public family/fixtures/base/constructor/selector first, then independent challenge
      scalar; same policy for every admitted target. No secret-conditioned map or post-success selection.
    method_ceiling:
      strongest_certifiable_claim: Finite arithmetic or source/rank correctness for G/W; measured finite-stage improvement
        for S; independently verified matched complete-S improvement for E. No asymptotic or secp/P256 conclusion.
      nearby_object_control: Split E x A with arbitrary auxiliary cancellation; public scalar push-pull and tuple-first
        unknown source endpoint.
    proof_obligations:
    - claim: Explicit public source-return mechanism, no verifier-as-locator or hidden log lookup.
      responsibility: interface
    - claim: Actual distinct unknown column count U and full affine rank modulo r.
      responsibility: correctness
    - claim: All construction/rejection/label/LA/descent/recovery work charged with same baseline scope.
      responsibility: runtime
    - claim: Any operation beyond P1546 scope must identify the distinct compact adaptive/growing-degree/implicit
        mechanism rather than rename a fixed branch.
      responsibility: scope
