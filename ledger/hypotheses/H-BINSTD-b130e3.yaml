# RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001. Distinct from 161102 / 5ebfcd /
# 3f2d06 / 5c936b / 9ff676. Approved DEC-20261003-34592e. ZERO RUNS in
# this design packet. No Magma/Sage/AUXIN. No Bedrock. No curve attack /
# exponent claim.
# =============================================================================
hypothesis:
  id: H-BINSTD-b130e3
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261002-df6215
  experiment_id: EXP-BINSTD-c896e5
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-03'
  approved_at: '2026-10-03'
  authorised_by: DEC-20261003-34592e
  status: approved
  status_history:
    - from: proposed
      to: specified
      at: '2026-10-03'
      by: DEC-20261003-34592e
    - from: specified
      to: approved
      at: '2026-10-03'
      by: DEC-20261003-34592e
  proposed_by: coordinator

  title: >-
    At matched charged wall, Nagao disjoint-coset unique-relation yield
    rate stays ≥ chained S_3 on n=17, ℓ=3 toy Koblitz under twin in-Python
    meters

  statement: >-
    CLAIM (heuristic_validation / relation-source race instrument; NO ATTACK;
    NO EXPONENT). For the frozen toy Koblitz cell n=17, A=0, B=1, V =
    F_2-span of {1,t,t^2}, across N_rep seeded nulls and matched wall B,
    let R := (unique-rels/charged-sec)_Nagao / (unique-rels/charged-sec)_chainedS3.
    Twin Field vs TableField meters agree and R ≥ ρ with ρ=1 frozen at
    Stage 0 (O-SUPPORT) OR R < ρ (O-FAIL-BAND; chained-S3-still-faster at
    this scale). Both arms unique-count 0 → O-INCONCLUSIVE. Twin mismatch
    → O-ARTIFACT. Null: random non-V x-lifts, same pair-try cap, FB-hit
    count recorded. NO break. NO n≥131 transfer. Distinct from
    IDEA-20261001-161102 (S_4), IDEA-20261002-5ebfcd (n−1), 3f2d06/5c936b
    (PDP engines), IDEA-20261002-9ff676 (orbit retention).

  mechanism: >-
    OBJECT FRAME as IDEA-20261002-df6215. Representation: FB {P : x(P)∈V}
    on Koblitz y^2+xy=x^3+1 / F_{2^n}. Operation A: Nagao disjoint-coset
    pair scan — G=<Frobenius,negation> acts diagonally on FB×FB; process
    a pair iff it is the lex-min of its G-orbit. Operation B: chained S_3
    — every unordered FB pair, R=-(P+Q) in FB. Observable: unique
    relations per charged second and their ratio R. Dual meters: schoolbook
    Field vs TableField (independent mul). Null: random-search pair tries
    off V. WHAT IS NEW: a frozen ρ rels/sec race of Nagao vs chained S_3
    with a real in-Python yield meter, not a missing-launcher detector.

  assumptions:
    - Frozen V (poly span), ℓ, ρ=1, B, N_rep, seeds, Nagao G-partition.
    - Charge rule identical on both arms (repeat scan until wall ≥ B).
    - R ≥ ρ ≠ practical binary IC (KR-IC-1fcdbc).

  predictions:
    - metric: nagao_over_chained_rels_per_sec_ratio
      direction: lower_bounded
      minimum_effect: '≥ ρ=1 at the Stage-1 cell under twin agreement'
    - metric: unique_relations_each_arm
      direction: recorded
      minimum_effect: 'both arms report unique-relation counts under same B'
    - metric: null_random_search_fb_hits
      direction: recorded
      minimum_effect: 'null FB-hit counts recorded for each N_rep seed'
    - metric: twin_field_agreement
      direction: same
      minimum_effect: 'schoolbook unique sets = table unique sets'

  test_boundary:
    instances:
      - >-
        Stage 0: freeze V rows n∈{17,19,23}×ℓ∈{3,4}, ρ, B, N_rep, Nagao
        partition, charge rule; twin mul + relation-set probe
      - 'Stage 1 authorized: (n,ℓ)=(17,3) race + null'
    parameters:
      rho_numer: 1
      rho_den: 1
      b_wall_seconds: 0.05
      n_rep: 3
      null_seeds: [2026100311, 2026100312, 2026100313]
      moduli_rows:
        - {n: 17, poly: 't^17+t^3+1'}
        - {n: 19, poly: 't^19+t^5+t^2+t+1'}
        - {n: 23, poly: 't^23+t^5+1'}
    implementation: >-
      Pure Python under experiments/EXP-BINSTD-c896e5/implementation/;
      command surface implementation/run.py driven by trial-plan-v1.json.
      Dual meters Field vs TableField in gf2.py; yield_meter.py shared
      algorithm. No Magma/Sage/AUXIN/Bedrock.
    budget:
      wall_clock_seconds: 7200
      memory_gb: 2
      maximum_runs: 4

  falsification_conditions:
    - Twin meters disagree on unique relation sets (O-ARTIFACT).
    - Editing ρ after seeing ratios.
    - Claiming practical binary IC or an exponent move from a toy R band.
    - Transferring the band to n≥131 without a new contract.
    - Equating this race with S_4 (161102) or n−1 (5ebfcd) decompositions.
    - Charging wall differently across arms.
    - Using Magma/Sage absence as the scientific outcome.

  distinguishable_outcomes:
    - id: O-SUPPORT
      meaning: >-
        Twins agree; at least one arm has unique relations; R ≥ 1 on the
        Stage-1 cell. Nagao rels/sec at least chained S_3 at this toy.
        No attack.
    - id: O-FAIL-BAND
      meaning: >-
        Twins agree; nonzero unique relations; R < 1. Recorded as
        chained-S3-still-faster at this scale.
    - id: O-INCONCLUSIVE
      meaning: Both arms unique-count 0 after budgeted B.
    - id: O-ARTIFACT
      meaning: Twin disagreement or freeze/regression failure.
    - id: O-IMPEDIMENT
      meaning: Timeout/crash/missing Stage-0 freeze. Never negative evidence.
    - id: O-STAGE0-OK
      meaning: Stage-0 freeze + twin probe passed; not a hypothesis verdict.

  interpretation_limits:
    - Yield-rate race only; does not claim LA rank or full IC solve.
    - Nagao partition is diagonal G=<Frob,neg> on FB×FB only.
    - Stage-2 remaining (n,ℓ) cells not authorized under this card.
    - No attack at field degree ≥ 131. ECC2K-130 is not an instance.

  heuristic_assumptions:
    - id: HEUR-BINSTD-df6215-H1
      formal_statement: >-
        FORALL the authorized Stage-1 cell (n,ℓ)=(17,3) with frozen V:
        (unique-rels/sec)_Nagao / (unique-rels/sec)_chainedS3 ≥ ρ with ρ=1
        frozen at Stage 0 across N_rep seeded nulls and matched wall B.
      random_model_justification: >-
        Rigorous: Nagao partitions pair search into disjoint G-cosets so
        each processed pair is unique under the partition, while chained
        S_3 re-visits orbit copies. Classical: if coset filtering removes
        wasted collisions faster than extra bookkeeping, Nagao wins on
        rels/sec; if unique yield drops faster than time, the band fails.
        The ρ=1 band is a pre-registered transfer hypothesis — not a claim
        that either source beats rho.
      supporting_results:
        - KR-IC-5a43e5
        - KR-IC-081a58
        - KR-IC-1fcdbc
        - IDEA-20261002-df6215
      validation_experiment_ids:
        - EXP-BINSTD-c896e5
      falsification_condition: >-
        R < 1 at the completed Stage-1 cell (O-FAIL-BAND), OR twin failure
        (O-ARTIFACT), OR zero unique relations on both arms (O-INCONCLUSIVE).

  structural_ingredients:
    - description: >-
        Binary Koblitz group law y^2+xy=x^3+1 and Frobenius
        (x,y)↦(x^2,y^2) with negation (x,y)↦(x,x+y).
      citation: ledger/proposals/IDEA-20261002-df6215.yaml
      provenance: internal
      verified_by: coordinator session 2026-10-03 (in-Python curve.py)
      role: arithmetic of both relation-source arms
    - description: >-
        KR-IC-5a43e5 Semaev summation framework as the nearest frontier
        row named by the idea (not a rels/sec race).
      citation: KR-IC-5a43e5
      provenance: internal
      verified_by: IDEA-20261002-df6215 prior_art block
      role: adjacent prior art; this H only adds the ρ yield race

  reduction_chain:
    core_problem: Nagao vs chained-S_3 unique-rels/sec ratio vs frozen ρ=1 on n=17 toys
    corollaries: []

  asymptotic_claim: null
  asymptotic_claim_note: >-
    No complexity improvement is claimed. Relation-source instrument only.

  proof_search_map:
    bottleneck: >-
      Whether Nagao disjoint-coset unique-relation yield per charged second
      stays ≥ chained S_3 on the n=17, ℓ=3 toy, as measured by two
      independent in-Python field/curve routes.
    baseline_embedding:
      parameter_slice: >-
        n=17, A=0, B=1, V=span{1,t,t^2}, first FB; schoolbook Field and
        TableField unique relation sets must agree before any ρ reading.
      reproduction_check: >-
        Independent check.py recomputes TableField unique counts on the
        Stage-0 probe and Stage-1 panels; refuses n-as-object-key JSON;
        refuses Magma-missing as a verdict.
    observation_collision:
      observable: the pair (unique_Nagao, unique_chained) and their rps ratio R
      distinct_preimage_search: >-
        Schoolbook vs table mul must give identical unique sets; a pair
        that is not G-canonical must be skipped by Nagao and kept by chained.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: G-canonical pairs under diagonal <Frob,neg>
        predicted_gain: >-
          A decidable O-SUPPORT/O-FAIL-BAND (or honest O-INCONCLUSIVE)
          without Magma and without an exponent claim.
    quantifier_order: >-
      FORALL Stage-1 cell (17,3): twins THEN nonzero unique THEN R ≥ 1
      predicted. NOT CLAIMED: remaining freeze cells under this card;
      n≥131; any attack; S_4 or n−1 races.
    method_ceiling:
      strongest_certifiable_claim: >-
        On the named n=17, ℓ=3 toy, either both arms yield 0
        (O-INCONCLUSIVE) or R vs 1 decides support/fail with twins.
      nearby_object_control: >-
        Random non-V pair tries (null); if they produced comparable FB
        hits, the FB restriction would be an artifact.
    proof_obligations:
      - claim: Twin Field/TableField unique sets agree on every measured scan.
        responsibility: baseline
      - claim: Nagao processes only G-canonical pairs.
        responsibility: feasibility
      - claim: Charge rule is the same on both arms.
        responsibility: runtime
      - claim: Nothing asserted at n≥131.
        responsibility: scope

  dominated_by: >-
    CHECKED KR-IC-5a43e5 / RQ-BINSTD's named Nagao alternative dominate as
    the existence of both sources; this record only adds a frozen ρ
    rels/sec race at matched wall budget. Not dominated by 161102/5ebfcd
    (different sources) or 9ff676 (retention, not source race).

  sota_delta:
    time: n/a — no attack
    memory: n/a
    data_queries: >-
      First pre-registered ρ=1 Nagao disjoint-coset vs chained S_3 unique
      rels/sec trial with in-Python dual field meters on RQ-BINSTD toys,
      separated from S_4, n−1, and unique-orbit retention.

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
