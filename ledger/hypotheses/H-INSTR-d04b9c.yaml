hypothesis:
  id: H-INSTR-d04b9c
  question_id: RQ-INSTR-f8faa0
  added: '2026-08-25'
  derived_from_idea: IDEA-20260807-34754f
  statement: >-
    THE CAMPAIGN'S CURRENT ISOGENY-CLASS NULL IS CONTAMINATED BY THE GROUP ORDER, AND THE FIX IS A DESIGN
    RATHER THAN A CORRECTION FACTOR. Four claims that can each fail independently.
    (S1) THE CONTAMINATION IS ARITHMETIC, NOT AN OPINION. At fixed p an isogeny class is indexed by its
    trace, so the group order is CONSTANT WITHIN a class and DIFFERENT BETWEEN classes. Any functional
    depending on the group order therefore has a between-class component that has nothing to do with isogeny
    structure. A FREE label permutation mixes group orders across the shuffled groups, inflating the null
    distribution of within-group variance by exactly that component, so the observed within-class variance
    sits below it and the test fires. The test is then detecting 'different classes have different group
    orders', which is the DEFINITION of an isogeny class, not a discovery about it.
    (S2) IT IS LIVE IN THE CAMPAIGN'S OWN COMMITTED RUN. For the full-field liftable density at the widest
    window, the committed run's archived identity makes the functional an affine function of the group order
    plus the 2-torsion count, so its within-class variance is exactly a quarter of the 2-torsion count's
    variance, while between classes the group order differs by a large multiple of that. THE REPORTED
    ORDERS-OF-MAGNITUDE VARIANCE REDUCTION IS THE GROUP ORDER. This is checkable on paper against the
    committed raw output, at zero compute, and if the arithmetic does not close the diagnosis is withdrawn.
    (S3) THE FIX. Three layers - make the primary functionals GROUP-ORDER-FREE by returning exact sum-set
    sizes instead of sampled rates; NEST the variance into class, j-invariant-within-class,
    model-within-j-invariant and within-model components, so the class level is interpretable only relative
    to the three beneath it; and STRATIFY the permutation, blocking on the group order and on the
    quadratic-twist pairing, with a p-value estimator that cannot return zero. PRE-REGISTERED - the
    stratified p-value for the full-field liftable density rises above 0.05 and the observed-to-null variance
    ratio moves to within a factor of 2 of 1.
    (S4) THE COUNTERINTUITIVE CONSEQUENCE, PRE-REGISTERED SO IT CANNOT BE CLAIMED AFTERWARDS. Removing the
    sampling noise by computing the decomposition rate exactly should make the FREE permutation MORE
    significant, not less, because the group-order confound is no longer masked by binomial noise - while the
    stratified p-value stays flat. That divergence is direct confirmation that the free permutation is
    measuring the group order.
    WHAT THIS DOES NOT CLAIM - it does not claim the lane's substantive result is wrong. It claims the
    currently reported signal is NOT YET ATTRIBUTABLE to isogeny structure, and it supplies the design under
    which the same measurement would become attributable.
  mechanism: >-
    A permutation null assumes EXCHANGEABILITY under the null hypothesis, and the current instrument's free
    permutation assumes it across groups that differ in a quantity fixed by the class definition itself. Two
    separate violations are visible in the committed run. First, the group order: within a class it is exactly
    constant and between classes it spans a range set by the Hasse interval, so a functional that depends on it
    at all has a between-class component by construction. Second, the twist pairing: the class at trace t and
    the class at minus t consist of the quadratic twists of one another and share the same discriminant, hence
    the same class number and the same class size, and several functionals are exactly twist-invariant - so
    their values are STRUCTURALLY DUPLICATED across paired groups and are not exchangeable. Blocking on both
    removes exactly those two violations while PRESERVING the group-size multiset automatically, which the
    obvious alternative - matching classes by the bit length of the group order - does not, since class size is
    the class number and varies by a factor of several across traces; and at fixed p a bit-length match is
    nearly vacuous, because almost every class shares a bit length while the actual nuisance, the spread in the
    group order itself, survives it untouched. The nested decomposition is what makes the class level
    interpretable at all: if the between-j-invariant-within-class component is not larger than the
    between-model-within-j-invariant component, the class explains nothing beyond the choice of Weierstrass
    equation.
  assumptions:
  - >-
    Tate - two curves over F_p are F_p-isogenous if and only if they have the same trace. Used to define the
    class; standard and not re-derived.
  - >-
    Within a class the group order is exactly constant, since it is p + 1 minus the trace. Elementary.
  - >-
    The class at trace t and the class at minus t consist of quadratic twists of one another and have equal
    size. The equal-size half is CONSISTENT WITH the committed run's own class sizes and follows from the class
    number depending on the trace only through the discriminant; it is stated here as a CHECKABLE PREDICTION
    the experiment must confirm, not as a quoted theorem.
  - >-
    The measured functionals have finite within-class variance and the curves within a block are exchangeable
    under the null. The second half is exactly what blocking is for and is itself tested by the synthetic
    null-object class.
  - >-
    Toy scale only - complete enumeration of every isomorphism class at p costs quadratic character-sum work, so
    the design is confined to small p. At those p the largest prime factor of the group order is around a dozen
    bits, so NO functional measured here is an attack cost at any scale that matters. This is a measurement
    about structure, not about cost.
  - >-
    The class-selection rule takes the largest ordinary classes, and class size is the class number, which
    correlates with the arithmetic of the discriminant and hence with the 2-torsion structure driving several
    functionals. That is NOT selection on the outcome, but it is NOT neutral either, and the record must say so
    rather than let it pass.
  proof_search_map:
    bottleneck: >-
      The EXCHANGEABILITY argument. Everything else is bookkeeping; the null's validity rests entirely on the
      claim that, under the null hypothesis, curves within a block are exchangeable with respect to the measured
      functional.
    baseline_embedding:
      parameter_slice: >-
        Exactly the parameters of the campaign's committed run - the same prime, the same four traces, the same
        factor-base sizes, the same window, the same target count and the same seed.
      reproduction_check: >-
        Re-run the FREE permutation on that slice and reproduce the committed permutation p-values and every cell
        of the committed window-decay block exactly. If the committed numbers do not reproduce, the instrument
        question is an ARTIFACT question and this hypothesis halts until the discrepancy is recorded.
    observation_collision:
      observable: 'The stratified permutation p-value.'
      distinct_preimage_search: >-
        REQUIRED. Find two pooled sets with the SAME stratified p-value, one where the grouping is the true
        isogeny class and one where it is the synthetic null-object class. A collision is EXPECTED and is the
        CALIBRATION - it fixes the p-value's resolution at the campaign's sample sizes and is what makes a
        non-significant result reportable as a BOUND rather than as 'no effect'.
    constructive_transforms:
    - transform: observable_fiber
      proposed_object: >-
        The variance component attributable to the isogeny class, as one non-negative number per functional in a
        four-level nested decomposition over class, j-invariant, Weierstrass model and factor-base offset.
      predicted_gain: >-
        No attack gain and none claimed. The gain is that the class-level number becomes INTERPRETABLE, because it
        is read against the three levels beneath it rather than against a free permutation that mixes group
        orders. Quantitatively it converts one uncontrolled p-value into a pair (free, stratified) whose GAP is
        itself the measure of contamination.
    quantifier_order: >-
      INTENDED - FOR ALL declared functionals, FOR ALL pooled sets of complete isogeny classes at a fixed p,
      THERE EXISTS a blocking such that the permutation distribution of the within-group variance statistic under
      that blocking is a VALID null for 'class membership is independent of the functional given the block'. THE
      DANGEROUS WEAKER READING, NOT CLAIMED - FOR ALL functionals THERE EXISTS a pooled set, which would let the
      pool be chosen after seeing the functional. The pool freeze exists to forbid exactly that.
    method_ceiling:
      strongest_certifiable_claim: >-
        'At this p, on these completely enumerated classes, with these functionals, class membership explains no
        variance beyond the block structure, down to an effect of the stated minimum detectable size.' It can NEVER
        certify exact invariance, and it can never certify anything at a p it did not enumerate.
      nearby_object_control: >-
        THE SYNTHETIC NULL-OBJECT CLASS - a set of curves at the same p that is NOT an isogeny class but has the
        same size profile and the same group-order spread, built by relabelling with synthetic classes drawn to
        match the true class-size multiset while forcing the synthetic grouping to be INDEPENDENT OF THE TRACE. A
        design that cannot distinguish the true class from it has not identified the load-bearing structure and is
        measuring the size profile.
    proof_obligations:
    - claim: 'Within a class the group order is exactly constant.'
      responsibility: correctness
    - claim: 'The class at trace t and the class at minus t have equal size and are twist-paired.'
      responsibility: correctness
    - claim: 'The blocked permutation preserves the group-size multiset.'
      responsibility: soundness
    - claim: 'The (1 + r)/(1 + B) estimator is a valid p-value and cannot return zero.'
      responsibility: soundness
    - claim: >-
        The committed free-permutation result at the widest window is explained by the group-order difference plus
        the archived liftable-count identity.
      responsibility: baseline
    - claim: 'Every reported conclusion is scoped to this p, these classes and these functionals.'
      responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    NULL AND REQUIRED TO BE. NO ATTACK EXPONENT IS CLAIMED OR MOVED. The instrument's own cost is quadratic in p
    for a complete enumeration, multiplied by the nested design's model and offset counts, plus a permutation
    sweep that is negligible beside the measurement. That quadratic enumeration is the HIDDEN COST and it is why
    the design lives at small p - at those sizes every 'attack-cost functional' is degenerate as an attack cost,
    which bounds what this whole lane can ever say from complete enumeration.
  heuristic_assumptions: []
  heuristic_assumptions_note: >-
    NONE NUMBERED. The permutation null is EXACT in finite samples and requires no distributional assumption,
    which is one of the reasons it is preferred here over a binomial null. The only modelling content is the
    exchangeability assumption, which is not a heuristic but the null hypothesis itself, and it is tested directly
    by the synthetic null-object class.
  structural_ingredients:
  - description: >-
      The committed run and its archived identity expressing the full-field liftable count as an affine function
      of the group order and the 2-torsion x-count, verified on every row of that run.
    citation: 'The campaign''s committed instrument run and its frozen experiment contract.'
    provenance: internal
    verified_by: 'EXP-ICINV-180a0d and its committed run record'
    role: >-
      supplies the arithmetic that identifies the reported variance reduction as the group order, checkable on
      paper at zero compute
  - description: >-
      The campaign's existing permutation null and its two siblings, as implemented in the harness, including the
      module docstring's own warning that the between-class-at-matched-bit-length null controls for p but NOT for
      the group order.
    citation: 'harness/exp_icinv.py and harness/run_icinv.py.'
    provenance: internal
    verified_by: harness/exp_icinv.py
    role: >-
      the incumbent instrument; this hypothesis's point is that the SAME criticism the docstring makes of one null
      applies verbatim to the one actually used as the class test, which the docstring does not say
  - description: >-
      Stratified permutation testing and nested variance components.
    citation: Textbook statistics; no novelty is claimed against the external literature.
    provenance: recalled
    verified_by: null
    role: the fix; the adaptation is the blocking structure, not the permutation
  predictions:
  - metric: >-
      stratified-permutation p-value for the full-field liftable density on the committed pool, computed with the
      (1 + r)/(1 + B) estimator, against the committed free-permutation value
    direction: higher
    minimum_effect: >-
      The stratified p-value rises above 0.05. PRE-REGISTERED - if it stays below 0.05 after blocking on the twist
      pair AND on the group order, the signal is NOT the group order and the campaign has a real target, which
      would be the MORE interesting outcome and is why this is worth running.
  - metric: >-
      ratio of observed to null within-group variance for the full-field liftable density, free permutation versus
      stratified permutation
    direction: higher
    minimum_effect: >-
      From the committed orders-of-magnitude reduction to within a factor of 2 of 1 under stratification. A residual
      reduction of more than a factor of 4 after FULL blocking would be a genuine class effect at this p.
  - metric: >-
      the between-j-invariant-within-class variance component divided by the between-model-within-j-invariant
      component, per functional
    direction: different
    minimum_effect: >-
      Reported per functional. Below 2 means the isogeny class explains NOTHING beyond the choice of Weierstrass
      equation, and the lane's headline must say so.
  - metric: >-
      free-permutation p-value for the EXACT decomposition count, with target sampling removed, versus for the
      sampled rate
    direction: lower
    minimum_effect: >-
      THE COUNTERINTUITIVE ONE, PRE-REGISTERED SO IT CANNOT BE CLAIMED AFTERWARDS - removing sampling noise should
      make the free permutation MORE significant, not less, because the group-order confound is no longer masked by
      binomial noise. A drop of the free p-value toward zero on the exact count WHILE the stratified p-value stays
      flat is direct confirmation that the free permutation is measuring the group order.
  - metric: 'stratified-permutation p-value on the synthetic null-object class'
    direction: higher
    minimum_effect: >-
      Above the declared level. If the synthetic class FIRES under stratification, the blocking is wrong and no
      result may be reported from it.
  - metric: 'measured decay of any residual signal as blocking is refined from one block to twist pairs to narrow group-order bands'
    direction: higher
    minimum_effect: >-
      Monotone decay toward the unblocked-nuisance level. A signal that does NOT decay as blocking is refined is the
      canonical artifact tell and means the nuisance is something OTHER than the group order and has not yet been
      named.
  test_boundary:
    instances:
    - >-
      The campaign's committed pool, at exactly its committed parameters, as the reproduction slice.
    - >-
      Complete isogeny classes at small p enumerable by a quadratic character-sum sweep, with the trace list
      PRE-REGISTERED and with a size-randomly-selected pool as a secondary arm to expose the selection confound.
    - >-
      The synthetic null-object class - matched class-size multiset, grouping forced independent of the trace.
    parameters:
      blocking_levels: 'one block (the free permutation, retained as the contamination diagnostic) / one block per twist pair / one block per narrow group-order band'
      band_width: 'below the measured within-class standard deviation of the functional'
      nested_design: 'declared numbers of Weierstrass models and factor-base offsets per curve'
      permutation_count: 'large enough that the (1 + r)/(1 + B) estimator resolves below the declared level'
      statistic: 'size-weighted mean within-group variance, weighting chosen to remove the unequal-group-size bias the unweighted statistic carries'
    implementation: >-
      Complete class enumeration by a vectorised quadratic-character table; exact sum-set computation for the
      decomposition counts, which removes the sampling step entirely; nested Type-I sums of squares for the four
      variance components; stratified label permutation within blocks with the (1 + r)/(1 + B) estimator. Recorded
      through harness/runner.py.
    budget:
      wall_clock_seconds_per_run: 5400
      total_cpu_hours: 8.0
      maximum_memory_gb: 8
      maximum_runs: 12
  distinguishable_outcomes:
  - >-
    O1 (THE SIGNAL IS THE GROUP ORDER - PREDICTED). The paper arithmetic closes; the free permutation reproduces
    the committed p-values on the frozen slice; the stratified p-value for the full-field liftable density rises
    above 0.05; the observed-to-null ratio moves to within a factor of 2 of 1; the synthetic null-object class does
    NOT fire; and any residual signal decays monotonically as blocking is refined. MEANING - the currently reported
    class signal is the group order, the stratified design becomes the campaign's class null, and the honest
    headline is the PAIR of p-values, not either number alone.
  - >-
    O2 (A REAL WITHIN-CLASS EFFECT - THE MORE INTERESTING OUTCOME). The stratified permutation STILL fires at the
    declared level after full blocking on the twist pair and on the group order, with the synthetic null-object
    class not firing. MEANING - this hypothesis's central claim is FALSE and the campaign has a genuine
    within-class effect to chase. That is a real falsifier with a real probability and it is the reason to run the
    test.
  - >-
    O3 (DIAGNOSIS WITHDRAWN). The paper arithmetic fails - the reported within-class variance is not the predicted
    function of the 2-torsion count's variance. MEANING - either the archived identity is false or the reporting is
    mis-wired; the diagnosis of the reported variance reduction is WITHDRAWN and the discrepancy itself is the
    deliverable.
  - >-
    O4 (INSTRUMENT UNSTABLE). The free permutation does not reproduce the committed p-values on the frozen slice.
    MEANING - instrument instability; nothing is concluded about nulls or classes until the discrepancy is
    recorded.
  - >-
    O5 (BLOCKING WRONG). The synthetic null-object class FIRES under the stratified permutation. MEANING - the
    blocking is wrong, it is manufacturing significance from the size profile, and no result may be reported from
    it.
  - >-
    O6 (TWIST PAIRING FAILS ELSEWHERE). The class at trace t and the class at minus t do not have equal size at
    other primes. MEANING - the twist-pair blocking loses its justification and must be replaced by explicit
    discriminant matching. This is a checkable prediction of the design, not an assumption it hides.
  - >-
    O7 (CLASS EXPLAINS NOTHING BEYOND THE MODEL). The between-j-invariant-within-class component is not larger than
    the between-model-within-j-invariant component. MEANING - the isogeny class explains nothing beyond the choice
    of Weierstrass equation for that functional, and the lane's headline must say so.
  - >-
    O8 (NUISANCE UNNAMED). A residual signal survives the finest blocking AND fails to decay as blocking is
    refined. MEANING - the nuisance is something other than the group order and has not yet been named; this is
    NOT a class effect and must not be reported as one.
  falsification_conditions:
  - >-
    The paper arithmetic fails - the reported within-class variance is not the predicted function of the 2-torsion
    count's variance. The diagnosis is withdrawn.
  - >-
    The free permutation does not reproduce the committed p-values on the frozen slice - instrument instability;
    nothing is concluded.
  - >-
    The synthetic null-object class fires under the stratified permutation - the blocking is wrong and no result may
    be reported from it.
  - >-
    The class at trace t and the class at minus t do not have equal size at other primes - the twist-pair blocking
    loses its justification.
  - >-
    THE STRATIFIED PERMUTATION STILL FIRES on the true classes at the declared level after full blocking - S1 and
    S3's central claim is FALSE and the campaign has a genuine within-class effect. This is the falsifier with a
    real probability and it is the reason to run the test.
  - >-
    A residual signal fails to decay as blocking is refined - the nuisance is unnamed and no class conclusion
    follows.
  interpretation_limits:
  - >-
    TOY TIER. At the enumerable primes the largest prime factor of the group order is around a dozen bits. Nothing
    here is an attack cost and nothing extends to larger scale.
  - >-
    A non-significant stratified permutation is a BOUND, not 'no effect', and the bound's size comes from a
    separate minimum-detectable-effect record. Reporting it without that number is an OVERCLAIM.
  - >-
    This governs the CLASS-LEVEL NULL only. It says nothing about whether the functionals measured are
    attack-relevant, which is a different lane's question.
  - >-
    The p-value estimator that returns exactly zero is not a valid p-value at any permutation count, and any
    multiplicity correction across lanes needs a finer resolution than this design provides.
  - >-
    Selection on class size is not selection on the outcome, but it is not neutral. The trace list is
    pre-registered and a size-randomly-selected pool is reported as a secondary arm precisely so the reader can see
    the difference.
  - >-
    Nothing here bears on any structural hypothesis in either direction; no displacement rank, relation matrix or
    invariant factor base is measured.
