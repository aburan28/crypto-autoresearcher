    - docs/inventor-protocol.md
    - templates/research-records.md

  authoring_note: >-
    Written under TASK-20260904-c0edda (DESIGN ONLY) from IDEA-20260815-90f638,
    designed as a VERIFICATION PROTOCOL per the handoff s audit constraint.
    KN-OPEN-5b3a08 was read in full before its characterisation was adopted, and
    the source idea s phrase "whole-curve factor-base sampling error" is
    corrected against that record s own text and flagged as a paraphrase. The
    swept reintroduction (P2) and the curve-free import-graph fixture (P3) are
    added to the source idea s two nulls.
