hypothesis:
  id: H-ECDLP-8f9cce
  question_id: RQ-ECDLP-002

  statement: >-
    SCOPE: a VERIFICATION PROTOCOL over this program s own committed artifacts,
    not a mathematical experiment. CLAIM TIER not applicable - no ECDLP claim of
    any kind is made or can be derived. NO STATUS CHANGE TO ANY RECORD.
    KN-OPEN-5b3a08 records two properties of shared harness/semaev.py as
    CONFIRMED - a variable-collision defect in s4_expr, where a non-simultaneous
    substitution collapses an intended free variable into a dummy so that the
    fourth summation polynomial evaluated at a genuine witness is nonzero when it
    must be exactly zero; and that build_factor_base draws x-coordinates from the
    full curve rather than from the target s order-n subgroup. What is OPEN is
    the blast radius. The claim under test is that the exposure is real and
    determinable - specifically, that at least one of the archived runs on the
    exposure path is traceable at PATH level and that its recorded parameters
    exercise the defective code path in a way that changes its output.
    The complementary outcome - the defect is latent at the archived parameters,
    or the archived manifests cannot resolve path-level dependence at all - is
    equally reportable, and the second of those is a serious reproducibility
    finding about this program rather than a null.

  mechanism: >-
    Three stages, each of which can end the protocol with a reported result.
    STAGE A, TRACE. Identify the exact broken code paths in harness/semaev.py and
    enumerate every committed run whose manifest records an invocation reaching
    them, at PATH level rather than file level - a record may import the module
    and never reach s4_expr, and a file-level verdict cannot tell those apart.
    Every record is placed in exactly one of four classes -
    affected-and-conclusion-changing, affected-but-conclusion-robust, unaffected,
    or UNTRACEABLE. Untraceable is never folded into unaffected; that conflation
    is the single error that would make this audit falsely reassuring.
    STAGE B, INSTRUMENT VALIDATION. The tracer and the witness checker are both
    instruments and are calibrated before either is believed.
    STAGE C, RE-RUN. Re-run only the cheapest record classified
    affected-and-conclusion-changing, at its own archived parameters, under a
    corrected s4_expr, and report whether its numbers move.
    ON Q2 A PARAPHRASE IS CORRECTED RATHER THAN INHERITED. IDEA-20260815-90f638
    calls build_factor_base s behaviour a "whole-curve factor-base sampling
    error". KN-OPEN-5b3a08 says the opposite of the word error, verbatim - "It is
    not obviously wrong - sampling the whole curve is the historically standard
    construction in the point-decomposition index-calculus literature - but its
    statistical interaction with cofactor size is, at minimum, under-examined".
    Q2 is therefore scoped in this record as a CONFOUND CHECK on comparisons
    across curves with different cofactors, NOT as an audit of an error. That
    re-scoping is a reading correction and is flagged as such.

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Null deliberately. This record proposes no algorithm and produces no
    mathematical result of any kind. Its cost is manifest tracing plus one re-run
    of the cheapest affected case.

  rerandomization: null

  proof_search_map:
    not_applicable_reason: >-
      A verification protocol over committed artifacts, not a proof-oriented
      proposal. No theorem, reduction, certificate family or asymptotic is
      asserted. Recorded as non-applicable rather than omitted, per
      docs/inventor-protocol.md section 8.

  assumptions:
    - >-
      Archived run manifests retain enough version and invocation detail to
      determine PATH-level dependence. Where they do not, the record is reported
      UNTRACEABLE and is never defaulted to unaffected.
    - >-
      The defect s effect on output at a given set of parameters is determinable
      by an exact-witness check - evaluating the fourth summation polynomial at a
      genuine witness where the correct value is exactly zero. This is tested
      directly by the deliberate-reintroduction control rather than assumed.
    - >-
      A conclusion that changes on re-run is handled by a SUPERSEDING correction
      record, never by editing the archived run (AGENTS.md core rule 4). This
      record creates no such correction and has no authority to.

  heuristic_assumptions:
    - id: HEUR-TRACE-1
      formal_statement: >-
        The fraction of exposed archived runs that are traceable at path level
        does not depend on the defect, only on the manifest schema in force when
        the run was archived, and therefore degrades monotonically with record
        age.
      random_model_justification: >-
        NO DISTRIBUTIONAL HEURISTIC IS LOAD-BEARING and the field is filled
        honestly rather than padded. The rigorous ingredient is that the
        run-record schema requires a manifest with the resolved environment and
        invocation (AGENTS.md, Artifact policy). THE GAP - that schema s
        retention has varied over this program s history and older records
        predate parts of it, so traceability is expected to fail exactly in the
        region where the exposed Semaev work concentrates.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-7872de]
      falsification_condition: >-
        Traceability that does NOT decline with record age, which would mean the
        untraceable set is being produced by something other than schema drift
        and the tracer must be re-examined before its verdicts are used.

  structural_ingredients:
    - description: >-
        The confirmed s4_expr variable-collision defect, its reproduction by
        brute-force reference check, and the recorded exposure - 11 committed run
        directories under experiments/EXP-MTIC-001/runs/ and 10 under
        experiments/EXP-FIB-001/runs/, 21 archived runs in total, with s4_expr on
        the critical result path in both.
      citation: knowledge/open-problems/KN-OPEN-5b3a08.md
      provenance: internal
      verified_by: >-
        coordinator subagent under TASK-20260904-c0edda, 2026-09-04, read
        knowledge/open-problems/KN-OPEN-5b3a08.md in full (198 lines). The
        s4_expr source excerpt, the exposure counts and the "not obviously wrong"
        sentence about build_factor_base are quoted from that file. THE UNDERLYING
        RUN DIRECTORIES AND harness/semaev.py ITSELF WERE NOT OPENED BY THIS
        AGENT, so the run counts are relied on as that record states them and
        must be re-confirmed by direct listing at Stage A.
      role: the defect definition and the declared exposure set
    - description: >-
        The whole-curve factor-base sampling behaviour and its recorded status as
        under-examined rather than erroneous.
      citation: knowledge/open-problems/KN-OPEN-5b3a08.md
      provenance: internal
      verified_by: >-
        coordinator subagent under TASK-20260904-c0edda, 2026-09-04, same read.
        The record s own sentence declining to call it wrong is quoted verbatim
        in this hypothesis s mechanism.
      role: scopes Q2 as a confound check rather than an error audit
    - description: >-
        The RQ s standing requirement that every claimed solve or relation
        carries an independently reverified certificate, and that infrastructure
        failures are not mathematical evidence.
      citation: ledger/questions/RQ-ECDLP-002.yaml
      provenance: internal
      verified_by: >-
        coordinator subagent under TASK-20260904-c0edda, 2026-09-04, read
        ledger/questions/RQ-ECDLP-002.yaml in full (41 lines).
      role: the constraint set the re-run arm must satisfy

  predictions:
    - metric: >-
        P1 - NO-SEMAEV NULL - a committed record confirmed by direct file read
        not to reach harness.semaev at all, passed through the tracer
      direction: different
      minimum_effect: >-
        FORCED to classify as unaffected. If it classifies as affected the tracer
        is wrong and no classification from it is admissible. The record used
        must be selected by direct file read at Stage A and named in the run
        report; this contract deliberately names no specific ID, because this
        agent has not opened any candidate.
    - metric: >-
        P2 - DELIBERATE REINTRODUCTION, SWEPT - the corrected s4_expr with the
        defect reintroduced at k of N tested witnesses, k swept over
        {0, 1, 4, 16, N}
      direction: higher
      minimum_effect: >-
        The exact-witness checker must report EXACTLY k nonzero residuals at
        every sweep point, including exactly 0 at k = 0 and exactly N at k = N.
        This is the dynamic-range demonstration - a checker that fires once on a
        fully broken build has not shown it can measure the SIZE of a defect, and
        without that its report of a small defect means nothing.
    - metric: >-
        P3 - TRACER STRUCTURE NULL, CURVE-FREE - a synthetic fixture repository
        containing no elliptic-curve code at all but reproducing the exposure
        set s import-graph shape, passed through the identical tracer
      direction: different
      minimum_effect: >-
        The tracer must classify the fixture purely from its import and call
        graph, reproducing the same class assignments the graph implies. IF THE
        TRACER S VERDICTS DIFFER BETWEEN THE FIXTURE AND THE REAL REPOSITORY AT
        MATCHED GRAPH SHAPE, it is reading something other than the call graph
        and its verdicts are not attributable. CONSEQUENCE PRE-DECLARED - the
        tracer output is a statement about an import graph, and nothing derived
        from it may be quoted as a statement about elliptic curves or the ECDLP.
    - metric: >-
        P4 - per-record classification counts across the exposure set, in the
        four exclusive classes (integer counts)
      direction: different
      minimum_effect: >-
        The deliverable. Every archived run in the exposure set falls in exactly
        one class and the four counts sum to the enumerated total. A run in no
        class, or in two, is a tracer defect.
    - metric: >-
        P5 - count of UNTRACEABLE records, broken out by archive date
      direction: higher
      minimum_effect: >-
        Reported explicitly and never folded into unaffected. If it exceeds half
        the exposure set, the finding is that this program cannot determine its
        own exposure, which is a serious reproducibility result and is the
        headline in that case.
    - metric: >-
        P6 - exact-witness residual of the cheapest affected record, re-run at
        its own archived parameters under the corrected s4_expr, reported as the
        number of nonzero residuals out of N witnesses and as the change in the
        record s own headline number
      direction: different
      minimum_effect: >-
        No direction pre-committed. A change means the archived conclusion must
        be superseded by correction elsewhere; no change means the defect was
        latent at those parameters, which materially shrinks the blast radius and
        is good news that must be stated rather than assumed in either direction.

  test_boundary:
    instances: >-
      Every committed run record in this repository whose manifest records an
      invocation that could reach harness.semaev.s4_expr or
      harness.semaev.build_factor_base; a curve-free synthetic import-graph
      fixture; one re-run of the cheapest affected record at its archived
      parameters.
    parameters:
      exposure_set_enumeration: by direct directory listing at Stage A, not from any frozen specification
      classification_classes: [affected_conclusion_changing, affected_conclusion_robust, unaffected, untraceable]
      witness_sweep: [0, 1, 4, 16, N]
      witnesses_per_check: at least 200
    implementation: >-
      A path-level tracer over committed manifests, an exact-witness checker for
      the fourth summation polynomial, and a one-line corrected s4_expr used only
      in the re-run arm. The shared harness file is NOT edited by this
      experiment.
    budget:
      wall_clock_seconds_per_run: 3600
      maximum_memory_gb: 8
      maximum_runs: 40

  falsification_conditions:
    - >-
      F1 - the no-Semaev null traces as affected. The tracing method is wrong and
      no classification is admissible.
    - >-
      F2 - the reintroduction sweep does not return exactly k nonzero residuals
      at every k. The checker has no demonstrated dynamic range; it cannot
      support a finding that a defect is latent, and no negative may be reported.
    - >-
      F3 - the curve-free import-graph fixture is classified differently from the
      real repository at matched graph shape. The tracer is not attributable and
      its output may not be quoted as a statement about anything.
    - >-
      F4 - many records are untraceable. This program cannot determine its own
      exposure. A reproducibility finding, reported as the primary result.
    - >-
      F5 - the reintroduced defect changes nothing at the archived parameters.
      The blast radius is smaller than feared, stated as a measured result.
    - >-
      F6 - a committed conclusion changes on re-run. It must be superseded by a
      correction record under a new ID, never edited (AGENTS.md core rule 4).
      This experiment creates no such record and has no authority to.

  interpretation_limits:
    - >-
      Maps the consequences of a known defect. PRODUCES NO MATHEMATICAL RESULT,
      no cost model, no exponent and no ECDLP claim of any kind.
    - >-
      Scoped to the two recorded properties of harness/semaev.py and to the
      traceable subset of committed records. An untraceable record is reported as
      untraceable and nothing about it is asserted.
    - >-
      Q2 IS A CONFOUND CHECK, NOT AN ERROR AUDIT. Whole-curve factor-base
      sampling is recorded in KN-OPEN-5b3a08 as the historically standard
      construction; this record checks its statistical interaction with cofactor
      size in comparisons across curves and asserts nothing about correctness.
    - >-
      NOT TESTABLE AT REACHABLE SCALE, STATED PLAINLY. Whether either property
      would matter at cryptographic parameters cannot be determined here, because
      the exposed runs are all toy-scale and no larger instance is reachable. The
      audit bounds the exposure of what was actually run and nothing beyond it.
    - >-
      Changes no record s status. Any correction, supersession or status
      transition arising from a changed conclusion is a Coordinator decision made
      elsewhere on committed evidence.

  status: proposed
  proposed_by: coordinator

  source_refs:
