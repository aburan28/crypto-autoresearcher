  statement: >-
    A window of width 18 stores 131072 entries. A window of width 17
    stores 65536. Two to the power 17 is 131072. Two to the power 16
    is 65536. One hundred thirty-one thousand seventy-two exceeds
    sixty-five thousand five hundred thirty-six by 65536. The product
    of the two table sizes is 8589934592. Their sum is 196608. Two
    width-17 tables each store 65536, so that gap is 0 and their
    product is 4294967296.
  mechanism: >-
    The proposal writes the widths 18 and 17 and the sizes 131072 and
    65536. This contract checks those integers. It does not add a
    curve point.
