hypothesis:
  id: H-DREG-1d0e5d
  question_id: RQ-DREG-d7b6d6
  proposal_id: IDEA-20260922-9d808c
  added: '2026-09-22'
  title: >-
    One F_4 Vélu edge does not move the degree-filtration rank profile of the
    chained t=4 ideal beyond what a linear change of boolean coordinates can do
  statement: >-
    On the single certified ordinary degree-2 edge frozen in
    EXP-DREG-dd668d, the full-column boolean Macaulay rank profiles r(d) for
    d <= 4 of the two native chained t=4 ideals agree, whenever the eight
    frozen GL(N, F_2) samples leave the base profile unchanged and neither
    ideal is the unit ideal. A difference of at least 1 with that check
    passed is a filtration gap and falsifies agreement. A grevlex solving-degree
    gap with equal rank profiles is an order artifact, not a filtration gap.
    No ECDLP exponent is claimed. This does not rerun the prime-field m=3
    neighbor screen closed by DEC-20260716-003.
  mechanism: >-
    The representation is the boolean Weil restriction of the chained S_3
    system (R3 of RQ-ECDLP-623a32). The operation set for the invariance
    check is invertible linear substitutions of those boolean coordinates,
    not translation on the elliptic curve. The degree-filtration dimension
    dim(I intersect P_<=d) is unchanged by a filtered linear automorphism
    when the matrix really computes that dimension. CORR-20260808-f4d780
    records that a homogeneous graded Macaulay rank is frame-invariant, so
    a homogeneous matrix would make the GL check a no-op. This system is the
    affine boolean quotient by x_i^2+x_i, which is inhomogeneous, so the
    eight samples are informative. The Vélu codomain contributes a second
    native ideal rebuilt from its own equation. Characteristic 2 uses the
    ordinary model y^2 + xy = x^3 + a2 x^2 + a6. Degree 2 is the unique
    rational kernel <(0, s)> with s^2 = a6, certified on every F_4-point,
    not an unchecked odd-characteristic Vélu formula.
  assumptions:
    - The ladder, seeds, degree bound, and certificates are those frozen in EXP-DREG-dd668d.
    - Rank is exact full-column rank over F_2. Subset-column coranks are not evidence.
    - An unfinished matrix is unmeasured, not a large degree.
  proof_search_map:
    bottleneck: >-
      Whether the two native ideals differ in r(d), which sampled linear
      substitutions do not move, or only in the grevlex staircase.
    baseline_embedding:
      parameter_slice: >-
        Eight frozen invertible linear substitutions of the base ideal alone,
        before the codomain profile is compared.
      reproduction_check: >-
        All eight samples reproduce r(d) of the base. Any mismatch stops the
        isogeny reading. EXP-DREG-c92f56 is the adjacent unexecuted linear-frame
        battery on a different boolean cell and is not a substitute for this check.
    observation_collision:
      observable: The rank vector (r(d)) for d <= 4.
      distinct_preimage_search: >-
        The eight GL images must share the base vector. Log generator hashes
        so equal vectors are not treated as one ideal.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: degree-filtration rank profile
        predicted_gain: >-
          Separates an order artifact from a filtration gap. No exponent gain.
    quantifier_order: >-
      FOR ALL eight frozen L in the GL sample, r(L(I_base)) = r(I_base). IF
      that holds, THEN max_d |r(I_E)(d) - r(I_E')(d)| = 0 on this edge. The
      universal quantifier is the sample of eight, not all of GL.
    method_ceiling:
      strongest_certifiable_claim: >-
        One toy edge at rung n=1 either agrees, differs by at least 1 with
        the GL check passed, or the check failed. Not an algorithm.
      nearby_object_control: >-
        One frozen degree-2 substitution of the base variables. It is allowed
        to move r(d). If a GL sample moves r(d), the instrument is wrong.
    proof_obligations:
      - claim: Eight GL samples leave r unchanged before the edge is read.
        responsibility: baseline
      - claim: r(d) is full-column Macaulay rank, not a grevlex basis degree.
        responsibility: correctness
      - claim: A gap means a difference of at least 1 in some r(d).
        responsibility: strictness
      - claim: One edge at n=1. Not a class slope.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: max over d <= 4 of |r_E(d) - r_E'(d)|
      direction: lower
      minimum_effect: '0, with the GL check passed and neither ideal a unit ideal'
    - metric: absolute difference of grevlex solving degrees when the rank difference is 0
      direction: different
      minimum_effect: >-
        A grevlex gap of at least 1 with rank difference 0 is an order artifact.
        Both zero is agreement of both observables.
  test_boundary:
    instances:
      - one certified ordinary F_4-isogeny edge of degree 2
      - eight linear images of the base ideal
      - one degree-2 substitution of the base ideal
    parameters:
      field: F_4
      model: ordinary char-2 short model
      t: 4
      k: 1
      rung_n: 1
      D_max: 4
    implementation: experiments/EXP-DREG-dd668d/specification.yaml
    budget:
      maximum_runs: 1
      maximum_memory_gb: 4
  falsification_conditions:
    - >-
      The GL check passes, both profiles finish, neither ideal is the unit
      ideal, and max_d |r_E(d) - r_E'(d)| >= 1.
    - >-
      delta = 1 and the rank profiles differ. The invariance check contradicts
      itself. Instrument failure, not a filtration gap.
  interpretation_limits:
    - One toy edge. No class slope. No cryptographic curve. No ECDLP exponent.
    - A timeout is unmeasured. It does not mean the degree exploded.
    - Rho remains about p^{1/2} group operations. The walk is not charged because no attack is claimed.
    - Does not identify first-fall, last-fall, grevlex solving degree, and degree of regularity.
  heuristic_assumptions:
    - id: HEUR-1d0e5d
      formal_statement: >-
        The comparison is finite. Eight matrices and one edge. No distribution
        and no extrapolation to other edges or to larger n.
      random_model_justification: >-
        No random model. Rank of a finite matrix over F_2 is an integer.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        Any of the eight GL samples changes r(d). The comparison is then not
        interpreted.
  asymptotic_claim: null
  citations:
    - ref: IDEA-20260922-9d808c
      provenance: internal
      claim: The proposal this hypothesis specifies.
      verified_by: coordinator
    - ref: CORR-20260808-f4d780
      provenance: internal
      claim: >-
        Graded Macaulay rank is frame-invariant for homogeneous systems, so a
        homogeneous profile makes a linear-frame battery a no-op.
      verified_by: coordinator
    - ref: DEC-20260716-003
      provenance: internal
      claim: The prime-field m=3 neighbor screen is rejected_scoped and is not this test.
      verified_by: coordinator
    - ref: RQ-DREG-d7b6d6
      provenance: internal
      claim: The parent question. Unfinished Gröbner runs are unmeasured cells.
      verified_by: coordinator
  status: approved
  proposed_by: coordinator
