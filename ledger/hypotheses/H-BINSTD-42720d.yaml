# Approval: DEC-20261001-e53d22. The claim is not asserted.
hypothesis:
  id: H-BINSTD-42720d
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-7ab503
  experiment_id: EXP-BINSTD-d7cb2c
  specified_at: '2026-10-01'
  status: approved
  proposed_by: idea-generator
  approved_by_decision: DEC-20261001-e53d22
  title: >-
    The absolute Frobenius is a cyclic coordinate shift in a normal basis, and
    the Galois stabilizer of (a, b) on twelve named binary curves has the
    preregistered order mu.
  statement: >-
    Let mu(E) be the number of j mod m such that a^{2^j} = a and b^{2^j} = b
    in F_{2^m}. On sect163k1, sect233k1, sect283k1, sect409k1, sect571k1, and
    sect239k1 the published coefficients lie in {0, 1} and mu = m. On
    c2pnb176v1, c2pnb208w1, c2pnb272w1, c2pnb304w1, and c2pnb368w1 both
    coefficients lie in F_{2^16} and the preregistered mu equals k = m/16.
    On sect163r2, mu = 1. Separately, in a normal basis of F_{2^13}, squaring
    is the cyclic shift of coordinates, and on the toy curve
    y^2 + xy = x^3 + x^2 + 1 over that field the map x |-> x^2 is a group
    endomorphism on the sampled point pairs.
  mechanism: >-
    In a normal basis, the absolute Frobenius is a coordinate permutation
    because it is a field automorphism and the basis is an orbit. It preserves
    the curve equation exactly when it fixes a and b. The stabilizer order is
    then m divided by the degree of F_2(a, b). This contract tests that
    arithmetic. It does not encode a SAT constraint or count search leaves.
  assumptions: []
  proof_search_map:
    bottleneck: >-
      Parsing published (a, b) independently of subfield_scan.py, computing
      the stabilizer by repeated squaring, and exhibiting one normal basis of
      F_{2^13} in which squaring is a rotation.
    baseline_embedding:
      parameter_slice: >-
        The six Koblitz coefficient lines read from
        analysis/binstd-curve-audit/binary-curve-params.txt on 2026-10-01:
        sect163k1 A=B=1; the other five Koblitz rows A=0, B=1.
      reproduction_check: >-
        An independent parser must recover those integers. A mismatch with
        the lines named above stops the run as an instrument failure.
    observation_collision:
      observable: mu and the normal-basis square-versus-shift bit.
      distinct_preimage_search: >-
        mu from the count of fixing powers, and mu from m/s where s is the
        degree of F_2(a, b), computed by separate functions. The shift check
        and a polynomial-basis encoding of the same elements are separate
        code paths.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Normal-basis coordinates of F_{2^13}.
        predicted_gain: >-
          Squaring becomes a coordinate rotation. No attack exponent moves.
    quantifier_order: >-
      For each of the twelve named curves, after (a, b, m) are parsed, mu
      equals the preregistered value. Separately, for every one of 32
      seed-determined elements of F_{2^13}, the normal-basis coordinates of
      the square are the cyclic shift. The polynomial-basis coordinates of
      at least one of those squares are not a cyclic shift.
    method_ceiling:
      strongest_certifiable_claim: >-
        The twelve-row mu table from the OpenSSL parameter dump in this
        repository, plus the F_{2^13} shift and endomorphism checks. No
        leaf-count factor and no statement about m >= 131.
      nearby_object_control: >-
        Polynomial-basis coordinates of the same 32 elements. If every square
        is a cyclic shift in that basis too, the normal-basis test has proved
        too much and the run is invalid. sect163r2 is the mu = 1 row.
    proof_obligations:
      - claim: The six Koblitz coefficients match the lines read at design time.
        responsibility: baseline
      - claim: mu equals the preregistered table on all twelve rows.
        responsibility: correctness
      - claim: Normal-basis squaring is a cyclic shift on all 32 elements.
        responsibility: correctness
      - claim: Polynomial-basis squaring is not a cyclic shift for at least one element.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: >-
        Every finite extension of a finite field has a normal basis, and in
        that basis the Frobenius acts by cycling the coordinates.
      citation: >-
        Textbook finite-field fact. No primary monograph was opened in this
        design session. The experiment must exhibit one basis of F_{2^13}.
      provenance: recalled
      verified_by: null
      role: shift identity
    - description: >-
        Current hexblob() in subfield_scan.py accepts a decimal coefficient
        with an optional (0xN) suffix. The regex the proposal describes as
        broken is not the regex in this tree.
      citation: analysis/binstd-curve-audit/subfield_scan.py
      provenance: internal
      verified_by: coordinator session 2026-10-01 (function hexblob read)
      role: corpus state of the parser the proposal diagnoses
  reduction_chain:
    core_problem: >-
      Compute mu on twelve named curves and test the normal-basis shift on
      F_{2^13}.
    corollaries: []
  predictions:
    - metric: stabilizer_mu
      direction: different
      minimum_effect: >-
        Koblitz rows mu = m. Composite rows mu = k in {11, 13, 17, 19, 23}.
        sect163r2 mu = 1. An agreed different value on a row is a negative
