      maximum_memory_gb: 2
      maximum_workers: 1
  falsification_conditions:
    - >-
      Both implementations agree and any of the twelve rows has mu different
      from the preregistered value.
    - >-
      Both implementations agree and at least one of the 32 normal-basis
      elements fails the cyclic-shift test.
    - >-
      A sampled point pair on the toy curve with a, b in F_2 has
      sigma(P+Q) different from sigma(P)+sigma(Q).
  interpretation_limits:
