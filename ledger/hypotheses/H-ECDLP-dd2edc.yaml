hypothesis:
  id: H-ECDLP-dd2edc
  area: ECDLP
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  source_proposal: IDEA-20260807-0f49b6
  proposal_id: IDEA-20260807-0f49b6
  title: >
    Stage 0 GGM-screen controls —
    trivial oracle simulable, x-read
    oracle not — before Oracle L
  status: specified
  proposed_by: idea-generator
  designed_by: coordinator
  designed_under_task: TASK-20260913-e64af8
  specified_by: DEC-20260913-84244f
  specified_at: '2026-09-13'
  created: '2026-09-13'
  updated: '2026-09-13'
  depends_on:
    - IDEA-20260807-0f49b6
    - RQ-ECDLP-002
  related_hypotheses: []
  statement: >
    Fix the two control identities of
    the GGM-simulability screen on a
    frozen 5-element toy group before
    Oracle L is defined as a lattice-
    embedding class. Stage 0 asserts
    only that a constant-output trivial
    oracle is reported simulable at
    zero overhead, that an oracle which
    reads the integer label of a group
    element and returns a label-dependent
    basis is reported not simulable,
    and that a missing-input oracle is
    rejected. Oracle L itself is not
    screened. This is not a lattice
    attack and not a Shoup-bound
    closure. Stages 1+ stay unauthorized.
  mechanism: >
    IDEA-20260807-0f49b6 asks to feed a
    lattice-embedding oracle through
    the existing GGM screen. Stage 0
    freezes the screen's own known-false
    and trivial controls on a 5-element
    labelled cyclic group so a later
    Oracle L verdict cannot be read
    from a screen that cannot fail.
    No lattice is built. No Coppersmith
    run. No HNP. No leakage model.
  predictions:
    - id: P-S0-GGMCTRL
      metric: screen control identities on the frozen toy group
      direction: different
      minimum_effect: >
        After fixture_pass, REAL
        trivial oracle is simulable at
        overhead 0, REAL x-read oracle
        is not simulable, and missing
        input is rejected. KF claim
        that the x-read oracle is
        simulable is rejected.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KF
      statement: >
        After fixture_pass, KF claim
        that the x-read oracle is
        simulable is accepted.
    - id: F-S0-REAL
      statement: >
        After fixture_pass, the trivial
        oracle is not simulable or the
        x-read oracle is simulable.
  test_boundary:
    instances:
      - frozen Stage 0 REAL / KF / NULL screen-control panel
    parameters:
      toy_group:
        n: 5
        labels: [0, 1, 2, 3, 4]
      real_trivial:
        kind: constant_basis
        must_simulable: true
        must_overhead: 0
      real_xread:
        kind: integer_label_dependent_basis
        must_simulable: false
      known_false:
        kind: claim_xread_is_simulable
        must_reject: true
      matched_null:
        kind: missing_input
        must_reject: true
      stage0_only_at_specify: true
    implementation: EXP-ECDLP-1f8260 Stage 0 runner
    budget:
      wall_clock_seconds: 120
    prose: >
      Toy labelled group of order 5.
      Stage 0 is exact table lookup of
      two declared oracles. It does not
      define Oracle L, does not reduce
      a lattice, and does not close
      KN-OPEN-018.
  assumptions:
    - id: A1
      statement: >
        The toy group is C_5 with
        public integer labels 0..4.
        Stage 0 does not construct
        Oracle L.
      status: explicit
    - id: A2
      statement: >
        Standing user authorization
        2026-09-06 covers protocol
        approval once the contract is
        complete.
      status: explicit
  heuristic_assumptions: []
  proof_search_map:
    bottleneck: >
      Whether the screen rejects the
      x-read oracle and accepts the
      trivial oracle on C_5.
    baseline_embedding:
      parameter_slice: >
        Trivial, x-read, KF, and NULL
        fixtures. Disclosed tightening:
        control calibrator only, not
        Oracle L.
      reproduction_check: >
        Trivial simulable at 0. X-read
        not simulable. KF rejected.
        NULL missing-input rejected.
    observation_collision:
      observable: simulable versus not-simulable on a labelled toy group
      distinct_preimage_search: >
        Hold the group and drop
        label-dependence (trivial).
        Hold the group and claim
        x-read is simulable (KF).
    constructive_transforms:
      - transform: nearby_object_control
        proposed_object: Frozen screen-control tables.
        predicted_gain: >
          Exact known-false reject on KF.
          Zero claimed lattice attack.
    quantifier_order: >
      Freeze the toy group and the two
      oracles before reading the table.
      Control pass does not close
      KN-OPEN-018.
    method_ceiling:
      strongest_certifiable_claim: >
        Instrument reproduction on the
        declared frozen toys. Never a
        GGM impossibility for Oracle L.
        Never an ECDLP exponent.
      nearby_object_control: >
        NULL is a missing-input oracle.
        An argument that still assigns
        it a simulability verdict is
        proves-too-much.
  knowledge_promotion:
    promoted: []
    not_warranted: Stage 0 design only. Nothing to promote.
  scientific_boundary: >
    Stage 0 P-S0-GGMCTRL only. Not
    Oracle L. Not Coppersmith. Not HNP.
    Not a Shoup-bound closure. Not a
    rho beat. No Stage 1 of
    EXP-ECDLP-1f8260. Does not re-run
    EXP-GGM-001.
