# =============================================================================
# H-BINSTD-944a66 -- Exact Rolle-pruned Weil-polynomial census at g=5,6 over
# F_2 for 131 | #A(F_2), with LMFDB unfiltered class-count completeness
# control. Specified and approved under DEC-20261001-60369f from
# IDEA-20260926-5c26f9 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
#
# ZERO RUNS in this design packet. IDEA-20260926-5c26f9 claim text is not
# edited (proposals immutable). Extends KN-OPEN-095df5 past dim <=4.
# =============================================================================
hypothesis:
  id: H-BINSTD-944a66
  question_id: RQ-BINSTD-b6f698
  related_question_ids: []
  source_idea: IDEA-20260926-5c26f9
  experiment_id: EXP-BINSTD-842864
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-01'
  approved_at: '2026-10-01'
  authorised_by: DEC-20261001-60369f
  proposed_by: coordinator
  title: >-
    Exact g=5,6 Weil-polynomial census over F_2 for 131 | h(3), with LMFDB
    completeness control — structural certificate column, no exponent

  statement: >-
    SETTING. KN-OPEN-095df5 asks whether a commutative algebraic group over
    F_2 has a rational point of order 131 (needed by the Couveignes–Lercier
    construction as reproduced in GGMP §4.2). For an abelian variety A/F_2 of
    dimension g, #A(F_2) = P(1) = h(3), where P is the degree-2g Frobenius
    characteristic polynomial and h is the degree-g real Weil polynomial.
    Committed exact_targets.py decides g<=4 with ZERO hits (104 candidates at
    g=3, 234220 at g=4) but does not scale to g=5 (head box ~1.48e9 per target).

    CLAIM. An exact Rolle-pruned depth-first enumerator with integer Sturm
    box tests and a_g pinned by h(3) ≡ 0 (mod 131) decides, at certificate
    grade relative to a completeness control, whether any abelian variety
    over F_2 of dimension 5 or 6 has 131 | #A(F_2).

    ARITHMETIC (re-derived; Stage 0 must reproduce). Integer Weil ceilings
    2 a_g - 1 for g=1..6 are 5, 33, 197, 1153, 6725, 39201. Multiples of 131
    below those ceilings: 0, 0, 1, 8, 51, 299.

    THREE OUTCOMES (pre-registered).
    (A) No hit at g=5 or 6 AND unfiltered class counts match LMFDB
        5, 35, 215, 1645, 14325, 164937 at g=1..6 → exclusion extends to
        dimension 6 at enumeration-certificate grade.
    (B) One or more hits: each recorded with P, h, N_r, a_r; a_r>=0 is a
        Jacobian-screen PASS (necessary, not sufficient); some a_r<0 is a
        non-Jacobian AV candidate.
    (C) Artifact: unfiltered counts mismatch LMFDB, OR ambiguous-near-
        boundary nonempty → neither exclusion nor candidate claimed.

    NO DIRECTION PREDICTED for hit count. No attack, no arity m, no
    per-attempt oracle budget, no product-law table row, no exponent.

  statement_note: >-
    IDEA-20260926-5c26f9 claim text is immutable and left at status proposed.
    This hypothesis freezes the experimental reading: exact Rolle+Sturm
    census with LMFDB control. Numerical weil_census.py MUST NOT be reused
    (gaps 4 at g=3, 21 at g=4 and growing).

  mechanism: >-
    OBJECT FRAME. Object = isogeny class of abelian varieties over F_2,
    represented by real Weil polynomial h ∈ Z[x] of degree g. No tracked
    object on E(F_{2^131}); certificate column for RQ-BINSTD-b6f698.
    ENUMERATION. Top-down Rolle pruning: a partial coefficient vector whose
    derivative fails the exact box test is abandoned soundly (interlacing).
    Box test = integer Sturm root count with boundary factor x^2-8 stripped
    and rational brackets about 2√2, matching exact_targets.exact_real_rooted_in_box
    but in pure-Python integers for g<=6 scale. Last coefficient a_g selected
    from the AP of step 131 inside |a_g| ≤ (2√2)^g. Completeness control:
    same enumerator WITHOUT the congruence must reproduce LMFDB class counts.
    Hit re-verification: independent sympy count_roots on every hit.
    Declared components: none of F1–F3 attack stages; structural_certificate.

  assumptions:
    - >-
      Honda–Tate / Tate isogeny correspondence over prime fields: monic
      integer Weil polynomials ↔ isogeny classes. Recalled; OPERATIONAL
      CHECK is the unfiltered LMFDB count match (outcome C on mismatch).
    - >-
      Place-count screen a_r >= 0 is necessary, not sufficient, for a
      Jacobian; never upgrade to "is a Jacobian".
    - >-
      Runtime estimate under HEUR-H1 is advisory only; timeout is
      infrastructure (AGENTS.md rule 3), never outcome A.
    - >-
      LMFDB class counts 1645/14325/164937 are as retrieved in the source
      IDEA (2026-09-28 WebFetch); a persistent single-g mismatch warrants
      re-fetch before blaming the enumerator.

  proof_search_map:
    bottleneck: >-
      Exact real-rootedness test count under Rolle pruning (estimated
      ~10^7 at g=5 and ~10^8 at g=6 under HEUR-H1), not the infeasible
      per-target head box of exact_targets.py.
    baseline_embedding:
      parameter_slice: >-
        g<=4, modulus 131: 0 hits; 104 and 234220 candidates
        (exact_targets.json); unfiltered class counts 5, 35, 215, 1645.
      reproduction_check: >-
        exact_targets_g56.py --max-dim 4 must report 0 hits and unfiltered
        counts 5, 35, 215, 1645 before any g=5,6 claim.
    observation_collision:
      observable: >-
        Set of integer real Weil polynomials of degree g∈{5,6} with
        h(3)≡0 (mod 131) and roots in [-2√2, 2√2]; unfiltered class count.
      distinct_preimage_search: >-
        False zero ← incomplete enumeration (caught by LMFDB count) or
        wrong box test (caught by g<=4 reproduction + sympy re-check).
        False hit ← wrong box test (caught by second implementation).
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Exact Rolle-pruned enumerator + congruence pinning of a_g in
          integer arithmetic (weil_census order × exact_targets test).
        predicted_gain: >-
          From infeasible per-target box to estimated hours at g=6, with
          completeness control free as by-product. No attack-cost gain.
    quantifier_order: >-
      FOR ALL integer h of degree g∈{5,6} real-rooted in the box,
      131 ∤ h(3) (outcome A), OR THERE EXISTS such an h (outcome B);
      unfiltered count certifies the FOR ALL reading.
    method_ceiling:
      strongest_certifiable_claim: >-
        No AV over F_2 of dimension <=6 has a rational point of order 131
        (A), OR the listed isogeny classes are the only such of dim <=6 (B).
        Nothing about dim >=7, tori, unipotent/non-commutative groups,
        factor bases, ECC2K-130, or any exponent.
      nearby_object_control: >-
        Toy moduli {17,19,23,29,31,37,41} at g<=3 (toy-moduli companion (date-token 20260926-80209d));
        modulus 5 at g=1 must find the 5-point elliptic class; modulus 1
        returns every class (hits = unfiltered count).
    proof_obligations:
      - claim: Integer ceilings 6725, 39201 and multiple counts 51, 299
        responsibility: correctness
      - claim: Rolle pruning never rejects a real-rooted-in-box h
        responsibility: correctness
      - claim: Integer Sturm agrees with sympy on every hit and on a
          random sample of 10^4 pruned nodes
        responsibility: correctness
      - claim: Unfiltered counts reproduce 5, 35, 215, 1645, 14325, 164937
        responsibility: baseline
      - claim: Place counts a_r via Möbius formula; checked on a known
          g=2 Jacobian class
        responsibility: correctness
      - claim: No exponent / factor-base / ECC2K-130 attack claim
        responsibility: scope
    not_applicable_reason: null

  asymptotic_claim:
    problem: >-
      Existence of an abelian variety over F_2 of dimension <=6 with a
      rational point of order 131 (KN-OPEN-095df5 / RQ-BINSTD-b6f698)
    prior_best: exact exclusion at dimension <=4 (KN-OPEN-095df5)
    time_exponent: n/a
    memory_exponent: n/a
    hidden_cofactor: >-
