  heuristic_assumptions:
    - id: HEUR-BINSTD-944a66-H0
      formal_statement: >-
        NONE FOR correctness of the census decision. Outcomes A/B/C are
        unconditional relative to the LMFDB completeness control and the
        two box-test implementations.
      random_model_justification: >-
        Deterministic enumeration + exact arithmetic; Honda–Tate over F_2
        checked operationally by unfiltered counts.
      supporting_results:
        - KN-OPEN-095df5 exact g<=4 zero (internal)
        - analysis/couveignes-lercier-131/exact_targets.json (internal)
        - LMFDB class counts as cited in IDEA-20260926-5c26f9 (retrieved)
      validation_experiment_ids:
        - EXP-BINSTD-842864
      falsification_condition: >-
        Unfiltered count mismatch; OR sympy rejects an integer-Sturm hit;
        OR g<=4 reproduction disagrees with exact_targets.json.
    - id: HEUR-BINSTD-944a66-H1
      formal_statement: >-
        RUNTIME ONLY. Rolle survivors at level g-1 are within 10× of the
        isogeny-class count at dimension g-1 (1645 at g=5, 14325 at g=6),
        so exact-test count is about 10^7 (g=5) and 10^8 (g=6).
      random_model_justification: >-
        Survivors approximate the volume of a scaled real-rooted region;
        calibration only from class-count growth 5,35,215,1645.
      supporting_results:
        - IDEA-20260926-5c26f9 HEUR H1 (internal proposal statement)
      validation_experiment_ids:
        - EXP-BINSTD-842864
      falsification_condition: >-
        Level-(g-1) survivor count at g=6 exceeds 10×14325 → insert cheap
        necessary filters (Newton log-concavity, sign conditions) before
        Sturm; timeout alone is infrastructure, not H1 math falsification.

