  falsification_conditions:
    - Multiple counts at g=5,6 are not 51 and 299 (arithmetic error).
    - Unfiltered counts miss LMFDB by >=1 (enumerator incomplete; no A).
    - A hit fails sympy re-test, or a pruned node is accepted by sympy.
    - g<=4 reproduction disagrees with exact_targets.json.
    - >-
      Claiming outcome A while ambiguous-near-boundary is nonempty
      (protocol violation → treat as C).

  interpretation_limits:
