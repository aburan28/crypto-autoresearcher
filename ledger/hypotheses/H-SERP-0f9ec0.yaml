# H-SERP-0f9ec0 — specified from IDEA-20261005-1cb745.
# Protocol approval is DEC-20261006-702c50. This record asserts no
# Serpent break, no distinguisher, and no key recovery. No linear
# transformation was applied in the design session. The submission
# PDF was not opened. KN-LIT-3430 was opened as a markdown note.
hypothesis:
  id: H-SERP-0f9ec0
  question_id: RQ-SERP-722a09
  source_proposal: IDEA-20261005-1cb745
  goal_id: GOAL-SERP-5ecff7
  goal_id_note: >-
    ledger/questions/RQ-SERP-722a09.yaml names GOAL-SERP-5ecff7. This
    design cites that goal and does not edit the goal file, does not
    open a lane, and does not change goal status.
  status: approved
  status_note: >-
    approved means the measurement protocol in EXP-SERP-55a165 is
    approved for a later executor. It does not mean the minimum is at
    least 2. Status moves only by DEC-20261006-702c50 under the
    standing user authorization of 2026-09-06. This design session
    wrote no run artifact and did not apply the linear transformation.
  proposed_by: coordinator
  conversion_note: >-
    The input class of 480 single-S-box differences, the predicted
    minimum of at least 2, the identity minimum of 1, and the rule
    that one image with fewer than 2 active S-boxes is a negative are
    carried from IDEA-20261005-1cb745. The Coordinator added the pin
    by one published full-round test vector, the agreement of two
    activity counters, and the agreement of the bitsliced map with the
    matrix it induces.

  statement: >-
    TEST BOUNDARY. One linear transformation, the published Serpent
    linear layer, applied once. Key whitening is omitted because an
    XOR difference cancels key addition. The inputs are the 480
    nonzero 128-bit differences whose support lies in exactly one of
    the 32 published 4-bit S-box windows: 32 windows times 15 nonzero
    nibbles. The zero difference is computed separately and is not in
    the minimum. No other input class is in the test. No round beyond
    this one linear layer is in the test.

    PRE-REGISTERED PREDICTION, fixed before any executor run. Every
    one of the 480 images has at least 2 active S-boxes. Equivalently,
    the minimum active-S-box count on those images is at least 2. The
    identity map on the same 480 differences has minimum 1. A single
    image with fewer than 2 active S-boxes, under a pin that passed
    the test vector and the identity control, is a negative. No
    distinguisher, no key recovery, and no Serpent break is stated.

    DISTINGUISHABLE OUTCOMES. (1) The pin matches one published
    full-round test vector, the identity minimum is 1, the two
    activity counters agree, the bitsliced map agrees with its matrix,
    and every image has at least 2 active S-boxes: the branch claim
    holds on this input class. (2) The same pin checks pass and at
    least one image has 0 or 1 active S-box: the branch claim fails.
    (3) The test vector fails, the identity minimum is not 1, the
    counters disagree, or the matrix disagrees with the bitsliced map:
    the measurement is unsigned. (4) A timeout or crash: infrastructure,
    not a branch result.

  mechanism: >-
    Activity is the support of an XOR difference across the 32
    published 4-bit windows. The identity map preserves a single-window
    support, so its minimum on this nonzero class is 1. The published
    linear transformation is the only map under test. Minimum at least
    2 means every single-S-box input difference is sent into at least
    two S-boxes. Minimum 1 means at least one single-S-box difference
    stays inside one S-box, so this layer does not force a branch on
    that input. Minimum 0 means the pinned map sent a nonzero
    difference to zero.
    LOSSY-PROJECTION TEST. The object is a 128-bit XOR difference.
    The operation is one application of the linear layer. The
    projection keeps the set of active windows and discards which
    nonzero nibble sits in each window. Compatible with the operation:
    a linear map sends the zero window to a linear image, so emptiness
    of a window is a property of the image. Lossy: many differences
    share one activity pattern, so the minimum is not a differential
    probability.

  assumptions:
    - XOR differences ignore key addition, so omitting whitening does not change S-box activity.
    - Activity means the four bits of one published S-box window are not all zero. The windowing and bit order are those of the pinned implementation that passed the test vector.
    - The 480 inputs are exactly the differences whose support lies in one of the 32 windows. The zero difference is excluded from the minimum.
    - This session did not apply the linear transformation. The prediction is the proposal's prediction. It is not a recorded count.
    - KN-LIT-3430 was opened as markdown. Its plaintext and time figures are not measurements for this count. The Serpent AES submission was not opened.

  proof_search_map:
    bottleneck: >-
      The support of one linear image on 480 named differences.
      Removing the linear layer and substituting the identity is what
      drops the minimum from the predicted value to 1. Differential
      probability, key recovery, and later rounds are outside this
      measurement. This session did not apply the map.
    baseline_embedding:
      parameter_slice: >-
        The identity map on the same 480 differences. Its minimum is 1
        by preservation of a single nonzero window. That is the
        baseline this layer is compared with.
      reproduction_check: >-
        Recompute the identity minimum. It must be 1. Recompute the
        zero difference separately. It must have 0 active windows and
        must not enter the minimum.
    observation_collision:
      observable: >-
        The minimum number of active 4-bit windows among the 480
        images, together with the identity minimum.
      distinct_preimage_search: >-
        Two different single-window inputs can share an activity
        count. That collision is expected and is not a witness. A
        witness is one input whose image has fewer than 2 active
        windows.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The 480 single-window differences, then the identity map on
          the same set.
        predicted_gain: >-
          A minimum at least 1 above the identity minimum of 1. No
          asymptotic gain.
    quantifier_order: >-
      For every one of the 480 differences, the image under the pinned
      linear transformation has at least 2 active windows. The
      quantifier does not range over differences that start in two or
      more windows, and it does not range over later rounds. Swapping
      it for an existence claim would not be this hypothesis.
    method_ceiling:
      strongest_certifiable_claim: >-
        The active-S-box minimum of this one linear layer on this
        input class of 480 differences. Nothing about a distinguisher
        and nothing about 11-round Serpent.
      nearby_object_control: >-
        The identity linear layer on the same 480 differences. The
        conclusion "minimum at least 2" is predicted false for the
        identity, whose minimum is 1. The zero difference, predicted
        to have 0 active windows, is excluded from the minimum.
    proof_obligations:
      - claim: Every one of the 480 images has at least 2 active S-boxes.
        responsibility: baseline
      - claim: The identity minimum on the same 480 inputs is 1.
        responsibility: correctness
      - claim: No Serpent break, distinguisher, or key recovery is inferred.
        responsibility: scope
    not_applicable_reason: >-
      The map above audits an exhaustive support count. It is not a
      proof of an attack.

  rerandomization: >-
    This hypothesis does not use a re-randomizing walk. The census is
    480 named differences. No key is recovered and no difference is
    pulled back to a later round.

  asymptotic_claim:
    problem: >-
      Whether the active-S-box minimum of one Serpent linear layer on
      480 single-S-box differences is at least 2. Serpent is not
      claimed to be broken.
    prior_best: >-
      No attack is improved. KN-LIT-3430 relays an 11-round
      differential-linear attack. This count stops at one linear layer.
    time_exponent: unchanged
    memory_exponent: unchanged
    hidden_cofactor: >-
      No algorithmic o(1) term is claimed. The count is 480
      applications of one 128-bit linear map, plus the identity on the
      same 480 inputs.
    claim_kind_note: >-
      No exponent improvement, cofactor improvement, or constant-factor
      improvement is claimed, so none of those three labels is applied.

  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        A uniform random element of GL(16, F_2), in the 16-bit model
        with four 4-bit windows, sends a fixed nonzero vector to a
        uniform nonzero vector. The probability that the image lies in
        one window is 4*(2^4-1)/(2^16-1) = 60/65535. This imitates
        counting in that 16-bit model. It is not a sample of the
        128-bit Serpent linear transformation, and no transfer is
        claimed.
      random_model_justification: >-
        Counting. There are 4 windows and 15 nonzero patterns in each,
        and 2^16-1 nonzero vectors. A uniform element of GL(16, F_2)
        sends a fixed nonzero vector to a uniform nonzero vector. No
        Serpent theorem is used.
      supporting_results:
        - ref: IDEA-20261005-1cb745
          provenance: internal
          claim: >-
            The proposal states the same 16-bit counting probability
            60/65535 and states that the 16-bit model is not a sample
            of the 128-bit map.
          verified_by: ledger/proposals/IDEA-20261005-1cb745.yaml
      validation_experiment_ids:
        - EXP-SERP-55a165
      falsification_condition: >-
        In 200 independent draws, eight or more images of one fixed
        weight-1 vector lie in a single 4-bit window. That rejects the
        counting implementation of this 16-bit model. It is not a
        negative on the 480-image Serpent count.

  structural_ingredients:
    - description: >-
        Markdown note relaying an enhanced differential-linear attack
        as the best known attack on 11-round Serpent at that paper's
        time, with the printed figures 2125.3 chosen plaintexts and
        time complexity 2139.2. Those figures are not used as
        measurements. The primary paper was not opened.
      citation: KN-LIT-3430
      provenance: internal
      verified_by: knowledge/literature/KN-LIT-3430.md
      role: frontier relay this count does not improve
    - description: >-
        Technique note separating keyed differential data, paid at the
        inverse of a probability, from unkeyed freedom-degree
        accounting. This count spends no freedom degrees.
      citation: KN-TECH-066
      provenance: internal
      verified_by: knowledge/techniques/KN-TECH-066.md
      role: accounting boundary, not a cost formula
    - description: >-
        Negation-map rho. Walking on plus-minus classes gives a
        square-root-of-2 reduction in expected iterations and creates
        fruitless cycles, with 2-cycle probability about 1/(2r) per
        step. Best practical gain stated there is 1.29. This count
        performs 0 rho iterations.
      citation: KR-RHO-fb88e6
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-fb88e6.yaml
      role: frontier row positioned against, and not used
    - description: >-
        Binary-field factor base as an F_2-subspace V of x-coordinates,
        with small product spaces lowering degree after Weil descent.
        This count uses 0 factor-base elements.
      citation: KR-IC-73db3f
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-73db3f.yaml
      role: frontier row positioned against, and not used
    - description: >-
        Recalled pointer, not opened, for the eight 4-bit S-boxes and
        the bitsliced linear transformation. Not support for the
        minimum of 2.
      citation: Biham-Anderson-Knudsen Serpent AES submission
      provenance: recalled
      verified_by: null
      role: pointer to the unread specification

  reduction_chain:
    core_problem: >-
      Whether every one of 480 single-S-box differences is sent by one
      Serpent linear layer to at least 2 active S-boxes.
    corollaries: []
    corollaries_note: >-
      No published reduction is invoked. One support minimum does not
      cascade to a distinguisher or a key recovery.

  predictions:
    - metric: min_active_sboxes_after_linear_layer
      direction: higher
      minimum_effect: >-
        At least 2, which is 1 above the identity map's minimum of 1
        on the same 480 differences.
    - metric: images_with_fewer_than_2_active_sboxes
      direction: lower
      minimum_effect: 0

  test_boundary:
    instances:
      - 480 nonzero differences supported in a single 4-bit window
      - the identity map on those 480 differences
      - the zero difference, excluded from the minimum
      - one published full-round test vector, used only to pin the implementation
    parameters:
      windows: 32
      nonzero_nibbles_per_window: 15
      input_count: 480
      predicted_minimum: 2
      identity_minimum: 1
      block_bits: 128
    implementation: >-
      Pin the S-boxes and the linear transformation by one published
      full-round test vector. Apply the linear transformation to each
      of the 480 differences and record the minimum number of active
      windows. Repeat with the identity map. Do not emit an attack.
    budget:
      enforcement: advisory
      maximum_runs: 1
      note: >-
        One exhaustive count of 480 images plus the identity control.
        Time and memory watches live on the experiment contract. They
        are advisory.

  falsification_conditions:
    - The pin is valid and at least one of the 480 images has fewer than 2 active S-boxes.
    - The completed minimum on the 480 images is 1 or 0, with the identity control returning 1.
    - The writeup states a distinguisher, a key recovery, or a Serpent break.

  interpretation_limits:
    - A minimum of 2 on this input class does not bound differences that start in two or more S-boxes, does not give a differential probability, and does not reach the 11-round figure relayed by KN-LIT-3430.
    - The corpus entry's plaintext and time figures were not checked against the paper.
    - The square-root-of-2 iteration factor and the 1.29 practical gain in KR-RHO-fb88e6 are not applied to this count.
    - KR-IC-73db3f's degree drop from a small product space is not applied. Factor-base elements used: 0.
    - The 16-bit GL model in HEUR-1 does not transfer to the 128-bit map.
    - The design session did not apply the linear transformation. There is no recorded count yet.

