  id: H-XEDN-0ea2b6
  statement: 'On E: y^2=x(x^2+A*x+B) over Q, let B=+/-r for a positive prime r, P=(s^2,yP),
    Q=(-t^2,yQ), s,t nonzero rationals. If f_plus=A+2*s^2+2*yP/s and f_minus=A+2*s^2-2*yP/s
    are distinct positive primes, then P,Q are independent modulo torsion. Nonsingularity
    is required. A>0 is not required for this independence statement.'
  mechanism: The signed-square alpha images of Q,T generate four classes; R provides
    a nontrivial alpha-prime class distinct from 1,D. Their mod-2 independence excludes
    an integer relation modulo torsion.
  assumptions:
  - B*(A^2-4B) != 0
  - All stated points are rational and on E.
  - The three prime assertions are certified, not probable-prime acceptance.
  proof_search_map:
    bottleneck: Rank at most two does not imply that two prescribed points are dependent.
    baseline_embedding:
      parameter_slice: Cheon section 4, p=353, n in [-2000,2000]
      reproduction_check: Two retained candidates have exact primality, descent and
        mod-2 certificates.
    observation_collision:
      observable: Both prescribed lifts pass a low-rank factor screen.
      distinct_preimage_search: Passing rank-two pairs may be independent; test actual
        squareclasses and dual preimage.
    constructive_transforms:
    - transform: observable_fiber
      proposed_object: P,Q,T classes in E(Q)/2E(Q)
      predicted_gain: A dependence exclusion certificate within explicitly stated
        hypotheses.
    quantifier_order: For every nonsingular rational E and rational P,Q meeting all
      listed prime/sign hypotheses; not for all source residues or lifting methods.
    method_ceiling:
      strongest_certifiable_claim: P and Q independent modulo torsion under the conditional
        hypotheses.
      nearby_object_control: Q=[2]P is dependent and cannot satisfy all independent-class
        hypotheses.
    proof_obligations:
    - claim: R=(f_minus,-2*s*f_minus) lies on E prime and dual(R)=P.
      responsibility: correctness
    - claim: P,Q,T independent mod 2, and torsion contributes only the T class.
      responsibility: scope
    - claim: A>0 is used only for the exact upper rank bound on the two candidates.
      responsibility: scope
    not_applicable_reason: null
