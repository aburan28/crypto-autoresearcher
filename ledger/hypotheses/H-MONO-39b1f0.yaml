  status_note: >-
    SUPERSEDES, IN PLACE (never archived, so this is a draft correction, not
    a CORR record — see AGENTS.md rule 4's own distinction between
    archived and draft records), an earlier version of this hypothesis
    that this same drafting pass produced and that a subsequent
    independent review (review_plan TASK-20260905-153d93, Validator +
    Red Team, both fresh and blind) found to rest on a genuine mistake:
    it treated IDEA-20260807-5126f4's own already-anticipated FULL-LOCUS
    null control (T pinned on-curve alongside m-2 factor-base
    coordinates) as if it were the idea's actual PARTIAL-LOCUS claim (T
    held generic during tower construction, specialized only at
    evaluation time). Both are recorded below in full, because the
    mistake and its correction are themselves informative for any future
    reader of this thread.

  review_findings_2026_09_05: >-
    VALIDATOR (BREAK on both assigned joints): reading (ii) -- T
    immediately pinned on-curve, per Stage 5's own construction -- is
    the idea's own FULL LOCUS, not its partial locus. Direct textual
    evidence: IDEA-20260807-5126f4's own `mirror_failure_check`
    (lines 61-64) and `null_object_control.primary_null` (lines 65-68)
    describe "the full locus" as exactly the case where "the fibre
    splits completely by the group law" and require the filter's
    false-positive rate to be ~1 THERE as a correctness SANITY CHECK,
    not a falsifying result. KN-FIND-c41ea9's own theorem (unconditional
    complete splitting whenever m-1 of m arguments are on-curve) fires
    exactly at Stage 5's construction (m-2 factor-base coords + T, both
    on-curve = m-1 of m). Stage 5 therefore measured the idea's own
    ALREADY-EXPECTED (90% prior, per the idea's own
    `honest_prior_of_survival`) null control, not its actual, far more
    uncertain (40% prior) partial-locus claim. The Validator also found
    a third, previously unconsidered reading that IS textually
    defensible as "the partial locus": T held as a GENERIC/symbolic
    parameter during the tower's construction (consistent with
    DEC-20260804-4f37d5's own generic Galois computation over
    F_p(x_2,...,x_{m-1},c), c transcendental), with the m-2 factor-base
    coordinates specialized to concrete on-curve values -- meaning the
    tower is built ONCE, generically, then evaluated cheaply against
    many concrete candidate targets at use time. This construction keeps
    the C_2^{m-2} structure genuinely nontrivial (only m-2, not m-1, of
    the tower's generators collapse to F_p), matching the idea's own
    "complete splitting... does NOT apply" language, and matches "where
    relation search actually operates" in the sense of amortizing one
    tower construction over many targets -- a coherent, previously
    unnamed reading neither the original draft's reading (i) nor reading
    (ii) captured.

    RED TEAM (BREAK on the filter-equivalence joint it was assigned,
    conditional on reading (ii) as then drafted; HOLD on the
    proves-too-much control): independent of the reading-(ii)-vs-(iii)
    question above, even taking reading (ii) at face value, the earlier
    draft's specific numeric claim ("filter false-positive rate equals
    the measured split rate, 0.833-1.0") was itself wrong. Constructing
    the actual character-tower filter from first principles and testing
    it against a committed non-split Stage-5 cell
    (RUN-MONO-805a02-1, p=1009, m=4: P1=(208,13), P2=(54,489),
    Rt=(993,161)) showed every one of the filter's own Legendre tests is
    a tautology on already-guaranteed-on-curve fixed coordinates,
    independent of whether the fibre "splits" in Stage 5's own
    root-multiplicity sense -- so under reading (ii) the filter's true
    false-positive rate is IDENTICALLY 1, not merely 0.833-1.0 (Stage
    5's split rate and the filter's own false-positive rate are related
    but NOT the same quantity; the observed non-split cells trace to an
    unrelated root-VALUE collision, not the character filter correctly
    rejecting anything). The proves-too-much control independently
    reconfirmed, by fresh computation (not reusing any prior single-
    reviewer claim), that the m-1-of-m argument count is a sharp
    threshold: fixing one argument short of the precondition gives
    0/30, 0/30, 0/20, 0/20 splitting across four independently-computed
    m=4/m=5, p=211/p=1009 cells, versus 90-100% at the precondition --
    so the argument-count arithmetic itself, where it does apply, is not
    an over-generalization.

    NET READING: both reviewers' findings are mutually consistent, not
    contradictory. Read together: reading (ii) IS the idea's own full
    locus (Validator), and on that full locus the proposed filter is
    trivially vacuous by direct construction, exactly as the idea's own
    null-control design already required (Red Team) -- i.e. Stage 5,
    reused under reading (ii), is a correct, zero-new-compute
    CONFIRMATION of IDEA-20260807-5126f4's own primary null control, and
    nothing more. It does NOT touch the idea's actual claim, which lives
    at the partial locus under the Validator's newly-identified third
    reading -- a construction that has never been built or measured by
    any record in this corpus.

  mechanism: >-
    Carried from IDEA-20260807-5126f4, unchanged: a C_2^{m-2} Galois
    group means the degree-2^{m-2} root-finding problem for x_1
    decomposes as a tower of m-2 quadratic extensions; on the partial
    locus (m-2 factor-base coordinates fixed, one free), deciding
    whether a root lies in the factor base may reduce to m-2
    quadratic-character (Legendre symbol) tests instead of a
    degree-2^{m-2} root-find. THIS RECORD'S OWN CORRECTION (see
    `review_findings_2026_09_05` above): the mechanism's actual test
    locus requires T held GENERIC/symbolic during the tower's
    construction, not pinned immediately to a concrete on-curve value --
    pinning T immediately (as this record's own retracted first draft
    did) collapses the construction to the idea's own already-anticipated
    FULL-LOCUS null control, where the mechanism is trivially vacuous by
    direct inspection (every Legendre test becomes a tautology on
    already-on-curve fixed coordinates), not a discovery about the
    partial locus.

  statement: >-
    SCOPE: prime fields F_p, p in {211, 1009}; m in {4,5}; the curve
    A=37, B=57 at p=211 (KN-FIND-c41ea9's committed curve); claim tier
    toy. IDEA-20260807-5126f4's claim/mechanism/predictions/
    falsification_conditions are carried forward UNCHANGED and remain
    genuinely open (see below) except for the one piece existing
    evidence actually settles.

    WHAT IS DECIDED: IDEA-20260807-5126f4's own primary null control
    (`null_object_control.primary_null`, the full-locus vacuity check --
    T pinned on-curve alongside all other summation coordinates) is
    CONFIRMED by EXP-MONO-805a02 Stage 5's already-executed,
    already-independently-reviewed measurement (near-complete split
    rate 0.833-1.0, four cells) together with this round's own
    independent re-derivation (Red Team: filter false-positive rate
    exactly 1 at that locus, by direct construction). This is exactly
    the sanity-check behavior the idea's own design required before its
    real test could be trusted -- a small, genuine, zero-new-compute
    contribution, not a falsification of anything.

    WHAT REMAINS OPEN: the idea's actual claim -- does the C_2^{m-2}
    character-tower filter, built with T held GENERIC during
    construction (the Validator's third reading) and specialized only
    at evaluation against concrete candidate targets, achieve a
    false-positive rate substantially below 1 (below 1/2 at m=4, per
    the idea's own bar)? No record in this corpus has built or measured
    this construction. It is NOT the same object as anything
    EXP-MONO-805a02 tested.

  falsification_conditions:
    - >-
      (a, from IDEA-20260807-5126f4) "Filter false-positive rate is ~1
      on the partial locus too." NOT DECIDED by this record or by
      EXP-MONO-805a02: what was decided is that the rate is (correctly,
      expectedly) ~1 on the FULL locus, which is a different
      construction under the Validator's third reading. The partial
      locus (T generic during construction) remains untested.
    - >-
      (b, from IDEA-20260807-5126f4) "Resolvent field-operation count is
      at or above enumerate-and-test at every m." NOT decided; not
      rendered moot either, since (a) is no longer decided at the actual
      partial locus.
    - >-
      (c, from IDEA-20260807-5126f4) "Full-locus vacuity check does not
      fire." CONFIRMED to fire correctly (see WHAT IS DECIDED above) --
      this is the one falsification condition this record actually
      speaks to, and it fires in the DIRECTION the idea's own design
      required (a passing sanity check), not a falsifying direction.

