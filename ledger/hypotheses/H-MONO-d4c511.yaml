hypothesis:
  id: H-MONO-d4c511
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  derived_from_idea: IDEA-20260904-4f614a
  status: supported
  added: '2026-09-04'

  status_note_2026_09_04: >-
    EXP-MONO-4e6faa executed, independently reviewed (Validator + Red
    Team), and decided in DEC-20260904-46b71e (evidence: EV-MONO-91bca2).
    Outcome (I) resolves on its letter: the closed form's predicted #1^4
    and #2+1+1 match an exhaustive census EXACTLY on a found h_->0 curve
    (p=101, A=1, B=0, h_-=1), independently reproduced from scratch by the
    Validator, and the named rival "#E[4]-alone" hypothesis is decisively
    refuted on the same curve. But per Red Team's J4 finding, h_-=1 is the
    minimal possible positive value and cannot discriminate the CLAIMED
    LINEAR form of the h_- term from other functional forms agreeing at
    h_-=1 -- so this record's own surrounding claim of "closing the
    retrodiction-bias gap" is only PARTIALLY earned, not fully. Status is
    recorded as partially_supported, not supported. Next action: a
    follow-up on an h_->1 curve (candidate p=101, A=1, B=33, h_-=3, per
    Red Team's own free-standing finding, to be independently re-verified)
    comparing the linear prediction against a named non-linear
    alternative, tracked under its own new hypothesis ID rather than
    reopening this record's frozen text.

  status_note_2026_09_04_b: >-
    The follow-up named above (H-MONO-fa4cb9, EXP-MONO-ee06e2) has now
    executed, been independently reviewed, and been decided in
    DEC-20260904-e9df3f (evidence: EV-MONO-fae201): the linear form
    matches exactly on the found h_-=3 curve and the quadratic rival is
    decisively excluded, with the underlying STEP 4/5 mechanism
    independently re-derived and confirmed structurally sound (not
    merely fit) by Red Team. The gap this record's own status_note above
    left open is now closed. Status is upgraded from partially_supported
    to supported. Promoted to the knowledge corpus as KN-FIND-edd62c
    (h_-, h_+=0 slice only -- the h_+ term and any h_+/h_- interaction
    remain untested; see that entry's own disclosed scope and
    DEC-20260904-e9df3f's next_action for the p=103, A=1, B=11 follow-up).

  statement: >-
    SCOPE: m=4 only, symmetric-base Semaev cover, prime fields F_p, p>3,
    toy range, ordinary curves with the distinct-split (Z=3) residual
    stratum only (g splits into three distinct F_p-rational roots).
    Claim tier toy for measurement, derivation tier for the closed form
    under test.

    THE HYPOTHESIS. IDEA-20260904-4f614a proposes an exact closed-form
    explanation for why #E(F_p)[4] governs the m=4 symmetric-base census's
    own fine structure (beyond (t,Z)), via the fixed-point structure of
    2-torsion translation involutions on the x-line. With n_+ and n_-
    counting "positive" and "negative" halvings of the curve's own
    rational 2-torsion, and h_+ = (#E(F_p)[4]-tau)/4, h_- = (#E^d(F_p)[4]-tau)/4
    (E^d the QUADRATIC TWIST), the proposal predicts, on the distinct-split
    stratum:
      #1^4   = C(n_+,3) + C(n_-,3) + D
      #2+1+1 = 3 n_+ n_-  -  3 D
      #2+2   = C(n_++n_-,3) - C(n_+,3) - C(n_-,3) - 3 n_+ n_- + 2 D
    with D = h_+ n_- + h_- n_+, EXACTLY, on the entire distinct-split
    stratum -- zero tolerance, no test statistic.

    THE HONEST GAP THIS HYPOTHESIS EXISTS TO CLOSE, NAMED BY THE IDEA
    ITSELF. The formula reproduces all six archived integers from
    EXP-MONO-0e6e8f's own two witness curves EXACTLY, with zero free
    parameters -- but BOTH witness curves happen to have h_-=0 (their
    quadratic twist has #E^d[4] = tau exactly, i.e. no extra rational
    fourth-torsion on the twist), so the D-term's own h_- contribution is
    UNTESTED by any existing data. A formula matching six integers with
    zero free parameters is a strong constraint, but cannot by itself
    distinguish "a genuine law" from "a fit that happens to work because
    the untested term vanishes on every curve tried so far."

    PRE-REGISTERED, TWO-SIDED, TARGETING EXACTLY THE UNTESTED TERM. (I) On
    at least one curve with h_- > 0 (found by explicit search, not
    assumed to exist), the closed form's own predicted #1^4 and #2+1+1
    counts (which now depend nontrivially on h_-) match the exhaustively
    censused values EXACTLY. This closes the retrodiction-bias gap and
    upgrades the formula from "fits two curves" to "genuinely predictive
    on curves it was not fit to." (II) The formula fails on an h_->0
    curve -- falsifying the D-term's own claimed form (h_+ n_- + h_- n_+)
    specifically, while leaving open whether a corrected form (e.g. with a
    different coefficient, or missing the h_- term's own claimed symmetry
    with h_+) could still work.

  mechanism: >-
    Reuses IDEA-20260904-4f614a's own full derivation unmodified (the
    2-torsion translation involution mu_T on P^1, its fixed points as
    halvings of T, the case analysis on which sign classes' x-coordinates
    coincide). This hypothesis's own new content is: (1) an explicit
    search for at least one curve at a toy prime with h_- > 0 (i.e. the
    QUADRATIC TWIST has #E^d[4] > tau, meaning the twist has extra
    rational 4-torsion structure beyond its own 2-torsion) -- the idea's
    own text flags this as a genuine, unchecked occupancy question
    (HEUR-CELL-1), not a guaranteed-to-exist object; (2) exhaustive census
    of that curve's own distinct-split (Z=3) base points, reusing
    EXP-MONO-0e6e8f's own already-verified construction; (3) exact,
    zero-tolerance comparison against the closed form's own prediction.

  falsification_condition: >-
    Per the idea's own F7/F8: if NO curve with h_->0 exists within the
    declared toy prime range, that is itself a reportable, falsifiable
    fact about occupancy (not evidence for or against the formula) -- HEUR-CELL-1's
    own bounded-negative reporting rule applies, and this hypothesis's own
    disposition becomes "search exhausted the declared range without a
    stress-test object," not "confirmed" or "refuted." If such a curve IS
    found: any single exact-count mismatch (R1 = #1^4_observed -
    #1^4_predicted != 0, or the analogous R2 for #2+1+1) falsifies the
    D-term's own claimed form.

  heuristic_assumptions:
    - id: H1
      statement: >-
        HEUR-CELL-1 (inherited from IDEA-20260904-4f614a): a curve with
        h_->0 exists within the declared toy prime search range. This is
        an occupancy/existence question, not a distributional one --
        structurally, #E^d[4] in {tau, tau+4, tau+8,...} is reachable in
        principle (per the idea's own mod-8 analysis of #E and #E^d), but
        whether it is actually realized within a SPECIFIC small search
        range at a SPECIFIC prime is a counting fact not yet checked.
      rigorous_support: >-
        Not distributional; an existence claim, checked by explicit
        exhaustive or wide search, not assumed.
      validation_plan: >-
        SAMPLE: scan ordinary curves (varying A,B, or varying j across
        multiple primes if needed) at toy primes in [101,2000] until a
        curve with h_->0 and Z=3 (distinct-split residual stratum
        admissible) is found, or the declared range is exhausted.
        COMPARE AGAINST: the closed form's own exact prediction on that
        curve's own exhaustive distinct-split-stratum census.
        TAIL CHECK: not applicable, exact-integer test.
        TRANSFER ASSUMPTION, STATED: a confirmed match on ONE h_->0 curve
        supports but does not prove the formula for every possible (n_+,
        n_-, h_+, h_-) combination; a genuinely thorough test would sample
        multiple such curves if the first search is cheap enough to allow it.
      falsification_condition: >-
        Any single exact mismatch on a found h_->0 curve, or complete
        exhaustion of the declared search range with no such curve found
        (a reported non-finding, not a falsification of the formula itself).

  target_complexity:
    time_exponent: O(p) per curve tested (exhaustive census over the distinct-split stratum, reusing already-verified O(1)-per-instance classification).
    memory_exponent: O(1).
    best_known: Not applicable; no ECDLP complexity claim. Pollard rho (KN-OPEN-001) untouched.

  claim_boundary_and_test_boundary: >-
    Tests ONLY the D-term's own h_- contribution to the closed form, on
    the distinct-split (Z=3) stratum, at toy scale. Does NOT test the
    non-split strata (already named by the idea itself as future work,
    items i-ii in its own open directions). Does NOT make any relation-
    rate, cost, or exponent claim. A confirmed match strengthens but does
    not, by itself, prove the closed form for every curve; a mismatch is a
    complete, zero-tolerance falsification of the D-term's own specific
    form. Flags, but does not resolve, the idea's own disclosed cross-lane
    consequence for H-MONO-93bc4d's own collision-rate closure (whether
    ITS OWN F=(#E[4]-tau)/2 term is similarly a proxy for a fuller
    twist-dependent law) -- that is explicitly a separate, not-yet-ranked
    question, per the idea's own own_directions item (iii).

