hypothesis:
  id: H-ICEX-ce964e
  question_id: RQ-JINV-8fc13a
  source_idea_id: IDEA-20260811-6034d0
  title: >-
    REDUCIBILITY IS THE ONLY DEGENERATION FUNCTIONAL A SOLVER CHARGES FOR, AND THE
    PREDICTION IS NEGATIVE - with two corrections computed here- the
    elimination-degree ratio is width-zero by construction if the f_V-free
    elimination polynomial is the curve cubic, which the same 2-torsion derivation
    that fixes the singular locus predicts; and S_3 at b = 0 is IRREDUCIBLE by an
    explicit discriminant computation, so the source most-likely-to-fail prediction
    is settled analytically before any engine runs
  statement: >-
    (A) WHY REDUCIBILITY AND NOT SUPPORT. The lane committed anomaly is that a 23
    to 31 percent support drop at j = 0 and j = 1728 moves Groebner time by -0.44
    and -0.67 percent and moves gb_size the WRONG WAY by +3.41 percent. Support is a
    combinatorial shadow no standard solver charges directly. REDUCIBILITY IS
    DIFFERENT IN KIND- if S_m = F * G with both degrees positive, the decomposition
    variety is a union of components and every Groebner, resultant and homotopy
    method pays for the total degree of the component it is on. A REPEATED factor
    makes the ideal non-radical, changing the Groebner behaviour independently of
    degree. A DROP IN THE ELIMINATION POLYNOMIAL DEGREE is a direct reduction of the
    final univariate solve.
    (B) THE PRE-REGISTERED PREDICTION, WHICH IS NEGATIVE. S_3 is irreducible over
    the algebraic closure of QQ(a,b) and remains irreducible at a = 0 and at b = 0;
    S_4 likewise at all six weight-12 loci. No locus produces a factorisation, a
    repeated factor, or a drop in the elimination degree. Basis- the loci were
    located by COEFFICIENT VANISHING, and irreducibility is generic in any fixed
    support class, so a specialisation chosen for an unrelated reason lands in the
    reducible closed set with probability zero.
    (C) THE FIRST CORRECTION, COMPUTED HERE- ONE CANDIDATE IS ALREADY SETTLED. The
    source names a = 0 and b = 0 as its a priori candidates because both carry a
    finite group action. FOR b = 0 THE ANSWER FOLLOWS FROM A TWO-LINE COMPUTATION.
    With S_3 = (x1-x2)^2 x3^2 - 2((x1+x2)(x1 x2 + a) + 2b) x3
    + ((x1 x2 - a)^2 - 4 b (x1+x2)) and b = 0, S_3 is a quadratic in x3 whose
    discriminant over four is
      [(x1+x2)(x1 x2 + a)]^2 - (x1-x2)^2 (x1 x2 - a)^2
      = [(x1+x2)(x1 x2 + a) - (x1-x2)(x1 x2 - a)]
        * [(x1+x2)(x1 x2 + a) + (x1-x2)(x1 x2 - a)]
      = [2 x1 (x2^2 + a)] * [2 x2 (x1^2 + a)]
      = 4 x1 x2 (x1^2 + a)(x2^2 + a).
    THAT PRODUCT IS SQUAREFREE IN F_p[x1, x2] whenever a is nonzero, so it is NOT A
    SQUARE, so S_3 RESTRICTED TO b = 0 IS IRREDUCIBLE AS A POLYNOMIAL IN x3 OVER
    F_p[x1, x2]. THE SOURCE PREDICTION MOST LIKELY TO FAIL IS THEREFORE PREDICTED
    TO HOLD, BY DERIVATION RATHER THAN BY GUESS, and the contract machine-verifies
    the identity rather than trusting it. This is a strengthening- it converts a
    named candidate into a checkable statement.
    (D) THE SECOND CORRECTION, WHICH IS A BAND-DEGENERACY FINDING. The source
    pre-registers the elimination-polynomial degree ratio as EXACTLY 1.000 at all
    eight loci, treating a drop below 1 as the one escalation-worthy outcome.
    DEC-20260810-d70ece records the five-curve lead that the f_V-free elimination
    ideal was generated by the curve OWN CUBIC, with splitting types [1,1,1] and
    [1,2]. IF THAT HOLDS, THE ELIMINATION POLYNOMIAL IS x^3 + a x + b AT EVERY
    CURVE, ITS DEGREE IS 3 EVERYWHERE, AND THE RATIO IS 1.000 BY CONSTRUCTION- A
    BAND OF WIDTH ZERO THAT NO ALTERNATIVE CAN CROSS. The same derivation that
    fixes the singular locus explains why- the f_V-free Jacobian system cuts out
    the six permutations of the roots of the curve cubic, whose one-variable
    elimination ideal is exactly that cubic. THE CONTRACT THEREFORE MAKES THIS A
    BLOCKING FIRST GATE- determine whether the m = 3 f_V-free elimination polynomial
    IS the curve cubic. IF IT IS, THE ELIMINATION-DEGREE ARM IS RECORDED AS A PROOF
    (ratio identically 1, carrying no j-line content) AND IS NOT RUN AS AN ARM. The
    surviving discriminators are the FACTORISATION TYPE OVER THE ALGEBRAIC CLOSURE
    and the SQUAREFREE-PART DEGREE.
    (E) THE MANDATORY STRATIFICATION. If the elimination polynomial does reduce to
    the curve cubic, its F_p-splitting type is a function of E(F_p)[2], which
    2-isogenies do not preserve, so it varies within an isogeny class for reasons
    with NO Semaev content and NO j-line content. STRATIFICATION ON
    r = the number of roots of x^3 + a x + b in F_p IS MANDATORY AND BLOCKING, and
    an unstratified elimination statistic may not be cited. DEC-20260810-d70ece NA7
    requires a successor to ANTICIPATE this before execution; this record does so
    here.
    (F) WHAT THIS DOES NOT DO. Even a positive is NOT an attack. Any consequent gain
    is charged against the automorphism-discounted rho baseline, where a factor at
    or below sqrt(6) is baseline calibration. Nothing transfers to the deployed
    f_V-bearing system, whose elimination degree is pinned by the factor-base size
    and not by the curve.
  mechanism: >-
    WHAT SPECIALISATION CAN DO. Specialising a polynomial to a subvariety of its
    coefficient space can only do three things to its factorisation type- nothing,
    split it, or make it non-reduced. Which occurs is decided by whether the
    specialisation lands in the DISCRIMINANT of the family, the locus where the
    Galois group of the generic fibre drops. The degeneration loci were found by a
    completely different criterion - a block of coefficients sharing a factor - so a
    priori they have no reason to lie in that discriminant, which is why the
    prediction is negative.
    WHERE A REASON EXISTS. An invariant or relative invariant of a finite group
    action on a polynomial ring is frequently a product over orbits, and j = 0 and
    j = 1728 carry such actions while the six weight-12 loci carry none. That is
    why the two CM points are the a priori candidates and the six are expected to be
    inert - and the computation in statement (C) SETTLES b = 0 in the negative
    direction before any engine runs, leaving a = 0 as the single live candidate.
    WHY THE ELIMINATION ARM NEEDS A GATE RATHER THAN A BAND. A ratio pre-registered
    at exactly 1.000 is only a test if the denominator can move. If the f_V-free
    elimination polynomial is the curve cubic at every curve, the numerator and
    denominator are both 3 identically and the statistic is constant BY
    CONSTRUCTION. Determining that first, cheaply, converts a dead arm into a
    recorded proof and frees the budget for the arms that can move.
    WHY THE PLANTED SPLIT IS THE VALIDITY ARGUMENT. Every negative in this record is
    an assertion that a search found nothing. A constructed polynomial that factors
    ONLY on a chosen weight-12 locus, with a KNOWN factorisation type, is the only
    object for which the correct answer is available in advance, so it is the only
    object on which the search can be shown to work.
  assumptions:
    - >-
      The degeneration loci are as catalogued in IDEA-20260811-a7c1df; re-derived as
      the first gate rather than assumed.
    - >-
      Factorisation over QQ(a,b) specialised to a locus is computed via a RATIONAL
      PARAMETRISATION of the locus that AVOIDS ITS SINGULAR POINT; the
      parametrisation is declared before execution, because hitting the singular
      point fabricates a degeneration.
    - >-
      The elimination polynomial is computed from the f_V-FREE system, since the
      f_V-bearing elimination degree is pinned by the factor-base size and not by
      the curve. Both are reported and ONLY the f_V-free one is a curve functional.
    - >-
      UNITS. Factorisation type is a MULTISET OF INTEGER DEGREES. The elimination and
      squarefree-part ratios are DEGREE OVER DEGREE and are dimensionless. NO TIME IS
      MEASURED AND NO COST IS CLAIMED; wall-clock is recorded for budget only.
    - >-
      A factorisation appearing only modulo some p is a CHARACTERISTIC-SPECIFIC
      EVENT, is labelled as one, and does not falsify the characteristic-zero
      statement.
  proof_search_map:
    bottleneck: >-
      The final univariate solve and the component structure of the decomposition
      variety. A split there changes the cost of relation collection; nothing else
      in this record would. NOTE, AFTER THE DERIVATION IN STATEMENT (D)- if the
      f_V-free elimination polynomial is the curve cubic, the final univariate solve
      is a cubic at every curve and that half of the bottleneck is CONSTANT, which is
      why the gate comes first.
    baseline_embedding:
      parameter_slice: >-
        The generic curve. S_3 and S_4 must be reported irreducible over the
        algebraic closure of QQ(a,b) with the known per-variable degrees, and the
        f_V-free elimination polynomial must have its generic degree.
      reproduction_check: >-
        A symbolic irreducibility certificate for generic S_3 in TWO independent
        engines, the elimination degree checked against the dense Bezout bound, and
        - ADDED BY THIS RECORD - machine verification of the discriminant identity
        in statement (C), namely that the discriminant over four of S_3 at b = 0 is
        4 x1 x2 (x1^2 + a)(x2^2 + a). A frozen fixture records all three.
    observation_collision:
      observable: >-
        The multiset of irreducible factor degrees of S_m, plus the elimination
        polynomial degree and its F_p-splitting type.
      distinct_preimage_search: >-
        PERFORMED AND POSITIVE IN A WAY THAT MATTERS. The F_p-SPLITTING TYPE of the
        elimination polynomial is NOT a j-line function- it depends on the rational
        2-torsion, which differs between twists and varies inside an isogeny class.
        So that observable has distinct preimages on both sides of any class or j
        conclusion, and reading a splitting-type difference as a degeneration effect
        would be exactly the error the committed decision warned against. THE
        SEPARATING CONDITION IS MANDATORY STRATIFICATION ON r. SEPARATELY, THE
        ELIMINATION DEGREE ITSELF MAY HAVE A SINGLE PREIMAGE - 3, AT EVERY CURVE -
        WHICH IS THE WIDTH-ZERO PROBLEM THE GATE IN STATEMENT (D) TESTS FOR.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Track the full factorisation type over the ALGEBRAIC CLOSURE, including
          multiplicities and the field of definition of each factor, rather than the
          Boolean -is it irreducible-. The stronger state is what survives
          specialisation and what distinguishes a genuine split from a base-field
          artifact.
        predicted_gain: >-
          Distinguishes -S_m factors- from -S_m factors only after a field
          extension-, which is the difference between a usable split and a
          curiosity, at no extra compute.
      - transform: specialization_pack
        proposed_object: >-
          Replace the elimination-degree ratio arm by a BLOCKING GATE that first
          determines whether the f_V-free elimination polynomial is the curve cubic,
          and records the arm as a PROOF rather than running it if so.
        predicted_gain: >-
          Removes an arm whose statistic is constant by construction and frees the
          budget for the factorisation-type and squarefree-part arms, which can move.
    quantifier_order: >-
      FOR ALL eight loci L and FOR ALL m in {3, 4}, S_m restricted to L is
      irreducible over the algebraic closure of the function field of L. The
      existential that would break it may depend on m and on the locus but NOT on p,
      since the loci and the coefficients are defined over QQ; a factorisation
      appearing only modulo some p is recorded as a characteristic-specific event
      and does not falsify the characteristic-zero statement. AT b = 0 THE UNIVERSAL
      HALF IS ALREADY DERIVED IN STATEMENT (C) AND THE CONTRACT VERIFIES RATHER THAN
      TESTS IT.
    method_ceiling:
      strongest_certifiable_claim: >-
        A complete factorisation type table for S_3 and S_4 at all eight loci, with
        multiplicities, fields of definition and squarefree-part degrees, over QQ
        and over two named F_p. IT CANNOT CERTIFY A COST CONSEQUENCE- even a
        positive would require an end-to-end charged comparison against the
        automorphism-discounted baseline before any cost claim, and this record
        refuses to make one.
      nearby_object_control: >-
        A POLYNOMIAL DESIGNED TO FACTOR ON A LOCUS. Construct F * G whose product
        has the same support as S_4 generically and whose factorisation is visible
        only on a chosen weight-12 locus, with a KNOWN factorisation type. The
        method must find that split. IF IT CANNOT, EVERY IRREDUCIBILITY NEGATIVE IT
        REPORTS IS VOID.
    proof_obligations:
      - claim: Generic S_3 and S_4 are irreducible over the algebraic closure
        responsibility: baseline
      - claim: >-
          The discriminant identity at b = 0 is 4 x1 x2 (x1^2 + a)(x2^2 + a) and is
          squarefree, hence S_3 at b = 0 is irreducible
        responsibility: correctness
      - claim: No locus induces a factorisation or a repeated factor
        responsibility: feasibility
      - claim: >-
          The elimination-degree arm is gated on whether the f_V-free elimination
          polynomial is the curve cubic, and recorded as a proof rather than run if
          it is
        responsibility: scope
      - claim: A planted split of known type is detected
        responsibility: interface
      - claim: Splitting-type variation is attributed to r, not to the locus
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-FACT-1
      formal_statement: >-
        Irreducibility is generic in a fixed support class- for a fixed monomial
        support the reducible polynomials form a proper closed subvariety of the
        coefficient space, so a specialisation chosen for an unrelated reason lands
        in it with probability zero.
      random_model_justification: >-
        RIGOROUS INGREDIENT- reducibility is a Zariski-closed condition on
        coefficients, cut out by resultant and Noether forms. THE HEURISTIC PART IS
        ONLY that the degeneration loci are -unrelated- to that closed set, which is
        exactly what the experiment tests. The classical statement imitated is
        Hilbert irreducibility.
      supporting_results:
        - ref: IDEA-20260811-a7c1df
          provenance: internal
          claim: >-
            VERBATIM- the S_4 stratification into blocks carrying a (248), b (214),
            a^3+8b^2 (48), -a^3+8b^2 (36), -a^3+12b^2 (6), 3a^3+32b^2 (6),
            a^3+6b^2 (4), 5a^3+48b^2 (1); the closed-form dictionary
            j = 1728 * (-4 beta)/(27 alpha - 4 beta) for a weight-12 locus; and that
            S_3 HAS NO WEIGHT-12 COEFFICIENT FACTOR, so the six weight-12 loci first
            appear at m = 4.
          verified_by: >-
            coordinator, TASK-20260904-65b023 - IDEA-20260811-a7c1df read in full
            this task, 459 lines.
        - ref: IDEA-20260807-5ddccf
          provenance: internal
          claim: >-
            VERBATIM- the explicit form
            S_3 = (x1-x2)^2 x3^2 - 2((x1+x2)(x1 x2 + a) + 2b) x3
            + ((x1 x2 - a)^2 - 4 b (x1+x2)), and the two semi-invariance
            biconditionals - at a = 0 every monomial has total degree congruent to
            1 mod 3, holding IFF a = 0; at b = 0 every monomial has even total
            degree, holding IFF b = 0. THE EXPLICIT FORM IS WHAT THE DISCRIMINANT
            COMPUTATION IN STATEMENT (C) IS PERFORMED ON.
          verified_by: >-
            coordinator, TASK-20260904-65b023 - PARTIAL READ, DECLARED (claim (A)
            and mechanism blocks read verbatim; the remainder not opened).
      validation_experiment_ids:
        - EXP-ICEX-25effe
      falsification_condition: >-
        A random weight-12 locus in the null arm produces a factorisation.
        Specialisation is generically splitting the polynomial, the eight loci are
        not special, and the framing collapses and must be rewritten.
    - id: HEUR-FACT-2
      formal_statement: >-
        A polynomial that is a relative invariant of a finite group action on the
        variables is more likely than a generic polynomial of its support to factor
        into orbit products.
      random_model_justification: >-
        The mu_3 and sign invariances at a = 0 and b = 0 are DERIVED with
        biconditionals in IDEA-20260807-5ddccf. The link from invariance to
        factorisation is classical invariant theory but is NOT a theorem in general
        and is labelled heuristic. NOTE THAT THE b = 0 HALF IS NOW SETTLED IN THE
        NEGATIVE BY THE DISCRIMINANT COMPUTATION IN STATEMENT (C), so this heuristic
        survives only at a = 0, which is the single remaining a priori candidate.
      supporting_results:
        - ref: IDEA-20260807-5ddccf
          provenance: internal
          claim: >-
            The mu_3 relative invariance at a = 0 and the sign invariance at b = 0,
            each derived with a biconditional on the coefficient.
          verified_by: >-
            coordinator, TASK-20260904-65b023 - PARTIAL READ, DECLARED (claim (A)
            and mechanism blocks read verbatim).
      validation_experiment_ids:
        - EXP-ICEX-25effe
      falsification_condition: >-
        S_3 at a = 0 is found irreducible over the algebraic closure, as at b = 0.
        The group actions are factorisation-inert, the last a priori candidate is
        closed, and the negative composes into a genuine closure of the
        component-structure axis.
  structural_ingredients:
    - description: >-
        The degeneration-divisor catalogue supplying the eight loci, the closed-form
        j dictionary, the S_4 block stratification, and the fact that S_3 has no
        weight-12 coefficient factor.
      citation: IDEA-20260811-a7c1df
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-65b023 - read in full this task, 459 lines.
      role: the locus catalogue this record re-derives as its first gate
    - description: >-
        The explicit form of S_3 and the two semi-invariance biconditionals. THE
        EXPLICIT FORM IS WHAT THE DISCRIMINANT COMPUTATION IN STATEMENT (C) ACTS ON,
        so this record depends on it verbatim rather than on a paraphrase.
      citation: IDEA-20260807-5ddccf
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-65b023 - PARTIAL READ, DECLARED (claim (A) and
        mechanism blocks read verbatim; the remainder not opened).
      role: the polynomial the b = 0 derivation acts on, and the basis of HEUR-FACT-2
    - description: >-
        The decision recording the five-curve elimination lead as NON-EVIDENCE, its
        splitting types [1,1,1] and [1,2], the requirement that a successor
        anticipate the reduction to the curve cubic BEFORE execution, and the
        adjudication binding future citation of the S_4 outlier.
      citation: DEC-20260810-d70ece
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-65b023 - read in full this task, 442 lines.
      role: >-
        the source of the elimination-degree width-zero risk and of the mandatory
        r-stratification
    - description: >-
        The automorphism-discounted rho baseline, under which any factor at or below
        sqrt(6) is baseline calibration and never an attack. RELAYED- this agent did
        NOT open knowledge/techniques/KN-TECH-018.md; the threshold is quoted from
        RQ-JINV-8fc13a decision_target, which this agent read in full.
      citation: KN-TECH-018
      provenance: recalled
      verified_by: null
      role: the comparator any consequent gain would be charged against; none is claimed
  reduction_chain:
    core_problem: >-
      Whether the summation polynomials acquire a factorisation, a repeated factor,
      or a drop in the f_V-free elimination degree on their own j-line degeneration
      divisor.
    corollaries:
      - problem: >-
          Whether the component-structure axis of the degeneration lane is closed
          with a named obstruction.
        reduction_ref: >-
          Internal- no published reduction is cited. External literature was NOT
          checked for prior publication of the summation-polynomial factorisation
          question, so the outcome may already be known.
        asymptotics_preserved: >-
          Not applicable. Even a genuine split of degree d1 + d2 = d would be a
          CONSTANT-FACTOR consequence in the decomposition solve, not an exponent,
          and this record commits in advance to reporting it as a constant.
  predictions:
    - metric: >-
        P1- irreducibility of S_3 at b = 0 over the algebraic closure
      direction: different
      minimum_effect: >-
        IRREDUCIBLE, AND THE REASON IS DERIVED RATHER THAN GUESSED. The
        discriminant over four is 4 x1 x2 (x1^2 + a)(x2^2 + a), squarefree for
        nonzero a, hence not a square, hence the quadratic in x3 does not split over
        F_p[x1, x2]. THE CONTRACT MACHINE-VERIFIES THE IDENTITY. If the machine
        computation disagrees with this identity, the derivation is wrong and it is
        the derivation that must be repaired first.
    - metric: >-
        P2- irreducibility of S_3 at a = 0 over the algebraic closure
      direction: different
      minimum_effect: >-
        IRREDUCIBLE. THIS IS NOW THE SINGLE REMAINING A PRIORI CANDIDATE, since
        b = 0 is settled by P1. A failure here is a pre-registered positive, not a
        surprise, and must be replicated in a second engine with the field of
        definition determined before it is described.
    - metric: >-
        P3- irreducibility of S_4 at the six weight-12 loci over the algebraic
        closure
      direction: different
      minimum_effect: >-
        IRREDUCIBLE AT ALL SIX. Six of six is the predicted outcome; any single
        factorisation is the interesting event, is unexplained by any group action,
        and must be replicated in a second engine before it is described.
    - metric: >-
        P4- ELIMINATION-DEGREE GATE- is the f_V-free m = 3 elimination polynomial
        equal to the curve cubic x^3 + a x + b?
      direction: different
      minimum_effect: >-
        A YES OR NO, DECIDED FIRST AND CHEAPLY. IF YES, THE ELIMINATION-DEGREE RATIO
        IS 1.000 BY CONSTRUCTION AT EVERY CURVE, THE ARM IS RECORDED AS A PROOF
        CARRYING NO j-LINE CONTENT, AND IT IS NOT RUN AS AN ARM. THE SOURCE
        PRE-REGISTERED RATIO OF EXACTLY 1.000 IS A WIDTH-ZERO BAND IN THAT CASE AND
        COULD NOT HAVE FIRED. If NO, the ratio arm runs with its generic degree
        established first.
    - metric: >-
        P5- squarefree-part degree ratio, locus over generic, per locus per m
        (dimensionless, degree over degree)
      direction: different
      minimum_effect: >-
        EXACTLY 1.000 AT ALL EIGHT LOCI. A repeated factor at a locus makes the
        ideal non-radical and changes the Groebner behaviour independently of degree,
        so this arm retains freedom even if P4 closes the elimination arm.
    - metric: >-
        P6- planted-split detection, with a KNOWN factorisation type
      direction: different
      minimum_effect: >-
        DETECTED, 1 OF 1, WITH THE CORRECT TYPE. A constructed polynomial whose
        factorisation type is {2, 2} in x3 on a chosen weight-12 locus and {4} off
        it. THE METHOD MUST RETURN {2, 2} ON THE LOCUS AND {4} OFF IT - a
        demonstrated separation of two distinct multisets. A MISS INVALIDATES EVERY
        NEGATIVE IN THIS RECORD.
    - metric: >-
        P7- null-locus factorisation types at ten random weight-12 loci
      direction: different
      minimum_effect: >-
        IRREDUCIBLE AT ALL TEN, confirming that irreducibility is the generic
        outcome of specialising to such a locus and that a positive at one of the
        eight would be meaningful. A factorisation at a random locus VOIDS every
        positive.
    - metric: >-
        P8- elimination splitting type, STRATIFIED ON r = the number of roots of
        x^3 + a x + b in F_p
      direction: different
      minimum_effect: >-
        REPORTED PER r-STRATUM, ALWAYS. AN UNSTRATIFIED ELIMINATION STATISTIC MAY
        NOT BE CITED. This is blocking, and it is the anticipation the committed
        decision requires a successor to make before execution.
    - metric: >-
        P9- engine agreement on every factorisation type
      direction: different
      minimum_effect: >-
        100 PERCENT between two independent factorisation engines. Note this is a
        genuinely available cross-check on this host, unlike graded Betti numbers.
        Disagreement means nothing is established until reconciled.
  test_boundary:
    instances:
      - >-
        Generic S_3 and S_4 over QQ(a,b) and over F_p(a,b) for p in {4001, one
        prime above 2^20}.
      - >-
        The eight degeneration loci- a = 0, b = 0 and the six weight-12 loci - each
        via a declared rational parametrisation avoiding its singular point.
      - >-
        C-NULL-LOCUS- ten random weight-12 loci not among the eight.
      - >-
        C-PLANT-SPLIT- a constructed polynomial with the same support as S_4
        generically whose factorisation type is {2, 2} only on a chosen weight-12
        locus and {4} off it.
      - >-
        The f_V-free m = 3 elimination polynomial at a generic curve and at one curve
        on each locus at p = 4001, stratified on r.
    parameters:
      m: '3 and 4'
      p: '4001 and one prime above 2^20; a split appearing only mod p is labelled characteristic-specific'
      loci: 'the eight, each with a declared rational parametrisation avoiding its singular point'
      engines: 'two independent factorisation engines, named in the manifest'
      formulation: 'f_V-free primary; the f_V-bearing elimination reported separately and never as a curve functional'
      stratification: 'r in {0, 1, 3}, the number of F_p-roots of the curve cubic'
    implementation: >-
      EXACT SYMBOLIC FACTORISATION. NO TIMING, NO SAMPLING, NO p-VALUE. This
      contract needs NO minimal free resolution and NO Betti table, so the backend
      precondition that paused the predecessor does not bind it - a deliberate design
      choice stated so the contract is dispatchable as it stands.
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 12.0
      maximum_memory_gb: 16
      maximum_runs: 30
  falsification_conditions:
    - >-
      F1. S_3 or S_4 is found REDUCIBLE at any of the eight loci over the algebraic
      closure. The prediction is falsified; replicate in the second engine, determine
      the field of definition, and only then consider whether any cost claim is even
      formulable.
    - >-
      F2. The machine computation disagrees with the discriminant identity
      4 x1 x2 (x1^2 + a)(x2^2 + a) at b = 0. THE DERIVATION IN STATEMENT (C) IS
      WRONG and must be repaired before anything else is read.
    - >-
      F3. THE ELIMINATION GATE RETURNS YES - the f_V-free elimination polynomial IS
