hypothesis:
  id: H-ECDLP-61032f
  question_id: RQ-RELN-001
  statement: >-
    The primary discrimination of the frozen GOAL-RELN-001 decomposition-
    probability protocol - measured p_exist(B) against the transcribed Semaev
    reference curve - is pinned by counting and cannot emit an informative
    positive. The first moment of the fibre-size function c_D(r) is fixed by a
    committed double count at mu = binomial(B+m-1, m)/N for EVERY factor base of
    size B, and the accounting identity cov = mu - (1/N)*sum_r (c_D(r)-1)^+
    confines coverage to [mu - conc/2, min(1, mu)]. The whole deviation is
    therefore carried by the normalized excess-collision mass
    Xi = conc/mu^2, whose value for a base modelled as B independent uniform
    elements of a prime-order group is EXACTLY 1 - 1/M with
    M = binomial(B+m-1, m). The hypothesis is that measured Xi for
    elliptic-curve factor bases equals that forced value plus an explicitly
    derived without-replacement correction, and that any residual beyond it is
    the only place in the entire p_exist measurement where a property of the
    elliptic curve can appear. Source proposal: IDEA-20260805-4ddd8c.
  mechanism: >-
    Let G be cyclic of prime order N, D a factor base of B distinct nonzero
    elements, m the decomposition length, c_D(r) the number of size-m multisets
    from D summing to r, and M = binomial(B+m-1, m). Fibres partition the
    domain, so sum_r c_D(r) = M and mu = M/N for every D. Splitting by whether a
    target is covered gives the exact accounting identity above. Writing
    X = sum_r c_D(r)(c_D(r)-1) as the number of ordered pairs of DISTINCT size-m
    multisets with equal sum, each such pair has difference vector
    e = 1_S - 1_S' nonzero with every coordinate of absolute value at most
    m < N; since N is prime, some e_j is invertible, so conditioning on the
    other coordinates the sum sum_j e_j d_j is uniform on G and the collision
    probability is exactly 1/N. Hence E[X] = M(M-1)/N, E[conc] = M(M-1)/N^2 and
    E[Xi] = 1 - 1/M exactly, with no asymptotics and no Poisson approximation.
    Distinctness of the base and exclusion of the identity contribute a
    correction of size O(B^2/N) which the contract derives explicitly rather
    than absorbing.
  assumptions:
    - >-
      That the frozen protocol transcription of the Semaev reference formula is
      faithful to its source. NOT VERIFIED by this design session; Stage 0 of
      the experiment tests it and a material difference is a declared
      falsification condition.
    - >-
      That the protocol p_exist is coverage over targets drawn near-uniformly
      from the whole group. If it is defined over a restricted target set the
      accounting identity still holds over that set but mu must be recomputed
      over it and the analysis redone. Recorded as a definitional risk, not
      resolved.
    - >-
      That the tested cells use prime-order groups. The exactness of E[Xi] uses
      N prime for invertibility of e_j; for composite N the argument gives 1/N
      only when some gcd(e_j, N) = 1, and the correction is derived in the
      contract rather than assumed away.
    - >-
      That the multiset convention is UNSIGNED throughout. Signed multisets and
      typed decompositions give different M, different mu and a different forced
      Xi; the convention is stated in every output row.
  proof_search_map:
    bottleneck: >-
      The step whose removal changes the protocol conclusion is the assumption
      that the observed agreement of p_exist with the reference curve carries
      elliptic-curve content. Under the accounting identity it carries only the
      second moment, so the bottleneck is whether Xi is also forced.
    baseline_embedding:
      parameter_slice: >-
        The old-method boundary is the Poisson coverage law 1 - exp(-mu), which
        the reference curve reduces to once q = p and Hasse are substituted.
        The instrument must reproduce that law from mu alone.
      reproduction_check: >-
        A frozen arithmetic gate. The committed coverage-ratio probe value
        1.1071, recorded independently in a prior red-team objection file at
        mu = 0.207195, must be reproduced as mu/(1 - exp(-mu)) = 1.107172 from
        arithmetic alone. If the instrument cannot reproduce a committed number
        from arithmetic, no negative result may be reported from it.
    observation_collision:
      observable: >-
        The pair (mu, Xi), the first two normalized moments of the fibre-size
        distribution of the multiset-sum map.
      distinct_preimage_search: >-
        PERFORMED AND THE COLLISION IS THE POINT. mu is provably constant across
        all bases of size B, so its preimage is everything and it carries zero
        information about D. Xi is not recoverable from mu and takes three
        provably different values on three constructible bases of the same size
        (0 for a Sidon base, 1 - 1/M for a uniform base, far above 1 for a
        small-multiples base), which is a demonstration of nonzero comparator
        spread rather than an assertion of one.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Xi = conc/mu^2 as the protocol primary metric, replacing p_exist.
        predicted_gain: >-
          p_exist at fixed (B, m, N) has total admissible dynamic range at most
          min(1,mu)/(1-exp(-mu)) <= 1.582; Xi separates 0 from values above 100
          on constructible bases at matched size, on the same enumeration.
    quantifier_order: >-
      FOR ALL tested cells (B, m, N) and FOR ALL uniformly drawn bases of size B,
      the sample mean of Xi over the declared number of bases lies within the
      derived band around 1 - 1/M plus the derived distinctness correction. The
      existential that breaks it is THERE EXISTS a cell at which the
      elliptic-curve factor base departs from that band.
    method_ceiling:
      strongest_certifiable_claim: >-
        That at the tested toy cells, under the unsigned convention, the p_exist
        ladder is forced by (B, m, N) up to a single second-moment residual. It
        CANNOT certify anything about index-calculus complexity, about
        cryptographic scale, or about any Semaev complexity claim.
      nearby_object_control: >-
        The Bose-Chowla Sidon base, where Xi must be exactly 0, and the
        small-multiples base, where Xi must exceed a combinatorially precomputed
        value. Two nearby objects on which the instrument must fire in opposite
        directions.
    proof_obligations:
      - claim: mu = M/N exactly for every base of size B
        responsibility: baseline
      - claim: E[Xi] = 1 - 1/M exactly under the independent-uniform model
        responsibility: correctness
      - claim: The without-replacement correction is derived, not bounded
        responsibility: size
      - claim: The Sidon arm returns Xi exactly 0
        responsibility: interface
      - claim: The measured residual, if any, is attributable to the curve rather than to the index set
        responsibility: scope
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-XI-1
      formal_statement: >-
        For B independent uniform draws d_1..d_B from a group of prime order N
        and any m with m < N, the expectation of Xi = conc/mu^2 over the draw is
        exactly 1 - 1/M with M = binomial(B+m-1, m). This is an identity, not a
        distributional assumption, and it is stated here so that the record
        makes explicit that its central number is unconditional.
      random_model_justification: >-
        Not needed as a heuristic. The step is elementary: for a nonzero integer
        vector e with all coordinates of absolute value below N and N prime,
        sum_j e_j d_j is uniform on G when the d_j are independent uniform.
      supporting_results:
        - >-
          Internal, committed: the first-moment conservation identity
          mean_r c_D(r) = binomial(B+m-1, m)/N, recorded in this program as
          KN-FIND-007 and its supporting experiment. Read by this design session
          only through its committed title line, not through its derivation
          file; the contract Stage 1 re-derives it rather than relying on the
          summary.
      validation_experiment_ids:
        - EXP-ECDLP-b67953
      falsification_condition: >-
        Exact enumeration returns a sample mean of Xi outside the derived band
        at a cell whose base was drawn uniformly from the abstract group. That
        would refute the identity itself, which would be an arithmetic error and
        must stop the line at zero further cost.
    - id: HEUR-XI-2
      formal_statement: >-
        EXCHANGEABILITY. For the tested (B, N, m), a factor base formed from
        points of a prime-order elliptic curve with x-coordinates in a
        prescribed subset of F_p behaves, with respect to the second moment of
        the multiset-sum fibre distribution, like a uniformly random subset of
        the group of the same size.
      random_model_justification: >-
        NONE OFFERED, AND THIS IS THE RECORD'S WEAKEST LINK, STATED AS SUCH. The
        usual appeal is that the map from x-coordinate to group element is
        unstructured, which is exactly the folklore this program exists to test
        rather than to assume. It is therefore not assumed here: it is the
        hypothesis under test, and the experiment is designed to detect its
        failure.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-b67953
      falsification_condition: >-
        The elliptic-curve arm departs from the derived band at any cell while
        the matched uniform arm stays inside it. That failure is a first-class
        result and the single most interesting outcome this design can produce,
        because it would be the first curve-specific content found in the
        p_exist measurement.
  structural_ingredients:
    - description: >-
        First-moment conservation for the multiset-sum map - the mean fibre size
        is binomial(B+m-1, m)/N for every factor base of size B, so factor-base
        geometry cannot change mean yield, only redistribute it.
      citation: knowledge/findings/KN-FIND-007.md
      provenance: internal
      verified_by: >-
        NOT FULLY VERIFIED BY THIS SESSION. The Coordinator subagent under
        TASK-20260904-43152a read only the committed title line of
        knowledge/findings/KN-FIND-007.md by pattern search - "Decomposition-
        yield conservation - factor-base geometry cannot change mean yield, only
        redistribute it" - and did NOT open its derivation file
        experiments/EXP-FB3-001/conservation.md. The numeric claims the source
        proposal attributes to that derivation (144 cells, maximum absolute
        deviation exactly 0) are taken from the proposal's summary and are NOT
        independently confirmed here. Stage 1 of EXP-ECDLP-b67953 re-derives the
        identity from scratch rather than relying on this entry.
      role: >-
        Fixes the first moment, which is what forces the p_exist ladder and
        leaves the second moment as the only free coordinate.
  reduction_chain:
    core_problem: >-
      What the frozen decomposition-probability protocol can and cannot detect
      about an elliptic-curve factor base.
    corollaries: []
  predictions:
    - metric: >-
        Xi_random = conc/mu^2 (dimensionless), by exact enumeration over ALL N
        targets, for uniformly drawn factor bases of size B on toy prime-order
        curves at m = 3
      direction: different
      minimum_effect: >-
        Forced value derived before any run: E[Xi] = 1 - 1/M with
        M = binomial(B+2, 3), plus a distinctness correction of size O(B^2/N)
        derived exactly in the contract. Pass band: the mean of Xi over the
        declared number of independent bases per cell lies within three standard
        errors of that value. A deviation outside the band at any cell falsifies
        the independent-uniform model FOR ELLIPTIC-CURVE FACTOR BASES.
    - metric: 'Xi_Sidon for a Bose-Chowla base at matched B (dimensionless)'
      direction: lower
      minimum_effect: >-
        Exactly 0, with zero tolerance, by definition of a Sidon set of the
        relevant order. Any nonzero value means the constructed base is not
        Sidon and invalidates the arm rather than the hypothesis.
    - metric: >-
        coverage ratio of the Sidon arm to the matched random arm, against the
        pre-derived ceiling mu/(1 - exp(-mu)) (dimensionless)
      direction: different
      minimum_effect: >-
        Equal to mu/(1 - exp(-mu)) within the sampling band, and at the
        committed probe point mu = 0.207195 equal to 1.107172, matching the
        committed 1.1071 to the printed precision. THIS IS A REPRODUCTION GATE
        ON THE INSTRUMENT, NOT A RESULT.
    - metric: 'Xi_small_multiples for the base {P, 2P, ..., BP} (dimensionless)'
      direction: higher
      minimum_effect: >-
        Above 100 at every rung, with the exact value computed combinatorially
        BEFORE the run from the count of ordered pairs of 3-multisets of
        {1..B} with equal sum, divided by mu^2 * N^2 and entered into the
        contract at freeze time. A measured value differing from it by more than
        one part in 10^6 is an implementation fault, not a finding.
    - metric: >-
        monotonicity of Xi across the graded mixing ladder at fractions
        f in {0, 1/4, 1/2, 3/4, 1} between the Sidon and small-multiples
        geometries (dimensionless)
      direction: higher
      minimum_effect: >-
        Strictly increasing in f at every rung, at every tested N. A
        non-monotone ladder localizes the failure to a specific mixing fraction
        instead of leaving a bare negative.
    - metric: >-
        dynamic range of p_exist at fixed (B, m, N) across all measured
        geometries, as max(p_exist) over min(p_exist over non-degenerate arms)
        (dimensionless)
      direction: lower
      minimum_effect: >-
        The upper end is bounded pre-run by min(1,mu)/(1 - exp(-mu)) <= 1.582.
        If any arm exceeds 1.582 the accounting identity is violated and the
        measurement is invalid, not interesting.
  test_boundary:
    instances:
      - 'Toy prime-order elliptic curves at N in {2^14, 2^16, 2^18}, optionally one cell at 2^20.'
      - 'Matched uniform random subsets of the abstract cyclic group Z/NZ at the same N and B.'
      - 'Bose-Chowla Sidon bases and small-multiples bases at matched B, on both objects.'
    parameters:
      m: 3
      N_values: '2^14, 2^16, 2^18 (optional 2^20)'
      B_rungs: '30 at 2^14, 42 at 2^16, 50 at 2^18'
      bases_per_cell: 200
      multiset_convention: unsigned
    implementation: >-
      Pure Python with numpy only. Exact integer enumeration of multiset sums
      into an array of N counters. No computer-algebra system is required and
      none is assumed present.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 3
      maximum_memory_gb: 8
      maximum_runs: 5
  falsification_conditions:
    - >-
      Measured mean Xi for the matched random ELLIPTIC-CURVE arm lies outside
      the pre-declared band around 1 - 1/M at any cell. The independent-uniform
      model for elliptic-curve factor bases is then wrong at that scale, the
      identification of the reference curve as forced no longer follows, and the
      p_exist arm regains genuine content. This hypothesis would be WRONG in the
      most useful possible direction and the record must say so plainly.
    - >-
      The Sidon arm does not return Xi exactly 0. Instrument fault; no negative
      may be reported from any arm.
    - >-
      Stage 1 fails to reproduce 1.107172 from mu = 0.207195, or fails to
      reproduce the committed cell means from binomial(B+2,3)/N. The derivation
      is wrong and the line stops at zero compute.
    - >-
      The transcribed reference formula is materially different from its actual
      source text. The identification must be redone against the real text.
    - >-
      The frozen protocol p_exist turns out to be defined over a restricted
      target set in a way that breaks the accounting identity. The analysis must
      be redone over that set.
    - >-
      The curve-free matched arm over Z/NZ reproduces the elliptic-curve arm's
      Xi at every cell. Nothing measured may then be quoted as a statement about
      elliptic curves or the ECDLP.
  interpretation_limits:
    - >-
      This closes NOTHING about the ECDLP, about index calculus, or about any
      external complexity claim. It is a statement about what one measurement in
      one frozen protocol can and cannot detect.
    - >-
      A confirmation supports a SCOPED no-go on the p_exist ladder only, at the
      tested toy cells, under the unsigned convention, and explicitly does not
      support "the relation-supply question is closed" or "factor-base size does
      not matter".
    - >-
      No status change to any existing record is proposed. The frozen protocol
      remains as committed; superseding or amending it is a Coordinator decision
      and nothing here performs one.
    - >-
      Toy tier throughout, N at most 2^18 with an optional 2^20 cell. NOT
      TESTABLE AT REACHABLE SCALE: exact enumeration needs an array of N
      counters and Theta(M) multiset sums per base, so cryptographic N is
      unreachable by this method by many orders of magnitude. The claim that Xi
      remains at its forced value at cryptographic scale is NOT tested here and
      is not asserted; the contract reports a slope in log2(N) over at most four
      rungs and states that a four-point slope is not an asymptotic result.
    - >-
      The reference-formula identification rests on a second-hand transcription
      until Stage 0 obtains the source text. If the source cannot be obtained,
      the record must say so rather than presenting the transcription as
      verified.
  status: proposed
  proposed_by: coordinator
  source_refs:
    - ledger/proposals/IDEA-20260805-4ddd8c.yaml
    - ledger/questions/RQ-RELN-001.yaml
    - ledger/goals/GOAL-RELN-001.yaml
    - knowledge/findings/KN-FIND-007.md
    - experiments/EXP-ECDLP-b67953/specification.yaml
