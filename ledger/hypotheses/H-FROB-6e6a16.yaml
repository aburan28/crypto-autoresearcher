  title: >-
    The genus-2 Jacobian ceiling over F_2 is 33
  statement: >-
    Twelve squared times 2 is 288. Sixteen squared is 256, and 288 is
    32 above 256. Seventeen squared is 289, and 288 is 1 below 289.
    So 17 plus 12 times the square root of 2 lies strictly between 33
    and 34, and the written ceiling is 33. Four squared times 2 is 32.
    Twenty-five is 7 below 32, and 36 is 4 above 32, so 4 times the
    square root of 2 lies strictly between 5 and 6. Three plus 5 is 8,
    and 8 is not 33. Degrees 0 through 3 are 4 coefficients and degrees
    0 through 6 are 7 coefficients. Their sum is 11, and 2 to the 11
    is 2048. Nine minus 6 is 3.
  mechanism: >-
    The proposal prices a genus-2 rational Jacobian by the real bound
    (1 plus the square root of 2) to the fourth, and it counts 2048
    coefficient pairs. This contract checks those integers. It does
    not enumerate a curve and it does not compute an eliminant.
