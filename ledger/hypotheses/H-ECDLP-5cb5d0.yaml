hypothesis:
  id: H-ECDLP-5cb5d0
  question_id: RQ-ECDLP-002
  statement: >-
    Formalises IDEA-20260808-b8e2d4, AS A VACUITY AUDIT, BECAUSE ITS CENTRAL
    PREDICTION IS TRUE BY CONSTRUCTION AND MEASURES NOTHING. The source
    proposes a full-point oracle O_full : S -> E(F_p) used ALGEBRAICALLY,
    query m points, form R = a_1 P_1 + ... + a_m P_m, and check whether R
    decomposes over a factor base V. Its headline prediction is that VARIANT 2,
    where the oracle returns points of V, yields
    Y_full / Y_exhaust = (m! N) / B^m, about 600 at p = 101 and B = 10, and its
    nominated falsifier is "VARIANT 2 yields ratio < 10".
    THAT FALSIFIER WOULD BE A CONTRADICTION. Under VARIANT 2 the algorithm
    constructs R as a sum of m elements of V and then asks whether R is a sum of
    m elements of V. It is, always, with probability exactly 1, and observing
    otherwise would mean a sum of three elements of V is not a sum of three
    elements of V. The predicted ratio fires with certainty for every p, B and
    m, and no observation can move it.
    THE PRODUCED OBJECT IS ALSO USELESS, WHICH IS THE REAL FINDING. The
    "relation" VARIANT 2 returns is the tautology
    P_1 + P_2 + P_3 = P_1 + P_2 + P_3. It contributes EXACTLY ZERO to the rank
    of the relation matrix over the factor-base logarithm unknowns, so it
    advances no index calculus. VARIANT 1, a uniform random point oracle,
    returns points of unknown logarithm, so a decomposition of the constructed R
    introduces one new unknown alongside one new equation and again contributes
    exactly zero net rank.
    WHAT THIS RECORD THEREFORE CLAIMS, and what the contract measures.
    (V1) rank contribution per oracle query is exactly 0.000 for VARIANT 1 and
    for VARIANT 2, and the verified-solve rate for both is exactly 0.000.
    (V2) The only variant with a nonzero rank contribution is one whose oracle
    returns points of KNOWN logarithm, O(i) = [i]P. That is not an oracle at
    all, it is ordinary scalar multiplication, and it is precisely the
    public-scalar factor base already under test in this batch as
    EXP-ECDLP-e7f6e4 under H-ECDLP-a4c9c1. The three-variant taxonomy therefore
    collapses to one live object that is being tested elsewhere.
    (V3) Both (V1) and (V2) hold identically in (Z/N, +), so the closure is a
    statement about index calculus in cyclic groups and not about elliptic
    curves. That generality strengthens the closure rather than weakening it,
    and is pre-stated as the expected reading.
  mechanism: >-
    An index-calculus relation is only useful if it constrains the logarithm
    unknowns. A relation among factor-base elements constrains the factor-base
    logarithms; a relation involving a masked target with known coefficients
    constrains the target logarithm. An oracle that returns points carries no
    logarithms with it, so every point it supplies is either already in the
    factor base, in which case the constructed sum is a tautology of rank 0, or
    outside it with an unknown logarithm, in which case each new equation is
    paid for with a new unknown. The mechanism the source proposes is therefore
    blocked not by any measured effect but by an accounting identity, and the
    experiment's job is to demonstrate that the accounting identity is what the
    instrument reports, on an instrument that has been shown able to report a
    nonzero value.
  assumptions:
    - >-
      E is a prime-field short-Weierstrass curve with a prime-order subgroup
      G = <P> of order N about p, hygiene-screened with a factored group order
      and an explicit "#E(F_p) != p" check.
    - >-
      V is a random subset of E(F_p) of size B chosen independently of the
      oracle queries.
    - >-
      The oracle is exact. Its cost is charged where a cost is reported, and
      the record does not rest on it being free.
    - >-
      Rank is computed over the factor-base logarithm unknowns modulo N, by an
      exact integer routine, and every new unknown introduced by a
      non-factor-base point is counted as an unknown.
  proof_search_map:
    not_applicable_reason: >-
      This is a vacuity audit at toy scale. The derivational component, that a
      constructed sum of factor-base elements is a rank-0 tautology, is stated
      in full in the statement above and is not a proof-oriented research
      programme requiring a search map.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        For a random target R and a random factor base V of size B, the
        probability that R decomposes over V at arity m is B^m / (m! N) up to
        1 + o(1), assuming the subset sums of V behave like independent uniform
        elements of Z/N.
      random_model_justification: >-
        The classical occupancy model. The union bound supplies B^m / (m! N) as
        an upper bound with no independence assumption; the heuristic is
        tightness.
      supporting_results:
        - Union bound, elementary and internal.
      validation_experiment_ids:
        - EXP-ECDLP-4617dc
      falsification_condition: >-
        The measured decomposition fraction on the known-logarithm control arm
        deviates systematically from B^m / (m! N) beyond the sampling interval
        at the largest B.
  structural_ingredients:
    - description: >-
        Source proposal. The full-point oracle used algebraically, its three
        variants, and the VARIANT 2 exponentially-large-advantage prediction
        that this record identifies as true by construction.
      citation: IDEA-20260808-b8e2d4
      provenance: internal
      verified_by: >-
        TASK-20260904-c063e5 coordinator. Full read of
        ledger/proposals/IDEA-20260808-b8e2d4.yaml, 353 lines, Read tool,
        2026-09-04.
      role: originating claim, audited here
    - description: >-
        The rejected x-oracle MITM yield hypothesis, status "rejected", whose
        committed data recorded Y_A equal to Y_B exactly in every one of 40
        configurations.
      citation: H-XOR-d1a480
      provenance: internal
      verified_by: >-
        TASK-20260904-c063e5 coordinator. Full read of
        ledger/hypotheses/H-XOR-d1a480.yaml, 103 lines, Read tool, 2026-09-04.
      role: the obstruction the source proposal claims to avoid
    - description: >-
        reject_scoped on H-XOR-d1a480, recording Y_A_mean = Y_B_mean =
        0.01212636. ALSO discloses that EV-ECDLP-65b004's four artifact hashes
        are fabricated placeholders, so any reuse of that grid must recompute
