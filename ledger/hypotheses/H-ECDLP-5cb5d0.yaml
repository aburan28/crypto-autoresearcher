      role: the live successor object; this record does not duplicate it
  reduction_chain:
    core_problem: >-
      Whether an oracle returning complete curve points can supply usable
      index-calculus relations, at toy prime-field sizes.
    corollaries: []
  predictions:
    - metric: >-
        rank_contribution_per_query, dimensionless, the increase in the rank of
        the accumulated relation matrix over the factor-base logarithm unknowns
        divided by the number of oracle queries, for VARIANT 1
      direction: lower
      minimum_effect: >-
        Exactly 0.000, with a 95 percent upper bound of 3/n_queries when zero
        events are observed. At the declared 2000 queries that bound is 0.0015.
    - metric: >-
        rank_contribution_per_query for VARIANT 2, dimensionless
      direction: lower
      minimum_effect: >-
        Exactly 0.000, same bound. The constructed relation is the tautology
        P_1 + ... + P_m = P_1 + ... + P_m and adds no independent row.
    - metric: >-
        rank_contribution_per_query for the KNOWN-LOGARITHM control arm,
        O(i) = [i]P, dimensionless
      direction: higher
      minimum_effect: >-
        At or above 0.10 at p = 1009, B = 10, m = 3, where the decomposition
        probability C(B,m)/N is about 120/1009 = 0.119. This is the instrument's
        demonstrated dynamic range and it is about 79 times the zero-arm upper
        bound. If it returns 0.000 the instrument cannot measure a nonzero rank
        contribution and every zero in this run is void.
    - metric: >-
        verified_solve_rate, dimensionless in [0,1], targets on which the
        pipeline recovered a k satisfying [k]P = Q under independent
        re-verification, divided by targets attempted
      direction: lower
      minimum_effect: >-
        Exactly 0.000 for VARIANT 1 and VARIANT 2, and strictly positive for
        the known-logarithm control arm.
    - metric: >-
        curve_free_agreement, the (Z/N, +) arm's rank contributions and solve
        rates minus the elliptic arm's, dimensionless
      direction: different
      minimum_effect: >-
        Predicted 0 within the pooled interval. CONSEQUENCE PRE-STATED AND
        DELIBERATELY POSITIVE, agreement means the vacuity is a property of
        index calculus in any finite cyclic group, which makes the closure
        BROADER than an elliptic one. It must then be reported as a statement
        about cyclic-group index calculus and not as an elliptic-curve or
        ECDLP result.
  test_boundary:
    instances:
      - >-
        Toy prime-field curves at p in {101, 103, 107, 211, 1009},
        hygiene-screened, V a random subset of E(F_p) of size B.
      - Curve-free null instances in (Z/N, +) at matched N and matched B.
    parameters:
      claim_tier: toy
      arity: 3
      B_values: [10, 20, 50]
      queries_per_cell: 2000
      targets_per_cell: 2000
    implementation: >-
      Not yet written. EXP-ECDLP-4617dc declares the required artifacts.
    budget:
      wall_clock_seconds_per_run: 1800
      maximum_memory_gb: 8
      maximum_runs: 6
  falsification_conditions:
    - >-
      TOY-TIER FALSIFIER on V1. Either zero arm returns a rank contribution
      above its 95 percent zero bound while the known-logarithm control fires
      correctly. The accounting identity is then wrong and the source
      proposal's mechanism is live, which would be the informative outcome and
      would require the arm to be re-specified as a positive experiment.
    - >-
      INSTRUMENT VOID. The known-logarithm control arm returns a rank
      contribution below 0.10 or a verified-solve rate of zero. The instrument
      has no demonstrated dynamic range and every zero it reports is
      uninterpretable.
    - >-
      INSTRUMENT VOID. Any accepted relation is credited without an exact
      integer rank recomputation, or any recovered k is accepted without
      independent re-verification.
    - >-
      SCOPE STATEMENT, NOT A FALSIFIER. The curve-free (Z/N, +) arm reproduces
      the elliptic arm exactly. The conclusion is then about index calculus in
      cyclic groups and no elliptic-curve or ECDLP statement may be drawn from
      it.
    - >-
      INFRASTRUCTURE, NOT EVIDENCE. Timeouts, crashes, memory exhaustion, per
      AGENTS.md rule 5.
  interpretation_limits:
    - >-
      Toy scale, 7 to 11 bit prime fields, arity 3. No claim about
      cryptographic parameters, per AGENTS.md rule 7.
    - >-
      THIS RECORD DOES NOT MEASURE THE SOURCE PROPOSAL'S HEADLINE RATIO,
      because that ratio holds with probability 1 by construction and its
      nominated falsifier would be a contradiction. Reporting a measured value
      near (m! N)/B^m as confirmation of anything would be a category error and
      is forbidden.
    - >-
      A zero rank contribution here closes the ORACLE-AS-CONSTRUCTOR reading
      only. It says nothing about oracles used in any other way, and nothing
      about H-XOR-d1a480's separately recorded cost-reduction effect, which
      DEC-20260808-6a7ac4 explicitly did not reject.
    - >-
      The one live successor is the public-scalar factor base, H-ECDLP-a4c9c1
      and EXP-ECDLP-e7f6e4, which is where a known-logarithm oracle actually
      leads. This record routes there rather than duplicating it, and its
      known-logarithm arm is a CONTROL, not an attempt at that result.
    - >-
      Nothing here bears on whether a full-point oracle would be obtainable in
      practice. The question is what it would BUY, and the answer at the tested
      scope is a tautology.
  status: proposed
  proposed_by: idea-generator
