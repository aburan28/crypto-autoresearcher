hypothesis:
  id: H-ECDLP-7cd883
  question_id: RQ-ECDLP-002
  proposal_id: IDEA-20260909-4c5ee9
  experiment_ids:
  - EXP-ECDLP-5e7e74
  goal_ids:
  - GOAL-ECDLP-001
  - GOAL-ICEX-001
  statement: The specified public auxiliary-sum histogram selector may lower charged work to an independently useful
    relation-rank quota over its identity-selector pipeline, after paying for canonicalization, training and all
    labels; full IC benefit requires the current matched baseline and blind recovery.
  mechanism: On PO003 bielliptic C, bucket the sum of four auxiliary E2 images by infinity or Legendre(W) and a
    16-way W interval; train exact Laplace-smoothed bin scores on 65536 canonical candidates and freeze top-quarter
    bins before a disjoint 65536-candidate holdout. See the experiment for alias canonicalization, nulls and complete
    costs.
  assumptions:
  - Exact finite inputs and public algorithms are fixed before trials.
  - Independent checks validate source equations and all required controls.
  - No target/factor-base scalar oracle, uncharged advice or rejected-attempt omission.
  predictions:
  - metric: Paired charged relation-stage work
    direction: lower
    minimum_effect: An informative cheap selector retains enough independent rank and costs less to rank U than
      identity after charging all labels/rejects/preparation; no minimum effect or guaranteed power is assumed.
  - metric: Dependence on actual companion information
    direction: lower
    minimum_effect: A Prym-specific benefit also survives real versus permuted/split controls; equal gains in those
      controls indicate a generic selector effect.
  test_boundary:
    instances:
    - Eight fresh W fixtures only if W validation passes, each with three paired seeds [0,1,2]; these are a fixed
      finite diagnostic panel, not an independent test of the final E-stage population. Never use them to tune a
      selector and then call their measurements holdout.
    parameters:
      stage: S
      specification: experiments/EXP-ECDLP-5e7e74/specification.yaml
      replication:
        seeds:
        - 0
        - 1
        - 2
        independent_instances: 8
      scope: toy finite family; no deployed curve extrapolation
    implementation: Prospective companion_selector.py arithmetic/model component implemented; generator, canonicalizer,
      row checker, metering and native launcher unbound.
    budget:
      enforcement: advisory
      wall_clock_seconds_per_run: null
      total_cpu_hours: null
      maximum_memory_gb: 2
      maximum_runs: null
      maximum_workers: 1
  falsification_conditions:
  - 'P-S-stage/C-S-selector: real selector fails rank U, loses useful rows without compensating charged work, or
    does not improve the fixed-panel stage cost after all acquisition costs. P-S-specific/C-S-permuted or C-S-split:
    matching control gains remove Prym-specific attribution; they do not erase a valid generic engineering improvement.
    Gate failure is instrument invalidity.'
  interpretation_limits:
  - 'Design only: no scientific run, measured gain, new asymptotic exponent, novelty certificate or security conclusion.'
  - The unsourced historical 32-cover quotation is not an input catalog; no identification or completeness claim
    is made.
  - P1546 remains a scoped fixed-branch counting gate; this design does not execute or reopen the IDEA-002 frozen
    contract.
  - A cover, Frobenius overlap, auxiliary cancellation or faster known-scalar multiplication alone does not solve
    ECDLP.
  - Missing code, access, admission or verification is an implementation/infrastructure impediment, not mathematical
    falsification.
  - This initial proposed record is not an official approval or evidence-supported hypothesis transition.
  status: proposed
  proposed_by: coordinator under TASK-20261019-a55a7a; owner-requested staged design
  asymptotic_claim: null
  proof_search_map:
    bottleneck: Known public source information and independent projected rank before any complete cost advantage.
    baseline_embedding:
      parameter_slice: Current exact matched IC protocol per admitted finite fixture/size remains to be bound; PO003
        only calibrates algebra.
      reproduction_check: Reproduce exact baseline workload and S before any performance claim; G/W are correctness
        prerequisites only.
    observation_collision:
      observable: Zero companion component / apparent native smoothness or rank.
      distinct_preimage_search: Split-product control also cancels auxiliary components while leaving unknown elliptic
        scalar; duplicate/sign columns and post-hoc residuals test retained-information collisions.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: On PO003 bielliptic C, bucket the sum of four auxiliary E2 images by infinity or Legendre(W)
        and a 16-way W interval; train exact Laplace-smoothed bin scores on 65536 canonical candidates and freeze
        top-quarter bins before a disjoint 65536-candidate holdout. See the experiment for alias canonicalization,
        nulls and complete costs.
      predicted_gain: No established gain; exact finite stage criterion only.
    quantifier_order: Freeze public family/fixtures/base/constructor/selector first, then independent challenge
      scalar; same policy for every admitted target. No secret-conditioned map or post-success selection.
    method_ceiling:
      strongest_certifiable_claim: Finite arithmetic or source/rank correctness for G/W; measured finite-stage improvement
        for S; independently verified matched complete-S improvement for E. No asymptotic or secp/P256 conclusion.
      nearby_object_control: Split E x A with arbitrary auxiliary cancellation; public scalar push-pull and tuple-first
        unknown source endpoint.
    proof_obligations:
    - claim: Explicit public source-return mechanism, no verifier-as-locator or hidden log lookup.
      responsibility: interface
    - claim: Actual distinct unknown column count U and full affine rank modulo r.
      responsibility: correctness
    - claim: All construction/rejection/label/LA/descent/recovery work charged with same baseline scope.
      responsibility: runtime
    - claim: Any operation beyond P1546 scope must identify the distinct compact adaptive/growing-degree/implicit
        mechanism rather than rename a fixed branch.
      responsibility: scope
