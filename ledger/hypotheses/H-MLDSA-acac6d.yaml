  test_boundary:
    instances:
      - "ML-DSA-44 / -65 / -87 as PARAMETER TABLES and as an algorithm description. No key generated, no signature produced, no device touched, no fault injected or simulated."
      - "Five synthetic fault classes on the w-ladder w in {1, 8, 64, 256, 1024}, as pure counting objects."
      - "Two null objects: the message-digest fault and the unfaulted transcript."
      - "One positive control: the y-known fault."
      - "The four filed implementation entries KN-LIT-340675, -4f3b80, -180ad5, -8ce0b5, as documents to be read if obtainable."
    parameters:
      q: 8380417
      ring_degree: 256
      log2_q: 22.9986
      ML-DSA-44: {k: 4, l: 4, eta: 2, tau: 39, s1_coeffs: 1024, s1_entropy_bits: 2377.6}
