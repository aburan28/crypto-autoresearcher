      citation: KN-LIT-6501
      provenance: kb
      verified_by: TASK-20260913-9b4ec7
      role: literature pointer, not a formula source
  reduction_chain:
    core_problem: exact divisor census of r±1 for a frozen list of standardized orders
    corollaries: []
  predictions:
    - metric: E(r) per frozen curve
      direction: different
      minimum_effect: >-
        Informative outcomes are E(r) >= 0.49 for every listed deployed curve,
        or E(r) <= 0.40 for at least one (that curve is named and the goal's
        stop-and-escalate clause fires). Values in (0.40, 0.49) are reported
        as-is.
    - metric: size in bits of the largest divisor of r±1 that is <= sqrt(r), per curve
      direction: different
      minimum_effect: No threshold. Raw quantity behind E(r); a reader must be able to recompute E(r) from it and the factorization.
    - metric: planted-control E(r)
      direction: different
      minimum_effect: E(r) in [0.24, 0.26] on the synthetic r with planted d = round(sqrt(r)) dividing r-1.
    - metric: safe-prime null r-1 branch exponent
      direction: different
      minimum_effect: r-1 branch exponent >= 0.49. Full E(r) may be lower via r+1 and is not the control.
  test_boundary:
    instances:
      - NIST P-224 group order
      - NIST P-256 group order
      - NIST P-384 group order
      - NIST P-521 group order
      - secp256k1 group order
      - brainpoolP256r1 group order
      - brainpoolP384r1 group order
      - Ed25519 prime-order subgroup L
      - BN254 (alt_bn128 / BN(2,254)) prime subgroup order
      - BLS12-381 G1 prime subgroup order
      - synthetic planted-divisor r (positive control)
      - synthetic safe-prime r (null control, r-1 branch only)
    parameters:
      cost_expression: sqrt((r_pm1)/d) + sqrt(d)
      exponent: log2(cost_expression) / log2(r)
      branches: [r-1, r+1]
      factoring_seconds_per_integer: 3600
    implementation: EXP-AUXIN-7e2e3d
    budget:
      maximum_runs: 1
      maximum_workers: 1
      maximum_memory_gb: 8
      wall_clock_seconds: null
      total_cpu_hours: null
  falsification_conditions:
    - The planted-divisor control fails to recover d or returns E(r) outside [0.24, 0.26]. No real-curve row may then be concluded.
    - The safe-prime null returns an r-1 branch exponent < 0.49. The cost evaluation is wrong.
    - Reported prime factors of a completed row do not multiply back to r±1 in exact integer arithmetic.
    - A row omits the r+1 branch. That row is incomplete, not negative.
  interpretation_limits:
    - Measures divisor structure. Does not run Cheon, recover a discrete logarithm, or speak to any deployed system's security.
    - A favorable E(r) on a pairing-friendly curve is the expected case under q-SDH-style parameter choice, not a surprise finding.
    - Without a protocol that releases the needed powers (IDEA-20260831-ccb587), E(r) has no operational reading.
