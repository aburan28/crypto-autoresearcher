hypothesis:
  id: H-AUXIN-66e6fd
  question_id: RQ-AUXIN-f8d8c0
  goal_id: GOAL-AUXIN-a93442
  derived_from_idea: IDEA-20260831-df4197
  successor_experiment: EXP-AUXIN-7e2e3d
  decision_id: DEC-20260913-515d80
  status: approved
  proposed_by: coordinator
  recorded_at: '2026-09-13'
  statement: >-
    For each frozen standardized prime-order r, the exact quantity
    E(r) = min over d dividing r-1 or r+1 of
    log2(sqrt((r±1)/d) + sqrt(d)) / log2(r)
    is determined by the divisor lattices of r-1 and r+1 alone. Either every
    listed deployed order has E(r) >= 0.49 (the Cheon-type auxiliary-input
    class is arithmetically inert at those parameters, whatever any protocol
    releases) or at least one listed order has E(r) <= 0.40 and is named.
    Intermediate values are reported as-is. This is a statement about integer
    factorizations and a closed-form cost expression. It is not an
    ordinary-ECDLP improvement, not a protocol-supply claim, and not a
    vulnerability.
  mechanism: >-
    Group orders of the frozen list are prime by construction, but r-1 and
    r+1 are unconstrained by the curve-selection criteria. Cheon's cost
    (DEC-20260802-204) is O(sqrt((r-1)/d) + sqrt(d)) for d | (r-1), and a
    sibling expression for d | (r+1). The r^{1/4} headline is the value of
    that expression at a hypothetical d ~ sqrt(r), not a property of any
    particular curve. Fully factor r-1 and r+1, enumerate the divisor
    lattice, evaluate the exact expression at every divisor, take the
    minimum, and divide its log by log(r). Independent recomputation in a
    second arithmetic implementation is required before any row is believed.
  assumptions:
    - The curve list is frozen before any factoring; rows are not dropped after seeing factors.
    - Full factorization of each r±1 is attempted; an unfactored cofactor makes that row a BOUND on E(r), never a point value, with the bound direction stated.
    - The cost expression is the DEC-20260802-204 form. A log-r group-operation cofactor appearing in some Cheon writeups is not folded into E(r); it is reported separately if computed.
    - E(r) small is a necessary condition for a Cheon-type speedup, not a sufficient one and not a vulnerability. Protocol supply is IDEA-20260831-ccb587 and is out of this hypothesis.
    - DEC-20260802-204's acquisition gate stands: nothing here improves ordinary ECDLP.
  proof_search_map:
    not_applicable_reason: >-
      Exact integer factorization plus evaluation of a closed-form expression.
      No theorem, reduction, or asymptotic improvement is claimed. The four
      cheap proof-architecture audits do not apply.
    bottleneck: null
    baseline_embedding:
      parameter_slice: null
      reproduction_check: null
    observation_collision:
