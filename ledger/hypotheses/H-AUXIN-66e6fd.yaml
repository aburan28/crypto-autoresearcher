      session (empty catalog). Absence of a search hit is not evidence that
      no published table exists.
    outcome: >-
      This program has no committed per-curve E(r) table for the frozen
      list. KN-LIT-6736 reports one 160-bit pairing-friendly Cheon experiment,
      not this census. KN-LIT-6501 / its 2026-09-07 addendum files Cheon 2006
      as published prior art; they do not contain the census. Novelty against
      the open literature remains unverified.
    citations:
