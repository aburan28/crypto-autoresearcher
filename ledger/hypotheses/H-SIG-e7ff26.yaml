hypothesis:
  id: H-SIG-e7ff26
  question_id: RQ-SIG-001
  source_idea_id: IDEA-20260805-d38a8c
  goal_id: GOAL-SIG-001

  statement: >-
    For the boolean chained Semaev system (m = 3, t = 3, 2n variables, n
    quadratics and n cubics) at any fixed degree D below the freeze degree
    n/3 + 3, the D-born non-rewritable syzygy component satisfies
    residual_D(n) = O(n^c) with c a constant independent of D, while the
    quotient dimension the Macaulay matrix must still eliminate before the
    solving degree can fall to D satisfies Q_D(n) = Theta(n^D). Consequently the
    MODEL LEVERAGE lam_D(n) = residual_D(n) / Q^model_D(n), with
    Q^model_D(n) = sum_{d <= D} HF_n(d) taken from the goal's own pinned series
    H(z) = (1+z)^{2n} / ((1+z^2)^n (1+z^3)^n), satisfies lam_D(n) = O(n^{c-D})
    and in particular DECREASES MONOTONICALLY IN n at every fixed D >= c + 1.
    The operational reading, which is what GOAL-SIG-001's completion criterion
    asks for: a syzygy family whose leverage vanishes cannot lower the solving
    degree at the tested sizes, so the degree-born non-rewritable cascade -- real
    and growing though it is at D = 4, where residual_4 = 2n/3 + 1 is confirmed at
    six sizes -- is NON-OPERATIVE for decomposition cost on the tested lattice.
    THIS IS A HYPOTHESIS. Nothing is claimed. No run has happened.

  mechanism: >-
    The solving degree falls to D exactly when the degree-D Macaulay matrix
    reaches rank_D = ncols_D - |V|, i.e. when the graded quotient at degree <= D
    collapses to the variety. The distance to that event is
    Gap_D = Q_D - |V| with Q_D = ncols_D - rank_D. A non-rewritable syzygy family
    of dimension residual_D adds at most residual_D dimensions of kernel beyond
    what a rewritable model predicts, hence has leverage at most
    residual_D / Gap_D on the only event that changes cost. Two growth laws then
    decide the question and both are computable rather than assumed.
    DENOMINATOR. Q^model_D(n) <= sum_{k <= D} C(2n, k) = Theta(n^D) immediately,
    and the measured fraction Q^model_5 / ncols_full(5) rises through
    0.247, 0.469, 0.593, 0.671 at n = 9, 12, 15, 18, so the lower bound holds
    with a constant approaching its ceiling: Q^model_D = Theta(n^D) on this
    lattice. The series itself is fully re-derivable: reconstructing
    semireg_rank_pred from experiments/EXP-SIG-006/src/h013_f5_signatures.sage
    reproduces HF_9 = [1, 18, 144, 645, 1566, 738], the freeze degrees
    6 / 7 / 8 / 9 at n = 9 / 12 / 15 / 18, and every committed sr_pred value
    (180 / 1674 / 9504 / 28068 at n = 9; 312 / 3834 / 29418 / 156520 at n = 12;
    484520 at n = 15 D6; 1216266 at n = 18 D6). Row counts reproduce too:
    nrows(12,6) = 183312 and nrows(12,5) = 31512. ALL OF THESE WERE RECOMPUTED
    BY THE IDEA GENERATOR IN THIS SESSION OUTSIDE THE HARNESS (label:
    SESSION-COMPUTED) and re-deriving them in-harness is stage 0 of EXP-SIG-c9fda8.
    NUMERATOR. The only established growth law in this goal is
    residual_4 = 2n/3 + 1, confirmed at n = 12, 15, 18, 21, 24 with zero seed
    variance (EV-SIG-005 P1) -- linear, i.e. c = 1. At D = 5 the four measured
    values 344 / 878 / 1158 / 974 at n = 9 / 12 / 15 / 18 are non-monotone and
    consistent with c <= 1. At D = 6 the two measured values 2615 / 2722 at
    n = 9 / 12 differ by 4.1% while ncols grows by a factor 5.9.
    THE CONSEQUENCE, EVALUATED. lam_5 = 344/3112, 878/26037, 1158/103502,
    974/297823 = 0.11054, 0.03372, 0.01119, 0.00327: monotone across four
    interior points, ratios 3.278 / 3.014 / 3.421 per step of dn = 3, log-log
    slope -5.010 against the -5 that c = 0 forces and the -4 that c = 1 forces.
    On the D6 axis lam_6 = 0.84030 (n = 9) -> 0.08118 (n = 12), a 10.4x collapse,
    and the same normalisation applied to the TOTAL non-model syzygy count gives
    extra_6 / Q^model_6 = 2.859 -> 0.536, so even the inherited component loses
    ground although its absolute size doubles (8897 -> 17982). Every D6 figure
    inherits the inadmissibility both EV-SIG-006 and EV-SIG-008 declare (no valid
    D6 null baseline exists at those cells) and is carried as context only; the
    hypothesis's primary axis is D = 5, where EV-SIG-005 records every cell as
    null-validated with extra_5 = 0 and rank == sr_pred on the null arm.
    WHAT WOULD MAKE THE CASCADE OPERATIVE, stated so the hypothesis can lose.
    The word "cascade" asserts multiplicative compounding across degrees. If the
    inherited closure component compounds at a rate exceeding the quotient's
    growth, leverage rises rather than falls. The measured compounding rate
    (A5 = 6282 -> 15260 from n = 9 to n = 12, x2.43) is below the quotient's
    growth over the same step (Q^model_6: 3112 -> 33531, x10.8), which is why the
    hypothesis points the way it does -- but two points is not a law and the
    experiment measures a third.

  assumptions:
    - >-
      residual_D as defined by this goal (extra_D minus the closure A_{D-1}) is
      the correct numerator. Misattribution between born and inherited content
      inflates the numerator, which understates the decay -- the safe direction
      for this hypothesis and the dangerous one for its negation.
    - >-
      |V_sem| = O(1) in n. Measured 6 at n = 9 by full 2^18 enumeration
      (EV-SIG-006 C5); unmeasured at n = 12, where the experiment enumerates it.
      The leverage figures are insensitive to any |V| below ~3000.
    - >-
      The pinned instrument reproduces its committed anchors. EV-SIG-008 records
      this gate catching a reimplementation drift (A4_5 = 242 against the recorded
      444), so it is mandatory and ordered first.
    - >-
      This container has numpy 2.4.6 and NO Sage, Singular, msolve or sympy
      (SESSION-VERIFIED). Every SIG instrument is a .sage file importing
      sage.all, so any new measurement requires a port or a Sage-bearing
      environment. That is an infrastructure precondition, not a mathematical
      one.

  proof_search_map:
    bottleneck: >-
      The single step whose removal changes the answer is the comparison of two
      growth rates: residual_D(n) against Q_D(n). Everything else in the goal --
      null baselines, freeze degrees, admissibility of D6 -- affects the
      NUMERATOR's measurability but not the comparison, and the comparison can be
      made on the D = 5 axis where the numerator is already null-validated. That
      is why the hypothesis routes around the goal's standing blocker rather than
      through it.
    baseline_embedding:
      parameter_slice: >-
        D = 4 is the exact slice where the old method's answer is fully known:
        residual_4 = 2n/3 + 1 at n = 12, 15, 18, 21, 24 with zero seed variance,
        and the D4 deficit law 8n/3 (EV-SIG-002, EV-SIG-004, EV-SIG-005). At that
        slice the hypothesis makes a prediction that requires NO new measurement
        at all: lam_4(n) = (2n/3 + 1) / Q^model_4(n) must decay with log-log slope
        near -3.
      reproduction_check: >-
        Symbolic plus a frozen numeric fixture: reproduce the pinned Hilbert
        series, all committed sr_pred values, both committed nrows values, and
        then lam_4 from the closed form. If lam_4 does not decay, the hypothesis
        is refuted before any experiment runs. This is the cheapest available
        falsification of the whole line and it is stage 0.
    observation_collision:
      observable: >-
        The rational number lam_D(n), and the decision label ("decaying" /
        "non-decaying") derived from its finite differences.
      distinct_preimage_search: >-
        Two ground-truth objects that must NOT share the observable: (i) a system
        whose cascade is bounded, and (ii) a system whose cascade grows like
        Q_D. Under the hypothesis these have lam decaying and lam constant
        respectively. The collision risk is real and is named: any system with
        residual_D = 0 identically -- including a perfectly semi-regular null --
        also has lam_D = 0 and therefore also reads as "decaying". So lam ALONE
        cannot distinguish "bounded cascade" from "no cascade". The resolution is
        that the goal has already established the cascade is nonzero and growing
        at D = 4 (EV-SIG-002/004/005), so the two preimages are separated by a
        measurement that already exists rather than by lam; and the experiment
        reports residual_D beside lam_D always, never lam alone.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold lam_D fixed and vary the pair (residual_D, Q_D). If two systems
          with very different cascade sizes share a leverage value, does anything
          in the cost argument distinguish them? Answer derived: no -- the cost
          consequence depends on the ratio alone, which is the justification for
          the projection and simultaneously the reason residual_D must always be
          reported alongside.
      - transform: boundary_lift
        proposed_object: >-
          Lift the comparison from fixed D to D growing with n at a fixed offset
          from the freeze degree (D = freeze - 1, i.e. D = 5, 6, 7, 8 at
          n = 9, 12, 15, 18). This is the regime a real solver enters and the
          fixed-D comparison does not cover it.
        predicted_gain: >-
          None to an attacker. The gain is to the argument's scope: a decay at
          fixed D says nothing about the diagonal, and the hypothesis's
          interpretation limits must say so. The diagonal cells beyond n = 12 are
          out of budget and are named as the principal residual uncertainty.
    quantifier_order: >-
      Written out, because this is where a bounding claim usually fails.
      HYPOTHESIS: THERE EXIST constants c and n_0 SUCH THAT FOR ALL n >= n_0 and
      FOR ALL D with 4 <= D < n/3 + 3, residual_D(n) <= K n^c with c independent
      of D. The dangerous reading is the swapped one -- FOR ALL D THERE EXISTS a
      constant c(D) -- which is far weaker and would permit c(D) to grow with D,
      destroying the conclusion. The experiment can only ever test the weak form
      at finitely many (n, D), so the strong form is a HEURISTIC (HEUR-LEV-1) and
      is labelled as one; no evidence record arising from this hypothesis may
      state the uniform-in-D version as established. Symmetrically, the
      conclusion "the cascade cannot lower the solving degree" is quantified as:
      FOR the tested (n, D) cells, NOT for all n, and NOT at crypto scale.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: on the tested lattice (n <= 24, D <= 6, boolean chained Semaev
        m = 3 t = 3), the measured D-born non-rewritable component is a
        monotonically decreasing fraction of the semi-regular quotient, with a
        log-log slope consistent with residual_D = O(n) and Q_D = Theta(n^D).
        It CANNOT certify that no cascade at any degree or size is operative, it
        CANNOT certify anything at crypto scale, and it CANNOT certify a
        statement about prime-field decomposition (see IDEA-20260805-0d2a21 for
        that separate and unresolved question). Writing it up as a closure of the
        lane would be the premature-closure failure mode this program treats as
        symmetric with overclaiming.
      nearby_object_control: >-
        The nearby object where the hoped-for conclusion is KNOWN FALSE is a
        system with a planted non-rewritable family sized to scale with the
        quotient. On such a system lam_D must NOT decay. If the pipeline reports
        decay there too, the leverage statistic is measuring instance size rather
        than structure and no conclusion may be drawn. This control is required
        in EXP-SIG-c9fda8 and it is the same planted machinery as
        IDEA-20260805-8a68d3.
    proof_obligations:
      - claim: Q^model_D(n) = Theta(n^D) for fixed D below freeze.
        responsibility: size
      - claim: residual_D(n) = O(n^c) with c independent of D.
        responsibility: size
      - claim: >-
          A non-rewritable family of dimension r contributes at most r to the
          kernel excess relevant to a solving-degree drop.
        responsibility: correctness
      - claim: >-
          The solving degree falls to D iff rank_D = ncols_D - |V|, so Gap_D is
          the right denominator.
        responsibility: correctness
      - claim: "|V_sem| = O(1) in n."
        responsibility: feasibility
      - claim: >-
          The conclusion is scoped to the tested lattice, toy tier, and the
          boolean field.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim:
    problem: >-
      Groebner-basis solving degree of the boolean chained Semaev decomposition
      system (the polynomial-system stage of index-calculus decomposition).
    prior_best: >-
      The semi-regular degree-of-regularity prediction from the same pinned
      Hilbert series used here as the denominator. No faster route is claimed by
      this program for this system.
    time_exponent: >-
      UNCHANGED. This hypothesis proposes no algorithm and moves no exponent. It
      asserts an upper bound on how much a known structure COULD move one:
      leverage O(n^{c-D}), vanishing. Stated plainly as required rather than
      dressed up: this is not an exponent result and must never be reported as
      one.
    memory_exponent: >-
      n/a for the claim. For the measurement, the binding cost is the degree-5
      echelon at n = 21, which is what ended EXP-SIG-007.
    hidden_cofactor: >-
      The bound is only as good as c in HEUR-LEV-1. At c = 1 (the D4 evidence)
      leverage is O(n^{1-D}); at c = D - 1 it is O(1) and the conclusion
      evaporates. That sensitivity is the hypothesis's weakest joint.
    claim_kind: constant_factor

  heuristic_assumptions:
    - id: HEUR-LEV-1
      formal_statement: >-
        THERE EXIST constants K > 0 and c >= 0, with c independent of D, SUCH
        THAT FOR ALL n on the lattice {9, 12, ..., } and FOR ALL D with
        4 <= D < n/3 + 3, the D-born non-rewritable component of the boolean
        chained Semaev ideal satisfies residual_D(n) <= K n^c. Conjectured c = 1.
      random_model_justification: >-
        The chained construction has n/3 links and the one established law
        (residual_4 = 2n/3 + 1) is exactly linear in the link count, i.e. a
        bounded number of born relations per link. A per-link-constant family is
        what a chain of bounded-width blocks should produce if the born content
        is local to a link. THIS IS A STRUCTURAL PLAUSIBILITY ARGUMENT AND NOT A
        DERIVATION; the per-link reading of 2n/3 + 1 is the idea generator's and
        is not sourced.
      supporting_results:
        - >-
          EV-SIG-005 P1: residual_4 = 2n/3 + 1 at n = 12, 15, 18, 21, 24, zero
          seed variance, both pinned and canonical reductions agreeing (delta 0).
        - >-
          EV-SIG-005: residual_5 = 344 / 878 / 1158 / 974 at n = 9 / 12 / 15 / 18,
          n = 18 replicated across two seeds -- NON-MONOTONE, which is why this
          is a heuristic and not a claim.
        - >-
          NOT READ -- relayed: whether a bound of this shape appears in the
          semi-regularity literature is UNKNOWN to this hypothesis. No source was
          read and none is cited.
      validation_experiment_ids: [EXP-SIG-c9fda8]
      falsification_condition: >-
        residual_5(21) >= 2311, or any measured residual_D exceeding twice
        residual_D(n - 3) at a null-validated cell.
    - id: HEUR-LEV-2
      formal_statement: >-
        FOR EVERY fixed D >= 3 and FOR ALL n below the freeze degree,
        A n^D <= Q^model_D(n) <= B n^D with 0 < A <= B < infinity on the tested
        lattice.
      random_model_justification: >-
        The upper bound is exact (Q^model_D <= sum_{k<=D} C(2n,k)). The lower
        bound is supported by the measured ratio Q^model_5 / ncols_full(5)
        = 0.247, 0.469, 0.593, 0.671 at n = 9, 12, 15, 18, rising toward a
        ceiling; a ratio bounded away from zero gives the lower bound.
      supporting_results:
        - >-
          SESSION-COMPUTED from the pinned series, reproducing every committed
          sr_pred value; to be re-derived in-harness as stage 0.
      validation_experiment_ids: [EXP-SIG-c9fda8]
      falsification_condition: >-
        Q^model_D / ncols_full(D) turning over and decreasing across the lattice.
    - id: HEUR-LEV-3
      formal_statement: >-
        |V_sem|, the number of solutions of the boolean chained Semaev system, is
        bounded by an absolute constant independent of n.
      random_model_justification: >-
        Measured 6 = 3! at n = 9, read as one solution per ordering of an m = 3
        decomposition. The reading is the idea generator's and is not sourced.
      supporting_results:
        - EV-SIG-006 C5, full 2^18 enumeration at n = 9 giving |V_sem| = 6.
      validation_experiment_ids: [EXP-SIG-c9fda8]
      falsification_condition: "|V_sem| at n = 12 exceeding 100."

  structural_ingredients:
    - description: >-
        The pinned boolean semi-regular Hilbert series
        H(z) = (1+z)^{nb} / prod_i (1 + z^{d_i}), truncated-positive, as
        implemented in semireg_rank_pred.
      citation: >-
        experiments/EXP-SIG-006/src/h013_f5_signatures.sage (internal, READ).
        Its attribution to the Bardet-Faugere-Salvy line is RECALLED and
        UNVERIFIED; no external source was read and none is cited.
      role: >-
        Supplies the denominator's growth rate at zero compute and with no null
        arm.
    - description: >-
        The goal's own D4 growth law residual_4 = 2n/3 + 1, established at six
        on-lattice sizes with zero seed variance.
      citation: ledger/EV-SIG-005.yaml (internal, READ)
      role: >-
        Supplies the only established numerator growth rate and the zero-compute
        consistency check that can refute the construction before any run.

  reduction_chain:
    core_problem: >-
      Whether the degree-born non-rewritable syzygy component of the boolean
      chained Semaev ideal can lower the solving degree at the tested sizes.
    corollaries: []

  predictions:
    - metric: lam_4(n) computed from the closed form 2n/3 + 1, zero compute
      direction: lower
      minimum_effect: >-
        Strictly decreasing in n with log-log slope <= -2.5. Failure here refutes
        the construction before any measurement.
    - metric: lam_5(21) = residual_5(21) / 706308
      direction: lower
      minimum_effect: >-
        < 0.00327, equivalently residual_5(21) < 2311. Point prediction 0.00101
        (residual_5(21) = 714) with band 400-1400. residual_5(21) >= 2311
        falsifies the hypothesis.
    - metric: sign of every finite difference of lam_5 across n = 9, 12, 15, 18, 21
      direction: lower
      minimum_effect: >-
        Negative at all four steps. One non-negative step unexplained by a
        null-arm failure at the same cell is a graded-control failure.
    - metric: log-log slope of lam_5 against n over all measured sizes
      direction: lower
      minimum_effect: <= -3.5 (derivation forces -4 at c = 1; four committed points give -5.010).
    - metric: "|V_sem| at n = 12 by enumeration"
      direction: different
      minimum_effect: <= 100, replacing the assumed value 6 in the Gap denominator.

  test_boundary:
    instances: >-
      Boolean chained Semaev, m = 3, t = 3, ti = 0, on the lattice
      n = 9, 12, 15, 18, 21 (24 if budget allows); the frozen instance family
      used by EXP-SIG-002 through EXP-SIG-008; >= 3 seeds at the new size.
    parameters:
      D: [4, 5]
      D_context_only: [6]
      n: [9, 12, 15, 18, 21]
      field: GF(2) boolean quotient
      primary_axis: D = 5 (null-validated at every committed cell)
    implementation: >-
      experiments/EXP-SIG-006/src/h013_f5_signatures.sage (pinned, hash 1ba96fe4
      per EV-SIG-008) and the memory-safe staging built for EXP-SIG-007.
      INFRASTRUCTURE PRECONDITION: this container has no Sage (SESSION-VERIFIED),
      so either a Sage-bearing environment or a bounded pure-Python/numpy GF(2)
      rank port is required. That is an infrastructure request, not an
      experiment, and a failure to satisfy it is never negative evidence.
    budget:
      wall_clock_seconds_per_run: 3600
      maximum_memory_gb: 24
      maximum_runs: 40

  falsification_conditions:
    - residual_5(21) >= 2311 at a null-validated cell.
    - lam_4, computed at zero cost from the established 2n/3 + 1 law, failing to decay.
    - Any non-negative finite difference in lam_5 unexplained by a null-arm failure.
    - >-
      The planted nearby-object control (a cascade sized to scale with the
      quotient) also reading as decaying. The statistic measures instance size,
      not structure, and no conclusion may be drawn.
    - >-
      The positive control failing: the instrument does not recover a planted
      family of known size. No negative result may be reported at all.
    - "|V_sem| at n = 12 exceeding 100."

  interpretation_limits:
    - >-
      Toy scale (AGENTS.md rule 7). Boolean chained Semaev, n <= 24, D <= 6, one
      lattice. Nothing here is a crypto-scale statement.
    - >-
      Scoped to the boolean field. GOAL-SIG-001's objective names prime-field
      decomposition cost and no measurement in this goal is over a prime field;
      IDEA-20260805-0d2a21 raises that separately and this hypothesis does not
      resolve it or claim to.
    - >-
      A confirmed decay does NOT weaken H-SIG-001, which asserts the existence
      and growth of a non-rewritable family -- that survives, and at D = 4 it is
      established. The two are compatible: a real, growing, non-operative
      structure. Any evidence record must say both halves.
    - >-
      All D6 figures are carried as context and inherit the inadmissibility
      declared by EV-SIG-006 and EV-SIG-008. They may not be cited as cascade
      evidence.
    - >-
      Fixed-D decay says nothing about the diagonal D = freeze - 1, which is the
      regime a solver enters. That is the principal residual uncertainty and is
      named as the successor rather than hidden.
    - >-
      FORWARD GUIDANCE if the hypothesis is confirmed, so that confirmation is
      not read as closure: the open successors are (a) the diagonal cells, (b) the
      CM panel RQ-SIG-001 names and no SIG experiment has touched, where a
      faster-growing residual would overturn this immediately, and (c) the
      Yokoyama arm (#G*, NS(Syz), signatures Phi(s)), the RQ's other and
      never-implemented half.

  status: proposed
  proposed_by: idea-generator
