# =============================================================================
hypothesis:
  id: H-BINSTD-dba2ab
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-29b1c5
  experiment_id: EXP-BINSTD-38f216
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-09-30'
  approved_at: '2026-09-30'
  authorised_by: DEC-20260930-492bf6
  review_cited: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-29b1c5.yaml
  proposed_by: coordinator
  title: >-
    Corrected iota-stable F_2-subspace classification (V_d = b^{1/4} F_{2^d})
    empties the (subspace base, 2-torsion quotient) cell on every prime-degree
    standardized binary row; the five composite-degree rows stay OPEN with
    scaled-subfield bases; the V_W constructive escape buys exactly one bit on
    the relation-phase total at matched |B|, not 2^{m-1} net coverage

  statement: >-
    SETTING. E: y^2 + xy = x^3 + a x^2 + b over F_q, q = 2^n, b != 0, ordinary.
    Unique rational 2-torsion T = (0, sqrt(b)). For affine P with x != 0,
    x(P + T) = sqrt(b)/x(P) =: iota(x(P)) (identity (A); holds as in the source
    idea and the 2026-09-26 review).

    (B-CORRECTED) EMPTINESS LEMMA. A nonzero F_2-subspace V of F_{2^n} with
    iota(V \ {0}) = V \ {0} equals V_d := b^{1/4} F_{2^d} for exactly one
    divisor d of n. V_d is a subfield iff b in F_{2^d}. Consequences:
      - n PRIME: the only nonzero iota-stable subspaces are {0, b^{1/4}}
        (size 2; equals F_2 iff b = 1) and F_{2^n}. THE (SUBSPACE FACTOR BASE,
        2-TORSION QUOTIENT) CELL IS STRUCTURALLY EMPTY on every prime-degree
        standardized binary row (FIPS K/B-*, ANSI c2tnb*, SECG sect*, ECC2K-130
        at n = 131), certificate: corrected lemma + primality of n.
      - n = 16k composite ANSI rows: V_d for d in {1,2,4,8,k,2k,4k,8k} are
        iota-stable; those with b not in F_{2^d} are NOT subfields and are NOT
        emptied by the E(F_{2^{16}}) cofactor argument. THE CELL IS OPEN on
        those five rows with the scaled-subfield object named (successor seam;
        not closed by this hypothesis).

    (C) CONSTRUCTIVE ESCAPE. For an F_2-subspace W put
    V_W := { x != 0 : u(x) := x + sqrt(b)/x in W }. V_W is iota-stable by
    construction, not an F_2-subspace, |V_W| = 2 * #{w in W : Tr(sqrt(b)/w^2)=0}
    about |W|, membership one F_q inversion plus a rank-l GF(2) test.

    (D-CORRECTED) PRICE. Enumerating one representative per iota-orbit loses
    nothing for the pair {R, R+T}. The orbit-loop OPERATION count falls by
    2^{m-1} at matched |B|, but decompositions of a fixed R over V_W cluster in
    even-parity T-flip classes of size 2^{m-1}, so coverage (fraction of
    targets with >=1 decomposition) falls by the same factor. NET relation-
    phase gain is a factor 2 (one bit — the index of 2E), independent of m.
    On Koblitz rows (b = 1), V_W = tau-bar^{-1}(F_W): the object is a change of
    coordinates plus the E/2E bit. Algebraic/SAT canonicalisation is predicted
    not to realise even that one bit cheaply (Stage 4 deferred: WDSat missing).

  statement_note: >-
    IDEA-20260922-29b1c5 stated (B) as "iota-stable subspace = subfield
    containing b" and (D) as exact 2^{m-1} net. The 2026-09-26 review
    (verdict defective) exhibited the counterexample b^{1/4} F_{2^3} at n=6
    and the clustering accounting. This hypothesis freezes the CORRECTED
    statements as primary predictions and keeps the original statements as
    named falsifiable alternatives (distinguishable outcomes). No security
    claim about any deployed curve.

  mechanism: >-
    Representation: x-coordinate alphabet quotiented by the iota-orbit
    {x, iota(x)}, equivalently the u-coordinate of E/<T>. Operation set:
    translation by factor-base points together with translation by T
    (partial-action Class I). Lossy-projection: discards one bit (which of
    P, P+T); Sigma-compatible because iota is translation by T. Emptiness
    is a structure theorem on iota-stable LINEAR subspaces; the constructive
    escape V_W drops linearity. The priced open number is canonicalisation
    cost in enumeration (amortised 0 when orbits are listed once) versus
    CNF/XOR (deferred). Corrected proof sketch (review): from u^2/w in V
    and 1/V = V/sqrt(b) one gets S containing u^2/sqrt(b); then u/v in S,
    K = span(S) = F_{2^d}, V = c K, iota-stability forces V = b^{1/4} F_{2^d}.

  assumptions:
    - E ordinary over F_{2^n} in form y^2 + xy = x^3 + a x^2 + b, b != 0.
    - Prime-order subgroup has odd order; cofactor even (audit).
    - Curve parameters for named standardized rows from analysis/binstd-curve-audit/
      (secondary OpenSSL tables); Stage 0 re-states them as design figures.
    - No run at deployed n >= 131; deployed rows appear only as computed verdicts.
    - WDSat / CNF-XOR Stage 4 is out of authorized scope until tooling is present.

  proof_search_map:
    bottleneck: >-
      Per-target decomposition cost's dependence on alphabet size, and whether
      an iota-stable LINEAR factor base exists on standardized binary rows.
    baseline_embedding:
      parameter_slice: >-
        Stage 1 census at n in {6,7,8,9,10,11,12,13}; Stage 2 m=2 exhaustive
        on n=17 Koblitz and RC-1 ordinary cells.
      reproduction_check: >-
        (i) x(P+T)=sqrt(b)/x(P) on all affine points of each toy curve;
        (ii) census at n=6 with b in F_4\F_2 returns three iota-stable
        subspaces equal to b^{1/4} F_{2^d} (review counterexample fixture);
        (iii) on Koblitz n=17, x(tau-bar P)=x+1/x identity on all points.
    observation_collision:
      observable: >-
        Count of iota-stable subspaces; multiplicity_per_covered_target;
        relation_phase_total_ratio.
      distinct_preimage_search: >-
        A 2^{m-1} operation-count drop can be (i) the orbit quotient or
        (ii) skipped certificates. Broken by exact certificate-multiset
        equality vs exhaustive search for {R,R+T}. A net 2^{m-1} coverage
        gain (original H2) is broken by measuring multiplicity and coverage
        separately against a matched-size random subspace.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: Corrected emptiness classification V_d = b^{1/4} F_{2^d}
        predicted_gain: >-
          Prime-row STRUCTURALLY EMPTY certificates; composite rows OPEN with
          named object (not a false empty).
      - transform: representation_reduction
        proposed_object: V_W u-line base / iota-orbit enumeration
        predicted_gain: >-
          Factor 2 on relation-phase total at matched |B|; multiplicity
          2^{m-1} per covered target; not a net 2^{m-1} coverage gain.
    quantifier_order: >-
      FOR ALL n, FOR ALL ordinary E/F_{2^n} of the stated form, FOR ALL nonzero
      F_2-subspaces V: iota(V\{0})=V\{0} IMPLIES V = b^{1/4} F_{2^d} for a
      unique d|n. SEPARATELY: FOR ALL m, the relation-phase total ratio
      (V_W vs matched subspace) equals 1/2 within the declared band at the
      tested cells. NOT CLAIMED: composite-row emptiness; any exponent move;
      CNF/SAT realizing the one-bit gain.
    method_ceiling:
      strongest_certifiable_claim: >-
        (i) Corrected lemma as a proved statement with census support at
        n<=13; (ii) prime-row empty verdicts; (iii) measured one-bit
        relation-phase ratio and multiplicity at n=17, m=2. Cannot certify
        no non-subspace iota-stable set is useful; cannot move an exponent.
      nearby_object_control: >-
        Random pairing (iota-unrelated pairs): orbit loop MUST be unsound.
        Koblitz cell where V_W = tau-bar^{-1}(F_W) must match exactly.
        Original-lemma prediction (count = #{d|n : b in F_{2^d}}) is the
        known-false alternative on (n=6, b not in F_2).
    proof_obligations:
      - claim: x(P+T) = sqrt(b)/x(P) for every affine P with x != 0
        responsibility: correctness
      - claim: Corrected emptiness classification (four displayed steps)
        responsibility: correctness
      - claim: Prime-degree standardized rows — cell structurally empty
        responsibility: scope
      - claim: Composite-degree rows — cell OPEN with V_d named (not empty)
        responsibility: scope
      - claim: multiplicity_per_covered_target = 2^{m-1} on V_W at brute-force cells
        responsibility: success_probability
      - claim: relation_phase_total_ratio in [0.4, 0.6] at Stage 2 cells
        responsibility: runtime
      - claim: No impossibility beyond subspace bases; no exponent claim
        responsibility: scope
    not_applicable_reason: null

  asymptotic_claim:
    problem: ECDLP on standardized binary curves via x-coordinate point decomposition
    prior_best: >-
      Matched rho with negation and Frobenius classes; within the family,
      IDEA-20260904-96c4f3 (m-1)-loop at |B|^{m-1}/(m-1)! per target
    time_exponent: Unchanged (constant factor 2 = one bit on relation-phase total)
    memory_exponent: Unchanged
    hidden_cofactor: One F_q inversion per membership test, charged; no o(1) hide
    claim_kind: structural_closure_plus_constant_factor

  heuristic_assumptions:
    - id: HEUR-BINSTD-dba2ab-H1
      formal_statement: >-
        For an l-dimensional F_2-subspace W of F_{2^n} and fixed b,
        #{w in W\{0}: Tr(sqrt(b)/w^2)=0} = (2^l-1)/2 * (1+o(1)), so
        |V_W| = 2^l (1+o(1)).
      random_model_justification: >-
        Exact 0/2-root criterion via Tr; character sum over F_q^* is a
        Kloosterman sum; equidistribution over a subspace is the gap.
      supporting_results:
        - Exact quadratic-root criterion in char 2 (internal derivation)
        - Kloosterman bound |K| <= 2 sqrt(q) (recalled classical; not support)
      validation_experiment_ids:
        - EXP-BINSTD-38f216
      falsification_condition: >-
        Measured |V_W|/2^l outside [0.7, 1.3] on a Stage 2 cell with W
        that passes isolated arithmetic checks.
    - id: HEUR-BINSTD-dba2ab-H2
      formal_statement: >-
        YIELD CLUSTERING. Decompositions of a fixed subgroup target R over
        V_W come in even-parity T-flip classes of size 2^{m-1}; mean
        multiplicity among covered targets is 2^{m-1}; coverage per
        pair-sum is about 1/2^{m-1} of a matched unstructured base; the
        relation-phase total ratio is 1/2 independent of m.
      random_model_justification: >-
        Exact double count (KN-FIND-007 mean yield conservation) plus the
        even-parity flip group of order 2^{m-1}; Poisson occupancy for
        per-target counts is geometry-dependent and measured, not assumed.
      supporting_results:
        - KN-FIND-007 mean-yield conservation (internal)
        - Even-parity T-flip accounting (review derivation; internal)
      validation_experiment_ids:
        - EXP-BINSTD-38f216
      falsification_condition: >-
        multiplicity_per_covered_target below 1.5 on V_W at m=2, or
        relation_phase_total_ratio outside [0.4, 0.6], with counters that
        pass isolated checks.

  structural_ingredients:
    - description: >-
        Corrected classification of iota-stable F_2-subspaces as
        V_d = b^{1/4} F_{2^d}
      citation: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-29b1c5.yaml
      provenance: internal
      verified_by: coordinator (read in full this session)
      role: structure theorem / emptiness certificate
    - description: x(P+T)=sqrt(b)/x(P) involution on the x-line
      citation: IDEA-20260922-29b1c5 mechanism (A)
      provenance: internal
      verified_by: coordinator (read in full); review numerically confirmed
      role: group action inducing the quotient
    - description: Subfield-factor-base yield zero on prime-order targets
      citation: IDEA-20260906-a77711
      provenance: recalled
      verified_by: null
      role: >-
        composite-row degeneracy for true subfields only; pointer via
        IDEA-20260922-29b1c5 citation, not re-opened this session
    - description: Hua-type additive subgroup closed under inversion
      citation: Hua Loo-Keng (1949) recalled context only
      provenance: recalled
      verified_by: null
      role: classical family pointer; proof is self-contained in mechanism

  reduction_chain:
    core_problem: iota-stable subspace census and V_W relation-phase accounting
    corollaries: []

  predictions:
    - metric: iota_stable_subspace_count
      direction: flat
      minimum_effect: >-
        EXACTLY the number of divisors of n, each V equal to b^{1/4} F_{2^d}.
        Original-idea alternative (count = #{d|n: b in F_{2^d}}) is falsified
        on any cell where that set is proper.
    - metric: multiplicity_per_covered_target
