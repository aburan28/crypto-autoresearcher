  interpretation_limits:
    - Corrected emptiness is scoped to F_2-SUBSPACE factor bases only.
    - Composite-row OPEN is a named object, not a costed attack.
    - One-bit gain is a CONSTANT; no exponent moves; matched rho stays ahead.
    - Nothing is a security statement about deployed curves.
    - Stage 4 (WDSat) is not authorized; SAT separation is not tested here.
    - IDEA-20260922-29b1c5 claim text remains as proposed historical proposal.

  dominated_by: >-
    CHECKED. Matched rho with curve symmetries dominates on time and memory
    on every named standardized row. Within the decomposition family the
    (m-1)-loop (IDEA-20260904-96c4f3) is improved by one bit on the relation-
    phase total at unchanged memory — Pareto-improving inside a rho-dominated
    family. Precomputed-table 2^{2n/3} variants remain Pareto-incomparable.
  sota_delta:
    time: >-
      Factor 2 (one bit) on the relation-phase total at matched |B|; operation
      count per target falls by 2^{m-1} but coverage falls equally. Zero on
      attack capability vs matched rho.
    memory: Unchanged (poly); linear-algebra columns halved by orbit unknowns.
