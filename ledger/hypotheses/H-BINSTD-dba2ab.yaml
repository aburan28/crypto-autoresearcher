    - metric: certificate_multiset_equality
      direction: flat
      minimum_effect: Exact equality orbit-loop vs exhaustive for {R,R+T}
    - metric: koblitz_tau_bar_identity
      direction: flat
      minimum_effect: Covered set of V_W equals tau-bar^{-1} of covered set of F_W

  test_boundary:
