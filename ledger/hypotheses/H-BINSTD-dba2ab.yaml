      - Stage 0 zero-compute lemma writeup + per-row verdict table
      - Stage 1 census n in {6,7,8,9,10,11,12,13} with varied b
      - Stage 2 n=17 Koblitz (a=1,b=1) and RC-1 ordinary (A=97044,B=126251)
    parameters:
