      Stage 1 census returns a stable-subspace count different from the number
      of divisors of n on any tested (n,b), or a stable V not equal to
      b^{1/4} F_{2^d}.
    - >-
      Stage 1 census agrees with the ORIGINAL idea (only subfields containing b)
