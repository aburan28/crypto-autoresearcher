# H-CSIDH-695382
# Stage-0 Kronecker-versus-kernel certificate for IDEA-20261006-534e34.
# Four primes at p = 47. Not a class-group computation.
hypothesis:
  id: H-CSIDH-695382
  question_id: RQ-CSIDH-64343f
  goal_id: GOAL-CSIDH-001
  source_idea: IDEA-20261006-534e34
  added: '2026-10-12'
  status: specified
  statement: >-
    At p = 47, on the smallest nonsingular supersingular Montgomery
    curve y^2 = x^3 + A x^2 + x, the primes in {3, 5, 7, 11} with
    Kronecker symbol (-47 / l) = 1 are exactly the primes that admit
    a rational cyclic kernel whose quotient is supersingular and
    isomorphic over F_47 to a Montgomery curve of the same shape.
  test_boundary: >-
    One prime field and four odd primes. The curve is the smallest
    eligible A. No class-group action, no CSIDH-512 parameter, and
    no security level are inside this boundary.
  mechanism: >-
    Split is read from the Kronecker symbol. Edge is read from a
    rational cyclic kernel and a Vélu quotient. Equal sets and a
    nonempty symmetric difference are the two finished readings.
  distinguishable_outcomes:
    - >-
      A curve is found, both sets are scored, and the symmetric
      difference has size 0.
    - >-
      A curve is found, both sets are scored, and the symmetric
      difference has size at least 1.
    - >-
      No eligible curve exists, or a planted check fails. That
      outcome invalidates the run.
  falsification: >-
    A curve is found, both sets are scored, and the symmetric
    difference has size at least 1.
  not_claimed: >-
    No class-group transitivity, no count of distinct codomain
    j-invariants, and no security level.
