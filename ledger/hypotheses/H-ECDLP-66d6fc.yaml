  predictions:
    - metric: >-
        P1 - the rationality defect, computed by two INDEPENDENT group
        constructions, over every ordinary curve at the declared bit sizes
        (dimensionless integer ratio)
      direction: different
      minimum_effect: >-
        EXACTLY 1, on every ordinary curve, with ZERO exceptions across the full
        enumeration. A single ordinary curve with a defect greater than 1
        falsifies R1 and, because it would contradict a classical theorem, first
        indicts the implementation and requires independent review before any
        description.
    - metric: >-
        P2 - SUPERSINGULAR POSITIVE CONTROL, BLOCKING - the defect on a
        supersingular j = 0 curve over a prime field where the relevant root of
        unity is not rational
      direction: higher
      minimum_effect: >-
        STRICTLY GREATER THAN 1 on at least one control curve, with the
        pre-registered expected values written before the run. If the apparatus
        reports 1 here it cannot detect a rationality defect at all - the
        ordinary result is marked attempted_and_inconclusive under GOAL-ENDO-001
        pause condition P1, reported as an INSTRUMENT FAILURE, never as support
        for R1 and NEVER AS A FINDING ABOUT SUPERSINGULAR CURVES. This control is
        permitted under ruling R4 as a CONTROL ONLY; whatever it returns, its
        only admissible reading is instrument dynamic range, and no statement
        about supersingular curves may be derived from it in either direction.
    - metric: >-
        P3 - J-INDEPENDENCE CONTROL, CURVE-CONTENT-FREE NULL - a deliberately
        j-only oracle that computes the defect from the j-invariant alone, run
        over the identical curve set including the supersingular control
      direction: different
      minimum_effect: >-
        The j-only oracle MUST FAIL the supersingular positive control by
        returning 1 there, and the real implementation MUST NOT agree with it
        there. IF THE TWO AGREE EVERYWHERE, the implementation is reading nothing
        but the j-invariant, the enumeration is a tautology, and NOTHING from it
        may be quoted as a statement about elliptic curves - it would be a
        statement about a lookup table. This is the record s curve-free scope
        gate and it is stated in advance.
    - metric: >-
        P4 - count of curves in the question s declared third control family that
        can be instantiated within its own declared constraints
      direction: lower
      minimum_effect: >-
        EXACTLY 0. Any nonzero count falsifies R2 and the question s scope is
        consistent after all.
    - metric: >-
        P5 - number of odd primes in the question s declared degree set that are
        ramified in the maximal order of each arm s discriminant
      direction: different
      minimum_effect: >-
        Exactly 1 for the j = 0 arm, namely degree 3, and exactly 0 for the
        j = 1728 arm, whose ramified prime is 2 and is excluded by scope.
        Confirms R4 by a computation that needs no curves at all.
    - metric: >-
        P6 - BASE-CHANGE SENSITIVITY CONTROL - the defect for the same curve
        computed over the base field and over quadratic and cubic extensions,
        RECOMPUTED rather than inherited
      direction: different
      minimum_effect: >-
        FORCED to be 1 in all cases for ordinary curves, with the splitting-field
        degree reported per curve. This proves the code actually asks about the
        field it is given rather than caching a previous answer.
    - metric: >-
        P7 - measured collision-search step-count ratio on the replacement null,
        namely ordinary curves with a small-degree non-invertible endomorphism
        and automorphism group of order 2
      direction: different
      minimum_effect: >-
        1.00 plus or minus the frozen seed band. A discount there would mean the
        discount does not require invertibility, which would invalidate the
        replacement control s discriminating power and require a redesign before
        any special-j reading.
    - metric: >-
        P8 - automorphism certificate verification fraction
      direction: different
      minimum_effect: >-
        REQUIRED 1.0, per the question s constraint that every kernel and
        quotient map carries an independent curve-membership certificate. Every
        claimed automorphism is re-verified as a curve isomorphism by code
        sharing no state with the producer - the map applied to sampled points,
        images checked on the curve, composition table checked to be a group.

  test_boundary:
    instances: >-
      ARM O, in scope - every curve of the standard short-Weierstrass shape over
      every prime from 64 to 512 with characteristic not 2 or 3, up to
      base-field isomorphism, classified as ordinary or supersingular by the
      trace, with the ordinary ones enumerated exhaustively. THE SUPERSINGULAR
      CONTROL, permitted under ruling R4 as a control and forbidden as a claim -
      supersingular j = 0 curves over primes in the same range where the relevant
      root of unity is not rational. Plus a j-only oracle arm and a
      replacement-null arm.
    parameters:
      bit_sizes: [7, 8, 9]
      prime_range: 64 to 512
      characteristic_excluded: [2, 3]
      base_change_degrees: [1, 2, 3]
      replacement_null_discriminants: small-degree non-invertible endomorphism families
      deduplication: by base-field isomorphism, with a logged count of j-equal but inequivalent pairs
    implementation: >-
      Exhaustive curve enumeration with an explicit automorphism search over the
      base field and over the splitting extension, a j-only oracle used solely as
      the tautology check, an independent certificate verifier sharing no state
      with the producer, and the lane s existing collision-search driver for the
      replacement null.
    budget:
      wall_clock_seconds_per_run: 600
      maximum_memory_gb: 8
      maximum_runs: 40

  falsification_conditions:
    - >-
      F1 - any ordinary curve with a defect greater than 1. R1 is false, which
      contradicts a classical theorem and therefore first indicts the
      implementation; independent review is required before any description.
    - >-
      F2 - the defect equals 1 on every supersingular control curve. The
      apparatus cannot detect a rationality defect; the ordinary result is VOID
      and is reported as an instrument failure.
    - >-
      F3 - the real implementation agrees with the j-only oracle everywhere,
      including on the supersingular control. The arm is circular and produces no
      evidence about curves.
    - >-
      F4 - a curve satisfying all of the question s declared constraints that
      also instantiates its third control family. R2 is false.
    - >-
      F5 - an odd prime in the declared degree set ramified in the j = 1728 arm s
      maximal order. R4 is false.
    - >-
      F6 - a measured discount on the replacement null. That control does not
      discriminate what it was chosen to discriminate and must be redesigned
      before it is relied on.
    - >-
      F7 - THE SUPERSINGULAR CONTROL CANNOT BE RUN, for an infrastructure or
      budget reason or because no admissible control curve exists in the declared
      range. The record stands as a DERIVATION ONLY with its experimental arm
      WITHDRAWN. It must say so explicitly and must NOT report an unfalsifiable
      constant as a verified negative. NOTE THIS IS NOT F2 - a control that RUNS
      and returns 1 is an instrument failure under pause condition P1, whereas
      F7 is a control that never ran at all.

  interpretation_limits:
    - >-
      CLAIM TIER toy for the enumerated arm. THE SUPERSINGULAR ARM IS A CONTROL
      AND NOT A SUBJECT - permitted under ruling R4 because RQ-ECDLP-912694
      constraint 1 bounds the CLAIM space while its constraint 4 contemplates
      out-of-scope cells serving as controls. NO RESULT ABOUT SUPERSINGULAR
      CURVES MAY BE STATED FROM IT in either direction of its outcome; its only
      admissible reading is instrument dynamic range, and R1 s conclusion stays
      scoped to ordinary curves, citing the control only as evidence that the
      instrument could have returned otherwise.
    - >-
      A supersingular control returning delta = 1 is an INSTRUMENT FAILURE under
      GOAL-ENDO-001 pause condition P1 - measurement stops, the ordinary
      enumeration is marked attempted_and_inconclusive, and repair happens under
      a new contract. IT IS NOT A FINDING ABOUT SUPERSINGULAR CURVES. Stated
      separately because it is the case most likely to be misread later.
    - >-
      R1 is RECALLED classical mathematics reproduced in full so it can be
      checked without a library. It is a DERIVATION, and the enumeration verifies
      the IMPLEMENTATION over a finite range rather than the theorem.
    - >-
      NO ECDLP CLAIM OF ANY KIND. No exponent moves, no constant moves, no
      attack. The deliverable is an evidential correction and a control redesign.
    - >-
      R2 does not invalidate the lane s prior proposal. One of its assumptions
      would be upgraded to a theorem and one of its listed controls shown to be
      unavailable; the correction is BY SUPERSESSION with a new record, never by
      editing, and this record creates no such supersession.
    - >-
      R2 is a claim about a COMMITTED record s text as of the read recorded in
      structural_ingredients. If that question is later superseded with corrected
      scope, R2 becomes a historical statement about it as of that date.
    - >-
      NOT TESTABLE AT REACHABLE SCALE, STATED PLAINLY - and in this case the
      limitation runs the other way from usual. The enumeration at 7 to 9 bits
      transfers NOTHING to cryptographic prime sizes; only the DERIVATION is
      claimed uniform, and the derivation is what a reviewer must check. Nothing
      here bears on any standardised curve as a cryptographic target; it bears on
      how this program s experiments about them are controlled.
    - >-
      Timeouts, crashes and infrastructure failures are never negative
      mathematical evidence (AGENTS.md core rule 5).

