hypothesis:
  id: H-ECDLP-66d6fc
  question_id: RQ-ECDLP-912694

  statement: >-
    SCOPE: ordinary elliptic curves over prime fields at 7 to 9 bits, enumerated
    exhaustively, plus a supersingular positive CONTROL permitted under ruling R4
    as a control and forbidden as a claim. CLAIM TIER toy for the enumerated arm
    and DERIVATION for the algebraic statement. NO ATTACK, NO EXPONENT, NO STATUS
    CHANGE TO RQ-ECDLP-912694, IDEA-20260812-c49409 OR ANY OTHER RECORD.
    NO RESULT ABOUT SUPERSINGULAR CURVES IS STATED OR MAY BE DERIVED FROM THIS
    RECORD. The supersingular control's only admissible reading is instrument
    dynamic range.
    Four statements, of which the first is a derivation, the second and fourth
    are scope findings about a committed record, and the third is a replacement
    design.
    R1 - NO ORDINARY AUTOMORPHISM IS IRRATIONAL. For an ordinary curve over a
    finite field the geometric endomorphism ring is an order in an imaginary
    quadratic field, hence commutative, and it contains Frobenius. An
    endomorphism is defined over the base field exactly when it commutes with
    Frobenius, and commutativity is automatic. So the rational and geometric
    automorphism groups coincide and the RATIONALITY DEFECT - the ratio of the
    geometric to the rational automorphism group order - is identically 1 for
    every ordinary curve over every finite field.
    R2 - THE SCOPE FINDING. RQ-ECDLP-912694 lists among its curve families,
    verbatim, "extension-field special-j controls where the named automorphism is
    not F_p-rational", while its constraints declare, verbatim, "Ordinary curves
    only; supersingular and extension-field-only maps are out of scope." By R1
    that third family is EMPTY - a non-rational automorphism requires
    non-commutative endomorphism structure, which the same constraint excludes.
    The question names a control it forbids itself from instantiating, and a null
    result there is currently attributable to a cause that cannot occur.
    R3 - THE REPLACEMENT that must do the job the empty cell was meant to do.
    R4 - A SECOND SCOPE ASYMMETRY. The question restricts to odd prime degrees,
    verbatim "Odd prime degrees ell in {3,5,7,11,13}". For the j = 0 arm the
    ramified prime of the relevant discriminant is 3, which is in scope; for the
    j = 1728 arm it is 2, which is excluded. The two arms are therefore not
    symmetric with respect to ramification, and a side-by-side comparison that
    does not correct for this reads a scope artifact as an arithmetic difference.

  mechanism: >-
    Rationality of an endomorphism over the base field is exactly commutation
    with Frobenius. For ordinary curves the endomorphism algebra is an imaginary
    quadratic field, so commutation is free and rationality is automatic; the
    only way to manufacture an irrational endomorphism is to make the algebra
    non-commutative, which for elliptic curves over finite fields means
    supersingular. The question s third control family therefore sits exactly at
    the intersection of two conditions the question declares mutually exclusive.
    The argument costs no compute and closes, by algebra, a control that was
    going to be built, run and reported as an unexplained empty cell.
    WHY THE MEASUREMENT ARM EXISTS AT ALL AND WHY IT NEEDS A POSITIVE CONTROL. An
    enumeration reporting that the defect equals 1 on every ordinary curve is, by
    itself, an UNFALSIFIABLE CONSTANT - a null whose band has width zero by
    construction, which is precisely the failure this control lane exists to
    prevent. The enumeration is worth running ONLY alongside an object on which
    the defect is genuinely greater than 1 and the same code path detects it.
    That object is a supersingular special-j curve, which the question excludes
    from its CLAIM space. Ruling R4 permits it AS A CONTROL AND FORBIDS IT AS A
    CLAIM, on the reading that constraint 1 bounds the claim space while
    constraint 4 contemplates out-of-scope cells serving as controls. Running the
    control therefore asserts NOTHING about supersingular curves; it establishes
    only that the measurement is capable of returning a defect other than 1. If
    the control cannot be run at all - infrastructure, budget, or no admissible
    control curve in range - this record must be reported as a DERIVATION ONLY
    with its experimental arm withdrawn, never as a verified negative and never
    as an unfalsifiable constant dressed as a result.
    THE REPLACEMENT, R3, IN TWO PARTS. Part (a) is the supersingular arm above,
    the only object that instantiates the question s intended control. Part (b)
    is ordinary curves with a small-degree but NON-INVERTIBLE endomorphism, which
    separates "the discount needs an INVERTIBLE map" from "the discount needs a
    CHEAP map" entirely inside the declared ordinary scope at zero scope cost.
    Part (b) must now carry the discriminating load that part (a) was silently
    assumed to share.

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Null deliberately. No algorithm is proposed, no ECDLP exponent moves, and
    under the target-result profile this record is non-target-class by
    construction. The only cost statement is that R1 replaces an experimental
    control - which would have cost curve enumeration plus collision-search runs
    plus a report - with a paragraph of algebra.

  rerandomization: null

  proof_search_map:
    bottleneck: >-
      Not an algorithmic bottleneck but an EVIDENTIAL one. Every null result this
      lane produces about the automorphism discount currently has two live
      explanations - the symmetry is not rational here, and the mechanism or the
      implementation is wrong - and the first is what the extension-field control
      was supposed to settle. If the first is impossible, every such null must be
      charged entirely to the second, which is a materially stronger conclusion
      from the same data.
    baseline_embedding:
      parameter_slice: >-
        Dropping ordinariness recovers the general case, where the defect can
        exceed 1 and the question s third control family is non-empty, namely
        supersingular curves. The intended control is recovered as the exact
        non-ordinary slice of this frame - it was never wrong, it was mis-scoped.
      reproduction_check: >-
        Frozen symbolic fixture computed before any curve is drawn - for a
        supersingular j = 0 curve over a prime field where the relevant root of
        unity is not rational, the measured defect must be strictly greater than
        1. Without this the ordinary result is unfalsifiable and worthless. THIS
        FIXTURE IS THE POSITIVE CONTROL AND IT IS BLOCKING.
    observation_collision:
      observable: >-
        The rationality defect, an integer ratio of two automorphism group
        orders.
      distinct_preimage_search: >-
        REQUIRED AND IT SUCCEEDS. An ordinary special-j curve where the defect is
        1 because the claim forces it, and a generic ordinary curve where the
        defect is 1 trivially because the automorphism group has order 2, read
        the SAME value for completely different reasons. So the defect ALONE does
        not carry the claim - the claim is carried by the PAIR of the defect and
        the rational automorphism order, and both are required metrics. A design
        reporting only the defect would report a constant and prove nothing. This
        audit changes the required metrics.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the defect fixed at 1 and vary the forgotten structure, namely
          commutative against non-commutative endomorphism rings. The intrinsic
          invariant distinguishing them is the rank of the endomorphism ring as a
          module, which is exactly the ordinary-against-supersingular boundary
          the question s constraints draw in the wrong place relative to its
          scope.
        predicted_gain: >-
          Converts an empty experimental cell into a stated boundary - the
          question s third control lives on the far side of that line and no
          amount of enumeration inside the ordinary world will populate it.
      - transform: boundary_lift
        proposed_object: >-
          Lift the rationality ASSUMPTION carried by the lane s only prior
          proposal to a THEOREM, removing a live assumption from a committed
          record at zero cost.
        predicted_gain: >-
          One fewer assumption on that proposal and a strictly stronger reading
          of any null it produces.
    quantifier_order: >-
      FOR ALL finite fields of characteristic other than 2 and 3, FOR ALL
      ORDINARY curves over them, FOR ALL endomorphisms in the geometric
      endomorphism ring - the endomorphism is defined over the base field. The
      universal quantifier over the endomorphism comes LAST and is the whole
      content; the question s control cell would require one for which it fails,
      and the order forbids one from existing. Reversing the order, that THERE
      EXISTS a field and a curve for which SOME endomorphism is irrational, is
      satisfiable - by supersingular curves, which is precisely the replacement s
      part (a).
    method_ceiling:
      strongest_certifiable_claim: >-
        An exhaustive computational verification that the defect equals 1 for
        every ordinary curve over every prime field in the declared 7 to 9 bit
        range, together with a demonstration on the supersingular positive
        control that a defect greater than 1 is detectable by the same code path.
        It CANNOT prove R1, which is a recalled classical theorem plus the
        reproduced argument, and it can certify nothing about characteristic 2
        or 3.
      nearby_object_control: >-
        The nearby object where the conclusion FAILS - supersingular j = 0 over a
        prime field where the relevant root of unity is not rational. The
        endomorphism algebra is non-commutative and the extra automorphisms are
        genuinely not base-field rational. A method that reports a defect of 1
        there is not measuring rationality and every ordinary reading is void. A
        second nearby object is the same curve base-changed to a quadratic or
        cubic extension, where the automorphism group is unchanged but the
        endomorphism ring can grow - the check that the measurement is sensitive
        to the field it is asked about.
    proof_obligations:
      - claim: For an ordinary curve the geometric endomorphism ring is an order in an imaginary quadratic field.
        responsibility: baseline
      - claim: Frobenius lies in the endomorphism ring, and an endomorphism is base-field-rational exactly when it commutes with Frobenius.
        responsibility: correctness
      - claim: Commutativity therefore forces every endomorphism to be rational.
        responsibility: strictness
      - claim: Hence the question s third declared control family is empty.
        responsibility: scope
      - claim: The measurement apparatus detects a defect greater than 1 when it exists.
        responsibility: feasibility
      - claim: The j = 1728 arm cannot observe ramified-prime behaviour under the odd-degree constraint.
        responsibility: scope
    not_applicable_reason: null

  assumptions:
    - >-
      Characteristic is neither 2 nor 3, so that the automorphism group has order
      2, 4 or 6 and the special-j classification applies. In characteristic 2 and
      3 the groups are larger; R1 s conclusion still holds because the
      commutativity argument is characteristic-free for ordinary curves, but the
      numerology in the replacement design does not.
    - >-
      Rational means defined over the field the curve is presented over, and the
      criterion used is commutation with Frobenius. This is the single
      load-bearing external fact and it is stated so it can be checked.
    - >-
      The automorphism group is computed as a GROUP, twice - once by exhibiting
      base-field-rational isomorphisms explicitly, and once over a splitting
      extension - and the defect is the ratio of the two orders. INFERRING THE
      AUTOMORPHISM ORDER FROM THE j-INVARIANT WOULD MAKE R1 UNFALSIFIABLE BY
      CONSTRUCTION and is forbidden in the design.
    - >-
      Lawful defensive work on public constructions and toy benchmarks only.

  heuristic_assumptions:
    - id: HEUR-RAT-1
      formal_statement: >-
        NO DISTRIBUTIONAL HEURISTIC IS LOAD-BEARING IN R1 OR R2, and this is
        asserted rather than left implicit. R1 is a universally quantified
        algebraic statement with no probability in it; the experiment is an
        exhaustive enumeration over a finite declared range, not a sample; and R2
        is a statement about the text of a committed record. The single
        assumption is that the classical theorem recalled in R1 is correctly
        recalled.
      random_model_justification: >-
        Rigorous ingredient - the criterion that an endomorphism is
        base-field-rational exactly when it commutes with Frobenius, plus
        commutativity of an imaginary quadratic order. DISTRIBUTION IMITATED -
        NONE, deliberately. A record that invented a distributional heuristic
        here in order to fill the field would be padding, and the honest content
        of this field is that there is nothing to assume.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-fa2ed6]
      falsification_condition: >-
        A single ordinary curve in the enumerated range with a defect greater
        than 1. That contradicts a classical theorem and therefore FIRST indicts
        the implementation; independent review is required before any
        description.
    - id: HEUR-RAT-2
      formal_statement: >-
        INSTRUMENT SENSITIVITY. The defect-measurement apparatus is sensitive
        enough to report a defect greater than 1 when the underlying object has
        an irrational automorphism - specifically, on a supersingular j = 0 curve
        over a prime field where the relevant root of unity is not rational, the
        apparatus returns a defect of 3 or 6 and not 1. This is an assumption
        about the CODE, not about mathematics, and until it is discharged the
        ordinary result carries no information at all.
      random_model_justification: >-
        Rigorous ingredient - on such a curve a primitive cube root of unity is
        not in the base field, so the automorphism scaling the abscissa by it is
        visibly not base-field rational while being geometrically present. The
        ground truth is therefore known in advance and the control has a
        pre-registered answer. Distribution imitated - none.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-fa2ed6]
      falsification_condition: >-
        The apparatus returning a defect of 1 on every supersingular control
        curve. It cannot detect a rationality defect at all; the ordinary result
        is marked attempted_and_inconclusive under GOAL-ENDO-001 pause condition
        P1 and is reported as an INSTRUMENT FAILURE, never as support for R1 and
        NEVER AS A FINDING ABOUT SUPERSINGULAR CURVES. IF THE CONTROL CANNOT BE
        RUN AT ALL, for an infrastructure or budget reason, THIS HEURISTIC
        REMAINS UNDISCHARGED and the ordinary arm must be reported as unfalsified
        rather than as confirmed.

