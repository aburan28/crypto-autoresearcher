hypothesis:
  id: H-SSIQ-137200
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  batch_id: BATCH-005
  statement: >-
    IDENTICAL TO H-SSIQ-9e2c71 (and to H-SSIQ-18dc91 before it), restated
    because BATCH-004 could not test it: on the supersingular 2-isogeny
    graphs built in BATCH-003 (p = 1 mod 12, the same 12 pre-registered
    primes, byte-identical construction code) and labelled with delta_E via
    BATCH-004's independently-verified direct in-session smooth-degree
    isogeny search, greedy local descent on delta_E reaches the F_p-rational
    locus (delta_E = 1) in FEWER steps, as a function of graph size N, than
    an undirected random walk on the same graph: gamma_greedy < gamma_random.
    A DETECTABLE GAP is a computable delta_E-gradient in the sense of lever
    L4's revisit condition; no detectable gap means L4's obstruction stands
    unresolved by this test.
    WHAT IS NEW: the confirmatory prime set is selected by a CORRECTED
    truncation fallback -- a cumulative-ascending-prefix check against the
    reserved compute budget, replacing BATCH-004's individual per-prime cap
    (named as contract defect GD-7, ledger/goals/GOAL-SSIQ-001/goal.yaml).
    The delta_E instrument itself (B=X=23 smooth-degree search,
    Sutherland-sourced modular polynomials, Velu-formula verification) is
    UNCHANGED and reused by reference: BATCH-004 already independently
    confirmed it works. This hypothesis needs no new instrument, no new
    dataset, and no route change -- only a corrected budget check on the
    SAME already-collected per-prime cost estimates.
  statement_note: >-
    THIS IS H-SSIQ-9e2c71 WITH ITS BLOCKER REMOVED, NOT A NEW HYPOTHESIS. The
    prediction, the decision logic, and the scope are unchanged; only the
    admission rule for which primes get a real Phase -1 run changes. A
    separate hypothesis id is minted (rather than reopening H-SSIQ-9e2c71)
    because AGENTS.md immutability treats a hypothesis record as append-only
    once archived, and H-SSIQ-9e2c71 is already archived as analyzed under
    EV-SSIQ-94de20 -- this record supersedes it for BATCH-005's purposes and
    says so explicitly, exactly the pattern H-SSIQ-9e2c71 itself used against
    H-SSIQ-18dc91.
  supersedes: H-SSIQ-9e2c71
  supersedes_note: >-
    H-SSIQ-9e2c71 is retained unedited, per AGENTS.md immutability. Its
    real-arm prediction was never computed (analyzed, EV-SSIQ-94de20): the
    Phase -1 coverage gate failed under a truncation-fallback formula now
    named as defective (GD-7). This record inherits its statement and scope
    unchanged and supplies the corrected admission rule.
  mechanism: >-
    Unchanged from H-SSIQ-9e2c71's mechanism: for each vertex (j-invariant)
    in the graphs BATCH-003 already built, delta_E is supplied by BATCH-004's
    validated direct-computation instrument (bidirectional meet-in-the-middle
    search over B-smooth degrees, B=X=23, mirroring the archived source's
    Algorithm 1-3). What changes is upstream of the instrument: WHICH primes
    get a real, full Phase -1 search. BATCH-004's fallback computed, for
    each of the 12 pre-registered primes ascending by size, an estimated
    full-coverage cost (n_non_fp_rational_vertices * measured_per_vertex_cost,
    the smoke test's single largest-prime measurement applied flat) and
    checked each estimate against T_prime = 0.5*7200/12 = 300s individually
    -- an equal 1/12 share of half the run's reserved budget. This
    hypothesis's contract instead checks the CUMULATIVE SUM of the ascending
    prefix's estimated costs against the reserved budget directly (3600s at
    the half-budget reading, 7200s at the full-budget reading), which is the
    check an ascending-prefix selection rule that already discards the
    expensive tail actually needs. Using BATCH-004's own already-committed
    per-prime estimates unchanged, this admits 4 primes at the half-budget
    reading and 6 at the full-budget reading -- both clear the >=4-prime
    floor the Phase -1 gate requires, without any change to the cost
    estimate itself.
  assumptions:
    - >-
      The cumulative-prefix budget check is itself sound: summing
      independently-estimated per-prime costs and comparing the running
      total to a reserved budget correctly predicts whether the ACTUAL
      wall-clock cost of running Phase -1 on that prefix will fit. This is a
      genuinely new assumption BATCH-004's individual-cap formula did not
      need to make (each prime's estimate was checked in isolation there);
      it is tested directly by simply running Phase -1 on the admitted
      prefix and observing whether it completes within budget -- if it does
      not, the contract's own C-COVERAGE control and a mid-run abort rule
      (frozen before data) handle the shortfall as a per-prime coverage
      finding, not a fabricated result.
    - >-
      The admitted prefix (toward the smaller end of the 12 pre-registered
      primes) is a narrower N-range than the originally intended 203-1800
      vertex span. If this hypothesis's contract cannot cheaply widen
      coverage (e.g. by per-prime B/X pinning for excluded larger primes,
      per DEC-20260805-a4e04e D-5's caveat), any positive or negative
      finding is scoped to that narrower N-range explicitly, and the
      fitting-window risk documented in instrument_calibration
      (DEC-20260805-be2f87) is disclosed as a limitation, not silently
      inherited.
    - >-
      Inherited unchanged from H-SSIQ-9e2c71: a collision within the
      searched smoothness bound is found for every (or nearly every)
      non-F_p-rational vertex on the admitted primes; where it is not, that
      vertex's delta_E is UNRESOLVED (an upper bound was searched, not an
      exact minimum), reported as such, and handled per C-COVERAGE.
  proof_search_map:
    not_applicable_reason: >-
      NOT a proof-oriented hypothesis, inherited unchanged from H-SSIQ-9e2c71
      and H-SSIQ-18dc91 before it: a direct instrument-level test of whether
      a computable delta_E-gradient exists, not a proposed mechanism for
      lowering a hard problem's cost.
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    NULL AND REQUIRED TO BE, inherited unchanged. A detected gradient does
    not itself constitute a complexity claim, and the corrected budget check
    introduced here changes only which toy-scale primes get tested, not what
    the test measures or claims.
  heuristic_assumptions: []
  heuristic_assumptions_note: >-
    None numbered, inherited unchanged. Same standing as H-SSIQ-9e2c71: the
    search mirrors the archived source's Algorithm 2 STRUCTURE but makes no
    claim about the archived source's own Heuristic 1 at any scale where its
    asymptotic content is invoked or tested.
  status: analyzed
  status_note: >-
    analyzed, set by the Coordinator per AGENTS.md rule 1 (DEC-20260805-5f5ac6,
    BATCH-005). The corrected cumulative-budget contract WORKED: the Phase
    -1 gate passed for the first time in this campaign and a real M-GAP
    was computed on real, in-session-computed delta_E labels
    (gamma_greedy=0.23354, gamma_random=0.40140, m_gap=+0.16786). But the
    terminal branch is CONTROL-FAILURE-VOID, and independent review found
    two further reasons this record's own real-arm prediction remains
    UNTESTED rather than tested-and-voided cleanly: C-SEARCH-BIAS's
    comparability test has essentially no statistical power at n=20 (so
    the control failure itself is not confirmed evidence of construction-
    order contamination, EV-SSIQ-f3ce32 O-4), and C-NULL-LABEL -- the
    other control this run's decision branch cites -- is dead code
    (EV-SSIQ-f3ce32 O-5, GD-9). A third, independent defect (PD-2,
    GD-8) invalidates the reported gamma_greedy point estimate on a
    separate ground regardless of the control question. Status: analyzed,
    not supported and not weakened -- the prediction was computed but its
    result cannot be trusted at face value pending BATCH-006's fixes to
    GD-8/GD-9, both zero-new-search-cost against already-collected data.
    H-SSIQ-36e970 restates this hypothesis unchanged for BATCH-006's
    corrected amendment, the same append-only pattern this record itself
    used against H-SSIQ-9e2c71.
  superseded_by: H-SSIQ-36e970
  superseded_by_note: >-
    H-SSIQ-36e970 is IDENTICAL to this record's statement and scope,
    restated because BATCH-005 could not test it cleanly (a real number
    was computed but is voided by GD-8/GD-9, control-code defects, not by
    a falsification of the prediction). Minted separately rather than
    reopening this record, per AGENTS.md immutability, exactly as this
    record was minted against H-SSIQ-9e2c71.
  scope_ceiling:
    claim_tier: toy
    detail: >-
      Toy scale, inherited from H-SSIQ-9e2c71: graphs from 203 to 1800
      vertices (narrower in practice on the corrected prefix, per assumption
      2 above), p up to 21601 (15 bits), B=X=23. No result transfers to
      cryptographic scale.
  why_this_test_and_not_another: >-
    It reuses BATCH-004's independently-validated delta_E instrument
    unchanged (EV-SSIQ-94de20 O-1) rather than rebuilding it, and it removes
    the exact and only blocker BATCH-004 found -- a budget-allocation defect
    in the truncation fallback, GD-7 -- using numbers BATCH-004 already
    computed and committed, at zero re-measurement cost to identify and an
    estimated 3042-6138s (well inside the ~7109s this run's budget left
    unspent) to execute. This was DEC-20260805-a4e04e's single next action
    and both reviewers' top-ranked BATCH-005 recommendation.
  owner: coordinator
  created_at: '2026-08-05'
