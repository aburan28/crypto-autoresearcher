hypothesis:
  id: H-ECQ-0ed5c8
  question_id: RQ-ECQ-80f23c
  supersedes: H-ECQ-8b600d
  supersedes_reason: >-
    H-ECQ-8b600d moved proposed -> analyzed at DEC-20260823-ee9162 and may not move further: its
    named mechanism was refined rather than confirmed (the tuple moves the envelope through the
    flat-arm intercept, R^2 = 0.7732, not through the coefficient-content statistic the hypothesis
    identifies, R^2 = 0.19165243721035774), that intercept result is unreplicated, its own
    required_null was never run because the rung meant to supply it is not a null object, its
    load-bearing negative sits at 37.0 percent coverage, and three load-bearing statements of the
    producer narrative are false against its own deliverable. H-ECQ-8b600d is immutable and is not
    edited. THIS RECORD DOES NOT REOPEN ANY OF THAT. It carries forward only what survived
    independent re-derivation, and it changes the object under test: WHAT IS ENUMERATED, not how
    hard the same census is searched.

  standing_negative_read_this_first: >-
    NO RECORD CELL HAS BEEN TAKEN BY THIS CAMPAIGN, IN THREE BATCHES, ON ANY METRIC, AT ANY RANK
    THRESHOLD. The best curve this program has exhibited at certified rank >= 12 has minimal-model
    naive height 86.77369390941135, which misses the frozen r >= 12 naive-height cell
    (69.33884136527462) by +17.4349 and the published construction-class benchmark
    (79.32867457792244) by +7.4447. Nothing has been submitted to ICARM, no endpoint has been
    contacted, and the live board has not been re-read. This hypothesis predicts a MEASUREMENT, not
    a record, and nothing below may be read as though a cell had been taken or were close.
    RANK >= 31 OVER Q REMAINS AN OPEN WORLD RECORD (30, Alpoge-Howell 2026). NOTHING HERE IS
    PROGRESS TOWARD IT AND NO RESULT OF THIS HYPOTHESIS MAY BE PRESENTED AS SUCH.

  statement: >-
    THE TUPLE LEVER IS REAL AND THE REGION THAT WOULD USE IT HAS NEVER BEEN POPULATED. At fixed
    coefficient content -- a log-P2 window of width 0.25 -- the minimal-model naive-height envelope
    of Mestre's rank-12 quartic construction still spans 90 to 120 log units, so tuple choice moves
    the envelope and the spread is not a size artifact. What has never been tested is HIGH CEILING
    AT LOW CONTENT, and the reason is a measured quantity rather than an adjective: in an exhaustive
    census of 13077 admissible canonical integer 6-tuples of spread <= 74, only 90 (0.688 percent)
    have Shioda-Tate ceiling >= 13, and of those exactly ONE has log P2 below 5, two below 6 and
    twelve below 7. The stratum that the lever predicts is useful is, in the box enumerated so far,
    nearly empty; and the rank search that produced the campaign's load-bearing negative reached
    37.0 percent of the 46 load-bearing families, 19.8 percent of the ceiling-13 class and 8.5
    percent of the ceiling-15 class, with three runs stopped by wall clock.
    THE CLAIM: enumerate differently. Apply the free squarefree-discriminant pre-filter FIRST, over
    a spread box large enough to POPULATE the stratum -- a few hundred families of ceiling >= 13 at
    log P2 below 6 -- then rank-search all of them to FULL coverage across the full declared T-box
    with no height cap and no family cap, finishing the 2114 unsearched fibres of the existing 46 in
    the same run. That search is decisive in a way no further search of the old census can be, and
    BOTH of its branches are named here, before it runs.

  falsifiable_prediction_both_branches_named_in_advance:
    branch_A_lever_moves_rank_12:
      fires_when: >-
        The job returns at least one curve of CERTIFIED rank >= 12 whose minimal-model naive height
        is strictly below the construction-class benchmark READ FROM THE FROZEN SNAPSHOT AT RUN TIME
        (board entry id 1; 79.32867457792244 as of the frozen file), with the curve absent from the
        frozen ICARM snapshot by curve_key AND by a-invariants and absent from Cremona's tables.
      then: >-
        BATCH-541940'S CENTRAL INTERPRETIVE MOVE WAS WRONG. That move read the sub-80 zero at rank
        12 as a property of the construction's reach; branch A shows it was a property of an
        unpopulated and under-searched stratum. The tuple lever then moves the envelope AT CERTIFIED
        RANK 12, not merely in the rank-unconditioned envelope, and C1' becomes REACHABLE -- not
        met. Meeting C1' additionally requires the frozen r >= 12 cell (69.33884136527462, read at
        run time), first exhibition by this program, absence from Cremona's tables, ICARM-verifier
        acceptance, and the live board re-read at submission. A height below 79.32867457792244 and
        above 69.33884136527462 IS NOT A CELL AND IS NOT A NEAR-MISS.
    branch_B_lever_closed_with_a_measured_obstruction:
      fires_when: >-
        The job reaches FULL coverage of the enumerated ceiling->=13 stratum and of the 2114
        unsearched fibres of the existing 46 -- coverage fraction 1.00, reported as a fraction with
        its numerator and denominator -- and returns NO certified rank->=12 fibre below the
        benchmark read at run time.
      then: >-
        THE LEVER IS CLOSED FOR THIS CONSTRUCTION AT THIS SCALE, WITH A MEASURED OBSTRUCTION, AND
        THAT IS A COMPLETE RESULT. It upgrades a density-and-rate statement measured at 37 percent
        coverage into one measured at full coverage of a stratum built to be favourable, which is a
        number later work can reuse, re-scope or invert. It is never a fatigue report, it asserts no
        cell, and it does not generalise beyond Mestre's construction.
    branch_C_neither_fires:
      fires_when: >-
        Coverage of the target stratum is below 1.00 for any reason -- wall clock, PARI alarm,
        crash, memory, or an enumeration that fails to populate the stratum at all.
      then: >-
        NEITHER BRANCH FIRES AND NO NEGATIVE IS CLAIMED. A timeout, alarm or crash is an
        infrastructure outcome and never negative mathematical evidence (AGENTS.md rule 5). The
        REPORTABLE RESULT is the coverage fraction itself, with numerator and denominator, plus the
        stratum population count. BATCH-541940 failed exactly here: its coverage figure of 37.0
        percent appears in no producer artifact and was reconstructed by a reviewer.

  mechanism: >-
    Mestre's construction takes q(x) = prod (x - a_i) over an integer 6-tuple, sets
    p = q(x - T) q(x + T), writes p = g^2 - r with g the monic degree-6 truncation, and gives
    y^2 = r(x, T) with twelve sections free at x = +-T + a_i. THREE MEASURED FACTS SET THE OBJECT.
    (1) THE CAP IS 15, NEVER THE GENERIC ELLIPTIC-K3 18. Every one of the 13391 admissible families
    measured carries a multiplicative fibre at T = infinity of type I_4 (13352) or I_6 (39), which
    costs 3 or 5 unconditionally; the per-family ceiling is 18 - sum_v deg(v)(m_v - 1) on 13391 of
    13391, so the construction's own Shioda-Tate cap over Qbar(T) is 15.
    (2) THE STEERABLE QUANTITY IS THE NUMBER OF REDUCIBLE FINITE FIBRES, NOT THE FIBRE AT INFINITY.
    The fibre at infinity is essentially a constant of the construction and stratifies nothing; the
    generic configuration is six finite I_2 fibres (13257 families, ceiling 9), while the 14
    families that attain ceiling 15 have 20 finite I_1 fibres and nothing reducible. A family can
    host rank 12 only if its discriminant acquires essentially no repeated roots over the finite
    T-line, which is ONE RESULTANT ON A DEGREE-20 POLYNOMIAL and cheaper than a single one of the 73
    height evaluations it replaces. In the exhaustive box that filter cuts the measurement set from
    13077 families to 90.
    (3) THE ENVELOPE IS DRIVEN BY THE FLAT-ARM INTERCEPT. Regressing the envelope on the flat-arm
    intercept gives R^2 = 0.7732 over n = 13391, against R^2 = 0.19165243721035774 on the
    coefficient-content statistic H-ECQ-8b600d named. That measurement is UNREPLICATED, rests on one
    implementation with no run record, and its replication is a declared component of this
    hypothesis's test.
    PUT TOGETHER: the pre-filter selects the families that can host the rank, the intercept selects
    the families that are small, and the untested question is whether any family is BOTH. The
    enumerated census answers no at a rate of about 1 in 13077; this hypothesis says the answer is a
    property of the BOX and tests it by enlarging the box under the filter.

  assumptions:
  - >-
    THE PRE-FILTER IS A HEURISTIC WITH MEASURED SUPPORT, NEVER A STRUCTURAL IMPOSSIBILITY. The
    Shioda-Tate ceiling bounds the GENERIC rank over Qbar(T); a specialisation over Q is at least the
    generic rank and CAN exceed it. Measured support: across 5169 searched fibres with a computed
    ceiling, zero exceeded their family's ceiling and only seven attained it, so `extra <= 0` over
    |t| <= 800 in that sample. Discarded families are discarded on an efficiency argument, and no
    claim is made that a family of ceiling <= 11 cannot host a rank-12 specialisation.
  - >-
    Certified rank is a LOWER bound from exhibited points verified in exact arithmetic. Silverman
    specialisation motivates and never certifies. Nothing here says any curve has rank exactly 12.
  - >-
    Each family's ceiling is computed FROM ITS OWN FIBRE CONFIGURATION with the Euler check
    sum(deg * v_disc) = 24 = 12d, never from the generic K3 bound 18, which no family reaches.
  - >-
    Every frontier and benchmark constant is READ FROM THE FROZEN FILE AT RUN TIME. Hand-transcribed
    constants have failed twice: two of three pre-declared incumbents in H-ECQ-a609f8, and the
    rounded 79.329 in BATCH-541940's build_deliverables.py, which rounded in the direction that made
    the benchmark easier to beat.
  - >-
    The frozen ICARM snapshot of 2026-08-23T00:43Z (sha256
    118db069fcfc0cddc61bb00a235736202f01dc72d608b3c743bd342935cadc59, 289 curves) is the
    pre-registered baseline. It is not re-read, re-based or replaced; third-party movement on the
    live board is reported, never absorbed.

  target_cell_predeclared:
    rank_threshold: 12
    metric: naive_height
    incumbent_value_source: >-
      READ FROM coordination/goals/GOAL-ECQ-002/baseline/frontier_20260823.json AT RUN TIME. NEVER
      TRANSCRIBED INTO CODE.
    audit_value_do_not_hard_code: 69.33884136527462
    audit_value_use: >-
      This number exists so that a reader can audit the run, and so that the producer can ASSERT
      against it: read the value at run time and ABORT THE RUN if the read value differs from this
      audit value. It is not a constant to compute with. Frozen frontier entry: threshold 12,
      min_naive_height 69.33884136527462, curve_id 157, submitter Andrew Sutherland.
    frozen_snapshot_sha256: 118db069fcfc0cddc61bb00a235736202f01dc72d608b3c743bd342935cadc59

  intermediate_benchmark:
    value_source: >-
      READ FROM coordination/goals/GOAL-ECQ-002/baseline/icarm_database_20260823.json AT RUN TIME,
      entry id 1, field naive_height. NEVER TRANSCRIBED, AND NEVER ROUNDED.
    audit_value_do_not_hard_code: 79.32867457792244
    what: >-
      Frozen board entry id 1, curve_key 304790815056:-166878443731135320, ainvs
      [0, 0, 1, -6349808647, 193146346911036], rank_lower_bound 12, whose commentary field
      attributes it to Mestre (1982). THIS, NOT THE CELL, IS THE BRANCH-DECIDING NUMBER. Beating it
      means this program's tuple search outperforms the published construction-class best; the cell
      at 69.33884136527462 additionally requires beating an active program that improved twice
      inside the window this board covers.
    rounding_note: >-
      79.329 IS THE WRONG VALUE AND MUST NOT BE USED. Validator finding F7 caught it: it is a
      rounded transcription of 79.32867457792244, rounded in the direction that makes the benchmark
      marginally easier to beat. H-ECQ-8b600d carries 79.329 and is immutable; it is superseded on
      this point by DEC-20260823-ee9162 R16 and by this record.

  predictions:
  - metric: >-
      count of admissible families with Shioda-Tate ceiling >= 13 and log P2 < 6, in the enlarged
      spread box under the squarefree-discriminant pre-filter
    direction: higher
    minimum_effect: >-
      at least 200, against 2 in the exhaustive spread <= 74 census of 13077. Below 200 the stratum
      is not populated, the job cannot decide branch A or branch B, and the population count is
      itself the reportable result.
  - metric: >-
      coverage fraction of the target stratum plus the 2114 previously unsearched fibres of the
      existing 46 load-bearing families, reported as numerator over denominator
    direction: higher
    minimum_effect: >-
      1.00. Anything below 1.00 fires branch C. The comparison figure is 0.370 overall, 0.198 on the
      ceiling-13 class and 0.085 on the ceiling-15 class in BATCH-541940.
  - metric: minimum minimal-model naive height at certified rank >= 12 over the searched stratum
    direction: lower
    minimum_effect: >-
      To fire branch A it must fall strictly below the benchmark read at run time
      (79.32867457792244 as of the frozen file). The current best is 86.77369390941135. A fall that
      stops anywhere at or above the benchmark is branch B if coverage is 1.00 and branch C
      otherwise; it is NOT a partial success and must not be reported as approach or progress.
  - metric: >-
      envelope regressed on the flat-arm intercept, recomputed by a SECOND implementation with a run
      record
    direction: different
    minimum_effect: >-
      R^2 within 0.05 of 0.7732 replicates the batch's best positive result. R^2 materially below
      0.7232 withdraws it, and the mechanism clause (3) above is then superseded rather than
      carried.
  - metric: >-
      certified-rank distribution of a bottom rung with genuinely no rational sections
      (RT-CONTROL-2), against the random-curve null at matched naive height (RT-CONTROL-3, n = 200)
    direction: different
    minimum_effect: >-
      The genuine null rung must be statistically indistinguishable from the random-curve null at
      matched height; the BATCH-541940 k = 0 rung was not (12 of 15 at rank >= 3 against 0 of 79).
      If the genuine null rung instead shows envelopes indistinguishable from the k = 6 treatment,
      rank buys nothing on the size axis and the whole A2 premise must be rewritten, not re-aimed.

  falsification_conditions:
  - >-
    THE LEVER IS FALSIFIED AT RANK 12, FOR THIS CONSTRUCTION AND THIS SCALE, IF BRANCH B FIRES: full
    coverage of a properly populated high-ceiling low-content stratum returning no certified
    rank->=12 fibre below the benchmark read at run time. This is a falsification of this
    hypothesis's own forward claim and is declared in advance as a complete result, with a measured
    obstruction attached.
  - >-
    THE POPULATION CLAIM IS FALSIFIED if the enlarged, pre-filtered box yields fewer than 200
    families of ceiling >= 13 at log P2 < 6 -- i.e. if high ceiling at low content is not merely
    rare in a small box but stays essentially absent as the box grows. The untested region is then
    untestable by this enumeration, which is itself a measured statement about the construction and
    must be reported as one.
  - >-
    THE MECHANISM CLAUSE (3) IS FALSIFIED if the flat-arm intercept regression fails to replicate on
    a second implementation. The campaign's best positive result is then withdrawn and
    DEC-20260823-ee9162 R3(g) is superseded.
  - >-
    NOT FALSIFIED by failing to reach 69.33884136527462. That is an active competitive record on a
    live board.
  - >-
    NOT FALSIFIED by a timeout, PARI alarm, crash or memory exhaustion. Those fire branch C, and the
    coverage fraction is reported instead. An infrastructure outcome is never negative mathematical
    evidence, and coverage that is not REPORTED as a fraction is the defect BATCH-541940 was charged
    with.
  - >-
    NOT FALSIFIED, AND NOT CONFIRMED, by anything measured about the rank-unconditioned envelope
    minimum. The corrected comparison target is a reported height against the frozen frontier value
    AT THE CERTIFIED RANK CLAIMED (DEC-20260823-ee9162 R13). The rank-unconditioned minimum of
    25.4297 is a rank-2 curve and beats nothing.

  required_null:
  - >-
    RT-CONTROL-2, OWED FOR A THIRD BATCH AND NOW IN A SHARPER FORM: a bottom rung that actually has
    no rational sections. Build q irreducible of degree 6 whose Galois group admits no index-2
    subgroup fixing a section pair (S_6 suffices), still solving phi = 0 for admissibility, and
    VERIFY rather than assume it, by exhibiting that ellrank finds no more points than the
    random-curve null at matched height. The BATCH-541940 k = 0 rung is NOT a null object: with
    irreducible quadratic factors the trace of a Galois-conjugate section pair is rational while
    n_sections counts only rational roots, so the rung retained large forced rational rank (12 of 15
    at rank >= 3 against 0 of 79 random curves at matched height) and the contrast the null exists
    to test -- 12 sections against 0 -- has never been run.
  - >-
    RT-CONTROL-3 EXTENDED: the random-curve rank null at matched naive height, at h approximately
    60, 70, 80, 93 and 100, n = 200, same instrument and same alarm. Its existing form (n = 79,
    stopped by wall clock) is a BOUND and not a distribution, and its own author reported it that
    way.
  - >-
    THE CHEAPEST CONFIRMING MUTATION, one number-field arithmetic call: form the trace P + P^sigma of
    one Galois-conjugate pair of sections at a k = 0 family's envelope argmin and check whether it is
    a rational point of infinite order on the minimal model.

  proof_search_map:
    bottleneck: >-
      The joint density of (high Shioda-Tate ceiling, low coefficient content) among admissible
      canonical 6-tuples, and the per-fibre cost of certifying rank 12. Removing either changes what
      the construction can reach at a given height; searching the same census harder changes neither.
    baseline_embedding:
      parameter_slice: >-
        Mestre's published tuple A (-17, -16, 10, 11, 14, 17), and frozen board entry id 1 at
        rank 12, naive height 79.32867457792244.
      reproduction_check: >-
        Frozen regression fixture, already reproduced twice independently: tuple A's envelope
        recomputes at 79.6237719007 at t = 4 by two implementations sharing no code, and the ICARM
        naive-height convention recomputes from a-invariants for seven board curves to
        0.000000e+00. Any new implementation must reproduce both before its own numbers are read.
    observation_collision:
      observable: >-
        The pair (certified rank lower bound, minimal-model naive height) per fibre, together with
        the family's own fibre census and its Euler check sum(deg * v_disc) = 24 = 12d.
      distinct_preimage_search: >-
        Two distinct tuples reaching the same (rank, height) pair, or one family whose envelope
        minimum and rank-12 locus coincide. In BATCH-541940 they were DISJOINT within the headline
        family -- envelope minimum at t = 4 with h = 69.28330998318052 at certified rank 8, rank-12
        fibre at t = 23, 17.49 log units higher -- and that disjointness is the quantity this job
        must measure across a populated stratum rather than one family.
    constructive_transforms:
    - transform: specialization_pack
      proposed_object: >-
        The squarefree-discriminant pre-filtered enumeration: admissible canonical 6-tuples over an
        enlarged spread box, filtered by one resultant on the degree-20 discriminant BEFORE any
        height evaluation.
      predicted_gain: >-
        Measurement set cut by a factor of about 145 in the exhaustive box (13077 -> 90) at a cost
        cheaper than one of the 73 height evaluations it replaces, which is what makes full coverage
        of the stratum affordable at all.
    - transform: stronger_invariant
      proposed_object: >-
        The count of REDUCIBLE FINITE fibres as the stratifying invariant, replacing the fibre at
        T = infinity, which is near-constant (I_4 on 13352 of 13391) and stratifies nothing.
      predicted_gain: >-
        A stratification that is a measurement rather than an arithmetic relabelling. The
        BATCH-541940 section-3 column equalled sum(m_v - 1) + 1 on every row and was correct for
        0.36 percent of them.
    quantifier_order: >-
      STATED EXPLICITLY BECAUSE THE PREVIOUS ROUND'S CENTRAL ERROR WAS A QUANTIFIER ERROR. The claim
      is: THERE EXISTS a family F in the pre-filtered enlarged box with ceiling(F) >= 13 and
      log P2(F) < 6, and THERE EXISTS t in the declared 73-value T-box with |t| <= 800, such that the
      specialisation F_t has certified rank >= 12 and naive height below the benchmark read at run
      time. Its negation, which is branch B, is: FOR ALL such F and FOR ALL such t in the ENUMERATED
      AND SEARCHED set, no such fibre exists -- and that negation is claimed only over the set
      actually searched, with the coverage fraction attached. Nothing is quantified over all tuples,
      all spreads, or all rational t.
    method_ceiling:
      strongest_certifiable_claim: >-
        A certified rank LOWER bound from exhibited points in exact arithmetic, at a height computed
        from a model proved globally minimal, for a curve checked against the frozen board by
        curve_key AND by a-invariants and against Cremona's tables. Nothing above that tier may be
        asserted, and rank equality is never claimed.
      nearby_object_control: >-
        Mestre's published tuples A and B, both assigned ceiling 15 by the ceiling code, consistent
        with tuple A's published rank >= 11 over Q(T); and frozen board curve id 108
        (ainvs [1, -1, 0, -415, 3481], h = 29.772761127041008), which this pipeline has already
        rediscovered at its exact board height and which any provenance check must flag rather than
        report as novel.
    proof_obligations:
    - claim: >-
        The squarefree-discriminant pre-filter has no false negatives on the ceiling->=13 target
        set, i.e. it never discards a family the search needed.
      responsibility: correctness
    - claim: >-
        The enlarged box populates the stratum: at least 200 families of ceiling >= 13 at log P2 < 6.
      responsibility: feasibility
    - claim: >-
        Coverage of the target stratum and of the 2114 unsearched fibres reaches 1.00 within budget.
      responsibility: runtime
    - claim: >-
        Every reported curve is first exhibited by this program, checked against the frozen snapshot
        by curve_key and by a-invariants and against Cremona's tables.
      responsibility: scope
    - claim: >-
        The bottom rung of the null ladder has no rational sections, verified rather than assumed.
      responsibility: baseline

  structural_ingredients:
  - description: >-
      Shioda-Tate for an elliptic surface, the residue-characteristic-0 Kodaira classification, and
      the Mazur torsion bound, used ONLY through in-repo computation: per-family ceilings as
      18 - sum_v deg(v)(m_v - 1) with the Euler check sum(deg * v_disc) = 24 = 12d, and the choice of
      l > 16 in the rank certifier.
    citation: Shioda-Tate; Kodaira classification; Mazur torsion bound
    provenance: internal
    verified_by: >-
      TASK-20260823-e96bb6 (M12: arithmetic on all 13391 families plus 8 from-scratch
      re-derivations; M3 with four positive and three negative controls) and TASK-20260823-33a825
      (RT-RD3: 6 from-scratch re-derivations). THE THEOREM NAMES ARE NOT READ FROM ANY PAPER IN THIS
      PROGRAM; what is relied on is the in-repo computation and its own internal consistency test,
      which a wrong fibre census would fail.
    role: ceiling bound and rank-certifier soundness

