  statement: >-
    The integer 33554431 has bit length 25. Its bits are twenty-five 1s.
    Reaching it by doubling and adding uses 24 doublings and 24
    additions. Twenty-five exceeds twenty-four by 1. Twenty-four
    equals twenty-four, so that gap is 0. The product of 25, 24, and
    24 is 14400. Their sum is 73. Two readings of the addition count
    are both 24, so that gap is 0 and their product is 576.
  mechanism: >-
    The proposal writes the counts 25, 24, and 24. This contract
    checks those integers. It does not add a curve point.
