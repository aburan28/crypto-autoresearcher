  design_note: >-
    DESIGN ONLY. The object, the dichotomy and the configuration-model null
    are the idea-generator's, and its planted-separator positive control is
    already the strongest instrument work in this batch - a defect of known
    size that must fire at a predicted degree. The Coordinator's own
    contributions are: an explicit non-degeneracy check on the null band; a
    hard INPUT PRECONDITION, since the whole design depends on post-merge
    matrices that may not exist; and the pre-declared consequence of the
    null-matched outcome, which here takes the form of a generality
    statement rather than a curve statement, because this lane concerns the
    number field sieve and contains no elliptic curve at all. No status of
    any record is changed and nothing here is evidence.

  status: proposed
  proposed_by: idea-generator

  statement: >-
    TEST BOUNDARY FIRST. Post-merge sparse matrices produced by ONE
    implementation at 60, 80 and 100 digits, for two problems (factoring and
    discrete logarithm), partitioned by two named heuristic hypergraph
    partitioners at k in {2, 4, 8, 16, 32, 64}. This is a MEASUREMENT OF A
    GRAPH PROPERTY of those matrices. It builds no parallel implementation,
    times no parallel run, and makes NO STATEMENT ABOUT ELLIPTIC CURVES OR
    THE ECDLP whatsoever.

    THE OBJECT. After filtering and merge, the number field sieve's linear
    algebra is repeated multiplication of a sparse matrix - rows relations,
    columns prime ideals - by a block of vectors. On a machine with more than
    one memory domain, the cost of that step carries a communication term
    equal, per iteration, to the number of vector entries crossing a domain
    boundary, which for a partition of the rows into k parts is the
    hypergraph CONNECTIVITY CUT of the column hyperedges: the sum over
    columns of (parts touched minus one). The exponent question this
    question's target asks is decided by one measurable quantity, the CUT
    FRACTION phi(k, M) = cut divided by the number of nonzeros, as a function
    of the matrix dimension M.

    THE DICHOTOMY, PRE-REGISTERED. EXPLANATION (E): if the relation
    hypergraph behaves like a random hypergraph with its degree sequences,
    phi(k, M) is bounded below by a constant for every k >= 2 and is
    essentially independent of M. Then per-iteration communication is
    Theta(M) times the block width, the total over the Krylov phase shares
    the arithmetic term's exponent, and NO partitioning, row ordering, nested
    dissection or structured elimination moves that exponent, because none of
    them can beat the cut of an expander. The deliverable under (E) is an
    OBSTRUCTION BLOCK at the inventor-protocol standard - the measured phi,
    its interval, the runs it is read from, and the scope it is claimed over
    - which closes the structure-exploiting linear-algebra class FOR THE
    EXPONENT while leaving it open for constants.
    EXPLANATION (S): if phi sits materially below the null or decays with M,
    the hypergraph has separable structure inherited from the factor base or
    the sieve, the communication exponent of a partitioned block Wiedemann is
    below the arithmetic exponent by the decay rate, and the ablations name
    the ingredient carrying it. That outcome FALSIFIES the closure and is
    welcome.

    THE STRUCTURAL TELL. A quantity that should decay and does not is the
    signature of an artifact; read in the identifiability direction, a
    quantity that stays constant as the parameter meant to reveal structure
    grows is the signature of NO STRUCTURE. phi is therefore measured at
    three sizes and on two problems, and constancy in M within noise together
    with agreement with the null is (E).

    WHAT IS NOT CLAIMED. No speedup, no exponent, no parallel implementation,
    and nothing about time, memory or the constant of the sieve. Nothing
    about any deployed key. NOTHING ABOUT ELLIPTIC CURVES OR THE ECDLP IN
    EITHER DIRECTION. The consequence for cryptographic sizes is conditional
    on an explicit transfer assumption and is stated as conditional
    everywhere it appears.

  mechanism: >-
    Block Wiedemann's Krylov phase computes many matrix-block products; on k
    memory domains each product moves, at minimum, one vector entry per
    column that touches more than one domain, per extra domain touched - the
    connectivity metric that hypergraph partitioners minimise. For a random
    hypergraph whose hyperedges have bounded average size and whose vertex
    degrees are bounded away from one, the minimum cut of any balanced
    k-partition is a constant fraction of the pins, so phi is bounded below
    independently of M. The relation hypergraph is NOT random: rows found
    under one special prime share that prime, small primes appear in a
    constant fraction of rows, and merge creates structured fill. Whether any
    of that makes phi decay is the question, and a DEGREE-MATCHED null
    answers it because the null shares every one-vertex statistic and
    destroys every correlation.

    THE ARITHMETIC THAT MAKES phi DECIDE THE EXPONENT. Total communication
    over a run is (M divided by the block width) iterations times phi times
    nonzeros times the block width, i.e. phi times nonzeros times M. So the
    exponent of total communication is the exponent of (nonzeros times M
    times phi), and ONLY phi can lower it. That is why one graph quantity,
    measured against a null and across sizes, decides an exponent question
    that no partitioning heuristic can decide by being clever.

    THE LOSSY-PROJECTION TEST, APPLIED AND PASSED. The projection from matrix
    to phi(k, M) discards every entry, every row identity and the field; it
    keeps one number per (k, M). It is lossy by construction and is not a
    change of coordinates. It is COMPATIBLE with the operation of interest
    because the communication of a matrix-vector product under a given
    partition is a function of the cut alone, and the minimum over partitions
    is a property of the hypergraph, INVARIANT under row and column
    permutation - so reordering tricks cannot change it, which is precisely
    why it decides the exponent question rather than a heuristic-quality
    question.

  assumptions:
    - >-
      HARD INPUT PRECONDITION, NOT AN ASSUMPTION TO BE DISCOVERED LATER: the
      post-merge matrices must EXIST, in a sparse format, at three sizes for
      both problems, with recorded hashes and identical merge settings. If
      only two sizes exist, the trend is reported on two points and labelled
      as such. IF NONE EXIST, THIS DESIGN CANNOT RUN AT ALL, and that is a
      blocking dependency rather than a caveat.
    - >-
      An open hypergraph partitioner handles matrices up to a few million
      rows on one workstation. The largest matrix may need coarsening, which
      is DECLARED per instance rather than applied silently.
    - >-
      Dense columns are identified by a weight threshold COMMITTED BEFORE
      partitioning, and every result is reported both with and without them.
    - >-
      Identical merge settings across sizes and problems, recorded. Merge
      parameters change the graph, so a trend across sizes measured under
      differing merge settings would be measuring the merge.
    - >-
      The cut identity - that the cross-domain communication of a
      matrix-vector product under a k-partition equals the connectivity cut
      of the column hyperedges - is exact and is taken as the definition of
      the measured quantity.

  proof_search_map:
    bottleneck: >-
      The per-iteration cross-domain communication of block Wiedemann, whose
      exponent equals that of M times phi. If phi is a constant, that term's
      exponent matches the arithmetic term's and the communication wall is a
      CONSTANT-FACTOR wall; if phi decays, the exponent drops.
    baseline_embedding:
      parameter_slice: >-
        k = 1 gives phi = 0 trivially (no communication) and must be
        reproduced. A random balanced partition gives phi close to 1 - 1/k
        per pin-touching column and is the upper-bound slice every
        partitioner must beat. The configuration-model null at each k is the
        baseline every real phi is read against.
      reproduction_check: >-
        A frozen synthetic fixture - a random hypergraph with the degree
        sequences of the smallest matrix - whose phi under the chosen
        partitioner is computed ONCE and stored; the pipeline must reproduce
        it within 2 percent BEFORE any real matrix is read.
    observation_collision:
      observable: "phi(k, M) and its difference from the degree-matched null."
      distinct_preimage_search: >-
        EXHIBITED AND GUARDED. Two hypergraphs with the same degree sequences
        and different structure could share phi - for instance a
        planted-separator hypergraph whose separator the partitioner FAILS TO
        FIND. That collision is the instrument's failure mode, not the
        object's, and it is guarded by two independent partitioners and by a
        PLANTED-STRUCTURE positive control at three separator sizes on which
        phi must fall by the planted amount. If the partitioners cannot
        recover a planted separator, the instrument cannot see structure and
        NO negative may be read from it.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the degree sequences fixed (the null) and vary the forgotten
          structure - the correlations between rows sharing a special prime,
          the dense small-prime block, merge-induced fill - by ablating each
          in turn: remove dense columns, permute rows within special-prime
          groups, partition the pre-merge matrix. Read phi after each.
        predicted_gain: >-
          Under (S) the ablation that returns phi to the null NAMES the
          ingredient carrying the structure; under (E) no ablation changes
          phi and the closure is stronger for having tried them.
    quantifier_order: >-
      UNDER (E): FOR ALL k >= 2 and FOR ALL sizes M in the range run,
      phi(k, M) >= phi_null(k, M) * (1 - delta) with delta the declared noise
      band. The witness PARTITION may depend on the matrix; the CONCLUSION
      may not. The claimed consequence for cryptographic sizes is a TRANSFER
      under an explicit heuristic and is stated as conditional.
      UNDER (S): THERE EXISTS a k and a trend in M with phi below the null,
      exhibited by the partitions themselves.
    method_ceiling:
      strongest_certifiable_claim: >-
        A measured cut fraction with intervals at three sizes for two
        problems, and its relation to the degree-matched null; hence a
        CONDITIONAL statement that partition-based or separator-based
        communication reduction cannot (E) or can (S) move the communication
        exponent at these sizes. It cannot certify anything about the
        arithmetic term, about memory, or about implementations; and (E)
        cannot rule out structure a hypergraph partitioner does not see, only
        structure it does.
      nearby_object_control: >-
        THE PLANTED-SEPARATOR MATRIX, on which the conclusion of (E) is KNOWN
        FALSE by construction; the instrument must show phi falling by the
        planted amount. A second nearby object is the DENSE-COLUMN-STRIPPED
        matrix, where the small primes are already handled separately and phi
        is predicted to move toward the null if the dense block was carrying
        whatever structure the full matrix shows.
    proof_obligations:
      - claim: "The cross-domain communication of a matrix-vector product under a k-partition equals the connectivity cut of the column hyperedges."
        responsibility: baseline
      - claim: "The configuration-model rewiring preserves both degree sequences exactly and mixes, with a convergence check on phi across replicates."
        responsibility: correctness
      - claim: >-
          The partitioners are within a constant factor of optimal on both
          real and null instances, evidenced by two partitioners agreeing and
          by planted-separator recovery.
        responsibility: feasibility
      - claim: "Total communication over a run scales as phi times nonzeros times M, so the exponent statement follows from phi's trend."
        responsibility: runtime
      - claim: >-
          The null band is non-degenerate: the planted-separator arm
          demonstrates by construction that phi CAN fall below the null, so a
          null-matched result is informative rather than forced.
        responsibility: strictness
      - claim: >-
          Scope: matrices from one implementation at 60-100 digits, two
          problems, the partitioners named, k in 2..64, and NOTHING about
          elliptic curves or the ECDLP.
        responsibility: scope

  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null as a CLAIM, though the record's purpose is to inform
    one. NO CHANGE IS CLAIMED to the arithmetic term of block Wiedemann, and
    the record does not touch it. Under (E) the communication term is SHOWN,
    at the sizes run and CONDITIONALLY beyond under the stated transfer
    heuristic, to share the arithmetic exponent, which is a closure of one
    class for the exponent. Under (S) a partitioned block Wiedemann would
    have a communication exponent reduced by the measured decay rate, stated
    as conditional. Memory is unchanged; the record measures a property of
    the object that occupies it. Nothing here is an ECDLP statement of any
    kind, and no prime-field elliptic-curve baseline is approached, cited as
    a comparator, or affected.

  heuristic_assumptions:
    - id: HEUR-CUT-1
      formal_statement: >-
        RANDOM-HYPERGRAPH BEHAVIOUR OF THE RELATION HYPERGRAPH. Conditioned
        on its row and column degree sequences, the post-merge
        relation-by-prime hypergraph with dense columns removed has minimum
        balanced k-way connectivity cut within a constant factor of that of a
        uniformly random hypergraph with the same degree sequences,
        uniformly in the dimension M over the range run and, AS A TRANSFER
        ASSUMPTION, beyond it.
      random_model_justification: >-
        The RIGOROUS ingredients are exact: the cut identity for
        matrix-vector communication, and the exact preservation of degree
        sequences by configuration-model rewiring. The CLASSICAL STATEMENT
        IMITATED is that random regular graphs are expanders almost surely,
        so their balanced cuts are a constant fraction of edges independent
        of size; the hypergraph analogue is ASSUMED. Both graph theorems are
        RECALLED and were opened by no agent in this program. THE GAP: the
        relation hypergraph has correlated rows sharing a special prime and
        merge-induced fill, neither of which a degree sequence captures -
        and that gap is exactly what the null comparison tests.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-797b5c]
      falsification_condition: >-
        Real-to-null ratio at or below 0.7 at any k WITH planted recovery
        above 0.8, or a real trend slope more negative than the null's by
        0.1. Either is explanation (S) and falsifies the closure.
    - id: HEUR-CUT-2
      formal_statement: >-
        PARTITIONER ADEQUACY. The heuristic partitioners find cuts within a
        constant factor of the minimum on both real and null instances at
        every size run, so the real-minus-null difference reflects the
        hypergraphs rather than the solver.
      random_model_justification: >-
        RIGOROUS INGREDIENT: NONE. Balanced hypergraph partitioning is
        NP-hard and the solvers are heuristics, so this assumption has no
        rigorous half at all and the record says so. The classical statement
        imitated is multilevel partitioners' empirical near-optimality on
        sparse matrices, which is established practice rather than a theorem.
        THE GAP: adversarial or highly structured instances can defeat
        coarsening. The planted-separator control and the two-partitioner
        agreement are the guards, and they are the only thing standing
        between this assumption and an unreadable negative.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-797b5c]
      falsification_condition: >-
        Planted recovery below 0.8, or partitioner disagreement above 10
        percent, on any instance. The instrument is then blind and NO
        negative may be read; the outcome is reported as an INSTRUMENT
        FAILURE rather than as explanation (E).

  structural_ingredients:
    - description: >-
        Mondriaan-style sparse matrix partitioning applied to number-field-
        sieve matrices for parallel block Lanczos, reported with speedups on
        a small processor count at 82 and 98 digits. Whether that work
        compares the cut against a random null, or studies its scaling in M,
        IS UNKNOWN TO THIS PROGRAM.
      citation: >-
        Bisseling and Flesch, Mondriaan sparse matrix partitioning for
        attacking cryptosystems by a parallel block Lanczos algorithm,
        Parallel Computing 32 (2006)
      provenance: recalled
      verified_by: null
      role: >-
        THE NEAREST PRIOR WORK AND IT WAS NOT READ. The source session
        obtained the landing-page metadata and a search snippet; the article
        itself returned HTTP 403 and was never opened. It supports nothing
        here, and the paired contract makes reading it a BLOCKING first-stage
        obligation for the executing agent, because the whole novelty of the
        null-matched scaling question rests on this paper not already asking
        it.
    - description: >-
        Random regular graphs are expanders almost surely with an
        isoperimetric constant bounded below - the rigorous graph fact whose
        hypergraph analogue HEUR-CUT-1 imitates.
      citation: >-
        Friedman, A proof of Alon's second eigenvalue conjecture; Bollobas,
        The isoperimetric number of random regular graphs
      provenance: recalled
      verified_by: null
      role: >-
        names the classical statement the heuristic imitates; RECALLED,
        opened by no agent in this program, and supports nothing
    - description: >-
        Record-scale post-merge matrix dimensions and densities for one
        factoring and one discrete-logarithm computation at the same modulus
        size, together with their Krylov-phase costs in core-years. Used ONLY
        for density context and NEVER for their cut, which is unmeasured.
      citation: "Boudot, Gaudry, Guillevic, Heninger, Thome, Zimmermann, ePrint 2020/697"
      provenance: retrieved
      verified_by: >-
        idea-generator of IDEA-20260901-df12e1, which records obtaining these
        figures via a fetch-tool summary of the ar5iv page on 2026-09-01.
        RELAYED, NOT RE-FETCHED by coordinator TASK-20260904-ae82ce, and the
        figures are used for context only; no claim of this record rests on
        them.
      role: supplies the record-scale density context for the transfer discussion
    - description: >-
        A committed internal record charging block Wiedemann in bytes with an
        information-theoretic per-row floor and a sequential-depth floor,
        whose traffic identity counts bytes STREAMED FROM MEMORY rather than
        bytes CROSSING DOMAINS.
      citation: IDEA-20260805-72bcb5
      provenance: internal
      verified_by: >-
        idea-generator of IDEA-20260901-df12e1, which records reading that
        record's claim block on 2026-09-01. RELAYED, NOT RE-READ by
        coordinator TASK-20260904-ae82ce.
      role: >-
        establishes that the cross-domain term this record measures is a
        DIFFERENT quantity from the one already charged, so the two do not
        collide
    - description: >-
        A full-cost model in which wiring a large memory is itself charged -
        the reason a cut fraction is a cost quantity rather than a curiosity.
      citation: KN-LIT-094
      provenance: kb
      verified_by: >-
        idea-generator of IDEA-20260901-df12e1, which records reading the
        corpus note on 2026-09-01. RELAYED, NOT RE-READ by coordinator
        TASK-20260904-ae82ce.
      role: justifies treating communication as a cost axis at all

  reduction_chain:
    core_problem: >-
      Whether the cut fraction of the post-merge relation hypergraph is
      bounded below by a constant independent of the matrix dimension, and
      therefore whether any partition- or separator-based method can move the
      communication exponent of block Wiedemann.
    corollaries: []
  reduction_chain_note: >-
    Deliberately empty. Under (E) the deliverable is an obstruction block
    scoped to the partition and separator class FOR THE EXPONENT; under (S)
    it is a named building block for a separate lane. Neither is a reduction
    to another problem.

  predictions:
    - metric: >-
        phi_real_over_null, the ratio of the real matrix's k-way connectivity
        cut fraction to the configuration-model null's, at k in {2, 4, 8, 16,
        32, 64}; dimensionless
      direction: different
      minimum_effect: >-
        (E) is a ratio within [0.85, 1.15] at every k after dense-column
        removal. (S) is a ratio at or below 0.7 at some k >= 8. Between is
        reported as WEAK STRUCTURE together with the ablation that explains
        it, and settles nothing on its own.
    - metric: >-
        phi_trend_in_M, the fitted slope of log phi(16, M) against log M over
        the sizes run, for real and null; dimensionless
      direction: different
      minimum_effect: >-
        (E) is a real slope within 0.05 of the null's slope, both near zero.
        (S) is a real slope at least 0.1 more negative than the null's.
    - metric: >-
        planted_recovery, the fraction of the planted cut reduction the
        partitioners recover on the planted-separator control; dimensionless
        in [0,1]
      direction: higher
      minimum_effect: >-
        At least 0.8 for BOTH partitioners at all three planted separator
        sizes. Below 0.5 means the instrument is BLIND and no (E) may be
        read. THIS IS THE ARM THAT DEMONSTRATES THE MEASUREMENT HAS DYNAMIC
        RANGE: a defect of known size must fire at the predicted degree.
    - metric: >-
        dense_block_share, the fraction of the full matrix's cut carried by
        columns above the committed dense threshold; dimensionless in [0,1]
      direction: different
      minimum_effect: >-
        REPORTED WHATEVER ITS VALUE. If above 0.5, the dense block dominates
        communication, the separate handling of small primes is the structure
        that matters, and that is a CONSTANT-FACTOR statement which must be
        labelled as one.
    - metric: "dlp_agreement, the same ratio and slope on the discrete-logarithm matrices; dimensionless"
      direction: different
      minimum_effect: >-
        The SAME classification, (E) or (S), as factoring at each size. A
        disagreement localises the structure to an ingredient the two
        problems do not share and is reported as such, not closed.
    - metric: >-
        communication_exponent_estimate: under (E) the implied exponent of
        total communication relative to the arithmetic term, under (S) the
        implied reduction; dimensionless exponent
      direction: different
      minimum_effect: >-
        (E) implies equality with the arithmetic exponent within the noise
        band; (S) implies a reduction equal to the measured slope. EITHER IS
        STATED AS CONDITIONAL on the transfer heuristic and never as an
        unconditional exponent.

  test_boundary:
    instances:
      - "Post-merge matrices at 60, 80 and 100 digits for BOTH factoring and discrete logarithm, from ONE pipeline with identical merge settings, with recorded hashes."
      - "A synthetic fixture: a random hypergraph with the degree sequences of the smallest matrix, its phi computed once and stored."
      - "Planted-separator matrices at three separator sizes constructed from the real matrix by rewiring."
      - "Ablations: dense columns removed and restored; rows permuted within special-prime groups; the pre-merge matrix where kept."
    parameters:
      k_grid: "{2, 4, 8, 16, 32, 64}"
      null_replicates: "5 per matrix"
      planted_separator_sizes: "1, 5 and 10 percent of pins"
      partitioners: "two named open hypergraph partitioners, settings committed before any matrix is read"
      dense_threshold: "a column weight threshold committed before partitioning"
    implementation: >-
      Build the column hypergraph, partition with both partitioners at each
      k, record phi; build configuration-model replicates by degree-preserving
      edge swaps with multi-pin swaps REJECTED and the rejection count
      reported, and partition them identically. No parallel implementation is
      built and no parallel run is timed.
    budget: >-
      See EXP-ECDLP-797b5c. The dominant cost is partitioning multi-million-
      row hypergraphs at six values of k, twice, on real plus five null
      replicates plus three planted variants plus the ablations.

  falsification_conditions:
    - >-
      Planted recovery below 0.5, or partitioner disagreement above 10
      percent. The instrument is BLIND, nothing is read, and the outcome is
      reported as an instrument failure rather than as any explanation.
    - >-
      Real-to-null ratio at or below 0.7 at some k, or a trend slope
      materially below the null's. EXPLANATION (S): the hypergraph has
      separable structure, the ablations name it, and the record hands
      forward a building block for a communication-exponent lane. THIS
      OUTCOME FALSIFIES THE CLOSURE AND IS WELCOME.
    - >-
      Ratio within the band and slope matching the null at all sizes and both
      problems. EXPLANATION (E): the obstruction block is written with the
      measured phi, and the closure of the partition and separator class FOR
      THE EXPONENT is recorded, scoped, with forward guidance naming what
      remains open - constant-factor communication reduction, dense-block
      handling, and algorithms that do not multiply by the matrix.
    - >-
      Disagreement between the factoring and discrete-logarithm
      classifications at the same size. The structure lives in an unshared
      ingredient; reported, not closed.
    - >-
      The synthetic fixture fails to reproduce within 2 percent. Pipeline
      error; no real matrix is read.
    - >-
      The required post-merge matrices do not exist. This is a BLOCKING INPUT
      failure, an infrastructure outcome under AGENTS.md rule 5, and NOT a
      result about the hypergraph in either direction.

  interpretation_limits:
    - >-
      NOTHING IN THIS RECORD IS A STATEMENT ABOUT ELLIPTIC CURVES OR THE
      ECDLP, in either direction. This lane concerns the number field sieve;
      no curve, no point, no group of points and no discrete logarithm on a
      curve appears anywhere in it, and no transfer to the ECDLP is licensed
      by any outcome.
    - >-
      A toy-tier measurement at 60-100 digits on ONE implementation, or a
      named obstruction with a measured quantity. No implementation is built
      and no parallel run is timed; the communication exponent statement is
      arithmetic from phi under the transfer heuristic and is CONDITIONAL.
    - >-
      (E) closes the partition and separator class FOR THE EXPONENT ONLY.
      Constant-factor communication gains - which is what partitioning case
      studies and production process grids deliver - are untouched and
      expected.
    - >-
      TRANSFER FROM 10^6-ROW TO 10^8-ROW MATRICES IS UNDER AN EXPLICIT
      HEURISTIC AND CANNOT BE TESTED AT REACHABLE SCALE. Record-scale
      matrices are two orders of magnitude beyond what this design partitions
      on one workstation, and no design in this family could partition them.
      The record measures THREE SIZES precisely so the TREND, not a point, is
      what transfers - and even the trend transfers only conditionally.
    - >-
      (E) cannot rule out structure a hypergraph partitioner does not see,
      only structure it does. Its strength is bounded by HEUR-CUT-2, which
      has no rigorous half.
    - >-
      Nothing here changes the time, memory or constant of the sieve, and
      nothing is a statement about any deployed key.
    - >-
      The nearest prior work was NOT READ by any agent in this program; the
      novelty of the null-matched scaling question is therefore UNVERIFIED,
      and reading that paper is a blocking first-stage obligation of the
      paired contract.
    - >-
      NO STATUS CHANGE to any record is proposed or implied.

