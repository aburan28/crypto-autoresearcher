  title: >-
    At n = 571 the diagonal k = ceil(571/m) takes the seven listed values,
    and the strict k0 bound first holds at 12.
  statement: >-
    For m in {2, 10, 12, 13, 22, 29, 30}, ceil(571/m) is 286, 58, 48, 44,
    26, 20 and 20. At m = 12 the variable count (m-2)*571 + k*m is 6286,
    and the square of binom(6289, 4) is at least 2^91, strictly below
    2^92, strictly above 2^{91.7} and strictly below 2^{91.8}. The
    inequality k^2 * 2^k > 571^2 fails at k = 10 and at k = 11 and first
    holds at k = 12.
  mechanism: >-
    The implementer chooses m, and the diagonal dimension is then
    ceil(n/m). The proposal's weak bound k0 > 2 log2(n/k0) is the integer
    inequality k^2 * 2^k > n^2. This contract checks that arithmetic at
    n = 571. It does not optimise a cost.
