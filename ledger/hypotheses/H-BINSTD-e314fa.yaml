  title: >-
    The tenth-scale progress gap puts the fraction strictly below 33/200.
  statement: >-
    In tenths, 609 minus 583 is 26, so the progress gap is 13/5. The
    fifth-power comparison 2^13 times 33^5 equals 320597139456, which
    exceeds 200^5 = 320000000000 by 597139456, so 2 to the power 13/5
    exceeds 200/33 and the progress fraction is strictly below 33/200.
    The same comparison against 17^5 exceeds 100^5 by 1631468544, so
    the fraction is also strictly below 17/100. The base-2 logarithm
    of 200/33 lies strictly above 2599/1000 and strictly below 13/5.
    The measured pair 583/10 and 331/10 implies the density 252/10,
    which is 7/100 below 2527/100. Subtracting 2527/100 from 583/10
    gives 3303/100, which is 7/100 below 331/10. Subtracting 3563/100
    from 609/10 gives 2527/100 exactly. On weights 0 through 34 the
    walk index (half the weight, modulo 8, plus 3) takes every value
    from 3 through 10. The value 3 occurs 6 times and the value 4
    occurs 5 times. The index at weight 34 is 4.
  mechanism: >-
    The proposal states a progress fraction, a distinguished-point
    density, and a walk index. This contract checks those figures as
    integer comparisons. It does not sample a point pool.
