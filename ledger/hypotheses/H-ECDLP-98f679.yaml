    prose: >
      Toy scale. Stage 0 is exact
      F_5[x] arithmetic of one frozen
      remainder and one wrong-point
      nearby map. It is not Semaev, not
      a P1553 recurrence, not a
      transposed half-gcd, not Stage 1
      of EXP-ECDLP-166141, and not
      Stage 1 of EXP-ECDLP-1dc6e1.
      No cryptographic transfer. No
      rho beat.
  assumptions:
