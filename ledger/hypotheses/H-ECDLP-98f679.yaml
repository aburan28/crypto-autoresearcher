  statement: >
    Fix the exact remainder identity
    rem = r mod g before any transposed
    half-gcd, subresultant product tree,
    CRT metadata, Semaev polynomial,
    P1553 recurrence, factor-base table,
    or sparse rank audit is built.
    Stage 0 asserts only that on the
    frozen REAL ring F_5[x] one has
    g=x+1, r=x^2+2x+3, remainder 2, and
    that the nearby KF evaluation of r
    at +1 yields 1 and is rejected as a
    generic remainder. NULL empty
    (g,r) pair rejected. modulus 0
    rejected. This is not a Semaev
    relation, not a rho beat. Stages 1+
    stay unauthorized.
  mechanism: >
    IDEA-20260825-fc85c6 Stage 0 hard
    gate is the exact Euclidean remainder
    and its nearby-object counterpart,
    derived from the frozen F_5[x]
    polynomials alone. Stage 0 freezes
    that identity as exact tables. No
    transposed half-gcd. No product
    tree. No Semaev S_m. No P1553
    recurrence. No factor-base. No CRT.
    No Velu. This is a new GOAL-ECDLP-001
    object after Stage 0 of
    EXP-ECDLP-1dc6e1 held as
    P-S0-UNITPROD (DEC-20260908-510912).
    It is not Stage 1 of EXP-ECDLP-1dc6e1
    and not Stage 1 of this experiment.
  predictions:
    - id: P-S0-EUCREM
      metric: well-defined Euclidean remainder table on frozen toys
      direction: different
      minimum_effect: >
        After fixture_pass, REAL remainder
        equals 2, and KF wrong-point
        evaluation is rejected. NULL
        empty pair is rejected. modulus 0
        is rejected. One certified miss
        after fixture_pass is a scoped
        falsification of this instrument
        at the frozen toys.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KF
      statement: >
        After fixture_pass, KF wrong-point
        evaluation is accepted as a
        generic remainder target. An
        encoding bug is
        failed_infrastructure.
    - id: F-S0-REAL
      statement: >
        After fixture_pass, REAL fails
        to match remainder 2. That
        falsifies only P-S0-EUCREM
        at the frozen toy.
  test_boundary:
    instances:
      - frozen Stage 0 REAL / KF / NULL panel
    parameters:
      real_polys:
        modulus: 5
        g: [1, 1]
        r: [3, 2, 1]
        must_remainder: 2
      known_false:
