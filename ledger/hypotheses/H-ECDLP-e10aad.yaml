hypothesis:
  id: H-ECDLP-e10aad
  area: ECDLP
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  source_proposal: IDEA-20260805-cc4c2c
  proposal_id: IDEA-20260805-cc4c2c
  title: >
    Stage 0 closed-form transfer-ladder
    identities — toy inversion and
    k*(256)<12 — before any curve
    is constructed
  status: specified
  proposed_by: idea-generator
  designed_by: coordinator
  designed_under_task: TASK-20260913-3d1674
  specified_by: DEC-20260913-dd82b2
  specified_at: '2026-09-13'
  created: '2026-09-13'
  updated: '2026-09-13'
  depends_on:
    - IDEA-20260805-cc4c2c
    - RQ-ECDLP-002
  related_hypotheses:
    - H-IT-001
  statement: >
    Fix the closed-form transfer-versus-rho
    identities of IDEA-20260805-cc4c2c
    before any pairing-friendly curve is
    constructed, any MOV/Frey-Ruck map
    is evaluated, or any discrete logarithm
    is solved. Stage 0 asserts only that
    on the frozen (bits,k) grid, L_{p^k}[1/3,
    1.923] is strictly increasing in k,
    that at 20 bits the k=1 transfer cost
    exceeds rho, and that k*(256 bits) is
    strictly less than 12. A nearby claim
    that k=12 beats rho at 256 bits is
    rejected. A k-independent dummy cost
    is rejected as a ladder. This is not
    a transfer attack and not a rho beat.
    Stages 1+ stay unauthorized.
  mechanism: >
    IDEA-20260805-cc4c2c tracks cost(k) as
    the forced response of a transfer-gate
    instrument. Stage 0 freezes the
    arithmetic identities that make the
    ladder a ruler rather than a single
    anomalous control. Write
    L_q[1/3,c]=exp(c (ln q)^{1/3}
    (ln ln q)^{2/3}) with c=1.923 and
    q=p^k, compare to rho=2^{bits/2}.
    No curve construction. No pairing.
    No DLP solve. The proposal's own
    numbers are the prediction, not a
    fitted result.
  predictions:
    - id: P-S0-XLADDER
      metric: closed-form ladder identities on the frozen grid
      direction: different
      minimum_effect: >
        After fixture_pass, REAL is
        monotone in k at every frozen
        bits, toy_inverted at 20 bits
        (k=1 cost > rho), and
        k_star_256 < 12. KF
        (k=12 beats rho at 256 bits)
        is rejected. NULL constant-in-k
        cost is rejected as a ladder.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KF
      statement: >
        After fixture_pass, KF claim
        that k=12 beats rho at 256 bits
        is accepted. An encoding bug is
        failed_infrastructure.
    - id: F-S0-REAL
      statement: >
        After fixture_pass, REAL fails
        monotonicity, toy inversion, or
        k_star_256<12. That falsifies
        only P-S0-XLADDER at the frozen
        arithmetic.
  test_boundary:
    instances:
      - frozen Stage 0 REAL / KF / NULL arithmetic panel
    parameters:
      real_grid:
        bits: [20, 32, 128, 256]
        k: [1, 2, 3, 4, 6, 12]
        c: 1.923
        must_monotone_in_k: true
        must_toy20_k1_worse_than_rho: true
        must_kstar_256_lt_12: true
      known_false:
        kind: k12_beats_rho_at_256
        must_reject: true
      matched_null:
        kind: constant_in_k_dummy_cost
        must_reject: true
      stage0_only_at_specify: true
    implementation: EXP-ECDLP-16c2a4 Stage 0 runner
    budget:
      wall_clock_seconds: 120
    prose: >
      Toy/closed-form arithmetic only.
      No curve is constructed. No MOV
      pairing. No DLP. No cryptographic
      transfer. The L_q constant 1.923
      is the proposal's recalled value
      and is part of the frozen formula,
      not a measured constant.
  assumptions:
    - id: A1
      statement: >
        The frozen formula is
        L_q[1/3,1.923] versus 2^{bits/2}.
        Stage 0 does not construct
        pairing-friendly curves and
        does not solve a DLP.
      status: explicit
    - id: A2
      statement: >
        Standing user authorization
        2026-09-06 covers protocol
        approval once the contract is
        complete.
      status: explicit
  heuristic_assumptions: []
  proof_search_map:
    bottleneck: >
      Whether the closed-form ladder is
      monotone, toy-inverted at 20 bits,
      and has k*(256)<12.
    baseline_embedding:
      parameter_slice: >
        The REAL grid, KF k=12-beats-rho
        claim, and NULL constant cost.
        Disclosed tightening: arithmetic
        calibrator only, not the
        proposal's curve-construction
        rungs.
      reproduction_check: >
        REAL monotone; toy20 k=1 worse
        than rho; k_star_256<12. KF
        rejected. NULL rejected.
    observation_collision:
      observable: forced transfer cost versus rho as a function of k
      distinct_preimage_search: >
        Hold bits and drop k-dependence
        (NULL). Hold 256 bits and claim
        k=12 beats rho (KF).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Frozen closed-form ladder table.
        predicted_gain: >
          Exact known-false reject on KF.
          Zero claimed attack improvement.
    quantifier_order: >
      Freeze the formula and grid before
      reading the table. Existential
      equality at one grid does not
      imply a pairing attack.
    method_ceiling:
      strongest_certifiable_claim: >
        Instrument reproduction on the
        declared frozen arithmetic.
        Never a transfer attack. Never
        an ECDLP exponent.
      nearby_object_control: >
        NULL is a k-independent dummy
        cost. An argument that still
        calls it a ladder is
        proves-too-much.
  knowledge_promotion:
    promoted: []
    not_warranted: Stage 0 design only. Nothing to promote.
  scientific_boundary: >
    Stage 0 P-S0-XLADDER only. Not MOV.
    Not Frey-Ruck. Not Smart/Satoh-Araki.
    Not a pairing-friendly construction.
    Not a DLP solve. Not a rho beat.
    No Stage 1 of EXP-ECDLP-16c2a4.
