hypothesis:
  id: H-JPR-3a00f0
  question_id: RQ-ECDLP-160d89
  title: Source-resolved output-sensitive joinability is the missing Wagner-to-ECDLP primitive
  statement: >-
    Let G be a prime-order elliptic-curve subgroup of order N and let four
    independently sampled, source-labelled lists contain L=N^(1/3) points
    aP+bQ. If two pair-list constructors satisfy certificate conditions
    JPR-C1 through JPR-C7 -- source replay, decomposable join keys,
    O(L+output) enumeration, output size Theta(L), conditioned cross-list
    collision probability Theta(N^(-2/3)), constant final success, and fully
    charged O(L polylog N) time and memory -- then a valid zero relation and
    hence the discrete logarithm can be recovered in N^(1/3+o(1)) time and
    memory. The open scientific question is whether any efficiently computable
    coordinate-derived relation on a prime-order curve satisfies these
    conditions without smuggling in a discrete-log oracle or L^2 work.
  mechanism: >-
    A four-list split produces two pair-sum collections. Filtering each of L^2
    potential pairs at rate 1/L keeps Theta(L) outputs. Constant final success
    additionally requires those outputs to occupy a common effective support
    of size Theta(N^(2/3)), so their cross-collision probability is
    Theta(N^(-2/3)). Both facts are useless unless qualifying pairs can be
    enumerated in O(L+output). Known source coefficients travel with every
    leaf and pair, so a final point identity yields a scalar relation directly.
  predictions:
    - id: JPR-P1
      statement: >-
        In an XOR vector space of dimension 3m, matching m-bit prefixes gives
        L=2^m, expected filtered pair-list size L, kernel size 2^(2m), and
        cross-collision probability 2^(-2m); all certificate conditions hold.
    - id: JPR-P2
      statement: >-
        A random per-pair coin with survival 1/L has the same pruning rate but
        conditioned sums remain uniform, so per-attempt success is N^(-1/3)
        and total cost is at least N^(2/3), even before charging enumeration.
    - id: JPR-P3
      statement: >-
        A post-hoc point-hash subset of density 1/L supplies the desired
        collision concentration but normally requires L^2 pair inspection;
        it also fails the certificate.
    - id: JPR-P4
      statement: >-
        Any proposed coordinate relation that passes only a pruning-ratio test
        will fail at least one of decomposable enumeration or conditioned
        collision concentration.
  test_boundary: >-
    This batch performs symbolic and static falsification only. It does not
    claim that every approximate relation fails, and it does not transfer a
    vector-space positive control to an elliptic curve.
  falsification_criteria:
    - The stated JPR-C1..C7 conditions do not imply the advertised cost under independent derivation.
    - A proposed counterexample satisfies every condition yet costs Omega(N^(1/2)) or worse.
    - A source relation cannot be replayed to a scalar without an additional DLP oracle.
    - The same-pruning controls do not in fact separate enumeration and collision concentration.
