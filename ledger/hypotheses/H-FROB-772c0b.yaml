# =============================================================================
# H-FROB-772c0b -- Mumford u_0 eliminant of a genus-2 Jacobian fibre at n=19
# Specified from IDEA-20261002-711e84 under RQ-FROB-7d8dd4 / GOAL-FROB-6333a9.
# Approved DEC-20261002-da97c5. ZERO RUNS in this design packet.
# Stages 0-1 authorized. No AUXIN. No Bedrock. No curve attack / exponent claim.
# =============================================================================
hypothesis:
  id: H-FROB-772c0b
  question_id: RQ-FROB-7d8dd4
  source_idea: IDEA-20261002-711e84
  experiment_id: EXP-FROB-7d51ae
  goal_id: GOAL-FROB-6333a9
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-da97c5
  status: approved
  proposed_by: coordinator
  title: >-
    On a genus-2 curve over F_2 with 19 | #Jac(F_2), the Mumford u_0
    eliminant degree of the order-19 Couveignes fibre differs from the
    GGMP vector-space Weil-descended degree 6 at m=3, while branching
    b of pi is at least 2

  statement: >-
    CLAIM (toy structural / degree measurement; NO ATTACK; NO EXPONENT).
    Setting: genus-2 models C: y^2 + h(x)y = f(x) over F_2 with deg h <= 3
    and deg f <= 6 (2048 coefficient pairs named by IDEA-20260926-80209d);
    retain those with 19 dividing #Jac(F_2)=P(1) recovered from N_1, N_2.
    On each hit (at most three isomorphism-class representatives), let t be
    an F_2-rational divisor class of order 19; let Fibre = <t>; let pi map
    a reduced Mumford divisor to the constant term u_0 of its u-polynomial
    (frozen encoding for deg u < 2). HYPOTHESIS: (A) at least one such
    Jacobian model exists, or Stage 0 reports O-NO-MODEL as the artifact
    path; (B) on every hit kept after Cantor integrity, the operational
    eliminant_degree (degree of the square-free univariate vanishing on
    im(pi|Fibre), lifted through the frozen Weil-descent Boolean panel as
    boolean_degree_proxy, compared to the preregistered GGMP vector-space
    figure 6) differs from 6 by at least 1; (C) branching b = max fibre
    size of pi on Jac(F_2) is >= 2; (D) the equal-cardinality random-subset
    control does not reproduce the same degree gap against 6 (else
    O-ARTIFACT). Elliptic side stays R1 at n=19 (first Koblitz (a,b) with
    a large prime factor). First-fall degree of a full descended S_3
    system is Stage 2 (NOT authorized). NO n>=131 solve. NO exponent move.

  mechanism: >-
    OBJECT FRAME. Representation of the elliptic point: R1 x-coordinate in
    F_{2^{19}}. Representation of the auxiliary divisor: Mumford pair
    (u, v) on Jac(C). Operation set Sigma: translation on Jac(C) by the
    order-19 class t. TRICHOTOMY: branching — pi keeps only u_0; fibres
    contain a reduced divisor and its hyperelliptic conjugate; translation
    by odd-order t does not preserve those fibres. LOSSY-PROJECTION TEST
    against <t>: discard v and every u-coefficient except u_0; not a block
    system of <t>. PRICE: branching pair (L, b) measured at the n=19 toy.
    WHAT IS NEW relative to GGMP example 5.1 (vector-space degree 6 /
    fraction <=9, not Galois-invariant) and IDEA-20260926-5c26f9 (Weil
    polynomial, no equation): an explicit Mumford-fibre eliminant degree
    on a Jacobian model. Charged stage: decomposition membership degree
    at the toy — not a solve of any ECDLP.

  predictions:
    - metric: number of genus-2 models with 19 | #Jac(F_2)
      direction: different
      minimum_effect: >-
        0 (O-NO-MODEL artifact) or >=1 (Jacobian present) are different
        explanations
    - metric: eliminant_degree vs GGMP vector-space figure 6
      direction: different
      minimum_effect: absolute difference at least 1 on every kept hit
    - metric: branching b of pi on Jac(F_2)
      direction: higher
      minimum_effect: 2
    - metric: Cantor composition integrity on three rational divisors
      direction: same
      minimum_effect: all three checks pass before any degree is kept

  test_boundary:
    instances:
      - >-
        Stage 0: all genus-2 models over F_2 with deg h<=3, deg f<=6;
        freeze hits with 19|#Jac; freeze GGMP degree-6 prediction and
        elliptic (a,b) recipe for n=19
      - >-
        Stage 1: <=3 hit models; Cantor check; (L,b); eliminant_degree /
        boolean_degree_proxy vs subspace and random-subset controls
    parameters:
      n_toy: 19
      q: 2
      genus: 2
      order_prime: 19
      ggmp_vs_degree_m3: 6
      m_arity: 3
      max_hits_reported: 3
    implementation: >-
      Pure Python under experiments/EXP-FROB-7d51ae/implementation/;
      command surface implementation/run.py driven by trial-plan-v1.json.
      No Magma/Sage/cypari2/AUXIN/Bedrock.
    budget:
      wall_clock_seconds: 7200
      memory_gb: 4
      maximum_runs: 4

  falsification_conditions:
    - >-
      Every kept hit has eliminant_degree / boolean_degree_proxy equal to
      6 and matching the subspace arm Boolean proxy (O-NEGATIVE).
    - >-
      Branching b equals 1 on the Jacobian arm (pi lost nothing)
      (O-NEGATIVE).
    - >-
      The degree gap vs 6 is reproduced by the random-subset control
      (O-ARTIFACT).
    - >-
      Cantor composition fails the three-divisor check (O-IMPEDIMENT /
      infrastructure; not mathematical evidence).
    - >-
      Claiming an n=131 exponent move or ECDLP break under this card
      (protocol invalid).

  distinguishable_outcomes:
    - id: O-POSITIVE
      meaning: >-
        At least one hit model passes Cantor integrity; eliminant_degree
        (or boolean_degree_proxy) differs from 6 by >=1; subspace arm
        does not match that gap away; random-subset control does not
        reproduce the gap; b >= 2. No exponent claim.
    - id: O-NEGATIVE
      meaning: >-
        Every hit has degree proxy 6 matching the subspace arm, or b=1
        on the Jacobian arm. This representation does not change the
        decomposition charge at the toy.
    - id: O-NO-MODEL
      meaning: >-
        No genus-2 model over F_2 has 19 | #Jac(F_2). Degree claim
        untested; matches IDEA-20260926-80209d Jacobian-or-not open.
    - id: O-ARTIFACT
      meaning: >-
        Point-count / Weil mismatch, random-subset reproduces the gap,
        or dual instrument disagreement. No degree claim kept.
    - id: O-IMPEDIMENT
      meaning: >-
        Infrastructure timeout/crash/missing Stage-0 freeze/Cantor
        failure. Never negative evidence against the degree claim.

  interpretation_limits:
    - >-
      A degree at n=19 does not transfer to n=131. Genus 2 cannot supply
      an order-131 point over F_2 (surface ceiling 33).
    - >-
      First-fall degree of a full Weil-descended S_3 system is
      UNMEASURED under Stages 0-1 (Stage 2, separate authorization).
    - >-
      GGMP degree 6 is a shape benchmark on a set that paper says is not
      Galois-invariant; the equal-cardinality subspace arm is the
      invariance-matched control.
    - >-
      No deployed curve is an instance. No attack at field degree >= 131.
    - 'KN-OPEN-020 class: high-degree or implicit-membership as the degree comes out.'

  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        The leading coefficient of the u_0 eliminant is nonzero, so the
        measured degree equals the Bézout-type upper bound of the fibre
        equations rather than a proper divisor of that bound.
      random_model_justification: >-
        Pattern imitated: a uniform random polynomial of degree at most
        B over a finite field has degree B with probability 1 - 1/|k|.
        No Bézout paper opened in this design session (recalled pointer).
      supporting_results: []
      validation_experiment_ids:
        - EXP-FROB-7d51ae
      falsification_condition: >-
        At n=19, genus 2, a kept hit has leading_coefficient == 0 while
        a positive degree claim is asserted (report; voids that hit's
        degree claim).

  asymptotic_claim:
    problem: >-
      Membership degree of a Galois-invariant Couveignes factor base from
      a genus-2 Mumford fibre for binary ECDLP decomposition at toy n=19
    prior_best: >-
      Pollard rho ~ 2^{n/2}/n^{1/2} on Koblitz; GGMP example 5.1
      vector-space Weil-descended degree 6 at m=3 (not Galois-invariant)
    time_exponent: >-
      NO EXPONENT MOVED. Genus-2 rational-point cap 33; rho at n=131
      stays n/2.
    memory_exponent: O(1) relative to |Jac(F_2)| <= 33 enumeration
    hidden_cofactor: Cantor composition polynomial cost; Weil-descent panel proxy
    claim_kind: arithmetic_table_measurement

  proof_search_map:
    bottleneck: >-
      Total degree of the eliminant of the fibre equations onto u_0,
      compared to GGMP vector-space degree 6 at m=3.
    baseline_embedding:
      parameter_slice: >-
        GGMP example 5.1 at m=3: vector-space Weil-descended degree 6,
        fraction shape degree at most 9, on a set the paper says is not
        Galois-invariant. Reproduced as a shape benchmark at n=19,
        equal cardinality, same m.
      reproduction_check: >-
        Enumerate models; retain 19|#Jac; Cantor check on three
        rational divisors before any elimination; freeze GGMP figure 6
        in stage0/preregistered-predictions.json before Stage 1.
    observation_collision:
      observable: the eliminant in u_0 (univariate / Boolean proxy)
      distinct_preimage_search: >-
        Pairs of reduced divisors on the fibre with the same u_0 and
        different v certify loss. Random-subset equal cardinality that
        reproduces the gap vs 6 is an artifact collision.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Constant term u_0 of the Mumford polynomial of the fibre
          divisor after Cantor composition.
        predicted_gain: >-
          One univariate membership polynomial (degree measured) in
          place of a g*n Boolean system carrying every Mumford
          coefficient.
    quantifier_order: >-
      For all genus-2 models over F_2 with 19|#Jac(F_2) kept after
      Cantor integrity, eliminant_degree differs from 6. Existence of
      one such model is tested by Stage 0, not assumed. No forall-n
      claim.
    method_ceiling:
      strongest_certifiable_claim: >-
        An integer degree at n=19, m=3, genus 2, plus (L,b) for pi.
        No exponent at n=131; no statement about non-hyperelliptic
        abelian surfaces.
      nearby_object_control: >-
        Equal-cardinality F_2-subspace of F_{2^{19}}; random subset of
        equal cardinality; identity projection (predicted b=1, L=0);
        null curve over F_{2^{19}} not defined over F_2.
    proof_obligations:
      - claim: Enumerated models satisfy the curve equation and 19|#Jac.
        responsibility: correctness
      - claim: Cantor composition passes the three-divisor check before degrees are kept.
        responsibility: baseline
      - claim: Degree and (L,b) reported for Jacobian, subspace, random-subset, and null arms.
        responsibility: baseline
      - claim: The n=131 rho exponent is outside the certificate.
        responsibility: scope
    not_applicable_reason: null

  dominated_by: >-
    Time: rho at n/2 dominates any attack claim (none made). Memory:
    van Oorschot-Wiener not improved. Data/queries: at most the 1/n
    factor of KR-IC-b0fcda. All three axes checked. New quantity is a
    degree at n=19.
  sota_delta:
    time: 'exponent delta 0 against n/2; toy degree delta >=1 from GGMP 6 if O-POSITIVE'
    memory: 0 against van Oorschot-Wiener rho memory
    data_queries: at most the already-known factor 1/n on the number of systems

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
