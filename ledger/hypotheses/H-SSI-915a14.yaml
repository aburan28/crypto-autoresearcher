# H-SSI-915a14
# Equality bits of the same eight endomorphisms, read on E[8].
# H-SSI-cb227f reads E[4] and is not edited.
hypothesis:
  id: H-SSI-915a14
  question_id: RQ-SSI-1946c9
  goal_id: GOAL-SSI-2fa82a
  source_idea: IDEA-20261004-edbd24
  experiment_id: EXP-SSI-5bacb4
  specified_at: '2026-10-05'
  status: approved
  proposed_by: coordinator
  approved_by_decision: DEC-20261005-0305c1
  title: >-
    On E[8] the only equality-bit collision is iota with iota
    cubed, and p=31 fixes more points than p=7 and p=23
  statement: >-
    Fix p in {7, 23, 31}. Let E be y^2 = x^3 + x over F_{p^2} =
    F_p[i]/(i^2+1). These are the first three primes with p
    congruent to 7 mod 8, so 8 divides p+1 and the 64 points of
    E[8] lie in E(F_{p^2}). Let iota send (x, y) to (-x, i y)
    and let pi be the p-power Frobenius. The witness set is
    W = {iota^a composed after pi^b : a in {0, 1, 2, 3}, b in
    {0, 1}}. The design-session partition, which is not a run,
    is the same under the closed form i^p = -i and under
    exponentiation. At every one of these primes the fibers are
    {(0,0)}, {(0,1)}, {(1,1)}, {(2,0)}, {(2,1)}, {(3,1)}, and
    {(1,0), (3,0)}. In that order the numbers of fixed points
    are 64, 8, 8, 4, 8, 8, 2 at p=7 and at p=23, and
    64, 8, 16, 4, 8, 16, 2 at p=31. The group orders are
    64, 576, and 1024.
  mechanism: >-
    iota and iota^3 fix a point only when it is O or (0, 0), so
    their rows agree on E[8] as they did on E[4]. Every other
    witness has its own row. The witnesses (1, 1) and (3, 1)
    each fix 8 points at p=7 and p=23, and 16 points at p=31,
    without joining each other's fiber.
  assumptions:
    - Composition applies pi^b first and then iota^a.
    - E[8] is the full 64-point kernel of multiplication by 8 inside E(F_{p^2}).
    - An equality bit records only whether theta fixes R. It does not record the image.
  proof_search_map:
    bottleneck: >-
      Whether the size-3 fiber seen on E[4] at other primes
      survives when the module is E[8].
    baseline_embedding:
      parameter_slice: >-
        The same curve and witness set as H-SSI-cb227f. That
        hypothesis uses primes 7, 11, and 19 and reads E[4].
        Primes 11 and 19 do not contain the full E[8] over
        F_{p^2}.
      reproduction_check: >-
        Frobenius as (a, b) to (a, -b) and Frobenius as the
        p-power map must give the same fibers. iota squared
        must equal negation on every point of E[8].
    observation_collision:
      observable: the set of points of E[8] fixed by a witness.
      distinct_preimage_search: >-
        Two pairs (a, b) with the same fixed-point set, other
        than (1, 0) and (3, 0).
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: equality bits on E[8] rather than on E[4]
        predicted_gain: >-
          Leaves only the iota / iota^3 pair glued. No EndRing
          algorithm.
    quantifier_order: >-
      For each prime, for each of the eight witnesses, for each
      of the sixty-four points of E[8].
    method_ceiling:
      strongest_certifiable_claim: >-
        The equality-bit partition of these eight maps on this
        64-point module. Not a decryption attack.
      nearby_object_control: >-
        p=31, which has the same fibers as p=7 and p=23 but
        larger fixed sets for (1, 1) and (3, 1).
    proof_obligations:
      - claim: The fibers are the seven sets named in the statement
        responsibility: correctness
      - claim: The fixed-point counts differ at p=31
        responsibility: size
      - claim: Both Frobenius routes agree
        responsibility: interface
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        These fibers do not transfer to a cryptographic
        endomorphism-ring encryption scheme.
      random_model_justification: The module is enumerated in full.
      supporting_results: []
      validation_experiment_ids:
        - EXP-SSI-5bacb4
      falsification_condition: >-
        A later record that treats this partition as a break of a
        published scheme.
  structural_ingredients:
    - description: >-
        IDEA-20261004-edbd24 asks which torsion module a
        decryption transcript uses. H-SSI-cb227f answered for
        E[4]. This hypothesis answers for E[8].
      citation: ledger/proposals/IDEA-20261004-edbd24.yaml
      provenance: internal
      verified_by: coordinator session 2026-10-05, proposal file read
      role: source claim
  reduction_chain:
    core_problem: Separation of eight endomorphisms by E[8] equality bits.
    corollaries: []
  predictions:
    - metric: fiber_count
      direction: equal
      minimum_effect: "7 at each prime"
    - metric: largest_fiber
      direction: equal
      minimum_effect: "2 at each prime"
    - metric: fix_counts
      direction: equal
      minimum_effect: "64, 8, 8, 4, 8, 8, 2 at p=7 and p=23; 64, 8, 16, 4, 8, 16, 2 at p=31"
  test_boundary:
    instances:
      - E[8] equality bits for the eight witnesses at p in {7, 23, 31}
    parameters:
      primes: [7, 23, 31]
      curve: "y^2 = x^3 + x"
      torsion: 8
    implementation: >-
      Affine addition over F_{p^2}, with both Frobenius routes.
    budget:
      maximum_runs: 6
      maximum_memory_gb: 2
  falsification_conditions:
    - >-
      Both Frobenius routes agree, iota squared equals negation,
      and a fiber membership or a fixed-point count differs from
      the statement.
  interpretation_limits:
    - H-SSI-cb227f is unchanged. This record does not replace it.
    - Not a SÉTA implementation and not an EndRing theorem.
    - A timeout, a crash, or a route disagreement is not evidence against the statement.
  dominated_by:
    verdict: not_applicable
    justification: A finite torsion audit. No exponent is claimed.
  sota_delta:
    time_exponent_change: 0
    memory_exponent_change: 0
    quantitative_audit_delta: >-
      Records seven fibers at each prime, with the p=31 fixed-point
      counts 64, 8, 16, 4, 8, 16, 2.
  status_note: >-
    Approved with EXP-SSI-5bacb4 by DEC-20261005-0305c1 under the
    standing user authorization of 2026-09-06.
