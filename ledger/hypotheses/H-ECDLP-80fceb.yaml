hypothesis:
  id: H-ECDLP-80fceb
  question_id: RQ-ECDLP-165d4b
  goal_id: GOAL-ECDLP-001
  source_proposal: coordination/goals/GOAL-ECDLP-001/proposals/NON-INDEX-ECDLP-IV-20260808/H-ECDLP-1853dc.yaml
  supersedes_hypothesis: H-ECDLP-1853dc
  statement: >-
    On a pre-registered, fail-closed toy corpus of ordinary prime-order
    prime-field curves with independently certified subgroup-preserving
    automorphisms, a fully charged Pollard-rho walk canonicalized by the
    verified automorphism has lower normalized charged work than the ordinary
    and negation-only controls for at least one held-out family; this is a
    finite constant-factor prediction and does not change the generic 1/2
    exponent.
  mechanism: >-
    A verified F_p-defined automorphism acts by a certified eigenvalue lambda
    on the prime subgroup. Canonicalizing each rho state to the lexicographically
    smallest encoded orbit representative and transforming its (a,b)
    coefficients by lambda reduces the collision state space while retaining
    a certificate-recoverable discrete-log equation.
  assumptions:
    - Every admitted curve, subgroup, twist, automorphism, eigenvalue, and orbit stabilizer is certified before any walk starts.
    - The deterministic partition function is identical across paired modes except for the declared quotient map.
    - The cost model charges all preprocessing, maps, canonicalization, retries, recovery, memory, and serialization consistently.
    - The held-out family and seed split is fixed before any candidate-family outcome is observed.
  proof_search_map:
    bottleneck: >-
      Determine whether quotienting by a verified automorphism lowers complete
      charged collision-search cost beyond negation, after all overheads.
    baseline_embedding:
      parameter_slice: >-
        Frozen rho transition fixture on a 101-point prime subgroup with
        C-BASE and C-NEG coefficient/certificate equations.
      reproduction_check: >-
        Applies as a pre-run fixture: the implementation must reproduce the
        same state transition, negation representative, and collision equation
        from the committed audit artifact before instance generation.
      audit_status: frozen_fixture_required_before_approval
    observation_collision:
      observable: normalized charged work and verified scalar recovery
      distinct_preimage_search: >-
        A deterministic two-preimage fixture checks that quotient-equivalent
        states are not counted as independent collisions and that a nontrivial
        coefficient difference recovers the same scalar certificate.
      audit_status: frozen_fixture_required_before_approval
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: verified automorphism orbit representative
        predicted_gain: at most the declared effective orbit-size ceiling after overhead
    quantifier_order: >-
      For every fixed manifest row and seed, first validate all certificates;
      then run every paired variant with the same target scalar and stopping
      rule; only then aggregate train or held-out family statistics.
    method_ceiling:
      strongest_certifiable_claim: >-
        A bounded toy finite-size constant-factor difference in charged rho work
        for the declared family, controls, seeds, and budget only.
      nearby_object_control: >-
        Matched same-order random ordinary curves and a deterministic relabel
        control with no claimed structural advantage.
    proof_obligations:
      - claim: certificate and walk correctness
        responsibility: fail_closed_verifier_and_recovery_check
      - claim: orbit-size and eigenvalue feasibility
        responsibility: automorphism_certificate
      - claim: charged cost comparison
        responsibility: frozen_cost_model_and_receipts
      - claim: no exponent improvement inferred from finite sizes
        responsibility: held_out_slope_ceiling_and_scope
  rerandomization: null
  asymptotic_claim:
    problem: prime-order ECDLP on E(F_p)
    prior_best: ell^(1/2) generic Pollard-rho operations
    time_exponent: 1/2
    memory_exponent: 0
    hidden_cofactor: >-
      None hidden in the primary metric: setup, map, canonicalization, retry,
      recovery, memory, and serialization charges are explicit.
    claim_kind: finite_constant_factor_only
  heuristic_assumptions:
    - id: HEUR-80fceb-01
      formal_statement: >-
        Conditional on the admitted certificate set and after the fixed
        partition/cycle controls pass, each quotient walk is sufficiently mixed
        for the measured finite-size collision distribution.
      random_model_justification: >-
        The birthday model is a comparison prediction only; the protocol emits
        cycle-tail and collision-certificate diagnostics and rejects any result
        when the pre-registered non-randomness predicate fires.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-a76937
      falsification_condition: >-
        Any certificate failure, persistent cycle predicate failure, recovery
        mismatch, or control-corrected held-out comparison outside the declared
        effect/tolerance rule falsifies this finite-scope prediction.
  structural_ingredients:
    - description: verified subgroup-preserving F_p automorphism
      citation: >-
        GLV/GLS and automorphism-map rho methods are the prior mechanism class;
        this record makes no literature novelty or crypto-scale claim.
      role: representation_reduction
  reduction_chain:
    core_problem: prime-order ECDLP on E(F_p)
    corollaries: []
  predictions:
    - metric: held_out_median_normalized_charged_work_ratio_full_to_negation
      direction: lower
      minimum_effect: >-
        The Hodges-Lehmann paired median ratio is <= 0.90 with a two-sided
        permutation-test p-value <= 0.05 on the four held-out groups, all
        certificates valid, and no invalid/stopping branch fired.
    - metric: fitted_log_log_slope
      direction: equal
      minimum_effect: >-
        No slope below 1/2 is accepted; the slope is descriptive only and must
        carry a finite-size confidence interval and the toy claim ceiling.
  test_boundary:
    instances:
      - deterministic ordinary prime-field short-Weierstrass curves with certified prime subgroup
      - j=0 or j=1728 curves only when the exact automorphism certificate passes
      - matched random ordinary same-order controls generated before walk outcomes are visible
    parameters:
      train_groups: 8
      held_out_groups: 4
      seeds: [101, 103, 107, 109, 113, 127, 131, 137, 139, 149, 151, 157]
      field_bits: [12, 13, 14, 15]
      subgroup_checks: [prime_order, twist_order, cofactor_le_4, non_anomalous, embedding_degree_gt_12]
      quotient_variants: [C-BASE, C-NEG, C-FULL, C-RELABEL, C-RAND-BASE, C-RAND-NEG]
    implementation: >-
      Pure-Python deterministic rho harness with exact finite-field arithmetic,
      exhaustive point counts for the toy p bound, fail-closed certificates,
      orbit canonicalization, scalar recovery, and raw per-step receipts.
    budget:
      wall_clock_seconds: 14400
      memory_gb: 8
      maximum_runs: 80
  falsification_conditions:
    - Any certificate verifier accepts a row with a false curve, subgroup, twist, eigenvalue, or field-of-definition predicate.
    - Any paired mode uses a different target scalar, partition seed, success rule, or charge definition.
    - Any held-out group misses the pre-registered effect rule or its certificate/recovery checks.
    - Any apparent gain is explained by uncharged setup, relabelling, memory, serialization, retries, or cycle handling.
  interpretation_limits:
    - The result is toy finite-size evidence and is not a cryptographic-scale break.
    - The null closes only the certified curve families, controls, sizes, seeds, and cost model tested.
    - No finite slope estimate supports an asymptotic exponent claim.
  dominated_by: null
  dominated_by_status: no_result_claimed
  dominated_by_note: >-
    Pareto domination is deliberately not asserted at specification time. The
    experiment claims no measured result; any later frontier comparison must
    cite quantified time, memory, and data/query rows.
  sota_delta:
    status: not_applicable_no_result_claimed
    generic_time_exponent: 0.0
    memory_exponent: 0.0
    data_query_improvement: 0
    cryptographic_security_bits_reduced: 0
  status: specified
  proposed_by: coordinator
