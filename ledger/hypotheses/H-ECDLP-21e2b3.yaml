  statement: >-
    The integer 31 has bit length 5. Its bits are 1, 1, 1, 1, and 1.
    Reaching it by doubling and adding uses 4 doublings and 4
    additions. Five exceeds four by 1. The product of 5, 4, and 4
    is 80. Their sum is 13. Two readings of the addition count are
    both 4, so that gap is 0 and their product is 16.
  mechanism: >-
    The proposal writes the counts 5, 4, and 4. This contract
    checks those integers. It does not add a curve point.
