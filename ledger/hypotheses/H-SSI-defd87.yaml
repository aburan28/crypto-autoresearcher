# H-SSI-defd87 — specified from IDEA-20261005-2f5c3f.
# Protocol approval is DEC-20261006-a0c0e6. The source idea lives on
# origin/design/cycle-20261005-domain and is not copied here.
# This record asserts no isogeny-path algorithm and no ECDLP exponent
# change. No curve was enumerated in this design.
hypothesis:
  id: H-SSI-defd87
  question_id: RQ-SSI-001
  source_proposal: IDEA-20261005-2f5c3f
  goal_id: null
  goal_id_note: >-
    This design binds the question RQ-SSI-001 and does not attach a
    goal record. It does not create one.
  status: approved
  status_note: >-
    approved means the Cartier-Manin rank protocol in EXP-SSI-043775 is
    approved for a later executor. It does not mean the rank set {0, 1, 2}
    was observed. Status moves only by DEC-20261006-a0c0e6 under the
    standing user authorization of 2026-09-06. No quintic was enumerated
    in this design.
  proposed_by: coordinator
  conversion_note: >-
    The predicted rank set {0, 1, 2}, the names ordinary / intermediate /
    superspecial, the elliptic trace control, and the refusal to move an
    isogeny-path exponent are carried from IDEA-20261005-2f5c3f, which
    was read from origin/design/cycle-20261005-domain. The Coordinator
    froze the matrix index, the Newton p-rank, and the separation rows
    before any run of EXP-SSI-043775.

  statement: >-
    TEST BOUNDARY. Every monic squarefree quintic f over F_5. The curve
    is y^2 = f, genus 2, one point at infinity. The instrument is one
    2 by 2 Cartier-Manin matrix of f^2, with the index frozen in
    EXP-SSI-043775. The rank is the rank of that matrix over F_5.

    PRE-REGISTERED PREDICTION, fixed before any run. The set of those
    ranks equals {0, 1, 2}. Rank 2 is ordinary, rank 1 is intermediate,
    and rank 0 is superspecial, in the sense frozen in the experiment:
    rank 2 if and only if the Newton p-rank is 2; rank 0 occurs only on
    Newton p-rank 0; and among the Newton p-rank 0 curves both ranks 0
    and 1 occur. A missing rank is a negative. A rank that fails one of
    those three separation rows is a negative. Both are negatives, so
    success can fail.

    DISTINGUISHABLE OUTCOMES. (1) The elliptic mismatch counts are 0,
    3125 monic quintics were visited, the squareful sentinel is excluded,
    the rank set is {0, 1, 2}, and every separation row holds: success
    for the prediction. (2) The same instrument checks pass and the rank
    set is a proper subset of {0, 1, 2}, or a separation row fails:
    negative. (3) An elliptic mismatch count is positive, the visit
    count is not 3125, the sentinel is accepted, or a Newton coefficient
    is not integral: invalid, not evidence. (4) A timeout or crash:
    failed_infrastructure, not evidence.

    No isogeny-path algorithm is claimed. No discrete-log exponent moves.
    The generic-group bound stays Omega(p^{1/2}).

  mechanism: >-
    For y^2 = f over a field of odd characteristic, one Cartier-Manin
    matrix is read from coefficients of f^{(p-1)/2}. At p = 5 that power
    is f^2. Heuristic H1 says the F_5-rank r of the frozen 2 by 2 matrix
    equals 2 minus the a-number. Rank 2 is then a-number 0, the ordinary
    shape, and must match Newton p-rank 2. Rank 0 is a-number 2, the
    superspecial shape, and must sit on Newton p-rank 0. Rank 1 is
    a-number 1. Newton p-rank 0 contains both a-number 2 and a-number 1
    when both group schemes occur, so both matrix ranks 0 and 1 must
    appear on that Newton class. The elliptic control accepts the index
    only when the genus-1 entry vanishes exactly on traces divisible by
    5. In dimension 1 the supersingular and superspecial group schemes
    are the same scheme, so that control has rank-image size 2 when both
    traces occur. The surface list is where image size 3 can appear.

  assumptions:
    - The curve list is every monic squarefree quintic over F_5. Even-degree sextics are outside the list.
    - H1 identifies matrix rank with 2 minus the a-number, once the elliptic control has accepted the index.
    - Newton p-rank is computed from point counts by the frozen characteristic polynomial, not from the Cartier matrix.
    - The index is the one frozen in the experiment. A second index is not tried after any surface rank is seen.
    - Toy scope is F_5 and these models. No statement about a cryptographic prime, CSIDH, or SQIsign.

  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
    not_applicable_reason: >-
      This is a complete enumeration of 2 by 2 matrices over F_5, not a
      theorem, bound, certificate, reduction, or closure. The a-number
      dictionary is a prediction the elliptic mismatch count and the
      Newton comparison can reject.

  asymptotic_claim:
    problem: none — no complexity improvement is claimed
    prior_best: Pollard rho at exponent 1/2, not beaten; no isogeny-path exponent is stated
    time_exponent: unchanged
    memory_exponent: unchanged
    hidden_cofactor: >-
      None in an o(1) term. The output is a set of at most three ranks,
      two mismatch counts, and the Newton comparison. No isogeny graph
      is stored.
    claim_kind: not_applicable

  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        For y^2 = f over F_5, f monic squarefree of degree 5, the
        a-number of the Jacobian equals 2 minus the F_5-rank of the
        Cartier-Manin matrix of f^2, once the same index on a short
        Weierstrass elliptic curve vanishes if and only if 5 divides
        the trace.
      random_model_justification: >-
        The sample is the complete list of monic quintics, not a random
        sample of curves. No uniformity over a family is assumed.
      supporting_results: []
      validation_experiment_ids:
        - EXP-SSI-043775
      falsification_condition: >-
        The elliptic mismatch count is positive, or a squarefree quintic
        has Cartier rank 2 while its Newton p-rank is not 2, or Cartier
        rank other than 2 while its Newton p-rank is 2.
    - id: H2
      formal_statement: >-
        a-number adds on a product of elliptic curves. Two supersingular
        elliptic curves over F_5, each of a-number 1 under the accepted
        index, give a product of a-number 2. A Jacobian of Cartier rank
        1 is then not that product.
      random_model_justification: >-
        This is the universal property of a product of group schemes,
        checked on the elliptic list by recording that each trace-zero
        factor has Cartier entry 0. It is not a random model.
      supporting_results: []
      validation_experiment_ids:
        - EXP-SSI-043775
      falsification_condition: >-
        The elliptic control has accepted the index, a trace-zero
        elliptic curve is on the list, and its Cartier entry is not 0.

  structural_ingredients:
    - description: >-
        KN-LIT-948 relays an abstract. The authors classify p-torsion
        group schemes of certain CM reductions and give algorithms that
        construct supersingular non-superspecial and superspecial
        abelian varieties in dimensions 2 and 3. This hypothesis does
        not run those algorithms. The PDF was not opened.
      citation: KN-LIT-948
      provenance: internal
      verified_by: knowledge/literature/KN-LIT-948.md
      role: adjacent classification; not a runtime and not this census
    - description: >-
        KR-RHO-13bf67 states that a generic-group discrete logarithm in
        a group of prime order p needs Omega(square root of p) group
        operations. This hypothesis does not change that bound.
      citation: KR-RHO-13bf67
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
      role: unchanged generic-group baseline
    - description: >-
        KR-RHO-755e35 states that an isogeny walk does not reach a curve
        of a different group-order weakness. This hypothesis builds no
        walk.
      citation: KR-RHO-755e35
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
      role: scope fence; no isogeny-path algorithm
    - description: >-
        Recalled pointer, paper not opened: for y^2 = f in odd
        characteristic the Cartier-Manin matrix is read from
        coefficients of f^{(p-1)/2}, and the genus-1 entry is the
        coefficient of x^{p-1}. The elliptic control accepts or rejects
        that index. The text was not opened.
      citation: Yui, Cartier-Manin matrix of a hyperelliptic Jacobian
      provenance: recalled
      verified_by: null
      role: pointer only; the index used is the one the elliptic control accepts

  reduction_chain:
    core_problem: >-
      Whether the Cartier-Manin ranks on the squarefree monic quintics
      over F_5 are exactly {0, 1, 2} and separate ordinary, intermediate,
      and superspecial as frozen in EXP-SSI-043775. Not an attack.
    corollaries: []

  predictions:
    - metric: cartier_rank_image
      direction: different
      minimum_effect: >-
        The set of ranks equals {0, 1, 2}. A missing element is the
        negative.
    - metric: rank_versus_newton
      direction: different
      minimum_effect: >-
        Rank 2 matches Newton p-rank 2 in both directions. Rank 0 occurs
        only on Newton p-rank 0. Both ranks 0 and 1 occur on Newton
        p-rank 0. Any failure of those rows is the negative.

  test_boundary:
    instances:
      - every monic quintic over F_5, 3125 polynomials, before the squarefree filter
      - the squarefree ones, as the surface list
      - every short-Weierstrass curve y^2 = x^3 + A x + B over F_5, as the elliptic control
    parameters:
      field: F_5
      genus: 2
      predicted_rank_set: [0, 1, 2]
      monic_quintic_count: 3125
    implementation: >-
      A later executor enumerates the quintics, the matrices, and the
      Newton polygons. This design does not enumerate them.
    budget:
      enforcement: advisory
      maximum_runs: 2
      note: One exhaustive enumeration. The second run id is an infrastructure retry, not a second scientific sample.

  falsification_conditions:
    - The rank image on the squarefree monic quintics is a proper subset of {0, 1, 2}.
    - A squarefree quintic has Cartier rank 2 and Newton p-rank different from 2, or Newton p-rank 2 and Cartier rank different from 2.
    - A squarefree quintic has Cartier rank 0 and Newton p-rank different from 0.
    - The Newton p-rank 0 curves do not exhibit both Cartier ranks 0 and 1.
    - The elliptic mismatch count is positive. That failure is invalid, not a surface negative: the index is rejected and surface ranks are not read.

  interpretation_limits:
    - Toy scope: F_5, genus at most 2, odd-degree hyperelliptic models and short-Weierstrass elliptic curves. No statement about cryptographic primes, CSIDH, or SQIsign.
    - The supersingular-isogeny exponents named by RQ-SSI-001 stay where they are. This record produces a set of ranks. It does not produce a path, a collision, or an endomorphism ring.
    - KN-LIT-948's construction algorithms were not run. Agreement of the rank image with {0, 1, 2} is not a reproduction of that paper.
    - Newton p-rank 0 does not by itself name the a-number. The split of ranks 0 and 1 on that class is the separation the matrix is predicted to provide.
    - Even-degree models y^2 = sextic are outside the list.

