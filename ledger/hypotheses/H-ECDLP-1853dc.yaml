hypothesis:
  id: H-ECDLP-1853dc
  question_id: RQ-ECDLP-165d4b
  goal_id: GOAL-ECDLP-001
  source_proposal: coordination/goals/GOAL-ECDLP-001/proposals/NON-INDEX-ECDLP-IV-20260808/H-ECDLP-1853dc.yaml
  statement: >-
    Some ordinary prime-field curves with a verified nontrivial F_p-defined
    automorphism admit a Pollard-rho orbit quotient whose normalized charged
    solve cost is lower than both ordinary rho and the negation-only control,
    while retaining the generic 1/2 exponent.
  mechanism: >-
    A subgroup-preserving automorphism acts as a known eigenvalue on the prime
    subgroup. The rho walk is canonicalized on verified orbit representatives,
    reducing the effective collision space without exposing the discrete log.
  assumptions:
    - The automorphism is public, efficiently evaluable, and defined over F_p.
    - The action on the measured subgroup is free except for explicitly recorded stabilizers.
    - Canonicalization does not bias the walk or create uncounted fruitless cycles.
  proof_search_map:
    bottleneck: >-
      Determine whether quotienting by a verified automorphism lowers complete
      collision-search cost beyond the already-known negation baseline.
    baseline_embedding:
      parameter_slice: ordinary prime-order E(F_p) with no quotient beyond negation
      reproduction_check: >-
        Reproduce the same seeded rho collision distribution for baseline and
        negation-only modes before enabling any higher-order quotient.
    observation_collision:
      observable: normalized rho collision cost and recovered scalar certificate
      distinct_preimage_search: >-
        Compare orbit-canonicalized walks to same-shape walks with a random
        relabelling that preserves point count but destroys the automorphism.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: verified automorphism orbit representative
        predicted_gain: constant factor approximately sqrt(orbit_size) at best
    quantifier_order: >-
      For every admitted instance and seed, first validate the curve, subgroup,
      automorphism, and certificate; then compare all fixed walk variants. A
      positive family claim requires replication across held-out primes and
      curves, not a post-selected instance.
    method_ceiling:
      strongest_certifiable_claim: >-
        A bounded constant-factor quotient advantage in toy/medium charged rho
        cost, or no such advantage in the tested family.
      nearby_object_control: >-
        Negation-only rho and a matched random ordinary curve with the same
        prime subgroup order.
    proof_obligations:
      - claim: walk correctness and collision recovery
        responsibility: correctness
      - claim: orbit-size and eigenvalue certificate
        responsibility: feasibility
      - claim: normalized cost comparison
        responsibility: runtime
      - claim: no exponent improvement inferred from finite sizes
        responsibility: scope
  rerandomization: null
  asymptotic_claim:
    problem: prime-order ECDLP on E(F_p)
    prior_best: ell^(1/2) generic Pollard-rho operations
    time_exponent: 1/2
    memory_exponent: 0
    hidden_cofactor: automorphism evaluation, canonicalization, and fruitless-cycle overhead
    claim_kind: constant_factor
  heuristic_assumptions:
    - id: HEUR-1853dc-01
      formal_statement: >-
        After orbit canonicalization and removal of fruitless cycles, the rho
        walk behaves as a sufficiently mixed random walk on the quotient state
        space for the measured family.
      random_model_justification: >-
        The baseline and negation controls are calibrated against the standard
        birthday collision model; deviations are measured rather than assumed.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-51921d
      falsification_condition: >-
        Seeded walks show persistent non-random cycle structure, quotient
        collision recovery fails, or the normalized cost does not improve over
        controls after all declared overheads.
  structural_ingredients:
    - description: efficiently computable subgroup-preserving automorphism
      citation: >-
        GLV/GLS endomorphism constructions and orbit-based rho methods are
        established prior mechanisms; this experiment tests their charged
        prime-field instance boundary.
      role: representation_reduction
  reduction_chain:
    core_problem: prime-order ECDLP on E(F_p)
    corollaries: []
  predictions:
    - metric: normalized charged rho work
      direction: lower
      minimum_effect: >-
        A replicated reduction relative to negation-only control exceeding the
        pre-registered measurement tolerance, with no slope change claimed.
    - metric: fitted log-log slope versus ell
      direction: different
      minimum_effect: >-
        No accepted positive threshold at this stage; any apparent slope below
        1/2 triggers independent replication and review-breakthrough review.
  test_boundary:
    instances:
      - deterministic ordinary prime-field curves with prime subgroup order
      - j=0 and j=1728 candidates only when all field-of-definition checks pass
      - held-out random ordinary same-order controls
    parameters:
      seeds: 8
      subgroup_checks: [prime_order, twist, cofactor, anomalous, embedding_degree]
      quotient_variants: [baseline, negation, verified_full_automorphism]
    implementation: >-
      Use a deterministic rho harness with a certificate verifier, explicit
      orbit canonicalization, and raw per-walk receipts.
    budget:
      wall_clock_seconds: 14400
      memory_gb: 8
      maximum_runs: 12
  falsification_conditions:
    - The full quotient is not defined over F_p or does not preserve the subgroup.
    - Collision recovery or scalar certificates fail on any admitted run.
    - Matched controls erase the normalized advantage.
    - Any apparent gain is caused by uncharged setup, memory, or cycle retries.
  interpretation_limits:
    - A toy/medium constant-factor result is not a cryptographic-scale break.
    - A null result closes only the tested automorphism families and parameter range.
    - No finite slope estimate supports an asymptotic exponent claim by itself.
  dominated_by: Pollard rho on the declared prime-field ECDLP scope
  sota_delta:
    generic_time_exponent: 0.0
    memory_exponent: 0.0
    data_query_improvement: 0
    cryptographic_security_bits_reduced: 0
  status: specified
  proposed_by: coordinator
