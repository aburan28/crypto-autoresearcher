        product, and the sum were recomputed in this design
        session. That computation is not a run.
      reproduction_check: >-
        One route computes 2 to the power 15. The other computes 2
        to the power 14. They must agree that the sizes are 32768
        and 16384.
    observation_collision:
      observable: The table-size gap 16384 and the product 536870912.
      distinct_preimage_search: >-
