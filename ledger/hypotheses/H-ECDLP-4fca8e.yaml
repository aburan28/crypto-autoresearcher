  title: >-
    32768 exceeds 16384 by 16384
  statement: >-
    A window of width 16 stores 32768 entries. A window of width 15
    stores 16384. Two to the power 15 is 32768. Two to the power 14
    is 16384. Thirty-two thousand seven hundred sixty-eight exceeds
    sixteen thousand three hundred eighty-four by 16384. The product
    of the two table sizes is 536870912. Their sum is 49152.
    Two width-15 tables each store 16384, so that gap is 0 and their
    product is 268435456.
  mechanism: >-
    The proposal writes the widths 16 and 15 and the sizes 32768 and
    16384. This contract checks those integers. It does not add a
    curve point.
  assumptions: []
  proof_search_map:
