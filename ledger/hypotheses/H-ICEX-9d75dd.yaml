hypothesis:
  id: H-ICEX-9d75dd
  question_id: RQ-ICEX-001
  added: '2026-08-25'
  derived_from_idea: IDEA-20260805-45bf55
  statement: >-
    Charging right-censored attempts at their cap, without reporting a censoring fraction and
    without declaring which aggregate is reported, makes a measured cost exponent a function of an
    infrastructure parameter rather than of the algorithm. On a matched Pollard-rho baseline whose
    true group-operation exponent is exactly 1/2, with cap multiple c = M / sqrt(ell), the charged
    aggregate ratio is erf(c / sqrt 2) and the cost-per-certified-success ratio is
    erf(c / sqrt 2) / (1 - exp(-c^2 / 2)) - two quantities monotone in OPPOSITE directions, both
    tending to 1. With the cap M held FIXED across a ladder, c shrinks like ell^{-1/2}, so the
    charged aggregate saturates at M and its fitted exponent tends to 0 while the
    cost-per-success aggregate tends to 2 ell / M and its fitted exponent tends to 1. A single
    unstated accounting convention therefore selects between a measured 0 and a measured 1 on an
    object whose exponent is known. Scaling the cap as M = c0 sqrt(ell) restores a slope whose
    confidence interval contains 0.500.
  mechanism: >-
    An attempt has cost X with survival S(t) = P(X > t). A cap M truncates it - the charged cost is
    min(X, M) and the terminal code is a timeout when X > M. Two elementary and exact facts -
    E[min(X, M)] = integral of S from 0 to M, and E[X] = integral of S from 0 to infinity - give
    E[min(X, M)] <= E[X] ALWAYS, with deficit the integral of S beyond M. The charged aggregate is
    therefore a lower bound on the cost of the work attempted, never an unbiased estimate, and the
    bias is one-sided by a theorem rather than by assumption. For Pollard rho under the birthday
    model, S(t) = exp(-t^2 / (2 ell)) in step units, so E[X] = sqrt(pi ell / 2),
    E[min(X, M)] = sqrt(pi ell / 2) erf(M / sqrt(2 ell)) and P(X <= M) = 1 - exp(-M^2 / (2 ell)).
    Both ratios depend on M and ell only through c = M / sqrt(ell), so the censoring bias is
    scale-free in c - controllable by scaling the cap with sqrt(ell) and uncontrollable by fixing it.
    The inversion worth stating explicitly is that a rule forbidding a timeout to count as NEGATIVE
    mathematical evidence is correct and must be kept; charging a timeout at its cap commits the
    mirror error, converting it into a CHEAP ATTEMPT and hence into POSITIVE evidence for the arm
    that timed out. Both readings are errors and only one is currently guarded against.
  assumptions:
  - >-
    That an attempt cost distribution has a right tail reaching beyond the cap at the tested cells.
    For rho this is exactly quantified by the birthday model. For an algebraic relation search it is
    asserted rather than measured and is labelled RELAYED-UNVERIFIED; no such arm is run and no such
    censoring fraction is claimed.
  - >-
    That post-hoc capping of recorded full costs isolates the ACCOUNTING effect. It deliberately
    eliminates real timeout side effects - partial-state loss, restart overhead, cache effects - and
    therefore does not measure the operational cost of a timeout, which is stated rather than
    discovered later.
  - >-
    That step units, not wall clock, are the unit of the derivation. Converting a wall-clock cap into
    step units requires a per-step time, which is machine-dependent, so the cap ladder is defined
    directly in step units and any wall-clock quantity is translated only for the separate budget
    arithmetic.
  - >-
    That the fitted ladder slope of log2 of an aggregate on the bit size is the estimator of the
    exponent under test. Its confidence interval is computed by bootstrap over the recorded runs.
  proof_search_map:
    bottleneck: >-
      The aggregation step that retains min(X, M) and discards the censoring indicator. Removing it -
      by reporting the censoring fraction and declaring the aggregate - is what changes the measured
      exponent, and nothing else in the accounting does.
    baseline_embedding:
      parameter_slice: >-
        c = infinity, the uncensored arm on the identical recorded runs. The analysis must reproduce
        an aggregate ratio of exactly 1.000, a per-success ratio of exactly 1.000, and a fitted slope
        whose interval contains 0.500.
      reproduction_check: >-
        A frozen regression fixture on the uncensored arm at every ladder cell. If the uncensored slope
        does not contain 0.5 the implementation is not the algorithm modelled and no censoring
        conclusion may be drawn.
    observation_collision:
      observable: >-
        The charged aggregate alone, without the censoring indicator.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, and the success IS the finding. Cohorts with wildly different
        true costs map to the same charged aggregate - everything from all attempts finishing just under
        M to all attempts being stopped at M and running arbitrarily long. Exhibiting two such cohorts
        explicitly is what upgrades "censoring might matter" to "the observable cannot separate them".
    constructive_transforms:
    - transform: stronger_invariant
      proposed_object: >-
        Retain the pair (min(X, M), indicator X <= M) rather than the first coordinate alone, and report
        the censoring fraction per cell per arm as a mandatory metric. It is free - the terminal codes
        are already recorded.
      predicted_gain: >-
        Makes the size of the correction visible rather than assumed small, and is a precondition for any
        survival-corrected aggregate.
    - transform: specialization_pack
      proposed_object: >-
        Scale the cap with the cell, M = c0 sqrt(ell) for a declared c0, so the bias ratio is CONSTANT
        across the ladder.
      predicted_gain: >-
        A constant bias ratio is absorbed into the intercept of a slope fit instead of contaminating the
        slope. This is the highest-value change available and it costs nothing.
    quantifier_order: >-
      CLAIMED - FOR ALL distributions of attempt cost and FOR ALL caps M, E[min(X, M)] <= E[X], so the
      charged aggregate is a lower bound on the attempted work. That claim is distribution-free.
      CLAIMED SEPARATELY AND CONDITIONALLY - FOR the birthday model specifically, the two ratios take the
      stated closed forms and the fixed-cap asymptotic exponents are 0 and 1. That claim depends on
      HEUR-ICEX-C1 and is void if the survival model fails, while the distribution-free half survives.
      NOT CLAIMED - anything about an index-calculus arm, whose tail behaviour is relayed and unmeasured.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On a generic baseline whose exponent is known exactly, a charging convention that this program's
        artifacts admit shifts the measured exponent by a derivable amount, in a direction determined by
        which aggregate is charged, and a sqrt(ell)-scaled cap restores it." It can NEVER certify anything
        about index calculus, cannot move any exponent, and licenses no status change.
      nearby_object_control: >-
        BSGS, whose cost is nearly deterministic rather than heavy-tailed. At the same c its censoring
        distortion must be SMALLER than rho's, because a concentrated distribution has less mass beyond any
        cap set above its mean. This control CUTS AGAINST the headline - it shows the effect is a property
        of the cost DISTRIBUTION, so an arm with concentrated cost is barely affected - and it is included
        for exactly that reason.
    proof_obligations:
    - claim: E[min(X, M)] <= E[X] for every distribution and every cap.
      responsibility: correctness
    - claim: The two ratios take the stated closed forms under the birthday model.
      responsibility: correctness
    - claim: With M fixed, the charged aggregate's fitted exponent tends to 0 and the per-success aggregate's tends to 1.
      responsibility: runtime
    - claim: A sqrt(ell)-scaled cap restores a slope interval containing 0.500.
      responsibility: strictness
    - claim: The uncensored arm reproduces the true exponent 1/2.
      responsibility: baseline
    - claim: Nothing here is a statement about index calculus or any relation search.
      responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-ICEX-C1
    formal_statement: >-
      The Pollard-rho step count at group order ell has survival function
      S(t) = exp(-t^2 / (2 ell)) (1 + o(1)), hence E[X] = sqrt(pi ell / 2) and
      E[min(X, M)] = sqrt(pi ell / 2) erf(M / sqrt(2 ell)).
    random_model_justification: >-
      The birthday computation, derived from S(t) rather than imported. The heuristic step is the passage
      from a structured r-adding walk to a uniform random function, which is known to be imperfect for
      small r and for which no source is cited here.
    supporting_results: []
    validation_experiment_ids:
    - EXP-ICEX-a40cf3
    falsification_condition: >-
      The empirical survival of the recorded step counts departs from exp(-t^2 / (2 ell)) beyond the declared
      Kolmogorov-Smirnov band at any cell. THE SPECIFIC FORCED NUMBERS ARE THEN VOID; the one-sided inequality
      E[min(X, M)] <= E[X] and the repairs SURVIVE, because they hold for every distribution. This split is
      declared before the run so that a model failure cannot be used to rescue either side.
  - id: HEUR-ICEX-C2
    formal_statement: >-
      The per-attempt wall cap in the frozen protocol artifact is CONSTANT across the ladder cells rather than
      re-declared per cell at seal time.
    random_model_justification: >-
      Not a distributional assumption at all - it is a reading of a committed artifact, and it is the single
      reading on which the slope half of this hypothesis depends. Recorded as a heuristic rather than as a fact
      precisely because its author is unavailable to confirm it.
    supporting_results: []
    validation_experiment_ids:
    - EXP-ICEX-a40cf3
    falsification_condition: >-
      A recorded statement that the cap is per-cell and sqrt(ell)-scaled by intent. The slope half is then void;
      the level half, the aggregate ambiguity, the absent censoring fraction and the budget arithmetic stand
      unaffected.
  structural_ingredients:
  - description: >-
      E[min(X, M)] = integral of the survival function from 0 to M, and hence E[min(X, M)] <= E[X] for every
      distribution.
    citation: null
    provenance: internal
    verified_by: >-
      Elementary and re-derived in the mechanism; the distribution-free direction is what survives a failure of
      the survival model.
    role: the one-sided bias theorem
  - description: >-
      The birthday survival function S(t) = exp(-t^2 / (2 ell)) for a pseudorandom walk in a group of order ell.
    citation: null
    provenance: recalled
    verified_by: >-
      Re-derived rather than cited, and its goodness of fit to the recorded step counts is a declared control
      that runs before any ratio is interpreted.
    role: the closed form that makes the forced values computable
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
  - metric: >-
      Ratio of the censored charged aggregate to the uncensored aggregate for matched Pollard rho, at cap
      multiples c in {0.25, 0.5, 1, 2, 4}, pooled over ladder cells
    direction: lower
    minimum_effect: >-
      FORCED VALUES 0.197413, 0.382925, 0.682689, 0.954500, 0.999937, each within the Monte Carlo band at the
      declared replicate count, derived before any run from erf(c / sqrt 2) and monotone increasing in c. A
      measured ratio outside the band at any c falsifies either the birthday survival model or the
      implementation, and the separate goodness-of-fit control decides which.
  - metric: >-
      Ratio of censored-with-restart cost per certified solve to the uncensored mean, same cells and same c ladder
    direction: higher
    minimum_effect: >-
      FORCED 6.416425, 3.258850, 1.735051, 1.103896, 1.000272, monotone DECREASING in c, i.e. the OPPOSITE
      direction to the first prediction. The pre-registered content is the OPPOSITION ITSELF - if both aggregates
      move the same way, the account is wrong.
  - metric: >-
      Fitted ladder slope of log2 of the charged aggregate against bit size, with a FIXED cap held constant across
      the ladder
    direction: lower
    minimum_effect: >-
      Strictly below 0.35, against a true exponent of exactly 0.5 and against the uncensored control's slope, whose
      interval must contain 0.5. The asymptotic forced value is 0; the 0.35 threshold is set conservatively because
      the ladder is short and c is not yet small at the smallest cell. A fitted slope inside the uncensored interval
      refutes the slope half.
  - metric: Fitted ladder slope of log2 of cost per certified solve under the same fixed cap
    direction: higher
    minimum_effect: >-
      Strictly above 0.65 against a true 0.5, with asymptotic forced value 1. Together with the previous prediction
      this is the headline - the SAME runs, differing only in an unstated accounting convention, must straddle the
      true exponent from both sides.
  - metric: Fitted ladder slope with the cap scaled as M = c0 sqrt(ell) with c0 = 1, both aggregates
    direction: different
    minimum_effect: >-
      BOTH must return a slope whose interval contains 0.500, because a constant bias ratio is absorbed into the
      intercept. This is the constructive half and it MUST fire; if the repair does not restore the slope, the
      diagnosis is wrong even if the bias is real.
  - metric: Budget feasibility ratio recomputed from the frozen artifact
    direction: higher
    minimum_effect: >-
      EXACTLY 5.3333, from 128 attempts times 300 seconds against 7200 seconds, with 24 full-length attempts
      fitting per campaign. Zero compute, one division, from committed text. If the arithmetic does not reproduce,
      the numbers were misread and that section is withdrawn without prejudice to the rest.
  test_boundary:
    instances: >-
      Matched Pollard rho run to completion on toy groups at n in {8, 10, 12, 16} bits, with the FULL uncensored
      step count recorded per attempt; caps then applied POST HOC to the same recorded costs. A deterministic BSGS
      arm on the same instances as the nearby-object control. No index-calculus arm is run, no relation feed is
      consumed, and no campaign cost aggregate is assembled.
    parameters:
      ladder_bits:
      - 8
      - 10
      - 12
      - 16
      cap_multiples_c:
      - 0.25
      - 0.5
      - 1.0
      - 2.0
      - 4.0
      cap_regimes:
      - fixed M across the ladder
      - M = c0 sqrt(ell) with c0 = 1
      aggregates:
      - charged aggregate, sum of min(X, M)
      - charged cost per certified success, with restart after a timeout
      attempts_per_cell: 2000
      units: step counts, never wall clock
    implementation: >-
      Pure Python, standard library plus numpy for bootstrap resampling with a frozen seed. Post-hoc capping means
      the censored and uncensored arms are the IDENTICAL runs, so the comparison has no between-arm confound at all
      and costs no more than the uncensored arm alone. Recorded through harness/runner.py.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 0.5
      maximum_runs: 8
  falsification_conditions:
  - >-
    The uncensored control's fitted slope interval does not contain 0.5. The instrument is broken; NO negative may
    be reported (AGENTS.md rule 5).
  - >-
    Measured aggregate ratios do not follow erf(c / sqrt 2) within the Monte Carlo band WHILE the empirical survival
    matches exp(-t^2 / (2 ell)). The derivation is wrong and is withdrawn.
  - >-
    The two aggregates move in the SAME direction with c. The opposition claim is refuted and the record must be
    rewritten around whichever direction survives.
  - >-
    Under a fixed cap the fitted slope stays inside the uncensored interval at every cell. The slope-contamination
    claim is refuted at this ladder; the level claim may still stand and is reported separately.
  - >-
    The sqrt(ell)-scaled cap fails to restore a slope interval containing 0.5. The diagnosis is wrong even if the
    bias is real, and the constructive recommendation is withdrawn.
  - >-
    The budget arithmetic does not reproduce 5.3333 and 24. The numbers were misread and that section is withdrawn.
  - >-
    A recorded statement establishes that the cap is per-cell and sqrt(ell)-scaled by intent. The slope half is void;
    the aggregate ambiguity, the missing censoring fraction and the budget arithmetic stand.
  interpretation_limits:
  - >-
    A confirming outcome establishes that a charging convention in one frozen design artifact biases a measured
    exponent by a derivable amount ON A GENERIC BASELINE. It establishes nothing about index calculus, moves no
    exponent, and licenses no status change to any record.
  - >-
    Toy tier and unraisable. The ladder is 8 to 16 bits and the arms are generic algorithms.
  - >-
    NOTHING HERE ARGUES FOR CHARGING TIMEOUTS AS INFINITE OR FOR TREATING THEM AS NEGATIVE MATHEMATICAL EVIDENCE.
    AGENTS.md rule 5 stands unqualified. The argument is that the symmetric error - reading a timeout as a cheap
    attempt - is currently unguarded, and that the guard is a reported fraction plus a scaled cap, not a change to
    how timeouts are classified.
  - >-
    No protocol artifact is superseded or edited by this hypothesis. If an amendment is warranted it is a new
    Coordinator record under a new id naming the exact clause.
  - >-
    Post-hoc capping isolates the accounting effect and deliberately does not measure the operational cost of a real
    timeout - partial-state loss, restart overhead, cache effects. That is a declared limitation, not an oversight.
  distinguishable_outcomes:
  - outcome: >-
      Uncensored control's slope interval contains 0.5; the c = 0.25 positive control lands near 0.197413; both
      ratio families match their forced values within the Monte Carlo band and move in OPPOSITE directions; the
      fixed-cap slopes are below 0.35 and above 0.65 respectively; and the sqrt(ell)-scaled cap restores both slopes
      to intervals containing 0.500.
    means: >-
      The hypothesis holds at the tested scope. A charging convention selects the measured exponent on an object
      whose exponent is known, and the sqrt(ell)-scaled cap repairs it. The next decision is whether to record a
      protocol amendment naming the exact clause - a Coordinator action requiring its own record.
  - outcome: >-
      Under a fixed cap the fitted slope stays inside the uncensored interval at every cell, while the level ratios
      still match their forced values.
    means: >-
      The SLOPE half is refuted at this ladder and the LEVEL half stands. This is a genuine partial negative and is
      reported as one - the ladder is too short, or c is not yet small enough at these cells, for the slope effect to
      appear, and the record is scoped to the level claim alone.
  - outcome: >-
      The two aggregates move in the SAME direction with c.
    means: >-
      The opposition claim - the headline - is REFUTED. The account must be rewritten around whichever direction
      survives, and the derived asymptotic exponents 0 and 1 are withdrawn.
  - outcome: >-
      The sqrt(ell)-scaled repair fails to restore a slope interval containing 0.5.
    means: >-
      The DIAGNOSIS is wrong even if the bias is real. The constructive recommendation is withdrawn, which is the
      most useful negative available here because the repair is what the record exists to offer.
  - outcome: >-
      The uncensored control's slope interval does not contain 0.5, or the empirical survival fails its
      goodness-of-fit band.
    means: >-
      In the first case the instrument is broken - infrastructure signal under AGENTS.md rule 5 - and nothing is
      reportable. In the second, HEUR-ICEX-C1 is falsified, the specific forced numbers are void, and the
      distribution-free one-sided inequality plus the repairs survive, exactly as pre-declared.
  - outcome: >-
      The cap is established to be per-cell and sqrt(ell)-scaled by intent.
    means: >-
      HEUR-ICEX-C2 is falsified and the slope half is void. The finding reduces to a documentation defect - the
      aggregate is still undeclared and the censoring fraction is still unreported - which is smaller, still worth
      recording, and must be reported at that reduced size rather than at the headline's.
