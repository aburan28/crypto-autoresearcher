# =============================================================================
# H-BINSTD-5c4afb -- Geometric-progression V beats random V on encode N_var
# at matched dim(V·V) (median ratio ≤ 1−δ).
# Specified from IDEA-20261002-adb7bb under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Approved DEC-20261003-b240df. ZERO RUNS in this design packet.
# Stages 0-1 authorized. No AUXIN. No Bedrock. No curve attack / exponent claim.
# =============================================================================
hypothesis:
  id: H-BINSTD-5c4afb
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261002-adb7bb
  experiment_id: EXP-BINSTD-6c199f
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-03'
  approved_at: '2026-10-03'
  authorised_by: DEC-20261003-b240df
  status: approved
  proposed_by: coordinator
  title: >-
    At matched dim(V·V) on toy binary cells, median N_var(GP)/N_var(random)
    ≤ 1−δ (δ frozen), or GP is not cheaper at matched product dimension

  statement: >-
    CLAIM (heuristic_validation / construction-family instrument; NO ATTACK;
    NO EXPONENT). Let V_GP be a geometric-progression F_2-subspace of
    dimension ℓ and V_rand a random dim-ℓ subspace with
    |dim(V_GP·V_GP) − dim(V_rand·V_rand)| ≤ 1. Encode the Weil-descended
    Semaev S_3 PDP under a shared XOR-SAT/encoder pin and read N_var.
    FORALL Stage-1 cells (n,ℓ)∈{(17,3)}, across ≥8 matched pairs,
    median N_var(GP)/N_var(rand) ≤ 1−δ with δ=0.10 frozen at Stage 0 —
    OR the band fails and is recorded as GP-not-cheaper-at-matched-product-dim
    (O-FAIL-BAND). Stage-0 freezes (17,4) catalogs and records a disclosed
    match-feasibility gap (GP dimVV≈7 vs unstructured random ≈9–10) that
    defers ℓ=4 out of Stage 1. Distinct from IDEA-20261001-febbe1
    (dim(V·V)→N_var correlation inside one family), fbee3f / 11aa69
    (usable_dimensions), 880180 (poly vs normal basis), and 878222
    (Trace→N_nl). NO break. NO n≥131 transfer.

  mechanism: >-
    OBJECT FRAME. Representation: FB {P : x(P)∈V} with V either a geometric-
    progression F_2-subspace or a random dim-ℓ subspace; Operation: encode
    descended S_3 under a shared pin and read N_var; Observable: median ratio
    of N_var across pairs matched on dim(V·V) within ±1. Trichotomy: Class I
    instrument (construction-family meter). Lossy-projection: N_var discards
    which variables are hard; null is random-vs-random (Stage 2, not
    authorized here). OFF-LIMITS: correlating dim(V·V) alone (febbe1);
    emptiness gates; solver races; basis-name swaps (880180). WHAT IS NEW:
    a frozen δ band for GP vs random at matched product dimension.

  predictions:
    - metric: median_Nvar_ratio_GP_over_random
      direction: upper_bounded
      minimum_effect: '≤ 1−δ = 0.90 at each Stage-1 (n,ℓ) cell'
    - metric: matched_pair_count
      direction: lower_bounded
      minimum_effect: '≥ 8 matched pairs per cell'
    - metric: twin_agreement
      direction: same
      minimum_effect: 'dimVV and N_var path A = path B on every measured V'

  test_boundary:
    instances:
      - 'Stage 0: freeze δ=0.10, ε=0.15, GP seeds, catalog_seed, encoder pin; twin check'
      - 'Stage 1 authorized: (n,ℓ)∈{(17,3)} matched-pair median-ratio panels'
    parameters:
      delta: 0.10
      epsilon_null: 0.15
      catalog_seed: 2026100327
      moduli:
        17: t^17+t^3+1
        19: t^19+t^5+t^2+t+1
        23: t^23+t^5+1
    implementation: >-
      Pure Python under experiments/EXP-BINSTD-6c199f/implementation/;
      command surface implementation/run.py driven by trial-plan-v1.json.
      Twin meters in product_space.py (dimVV) and encode_s3.py (N_var).
      No Magma/Sage/AUXIN/Bedrock.
    budget:
      wall_clock_seconds: 7200
      memory_gb: 2
      maximum_runs: 4

  falsification_conditions:
    - >-
      Twin meters disagree on any measured V (O-ARTIFACT; table void).
    - >-
      Editing δ after Stage-0 freeze (protocol invalid).
    - >-
      Claiming practical binary IC or an exponent move from a toy GP/random
      N_var band (KR-IC-1fcdbc).
    - >-
      Equating this meter with dim(V·V)→N_var correlation (febbe1) or
      usable_dimensions emptiness (fbee3f / 11aa69).
    - >-
      Matching only on dim(V) without the |Δ dim(V·V)| ≤ 1 control.
    - >-
      Transferring the band to n≥131 without a new contract.
    - >-
      Fewer than 8 matchable pairs after the budgeted catalog
      (O-INCONCLUSIVE; expand or stop).

  distinguishable_outcomes:
    - id: O-SUPPORT
      meaning: >-
        Twin OK; ≥8 matched pairs; median ratio ≤ 0.90 on every Stage-1
        cell. GP cheaper than matched-random at toys. No attack claim.
    - id: O-FAIL-BAND
      meaning: >-
        Twin OK; enough pairs; median ratio > 0.90 on at least one Stage-1
        cell. GP-not-cheaper-at-matched-product-dim at this scale.
    - id: O-INCONCLUSIVE
      meaning: >-
        Fewer than 8 matchable pairs on a completed cell after the budgeted
        random attempts.
    - id: O-ARTIFACT
      meaning: Twin disagreement or freeze/regression failure. No band claim kept.
    - id: O-IMPEDIMENT
      meaning: >-
        Infrastructure timeout/crash/missing Stage-0 freeze / encoder
        unavailable at Stage 0. Never negative evidence against H-BINSTD-5c4afb.

  interpretation_limits:
    - Construction-family instrument only; does not predict yield or beat rho.
    - Shared encoder pin; a different pin needs a new idea/contract.
    - Stage-2 (n∈{19,23} / ℓ=4 + random-vs-random null) not authorized under this card.
    - No attack at field degree ≥ 131. ECC2K-130 is not an instance.
    - Lower N_var can still hide harder clauses; this meter is encode-size only.

  heuristic_assumptions:
    - id: HEUR-BINSTD-adb7bb-H1
      formal_statement: >-
        FORALL (n,ℓ)∈{(17,3)} Stage-1 cells: across ≥8 matched GP/random
        pairs with |dim(V·V)_GP − dim(V·V)_rand| ≤ 1, median
        N_var(GP)/N_var(rand) ≤ 1−δ with δ=0.10 frozen at Stage 0.
      random_model_justification: >-
        Rigorous: KR-IC-73db3f argues that structured V with small products
        reduce descended variable count. Classical: if product dimension is
        the dominant driver of N_var, matching dim(V·V) should erase most of
        the GP advantage and the residual δ-band tests leftover construction
        structure; if encoder artifacts dominate instead, the band fails.
        The δ band is the pre-registered transfer hypothesis at toys — not a
        claim that GP V beats rho.
      supporting_results:
        - KR-IC-73db3f
        - KR-IC-5765d2
        - KR-IC-1fcdbc
      validation_experiment_ids:
        - EXP-BINSTD-6c199f
      falsification_condition: >-
        Median ratio > 1−δ at a completed Stage-1 cell (O-FAIL-BAND), OR twin
        failure (O-ARTIFACT), OR fewer than 8 matchable pairs
        (O-INCONCLUSIVE), OR encoder absent (O-IMPEDIMENT).

  asymptotic_claim:
    problem: >-
      Geometric-progression vs random subspace encode N_var at matched
      dim(V·V) on toy binary IC cells
    prior_best: >-
      KR-IC-73db3f (product-space V / GP construction); KR-IC-5765d2
      (XOR-SAT encode); KR-IC-1fcdbc (binary IC slower than rho)
    time_exponent: >-
      NO EXPONENT MOVED. Construction-family instrument only; a held δ band
      does not move binary ECDLP vs rho (KR-IC-1fcdbc / KR-IC-9e610d).
    memory_exponent: Negligible — store per-pair dim(V·V) and N_var.
    hidden_cofactor: Encoder constants independent of V family.
    claim_kind: heuristic_validation

  proof_search_map:
    bottleneck: >-
      Whether GP encode N_var is ≤ (1−δ) of a random subspace at matched
      dim(V·V), or whether matching product dimension erases the GP advantage.
    baseline_embedding:
      parameter_slice: >-
        n=17, ℓ=3, GP seed g=3; twin dimVV and N_var must agree before any
        median-ratio panel is read.
      reproduction_check: >-
        Independent check.py recomputes twin dimVV/N_var on Stage-0/Stage-1
        probes and re-checks the |Δ dimVV|≤1 match rule and δ polarity.
    observation_collision:
      observable: 'median N_var(GP)/N_var(rand) vs 1−δ band per (n,ℓ)'
      distinct_preimage_search: >-
        A held band could arise from (i) leftover GP construction structure
        after product-dimension matching (claim), (ii) unmatched catalog /
        too few pairs (ruled out by ≥8 → else O-INCONCLUSIVE), or (iii)
        twin-encode artifact. Separated by twin agreement and by Stage-2
        random-vs-random null (not authorized here). Distinct from febbe1
        dim(V·V)→N_var correlation.
    constructive_transforms:
      - transform: measurement_instrument
        proposed_object: >-
          Frozen δ=0.10 band + twin dimVV/N_var meters + matched-pair
          GP/random catalog under a shared encoder pin.
        predicted_gain: >-
          A decidable support/fail label for the GP construction-family
          reading at toys.
    quantifier_order: >-
      FORALL Stage-1 cells (17,3): median ratio ≤ 0.90 is PREDICTED.
      NOT CLAIMED: (17,4) under this card (match-feasibility deferred);
      n∈{19,23}; n≥131; any attack.
    method_ceiling:
      strongest_certifiable_claim: >-
        On the named Stage-1 toy cells, measured median ratio lies ≤ or >
        the frozen 1−δ band, with twin agreement and ≥8 matched pairs.
      nearby_object_control: >-
        Twin disagreement (artifact); insufficient matches (inconclusive).
        Stage-2 random-vs-random null not authorized.
    proof_obligations:
      - claim: Twin dimVV and N_var paths agree on every measured V.
        responsibility: baseline
      - claim: Pairs satisfy |Δ dim(V·V)| ≤ 1.
        responsibility: baseline
      - claim: Median ratio vs 1−δ decides O-SUPPORT vs O-FAIL-BAND.
        responsibility: success_probability
      - claim: Nothing asserted at n≥131.
        responsibility: scope

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
