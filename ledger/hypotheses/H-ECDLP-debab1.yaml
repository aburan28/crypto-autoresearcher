hypothesis:
  id: H-ECDLP-debab1
  question_id: RQ-FIND-001
  statement: >-
    The current promotion process for closures checks SCOPE but not DURABILITY,
    and has no operational definition of "replicated" for a closure that is a
    derivation rather than an experiment - which most closures are. A five-test
    gate (T1 named obstruction, T2 quantitative form, T3 nearby-object
    dissolution, T4 escape clause, T5 model and resource scope) applied to the
    committed internal-finding corpus will show near-universal passage of T1 and
    the LOWEST passage rate on T3, because a nearby-object control is not
    required by any current template. Replication for a derivation is defined
    operationally as independent RE-DERIVATION by a session given the premises
    and the claim shape but NOT the conclusion, and the count of findings that
    have received one is predicted to be small, possibly zero. Source proposal:
    IDEA-20260808-8e13ff.
  mechanism: >-
    A closure is a claim that further search in a region is not worth funding.
    That claim is falsifiable in exactly two ways - by exhibiting a mechanism the
    obstruction does not cover, and by exhibiting an object where the obstruction
    fails but the conclusion still holds - and a promotion process that forces
    neither check converts a plausible argument into durable ground truth without
    anyone having tried to break it. T2 and T3 are those two checks; T5 bounds
    how far the resulting record may travel; the re-derivation definition ensures
    somebody actually tried rather than merely not objecting. The failure mode
    being excluded is "unrefuted": nobody looked, and silence was recorded as
    agreement.
  assumptions:
    - >-
      That the closure standard and the controls-before-belief rule, as stated in
      AGENTS.md's inventor-protocol section, are the reference for T1 and T4.
      Read in full by this design session.
    - >-
      That the owning goal's completion criterion governs scope rather than
      durability. VERIFIED VERBATIM by this design session: the criterion reads
      "Committed KN-FIND entries or explicit not_warranted justifications cover
      the replicated ECDLP-relevant EV set named in
      docs/knowledge-assessment-20260724.md section 1.1, with claim boundaries no
      stronger than cited EV/DEC scope." The source proposal's characterisation
      of it is CONFIRMED faithful.
    - >-
      IMPORTANT STALENESS CORRECTION, FLAGGED. The source proposal carries a
      "PAUSE FLAG. GOAL-FIND-001 is paused." That is STALE as of 2026-09-04: this
      design session read ledger/goals/GOAL-FIND-001.yaml and found
      `status: completed` with next_action beginning "None. GOAL-FIND-001 is
      complete". The gate the proposal names therefore no longer describes the
      record, and the experiment must re-read the current status rather than
      inherit the pause flag.
    - >-
      That a resource taxonomy exists in the corpus for T5. The source proposal
      names one; this design session did not open it, so the experiment must open
      it and quote the taxonomy before T5 is scored.
    - >-
      That the corpus size is a moving target. Per this repository's own
      convention, any count over the whole corpus asserts a FLOOR, never an exact
      number; the source proposal's figure of 57 committed entries is NOT adopted
      and the experiment reports the count it measures.
  proof_search_map:
    bottleneck: >-
      The step whose removal changes what the program treats as settled is the
      promotion decision itself. A closure admitted on weak grounds redirects
      future effort away from a live lane, which is the one way process work can
      cost an exponent.
    baseline_embedding:
      parameter_slice: >-
        The boundary is the current process - a scope-boundary check plus
        independent review - which admits a closure with a correct obstruction,
        no threshold, and no control object.
      reproduction_check: >-
        The gate must contain the existing standard as a proper subset: T1 and T4
        together must be exactly the closure standard's named-obstruction and
        forward-guidance requirements, so a record passing the existing standard
        passes T1 and T4 by construction. Verified on the frozen control set.
    observation_collision:
      observable: 'A five-bit score per record, plus a re-derivation boolean.'
      distinct_preimage_search: >-
        PERFORMED. Many mathematically different closures share a five-bit
        vector, and the gate is explicitly not a measure of truth. That collision
        is why the gate may never raise a record's evidence tier and why
        retro-scoring is diagnostic only.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The nearby-object field - a named object on which the stated
          obstruction fails, together with the observation of whether the closure
          fails there too.
        predicted_gain: >-
          One line per record, and it is the cheapest available improvement to
          closure quality: it converts an untested obstruction into one that has
          been run against an object where its conclusion should not hold.
    quantifier_order: >-
      FOR ALL scored records the five bits are computed under a frozen rubric,
      and THERE EXISTS a strict ordering separating the frozen known-strong from
      the frozen known-weak control records. The prediction that breaks the
      gate's premise is that T3's pass rate is NOT the lowest of the five.
    method_ceiling:
      strongest_certifiable_claim: >-
        That, under a rubric frozen in advance, the committed corpus does or does
        not carry each of the five elements, and how many entries have received
        an independent re-derivation. It CANNOT make any closure true or false,
        cannot raise any record's evidence tier, and establishes nothing about
        any elliptic curve.
      nearby_object_control: >-
        The gate's own T3 applied to itself: three records the corpus treats as
        strong and three it treats as weak or superseded, frozen before scoring.
        If the gate does not separate them, it is not measuring closure quality.
    proof_obligations:
      - claim: The rubric is frozen and hashed before any record is scored
        responsibility: baseline
      - claim: The gate separates the frozen strong and weak control records
        responsibility: interface
      - claim: The gate returns the planted score on each redacted variant
        responsibility: interface
      - claim: T3-not-applicable branches carry a stated reason, never a checkbox
        responsibility: scope
      - claim: Retro-scoring is reported as diagnostic and demotes nothing
        responsibility: scope
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-GATE-1
      formal_statement: >-
        Closure quality, as judged by later usefulness to a generator that did
        not write the closure, is monotone in the number of gate tests passed.
      random_model_justification: >-
        None available, and none is claimed. This is standard measurement-
        validation practice imported deliberately and named as imported: an
        instrument must separate known-positive from known-negative cases before
        its readings mean anything. It is a methodological assumption, not a
        mathematical claim, and it cannot be proved.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-b8b15e
      falsification_condition: >-
        The gate fails to separate the frozen strong and weak control records.
        HEUR-GATE-1 is then unsupported and the gate is not adopted. Separately
        and independently of the heuristic, T3 alone remains a genuine falsifier:
        a closure that holds on an object where its stated obstruction fails is
        mis-explained whatever anyone judges about quality.
  structural_ingredients:
    - description: >-
        The owning goal's completion criterion, which governs scope and not
        durability, quoted verbatim: "Committed KN-FIND entries or explicit
        not_warranted justifications cover the replicated ECDLP-relevant EV set
        named in docs/knowledge-assessment-20260724.md section 1.1, with claim
        boundaries no stronger than cited EV/DEC scope."
      citation: ledger/goals/GOAL-FIND-001.yaml
      provenance: internal
      verified_by: >-
        Coordinator subagent under TASK-20260904-43152a read the
        completion_criteria block and the status and next_action fields of
        ledger/goals/GOAL-FIND-001.yaml by pattern search on 2026-09-04 and
        reproduces the criterion verbatim above. The same read established that
        the record's status is `completed`, NOT `paused` as the source proposal
        states; that staleness is recorded in assumptions rather than carried
        forward. The read was by pattern match, not a full-file read.
      role: >-
        Establishes the gap the gate addresses - the criterion is about scope,
        and says nothing about what makes a closure durable.
    - description: >-
        The closure standard - a negative result claiming a lane is dead needs a
        named obstruction, an argument, and forward guidance naming what remains
        open; a count of screened-and-rejected mechanisms is a fatigue report
        whose honest status is `unverified` - together with the
        controls-before-belief rule that any reported signal is an artifact until
        the identical measurement has been run against a null object of the same
        shape.
      citation: 'AGENTS.md, "Inventor protocol" section'
      provenance: internal
      verified_by: >-
        Coordinator subagent under TASK-20260904-43152a read the "Inventor
        protocol" section of AGENTS.md in full in this session and reproduces
        both clauses above in substance. docs/inventor-protocol.md itself was NOT
        opened, so the section-numbering attribution in the source proposal is
        not confirmed here and the experiment must open that file to fix the
        rubric text for T1 and T4.
      role: >-
        Supplies T1 and T4, which the gate contains rather than replaces, and
        supplies the transposition of the null-object requirement to T3.
  reduction_chain:
    core_problem: >-
      What distinguishes a durable closure from an unrefuted one, operationally
      and cheaply enough to be applied at promotion time.
    corollaries: []
  predictions:
    - metric: >-
        pass rate per test, T1 through T5, as a dimensionless fraction over the
        scored set, with the scored-set size reported as a measured floor
      direction: different
      minimum_effect: >-
        T1 pass rate above 0.9; T3 pass rate the LOWEST of the five and below
        0.5 overall. THE DIRECTION MATTERS MORE THAN THE NUMBERS: T3 must come
        out lowest, and if it does not, the gate's central premise is wrong and
        the record says so.
    - metric: >-
        separation between frozen known-strong and known-weak control records, as
        the minimum strong score minus the maximum weak score (integer, in gate
        tests passed)
      direction: higher
      minimum_effect: >-
        Strictly positive - every strong control outscores every weak one.
        Failure to separate means the gate is not measuring closure quality and
        its corpus-wide counts are void.
    - metric: >-
        number of committed internal findings that have received an independent
        re-derivation under the operational definition (integer count)
      direction: lower
      minimum_effect: >-
        Predicted small, possibly zero, because no current process asks for it.
        This is the measurement that converts "replicated barriers" from an
        assumption into a count, and it is reported as measured.
    - metric: >-
        redaction-ladder returned scores against planted scores (five rows, each
        an integer in {0..5} with the failing test named)
      direction: different
      minimum_effect: >-
        Exactly 4 with exactly the redacted test named, on each of the five
        variants. Any other result means the gate is not resolving the five tests
        independently.
  test_boundary:
    instances:
      - 'Every committed internal-finding entry in the corpus at run time, count reported as a measured floor.'
      - 'Three records the corpus treats as strong and three it treats as weak or superseded, frozen before scoring.'
      - 'Five redacted variants of one strong record, each missing exactly one of T1-T5.'
      - 'One closure selected for a worked blind re-derivation demonstration.'
    parameters:
      tests: 'T1 named obstruction, T2 quantitative form, T3 nearby-object dissolution, T4 escape clause, T5 model and resource scope'
      rubric_frozen_before_scoring: true
      corpus_count_reported_as: floor
      re_derivation_definition: >-
        A session that did not originate the closure is given the PREMISES and
        the CLAIM SHAPE but NOT the conclusion, and is asked to derive the
        obstruction independently, plus a bounded counterexample search at the
        stated boundary.
    implementation: >-
      Reading and scoring against a hashed rubric, plus one short blind
      re-derivation session. No compute.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 0.5
      maximum_memory_gb: 8
      maximum_runs: 3
  falsification_conditions:
    - >-
      Every committed entry passes all five tests. The gate is not discriminating
      and should be discarded rather than adopted. This is a real possible
      outcome and it would be good news.
    - >-
      The gate fails to separate the frozen strong and weak control records. It
      measures something other than closure quality and every count it produced
      is void.
    - >-
      T3 is not the lowest pass rate. The gate's central prediction is wrong.
    - >-
      The redaction ladder does not return the planted scores with the correct
      test named. The gate is not resolving the five tests independently and
      every score is void.
    - >-
      The blind re-derivation reaches a DIFFERENT obstruction for a closure the
      corpus treats as settled. That closure needs a superseding record and the
      re-derivation definition has justified itself in one instance.
  interpretation_limits:
    - >-
      This is process, not mathematics. Passing the gate makes no closure true;
      failing it makes none false. It cannot raise any record's evidence tier - a
      derivation that passes all five tests is still a derivation.
    - >-
      RETRO-SCORING IS DIAGNOSTIC ONLY AND MAY NEVER DEMOTE A COMMITTED RECORD.
      Older records were written under earlier templates that did not ask for T2
      or T3; scoring them low measures the template, not the mathematics, and the
      report must say so. The gate is prospective.
    - >-
      T3 is genuinely inapplicable to some closures - an impossibility holding
      for all objects in a category has no nearby object where it fails. Those
      are recorded as "T3 not applicable, WITH REASON", never as failures and
      never as a bare checkbox; the not-applicable branch is the obvious place
      for scores to be inflated.
    - >-
      THIS ESTABLISHES NOTHING ABOUT ELLIPTIC CURVES OR THE ECDLP. The gate
      scores prose about records. A curve-free object - any closure about any
      subject - would produce the same kind of output, so the scope statement is
      unconditional here and is declared in advance.
    - >-
      NOT TESTABLE AT REACHABLE SCALE, IN THE ONLY SENSE THAT APPLIES: whether a
      closure is CORRECT is not tested and cannot be tested by scoring. The gate
      tests only whether it carries the elements that would make it durable, and
      a record failing every test may still be right.
    - >-
      The author of the source proposal was an idea generator in a round whose
      own closures would be scored. The scoring must be done by a different
      session, and that is a requirement rather than a caveat.
    - >-
      The source proposal's pause flag on the owning goal is STALE; the goal reads
      `completed` as of 2026-09-04. Nothing here proposes a status change to it.
  status: proposed
  proposed_by: coordinator
  source_refs:
    - ledger/proposals/IDEA-20260808-8e13ff.yaml
    - ledger/goals/GOAL-FIND-001.yaml
    - ledger/questions/RQ-FIND-001.yaml
    - AGENTS.md
    - experiments/EXP-ECDLP-b8b15e/specification.yaml
