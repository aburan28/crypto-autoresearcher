        multiplication and compare to the preregistered integers.
    observation_collision:
      observable: factorial integer, regime class, and the OPEN verdict flag.
      distinct_preimage_search: >-
        Factorial by successive multiplication versus a second loop that
        multiplies in the reverse order. Regime class from the rational
        (k-1)/16 versus from comparing g with 16.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The five pairs (k, g) and the control g = 2.
        predicted_gain: A finite certificate. No exponent movement.
    quantifier_order: >-
      For every k in the set, after g = k - 1 is formed, the factorial equals
      the preregistered integer and the regime class is the preregistered
      class. The control g = 2 is classified strictly below 1.
    method_ceiling:
      strongest_certifiable_claim: >-
        The integers, the regime flags, and the label OPEN. Not a cost below
        rho and not a break of any curve.
      nearby_object_control: >-
        g = 2 and log2(q) = 16. The regime ratio is 1/8, which is strictly
