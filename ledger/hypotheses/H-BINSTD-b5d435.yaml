  title: >-
    For the five composite-degree ANSI rows, the naive trace-zero cost
    q^{2-2/g} times (k-1)! is an arithmetic object whose regime ratio
    g/log2(q) is at least 1 on three rows, so the cell stays OPEN.
  statement: >-
    Let q = 2^16 and k in {11, 13, 17, 19, 23}, g = k - 1. Then (k-1)! equals
    the preregistered integers below, g/16 is 5/8, 3/4, 1, 9/8, 11/8, and
    g/16 >= 1 exactly for k in {17, 19, 23}. The quantity
    16*(2 - 2/g) + log2((k-1)!) is recorded as a formula evaluation. It is
    not a runtime, and the certificate verdict on every deployed row is OPEN
    because the per-trial decomposition cost at arity g is not an input.
  mechanism: >-
    Gaudry's q^{2-2/g} is an asymptotic in q with g fixed. The regime ratio
    g/log2(q) = (k-1)/16 measures whether these rows sit in that regime.
    Multiplying by (k-1)! prices a trial count and still omits the cost of
    one trial. This contract recomputes the integers and the regime flag.
  assumptions: []
  proof_search_map:
