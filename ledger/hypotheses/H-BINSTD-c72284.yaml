#
# Supersedes IDEA-20260922-2a3771 content (HOLD-S of DEC-20260924-99ce20)
# under DEC-20260928-63addc na3_disposition / TASK-20260929-3907b4 R4.
# Original 2a3771 not edited. ZERO RUNS in this design packet. No AUXIN.
# No Bedrock. Claim tier: control / toy. No attack / exponent claim.
# Stages 0-1 authorized; Stage 2+ SAT census awaits /run successors.
# =============================================================================
hypothesis:
  id: H-BINSTD-c72284
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261001-b98944
  supersedes_idea: IDEA-20260922-2a3771
  experiment_id: EXP-BINSTD-372679
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-84a9b7
  status: approved
  proposed_by: coordinator
  title: >-
    On linear sigma-stable bases at n in {17,23,31}, sound orbit encodings
    cost at least the plain single-instance search (ratios >= 0.95, overhead
    additive in n); K-163 hosts no IC-useful stable V (ord_163(2)=162)

  statement: >-
    CLAIM (control / toy; HOLD-S supersession; NO ATTACK). Setting: Koblitz
    toys E/F_{2^n} with a,b in F_2, n odd prime in {17,23,31} for measurement;
    G a prime-order subgroup with r^2 not dividing #E and G meeting E(F_2)
    only in O; sigma absolute Frobenius acting as scalar lambda of order n;
    V = ker g(sigma) a sigma-stable F_2-subspace. (S1) K-163 OBJECT ABSENT.
    ord_163(2)=162 (recomputed); stable dimensions of F_{2^163} are exactly
    {0,1,162,163}. Neither numbered condition of 2a3771 has an object on
    K-163 at any IC dimension. Same at ECC2K-130 (ord_131(2)=130). (S2)
    H1-PRIME (falsifiable). On a linear sigma-stable V at the cells below,
    the per-target complete-search conflict count of (a) single-instance
    representative-and-shift and (b) gauge-fixed one-hot orbit system, each
    divided by (c) plain single-instance count on the same solver with the
    same branching priority, is at least 0.95; excess (a)-(c) and (b)-(c)
    grows with n not with (c). Original H1 alternative ~ n^{-m} (~0.0035 at
    n=17,m=2) is withdrawn. (S3) PRIOR SCOPE. KN-FIND-47da4e is a prior on
    additive-overhead FORM for orbit unions at m=2 only, inside its stated
    exclusions; never evidence about linear stable bases; n=41/43 off-limits.
    (S4) H2 REMOVED. Abscissa-test orbit-constancy is a theorem (Tr(u^2)=Tr(u));
    kept only as instrument self-check. CLAIM TIER: control / toy. NO Magma/
    Sage/AUXIN. Missing solver → O-IMPEDIMENT, never evidence.

  mechanism: >-
    OBJECT FRAME. Representation R1 (x-coordinates in a fixed F_2-basis).
    Normal basis for arms (a)(b); arm (c) in both bases. Operation set
    Sigma_op = <sigma> on (tuple, conjugate-target index) pairs of the orbit
    system. Trichotomy: partial-action; sigma moves the target. LOSSY-
    PROJECTION TEST: gauge-fixed orbit system is the quotient of
    Omega = (V^m / S_m) x Z/n by free C_n-action (t,j)->(sigma t, j+1);
    image bijects with single-instance search — a change of coordinates, so
    no per-target gain is predicted. Measurement can still find solver
    exploitation of circulant structure (ratio < 0.95); that is the only
    route to the original's gain.

  assumptions:
    - >-
      Linear stable bases V = ker g(sigma) at admissible cells of minimal_test.
      No orbit-union base (47da4e's object).
    - >-
      Cell admissibility: m(l-1) <= n with l >= 2. Measurements on UNSAT
      targets (conflict counts) plus planted SAT targets (soundness).
    - >-
      OFF-LIMITS: F2 as family; F6 as named operation set only. No new factor
      base. No run at n>=131; n=41 and 43 excluded (scope vs H-FROB-a5bf86).
    - No Magma/Sage/AUXIN/Bedrock as success path.

  proof_search_map:
    bottleneck: >-
      Whether any sound use of Frobenius orbit structure lowers per-target
      search of ONE decomposition attempt on a stable base — the only way
      2a3771's H1 gain could exist after the equivariance correction.
    baseline_embedding:
      parameter_slice: >-
        Arm (c): plain single-instance CNF-XOR with S_m lex breaking. Gauge-
        fixed orbit system at j=0 is arm (c) exactly (symbolic embedding).
      reproduction_check: >-
        Fixture B0. (i) Gauge-fixed orbit encoding at j=0 equals arm (c)
        after variable renaming. (ii) Arms (a)(b)(c) return identical
        certified solution sets (gauge-mapped) on 20 planted SAT targets per
        cell. (iii) Arm (c) UNSAT conflicts at n=17,m=2 reported against
        2^{ml}/m!; deviation beyond IDEA-20260904-3c7a91 band recorded, not
        corrected.
    observation_collision:
      observable: >-
        Ratio of per-target conflict counts (a)/(c) and (b)/(c) on identical
        UNSAT targets.
      distinct_preimage_search: >-
        Ratio < 1 could be (i) solver exploitation of circulant structure
        (live reading); (ii) basis effect (separated by (c) in both bases);
        (iii) unsound clause (separated by B0(ii) and SAT certificates).
        Literal per-instance orbit-equivalence clauses are a soundness
        tripwire and must change satisfiability on planted targets.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Gauge-fixed orbit system as change of coordinates of single-instance search.
        predicted_gain: None (that is the prediction); ratio < 0.95 would falsify it.
      - transform: observable_fiber
        proposed_object: Hold search space fixed; vary only encoding and basis.
        predicted_gain: Separates solver behaviour from counting identity.
    quantifier_order: >-
      Counting identity: FOR ALL stable V, FOR ALL m, gauge-fixed orbit search
      space has exactly |V^m / S_m| points (exact). H1-prime: FOR tested cells
      and named solvers, ratios >= 0.95 with overhead additive in n. Heuristic
      and solver-specific; one replicated sub-0.95 cell refutes it there.
    method_ceiling:
      strongest_certifiable_claim: >-
        On linear stable bases at n=17,23,31 (m=2) and n=31 (m=3), sound orbit
        encodings cost (a)/(c) and (b)/(c) times the plain search on the named
        solvers, with overhead of the stated form. Certifies nothing about
        orbit unions at m=3, n=41/43, K-163, or cost per relation.
      nearby_object_control: >-
        (i) Ordinary-curve null at same field and V (b not in F_2): arm (b)
        ratio must be at least the Koblitz ratio. (ii) Size-matched generic
        symmetry-breaking clause set: must not reproduce any sub-1 ratio that
        (a)/(b) show.
    proof_obligations:
      - claim: Counting identity of the gauge-fixed orbit system.
        responsibility: correctness
      - claim: Arms (a)(b)(c) satisfiability-equivalent per target after gauge mapping (B0).
        responsibility: correctness
      - claim: Literal per-instance orbit clauses change SAT on planted targets.
        responsibility: strictness
      - claim: ord_163(2)=162 and ord_n(2) at every toy n, recomputed.
        responsibility: correctness
      - claim: 47da4e used only within its exclusions.
        responsibility: scope
      - claim: No sentence states a speedup, exponent move, K-163 verdict, or lane closure.
        responsibility: scope
    not_applicable_reason: null

  heuristics:
    - id: H1
      statement: >-
        RELABELLING. For a linear sigma-stable V at the tested cells and a
        complete CDCL/DPLL search with S_m lex breaking, the per-target UNSAT
        conflict count of any sound orbit encoding (arms (a) and (b)) equals
        the plain count plus an overhead O(n), uniformly over tested l.
      rigorous_support: >-
        RIGOROUS: gauge-fixed orbit search space has exactly |V^m / S_m|
        points; arm (a) is a bijective reparameterisation. HEURISTIC: solver
        visits the same tree under each encoding up to closing each wrong
        shift once (form prior from KN-FIND-47da4e on orbit unions, m=2,
        unverified, form only).
      falsification_condition: >-
        Replicated median ratio (a)/(c) or (b)/(c) below 0.95 at a cell, not
        reproduced by the generic control and not explained by the basis
        ratio.
      validation_plan: >-
        SAMPLE 50 UNSAT targets per cell at the eight cells of minimal_test,
        two curves per n. COMPARE median ratios against 1 and the band;
        regress excess against n and against conflicts(c). TAIL: lowest
        per-target ratio per cell. TRANSFER: none.

  heuristic_note: >-
    The counting identity and the K-163 arithmetic are exact. H1 bears only
    on solver behaviour at toy cells. Expectation is relabelling (ratios >=
    0.95). A replicated sub-0.95 ratio the generic control does not reproduce
    is the informative surprise.

  predictions:
    - metric: stable_subspace_dimensions_at_n_163
      direction: different
      minimum_effect: >-
        EXACTLY {0, 1, 162, 163}. Any other dimension falsifies ord_163(2).
    - metric: ratio_rep_shift_over_plain
      direction: higher
      minimum_effect: >-
        Median (a)/(c) >= 0.95 at every cell; (a)-(c) not growing with (c)
        across l at fixed n. Original alternative ~ n^{-m}.
    - metric: ratio_orbit_gauge_over_plain
      direction: higher
      minimum_effect: >-
        Same band. Excess (b)-(c) predicted to grow with n, not with (c).
    - metric: basis_ratio
      direction: different
      minimum_effect: Reported with interval; no directional prediction.
    - metric: per_instance_orbit_clause_sat_changes
      direction: higher
      minimum_effect: >-
        At least one planted target per cell made UNSAT by literal original
        H1 clauses.
    - metric: null_curve_ratio
      direction: higher
      minimum_effect: At least the Koblitz cell's ratio.

  test_boundary:
    instances:
      - Koblitz toys a in {0,1}, b=1 over F_{2^n}, n in {17,23,31}
      - ordinary-curve null over the same fields
    parameters:
      arity_m: [2, 3]
      n_measured: [17, 23, 31]
      n_arithmetic_only: [131, 163]
      cells_m2:
        - {n: 17, l: [8, 9]}
        - {n: 23, l: [11, 12]}
        - {n: 31, l: [15, 16]}
      cells_m3:
        - {n: 31, l: [10, 11]}
      unsat_targets_per_cell: 50
      planted_sat_targets_per_cell: 20
    implementation: >-
      Pure-Python GF(2^n) + CNF-XOR exporter for arms (a)(b)(c); WDSat and/or
      CaDiCaL if installable. Stages 0-1 are zero-solver / setup. Stage 2+
      SAT census is out of this card's authorized stages.
    budget:
      wall_clock_seconds: 28800
      memory_gb: 8
      maximum_runs: 4

  falsification_conditions:
    - >-
      Replicated median ratio (a)/(c) or (b)/(c) < 0.95 at a cell, not
      reproduced by the generic control: H1-prime false there.
    - >-
      Overhead (b)-(c) growing proportionally with conflicts(c) rather than
      with n: multiplicative overhead; relabelling reading fails.
    - >-
      Literal per-instance orbit clauses change no planted target at any
      cell: claim (S2) contradicted.
    - >-
      Independent computation finds a stable subspace of F_{2^163} of
      dimension other than {0,1,162,163}: ord arithmetic wrong.
    - >-
      Fixture B0 failure: encodings not equivalent; run void.

  distinguishable_outcomes:
    - O-RELABEL: ratios >= 0.95; overhead additive in n; B0 pass; tripwire fires.
    - O-STRUCTURE: replicated sub-0.95 ratio not reproduced by generic control.
    - O-TRIPWIRE: literal per-instance clauses change no planted SAT → headline.
    - O-ORD: Stage-0 ord/lattice disagrees with preregistered table.
    - O-ARTIFACT: B0 fail or certificate fail; run void.
    - O-IMPEDIMENT: missing solver / crash / timeout; never evidence.

  interpretation_limits:
    - Toy tier, linear stable bases only, m in {2,3}, n in {17,23,31}.
    - Nothing transfers to orbit unions at m>=3, n=41/43, or any deployed curve.
    - KN-FIND-47da4e is a prior on overhead form only.
    - Re-scoped "what would have to be true" list is a map of conditions, not a claim any holds.
    - No K-163 or ECC2K-130 verdict.

  status_note: >-
    approved under DEC-20261002-84a9b7. IDEA-20261001-b98944 left proposed.
    IDEA-20260922-2a3771 not edited.
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
