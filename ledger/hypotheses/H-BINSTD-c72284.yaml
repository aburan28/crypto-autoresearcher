# H-BINSTD-c72284 -- HOLD-S supersession: K-163 hosts no Frobenius-stable
# subspace (ord_163(2)=162); H1 restated as falsifiable relabelling null on
# linear sigma-stable bases; H2 removed (true by construction).
# Specified from IDEA-20261001-b98944 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
