hypothesis:
  id: H-ECDLP-37dc01
  id_allocation_provenance: >-
    Minted by the top-level session with `python3 tools/allocate_id.py
    --next hypothesis --area ECDLP`, confirmed free with `--check`, and
    relayed to the coordinator in the in-session design handoff for
    RQ-ECDLP-78dbc5 on 2026-09-06. Not derived by scanning state.
  question_id: RQ-ECDLP-78dbc5
  proposal_id: IDEA-20260906-ee3543
  derived_from_idea: IDEA-20260906-ee3543
  goal_id: null
  goal_id_note: >-
    Not bound to a GOAL record. RQ-ECDLP-78dbc5 is itself unbound (its
    goal_id_note names GOAL-ECDLP-001 as the umbrella candidate); binding is
    a separate Coordinator decision and is not made by this record.
  added: '2026-09-06'
  specified_at: '2026-09-06'
  specified_by: coordinator
  proposed_by: idea-generator
  status: analyzed

  title: >-
    THE BATCH-RESELECTED FIXED-SIZE TABLE: with the advice size held at
    exactly T entries, letting the batch's own SOLVED walks feed
    Bernstein-Lange's candidate pool and re-selecting the top-T by the
    published weight S_d + 4W h_d between rounds lets a table of T/2 stored
    distinguished points reach the per-target success of the static
    Bernstein-Lange table of T entries at equal precomputation, equal walk
    budget and equal bits per entry, once the batch is of order 8T targets
    -- at the price of an early-batch penalty and working storage that are
    both measured and reported.

  statement: >-
    (A) SETTING. A prime-order group of order N; a deterministic walk f that
    is a function of the current point only (a keyed random function on
    [0, N) for the generic instrument, an r-adding walk with r = 32 and
    known scalars on a toy prime-order curve for the certified arm); a
    distinguished-point predicate of density theta = 1/W with
    W = (1/2) sqrt(N/T), i.e. a = T W^2 / N = 1/4, the Bernstein-Lange
    operating point (a = 1/2 is the second point); walks capped at 8W; a
    precomputation pool of r T DISTINCT distinguished points (r = 2, the
    paper's headline ratio, every generating walk charged to P) with the
    published weight S_d + 4 W h_d per pool entry (S_d the total length of
    walks reaching d, h_d their number); U independent uniform targets
    processed in rounds of R targets, each target running up to k = 4
    online walks from independent uniform restarts and stopping at its
    first hit.
    (B) THE MECHANISM UNDER TEST. STATIC: the table is the top-T_sel of the
    precomputation pool by the published weight and never changes. RESELECTED
    (LOWER bracket, the algorithm): every online hit on a table entry adds
    that walk's (length, +1) to the entry's weight; after each round, every
    walk of every SOLVED target contributes its terminal distinguished point
    to the pool with its now-known logarithm and its (length, +1); the table
    is then re-selected as the top-T_sel of the pool by the same published
    weight. Nothing with an unknown logarithm ever enters the table; the
    advice size is exactly T_sel at every moment; the pool is working
    storage and is charged and reported as S_peak.
    (C) THE CLAIM. At a = 1/4, r = 2, k = 4: (C1) the LOWER-bracket
    re-selected table with T_sel = T/2 reaches the static full-T table's
    steady-state per-target success within confidence intervals by
    U = 8T, so that the advice needed at fixed (P, L, epsilon) falls to
    T_resel(U)/T in [0.45, 0.6] by U = 8T (model asymptote 0.51 from
    IDEA-20260906-aed829 (B2)-(B3), unverified); (C2) the single-walk hit
    rate of the re-selected full-T table rises from the static value (about
    0.27, implied by the published 1.79) toward, and never beyond, the oracle
    top-T basin share -- C_max(1/4) = 0.39 in the model, and an EXACTLY
    computed share at N in {2^20, 2^24}; (C3) the gain over STATIC is the
    estimation loss of a cheap precomputation being paid by the batch, so it
    SHRINKS as r grows (r in {2, 4, 8}) and is within 0.03 of zero at r = 8,
    where the published rule already sits at the model ceiling (Table 4.1
    versus aed829 (B3)); (C4) the gain vanishes under relabelled batch
    evidence, is identically zero when the table is frozen, and decays
    monotonically with the admitted fraction phi of solved targets; (C5) the
    early-batch penalty of the T/2 table (first 10% of targets) is at least
    0.08 in per-target success and is the binding number for a short batch;
    (C6) at a = 1/2 the same T/2 table CANNOT reach the static full-T
    success (its ceiling C_max(1/4) = 0.39 lies below the static a = 1/2
    hit rate of about 0.42 implied by Table 4.1's 1.62), so the model
    predicts T_resel/T of about 0.6 there, not 0.5 -- a differential
    prediction that separates the basin model from a generic "more evidence
    helps" story.
    (D) WHAT IS NOT CLAIMED. No exponent moves: online 1/3, advice 1/3,
    precomputation 2/3 in N are unchanged. The mechanism is generic and
    constant-factor and sits strictly above the Corrigan-Gibbs-Kogan
    multi-instance line S T^2/M + T^2 = O(MN) (Theorem 11), because it
    stores neither unsolved walks nor relations and so forgoes the +M term
    by construction. Every conclusion is claim_tier toy and scoped to the
    tested (N, a, r, k, cap, walk, solver) grid.

  mechanism: >-
    Under the basin partition (every start point belongs to exactly one
    distinguished point's basin; a table's single-walk hit probability is
    the sum of its entries' basin masses divided by N), the value of a
    stored entry is its basin size, which Bernstein-Lange estimate from the
    precomputation pool by count plus length and which they say is
    "unreliable for a distinguished point found by very few walks" at small
    N/T. A solved target's k walks are uniform-start walks whose terminal
    DPs have known logarithms once the target is solved, so they carry
    exactly the information a precomputation walk carries -- one count and
    one length for one basin, sampled size-biased -- at zero extra
    precomputation cost. After U targets the LOWER-bracket pool is a
    Bernstein-Lange pool with effective ratio r_eff = r + U k p_s / T (p_s
    the per-target solve rate; HEUR-BLT-7), and by the paper's own remark
    the estimate becomes reliable as that ratio grows, so the re-selected
    top-T_sel converges toward the top-T_sel basins whose coverage is the
    oracle ceiling. The T/2 table's ceiling at the full-T walk length W is
    C_max(a/2) = C_max(1/8) = 0.27 in the model, which coincides with the
    static full-T rate at a = 1/4, r = 2 (about 0.27); that coincidence is
    the whole content of the "T/2 matches T" prediction and is why the
    prediction is specific to a = 1/4 (at a = 1/2 it fails by the same
    arithmetic, claim (C6)). The batch pays the estimation loss instead of
    precomputation; it cannot change the basins, so the hit rate is capped
    at the oracle share and the gain is bounded by the static table's gap to
    that share, which Table 4.1 shows is nil at N/T = 8.

  assumptions:
    - >-
      HEUR-BLT-1 and HEUR-BLT-2 of H-ECDLP-3550b8 (random-function walk;
      size-biased sampling), inherited; the closed forms C_max(a) and the
      ratio 0.51 are derivations of IDEA-20260906-aed829, unverified by any
      validator, and are cited as MODEL numbers only.
    - >-
      Bernstein-Lange's selection weight, cap, precomputation procedure (r T
      DISTINCT distinguished points, every walk charged) and published
      figures are taken from the primary text read by the coordinator
      (scratchpad bl2012.txt, 2026-09-06): Section 4 case study 1.79
      (l/T)^{1/2} after 1.24 (lT)^{1/2} at alpha = 1/2, N = 2T; Table 4.1
      at alpha in {0.707..1}. The paper's group is F_p^* with l about 2^48;
      the instrument's is a random function on [0, N) and a toy curve;
      comparability is what the fixture gate tests, not what is assumed.
    - >-
      Corrigan-Gibbs-Kogan Theorem 8 and Theorem 11 as read by the
      coordinator in scratchpad cgk.txt (lines 1119-1137 and 1423-1427,
      2026-09-06); the per-instance rewriting t^2 (S + M) = O(N) is the
      idea record's arithmetic.
    - >-
      The coordinator's scratch numbers (SCRATCH_SUMMARY.md: static 0.68-0.73
      per-target success at T = 1024, N = 2^30; re-selected T/2 0.57-0.59 in
      round 0 and 0.68-0.71 from round 4; UPPER within 0.01-0.02 of LOWER)
      are internal, unverified, two seeds, no null, no decay, no certificate,
      and inform predictions only; they are never evidence.
    - >-
      Targets are independent and uniform; the batch is non-adaptive; the
      seeded true logarithms are read only by the certificate checker.
    - >-
      Group operations are counted, never timed. A walk step is one group
      operation; restart scalar multiplications, table lookups and
      certificate checks are counted separately and excluded from L, as the
      paper excludes its randomisation and double-check multiplications.
    - >-
      ADDITIVE (2026-09-07, TASK-20260907-7204ee): the original
      `test_boundary.parameters` scoped `a` to {1/4, 1/2} only.
      EXP-ECDLP-6ac801 (see `test_boundary.boundary_amendments`) widens the
      tested `a` range to include {1/16, 1/8, 3/16}, following
      DEC-20260906-bcc097 RANK 1. This widening is a scope disclosure, not
      an added assumption about the mechanism: the closed-form C_max(a)
      model (IDEA-20260906-aed829, unverified by any validator per the
      assumptions above) is assumed to extend to these smaller a values only
      as a MODEL prediction to be checked by that experiment, never as a
      verified fact this record relies on.

  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: >-
        U = 0 (or phi = 0): the record IS the static Bernstein-Lange table at
        N/T = 2, and that slice must reproduce the published 1.79 (l/T)^{1/2}
        within 10% under the instrument (EXP-ECDLP-612fb1 gate G2).
      reproduction_check: >-
        Frozen regression fixture: scaled main-computation cost at
        (a, r) = (1/4, 2) against 1.79 and precomputation against 1.17-1.24
        (lT)^{1/2}; the a = 1/2 cells against Table 4.1's 1.62.
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms: []
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: >-
        A constant-factor reduction of advice at fixed (P, L, epsilon, U) on
        the tested grid, claim_tier toy; nothing about exponents.
      nearby_object_control: >-
        The static 2T table from the same pool (equal P, twice the advice)
        and the growth-type comparator IDEA-20260906-a3d6ae (cited, not
        designed here).
    proof_obligations: []
    not_applicable_reason: >-
      Empirical composition hypothesis; no theorem, bound or reduction is
      claimed. The only proof-shaped content (the basin-partition identity
      and the closed forms) is carried by IDEA-20260906-aed829 /
      IDEA-20260906-ac100b and by H-ECDLP-3550b8; the fields above that are
      filled are the baseline embedding and the ceiling, which are cheap
      pre-compute audits and are enforced as gates in the contract.

  rerandomization: >-
    Every online walk starts at Q_u + [c]P for an independent uniform scalar
    c (the paper's h g^y), so the k walks of a target are k independent
    uniform starts in the group and the table's hit probability is the
    basin mass of its entries regardless of the target; a hit at DP d with
    accumulated walk scalar s gives log Q_u = log d - c - s, pulled back to
    the input instance and certified by [k_u]P == Q_u. No mixing-time claim
    is made beyond Teske's empirical r-adding-walk heuristic (r >= 20
    behaves as a random walk at the level of the rho constant; KN-LIT-012);
    the generic-versus-curve transfer check in EXP-ECDLP-612fb1 and the
    two-sample test in EXP-ECDLP-869870 are the only statements made about
    the walk's randomness, and they are measurements.

  asymptotic_claim:
    problem: >-
      Batch discrete logarithm in a prime-order group with group-specific
      precomputed advice (the Bernstein-Lange / Corrigan-Gibbs-Kogan
      preprocessing model), U uniform targets against one table.
    prior_best: >-
      Bernstein-Lange selected table at N/T = 2: online 1.79 (N/T)^{1/2}
      per logarithm after 1.24 (NT)^{1/2} precomputation with T = N^{1/3}
      entries (retrieved primary text); at N/T = 8: 1.38 after 15.7 (a = 1/2,
      Table 4.1). Generic ceiling S T^2 = Omega~(eps N) (KN-LIT-013), tight;
      multi-instance S T^2/M + T^2 = Theta~(MN) (CGK Theorems 8 and 11).
    time_exponent: >-
      1/3 in N online per target at T = N^{1/3}, UNCHANGED; the constant at
      fixed advice targeted from 1.79 toward the model oracle 1.28.
      Precomputation 2/3 in N, UNCHANGED, with the cheap N/T = 2 constant
      retained.
    memory_exponent: >-
      1/3 in N advice, UNCHANGED; the constant targeted toward 0.51 of static
      at fixed (L, epsilon). Working storage (pool) up to 4T entries in the
      CAPPED arm, unbounded in the UNCAPPED arm, reported as S_peak.
    hidden_cofactor: >-
      None claimed hidden; the honest overheads are the pool's working
      storage (reported as S_peak, capped arms priced), the per-round sort
      (counted in integer operations beside group operations), the restart
      scalar multiplications O(k log N) per target (counted separately),
      and the early-batch penalty (reported, not hidden).
    claim_kind: constant_factor

  heuristic_assumptions:
    - id: HEUR-BLT-1
      formal_statement: >-
        Inherited from H-ECDLP-3550b8: the DP-truncated functional graph of
        the walk has the law of a uniformly random function on N points
        truncated at an independent Bernoulli(theta) marking, up to o(1)
        relative error in every statistic used here, for N in [2^20, 2^30]
        and W <= N^{1/3}.
      random_model_justification: As in H-ECDLP-3550b8.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-869870, EXP-ECDLP-612fb1]
      falsification_condition: As in H-ECDLP-3550b8.
    - id: HEUR-BLT-2
      formal_statement: >-
        Inherited from H-ECDLP-3550b8: a uniform-start walk lands in the
        basin of DP d with probability |B(d)|/N independently across walks.
      random_model_justification: As in H-ECDLP-3550b8.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-869870, EXP-ECDLP-612fb1]
      falsification_condition: As in H-ECDLP-3550b8.
    - id: HEUR-BLT-7
      formal_statement: >-
        BATCH-POOL EQUIVALENCE. In the LOWER bracket, after U targets with k
        walks each and per-target solve rate p_s, the pool's evidence
        (count, length sum) for every basin of size n is distributed as that
        of a Bernstein-Lange precomputation pool with ratio
        r_eff = r + U k p_s / T, up to the correlation that a target's k
        walks are admitted together, with relative error in the resulting
        top-T_sel exact coverage at most 10% for U k >= T and N >= 2^24.
      random_model_justification: >-
        Solved targets' walks are uniform-start walks conditioned on the
        target being solved; under HEUR-BLT-1 (memorylessness of the
        geometric walk length) that conditioning does not bias which basin
        the NON-hitting walks of a solved target land in except through the
        k-walk stopping rule, so the admitted walks are size-biased samples
        of the basin partition exactly as precomputation walks are.
      supporting_results:
        - >-
          Bernstein-Lange, primary text lines 469-486 (retrieved, coordinator
          2026-09-06): the ancestor count IS the hit probability and the
          count-plus-length estimate becomes reliable as the pool ratio
          grows.
        - >-
          The size-biased sampling identity of HEUR-BLT-2 (exact given the
          basin partition).
      validation_experiment_ids: [EXP-ECDLP-612fb1]
      falsification_condition: >-
        At N = 2^24 with exact basins, the regression of each pool entry's
        count on its exact basin size after U in T*{1, 2, 4, 8} targets has
        slope outside 0.8-1.2 times (r T + U k p_s)/N, or the re-selected
        table's exact coverage differs by more than 10% from that of a
        precomputation pool of ratio r_eff selected by the same rule, in
        3 or more of 5 seeds.

  structural_ingredients:
    - description: >-
        Pool-and-select table construction with the weight "total length of
        all walks reaching the point plus 4W per walk", walks capped at 8W,
        pool of N/T DISTINCT distinguished points, and the published
        constants 1.79 / 1.24 (Section 4) and Table 4.1.
      citation: >-
        Bernstein-Lange, Computing small discrete logarithms faster,
        INDOCRYPT 2012; cr.yp.to/dlog/cuberoot-20120919.pdf; eprint 2012/458
        (KN-LIT-3060 for the abstract-level constants)
      provenance: retrieved
      verified_by: >-
        coordinator full read 2026-09-06 (scratchpad bl2012.txt; lines
        458-486, 631-668, 672-741 re-read during this design)
      role: selection rule, baseline frontier, regression fixture
    - description: >-
        Reuse of the distinguished points of solved instances as a resource
        for later instances (the precedent for admitting solved walks to the
        pool); the iteration function must be independent of the targets.
      citation: >-
        Kuhn-Struik, Random walks revisited, SAC 2001, LNCS 2259; and
        Hitchcock-Montague-Carter-Dawson, IJIS 3, 2004, as quoted in the
        Bernstein-Lange interlude (primary text lines 491-522)
      provenance: retrieved
      verified_by: >-
        idea-generator WebFetch summary 2026-09-06 (hedged); the interlude
        passage read by the coordinator in bl2012.txt
      role: precedent for the pool source; target-independent walk requirement
    - description: >-
        Generic preprocessing lower bound S T^2/M + T^2 = Omega~(eps^{1/M} N M)
        for M-instance multi-DL (Theorem 8) and the matching algorithm with
        O~(S) advice, O~(T) online time and S T^2/M + T^2 = O(MN) (Theorem 11).
      citation: >-
        Corrigan-Gibbs and Kogan, The discrete-logarithm problem with
        preprocessing, EUROCRYPT 2018, eprint 2017/1113 (KN-LIT-013)
      provenance: retrieved
      verified_by: >-
        coordinator read of scratchpad cgk.txt lines 1100-1137 and 1415-1427
        on 2026-09-06 during this design
      role: frontier placement; the fixed-size table forgoes the +M term
    - description: >-
        Basin partition of the DP-truncated functional graph, the Borel
        (Poisson Galton-Watson) basin-size law and the closed forms (B1)-(B3)
        including C_max(a) and the oracle constant 1.28 at a = 1/4.
      citation: IDEA-20260906-aed829 (and the derivation record IDEA-20260906-ac100b)
      provenance: internal
      verified_by: >-
        NOT VERIFIED; derivations of this batch pending a validator; used as
        model predictions only
      role: distribution law and ceiling
    - description: >-
        Distinguished-point parallel collision search and Teske's r-adding
        walk heuristic.
      citation: KN-LIT-012 (van Oorschot-Wiener 1999; Teske 2001 noted there)
      provenance: kb
      verified_by: KN-LIT-012 record read by the coordinator 2026-09-06
      role: DP method; walk-randomness heuristic

  reduction_chain:
    core_problem: >-
      Batch discrete logarithm of U uniform targets in a prime-order group
      with a fixed-size precomputed table (advice) and a fixed per-target
      online walk budget.
    corollaries: []

  predictions:
    - metric: >-
        rho_T(U) = T_resel(U)/T at fixed (L = k W, epsilon = static full-T
        steady-state success), a = 1/4, r = 2, k = 4, LOWER bracket,
        steady-state (last two rounds before U), interpolated log-linearly
        on T_sel in {T/4, T/2, 3T/4, T}
      direction: lower
      minimum_effect: >-
        rho_T(0) = 1 exactly (round 0 is the static T_sel table); rho_T(4T)
        <= 0.75 with 95% CI excluding 1.0; rho_T(8T) in [0.45, 0.65] (model
        asymptote 0.51); rho_T(16T) <= 0.6. A value above 0.85 with CI at
        U = 8T rejects the hypothesis in its stated regime.
    - metric: >-
        steady-state per-target success of the LOWER-bracket re-selected T/2
        table minus that of the static full-T table, at U = 8T, a = 1/4
      direction: different
      minimum_effect: >-
        Not CI-separated below zero (95% CI of the difference has upper
        bound >= 0) and point estimate >= -0.03; the same difference at
        a = 1/2 is CI-separated BELOW zero (claim (C6)).
    - metric: single-walk hit rate of the re-selected full-T table versus the oracle share
      direction: higher
      minimum_effect: >-
        Rises from the static value (0.25-0.30 at N >= 2^24) to within 0.03
        of the exact top-T share by U = 16T at N in {2^20, 2^24} and never
        exceeds it (exact coverage, deterministic); at N = 2^30 plateau
        within 0.03 of the model 0.39 and never above 0.42.
    - metric: gain over STATIC (same T_sel) as a function of r in {2, 4, 8} at T_sel in {T, T/2}, U = 8T
      direction: lower
      minimum_effect: >-
        Strictly decreasing in r with the r = 2 to r = 4 step CI-separated;
        gain(r = 8) <= 0.03 absolute in per-target success.
    - metric: gain under NULL-A (relabelled batch evidence) and NULL-B (frozen table), and at phi = 0
      direction: different
      minimum_effect: >-
        NULL-B and phi = 0 equal STATIC bit-for-bit (same seeds); NULL-A
        within CI of zero at every round with |point estimate| <= 0.03.
    - metric: gain as a function of phi in {0, 0.1, 0.25, 0.5, 1} at T_sel = T/2, U = 8T
      direction: higher
      minimum_effect: >-
        Non-decreasing in phi; gain(1) minus gain(0.1) CI-separated above
        zero; time-rescaling law eps_resel(phi, U) within 0.03 of
        eps_resel(1, phi U) at every phi (a sharper, secondary prediction).
    - metric: early-batch penalty and break-even
      direction: lower
      minimum_effect: >-
        First-10%-of-batch success of the re-selected T/2 table below the
        static full-T table by at least 0.08 at U = 8T (scratch 0.57-0.59 vs
        0.70-0.72, internal); steady-state crossing U_ss (first U at which
        the T/2 table is within 0.02 of static T) in [4T, 10T]; cumulative
        break-even U* (batch-average within 0.02 of static T) in [8T, 16T]
        or reported as "> 16T" -- the cumulative number is the binding one
        for a batch that is not repeated, and the idea record's "2-4T" is
        NOT inherited as a prediction because it does not follow from its
        own scratch numbers read cumulatively.
    - metric: UPPER minus LOWER bracket steady-state success after round 4
      direction: different
      minimum_effect: Below 0.02 at every later round; above 0.05 falsifies the LOWER-bracket costing.
    - metric: CAPPED-pool gain (4T, 2T) relative to UNCAPPED at U = 8T
      direction: different
      minimum_effect: >-
        At least 80% of the UNCAPPED gain retained at 4T and 60% at 2T;
        S_peak reported for every arm in bits.
    - metric: re-selection integer operations per round relative to the round's group operations, at R = T
      direction: lower
      minimum_effect: Below 5% at every cell (reported, not a success condition).
    - metric: static 2T table (whole pool stored, equal P) single-walk hit rate
      direction: different
      minimum_effect: >-
        About 0.32 at a = 1/4 (implied by Table 4.1's N = T, alpha = 0.707
        row: 2.14), i.e. ABOVE the static T value and BELOW the re-selected
        full-T asymptote 0.39 and ABOVE the re-selected T/2 asymptote 0.27.
    - metric: rho with distinguished points and no table, same per-target budget k W with cap 8W
      direction: lower
      minimum_effect: >-
        Per-target success below 0.02 at every N (self-collision among k
        walks of length about W is of order 8a/T); the floor every table
        arm is measured above.

  test_boundary:
    instances: >-
      Generic instrument: keyed random function on [0, N) at N in
      {2^20, 2^24, 2^30}, exact basins at 2^20 and 2^24. Certified arm: one
      toy prime-order short-Weierstrass curve over F_p with p about 2^24 and
      prime group order N about 2^24, found by search over small (a, b)
      with point counting, r-adding walk with r = 32 and known scalars.
    parameters: >-
      T = N^{1/3} rounded to {64, 256, 1024} at N = {2^20, 2^24, 2^30};
      W = sqrt(a N / T) with a in {1/4, 1/2}; r in {2, 4, 8} DISTINCT-DP
      pool ratio; k = 4; cap 8W; T_sel in {T/4, T/2, 3T/4, T}; U up to 16T;
      round length R = T (sweep {T/4, T, 4T} at 2^24); phi in
      {0, 0.1, 0.25, 0.5, 1}; pool caps {uncapped, 4T, 2T}; 5 generic seeds,
      3 curve seeds.
    implementation: >-
      Counted group operations only; single implementation for all arms
      with the arm selected by configuration so that controls differ from
      the treatment in exactly the declared way; round 0 of every
      re-selected arm must equal the static arm of the same T_sel
      bit-for-bit; every curve-arm solve certified by an independent scalar
      multiplication and by equality with the seeded logarithm.
    budget:
      total_cpu_hours: 12
      maximum_runs: 48
      maximum_memory_gb: 8
      wall_clock_seconds_per_run: 3600
    out_of_scope: >-
      Cryptographic sizes; skewed or adaptive target distributions;
