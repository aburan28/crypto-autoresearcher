hypothesis:
  id: H-ICEX-b8308b
  question_id: RQ-ICEX-001
  source_idea_id: IDEA-20260815-47638d
  title: >-
    THE GO/NO-GO AVAILABLE AT ZERO COMPUTE- instantiate the charged ICEX
    comparison with every input the blocked Tier-2 lanes would supply set to
    the MOST FAVOURABLE ADMISSIBLE VALUE, apply the identical optimism to
    rho and BSGS in one code path, and see whether index calculus still
    loses; a loss under full optimism is conclusive against the measurement
    programme within the model, a win is uninformative about reality and
    only ranks which blocked lane the verdict hinges on
  statement: >-
    (A) THE SITUATION THIS ADDRESSES. RQ-ICEX-001 is explicitly blocked until
    GOAL-SDEG-001, GOAL-MONO-001 and GOAL-RELN-001 each deliver a committed
    protocol or scoped measurement decision. Three measurement lanes are
    therefore being funded whose only consumer cannot execute. There is a
    zero-risk shortcut- replace each blocked input by the best value any
    admissible measurement could return, and evaluate the comparison.
    (B) THE CLAIM, WHICH IS DELIBERATELY ONE-SIDED. Instantiating the charged
    comparison at the optimistic extreme of every ICEX input - best-case
    solving degree, maximal admissible relation supply under Bezout and
    tuple-image counting caps, zero-cost rerandomization, free preprocessing,
    ideal sparse linear algebra - and applying the SAME optimism to rho and
    BSGS in ONE code path, the charged index-calculus total still exceeds the
    matched-optimism baseline total at every cell of the frozen toy grid.
    PREDICTED RATIO IC_opt / baseline_opt >= 1 AT EVERY CELL AND EVERY
    CONVERSION CONVENTION. A single cell with ratio below 1 falsifies the
    prediction.
    (C) WHY A NEGATIVE IS CONCLUSIVE AND A POSITIVE IS NOT. Replacing a
    distribution of possible measurement outcomes by its most favourable
    extreme is lossy in ONE direction only. If index calculus loses under
    full optimism, no achievable measurement outcome can flip the verdict
    inside the model, and the Tier-2 measurement programme is dominated
    before it runs. If it wins, NOTHING about reality follows- the result is
    an upper bound, and its only content is the sensitivity ranking saying
    which blocked lane determines the verdict.
    (D) THE HONEST WEAKNESS, STATED UP FRONT RATHER THAN IN A FOOTNOTE. Some
    ICEX inputs have no defensible admissible bound - any input whose
    favourable direction is unbounded. Those are LISTED AS UNBOUNDED and are
    never assigned a plausible value, which would convert a bound into a
    guess while retaining the language of a bound. The count of unbounded
    inputs is reported prominently, and three or more unbounded inputs makes
    the exercise not decision-relevant, which is then the reported finding.
    (E) THE SECOND HONEST WEAKNESS, WHICH IS MATHEMATICAL. The inputs are not
    independent- a factor base large enough to maximise relation supply also
    maximises linear-algebra cost - so the joint optimum may be unachievable
    and the instantiation may be optimistic beyond what any real
    configuration attains. THAT MAKES A NEGATIVE STRONGER AND A POSITIVE
    WEAKER, which is the safe direction for a go/no-go and is why the record
    is designed to be decisive in exactly one direction.
    (F) UNCONDITIONALLY- nothing. No measurement, no evidence about actual
    index-calculus performance, no crypto-scale claim, and no closure of
    RQ-ICEX-001, whose decision the question reserves.
  mechanism: >-
    WHY THE TRACKED OBJECT IS THE VERDICT AND NOT THE NUMBER. The lane treats
    the ICEX verdict as a number awaiting three measurements. Treating it
    instead as a FUNCTION OF ITS INPUTS makes two things computable at zero
    cost- the extremal value of that function over the admissible input box,
    and the partial sensitivity of the verdict to each coordinate. The first
    is the go/no-go; the second is the funding order. Neither requires any
    measurement to exist.
    WHY THE MATCHED-OPTIMISM RULE IS ENFORCED MECHANICALLY RATHER THAN
    PROMISED. Optimism applied to index calculus but not to rho manufactures
    a win, and it is the dominant risk here by a wide margin. The defence is
    structural- both sides are costed by ONE function, in ONE unit, from ONE
    parameter vector, so an asymmetry cannot be introduced without editing a
    shared code path that the contract's own control detects.
    WHY THE UNIT CONVENTION IS LOAD-BEARING AND NOT BOOKKEEPING. The
    index-calculus side accumulates solver work natively in F_p FIELD
    operations while both baselines accumulate GROUP operations, and this
    program has already had a headline flipped by a total denominated in
    field operations from which group operations were subtracted. Under
    optimism the field-to-group conversion rate kappa is precisely the knob
    an optimistic instantiation is most tempted to set to 1 and forget, so
    kappa is frozen before the run, swept over three values, and printed on
    every row.
  assumptions:
    - >-
      COST UNIT- one charged operation is one GROUP OPERATION on E(F_p).
      Solver work natively counted in F_p field operations is TAGGED and
      converted at a frozen declared rate kappa in {1, 10, 100} field
      multiplications per group operation, with one reported row per kappa.
      NO TOTAL MIXES UNITS. MEMORY UNIT- stored group elements, reported
      beside time and never added to it.
    - >-
      Rho and BSGS are costed under the IDENTICAL model with the IDENTICAL
      optimism in the same code path. Non-negotiable- asymmetric optimism
      invalidates the comparison entirely and is treated as an invalidation
      rule rather than a caveat.
    - >-
      Every optimistic bound used is admissible by a stated counting or
      complexity argument, and is cited to a committed record. An input with
      no such argument is LISTED AS UNBOUNDED, never assigned a value.
    - >-
      The admissible bounds are inherited, not derived here- in particular
      the relation-count and linear-algebra floors any prime-field index
      calculus must clear are CONSUMED from the committed records that
      established them rather than recomputed.
    - >-
      Toy sizes only. Exponents fitted at toy sizes are not asymptotic and
      the go/no-go is stated at the tested sizes only.
  proof_search_map:
    bottleneck: >-
      The joint feasibility of the optimistic input box. The exact step whose
      removal changes the conclusion is 'every ICEX input simultaneously
      attains its most favourable admissible value'; if that box is empty or
      much smaller than assumed, a negative verdict strengthens and a
      positive one collapses.
    baseline_embedding:
      parameter_slice: >-
        THE LITERATURE-VALUE SLICE- every input set to the value a committed
        record reports rather than to its optimistic extreme. The harness
        must then reproduce the committed conclusions of those records.
      reproduction_check: >-
        Frozen fixture- at KN-FIND-8f2c90's own cells (p = 1009 and
        p = 4001) the literature slice must reproduce its committed standard
        charge of 2RN/B check operations, its recorded yield retentions
        gamma = 0.86 and 0.75, and the derived 2*gamma speedup interval
        [1.5, 1.7]. If the recomputation misses that committed interval the
        counting convention differs and NOTHING downstream may be read.
    observation_collision:
      observable: >-
        The optimistic exponent alone.
      distinct_preimage_search: >-
        COLLISION EXHIBITED. The same optimistic exponent is produced by
        input boxes that differ in which coordinate is doing the work - a
        best-case solving degree with a modest base, or a maximal base with a
        mediocre solve. The exponent therefore does not identify what the
        verdict rests on, which is exactly why the ONE-AT-A-TIME SENSITIVITY
        RANKING, and not the exponent, is the deliverable.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The verdict as an explicit function of the admissible input box,
          evaluated at its optimistic corner, its pessimistic corner and the
          committed-literature point, with one-at-a-time partial sensitivity
          at the optimistic corner.
        predicted_gain: >-
          Produces a go/no-go and a funding order at zero compute while three
          lanes sit deferred. NO ATTACK EXPONENT IS MOVED IN EITHER
          DIRECTION.
    quantifier_order: >-
      CLAIMED. FOR ALL cells of the frozen toy grid and FOR ALL kappa in the
      declared set, IC_opt >= baseline_opt in the declared unit. NOT CLAIMED-
      that the optimistic corner is jointly achievable (it probably is not,
      which strengthens a negative); that any real configuration attains the
      optimistic exponent; anything at medium or cryptographic scale;
      anything about inputs listed as unbounded.
    method_ceiling:
      strongest_certifiable_claim: >-
        'Within the declared cost model, at the tested toy sizes, and over
        the stated admissible input box, no achievable measurement outcome
        from the blocked lanes moves the comparison below the matched
        baseline.' It can NEVER certify anything about reality, about inputs
        with no admissible bound, or about scales larger than tested.
      nearby_object_control: >-
        THE PESSIMISTIC CORNER, which brackets the verdict from the other
        side, TOGETHER WITH the committed-literature point, which must
        reproduce committed conclusions. Reporting the optimistic corner
        alone would be indefensible and the contract refuses to emit it
        without the other two.
    proof_obligations:
      - claim: >-
          The literature slice reproduces the committed 2RN/B charge and the
          1.5-1.7x gamma interval at KN-FIND-8f2c90's cells.
        responsibility: baseline
      - claim: >-
          Rho and BSGS carry the identical optimism through one code path.
        responsibility: correctness
      - claim: >-
          Every optimistic value is admissible by a cited counting or
          complexity argument, or the input is listed as unbounded.
        responsibility: feasibility
      - claim: >-
          The verdict is stated at the tested sizes only and never as an
          asymptotic statement.
        responsibility: scope
      - claim: >-
          Every reported total carries one unit tag and its kappa.
        responsibility: interface
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-ICEX-OPT-1
      formal_statement: >-
        The most favourable admissible value of each ICEX input is
        SIMULTANEOUSLY achievable, so the optimistic instantiation
        upper-bounds any achievable index-calculus cost within the model.
      random_model_justification: >-
        The rigorous ingredient is that each INDIVIDUAL bound is admissible
        by a counting or complexity argument. THE GAP, WHICH IS REAL AND IS
        NOT SMALL- the inputs are antagonistically coupled. A factor base
        large enough to maximise relation supply also maximises
        linear-algebra cost; a solving degree small enough to be best-case
        constrains the base geometry that produced it. The joint optimum may
        therefore be unachievable and the instantiation optimistic beyond any
        real configuration. THE DIRECTION OF THE GAP IS THE SAFE ONE- it
        makes a NEGATIVE verdict stronger and a POSITIVE verdict weaker,
        which is why this record is decisive in exactly one direction.
      supporting_results:
        - ref: KN-FIND-8f2c90
          provenance: internal
          claim: >-
            The committed m = 2 relation-collection charge 2RN/B in check
            operations and the measured yield retentions gamma = 0.86 at
            p = 1009 and 0.75 at p = 4001 with the derived 2*gamma speedup
            interval 1.5-1.7, used as the frozen baseline-reproduction
            fixture.
          verified_by: >-
            coordinator, TASK-20260904-e87737 (finding read in full,
            43 lines)
        - ref: RQ-ICEX-001
          provenance: internal
          claim: >-
            That the lane is blocked pending GOAL-SDEG-001, GOAL-MONO-001 and
            GOAL-RELN-001, that full charging is mandatory, and that the
            decision target is a charged exponent whose interval excludes
            1/2.
          verified_by: >-
            coordinator, TASK-20260904-e87737 (question record read in full)
      validation_experiment_ids:
        - EXP-ICEX-38a807
      falsification_condition: >-
        Exhibiting an input combination that is jointly infeasible yet was
        instantiated as simultaneously optimal. The contract's pairwise
        coupling check is the instrument for this, and any pair it flags must
        be reported with the verdict rather than after it.
  structural_ingredients:
    - description: >-
        The lane's decision target, its blocking constraints, and its full
        charging requirement.
      citation: RQ-ICEX-001
      provenance: internal
      verified_by: coordinator, TASK-20260904-e87737
      role: the comparison being instantiated and the reason it is blocked
    - description: >-
        The committed m = 2 relation-collection charge and its measured yield
        retentions, used as the frozen baseline-reproduction fixture.
      citation: KN-FIND-8f2c90
      provenance: internal
      verified_by: coordinator, TASK-20260904-e87737
      role: blocking baseline reproduction
    - description: >-
        The correct multi-target comparator and the unit discipline fixed by
        the sibling hypothesis in this batch, so that the two records cannot
        disagree about the baseline.
      citation: H-ICEX-b2c8cf
      provenance: internal
      verified_by: coordinator, TASK-20260904-e87737
      role: comparator and unit convention, shared across the batch
  reduction_chain:
    core_problem: >-
      Bounding the ICEX verdict over the admissible input box at toy sizes,
      inside a declared cost model, with matched optimism on both sides.
    corollaries: []
  predictions:
    - metric: >-
        P1- literature-value sanity instantiation against KN-FIND-8f2c90's
        committed charge, in CHECK OPERATIONS as that finding denominates
        them
      direction: different
      minimum_effect: >-
        FORCED- the standard arm must reproduce 2RN/B and the BKK arm
        RN/(gamma*B), giving a speedup inside [1.5, 1.7] at p = 1009 and
        p = 4001. Outside that interval the counting convention differs, the
        harness is wrong, and NO verdict from it is admissible.
    - metric: >-
        P2- ratio of the optimistic charged index-calculus total to the
        matched-optimism baseline total, dimensionless, both numerator and
        denominator in GROUP OPERATIONS with their kappa printed
      direction: higher
      minimum_effect: >-
        PRE-REGISTERED AT OR ABOVE 1 AT EVERY CELL AND EVERY KAPPA. A single
        cell with ratio below 1 falsifies the prediction, makes the verdict
        input-sensitive, and leaves every Tier-2 measurement obligation
        exactly where it is.
    - metric: >-
        P3- one-at-a-time sensitivity ranking- the change in log2 of the
        ratio when each input alone is moved from its pessimistic to its
        optimistic bound
      direction: different
      minimum_effect: >-
        The deliverable, reported as an ORDERED LIST with the movement in
        log2 units beside each input. Even under a negative verdict this
        ranking is the campaign's most actionable output, because it names
        which blocked lane to fund first.
    - metric: >-
        P4- count and identity of ICEX inputs with no admissible bound
      direction: different
      minimum_effect: >-
        REPORTED PROMINENTLY, not in a footnote. PRE-REGISTERED DECISION
        RULE- three or more unbounded inputs makes the exercise not
        decision-relevant, and that is the reported finding rather than a
        verdict computed with guesses in their place.
    - metric: >-
        P5- curve-free null- the identical optimistic instantiation on a
        generic cyclic group with a synthetic decomposition oracle at matched
        parameters
      direction: different
      minimum_effect: >-
        PREDICTED IDENTICAL VERDICT. The optimistic instantiation reads no
        curve- it reads bounds. If the curve-free arm returns the same
        verdict, as predicted, the go/no-go is a statement about the COST
        MODEL and may not be quoted as a statement about elliptic curves or
        the ECDLP.
  test_boundary:
    instances:
      - toy prime-field short-Weierstrass curves of prime order, at the lane's frozen toy fixtures including p = 1009 and p = 4001
      - >-
        CURVE-FREE ARM- a generic cyclic group with a synthetic decomposition
        oracle whose supply law is matched to the curve arm's optimistic
        bound
    parameters:
      p: '1009, 4001 and the lane''s frozen toy ladder'
      m: '2, 3, 4'
      beta: 'swept, with the optimistic corner solving for the best admissible base size'
      kappa: '1, 10, 100 field multiplications per group operation'
      corner: 'optimistic, pessimistic, committed-literature'
    implementation: >-
      A single costing function evaluated symbolically and over a small
      numeric grid, with rho, BSGS and index calculus costed by the SAME
      function from the SAME parameter vector. No curve arithmetic beyond the
      fixture reproduction, no solver, no Macaulay matrix.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 0.5
      maximum_memory_gb: 8
      maximum_runs: 8
  falsification_conditions:
    - >-
      F1. The literature instantiation does not reproduce the committed
      charge and gamma interval. HARNESS WRONG; halt; no verdict is
      admissible in either direction.
    - >-
      F2. The optimistic ratio falls below 1 at any cell at any kappa. The
      prediction of statement (B) is falsified, the verdict is
      input-sensitive, and the Tier-2 programme is genuinely necessary - the
      sensitivity ranking then says which lane to fund first.
    - >-
      F3. Three or more inputs have no admissible bound. The exercise is not
      decision-relevant and says so, rather than proceeding with guesses.
    - >-
      F4. The pairwise coupling check flags an antagonistic pair that was
      instantiated as simultaneously optimal, in a way large enough to change
      the verdict. HEUR-ICEX-OPT-1 is violated and a POSITIVE verdict, if
      any, is withdrawn; a negative verdict survives, since the coupling can
      only make the optimistic corner more optimistic.
    - >-
      F5. The curve-free arm returns a DIFFERENT verdict from the curve arm.
      Then some curve-specific quantity entered the optimistic instantiation
      undeclared; halt and reconcile before any citation.
    - >-
      F6. Everything holds and the ratio is at or above 1 everywhere. Then,
      WITHIN THE STATED BOUNDS AND COST MODEL AND AT THE TESTED SIZES, no
      achievable measurement outcome flips the ICEX verdict, and the
      Coordinator has the evidence to reprioritise the three deferred lanes.
      This retires nothing universally and closes no question.
  interpretation_limits:
    - >-
      A NEGATIVE RETIRES THE MEASUREMENT PROGRAMME ONLY WITHIN THE STATED
      BOUNDS AND COST MODEL AND AT THE TESTED SIZES, never universally, and
      never as a statement about ECDLP hardness.
    - >-
      A POSITIVE ESTABLISHES NOTHING ABOUT REALITY. It is an upper bound and
      says only that measurement is warranted; the record is decisive in
      exactly one direction and says so everywhere it is quoted.
    - >-
      NO MEASUREMENT, NO EVIDENCE ABOUT ACTUAL INDEX-CALCULUS PERFORMANCE, NO
      CRYPTO-SCALE CLAIM. RQ-ICEX-001's decision remains RQ-ICEX-001's.
    - >-
      TOY-SIZE ARTIFACTS. Exponents fitted at toy sizes are not asymptotic;
      the go/no-go is stated at the tested sizes only. Whether the lane's
      planned ladder could resolve such an exponent at all is a SEPARATE
      question, answered by the sibling contract EXP-ICEX-ff3e13, and this
      record does not assume it can.
    - >-
      EVERY INPUT WITHOUT AN ADMISSIBLE BOUND REDUCES CONCLUSIVENESS
      PROPORTIONALLY, and the count is reported up front.
    - >-
      IF THE CURVE-FREE ARM AGREES, as predicted, the finding is about the
      cost model and not about elliptic curves.
