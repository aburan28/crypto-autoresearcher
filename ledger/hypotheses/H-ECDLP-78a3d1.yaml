# H-ECDLP-78a3d1
# Negation invariance of x and of x |-> x+1 on one F_17 curve.
# No cost comparison. Approval: DEC-20261001-41c4ea.
hypothesis:
  id: H-ECDLP-78a3d1
  question_id: RQ-ECDLP-002
  source_idea: IDEA-20260918-7a11c2
  experiment_id: EXP-ECDLP-5a293e
  specified_at: '2026-10-01'
  status: approved
  proposed_by: idea-generator
  approved_by_decision: DEC-20261001-41c4ea
  title: >-
    On y^2 = x^3 + x + 1 over F_17, the x-coordinate and the map x |-> x+1
    agree on P and -P, while y disagrees on 16 affine points.
  statement: >-
    The curve has 17 affine points. For every such point (x, y), the point
    (x, -y) is also on the curve and has the same x-coordinate. The same
    holds after sending x to x+1. Exactly 16 affine points have y different
    from -y.
  mechanism: >-
    Negation on a short Weierstrass model preserves x and sends y to -y.
    Adding 1 is a PGL2 map of the line, so it preserves that equality.
    Using y as a coordinate does not. This is a representation control,
    not a decomposition-cost measurement.
  assumptions: []
  proof_search_map:
    bottleneck: Listing the affine points and comparing coordinates of each point with its negation.
    baseline_embedding:
      parameter_slice: >-
        The curve already used in EXP-ECDLP-efafc0. A design-time count
        found 17 affine points and 16 with y different from -y. It is not
        a run.
      reproduction_check: >-
        One loop scans x then searches y. The other scans y then searches x.
        The point sets must agree.
    observation_collision:
      observable: x-mismatches, shifted-x mismatches, and y-mismatches.
      distinct_preimage_search: >-
        The y-coordinate is the control. It must mismatch on 16 points.
        Reporting zero y-mismatches invalidates the comparison.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The map x |-> x+1 on the x-line.
        predicted_gain: Invariance under negation. No attack cost.
    quantifier_order: >-
      For every affine point, x and x+1 agree on the point and its
      negation. The number of points with y different from -y is 16.
    method_ceiling:
      strongest_certifiable_claim: >-
        This one curve and these two maps. Not a factor-base saving.
      nearby_object_control: >-
        The y-coordinate. It is not invariant under negation except at
        y = 0.
    proof_obligations:
      - claim: There are 17 affine points.
        responsibility: size
      - claim: x and x+1 match on every negation pair.
        responsibility: correctness
      - claim: y mismatches on 16 points.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: >-
        On y^2 = cubic(x), negation is (x, y) to (x, -y). No external paper
        was opened.
      citation: ledger/proposals/IDEA-20260918-7a11c2.yaml
      provenance: internal
      verified_by: coordinator session 2026-10-01 (claim and minimal_test read; F_17 points counted in Python)
      role: the invariance being checked
  reduction_chain:
    core_problem: Check negation invariance of two x-line maps.
    corollaries: []
  predictions:
    - metric: affine_point_count
      direction: different
      minimum_effect: 17.
    - metric: y_mismatch_count
      direction: different
      minimum_effect: 16.
  test_boundary:
    instances: [one curve over F_17]
    parameters:
      p: 17
      curve: y^2 = x^3 + x + 1
    implementation: Two point listings that do not import each other.
    budget:
      maximum_runs: 2
      maximum_memory_gb: 1
      maximum_workers: 1
  falsification_conditions:
    - Both listings agree and some point has x different from the x of its negation, or the y-mismatch count is not 16.
  interpretation_limits:
    - No decomposition cost is measured.
    - x |-> x+1 is one PGL2 map, not a census of conjugates.
  dominated_by: No attack is claimed.
  sota_delta:
