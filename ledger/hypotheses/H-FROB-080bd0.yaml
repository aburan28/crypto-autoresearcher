        shift of coordinates in a normal basis, read 2026-10-01. The F_2^5
        table below was computed in this design session. That computation
        is not a run.
      reproduction_check: >-
        One route builds the basis by successive squaring and solves for
        coordinates. The other repeats that arithmetic in a separate
        module. Both must report the same orbit, rank, and three counts.
    observation_collision:
      observable: Match counts for the two rotations, and the polynomial-basis failure count.
      distinct_preimage_search: >-
        The opposite rotation is not the square map. Reporting that it
        matches all 32 elements is false. Accepting it invalidates the run.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: One irreducible modulus and one normal-basis seed.
        predicted_gain: Three integer counts. No attack cost.
    quantifier_order: >-
      For every one of the 32 field elements, the normal-basis coordinates
      of the square are the stated rotation, and the polynomial-basis bit
      rotation fails on a positive number of elements.
    method_ceiling:
      strongest_certifiable_claim: >-
        The rotation identity on this F_2^5 basis. Not an m! yield and not
        a budget on ECC2K-130.
      nearby_object_control: >-
        The polynomial basis of the same field. The same rotation fails
        there. Reporting zero failures invalidates the run.
    proof_obligations:
      - claim: The orbit is 3, 5, 17, 12, 26 and has rank 5.
        responsibility: correctness
      - claim: The square rotation matches 32 elements and the opposite rotation matches 2.
