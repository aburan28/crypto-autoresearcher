# H-FROB-080bd0
# Normal-basis squaring rotation on F_2^5 for IDEA-20260926-197ecf.
# Not an m! count and not an n=17 solve. Approval: DEC-20261001-3dfd17.
hypothesis:
  id: H-FROB-080bd0
  question_id: RQ-FROB-7d8dd4
  source_idea: IDEA-20260926-197ecf
  experiment_id: EXP-FROB-6b2a00
  specified_at: '2026-10-01'
  status: approved
  proposed_by: idea-generator
  approved_by_decision: DEC-20261001-3dfd17
  title: >-
    Squaring on F_2^5 is the coordinate rotation (c4, c0, c1, c2, c3) in the
    normal basis generated by 3, and the same rotation fails on the
    polynomial basis.
  statement: >-
    Let the field be F_2[x]/(x^5+x^2+1), with integer 37 for that modulus.
    The element 3 has successive squares 3, 5, 17, 12, 26. Those five
    elements are linearly independent. In that basis order, the coordinates
    (c0, c1, c2, c3, c4) of every field element square to (c4, c0, c1, c2,
    c3). That match count is 32. The opposite rotation (c1, c2, c3, c4, c0)
    matches 2 elements. The same rotation on polynomial-basis bits fails
    for 30 elements, including the integer 1.
  mechanism: >-
    On a Koblitz curve, x(tau P) = x(P)^2, and squaring is F_2-linear. In a
    normal basis it is a cyclic shift of coordinates, so a tau-Horner link
    would rotate a node block rather than raise Boolean degree. This
    contract checks that shift on one toy field. It does not count
    relations and it does not solve a summation polynomial.
  assumptions: []
  proof_search_map:
    bottleneck: >-
      Whether squaring is a coordinate rotation in one explicit normal
      basis, and whether that rotation is special to the basis.
    baseline_embedding:
      parameter_slice: >-
