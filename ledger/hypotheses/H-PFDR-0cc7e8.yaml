hypothesis:
  id: H-PFDR-0cc7e8
  id_allocation_provenance: >-
    Drawn by the top-level session with tools/allocate_id.py and confirmed free
    with --check; reserved in TASK-20260928-102217 constraints. This
    Coordinator holds no shell and minted no identifier.
  question_id: RQ-PFDR-ae2fba
  goal_id: null
  source_proposal: IDEA-20260928-ce3ab0
  source_proposal_scope: Stage 0 (section (D) numerical content) only
  designed_under_task: TASK-20260928-102217
  status: specified
  status_decision: DEC-20260928-b3afc2
  proposed_by: idea-generator
  specified_by: coordinator
  recorded_at: '2026-09-29'
  novelty_status: adaptation
  novelty_note: >-
    The generator's own label. The GGM collision-counting technique is Shoup's
    (KN-LIT-011, KN-TECH-005) and the multi-instance form is Kuhn-Struik/Yun
    (KR-RHO-46c2c6; Yun eprint 2014/637 abstract retrieved). What is adapted is
    its application to r index-calculus relations and the match with this
    engine's measured odd-m exponents.

  statement: >-
    On the committed mitm rows of the crypto_autoresearcher.index_calculus
    engine (results/sweep-minfill-20260926, sweep-arity-minfill-20260926,
    sweep-arity67-20260928, with the min_index twins sweep-mitm-20260926 and
    sweep-arity-20260926 used only as a consistency check), prime-order
    ordinary curves E/F_p with log2 p in 12..32, default |F| per arity, the
    ratio S_3/((1/2)*sqrt(r*N)) -- S_3 the row's s3_solves (table included), r
    its logged relations, N its group order -- is (i) at least 1.0 on every
    row, (ii) flat in N at odd m = 3, 5, 7 (fitted log2-slope within
    [-0.03, +0.03]), and (iii) rising as N^{1/(2m)} at even m = 4, 6 (slope
    0.125 +- 0.03 and 0.083 +- 0.03), with (iv) overlapping bootstrap intervals
    for the random, small_x and subgroup bases at m = 3 on matched |F|. That
    is: the measured odd-m mitm exponents (m+1)/(2m) are the generic x-key
    collision floor for r relations, and the even-m engine sits a factor
    N^{1/(2m)} above it.

  mechanism: >-
    Restated from IDEA-20260928-ce3ab0 claim (A), a derivation-tier argument in
    the generic group model that no reviewer has checked. G has prime order N;
    P, Q and the base elements F_1..F_B are independent encodings with uniform
    unknown logs (the base is sampled by an x-predicate, not generated from P
    and Q). Each pair of distinct computed linear forms collides under the
    x-key (equal or negated) with probability <= 2/N, so X computed encodings
    give at most X^2/N expected collisions. Each independent relation needs its
    own collision. One S_3 unit yields two encodings (README section "How cost
    is counted": F+S and F-S from one inversion). Therefore E[r] <= 4 S^2 / N,
    i.e. S >= (1/2)*sqrt(r*N). With r ~ c_m*|F| and |F| = N^beta the floor is
    N^{(1+beta)/2}; at beta = 1/m it is (m+1)/(2m), which equals the README
    model max(h, m-h+1)/m exactly at odd m and sits N^{1/(2m)} below it at even
    m. The engine uses S_3 only to add two points (README section 3), so every
    relation it finds is an x-key collision between two encodings it computed,
    which is why the floor should bind it.

  assumptions:
    - 'Verbatim from IDEA-20260928-ce3ab0: The engine uses S_3 only to add two points (README §3 says so explicitly), so every relation it finds is an x-key collision between two encodings it computed.'
    - 'Verbatim: Base points are sampled by x-coordinate, so their logs are independent unknowns (multi-instance access), not linear forms in log Q.'
    - "Verbatim: r (independent relations needed before k is fixed) is read from each row's logged relation count; 0.92|F| at m=3 is the README value."
    - 'Verbatim: Toy scale only (12..32 bits). No claim about any deployed curve.'
    - >-
      Added at specification: the committed rows are read as committed. Their
      provenance is README sections 3-5 (every logarithm verified against
      kP = Q there). No row is re-run by this hypothesis's test; exact
      re-execution of every committed row is EXP-PFDR-1b78f7's regression
      gate, not a precondition of this re-read.

  proof_search_map:
    bottleneck: relations obtained per computed encoding (the collision rate), not the S_3 solve itself.
    baseline_embedding:
      parameter_slice: >-
        Verbatim from IDEA-20260928-ce3ab0: r = 1 gives S >= (1/2)*sqrt(N),
        Pollard rho's birthday floor (KR-RHO-13bf67, x-key, negation folded);
        m odd with beta = 1/m reproduces the README model's exponent exactly;
        in the preprocessing model, S = N^{1/m} with T = N^{(h-1)/m} is the
        Bernstein-Lange point (KR-RHO-ea34b8) that dominates mitm at the same T.
      reproduction_check: >-
        Symbolic: (m+1)/(2m) = max(h, m-h+1)/m at h = (m+1)/2 for m = 3, 5, 7.
        Numeric: the EXP-PFDR-7c8bf2 re-analysis of the committed JSONL rows,
        frozen as a regression (its per-row output file is the fixture).
    observation_collision:
      observable: the ratio S_3 / ((1/2)*sqrt(r*N)) per run
      distinct_preimage_search: >-
        Verbatim: Two engines can share the ratio and differ in memory or
        advice: the h-table vs a harvest-all engine at the same S, and mitm vs
        BL at the same online T. So the ratio certifies time only, and memory
        and advice are reported separately. Two bases can share the ratio and
        differ in coverage: random vs small_x at matched |F| (README: within
        7%). The ratio is blind to yield redistribution, consistent with
        KN-FIND-007.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: The birthday collision count, lifted from one relation (rho, KR-RHO-13bf67) to r relations (index calculus); the multi-instance form behind KR-RHO-46c2c6.
        predicted_gain: >-
          None as an attack. As a screen, every structured proposal must exhibit
          collision excess kappa ~ N^delta (single-instance model) or beat
          S*T^2 = N (preprocessing model); the exponent gain is exactly delta/2.
    quantifier_order: >-
      Verbatim (i) from IDEA-20260928-ce3ab0: FOR ALL generic engines A (access =
      group operations plus x-key equality tests; base points are independent
      uniform unknowns), FOR ALL m, beta, h and FOR ALL N: E[#independent
      relations after S S_3-units] <= 4S^2/N * (1+o(1)). THEREFORE there EXISTS
      NO generic A with total S_3 < (1/2)*sqrt(r*N)*(1-o(1)). The constant
      depends on two declared conventions: 2 points per x-key, and 2 encodings
      per S_3-unit. Clause (ii) (preprocessing, CGK) is not tested here.
    method_ceiling:
      strongest_certifiable_claim: >-
        A GGM derivation plus a toy-scale check. The check shows the implemented
        engine at a constant multiple of the floor at odd m and at N^{1/(2m)}
        times the floor at even m. It says nothing about non-generic engines.
        EXP-PFDR-7c8bf2 checks the numerics only; it does not review the
        derivation.
      nearby_object_control: >-
        Verbatim: Gaudry over F_{q^n} (KR-IC-46d822), where the floor is beaten
        because relations come from polynomial-system solving. A structured base
        whose measured ratio falls below 1 is a detected non-generic effect or
        an accounting error. Either outcome is a headline. In-data controls:
        the rho walk as the r = 1 slice (walk/(0.886*sqrt(N))), and the random
        base as the generic null at m = 3.
    proof_obligations:
      - claim: pairwise collision probability of distinct adaptive linear forms is <= 2/N under the x-key
        responsibility: correctness
      - claim: each independent relation consumes a distinct collision
        responsibility: size
      - claim: one S_3-unit = two encodings in the engine's charging
        responsibility: interface
      - claim: odd-m mitm exponent equals the floor exponent
        responsibility: baseline
      - claim: the lemma does not apply to Groebner or structured-predicate engines
        responsibility: scope
    proof_obligations_note: >-
      None of these is discharged by EXP-PFDR-7c8bf2; it checks the numerical
      consequence (D) only. The BL Pareto obligation of the source record is
      clause (C2) and is out of this hypothesis's scope.
    not_applicable_reason: null

  rerandomization: null
  asymptotic_claim:
