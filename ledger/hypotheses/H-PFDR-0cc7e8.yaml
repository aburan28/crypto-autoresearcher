  heuristic_assumptions:
    - id: HEUR-0cc7e8-H1
      source_label: IDEA-20260928-ce3ab0 H1
      formal_statement: >-
        Verbatim: For the mitm engine on prime-order E/F_p with an x-defined
        base, the x-key coincidences among computed encodings are distributed
        as for independent uniform group elements: the count is Poisson with
        mean X^2/N, up to the engine's deterministic ordering constant.
      random_model_justification: >-
        Verbatim rigorous_support: Proven: in the GGM, distinct adaptive linear
        forms in independent uniform logs collide with probability <= 1/N per
        pair (Schwartz-Zippel on degree 1), doubled by the x-key. Imitated:
        birthday statistics for uniform samples (Poisson collision counts).
      supporting_results: []
      supporting_results_note: >-
        Left empty on purpose: the GGM statement is a derivation in the source
        record (unreviewed) and Schwartz-Zippel is recalled; neither is a
        retrieved or kb citation, so neither discharges this entry.
      validation_experiment_ids: [EXP-PFDR-7c8bf2, EXP-PFDR-1b78f7]
      validation_note: >-
        EXP-PFDR-7c8bf2 performs the generator's plan descriptively on committed
        rows (the committed rows log only relations at a data-dependent stop, so
        the Poisson comparison there is confounded by the stopping rule and is
        not decision-bearing). EXP-PFDR-1b78f7 validates the same heuristic
        cleanly on its random-base arms, per class, at a fixed attempt budget.
      falsification_condition: >-
        Verbatim from the source falsification list: Any committed row with
        ratio < 0.9 means the lemma, its constants, or the charging convention
        is wrong. For H1 specifically: EXP-PFDR-1b78f7 random-arm class counts
        rejected against Poisson by KS at 1%.
    - id: HEUR-0cc7e8-H2
      source_label: IDEA-20260928-ce3ab0 H2
      formal_statement: 'Verbatim: The relation count needed to fix k is r = c_m*|F|*(1+o(1)), with c_m stable across 20..32 bits at each m.'
      random_model_justification: 'Verbatim rigorous_support: Counting bound: r >= rank needed. Imitated: the random sparse-matrix rank heuristic (812554 HA-1; f89eaf H1).'
      supporting_results: []
      validation_experiment_ids: [EXP-PFDR-7c8bf2]
      falsification_condition: >-
        Verbatim validation plan read as a test: read r/|F| from the rows per
        (m, bits); require a slope in log N within +-0.03. A slope outside that
        window on 20..32 bits refutes H2 at the tested scale.

