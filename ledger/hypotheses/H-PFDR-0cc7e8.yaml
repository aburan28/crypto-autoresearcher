    prior_best: Pollard rho 0.886*sqrt(N) group operations (KR-RHO-13bf67); Kuhn-Struik sqrt(2LN) for L logs (KR-RHO-46c2c6)
    time_exponent: 'floor N^{(1+beta)/2} S_3-units; (m+1)/(2m) at beta = 1/m'
    memory_exponent: not claimed (the floor constrains time only)
    hidden_cofactor: >-
