      - claim: The committed module passes the CTRL-ZN gate G1, where H1's random model holds by construction, before any binary cell is read; under the model G1 fails with probability 0.00575 (audit sheet g1_calibration).
        responsibility: baseline
      - claim: The determined fraction, the usable probability per decomposition, the attempts per target, the relation-phase yield and target coverage are measured per cell and compared two-sidedly with the determined law, the multi-decomposition attempts law and the Poisson count law.
        responsibility: success_probability
      - claim: The no-reuse null lies outside every amortisation band of its cell on CTRL-ZN and BIN-ORD-19.
        responsibility: interface
      - claim: Every recovered logarithm and relation carries an independently re-verified certificate; shared and per-target units are always reported as separate columns, and the only figures combining them are the declared per_target_cost(L) and FR_by_L, reported beside those columns (the IR-5 exception; IR-5 never fires on them).
        responsibility: strictness
      - claim: Advice bytes, LA matrix and Krylov bytes, and the comparator's table memory stand beside every time figure, including every window upper end (C6).
