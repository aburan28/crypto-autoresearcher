  heuristic_assumptions:
    - id: H1
      name: uniform touching (restated at the validation arity)
      formal_statement: >-
        Relation legs and fresh-target decomposition legs at arity m over a
        base of B columns behave as independent uniform column draws, and the
        number of decompositions an attempt returns is Poisson(mu), each
        usable independently. Consequences at the validation arity m = 2 with
        R = B relations, which the contract tests: (a) the touched fraction is
        1 - exp(-2) = 0.8647 (diagnostic); (b) the relation graph is a random
        multigraph of mean degree 2 whose determined columns are those of
        components containing an unbalanced cycle or a coefficient-2 loop, so
        the determined fraction is the giant-component fraction delta_inf =
        0.7968, the root of y = 1 - exp(-2y), with graph-level standard
        deviation about 0.403 / sqrt(B); (c) a fresh decomposition is usable
        (both legs determined) with probability delta^2 given the determined
        set (0.6349 at delta_inf); (d) attempts per target are geometric with
        p = 1 - exp(-mu u), mean 2.1276 at mu = 1 and 50.903 at mu = 0.0312498
        (multi-decomposition acceptance); (e) an attempt returns at least one
        decomposition with probability 1 - exp(-mu) (target coverage, 0.6321
        at mu = 1); (f) relation attempts to collect B relations are a sum of
        B geometric draws with success probability 1 - exp(-mu), so rho_rel =
        relation attempts / (B A(mu)) has mean 1 and relative sd
        sqrt(exp(-mu)/B); (g) consequently the per-target cost does not depend
        on L, KR and FR have mean 1 with the log-space sd of the audit sheet
        D-11, and the knee is K = B A(mu) / a(mu). At the deployed arities the
        column uses the version-1 constants (A2, A3), conservative against (c)
        and (d) by at most about 0.05 bit. Uniformly in B for the tested
        cells; at n = 131 only the form of the law transfers.
      random_model_justification: >-
        MODEL: the relation set as a random signed multigraph on the B
        columns (occupancy for the touched set; Erdos-Renyi for components)
        and Poisson thinning for usable decompositions. RIGOROUS BOUND:
        KN-FIND-007's double count fixes the mean decomposition yield
        C(B + m - 1, m)/N exactly for every base of size B ("Mean yield is not
        a design lever"). DISTRIBUTION LAW: the giant-component law y = 1 -
        exp(-c y) at c = 2 (Erdos-Renyi, recalled, a pointer), with a reviewer
        Monte Carlo of the abstract relation graph confirming the determined
        fraction at B = 128 and B = 512 (TASK-20260928-d5024b E05, internal),
        the cycle-sign determination rule (TASK-20260928-a75ba7, internal), and
        the C-4 Monte Carlo of the contract's abstract model (audit sheet
        g1_calibration, internal design figure). OBSTRUCTION, IN THE FINDING'S
        OWN QUANTITY (R2-J3-4): KN-FIND-007 states "Only the distribution is
        free. Coverage (the fraction of targets with at least one
        decomposition) obeys coverage <= min(1, mean), with equality iff no
        target has two decompositions. Additive structure that creates
        repeated sums therefore lowers coverage at matched size." That is
        TARGET coverage, not column coverage: a structured base can keep the
        mean yield and lower the fraction of attempts with at least one
        decomposition. In this contract that quantity is kappa_hat (the
        fraction of reuse-arm attempts returning at least one decomposition),
        predicted 1 - exp(-mu_c) by (e); its deficit raises a_bar (T_a low,
        FR and AM2 low when strong) while the determined-column tests pass, so
        it lands in class LOW-RETRY and, with a clean completeness audit and a
        coverage deficit on both binary cells, in H1-NEGATIVE-YIELD. The
        determined-column law (b), (c) is what the coverage tests T_delta,
        T_u, T_cmp measure; the Z/NZ control realises the model by
        construction.
      supporting_results:
        - ref: KN-FIND-007
          provenance: internal
          claim: Mean decomposition yield C(B+m-1, m)/N for every base of size B; target coverage, the fraction of targets with at least one decomposition, at most min(1, mean); repeated sums lower coverage at matched size.
          verified_by: TASK-20260929-6f5e6d (finding read in full this session)
        - ref: TASK-20260928-d5024b computations.json E05
          provenance: internal
          claim: Asymptotic determined fraction 0.79681 and usable 0.63491 at m = 2, R = B; Monte Carlo of the abstract relation graph, mean determined 0.7983 (B = 128) and 0.7970 (B = 512).
          verified_by: TASK-20260929-1e739f (entry and its stdout read there; not re-read by TASK-20260929-6f5e6d)
        - ref: TASK-20260928-a75ba7 red-team-report J3.collision reading_2 and reading_3
          provenance: internal
          claim: Determination by unbalanced cycles or coefficient-2 loops; tree components touched but undetermined; retries differ by mu regime under multi-decomposition acceptance.
          verified_by: TASK-20260929-1e739f (report read in full there; not re-read by TASK-20260929-6f5e6d)
        - ref: TASK-20260929-594e8d red-team-report J3 (version-2 review)
          provenance: internal
          claim: Under the contract's abstract model KR has relative sd 12.9 percent on CTRL-ZN and 4.5 to 4.7 percent on a binary cell; FR = a_bar / a_pred exactly; KN-FIND-007-direction yield concentration classes LOW-RETRY.
          verified_by: TASK-20260929-6f5e6d (report read in full this session)
        - ref: audit sheet session_computations C-4 (binstd_core.py --g1-calibration 4000 20261001)
          provenance: internal
          claim: Under the abstract model with H1 true and the version-3 per-cell bands, G1 fails in 0.00575 of replicates and each binary cell is non-PASS in 0.006 to 0.00775 (a design figure).
          verified_by: TASK-20260929-6f5e6d (output relayed by the top-level session and read in full)
        - ref: Erdos and Renyi, On the evolution of random graphs (1960), giant-component fraction
          provenance: recalled
          claim: "RECALLED POINTER. The giant component of G(n, c/n) has fraction y with y = 1 - exp(-c y) for c > 1; not load-bearing, the number is confirmed by the internal Monte Carlo above."
          verified_by: null
      validation_experiment_ids: [EXP-BINSTD-8cb697]
      validation_plan: >-
        SAMPLE: per cell, R = B_c relations and 1365 fresh certified targets
        in the L cells 1, 4, 16, 64, 256, 1024 (about 2900 decompositions on a
        binary cell and about 2170 on CTRL-ZN), plus 21 null-arm targets on
        CTRL-ZN and BIN-ORD-19; a completeness audit of 256 relation attempts
        and every attempt of 128 reuse targets per binary cell. PREDICTED
        DISTRIBUTION: delta_inf and its graph-level spread; u = delta^2 given
        the measured determined set; geometric attempts with p = 1 - exp(-mu
        u); target coverage 1 - exp(-mu); rho_rel 1 with relative sd
        sqrt(exp(-mu)/B); KR and FR 1 with the log-space sd of D-11.
        COMPARISON (two-sided): T_delta, T_u, T_a, T_cmp, the gates KR, FR
        (per-cell bands at 3.5 sd), d_sigma, and the target-coverage z
        (EXP-BINSTD-8cb697 definitions.observables_and_tests). SAMPLE SIZE: at
        about 2900 decompositions the standard error of the usable fraction is
        about 0.009, resolving the touched-against-determined difference
        (0.748 against 0.635) at about 12 standard errors; at 1365 targets the
        relative standard error of the mean attempts is about 2 percent,
        resolving single against multi-decomposition acceptance (2.49 against
        2.13) at about 8; at about 2900 attempts the standard error of
        kappa_hat is about 0.009, so a 10 percent target-coverage deficit is
        about 7 standard errors. TAIL: the maximum attempts per target against
        the 0.999 quantile of the maximum of 1365 geometric draws; the largest
        decomposition count in an attempt against the Poisson tail. CONTROLS:
        CTRL-ZN at mu about 1/32 (a second mu regime, where the model holds by
        construction); the no-reuse null; the completeness audit. TRANSFER:
        only the form of the uniform-leg law; the deployed constants are A2
        and A3's, not the toy measurements; the L-dimension is not tested.
      falsification_condition: >-
        With G1 passed and no invalidation: both binary cells LOW-COV (the
        determined-column tests fail low and every failing test is low)
        falsifies H1 at the tested cells in the determined-column direction,
        and the amortisation is recorded as coverage-limited on subspace bases
        (H1-NEGATIVE-COVERAGE); both binary cells LOW-RETRY with clean
        completeness audits and a target-coverage deficit on both falsifies
        the Poisson count law in KN-FIND-007's direction (H1-NEGATIVE-YIELD);
        both binary cells non-PASS otherwise falsifies H1's law at the tested
        cells in another direction (H1-NEGATIVE-DEVIANT). One cell failing is
        H1-MIXED (not validated, not falsified). An instrument failure, a
        failed self-test or completeness audit, a failed control gate, a
        timeout or a crash never falsifies H1.
    - id: H2
      name: generic laws (with their constant and conventions)
      formal_statement: >-
        (i) Multi-target rho with one shared distinguished-point table solves
        L logarithms in a group of effective size N in expected total c(L)
        sqrt(L) W1 group operations (W1 the single-target mean), with c(L) in
        [0.8, 1.3] at the toy L (IDEA-20260920-2e37b3's range; Kuhn-Struik's
        Theorem 1 sum gives 1.000, 1.094, 1.120, 1.126, 1.128 at L = 1, 4, 16,
        64, 256), so the per-target cost falls as L^(-1/2); for the windows'
        L the law is ASSUMED with c = 1 (the narrowest window). Kuhn-Struik
        state it only for L << N^(1/4); Bernstein-Lange measure tables only up
        to l^(1/3); it is false for L above N. (ii) The generic preprocessing
        frontier is S T^2 = N_prime and P T + T^2 = N_prime up to logarithmic
        factors, taken with S in 129-bit words and the group size N_prime =
        r/262 (C1); at source (CGK Theorems 2 and 10) S is in bits and N is
        the prime order, which move T_gen by -3.51 and +4.02 bits.
      random_model_justification: >-
        MODEL: a random mapping on the effective group; collision times of L
        walk families sharing one table. RIGOROUS BOUND: CGK Theorem 2
        (S T^2 = Omega-tilde(epsilon N)) and Theorem 10 (P T + T^2 =
        Omega(epsilon N)) in the generic-group model, retrieved and read by
        TASK-20260928-a75ba7. DISTRIBUTION LAW: the birthday law for random
        mappings; Kuhn-Struik Theorem 1 for pooled walks (retrieved, range
        L << N^(1/4)); Bernstein-Lange's measured table constants
        (retrieved). OBSTRUCTIONS: at toy N the distinguished-point overshoot
        and walk restarts rival the per-target walk at L near sqrt(N_G), and
        the toy walks use no negation or Frobenius classes while the deployed
        rho_1 does; under the I2 semantics (continuing walks, abandonment,
        detection at distinguished points) a reviewer random-mapping model
        inflates W1 by 6 to 11 percent and puts the expected c(L) at L >= 4
        2 to 4 percent below the Kuhn-Struik values (TASK-20260929-594e8d
        J3-O10), absorbed by the band; the constant above N^(1/4) is neither
        measured nor sourced, so it is carried as a disclosed choice (c = 1)
        with its sensitivities 2 log2 c on log2 L_hi and about log2 c on the
        critical log2 C.
      supporting_results:
        - ref: SRC-CGK, Corrigan-Gibbs and Kogan, IACR ePrint 2017/1113 (PDF sha256 f9550f7d9a0701e17bc2fe2c9faea7e1fed546f572d307f8e1adc6994f75de08)
          provenance: retrieved
          claim: Theorem 2, S T^2 = Omega-tilde(epsilon N) for S-bit advice in a group of prime order N (composite order, the largest prime factor); Theorem 10, P T + T^2 = Omega(epsilon N); Section 7.1, the matching table construction in O(S log N) bits.
          verified_by: TASK-20260928-a75ba7
        - ref: SRC-KS, Kuhn and Struik, SAC 2001, LNCS 2259 (PDF sha256 369ff4cfe50ae108cc514862cbf307c53354742780f2a7fe2fa175e3c6d73fe4)
          provenance: retrieved
          claim: Theorem 1, E_L about sqrt(pi N / 2) times the sum over t < L of C(2t, t)/4^t for L << N^(1/4), about sqrt(2 L N), a constant 2/sqrt(pi) = 1.128 relative to one target.
          verified_by: TASK-20260928-a75ba7
        - ref: SRC-BL, Bernstein and Lange, IACR ePrint 2012/458 (PDF sha256 204d47c34c410b594d2212370dde79e97883b9fdcb5a8b8ab6880a228d26d3b7)
          provenance: retrieved
          claim: 1.77 l^(1/3) online after 1.24 l^(2/3) precomputation with a table of l^(1/3) entries; Table 4.1, 15 measured constants at l about 2^48.
          verified_by: TASK-20260928-a75ba7
        - ref: KN-LIT-013
          provenance: internal
          claim: Corpus entry for CGK; states S T^2 = Omega-tilde(epsilon N) and that the full paper was not read there. Superseded as support by SRC-CGK above; kept as the corpus pointer.
          verified_by: TASK-20260929-1e739f (corpus entry read in full there)
        - ref: KN-LIT-f47b10 and KN-LIT-7cc07f
          provenance: internal
          claim: Corpus entries for Kuhn-Struik and Bernstein-Lange; superseded as support by SRC-KS and SRC-BL.
          verified_by: TASK-20260928-58d044 (read in full there)
      validation_experiment_ids: [EXP-BINSTD-8cb697]
      validation_plan: >-
        SAMPLE: the shared-table rho harness (I2) on each cell (subgroup orders
        about 2^17 to 2^20), 30 seeds per L in 1, 4, 16, 64, 256, and 150
        single-target reference solves, with the table charged in entries and
        bytes. PREDICTED DISTRIBUTION: total walk_ops at L about c(L) sqrt(L)
        W1 with the Kuhn-Struik values; exponent -0.5 + slope(log2 c), model
        -0.4805. COMPARISON: c(L) in [0.8, 1.3] at every L and exponent_rho in
        [-0.6, -0.4] on each cell (the exponent is -0.5 plus the slope of
        log2 c(L) identically, a disclosed link). TAIL: the 90th percentile
        over the mean of the per-seed totals at each L against the L = 1
        ratio. TRANSFER: the law's form only; part (ii) is not measured and
        enters only the Stage 0 arithmetic.
      falsification_condition: >-
        With G1 passed: both binary cells outside the H2 band (c(L) outside
        [0.8, 1.3] at some L, or exponent_rho outside [-0.6, -0.4]) with every
        c(L) inside the instrument band [0.5, 2] (H2-NEGATIVE): H2 (i) does not
        describe the shared-table harness at those group orders and L, and the
        window's rho side carries the measured law. A pooling constant outside
        [0.5, 2] is an instrument defect and reads nothing. Part (ii) is
