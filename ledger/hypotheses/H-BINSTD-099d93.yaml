  title: >-
    Cap-locus index calculus on ECC2K-130 splits into a shared cost paid once
    and a per-target cost paid per logarithm, so the reachability table can
    carry a preprocessing and multi-target budget row beside the
    single-target row; the row's frontier column is T_gen = sqrt(N_prime /
    B_cap) in 129-bit words at N_prime = r/262, with B_cap T_gen = P_gen
    exactly; its crossing windows in the oracle excess g are model arithmetic
    conditional on H1, H2 and the oracle cost C and are not validated at
    deployed L; and the contract tests, at m = 2 on two binary n = 19 cells
    and a relabelled Z/NZ control, only the per-cell laws the reuse arm can
    test under heuristic H1 (relation-phase yield, attempts law,
    determined-column law, target coverage) with a no-reuse null separated,
    and the pooled-rho law under heuristic H2

  statement: >-
    Let r be the prime with #E(F_2^131) = 4r on ECC2K-130 (log2 r = 129.0000)
    and N_prime = r/262 the effective generic size (negation and the 131
    Frobenius classes), log2 N_prime = 120.9666. Let B_cap(m) = (m! 2^131)^(1/m)
    be the cap locus at arity m (mu = 1), and C the per-attempt cost of an
    arity-m decomposition oracle, in group-operation equivalents.
    (A) SPLIT (model). Under assumptions A1 to A6 and heuristic H1, the cost of
    L logarithms in the order-r subgroup of one curve at base size B is IC(L)
    = T_shared + L per_target with T_shared = A(mu) B C + m B^2 (relation
    collection at one relation per base column, plus linear algebra with the
    iteration constant k = 1) and per_target = A(mu) retry_m C, where A(mu) =
    1/(1 - exp(-mu)) (1.582 at mu = 1) and retry_m = 1/(1 - m exp(-m)); at
    B = B_cap, per_target = kappa_m C with kappa_m = 1.707 (m = 4) and 1.637
    (m = 5). The C term and the m B^2 term are added at an assumed one-to-one
    rate (A6). Per-target cost falls as L^-1 until L is about T_shared /
    per_target and is flat at per_target beyond. Generic multi-target rho is
    ASSUMED under H2 to cost c rho_1 sqrt(L) in total with c = 1 for the L of
    the windows; Kuhn-Struik state the law (with c = 1.128) only for L <<
    N^(1/4), Bernstein-Lange measure it only for tables up to l^(1/3), and it
    is false for L above N_prime. At L = 1 the split reduces to a
    single-target product law: at m = 4 on the sub-cap base 2^29.036035 it
    reproduces the pinned D3 tie (at the frozen inputs log2(IC(1)/rho_1) =
    -1.63e-7 and the tie budget is 4.07e-7 bit above 11.010251; the L = 1
    tie is decided by the contract's tie rule, which is load-bearing there),
    and at m = 5 on B_cap(5) it reproduces the 1.58-attempt law (tie budget
    0.66174 bit below D3(5), the stated log2 A(1), because D3 charges one
    attempt per relation).
    (B) WINDOWS (model arithmetic, conditional on H1, H2 with c = 1, and C).
    Write C = 2^(c0 + g), c0 the pinned D3 value (33.075936 at m = 5;
    11.010251 at m = 4, a sub-cap value at log2 B = 29.036035). The model
    inequality IC(L) < rho_1 sqrt(L) holds for L strictly between the roots
    of a s^2 - s + b = 0 in s = sqrt(L), a = per_target / rho_1, b =
    T_shared / rho_1. m = 5, a B = B_cap(5) STATEMENT (no envelope over B is
    claimed): non-empty iff g < 12.256 (D3 convention; 12.918 in the
    proposal's 32.414212 convention); log2 L in [1.22, 54.04] at g = 0,
    [5.07, 50.04] at g = 2, [13.02, 42.04] at g = 6, [21.05, 34.01] at g = 10,
    [25.76, 29.30] at g = 12, empty at g = 13, 13.2 and 14; proposal
    convention [0.00, 55.37], [3.78, 51.37], [11.70, 43.37], [19.71, 35.35],
    [23.92, 31.14], empty at g = 13 and above. Memory beside it:
    index-calculus advice 2^31.67 bytes; the comparator's
    distinguished-point table at least 8 L entries, 2^62.13 bytes at the g = 0
    upper end. m = 4 has base size B free and is stated on ONE committed
    range, log2 B in [29.036035, 35.996035] (0.01-bit grid, 697 points),
    beside two named slices. Sub-cap slice (log2 B = 29.036035; advice
    2^33.12 bytes): non-empty iff g < 14.785; [0.00, 60.50] at g = 0, [9.42,
    48.50] at 6, [17.36, 40.50] at 10, [23.42, 34.43] at 13, [25.64, 32.22] at
    14, empty at 15; comparator table at the g = 0 upper end 2^68.59 bytes.
    Cap slice (log2 B = 33.896241; advice 2^37.98 bytes; LA 4 B_cap^2 =
    2^69.79, above rho): the LA term holds the lower end at log2 L_lo = 17.97,
    17.97, 18.04 and the upper end is 98.05, 80.08, 60.08 at log2 C =
    11.010251, 20, 30, and the slice is empty for log2 C above 42.138; the
    comparator table at its upper ends needs at least 2^101.05, 2^83.08 and
    2^63.08 entries (2^106.14 bytes at log2 C = 11.010251). Envelope on the
    committed range: lower edge 0.00, 4.80, 8.00, 10.40, 11.20, 16.05, 29.29
    and upper edge 99.38, 87.38, 79.38, 73.38, 71.38, 59.38, 39.27 at g = 0,
    6, 10, 13, 14, 20, 30; contiguous at every listed g; non-empty iff g <
    31.517 (closing log2 C 42.527 at log2 B about 34.33); advice at the
    maximising base up to 2^40.08 bytes; comparator table at the g = 0 upper
    edge at least 2^102.38 entries, 2^107.47 bytes. The lower edges carry the
    LA iteration constant as a hidden cofactor (at k = 2 or 3 they rise by up
    to 1.36 or 2.28 bits at g = 0; the upper edges and the critical g do not
    move). The m = 4 window is not narrower than the m = 5 window, contrary
    to the proposal's expectation; recorded as a design figure, not a result.
    (C) FRONTIER COLUMN, WITH ITS CONVENTIONS. Cap-locus index calculus is a
    preprocessing algorithm with advice S = B_cap words (the factor-base
    logarithms, 129 bits each, stored at 17 bytes), online cost kappa_m C per
    logarithm and precomputation A(1) B_cap C + m B_cap^2. At matched advice
    the generic frontier (CGK Theorem 2 for the online axis, Theorem 10 for
    the precomputation axis; retrieved) gives T_gen = sqrt(N_prime / S) and
    P_gen = sqrt(N_prime S), up to logarithmic factors at source. The column
    at m in 4, 5, 6, 8, 16 reads T_gen = 43.54, 46.69, 48.78, 51.34, 55.01
    bits and P_gen = 77.43, 74.27, 72.19, 69.63, 65.96 bits, beside advice
    2^37.98, 2^31.67, 2^27.50, 2^22.37, 2^15.04 bytes and LA time 69.79,
    57.48, 49.42, 39.57, 25.91 bits with LA memory (matrix plus three Krylov
    vectors) 2^40.27, 2^34.09, 2^30.04, 2^25.13, 2^18.44 bytes. Identity:
    B_cap T_gen = sqrt(N_prime B_cap) = P_gen exactly; the LA term sits below
    P_gen by 7.64, 16.79, 22.78, 30.05, 40.05 bits at the tested m.
    Conventions: in CGK's unit (advice in bits) T_gen is 3.51 bit lower; at
    CGK's prime group order r it is 4.02 bit higher; the column uses words
    and N_prime, matching C1's rho. Against the pinned D3 column (11.01,
    33.08, 37.39, 42.52 at m = 4, 5, 6, 8) T_gen is higher by 32.53, 13.61,
    11.39, 8.82 bits; against the absorbed mu = 1 column (11.0, 32.4, 36.7,
    42.2, 49.7) by 32.54, 14.29, 12.08, 9.14, 5.31. As MODEL ARITHMETIC
    UNTESTED BEYOND n = 131, log2 T_gen(n, m) = (1/2)(1 - 1/m) n - (3 +
    log2 n + (log2 m!)/m)/2 for a cofactor-4 Koblitz curve, n/(2m) bits above
    the single-target cap line (1/2 - 1/m) n.
    (D) WHAT THE CONTRACT CAN CERTIFY, AND WHAT IT CANNOT. It certifies the
    column with its conventions, the identity, the m = 5 window at B_cap(5)
    and the m = 4 slices and envelope as recomputed model arithmetic, and a
    toy validation at m = 2 on the tested cells of "the FORM of the
    amortisation law" under H1 and of the pooled-rho law under H2. GLOSS OF
    "THE FORM OF THE AMORTISATION LAW" (R2-J3-3): in the reuse arm the
    per-target units are attempts times the attempt cost and do not depend on
    L by construction, so the three amortisation observables reduce to two
    scalars: FR = a_bar / a_pred exactly (the attempts law, not flattening),
    KR x FR = rho_rel exactly (rho_rel the relation-phase yield), and d_sigma
    is a function of KR up to per-L noise, so AM3 is dominated by AM1. What
    the cells test is therefore the relation-phase yield (rho_rel), the
    attempts law (a_bar), the determined-column law (delta_hat, u_hat), target
    coverage (kappa_hat) and the separation of a no-reuse null that must fail
    every amortisation gate; THE L-DIMENSION OF THE LAW (per-target cost flat
    in L) IS NOT TESTED by the reuse arm as designed; it is an accounting
    identity of that arm. Whether the reachability table carries the second
    row, and whether m >= 4 oracle records are read against both rows, is the
    question DEC-20260928-63addc S1 decision_it_changes poses; it is a
    Coordinator decision after the run (the run proposes a column note),
    not asserted here. No oracle is made cheaper, no oracle is claimed to have
    any cost, and nothing here places any algorithm below the generic
    frontier, on any axis, on any row.

  statement_note: >-
    CONSTANTS AT C = T_gen, disclosed. With the attempt constant kept,
    P_IC(T_gen) = 1.582 P_gen + m B_cap^2, 0.666 bit above P_gen at m = 4 and
    0.662 bit elsewhere; online kappa_m T_gen is 0.77 (m = 4) or 0.71 (m = 5)
    bit above T_gen. Against the 16 retrieved Bernstein-Lange measured points
    the pair at m = 5 neither dominates nor is dominated (TASK-20260928-a75ba7
    PTM-A): an oracle at exactly C = T_gen is ON the frontier within about 0.5
    bit IN THE BERNSTEIN-LANGE CONVENTION (words, N_prime), never below it.
    Relative to CGK's lower bound the frontier is located only up to
    logarithmic factors, and the two convention choices alone move T_gen by
    -3.51 and +4.02 bits. The proposal's two-axis reading requires C below
    T_gen by more than these constants and is tripwire TW-01, never an outcome
    here. TW-01 CONTAINMENT IS A c = 1 STATEMENT (R2-J4-1): at c = 1 every
    non-empty window's antecedent C lies 1.34 to 1.40 bits under T_gen at
    B = B_cap(m) and 1.01 bit under T_gen(4) over the committed m = 4 range;
    the critical C rises by about log2 c, so the containment holds for c below
    about 2.01 (m = 4 range) and 2.52 to 2.63 (B = B_cap), holds at
    Kuhn-Struik's 1.128 and fails on the m = 4 envelope at the
    Bernstein-Lange constants 2.15 and 2.36; the routing rule (any window read
    with a measured cost is a TW-01 reading) does not depend on c. The
    1.58-attempt factor: at mu = 1 a target decomposes with probability
    1 - 1/e = 0.6321, so attempts per success are 1.5820 (0.6617 bit); the
    pinned D3 column charges one attempt per relation and the absorbed
    record's mu = 1 values at m = 5, 6 charge 1.58, which is why they differ
    by 0.66 bit; at m = 4 the sub-cap attempts are 1/mu = 2^19.44 under both,
    so 11.01 and 11.0 agree. At m = 8 the absorbed record's 42.2 is 0.34 bit
    above 41.86 and is recorded as a definitional difference (audit sheet
    stage0_4b65e3).

  mechanism: >-
    OBJECT FRAME (carried from the proposal). Representation R1 of
    RQ-ECDLP-623a32: the factor-base logarithm vector as a stored advice
    string of S = B_cap words, with the subspace membership test that makes a
    fresh target decomposable. Operation set Sigma: solve one more target
    using the stored logs; add one more target to the batch. Sigma acts on
    the schedule, not on points. The projection of a run onto the triple
    (T_shared, per_target, S) is lossy and Sigma-compatible: adding a target
    maps (T_shared, L) to (T_shared, L + 1) at cost per_target without
    consulting anything discarded, and the generic frontier is a function of
    the triple alone. The priced open number is C, unchanged; what this
    hypothesis changes is the line C is read against and the accounting of
    the product law's "targets" column (KN-FIND-aa2efc: relations x targets x
    oracle = m 2^131 in the N = 4r ambient of CORR-20260928-4cb669), which is
    the cost of obtaining the factor-base logarithms once; the challenge
    logarithm is then one more decomposition (IDEA-20260922-77bf31, as
    relayed by the proposal). The lift from one to L targets charges the
    "targets" column once and the descent L times, exactly under A1 to A6.
    Off-limits components used, named: F2 (decomposition) is the family; F7
    (preprocessing table) is the lens on the rho side; F1 (rho) is the
    generic multi-target comparator.
    PER-ORBIT GUIDANCE (C7). The proposal's forward guidance (iii)
    (orbit-quotient advice size B/131) is a per-orbit framing under
    CORR-20260925-649e25: conditional on the per-orbit unit no approved
    contract has fixed, cited only as a dependency on IDEA-20260926-201e86
    (HOLD-X2), never a movement. Recorded with it, as a pointer that is NOT
    independently reviewed: the version-1 red team's structural observation
    (TASK-20260928-a75ba7 OBJ-7) that, 2 having order 130 modulo 131,
    F_(2^131) has only four Frobenius-stable F_2-subspaces (dimensions 0, 1,
    130, 131), so an orbit-quotient advice size would need a Frobenius-closed
    base outside the scoped subspace base class, which changes the
    decomposition problem that defines C.

  assumptions:
    - >-
      A1. The L targets are logarithms in the same order-r subgroup of the
      same curve, so the stored factor-base logarithms are reusable (the
      multi-target setting of KR-RHO-46c2c6 and the fixed-group advice
      setting of CGK).
    - >-
      A2 (retries and the relation kept). DEPLOYED ARITY (m = 4, 5, the
      column): per-target cost is A(mu) attempts times retry_m = 1/(1 - m
      exp(-m)) at R = B, a first-order, one-decomposition-per-attempt model
      constant that overcharges kappa against multi-decomposition acceptance
      by 0.046 bit (m = 4) and 0.021 bit (m = 5), conservative toward index
      calculus. VALIDATION ARITY (m = 2, the toy cells): oracle A and the
      enumeration oracle return every decomposition of an attempt; on a
      target attempt ANY usable one is accepted; attempts per target are
      geometric with p = 1 - exp(-mu u), u the probability that a
      decomposition has both legs in DETERMINED columns; the unit is
      attempts. In the RELATION PHASE (and the null's relation collection)
      ONE returned decomposition is kept, chosen UNIFORMLY at random by a
      seeded stream (R2-J3-5), so under H1 the kept relation's legs are
      uniform whatever the oracle's return order. The target is re-randomised
      by one group operation per attempt, charged as group_ops.
    - >-
      A3 (linear algebra). DEPLOYED ARITY: linear algebra returns the
      logarithms of the determined columns; the touched-but-undetermined share
      is at least 0.26 percent (m = 4) and 0.05 percent (m = 5) and costs at
      most about 0.015 bit in kappa; it is disclosed and not charged in the
      column. The LA time is k m B^2 with the iteration constant k = 1, a
      hidden cofactor (R2-J1-3) shared with the D3 pin. VALIDATION ARITY
      (m = 2, R = B): only the columns of components containing an unbalanced
      cycle or a coefficient-2 loop are determined (0.7968 of the columns
      asymptotically); tree components are touched but carry a free
      variable, and NO solver returns their logarithms. The instrument (I1,
      an exact reduced-row-echelon solve) returns exactly the determined set;
      the prediction is the determined law.
    - >-
      A4. The rho comparator is matched rho 2^60.8090 = sqrt(pi r / (4 x 131))
      (CORR-20260922-81aeab), equal to sqrt(pi N_prime / 2) since N_prime / 2
      = r / 524 (C1); multi-target rho is c rho_1 sqrt(L) under H2 with c = 1
      in the windows (Kuhn-Struik's own constant is 2/sqrt(pi) = 1.128 for
      L << N^(1/4); c = 1 gives the narrowest window and the lowest critical
      C).
    - >-
      A5. Arithmetic only at deployed parameters (n = 131); executable cells
      at n = 19 and on a relabelled Z/NZ group of about 2^20. The ambient of
      the decomposition count is the full group (#E = 4r on ECC2K-130; #E =
      2q and 4l on the toy curves; N on the control), the targets live in the
      prime-order subgroup, and factor-base columns are the subgroup
      projections of base points up to sign. The mean decomposition count over
      the subgroup differs from mu_c by the coset factor h sum_i |F_i|^2 /
      |F|^2 >= 1, quadratic in the imbalance of F over the cosets; it is
      reported, not gated.
    - >-
      A6. UNITS: at deployed parameters C (group-operation equivalents) and
      the LA term (modular multiply-adds) are added at an assumed one-to-one
      rate, a model assumption inherited from the pinned product law and the
      D3 column, not a measured rate. Off-limits components declared: F2
      (family), F7 (comparator and the stored-logs analogue), F1 (comparator).
      No decomposition mechanism is proposed; no oracle cost is asserted.

  proof_search_map:
    bottleneck: >-
      Whether an arity-m oracle at the cap locus has per-attempt cost C below
      sqrt(N_prime / B_cap) up to the disclosed constants. Every other
      quantity in the preprocessing row is model arithmetic. The lane's open
      question (C) is unchanged; the line it is read against is new; the
      decision it informs is DEC-20260928-63addc S1 decision_it_changes.
    baseline_embedding:
      parameter_slice: >-
        L = 1 reproduces a single-target product law term by term, and which
        law depends on the attempt convention. AT THE FROZEN INPUTS (R2-J1-1):
        at m = 4 on the sub-cap base 2^29.036035 with C = 2^11.010251,
        log2(IC(1)/rho_1) evaluated from the model terms is -1.63e-7 bit, the
        g = 0 lower root is log2 L_lo = -3.25e-7 (L = 1 formally inside the
        window) and the tie budget is 4.07e-7 bit above 11.010251; the
        contract's tie rule (|log2 L_lo| below 1e-4 is the L = 1 tie) is
        LOAD-BEARING there and reads it as the pinned D3 tie, never an
        advantage. At m = 5 on B_cap(5) the tie is the 1.58-attempt law: at
        the frozen proposal input 32.414212, log2(IC(1)/rho_1) = 1.43e-5 and
        log2 L_lo = 2.87e-5 (the tie), and at C = 2^33.075936 (D3) the slice
        reads 0.6078 bit above rho_1. The committed stage0.py prints these
        values (audit sheet session_computations C-3: -1.626e-7, 4.066e-7,
        1.4328e-5, 0.60776). C = T_gen reproduces the generic frontier point
        (B_cap T_gen = P_gen, PTM-A). m = 23 with B = 524 known-log points
        reproduces IDEA-20260926-178821's zero-relation row as the L = 1,
        S = 524 endpoint (cited, not re-derived).
      reproduction_check: >-
        Symbolic: log2(B_cap T_gen) - log2 P_gen = 0 identically. In the m = 5
        D3 convention the g = 0 lower root is log2 L_lo = 1.2155 (b =
        1.523877), because D3 charges one attempt per relation and M5 charges
        A(1). The committed stage0.py evaluates IC(1)/rho_1 and the tie
        budgets FROM THE MODEL TERMS, so each can fail (S0); the version-2
        residual figures (4e-7, 8e-7, 1.3e-8) were values at the unrounded
        comparators and are withdrawn as frozen-input statements. Frozen
        fixture: the CTRL-ZN gate G1, committed as runnable, import-safe code
        in the audit sheet (fixture_code, binstd_core.py, which is also the
        Stage 2 instrument code), with its pass criterion stated before
        execution.
    observation_collision:
      observable: >-
        The per-cell tests T_delta, T_u, T_a, T_cmp, the amortisation gates
        KR, FR, d_sigma (which reduce in the reuse arm to the pair rho_rel,
        a_bar, with AM3 dominated by AM1), and target coverage kappa_hat.
      distinct_preimage_search: >-
        Preimages of an apparent amortisation reading: (i) genuine reuse of
        the stored logarithm vector; (ii) an over-complete relation set,
        whose determined fraction near 1 trips CTL-6 (IR-10, ARTIFACT); (iii)
        a no-reuse process (fixed setup plus an independent per-target
        solve), run as the null arm CTL-8 with identical accounting, which
        must fail all three amortisation gates (IR-9 otherwise); (iv)
        coverage-limited reuse, which fails the determined-column tests low
        (LOW-COV), the NEGATIVE outcome H1-NEGATIVE-COVERAGE on both binary
        cells; (v) a KN-FIND-007-direction yield deficit (target coverage
        below the Poisson value at matched mean), class LOW-RETRY with a
        coverage deficit, the NEGATIVE outcome H1-NEGATIVE-YIELD on both
        binary cells; (vi) the no-reuse process fed as if it were the reuse
        arm, LOW-RETRY with target coverage normal, H1-NEGATIVE-DEVIANT, never
        POSITIVE; (vii) an oracle that misses decompositions, caught by the
        completeness audit IR-11 (ARTIFACT) or the self-test AR-ORACLE
        (INCOMPLETE), never NEGATIVE. The relabelled Z/NZ control, where the
        random model holds by construction, must pass every test (G1).
        Details: audit sheet audit_2 and outcome_reachability.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The resource triple (T_shared, per_target, S) at the cap locus for
          each m, added over the disjoint blocks relation collection, linear
          algebra and L descents, specialised against the two generic laws
          (Kuhn-Struik Theorem 1 and CGK Theorems 2 and 10, retrieved).
        predicted_gain: The frontier column with its conventions and the crossing windows in g, at zero compute.
      - transform: boundary_lift
        proposed_object: >-
          The single-target product law lifted to L targets by charging the
          "targets" column once and the descent L times; exact under A1 to A6.
        predicted_gain: >-
          Shows the product law is the L = 1 slice of a two-parameter cost,
          with the convention that slice reproduces stated per arity.
    quantifier_order: >-
      FOR ALL m >= 4 and FOR ALL oracles with per-attempt cost C at base size
      B, IC(L) = T_shared(B, C) + L per_target(B, C) under A1 to A6 and H1, and
      at B = B_cap the leading-order precomputation equals P_gen at C = T_gen.
      FOR ALL g below the critical value (12.256 at m = 5 on B_cap(5) in the
      D3 convention; 14.785 on the m = 4 sub-cap slice; 31.517 over the
      committed m = 4 range) THERE EXISTS a non-empty window of L on which
      IC(L) < c rho_1 sqrt(L) with c = 1, under H2. The witnesses (window
      endpoints) depend on m, g, the base size B and the constant c (log2 L_hi
      moves by +2 log2 c and the critical log2 C by about +log2 c) and on
      nothing else. NOT CLAIMED: that any oracle has C at or below any of
      these budgets; that any point lies below the generic frontier. The toy
      observables are normalised so their predicted values are the same on
      every cell, and their bands are one function of each cell's (B, mu,
      n_t).
    method_ceiling:
      strongest_certifiable_claim: >-
        "On ECC2K-130 the frontier column is T_gen = [values] at matched
        advice S = B_cap 129-bit words at N_prime = r/262, located only up to
        logarithmic factors against CGK; the pinned single-target column is
        D3; at m = 5 on B_cap(5) an oracle g bits over D3 with g < 12.256 has
        IC(L) below the c = 1 rho law for L in [values], as model arithmetic
        conditional on H1 and H2; and at m = 2 on the tested binary n = 19
        cells and the Z/NZ control the measured relation-phase yield, attempts
        law, determined fraction, usable probability and target coverage agree
        (or do not) with the H1 law, the no-reuse null is separated (or not),
        and the pooled rho constants agree (or do not) with the H2 law." It
        can NEVER certify C at n = 131 for any oracle, a window at deployed L,
        the L-dimension of the amortisation law, or a point below the
        frontier.
      nearby_object_control: >-
        The relabelled Z/NZ group (N the least prime above 2^20, base 2^7, mu
        about 1/32) with the enumeration oracle, where H1's random model holds
        by construction and every test must pass against bands scaled to its
        own regime; the ordinary and the Koblitz n = 19 cells (no Frobenius is
        used; identical normalised predictions; CTL-2 disagreement is the
        declared outcome H1-MIXED or H2-MIXED); the no-reuse null arm (CTL-8,
        PTM-D), which must fail every amortisation gate; PTM-A (C = T_gen reads
        on the frontier with zero relaxation); PTM-B (the L = 1 slices
