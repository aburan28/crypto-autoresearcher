    proof_obligations:
      - claim: The frontier column at m in 4, 5, 6, 8, 16 with its conventions, the m = 5 window at B_cap(5), the m = 4 slices and the m = 4 envelope on the committed range, recomputed by the committed Stage 0 code within the stated tolerances of the frozen design figures.
