hypothesis:
  id: H-CZLIFT-27a184
  question_id: RQ-CZLIFT-b9f765
  goal_id: GOAL-CZLIFT-1516d5
  source_proposal: IDEA-20261009-791518
  designed_from: IDEA-20261009-791518
  added: '2026-10-09'
  proposed_by: coordinator
  designed_by: coordinator
  approval_decision: DEC-20261009-575cd3
  title: On retrieved rank-record curves (rank >= 8 and >= 9) small rational points stay rare and reduce uniformly,
    so the (log H)^{r/2} constant collapses with the coefficient size
  statement: 'With the Grunewald-Zimmert (rank >= 8) and Brumer-Kramer (rank >= 9) curves retrieved from Dujella''s
    rank-history pages and the lane-1 rank-7 curve as overlap: N_E(10^5) on the two record curves is below N_E(10^5)
    of the rank-7 curve (the constant c_E falls with coefficient height although the rank is larger), every coverage
    cell with N >= 30 has ratio to the uniform model in [0.5, 1.5] with median in [0.8, 1.2], and no H_half(p) is
    resolved on either record curve for p >= 1000 at H <= 3 x 10^5.'
  mechanism: Neron's constant c_E in N_E(H) ~ c_E (log H)^{r/2} scales like the inverse square root of the regulator,
    and record curves are built from independent points of large height, so their small-height points are few even
    though r is large; the reductions of the few points found have no structure in E(F_p).
  assumptions:
  - ranks are LOWER BOUNDS as the source pages state them; the growth slope cannot confirm them at these heights
    because N_E(10^5) is small
  - LMFDB holds no rank-8 curve (API query returned no data on 2026-10-09)
  proof_search_map:
    not_applicable_reason: bounded measurement against a pre-registered prediction; no asymptotic claim
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
  - description: known-negative row on lifting to characteristic zero
    citation: knowledge/frontiers/ecdlp/index-calculus/KR-IC-cd159a.yaml
    provenance: internal
    verified_by: coordinator, this session (2026-10-09), read the entry on disk
    role: the obstruction being quantified
  reduction_chain:
    core_problem: whether a characteristic-zero lift of the ECDLP carries discrete-log information at the tested
      scope
    corollaries: []
  predictions:
  - metric: N_E(hmax) of each record curve against the rank-7 overlap curve
    direction: lower
    minimum_effect: strictly smaller on both record curves
  - metric: coverage_ratio_median, coverage_ratio_frac_above_1p5
    direction: different
    minimum_effect: median in [0.8, 1.2], frac above 1.5 below 0.05
  - metric: h_half resolved primes >= 1000 on record curves
    direction: different
    minimum_effect: none
  test_boundary:
    instances:
    - three curves (rank 7 overlap, rank >= 8, rank >= 9), hmax 10^5 then 3 x 10^5, 16 primes to 20000
    parameters:
      twists: 0
    implementation: experiments/EXP-CZLIFT-14f6d5/implementation/run.py reusing the lane-1 census driver
    budget:
      wall_clock_seconds_per_run: 3600
  falsification_conditions:
  - a record curve with more small points than the rank-7 curve at hmax
  - coverage ratio median outside [0.8, 1.2] or above-1.5 fraction >= 0.05
  - an H_half resolved at p >= 1000 on a record curve
  interpretation_limits:
