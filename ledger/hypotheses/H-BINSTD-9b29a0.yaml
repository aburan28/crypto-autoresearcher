  title: >-
    On the composite ambient group of ECC2K-130 every exactly sum-compatible
    filter has alphabet in 1, 2, 4, so the exact capacity is 2 bits (subject to
    PO-1 and to the primary source's primality statement for l), and every
    exact component is a function of the E/4E class; the ideal k-list tree is a
    CEILING of the k-list column and not a reachable cost; and the approximate
    capacity of the declared Koblitz-specific arms, identified by role, BEYOND
    THOSE EXACT COMPONENTS is measurable on an admissible three-cell ladder by
    comparing each arm with its own shuffle stratified by the exact quotient
    and with an exact-saturated random-label null, a NEG being read only
    relative to the floor measured on that same path.

  statement: >-
    Let E be a binary Koblitz curve and G a finite abelian group written
    additively. Call h from G onto an alphabet of size M EXACTLY SUM-COMPATIBLE
    if there is a combining rule f with h(P + Q) = f(h(P), h(Q)) for all P, Q in
    G and f invertible in each argument.

    (A) CAPACITY CERTIFICATE, unconditional subject to PO-1 (carried). Theorem C
    of KN-FIND-ffe1df re-run on an arbitrary finite abelian group: f is a
    quasigroup operation, associativity forces it associative, an associative
    quasigroup is a group, h is a surjective homomorphism, and Lagrange gives M
    dividing the order of G. On ECC2K-130, whose ambient group order is 4l with
    l the 129-bit prime 680564733841876926932320129493409985129 AS STATED BY THE
    PRIMARY SOURCE (Bailey et al., Appendix A; not proved here), every alphabet
    strictly below l lies in 1, 2, 4: the exact capacity of the FULL group below
    l is 2 bits, of the target subgroup 0 bits. COROLLARY USED BY (D): every
    exact sum-compatible map below l is a function of the E/4E class h4 (and
    E/2E is its quotient). The certificate is committed as code that works from
    a guarded factorisation (CODE-CERT), with four control readings as pass
    criteria; the guard for l is a strong probable-prime test, a proof only
    below the bound its docstring recalls (RV-10, disclosed).

    (B) THE TWO NONTRIVIAL EXACT FILTERS (carried). The order-2 filter E onto
    E/2E, P maps to Tr(x(P)) + Tr(a), RE-DERIVED FROM THE GROUP LAW (Q in 2E
    exactly when Tr(x(Q)) = Tr(a)) and corroborated at source by
    Fong-Hankerson-Lopez-Menezes CACR CORR 2003-18 Lemma 4.1(iv). The order-4
    filter E onto E/4E, constructed by scalar multiplication (DF-1), with its
    halving presentation (DF-6), which supplies the STRATUM of every Koblitz
    arm after PC-4b shows it equal to the constructed map.

    (C) THE CEILING, EXPLICITLY COUNTERFACTUAL, IN NAMED AMBIENTS (carried).
    Under the ideal k-list model (k = 2^j lists of size L = N^(1/(j + 1)),
    per-attempt cost k L, B = L, relations B or B/262, linear algebra k R^2) in
    the declared target-subgroup ambient (N = l), an ideal k = 16 tree would
    need an alphabet of about 2^25.80 at each of three internal levels; the
    per-level gap is 25.80 bits (capacity 0 bits) and the closure line at the
    exact capacity about 2^107.20 per attempt; in the full-group ambient (N =
    4l) the gap is 24.20 bits (capacity 2 bits) and the closure line about
    2^102.80. The ideal-tree totals are the CEILING of the k-list column,
    CONDITIONAL ON A FILTER THAT (A) EXCLUDES EXACTLY, and are not a cost any
    construction reaches. Nothing here predicts or asserts any reachable cost
    below matched rho on ECC2K-130 or on any curve. Any reading of a lead is
    pre-registered to review-breakthrough at max and to independent
    replication before interpretation.

    (D) THE ONE OPEN NUMBER, MEASURED BEYOND THE EXACT COMPONENTS, BY ROLE. For
    a cheap NON-homomorphic label h the level-1 bucket gain is G(h) = M times
    the maximum over (a, b, c) of Pr[h(P + Q) = c given h(P) = a, h(Q) = b],
    from S = 2^ceil(log2(128 M^2)) sampled pairs per (cell, M). Its CONTROLLED
    EXCESS is G minus the median of ten shuffles of h STRATIFIED BY THE CELL'S
    EXACT QUOTIENT (h4 on a Koblitz cell, h2 on the ordinary cell), read
    against the width W of the EXACT-SATURATED random-label null q r + e of the
    same (cell, M). Every declared arm is identified by a ROLE that does not
    vary with the cell (F1, F2@0, F2@mid, F2@end, F3@0, F3@mid, F3@end, F4,
    F5xF1, F5xF2@0, F5xF3@0, F5xF4 on Koblitz cells; ORD-F2@0 to ORD-F3@end
    on the ordinary cell), and receives one verdict and, on Koblitz cells, one
    L2 interval. PREDICTION, stated so that it is true of a null and can fail:
    on the admissible Koblitz ladder n in 13, 19, 23 at M = N^(1/3) and
    N^(1/4) (N = l), at the fixed alphabet M = 16 on n in 13, 19, 23, 41, and
    on the ordinary n = 19 cell, every declared role reads NEG - no stratified
    controlled excess (clause L3) at any estimated valid (cell, M). A uniform
    random label and the two exact-content-only labels XCO1 and XCO2 also read
    NEG; they are nulls of this comparison, and the contract requires it
    (PC-15, PC-17, PC-18). A NEG at a (cell, M) asserts only that the role's
    stratified excess lies below the NEG-PATH FLOOR measured at design time on
    a permitted group of the same shape: an exact-free planted mixture of the
    log-interval key is resolved by L3 from rho between 0.5 and 0.8 depending
    on the (cell, M), an exact-carrying one from rho between 0.5 and 0.9, and
    at CELL-K13 M = 8 no exact-carrying mixture is resolved at all (audit sheet
    C-6). The exact controls read exactly 2, 4, 548, 956 and every declared
    alphabet on Z/2^17; the log-interval key on Z/lZ reaches LEAD with growing
    (PC-16) and flat (PC-16b) standardised excess; an exact-free and an
    exact-carrying planted filter reach LEAD on the curve path of the lead
    shapes (PC-16d); and a planted decay rho = 1, 0.7, 0.4 does not (PC-16c,
    a LEAD guard). A role meeting clauses L1, L2 and L3 of the experiment's
    SR-4 is the LEAD branch and is routed, not interpreted. F1 carries the
    exact E/2E bit; under the stratified comparison that bit is not excess, so
    F1's predicted reading is NEG like every other role.

  statement_note: >-
    DC-B1 (carried): the record's 2^24.7 relations at k = 8 with orbit unknowns
    is 0.4834 bit above the recomputation 2^24.2166 under the record's own
    model; the diagnosis is left open, the ambient-mix reading recorded as the
    more plausible one. DC-B2 and DC-B3 carried. The proposal is NOT edited.

  mechanism: >-
    OBJECT FRAME (carried). Representation R1 of RQ-ECDLP-623a32: the
    x-coordinate of a point of the FULL group E(F_2^n), read in a normal basis
    (Frobenius a cyclic shift) and in the polynomial basis. Operation set Sigma:
    pairwise addition at ONE merge level of a k-list tree, with Frobenius and
    negation. The translation block systems of E are the cosets of 2E and 4E
    (IDEA-20260922-153a90, cited by id).

    TRICHOTOMY (carried). The exact filters are Class I objects whose entire
    content is the 2-bit block system of (A); every non-homomorphic candidate is
    Class II BRANCHING, and G is the branching meter at one level, b = M / G.

    WHAT VERSION 3 GOT RIGHT AND KEEPS. In a normal basis the trace is the sum
    of the coordinates (FHLM Section 4.2), so F1's weight parity is h2 and F1
    is a MIXED object. Every curve-cell arm is shuffled within the strata of
    the exact quotient and compared with the exact-saturated null (RR-1 route
    (a)); exact-content-only labels must read NEG (PC-17, PC-18); L2 is
    NON-DECAY on a per-seed standardised excess; the stratified branch is
    gate-pinned (PC-6c, PC-6d).

    WHAT VERSION 4 CHANGES, AND WHY. (i) DEGENERATE ROWS (RV-1). Some declared
    rows are a function of the exact quotient except on a few points (F5xF4 at
    M = 8 on CELL-K13 differs from an h4 function on 2 of 8011 affine points).
    Such a row reads EXACT on many seeds while its global image is larger than
    4, which the version-3 image clause read as a refutation of (A). Version 4
    counts the image only over labels of USED conditioning cells, audits every
    declared row for degeneracy with a rule stated before execution
    (EXACT-FUNCTION, DEGENERATE at most one percent of points off an h4
    function, REGULAR), and exempts DEGENERATE rows by name; a near-exact
    control on permitted groups shows the revised clause silent (C-5, C-8).
    (ii) PC-16c AS A LEAD GUARD (RV-2). The planted decay is strengthened to
    rho = 1, 0.7, 0.4 and its failure blocks LEAD only; NEG is read on L3
    alone and is not voided by a control that tests only L2's false-pass
    direction. (iii) ROLES (RV-3). Every reading, verdict, L2 interval and
    held-out test is keyed by role, and an end-to-end dry call over the full
    declared name grid shows every role reaching every outcome its table
    assigns (C-7). (iv) NEG-PATH FLOORS (RV-4). The floor quoted beside NEG is
    measured on the path NEG is read on (stratified shuffle, exact-saturated
    null, L3) for an exact-free and an exact-carrying planted mixture on a
    permitted group of each declared shape; the Z/l floor is a reference and
    an underestimate. (v) CURVE-PATH LEAD REACH (RV-5). PC-16d requires XF(1)
    and XC(1) to classify LEAD on the lead shapes; for exact-free arms L1
    needs a stratified excess of about 3 W plus a measured offset (2.3 to
    4.4 W at the lead shapes). (vi) RV-7, RV-8 and RV-12: missing or invalid
    ladder cells and lead keys give ART-DEF, and the voiding rules are applied
    in code. (vii) RV-6: every design computation ran on permitted groups.

    WHY A NULL READING WOULD BE ADMISSIBLE AT ALL. The same instrument must
    read forced non-null values on nearby objects (CELL-K17C, Z/2^17, Z/(16 x
    2003), Z/lZ with the key, XF(1) and XC(1) on the ISO lead shapes) and forced
    null values on exact-content-only labels; a NEG asserts absence only above
    the NEG-path floor of its (cell, M).

    THE CEILING IS NOT A MECHANISM. (C) prices what a filter WOULD be worth.

  assumptions:
    - >-
      The ECC2K-130 ambient group order is 4l with l prime as the primary source
      states, and the 2-Sylow subgroup is cyclic of order 4 (carried).
    - >-
      The ideal k-list accounting of (C) assumes independent uniformly random
      lists and a filter with G = M at every internal level; it is the IDEAL
      bound, used only to state the ceiling and its threshold arithmetic, and is
      conditional on a filter that (A) excludes exactly (carried).
    - OFF-LIMITS COMPONENT DECLARED (carried). F2, factor-base decomposition, is the family; KN-OPEN-020 is engaged only through the orbit-union base of the ceiling's with-orbit line. F1 is not used.
    - Arithmetic only at deployed parameters (carried). Every executable cell has n at most 41 and every ladder cell n at most 23. No k-tree run at deployed parameters, no target-dependent family, no level above 1, and no IDEA-20260926-d3c5a5 engine.
    - >-
      NO BUDGET QUANTITY IS USED (carried). None of D1 (2^-4.41), D2 (2^+5.71)
      or D3 (2^+11.01) of CORR-20260928-4cb669 is used and no per-attempt
      oracle budget is asserted; under that correction's pricing rule a
      per-attempt comparator, were one ever needed, would be D3 and never D1.
    - Matched rho on ECC2K-130 is 2^60.8090 = sqrt(pi l / (4 x 131)) under CORR-20260922-81aeab, AMBIENT the target subgroup; a reference for the ceiling line and the ceiling-model threshold table only.
    - >-
      Every exact component a label on a declared cell can carry is a function
      of the cell's exact quotient (h4 on a Koblitz cell, h2 on CELL-O19), by
      the corollary of (A) applied to each cell's verified order (4 x a prime,
      or 2 x a prime). STRUCTURAL PREMISE (DI-SP, parameter arithmetic only):
      on the Koblitz cells E/4E has order 4 and is cyclic, on CELL-O19 4E = 2E
      and the strata are the two cosets of 2E; every declared alphabet is a
      power of two divisible by the stratum count, so the exact-saturated null
      and the F5 composites are defined at every declared (cell, M).
    - >-
      NEW (RV-4). The NEG-path floors are DESIGN FIGURES measured on permitted
      groups Z/(q l') of the declared shapes, l' an adjacent non-declared prime
      (log2 l' within 0.006 of log2 l), and transferred to the declared group
      of the same shape; they describe the planted class (mixtures of the
      log-interval key) and no other.

  proof_search_map:
    bottleneck: >-
      The level-1 bucket gain G(h) of cheap filters on E(F_2^n) for a binary
      Koblitz curve at the alphabets of rule R-M, read BEYOND THE EXACT
      COMPONENTS, per declared role: against the role's own shuffle stratified
      by the exact quotient and against the exact-saturated null.
      Decision-changing because the k-list column is a prose closure by
      Theorem C and either outcome replaces it with a quantity scoped to the
      declared roles, the tested cells and the measured NEG-path floors.
    baseline_embedding:
      parameter_slice: >-
        Seven slices, each a blocking control with committed code: Z/2^17 low
        bits (PC-1); Z/lZ with the log-interval key, growing and flat (PC-7,
        PC-16, PC-16b), with the decaying lead guard (PC-16c); XF(1) and XC(1)
        on the ISO lead shapes (PC-16d, new); the composite n = 17 cell at 548
        and 956 (PC-5); Z/(16 x 2003) and Z/(64 x 2003) exact beyond the stratum
        (PC-6c); the certificate on 4l, 2^17 and 130972 with malformed inputs
        refused (PC-CERT-1 to PC-CERT-4).
      reproduction_check: >-
        SYMBOLIC plus a FROZEN FIXTURE: the fourteen import-safe code blocks of
        the audit sheet, extractable by one pinned method with pinned reference
        sha256, pass criteria stated before execution and placed in the
        experiment's SR-1 and IR-1 to IR-25, each rule's null false-fire rate
        computed in code (C-5).
    observation_collision:
      observable: >-
        Per (cell, role, M, seed): G, its excess over the exact-saturated null,
        its excess over its own stratified shuffles, and the per-seed
        standardised excess along the ladder.
      distinct_preimage_search: >-
        Six collisions, each separated by a control or clause with code (audit
        sheet audits): OC-1 marginal skew (the shuffle; PC-6a, PC-6b, PC-6d);
        OC-2 sparse tables (rule R-S, IR-12, PC-2, PC-9); OC-3 secretly exact or
        near-exact (the certificate; SR-6 with the used-cell image rule; the
        degeneracy audit; the near-exact control, NEW); OC-4 a blind instrument
        (PC-1, PC-5, PC-7, PC-16, PC-16b, PC-16d); OC-5 occupancy growth (L2 on
        per-seed-standardised excess, PC-15); OC-6 exact-content-only labels
        (the stratified comparison; PC-6c, PC-6d, PC-17, PC-18).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The k-list tree's filter requirement rewritten as a subgroup-index condition on the ambient group; guarded code (CODE-CERT).
        predicted_gain: The exact-capacity cell of the k-list column reads 2 bits from the cofactor (0 bits on the target subgroup), with the ideal-tree table as the column's ceiling. Zero compute.
      - transform: observable_fiber
        proposed_object: >-
          Hold the stratified controlled excess fixed and vary the forgotten
          structure: the prime-l Koblitz cells (predicted none beyond the exact
          components), the composite cell, Z/lZ with the key, the planted
          XF and XC filters on the ISO shapes, the near-exact degenerate
          labels and the exact-content-only labels.
        predicted_gain: It makes a NEG reading admissible and scoped, because the same instrument reads forced non-null values on the nearby objects, forced null values on exact-content-only and near-exact labels, and a measured floor on the NEG path.
    quantifier_order: >-
      (A) FOR ALL finite abelian groups and FOR ALL exactly sum-compatible maps:
      M divides the group order and h is a homomorphism; HENCE on ECC2K-130
      every alphabet below l lies in 1, 2, 4 and every exact component is a
      function of h4. (D) FOR THE TESTED cells and THE DECLARED roles ONLY, at
      level 1 only, relative to the NEG-path floor of each (cell, M) at the
      declared S: every role reads NEG beyond the exact components. NOT
      CLAIMED: undeclared or target-dependent filters; levels above 1;
      excesses below the floors; any cost on any deployed curve.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On ECC2K-130 every exactly sum-compatible filter has alphabet at most 4
        (subject to PO-1 and the source's primality statement for l); and on toy
        Koblitz cells at n in 13, 19, 23 (and at M = 16 to n = 41) the declared
        roles show no stratified controlled excess beyond the exact components
        RELATIVE TO THE NEG-PATH FLOORS measured at each (cell, M) on permitted
        groups of the same shape (an exact-free planted mixture of the
        log-interval key resolved from rho 0.5 to 0.8, an exact-carrying one
        from rho 0.5 to 0.9, none exact-carrying at CELL-K13 M = 8), with the
        exact controls read exactly, exact-content-only and near-exact labels
        read as nulls, and LEAD reachable on Z/l and on the curve path as
        PC-16, PC-16b and PC-16d show." It can NEVER certify that no cheap
        filter exists, nothing below the floors, nothing about levels above 1
        or the algebraic route, and nothing about any deployed curve's cost or
        security.
      nearby_object_control: CELL-K17C, Z/2^17, Z/(16 x 2003) and Z/(64 x 2003), the Z/l key ladder, the ISO cells with XCO1, XCO2, XF(1) and XC(1), CELL-O19 and RLFAM, all blocking; the near-exact degenerate control at design time and in review.
    proof_obligations:
      - claim: PO-1. Theorem C's argument holds verbatim on a composite-order finite abelian group (carried).
        responsibility: correctness
      - claim: PO-2. The halving criterion Tr(x(Q)) = Tr(a) for membership in 2E, re-derived from the group law and corroborated at source (FHLM Lemma 4.1(iv)); P to Tr(x(P)) + Tr(a) a surjective homomorphism onto E/2E (carried).
        responsibility: correctness
      - claim: PO-3. E/4E cyclic of order 4; the constructed map a surjective homomorphism; the halving presentation equal to it when Tr(A) = 0, checked by PC-4b (carried).
        responsibility: correctness
      - claim: PO-4. The ideal k-list arithmetic, the gap and closure lines in both ambients, and the ceiling-model threshold arithmetic (carried).
        responsibility: baseline
      - claim: PO-5. The (C3) floor 2^101.0000 C_3 (target subgroup) and the (C4) floor 2^62.4833 (full group) and 2^61.4833 (target subgroup) per relation, computed in CODE-S0 (carried).
        responsibility: runtime
      - claim: PO-6. G estimated with the stated S, ten enumerated seeds, ten stratified shuffles per seed and a measured exact-saturated null of 500 draws per (cell, M) with per-seed widths, the IR-2 positivity check applied in code; never a percentile bootstrap.
        responsibility: correctness
      - claim: PO-7. Every cell's order, the primality of its l (by complete trial division) and the cyclicity of its 2-Sylow subgroup recomputed and proved at setup; design-time orders are inputs, never results (carried).
        responsibility: baseline
      - claim: PO-8. The exact capacity, the ceiling and the measurement are three separable quantities with named ambients (carried).
        responsibility: scope
      - claim: PO-9. Interface. No interface converts the ceiling into a reachable cost, and no statistic of the contract is mapped onto the ceiling-model thresholds (carried).
        responsibility: interface
      - claim: PO-10. The strata are the complete exact quotient of each declared cell, so the stratified comparison removes every exact component and nothing else; checked in implementation by PC-6c, PC-6d, PC-17 and PC-18 (carried).
        responsibility: correctness
      - claim: PO-11. CODE-AUDIT and CODE-DEGEN read exactly the declared arms (one shared label function) and their fast maps equal CODE-CORE's on sampled points, blocking; the role names map positionally onto that label order (RV-3).
        responsibility: correctness
      - claim: PO-12. NEW (RV-1). SR-6 clause (2) as revised cannot fire on a row that is a function of the exact quotient except on a set of mass f, at S at least 2^13, with per-seed probability above the analytic bound of the audit sheet (C-5, at most 2.77e-11), and does not fire on the near-exact controls (C-5, C-8).
        responsibility: correctness
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim:
    problem: ECDLP on ECC2K-130 by a filtered k-list decomposition oracle
    prior_best: >-
      Matched rho 2^60.8090 with negation and the 131-fold Frobenius class
      (CORR-20260922-81aeab; KN-FIND-aa2efc as scoped by CORR-20260928-4cb669).
      The plain two-list join floor (C4) is 2^62.4833 group operations per
      relation in the full-group ambient (N = 4l) and 2^61.4833 in the
      target-subgroup ambient (N = l), above that reference in both.
    time_exponent: >-
      NO EXPONENT IS CLAIMED IN EITHER DIRECTION. The unconditional content,
      SUBJECT TO PO-1 AND TO THE PRIMARY SOURCE'S PRIMALITY STATEMENT FOR l,
      is a capacity certificate of 2 bits, which moves nothing. The ideal-tree
      totals are a CEILING conditional on a filter the certificate excludes
      exactly; at the exact capacity the k = 16 tree costs about 2^107.20 per
      attempt in the target-subgroup ambient and about 2^102.80 in the
      full-group ambient.
    memory_exponent: >-
      For the ceiling, k lists of L points at 17 bytes: about 2^33.89 bytes at
      k = 16 and 2^39.34 at k = 8 (conservative). For the measurement, at most
      2^21 pairs per stream and 2^21 counters per table (4 GB ceiling).
    hidden_cofactor: Sort and hash polylogarithmic factors and multiset symmetry, a few bits, disclosed; the ceiling is conditional, so the disclosure bears on a counterfactual.
    claim_kind: capacity_certificate_plus_control_measurement
    claim_kind_note: A declared departure from the template enum, carried; read it as "no complexity claim is made".

  heuristic_assumptions:
    - id: HEUR-B1
      short_name: uniform sums
      formal_statement: >-
        Carried unchanged. For lists L_1 and L_2 of distinct elements of
        E(F_2^131) drawn without structure, the number of ordered pairs in
        L_1 x L_2 whose sum lies in a fixed set of 262 targets is distributed
        as Binomial(|L_1| x |L_2|, 262 / 2^131) to first order, uniformly in
        |L_1| and |L_2| below 2^40. The mean is exact; the Binomial SHAPE is the
        heuristic content.
      random_model_justification: An occupancy count for independent uniform draws; the mean is exact by double counting, so the model is asked only for the shape of the fluctuation (carried).
      supporting_results:
        - ref: KN-FIND-007
          provenance: internal
          claim: Yield conservation fixes the mean of the pair-sum count exactly.
          verified_by: TASK-20260929-291567 (read); relayed here as the version-3 record states it
        - ref: classical balls-in-bins occupancy law
          provenance: recalled
          claim: A pointer, not support.
          verified_by: null
      validation_experiment_ids: [EXP-BINSTD-811a2e]
      validation_plan: >-
        COMMITTED AS CODE (CODE-HB1, carried byte-identical). SAMPLE: on
        CELL-K19, 200 independent pairs of lists of 2^8 distinct uniform points,
        262 distinct targets under the seed crc32 of "heurb1-targets:CELL-K19",
        DIRECT PAIR-SUM COUNTING. PREDICTED DISTRIBUTION: Binomial(2^16, 262 /
        N_E) at the verified order N_E (mean about 32.80 at the design-time
        523492). COMPARISON: chi-squared over NINE BINS FIXED NOW, edges 24, 27,
        30, 32, 34, 36, 39, 42, with 8 degrees of freedom and its 99th
        percentile computed in code. TAIL CHECK: the maximum count over the 200
        pairs, 1 - (1 - P(X >= max))^200. If a bin's expected count is below 5
        at the verified N_E the chi-squared is reported and not read. TRANSFER:
        none beyond the tested n.
      falsification_condition: >-
        The chi-squared statistic exceeds its 99th percentile at 8 degrees of
        freedom (when applicable), or the tail probability of the maximum count
        is below 0.01, with the instrument's gate passing. Either refutes
        HEUR-B1 on the tested cell and puts the (C4) floor's shape, not its
        mean, in question.
    - id: HEUR-B2
      short_name: decay transfer, on the stratified comparison, by role
      formal_statement: >-
        Carried from version 3, KEYED BY ROLE (RV-3). Let F be one of the twelve
        declared Koblitz roles (F1, F2@0, F2@mid, F2@end, F3@0, F3@mid, F3@end,
        F4, F5xF1, F5xF2@0, F5xF3@0, F5xF4). Its QUANTITY is the stratified
        clause L3 of EXP-BINSTD-811a2e: F's excess over the median of its own
        ten shuffles stratified by h4, at least 3 W of the exact-saturated null
        with the rank floor on 8 of 10 seeds. By construction marginal skew
        (kept by the shuffle) and exact components (kept by the strata and by
        the null) can neither satisfy nor violate it, which PC-6b, PC-6d, PC-17
        and PC-18 check.
        CONSEQUENT Q-held, TESTABLE AT TESTED N: (ladder) if L3 holds at no
        estimated valid (cell, M) of CELL-K13 and CELL-K19 for role F, it holds
        at none of CELL-K23 for role F; (fixed alphabet) if L3 holds for F at
        none of CELL-K13, CELL-K19 and CELL-K23 at M = 16, it does not hold for
        F on CELL-K41 at M = 16. Each test is defined only when every involved
        (cell, M) is estimated and valid. DEFINED FOR the twelve declared
        Koblitz roles; NOT DEFINED for the six ordinary roles (one ordinary
        cell, nothing held out). Because a role is the same object on every
        cell (the offsets @0, @mid, @end are defined relative to n and r),
        the held-out comparison compares like with like, which the version-3
        offset names did not guarantee.
        CONSEQUENT Q-131, NOT TESTABLE AT ANY TESTED N: at n = 131 and the
        alphabets L_k of the k-tree, F would show no stratified controlled
        excess at its resolving floor. Rule R-S would need about 2^50 pairs at
        M = L_32 = 2^21.5; the instrument cannot reach it, and that is stated
        rather than hidden.
        NO STATISTIC OF THIS HYPOTHESIS OR ITS EXPERIMENT IS MAPPED ONTO THE
        CEILING-MODEL THRESHOLD TABLE, and no below-rho reading may be derived
        from any raw-G, lift or excess figure. THIS IS A HEURISTIC OF TRANSFER,
        NEVER A BOUND, over about 108 bits of log2 l from the ladder and about
        90 from the fixed alphabet, and across the alphabet exponent; and it
        transfers only what lies above the NEG-path floors.
      random_model_justification: >-
        Carried, with its limits. Square-root cancellation of character sums
        along the curve, as in KN-FIND-ffe1df's Theorem A-prime for x-based
        filters on prime-field curves, conditional on that line's H1-prime.
        TWO LIMITS, RECORDED: Theorem A-prime bounds the bucket-AVERAGED
        agreement, not G; and the repaired single-bucket bound reaches
        p^(o(1)) only for M at most p^(1/4). The N^(1/4) arm has at most a
        conditional justification by analogy; THE N^(1/3) ARM HAS NONE EVEN
        CONDITIONALLY. HEUR-B2 is the weakest link and is measured, not assumed.
      supporting_results:
        - ref: KN-FIND-ffe1df
          provenance: internal
          claim: Theorem A-prime (averaged agreement, conditional, prime field); the averaged-versus-maximum record; the M <= p^(1/4) reach; RT-EXP-1 on E(F_p) (prime order, no exact quotient).
          verified_by: relayed as the version-3 record states it (TASK-20260929-291567 and TASK-20260929-7d8385 read it); this producer read the finding file within its read_scope
        - ref: square-root cancellation of character sums on a curve of genus 1
          provenance: recalled
          claim: RECALLED, NOT RETRIEVED. A pointer only; no binary-field instance is claimed.
          verified_by: null
      validation_experiment_ids: [EXP-BINSTD-811a2e]
      validation_plan: >-
        SAMPLE: the three-cell ladder CELL-K13, CELL-K19, CELL-K23 at N^(1/3)
        and N^(1/4), and M = 16 on CELL-K13, CELL-K19, CELL-K23 and CELL-K41,
        per declared Koblitz role, ten seeds. PREDICTED DISTRIBUTION: the role's
        own ten stratified shuffles per seed and the exact-saturated null of
        the same (cell, M) (500 draws) are the prediction; no closed form.
        COMPARISON: L3 per (cell, M); the two held-out tests of Q-held, computed
        by CODE-FAM heur_b2_held_out keyed by role; L2's ten per-seed slopes
        and its interval reported per role. TAIL CHECK: the largest single-seed
        excess against the largest stratified shuffle; the count of seeds at the
        rank floor. FLOOR: every held-out reading carries the C-6 NEG-path floor
        of its (cell, M). TRANSFER: as in the formal statement.
      falsification_condition: >-
        Q-held is falsified on the tested range for a role when a defined
        held-out test has its premise true and its consequent false (L3 on a
        held-out cell after none on the fitting cells). The PREMISE of any
        transfer fails when a role meets the LEAD threshold of SR-4 in full,
        which is routed to review-breakthrough at max and independent
        replication before interpretation. Q-131 cannot be falsified by this
        instrument (stated). A role classified ART-RES or ART-DEF does not meet
        the premise, and HEUR-B2 asserts nothing for it.

