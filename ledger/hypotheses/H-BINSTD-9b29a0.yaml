      filter the certificate excludes, on the per-orbit unit NO APPROVED
      CONTRACT HAS FIXED (CORR-20260925-649e25), and on a trade class
      KN-FIND-47da4e declines to price, that record not being a promoted
      finding. The without-orbit line is the unconditional one of the pair,
      under the first condition.
    - >-
      NEG-PATH FLOOR (RV-4). A NEG reading means a role's stratified
      controlled excess lies below 3 W of the exact-saturated null at the
      declared S on enough seeds that L3 fails, never that G = 1. The floor
      reported beside it is the design-time NEG-path floor of audit sheet C-6
      for that (cell, M): for the exact-free planted mixture XF the smallest
      resolved rho is 0.7 (K13 M = 16), 0.8 (K13 M = 8), 0.5 (K19 M = 64), 0.7
      (K19 M = 16), 0.5 (K23 M = 128), 0.6 (K23 M = 32), 0.7 (K23 M = 16), 0.7
      (K41 M = 16), 0.5 (O19 M = 64), 0.7 (O19 M = 16); for the exact-carrying
      XC it is 0.9, none, 0.6, 0.9, 0.5, 0.7, 0.9, 0.8, 0.5, 0.7 in the same
      order. These floors are measured for mixtures of the log-interval key on
      permitted groups of the same shape and transferred to the declared group
      by shape; an arm whose excess has another form may be resolved at a
      different strength. The version-3 Z/l floor is a reference and an
      underestimate of the NEG-path floor, and the version-2 smallest-G design
      figures stay withdrawn.
    - >-
      LEAD REACH, SCOPED WITH RATES (RV-5). The controls show LEAD reachable
      for the key on Z/l with growing (PC-16) and flat (PC-16b; 20 of 20 design
      replicates, an L2 false-fail bound of 0.0031) standardised excess, and on
      the curve path for an exact-free and an exact-carrying planted filter at
      full strength (PC-16d; LEAD for both in the design dry call, false-fail
      margin bound 0.0068). A planted decay rho = 1, 0.7, 0.4 is not LEAD (0
      of 20 replicates); a slower decay rho = 1, 0.9, 0.8 read LEAD in 1 of 20
      design replicates, so L2 does not reliably separate a decay that slow.
      For an exact-free role L1 needs a stratified excess of about 3 W plus the
      measured offset of 4.40, 3.41 and 2.34 W at the three lead keys (about
      7.4, 6.4 and 5.3 W in all); nothing is shown below that effective LEAD
      floor.
    - Levels above 1 are not measured. Target-dependent filters are out of the family. The declared role list is incomplete by construction.
    - >-
      DEGENERATE ROWS. CELL-K13 F5xF4 at M = 8, CELL-K23 F5xF4 at M = 16 and
      CELL-K41 F5xF4 at M = 16 are within one percent of an h4 function (C-4);
      they are read and classified, exempt from SR-6's image clause by name,
      and a NEG on them is uninformative beyond the exact component.
    - Toy tier. Ladder at n at most 23, fixed alphabet to n = 41. A NEG at these n is not a NEG at n = 131; the transfer is HEUR-B2, a heuristic and never a bound, testable only on held-out tested cells.
    - The primality of l is the primary source's statement; the certificate's divisor set of 4l rests on it, and CODE-CERT's guard for l is a probable-prime test (RV-10).
    - This hypothesis asserts nothing about any curve's security, about whether index calculus beats rho on any curve, about any oracle meeting any budget, or about the AUXIN, FROB or QSP work of this program. It uses no D1, D2 or D3 quantity.
    - FORWARD GUIDANCE regardless of outcome (carried). The k-list objects NOT priced here are filters that read the discrete logarithm (closed by definition), target-dependent filters, and algebraic joins that are not rectangle covers (the chained Semaev system, the SEMBIN questions').

