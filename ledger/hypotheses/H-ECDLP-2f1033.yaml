    corollaries: []
  predictions:
    - metric: relation_yield_ratio_R_H_max_over_H
      direction: lower
      minimum_effect: "< 1 at every (c, d, curve); decreasing in H"
    - metric: covering_exponent_gamma_cyclotomic_minus_random_field
      direction: different
      minimum_effect: "|difference| <= 0.2 at every d"
    - metric: rank_gain_E_K_minus_E_Q_cyclotomic_minus_random_field
      direction: different
      minimum_effect: within sampling error of 0
    - metric: complete_splitting_verified_cells
      direction: higher
      minimum_effect: 100 % of cyclotomic cells (instrument)
  test_boundary:
    instances:
      - "p = 2^c - 1 for c in {13, 17, 19, 31}; subfields K of Q(zeta_c) of degree d | c - 1, d <= 12"
      - "7 rank-0 curves E/Q (y^2 = x^3 - x, x^3 - 4x, x^3 - 9x, x^3 + 1, x^3 - 1, Cremona 11a1 and 14a1; conductors <= 288) with good reduction at every p; rank 0 re-verified by PARI/GP ellrank over Q when gp is present (CTRL-RANK0)"
      - "controls per (p, d): three cyclic degree-d subfields of Q(zeta_m), m prime, m != c, in which p splits completely (abelian controls), and two random completely split small-coefficient fields where the seeded search finds them (d <= 4 in practice)"
    parameters:
      claim_tier: toy
      work_ladder: "W in {300, 1000, 3000, 10000, 30000, 100000} candidates x = a(t)/e tried, a in sup-norm shells on the power basis, e <= 4"
      rank_method: "no 2-descent over K (PARI/GP ellrank is over Q only); new K-points proven non-torsion by reduction are counted, a lower bound on the rank gain only if independent, which is not certified; ellrank over Q verifies rank 0 of each E/Q"
    implementation: >-
      IMPLEMENTED in the design session in Rust: experiments/EXP-ECDLP-84af7b/
      implementation/ (nfield library: Gaussian-period polynomials of
      Q(zeta_m), Q[t]/(g) arithmetic on exact rationals, exact discriminant,
      roots and factorisation mod q, complete-splitting check, exact square
      root by finite-field Tonelli-Shanks, CRT, ring Hensel lift and rational
      reconstruction, sup-norm-shell point search sieved at 8 degree-one
      auxiliary primes, residues at the degree-one primes above p, torsion
      bound and the trace relation; g1 binary). libpari 2.15 is linked
      through an FFI shim behind the `pari` feature and used only as a
      cross-check (ellrank over Q for CTRL-RANK0, nfdisc for CTRL-DISC); the
      run proceeds without it. Smoke-tested at c = 13, d <= 4, W <= 10000 (91
      cells, no trace-relation failure, byte-identical replay, deterministic
      cells equal to the earlier Python prototype). See the EXP-ECDLP-84af7b
      launcher.
    budget:
      enforcement: advisory
      total_cpu_hours: 60
      maximum_memory_gb: 4
  falsification_conditions:
    - "HEUR-001 (alive condition): R(H) >= 1 on a cyclotomic arm with the random-field control below 1, reproduced at >= 2 primes."
    - "HEUR-001 (alive condition): gamma on the cyclotomic arm exceeds the random-field null by > 0.2 across >= 3 primes."
    - "A cell whose field does not split p completely, or whose curve has E(Q) infinite, is invalid, not evidence."
    - "A positive signal at a single toy prime is a finite control until reproduced across c (claim boundary)."
  interpretation_limits:
    - Toy primes and conductors only; nothing is extrapolated.
    - "A null result supports the hypothesis in the exact tested scope and closes nothing (AGENTS.md rules 5 and 6)."
    - "Residue coincidences inflate R(H) without information; they are counted and reported separately."
    - No statement about any deployed parameter set is made or implied.
