# =============================================================================
# H-ECDLP-2f1033 -- SNFS-G1 specified: lifting E to a subfield K of Q(zeta_c)
# in which the Mersenne prime p = 2^c - 1 splits completely gives, per
# K-point, [K:Q] residues in E(F_p) and one free Galois trace relation among
# them; the canonical-height obstruction keeps the relation yield ratio below
# one and the covering exponent at the random-field value. The honest
# analogue of the Cunningham-project SNFS (which worked in Z[zeta_c]).
# Derived from IDEA-20261009-57140c (addendum G). Status proposed with
# specified_by; nothing here asserts an outcome. Toy primes only. The
# contract EXP-ECDLP-84af7b is implemented in Rust (nfield library + g1 binary,
# optional libpari FFI for cross-checks)
# (number-field arithmetic, complete-splitting check, exact square roots,
# bounded point search, residues and the trace relation); 2-descent over K
# is not available, so the rank arm reports proven non-torsion new points,
# not rank.
# =============================================================================
hypothesis:
  id: H-ECDLP-2f1033
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  derived_from_idea: IDEA-20261009-57140c
  added: '2026-10-09'
  statement: >-
    Let p = 2^c - 1 be a Mersenne prime with c prime, so ord_p(2) = c, p = 1
    mod c, and p splits completely in Q(zeta_c) and in every subfield K of
    degree d | c - 1. Let E/Q have rank 0, good reduction at p, and let P_1,
    ..., P_d be the primes of K above p (each with residue field F_p). For a
    K-point P the residues r_i(P) = P mod P_i lie in E(F_p) and satisfy
    sum_i r_i(P) = Tr_{K/Q}(P) mod p, a torsion point, so each K-point of
    height <= H gives up to d factor-base residues and one linear relation
    among them. (Claim) For every tested (c, d) and curve, the relation yield
    ratio R(H) = #relations / #distinct residues from K-points of height <= H
    stays below 1 and decreases in H, the covering exponent gamma =
    dlog(#distinct residues)/dlog(enumeration work) does not exceed that of
    a random field of the same degree in which p splits completely by more
    than 0.2, and rank E(K) - rank E(Q) matches matched random fields. Alive
    only if R(H) >= 1 with the random-field control below 1, or gamma exceeds
    the null by > 0.2 across >= 3 primes.
  mechanism: >-
    The Cunningham SNFS exploited that 2^c - 1 = prod_{d | c} Phi_d(2) and
    that Z[zeta_c] maps onto Z/N: a ring of small-height elements with a
    homomorphism onto the target ring. For E(F_p) the only analogue of that
    ring is E(K) for a number field K, and the price is canonical height
    (face F4b of KN-TECH-06bb4e; H-ECDLP-bd1572 HEUR-003). What complete
    splitting adds is a Galois multiplier: one K-point reduces at d distinct
    degree-one primes, giving d residues and, through the trace, one free
    relation. Index calculus needs at least one relation per residue, so the
    multiplier helps only if residues of distinct K-points coincide often or
    small points are dense, both of which the height obstruction forbids.
    The measurement is whether R(H) and gamma on the cyclotomic arm differ
    from a random completely split field of the same degree; the prediction
    is that they do not.
  assumptions:
    - "E(Q) finite (rank 0 from small-conductor tables) so that Tr(P) is torsion and the trace relation is free; a rank > 0 curve makes the relation depend on Tr(P), which the record then treats as an extra factor-base element."
    - "Complete splitting is verified per (p, K) by factoring p in O_K; a field in which p does not split completely is an invalid cell, not evidence."
    - "Descent or bounded point search over degree <= 12 fields is feasible at toy conductor in PARI/GP or Magma; the Q(c^{1/d}) degree ladder of EXP-ECDLP-3e8403 is the sibling null."
    - "Residue coincidences (r_i(P) = r_j(P) or residues shared between K-points) are counted, since they raise R(H) without new information."
  proof_search_map:
    bottleneck: >-
      one relation per residue: each small K-point yields d residues and one
      trace relation, so relations / residues ~ 1/d unless residues coincide
      or small points are dense; the canonical height forbids density.
    baseline_embedding:
      parameter_slice: >-
        d = 1 is the Q-lift arm of EXP-ECDLP-3e8403 (coverage only, no
        relation); SNFS-F1 (IDEA-20261009-4b1724) is the Q(c^{1/d}) arm.
      reproduction_check: >-
        the d = 1 cell must reproduce EXP-ECDLP-3e8403's covering numbers on
        the shared curves and boxes.
    observation_collision:
      observable: R(H) and gamma as functions of d
      distinct_preimage_search: >-
        random completely split fields of the same degree and similar
        discriminant, same curves: a gain present there is a degree effect,
        not a cyclotomic one.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: E over a subfield K of Q(zeta_c) in which p = 2^c - 1 splits completely, with the Galois trace as relation generator
        predicted_gain: none in exponent predicted; R(H) < 1 and gamma at the random-field value
    quantifier_order: >-
      For all tested (c, d) and curves, R(H) < 1 for every H reached and
      gamma(cyclotomic) - gamma(random) <= 0.2; there exists no (c, d) with
      R(H) >= 1 while the control stays below 1.
    method_ceiling:
      strongest_certifiable_claim: >-
        a yield-ratio and covering-exponent table at four toy Mersenne
        primes and degrees <= 12; no asymptotic statement.
      nearby_object_control: random completely split fields; rank-0 curves so the trace is torsion
    proof_obligations:
      - claim: trace relations verified in E(F_p) by exact arithmetic on every K-point found
        responsibility: correctness
      - claim: complete splitting verified per (p, K)
        responsibility: scope
      - claim: enumeration work counted (points tried), not only points found
        responsibility: runtime
      - claim: R(H) and gamma computed identically on both arms
        responsibility: baseline
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        For E/Q of rank 0 and K a completely split subfield of Q(zeta_c) of
        degree d, the number of K-points of canonical height <= H is
        c_K * H^{r_K/2} with r_K = rank E(K) distributed as for a random
        field of the same degree and discriminant, and the residues of
        distinct points at the d primes above p are distributed as d
        independent uniform points of E(F_p); hence R(H) <= (1 + o(1))/d
        and gamma equals the random-field value.
      random_model_justification: >-
        Canonical heights are positive definite on E(K)/tors (KN-LIT-7621,
        KN-TECH-060); the count of points of bounded height is governed by
        rank and regulator, not by the Galois structure of K; reduction at
        distinct primes above p is independent in the absence of a
        structural coincidence (HEUR-002 of H-ECDLP-bd1572).
      supporting_results:
        - KN-LIT-6935a1 (four faces of lifting; global nontorsion face blocked by canonical height)
        - KN-LIT-021 (xedni fails asymptotically; lifted points have large height)
        - H-ECDLP-bd1572 HEUR-003 and EXP-ECDLP-3e8403 (bounded-box covering on Q(c^{1/d}))
      validation_experiment_ids: [EXP-ECDLP-84af7b]
      falsification_condition: >-
        R(H) >= 1 at some H on a cyclotomic arm with the random-field
        control below 1, reproduced at >= 2 primes; or gamma on the
        cyclotomic arm exceeding the random-field null by > 0.2 across >= 3
        primes with splitting verified and trace relations exact.
