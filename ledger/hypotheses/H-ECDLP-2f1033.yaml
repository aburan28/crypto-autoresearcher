      provenance: kb
      verified_by: knowledge/literature/KN-LIT-021.md
      role: the Q-side negative this record extends to cyclotomic fields
    - description: Formal group, reduction and canonical heights (textbook).
      citation: KN-LIT-7621
      provenance: kb
      verified_by: knowledge/literature/KN-LIT-7621.md
      role: height formalism and reduction at primes of K
    - description: Lifting-obstruction taxonomy (face F4b).
      citation: KN-TECH-06bb4e
      provenance: internal
      verified_by: knowledge/techniques/KN-TECH-06bb4e.md
      role: the cell this hypothesis occupies
    - description: Kilobit SNFS factorization of 2^1039 - 1 (the Cunningham-project sieve this record mirrors).
      citation: KN-LIT-2090
      provenance: kb
      verified_by: knowledge/literature/KN-LIT-2090.md
      role: the special structure (Z[zeta_c] -> Z/N) whose curve analogue is tested
    - description: Splitting of p in Q(zeta_c) and its subfields.
      citation: Washington, Introduction to Cyclotomic Fields, ch. 2
      provenance: recalled
      verified_by: null
      role: pointer; the splitting is verified computationally per cell, never assumed
    - description: Rank growth in towers of number fields (control theorem).
      citation: Mazur 1972, Rational points of abelian varieties with values in towers of number fields
      provenance: recalled
      verified_by: null
      role: pointer for the rank-gain arm; never support
