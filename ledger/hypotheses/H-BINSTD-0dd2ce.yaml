  id: H-BINSTD-0dd2ce
  question_id: RQ-BINSTD-b6f698
  goal_id: GOAL-ECDLP2M-001
  batch_id: BATCH-2e63c3
  unit: U-HOLDH
  source_ideas:
    lead: IDEA-20260922-d11575
    consolidated: [IDEA-20260922-0e3641]
  supersedes: null
  supersedes_note: >-
    First hypothesis of this unit (DEC-20261002-21a63d R-FORM). No supersedes
    field applies; neither proposal is edited.
  experiment_ids: [EXP-BINSTD-f442a9]
  status: review_required
  status_note: >-
    The producer card (TASK-20261002-9f9ce5 objective) sets status
    review_required on both records. In the hypothesis lifecycle of AGENTS.md
    this record is a specified hypothesis awaiting the approval decision; the
    session's validate_ledger run decides whether the literal value is
