  approved_by: null
  proposed_by: coordinator (TASK-20261002-9f9ce5, design producer)
  recorded_at: '2026-10-02'

  statement: >-
    Setting. E is one of c2pnb176v1, c2pnb208w1, c2pnb272w1, c2pnb304w1 and
    c2pnb368w1, so A and B lie in F_(2^16), the smallest subfield containing B
    is F_(2^16), N = 16k with k in {11, 13, 17, 19, 23} prime, #E(K) = h l over
    K = F_(2^N) with l prime, l > h and h = #E(F_(2^16)) (audit facts, re-derived
    as design figures by stage0_census). For a divisor c of N the GHS base field
    is F_q, q = 2^c, n = N/c, and sigma is the 2^c-power Frobenius. The hypothesis
    has three parts, each scoped to the tested construction.
    (C1') COLLAPSE, CONDITIONAL ON OPEN OBLIGATION OB-1. For every c dividing 16,
    on every cell where the GHS construction yields a map phi from E(K) to
    J_C(F_q) whose cover function field carries an extension sigma' of sigma of
    order n acting by index shift (OB-1), phi sends the order-l subgroup to zero.
    The 25 cells c in {1, 2, 4, 8, 16} of the five rows are therefore
    STRUCTURALLY EMPTY conditional on OB-1, with a computed certificate (the
    conjugate period p = 16/c, the definition field F_(2^16) and gcd(l, h) = 1).
    (C1') is decomposed into lemmas L1 to L6; it carries no heuristic.
    (C2') LEVEL PINNING (no heuristic). For c = jk with j dividing 8 there is no
    collapse (p = n = 16/j), and n/2 + 1 <= m <= n, so the genus candidates
    2^(m-1) and 2^(m-1) - 1 lie in [2^(n/2) - 1, 2^(n-1)]; m depends on c only
    through gcd(c, 16) (lemma M5, which replaces the consolidated proposal's
    heuristic H-0e3641-1). MMT Table 3 is the baseline fixture for the twenty
    open cells.
    (C3') CHARGED COST, CONDITIONAL ON H-DL-1 AND H-DL-2. On the open lanes
    whose regime ratio g / log2 q is at most 1 (the n = 2 and n = 4 lanes), the
    charged cost of hyperelliptic index calculus under machine model MM-1 of
    EXP-BINSTD-f442a9 (relation collection, sparse linear algebra, descent,
    target map, memory, full cost against parallel rho priced in the same
    model) is a function of (q, g, l) and the H-DL-2 constant kappa only, and
    the two numbered heuristics hold at toy scale within the pre-registered
    tolerances. The n = 8 and n = 16 lanes are OPEN (no cost law at read
    provenance for their regime). (C3') makes no prediction of the sign of any
    comparison with matched rho on any deployed row.

  mechanism: >-
    The trace factorisation. Fix c dividing 16 and write p = 16/c, so n = p k.
    In the GHS function field F' = K(x)(y_0, ..., y_(n-1)) with y_i =
    sigma'^i(y_0), each y_i is a root of an Artin-Schreier polynomial T^2 + T =
    sigma^i(R) over K(x), where R is the right-hand side built from A and B.
    Because sigma^p fixes A, B and x, y_p and y_0 are roots of the same
    Artin-Schreier polynomial, so y_p + y_0 = epsilon lies in F_2; applying
    sigma'^i shows epsilon does not depend on i; summing k steps gives y_(kp) =
    y_0 + k epsilon, and y_(kp) = y_n = y_0 because sigma'^n = id (OB-1); k is
    odd, so epsilon = 0 and sigma'^p fixes every y_i. The conorm along the j-th
    conjugate map therefore depends only on j mod p, and the Galois sum defining
    phi groups by residue class mod p into sum_j Con_j(sigma^j(Tr P)), with
    Tr P = sum over r < k of pi^r(P) and pi = sigma^p the F_(2^16)-Frobenius on
    points. Tr P lies in E(F_(2^16)), whose order h is prime to l, so Tr kills
    the l-part (equivalently, pi acts on E(K)[l] by lambda with lambda^k = 1 and
    lambda != 1). On an open cell c = jk the same argument has p = n and k' = n/p
    = 1, the "trace" is the identity and its hypothesis l coprime to
    #E(F_q(A, B)) = #E(K) fails, so the argument cannot be applied (PTM-B).
    The level pinning is MMT's Corollary 14 (retrieved) applied with the audited
    bit B not in F_(2^8). The charged cost is the contract's own model MM-1, made
    conditional on two numbered heuristics that the experiment tests at toy
    scale.

  assumptions:
    - >-
      AS-1. The five rows' parameters are those OpenSSL emits (secondary
      source; analysis/binstd-curve-audit/, re-dumped by C-8 and diffed by
      stage0_census). The primary standard ANSI X9.62 was not read
      (impediment K-IMP-ANSI); the reading note's CHECK-1 and CHECK-2 report
      agreement of the cofactors and prime bit lengths with MMT Table 2.
    - >-
      AS-2. h = #E(F_(2^16)) is certified by the Weil recursion (stage0_census
      scans every trace in the Hasse interval and requires exactly one to
      reproduce h l); l is a probable prime (Miller-Rabin, 24 fixed bases).
    - >-
      AS-3. The GHS construction is the one of MMT Theorem 1 (retrieved, read
      extent pages 1-19 and 22-24): genus 2^(m-1) or 2^(m-1) - 1 under
      condition (7). Its internal function-field structure (index-shift action
      of sigma' of order n, phi = norm of conorm) is OB-1, not an assumption the
      record may keep.
    - >-
      AS-4. Deployed parameters are arithmetic-only targets. No attack is run at
      N of 131 or more. Executable cells are toy subfield curves; the
      collapse-verification arm stays at d k' <= 41 and the heuristic arms at
      d k' <= 52 (EXP-BINSTD-f442a9 scale_relevance).

  # ---------------------------------------------------------------------------
  lemma_decomposition:
    note: >-
      Promotion gate 1 form. Each lemma has one responsibility; the two main
      statements are pure assemblies. Full proofs are in the audit sheet
      (lemma_decomposition), which is the record of the derivation.
    c1_prime:
      - id: L1
        responsibility: correctness
        statement: >-
          Conjugate period. sigma^i fixes (A, B) iff (d_AB / gcd(c, d_AB)) divides
          i, where F_(2^(d_AB)) is the smallest field containing A and B; for the
          five rows d_AB = 16, so for c dividing 16 the period is p = 16/c and
          n/p = k.
      - id: L2
        responsibility: correctness
        statement: >-
          Artin-Schreier index lemma. Under OB-1 (y_i = sigma'^i(y_0),
          sigma'^n = id), if sigma^p fixes the Artin-Schreier right-hand side
          then sigma'^p fixes every y_i when n/p is odd. Proof by the root
          difference epsilon in F_2, its independence of i, and k epsilon = 0
          with k odd.
      - id: L3
        responsibility: correctness
        statement: >-
          Grouping of the Galois sum. Under L2, phi(P) = sum over j < p of
          Con_j(sigma^j(Tr P)) with Tr P = sum over r < k of pi^r(P), pi the
          F_(2^16)-Frobenius endomorphism. This is d11575 proof obligation [1].
      - id: L4
        responsibility: correctness
        statement: >-
          Annihilation. Tr maps E(K) into E(F_(2^16)); on E(K)[l] it is zero
          because gcd(l, h) = 1. Equivalent form: pi acts on E(K)[l] by lambda
          with lambda^k = 1, lambda != 1, and sum of lambda^r over r < k is 0.
      - id: L5
        responsibility: interface
        statement: >-
          The GHS map phi of MMT Theorem 1 (and, where (7) fails, of Lemma 6)
          is Norm composed with Conorm on a cover whose function field has the
          index-shift structure of OB-1. This is where the Hess dependence
          lives; it is carried as open obligation OB-1, never assumed.
      - id: L6
        responsibility: scope
        statement: >-
          Inapplicability on open cells. For c = jk, p = n, F_q(A, B) = K and l
          divides #E(K), so L4's hypothesis fails and the argument concludes
          nothing (the PTM-B failure signature).
      - id: MAIN-C1
        responsibility: assembly
        statement: >-
          (C1') = L1 + L2 + L3 + L4 under L5 (OB-1). The cell certificate is
          (p, d_AB, gcd(l, h) = 1), computed by stage0_census.
    c2_prime:
      - id: M1
        responsibility: correctness
        statement: >-
          Conventions coincide. For n a power of 2, m(b) of MMT definition (6)
          equals the Artin-Schreier level of b and of b^(1/2) (MMT Theorem 5(i),
          retrieved; reading note CHECK-4). stage0_census computes all three.
      - id: M2
        responsibility: size
        statement: >-
          Lower bound. If m <= n/2 on a cell c = jk then B lies in F_(2^8),
          contrary to the audited bit (MMT Corollary 14 and Remark 24, retrieved;
          reading note CHECK-5). Hence m >= n/2 + 1.
      - id: M3
        responsibility: size
        statement: Upper bound m <= n (dimension of a span of n vectors).
      - id: M4
        responsibility: correctness
        statement: >-
          General period formula (IDEA-20260922-0e3641 (A)). For E over F_(2^d)
          and any divisor c of d k', n(c) = d / gcd(c, d).
      - id: M5
        responsibility: correctness
        statement: >-
          The magic number depends on c only through gcd(c, d) (replaces
          H-0e3641-1). For i over 0..n-1, c i mod d runs over all multiples of
          gcd(c, d), so the vector set {(1, sigma_c^i(b)^(1/2))} of definition
          (6) is the same set for every c with the same gcd(c, d), and its span
          dimension m is the same.
      - id: M6
        responsibility: scope
        statement: >-
          Divisor count (IDEA-20260922-0e3641 (B)). tau(16 k') = 5 tau(k') >= 10
          with equality iff k' is prime. A count of candidate base fields, not a
          cost.
      - id: MAIN-C2
        responsibility: assembly
        statement: >-
          (C2') = M1 + M2 + M3 + M5 with MMT Theorem 1 (retrieved) where
          condition (7) holds on the cell (computed per cell by stage0_census);
          the genus branch is resolved at source to 2^(m-1) for m < 13 (MMT p.16)
          and open for the n = 16 lane.

  open_obligations:
    - id: OB-1
      kind: interface (the Hess obligation, DC-H1)
      statement: >-
        On every cell where the GHS construction yields phi from E(K) to
        J_C(F_q), the cover function field is generated over K(x) by y_0, ...,
        y_(n-1) with y_i = sigma'^i(y_0) for an extension sigma' of sigma with
        sigma'^n = id, and phi(P) = sum over i < n of sigma'^i(Con P).
      status: OPEN
      why_open: >-
        Hess 2003 and 2004 were not read at source (IMP-3 of the reading note;
        no PDF-capable source was reachable in this session's read scope). GHS
        2002 (KN-LIT-007) carries citation_verified false and is a recalled
        pointer here. MMT Theorem 1 is retrieved but its read extent states
        the conclusion (existence of phi, genus) and not the function-field
        structure.
      source_conclusion: >-
        MMT Remark 21 (retrieved; attributed to Hess, personal communication)
        states that for a subfield curve the order-r subgroup maps to the zero
        divisor, and MMT Remark 23 (retrieved) reports a computed descent for
        E176 and E272 at l = 2 in which the order-r subgroup lies in the kernel.
        These are the source's statements and are cited as such; they are not
        this record's proof.
      where_it_could_break: >-
        If on some cell sigma' exists only with sigma'^n != id (for example a
        construction valid under (9) but not (7) with sigma'^(2n) = id), L2
        gives epsilon = 1, the inner sum becomes the alternating sum of
        (-lambda)^r, which is (1 + lambda^k)/(1 + lambda) = 2/(1 + lambda) and
        not zero in general, and (C1') would fail there. The cells where (7)
        fails are named by the census (OB-2).
      dependent_statements: >-
        Every STRUCTURALLY_EMPTY verdict of EXP-BINSTD-f442a9 carries the suffix
        _COND_OB1; (C1') is stated conditional on OB-1; ARM-C1 is a toy-scale
        check of the conclusion, not a proof of OB-1.
      clears_when: >-
        A session with a PDF text extractor reads Hess's non-kernel theorem and
        GHS 2002's construction at source and records the hypotheses (IMP-3
        recheck: pdftotext on
        https://www.iacr.org/archive/eurocrypt2003/26560374/26560374.pdf).
    - id: OB-2
      kind: construction precondition
      statement: >-
        On collapsed cells with n even and m != n, condition (7) needs
        Tr_(K/F_2)(A) = 0. MMT Remark 25 names E176, E272 and E304 with Tr(a) = 1
        and says the weaker condition (9) of Lemma 6 holds; the exponent e in (9)
        is not defined within the read extent, so (9) is not evaluable here.
      status: OPEN
      dependent_statements: >-
        On those cells the existence of phi rests on (9) (source statement), and
        L2 needs OB-1 in a form valid under (9). The verdict stays
        STRUCTURALLY_EMPTY_COND_OB1 (either no map under (7) or, if the map
        exists, zero image under OB-1). No cost row depends on OB-2.
    - id: OB-3
      kind: genus branch
      statement: >-
        The 2^(m-1) against 2^(m-1) - 1 branch on the five n = 16 cells is left
        open by the source. No cost row is computed on those cells (regime ratio
        above 1), so no figure depends on it.
      status: OPEN
    - id: OB-4
      kind: source extent (DC-H5)
      statement: >-
        MMT pages 20-21 and 25-42 and the LMS JCM journal version were not read
        (IMP-2). No cell verdict of this record depends on them: per-cell m on the
        class-A cells is computed by stage0_census, not taken from Appendix A.
        Any statement a reviewer finds to depend on them is marked dependent and
        unavailable.
      status: OPEN (impediment, not a defect; K-impediment)
    - id: OB-5
      kind: primary standard
      statement: >-
        ANSI X9.62 itself was not read (K-IMP-ANSI). Parameters are OpenSSL's
        named-curve tables, diffed between the committed audit dump and the
        session's C-8 dump.
      status: OPEN (impediment)

  # ---------------------------------------------------------------------------
  proof_search_map:
    bottleneck: >-
      The genus of the cover obtainable over each admissible base field and,
      for the collapsed half, whether the order-l subgroup survives the map at
      all. Downstream cost is a function of (q, g, l) and the H-DL-2 constant.
    baseline_embedding:
      parameter_slice: >-
        c = 16 (n = k): period 1, m = 1, g = 1, the cover is E itself; the
        Koblitz-shaped curve y^2 + xy = x^3 + 1 over F_(2^176), m = 1 in every
        lane; and MMT Table 3 on all twenty open cells.
      reproduction_check: >-
        Frozen regression fixture: stage0_census (audit sheet code block, sha256
        pinned) reproduces MMT Table 3 m on all twenty open cells, including the
        four cells with m != n, prints the per-cell diff, and returns m = 1 on
        the c = 16 cells and on every Koblitz lane. ARM-S0 of EXP-BINSTD-f442a9
        requires a byte-identical rerun.
    observation_collision:
      observable: >-
        The integer m per (row, base field) together with the conjugate period
        p and the definition field F_q(A, B).
      distinct_preimage_search: >-
        Small m has two preimages: collapse (p < n; F_q(A, B) a proper subfield
        of K; the map kills the l-part) and low level without collapse (p = n;
        m < n). The census reports p, the definition-field degree and m in every
        cell, so the two are separated by computation. A third preimage, p = n
        with m <= n/2, would contradict M2 and is reported by the census, not
        explained.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The GHS covers over F_(2^c) for every divisor c, enumerated per row
        predicted_gain: >-
          None on the collapsed half (zero image, by (C1')); on the n = 2 and
          n = 4 lanes, a charged cost row conditional on H-DL-1 and H-DL-2, with
          no stated direction against matched rho.
      - transform: observable_fiber
        proposed_object: The conorm-norm image of the l-part on a collapsed toy lane
        predicted_gain: >-
          A zero image (negative control CONSISTENT) beside a non-zero image on
          the open toy lane of the same cell (positive control).
    quantifier_order: >-
      FOR ALL five rows AND FOR ALL ten divisors c of N, THERE EXISTS a cell
      verdict in the declared trichotomy, computed from the frozen census and
      the cost arm. (C1'): FOR ALL c dividing 16 and FOR ALL P in E(K)[l],
      phi(P) = 0, conditional on OB-1; its refuting witness is THERE EXISTS a
      toy collapsed lane and a point of order l' with phi(P) != 0, under a
      passing positive control on the same cell. H-DL-1 and H-DL-2 quantify over
      (q, g) in the toy range and are transferred to deployed q only under the
      numbered transfer assumptions TA-1 to TA-3.
    method_ceiling:
      strongest_certifiable_claim: >-
        The 5 x 10 table of (period, definition field, m in three conventions,
        genus candidates, condition (7), cell verdict) re-derived from published
        coefficients; the collapse verdict conditional on OB-1 on 25 cells;
        conditional charged cost rows on 10 cells; OPEN on 10 cells with the
        missing quantity named. No statement that any curve is broken, weakened
        or safe.
      nearby_object_control: >-
        PTM-A prime-degree rows c2tnb191v1 and c2tnb239v1 (lattice {1, N}, one
        hopeless lane, no cost row); the Koblitz-shaped fixture over F_(2^176)
        (m = 1 everywhere); a B in F_(2^8) fixture (m <= n/2 in the four
        open-shaped lanes); a uniform-B null over F_(2^176) (m = n with a stated
        probability per lane); on toy cells, the open lane of the same cell as
        the positive control of the collapse verification.
    proof_obligations:
      - claim: OB-1 (the Hess and GHS-structure interface), carried open with dependent statements marked.
        responsibility: interface
      - claim: L2 as stated (Artin-Schreier index lemma), proved in the audit sheet conditional on OB-1.
        responsibility: correctness
      - claim: The census reproduces MMT Table 3 on all twenty open cells.
        responsibility: baseline
      - claim: Condition (7) computed per cell; the genus formula is not applied where (7) fails (OB-2).
        responsibility: correctness
      - claim: The transfer from toy q to deployed q is stated as TA-1 to TA-3 and never assumed silently.
        responsibility: scope
    not_applicable_reason: null

  # ---------------------------------------------------------------------------
  heuristic_assumptions:
    - id: H-DL-0
      formal_statement: >-
        NONE FOR (C1') OR (C2'). (C1') is conditional on the open obligation
        OB-1, which is a mathematical statement about a construction and not a
        heuristic; (C2') is unconditional given the audit facts and the retrieved
        MMT statements. Recorded so the conditionality of (C3') is not smeared
        onto them.
      random_model_justification: not applicable
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: not applicable
    - id: H-DL-1
      formal_statement: >-
        SPLIT DENSITY. Let C be a GHS cover of genus g = 8 over F_q of a toy
        subfield cell's OPEN_N4 lane, P and Q points of prime order l' in E(K),
        and D = [a] phi(P) + [b] phi(Q) with a, b uniform modulo l'. The
        probability p_split that the Mumford polynomial u of D splits into
        linear factors over F_q satisfies |log2(p_split g!)| <= 0.5 for
        2^10 <= q <= 2^13, and the number of distinct roots of u in F_q follows
        the fixed-point law of a uniform random permutation of g letters within
        total variation 0.02, with the 2-smooth fraction within 0.5 bit of
        I_g / g! (I_g the number of involutions).
      random_model_justification: >-
        The number of monic degree-g polynomials over F_q that split completely
        is the number of multisets of g roots, C(q + g - 1, g), so the fraction is
        (1 + O(g^2/q)) / g!; a reduced divisor of degree g with all points
        rational corresponds to such a polynomial with two point choices per
        root, and #J_C(F_q) is q^g up to a factor 1 + O(g / sqrt q). The
        heuristic is that the attack's samples, which live in the image of a
        cyclic group of order l' on a special cover, behave like uniform
        elements of J_C(F_q) for this statistic.
      supporting_results:
        - >-
          Elementary count of totally split monic polynomials, C(q + g - 1, g)
          (internal derivation, audit sheet numbered_heuristics).
        - >-
          Fixed-point law of uniform random permutations (internal derivation:
          inclusion-exclusion, P(J = j) = (1/j!) sum over i <= g - j of
          (-1)^i / i!).
        - >-
          Pointer only, supports nothing: Panario, Gourdon and Flajolet on the
          smallest-degree factor distribution of random polynomials (recalled).
      validation_experiment_ids: [EXP-BINSTD-f442a9]
      validation_arm: ARM-H1 of EXP-BINSTD-f442a9 (decision rule DR-H1 with tail check DR-H1-TAIL)
      falsification_condition: >-
        DR-H1 returns FALSIFIED on any admitted lane: the 99 percent Wilson
        interval of log2(p_split g!) lies entirely outside [-1, 1], while the
        same statistic on the null hyperelliptic curve of the same (q, g) lies
        inside [-1, 1] (otherwise the row is INVALID_NULL, not a refutation).
    - id: H-DL-2
      formal_statement: >-
        COMPLEXITY LAW. For g = 8 and q = 2^c with 10 <= c <= 92, the number of
        random-walk trials the double-large-prime relation collection needs to
        reach |F| + 10 independent relations, with a factor base F of the
        ceil(q^(7/8)) degree-one places of smallest x-coordinate, is
        kappa q^(2 - 2/g) with log2 kappa in [0, log2 g!] = [0, 15.30], kappa not
        depending on q. Polylogarithmic factors of the reported law are absorbed
        into kappa; that kappa is constant in q is part of the heuristic.
      random_model_justification: >-
        Under H-DL-1 a trial yields a relation with at most two large primes
        with probability about C(g, 2)(|F|/q)^(g - 2) / g!, and the cycle
        structure of the large-prime graph converts partial relations into full
        ones at a rate that balances relation collection against linear algebra
        at |F| = q^(1 - 1/g); the stated range runs from no constant to the full
        single-split penalty g!.
      supporting_results:
        - >-
          Pointer only, supports nothing: Gaudry, Thome, Theriault and Diem,
          double large prime variation (KN-LIT-92caf4, provenance kb, abstract
          level; the corpus entry says "standard statement; not re-extracted", so
          the exponent 2 - 2/g is treated as recalled).
      validation_experiment_ids: [EXP-BINSTD-f442a9]
      validation_arm: ARM-H2 of EXP-BINSTD-f442a9 (decision rule DR-H2)
      falsification_condition: >-
        DR-H2 returns FALSIFIED: the least-squares slope of log2 trials on log2 q
        over the three toy q differs from 1.75 by more than 0.5, or any measured
        log2 kappa lies below -2 or above log2 g! + 1, or any run hits the
        SR-3 cap of 2 g! q^(2 - 2/g) trials.
    - id: H-0e3641-1
      formal_statement: >-
        RETIRED AS A HEURISTIC. The consolidated proposal's "genus depends only
        on period" is proved for the magic number by lemma M5 (span identity).
        What remains outside M5 is stated, not assumed: condition (7)'s parity
        term depends on n = N/c and so can differ between two divisors with the
        same gcd(c, d), and the 2^(m-1) against 2^(m-1) - 1 branch is not
        determined by m alone.
      random_model_justification: not applicable (proved)
