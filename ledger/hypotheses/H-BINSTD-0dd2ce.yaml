  interpretation_limits:
    - Design record only. No run, no evidence, no approval exists here.
    - >-
      No sentence of this record or its contract is a verdict about any curve.
      Every cost figure is conditional on H-DL-1, H-DL-2, TA-1 to TA-3 and machine
      model MM-1, and is a design figure until the experiment's arms report.
    - >-
      (C1') is conditional on OB-1. The toy verification checks the conclusion
      on toy cells with A = 0 (Tr(A) = 0, condition (7) holds on every toy lane);
      it says nothing directly about the Tr(A) = 1 rows' collapsed cells, which
      carry OB-2.
    - >-
      Scope of the method class. Cover attacks outside the GHS/Hess
      Artin-Schreier construction (isogeny-extended GHS, (2,...,2) covers,
      Hess's general covers, other curves on the Weil restriction) are out of
      scope; MMT's own statements about isogenous curves (Remark 26, Table 4) are
      the source's and are not used.
    - >-
      The n = 8 and n = 16 lanes are OPEN, not closed: no cost law at read
      provenance covers their regime (g / log2 q above 1). Nothing here says they
      are hopeless.
    - Nothing here bears on the prime-degree rows except as controls.
    - >-
      (C2') and M6 count and pin; they make no cost statement. M6 (k prime
      minimises the divisor count) says nothing about whether composite-k
      curves are more or less exposed.

