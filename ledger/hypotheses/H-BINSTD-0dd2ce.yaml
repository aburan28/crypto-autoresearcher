  transfer_assumptions:
    - id: TA-1
      statement: >-
        H-DL-1 measured at g = 8, q in {2^10, 2^11, 2^13} on covers of toy cells
        with d in {4, 8} holds at g = 8, q = 2^(4k) (2^44 to 2^92) on covers of the
        deployed rows. Distance 31 to 82 bits of log2 q; g/q falls with q, so the
        combinatorial correction shrinks along the transfer.
    - id: TA-2
      statement: >-
        The H-DL-2 constant kappa measured at toy q stays constant up to
        q = 2^92. This is the transfer that carries the cost rows and is the
        least supported: polylogarithmic growth would raise kappa by a few bits
        over the 31 to 82-bit transfer distance, and the cost table states the
        consequence by carrying kappa as a range.
    - id: TA-3
      statement: >-
        Covers of toy subfield cells (d in {4, 8}, OPEN_N4 lane, m = 4, g = 8) are
        representative of covers of the d = 16 rows on their OPEN_N4 lanes (same
        n, m and g; different q and d).

