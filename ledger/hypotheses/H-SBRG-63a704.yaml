hypothesis:
  id: H-SBRG-63a704
  question_id: RQ-SBRG-f31cb2
  statement: >-
    Weil-descended chained Semaev S_3 point-decomposition systems over ordinary
    binary elliptic curves contain target-independent low-degree algebraic
    dependencies that are stronger than degree-profile-matched planted Boolean
    controls and can be reused across target specializations.
  mechanism: >-
    In a recursive S_3 tree, all but the final target-specialized constraint are
    fixed for a chosen curve, factor base, field basis, and tree topology.
    These fixed equations define a quotient with repeated low-degree
    dependencies. Precomputing their Boolean Macaulay row space should both
    expose excess degree falls/syzygies and reduce incremental elimination work
    for many P_R target blocks.
  assumptions:
    - The Boolean Macaulay layer construction is a meaningful structural probe of the solver representation.
    - Matched planted controls remove effects explained only by Boolean reduction and equation degree histograms.
    - A signal that survives basis/orientation/tree changes is less likely to be a coordinate artifact.
  proof_search_map:
    not_applicable_reason: >-
      This is initially an empirical structural hypothesis. Any later asymptotic
      claim requires a separate proof or explicit heuristic model after Phase B/C.
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - recursive S_3 addition tree
    - Weil descent to F_2
    - fixed-versus-target equation split
    - Boolean Macaulay rank profile
    - target-batched sparse elimination
  reduction_chain:
    core_problem: ECDLP relation generation
    corollaries: []
  predictions:
    - metric: excess_fall_dim
      direction: positive
      minimum_effect: >-
        Positive at a consistent degree-relative location for at least three
        increasing n values and two master seeds in at least one representation family.
    - metric: excess_syzygy_dim
      direction: positive_or_neutral
      minimum_effect: >-
        If positive, must persist across at least two basis/orientation choices;
        zero is allowed if fall_dim supplies the structural signal.
    - metric: batch_xor_speedup
      direction: higher
      minimum_effect: ">=1.25 for an 8-target batch at the selected Phase-A degree"
  test_boundary:
    instances:
      - ordinary E/F_{2^n} with n in {8,10,12,14,16}
      - t in {3,4}
      - chained/direct/balanced representations as defined by EXP-SBRG-60c55e
    parameters:
      claim_tier: toy_structural
      factor_base_dimension: ceil(n/t)+1 unless explicitly swept
    implementation: experiments/EXP-SBRG-60c55e/driver/run.sage
    budget:
      max_columns: 200000
      max_rows: 200000
  falsification_conditions:
    - >-
      Real systems show no persistent positive excess fall_dim/syzygy_dim over
      matched controls as n increases in every tested representation family.
    - >-
      Apparent signals disappear under field-basis, factor-base-orientation, or
      tree-topology changes.
    - >-
      Fixed-rowspace precomputation gives <1.10x XOR reuse across all valid cells.
  interpretation_limits:
    - Structural metrics do not establish lower Gröbner solving degree.
    - XOR-operation reuse does not establish wall-clock solver speedup.
    - No conclusion transfers to prime-field curves without a separately validated representation and experiment.
    - No ECDLP speedup is claimable until relation probability and end-to-end rho comparison are charged.
  status: proposed
  proposed_by: idea-generator
  status_history:
    - status: proposed
      note: >-
        Opened with EXP-SBRG-60c55e as a staged, falsifiable follow-up to the
        2026 SMS/PQC slide review. No mathematical experiment has yet been
        executed under this contract.
