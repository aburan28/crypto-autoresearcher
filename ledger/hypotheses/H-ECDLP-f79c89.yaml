hypothesis:
  id: H-ECDLP-f79c89
  question_id: RQ-ECDLP-001
  goal_id: null
  source_proposal: IDEA-20260829-c6e7a4
  status: proposed
  proposed_by: idea-generator
  designed_by: coordinator
  designed_under_task: TASK-20260904-ae82ce
  design_note: >-
    DESIGN ONLY. This record converts IDEA-20260829-c6e7a4 into a specified
    hypothesis. No status of any other record is changed, no experiment is
    approved, and nothing here is evidence. The mathematical content is the
    idea-generator's; the Coordinator's own contribution is confined to the
    scoping in test_boundary, the explicit non-degeneracy and dynamic-range
    obligations on the null objects, and the curve-free null and its
    pre-declared consequence, all of which are carried into the paired
    contract EXP-ECDLP-933c10.

  statement: >-
    TEST BOUNDARY FIRST. This is an INSTRUMENT AND BOOKKEEPING AUDIT of two
    factor-base constructions in this repository's harness, at toy scale
    (p at most 2^14, B at most 32, m = 2). It is not an attack, contains no
    complexity claim, and moves no exponent in either direction.

    THE TWO PREDICTIONS. Write V for a factor base of B x-coordinates, G for
    the group in which the m-fold signed sums live, M = h*N for the curve
    order with N the order of the target subgroup and h the cofactor.

    P1, THE DENOMINATOR. KN-FIND-007 fixes the mean per-target decomposition
    yield at binom(B+m-1,m) divided by the order of the group the sums live
    in, for every base of size B. The harness offers two scopes that pick
    different groups: full_curve samples x-coordinates of all of E(F_p), so
    the sums equidistribute over a group of order M; target_subgroup
    enumerates multiples of P, so the sums stay inside the order-N subgroup.
    PREDICTED: at matched B, matched m, and targets drawn from the order-N
    subgroup in BOTH arms, the ratio of mean yields (target_subgroup over
    full_curve) is EXACTLY h, with no free parameter.

    P2, THE COVERAGE COLLAPSE, WHICH POINTS THE OTHER WAY. On the reading of
    the committed source recorded in IDEA-20260829-c6e7a4, the harness's
    target_subgroup branch takes the first B distinct x-coordinates of
    consecutive multiples of P, so the exponent set is the interval 1..B up
    to x-collisions. At m = 2 the decomposable targets are then exactly the
    rP with r in the interval -2B..2B, giving coverage 4B/N against a mean
    of 2B^2/N. PREDICTED: coverage divided by mean equals EXACTLY 2/B for
    that base at m = 2, so the h-fold yield gain of P1 is delivered as
    MULTIPLICITY on O(B) targets and as nothing on the other N - O(B).

    THE AUDIT CONSEQUENCE, WHICH IS THE DELIVERABLE. If P1 and P2 both hold,
    then switching a factor base to scope target_subgroup as a fix for the
    denominator error would trade a bookkeeping correction for a
    measurement-destroying coverage collapse of order B, and would do so
    silently because the mean yield would look h times better. The corrected
    construction is a RANDOM subgroup-scoped base, which the harness does not
    currently offer. Producing that recommendation with numbers attached is
    what this record exists to do.

    WHAT IS NOT CLAIMED. No attack, no exponent, no algorithm. No claim that
    any specific committed number in any prior experiment is validated or
    invalidated; any such consequence requires its own correction record and
    Coordinator decision. No resolution of the s4_expr audit item, which is a
    separate and still-open question. No status change to any record.

  mechanism: >-
    THE TRACKED OBJECT is the subgroup generated by the factor base,
    projected to its ORDER, a single integer. The projection is genuinely
    lossy - it forgets which points are in V, their x-coordinates, the
    curve coefficients and the field - and it is lossy COMPATIBLY with the
    operation the measurement performs, because sums of factor-base points
    are closed in the generated subgroup under the group law. The
    conservation double count of KN-FIND-007 then applies with that
    subgroup's order in the denominator and nothing else, which is why the
    h factor is an identity rather than an estimate.

    THE SECOND OBJECT, used only to separate P1 from P2, is the additive
    structure of the base in the logarithm coordinate - the set of exponents
    k for which x(kP) lies in V, viewed as a subset of Z/N. It is lossy in
    the opposite direction, forgetting the geometry and keeping the
    arithmetic, and it propagates because logarithms add.

    WHY THE TWO PREDICTIONS DISCRIMINATE. P1 is a statement about the
    DENOMINATOR only. It rescales every yield by 1/h and is invisible to any
    statistic normalised by the mean. P2 is a statement about the
    DISTRIBUTION at fixed mean. It leaves the mean exactly alone - that is
    what the conservation identity means - and moves mass from coverage into
    multiplicity. So the ordered pair (mean, coverage) separates them
    completely and neither can masquerade as the other. That is the reason
    this is a measurement rather than an argument.

  assumptions:
    - >-
      E(F_p) is cyclic, or at least the factor base generates it, so that
      full_curve sums equidistribute over a group of order M = h*N. If
      E(F_p) is non-cyclic, the relevant object is the subgroup generated by
      V and h is replaced by the index of that subgroup in E(F_p). This is
      COMPUTED per cell, not assumed, and is heuristic H1 below.
    - >-
      Targets for the P1 comparison lie in the order-N subgroup in BOTH
      arms. Letting the full_curve arm's targets range over E(F_p) would
      build the h factor into the measurement by construction.
    - >-
      x-coordinate collisions in the consecutive-multiples enumeration mean
      the first B distinct x-values correspond to k = 1..B only while B is
      below N/2. Cells violating B < N/4 are excluded BEFORE the run.
    - >-
      The sign-counting convention (whether a point and its negative count
      as one base element or two) is frozen before any cell and is identical
      in both arms; it changes every number by 2^m at arity m.
    - >-
      RQ-ECDLP-001's toy-scale constraint binds. Nothing is claimed at
      cryptographic scale, where h is at most 8 on standardised curves and
      the entire P1 effect is a factor of at most 8.

  proof_search_map:
    not_applicable_reason: >-
      NOT A PROOF-ORIENTED PROPOSAL, for a specific reason rather than as a
      shrug. The two derivations this record rests on are already committed
      and carry their own proof status: the mean-yield identity is
      KN-FIND-007's double count, and the coverage count for an interval
      exponent set is elementary counting over Z/N. No new theorem, no new
      certificate family, no reduction and no asymptotic claim is proposed.
      The four section-8 audits are discharged inside the paired contract's
      control set as the matched-random arm, the matched-h arm, the Sidon
      positive control and the exact-identity check. The one quantifier that
      matters is stated in the claim - the mean identity holds FOR ALL bases
      of size B - which is what makes the h ratio a prediction with no free
      parameter rather than a fit.

  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. The quantities audited are a factor h, at most 8 on
    standardised curves and hence O(1), and a coverage factor of order B
    which under KN-FIND-007's one-relation-per-target bound is worth at most
    1.582 in cost. Both are constants at fixed m. Under
    docs/target-result-profile.md this is explicitly NON-TARGET-CLASS, and
    its priority rests on being a correctness precondition for every yield
    number this lane reports, not on being an advance. Pollard rho at
    0.886*sqrt(N) with O(1) memory remains the prime-field baseline and is
    untouched.

  heuristic_assumptions:
    - id: HEUR-FB-1
      formal_statement: >-
        For a factor base V of B x-coordinates sampled by the full_curve
        construction, the subgroup generated by the lifts is all of E(F_p)
        with probability 1 - O(2^{-B}) for B at least 8, so the group order
        entering the conservation denominator is M = h*N and not a proper
        subgroup.
      random_model_justification: >-
        The RIGOROUS ingredient is the conservation identity itself, which
        fixes the mean once the group order is known, for EVERY base. What
        is assumed is only that the generated subgroup is all of E(F_p). The
        classical statement imitated is the standard random-generation bound
        for finite abelian groups - B independent uniform elements generate
        the whole group with probability at least one minus the sum over
        maximal subgroups of the reciprocal index raised to the power B. THE
        GAP is that the harness sample is seeded-deterministic rather than
        truly uniform.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-933c10]
      falsification_condition: >-
        More than one cell in the declared grid at B at least 8 has a proper
        generated subgroup, or any such cell is silently averaged into the
        ratio rather than excluded and reported individually.
    - id: HEUR-FB-2
      formal_statement: >-
        For a matched RANDOM subgroup-scoped base, the decomposition count
        of a uniformly random target is Poisson-distributed with the
        conservation mean, so coverage equals 1 - exp(-mean) up to o(1) and
        coverage divided by mean approaches min(1, mean) divided by mean
        within the 1.582 bound of KN-FIND-007.
      random_model_justification: >-
        The RIGOROUS ingredient is again conservation - the mean is exact
        and coverage is at most min(1, mean). The classical distribution
        imitated is the Poisson occupancy limit for a balls-in-bins process
        with binom(B+1,2) balls and N bins. What is assumed is independence
        of the placements, which is false in detail because the
        correspondence is algebraic; the variance-to-mean ratio measures
        exactly that departure and is a required metric.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-933c10]
      falsification_condition: >-
        The exact multiplicity histogram of the random subgroup arm fails a
        chi-square test against Poisson with the exact conservation mean at
        the 1 percent level in more than 5 percent of cells, or the
        variance-to-mean ratio departs from 1 by more than a factor 2
        without being reported alongside every coverage number.

  structural_ingredients:
    - description: >-
        The mean per-target decomposition yield equals binom(B+m-1,m)
        divided by the order of the group the sums live in, exactly, for
        every base of size B; coverage is bounded by min(1, mean); a
        Bose-Chowla Sidon base attains the coverage ceiling at ratio 1.1071
        while a small-multiples base collapses to coverage ratio 0.0021 at
        N about 2^18 with concentration 1224x.
      citation: KN-FIND-007
      provenance: internal
      verified_by: >-
        idea-generator of IDEA-20260829-c6e7a4, which records reading
        knowledge/findings/KN-FIND-007.md in full on 2026-08-29. RELAYED,
        NOT RE-READ by coordinator TASK-20260904-ae82ce; this design took
        the statement from that idea record and did not reopen KN-FIND-007.
      role: supplies the conservation identity and the coverage ceiling
    - description: >-
        build_factor_base offers two scopes. full_curve hashes seeded
        integers modulo p and keeps those that lift to the curve, sampling
        x-coordinates of ALL of E(F_p). target_subgroup iterates
        scalar from 1 upward, computes E.mul(scalar, inst.P), and takes the
        first `size` distinct x-coordinates; the seed argument is consumed
        only on the full_curve path. measure_s3_decomposition calls
        build_factor_base without a scope argument and so takes the
        full_curve default.
      citation: harness/semaev.py (build_factor_base)
      provenance: internal
      verified_by: >-
        idea-generator of IDEA-20260829-c6e7a4, which records reading
        harness/semaev.py in full (233 lines) on 2026-08-29. RELAYED, NOT
        RE-READ by coordinator TASK-20260904-ae82ce. Because the entire P2
        diagnosis rests on this reading and the file is mutable, the paired
        contract makes re-reading it a BLOCKING zero-compute Stage 0 gate.
      role: >-
        supplies the small-multiples geometry that P2 predicts, read off the
        source rather than inferred from behaviour
    - description: >-
        Q2 records that build_factor_base samples the whole curve rather
        than the target's subgroup, that a prior experiment measured
        main-curve cofactors 2280, 196 and 31512 with single-level
        decomposition probabilities 0.0, 0.32 and 0.0 against point
        predictions 0.047, 0.000239 and 0.003, and that the pattern does not
        track those predictions in either direction or magnitude at any of
        the three sizes. The entry remains OPEN.
      citation: KN-OPEN-5b3a08
      provenance: internal
      verified_by: >-
        idea-generator of IDEA-20260829-c6e7a4, which records reading
        knowledge/open-problems/KN-OPEN-5b3a08.md in full (197 lines) on
        2026-08-29. RELAYED, NOT RE-READ by coordinator TASK-20260904-ae82ce.
        The paired contract requires the Executor to re-read the entry and
        quote the three measured points verbatim before instantiating the
        corrected model against them.
      role: supplies the recorded anomaly this audit assigns to a mechanism

  reduction_chain:
    core_problem: >-
      Which group the m-fold factor-base sums equidistribute over under each
      of the harness's two factor-base scopes, and what each scope costs in
      coverage at matched size.
    corollaries: []
  reduction_chain_note: >-
    Deliberately empty. This record reaches no downstream problem: it
    produces a construction recommendation and a screening rule, not a
    reduction.

  predictions:
    - metric: >-
        ratio of mean decomposition yield, target_subgroup base over
        full_curve base, at matched B, matched m = 2, targets drawn from the
        order-N subgroup in both arms; dimensionless
      direction: higher
      minimum_effect: >-
        PREDICTED EXACTLY h. Pre-registered acceptance band: the measured
        ratio lies within 5 percent of h. A ratio within 5 percent of 1
        instead FALSIFIES P1 and means full_curve sums do not equidistribute
        over E(F_p), which would be a more significant structural finding
        than the audit. Curves are selected to span h across at least two
        orders of magnitude so that a fit to h is distinguishable from a
        constant.
    - metric: >-
        coverage divided by mean yield for the harness target_subgroup base
        at m = 2; dimensionless
      direction: lower
      minimum_effect: >-
        PREDICTED EXACTLY 2/B. Pre-registered: the measured value falls by
        at least a factor B/4 relative to a matched RANDOM subgroup-scoped
        base at the same B and the same group. Agreement within a factor 2
        FALSIFIES P2.
    - metric: >-
        coverage divided by mean yield for the matched RANDOM
        subgroup-scoped base; dimensionless
      direction: different
      minimum_effect: >-
        PREDICTED near min(1, mean) divided by mean, within KN-FIND-007's
        1.582 bound. This is the null that isolates subgroup scope from
        small-multiples structure. If the random subgroup base ALSO
        collapses, the diagnosis inverts: the cause is the scope itself and
        the recommendation changes completely.
    - metric: >-
        exactness of the yield identity per cell against
        2^m*binom(B+m-1,m) divided by the order of the subgroup generated by
        V; deviation in absolute multiset count
      direction: different
      minimum_effect: >-
        FORCED EXACT, deviation 0, by exhaustive enumeration over the
        complete target set. Any nonzero deviation on a clean cell is an
        implementation error and halts every arm.
    - metric: >-
        absolute log-ratio error of the corrected model
        2^m*binom(B+m-1,m)/(h*N) against the three measured decomposition
        probabilities recorded in KN-OPEN-5b3a08 Q2, compared with the same
        error for the uncorrected (B/N)^2 model; dimensionless
      direction: lower
      minimum_effect: >-
        The corrected model must be closer at ALL THREE sizes. Improvement
        at two of three is recorded as PARTIAL and does not support the
        denominator mechanism alone. If the corrected model is no better,
        both named mechanisms are excluded and the open entry stays open,
        narrower by two candidates, which is a smaller but real deliverable.

  test_boundary:
    instances:
      - "12 toy curves at p in {2^10, 2^12, 2^14}, short Weierstrass, p > 3."
      - >-
        Curves selected to span the cofactor h across at least two orders of
        magnitude (roughly 1-4, 100-300, and 2000-4000) and to decorrelate h
        from N as far as the toy range permits; the residual correlation is
        a required reported metric.
      - >-
        Four base-construction arms per cell: (a) full_curve, (b) harness
        target_subgroup, (c) matched RANDOM subgroup-scoped base implemented
        for this test and NOT by editing the harness, (d) a Bose-Chowla
        Sidon base in the subgroup as the coverage-ceiling positive control.
      - >-
        A curve-free arm on Z/M with a subgroup of index h, carrying the
        identical four constructions - see the paired contract's
        null_object block, which makes the consequence of its outcome
        binding in advance.
    parameters:
      m: 2
      B: "{4, 8, 16, 32}"
      p: "{2^10, 2^12, 2^14}"
      target_set: "complete order-N subgroup, exhaustive, never sampled"
      excluded_cells: "any cell with B >= N/4"
    implementation: >-
      Exact enumeration over the complete target set. Decomposition counting
      uses the correspondence v maps to {x(R + P_v), x(R - P_v)} directly,
      so the count is an exact enumeration and never a solver output. No
      polynomial system, no Macaulay matrix and no Groebner basis is built
      anywhere, so this design cannot encounter the memory wall recorded
      against the DREG lane.
    budget: >-
      See EXP-ECDLP-933c10 for the frozen numbers. Exhaustive enumeration
      over a subgroup of order at most 2^14 with B at most 32 is at most
      2^14 * 32 point additions per cell; the largest object held is a
      histogram of N counters.

  falsification_conditions:
    - >-
      The measured yield ratio is within 5 percent of 1 rather than of h.
      P1 is false and full_curve sums do not equidistribute over E(F_p).
    - >-
      The harness target_subgroup base shows no coverage collapse relative
      to a matched random subgroup base. P2 is false and the
      small-multiples diagnosis, though read directly off the source, does
      not bind at these parameters.
    - >-
      The matched random subgroup base ALSO collapses. The cause is
      subgroup scope itself rather than additive structure; the diagnosis
      inverts and the recommendation changes.
    - >-
      The Sidon positive control fails to attain the coverage ceiling. The
      instrument is blind and no negative from it means anything.
    - >-
      The exact-identity check deviates from 0 in any clean cell.
      Implementation error; nothing is reported from any arm.
    - >-
      A planted defect of declared size fails to fire at its predicted
      degree. The battery has not demonstrated dynamic range and its
      collapse finding, however clean, is unsupported.
    - >-
      Any timeout, crash, or construction failure. failed_infrastructure
      under AGENTS.md rule 5, never negative mathematical evidence.

  interpretation_limits:
    - >-
      TOY SCALE ONLY, AND THE EFFECT VANISHES WHERE IT WOULD MATTER.
      Standardised cryptographic curves have h in {1, 2, 4, 8}, so P1's
      factor is at most 8 and is not an exponent. A ratio of 31512 measured
      at 24 bits must never be quoted as a cryptographic quantity. THE
      CRYPTOGRAPHIC-SCALE FORM OF THIS CLAIM IS NOT MERELY UNTESTED HERE, IT
      IS EMPTY: at h = 1 the predicted ratio is exactly 1.
    - >-
      Both P1 and P2 are statements about a subset of a finite cyclic group
      and its m-fold sumset. The paired contract carries a curve-free null
      precisely because of this, with a consequence pre-declared before any
      cell runs.
    - >-
      This record does not resolve the s4_expr audit item of KN-OPEN-5b3a08,
      which is separate and still open, and it does not retroactively
      validate or invalidate any committed number in any prior experiment.
    - >-
      Scoped to m = 2 in the measured arms. The denominator argument is
      arity-independent; the coverage count is computed at m = 2 and its
      m >= 3 analogue is stated but not measured.
    - >-
      NOVELTY IS NOT ADJUDICATED. No external literature search was run for
      this pairing of a cofactor denominator with a small-multiples coverage
      collapse; both ingredients are elementary. Honest status: unverified.
    - >-
      NO STATUS CHANGE to any record is proposed or implied. Coordinator
      authority alone, AGENTS.md rule 1.

