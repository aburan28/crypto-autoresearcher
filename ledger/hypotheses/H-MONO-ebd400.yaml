hypothesis:
  id: H-MONO-ebd400
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  status: proposed
  added: '2026-09-04'

  statement: >-
    SCOPE: m=4 only. Prime fields F_p, p>3, toy range. E: y^2=x^3+Ax+B
    non-singular, ordinary, j not in {0,1728}. Claim tier toy for every
    measurement; the underlying S_4 construction is derivation tier,
    already independently verified three ways in EXP-MONO-815525.

    THE HYPOTHESIS. IDEA-20260904-ad63fe claims the m=4 symmetric-base
    Semaev cover has monodromy exactly AGL(2,2)=S_4 (the full symmetric
    group on the quartic Q_e(T)'s four roots). EXP-MONO-815525 attempted
    to test this via a g-irreducible-CONDITIONED census and was proven, by
    an explicit null-object control (DEC-20260904-858cdc, evidence
    EV-MONO-661ee4), to have ZERO discriminating power: every element of
    S_4 with an order-3 linear part is a 3-cycle regardless of translation,
    so conditioning on "g irreducible" forces the observed pattern by pure
    group theory alone, independent of which subgroup is actually
    realized.

    THE CORRECTED TEST, NAMED BY THAT SAME REVIEW ROUND. An UNCONDITIONED
    five-class Chebotarev census: sample base points (e1,e2,e3) WITHOUT
    filtering on g's own factorization type, classify each resulting
    Q_e(T)'s own factorization pattern into one of five classes matching
    S_4's five conjugacy classes (1^4, 2+2, 2+1+1, 4, 3+1), and compare the
    OBSERVED FREQUENCY DISTRIBUTION against the predicted Chebotarev
    density under full S_4 (1/24, 1/8, 1/4, 1/4, 1/3 respectively). THIS
    TEST HAS GENUINE DISCRIMINATING POWER: every proper transitive subgroup
    of S_4 (A_4, D_4, V_4, C_4) predicts probability EXACTLY ZERO for at
    least one of these five classes that full S_4 predicts at a
    substantial, easily-observed frequency (A_4 has no transpositions or
    4-cycles, so predicts zero for classes 2+1+1 and 4; D_4 has no
    3-cycles, so predicts zero for class 3+1; etc.) -- a single observed
    instance in a zero-predicted class is a complete falsification of that
    subgroup, unlike EXP-MONO-815525's own g-irreducible-conditioned test
    where no outcome could ever have falsified anything.

    PRE-REGISTERED, TWO-SIDED, AND GENUINELY SO THIS TIME (per
    EXP-MONO-815525's own review finding that its predecessor's
    falsification branch was empty by construction -- this record's own
    falsification branches are checked non-empty below for EVERY named
    alternative subgroup). (I) The observed five-class frequency
    distribution matches full S_4's Chebotarev density within toy-scale
    statistical tolerance, AND at least one instance is observed in EACH
    of the five classes (a positive-existence requirement, not merely a
    frequency match, since a frequency match alone cannot rule out a
    subgroup with support on a subset of classes if that subset happens to
    be sampled at compatible relative rates by chance). (II) The observed
    distribution shows systematic absence (zero observed instances after
    a pre-registered minimum sample size) of any class a Chebotarev
    density this large predicts should appear -- falsifying full S_4 and
    identifying the specific smaller subgroup consistent with the
    observed support.

  mechanism: >-
    REUSES EXP-MONO-815525's own independently-verified S_4/Q_e(T)
    construction UNMODIFIED (three disjoint methods already confirmed it
    correct: symbolic nested resultant, numeric via Frobenius powers,
    independent runtime resultant, PLUS the Validator's own from-scratch
    re-derivation and the Red Team's own independent enumeration-based
    verification across 15 curves). The only new content is the SAMPLING
    DESIGN: (1) draw (e1,e2,e3) uniformly at random from F_p^3 (or
    exhaustively, if p is small enough), WITHOUT any filter on g's own
    factorization type; (2) for each draw, determine g's own type (for
    descriptive context only, not as a filter) and Q_e(T)'s own exact
    factorization-degree pattern via the same squarefree/distinct-degree
    factorization method already used and verified in EXP-MONO-815525; (3)
    explicitly EXCLUDE the one known degenerate case (Res(g,f)=0, i.e.
    g=f exactly, where Q_e degenerates identically to a constant) --
    EXP-MONO-815525's own review found this exclusion was named by the
    parent idea but not carried into that contract's own selection rule,
    and this record corrects that gap explicitly; (4) tabulate the
    resulting five-class frequency distribution and compare against the
    predicted S_4 Chebotarev density.

  falsification_condition: >-
    Per subgroup, checked individually and disclosed as its own named
    falsification branch (proves_too_much style, verified non-empty
    before this record is filed): A_4 is falsified by ANY observed
    instance in class 2+1+1 or class 4 (both predicted probability
    exactly zero under A_4, both predicted ~1/4 under S_4 -- EXP-MONO-815525's
    own already-collected REJECTED-draw data, per its own Red Team review,
    already shows genuine instances of both classes on the g-reducible
    locus, so this falsification branch is CONFIRMED non-empty before this
    experiment even runs). D_4 (order 8, no 3-cycles) is falsified by ANY
    observed instance in class 3+1 -- EXP-MONO-815525's own g-irreducible
    census already observed hundreds of thousands of exactly this class,
    so this branch too is confirmed non-empty in advance. V_4 (order 4) is
    falsified by any instance outside classes {1^4, 2+2}. Full S_4 itself
    is falsified by systematic ABSENCE (zero observed instances after a
    pre-registered minimum sample count keyed to each class's own smallest
    predicted density, 1/24 for class 1^4) of any of the five classes.

  heuristic_assumptions:
    - id: H1
      statement: >-
        None load-bearing for the per-subgroup falsification branches
        (each is a zero-tolerance existence check, not a distributional
        claim). For the POSITIVE, "consistent with full S_4" direction,
        the assumption is that base points are drawn independently and
        that the observed frequencies, given a large enough sample, are
        informative about the true Chebotarev density -- standard
        Chebotarev-census methodology already used successfully elsewhere
        in this lane (e.g. this session's own H-MONO-45183a Part A
        cycle-type work, and the Red Team's own informal pilot of this
        exact design).
      rigorous_support: >-
        Chebotarev density theorem-style reasoning: as sample size grows,
        observed factorization-class frequencies converge to conjugacy-
        class-size-weighted densities of the true Galois/monodromy group,
        for a "sufficiently generic" family -- standard, well-established
        methodology, not a novel assumption for this program.
      validation_plan: >-
        SAMPLE: at least 10,000 unconditioned base points per curve, on at
        least 2 independent (non-isogenous, explicitly checked) curves at
        2 independent primes -- large enough that even the SMALLEST
        predicted class (1^4, density 1/24) has an expected count of
        several hundred, giving real power to detect its absence.
        COMPARE AGAINST: the exact predicted S_4 Chebotarev density
        (1/24, 1/8, 1/4, 1/4, 1/3) via a chi-square goodness-of-fit test,
        pre-registered before any draw. TAIL CHECK: explicit minimum-count
        requirement per class (see falsification_condition). TRANSFER
        ASSUMPTION, STATED: toy-scale agreement at these specific curves
        and primes is not extrapolated to cryptographic scale or to any
        other curve.
      falsification_condition: >-
        Systematic absence of a predicted-common class after the
        pre-registered minimum sample, or presence in a
        predicted-impossible class for a named alternative subgroup, per
        the falsification_condition field above.

  target_complexity:
    time_exponent: O(1) per base point (a constant number of field operations and one quartic factorization).
    memory_exponent: O(1).
    best_known: Not applicable; no ECDLP complexity claim. Pollard rho (KN-OPEN-001) untouched.

  claim_boundary_and_test_boundary: >-
    Tests full-S_4-vs-proper-subgroup monodromy at m=4 on the symmetric
    base, at toy scale, on a small number of curves and primes. Does NOT
    make any relation-rate, cost, or exponent claim. Does NOT close
    KN-OPEN-009. A pass (frequencies matching S_4, all five classes
    populated) is toy-scale supportive evidence, not a proof for every
    curve. A named-subgroup falsification is a complete, zero-tolerance
    result regardless of sample size, per the pre-checked-nonempty
    falsification branches above.

