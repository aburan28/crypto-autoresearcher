  reduction_chain:
    core_problem: >-
      The inner polynomial solve of the binary Weil-descent Semaev attack on the
      Petit-Quisquater diagonal.
    corollaries: []
  predictions:
    - metric: >-
        M(D, d, k), the admissibility margin, an integer, computed as the rank
        of degree-D Macaulay rows with k-degree at most d minus the number of
        non-k monomials of degree at most d requiring elimination, over the
        declared grid at n in {12, 15, 18}
      direction: different
      minimum_effect: >-
        The SIGN of the maximum of M over the grid is the deliverable. At or
        above 0 at any grid point is outcome (A) and licenses the cost
        comparison; strictly negative at every grid point at every n, while the
        semi-regular null admits at least one point, is outcome (B) and is a
        named obstruction with a number. The margin's dynamic range is set by
        the Macaulay dimension, which KN-FIND-006 records as growing from about
        29,418 to 145,881 across this family, so the statistic is not confined
        near zero.
    - metric: >-
        M_subtree minus M_semiregular at matched (D, d, k) and matched split
        size, integer
      direction: higher
      minimum_effect: >-
        This is the STRUCTURAL quantity. A margin that is positive only because
        the system is large is not evidence about the chaining graph, and the
        support-matched semi-regular arm has the same dimension with no chaining
        structure. If the difference is not positive, the structural premise is
        dead whatever the raw margin is.
    - metric: >-
        charged crossbred cost against the transcribed published
        F4-at-first-fall cost, log_2 operations as a curve in n on the diagonal
      direction: lower
      minimum_effect: >-
        Reported as two curves with any crossover marked, at both declared
        values of omega, with the partial Macaulay MEMORY reported beside time.
        A crossbred cost above the published one at every n on the diagonal is
        outcome (B) with a quantitative margin.
    - metric: >-
        subtree split row count against random split row count at matched k
      direction: higher
      minimum_effect: >-
        REPORTED, NOT A DISCRIMINATOR. Its sign is forced, see the band note in
        EXP-ECDLP-ee376e. It is retained as a descriptive number only.
  test_boundary:
    instances:
      - >-
        Descended chained-Semaev boolean systems at n in {12, 15, 18} from the
        committed EXP-DREG-001 artifacts, subject to the k-degree precondition.
      - >-
        Support-matched semi-regular systems at the same sizes, the curve-free
        null.
    parameters:
      claim_tier: toy
      field: binary, F_{2^n}, descended to GF(2)
      degrees_D: [3, 4, 5]
      splits: one subtree split plus at least three random splits of matched size
      omega_values: [2, 2.81]
    implementation: >-
      Not yet written. EXP-ECDLP-ee376e declares the required artifacts and its
      blocking preconditions.
    budget:
      wall_clock_seconds_per_run: 3600
      maximum_memory_gb: 16
      maximum_runs: 6
  falsification_conditions:
    - >-
      OUTCOME (B), THE EXPECTED ONE. M is strictly negative at every grid point
      at every tested n while the semi-regular null admits at least one point.
      The obstruction is named, measured and scoped to the tested sizes.
    - >-
      STRUCTURAL PREMISE DEAD. M_subtree minus M_semiregular is not positive.
      The chaining graph contributes nothing and outcome (B) is reached at the
      cheapest possible cost.
    - >-
      COST FALSIFIER. The charged crossbred curve lies above the published
      curve across the whole diagonal at both values of omega.
    - >-
      INSTRUMENT VOID. The admissibility calculator finds NO admissible
      (D, d, k) on the support-matched semi-regular null, on which crossbred is
      known to be usable. The calculator is then wrong and no margin it reports
      means anything.
    - >-
      BLOCKED, NOT FALSIFIED. The committed artifacts cannot supply k-degree
      profiles, or the published formula cannot be transcribed from
      KN-LIT-7607, or crossbred's admissibility condition cannot be stated
      precisely from any obtainable source. Each is recorded as UNRUN and the
      record waits rather than concluding.
    - >-
      REPRODUCTION, NOT DISCOVERY. The literature already reports crossbred
      against binary ECDLP. The record is relabelled a reproduction.
  interpretation_limits:
    - >-
      BINARY FIELDS ONLY. Nothing here transfers to prime fields. The source
      proposal states a prime-field contrast in its own interpretation_limits
      by reference to identifiers "E2-03" and "E2-08"; THOSE IDENTIFIERS ARE
      DEFINED NOWHERE. They are internal generator labels that leaked into the
      ledger, a defect documented in ideas/rescreen-20260808/slice1.md, which
      names "E2-07"/"E2-08" among labels appearing in discriminated_from,
      dominated_by and target_complexity fields of at least nine records in that
      slice with no definition. This record carries no claim that rests on them
      and the contract must not cite them.
    - >-
      Any improvement found is an improvement over a published HEURISTIC
      estimate and would itself be heuristic, because crossbred's cost model
      carries its own assumptions. Toy tier for any executed cell, per
      RQ-ALBIN-001's constraint that historical imports are empirical_only
      unless independently re-verified.
    - >-
      NO SOLVER IS RUN except, conditionally, one small end-to-end plumbing
      check at n = 12 if and only if the margin and cost stages are favourable.
      The deliverable is otherwise a comparison of two cost models.
    - >-
      UNTESTABLE AT REACHABLE SCALE. The Petit-Quisquater diagonal at
      cryptographic n is far beyond anything this program can execute, so the
      cost curve is an evaluated formula and never a measured cost. Its
      crossover, if any, is a statement about the two models and not about what
      an attacker would pay.
    - >-
      THE ADMISSIBILITY CONDITION ITSELF IS RECALLED. KN-TECH-053, read in
      full, states that crossbred's construction and parameterisation were
      never obtained by this corpus. Stating the condition precisely enough to
      compute a margin is an obligation of the contract's first phase, not a
      given, and a margin computed from a misremembered condition would be
      worthless in either direction.
  status: proposed
  proposed_by: idea-generator
