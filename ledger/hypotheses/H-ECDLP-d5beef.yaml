        That is the contract's blocking precondition.
      role: the intended data source, existence confirmed, contents unverified
    - description: >-
        Records the published binary-ECDLP Weil-descent complexity and, per the
        source proposal, reports that the first-fall assumption is unlikely to
        hold for a constructible family.
      citation: KN-LIT-7607
      provenance: recalled
      verified_by: null
      role: >-
        NOT OPENED by this Coordinator. Marked recalled rather than internal
        because no agent in this task read it; the contract requires the
