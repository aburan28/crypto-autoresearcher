hypothesis:
  id: H-ECDLP-d5beef
  question_id: RQ-ALBIN-001
  statement: >-
    FIELD CORRECTION, RECORDED FIRST. The dispatching handoff TASK-20260904-c063e5
    describes all nine sources in its batch as "prime-field ECDLP proposals".
    For this source that is WRONG. IDEA-20260808-fc5e3e studies BINARY-FIELD
    ECDLP, ordinary curves over F_{2^n} reduced by Weil descent to boolean
    polynomial systems over GF(2), on the Petit-Quisquater diagonal. The
    "ECDLP" token in this record's pre-allocated identifier is correct as to
    problem and silent as to field; the field is BINARY and every scope
    statement here is written to it. Nothing here transfers to prime fields.
    CLAIM. The published binary-ECDLP Weil-descent complexity is derived by
    charging a Groebner basis computation at the first-fall degree. Applying the
    crossbred algorithm instead, to the descended Semaev system with n' = nm
    boolean variables, yields one of two outcomes. (A) There exists a choice
    (D, d, k) whose charged crossbred cost is strictly below the published
    F4-at-first-fall cost somewhere on the diagonal, in which case the
    literature's binary exponent is not the best known. (B) The crossbred
    admissibility condition FAILS on this family, and the reason is a structural
    property of the chained descent, which is a named obstruction that also
    explains the absence of hybrid gains here.
    THE DECIDING QUANTITY IS AN ADMISSIBILITY MARGIN, NOT A ROW COUNT. Define
    M(D, d, k) as the rank of the degree-D Macaulay rows whose k-degree is at
    most d, minus the number of monomials in the non-k variables of degree at
    most d that must be eliminated. Crossbred is admissible at (D, d, k) exactly
    when M is at least 0. M is an integer computed from committed rank data, its
    sign is genuinely open in both directions, and it decides the record.
    A ROW-COUNT COMPARISON BETWEEN SPLITS WOULD NOT DECIDE ANYTHING, because
    the source's own rigorous ingredient forces the answer, see the band note in
    EXP-ECDLP-ee376e.
  mechanism: >-
    Crossbred performs a partial Macaulay computation at degree D on all
    variables, keeping only monomials of degree at most d in a distinguished
    subset of k variables, then exhaustively enumerates the remaining n' - k
    variables and solves a linear system per guess. Its admissibility is a
    condition on the JOINT degree distribution of Macaulay rows under a variable
    split, and the descended Semaev system has a structured split available for
    free, by subtree of the chaining graph or by descent-basis coordinate.
    Neither split is generic and neither is what a generic crossbred analysis
    assumes.
    The corpus has already measured the object the condition depends on.
    KN-FIND-006 records exact rank deficits for this family, so the
    admissibility condition can be evaluated against committed artifacts before
    any new solve is run, PROVIDED those artifacts record k-degree profiles.
    Whether they do is unverified and is a blocking precondition.
  assumptions:
    - >-
      The descended system is the standard chained-Semaev Weil restriction used
      by this corpus's own generator.
    - >-
      omega is declared in advance and every cost is reported at two values of
      it.
    - >-
      Boolean field equations interact with the split; they are assigned to one
      side and the assignment is recorded.
    - >-
      The committed EXP-DREG-001 rank artifacts can supply k-degree profiles.
      NOT VERIFIED. The source proposal lists this as its own confounder. It is
      a blocking precondition in the contract, and if the profiles are absent
      the evaluation becomes a new computation and the arm reports UNRUN rather
      than concluding.
  proof_search_map:
    bottleneck: >-
      The inner polynomial solve inside the published binary Weil-descent
      attack, charged at the first-fall degree under an assumption the corpus's
      own literature entry reports is unlikely to hold for a constructible
      family.
    baseline_embedding:
      parameter_slice: >-
        A generic MQ system with matched support, on which crossbred is known
        to be usable. The admissibility calculator must find at least one
        admissible (D, d, k) there.
      reproduction_check: >-
        The published F4-at-first-fall cost must be recomputed from the
        published formula with its inputs TRANSCRIBED, not recalled. If it
        cannot be transcribed the comparison is UNRUN and no curve is plotted.
    observation_collision:
      observable: The admissibility margin M(D, d, k) of a variable split.
      distinct_preimage_search: >-
        COLLISION EXISTS AND IS THE REASON FOR THE SEMI-REGULAR ARM. A margin
        can be positive because the system is structured, or because the system
        is merely large, since M grows with the Macaulay dimension. The
        support-matched semi-regular null has the same dimension and no chaining
        structure, so the difference between the two margins is the structural
        quantity and the raw margin is not.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the first-fall Groebner charge by a crossbred charge at a
          chosen degree D, with the split induced by the chaining graph rather
          than chosen generically or greedily.
        predicted_gain: >-
          Either a lower charged exponent on the diagonal, or a named
          obstruction with a measured margin. No exponent is claimed in advance.
    quantifier_order: >-
      FOR ALL tested n in {12, 15, 18} and FOR ALL swept (D, d, k) on the
      declared grid, the margin M is reported. THERE EXISTS an admissible
      (D, d, k) is the claim under test, and the whole grid is published so
      that an existence claim cannot be manufactured by reporting an argmin.
    method_ceiling:
      strongest_certifiable_claim: >-
        A measured admissibility margin over a declared grid at three toy
        system sizes, and a charged cost curve computed from a transcribed
        published formula. NOT an executed attack, NOT a solve, and NOT a
        statement about cryptographic-size binary curves.
      nearby_object_control: >-
        The support-matched semi-regular system at the same sizes, which is
        curve-free and carries no chaining graph.
    proof_obligations:
      - claim: The published F4-at-first-fall cost is transcribed, not recalled.
        responsibility: baseline
      - claim: The admissibility calculator finds an admissible split on the semi-regular null.
        responsibility: feasibility
      - claim: The margin M is computed from committed rank data at declared (D, d, k).
        responsibility: size
      - claim: The whole swept grid is published, never the argmin alone.
        responsibility: scope
      - claim: The partial Macaulay memory is charged and reported beside time.
        responsibility: memory
      - claim: The semi-regular arm separates chaining structure from mere system size.
        responsibility: strictness
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: >-
      Binary-field ECDLP on ordinary curves over F_{2^n} by Weil descent to a
      boolean Semaev system, along the Petit-Quisquater diagonal.
    prior_best: >-
      Pollard rho at 2^{n/2} with O(1) memory, and the published heuristic
      Weil-descent/Groebner estimates charged at the first-fall degree.
    time_exponent: >-
      NOT CLAIMED IN ADVANCE. The deliverable is the crossbred expression
      2^{n' - k} times the linear algebra on the reduced system, plus the
      one-off partial Macaulay at degree D, evaluated on the diagonal and
      plotted against the published curve.
    memory_exponent: >-
      The partial Macaulay matrix at degree D over n' = nm variables, which is
      the dominant memory term and which published F4-at-first-fall costings
      routinely omit. Reporting this correction is required even if the time
      comparison is unfavourable.
    hidden_cofactor: >-
      Crossbred's own admissibility is heuristic in the generic case and is
      being evaluated on a highly non-generic system. Its cost model has several
      free parameters and is easy to make look good by tuning, which is why the
      whole grid is published rather than the argmin.
    claim_kind: exponent_improvement
  heuristic_assumptions:
    - id: HA-1
      formal_statement: >-
        There exist D, d and a k that is a union of chaining subtrees such that
        the number of degree-D Macaulay rows of the descended Semaev system with
        k-degree at most d, counted by RANK rather than by row, exceeds the
        number of monomials that must be eliminated; equivalently
        M(D, d, k) is at least 0.
      random_model_justification: >-
        The generic MQ case, where the count of low-k-degree rows follows the
        semi-regular series and crossbred's admissible region is computed from
        it, is the distribution imitated. The rigorous part is that rows
        supported entirely within a subtree have k-degree 0 with respect to any
        k disjoint from that subtree, and the chaining graph guarantees such
        rows exist. The heuristic part is whether there are ENOUGH of them AND
        WHETHER THEY ARE INDEPENDENT, which is why the margin is defined on
        rank and not on row count.
      supporting_results:
        - >-
          KN-FIND-006's exact deficits, read in this task, are statements about
          which rows are dependent at low degree and are therefore about the
          same object the margin measures.
      validation_experiment_ids:
        - EXP-ECDLP-ee376e
      falsification_condition: >-
        M(D, d, k) is negative at every point of the declared grid at every
        tested n, while the semi-regular null admits at least one point. The
        obstruction is then named and measured.
  structural_ingredients:
    - description: >-
        Source proposal. Re-costing binary Weil-descent Semaev under crossbred,
        the chaining-subtree split, and the two-outcome framing.
      citation: IDEA-20260808-fc5e3e
      provenance: internal
      verified_by: >-
        TASK-20260904-c063e5 coordinator. Full read of
        ledger/proposals/IDEA-20260808-fc5e3e.yaml, 186 lines, Read tool,
        2026-09-04.
      role: originating claim
    - description: >-
        Exact Macaulay rank deficits for the Semaev/Weil-descent family, read
        directly. "deficit(D=3) = 1 for every full system (n >= 12)";
        "deficit(D=4) = 8k - 1, exact for k = 3,4,5,6,7 (n = 9,12,15,18,21)";
        "Cumulative deficit at D=4 = 8k = 8*dim(V) for full systems"; and the
        support-matched null arm is exact, "deficit = 0 at n = 12, 15, 17, 18,
        every replicate", so any deficit on the Semaev arm is real structure
        rather than predictor bias. The entry also records that while the system
        grows about fivefold, "pred 29,418 -> 145,881", the deficit stays in a
        narrow band, which is what fixes the dynamic range of the margin
        defined here.
      citation: KN-FIND-006
      provenance: internal
      verified_by: >-
        TASK-20260904-c063e5 coordinator. PARTIAL read of
        knowledge/findings/KN-FIND-006.md, Grep tool with the pattern
        "deficit" returning 20 matching lines with their content, 2026-09-04.
        The quoted deficits and the null-arm statement were read directly; the
        surrounding sections of the entry were NOT read.
      role: the committed rank data the margin is computed from
    - description: >-
        Records XL, BooleanSolve and crossbred as the MQ solver family. READ IN
        FULL, AND IT CARRIES A BLOCKING FACT THE SOURCE PROPOSAL DOES NOT.
        Its "Verified vs reported" section states verbatim, "The crossbred
        algorithm's construction and parameterisation were not obtained at all;
        KN-LIT-139 records what it claims, not how it works." The admissibility
        condition this record proposes to evaluate is therefore RECALLED, not
        documented anywhere in this corpus, and stating it precisely enough to
        compute a margin is itself an obligation rather than a given.
      citation: KN-TECH-053
      provenance: internal
      verified_by: >-
        TASK-20260904-c063e5 coordinator. Full read of
        knowledge/techniques/KN-TECH-053.md, 86 lines, Read tool, 2026-09-04.
      role: the corpus entry for crossbred, and the disclosure that its construction is unobtained
    - description: >-
        Binary-field Weil-descent question. Constraints read verbatim,
        "Historical imports are empirical_only unless independently
        re-verified" and "No deployment or crypto-scale promotion from toy
        Autolab runs". Scope field_types is "binary".
      citation: RQ-ALBIN-001
      provenance: internal
      verified_by: >-
        TASK-20260904-c063e5 coordinator. Full read of
        ledger/questions/RQ-ALBIN-001.yaml, 26 lines, Read tool, 2026-09-04.
      role: the governing question and its claim ceiling
    - description: >-
        Committed run artifacts for the degree-of-regularity instrumentation on
        this family, at n = 12, 15, 17 and 18, from which the margin would be
        computed.
      citation: EXP-DREG-001
      provenance: internal
      verified_by: >-
        TASK-20260904-c063e5 coordinator. DIRECTORY LISTING ONLY, Glob tool,
        2026-09-04, confirming that runs exist at those sizes with
        raw-result.json and manifest artifacts. NO artifact content was read
