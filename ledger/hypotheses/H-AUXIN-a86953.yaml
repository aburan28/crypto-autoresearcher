  title: >-
    At 56 bits and divisor 65536 the stage counts and the gain
    fractions are fixed
  statement: >-
    The square root of 65536 is 256. Twice 256 is 512, and 512 is 2
    to the 9. At 56 bits the double-and-add count is 84, the width-4
    count is 14, and the width-8 count is 7. Five fourths of 2 to the
    20 is 1310720. Five to the 10 exceeds 8 times 4 to the 10 by
    1377017, and 16 times 4 to the 10 exceeds 5 to the 10 by 7011591.
    The gain at 84 additions is 9984 over 4375. That fraction exceeds
    2 by 1234 over 4375 and falls short of 12 over 5 by 516 over
    4375. The gain at 7 additions is 119808 over 4375. That fraction
    exceeds 24 by 14808 over 4375. On the null square at 7 additions,
    4380480000 exceeds 3234765625 by 1145714375, and 1752192 falls
    short of 19140625 by 17388433.
  mechanism: >-
    The proposal prices a memory-charged Cheon walk by a stage-1
    multiple of a square root, a stage-2 multiple of another square
    root, and a gain fraction. This contract checks those products
    at one bit length. It does not build a curve and it does not
    run a walk.
