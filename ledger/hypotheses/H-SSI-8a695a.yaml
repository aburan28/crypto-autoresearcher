      verified_by: coordinator, this design session, via knowledge/techniques/KN-TECH-028.md
    - ref: KN-TECH-024
      provenance: internal
      claim: >-
        The opened note states that the supersingular ell-isogeny
        graph is (ell+1)-regular and that generic path-finding is
        about O(p^{1/2}) classically and O(p^{1/4}) on the F_p
        subgraph. It has no table of loops at p = 43.
      verified_by: coordinator, this design session, via knowledge/techniques/KN-TECH-024.md
    - ref: KN-OPEN-013
      provenance: internal
      claim: >-
        The opened note says endomorphism-ring computation and isogeny
        path-finding are equivalent under GRH, and it reports no
        sub-p^{1/4} generic attack. This hypothesis computes neither.
      verified_by: coordinator, this design session, via knowledge/open-problems/KN-OPEN-013.md
    - ref: KN-LIT-078
      provenance: internal
      claim: >-
        The opened note reports full-graph meet-in-the-middle at
        expected Õ(p^{1/2}) time and space, and Õ(p^{1/4}) on the
        F_p-rational subgraph.
      verified_by: coordinator, this design session, via knowledge/literature/KN-LIT-078.md
