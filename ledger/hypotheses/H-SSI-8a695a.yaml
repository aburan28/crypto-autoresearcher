hypothesis:
  id: H-SSI-8a695a
  question_id: RQ-SSI-001
  source_idea: IDEA-20261006-9d9d22
  title: >-
    The smallest prime self-isogeny degrees of the first two
    supersingular j-invariants in F_{43^2} differ inside {2, 3, 5, 7, 11}.
  statement: >-
    Let F_{43^2} = F_43[α]/(α^2 - d) with d the smallest positive
    quadratic nonresidue modulo 43. Order elements a + b α by b, then
    a, with a, b in 0..42. Let j1 and j2 be the first two supersingular
    j-invariants in that order, tested by the trace of Frobenius of one
    short-Weierstrass model being divisible by 43. For ℓ in
    {2, 3, 5, 7, 11}, ℓ occurs at j when some cyclic kernel of order ℓ
    has Vélu codomain of the same j. Let λ(j) be the smallest occurring
    ℓ, or 0 if none of the five occur. The claim is λ(j1) ≠ λ(j2).
  mechanism: >-
    Equality of λ(j1) and λ(j2) means these two vertices are not
    separated by the smallest prime, inside a five-prime cap, at which
    a self-isogeny exists. Inequality means the cap sees different
    smallest primes. Either outcome is a toy gate on two integers in
    {0, 2, 3, 5, 7, 11}. Neither outcome computes a maximal order, runs
    a quaternion path, or produces a connecting ideal. The exponent
    delta against the opened Õ(p^{1/4}) baseline is 0.
  assumptions:
    - p = 43 is prime. The test checks that.
    - A j in F_{43^2} is supersingular when one short-Weierstrass model of that j has F_{43^2}-Frobenius trace divisible by 43.
    - For j not in {0, 1728}, the model is y^2 = x^3 + 3 k x + 2 k with k = j / (1728 - j). For j = 0 the model is y^2 = x^3 + 1. For j = 1728 the model is y^2 = x^3 + x. The rebuilt j must equal the input j.
    - λ uses only the five primes 2, 3, 5, 7, 11. A self-isogeny of some other degree is invisible and yields 0 if none of the five occur.
  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
    not_applicable_reason: >-
      This is a toy measurement of two bounded integers, not a proof
      or an endomorphism-ring algorithm.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        At p = 43, λ(j) for a supersingular j imitates the smallest
        prime norm of a non-scalar endomorphism, restricted to
        {2, 3, 5, 7, 11}, with 0 meaning the set misses. The imitation
        is not a theorem. The sample is two vertices and five primes.
        No transfer to another prime is claimed.
      random_model_justification: >-
        No uniform-random model is asserted. The prime, the lex order,
        and the five-prime cap are fixed. Sample size two has no tail
        probability.
      supporting_results:
        - >-
          KN-TECH-028, opened this session, identifies the endomorphism
          ring with a maximal order under the Deuring correspondence.
          KN-TECH-024, opened this session, makes self-isogenies edges
          of the supersingular ell-isogeny graph. Neither note computes
          λ at p = 43.
      validation_experiment_ids:
        - EXP-SSI-018d89
      falsification_condition: >-
        The census is defined and λ(j1) equals λ(j2), including the
        pair (0, 0). That refutes λ(j1) ≠ λ(j2) inside this cap. It
        does not refute the Deuring dictionary.
  structural_ingredients:
    - description: >-
        The Deuring correspondence identifies supersingular curves over
        F_{p^2} with maximal orders. KLPT finds an equivalent ell-power
        ideal in heuristic polynomial time once a connecting ideal is
        given.
      citation: KN-TECH-028
      provenance: internal
      verified_by: coordinator, this design session, via knowledge/techniques/KN-TECH-028.md
      role: opened dictionary; this measurement produces no connecting ideal
    - description: >-
        The supersingular ell-isogeny graph is (ell+1)-regular.
        Generic path-finding is about O(p^{1/2}) classically and
        O(p^{1/4}) on the F_p subgraph.
      citation: KN-TECH-024
      provenance: internal
      verified_by: coordinator, this design session, via knowledge/techniques/KN-TECH-024.md
      role: baseline regularity and path-finding cost that this measurement does not change
    - description: >-
        Full-graph meet-in-the-middle is expected Õ(p^{1/2}) time and
        space, and Õ(p^{1/4}) on the F_p-rational subgraph.
      citation: KN-LIT-078
      provenance: internal
      verified_by: coordinator, this design session, via knowledge/literature/KN-LIT-078.md
      role: opened cost baseline; those algorithms are not run
  predictions:
    - metric: absolute difference |λ(j1) - λ(j2)|
      direction: different
      minimum_effect: 1
  test_boundary:
    instances:
      - the first two supersingular j-invariants in F_{43^2} in the stated order
    parameters:
      p: 43
      primes: [2, 3, 5, 7, 11]
      field: F_43[alpha]/(alpha^2 - d)
      order: b then a
    implementation: >-
      No committed self-isogeny λ census exists. The missing driver
      builds F_{43^2} with the smallest positive quadratic nonresidue
      d modulo 43, scans j = a + b α in order of b then a, keeps the
      first two supersingular j, and for each and for ℓ in
      {2, 3, 5, 7, 11} tests a Vélu self-isogeny. harness/isogeny_class.py
      velu_odd refuses even ell, including ell = 2.
      harness/endosweep/explicit.py division_polynomials takes one
      prime-field model (p, a, b) and does not scan F_{43^2}.
    budget:
      maximum_memory_gb: 1
      maximum_runs: 1
  falsification_conditions:
    - λ(j1) equals λ(j2), including the pair (0, 0), while the census is defined.
    - Fewer than two supersingular j-invariants exist in F_{43^2}, so the inequality is not tested.
    - A rebuilt model does not reproduce its input j.
    - A kernel accepted as order ℓ fails the dual restoration check.
  interpretation_limits:
    - Two vertices at p = 43, five primes. No transfer to a SQIsign parameter set.
    - Equality inside the cap removes this separation for this pair. It does not say the endomorphism-ring problem is easy or hard.
    - Inequality is a difference of two integers in {0, 2, 3, 5, 7, 11}. It is not KLPT and it is not a path.
    - A shared 0 maps every self-isogeny degree outside the cap to the same value. It does not assert that the endomorphism rings are equal.
    - Exponent delta against Õ(p^{1/4}) in the opened notes is 0.
  status: specified
  proposed_by: coordinator
  citations:
    - ref: IDEA-20261006-9d9d22
      provenance: internal
      claim: >-
        The proposal states the prediction |λ(j1) - λ(j2)| >= 1, with
        the negative outcome λ(j1) = λ(j2), including (0, 0). The
        question id is RQ-SSI-001.
      verified_by: coordinator, this design session, via ledger/proposals/IDEA-20261006-9d9d22.yaml
    - ref: KN-TECH-028
      provenance: internal
      claim: >-
        The opened note states the Deuring dictionary and that KLPT
