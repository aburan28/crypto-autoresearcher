hypothesis:
  id: H-SPR-71a843
  question_id: RQ-SSI-001
  proposal_id: IDEA-20260806-b7fdc3
  added: '2026-08-06'
  statement: >-
    No surviving supersingular assumption in RQ-SSI-001 scope (CGL
    path-finding, SQIsign's endomorphism-ring foundation, the CSIDH class-group
    action) publishes data that simultaneously supplies (i) an O-orientation
    EVALUABLE on torsion and (ii) a cyclic subgroup of order m > 2 with
    m | Delta_O -- the two inputs the isogeny-compatible self-pairing of
    KN-LIT-7489 requires. Separately and independently: on any cyclic subgroup
    whose order is coprime to Delta_O the pairing is trivial, exactly, with no
    exceptions.
  mechanism: >-
    KN-LIT-7489 proves that a non-trivial self-pairing with cyclic domain,
    compatible with isogenies between O-oriented curves, has order m dividing
    Delta_O (with stated 2-adic refinements). Two things follow and only the
    first is a research claim.
    (1) THE SCREEN. Evaluating the pairing needs the orientation to ACT on the
    relevant torsion, not merely to exist -- every supersingular curve is
    oriented by some order, so an existence check is vacuous. The claim is that
    the evaluability requirement is what empties the screen: CGL publishes only
    j, SQIsign keeps its auxiliary data in the secret key, and CSIDH's
    Delta_O = -4p or -p has small divisors m in {1, 2, 4} plus the divisors of
    p, so even where an orientation exists the exposed m is bounded.
    (2) THE FORCED NULL. m coprime to Delta_O forces triviality by the
    divisibility constraint itself. This is derivable before measurement and is
    what makes the instrument able to fail.
  assumptions:
    - >-
      The divisibility constraint m | Delta_O as transcribed in the corpus entry
      matches the primary text. NOT verified in this session; Stage 0 verifies
      it and the hypothesis is void without it.
    - >-
      "Surviving assumption" is the post-SIDH set already scoped in RQ-SSI-001.
      No claim is made about oriented variants (OSIDH-style) that deliberately
      publish orientation data; those are named as the successor scope.
    - >-
      Toy-scale orientations have small discriminants with many divisors, so the
      toy EXPOSED rate is expected to be far higher than at deployed parameters.
      Toy results bound the instrument only.
  proof_search_map:
    not_applicable_reason: >-
      Screening and derivation, not a proof-oriented proposal. No theorem,
      asymptotic bound, certificate family, reduction or closure argument is
      claimed; the one derived quantity (triviality for m coprime to Delta_O) is
      a direct consequence of the cited divisibility statement and is used as a
      control rather than as a result.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-SPR-1
      formal_statement: >-
        For fixed p and a fixed O-orientation, the self-pairing value s(E, C) is
        distributed as a uniformly random element of mu_m as the secret ideal
        class varies over Cl(O); consequently the collision rate of the value
        across distinct classes is 1/m.
      random_model_justification: >-
        Isogeny-compatibility makes the value a class function on the orbit, and
        the orbit is a torsor under Cl(O); the assumption is that the induced map
        Cl(O) -> mu_m is close to equidistributed, imitating the equidistribution
        of a non-trivial character on a large cyclic group.
      supporting_results:
        - KN-LIT-7489, supplying the divisibility constraint and compatibility law
        - KN-TECH-027, supplying the class-group action and torsor structure
      validation_experiment_ids: [EXP-SPR-f90830]
      falsification_condition: >-
        Measured collision rate departing from 1/m by more than a factor 2 at any
        tested (p, m). A rate materially BELOW 1/m would mean the invariant
        separates more than the divisibility bound allows and is the one
        observation that would make this line exponent-relevant.
  structural_ingredients:
    - description: >-
        Isogeny-compatible self-pairings on O-oriented curves, with order
        dividing the orientation discriminant.
      citation: KN-LIT-7489 (Castryck, Houben, Merz). RECALLED FROM THE CORPUS
        ENTRY ONLY; primary text not read in this session.
      role: supplies the invariant and its forced divisibility constraint
    - description: The CSIDH class-group action and its orientation by Z[sqrt(-p)].
      citation: KN-TECH-027
      role: supplies the one scoped assumption where an orientation is public
  reduction_chain:
    core_problem: >-
      Whether any surviving supersingular assumption exposes a computable
      orientation-sensitive invariant.
    corollaries: []
  predictions:
    - metric: assumptions in scope with verdict EXPOSED
      direction: different
      minimum_effect: >-
        0 of 3. A single EXPOSED row is a material result; 0 of 3 with all five
        screen fields filled is a scoped closure. Both are reportable and the
        record commits to reporting either.
    - metric: self-pairing value on a cyclic subgroup of order coprime to Delta_O
      direction: different
      minimum_effect: exactly trivial, zero exceptions across all tested (p, m)
    - metric: collision rate of the pairing value across distinct secret classes
      direction: different
      minimum_effect: within a factor 2 of 1/m
  test_boundary:
    instances: >-
      O-oriented supersingular curves at p in {103, 251, 419, 1019}, orientations
      constructed by CM with small discriminants, vertex set built by two
      independent constructions required to agree exactly.
    parameters:
      primes: [103, 251, 419, 1019]
      m_values: all divisors of each Delta_O, plus at least three values coprime to it
      screen_targets: [CGL path-finding, SQIsign, CSIDH]
    implementation: >-
      Pairing evaluation per the primary text obtained at Stage 0; no
      implementation is written before that text is in hand.
    budget:
      total_cpu_hours: 8
      maximum_memory_gb: 4
  falsification_conditions:
    - >-
      Stage 0 finds the transcribed constraint wrong or inapplicable to this
      setting. The record is superseded, not amended.
    - The arithmetic null returns a non-trivial pairing. Instrument failure; halt.
    - >-
      The unoriented-curve null returns any value. The screen is not tracking
      orientation; halt.
    - >-
      Any assumption in scope scores EXPOSED with all five fields filled. The
      hypothesis is refuted and a successor proposal costs the resulting leakage.
  interpretation_limits:
    - >-
      A NOT_EXPOSED verdict closes the exact assumption, parameter set and
      published-data inventory examined. It is not a hardness claim.
    - >-
      An EXPOSED verdict is a leakage bound of at most log2(m) bits, not an
      attack.
    - >-
      Nothing here bears on plain prime-field ECDLP; H050 in
      ledger/REVIEW-H100-20260717.md remains the standing answer there.
    - >-
      The corpus marks KN-LIT-7489 citation_verified: read, but KN-OPEN-3f7a21
      records that this marking is unreliable across the corpus. Stage 0 exists
      because of that and no conclusion precedes it.
  status: specified
  proposed_by: idea-generator
  specified_by: coordinator
  specified_at: '2026-08-06'
