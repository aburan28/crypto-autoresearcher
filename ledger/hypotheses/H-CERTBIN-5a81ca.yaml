# =============================================================================
# H-CERTBIN-5a81ca -- HOLD-X6 trace-spectrum factor base V_E at prime n
# (Frobenius-stable, ANF degree <=3 after descent). Specified from
# IDEA-20260926-bbf2ed under RQ-CERTBIN-836ce2 / GOAL-ECDLP2M-001.
# Approved DEC-20261002-ffd20b.
#
# Certificate shortlist HOLD-X6 (DEC-20260928-63addc rank 15). Consolidates
# IDEA-20260926-b6cc43 (Hamming-ball arm as the other rotation-invariant
# sibling; three-arm contract). ZERO RUNS in this design packet. No AUXIN.
# No Bedrock. No curve attack / exponent claim. Claim tier: control /
# measurement. Stages 0-4 authorized for Cells A+B; Cell C design_after.
# =============================================================================
hypothesis:
  id: H-CERTBIN-5a81ca
  question_id: RQ-CERTBIN-836ce2
  source_idea: IDEA-20260926-bbf2ed
  experiment_id: EXP-CERTBIN-3af5f4
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-ffd20b
  status: approved
  proposed_by: coordinator
  title: >-
    Trace-spectrum factor base V_E = Phi_E^{-1}(0) is a Frobenius-stable
    non-linear base whose per-attempt closure cost at matched |F| sits in
    the H_cheap band [0.5, 2] vs a size-matched subspace (or H_dear above
    2 / lower refutation), with Walsh/Arf size identity exact and ball /
    random-quadric / ordinary-curve controls blocking artifacts

  statement: >-
    CLAIM (control / measurement; HOLD-X6; NO ATTACK). Setting: binary
    fields F_{2^n}, n in {17,19}; RC-1 ordinary curve and the n=19 Koblitz
    sibling; m=2; factor-base descriptions compared at matched |F|.
    HYPOTHESIS: (A) For E a set of cyclotomic classes of 2-weight <=3,
    V_E = {x : Tr(x^e)=0 for e in E} is Frobenius-stable (union of orbits),
    has ANF degree wt_2(e) after Weil descent, and admits O(n) membership.
    (D) For quadratic E the Walsh/Arf formula of IDEA-20260926-bbf2ed claim
    (D) equals the exhaustive |V_E| exactly at every toy cell. (H_cheap /
    H_dear) At matched |F|, the per-attempt closure work of the trace arm
    vs the subspace arm at D<=5 lies in [0.5, 2] with equal refutation rate
    (H_cheap) or exceeds 2 / lower refutation (H_dear). (INV) Trace vs
    random-quadric ratio in [0.67, 1.5] (invariance invisible to the
    solver) unless a replicated surprise below 0.5. Blocking controls:
    RC-1 reproduction on RC-1's own V before any trace cell; Walsh/Arf
    identity; oracle-vs-closure agreement; Koblitz relations-per-hit = n
    for stable arms; ordinary-curve same-field null (cost within 1.5x of
    Koblitz). Ball arm from IDEA-20260926-b6cc43 Cell A is the sibling
    invariant-family control. CLAIM TIER: measurement. NO exponent. NO
    ECC2K-130 break. NO Magma/Sage/AUXIN. n=131 sizing is arithmetic + H1
    only.

  mechanism: >-
    OBJECT FRAME. Representation R1 (abscissa as field element;
    basis-independent; rotation-invariant in a normal basis). Operation
    set Sigma = {Frobenius, negation} plus Class-I partial-action
    translation by factor-base elements. Tracked object: per-attempt
    closure work and refutation rate under the descended constraints
    Phi_E(x_i)=0, against size-matched subspace / random-quadric / ball /
    random-set descriptions. Trichotomy: Class I for the relation vector;
    Phi_E itself is a Class-III coordinate description used as a factor
    base (docs/object-frame-ideation.md §4). Lossy projection: partial
    spectrum retains |E| bits of the orbit canonicaliser and discards
    n-|E|; Sigma-compatible because sigma fixes every Tr(x^e). WHAT IS
    NEW relative to b6cc43 (symmetric-function / Hamming-ball end of the
    same family) and 9abf42/47da4e (stable subspaces / orbit unions with
    shift): the partial trace spectrum as a factor-base description, the
    65-quadratic-class limit at n=131 forcing cubics at |E|=98, and the
    exact Walsh/Arf size formula for quadratic E. Charged stages:
    factor-base membership and relation decomposition — not an ECDLP
    solve at n=131.

  assumptions:
    - >-
      Normal basis constructed per toy n; rotation-invariance of each
      Tr(x^e) checked numerically (instrument check).
    - >-
      OFF-LIMITS: F2 family; GGMP orbit reduction as a component;
      KR-IC-f5c584 e=1 trace morphism excluded from E (or as parity only).
    - >-
      Two m=4 per-attempt budgets (2^30.6 orbit-reduced; 2^5.73 no-orbit)
      cited with sources; this record does not adjudicate between them.
    - >-
      Executable work is toy-tier Cells A+B only; Cell C (m=3) and n=131
      are out of authorized scope; n=131 figures are arithmetic + H1.
    - >-
      WDSat/CaDiCaL XOR-aware SAT arm is declared missing and is not a
      success path under this card.

  proof_search_map:
    bottleneck: >-
      Per-attempt decomposition cost under m x |E| trace-form constraints
      of degree <=3 on n free bits per block, against a size-matched
      subspace and against the Hamming ball's cardinality constraint.
    baseline_embedding:
      parameter_slice: >-
        E empty = whole field; E={1} = trace hyperplane (subspace);
        RC-1 subspace V={deg<9} at n=17 is the affine matched-size slice;
        Hamming ball B_3 (b6cc43 Cell A, |B_3|=834) is the
        symmetric-function slice of the same rotation-invariant family.
      reproduction_check: >-
        Instrument MUST reproduce RC-1 recorded closure statistics on
        RC-1's own V (KN-FIND-5a8d3e / DEC-20260926-cb4487) before any
        trace cell is read; exhaustive oracle MUST agree with closure
        verdict on every counted instance; Walsh/Arf MUST equal
        exhaustive |V_E| exactly for every quadratic E (zero tolerance).
    observation_collision:
      observable: >-
        Per-attempt closure work (rows to certificate) and refutation
        rate at D<=5 per arm at matched |F|; exact |V_E| per cell.
      distinct_preimage_search: >-
        A dearer trace arm could be dearer from (i) degree 2/3 (genuine
        H_dear), (ii) n free bits vs l, or (iii) 98 extra equations.
        Random-quadric isolates invariance; hybrid U ∩ V_{E'} isolates
        marginal cost per nonlinear constraint; ball gives degree-4 vs
        degree-2 within the invariant family; ordinary curve nulls
        curve-structure confounds of a field-level set.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "x_i in V" (l affine bits) by "Phi_E(x_i)=0" (n bits +
          |E| ANF equations of degree wt_2(e)).
        predicted_gain: >-
          Removes one-hot shift overhead and applies GGMP constants on a
          base that exists at n=131, with constraint degree 3 rather than
          the ball's 7; no exponent.
      - transform: observable_fiber
        proposed_object: >-
          Hold |F| fixed; vary description across subspace, trace,
          random-quadric, ball, random-set.
        predicted_gain: >-
          Separates usable algebraic description from opacity and
          invariance-visible-to-solver from not.
    quantifier_order: >-
      EXISTS toy cells (n=17 Cell A; n=19 Cell B) at which the trace arm's
      closure work and refutation rate are measured against the four
      controls. NO forall claim; H_cheap/H_dear are readings of the
      measured ratio; n=131 sizing is arithmetic + H1.
    method_ceiling:
      strongest_certifiable_claim: >-
        At n in {17,19}, m=2, matched |F|, the trace-spectrum system costs
        [ratio] of the subspace / random-quadric systems in closure work
        at D<=5, refutes [rate], and |V_E| is [exact] against 2^{n-|E|};
        on the Koblitz cell every hit yields exactly n relations. Nothing
        about m=4, |E|=98, cubic classes at n=131, or a SAT engine.
      nearby_object_control: >-
        BLOCKING ordinary same-n curve (RC-1 at 17; BRIEF n=19 cell) must
        show same per-attempt cost as Koblitz (within 1.5x) and no
        relation multiplication; ball / random-quadric / random-set /
        RC-1 reproduction / Walsh/Arf identity.
    proof_obligations:
      - claim: Tr(x^e) is Frobenius-invariant with ANF degree wt_2(e); V_E is a union of Frobenius orbits.
        responsibility: correctness
      - claim: At n=131 exactly 65 quadratic and 2795 cubic classes; at n=17 exactly 8 quadratic classes (re-derived in Stage 0).
        responsibility: size
      - claim: Radical of every nonzero Q_c at n=131 is {0,1} and the Walsh/Arf count of claim (D) follows.
        responsibility: correctness
      - claim: Walsh/Arf equals exhaustive count at every quadratic toy cell.
        responsibility: baseline
      - claim: Instrument reproduces RC-1 on RC-1's own V before any trace cell.
        responsibility: baseline
      - claim: Every counted decomposition has a curve-arithmetic certificate; every refutation a verifier-accepted closure certificate.
        responsibility: correctness
      - claim: Five arms at matched |F| within factor 1.5 (random-set exact).
        responsibility: interface
      - claim: No exponent claimed; n=131 row is arithmetic + H1.
        responsibility: scope
    not_applicable_reason: null

  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        For E a set of |E| cyclotomic classes of 2-weight 2 or 3 with
        |E| <= n-20, |V_E| = 2^{n-|E|}(1+delta) with |delta| <= 1/2; at
        n=131, |E|=98, |V_E| within factor 1.5 of 2^33.
      random_model_justification: >-
        Quadratic E: exact formula of claim (D) gives |delta|<=1 with
        Arf-sign sum; cubic E imitates equidistribution of joint values
        of degree-<=3 Boolean functions (no Weil-type control at these
        parameters — same risk as cafcf1 for abscissa indicator).
      supporting_results:
        - IDEA-20260926-bbf2ed claim (D); Dickson / quadratic-form character sums (recalled until retrieved).
      validation_experiment_ids: [EXP-CERTBIN-3af5f4]
      falsification_condition: >-
        Exhaustive |V_E| outside [2^{n-|E|}/1.5, 2^{n-|E|}*1.5] at a toy
        quadratic cell is a measured Arf-sum deviation (reported into
        H1 tail), not by itself an instrument defect; Walsh/Arf mismatch
        of even 1 IS an instrument defect (O-ARTIFACT).
    - id: H_cheap
      formal_statement: >-
        At matched |F|, m=2, D<=5, trace/subspace closure-work ratio in
        [0.5, 2] and refutation rates equal within sampling error.
      random_model_justification: >-
        Trace-form constraints of degree <=3 do not inflate Macaulay /
        mutant work beyond a small constant vs affine subspace
        constraints at matched size (program's standing null for
        description-blind closure cost).
      supporting_results:
        - IDEA-20260926-bbf2ed predictions; same band as IDEA-20260926-b6cc43 for comparability.
      validation_experiment_ids: [EXP-CERTBIN-3af5f4]
      falsification_condition: >-
        Ratio >2 or lower refutation rate at D<=5 on both n → H_cheap
        false (H_dear); bands fixed before any run.
    - id: H_INV
      formal_statement: >-
        Trace/random-quadric closure-work ratio in [0.67, 1.5] (invariance
        invisible to the solver).
      random_model_justification: >-
        Proposition B of IDEA-20260926-917981: closure depends on the SET
        and x_R; two different sets of the same degree/count should cost
        alike if invariance is invisible.
      supporting_results:
        - IDEA-20260926-917981 Proposition B; IDEA-20260926-bbf2ed predictions.
      validation_experiment_ids: [EXP-CERTBIN-3af5f4]
      falsification_condition: >-
        Ratio <0.5 at both n is a surprise reading; replicate before any
        cost promotion.

  predictions:
    - metric: exact |V_E| at n=17, E=all 8 quadratic classes, and Walsh/Arf recount
      direction: same
      minimum_effect: >-
        Within [341, 768] (factor 1.5 of 512) and IDENTICAL between the
        two instruments; mismatch of 1 → O-ARTIFACT.
    - metric: exhaustive-oracle decomposition rate per arm, n=17, matched |F|
      direction: same
      minimum_effect: >-
        Within sampling error across five arms; >2x trace-vs-random-set
        surprise must be replicated before reading.
    - metric: closure work, trace/subspace, unsat targets, n=17 m=2 D<=5
      direction: higher
      minimum_effect: >-
        H_dear if ratio >2 with lower refutation; H_cheap if ratio in
        [0.5,2] with equal refutation. Bands fixed; same as b6cc43.
    - metric: closure work, trace/random-quadric, same cell
      direction: same
      minimum_effect: Within [0.67, 1.5]; below 0.5 at two n is surprise.
    - metric: relations per hit on Koblitz cell, stable vs non-stable arms
      direction: different
      minimum_effect: >-
        Exactly n for trace and ball; exactly 1 for subspace and
        random-quadric; any other value → O-ARTIFACT.

  test_boundary:
    instances:
      - stage0_derivations: >-
          Re-derive class counts (8/9/65/2795), radical argument, Walsh/Arf
          formula; freeze falsification bands and arm-matching rules into
          stage0/preregistered-predictions.json.
      - stage1_rc1_reproduction: >-
          Unchanged RC-1 pipeline on RC-1 subspace V; reproduce recorded
          closure statistics (blocking).
      - stage2_sizes: >-
          Exhaustive |V_E| and Walsh/Arf recount for every quadratic E;
          sizes of all five arms at matched |F|.
      - stage3_oracle: >-
          Exhaustive m=2 oracle per arm with curve-arithmetic certificates
          (200 targets/arm/cell, seeds 2026092681..).
      - stage4_closure: >-
          Closure at D<=5 per arm; rows eliminated, refutation rate,
          verifier acceptance; Koblitz relations-per-hit.
      - cell_A: >-
          RC-1 n=17, f=t^17+t^3+1, A=97044, B=126251, m=2; subspace
          V={deg<9}; trace E_q=all 8 quadratic classes; random-quadric;
          ball B_3; random-set; hybrid optional.
      - cell_B: >-
          Koblitz n=19, f=t^19+t^5+t^2+t+1, |G|=130873 (re-count);
          ordinary n=19 control A=46693,B=306147; E_q=all 9 quadratic
          classes vs random dim-10 subspace + ball.
      - cell_C_not_authorized: >-
          n=17 m=3 l=6 with cubic classes — design_after; not authorized.
    parameters:
      m: 2
      n_cells: [17, 19]
      D_max: 5
      targets_per_arm: 200
      seeds_base: 2026092681
      cheap_band: [0.5, 2.0]
      inv_band: [0.67, 1.5]
    implementation: >-
      experiments/EXP-CERTBIN-3af5f4/implementation/ reading
      experiments/EXP-CERTBIN-e94b27/impl/{gf2n,curve,macaulay,closure,oracles_rc1}.py
      (copy/wrap under write_scope; generalise to n=19, supplied basis, n
      free bits/block). NEW: trace-form ANF builder, Walsh/Arf counter,
      normal-basis constructor (~200 lines, pure Python). No Magma/Sage/
      cypari2; no AUXIN; no Bedrock; no WDSat/CaDiCaL as success path.
    budget:
      maximum_runs: 8
      total_cpu_hours_advisory: 8.0
      wall_clock_seconds_advisory: 28800

  falsification_conditions:
    - Stage 1 fails to reproduce RC-1 → O-ARTIFACT; nothing read.
    - Walsh/Arf ≠ exhaustive at any quadratic cell → O-ARTIFACT.
    - Oracle and closure disagree on any instance → O-ARTIFACT.
    - >-
      Trace/subspace ratio >2 or lower refutation at D<=5 on both n →
      H_cheap false (H_dear / O-H-DEAR).
    - >-
      Koblitz vs ordinary trace cost differ by >1.5x → O-ARTIFACT until
      explained.
    - Relations-per-hit ≠ n on Koblitz trace/ball → O-ARTIFACT.
    - Claiming any ECDLP speedup, exponent move, or ECC2K-130 break under this card.

  interpretation_limits:
    - Toy tier; m=2; two cells; nothing about m=4 / |E|=98 / n=131 beyond arithmetic + H1.
    - KN-OPEN-020 high-degree implicit membership class declared; universal statement untouched.
    - Best case is constant-factor (shift overhead + GGMP on a base that exists); building-block, not target-class (profile rule A1).
    - Exact size formula (D) covers quadratic E only; cubics counted, never derived.
    - Cell C and XOR-aware SAT arm are design_after / missing.

  distinguishable_outcomes:
    - id: O-H-CHEAP
      meaning: >-
        Stage 1 pass; Walsh/Arf identity exact; oracle=closure; Koblitz
        relations-per-hit = n; ordinary cost within 1.5x; trace/subspace
        ratio in [0.5,2] with equal refutation at both n: V_E enters the
        CERTBIN factor-base-choice column as a Frobenius-stable base with
        degree-3 constraints; n=131 m=4 solve remains unmeasured; no
        exponent.
    - id: O-H-DEAR
      meaning: >-
        Gates pass and ratio >2 or lower refutation at both n: V_E entered
        as dominated with the measured penalty; compare to ball's penalty
        to say whether degree or free-bit count is what the invariant
        family pays.
    - id: O-INV-SURPRISE
      meaning: >-
        Trace/random-quadric ratio <0.5 at both n: invariance appears
        visible to the solver; replicate before any cost promotion;
        otherwise treat as secondary reading beside O-H-CHEAP / O-H-DEAR.
    - id: O-ARTIFACT
      meaning: >-
        RC-1 reproduction fail, Walsh/Arf mismatch, oracle/closure
        disagree, relations-per-hit wrong, or Koblitz/ordinary cost split
        >1.5x: nothing else read.
    - id: O-IMPEDIMENT
      meaning: Budget/infra stop with measured quantity; never negative evidence.

  dominated_by: >-
    Checked row by row. Matched rho at 2^60.8 dominates every m=4 row until
    a per-attempt solve under the orbit-reduced 2^30.6 is demonstrated
    (analysis stops at n=23). Within the factor-base-choice column: the
    orbit-union subspace base (KN-FIND-47da4e) and the Hamming ball
    (b6cc43) are the siblings this record must beat / compare; plain
    subspace has no orbit reduction at n=131. The record claims no row of
    its own until measured; n/a (no result claimed) is the honest Pareto
    answer at design time.
  sota_delta:
    time: >-
      Zero exponent. Contribution: a second Frobenius-stable factor base
      of index-calculus size at n=131 with O(n) membership, constraint
      degree 3 rather than 7, the 65-quadratic-class limit, and an exact
      size formula for the quadratic sub-family — all pending measurement.
    memory: Zero until measured.
    data_queries: >-
      Against prior state: the rotation-invariant family is spanned at
      both ends (ball + trace), making "which Frobenius-stable set is
      cheapest" a three-arm measurement.

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
