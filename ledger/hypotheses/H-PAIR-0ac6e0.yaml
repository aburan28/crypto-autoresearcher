# H-PAIR-0ac6e0
# Stage-0 slot census for IDEA-20261006-bac9db.
# No sieve beyond the two named points.
hypothesis:
  id: H-PAIR-0ac6e0
  question_id: RQ-PAIR-f2e31f
  goal_id: GOAL-PAIR-001
  source_idea: IDEA-20261006-bac9db
  added: '2026-10-12'
  status: specified
  statement: >-
    With B = 7, the three-slot predicate on N_f, N_g, and a third
    cubic accepts both (1,4) and (2,8) when the third cubic is f, and
    rejects both when the third cubic is x^3 + 2. A repeated form
    occupies two slots. N_f(a,b) = a^3 + a b^2 + b^3 and
    N_g(a,b) = a^3 + a^2 b + b^3.
  test_boundary: >-
    Two named points, one duplicate, one treatment, the nearby cube
    (x+1)^3, and the control point (4,4). No second bound and no
    further point.
  mechanism: >-
    An integer is 7-smooth when trial division by 2, 3, 5, and 7
    leaves 1. The predicate accepts when at least two of the three
    slot values are smooth. Setting the third cubic equal to f copies
    a smooth value into a second slot. Setting it to x^3 + 2 inserts
    a value divisible by a prime larger than 7 at both named points.
  distinguishable_outcomes:
    - >-
      The controls hold, both duplicate indicators are true, and both
      treatment indicators are false.
    - >-
      The controls hold, and a duplicate indicator is false or a
      treatment indicator is true.
    - >-
      An expansion disagrees, or a control fails. That outcome
      invalidates the run.
  falsification: >-
    The controls hold and the duplicate/treatment pattern is not
    accept, accept against reject, reject.
  not_claimed: >-
    No polynomial is selected for a degree-12 field, and no cost is
    stated for a deployed prime.
