# =============================================================================
# H-ECDLP-cf55ba — specified from IDEA-20261006-b87de8 (bytes copied
# unchanged from origin/design/frob-1e54b5-theta). Question
# RQ-ECDLP-623a32. The prediction under test is the idea's own: on the
# first ordinary curve y^2 = x^3 + x + B over F_37, B in {1,...,18},
# |f-1/2| for the least-nonnegative y-half bit under affine doubling
# strictly exceeds the 99th percentile of 2000 size-matched
# relabelings. A finished comparison with |f-1/2| at most that
# percentile is the concrete negative. This record does not assert
# that the gap occurs.
# =============================================================================
hypothesis:
  id: H-ECDLP-cf55ba
  question_id: RQ-ECDLP-623a32
  source_idea_ids:
    - IDEA-20261006-b87de8
  added: '2026-10-06'
  status: approved
  proposed_by: coordinator
  title: >-
    Doubling agreement of the least-residue y-half bit on one ordinary
    curve over F_37
  statement: >-
    On the first B in {1,...,18} for which E: y^2 = x^3 + x + B over
    F_37 is nonsingular and has trace not divisible by 37, let S be
    the affine points with nonzero y, and let β be 0 when the least
    nonnegative residue of y is at most 18 and 1 otherwise. Let f be
    the fraction of P in S for which 2P is affine, y(2P) is nonzero,
    and β(2P) = β(P). The idea's prediction is that |f-1/2| is
    strictly above the 99th percentile of |f-1/2| on 2000 relabelings
    of β that preserve the two fibre sizes. A finished comparison in
    which that percentile is met or exceeded by the null, the negation
    control having passed and β∘doubling not being a function of β
    alone, is the concrete negative. No exponent improvement is claimed.
  mechanism: >-
    The tracked object is the agreement rate of one coordinate bit
    under the doubling semigroup, not under the full translation
    action. β keeps one bit of the least nonnegative y-residue and
    discards x and the rest of y. The priced gap is b = |2f-1| against
    a size-matched relabeling null. Loss L = 1 - 2/|S| is positive
    when |S| > 2. Negation is a control: β(-P) = 1 - β(P) on S. The
    bit is not asserted to be sum-compatible.
  assumptions:
    - >-
      β uses the least nonnegative residue in {0,...,36}. A signed
      residue is a different bit and is not scored.
    - >-
      The curve coefficient of x is 1. B is scanned from 1 through 18.
      Singular models and models with trace divisible by 37 are skipped
      before f is computed.
    - >-
      A point of S whose double is not an affine point of nonzero y
      contributes to the denominator of f and not to the numerator.
    - >-
      The 2000 relabelings are shuffles of the observed bit vector.
      They preserve the two fibre sizes. They do not redraw the curve.
  proof_search_map:
    bottleneck: >-
      Whether β(2P) agrees with β(P) more often than a size-matched
      relabeling. Removing the gap would leave a fair coin, not a
      faster discrete log.
    baseline_embedding:
      parameter_slice: >-
        Pollard rho exponent 1/2 on a prime-order subgroup, as stated
        in KR-RHO-13bf67. This measurement is one curve over F_37 and
        does not embed a rho implementation.
      reproduction_check: >-
        Recompute β(-P) = 1 - β(P) for every P in S, and recompute 2P
        from the affine slope and check that it lies on the curve.
    observation_collision:
      observable: >-
        The fibre of β, together with the agreement rate f under doubling.
      distinct_preimage_search: >-
        List two points in S with the same β and different images under
        β∘doubling, when both doubles lie in S. If no such pair exists,
        β∘doubling is a function of β and the branching label is wrong.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fibre of the least-residue y-half bit under doubling.
        predicted_gain: >-
          A numerical branching gap against a relabeling null. No
          exponent change.
    quantifier_order: >-
      There exists a first B in {1,...,18} such that E is nonsingular
      and the trace is not divisible by 37, and for that curve
      |f-1/2| is strictly above the 99th percentile of 2000
      size-matched relabelings.
    method_ceiling:
      strongest_certifiable_claim: >-
        A single toy frequency gap on one curve over F_37. Nothing
        about cryptographic field size or about collision time.
      nearby_object_control: >-
        A second independent draw of 2000 size-matched relabelings is
        recorded beside the first. The primary row uses the first draw
        only.
    proof_obligations:
      - claim: >-
          |f-1/2| exceeds the stated relabeling percentile on the
          selected curve, or it does not.
        responsibility: feasibility
      - claim: The exponent 1/2 is not changed by a one-bit frequency.
        responsibility: scope
    not_applicable_reason: >-
      This is a measurement of a branching frequency, not a theorem,
      bound, certificate, reduction, or closure. The map audits that
      measurement only.
  rerandomization: >-
    No re-randomizing walk is used. The 2000 relabelings are the null
    distribution of the bit on a fixed set S. They do not pull a
    discrete logarithm back to an input instance.
  asymptotic_claim:
    problem: prime-field ECDLP
    prior_best: Pollard rho at Theta(N^{1/2}) group operations
    time_exponent: '1/2, unchanged; this hypothesis does not move it'
    memory_exponent: O(1) distinguished-point memory, unchanged
    hidden_cofactor: none; no attack cost is proposed
    claim_kind: constant_factor
    claim_kind_note: >-
      The constant factor against rho is 1. claim_kind is filled so
      the non-claim is explicit. The separator is a toy frequency gap,
      not a cheaper discrete logarithm.
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        On the selected S, a uniform shuffle of a two-valued labeling
        with the observed fibre sizes has agreement numerator
        |2a-n| whose 99th percentile among 2000 draws lies within 2
        of the 99th percentile of the exact binomial law of |2X-n|
        for X binomial(n, 1/2), when the fibre sizes differ by at most
        1. No transfer to a larger prime is assumed.
      random_model_justification: >-
        The null is a finite uniform model on a fixed finite set. When
        the two fibres differ by at most 1, the idea names the binomial
        law at rate 1/2 as the exact comparison. KR-RHO-13bf67, opened
        in this session, is the complexity baseline, not a distributional
        theorem for this bit.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-2cd0ff
      falsification_condition: >-
        The Monte Carlo 99th percentile numerator and the exact-law
        99th percentile numerator differ by more than 2. That
        observation means the null is mis-specified. The frequency
        claim is then not scored. It is not itself the concrete
        negative.
  structural_ingredients:
    - description: >-
        A generic algorithm on a prime-order group needs Omega(sqrt(p))
        group operations. Baseline only. This hypothesis does not search.
      citation: KR-RHO-13bf67
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
      role: unchanged complexity baseline
    - description: >-
        Walking on plus-or-minus classes is a known rho constant with
        fruitless cycles. This hypothesis does not walk. Negation is
        only the check that β flips.
      citation: KR-RHO-fb88e6
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-fb88e6.yaml
      role: fence around the negation control
    - description: >-
        An automorphism of order m changes the rho constant by sqrt(m)
        and does not change the exponent 1/2. This hypothesis does not
        quotient by an automorphism.
      citation: KR-RHO-0528e7
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-0528e7.yaml
      role: fence around constant-factor rho improvements
    - description: >-
        GHS Weil descent maps ECDLP on E(F_{q^n}) to a hyperelliptic
        Jacobian and is effective only for special fields and curves.
        This measurement stays on F_37 and does not descend.
      citation: KR-IC-5ea2f8
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5ea2f8.yaml
      role: fence around cover attacks
    - description: >-
        Theorem C says an exactly sum-compatible bucket index on a
        prime-order group is a surjective homomorphism, impossible for
        1 < M < N. The half-bit is not asserted to be sum-compatible.
      citation: KN-FIND-ffe1df
      provenance: internal
      verified_by: knowledge/findings/KN-FIND-ffe1df.md
      role: fence, not a hypothesis under test
  reduction_chain:
    core_problem: toy agreement frequency of one y-half bit under doubling
    corollaries: []
  predictions:
    - metric: >-
        |f-1/2|, f the fraction of P in S with β(2P) = β(P) when 2P
        lies in S
      direction: higher
      minimum_effect: >-
        Strictly above the 99th percentile of |f-1/2| among 2000
        relabelings that preserve the two fibre sizes of β. A finished
        value at most that percentile is the concrete negative.
    - metric: branching b = |2f-1| and loss L = 1 - 2/|S|
      direction: different
      minimum_effect: >-
        b strictly larger than the same percentile converted by
        b = 2|f-1/2|, and L > 0 because |S| > 2.
  test_boundary:
    instances:
      - one ordinary short-Weierstrass curve over F_37
    parameters:
      prime: 37
      model: y^2 = x^3 + x + B
      B_scan: 1 through 18
      relabelings: 2000
      percentile_rank: 1980
      half_cut: 18
    implementation: >-
      Enumerate S, compute f exactly, draw 2000 size-matched
      relabelings and a second stream of 2000, compare the integer
      numerator |2a-n| with rank 1980 of the first stream, and compare
      that rank with the exact binomial quantile. No discrete-log search.
    budget:
      scientific_relabelings: 4000
      maximum_runs: 1
  falsification_conditions:
    - >-
      The selected curve is scored, negation passes, a branching pair
      exists, the null law matches within 2, and the curve numerator
      is less than or equal to rank 1980 of the first 2000
      relabelings. That finished comparison is the concrete negative.
    - >-
      No B in {1,...,18} yields a nonsingular curve whose trace is
      not divisible by 37.
    - >-
      β(2P) is a function of β(P) alone on S, so the branching
      placement is false and the percentile comparison is the wrong
      statistic.
  interpretation_limits:
    - >-
      A gap on F_37 is claim_tier toy. It does not change time exponent
      1/2 or memory exponent 0.
    - >-
      Passing the percentile test does not say the bit is useful in a
      walk. Failing it says this bit is consistent with a fair coin on
      this curve.
    - >-
      The bit is not claimed to be sum-compatible. Theorem C of
      KN-FIND-ffe1df is a fence.
    - >-
      KR-IC-5ea2f8 is a cover attack on E(F_{q^n}). This hypothesis
      does not map the curve to a hyperelliptic Jacobian.
    - >-
      A negation failure or a null-law mismatch blocks scoring. Neither
      is a percentile negative.
