hypothesis:
  id: H-SSIQ-545e66
  question_id: RQ-SSIQ-9702af
  added: '2026-08-25'
  derived_from_idea: IDEA-20260821-e99afd
  statement: >-
    THE EXPONENT IS alpha/3. Stated first, because this question's first constraint requires it -
    NO algorithm is claimed, NO exponent below 1/3 is claimed, and nothing whatever is claimed about
    whether p^{1/4} over F_{p^2} is reachable. What is claimed is an IDENTITY and a MEASUREMENT.
    (S1) THE IDENTITY. For the algorithm family A(T, DETECT) - re-randomise E to a uniform E' by a
    non-backtracking walk, run DETECT(E', T) which returns a separable isogeny E' -> E'^{(p)} of
    degree at most T when one exists and its side conditions hold, repeat until success, pull the
    solution back through the walk - if DETECT costs T^{alpha+o(1)} time and T^{mu+o(1)} memory then,
    under the conjugate-degree density law H1 and the inherited smoothness heuristic H2,
    E[time] = p^{1/2+o(1)} T^{alpha-3/2} for T <= (p/2)^{1/3} and T^{alpha+o(1)} above it. Hence for
    every alpha < 3/2 the minimum sits EXACTLY at the structural boundary T* = (p/2)^{1/3}, the TIME
    EXPONENT IS alpha/3 and the MEMORY EXPONENT IS mu/3.
    (S2) THE CALIBRATION, WHICH MUST COME OUT RIGHT OR THE IDENTITY IS VOID. Three published
    complexities must be reproduced by substituting three slices into the same formula - the
    field-of-definition test at T = 1 returning p^{1/2}; the incumbent list-based detector at
    alpha = mu = 1 and T = T* returning p^{1/3} in time and memory; and classical meet-in-the-middle
    for the two-curve problem at alpha = 1 and T = p^{1/2} returning p^{1/2}.
    (S3) THE DENSITY LAW IS MEASURABLE AND ITS NULL IS DIFFERENT. The density exponent is FORCED to
    3/2 for the Frobenius-conjugate target and 2.0 for a uniformly random target, so the two arms
    have DIFFERENT forced values and the instrument can be shown to see target structure rather than
    list growth.
    THE ARITHMETIC CONSEQUENCE, WHICH IS THE POINT - while alpha = 1 no choice of T moves the
    exponent, and exponent 1/4 through this family requires alpha <= 3/4. No mechanism meeting that
    is proposed here and none is claimed to exist.
  mechanism: >-
    The isometry between the conjugate-isogeny module with the degree form and a two-sided ideal with
    the reduced norm, together with the forced trace vanishing that collapses the module to a RANK-3
    trace-zero sublattice of determinant of order p for degrees below p/4, gives a ternary positive
    definite form. For such a form the number of vectors of norm at most T is of order T^{3/2} times
    the inverse square root of the determinant, so a single curve carries of order T^{3/2} p^{-1/2}
    conjugate isogenies of degree at most T. TWO INDEPENDENT CHECKS THAT THIS IS THE RIGHT
    NORMALISATION - it returns exactly 1 at T = (p/2)^{1/3}, reproducing the structural threshold as
    the point where a solution first becomes forced; and its total over all supersingular curves is a
    RIGOROUS FIRST MOMENT via the Deuring correspondence and the Eichler class-number formula, not a
    heuristic. The heuristic content is ONLY that the first moment is tight per curve. The cost
    bookkeeping is then the target profile's own shape - per-attempt cost times inverse success
    probability - and it is monotone decreasing in T below the boundary and increasing above it, so
    the interior optimum is the boundary and the total is p^{alpha/3+o(1)}. WHY alpha = 1 FOR EVERY
    DETECT ANYONE HAS WRITTEN DOWN - the incumbent materialises a list whose cardinality is linear in
    the radius and spends constant work per entry, so alpha = 1 is not an accident of tuning but the
    statement that the architecture pays ONCE PER CANDIDATE, and the list factors as degree
    uncertainty times kernel uncertainty, each contributing half the exponent. THE NEARBY OBJECT WHERE
    alpha < 1 PROVABLY HOLDS is T = 1, where membership is decided by a FIELD-OF-DEFINITION TEST at
    constant cost rather than by a search. That is not evidence that a larger stratum has such a
    characterisation, and none is claimed; it is the reason the question is open rather than closed,
    and it names the SHAPE of what would answer it - an arithmetic predicate on j rather than an
    enumeration.
  assumptions:
  - >-
    The rank-3 trace-zero determinant is of order p and not of order p squared. This single
    normalisation drives the exponent 3/2 and hence the whole identity - with determinant p squared
    the density would be T^{3/2}/p and the boundary would sit at T = p^{2/3}, contradicting the
    committed structural threshold. That contradiction is itself a consistency check and is why the
    normalisation is stated as an assumption rather than assumed silently.
  - >-
    DETECT's cost exponent alpha is well defined, i.e. the cost is T^{alpha+o(1)} with alpha
    independent of T over the range from p^{eps} to p^{1/3}. A DETECT whose cost is not a clean power
    of T breaks the closed form; the fitted-exponent design must then report a poor fit rather than a
    single alpha.
  - >-
    The re-randomising walk delivers a curve indistinguishable from uniform, so the density law may be
    applied to the walked curve. This is the frozen source's own assumption; the identity inherits it
    and does not strengthen it, and the spectral-gap question belongs to a different record.
  - >-
    The smoothness side condition contributes p^{-o(1)} uniformly over T of order p^{Theta(1)}. True
    for the frozen source's parameterisation; a DETECT with a different smoothness structure must
    re-derive it.
  - >-
    Every cost unit is declared once and used everywhere. The identity is invariant under a p^{o(1)}
    change of unit but a MEASURED alpha is not, and the frozen source's own unit - one field operation
    per table entry - is the one to match.
  proof_search_map:
    bottleneck: >-
      DETECT(E', T) - decide whether a supersingular curve admits a separable isogeny to its Frobenius
      conjugate of degree at most T, and produce it. EVERY exponent in the family is alpha/3 where
      T^{alpha} is this step's cost. The list construction of the incumbent is the only known
      implementation and it costs linearly in the number of objects it names.
    baseline_embedding:
      parameter_slice: >-
        THREE exact slices, not one. (alpha, mu, T) at the incumbent's values and the structural
        boundary reproduces the incumbent's p^{1/3+o(1)} time and memory. The field-of-definition test
        at T = 1 reproduces the polynomial-memory p^{1/2+o(1)} baseline as the frozen source states it.
        alpha = 1 at T = p^{1/2} reproduces classical meet-in-the-middle for the two-curve problem.
      reproduction_check: >-
        SYMBOLIC, AND IT IS THE EXPERIMENT'S STOPPING GATE. Substitute each slice into the exponent
        formula and require the published exponent to come out EXACTLY. A frozen ten-line regression
        fixture evaluates the formula at the three slices and asserts 1/3, 1/2 and 1/2. If any slice
        misses, NOTHING ELSE IS RECORDED.
    observation_collision:
      observable: 'The boolean verdict of DETECT together with its witness, as a function of (E'', T).'
      distinct_preimage_search: >-
        A COLLISION EXISTS AND IS NAMED HERE RATHER THAN DISCOVERED LATER. A smoothness-restricted
        DETECT returns FAIL both for a curve whose minimal conjugate degree exceeds T and for a curve
        whose minimal degree is at most T but is not smooth. Two ground-truth objects, one observable,
        one on each side of the density law. CONSEQUENCE, BINDING ON THE EXPERIMENT - the density
        exponent must be measured against TRUE minimal degree computed WITHOUT the smoothness
        restriction, and the cost exponent against the smoothness-restricted implementation. Conflating
        them measures the PRODUCT of two exponents and manufactures a spurious alpha. The separating
        condition is simply to compute the minimal degree exactly at toy scale by exhaustive
        small-degree search.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        The single scalar alpha, as the image of the whole lever map under the reduction 'algorithm
        family maps to (density exponent, detection-cost exponent)'.
      predicted_gain: >-
        NO COST GAIN. The gain is decision-theoretic and quantified - it replaces a qualitatively scored
        lever map with ONE number per candidate and an arithmetic target (alpha <= 3/4 for exponent 1/4,
        alpha < 1 for any improvement at all), and it retires the entire radius-sweep sub-family with a
        derivation instead of a fatigue report.
    - transform: stronger_invariant
      proposed_object: >-
        Carry the PAIR (alpha, mu) rather than time alone, so a candidate trading time for memory is
        scored on the plane against the van Oorschot-Wiener curve rather than against the incumbent point
        alone.
      predicted_gain: >-
        Prevents the standing failure mode in which a memory reduction is reported as progress while
        sitting above the tradeoff curve, and makes the admissibility test a SINGLE INEQUALITY,
        2 alpha + mu < 3. The incumbent sits EXACTLY on that curve, so both levers are live and neither
        is free.
    quantifier_order: >-
      FOR ALL eps > 0, FOR ALL sufficiently large p, FOR ALL supersingular E over F_{p^2}, IF THERE
      EXISTS an algorithm DETECT such that FOR ALL supersingular E' and all T in [p^{eps}, (p/2)^{1/3}]
      DETECT runs in time T^{alpha+eps} and returns a conjugate isogeny of degree at most T whenever the
      minimal one is smooth, THEN A(T*, DETECT) finds a non-scalar endomorphism in expected time
      p^{alpha/3+eps}, ASSUMING H1 and H2. THE ORDER THAT MATTERS - DETECT is quantified BEFORE the
      instance, so an alpha achieved by a DETECT allowed to depend on E, on its minimal conjugate degree,
      or on a seed does NOT enter the identity. This is the trap for any 'we guess the degree' proposal -
      a degree oracle specific to the instance is exactly the forbidden dependence, and the honest
      accounting charges the guess.
    method_ceiling:
      strongest_certifiable_claim: >-
        'alpha = 1 for every algorithm that materialises a list of cyclic isogenies of bounded degree
        from E and matches codomains.' That is a statement about ONE ARCHITECTURE, proved by counting the
        objects the architecture names. It is NOT a lower bound on alpha over all algorithms and this
        hypothesis must never be cited as one.
      nearby_object_control: >-
        T = 1, the field-of-definition stratum, where DETECT costs constant time and the identity returns
        the p^{1/2} baseline. The hoped-for conclusion 'detection at radius T must cost of order T' is
        KNOWN FALSE there. A method-ceiling argument that cannot see the difference between T = 1 and
        T = p^{1/3} has not identified the load-bearing structure - and the difference it must see is that
        the T = 1 stratum has a field-of-definition characterisation while the general stratum is, so far
        as this program knows, characterised only by a search.
    proof_obligations:
    - claim: 'Density: the proportion of curves with minimal conjugate degree at most T is of order T^{3/2} p^{-1/2} for 1 <= T <= (p/2)^{1/3}.'
      responsibility: size
    - claim: 'Per-attempt cost of DETECT is T^{alpha+o(1)} time and T^{mu+o(1)} memory, uniformly in T over the stated range.'
      responsibility: runtime
    - claim: 'A(T, DETECT) returns a non-scalar endomorphism when DETECT succeeds; the pullback through the walk preserves non-scalarity.'
      responsibility: correctness
    - claim: 'Per-attempt success probability equals density times smoothness.'
      responsibility: success_probability
    - claim: 'The three calibration slices reproduce the published exponents exactly.'
      responsibility: baseline
    - claim: 'The identity is stated over the algorithm family only and asserts no lower bound on alpha.'
      responsibility: scope
    not_applicable_reason: null
  rerandomization: >-
    The family's worst-to-average-case device is the non-backtracking walk of the frozen source's own
    algorithm, which re-randomises the input curve to one indistinguishable from uniform in a number of
    steps logarithmic in p, with the mixing justified by the expander property of the isogeny graph as
    cited there. The solution is pulled back to the input instance by composing with the inverse of the
    walk, and non-scalarity is preserved because the inseparable degree p factor cannot be cancelled by
    the separable walk. This device is INHERITED unchanged; this hypothesis does not strengthen it and
    the spectral-gap question belongs to a different record.
  asymptotic_claim: null
  asymptotic_claim_note: >-
    NULL AND REQUIRED TO BE. NO EXPONENT MOVES. At the incumbent's alpha = 1 the identity returns exactly
    the incumbent p^{1/3+o(1)} in time and memory. The deliverable is a REFORMULATION plus four measured
    exponents. The identity is SUFFICIENCY-ONLY - it converts an alpha into a cost, it does not bound
    alpha from below, and it may not be cited as a closure of any route. Any cost statement derived from
    it carries BOTH the frozen source's smoothness heuristic AND H1, and therefore sits at a STRICTLY
    WEAKER tier than the incumbent theorem itself; the unconditional tier remains p^{1/2} times a
    polylogarithmic cofactor at polynomial memory.
  heuristic_assumptions:
  - id: H1
    formal_statement: >-
      CONJUGATE-DEGREE DENSITY LAW. There exist absolute constants 0 < c1 <= c2 such that, for all
      sufficiently large primes p and all T with (log p)^2 <= T <= (p/2)^{1/3}, the proportion of
      supersingular elliptic curves over F_{p^2}, weighted by the inverse of the automorphism group
      order, admitting a separable isogeny to their Frobenius conjugate of degree at most T satisfies
      c1 T^{3/2} p^{-1/2} <= Pr[minimal conjugate degree <= T] <= c2 T^{3/2} p^{-1/2}. Equivalently, the
      number of lattice points of norm at most T in the rank-3 trace-zero conjugate lattice behaves, on a
      positive proportion of curves, like the volume heuristic for a ternary form of determinant of order
      p, and the first moment is tight PER CURVE up to constants.
    random_model_justification: >-
      TWO INGREDIENTS, COMPOSED AS THE TARGET PROFILE REQUIRES. (i) A RIGOROUS FIRST MOMENT - by the
      Deuring correspondence and the Eichler class-number/mass formula, the number of trace-zero elements
      of the relevant norm summed over the whole supersingular class set is a Hurwitz class number of
      known size; summing over degrees up to T and dividing by the class number gives expected count of
      order T^{3/2} p^{-1/2}. This is an AVERAGE and it is NOT heuristic. (ii) A CLASSICAL DISTRIBUTION
      THEOREM IT IMITATES - equidistribution of CM/Heegner points, which says the strata of fixed minimal
      conjugate degree spread over the supersingular set. H1 asks only that the count behave per curve as
      equidistribution plus a tight first moment would predict, exactly the role a classical smooth-number
      distribution theorem plays for the frozen source's own heuristic. BOTH INGREDIENTS ARE CARRIED AT
      PROVENANCE 'RECALLED' AND NEITHER HAS BEEN READ BY THIS PROGRAM, so H1 is an assumption with a
      literature-shaped justification and not a theorem. A consistency check requiring no reading - H1
      returns expected count exactly 1 at the structural boundary, reproducing the committed threshold.
    supporting_results:
    - >-
      Deuring correspondence and the Eichler class-number (mass) formula for the supersingular class set;
      RECALLED and UNVERIFIED in this program. A reviewer with retrieval should check the class-number
      weighting and the ternary lattice normalisation; if the weighting differs, the constant moves and the
      exponent 3/2 must be rechecked, which is exactly what the density measurement tests.
    - >-
      Equidistribution of CM/Heegner points; RECALLED and UNVERIFIED. Named as the classical distribution
      theorem H1 imitates - a pointer for the referee, not support.
    validation_experiment_ids:
    - EXP-SSIQ-b1e777
    falsification_condition: >-
      A fitted density exponent outside [1.40, 1.60] at two or more toy primes with the positive control
      passing; OR a mean lattice-point count at cryptographic p deviating from the predicted law by more
      than a factor of 2 over a factor-16 range of T; OR any sampled minimal conjugate degree exceeding the
      structural threshold, which is a theorem and whose violation is an instrument bug that voids the run.
  - id: H2
    formal_statement: >-
      INHERITED SMOOTHNESS. The frozen source's own smoothness heuristic holds as stated, uniformly in the
      same range, when the degree bound is T = p^{c} for a constant c in (0, 1/3] rather than only at
      c = 1/3.
    random_model_justification: >-
      The frozen source's own justification - a structural threshold theorem combined with a classical
      smooth-number distribution theorem - is stated for the minimal degree, and the relevant smoothness
      parameter is a function of the size of the integer being tested; at T = p^{c} the relevant parameter
      is c log p over log B and the classical uniformity range is unchanged in shape.
    supporting_results:
    - >-
      The frozen source's Theorem 1.5 combined with its Theorem 1.4 and the classical Canfield-Erdos-
      Pomerance smooth-number estimate, as cited there. Not re-derived in this program.
    validation_experiment_ids: []
    falsification_condition: >-
      An empirical smoothness probability at c < 1/3 falling below the predicted value by more than the
      frozen source's own observed slack at c = 1/3. NO WAIVER IS CLAIMED - this hypothesis inherits the
      incumbent's validation obligation and does not re-run it, and any candidate DETECT operating below
      c = 1/3 must extend that validation to its own c. Recorded here so that a later record cannot treat
      the extension as free.
  structural_ingredients:
  - description: >-
      The isometry between the conjugate-isogeny module with the degree form and the two-sided ideal of
      reduced norm p with the normalised reduced norm, plus the structural threshold placing the minimal
      conjugate degree below (p/2)^{1/3}, plus the list-cost lemma and the re-randomising walk with its
      mixing citation.
    citation: 'inputs/P13-WESOLOWSKI-2026/paper_fulltext.md (the campaign''s frozen source).'
    provenance: internal
    verified_by: 'idea-generator session 2026-08-21, IDEA-20260821-e99afd; lines read directly in that session'
    role: >-
      supplies the lattice model, the boundary, the incumbent detector's cost and the worst-to-average-case device
  - description: >-
      The forced trace vanishing collapsing the conjugate module to a rank-3 sublattice of determinant of
      order p for degrees below p/4, with the committed normalisation.
    citation: IDEA-20260805-e7ee4a, and the evidence record cited there as its authority.
    provenance: internal
    verified_by: 'idea-generator session 2026-08-21, IDEA-20260821-e99afd; record read in full'
    role: fixes the rank and determinant, hence the exponent 3/2 in H1
  - description: >-
      The van Oorschot-Wiener golden-collision tradeoff as the memory comparator, and the Wiener 3D-wiring
      full-cost baselines for meet-in-the-middle and for distinguished-point collision search.
    citation: KN-TECH-057, KN-TECH-058.
    provenance: internal
    verified_by: 'knowledge/techniques/KN-TECH-057.md and KN-TECH-058.md, read in the parent session'
    role: >-
      the frontier against which a candidate (alpha, mu) is scored, giving the single admissibility
      inequality 2 alpha + mu < 3
  predictions:
  - metric: >-
      alpha_hat - fitted slope of log(DETECT cost, in list entries constructed) against log T at fixed toy
      p, over T spanning at least 1.5 decades
    direction: different
    minimum_effect: >-
      FORCED VALUE 1.00, accepted if the deviation is below 0.05 at each of three primes. This is a
      CALIBRATION, not a discovery - a miss means the instrument or the identity is wrong and stops the
      experiment.
  - metric: >-
      beta_hat - fitted slope of log Pr[minimal conjugate degree <= T] against log T, over uniformly sampled
      supersingular curves at toy p, with the minimal degree computed EXACTLY and with no smoothness
      restriction
    direction: different
    minimum_effect: >-
      FORCED VALUE 1.50 from H1, accepted if the deviation is below 0.10 at each of three primes AND the
      fitted prefactor scales as p^{-1/2} across primes, which is a second independent check on the same
      law. THIS IS THE FIRST DIRECT TOY-SCALE TEST OF THE DENSITY LAW IN THIS CORPUS - the frozen source
      validates the SMOOTHNESS of the minimum, not the COUNT.
  - metric: >-
      beta_hat_null - the same slope with the Frobenius-conjugate target replaced by a uniformly random
      supersingular curve
    direction: higher
    minimum_effect: >-
      FORCED VALUE 2.00, and it must EXCEED beta_hat by at least 0.35 with non-overlapping intervals. The
      forced value differs because the relevant lattice is the rank-4 connecting ideal of pair-independent
      determinant of order p squared. If the two arms agree, the measurement is void.
  - metric: >-
      argmin over T of the measured end-to-end total work (attempts times per-attempt entries) at fixed toy p,
      expressed in units of log_p T
    direction: different
    minimum_effect: >-
      FORCED VALUE 1/3, accepted within 0.05. This is the identity making a prediction that no
      factor-by-factor argument makes - the LOCATION of the optimum, not its value.
  - metric: 'mu_hat - fitted slope of log(peak memory, in stored entries) against log T for the same runs'
    direction: different
    minimum_effect: >-
      FORCED VALUE 1.00 for the incumbent architecture. Recorded because the memory exponent is mu/3 and this
      question charges memory beside time in every estimate.
  test_boundary:
    instances:
    - >-
      Three toy primes with log2 p between 20 and 40, at which the WHOLE supersingular vertex set can be
      enumerated and the minimal conjugate degree computed exactly for every curve by breadth-first search
      over cyclic isogenies of increasing degree. Exhaustive enumeration is why the scale is toy.
    - >-
      The random-target null arm at the same primes, with the target replaced by a uniformly random
      supersingular curve.
    - >-
      Planted-small-degree positive controls, generated by walking a fixed number of steps from the
      field-of-definition stratum so the detector must succeed at a radius known in advance.
    parameters:
      primes: 'three, with log2 p in [20, 40], pre-registered before any run'
      radius_ladder: 'T spanning at least 1.5 decades per prime, with degeneracy gates at both ends'
      cost_unit: 'one field operation per table entry, matching the frozen source, declared once and used everywhere'
      vertex_weighting: 'inverse automorphism-group weighting, stated and used consistently'
    implementation: >-
      Full supersingular vertex-set construction and exact minimal-degree computation by breadth-first search
      over cyclic isogenies; the incumbent list-based detector implemented at radius T with the frozen
      source's own cost unit; power-law fits with confidence intervals and RESIDUALS REPORTED, because a poor
      fit is itself the finding that alpha is not well defined. Recorded through harness/runner.py.
    budget:
      wall_clock_seconds_per_run: 7200
      total_cpu_hours: 24.0
      maximum_memory_gb: 16
      maximum_runs: 24
  distinguishable_outcomes:
  - >-
    O1 (IDENTITY CALIBRATED, H1 SUPPORTED AT TOY SCOPE). The three-slice symbolic reproduction passes;
    alpha_hat is 1.00 within 0.05 at all three primes; beta_hat lies in [1.40, 1.60] at all three with the
    prefactor scaling as p^{-1/2}; beta_hat_null is near 2.00 and exceeds beta_hat by at least 0.35 with
    non-overlapping intervals; the measured argmin sits at log_p T = 1/3 within 0.05. MEANING - the campaign's
    qualitative lever map is replaced by ONE number per candidate and the arithmetic target alpha <= 3/4; the
    radius-sweep sub-family is retired by derivation rather than by fatigue; and the density law has its first
    direct toy-scale test in this corpus.
  - >-
    O2 (H1 FALSE AT THE TESTED SCOPE - THE MOST VALUABLE OUTCOME). beta_hat differs from 1.50 by more than
    0.10 at two or more primes with the positive control passing. MEANING - the density law is what forces the
    structural boundary to be optimal, so its failure REOPENS the radius levers this hypothesis claims to
    close and puts a question against the frozen source's own choice of boundary. This is escalated rather
    than absorbed, and it is the outcome a sibling record's clustering result predicts.
  - >-
    O3 (CALIBRATION ABSENT). alpha_hat differs from 1.00 by more than 0.05 for the incumbent architecture with
    the cardinality regression passing. MEANING - either the instrument is wrong or the list cost is not
    linear in the radius at toy scale, in which case the calibration that licenses the whole family formula is
    absent and no measured alpha may be recorded.
  - >-
    O4 (INSTRUMENT VOID). beta_hat_null falls within 0.35 of beta_hat. MEANING - the instrument does not
    separate planted target structure from list growth; it is measuring the apparatus and NO exponent is
    recorded. This is the failure mode that makes most toy measurements in this lane uninformative and it is
    the reason the null arm is mandatory.
  - >-
    O5 (IDENTITY WRONG). The symbolic reproduction fails at any of the three published slices. MEANING - the
    identity is wrong and nothing else is recorded. Zero compute, and it is the cheapest way this hypothesis
    can fail.
  - >-
    O6 (alpha NOT WELL DEFINED). The power-law fit for DETECT's cost has poor residuals, so the cost is not a
    clean power of T over the range. MEANING - the closed form does not apply to this DETECT; the residual
    plot IS the finding and a single alpha must NOT be reported.
  - >-
    O7 (FAMILY TOO NARROW). A reader exhibits an algorithm outside A(T, DETECT) - one that never
    re-randomises, or whose cost is not of the form attempts times per-attempt - whose exponent is not
    alpha/3. MEANING - the identity's SCOPE is narrower than stated and the record must be superseded with the
    narrower family. This is a paper falsification available at zero compute.
  falsification_conditions:
  - >-
    The symbolic reproduction fails at any of the three published slices - the identity is wrong and nothing
    else is recorded.
  - >-
    beta_hat differs from 1.50 by more than 0.10 at two or more primes with the positive control passing - H1
    IS FALSE AT THE TESTED SCOPE.
  - >-
    alpha_hat differs from 1.00 by more than 0.05 for the incumbent architecture - the calibration that
    licenses the family formula is absent.
  - >-
    beta_hat_null is within 0.35 of beta_hat - the instrument does not separate structure from list growth;
    no exponent is recorded.
  - >-
    An algorithm outside the family is exhibited whose exponent is not alpha/3 - the scope is narrower than
    stated and the record is superseded.
  interpretation_limits:
  - >-
    0.25 IS A TARGET, NOT A CLAIM. Nothing here says a p^{1/4} algorithm over F_{p^2} exists, is likely, or is
    nearly obtained. The hypothesis supplies the arithmetic condition alpha <= 3/4 and proposes no mechanism
    meeting it.
  - >-
    NO EXPONENT MOVES. At the incumbent's alpha = 1 this is exactly the incumbent. The deliverable is a
    reformulation plus measured exponents.
  - >-
    TOY SCALE IS TOY SCALE. log2 p in [20, 40] is many orders of magnitude below cryptographic parameters. A
    measured density exponent at 2^40 is evidence about 2^40 and a TRANSFER ASSUMPTION about anything else,
    and the transfer assumption lives in H1's validation plan rather than being smuggled.
  - >-
    THE IDENTITY IS SUFFICIENCY-ONLY. It converts an alpha into a cost. It does not bound alpha from below and
    may not be cited as a closure of any route.
  - >-
    CONDITIONAL TIERS ARE INHERITED, NOT WAIVED. Every cost statement carries BOTH the frozen source's
    smoothness heuristic AND H1. The unconditional tier remains p^{1/2} times a polylogarithmic cofactor at
    polynomial memory.
  - >-
    REDISCOVERY RISK, STATED. A density exponent of 1.5 is what the mass formula predicts, so confirming it
    confirms a computation and not a mechanism. Its value here is as a CALIBRATION of an instrument that will
    be used on candidates where the answer is unknown, and it must be reported as such.
  - >-
    A CONTESTED, RELAYED-FROM-ABSTRACT figure for a restricted sub-problem is neither cited as reachable nor
    needed anywhere in this hypothesis; the degenerate stratum enters only through the frozen source's own
    statement.
