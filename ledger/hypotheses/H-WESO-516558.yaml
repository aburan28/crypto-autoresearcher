# =============================================================================
# H-WESO-516558 -- Heuristic 1 of the frozen Wesolowski 2026 source, tested AS
# STATED (B-smoothness of delta(E), the minimal degree of E -> E^{(p)}) with
# the source's own Deuring-correspondence sampler, after a mixing control of
# that sampler against exhaustive ground truth. Specified by the Coordinator
# from IDEA-20260926-4a496f under /design-experiment (TASK-20260926-41c7e7 is
# the executor card; approval DEC-20260926-ec2847). Heuristic-validation class
# (.claude/skills/design-experiment/SKILL.md). NO ATTACK, NO EXPONENT MOVED.
# =============================================================================
hypothesis:
  id: H-WESO-516558
  question_id: RQ-WESO-8aff57
  question_ids: [RQ-WESO-8aff57, RQ-SSIQ-9702af]
  source_idea: IDEA-20260926-4a496f
  goal_context: [GOAL-P13-001, GOAL-SSIQ-001, GOAL-SSI-001]
  recorded_at: '2026-09-26'
  title: >-
    Heuristic 1 (smoothness of the minimal conjugate-isogeny degree delta(E))
    holds in its operational finite-p form at log2 p in {64, 96, 128} and at
    p = 5*2^248 - 1, measured through a mixing-validated Deuring sampler

  statement: >-
    TWO PARTS, EACH SEPARATELY FALSIFIABLE, SCOPED TO THE TESTED PRIMES.
    (H-S, SAMPLER) The endpoint of a uniformly random non-backtracking walk of
    length k on norm-2 left ideals from a fixed special maximal order O_0 of
    B_{p,inf} (equivalently: the right order of a uniformly random cyclic left
    O_0-ideal of norm 2^k) has a curve-level distribution within sampling noise
    of the stationary (Eichler mass-weighted) distribution once
    k >= c * log2 p for a constant c that does not grow across the Stage-B
    primes {1019, 4099, 10007, 20011}.
    (H-1, HEURISTIC 1, OPERATIONAL FORM) For O drawn by that sampler at walk
    length k_C(p) = ceil(3 * c_hat * log2 p), with P the two-sided ideal of O of
    reduced norm p and delta = min{Nrd(x)/p : 0 != x in P}, the fraction of
    samples whose delta is B-smooth (every prime factor < B) is NOT materially
    below the source's own concrete prediction rho(u), u = ln(p/2)/(3 ln B)
    (Dickman-de Bruijn rho), and delta is NOT materially less smooth than a
    uniformly random integer of its own bit-length, at every admissible (p, B)
    cell of the frozen grid, at the tested primes. "Materially" is defined
    numerically in EXP-WESO-9e2d6d (99% intervals; two-prime replication).
    WHAT IS NOT CLAIMED: Heuristic 1 is an asymptotic statement with a
    u^{-u(1+o(1))} lower bound and an unquantified o(1). No finite experiment
    can confirm or refute an o(1) statement. This hypothesis concerns the
    finite-p operational form that the frozen source itself uses to support the
    heuristic (Section 4.2, lines 244-254), at the tested primes only.

  mechanism: >-
    (1) OBJECT. Frozen Heuristic 1 (inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
    line 69) concerns ONE integer per curve: delta(E) = the degree of the
    smallest isogeny E -> E^{(p)}. Theorem 1.5 (line 81, attributed to
    Aubry-Oyono-Vincent) bounds it by (p/2)^{1/3}; Theorem 1.4 (line 77,
    Canfield-Erdos-Pomerance) gives Psi(X,B) = X u^{-u(1+o(1))}; the heuristic
    asks that delta have the smoothness probability of a random integer of its
    size (line 83). The random model is exactly "delta behaves, for
    smoothness, like a uniform integer of its size".
    (2) SCALE ACCESS. Section 4.2 (line 244): through the Deuring
    correspondence, Hom(E, E^{(p)}) with deg is isometric to the unique
    two-sided ideal P of reduced norm p in the maximal order O ~ End(E), with
    Nrd/p. So delta(E) is the minimum of a rank-4 positive definite integral
    form, computable exactly by Fincke-Pohst enumeration after reduction, with
    no elliptic-curve arithmetic. Per-sample cost is poly(log p) plus one
    factorisation of an integer <= (p/2)^{1/3} (about 2^83 at NIST-I). This
    removes the cost wall that stopped EXP-P13-NC36 (pure-Python isogeny
    chains; FG-1 INFEASIBLE, an infrastructure outcome).
    (3) THE UNREPORTED STEP. The source samples orders "uniformly random up to
    conjugation" (line 246) without saying how. A practical sampler is a walk
    from a fixed order. If under-mixed, it is biased toward orders near O_0,
    whose delta values are small and structured (O_0 itself has delta = 1).
    A biased sampler and a correct one can both print "consistent with
    rho(u)" -- an observation collision (proof_search_map below). The exhaustive
    WISDE ground truth at small p and a k-sweep separate them; nothing at
    crypto scale can. Hence H-S is tested first and gates H-1.
    (4) THE MIXING ARGUMENT, CARRIED AS A HEURISTIC. The norm-2 ideal graph is
    the supersingular 2-isogeny graph (Brandt matrix), recalled as Ramanujan
    (Pizer; RECALLED, UNVERIFIED in this program). Non-backtracking walks on
    (q+1)-regular Ramanujan graphs mix in about log_q(#vertices) steps
    (RECALLED, UNVERIFIED). #vertices ~ p/12, so k ~ log2 p. Stage B measures
    this at toy p; transfer to 64-256 bits is an explicit extrapolation
    (HEUR-WESO-516558-2).

  assumptions:
    - >-
      SUCCESSOR IN METHOD AND OBJECT to EXP-P13-NC36, not a repair. The NC36
      contract (specification.yaml lines 93-98, NC-3) describes smoothness of
      random isogeny CHAINS of fixed length from j = 1728, which is not the
      frozen Heuristic 1 object; NC36 stopped at FG-1 INFEASIBLE, which is
      never evidence (AGENTS.md core rule 5). NC36 and H-WESO-001 are not
      edited. The Coordinator's reading of the object difference is recorded
      in DEC-20260926-ec2847.
    - >-
      THE PREDICTION IS THE SOURCE'S OWN. The concrete comparison curve is the
      one the frozen source plots and uses for its tail check: rho(u) with
      u = log(p/2)/(3x), x = ln(largest prime factor) (Figure 1 caption, line
      254; tail check, lines 250-252). It is frozen in EXP-WESO-9e2d6d before
      any run and is never adjusted afterward.
    - >-
      STATIONARY MEASURE. The walk's stationary law weights a curve E by
      1/|Aut(E)/{+-1}| (Eichler mass). It differs from the uniform law on
      j-invariants only at j in {0, 1728}, which matters at the Stage-B toy
      primes (handled exactly there) and is O(1/p) at Stage C/D.
    - >-
      EXTERNAL CONTEXT, RELAYED, NOT RELIED ON. The dispatching session reports
      J. L. Delgado, "The Supersingular Isogeny Problem in Time and Memory
      p^{1/3+o(1)}, Unconditionally", arXiv 2609.22018v1 (18 Sep 2026,
      unrefereed), claiming OneEnd in p^{1/3} exp(O(sqrt(log p log log p)))
      time and memory WITHOUT Heuristic 1 (its Theorem 1.1 / 5.3), via a fixed
      family of squarefree smooth degrees, a Chenu-Smith count and a collision
      bound (its Theorem 3.5). As relayed, it neither proves nor refutes
      Heuristic 1 about delta(E); it routes around it. This act did not read
      the paper. IF Delgado holds up, Heuristic 1 is no longer load-bearing for
      the p^{1/3} exponent, and this hypothesis's value is the empirical status
      of the heuristic as literally stated plus the sampler-validity question
      (which also bears on the source's unreported Section 4.2 sampler), not a
      gate for the exemplar exponent. No part of this record, its experiment or
      its approval relies on Delgado being correct.

  proof_search_map:
    bottleneck: >-
      Whether the sampler reaches the curve-level stationary distribution the
      heuristic quantifies over, at the walk length used. Every reading of
      rho(u) agreement rests on it. Second: whether delta computed as the
      rank-4 minimum of P equals the true minimal conjugate degree (interface).
    baseline_embedding:
      parameter_slice: >-
        k -> infinity at WISDE-covered primes reproduces the exhaustive,
        exactly known curve-weighted distribution of delta_E = N1 (AOV
        dataset, github.com/christellevincent/WISDE results/, as used by
        EXP-SSIQ-4de240). This is the reproduction target and it has a known
        answer.
      reproduction_check: >-
        EXACT INTEGER IDENTITIES before any sampling (Stage A): (i) for EVERY
        maximal-order type listed at p in {1019, 4099, 10007, 20011}, the
        rank-4 minimum of Nrd/p over P computed by this experiment's code from
        the listed Z-basis equals the listed N1 (AOV compute N1 on a rank-3
        module by a different route); (ii) H_reconstructed(p) =
        #{N1 = 1} + 2 #{N1 >= 2} equals floor(p/12) + e(p mod 12); (iii) max
        N1 <= floor((p/2)^{1/3}). Then Stage B: the sampler at large k matches
        the exhaustive curve-weighted distribution within the bootstrap noise
        floor.
    observation_collision:
      observable: >-
        The empirical CDF of ln(largest prime factor of delta) and its
        agreement with rho(u); the empirical B-smooth fractions.
      distinct_preimage_search: >-
        Collision found by construction: (i) a mixed sampler on a population
        satisfying Heuristic 1 and (ii) an under-mixed sampler biased toward
        O_0 on a population that does not, can print the same "consistent with
        rho" verdict. Separated by the exhaustive toy ground truth and the
        k-sweep (Stage B), by the known-biased positive controls PC-1/PC-2/PC-3
        (which MUST be detected), and at scale by the k-sensitivity and
        second-start arms (Stage C). The residual collision that is NOT
        separated: a bias confined to the smooth tail that is invisible in the
        delta marginal at toy primes. Declared as a limit of the method.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the rho-agreement verdict fixed and vary the sampler (walk
          length k; start order O_0 vs O_0'; contamination with short walks).
          An observable that moves with k where the positive control moves is
          a sampler artifact; one that is stable at k >= k* while controls move
          is instrument-independent.
        predicted_gain: >-
          A disqualification rule for sampler artifacts, applied before any
          medium- or crypto-scale reading.
    quantifier_order: >-
      Frozen Heuristic 1: FOR ALL sufficiently large p and FOR ALL B with
      (log p)^eps < u < (log p)^{1-eps}, Pr_E[delta(E) B-smooth] >=
      u^{-u(1+o(1))}, E uniform. Tested here: FOR EACH of the finitely many
      tested primes and EACH admissible (p, B) cell fixed before any run, the
      empirical smooth fraction under a sampler whose law is validated at toy
      primes is not materially below rho(u). The measure over E is part of the
      quantifier; the sampler is therefore an object under test, not a
      nuisance. The witness constants (c_hat, walk length) are fixed by Stage
      B before Stage C reads any smoothness value and may not depend on it.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At the tested primes (log2 p in {64, 96, 128}, plus p = 5*2^248 - 1 if
        Stage D passes FG-D), with N = 10^5 samples each, the empirical
        B-smoothness rate of delta is (or is not) materially below the source's
        rho(u) prediction and below a size-matched uniform-integer null, at the
        pre-declared resolution; the sampler's walk length exceeds the mixing
        threshold measured at four toy primes, transferred by an explicit
        extrapolation in log p." Nothing for p beyond the largest tested; no
        statement about the o(1); no statement about any algorithm's cost.
      nearby_object_control: >-
        Known-biased samplers that MUST be detected: k in {0, 1, 2} (PC-1); a 5%
        contamination of the k = 64 sampler by k = 2 draws (PC-2); a k = 4
        short walk at the 64-bit prime (PC-3). If the instrument does not flag
        them, every "no bias" reading is void.
    proof_obligations:
      - claim: P (two-sided, reduced norm p) with Nrd/p is isometric to Hom(E, E^{(p)}) with deg (frozen source line 244); checked, not assumed, by Stage A identity (i) against AOV's independent N1.
        responsibility: correctness
      - claim: The rank-4 minimum is computed exactly (Fincke-Pohst enumeration after LLL), not read off an LLL-reduced basis.
        responsibility: correctness
      - claim: The sampler draws a uniformly random cyclic left O_0-ideal of norm 2^k (equivalently a uniform non-backtracking walk endpoint); checked by unit check U-1 at k <= 3.
        responsibility: interface
      - claim: The Stage-B reference law is the Eichler mass-weighted curve law, with automorphism weights computed from the unit group of each order, and the order-type -> curve weighting (1 curve if N1 = 1, else 2) applied.
        responsibility: baseline
      - claim: Per-sample cost is poly(log p) plus one factorisation of an integer <= (p/2)^{1/3}; every factorisation is verified (product and primality of factors).
        responsibility: runtime
      - claim: rho is computed by a validated numerical method (closed form 1 - ln u on [1,2]; relayed source value at the NIST-I tail check) and its finite-size error is controlled by empirical uniform-integer nulls, not assumed away.
        responsibility: success_probability
      - claim: Every conclusion is scoped to the tested primes; mixing transfer to 64-256 bits is an extrapolation and is labelled as such.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: >-
    Not proposed; measured. The source's Theorem 1.1 converts Heuristic 1 (a
    statement about a RANDOM E) into a worst-case algorithm through Algorithm
    3's re-randomising walk and a mixing bound it cites. This hypothesis
    measures the same kind of walk's mixing at toy primes (H-S), which bears on
    that step only as a toy-scale observation.

  asymptotic_claim: null

  heuristic_assumptions:
    - id: HEUR-WESO-516558-1
      formal_statement: >-
        (UNDER TEST; NOT RELIED ON.) Frozen Heuristic 1, verbatim at source line
        69: let p be prime and E/F_{p^2} a uniformly random supersingular curve;
        the degree of the smallest isogeny E -> E^{(p)} is B-smooth with
        probability at least u^{-u(1+o(1))}, u = log(p/2)/(3 log B), uniformly
        as p -> infinity for (log p)^eps < u < (log p)^{1-eps}.
      random_model_justification: >-
        delta(E) <= (p/2)^{1/3} (Theorem 1.5) and Psi(X,B) = X u^{-u(1+o(1))}
        (Theorem 1.4); the heuristic asks that delta be as smooth as a uniform
        integer of its size (source line 83). Structural reasons it could fail:
        delta is the minimum of a very non-generic rank-4 lattice family
        (H-WESO-9dc201 mechanism (4)), and degrees d admitting an isogeny to the
        conjugate correspond to embeddings of Z[sqrt(-pd)] (H-WESO-9dc201
        mechanism (1)); either could correlate minimality with factorisation.
      supporting_results:
        - inputs/P13-WESOLOWSKI-2026/paper_fulltext.md Theorem 1.4 (line 77) and Theorem 1.5 (line 81), as relayed by the frozen source; the source's own Section 4.2 experiments (lines 244-254) at p = 5*2^248 - 1 (10^5 samples) and p = 27*2^500 - 1 (10^4 samples).
      validation_experiment_ids: [EXP-WESO-9e2d6d]
      falsification_condition: >-
        Operational-form adverse signal (EXP-WESO-9e2d6d falsification_criterion
        FC-H1): with every instrument gate passed, at >= 2 of the 3 Stage-C
        primes and >= 2 admissible u at each, the 99% Wilson upper bound of the
        empirical smooth fraction is below rho(u) AND the 99% upper bound of
        the smooth-count ratio against the size-matched uniform-integer null is
        below 1. This is scoped to the tested primes and, as a single
        unreplicated empirical run, supports at most `weaken` plus replication,
        never `reject_scoped`.
    - id: HEUR-WESO-516558-2
      formal_statement: >-
        (RELIED ON at Stages C-D; MEASURED at Stage B.) There is a constant c,
        independent of p, such that the endpoint of a uniform non-backtracking
        norm-2 ideal walk of length k >= c log2 p from O_0 is within o(1) total
        variation of the Eichler mass-weighted curve law on supersingular
        curves over F_{p^2}; c_hat measured at p <= 20011 transfers to
        log2 p in {64, 96, 128, 250.3} with margin factor 3.
      random_model_justification: >-
        Ramanujan property of the supersingular 2-isogeny graph (Pizer) and
        cutoff of non-backtracking walks at log_q n on (q+1)-regular Ramanujan
        graphs (Lubetzky-Peres). BOTH RECALLED, UNVERIFIED in this program;
        pointers for reviewers, not support.
      supporting_results: []
      validation_experiment_ids: [EXP-WESO-9e2d6d]
      falsification_condition: >-
        Stage B (EXP-WESO-9e2d6d FC-S): at any Stage-B prime the delta-level
        (or, at 1019 and 4099, type-level) total variation to the exhaustive
        reference stays above the null q99.9 floor for every tested k <= 128
        while PC-1 and PC-2 show the instrument has power; or k*(p)/log2 p at
        the largest Stage-B prime exceeds twice the smallest ratio across the
        Stage-B primes. Either blocks Stages C and D. At scale, a failed
        k-sensitivity or second-start arm (KS-1, START-2) voids the prime it
        occurs at.

  structural_ingredients:
    - description: Heuristic 1, Theorem 1.4, Theorem 1.5 and the Section 4.2 Deuring-correspondence method and results.
      citation: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md lines 65-83 and 242-254
      provenance: internal
      verified_by: coordinator, TASK-20260926-41c7e7 design act, 2026-09-26 (lines read directly)
      role: the heuristic under test, its rigorous interpolants, and the method and prediction curve
    - description: Exhaustive AOV/WISDE dataset (per maximal-order type, a Z-basis and (N1, N2, N3) with N1 = delta_E) and its committed per-file SHA-256 values.
      citation: experiments/EXP-SSIQ-4de240/runs/RUN-SSIQ-4de240-a/source_access_log.yaml and raw-result.json "source_files"; experiments/EXP-SSIQ-4de240/implementation/fit_delta_counting.py header lines 17-43
      provenance: internal
      verified_by: coordinator, TASK-20260926-41c7e7 design act, 2026-09-26 (hash entries for p = 1019, 4099, 10007, 20011 read directly)
      role: exact ground truth for the sampler and exact interface check for delta extraction
    - description: Ramanujan property of the supersingular l-isogeny graph; cutoff of non-backtracking random walks on Ramanujan graphs.
      citation: Pizer (Ramanujan graphs from quaternion algebras); Lubetzky-Peres (cutoff on Ramanujan graphs). RECALLED, UNVERIFIED; no theorem number asserted.
      provenance: recalled
      verified_by: null
      role: motivation for HEUR-WESO-516558-2 only; Stage B measures the mixing directly
    - description: Delgado, arXiv 2609.22018v1 (unrefereed), claims the p^{1/3+o(1)} exponent without Heuristic 1.
      citation: arXiv 2609.22018v1, as relayed by the dispatching session on 2026-09-26
      provenance: retrieved
      verified_by: dispatching top-level session, 2026-09-26 (relayed to this act by message; this act did not read the paper)
      role: context for the stakes of this hypothesis only; nothing relies on it

  reduction_chain:
    core_problem: >-
      Empirical status of Heuristic 1 (as literally stated) in its operational
      finite-p form at the tested primes, and validity of the walk sampler
      that the source's Section 4.2 leaves unspecified.
    corollaries: []
    corollaries_note: >-
      No reduction is claimed. Every conditional result in GOAL-P13-001,
      GOAL-SSIQ-001 (SC-1) and GOAL-SSI-001 inherits Heuristic 1; this
      hypothesis supplies (or fails to supply) the heuristic-validation
      artifact docs/target-result-profile.md requires, scoped to the tested
      primes. If Delgado (arXiv 2609.22018v1) is verified, the exponent no
      longer depends on Heuristic 1 and that inheritance becomes historical.

  predictions:
    - metric: Stage A interface identity -- rank-4 P-minimum delta vs WISDE N1, every type at p in {1019, 4099, 10007, 20011}
      direction: different
      minimum_effect: EXACT EQUALITY for every type. Any mismatch voids the instrument (no tuning).
    - metric: Stage B total variation TV_delta(p, k) to the exhaustive mass-weighted reference, as a function of k
      direction: lower
      minimum_effect: At or below the null q99.9 floor for all tested k >= k*(p), with k*(p) <= 128 at every Stage-B prime and k*(p)/log2 p not growing by more than 2x across them.
    - metric: Positive controls PC-1 (k in {0,1,2}), PC-2 (5% contamination), PC-3 (k = 4 at 64-bit)
      direction: higher
      minimum_effect: FORCED DETECTION (above q99.9 / KS p < 0.001). Failure voids the instrument.
    - metric: R_max(p, u) = empirical B-smooth fraction / rho(u), u = ln(p/2)/(3 ln B), per admissible cell
      direction: higher
      minimum_effect: >-
        Not materially below 1 (99% Wilson upper bound of the fraction >=
        rho(u)) at every admissible cell. Expected above 1 because most delta
        lie below (p/2)^{1/3} (source Remark 1; H-WESO-9dc201) and because rho
        underestimates Psi(X,B)/X at finite X.
    - metric: T1(p, u) = smooth count of delta / smooth count of the size-matched uniform-integer null
      direction: different
      minimum_effect: >-
        Near 1 if delta behaves like a random integer of its own size. A 99%
        interval excluding 1 in EITHER direction is reported as structure; only
        a deficit (upper bound < 1) replicated at >= 2 primes counts toward
        FC-H1.
    - metric: Tail check TC-1 -- smoothest sample of N against its extreme-value distribution under rho
      direction: different
      minimum_effect: Central 99% of the predicted distribution of the minimum largest-prime-factor, mirroring source lines 250-252.

  test_boundary:
    instances:
      - Stage A/B toy primes p in {1019, 4099, 10007, 20011} (all = 3 mod 4; all in the WISDE block that is exhaustive over primes <= 22000).
      - Stage C primes p_b = the smallest prime p >= 2^b with p = 3 mod 4, b in {64, 96, 128}, determined and proven prime in-run before sampling.
      - Stage D prime p_D = 5*2^248 - 1 (SQIsign NIST-I, source line 248), behind feasibility gate FG-D.
    parameters:
      samples_stage_B_per_cell: 10000
      samples_stage_C_per_prime: 100000
      samples_stage_D: 100000
      walk_length_rule_stage_C_D: ceil(3 * c_hat * log2 p), c_hat = max over Stage-B primes of k*(p)/log2 p
      smoothness_definition: every prime factor < B (source Definition 1.3)
      u_definition: u = ln(p/2) / (3 ln B)
      admissible_cell_rule: B >= 128 AND N * rho(u) >= 30
    implementation: >-
      Python 3 driver with PARI/GP 2.15.4 (/usr/bin/gp; installed this session
      via apt `pari-gp`, not provisioned by the repository -- a declared
      dependency) for quaternion-ideal arithmetic, HNF, qflll, qfminim,
      factor and isprime; numpy 2.4 and sympy (with its mpmath dependency) for
      statistics and rho. No Sage, Magma or fpylll.
    budget:
      enforcement: advisory
      note: See EXP-WESO-9e2d6d budget; resource limits are machine protection, not research caps (docs/research-budget-policy.md).

  falsification_conditions:
    - FC-S (sampler) as HEUR-WESO-516558-2's falsification_condition. Blocks Stages C and D; recorded as a finding about the walk sampler at the Stage-B primes.
    - FC-H1 (Heuristic 1, operational form) as HEUR-WESO-516558-1's falsification_condition. Scoped adverse finding at the tested primes only.
    - FC-VOID (instrument) -- Stage A identity fails, a positive control is not detected, the maximal-size null is outside its bounds, the smoothness classifier unit test fails, or the seed-independence checks fail. No H-1 reading of either sign.
    - FC-NORM -- a Stage-A prime fails class-number reconstruction; that prime is excluded and the exclusion reported.

  interpretation_limits:
    - >-
      CLAIM TIERS. Stages A/B: toy. Stage C (64, 96, 128 bits): capped at
      `medium`, including the 128-bit prime, which exceeds the mechanical
      96-bit bound of docs/claims-and-verification.md but is not a recognized
      parameter set. Stage D is the ONLY crypto-scale row, scoped to the exact
      prime 5*2^248 - 1, and exists only if FG-D passes.
    - >-
      An INFEASIBLE FG-D, a timeout, crash or implementation failure is an
      infrastructure outcome and never evidence about Heuristic 1 or the
      sampler (AGENTS.md core rules 5 and 9).
    - >-
      No exponent moves and no attack is proposed. A pass supports Heuristic 1's
      operational form at the tested primes; it does not revisit GOAL-P13-001's
      concrete-cost bracket and does not certify the o(1).
    - >-
      Mixing is measured at p <= 20011 on the delta marginal and on the
      order-type law at the two smallest primes; its transfer to 64-256 bits is
      an extrapolation in log p, partly checked at scale by the k-sensitivity
      and second-start arms, whose tail resolution is limited (N = 2*10^4).
    - >-
      Stakes, stated honestly: if Delgado (arXiv 2609.22018v1, unrefereed;
      relayed, not read here) is verified, Heuristic 1 is not load-bearing for
      the p^{1/3} exponent, and a result here is about the heuristic as
      literally stated and about sampler validity, not a gate on the exemplar
      exponent. No interpretation here relies on Delgado being correct.
    - >-
      This hypothesis says nothing about the SIZE law of delta (H-WESO-9dc201);
      the delta size distribution is reported descriptively, not tested.

