hypothesis:
  id: H-SPC-5a6007
  question_id: RQ-SSI-001
  proposal_id: IDEA-20260806-bcbcf5
  added: '2026-08-06'
  statement: >-
    Random-matrix analysis of supersingular isogeny graphs has the WRONG NULL,
    and using the obvious one guarantees a false positive: the eigenvalues of the
    ell-isogeny (Brandt) operator are Hecke eigenvalues of weight-2 forms of
    level p, constrained by the Ramanujan bound |a_ell| <= 2 sqrt(ell), so a
    level-spacing test against a GOE null WILL report a deviation and that
    deviation IS the arithmetic. The correct null is the arithmetic
    (Hecke-eigenvalue) distribution. Separately, the lane's budget is forced: the
    eigenvalue multiset is a graph invariant identical at every vertex, so it
    carries EXACTLY ZERO bits about any individual curve, while eigenvector
    coordinates carry the curve-specific information at a cost linear in the
    class number (about p/12) -- worse than the p^{1/2} baseline. There is no
    intermediate regime absent a sublinear estimator for a single eigenvector
    coordinate.
  mechanism: >-
    ON THE ABELIAN SIDE THE QUESTION IS VACUOUS IN ONE LINE: the natural "matrix
    from group operations" for the ECDLP is a Cayley adjacency operator on a
    cyclic group, which is diagonalised by the characters, so every eigenvalue is
    an explicit character sum and there is no ensemble at all. That is the same
    character-orthogonality wall KN-OPEN-010 expects the transfer-operator lane
    to hit.
    ON THE ISOGENY SIDE the operator is genuinely non-abelian and the graph is
    Ramanujan, so a spectral study is not vacuous -- but its null is arithmetic
    rather than random-matrix, and that is where the artifact enters. The
    Ramanujan bound is a HARD constraint no Wigner ensemble satisfies, so a
    GOE-referenced test finds a real, reproducible deviation that means nothing
    about cryptographic weakness.
    THE ONE FORCED STRUCTURE WORTH MEASURING is a symmetry: Frobenius conjugation
    E |-> E^{(p)} is an involution on the vertex set commuting with the adjacency
    operator, so the operator splits into +1 and -1 sectors and the fixed locus
    of the involution is exactly the F_p-rational subset -- the Delfs-Galbraith
    target set, of size about sqrt(p). The multiplicity difference between the
    sectors is therefore pinned by a fixed-point count, giving an EXACT
    instrument check. On top of it sits the open question: beyond what this
    symmetry forces, is any eigenvector LOCALISED? A localised eigenvector would
    be a computationally distinguished subset of the graph, which is what
    path-finding wants. Ramanujan expansion bounds the spectral gap, NOT
    eigenvector localisation, so citing expansion does not close it.
  assumptions:
    - >-
      The Brandt-Hecke correspondence and the Ramanujan bound hold as recalled.
      RECALLED, NOT RE-READ IN THIS SESSION; Stage 0 verifies both and the
      hypothesis is void without them.
    - >-
      Toy p up to roughly 10^4, so the full vertex set and its spectrum are
      computable. At p/12 in the hundreds, finite-size effects on spacing
      statistics are LARGE, which is why a resolution control is mandatory rather
      than optional.
    - >-
      ell is a small fixed prime; the spectrum depends on ell and every reported
      statistic names it.
  proof_search_map:
    bottleneck: >-
      Whether any eigenvector coordinate at a single vertex is estimable in time
      sublinear in the class number. That is the only opening the budget leaves,
      and the whole lane's value depends on it.
    baseline_embedding:
      parameter_slice: the Eisenstein eigenvalue ell+1 with its all-ones eigenvector
      reproduction_check: >-
        Exact: the largest eigenvalue equals ell+1 and its eigenvector is
        constant, at every p and ell. Integer and exact-rational comparison, no
        tolerance. A pipeline missing this is not computing the adjacency
        spectrum.
    observation_collision:
      observable: the eigenvalue multiset
      distinct_preimage_search: >-
        NOT A SEARCH BUT A DERIVATION, AND IT IS TOTAL: every vertex has the same
        eigenvalue multiset, so the collision class is the entire vertex set.
        That is the budget statement and it makes eigenvalue-based vertex
        distinguishing IMPOSSIBLE rather than merely hard. The audit is satisfied
        in the strongest possible way and the conclusion is an obstruction, not a
        difficulty.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the eigenvalue multiset fixed (automatic) and vary the vertex,
          seeking an intrinsic invariant that distinguishes vertices and is
          computable below class-number cost.
        predicted_gain: >-
          Predicted none; the eigenvector coordinate is the natural candidate and
          costs the class number. An exception would be the finding.
      - transform: stronger_invariant
        proposed_object: >-
          The symmetry-sector decomposition under Frobenius conjugation --
          preserving more state than the raw multiset, because the sector
          multiplicities see the fixed locus the multiset does not.
        predicted_gain: >-
          An exact fixed-point identity usable as an instrument check, and a
          principled place to look for localisation.
    quantifier_order: >-
      The budget claim: FORALL p, FORALL ell, FORALL vertices E, E' of the
      ell-isogeny graph, the eigenvalue multiset computed at E equals that at E'.
      This is trivially true because the multiset is a graph invariant -- AND
      THAT TRIVIALITY IS THE CONTENT, since it is exactly what a vertex-
      distinguishing method would need to be false. The order that matters is in
      the localisation claim, where "EXISTS an eigenvector FORALL primes" and
      "FORALL primes EXISTS an eigenvector" differ and only the second is
      testable at three primes.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At these p and ell, the spacing statistics match the arithmetic null and
        not GOE, and no eigenvector is localised beyond what the Frobenius
        symmetry forces." NEVER a hardness claim, and never an asymptotic claim
        from three toy primes.
      nearby_object_control: >-
        A random (ell+1)-regular graph of the same size, where the arithmetic
        structure is absent by construction. The method must distinguish it from
        the isogeny graph. If it cannot, the instrument lacks the resolution to
        support ANY statement about which null fits, and every spacing conclusion
        is withdrawn.
    proof_obligations:
      - claim: The arithmetic null is correctly stated from primary text.
        responsibility: baseline
      - claim: The Eisenstein eigenvalue ell+1 appears exactly.
        responsibility: correctness
      - claim: Sector multiplicity difference matches the fixed-point count.
        responsibility: correctness
      - claim: The two nulls are distinguishable at the tested graph sizes.
        responsibility: success_probability
      - claim: Eigenvalue statistics carry no vertex-specific information.
        responsibility: scope
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-SPC-1
      formal_statement: >-
        At the tested graph sizes, the level-spacing distribution of the
        ell-isogeny adjacency operator is closer to the arithmetic
        (Hecke-eigenvalue) prediction than to the GOE prediction, and the gap is
        larger than the finite-size fluctuation measured on a random regular
        graph of the same size.
      random_model_justification: >-
        The rigorous side is that the eigenvalues are Hecke eigenvalues subject
        to |a_ell| <= 2 sqrt(ell), a hard constraint no Wigner ensemble
        satisfies. The heuristic side is that this constraint DOMINATES the
        observed spacing behaviour at graph sizes in the hundreds rather than
        being swamped by finite-size noise -- which the random-graph control
        measures rather than assumes.
      supporting_results:
        - KN-TECH-024 (supersingular isogeny graphs and the CGL hash)
        - KN-TECH-058 (corrected supersingular path-finding baselines)
      validation_experiment_ids: [EXP-SPC-888763]
      falsification_condition: >-
        Spacing statistics matching GOE and not the arithmetic null, OR the
        random-regular-graph control showing the two nulls are indistinguishable
        at these sizes. The first refutes the recalled Brandt-Hecke picture as
        applied; the second means the instrument has no resolution and every
        spacing conclusion is withdrawn rather than reported.
  structural_ingredients:
    - description: >-
        Brandt matrices as the adjacency operators of the supersingular
        ell-isogeny graph, with eigenvalues equal to Hecke eigenvalues of
        weight-2 forms of level p, bounded by |a_ell| <= 2 sqrt(ell).
      citation: >-
        Classical (Eichler, Deuring). RECALLED, UNVERIFIED, NO SOURCE READ IN
        THIS SESSION; Stage 0 obtains it.
      role: supplies the CORRECT null, which is the record's whole point
    - description: >-
        Frobenius conjugation as an involution commuting with the adjacency
        operator, whose fixed locus is the F_p-rational subset.
      citation: >-
        KN-TECH-024 and the Delfs-Galbraith structure recorded in KN-TECH-058.
        The commuting property is elementary and is derived at Stage 0.
      role: supplies the exact fixed-point instrument check
  reduction_chain:
    core_problem: >-
      Whether spectral or random-matrix analysis of isogeny graphs can supply a
      cryptanalytically useful vertex-level signal.
    corollaries: []
  predictions:
    - metric: >-
        goodness of fit of the level-spacing distribution to the arithmetic null
        versus to GOE
      direction: different
      minimum_effect: >-
        The arithmetic null fits materially better, AND the random-regular-graph
        control shows the reverse ordering. BOTH HALVES REQUIRED: the second is
        what shows the instrument can tell the nulls apart at this size.
    - metric: multiplicity difference between the two Frobenius symmetry sectors
      direction: different
      minimum_effect: >-
        Exact integer agreement with the independently computed size of the
        F_p-rational subset. Any mismatch halts the run as instrument failure.
    - metric: maximum inverse participation ratio over eigenvectors
      direction: different
      minimum_effect: >-
        No localisation beyond the symmetry sectors. A localised eigenvector
        reproduced at three primes is the one cryptanalytically interesting
        outcome and triggers hand analysis before any claim.
    - metric: bits about an individual vertex extractable from the eigenvalue multiset
      direction: different
      minimum_effect: >-
        Exactly 0, by derivation. Stated as a prediction so any analysis claiming
        otherwise is visibly in conflict with a derivation rather than with an
        expectation.
  test_boundary:
    instances: >-
      Supersingular ell-isogeny graphs over F_{p^2} at a ladder of at least eight
      primes spanning a factor 100 in p, up to roughly 10^4, at two values of
      ell; plus random (ell+1)-regular graphs of matched size.
    parameters:
      prime_ladder: "at least 8 primes spanning a factor 100 in p"
      ell_values: two small primes
      controls: [random regular graph of matched size, Eisenstein exactness]
    implementation: >-
      Full spectrum computation, O((p/12)^2) memory naively, which caps p at
      about 10^4 on ordinary hardware and is the binding constraint.
    budget:
      total_cpu_hours: 40
      maximum_memory_gb: 32
  falsification_conditions:
    - >-
      The Eisenstein eigenvalue is absent or wrong. Instrument failure; nothing
      reported.
    - >-
      The sector multiplicity difference disagrees with the fixed-point count.
      Either the derivation or the implementation is wrong; halt either way.
    - >-
      The random-regular-graph control is not distinguishable from the isogeny
      graph. The instrument lacks resolution; all spacing conclusions are
      withdrawn.
    - >-
      Spacing statistics match GOE and not the arithmetic null. The recalled
      Brandt-Hecke picture is wrong or misapplied; a finding about the modular
      side, and the record is superseded rather than amended.
    - >-
      A localised eigenvector is found beyond the symmetry sectors, at three
      primes. The budget's "no intermediate regime" conclusion is refuted and
      this becomes a live direction.
  interpretation_limits:
    - >-
      Scoped to the tested primes, the tested ell, and the ell-isogeny graph over
      F_{p^2}. Eight toy primes support no asymptotic statement.
    - >-
      A match with the arithmetic null is a CONFIRMATION OF KNOWN STRUCTURE and
      asserts nothing about the hardness of path-finding or EndRing.
    - >-
      The information split is a statement about eigenvalue and eigenvector data
      specifically. It does not bound spectral-adjacent methods that never form
      the operator, and must not be summarised as closing "spectral methods".
    - >-
      The Brandt-Hecke correspondence and the eigenvalue distribution are
      RECALLED and unverified until Stage 0; every downstream claim inherits that
      status until primary text is read.
  status: specified
  proposed_by: idea-generator
  specified_by: coordinator
  specified_at: '2026-08-06'
