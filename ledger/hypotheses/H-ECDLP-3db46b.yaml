  title: >-
    The path cover union is 6 and the band product is 451/500.
  statement: >-
    On the path of 8 points whose successor is the next index, stopping
    at the last point, the depth-4 covers of the stored points 3 and 5
    have sizes 4 and 5. Their intersection has size 3 and their union
    has size 6. The sum 9 is not the union. The first-hit basins have
    sizes 4 and 2, and two points never hit a stored point. The
    truncated distances sum to 15. With 6 covered points the cost is
    5/2, and with table size 2 the constant is 25/16, which is 31/400
    below 41/25. On the 8-cycle, storing 0 with cap 3, the truncated
    distances sum to 18, the cost is 9/2, and the constant is 81/32,
    which is 713/800 above 41/25. The product of 11/20 and 41/25 is
    451/500, which is 1/500 above 9/10. The product of 17/20 and 41/25
    is 697/500, which is 3/500 below 7/5. The product of 19/20 and
    41/25 is 779/500. At spacing 4 the regular-to-geometric ratio is
    3/8, which is below 1/2. Twice 41/25 is 82/25, which is 2/25 above
    16/5. The series for e through k = 8 puts 1 minus 1/e strictly
    above 632/1000 and strictly below 633/1000.
  mechanism: >-
    The proposal compares depth-capped covers with a first-hit
    partition and places a ratio band against 1.64. This contract
    checks those integer comparisons on two graphs of 8 points. It
    does not build a large functional graph.
