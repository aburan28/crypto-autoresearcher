  title: >-
    At m = 5 and l = 23 the named residual exceeds the beat-the-loop
    threshold by 23 times 2^25, and the raw gap is 78.04 bits.
  statement: >-
    A subspace polynomial of dimension 23 has degree 2^23, which is
    8388608, and 24 nonzero coefficient slots. 24 is strictly below
    8388608. An orbit union at this degree uses 131 such polynomials.
    At m = 5 the loop exponent (m-1)*l is 92, and 4! is 24. The raw
    gap from 92 down to 13.96 is 78.04 bits, strictly below 80 and
    strictly above 50. Dividing the loop by 24 and comparing with
    2^37 leaves a gap strictly above 50.4 bits and strictly below
    50.5 bits. The named residual count 2^{69} exceeds the
    beat-the-loop threshold by 23*2^{25}, which is 771751936,
    strictly above 2^{29} and strictly below 2^{30}. The same factor
    shows that l*D^2 with D = 2^{24} is strictly above 2^{23}. The
    k = 2 gain exponent 2*23 is 46.
  mechanism: >-
    The proposal prices a membership gcd by comparing residual
    counts with a loop. This contract checks those integers. It
    does not compute a gcd.
