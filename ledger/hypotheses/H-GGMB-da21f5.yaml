hypothesis:
  id: H-GGMB-da21f5
  question_id: RQ-GGMB-6eaabc
  goal_id: GOAL-ENDO-001
  derived_from_idea: IDEA-20260821-805cae
  added: '2026-08-25'
  statement: >-
    IDEA-20260807-413fcc defines a CURVE-MEASURABLE oracle by its ARGUMENTS - "its
    signature takes NO group handle as an argument" - and closes that class at
    exponent 1/2 on the ground that its answers cannot depend on any linear form
    the adversary holds. THAT CRITERION IS SILENT ABOUT THE ORACLE'S RANGE. Define,
    for a coordinate predicate pi, CSEL(pi) : (p, a, b, N) |-> a handle for the
    point of G = <P> selected by pi (for instance "the point of G of least
    x-coordinate", or "the point of G of least x among those with even y"). CSEL
    takes no group handle and is therefore curve-measurable BY THAT RECORD'S OWN
    DECISION RULE, yet the closure argument does not apply to it, because CSEL's
    ANSWER IS A GROUP ELEMENT and the simulator must produce one. The claim is that
    the adjudication of this undecided C3 cell reduces EXACTLY to one scalar:
    writing c := log_P(rho_pi(E)), CSEL(pi) is simulable - hence closed at exponent
    1/2 - IF AND ONLY IF c is computationally indistinguishable from a uniform draw
    on (Z/N)^*, JOINTLY WITH the public data (p, a, b, N, P, Q). This converts a
    modelling question the campaign has been answering by assertion into a
    STATISTICAL question with a measurable answer and a reportable minimum
    detectable effect, exhaustively computable at toy scale. THE PREDICTED OUTCOME
    IS UNIFORMITY ON THE MARGINAL, and it is explicitly NOT predicted on the j = 0
    arm, where non-uniformity is FORCED by the automorphism and is the instrument's
    positive control.
  mechanism: >-
    The generic group model has no coordinates, which is exactly why every
    non-generic ECDLP method must leave it and why the campaign's oracle catalogue
    exists at all. An oracle that consumes coordinates only in its ARGUMENTS can be
    closed by observing its answer is a constant relative to the handles - that is
    IDEA-20260807-413fcc's argument. An oracle that PRODUCES a group element
    selected by coordinates cannot be closed that way, because producing an element
    is precisely what the simulator's formal-linear-form bookkeeping is built to
    control. The standard simulator keeps, per handle, a formal linear form
    lambda = (alpha, beta) in (Z/N)^2 over the symbols P and Q, and answers group
    operations and equality tests formally. CSEL(pi)'s output is [c]P where
    c is fixed by the curve's coordinates and by NOTHING the adversary has written
    down, so the simulator's only move is to answer with a fresh handle carrying a
    fresh symbol - which succeeds if and only if the real oracle's hidden scalar
    behaves like a fresh random symbol. The whole modelling question therefore
    collapses onto the law of one scalar. Propagation is defined and measurable:
    for any adversary word w = alpha*P + beta*Q + gamma*rho(E), the true logarithm
    is alpha + beta*k + gamma*c, so c enters every subsequent handle LINEARLY and
    the simulator's error is detectable exactly when a formal collision differs
    from a real one - that is the measurable event and its rate is the
    distinguishing advantage. NOTHING ABOUT THIS MECHANISM IS AN ATTACK: an
    adversary handed rho(E) must still solve a discrete logarithm to use it.
  assumptions:
    - >-
      G is cyclic of PRIME order N in the primary arm, so "the point of G selected
      by pi" is unambiguous. Instances with non-cyclic E(F_p) are EXCLUDED from the
      primary arm and run only in a declared secondary arm, because
      IDEA-20260821-ad7c97 shows the subgroup ambiguity infects 66 of 138 curves in
      this campaign's own toy class and is not hypothetical.
    - >-
      The cofactor #E/N is small enough that landing in G costs poly(log p). Where
      it is not, rho_pi is not poly-time and CSEL is not the oracle being
      adjudicated.
    - >-
      P IS SAMPLED INDEPENDENTLY OF pi. If P is itself chosen by a coordinate rule -
      e.g. "the first liftable x", which this campaign's own samplers historically
      did (CORR-20260807-a05e1e, CORR-20260807-9f83be) - then c is structured for
      reasons having nothing to do with CSEL and the battery measures the SAMPLER.
      The sampler for P must be PRE-REGISTERED and its independence from pi argued
      in the contract. THIS IS THE PRIMARY RISK, not a footnote: the campaign has
      been bitten twice by exactly this family of defect.
    - >-
      MODEL DEPENDENCE IS UNRESOLVED. Shoup's random-encoding simulator and
      Maurer's abstract simulator differ in what an adversary can even ask about a
      returned element, and a verdict under one does not automatically transfer to
      the other. The contract must NAME which is used. Both are RECALLED, NOT
      CHECKED, in this program.
    - >-
      IDEA-20260807-413fcc's exact wording is LOAD-BEARING and was read by the
      source session only as a one-line digest claim; the primary record was NOT
      opened. If that record already covers the range side, the whole hypothesis
      collapses and must be WITHDRAWN - stated here rather than discovered by a
      reviewer.
  proof_search_map:
    bottleneck: >-
      The step in IDEA-20260807-413fcc's closure that infers "the oracle's answer
      is independent of every handle" from "the oracle takes no handle as an
      argument". That inference is VALID for oracles returning field elements or
      bits and INVALID for oracles returning group elements. Removing it decides an
      open cell of GOAL-ENDO-001 criterion C3.
    baseline_embedding:
      parameter_slice: >-
        Predicates whose selected point IS a formal linear form in the adversary's
        symbols - pi = "return P" (c = 1) or pi = "return Q" (c = k). On that slice
        CSEL collapses into the already-closed class and the simulator is the
        identity.
      reproduction_check: >-
        Run the IDENTICAL uniformity battery on the pi = "return P" slice. It must
        REJECT uniformity with overwhelming margin (c is constant 1), which
        simultaneously reproduces the old boundary and serves as a positive
        control. A frozen fixture archives the c-vector for this slice.
    observation_collision:
      observable: The marginal distribution of c over sampled instances.
      distinct_preimage_search: >-
        A COLLISION IS FOUND AND IT CHANGES THE DESIGN. Two distinct predicates can
        share the MARGINAL law of c while differing in their CONDITIONAL structure:
        "least x" and "least x among points with even y" both plausibly give
        uniform marginals, yet the second is a strictly finer function of the
        coordinate geometry and could correlate with a label the first does not.
        THE MARGINAL TEST THEREFORE CANNOT ADJUDICATE THE CLASS, and the
        conditional-on-labels arm is NOT an optional refinement but a REQUIREMENT;
        omitting it would be the identifiability failure. A second collision on the
        other side: two curves with the same c and different D_0, which shows c
        alone cannot serve as a label - relevant because a positive outcome would
        otherwise be over-read.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Recast "CSEL is simulable" as the exact statistical condition
          "statistical distance of c from uniform on (Z/N)^*, jointly with the
          public data, is below eps". Obligations - encoding (c is well defined
          given a cyclic G), completeness (every predicate maps to a c-law),
          soundness (indistinguishability of c really does yield a simulator),
          transfer (toy N to cryptographic N, NOT discharged and stated as the open
          gap), cost-loss (none within the model).
        predicted_gain: >-
          Replaces a modelling ASSERTION with a MEASUREMENT carrying an MDE, which
          is what C3 needs to be dischargeable rather than merely declarable.
      - transform: stronger_invariant
        proposed_object: >-
          Adjudicate the JOINT law of (c, labels) rather than c's marginal,
          preserving more state than the final verdict requires.
        predicted_gain: >-
          Defeats the marginal collision above; without it the verdict is NOT
          IDENTIFIED.
    quantifier_order: >-
      WRITTEN OUT WITH ITS WITNESS DEPENDENCE. "For all predicates pi computable in
      poly(log p), for all adversaries A making at most q queries, THERE EXISTS a
      simulator S with |Pr[A^{CSEL(pi)} = 1] - Pr[A^{S} = 1]| <= eps(q)." THE
      SIMULATOR IS ALLOWED TO DEPEND ON pi. A UNIFORM-IN-pi simulator would be a
      strictly stronger statement and is NOT attempted, because a single simulator
      serving every coordinate predicate would have to anticipate every coordinate
      geometry. Note also that any experiment tests FINITELY MANY pi, so its
      outcome instantiates the INNER quantifiers only, never the outer "for all pi"
      - and any record reading it as class-wide is OVER-READING.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At the tested toy N, for these finitely many predicates and this feature
        set, c is (or is not) distinguishable from uniform at effect sizes above
        the reported MDE." It can NEVER certify simulability for all predicates,
        never certify anything at cryptographic N, and never move the sqrt(N)
        generic bound, which is the incumbent and is not in question.
      nearby_object_control: >-
        A PREDICATE WHERE NON-UNIFORMITY IS FORCED BY MATHEMATICS, NOT BY
        MEASUREMENT: on a curve with j = 0 and p = 1 mod 3, Aut(E) contains an
        automorphism acting on G as a scalar of order 3 (H-ENDO-001), so an
        Aut-equivariant predicate selects a point whose logarithm is confined to a
        coset of the order-3 subgroup of (Z/N)^* and c is PROVABLY non-uniform. THE
        BATTERY MUST REJECT THERE; if it does not, the method has no power and no
        negative may be recorded from it. SECOND nearby object: c = 1 constant (the
        pi = "return P" slice), which must be rejected with overwhelming margin.
    proof_obligations:
      - claim: "CSEL takes no group handle as an argument, hence is curve-measurable by IDEA-20260807-413fcc's rule"
        responsibility: interface
      - claim: "the standard simulator cannot express CSEL's output as a formal linear form in P and Q"
        responsibility: correctness
      - claim: "simulability holds iff c is indistinguishable from uniform jointly with public data"
        responsibility: strictness
      - claim: "c is exhaustively computable at toy N by enumeration"
        responsibility: feasibility
      - claim: "the battery rejects on the j=0 equivariant predicate and on c=1"
        responsibility: baseline
      - claim: "the reported MDE bounds what the negative excludes"
        responsibility: success_probability
      - claim: "no exponent moves; the sqrt(N) generic bound is untouched"
        responsibility: runtime
      - claim: "toy tier, finitely many predicates, one feature set, no transfer to cryptographic N"
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        COORDINATE-SELECTION GENERICITY. For a predicate pi depending only on
        coordinates and not on the group structure, the scalar
        c = log_P(rho_pi(E)) is distributed as a uniform draw on (Z/N)^*, jointly
        with the public data, as the curve ranges over the sampled family.
      random_model_justification: >-
        RIGOROUS INGREDIENT: for a FIXED curve and a UNIFORMLY RANDOM generator P,
        c is exactly uniform on (Z/N)^* - a theorem, and the content of the
        random-generator null. CLASSICAL STATEMENT IMITATED: that an
        arithmetically defined selection behaves like a random one, the same shape
        of assumption as the genericity of the least quadratic non-residue. THE
        GAP, STATED: the real experiment FIXES P by a sampler and VARIES the curve,
        which is not the situation the theorem covers, and closing that gap is what
        the measurement is for.
      supporting_results:
        - 'Exact uniformity of c for a fixed curve and uniformly random generator; theorem, internal'
        - 'RECALLED - genericity of arithmetically defined selections, as with the least quadratic non-residue'
      validation_experiment_ids:
        - EXP-GGMB-f70aae
      falsification_condition: >-
        Marginal or conditional non-uniformity above the reported MDE, REPLICATED
        AT A SECOND PRIME, with both positive controls firing and the null accepted
        at the nominal rate.
    - id: HEUR-002
      formal_statement: >-
        SIMULATOR ADEQUACY. An adversary's advantage against CSEL(pi) is bounded by
        the statistical distance of c from uniform PLUS the standard generic-group
        collision term O(q^2/N).
      random_model_justification: >-
        RIGOROUS INGREDIENT: the standard generic-group hybrid argument, in which
        the simulator fails only on a formal-versus-real collision, of probability
        at most q^2/N by a union bound over query pairs. CLASSICAL STATEMENT
        IMITATED: that adding one fresh symbol to the simulator's state costs
        nothing beyond the distance of that symbol's law from uniform - WHICH IS
        THE STEP THIS HYPOTHESIS ASSERTS AND WHICH A REVIEWER MUST CHECK, since it
        is the load-bearing joint of the whole reduction.
      supporting_results:
        - >-
          RECALLED, NOT CHECKED - Shoup, Lower bounds for discrete logarithms and
          related problems (EUROCRYPT 1997), and Maurer's generic group model. The
          two formulations differ in ways that MATTER for an oracle whose output is
          a group element, and this hypothesis does not assert which is right.
        - >-
          RECALLED, NOT CHECKED - Dent, Adapting the weaknesses of the random
          oracle model to the generic group model (ASIACRYPT 2002), pointed at
          because a simulability verdict inherits every one of those limitations.
      validation_experiment_ids:
        - EXP-GGMB-f70aae
      falsification_condition: >-
        An explicit adversary that distinguishes real from simulated CSEL with
        advantage exceeding the sum of those two terms, exhibited at toy scale.
  structural_ingredients:
    - description: >-
        Defines the class of CURVE-MEASURABLE oracles by the decision rule "its
        signature takes NO group handle as an argument", so membership is decidable
        by inspection, and closes that class.
      citation: IDEA-20260807-413fcc
      provenance: internal
      verified_by: >-
        NOT VERIFIED. Read by the source session only as the one-line claim in a
        prior-art digest; the primary proposal was NOT opened. The exact wording of
        its closure argument is LOAD-BEARING and MUST be re-read from the primary
        record before dispatch. If it already covers the range side, this
        hypothesis is withdrawn.
      role: the record whose criterion this hypothesis extends
    - description: >-
        Binding generic-group closure of the incidence and endomorphism-image
        oracle classes at exponent 1/2; treated as binding and extended, not
        revisited.
      citation: KN-FIND-b7e091
      provenance: internal
      verified_by: >-
        Read only as quoted in ledger/goals/GOAL-ENDO-001/goal.yaml; the knowledge
        record itself was NOT opened.
      role: the standing closure this cell sits beside
    - description: >-
        The sqrt(N) generic lower bound and the formal-linear-form simulator whose
        structure the reduction relies on.
      citation: "Shoup (EUROCRYPT 1997); Maurer's generic group model"
      provenance: recalled
      verified_by: null
      role: >-
        RECALLED, NOT CHECKED. Named so a reviewer with retrieval can confirm the
        exact simulator formulation; the two versions differ in ways that matter
        for an oracle whose output is a group element.
    - description: >-
        Known limitations of generic-group arguments.
      citation: "Dent (ASIACRYPT 2002)"
      provenance: recalled
      verified_by: null
      role: >-
        RECALLED, NOT CHECKED. A simulability verdict obtained here inherits every
        one of these limitations and must not be read as stronger than the model
        allows.
    - description: >-
        The automorphism at j = 0 with p = 1 mod 3 acting on G as a scalar of order
        3, which forces c into a coset of the order-3 subgroup for an
        Aut-equivariant predicate.
      citation: H-ENDO-001
      provenance: recalled
      verified_by: null
      role: supplies the mathematically forced positive control
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: >-
        marginal_uniformity_pvalue - chi-square goodness of fit of c against
        uniform on (Z/N)^*, primary arm, generic-j curves with prime group order
      direction: different
      minimum_effect: >-
        NOT distinguishable, i.e. p > 0.05, is the predicted outcome. The run MUST
        report the MDE in total-variation distance detectable at 80 percent power
        at the realised sample size, and MUST refuse to interpret any effect below
        it.
    - metric: >-
        conditional mutual information between c and each cheap label (D_0,
        two_torsion_x_count, volcano level, j in {0, 1728}, the least-x value)
      direction: higher
      minimum_effect: >-
        Predicted at or below the null's 99th percentile. A label exceeding it by
        at least 0.01 bits, REPLICATED AT A SECOND PRIME, falsifies the
        simulability conclusion for that predicate.
    - metric: >-
        j0_equivariant_rejection - battery verdict on the Aut-equivariant predicate
        at j = 0, p = 1 mod 3, where c is provably confined to a coset
      direction: different
      minimum_effect: >-
        Rejection at p < 1e-6. A FAILURE TO REJECT VOIDS THE INSTRUMENT and forbids
        recording any negative (GOAL-ENDO-001 P1, C4).
    - metric: 'constant_predicate_rejection - battery verdict on pi = "return P" (c = 1)'
      direction: different
      minimum_effect: >-
        Rejection at overwhelming margin. This is the baseline-embedding
        reproduction check and the second positive control.
    - metric: >-
        random_generator_null_acceptance - battery verdict when rho is replaced by
        a uniformly random generator of G
      direction: different
      minimum_effect: >-
        Acceptance at the nominal rate (5 percent rejections at alpha = 0.05,
        inside an exact binomial interval). Over-rejection means the battery has a
        false positive rate and NO positive may be read from it.
    - metric: >-
        decay_check - rejection rate of the battery as the instance count grows
        over {200, 500, 1000, 2000, 5000} on the random-generator null
      direction: lower
      minimum_effect: >-
        FLAT at the nominal alpha. A rejection rate that GROWS with sample size on
        a null where no effect exists is the canonical artifact tell and VOIDS THE
        BATTERY.
    - metric: >-
        transported_class_uniformity - law of c along one isogeny class with P
        transported by an explicit isogeny of degree coprime to N
      direction: different
      minimum_effect: >-
        Predicted uniform. A departure here is the SAME OBJECT as
        IDEA-20260821-3d5f22's edge character, and the two records must be
        RECONCILED before either is interpreted; they measure adjacent quantities
        deliberately and disagreement is informative about the instrument.
  test_boundary:
    instances:
      - >-
        at least 2000 toy curves over primes with 10^3 <= N <= 10^4 and PRIME group
        order, generic j
      - a random-generator null on the same instances
      - the pi = "return P" constant-predicate slice
      - curves with j = 0 and p = 1 mod 3, with an Aut-equivariant predicate
      - one isogeny class with P transported by an isogeny of degree coprime to N
    parameters:
      predicates_tested: at least three coordinate predicates, named and frozen in the contract
      labels_tested: 'D_0, two_torsion_x_count, volcano level, j in {0, 1728}, least-x value'
      instance_counts_for_decay: '{200, 500, 1000, 2000, 5000}'
      permutation_null_draws: 10000
      replication_primes: 2
      alpha: 0.05
    implementation: >-
      Exhaustive enumeration of E(F_p) and EXHAUSTIVE discrete logarithm for c at
      N <= 10^4, so NO HARDNESS ASSUMPTION ENTERS THE MEASUREMENT - the toy scale
      is chosen for exactly this reason. Conditional MI against a permutation null.
      A pre-registered, pi-independent sampler for P. Transport certificates
      re-verified INDEPENDENTLY OF THE TRANSPORT CODE.
    budget:
      estimated_wall_clock_seconds: 3600
      note: >-
        2000 curves times O(N) point enumeration and O(N) exhaustive discrete
        logarithm at N <= 10^4 is under 10^8 elementary operations - minutes on one
        core. Memory O(N) points per instance, negligible. The parent declares
        implementation medium and compute low.
  distinguishable_outcomes:
    - outcome: >-
        The gate reading finds the range-side cell ALREADY ADJUDICATED in a primary
        record (IDEA-20260807-413fcc, IDEA-20260811-b2806a or IDEA-20260807-63056d).
      means: >-
        THE HYPOTHESIS IS WITHDRAWN, at the cost of three file reads, and the
        withdrawal is recorded. This is listed FIRST because it is the likeliest
        cheap outcome - the source session's prior on it is 0.35 - and because a
        hypothesis that cannot name its own withdrawal condition is not
        falsifiable.
    - outcome: >-
        c is uniform and label-independent within the reported MDE on every tested
        predicate, with both positive controls firing and the null accepted at the
        nominal rate.
      means: >-
        The simulability condition HOLDS at this scope: CSEL(pi) joins the closed
        cell for the tested predicates, GOAL-ENDO-001 criterion C3 gains a DECIDED
        entry, and an entire family of "publicly computable canonical point"
        proposals is closed at this scope WITH A NUMBER rather than a verdict. The
        recorded obstruction is THE MDE ITSELF - the effect size the experiment
        could not have missed.
    - outcome: >-
        Some predicate shows c non-uniform, or some label shows MI above the null's
        99th percentile, replicated at a second prime.
      means: >-
        CSEL(pi) is NON-SIMULABLE for that predicate: the campaign holds a publicly
        computable statistic of secret-free curve data correlating with a
        group-theoretic quantity, located precisely. GOAL-ENDO-001 P3 APPLIES - an
        independent review-adversarial session runs BEFORE any record states the
        excess. Even then it is NOT an attack: the adversary must still solve a
        discrete logarithm to use rho(E).
    - outcome: >-
        A positive control (the j = 0 equivariant predicate, or c = 1) fails to
        fire.
      means: >-
        The battery cannot detect a signal it is GUARANTEED to face. No negative
        may be recorded (GOAL-ENDO-001 P1) and every arm is marked
        attempted_and_inconclusive. Instrument failure, not evidence.
    - outcome: >-
        The null's rejection rate GROWS with sample size.
      means: >-
        The battery is measuring an ARTIFACT; nothing may be read from any arm.
    - outcome: >-
        Marginals are uniform for every predicate but the CONDITIONAL structure
        differs between "least x" and "least x among even y".
      means: >-
        The named identifiability collision is real: the marginal test alone cannot
        adjudicate the class, and only the conditional arm carries the verdict.
        A record reporting the marginal result as a class adjudication would be
        over-reading.
    - outcome: >-
        The transported-class arm disagrees with IDEA-20260821-3d5f22's edge
        character measurement.
      means: >-
        The two adjacent measurements are inconsistent, which is informative ABOUT
        THE INSTRUMENT rather than about either hypothesis. Neither may be
        interpreted until they are reconciled.
