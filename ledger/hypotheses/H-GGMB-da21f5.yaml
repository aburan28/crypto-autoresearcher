  falsification_conditions:
    - >-
      The gate reading finds the range-side cell already adjudicated in a primary
      record. The hypothesis is WITHDRAWN and the withdrawal recorded.
    - >-
      Some predicate shows c non-uniform, or some label shows MI above the null's
      99th percentile, replicated at a second prime. The simulability conclusion is
      false for that predicate.
    - >-
      A positive control fails to fire. No negative may be recorded and every arm
      is attempted_and_inconclusive.
    - >-
      The null's rejection rate grows with sample size. The battery measures an
      artifact.
    - >-
      An explicit adversary distinguishes real from simulated CSEL with advantage
      exceeding (statistical distance of c) + q^2/N. HEUR-002 is refuted and the
      reduction's load-bearing joint fails.
  interpretation_limits:
    - >-
      TOY TIER, FINITELY MANY PREDICATES. Nothing transfers to cryptographic N and
      no transfer is offered; the transfer assumption that would be needed - that
      uniformity of c is not an artifact of small N - is NAMED AND NOT DISCHARGED.
    - >-
      A SIMULABILITY VERDICT IS A STATEMENT INSIDE A MODEL. It inherits every known
      limitation of generic-group arguments and says NOTHING about adversaries that
      use coordinates directly, which is every real non-generic method.
    - >-
      NO EXPONENT MOVES. The sqrt(N) generic bound is the incumbent and is not
      challenged; a simulable verdict CONFIRMS it for one more oracle cell, and a
      non-simulable verdict locates a resource WITHOUT exhibiting an algorithm that
      uses it.
    - >-
      CSEL IS NOT AN ATTACK EVEN IF NON-SIMULABLE. An adversary handed rho(E) must
      still compute log_P(rho(E)) to use it, which is another instance of the same
      problem. Any reading of a non-simulable verdict as an attack is unsupported.
    - >-
      THE WITHDRAWAL CONDITION IS REAL. If the gate finds the cell decided, this
      hypothesis contributes nothing beyond the check itself and should be RETIRED
      rather than defended.
    - >-
      SMALL N COARSENS THE MDE. At N ~ 10^3 the chi-square has few counts per cell,
      so a null excludes only LARGE effects and the record must say how large.
      Raising N raises the exhaustive-DL cost linearly, which bounds the design.
    - >-
      MULTIPLICITY IS A RECORDED CAMPAIGN DEFECT. Three predicates times five
      labels times two primes is thirty tests; without a declared correction the
      expected number of spurious rejections at alpha = 0.05 is about 1.5, LARGER
      than the effect being hunted.
    - >-
      A VERDICT UNDER ONE SIMULATOR FORMULATION DOES NOT TRANSFER TO THE OTHER.
      Shoup's and Maurer's models differ in what an adversary can ask about a
      returned element, and the contract must name which is used.
  status: proposed
  proposed_by: idea-generator
