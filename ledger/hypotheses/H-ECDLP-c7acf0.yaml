hypothesis:
  id: H-ECDLP-c7acf0
  area: ECDLP
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  source_proposal: IDEA-20260815-0253b6
  proposal_id: IDEA-20260815-0253b6
  title: >
    Stage 0 toy-DAG reachability
    identities — TIER2 unreachable
    under fail-only SDEG — before
    any PATH lane is retired
  status: specified
  proposed_by: idea-generator
  designed_by: coordinator
  designed_under_task: TASK-20260913-058b20
  specified_by: DEC-20260913-612208
  specified_at: '2026-09-13'
  created: '2026-09-13'
  updated: '2026-09-13'
  depends_on:
    - IDEA-20260815-0253b6
    - RQ-ECDLP-002
  related_hypotheses: []
  statement: >
    Fix the closed-form reachability
    identities of IDEA-20260815-0253b6
    on one frozen 3-node toy DAG
    before any PATH / SDEG / RELN /
    SIG / MONO / ICEX lane is retired
    or re-ranked. Stage 0 asserts only
    that TIER2, which depends on both
    SDEG and RELN, is unreachable when
    SDEG's admissible range is {fail}
    and RELN's is {pass}; that a
    nearby claim that a shuffled graph
    (TIER2 depends only on RELN) has
    the same retirement set is
    rejected; and that unconstrained
    admissible ranges retire nothing.
    This is not a PATH closure and
    not a rho beat. Stages 1+ stay
    unauthorized.
  mechanism: >
    IDEA-20260815-0253b6 tracks
    terminal-conclusion reachability
    under admissible deferred-lane
    ranges. Stage 0 freezes a 3-node
    DAG whose reachability is exact
    boolean arithmetic so a later
    campaign audit cannot be read
    from an instrument that cannot
    fail. No goal head is edited.
    No deferred lane is executed.
    No Semaev S_m. No DLP solve.
  predictions:
    - id: P-S0-REACHG
      metric: toy-DAG reachability identities
      direction: different
      minimum_effect: >
        After fixture_pass, REAL
        retires TIER2 and only
        TIER2. KF same-retirement
        on the shuffled graph is
        rejected. NULL unconstrained
        ranges retire nothing.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KF
      statement: >
        After fixture_pass, KF claim
        that the shuffled graph has
        the same retirement set as
        REAL is accepted.
    - id: F-S0-REAL
      statement: >
        After fixture_pass, REAL
        fails to retire TIER2 or
        retires a node other than
        TIER2.
  test_boundary:
    instances:
      - frozen Stage 0 REAL / KF / NULL toy-DAG panel
    parameters:
      real_graph:
        nodes: [SDEG, RELN, TIER2]
        edges:
          - {src: SDEG, dst: TIER2}
          - {src: RELN, dst: TIER2}
        admissible:
          SDEG: [fail]
          RELN: [pass]
        conjunction: all_parents_pass
        must_retire: [TIER2]
        must_keep: [SDEG, RELN]
      known_false:
        kind: shuffled_same_retirement
        edges:
          - {src: RELN, dst: TIER2}
        must_reject: true
      matched_null:
        kind: unconstrained_admissible
        admissible:
          SDEG: [pass, fail]
          RELN: [pass, fail]
        must_retire: []
      stage0_only_at_specify: true
    implementation: EXP-ECDLP-d4b462 Stage 0 runner
    budget:
      wall_clock_seconds: 120
    prose: >
      Toy 3-node DAG only. Stage 0
      is exact boolean reachability.
      It does not retire a live PATH
      branch, does not edit a goal
      head, and does not execute a
      deferred lane.
  assumptions:
    - id: A1
      statement: >
        The frozen graph is the
        3-node DAG above. Stage 0
        does not read live goal
        records as inputs and does
        not retire a campaign branch.
      status: explicit
    - id: A2
      statement: >
        Standing user authorization
        2026-09-06 covers protocol
        approval once the contract is
        complete.
      status: explicit
  heuristic_assumptions: []
  proof_search_map:
    bottleneck: >
      Whether TIER2 is unreachable
      under fail-only SDEG and the
      shuffled graph is rejected as
      the same retirement set.
    baseline_embedding:
      parameter_slice: >
        REAL 3-node DAG, KF shuffled
        same-retirement, NULL
        unconstrained ranges.
        Disclosed tightening: toy
        calibrator only, not the
        proposal's PATH audit.
      reproduction_check: >
        REAL retires TIER2 only.
        KF rejected. NULL retires
        nothing.
    observation_collision:
      observable: retirement set of a 3-node conjunction DAG
      distinct_preimage_search: >
        Hold nodes and drop the SDEG
        edge (KF shuffled). Hold
        edges and drop range
        constraints (NULL).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Frozen 3-node reachability table.
        predicted_gain: >
          Exact known-false reject on KF.
          Zero claimed PATH closure.
    quantifier_order: >
      Freeze the DAG and ranges
      before reading the retirement
      set. Toy unreachability does
      not retire a live lane.
    method_ceiling:
      strongest_certifiable_claim: >
        Instrument reproduction on
        the declared frozen DAG.
        Never a PATH retirement.
        Never an ECDLP exponent.
      nearby_object_control: >
        NULL is unconstrained
        ranges. An argument that
        still retires TIER2 there
        is proves-too-much.
  knowledge_promotion:
    promoted: []
    not_warranted: Stage 0 design only. Nothing to promote.
  scientific_boundary: >
    Stage 0 P-S0-REACHG only. Not a
    PATH / SDEG / RELN / SIG / MONO
    / ICEX retirement. Not Semaev
    S_m. Not Coppersmith. Not a DLP
    solve. Not a rho beat. No Stage
    1 of EXP-ECDLP-d4b462. Does not
    edit any goal.yaml head.
