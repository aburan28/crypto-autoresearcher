hypothesis:
  id: H-MQOM-43932c
  question_id: RQ-MQOM-001
  added: '2026-08-25'
  derived_from_idea: IDEA-20260805-7abf04
  statement: >-
    The Fiat-Shamir and grinding design inequality of the MQOM v2.1 signature specification is
    met with EXACT equality at every one of its six distinct proof-system parameter triples, so
    the design carries no rounding reserve against any term the inequality omits. Four limbs are
    asserted, each falsifiable by exact integer arithmetic or by a documented reading.
    (M1) TABLE RECONSTRUCTION. For all six distinct rows, the published repetition count equals
    the ceiling of the security parameter minus the grinding parameter, divided by one less than
    the log of the challenge-space size. Six of six, or the design equation has been misread and
    the record is superseded rather than patched.
    (M2) ZERO SLACK. The slack integer, defined as the repetition count times one less than the
    log challenge size, plus the grinding parameter, minus the security parameter, is EXACTLY
    zero at every published instance; and the companion batching slack, the batching parameter
    times the log field size minus the security parameter, is likewise exactly zero.
    (M3) THE ASYMMETRY. Where a parameter was FORCED by the packing rather than chosen freely -
    the three-round variant's batching parameter - the slack is LARGE and strictly positive. Free
    parameters sit on their constraint; forced ones do not. This asymmetry is what distinguishes
    deliberate tuning from a ceiling that happens to round.
    (M4) THE STATISTIC IS NOT A CONSTANT OF THE APPARATUS. On matched null families that satisfy
    the same inequality WITHOUT having been tuned to it, the slack integer is NOT identically
    zero; its distribution has nonzero spread and its zero rate matches the rate forced by the
    ceiling arithmetic.
    The hypothesis is FALSE if any published repetition count differs from the ceiling formula
    (M1), if any slack is strictly positive (M2, restating the headline as zero slack at some of
    the instances rather than all), if the three-round slacks are also zero (M3, removing the
    support for the tuned-to-the-edge reading), or if the null family also returns identically
    zero (M4, in which case the statistic is a constant of the apparatus and the entire framing
    collapses to an observation about ceilings). NO PREDICTION IS MADE about the total of the
    consequent ledger; predicting it would be predicting the answer.
  mechanism: >-
    A design inequality with a ceiling generically leaves a remainder anywhere in a range whose
    width is one less than the log of the challenge-space size. When every free parameter is
    chosen so the remainder is exactly zero, the design is tuned to the edge of its own soundness
    constraint. That is a legitimate and efficient choice; its consequence is the point. At
    nonzero slack, a small omitted term is absorbed and nobody needs to know about it. At zero
    slack, every term the inequality does not carry - the oracle query count, the additive rather
    than multiplicative combination of two challenge phases, a split-the-repetitions forgery
    strategy, commitment-binding or salt-collision terms, and the relaxed-opening offset the
    specification itself describes and declines to adopt - lands as a bit-for-bit reduction of the
    claimed level rather than being absorbed.
    The deliverable is therefore a CHARGED LEDGER: one line per omitted term, each marked derived,
    derivably zero, or unresolved, against a design with no reserve to pay them from. The single
    highest-value unknown is decided by READING rather than computing - whether the first-phase
    challenge is global across the repetitions or drawn per repetition, which determines whether
    the split-repetition line closes at one bit or requires a full optimization.
    The null arm is what makes the observation mean anything. The slack integer is CONSTANT across
    the published family - identically zero - so its within-family spread is zero and it cannot
    discriminate anything internally. The comparator must therefore be taken outside the family:
    parameter sets satisfying the same inequality without having been tuned to it. If those also
    give identically zero, the statistic is a property of ceilings rather than of this design.
  assumptions:
    - >-
      That the published parameter table as transcribed is FAITHFUL. The parent proposal's numbers
      came through a lossy text extractor written in that session, which recovers table cells in
      reading order and could in principle transpose a column. A re-verification against the rendered
      document is a BLOCKING first stage and no stage may proceed past it on extracted text.
    - >-
      That the phrase soundness error in the design equations means a per-query bound. If it already
      means a work bound, the query-count ledger line closes at zero. This is a reading question with
      a documented answer, not a mathematical one.
    - >-
      NO ASSUMPTION is made that the scheme is insecure, that the omitted terms are nonzero, or that
      the designers overlooked anything. The ledger is symmetric: a complete ledger summing to zero is
      a supported statement that the accounting is tight, and it is a likely outcome.
    - >-
      Scoped to version 2.1 of the specification. A later specification, when it exists, requires every
      number to be recomputed before anything here is carried forward.
    - >-
      Everything here is in the random-oracle setting the specification's own security statement uses.
      Nothing transfers to a quantum-accessible-oracle setting and no quantum claim is made.
  proof_search_map:
    bottleneck: >-
      Whether the slack integer varies at all across families that were not tuned to the inequality. If
      it does not, the statistic is a constant of the apparatus and the observation says nothing about
      this design. Every other step is exact integer arithmetic on published numbers.
    baseline_embedding:
      parameter_slice: >-
        The six distinct published proof-system rows, reconstructed from the design equation alone.
      reproduction_check: >-
        The predicted repetition count must equal the published one at all six rows, in exact integer
        arithmetic. This is the audit's baseline reproduction and it can fail immediately: a single
        mismatch means the design equation was misread.
    observation_collision:
      observable: The slack integer.
      distinct_preimage_search: >-
        SUCCEEDS AND IS DISCLOSED AS THE CENTRAL RISK. The fibre over slack zero contains every published
        instance and unboundedly many hypothetical ones; nothing about the base field or the underlying
        hard problem is recoverable from the slack. Worse, the observable is CONSTANT across the published
        family, so its within-family discriminating power is exactly zero. The design survives only
        because the comparator is taken outside the family, which is what the null arm is for.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Report the slack integer alongside whether the parameter generating it was FREE or FORCED by the
          packing, rather than the slack alone.
        predicted_gain: >-
          The free-versus-forced asymmetry is what separates deliberate tuning from arithmetic
          coincidence; the slack alone cannot.
      - transform: specialization_pack
        proposed_object: >-
          Express each omitted term as a ledger line with a derived bit cost or an explicit
          derivably-zero statement, in ONE declared convention for what a claimed security level means.
        predicted_gain: >-
          Makes the terms additive on one scale, without which their sum is meaningless.
    quantifier_order: >-
      CLAIMED. FOR ALL six distinct published proof-system rows, the reconstruction holds and the slack is
      exactly zero. NOT CLAIMED. That zero slack implies any security shortfall - the ledger's total is
      pre-registered as UNKNOWN and may be zero - or that any statement of the form the scheme provides
      fewer than the claimed bits follows from anything here. Such a statement requires a completed ledger
      with every line marked derived, and even then is scoped to this version and this oracle model.
    method_ceiling:
      strongest_certifiable_claim: >-
        The six published rows are exactly reconstructed by the design equation; the slack is exactly zero
        at all of them and strictly positive at the forced-parameter variants; the null family's slack has
        nonzero spread; and the ledger has these lines with these markers and this unresolved count. It can
        never certify that the scheme fails any claimed level, never certify anything in a quantum oracle
        model, and never certify a bit cost for a line resting on an unretrieved attack formula.
      nearby_object_control: >-
        A published row with an unusually small grinding parameter, perturbed by plus or minus one with the
        repetition count held fixed. The slack must move by exactly plus or minus one. If the instrument does
        not respond to a one-bit perturbation of a published parameter, the arithmetic pipeline is broken and
        no negative may be reported from any stage.
    proof_obligations:
      - claim: The published repetition counts are reproduced exactly by the ceiling formula.
        responsibility: baseline
      - claim: The slack integer is exactly zero at every published instance.
        responsibility: correctness
      - claim: The forced-parameter variants carry strictly positive slack.
        responsibility: correctness
      - claim: The null family's slack distribution has nonzero spread at the forced rate.
        responsibility: strictness
      - claim: The instrument moves by one under a one-bit perturbation of a published parameter.
        responsibility: feasibility
      - claim: No ledger with unresolved lines is summed, and no security shortfall is asserted.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-MQOM-SLACK-1
      formal_statement: >-
        NOT LOAD-BEARING FOR THE HEADLINE. The slack being zero at the published instances is an exact
        integer identity in four published integers, established by evaluation rather than assumed. This entry
        exists to record that the central observation is unconditional and that the only exposure is
        evidentiary - the fidelity of the transcribed table - which the blocking first stage removes.
      random_model_justification: >-
        Not a distributional claim. Direct evaluation of a ceiling and a linear form over six triples in exact
        integer arithmetic.
      supporting_results: []
      validation_experiment_ids:
        - EXP-MQOM-37e794
      falsification_condition: >-
        Any published row whose slack is not exactly zero, computed from a re-verified table.
    - id: HEUR-MQOM-SLACK-2
      formal_statement: >-
        LOAD-BEARING FOR THE INTERPRETATION, NOT FOR THE ARITHMETIC. A designer choosing the grinding parameter
        for signing cost alone, without regard to divisibility, would produce a remainder approximately uniform
        on the range the ceiling leaves, so that six exact zeros indicate deliberate tuning rather than
        coincidence.
      random_model_justification: >-
        A counting argument only. The grinding parameter is chosen from a small integer range under competing
        pressures, and there is no reason to believe the induced distribution on remainders is uniform. Any
        probability quoted from this model is an ILLUSTRATION OF SCALE and must NEVER be reported as a p-value.
      supporting_results: []
      validation_experiment_ids:
        - EXP-MQOM-37e794
      falsification_condition: >-
        The null families - a prior version's parameter table by the same designers, and a synthetic sweep over
        the admissible grinding parameters - also return identically zero slack. The deliberate-tuning reading
        is then unsupported and must be reported as weakened or void.
  structural_ingredients:
    - description: >-
        The two design equations and the published parameter table of the MQOM version 2.1 specification.
      citation: >-
        MQOM version 2.1 algorithm specification, fetched and read by the parent proposal session through a
        lossy text extractor. THE EXTRACTION IS LOSSY and every number is to be re-verified against the rendered
        document as a blocking first stage.
      provenance: retrieved
      verified_by: >-
        The parent proposal session, with the extraction caveat recorded in that record. Re-verification is
        required here before any number is used.
      role: the published integers from which the slack is computed
    - description: >-
        A split-the-repetitions forgery strategy for multi-round Fiat-Shamir protocols, whose cost formula the
        highest-value ledger line would need.
      citation: >-
        RECALLED, UNVERIFIED. No paper was retrieved for the parent record. Retrieving it or re-deriving the
        formula from scratch is a declared stage, and the line carries NO number until then.
      provenance: recalled
      verified_by: null
      role: the ledger line that could change a claimed level, and the one resting on unverified recall
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: repetition_count_reproduction
      direction: higher
      minimum_effect: >-
        EXACTLY 6 of 6 distinct rows reproduced by the ceiling formula. Below 6, the design equation was misread
        and the record must be rewritten against what the specification actually says.
    - metric: fiat_shamir_slack_integer
      direction: different
      minimum_effect: >-
        EXACTLY 0 at every published instance. Any nonzero value falsifies the headline as stated and it must be
        restated as zero slack at some of the instances.
    - metric: batching_slack_integer
      direction: different
      minimum_effect: 'EXACTLY 0 at every published instance. Companion forced value.'
    - metric: three_round_slack_integer
      direction: higher
      minimum_effect: >-
        STRICTLY POSITIVE at every instance. If the forced-parameter slacks are also zero, the asymmetry claim is
        wrong and the tuned-to-the-edge reading loses its support.
    - metric: null_family_zero_rate
      direction: lower
      minimum_effect: >-
        STRICTLY BELOW 100 percent, with nonzero spread in the null slack distribution, and matching the rate
        forced by the ceiling arithmetic. If the null also returns identically zero, NO positive interpretation may
        be reported.
    - metric: ledger_total_bits
      direction: different
      minimum_effect: >-
        NO PREDICTION IS MADE, deliberately, because predicting the total would be predicting the answer. What IS
        pre-registered is that every line receives one of three markers - derived, derivably zero, unresolved - and
        that the count of unresolved lines appears in the headline of any resulting record. A ledger with unresolved
        lines MAY NOT BE SUMMED.
    - metric: first_phase_challenge_structure
      direction: different
      minimum_effect: >-
        A BINARY ANSWER WITH AN ALGORITHM-AND-LINE CITATION. This single reading decides whether the
        split-repetition line closes at one bit or requires a full optimization. It costs no compute and is the
        cheapest decisive gate available.
  test_boundary:
    instances:
      - The six distinct published proof-system parameter rows of the specification's parameter table.
      - The eighteen published instances those rows are shared across.
      - >-
        NULL FAMILIES: the prior version's parameter table by the same designers, and a synthetic sweep in which
        the grinding parameter ranges over its admissible values with the repetition count recomputed by the
        ceiling formula.
      - >-
        A perturbation instance derived from the published row with the smallest grinding parameter, as the
        responsiveness control.
    parameters:
      specification_version: 'v2.1, and only v2.1'
      slack_functionals: 'Fiat-Shamir slack; five-round batching slack; three-round batching slack'
      null_sweep_range: 'grinding parameter over 1 to 24 at each published security-parameter and challenge-size pair'
      oracle_model: 'random oracle plus ideal cipher, as the specification''s own statement uses; nothing in the quantum model'
    implementation: >-
      Exact integer arithmetic in pure Python under experiments/EXP-MQOM-37e794/driver/, plus a documented reading
      stage producing quoted excerpts with page references. Nothing under harness/ is modified.
    budget:
      wall_clock_seconds_total: 600
      maximum_memory_gb: 2
      maximum_runs: 6
  falsification_conditions:
    - >-
      Any published repetition count differs from the ceiling formula. The reconstruction is wrong and this
      hypothesis must be SUPERSEDED rather than patched.
    - >-
      Any published instance has strictly positive Fiat-Shamir slack. The headline is false as stated and must be
      restated as zero slack at a counted subset.
    - >-
      The null sweep returns zero slack for every admissible grinding parameter. The statistic is a CONSTANT OF THE
      APPARATUS, the framing collapses to an observation about ceilings, and it must be recorded as a controlled
      null rather than a finding.
    - >-
      The responsiveness control fails - the slack does not move by exactly one under a one-bit perturbation of a
      published parameter. The arithmetic pipeline is broken and NOTHING negative may be reported from any stage.
    - >-
      The three-round slacks are also zero. The free-versus-forced asymmetry claim is wrong and the tuned-to-the-edge
      reading loses its support even if the zeros survive.
    - >-
      The reading stage finds that the design equation is ALREADY stated as a work bound including the query count,
      that the two phases are already combined additively in the parameter choice, and that the first-phase challenge
      is global. Then the three most consequential ledger lines close at zero or one bit and the total is small.
      THIS IS THE MOST LIKELY SINGLE OUTCOME and it is a complete, reportable result, not a failure.
  interpretation_limits:
    - >-
      A zero slack is NOT an attack, NOT a cost, and NOT evidence that the scheme fails any claimed level. It is a
      statement about design margin. No sentence asserting a shortfall may be written from this record without a
      completed ledger whose every line is marked derived, and even then it is scoped to this version and this oracle
      model.
    - >-
      Nothing transfers to a quantum-accessible-oracle setting. The specification's own security statement is in the
      classical model, the quantum accounting is absent, and no quantum claim is made or implied.
    - >-
      The split-repetition ledger line is the one that could change a claimed level, and it rests on a RECALLED,
      UNVERIFIED formula. Until that formula is retrieved or re-derived, the line carries NO number and the ledger
      may not be summed.
    - >-
      Scoped to version 2.1. When a later specification exists, every number must be recomputed against it before
      anything here is carried forward, and the parent record's note that a later version does not yet exist is a
      statement about a date, not a permanent fact.
    - >-
      The slack functional was DEFINED AFTER the zeros were noticed. That ordering is disclosed rather than hidden;
      the defence is that the functional is the designers' own inequality rearranged and admits no free choice, and
      that the null arm tests the functional rather than the observation.
  status: proposed
  proposed_by: idea-generator
  specified_by: coordinator
  prior_evidence_refs:
    - RQ-MQOM-001
    - IDEA-20260805-7abf04
    - IDEA-20260801-018
    - IDEA-20260805-cec9b6
    - GOAL-MQOM-001
    - KN-LIT-7620
    - DEC-20260803-64b55b
  distinguishable_outcomes:
    - outcome: >-
        Six of six rows reproduce, all published slacks are exactly zero, the forced-parameter slacks are strictly
        positive, the null family shows nonzero spread at the forced rate, and the responsiveness control moves by one.
      meaning: >-
        M1 through M4 all hold. The design is verifiably tuned to the edge of both its own soundness inequalities, the
        free-versus-forced asymmetry supports that this was deliberate, and the ledger's lines are the terms that would
        land bit-for-bit. This is a statement about MARGIN STRUCTURE and carries no security verdict; the ledger's total
        is whatever the reading and derivation stages produce and was not predicted.
    - outcome: >-
        The reading stage finds the query count already inside the bound, the phases already combined additively, and
        the first-phase challenge global.
      meaning: >-
        The three most consequential ledger lines close at zero or one bit and the total is small. The designers'
        accounting is tight and complete, which is a real, complete and reportable NEGATIVE for this question, and was
        pre-registered as the most likely single outcome so it cannot be reframed afterwards as a disappointment.
    - outcome: >-
        The null family also returns identically zero slack across the sweep.
      meaning: >-
        M4 is FALSE. The slack is a CONSTANT OF THE APPARATUS - an artifact of how ceilings round - and the entire
        framing has no discriminating content. It is recorded as a controlled null; no positive interpretation of the
        published zeros may be reported, and the deliberate-tuning reading is void.
    - outcome: >-
        Any published repetition count fails to reproduce, or any published slack is strictly positive.
      meaning: >-
        M1 or M2 is FALSE. In the first case the design equation was misread and this hypothesis is SUPERSEDED, not
        patched. In the second the headline is restated as zero slack at a counted subset, which is a weaker but still
        reportable observation.
    - outcome: >-
        The responsiveness control fails, or the table re-verification against the rendered document disagrees with the
        extracted table.
      meaning: >-
        INSTRUMENT OR EVIDENCE FAILURE. In the first case the arithmetic pipeline is broken and nothing may be reported.
        In the second the extracted numbers were wrong and the record is rewritten against the re-verified table before
        anything is computed. Neither is a result about the design.
