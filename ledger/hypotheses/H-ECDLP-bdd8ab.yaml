    by one half is 2. One against one half has cross 1. At density 1
    the kangaroo coefficient is 2. At density one fourth the same
    formula gives the coefficient 4. Four exceeds 2 by 2, and 4 times
    2 is 8. The concentration exponent 3/4 against the floor exponent
    1/2 has cross 2. The bias exponents 1/2 and 1/4 have cross 2. The
    two meeting exponents are both 1/2, and their cross is 0.
