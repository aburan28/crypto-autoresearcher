  status: proposed
  status_note: >-
    PROPOSED, NOT APPROVED. Approval comes only with a future approved revised
    protocol (a new additive amendment to EXP-AUXIN-7e2e3d, or a successor
    experiment), in a later Coordinator decision after its own review round.
    AMD-EXP-AUXIN-7e2e3d-20260923-d1d10 is REFUSED by DEC-20260923-a4c3d5 and
    authorizes nothing under this hypothesis. PREDECESSOR H-AUXIN-66e6fd,
    succeeded in statement only. Its single untyped E(r), a minimum over both
    branches of one expression, cannot be typed without changing the statement
    (design report of TASK-20260923-5a2cbc, hypothesis_restatement_proposal;
    RT-20260923-38bbbf X3, resting on its J2 primary-source comparison). This
    record states the typed quantity and governs any future run on this
    question in place of that statement. H-AUXIN-66e6fd is not edited and its
    status is not moved by this filing; it carries an additive status_note
    pointing here. Id minted by the top-level session (allocate_id.py --next,
    --check) and declared by queue revision BATCH-09aadd-rev-1 (commit
    5a80f16e6c) before this file was written.
  proposed_by: coordinator

  statement: >-
    For each frozen standardized prime order r, pinned at run time from its
    named primary source, two typed quantities are determined by the divisor
    lattices of r - 1 and r + 1 respectively. E_minus(r) is the minimum over
    positive divisors d of r - 1 of log2(sqrt((r - 1)/d) + sqrt(d)) / log2(r),
    with input model P, [x]P, [x^d]P (one auxiliary power; Cheon 2006 Theorem
    1). E_plus(r) is the minimum over positive divisors d of r + 1 of
    log2(sqrt((r + 1)/d) + d) / log2(r), with input model [x^i]P for
    i = 1..2d (2d consecutive auxiliary powers; Cheon 2006 Theorem 2). The two
    are reported separately and never combined, each either exactly (complete
    certified factorization) or as a certified pair of bounds under a stated
    factoring budget, beside the same quantities for random primes of the same
    bit length. The exponents are exponents of Cheon's leading step-count
    expressions, in which each step is an exponentiation; the log p (or
    Exp_G(p)) factor and the O() constants are omitted, so they understate
    group-operation counts and are not in the unit of the rho exponent 0.5
    (CORR-20260923-f5f060). No inert-or-escalate dichotomy is asserted, no
    threshold on either quantity is asserted, and no row is read as
    curve-specific. The statement concerns integer factorizations and two
    closed-form leading expressions only.

  mechanism: >-
    The group orders of the frozen list are prime by construction, but r - 1
    and r + 1 are unconstrained by the curve-selection criteria. Cheon's two
    algorithms have different costs and different inputs on the two branches:
    for d | r - 1 the leading expression is sqrt((r - 1)/d) + sqrt(d) with one
    auxiliary power; for d | r + 1 it is sqrt((r + 1)/d) + d, linear in d,
    with 2d consecutive powers (CORR-20260923-187ea3; confirmed against both
    the 2006 archive copy and the 2010 author manuscript by
    TASK-20260923-635c5c). Factor r - 1 and r + 1 with certified primes,
    enumerate each divisor lattice (or an explicit witness set when a
    cofactor remains), evaluate each branch's own expression at every
    candidate divisor, and report each branch minimum with its minimiser, the
    bits of d, and the input model it presupposes. Independent recomputation
    on a second arithmetic path is required before any row is believed.

  assumptions:
    - The curve list is frozen before any factoring; rows are not added, dropped or reordered after pinning begins.
    - >-
      Every r is pinned from its named primary source at run time; a field
      prime presented as r is rejected before any factoring. The BN254 row is
      alt_bn128 (DEC-20260923-a4c3d5 adopts the design report's
      disambiguation for the successor statement).
    - >-
      A branch with an unfactored cofactor is a BOUND, never an exponent: an
      upper bound over explicit divisor witnesses and the branch's analytic
      floor as lower bound. When several composite parts remain, the witness
      rule is fixed by the governing protocol before the run
      (RT-20260923-38bbbf O10).
    - >-
      The cost unit is Cheon's step (an exponentiation). The log factor that
      converts steps to group operations appears in the theorem statements of
      both versions read (not only in some writeups, as H-AUXIN-66e6fd
      assumption 3 said); it is omitted from the exponent and stated beside
      the table (CORR-20260923-f5f060).
    - >-
      Conditions the sources attach to the algorithms, carried as labels on
      each branch's input model and not folded into the exponent (RT-20260923-38bbbf
      O12): Cheon 2010 Theorem 2 is stated assuming the ERH (for a generator
      of the multiplicative group of the degree-2 extension); Cheon 2010
      Theorem 1's deterministic time uses a generator of Z_p^* found by
      factoring p - 1, which that paper costs at p^(1/4+o(1)) by heuristic
      analysis. The 2006 proofs take such generators as available.
    - >-
      A small branch exponent is a necessary condition for a Cheon-type
      speedup under supplied auxiliary input, not a sufficient one. Supply is
      IDEA-20260831-ccb587 and is out of this hypothesis.
    - DEC-20260802-204's acquisition gate stands.

  proof_search_map:
    not_applicable_reason: >-
      Exact integer factorization with certificates plus evaluation of two
      closed-form leading expressions. No theorem, reduction or asymptotic
      improvement is claimed. The protocol that tests this statement carries
      its own filled proof_search_map (bottleneck, baseline slice,
      observation collisions, quantifier order, method ceiling).
    bottleneck: null
    baseline_embedding:
      parameter_slice: null
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms: []
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: >-
        A certified, typed table of Cheon's known leading-expression exponents
        at specific integers, conditional on supplied input. It cannot move
        any exponent (known prior art, DEC-20260802-208).
      nearby_object_control: >-
        Random primes of the same bit lengths through the same pipeline;
        constructed planted-positive controls on each branch and an
        inert-on-both-branches control; a field prime presented as r.
    proof_obligations: []
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions: []
  heuristic_assumptions_note: >-
    None for the statement. It is integer factorization with certificates and
    exact evaluation. The ERH and generator-finding conditions above belong to
    the running time of Cheon's algorithms, which this hypothesis never runs;
    they are carried as labels, not as heuristics this statement depends on.

  structural_ingredients:
    - description: >-
        Cheon's d | p - 1 algorithm (one auxiliary power, leading expression
        sqrt((p - 1)/d) + sqrt(d), times a log p factor) and d | p + 1
        algorithm (2d consecutive powers, leading expression
        sqrt((p + 1)/d) + d, times a log p factor).
      citation: >-
        J. H. Cheon, Security Analysis of the Strong Diffie-Hellman Problem,
        EUROCRYPT 2006, LNCS 4004, Theorems 1 and 2 (IACR archive copy,
        https://www.iacr.org/archive/eurocrypt2006/40040001/40040001.pdf)
      provenance: retrieved
      verified_by: TASK-20260923-635c5c
      role: the two typed cost expressions and input models
    - description: >-
        Journal version of the same theorems: the same leading expressions
        with an Exp_G(p) factor, the linear d term on p + 1, i = 1..2d, the
        ERH assumption on Theorem 2 and the generator step on Theorem 1.
      citation: >-
        J. H. Cheon, Discrete Logarithm Problems with Auxiliary Inputs, Journal
        of Cryptology 23 (2010), author's final manuscript
        (https://www.math.snu.ac.kr/~jhcheon/publications/2010/StrongDH_JoC_Final2.pdf);
        the Springer typeset version was not read
      provenance: retrieved
      verified_by: TASK-20260923-635c5c
      role: confirmation of the typing and source of the carried conditions
    - description: >-
        This program's typing of the two branches and its labelling rule for
        any citing record.
      citation: ledger/corrections/CORR-20260923-187ea3.yaml
      provenance: internal
      verified_by: TASK-20260923-635c5c
      role: typing and labelling rule
    - description: >-
        This program's classification of Cheon auxiliary-input DLP as known
        prior art; no novelty is claimed for the algorithm.
      citation: ledger/decisions/DEC-20260802-208.yaml
      provenance: internal
      verified_by: TASK-20260913-9b4ec7
      role: novelty boundary

  reduction_chain:
    core_problem: >-
      exact typed divisor census of r - 1 and r + 1 for a frozen list of
      standardized prime orders, per branch
    corollaries: []

  predictions:
    - metric: planted-positive controls, one per branch, at a declared control size
      direction: different
      minimum_effect: >-
        Each planted branch is EXACT, its minimiser is the planted divisor
        (or its declared tie partner), and its exponent lies within the
        protocol's declared tolerance above that branch's analytic floor.
    - metric: inert-on-both-branches control
      direction: different
      minimum_effect: >-
        Both branches are EXACT and their minimisers are the small forced
        divisors the construction fixes, far from either branch's analytic
        optimum.
    - metric: field prime presented as r
      direction: different
      minimum_effect: Rejected before any factoring or cost is computed.
    - metric: per frozen row and branch, typed exponent (EXACT) or bound pair (BOUND), minimiser bits and input model
      direction: different
      minimum_effect: >-
        No value is predicted. Rows are reported, not tested, beside the
        random-prime null of the same bit lengths.

  test_boundary:
    instances:
      - NIST P-224 group order
      - NIST P-256 group order
      - NIST P-384 group order
      - NIST P-521 group order
      - secp256k1 group order
      - brainpoolP256r1 group order
      - brainpoolP384r1 group order
      - Ed25519 prime-order subgroup L
      - BN254 prime subgroup order, fixed to alt_bn128
      - BLS12-381 G1 prime subgroup order
      - constructed controls (planted positive on r - 1, planted positive on r + 1, inert on both branches), recipes declared by the governing protocol
      - a field prime presented as r (negative control)
      - random primes of the frozen rows' bit lengths (null arm, context only)
    parameters:
      branches: [r - 1, r + 1]
      cost_minus: sqrt((r - 1)/d) + sqrt(d)
      cost_plus: sqrt((r + 1)/d) + d
      exponent: log2(cost_b) / log2(r), per branch
      factoring_budget: the frozen factoring_seconds_per_integer of experiments/EXP-AUXIN-7e2e3d/specification.yaml
    implementation: >-
      Not yet fixed. A future approved revised protocol under
      EXP-AUXIN-7e2e3d (a new additive amendment) or a successor experiment.
      AMD-EXP-AUXIN-7e2e3d-20260923-d1d10 is refused by DEC-20260923-a4c3d5.
    budget:
      maximum_runs: 1
      maximum_workers: 1
      maximum_memory_gb: 8
      wall_clock_seconds: null
      total_cpu_hours: null

  falsification_conditions:
    - >-
      A constructed control fails a gate of the approved protocol (planted
      positive not recovered at its branch floor, or inert control not near
      its ceiling on both branches). The typed census pipeline is then
      falsified at that size and no frozen row may be read.
    - A field prime presented as r is admitted. The pin procedure is falsified; nothing is factored.
    - >-
      Any reported exponent or bound lies below its branch's analytic floor,
      or any evaluated plus-branch divisor d has sqrt((r + 1)/d) + d < d. The
      evaluator is falsified.
    - Reported prime factors of an EXACT branch do not multiply back to r - 1 or r + 1 in exact integer arithmetic.
    - >-
      A declared-state BOUND evaluator control returns a status, witness
      minimiser, bound or bin other than the value its protocol text fixes in
      advance (RT-20260923-38bbbf RC1).
    - A row omits either branch. That row is incomplete, not negative.

  interpretation_limits:
    - >-
      Measures divisor structure and evaluates two closed-form leading
      expressions. Does not run Cheon's algorithms, recover any discrete
      logarithm, or generate any auxiliary power.
    - >-
      Each branch exponent is conditional on its named auxiliary input being
      supplied, which is not examined here (IDEA-20260831-ccb587).
    - >-
      Bins or depth labels, if a protocol reports them, are descriptive. No
      row is read as curve-specific, and the random-prime arm is context, not a
      test. The earlier generic-signal reading rests on a 256-bit null only
      (CORR-20260923-187ea3, CORR-20260923-5c5a23 S3) and is not extended to
      other sizes without a measurement there (RT-20260923-38bbbf S5).
    - >-
      Exponents are in Cheon step units, not the rho unit
      (CORR-20260923-f5f060). Memory is stated in closed form by both theorems
      and is reported only if the protocol tabulates it.
    - >-
      On the two pairing-family rows (BN254, BLS12-381) the family polynomials
      force divisors (CORR-20260923-187ea3, expected_structure_flag). Deep
      branch values there are the expected case, not a surprise, and are
      reported in their own stratum.
    - >-
      Scope is the frozen list, the stated budget and the tested sizes of the
      controls; transfer of control validation to other sizes is an explicit
      assumption of the governing protocol.

