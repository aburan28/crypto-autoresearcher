hypothesis:
  id: H-CREP-001
  question_id: RQ-CRYPTO-001
  source_proposal: IDEA-20260723-001
  statement: >-
    Within a frozen set of eight named algebraic construction routes, at least
    one route produces an explicit, target-independent compact representation
    that constructs the exact target-label support factor z_R = gcd(g_I, r_R)
    directly from the compact source-labelled dyadic pair-product generators,
    with complete signed occurrence replay, whose declared preprocessing
    time/advice/state exponents are at most 9/4 in B and whose fresh-target
    online time/workspace exponents are at most 5/4 in B when N = B^5, and
    whose correctness is machine-verified on recorded symbolic instances
    (exact support equality against the reference gcd on every chart stratum
    and zero replay error). The hypothesis is falsified if every route in the
    frozen set fails the frozen verifier within budget, or if the best
    exhibited representation still materializes Theta(B^3) target-dependent
    coordinates.
  mechanism: >-
    Distinct public fifth-occurrence labels are the roots of the squarefree
    polynomial g_I, and the complete-chart intersection resultant r_R vanishes
    at a label exactly when that fifth occurrence extends to a labelled
    pair-pair relation, so z_R = gcd(g_I, r_R) is the exact support polynomial
    for extendible labels (preserved obligation
    OBL-ZR-COMPACT-CONSTRUCTOR-001, TASK-20260722-101 candidate report).
    Standard represented-resultant and indexing backends expose Theta(B^3)
    target-dependent scalar coordinates or assume r_R has already been
    supplied (EV-CRYPTO-002, DEC-20260724-003). The open step is an
    oracle-free compact constructor acting on the pair-product generators
    without importing that represented payload, source advice, or scalar
    orientation. This hypothesis bounds the constructive attempt to the eight
    frozen routes and a frozen verifier written into EXP-CREP-001; it claims
    no new algorithm and no achieved complexity exponent.
  assumptions:
    - >-
      The cost model is the academic one of the source obligation: a generic
      ordinary prime-field elliptic curve family with a public prime-order
      subgroup of order N = p^(1+o(1)); no standardized curve or real target
      is instantiated anywhere in the experiment.
    - N = B^5 and each of five signed, coloured, source-labelled decks has Theta(B) occurrences.
    - >-
      The complete signed projective group-law chart, occurrence
      multiplicities, and the infinity, tangent, vertical, repeated, and
      nonreduced strata are retained in the symbolic instance model.
    - >-
      Fresh targets are absent from preprocessing, advice, random seeds,
      caches, pointers, and fitted coefficients; target-independence is
      checked by the frozen mutation control, not assumed.
    - >-
      The favourable constant relation-density and independent-rank
      assumptions are separate unproved hypotheses and are NOT granted to any
      constructor; this experiment tests only the representation obligation,
      not the conditional complete path.
    - >-
      Polylogarithmic factors and one constant-degree field extension do not
      change exponents; the frozen verifier checks declared exponents in B
      with polylogarithmic factors absorbed.
    - >-
      The recorded symbolic instances are fully public combinatorial
      labelled-deck objects (no curve arithmetic, no hidden scalar), so the
      support biconditional holds by construction on each instance and is
      exactly checkable by the reference method.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: >-
        Generic-group square-root lower bound used only as the baseline
        convention (Pollard rho at N^(1/2+o(1)) = B^(5/2+o(1))) against which
        the B^(9/4)/B^(5/4) construction rectangle is defined.
      citation: >-
        Shoup, Lower Bounds for Discrete Logarithms and Related Problems,
        EUROCRYPT 1997 (KN-LIT-011); technique record KN-TECH-005.
      role: baseline_lower_bound
    - description: >-
        Fast multipoint evaluation and interpolation lineage underlying
        ROUTE-04 of the frozen route set.
      citation: Borodin and Moenck, Fast modular transforms, DOI 10.1016/S0022-0000(74)80029-2.
      role: route_backend_bound
    - description: >-
        Modular composition bounds underlying ROUTE-05 of the frozen route
        set.
      citation: Kedlaya and Umans, Fast Polynomial Factorization and Modular Composition, DOI 10.1137/08073408X.
      role: route_backend_bound
    - description: >-
        Truncated resultant algorithm underlying ROUTE-07 of the frozen route
        set.
      citation: Moroz and Schost, A Fast Algorithm for Computing the Truncated Resultant, arXiv:1609.04259.
      role: route_backend_bound
    - description: >-
        Elliptic-net term recurrence context for the excluded net-orientation
        routes (dedup control only; not a constructor).
      citation: >-
        Stange, Elliptic Nets and Elliptic Curves, arXiv:0710.1316; Lauter and
        Stange, The elliptic curve discrete logarithm problem and equivalent
        hard problems for elliptic divisibility sequences, arXiv:0803.0728.
      role: dedup_context
  reduction_chain: null
  predictions:
    - metric: support_symmetric_difference
      direction: lower
      minimum_effect: >-
        exactly 0 on every recorded instance stratum: a passing representation
        preserves the exact set of extendible fifth-occurrence labels as the
        reference gcd(g_I, r_R).
    - metric: labelled_source_replay_error_rate
      direction: lower
      minimum_effect: >-
        exactly 0: every reported support factor replays to an exact labelled
        source tuple, including negative child queries and exceptional strata.
    - metric: target_dependent_materialized_coordinates_exponent_in_B
      direction: lower
      minimum_effect: >-
        at most 9/4 for preprocessing-retained objects and at most 5/4 for
        online-materialized objects; Theta(B^3) target-dependent coordinates
        are a construction failure, not a style issue.
    - metric: fresh_target_online_exponent_in_B
      direction: lower
      minimum_effect: >-
        at most 5/4 including every O(log B) positive and negative dyadic
        replay query and the final exact source verification.
    - metric: route_verdicts
      direction: different
      minimum_effect: >-
        at least one of the eight frozen routes passes all frozen verifier
        predicates V1-V6 within budget (success), or all eight fail
        (falsification).
  test_boundary:
    instances:
      - >-
        eight frozen construction routes (component resultants, quotient-ring
        resultants, split norms, multipoint evaluation, modular composition,
        power projection, subresultant/half-gcd, displacement representation)
        as enumerated in EXP-CREP-001 inputs.frozen_route_set
      - >-
        twelve recorded symbolic labelled-deck instances: deck sizes B in
        {2, 3} crossed with six strata (no-relation unit, single hit,
        multi-hit, collision/duplicate endpoints, exceptional
        tangent/vertical/identity/infinity markers, repeated source), fully
        public and deterministically generated
      - two frozen verifier-calibration fixtures (one must-pass, one must-fail)
    parameters:
      deck_count: 5
      deck_sizes: [2, 3]
      strata_count: 6
      preprocessing_exponent_cap_in_B: 2.25
      fresh_target_online_exponent_cap_in_B: 1.25
      retained_advice_state_exponent_cap_in_B: 2.25
      replay_calls_per_tuple: O(log B) dyadic positive and negative queries
    implementation: >-
      Static typed-construction audit plus a deterministic verifier script on
      recorded symbolic instances; no elliptic-curve solver, no standardized
      curve, no Monte-Carlo sampling. Full contract in
      experiments/EXP-CREP-001/specification.yaml.
    budget:
      wall_clock_seconds_per_run: 1800
      total_wall_clock_seconds: 5400
      maximum_runs: 4
  falsification_conditions:
    - >-
      Every route in the frozen set fails at least one frozen verifier
      predicate within budget (scoped negative over the frozen route set).
    - >-
      The best exhibited representation (fewest predicate failures) still
      materializes Theta(B^3) target-dependent coordinates, i.e. fails the
      frozen compactness predicate V3.
    - >-
      A proposed construction is Query2P1, PCZT-E, whole-divisor translation,
      or a BATCH-002 forbidden payload (supplied resultant, residue, common
      factor, source tuple, scalar character, target-fitted selector) renamed
      without typed construction maps; such an attempt is recorded as a
      failed duplicate of EV-CRYPTO-002, not as a passing construction.
    - >-
      The exact support biconditional fails on any identity, infinity,
      tangent, vertical, collision, repeated, or nonreduced stratum of the
      recorded instances for an otherwise passing construction.
    - >-
      Total fresh-target work or peak workspace, including all replay calls,
      exceeds B^(5/4+o(1)), or setup/advice/retained state exceeds
      B^(9/4+o(1)), in the declared exponent certificate of every route.
  interpretation_limits:
    - >-
      A negative result is a scoped negative over the eight frozen routes and
      the recorded instance family only; it is NOT an impossibility theorem
      for compact representations, and it does not strengthen EV-CRYPTO-002
      beyond its named sheet.
    - >-
      A passing construction discharges only the academic exhibition
      obligation on symbolic instances; it is not an ECDLP algorithm, not a
      cryptographic advantage, and not evidence for the conditional N^0.45
      complete path, whose density, rank, factor-log, and masked-descent
      premises remain unproved.
    - >-
      Machine verification on B in {2, 3} symbolic instances checks semantics
      and declared accounting only; it never authorizes toy-curve,
      medium-scale, or cryptographic-scale claims.
    - >-
      Verifier or generator failure (crash, timeout, schema error) is an
      infrastructure outcome and is evidence for nothing (AGENTS.md rule 5).
    - >-
      The construction rectangle is asymptotic and academic; no
      implementation or operational procedure is specified, and no key,
      curve, or deployed system is touched.
  status: approved
  proposed_by: coordinator
