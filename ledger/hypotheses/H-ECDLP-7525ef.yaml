hypothesis:
  id: H-ECDLP-7525ef
  question_id: RQ-ECDLP-002
  statement: >-
    The seven headline prime-field ECDLP barrier claims recorded in the
    2026-08-04 closure series exist only as decision prose that received no
    independent review: the batch directories for that series carry a tasks
    directory and no reviews directory, the KN-FIND promotions those decisions
    named were later recorded as owed and never made, and the two open-problem
    entries the series claimed to close or partially address still read
    `status: open`. Scored against the inventor protocol's closure standard -
    a NAMED OBSTRUCTION, an ARGUMENT, and FORWARD GUIDANCE naming what remains
    open - fewer than seven of the claims pass all three bits, and any that fail
    are `unverified` rather than closed. Source proposal: IDEA-20260807-5a8d61.
  mechanism: >-
    A closure is a claim that further search in a region is not worth funding,
    and it is only reusable by a later session if it names the obstruction, gives
    the argument, and says what remains open. A count of screened-and-rejected
    mechanisms is a fatigue report whose honest status is `unverified`. Scoring
    each claim on those three bits, with a rubric frozen before any record is
    read, converts an aggregate prior that steers all downstream ideation into a
    checkable table. The aggregate "complete classical barrier" statement is the
    conjunction of its components and therefore inherits the weakest one.
  assumptions:
    - >-
      That the batch task artifacts of the closure series remain readable in the
      tree. If any are missing, the missing set is REPORTED as uncovered and
      never scored.
    - >-
      That scoring against the closure standard can be done by reading, without
      re-deriving the mathematics of each argument. The audit retains the
      mathematics by reference and does not re-derive it.
    - >-
      That the closure standard is qualitative, so two auditors may score
      differently. The rubric is therefore written and frozen BEFORE any record
      is read, and a second independent scoring of a sample is required.
    - >-
      That an auditor who also proposes replacements has an incentive to fail
      claims. The audit and any successor proposals must be separate records and
      the scoring must be done by a session that did not originate any of the
      seven claims.
  proof_search_map:
    bottleneck: >-
      The step whose removal changes the program's direction is the aggregate
      prior that one named path is the only live path to sub-rho classical
      prime-field ECDLP. That prior steers downstream ideation and has never been
      checked against the closure standard.
    baseline_embedding:
      parameter_slice: >-
        The boundary case is a closure the corpus already treats as genuine and
        that carries an explicit argument and a named obstruction. The rubric
        must score such a record 3 of 3.
      reproduction_check: >-
        A frozen regression fixture: four already-classified closures, two the
        corpus treats as genuine and two it treats as weak, scored before the
        seven and required to separate.
    observation_collision:
      observable: >-
        The three-bit compliance vector plus a claim tier, per claim.
      distinct_preimage_search: >-
        PERFORMED, AND THE OBSERVABLE IS DELIBERATELY WEAK. An audit produces
        compliance bits, never mathematics, so many mathematically very different
        closures map to the same vector. That collision is why the audit's output
        is a scored table with the missing element named per failure, and why no
        verdict may be read as a mathematical judgement.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The per-claim scored table with the specific missing element named for
          each failing bit.
        predicted_gain: >-
          Converts an unreviewed aggregate prior into a set of individually
          contestable rows, each of which a later reader can repair or dispute.
    quantifier_order: >-
      FOR ALL seven claims, the three-bit vector is computed under the frozen
      rubric. The existential the audit expects is THERE EXISTS at least one
      claim failing the argument bit; the source proposal points at one whose own
      limitations field states the underlying theorem remains unproven.
    method_ceiling:
      strongest_certifiable_claim: >-
        That, under a rubric frozen in advance and applied by a non-originating
        session, certain recorded claims do or do not carry the three elements
        the closure standard requires. It CANNOT certify that any closure is
        mathematically wrong, cannot reopen any lane, and establishes nothing
        about any elliptic curve.
      nearby_object_control: >-
        A closure the corpus treats as genuine (must score 3 of 3) and one whose
        own record states its theorem is unproven (must score 0 on the argument
        bit). Two nearby objects on which the rubric must give opposite answers.
    proof_obligations:
      - claim: The rubric is written and hashed before any of the seven records is read
        responsibility: baseline
      - claim: The rubric separates known-strong from known-weak closures
        responsibility: interface
      - claim: The rubric returns the planted score on each synthetic record
        responsibility: interface
      - claim: The two open-problem entries' current status is read, not assumed
        responsibility: correctness
      - claim: A FAIL is reported as `unverified` and never as "the direction is open"
        responsibility: scope
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-AUDIT-1
      formal_statement: >-
        Compliance with the closure standard's three elements is a usable proxy
        for whether a closure is reusable by a later session that did not write
        it.
      random_model_justification: >-
        None, and none is claimed. This is a methodological assumption, not a
        mathematical one. The protocol supplying the standard carries its own
        provenance caveat and may not be cited as evidence that following it
        produces results.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-cb556b
      falsification_condition: >-
        The rubric fails to separate the frozen known-strong and known-weak
        control closures. It is then not measuring closure quality and every
        count it produced is void.
  structural_ingredients:
    - description: >-
        The current status of the two open-problem entries the 2026-08-04 series
        claimed to close or partially address. Both still read `status: open` as
        of 2026-09-04.
      citation: 'knowledge/open-problems/KN-OPEN-005.md; knowledge/open-problems/KN-OPEN-009.md'
      provenance: internal
      verified_by: >-
        Coordinator subagent under TASK-20260904-43152a read the status line of
        both files by pattern search on 2026-09-04 and confirms both return
        `status: open`. This is a direct verification of the source proposal's
        claim on this specific point. Only the status line was read in each file;
        no other content of either entry is asserted here.
      role: >-
        Establishes that the reconciliation the closure series implied was never
        performed, which is one of the audit's three required metrics.
    - description: >-
        The closure standard - a negative result claiming a lane is dead needs a
        named obstruction, an argument, and forward guidance naming what remains
        open; a count of screened-and-rejected mechanisms is a fatigue report
        whose honest status is `unverified`, and this applies to the program's
        own standing saturation conclusions.
      citation: 'AGENTS.md, "Inventor protocol" section; docs/inventor-protocol.md section 4'
      provenance: internal
      verified_by: >-
        Coordinator subagent under TASK-20260904-43152a read the "Inventor
        protocol" section of AGENTS.md in full in this session and reproduces its
        closure-standard clause above in substance. It did NOT open
        docs/inventor-protocol.md itself; the section-4 attribution is taken from
        the source proposal and from AGENTS.md's own pointer, and the experiment
        must open the protocol file to fix the exact rubric text.
      role: >-
        Supplies the three bits the rubric scores.
  reduction_chain:
    core_problem: >-
      Whether the aggregate barrier statement steering downstream ECDLP ideation
      is supported by reviewed closures or by unreviewed decision prose.
    corollaries: []
  predictions:
    - metric: >-
        number of the seven claims passing all three closure-standard bits
        (integer, out of 7)
      direction: lower
      minimum_effect: >-
        Fewer than seven. Any number below seven changes what the owning goal is
        entitled to assert. The source proposal notes one claim is forced to fail
        the argument bit because its own limitations field states the theorem
        remains unproven; that record must be opened and quoted rather than
        assumed.
    - metric: >-
        per-claim three-bit vector and claim tier (three booleans plus a tier
        label per claim)
      direction: different
      minimum_effect: >-
        The vectors must not all be identical. An identical vector across all
        seven means the rubric has no comparator spread and every count is void.
    - metric: >-
        number of owed KN-FIND promotions still undischarged (integer count, with
        the id of each)
      direction: different
      minimum_effect: >-
        Reported as measured, no value predicted. The number is the deliverable
        and must not be assumed from the source proposal.
    - metric: >-
        reconciliation status of the two open-problem entries (status string,
        read at run time)
      direction: different
      minimum_effect: >-
        Both predicted to read `status: open`, which this design session already
        confirmed on 2026-09-04. If either has changed by run time, the audit
        reports the change and the corresponding row is restated.
    - metric: >-
        presence or absence of a reviews directory in each batch of the closure
        series (boolean per batch, with the directory listing recorded)
      direction: different
      minimum_effect: >-
        Predicted absent in every batch of the series. A reviews directory found
        in any batch falsifies the audit's framing for that batch and the row is
        rebuilt from what the directory contains.
  test_boundary:
    instances:
      - 'The eight decision records of the 2026-08-04 closure series named in the source proposal.'
      - 'The producer artifacts of the batch directories that series wrote.'
      - 'Four already-classified closures as the discrimination null.'
      - 'Four synthetic decision records with planted element counts of 0, 1, 2 and 3.'
    parameters:
      bits_scored: 'named_obstruction, argument, forward_guidance'
      rubric_frozen_before_reading: true
      second_independent_scoring_sample_fraction: 1.0
    implementation: >-
      Reading of committed records against a rubric written and hashed before
      any of the seven is opened. No compute.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 0.5
      maximum_memory_gb: 8
      maximum_runs: 3
  falsification_conditions:
    - >-
      All seven pass all three bits. The program legitimately owns the strongest
      set of barrier statements it has produced, and the audit says so. This is a
      real possible outcome and it is good news.
    - >-
      The discrimination null gives every control closure the same score. The
      rubric is useless and no verdict it produced is admissible.
    - >-
      The producer artifacts contain arguments the decision records omitted. The
      defect is in the decision prose, not in the research, and the repair is a
      superseding record rather than a downgrade.
    - >-
      The synthetic planted-score ladder does not return the planted counts. The
      rubric is not resolving the three bits independently and every score is
      void.
  interpretation_limits:
    - >-
      An audit changes no hypothesis status and closes no mathematics. Only the
      Coordinator may transition anything.
    - >-
      A FAIL means `unverified`. It does NOT mean "the direction is open and
      promising". The inventor protocol forbids declaring a direction impossible
      and equally forbids inflating an unverified closure; both errors are in
      scope here and the report must avoid both.
    - >-
      THIS ESTABLISHES NOTHING ABOUT ELLIPTIC CURVES OR THE ECDLP. The audit
      reads prose and produces compliance bits. Declared in advance so that no
      row can be quoted as a mathematical result. A curve-free object - any
      decision record about any subject - would produce the same kind of output,
      which is exactly why the scope statement is unconditional here.
    - >-
      NOT TESTABLE AT REACHABLE SCALE, IN THE ONLY SENSE THAT APPLIES: whether
      each barrier claim is TRUE is not tested and cannot be tested by reading.
      The audit tests only whether each claim carries the elements that would
      make it reusable. A claim that fails every bit may still be true.
    - >-
      The rubric is qualitative and its application is judgement-laden. That is
      why it is frozen before reading, why a second independent scoring is
      required, and why disagreement between scorers is reported rather than
      reconciled.
  status: proposed
  proposed_by: coordinator
  source_refs:
    - ledger/proposals/IDEA-20260807-5a8d61.yaml
    - knowledge/open-problems/KN-OPEN-005.md
    - knowledge/open-problems/KN-OPEN-009.md
    - ledger/questions/RQ-ECDLP-002.yaml
    - AGENTS.md
    - experiments/EXP-ECDLP-cb556b/specification.yaml
