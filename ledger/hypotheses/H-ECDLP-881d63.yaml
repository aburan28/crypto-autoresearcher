  statement: >
    Fix the integer profile
    (n, D)=(2, (2,2,2)) before any
    coefficient is read. Stage 0
    asserts only ARM S of
    IDEA-20260904-a195ff as exact
    integer arithmetic: the expected
    Hilbert series of a semi-regular
    sequence is
    HS(t)=prod_i (1-t^{d_i}) (1-t)^{-n}
    with (1-t)^{-n}=sum_k C(n+k-1, k) t^k,
    truncated at frozen max_degree=16, and
    d_reg is the least k in 0..16 whose
    coefficient is <= 0, or None if none
    exists. (i) REAL at (2,(2,2,2)) has
    d_reg=2; the bundled n=4, m=5 quadratic
    baseline has d_reg=3; (ii) KF is the
    complete-intersection nearby object
    (2,(2,2)), whose first non-positive
    coefficient is at 3, so d_reg=3 and
    is not 2; (iii) NULL drops every
    (1-t^{d_i}) factor, leaving the
    polynomial-ring series (1-t)^{-2},
    whose coefficients stay positive
    through degree 16, so d_reg is None
    and is not 2; (iv) n=0 and a
    non-positive degree are rejected.
    This is not a Groebner run, not a
    binary-field point-decomposition
    system, not a KN-LIT-4558 extraction,
    not a first-fall measurement, and
    not a rho beat. Stages 1+ stay
    unauthorized.
  mechanism: >
    IDEA-20260904-a195ff names ARM S as
    the zero-compute semi-regular Hilbert
    series of each cell's degree profile.
    Stage 0 freezes that series as an
    exact integer identity on one
    overdetermined quadratic profile
    whose closed form is (1-t)(1+t)^3,
    plus a bundled m=n+1 quadratic
    baseline whose closed form is
    (1-t)(1+t)^5. The producer evaluates
    the series by successive exact
    integer convolution against (1-t^{d_i}).
    The KF complete intersection and the
    NULL empty-degree polynomial ring are
    the proves-too-much and nearby-object
    controls. No Groebner basis is
    computed. No binary-field system is
    built. No literature value is
    extracted. This is a new RQ-ECDLP-002
    object after Stage 0 of
    EXP-ECDLP-fdae20 held as P-S0-BARS
    (DEC-20260908-978452). It is not
    Stage 1 of EXP-ECDLP-fdae20 and not
    Stage 1 of this experiment.
  predictions:
    - id: P-S0-HILB
      metric: well-defined exact Hilbert-series d_reg identity on the frozen profile
      direction: different
      minimum_effect: >
        After fixture_pass, REAL d_reg at
        (2,(2,2,2)) equals 2, and the
        n=4 m=5 quadratic baseline equals 3.
        KF (2,(2,2)) evaluates to 3.
        NULL empty-degree evaluates to None.
        n=0 and a non-positive degree are
        rejected. One certified miss after
        fixture_pass is a scoped
        falsification of this instrument
        on the frozen profile.
      claim_tier: observational
    - id: P-S1-CALIB
      metric: binary-arm first-fall calibration against published values
      direction: different
      minimum_effect: >
        Stage 1+, unauthorized here. Stage 0
        does not run a Groebner basis, does
        not build a binary-field
        point-decomposition system, and
        does not extract KN-LIT-4558.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KFCIPOS
      statement: >
        After fixture_pass, KF at (2,(2,2))
        reports d_reg equal to the REAL
        value 2. An encoding bug is
        failed_infrastructure.
    - id: F-S0-REALHILB
      statement: >
        After fixture_pass, REAL d_reg
        fails to equal 2, or the n=4 m=5
        baseline fails to equal 3. That
        falsifies only P-S0-HILB on this
        frozen profile.
    - id: F-S1-CALIB
      statement: >
        After an authorized later stage, a
        claimed binary-arm first-fall
        mismatch or structured-minus-null
        gap. Unauthorized here.
  test_boundary:
