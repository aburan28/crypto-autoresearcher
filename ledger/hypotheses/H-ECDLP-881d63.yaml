      max_degree: 16
      real: {n: 2, degrees: [2, 2, 2], must_d_reg: 2}
      baseline: {n: 4, degrees: [2, 2, 2, 2, 2], must_d_reg: 3}
      known_false: {n: 2, degrees: [2, 2], must_d_reg: 3, must_not_equal_real: true}
      matched_null: {kind: empty_degree_list, n: 2, degrees: [], must_d_reg: null, must_not_equal_real: true}
      stage0_only_at_specify: true
    implementation: EXP-ECDLP-735974 Stage 0 runner
    budget:
