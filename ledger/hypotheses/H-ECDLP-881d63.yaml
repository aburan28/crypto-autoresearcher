      EXP-ECDLP-90f602, and not Stage 2
      of EXP-ECDLP-4be480. No
      cryptographic transfer. No rho beat.
  assumptions:
    - id: A1
      statement: >
        d_reg is the least index in
        0..max_degree whose Hilbert
        coefficient is <= 0. A trailing
        zero of a polynomial Hilbert
        series (complete intersection)
        is a finite d_reg under this
        freeze, which is why KF (2,(2,2))
        has d_reg=3 rather than None.
      status: explicit
    - id: A2
      statement: >
        ARM S of IDEA-20260904-a195ff is
        the zero-compute semi-regular
        Hilbert series. Stage 0 tests that
        series as arithmetic, not a
        Groebner solving degree, not a
        published binary first-fall, and
        not a prime-field gap.
      status: explicit
    - id: A3
      statement: >
        Standing user authorization 2026-09-06
        covers protocol approval once the
        contract is complete.
      status: explicit
    - id: A4
      statement: >
        KN-LIT-4558, KN-LIT-005, and
        KN-LIT-010 remain pointers until
        an authorized later stage extracts
        them. Stage 0 does not discharge
        them.
      status: explicit
  heuristic_assumptions: []
  proof_search_map:
    bottleneck: >
      Whether d_reg of the frozen
      overdetermined quadratic profile
      equals 2 as exact integer arithmetic.
      Stage 0 only checks that identity,
      the n=4 m=5 baseline, the
      complete-intersection known-false,
      and the empty-degree nearby object.
    baseline_embedding:
      parameter_slice: >
        The REAL, KF, and NULL fixtures.
        Disclosed tightening: ARM S
        Hilbert-series identity only, not
        the proposal's binary-arm Groebner
        calibration, matched-null
        summation systems, prime-field
        arm, or KN-LIT-4558 extraction.
      reproduction_check: >
        REAL d_reg(2,(2,2,2))=2.
        Baseline d_reg(4,(2,2,2,2,2))=3.
        KF d_reg(2,(2,2))=3\neq2.
        NULL empty-degree d_reg=None\neq2.
    observation_collision:
      observable: >
        d_reg versus the first
        non-positive Hilbert coefficient,
        versus a complete intersection,
        versus the empty-degree series.
      distinct_preimage_search: >
        Hold n=2 and drop one quadratic
        (KF). Hold n=2 and drop every
        degree factor (NULL).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Frozen exact Hilbert-series d_reg identity.
        predicted_gain: >
          Exact known-false complete-intersection
          gap on KF. Zero claimed attack
          improvement.
    quantifier_order: >
      Freeze (n, D) before reading d_reg.
      Existential equality at one profile
      does not imply a Groebner calibration
      and does not imply a rho beat.
    method_ceiling:
      strongest_certifiable_claim: >
        Instrument reproduction on the declared
        frozen profile. Never a Groebner
        result. Never an ECDLP exponent.
        Never a binary-arm first-fall
        classification.
      nearby_object_control: >
        NULL is the empty-degree polynomial
        ring. An argument that still assigns
        it d_reg=2 is wrong. KF is the
        complete-intersection object; an
        argument that assigns every quadratic
        profile d_reg=2 is wrong.
    proof_obligations:
