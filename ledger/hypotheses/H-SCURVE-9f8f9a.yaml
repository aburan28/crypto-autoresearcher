hypothesis:
  id: H-SCURVE-9f8f9a
  question_id: RQ-SCURVE-df94be
  source_idea: IDEA-20261006-45f5a2
  experiment_id: EXP-SCURVE-647ade
  specified_at: '2026-10-06'
  status: approved
  proposed_by: coordinator
  approved_by_decision: DEC-20261006-af8214
  title: No useful non-scalar P-192 CM relation appears in the exact L<=2^48 generator box
  statement: >-
    Among all 4,974,348 canonical conjugacy representatives generated by the
    frozen primes at integral norm L<=2^48, exact form composition will find no
    non-scalar relation that also has globally Frobenius-oriented kernels,
    explicit replayable P-192 maps, and a fully charged end-to-end ECDLP or
    canonicalization advantage. Any zero finding is restricted to this box.
  mechanism: >-
    Once native certificates establish End(E)=O_D with fundamental D, oriented
    split and ramified prime forms generate a finite norm-bounded word set.
    Exact reduction and independent ideal HNF identify principal products. The
    lower bound N(u+v*pi)>=ceil(|D|/4) for non-scalar alpha places non-scalar
    principal norms far above 2^48, so the exact box is expected to contain only
    scalar ramified relations. Map and cost gates prevent an abstract identity
    from being mislabeled as a weakness.
  assumptions:
    - Native proofs establish p, n, and C prime, #E=n, D squarefree fundamental, and conductor one.
    - Binary-quadratic-form composition and the independent HNF verifier implement the frozen orientation convention.
    - The enumeration count and norm boundary are exact, not sampled.
  proof_search_map:
    bottleneck: A principal form identity must survive orientation, explicit-map replay, and a charged payoff inequality.
    baseline_embedding:
      parameter_slice: The prior no-extra-relation word-radius-at-most-16 check restricted to the frozen generator set.
      reproduction_check: Recompute that finite check before interpreting the larger norm-bounded census.
    observation_collision:
      observable: Reduced principal form plus an exponent-vector replay and independent principal-ideal HNF equality.
      distinct_preimage_search: Exclude zero, inverse pairs, immediate dual backtracks, scalar ramified squares, and duplicate conjugates.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: Relation certificate carrying alpha, norm, lambda, orientations, explicit chain, terminal isomorphism, and cost tuples.
        predicted_gain: Separates algebraic closure from an evaluable useful endomorphism.
    quantifier_order: >-
      First certify the exact order and generator table; then enumerate every
      canonical vector with L<=2^48; then verify relations independently; only
      afterward attempt maps and compare fully charged costs. No empirical
      calibration may alter the exact membership boundary.
    method_ceiling:
      strongest_certifiable_claim: Complete absence or classification of relations inside the frozen generator/norm box.
      nearby_object_control: The symbolic C-degree P-192 relation proves the verifier can recognize a genuine non-scalar principal relation while the cost gate rejects it.
    proof_obligations:
      - claim: End(E)=O_D and the generator roots/orientations are exact.
        responsibility: correctness
      - claim: The canonical enumeration contains exactly 4,974,348 vectors including zero.
        responsibility: size
      - claim: Every relation has reduced-form and independent HNF replay.
        responsibility: correctness
      - claim: Buildable hits include explicit oriented maps and raw HOT/COLD cost tuples.
        responsibility: interface
      - claim: A weakness requires a fully charged advantage over the applicable baseline.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: Parallel distinguished-point rho is the generic ECDLP comparison baseline.
      citation: KR-RHO-6239aa
      provenance: internal
      verified_by: coordinator read frontier row 2026-10-06
      role: attack-cost baseline
  reduction_chain:
    core_problem: Exact bounded class-relation enumeration and payoff audit on P-192.
    corollaries: []
  predictions:
    - metric: canonical_state_count
      direction: different
      minimum_effect: 4,974,348 including zero.
    - metric: non_scalar_relation_norm_lower_bound
      direction: higher
      minimum_effect: '6027344765084027530636040308278493916237318129474216339879'
    - metric: useful_buildable_relation_count
      direction: lower
      minimum_effect: Zero in the frozen exact box.
  test_boundary:
    instances:
      - NIST P-192 exact parameter tuple
      - D=-23 positive control
      - symbolic P-192 C-degree positive control
    parameters:
      max_ell: 113
      max_degree_bits: 48
      max_states: 5000000
      expected_canonical_states_including_zero: 4974348
      expected_oriented_states: 9948061
    implementation: Native Rust exact forms, native Pocklington, independent ideal HNF, and explicit map replay where buildable.
    budget:
      maximum_runs: 4
      maximum_memory_gb: 16
      maximum_workers: 8
  falsification_conditions:
    - Order, discriminant, root, count, or independent replay certificates fail.
    - A non-scalar relation with norm below the proved lower bound is verified.
    - A fully charged, explicitly mapped relation beats the baseline inside the frozen box.
  interpretation_limits:
    - A null is NO_WEAKNESS_FOUND_WITHIN_SCOPE, not proof that the class is strong.
    - Abstract relations and unevaluable maps are candidate-only.
    - HOT/COLD calibration ranks operations; it is not a cryptographic cost proof.
  dominated_by: A relation with no charged end-to-end gain is dominated by the generic-rho baseline.
  sota_delta:
    time: Zero unless an explicit mapped candidate passes the payoff gate.
    memory: Exact enumeration capped at 5,000,000 canonical states and 16 GiB.
    data_queries: Not applicable to the algebraic census; explicit map evaluations are counted separately.
