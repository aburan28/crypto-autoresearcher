hypothesis:
  id: H-FBST-c8a080
  question_id: RQ-MONO-001
  question_id_note: Attached to the nearest existing question. A Coordinator should mint RQ-FBST-*
    or re-point this; recorded as a known imperfection rather than inventing a question record.
  added: '2026-08-07'
  status: confirmed_scoped
  status_note: >-
    Status set by the top-level session under an explicit user waiver of Coordinator
    approval for /run-experiment on this specification -- NOT by an independent
    Coordinator, and NOT independently reviewed. "confirmed_scoped" because the main
    disjunctive statement is confirmed (at least one factor-base statistic varies across
    curves at matched N), but two of the three PREDICTIONS made below it were wrong in
    specific, recorded ways: see EV-FBST-8949fc for the corrected picture. Do not read
    this as validating the mechanism paragraph's ranking of which statistic would carry
    the effect.
  statement: 'At matched (p, B, m) on the factor-base locus, at least one of coverage, multiplicity
    dispersion, relation rank or recognizability varies ACROSS CURVES beyond the sampling-noise
    floor. Null: none does, and the factor-base locus is as inert across curves as its fibre
    statistics are.'
  mechanism: 'KN-FIND-007 fixes the mean decomposition yield by a double count and KN-FIND-a8990a
    Theorem C fixes the summation fibre to totally split, so neither can carry curve dependence.
    Everything the paper''s section 7 table lists as FREE is untested: coverage is bounded by
    min(1, mu) but its attained value is a property of the base, relation rank is invisible
    to the mean (a rank-deficient base scores tied with a random one), and recognizability is
    a cost, not a count. Relation rank is the most likely carrier because it is the only listed
    quantity that neither theorem and no measurement in this corpus has touched.'
  assumptions:
  - Matched (p, B, m) is the only fair comparison; size differences swamp structure differences.
  - The degenerate locus of the paper's Proposition 3.9 must be excluded before any statistic
    is computed -- it was 12% of factor-base samples at m=4 in RUN-SMON-e5cbe6-001.
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: NO ASYMPTOTIC CLAIM. A positive result would be a lead requiring re-measurement
    at larger scale, not a complexity statement.
  heuristic_assumptions: []
  predictions:
  - Mean yield shows EXACTLY zero across-curve excess variance (theorem).
  - Coverage varies across CONSTRUCTIONS but not across CURVES at fixed construction.
  - Relation rank is the most likely statistic to show curve dependence.
  falsification:
  - No statistic shows excess variance above the declared floor on more than one prime, in which
    case the search is a scoped null and must be recorded with its power rather than as 'no
    effect'.
  - The mean-yield control shows variation, in which case the instrument is broken and nothing
    else in the run may be read.
  pareto_integrity:
    dominated_by: Pollard rho at exponent 1/2
    sota_delta:
      time_exponent: not_applicable
      memory_exponent: not_applicable
    note: A search for a lever, not a claimed lever.
  experiment_ids:
  - EXP-FBST-190234
  evidence_ids:
  - EV-FBST-8949fc
  - EV-FBST-394e55
  owner: top-level session
