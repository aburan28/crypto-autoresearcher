hypothesis:
  id: H-SSI-03b806
  question_id: RQ-SSI-001
  source_idea: IDEA-20261006-0c760e
  title: >-
    Capped j-return lengths of the rational degree-3 and degree-5
    actions on y^2 = x^3 + x over F_59 are unequal.
  statement: >-
    Let p = 59 and let E0 be y^2 = x^3 + x over F_59. For ell in {3, 5},
    if E(F_59) has a unique subgroup of order ell, let one step be Vélu's
    quotient by that subgroup, and let the tracked value be the
    j-invariant of the quotient. Let o_ell be the least k in 1..16 such
    that the k-fold step returns j(E0), or 17 if no such k exists.
    The claim is o_3 != o_5.
  mechanism: >-
    Agreement, o_3 = o_5, means these two rational prime-degree actions
    are indistinguishable by capped j-return on this curve, including
    the case where both hit the sentinel 17. Disagreement means the
    capped j-orbits separate ell = 3 from ell = 5 at p = 59. Either
    outcome is a toy gate on the surviving commutative action. Neither
    outcome changes the subexponential classical vectorization cost or
    the quantum cost 2^{O(sqrt(log p))} stated in the opened CSIDH note.
  assumptions:
    - p = 59 is prime and 59 ≡ 3 (mod 4). The test checks both.
    - Supersingularity of E0 over F_59 is the equality #E0(F_59) = 60. If it fails, the instance is missing.
    - For each ell in {3, 5} the test uses a kernel only when E(F_59) has exactly one subgroup of order ell. Any other count makes that step undefined.
    - Quotient curves are compared by j-invariant in F_59, not by F_59-isomorphism.
  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
    not_applicable_reason: >-
      This is a toy measurement of two capped integers, not a proof,
      a reduction, or an asymptotic bound.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        At p = 59 only, the capped j-return o_ell imitates the order of
        one ideal class above ell in the class-group action, cut off at
        16. The imitation is not a theorem. Twists identified by j may
        make o_ell a proper divisor of that order. The sample is one
        curve and two primes ell. No transfer to another prime is claimed.
      random_model_justification: >-
        No uniform-random model is asserted. The cap and the prime are
        fixed. Sample size one has no tail probability.
      supporting_results:
        - >-
          KN-TECH-027, opened this session, states that the class group
          acts freely and transitively on a suitable set of supersingular
          curves over F_p. The suitable set is not identified with
          j-invariants in that note.
      validation_experiment_ids:
        - EXP-SSI-235f4c
      falsification_condition: >-
        The walk is defined and o_3 equals o_5, including the pair
        (17, 17). That refutes the inequality. It does not refute the
        class-group action in KN-TECH-027.
  structural_ingredients:
    - description: >-
        Commutative class-group action on supersingular curves over F_p,
        with classical vectorization subexponential in log p and quantum
        cost 2^{O(sqrt(log p))}.
      citation: KN-TECH-027
      provenance: internal
      verified_by: coordinator, this design session, via knowledge/techniques/KN-TECH-027.md
      role: baseline cost that this measurement does not change
  predictions:
    - metric: absolute difference |o_3 - o_5|
      direction: different
      minimum_effect: 1
  test_boundary:
    instances:
      - E0 y^2 = x^3 + x over F_59
    parameters:
      p: 59
      ell: [3, 5]
      cap: 16
      sentinel: 17
    implementation: >-
      No committed walker exists. The missing driver is a program that
      enumerates E0(F_59), walks at most 16 Vélu quotients by the unique
      rational subgroup of order ell for ell in {3, 5}, and writes o_3
      and o_5. harness/isogeny_class.py defines velu_odd for one odd-degree
      isogeny and is not that walker.
    budget:
      maximum_memory_gb: 1
      maximum_runs: 1
  falsification_conditions:
    - o_3 equals o_5, including the pair (17, 17), while the walk is defined.
    - "#E0(F_59) is not 60, so the walk is not run and the inequality is not tested."
    - For either ell the rational subgroup count is not 1, so o_ell is undefined.
    - A dual step fails to restore the starting j, so the Vélu step is invalid.
  interpretation_limits:
    - The sample is one prime and two primes ell. No transfer to CSIDH-512 or to any larger prime is claimed.
    - Equality inside the cap removes this separation at p = 59. It does not change the quantum cost.
    - Inequality is two integers. It is not an algorithm that recovers a secret ideal.
    - Exponent delta against the opened costs in KN-TECH-027 is 0.
  status: specified
  proposed_by: coordinator
  citations:
    - ref: KN-TECH-027
      provenance: internal
      claim: >-
        The opened note states that the class group of an imaginary
        quadratic order acts on supersingular curves over F_p by a
        commutative group action, that classical vectorization is
        subexponential in log p, and that the quantum cost is
        2^{O(sqrt(log p))}. It does not state return lengths at p = 59.
      verified_by: coordinator, this design session, via knowledge/techniques/KN-TECH-027.md
    - ref: IDEA-20261006-0c760e
      provenance: internal
      claim: >-
        The proposal states the prediction |o_3 - o_5| >= 1 with both
        integers in 1..17, and the negative outcome o_3 = o_5 including
        (17, 17).
      verified_by: coordinator, this design session, via ledger/proposals/IDEA-20261006-0c760e.yaml
