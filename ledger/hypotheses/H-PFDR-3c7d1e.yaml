hypothesis:
  id: H-PFDR-3c7d1e
  question_id: RQ-PFDR-ae2fba
  statement: >-
    The rank-1 closure of the lattice-describable factor-base family
    (IDEA-20260903-81a943, analysis/smallroot-reach/CLOSURE.md: eps_available <
    eps_required for every arity m <= 32 and every kept-window count w, worst-case
    margin -0.0481 at (m,w) = (4,2)) does NOT extend to rank-r >= 2 generalized
    arithmetic progressions, because the rank lever is the one lever inside the
    family that moves supply while holding demand and the information bound fixed.
    Concretely, in two parts.
    (P1, SUPPLY MOVES) For a rank-r GAP V = {a_0 + sum_{j<=r} a_j u_j : 0 <= u_j <
    B^{1/r}}, the substitution into the summation system is LINEAR in r variables
    per slot rather than affine in one, so a slot of per-variable degree 2 becomes
    a GROUP of r variables of total degree <= 2: the box axis becomes a simplex and
    the Newton polytope genuinely changes (this is exactly the case
    IDEA-20260808-c31f1c's invariance lemma leaves open, since that lemma covers
    only rank 1). Under the centroid form of the Jochemsz-May asymptotic reach,
    eps = n^2 / ((n+1) * sum_i c_i), with n = 3r and the continuous centroid
    2/(r+1) per coordinate of the group simplex {alpha in R^r_{>=0} : sum alpha <=
    2}, the all-S_3 configuration has eps_naive(r) = 3r(r+1)/(2(3r+1)) -- which is
    exactly 3/4 at r = 1 (the full-box S_3 value, the calibration point) and
    9/7 = 1.2857 at r = 2. Since eps = 1 is the information-theoretic ceiling, the
    prediction is that from r = 2 onward the JM polytope analysis CEASES TO BE THE
    BINDING CONSTRAINT on this family.
    (P2, DEMAND AND THE INFORMATION BOUND DO NOT MOVE) |V| = B is unchanged, so by
    KN-FIND-007 the yield and hence eps_required(m,w) = (w + 1/2 + 1/(2(m-1)))/(w+1)
    is unchanged; and prod(bounds) per slot = (B^{1/r})^r = B is unchanged, so the
    reach normalisation prod(bounds) <= p^(eps * #equations) and the ceiling eps = 1
    are unchanged. One side of the comparison is therefore fixed by construction and
    only the polytope moves, which is what makes this a controlled comparison rather
    than a reparametrisation.
    (P3, WHAT THAT DOES AND DOES NOT MEAN) eps_naive(r) > 1 is NOT a claim that the
    attack works. It is a claim that the rank-1 closure ARGUMENT stops applying, and
    that the binding question moves to ATTAINMENT: whether real lattice reduction
    reaches anything near the information bound. eps -> 1 is precisely lattice
    density 1, the regime in which low-density subset-sum lattice attacks are known
    to fail, so the hypothesis predicts that the measured planted-root recovery reach
    of real LLL on the same substituted system, compared against the JM bound
    computed at the SAME finite multiplicity, falls materially short of it and stays
    below eps_required(m,w) at every tested (m,w,r). Attainment, not the polytope, is
    predicted to be the residual obstruction.
  mechanism: >-
    (1) THE SUBSTITUTED POLYTOPE. Write the rank-r substitution slot-wise:
    x_i = a_{i,0} + sum_{j=1..r} a_{i,j} u_{i,j}. Under generic generators the
    monomial x_i^{e_i} expands to every monomial of total degree e_i in that slot's
    r variables (degree-graded convention SUB-EXACT, the a_{i,0} offset absorbed by
    the classical Coppersmith recentering), or to every monomial of total degree
    <= e_i (convention SUB-AFFINE, the offset not absorbed). Hence the substituted
    support of a summation polynomial f with support S in the slot variables is
      S_sub = { alpha in Z_{>=0}^{3r} : (|alpha^(1)|, |alpha^(2)|, |alpha^(3)|) in S }
    under SUB-EXACT, and its per-group downward closure under SUB-AFFINE. At r = 1
    SUB-EXACT is the identity, which is why the r = 1 cell is a sharp calibration of
    the implementation against two already-committed numbers (0.7500 full box,
    0.8408 true 13-monomial S_3) rather than a new measurement.
    (2) WHY THIS IS COMPUTABLE EXACTLY. The substitution is degree-graded, so
    Minkowski powers commute with it:
      supp_sub(f^j) = { alpha : group-degrees(alpha) in supp(f^j) },
    where supp(f^j) is the ORDINARY 3-variable Minkowski power the committed
    instrument already computes. Every quantity the Jochemsz-May extended strategy
    needs is then a closed combinatorial count over supp(f^j): the number of alpha
    with group degrees e is prod_i C(e_i + r - 1, r - 1); the coordinate sums s_i
    follow by within-group symmetry from e_i * N(e) / r; and the shift-set
    differences |M_k| - |M_k ^ M_{k+1}| follow from the same count with the leading
    monomial's per-group degrees subtracted. So exact reaches for r up to 4 need no
    enumeration in 3r dimensions at all -- but the identity is an implementation
    claim and must be checked against brute-force enumeration wherever brute force
    still runs.
    (3) WHY DEMAND IS PINNED. The three index-calculus inequalities of CLOSURE.md
    section 1 depend on the factor base only through |V| = p^beta and on the solver
    only through prod(bounds) <= p^(eps*(w+1)). Rank-r substitution changes neither:
    the r variables of a slot carry bound exponent beta/r each and multiply back to
    p^beta. The welded-lever coupling l = ceil((m+w)/(w+1)) is a statement about the
    addition tree, not about the factor base's internal geometry, so it survives the
    substitution untouched. Every term of eps_required(m,w) is therefore literally
    the same function, and the entire comparison reduces to one moving number.
    (4) WHY ATTAINMENT IS THE RESIDUAL QUESTION. The JM reach is an upper bound on
    what the shift lattice can certify, and it is derived under the heuristic that
    the short vectors LLL returns are algebraically independent. Howgrave-Graham's
    lemma is unconditional; the independence is not. As eps approaches 1 the lattice
    approaches density 1 and the number of genuinely independent short vectors is
    exactly what is expected to collapse. A polytope computation that returns a
    number above 1 has not measured a reach -- it has measured that its own
    derivation's binding constraint has vanished, and the only instrument that can
    speak to what remains is a real reduction on a real planted instance.
  assumptions:
    - The factor base is a rank-r generalized arithmetic progression with independent
      generators and nominal size B; decomposition proceeds by elimination on a binary
      addition tree; non-tree strategies are out of scope (inherited from
      IDEA-20260903-81a943).
    - Summation polynomials as in KN-TECH-002; S_3 support is the committed 13
      monomials of tools/smallroot_reach.py:s3_support(), S_4 = Res_Y(S_3, S_3)
      recomputed rather than quoted.
    - The Jochemsz-May reach depends on the Newton polytope and the bound vector, not
      on the coefficients (IDEA-20260808-c31f1c). This is itself tested here by the
      coefficient-structure control, not assumed silently.
    - >-
      eps = 1 is the information-theoretic ceiling under the declared normalisation
      prod(bounds) <= p^(eps * #equations); no reported supply value may exceed it.
    - Toy scale throughout. Exponents only, no wall-clock claim, no crypto-scale
      claim, claim tier toy.
  proof_search_map:
    bottleneck: >-
      One number: the Jochemsz-May extended-strategy reach of the rank-r substituted
      summation polytope, t -> infinity, under the declared normalisation. It is the
      only quantity in the CLOSURE.md decision table that the rank lever can move,
      and its sign against eps_required(m,w) is what extends or breaks the rank-1
      closure.
    baseline_embedding:
      parameter_slice: >-
        r = 1 under convention SUB-EXACT. The substitution is then the identity on the
        support, so the machinery must return the two already-committed values:
        0.7500 on the full box [0,2]^3 and 0.8408 on the true 13-monomial S_3
        polytope (analysis/smallroot-reach/CLOSURE.md section 3).
      reproduction_check: >-
        Frozen regression fixture: the r = 1 cells are compared to 0.7500 +- 0.02 and
        0.8408 +- 0.002, and tests/test_smallroot_reach.py must remain green
        unmodified. A miss is an implementation defect and invalidates the arm; it is
        never reported as a discovery.
    observation_collision:
      observable: >-
        The scalar eps_available, and downstream the margin
        eps_available - eps_required.
      distinct_preimage_search: >-
        Random polytopes drawn at matched monomial count and matched per-variable
        degree profile, and matched group structure, are the deliberate collision
        search: if a random support of the same size yields the same eps, then eps is
        reporting cardinality rather than GAP structure and the rank lever explains
        nothing. Both sides of the claimed conclusion are probed -- the r = 1 sparse
        S_3 cell (below the ceiling) and the r = 2 cell (above it).
    constructive_transforms:
      -
        transform: representation_reduction
        proposed_object: >-
          The group-graded coordinate system in which the substituted support is the
          exact preimage of the unsubstituted support under the group-degree map, so
          every Jochemsz-May quantity becomes a closed combinatorial count over the
          committed 3-variable Minkowski powers.
        predicted_gain: >-
          Exact reaches for r up to 4 without enumerating 3r-dimensional supports;
          turns an intractable enumeration into an O(|supp(f^t)|) count. Carries an
          encoding obligation (the identity) discharged by brute-force equivalence.
      -
        transform: observable_fiber
        proposed_object: >-
          Hold eps_available fixed and vary the rank: the fiber is separated by the
          attainment ratio (measured LLL reach divided by the JM bound at the same
          finite multiplicity), which is the intrinsic invariant distinguishing
          "the bound rose" from "the solver got further".
        predicted_gain: >-
          Prevents the interpretation trap in which a bound above the information
          ceiling is read as an attack.
    quantifier_order: >-
      FOR ALL (m, w) in the declared finite grid m in {4,5,6,8,12,16,24,32} with
      0 <= w <= m-2, FOR ALL r in {1,2,3,4}, FOR ALL block sizes l in {2,3} that the
      welded-lever relation l = ceil((m+w)/(w+1)) admits, the reported supply
      min(eps_available, 1) is compared against eps_required(m,w). The Arm B
      attainment statement is weaker and must stay weaker: THERE EXIST sampled GAP
      generators, seeds, primes and finite multiplicities t for which the measured
      reach is what it is; no uniformity over generators, over p, or over t is
      claimed, and no statement is made about t -> infinity attainment, which no
      finite experiment can reach.
    method_ceiling:
      strongest_certifiable_claim: >-
        A heuristic exponent at toy scale, plus an exact combinatorial value for the
        polytope bound. The method cannot certify that LLL attains the bound, and
        above eps = 1 it certifies nothing at all -- a value above the information
        ceiling is a statement that the derivation stopped constraining, not a reach.
      nearby_object_control: >-
        Two nearby objects where the hoped-for conclusion is known: (i) the univariate
        degree-d congruence, where the reach is a theorem (exactly 1/d), so an
        empirical pipeline that misses it is broken rather than informative; (ii) the
        matched-count random polytope, where no GAP structure exists, so any effect
        surviving there is not the rank lever.
    proof_obligations:
      -
        claim: r = 1 SUB-EXACT reproduces 0.7500 (full box) and 0.8408 (sparse S_3)
        responsibility: baseline
      -
        claim: >-
          The group-graded identity supp_sub(f^j) = preimage of supp(f^j) holds, so
          the fast combinatorial path equals brute-force enumeration exactly
        responsibility: correctness
      -
        claim: >-
          Exact reaches for r in {1,2,3,4} on S_3 (and S_4 where tractable) are
          computable inside the declared budget, with every uncomputed cell recorded
          as not_computed rather than silently modelled
        responsibility: feasibility
      -
        claim: >-
          eps_required(m,w) and the ceiling eps = 1 are unchanged under substitution,
          verified rather than asserted
        responsibility: baseline
      -
        claim: >-
          The measured planted-root recovery threshold is a real recovery: the
          recovered vector lies below the Howgrave-Graham bound and the recovered root
          re-verifies independently mod p
        responsibility: correctness
      -
        claim: >-
          The number of algebraically independent recovered short vectors is recorded,
          since that independence is the whole heuristic content of the JM reach
        responsibility: success_probability
      -
        claim: >-
          Every conclusion is scoped to the tested grid, the tested primes, the tested
          multiplicities, python-flint LLL, and the declared budget
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    -
      id: HEUR-R1
      formal_statement: >-
        For the rank-r substituted summation system at multiplicity t, the vectors
        that LLL returns below the Howgrave-Graham bound correspond to polynomials
        that are algebraically independent over the planted root's residue field, so
        the Jochemsz-May reach computed from the Newton polytope is attained by an
        actual reduction. Formally: for every tested (r, t, p, GAP), whenever the
        total bound exponent satisfies sum_i beta_i < eps_JM(r, t), the reduced basis
        contains at least 3r polynomials vanishing at the planted root whose Jacobian
        has full rank 3r at that root.
      random_model_justification: >-
        Howgrave-Graham's lemma is unconditional: a vector short enough yields an
        identity over Z. Only the joint independence of several such identities is
        heuristic, and it is modelled by treating the reduced basis as a generic
        basis of the shift lattice. That model is known to degrade as the lattice
        approaches density 1, which is exactly the regime this hypothesis enters.
      supporting_results:
        - Howgrave-Graham lemma as recorded in KN-TECH-015 (internal).
        - >-
          Coppersmith's univariate theorem, reach exactly 1/d, used as the external
          calibration target the instrument must hit (recalled; it functions here as
          a test the pipeline can fail, not as support).
      validation_experiment_ids: [EXP-PFDR-9b4f2a]
      falsification_condition: >-
        The attainment ratio (measured recovery threshold divided by the JM bound at
        the same finite t) is below 1 by more than the declared band on at least two
        independent seeds at r = 2 while the univariate control reproduces 1/d, at
        matched trial counts. That refutes attainment for the tested cells; it does
        not refute the polytope computation, which is exact.
    -
      id: HEUR-R2
      formal_statement: >-
        A rank-r GAP with generators drawn uniformly at random from F_p, nominal size
        B = (B^{1/r})^r and B <= p^{1/2}, has actual size |V| >= (1 - o(1)) B; i.e.
        the map (u_1,...,u_r) -> a_0 + sum a_j u_j is injective on the box up to a
        negligible fraction. Inherited from IDEA-20260808-c31f1c HA-1.
      random_model_justification: >-
        Self-overlaps require a nontrivial linear relation among the a_j modulo p
        with coefficients bounded by the box side, which is rare for uniformly random
        a_j; the model is genericity of random linear forms mod p.
      supporting_results:
        - IDEA-20260808-c31f1c HA-1 (internal, status proposed and unexecuted).
        - >-
          KN-FIND-007 (internal): mean decomposition yield is conserved across base
          geometries, so the demand side depends on |V| alone -- which is exactly why
          a degenerate GAP silently breaks the comparison.
      validation_experiment_ids: [EXP-PFDR-9b4f2a]
      falsification_condition: >-
        More than 10 percent of sampled GAPs at the tested parameters have measured
        |V| < 0.9 times nominal. Any individual GAP below that threshold is excluded
        from every reported cell rather than averaged in.
    -
      id: HEUR-R3
      formal_statement: >-
        For generators drawn uniformly at random, the substituted summation
        polynomial realises its full group-graded support: the expansion of
        f(a_1_0 + sum_j a_1_j u_1_j, ...) has support exactly
        { alpha : group-degrees(alpha) in supp(f) } under SUB-EXACT, with no
        cancellation among the generator products.
      random_model_justification: >-
        Each substituted coefficient is a fixed nonzero polynomial in the generators
        evaluated at a uniform random point of F_p^{3(r+1)}; by Schwartz-Zippel each
        vanishes with probability at most deg/p, and the tested p are far above the
        degrees involved.
      supporting_results:
        - >-
          Schwartz-Zippel lemma (recalled; used as the reason for a cheap direct
          check, not as a substitute for it).
      validation_experiment_ids: [EXP-PFDR-9b4f2a]
      falsification_condition: >-
        Any sampled generator set for which the directly expanded support over F_p is
        strictly smaller than the predicted group-graded set. A single such instance
        makes the polytope in Arm A the wrong object for the coefficients Arm B uses,
        and both arms must be rescoped before interpretation.
  structural_ingredients:
    -
      description: >-
        Jochemsz-May extended-strategy shift-set construction and its success
        condition, summed exactly over the shift monomials and extrapolated
        t -> infinity in 1/t.
      citation: Jochemsz-May, Asiacrypt 2006, extended strategy
      provenance: recalled
      verified_by: null
      role: supply-side reach computation
    -
      description: >-
        Coppersmith's univariate small-root reach p^{1/d}, used as the external
        calibration target for both the symbolic calculator and the empirical probe.
      citation: Coppersmith 1996
      provenance: recalled
      verified_by: null
      role: calibration against a theorem rather than against the instrument itself
    -
      description: >-
        Howgrave-Graham's lemma: a sufficiently short vector yields an identity over
        Z, unconditionally; only joint independence is heuristic.
      citation: KN-TECH-015
      provenance: internal
      verified_by: IDEA-20260903-81a943 (read in full by this record)
      role: separates the unconditional part of the reach from HEUR-R1
    -
      description: >-
        Mean decomposition yield is conserved across base geometries, so the demand
        side depends on the factor base only through |V|.
      citation: KN-FIND-007
      provenance: internal
      verified_by: EV-FBG-001
      role: pins eps_required(m,w) while the polytope moves
    -
      description: >-
        Affine substitution is polytope-neutral, so all rank-1 APs are equivalent to
        intervals; rank r >= 2 is explicitly left open as the live successor.
      citation: IDEA-20260808-c31f1c
      provenance: internal
      verified_by: IDEA-20260903-81a943 (read in full by this record)
      role: delimits exactly what the rank-1 closure covers and what it does not
    -
      description: >-
        Demand curve eps_required(m,w) = (w + 1/2 + 1/(2(m-1)))/(w+1); measured
        extended-strategy reaches 0.8408 (S_3, 13 of 27 monomials) and 0.4137 (S_4,
        439 of 625); welded levers l = ceil((m+w)/(w+1)); worst-case margin -0.0481
        at (m,w) = (4,2).
      citation: IDEA-20260903-81a943 / analysis/smallroot-reach/CLOSURE.md
      provenance: internal
      verified_by: tools/smallroot_reach.py with tests/test_smallroot_reach.py green
      role: the fixed side of the controlled comparison and the r = 1 calibration
  reduction_chain:
    core_problem: >-
      Whether the small-root supply available to a windowed prime-field decomposition
      test can exceed the index-calculus demand when the factor base is a rank-r GAP
      rather than an interval.
    corollaries: []
  predictions:
    -
      metric: eps_available_rank(r=1, SUB-EXACT, S_3, t -> infinity)
      direction: different
      minimum_effect: >-
        0.8408 +- 0.002, reproducing analysis/smallroot-reach/CLOSURE.md section 3.
        Full-box control in the same cell: 0.7500 +- 0.02. A miss is an
        implementation defect, not a result.
    -
      metric: eps_available_rank(r, SUB-EXACT, S_3, t -> infinity) for r in {2,3,4}
      direction: higher
      minimum_effect: >-
        Strictly greater than 1.0 for every r in {2,3,4}, and greater than or equal to
        the pre-registered naive centroid values eps_naive(r) = 3r(r+1)/(2(3r+1)) =
        9/7, 9/5, 30/13 (sparsity may only raise the value, as it did at r = 1 where
        0.8408 > 0.7500).
    -
      metric: eps_available_rank(r, SUB-EXACT, S_4, t -> infinity)
      direction: higher
      minimum_effect: >-
        Monotone increasing in r and at least eps_naive_S4(r) = r(r+1)/(4r+1) =
        2/5, 2/3, 12/13, 20/17 for r = 1..4; the r = 1 cell must reproduce 0.4137
        +- 0.002. Cells whose exact computation exceeds the declared budget are
        reported not_computed, never modelled into the measured column.
    -
      metric: attainment_ratio(r, t) = empirical_reach / jm_bound_at_same_t
      direction: lower
      minimum_effect: >-
        Strictly less than 1 at r = 2 on at least two independent seeds, while the
        univariate control reproduces 1/d to within 0.05. A ratio at or above 1 at
        r >= 2 would be the single most consequential outcome available here and
        routes to review-breakthrough rather than to a conclusion.
    -
      metric: >-
        best margin min(eps_available_rank(r), 1) - eps_required(m,w) over the
        declared (m,w) grid
      direction: different
      minimum_effect: >-
        No pre-registered sign. Under the SUB-EXACT prediction the supply column
        saturates at the ceiling 1.0 for r >= 2 and the margin becomes
        1 - eps_required(m,w) > 0 for every (m,w), which is why the margin ALONE may
        not be reported as "family alive": the ceiling is a bound the solver is not
        shown to reach, and the decision needs Arm B.
    -
      metric: >-
        random-polytope null distribution of eps at matched monomial count, matched
        per-variable degree profile and matched group structure
      direction: lower
      minimum_effect: >-
        The substituted-S_3 value lies above the 95th percentile of at least 30 null
        draws in the r = 1 cell; if it does not, eps is reporting monomial count and
        the rank comparison is uninterpretable.
    -
      metric: measured |V| of sampled rank-r GAPs versus nominal B
      direction: different
      minimum_effect: >-
        At least 90 percent of sampled GAPs have |V| >= 0.9 B; those below are
        excluded from every reported cell and their count is reported.
  test_boundary:
    instances:
      - >-
        Arm A (symbolic/combinatorial, field-free): the committed 13-monomial S_3
        support and the recomputed S_4 = Res_Y(S_3,S_3) support, substituted at
        r in {1,2,3,4} under conventions SUB-EXACT and SUB-AFFINE.
      - >-
        Arm B1 (empirical, generic coefficients): random-coefficient polynomials mod p
        with exactly the substituted S_3 support, planted root fixed through the
        constant coefficient.
      - >-
        Arm B2 (empirical, true curve coefficients): genuine S_3 for y^2 = x^3 + a x + b
        over F_p, with the curve completed by solving S_3(x1,x2,x3) = 0 linearly for b
        after sampling a and sampling x1,x2,x3 from the GAPs, so the planted root is a
        real three-term relation certified by independent curve arithmetic.
      - >-
        Controls: univariate degree-d congruences (d in {2,3,4}); random polytopes at
        matched count/degree/group structure; degenerate (rank-deficient) GAPs.
    parameters:
      ranks: [1, 2, 3, 4]
      block_sizes_l: [2, 3]
      substitution_conventions: [SUB-EXACT, SUB-AFFINE]
      demand_grid_m: [4, 5, 6, 8, 12, 16, 24, 32]
      demand_grid_w: all integers 0 <= w <= m-2
      arm_b_primes_bits: [24, 32, 40]
      arm_b_multiplicity_t: [1, 2]
      arm_b_beta_grid: 0.05 to 1.00 in steps of 0.05, per-slot total bound exponent
      arm_b_trials_per_point: 5
      gap_samples_per_cell: 20
      random_polytope_null_draws: 30
    implementation: >-
      New module tools/smallroot_reach_rank.py with tests
      tests/test_smallroot_reach_rank.py, IMPORTING tools/smallroot_reach.py and not
      modifying it: that file backs a merged analysis note and its ten tests are the
      regression gate for this work. Lattice reduction via python-flint
      (flint.fmpz_mat.lll); fpylll is NOT installed and may not be assumed. Exact
      integer/Fraction arithmetic throughout Arm A; no floating-point value enters a
      decision except through the declared extrapolation and its stated tolerance.
    budget:
      wall_clock_seconds: 3600
      memory_gb: 8
      maximum_runs: 24
  falsification_conditions:
    - >-
      P1 falsified: eps_available_rank(r=2, SUB-EXACT, S_3, t -> infinity) <= 1.0 with
      all calibration gates passing. The polytope bound then still binds at rank 2,
      the CLOSURE.md comparison remains meaningful there, and the margin sign is read
      directly -- a negative margin for every tested r EXTENDS the rank-1 closure to
      rank r <= 4, which is a strengthening and is a fully acceptable outcome.
    - >-
      P1 falsified in the other direction: the measured sparse value falls BELOW the
      pre-registered eps_naive(r) at any r >= 2 while the r = 1 calibration passes.
      Sparsity raised the reach at r = 1 (0.8408 > 0.7500); a substituted sparse
      polytope below its own full-simplex value contradicts the mechanism's account of
      what the substitution does.
    - >-
      P2 falsified: eps_required(m,w) or the normalisation prod(bounds) <= p^(eps*#eq)
      is found to change under substitution -- e.g. the per-slot bound product is not
      B, or measured yield for a rank-r GAP differs from the interval at matched |V|
      beyond the KN-FIND-007 band. The comparison is then not controlled and no margin
      may be reported.
    - >-
      P3 falsified: attainment_ratio >= 1 at r >= 2 on two or more independent seeds
      with the univariate control passing, i.e. real LLL reaches the JM bound in the
      regime where the bound exceeds the information ceiling. This opens a live attack
      lane and must be routed to independent review-breakthrough validation and red
      team before any statement is made.
    - >-
      HEUR-R3 falsified: any sampled generator set whose expanded support is strictly
      smaller than the predicted group-graded set.
  interpretation_limits:
    - >-
      A supply value above 1 is NOT an attack and NOT a margin. It is the statement
      that the Jochemsz-May polytope argument has ceased to constrain this family, and
      any reported margin must use min(eps_available, 1) with the raw value carried
      alongside and flagged polytope_non_binding.
    - >-
      Arm A is exact combinatorics about a polytope; it says nothing about whether any
      solver attains the bound. Arm B is a measurement at toy p, at finite
      multiplicity t in {1,2}, with one specific LLL implementation, on sampled GAPs
      and sampled coefficients. Neither arm alone decides the family.
    - >-
      No claim about t -> infinity attainment is possible from finite-t experiments;
      the attainment ratio is defined against the JM bound at the SAME t precisely so
      that the two are commensurable.
    - >-
      This concerns ONE factor-base family (rank-r GAPs) under ONE solver family
      (Coppersmith/Jochemsz-May with LLL) and ONE decomposition strategy (binary
      addition tree). It says nothing about non-tree decomposition, non-Coppersmith
      lattice solvers, superpolynomial-dimension lattices (IDEA-20260808-e2315e), or
      prime-field ECDLP as a whole, and it is not a closure of anything.
    - >-
      Exponents only. Claim tier toy. dominated_by remains Pollard rho at exponent
      1/2 and stays there unless Arm B demonstrates attainment above eps_required,
      which is not assumed.
  dominated_by: >-
    Pollard rho / van Oorschot-Wiener at exponent 1/2, memory O(1). Unchanged by this
    hypothesis: no attack and no exponent is claimed. Frontier rows checked: rho/vOW,
    BSGS, Kuhn-Struik, preprocessing frontier, special-curve attacks -- as in
    IDEA-20260808-c31f1c and IDEA-20260903-81a943.
  sota_delta: >-
    No attack delta. Methodological delta: computes the one lever
    analysis/smallroot-reach/CLOSURE.md section 6 item 1 names as the live open edge,
    and pairs it with the empirical attainment measurement that section 6 item 4 says
    would tighten the supply side, so that the polytope number cannot be read as an
    attack without the attainment number beside it.
