hypothesis:
  id: H-HQC-1d9b21
  question_id: RQ-HQC-001

  statement: >-
    SCOPE: HQC's key-recovery syndrome-decoding instance at the three published
    parameter sets; the algorithms Prange and Stern derived in closed form
    in-repo; the accounting basis ISD-FC-2026 (PROPOSED, NOT ADOPTED - see
    DEC-20260802-344883 D-6) with U4's cube-root access model, plus the planar
    and logarithmic models as declared sensitivity rows. CLAIM TIER toy: no
    execution occurs at any parameter set, cost EXPRESSIONS are evaluated at
    them. NO ATTACK IS PROPOSED AND NO SECURITY LEVEL IS ASSERTED.
    THE CLAIM, in two parts.
    (C1, DERIVED, PARAMETER-FREE) Under ISD-FC-2026's composition FC = H .
    T_wall with memory counted in hardware and U4's bisection-limited access
    model, an information-set-decoding variant that stores M bits in e-bit
    elements and performs A = Omega(M/e) genuinely random accesses satisfies
    FC = Omega(A . M^{1/3}) = Omega(M^{4/3}/e), while Prange's memory is
    polynomial so FC_Prange = G_Prange . poly(N). Hence a NECESSARY condition
    for any list-based variant to beat the full-cost baseline is
      M < G_Prange^{3/4}  (up to the declared polynomial factor).
    (C2, COMPUTATIONAL) That inequality, and the exact Stern optimisation
    behind it, are evaluable in closed form at HQC's published parameters in
    milliseconds of integer arithmetic, and the resulting (G, M, FC) triples
    ARE the memory-charged ISD baseline that GOAL-HQC-001's
    completion_criteria[0] requires, that GOAL-MCE-001 and GOAL-SDITH-001
    require identically, and that exists nowhere in this repository after three
    batches and 233 experiment directories.
    THE DIRECTION IS DECLARED BEFORE COMPUTATION. If the memory charge bites,
    the full-cost security floor for HQC key recovery is HIGHER than the
    published gate-count figure and HQC looks STRONGER, not weaker. A programme
    that reports only re-costings which lower security estimates is running a
    biased instrument, and ISD-FC-2026's rule U10 inherits KN-TECH-050's
    sentence that the charge "must be applied even when it works against the
    conclusion being argued for".

  mechanism: >-
    DERIVED IN-REPO from ISD-FC-2026 (read in full at
    coordination/goals/GOAL-HQC-001/batches/BATCH-001/tasks/TASK-20260802-0100a5/isd_costing_convention.md,
    rules U1-U6 and charge table section 3(a)-(d)) plus elementary
    combinatorics. Values marked [SESSION-COMPUTED] were computed while writing
    this record with the stated formula; they are PRE-REGISTERED INDICATIVE
    VALUES to be re-derived in-harness and are NOT measurements.

    (1) THE INSTANCE, AND ITS ONE AMBIGUITY. HQC's public key is (h, s = x +
    h.y) in F_2[X]/(X^n - 1) with x, y of weight w. Recovering (x, y) is
    syndrome decoding of a quasi-cyclic [N, K] = [2n, n] code at weight
    W = 2w. [SESSION-COMPUTED from SPEC Table 5: (N, K, W) = (35338, 17669,
    132) / (71702, 35851, 200) / (115274, 57637, 262).] SPEC section 4.1's
    English does not distinguish "each of x and y has weight w" from "the pair
    has total weight w"; both readings are carried and stage 0 resolves it,
    exactly as in H-HQC-d46460, because the two hypotheses share the sentence.

    (2) PRANGE IN CLOSED FORM. One iteration succeeds iff all W errors avoid
    the chosen information set:
      P = C(N-K, W)/C(N, W),  G_Prange = (N-K)^2 . N . C(N,W)/C(N-K,W),
      M_Prange = Theta(N^2) bits.
    [SESSION-COMPUTED with that exact expression: log2 G_Prange = 175.7 /
    246.8 / 310.9 under W = 2w; 109.4 / 146.5 / 179.6 under W = w.] THESE ARE
    DELIBERATELY CRUDE and are labelled so: they omit the quasi-cyclic DOOM
    factor (at most sqrt(n), i.e. 7.1 / 7.6 / 7.9 bits), omit the iterative
    Gaussian-update refinement that removes most of the (N-K)^2.N per
    iteration, and set the Theta constant to 1. Refining each of the three is a
    stage of EXP-HQC-50ebe9 and none is an assumption of the hypothesis. What
    the argument actually needs is only that M_Prange is POLYNOMIAL.

    (3) THE FULL-COST ASYMMETRY - THE WHOLE MECHANISM, IN FOUR LINES.
    U2 sets FC = H . T_wall with memory in H. For Prange, H = poly(N) and the
    algorithm is embarrassingly parallel, so FC is invariant under
    parallelisation and equals G_Prange . poly(N). For a list-based variant,
    H >= M and U4 gives T_access >= A / Theta(M^{2/3}), so
      FC >= M . A / M^{2/3} = A . M^{1/3},
    and with A = Omega(M/e), FC = Omega(M^{4/3}/e). Setting the two against
    each other gives C1's necessary condition M < G_Prange^{3/4}.
    [SESSION-COMPUTED under W = 2w: the memory ceiling is 2^131.8 / 2^185.1 /
    2^233.2 at HQC-1/3/5.] READ THAT CEILING HONESTLY: 2^131.8 is generous, and
    plausible list sizes for the advanced family at these lengths may sit far
    below it, in which case the charge does not bind and the ranking is
    unchanged. THE VALUE OF C1 IS THAT THE QUESTION BECOMES A COMPARISON OF TWO
    COMPUTED NUMBERS rather than a matter of opinion, and that the identical
    inequality answers GOAL-MCE-001 and GOAL-SDITH-001 with the same code.

    (4) STERN AS THE FIRST NON-TRIVIAL POINT, ALSO CLOSED FORM.
      P_Stern = C(K/2,p)^2 . C(N-K-l, W-2p) / C(N,W),
      list size L = C(K/2,p), M = 2 L (l + ceil(log2 L)) bits,
      G per iteration = Gauss + 2 L l (build) + collisions . (N-K-l) (check),
      expected collisions = L^2 / 2^l.
    Every term is an exact binomial expression and (p, l) are free. UNDER GATE
    COUNT ALONE the optimum pushes p and l up, buying time with memory. UNDER
    FC the same optimisation carries the M^{1/3} penalty and the optimum moves
    DOWN. THE GAP BETWEEN THE TWO OPTIMA, IN BITS, AT HQC's PARAMETERS, IS THE
    DELIVERABLE.

    (5) THE FORCED SHAPE - WHY THE GRADED CONTROL CANNOT BE FUDGED. Define
    FC*(M_max) as the minimum full cost over all (p, l) with memory at most
    M_max. The feasible sets are NESTED, so FC* is NON-INCREASING in M_max by
    construction, and it becomes CONSTANT once M_max exceeds the FC-optimal
    memory. Three shapes are pre-declared and each is diagnostic: a curve still
    falling at the largest cap means the charge never binds - a real,
    publishable negative and the one all three goals asked for; a curve that
    RISES anywhere is an implementation defect, since a minimum over a larger
    set cannot be larger; a curve that flattens well below the gate-count
    optimum is the positive result, and its flattening point must agree with
    the analytic stationarity prediction to within one ladder step.

    (6) WHAT THE ANSWER WOULD CHANGE, WITHOUT INFLATION. HQC claims 128 / 192 /
    256 classical bits. The indicative Prange figures above sit ABOVE those
    levels under the W = 2w reading, so the claimed levels rest on the advanced
    family delivering roughly 47 / 55 / 55 bits over Prange. The audit measures
    how many of those survive full cost; the answer is bounded below by 0 and
    above by that gap, and is NOT predicted here because predicting it would be
    a fit.

  assumptions:
    - >-
      THE WEIGHT READING. That W = 2w (each of x and y has weight w). Shared
      with H-HQC-d46460 and resolved in stage 0; both readings are carried
      through every computation and both are reported.
    - >-
      THAT ISD-FC-2026 IS THE BASIS. It is PROPOSED, NOT ADOPTED
      (DEC-20260802-344883 D-6). Using it here does not adopt it - adoption is
      a Coordinator act - and every figure must be re-derivable from the same
      code by changing U4 alone, which is why the sensitivity rows are
      mandatory rather than optional.
    - >-
      THAT PARAMETERS COME FROM PRIMARY TEXT. Stage 0 re-reads SPEC Table 5
      from the PDF rather than from the transcription, because a neighbouring
      table in the same document carried an error worth 50.7 bits at NIST-5
      (DEC-20260802-344883 D-2, resolved in CORR-20260802-3ae664).
    - >-
      NO PUBLISHED ISD COST FIGURE IS ASSUMED. Not Esser-Bellini, not any
      estimator output, not any number this program has not derived. Published
      figures enter only as an OPTIONAL comparison stage whose failure to
      obtain is an infrastructure outcome (AGENTS.md rule 5) and never a
      mathematical one. GOAL-MCE-001's checkpoint records TASK-20260803-f3aece
      reading Esser-Bellini Table 1 and declining to transcribe it; this
      hypothesis is constructed so that the gap does not block it.

  proof_search_map:
    bottleneck: >-
      The accounting basis on which "the best known attack costs 2^128" is
      asserted. Every security level HQC claims, and every margin statement any
      downstream record could make, passes through a cost model in which memory
      is free. If memory is not free, the bottleneck step is not any algorithmic
      step at all - it is the composition rule, and changing it changes which
      algorithm is the baseline without changing any algorithm.
    baseline_embedding:
      parameter_slice: >-
        M_max = poly(N) reproduces Prange exactly (Stern with p = 0, l = 0 IS
        Prange), and M_max = unbounded with the access charge switched off
        reproduces the published gate-count style of figure. The audit's claim
        is that these two slices differ, and both endpoints are computed rather
        than assumed.
      reproduction_check: >-
        A FROZEN NUMERIC FIXTURE, not a resemblance: the identical pipeline is
        run on baby-step giant-step for a group of order n, where the full-cost
        answer n^{2/3+o(1)} is published, is carried in this corpus at
        confidence established (KN-TECH-035 via KN-LIT-094), and was already
        reproduced once internally by TASK-20260728-007 objection F1 on the
        isogeny side. The pipeline must move the optimal table size from
        n^{1/2} to n^{1/3}. A pipeline that cannot reproduce the one full-cost
        figure this corpus holds at established confidence may not be used to
        produce a new one.
    observation_collision:
      observable: >-
        The triple (G, M, FC). ISD-FC-2026 U3 forbids ranking on G alone
        precisely because G collides across accounting bases up to a word-width
        factor.
      distinct_preimage_search: >-
        A COLLISION IS EXPECTED AND IS THE POINT OF U3: two algorithms with
        very different memory profiles can share a G, which is why a
        gate-count-only comparison cannot distinguish them. The collision that
        WOULD falsify this hypothesis is one in FC - two algorithms with
        genuinely different resource profiles receiving the same full cost -
        and the Prange-versus-Stern pair is exhibited as a separated pair by
        construction (FC_Prange = G . poly against FC_Stern >= M^{4/3}/e with M
        superpolynomial). The design tests the separation rather than assuming
        it: the Prange null must return FC - G <= 2 log2 N bits.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Build a problem-specific resource measure - the (G, M, FC) triple at
          ISD-FC-2026 occupancy - and add charges only over phases proved
          disjoint in time (permutation, elimination, list build, list query,
          verification), with each phase's occupancy interval declared.
        predicted_gain: >-
          Converts "memory should be charged" from a slogan into a per-phase
          arithmetic with an auditable asymmetry check. The obligation this
          carries is the asymmetric_charge_audit: ISD-FC-2026 U5 records that
          this program's own isogeny derivation charged lookups and not
          insertions, and had to withdraw an exponent.
      - transform: boundary_lift
        proposed_object: >-
          Enlarge the family from a single (p, l) point to the whole
          FC*(M_max) curve and prove a strict inward improvement - that the
          FC-optimal point lies strictly inside the gate-optimal one - rather
          than merely exhibiting one feasible point.
        predicted_gain: >-
          A single point can be dismissed as a bad parameter choice; a curve
          with a located interior optimum cannot. It also makes the negative
          outcome (curve never flattens) legible rather than ambiguous.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER: FOR ALL list-based ISD variants V, FOR ALL
      parameter sets in the declared boundary, IF V stores M bits in e-bit
      elements and makes A = Omega(M/e) random accesses, THEN
      FC(V) = Omega(M^{4/3}/e). The bound is uniform over variants and the
      witness (the layout achieving Theta(M^{2/3}) throughput) may NOT depend
      on the variant - it is a property of the store.
      THE INVERTED ORDER IS EXPLICITLY NOT CLAIMED AND WOULD BE FALSE: it is
      NOT claimed that FOR ALL variants there EXISTS a parameter set where the
      variant loses, nor that any variant satisfying M < G_Prange^{3/4} wins.
      C1 is a NECESSARY condition only, and reading it as sufficient is the
      error the record most expects a reader to make.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: a (G, M, FC) triple for Prange and Stern at HQC's,
        McEliece's and SDitH's parameters on a declared basis, with sensitivity
        rows; the necessary condition M < G_Prange^{3/4} for the wider family;
        and the located FC-optimal memory for Stern. The method CANNOT certify
        anything about MMT, BJMM or May-Ozerov beyond the necessary condition,
        cannot establish that any algorithm is best, cannot produce a security
        level, and cannot claim an attack. It also cannot settle whether
        Wiener's o(1) is loose at reachable sizes - KN-OPEN-017 holds that open
        in its own words ("No source in this corpus computes the crossover
        under full cost").
      nearby_object_control: >-
        The same pipeline applied to (a) baby-step giant-step, where the
        full-cost answer is known and the memory charge MUST move the optimum -
        if it does not, the instrument cannot detect a penalty that is known to
        exist; and (b) a low-weight, low-rate regime where Prange is known to
        be competitive on gate count alone, so that a verdict of "the charge
        decides it" cannot be produced by the accounting basis regardless of
        the parameters. A pipeline returning the same verdict everywhere is
        reporting its basis, not its input.
    proof_obligations:
      - claim: "FC = Omega(A . M^{1/3}) for any store of M cells with A random accesses, from U2 and U4."
        responsibility: correctness
      - claim: "A = Omega(M/e) for every list-based ISD variant."
        responsibility: feasibility
      - claim: "FC_Prange - G_Prange <= 2 log2 N bits (the null control)."
        responsibility: baseline
      - claim: "The pipeline reproduces n^{2/3+o(1)} for baby-step giant-step."
        responsibility: baseline
      - claim: "No phase is charged on read but not on write, or on query but not on build."
        responsibility: interface
      - claim: "delta_FC <= delta_G, strictly, wherever the FC-optimal memory is superpolynomial."
        responsibility: strictness
      - claim: "FC*(M_max) is non-increasing at every ladder step."
        responsibility: correctness
      - claim: "A cost model evaluated at crypto parameters is not crypto-tier evidence."
        responsibility: scope

  rerandomization: null

  asymptotic_claim:
    problem: >-
      Quasi-cyclic syndrome decoding at HQC's key-recovery parameters
      ([2n, n] at weight 2w), and the same instance shape for Classic McEliece
      and SDitH.
    prior_best: >-
      NOT TRANSCRIBED, DELIBERATELY. The published gate-count-only exponents
      for the advanced ISD family at these parameters are not in any record of
      this program; GOAL-MCE-001's own producer read the source table and
      declined to transcribe it. Obtaining them is a stage, their absence is an
      infrastructure outcome, and asserting a remembered number here would be a
      fabrication under AGENTS.md rule 9.
    time_exponent: >-
      NONE CLAIMED. This hypothesis proposes no algorithm and improves no
      exponent. What it can move is WHICH exponent is the baseline under a
      declared accounting basis - a reordering, not an improvement.
    memory_exponent: >-
      Computed, not assumed: polynomial for Prange, and the exact
      log2 M at the FC-optimal (p, l) for Stern, reported beside G for every
      cell as ISD-FC-2026 U3 requires and as
      docs/claims-and-verification.md requires ("memory complexity stated
      beside time, always").
    hidden_cofactor: >-
      The poly(N) in FC_Prange = G_Prange . poly(N) is not pinned analytically
      and is bounded operationally by the null control's pass condition
      (<= 2 log2 N bits). U4's achievability half is a modelling assumption,
      not a proof, and ISD-FC-2026 says so in its own text.
    claim_kind: constant_factor

  heuristic_assumptions:
    - id: HEUR-HQC-ISD-1
      formal_statement: >-
        FOR ALL list-based ISD variants V and FOR ALL parameter sets in the
        declared boundary, A(V) >= M(V)/e(V): every stored element is touched
        at least twice. Claimed uniformly over variants, not variant by
        variant.
      random_model_justification: >-
        Not distributional at all - a counting argument, given here rather than
        cited: a stored element that is never read could be omitted without
        changing the output, so any variant violating the bound has a strictly
        cheaper variant with the unread store removed, and the bound applies to
        that one.
      supporting_results: []
      validation_experiment_ids: [EXP-HQC-50ebe9]
      falsification_condition: >-
        Exhibit a list-based ISD variant whose stored elements are provably
        touched o(M/e) times with the output unchanged by deleting the untouched
        part. C1 must then be restated variant-by-variant rather than
        family-wide.
    - id: HEUR-HQC-ISD-2
      formal_statement: >-
        FOR ALL stores of M cells there EXISTS a three-dimensional layout and
        routing achieving Theta(M^{2/3}) random accesses per unit time (U4's
        achievability half).
      random_model_justification: >-
        The LOWER-bound half is a bisection-bandwidth argument and is rigorous.
        The achievability half is a MODELLING ASSUMPTION and ISD-FC-2026
        declares it as one; it is inherited here with that status intact and is
        NOT upgraded. The planar M^{1/2} and logarithmic alternatives are
        carried as declared sensitivity rows precisely because this is
        assumed.
      supporting_results: []
      validation_experiment_ids: [EXP-HQC-50ebe9]
      falsification_condition: >-
        The baby-step giant-step positive control fails to reproduce
        n^{2/3+o(1)}. That is the only internal check available and it is why
        the control is mandatory.
    - id: HEUR-HQC-ISD-3
      formal_statement: >-
        The (p, l) grid searched contains the true FC optimum, i.e. the
        optimum is interior to the searched box rather than on its boundary.
      random_model_justification: >-
        None needed - it is checkable rather than assumable: if the argmin lies
        on a boundary of the grid the grid is extended until it does not, and
        the final grid extent is recorded.
      supporting_results: []
      validation_experiment_ids: [EXP-HQC-50ebe9]
      falsification_condition: >-
        An argmin on a grid boundary that survives extension to the point where
        memory exceeds every physically statable bound.

  structural_ingredients:
    - description: >-
        Wiener full cost FC = H . T_wall with memory counted as hardware, and
        the three-dimensional bisection-limited access charge Theta(M^{1/3})
        per random access.
      citation: >-
        ISD-FC-2026 rules U2 and U4, at
        coordination/goals/GOAL-HQC-001/batches/BATCH-001/tasks/TASK-20260802-0100a5/isd_costing_convention.md,
        READ IN FULL. That document names KN-LIT-094 (Wiener) as relayed by
        KN-TECH-035 as its parent. THE WIENER PAPER ITSELF WAS NOT READ BY THIS
        SESSION - the citation is at one remove through the in-repo convention,
        and that remove is recorded rather than glossed.
      role: the composition rule and the access charge, i.e. the entire accounting basis
    - description: >-
        Prange's information-set decoding and Stern's list-based refinement,
        with success probabilities as ratios of binomial coefficients.
      citation: >-
        NO CITATION IS ASSERTED. Both are re-derived in this record from the
        algorithm descriptions; treating a remembered attribution or a
        remembered exponent as an authority is what AGENTS.md rule 9 forbids.
        Attribution to Prange (1962) and Stern (1988) is stated as
        RECALLED, UNVERIFIED and is a candidate to check in stage 0, not an
        authority.
      role: the two cost expressions actually evaluated
    - description: >-
        HQC's published parameter table (n, n1, n2, k, w, w_r, w_e and the
        claimed DFR per level).
      citation: >-
        SPEC Table 5, image-verified, as transcribed in
        coordination/goals/GOAL-HQC-001/batches/BATCH-001/tasks/TASK-20260802-6344ed/dfr_model_transcription.md.
        Re-read from the primary PDF in stage 0.
      role: supplies (N, K, W) at the three levels

  reduction_chain:
    core_problem: >-
      Produce the memory-charged (G, M, FC) baseline for information-set
      decoding at HQC's key-recovery parameters on a declared accounting basis.
    corollaries:
      - problem: >-
          The same baseline at Classic McEliece's parameters (GOAL-MCE-001,
          whose checkpoint records the gap explicitly).
        reduction_ref: >-
          No published reduction is cited and none is needed - it is the SAME
          computation with different (N, K, W). Stating it as a "reduction"
          would overstate it; it is a re-evaluation.
        asymptotics_preserved: >-
          Trivially, since nothing is transformed. What does NOT carry over is
          the verdict: McEliece's much lower rate changes the balance, and the
          contract requires the McEliece cell to be run as a nearby-object
          control precisely so that a rate-independent verdict is exposed as an
          artifact of the basis.
      - problem: >-
          The same baseline at SDitH's parameters (GOAL-SDITH-001, whose
          next_action states "The first deliverable is the memory-charged ISD
          baseline, not an attack").
        reduction_ref: >-
          Same computation, different parameters. No reduction claimed.
        asymptotics_preserved: >-
          Same caveat. SDitH's d-split constraint is NOT modelled here and any
          SDitH-specific statement requires it; this corollary supplies the
          plain-SD baseline only, which is what that goal's matched-baseline
          requirement asks for first.

  predictions:
    - metric: "log2 G_Prange at HQC-1/3/5, recomputed in-harness with the identical formula"
      direction: different
      minimum_effect: >-
        175.7 / 246.8 / 310.9 under W = 2w, or 109.4 / 146.5 / 179.6 under
        W = w, to within 0.1 bits. A departure means the parameter
        transcription is wrong and the package halts at stage 1.
    - metric: "the derived memory ceiling G_Prange^{3/4}, in bits"
      direction: different
      minimum_effect: >-
        2^131.8 / 2^185.1 / 2^233.2 under W = 2w. A forced value obtained from
        the previous metric by a fixed exponent; it admits no tuning.
    - metric: "FC*(M_max) evaluated at >= 5 memory caps spanning polynomial to unbounded"
      direction: lower
      minimum_effect: >-
        NON-INCREASING at every step, by nesting. Any increase is an
        implementation defect and invalidates the package. The flattening point
        must match the analytic stationarity prediction to within one ladder
        step, or the package reports which of the grid and the derivation is
        at fault.
    - metric: "delta_FC compared with delta_G (bits the advanced side buys, charged versus uncharged)"
      direction: lower
      minimum_effect: >-
        delta_FC <= delta_G STRICTLY wherever the FC-optimal memory is
        superpolynomial. NO NUMERIC VALUE IS PREDICTED for delta_FC and that is
        deliberate: pre-registering one would be a fit, and the contract's
        content is the method plus the sign. delta_FC > delta_G is a hard
        invalidation, never a finding.
    - metric: "baby-step giant-step full cost from the identical pipeline (positive control)"
      direction: different
      minimum_effect: >-
        n^{2/3+o(1)} with the optimal table size at n^{1/3}. IF THE PIPELINE
        DOES NOT REPRODUCE THIS, NO ISD NUMBER FROM IT MAY BE REPORTED IN
        EITHER DIRECTION.
    - metric: "FC_Prange - G_Prange, in bits (the null control)"
      direction: lower
      minimum_effect: >-
        At most 2 log2 N bits, i.e. at most 31 / 33 / 34 bits at the three
        levels. THE NULL CAN FAIL: a superpolynomial gap for an algorithm that
        stores no lists means the memory accounting is fabricating occupancy
        and every number in the package is void.
    - metric: "asymmetric_charge_audit: phases charged on read but not write, or query but not build"
      direction: lower
      minimum_effect: >-
        EXACTLY 0, verified phase by phase against an enumerated phase list by
        a reader who is not the producer. ISD-FC-2026 U5 records this exact
        defect being found in this program's own isogeny derivation
        (TASK-20260728-007 F1), forcing a withdrawn exponent; "none found" by
        the producer is not a finding until independently confirmed.

  test_boundary:
    instances:
      - HQC-1/3/5 key recovery, both weight readings, as cost expressions only
      - Classic McEliece parameters as a nearby-object control (rate far lower)
      - A low-weight regime where Prange is competitive on gate count alone
      - Baby-step giant-step at several n, as the positive control
    parameters:
      HQC_1: {N: 35338, K: 17669, W_reading_A: 132, W_reading_B: 66}
      HQC_3: {N: 71702, K: 35851, W_reading_A: 200, W_reading_B: 100}
      HQC_5: {N: 115274, K: 57637, W_reading_A: 262, W_reading_B: 131}
      algorithms: [prange, stern]
      access_models: [cube_root_primary, planar_sqrt_sensitivity, logarithmic_sensitivity, unit_cost_RAM_comparability_leg]
      memory_cap_ladder_points: 5
      grid: "(p, l) exhaustive over a box extended until the argmin is interior"
    implementation: >-
      Pure Python 3.11 arbitrary-precision integers and Fractions. NO numpy, NO
      sympy, NO scipy, NO network is required for any stage - which matters
      because sympy and scipy are ABSENT from this container (verified
      2026-08-05; numpy 2.4.6 is present but unused here). Binomial
      coefficients are computed exactly; comparisons are made on integers, and
      logarithms are used for reporting only, never inside a decision.
    budget:
      stage_0_1_wall_clock_seconds: 1800
      total_wall_clock_seconds: 3600
      maximum_memory_gb: 2
      stage_note: >-
        NO STAGE IS AUTHORIZED BY THIS RECORD. GOAL-HQC-001's committed
