  design_note: >-
    DESIGN ONLY. The vacuity argument, the balanced-statistic fix, the
    inherited matched-marginal shuffle and the intermediate-scale planted
    positive are the idea-generator's, and that planted positive is the
    strongest control in the source batch: it plants a signal at a KNOWN
    INTERMEDIATE scale rather than only at the maximal end, which is exactly
    what a red team elsewhere in this program said the incumbent control
    never established. The Coordinator's own contributions are: an amplitude
    rung between the existing scales so the ladder has four points rather
    than three; a multiplicative-group curve-free arm with a pre-declared
    consequence; and an honest reduction of the field-size ladder from the
    source's 16-30 bit band to 16-26 bits, because exact enumeration at 2^30
    does not fit the declared memory. No status of any record is changed and
    nothing here is evidence.

  status: proposed
  proposed_by: idea-generator

  statement: >-
    TEST BOUNDARY FIRST. Toy tier, prime subgroup orders in the 16 to 26 bit
    band, complete enumeration so the majority advantage and the maximal
    Fourier coefficient are computed EXACTLY, one fixed integer-lift
    convention, three declared statistics. No attack is run, every instance
    is self-generated, and no key material is involved. NO BOUND IS PROVED IN
    EITHER BRANCH.

    THE SETTING. E/F_p, P of prime order n, and for R in the subgroup write
    x(R) for the x-coordinate lifted to the integer interval [0, p). Define
    the THUE-MORSE statistic t(R) = (-1) to the power of the binary digit sum
    of x(R), and the RUDIN-SHAPIRO statistic r(R) = (-1) to the power of the
    number of occurrences of the block 11 in the binary expansion of x(R).
    Both cost O(log p) bit operations, far less than one group operation. The
    observable is the majority advantage of the statistic under the group law
    on prime-order subgroups, together with its Fourier form: the largest
    normalised coefficient of the statistic along the discrete-log
    coordinate.

    (A) THE GAP, STATED IN THIS CORPUS'S OWN NUMBERS. A sibling record pins
    every efficiently computable coordinate-derived statistic at the baseline
    within O(n^{-1/2}), "up to the degree of the defining conditions". The
    argument behind that phrase is a triangle inequality over the F_p-Fourier
    expansion of the statistic composed with a hybrid character-sum bound, so
    it reaches exactly the statistics whose F_p SPECTRAL NORM is polylog:
    intervals, bit windows, reductions modulo m, characters, bounded-degree
    algebraic conditions. A committed internal finding records that
    digit-sum-type filters are NOT in that class, with a measured spectral
    norm growing like a power of p rather than polylogarithmically, and
    marks that family NOT CLOSED. For the Rudin-Shapiro sign the escape is
    maximal: its exponential sums are O(square root of the length) uniformly
    in frequency, which by Parseval forces a FLAT spectrum with spectral norm
    of order the square root of p, so the composed bound reads
    sqrt(p) * sqrt(p) * log p divided by n - VACUOUS. For Thue-Morse the
    classical digit-sum bound gives a spectral norm up to a power of p well
    below 1 but far above polylog, and the composition is again vacuous. THE
    DIGIT FAMILY IS THEREFORE THE ONE CHEAP FAMILY FOR WHICH THIS PROGRAM'S
    PROBABILISTIC-REGIME CLOSURE HAS NO PROOF AT ALL.

    (B) WHAT WAS ALREADY MEASURED, AND WHY IT IS NOT THIS OBSERVABLE. An
    earlier lane measured digit statistics on a SUM-COMPATIBILITY observable
    and found popcount and digit-sum filters tripping its refutation
    criterion - with the matched-marginal shuffle reproducing both, i.e. a
    FALSE POSITIVE driven by the wildly unequal level sets of unbalanced
    filters. Nobody has measured the DISCRETE-LOG-COORDINATE observable for
    any digit statistic, and that is the observable identified as
    exponent-relevant: an advantage that does not decay in n means the
    statistic approximates an arithmetic progression in the discrete-log
    coordinate, which localises the scalar to a sub-interval at polynomial
    cost and is consumed directly by an interval method.

    (C) THE DESIGN FIX THAT MAKES THE CELL MEASURABLE. Use plus-or-minus-one
    statistics that are BALANCED over [0, p). Thue-Morse partial sums lie in
    a bounded set for every length, so its marginal bias over the interval is
    at most 1/p and the free marginal floor that produced the earlier false
    positive is absent BY CONSTRUCTION. Rudin-Shapiro partial sums are of
    order the square root of the length, a marginal bias at the same scale
    the whole measurement lives at, which is why it is the secondary
    statistic and why every arm is ALSO run through the matched-marginal
    shuffle. The residual marginal that matters is over the x-coordinates of
    the subgroup, not over the interval: it is a mixed sum of a digit sign
    against the Legendre symbol of the curve's cubic, for which this record
    knows NO bound, and which the run measures directly as the arm's own
    marginal.

    (D) THE CLAIM, STATED SO EVERY OUTCOME IS A RESULT. For the declared
    statistics on prime-order subgroups over the tested band, the advantage
    and its Fourier form decay like n^{-1/2} and match the keyed-random null
    and the top-bit comparator within the pre-registered band. THE CLOSURE
    READING: the Weil-scale ceiling of the probabilistic regime holds
    EMPIRICALLY for a family PROVABLY OUTSIDE its proof reach, so in the
    tested scope "the ceiling is the whole story" is a measured statement
    rather than a bounded one. THE LEAD READING: an advantage flat in n,
    surviving the shuffle and the null, which would be an efficiently
    computable approximate-progression statistic. THE INSTRUMENT READING: the
    planted positives fail to separate and nothing is read.

    WHAT IS NOT CLAIMED. No bound is proved in either branch. The lead branch
    would be a distinguisher-scale statement, NOT an attack; conversion to a
    solver is a separate question. Nothing here bears on the earlier lane's
    own open items or on any join or tree configuration. No status change to
    any record.

  mechanism: >-
    THE TRACKED OBJECT is the digit sign of the coordinate's integer lift - a
    ONE-BIT lossy projection of the point - followed through the group law in
    the PROBABILISTIC regime. It cannot propagate exactly, by a rigidity
    result this corpus already records, so the question is the SIZE of its
    majority advantage and of its Fourier coefficient along the discrete-log
    coordinate. The lossy-projection test is passed non-vacuously: one bit is
    retained out of log2 n, the discard is the whole point, and the bit
    cannot be inverted. It is NOT a change of coordinates, and it is not a
    function of any bounded-degree algebraic datum of the point - which is
    the record's entire premise.

    WHY THIS IS NOT A RENAMING OF THREE ADJACENT RECORDS. A sibling record
    measures p-ADIC digits of a canonical lift, which are poly-time functions
    of the F_p point of UNKNOWN algebraic degree, and its principal weakness
    is that no degree bound exists. THIS record's statistics are BINARY
    digits of the plain integer representative, for which the failure of the
    pinning is not an unknown but a MEASURED FACT - a spectral norm growing
    as a power of p, already recorded in this corpus, and forced flat for
    Rudin-Shapiro. A second sibling's projection panel contains only
    bounded-spectral-norm members - top bits, bottom bits, reductions modulo
    m - and deliberately excludes digit sums. The earlier lane measured digit
    statistics on a DIFFERENT observable with UNBALANCED statistics and got a
    marginal artifact; this record measures the discrete-log observable with
    BALANCED statistics and carries that lane's own shuffle forward as a
    blocking arm.

    WHY STAGE 0 COMPUTES RATHER THAN RECALLS. The premise - that the digit
    statistics lie outside the bound's reach - rests on classical digit-sum
    and Rudin-Shapiro exponential-sum results that NO AGENT IN THIS PROGRAM
    HAS OPENED. So Stage 0 does not rely on them: it COMPUTES the exact F_p
    spectral norms of both statistics over [0, p) by one length-p transform
    per ladder prime, and reports them beside the comparator's polylog norm.
    If either digit norm turns out polylog, the premise fails FOR THAT ARM,
    the arm is dropped, and the computed norm is archived. That is the
    difference between a premise and an assumption.

  assumptions:
    - >-
      n prime and the subgroup COMPLETELY ENUMERABLE, so the advantage and
      the maximal Fourier coefficient are computed EXACTLY and no estimator
      variance competes with the n^{-1/2} effect. This caps the ladder by
      design.
    - >-
      The integer lift is the canonical representative in [0, p). A balanced
      representative in the symmetric interval changes both statistics and
      would be a SEPARATE arm if run; the convention is fixed and named on
      every reported number.
    - >-
      The scalar is known to the harness for enumeration and for the planted
      positive, and is STRUCTURALLY WITHHELD from every statistic code path;
      the static provenance check is blocking.
    - >-
      Toy tier throughout, 16 to 26 bits; nothing is claimed at
      cryptographic n.
    - >-
      Curves screened for anomalous and smooth order before entering the run
      set, and the baseline charged against the PRIME subgroup order.

  proof_search_map:
    bottleneck: >-
      Not the instrument, which exists in two prior records, but the ABSENCE
      OF ANY BOUND for the digit family: the composed Weil argument is vacuous
      here and no replacement is known. A reviewer who supplies a bound of the
      right scale on the hybrid sum of a digit sign against the discrete-log
      character converts this record from a measurement into a confirmation,
      and should say so.
    baseline_embedding:
      parameter_slice: >-
        The COMPARATOR arm, the top bit of x, is an interval statistic with
        polylog spectral norm and is exactly the object a sibling record
        already measures at small primes and a second sibling adopts as its
        own baseline shadow.
      reproduction_check: >-
        The comparator's advantage at matched parameters must reproduce that
        record's committed values where the primes overlap, in exact
        arithmetic, read from that record's own text; and its fitted decay
        exponent must be consistent with 1/2. If the comparator misses, the
        estimator disagrees with the prior lane and NO digit-arm number is
        reported.
    observation_collision:
      observable: "The pair (maximal Fourier coefficient, majority advantage) at given n for a statistic."
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED IN ONE DIRECTION, AND A FAILURE IN
        THE OTHER. EXPECTED: the Thue-Morse arm and the comparator give the
        SAME observable within the band, although one is provably outside the
        bound's proof and the other inside it. That collision is the CLOSURE
        reading, not a failure: it says the observable does not see the
        spectral norm. WOULD BE A FAILURE: the unbalanced popcount arm
        matching the Thue-Morse arm BEFORE the shuffle, since the former
        carries a known marginal artifact and the latter is balanced. If they
        agree pre-shuffle, the balance argument is not doing what it claims
        and the marginal must be measured directly before anything is read.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (the discrete-log-coordinate advantage) fixed
          and vary the forgotten structure - the F_p spectral norm of the
          statistic, from polylog for the comparator through a power of p for
          Thue-Morse to the square root of p for Rudin-Shapiro. If the
          advantage is independent of the spectral norm, the bound's proof
          hypothesis is not the load-bearing one; if it grows with the norm,
          the hypothesis is real.
        predicted_gain: >-
          Turns "does the degree gap matter" into a one-dimensional curve in
          the spectral norm with a predicted flat shape.
      - transform: representation_reduction
        proposed_object: >-
          Move the earlier lane's question from the sum-compatibility
          observable, where the marginal artifact lives, to the
          discrete-log-coordinate observable, where the exponent-relevant
          content lives. Encoding exact; THE LOSS, STATED: a
          sum-compatibility gain and a discrete-log advantage are DIFFERENT
          quantities and neither implies the other.
        predicted_gain: "Closes, or opens, the cell the earlier lane left uncovered on the observable that would matter."
    quantifier_order: >-
      MEASUREMENT CLAIM: FOR ALL statistics in the DECLARED ARM SET, FOR ALL
      tested prime orders in the band, the advantage is at most the
      comparator's plus the pre-registered band and its fitted decay exponent
      lies in [0.4, 0.6]. The quantifier is over the DECLARED ARMS and the
      TESTED LADDER only.
      THE STRONGER READING NOT CLAIMED: that every digit statistic, or every
      statistic of unbounded spectral norm, is pinned. This record measures
      three members and says so.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "on the tested toy family the declared digit statistics show
        no discrete-log-coordinate advantage beyond the interval comparator,
        decaying like n^{-1/2}, with the earlier lane's marginal artifact
        absent by balance and confirmed absent by shuffle." It can NEVER
        certify that no unbounded-spectral-norm statistic helps, certifies
        nothing at cryptographic n, and PROVES NO BOUND: the digit family
        remains without a theorem whatever the numbers say.
      nearby_object_control: >-
        THE OBJECT WHERE THE HOPED-FOR CONCLUSION FAILS: the Thue-Morse sign
        of the DISCRETE LOGARITHM itself, computable only with the scalar,
        and provably carrying a Fourier coefficient along the logarithm at an
        INTERMEDIATE scale that does NOT decay like n^{-1/2}. A pipeline that
        cannot see this planted signal at its known intermediate scale, while
        seeing the maximal-end positive, has not shown that it resolves the
        boundary where the closure is decided - which is precisely the
        objection a red team raised against the incumbent control elsewhere
        in this program, carried here as a design requirement.
    proof_obligations:
      - claim: >-
          The pinning bound is a triangle inequality over the F_p spectrum
          composed with a hybrid character-sum bound, and is VACUOUS whenever
          the spectral norm exceeds n divided by (sqrt(p) log p).
        responsibility: correctness
      - claim: >-
          The F_p spectral norms of the two digit statistics over [0, p) are
          powers of p and the comparator's is polylog, BY DIRECT COMPUTATION
          at every ladder prime rather than by citation.
        responsibility: size
      - claim: "The Thue-Morse marginal over [0, p) is at most 1/p."
        responsibility: correctness
      - claim: "The comparator reproduces the sibling record's committed values."
        responsibility: baseline
      - claim: "No statistic code path reads the scalar."
        responsibility: interface
      - claim: >-
          The planted positives separate at their predicted scales, including
          the intermediate one, so the instrument's resolution at the
          decision boundary is measured rather than assumed.
        responsibility: size
      - claim: "Every reported number names n, the statistic, the lift convention and the estimator."
        responsibility: scope

  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. NO ATTACK EXPONENT IS CLAIMED; the predicted outcome
    is that the object supplies nothing beyond the interval comparator. The
    MEASUREMENT costs O(n log n) bit operations per arm and prime by complete
    enumeration plus one transform, and O(n) memory - properties of the
    measurement, not of any algorithm. THE OBJECT ITSELF OFFERS NO MEMORY
    AXIS AT ALL: no table, no advice, no precomputation, so there is no
    time-memory tradeoff to state for it. IF the lead branch fired with an
    advantage flat in n, the immediate consequence would be a distinguisher
    at cost the inverse square of the advantage, and then the separate
    question whether the statistic localises the scalar to a sub-interval
    consumable by an interval method; NO EXPONENT IS CLAIMED FOR THAT and
    none can be until the conversion is written. The statistic costs O(log p)
    bit operations, cheaper than the group operation it would sit beside in
    any walk, so nothing hides in an o(1) anywhere.

  heuristic_assumptions:
    - id: HEUR-DIGIT-1
      formal_statement: >-
        For a prime-order subgroup and a digit statistic v applied to the
        integer lift of the x-coordinate of the multiples of the generator,
        the resulting plus-or-minus-one sequence indexed by the scalar
        behaves, with respect to its largest Fourier coefficient along that
        index, like a uniformly random plus-or-minus-one sequence: the
        maximal normalised coefficient is O(sqrt(log n / n)), uniformly over
        the ladder.
      random_model_justification: >-
        The CLASSICAL DISTRIBUTION IMITATED is the extreme value of the
        discrete transform of a Rademacher sequence - a maximum over n
        frequencies of a sum of n independent signs - which is of order
        sqrt(n log n) with high probability. THE RIGOROUS INGREDIENT THAT
        WOULD NORMALLY PAIR WITH IT - square-root cancellation in hybrid sums
        over elliptic-curve points, composed over the statistic's F_p
        spectrum - DOES NOT REACH THIS FAMILY, because the spectral norm of
        both digit statistics is a power of p rather than polylog. THIS IS
        THEREFORE A GENUINE HEURISTIC WITH NO RIGOROUS HALF AT ALL, stated as
        such, and the record exists BECAUSE of that.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-3930b1]
      falsification_condition: >-
        A digit arm's fitted decay exponent at or below 0.25 while surviving
        the keyed-random null and the matched-marginal shuffle, i.e. an
        advantage not decaying like n^{-1/2}. That is the LEAD branch and it
        refutes this heuristic on its own terms.
    - id: HEUR-DIGIT-2
      formal_statement: >-
        The marginal of a digit statistic over the x-coordinates of the
        subgroup is O(n^{-1/2} log n); equivalently the mixed sum of the
        digit sign against the Legendre symbol of the curve's cubic over F_p
        exhibits square-root cancellation.
      random_model_justification: >-
        NONE KNOWN TO THIS RECORD. The statement imitates the
        equidistribution of a digit sign against a multiplicative character -
        the shape of classical results on digit sums along primes and squares
        - but NO result for a Legendre symbol of a cubic is known to the
        author or to this program. It is MEASURED directly, and whatever its
        value the matched-marginal shuffle removes its effect from the
        discrete-log question by construction, so the record does not depend
        on it. It is stated because a FLAT marginal would be an independent
        finding worth its own record.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-3930b1]
      falsification_condition: >-
        A measured marginal flat in n. That is reported SEPARATELY as a
        finding about the mixed sum, independent of the discrete-log
        question, and does NOT by itself constitute a lead.

  structural_ingredients:
    - description: >-
        The digit-sum filter family is NOT CLOSED: it is not a bounded union
        of intervals and not an arithmetic progression, and its measured
        F_p spectral norm grows as a power of p rather than
        polylogarithmically. The same lane's later experiment found popcount
        and digit-sum filters tripping its refutation criterion on a
        sum-compatibility observable, with the matched-marginal shuffle
        reproducing both - a FALSE POSITIVE driven by unequal level sets.
      citation: KN-FIND-ffe1df
      provenance: internal
      verified_by: >-
        idea-generator of IDEA-20260902-c17bf6, which records reading
        knowledge/findings/KN-FIND-ffe1df.md IN FULL on 2026-09-02 under
        TASK-20260902-51b6ce lane A. RELAYED, NOT RE-READ by coordinator
        TASK-20260904-ae82ce. THE MEASURED SPECTRAL NORM IS THE RECORD'S
        LOAD-BEARING PREMISE, which is why the paired contract COMPUTES the
        norms directly at Stage 0 rather than resting on this relay.
      role: >-
        establishes that the digit family is outside the bound's reach, and
        supplies the false-positive history the shuffle control guards
        against
    - description: >-
        Coordinate-derived statistics are pinned at the baseline within
        O(N^{-1/2}) up to the degree of the defining conditions, via Fourier
        coefficients along the discrete-log coordinate and Weil-type bounds;
        and a non-decaying advantage is an approximate progression in the
        discrete-log coordinate and an exponent-relevant primitive. The
        record also supplies the majority-advantage estimator this contract
        reuses so the numbers are comparable across lanes.
      citation: IDEA-20260815-f558e4
      provenance: internal
      verified_by: >-
        idea-generator of IDEA-20260902-c17bf6, which records reading lines
        1-170 of that record on 2026-09-02; the rest was not read. RELAYED,
        NOT RE-READ by coordinator TASK-20260904-ae82ce. The paired contract
        makes the comparator's reproduction of that record's committed values
        a BLOCKING gate rather than accepting the relay.
      role: supplies the estimator, the pinning, and the comparator fixture
    - description: >-
        The transport lemma for p-adic digits and its degree gap - a
        poly-time function of the coordinates need not be bounded degree, and
        whether the pinning survives that gap is a measurement.
      citation: IDEA-20260901-b4e6eb
      provenance: internal
      verified_by: >-
        idea-generator of IDEA-20260902-c17bf6, which records reading that
        record IN FULL on 2026-09-02. RELAYED, NOT RE-READ by coordinator
        TASK-20260904-ae82ce, though that record IS the source of a sibling
        hypothesis designed under the same task, and the two are deliberately
        complementary panels sharing a comparator.
      role: >-
        the sibling family whose gap is an UNKNOWN degree, against which this
        record's gap is a MEASURED spectral norm
    - description: >-
        Exact propagation of a lossy projection is impossible on a
        prime-order group, so the probabilistic regime is the only escape.
      citation: IDEA-20260807-df906f
      provenance: internal
      verified_by: >-
        idea-generator of IDEA-20260902-c17bf6, which records reading lines
        1-160 of that record on 2026-09-02. RELAYED, NOT RE-READ by
        coordinator TASK-20260904-ae82ce.
      role: justifies applying the lossy-projection test in its probabilistic form
    - description: >-
        The uniform bound on Thue-Morse exponential sums with exponent
        log 3 / log 4, and the Rudin-Shapiro sequence's uniform square-root
        bound.
      citation: >-
        Gelfond, Sur les nombres qui ont des proprietes additives et
        multiplicatives donnees; Rudin and Shapiro on Salem's question;
        Mauduit and Rivat on digit sums along primes and squares
      provenance: recalled
      verified_by: null
      role: >-
        NAME THE CLASSICAL FACTS BEHIND THE PREMISE, AND SUPPORT NOTHING. No
        agent in this program has opened any of them; one web-search snippet
        corroborated the Rudin-Shapiro statement and the fetched PDF could
        not be parsed. This is why Stage 0 COMPUTES the spectral norms rather
        than relying on these, and why the exact constant and normalisation
        are explicitly not relied upon anywhere.
    - description: >-
        Square-root cancellation for hybrid sums of an additive character of
        a coordinate against the discrete-log character, and the
        bit-extraction results that live inside the bounded-spectral-norm
        class.
      citation: >-
        Kohel and Shparlinski; Lange and Winterhof; the
        pseudorandom-bits-from-elliptic-curve-points lineage
      provenance: recalled
      verified_by: null
      role: >-
        the rigorous half the pinning uses where it applies; RECALLED, opened
        by nobody in this program, and supports nothing here

  reduction_chain:
    core_problem: >-
      Whether a cheap, balanced digit statistic of a coordinate's integer
      lift carries any majority advantage along the discrete-log coordinate
      beyond an interval statistic of the same image size, on the tested toy
      family.
    corollaries: []
  reduction_chain_note: >-
    Deliberately empty. The closure branch closes three arms on a toy family
    and reaches no downstream problem; the lead branch would be a
    distinguisher-scale statement whose conversion to a solver is a separate
    question with its own exponents and cost table.

  predictions:
    - metric: >-
        P1 - the advantage and the maximal Fourier coefficient for each digit
        arm MINUS the same quantities for the comparator, at matched n,
        before and after the matched-marginal shuffle; dimensionless
      direction: different
      minimum_effect: >-
        PRE-REGISTERED TWO-BRANCH RULE. Absolute difference at or below 0.01
        at every tested n, before AND after shuffle, records the CLOSURE
        branch. A difference at or above 0.05, reproduced at three or more
        prime orders, NOT reproduced by the shuffle, and NOT decaying with n,
        records the LEAD branch and triggers independent review before any
        interpretation. Between is INCONCLUSIVE IN ADVANCE. BASIS: the
        n^{-1/2} scale at the tested sizes and the bands a sibling panel
        uses, so the panels remain comparable; these are untested
        expectations, not measurements.
    - metric: >-
        P2 - fitted decay exponent per arm over at least six prime orders
        spanning at least a 6x range; dimensionless
      direction: lower
      minimum_effect: >-
        In [0.4, 0.6] for the three digit arms records closure; at or below
        0.25 while surviving both nulls records the lead. THE INTERMEDIATE
        PLANTED POSITIVE MUST RETURN ITS OWN PREDICTED INTERMEDIATE EXPONENT,
        and the maximal-end positive must return an exponent near 0. A
        pipeline that cannot separate those three predicted exponents has not
        demonstrated resolution at the boundary where the closure is decided.
    - metric: >-
        P3 - the exact F_p spectral norms of the two digit statistics and of
        the comparator at each ladder prime, COMPUTED not recalled;
        dimensionless
      direction: different
      minimum_effect: >-
        Digit norms growing as a power of p with fitted exponent at or above
        0.3 for Thue-Morse and near 0.5 for Rudin-Shapiro; the comparator's
        norm growing at most polylogarithmically. IF A DIGIT NORM IS POLYLOG,
        THE RECORD'S PREMISE FAILS FOR THAT ARM, the arm is DROPPED, and the
        computed norm is archived.
    - metric: >-
        P4 - the unbalanced diagnostic arm's pre-shuffle excess and
        post-shuffle residual; dimensionless
      direction: different
      minimum_effect: >-
        A pre-shuffle excess that the shuffle REMOVES, reproducing the
        earlier lane's artifact pattern. This is the known-answer calibration
        OF THE SHUFFLE ITSELF; if the shuffle does not remove it, the control
        is not doing what that lane reported and every digit number is void.
    - metric: >-
        P5 - each arm's own marginal over the subgroup's x-coordinates, i.e.
        the normalised mixed sum of the digit sign against the curve's
        Legendre indicator; dimensionless
      direction: lower
      minimum_effect: >-
        At the n^{-1/2} scale and decaying. A marginal FLAT in n is reported
        SEPARATELY as a finding about that mixed sum, independent of the
        discrete-log question, and does NOT by itself constitute a lead.
    - metric: >-
        P6 - recovery of the AMPLITUDE RUNG between the intermediate and
        maximal planted positives; dimensionless
      direction: different
      minimum_effect: >-
        A statistic formed as a declared convex mixture of the intermediate
        planted positive with the keyed-random null, at mixing weight one
        half, must return approximately HALF the coefficient of the
        intermediate positive at fixed n, within its bootstrap interval. This
        adds a fourth known rung to a three-rung ladder and measures the
        estimator's AMPLITUDE resolution as distinct from its exponent
        resolution.

  test_boundary:
    instances:
      - "At least six prime subgroup orders spanning at least a 6x range in the 16 to 26 bit band, COMPLETELY ENUMERATED."
      - "Curves screened for anomalous and smooth order before entering the run set; the baseline charged against the prime subgroup order."
      - "Arms: Thue-Morse of x; Thue-Morse of y; Rudin-Shapiro of x; the unbalanced popcount diagnostic; the top-bit comparator."
      - "Controls: keyed-random null; matched-marginal shuffle; two planted positives at maximal and intermediate scale; the amplitude rung; a static check that no statistic reads the scalar."
      - "A curve-free multiplicative-group arm - see the paired contract's null_object block."
    parameters:
      n_band: "16 to 26 bits"
      lift_convention: "canonical representative in [0, p), fixed and named on every number"
      estimator: "the sibling record's majority-advantage estimator, exact by complete enumeration"
      mixing_weight_for_the_amplitude_rung: "one half, declared in advance"
    implementation: >-
      Complete enumeration of the prime-order subgroup; the advantage
      computed exactly over all pairs and the maximal Fourier coefficient by
      one transform of length n along the scalar index. One length-p
      transform per ladder prime for the spectral norms. The scalar is
      STRUCTURALLY WITHHELD from every statistic code path.
    budget: >-
      See EXP-ECDLP-3930b1. Exactness is bought with enumeration, which caps
      the ladder; the cap is stated in the contract rather than implied.

  falsification_conditions:
    - >-
      F1. Stage 0 finds a digit spectral norm that is polylog in p. The
      record's premise is wrong FOR THAT ARM; the arm is dropped and the
      computed norm archived.
    - >-
      F2. The comparator fails to reproduce the sibling record's committed
      values, or either planted positive fails to separate at its predicted
      scale. INSTRUMENT FAILURE; nothing is reported.
    - >-
      F3. The unbalanced diagnostic arm's excess SURVIVES the shuffle. The
      shuffle is not the control the earlier lane reported, and every digit
      number is void until resolved.
    - >-
      F4. A digit arm shows an advantage at or above 0.05 over the
      comparator, reproduced at three primes, surviving both nulls, and not
      decaying in n. THE LEAD: an efficiently computable statistic outside
      the bound's class with a non-decaying discrete-log correlation. STILL
      NO ATTACK; conversion to key recovery needs its own proposal with
      exponents and a cost table.
    - >-
      F5. Every digit arm matches the comparator within 0.01 with a decay
      exponent in [0.4, 0.6]. The predicted outcome: the probabilistic-regime
      ceiling holds EMPIRICALLY for a family provably outside its proof, in
      the tested scope. It closes THREE ARMS, not the family, and PROVES NO
      BOUND.
    - >-
      F6. The amplitude rung is not recovered at approximately half the
      intermediate coefficient. The estimator's amplitude resolution is not
      what the design assumes and the closure band must be re-justified
      before the digit arms are read.
    - >-
      F7. Budget exhaustion before the ladder resolves. INFRASTRUCTURE
      outcome under AGENTS.md rule 5, never evidence about the statistics.

  interpretation_limits:
    - >-
      NO BOUND IS PROVED IN EITHER BRANCH. The closure branch is an EMPIRICAL
      extension of a prediction beyond its proof, scoped to three statistics,
      six primes and one lift convention. The digit family remains without a
      theorem whatever the numbers say.
    - >-
      The lead branch is a DISTINGUISHER-SCALE statement and NOT an attack;
      the conversion to a solver is a separate question.
    - >-
      Nothing here bears on the earlier lane's own open items or on any join
      or tree configuration; a sum-compatibility gain and a discrete-log
      advantage are DIFFERENT quantities and neither implies the other.
    - >-
      TOY-SCALE IMAGE RATIO BIASES TOWARD APPARENT STRUCTURE: a one-bit
      statistic on a 20-bit group is a far larger fraction of the group than
      at cryptographic size. Disclosed; the field-size ladder is the only
      defence.
    - >-
      THE FIELD-SIZE LADDER IS 16-26 BITS, NOT THE SOURCE'S 16-30, because
      exact enumeration at 2^30 does not fit the declared memory. The
      reduction is stated rather than made silently; the declared band still
      spans a factor of 1024.
    - >-
      THE FAMILY-LEVEL CLAIM - that every digit statistic, or every statistic
      of unbounded spectral norm, is pinned - CANNOT BE TESTED AT REACHABLE
      SCALE OR AT ALL, because it quantifies over all statistics. Three
      members are measured and that is what is reported.
    - >-
      The lift convention is load-bearing: a balanced representative changes
      both statistics and would be a separate arm.
    - >-
      The two load-bearing external facts behind the premise are RECALLED and
      were opened by nobody in this program; the premise is therefore
      COMPUTED at Stage 0 rather than assumed, and an arm whose computed norm
      contradicts the recalled fact is dropped rather than defended.
    - >-
      The paired contract carries a CURVE-FREE MULTIPLICATIVE-GROUP ARM with
      a pre-declared consequence, because a digit sign of an integer lift of
      an exponentially-indexed sequence in any finite group could reproduce
      the whole signature.
    - >-
      NO STATUS CHANGE to any record is proposed or implied.

