hypothesis:
  id: H-FALSIFY-40538b
  question_id: RQ-FALSIFY-a2c501
  status: analyzed
  added: '2026-08-08'
  statement: >-
    A non-trivial fraction of derivation-tier knowledge-corpus findings contain
    defects that cheap exact arithmetic detects, and those defects concentrate
    in two identifiable places: universal quantifiers standing on generic-case
    arguments, and empirical tables that measure a different estimand than the
    quantity the finding derives.
  title: >-
    Derivation-tier corpus findings contain defects detectable by cheap exact
    arithmetic, concentrated in universal quantifiers and in empirical tables
    that measure a different estimand than the quantity derived

  mechanism: >-
    Two defect classes are proposed, each with a structural cause rather than a
    generic appeal to fallibility.

    (1) QUANTIFIER DRIFT. An argument is constructed for a generic object, where
    the algebra is clean, and then recorded with a universal quantifier. The
    step is invisible in prose because "generic" and "every" read alike in a
    summary line, and it is exactly the step an exceptional locus lives in. A
    finding that closes an open problem by asserting no exceptional locus, on an
    argument that says "for generic parameters", has assumed its conclusion.

    (2) ESTIMAND DRIFT. A quantity is derived under a clean probabilistic model,
    then "verified" by a measurement that is easier to instrument than the
    derived quantity and is silently a different one. The tell is a systematic
    residual explained by naming an unmodelled mechanism, because the residual
    is real -- it just measures the gap between two estimands rather than the
    effect of the named mechanism.

  predictions:
    - id: P-1
      text: >-
        For a finding asserting a Galois/monodromy group universally, a direct
        factorisation-shape search over many curves and primes either produces
        a witness or does not. If quantifier drift is present AND the
        exceptional locus has non-negligible density, witnesses appear at toy
        primes.
    - id: P-2
      text: >-
        For a finding whose empirical table exceeds its own derived value, a
        null object stripped of the named mechanism reproduces the table.
    - id: P-3
      text: >-
        Where estimand drift is present, the reported quantity is not a
        constant of the model and can be moved across its whole range by a
        parameter the finding holds fixed.

  test_boundary: >-
    Toy scale. Primes 11..103 for factorisation sweeps, p=1009 for factor-base
    measurements, m in {3,4,5}. Findings are tested one at a time against their
    own recorded statements; nothing here generalises to untested findings.

  falsification_criteria:
    - id: F-1
      text: >-
        P-1 is falsified for a given finding by a controlled sweep returning
        zero inadmissible shapes with passing null and positive controls. This
        occurred: KN-FIND-a1f3c2 survived at m=4 and m=5.
    - id: F-2
      text: >-
        P-2 is falsified if the null object cannot reproduce the reported
        residual, which would leave the finding's named mechanism standing.
    - id: F-3
      text: >-
        The hypothesis as a whole is falsified if a sustained program finds only
        presentation-level defects.

  status_note: >-
    `analyzed` on EV-FALSIFY-440677 and EV-FALSIFY-2a5e46 from
    RUN-FALSIFY-d770c1-001. P-1 came back NEGATIVE on the one finding tested
    (the universal claim survived); P-2 and P-3 came back POSITIVE on the one
    finding tested. Two findings out of 58 is not a corpus-level result and this
    hypothesis is not promoted on it. Only the Coordinator may change this
    status.

  evidence_refs: [EV-FALSIFY-440677, EV-FALSIFY-2a5e46]
  experiment_refs: [EXP-FALSIFY-d770c1]
