  id_allocation_provenance: >
    Hypothesis and experiment tokens were
    reserved 2026-09-09 in
    coordination/design/BATCH-4c0b9a/selection.yaml
    for IDEA-20260805-cc4c2c
    (H-ECDLP-d9b1f3, EXP-ECDLP-a1a142).
    Rechecked free with
    tools/allocate_id.py --check on
    2026-09-13 immediately before
    canonical authoring. Design, snapshot,
    ledger, executor, decision, and batch
    tokens were minted with --next and
