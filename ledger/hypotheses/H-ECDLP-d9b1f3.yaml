  statement: >
    Fix the exact least-positive modular
    embedding-degree identity on two
    frozen synthetic public integer
    pairs before any named transfer,
    curve construction, L-function
    cost, Semaev S_m, or Velu map is
    built. Stage 0 asserts only that
    on REAL-A (p=2, r=7, cap=8) the
    least j with p^j ≡ 1 (mod r) is
    k=3, that on REAL-B (p=5, r=11,
    cap=8) it is k=5, and that the
    nearby KF claim asserted_k=1 on
    REAL-A is false. Invalid p=1 is
    refused. Cap below the least k
    is refused. Mixed cost labels
    and toy-versus-crypto ranking
    are refused. This is not a
    transfer applicability claim,
    not a rho beat, and not a
    concrete-cost table. Stages 1+
    stay unauthorized.
  mechanism: >
    IDEA-20260805-cc4c2c Stage 0 hard
    gate is the finite predicate
    "least j in 1..cap with
    p^j mod r = 1". Form successive
    powers of p modulo r. Stage 0
    freezes that identity as exact
    tables on two synthetic toys.
    No MOV reduction. No Smart
    anomalous logarithm. No
    pairing-friendly family. No
    L_{p^k}[1/3] cost. No live
    curve. Recalled transfer names
    remain search pointers and do
    not support this instrument.
    This promotes the 2026-09-09
    zero-run draft under
    BATCH-4c0b9a to a canonical
    Stage 0 contract. It is not
    Stage 1 of EXP-ECDLP-a1a142
    and not Stage 1 of
    EXP-ECDLP-e9dd89.
  predictions:
    - id: P-S0-EMBK
      metric: well-defined least-positive modular k on frozen toys
      direction: different
      minimum_effect: >
        After fixture_pass, REAL-A
        k equals 3, REAL-B k equals
        5, and KF asserted_k=1 is
        rejected. Invalid p=1 is
        rejected. Cap=2 on REAL-A
        is rejected. Mixed
        forced/measured labels are
        rejected. Toy-versus-crypto
        ranking is rejected. One
        certified miss after
        fixture_pass is a scoped
        falsification of this
        instrument at the frozen
        toys.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KF
      statement: >
        After fixture_pass, KF
        asserted_k=1 on (p=2, r=7)
        is accepted as a generic
        embedding-degree target.
        An encoding bug is
        failed_infrastructure.
    - id: F-S0-REAL
      statement: >
        After fixture_pass, REAL-A
        fails to match k=3 or
        REAL-B fails to match k=5.
        That falsifies only
        P-S0-EMBK at the frozen
        toys.
  test_boundary:
    instances:
      - frozen Stage 0 REAL / KF / NULL panel
    parameters:
      real_a:
        field_modulus_p: 2
        subgroup_order_r: 7
        k_search_cap: 8
        must_k: 3
      real_b:
        field_modulus_p: 5
        subgroup_order_r: 11
        k_search_cap: 8
        must_k: 5
      known_false:
        kind: asserted_k_mismatch
        field_modulus_p: 2
        subgroup_order_r: 7
        k_search_cap: 8
        asserted_k: 1
        must_k: 3
        must_reject: true
      matched_null: {kind: invalid_p, field_modulus_p: 1, must_reject: true}
      stage0_only_at_specify: true
    implementation: EXP-ECDLP-a1a142 Stage 0 runner
    budget:
      wall_clock_seconds: 120
    prose: >
      Toy scale. Stage 0 is exact
      modular arithmetic of two
      frozen public integer pairs
      and one asserted-k nearby
      claim. It is not a named
      transfer, not a curve
      construction, not an
      L-function cost, not Semaev,
      not Velu, not Stage 1 of
      EXP-ECDLP-a1a142, and not
      Stage 1 of EXP-ECDLP-e9dd89.
      No cryptographic transfer.
      No rho beat.
  assumptions:
    - id: A1
      statement: >
        REAL-A is (p,r,cap)=(2,7,8)
        with least k=3. REAL-B is
        (5,11,8) with least k=5.
        KF is the claim that
        asserted_k=1 on REAL-A.
        Stage 0 does not select a
        live curve.
      status: explicit
    - id: A2
      statement: >
        IDEA-20260805-cc4c2c's
        crossover and L-function
        cost claims stay
        unauthorized. Stage 0
        tests only the exact
        least-k calibrator, not
        the proposal's forced
        transfer-cost ladder.
      status: explicit
    - id: A3
      statement: >
        Standing user authorization
        2026-09-06 covers protocol
        approval once the contract
        is complete.
      status: explicit
  heuristic_assumptions: []
  structural_ingredients: []
  proof_search_map:
    bottleneck: >
      Whether a declared (p,r,cap)
      triple has the stated least
      positive k, and whether a
      mismatched asserted_k is
      rejected.
    baseline_embedding:
      parameter_slice: >
        The REAL-A, REAL-B, KF,
        and NULL fixtures.
        Disclosed tightening:
        exact least-k calibrator
        only, not the proposal's
        named-transfer rungs or
        L-function costs.
      reproduction_check: >
        REAL-A k equals 3. REAL-B
        k equals 5. KF asserted_k=1
        rejected because k=3.
        Invalid p=1 rejected. Cap
        below k rejected.
    observation_collision:
      observable: least-positive modular k versus asserted_k
      distinct_preimage_search: >
        Hold (p,r) and replace
        asserted_k by 1 (KF). Hold
        the dimensions and replace
        p by 1 (NULL).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Frozen exact least-k table.
        predicted_gain: >
          Exact known-false
          asserted-k reject on KF.
          Zero claimed attack
          improvement.
    quantifier_order: >
      Freeze (p,r,cap) before
      reading the table.
      Existential equality at two
      toys does not imply a
      transfer applies and does
      not imply a rho beat.
    method_ceiling:
      strongest_certifiable_claim: >
        Instrument reproduction on
        the declared frozen toys.
        Never an L-function cost.
        Never an ECDLP exponent.
      nearby_object_control: >
        NULL is invalid p=1. An
        argument that still assigns
        it a true k is
        proves-too-much.
