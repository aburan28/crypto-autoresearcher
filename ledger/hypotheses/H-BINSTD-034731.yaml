    31 minus 17, which is 14. The written slope cap is five
    hundredths, which is 1 over 20. A one-unit rise over that span
    has slope 1 over 14. Twenty minus 14 is 6, so that unit rise
    exceeds the cap. The allowed rise is 14 over 20, which is 7
    over 10, and it falls short of 1 by the cross gap 3. The
    consecutive gaps are 2, 4, 6, and 2. Their unit-rise excesses
    against 20 are 18, 16, 14, and 18. The product of 6, 18, 16,
    14, and 18 is 435456. The ceiling 8 does not contain n, so one
    bound covers the five cells.
  mechanism: >-
    The proposal writes a last-fall ceiling of 8 and a slope cap of
    five hundredths on the n list 17, 19, 23, 29, 31. This contract
    checks that cap against a one-unit rise. It does not measure a
    last-fall degree.
