    change is SPECIFICATION ONLY and is not experimental support of any kind.
  status_history:
    - status: specified
      decision_id: DEC-20260801-006
      decided_at: '2026-08-01'
      from_status: null
      reason: >-
        Specified by the Coordinator at the BATCH-022 opening (TASK-20260801-010),
        executing the single next_action recorded in ledger/goals/GOAL-ECDLP-001.yaml
        at the BATCH-021 close (DEC-20260801-005) and the ranked-first control
        RT048-CTRL-1 of RT-20260801-008. Isolates the distributional limb HEUR-DS-1
        from H-DS-001 so that it can be measured on its own instrument. No run is
        authorized by this status change and no evidence exists for or against this
        hypothesis.
  proposed_by: coordinator

  mechanism_test_status:
    recorded_by: DEC-20260801-006
    recorded_at: '2026-08-01'
    exercised: false
    statement: >-
      AS OF THE BATCH-022 OPENING, THIS MECHANISM HAS NEVER BEEN TESTED, AND NEITHER
      HAS ANY OTHER STATEMENT OF HEUR-DS-1. Across RUN-DS-001-impl, RUN-DS-001-measure,
      RUN-DS-001-ctrl-unplanted and RUN-DS-001-ctrl-matched-null, is_B_smooth was never
      invoked once. The single HEUR-DS-1 sampling ever performed (EV-DS-002 finding F3)
      sampled an identity-encoded curve x-coordinate below 2**20 rather than a
      half-arity Semaev intermediate bounded by D = 2**40 - the wrong quantity by a
      factor of about 2**20 (RT047-H2, RT048-H1). EXP-SMTH-001 would be the first
      measurement in this program to sample the correct object. This field is a
      statement about the instrument, not about the hypothesis - it means no evidence
      for or against exists in either direction.
    what_would_change_this: >-
      A completed valid RUN-SMTH-001-heur read under the frozen reading rule RR-SMTH-1,
      with no M-0 guard and no M-5 apparatus leg fired.
    anti_pattern_expressly_forbidden: >-
      Setting smoothness_abort = true on the existing EXP-DS-001 arms and calling the
      mechanism exercised is forbidden here as it is in the experiment contract
      (EXP-SMTH-001 forbidden_anti_pattern AP-1). It would call is_B_smooth on a
      stand-in and produce a false ledger tick while testing nothing. If it is ever run
      it is labelled a plumbing check and it discharges nothing.

  does_not_modify:
