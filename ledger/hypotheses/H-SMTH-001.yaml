hypothesis:
  id: H-SMTH-001
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-001
  batch_id: BATCH-022
  source_proposal: null
  source_proposal_note: >-
    NO IDEA-* RECORD IS THE SOURCE, AND THAT IS RECORDED RATHER THAN PAPERED OVER.
    This hypothesis is the direct promotion of RT048-CTRL-1, the ranked-first control
    of RT-20260801-008, adopted as the single next_action by DEC-20260801-005 and
    opened as BATCH-022 by DEC-20260801-006. It carries no ideation lineage because it
    is not a new mechanism; it is the isolation, as a separately falsifiable statement,
    of the named heuristic HEUR-DS-1 that H-DS-001 has carried since BATCH-017 without
    ever testing.
  source_control_request: RT048-CTRL-1
  source_red_team_report: RT-20260801-008
  authorizing_decision_id: DEC-20260801-006

  statement: >-
    HEUR-DS-1, STATED AS ITS OWN FALSIFIABLE HYPOTHESIS AND SEPARATED FROM THE
    ALGORITHMIC CLAIM OF H-DS-001. For prime-field Semaev index calculus at arity
    m = 4 over a frozen deterministic factor base of 512 x-coordinates of E(F_p), the
    integer invariants of the half-arity Semaev partial map - the elementary symmetric
    functions of the root multiset of S_3(x_i, x_j, Z), canonically encoded as an
    integer in [1, p**2] under the frozen map INT-1 with encoding ENC-B - behave, for
    B-smoothness purposes, like uniform random integers of the same size. Concretely,
    at each of the toy field sizes bits in {16, 20} with the frozen intermediate bound
    D = 2**(2*bits) - the empirical largest-prime-factor CDF of those intermediates lies
    within the pre-registered Kolmogorov-Smirnov distance of the classical Dickman LPF
    CDF; the empirical Bsm-smooth fraction lies within the frozen constant factor 8 of
    Dickman rho(u) with u = ln(D)/ln(Bsm) at every rung of the frozen smoothness ladder
    that the sample size powers; the frozen tail check is satisfied; and the sample is
    not distinguishable at the pre-registered two-sample threshold from uniform random
    integers on the same range [1, p**2]. THIS HYPOTHESIS CLAIMS A TOY-SCALE
    DISTRIBUTIONAL STATUS REPORT AND NOTHING ELSE. It claims no cost saving, no
    exponent, no crypto-scale validity of HEUR-DS-1, and no consequence for any
    deployed scheme.

  mechanism: >-
    The Semaev summation polynomial S_4 encodes the condition that four points of E
    sum to a target, and the meet-in-the-middle rewrite factors the search through the
    identity that S_4(x1, x2, x3, x4) = 0 holds iff there exists an intermediate
    x-coordinate Z with S_3(x1, x2, Z) = 0 and S_3(x3, x4, Z) = 0. The half-arity
    partial map is therefore (x_i, x_j) -> the root multiset of S_3(x_i, x_j, Z), a
    degree-2 fibre whose complete invariant is the pair of elementary symmetric
    functions (e_1, e_2) in F_p x F_p. Every smoothness-based early abort in the claw
    rewrite, and every Dickman-style cost accounting that such an abort would justify,
    presumes that the integers attached to that fibre carry the smoothness law of
    generic integers of their size. The mechanism of THIS hypothesis is exactly that
    presumption, stated as a testable law about a computable object. It is decided by
    direct sampling against a matched null, not by any cost measurement - so no engine,
    no backend, no cost identity and no wall-clock proxy enters the mechanism at all,
    which is the point of separating it from H-DS-001.

  why_this_is_separated_from_H_DS_001: >-
    H-DS-001 bundles an ALGORITHMIC claim about a charged cost ratio R with a
    DISTRIBUTIONAL heuristic HEUR-DS-1. Twenty-one batches of measurement have gone to
    the first and none to the second - EV-DS-004 and DEC-20260801-005 establish that
    is_B_smooth has never been invoked anywhere in the EXP-DS-001 series, on any arm or
    any object, and that the single HEUR sampling ever performed sampled an
    identity-encoded curve x-coordinate below 2**20 rather than a half-arity
    intermediate bounded by D = 2**40, a factor of about 2**20 apart (RT047-H2,
    RT048-H1). A bundled hypothesis whose two limbs are decided by different
    instruments cannot record a clean status for either. H-SMTH-001 isolates the
    distributional limb so it can be measured, passed or failed on its own evidence.
    H-DS-001 IS NOT ALTERED, NOT RE-SCORED AND NOT REOPENED by this separation; its
    `weakened` status, its status_scope block, its test_boundary_amendments and its
    mechanism_test_status all stand exactly as archived at DEC-20260801-005.

  assumptions:
    - Toy prime-field curves at field sizes 16 and 20 bits; no live keys; no discrete logarithm is computed or claimed.
    - >-
      `bits` names the FIELD prime p. The prime-order subgroup order is irrelevant to
      this hypothesis, which touches no group-order-sensitive quantity (RT047-B5
      discipline discharged rather than inherited).
    - Factor base is the frozen deterministic subset of E(F_p) of exact size Bfb = 512.
    - >-
      Bfb = 512 rather than the EXP-DS-001 sizes, because C(Bfb + 1, 2) distinct
      half-tuples exist and that count is 2080, 8256 and 32896 at Bfb = 64, 128 and 256,
      every one below the frozen 10**5 sample minimum. This is a declared departure and
      it does not alter H-DS-001's test boundary.
    - >-
      The frozen KS, rate-band and tail thresholds of EXP-DS-001 are reused unchanged;
      they are not redrafted, relaxed or tightened by this hypothesis.
    - >-
      A timeout, crash, resource exhaustion or factorization-verification failure is
      infrastructure signal and never evidence against this hypothesis (AGENTS.md
      rule 5).
    - >-
      The apparatus must demonstrate, in the same run, that it can detect a deviation -
      the ENC-A power certificate - and that it does not manufacture one - the matched
      null and the apparatus-identity control. Absent either, the run decides nothing.

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    DELIBERATELY NULL. This hypothesis asserts no exponent, no complexity and no
    asymptotic behaviour of any kind. All four asymptotic promotion gates G1 through G4
    remain OPEN across the program and nothing in this hypothesis, under any outcome of
    its experiment, moves any of them. A validated toy distributional status for
    HEUR-DS-1 would be a PRECONDITION for a future conditional claim under gate G2, not
    a step toward `supported` for one.

  heuristic_assumptions:
    - id: HEUR-DS-1
      inherited_from: H-DS-001.heuristic_assumptions
      formal_statement_quoted_verbatim: >-
        "Intermediate degrees arising from half-arity Semaev partial maps on uniform
        random targets behave, for B-smoothness purposes, like uniform random integers
        of the same bitlength - the probability an intermediate is B-smooth is within a
        constant factor of Dickman rho(u) with u = log D / log B, where D bounds the
        intermediate degree."
      what_this_hypothesis_adds: >-
        A CONCRETE, COMPUTABLE INSTANTIATION of the words "intermediate" and "the same
        bitlength", which H-DS-001 left implicit and which is precisely where the lane
        went wrong. The intermediate is INT-1 with encoding ENC-B; "the same bitlength"
        is the matched range [1, p**2]; and "behave like" is decided by the frozen
        KS-DS-1, RATE-DS-1 and TAIL-DS-1 thresholds together with the added two-sample
        comparison KS2-DS-1 against a null object drawn on that same range.
      random_model_justification: >-
        Canfield-Erdos-Pomerance and Dickman-de Bruijn govern the smoothness of integers
        drawn uniformly below a bound. The heuristic transfers that law to the integer
        invariants of Semaev half-arity partial maps in the absence of a proven
        correspondence, and no such correspondence is claimed here.
      supporting_results:
        - Canfield-Erdos-Pomerance smoothness estimates
        - Dickman-de Bruijn rho(u) for the proportion of B-smooth integers below X
        - Semaev summation-polynomial degree bounds (KN-LIT-001, KN-TECH-002)
      validation_experiment_ids:
        - EXP-SMTH-001
      validation_status: >-
        NEVER VALIDATED AND NEVER REFUTED, AT ANY SCALE, AS OF BATCH-022 OPENING.
        EXP-SMTH-001 is the first experiment in this program that would sample the
        object the heuristic is about.

  predictions:
    - metric: HEUR_SMTH_KS_distance on OBJ-REAL under ENC-B
      direction: different
      minimum_effect: >-
        KS statistic against the Dickman LPF CDF at or below
        max(0.05, 1.63/sqrt(n)) = 0.05 at n = 131328, at both field sizes.
    - metric: HEUR_SMTH_rate_band_ok on OBJ-REAL under ENC-B
      direction: different
      minimum_effect: >-
        Empirical Bsm-smooth fraction within the frozen factor 8 of rho(u) at every
        powered rung u in {2, 3, 4, 5} of the frozen ladder, at both field sizes.
    - metric: HEUR_SMTH_ks2_vs_null on OBJ-REAL under ENC-B
      direction: different
      minimum_effect: >-
        Two-sample KS statistic against uniform random integers on [1, p**2] at or
        below 1.63 * sqrt(2/131328) = 0.006362, at both field sizes. THIS IS THE DIRECT
        TEST OF THE HEURISTIC'S OWN SENTENCE and it has never been performed.
    - metric: HEUR_SMTH_decay_ratio on OBJ-REAL
      direction: lower
      minimum_effect: >-
        The Bsm-smooth fraction must decay like u**(-u(1+o(1))) per
        Canfield-Erdos-Pomerance; concretely the ratio of the u = 6 rung to the u = 2
        rung must not exceed 100 * rho(6)/rho(2) = 0.006404. A flat smooth fraction as
        u grows is the canonical artifact tell and indicates the sampled quantity is not
        the intermediate.

  test_boundary:
    instances:
      - toy prime fields at bits in {16, 20}, one curve instance per field size from master seed 2201
    parameters:
      arity_m: 4
      d_half: 2
      factor_base_size_Bfb: 512
      factor_base_policy: frozen_deterministic_subset
      intermediate_map: INT-1
      primary_encoding: ENC-B
      power_certificate_encoding: ENC-A
      intermediate_bound_D: 2**(2*bits), that is 2**32 at bits 16 and 2**40 at bits 20
      sample_range: '[1, p**2]'
      n_per_sample_set: 131328
      smoothness_ladder_Bsm_bits20: [1048576, 10321, 1024, 256, 102]
      smoothness_ladder_Bsm_bits16: [65536, 1626, 256, 84, 40]
      null_object: NULL-SMTH-UNIFORM-INTEGERS
      null_object_construction: >-
        Uniform random integers on [1, p**2], matched in count and in range to the real
        sample, pushed through an IDENTICAL pipeline with no code path differing except
        the source of the integers. This is the mandatory null object of
        docs/inventor-protocol.md section 3.2, and unlike
        H-DS-001.test_boundary.parameters.null_object it is matched by construction
        rather than by argument.
      apparatus_identity_control: >-
        ENC-B applied to uniformly drawn (e_1, e_2) in [0, p)**2, which is DERIVABLY the
        same law as the null; disagreement is an implementation defect, agreement is not
        corroboration.
      baselines: >-
        NONE APPLY. This hypothesis makes no cost claim, so matched Pollard rho and
        matched BSGS are not baselines for it and are not measured. Its Pareto position
        is recorded in the evidence record as a distributional statement with no cost
        axis, and `dominated_by: null` remains forbidden - the comparison to be made is
        against the published Dickman-de Bruijn law itself, which is the state of the
        art for this quantity and which this hypothesis does not beat but tests
        agreement with.
    implementation: >-
      New driver experiments/EXP-SMTH-001/implementation/smth001_driver.py under the
      frozen contract experiments/EXP-SMTH-001/specification.yaml. No EXP-DS-001 driver,
      module, control, amendment or run artifact is imported, modified or staged. sympy
      1.14.0 for factorization; no new dependency.
    budget:
      wall_clock_seconds_per_run: 7200
      total_cpu_hours: 2
      maximum_memory_gb: 4
      maximum_runs: 1

  falsification_conditions:
    - >-
      F-SMTH-1 - at BOTH tested field sizes, the real sample under ENC-B fails
      bit_size_pass under the frozen RATE-DS-1, KS-DS-1 and TAIL-DS-1 thresholds, or is
      rejected against the matched null at KS2-DS-1, while the null itself passes and
      the ENC-A power certificate rejects. HEUR-DS-1 is then reported FAILED AT TOY
      SCALE, scoped exactly to INT-1, ENC-B, the two field sizes, Bfb = 512, m = 4 and
      the frozen ladder. This is a `weaken`, never a `reject_scoped` on one unreplicated
      run, and never a crypto-scale refutation.
    - >-
      F-SMTH-2 - the artifact tell DECAY-1 fires, that is the smooth fraction fails to
      decay across the frozen u ladder. This FALSIFIES THE INSTRUMENT, not the
      heuristic. It says the sampled quantity is not behaving like an integer of size D,
      hence INT-1 as implemented is a stand-in. Disposition is `inconclusive` with a
      named repair, and it is the BATCH-020 failure mode caught prospectively.
    - >-
      F-SMTH-3 - the apparatus cannot be shown to work, that is the null fails its own
      Dickman checks, or the ENC-A power certificate fails to reject, or the
      apparatus-identity control rejects. Instrument failure; no disposition about the
      heuristic in either direction; AGENTS.md rule 5.

  interpretation_limits:
    - >-
      Toy scale only, two field sizes, one curve instance each, one seed, one host, one
      unreplicated run. A pass is `replicate`, never `support`, and never validation of
      HEUR-DS-1 above the toy tier.
    - >-
      The result is scoped to the frozen intermediate map INT-1 and the primary encoding
      ENC-B. A different faithful encoding of the same fibre could in principle carry a
      different smoothness law, and this experiment does not rule that out. What it does
      rule out is the specific degeneracy of BATCH-021 - ENC-B is a bijection onto
      [1, p**2] and the null is drawn on that same range, so any deviation is a property
      of the joint law of the Semaev symmetric functions and not of the encoding.
    - >-
      No cost consequence follows from any outcome. Even a clean pass licenses no early
      abort, no charged saving and no exponent, because the cost of the abort test
      itself is not measured here and R is not measured at all.
    - >-
      This hypothesis does not bear on whether Semaev or multihomogeneous structure
      yields any claw advantage beyond generic meet-in-the-middle. That question is
      ENTIRELY OPEN after BATCH-021 and is not touched here.
    - H-DS-001 remains `weakened` with its status_scope; this hypothesis does not reopen or re-score it.
    - H-IC-001 and H-STR-002 remain weakened and are not reopened.
    - >-
      All four asymptotic-claim promotion gates remain OPEN. There is no path from this
      contract, under any outcome, to hypothesis status `supported` on any asymptotic
      claim anywhere in the program.

  status: specified
  status_note: >-
    `specified` AND NOT `approved`. Approval is the Coordinator gate that the BATCH-022
    review cycle feeds - it is recorded as APPROVAL_DETERMINATION in the
    TASK-20260801-013 snapshot receipt after the independent review at
