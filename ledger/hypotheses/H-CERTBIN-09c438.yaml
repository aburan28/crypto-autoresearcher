  statement: >-
    C(131, 6) is 6249655776, strictly above 2^32.5 and with
    hundredths strictly above 32.54 and strictly below 32.55. The
    radius-6 ball has 6559349864 elements, strictly above 2^32.6
    and strictly below 2^32.7. Its fourth power is strictly below
    2^131. Dividing by 262 leaves quotient 25035686 and remainder
    132. C(131, 7) is 111600996000, strictly below 2^36.7. The
    radius-7 ball has 118160345864 elements, strictly below
    2^36.8. C(131, 13) is 290414633295556000, strictly above 2^58.
    The radius-16 ball has 160288081514583958464 elements, strictly
    above 2^67. The radius-34 ball has
    45209915448071525430012508996684 elements, strictly below
    2^115, and the excess of the written exponent 115 over the
    true logarithm is strictly above 9.84 bits and strictly below
    9.85 bits. On 131072 strings of length 17, a cyclic shift
    never changes the weight. Dropping the high bit of 65536
    changes the weight from 1 to 0. The toy balls are 154, 834
    and 1160.
  mechanism: >-
    The proposal sizes the Hamming balls by hand and says the
    radius-34 ball is about 2^115. This contract recomputes the
    cardinalities. It does not build a normal basis.
