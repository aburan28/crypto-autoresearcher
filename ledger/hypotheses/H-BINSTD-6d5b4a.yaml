    - from: approved
      to: analyzed
      at: '2026-10-03'
      by: DEC-20261003-963219
  proposed_by: coordinator

  title: >-
    After EV-BINSTD-56dda7 ℓ=4 constant-rank collapse, a rank-diversity-
    seeking ≥24-shape V catalog meets ≥3 distinct r_Tr and ≥2 distinct N_nl
    on n=17 Stage-1 cells before any Spearman≤−0.70 band reading of
    HEUR-BINSTD-878222-H1

  statement: >-
    CLAIM (heuristic_validation / encoding-structure instrument; NO ATTACK;
    NO EXPONENT). Successor to H-BINSTD-b102b7 after EV-BINSTD-56dda7
    (O-INCONCLUSIVE: n17_l3 in-band; n17_l4 distinct_rTr=1 / ρ nan). Let
    V ⊂ F_{2^n} be an F_2-subspace of dimension ℓ. Using a NEW
    rank-diversity-seeking frozen catalog (seed 202610038196; ≥24 and ≤128
    shapes; shifted poly, geo, affine twists, coordinate ℓ-subsets, random
    expanders; NOT the EXP-BINSTD-8196d7 v1 catalog seed 202610038782),
    FORALL Stage-1 cells (n,ℓ)∈{(17,3),(17,4)}: (i) ADMISSION — twin meters
    agree and the catalog yields ≥3 distinct r_Tr and ≥2 distinct N_nl;
    (ii) only after (i), Spearman's ρ(r_Tr, N_nl) ≤ −0.70 (O-SUPPORT) OR
    fails the band (O-FAIL-BAND). If (i) fails → O-INCONCLUSIVE (then
    consider ℓ-scoped HEUR, not invent band support). NO break. NO n≥131
    transfer. Do NOT re-run frozen v1.

  mechanism: >-
    OBJECT FRAME as IDEA-20261001-878222 / H-BINSTD-b102b7. Operation set
    CHANGE: rank-diversity-seeking catalog construction with Stage-0
    pre-screen of r_Tr/N_nl diversity on Stage-1 cells, emphasizing (17,4)
    where EV-BINSTD-56dda7 saw empty Trace-linear blocks. Admission floors
    gate any Spearman band verdict. Twin r_Tr + twin N_nl meters unchanged.
    WHAT IS NEW: floors as explicit Stage-1 admission gates after
    EV-BINSTD-56dda7; new seed/recipe; ≥24-shape freeze; coordinate subsets.

  predictions:
    - metric: distinct_rTr_values
      direction: lower_bounded
      minimum_effect: '≥ 3 distinct r_Tr values per Stage-1 cell (admission)'
    - metric: distinct_Nnl_values
      direction: lower_bounded
      minimum_effect: '≥ 2 distinct N_nl values per Stage-1 cell (admission)'
    - metric: spearman_rTr_vs_Nnl
      direction: upper_bounded
      minimum_effect: '≤ −0.70 at each Stage-1 cell after admission'
    - metric: catalog_size
      direction: lower_bounded
      minimum_effect: '≥ 24 distinct V shapes per Stage-1 cell'
    - metric: twin_agreement
      direction: same
      minimum_effect: >-
        r_Tr path A = path B and N_nl path A = path B on every measured V

  test_boundary:
    instances:
      - 'Stage 0: rank-diversity-seeking freeze for (n,ℓ)∈{17,19,23}×{3,4}; twin probe'
      - 'Stage 1 authorized: (n,ℓ)∈{(17,3),(17,4)} admission floors then Spearman'
    parameters:
      spearman_band: -0.70
      catalog_seed: 202610038196
      bootstrap_seed: 202610038197
      bootstrap_reps: 200
      min_catalog: 24
      max_catalog: 128
      floor_rTr: 3
      floor_Nnl: 2
      forbidden_v1_seed: 202610038782
      moduli:
        17: t^17+t^3+1
        19: t^19+t^5+t^2+t+1
        23: t^23+t^5+1
    implementation: >-
      Pure Python under experiments/EXP-BINSTD-871156/implementation/;
      command surface implementation/run.py driven by trial-plan-v1.json.
      Twin meters in encode_s3.py (Trace rank + N_nl). No Magma/
      Sage/AUXIN/Bedrock.
    budget:
      wall_clock_seconds: 7200
      memory_gb: 2
      maximum_runs: 4

  falsification_conditions:
    - Twin meters disagree on any measured V (O-ARTIFACT; table void).
    - Editing the Spearman band after Stage-0 freeze (protocol invalid).
    - Re-using v1 catalog seed 202610038782 (not a successor; O-ARTIFACT).
    - Claiming practical binary IC or an exponent move from a toy Trace-rank
      correlation (KR-IC-1fcdbc).
    - Equating N_nl prediction with total N_var (febbe1) or peak RSS (20561e).
    - Transferring the band to n≥131 without a new contract.
    - Catalog collapses below admission floors (O-INCONCLUSIVE; then ℓ-scoped HEUR).

  distinguishable_outcomes:
    - id: O-SUPPORT
      meaning: >-
        Twin OK; admission floors met on every Stage-1 cell; ρ(r_Tr, N_nl)
        ≤ −0.70 on every Stage-1 cell. Trace-rank predicts residual nonlinear
        clause count at toys under the rank-diverse catalog. No attack claim.
    - id: O-FAIL-BAND
      meaning: >-
        Twin OK; floors met; ρ > −0.70 on at least one Stage-1 cell.
        Trace-rank-not-predictive at this scale under the new catalog.
    - id: O-INCONCLUSIVE
      meaning: >-
        Catalog still collapses below distinct_rTr≥3 or distinct_Nnl≥2 on a
        completed cell after diversity-seeking freeze (max ≤128). Prefer
        next successor: ℓ-scoped HEUR, not invent O-FAIL-BAND.
    - id: O-ARTIFACT
      meaning: >-
        Twin disagreement, freeze/regression failure, or forbidden v1 seed
        reuse. No band claim kept.
    - id: O-IMPEDIMENT
      meaning: >-
        Infrastructure timeout/crash/missing Stage-0 freeze / Trace extractor
        unavailable at Stage 0. Never negative evidence against H-BINSTD-6d5b4a.

  interpretation_limits:
    - Encoding-structure instrument only; does not predict yield or beat rho.
    - Shared XOR-SAT pin; a different pin needs a new idea/contract.
    - Stage-2 (n∈{19,23} + shuffled-linear null) not authorized under this card.
    - No attack at field degree ≥ 131. ECC2K-130 is not an instance.
    - Parent EV-BINSTD-56dda7 remains; this does not rewrite it.
    - Floors-unmet after max catalog is instrument/power, not band falsifier.

  heuristic_assumptions:
    - id: HEUR-BINSTD-878222-H1
      formal_statement: >-
        FORALL (n,ℓ)∈{17}×{3,4} Stage-1 cells: AFTER ≥3 distinct r_Tr and
        ≥2 distinct N_nl across the frozen rank-diversity-seeking catalog,
        Spearman ρ(r_Tr, N_nl) ≤ −0.70 where r_Tr is the rank of the
        Trace-derived linear block and N_nl is the residual nonlinear XOR-SAT
        clause count after eliminating those linears.
      random_model_justification: >-
        Rigorous: KR-IC-f5c584 shows Trace contributes structural linears after
        descent. Classical: if those linears dominate the removable work, higher
        r_Tr should leave fewer residual nonlinear clauses; if product-space or
        encoder artifacts dominate residual size instead (KR-IC-73db3f),
        correlation may fail the −0.70 band. Catalog expansion after
        EV-BINSTD-56dda7 is an instrument-power repair so the band is readable
        at (17,4), not a claim that Trace alone beats rho.
      supporting_results:
        - EV-BINSTD-56dda7
        - KR-IC-f5c584
        - KR-IC-5765d2
        - KR-IC-73db3f
      validation_experiment_ids:
        - EXP-BINSTD-871156
      falsification_condition: >-
        Floors met and Spearman ρ > −0.70 at a completed Stage-1 cell
        (O-FAIL-BAND), OR twin failure (O-ARTIFACT), OR floors unmet after
        diversity-seeking freeze (O-INCONCLUSIVE), OR Trace extractor absent
        (O-IMPEDIMENT).

  asymptotic_claim:
    problem: >-
      Trace-linear rank as predictor of residual nonlinear XOR-SAT clause
      count on toy binary IC cells, after rank-diverse catalog repair
    prior_best: >-
      EV-BINSTD-56dda7 (ℓ=4 collapse); KR-IC-f5c584 (Trace linear);
      EXP-BINSTD-8196d7 (parent Stages 0-1)
    time_exponent: >-
      NO EXPONENT MOVED. Encoding-structure instrument only; a high |ρ|
      does not move binary ECDLP vs rho (KR-IC-1fcdbc / KR-IC-9e610d).
    memory_exponent: Negligible — store per-V r_Tr and N_nl.
    hidden_cofactor: Encoder constants + diversity-seeking catalog construction.
    claim_kind: heuristic_validation

  proof_search_map:
    bottleneck: >-
      Whether a rank-diversity-seeking catalog can meet distinct_rTr≥3 at
      (17,4) after EV-BINSTD-56dda7 empty-Trace collapse, and only then
      whether Spearman ≤−0.70 holds under twin meters.
    baseline_embedding:
      parameter_slice: >-
        n=17, ℓ=3, poly basis V=span{1,t,t^2}; twin r_Tr and N_nl must agree
        before any Spearman panel is read; v1 seed 202610038782 forbidden.
      reproduction_check: >-
        Independent check.py recomputes twin r_Tr/N_nl on the Stage-0 probe,
        verifies catalog seed ≠ v1, and re-checks admission floors + band
        polarity against the frozen ≤−0.70 band.
    observation_collision:
      observable: 'Spearman ρ(r_Tr, N_nl) vs −0.70 band per (n,ℓ) after floors'
      distinct_preimage_search: >-
        A held band could arise from (i) Trace-dominated removable work
        (claim), (ii) catalog collapse / constant r_Tr (ruled out by
        admission floors → O-INCONCLUSIVE), or (iii) twin-encode artifact.
        Separated by twin agreement and by Stage-2 shuffled-linear null
        (not authorized here).
    constructive_transforms:
      - transform: measurement_instrument
        proposed_object: >-
          Rank-diversity-seeking catalog + admission floors + frozen
          Spearman ≤−0.70 band + twin Trace-rank / N_nl meters.
        predicted_gain: >-
          A decidable support/fail label for the Trace→N_nl predictor at
          toys after repairing the EV-BINSTD-56dda7 (17,4) floor failure.
    quantifier_order: >-
      FORALL Stage-1 cells (17,3) and (17,4): AFTER admission floors,
      ρ(r_Tr, N_nl) ≤ −0.70 is PREDICTED. NOT CLAIMED: n∈{19,23} under this
      card; n≥131; any attack; ℓ-scoped retreat without a new contract.
    method_ceiling:
      strongest_certifiable_claim: >-
        On the named Stage-1 toy cells, after floors, measured Spearman ρ
        lies ≤ or > the frozen −0.70 band, with twin agreement.
      nearby_object_control: >-
        Twin disagreement (artifact); floors unmet after max catalog
        (inconclusive → prefer ℓ-scoped HEUR successor). Stage-2
        shuffled-linear null not authorized.
    proof_obligations:
      - claim: Twin r_Tr and N_nl paths agree on every measured V.
        responsibility: baseline
      - claim: Admission floors gate any band verdict.
        responsibility: baseline
      - claim: Band polarity is Spearman ≤ −0.70 (not ≥).
        responsibility: baseline
      - claim: v1 seed 202610038782 is never reused.
        responsibility: baseline
      - claim: Nothing asserted at n≥131.
        responsibility: scope

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
