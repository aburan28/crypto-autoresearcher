  proposal_id: IDEA-20260812-104e1a
  title: >
    Stage 0 closed-form W_1(S) rank
    identities — rank equals |S| —
    before any torsion module is built
  status: specified
  proposed_by: idea-generator
  designed_by: coordinator
  designed_under_task: TASK-20260913-f9f932
  specified_by: DEC-20260913-cb9986
  specified_at: '2026-09-13'
  created: '2026-09-13'
  updated: '2026-09-13'
  depends_on:
    - IDEA-20260812-104e1a
    - RQ-ECDLP-002
  related_hypotheses:
    - H-ECDLP-0e3bb9
  statement: >
    Fix the closed-form W_1(S) rank
    identities of IDEA-20260812-104e1a
    before any isogeny class is
    enumerated, any N-torsion module is
    built, or any discrete logarithm is
    solved. Stage 0 asserts only that on
    the frozen |S|-grid {1,2,3} the rank
    of the eigenvalue-1 rational sum is
    exactly |S|, and that the toy pair
    (p,N)=(7,5) has 7 not congruent
    to 1 mod 5 so the
    eigenvalues 1 and p are distinct. A
    nearby claim that rank(W_1(S))=0 is
    rejected. A dummy rank 1 independent
    of |S| is rejected as a rank table.
    This is not a Kani attack and not a
    rho beat. Stages 1+ stay
    unauthorized.
  mechanism: >
    IDEA-20260812-104e1a tracks W_1(S)
    as the direct sum of eigenvalue-1
    lines over an isogeny-class subset
    S, of rank |S|. Stage 0 freezes that
    rank identity and the
    distinct-eigenvalue screen p not
    congruent to 1 (mod
    N). No curve. No torsion basis. No
    Semaev S_m. No Coppersmith. No DLP
    solve.
  predictions:
    - id: P-S0-W1RANK
      metric: closed-form identities on the frozen REAL / KF / NULL panel
      direction: different
      minimum_effect: >
        After fixture_pass, REAL reports
        rank(1)=1, rank(2)=2, rank(3)=3, and
        7 mod 5 = 2 ≠ 1. KF rank=0 is
        rejected. NULL constant-rank-1 is
        rejected.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KF
      statement: >
        After fixture_pass, the KF
        claim is accepted. An encoding
        bug is failed_infrastructure.
    - id: F-S0-REAL
      statement: >
        After fixture_pass, REAL misses
        a frozen identity. That
        falsifies only P-S0-W1RANK
        at the frozen arithmetic.
  test_boundary:
    instances:
      - frozen Stage 0 REAL / KF / NULL arithmetic panel
    parameters:
      real_grid:
        S_card: [1, 2, 3]
        rank_W1: [1, 2, 3]
        toy_p: 7
        toy_N: 5
        toy_p_mod_N: 2
        must_rank_eq_card: true
        must_eigenvalues_distinct: true
      known_false:
        kind: rank_W1_always_zero
        must_reject: true
      matched_null:
        kind: constant_rank_one
        must_reject: true
      stage0_only_at_specify: true
    implementation: EXP-ECDLP-2379ab Stage 0 runner
    budget:
      wall_clock_seconds: 120
    prose: >
      Toy / closed-form arithmetic
      only. No curve construction.
      No Semaev S_m evaluation. No
      Coppersmith. No DLP. No rho
      beat. The frozen numbers are
      the proposal's own identities,
      not a fitted result.
  assumptions:
    - id: A1
      statement: >
        Stage 0 evaluates only the
        frozen closed-form identities.
        It does not execute an attack
        and does not solve a DLP.
      status: explicit
    - id: A2
      statement: >
        Standing user authorization
        2026-09-06 covers protocol
        approval once the contract is
        complete.
      status: explicit
  heuristic_assumptions: []
  proof_search_map:
    bottleneck: >
      Whether rank equals |S| on {1,2,3}
      and whether 7 is not 1 mod 5.
    baseline_embedding:
      parameter_slice: >
        The REAL grid, the KF claim,
        and the NULL dummy. Disclosed
        tightening: arithmetic
        calibrator only, not later
        stages of the proposal.
      reproduction_check: >
        REAL identities hold. KF
        rejected. NULL rejected.
    observation_collision:
      observable: rank of the eigenvalue-1 rational sum W_1(S)
      distinct_preimage_search: >
        Hold |S| and claim rank 0 (KF). Hold
        the method and drop |S|-dependence
        (NULL).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Frozen Stage 0 identity table.
        predicted_gain: >
          Exact known-false reject on
          KF. Zero claimed attack
          improvement.
    quantifier_order: >
      Freeze the formula and grid
      before reading the table.
      Existential equality at one
      grid does not imply an attack.
    method_ceiling:
      strongest_certifiable_claim: >
        Instrument reproduction on
        the declared frozen
        arithmetic. Never an attack.
        Never a DLP solve. Never a
        rho beat. Never an ECDLP
        exponent.
      nearby_object_control: >
        NULL is a constant rank 1. An
        argument that still calls it a W_1
        rank table is proves-too-much.
  knowledge_promotion:
    promoted: []
    not_warranted: Stage 0 design only. Nothing to promote.
  scientific_boundary: >
    Stage 0 P-S0-W1RANK only. Not a Kani
    kernel. Not a Weil pairing. Not
    Semaev S_m. Not Coppersmith. Not a
    DLP solve. Not a rho beat. No Stage
    1 of EXP-ECDLP-2379ab.
