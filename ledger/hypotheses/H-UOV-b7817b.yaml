hypothesis:
  id: H-UOV-b7817b
  question_id: RQ-UOV-001
  title: >-
    The plain-UOV security model is calibrated at toy parameters: measured oil-space-recovery and
    MinRank-style key-recovery cost on random toy UOV instances agrees with the model's prediction
    within a factor 2 across the (m, n, q) grid, and the residual is monotone rather than erratic
  statement: >-
    Let C_measured(m, n, q) be the cost, in field multiplications, of the best-known key-recovery
    attack (oil-space recovery and MinRank-style variants) executed on random toy UOV instances, and
    let C_model(m, n, q) be the plain-UOV security model's prediction at the same parameters,
    reproduced independently from the model's own formula. THE HYPOTHESIS ASSERTS that the calibration
    ratio R = C_measured / C_model lies inside [0.5, 2] at every cell of the declared (m, n, q) grid,
    that its deviation from 1 is MONOTONE in each of m, n and q rather than erratic, and that the
    same attack executed on random non-UOV MQ systems at matched (m, n, q) does NOT succeed faster
    than a generic MQ solver -- so the measured cost is attributable to the oil-space structure rather
    than to the instance being an MQ system at all. A departure of R outside [0.5, 2] at three or more
    cells is a CALIBRATION DEPARTURE with a number, and the direction of the departure is itself the
    result: R below 0.5 means the model OVERSTATES attack cost and the dependent candidates (MAYO,
    QR-UOV, SNOVA) inherit an optimistic baseline; R above 2 means the model understates it and their
    analyses are conservative.
  mechanism: >-
    UOV's security rests on the cost of recovering the oil space, equivalently on the cost of the
    associated MinRank instance, and the model predicts that cost as a function of (m, n, q). At toy
    parameters both the prediction and the attack are computable, so the ratio is directly
    measurable. The mechanism by which a calibration departure could arise is that the model's cost
    formula abstracts a linear-algebra step whose realized constant, or whose realized rank behaviour,
    differs at small parameters from the asymptotic regime the formula was derived in. The mechanism
    by which the measurement could MISLEAD is that a toy-scale attack implementation's cost is
    dominated by implementation overhead rather than by the algebraic step the model counts, which is
    why the deliverable is a ratio of FIELD MULTIPLICATIONS counted by instrumentation, with wall time
    reported only as a secondary and explicitly implementation-bound quantity. The non-UOV MQ null is
    what separates "the attack exploits the oil space" from "the attack solves any MQ system of this
    size", and without it a favourable ratio would not be attributable to UOV structure at all.
  assumptions:
    - >-
      Toy (m, n, q) parameters preserve the attack model's scaling DIRECTION, so calibration cells are
      directionally informative. This is a heuristic and is tested by the grid trend, not assumed.
    - >-
      The best-known attack at toy sizes is implementable at a fidelity where its FIELD-MULTIPLICATION
      count, not its wall time, is the measured quantity. An implementation whose cost is dominated by
      interpreter overhead measures the interpreter.
    - >-
      The model's prediction is reproduced INDEPENDENTLY from its own formula rather than quoted from
      a table, so that a transcription error in the prediction is separable from a genuine calibration
      departure.
    - >-
      Random toy UOV instances are drawn from a declared generator whose oil-space dimension and field
      are exactly the nominal ones, verified per instance before the attack is run.
    - >-
      The measured cost is that of key recovery, not of forgery, and no signature oracle is used.
  proof_search_map:
    not_applicable_reason: >-
      This hypothesis is an empirical calibration measurement. It proves no theorem, constructs no
      bound and proposes no new attack; its deliverable is a table of measured-versus-modeled ratios
      with intervals, and its one derived quantity -- the model's own prediction -- is reproduced from
      a published formula rather than proved here. The quantifier discipline that matters is recorded
      in interpretation_limits: a calibration measured at toy (m, n, q) says nothing about the
      standardized parameter sets.
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-UOV-CAL-1
      formal_statement: >-
        MONOTONE SCALING. The plain-UOV attack model's predicted cost is monotone in each of m, n and
        q over the tested grid, and the calibration ratio R(m, n, q) = C_measured / C_model varies
        monotonically (or is flat) in each coordinate rather than erratically. Formally: for each
        coordinate, holding the others fixed, the sequence of R values across the declared ladder is
        monotone up to the reported per-cell interval.
      random_model_justification: >-
        None directly. This is the standard model-scaling assumption that a cost formula derived in an
        asymptotic regime retains its DIRECTION at small parameters. It is tested by the grid trend
        itself and is recorded as a heuristic rather than folded into the conclusion, because an
        erratic R is exactly what a toy-size artifact looks like and it must be distinguishable from a
        genuine departure.
      supporting_results: []
      validation_experiment_ids:
        - EXP-UOV-081efb
      falsification_condition: >-
        R is non-monotone in any coordinate beyond the reported per-cell intervals, i.e. it rises and
        falls across a single ladder. Then the toy cells are not directionally informative, the
        calibration curve may not be extrapolated in that coordinate, and the deliverable is scoped to
        the individual cells measured.
  structural_ingredients:
    - description: >-
        The plain-UOV security model's cost formula for oil-space recovery and MinRank-style key
        recovery as a function of (m, n, q), which is what the measurement calibrates against.
      citation: >-
        The plain-UOV security model as relied on by the MAYO, QR-UOV and SNOVA analyses. No specific
        source is asserted by this program and the parent proposal names none; identifying the exact
        formula and its source is a derivation gap of the contract.
      provenance: recalled
      verified_by: null
      role: the modeled column of the calibration table
    - description: >-
        A generic MQ solving cost at matched (m, n, q), used as the null against which a structured
        attack must be faster for its cost to be attributable to the oil space.
      citation: >-
        Standard MQ system-solving cost models; no specific source is asserted by this program.
      provenance: recalled
      verified_by: null
      role: null-object comparator
  reduction_chain:
    core_problem: >-
      Key recovery against plain UOV, i.e. recovery of the oil space.
    corollaries:
      - problem: >-
          The security baselines that MAYO, QR-UOV and SNOVA analyses inherit from the plain-UOV model.
        reduction_ref: >-
          No published reduction is cited here. The relationship is that those analyses REFERENCE the
          plain-UOV model's cost, not that a formal reduction transfers this calibration to them; a
          calibrated baseline is a shared input, and treating it as a transferred result would be an
          error.
        asymptotics_preserved: null
  predictions:
    - metric: measured_vs_model_cost_ratio
      direction: different
      minimum_effect: >-
        Within [0.5, 2] at every cell is calibration. A ratio outside [0.5, 2] at three or more cells,
        with per-cell intervals excluding the band, is a CALIBRATION DEPARTURE and the direction is
        reported with it.
    - metric: per_cell_interval_width
      direction: lower
      minimum_effect: >-
        Narrow enough that the [0.5, 2] band is decidable, i.e. the interval must not straddle both
        boundaries. A cell whose interval straddles the band is reported as UNDECIDED at that cell, not
        as calibrated.
    - metric: non_uov_mq_null_speedup
      direction: lower
      minimum_effect: >-
        The attack on random non-UOV MQ systems at matched (m, n, q) must NOT be faster than a generic
        MQ solver by more than the reported interval. If it is, the measured cost is not attributable
        to the oil space and the whole calibration is void.
    - metric: model_reproduction_agreement
      direction: different
      minimum_effect: >-
        The independently reproduced model prediction must agree with the model's own published value
        at every cell to within numerical precision. A disagreement is a transcription finding and
        halts interpretation until resolved.
    - metric: ratio_monotonicity_in_each_coordinate
      direction: different
      minimum_effect: >-
        Monotone (or flat) across each of the m, n and q ladders beyond the per-cell intervals.
        Non-monotonicity falsifies HEUR-UOV-CAL-1 and scopes the deliverable to individual cells.
  test_boundary:
    instances:
      - >-
        Random toy UOV instances at each cell of the declared (m, n, q) grid, at least 10 instances per
        cell, with oil-space dimension and field verified per instance before the attack is run
      - >-
        Random non-UOV MQ systems at matched (m, n, q), as the null arm
      - >-
        An independently reproduced evaluation of the model's own cost formula at every cell
    parameters:
      grid: >-
        A declared (m, n, q) grid with at least three values in each coordinate, so that monotonicity
        is testable in each; the exact ladders are a derivation gap and must be fixed before approval
      instances_per_cell: 10
      cost_unit: field multiplications, counted by instrumentation
      calibration_band: [0.5, 2]
      departure_threshold_cells: 3
    implementation: >-
      An instrumented implementation of the best-known oil-space-recovery and MinRank-style key-recovery
      attacks, counting FIELD MULTIPLICATIONS rather than wall time as the primary cost, with wall time
      reported separately and labelled implementation-bound. The model's prediction is reproduced
      independently from its formula, never quoted from a table.
    budget:
      wall_clock_seconds: 14400
      cpu_hours: 12.0
      maximum_memory_gb: 16
      maximum_runs: 30
  falsification_conditions:
    - >-
      The calibration ratio lies outside [0.5, 2] at three or more cells with per-cell intervals
      excluding the band. THE HYPOTHESIS IS FALSIFIED: the model needs correction at toy parameters and
      the direction of the departure is the deliverable. This is a result, not a failure.
    - >-
      The attack succeeds on random non-UOV MQ systems as fast as on UOV instances. The measured cost
      is not attributable to the oil space and the entire calibration is VOID in both directions.
    - >-
      The independently reproduced model prediction disagrees with the model's own published value.
      This is a transcription finding; interpretation halts until it is resolved and no ratio is
      reported.
    - >-
      The calibration ratio is non-monotone in any coordinate beyond the intervals. HEUR-UOV-CAL-1 is
      falsified and the deliverable is scoped to individual cells rather than to a curve.
    - >-
      NOT a falsification: an attack implementation that times out or exhausts memory at the largest
      cells. That is infrastructure under AGENTS.md rule 5, is recorded as a reachability limit on the
      grid, and is never evidence that the model is right or wrong there.
  distinguishable_outcomes:
    model_calibrated: >-
      R lies inside [0.5, 2] at every decidable cell, the null arm shows no structure-free speedup, and
      R is monotone in each coordinate. MEANING: the plain-UOV model is calibrated AT TOY PARAMETERS,
      and the calibration table is a shared baseline the dependent candidates' analyses may reference
      as such. It is a baseline, not a break.
    model_optimistic: >-
      R is below 0.5 at three or more cells. MEANING: the model OVERSTATES attack cost at those
      parameters, i.e. the real attack is cheaper than predicted, and every analysis inheriting this
      baseline is optimistic by the measured factor at toy scale. This is the higher-consequence
      direction and requires independent replication before any statement.
    model_conservative: >-
      R is above 2 at three or more cells. MEANING: the model UNDERSTATES attack cost, the dependent
      analyses are conservative, and the measured factor bounds by how much at toy scale.
    attribution_void: >-
      The attack is as fast on random non-UOV MQ systems as on UOV instances. MEANING: VOID. The
      measurement did not isolate the oil-space structure, and no calibration statement may be made in
      either direction.
    transcription_defect: >-
      The independently reproduced model prediction disagrees with the published value. MEANING: an
      instrument or bookkeeping finding that must be resolved before any ratio is interpreted; it is
      not evidence about UOV.
    erratic_scaling: >-
      R is non-monotone across a ladder. MEANING: HEUR-UOV-CAL-1 fails; the toy cells are not
      directionally informative in that coordinate and the calibration curve may not be extrapolated.
    grid_unreachable: >-
      The attack cannot be run at the larger cells within budget. MEANING: a SCOPE limit reported with
      the largest reachable cell; never evidence about the model.
  interpretation_limits:
    - >-
      Toy calibration only. No crypto-scale claim about UOV's standardized parameters, and no statement
      about the security of MAYO, QR-UOV or SNOVA, follows from any outcome.
    - >-
      Calibration is a BASELINE, not a break. Even a large departure is a statement about a cost
      formula at small parameters, not an attack.
    - >-
      The cost unit is field multiplications counted by instrumentation. Wall time is reported but is
      implementation-bound, and a wall-time difference without a multiplication-count difference is
      evidence about the implementation.
    - >-
      The dependent candidates REFERENCE the plain-UOV model; this calibration does not transfer to
      them by any formal reduction, and treating it as if it did would be an error.
    - >-
      Attack-implementation quality is a confounder that this design bounds but does not eliminate: a
      poor implementation inflates R, so a ratio ABOVE 2 is the direction most easily produced by
      implementation weakness and must be reported with that caveat attached.
  prior_evidence_refs: []
  derived_from_idea: IDEA-20260801-014
  status: proposed
  added: '2026-08-25'
  proposed_by: coordinator
