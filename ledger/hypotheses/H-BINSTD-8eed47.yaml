    Two to the power 4 minus 2 is 4. Two to the power 3 minus 2 is 2.
    Twice 2 is 4, so the product of the two degree-2 figures equals
    the degree-4 figure. Seventeen over 20 falls short of 1 by 3 on
    the numerator. Twice 20 minus 17 is 23, so the band is not the
    degree ratio 2. Forty times 17 over 20 is 34. Six cells times 40
    targets is 240. The success floor times 40 is 1.
  mechanism: >-
    The proposal compares one degree-4 schedule with two degree-2
    schedules under a charged-cost band of 17 over 20. This contract
    checks the degree formula and that the band is not the degree
    ratio. It does not build a system.
