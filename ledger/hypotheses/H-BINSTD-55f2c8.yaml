  title: >-
    Twice (1, 0) is (0, 1), and the arity-2 attempt ratio is 1.
  statement: >-
    Over F_2 the curve y^2 + xy = x^3 + 1 has the three affine
    points (0, 1), (1, 0) and (1, 1). Twice (1, 0) is (0, 1),
    three times (1, 0) is (1, 1), and four times (1, 0) is the
    identity. The point (0, 0) is off the curve. For arity m in
    {2, 3, 4, 5, 6, 8} the size-ratio attempt count is 4^{m-2}
    and the yield denominator is 4^{m-1}. At m = 2 that attempt
    count is 1, not 4. The free-oracle shifts 4/(m+1) are 4/3,
    1, 4/5, 2/3, 4/7 and 4/9. The written 1.3333 is strictly
    below 4/3, and the written 0.6667 is strictly above 2/3.
    The multiset count C(4, 2) is 6, not 3. The quoted cofactor
    partner is at least 2^129 and strictly below 2^130.
  mechanism: >-
    The proposal turns the cofactor into size ratios and a
    four-point subgroup. This contract checks those integers
    and the F_2 group law. It does not audit a builder.
