hypothesis:
  id: H-MLKEM-731e03
  question_id: RQ-MLKEM-003
  title: >-
    A memory PRICE and a memory BUDGET are different parameterisations of the same resource, and the
    difference is exactly the lower convex hull: no linear price can ever select an off-hull SVP
    algorithm while a hard budget routinely does, so the integer |B minus A| -- the count of algorithms
    budget-optimal at some ceiling and price-optimal at no price -- decides whether this lane's
    price-swept crossovers are a complete instrument
  statement: >-
    Let S be the finite set of pairs (m, t), m = log2(memory)/d and t = log2(time)/d, over the readable
    SVP algorithm families at dimension d. PRICE selection minimises t + alpha m over S for a scalar
    alpha at least 0; BUDGET selection minimises t subject to m at most m0. THE HYPOTHESIS ASSERTS
    (A, A THEOREM, NOT AN EXPERIMENT) that for every alpha the price minimiser is a VERTEX OF THE LOWER
    CONVEX HULL of S, by the supporting-hyperplane argument, so an algorithm strictly above the hull is
    selected by NO price whatsoever, whereas the budget minimiser at m0 can be an off-hull point;
    (B, THE MEASURED PART) that the integer |B minus A|, computed over the Stage-0 point set AFTER the
    continuum control, is ZERO -- i.e. the price parameterisation is COMPLETE over the readable
    algorithm set and this lane's price-swept crossovers need no repair -- or is a small positive
    integer naming the blind spot; and (C, A DIRECTION, NOT A MAGNITUDE) that the classical-minus-quantum
    time-exponent gap at m = 0.1887 divided by the same gap at m = 0.2075, computed against HULL values,
    EXCEEDS 1 under every named reading, i.e. the quantum advantage WIDENS as the memory budget tightens.
    NO ATTACK IS IMPLEMENTED, NO INSTANCE IS SOLVED, NOTHING IS MEASURED IN THE CRYPTANALYTIC SENSE:
    every number is arithmetic on published asymptotic exponents whose o(d) terms are unbounded.
  mechanism: >-
    The supporting-hyperplane argument is elementary and is the whole of part (A): minimising a linear
    functional over a finite point set attains its minimum at a vertex of the lower convex hull, so the
    image of the price map alpha -> argmin is contained in the hull's vertex set; the budget map
    m0 -> argmin{t : m at most m0} is not so constrained, because a half-plane restriction can isolate a
    point that no supporting line touches. Consequently, if the hull of S has any point strictly above
    it that is nonetheless the time-minimiser at some achievable budget, every price-parameterised
    crossover in this lane systematically mis-locates the optimum at those budgets, and the size of the
    miss is computable EXACTLY. THE FAILURE MODE THE DESIGN MUST DEFEND AGAINST is that the tuple-sieve
    literature's tradeoff is a CONTINUUM in the tuple size k and in an internal parameter, and S
    discretises it: a pocket of non-convexity can be manufactured purely by sampling a continuous curve
    at a few values of k. That is why the continuum control and the k-grid density sweep are binding
    rather than decorative, and why a pocket that vanishes under the continuum is declared IN ADVANCE to
    be a discretisation artifact and not reportable. A second structural point: hull membership is
    monotone under insertion -- a point can be evicted by a new point but never restored -- which is a
    cheap internal falsifier, and it HAS ALREADY FIRED ONCE, before any compute, when a corpus point
    absent from the record's first screen was inserted and evicted the record's original headline.
  assumptions:
    - >-
      Every exponent entering S is READ from a primary source or from a corpus entry that records it
      verbatim, or the point is EXCLUDED and recorded as excluded, never estimated. A frontier assembled
      from recollection is worthless at margins of 0.004, and this record has already been shown wrong
      once for exactly that reason.
    - >-
      A corpus entry whose own "not verified here" section says it was generated in a bulk seeding pass
      over a PDF's first pages is a pointer strong enough to CONTRADICT a recollection and force a
      reading, but not strong enough to CLOSE a hull question. Such entries must be re-read.
    - >-
      Classical bits, QCRAM bits and qubits are DIFFERENT resources. Plotting them on one memory axis
      requires a declared conversion; the default is to segregate the classical and quantum hulls and
      report them separately, carrying qubit counts as an annotated column and never as the memory
      coordinate.
    - >-
      Two named READING AMBIGUITIES are load-bearing and are carried as reading cells rather than as
      intervals: the classical 2-sieve's memory coordinate, and the quantum anchor's memory coordinate.
      A single hull is never emitted; one hull per reading cell is.
    - >-
      The o(d) terms are formally unbounded and the gaps at stake are 0.001 to 0.005 in exponent.
      Nothing here survives being read as a concrete cost statement, and the object's declared survival
      is ONE step: it decides which algorithm a cost CONVENTION selects, and not which algorithm is
      actually faster at any dimension.
  proof_search_map:
    bottleneck: >-
      The lower convex hull of S and, specifically, whether any point of S is budget-optimal at some
      achievable m0 while price-optimal at no alpha. Everything else is bookkeeping around that one
      integer.
    baseline_embedding:
      parameter_slice: >-
        alpha = 0 in the price family must reproduce the global time minimiser; a two-point set must
        return |B minus A| = 0 because any two points are their own lower hull, which is why a
        two-member family (sieving versus enumeration) could not have produced the integer even in
        principle.
      reproduction_check: >-
        Unit test asserting that the alpha = 0 price minimiser equals the global time minimiser, plus
        NULL-1: applying the identical hull code to an exactly linear log-log tradeoff, where every point
        of a linear curve is on its own lower hull, so the test MUST return all-on-hull with zero
        off-hull distance.
    observation_collision:
      observable: >-
        The hull-membership boolean and the off-hull distance of a point of S.
      distinct_preimage_search: >-
        THE COLLISION IS BUILT IN AND IS DECLARED: the map from algorithms to (m, t) is enormously
        many-to-one, so two algorithms with different mechanisms and identical exponents are IDENTIFIED
        by this projection. That is why the object is the right one for a cost-CONVENTION question and
        the wrong one for an implementation question. A second collision, and the one that decides part
        (B): a pocket of non-convexity produced by a genuine off-hull algorithm and a pocket produced by
        sampling a continuous k-tradeoff at a few values are indistinguishable in the discrete set. The
        continuum arm is the separating condition.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "how should memory be charged" by the single computable integer |B minus A| over the
          readable point set, under a declared reading cell.
        predicted_gain: >-
          No cost gain. The gain is that a methodological question about this lane's own instrument
          becomes one falsifiable integer with three nulls, computable in under an hour of single-core
          arithmetic.
    quantifier_order: >-
      FOR ALL alpha at least 0, the price minimiser over S lies in the vertex set of the lower convex
      hull of S. THERE EXISTS m0 achievable such that the budget minimiser over S is NOT in that vertex
      set -- this is the existential the experiment decides, and its witness is an algorithm together
      with the budget at which it wins. The witness may depend on the reading cell and on the k-grid
      density; NO UNIFORMITY IS CLAIMED, and a witness that exists only at one k-grid density and
      vanishes under the continuum is not a witness.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Over the readable set S, under reading cell X and after the continuum control, exactly n points
        are budget-optimal at some achievable m0 and price-optimal at no alpha, and the off-hull distance
        of each is D in exponent units." It certifies NOTHING about concrete cost at any dimension,
        nothing about points excluded for want of a read source, and nothing about whether the quantum
        rows are physically admissible at all.
      nearby_object_control: >-
        NULL-1, the exactly linear log-log tradeoff, where the hoped-for conclusion (non-convexity) is
        KNOWN FALSE: every point of a linear curve is on its own lower hull, so the code MUST return
        all-on-hull. This is precisely the case a floating-point orientation test on nearly-collinear
        points gets wrong, which is how a 0.004 margin would be misclassified.
    proof_obligations:
      - claim: >-
          For every alpha at least 0 the price minimiser is a vertex of the lower convex hull of S.
        responsibility: correctness
      - claim: >-
          The budget minimiser at m0 is the lowest t among points with m at most m0 and need not be a
          hull vertex.
        responsibility: correctness
      - claim: >-
          The hull is computed in EXACT RATIONALS, not floating point, because the margins at stake are
          within a few ulps of a naive orientation test's error.
        responsibility: interface
      - claim: >-
          Hull membership is monotone under insertion: a point can be evicted but never restored.
        responsibility: size
      - claim: >-
          |B minus A| is reported only after the continuum control, and a pocket vanishing under the
          continuum is not reportable.
        responsibility: scope
      - claim: >-
          Every exponent in S is read from a primary source or a verbatim corpus record, or the point is
          excluded with a reason.
        responsibility: baseline
    not_applicable_reason: null
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: >-
        The supporting-hyperplane fact that a linear functional over a finite point set is minimised at a
        vertex of its lower convex hull.
      citation: Standard convexity; no specific source is asserted by this program.
      provenance: recalled
      verified_by: null
      role: the whole of part (A); elementary and not new to anybody
    - description: >-
        Tuple-sieve time-memory tradeoff points, recorded verbatim as time 2^{0.3588n} at space
        2^{0.1887n} and a variant at 2^{0.3300n} time and 2^{0.2075n} memory, plus a third point at
        t = 0.3717 with NO stated memory exponent.
      citation: ePrint 2017/1228 (corpus entry KN-LIT-6765)
      provenance: retrieved
      verified_by: idea-generator@2026-08-21, abstract fetched with the pairs verbatim
      role: >-
        classical hull points; the 0.3717 point is EXCLUDED for want of a memory exponent, and the
        parametric tradeoff curve for arbitrary tuple size is what the continuum arm needs and what a
        failed PDF fetch did not obtain
    - description: >-
        A quantum k-Sieve solving SVP in 2^{0.2989d+o(d)} time using 2^{0.1395d+o(d)} memory in the QRAM
        model, with the prior anchor recorded as 2^{0.2653d} time AND memory.
      citation: KN-LIT-703 (ePrint 2019/101), corpus entry, citation_verified read
      provenance: internal
      verified_by: knowledge/literature/KN-LIT-703.md
      role: >-
        the quantum memory frontier point that this record's first screen could not match and whose
        insertion evicted the record's original headline
    - description: >-
        A quantum sieve at 2^{0.2570d+o(d)} whose memory exponent the corpus entry does NOT transcribe.
      citation: KN-LIT-4639 (Chailloux-Loyer), corpus entry, citation_verified read
      provenance: internal
      verified_by: knowledge/literature/KN-LIT-4639.md
      role: >-
        EXCLUDED from S with its time coordinate recorded and its memory coordinate marked unread; the
        single largest known gap in S and the highest-priority read, since a memory exponent at or below
        0.2075 would dominate the quantum anchor outright
    - description: >-
        An improved quantum 3-tuple sieve at 2^{0.2846d} time using 2^{0.1887d} classical and QCRAM bits
        and 2^{o(d)} qubits, stated by its authors as a BUDGET result.
      citation: ePrint 2025/2189 / arXiv 2510.08473
      provenance: retrieved
      verified_by: idea-generator@2026-08-21, abstract fetched verbatim
      role: >-
        the external ingredient; note that "fastest at memory 2^{0.1887d}" is a statement about a
        half-plane, not about the hull, and is consistent with the point being off-hull
    - description: >-
        A non-asymptotic circuit-level analysis finding the quantum speedup in dimensions of
        cryptanalytic interest small and assumption-laden, with the standing instruction that a quantum
        exponent is not a cost without a circuit-level source.
      citation: KN-LIT-122 (Albrecht-Gheorghiu-Postlethwaite-Schanck), corpus entry
      provenance: internal
      verified_by: knowledge/literature/KN-LIT-122.md
      role: the standing warning binding every quantum row of S
    - description: >-
        Committed effective sieve dimensions 385.084530 / 590.132012 / 825.235330, used ONLY as the
        dimensions at which exponent gaps are expressed in bits.
      citation: EV-MLKEM-020
      provenance: internal
      verified_by: ledger/evidence/EV-MLKEM-020.yaml
      role: unit conversion for expressing exponent gaps, never a cost prediction
  reduction_chain:
    core_problem: >-
      Whether a scalar memory price is a complete parameterisation of memory-constrained SVP algorithm
      selection.
    corollaries: []
  predictions:
    - metric: B_minus_A_after_continuum
      direction: higher
      minimum_effect: >-
        1 -- a single point SURVIVING the continuum arm refutes the completeness of the price
        parameterisation; ZERO vindicates it and is a clean negative that strengthens the sibling
        price-swept record rather than damaging it.
    - metric: B_minus_A_discrete_minus_continuum
      direction: higher
      minimum_effect: >-
        1 -- a positive difference means at least one pocket is manufactured by discretisation, and those
        pockets are struck from the deliverable.
    - metric: B_minus_A_monotonicity_in_k_grid_density
      direction: different
      minimum_effect: >-
        A monotone increase across all three densities is the ARTIFACT SIGNATURE and voids the headline;
        flat or decreasing is consistent with a real pocket.
    - metric: classical_3tuple_off_hull_distance_by_reading
      direction: different
      minimum_effect: >-
        0.004 in exponent units. The illustrative derivation puts it at that order under one reading and
        STRICTLY ON-HULL under the other, so the PREDICTION IS THAT THE ANSWER IS NOT ROBUSTLY SIGNED and
        the honest verdict is UNDECIDED until the 2-sieve memory and the enumeration constant are read.
    - metric: quantum_3tuple_hull_status_before_and_after
      direction: different
      minimum_effect: >-
        UNCHANGED is the PREDICTED outcome under one reading (both the 0.3098 and the 0.2846 points
        off-hull once the corpus quantum point is admitted) and a sub-half-bit change under the other. The
        record's original headline is ALREADY WITHDRAWN on this arithmetic; the batch's job is to decide
        which reading holds, and the second restores only an UNDECIDED verdict, never an on-hull one.
    - metric: classical_minus_quantum_gap_ratio
      direction: higher
      minimum_effect: >-
        Strictly above 1.0, computed against HULL values and not against individual points. A ratio at or
        below 1 would mean the quantum advantage SHRINKS under a memory budget and reverses part (C)
        entirely; that would be a more interesting result than the predicted direction and is reachable if
        the unread quantum memory exponent turns out to be small.
    - metric: off_hull_count_versus_calibrated_false_positive_interval
      direction: higher
      minimum_effect: >-
        Outside the interval NULL-2 produces at the sigma implied by the exponents' own uncertainty.
        INSIDE it, S is indistinguishable from a convex set with noise and NO non-convexity is reportable.
  test_boundary:
    instances:
      - >-
        The corpus's recorded (m, t) pairs, enumerated BEFORE any external reading so the corpus
        contribution is separable from the web contribution
      - >-
        Primary sources for each family, read to replace every recalled exponent, with unread points
        EXCLUDED and recorded as excluded
      - >-
        NULL-1: an exactly linear log-log tradeoff sampled at 20 values of m
      - >-
        NULL-2: point sets drawn from a strictly convex curve plus Gaussian noise of declared magnitude,
        at least 8 draws, at the same cardinality as S
      - >-
        NULL-4a: the parametric tuple-sieve tradeoff curve sampled densely, where obtainable
      - >-
        NULL-4b: the same computation at at least three k-grid densities
    parameters:
      reading_cells: >-
        the product of the two named classical readings and the two named quantum readings; one hull per
        cell, never a single hull
      alpha_grid: alpha in [0, 1]
      m0_grid: m0 covering [0, 0.30]
      k_grid_densities: >-
        at least three, for example the tuple sizes 2-3, then 2-4, then 2-6, where readable
      dimensions_for_bit_conversion: >-
        385.084530, 590.132012, 825.235330

      null2_draws: at least 8
      arithmetic: exact rationals, never floating point
    implementation: >-
      One script, under one hour of single-core compute, no sieve, no lattice, no instrument rebuild. The
      dominant cost is READING primary sources, and the reading is owed anyway.
    budget:
      wall_clock_seconds: 3600
      cpu_hours: 1.0
      maximum_memory_gb: 4
      maximum_runs: 8
  falsification_conditions:
    - >-
      B minus A is EMPTY. The price parameterisation is complete over the readable algorithm set, the
      sibling price-swept record needs no repair, and this hypothesis's methodological claim is REFUTED.
      This is a clean negative and it carries substantial prior probability.
    - >-
      B minus A is non-empty on the discrete grid but empty on the continuum arm, or |B minus A| increases
      monotonically with k-grid density. The pockets are manufactured by discretising a continuous
      tradeoff, the headline integer is an ARTIFACT, and nothing about non-convexity is reportable.
    - >-
      Neither continuum arm can run because the parametric form is unobtainable and fewer than four k
      values can be read. |B minus A| is reported as UNCONTROLLED FOR DISCRETISATION and is NOT a finding;
      only part (A)'s theorem survives as a deliverable. This outcome is made likely by an already-failed
      PDF fetch and is declared here rather than discovered by a reviewer.
    - >-
      The off-hull count on S lies inside NULL-2's calibrated interval. S is indistinguishable from a
      convex set given the uncertainty in its own exponents, and no non-convexity is reportable at any
      dimension.
    - >-
      NULL-1 reports any point of an exactly linear tradeoff as off-hull. The hull implementation is
      wrong, nothing is reported, and an arithmetic defect is recorded.
    - >-
      The classical-minus-quantum gap ratio, computed against hull values, is at or below 1. The quantum
      advantage SHRINKS rather than grows under a memory budget and part (C) is reversed.
    - >-
      Stage 0 cannot read enough primary sources to populate three distinct memory values. The hull is
      degenerate, convexity is vacuous, and the record reports that it could not be tested.
  distinguishable_outcomes:
    price_parameterisation_complete: >-
      |B minus A| = 0 after the continuum control. MEANING: memory is adequately modelled as a priced
      resource over the readable algorithm set; the lane's price sweeps are a complete instrument and the
      sibling record needs no repair. A clean negative that STRENGTHENS a sibling.
    price_parameterisation_blind: >-
      |B minus A| is a positive integer SURVIVING the continuum arm and the density sweep. MEANING:
      non-convex pockets exist in the readable set, every price-parameterised crossover in this lane
      systematically mis-locates the optimum at those budgets, and the size of the miss is reported in
      exponent units and in bits at the three committed dimensions.
    discretisation_artifact: >-
      |B minus A| is positive on the discrete grid but zero on the continuum, or grows monotonically with
      k-grid density. MEANING: the pocket is manufactured by sampling a continuum; the headline is an
      artifact and is struck from the deliverable. This is a third outcome DECLARED IN ADVANCE.
    uncontrolled_for_discretisation: >-
      Neither continuum arm can run. MEANING: |B minus A| is reported as uncontrolled and is NOT a
      finding; only the price/budget theorem survives, which needs no k-grid at all.
    indistinguishable_from_convex: >-
      The off-hull count lies inside NULL-2's calibrated false-positive interval. MEANING: S is
      indistinguishable from a convex set given its own exponent uncertainty; no non-convexity is
      reportable.
    implementation_defect: >-
      NULL-1 reports an off-hull point on a linear set. MEANING: the orientation arithmetic is wrong --
      precisely the failure a 0.004 margin invites -- and nothing is reported.
    quantum_advantage_reverses: >-
      The gap ratio against hull values is at or below 1. MEANING: part (C) is reversed; the quantum
      advantage shrinks under a memory budget. This would be MORE interesting than the predicted direction
      and is reachable if the unread quantum memory exponent is small.
    hull_degenerate: >-
      Fewer than three distinct memory values can be read. MEANING: convexity is vacuous and the record
      reports that it could not be tested.
  interpretation_limits:
    - >-
      NO ATTACK IS IMPLEMENTED, NO INSTANCE IS SOLVED, NOTHING IS MEASURED. Every number is arithmetic on
      published asymptotic exponents whose o(d) terms are UNBOUNDED, and asymptotic exponents license no
      statement about concrete cost at any dimension. The conversion "exponent times dimension = bits" is
      a convention-internal device expressing SIZE, not a cost prediction.
    - >-
      THE OBJECT SURVIVES ONE STEP AND NOT TWO. It decides which algorithm a cost CONVENTION selects; it
      does NOT decide which algorithm is actually faster at any dimension. The gaps at stake are 0.001 to
      0.005 in exponent, far inside what an unbounded o(d) can move.
    - >-
      No FIPS parameter set is affected or cleared here, and nothing here proposes any status change to
      any committed record. A scope statement about a committed record is not a correction to it.
    - >-
      The quantum points assume QRAM/QCRAM and are taken at FACE VALUE so that a sibling record attacking
      their physical admissibility can be read against this one. If they are inadmissible under a depth
      budget, part (C) is voided and the two records together form the complete argument.
    - >-
      A hull computed across MIXED memory models is a category error unless the conversion is declared.
      Classical bits, QCRAM bits and qubits are different resources; the classical and quantum hulls are
      reported separately and part (C) compares two separate hulls, never one.
    - >-
      Every verdict is emitted PER READING CELL. A point whose status flips across any named reading is
      reported as UNDECIDED, not as on-hull or off-hull; under that rule one quantum point is ALREADY
      undecided before the batch runs.
    - >-
      NOVELTY IS NOT CLAIMED against the external literature. Whether the observation that the
      memory-budgeted quantum advantage exceeds the free-memory one has been published is unknown to this
      record, and a reviewer with retrieval should chase it.
