  goal_id: GOAL-ECDLP-001
  source_proposal: IDEA-20260904-f68c7f
  proposal_id: IDEA-20260904-f68c7f
  title: >
    Stage 0 closed-form beta-threshold
    identities — conversion exponent
    2 beta versus 1/2 — before any
    HNP lattice is built
  status: specified
  proposed_by: idea-generator
  designed_by: coordinator
  designed_under_task: TASK-20260913-c6ebfe
  specified_by: DEC-20260913-989bc4
  specified_at: '2026-09-13'
  created: '2026-09-13'
  updated: '2026-09-13'
  depends_on:
    - IDEA-20260904-f68c7f
    - RQ-ECDLP-002
  related_hypotheses:
    - H-ECDLP-a4be60
  statement: >
    Fix the closed-form conversion-
    threshold identities of
    IDEA-20260904-f68c7f before any
    Hidden Number Problem lattice is
    built, any phase is estimated, or
    any discrete logarithm is solved.
    Stage 0 asserts only that on the
    frozen beta grid {1/5, 1/4, 3/10}
    the conversion exponent 2*beta is
    strictly below 1/2 at 1/5, equal
    at 1/4, and strictly above at
    3/10, and that the spectral-norm
    necessary condition 39/100 > 1/4
    holds while a polylog (exponent
    0) does not. A nearby claim that
    the threshold is beta < 1/2 is
    rejected. A dummy that any
    nonzero A(v) beats rho is
    rejected. This is not an HNP
    attack and not a rho beat.
    Stages 1+ stay unauthorized.
  mechanism: >
    IDEA-20260904-f68c7f tracks the
    cost eps^{-2} n^{o(1)} of a
    phase-read-off plus HNP
    conversion and compares it to
    n^{1/2}. Stage 0 freezes the
    exponent comparison 2*beta ? 1/2
    so a later planted-eps run cannot
    be read from an instrument that
    moves the threshold. No sample is
    drawn. No Babai nearest-plane.
    No Semaev S_m. No Coppersmith.
    No DLP solve.
  predictions:
    - id: P-S0-BETATH
      metric: closed-form beta-threshold identities
      direction: different
      minimum_effect: >
        After fixture_pass, REAL
        reports 2*(1/5)<1/2,
        2*(1/4)=1/2, 2*(3/10)>1/2,
        and 39/100>1/4 while 0 is
        not. KF beta<1/2 threshold
        is rejected. NULL any-
        nonzero-beats-rho is
        rejected.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KF
      statement: >
        After fixture_pass, KF claim
        that the threshold is beta <
        1/2 is accepted.
    - id: F-S0-REAL
      statement: >
        After fixture_pass, REAL
        misses a grid comparison or
        the 39/100 versus 1/4
        spectral screen.
  test_boundary:
    instances:
      - frozen Stage 0 REAL / KF / NULL threshold-arithmetic panel
    parameters:
      real_grid:
        beta: ['1/5', '1/4', '3/10']
        conversion_exponent: 2*beta
        rho_exponent: '1/2'
        beats_strict_at: ['1/5']
        equal_at: ['1/4']
        loses_at: ['3/10']
        spectral_L_exponent_clears: '39/100'
        spectral_threshold: '1/4'
        spectral_polylog_exponent: 0
        must_one_fifth_beats: true
        must_one_fourth_equal: true
        must_three_tenths_loses: true
        must_spectral_screen: true
      known_false:
        kind: threshold_is_beta_lt_half
        claimed_threshold: '1/2'
        true_threshold: '1/4'
        must_reject: true
      matched_null:
        kind: any_nonzero_beats_rho
        must_reject: true
      stage0_only_at_specify: true
    implementation: EXP-ECDLP-44f4af Stage 0 runner
    budget:
      wall_clock_seconds: 120
    prose: >
      Exact rational arithmetic only.
      No HNP lattice. No phase
      estimate. The threshold beta <
      1/4 is the proposal's own
      comparison, not a measured
      attack.
  assumptions:
    - id: A1
      statement: >
        The frozen comparison is
        2*beta versus 1/2. Stage 0
        does not build an HNP
        lattice and does not solve a
        DLP.
      status: explicit
    - id: A2
      statement: >
        Standing user authorization
        2026-09-06 covers protocol
        approval once the contract is
        complete.
      status: explicit
  heuristic_assumptions: []
  proof_search_map:
    bottleneck: >
      Whether 2*beta is below, equal,
      or above 1/2 on the frozen
      grid, and whether 39/100 clears
      1/4.
    baseline_embedding:
      parameter_slice: >
        REAL beta grid, KF beta<1/2
        threshold, NULL any-nonzero
        beats rho.
        Disclosed tightening:
        arithmetic calibrator only,
        not the proposal's planted-
        eps or natural-statistic
        stages.
      reproduction_check: >
        1/5 beats; 1/4 equal; 3/10
        loses; 39/100 clears; 0 does
        not. KF rejected. NULL
        rejected.
    observation_collision:
      observable: conversion exponent 2*beta versus rho exponent 1/2
      distinct_preimage_search: >
        Hold the cost model and move
        the threshold to 1/2 (KF).
        Hold the method and let any
        nonzero A(v) win (NULL).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Frozen beta-threshold table.
        predicted_gain: >
          Exact known-false reject on KF.
          Zero claimed rho beat.
    quantifier_order: >
      Freeze the grid and the 2*beta
      versus 1/2 rule before reading
      the table. Toy 1/5-beats is
      not a conversion attack.
    method_ceiling:
      strongest_certifiable_claim: >
        Instrument reproduction on
        the declared frozen
        arithmetic. Never HNP.
        Never a rho beat. Never an
        ECDLP exponent.
      nearby_object_control: >
        NULL is an any-nonzero-wins
        dummy. An argument that
        still calls it a conversion
        threshold is proves-too-much.
  knowledge_promotion:
    promoted: []
    not_warranted: Stage 0 design only. Nothing to promote.
  scientific_boundary: >
    Stage 0 P-S0-BETATH only. Not
    HNP. Not Babai. Not Boneh-
    Venkatesan. Not Semaev S_m. Not
    Coppersmith. Not a DLP solve.
    Not a rho beat. No Stage 1 of
    EXP-ECDLP-44f4af.
