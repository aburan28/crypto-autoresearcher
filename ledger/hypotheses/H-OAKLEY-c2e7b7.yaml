  title: >-
    2^{4p}/24 first exceeds 2^{40} at p = 12 and 2^{48} at p = 14, and the
    charged totals sit strictly between the written powers of two.
  statement: >-
    4! = 24 and 5! = 120, so their ratio is 5. The inequality
    2^{4p} > 24 * 2^{40} fails at p = 11 and first holds at p = 12. The
    inequality 2^{4p} > 24 * 2^{48} fails at p = 13 and first holds at
    p = 14. Also 24^2 > 2^9 and 24^5 < 2^{23}, so log2(24) lies strictly
    between 4.5 and 4.6. The model total 5 * 2^{5p-1} at p = 31 is
    strictly above 2^{152} and 2^{156} and strictly below 2^{157}. At
    p = 37 it is strictly above 2^{183} and 2^{186} and strictly below
    2^{187}.
  mechanism: >-
    The proposal prices one SAT attempt as 2^{4p}/24 and then multiplies
    by 5! and by 2^{p-1}. The product simplifies to 5 * 2^{5p-1}. This
    contract checks that algebra. It does not run a solver.
  assumptions: []
  proof_search_map:
    bottleneck: Two strict inequalities and the first integer p at which each holds.
    baseline_embedding:
      parameter_slice: >-
        Claim paragraphs C and D of IDEA-20260922-af7396, read 2026-10-01.
        The comparisons below were computed with integer shifts in this
        design session. That computation is not a run.
      reproduction_check: >-
        One route uses bit shifts. The other multiplies by 24 as an
        integer in a separate module. They must agree on every comparison.
    observation_collision:
      observable: The first p that clears each cap, and the two total-cost brackets.
      distinct_preimage_search: >-
        The written crossovers p = 11 and p = 13 do not clear the caps.
        Reporting that they do invalidates the run.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The integers 24, 40, 48, 31, and 37.
        predicted_gain: Four comparisons and two brackets. No attack cost.
    quantifier_order: >-
      For each cap, every p from 11 through 14 is tested, and for each
      endpoint the total is compared with three powers of two.
    method_ceiling:
      strongest_certifiable_claim: >-
        The integer table. Not a measured conflict count and not a
        statement that either Oakley group falls.
      nearby_object_control: >-
        The pair of crossovers 11 and 13. Both fail the strict inequality.
    proof_obligations:
