      citation: "ideas/artifacts/ECDLP-IDEA-436/ggm_simulability_gate_erratum_20260831.md"
      provenance: internal
      verified_by: >-
        idea-generator of IDEA-20260901-b4e6eb, which records reading
        sections A through D.8 of that erratum on 2026-09-01. RELAYED, NOT
