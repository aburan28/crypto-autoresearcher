  reduction_chain:
    core_problem: >-
      Whether the precision-r digit family of the canonical prime-to-p lift
      supplies any majority advantage along the discrete-log coordinate
      beyond its own r = 1 shadow, on the tested toy family.
    corollaries: []
  reduction_chain_note: >-
    Deliberately empty. A closure branch closes the DECLARED LADDER on the
    TESTED family and reaches no downstream problem; a lead branch would
    require a separate proposal with its own exponents and cost table before
    anything followed from it.

  predictions:
    - metric: >-
        P1 - the advantage q_maj minus 1/s for each digit statistic at
        r = 1, 2, 3, minus the same quantity for the plain x-coordinate
        bucket at matched s and matched n; dimensionless
      direction: different
      minimum_effect: >-
        PRE-REGISTERED TWO-BRANCH RULE. Absolute difference at or below 0.01
        at every tested (n, s, r) records the CLOSURE branch. A difference at
        or above 0.05, reproduced at three or more prime orders AND not
        decaying with n, records the LEAD branch and triggers MANDATORY
        independent review before any interpretation. Anything strictly
        between is INCONCLUSIVE IN ADVANCE. BASIS: these are pre-registered
        TOLERANCES chosen from the n^{-1/2} scale at the tested sizes, not
        measurements, and they are deliberately the same shape as a sibling
        lane's bands so the lanes stay comparable.
    - metric: "P2 - the advantage as a function of n at fixed (s, r), fitted to n^{-beta}; beta dimensionless"
      direction: lower
      minimum_effect: >-
        A fitted beta consistent with 1/2 across at least six prime orders
        spanning at least a 6x range. A beta consistent with 0 - an advantage
        flat in n - is the canonical artifact tell and is reported as a
        controlled null UNLESS it survives every null and the comparator, in
        which case it is the lead.
    - metric: >-
        P3 - digit-for-digit agreement between the k-free transport procedure
        and the direct lift-then-multiply computation, over all sampled k and
        all tested r; dimensionless rate in [0,1]
      direction: same
      minimum_effect: >-
        EXACT AGREEMENT ON 100 PERCENT OF SAMPLES. This is a DECISION, not an
        estimate. Any disagreement means the transport lemma is false as a
        procedure, the record STOPS, and the disagreement is archived
        verbatim as the refutation artifact - it would also contradict a
        committed technique record and would be the single most informative
        outcome available here.
    - metric: >-
        P4 - the known-answer calibration statistic (the valuation of a
        coordinate difference against a fixed reference); the value SET and
        the fibre it is large on
      direction: different
      minimum_effect: >-
        EXACTLY TWO DISTINCT VALUES, with the large value on exactly the
        pairs satisfying k congruent to plus or minus the reference modulo n.
        Any other outcome means the p-adic arithmetic is wrong and every
        number downstream is void.
    - metric: >-
        P5 - the advantage measured against the PRECISION NULL (a Hensel lift
        WITHOUT the order-n projection) at matched (n, s, r); dimensionless
      direction: different
      minimum_effect: >-
        REPORTED WHATEVER ITS VALUE. If the precision null matches the
        true-lift advantage, no conclusion specific to the CANONICAL lift may
        be drawn and the result is about Hensel digits in general - a
        different and weaker statement that the record must make rather than
        round up.
    - metric: >-
        P6 - recovery of each rung of the PLANTED-ADVANTAGE LADDER at
        declared effect sizes; dimensionless advantage with a bootstrap
        interval
      direction: different
      minimum_effect: >-
        Each planted effect recovered within its bootstrap 95 percent
        interval at the largest tested n, at declared sizes spanning the
        decision band from well above it to at its lower edge. THIS MEASURES
        THE ESTIMATOR'S RESOLUTION RATHER THAN ASSERTING IT: a pipeline that
        cannot resolve a planted effect at the size of the CLOSURE threshold
        cannot honestly declare closure at that threshold, and if it cannot,
        the threshold is raised to the smallest recoverable rung and the
        change is recorded as a protocol amendment BEFORE the digit arms are
        read.

  test_boundary:
    instances:
      - "At least six prime subgroup orders spanning at least a 6x range in the 16 to 26 bit band, with the subgroup COMPLETELY ENUMERATED so q_maj is exact."
      - "Curves excluded for anomalous or smooth order before entering the run set; the anomalous case doubly excluded because the lift is undefined there."
      - "Statistic ladder T1..T5 as declared, plus the comparator, two nulls, two blocking positive controls, a composite-order control, and the planted-advantage ladder."
      - "A curve-free multiplicative-group arm carrying the same estimator - see the paired contract's null_object block."
    parameters:
      n_band: "16 to 26 bits"
      r: "{1, 2, 3, 4}"
      s: "2..8"
      sampled_k_for_P3: "10^4 per (p, r) cell"
      enumeration: "complete; q_maj computed exactly, never sampled"
    implementation: >-
      E(Z/p^r Z) arithmetic and TWO computation paths for the lift, with k
      STRUCTURALLY WITHHELD from the transport path and a static provenance
      gate run over that path. The estimator is the one the sibling record
      defines, so numbers are comparable rather than merely similar.
    budget: >-
      See EXP-ECDLP-a98ea9. Exactness is bought with enumeration, which caps
      the ladder; the cap is stated in the contract rather than implied.

  falsification_conditions:
    - >-
      F1. P3 disagreement at any digit. The transport lemma is false as a
      procedure, the record STOPS, and the disagreement is archived verbatim
      as the refutation artifact. It would also contradict a committed
      technique record and requires independent replication before anything
      is concluded from it.
    - >-
      F2. The known-answer calibration returns other than two values on the
      predicted fibre. The p-adic arithmetic is wrong; nothing is reported.
    - >-
      F3. The r = 1 edge disagrees with the sibling record's committed
      fixture. Pipeline bug; both lanes are blocked until the discrepancy is
      located.
    - >-
      F4. A digit statistic exceeds its r = 1 shadow by 0.05 or more,
      reproducibly, with the excess NOT decaying in n and NOT reproduced by
      either null. THE LEAD BRANCH: the transport does not carry the
      statistical claim, the degree gap is real and consequential, and the
      family is a live object. It would STILL BE NO ATTACK: converting an
      advantage into key recovery needs a separate proposal with its own
      exponents and cost table.
    - >-
      F5. Every digit statistic matches its r = 1 shadow within the band and
      decays like n^{-1/2}. The predicted outcome. The computational half is
      disposed IN THE TESTED SCOPE on a measured ground, and the honest
      headline is a transport lemma plus a controlled null. It closes the
      declared ladder and NOT the sub-question, which quantifies over all
      statistics.
    - >-
      F6. The precision null matches the true-lift advantage. No
      canonical-lift-specific conclusion; the result is about Hensel digits
      in general.
    - >-
      F7. The planted-advantage ladder is not recovered at the closure
      threshold's own size. The estimator cannot resolve the effect it would
      have to rule out, and the threshold must be raised before any digit arm
      is read.
    - >-
      F8. Precision-r arithmetic or enumeration exceeds the budget before the
      ladder resolves. INFRASTRUCTURE outcome under AGENTS.md rule 5,
      recorded as such and never as evidence about the digit family.

  interpretation_limits:
    - >-
      Claim (B) is an INFORMATION statement and is NOT NOVEL to this program;
      a committed technique record states it. Only the explicit procedure,
      its cost, the transport into the bounded class, the prime-n
      homomorphism argument, and the measurement are offered as this record's
      content.
    - >-
      Claim (C) is CONDITIONAL on a sibling record's sub-result, which is
      itself a prediction in that record and not a validated finding, and on
      the degree gap of (D), which is open. Nothing here may be cited as an
      unconditional bound on p-adic statistics.
    - >-
      A closure branch closes the DECLARED LADDER on the TESTED toy family.
      It does not close the open sub-question, which quantifies over all
      statistics and all precision schedules.
    - >-
      THE PRECISION SCHEDULES r(n) GROWING WITH n - which is what the open
      sub-question actually contemplates - CANNOT BE TESTED BY THIS DESIGN AT
      ANY BUDGET IT COULD BE GIVEN, because exactness requires complete
      enumeration and complete enumeration caps n. That is a REAL GAP between
      what is measured and what is asked, and it is recorded here rather than
      in a footnote.
    - >-
      Toy tier throughout. Nothing about cryptographic n follows from any
      outcome and no extrapolation is licensed.
    - >-
      Nothing here bears on anomalous curves or the additive transfer; on
      those curves the object of study does not exist.
    - >-
      The paired contract carries a CURVE-FREE MULTIPLICATIVE-GROUP ARM with
      a pre-declared consequence, because the transport lemma's structure is
      a statement about prime-to-p lifts in finite abelian groups and a
      non-curve object could reproduce most of the signature.
    - >-
      No disposition, status change, or claim about any other record is made
      or implied.

