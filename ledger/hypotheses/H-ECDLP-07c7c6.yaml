  design_note: >-
    DESIGN ONLY. The transport lemma, the prime-order homomorphism argument,
    the declared statistic ladder and the two-branch decision rule are the
    idea-generator's. The Coordinator's own contributions are three, all
    tightening: a PLANTED-ADVANTAGE LADDER at four known effect sizes, which
    measures the estimator's resolution instead of asserting it and fills the
    gap between the source's only two rungs (a null at 0 and a positive at
    0.5); a MULTIPLICATIVE-GROUP curve-free arm with a pre-declared
    consequence; and an explicit, honest reduction of the field-size ladder
    from the source's "up to about 30 bits" to 16-26 bits, because exact
    enumeration at 2^30 does not fit the declared memory. No status of any
    record is changed and nothing here is evidence.

  status: proposed
  proposed_by: idea-generator

  statement: >-
    TEST BOUNDARY FIRST. Toy tier throughout, prime subgroup orders in the 16
    to 26 bit band, complete enumeration so the majority advantage is
    computed EXACTLY rather than sampled, precision r at most 4, image sizes
    s in 2..8. No attack is run, no scalar is recovered outside toy
    calibration, and no key material of any kind is involved.

    FROZEN SETTING, inherited unchanged: E/F_p with good reduction, a
    Weierstrass model over Z_p realising it with v_p(discriminant) = 0, S in
    E(F_p) of order n with gcd(n, p) = 1, and S-hat the canonical order-n
    prime-to-p lift. Model non-minimality is EXCLUDED. Points whose order is
    divisible by p are OUT OF SCOPE, which includes every generator of an
    anomalous curve, so this record says NOTHING about the additive transfer
    on anomalous curves and must not be read as saying anything about it.

    (A) THE TRANSPORT LEMMA, STATED AS A PROCEDURE BECAUSE THE PROCEDURE IS
    THE EXPERIMENT'S BLOCKING CONTROL. Reduction restricted to the prime-to-p
    torsion is an isomorphism, so [k]S-hat is the unique order-n lift of [k]S
    and depends on nothing else. It is COMPUTED thus: given [k]S in E(F_p)
    and a precision r, Hensel-lift the point to ANY T in E(Z/p^r Z) reducing
    to it; E(Z/p^r Z) splits as its prime-to-p part times the kernel of
    reduction, which is a p-group of exponent dividing p^{r-1}; so
    [p^{r-1}]T kills the kernel component, and multiplying by the inverse of
    p^{r-1} modulo n returns [k]S-hat modulo p^r. Cost: O(r log p) group
    operations on E(Z/p^r Z), hence poly(r, log p) bit operations.
    CONSEQUENCE: for every r and every statistic T, the value
    T(digits_r([k]S-hat)) equals Phi_{r,T}([k]S) for an explicit poly-time
    Phi_{r,T} depending only on (E, p, r, T) and NOT on k.

    (B) WHAT (A) DISPOSES OF, RIGOROUSLY AND MODEL-FREELY. Any party holding
    the F_p point can compute every digit value itself, so the conditional
    entropy of a digit oracle's output given that party's view is exactly 0.
    The digit family supplies ZERO INFORMATION. This is the coordinate-level
    instance of a boundary this corpus already records, and NO NOVELTY IS
    CLAIMED FOR IT. What is new is the explicit procedure and its cost, which
    convert a statement about information into a statement about a
    COMPUTATION that an experiment can run and check.

    (C) WHAT (A) TRANSPORTS, AND WHERE THE REAL QUESTION LIVES. The
    computational handle left open is whether some statistic T and precision
    schedule r(n) make T(digits_r(.)) a nonconstant homomorphism-like map
    from the subgroup to a small target. By (A) that map is a function of the
    F_p coordinates, i.e. it lies in the class a sibling record bounds by
    square-root cancellation in character sums over the points of an elliptic
    curve. Two further consequences follow at zero compute. First, the EXACT
    homomorphism version is settled for prime n: a group homomorphism from a
    cyclic group of prime order n to any group of order below n is trivial,
    so "homomorphism-like" can only mean approximate, and an approximate
    homomorphism is precisely a large Fourier coefficient along the
    discrete-log coordinate - the quantity that bound caps. Second, the COST
    version is settled: a digit statistic costs poly(r, log p) per evaluation
    while the coordinate it is a function of costs O(1), so as an iteration
    hash inside a rho walk it is strictly dominated for every r > 1 and
    degenerates to the plain coordinate at r = 1.

    (D) THE GAP THAT MAKES THIS AN EXPERIMENT AND NOT A MEMO, STATED AGAINST
    THIS RECORD'S OWN INTEREST. The bound being borrowed holds "up to the
    degree of the defining conditions". Phi_{r,T} is poly-TIME but is NOT a
    bounded-degree algebraic function of the coordinates: it is a Hensel
    iteration composed with a projection, and its degree as an algebraic map
    is not controlled by anything this record can cite. SO THE TRANSPORT PUTS
    THE FAMILY IN THE COMPUTABLE CLASS BUT NOT AUTOMATICALLY IN THE
    BOUNDED-DEGREE CLASS THE WEIL BOUND COVERS. Whether the pinning survives
    that degree gap is a measurement, it is cheap, and both outcomes are
    informative.

    WHAT IS NOT CLAIMED. No attack, no exponent, no algorithm. No disposition
    of, or status change to, any other record. Nothing about anomalous
    curves. Nothing about precision schedules r(n) growing with n, which is
    what the open sub-question actually contemplates and which this design
    cannot reach.

  mechanism: >-
    THE TRACKED OBJECT is the precision-r digit vector of the canonical
    prime-to-p lift, digits_r(x([k]S-hat)) and digits_r(y([k]S-hat)),
    truncated through a declared ladder of statistics. THE CLAIM OF THIS
    RECORD IS THAT THIS OBJECT IS NOT A NEW PROJECTION OF THE STATE AT ALL
    but a re-encoding of an old one, and the transport lemma is the proof.
    Applying the lossy-projection test explicitly: the object is lossy as a
    map to a small target, but the test's second clause asks whether what is
    discarded is discarded COMPATIBLY so the retained part propagates - and
    here the object is not a further projection of the state, it is a
    FUNCTION of the F_p point computed at extra cost. Relative to the
    coordinates it is not lossy but REDUNDANT, and a redundant re-encoding is
    a change of coordinates rather than a new object. Relative to the group
    element it is lossy only in the same way the x-coordinate already is.

    HOW THE MEASUREMENT IS STRUCTURED. STAGE 1 is a BLOCKING INSTRUMENT
    CONTROL and the heart of the design: for toy curves and known k, compute
    [k]S-hat TWICE - once by lifting S to S-hat and multiplying by k in
    E(Z/p^r Z), and once by the procedure of (A) applied to the F_p point
    [k]S alone, WITH k STRUCTURALLY WITHHELD from that code path. The two
    must agree digit for digit at every tested r. If they do not, (A) is
    false as a procedure and the record stops - and that outcome would itself
    be significant, because it would mean the lift carries something the F_p
    point does not.

    STAGE 3 measures the majority advantage q_maj minus 1/s in exactly the
    estimator a sibling record uses, so the numbers are COMPARABLE to that
    record's committed values rather than merely similar. The declared ladder
    is: T1 the j-th p-adic digit of x([k]S-hat) for j = 0, 1, 2 bucketed into
    s classes; T2 the quadratic character of the j-th digit; T3 the
    leading-digit interval bucket at precision r; T4 the pair (digit_0,
    digit_1) bucketed; T5 the valuation of x([k]S-hat) minus x([j]S-hat) for
    a fixed reference j - a statistic whose answer is already KNOWN and which
    is included ONLY as a known-answer calibration.

    STAGE 5 checks decay. The advantage must shrink like n^{-1/2}. An
    advantage flat in n is the canonical artifact tell and is reported as a
    controlled null unless it survives every null and comparator, in which
    case it is the lead and is routed to independent review before any
    interpretation.

  assumptions:
    - >-
      The frozen setting above, adopted unchanged: good reduction, a
      Weierstrass model over Z_p with v_p(discriminant) = 0, gcd(n, p) = 1.
      Model non-minimality is EXCLUDED.
    - >-
      Points whose order is divisible by p are out of scope. On an anomalous
      curve a generator has order p, violating gcd(n, p) = 1, so the
      canonical order-n lift DOES NOT EXIST and the statistic is undefined
      rather than uninformative. Anomalous curves are therefore doubly
      excluded and nothing here bears on the additive transfer.
    - >-
      n prime. Load-bearing for the exact-homomorphism argument and for the
      borrowed bound; the composite case is excluded and is used as a
      control.
    - >-
      Toy scale binds, and for a stated reason: the estimator computes q_maj
      EXACTLY by complete enumeration of the subgroup, which requires the
      subgroup to be enumerable.
    - >-
      The transport code path never reads k. This is enforced structurally
      and verified by a static provenance gate, not asserted.

  proof_search_map:
    bottleneck: >-
      Not the transport lemma, which is a page, but the DEGREE GAP: whether a
      poly-time but unbounded-degree function of the F_p coordinates is still
      pinned at the Weil scale. Every downstream statement depends on that
      and nothing this record can cite settles it, which is why the
      deliverable is a measurement and not a closure.
    baseline_embedding:
      parameter_slice: >-
        r = 1. At precision 1 the digit vector IS the F_p coordinate pair,
        the transport lemma is vacuous, and the ladder collapses to exactly
        the x-coordinate bucket statistic whose majority advantage a sibling
        record has already committed at small primes.
      reproduction_check: >-
        The r = 1 edge must reproduce that record's committed values for the
        x-bucket at matched (p, s), in exact rational arithmetic, read from
        that record's own committed text rather than assumed here. Identical
        numbers, or the two pipelines disagree and neither may report an
        advantage. NOTE THE CAVEAT THAT RECORD RECORDS AGAINST ITSELF: those
        curves were used at full COMPOSITE group order, so the fixture is a
        PIPELINE CHECK and not evidence about the prime-order theory.
    observation_collision:
      observable: "The measured majority advantage q_maj minus 1/s of a statistic at given (n, s)."
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED: two structurally different
        statistics with the same advantage - a digit statistic at r = 3 and
        the plain x-coordinate bucket at the same s. A collision there does
        NOT falsify the measurement; it is the PREDICTED outcome and it
        CALIBRATES the claim, bounding it to "the digit family is not
        distinguishable from its own r = 1 shadow". Reporting a digit
        advantage without running that comparator is PROHIBITED by this
        record.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the digit family from the p-adic model, where no bound is
          available, to the F_p-coordinate model, where a measured bound
          already exists, by the explicit map Phi_{r,T}. Encoding: exact.
          Completeness: exact, every digit statistic is in the image.
          Soundness: exact for the INFORMATION claim; NOT established for the
          STATISTICAL claim, because the transfer does not preserve algebraic
          degree - the disclosed loss, which is the gap in (D).
        predicted_gain: >-
          Disposes of the information half at zero compute and reduces the
          computational half to one already-instrumented measurement rather
          than to new p-adic theory.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (the advantage) fixed and vary the forgotten
          structure (the precision r). If the advantage is independent of r
          the p-adic content is inert and the object is its r = 1 shadow; if
          it grows with r, an intrinsic invariant distinguishes them and that
          is the lead.
        predicted_gain: >-
          Turns "is there p-adic structure" into a one-dimensional curve in r
          with a predicted flat shape.
    quantifier_order: >-
      TRANSPORT LEMMA: FOR ALL E, p, n, r in the frozen setting, THERE EXISTS
      a poly(r, log p) procedure Phi_r depending on (E, p, r) and NOT on k or
      any secret, such that FOR ALL k, digits_r([k]S-hat) = Phi_r([k]S). The
      witness may depend on PUBLIC instance data and is FORBIDDEN to depend
      on k; the code must enforce that separation and the static provenance
      gate must be run over it.
      MEASUREMENT CLAIM: FOR ALL statistics in the DECLARED LADDER and FOR
      ALL tested (n, s), the advantage does not exceed the x-bucket
      comparator by more than the pre-registered band. The quantifier is over
      the declared ladder, NOT over all statistics, and nothing here claims a
      result about statistics outside it.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "the transport lemma holds as a checked procedure on the
        tested curves and precisions, and on this toy family the declared
        digit statistics show no advantage exceeding their own r = 1 shadow
        beyond the pre-registered band, with the excess decaying like
        n^{-1/2}". It can NEVER certify that no statistic of the digits
        helps, because that quantifies over all statistics; it certifies
        nothing about cryptographic n; and it certifies nothing about the
        ECDLP.
      nearby_object_control: >-
        The nearby object where the hoped-for conclusion FAILS would be a
        p-adic statistic on a curve and point where a genuine p-adic
        separation exists. The obvious candidate, an anomalous curve, is NOT
        USABLE, and the reason is recorded rather than rediscovered: on
        #E(F_p) = p a generator has order p, violating gcd(n, p) = 1, so the
        canonical order-n lift does not exist and the statistic is UNDEFINED
        rather than merely uninformative. The substitute adopted is a
        NON-GENERATOR of prime-to-p order on an anomalous curve, where the
        object is defined while the additive transfer still applies to the
        full group. Whether that is a useful calibration is itself reported.
    proof_obligations:
      - claim: "digits_r([k]S-hat) is computable from [k]S alone in poly(r, log p) by the stated Hensel-plus-projection procedure."
        responsibility: correctness
      - claim: "The projection [p^{r-1}] kills the kernel of reduction and multiplication by the inverse of p^{r-1} mod n restores the order-n component."
        responsibility: correctness
      - claim: "For prime n, every group homomorphism from the subgroup to a group of smaller order is trivial."
        responsibility: strictness
      - claim: "The r = 1 edge reproduces the sibling record's committed x-bucket fixture exactly."
        responsibility: baseline
      - claim: "The transport procedure's code path never reads k, verified by a static provenance gate."
        responsibility: interface
      - claim: >-
          The estimator recovers each rung of the planted-advantage ladder
          within its bootstrap interval, so its resolution floor is measured
          rather than assumed.
        responsibility: size
      - claim: "Every reported advantage names r, s, n, the statistic and the enumeration mode, and uses the named estimator."
        responsibility: scope

  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. NO ATTACK EXPONENT IS CLAIMED, and none can be: the
    predicted outcome is that the object supplies nothing. The MEASUREMENT
    costs O(n * r * log^2 p) bit operations per cell by complete enumeration
    and O(n) memory, both properties of the measurement rather than of any
    proposed algorithm. The OBJECT offers no memory axis at all - no table,
    no distinguished-point structure, no precomputation - so there is no
    time-memory tradeoff to state for it. DISCLOSED OVERHEAD: the transport
    hides r group operations on E(Z/p^r Z), each with O(r^2 log^2 p) bit
    cost, so a digit statistic is roughly r^3 times more expensive per
    evaluation than the coordinate it is a function of. That factor is the
    entire content of the cost half of claim (C) and is stated rather than
    absorbed into an o(1). Parallel rho with distinguished points and the
    negation map, at about 0.886*sqrt(n) group operations and small
    per-processor memory, remains the baseline and is untouched.

  heuristic_assumptions:
    - id: HEUR-PADIC-1
      formal_statement: >-
        For a prime-order subgroup and any statistic v of the F_p coordinates
        whose defining conditions have degree d, the majority advantage
        satisfies q_maj minus 1/s = O(d * n^{-1/2} * log n), uniformly in s
        at most n^{1/4}.
      random_model_justification: >-
        The rigorous ingredient is square-root cancellation for character
        sums over the points of an elliptic curve, composed with the
        elementary Fourier expansion of the majority advantage along the
        discrete-log coordinate. THE CHARACTER-SUM LINEAGE IS RECALLED AND
        WAS OPENED BY NO AGENT IN THIS PROGRAM; the one fetch attempt in the
        source session failed with a transport error. The classical
        distribution statement imitated is that the coordinates of multiples
        of a point behave, with respect to low-degree algebraic tests, like a
        uniformly random sequence in F_p. THE COMPOSITION IS UNWRITTEN IN
        THIS PROGRAM and inherits the sibling record's status as a prediction
        rather than a theorem.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-a98ea9]
      falsification_condition: >-
        The fitted decay exponent beta is inconsistent with 1/2 across the
        tested ladder for the COMPARATOR statistic, which is inside the
        bound's own class. That would falsify the borrowed bound at the point
        where it should hold, and no digit-arm number could then be read.
    - id: HEUR-PADIC-2
      formal_statement: >-
        The algebraic degree of the transport map Phi_r, as a function of the
        F_p coordinates, does not grow fast enough in r to overwhelm the
        n^{-1/2} factor of HEUR-PADIC-1 at the tested sizes; equivalently the
        effective degree d(r) satisfies d(r) * n^{-1/2} well below the
        pre-registered band at every tested (n, r).
      random_model_justification: >-
        NONE AVAILABLE, AND THIS IS STATED AS THE RECORD'S PRINCIPAL WEAKNESS
        RATHER THAN SMOOTHED OVER. Phi_r is a Hensel iteration composed with
        a projection; it is poly-TIME but this record can cite NO bound on
        its degree as an algebraic map, and Weil-type bounds degrade linearly
        in degree. HEUR-PADIC-2 is therefore a genuine heuristic with no
        rigorous half and is exactly the gap of claim (D). It is refutable on
        its own terms: an advantage that GROWS WITH r while r = 1 behaves
        normally is its refutation, and that pattern is the specific
        signature to hunt.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-a98ea9]
      falsification_condition: >-
        The advantage as a function of r at fixed (n, s) has a slope
        materially above the largest slope observed over the precision-null
        replicates. Predicted shape is FLAT in r; a positive r-slope is the
        lead signature.

  structural_ingredients:
    - description: >-
        Reduction restricted to prime-to-p torsion is a group isomorphism
        E(Q_p)[n] -> E(F_p)[n]; the lift is information-theoretically empty;
        the lift is a deterministic function of the F_p point computable to
        any precision by Hensel lifting plus the order condition; and the
        only escape is a non-group-theoretic coordinate or valuation
        invariant, which would offer at most a computational handle.
      citation: KN-TECH-73630e
      provenance: internal
      verified_by: >-
        idea-generator of IDEA-20260901-b4e6eb, which records reading that
        technique record in full on 2026-09-01. RELAYED, NOT RE-READ by
        coordinator TASK-20260904-ae82ce. The information half of claim (B)
        is THAT record's, not this one's, and no novelty is claimed for it.
      role: >-
        supplies the information boundary this record makes effective; also
        the reason a P3 disagreement would be the single most informative
        outcome available, since it would contradict this entry
    - description: >-
        The hypothesis under audit is a disjunction; its first disjunct is
        disposed in scope on a model-free ground, while the second is NOT
