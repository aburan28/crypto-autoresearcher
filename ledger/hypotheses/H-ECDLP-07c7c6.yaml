      role: supplies the frozen setting and the open sub-question
    - description: >-
        For statistics derived from curve coordinates the majority advantage
        is controlled by Fourier coefficients along the discrete-log
        coordinate, which are character sums over the points of an elliptic
        curve, giving advantage O(N^{-1/2}) up to the degree of the defining
