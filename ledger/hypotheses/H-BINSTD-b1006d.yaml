# =============================================================================
# H-BINSTD-b1006d -- Sylow-coprimality closure of group-homomorphism cofactor
# spending on ECC2K-130 + empirical H_spent/H_unspent code-read of F2 builders.
# Specified from IDEA-20260922-e3048d under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Approved DEC-20261002-b1ffa1.
#
# ZERO RUNS in this design packet. Certificate (part A) + code-read (Stage 0)
# + conditional toy yield (Stages 1-2). NO break. NO deployed attack. No AUXIN.
# No Bedrock. Unlocks the "spend the cofactor on decomposition" seam.
# =============================================================================
hypothesis:
  id: H-BINSTD-b1006d
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-e3048d
  experiment_id: EXP-BINSTD-ec8200
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-b1ffa1
  status: approved
  proposed_by: coordinator
  title: >-
    Sylow-coprimality closes every full-translation group-homomorphism
    cofactor quotient of ECC2K-130 to the same order-l projection rho uses;
    residual lever is at most a constant-factor raw x-pool (H_spent vs
    H_unspent) decided by reading existing F2 builders

  statement: >-
    CLAIM (certificate + code-read + conditional toy observational). Let
    G = E(F_2^131) for ECC2K-130 have order 4·ℓ with ℓ a 129-bit prime
    (KN-LIT-661e97), so gcd(4,ℓ)=1. Then G = S × C with |S|=4 and |C|=ℓ,
    every endomorphism of G (including Frobenius and [-1]) preserves S and
    C, and every subgroup of G decomposes as (H∩S)×(H∩C). CONSEQUENCE (A):
    the only full-translation-closed subgroup-quotients of G that can carry
    discrete-log information in C are the standard reduction to the order-ℓ
    subgroup already used by matched rho (KN-LIT-096) and every filed
    decomposition line — a named Sylow-coprimality obstruction meeting
    inventor-protocol §4 for that ONE reading of "spend the cofactor on
    decomposition". CLAIM (B): whether this program's SEMBIN / DREG / QSP
    (and related F2) builders already sample membership over the full curve
    (H_spent) or silently restrict candidate x-coordinates to one cofactor
    coset before the solve (H_unspent) is an EMPIRICAL code-read fact; if
    H_unspent, relaxing the restriction yields at most a ≤4× (likely ≤2×
    after negation) raw-candidate-pool enlargement at zero extra per-attempt
    solve cost, priced on toy cofactor-4 vs cofactor-1 null. CLAIM TIER:
    certificate (A) + code-read table (Stage 0) + conditional toy yield
    (Stages 1–2). NO exponent move. NO break. NO deployed attack.

  mechanism: >-
    OBJECT FRAME. Representation R1: curve x-coordinate as used by filed F2
    lines. Operation set Σ_A (part A only): FULL translation action of G —
    used solely to CLOSE the group-homomorphism reading via Sylow
    coprimality (composite-order analogue of IDEA-20260806-c5d183 rigidity,
    which applies only to prime-order groups). Operation set Σ_B (live
    content): translation by factor-base elements only (Class I partial
    action). Part B's object (raw x-candidate pool pre-solve) is
    COORDINATE-DEPENDENT (Class III): retention depends on builder
    membership convention, not on a group quotient. Declared component: F2
    of existing builders; no new factor base (KN-OPEN-020 N/A). OFF-LIMITS:
    Magma/Sage as success path; AUXIN; deployed attacks; Amazon Bedrock;
    treating part (A) as an exponent claim. WHAT IS NEW: Sylow-coprimality
    certificate for the cofactor seam + falsifiable H_spent/H_unspent
    discriminator with cofactor-1 null.

  assumptions:
    - ℓ is a 129-bit prime (KN-LIT-661e97) ⇒ odd ⇒ gcd(4,ℓ)=1.
    - Part (A) uses only abstract abelian-group structure of G (order + Sylow
      decomposition), not curve geometry beyond the group order.
    - Part (B) audits existing builders; no new Σ or factor-base family.
    - RQ-FROB-7d8dd4 owns Frobenius on SUBFIELD curves (composite n); ECC2K-130
      has prime n=131 — structurally disjoint.
    - Best-case part-(B) gain is a CONSTANT FACTOR (≤4× pool size), never an
      exponent; dominated by rho at 2^60.9 if realised.
    - ARITHMETIC / CODE-READ only at deployed ECC2K-130 parameters; executable
      yield arm is toy n≤41 only, and only if Stage 0 finds H_unspent.

  proof_search_map:
    bottleneck: >-
      Whether existing F2 builders already draw candidate x-coordinates from
      all cofactor cosets (H_spent → seam closed) or restrict to one
      (H_unspent → ≤4× pool enlargement available). Decidable by reading
      code; toy yield only if H_unspent.
    baseline_embedding:
      parameter_slice: >-
        Matched rho (KN-LIT-096) already reduces to the ℓ-order subgroup;
        part (A) shows this is the ONLY full-translation quotient gain, so
        the baseline is not unfairly weakened.
      reproduction_check: >-
        SYMBOLIC zero-compute: on Z/12 (order 4·3), enumerate subgroups and
        verify every subgroup is (subgroup of Z/4)×(subgroup of Z/3) and that
        the order-2 endomorphism preserves both Sylow parts. Failure voids
        the general argument until localised.
    observation_collision:
      observable: >-
        Stage 0: per-builder restricted yes/no with code pointer.
        Stage 1: yield ratio (unrestricted / restricted) on toy cofactor-4.
      distinct_preimage_search: >-
        Deliberate restriction (documented double-counting / convenience)
        vs accidental restriction — Stage 0 MUST record the REASON if
        documented. Also: cyclic Z/4 vs Z/2×Z/2 Sylow-2 geometry (HEUR-H1)
        predicted NOT to change the yield ratio beyond |S|=4.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Membership over the FULL curve; defer C-reduction to verification.
          Encoding unchanged. Predicted gain ≤~2× candidates IF H_unspent;
          zero if H_spent.
        predicted_gain: >-
          At most ~2 bits of pool size; zero exponent; zero per-attempt
          solve-cost change.
    quantifier_order: >-
      Part A: FORALL finite abelian G with |G|=4ℓ, ℓ odd prime, FORALL
      endomorphisms φ: φ preserves Sylow parts AND every subgroup decomposes.
      Part B: EXISTS a builder whose candidate generation restricts to one
      cofactor coset — existential, empirical, Stage 0 decides; NOT asserted
      either way by this hypothesis a priori (prediction leans H_spent).
    method_ceiling:
      strongest_certifiable_claim: >-
        For any curve with order h·ℓ and gcd(h,ℓ)=1, the only lossy
        full-translation quotient surviving is the standard ℓ-reduction;
        plus a Stage-0 table of H_spent/H_unspent for named builders; plus
        (if H_unspent) a toy yield ratio in [1,4] with null ratio exactly 1.
        Cannot certify anything about coordinate-dependent non-homomorphism
        objects beyond the measured table.
      nearby_object_control: >-
        Cofactor-1 (h=1) toy of matched field size: yield ratio MUST be
        exactly 1; deviation is instrument defect. Z/12 symbolic check for
        part (A).
    proof_obligations:
      - claim: gcd(4,ℓ)=1 given ℓ a 129-bit prime.
        responsibility: correctness
      - claim: Finite abelian groups of coprime order n1·n2 are internal direct products of Sylow subgroups.
        responsibility: correctness
      - claim: Any endomorphism of G=S×C (coprime) maps S→S and C→C.
        responsibility: correctness
      - claim: Every subgroup H of S×C satisfies H=(H∩S)×(H∩C).
        responsibility: correctness
      - claim: Builder restriction status is checked by reading implementations, not asserted.
        responsibility: scope
      - claim: Cofactor-1 null yield ratio equals exactly 1.
        responsibility: baseline
    not_applicable_reason: null

  asymptotic_claim:
    problem: >-
      ECDLP on ECC2K-130 (index-calculus reachability / cofactor seam,
      RQ-BINSTD-b6f698)
    prior_best: Pollard rho with Frobenius and negation, 2^60.9 (KN-LIT-096)
    time_exponent: >-
      not_applicable — part (A) is certificate closure; part (B) at best
      ≤4× pool-size constant factor (disclosed, not exponent-moving)
    memory_exponent: >-
      unchanged except at most proportional FB storage if H_unspent and
      relaxation adopted
    hidden_cofactor: none; group-theoretic argument is exact
    claim_kind: structural_closure_plus_constant_factor_open_question

  heuristic_assumptions:
    - id: HEUR-BINSTD-e3048d-H0
      formal_statement: >-
        NONE FOR PART (A). Sylow-coprimality and endomorphism preservation
        are unconditional finite-group algebra on the published order 4·ℓ.
      random_model_justification: >-
        Rigorous: fundamental theorem of finite abelian groups; endomorphisms
        preserve elements of order dividing |S| or |C|. No random model.
      supporting_results:
        - ref: KN-LIT-661e97
          provenance: internal
          claim: ECC2K-130 group order is 4·ℓ with ℓ a 129-bit prime.
        - ref: KN-LIT-096
          provenance: internal
          claim: Matched rho baseline 2^60.9 with Frobenius and negation.
      validation_experiment_ids:
        - EXP-BINSTD-ec8200
      falsification_condition: >-
        Z/12 (or any toy 4ℓ') subgroup enumeration disagrees with the
        claimed decomposition / endomorphism preservation.
    - id: HEUR-BINSTD-e3048d-H1
      formal_statement: >-
        (Null-object / Sylow-2 geometry.) A toy curve's internal Sylow-2
        structure (Z/4 vs Z/2×Z/2) does not affect the measured yield ratio
        beyond what |S|=4 already predicts.
      random_model_justification: >-
        Rigorous ingredient: part (A) uses only |S|. Heuristic half: curve-
        geometric realisation of S does not introduce an effect the abstract
        argument misses.
      supporting_results: []
      validation_experiment_ids:
        - EXP-BINSTD-ec8200
      falsification_condition: >-
        At fixed field size, yield-ratio distributions across both realisable
        Sylow-2 structures disagree beyond disclosed sampling error.

  structural_ingredients:
    - description: ECC2K-130 group order 4·ℓ with ℓ prime.
      citation: KN-LIT-661e97
      provenance: internal
      verified_by: coordinator (design session 2026-10-02; cited via idea)
      role: order / Sylow input
    - description: Matched rho baseline already performing C-reduction.
      citation: KN-LIT-096
      provenance: internal
      verified_by: coordinator (cited via IDEA-20260922-e3048d)
      role: baseline embedding
    - description: Prime-order rigidity theorem (model for composite-order Sylow analogue).
      citation: IDEA-20260806-c5d183
      provenance: internal
      verified_by: coordinator (cited via idea / docs/object-frame-ideation.md)
      role: analogue / boundary — does NOT apply directly to 4ℓ
    - description: Frobenius mechanism scoped to subfield curves (disjoint).
      citation: RQ-FROB-7d8dd4
      provenance: internal
      verified_by: coordinator (cited via idea)
      role: boundary — not re-litigated
    - description: RQ-BINSTD reachability / cofactor seam decision target.
      citation: ledger/questions/RQ-BINSTD-b6f698.yaml
      provenance: internal
      verified_by: coordinator (design session 2026-10-02)
      role: decision target / population

  reduction_chain:
    core_problem: >-
      Certificate that full-translation cofactor quotients add nothing beyond
      standard ℓ-reduction on ECC2K-130, plus an empirical H_spent/H_unspent
      table for existing F2 builders.
    corollaries:
      - problem: >-
          Reachability-table "cofactor spent on decomposition" column for
          RQ-BINSTD-b6f698 on ECC2K-130.
        reduction_ref: IDEA-20260922-e3048d first_deliverable
        asymptotics_preserved: >-
          n/a for certificate; part (B) at most constant-factor pool size.

  predictions:
    - metric: sylow_reproduction_z12
      direction: exact
      minimum_effect: >-
        Exact agreement of enumerated subgroups and endomorphism preservation
        on Z/12 (or any toy 4ℓ')
    - metric: builder_restriction_status
      direction: different
      minimum_effect: >-
        Binary yes/no per builder with code pointer; prediction leans
        H_spent (no restriction); H_unspent is the surprising valuable case
    - metric: toy_yield_ratio_cofactor4
      direction: higher
      minimum_effect: >-
        IF Stage 0 finds H_unspent: ratio in [1,4], predicted near 2;
        ELSE Stage 1-2 not required for primary closure
    - metric: toy_yield_ratio_cofactor1_null
      direction: exact
      minimum_effect: 'EXACTLY 1.000; any deviation is instrument defect'

  test_boundary:
    instances:
      - certificate_arm: 'ECC2K-130 order 4·ℓ Sylow facts + Z/12 reproduction'
      - stage0_code_read: 'SEMBIN / DREG / QSP (and related F2) candidate-generation paths'
      - toy_cofactor4_arm: 'toy Koblitz n prime ≤41, cofactor 4, S×C verified by order factorisation'
      - null_cofactor1: 'matched field-size cofactor-1 toy — ratio must be 1'
      - optional_sylow2_split: 'Z/4 vs Z/2×Z/2 if both constructible at chosen n'
    parameters:
      ecc2k130_n: 131
      cofactor_h: 4
      toy_n_max: 41
      min_targets_if_stage1: 50
      predicted_ratio_band: [1, 4]
      predicted_ratio_typical: 2
      stdlib_preferred: true
    implementation: >-
      experiments/EXP-BINSTD-ec8200/implementation/ (stdlib + existing
      analysis/qsp-ecc2k130 and SEMBIN/DREG builder paths as read-only
      inputs; no Magma/Sage/cypari2 as success path).
    budget:
      maximum_runs: 20
      total_cpu_hours_advisory: 2
      wall_clock_seconds_advisory: 7200

  falsification_conditions:
    - Z/12 Sylow reproduction fails → part (A) withdrawn until localised.
    - Stage 0 finds H_unspent AND Stage-1 yield ratio not in [1,4] → localise
      before any further claim.
    - Cofactor-1 null yield ratio ≠ 1 → instrument defect, not a finding.
    - Claiming exponent move / break / deployed attack from this contract.

  interpretation_limits:
    - >-
      Part (A) closes ONLY the group-homomorphism / full-translation reading
      of cofactor spending; it does not settle coordinate-dependent pool
      restrictions (part B).
    - >-
      At best a CONSTANT FACTOR (≤4×, likely ≤2×) on raw candidate-pool size;
      explicitly not target-class under docs/target-result-profile.md alone.
    - >-
      No attack, no curve solved, no relation to any deployed key beyond
      structural accounting on ECC2K-130's published order.
    - >-
      Timeouts/crashes/budget aborts are failed_infrastructure (AGENTS.md
      rule 5), never refutation of (A) or (B).
    - >-
      A deliberate, already-priced restriction is not the same finding as an
      accidental one — Stage 0 must record reason when documented.

  distinguishable_outcomes:
    - id: O-CLOSED-SPENT
      meaning: >-
        Part (A) Z/12 check passes; Stage 0 finds H_spent on every audited
        builder → cofactor seam closed at certificate + engineering level;
        Stages 1-2 optional / skipped with recorded reason.
    - id: O-UNSPENT-LEVER
      meaning: >-
        Stage 0 finds H_unspent in ≥1 builder; Stage 1 yield ratio in [1,4]
        (predicted ~2); Stage 2 null ratio = 1 → constant-factor pool
        enlargement available; still not an exponent claim.
    - id: O-REFUTE-A
      meaning: Z/12 (or toy 4ℓ') Sylow reproduction fails.
    - id: O-REFUTE-B
      meaning: >-
        H_unspent found but yield ratio outside [1,4], or null ratio ≠ 1
        while treated as a finding.
    - id: O-INSTRUMENT
      meaning: >-
        Builder audit incomplete / ambiguous without declared stop; or null
        curve construction fails infra — do not read yield as math evidence.
    - id: O-IMPEDIMENT
      meaning: Budget/infra stop with measured quantity; never negative math evidence.

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
