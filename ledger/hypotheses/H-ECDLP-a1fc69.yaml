# H-ECDLP-a1fc69
# Stage-0 enumeration fraction for IDEA-20261009-f24f8a (SNFS-A3).
# SAT, Groebner, and exponent fits are not this hypothesis.
hypothesis:
  id: H-ECDLP-a1fc69
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  source_idea: IDEA-20261009-f24f8a
  added: '2026-10-12'
  status: specified
  statement: >-
    On y^2 = x^3 + x + 1, for m = 2 and beta = 1/2, the fraction of
    x-coordinates in F_p that are Semaev-S3 decompositions over the
    size factor base of bound floor(sqrt(p)) is within 0.25 of
    p^{m beta - 1} / 2!, which equals 1/2, at each of the primes
    101, 211, and 307.
  test_boundary: >-
    Enumeration of unordered pairs only. Three primes, one curve,
    m = 2, beta = 1/2. No SAT encoding, no Groebner basis, no
    exponent fit, and no prime above 307.
  mechanism: >-
    S3(x1, x2, x3) = 0 is the condition that points with those
    x-coordinates sum to infinity. The factor base is the
    x-coordinates below floor(sqrt(p)) that lie on the curve.
    The count of x3 in F_p with at least one factor-base pair is
    the decomposition fraction in IDEA-20261009-f24f8a.
  distinguishable_outcomes:
    - >-
      The planted sum has S3 = 0 at every prime, and every absolute
      error from 1/2 is at most 0.25.
    - >-
      The planted sum has S3 = 0 at every prime, and every absolute
      error from 1/2 is strictly above 0.25.
    - >-
      The planted sum does not have S3 = 0. That outcome invalidates
      the run.
  falsification: >-
    The planted identity holds at every prime and every absolute
    error is strictly above 0.25.
  not_claimed: >-
    No fitted exponent, no claim that enumeration beats brute force,
    and no statement about m = 3 or beta other than 1/2.
