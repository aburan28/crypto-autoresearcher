hypothesis:
  id: H-SSI-4a0c67
  question_id: RQ-SSI-1946c9
  idea_id: IDEA-20261004-a09dd4
  statement: >-
    At p in {59, 419, 659}, let S(p) be the supersingular j-invariants in
    F_{p^2} and O(p) the supersingular j-invariants in F_p. The identity map
    on S(p) has total-variation distance 0 to the uniform distribution on
    S(p) and pulls every element back to itself. On the 3-isogeny graph of
    O(p), every walk of length 0, 1, or 2 that starts at j = 1728 and keeps
    its kernel transcript returns to that start. Deleting the transcript
    leaves at least one such walk whose endpoint does not determine the
    start. |O(p)| is strictly smaller than |S(p)|. This is an exact
    bookkeeping statement for these sets. It is not a reduction and not a
    claim that no other bridge exists.
  mechanism: >-
    Enumerate S(p) and O(p). The identity compiler is the control. The
    structured walk is the 3-isogeny graph on O(p), started at j = 1728,
    with the sequence of kernels stored. Pullback follows that sequence
    backward. The negative control deletes the sequence and asks whether
    the endpoint j-invariant alone determines the start.
  assumptions:
    - >-
      p = 59, 419, and 659 are congruent to 3 mod 4, so y^2 = x^3 + x is
      supersingular over F_p and j = 1728 lies in O(p).
    - >-
      Two curves are the same object when their j-invariants are equal.
      A kernel transcript is not part of the public j-invariant.
    - >-
      The walk lengths are only 0, 1, and 2. No mixing-time claim is made
      for longer walks or larger primes.
  proof_search_map:
    bottleneck: >-
      Keeping a witness pullback after the public state is reduced to a
      j-invariant in O(p), while the challenge set is all of S(p).
    baseline_embedding:
      parameter_slice: >-
        Identity map on S(p), and the 3-isogeny graph of O(p) at walk
        lengths 0, 1, and 2, for p in {59, 419, 659}.
      reproduction_check: >-
        The identity map has total-variation distance 0 and zero pullback
        failures. Every transcribed walk reverses to j = 1728.
    observation_collision:
      observable: >-
        The endpoint j-invariant, the kernel transcript, and whether the
        start is a function of the endpoint alone.
      distinct_preimage_search: >-
        Search the length-1 and length-2 walks from j = 1728 for two
        transcripts with the same endpoint.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fiber of kernel transcripts over one endpoint j-invariant.
        predicted_gain: >-
          A fiber of size at least 2 shows the endpoint alone does not
          pull the walk back.
    quantifier_order: >-
      For each prime, quantify over walk lengths 0, 1, and 2 and over
      every 3-isogeny walk from j = 1728. One endpoint with two
      transcripts refutes pullback from the j-invariant alone.
    method_ceiling:
      strongest_certifiable_claim: >-
        Exact support sizes, identity-compiler distance, and pullback
        counts on these three primes and these walk lengths.
      nearby_object_control: >-
        The same walks with the transcript kept must pull back. Deleting
        only the transcript is the negative control.
    proof_obligations:
      - claim: the identity map has total-variation distance 0 on S(p)
        responsibility: correctness
      - claim: every transcribed walk reverses to the start
        responsibility: correctness
      - claim: some endpoint does not determine the start
        responsibility: interface
      - claim: the counts are only for these three primes
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        The length-2 distribution on O(p) is not claimed to equal the
        stationary distribution. The only mixing statement is the exact
        total-variation distance that the run records for lengths 0, 1,
        and 2.
      random_model_justification: >-
        These graphs are finite and fully enumerated. No random model of
        a larger supersingular graph is used.
      supporting_results: []
      validation_experiment_ids:
        - EXP-SSI-c9d464
      falsification_condition: >-
        The run reports a total-variation distance for a walk it did not
        enumerate, or it treats a toy distance as a large-prime mixing time.
  structural_ingredients:
    - description: >-
        Structured isogeny key generation stays on an oriented or level
        locus. This hypothesis measures that locus against the full
        supersingular set at toy size and does not instantiate SÉTA or
        LIT-SiGamal.
      citation: IDEA-20261004-a09dd4
      provenance: internal
      verified_by: >-
        idea-generator session on 2026-10-04, citation block of
        IDEA-20261004-a09dd4, which records ePrint 2019/1291 and ePrint
        2024/521 as retrieved
      role: structured-locus comparison
  reduction_chain:
    core_problem: >-
      Whether a j-invariant in O(p), without a kernel transcript, pulls a
      length-at-most-2 walk back to j = 1728, and whether O(p) equals S(p).
    corollaries: []
  predictions:
    - metric: identity_total_variation
      direction: lower
      minimum_effect: exactly 0 on every prime
    - metric: transcribed_pullback_failures
      direction: lower
      minimum_effect: exactly 0 on every prime
    - metric: deleted_transcript_ambiguous_endpoints
      direction: higher
      minimum_effect: at least 1 on every prime
    - metric: support_gap
      direction: higher
      minimum_effect: "the size of S(p) exceeds the size of O(p) by at least 1 on every prime"
  test_boundary:
    instances:
      - supersingular j-invariants at p in {59, 419, 659}
    parameters:
      walk_lengths: [0, 1, 2]
      degree: 3
      start_j: 1728
    implementation: >-
      An exact j-invariant enumerator written for this experiment. No
      cryptographic-size walk and no PKE implementation.
    budget:
      enforcement: advisory
      wall_clock_seconds_per_run: null
      maximum_memory_gb: 4
      maximum_runs: 1
  falsification_conditions:
    - >-
      On any prime, some transcribed walk does not reverse to j = 1728.
      That invalidates the harness.
    - >-
      On any prime, every deleted-transcript endpoint determines the start,
      or |O(p)| = |S(p)|. That cell does not show the stated gap.
  interpretation_limits:
    - A support gap at these primes does not rule out every black-box reduction.
    - No mixing time, security statement, or compiler for a published PKE is claimed.
    - This hypothesis does not replace the C-star symbolic-interface task.
  status: specified
  proposed_by: coordinator
