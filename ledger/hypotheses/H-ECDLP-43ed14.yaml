    bottleneck: The gap between bit length 5 and addition count 3.
    baseline_embedding:
      parameter_slice: >-
        The counts 5, 4, and 3 in IDEA-20261003-71faf8, read
        2026-10-04. The gaps, the product, and the sum were
        recomputed in this design session. That computation is
        not a run.
      reproduction_check: >-
        One route reads the bits of 23. The other counts the
        doublings and additions. They must agree that the counts
        are 5, 4, and 3.
    observation_collision:
      observable: The addition count 3 and the product 60.
      distinct_preimage_search: >-
        Reporting the addition count as 4 drops the gap against
        the doubling count. Two readings of the addition count
        make that gap 0.
    constructive_transforms:
