  title: >-
    The integer 23 has 4 doublings and 3 additions
  statement: >-
    The integer 23 has bit length 5. Its bits are 1, 0, 1, 1, and 1.
    Reaching it by doubling and adding uses 4 doublings and 3
    additions. Five exceeds four by 1. Four exceeds three by 1. Five
    exceeds three by 2. The product of 5, 4, and 3 is 60. Their sum
    is 12. Two readings of the addition count are both 3, so that
    gap is 0 and their product is 9.
  mechanism: >-
    The proposal writes the counts 5, 4, and 3. This contract
    checks those integers. It does not add a curve point.
