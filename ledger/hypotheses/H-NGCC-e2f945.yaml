hypothesis:
  id: H-NGCC-e2f945
  question_id: RQ-NGCC-f52138
  idea_id: IDEA-20261002-00199c
  statement: >-
    On the official NGCC round-1 BiT submission (sign-02), at least one
    declared parameter set has a generic security bound, given by its seed
    length or by half its unsalted digest length, strictly below the
    classical level that set claims.
  mechanism: >-
    The bound is read off lengths, not produced by an attack. If the whole
    key is expanded from an s-bit seed, exhaustive search of that seed costs
    2^s. If the signer signs an unsalted d-bit digest, a collision on that
    digest costs about 2^(d/2). The applicable bound is the minimum of those
    quantities that the parameter set actually uses. Finding sign-02-2 is
    not part of this statement.
  assumptions:
    - The official specification states a classical security level, a seed length, and the digest length used at signing for each parameter set.
    - A length that the specification does not use as the entropy of the key, or as the signed digest, is not entered into the minimum.
  proof_search_map:
    not_applicable_reason: >-
      This hypothesis is a length audit of a published parameter claim. It
      asserts no new theorem or attack.
    bottleneck: null
    baseline_embedding:
      parameter_slice: null
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms: []
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations: []
  predictions:
    - metric: parameter_sets_with_generic_bound_below_claim
      direction: higher
      minimum_effect: at least one declared parameter set
  test_boundary:
    instances:
      - sign-02 BiT, official round-1 zip named in inputs/ngcc-round1-20260920/candidates.yaml
    parameters:
      parameter_sets: every set the official package declares
    implementation: >-
      Lengths are read from the specification and from the reference C
      sources. Nothing shipped as a binary, object file, or submission
      build script is executed.
    budget:
      enforcement: advisory
      wall_clock_seconds_per_run: null
      maximum_memory_gb: 2
  falsification_conditions:
    - >-
      For every declared parameter set, the applicable generic bound is at
      least the claimed classical level, and the specification and the
      reference source agree on the three lengths.
  interpretation_limits:
    - A shortfall is a cap on the generic bound. It is not a demonstrated key recovery or forgery.
    - A set whose specification and source disagree is inconclusive for this hypothesis, not a shortfall and not a clearance.
    - Finding sign-02-2 remains untested.
  status: specified
  proposed_by: coordinator
