  status_note: >-
    Successor to H-MONO-39b1f0, which resolved to
    `null_control_confirmed_by_reused_evidence_main_partial_locus_claim_remains_untested_reviewer_caught_full_locus_conflation_corrected_successor_construction_named_not_yet_designed`.
    That record's own `review_findings_2026_09_05` field and
    DEC-20260905-7c2ad9's own `next_action` field both name the corrected
    construction this record now designs an experiment for (the
    Validator's "third reading"). H-MONO-39b1f0 is NOT superseded or
    retracted by this record: it remains the durable record of the
    full-locus null-control confirmation (already decided, reused here by
