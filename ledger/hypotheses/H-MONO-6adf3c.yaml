  mechanism: >-
    Carried from IDEA-20260807-5126f4's own `mechanism` field, unchanged
    in substance: a C_2^{m-2} Galois group means the degree-2^{m-2}
    root-finding problem for the free summation coordinate decomposes as
    a tower of m-2 quadratic extensions; on the partial locus, deciding
    whether a root lies in the factor base may reduce to m-2
    quadratic-character (Legendre symbol) tests instead of a
    degree-2^{m-2} root-find.

    THIS RECORD STATES THE CORRECTED, PRECISE CONSTRUCTION OF "THE
    PARTIAL LOCUS" THAT MAKES THE ABOVE PARAGRAPH TESTABLE, per
    H-MONO-39b1f0's own `review_findings_2026_09_05` (Validator's "third
    reading") and DEC-20260905-7c2ad9's own `next_action`:

    Let S_m(x_1,...,x_{m-2},x_free,T) be the m-th Semaev summation
    polynomial (`harness/semaev.py`'s `s4_expr`/an m=5 extension built by
    one further resultant elimination, per EXP-MONO-805a02's own Stage 2
    precedent). Fix the m-2 factor-base coordinates x_1,...,x_{m-2} to
    CONCRETE on-curve x-values (as Stage 5 of EXP-MONO-805a02 already
    does). Hold the target T GENERIC/SYMBOLIC during the tower's
    construction -- i.e. do NOT substitute any numeric value for T before
    deriving the quadratic tower in x_free -- consistent with
    DEC-20260804-4f37d5's own generic Galois computation over
    F_p(x_2,...,x_{m-1},c), c transcendental. Of that record's own m-1
    total generic/transcendental base-field parameters (x_2,...,x_{m-1}
    and c), only the m-2 factor-base coordinates collapse to concrete F_p
    values under this construction; c (=T) remains transcendental through
    tower construction. This is DELIBERATELY DIFFERENT from H-MONO-39b1f0's
    own already-decided full-locus case, where T is ALSO pinned to a
    concrete on-curve value before the tower is built (Stage 5's literal
    construction), collapsing all m-1 of those parameters and making the
    C_2^{m-2} descent vacuous by KN-FIND-c41ea9's own unconditional
    complete-splitting theorem (m-1 of m total symmetric arguments
    on-curve). Under THIS record's construction only m-2 of m-1 collapse;
    T stays free, so the resulting discriminant/character chain is a
    genuine function of T rather than a fixed F_p element, and the tower
    is built ONCE, generically, then evaluated cheaply (m-2 Legendre
    symbol tests) against many concrete candidate targets at use time.
    EXP-MONO-7f39bf's own Stage 0 is the computational precondition gate
    that verifies this distinction actually holds for the chosen curves
    and primes, before any false-positive-rate or cost number is trusted.

    A concrete worked derivation for m=4 (informing, not replacing,
    EXP-MONO-7f39bf's own Stage 0): with x_1=P1, x_2=P2 concrete,
    s4_expr(a,b) is built by resultant elimination of an auxiliary
    variable `t` from S3(x_1,x_2,t) and S3(x_free,T,t)
    (`harness/semaev.py` lines 52-59). Substituting P1,P2 (but not T)
    makes S3(P1,P2,t)=0 a CONCRETE quadratic in t alone, with two
    concrete roots t_+ = x(P1+P2), t_- = x(P1-P2) obtainable by ONE
    elliptic-curve addition/negation each (`harness/toycurve.py`) -- no
    character test is needed for this branch choice, both branches are
    directly computable. For EACH branch, S3(x_free,T,t_branch)=0 is then
    a quadratic in x_free with coefficients polynomial in T; its
    discriminant disc_branch(T) is a polynomial in T whose quadratic
    character chi(disc_branch(T)), evaluated at a concrete candidate T,
    decides whether that branch contributes any root in F_p at all
    (chi=-1: no root via that branch, ruling it out with zero
    root-finding). Two branches, one Legendre test each, gives exactly
    m-2=2 quadratic-character tests at m=4, matching the idea's own
    mechanism count. EXP-MONO-7f39bf's Stage 0 verifies this derivation
    computationally rather than assuming it, and reports the actual count
    of genuinely T-dependent (non-collapsed) character levels found,
    flagging any mismatch with the "m-2 tests" count as a first-class
    structural finding, not a silently reconciled detail.

  statement: >-
    SCOPE: prime fields F_p, p in {211, 431, 1009}; m in {4,5}; the curve
    A=37, B=57 at p=211 (KN-FIND-c41ea9's committed curve, reused from
    EXP-MONO-805a02) and A=17, B=19 at p=1009 (EXP-MONO-805a02's own
    SECOND_A/SECOND_B); claim tier toy. IDEA-20260807-5126f4's
    claim/mechanism/predictions/falsification_conditions are carried
    forward UNCHANGED except for the corrected locus construction stated
    above.

    THIS RECORD'S OWN CLAIM: at the corrected partial locus (m-2
    factor-base coordinates concrete, T held generic during tower
    construction, specialized only at evaluation against concrete
    candidate targets), the C_2^{m-2} character-tower filter achieves a
    false-positive rate substantially below 1 -- below 1/2 at m=4, per the
    idea's own bar -- when deciding whether a candidate target's
    summation fibre contains a genuine factor-base root, AND the
    resolvent route's field-operation count (including tower
    construction, charged separately) is below the enumerate-and-test
    baseline (D_trial(E) = m-1 group additions + O(1) lookup, per
    IDEA-20260806-9d47e2 / EXP-MONO-805a02's own preregistered and
    measured identity) at m=4 and m=5, reproduced at three primes.

    WHAT THIS RECORD DOES NOT RE-DECIDE: H-MONO-39b1f0's own confirmed
    full-locus null control (falsification condition (c), below) is
    cited, not re-tested. This record is the corrected, previously
    undesigned test of the idea's actual partial-locus claim.

  predictions:
    - metric: false-positive rate of the m-2 character filter on the corrected partial locus
      direction: lower
      minimum_effect: >-
        Below 1/2 at m = 4, i.e. the filter removes at least half the
        candidate targets before any root-find, matching
        IDEA-20260807-5126f4's own stated bar verbatim.
    - metric: field operations per membership decision, resolvent versus enumerate-and-test
      direction: lower
      minimum_effect: >-
        A ratio below 1 at m = 4 and 5, reproduced at three primes (211,
        431, 1009), matching IDEA-20260807-5126f4's own stated bar
        verbatim. Baseline: D_trial(E) = m-1 group additions + O(1)
        lookup (IDEA-20260806-9d47e2; EXP-MONO-805a02's own
        preregistered_prediction and STAGE3-OPERATION-COUNT measurement).

  falsification_conditions:
    - >-
      (a, from IDEA-20260807-5126f4, OPEN, tested by EXP-MONO-7f39bf
      Stage 1) "Filter false-positive rate is ~1 on the partial locus
      too." Untested by any prior record under the CORRECTED
      construction stated above (H-MONO-39b1f0's Stage-5-reused
      confirmation is of the full locus, a different construction).
    - >-
      (b, from IDEA-20260807-5126f4, OPEN, tested by EXP-MONO-7f39bf
      Stage 2) "Resolvent field-operation count is at or above
      enumerate-and-test at every m." Untested by any prior record.
    - >-
      (c, from IDEA-20260807-5126f4, ALREADY CONFIRMED, cited not
      re-tested) "Full-locus vacuity check does not fire." CONFIRMED to
      fire correctly by H-MONO-39b1f0 / EXP-MONO-805a02 Stage 5 /
      EV-MONO-08a31f, at the FULL locus (a different, already-decided
      construction). EXP-MONO-7f39bf's own Stage 0 gate is a DIFFERENT
      check -- that the corrected partial-locus construction itself is
      not degenerate (its discriminant chain is genuinely T-dependent) --
      and must not be conflated with this already-settled condition.

  heuristic_assumptions:
    - id: HEUR-MONOIMP-1
      statement: >-
        The false-positive rate measured at m = 4, 5 on toy primes {211,
        431, 1009} is indicative at larger m and p. (Carried verbatim
        from IDEA-20260807-5126f4.)
      rigorous_support: >-
        None. The rate is in principle computable from the tower's
        structure (the density of T-values for which chi(disc_branch(T))
        = +1, a quadratic-character sum) and should be derived alongside
        the measurement per the idea's own `validation_plan`.
      random_model_justification: >-
        Not formally stated by the idea; if the disc_branch(T) values
        behave like independent uniform quadratic residues as T ranges
        over F_p (a standard character-sum heuristic, unverified here),
        the predicted false-positive rate follows a computable binomial
        law. EXP-MONO-7f39bf does not assume this; it measures directly
        and compares against the closed-form prediction as a named tail
        check.
      supporting_results: []
      validation_experiment_ids: [EXP-MONO-7f39bf]
      falsification_condition: >-
        Measured false-positive rate mismatches the closed-form
        chi-density prediction outside sampling error at any tested (m,p)
        cell -- a mismatch is itself a result (per the idea's own
        `validation_plan`: "a mismatch is a result"), not a defect to
        smooth over.

