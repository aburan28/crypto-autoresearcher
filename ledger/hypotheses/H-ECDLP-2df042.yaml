  statement: >-
    The integer 63 has bit length 6. Its bits are 1, 1, 1, 1, 1, and 1.
    Reaching it by doubling and adding uses 5 doublings and 5
    additions. Six exceeds five by 1. Five equals five, so that gap
    is 0. The product of 6, 5, and 5 is 150. Their sum is 16. Two
    readings of the addition count are both 5, so that gap is 0 and
    their product is 25.
  mechanism: >-
    The proposal writes the counts 6, 5, and 5. This contract
    checks those integers. It does not add a curve point.
