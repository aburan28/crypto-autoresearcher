        2026-10-04. The gaps, the product, and the sum were
        recomputed in this design session. That computation is
        not a run.
      reproduction_check: >-
        One route reads the bits of 63. The other counts the
        doublings and additions. They must agree that the counts
        are 6, 5, and 5.
    observation_collision:
      observable: The addition count 5 and the product 150.
      distinct_preimage_search: >-
        Reporting the addition count as 6 drops the gap against
        the bit length. Two readings of the addition count make
        that gap 0.
    constructive_transforms:
