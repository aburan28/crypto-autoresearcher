hypothesis:
  id: H-QRUOV-e8ae3e
  question_id: RQ-QRUOV-001
  goal_id: GOAL-QRUOV-001
  source_idea: IDEA-20260805-bd8339

  statement: >-
    SCOPE: QR-UOV-shaped keys over A = F_q[t]/(f) as defined in the mechanism
    below, at q in {7, 11}, ell <= 6, M in {2, 3}, V - M in {1, 2}, one solver
    lineage, exact F_q arithmetic. CLAIM TIER toy. NO STATEMENT ABOUT ANY
    DEPLOYED QR-UOV PARAMETER SET IS MADE OR MAY BE DERIVED.
    The claim is in three parts, and they are deliberately separable so that a
    failure of the third does not retract the first two.
    (P1, UNCONDITIONAL ALGEBRA) For every monic f of degree ell over every F_q,
    the Hankel matrix W with W_{ij} = coeff_{ell-1}(t^{i+j} mod f) is invertible,
    W*phi(a) is symmetric for every a in A, and
    rank_{F_q}(W*phi(a)) = ell - deg gcd(a, f). Consequently the QR-UOV
    compression is well defined for EVERY f -- squarefree or not, irreducible or
    not -- and the rank spectrum of the block algebra is a closed-form function of
    f's factorization type alone.
    (P2, UNCONDITIONAL ALGEBRA) If f = prod_i p_i^{e_i} with distinct irreducible
    p_i, the CRT idempotents of A -- computable from the PUBLIC parameter f in
    O~(ell^2) F_q-operations -- give a basis change C such that C^{(+)N}
    simultaneously block-diagonalises every public matrix into one block per
    factor f_i = p_i^{e_i}, with the blocks mutually orthogonal for the pairing;
    and the secret oil A-module splits accordingly as O = (+)_i e_i O with
    e_i O free of A_i-rank M.
    (P3, THE COST CLAIM, CONDITIONAL) Therefore the best structure-aware
    key-recovery exponent falls from ell*(V - M) to d*(V - M) in log_q units,
    where d = max_i deg f_i in the conservative reading and
    d = max_i deg p_i if the radical-lifting step of HEUR-QRUOV-FT-2 is cheap.
    Both readings are pre-registered; the experiment reports which holds.
    THE DELIVERABLE IF P3 FAILS IS NOT NOTHING: P1 and P2 plus the exact density
    1 - I_q(ell)/q^ell of reducible f, and the exact distribution of d under
    uniform f, together discharge the "measured weak-quotient-polynomial density
    bound" that GOAL-QRUOV-001's first completion criterion names, and they do so
    in closed form rather than by measurement.

  mechanism: >-
    THE SHAPE, AND WHAT IS RECALLED. A = F_q[t]/(f), phi the regular
    representation, N = V + M, n = N*ell, m = M*ell. Public matrices are n x n
    symmetric over F_q partitioned into N x N blocks of size ell, each block in
    A_f = {W*phi(a) : a in A} for one fixed invertible W; the secret oil space O
    is an A-submodule of A^N of A-rank M. THIS SHAPE IS RECALLED AND UNVERIFIED.
    No QR-UOV document has been read by this program; RQ-QRUOV-001 records the
    same. Stage 0 of EXP-QRUOV-5b9038 pins it down and may terminate the line.
    Everything below is a theorem about the shape as stated and transfers to the
    submitted scheme only as far as stage 0 confirms it.

    P1, DERIVED. Let B(x, y) = coeff_{ell-1}(x*y mod f). B is F_q-bilinear,
    symmetric, and associative -- B(a*x, y) = B(x, a*y) -- because it is a
    function of the product alone. B is nondegenerate for EVERY monic f: given
    x != 0 of degree d < ell, take y = t^{ell-1-d}; then x*y has degree exactly
    ell-1, needs no reduction, and its t^{ell-1} coefficient is the leading
    coefficient of x, which is nonzero. Hence its Gram matrix W (Hankel,
    W_{ij} = coeff_{ell-1}(t^{i+j} mod f)) is invertible, and W*phi(a), being the
    Gram matrix of (x, y) -> B(a*x, y), is symmetric by symmetry plus
    associativity. Structurally this is not luck: A = F_q[t]/(f) is a complete
    intersection, hence Gorenstein, hence a Frobenius algebra, so a nondegenerate
    associative form exists for every f. WELL-DEFINEDNESS OF THE COMPRESSION
    THEREFORE SELECTS NOTHING, and any protection against a weak f must be an
    explicitly enforced test in key generation.
    Rank law: W invertible gives rank(W*phi(a)) = rank(phi(a)); and
    ker phi(a) = Ann_A(a) = (f/g)A with g = gcd(a, f), of F_q-dimension deg g.
    Counting corollary, exact: #{a : gcd(a, f) = g} = |(A/(f/g))^x| for each monic
    g | f, summing to q^ell. For irreducible f the spectrum of A_f is {0, ell}
    only -- no low-rank elements exist at all; for f with an irreducible factor of
    degree d, A_f contains nonzero matrices of rank exactly d, publicly and
    without search.

    P2, DERIVED. Write f = prod_i f_i, f_i = p_i^{e_i}, ell_i = deg f_i. One
    extended-Euclid pass on f yields the central idempotents; centrality means the
    adapted basis change C block-diagonalises every phi(a) SIMULTANEOUSLY. The
    pairing is orthogonal across components because
    B(e_i x, e_j y) = coeff_{ell-1}(e_i e_j x y mod f) = 0 for i != j, so C^T W C
    is block-diagonal too, and hence so is C^T (W phi(a)) C for every a. Applying
    C blockwise carries every public matrix to a direct sum of matrices of the SAME
    QR-UOV shape with ell replaced by ell_i and (V, M) unchanged, each summand
    carrying a nondegenerate associative pairing of its own. Since O is an
    A-module, O = (+)_i e_i O and isotropy transfers componentwise. All of this is
    available to the attacker from the public parameter f, before any key is seen.

    P3, COST BOOKKEEPING (per-attempt cost x inverse success probability). For a
    squarefree component A_i = F_{q^{ell_i}}, the component is UOV over that field
    with N variables and oil dimension M. Under HEUR-QRUOV-FT-1 its key-recovery
    cost is (q^{ell_i})^{N - 2M} * poly = q^{ell_i (V - M)} * poly. The components
    are independent, so the total is sum_i q^{ell_i (V-M)} * poly, dominated by the
    largest, giving exponent max_i ell_i * (V - M). For a repeated factor,
    reduction mod the radical is a further public linear map onto F_{q^{deg p_i}}
    and recovers the image of e_i O at exponent deg p_i (V - M); the lift back is
    HEUR-QRUOV-FT-2 and is NOT derived. Hence the two pre-registered readings.

    THE FORCED VALUES, COMPUTED BEFORE ANY RUN, NONE FITTED. I_q(ell) =
    (1/ell) sum_{d | ell} mu(d) q^{ell/d}. Non-weak (irreducible) density
    I_q(ell)/q^ell: 0.33331 at (q=127, ell=3); 0.24998 at (127, 4); 0.20000 at
    (127, 5); 0.16667 at (127, 6); 0.12500 at (127, 8). Weak density is the
    complement. Expected exponent factor E[max_i deg p_i]/ell under uniform monic
    f: 0.72090, 0.69740, 0.68485, 0.67381, 0.66202 at (q=127, ell = 3, 4, 5, 6, 8).
    Distribution of d at (q=127, ell=5): 0.0090 / 0.2077 / 0.3333 / 0.2500 /
    0.2000 for d = 1..5. These come from the exact generating function
    [z^ell] prod_{j<=d} (1 - z^j)^{-I_q(j)} in integer arithmetic and are
    reproducible to the last digit.

    PROVENANCE OF THE PRE-CHECKS. P1 and its rank law were verified by exhaustive
    pure-Python enumeration in the session that wrote this record, over q in
    {2, 3, 5} and ell in {2, 3, 4} with q^ell <= 700, ALL monic f and ALL a in A:
    414,582 (f, a) cells, zero failures of invertibility, zero of symmetry, zero of
    the rank law. P2 was verified at q=5, ell=4, f = (t^2+t+1)(t^2+2) over 200
    random a: exact block-diagonalisation, zero failures. THESE ARE
    GENERATION-SESSION COMPUTATIONS OUTSIDE THE HARNESS, WITH NO RUN RECORD, NO
    MANIFEST, NO SEED ARCHIVE, AND THEY ARE NOT EVIDENCE. Re-running them
    in-harness with receipts is stage 1 of EXP-QRUOV-5b9038.

  assumptions:
    - >-
      The QR-UOV key shape as stated. RECALLED, UNVERIFIED, and the single largest
      risk in this record. Stage 0 is a reading stage whose failure terminates the
      line rather than being worked around.
    - >-
      The environment. Verified in the generating session by direct import:
      numpy 2.4.6 IS present; sympy is NOT; Sage is NOT. Every stage of the paired
      experiment is therefore designed to run in pure Python integer and modular
      arithmetic with no computer-algebra dependency. If a stage is later found to
      need one, that is an infrastructure request, never an experiment, and never
      negative mathematical evidence (AGENTS.md rule 5).
    - >-
      The conservative reading of P3 (prime powers kept whole) is the DEFAULT.
      The sharper reading is used only if the repeated-factor arm validates
      HEUR-QRUOV-FT-2, and never by assumption.

  proof_search_map:
    bottleneck: >-
      The step at which the quotient-ring representation is claimed to cost
      nothing. GOAL-QRUOV-001 prices everything against the matched
      extension-field-UOV baseline q^{ell(V-M)}; that baseline is correct exactly
      when A is a field. The bottleneck is therefore the single hypothesis "A is a
      field", i.e. f irreducible -- one condition on one public parameter, on which
      the entire cost model silently rests. Removing or weakening it is what this
      hypothesis does, and nothing downstream of it in the goal survives unchanged.
    baseline_embedding:
      parameter_slice: >-
        f IRREDUCIBLE, any (q, V, M, ell). Then k = 1, d = ell, and P3 returns
        exponent ell*(V - M) -- EXACTLY the matched extension-field-UOV baseline,
        with no residual term and no approximation. This is not a curve that
        resembles the baseline; it is the same closed form, recovered as the k = 1
        case of the general one.
      reproduction_check: >-
        SYMBOLIC, and it also runs as a frozen fixture: at f irreducible the
        extended-Euclid idempotent computation must return exactly one idempotent
        and the block-diagonalisation must return exactly one block of size ell.
        Both are exact integer/structural checks with no tolerance. The measured
        arm additionally must report exponent ratio 1.000 against a plain-UOV
        instance at the same F_q shape.
    observation_collision:
      observable: >-
        The factorization type of f, i.e. the multiset {(deg p_i, e_i)}, together
        with the derived integer d and the induced idempotent decomposition.
      distinct_preimage_search: >-
        RUN, AND IT SUCCEEDS -- which is why the hypothesis needs the extra
        condition it carries. Distinct ground-truth objects sharing the observable
        exist in abundance: every one of the q^ell choices of a key at a fixed f
        has the same factorization type, and (sharper) two DIFFERENT f of the same
        type -- e.g. at ell = 6 the types (3,3) and (3,2,1) both give d = 3 --
        share the predicted exponent while differing in component count. The
        collision is therefore real and is handled rather than hidden: the
        hypothesis does NOT claim the observable determines the key, only that it
        determines the exponent, and the (3,3)-versus-(3,2,1) pair is promoted into
        the graded control precisely as the discriminator between "d governs" and
        "component count governs". A measured separation between those two rungs
        would falsify the stated law and identify the true one.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the instance from F_q^n with a block constraint into A^N with A
          decomposed by its central idempotents, where "the oil space is an
          A-module" becomes an exact direct-sum decomposition rather than an
          approximate structure. Encoding: the basis change C, public and exact.
          Completeness: every public matrix maps into the block-diagonal form
          (P2). Soundness: the pairing is orthogonal across components, so no
          cross-component condition is lost. Transfer: isotropy is componentwise.
          Cost loss: O~(ell^2) for the idempotents plus O(n^2) for the change of
          basis, both negligible against q^{d(V-M)}.
        predicted_gain: >-
          The exponent ell*(V - M) is replaced by max_i ell_i * (V - M). Gain
          factor ell/d, which is 1 when f is irreducible (no gain, stated) and ell
          when f splits completely.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (factorization type) fixed and vary the forgotten
          structure -- the key, and the specific f of that type. If the measured
          exponent varies within a fibre, the type is not the governing invariant
          and an intrinsic finer invariant must be named.
        predicted_gain: >-
          None to an attacker; the gain is falsification power. A within-fibre
          spread comparable to the between-type spread would mean the hypothesis is
          fitting noise, and the experiment reports the within-fibre spread BEFORE
          the between-type ratios.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER: EXISTS one procedure -- extended Euclid on f, the
      induced basis change, component-wise recovery, CRT reassembly -- fixed and
      independent of the key, such that FORALL q, FORALL monic f of degree ell,
      FORALL keys of the stated shape at (q, V, M, ell), the procedure recovers O
      at cost q^{d(V-M)} * poly with d determined by f alone. The witness (the
      procedure) may depend on f, which is PUBLIC, and may NOT depend on the key,
      the oil module, or any seed. The weaker order -- FORALL keys EXISTS a
      procedure -- is not claimed and would be worthless. Note the trap being
      avoided: the corank of a specific block DOES depend on the key, so any claim
      phrased in terms of "there exist low-rank elements in the public key" would
      have the wrong quantifier order; the claim here is phrased in terms of the
      block ALGEBRA, which depends on f only, and that is exactly why it is
      admissible.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: a toy-tier, exactly-verified structural statement (P1, P2) valid
        at all parameters as algebra, plus a toy-scale MEASURED cost ratio (P3) at
        q <= 11, ell <= 6, one solver. It cannot certify any cost at a deployed
        QR-UOV parameter set, cannot establish that any deployed key is weak,
        cannot bound the best possible attack (only the one measured), and cannot
        by itself decide GOAL-QRUOV-001 -- it discharges one completion criterion's
        density clause and contributes one arm to the other.
      nearby_object_control: >-
        f IRREDUCIBLE at identical (q, V, M, ell), where the hoped-for conclusion
        is KNOWN FALSE by P2 itself: there is no split, and the exponent must not
        move. This is the closest object to the treatment -- same q, same shape,
        same code path, same solver, same seeds, differing only in one public
        polynomial -- and the method must fail there. A method that "finds a split"
        for irreducible f has not identified the load-bearing structure and every
        other arm is void. A second nearby object, sharper: f = p^e with p
        irreducible of degree ell/e, where CRT does NOT apply (A is local, one
        idempotent) but the radical filtration does; a method that cannot tell
        f = p^2 from f = p_1 p_2 with deg p_1 = deg p_2 is responding to the degree
        multiset rather than to the algebra.
    proof_obligations:
      - claim: >-
          W is invertible and W*phi(a) symmetric for every monic f and every a;
          rank(W*phi(a)) = ell - deg gcd(a, f).
        responsibility: correctness
      - claim: >-
          The idempotent basis change block-diagonalises every W*phi(a)
          simultaneously and the components are pairing-orthogonal.
        responsibility: correctness
      - claim: >-
          O is an A-submodule and therefore splits as (+)_i e_i O with each
          summand free of A_i-rank M.
        responsibility: interface
      - claim: >-
          Component key-recovery costs q^{ell_i(V-M)} * poly (HEUR-QRUOV-FT-1).
        responsibility: runtime
      - claim: >-
          The radical lift for e_i > 1 is polynomial (HEUR-QRUOV-FT-2). DECLARED
          UNMET; the conservative reading of P3 does not use it.
        responsibility: feasibility
      - claim: >-
          Every claimed recovery is certified: the recovered oil basis annihilates
          every public form, re-verified by an independent routine.
        responsibility: correctness
      - claim: >-
          Nothing here is a statement about a deployed parameter set, and every
          citation carries the toy boundary.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim:
    problem: >-
      Oil-space (secret-key) recovery for QR-UOV-shaped keys over
      A = F_q[t]/(f) at (q, V, M, ell).
    prior_best: >-
      q^{ell(V - M)} * poly(N, ell) -- the matched extension-field-UOV baseline,
      itself resting on the RECALLED, UNVERIFIED Kipnis-Shamir / reconciliation
      exponent |F|^{n' - 2m'} (HEUR-QRUOV-FT-1).
    time_exponent: >-
      d(f) * (V - M) in log_q units, with d(f) = max_i deg f_i conservatively and
      max_i deg p_i under HEUR-QRUOV-FT-2. Equals the prior best exactly when f is
      irreducible; is smaller by the factor d/ell otherwise, reaching 1/ell for
      totally split f.
    memory_exponent: >-
      Polynomial, unchanged from the baseline: the split adds O(n^2) F_q-elements
      for the basis change and O(ell^2) for the idempotents. The memory column is
      stated beside the time column here rather than omitted, per
      docs/claims-and-verification.md.
    hidden_cofactor: >-
      The per-component poly(N, ell) inherited from HEUR-QRUOV-FT-1, whose content
      is unknown to this program and is recorded as unknown; plus the unquantified
      radical-lift cost when e_i > 1.
    claim_kind: exponent_improvement

  heuristic_assumptions:
    - id: HEUR-QRUOV-FT-1
      formal_statement: >-
        FORALL finite fields F and FORALL (n', m') with n' >= 3m', UOV
        key-recovery over F with n' variables and m' equations costs
        |F|^{n' - 2m'} * poly(n', m') operations in F, with poly independent of
        |F|.
      random_model_justification: >-
        The usual argument is that a random n'-dimensional vector lies in the
        m'-dimensional oil space with probability |F|^{-(n'-m')} and that the
        Kipnis-Shamir bilinear structure recovers the space once n' - 2m'
        coordinates are guessed. THAT ARGUMENT IS RECALLED, NOT VERIFIED, AND NO
        SOURCE IS CITED. It is a candidate to check, never an authority.
      supporting_results: []
      validation_experiment_ids: [EXP-QRUOV-5b9038]
      falsification_condition: >-
        Measured on the irreducible arm across at least three values of ell:
        regress log_q(cost) on ell at fixed (V - M) and require slope
        (V - M) within the declared tolerance. If the slope differs, the recalled
        form is wrong at these sizes, the ratio interpretation of P3 is WITHDRAWN,
        and the measured numbers are reported as raw solver ratios only. P1 and P2
        are untouched by this failure.
    - id: HEUR-QRUOV-FT-2
      formal_statement: >-
        EXISTS a procedure running in time poly(N, ell, log q) such that FORALL
        local components A_i = F_q[t]/(p_i^{e_i}) with e_i > 1 and FORALL free
        A_i-submodules e_i O of rank M, given the image of e_i O in
        (A_i / rad A_i)^N the procedure outputs e_i O.
      random_model_justification: >-
        NONE. Plausible by analogy with Hensel lifting of a linear condition and
        DELIBERATELY NOT ASSERTED. This is the weakest link in the sharp reading of
        P3, and the conservative reading is written so as not to need it.
      supporting_results: []
      validation_experiment_ids: [EXP-QRUOV-5b9038]
      falsification_condition: >-
        The repeated-factor arm (f = p^e) measures exponent ratio deg(p)/ell if the
        lift is cheap and 1.000 if it is not. A measured 1.000 refutes
        HEUR-QRUOV-FT-2 at the tested sizes and leaves the squarefree claim intact.

  structural_ingredients:
    - description: >-
        F_q[t]/(f) is a complete intersection, hence Gorenstein, hence a Frobenius
        algebra, so a nondegenerate associative bilinear form exists for every f.
        Used to establish that the symmetriser W exists and is invertible for every
        f, so well-definedness of the compression excludes no quotient polynomial.
      citation: >-
        NO CITATION ASSERTED. The general statement is standard commutative
        algebra, but it is NOT retrieved here and is not cited. What is used is the
        EXPLICIT form, B(x, y) = coeff_{ell-1}(x*y mod f), whose nondegeneracy is
        proved from scratch in the mechanism in two lines and checked exhaustively
        at toy sizes. The record depends on the explicit proof, not on the
        general theorem.
      role: existence and invertibility of the symmetriser for every f
    - description: >-
        Chinese remainder decomposition of F_q[t]/(f) by central idempotents,
        computed by the extended Euclidean algorithm on the coprime factors of f.
      citation: >-
        Elementary and derived in this record; no external citation asserted.
        Verified computationally at q=5, ell=4 on a reducible f (200 random a,
        zero failures) in the generating session.
      role: the publicly computable simultaneous block-diagonalisation
    - description: >-
        Exact count of monic irreducibles I_q(ell) = (1/ell) sum_{d|ell} mu(d)
        q^{ell/d}, and the generating function [z^ell] prod_{j<=d}
        (1 - z^j)^{-I_q(j)} for the distribution of the largest irreducible-factor
        degree.
      citation: >-
        Classical (Gauss's formula and the standard function-field factorization
        generating function). NOT RETRIEVED AND NOT CITED TO A SOURCE. Both are
        recomputed from scratch in integer arithmetic and cross-checked against
        exhaustive enumeration at small q, so the record does not rest on the
        citation. The asymptotic Golomb-Dickman constant ~0.6243 is RECALLED,
        UNVERIFIED, is NOT used anywhere in a claim, and is mentioned only as an
        expected limit of the exact table.
      role: the closed-form weak-quotient-polynomial density

  reduction_chain:
    core_problem: >-
      Given a QR-UOV-shaped public key over A = F_q[t]/(f), recover the secret oil
      A-module at cost governed by f's factorization type.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. No reduction is claimed from this statement to any
      other scheme or to any deployed parameter set. In particular it says nothing
      about MAYO, SNOVA, plain UOV over a prime field, or any scheme whose keys do
      not carry a quotient-ring module structure, and it may not be cited toward
      any of them. Sibling area UOV (RQ-UOV-001) shares the plain-UOV attack model
      as a dependency; this record deliberately DERIVES no plain-UOV cost of its
      own and instead defers to the matched baseline built by H-QRUOV-677301, so
      that the two goals do not end up with two different cost conventions --
      which GOAL-QRUOV-001's next_action explicitly forbids.

  predictions:
    - metric: >-
        G1 -- fraction of monic f of degree ell over F_q with W invertible,
        exhaustive over q in {2, 3, 5}, ell in {2, 3, 4}
      direction: higher
      minimum_effect: >-
        EXACTLY 1.000, including non-squarefree f. Zero tolerance; a single
        singular W refutes P1.
    - metric: >-
        G2 -- count of (f, a) pairs violating
        rank(W*phi(a)) = ell - deg gcd(a, f), same exhaustive sweep
      direction: lower
      minimum_effect: >-
        EXACTLY 0. Zero tolerance.
    - metric: >-
        G3 -- maximum off-block entry of C^T (W phi(a)) C in the CRT-adapted
        basis, over all reducible f in the sweep, 200 random a each
      direction: lower
      minimum_effect: >-
        EXACTLY 0 in F_q. Zero tolerance; a nonzero residual refutes P2 and voids
        the cost claim.
    - metric: >-
        G4 -- number of idempotent blocks reported for f IRREDUCIBLE (the null arm)
      direction: different
      minimum_effect: >-
        EXACTLY 1. If the splitting code reports more than one block for an
        irreducible f it is manufacturing structure and every treatment number is
        void. THIS IS THE NULL AND IT CAN FAIL.
    - metric: >-
        G5 -- key-recovery success rate on the positive control, f totally split
        into ell distinct linear factors, at the declared toy cells
      direction: higher
      minimum_effect: >-
        At least 18 of 20 planted instances recovered, with a verified certificate
        each. IF THIS FAILS THE INSTRUMENT IS BROKEN AND NO NEGATIVE RESULT MAY BE
        REPORTED FROM ANY ARM.
    - metric: >-
        G6 -- measured exponent ratio log_q(cost_f) / log_q(cost_irreducible) at
        ell = 6, per factorization type
      direction: lower
      minimum_effect: >-
        The pre-registered ladder d/ell: (6) -> 1.000, (4,2) -> 0.667,
        (3,3) -> 0.500, (3,2,1) -> 0.500, (2,2,2) -> 0.333, (1^6) -> 0.167, each
        within a declared relative tolerance of 0.20, AND monotone non-increasing
        in d. A ladder flat at 1.000 falsifies P3 while leaving P1 and P2 intact.
    - metric: >-
        G7 -- within-fibre spread of the measured exponent at fixed factorization
        type across distinct f of that type and distinct keys, reported BEFORE any
        between-type ratio
      direction: lower
      minimum_effect: >-
        Strictly below the smallest between-type gap on the ladder (which is
        0.667 - 0.500 = 0.167 in ratio units). If the within-fibre spread is
        comparable to or larger than that gap, P3 is fitting noise and must be
        reported as such rather than as a law.
    - metric: >-
        G8 -- exact non-weak density I_q(ell)/q^ell and expected exponent factor
        E[d]/ell, recomputed by generating function and cross-checked by exhaustive
        enumeration at small q
      direction: different
      minimum_effect: >-
        Agreement to the last digit with the pre-registered table: non-weak density
        0.33331 / 0.24998 / 0.20000 / 0.16667 / 0.12500 and E[d]/ell 0.72090 /
        0.69740 / 0.68485 / 0.67381 / 0.66202 at q = 127, ell = 3/4/5/6/8. Two
        independent computation routes must agree exactly; disagreement is an
        arithmetic bug, not a finding.

  test_boundary:
    instances:
      - >-
        QR-UOV-shaped keys as defined in the mechanism, constructed in-harness;
        NOT keys generated by any QR-UOV reference implementation, which this
        program does not have.
      - >-
        Factorization types of f at ell = 6: (6), (4,2), (3,3), (3,2,1), (2,2,2),
