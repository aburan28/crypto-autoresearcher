  statement: >
    Fix one Boolean ring GF(2)[x]/(x^2-x)
    before any rank is read. Stage 0 asserts
    only the certificate-two instrument of
    IDEA-20260905-a6f98e on this family:
    (i) REAL has generators x and 1+x and
    Nullstellensatz degree D_NS is 1;
    (ii) KF, the SAT generator x, has no
    certificate at Dmax 3; (iii) NULL is
    the constant 1 and D_NS is 0; (iv) an
    empty variable list or a negative Dmax
    is rejected before D_NS is read as a
    census. This is not cadical, not LRAT,
    not the peel_and_rank engine of
    EXP-DREG-001, and not Stage 1.
    Neither reading is a decoder or an
    ECDLP advantage.
  mechanism: >
    D_NS is the least D at which the constant
    1 lies in the degree-D Macaulay row space
    over GF(2). Stage 0 evaluates that
    definition by exact rank on one frozen
    one-variable family: the planted unsat
    pair spans 1 at D=1, the sat monomial
    never spans 1, and the constant-1
    generator already spans 1 at D=0.
    This is a new RQ-ECDLP-002 object after
    Stage 0 of EXP-ECDLP-1aa0f8 held as
    P-S0-COUNT (DEC-20260908-ec5a0f). It is
    not Stage 1 of EXP-ECDLP-1aa0f8, not
    Stage 1 of EXP-ECDLP-79f8c4, not Stage 1
    of EXP-ECDLP-628891, not Stage 1 of
    EXP-ECDLP-9e9536, not Stage 1 of
    EXP-ECDLP-90f602, and not Stage 2 of
    EXP-ECDLP-4be480.
  predictions:
    - id: P-S0-DNS
      metric: well-defined exact D_NS on the frozen family
      direction: different
      minimum_effect: >
        After fixture_pass, REAL has D_NS
        equal to 1. KF has dns_found false
        at Dmax 3. NULL has D_NS equal to 0.
        Empty and negative-Dmax objects are
        rejected. One certified miss after
        fixture_pass is a scoped
        falsification of this instrument on
        the frozen family.
      claim_tier: observational
    - id: P-S1-LRAT
      metric: LRAT length versus leaf count
      direction: different
      minimum_effect: >
        Stage 1+, unauthorized here. Stage 0
        does not run cadical, does not emit
        LRAT, and does not claim a pdp encoder.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KFSAT
      statement: >
        After fixture_pass, KF reports a
        finite D_NS at Dmax 3. An encoding
        bug is failed_infrastructure.
    - id: F-S0-REALDNS
      statement: >
        After fixture_pass, REAL has D_NS
        other than 1. That falsifies only
        P-S0-DNS on this family.
    - id: F-S1-LRAT
      statement: >
        After an authorized later stage, a
        claimed LRAT length misses the leaf
        count. Unauthorized here.
