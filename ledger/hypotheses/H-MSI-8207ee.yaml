hypothesis:
  id: H-MSI-8207ee
  question_id: RQ-MSI-f760b2
  derived_from_idea: IDEA-20260811-4a55dd
  added: '2026-08-25'
  status: proposed
  proposed_by: coordinator
  title: >-
    Additivity forces a lattice: if the truncated l-adic period map is a homomorphism
    of Z-modules then MSI is Bounded Distance Decoding in an explicitly computable
    coset, its security parameter is the homology rank and not p, and three encoder
    calls decide which
  statement: >-
    SCOPE: toy levels N on a declared grid, small l and truncation exponent m, lattice
    ranks well below any regime where lattice hardness is the operative question, and
    instances produced by an oriented-instance generator that MUST EXIST AND BE
    COMMITTED BEFORE THIS HYPOTHESIS CAN BE TESTED AT ALL. CLAIM TIER toy for every
    measured number. THIS RECORD MAKES NO CLAIM THAT MSI IS HARD, AND A CELL IN WHICH
    AN ATTACK FAILS IS NOT A SECURITY CLAIM.
    THE CLAIM, in three separable parts.
    (L1) ADDITIVITY. The truncated l-adic period map Per_m from the relative homology
    module to (Z/l^m Z)^d is a homomorphism of Z-modules: Per_m(x + y) = Per_m(x) +
    Per_m(y) exactly, and Per_m(k x) = k Per_m(x), for all classes x, y and all
    integers k.
    (L2) CONSEQUENCE. Under L1, Per_m is a matrix A over Z/l^m Z computable from
    PUBLIC data alone, and the preimage set of a published vector is exactly a coset
    of ker(A). "Recover a short representative" is then verbatim Bounded Distance
    Decoding in that coset, so MSI's cost is BKZ's cost at the homology rank and at
    the measured gap.
    (L3) SCOPE OF HARDNESS. Consequently the security parameter is the homology rank -
    a function of N alone - and NOT p. At fixed level and truncation, attack cost and
    success rate are FLAT in p across a sweep spanning many orders of magnitude.
    THE HYPOTHESIS ASSERTS ALL THREE AND ITS MOST VALUABLE OUTCOME IS THE REFUTATION
    OF L1: if additivity fails on genuine encoder output, the identity of the
    non-additive step is the construction's real cryptographic content and is worth
    more than any confirmation this experiment could produce.
  mechanism: >-
    Every ingredient named in the construction's own summary is bilinear or additive -
    a period is a pairing of a homology class against a differential, the integration
    is additive in the path and linear in the form, and truncation is a ring quotient.
    Additivity therefore fails if and only if the map inserts a step that is not
    additive in the class: a multiplicative integral not passed through a logarithm, a
    base point or branch chosen as a function of the class, a per-class canonical
    normalisation, or a reduction that is not a module map. Exactly one of those two
    worlds is real, and a check on three encoder calls decides which - no lattice
    machinery is needed to run it. If additivity holds, the matrix A is built by
    encoding basis elements, its kernel is an explicit lattice, and the whole question
    collapses into standard lattice cryptanalysis at the homology rank, where the
    tension that makes the claim sharp is that shortness and hardness pull in opposite
    directions: the shorter the representative, the larger the decoding gap and the
    easier the instance.
  assumptions:
    - >-
      An oriented-instance generator and an encoder EXIST AND ARE COMMITTED. This
      hypothesis cannot be tested without them and says so. Their absence is an
      infrastructure blocker, never a result of any kind.
    - >-
      The construction's own definitions - the attaching map, the norm in which
      "shortness" is measured, whether the l-adic period is an additive integral or a
      multiplicative one, the dimension d, and any per-class normalisation - are
      extracted from the source document with page references BEFORE any measurement.
      This container may not be able to reach that document; if it cannot, the
      experiment is NOT EXECUTABLE and that is the honest report, not a run against
      inferred definitions.
    - >-
      Whether shortness is measured in an integral BASIS or in an overdetermined
      generating set is load-bearing: the two give different lattices of different
      ranks and different attacks. It must be settled from the source, not chosen.
    - >-
      The matrix A must be built WITHOUT ever calling the attaching map, i.e. from
      public data only. That is what makes the attack an attack, and the run record must
      show that it was.
  proof_search_map:
    bottleneck: >-
      Additivity of the encoder in the homology class. It is the only property of the
      construction the entire argument uses. Remove it and every statement evaporates;
      keep it and the reduction to BDD is immediate and the scope statement follows by
      counting. There is no intermediate: it is a single yes/no algebraic fact and three
      encoder calls measure it directly.
    baseline_embedding:
      parameter_slice: >-
        Random q-ary lattices of the same rank and determinant with planted errors of
        the same norm - the standard BDD baseline whose success curve against the gap is
        ordinary lattice-cryptanalysis practice. The real lattice must reproduce that
        curve as a parameter slice or differ measurably; either is a result.
      reproduction_check: >-
        A frozen fixture: for a fixed seed, a fixed random q-ary instance at a declared
        rank and truncation with a planted error, LLL plus Babai must return the planted
        error EXACTLY. Integer equality, not similarity of a curve. A failure means the
        lattice harness is broken and no number from it may be reported.
    observation_collision:
      observable: >-
        The truncated period vector.
      distinct_preimage_search: >-
        The collision search IS the experiment and it is two-sided. Under L1, distinct
        short preimages of the same vector exist exactly in the ill-posed regime, and
        they are found CONSTRUCTIVELY by enumerating short kernel vectors and adding
        them. A found collision falsifies identifiability of the encoding. ABSENCE of
        collisions is NOT evidence of hardness and must never be recorded as such - it
        merely places the cell in a regime where the gap decides.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "invert the l-adic period encoding" by "decode in the coset x_0 +
          ker(A)". ENCODING: the matrix A over Z/l^m Z, built from public data.
          COMPLETENESS: every short representative is a short coset element, by L1.
          SOUNDNESS: every short coset element is a valid answer as the problem is
          stated. TRANSFER: exact under L1, void without it. COST LOSS: none in the
          reduction; the cost is BKZ's.
        predicted_gain: >-
          Converts an unanalysed new assumption into a fully analysed old one, and
          yields the scope statement: the security parameter is the homology rank, with
          no dependence on p.
      - transform: observable_fiber
        proposed_object: >-
          Hold the period vector fixed, vary the class over the kernel, and ask for an
          intrinsic invariant of the oriented object distinguishing fibre elements.
        predicted_gain: >-
          Under L1 the fibre is a full sublattice coset carrying no such invariant beyond
          the norm, which is what makes shortness the only available side condition. An
          exception found here would be a genuine new handle and would supersede this
          record.
    quantifier_order: >-
      FOR ALL levels, primes and truncations, and FOR ALL classes x, y: Per_m(x + y) =
      Per_m(x) + Per_m(y). THEN, for all parameter tuples in the polynomial-time regime,
      THERE EXISTS a polynomial-time algorithm that FOR ALL instances returns the unique
      short preimage. THE TRAP, NAMED: the inverted order "for all instances there
      exists a lattice in which it is easy" is vacuous, since one may take the lattice
      generated by the answer. The content is that A is fixed BEFORE the instance and is
      computed from public data only, and the run record must demonstrate that it was.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "for the tested cells, the truncated period map was additive and
        instances fell in the named regime, with measured recovery rates and a measured
        deviation from the random-lattice null." It can NEVER certify that MSI is easy
        at untested parameters, can never certify a lower bound, and cannot certify
        hardness - absence of a successful attack in a toy cell is NOT evidence of
        hardness, and this record forbids that reading in advance.
      nearby_object_control: >-
        A DELIBERATELY NON-LINEAR ENCODER: the same A followed by a fixed public
        bijection that is not additive. The identical pipeline MUST fail on it. A
        pipeline that succeeds on both has not used linearity and its verdict on the real
        map is worthless. THIS CONTROL IS BLOCKING and it is the sharpest single check in
        the design.
    proof_obligations:
      - claim: Per_m is additive in the homology class.
        responsibility: correctness
      - claim: A is computable from public data without the instance.
        responsibility: interface
      - claim: The kernel determinant follows from the measured rank, not from the assumed one.
        responsibility: size
      - claim: Babai after LLL decodes in the stated regime.
        responsibility: correctness
      - claim: Multiple short preimages exist in the ill-posed regime, at the ball-volume count.
        responsibility: size
      - claim: The success curve tracks the gap and not p.
        responsibility: success_probability
      - claim: Every conclusion is scoped to the tested cells.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: The MSI assumption itself, as a newly proposed hardness assumption.
    prior_best: >-
      FOR MSI: none known to this program - no published cryptanalysis is known here, and
      the only implicit baselines are exhaustive search over short representatives and its
      meet-in-the-middle square root. FOR the adjacent isogeny problems MSI might inherit
      from: p^{1/2}(log p)^{O(1)} unconditional and p^{1/3+o(1)} conditional, as recorded
      in this program's own inputs.
    time_exponent: >-
      Under L1: polynomial in the homology rank and the truncation in the LLL regime, and
      exponential in the BKZ block size in the surviving window. THE EXPONENT IS IN THE
      LEVEL AND THERE IS NO p IN IT - which is the claim, and it is what the p-sweep tests.
    memory_exponent: >-
      Polynomial for LLL/Babai. For BKZ, exponential for sieving-based oracles or
      polynomial for enumeration at a higher time cost; both operating points are reported.
      Memory is NOT the binding constraint here, in contrast to the isogeny-side algorithms
      whose memory equals their time - and a construction's designer must cost BOTH surfaces.
    hidden_cofactor: >-
      The cost of BUILDING A, which requires one encoder call per basis element and whose
      per-call cost is unknown until the source is read; l-adic integration to precision
      l^m may itself be expensive in m. If the encoder costs more than the attack, the
      assumption cannot support a construction at all. Also hidden: the sieving constant,
      and the fact that BKZ simulation is calibrated on random lattices while this kernel
      is a module.
    claim_kind: exponent_improvement
    claim_kind_note: >-
      Labelled exponent_improvement because the claim, if L1 holds, is that the security
      parameter is a different quantity entirely - the level, not p - which is an
      exponent-level statement about where the hardness lives. It is NOT a claim that any
      algorithm is faster than any incumbent: no new lattice technique is proposed and none
      is claimed, and the record's entire value is CLASSIFICATION rather than speed.
  heuristic_assumptions:
    - id: HEUR-MSI-8207ee-1
      formal_statement: >-
        For all tested levels, primes and truncations, the kernel lattice behaves like a
        uniformly random lattice of its determinant with respect to its first minimum:
        lambda_1 equals the Gaussian prediction times (1 + eps) with |eps| bounded by a
        constant independent of the level, the prime and the truncation.
      random_model_justification: >-
        The rigorous ingredient is Minkowski's convex body theorem, giving an unconditional
        UPPER bound on lambda_1. The classical statement being imitated is the Gaussian
        heuristic for random lattices, standard throughout lattice cryptanalysis for q-ary
        lattices. THE ASSUMPTION IS THAT THE MODULE STRUCTURE OF THE KERNEL DOES NOT MOVE
        lambda_1, WHICH IS PRECISELY WHAT MIGHT FAIL - module lattices are the one family
        where it is known to fail in other settings.
      supporting_results:
        - >-
          Minkowski's convex body theorem (rigorous upper bound). RECALLED, not cited to a
          read source in this record; to be stated with a reference in the experiment's
          derivation stage rather than taken on trust here.
        - >-
          The Gaussian heuristic for random lattices. RECALLED, standard, not a theorem in
          this setting.
      validation_experiment_ids:
        - EXP-MSI-1958dc
      falsification_condition: >-
        Measured lambda_1 differing from the Gaussian prediction by more than a factor 2 in
        either direction, SYSTEMATICALLY across the grid rather than in isolated cells. Note
        the direction: a systematically SHORT first minimum would make the problem EASIER,
        not harder, and that is how a module structure would announce itself.
    - id: HEUR-MSI-8207ee-2
      formal_statement: >-
        For all instances produced by the attaching map at the tested p, the shortness of the
        genuine representative grows at most linearly in the path length in whichever norm
        the source defines, and its distribution has sub-Gaussian tails around its median.
      random_model_justification: >-
        NONE UNTIL THE SOURCE IS READ. The classical statement being imitated is linear
        growth of a norm in the number of generators used, which is definitional once the
        shortness measure is known and entirely unknown while it is not. THIS IS THE
        ASSUMPTION WITH THE LEAST SUPPORT IN THE RECORD and it is flagged rather than buried.
      supporting_results: []
      validation_experiment_ids:
        - EXP-MSI-1958dc
      falsification_condition: >-
        Shortness growing faster than linearly in path length, or having heavy tails putting
        a non-negligible fraction of instances in a different regime from the median
        instance. A bimodal distribution would mean a construction's security is set by its
        worst instances rather than its median ones.
  structural_ingredients:
    - description: >-
        The construction's truncated l-adic period map, its attaching map, its shortness
        norm and its dimension parameter.
      citation: null
      provenance: recalled
      verified_by: >-
        NOT VERIFIED. EVERY STATEMENT ABOUT THE CONSTRUCTION IN THIS RECORD IS AN INFERENCE
        FROM ITS PUBLISHED SUMMARY. The source body was not read, and no citation is
        asserted. Reading it is a HARD PRECONDITION of the paired contract, and if the
        source cannot be reached the experiment is not executable.
      role: the object whose additivity is the measured quantity
    - description: >-
        Standard lattice cryptanalysis - lattice reduction, nearest-plane decoding, block
        reduction - used unchanged.
      citation: null
      provenance: recalled
      verified_by: >-
        No new lattice technique is proposed and none is claimed. If the source document
        already contains the linearity observation, this record's increment is zero on the
        mathematics and non-zero only on the parameter accounting - a possibility that is
        open, unchecked, and stated.
      role: the analysis the reduction hands the problem to
  reduction_chain:
    core_problem: >-
      MSI as stated by its source, reduced under L1 to Bounded Distance Decoding in an
      explicit coset.
    corollaries: []
  predictions:
    - metric: >-
        additivity_violation_rate - fraction of sampled class pairs with Per_m(x + y) not
        equal to Per_m(x) + Per_m(y)
      direction: lower
      minimum_effect: >-
        PREDICTED EXACTLY 0 over at least 1000 pairs per cell, including pairs whose sum is
        short and pairs whose sum is not, plus scalar checks. A single genuine violation
        that is not an implementation bug refutes L1 and is the MOST VALUABLE outcome
        available.
    - metric: rank of A modulo l, against the dimension parameter
      direction: different
      minimum_effect: >-
        Predicted equal generically and STRICTLY LESS at exceptional primes. Any rank
        deficit multiplies the kernel determinant down and moves every regime boundary, so
        it must be MEASURED here and never assumed - using the assumed dimension in place of
        the measured rank silently overstates the gap and makes the instance look harder
        than it is. This is the confounder most likely to produce a wrong verdict.
    - metric: >-
        exact-recovery rate as a function of the predicted gap
      direction: higher
      minimum_effect: >-
        A pre-registered TRANSITION CURVE, not a single rate: high recovery at large
        predicted gap, near-zero at small predicted gap, with the transition midpoint
        agreeing with the random-lattice null within a declared relative tolerance. A
        transition displaced beyond that tolerance is a module effect and is itself a
        finding worth its own record.
    - metric: >-
        attack wall clock and success rate at fixed level and truncation as p varies over at
        least four values spanning many orders of magnitude
      direction: different
      minimum_effect: >-
        PREDICTED FLAT - no trend in p beyond noise, since no p appears in the lattice. Any
        monotone trend contradicts the purely linear model and is the single most informative
        negative this record can produce.
    - metric: number of distinct short preimages found in ill-posed cells
      direction: higher
      minimum_effect: >-
        Predicted to grow like the ball-volume count once the shortness bound exceeds the
        ill-posedness threshold. Finding exactly one preimage where the count predicts many
        means either the norm model or the Gaussian heuristic is wrong at these parameters,
        and that must be diagnosed before anything else is reported.
    - metric: non-linear-encoder control success rate
      direction: lower
      minimum_effect: >-
        PREDICTED 0. Any success on the deliberately non-additive encoder VOIDS every other
        number in the run.
  test_boundary:
    instances: >-
      Toy levels on a declared grid with small primes and truncation exponents, at lattice
      ranks small enough for exact shortest-vector computation to serve as ground truth;
      instances produced by the committed oriented-instance generator, plus planted-error
      instances on matched random q-ary lattices.
    parameters:
      grid: >-
        A declared grid of levels, primes and truncation exponents, fixed before any run,
        with the rank per cell recorded rather than assumed.
      pairs_per_cell: at least 1000 class pairs for the additivity test
      p_sweep: at least four values of p at fixed level and truncation, spanning many orders of magnitude
      ground_truth_rank_ceiling: >-
        the largest rank at which exact shortest-vector computation is affordable, above
        which a block-reduction estimate is used and ITS OWN error is reported
    implementation: >-
      The committed encoder and oriented-instance generator, unchanged, with their commit
      shas recorded. Lattice reduction and decoding from a standard implementation, with a
      frozen planted-error fixture validating the harness before any MSI number is produced.
    budget:
      total_cpu_hours: 12
      maximum_runs: 40
  falsification_conditions:
    - >-
      Additivity fails on genuine encoder output and the failure is not an implementation
      bug. L1 is FALSE for the actual map, the whole reduction is void, and the identity of
      the non-additive step is the finding. THIS IS THE OUTCOME MOST WORTH HAVING AND IT IS
      NOT A FAILURE OF THE EXPERIMENT.
    - >-
      The frozen planted-error fixture fails. The lattice harness is broken; no number may be
      reported (AGENTS.md rule 5).
    - >-
      The non-additive-encoder control is DEFEATED by the pipeline. The pipeline is not using
      linearity; every conclusion in the run is void.
    - >-
      Recovery rate is FLAT in the predicted gap. The measured success is not produced by the
      lattice geometry; diagnose the harness before reporting anything.
    - >-
      Recovery rate or wall clock trends with p at fixed level and truncation. L3 is weakened
      and the mechanism by which p enters must be found.
    - >-
      The source's shortness is measured in a generating set rather than a basis, and the
      induced lattice's rank and geometry differ enough that the regime boundaries do not
      apply. The arithmetic must be redone in the correct lattice before any attack claim.
    - >-
      The source document cannot be read, or the encoder and generator are not committed. The
      experiment is NOT EXECUTABLE; that is an infrastructure report and never a result.
  interpretation_limits:
    - >-
      MSI IS NEW AND ITS HARDNESS IS UNVERIFIED BY DEFAULT. Nothing here may be read as
      evidence that MSI is hard, and a cell in which the attack fails is a cell in a regime,
      not a security claim.
    - >-
      EVERY STATEMENT ABOUT THE CONSTRUCTION IS AN INFERENCE FROM ITS PUBLISHED SUMMARY. The
      body was not read for this record and the source-reading stage is a hard precondition.
    - >-
      Toy scale only, at ranks far below any regime where lattice hardness is the operative
      question. AT SMALL RANK NEARLY EVERY LATTICE INSTANCE IS EASY, so a toy success proves
      almost nothing; the SUCCESS-VERSUS-GAP CURVE, not the raw success rate, is the
      transferable quantity and must be reported that way.
    - >-
      No claim about prime-field ECDLP is made, implied, or reachable from this record.
    - >-
      If the source already contains the linearity observation, this record's increment is
      zero on the mathematics and non-zero only on the parameter accounting. That possibility
      is open and unchecked.
  prior_evidence_refs:
    - RQ-MSI-f760b2
    - IDEA-20260811-4a55dd
  distinguishable_outcomes:
    - outcome: >-
        Fixture passes, non-additive control is defeated by nothing (i.e. it fails as
        required), additivity violation rate is exactly 0 over every cell, recovery tracks the
        gap, and the p-sweep is flat.
      means: >-
        SUPPORTS all three parts at toy scale. MSI is BDD, its security parameter is the
        homology rank, and it should be analysed with lattice tools rather than isogeny tools.
        Next decision: the parameter-accounting consequence - the level required for a given
        security target - becomes the deliverable, routed to adversarial review, and the
        lattice-side follow-on becomes the live lane. NO claim that MSI is broken at any
        proposed parameter set.
    - outcome: >-
        Additivity fails on genuine encoder output, reproducibly, and is traced to a specific
        step rather than to a bug.
      means: >-
        FALSIFIES L1 and therefore L2 and L3. The non-additive step is the construction's real
        cryptographic content. Next decision: supersede this record with one built around that
        step - which is a strictly more valuable outcome than confirmation, and is why the
        test is worth running either way.
    - outcome: >-
        Additivity holds but the recovery curve is displaced from the random-lattice null, or
        the p-sweep shows a trend.
      means: >-
        L1 and L2 stand, L3 is weakened in a specific diagnosable way. Next decision: the
        module deviation, or the mechanism by which p enters the instance distribution, gets
        its own record; do not report either as noise.
    - outcome: >-
        The fixture fails, the non-additive control is defeated, the source cannot be read, or
        the encoder is not committed.
      means: >-
        NO EVIDENCE EITHER WAY. Instrument, dependency or unavailable-source outcome
        (AGENTS.md rule 5). Next decision: return the concrete blocker; the additivity test
        remains the cheapest valid discriminator once the dependency exists.
