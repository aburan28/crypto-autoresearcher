  statement: >
    Fix the exact descent-index identity of IDEA-20260824-248142 before any published elliptic surface is transcribed, any Galois-invariant rank census is claimed, or any rank over Q is exhibited. Stage 0 asserts only that on the frozen 2-dimensional Q-vector space with C2 swapping the two basis vectors, geometric rank is 2, the invariant subspace has rank 1, and descent index equals 2-1=1. A nearby claim that geometric rank equals invariant rank is rejected. The zero module called to have invariant rank 1 is rejected. An invariant rank larger than geometric rank is refused. This is not a rank-32 curve over Q, not a generic-rank-19 record over Q(t), and not an ECDLP claim. Stages 1+ stay unauthorized.
  mechanism: >
    IDEA-20260824-248142 defines descent index as geometric rank minus Galois-invariant rank. Stage 0 freezes that subtraction on one explicit permutation representation. No Kuwata K3. No Kloosterman form. No Shioda y^2=x^3+t^360+1. No Elkies rank-17 model.
  predictions:
    - id: P-S0-DESCIDX
      metric: closed-form identities on the frozen REAL / KF / NULL panel
      direction: different
      minimum_effect: >
        After fixture_pass, REAL identities hold (geo=2, inv=1, descent=1)
        and the nearby KF claim is rejected. NULL is rejected.
      claim_tier: observational
  falsification_criteria:
