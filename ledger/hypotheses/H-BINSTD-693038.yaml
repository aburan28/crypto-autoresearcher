  statement: >-
    In analysis/binstd-curve-audit/binary-curve-params.txt, sha256
    ad4678d2703c36a5ee9c5d6dcaa5e886977b13c1c1546daad61f6c7710e4f493,
    the name degree is the integer after sect, pnb, or tnb. The 16
    name degrees are unmixed. ppBasis degrees are 131, 163, 176, 208,
    272, 283, 304, 368 and 571. tpBasis degrees are 191, 193, 233, 239,
    359, 409 and 431. Six of those name degrees have more than one
    printed EC-Parameters bit size. Printed bit size 353 occurs with
    both basis types.
  mechanism: >-
    The reduction polynomial is a property of the field, so curves that
    share a named degree should share a basis label. The printed bit
    count in the parameter line is a different integer and does not
    carry that uniqueness. This contract checks those two groupings.
    It does not encode a multiplication table.
