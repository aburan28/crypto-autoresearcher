    - id: F-S0-REAL
      statement: >
        After fixture_pass, REAL misses a frozen identity. That
        falsifies only P-S0-PAILN at the frozen arithmetic.
  test_boundary:
    instances:
      - frozen Stage 0 REAL / KF / NULL arithmetic panel
    parameters:
