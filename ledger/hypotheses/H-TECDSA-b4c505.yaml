  mechanism: >
    IDEA-20260809-98c5ac plants small factors in an unproven Paillier modulus. Stage 0 freezes n=1. No ciphertext.
  predictions:
    - id: P-S0-PAILN
      metric: closed-form identities on the frozen REAL / KF / NULL panel
      direction: different
      minimum_effect: >
        After fixture_pass, REAL identities hold and the nearby KF
        claim is rejected. NULL is rejected.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KF
      statement: >
        After fixture_pass, the KF claim is accepted. An encoding
