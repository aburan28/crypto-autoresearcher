    prose: >
      Toy / closed-form arithmetic only. No curve construction
      that would constitute an attack. No Semaev S_m evaluation.
      No Coppersmith. No DLP. No rho beat. The frozen numbers are
      the proposal's own identities, not a fitted result.
  assumptions:
