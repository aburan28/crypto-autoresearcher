    DEC-20261003-4bb57d weaken). Using a NEW frozen catalog (seed 2026100350;
    ≥48 and ≤128 shapes; NOT seeds 2026100317/2026100320/2026100330/2026100340):
    (A) PACKAGE is CELL-SCOPED to (n,ℓ)=(17,4) — ADMISSION twin meters agree
    and catalog yields ≥5 distinct dim(V·V) and ≥4 distinct N_var; (B) only
    after (A), same-shape permutation-null OR random-Boolean matched-catalog
    null 95% upper CI of Spearman ρ(dim(V·V), N_var) reaches legacy band 0.70
    (O-NULL-REACHES-LEGACY-BAND) OR both stay below 0.70
    (O-NULL-CEILING-BELOW-LEGACY, B_cal := max(null ci95_hi)); if (A) fails
    → package O-INCONCLUSIVE. (C) DIAGNOSTIC (17,3) remains O-ESCAPE-OK-17-3
    or O-INSTRUMENT-BOUNDARY-17-3 and does NOT gate the package. Observed
    Weil pairing ρ is DISCLOSED only. NO break. NO n≥131. Do NOT re-run
    EXP-BINSTD-4b846c, 9b18fc, 16ee30, or 5b2fd0 v1. No KN-FIND.
