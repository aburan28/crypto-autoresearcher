  converts_idea: null
  converts_idea_note: >
    No IDEA-* is converted. This hypothesis is the successor design prescribed by
    DEC-20260906-7448cf (rulings + next_action_for_goal_head) and the resource_check
    reading of the obstruction block in EV-ECRANK-8b35bb. It refines H-ECRANK-ee6e0e
    (now WEAKENED, scoped): the existence half of the parent is not refuted, and this
    hypothesis is the two cheapest decisive tests the scoped negative leaves open.
  opening_decision: DEC-20260906-8ab17b
  experiment_contract: EXP-ECRANK-73275e
  refines: H-ECRANK-ee6e0e
  statement: >
    Two claims, tested in order by EXP-ECRANK-73275e. (M-A, attribution) The seeded
    fibration draw stream of EXP-ECRANK-76a70d has full support on the declared
    fibration sub-box at the scheduled H, and every recorded drawn fixed coordinate
    lies inside that box; therefore the zero-instance outcome of arm B (and of arms
    A and C at their own scopes) is a statement about square-pattern incidence
    density in W'(b) -- mathematics -- and not about a sampler that cannot meet a
    square-pattern point -- artifact. (M-B, construction) Prescribing the square
    pattern instead of drawing it -- choose the r_i first, then solve the n - 5
    quadratic ellipticity conditions on g inside the (n + 4)-dimensional M3 family --
    exhibits populated, nonsingular, certified-rank multi-quadratic instances at
    n = 6 first (one condition, no measured local obstruction, HEUR-1 exponent +2)
    and then n = 8 (three conditions), exact and descent-free, inside toy caps, at
    a per-tuple incidence above the random-draw 95% upper bound measured in
    EV-ECRANK-8b35bb (< 3e-4 per draw at n = 8).
  mechanism:
    M-A_draw_support: >
      The draw stage of the predecessor engine fixes 5 of the n r-coordinates from a
      seeded sub-box at height <= H and solves the remaining n - 5 diagonal quadratic
      conditions exactly (Bézout <= 8 candidate intersections per draw, rationality
      checked exactly). Full support means: the map from the seeded stream (RNG bits,
      sub-box lattice points at height <= H) onto the drawn fixed coordinates is
      surjective, and the scheduled-H bookkeeping never draws outside the declared
      box. The audit reconstructs the stream from the snapshot-bound raw data of
      a20a49b6adbcce51893c1221dbd69cdcd486ad9d (seeds, sub-boxes, H schedule, the
      recorded draw sequence) and checks (i) every recorded fixed coordinate is in
      box at the scheduled H, and (ii) a planted square-pattern point inside the box
      at height <= H is met with the arithmetic expected under the stream's declared
      uniformity (expected meets = N_a / |S|, |S| the exactly computed lattice count).
      A support defect at either check re-attributes the zero to the sampler.
    M-B_prescribed_construction: >
      The same quadratic ellipticity conditions that a draw must satisfy by luck are
      solved by construction: for each declared b-tuple the square pattern is
      prescribed (pre-registered rule: r_n carries the pattern; deterministic, no
      adaptive reordering), and the n - 5 conditions are solved for g's coefficients
      inside the declared coefficient box by exact rational algebra (univariate
      quadratic at n = 6; 3-condition diagonal system at n = 8, the same Bézout
      <= 8 intersections per draw, now enumerated exhaustively within the box rather
      than sampled). The obstruction's resource_check (EV-ECRANK-8b35bb) names this
      reversal: the indefiniteness that kills the draw route is the hypothesis of the
      construction route. At n = 6 there is one quadratic, no measured local
      obstruction, and HEUR-1 predicts exponent +2; at n = 8 three quadratics and
      exponent +1.
  numbered_predictions:
    - id: P1
      claim: >
        For each of the three audited b-tuples (deterministic selection: the first
        three in the R3-armB record stream bound at a20a49b6a), every recorded drawn
        fixed coordinate lies inside the declared fibration sub-box at the scheduled
        H: in-box fraction = 1.000 across all recorded draws.
      source: M-A; test R2.
    - id: P2
      claim: >
        The planted square-pattern controls (one per audited b-tuple, inside the box
        at height <= H) are each met at least once by the declared stream over the
        pre-registered N_a draws, where N_a is chosen so the expected meet count
        under declared uniformity, N_a / |S|, is >= 5.
      source: M-A; test R2; N_a and |S| are computed and recorded before any meet is
        counted.
    - id: P3
      claim: >
        The n = 6 prescribed construction exhibits >= 1 certified instance (distinct
        minimal model, nonsingular, twist class populated, certified rank above the
        trivial) over the declared 10^4 b-tuple sample inside the counted-op cap.
      source: M-B + HEUR-1 (exponent +2 at n = 6, IDEA-20260905-d53906/D5608c
        lineage, provenance internal); test R3.
    - id: P4
      claim: >
        The measured n = 6 per-tuple incidence is reported with a rule-of-three
        upper bound when zero; if nonzero it exceeds the random-draw 95% upper bound
        of 3e-4 (EV-ECRANK-8b35bb) read at the same per-tuple scale, establishing
        construction-over-draw at the tested scope.
      source: comparison of measured quantities; test R3 vs EV-ECRANK-8b35bb.
    - id: P5
      claim: >
        At n = 8 the same construction is reported (count, near-miss/feasibility
        pattern, cost) as a secondary scope; it is descriptive at this contract's
        scale and load-bearing only for the n = 8 interpretation.
      source: M-B at n = 8; test R5.
  heuristic_assumptions:
    - id: HEUR-1
      statement: >
        N(n, H) ~ C(b, d) H^(5 - n/2) for the count of distinct-minimal-model
        nonsingular forced instances over the seeded b-sample as a function of the
        nested box height H (exponent +2 at n = 6, +1 at n = 8), with C(b, d) > 0
        iff locally solvable everywhere. Carried from H-ECRANK-ee6e0e unchanged; this
        contract tests the construction-side realization of the same law, not the
        draw-side one (which fired F1 at the tested scope in EV-ECRANK-8b35bb).
      random_model_justification: >
        Subspace lattice count times square-class equidistribution, as recorded in
        IDEA-20260905-d5608c (provenance: internal). The construction route removes
        the sampling step from the law: the per-tuple count becomes the number of
        box solutions of the n - 5 quadratics, which the draw route estimated
        indirectly.
      falsification_condition: F2 (n = 6 exhaustion with the infeasibility pattern).
  structural_ingredients:
    - The M3 family mechanism of H-ECRANK-ee6e0e ((n + 4)-dimensional in the
      coefficients of g after fixing the pattern), with the committed
      quartic_reduction / cubic_to_weierstrass certification machinery (built-in
      exact on-curve rechecks) and the exact F_l-reduction within-class certifier.
    - The snapshot-bound raw data of EXP-ECRANK-76a70d (a20a49b6a) as the audit
      input, the stream being reconstructed from committed bytes and never
      re-simulated from memory.
    - The known-false d = (1, 1, ...) Mestre degeneration as the control family
      (closed form; expected certified totals n - 1 at n = 6 and n = 8).
  rerandomization: none
  rerandomization_note: >
    No re-randomization is used: the audit is deterministic reconstruction, and the
    construction is an exhaustive enumeration within the declared box, not a
    randomized search.
  asymptotic_claim: null
  asymptotic_claim_note: >
    No asymptotic claim. This is a scoped toy-scale mechanism test (n <= 8,
    H <= 10^4, exact rational arithmetic); any transfer assumption is stated at the
    point of use, per the target-result profile.
  proof_search_map:
    baseline_reproduction: >
      The draw-side law's anchor (d = 1 closed form) is reproduced in R7
      (known-false control, expected certified totals n - 1); the construction
      solver is validated against the planted controls R2/R8 before any count is
      read.
    observation_collision: >
      The audit (R2) is exactly the collision search: it checks the observed zero
      against the sampler's declared geometry. The predecessor's J4-F3 red-team
      route is the named object.
    quantifier_order: >
      M-A: for the three audited b-tuples, for all recorded draws, in-box holds;
      and for each planted point, exists a stream position meeting it within N_a.
      M-B: for the declared b-sample, exists (b, g) with the prescribed pattern
      satisfying the n - 5 conditions and passing certification (counted); the
      falsification pattern is the universal infeasibility of the conditions in
      box.
    method_ceiling: >
      The method ceiling of the draw route is the measured incidence
      (< 3e-4/draw, EV-ECRANK-8b35bb); the nearby-object control is the null family
      R6 (known-zero solution set), which the same solver must return exactly zero
      solutions on, and the planted family R8, which it must detect.
  predictions:
    - P1
    - P2
    - P3
    - P4
    - P5
  test_boundary: >
    n in {6, 8}; exact rational arithmetic over Q (fractions.Fraction, stdlib);
    nested height boxes up to H = 10^4 (n = 6) and H = 10^3 (n = 8); b-tuples in
    affine normal form b_1 = 0, b_2 = 1, b_3..b_n distinct integers in [-20, 20]
    excluding {0, 1}; counted exact-op cap 1.0e8 per run with an exact
    ops_cap_respected flag; no descent of any kind, no PARI, no network; toy
    claim-tier (docs/claims-and-verification.md). The audit reads only committed
    bytes bound at snapshot a20a49b6adbcce51893c1221dbd69cdcd486ad9d. No
    cryptographic-scale claim, no C1 promotion, no C2 effect.
  falsification_conditions:
    - id: F1_audit
      condition: >
        Any recorded drawn fixed coordinate of any of the three audited b-tuples
        lies outside the declared fibration sub-box at the scheduled H, or the
        expected-meet arithmetic (N_a / |S| >= 5) is met but a planted point goes
        unmet over N_a draws, or |S| is not the lattice count the stream declares.
      closes: M-A at the tested scope; the predecessor arm zero is RE-ATTRIBUTED to
        the sampler and the engine must be repaired and the arms re-run before any
        density interpretation stands.
    - id: F2_n6
      condition: >
        R3 exhausts the declared sample and counted-op cap with 0 certified
        instances AND the feasibility pattern shows the n = 6 quadratic infeasible
        in box for all sampled b-tuples (feasibility fraction 0 with the recorded
        near-miss ledger), i.e. the pattern is not merely rare but infeasible.
      closes: M-B at n = 6 at the tested scope; the obstruction extends to the
        construction side and the resource_check reading of EV-ECRANK-8b35bb is
        falsified at this scope. A zero count with feasibility fraction > 0 is a
        DIFFERENT result (degeneracy blocker), recorded, not a closure.
    - id: F3_n8
      condition: >
        R5 exhausts with 0 certified instances and the same infeasibility pattern at
        n = 8.
      closes: M-B at n = 8 at the tested scope only (secondary).
    - id: F4_controls
      condition: >
        Any of R1 (smoke), R4 (replay), R6 (null object), R7 (known-false), R8
        (planted yield) fails its pre-registered check.
      closes: nothing about the mathematics; the affected runs are VOID
        (failed_infrastructure / invalid), per core rule 3.
  walls:
    - 'The measured incidence wall, < 3e-4 per draw at n = 8, 0/80000 (EV-ECRANK-8b35bb obstruction block; rule-of-three 95% bound; P(zero | rate >= 1e-3) ~ 4.5e-5). This contract is the test of whether that wall is sampler geometry or mathematics.'
    - 'The descent wall, no 2-descent or ellrank anywhere; every rank is a verifier-checked lower bound from exhibited points.'
    - 'The review-breakthrough wall, the unpromoted C1 closure candidate of DEC-20260905-7adca0 remains gated by IMP-2; nothing here promotes or touches it.'
  assumptions:
    - HEUR-1 as stated (internal provenance; falsifiable by F2).
    - The snapshot-bound raw data of EXP-ECRANK-76a70d is complete enough to
      reconstruct the draw stream (seeds, sub-boxes, H schedule, recorded draws);
      R1 self-tests this on one b-tuple before the audit is read.
  confounders:
    - 'Op-counting convention (IC-1), RNG calls, Fraction-constructor gcd reductions, and plain integer ops outside counted helpers are EXCLUDED and the exclusions are reported, per successor requirement 11 of DEC-20260906-7448cf; the cap is on counted exact ops only.'
    - 'Wall-clock semantics, internal monotonic wall AND timestamp span are both reported (successor requirement 10), so no cost model is quoted smaller than reality.'
    - The duplicate lane BATCH-90fabf produced an unreviewed, different
      implementation of the predecessor contract (closed by DEC-20260906-feedee,
      no evidentiary standing). It is NOT an input to this design; any agreement or
      disagreement with its numbers is coincidence until reviewed.
  interpretation_limits: >
    A supported M-A licenses attributing the predecessor zero to density; it does
    not license any density estimate beyond the measured bounds. A supported M-B
    at n = 6 exhibits instances at toy scale and falsifies the "too sparse to
    construct" reading at that scope; it does not establish any cryptographic-scale
    count, and the (n + 4)-dimensional family's behavior beyond H = 10^4 is
    unmeasured. A zero at n = 6 with feasibility fraction > 0 is neither support
    nor closure: it is a new measurement naming a degeneracy blocker.
