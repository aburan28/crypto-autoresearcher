hypothesis:
  id: H-CZLIFT-9a32e9
  question_id: RQ-CZLIFT-b9f765
  goal_id: GOAL-CZLIFT-1516d5
  added: '2026-10-09'
  proposed_by: user
  designed_by: coordinator
  approval_decision: DEC-20261009-a3797d
  title: >-
    Small rational points on E/Q (and on E(K) for a quadratic K) grow like
    (log H)^{r/2}, reduce to E(F_p) like uniform random points, and so cover
    a target residue only when their number reaches p
  source_statement: >-
    User hypothesis H2, 2026-10-09 (verbatim fragment): "Lifting to E(Q) or
    E(K) for the SNFS number field K = Q(c^{1/d}) fails for a different
    reason: rank r is small (PPVW heuristics suggest bounded near 21; the
    Elkies-Klagsbrun record is 29 and is a bespoke construction), points of
    height <= H number ~H^{r/2}, and a random point's lift has height ~log p.
    You need subexponentially many small points and get polynomially many.
    Silverman-Suzuki, Huang-Kueh-Tan, and the xedni analysis all die on
    this."
  statement: >-
    For E/Q of rank r the number N_E(H) of rational points of naive height
    H(x) <= H grows like c_E (log H)^{r/2} (the slope of log N_E against
    log log H lies within 1 of r/2 on the ladder of ranks 0..7 at H <= 10^5).
    The reductions mod p of those points hit E(F_p) like independent uniform
    points: the number of distinct residues divided by N_p(1 - (1-1/N_p)^N)
    has median within [0.8, 1.2] and exceeds 1.5 in fewer than 5 percent of
    cells. Consequently the smallest height H_half(p) covering half of E(F_p)
    satisfies log log H_half = (2/r) log p + O(1), i.e. the height needed to
    lift a random residue grows exponentially in p^{2/r}, and passing to
    K = Q(sqrt D) adds the twist's points (N_E + N_{E^D}, still (log H)^{r_K/2})
    with no coverage beyond the same uniform model.
  mechanism: >-
    Neron's theorem counts Mordell-Weil points of bounded canonical height as
    lattice points in a ball of radius sqrt(log H), giving (log H)^{r/2}; the
    naive height differs from the canonical one by a bounded amount, so the
    exponent is unchanged. Reduction mod p of a set of global points that is
    small relative to p has no reason to be structured in E(F_p), and the
    coupon-collector count then says that hitting a prescribed residue needs
    on the order of p points, which costs log H of order (p/c_E)^{2/r}. This
    is the quantitative form of the Silverman-Suzuki, Huang-Kueh-Tan and
    xedni obstructions: lifting a random point of E(F_p) to a point of E(Q)
    of height polynomial in log p is impossible because there are only
    polynomially many such points and they are spread uniformly.
  assumptions:
    - 'Ranks are recalled literature labels (minimal-conductor tables); the measured growth slope is the consistency check, never a rank computation.'
    - Naive height H(x) = max(|a|, d^2) for x = a/d^2 in lowest terms; the point at infinity is counted once.
    - Primes of bad reduction are skipped; p ranges over 16 primes between 101 and 20000.
  proof_search_map:
    not_applicable_reason: >-
      Empirical census against two classical predictions (Neron growth and
      uniform reduction); no new asymptotic claim is sought.
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-CZLIFT-UNIFORM
      formal_statement: >-
        For fixed E/Q and H, the multiset of reductions mod p of the N_E(H)
        rational points of height <= H behaves, for the count of distinct
        residues, like N_E(H) independent uniform draws from E(F_p), uniformly
        in p over the primes of good reduction with N_E(H) <= 0.9 N_p.
      random_model_justification: no algebraic relation ties small global points to a structured subset of E(F_p) once N_E(H) is small compared with p.
      supporting_results: []
      validation_experiment_ids: [EXP-CZLIFT-a255fc]
      falsification_condition: median ratio of observed to modelled distinct residues outside [0.8, 1.2], or more than 5 percent of cells above 1.5
  structural_ingredients:
    - description: Neron's count of rational points of bounded height on an abelian variety
      citation: 'A. Neron, Quasi-fonctions et hauteurs sur les varietes abeliennes, Ann. Math. 82 (1965)'
      provenance: recalled
      verified_by: null
      role: the (log H)^{r/2} growth law
    - description: xedni calculus and its analysis
      citation: 'M. J. Jacobson, N. Koblitz, J. H. Silverman, A. Stein, E. Teske, Analysis of the xedni calculus attack, Des. Codes Cryptogr. 20 (2000)'
      provenance: recalled
      verified_by: null
      role: the obstruction this census quantifies
  reduction_chain:
    core_problem: whether a global lift can supply enough small points to reach a random residue class of E(F_p)
    corollaries: []
  predictions:
    - metric: growth slope per curve (log N_E(H) against log log H, H in [100, 10^5])
      direction: different
      minimum_effect: 'within 1 of r/2 for every ladder curve with N_E(10^5) >= 20'
    - metric: coverage_ratio_median and coverage_ratio_frac_above_1p5 over cells with N >= 30 and modelled coverage <= 0.9
      direction: different
      minimum_effect: 'median in [0.8, 1.2] and fewer than 5 percent of cells above 1.5'
    - metric: h_half_scaling slope per curve with at least 3 resolved primes
      direction: different
      minimum_effect: 'between 0.5 and 2 times 2/r for ranks >= 5'
    - metric: twist_union_ratio_median (K-points of E(Q) + E^D(Q) against the uniform model)
      direction: different
      minimum_effect: 'in [0.8, 1.2]'
  test_boundary:
    instances:
      - 'the minimal-conductor rank ladder 11a1, 37a1, 389a1, 5077a1, 234446a1, 19047851a1, 5187563742a1, 382623908456a1'
      - 'quadratic twists by D in {-1, 2, -3, 5, -7, 13} of the first four'
    parameters: {hmax: 100000, twist_hmax: 30000, n_primes: 16}
    implementation: experiments/EXP-CZLIFT-a255fc/implementation/run.py (numpy sieve, exact square test)
    budget: {wall_clock_seconds_per_run: 1800}
  falsification_conditions:
    - a ladder curve with N_E(10^5) >= 20 whose growth slope differs from r/2 by more than 1 (which first casts doubt on the recalled rank label, then on the growth law)
    - coverage ratio median outside [0.8, 1.2] or more than 5 percent of cells above 1.5
    - a twist union covering E(F_p) above the uniform model by more than 1.5 in more than 5 percent of cells
  interpretation_limits:
    - 'Naive height up to 10^5 (10^6 on the replication trial); the asymptotic exponent is read on a short range.'
    - 'K = Q(sqrt D) stands in for the SNFS field Q(c^{1/d}) at d = 2 only; higher-degree fields are not instrumented.'
    - Says nothing about constructing a curve with large rank; the rank ladder is fixed.
  status: approved
  status_note: >-
    Pre-run approval paired to EXP-CZLIFT-a255fc under DEC-20261009-a3797d.
    Approval asserts nothing about truth.
