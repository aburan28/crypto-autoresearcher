# H-SSI-a92825 — specified from IDEA-20261005-c94831.
# Protocol approval is DEC-20261006-cd269e. The source idea lives on
# origin/design/pair-3a18d1-hcp and is not copied here.
# This record asserts no isogeny-path algorithm and no ECDLP exponent
# change. No curve was enumerated in this design.
hypothesis:
  id: H-SSI-a92825
  question_id: RQ-SSI-001
  source_proposal: IDEA-20261005-c94831
  goal_id: null
  goal_id_note: >-
    This design binds the question RQ-SSI-001 and does not attach a
    goal record. It does not create one.
  status: approved
  status_note: >-
    approved means the square-test protocol in EXP-SSI-feee9d is approved
    for a later executor. It does not mean the count 144 was observed.
    Status moves only by DEC-20261006-cd269e under the standing user
    authorization of 2026-09-06. No point of either curve was enumerated
    in this design.
  proposed_by: coordinator
  conversion_note: >-
    The curve y^2 = x^3 + 1 over F_11, the predicted counts 12 and 144,
    the ordinary control y^2 = x^3 + x + 2 with predicted counts 16 and
    128, and the refusal to walk an isogeny are carried from
    IDEA-20261005-c94831, which was read via git show of
    origin/design/pair-3a18d1-hcp. The Coordinator froze the square test
    and the field polynomial z^2 - 2 before any run of EXP-SSI-feee9d.

  statement: >-
    TEST BOUNDARY. One short-Weierstrass curve S given by
    y^2 = x^3 + 1 over F_11, and its base change to F_121, together
    with the ordinary control C given by y^2 = x^3 + x + 2 over the
    same two fields. F_121 is F_11[z]/(z^2 - 2). The point at infinity
    is counted once.

    PRE-REGISTERED PREDICTION, fixed before any run. The square-test
    count of S(F_121), including infinity, is exactly 144. Any other
    integer is a negative. The same instrument is pre-registered to
    return 12 for S(F_11), 16 for C(F_11), and 128 for C(F_121). Those
    three integers are controls on the instrument. They are not a
    second copy of the prediction 144.

    SUPERSINGULARITY. The only measured claim is the four square-test
    counts. Supersingularity is not re-proved. The idea names S
    supersingular because a count of 12 over F_11 is trace 0. This
    protocol checks that arithmetic and does not compute a
    Cartier-Manin matrix. The congruence p congruent to 2 modulo 3 is
    not accepted as a proof. No isogeny path is walked.

    DISTINGUISHABLE OUTCOMES. (1) Both square-test methods agree, the
    trace recurrence was not used as the counter, and the four counts
    are 12, 144, 16, and 128: success for the prediction 144. (2) Both
    methods agree and the count of S(F_121) is any integer other than
    144: negative. (3) Both methods agree, the count of S(F_121) is 144,
    and at least one of 12, 16, or 128 fails: the prediction 144 holds
    and a control integer fails, which is not success. (4) The two
    methods disagree, 2 is a square in F_11, infinity was omitted, the
    control over F_121 also returned 144, or the trace recurrence was
    used as the counter: invalid, not evidence. (5) A timeout or crash:
    failed_infrastructure, not evidence.

    No discrete-log exponent moves. The rho exponent stays 1/2. No
    isogeny-path algorithm is claimed.

  mechanism: >-
    The prediction is the Cayley-Hamilton shadow of the trace, not the
    counter. If the square test returns 12 points of S over F_11, the
    trace t satisfies 11 + 1 - t = 12, so t = 0. The characteristic
    equation is pi^2 - t pi + 11 = 0. The trace of pi^2 is t^2 - 2*11
    = -22, and 121 + 1 - (-22) = 144, which is (11+1)^2. The executor
    must not evaluate that identity in place of testing squares. A
    value c in the field is a square when some y in the field satisfies
    y^2 = c. Zero contributes one affine point. A nonzero square
    contributes two. The point at infinity contributes one. The control
    equation uses the same rules. If its F_11 count is 16 then its
    trace is -4, the trace of pi^2 is 16 - 22 = -6, and
    121 + 1 - (-6) = 128. That identity is also not the counter.
    Calling S supersingular is the idea's name for this trace-0
    arithmetic. It is not a Cartier-Manin computation and not an
    isogeny.

  assumptions:
    - F_121 is F_11[z]/(z^2 - 2). The element 2 is not a square in F_11. The squares in F_11 are 0, 1, 3, 4, 5, and 9.
    - The base-change equation keeps the coefficient 1 on the constant term of S, and the coefficients 1 and 2 on C. No F_121-isomorphism is applied before the count.
    - The control y^2 = x^3 + x + 2 is a different equation, not a twist of y^2 = x^3 + 1. Its count is not copied from S.
    - Toy scope is these two equations at q = 11 and n = 2. No isogeny graph is built.
    - The criterion that an elliptic curve over F_p is supersingular exactly when p divides the trace is assumed from IDEA-20261005-c94831 and is not re-proved here. The measured claim is the counts.

  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
    not_applicable_reason: >-
      One field enumeration against a pre-registered integer. No proof
      decomposition, no isogeny algorithm, and no exponent bookkeeping.

  asymptotic_claim:
    problem: none — no complexity improvement is claimed
    prior_best: Pollard rho at exponent 1/2, not beaten
    time_exponent: unchanged
    memory_exponent: unchanged
    hidden_cofactor: >-
      None in an o(1) term. The output is four point counts. The
      discrete-log time exponent stays 1/2. No isogeny-path cost is
      claimed.
    claim_kind: not_applicable

  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        For the base change of an elliptic curve over F_q with trace t,
        the trace of Frobenius over F_{q^2} equals t^2 - 2q. Here q = 11
        and, if the F_11 count of y^2 = x^3 + 1 is 12, t = 0, so that
        trace is -22 and the point count over F_121 is 144. One curve.
        No distribution over supersingular j-invariants is claimed, and
        no transfer to a cryptographic prime or to an isogeny path.
      random_model_justification: >-
        The comparison distribution is a point mass at 144. This imitates
        no random integer. The sample is one equation, counted twice by
        independent square tests. The control is a point mass at 128.
      supporting_results: []
      validation_experiment_ids:
        - EXP-SSI-feee9d
      falsification_condition: >-
        The square-test count of y^2 = x^3 + 1 over F_121 is an integer
        other than 144.

  structural_ingredients:
    - description: >-
        KR-RHO-13bf67 states that a generic discrete logarithm needs
        Omega(sqrt(p)) group operations. A point count is not a discrete
        logarithm, and this hypothesis does not change that exponent.
      citation: KR-RHO-13bf67
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
      role: unchanged generic exponent
    - description: >-
        KR-RHO-53c89f states that anomalous curves have trace 1 and are
        solved by a p-adic lift. Trace 0 is a different integer. This
        hypothesis does not run that lift.
      citation: KR-RHO-53c89f
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-53c89f.yaml
      role: scope fence; trace 0 is not trace 1
    - description: >-
        KR-RHO-755e35 states that the trace is an isogeny invariant.
        This hypothesis measures two equations separately and does not
        walk an isogeny.
      citation: KR-RHO-755e35
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
      role: scope fence; no isogeny walk
    - description: >-
        KR-RHO-0528e7 states that an automorphism of order m changes the
        rho constant by sqrt(m) and does not change the exponent 1/2.
        This hypothesis applies no automorphism to a walk.
      citation: KR-RHO-0528e7
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-0528e7.yaml
      role: unchanged automorphism baseline
    - description: >-
        KR-RHO-fbd7b1 states a square-root memory ordering for grumpy
        giants. This hypothesis does not change that ordering.
      citation: KR-RHO-fbd7b1
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-fbd7b1.yaml
      role: unchanged memory ordering

  reduction_chain:
    core_problem: >-
      Whether the square-test count of y^2 = x^3 + 1 over F_121 is 144.
      Not an attack and not an isogeny path.
    corollaries: []

  predictions:
    - metric: enumerated_point_count_of_S_over_F_121
      direction: different
      minimum_effect: >-
        Exactly 144, including the point at infinity. Any other integer
        is the negative.
    - metric: enumerated_point_count_of_S_over_F_11
      direction: different
      minimum_effect: Exactly 12, including the point at infinity.
    - metric: enumerated_point_count_of_C_over_F_121
      direction: different
      minimum_effect: Exactly 128, and not 144.

  test_boundary:
    instances:
      - S given by y^2 = x^3 + 1 over F_11 and over F_121
      - C given by y^2 = x^3 + x + 2 over F_11 and over F_121
    parameters:
      field_prime: 11
      extension_degree: 2
      modulus: z^2 - 2
      predicted_S_F_121: 144
      predicted_S_F_11: 12
      predicted_C_F_11: 16
      predicted_C_F_121: 128
    implementation: >-
      A later executor enumerates squares. This design does not
      enumerate either curve.
    budget:
      enforcement: advisory
      maximum_runs: 2
      note: >-
        One exhaustive square test by two methods inside one run. The
        second run id is an infrastructure retry, not a second
        scientific sample.

  falsification_conditions:
    - The square-test count of S(F_121) is not 144. H1 is then false for this equation.
    - The square-test count of S(F_11) is not 12. The trace t = 0 used to write 144 is then not the trace of this model, and the supersingularity label from the idea is not confirmed by the count.
    - The square-test count of y^2 = x^3 + x + 2 over F_121 is 144, or is not 128.

  interpretation_limits:
    - Toy scope: two equations, q = 11, n = 2. No statement about CSIDH, CGL path-finding, SQIsign, or a cryptographic prime.
    - The rho exponent stays 1/2. Agreement at 144 does not beat a generic discrete logarithm and does not produce an isogeny.
    - The trace recurrence is the source of the prediction. It is not the counter.
    - Supersingularity is assumed from the idea as the name of the trace-0 count. It is not re-proved, and a Cartier-Manin rank is not this count.
    - The measured claim is the four integers. A count other than 144 for S(F_121) is a negative for that prediction only.

