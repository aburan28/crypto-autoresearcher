hypothesis:
  id: H-ALR-001
  question_id: RQ-ALR-001
  statement: >-
    The compact R181 signed kernel restricted to a deduplicated, at-most-two-chart
    target divisor has an exact gcd-equivalent subresultant interface, while the
    standard represented remainder, Newton-trace, inverse-certificate, norm, and
    target-half-GCD routes retain an nN coefficient body.
  mechanism: >-
    On each x-injective target chart, substitute the target interpolant V_T into
    K_P=A_P+vB_P and reduce modulo the squarefree target polynomial W. Then
    gcd(W,R_P) is nonconstant exactly when R_P is a nonunit, equivalently when
    Norm(R_P)=Res(W,R_P)=0. Standard represented routes expose nN coefficients;
    an SLP-direct candidate-only resultant remains outside the tested closure.
  assumptions:
    - The selected divisor and retained target divisor use the exact R174/R181 signed chart conventions
    - Public duplicate targets may be removed because only the zero union is required
    - Elliptic x-fibers have size at most two and therefore require at most two x-injective charts
    - Asymptotic costs are charged in the represented input and output dimensions
  predictions:
    - metric: exact_remainder_norm_gcd_replay
      direction: equal
      minimum_effect: all 12 ordinary controls and the opposite-point control pass
    - metric: represented_route_exponent_B
      direction: greater
      minimum_effect: 7/2 versus the 5/2 rho proxy
    - metric: slp_direct_candidate_only_constructor
      direction: different
      minimum_effect: remains open unless an explicit softly O(n+N) algorithm is supplied
  test_boundary:
    instances:
      - AutoLab R181 replay seeds 16001, 16002, and 18104 on three curve families
      - held-out seed 18206 on three curve families
      - duplicate-plus-opposite-point adversarial chart control
    parameters:
      source_commit: 835c850bf2103e7c67f85614887a2bea9c6e6913
      source_round: R182
      harness_state: V131
    implementation: experiments/EXP-ALR-001/source/p1553_m6_gcd_equivalent_target_subresultant_probe_r182.py
    budget:
      maximum_runs: 1
  falsification_conditions:
    - Any direct kernel evaluation differs from its target-divisor remainder
    - Norm zero differs from nonunit status or a nonconstant gcd
    - The opposite-point control cannot be represented by two complete x-injective charts
    - Any inherited or held-out candidate factor differs from its independent comparator
    - A represented route is credited below rho without charging its nN body
  interpretation_limits:
    - Exactness and density are established only on finite toy controls
    - No general SLP, circuit, RAM, data-structure, or resultant lower bound is claimed
    - No factor logs, identical fresh-target descent, generic-prime attack, rho improvement, or Shoup improvement is supplied
  status: analyzed
  proposed_by: autolab-r182-port
