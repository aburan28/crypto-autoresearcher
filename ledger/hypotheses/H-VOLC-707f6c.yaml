  falsification_conditions:
    - >-
      Level cardinalities do not come out (3, 9, 18, 36, 72) summing to 138. The
      class identification is false and the record is retracted at ARM 0 for the
      cost of a page of arithmetic.
    - >-
      Any curve violates "group exponent 1986 iff two_torsion_x_count = 3". The
      Lenstra-derived split is false as stated and every channel argument built
      on it falls.
    - >-
      Cell conditioning reduces the variance ratio by less than 20 percent AND
      the sampler-free functional is over-dispersed at the same magnitude. The
      mixture explanation is refuted and the residual becomes a positive C2
      lead.
    - >-
      The matched synthetic null reproduces the pooled over-dispersion at full
      magnitude. No curve-theoretic content survives.
    - >-
      The positive control fails to recover a planted 5 percent cell shift.
      Measurement stops; no negative is recorded.
    - >-
      The p = 6007 nearby-object control reports a cell structure even though
      its arithmetic forbids a 66/72-type dichotomy. The instrument is detecting
      something other than rational 2-torsion and the whole mechanism is void.
  interpretation_limits:
    - >-
      TOY TIER, ONE CLASS, ONE PRIME, ONE FACTOR BASE. p = 4001 is 12 bits.
      Nothing transfers to cryptographic scale and no transfer is offered.
    - >-
      NO ECDLP CLAIM IN EITHER DIRECTION. No discrete logarithm is solved, no
      relation is collected, no cost model is moved; sota_delta is zero on every
      axis whatever the outcome.
    - >-
      A confirmed mixture explains a MEASUREMENT, not the mathematics. It would
      show the campaign's within-class variance is instrument-and-combinatorics
      on THIS class at THIS factor base, and says nothing about other
      functionals, arities, classes, or the T1 transport question.
    - >-
      THE TWO-CELL OBSERVABLE CANNOT RESOLVE FIVE LEVELS. Any level-resolved
      statement requires the stronger invariant named in the proof search map
      and is out of scope.
    - >-
      #E(F_p) = 3972 is NOT prime, so the ECDLP instance on these curves lives
      in a subgroup of order 331 or 993 and the decomposition functional is not
      the attack quantity it is named after. Pre-existing property of the
      campaign's toy class, not introduced here, but it bounds every reading.
    - >-
      The sampler defect is a property of THIS HARNESS. It is not a statement
      about ECDLP, about elliptic curves, or about any published algorithm.
  status: proposed
  proposed_by: idea-generator
