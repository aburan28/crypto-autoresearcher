hypothesis:
  id: H-VOLC-707f6c
  question_id: RQ-VOLC-f6253b
  goal_id: GOAL-ENDO-001
  derived_from_idea: IDEA-20260821-ad7c97
  added: '2026-08-25'
  statement: >-
    The committed p = 4001, t = 30 census of 138 curves is the ordinary isogeny
    class of discriminant D = t^2 - 4p = -15104 = -59 * 16^2, i.e. fundamental
    discriminant D_0 = -59 with Frobenius conductor f = 16; because 2 is inert
    in O_K the five ell = 2 volcano levels f_E in {1, 2, 4, 8, 16} carry
    3, 9, 18, 36 and 72 curves respectively, summing to exactly 138. Because
    (pi - 1)/2 = 3 + 8*omega lies in O_c if and only if c divides 8, Lenstra's
    CM structure theorem makes E(F_p)[2] isomorphic to (Z/2)^2 exactly when
    f_E divides 8; hence the 66 curves at levels {1,2,4,8} have full rational
    2-torsion and group Z/2 x Z/1986, and the 72 floor curves (f_E = 16) are
    cyclic of order 3972. The 66/72 split that EV-ICINV-343679 measured and
    withdrew is therefore precisely the ell = 2 volcano floor indicator, an
    exact function of End_{F_p}(E). FURTHER, the within-class over-dispersion of
    decomp_rate_m2/m3 recorded as unexplained in EV-ENDO-10109d (variance ratio
    1.416 and 2.298 at p = 4001) is at that prime a TWO-COMPONENT MIXTURE
    indexed by that same split, transmitted by three named channels - CH1 the
    windowed 2-torsion deficit in the negated factor base, CH2 the index-2
    confinement of harness/exp_icinv.py::targets_uniform on exactly the 66
    non-cyclic curves, and CH3 the additive-collision structure of the m-fold
    sum-set in Z/2 x Z/1986 versus Z/3972 - so that conditioning on the split,
    or removing the sampler entirely by scoring the exact functional
    |3V(E)|/#E, drives the variance ratio to its null.
  mechanism: >-
    T1 states the ECDLP transports exactly along F_p-isogenies of degree coprime
    to N, so a genuine attack-cost functional cannot vary within an isogeny
    class beyond transport cost. The campaign's measured within-class variance
    must therefore originate outside the ECDLP, and this hypothesis names the
    place. End_{F_p}(E) varies across the class exactly by the conductor
    f_E | 16; Lenstra's theorem converts that variation into a variation of the
    F_p-RATIONAL GROUP STRUCTURE, here the clean dichotomy Z/2 x Z/1986 versus
    Z/3972; and the group structure is what the measurement instrument's target
    sampler consumes. targets_uniform draws targets as pseudorandom multiples of
    a single highest-order point found among at most 200 liftable x-candidates,
    and its own committed docstring states it "cannot reach a non-cyclic group's
    full structure from one generator". On the 66 non-cyclic curves the maximum
    point order is 1986, so every target lies in an index-2 subgroup H_E; on the
    72 floor curves the sampler reaches all 3972 points. The functional called
    decomp_rate therefore measures |mV intersect H_E| / |H_E|, not |mV| / #E -
    it is a function of the PAIR (curve, sampler-reachable subgroup). An
    endomorphism-ring quantity thus reaches a "cost" statistic through the
    sampler's reachable subgroup and the size of the negated factor base, not
    through any attack mechanism. Both channels are deterministic, computable
    from public data in polynomial time, and irrelevant to the discrete
    logarithm.
  assumptions:
    - >-
      The committed 138-curve census is COMPLETE for the class (the completeness
      concern of RQ-INSTR-f8faa0 and IDEA-20260807-1c14d7). If it is a subset,
      the level cardinalities will not reproduce (3, 9, 18, 36, 72) and the
      identification fails loudly at zero compute rather than silently.
    - >-
      two_torsion_x_count as committed counts roots of x^3 + a x + b in F_p, NOT
      in the factor-base window. CH1 requires the WINDOWED count and must be
      recomputed; the two are different quantities and conflating them would
      manufacture the effect.
    - >-
      Vertical 2-isogeny construction is NOT required. N18 of GOAL-ENDO-001 (a
      Frobenius-eigenspace kernel-polynomial isogeny method) is unimplemented,
      and every arm is designed to avoid needing it - levels are inferred from
      group structure and Hilbert class polynomial roots, not from constructed
      vertical isogenies.
    - >-
      Only RUN-ICINV-p4001-degenfix is a legitimate reproduction target.
      RUN-ICINV-p4001-a used the confounded hash-and-lift _targets and
      CORR-20260807-a05e1e forbids citing its decomposition rows;
      RUN-ICINV-p4001-uniform used the pre-fix sampler.
  proof_search_map:
    bottleneck: >-
      The ATTRIBUTION step. GOAL-ENDO-001 criterion C2 turns on whether the
      within-class variance of an attack-cost functional exceeds its matched
      null. The bottleneck is not measuring the variance - that is committed -
      but deciding whether it is a property of the CURVE or of the PAIR
      (curve, sampler-reachable subgroup). Removing it changes what the
      campaign's single most-cited open number means.
    baseline_embedding:
      parameter_slice: >-
        The committed RUN-ICINV-p4001-degenfix rows at factor base FB_M3 = 13,
        N_TARGETS = 400, on the p = 4001 t = 30 138-curve census, with the
        post-fix targets_uniform sampler.
      reproduction_check: >-
        Before any new arm runs, recompute the committed variance ratios
        decomp_rate_m2 = 1.416 and decomp_rate_m3 = 2.298 bit-for-bit from the
        committed raw-result.json using
        harness/exp_icinv.py::binomial_null_verdict on the committed hit
        vectors. A mismatch halts the experiment and is reported as an
        instrument-integrity finding, never as a mathematical result.
    observation_collision:
      observable: The per-curve pair (two_torsion_x_count, decomp_rate_m3).
      distinct_preimage_search: >-
        A COLLISION EXISTS AND IS NAMED BEFORE ANY RUN. All four levels
        f_E in {1,2,4,8} - 66 curves - share two_torsion_x_count = 3, so the
        observable cannot separate the crater from level 8. The claim this
        hypothesis can support is therefore a TWO-CELL statement, never a
        five-level one, and any five-level reading of an outcome is
        unsupported. This is a disclosed identifiability limit, not one to be
        discovered later.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace two_torsion_x_count by the full group-structure invariant
          (n_1, n_2) with E(F_p) isomorphic to Z/n_1 x Z/n_2, and where that is
          still constant on a cell, by v_2(f_E) computed independently via Velu
          2-isogeny descent on the certified census.
        predicted_gain: >-
          Separates five levels instead of two; the only transform that could
          license a level-resolved claim.
      - transform: observable_fiber
        proposed_object: >-
          Hold decomp_rate_m3 fixed within a narrow band and vary the forgotten
          structure (level, |+-F_V|, parity imbalance d); report which of CH1,
          CH2, CH3 still separates curves inside the band.
        predicted_gain: >-
          Attributes the residual to a CHANNEL rather than to a LABEL, which is
          what distinguishes a mechanism from a correlation.
    quantifier_order: >-
      For all curves E in the committed 138-member p = 4001, t = 30 census,
      there EXISTS f_E dividing 16 with End_{F_p}(E) = O_{f_E}, AND
      E(F_p)[2] is isomorphic to (Z/2)^2 IF AND ONLY IF f_E divides 8. The
      witness f_E DEPENDS on E; the claim is explicitly not uniform over the
      class. The over-dispersion prediction is quantified as - for all cells C
      in {two_torsion_x_count = 1, two_torsion_x_count = 3}, the within-cell
      variance ratio is below the pooled ratio by the stated minimum effect.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On this one class, at this one factor base, the measured within-class
        variance of decomp_rate_m3 is (or is not) accounted for by a two-cell
        mixture indexed by rational 2-torsion, with the sampler-free functional
        |3V|/#E as the arbiter, at claim_tier toy." It can never certify
        anything about ECDLP hardness, about cryptographic-scale curves, or
        about classes with a different 2-adic conductor structure.
      nearby_object_control: >-
        THE p = 6007 CLASS, whose trace, D, D_0 and conductor must be derived
        first. If 2 splits or ramifies in its O_K, or its conductor is odd at 2,
        the 66/72-type dichotomy CANNOT occur there and the identical instrument
        must report NO cell structure. If it reports one anyway, the instrument
        is detecting something other than rational 2-torsion and the mechanism
        is void. SECOND nearby object - a PRIME-ORDER class, where every group
        is cyclic and CH2 is identically absent, so any over-dispersion must be
        attributable to CH1 and CH3 alone.
    proof_obligations:
      - claim: "D = -15104 = -59 * 16^2, D_0 = -59 fundamental, h(-59) = 3"
        responsibility: baseline
      - claim: "(-59/2) = -1, level sizes (3, 9, 18, 36, 72), total 138"
        responsibility: size
      - claim: "pi = 7 + 16*omega, N(pi - 1) = 3972"
        responsibility: correctness
      - claim: "(pi - 1)/2 = 3 + 8*omega lies in O_c iff c divides 8"
        responsibility: strictness
      - claim: "E(F_p)[2] = (Z/2)^2 iff (pi-1)/2 in End(E), via Lenstra"
        responsibility: interface
      - claim: "targets_uniform is confined to an index-2 subgroup on the 66 non-cyclic curves"
        responsibility: feasibility
      - claim: "cell-conditioned variance ratio falls below the pooled ratio by the stated minimum effect"
        responsibility: success_probability
      - claim: "toy tier, one class, one prime, no transfer asserted"
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        SUM-SET POISSONISATION. For a negation-symmetric subset S of an abelian
        group A of order n with |S| = 2B, the representation counts
        r_3(R) = #{(P_1,P_2,P_3) in S^3 with P_1+P_2+P_3 = R}, as R ranges over
        A, behave like independent Poisson variables of mean
        lambda = |S|^3/(6n), so |3S|/n concentrates at 1 - exp(-lambda) with
        fluctuation of relative order (n*lambda)^{-1/2}.
      random_model_justification: >-
        The exact identity sum_R r_3(R) = |S|^3 holds, and the second moment
        sum_R r_3(R)^2 is the additive energy of S, which for a uniformly random
        subset of A concentrates at its mean up to O(|S|^{3/2}) by a standard
        second-moment computation. The classical statement imitated is the
        Poisson approximation to the occupancy problem, the exact analogue used
        when treating |3S| as coupon-collector coverage. THE GAP, STATED - S is
        NOT uniformly random: it is negation symmetric, so P + (-P) = O always,
        giving a deterministic excess in r_2(O) and hence in r_3 near the
        identity coset. The assumption is that this excess is O(|S|) and does
        not affect the leading concentration.
      supporting_results:
        - >-
          Exact first moment sum_R r_3(R) = |S|^3 and the additive-energy second
          moment; internal derivation, no external citation claimed.
        - >-
          RECALLED, NOT CHECKED - the Poisson/occupancy approximation for balls
          in boxes as the classical distribution statement being imitated.
      validation_experiment_ids:
        - EXP-VOLC-8b0eec
      falsification_condition: >-
        The matched null's measured variance of |3S|/n departs from
        (n*lambda)^{-1} scaling by more than a factor of 2 across the tested
        density range 0.024 to 0.97.
    - id: HEUR-002
      formal_statement: >-
        PARITY-IMBALANCE MODEL. For a curve with E(F_p) isomorphic to
        Z/2 x Z/1986 and sampler-reachable subgroup H_E of index 2, the split
        (B_0, B_1) of the negated factor base across E(F_p)/H_E behaves like a
        Binomial(|+-F_V|, 1/2) draw, so the imbalance d = (B_0 - B_1)/2 has mean
        0 and standard deviation sqrt(|+-F_V|)/2.
      random_model_justification: >-
        The parity class of a point is the value of a quadratic character on the
        group, and the factor base is defined by an unrelated coordinate
        condition (x in V), so equidistribution follows from a character-sum
        bound of Weil type with error O(sqrt(p) log p). The classical statement
        imitated is equidistribution of a fixed set of x-coordinates across the
        cosets of an index-2 subgroup - the same shape of assumption
        liftable_density already carries in harness/exp_icinv.py, whose
        docstring cites exactly this Weil bound.
      supporting_results:
        - >-
          RECALLED, NOT CHECKED - Weil-type character sum bound with error
          O(sqrt(p) log p), as already cited in harness/exp_icinv.py's docstring.
      validation_experiment_ids:
        - EXP-VOLC-8b0eec
      falsification_condition: >-
        The measured distribution of d over the 66 non-cyclic curves has
        variance differing from |+-F_V|/4 by more than a factor of 1.5, or a
        non-zero mean exceeding 2 standard errors.
  structural_ingredients:
    - description: >-
        Lenstra's CM structure theorem - for ordinary E/F_p with Frobenius pi
        and End_{F_p}(E) = O, E(F_p) is isomorphic to O/(pi - 1) as an O-module.
        This is the step converting a conductor condition into a rational
        2-torsion condition.
      citation: "Lenstra, 'Complex multiplication structure of elliptic curves', J. Number Theory 56 (1996)"
      provenance: recalled
      verified_by: null
      role: conductor condition to group structure
    - description: >-
        Kohel / Fouquet-Morain isogeny volcanoes - the ell-isogeny graph of an
        ordinary class is a volcano whose levels are indexed by v_ell(f_E), with
        level cardinalities given by h(D_0 f_E^2); the inert case (-59/2) = -1
        gives the level sizes used in the identification.
      citation: "Kohel, 'Endomorphism rings of elliptic curves over finite fields' (1996); Fouquet-Morain (2002)"
      provenance: recalled
      verified_by: null
      role: level cardinalities and volcano structure
    - description: >-
        Committed census - the p = 4001, t = 30 class has 138 curves, and the
        elimination F_p-factorisation type takes two values in a 66/72 split
        equal to two_torsion_x_count.
      citation: EV-ICINV-343679
      provenance: internal
      verified_by: >-
        Read by the source idea-generator session only via the verbatim
        quotation carried in ledger/goals/GOAL-ENDO-001/goal.yaml; the primary
        evidence record was NOT opened. The Executor must re-read the primary
        record before relying on it.
      role: the census and the split under explanation
    - description: >-
        Committed over-dispersion - variance ratio in [1.3, 3.6] at every
        density 0.024-0.97 at both primes, monotonic_decay False at both;
        p = 4001 post-fix ratios decomp_rate_m2 1.416 and decomp_rate_m3 2.298,
        recorded as the campaign's most important open question.
      citation: EV-ENDO-10109d
      provenance: internal
      verified_by: source idea-generator session, read in full
      role: the quantity this hypothesis proposes to explain
    - description: >-
        harness/exp_icinv.py::targets_uniform - keeps the point of largest order
        found among at most 200 liftable x-candidates; docstring states it
        cannot reach a non-cyclic group's full structure from one generator.
      citation: harness/exp_icinv.py
      provenance: internal
      verified_by: source idea-generator session, read in source
      role: the CH2 transmission channel
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: >-
        level_cardinality_vector - curve counts per f_E from roots of the
        Hilbert class polynomials H_{-59 f_E^2} mod 4001
      direction: different
      minimum_effect: >-
        Exactly (3, 9, 18, 36, 72) summing to 138. Any other vector falsifies
        the class identification.
    - metric: >-
        group_structure_agreement - fraction of the 138 curves on which the
        exhaustively computed group exponent equals 1986 exactly when
        two_torsion_x_count = 3 and 3972 exactly when it equals 1
      direction: different
      minimum_effect: >-
        138 of 138, zero tolerance. Any single disagreement falsifies the
        Lenstra step as stated and voids every downstream arm.
    - metric: >-
        cell_conditioned_variance_ratio for decomp_rate_m3, computed separately
        inside each two_torsion cell against NULL-B
      direction: lower
      minimum_effect: >-
        Both cell ratios at most 1.5 against the committed pooled 2.298, i.e. a
        reduction of at least 35 percent. A reduction below 20 percent does not
        support the mixture explanation.
    - metric: >-
        samplerfree_variance_ratio - within-class variance ratio of the exact
        functional |3V(E)|/#E from harness/run_blocknull.py::sumset_m3, with no
        targets and no sampling
      direction: lower
      minimum_effect: >-
        At most 1.3, at or below the floor of the committed [1.3, 3.6] band. If
        the sampler-free functional is over-dispersed at the same magnitude as
        the sampled one, CH2 is not the channel and the diagnosis is wrong.
    - metric: >-
        parity_imbalance_kurtosis - excess kurtosis of the residual
        decomp_rate_m3 on the 66-curve non-cyclic cell after removing the cell
        mean
      direction: higher
      minimum_effect: >-
        Excess kurtosis at least 1.0 against the 72-curve cell, as predicted by
        the cubic-in-d propagation identity. A symmetric, mesokurtic residual on
        both cells is evidence AGAINST the parity channel specifically while
        leaving CH1 and CH3 open.
    - metric: >-
        matched_null_variance_ratio over 138 synthetic objects - uniformly
        random negation-symmetric subsets of Z/3972 at the observed per-curve
        sizes, with exactly 66 scored only on a fixed index-2 subgroup
      direction: different
      minimum_effect: >-
        If the null reproduces the pooled ratio within its Monte-Carlo interval,
        the entire effect is sum-set combinatorics plus the sampler and NO
        curve-theoretic content remains. If the null sits at 1.0 +/- 0.1 while
        the real arm stays over-dispersed after cell conditioning, the residual
        is real at this scope.
  test_boundary:
    instances:
      - the committed p = 4001, t = 30 census of 138 ordinary curves
      - the p = 6007 class, as nearby-object control
      - one prime-order toy class, as a second nearby-object control
      - 138 synthetic negation-symmetric subsets of Z/3972, as matched null
    parameters:
      factor_base: FB_M3 = 13, identical x-value set V for every curve
      n_targets: 400
      committed_reproduction_target: RUN-ICINV-p4001-degenfix
      synthetic_null_draws: 10000
      densities_swept: 0.024 to 0.97, as in the committed sweep
    implementation: >-
      Existing harness modules - harness/exp_icinv.py (targets_uniform,
      binomial_null_verdict) and harness/run_blocknull.py (sumset_m2, sumset_m3)
      - plus exhaustive point enumeration of 3972 points per curve and Hilbert
      class polynomial root-finding mod p. No new sum-set code is required.
      Every arm records the exact source blob hash of the harness modules used.
    budget:
      estimated_wall_clock_seconds: 3600
      note: >-
        138 exhaustive enumerations of 3972 points, 138 exact 3-fold sum-set
        enumerations at |+-F_V| about 25 points, and 10^4 synthetic null draws:
        seconds to minutes on one core per the parent's declared low compute
        cost. Memory is O(#E) = O(3972) points per curve, negligible.
  distinguishable_outcomes:
    - outcome: >-
        Level cardinalities come out (3, 9, 18, 36, 72) summing to 138; group
        exponent agrees with two_torsion_x_count on 138 of 138; cell
        conditioning cuts the variance ratio to at most 1.5 in both cells; the
        sampler-free functional's ratio is at most 1.3.
      means: >-
        The campaign's standing unexplained within-class over-dispersion at
        p = 4001 is an instrument-and-combinatorics artifact indexed by
        End_{F_p}(E), not attack structure. GOAL-ENDO-001's most-cited open
        question is answered at toy scope, and the correct next decision is to
        retire it for this class and this factor base only.
    - outcome: >-
        Cell conditioning reduces the ratio by less than 20 percent AND the
        sampler-free functional |3V|/#E is over-dispersed at the same magnitude
        as the sampled one, with the positive control passing.
      means: >-
        The two-cell mixture explanation is REFUTED. The campaign holds a
        class-varying functional that survives its strongest cheap explanation -
        a positive lead on completion criterion C2 that must be routed to an
        independent review-adversarial session (GOAL-ENDO-001 P3) before any
        record states it.
    - outcome: >-
        The matched synthetic null reproduces the pooled over-dispersion at full
        magnitude.
      means: >-
        The effect is sum-set combinatorics plus the sampler with no
        curve-theoretic content whatsoever. The deliverable is a named
        obstruction on the STATISTIC rather than on the mathematics, and the
        cell structure is beside the point.
    - outcome: >-
        Level cardinalities do not sum to 138, or any curve violates "group
        exponent 1986 iff two_torsion_x_count = 3".
      means: >-
        The class identification or the Lenstra step is wrong - either the
        census is incomplete (the RQ-INSTR-f8faa0 concern realised) or t = 30 is
        misattributed. The record is retracted at zero compute and the census's
        completeness becomes the next question.
    - outcome: >-
        Cell conditioning kills the ratio but ARM 5 (2-torsion x-values excluded
        so |+-F_V| is equalised) also kills it.
      means: >-
        CH1, the windowed factor-base deficit, is the channel - not the sampler.
        The instrument critique lands on factor-base construction rather than on
        targets_uniform, which changes which harness code the campaign must fix.
    - outcome: >-
        The planted 5 percent cell shift is not recovered by the
        cell-conditioned instrument.
      means: >-
        Under GOAL-ENDO-001 P1 measurement stops, every arm is marked
        attempted_and_inconclusive, and NO negative may be recorded. This is an
        instrument failure, not evidence about volcanoes.
