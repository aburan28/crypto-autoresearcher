  title: >-
    The integer 255 has 7 doublings and 7 additions
  statement: >-
    The integer 255 has bit length 8. Its bits are eight 1s.
    Reaching it by doubling and adding uses 7 doublings and 7
    additions. Eight exceeds seven by 1. Seven equals seven, so that
    gap is 0. The product of 8, 7, and 7 is 392. Their sum is 22.
    Two readings of the addition count are both 7, so that gap is 0
    and their product is 49.
  mechanism: >-
    The proposal writes the counts 8, 7, and 7. This contract
    checks those integers. It does not add a curve point.
