hypothesis:
  id: H-PFDR-6b9f1a
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  added: '2026-09-04'
  derived_from_idea: IDEA-20260811-a7c1df
  batch_id: BATCH-2c45e2
  statement: >-
    THE SUMMATION-POLYNOMIAL DEGENERATION SET IS A FINITE SET OF RATIONAL POINTS OF
    THE j-LINE FIXED BEFORE THE CHARACTERISTIC IS CHOSEN, AND THE PART OF THAT
    STATEMENT WHICH IS ABOUT ELLIPTIC CURVES IS NOT THE PART IT LOOKS LIKE. Write
    the summation polynomials over the polynomial ring in the two Weierstrass
    coefficients. Because they are weighted-homogeneous under the weighted scaling
    action, every irreducible coefficient factor is weighted-homogeneous.
    (S1 THE DICTIONARY, DERIVED AND HAND-CHECKED) A weight-12 form is
    alpha times the cube of the first coefficient plus beta times the square of the
    second, and on its non-singular locus the j-invariant is
    1728 times minus four beta divided by twenty-seven alpha minus four beta - a
    single rational number depending only on the ratio of alpha to beta and not on
    the characteristic.
    (S2 THE MULTIPLICITY CONCENTRATION IS THE ELLIPTIC CONTENT) The dictionary in
    S1 is a consequence of weighted homogeneity ALONE and would hold for any
    weighted-homogeneous family whatsoever, because the only weight-12 monomials in
    the two coefficients are the cube of the first and the square of the second. So
    S1 carries NO elliptic-curve content by itself. What may carry it is that the
    fourth summation polynomial's 439 coefficients concentrate on only six
    weight-12 loci with multiplicities 48, 36, 6, 6, 4 and 1, whereas a
    weighted-homogeneous family with generic coefficients has essentially as many
    distinct loci as coefficients and maximum multiplicity 1. The discriminating
    quantity is therefore the maximum multiplicity fraction, not the existence of
    special j.
    (S3 MONOTONICITY IN THE ARITY) The support of the fifth summation polynomial
    drops strictly below its generic value at every one of the six loci. A failure
    at any locus proves the degeneration set is arity-local rather than a property
    of the curve, which is the single most informative outcome available and is
    cheap.
  mechanism: >-
    The support of a summation polynomial as a function of the two Weierstrass
    coefficients is upper semi-continuous in the Zariski sense - generic on a dense
    open set, dropping only where whole coefficient blocks vanish. Those blocks
    vanish on the loci cut out by irreducible factors of the coefficients. Weighted
    homogeneity forces every such factor to be weighted-homogeneous, hence a power
    of one coefficient or a weight-12 form, and a weight-12 form is a single point
    of the j-line. That is the entire mechanism for S1, and it is why S1 is not
    elliptic. The elliptic input is the recursive resultant construction, which is
    what determines WHICH weight-12 forms actually appear and with what
    multiplicities - and that is what S2 measures and what S3 tests for stability in
    the arity.
  band_non_degeneracy:
    checked_by: TASK-20260904-5423ad
    finding: >-
      THE SOURCE IDEA'S HEADLINE DISCRIMINATOR IS A CONSEQUENCE OF HOMOGENEITY AND
      COULD NOT SEPARATE ITS MECHANISM FROM A CURVE-FREE LOOKALIKE. Its central
      claim is that every weight-12 coefficient factor cuts out a single rational
      point of the j-line. TASK-20260904-5423ad observes that with the first
      coefficient of weight 4 and the second of weight 6, the ONLY weight-12
      monomials are the cube of the first and the square of the second, so EVERY
      weight-12 coefficient of ANY weighted-homogeneous family is automatically of
      that shape and automatically cuts out one point of the j-line. A dense random
      weighted-homogeneous system with no summation polynomial and no curve
      anywhere in it reproduces the entire signature. This is the same failure mode
      as an anomaly attributed to curve structure that a dense random polynomial
      reproduces.
      SEPARATELY, THE IDEA'S RANK-ORDER BAND IS WEAK AND ITS WEAKNESS IS
      QUANTIFIED. With the tied pair excluded, four ranks remain, and Spearman
      correlation on four points takes the value 0.8 or above for exactly the
      identity permutation and the three adjacent transpositions - 4 of 24
      permutations, so a random ranking passes the idea's threshold with
      probability one in six. That is not a discriminator, it is a coin with a bias.
    change_made: >-
      Three changes. First, a CURVE-FREE WEIGHTED-HOMOGENEOUS NULL is added and made
      binding, with the consequence pre-stated. Second, the primary discriminating
      statistic became the MAXIMUM MULTIPLICITY FRACTION - the largest number of
      coefficients sharing one weight-12 factor, divided by the total coefficient
      count - which is 48 over 439, or 0.109, on the committed fourth summation
      polynomial and is predicted at or below 2 over 439, or 0.005, for a generic
      weighted-homogeneous family, a ratio of about 24 with no overlap. Third, a
      PLANTED-DEFECT arm of known size is added, and the rank-order statistic is
      demoted to secondary and reported together with its one-in-six null pass rate.
    alternative_hypothesis_range: >-
      Under H_homogeneity - the signature is produced by weighted homogeneity alone -
      the curve-free arm shows six-or-more weight-12 loci with maximum multiplicity
      1 or 2, giving a maximum multiplicity fraction at or below 0.005, and the
      j-line dictionary reproduces exactly. Under H_semaev the elliptic arm shows a
      maximum multiplicity fraction of about 0.109. The two are separated by a
      factor of about twenty, both are directly computable, and the planted arm
      demonstrates that a concentration of KNOWN size is measured at the right
      magnitude before either is interpreted.
  assumptions:
  - >-
    The expansion convention is frozen before execution - expanded affine form,
    not partially factored and not homogenised with respect to an extra variable -
    and the committed generic count of 439 must be reproduced under that same
    convention.
  - >-
    Specialising to a weight-12 locus requires a rational parametrisation that
    excludes the locus's singular point, and the parametrisation is declared before
    execution. A parametrisation that accidentally sets a coefficient to zero hits
    the singular point and reports a spurious drop.
  - >-
    The primary computation is over the rationals. Factorisation over a finite field
    can split a factor that is irreducible over the rationals, creating loci that
    exist only in that characteristic; such factors are reported separately and are
    not part of the characteristic-independent statement.
  - >-
    The recursive construction of the fifth summation polynomial as a resultant is
    TO BE VERIFIED against the committed harness before use, not assumed. If the
    harness builds it another way, S3 is restated against that route or withdrawn.
  proof_search_map:
    bottleneck: >-
      Identifying which weight-12 forms actually occur as irreducible coefficient
      factors, and with what multiplicities. Everything else - the j-value of a
      form, the gauge invariance, the reduction modulo a prime - is elementary once
      that list is known, which is exactly why the list and not the dictionary is
      where the content sits.
    baseline_embedding:
      parameter_slice: >-
        Arity 3. The third summation polynomial has NO weight-12 coefficient factor,
        so the method must reproduce the committed generic, first-coefficient-zero
        and second-coefficient-zero support counts of 13, 9 and 10 and must predict
        NO further special j at that arity. A method that invents a locus at arity 3
        is wrong at the boundary.
      reproduction_check: >-
        Symbolic re-expansion over the rationals, factorisation of every
        coefficient, confirmation that the only irreducible factors are the two
        coefficients themselves, and exact reproduction of 13, 9 and 10 - which
        TASK-20260904-5423ad verified are the values recorded in the committed
        evidence record and independently re-derived by the validating session in
        two engines plus a hand count.
    observation_collision:
      observable: >-
        The monomial support multiset of a summation polynomial, as a function on
        the j-line.
      distinct_preimage_search: >-
        PERFORMED AND POSITIVE, AND IT IS THE OBJECT'S PRINCIPAL LIMIT. A curve and
        its quadratic twist have the same j and therefore the same support, but
        different traces, different group orders and different isogeny classes. The
        observable has two distinct preimages on opposite sides of any class-level
        conclusion and can NEVER separate isogeny classes. This record makes a
        j-line claim only and no class-level claim whatsoever. A SECOND COLLISION,
        added by TASK-20260904-5423ad and more dangerous - the dictionary itself
        collides with every weighted-homogeneous family, elliptic or not, which is
        what S2 exists to address.
    constructive_transforms:
    - transform: stronger_invariant
      proposed_object: >-
        The degeneration divisor with multiplicities - the block sizes rather than
        the bare support integer - and, beyond that, the multiplicity CONCENTRATION
        as a single scalar.
      predicted_gain: >-
        The bare support integer cannot separate the elliptic family from a
        curve-free weighted-homogeneous one; the multiplicity concentration can, by
        about a factor of twenty. That is the whole gain and it costs no extra
        compute.
    quantifier_order: >-
      CLAIMED - FOR ALL arities at least 3 THERE EXISTS a finite set of rational
      numbers such that FOR ALL primes outside a finite exceptional set depending
      only on that set, and FOR ALL curves over that prime field whose j-invariant
      is not in the reduction of that set, the support equals the generic value. The
      witness set depends on the arity and on NOTHING ELSE - not on the prime, not
      on the curve and not on the isogeny class. The monotonicity claim is the
      further statement that the arity-4 set is contained in the arity-5 set, and it
      is exactly the quantifier that could fail.
    method_ceiling:
      strongest_certifiable_claim: >-
        A complete, exact, characteristic-independent list of the j-values at which
        the summation polynomial degenerates, for arities 3, 4 and 5, with
        multiplicities, together with a measurement of whether that list's
        concentration exceeds what weighted homogeneity alone produces. It can NEVER
        certify anything about solving cost, about isogeny classes, or about any
        prime outside the exceptional-set argument.
      nearby_object_control: >-
        THE SYSTEM THE HARNESS ACTUALLY SOLVES, which carries factor-base membership
        polynomials. There the solving degree is pinned by the factor-base size
        rather than by the curve, so the divisor is invisible. This method
        distinguishes the two systems by construction because it never touches the
        membership polynomials, and a method that could not distinguish them would
        have identified nothing load-bearing.
    proof_obligations:
    - claim: 'The j-value formula for a weight-12 locus.'
      responsibility: correctness
    - claim: 'Every irreducible coefficient factor is weighted-homogeneous.'
      responsibility: correctness
    - claim: 'The maximum multiplicity fraction exceeds the curve-free value by at least a factor of ten.'
      responsibility: strictness
    - claim: 'The fifth summation polynomial support drops strictly at each of the six loci.'
      responsibility: feasibility
    - claim: 'The exceptional-prime set is finite and explicitly computable.'
      responsibility: scope
    - claim: 'The arity-3 slice reproduces 13, 9 and 10 with no weight-12 factor.'
      responsibility: baseline
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    NULL. No algorithm is proposed, no exponent moves, no cost changes. The record
    itself states that even a perfect positive changes no cost, and the campaign's
    committed data supports that - a support drop of 23 to 31 percent at the two
    trivial loci moved Groebner time by minus 0.44 and minus 0.67 percent.
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: >-
      NO DISTRIBUTIONAL HEURISTIC IS LOAD-BEARING. Every quantity is an exact
      symbolic computation over the rationals or an exact reduction modulo a named
      prime. The only extrapolation is the characteristic-independence of the six
      loci, which is a consequence of their being defined over the rationals, subject
      to the named finite exceptional set, and not a distributional assumption.
    random_model_justification: >-
      Not applicable. No random model is imitated because nothing is sampled except
      the curve-free null coefficients and the gauge unit, both of which are seeded
      and recorded and neither of which enters a distributional claim.
    supporting_results: []
    supporting_results_note: >-
      EMPTY AND APPROPRIATELY SO. The only external input is the weighted
      homogeneity of the summation polynomials, which the committed evidence record
      reports as discharged exactly on all 138 members of a toy isogeny class as an
      implementation control.
    validation_experiment_ids:
    - EXP-PFDR-a168bc
    falsification_condition: >-
      The six rational j-values fail to reduce to the committed six-element multiset
      at the reference prime, or fail to match a fresh stratification over a
      different prime field at three further primes, or the deliberately included
      prime dividing a denominator fails to show the predicted degeneration of the
      dictionary.
  structural_ingredients:
  - description: >-
      The committed stratification of the 439 coefficients of the fourth summation
      polynomial over the rationals into eight blocks - the two trivial coefficient
      factors with multiplicities 248 and 214, and six weight-12 forms with
      multiplicities 48, 36, 6, 6, 4 and 1 - together with the resulting six special
      j-values at the reference prime, namely 135, 1426, 2180, 2257, 2836 and 3344,
      and the corresponding supports 438, 433, 435, 391, 403 and 433 against a
      generic 439.
    citation: 'VAL-20260810-dc8bd8, complete_degeneration_stratification; EV-ICINV-6b6264'
    provenance: internal
    verified_by: >-
      TASK-20260904-5423ad read both records in full. It confirms the eight-block
      list and the six special j-values in the validation report and in the evidence
      record, and confirms the evidence record's own statement that this
      stratification is VALIDATOR-DERIVED AND NOT RUN-PRODUCED and appears under no
      frozen contract of its own, which is the standing reason it was never promoted.
    role: >-
      the input list this hypothesis re-derives from scratch as its first gate and
      then extends to the fifth summation polynomial
  - description: >-
      An independent structural consistency check on that stratification, not stated
      in the source idea, performed by TASK-20260904-5423ad - the support drop at
      each of the six loci EQUALS ITS BLOCK SIZE EXACTLY. The committed supports 438,
      433, 435, 391, 403 and 433 differ from the generic 439 by 1, 6, 4, 48, 36 and
      6, which is precisely the block-size multiset in the matching order.
    citation: 'Derived in this record from VAL-20260810-dc8bd8.'
    provenance: internal
    verified_by: >-
      TASK-20260904-5423ad, by arithmetic on the two committed lists. Machine
      verification is a deliverable of EXP-PFDR-a168bc.
    role: >-
      an internal cross-check that the block sizes and the support drops describe the
      same object, which the source idea assumed without checking
  - description: >-
      Independent re-derivation of the closed-form dictionary and of all six
      characteristic-zero j-values and their reductions.
    citation: 'Derived and hand-checked in this record.'
    provenance: internal
    verified_by: >-
      TASK-20260904-5423ad derived the dictionary from the standard j-invariant
      expression and evaluated it at all six weight-12 forms, obtaining 55296 over 5,
      55296 over 59, 27648 over 25, 221184 over 47, minus 13824, and 110592 over 19.
      It then checked ALL SIX reductions at the reference prime 4001 by hand
      arithmetic and each matched the committed multiset - 5 times 2257 differs from
      55296 by 11 times 4001; 59 times 2836 differs from 55296 by 28 times 4001; 25
      times 1426 differs from 27648 by 2 times 4001; 47 times 3344 differs from
      221184 by 16 times 4001; minus 13824 plus 4 times 4001 equals 2180; and 19
      times 135 differs from 110592 by 27 times 4001. The source idea claimed five of
      six; all six check. THIS IS HAND ARITHMETIC TO BE MACHINE-VERIFIED, NOT A RUN.
    role: >-
      independent confirmation of the dictionary and of the committed stratification
      at once, obtained before any experiment
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
  - metric: >-
      maximum multiplicity fraction, dimensionless, the largest number of
      coefficients sharing one weight-12 irreducible factor divided by the total
      coefficient count, at arity 4
    direction: higher
    minimum_effect: >-
      At least 0.05 on the elliptic arm, against a predicted value at or below 0.005
      on the curve-free weighted-homogeneous arm. The committed elliptic value is 48
      over 439, that is 0.109, so the predicted separation is a factor of about
      twenty and the band cannot be straddled by noise, since both quantities are
      exact integers over an exact integer.
  - metric: >-
      characteristic-zero j-values of the six weight-12 factors, exact rationals, and
      their reductions at the reference prime
    direction: different
    minimum_effect: >-
      EXACTLY 55296 over 5, 55296 over 59, 27648 over 25, 221184 over 47, minus
      13824, and 110592 over 19, reducing to exactly the multiset 135, 1426, 2180,
      2257, 2836 and 3344. SIX OF SIX. Any mismatch falsifies the dictionary or the
      committed stratification, and re-deriving the stratification decides which.
  - metric: >-
      block size against support drop, per locus, both integers
    direction: different
    minimum_effect: >-
      EXACTLY EQUAL at all six loci - 48, 36, 6, 6, 4 and 1. This is the internal
      consistency check derived in this record; a mismatch means the block sizes and
      the support drops are not describing the same object.
  - metric: >-
      number of weight-12 coefficient factors at arity 3, a count
    direction: different
    minimum_effect: >-
      EXACTLY ZERO, hence exactly two special j at that arity and no others, with
      supports 13, 9 and 10. A third locus at arity 3 falsifies the baseline
      embedding and halts the line.
  - metric: >-
      support drop of the fifth summation polynomial at each of the six loci, an
      integer per locus
    direction: lower
    minimum_effect: >-
      STRICTLY POSITIVE at all six - at least one monomial at each, six of six. Five
      of six is a NEGATIVE for monotonicity and is reported as such, never rounded up.
  - metric: >-
      planted-concentration detection, the recovered multiplicity and j-value of a
      deliberately planted shared weight-12 factor
    direction: different
    minimum_effect: >-
      EXACTLY the planted multiplicity and EXACTLY the predicted j-value. For a
      planted factor with alpha equal to 1 and beta equal to 7 the predicted j is
      1728 times minus 28 divided by minus 1, that is 48384. Failure to recover a
      planted concentration of known size means the pipeline cannot measure
      concentration and no arm is interpretable.
  test_boundary:
    instances:
    - >-
      The third, fourth and fifth summation polynomials over the polynomial ring in
      the two Weierstrass coefficients, over the rationals.
    - >-
      A curve-free weighted-homogeneous family - a polynomial in the same variables
      with the same monomial support whose coefficients are random
      weighted-homogeneous forms of the same weights, containing no summation
      polynomial and no curve. At least 20 independent draws.
    - >-
      A planted family in which a declared number of coefficients are forced to
      share a declared weight-12 factor.
    - >-
      Ten random weight-12 loci not among the six, for the specialisation-artifact
      null.
    parameters:
      arities: '3, 4, 5'
      expansion_convention: 'expanded affine, frozen before execution'
      reference_prime: 4001
      further_primes: 'two further ordinary primes and one prime above 2 to the 20, plus one prime dividing a denominator as the exceptional-set check'
      planted_multiplicity: 20
      planted_form: 'alpha equal to 1 and beta equal to 7, predicted j equal to 48384'
    implementation: >-
      Pure symbolic computation in TWO engines sharing no code. No sampling except
      the curve-free coefficients, the gauge unit and the random loci, all seeded and
      recorded. No minimal free resolution is required anywhere, so the resolution
      backend precondition that paused an earlier contract in this lane does not
      bind this one.
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 4
      maximum_memory_gb: 16
      maximum_runs: 6
  falsification_conditions:
  - >-
    Any of the six characteristic-zero values fails to reduce to its committed
    counterpart at the reference prime - the dictionary or the committed
    stratification is wrong and this record is withdrawn by a superseding one.
  - >-
    The arity-3 slice fails to reproduce 13, 9 and 10 exactly - the instrument is
    wrong and nothing downstream is admissible.
  - >-
    A random weight-12 locus shows a support drop - the drop is a specialisation
    artifact and every positive is void.
  - >-
    THE CURVE-FREE WEIGHTED-HOMOGENEOUS ARM SHOWS A COMPARABLE MAXIMUM MULTIPLICITY
    FRACTION - the concentration is produced by homogeneity rather than by the
    summation structure, and NO STATEMENT ABOUT ELLIPTIC CURVES OR THE ECDLP may be
    quoted from this record in either direction.
  - >-
    The fifth summation polynomial support equals the generic value at any one of
    the six loci - the degeneration set is arity-local, the object is not a property
    of the curve, and this is the single most informative outcome available.
  - >-
    An irreducible coefficient factor is found that is NOT weighted-homogeneous - the
    mechanism is wrong and the j-line factorisation of the object fails.
  - >-
    The planted concentration is not recovered at its known multiplicity and
    j-value - the pipeline cannot measure concentration and no arm is interpretable.
  interpretation_limits:
  - >-
    THIS IS A STATEMENT ABOUT POLYNOMIALS, not about the difficulty of any curve and
    not about isogeny classes. By the twist collision recorded above, support can
    never separate isogeny classes.
  - >-
    THE DICTIONARY IS NOT AN ELLIPTIC-CURVE FACT AND THE RECORD SAYS SO UP FRONT.
    Every weight-12 form in two variables of weights 4 and 6 is a combination of the
    cube of the first and the square of the second, because those are the only
    weight-12 monomials, so the dictionary follows from weighted homogeneity alone
    and would hold for any such family. Only the multiplicity concentration and the
    identity of the six ratios can carry elliptic-curve content, and the curve-free
    arm decides whether they do.
  - >-
    NO COST EFFECT IS CLAIMED AND NO TIME IS MEASURED. The lane's own committed data
    is that a 23 to 31 percent support drop at the two trivial loci moved Groebner
    time by minus 0.44 and minus 0.67 percent, and moved basis size the WRONG WAY.
    Reading this record as a speedup claim is a misuse of it.
  - >-
    Transfer to other primes is by the exceptional-set argument only, and the
    exceptional set must be computed rather than assumed empty.
  - >-
    UNTESTABLE AT REACHABLE SCALE, STATED RATHER THAN SHRUNK. Whether the
    degeneration set continues to grow monotonically for arities above 5 is NOT
    testable here or by any reachable computation - the sixth summation polynomial
    over the rationals in two symbolic coefficients is beyond the declared budget by
    a wide margin, and the record therefore establishes monotonicity, if at all, only
    from arity 4 to arity 5.
  - >-
    The rank-order statistic is SECONDARY and is reported with its null pass rate.
    With the tied pair excluded, four ranks remain and a Spearman correlation of 0.8
    or above is attained by 4 of the 24 permutations, so a random ranking passes with
    probability one in six. It is reported as corroboration and never as a test.
