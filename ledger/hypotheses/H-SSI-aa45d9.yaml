# H-SSI-aa45d9 — specified from IDEA-20261005-5cbadc.
# Protocol approval is DEC-20261006-b5e14c. This record asserts nothing
# about the edge counts. No 2-isogeny was enumerated in this design.
hypothesis:
  id: H-SSI-aa45d9
  question_id: RQ-SSI-001
  source_proposal: IDEA-20261005-5cbadc
  goal_id: null
  goal_id_note: >-
    ledger/questions/RQ-SSI-001.yaml does not name a goal. This design
    does not attach one and does not create a goal record.
  status: approved
  status_note: >-
    approved means the measurement protocol in EXP-SSI-8068ef is approved
    for a later executor. It does not mean the internal edges differ from
    the cut edges. Status moves only by DEC-20261006-b5e14c under the
    standing user authorization of 2026-09-06. No 2-isogeny edge was
    enumerated in this design.
  proposed_by: coordinator
  conversion_note: >-
    The edge split, the undirected Vélu census, the loop exclusion, the
    supersingular-neighbor control, and the prediction that the two edge
    collections differ are carried from IDEA-20261005-5cbadc. The
    Coordinator named the prime by a point-count census of j-invariants
    in F_p and froze that prime in the protocol. The edge sets themselves
    were not computed.

  statement: >-
    TEST BOUNDARY. The named prime is p = 11. Let S be the set of
    supersingular j-invariants in F_11. The design-session point-count
    census, which is instance selection and not the edge comparison,
    returned S = {0, 1}, where 1 ≡ 1728 (mod 11), and returned a
    one-element set at p = 5 and at p = 7. Edges are undirected pairs of
    distinct supersingular j-invariants, obtained by Vélu on order-2
    kernels over the 2-torsion field, stored once each. An internal edge
    has both ends in S. A cut edge has exactly one end in S. Let I be
    the internal edge set and let C be the cut edge set. Loops are
    excluded from both sets. The pre-registered prediction is that I and
    C differ, in the sense that their cardinalities differ by at least 1.
    Equality of the two edge sets is a negative, and so is equality of
    the two cardinalities. This is one pair of edge sets at p = 11. It
    is not a path search and it does not change a p^{1/4} or p^{1/3}
    baseline.

    DISTINGUISHABLE OUTCOMES. (1) The census confirms that 11 is the
    smallest odd prime, at most 300, with at least two supersingular
    j-invariants in F_p, the neighbor and model controls pass, and
    |I| ≠ |C|: the split is present at p = 11. (2) The same controls
    pass and |I| = |C|, including the case where I and C are equal as
    sets: negative. (3) A smaller odd prime has at least two rational
    supersingular j-invariants, a neighbor fails supersingularity, or
    two short-Weierstrass models of one j in S yield different neighbor
    sets: invalid, not evidence. (4) A timeout or a missing dependency:
    failed_infrastructure, not evidence.

  mechanism: >-
    The computed objects are two sets of undirected edges on the
    supersingular 2-isogeny graph at p = 11. An edge is internal when
    both ends lie in the F_11 supersingular subset and a cut when exactly
    one end does. The sets are disjoint by that classification, so they
    are equal as sets only when both are empty. Cardinality equality
    with both sets nonempty is still a negative, because the prediction
    is that the cardinalities differ. Either completed outcome is a toy
    gate on the graph used by F_p path-finding. Neither outcome is an
    algorithm and neither changes the p^{1/2} or p^{1/4} baselines
    recorded in the opened notes cited by the source idea.

  assumptions:
    - p = 11 is the smallest odd prime at most 300 with at least two supersingular j-invariants in F_p. The executor recomputes that census. A smaller prime makes the run invalid.
    - Supersingularity of a j-invariant in F_{p^2} is decided by the trace of Frobenius of one short-Weierstrass model being divisible by p.
    - Edges are undirected and simple. A loop, a 2-isogeny from a j-invariant to itself, is excluded from I and from C and is recorded separately.
    - The design session did not enumerate kernels. The prediction is fixed before that enumeration.

  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
    not_applicable_reason: >-
      This is a measurement of two edge sets at one prime. It is not a
      proof, an asymptotic bound, a certificate family, a reduction, or
      a closure argument.

  asymptotic_claim:
    problem: none — no complexity improvement is claimed
    prior_best: unchanged; the opened baselines stay Õ(p^{1/2}) and Õ(p^{1/4})
    time_exponent: unchanged
    memory_exponent: unchanged
    hidden_cofactor: none introduced
    claim_kind: not_applicable

  heuristic_assumptions:
    - id: HA-1
      formal_statement: >-
        At p = 11 only, the pair of cardinalities (|I|, |C|) imitates a
        uniform random partition of the incident 2-isogeny ends of S in
        the configuration model of a 3-regular graph, before
        automorphism identifications. The imitation is not a theorem
        about the supersingular graph. The sample is one prime. No
        transfer to a larger prime is claimed.
      random_model_justification: >-
        The source idea records that KN-TECH-024, opened by that
        idea-generator, states the supersingular ell-isogeny graph is
        (ell+1)-regular. For ell = 2 that is degree 3 before
        automorphism identifications. Distinct-j degree may be smaller.
        This design session did not re-open that note. The test uses
        the observed neighbor sets. Sample size one has no tail.
      supporting_results: []
      validation_experiment_ids:
        - EXP-SSI-8068ef
      falsification_condition: >-
        At p = 11 the controls pass and |I| = |C|, or the two edge sets
        are equal as sets.

  predictions:
    - metric: absolute difference of the cardinalities |I| and |C|
      direction: different
      minimum_effect: 1

  test_boundary:
    instances:
      - id: p11-supersingular-subset
        prime: 11
        predicted_S: [0, 1]
        note: 1 ≡ 1728 (mod 11)
    parameters:
      prime: 11
      prime_cap: 300
      isogeny_degree: 2
      edge_orientation: undirected
    implementation: >-
      Exact point counts to confirm the prime, then one Vélu census of
      order-2 kernels. No floating point. No path lengths. No edge was
      enumerated while specifying this record.
    budget:
      maximum_runs: 2
      note: >-
        One scientific execution at p = 11. maximum_runs 2 allows one
        infrastructure retry under a new run id. The scientific object
        is frozen at this prime.

  falsification_conditions:
    - The controls pass and the cardinalities of I and C are equal.
    - The controls pass and the internal edge set equals the cut edge set as sets.
    - No odd prime p ≤ 300 has at least two supersingular j-invariants in F_p. That outcome is a failed instance, not a difference of edge sets.

  interpretation_limits:
    - A difference at p = 11 is a graph statistic. It does not yield a walk, a path, or a lower exponent.
    - Equality at p = 11 removes this split at that prime. It does not close path-finding.
    - This measurement does not change an ECDLP exponent. The baselines Õ(p^{1/2}) and Õ(p^{1/4}) stay untouched. No p^{1/3} claim is made.
    - Toy-only, as RQ-SSI-001 requires for an effect at this size.

  citations:
    - ref: IDEA-20261005-5cbadc
      provenance: internal
      claim: >-
        At the smallest odd prime at most 300 with at least two
        supersingular j-invariants in F_p, the number of internal
        2-isogeny edges differs from the number of cut edges. Equality
        of those counts is the idea's negative. The idea does not claim
        a path or an exponent change.
      verified_by: >-
        coordinator design session 2026-10-06 read the proposal bytes
        from origin/design/hyper-fb6ec7-richelot, which match
        ledger/proposals/IDEA-20261005-5cbadc.yaml on this branch
    - ref: RQ-SSI-001
      provenance: internal
      claim: >-
        The question asks whether a concrete mechanism can improve a
        matched baseline against a surviving supersingular hardness
        assumption. Toy-only effects are hypothesis-generating only.
      verified_by: >-
        coordinator design session 2026-10-06 read
        ledger/questions/RQ-SSI-001.yaml
