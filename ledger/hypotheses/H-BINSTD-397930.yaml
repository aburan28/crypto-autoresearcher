  title: >-
    Phi_130(2) equals 409368176241571, 131 divides it once, and
    log2(131) lies strictly above 7.03.
  statement: >-
    phi(130) is 48. The next two indices are 130*131 = 17030 and
    17030*131 = 2230930, with Euler values 6240 and 817440. The
    quotient (2^65+1)/90123 is 409368176241571 with remainder 0, and
    2^65+1 is 36893488147419103233. That quotient equals
    131*3124947910241, and the cofactor leaves remainder 41 on
    division by 131. The inclusion-exclusion 65+26+10-13-5-2+1 is
    82, and 82+48 is 130. Then 130*131 is 17030. The power 2^703 is
    strictly below 131^100, and 2^704 is strictly above it, so
    log2(131) is strictly above 7.03 and strictly below 7.04. The
    order of 2 modulo 17 is 8. The integer 120 is 0 mod 8 and 1 mod
    17. The sum of 256^i for i from 0 through 16 is congruent to 0
    modulo 17 and is not equal to 17.
  mechanism: >-
    The proposal prices a torus row by these integers. This contract
    checks them. It does not build a field.
