  statement: >
    Fix the exact two-step chain-rule
    identity of the affine doubling
    Jacobian determinant on one frozen
    toy before any Gamma orbit, Semaev
    S_m, or nested LHW generator is
    built. Stage 0 asserts only that
    on REAL p=19, A=1, B=-1, P=(2,3)
    one has det D[4]_P = 4 =
    det D[2]_{[2]P} * det D[2]_P, and
    that the nearby KF claim det D[4]=1
    is false. NULL empty matrix
    rejected. y=0 rejected. This is
    not a Semaev relation, not a rho
    beat. Stages 1+ stay unauthorized.
  mechanism: >
    IDEA-20260913-768066 Stage 0 hard
    gate is the exact chain-rule
    product of two 2x2 affine doubling
    Jacobians. Form D[2] at P and at
    [2]P by formal differentiation,
    multiply determinants. Stage 0
    freezes that identity as exact
    tables. No Gamma orbit. No Semaev
    S_m. No nested LHW. This is a new
    GOAL-ECDLP-001 object after
    P-S0-COEFFSK. It is not Stage 1
    of EXP-ECDLP-bf222c and not
    Stage 1 of EXP-ECDLP-e9dd89.
