  title: >-
    The written ceilings have binomial counts 19900 and 9880, weights
    4 and 6, and the two rate expressions differ by the factor m.
  statement: >-
    At the written ceilings (m, B) = (3, 200) and (4, 40), the exact
    unordered (m-1)-subset counts are 19900 and 9880. The raw powers
    are 40000 and 64000, and 64000 is strictly larger. Dividing by
    (m-1)! gives 20000 exactly at m = 3, which exceeds 19900 by 100,
    and a non-integer at m = 4 (quotient 10666, remainder 4) that sits
    strictly below 20000. The gap between those quotients is 28000/3,
    strictly above 9333 and strictly below 9334. The m = 4 power
    quotient exceeds 9880 by 2360/3, strictly above 786 and strictly
    below 787. Relation weight 2*(m-1) is 4 and 6. Point-addition
    count m-2 is 1 and 2. A component of size k yields k-1 relations,
    so sizes 1, 2 and 5 yield 0, 1 and 4. At m = 3 the cross-multiplied
    factor-m identity 4000000*6 = 8000000*3 holds, and the unscaled
    comparison 4000000*6 = 8000000 does not. At m = 4 the identity
    4*2560000*6 = 24*2560000 holds.
  mechanism: >-
    The proposal writes a power quotient and a factorial rate side by
    side. This contract checks those integers at the two written
    ceilings. It does not enumerate a factor base.
