hypothesis:
  id: H-PFDR-e0988d
  question_id: RQ-ECDLP-002
  source_idea_id: IDEA-20260815-6ee0d3
  batch_id: BATCH-2eaca1
  title: >-
    The additive/multiplicative mismatch stated with quantifiers, and the
    residual-correlation question it cannot settle: integer lifts of
    x-coordinates along a scalar orbit on E(F_p) carry NO smoothness
    correlation that survives a shape-matched shuffled null, and in
    particular the composition statistic delta_add is zero to within a
    stated minimum detectable effect -- with the sharper claim that whatever
    correlation IS found is reproduced by a nodal or cuspidal cubic and by a
    bare multiplicative orbit, hence is a statement about integer lifts of
    cyclic orbits in F_p and not about elliptic curves or the ECDLP
  statement: >-
    (A) THE DERIVATION, WITH QUANTIFIERS. Fix a prime p, an elliptic curve
    E/F_p, a point P of prime order n, and the lift convention L(z) = the
    least non-negative integer representative of z in [0, p). Fix a
    smoothness bound B and write Sm_B(z) for the predicate 'L(z) is
    B-smooth'. Index calculus over F_p^* rests on a compositional identity:
    FOR ALL k, j, L(g^{k+j}) is determined by L(g^k) and L(g^j) as
    L(g^k) L(g^j) mod p, and when L(g^k) factors over the factor base the
    factorisation yields a LINEAR relation among the discrete logarithms of
    the factor-base primes. Neither half of that has an analogue here. The
    exact statement of the mismatch is: THERE IS NO FUNCTION F such that FOR
    ALL E, P, k, j, L(x((k+j)P)) = F(L(x(kP)), L(x(jP))) -- because the
    x-line addition law is 2-valued, x((k+j)P) and x((k-j)P) being the two
    roots of a quadratic whose coefficients depend on x(kP), x(jP) AND on
    the curve coefficients, so no function of the two lifts alone determines
    either root; AND, even given the correct root, a factorisation of an
    x-coordinate over a factor base of RATIONAL PRIMES yields no relation in
    the additive group generated by P, because the primes dividing an
    integer representative are not the image of any subgroup or of any
    curve-defined set under a homomorphism. Smoothness is a predicate on
    Z; the group is E(F_p); there is no ring map between them. THIS IS A
    DERIVATION ABOUT NON-EXISTENCE OF A COMPOSITION LAW, NOT A THEOREM THAT
    SMOOTHNESS IS UNCORRELATED. The two are routinely conflated, and the
    second is an empirical question this record makes measurable.
    (B) THE MEASURED CLAIM. On the tested ladder, with the lift convention
    above and the smoothness parameter fixed as u = log(p)/log(B) rather
    than as B, all three of the following hold. H1 (MARGINAL): the
    smoothness rate of the orbit multiset equals the exact reference
    Psi(p, B)/p to within binomial sampling error, i.e. the set of
    x-coordinates of E(F_p) is smoothness-typical. H2 (LAG): the excess
    two-point correlation between Sm_B(x(kP)) and Sm_B(x(2kP)) lies inside
    the empirical null band generated by seeded shuffles of the same
    multiset. H3 (COMPOSITION, THE ONE THE FOLKLORE IS ABOUT): the x-line
    composition statistic delta_add, defined in the mechanism below on
    UNORDERED pairs so that the 2-valued x-line addition is respected, is
    zero to within the minimum detectable effect established by spike
    injection.
    (C) THE SCOPE CLAIM, WHICH IS THE ONE THAT BINDS. Any nonzero value of
    any of the three statistics is a claim about ELLIPTIC CURVES only if it
    is absent from the shape-matched non-elliptic objects run through the
    identical pipeline: the cuspidal cubic y^2 = x^3 (nonsingular locus a
    group isomorphic to (F_p, +), DLP trivial), the nodal cubic
    y^2 = x^2(x + 1) (nonsingular locus a group isomorphic to F_p^*, DLP
    as easy as the F_p^* DLP), and the bare multiplicative orbit
    {L(g^k)}. All three have an orbit, an x-like coordinate, a lift, and
    the same 2-to-1 coordinate symmetry as E; none is an elliptic curve and
    on none is the discrete logarithm hard. H4: a signal present on E and
    also present at comparable magnitude on any of those three is NOT
    evidence about elliptic curves and may not be described as such.
    (D) THE ARTIFACT CLAIM. H5: any excess correlation that is real rather
    than an artifact must decay as p grows, because the number of orbit
    points grows with p while the number of small primes below B = p^{1/u}
    grows only as p^{1/u}/log p; a correlation flat in p over the tested
    octaves is recorded as an artifact of the pipeline, not as a finding.
    This record's honest prior is that H1, H2, H3 all hold, that the
    folklore is thereby confirmed at the tested scope with a number behind
    it for the first time in this program, and that the deliverable is the
    stated upper bound on delta_add rather than the absence of a signal.
  mechanism: >-
    ORBIT ENUMERATION AND THE EXACT REFERENCE. For each p, build the
    smallest-prime-factor sieve on [1, p) once; it gives the complete
    factorisation of every lift in O(log) time AND the exact count
    Psi(p, B) of B-smooth integers below p, so the marginal reference is
    computed rather than approximated by Dickman rho. Walk the orbit
    incrementally, Q <- Q + P, normalising in blocks with Montgomery's
    batch-inversion trick, and store the bit vector S_B[k] = Sm_B(x(kP))
    for k in [1, (n-1)/2]. The half range is not an optimisation: x(kP) =
    x(-kP) makes S_B[k] = S_B[n-k] identically, so a statistic computed on
    the full range reports that trivial symmetry as correlation. This is
    the design error the record exists to avoid, and it is why the tracked
    object is the orbit ON THE X-LINE, i.e. the quotient of the orbit by
    plus-or-minus one.
    THE THREE STATISTICS. MARGINAL rate_B = mean of S_B over the half
    orbit, compared with Psi(p, B)/p by a Wilson interval. LAG delta_2 =
    P(S_B[k] = 1 and S_B[2k] = 1) - rate_B^2, the excess of the two-point
    table, referred to the empirical distribution of the same quantity over
    at least 32 seeded shuffles of the multiset. COMPOSITION, on unordered
    pairs, respecting the 2-valued x-line law:
      delta_add = P(S_B[k+j] = 1 or S_B[k-j] = 1 | S_B[k] = 1 and S_B[j] = 1)
                  - P(S_B[a] = 1 or S_B[b] = 1),
    the second term taken over seeded uniform (a, b), estimated on a seeded
    sample of M unordered pairs (k, j). delta_add is the quantity the
    folklore is actually about: it asks whether a smooth pair makes its
    x-line sum-or-difference smooth, which is the only route by which
    smoothness could compose under the group law.
    WHY A SPIKE INJECTION IS REQUIRED. No object is known on which
    delta_add is nonzero -- index calculus over F_p^* does NOT work by
    orbit smoothness correlation, it works because one smooth lift yields
    one linear relation, so F_p^* is a matched NULL here and not a positive
    control. A statistic with no positive control can report zero because
    the pipeline is broken. So the pipeline is calibrated by injection: the
    measured bit vector is perturbed on a seeded fraction of triples to
    plant a delta_add of known magnitude epsilon, and the pipeline must
    recover epsilon inside its stated interval at epsilon in {0.001, 0.003,
    0.01}. The smallest recovered epsilon is the MINIMUM DETECTABLE EFFECT
    and it is what converts a null result from 'we saw nothing' into
    'delta_add is below this number at this scale', which is the only form
    of null result this record is willing to report.
    WHY THE NON-ELLIPTIC ARMS ARE SHAPE-MATCHED. Cuspidal: the nonsingular
    locus of y^2 = x^3 is isomorphic to (F_p, +) by (x, y) -> x/y, inverse
    s -> (s^{-2}, s^{-3}), so the orbit x-coordinates are x(k) = (ks)^{-2}
    and x(k) = x(-k), the same 2-to-1 symmetry as E. Nodal: on
    y^2 = x^2(x + 1) the substitution y = mx, m^2 = x + 1 gives the
    isomorphism to F_p^* with w = (m + 1)/(m - 1), inverse
    x(w) = 4w/(w - 1)^2, and x(w) = x(1/w), again the same symmetry. Both
    parametrisations are checked numerically by the pipeline before use
    (they are asserted here from a recalled textbook source and are not
    taken on trust). These two objects are the null objects that make the
    scope claim (C) checkable: they carry an orbit, an x-coordinate, an
    integer lift and the coordinate symmetry, and they carry no hard
    discrete logarithm at all.
  assumptions:
    - >-
      The lift convention is the least non-negative residue in [0, p) and
      is frozen; a different convention defines a different predicate and a
      different experiment.
    - >-
      The smoothness parameter is u = log(p)/log(B), swept, NOT a fixed B;
      fixing B makes the rate incomparable across p and makes the decay
      test in H5 meaningless.
    - >-
      n = ord(P) is prime and close to p, so k -> 2k and k -> k + j are
      bijections on the orbit and the half-range quotient by plus-or-minus
      one is exact.
    - >-
      A cell whose expected smooth count Psi(p, B) falls below 200 is
      declared UNDERPOWERED before any data is seen and is excluded from
      every fit; this is the pre-registered handling of the small-p
      degeneracy confounder.
    - >-
      The sieve, the orbit walk, and the batch inversion are exact integer
      arithmetic; no floating point enters any counted quantity.
  proof_search_map:
    bottleneck: >-
      The step index calculus over F_p^* has and E(F_p) lacks: a map from
      'the integer lift factors over a set of rational primes' to 'a linear
      relation in the group'. In F_p^* the factor base is a set of GROUP
      ELEMENTS and factorisation of the lift is an identity IN THE GROUP.
      On E(F_p) the rational primes are not group elements and the
      factorisation is an identity in Z with no image in E(F_p). Removing
      that step is what would change the theorem; nothing measured here
      removes it, and claim (A) is the statement that it cannot be removed
      by any function of the lifts.
    baseline_embedding:
      parameter_slice: >-
        The multiplicative arm at the same p, same u, same pipeline: the
        exact boundary at which the classical method works. It reproduces
        the classical fact that the marginal smoothness rate of the lifts
        of a multiplicative orbit equals Psi(p, B)/p, which is the only
        distributional input classical index calculus uses.
      reproduction_check: >-
        Numeric: the multiplicative arm's rate must equal Psi(p, B)/p
        within a Wilson interval at every powered cell, and its delta_add
        must be null. If the multiplicative arm shows a nonzero delta_add
        the pipeline is measuring an artifact and no elliptic-curve number
        is admissible.
    observation_collision:
      observable: >-
        The triple (rate_B, delta_2, delta_add) as a function of (p, u),
        computed from the bit vector S_B on the x-line.
      distinct_preimage_search: >-
        REQUIRED AND BLOCKING. Four distinct preimages are run through the
        identical code path: random integers matched to the size
        distribution (no group at all), the multiplicative orbit (a group,
        no curve), the cuspidal cubic (a curve-shaped object whose group is
        additive and whose DLP is trivial), and the nodal cubic (a
        curve-shaped object whose group is multiplicative and whose DLP is
        as easy as F_p^*). Every one of them can produce an x-coordinate
        orbit with an integer lift and the same 2-to-1 symmetry. If any
        reproduces the observable, the observable does not distinguish
        elliptic curves from objects on which the discrete logarithm is
        easy, and no conclusion about the ECDLP may be drawn from it.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the single lag statistic delta_2 by the x-line
          composition statistic delta_add on unordered pairs.
        predicted_gain: >-
          delta_2 tests a chain; delta_add tests the group law, which is
          the object of the folklore. A null delta_2 with a nonzero
          delta_add would be the only result in this record capable of
          motivating any further work, and delta_2 alone cannot see it.
      - transform: observable_fiber
        proposed_object: >-
          Hold (p, u, lift convention, pipeline) fixed and vary only the
          object: elliptic, cuspidal, nodal, multiplicative, random.
        predicted_gain: >-
          Attributes any signal to the elliptic curve, to a group law of
          any kind, or to the integer lift, before it is believed. This is
          the standing scope constraint of the pfdr-battery-20260904 round
          instantiated as an experimental arm.
    quantifier_order: >-
      CLAIMED (A): THERE IS NO F such that FOR ALL (E, P, k, j) the lift of
      x((k+j)P) is F of the lifts of x(kP), x(jP). NOT CLAIMED: that FOR
      ALL (E, P) the smoothness predicate is independent along the orbit --
      that is the empirical part and is measured, not derived. MEASURED:
      FOR EACH cell of the declared (p, u, arm) ladder, point estimates and
      95 percent intervals for rate_B, delta_2 and delta_add, plus the
      fitted decay slope of any excess in log p with its interval. The
      vacuous reading 'for all E there exists a k on which smoothness
      fails to correlate' is not what any of H1 to H3 means.
    method_ceiling:
      strongest_certifiable_claim: >-
        'On the tested (p, u, curve, arm) ladder with the frozen lift
        convention, the x-line composition statistic delta_add of the
        integer lifts of x-coordinates along a scalar orbit is bounded in
        absolute value by the measured minimum detectable effect, and the
        marginal smoothness rate agrees with the exact reference
        Psi(p, B)/p.' It cannot certify anything at cryptographic p, cannot
        certify absence of a correlation smaller than the MDE, and cannot
        certify that no other lift convention or coordinate carries one.
      nearby_object_control: >-
        The nodal cubic, where the same measurement is made on an object
        whose discrete logarithm problem is EASY. Any pipeline that reports
        an elliptic-curve-specific signal must report a different answer
        there, and if it does not, the signal is not about hardness.
    proof_obligations:
      - claim: >-
          No function of the two lifts determines the lift of the sum,
          because the x-line addition is 2-valued and depends on the curve
          coefficients.
        responsibility: correctness
      - claim: >-
          The half-range quotient by plus-or-minus one is exact for prime n
          and removes the trivial S[k] = S[n-k] symmetry from every
          statistic.
        responsibility: correctness
      - claim: >-
          Psi(p, B) computed from the sieve equals the exact count of
          B-smooth integers below p.
        responsibility: baseline
      - claim: >-
          The cuspidal and nodal parametrisations are group isomorphisms,
          verified numerically before use rather than assumed from the
          recalled citation.
        responsibility: interface
      - claim: >-
          The spike injection recovers a planted delta_add of known
          magnitude, establishing the minimum detectable effect that every
          null statement is scoped to.
        responsibility: success_probability
      - claim: >-
          Underpowered cells are excluded by a rule fixed before any data
          is seen.
        responsibility: scope
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        SMOOTHNESS-TYPICALITY OF THE X-LINE. For E/F_p with P of prime
        order n, and B = p^{1/u} with u in the tested range, the fraction
        of k in [1, (n-1)/2] for which L(x(kP)) is B-smooth equals
        Psi(p, B)/p + O(p^{-1/2} log p) uniformly in u on the tested
        ladder.
      random_model_justification: >-
        Rigorous ingredient: the Weil bound gives square-root cancellation
        for character sums over the points of E, which controls the
        distribution of x(kP) in intervals and forces the x-coordinate
        multiset to be equidistributed in F_p up to O(sqrt(p)). Classical
        ingredient: the exact count Psi(p, B) of B-smooth integers below p,
        used here as a computed reference rather than through its
        Dickman-de Bruijn asymptotic. THE GAP, STATED: interval
        equidistribution does NOT imply smoothness-typicality, because
        smoothness is not an interval condition and a set equidistributed
        in intervals can still be biased on a sparse set. That composition
        is the heuristic content and is exactly what H1 measures.
      supporting_results:
        - ref: IDEA-20260815-6ee0d3
          provenance: internal
          claim: >-
            HEUR-LIFT-1 as originally stated, its rigorous_support naming
            the Weil bound and the Dickman-de Bruijn density, and its
            explicit admission that the composition does not follow.
          verified_by: coordinator, TASK-20260904-b2a7e9 (record read in full)
      validation_experiment_ids:
        - EXP-PFDR-e74701
      falsification_condition: >-
        A measured rate_B differing from Psi(p, B)/p by more than 3 Wilson
        standard errors, reproducibly across at least 3 of the 4 curves at
        a given p and at a majority of powered u values, while the
        multiplicative and random arms at the same p and u agree with the
        reference.
    - id: HEUR-002
      formal_statement: >-
        NO COMPOSITION SIGNAL. For E/F_p with P of prime order n, and for
        every u on the tested ladder, the x-line composition statistic
        delta_add satisfies |delta_add| <= MDE(p, u), where MDE(p, u) is
        the minimum detectable effect established by the spike-injection
        control at that cell.
      random_model_justification: >-
        The justification is claim (A) and nothing stronger: there is no
        composition law carrying smoothness, so under any model in which
        the lifts behave like independent draws conditioned only on the
        multiset, delta_add is zero. This is a heuristic and not a
        theorem, because absence of a composition LAW does not entail
        absence of a statistical DEPENDENCE -- that entailment is the
        conflation this record separates. The honest prior is that the
        heuristic holds.
      supporting_results:
        - ref: IDEA-20260815-6ee0d3
          provenance: internal
          claim: >-
            The prediction that no orbit correlation survives the shuffled
            null, and the record's own honest prior of 0.1 that any does.
          verified_by: coordinator, TASK-20260904-b2a7e9 (record read in full)
      validation_experiment_ids:
        - EXP-PFDR-e74701
      falsification_condition: >-
        |delta_add| exceeding MDE at a Bonferroni-corrected 5 percent level
        on at least 3 of the 4 curves at a given p, at a majority of
        powered u values, AND absent from the random, multiplicative,
        cuspidal and nodal arms at the same p and u. If it is present on
        any of those arms the heuristic is not falsified about curves;
        the pipeline has found something about integer lifts.
  structural_ingredients:
    - description: >-
        Square-root cancellation for character sums over the points of an
        elliptic curve over F_p, used to justify equidistribution of the
        x-coordinate multiset in intervals.
      citation: 'Weil bound for character sums on curves over finite fields (standard; see e.g. Lidl-Niederreiter, Finite Fields, Ch. 5)'
      provenance: recalled
      verified_by: null
      role: >-
        rigorous half of HEUR-001; a pointer for the reviewer, not support
    - description: >-
        The nonsingular locus of the cuspidal cubic y^2 = x^3 over F_p is
        isomorphic to the additive group (F_p, +) via (x, y) -> x/y; the
        nonsingular locus of the split nodal cubic is isomorphic to F_p^*.
      citation: 'Silverman, The Arithmetic of Elliptic Curves, Prop. III.2.5'
      provenance: recalled
      verified_by: null
      role: >-
        construction of the two non-elliptic null objects; RECALLED, and
        the contract therefore requires the parametrisations to be verified
        numerically as a homomorphism before use rather than trusted
    - description: >-
        The count Psi(x, B) of B-smooth integers below x, used here as an
        EXACTLY COMPUTED reference from the sieve rather than through its
        Dickman-de Bruijn asymptotic, so that no asymptotic approximation
        enters the marginal comparison.
      citation: 'computed in-experiment from the smallest-prime-factor sieve; no external result relied on'
      provenance: internal
      verified_by: coordinator, TASK-20260904-b2a7e9
      role: exact marginal reference for HEUR-001
    - description: >-
        The folklore statement of the additive/multiplicative mismatch and
        the request that it be stated with quantifiers and measured.
      citation: IDEA-20260815-6ee0d3
      provenance: internal
      verified_by: coordinator, TASK-20260904-b2a7e9 (record read in full)
      role: source of the claim and of the null-object design
  reduction_chain:
    core_problem: >-
      No attack problem is reduced and no algorithm is proposed. The core
      statement is a derivation that the F_p^* composition step has no
      analogue on E(F_p), plus a bounded empirical statement about the
      residual correlation the derivation cannot settle.
    corollaries: []
  predictions:
    - metric: >-
        P1 -- rate_B against the exact reference Psi(p, B)/p, on the
        elliptic arm, per powered (p, u) cell
      direction: different
      minimum_effect: >-
        Predicted INDISTINGUISHABLE: |rate_B - Psi(p,B)/p| within 3 Wilson
        standard errors. A reproducible difference is an equidistribution
        failure and a genuine finding needing its own proposal, not a
        result of this one.
    - metric: >-
        P2 -- delta_2 against the empirical shuffled-null band (at least 32
        seeded shuffles per cell)
      direction: different
      minimum_effect: >-
        Predicted INSIDE the band at the Bonferroni-corrected 5 percent
        level. The band, not a parametric formula, is the reference.
    - metric: >-
        P3 -- delta_add on the x-line, unordered pairs, per powered cell
      direction: different
      minimum_effect: >-
        Predicted |delta_add| <= MDE. The DELIVERABLE IS THE BOUND: the
        reported result is 'delta_add below X at 95 percent confidence at
        this (p, u)', never 'no correlation'.
    - metric: >-
        P4 -- spike-injection recovery of a planted delta_add at epsilon in
        {0.001, 0.003, 0.01}
      direction: different
      minimum_effect: >-
        FORCED: each planted epsilon recovered within its 95 percent
        interval. A failure to recover epsilon = 0.01 is an instrument
        failure and voids every null statement in the record.
    - metric: >-
        P5 -- the non-elliptic arms (random integers, multiplicative orbit,
        cuspidal cubic, nodal cubic) on all three statistics
      direction: different
      minimum_effect: >-
        Predicted STATISTICALLY IDENTICAL to the elliptic arm on all three.
        If they are identical AND the elliptic arm shows a signal, the
        signal is not about elliptic curves. If the elliptic arm alone
        differs, that difference is the entire finding and must be
        replicated before it is described in curve language.
    - metric: >-
        P6 -- decay of any measured excess with p, fitted as a slope of
        log|excess| against log p over the 5 declared primes
      direction: lower
      minimum_effect: >-
        Any real excess must decay: the fitted slope must be negative with
        a 95 percent interval excluding 0. A slope interval containing 0
        (flat in p) marks the excess an ARTIFACT and it is recorded as a
        controlled null, never as a finding. This is the canonical artifact
        tell of docs/inventor-protocol.md applied to this measurement.
    - metric: >-
        P7 -- the trivial symmetry check S_B[k] = S_B[n-k] on the full
        range, reported and then quotiented out
      direction: different
      minimum_effect: >-
        FORCED EXACT on the elliptic, cuspidal and nodal arms (it is an
        identity), and FORCED ABSENT on the multiplicative and random arms.
        A statistic computed on the full range would report this identity
        as perfect correlation; reporting it explicitly is how the record
        proves it was removed rather than merely claiming so.
  test_boundary:
    instances:
      - >-
        p in {65537, 262147, 1048583, 4194319, 16777259} (5 primes spanning
        2^16 to 2^24); 4 curves per p with |E(F_p)| prime, selected by a
        declared seeded search; one generator P per curve
      - >-
        u in {1.5, 2.0, 2.5, 3.0, 3.5}, B = round(p^{1/u}); a cell with
        Psi(p, B) < 200 is UNDERPOWERED and excluded from every fit
      - >-
        arms: ELLIPTIC; NULL-RANDINT (uniform integers in [0, p));
        NULL-MULT (multiplicative orbit L(g^k)); NULL-CUSP (cuspidal
        cubic); NULL-NODE (nodal cubic); NULL-SHUFFLE (seeded shuffles of
        the elliptic multiset, computed inside the elliptic cell);
        SPIKE (injection calibration, computed inside the elliptic cell)
    parameters:
      lift_convention: 'least non-negative residue in [0, p)'
      orbit_range: 'k in [1, (n-1)/2]; the x-line quotient by plus-or-minus one'
      composition_sample: 'M = 2000000 seeded unordered pairs (k, j) per cell'
      shuffles_per_cell: 32
      injection_levels: '0.001, 0.003, 0.01'
      excluded_by_name: >-
        no cell with Psi(p, B) < 200; no p above 2^24, where full orbit
        enumeration exceeds the memory contract
    implementation: >-
      Exact integer arithmetic throughout. Smallest-prime-factor sieve on
      [1, p) as a uint32 array (64 MB at p = 2^24); incremental orbit walk
      with Montgomery batch inversion in blocks; smoothness bit vectors
      stored per (cell, u); all statistics computed by array lookup from
      the bit vectors. No solver, no Groebner basis, no floating point in
      any counted quantity.
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 24
      maximum_memory_gb: 8
      maximum_runs: 48
  falsification_conditions:
    - >-
      F1 INSTRUMENT. The spike injection fails to recover epsilon = 0.01,
      or the multiplicative arm shows a nonzero delta_add, or the
      cuspidal/nodal parametrisation fails its numerical homomorphism
      check, or P7 does not hold exactly. Instrument failure; no
      statistic about any curve is reported and nothing is concluded.
    - >-
      F2 MARGINAL. P1 fails reproducibly on the elliptic arm while the
      random and multiplicative arms agree with the reference: the
      x-coordinate multiset of E(F_p) is smoothness-atypical. HEUR-001 is
      falsified. This is a genuine equidistribution finding, it is NOT an
      attack, and it requires its own proposal and its own replication
      before any interpretation.
    - >-
      F3 COMPOSITION, THE INTERESTING FAILURE. P3 fails: |delta_add|
      exceeds MDE on at least 3 curves at a p, at a majority of powered u,
      AND is absent from all four non-elliptic arms, AND decays with p per
      P6. HEUR-002 is falsified and there is genuine, scoped composition
      structure. Nothing about the ECDLP follows without a separate
      hypothesis; the required next step is replication at independent
      curves and seeds before any language beyond 'measured correlation'
      is used.
    - >-
      F4 ARTIFACT. Any excess is measured but is flat in p (P6 slope
      interval contains 0), or is reproduced by NULL-RANDINT,
