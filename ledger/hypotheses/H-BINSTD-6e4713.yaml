  title: >-
    Cap-locus index calculus on ECC2K-130 has a shared cost paid once and a
    per-target cost paid per logarithm, so the reachability table carries a
    preprocessing and multi-target budget row beside the single-target row;
    the row's frontier column is T_gen = sqrt(N_prime / B_cap) with
    B_cap T_gen = P_gen exactly, and its crossing windows in the oracle excess
    g are arithmetic on the model, validated on binary toy cells through
    heuristics H1 and H2

  statement: >-
    Let r be the 129-bit prime with #E(F_2^131) = 4r on ECC2K-130, and
    N_prime = r/262 the effective generic size (negation and the 131 Frobenius
    classes), log2 N_prime = 120.9666. Let B_cap(m) = (m factorial times
    2^131)^(1/m) be the cap locus at arity m (mu = 1: one decomposition per
    target on average), and C the per-attempt cost of an arity-m decomposition
    oracle at that locus, in group-operation equivalents.
    (A) SPLIT. Under assumptions A1-A5 and heuristic H1, the cost of L
    logarithms in the order-r subgroup of one curve is IC(L) = T_shared +
    L times kappa_m times C, where T_shared = A(mu) B_cap C + m B_cap^2 is
    paid once (relation collection at one relation per base element plus the
    linear algebra), A(mu) = 1/(1 - exp(-mu)) is the attempts per success
    (1.582 at mu = 1), and kappa_m = A(mu) / (1 - m exp(-m)) is the attempts
    per fresh target including the usable-decomposition retry (1.707 at
    m = 4, 1.637 at m = 5; the proposal's rounding is 1.6). Per-target cost
    therefore falls as L^-1 until L is about T_shared / (kappa_m C) and is
    flat at kappa_m C beyond; generic multi-target rho, under heuristic H2,
    has per-target cost falling as L^(-1/2) at every L. At L = 1 the split
    reduces to the single-target product law term by term.
    (B) WINDOWS. Write C = 2^(c0 + g), with c0 the single-target per-attempt
    budget of the pinned D3 column (33.076 bits at m = 5; 11.010 bits at
    m = 4, which is a sub-cap value at B = 2^29.036) and g the oracle excess in
    bits. Under H1 and H2 with the LA term and the attempt constants kept,
    the model inequality IC(L) < 2^60.8090 sqrt(L) at m = 5 holds exactly for
    L strictly between the two roots of a s^2 - s + b = 0 in s = sqrt(L),
    a = kappa_5 C / rho and b = T_shared / rho, and the window is non-empty
    if and only if g < 12.26 (D3 convention; 12.92 in the proposal's 32.4
    convention, against its stated 13.2). Design figures at m = 5, D3
    convention: g = 0 gives log2 L in [1.22, 54.04]; g = 6 gives [13.02,
    42.04]; g = 10 gives [21.05, 34.01]; g = 12 gives [25.76, 29.30]; g = 13
    is empty. In the proposal's convention (C = 2^(32.414 + g)): g = 0 gives
    [0.00, 55.37]; g = 6 gives [11.70, 43.37]; g = 10 gives [19.71, 35.35];
    g = 12 gives [23.92, 31.14]; g = 13 is empty. The proposal's own window
    [2g, 56.8 - 2g] with critical g 13.2 is shown beside these; it dropped the
    per-target constant and the LA term. At m = 4 the shared cost depends on
    the base size B, which is free; the window is stated exactly as the model
    M4(B) of EXP-BINSTD-532d7f with two named slices: at the single-target
    sub-cap optimum B = 2^29.036 (C = 2^(11.010 + g)), the window is
    non-empty iff g < 14.79, with g = 0 giving [0.00, 60.50], g = 6 giving
    [9.42, 48.50], g = 10 giving [17.36, 40.50], g = 13 giving [23.42, 34.43],
    g = 14 giving [25.64, 32.22]; at the cap B_cap = 2^33.896 the shared cost
    is LA-dominated (4 B_cap^2 = 2^69.79 above rho) and the window at any C
    below 2^35 opens only at L about 2^17.97 and closes at L = 2^(2(60.04 -
    log2 C)). The envelope over B is a Stage 0 deliverable of the committed
    code. The proposal expected the m = 4 window to be narrower; on the
    sub-cap slice it is wider at the top, and this is recorded as a design
    finding, not a result.
    (C) FRONTIER COLUMN. Cap-locus index calculus is a preprocessing
    algorithm with advice S = B_cap words (the factor-base logarithms),
    online cost kappa_m C per logarithm and precomputation A(mu) B_cap C +
    m B_cap^2. At matched advice the generic frontier of KN-LIT-013 (as
    reported; source not read here, impediment IMP-CGK) is T_gen =
    sqrt(N_prime / S) online and P_gen = sqrt(N_prime S) precomputation, up
    to the constants disclosed in statement_note. The column at m in 4, 5, 6,
    8, 16 reads T_gen = 43.54, 46.69, 48.78, 51.34, 55.01 bits and P_gen =
    77.43, 74.27, 72.19, 69.63, 65.96 bits (design figures). Identity: B_cap
    T_gen = sqrt(N_prime B_cap) = P_gen exactly, so at C = T_gen the
    leading-order precomputation of index calculus equals P_gen, and the
    linear-algebra term m B_cap^2 (69.79, 57.48, 49.42, 39.57, 25.91 bits)
    sits below P_gen at every m >= 4 by 7.64, 16.79, 22.78, 30.05, 40.05
    bits. Against the pinned D3 column (11.01, 33.08, 37.39, 42.52 bits at
    m = 4, 5, 6, 8) the column T_gen is higher by 32.53, 13.61, 11.39, 8.82
    bits; against the proposal's absorbed mu = 1 column (11.0, 32.4, 36.7,
    42.2) it is higher by 32.5, 14.3, 12.1, 9.1 bits, the proposal's figures.
    At m = 16 no pinned comparator exists; the D3-convention design figure
    49.86 and the absorbed record's 49.7 are both shown. In exponent form,
    log2 T_gen(n, m) = (1/2)(1 - 1/m) n - (3 + log2 n + (log2 m factorial)/m)/2
    for a cofactor-4 Koblitz curve, higher than the single-target cap line
    (1/2 - 1/m) n by n/(2m) bits.
    (D) WHAT IS AND IS NOT ASSERTED. No oracle is made cheaper and no oracle
    is claimed to have any cost. The table has two budget rows; the corpus
    priced only the first; every m >= 4 oracle record is read against both.
    Nothing here places any algorithm below the generic frontier, on any
    axis, on any row.

  statement_note: >-
    CONSTANTS AT C = T_gen, disclosed (plan J3). With the attempt constant
    kept, P_IC(T_gen) = 1.582 P_gen + m B_cap^2, which is 0.66 bit above
    P_gen at every m >= 4 (the LA term adds less than 0.005 bit at m = 4 and
    less elsewhere), and the online cost kappa_m T_gen is 0.77 (m = 4) or
    0.71 (m = 5) bit above T_gen. On the generic side, KN-LIT-013's bound is
    Omega-tilde with unquantified polylog slack, and Bernstein-Lange's
    concrete constants at table size l^(1/3) are 1.24 (precomputation) and
    1.77 (online) (KN-LIT-7cc07f, abstract-level; relayed through
    IDEA-20260920-2e37b3's retrieved reading of the abstract). Relative to
    those constants an oracle at exactly C = T_gen sits about 0.35 bit above
    the Bernstein-Lange point on precomputation and about 0.1 bit below it
    on online cost at m = 5: ON the frontier within 0.5 bit, not below it.
    The proposal's two-axis reading requires C below T_gen by more than these
    constants and is tripwire TW-01, never an outcome here. The
    1.58-attempt factor: at mu = 1 a target decomposes with probability
    1 - 1/e = 0.6321, so attempts per success are 1/(1 - 1/e) = 1.5820, that
    is 0.6617 bit; the pinned D3 column charges one attempt per relation and
    the absorbed record's mu = 1 values at m = 5, 6 charge 1.58, which is why
    33.08 - 32.4 and 37.39 - 36.7 are 0.66 to 0.69 bit; at m = 4 the sub-cap
    attempts are 1/mu = 2^19.44 under both conventions, so 11.01 and 11.0
    agree. At m = 8 the absorbed record's 42.2 is 0.34 bit above 42.52 -
    0.66 = 41.86 and is not reproduced by the record's stated convention; it
    is recorded as a definitional difference (audit sheet, section
    stage0_4b65e3), with one candidate reconstruction offered and not
    attributed.

  mechanism: >-
    OBJECT FRAME (carried from the proposal). Representation R1 of
    RQ-ECDLP-623a32: the factor-base logarithm vector as a stored advice
    string of S = B_cap words, with the subspace membership test that makes
    a fresh target decomposable. Operation set Sigma: solve one more target
    using the stored logs; add one more target to the batch. Sigma acts on
    the schedule, not on points. The projection of a run onto the triple
    (T_shared, C, S) is lossy and Sigma-compatible: adding a target maps
    (T_shared, L) to (T_shared, L + 1) at cost kappa_m C without consulting
    anything discarded, and the generic frontier S T^2 is a function of the
    triple alone. The priced open number is C, unchanged; what this
    hypothesis changes is the line C is read against and the accounting of
    the product law's "targets" column (KN-FIND-aa2efc: relations times
    targets times oracle = m 2^131 in the N = 4r ambient of
    CORR-20260928-4cb669), which is the cost of obtaining the factor-base
    logarithms once; the challenge logarithm is one more decomposition
    (IDEA-20260922-77bf31, as relayed by the proposal). The lift from one to
    L targets charges the product's "targets" column once and the descent L
    times, exactly under A1-A5. Off-limits components used, named: F2
    (decomposition) is the family; F7 (preprocessing table) is the lens on
    the rho side; F1 (rho) is the generic multi-target comparator. The
    per-orbit forward guidance (iii) of the proposal (orbit-quotient advice
    size B/131) is a per-orbit framing under CORR-20260925-649e25:
    conditional on the per-orbit unit no approved contract has fixed, cited
    only as a dependency, never a movement (C7).

  assumptions:
    - >-
      A1. The L targets are logarithms in the same order-r subgroup of the
      same curve, so the stored factor-base logarithms are reusable (the
      multi-target setting of KR-RHO-46c2c6 and the fixed-group advice
      setting of KN-LIT-013).
    - >-
      A2. Per-target cost is A(mu) attempts at cost C times the retry factor
      1/(1 - m exp(-mR/B)) at R = B; the target is re-randomised by one group
      operation per attempt, charged separately as target_ops.
    - >-
      A3. Linear algebra returns the full logarithm vector of the touched
      columns. The incremental elimination in
      src/crypto_autoresearcher/index_calculus/linalg.py stops at the first
      row that pins the single target and must be extended
      (EXP-BINSTD-532d7f, instrument I1); Wiedemann does return it.
    - >-
      A4. The rho comparator is matched rho 2^60.8090 = sqrt(pi r / (4 times
      131)) (CORR-20260922-81aeab), equal to sqrt(pi N_prime / 2) since
      N_prime / 2 = r / 524 (C1); multi-target rho is that constant times
      sqrt(L) under H2.
    - >-
      A5. Arithmetic only at deployed parameters (n = 131); executable cells
      at n = 19 and on a relabelled Z/NZ group near 2^20. The ambient of the
      decomposition count is the full curve group (#E = 4r on ECC2K-130;
      #E = 2q and 4l on the toy cells), the targets live in the prime-order
      subgroup, and factor-base columns are the subgroup projections of base
      points up to sign (definitions of EXP-BINSTD-532d7f).
    - >-
      A6. Off-limits components declared: F2 (family), F7 (comparator and the
      stored-logs analogue), F1 (comparator). No decomposition mechanism is
      proposed; no oracle cost is asserted.

  proof_search_map:
    bottleneck: >-
      Whether an arity-m oracle at the cap locus has per-attempt cost C below
      sqrt(N_prime / B_cap) up to the disclosed constants. Every other
      quantity in the preprocessing row is arithmetic on the model. The
      lane's open question (C) is unchanged; the line it is read against is
      new. Decision-changing: DEC-20260928-63addc S1 decision_it_changes.
    baseline_embedding:
      parameter_slice: >-
        L = 1 reproduces the single-target product law term for term: at
        m = 4 with B = 2^29.036 and C = 2^11.010, T_shared = 2^59.487 +
        2^60.072 = 2^60.809 = rho (the pinned D3 tie, PTM-B). C = T_gen
        reproduces the generic frontier point: B_cap T_gen = P_gen
        (PTM-A). m = 23 with B = 524 known-log points reproduces
        IDEA-20260926-178821's zero-relation row as the L = 1, S = 524
        endpoint (cited, not re-derived).
      reproduction_check: >-
        Symbolic, zero compute: log2(B_cap T_gen) - log2 P_gen = 0
        identically; at g = 0 the lower root of the m = 5 and m = 4 windows
        is s = 1 (L = 1, the tie) to within 1e-8 bit; the m = 5 budget at
        L = 1 equals the pinned 33.08 (one attempt per relation) and 32.41
        (1.58 attempts). Frozen fixture: the Z/NZ instrument gate of
        EXP-BINSTD-532d7f Stage 1, committed as runnable code in the audit
        sheet (fixture_code) with its pass criterion stated before execution:
        on the relabelled Z/NZ control both fitted exponents read within 0.1
        of -1 and -0.5 before any curve cell is read.
    observation_collision:
      observable: >-
        The pair (fitted per-target cost exponent in L, total cost at L) for
        index calculus and for multi-target rho on the same cell.
      distinct_preimage_search: >-
        An apparent L^-1 law for index calculus has two preimages: (i)
        genuine amortisation of a reusable full logarithm vector; (ii) a toy
        artefact where the relation set is so over-complete that every fresh
        target decomposes over solved columns at first attempt while the
        shared cost is setup-dominated. Separated by reporting, per target,
        the usable fraction (all legs in solved columns) and the retry count,
        both of which have predicted values under H1 (0.748 and 1.34 at
        m = 2, R = B) and read near 1 and 1 under (ii); by the relabelled
        Z/NZ control with the enumeration oracle, where the L^-1 law must
        hold for the same reason and with the same fraction; and by the
        shared-versus-per-target operation split, which exposes a
        setup-dominated shared cost directly.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The resource triple (T_shared, C, S) at the cap locus for each m,
          added over the disjoint blocks relation collection, linear algebra
          and L descents, specialised against the two generic laws
          (Kuhn-Struik sqrt(2 L N_prime), recalled; Corrigan-Gibbs-Kogan
          S T^2 = N_prime, reported).
        predicted_gain: The frontier column and the crossing windows in g at zero compute.
      - transform: boundary_lift
        proposed_object: >-
          The single-target product law lifted to L targets by charging the
          "targets" column once and the descent L times; exact under A1-A5.
        predicted_gain: >-
          Shows the product law is the L = 1 slice of a two-parameter cost
          and that a single-target verdict at m = 4 is a statement about
          that slice.
    quantifier_order: >-
      FOR ALL m >= 4 and FOR ALL oracles with per-attempt cost C at the cap
      locus, IC(L) = T_shared(C) + kappa_m L C under A1-A5 and H1, and the
      leading-order precomputation equals P_gen at C = T_gen. FOR ALL g below
      the critical value (12.26 at m = 5 in the D3 convention; 14.79 at m = 4
      on the sub-cap slice) THERE EXISTS a non-empty window of L on which the
      model inequality holds, under H2. NOT CLAIMED: that any oracle has C
      at or below any of these budgets; that any point lies below the
      generic frontier. Witnesses (the window endpoints) depend on m, g and
      the base size B and on nothing else; the toy exponents depend on the
      cell, the seed stream and L, and are reported per cell.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On ECC2K-130 the frontier column is T_gen = [values] at matched
        advice S = B_cap words; the pinned single-target column is D3; at
        m = 5 an oracle g bits over D3 with g < 12.26 has IC(L) below the
        H2 rho law for L in [values]; on the binary toy cells and the Z/NZ
        control the per-target cost of index calculus scales as L^(-1 +/-
        delta) and rho's as L^(-1/2 +/- delta) with measured constants,
        usable fractions and retries." It can NEVER certify C at n = 131 for
        any oracle, and it never certifies a point below the frontier.
      nearby_object_control: >-
        The relabelled Z/NZ group with a random base of 2^7 elements and the
        enumeration oracle: the L^-1 law is group-generic and must reproduce
        there with the same usable fraction. The ordinary n = 19 CERTBIN
        curve and the Koblitz n = 19 sibling must give the same laws (no
        Frobenius is used). The rho side must reproduce IDEA-20260920-2e37b3's
        toy pooling-constant range [0.8, 1.3]. Proves-too-much objects of the
        plan: an oracle at C = T_gen reads on the frontier with no
        relaxation (PTM-A); the L = 1 slice at m = 4 reads the pinned D3
        verdict with no advantage (PTM-B); the m = 5 window at g = 14 reads
        empty and the three cells read one predicted exponent (PTM-C).
    proof_obligations:
      - claim: The frontier column at m in 4, 5, 6, 8, 16, both windows and both comparator columns, recomputed by the committed Stage 0 code within 0.05 bit of the design figures.
        responsibility: correctness
      - claim: B_cap T_gen = P_gen exactly, and m B_cap^2 below P_gen at every m >= 4.
        responsibility: correctness
      - claim: The full-logarithm-vector solve and the shared-table multi-target rho reproduce the two exponents on Z/NZ before any curve cell is read (the fixture).
        responsibility: baseline
      - claim: The usable fraction and retry factor at R = B are measured per target and compared with (1 - exp(-m))^m and its geometric retry law within 10 percent, on real relation sets and on the control.
        responsibility: success_probability
      - claim: Every recovered logarithm carries an independently re-verified certificate; shared and per-target operations are never summed into one figure.
        responsibility: strictness
      - claim: Advice size in bytes and the LA term stand beside every time figure (C6).
        responsibility: memory
      - claim: Nothing here lowers C for any oracle, claims a point below rho at L = 1, or places any algorithm below the generic frontier (TW-01).
        responsibility: scope
    not_applicable_reason: null

  rerandomization: >-
    Not a worst-to-average-case device. The per-attempt re-randomisation of a
    target by one group operation (A2) is an ordinary algorithm step whose
    cost is charged as target_ops; no mixing-time claim is made or needed.

  asymptotic_claim:
    problem: ECDLP on ECC2K-130 by cap-locus index calculus in the multi-target and preprocessing settings (cost model, second budget row)
    prior_best: >-
      Single target, matched rho 2^60.8090; L targets, Kuhn-Struik about
      2^60.8090 sqrt(L) (recalled law); with advice S, Bernstein-Lange at
      sqrt(N_prime / S) online after sqrt(N_prime S) precomputation
      (KR-RHO-ea34b8; KN-LIT-7cc07f abstract-level), generic and tight by
      KN-LIT-013 as reported.
    time_exponent: >-
      NO EXPONENT IS CLAIMED FOR ANY ORACLE. The frontier line is
      log2 T_gen = (1/2)(1 - 1/m) n - const against the single-target cap
      line (1/2 - 1/m) n - const, a relaxation of n/(2m) bits; per-target
      online cost kappa_m C against generic sqrt(N_prime / S). The record's
      cost-model reading is kept; nothing moves.
    memory_exponent: advice S = B_cap words = N^(1/m) up to (m factorial)^(1/m); bytes per m in EXP-BINSTD-532d7f stage0 (C6)
    hidden_cofactor: "the attempt constants A(mu) and kappa_m; KN-LIT-013's polylog slack (unquantified without the source); Bernstein-Lange's 1.24 and 1.77"
    claim_kind: cost_model_second_row_plus_control_measurement
  asymptotic_claim_note: >-
    claim_kind is the proposal's own reading, carried as DEC-20260928-63addc
    C-conditions require ("leaves asymptotic_claim at the record's cost-model
    reading"); it is none of the template's three improvement kinds because no
    improvement is claimed on any axis.

  heuristic_assumptions:
    - id: H1
      name: uniform touching
      formal_statement: >-
        Let a factor base of B columns receive R relations, each touching m
        columns drawn as independent uniform draws with replacement. Then the
        untouched fraction after R relations is exp(-mR/B) up to o(1) in B,
        and a fresh target's decomposition, whose m legs are independent
        uniform columns, is usable (every leg in a touched column) with
        probability (1 - exp(-mR/B))^m, which at R = B is (1 - exp(-m))^m
        (0.748 at m = 2, 0.929 at m = 4, 0.967 at m = 5; first-order
        1 - m exp(-m): 0.729, 0.927, 0.966). The number of attempts to a
        usable decomposition is geometric with that success probability.
        Uniformly in B for the tested cells; at n = 131 only the mean
        transfers.
      random_model_justification: >-
        MODEL: the touched-column indicator vector as the occupancy vector of
        mR balls in B bins. RIGOROUS BOUND: the mean touched count is exact by
        linearity of expectation for any base (KN-FIND-007's double count
        fixes the mean yield per target exactly; the same linearity gives the
        mean touched count). DISTRIBUTION LAW: the classical occupancy law
        (independent uniform bins) gives the exp(-mR/B) untouched fraction
        (IDEA-20260805-061f97's law, as relayed by the proposal).
        OBSTRUCTIONS: KN-FIND-007's coverage concentration: a subspace base
        may leave more untouched columns than the occupancy law predicts
        because repeated sums lower coverage at matched size; measured per
        target here, never assumed. Rank deficiency of R = B random sparse
        relations in B unknowns reduces the solved set below the touched
        set; reported as a separate diagnostic on every cell including the
        control.
      supporting_results:
        - ref: KN-FIND-007
          provenance: internal
          claim: Mean decomposition yield C(B+m-1, m)/N for every base of size B; coverage at most min(1, mean); coverage concentration measured for structured bases.
          verified_by: TASK-20260928-58d044 (finding read in full this session)
        - ref: IDEA-20260805-061f97
          provenance: internal
          claim: The touched-column fraction 1 - exp(-mR/B); relations needed x_m B with x_m the root of x = 1 - exp(-mx).
          verified_by: not verified by TASK-20260928-58d044 (relayed by IDEA-20260926-20ba8f citations; the record was not opened this session)
      validation_experiment_ids: [EXP-BINSTD-532d7f]
      validation_plan: >-
        SAMPLE: 341 fresh certified targets per cell at R = B (L in 1, 4, 16,
        64, 256, disjoint). PREDICTED DISTRIBUTION: usable fraction (1 -
        exp(-m))^m and geometric retry counts. COMPARISON: usable fraction
        against prediction with a Clopper-Pearson 95 percent interval;
        retry histogram against the geometric law. TAIL: the maximum retries
        per target against the geometric tail at 341 samples. TRANSFER: the
        mean transfers by arithmetic; concentration at n = 131 is not
        claimed. Stage 2 of EXP-BINSTD-532d7f.
      falsification_condition: >-
        On a cell whose control (Z/NZ) reads within 10 percent of prediction,
        the real-set usable fraction reads below 0.8 of the control's with
        the 95 percent interval excluding the prediction, replicated on both
        binary cells: H1 fails on subspace bases at that cell and the
        amortisation is recorded as coverage-limited (the proposal's negative
        outcome). An instrument failure never falsifies H1.
    - id: H2
      name: generic laws
      formal_statement: >-
        (i) Multi-target rho with one shared distinguished-point table solves
        L logarithms in a group of effective size N_prime in expected total
        c sqrt(L N_prime) group operations with c within a constant near the
        single-target constant (pooling constant in [0.8, 1.3] of the
        single-target mean, IDEA-20260920-2e37b3's toy range), for all L at
        which the shared table is charged, and the per-target cost falls as
        L^(-1/2). (ii) The generic preprocessing frontier is S T^2 = N_prime
        up to polylog factors on the effective group of size N_prime = r/262,
        with T_gen = sqrt(N_prime / S) and P_gen = sqrt(N_prime S) at advice S.
      random_model_justification: >-
        MODEL: a random mapping on the effective group; collision times of L
        independent walk families sharing one table. RIGOROUS BOUND: none
        held at source by this program. DISTRIBUTION LAW: the birthday law
        for random mappings; Kuhn-Struik's analysis (recalled; validity range
        recalled as L below about N_prime^(1/4) = 2^30.2 and MARKED; the
        source was not read); the Bernstein-Lange table gives the same
        L^(1/2) law without that cap (general form recalled; the abstract's
        1.77 l^(1/3) online after 1.24 l^(2/3) at table size l^(1/3) was read
        by IDEA-20260920-2e37b3's agent). The window's upper end above 2^30
        therefore rests on the Bernstein-Lange table law, disclosed. The
        reduction to N_prime by negation and the 131 Frobenius classes is the
        same convention as the matched rho (C1). OBSTRUCTIONS: no source read
        at full text in this program for any of the three laws; KN-LIT-013's
        bound is Omega-tilde with slack this design cannot quantify (IMP-CGK);
        at toy N the distinguished-point overshoot and setup rival the walk
        and flatten fits (walk_ops and setup_ops reported separately).
      supporting_results:
        - ref: KN-LIT-013
          provenance: internal
          claim: >-
            Corrigan-Gibbs and Kogan, EUROCRYPT 2018: any generic DL algorithm
            with S bits of advice and online time T has S T^2 = Omega-tilde(eps
            N), essentially tight. CORPUS ENTRY ONLY: the entry itself says the
            full paper was not read there. This entry does not discharge H2's
            supporting result (C5); the read at source is impediment IMP-CGK
            of EXP-BINSTD-532d7f and substitution is forbidden.
          verified_by: TASK-20260928-58d044 (corpus entry read in full; source not retrieved, no retrieval tool in this session)
        - ref: KN-LIT-f47b10
          provenance: internal
          claim: Kuhn-Struik SAC 2001, total for L logarithms about sqrt(2 L n) by reusing distinguished points; corpus entry says the full text was not read and the constant is not re-verified.
          verified_by: TASK-20260928-58d044 (corpus entry read in full; source not retrieved)
        - ref: Kuhn and Struik, SAC 2001, LNCS 2259, validity range L below about n^(1/4)
          provenance: recalled
          claim: "RECALLED AND MARKED. The pooled-walk analysis is usually stated for L not too large, of the form L at most n^(1/4); not load-bearing because the window's upper end rests on the table law."
          verified_by: null
        - ref: KN-LIT-7cc07f
          provenance: internal
          claim: Bernstein-Lange, ePrint 2012/458, abstract constants 1.77 l^(1/3) online after 1.24 l^(2/3) precomputation with a table of l^(1/3) points; the general sqrt(l/T), sqrt(lT) form is recalled and consistent with that data point (IDEA-20260920-2e37b3 citations).
          verified_by: "TASK-20260928-58d044 (corpus entry read in full; the abstract was read by IDEA-20260920-2e37b3's agent, not by this session)"
      validation_experiment_ids: [EXP-BINSTD-532d7f]
      validation_plan: >-
        SAMPLE: the multi-target rho harness on each cell (subgroup orders
        about 2^17 to 2^20), 30 seeds per L, L in 1, 4, 16, 64, 256, with the
        shared table charged in entries and bytes. PREDICTED DISTRIBUTION:
        total walk_ops at L against c sqrt(L N) with c the single-target
        constant; the per-target exponent -0.5. COMPARISON: least-squares
        slope with interval; pooling constant per L against [0.8, 1.3]. TAIL:
        the largest seed's total at each L against the single-target tail
        (ratio of the 90th percentile to the mean, reported). TRANSFER: the
        law's form only; part (ii) is not measured and enters only the
        Stage 0 arithmetic. Stage 2 of EXP-BINSTD-532d7f.
      falsification_condition: >-
        A fitted rho exponent outside [-0.6, -0.4] with the interval excluding
        -0.5, or a pooling constant outside [0.8, 1.3], on a cell where the
        Z/NZ control passed and the setup and overshoot admission rules held:
        H2 (i) does not describe the shared-table harness at that scale and
        the window's rho side carries the measured law. A pooling constant
        outside [0.5, 2] on the control is an instrument defect and reads
        nothing. Part (ii) is falsified only by a published generic
        preprocessing algorithm off the S T^2 line or by a read of the source
        that states a different bound; either withdraws the frontier column
        and leaves the split (A) standing.

