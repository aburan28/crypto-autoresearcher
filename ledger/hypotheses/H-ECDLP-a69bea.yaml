  statement: >
    Fix three integer triples before any
    Hom is read. Stage 0 asserts only the
    (T2) instrument of IDEA-20260905-24b41a
    on this family: Hom(Z/N, F_p^*) is
    trivial iff gcd(N, p-1) is 1, and
    Hom(Z/N, F_p) is trivial iff gcd(N, p)
    is 1. (i) REAL is p=17 N=5 and both
    homs are trivial; (ii) KF is p=11 N=5
    and the multiplicative hom is
    nontrivial; (iii) NULL is p=7 N=7 and
    the additive hom is nontrivial;
    (iv) N=0 or p=0 is rejected before
    Hom is read as a census. This is not
    a net, not a Miller function, not a
    cubical lift, not a dual-number jet,
    and not Stage 1. Neither reading is a
    decoder or an ECDLP advantage.
  mechanism: >
    Hom(Z/N, A) equals A[N]. For A = F_p^*
    that is trivial exactly when N does
    not divide p-1. For A = F_p that is
    trivial exactly when N does not divide
    p. Stage 0 evaluates those two gcd
    tests on one frozen family. This is a
    new RQ-ECDLP-002 object after Stage 0
    of EXP-ECDLP-0d1336 held as P-S0-DNS
    (DEC-20260908-0b0580). It is not
    Stage 1 of EXP-ECDLP-0d1336 and not
    Stage 1 of EXP-ECDLP-1aa0f8.
  predictions:
    - id: P-S0-HOM
      metric: well-defined exact Hom triviality on the frozen family
      direction: different
      minimum_effect: >
        After fixture_pass, REAL has both
        homs trivial. KF has multiplicative
        hom nontrivial. NULL has additive
        hom nontrivial. Zero p and N are
        rejected. One certified miss after
        fixture_pass is a scoped
        falsification of this instrument on
        the frozen family.
      claim_tier: observational
    - id: P-S1-NET
      metric: net or cubical torsor coordinate on a curve
      direction: different
      minimum_effect: >
        Stage 1+, unauthorized here. Stage 0
        does not construct a net, does not
        evaluate a Miller function, and does
        not lift to dual numbers.
      claim_tier: observational
  falsification_criteria:
