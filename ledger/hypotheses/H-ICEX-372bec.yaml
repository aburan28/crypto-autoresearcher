    "mechanism": "For a returned x multiset (i1,...,im), enumerate all epsilon in{−1,+1}^m lexicographically and sum epsilon_j D_ij by counted group operations. Record every sign pattern producing R or−R for that tuple. If sum=rR with r in{−1,+1}, compute k_candidate=r*sum(epsilon_j*s_ij)−t modN and verify [k_candidate]P=Q independently. ForR=O choose r=+1 and verify the sumO. At most2^m sign patterns occur per x tuple, but more than one rejected tuple may be visited, so total sign work is not falsely bounded by2^m per query. Only certified point sums are decompositions; a resultant root count is never a verified relation. Normalize x_0=s_0. From the selected B−1 rows delete column0 to get invertible A; RHS b=−s_0*M[:,0]. Require an independent rankB−1 certificate and invertibility, solve Ax_rest=b with scalar Wiedemann below, restore x0, and verify M*x=0 and [x_i]P=D_i for EVERYcolumn. These recovered labels are supplied only to the hidden recovery phase. Its paired descent uses exactly the primary point inputs, target/mask streams, generator ideals and deterministic solver settings; record independent execution and count comparisons.",
