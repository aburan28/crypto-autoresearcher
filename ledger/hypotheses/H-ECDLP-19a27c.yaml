  title: >-
    The integer 524287 has 18 doublings and 18 additions
  statement: >-
    The integer 524287 has bit length 19. Its bits are nineteen 1s.
    Reaching it by doubling and adding uses 18 doublings and 18
    additions. Nineteen exceeds eighteen by 1. Eighteen equals eighteen,
    so that gap is 0. The product of 19, 18, and 18 is 6156. Their sum
    is 55. Two readings of the addition count are both 18, so that gap
    is 0 and their product is 324.
  mechanism: >-
    The proposal writes the counts 19, 18, and 18. This contract
    checks those integers. It does not add a curve point.
