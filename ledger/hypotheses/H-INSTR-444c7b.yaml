hypothesis:
  id: H-INSTR-444c7b
  question_id: RQ-INSTR-f8faa0
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-d7e255
  source_design: >-
    analysis/endomorphism-isogeny-decomposition/MATCHED-ORDER-DESIGN.md
    section 4, E4; plus the SR3 gate redesign chosen by the user this session and
    recorded in DEC-20260810-a4bec4

  statement: >-
    SCOPE. Instrumentation only. No curve-side claim of any kind is made, tested,
    supported or weakened by this contract. It characterises, in BOTH DIRECTIONS,
    every statistic that EXP-JINV-bd141d and EXP-VOLC-9f5571 rely on, at THE
    ACTUAL GEOMETRY OF THOSE DESIGNS -- their real class counts, per-level vertex
    counts, r-stratum sizes, target counts and density rows -- and it delivers the
    reference-run sampling characterisation that the redesigned SR3 gate requires
    before that gate can be evaluated at all. CLAIM TIER toy. NO ATTACK, NO
    EXPONENT, NO SPEEDUP, sota_delta ZERO.

    CLAIM (H1, TWO-DIRECTIONAL CONTROL). For each statistic S used by
    EXP-JINV-bd141d or EXP-VOLC-9f5571, and at each design geometry it will
    actually be evaluated at, H1 claims that S's behaviour is measurable in both
    directions and must be measured before any lane result quoting S is citable:
    (a) DETECTION -- S fires on a signal PLANTED into real measured values at a
    declared size, and the smallest size at which it fires is reported as that
    statistic's DETECTION FLOOR at that geometry; (b) REJECTION -- S does not
    fire on a matched null of the same shape carrying no signal, and its
    false-positive rate at the declared level is reported. An instrument that
    cannot detect a planted signal cannot support a negative, and one that fires
    on a matched null cannot support a positive. This is GOAL-ENDO-001 criterion
    C4, made concrete for this batch's statistics.

    CLAIM (H2, NULL-C IS DISQUALIFIED FOR WITHIN-CLASS WORK AND THAT IS NOT
    RE-LITIGATED HERE). exp_icinv.permutation_null (NULL-C) is disqualified for
    ANY within-class contrast by its own committed characterisation: a
    between-class MEAN detector with power 1.00 at a 0.9% shift and median
    p = 0.0590 at zero planted shift (red_team_notes.md section 5). H2 claims
    only that this disqualification is inherited, not re-tested, and that
    NULL-C's admissibility for the BETWEEN-CLASS contrast of EXP-JINV-bd141d is a
    separate question that must be answered afresh at the matched-order geometry
    -- because power and false-positive behaviour do not transfer across designs,
    and the matched-order family annihilates exactly the confound NULL-C was
    shown to be maximally sensitive to.

    CLAIM (H3, THE SR3 GATE REDESIGN AND ITS COST). The SR3 baseline gate of
    EXP-ICINV-4d33aa is redesigned per the user's decision recorded in
    DEC-20260810-a4bec4: LITERAL MEMBERSHIP OF A FROZEN [1.3, 3.6] BAND IS
    REPLACED BY A STATISTICAL COMPARISON AGAINST THE REFERENCE RUN'S OWN SAMPLING
    UNCERTAINTY. H3 claims that this gate is EVALUABLE ONLY AFTER the reference
    run's per-density-row sampling variance has been characterised, that this
    characterisation is additional work, that this contract is where it is
    delivered, and that the cost is a DELAY to EXP-JINV-bd141d and
    EXP-VOLC-9f5571 relative to the cheaper interior-rows option that was also on
    the table. That cost is recorded here as a fact about the schedule, not
    argued against; the user's rationale for preferring this option over the
    cheaper one is NOT KNOWN TO THIS RECORD and is therefore not stated,
    inferred or invented.

    WHAT IS NOT CLAIMED. Nothing about curves, endomorphisms, isogeny classes,
    volcano levels, relation density, solving degree, the ECDLP, any exponent or
    any speedup. Nothing about whether the campaign's reported over-dispersion is
    real: this contract characterises instruments and does not adjudicate
    H-ICINV-6c7920, which remains `specified` and untouched in either direction.
    Nothing here bears on H-STR-002, so pause condition P2 is not triggered.
    H-ENDO-001 is not involved. This contract is NOT blocking for
    EXP-ICINV-e0cd8f, which computes exact symbolic invariants and uses no
    statistic at all.

  mechanism: >-
    STEP 0 -- WHY AN INSTRUMENT CONTRACT IS THE BLOCKING ONE. This campaign has
    already lost two conclusions to instruments rather than to mathematics. The
    isogeny-class no-information reading was withdrawn because NULL-C is a
    between-class mean detector (BATCH-cb71b5 what_was_withdrawn, first item).
    The 94.7%-of-ceiling walk result was withdrawn because it rested on a single
    draw while the 8-seed mean sat on the ceiling. In both cases the statistic,
    not the curve, produced the number. GOAL-ENDO-001 criterion C4 exists for
    this reason and pause condition P1 is its enforcement: an instrument that
    fails its two-directional control stops measurement, and measurements already
    taken with it are marked attempted_and_inconclusive and are never negative
    evidence.

    STEP 1 -- THE INVENTORY, WHICH IS FIXED BY THE OTHER TWO CONTRACTS AND NOT BY
    THIS ONE. The statistics to be characterised are exactly those
    EXP-JINV-bd141d and EXP-VOLC-9f5571 declare: the per-class and per-level mean
    of decomposition_rate_m2 and decomposition_rate_m3, liftable_density,
    decomposition_efficiency, the within-class dispersion statistic used for the
    level contrast, the rank correlation used for the |D_0| contrast, the exact
    permutation rank used for the single-vertex |Aut| arm, and the walk-length
    distribution summary used for the T5 gate. If either contract adds a
    statistic, this contract must characterise it before that statistic supports
    any conclusion; that is what "blocking" means here.

    STEP 2 -- WHY GEOMETRY, NOT THE STATISTIC, IS WHAT MUST BE HELD FIXED. The
    campaign's own detection-bound table shows the chi-square dispersion floor
    moving from variance-ratio 1.250 at n = 138 and T = 400, to 1.300 at n = 98,
    to 1.355 at n = 72 and T = 300, to 3.668 at n = 3 (red_team_notes.md section
    6). Power is a strong function of stratum size, and in every within-class
    design the maximal-order stratum is the smallest one. It follows that a
    control run at some convenient n says nothing about the same statistic at the
    n it will actually be used at. THIS CONTRACT THEREFORE RUNS EVERY CONTROL AT
    THE ACTUAL GEOMETRY -- the enumerated per-level vertex counts, the actual
    class counts, the actual r-stratum sizes -- and reports one detection floor
    per (statistic, geometry, density row) cell rather than a single headline
    number.

    STEP 3 -- HOW A SIGNAL IS PLANTED. Planting is done into REAL MEASURED VALUES
    from the target design, not into synthetic data, so the null distribution
    retains the real data's own structure. For the between-class arm: a monotone
    shift in |D_0| of declared size is added to the per-class means of the actual
    matched-order measurements. For the within-class arm: a per-level shift of
    declared size is added to one level's per-vertex values. For the T5 walk: a
    declared bias is imposed on the walk kernel. In each case the planted size is
    swept downward until detection fails, and the smallest detected size is
    reported as the floor. Sizes are declared in the contract before execution
    and are not adjusted after seeing the result.

    STEP 4 -- HOW A MATCHED NULL IS BUILT. The null must have the SAME SHAPE as
    the object under test and differ only in carrying no signal. For the
    between-class arm: class labels permuted so |D_0| carries no information,
    with the class sizes and the r composition preserved exactly. For the
    within-class arm: an f = 1 class of the same matched-order family, which has
    no level axis by construction, split into two arbitrary declared halves of
    the same sizes as the real levels. For the |Aut| arm: an arbitrary
    non-crater vertex of the same class designated as the pseudo-crater, so the
    rank statistic is exercised at exactly n = 1 against exactly the same 37-member
    distribution. Each null is run at every declared density row.

    STEP 5 -- THE SR3 REDESIGN, STATED PRECISELY AND WITH ITS COST. The
    version-1/version-2 SR3 gate required Arm A0's per-density-row variance ratio
    to lie literally inside a frozen [1.3, 3.6] band. Independent review
    established that this band IS THE OUTWARD-ROUNDED HULL OF THE COMMITTED ROWS
    IT GATES -- floor slack 0.020397, ceiling slack 0.011900 -- so the acceptance
    region was fitted to the data it gates with under 2% margin, and legitimate
    sampling variation is expected to cross it (EXP-ICINV-4d33aa amendment v2,
    post_review_notes A5). The user has selected, from the three candidates named
    in DEC-20260809-de11f9, the replacement of literal band membership by A
    STATISTICAL COMPARISON AGAINST THE REFERENCE RUN'S OWN SAMPLING UNCERTAINTY.
    Operationally, for each density row: re-measure the reference run at its own
    frozen parameters across a declared seed set, obtain the empirical sampling
    distribution of the variance-ratio statistic AT THAT ROW, and pass the gate
    when the candidate arm's value lies inside a declared central interval of
    that distribution. THE COST IS DIRECT AND IS RECORDED RATHER THAN MINIMISED:
    the gate cannot be evaluated until that per-row sampling distribution exists,
    it does not exist today, producing it is additional work, and it therefore
    DELAYS the successor run of EXP-ICINV-4d33aa and, through the C4 block,
    EXP-JINV-bd141d and EXP-VOLC-9f5571 relative to the cheaper option of
    restricting the gate to interior rows. The reason the user preferred it to
    the cheaper option is not known to this record and is not invented here.

    STEP 6 -- WHAT THE TWO PRIOR TERMINATIONS DO AND DO NOT MEAN, CARRIED
    FORWARD VERBATIM IN SUBSTANCE. EXP-ICINV-4d33aa terminated INVALID twice, at
    version 1 and at version 2, and both terminations were ADMISSIBILITY FAILURES
    IN THE GATE. Per the Coordinator's own independent check recorded in
    DEC-20260809-de11f9, they bear on NEITHER H-ICINV-6c7920 NOR EV-ENDO-10109d.
    A run that never reached an outcome state decides nothing (AGENTS.md rule 5),
    and the redesign of the gate is not a re-adjudication of either record. This
    is stated inside this hypothesis because this contract carries the redesign,
    and a reader who encounters the redesign without this paragraph would
    reasonably infer that something had been decided about the campaign's
    headline finding. Nothing has.

    STEP 7 -- WHY THE SAMPLING CHARACTERISATION IS CHEAP EVEN THOUGH IT IS
    ADDITIONAL. The exact m = 3 sum sets are seed- and target-count-independent
    and are computed once per (curve, factor-base size); only the target draw
    depends on the seed. Re-measuring the reference run across a seed set
    therefore reuses the dominant cost and pays only for the draws. This is a
    reason the additional work is bounded, NOT a reason to pretend it is free:
    the delay it imposes on the two blocked contracts is real and is recorded in
    DEC-20260810-a4bec4.

  assumptions:
    - >-
      [committed] NULL-C (exp_icinv.permutation_null) is a between-class MEAN
      detector with power 1.00 at a 0.9% planted shift and median p = 0.0590 at
      zero planted shift on the real p = 4001 rate_m3 values. red_team_notes.md
      section 5. INHERITED, NOT RE-TESTED for the within-class disqualification.
    - >-
      [committed] The chi-square dispersion detection floors: variance-ratio
      >= 1.250 at n = 138 T = 400, >= 1.300 at n = 98 T = 400, >= 1.250 at
      n = 138 T = 300, >= 1.355 at n = 72 T = 300, >= 3.668 at n = 3 T = 300.
      red_team_notes.md section 6. Used as the reason controls must be run at the
      actual geometry.
    - >-
      [committed] The [1.3, 3.6] SR3 band is the outward-rounded hull of the
      committed rows it gates, floor slack 0.020397, ceiling slack 0.011900.
      EXP-ICINV-4d33aa amendment v2, post_review_notes A5.
    - >-
      [committed] Both terminations of EXP-ICINV-4d33aa were admissibility
      failures in the SR3 gate and bear on neither H-ICINV-6c7920 nor
      EV-ENDO-10109d, per the Coordinator's independent check in
      DEC-20260809-de11f9.
    - >-
      [user decision, this session] The SR3 replacement chosen is the statistical
      comparison against the reference run's own sampling uncertainty, selected
      from the three candidates named in DEC-20260809-de11f9. Recorded as a user
      decision, not as this Coordinator's inference. The rationale for preferring
      it over the cheaper interior-rows option is NOT KNOWN and is not stated.
    - >-
      [fact, implementation] Exact m = 3 sum sets are seed- and
      target-count-independent, so a seed sweep reuses the dominant cost. Stated
      in EXP-ICINV-4d33aa's own budget block and re-verified here.
    - >-
      [scope] Instruments only. No curve-side claim. claim_tier toy.

  proof_search_map:
    bottleneck: >-
      Two of this campaign's conclusions were produced by statistics rather than
      by curves, and the gate that was supposed to catch that was itself fitted
      to the data it gates. The bottleneck is that no statistic in this campaign
      has a detection floor measured at the geometry it is used at, so no null
      result has a stated resolution and no positive result has a stated
      false-positive rate.
    baseline_embedding:
      parameter_slice: >-
        EXP-INSTR-2d32ba characterised NULL-B only -- both directions of its
        control carry null_kind "NULL-B binomial" -- at n = 40, T = 400, where
        the floor is variance-ratio 1.490. That is the exact prior boundary of
        instrument characterisation in this campaign, and it covers neither
        NULL-C nor any geometry this batch uses.
      reproduction_check: >-
        FROZEN REGRESSION FIXTURE. The run must reproduce, from the committed
        p = 4001 rate_m3 values, NULL-C's published power profile: median
        p = 0.0590 at delta = 0, power 0.08 at delta = 0.002, power 1.00 at
        delta = 0.005, at 12 repetitions per cell. Reproduction establishes that
        the control harness is exercising the same statistic the red team
        exercised; failure makes the run INVALID and returns it as a defect.
    observation_collision:
      observable: >-
        "The instrument passed its control."
      distinct_preimage_search: >-
        THE COLLISION IS THE WHOLE PROBLEM. A statistic can pass a
        two-directional control for at least four distinct reasons: it genuinely
        measures the intended quantity; it measures a different quantity that
        happens to co-vary with the planted signal, which is precisely what
        NULL-C did when it detected a 0.9% mean shift and was read as a
        within-class structure detector; it was controlled at a geometry more
        favourable than the one it is used at; or the planted signal was larger
        than anything the lane will ever see. The separators are, respectively:
        planting into REAL measured values rather than synthetic ones; declaring
        what the statistic is sensitive to and testing the nuisance direction
        explicitly; running every control at the ACTUAL geometry; and sweeping
        the planted size down to the floor rather than testing one convenient
        size.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Replace the boolean "instrument validated" by the triple (detection
          floor at this exact geometry, false-positive rate on the matched null
          at this exact geometry, nuisance-direction sensitivity), reported per
          statistic per density row. A lane result then carries its own
          resolution rather than borrowing one.
        predicted_gain: >-
          Encoding: exact for the geometry, empirical for the floors.
          Completeness: every statistic the two blocked contracts declare is
          covered, and a statistic they add later is blocked until covered.
          Soundness: planting into real measured values preserves the real null
          structure. Transfer: DECLARED UNMET across geometries -- that is the
          point of the transform, not a limitation of it. Cost: bounded by seed
          reuse of the sum sets.
    quantifier_order: >-
      CLAIMED IN THIS ORDER: FORALL statistics S declared by EXP-JINV-bd141d or
      EXP-VOLC-9f5571, FORALL geometries G at which S will be evaluated, FORALL
      density rows in the frozen grid, EXISTS a measured detection floor and a
      measured false-positive rate for (S, G, row). The weaker order (EXISTS a
      geometry at which S behaves well) is explicitly NOT claimed and is exactly
      the error that produced the NULL-C withdrawal.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that at the enumerated geometries of two specific contracts, at
        one matched group order, with one factor-base rule and one full-group
        sampler, each declared statistic detects planted signals down to a
        measured size and fires on a matched null at a measured rate; and that a
        redesigned SR3 gate is evaluable because the reference run's per-row
        sampling distribution now exists. It cannot certify that any statistic is
        correct in general, that any lane result is true, or anything whatsoever
        about curves, endomorphisms or the ECDLP.
      nearby_object_control: >-
        THE PSEUDO-CRATER: an arbitrary non-crater vertex of the t = 211 class
        designated as if it were the crater, exercising the rank statistic at
        exactly n = 1 against exactly the same 37-member distribution. It is the
        closest possible object to the real |Aut| arm -- same class, same
        vertices, same statistic, same density rows -- differing only in that
        the designated vertex has |Aut| = 2 like all the others. If the
        pseudo-crater is flagged as extreme as often as the declared level
        allows, the rank statistic is behaving; if it is flagged more often, the
        |Aut| arm cannot be read at all.
    proof_obligations:
      - claim: >-
          Every statistic declared by EXP-JINV-bd141d and EXP-VOLC-9f5571 has a
          measured detection floor and a measured false-positive rate at every
          geometry and density row at which it will be used.
        responsibility: baseline
      - claim: >-
          NULL-C's published power profile is reproduced from the committed
          p = 4001 values before any new characterisation is trusted.
        responsibility: baseline
      - claim: >-
          The matched nulls have the same shape as the objects under test -- same
          stratum sizes, same r composition, same density rows -- and differ only
          in carrying no signal.
        responsibility: correctness
      - claim: >-
          The reference run's per-density-row sampling distribution of the
          variance-ratio statistic is measured across a declared seed set at the
          reference run's own frozen parameters, and the SR3 v3 interval is
          derived from it and frozen before any candidate arm is compared.
        responsibility: interface
      - claim: >-
          Planted sizes are declared before execution and swept downward to the
          floor; they are never adjusted after seeing a result.
        responsibility: strictness
      - claim: >-
          Nothing in this contract bears on any curve-side hypothesis, on
          H-ICINV-6c7920, or on EV-ENDO-10109d.
        responsibility: scope
    not_applicable_reason: null
    not_applicable_reason_note: >-
      Filled rather than excused. This contract is the campaign's gate on its own
      measurements, so the audits that decide whether a control is meaningful --
      baseline reproduction of a known power profile, the observation collision
      between "passed a control" and "measures the intended quantity", the
      quantifier order over geometries, and the pseudo-crater nearby-object
      control -- are the substance of the contract rather than an overhead on it.

  rerandomization: null
  rerandomization_note: >-
    No worst-to-average-case device. The seed sweep is a SAMPLING-VARIANCE
    MEASUREMENT and the label permutations are null constructions; neither is a
    complexity device and neither may be read as one.

  asymptotic_claim: null
  asymptotic_claim_note: >-
    NO COMPLEXITY CLAIM OF ANY KIND, and no curve-side claim either.
    sota_delta ZERO on every axis. dominated_by is inherited unchanged from the
    campaign (KN-TECH-001, KN-TECH-006, KN-TECH-018); this contract does not
    touch it because it produces no algorithm and measures no attack.

  heuristic_assumptions:
    - id: HEUR-INSTR-1
      formal_statement: >-
        Planting a signal into REAL measured values from the target design, and
        permuting the labels of those same values to build the matched null,
        yields a null distribution that preserves the real data's own structure
        -- its r composition, its stratum sizes and its per-curve heterogeneity
        -- so that the measured detection floor and false-positive rate apply to
        the real measurement rather than to a synthetic idealisation of it.
      random_model_justification: >-
        The construction is exchangeability-based rather than model-based: under
        the null that the label carries no information, permuting labels leaves
        the joint distribution unchanged, so the permutation distribution is the
        exact reference distribution and needs no distributional assumption. The
        heuristic content is only that the real values retain no residual label
        information the permutation destroys accidentally -- which is why the
        contract also reports the nuisance-direction sensitivity explicitly
        rather than assuming exchangeability holds.
      supporting_results: []
      supporting_results_note: >-
        No external citation asserted. The construction and its limits are stated
        here; the campaign's own NULL-C characterisation is cited as the
        cautionary instance, not as support.
      validation_experiment_ids: [EXP-INSTR-36c8cf]
      falsification_condition: >-
        The matched null fires at a rate materially above the declared level on
        data known to carry no signal -- for instance the f = 1 arbitrary-halves
        null, or the pseudo-crater. Then exchangeability fails for that statistic
        at that geometry, the statistic is disqualified there, and every lane
        result that would have quoted it is blocked.
    - id: HEUR-INSTR-2
      formal_statement: >-
        The empirical sampling distribution of the per-density-row variance-ratio
        statistic, obtained by re-measuring the reference run at its own frozen
        parameters across the declared seed set, is an adequate reference for the
        redesigned SR3 gate: a faithful reproduction of the reference measurement
        lands inside the declared central interval of that distribution, and a
        materially different measurement does not.
      random_model_justification: >-
        The exact m = 3 sum sets are seed-independent, so seed-to-seed variation
        isolates target-draw sampling error, which is precisely the uncertainty
        the redesigned gate is meant to compare against. The heuristic content is
        that the declared seed count is large enough for the interval to be
        stable; that is measured by reporting interval width against seed count
        and is not assumed.
      supporting_results: []
      supporting_results_note: >-
        No external citation asserted. The seed-independence of the sum sets is a
        property of the committed implementation and is re-verified in the run.
      validation_experiment_ids: [EXP-INSTR-36c8cf]
      falsification_condition: >-
        The interval width does not stabilise as the seed count grows to the
        declared maximum, or a faithful re-measurement of the reference run at
        its own parameters falls outside its own interval. Then the redesigned
        SR3 gate is not evaluable as specified, and the Coordinator must be told
        so before any successor run of EXP-ICINV-4d33aa is dispatched -- the
        interval is NOT widened after seeing it fail, which is precisely the move
        the campaign's rules exist to prevent.

  structural_ingredients:
    - description: >-
        Permutation (exchangeability) reference distributions for label-based
        contrasts, used to build matched nulls that need no distributional
        assumption.
      citation: >-
        Standard; used computationally. The campaign's own implementation is
        exp_icinv.permutation_null, whose scope limits are committed in
        red_team_notes.md section 5.
      role: supplies the exact reference distribution for the matched nulls
    - description: >-
        Chi-square dispersion testing with the Wilson-Hilferty band, as the
        committed harness computes it, and its detection floors as a function of
        stratum size and target count.
      citation: >-
        Implemented in exp_icinv.binomial_null_verdict; floors tabulated by the
        campaign's red team in red_team_notes.md section 6.
      role: the within-class dispersion instrument whose floor must be measured per geometry
    - description: >-
        Seed-independence of exact sum-set enumeration, which makes a
        sampling-variance sweep reuse the dominant cost.
      citation: >-
        Property of the committed implementation, stated in EXP-ICINV-4d33aa's
        budget block and re-verified in the run.
      role: bounds the cost of the SR3 v3 reference characterisation

  reduction_chain:
    core_problem: >-
      Establish, for every statistic this batch's curve-side contracts rely on, a
      measured detection floor and a measured false-positive rate at the exact
      geometry of use; and produce the reference-run per-density-row sampling
      distribution without which the redesigned SR3 gate cannot be evaluated.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. Nothing about curves follows from an instrument
      characterisation. The only downstream consequences permitted are (i)
      unblocking or blocking EXP-JINV-bd141d and EXP-VOLC-9f5571 under
      GOAL-ENDO-001 criterion C4, and (ii) making a successor run of
      EXP-ICINV-4d33aa evaluable under the redesigned SR3 gate. Neither is a
      statement about mathematics.

  predictions:
    - metric: >-
        P1 -- NULL-C power-profile reproduction from the committed p = 4001
        rate_m3 values
      direction: different
      minimum_effect: >-
        Median p = 0.0590 at delta = 0, power 0.08 at delta = 0.002, power 1.00
        at delta = 0.005 and above, at 12 repetitions per cell, matching
        red_team_notes.md section 5 within the repetition noise the run reports.
        Failure means the control harness is not exercising the same statistic;
        the run is INVALID and returns as a defect.
    - metric: >-
        P2 -- detection floor per (statistic, geometry, density row) for every
        statistic declared by EXP-JINV-bd141d and EXP-VOLC-9f5571
      direction: different
      minimum_effect: >-
        A measured number in every cell, obtained by sweeping the planted size
        DOWNWARD until detection fails. No cell may be left unreported, and a
        cell the budget could not reach is reported as not_measured -- which
        BLOCKS the corresponding lane conclusion rather than being treated as a
        pass. The pre-registered qualitative expectation, from
        red_team_notes.md section 6, is that the floor rises sharply as the
        stratum shrinks and is worst at the maximal-order level; no numeric
        prediction is made because the actual per-level counts are not yet
        enumerated.
    - metric: >-
        P3 -- false-positive rate on each matched null, per statistic, per
        geometry, per density row
      direction: different
      minimum_effect: >-
        At or below the declared nominal level. Materially above it disqualifies
        that statistic at that geometry and blocks every lane conclusion quoting
        it. Includes the f = 1 arbitrary-halves null for the within-class arm,
        the label-permuted null for the between-class arm, and the pseudo-crater
        for the |Aut| arm.
    - metric: >-
        P4 -- NULL-C admissibility for the BETWEEN-CLASS matched-order contrast
      direction: different
      minimum_effect: >-
        Characterised afresh at the matched-order geometry. The pre-registered
        expectation, stated qualitatively because no figure is available, is that
        the median p at zero planted shift should move TOWARD 0.5 relative to the
        committed 0.0590, because the residual class effect the committed value
        reflects came from #E and #E is identical by construction in this family.
        A median p that stays near 0.0590 means a class effect survives that the
        matched-order construction was supposed to annihilate, which is an
        instrument finding of its own and must be reported as one.
    - metric: >-
        P5 -- SR3 v3 reference characterisation: the per-density-row empirical
        sampling distribution of the variance-ratio statistic for the reference
        run, at the reference run's own frozen parameters, across the declared
        seed set
      direction: different
      minimum_effect: >-
        Delivered as a per-row distribution with its central interval, plus
        interval width as a function of seed count so that stability is visible
        rather than asserted. This is the deliverable without which the
        redesigned SR3 gate cannot be evaluated at all, and its absence blocks
        any successor run of EXP-ICINV-4d33aa.
    - metric: >-
        P6 -- SR3 v3 self-consistency: a faithful re-measurement of the reference
        run at its own parameters compared against its own interval
      direction: different
      minimum_effect: >-
        Inside the interval at the declared coverage. Outside it means the gate
        is not evaluable as specified. THE INTERVAL IS NOT WIDENED IN RESPONSE;
        the Coordinator is told, and the gate is redesigned again under a new
        versioned amendment or the successor run is not dispatched.
    - metric: >-
        P7 -- the hull-edge disclosure carried forward
      direction: different
      minimum_effect: >-
        The report must state that the superseded [1.3, 3.6] band was the
        outward-rounded hull of the committed rows it gated, with floor slack
        0.020397 and ceiling slack 0.011900, and that this -- not a failure of
        the campaign's finding -- is why literal band membership is being
        replaced. Omitting this disclosure makes the report incomplete.

  test_boundary:
    instances:
      - >-
        The committed p = 4001, t = 30 class rate_m3 values, used ONLY to
        reproduce NULL-C's published power profile and to characterise the
        reference run's sampling distribution.
      - >-
        The actual geometries declared by EXP-JINV-bd141d: 51 conductor-1 classes
        at N = 19507, their real class sizes and r compositions, and the 37-vertex
        t = 211 class for the rank statistic.
      - >-
        The actual geometries declared by EXP-VOLC-9f5571: the enumerated
        per-level vertex counts of the conductor-arm classes, and the f = 1
        matched-null class split into arbitrary halves.
      - >-
        The reference run for SR3 v3: the runs the redesigned gate compares
        against, at their own frozen parameters, named explicitly in the run
        record and bound by source_sha256 rather than transcribed.
      - >-
        OUT OF SCOPE: any curve-side conclusion; any adjudication of
        H-ICINV-6c7920 or EV-ENDO-10109d; any statement about the ECDLP; any
        geometry not declared by the two blocked contracts.
    parameters:
      directions_required: [planted_signal_detection, matched_null_rejection]
      geometry_rule: >-
        Every control is run at the ACTUAL geometry of use -- real stratum sizes,
        real class counts, real r composition, real density rows. A control at a
        convenient geometry does not discharge C4.
      planting_rule: >-
        Signals are planted into REAL measured values, never into synthetic data,
        and the planted size is swept DOWNWARD to the detection floor. Sizes are
        declared before execution and never adjusted after a result.
      nulls_required:
        - "between-class: class labels permuted, class sizes and r composition preserved"
        - "within-class: f = 1 class of the same family split into arbitrary declared halves"
        - "|Aut| arm: pseudo-crater, an arbitrary non-crater vertex designated as crater"
        - "T5 walk: unbiased kernel against a declared biased kernel"
      null_c_status: >-
        DISQUALIFIED for any within-class contrast, inherited from
        red_team_notes.md section 5 and NOT re-tested. Its admissibility for the
        between-class matched-order contrast is characterised afresh here.
      sr3_v3_gate: >-
        Literal membership of the frozen [1.3, 3.6] band is REPLACED by a
        statistical comparison against the reference run's own per-density-row
        sampling uncertainty, measured across a declared seed set at the
        reference run's own frozen parameters. Selected by the user from the
        three candidates of DEC-20260809-de11f9; recorded in DEC-20260810-a4bec4.
      sr3_v3_cost: >-
        The gate is NOT evaluable until that characterisation exists. It does not
        exist today. Producing it is additional work delivered by this contract,
        and it DELAYS EXP-JINV-bd141d and EXP-VOLC-9f5571 relative to the cheaper
        interior-rows option. Recorded as a cost, not argued against.
      sr3_v3_rationale: >-
        NOT KNOWN TO THIS RECORD. The user's reason for preferring this option
        over the cheaper one was not stated to the Coordinator and is therefore
        not inferred, reconstructed or invented here.
      transcription_prohibition: >-
        Every reference value quoted from a committed record must be READ FROM
        THAT RECORD AT RUN TIME and bound by a source_sha256 in the run manifest.
        Transcribing such a value into source at any precision is PROHIBITED and
        makes the run INVALID (EXP-ICINV-4d33aa amendment v2 change A4,
        CORR-20260807-a24675).
      blocking_scope: >-
        BLOCKING for EXP-JINV-bd141d and EXP-VOLC-9f5571 under GOAL-ENDO-001
        criterion C4. NOT BLOCKING for EXP-ICINV-e0cd8f, which uses no statistic.
    implementation: >-
      New control driver over harness/exp_icinv.py (READ ONLY -- it must not be
      edited), harness/exp_icinv_fullgroup.py, harness/isogeny_class.py and
      harness/toycurve.py. Run manifests must pin the hash of every source file
      executed (harness/runner.py:source_provenance, audited by
      tools/check_run_source_provenance.py --strict), which is the standing A6
      precondition carried from EXP-ICINV-4d33aa amendment v2 and is BLOCKING.
    budget:
      wall_clock_seconds_per_run: 14400
      total_cpu_hours: 24
      maximum_memory_gb: 8
      maximum_runs: 20
      budget_provenance: >-
        COORDINATOR-SET. The design document states no budget for E4. These
        figures bound the task and are not derived from any measurement;
        exhausting them is a budget event under AGENTS.md rule 5, reported as
        such and never as a result, and an unreached control cell BLOCKS its lane
        conclusion rather than passing it.
      dominant_cost: >-
        The seed sweep for the SR3 v3 reference characterisation and the
        downward planted-size sweeps across every (statistic, geometry, density
        row) cell. Sum sets are computed once and reused across seeds, which is a
        contract requirement rather than an optimisation.

  falsification_conditions:
    - >-
      F1. NULL-C's published power profile is not reproduced from the committed
      values (P1 fails). The control harness is not exercising the same
      statistic; the run is INVALID and returns as a defect. Not a finding about
      any instrument.
    - >-
      F2. Any statistic fails the DETECTION direction at every planted size the
      lane could plausibly care about, at some geometry of use. That statistic
      cannot support a negative at that geometry; every lane conclusion quoting
      it is blocked and GOAL-ENDO-001 pause condition P1 applies to it.
    - >-
      F3. Any statistic fails the REJECTION direction -- fires on its matched null
      materially above the nominal level (HEUR-INSTR-1 refuted at that geometry).
      That statistic cannot support a positive; every lane conclusion quoting it
      is blocked.
    - >-
      F4. The SR3 v3 interval does not stabilise with seed count, or a faithful
      re-measurement of the reference run falls outside its own interval
      (HEUR-INSTR-2 refuted). The redesigned gate is not evaluable as specified.
      The interval is NOT widened; the Coordinator is told and the gate is
      redesigned under a new versioned amendment before any successor run of
      EXP-ICINV-4d33aa is dispatched.
    - >-
      F5. NULL-C's median p at zero planted shift on the matched-order design
      stays near the committed 0.0590 rather than moving toward 0.5. A class
      effect survives that the matched-order construction was supposed to
      annihilate; that is an instrument finding, it is reported as one, and the
      between-class arm's interpretation must account for it.
    - >-
      F6. Any control cell is left not_measured. That cell BLOCKS its lane
      conclusion. An unmeasured control is not a passed control, and a budget
      exhaustion is reported as a budget exhaustion (AGENTS.md rule 5) and never
      as a clean instrument.
    - >-
      F7 (PLANNED NEGATIVE, PRE-REGISTERED). If a statistic is disqualified, the
      batch does not get to emit "the instrument failed" and stop. It must emit
      which geometries it failed at, the measured floor and false-positive rate
      that show the failure, which lane conclusions are thereby blocked, and a
      named replacement statistic with its cost. A negative that names no
      successor has not finished and its honest status is unverified
      (docs/inventor-protocol.md closure standard).

  interpretation_limits:
    - >-
      claim_tier toy. This contract makes NO claim about curves, endomorphisms,
      isogeny classes, relation density, solving degree, the ECDLP, any exponent
      or any speedup. sota_delta ZERO.
    - >-
      PASSING A CONTROL DOES NOT VALIDATE A CONCLUSION. It establishes a
      detection floor and a false-positive rate at one geometry. A lane result
      still needs its own evidence, its own scope statement and its own
      independent review.
    - >-
      THE SR3 REDESIGN ADJUDICATES NOTHING. Both prior terminations of
      EXP-ICINV-4d33aa were admissibility failures in the gate and, per the
      Coordinator's independent check in DEC-20260809-de11f9, bear on NEITHER
      H-ICINV-6c7920 NOR EV-ENDO-10109d. Changing the gate does not change that,
      and no reader may infer from this contract that anything has been decided
      about the campaign's headline finding.
    - >-
      THE COST OF THE CHOSEN SR3 OPTION IS REAL AND IS RECORDED. It requires the
      reference run's per-density-row sampling variance to exist before the gate
      can be evaluated, which is additional work and which delays
      EXP-JINV-bd141d and EXP-VOLC-9f5571 relative to the cheaper interior-rows
      option. The user's rationale for the choice is not known to this record and
      is not invented.
    - >-
      NULL-C's within-class disqualification is INHERITED from
      red_team_notes.md section 5, not re-derived here, and it is not softened by
      anything this contract measures about NULL-C's between-class behaviour.
    - >-
      Nothing here bears on H-STR-002 in either direction, so pause condition P2
      is not triggered; and this contract is NOT blocking for EXP-ICINV-e0cd8f,
      which computes exact symbolic invariants and uses no statistic.

