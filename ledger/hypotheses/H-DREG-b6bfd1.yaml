hypothesis:
  id: H-DREG-b6bfd1
  question_id: RQ-DREG-d7b6d6
  proposal_id: IDEA-20260922-f1e5b7
  added: '2026-09-22'
  title: >-
    Last-fall and grevlex solving-degree increments from n=1 to n=2 agree
    across one certified toy F_4-isogeny class
  statement: >-
    On LADDER-W as frozen in EXP-DREG-dd668d and executed by EXP-DREG-ab3fee,
    every certified curve in the base curve's F_4-isogeny class has the same
    increment, from rung n=1 to rung n=2, of certified last-fall degree and of
    grevlex solving degree as the base, whenever both rungs finished. The
    equality claim is a within-class range of 0. It is a statement about slower
    growth only when the base increment is at least 1, or the base degree at
    n=2 is strictly above its first-fall degree. Otherwise the ladder did not
    enter the growing regime. A finished vertex whose increment differs by at
    least 1 falsifies equality for that named quantity. No ECDLP exponent is
    claimed.
  mechanism: >-
    Same boolean chained presentation as H-DREG-1d0e5d, now on every model
    with the base trace, connected by certified degree-2 edges. The tracked
    object is the pair of increments of last-fall degree and grevlex solving
    degree. First-fall degree is a control. The projection discards the
    ideals. F2 is the component system. What is added is the within-class
    comparison of growth increments on a ladder that is not the m=3
    prime-field screen. Coordinate-dependent in the sense of
    IDEA-20260806-c5d183. The operation set is the certified degree-2
    isogenies, not translation.
  assumptions:
    - Metric definitions are those in EXP-DREG-dd668d. This hypothesis does not redefine them.
    - A class range is reported only when every same-trace ordinary model is reached by a certified edge or listed as missing. A missing model makes certified false.
    - Unfinished cells are excluded from the range.
  proof_search_map:
    bottleneck: The integer increment of two named degrees between two rungs.
    baseline_embedding:
      parameter_slice: >-
        The GL instrument of EXP-DREG-dd668d must not have failed. A failed
        instrument makes every later gap unreadable.
      reproduction_check: >-
        Identity-frame r(d) matches the native base profile bit for bit at
        n=1 before any other vertex is read.
    observation_collision:
      observable: The pair of increments, plus r(d) for d <= 4 at each finished rung.
      distinct_preimage_search: >-
        Log j-invariant and a hash of the generator coefficients beside every
        pair. The support-matched null is a second preimage and is scored by
        EXP-DREG-6de989, not by this census.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: two-rung integer increments
        predicted_gain: >-
          Turns "does the degree explode" into a comparison of integers. A gap
          of size at least 1 changes one Macaulay width. No exponent gain.
    quantifier_order: >-
      FOR ALL certified vertices and FOR ALL D in {last-fall degree, grevlex
      solving degree}, IF both rungs finished, THEN the increment of D equals
      the base increment. Quantifiers range over finished cells of this ladder only.
    method_ceiling:
      strongest_certifiable_claim: >-
        Equality holds on the finished cells, or one finished vertex differs
        by at least 1. Toy scope. Neither outcome is an ECDLP algorithm.
      nearby_object_control: >-
        The base curve's own first-fall degree. If the named degrees never
        rise above it, the growing-regime gate fails and equality is not
        evidence about explosion.
    proof_obligations:
      - claim: Both rungs finished or the cell is unmeasured.
        responsibility: correctness
      - claim: Range 0 is equality. A difference of at least 1 falsifies it.
        responsibility: strictness
      - claim: Only this field, these degrees, and this walk.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: within-class range of the last-fall increment
      direction: lower
      minimum_effect: '0 on finished vertices, and only read if the base left the first-fall floor'
    - metric: within-class range of the grevlex solving-degree increment
      direction: lower
      minimum_effect: '0 on finished vertices, same gate'
  test_boundary:
    instances:
      - every ordinary F_4 model with the base trace, via certified degree-2 edges
    parameters:
      rungs: [1, 2]
      D_max: 4
      t: 4
      k: 1
    implementation: experiments/EXP-DREG-ab3fee/specification.yaml
    budget:
      maximum_runs: 1
      maximum_memory_gb: 4
  falsification_conditions:
    - >-
      Some finished vertex has a last-fall increment or a grevlex
      solving-degree increment at least 1 away from the base.
  interpretation_limits:
    - A flat profile closes only this system shape, this field, and this walk.
    - If the base never leaves the floor, the result does not speak about explosion.
    - No cryptographic transfer. No attack. Rho stays about p^{1/2}.
    - An incomplete class is a coverage fraction, not a class range.
  heuristic_assumptions:
    - id: HEUR-b6bfd1
      formal_statement: >-
        Finite comparison of integer degrees on the finished cells. No
        extrapolation and no distributional model of the increments.
      random_model_justification: No random model is assumed.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        An unmeasured cell is filled by a fitted slope, or a degree is imputed
        from a timeout. That handling falsifies the comparison rule. It is not
        evidence about the ideals.
  asymptotic_claim: null
  citations:
    - ref: IDEA-20260922-f1e5b7
      provenance: internal
      claim: The slope-census proposal this hypothesis specifies.
      verified_by: coordinator
    - ref: H-DREG-1d0e5d
      provenance: internal
      claim: The single-edge instrument that must not have failed before this census is read.
      verified_by: coordinator
    - ref: DEC-20260716-003
      provenance: internal
      claim: Closed m=3 prime-field neighbor screen. Not the observable here.
      verified_by: coordinator
  status: approved
  proposed_by: coordinator
