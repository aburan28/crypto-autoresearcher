  design_note: >-
    DESIGN ONLY. The arithmetic and the certificate row are the
    idea-generator's. The Coordinator's own contributions are two, both
    narrowing: (1) a DEGENERACY FINDING on the time axis, namely that over
    the range where the input exponent is actually asserted the
    time-difference discriminator is identically zero and only the MEMORY
    axis discriminates; and (2) an explicit quantifier-range restriction on
    the input, since the source extends a committed formula beyond the range
    that formula's own record quantifies it over. No status of any record is
    changed and nothing here is evidence.

  status: proposed
  proposed_by: idea-generator

  statement: >-
    TEST BOUNDARY FIRST. This is a STATIC, SYMBOLIC comparison of two
    conditional cost exponents in a generic prime-order group. Zero runs, no
    implementation, no curve generation, no instance. It is not an ECDLP
    result and not an impossibility statement.

    THE SETTING. G = <P> of prime order N, Q = [x]P. ADVICE(mu): the top
    mu*log2(N) bits of x are supplied, equivalently x is known to lie in an
    interval W of size |W| = N^{1-mu}. Two algorithms consume exactly this
    resource and nothing else.

    K1, KANGAROO ON W. An interval discrete-logarithm method on an interval
    of size |W| finds x in Theta(N^{(1-mu)/2}) group operations with
    O(log N) memory using distinguished points, parallelizing with total work
    unchanged. Only the exponent 1/2 in |W| is load-bearing here and it is
    RECALLED textbook material, opened by no agent in this program.

    K2, THE ADVISED FOUR-LIST ROUTE, TAKEN AS INPUT. A committed record
    derives, for the same advice, expected time and peak memory
    N^{max((1+mu)/4, (1-mu)/2)}. Its own quantifier, read verbatim this
    session, is "FOR ALL mu in [0,1/3]".

    K3, THE COMPARISON, WITH ITS RANGE STATED HONESTLY. On mu in [0,1/3] -
    the range where the input exponent is asserted - (1-mu)/2 >= (1+mu)/4, so
    the four-list TIME exponent equals kangaroo's exactly, while its MEMORY
    exponent is (1-mu)/2 against kangaroo's 0. Kangaroo therefore TIES ON
    TIME and STRICTLY DOMINATES ON MEMORY across the entire asserted range.
    At the advertised corner mu = 1/3 both sit at N^{1/3} time, the four-list
    route at N^{1/3} memory and kangaroo at O(log N).

    K3-EXT, AND THIS IS A DECLARED EXTRAPOLATION RATHER THAN A RESULT. For
    mu in (1/3, 1] the expression max((1+mu)/4, (1-mu)/2) equals (1+mu)/4,
    strictly exceeding (1-mu)/2, so the four-list route would be strictly
    worse on time by (3mu-1)/4 as well as on memory. BUT THE SOURCE RECORD
    FOR THAT EXPRESSION QUANTIFIES IT ONLY OVER mu in [0,1/3]. Evaluating it
    above 1/3 is an extrapolation outside its own stated range, and this
    record does not launder that into a dominance claim: the mu > 1/3 rows
    are emitted as UNASSERTED unless and until an independent re-derivation
    valid on (1/3,1] is obtained, which is a declared proof obligation rather
    than an assumption.

    K4, THE STRUCTURAL READING. At mu <= 1/3 the four-list route is a
    birthday search inside W realised indirectly through pair sums, and
    kangaroo is a birthday search inside W realised directly through
    Q + [i]P; both cost sqrt(|W|). The pair-sum detour buys nothing because
    an interval in a prime-order group is DIRECTLY SAMPLABLE once its
    endpoints are known, whereas a subgroup coset in F_2^n given by a random
    oracle is not. Samplability of the concentration set from its description
    is the load-bearing structure, and it is why the same machinery is
    worthless on one object and valuable on the other.

    K5, THE CERTIFICATE ROW THIS ADDS, WHICH IS THE DELIVERABLE. Any
    certificate for a conditional route must exhibit the cheapest known
    algorithm consuming the SAME resource - advice, key, or oracle - and show
    the route is not dominated by it. For advice about x that baseline is
    kangaroo. The lane's prior comparisons were against rho and BSGS, neither
    of which uses the resource, so neither is the control.

    WHAT IS NOT CLAIMED. No ECDLP result, no impossibility, nothing about
    per-group preprocessing, nothing about multi-target amortization, and
    nothing about XOR beyond the proves-too-much control. No status change to
    any record.

  mechanism: >-
    THE TRACKED OBJECT is the RESOURCE a conditional route consumes, and the
    null object for an ALGORITHM is the cheapest OTHER algorithm consuming
    the same resource. This is "controls before belief" applied to a COST
    CLAIM rather than to a measurement: a conditional exponent is an artifact
    until the identical resource has been handed to the simplest competitor.
    The four-list lane compared its conditional exponent to rho and BSGS for
    many batches; neither consumes the advice, so neither is the control.

    WHY THE TIME AXIS IS A DEGENERATE DISCRIMINATOR ON THE ASSERTED RANGE,
    AND THE MEMORY AXIS IS NOT. Define the decay parameter mu and the
    discriminator gap Delta_T(mu) = four-list time exponent minus kangaroo
    time exponent. On mu in [0,1/3], the range over which the input exponent
    is asserted, Delta_T is IDENTICALLY ZERO by the arithmetic of the max.
    A discriminator whose value is forced to zero across its whole admissible
    range cannot fire, and reporting "the exponents agree" as a finding would
    be reporting a width-zero band. The non-degenerate discriminator is
    Delta_M(mu) = four-list memory exponent minus kangaroo memory exponent,
    which equals max((1+mu)/4, (1-mu)/2) and is STRICTLY POSITIVE at every mu
    in [0,1/3], reaching 1/2 at mu = 0 and 1/3 at mu = 1/3. The dominance
    claim is therefore a MEMORY claim with a TIME TIE, and stating it that
    way is the difference between a control and a slogan.

    WHY THE PROVES-TOO-MUCH CONTROL IS THE DYNAMIC RANGE. The same
    same-resource argument is run on F_2^{3m} with random-oracle lists and
    the prefix quotient as the resource. There the cheapest two-list consumer
    is 2^{3m/2} while a four-list join is 2^{m}, so the four-list structure
    contributes a factor 2^{m/2} and the control must PASS it. That gives the
    instrument a known-NONZERO answer on one object and a known-ZERO answer
    on the other, so it is shown able to return both. An argument that also
    "dominated" the four-list route on XOR would have proved too much and is
    wrong somewhere it has not been read closely enough.

  assumptions:
    - >-
      A1. The advice is PER-TARGET, bits of the discrete logarithm of the
      specific target. Per-group preprocessing is a different resource with
      its own frontier and is explicitly not compared here.
    - >-
      A2. The four-list advised exponent is taken as INPUT from its committed
      record, including that record's own proof obligations AND its own
      quantifier range, mu in [0,1/3]. If that record's mu = 0
      reconciliation fails, this record's four-list column is void and its
      kangaroo column stands.
    - >-
      A3. Kangaroo's exponent 1/2 in |W| is taken as textbook and is RECALLED
      rather than read; only the exponent, not the constant, is load-bearing.
    - >-
      A4. Single target. Multi-target reuse of a join output is a named open
      axis and is excluded.
    - >-
      A5. N prime; no exact nontrivial quotient of G is assumed.
    - >-
      A6. Only two typed axes (time, memory) and one typed resource (advice)
      are used. No dominance is asserted on an axis whose value is unknown
      for either algorithm.

  proof_search_map:
    bottleneck: >-
      The lane's Pareto comparisons omit the only control that matters for a
      conditional route: the cheapest algorithm consuming the same resource.
      Supplying it changes the verdict on the advised branch from "a new
      point on the time-squared-times-memory curve, frontier row open" to
      "tied on time and dominated on memory by an existing algorithm using
      the identical advice", which is decision-changing.
    baseline_embedding:
      parameter_slice: >-
        mu = 0. Kangaroo on the whole group is rho up to a constant; the
        four-list route is a meet-in-the-middle at (1/2, 1/2). Both land on
        time exponent 1/2, with the four-list side already dominated on
        memory.
      reproduction_check: >-
        Symbolic and exact: max((1+0)/4, (1-0)/2) = 1/2 and (1-0)/2 = 1/2.
        The frozen fixture is the six-row (time, memory) table at mu in
        {0, 1/6, 1/3, 1/2, 2/3, 1}, which must show equal time on the first
        three rows, kangaroo memory 0 on all six, and the last three rows
        MARKED UNASSERTED pending a re-derivation valid above mu = 1/3.
    observation_collision:
      observable: "The time exponent (1-mu)/2 for mu <= 1/3."
      distinct_preimage_search: >-
        FOUND, AND IT IS EXACTLY THE DEGENERACY. Two algorithms share that
        exponent: kangaroo on W and the advised four-list route. They differ
        in memory - 0 against (1-mu)/2 - and in whether the concentration set
        is sampled directly or through pair sums. A report quoting only the
        time exponent cannot distinguish them, which is precisely why the
        memory column is MANDATORY on every row of the deliverable table and
        why a time-only comparison would be a width-zero test.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The same-resource control as a certificate row: for each
          conditional branch of the lane - advice about the logarithm, a key
          computable on every point, an oracle - the cheapest known consumer
          of that resource and its (time, memory) pair.
        predicted_gain: >-
          Turns a per-record Pareto argument into a table with one row per
          resource, in which the advised branch is dominated on memory in the
          first row.
      - transform: observable_fiber
        proposed_object: >-
          Hold the resource fixed (a concentration set of size |W|) and vary
          the ambient group: prime-order G, where the set is an interval and
          is directly samplable, versus F_2^n, where it is a subgroup coset
          reachable only through the join.
        predicted_gain: >-
          Names the structural reason the machinery is worthless on one
          object and valuable on the other, and supplies the
          proves-too-much control.
    quantifier_order: >-
      FOR ALL prime N, FOR ALL mu in [0,1/3], FOR ALL Q, given the top
      mu*log2(N) bits of the logarithm: THERE EXISTS an algorithm (kangaroo
      on W) with time exponent (1-mu)/2 and memory O(log N), and the advised
      four-list route has time exponent (1-mu)/2 and memory exponent
      (1-mu)/2; the first TIES on time and STRICTLY DOMINATES on memory. The
      witness does not depend on Q or on any list randomness.
      THE RANGE RESTRICTION IS LOAD-BEARING AND IS STATED RATHER THAN
      ASSUMED: the input exponent's own record quantifies it over mu in
      [0,1/3], so nothing is claimed for mu > 1/3 without an independent
      re-derivation. NOT CLAIMED at all: per-group preprocessing, multi-target
      reuse, resources other than bits of the logarithm, or anything about
      elliptic curves specifically.
    method_ceiling:
      strongest_certifiable_claim: >-
        Pareto dominance of one conditional branch by one existing algorithm
        on two typed axes plus one typed resource, over the asserted range
        mu in [0,1/3], as a memory-strict / time-tied statement. It can NEVER
        certify that no four-list route beats kangaroo under a DIFFERENT
        resource, and it is not an ECDLP lower bound.
      nearby_object_control: >-
        THE OBJECT WHERE THE DOMINANCE MUST FAIL: F_2^{3m} with
        random-oracle lists and the prefix quotient as the resource. The
        cheapest two-list consumer is 2^{3m/2} and the four-list join is
        2^{m}, so the structure contributes a factor 2^{m/2} and the control
        must PASS the four-list machinery there. A version of this argument
        that also dominated the four-list route on XOR would prove too much
        and is void until repaired.
    proof_obligations:
      - claim: "Kangaroo on an interval of size |W| costs Theta(sqrt(|W|)) with O(log N) memory."
        responsibility: baseline
      - claim: "max((1+mu)/4, (1-mu)/2) equals (1-mu)/2 iff mu <= 1/3, and exceeds it otherwise."
        responsibility: strictness
      - claim: "The advised route's memory exponent equals its time exponent at every mu, so the memory gap is strictly positive on [0,1/3]."
        responsibility: memory
      - claim: >-
          Delta_T is identically zero on [0,1/3], hence the time axis is a
          width-zero discriminator over the asserted range and the dominance
          claim is a MEMORY claim with a time tie.
        responsibility: strictness
      - claim: >-
          Any statement for mu in (1/3,1] requires an independent
          re-derivation of the four-list exponent valid on that range; until
          it exists those rows are UNASSERTED.
        responsibility: scope
      - claim: "On F_2^{3m} with random-oracle lists the same-resource control PASSES the four-list route."
        responsibility: feasibility
      - claim: >-
          The advice is per-target and the preprocessing frontier is not the
          comparison row; that obligation stays open on the input record.
        responsibility: interface

  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null: NO ATTACK IS MOUNTED and no exponent is claimed. Two
    CONDITIONAL exponents are compared - kangaroo at (1-mu)/2 and the
    four-list route at max((1+mu)/4, (1-mu)/2), both given the same advice -
    and the record's numbers are their differences: Delta_T identically 0 on
    the asserted range [0,1/3], and Delta_M equal to max((1+mu)/4, (1-mu)/2)
    and strictly positive there. UNCONDITIONALLY, NOTHING BELOW N^{1/2} IS
    CLAIMED. Kangaroo memory is O(log N) distinguished points; the four-list
    route's memory equals its time exponent. Nothing superpolynomial hides on
    either side: kangaroo's constant, the distinguished-point overhead and
    the route's polylog sorting factors are constants or logs. At mu = 1/3
    kangaroo sits at (N^{1/3}, O(log N)), off and BELOW the time-squared-
    times-memory curve, so the advised four-list corner is not even a new
    point on the rho iso-curve but a dominated point above kangaroo's.

  heuristic_assumptions:
    - id: HEUR-ADV-1
      formal_statement: >-
        KANGAROO COST. On an interval W of size |W| in a prime-order group,
        the expected number of group operations to a collision in a
        distinguished-point kangaroo walk is (2 + o(1)) sqrt(|W|), uniformly
        for |W| at least (log N)^C for some constant C.
      random_model_justification: >-
        The rigorous ingredient is the exact interval size. The
        distributional half is the standard random-walk collision analysis -
        the birthday law for two walks in a set of size |W| - which is the
        same heuristic already charged for rho in this corpus. Only the
        EXPONENT 1/2 is load-bearing here; the constant 2 is not used
        anywhere in the comparison.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-24fd38]
      falsification_condition: >-
        Kangaroo's interval cost shown to exceed sqrt(|W|)^{1+delta} for some
        delta > 0. The textbook bound would then be false and this record is
        void. Symbolic only in this contract; an empirical validation at 24
        to 34 bits is named as separate future work and is NOT requested
        here.
    - id: HEUR-ADV-2
      formal_statement: >-
        FOUR-LIST ADVISED EXPONENT. For mu in [0,1/3], the advised route's
        expected time and peak memory are both N^{max((1+mu)/4, (1-mu)/2)},
        as derived in the committed source record by substituting the
        two-pointer join parameter and the promise size into that record's
        surface.
      random_model_justification: >-
        NOT RE-DERIVED HERE, and the record is explicit that it CONSUMES this
        exponent along with the source record's own first-order independence
        and second-moment sufficiency assumptions. The classical practice
        imitated is the ordinary substitution of a promise size into a
        derived cost surface. THE GAP THAT MATTERS is the quantifier: the
        source asserts this FOR ALL mu in [0,1/3] and not beyond, so any use
        above 1/3 is an extrapolation and is marked as such.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-24fd38]
      falsification_condition: >-
        A symbolic re-derivation of the substitution disagreeing with the
        source record's expression, or the mu = 0 slice failing to land on
        exponent 1/2. Either is reported AGAINST the source record rather
        than absorbed, and voids this record's four-list column while leaving
        its kangaroo column standing.

  structural_ingredients:
    - description: >-
        The advised four-list exponent, quoted verbatim: "If k bits of
        log_P(Q) are supplied rather than guessed, the route runs at
        N^max((1+mu)/4, (1-mu)/2) with mu at most k/log_2 N, and at mu = 1/3,
        that is, exactly ceil((1/3)log_2 N) supplied bits, the exponent is
        exactly 1/3." Its quantifier, also verbatim from the same record:
        "Statement 3, FOR ALL mu in [0,1/3], IF an oracle supplies the top
        mu*log_2 N bits of log_P(Q), THEN expected time is
        N^(max((1+mu)/4,(1-mu)/2) + o(1)); the oracle is an explicit
        hypothesis and is never discharged."
      citation: IDEA-20260829-7169d6
      provenance: internal
      verified_by: >-
        coordinator TASK-20260904-ae82ce, which located and read these two
        passages directly in ledger/proposals/IDEA-20260829-7169d6.yaml in
        this session and quotes them verbatim above. THE QUANTIFIER RANGE
        [0,1/3] WAS READ RATHER THAN ASSUMED, and it is why this record marks
        every mu > 1/3 row UNASSERTED instead of claiming dominance there.
      role: supplies the four-list column of the comparison table
    - description: >-
        The open obligation this record discharges, quoted verbatim from the
        same record's dominated_by list: "(4) Gaudry-Schost and kangaroo are
        not applicable, since there is no interval for the target; note that
        the advised variant is morally an interval method and the comparison
        should be revisited if the advice is reinterpreted as an interval
        constraint, which is an open obligation."
      citation: IDEA-20260829-7169d6
      provenance: internal
      verified_by: >-
        coordinator TASK-20260904-ae82ce, read directly in this session and
        quoted verbatim. The source idea's characterisation of this row is
        CONFIRMED accurate.
      role: >-
        establishes that the comparison is a declared open obligation of the
        lane rather than a new demand invented here
    - description: >-
        Interval discrete logarithm in about 2 sqrt(|W|) group operations
        with negligible memory, with smaller constants available via
        equivalence classes, and distinguished-point parallelization with
        total work unchanged.
      citation: >-
        Pollard lambda (Math. Comp. 1978); Gaudry and Schost (ANTS 2004);
        Galbraith and Ruprai (PKC 2010); van Oorschot and Wiener
        (J. Cryptology 1999)
      provenance: recalled
      verified_by: null
      role: >-
        supplies the kangaroo column. NO AGENT IN THIS PROGRAM HAS OPENED
        THESE SOURCES; only the exponent 1/2 in |W| is load-bearing and the
        constants are not used. This is a pointer for a reviewer, not support.
    - description: >-
        The prohibition on proving dominance using axes whose values are
        unknown for one of the compared algorithms.
      citation: ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-c36939.yaml
      provenance: internal
      verified_by: >-
        idea-generator of IDEA-20260901-a31b94, which records reading that
        checkpoint in full on 2026-09-01 under TASK-20260901-94c9e2. RELAYED,
        NOT RE-READ by coordinator TASK-20260904-ae82ce; this record complies
