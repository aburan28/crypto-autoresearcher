      role: constrains the dominance claim to known axes

  reduction_chain:
    core_problem: >-
      Whether the advised four-list route is Pareto-dominated by an existing
      algorithm consuming the identical per-target advice, and on which axis.
    corollaries: []
  reduction_chain_note: >-
    Deliberately empty. The record produces a certificate row and a
    comparison table; it reaches no downstream problem by reduction.

  predictions:
    - metric: >-
        Delta_T(mu) = four-list time exponent minus kangaroo time exponent,
        for mu in [0,1/3]; dimensionless rational
      direction: same
      minimum_effect: >-
        FORCED EXACTLY 0 at every mu in [0,1/3]. THIS IS A DEGENERATE
        DISCRIMINATOR OVER THE ASSERTED RANGE and is labelled as such rather
        than reported as a finding: a band forced to a single value cannot
        fire. It is computed and published so that a later reader can see
        that the time axis carries no information here.
    - metric: >-
        Delta_M(mu) = four-list memory exponent minus kangaroo memory
        exponent, for mu in [0,1/3]; dimensionless rational
      direction: higher
      minimum_effect: >-
        EXACTLY max((1+mu)/4, (1-mu)/2), which is strictly positive at every
        mu in [0,1/3]: 1/2 at mu = 0, 5/12 at mu = 1/6, 1/3 at mu = 1/3. THIS
        IS THE NON-DEGENERATE DISCRIMINATOR and it carries the whole
        dominance claim. A value of 0 anywhere on the range would falsify the
        claim outright.
    - metric: >-
        Delta_T(mu) for mu in (1/3,1]; dimensionless rational, MARKED
        UNASSERTED
      direction: higher
      minimum_effect: >-
        The arithmetic gives (3mu-1)/4, but the input exponent's own record
        quantifies it only over [0,1/3]. These rows are EMITTED AS UNASSERTED
        and may not be quoted as a dominance claim unless an independent
        re-derivation valid on (1/3,1] is obtained and cited. Emitting them
        as asserted is an invalidation under the paired contract.
    - metric: >-
        outcome of the same-resource control on F_2^{3m} with random-oracle
        lists; categorical PASS/FAIL for the four-list machinery
      direction: different
      minimum_effect: >-
        FORCED PASS. The four-list join at 2^{m} beats the cheapest two-list
        consumer at 2^{3m/2}, so the structure contributes a factor 2^{m/2}
        and the control must not dominate it. If the argument DOES dominate
        the four-list route on XOR, it has proved too much and this record is
        void until repaired. This is the record's dynamic-range
        demonstration: the same instrument returns a known-nonzero answer
        here and a known-zero answer on the prime-order object.
    - metric: >-
        mu = 0 reconciliation on both sides; dimensionless rational exponents
      direction: same
      minimum_effect: >-
        Both exactly 1/2, with the four-list side already at memory exponent
        1/2 against kangaroo's 0. A failure on the four-list side is
        INHERITED from the input record: this record's four-list column is
        then void and its kangaroo column stands.
    - metric: >-
        guessed-bits consistency check: kangaroo with k guessed top bits at
        2^k * sqrt(N/2^k) = sqrt(N * 2^k); dimensionless exponent
      direction: higher
      minimum_effect: >-
        Exponent 1/2 + mu/2, strictly worse than rho for mu > 0 and equal at
        mu = 0, reproducing the input record's own guessed-variant ceiling. A
        disagreement localises an arithmetic error in one of the two records
        and is reported rather than absorbed.

  test_boundary:
    instances:
      - "A six-row (time, memory) table at mu in {0, 1/6, 1/3, 1/2, 2/3, 1}, with the last three rows MARKED UNASSERTED."
      - "The mu = 0 blocking reconciliation on both sides."
      - "The F_2^{3m} proves-too-much control with random-oracle lists."
      - "The guessed-bits consistency check against the input record's own ceiling."
      - "No instance, no curve, no group element and no oracle query is generated anywhere."
    parameters:
      mu_grid: "{0, 1/6, 1/3, 1/2, 2/3, 1}"
      asserted_range: "[0, 1/3]"
      arithmetic: "exact rationals, compared with zero tolerance"
      axes: "time exponent and memory exponent only, both as exponents of N; the resource axis is per-target advice in bits"
    implementation: >-
      Exact rational arithmetic. No randomness, no instance, no
      implementation of either algorithm. The deliverable is a table, two
      inequalities, one control outcome and one certificate row.
    budget: >-
      See EXP-ECDLP-24fd38. Seconds of exact arithmetic; the cost is one
      short derivation session.

  falsification_conditions:
    - >-
      F1. The mu = 0 slice fails on the four-list side. Inherited from the
      input record; this record's four-list column is void, its kangaroo
      column stands, and the dominance claim is suspended.
    - >-
      F2. An independent derivation finds the four-list advised time exponent
      strictly BELOW (1-mu)/2 for some mu in [0,1/3]. Then the route beats
      kangaroo on the same advice, this record inverts into a POSITIVE LEAD,
      and it is routed to independent review at the highest tier rather than
      claimed.
    - >-
      F3. The XOR control "dominates" the four-list route. The argument
      proves too much; the control is wrong and the record is void until
      repaired.
    - >-
      F4. Kangaroo's interval cost is shown worse than sqrt(|W|)^{1+delta}
      for some delta > 0. The textbook bound would be false and the record is
      void.
    - >-
      F5. Delta_M is zero anywhere on [0,1/3]. The memory dominance - the
      record's only non-degenerate claim on the asserted range - fails, and
      with the time axis already identically zero the record would have
      nothing left to say.
    - >-
      F6. A mu > 1/3 row is emitted as asserted without an independent
      re-derivation valid on that range. Scope violation; the table is
      withdrawn and re-issued.

  interpretation_limits:
    - >-
      ZERO RUNS, no implementation, no curve generation, no ECDLP result.
    - >-
      A dominance statement for ONE conditional branch under ONE resource. It
      is not an impossibility for four-list routes and not an ECDLP lower
      bound.
    - >-
      THE TIME AXIS IS DEGENERATE ON THE ASSERTED RANGE. Delta_T is
      identically zero for mu in [0,1/3]; the dominance is a MEMORY-STRICT,
      TIME-TIED statement and must be quoted that way. Any summary saying
      "kangaroo is faster" on that range is wrong.
    - >-
      THE mu > 1/3 ROWS ARE UNASSERTED, because the input exponent's own
      record quantifies it only over [0,1/3]. Extending it is an
      extrapolation and this record refuses to launder it into a claim.
    - >-
      Depends entirely on the input record's exponent for its four-list
      column; if that record is falsified the column is void.
    - >-
      Constants are not compared - only exponents - and at any reachable
      scale the constants would dominate a measurement, which is one reason
      no measurement is proposed. THE COMPARISON IS ASYMPTOTIC AND CANNOT BE
      DECIDED EMPIRICALLY AT REACHABLE SCALE; that is stated rather than
      narrowed away.
    - >-
      Per-target versus per-group advice are different frontiers; only
      per-target is treated. Multi-target reuse of a join output is excluded
      and named.
    - >-
      NOTHING HERE IS SPECIFIC TO ELLIPTIC CURVES. Both algorithms and both
      objects are generic groups; the paired contract makes that a binding
      pre-declared consequence.
    - >-
      No hypothesis, experiment or goal status changes, and no sub-rho
      mechanism is claimed.

