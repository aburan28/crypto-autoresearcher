  title: >-
    On y^2 + xy = x^3 + x^2 + 1, the E-side x-counts in V = {deg < l} are
    11, 32, and 32 at (n, l) = (15, 5), (17, 6), and (19, 6).
  statement: >-
    The curve is y^2 + xy = x^3 + x^2 + 1. The fields are F_2^n with
    moduli x^15+x^5+x^4+x^2+1, x^17+x^3+1, and x^19+x^5+x^2+x+1. V is
    the set of field integers below 2^l. An element x is an x-coordinate
    of an affine point when x = 0, or when x is nonzero and the absolute
    trace of x + 1 + x^{-2} is 0. Those counts are 11, 32, and 32. Each
    nonzero hit contributes two points and x = 0 contributes one, so the
    point counts are 21, 63, and 63. The leaf ratios (2^l / count)^3 are
    32768/1331, 8, and 8. Over F_2 the only affine point is (0, 1), so
    the group order is 2 and the Frobenius trace is 1. The same trace
    gives full group orders 32494, 131174, and 525086.
  mechanism: >-
    A descended S_4 search that forces each core block onto E only walks
    the x-coordinates counted here. The leaf ratio is then (2^l / that
    count)^3. This contract checks the counts. It does not run a solver.
