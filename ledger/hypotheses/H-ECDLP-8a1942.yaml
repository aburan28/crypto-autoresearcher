hypothesis:
  id: H-ECDLP-8a1942
  question_id: RQ-MONO-001
  statement: >-
    The solving degree d_solve of a decomposition system is defined by the degree
    at which the Macaulay corank reaches the SOLUTION COUNT of the ideal, but the
    nulls this program compares against set that threshold using the
    GROUP-THEORETIC decomposition count. Because the factor-base locus lies in
    the totally split locus, the two counts differ by a computable symmetry
    factor arising from the sign action, so every such null is biased by a fixed
    amount and the resulting d_solve is set at the wrong place. The hypothesis is
    that the ratio is an exact constant on the generic stratum, with computable
    deviations on named degenerate strata, and that applying the correction
    shifts d_solve by 0 or 1 degree per cell. Source proposal: IDEA-20260808-481e07.
  mechanism: >-
    On the factor-base locus the summation polynomial splits completely, so the
    fibre arithmetic is fixed and the roots are exactly the x-coordinates of
    signed sums of the other factor-base points. The decomposition ideal is posed
    in x-coordinates, so a set-theoretic decomposition corresponds to a group of
    sign vectors, some of which map to the same x-tuple and some to distinct
    ones. The ideal-theoretic point count therefore exceeds the group-theoretic
    decomposition count by a factor determined by the order of the sign group
    modulo the identifications the x-map induces. A corank threshold set at the
    smaller count fires at a lower degree than it should, and since d_solve is an
    integer, a small multiplicative error in the threshold can move it by one -
    which changes an algebraic-oracle cost by the ratio of consecutive Macaulay
    column counts.
  assumptions:
    - >-
      CRITICAL DISCREPANCY, RECORDED RATHER THAN RESOLVED. The source proposal
      predicts the ratio is "exactly 2^(m-1) on the generic stratum". This design
      session opened knowledge/findings/KN-FIND-a8990a.md and read its Theorem C
      and its object definition verbatim. Theorem C's root set is
      "{ x(eps_1 P_1 + ... + eps_n P_n) }" with n = m-1 fixed in the object
      section, which makes the proposal's quotation of the ROOT SET faithful; but
      the same entry states deg_T S_m = 2^(m-2) and describes the operational
      content as "pick m-1 factor-base points, compute 2^(m-2) signed sums by
      group arithmetic, test membership". The source entry therefore counts
      2^(m-2) where the proposal predicts a factor 2^(m-1). The two may be
      counting different objects (roots in the last variable after the global
      sign flip is quotiented, versus sign vectors before), but the difference is
      exactly a factor of 2 in the quantity the whole record turns on. This
      hypothesis therefore does NOT adopt 2^(m-1) as forced; it pre-registers the
      three candidate values {2^(m-2), 2^(m-1), 2^m} and lets exhaustive
      enumeration decide.
    - >-
      That the degree instrument defines d_solve by a corank threshold against a
      solution count. If it uses a different criterion, the correction has a
      different consumer and the record becomes a documentation note.
    - >-
      KN-FIND-a8990a's Theorem C as recorded. Its own confidence_note states it
      is derivation tier and "NOT independently reviewed by a validator, a red
      team, or a human reader experienced in function fields or arithmetic
      geometry" and that novelty is not adjudicated; that caveat propagates here
      in full.
    - >-
      That the lift convention is declared per cell. Whether the factor base is a
      set of x-coordinates or a symmetric set of points changes the correction,
      and the convention differs across this corpus's records.
  proof_search_map:
    bottleneck: >-
      The step whose removal changes a measured degree is the choice of solution
      count used as the corank threshold. The correction is arithmetic once the
      right count is identified, so the bottleneck is identifying it, not
      computing it.
    baseline_embedding:
      parameter_slice: >-
        m = 2 is the exact boundary: the sign group is smallest there, the
        predicted factor is checkable by hand on a single curve, and any
        candidate value is distinguishable from the others.
      reproduction_check: >-
        A frozen fixture: at m = 2 on one named toy curve, count ideal solutions
        and group decompositions by hand and by driver, and require agreement.
    observation_collision:
      observable: >-
        The ratio of the ideal-theoretic F_p-point count of V(I_R) to the
        group-theoretic decomposition count of R over the signed factor base.
      distinct_preimage_search: >-
        PERFORMED AND IT IS THE CENTRAL RISK. The same ratio arises from any
        index set closed under negation, whether or not it comes from an elliptic
        curve, because the factor is a property of the sign action on the index
        set. That collision is why a curve-free null is REQUIRED here and why the
        contract states its consequence in advance.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          A stratified correction factor - one value per named stratum (generic,
          two equal coordinates, signed partial sum in the 2-torsion,
          factor-base point of order 2) with the stratum sizes reported.
        predicted_gain: >-
          Replaces one factor applied everywhere with a stratification, which is
          what stops a generic-stratum constant from being silently wrong on the
          degenerate cells where such factors actually go wrong.
    quantifier_order: >-
      FOR ALL cells (p, B, m) in the tested range and FOR ALL targets R on the
      generic stratum, the ratio equals a single constant depending only on m.
      The existential that breaks it is THERE EXISTS a generic-stratum target
      whose ratio differs, which would mean the stratification is wrong.
    method_ceiling:
      strongest_certifiable_claim: >-
        That, at p at most 1009, B at most 8 and m at most 3, the ratio takes a
        specific value on the generic stratum and specific values on the named
        degenerate strata, and that applying the corrected threshold shifts
        d_solve by a specific integer at each available cell. It cannot certify
        the ratio at larger m or larger B, and it moves no exponent.
      nearby_object_control: >-
        A structured factor base - a multiplicative-coset base - where the
        degenerate fraction may be far larger than the generic expectation. If
        the correction holds there too, it is robust; if not, that is a finding
        about that base.
    proof_obligations:
      - claim: The generic-stratum ratio equals one of the three pre-registered values
        responsibility: correctness
      - claim: The degenerate strata are enumerated and their sizes reported
        responsibility: size
      - claim: The correction is applied per stratum, not globally
        responsibility: scope
      - claim: The curve-free null does not reproduce the measured ratio
        responsibility: interface
      - claim: The integer shift in d_solve is reported per cell, including zero shifts
        responsibility: baseline
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-STRATUM-1
      formal_statement: >-
        The degenerate strata (two equal coordinates, a signed partial sum lying
        in the 2-torsion, a degree drop) have density O_m(1/B) in the m-fold
        product of the factor base, so a generic-stratum correction factor is
        exact up to a relative error O_m(1/B).
      random_model_justification: >-
        Codimension counting for a proper closed subscheme intersected with a
        product set - the standard expectation that a proper condition cuts a
        1/B fraction. KN-FIND-a8990a records the non-good locus as having
        O_m(q^(n-1)) points out of q^n, i.e. relative density O_m(1/q); the
        analogous statement on the factor-base product is the same codimension
        count with q replaced by B, and it is heuristic ONLY in that the factor
        base is a chosen set rather than a generic subvariety.
      supporting_results:
        - >-
          knowledge/findings/KN-FIND-a8990a.md, branch-locus corollary, read
          verbatim by this design session: "Degree drops exactly on
          S_{m-1}(a_1,...,a_n) = 0 (some signed sum is O); roots collide exactly
          when sum_{i in S} eps_i P_i in E[2] for a proper nonempty S, the case
          S = {i} being ramification of pi." This supplies the exact stratum
          definitions, not their densities on a chosen factor base.
      validation_experiment_ids:
        - EXP-ECDLP-c49501
      falsification_condition: >-
        The measured degenerate fraction on any tested factor base exceeds the
        O_m(1/B) expectation by more than the declared factor. A structured base
        with a large degenerate fraction is a FINDING about that base, not noise,
        and must be reported individually.
  structural_ingredients:
    - description: >-
        Theorem C of the summation-cover monodromy finding: if every argument is
        the x-coordinate of an F_q-rational point and the point is good, then S_m
        splits completely over F_q at every m, with root set exactly
        "{ x(eps_1 P_1 + ... + eps_n P_n) }" where n = m-1; equivalently the
        factor-base locus lies inside the totally split locus. The same entry
        fixes deg_T S_m = 2^(m-2).
      citation: knowledge/findings/KN-FIND-a8990a.md
      provenance: internal
      verified_by: >-
        Coordinator subagent under TASK-20260904-43152a opened
        knowledge/findings/KN-FIND-a8990a.md in this session and read its front
        matter, its object definition (lines 56-75, which fix n = m-1 and
        deg_T S_m = 2^(m-2)), and its Theorem C, corollaries and scope sections
        (lines 145-204) VERBATIM. The Theorem C statement and the branch-locus
        corollary quoted in this record are reproduced from that read. The entry
        is derivation tier and its own confidence_note states it is NOT
        independently reviewed; that caveat is carried forward rather than
        dropped. The discrepancy between the entry's 2^(m-2) and the source
        proposal's predicted 2^(m-1) was found by this read and is recorded in
        assumptions rather than silently adopted.
      role: >-
        Fixes the fibre arithmetic that makes the solution count computable, and
        supplies the exact degenerate-stratum definitions.
    - description: >-
        First-moment conservation - the mean decomposition yield is fixed at
        binomial(B+m-1, m)/N for every factor base of size B - which fixes the
        count of MULTISETS and is a third count distinct from both the
        group-theoretic and the ideal-theoretic ones.
      citation: knowledge/findings/KN-FIND-007.md
      provenance: internal
      verified_by: >-
        NOT FULLY VERIFIED BY THIS SESSION. Only the committed title line of
        knowledge/findings/KN-FIND-007.md was read, by pattern search. The
        derivation was not opened, and no numeric claim is taken from it here
        beyond the form of the mean-yield expression, which the contract
        re-derives.
      role: >-
        Identifies the third count, so the experiment separates multiset,
        group-theoretic and ideal-theoretic counting rather than conflating them.
  reduction_chain:
    core_problem: >-
      Whether the solution-count threshold used inside degree measurements in
      this program is the ideal-theoretic count, and if not, by how much the
      resulting d_solve is biased.
    corollaries: []
  predictions:
    - metric: >-
        ratio R = (number of F_p-points of V(I_R)) / (number of group-theoretic
        decompositions of R over the signed factor base), an exact rational,
        dimensionless, by exhaustive enumeration on the generic stratum
      direction: different
      minimum_effect: >-
        Exactly one of the three pre-registered candidates 2^(m-2), 2^(m-1) or
        2^m, constant across all generic-stratum targets at a cell. WHICH ONE IS
        NOT PREDICTED, and the reason is recorded in assumptions: the source
        proposal says 2^(m-1) while the source finding's own degree is 2^(m-2).
        A measured value outside the three candidates means the derivation is
        wrong and must be redone before anything else is used.
    - metric: >-
        integer difference in d_solve computed with the corrected and the
        uncorrected threshold, in degrees
      direction: different
      minimum_effect: >-
        0 or 1 at most cells and exactly 1 at cells where the corank crosses
        between the two counts. At the cells where it is 1, the algebraic-oracle
        cost changes by the ratio of consecutive Macaulay column counts, so the
        correction is not cosmetic even though it is small.
    - metric: >-
        degenerate-stratum fraction, dimensionless, per cell, with the stratum
        breakdown
      direction: lower
      minimum_effect: >-
        O_m(1/B), reported with the largest observed fraction and the factor base
        achieving it. A structured base with a much larger fraction is reported
        as a finding about that base.
    - metric: >-
        which solution count each archived artifact used, an audit label per
        artifact
      direction: different
      minimum_effect: >-
        Reported as measured. If artifacts do not record which count was used,
        that absence is itself the reportable result.
  test_boundary:
    instances:
      - 'Toy prime-field elliptic curves at p in {101, 211, 1009}.'
      - 'Factor bases of size B in {4, 6, 8}, both as x-coordinate sets and as symmetric point sets.'
      - 'A curve-free symmetric index set in Z/NZ of matched size, as the null.'
      - 'A structured multiplicative-coset factor base, as the nearby-object control.'
    parameters:
      m_values: '2, 3'
      p_values: '101, 211, 1009'
      B_values: '4, 6, 8'
      formulations: 'unsymmetrised and elementary-symmetric, both reported'
      lift_convention: 'declared per cell, never inferred'
    implementation: >-
      Exhaustive enumeration. Ideal solutions are counted by direct search over
      the finite coordinate space at these sizes, and group decompositions by
      direct search over the signed factor base; no Groebner engine is required
      for the counting arm, and the corank arm reuses whatever degree instrument
      the cell already has.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 1
      maximum_memory_gb: 8
      maximum_runs: 4
  falsification_conditions:
    - >-
      The measured generic-stratum ratio is none of the three pre-registered
      candidates. The derivation is wrong and must be redone before any
      correction is applied anywhere.
    - >-
      The measured generic-stratum ratio is not constant across targets at a
      cell. The stratification is wrong and the generic stratum is not what the
      derivation says it is.
    - >-
      Applying the correction changes d_solve at no cell in the reachable range.
      The correction is real but inert at toy scale - a legitimate and honest
      outcome, recorded so that nobody re-derives it.
    - >-
      Archived artifacts already used the ideal-theoretic count. There is nothing
      to correct and the record becomes a documentation note.
    - >-
      The curve-free symmetric index set reproduces the measured ratio exactly.
      The factor is then a property of the sign action on any negation-closed
      index set and NOT of elliptic curves, and nothing measured may be quoted as
      a statement about elliptic curves or the ECDLP.
  interpretation_limits:
    - >-
      This is a correction to a NULL, not a finding about curves, and it moves no
      exponent. The incumbent is the uncorrected null.
    - >-
      THE CURVE-FREE READING IS THE EXPECTED ONE AND IS DECLARED IN ADVANCE. The
      correction factor arises from the sign action on a negation-closed index
      set. If the curve-free null reproduces it, that is the honest reading and
      nothing here is about elliptic curves. Only a measured DEPARTURE of the
      curve arm from the curve-free null would be curve-specific content.
    - >-
      Toy tier for the verification arm - p at most 1009, B at most 8, m at most
      3. NOT TESTABLE AT REACHABLE SCALE: whether the same factor and the same
      degenerate-density law hold at cryptographic p and at the B a real factor
      base would use is NOT tested here and is not asserted. Exhaustive
      enumeration of the ideal's point set is what bounds the reach, and it does
      not extend.
    - >-
      The source theorem is derivation tier and NOT independently reviewed by its
      own statement. Every consequence drawn from it inherits that status.
    - >-
      The source proposal carries a dispatch gate naming GOAL-MONO-001 as paused.
      THIS DESIGN SESSION COULD NOT VERIFY THAT GATE: no goal record
      ledger/goals/GOAL-MONO-001.yaml and no coordination/goals/GOAL-MONO-001
      directory exists in the tree as of 2026-09-04 (checked by glob). The gate
      is therefore recorded as UNRESOLVED, and resolving it is a precondition of
      dispatch, not an assumption of this hypothesis.
    - >-
      The correction's consumer is the prime-field degree axis of other lanes,
      not this question. Dispatching it under a different lane is a Coordinator
      decision and nothing here performs one.
  status: proposed
  proposed_by: coordinator
