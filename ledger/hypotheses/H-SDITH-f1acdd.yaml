hypothesis:
  id: H-SDITH-f1acdd
  question_id: RQ-SDITH-001

  statement: >-
    SCOPE: the forgery cost of a tau-fold parallel-repeated 5-round
    MPC-in-the-Head signature with N parties per repetition and first-phase
    cheating probability p, evaluated in exact rational arithmetic over the
    adversary's strategy split tau'; illustrative (tau, N, p) grids plus SDitH's
    own triple IF a specification can be obtained. CLAIM TIER derivation. NO
    FORGERY IS PRODUCED, NO SIGNATURE IS FORGED, NO CERTIFICATE EXISTS, AND NO
    BREAK IS CLAIMED AT ANY TIER.
    THE CLAIM, IN THREE PARTS.
    (G1) THE INTERIOR OPTIMUM REMOVES ROUGHLY HALF THE EXPONENT. The forgery
    cost is min over tau' in {0,...,tau} of [ 1/P_1(tau',tau,p) + N^{tau-tau'} ]
    with P_1 the upper binomial tail, and its minimizer is INTERIOR whenever
    tau >= 2, 0 < p < 1 and N > 1. At p = 1/N the exact optimum is between 0.44
    and 0.54 of the naive product bound min(tau log2(1/p), tau log2 N) for
    N = 256 over tau in [2,64], and falls to 0.2575 at N = 2 and tau = 64: the
    smaller N, the more the binomial multiplicity C(tau,tau') erodes the bound.
    (G2) THE OPTIMAL SPLIT IS AT LEAST HALF THE REPETITIONS, AND ITS EXCESS IS
    N-DIRECTED. tau*/tau >= 1/2 whenever p >= 1/N, with the excess above 1/2
    strictly larger for smaller N -- computed as 0.500 rising to 0.562 at
    N = 256 and 0.500 rising to 0.750 at N = 2.
    (G3) SDitH LEAVES NO GRINDING SLACK, AND SAYING SO REQUIRES THE COMPUTATION
    RATHER THAN THE ASSURANCE. SDitH's claimed forgery security is predicted to
    lie within 2 bits of the exact interior optimum at its own (tau, N, p). A
    positive gap above 10 bits is grinding slack of the size this goal exists to
    look for; a negative gap above 10 bits is conservatism of the same size and
    is reported with equal weight.
    The hypothesis rests on a cost function that is RECALLED-UNVERIFIED, and its
    first obligation is to check that function against a primary source. If the
    function is wrong, every number here is void and the record is superseded,
    not edited.

  mechanism: >-
    THE COST FUNCTION IS RECALLED-UNVERIFIED. Its STRUCTURE is written from
    memory of a standard forgery attack against parallel-repeated 5-round
    Fiat-Shamir identification, attributed in memory to Kales and Zaverucha; NO
    AUTHOR, VENUE, YEAR, THEOREM NUMBER OR PAGE IS ASSERTED and the attribution
    is a candidate to check, never an authority. Every NUMBER below was computed
    in this session in exact Fraction arithmetic FROM that stated structure and
    is reproducible from it by a third party with a bare interpreter.

    THE TWO CHEATING STRATEGIES. Per repetition a forger may cheat in the FIRST
    phase -- submit a false witness and hope the MPC check's first challenge
    accepts it, probability p -- or in the SECOND phase -- run honestly with one
    corrupted party and hope the second challenge opens a different one,
    probability 1/N. Because both challenges are hash outputs the forger GRINDS,
    re-hashing until the first challenge is favourable on as many repetitions as
    he chooses.

    THE COST. Targeting tau' first-phase successes, the expected number of hash
    trials is 1/P_1(tau',tau,p) with
      P_1(tau',tau,p) = sum_{i=tau'}^{tau} C(tau,i) p^i (1-p)^{tau-i},
    after which the remaining tau - tau' repetitions must be carried by
    second-phase luck at cost N^{tau-tau'}. Hence
      cost(tau) = min_{0 <= tau' <= tau} [ 1/P_1(tau',tau,p) + N^{tau-tau'} ].
    THE MINIMUM IS OVER tau' AND tau' IS THE ADVERSARY'S CHOICE. The two terms
    move in opposite directions -- 1/P_1 increasing in tau', N^{tau-tau'}
    decreasing -- so the minimum is interior and strictly below both endpoints
    whenever tau >= 2.

    THE NAIVE BOUND IS EXACTLY THE TWO ENDPOINTS. tau' = 0 gives 1 + N^tau;
    tau' = tau gives p^{-tau} + 1. So min(tau log2(1/p), tau log2 N) bits, which
    is what one writes down by multiplying per-repetition soundness errors. The
    gap to the interior optimum is the GRINDING SLACK.

    RESULT 1 -- THE SLACK, COMPUTED IN EXACT RATIONALS AT N = 256, p = 1/256.
      tau =  1 : naive   8.00, exact   8.01, slack  -0.01, tau* =  0
      tau =  2 : naive  16.00, exact   8.59, slack   7.41, tau* =  1
      tau =  4 : naive  32.00, exact  16.22, slack  15.78, tau* =  2
      tau =  8 : naive  64.00, exact  32.02, slack  31.98, tau* =  4
      tau = 16 : naive 128.00, exact  58.78, slack  69.22, tau* =  9
      tau = 17 : naive 136.00, exact  64.02, slack  71.98, tau* =  9
      tau = 32 : naive 256.00, exact 115.41, slack 140.59, tau* = 18
    Monotone increasing in tau, reaching 141 bits at tau = 32. THE tau = 1 ROW IS
    THE NULL: with one repetition the minimization ranges over only the two
    endpoints, no interior point exists, and the slack is forced non-positive.
    It comes out -0.01, and -0.58 at (N,p) = (2,1/2).

    RESULT 2 -- WHY IT IS HALF, AND WHY IT IS LESS THAN HALF WHEN N IS SMALL.
    Ratio exact/naive at p = 1/N:
      N = 256, tau = 2,4,8,16,32,48,64: 0.5366, 0.5070, 0.5003, 0.4592, 0.4508,
                                        0.4476, 0.4458
      N =  32:                          0.5593, 0.5116, 0.4844, 0.4394, 0.4217,
                                        0.4174, 0.4138
      N =   2:                          0.8685, 0.5946, 0.4283, 0.3360, 0.2838,
                                        0.2656, 0.2575
    Mechanism: at the optimum the forger splits the repetitions roughly in half
    and pays about max((tau/2) log2(1/p), (tau/2) log2 N) rather than the SUM of
    the two full-length costs, so the exponent halves. The further erosion below
    1/2 is the binomial multiplicity C(tau,tau'), a free gift to the grinder that
    is largest when few repetitions are needed on the guessing side, i.e. when N
    is small -- which is why the N = 2 row reaches 0.2575 while the N = 256 row
    stops at 0.4458. The optimal split obeys
      tau*/tau -> log2 N / (log2 N + log2(1/p)) plus a positive multiplicity
    correction, predicting exactly 1/2 at p = 1/N; the computed tau*/tau values
    are 0.500 at small tau rising to 0.562 (N = 256) and 0.750 (N = 2), the
    excess being precisely that correction. G2 is that forced DIRECTION, and it
    is an independent prediction of the same mechanism along a second axis -- so
    agreeing on tau while disagreeing on N localizes an error to the
    multiplicity term rather than leaving "the numbers were off".

    RESULT 3 -- WHAT THE AUDIT ACTUALLY DECIDES, AND WHY THE EXPECTED ANSWER IS
    STILL WORTH COMPUTING. Because the slack is 70+ bits at plausible operating
    points, no designer could have chosen tau against the naive bound and still
    claimed 128-bit security; the arithmetic would be off by more than half. The
    expected finding is therefore NO SLACK. Its value lies in three things
    produced on the way: the derivation the goal's objective asks for in place of
    an inherited assurance; the exact tau*, which is the adversary's optimal
    strategy and is not usually published; and whether the specification's tau
    carries any MARGIN over the interior optimum or sits exactly at it -- a
    scheme sitting exactly at lambda has no slack in either direction, and the
    goal record notes a Round-3 tweak deadline in which N or the MPC check may
    move.

    RESULT 4 -- THE QUANTIFIER-ORDER AUDIT, INDEPENDENT OF ALL ARITHMETIC.
    The correct claim is: FOR ALL adversaries A making at most Q hash queries,
    the forgery probability is at most Q/cost(tau), where cost(tau) ALREADY
    contains the minimum over tau'. The defective claim is: THERE EXISTS tau'
    such that FOR ALL A ..., which fixes the split before the adversary chooses
    it and bounds a strictly weaker adversary class. Classifying the
    specification's soundness statement is a pen-and-paper check with a binary
    answer and it is independent of every number above: a specification can carry
    the right number by inheritance and the wrong statement, or the right
    statement and a stale number.

    THE PART OF THE MODEL MOST LIKELY TO BE WRONG, STATED HERE RATHER THAN
    BURIED. P_1 is a binomial tail, which presumes the tau repetitions have
    INDEPENDENT first-phase outcomes. MPCitH designs routinely correlate
    repetitions through seed trees and hypercube optimizations for bandwidth. If
    SDitH's repetitions share randomness, the binomial model is not merely
    imprecise, it is the wrong model, and the honest deliverable is to report
    that rather than to evaluate a formula that does not apply.

  assumptions:
    - >-
      THE RECALLED COST FUNCTION IS THE RIGHT ONE. RECALLED-UNVERIFIED and
      load-bearing for every number. If the true cost raises 1/P_1 to a power, or
      couples the phases, or charges grinding differently, all numbers are void.
      Checking it against a primary source is Stage 0 of EXP-SDITH-991951 and the
      experiment is designed so that a failed check costs the SDitH conclusion,
      not the instrument.
    - >-
      THE TRANSFORM IS 5-ROUND WITH EXACTLY TWO GRINDABLE CHALLENGE PHASES.
      RECALLED-UNVERIFIED as a description of SDitH. A 3-round or
      hypercube-collapsed variant has different arithmetic entirely.
    - >-
      p IS A SINGLE NUMBER, IDENTICAL AND INDEPENDENT ACROSS REPETITIONS. See
      HEUR-SDITH-F1A-2; this is the most likely place the model breaks.
    - >-
      GRINDING COST IS MEASURED IN HASH EVALUATIONS AND THESE DOMINATE. Generic
      hash security (collision, multi-target preimage) is a SEPARATE additive
      budget, deliberately excluded so the two are not double-counted; the
      specification's headline is presumably a minimum over both and the audit
      reports them separately rather than merging them.
    - >-
      THE ADVERSARY GAINS NOTHING FROM MIXING STRATEGIES WITHIN A REPETITION.
      NOT ESTABLISHED. If he does, every computed cost is an UPPER BOUND on his
      cost and a specification matching it exactly could still be optimistic; the
      direction of that error is stated because it works against the comfortable
      conclusion.
    - >-
      THE ENVIRONMENT PROVIDES THE STANDARD LIBRARY, WHICH IS ALL THAT IS
      NEEDED. Measured this session: Python 3.11.15, numpy 2.4.6 importable,
      sympy NOT installed. fractions.Fraction and math.comb suffice, and exact
      rationals are REQUIRED rather than preferred: binomial tails at tau = 64
      with p = 1/256 underflow double precision and a float implementation
      returns the wrong tau* silently.

  proof_search_map:
    bottleneck: >-
      The quantifier on tau'. Everything else in the analysis -- the binomial
      tail, the party count, the false-positive rate -- is arithmetic that a
      designer will have got right. Whether the minimum over the adversary's
      split is taken at all, and whether it is taken AFTER the adversary is
      quantified, is one line of a security statement, is worth 70+ bits at
      plausible parameters, and is the only step whose removal changes the
      claimed security level by a factor of two.
    baseline_embedding:
      parameter_slice: >-
        tau = 1. With a single repetition the strategy space collapses to the two
        endpoints, the interior optimum does not exist, and the cost function
        must reduce EXACTLY to the naive bound plus the additive constant. This
        is the parameter slice at which the claimed mechanism is definitionally
        absent, so it reproduces the pre-attack baseline exactly rather than
        approximately. A SECOND slice: p = 0, where no first-phase cheating is
        possible, only tau' = 0 is admissible, and the cost is forced to exactly
        1 + N^tau -- the pure guessing attack.
      reproduction_check: >-
        RUN, AND PASSED, BEFORE THIS RECORD WAS WRITTEN, in exact rational
        arithmetic. tau = 1 returns slack -0.01 at (N,p) = (256,1/256) and -0.58
        at (2,1/2): non-positive, as forced. The check is symbolic in origin (the
        minimization has no interior point) and numeric in execution, and the two
        agree.
    observation_collision:
      observable: >-
        The scalar claimed forgery security in bits, which is what a
        specification publishes and what a downstream cost table consumes.
      distinct_preimage_search: >-
        A COLLISION EXISTS AND IT IS THE ENTIRE REASON THE AUDIT HAS CONTENT. The
        SAME published number -- say 128 bits -- is produced by two structurally
        distinct ground-truth situations: (i) a scheme whose tau was chosen
        against the interior optimum, which genuinely offers 128 bits; and (ii) a
        scheme whose tau was chosen against the naive endpoint bound, which at
        N = 256, p = 1/256 offers about 0.46 x 128, i.e. roughly 59 bits. One
        sits on each side of the claimed conclusion, which is exactly the
        preimage pair inventor-protocol section 8 audit 2 asks to be searched
        for. THE PUBLISHED SCALAR DOES NOT IDENTIFY WHICH. The separating
        condition is named and is cheap: read tau, N and p and recompute, or read
        the soundness statement's quantifier order. Without one of those two, a
        downstream record citing the published number cannot tell the cases
        apart -- and this program has no such record for any MPCitH scheme.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (the published bit-security) fixed and vary the
          forgotten structure (which bound the designer optimized tau against).
          The intrinsic invariant distinguishing the resulting objects is the
          triple (tau, N, p) together with the recomputed interior optimum -- all
          publishable, all cheap, and none of them recoverable from the scalar.
        predicted_gain: >-
          None to any attacker. The gain is an identifiability repair: a rule
          that no MPCitH security figure enters this corpus without its
          (tau, N, p) and a recomputed optimum attached.
      - transform: representation_reduction
        proposed_object: >-
          Move the soundness question from a probabilistic statement about
          adversaries into an exact finite minimization over tau + 1 rationals,
          where "does the specification charge the attack" becomes an equality
          test between two rationals rather than a judgement about a proof.
          Encoding: strategies -> tau'. Completeness: every across-repetition
          split is represented. Soundness: within-repetition mixing is NOT
          represented, so the computed value is an upper bound on the
          adversary's cost, and the obligation is discharged by declaring the
          direction rather than by an argument. Transfer: exact at the deployed
          parameters. Cost loss: none.
        predicted_gain: >-
          Converts an unanswerable question ("does the transform leave grinding
          slack") into a millisecond computation with a pre-registered
          threshold, reusable unchanged for GOAL-MQOM-001 and GOAL-FAEST-001.
    quantifier_order: >-
      THE AUDIT IS ITSELF A QUANTIFIER-ORDER AUDIT, SO THIS FIELD IS BOTH THE
      METHOD AND THE OBJECT.
      WHAT THIS HYPOTHESIS CLAIMS, in order: FOR ALL (tau, N, p) in the declared
      grid, EXISTS an integer tau* in {0,...,tau} computed by the stated finite
      minimization, such that the forgery cost equals the value at tau*; and FOR
      ALL tau >= 2 with 0 < p < 1 < N, that tau* is interior and the value is
      strictly below both endpoints. The witness tau* IS allowed to depend on
      (tau, N, p) -- it must, and the closed-form approximation says how -- and
      the claim is uniform only in the sense that one finite procedure computes
      it everywhere.
      WHAT THE AUDIT HUNTS IN THE SPECIFICATION: the order "EXISTS tau' such
      that FOR ALL adversaries A, ..." in place of "FOR ALL A, ...
      Q/cost(tau)". The first permits the analysis to fix the split before the
      adversary chooses it, which is precisely a witness that is NOT allowed to
      depend on the instance being made to serve a claim that quantifies over
      instances. The check is a binary classification of one sentence and is
      independent of every number in this record.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that ONE known forgery strategy is or is not charged correctly
        at ONE transcribed parameter set, plus an exact evaluator for that
        strategy with validated null and positive controls. IT CANNOT certify
        that SDitH's forgery security is correct, cannot cover the GGM-tree or
        VOLE soundness questions, cannot cover within-repetition mixing, cannot
        cover implementation attacks, and cannot produce or verify a forgery.
        A "no slack" outcome is a statement about one attack, not about the
        scheme.
      nearby_object_control: >-
        (tau, N, p) = (64, 2, 1/2) -- the regime where grinding slack is
        unmistakable and where the hoped-for conclusion "the naive bound is
        adequate" is FALSE by 47.52 bits. It is the same code path with three
        arguments changed, which is as near as this object gets. A second and
        opposite nearby object: p = 0, where grinding is impossible and the
        slack is forced to exactly 0, so the pair (p = 0, p = 1/2) brackets the
        mechanism from both sides. An instrument that reports the same slack at
        both has not identified the load-bearing structure and its verdict on
        SDitH is inadmissible.
    proof_obligations:
      - claim: >-
          The slack is non-positive at tau = 1 for every (N, p), by absence of an
          interior point.
        responsibility: baseline
      - claim: >-
          The minimum is interior and strictly below both endpoints whenever
          tau >= 2, 0 < p < 1, N > 1.
        responsibility: correctness
      - claim: >-
          tau*/tau >= 1/2 whenever p >= 1/N, with the excess above 1/2
          decreasing in N.
        responsibility: strictness
      - claim: >-
          All tail sums are exact rationals; a float recomputation agrees to
          within 1e-9 in log2 or the run is an integrity failure.
        responsibility: correctness
      - claim: >-
          The repetitions have independent first-phase outcomes, verified by
          reading the construction rather than assumed.
        responsibility: interface
      - claim: >-
          Within-repetition mixing is either excluded by argument or the computed
          cost is reported as an upper bound with that direction attached.
        responsibility: soundness_gap
      - claim: >-
          Grinding cost and generic hash security are reported as separate
          budgets and never merged.
        responsibility: scope
      - claim: >-
          No forgery is produced and nothing here is reportable as a break at any
          claim tier.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. NO complexity improvement is claimed and NO new attack is
    proposed; the attack evaluated is recalled to be standard and this record
    says so in its own claim. The quantity computed is nonetheless an
    exponent-level quantity -- 64.02 bits against a naive 136 at the
    illustrative tau = 17 operating point -- so the audit operates at exponent
    granularity while contributing no improvement. sota_delta on every attack
    axis is exactly zero. dominated_by is not applicable: no Pareto point is
    occupied, and the attack is memoryless, so there is no memory-frontier row
    that could dominate it.

  heuristic_assumptions:
    - id: HEUR-SDITH-F1A-1
      formal_statement: >-
        NOT LOAD-BEARING FOR THE ARITHMETIC. Given the cost function, every
        number is an exact rational computation over a finite index set: no
        distributional assumption, no asymptotic, no fitted parameter. The
        heuristic content is entirely EVIDENTIARY -- whether the cost function is
        the right one -- and is resolved by reading a source, not by an argument.
      random_model_justification: >-
        The binomial tail is exact, the minimization is over tau + 1 integers,
        and Fraction arithmetic is exact. There is no random model to justify.
      supporting_results: []
      validation_experiment_ids: [EXP-SDITH-991951]
      falsification_condition: >-
        Stage 0 finding that the primary source's cost function differs from the
        recalled one. Every number is then withdrawn and recomputed in a
        SUPERSEDING record, never by editing this one.
    - id: HEUR-SDITH-F1A-2
      formal_statement: >-
        INDEPENDENCE ACROSS REPETITIONS. The tau parallel repetitions have
        independent first-phase outcomes, so the number passing phase one is
        Binomial(tau, p) and P_1 is its upper tail.
      random_model_justification: >-
        Immediate if the repetitions use independent randomness, which is the
        textbook construction. It FAILS if a seed-tree or hypercube optimization
        correlates them -- and MPCitH designs do exactly that kind of
        optimization to save bandwidth, which is why this is a heuristic and not
        a fact. THIS IS THE MOST LIKELY PLACE THIS HYPOTHESIS IS WRONG.
      supporting_results: []
      validation_experiment_ids: [EXP-SDITH-991951]
      falsification_condition: >-
        Reading the construction in Stage 0 and finding that the repetitions
        share randomness. The audit then REPORTS THAT AS ITS FINDING rather than
        evaluating a formula that does not apply -- and that finding would be
        more valuable than the arithmetic, because it would mean the standard
        accounting is the wrong model rather than a stale number.
    - id: HEUR-SDITH-F1A-3
      formal_statement: >-
        NO BETTER STRATEGY. The across-repetition split exhausts the forger's
        options, so the computed minimum is the true forgery cost rather than an
        upper bound on it.
      random_model_justification: >-
        NONE. Asserted by the standard analysis and NOT verified here. Two named
        routes to a cheaper attack: partial cheating within a repetition, and
        adaptive re-grinding of already-settled repetitions.
      supporting_results: []
      validation_experiment_ids: [EXP-SDITH-991951]
      falsification_condition: >-
        The pen-and-paper check failing to discharge either route. Every computed
        cost is then reported as an UPPER BOUND on the forger's cost and the
        comparison against the specification's claim carries that direction
        explicitly -- meaning a specification matching the computed value exactly
        would still be unproven rather than confirmed.

  structural_ingredients:
    - description: >-
        Two-strategy forgery optimization against parallel-repeated 5-round
        Fiat-Shamir identification, with cost
        min_{tau'} [ 1/P_1(tau',tau,p) + N^{tau-tau'} ].
      citation: >-
        RECALLED-UNVERIFIED. Attributed in memory to Kales and Zaverucha; NO
        AUTHOR, VENUE, YEAR, THEOREM NUMBER OR PAGE IS ASSERTED and this text
        must not be read as a citation. It is a candidate to check and the check
        is Stage 0.
      role: the entire cost model; if it is wrong, the hypothesis is void
    - description: >-
        Upper binomial tail and its multiplicity factor C(tau, tau'), which is
        the source of the erosion below the half-exponent heuristic.
      citation: Elementary; derived and computed in this record.
      role: supplies the exact grinding cost and the N-directed correction of G2

  reduction_chain:
    core_problem: >-
      Determine whether the MPCitH transform's multi-round soundness accounting,
      as instantiated by a specific parameter triple, charges the known
      two-strategy grinding forgery at its interior optimum.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. No reduction is offered from this computation to any
      statement about SDitH's security, and three gaps block one: the cost
      function is unverified, the parameters are unread, and one charged attack
      is not a security proof. The instrument does transfer unchanged to
      GOAL-MQOM-001 and GOAL-FAEST-001, but transferring an instrument is not a
      reduction and is not recorded as one.

  predictions:
    - metric: >-
        K1 -- grinding slack at tau = 1, any (N, p)
      direction: lower
      minimum_effect: >-
        NON-POSITIVE, forced. Computed: -0.01 at (256, 1/256) and -0.58 at
        (2, 1/2). This is the null and it CAN FAIL in two specific known ways:
        an off-by-one in the tail sum's lower limit, or dropping the additive +1
        terms, both of which produce a positive number here.
    - metric: >-
        K2 -- grinding slack at (tau, N, p) = (64, 2, 1/2)
      direction: higher
      minimum_effect: >-
        47.52 bits within 0.05. POSITIVE CONTROL; under 20 bits means the
        instrument cannot detect grinding slack and NO negative about SDitH may
        be reported.
    - metric: >-
        K3 -- grinding slack at p = 0, any (tau, N)
      direction: different
      minimum_effect: >-
        EXACTLY 0, since only tau' = 0 is admissible and the cost is forced to
        1 + N^tau. Second null, bracketing the mechanism from the opposite side
        to K2.
    - metric: >-
        K4 -- monotonicity of the slack across tau in {1,2,4,8,16,32} at
        N = 256, p = 1/256
      direction: higher
      minimum_effect: >-
        Strictly increasing, matching -0.01, 7.41, 15.78, 31.98, 69.22, 140.59
        within 0.05 bits each, with tau* matching 0, 1, 2, 4, 9, 18 exactly.
        Reporting tau* alongside the slack is what makes this diagnostic: a slack
        that grows while tau* stays pinned at an endpoint means the minimization
        is not exploring the interior, which a slack-only report would hide.
    - metric: >-
        K5 -- ratio exact/naive at p = 1/N, N = 256, tau in [2,64]
      direction: lower
      minimum_effect: >-
        Within [0.44, 0.54] at every tau, decreasing. Computed: 0.5366, 0.5070,
        0.5003, 0.4592, 0.4508, 0.4476, 0.4458. Outside the band falsifies the
        half-exponent account.
    - metric: >-
        K6 -- optimal split fraction tau*/tau at p = 1/N
      direction: higher
      minimum_effect: >-
        AT LEAST 0.5 at every cell, with the excess above 0.5 strictly larger at
        N = 2 than at N = 256. Computed: 0.500 to 0.562 at N = 256; 0.500 to
        0.750 at N = 2. Below 0.5 anywhere refutes the multiplicity account, and
        agreeing on tau while failing on N localizes the error to that term.
    - metric: >-
        K7 -- SDitH's claimed forgery security minus the exact interior optimum
        at SDitH's own (tau, N, p), if Stage 0 supplies them
      direction: different
      minimum_effect: >-
        Within 2 bits of zero. Above +10 bits is grinding slack and routes to
        AGENTS.md rule 12 review before it is written anywhere; below -10 bits is
        conservatism of the same magnitude and is reported with equal weight
        rather than discarded as uninteresting.

  test_boundary:
    instances:
      - >-
        Illustrative grid, evaluated regardless of source availability:
        tau in {1,2,4,8,16,17,32,48,64} crossed with (N,p) in
        {(256,1/256), (256,1/251), (32,1/251), (32,1/32), (2,1/2)}.
      - >-
        SDitH's own (tau, N, p) and claimed forgery security IF AND ONLY IF a
        specification is obtained in Stage 0.
      - >-
        Controls: tau = 1 (null), p = 0 (second null), (64,2,1/2) (positive
        control and nearby object), and the two graded axes.
      - >-
        No signature is generated, no hash is ground, no forgery is attempted,
        and no implementation of SDitH is run or required.
    parameters:
      tau_sweep: [1, 2, 4, 8, 16, 17, 32, 48, 64]
      N_values: [2, 32, 256]
