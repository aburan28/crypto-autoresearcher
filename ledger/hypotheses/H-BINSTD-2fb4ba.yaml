    two arms, so the cell count is 6. One hundred fifteen minus 85 is
    30, equal to the walk floor. One hundred minus 85 is 15, and 115
    minus 100 is 15, and 15 plus 15 is 30. Eighty-five times 20 minus
    17 times 100 is 0, so 85 over 100 equals 17 over 20. One hundred
    fifteen times 20 minus 23 times 100 is 0, so 115 over 100 equals
    23 over 20. Seventeen times 20 minus 17 times 19 is 17, so 17
    over 19 is not 17 over 20. Forty minus 30 is 10. Three times 30
    is 90, and 6 times 30 is 180. Nineteen minus 17 is 2, and 23
    minus 19 is 4. Two times 4 is 8. The product of 15, 10, and 8 is
    1200. Seventeen plus 19 plus 23 is 59. Seventeen times 19 times
    23 is 7429. Twenty-three minus 17 is 6.
