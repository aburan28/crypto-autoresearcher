  title: >-
    A 129-bit word needs 17 bytes, and the two rho counts differ by 1024.
  statement: >-
    Sixteen bytes hold 128 bits, which is one short of 129, so the word
    needs 17 bytes and those 17 bytes hold 7 spare bits. A row of five
    indices of width 28, five sign bits and a 129-bit right-hand side
    is 274 bits, which is 34 bytes plus 2 bits, so the ceiling is 35
    bytes. A row of four indices of width 29, four sign bits and the
    same right-hand side is 249 bits, which is 31 bytes plus 1 bit, so
    the ceiling is 32 bytes. Blocking at 64 uses 128 vectors and
    blocking at 8 uses 16, and 128/16 is 8, which is 2 to the 3. The
    proposal's written block exponents differ by exactly 3 in both
    pairs. At a walk count of 2 to the 30 and a relative overhead of
    1/100 the record count is 50 times 2 to the 30, and at 32 bytes
    each the byte count is 1717986918400, which exceeds 17 times 10 to
    the 11 by 17986918400. At 2 to the 20 walks the byte count is
    1677721600, which is 22278400 below 17 times 10 to the 8. The ratio
    of the two byte counts is 1024, not 1000. The base-2 logarithm of
    50 is strictly above 564/100 and strictly below 565/100, so the
    written 35.64 is below the record-count logarithm and the written
    40.64 is below the byte-count logarithm. The difference of the
    written m = 5 word exponents is -806 hundredths, which is 4
    hundredths above the written -810. The smallest of the four
    shortfalls against a ratio of 2 to the 20 is 2054 hundredths,
    which is above 20.
  mechanism: >-
    The proposal prices relation rows and a distinguished-point floor
    in bytes. This contract checks those counts. It does not build a
    matrix.
