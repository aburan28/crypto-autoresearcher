# =============================================================================
# H-BINSTD-0cad45 -- Rho symmetry group on five c2pnb rows is exactly 2k
# (not 32k): pi_q-eigenvalue mu has ord(mu)=k because k prime and mu≠1;
# base-2 Frobenius is NOT an endomorphism (B∉F_2). Specified from
# IDEA-20260922-c07598 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Approved DEC-20261002-500864.
#
# ZERO RUNS in this design packet. Representation / certificate control.
# NO break. NO exponent. NO attack at m≥131. No AUXIN. No Bedrock.
# Unlocks the matched-rho divisor used by IDEA-20260922-d11575 /
# IDEA-20260922-8278db and pins the reachability-table symmetry column.
# =============================================================================
hypothesis:
  id: H-BINSTD-0cad45
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-c07598
  experiment_id: EXP-BINSTD-e6fc82
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-500864
  status: approved
  proposed_by: coordinator
  title: >-
    On the five composite-degree ANSI c2pnb curves the Pollard-rho
    automorphism group available on G has order exactly 2k (not 32k):
    ord(mu)=k by k-primality + mu≠1, and pi_2 is not an endomorphism

  statement: >-
    CLAIM (representation / certificate control). Let q=2^16 and let the
    five composite-degree ANSI X9.62 rows be c2pnb176v1 (k=11),
    c2pnb208w1 (13), c2pnb272w1 (17), c2pnb304w1 (19), c2pnb368w1 (23),
    parameters as in analysis/binstd-curve-audit/ (OpenSSL secondary;
    primary ANSI X9.62 re-derivation preferred when reachable without
    AUXIN). Let G be the prime-order subgroup of order r, h=#E(F_q) the
    published cofactor, and pi_q the F_q-power Frobenius endomorphism.
    (A) CERTIFICATE (zero-compute / Stage 1): for each row, gcd(h,r)=1
    (hence mu≠1 on G, citing IDEA-20260922-6cf862 result A / its designed
    EXP-BINSTD-0fae5a path) and k prime ⇒ ord(mu)=k exactly; with
    negation (order 2, distinct from ⟨pi_q⟩) the group ⟨pi_q,[-1]⟩ acting
    on G therefore has order EXACTLY 2k. (B) NAMED WRONG ANSWER: the
    Gal(F_{q^k}/F_2) orbit of 16k conjugate curves is NOT an automorphism
    group of one curve's points; because the smallest subfield containing
    B is F_{2^16} (B∉F_2), pi_2 is not an endomorphism of E, so charging
    32k voids every rho comparison. (C) TOY (Stage 2, dk≤41): on
    subfield cells with k' PRIME, ord(pi_q) on the prime subgroup equals
    k' exactly; on at least one COMPOSITE-k' cell a proper divisor of k'
    is observed; on cells with B∉F_2, is_pi_2_an_endomorphism=FALSE; on
    the B∈F_2 degenerate control, pi_2 IS an endomorphism (instrument
    must detect, not just assert). (D) OPEN under A3: Aut(E)=Z/2 is the
    one heuristic; c2pnb208w1 (a=0) is flagged — this contract records
    aut_E_order as OPEN unless a Stage-2 toy a=0 enumeration or a later
    j-invariant check closes it. CLAIM TIER: certificate + toy
    observational control. NO break. NO exponent. NO transfer to m≥131
    as an attack claim. Constant-factor symmetry ledger only (sqrt(2k)).

  mechanism: >-
    OBJECT FRAME. Representation R1: point on E(F_{q^k}) together with
    the endomorphism-ring element pi_q. Operation set Sigma for the
    tracked object (the rho equivalence class): {[-1], pi_q} — the group
    ⟨pi_q,[-1]⟩ of order 2k, NOT full translation and NOT the 16k-element
    curve-conjugation group. Trichotomy: QUOTIENT/canonicalisation
    (IDEA-20260901-863e36 block-system family with Gamma=⟨pi_q,[-1]⟩).
    Lossy projection: point ↦ its ⟨pi_q,[-1]⟩-orbit (discards log2(2k)
    bits); Sigma-compatible because Sigma is exactly the group being
    quotiented. WHY A CONTROL NOT AN ATTACK: changes no charged attack
    cost; fixes the ONE number (2k) every reachability-table comparison
    in this lane divides by, and makes the named 32k failure mode
    mechanically impossible. OFF-LIMITS: Magma/Sage/cypari2 as success
    path; AUXIN; deployed attacks; Amazon Bedrock; rewriting Aut(E)
    classifications as unconditional without A3 check. WHAT IS NEW:
    ord(mu)=k from k-primality at these five deployed rows; named
    32k-vs-2k wrong answer with toy detection; ceiling that
    single-target attack constructions may not charge more than order-k
    ⟨pi_q⟩ without a separate source.

  assumptions:
    - k an odd prime, q=2^16; r prime with gcd(r,h)=1 (audited, all five rows).
    - >-
      A3 (HEURISTIC): Aut(E)=Z/2 for each of the five curves (hyperelliptic
      involution only). c2pnb208w1 has a=0 and is the flagged row needing
      explicit verification; this hypothesis does NOT close A3 as
      unconditional.
    - >-
      mu≠1 on G rests on G∩E(F_q)={O} (IDEA-20260922-6cf862 result A /
      EXP-BINSTD-0fae5a path). If that certificate is later refuted, Stage 1
      of this contract must halt rather than silently restate ord(mu)=k.
    - Arithmetic / toy measurement only; nothing here is an attack at m≥131.
    - OpenSSL parameters are secondary; Stage 1 discloses provenance.

  proof_search_map:
    bottleneck: >-
      Whether Aut(E) is exactly Z/2 (assumption A3) for these five curves,
      especially c2pnb208w1 (a=0). Given A3, the order-2k derivation is
      unconditional group theory on audited inputs; the remaining load is
      making the 32k conflation mechanically detectable.
    baseline_embedding:
      parameter_slice: >-
        k=1 (E over F_q itself) must return symmetry group order 2
        (negation only); KN-LIT-096 ECC2K-130 convention
        0.886·sqrt(r)/sqrt(class_size) with class_size=2·131 is the
        standing reproduction check for the CONVENTION, not re-validated
        here.
      reproduction_check: >-
        Symbolic: set k=1 → ord(mu)=1 → group order 2. Toy: k'=1 cell (or
        explicit negation-only arm) reproduces order-2 ledger. Stage 1
        integer gcd(h,r)=1 + k-prime ⇒ ord(mu)=k on each deployed row.
    observation_collision:
      observable: >-
        Stated rho symmetry-group order (2k vs 32k) and measured
        ord(pi_q) on the prime subgroup (1 vs k vs proper divisor).
      distinct_preimage_search: >-
        Separate (i) genuine ⟨pi_q,[-1]⟩ of order 2k, (ii) Gal-orbit
        conflation charging 32k, (iii) method that cannot detect proper
        divisors (proves-too-much at composite k'). Composite-k' positive
        control and B∈F_2 degenerate control break (ii)/(iii).
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          ⟨pi_q,[-1]⟩-orbit of a point in G, canonicalised by minimum over
          2k explicit conjugates/negatives; certificate that |Gamma|=2k.
        predicted_gain: >-
          Pins matched-rho divisor sqrt(2k) for every lane comparison;
          no exponent movement (F1 walk-collision unchanged).
    quantifier_order: >-
      FOR EACH of the five curves: ord(mu)=k unconditionally given
      gcd(h,r)=1 and k prime (equality, not a bound), CONDITIONAL on A3
      for the factor 2 in 2k. SEPARATELY: FOR ANY record stating a rho or
      attack symmetry order on these rows, that order divides 2k on the
      rho side (given A3) and a single-target attack may not exceed
      ⟨pi_q⟩ order k without a named separate source. NOT claimed:
      Aut(E)=Z/2 as unconditional; multi-target/preprocessing gains;
      GHS's own use of the 16-fold curve-conjugation orbit.
    method_ceiling:
      strongest_certifiable_claim: >-
        On the five c2pnb rows, Pollard rho with negation and Frobenius
        classes exploits a group of order exactly 2k GIVEN Aut(E)=Z/2;
        pi_2 is not an endomorphism (B∉F_2); toy cells with prime k'
        show ord(pi_q)=k' and composite k' exhibits a proper divisor.
      nearby_object_control: >-
        BLOCKING. (i) Composite-k' toy: "ord(mu)=k' exactly" must NOT be
        returned unconditionally — a proper divisor must be observable.
        (ii) Null: curve over F_{2^{dk}} defined over no proper subfield
        → symmetry group order 2 regardless of field size. (iii)
        Degenerate B∈F_2: pi_2 IS an endomorphism — instrument must
        report TRUE, proving it can detect the (B) case when it holds.
    proof_obligations:
      - claim: >-
          pi_q restricted to E(F_{q^k}) is a finite-group automorphism of
          order dividing k
        responsibility: correctness
      - claim: mu≠1 on G (cited from IDEA-20260922-6cf862 / gcd(h,r)=1)
        responsibility: baseline
      - claim: ord(mu)=k exactly on each of the five rows (k prime)
        responsibility: correctness
      - claim: is_pi_2_an_endomorphism=FALSE on deployed rows (B∉F_2)
        responsibility: correctness
      - claim: >-
          Toy prime-k' cells: ord(pi_q)=k'; composite-k' cells exhibit
          a proper divisor; null object has symmetry order 2
        responsibility: feasibility
      - claim: >-
          A3 / Aut(E)=Z/2 recorded as OPEN (especially c2pnb208w1) unless
          toy a=0 enumeration or j-invariant check closes it
        responsibility: scope
      - claim: No break / exponent / m≥131 attack claimed
        responsibility: scope
    not_applicable_reason: null

  asymptotic_claim:
    problem: Matched Pollard rho baseline on five composite-degree ANSI curves
    prior_best: >-
      0.886·sqrt(r)/sqrt(2k) convention used by IDEA-20260922-d11575 without
      a filed derivation of the 2k divisor at these rows
    time_exponent: Unchanged (symmetry ledger only; sqrt(2k) constant factor)
    memory_exponent: Unchanged
    hidden_cofactor: >-
      None; orbit canonicalisation O(k) applications of pi_q charged per
      rho step (standard Wiener–Zuccherato / GLV practice)
    claim_kind: constant_factor

  heuristic_assumptions:
    - id: HEUR-BINSTD-c07598-H0
      formal_statement: >-
        NONE FOR (A) OR (B). ord(mu)=k given k prime and mu≠1 is
        unconditional group theory; the pi_2-versus-pi_q distinction is
        unconditional field theory on the audited B∉F_2 fact. Recorded so
        the absence is explicit.
      random_model_justification: >-
        Rigorous: Lagrange on a cyclic group of prime order k; Frobenius
        is an endomorphism iff defining coefficients are fixed.
      supporting_results:
        - ref: IDEA-20260922-6cf862
          provenance: internal
          claim: G∩E(F_q)={O} / B smallest subfield F_{2^16} (mu≠1 input).
        - ref: IDEA-20260922-c07598
          provenance: internal
          claim: Mechanism, named wrong answer, and Part-1 arithmetic stated.
      validation_experiment_ids:
        - EXP-BINSTD-e6fc82
      falsification_condition: >-
        Toy prime-k' cell with ord(pi_q)≠k'; OR verified pi_2 endomorphism
        on a deployed row (A,B both in F_2 contradicting audit).
    - id: HEUR-BINSTD-c07598-H1
      formal_statement: >-
        A3, AUT(E)=Z/2. For each of the five ordinary binary curves, the
        abstract curve automorphism group is {id,[-1]}; the factor 2 in
        the ledger 2k rests on this. c2pnb208w1 (a=0) is the flagged row.
      random_model_justification: >-
        Classical imitation: generic elliptic curves away from special
        j-loci have Aut of order 2; char-2 special automorphisms
        concentrate at supersingular j=0 (recalled, not re-derived). None
        of the five is supersingular (ordinary, nonzero trace, audited),
        which places them away from that locus but does not enumerate
        every exceptional j — hence heuristic.
      supporting_results:
        - ref: IDEA-20260922-c07598
          provenance: internal
          claim: A3 stated with c2pnb208w1 flagged; validation plan named.
      validation_experiment_ids:
        - EXP-BINSTD-e6fc82
      falsification_condition: >-
        Aut(E) found strictly larger than Z/2 for any of the five curves
        (most plausibly c2pnb208w1); OR toy a=0 cells correlating with
        larger Aut than a≠0 matched cells in a way that revises the
        ledger — report OPEN→REVISE, do not silently patch 2k.

  structural_ingredients:
    - description: >-
        Pre-computed BINSTD curve audit (A,B in F_{2^16}; cofactors; traces).
      citation: analysis/binstd-curve-audit/README.md
      provenance: internal
      verified_by: coordinator (design session 2026-10-02; README present on main)
      role: parameter / provenance substrate for Part 1
    - description: >-
        G∩E(F_q)={O} emptiness / mu≠1 input; B not in F_2.
      citation: IDEA-20260922-6cf862
      provenance: internal
      verified_by: coordinator (cited; designed path EXP-BINSTD-0fae5a on PR #1542)
      role: baseline for mu≠1 and for ruling out pi_2
    - description: >-
        Matched-rho numbers that reuse the 2k divisor this record certifies.
      citation: IDEA-20260922-d11575
      provenance: internal
      verified_by: coordinator (cited via IDEA-20260922-c07598)
      role: downstream consumer of the ledger
    - description: >-
        Block-system / automorphism-quotient object frame for rho classes.
      citation: IDEA-20260901-863e36
      provenance: internal
      verified_by: coordinator (cited via IDEA-20260922-c07598)
      role: trichotomy placement
    - description: RQ-BINSTD reachability-table decision target.
      citation: ledger/questions/RQ-BINSTD-b6f698.yaml
      provenance: internal
      verified_by: coordinator (design session 2026-10-02)
      role: decision target / population

  reduction_chain:
    core_problem: >-
      Certificate that |⟨pi_q,[-1]⟩|=2k on five c2pnb rows, with named
      rejection of the 32k Gal-orbit conflation and toy controls.
    corollaries:
      - problem: >-
          Matched-rho baselines and attack/rho comparisons in
          IDEA-20260922-d11575, IDEA-20260922-8278db, and every other
          reachability-table cell that divides by sqrt(2k).
        reduction_ref: >-
          Internal prerequisite named in IDEA-20260922-c07598
          priority_rationale — not a published reduction.
        asymptotics_preserved: >-
          Constant-factor symmetry ledger only; no exponent transferred.

  predictions:
    - metric: ord_mu_certificate_deployed
      direction: exact
      minimum_effect: >-
        For each of five rows: gcd(h,r)=1 and ord(mu)=k stated with
        k-prime argument; symmetry_group_order=2k (conditional on A3).
    - metric: is_pi_2_an_endomorphism_deployed
      direction: exact
      minimum_effect: FALSE on all five rows (B∉F_2)
    - metric: ord_pi_q_on_prime_subgroup_toy_prime_k
      direction: exact
      minimum_effect: Exactly k' on every Stage-2 prime-k' cell
    - metric: ord_pi_q_on_prime_subgroup_toy_composite_k
      direction: bounded
      minimum_effect: >-
        A proper divisor of k' (neither 1 nor k') observed on ≥1
        composite-k' cell
    - metric: is_pi_2_an_endomorphism_toy_B_notin_F2
      direction: exact
      minimum_effect: FALSE on every such Stage-2 cell
    - metric: is_pi_2_an_endomorphism_toy_B_in_F2
      direction: exact
      minimum_effect: TRUE on the degenerate control
    - metric: null_object_symmetry_order
      direction: exact
      minimum_effect: 2 on the no-proper-subfield null
    - metric: aut_E_order_per_curve
      direction: exact
      minimum_effect: >-
        OPEN unless Stage-2 toy a=0 enumeration or successor j-invariant
        check closes A3; never silently asserted as 2 without disclosure

  test_boundary:
    instances:
      - deployed_arm: 'c2pnb{176v1,208w1,272w1,304w1,368w1} (k∈{11,13,17,19,23})'
      - toy_prime_k: '(d,k′)∈{(4,5),(4,7),(2,13),(8,5)} with k′ prime, dk′≤41'
      - toy_composite_k: '(d,k′)=(4,6) composite positive control'
      - null_object: 'curve over F_{2^{dk}} not defined over any proper subfield'
      - degenerate_B_in_F2: 'toy cell with B∈F_2 (pi_2 IS an endomorphism)'
      - baseline_k1: 'k=1 / negation-only reproduction of order-2 ledger'
    parameters:
      q: 65536
      k_values: [11, 13, 17, 19, 23]
      toy_dk_max: 41
      toy_prime_cells:
        - {d: 4, k_prime: 5}
        - {d: 4, k_prime: 7}
        - {d: 2, k_prime: 13}
        - {d: 8, k_prime: 5}
      toy_composite_cells:
        - {d: 4, k_prime: 6}
      stdlib_preferred: true
    implementation: >-
      experiments/EXP-BINSTD-e6fc82/implementation/ (stdlib + reuse of
      analysis/binstd-curve-audit/ arithmetic patterns; may cite
      experiments/EXP-BINSTD-178742/implementation/typed/gf2n.py patterns;
      no Magma/Sage/cypari2 as the success path).
    budget:
      maximum_runs: 16
      total_cpu_hours_advisory: 2
      wall_clock_seconds_advisory: 7200

  falsification_conditions:
    - Toy prime-k' cell with ord(pi_q) on the prime subgroup ≠ k'.
    - Verified pi_2 endomorphism on a deployed row (A,B both in F_2).
    - Aut(E) found strictly larger than Z/2 for any of the five (revises the 2 in 2k).
    - Composite-k' cell fails to exhibit any proper divisor of k' (proves-too-much / control void).
    - Null object reports symmetry order ≠ 2.
    - Degenerate B∈F_2 control reports is_pi_2_an_endomorphism=FALSE.
    - Claiming break / exponent / m≥131 attack from this contract.

  interpretation_limits:
    - >-
      This pins a CONSTANT (2k) in the matched-rho formula; it does not
      move any attack exponent and is not a security statement about any
      deployed curve beyond the ledger used in lane comparisons.
    - >-
      A3 (Aut(E)=Z/2) remains heuristic until closed; c2pnb208w1 (a=0) is
      the flagged gap. Downstream records that treat 2k as unconditional
      without citing A3 overclaim.
    - >-
      mu≠1 rests on IDEA-20260922-6cf862 / EXP-BINSTD-0fae5a; a later
      refutation of that emptiness certificate suspends Stage-1 filing
      here (O-BASELINE-BLOCK), not a silent restatement.
    - >-
      Toy Stage-2 confirms the k-prime argument and the pi_2 distinction
      at small scale; it does not transfer attack cost to m≥131.
    - >-
      Timeouts/crashes/budget aborts are failed_infrastructure (AGENTS.md
      rule 5), never refutation of (A)/(B).

  distinguishable_outcomes:
    - id: O-CERT-2K
      meaning: >-
        Stage-1 certificates file symmetry_group_order=2k on 5/5 rows
        (A3 disclosed); Stage-2 prime-k' ord=k', composite proper
        divisor observed, pi_2 FALSE on B∉F_2 and TRUE on B∈F_2, null
        order 2 → reachability-table symmetry column filled; unlocks
        d11575/8278db comparisons.
    - id: O-REFUTE-ORD
      meaning: Toy prime-k' ord(pi_q)≠k' — k-prime argument refuted.
    - id: O-REFUTE-PI2
      meaning: >-
        Deployed row has A,B in F_2 (pi_2 is an endomorphism) — (B)
        distinction collapses for that row; revise toward 16k·2.
    - id: O-REVISE-A3
      meaning: >-
        Aut(E)>2 on a deployed or toy a=0 cell — revise the 2 in 2k;
        do not silently patch.
    - id: O-CONTROL-VOID
      meaning: >-
        Composite-k' fails to show a proper divisor, or null≠2, or
        B∈F_2 degenerate reports FALSE — instrument defect; (A)/(B) unread.
    - id: O-BASELINE-BLOCK
      meaning: >-
        gcd(h,r)≠1 or 6cf862 emptiness path blocked — do not file
        ord(mu)=k; not math evidence against k-primality itself.
    - id: O-PROVENANCE
      meaning: >-
        Primary vs secondary parameter disagree; halt with both values;
        not math falsification of (A)/(B).
    - id: O-IMPEDIMENT
      meaning: >-
        Budget/infra stop with measured quantity; never negative math
        evidence.

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
