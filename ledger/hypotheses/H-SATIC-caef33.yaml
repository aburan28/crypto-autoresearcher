  statement: >-
    Two times (3 minus 1) is 4, equal to the Boolean degree bound and
    to the leading power. Two to the power (3 minus 2) is 2. Five
    minus 4 is 1, equal to the penalty ceiling. The product of 4, 2,
    and 1 is 8. The Hamming weights of 0 through 4 are 0, 1, 1, 2,
    and 1. Their sum is 5 and their maximum is 2. The cross of 9/10
    against 1/2 is 8. The cross of 1/2 against 1/10 is 8. Their
    product is 64.
  mechanism: >-
    The proposal writes the weight 3, the degree 4, the factor count
    as a power of 2, the rungs 4 and 5, the penalty ceiling 1, and
    the percents 90, 50, and 10. This contract checks those integers.
    It does not solve a system.
