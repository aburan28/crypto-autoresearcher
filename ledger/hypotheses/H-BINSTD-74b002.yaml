      direction: flat
      minimum_effect: exactly 0 on every certified Stage-1 tuple with sigma R != R
    - metric: conjugate_instance_hits
      direction: flat
      minimum_effect: exactly 1.0 as points on Koblitz toys
    - metric: solutions_lost_under_canonical_constraint
