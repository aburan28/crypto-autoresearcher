# H-BINSTD-74b002 -- Absolute Frobenius is equivariance between conjugate
# targets, not a per-instance symmetry of the descended Boolean system.
# Specified and approved under DEC-20261001-495bd1 from IDEA-20260922-7ab503
# under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001, absorbing the 2026-09-26 review
# defects (analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-7ab503.yaml;
# verdict defective / HOLD-R): rewrite around orbit equivariance (a77711 A1/A2
# at q=2); mark K-163/ECC2K-130 structurally empty for orbit-batched form;
# treat parser-bug section as already-satisfied regression fixture; freeze
# review's concrete n=19 Koblitz cell + n=17 stable-V control.
#
# ZERO RUNS in this design packet. IDEA-20260922-7ab503 claim text is not
# edited (proposals immutable); this hypothesis cites it and freezes the
# corrected restatement for experimental purposes.
# =============================================================================
hypothesis:
  id: H-BINSTD-74b002
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-7ab503
  experiment_id: EXP-BINSTD-375338
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-01'
  approved_at: '2026-10-01'
  authorised_by: DEC-20261001-495bd1
  review_cited: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-7ab503.yaml
  proposed_by: coordinator
  title: >-
    Absolute Frobenius x→x^2 is an equivariance between conjugate target
    instances (not a per-instance search-tree symmetry); a single-instance
    mu-orbit canonical constraint is unsound; orbit-batched gain needs a
    Frobenius-stable V and is structurally empty on K-163 and ECC2K-130

  statement: >-
    SETTING. E: y^2+xy=x^3+ax^2+b over F_{2^n} with a,b in F_2 (Koblitz /
    absolute-Frobenius endomorphism case). In a NORMAL basis the absolute
    Frobenius sigma: x |-> x^2 is the cyclic left shift of the n-coordinate
    vector (unconditional, char-2 additivity). This is NOT the q-power
    Frobenius endomorphism of RQ-FROB-7d8dd4 for q>2; here q=2 always.

    (A) EQUIVARIANCE, NOT PER-INSTANCE SYMMETRY (HOLD-R CORRECTION). With
    a,b in F_2, S_{m+1} has F_2-coefficients, so sigma maps a solution
    (x_1,...,x_m) of S_{m+1}(x_1,...,x_m,x_R)=0 to a solution of
    S_{m+1}(x_1^2,...,x_m^2,x_R^2)=0 — the system for the CONJUGATE target
    sigma(R), not the same instance. This is IDEA-20260906-a77711 Lemma A1
    (sigma(I_R)=I_{R^pi}) at q=2. Lemma A2: V(I_R) and V(I_{sigma R}) are
    disjoint for R in G\{O} because sigma acts on G by a scalar of order n
    (mu^n=1, mu!=1), so sigma(R)!=R. The m! leg-permutation symmetry WDSat
    breaks IS an automorphism of one instance; the Frobenius shift is an
    equivariance between n different instances. A canonical-representative
    constraint on a SINGLE instance therefore DROPS solutions and is
    UNSOUND. The source IDEA's claim (A)/(D) per-instance leaf-count
    division by mu is REJECTED as the primary claim; retained only as the
    named falsifiable alternative that Stage 1 is designed to refute.

    (B) WHAT THE SYMMETRY DOES BUY — ORBIT SYSTEM. The sound object is the
    orbit system I_orb = intersection_k I_{sigma^k R}: the shift acts freely
    on ITS solution set. Gain is one solve per Frobenius orbit with a
    Frobenius-stable factor-base V and orbit-size bookkeeping in LA (a77711
    arm A / GGMP constants), NOT a per-instance leaf-count division. Legs
    stay in V under the shift IFF V is Frobenius-stable (V^2=V).

    (C) STABLE-V CENSUS (ord_n(2) COLUMN). At prime n the Frobenius-stable
    F_2-subspaces are F_2[T]/(T^n-1)-submodules with dimensions subset-sums
    of the irreducible factor degrees of T^n-1 over F_2 (degree pattern
    governed by ord_n(2)). Pre-registered column (review-computed; Stage 0
    recomputes independently):
      n=131 (ECC2K-130): ord=130; dims {0,1,130,131} — STRUCTURALLY EMPTY
        for useful orbit-batched V.
      n=163 (K-163): ord=162; dims {0,1,162,163} — STRUCTURALLY EMPTY.
      n=233 (K-233): ord=29; dims include 29,30,58,... — LIVE.
      n=239 (sect239k1): ord=119; LIVE.
      n=283 (K-283): ord=94; LIVE.
      n=409 (K-409): ord=204; LIVE.
      n=571 (K-571): ord=114; LIVE.
    LIVE rows for the orbit-batched form route to RQ-FROB-7d8dd4 / successor
    seam; K-163 and ECC2K-130 are BINSTD reachability-table cells reading
    STRUCTURALLY EMPTY for this seam.

    (D) PARSER REGRESSION FIXTURE (SUPERSEDED AS DEFECT). The source IDEA's
    hexblob() third-fallback regex bug is already fixed on the current tree
    (regex accepts optional (0xHEX); review confirmed). Stage 0 records a
    regression fixture (six Koblitz A,B in F_2) against binary-curve-params.txt,
    not a new defect claim.

    (E) BASIS DEPENDENCE — SCOPED DOWN. Source IDEA's H1/H2 (normal-basis
    leaf-ratio ~1/mu vs polynomial-basis ~1) are MOOT for the unsound
    single-instance constraint. Surviving representation question: whether
    a normal basis changes solving/refutation degree of the ORBIT system at
    a stable-V cell — owned by HOLD-I / RQ-FROB-7d8dd4 successor, deferred
    beyond this experiment's Stages 0-1.

  statement_note: >-
    IDEA-20260922-7ab503 claim text is immutable and left at status proposed.
    Review verdict defective (HOLD-R): central per-instance symmetry claim
    false; rewrite as equivariance; add ord_n(2) column; drop parser-bug as
    live defect; name concrete toys. This hypothesis freezes those corrections
    as primary predictions. The source IDEA's H1 (normal-basis leaf reduction
    by mu) is the NAMED FALSIFIABLE ALTERNATIVE Stage 1 is designed to refute
    via solutions_lost_under_canonical_constraint > 0 and same_instance_hits=0.

  mechanism: >-
    OBJECT FRAME. Representation: x-coordinate in a fixed F_2-basis (R1 of
    RQ-ECDLP-623a32), with basis choice deferred for Stages 0-1 (polynomial
    basis window V={deg<l} as in the review cell). Operation set Sigma:
    translation by factor-base points UNION <sigma> generated by absolute
    Frobenius — PARTIAL-ACTION (Class I). Lossy projection to Frobenius
    orbits is Sigma-compatible on the ORBIT system and NOT on a single
    instance (HOLD-R). Why not RQ-FROB-7d8dd4: that question owns invariant-
    ring rewriting at toy subfield curves excluding deployed rows; this
    hypothesis owns the BINSTD census cells (empty vs live) and the
    equivariance-vs-symmetry discrimination at q=2. Why not IDEA-20260922-
    29b1c5: that group's action is 2-torsion translation; this is Galois/
    Frobenius equivariance.

  assumptions:
    - E ordinary binary, y^2+xy=x^3+ax^2+b, b!=0; Stage 1 toys have a,b in F_2.
    - sigma acts on G by a scalar of order n for Koblitz curves (classical).
    - Stable-subspace dimensions follow from factoring T^n-1 over F_2 (classical).
    - No claim that every n admits an affordable Gaussian normal basis.
    - No run at deployed m>=131; deployed rows appear only as Stage 0 arithmetic
      census cells.
    - Uses F2 (factor-base decomposition) and F6 (endomorphism orbit) as declared
      components; what is tested is equivariance vs per-instance symmetry.

  proof_search_map:
    bottleneck: >-
      Whether absolute Frobenius yields a cheap PER-INSTANCE search constraint
      (source IDEA) or only an EQUIVARIANCE between conjugate targets requiring
      an orbit system and a Frobenius-stable V (HOLD-R / a77711). Discriminating
      these is the load-bearing pre-compute audit before any leaf-count claim.
    baseline_embedding:
      parameter_slice: >-
        Toy Koblitz at n=19 (ord_19(2)=18; dims {0,1,18,19} — same structural
        emptiness pattern as ECC2K-130) with a,b in F_2, m=2, l=10; plus
        stable-V positive control at n=17 (ord_17(2)=8; dims include 8,9).
      reproduction_check: >-
        (i) Cyclic-shift identity on normal-basis coordinates verified on
        >=10^4 random field elements (optional Stage 0 fixture; not load-
        bearing for equivariance). (ii) a77711 Lemma A1/A2 reading at q=2:
        same_instance_hits=0 and conjugate_instance_hits=1.0 on the n=19 cell.
        (iii) ord_n(2) recomputation matches the frozen column for
        n in {17,19,131,163,233,239,283,409,571}.
    observation_collision:
      observable: >-
        Pair (same_instance_hits, conjugate_instance_hits) on certified
        m=2 decompositions; solutions_lost_under_canonical_constraint.
      distinct_preimage_search: >-
        A positive same_instance_hit could be (i) Lemma A2 failure / sign-
        pattern loophole, or (ii) instrument error. Broken by leg-swap control
        (must be 100%) and RC-1 null (sigma not an endomorphism; every shift
        must report not-on-curve). A leaf-count reduction under the unsound
        constraint could be (i) genuine pruning or (ii) dropped solutions;
        broken by requiring certificate-set comparison against the unconstrained
        census (predicted STRICT inequality — solutions lost).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Orbit system I_orb with Frobenius-stable V (a77711 arm A), NOT a
          single-instance canonical-representative constraint.
        predicted_gain: >-
          One solve per Frobenius orbit + LA bookkeeping when a useful stable
          V exists; ZERO useful gain on K-163 / ECC2K-130 (structurally empty
          dims). NO per-instance leaf-count division by mu.
      - transform: stronger_invariant
        proposed_object: >-
          Per-row (ord_n(2), stable-dimension set, empty|live) reachability-
          table cells for the absolute-Frobenius / orbit-batched seam.
        predicted_gain: >-
          ECC2K-130 and K-163 decided STRUCTURALLY EMPTY at zero compute;
          K-233+ live rows flagged for FROB routing.
    quantifier_order: >-
      UNCONDITIONAL: FOR ALL ordinary binary E with a,b in F_2, sigma is a
      group endomorphism and maps solutions of I_R to solutions of I_{sigma R}
      (Lemma A1 at q=2). FOR ALL R in G\{O}, V(I_R) ∩ V(I_{sigma R}) = empty
      (Lemma A2), hence a single-instance shift-canonical constraint is
      unsound. SEPARATELY, measured at Stage 1 toys: same_instance_hits=0,
      conjugate_hits=1.0, solutions_lost ≈ (1-1/n). NOT CLAIMED: any exponent
      move; any per-instance leaf-count division; affordability of normal
      bases at deployed n; security of any deployed curve.
    method_ceiling:
      strongest_certifiable_claim: >-
        (i) Equivariance lemmas at q=2 as proved statements; (ii) ord_n(2)
        column + empty/live verdict for named rows; (iii) measured
        same_instance_hits=0 and solutions_lost>0 at the n=19 cell; (iv)
        stable-V control at n=17 with in-V fraction=1.0. Cannot certify
        anything at m>=131 as an attack; cannot move an exponent.
      nearby_object_control: >-
        BLOCKING. (1) RC-1 non-Koblitz null (A generic): sigma(P) not on
        curve. (2) Z/l scalar-action replica: same (a)/(b) statistics as pure
        group action. (3) Leg-swap: genuine same-instance symmetry at 100%.
        (4) n=17 stable-V positive control.
    proof_obligations:
      - claim: sigma maps I_R-solutions to I_{sigma R}-solutions (never same R when sigma R != R)
        responsibility: correctness
      - claim: same_instance_hits = 0 on every certified Stage-1 tuple with sigma R != R
        responsibility: correctness
      - claim: conjugate_instance_hits = 1.0 as points on the Koblitz toys
        responsibility: correctness
      - claim: solutions_lost_under_canonical_constraint > 0 (unsoundness demonstrated)
        responsibility: correctness
      - claim: ord_n(2) column recomputed matches frozen values for listed n
        responsibility: interface
      - claim: K-163 and ECC2K-130 marked STRUCTURALLY EMPTY for orbit-batched V
        responsibility: scope
      - claim: n=17 stable-V control in-V fraction = 1.0
        responsibility: scope
      - claim: No exponent or deployed-curve security claim
        responsibility: scope

  asymptotic_claim:
    problem: ECDLP on standardized binary Koblitz curves via x-coordinate point decomposition
    prior_best: >-
      Matched rho with negation and Frobenius classes (sqrt(pi*r/(4n))); within
      decomposition family, a77711 arm A / GGMP orbit batching when stable V exists
    time_exponent: Unchanged (no exponent move; constant-factor orbit batching only where stable V exists)
    memory_exponent: Unchanged
    hidden_cofactor: None claimed; normal-basis construction cost deferred
    claim_kind: constant_factor

  heuristic_assumptions:
    - id: HEUR-BINSTD-74b002-H0
      formal_statement: >-
        EQUIVARIANCE AT q=2. For every certified m=2 decomposition
        (x_1,x_2) of R on a Koblitz toy with sigma(R)!=R, the shifted tuple
        (x_1^2,x_2^2) never decomposes the same R (same_instance_hits=0) and
        always decomposes sigma(R) as points (conjugate_instance_hits=1.0),
        uniformly over the Stage-1 cells.
      random_model_justification: >-
        RIGOROUS: a77711 Lemmas A1/A2 (internal, cited); sigma acts as a
        scalar of order n on G. Not a distributional heuristic — stated as
        HEUR id only so the experiment's primary metric has a falsification
        hook under the program's heuristic-validation schema.
      supporting_results:
        - ref: IDEA-20260906-a77711
          provenance: internal
          claim: Lemmas A1/A2 — sigma(I_R)=I_{R^pi}; V(I_R) and V(I_{sigma R}) disjoint for R in G\{O}
          verified_by: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-7ab503.yaml (reviewer read a77711 in full)
      validation_experiment_ids:
        - EXP-BINSTD-375338
      falsification_condition: >-
        One same_instance_hit with sigma R != R, or conjugate_instance_hits
        strictly below 1.0 on the Koblitz toys after certificate verification.
    - id: HEUR-BINSTD-74b002-H1
      formal_statement: >-
        UNSOUND CONSTRAINT. Imposing "x_1 is lexicographically smallest in
        its shift orbit" on a single instance rejects a positive fraction
        (predicted ~1-1/n) of certified decompositions per target at the
        n=19 cell.
      random_model_justification: >-
        Orbit size n under free cyclic action on generic coordinates; fraction
        of canonical representatives is 1/n, so fraction lost is 1-1/n.
      supporting_results:
        - ref: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-7ab503.yaml
          provenance: internal
          claim: HOLD-R concrete_experiment test (e) prediction ~1-1/19 lost
          verified_by: coordinator, this design session (Read, full review)
      validation_experiment_ids:
        - EXP-BINSTD-375338
      falsification_condition: >-
        solutions_lost_under_canonical_constraint = 0 on every Stage-1 target
        that has >=1 certified decomposition (would resurrect the source IDEA's
        per-instance symmetry reading and require superseding this hypothesis).
    - id: HEUR-BINSTD-74b002-H2
      formal_statement: >-
        STABLE-V BOOKKEEPING. At n=17 with a Frobenius-stable V of dimension
        in the stable set, shifted legs stay in V (in-V fraction=1.0); at
        n=19 with non-stable V={deg<10}, in-V fraction is near 2^{-(l-1)}
        (essentially never).
      random_model_justification: >-
        RIGOROUS half: V^2=V iff V is a union of Frobenius cycles of
        coordinates. Heuristic half for non-stable window: each shifted
        coordinate lands in the window independently at rate ~2^{-(n-l)}
        roughly; review quotes ~2^{-(l-1)} for the paired-leg event at l=10 —
        treated as an order-of-magnitude prior, not a theorem.
      supporting_results:
        - ref: IDEA-20260918-9abf42
          provenance: internal
          claim: closed-form count of Frobenius-stable subspaces / ord_n(2)
          verified_by: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-7ab503.yaml (cited KN-OPEN-095df5 / 9abf42)
      validation_experiment_ids:
        - EXP-BINSTD-375338
      falsification_condition: >-
        Stable-V control in-V fraction < 1.0, or non-stable n=19 in-V fraction
        near 1.0 (would break the stable-subspace bookkeeping).

