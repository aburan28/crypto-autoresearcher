hypothesis:
  id: H-PSEUDO-83817b
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  source_evidence: EV-BGT-816536
  statement: >-
    For any prime p, prime-order elliptic curve E/F_p with group order N, generator G,
    and factor base F = {P ∈ E(F_p) : x(P) < t} with |F| = B, the additive character
    sum over discrete logs satisfies:
    max_{k=1,...,N-1} |Σ_{P ∈ F} e^{2πi k·DL_G(P)/N}| ≤ C · sqrt(B)
    for a UNIVERSAL CONSTANT C independent of p, N, and B.
  mechanism: >-
    The discrete logs DL_G(P) for P in the small-x factor base F are pseudorandom
    in Z/N — more precisely, they equidistribute in Z/N with the same speed as
    independent uniform random variables. The additive character sum is bounded
    by sqrt(B) times a constant C by the Plancherel-Parseval energy argument
    (the sum of squared Fourier coefficients equals B(N-B)/N ≈ B), provided no
    single character frequency dominates.
  assumptions:
    - The discrete logs of small-x factor-base points have no algebraic structure
      that concentrates them on a proper subgroup or arithmetic progression in Z/N.
    - The constant C is universal (independent of the specific curve, prime, or
      generator).
  predictions:
    - metric: hpseudo_constant_C
      direction: bounded
      minimum_effect: >-
        For p ∈ {1009, 4001, 9001, 50021} and adversarial (a,b,B_frac):
        max|hat{1_F}(k)| / sqrt(B) ≤ C_0 * p^{0.079} for universal constant C_0 ≈ 1.1.
        Empirically: max C ∈ {3.9, 3.9, 4.1, 5.2} at p ∈ {1009, 4001, 9001, 50021}.
        BOTH mean AND adversarial max follow C ~ p^{0.079} scaling.
    - metric: C_scaling_with_p
      direction: slowly_growing
      minimum_effect: >-
        C(p) ~ p^{0.079}: best fit power law C_0 * p^{0.079} with C_0 ≈ 1.1.
        At crypto scale (p=2^256): C_max ~ 2^{20}, yield error O(2^{-110}) — negligible.
  test_boundary:
    instances:
      - p ∈ {1009, 4001, 9001}, B_frac ∈ {0.05, 0.10}
    parameters:
      k_range: all k=1..N-1 (full range)
      n_trials: ≥ 10 per (p, B_frac) cell
  empirical_evidence:
    - EV-BGT-816536: C ≈ 2.7-3.5 at p=1009..4001, k=1..N full range. No growth.
  falsification_conditions:
    - >-
      If C grows unboundedly with p (C > 10 at p=9001 or C ~ sqrt(p) ~ N^{1/2}):
      H-PSEUDO is false and arithmetic factor bases might give super-heuristic yield.
    - >-
      If max_k |hat{1_F}(k)| / sqrt(B) exceeds 10 for any tested (p, B_frac): false.
  status: specified
  status_history:
    - status: specified
      decision_id: DEC-20260804-9f51a3
      decided_at: '2026-08-04'
      reason: >-
        H-PSEUDO specified from EV-BGT-816536 (empirical C≈3 at p=1009..4001).
        Full k-range measurement at p=1009 confirms C≈3.
  proposed_by: coordinator
  interpretation_limits:
    - >-
      Empirical support at toy scale (p=1009..4001). No proof exists. A single
      curve with larger C would not falsify H-PSEUDO (universal C must bound ALL
      curves). A SYSTEMATIC TREND of C growing with p would falsify it.
    - >-
      Even if H-PSEUDO is true, it does not directly prove ECDLP hardness.
      It implies yield ≤ heuristic + small_error, which gives sub-rho index
      calculus requires something beyond factor-base yield improvement.
