hypothesis:
  id: H-ICEX-3bccf3
  question_id: RQ-SDEG-001
  statement: >-
    On frozen Semaev S_3 decomposition systems at toy prime-field scale, the
    three degree quantities that the literature uses near-interchangeably - the
    SOLVING DEGREE actually reached by the solver, the DEGREE OF REGULARITY read
    off the Hilbert series of the homogenised ideal, and the CASTELNUOVO-MUMFORD
    REGULARITY - do not coincide, and the pairwise gap between the first two is
    bounded by a constant in p across the tested ladder. Consequently the fitted
    C_decomp exponent moves by less than its own confidence interval when the fit
    is repeated against each of the three, and the lane may proceed with a stated
    offset. The decision-relevant deliverable is the SIZE OF THAT EXPONENT
    MOVEMENT, not the gap itself.
  mechanism: >-
    For semi-regular sequences the three quantities coincide asymptotically. The
    Semaev systems are not semi-regular, which is the lane's own premise, so the
    coincidence cannot be assumed. Measuring all three on one frozen system set,
    by independent code paths, converts a definitional worry into a number, and
    refitting the lane's cost model against each converts that number into the
    only quantity the lane consumes - a movement in a fitted exponent.
  assumptions:
  - >-
    The solver can be instrumented to REPORT the maximum degree actually reached,
    rather than having it inferred from timing. If the solver cannot be
    instrumented, the primary observable is unavailable, the record says so, and
    no inferred value is substituted.
  - >-
    The homogenisation convention and the treatment of field equations are frozen
    and recorded before the run; the alternative convention is reported as a
    sensitivity check, not as a second headline number.
  - >-
    The monomial order and the solver implementation are frozen and recorded. The
    solving degree is a property of the ALGORITHM and the presentation, never an
    invariant of the ideal, and this record never presents it as one.
  - >-
    Cells where Castelnuovo-Mumford regularity is not computable within budget
    are RECORDED as not computable. A systematically missing cell at larger
    parameters would bias the gap trend in exactly the direction that matters.
  - >-
    Special-j curves are excluded from the main ladder and reported separately,
    since their automorphisms change the system symmetry and therefore its
    degrees.
  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms:
    - transform: null
      proposed_object: null
      predicted_gain: null
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations:
    - claim: null
      responsibility: null
    not_applicable_reason: >-
      An instrument-calibration measurement inside an existing lane. No theorem
      is sought; the three degree characterisations are classical and are used,
      not improved. Section 8 requires the reason to be recorded rather than the
      map omitted.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: >-
      FOR ALL frozen Semaev S_3 systems on the declared curve ladder and FOR ALL
      four tested toy primes, the difference between the solving degree and the
      degree of regularity is bounded by a constant independent of p.
    random_model_justification: >-
      The rigorous ingredient is the standard result that for semi-regular
      sequences the degree of regularity bounds the solving degree, together with
      the Hilbert-series characterisation of the degree of regularity. The
      distributional ingredient is deliberately ABSENT - the Semaev systems are
      known not to be semi-regular, so the standard bound is not known to apply
      and this statement is a genuine heuristic rather than a corollary.
    supporting_results:
    - >-
      Semi-regularity bound and the Hilbert-series characterisation, classical,
      used as the forced value on the semi-regular control arm only.
    validation_experiment_ids:
    - EXP-ICEX-c77af4
    falsification_condition: >-
      A gap growing with p across the tested ladder beyond the confidence
      interval of the per-cell gap.
  structural_ingredients:
  - description: >-
      GOAL-SDEG-001 completion criterion, read verbatim - Committed scoped
      cost-model package with certificates and matched rho/BSGS controls suitable
      as ICEX numerator, without claiming alpha < 1/2. This is why the identity
      of the fitted degree matters to the lane.
    citation: GOAL-SDEG-001
    provenance: internal
    verified_by: coordinator (TASK-20260904-074465, completion_criteria read verbatim)
    role: consumer of the fitted quantity
  - description: >-
      RQ-SDEG-001 decision target, read verbatim - whether a frozen scaling
      protocol under the GOAL-ECDLP-001 certificate contract yields a scoped cost
      model with CIs suitable as the numerator of an IC-vs-rho comparison.
    citation: RQ-SDEG-001
    provenance: internal
    verified_by: coordinator (TASK-20260904-074465, file read in full)
    role: scope of the lane this record calibrates
  reduction_chain: null
  predictions:
  - metric: three_degrees_on_matched_semi_regular_control_systems
    direction: different
    minimum_effect: >-
      FORCED to coincide within the theoretical prediction. A nonzero gap on a
      semi-regular control is an instrumentation bug and blocks every Semaev
      degree in the run.
  - metric: planted_known_gap_ladder_recovery
    direction: different
    minimum_effect: >-
      Planted gaps of 0, 1, 2 and 3 degrees must be reported EXACTLY as 0, 1, 2
      and 3. This is the defect of known size and its predicted magnitude; the
      four-point ladder is the demonstrated dynamic range.
  - metric: solving_degree_minus_degree_of_regularity_on_semaev_s3_as_a_function_of_p
    direction: different
    minimum_effect: >-
      No direction pre-committed; this is the unknown the record exists to
      measure. Pre-committed is that the TREND across the p ladder, not the value
      at any single p, is the reported quantity.
  - metric: movement_of_fitted_c_decomp_exponent_under_each_degree_choice
    direction: different
    minimum_effect: >-
      Movement smaller than the fitted exponent's own 95 percent confidence
      interval means the choice is immaterial within the tested range. Movement
      larger than that interval means every existing extrapolation in the lane is
      suspect and must be reported as such. This continuous statistic, not the
      integer gap, is the primary decision variable.
  - metric: fraction_of_cells_where_castelnuovo_mumford_regularity_is_not_computable
    direction: different
    minimum_effect: >-
      Reported explicitly per cell. A silently dropped cell is the specific
      failure this metric exists to prevent.
  test_boundary:
    instances:
    - S_3 systems only, one declared curve ladder, at least 10 curves per cell
    - special-j curves excluded from the main ladder and reported separately
    parameters:
      arity: S_3
      prime_ladder: the four smallest toy sizes at which all three quantities are computable
      monomial_order: frozen and recorded
      homogenisation_convention: frozen and recorded
    implementation: >-
      Instrumented Groebner engine reporting the maximum degree reached, plus
      independent Hilbert-series and free-resolution code paths.
    budget:
      wall_clock_seconds_per_run: 3600
      maximum_memory_gb: 24
      maximum_runs: 200
  falsification_conditions:
  - >-
    The three degrees differ on a matched semi-regular control. Instrumentation
    bug; no Semaev degree from the run is admissible.
  - >-
    The planted known-gap ladder is not recovered exactly. The instrument has no
    demonstrated dynamic range and no gap it reports is admissible.
  - >-
    The solver cannot be instrumented for the actual maximum degree. The primary
    observable is unavailable; report and stop, and do not substitute an inferred
    value.
  - >-
    The measured gap grows with p beyond the per-cell confidence interval. HEUR-001
    is falsified and the lane must refit its cost model against the solving degree
    alone.
  - >-
    Not-computable cells cluster at the largest p. The gap trend is unmeasurable
    where it matters and may not be extrapolated across the missing cells.
  interpretation_limits:
  - >-
    This calibrates an instrument. It produces no cost model, no exponent, and no
    evidence about index calculus versus Pollard rho.
  - >-
    Scoped to the tested curve ladder, S_3 only, the frozen monomial order and
    the frozen homogenisation convention. A gap measured at S_3 says nothing
    about S_4 until measured there.
  - >-
    A zero gap is scoped to the tested range and is not a theorem that the
    quantities coincide.
  - >-
    BAND NON-DEGENERACY, RECORDED BECAUSE IT CONSTRAINS WHAT CAN BE CONCLUDED. At
    toy S_3 scale the degrees are small integers; EXP-SEMAEV-001's committed
    analysis reports a maximum reduced-basis degree proxy of 4 over bits 8 to 12.
    An integer gap therefore has at most a few units of room across the whole p
    ladder, so the GAP TREND cannot resolve growth finer than one degree per
    ladder step. The asymptotic question of whether the gap grows without bound
    is UNTESTABLE AT REACHABLE SCALE by this design; the contract says so rather
    than reporting a flat integer as evidence of boundedness. The continuous
    exponent-movement statistic exists precisely because the integer gap is
    coarse.
  - >-
    The random dense and semi-regular control systems are curve-free objects. If
    a curve-free matched-shape system reproduces the same three-degree gap, the
    gap is a property of the system SHAPE, not of Semaev or of elliptic curves,
    and nothing here may be quoted as an elliptic-curve statement.
  status: proposed
  proposed_by: coordinator
