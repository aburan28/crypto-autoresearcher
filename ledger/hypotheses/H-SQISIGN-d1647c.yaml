hypothesis:
  id: H-SQISIGN-d1647c
  question_id: RQ-SQISIGN-001
  title: >-
    At toy parameters the SQIsign-style transcript is statistically indistinguishable from a matched
    endomorphism-ring baseline by the pre-registered divergence battery, so no transcript-level leak
    surface beyond the public key is detectable above the instrument's stated resolution
  statement: >-
    Let T be the joint distribution of toy SQIsign-style transcripts (commitment isogeny codomain,
    challenge, response) generated from a secret endomorphism ring, and let B be the matched
    baseline distribution in which the same transcript components are generated from an independent
    endomorphism-ring instance carrying no information about the secret. The hypothesis asserts
    that a pre-registered two-sample permutation test on a fixed divergence statistic does NOT
    reject the null T = B at the declared level, WHILE the same test at the same sample size DOES
    reject on a positive control in which a secret-dependent bias of declared magnitude has been
    deliberately injected. Equivalently: any transcript-level leak, if it exists at these toy
    parameters, is smaller than the minimum detectable divergence the design achieves, and that
    number is the deliverable rather than the word "independent".
  mechanism: >-
    The transcript's components are produced by isogeny walks whose distribution may depend on the
    secret ring: the commitment walk is sampled by the signer, the challenge is derived from it,
    and the response is a walk whose existence and shape are constrained by the secret. If any of
    those steps is not perfectly re-randomized, the joint distribution of the transcript inherits a
    dependence on the secret that the public key alone does not carry, and that dependence is a
    leak surface. At toy parameters both T and B are directly sampleable, so a distance or
    divergence measure with permutation testing quantifies the difference without any hardness
    assumption. The mechanism the test is built to catch is a residual correlation between the
    challenge-conditioned response distribution and the secret ring; the mechanism by which the test
    could FAIL to catch it is insufficient power at toy sample sizes, which is why the injected-bias
    dose ladder is a blocking control rather than a decoration.
  assumptions:
    - >-
      A toy SQIsign-style signing pipeline can be instantiated at the declared parameters and the
      matched baseline can be sampled from the SAME code path with the secret-dependent step
      replaced by an independent instance. If the baseline is generated by a different code path,
      the test measures the code path and not the transcript.
    - >-
      Sample independence holds: distinct transcripts use disjoint seed streams and no shared
      randomness. Seed determinism that couples samples is the single most likely way a null becomes
      artefactual.
    - >-
      The divergence statistic and the permutation procedure are fixed before any data is generated,
      and the statistic is computed on a declared feature encoding of the transcript rather than on
      raw bytes, since a raw-byte encoding makes the test's power a property of the serializer.
    - >-
      Toy sizes preserve the structural relationship being probed well enough that a leak of the
      hypothesized mechanism would appear at some toy size. This is an assumption, not a fact, and
      it is exactly what the multi-size trend arm exists to interrogate.
  proof_search_map:
    not_applicable_reason: >-
      This hypothesis is a purely empirical statistical control probe. It proves no theorem,
      constructs no bound and proposes no algorithm; its deliverable is a two-sample test verdict
      together with a measured minimum detectable divergence. The quantifier discipline that matters
      is recorded in interpretation_limits rather than as a proof map: a non-rejection is a bound at
      the achieved resolution and never a proof of independence.
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-SQISIGN-LEAK-1
      formal_statement: >-
        Let D(n) denote the true divergence between the toy transcript distribution and the matched
        baseline at toy size parameter n. The heuristic asserts that the SIGN and the direction of
        the trend of D(n) over the tested toy sizes are informative about D at larger n; formally,
        that if D(n) is below the instrument's resolution at every tested n and shows no increasing
        trend in n, then no mechanism of the hypothesized kind is being missed purely because n is
        small.
      random_model_justification: >-
        None available. This is a scaling assumption of exactly the kind that toy-scale probes
        cannot discharge, and it is recorded as a heuristic rather than folded into the conclusion.
        The only support offered is the measured trend itself across at least three toy sizes.
      supporting_results: []
      validation_experiment_ids:
        - EXP-SQISIGN-2eeb70
      falsification_condition: >-
        The measured divergence, or the injected-bias dose at which the test first rejects, moves
        monotonically and materially with toy size across the tested sizes. Then the toy-size
        verdict is size-specific and no statement may be made about any other size.
  structural_ingredients:
    - description: >-
        A toy SQIsign-style signing pipeline (commitment, challenge, response) at parameters small
        enough that both the transcript and the matched baseline are directly sampleable.
      citation: >-
        No implementation of a SQIsign-style signer is asserted to exist in this repository; the
        parent proposal does not name one. Availability is a derivation gap of the contract.
      provenance: recalled
      verified_by: null
      role: transcript generator under test
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: transcript_vs_baseline_permutation_p_value
      direction: higher
      minimum_effect: >-
        At the largest toy size, a permutation p-value above the declared rejection threshold of
        1e-3, while the positive control at the smallest injected dose that the design claims to
        resolve returns a p-value below 1e-3. A p-value below 1e-3 on the REAL transcripts is a
        leakage signal and is the interesting negative for this hypothesis.
    - metric: minimum_detectable_divergence
      direction: lower
      minimum_effect: >-
        Reported as a number with units, at power at least 0.95 and level 1e-3, at every toy size.
        A design that cannot state this number has produced no bound and its null is uninterpretable.
    - metric: positive_control_rejection_rate
      direction: higher
      minimum_effect: >-
        At least 0.95 at the declared reference dose. Below that, the instrument has no power and
        NO negative may be read from it.
    - metric: negative_control_rejection_rate
      direction: lower
      minimum_effect: >-
        At most the nominal level 1e-3 within Monte-Carlo error on transcripts generated from a ring
        independent of the secret. A higher rate means the test's calibration is broken.
    - metric: divergence_trend_across_toy_sizes
      direction: different
      minimum_effect: >-
        Reported as a signed slope with an interval across at least three toy sizes. A monotone
        material increase falsifies HEUR-SQISIGN-LEAK-1 and scopes every verdict to its own size.
  test_boundary:
    instances:
      - >-
        Toy SQIsign-style transcripts at three toy size parameters, generated from a secret
        endomorphism-ring instance
      - >-
        Matched baseline transcripts generated from the SAME code path with the secret-dependent
        step replaced by an independent instance
      - >-
        Positive-control transcripts carrying a deliberately injected secret-dependent bias at a
        declared dose ladder of at least four doses spanning the resolution boundary
      - >-
        Negative-control transcripts generated from a ring independent of the secret
    parameters:
      toy_size_parameters: three declared sizes, smallest to largest, fixed before any generation
      transcripts_per_arm_per_size: 2000
      permutation_resamples: 10000
      rejection_level: 0.001
      target_power: 0.95
      injected_bias_doses: at least four, spanning the expected resolution boundary in both directions
      seed_streams: disjoint per arm, per size, per replicate
    implementation: >-
      One divergence statistic on a declared feature encoding of the transcript, fixed before data
      generation, with permutation testing. The statistic, the encoding, the dose ladder and the
      rejection level are frozen in the contract and are not revised after any run.
    budget:
      wall_clock_seconds: 10800
      cpu_hours: 8.0
      maximum_memory_gb: 8
      maximum_runs: 24
  falsification_conditions:
    - >-
      The test REJECTS on real transcripts at the declared level while the negative control does not
      reject. Transcript-level leakage exists at the tested toy parameters; the hypothesis is
      falsified and the result must be escalated for independent replication before any statement.
    - >-
      The positive control fails to reject at the reference dose. The instrument has no power, the
      run is INVALID for this hypothesis, and no negative may be recorded. This is an instrument
      finding, not evidence about SQIsign.
    - >-
      The negative control rejects at a rate materially above the nominal level. The permutation
      calibration is broken and every p-value in the run is void.
    - >-
      The minimum detectable divergence cannot be computed at any toy size. The design produced no
      bound and its null is uninterpretable; nothing is reportable in either direction.
    - >-
      NOT a falsification: a build failure, a timeout, or the unavailability of a toy signing
      pipeline. Each is infrastructure under AGENTS.md rule 5 and produces no evidence about
      transcript independence.
  distinguishable_outcomes:
    independence_within_resolution: >-
      The test does not reject on real transcripts, the positive control rejects at the reference
      dose, and the negative control is calibrated. MEANING: any transcript-level leak at these toy
      parameters is below the stated minimum detectable divergence. This is a BOUND with a number,
      not a proof of independence, and must be reported in those words.
    transcript_level_leak_detected: >-
      The test rejects on real transcripts while the negative control does not. MEANING: the
      transcript carries information about the secret ring beyond the public key at these toy
      parameters. Escalate to independent replication and red-team review before any security
      statement; no cryptographic-scale claim follows.
    instrument_underpowered: >-
      The positive control fails to reject. MEANING: INVALID for the hypothesis. The deliverable is
      the instrument's measured resolution and the failure to reach it, never a negative about
      SQIsign.
    calibration_broken: >-
      The negative control rejects above the nominal level. MEANING: the permutation procedure or
      the sample-independence assumption has failed; every p-value in the run is void and the
      seed-stream construction must be repaired before re-running.
    size_dependent_verdict: >-
      The verdict or the resolution moves materially and monotonically across the three toy sizes.
      MEANING: HEUR-SQISIGN-LEAK-1 is falsified; each verdict is scoped to its own size and no trend
      argument may be used.
  interpretation_limits:
    - >-
      Toy probe only. No claim of any kind about SQIsign's standardized parameters, its security, or
      the security of any deployed system follows from any outcome.
    - >-
      A non-rejection is a BOUND at the achieved resolution, not a proof of independence. The number
      that matters is the minimum detectable divergence, and a report that omits it has reported
      nothing.
    - >-
      The verdict is scoped to the ONE divergence statistic and the ONE feature encoding declared in
      the contract. A different statistic could see what this one cannot, and no statement is made
      about statistics outside the declared battery.
    - >-
      Academic and defensive only. No operational attack against any live system is proposed or
      implied, and any detected leak is an internal observation requiring human review and
      coordinated disclosure.
  prior_evidence_refs: []
  derived_from_idea: IDEA-20260801-020
  status: proposed
  added: '2026-08-25'
  proposed_by: coordinator
