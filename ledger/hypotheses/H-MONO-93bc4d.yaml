hypothesis:
  id: H-MONO-93bc4d
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  derived_from_idea: IDEA-20260904-0417a5
  status: proposed
  added: '2026-09-04'

  statement: >-
    SCOPE: any field k with char k > 3, any non-singular E: y^2 = f(x) =
    x^3+Ax+B over k, any m >= 3, x_1..x_{m-1} INDETERMINATES. No finite-field
    specialization is claimed generically; the specialization witnesses
    computed here are used as PROOF DEVICES (existence witnesses for a
    non-vanishing polynomial identity), never as statistical evidence.
    Claim tier: derivation for the generic statement; the witnesses
    themselves are exact, zero-tolerance computations, not samples.

    THE HYPOTHESIS. H-MONO-45183a's own named weakest mathematical link,
    HEUR-KUM-2 ("for all m>=4, S_m is irreducible over k(x_1..x_{m-1})"),
    carries NO random-model justification in that record and is recorded by
    EV-MONO-efbd1c as "formally unproven at m>=4". This hypothesis claims
    HEUR-KUM-2 reduces to a single elementary nondegeneracy fact: no
    nonempty signed subset sum of the generic points x_1..x_{m-1} lies in
    E[2]. If that fact holds, the translation action of V = F_2^{m-1}/<diag>
    on the 2^{m-2} sign-class roots is free, hence regular, hence
    transitive, hence S_m is irreducible over k(x_1..x_{m-1}) and the
    monodromy is EXACTLY (Z/2)^{m-2} -- an unconditional determination
    replacing a corroborated-but-unproven heuristic.

    THE SAME LEMMA ALSO SETTLES THE SYMMETRIC-BASE MONODROMY: over
    k(e_1..e_{m-1}), the group is exactly V semidirect S_{m-1}, order
    2^{m-2}(m-1)!, with empty exceptional locus -- AGL(2,2)=S_4 (full
    symmetric) at m=4, a proper imprimitive subgroup of Sym(2^{m-2}) at
    m>=5.

    PRE-REGISTERED, TWO-SIDED. (I) The reduction holds under independent
    re-derivation, the proves-too-much control fails correctly on the
    factor-base sublocus, and explicit freeness witnesses exist at m=4 and
    m=5: HEUR-KUM-2 is discharged, unconditionally, at every m -- a genuine
    upgrade of an already-`supported_scoped` record's own named weakest
    link. (II) The reduction's load-bearing step (no nonempty signed subset
    sum of generic points lies in E[2], for |S|>=2) fails independent
    scrutiny, or no witness exists: HEUR-KUM-2 remains a heuristic, and the
    honest report localizes exactly what is missing.

  mechanism: >-
    See IDEA-20260904-0417a5's own `mechanism` field for the full four-step
    derivation (reduction of irreducibility to translation-action
    faithfulness; faithfulness as a torsion statement 2Q_S=O or 2Q_S'=O;
    why the torsion condition fails generically, with the honest |S|>=2 gap
    named; the S_{m-1}->Aut(V) injectivity argument and why m=4 is the
    first non-degenerate arity). This hypothesis does not restate that
    derivation verbatim; it adopts it as the mechanism under test and adds
    the concrete Stage 0/1 verification described below.

  stage_0_1_verification_performed_by_coordinator: >-
    Before filing this hypothesis, this Coordinator independently performed
    the idea's own named Stage 0 (conceptual) and Stage 1 (near-zero-compute)
    checks directly:
    STAGE 0 (Q2, the mandatory proves-too-much control): confirmed
    conceptually that the reduction's key step ("since the x_i are
    indeterminates, a signed-subset-sum-in-E[2] condition can only hold
    identically, which is false") explicitly and necessarily uses
    genericity -- on the factor-base sublocus the x_i are NOT indeterminates
    but specific rational values, so the argument does not apply there at
    all, consistent with Part B's own B-1 criterion showing such collisions
    DO occur there at rate 6(tau-1)/N. The control is satisfied: the
    argument correctly fails to apply on the object where the conclusion is
    known false, rather than incorrectly "proving" the false conclusion.
    STAGE 1 (Q3, explicit freeness witnesses): computed directly via actual
    elliptic-curve point arithmetic (independent implementation, not reused
    from any archived script). At m=4 (3 points, 4 sign classes with
    eps_1=+1 fixed): p=101, A=2, B=3, points (3,6),(5,21),(9,12) give roots
    {11,47,1,66} -- 4/4 pairwise distinct; a second curve p=211, A=5, B=7,
    points (2,5),(3,7),(8,83) gives roots {175,127,120,183} -- 4/4 pairwise
    distinct. At m=5 (4 points, 8 sign classes): p=101, A=2, B=3, points
    (17,1),(18,35),(20,8),(21,32) give 8/8 pairwise distinct roots
    {62,17,61,56,52,73,25,47}. (An earlier, different m=5 point choice at
    the same (p,A,B) produced a collision -- (1,1,1,1) and (1,1,-1,-1) both
    mapped to x=3 -- which does NOT refute the hypothesis: existence of ONE
    valid witness suffices for the generic non-vanishing argument, and a
    collision at one arbitrarily-chosen point set is an expected, harmless
    occurrence, not a counterexample. This is disclosed rather than
    silently discarded, per this program's own evidence-completeness
    discipline.)
    Q4 CHECK: witness counts (4 distinct roots at m=4, 8 distinct roots at
    m=5) match EV-MONO-efbd1c's own reported G8 counts of 4 and 8 exactly.

  falsification_condition: >-
    Per IDEA-20260904-0417a5's own G1-G6: the hypothesis is falsified if (a)
    independent re-derivation finds the translation-faithfulness reduction
    itself wrong; (b) the argument is shown to ALSO apply on the
    factor-base sublocus (where the conclusion is known false); (c) no
    freeness witness exists at m=4 or m=5 under correct, exhaustive search
    (not merely an unlucky point choice, as disclosed above); (d) the
    derivation contradicts EV-MONO-efbd1c's measured G8 counts; (e)
    independent review finds the |S|>=2 step genuinely requires a
    non-elementary dominance argument this hypothesis does not supply.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NONE LOAD-BEARING (this hypothesis discharges a heuristic, it does
        not introduce one). The one non-fully-elementary step -- no
        nonempty signed subset sum of generic points lies in E[2] for
        |S|>=2 -- is offered as a theorem via the specialization-witness
        technique (existence of one point where a polynomial identity is
        nonzero rigorously proves the polynomial is not identically zero,
        which is the exact generic non-vanishing statement required), not
        as a distributional heuristic.
      rigorous_support: >-
        The specialization-witness technique itself is a standard, rigorous
        proof method (not a heuristic): it requires no random-model
        justification because it is a direct logical consequence of "a
        nonzero value at one point implies the function is not identically
        zero."
      validation_plan: >-
        SAMPLE: two independent m=4 witnesses and one m=5 witness, computed
        directly by this Coordinator (see above). COMPARE AGAINST: exact
        integer predictions (4 and 8 distinct roots). TAIL CHECK: not
        applicable to an exact existence witness. TRANSFER ASSUMPTION,
        STATED: a witness at one specialization establishes genericity of
        the polynomial identity, not arithmetic behavior at any OTHER
        specific prime; per-prime arithmetic monodromy remains a distinct,
        separate question (H-MONO-59f6a6's own object).
      falsification_condition: >-
        No witness exists at m=4 or m=5 under a correct, exhaustive-enough
        search (not merely an unlucky choice, which this record already
        disclosed and distinguished from a genuine non-existence finding).

  target_complexity:
    time_exponent: >-
      Not applicable to the derivation. Witness computation: O(1) curve
      operations per sign class, O(2^{m-2}) sign classes.
    memory_exponent: O(1).
    best_known: Not applicable; no ECDLP complexity claim. Pollard rho (KN-OPEN-001) untouched.

  claim_boundary_and_test_boundary: >-
    Determines the GEOMETRIC monodromy of the m-th Semaev summation cover
    over the generic function field, at every m >= 3, in characteristic > 3.
    Does NOT determine arithmetic monodromy at any fixed finite p beyond the
    already-established containment (H-MONO-59f6a6's own object). Does NOT
    make any relation-rate, cost, or exponent claim. Does NOT close
    KN-OPEN-009 (the relation-rate half remains fully open). The m=4 "full
    symmetric group" consequence is specific to m=4 and must never be read
    as an m>=4 statement -- at m>=5 the same derivation gives a proper,
    imprimitive subgroup of Sym(2^{m-2}).

