# =============================================================================
# H-BINSTD-4c31d1 -- sect163k1/sect163r2 same-field 2x2 factorial separates
# Koblitz IC advantage into E1 (Frobenius orbit), E2 (sparse constant), E3
# (class structure). Specified and approved under DEC-20261001-f5758f from
# IDEA-20260922-8ac1ea under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001, absorbing
# the 2026-09-26 review defects
# (analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-8ac1ea.yaml;
# verdict sound / HOLD-J design_after): FIPS 186-4 re-derivation gate;
# measured cost arm dual-cites RQ-NISTBIN-06157b; M4/WDSat deferred.
#
# ZERO RUNS in this design packet. IDEA-20260922-8ac1ea claim text is not
# edited (proposals immutable); this hypothesis cites it and freezes the
# HOLD-J-absorbed restatement for experimental purposes.
# =============================================================================
hypothesis:
  id: H-BINSTD-4c31d1
  question_id: RQ-BINSTD-b6f698
  related_question_ids:
    - RQ-NISTBIN-06157b
  source_idea: IDEA-20260922-8ac1ea
  experiment_id: EXP-BINSTD-6211a9
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-01'
  approved_at: '2026-10-01'
  authorised_by: DEC-20261001-f5758f
  review_cited: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-8ac1ea.yaml
  proposed_by: coordinator
  title: >-
    Over one F_{2^n}, a 2x2 factorial (a in F_2?) x (b in F_2?) with fixed
    V and arity separates three non-overlapping explanations of any Koblitz
    index-calculus advantage (E1 orbit / E2 sparse-constant / E3 class);
    C-GK (generic a, b=1) is the load-bearing null; HB2-2 degree-invariance
    under the constant is the primary zero-variance target

  statement: >-
    SETTING. Binary curves E_{a,b}: y^2+xy=x^3+a x^2+b over one fixed F_{2^n}
    (n prime, 17<=n<=41) with one fixed reduction polynomial and one fixed
    F_2-subspace factor base V of dimension l. The curve enters the Semaev /
    Weil-descent decomposition pipeline at exactly three separable places:
      (P1) S_3(x1,x2,x3)=(x1x2+x1x3+x2x3)^2 + x1x2x3 + b reads ONLY b;
      (P2) E-membership Tr(x+a+b/x^2)=0 and the class map P|->Tr(x_P)+Tr(a)
           read a and b (H-SEMBIN-83a856, supported);
      (P3) tau is an endomorphism of E iff a AND b both lie in F_2.
    Therefore a 2x2 factorial in (a in F_2?) x (b in F_2?) over ONE field
    separates the three. Deployed motivation (identification only, never a
    run target): sect163k1 and sect163r2 share field polynomial, cofactor 2,
    a=1, and order bit-length, differing in exactly one coefficient b — the
    only single-variable matched pair in the standardized binary population
    (secondary OpenSSL dump until Stage 0 re-derives from FIPS 186-4).

    FOUR CELLS (all non-singular for b!=0):
      C-KK: a in F_2, b=1        — Koblitz; tau exists (deployed K-163 analogue)
      C-GK: a generic, b=1       — sparse S_3, NO tau (NULL; nowhere in standards)
      C-KG: a in F_2, b generic  — dense S_3, no tau (deployed B-163 analogue)
      C-GG: a generic, b generic — fully generic

    THREE LIVE EXPLANATIONS with NON-OVERLAPPING predictions:
      (E1) FROBENIUS-ONLY: Koblitz buys exactly the orbit quotient; per-instance
           algebra is curve-blind (a77711 arm A / KN-LIT-796). Prediction: the
           three non-Koblitz cells cost the same per instance within noise at
           equal (V, m_a); only M5 separates C-KK.
      (E2) SPARSE-CONSTANT: b=1 makes the descended system cheaper per instance
           (weight-1 constant vector in polynomial basis). Prediction: both
           b=1 cells cheaper than both b-generic cells, independently of a;
           strongest form is M3 rank profile differing across the b-contrast
           despite identical leading forms.
      (E3) CLASS-STRUCTURE: a moves yield through Tr(a); with V in ker Tr and
           odd m_a, Tr(a)=1 cells give exactly zero G-decompositions
           (IDEA-20260915-8fe0ef S2). Prediction: zero/non-zero lambda_x
           separation on the a-contrast.

    PRIMARY TARGET. HB2-2: first-fall degree and degree-by-degree Macaulay
    rank profile are identical across the four cells at fixed (n, basis, V,
    m_a) — a zero-variance prediction a single differing rank kills. Outcome
    (C) (M3 differs across b-contrast) is a SCOPE LIMIT on Assumption-1
    transferability, not a faster algorithm and not an exponent move.

  statement_note: >-
    IDEA-20260922-8ac1ea claim text is immutable and left at status proposed.
    Review verdict sound (HOLD-J design_after). Defects absorbed: (1) Stage 0
    FIPS 186-4 re-derivation of sect163k1/sect163r2 (a,b,h,order,field poly)
    before any deliverable asserts the single-variable-pair claim at claim
    strength; (2) structural/identification content stays under
    RQ-BINSTD-b6f698; measured decomposition-cost / yield metrics dual-cite
    RQ-NISTBIN-06157b per DEC-20260924-4f8a03 R2 ownership; (3) M4 WDSat
    conflict counts are NOT authorized in this experiment — WDSat is not
    installed; M3 (Macaulay rank / first-fall) is the preprocessing-immune
    decisive arm and runs solver-free on macaulay.py. ECC2K-130 sits in
    C-KK (a=0,b=1); outcome (C) scopes whether a b=1-measured solving degree
    transfers to generic-b curves — methodological bearing only; no exponent
    claim; arity m_a=2,3 far below product-law floor that would threaten rho.

  mechanism: >-
    OBJECT FRAME. No new tracked object. Representation R1 (coordinates in
    the F_2-basis fixed by the curve's reduction polynomial). Operation set
    Sigma = translation by factor-base elements ONLY — PARTIAL-ACTION Class I.
    Lossy projection discards the group element and retains its expression
    over Fb; Sigma-compatible whenever |Fb|^{m_a} > r. DECLARED COMPONENT: F2
    (factor-base decomposition). WHAT IS ADDED: a nearby-object control design
    — the four-cell factorial with C-GK as the null that separates sparse S_3
    from tau-existence — required by docs/inventor-protocol.md before belief
    about any "Koblitz" claim. Shared HOLD-I/J prerequisite: basis/curve-
    general descent generator (vendored Weil_descent.sage monomial restriction
    is an implementation gap, not a research assumption).

  assumptions:
    - >-
      Non-singularity: y^2+xy=x^3+a x^2+b is non-singular iff b!=0; all four
      cells genuine for any a and any b!=0.
    - >-
      One fixed polynomial basis across all cells (constant-vector weight is
      basis-dependent; normal-basis dependence owned by IDEA-20260922-f37254 /
      HOLD-I, deferred).
    - >-
      Factor base V is a bounded-degree algebraic F_2-subspace (KN-OPEN-020
      SCOPED-OUT class); no factor-base escape claim.
    - >-
      b-generic cells drawn at random; cofactors may differ — yield normalised
      by r; h reported as a column, never absorbed.
    - >-
      Targets drawn in the same class of the same subgroup G in every cell.
    - >-
      No scientific run at deployed m>=163; deployed pairs appear only as
      Stage 0 FIPS identity cells and motivation.
    - >-
      M4/WDSat deferred; conflict-count predictions from the source IDEA are
      retained as named future arms, not success criteria of this experiment.

  proof_search_map:
    bottleneck: >-
      Attribution of any measured Koblitz/non-Koblitz index-calculus difference
      among (E1) Frobenius orbit, (E2) sparse constant vector, (E3) trace-parity
      class — no filed record separates them; a77711 arm A is an argument never
      run against a non-Koblitz curve with b=1.
    baseline_embedding:
      parameter_slice: >-
        C-GG with negation-only baseline (plain Gaudry/Semaev); must reproduce
        shipped ICPERF numbers for the same (n,l,m_a) where available.
      reproduction_check: >-
        n=17 Trimoska fixture (a=b=1, r=65587, t=1) as cell C-KK: #E=131174;
        degree-8 Phi_17 divisors with 6 and 7 E-side tau-orbits; |Fb_E|=204
        and 238; rho at 227 (negation) and 55 (<tau,-1>) per
        IDEA-20260915-8fe0ef. Fixture must pass before any cell is reported.
    observation_collision:
      observable: >-
        Per-cell pair (Macaulay rank profile / first-fall degree; exhaustive
        lambda_x at equal (V, m_a)).
      distinct_preimage_search: >-
        Cheaper C-KK admits (i) Frobenius orbit (E1) — changes RELATION COUNT
        not per-instance algebra, excluded by measuring per-instance M3
        separately; (ii) sparse constant (E2); (iii) higher lambda_x (yield,
        measured in M2); (iv) solver preprocessing on weight-1 constants —
        excluded because M3 is preprocessing-immune and M4 is deferred.
        Reporting M2 and M3 separately prevents one number carrying all four.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Fibre of "descended system" over "curve" at fixed field, basis, V,
          arity — map E_{a,b} -> (top-degree part, constant vector); first
          component constant across the fibre by (P1).
        predicted_gain: >-
          Makes the curve-coefficient residual a measurable difference between
          systems provably identical above degree 0.
      - transform: representation_reduction
        proposed_object: >-
          Four-cell factorial as the unit of report for every future "Koblitz
          curves are easier/harder for IC" statement.
        predicted_gain: >-
          Retires bundling of (P1)/(P2)/(P3) under the single word "Koblitz".
    quantifier_order: >-
      (P1)-(P3) are FOR ALL statements about every binary curve in the family
      and are exact. (E1)-(E3) are existential predictions about a measured
      pattern at the tested (n,l,m_a,instrument), and a null result closes only
      the tested cells and parameters — never the curve and never the mechanism
      universally. Transfer to m>=163 is NOT asserted at any outcome.
    method_ceiling:
      strongest_certifiable_claim: >-
        At n in {17,23,29} with V of dimension l and arity m_a, on the four
        cells of the (a in F_2) x (b in F_2) factorial over one field with one
        reduction polynomial, the measured M2 yield and M3 rank profile are
        [table], the pattern matches (E1)/(E2)/(E3) as follows, and the first
        fall degree is [invariant / not invariant] across cells. Scoped,
        instrument-named, matched rho beside it, silent about any deployed
        curve's security.
      nearby_object_control: >-
        Cell C-GK is the nearby-object control (sparse S_3, no tau). Secondary:
        C-KG drawn twice independently (N2). Known-false: V in ker Tr, odd
        m_a, Tr(a)=1 must give zero G-decompositions.
    proof_obligations:
      - claim: All four cells use the same field, reduction polynomial, V, and arity
        responsibility: correctness
      - claim: Top-degree part of the descended system verified identical across cells before any cost/rank comparison
        responsibility: correctness
      - claim: lambda_x is exhaustive wherever 2^{m_a l} permits
        responsibility: success_probability
      - claim: Matched rho reported per cell with that cell's own symmetry group
        responsibility: baseline
      - claim: Cofactor and r reported per cell and never assumed equal
        responsibility: correctness
      - claim: sect163k1/sect163r2 single-variable claim re-derived from FIPS 186-4 before appearing in any deliverable
        responsibility: scope
      - claim: No conclusion about any deployed curve's security at any outcome
        responsibility: scope
      - claim: Measured cost/yield dual-cites RQ-NISTBIN-06157b; structural verdict stays under RQ-BINSTD-b6f698
        responsibility: scope
    not_applicable_reason: null

  asymptotic_claim:
    problem: >-
      Relation decomposition for index calculus on binary curves; attribution
      of Koblitz vs non-Koblitz differences among (E1)/(E2)/(E3)
    prior_best: >-
      Per-instance law c * 2^{m_a l} with N_rel = U+O(1); matched rho at
      0.886 sqrt(r) / sqrt(pi r/(4n)); a77711 arm A (Frobenius buys orbit
      quotient only, no per-instance gain) as unverified argument
    time_exponent: unchanged
    memory_exponent: unchanged
    hidden_cofactor: >-
      Entire output is a cofactor / attribution: cell-to-cell M3 invariance
      (HB2-2) and yield ratios; predicted 1 under (E1), cell-dependent under
      (E2)/(E3). No new algorithm.
    claim_kind: control

  heuristic_assumptions:
    - id: HEUR-BINSTD-4c31d1-HB2-1
      formal_statement: >-
        (E-SIDE COUNT) For E_{a,b}/F_{2^n} and F_2-subspace V of dimension l
        with 0 not in V, |Fb_E ∩ V| = (2^l-1)/2 + O(2^{l/2}), uniformly over
        a and b!=0 (source IDEA HB2-1).
      random_model_justification: >-
        RIGOROUS: E-side indicator via additive character; full-field sum is
        a Kloosterman sum bounded by 2 sqrt(q) (Weil). HEURISTIC: subspace
        restriction of that sum. Classical analogue: Weil/Kloosterman
        equidistribution (Katz) imitated at subspace level.
      supporting_results:
        - ref: IDEA-20260922-8ac1ea
          provenance: internal
          claim: HB2-1 formal statement and validation plan
          verified_by: coordinator, this design session (Read, full proposal)
        - ref: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-8ac1ea.yaml
          provenance: internal
          claim: Review confirms P1-P3 and HB2-2 framing; HB2-1 retained as background
          verified_by: coordinator, this design session (Read, full review)
      validation_experiment_ids:
        - EXP-BINSTD-6211a9
      falsification_condition: >-
        Fraction of (a,b) with |count-(2^l-1)/2| > 2 sqrt(2^l) exceeds 0.05,
        or any (a,b) exceeds 4 sqrt(2^l), at tested (n,l) — reported, not absorbed.
    - id: HEUR-BINSTD-4c31d1-HB2-2
      formal_statement: >-
        (DEGREE INVARIANCE UNDER THE CONSTANT) The first fall degree and the
        degree-by-degree Macaulay rank profile of the descended decomposition
        system over F_2 depend on the curve only through the top-degree part,
        and are therefore identical across the four cells at fixed
        (n, basis, V, m_a). Zero-variance prediction; a single differing rank
        refutes it. PRIMARY TARGET of this experiment.
      random_model_justification: >-
        RIGOROUS: by (P1) systems differ only in degree-0 terms, so leading
        forms coincide; for a SEMI-REGULAR system the degree of regularity is
        a function of leading forms alone. HEURISTIC: Semaev systems are not
        semi-regular in this program's measurements (GOAL-DREG-001 deficits),
        so equal leading forms -> equal rank profile is exactly the step that
        may fail — which is why HB2-2 is the primary target rather than an
        assumption the design rests on.
      supporting_results:
        - ref: IDEA-20260922-8ac1ea
          provenance: internal
          claim: HB2-2 as zero-variance primary target; M3 discriminator
          verified_by: coordinator, this design session (Read, full proposal)
        - ref: RQ-SEMBIN-9e8f82
          provenance: internal
          claim: S_3 reads the curve only through b (P1)
          verified_by: >-
            cited inside IDEA-20260922-8ac1ea with verified_by; coordinator
            did not reopen RQ-SEMBIN-9e8f82 this session (pointer retained)
      validation_experiment_ids:
        - EXP-BINSTD-6211a9
      falsification_condition: >-
        Any single degree at which Macaulay ranks differ across the four cells
        at fixed (n, basis, V, m_a) after top-degree-part identity is verified
        — outcome (C); HB2-2 rejected at tested scope.

  structural_ingredients:
    - description: >-
        Summation polynomial S_3 reads the curve only through b
      citation: RQ-SEMBIN-9e8f82
      provenance: internal
      verified_by: IDEA-20260922-8ac1ea citations block (coordinator read proposal)
      role: P1 — top-degree identity across cells
    - description: >-
        Class map P|->Tr(x_P)+Tr(a) is the quotient E->E/2E; status supported
      citation: H-SEMBIN-83a856
      provenance: internal
      verified_by: IDEA-20260922-8ac1ea citations block (coordinator read proposal)
      role: P2 / E3 yield prediction
    - description: >-
        Frobenius-invariant factor bases reduce relation count by 1/n and LA
        by n^2 (GGMP)
      citation: KN-LIT-796
      provenance: kb
      verified_by: >-
        corpus record quoted inside IDEA-20260915-8fe0ef / proposal citations;
        full GGMP text not opened this session
      role: E1 orbit-quotient baseline
    - description: >-
        sect163k1/sect163r2 parameter identities (secondary until FIPS gate)
      citation: analysis/binstd-curve-audit/binary-curve-params.txt
      provenance: internal
      verified_by: coordinator, this design session (path present; Stage 0 FIPS gate)
      role: deployed single-variable-pair motivation

  reduction_chain:
    core_problem: >-
      Decide which of (E1)/(E2)/(E3) accounts for any measured Koblitz vs
      non-Koblitz index-calculus difference at toy binary scale, and whether
      first-fall / solving-degree bounds transfer across curves over one field
    corollaries:
      - problem: >-
          Scope limit on Assumption-1 / first-fall transferability for SEMBIN
          and DREG lanes (successor_seam if outcome C)
        reduction_ref: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-8ac1ea.yaml successor_seam
        asymptotics_preserved: true
      - problem: >-
          NISTBIN measured K/B decomposition-cost comparison at equal field
          (ownership routing DEC-20260924-4f8a03 R2)
        reduction_ref: RQ-NISTBIN-06157b
        asymptotics_preserved: true

  predictions:
    - metric: constant_vector_weight_M1
      direction: lower
      minimum_effect: >-
        Exactly 1 in both b=1 cells; within [n/2-2sqrt(n), n/2+2sqrt(n)] in
        both b-generic cells. Any other value means descent is not writing b
        into the constant as (P1) says — instrument failure.
    - metric: macaulay_rank_profile_first_fall_M3
      direction: flat
      minimum_effect: >-
        Identical across all four cells at every degree (HB2-2). A single
        differing rank across the b-contrast is the (E2)-strong / outcome (C)
        finding and the most informative single result.
    - metric: lambda_x_a_contrast_M2
      direction: different
      minimum_effect: >-
        Under (E3) with V inside ker Tr and odd m_a: exactly 0 on Tr(a)=1
        cells and strictly positive on Tr(a)=0 cells — zero/non-zero
        separation, not a soft ratio.
    - metric: C-KK_vs_C-GK_M3_agreement
      direction: flat
      minimum_effect: >-
        Under (E1) and a77711 arm A: rank profiles agree (no per-instance
        Frobenius gain). Disagreement is a finding about Frobenius at the
        algebra level, scoped to tested (n,l,m_a).
    - metric: N2_transported_curve_ratio
      direction: flat
      minimum_effect: >-
        Two independently drawn C-KG curves: M3 and M2 agree within N1 noise
        floor (ratio in [0.85,1.18] where ratios apply); otherwise the 2x2
        is unreadable and the honest output is a power calculation.
    - metric: FIPS_single_variable_pair_verified
      direction: exact
      minimum_effect: >-
        Stage 0: sect163k1 and sect163r2 share field poly, a=1, h=2, order
        bit-length; differ in b only — verified from FIPS 186-4 primary
        (or explicit unrecovered=true with attempted source).

  test_boundary:
    instances:
      - >-
        Stage 0: FIPS 186-4 re-derivation of sect163k1/sect163r2; symbolic
        Weil-descent check of S_3 (P1); M1 constant-vector weights; n=17
        Trimoska C-KK reproduction fixture (IDEA-20260915-8fe0ef quantities)
      - >-
        Stage 1: four cells at n=23, one reduction polynomial, V dim l=11,
        m_a=2 (exhaustive 2^22 pairs); M2 yield; M3 Macaulay ranks / first
        fall; N1 identity; known-false V in ker Tr odd-arity control
      - >-
        Stage 2: n=29 replication of M2/M3; N2 second C-KG draw; M5 C-KK
        orbit count / U / matched rho; optional m_a=3 where affordable
    parameters:
      n: [17, 23, 29]
      l: [11]
      m_a: [2, 3]
      cells: [C-KK, C-GK, C-KG, C-GG]
      basis: polynomial
    implementation: >-
      Reuse EXP-CERTBIN-e94b27/impl/{macaulay,curve,gf2n,instances}.py plus
      a new basis/curve-general descent generator (shared HOLD-I/J build).
      Pure-Python Macaulay ranks within DEC-20260913-47bbb7 budget. WDSat
      NOT required for Stages 0-2 (M4 deferred).
    budget:
      wall_clock_seconds: 86400
      memory_gb: 8
      maximum_runs: 30

  falsification_conditions:
    - >-
      Top-degree part of the descended system NOT identical across the four
      cells falsifies (P1) as implemented — instrument failure; halt; not a
      curve finding.
    - >-
      Constant-vector weight != 1 in a b=1 cell falsifies basis handling.
    - >-
      Non-zero G-target decomposition at odd m_a on a Tr(a)=1 cell with V
      inside ker Tr falsifies the class criterion of H-SEMBIN-83a856 as
      applied here; withdraw until the failing step is named.
    - >-
      Control N2 failing (two C-KG curves disagree beyond N1) means the
      design cannot attribute anything to a cell; honest output is a power
      calculation, not a verdict.
    - >-
      Stage 0 FIPS re-derivation disagrees with the secondary dump on the
      single-variable-pair claim — supersede the motivation claim; toy
      factorial may still proceed with the disagreement recorded.

  interpretation_limits:
    - >-
      Scoped to tested n, reduction polynomial, V, arity, instrument, budget.
      Nothing transfers to m>=163; nothing claimed about any deployed curve's
      security at any outcome.
    - >-
      Factor base is bounded-degree algebraic (KN-OPEN-020 SCOPED-OUT);
      no escape claim; no outcome constitutes one.
    - >-
      An identification result is not a cost result. Even outcome (C) says
      only that a degree bound does not transfer between curves over one
      field; it supplies no new algorithm and moves no exponent.
    - >-
      Measured K/B cost columns dual-cite RQ-NISTBIN-06157b; structural
      (E1)/(E2)/(E3) attribution stays under RQ-BINSTD-b6f698.
    - >-
      M4/WDSat conflict-count predictions are NOT tested in this experiment.
    - >-
      ECC2K-130 bearing is methodological (C-KK sparsity / transferability);
      arity far below product-law floor; matched rho dominates.

  distinguishable_outcomes:
    - id: DO-A-E1-stands
      description: >-
        All four cells agree in M3 within N1; only M5 separates C-KK —
        (E1) stands; Koblitz advantage is exactly the orbit quotient;
        IDEA-20260922-1a081a HB1-2 (yield parity) supported at tested scope.
      next_decision: support_E1_scoped_update_reachability_columns
    - id: DO-B-E2-solver-only
      description: >-
        b=1 cells cheaper in deferred M4 but identical in M3 — (E2) at
        solver level only (not tested here without WDSat); if M3 identical
        and M2 agrees, report M3-invariant with M4 deferred.
      next_decision: record_M3_invariant_defer_M4
    - id: DO-C-E2-algebra
      description: >-
        M3 differs across the b-contrast despite identical leading forms —
        (E2) at algebra level; Assumption-1 / first-fall bounds do not
        transfer across curves over one field; successor_seam opens.
      next_decision: reject_HB2-2_scoped_open_transferability_successor
    - id: DO-D-E3-yield
      description: >-
        lambda_x separates on the a-contrast as (E3) predicts — yield is
        curve-indexed; reachability table's per-curve column is yield.
      next_decision: support_E3_scoped_update_yield_column
    - id: DO-E-N2-fail
      description: >-
        Two C-KG curves disagree beyond N1 — unit of comparison is the
        individual curve; 2x2 under-powered; report required sample size.
      next_decision: inconclusive_power_calculation

  dominated_by: >-
    Dominated at every cell by matched rho for that cell's own curve. At
    deployed instances: K-163 ~2^{77.16} and B-163 ~2^{80.83} group ops
    (proposal arithmetic from audit dump; Koblitz convention gap ~0.5 bit
    noted by review). At toy cells: rho ~2^{8.6}..2^{11}. FRONTIER ROWS
    CHECKED: (i) negation-only rho; (ii) <tau,-1> rho; (iii) vOW; (iv)
    exhaustive group search; (v) exhaustive V^{m_a}/m_a! table (dominates
    SAT at toy size); (vi) SAT pipeline c*2^{m_a l}; (vii) GHS structurally
    empty on prime-degree rows. No data/query axis. No algorithmic row
    claimed — dominated trivially.
  sota_delta:
    time: >-
      Zero exponent movement. Quantitative delta is attribution: which of
      (E1)/(E2)/(E3) accounts for a measured difference, plus a yes/no on
      HB2-2 degree invariance.
    memory: Zero. No memory exponent or constant changes.
    data_queries: >-
      Not applicable; every cell consumes one target instance at a time;
      N3 consumes none.

  status: approved
  status_history:
