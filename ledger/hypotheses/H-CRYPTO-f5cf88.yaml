hypothesis:
  id: H-CRYPTO-f5cf88
  question_id: RQ-CRYPTO-001

  statement: >-
    SCOPE: the Gate A / Gate B discovery-readiness rubric of GOAL-CRYPTO-001 as
    COMMITTED in
    coordination/goals/GOAL-CRYPTO-001/batches/BATCH-013/tasks/TASK-20260731-001/discovery_readiness_screen.yaml,
    executed blind against a frozen input set of six fingerprints plus a
    seven-point ablation ladder. CLAIM TIER: methodological measurement of an
    instrument. THIS IS NOT EVIDENCE ABOUT THE ECDLP, ABOUT ANY CURVE, OR ABOUT
    ANY MECHANISM, AND MAY NEVER BE CITED IN A COST OR COMPLEXITY STATEMENT.
    Three conjuncts.
    (S1, SENSITIVITY) Gate A, executed as written, returns PASS on all three
    prime-field-compatible planted positives -- fingerprints of mechanisms that
    demonstrably beat a matched generic baseline on a named curve class -- when
    those fingerprints are faithful and blinded. Forced value 3 of 3.
    (S2, SPECIFICITY) Gate A returns FAIL on all three matched nulls, AND each
    FAIL is attributed to the field the null was built to violate: N1 at
    relation_or_direct_solve_predicate, N2 at
    falsifiable_claimed_metric_gain_and_direction, N3 at
    semantic_distinction_from_prior_CRYPTO_routes. Forced value 0 of 3 passes
    WITH correct per-field attribution; a 0 of 3 with wrong attribution is a
    partial failure and is reported as one.
    (S3, THE GATE-B DIAGNOSIS) Gate B returns FAIL on all three planted
    positives, and the FAIL is produced by fields demanding ARTIFACTS (oracle
    transcript, exact source replay, measured relation yield, fully charged cost)
    rather than by fields describing the mechanism. Forced value 0 of 3, and the
    interpretation is FIXED HERE BEFORE ANY SCORING: a Gate-B fail on a
    Gate-A-passing positive is an ARTIFACT GAP, and a campaign that records such
    a fail as NO_CANDIDATE has mislabelled an implementation backlog as an
    absence of candidates.
    IF S1 AND S2 BOTH HOLD, the screen is demonstrably sensitive and specific,
    the thirteen FINAL_NO_CANDIDATE dispositions are STRENGTHENED, and this
    hypothesis's concern is refuted -- which is the outcome it expects at Gate A
    and says so. IF S1 FAILS, the screen's 0/N pass record is a property of the
    rubric and the dispositions are scoped to "no candidate visible to this
    screen". NEITHER OUTCOME RETRACTS ANY DISPOSITION, IMPLIES ANY CHECKED RECORD
    WAS ADMISSIBLE, OR IS A CANDIDATE MECHANISM.

  mechanism: >-
    WHAT THE INSTRUMENT IS, READ FROM THE COMMITTED ARTIFACT. Gate A ("partial
    ordinary-prime-field mechanism typing") requires six fields:
    factor_base_or_representation; relation_or_direct_solve_predicate;
    target_dependence; witness_source_semantics;
    falsifiable_claimed_metric_gain_and_direction; and
    semantic_distinction_from_prior_CRYPTO_routes. Gate B ("experiment
    readiness") requires seven: oracle_transcript; exact_source_replay;
    relation_yield_and_independent_rank;
    fresh_scalar_blind_descent_or_direct_solve; preprocessing_memory_traffic;
    certificate_interfaces; fully_charged_cost_vs_matched_rho. BATCH-013
    examined five entries and returned FAIL at both gates on all five, with
    verdict FINAL_NO_CANDIDATE.

    THE INFERENCE PROBLEM, STATED AS TWO COMPETING HYPOTHESES. A screen's verdict
    carries information about the world in proportion to
    P(PASS | input is genuinely admissible). No batch estimates that. Two
    hypotheses fit every observation on record: (S) the screen is sensitive and
    the checked literature really contains no admissible candidate; (I) the
    thirteen-field conjunction is so restrictive that no real mechanism
    description satisfies it, and the FAIL stream is a property of the rubric.
    These are DISTINGUISHABLE at zero compute by the standard move this program
    has skipped 188 times out of 229: run the instrument on an object where the
    effect MUST appear.

    THE PLANTED POSITIVES AND WHY EACH MUST PASS GATE A. Each is a mechanism that
    is real, documented, and gives a large advantage over a matched generic
    baseline on a named class, and each therefore fills all six Gate-A fields.
      P1 Pohlig-Hellman on a smooth-order subgroup. Representation: the CRT
        decomposition into prime-power components. Predicate: direct solve per
        component. Target dependence: any group with smooth order, prime field
        included. Gain: from sqrt(N) to sum over prime factors -- unbounded,
        stated, falsifiable. Certificate: the scalar.
      P2 The trace-one / anomalous-curve attack (Smart; Satoh-Araki; Semaev
        line). Representation: the p-adic / formal-group logarithm. Predicate:
        direct solve. Target dependence: ORDINARY PRIME-FIELD curves with
        #E = p -- squarely inside RQ-CRYPTO-001's declared scope. Gain: from
        sqrt(p) to O(log p) -- an exponent collapse. Certificate: the scalar.
      P3 The MOV / Frey-Ruck pairing transfer at small embedding degree.
        Representation: mu_r inside F_{p^k}^*. Predicate: direct solve in the
        target group by NFS-type index calculus. Target dependence: prime field,
        curve with small ord_r(p). Gain: exponential to subexponential.
        Certificate: the scalar, checked on the curve.
    ALL THREE ARE RECALLED, NOT READ. A positive whose reality cannot be
    substantiated from a primary source in Stage 0 is DROPPED from the arm; if
    fewer than two survive the audit is reported blocked on source access rather
    than run underpowered. TWO FURTHER FINGERPRINTS, P4 (Gaudry-Semaev-Diem
    index calculus for E(F_{q^n}), n > 1) and P5 (GHS Weil descent over composite
    binary fields), are included as SCOPE-BOUNDARY PROBES and are NOT part of
    S1: they are not prime-field, so the correct verdict on them is a SCOPE
    rejection, and whether the rubric distinguishes a scope rejection from a
    mechanism rejection is a separate reported observation.

    THE MATCHED NULLS AND THEIR PER-FIELD FORCED VALUES. Each null has the same
    six fields, the same register of language, and the same specificity as a
    positive, and no mathematical content.
      N1 "descent through a randomly chosen degree-3 rational map" with no
        rationality or degree condition stated -- so no relation can be produced.
        FORCED FAIL AT relation_or_direct_solve_predicate.
      N2 a mechanism whose gain is a direction with no magnitude
        ("asymptotically faster") -- which is exactly what
        falsifiable_claimed_metric_gain_and_direction exists to reject.
        FORCED FAIL AT that field.
      N3 a verbatim re-fingerprint of a mechanism already screened and rejected
        in an earlier batch, with the surface vocabulary changed.
        FORCED FAIL AT semantic_distinction_from_prior_CRYPTO_routes.
    THE THREE NULLS ARE BUILT TO FAIL AT THREE DIFFERENT FIELDS, and that is the
    design's discriminating content: a screen that fails all three for the SAME
    reason is responding to something other than the fields it names. This is a
    control that can genuinely fail, in the sense KN-TECH-1a5b7e requires and
    which the program's own AES falsified-hint control (EV-AES-d33b1c,
    EV-AES-d8a13e) is catalogued as lacking. N3 is the sharpest of the three
    because it tests whether the rubric detects a repackaging or is fooled by
    notation -- the failure mode inventor-protocol section 1 names as "often
    invisible because the variant arrives in new notation".

    THE ASYMMETRY BETWEEN THE GATES, DERIVED RATHER THAN OBSERVED. Gate A's six
    fields are all properties OF A MECHANISM and can be read off any faithful
    description. Gate B's seven fields demand ARTIFACTS: a transcript, a replay,
    a measured yield, a charged cost. No literature record carries those; they
    are produced by IMPLEMENTING the mechanism. Therefore the pre-derived
    prediction is asymmetric and sharp -- positives PASS Gate A and FAIL Gate B --
    and it is derivable from the field lists alone, before any scoring. If that
    is what the audit finds, then a Gate-B FAIL was never a statement about a
    mechanism, and the campaign's routing of it to NO_CANDIDATE conflates "not
    yet implemented" with "not a candidate". The repair follows immediately and
    is named as forward guidance rather than as a demand: route Gate-A-pass /
    Gate-B-artifact-gap to an implementation task.

    BLINDING, AND WHY IT IS LOAD-BEARING. If the scorer knows P2 is the anomalous
    curve attack, the scoring measures the scorer's knowledge, not the rubric.
    The input set is presented as a shuffled list of fingerprints with all proper
    nouns, dates, citations and author names removed, under opaque labels, with
    positives and nulls interleaved by a seeded permutation committed by hash
    before any verdict is written. The scorer's post-hoc identification rate is
    reported as a declared confound rather than assumed away, because blinding a
    famous mechanism is imperfect and pretending otherwise would be the
    dishonest option.

    THE COVERAGE DENOMINATOR, A SECOND AND INDEPENDENT MEASUREMENT. BATCH-013's
    own coverage block records 3 WebSearch lists, 10 displayed items and 6
    Crossref requests. Summing the analogous blocks over all thirteen batches
    gives the exact size of the finite set over which "FINAL" is asserted. That
    count is the argument inventor-protocol section 4 demands: a closure needs a
    named obstruction and an argument, while a count of screened-and-rejected
    candidates is a fatigue report whose honest status is unverified -- and if
    the total is in the tens, the disposition's own scope line
    ("finite checked-record set ... nonzero search/access false-negative risk
    remains") is doing all the work. Related and free: every batch screened
    EXTERNAL literature only; inputs/h100_session/ holds an internal hypothesis
    reservoir that ledger/REVIEW-H100-20260717.md reports as largely unmeasured,
    and no batch has pointed Gate A at it. That is a named, addressable coverage
    hole and naming it is the forward guidance a negative owes.

  assumptions:
    - >-
      THE RUBRIC IS EXECUTED AS COMMITTED, NOT AS REMEMBERED. If the original
      screening sessions applied unwritten criteria, this audit measures the
      written rubric and not the one used. That limit cannot be removed -- the
      sessions are gone -- and it is declared here rather than discovered later.
    - >-
      The three planted positives really beat a matched generic baseline on their
      declared class. All RECALLED, NOT READ. This is an EVIDENTIARY assumption
      about sources, not a mathematical one, and it is the audit's only real
      dependency on the outside world.
    - >-
      Two independent scorers can execute the rubric to the same verdict on a
      majority of items. If they cannot, the rubric is not an instrument, and
      that finding REPLACES the sensitivity measurement rather than being an
      obstacle to it.
    - >-
      The input set is frozen -- six fingerprints, two scope probes, one
      seven-point ablation ladder -- before any verdict is written, and no item
      may be added, edited or withdrawn after the first verdict.

  proof_search_map:
    bottleneck: >-
      The single step at which GOAL-CRYPTO-001 converts a body of literature into
      the disposition FINAL_NO_CANDIDATE. Thirteen batches, thirteen
      dispositions, and one uncharacterised rubric standing between them. Every
      downstream statement this goal has made -- including its next_action, which
      instructs the program to await externally supplied mechanisms -- rests on
      that step, and no measurement of it exists.
    baseline_embedding:
      parameter_slice: >-
        The rubric applied to the five records BATCH-013 actually examined, whose
        committed verdicts are FAIL at both gates. That is the exact old-method
        boundary: the audit's scoring procedure must reproduce those five
        committed verdicts before its verdicts on new items mean anything.
      reproduction_check: >-
        FROZEN FIXTURE. Re-score the five committed BATCH-013 entries from their
        recorded fingerprints under the audit's own scoring procedure and require
        exact agreement with the committed FAIL verdicts, INCLUDING the recorded
        per-field reasons where those are recorded (e.g. ePrint 2024/1923 fails
        falsifiable_claimed_metric_gain_and_direction and
        semantic_distinction_from_prior_CRYPTO_routes). Disagreement on any of
        the five means the audit is executing a different rubric than the
        campaign did, and no comparison to those batches is admissible.
    observation_collision:
      observable: >-
        The pair (Gate A verdict, Gate B verdict) with per-field attribution.
      distinct_preimage_search: >-
        THE COLLISION SEARCH IS THE ENTIRE EXPERIMENT AND IT IS DIRECTED AT A
        SPECIFIC PAIR. Look for a planted positive and a matched null that
        receive the SAME observable. Under S1 and S2 no such pair exists; if one
        does, two ground-truth objects on opposite sides of the claimed
        conclusion share the observable, identifiability fails outright, and the
        rubric cannot support the inference the campaign drew from it. A SECOND
        collision is searched for within the positive arm: P4 and P5 (non-prime-
        field) should collide with each other and NOT with P1-P3, and if they
        collide with P1-P3 the rubric is not separating scope from mechanism.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable fixed (Gate A = FAIL) and vary the forgotten
          structure: is the input a genuine mechanism lacking an artifact, a
          genuine mechanism out of scope, or an empty fingerprint? The intrinsic
          invariant proposed to distinguish them is WHICH FIELD produced the
          FAIL. If the field attribution does not separate the three, the
          verdict FAIL is an equivalence class the campaign has been reading as
          a single meaning.
        predicted_gain: >-
          None to any attacker. To the program: a decomposition of thirteen
          FAILs into artifact gaps, scope rejections and genuine mechanism
          rejections -- three dispositions the campaign currently reports as one.
      - transform: stronger_invariant
        proposed_object: >-
          Replace the binary gate verdict with the six-field vector, preserving
          more state than the final admission decision requires, because the
          vector is what survives across batches and supports a coverage
          argument while the bit does not.
        predicted_gain: >-
          Makes "FINAL_NO_CANDIDATE over the checked set" auditable at the field
          level and makes a future batch's screen comparable to a past one's.
    quantifier_order: >-
      WHAT THE CAMPAIGN'S DISPOSITION ASSERTS, WRITTEN OUT: FOR ALL records in
      the finite checked set, the screen returned FAIL. That is true and is not
      disputed. WHAT A READER TAKES FROM IT: THERE EXISTS no admissible mechanism
      in the literature -- which does not follow, and the campaign's own
      does_not_claim block correctly disclaims it. THE QUANTIFIER THIS AUDIT
      SUPPLIES: THERE EXISTS an admissible input on which the screen returns
      PASS. That existential is what converts the universal FAIL into evidence,
      and it has never been established. Note the trap being avoided in the
      audit's own claim: the weak order "for each input there is some scoring
      that passes it" is trivial and is NOT claimed; the claim is "one frozen
      scoring procedure, applied to all inputs, passes the positives and fails
      the nulls", with the procedure not permitted to depend on the item.
    method_ceiling:
      strongest_certifiable_claim: >-
        AT MOST: the measured sensitivity and specificity of one written rubric
        on one frozen six-item blinded set plus a seven-point ablation ladder,
        scored by one or two independent scorers. It CANNOT show that an
        admissible mechanism exists, cannot retract or alter any disposition,
        cannot establish that any checked record was admissible, cannot show the
        screening sessions applied the rubric as written, and cannot support any
        statement about the ECDLP. A screen defect is not a candidate.
      nearby_object_control: >-
        THE NEARBY OBJECT WHERE THE HOPED-FOR CONCLUSION FAILS IS P4/P5 -- the
        non-prime-field mechanisms. They are genuine, they beat generic baselines
        on their classes, and they SHOULD be rejected, but for a reason (scope)
        that is different in kind from the reason a null is rejected (no
        content). A rubric that cannot hold those two rejections apart has not
        identified the load-bearing structure and is emitting one bit where three
        meanings live. Running both is a required arm precisely because it is the
        arm on which the audit's own thesis can be embarrassed: if the rubric
        separates them cleanly, it is a better instrument than this hypothesis
        supposes.
    proof_obligations:
      - claim: >-
          The audit's scoring procedure reproduces all five committed BATCH-013
          verdicts, with recorded per-field reasons where recorded.
        responsibility: baseline
      - claim: >-
          Each planted positive's fingerprint is faithful to a primary statement
          of the mechanism, or the positive is dropped.
        responsibility: interface
      - claim: >-
          Each null's forced failing field is derived from the rubric text before
          scoring, and the three fields are distinct.
        responsibility: correctness
      - claim: >-
          The null arm is scored, recorded and hash-committed before the positive
          arm is examined.
        responsibility: strictness
      - claim: >-
          The scorer is independent of the author of the input set, and the
          unblinding key is hash-committed before the first verdict.
        responsibility: interface
      - claim: >-
          The ablation ladder is monotone, or the non-monotonicity is reported as
          evidence that the rubric is not the conjunction it is written as.
        responsibility: correctness
      - claim: >-
          No disposition, evidence record, decision or goal field is changed, and
          no candidate mechanism is asserted.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    DELIBERATELY NULL. There is no complexity claim of any kind. This hypothesis
    measures a screening instrument. It makes no system easier to solve, moves no
    exponent, proposes no algorithm, and adds no attack. Pollard rho remains the
    ECDLP baseline and sota_delta is zero on every attack axis -- time, memory,
    data, queries and advice. dominated_by is not applicable because no Pareto
    point is claimed.

  heuristic_assumptions:
    - id: HEUR-SCR-1
      formal_statement: >-
        The rubric is the conjunction of its written fields: FOR ALL inputs,
        Gate A returns PASS if and only if all six fields are filled
        non-degenerately, and the verdict does not depend on any property of the
        input outside those six fields.
      random_model_justification: >-
        NOT A RANDOM MODEL AT ALL, and it is labelled as such rather than dressed
        as one. It is a structural claim about a written procedure, and it is the
        claim the ablation ladder exists to test.
      supporting_results: []
      validation_experiment_ids: [EXP-CRYPTO-e78afb]
      falsification_condition: >-
        The ablation ladder is non-monotone -- the verdict returns to PASS as
        more fields are degraded -- or two items with identical six-field status
        receive different verdicts. Either observation refutes HEUR-SCR-1 and
        means the recorded gate description is incomplete, which is itself a
        first-class finding about the goal's committed artifacts.
    - id: HEUR-SCR-2
      formal_statement: >-
        Blinding is effective enough that the scorer's verdicts are not driven by
        recognition: the scorer's post-hoc identification rate on the eight
        blinded items is below 0.5.
      random_model_justification: >-
        None available. Famous mechanisms are recognisable from their
        fingerprints and this heuristic is expected to be STRAINED rather than
        satisfied; it is stated numerically so that its failure is measured
        instead of denied.
      supporting_results: []
      validation_experiment_ids: [EXP-CRYPTO-e78afb]
      falsification_condition: >-
        Identification rate at or above 0.5. The audit then reports its verdicts
        as PARTIALLY UNBLINDED and the sensitivity figure is downgraded to a
        rubric-plus-scorer measurement, which is weaker and must be said to be
        weaker. It is NOT a reason to withhold the result.
    - id: HEUR-SCR-3
      formal_statement: >-
        A faithful six-field fingerprint of P1, P2 or P3 can be written that a
        knowledgeable reader would accept as describing that mechanism.
      random_model_justification: >-
        Editorial rather than probabilistic. The risk it names is real: a
        fingerprint written by the party predicting PASS can be written to pass.
      supporting_results: []
      validation_experiment_ids: [EXP-CRYPTO-e78afb]
      falsification_condition: >-
        An independent reviewer judges any positive's fingerprint unfaithful or
        inflated. That item is struck and the arm is re-reported with the
        remainder; if fewer than two positives survive, the audit is reported
        blocked rather than run underpowered.

  structural_ingredients:
    - description: >-
        The committed Gate A / Gate B rubric, its five checked records, their
        verdicts, and the coverage block.
      citation: >-
        coordination/goals/GOAL-CRYPTO-001/batches/BATCH-013/tasks/TASK-20260731-001/discovery_readiness_screen.yaml
        -- READ IN FULL IN THIS SESSION. This is the only source in this record
        that was actually read end to end.
    - description: >-
        The goal's evidence series and the disposition it supports.
      citation: >-
        ledger/evidence/EV-CRYPTO-013.yaml (read in full) and EV-CRYPTO-001..012
        (read as summaries only, and labelled so). ledger/goals/GOAL-CRYPTO-001.yaml
        (read in full).
      role: the standing conclusion whose support is being measured
    - description: >-
        Controls-before-belief and the closure standard.
      citation: >-
        docs/inventor-protocol.md sections 3 and 4 -- READ IN FULL. This
        hypothesis is those two sections applied to a screen rather than to a
        statistic, which is an extension the text invites but does not spell out.
      role: the obligation the audit discharges
    - description: >-
        The catalogue of controls that pass without being able to fail, with the
        program's own AES falsified-hint control as its worked instance.
      citation: >-
        KN-TECH-1a5b7e -- NOT READ IN THIS SESSION, RELAYED via this session's
        scouting brief, together with the numbers EV-AES-d33b1c / EV-AES-d8a13e
        are said to carry. Reading it and adopting its obligation list verbatim
        is a step of EXP-CRYPTO-e78afb, not an assumption of this record.
      role: the obligation list the audit's controls must satisfy
    - description: >-
        The unscreened internal reservoir named as forward guidance.
      citation: >-
        inputs/h100_session/ (directory listed in this session: 23 entries
        including HYPOTHESES_100.md and per-hypothesis JSON) and
        ledger/REVIEW-H100-20260717.md (EXISTENCE VERIFIED ONLY -- the file was
        listed, not opened, and its reported content is RELAYED from this
        session's scouting brief).
      role: named successor for the coverage half

  reduction_chain:
    core_problem: >-
      Measure the sensitivity and specificity of GOAL-CRYPTO-001's committed
      discovery-readiness rubric, and size the finite set over which its
      thirteen FINAL_NO_CANDIDATE dispositions quantify.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. There is no reduction from an instrument measurement to
      any mathematical statement, and none is claimed. In particular this
      hypothesis does not bear on whether an admissible ECDLP mechanism exists,
      on any curve, on any prior closure in GOAL-ECDLP-001, or on any KN-OPEN
      entry. A defect in a screen is a fact about the screen.

  predictions:
    - metric: >-
        A1 -- Gate A pass rate on the prime-field-compatible planted positives
        P1, P2, P3, blind
      direction: higher
      minimum_effect: >-
        3 of 3. Derived from the six-field list before any scoring: each has a
        representation, a solve predicate, a prime-field-compatible target
        dependence, a source, a stated magnitude gain over rho on a named class,
        and a distinction from prior CRYPTO routes. ANY FAIL is the primary
        finding and must be localized to the field that produced it.
    - metric: >-
        A2 -- Gate A pass rate on the matched nulls N1, N2, N3, blind, with
        per-field attribution
      direction: lower
      minimum_effect: >-
        0 of 3 PASSES, with attribution to three DISTINCT and pre-assigned
        fields. A 0/3 with the wrong attribution is a partial failure: the screen
        would be rejecting for reasons other than the fields it names, and that
        must be reported rather than counted as a success.
    - metric: >-
        A3 -- Gate B pass rate on P1, P2, P3
      direction: lower
      minimum_effect: >-
        0 of 3, PREDICTED TO FAIL BY DESIGN, with every FAIL attributed to an
        artifact-demanding field. The interpretation is pre-registered in the
        statement and may not be selected after seeing the result.
    - metric: >-
        A4 -- baseline reproduction: agreement between the audit's re-scoring of
        the five committed BATCH-013 entries and their committed verdicts
      direction: different
      minimum_effect: >-
        5 of 5 EXACT agreement, including recorded per-field reasons where
        recorded. Below 5 of 5, the audit is executing a different rubric and NO
        comparison with the thirteen batches is admissible.
    - metric: >-
        A5 -- graded ablation on P2: Gate A verdict with exactly j of six fields
        degraded to the null register, j = 0..6, ordering fixed in advance
      direction: lower
      minimum_effect: >-
        MONOTONE, PASS at j = 0, FAIL at j = 6, no return to PASS once flipped,
        and the flip index reported. Seven interior points. Non-monotonicity
        refutes HEUR-SCR-1.
    - metric: >-
        A6 -- scope separation: whether P4 and P5 (non-prime-field) receive a
        verdict distinguishable from the nulls
      direction: different
      minimum_effect: >-
        DISTINGUISHABLE -- rejected at target_dependence and NOT at
        relation_or_direct_solve_predicate. If they are indistinguishable from
        the nulls, the rubric emits one bit where three meanings live.
    - metric: >-
        A7 -- total distinct records examined by this goal's screen across all
        thirteen batches, from the committed coverage blocks
      direction: different
      minimum_effect: >-
        A STATED INTEGER with per-batch breakdown. NO VALUE IS PREDICTED, because
        twelve of the thirteen batch directories were listed and not opened in
        this session, and guessing the number would be fabrication. The metric
        exists because "FINAL" quantifies over that set and the set has never
        been sized.
    - metric: >-
        A8 -- scorer post-hoc identification rate on the eight blinded items
      direction: lower
      minimum_effect: >-
        Below 0.5 (HEUR-SCR-2). Reported whatever it is; a rate at or above 0.5
        downgrades the sensitivity figure to a rubric-plus-scorer measurement
        and does not suppress it.

  test_boundary:
    instances:
      - >-
        The committed Gate A / Gate B rubric of
        coordination/goals/GOAL-CRYPTO-001/batches/BATCH-013/tasks/TASK-20260731-001/discovery_readiness_screen.yaml,
        plus the analogous screens in the other twelve batch directories once
        opened.
      - >-
        Three planted positives (P1, P2, P3), three matched nulls (N1, N2, N3),
        two scope probes (P4, P5), one seven-point ablation ladder on P2, and
        the five committed BATCH-013 entries as a baseline fixture.
    parameters:
      input_set_size: 8
      ablation_points: 7
      baseline_fixture_size: 5
      scorers: 2
      blinding: "shuffled, proper nouns removed, seeded permutation, key hash-committed"
      arm_order: "nulls scored and committed before positives"
      compute: none
    implementation: >-
      Reading and scoring. NO CODE AND NO DEPENDENCY IS REQUIRED. Environment
      measured this session and recorded because the scouting sweeps disagreed
      about it: python3 3.11.15; numpy 2.4.6 imports; sympy and sage do not.
      None is needed here.
    budget:
      stage0_wall_clock_seconds: 7200
      stage1_wall_clock_seconds: 3600
      stage2_wall_clock_seconds: 3600
      stage3_wall_clock_seconds: 3600
      total_wall_clock_seconds: 18000
      maximum_memory_gb: 1
      compute: "zero"

  falsification_conditions:
    - >-
      F1 (THE GOOD OUTCOME, AND IT REFUTES THIS HYPOTHESIS'S CONCERN) -- all
      three positives PASS Gate A, all three nulls FAIL with correct per-field
      attribution, and the ablation ladder is monotone. The screen is
