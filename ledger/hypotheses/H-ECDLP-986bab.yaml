# =============================================================================
# H-ECDLP-986bab -- SNFS-G4 specified: for a Mersenne prime p = 2^c - 1,
# multiplication by 2 is a bit rotation of F_p, a cost-free Z/c action on
# coordinates, and it induces nothing on E(F_p): a factor base defined by
# rotation classes behaves as a random subset of its density. A control
# arm for IDEA-20261009-443717 (SNFS-A4) and HEUR-002 of H-ECDLP-bd1572.
# Derived from IDEA-20261009-354b14 (addendum G). Status proposed with
# specified_by; nothing here asserts an outcome. Toy primes only.
# =============================================================================
hypothesis:
  id: H-ECDLP-986bab
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  derived_from_idea: IDEA-20261009-354b14
  added: '2026-10-09'
  statement: >-
    Let p = 2^c - 1 be a Mersenne prime, write every x in F_p as its c-bit
    string (x = p is identified with 0), and let rotmin(x) be the least
    integer among the c cyclic rotations of that string. For m in {1, 2, 4}
    let D_rot = {P in E(F_p) : rotmin(x(P)) < 2^(c-m)}. Then for seeded
    random curves E over the toy Mersenne primes 2^13 - 1 .. 2^61 - 1:
    (i) the closure ratio Pr[P + Q in D_rot | P, Q in D_rot] / Pr[P in D_rot]
    is 1 within max(0.03, 3 SE); (ii) the decomposition ratio Pr[R - P in
    D_rot | P in D_rot] / Pr[P in D_rot] for random targets R is 1 within
    max(0.05, 3 SE); (iii) both
    ratios equal those of a keyed-hash subset of the same density and of a
    size-based subset of the same density over a matched random prime, within
    sampling error. No gain at any (c, m).
  mechanism: >-
    F_p = Z[x]/(x^c - 1, p) with x -> 2, so multiplication by 2 permutes the
    bits of the c-bit representation cyclically and rotmin is a canonical
    label of the <2>-orbit of x, computable in O(c). The scaling
    (x, y) -> (2x, 2^{3/2} y) (2 is a square for odd c since 2 =
    (2^{(c+1)/2})^2) maps E_{a,b} to the isomorphic E_{4a,8b}, and the
    isomorphism back is the inverse scaling, so the orbit structure composes
    to the identity on E and respects nothing of the group law: this is
    HEUR-002 of H-ECDLP-bd1572 (no second structure that sees the form of p)
    in its most concrete form. A rotation-class factor base is therefore a
    cheaply decidable subset with no closure, exactly like the digit-graded
    base of SNFS-A4 and the size-based bases that KR-IC-5931ee forecloses.
  assumptions:
    - "rotmin is a canonical orbit label (true: the orbit of x under multiplication by 2 is the set of rotations, because 2^c = 1 in F_p)."
    - "Membership in D_rot for curve points has the same density as for field elements up to the Legendre-symbol factor, which the point-sampling estimator absorbs."
    - "Toy curves and primes only; the closure statistic is scale-free and nothing is extrapolated."
  proof_search_map:
    not_applicable_reason: >-
      A control measurement of a subset's closure under the group law; no
      exponent is claimed or targeted. The expected outcome is the null and
      the record cannot be promoted beyond a receipt.
    bottleneck: not_applicable
    baseline_embedding:
