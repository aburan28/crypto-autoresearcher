    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        For seeded random E/F_p with p Mersenne and any m in {1, 2, 4},
        the events {P in D_rot}, {Q in D_rot}, {P + Q in D_rot} are pairwise
        independent for uniformly random P, Q in E(F_p): Pr[P + Q in D_rot |
        P, Q in D_rot] = Pr[P in D_rot] up to O(p^{-1/2}).
      random_model_justification: >-
        x(P + Q) is a rational function of (x(P), y(P), x(Q), y(Q)) of
        degree 2 that does not commute with the rotation action; a subset
        of F_p invariant under an action that the group law ignores behaves
        as a random subset for the group law (HEUR-002 of H-ECDLP-bd1572).
      supporting_results:
        - KR-IC-5931ee (size-type factor bases over F_p cannot beat generic methods)
        - H-ECDLP-bd1572 HEUR-002 (no second structure on E(F_p) that sees the form of p)
      validation_experiment_ids: [EXP-ECDLP-ad27ad]
      falsification_condition: >-
        A closure ratio farther than max(0.03, 3 SE) from 1, or a
        decomposition ratio farther than max(0.05, 3 SE) from 1, at some
        (c, m, curve) with the keyed-hash control inside its band and the
        exhaustive cross-check at c <= 17 agreeing with the sampler.
  structural_ingredients:
