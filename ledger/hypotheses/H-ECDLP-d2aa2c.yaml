hypothesis:
  id: H-ECDLP-d2aa2c
  question_id: RQ-ECDLP-002
  title: >-
    The measured departure of a KNOWN-UNIFORM arm from the Dickman reference in
    EXP-LPF-001 is a property of the REFERENCE and not of the sampler, and the
    committed driver already names the first candidate defect out loud: the
    uniform arm is drawn on [1, p**2] while u is defined as ln(D)/ln(Bsm) with
    D = 2**(2*bits) > p**2, so the incumbent reference is evaluated at the wrong
    argument before any finite-y analysis is reached
  statement: >-
    Source proposal IDEA-20260802-001 (RQ-ECDLP-002, class measurement). THE
    SOURCE PROPOSAL IS NOT EDITED BY THIS RECORD and remains `proposed`.

    (A) WHAT IS BEING REPAIRED, AND WHY IT IS WORTH A CONTRACT. Every
    conditional cost statement the Gaudry-Semaev lane of this program can make
    is an instance of the target profile's per-attempt-cost times
    inverse-success-probability bookkeeping, and in that bookkeeping the inverse
    success probability IS the smoothness reference. EXP-LPF-001 uses the
    asymptotic Dickman rho(u) as its sole absolute reference. A known-uniform
    calibration arm departs from it by a ratio that GROWS ALONG THE u LADDER,
    which is the same axis a factor-base optimisation runs on. This hypothesis
    concerns the reference layer only. IT MOVES NO EXPONENT, MAKES NO STATEMENT
    ABOUT THE SEMAEV MAP IN EITHER DIRECTION, AND DOES NOT READ, RE-READ OR
    RE-SCORE THE REAL ARM OF EXP-LPF-001.

    (B) A DEFECT CANDIDATE THE SOURCE PROPOSAL LISTED AS A CONFOUNDER, NOW READ
    OUT OF THE COMMITTED IMPLEMENTATION RATHER THAN ASSUMED. The proposal's
    first confounder says the matched-range question "MUST be read out of the
    archived manifest before the comparison, not assumed". This coordinator read
    it out of experiments/EXP-LPF-001/implementation/lpf001_driver.py. Two facts,
    both verbatim from that committed file:
      CalibrationCell docstring: "range_matching_note: samples are drawn on
      [1, p**2], NOT on [1, D], so the calibration and (later) the real arm
      share an exactly matched range. D is retained only as the frozen bound
      that defines u."
      stat_rate_u: "u = lnD / math.log(bsm)".
    So the sample lives on [1, X] with X = p**2, while the reference is
    evaluated at u_D = ln(D)/ln(Bsm). At the bits-16 cell the archived
    descriptor records X = 2177435569, D = 4294967296 and X_over_D =
    0.5069737250450999, so ln(X)/ln(D) is strictly below 1 and u_D
    OVERSTATES the u that describes the sample. Because rho is steeply
    decreasing, an overstated u UNDERSTATES the reference and INFLATES R(u), in
    the direction and with the u-growth actually observed. THIS IS A
    DEFINITIONAL MISMATCH, NOT YET A MEASUREMENT: whether it accounts for the
    whole departure, part of it, or none of it is exactly what EXP-ECDLP-a1c262
    decides, and it is the cheapest arm in that contract.

    (C) THE ARBITER IS AN EXACT COUNT, NOT AN ESTIMATE, AND THAT IS THE WHOLE
    DESIGN. Three of the four references under test are approximations
    (asymptotic-at-u_D, asymptotic-at-u_X, saddle-point). At the bits-16 cell X
    = 2177435569 is small enough that Psi(X, Bsm) is computable EXACTLY by a
    segmented largest-prime-factor sieve over [1, X], so an absolute reference
    that is a theorem rather than an approximation exists at that cell. Every
    ranking among references is decided against REF-EXACT and never among the
    approximations themselves. This matters for a second reason: the
    Hildebrand-Tenenbaum saddle-point formula is known to this program only as a
    RECALLED citation that no agent here has opened, so under AGENTS.md rule 9 it
    may not back a decision. Making REF-EXACT the arbiter is what lets the
    contract proceed without relying on an unread source.

    (D) THE THREE OUTCOMES THE DESIGN DISCRIMINATES.
    (a) REFERENCE EFFECT. Some declared reference brings the archived uniform
    arm to R = 1 within its own sampling error at every bits-16 rung. Then the
    departure is a reference defect, the frozen [1/8, 8] constant-factor band was
    being applied against a reference a correct null could not satisfy at the
    top rung, and the corrected reference is carried into successor contracts by
    a superseding record and never by an edit.
    (b) SAMPLER OR APPARATUS EFFECT. No declared reference, including the exact
    count, brings the arm to 1. Then the departure is not a reference effect and
    the uniform sampler, the trial-division factorizer, or the u-parameterisation
    is implicated. THIS IS THE STRONGER AND MORE EXPENSIVE OUTCOME: it puts a
    question mark over the null arm of every LPF reading, and it is a positive
    finding about the apparatus rather than a null result.
    (c) PARTIAL. Absorbed at low u, residual at high u, or the reverse. The
    decidable-rung set is reported as measured and the residual is a named open
    item, not a result.
  mechanism: >-
    Two independent error sources are conflated in the incumbent reference and
    the design separates them.
    FIRST, ARGUMENT ERROR. rho is being evaluated at u_D = ln(D)/ln(Bsm) for a
    sample drawn on [1, X] with X < D. The reference that describes that sample
    is rho(u_X) with u_X = ln(X)/ln(Bsm) = u_D * ln(X)/ln(D). Since rho is
    strictly decreasing and log-convex, and ln(X)/ln(D) < 1, the incumbent
    reference is uniformly too small, by a factor that grows with u because
    |d ln rho / du| grows with u. That reproduces the qualitative signature of
    the archived arrays without any finite-y analysis at all.
    SECOND, FINITE-y ERROR. Even at the correct argument, rho is an asymptotic.
    Hildebrand's theorem is recalled in the source proposal as
    Psi(x,y) = x*rho(u)*(1 + O(log(u+1)/log y)) on log x < y <= x**(1/3). At the
    bits-16 top rung Bsm = 40, so log y is about 3.7 and log(u+1)/log y is of
    order one-half: the asymptotic is being used where its own stated error term
    is of order unity. The saddle-point estimate is the standard replacement
    because it evaluates the Dirichlet-series saddle at the actual y instead of
    passing to the u -> infinity limit.
    The mechanism claim is that these two sources, in that order, account for the
    archived departure, and that the exact count at bits 16 decides it. Nothing
    in this mechanism touches the encoding, the Semaev map, or the real arm; a
    departure caused by the ENCODING producing non-uniform integers is invisible
    to this design by construction and is stated as such.
  assumptions:
    - >-
      The archived RUN-LPF-001-calib arrays are what they are recorded to be.
      This hypothesis READS them and re-derives from them; it does not re-run the
      calibration, does not redraw the uniform arm, and does not edit any
      EXP-LPF-001 artifact. Redrawing would confound a reference question with a
      sampling question.
    - >-
      At the bits-16 cell, X = 2177435569 is small enough that the exact count
      Psi(X, Bsm) is reachable by one segmented largest-prime-factor sieve over
      [1, X] within the declared budget. This is checkable BEFORE any
      interpretation and its failure is a scope reduction, not a result.
    - >-
      At the bits-20 cell X = p**2 is of order 2**40 and a full sieve is NOT
      reachable on this host. Exactness there is available only at rungs whose
      smooth-count is small enough to enumerate directly, and the contract
      declares that per-rung rather than assuming it. Where no exact reference
      exists, branch (b) is UNDETECTABLE at that cell and the contract says so.
    - >-
      No live keys, no discrete logarithm, no curve arithmetic, and no new
      sampling of any kind.
  proof_search_map:
    bottleneck: >-
      The absolute reference itself. Every conditional cost statement in this
      lane multiplies by an inverse smoothness probability, and every threshold
      in EXP-LPF-001 is an inequality whose right-hand side is that reference. If
      the reference is wrong by a u-dependent factor, the argmin over the factor
      base bound is computed against the wrong curve and no exponent read off it
      is meaningful. The bottleneck is the right-hand side, not the arm.
    baseline_embedding:
      parameter_slice: >-
        The bits-16 u_target = 2 rung, where Bsm = 65536 and y is essentially
        x**(1/2): the regime where every candidate reference is expected to
        agree, because Hildebrand's error term log(u+1)/log y is about
        log(3)/log(65536) = 0.099 there.
      reproduction_check: >-
        FROZEN REGRESSION FIXTURE, ZERO COMPUTE. The archived R values must be
        re-derived from the archived arrays before any new reference is built:
        R(u) = mean_over_200_replicates(p_hat_u) / rho(u_archived). THIS
        COORDINATOR PERFORMED THAT ARITHMETIC BY HAND ON THE COMMITTED NUMBERS,
        RECORDS IT AS A PRIOR RATHER THAN AS DATA, AND REQUIRES IT REDONE. Using
        the archived LPF_null_spread means and the archived
        dickman_reference_reproduction rho values at INTEGER u, the bits-16
        ratios come out 1.17019, 1.45257, 2.05206, 4.49543, 11.15351. The source
        proposal quotes 1.1702, 1.4522, 2.0521, 4.5709, 11.5937. The first three
        agree; the last two DO NOT, and they reconcile only when rho is evaluated
        at the ARCHIVED non-integer u (5.006009 and 6.012858) rather than at the
        integer target, which is what the driver's own u_star_formula does. The
        contract therefore treats the proposal's quoted figures as a CLAIM TO BE
        RE-DERIVED, not as data, and a failure to reproduce them within 1 per
        cent voids the "figure to beat".
    observation_collision:
      observable: >-
        R(u) = p_hat(u) / reference(u), the ratio of a measured smoothness rate
        to a chosen reference.
      distinct_preimage_search: >-
        COLLISION FOUND AND IT IS WHY A NULL REFERENCE IS CARRIED. R(u) is a
        ratio with a free denominator, so ANY monotone reparameterisation
        u -> c*u with c < 1 raises the reference and lowers R at every rung.
        Agreement of some reference with the data therefore does NOT identify
        that reference as correct; a reference with a fitted knob will agree too.
        The additional condition that separates them is agreement with an
        EXACTLY COMPUTED count, which has no knob. This is exactly what the
        null reference REF-SHIFT in the contract tests, and if REF-SHIFT
        survives the arbitration then the design has no power to tell a
        principled correction from a fit and nothing may be concluded.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the asymptotic reference rho(ln(D)/ln(Bsm)) by the exact
          density Psi(X, Bsm)/X computed over the SAME range the sample is drawn
          from.
        predicted_gain: >-
          Removes both the argument error and the finite-y error at once at the
          bits-16 cell, and turns a reference comparison into a theorem
          comparison. Gains nothing at bits 20, where it is not computable, and
          that asymmetry is declared.
      - transform: boundary_lift
        proposed_object: >-
          The Hildebrand-Tenenbaum saddle-point density as the reference for
          cells where the exact count is out of reach.
        predicted_gain: >-
          A reference whose error does not blow up as y falls, hence usable at
          bits 20 and at any successor cell. CONDITIONAL: its source is a
          RECALLED citation no agent here has opened, so it is validated against
          REF-EXACT at bits 16 before it is used anywhere, and it is never the
          arbiter.
    quantifier_order: >-
      FOR the two archived cells (bits 16, bits 20), FOR the five archived rungs
      per cell, and FOR THE ARCHIVED UNIFORM ARM ONLY, THERE EXISTS a reference
      among the four declared ones under which R(u) lies within the arm's own
      sampling error of 1 at every rung. The existential is over a CLOSED,
      PRE-DECLARED set of four references fixed before any computation; it is
      NOT an existential over all functions, which would be vacuous. The
      quantifier does NOT range over the real arm, over other encodings, over
      other curve instances, or over any cell not archived.
    method_ceiling:
      strongest_certifiable_claim: >-
        That at the two archived cells and five archived rungs, the archived
        uniform arm's smoothness rate agrees with (or departs from) an exactly
        computed smooth-number density by a stated factor with stated error
        bars, and that a named reference among four reproduces that density to a
        stated tolerance at bits 16. IT CAN NEVER CERTIFY: anything about the
        real arm, anything about the Semaev map, anything at cryptographic D,
        anything about an encoding's uniformity, or that a repaired reference
        changes any cost exponent. REPAIRING A REFERENCE IS NOT AN ATTACK.
      nearby_object_control: >-
        The archived OBJ-CTRL-PRODUCT arm, whose objects are products of two
        integers below p and are DERIVABLY smoother than uniform integers below
        p**2. Under any correct reference its R must be substantially above 1
        and must not be flattened to 1. If the repaired reference reports the
        product arm as uniform, the reference or the recomputation pipeline is
        broken and no rung is read.
    proof_obligations:
      - claim: >-
          The archived uniform arm is drawn on [1, p**2] while u is computed
          from D = 2**(2*bits).
        responsibility: baseline
      - claim: >-
          The archived R values re-derive from the archived arrays at the
          archived non-integer u.
        responsibility: correctness
      - claim: >-
          Psi(X, Bsm) is computed exactly at bits 16 by an independent method
          and agrees with a second independent method at one rung.
        responsibility: correctness
      - claim: >-
          The saddle-point estimator reproduces the exact count at bits 16
          within the declared tolerance.
        responsibility: strictness
      - claim: >-
          A knobbed null reference does NOT survive the same arbitration.
        responsibility: strictness
      - claim: >-
          The sieve and enumeration fit the declared memory and wall-clock
          budget on this host.
        responsibility: runtime
      - claim: >-
          Nothing here transfers to the real arm, to other encodings, or to
          cryptographic D.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: null
    prior_best: null
    time_exponent: null
    memory_exponent: null
    hidden_cofactor: null
    claim_kind: null
  heuristic_assumptions:
    - id: HEUR-SPREF-1
      formal_statement: >-
        For x = X = p**2 and y = Bsm over the ten archived (cell, rung) pairs of
        EXP-LPF-001, the Hildebrand-Tenenbaum saddle-point estimate of Psi(x, y),
        with alpha = alpha(x, y) the unique positive solution of
        sum_{p <= y} log p / (p**alpha - 1) = log x, approximates Psi(x, y) to
        within a relative error below 0.05, uniformly over those ten pairs.
      random_model_justification: >-
        Not a random-model heuristic in the Wesolowski sense: the quantity is a
        deterministic counting function and the heuristic is an ACCURACY claim
        about a named estimator in a named parameter range, not a claim that
        some object behaves like a random one. It is recorded as a heuristic
        because this program has not read the primary source that states the
        estimator's error term and therefore cannot assert its uniformity range.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-a1c262]
      falsification_condition: >-
        REF-SP disagrees with REF-EXACT by more than 5 per cent at any bits-16
        rung. That is a decidable comparison of one computed number against
        another computed number and it kills the heuristic at the tested
        parameters outright. NOTE: supporting_results is EMPTY on purpose. The
        Hildebrand and Hildebrand-Tenenbaum statements are RECALLED citations
        that no agent in this program has opened, so under AGENTS.md rule 9 they
        may not discharge this heuristic. That is precisely why REF-EXACT and
        not REF-SP is the arbiter of the contract.
    - id: HEUR-SPREF-2
      formal_statement: >-
        The archived RUN-LPF-001-calib uniform arm is, to within its recorded
        200-replicate sampling error, a sample of integers drawn uniformly from
        [1, p**2] and correctly factorised by the archived trial-division table.
      random_model_justification: >-
        The driver documents the sampler as numpy integers(1, X+1) and records
        the trial-division prime table with its sha256 and its bound. The model
        is therefore the declared implementation, and the heuristic is that the
        implementation does what it declares.
      supporting_results:
        - >-
          The archived apparatus_identity_report compares OBJ-NULL-UNIF against
          OBJ-NULL-SYNTH, which the driver states is the SAME DISTRIBUTION by
          derivation because ENC-B is a bijection from [0,p) x [0,p) onto
          [1, p**2]. Agreement there is an implementation check and was declared
          in advance never to count as corroboration of anything else.
      validation_experiment_ids: [EXP-ECDLP-a1c262]
      falsification_condition: >-
        R_exact(u) at bits 16 falls outside the arm's own sampling-error window
        about 1 at any rung, under an exact count computed over [1, X]. Refuting
        this heuristic is branch (b) and is the most valuable outcome the design
        admits, because it blocks every LPF reading until localised.
  structural_ingredients:
    - description: >-
        Hildebrand's uniform asymptotic Psi(x,y) = x*rho(u)*(1 + O(log(u+1)/log y))
        for log x < y <= x**(1/3), supplying the ERROR SCALE of the incumbent
        reference.
      citation: Hildebrand (1986), on the number of positive integers <= x free of prime factors > y
      provenance: recalled
      verified_by: null
      role: error scale of the asymptotic reference
    - description: >-
        The Hildebrand-Tenenbaum saddle-point method for Psi(x,y) with alpha
        defined by sum_{p <= y} log p / (p**alpha - 1) = log x, supplying the
        replacement estimator.
      citation: Hildebrand and Tenenbaum (1986), on integers free of large prime factors
      provenance: recalled
      verified_by: null
      role: replacement reference estimator, NOT the arbiter
    - description: >-
        The committed EXP-LPF-001 driver's declared sampling range and
        u-parameterisation, which are the object of the argument-error half of
        the mechanism.
      citation: experiments/EXP-LPF-001/implementation/lpf001_driver.py
      provenance: internal
      verified_by: >-
        coordinator, this design session, read CalibrationCell.__init__,
        CalibrationCell.draw_uniform, CalibrationCell.descriptor and stat_rate_u
        in the committed file and quoted the range_matching_note docstring and
        the line u = lnD / math.log(bsm) verbatim
    - description: >-
        The archived bits-16 descriptor values p = 46663, X = 2177435569,
        D = 4294967296, X_over_D = 0.5069737250450999, n_per_sample_set = 130816,
        200 calibration replicates, and the archived per-statistic means and
        standard deviations.
      citation: experiments/EXP-LPF-001/results/calib/null_replicate_statistics.json
      provenance: internal
      verified_by: >-
        coordinator, this design session, read the per_cell["16"] descriptor and
        LPF_null_spread blocks of the committed file
    - description: >-
        The archived driver-computed rho values at integer u, reproduced to
        worst relative discrepancy 1.5441749690432644e-05 by the driver's own
        independent frozen table.
      citation: experiments/EXP-LPF-001/results/calib/dickman_reference_reproduction.json
      provenance: internal
      verified_by: >-
        coordinator, this design session, read the committed file in full
    - description: >-
        The frozen smoothness ladders BSM_LADDER = {16: [(2,65536),(3,1626),
        (4,256),(5,84),(6,40)], 20: [(2,1048576),(3,10321),(4,1024),(5,256),
        (6,102)]} and D_BY_BITS = {16: 2**32, 20: 2**40}.
      citation: experiments/EXP-LPF-001/implementation/lpf001_driver.py
      provenance: internal
      verified_by: >-
        coordinator, this design session, read the committed constants block
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: archived_R_rederivation_agreement
      direction: different
      minimum_effect: >-
        The archived R(u) values must re-derive from the archived arrays, at the
        ARCHIVED non-integer u, to within 1 per cent of the source proposal's
        quoted 1.1702, 1.4522, 2.0521, 4.5709, 11.5937 (bits 16) and 1.1279,
        1.3055, 1.6443, 2.4453, 5.0386 (bits 20). This coordinator's hand
        arithmetic reproduces the first three bits-16 values at INTEGER u but
        NOT the last two, so the check is live and can fail. A failure means the
        "figure to beat" in every downstream statement is wrong and the contract
        reports that instead of a reference verdict.
    - metric: exact_reference_residual_bits16
      direction: same
      minimum_effect: >-
        THE ABSOLUTE DISCRIMINATOR. Under REF-EXACT at bits 16, R_exact(u) must
        lie within four times the archived arm's own relative standard error of
        1 at every rung u in the five-rung ladder, where the standard error is
        computed from the archived 200-replicate spread as sd/(sqrt(200)*mean).
        The proposal's looser [0.90, 1.11] window is reported alongside as a
        secondary. This is a point prediction against a reference that is a
        theorem, not an approximation, and at the top rung the archived arm
        resolves a 10 per cent deviation at many standard errors, so it can fail.
    - metric: reference_selection_by_exact_arbitration
      direction: different
      minimum_effect: >-
        Exactly one of REF-ASY-D, REF-ASY-X, REF-SP is selected as agreeing with
        REF-EXACT at every bits-16 rung within 5 per cent, or none is. The NULL
        reference REF-SHIFT must NOT be selected. If REF-SHIFT is selected, or
        if it agrees as well as the selected one, the arbitration has no power
        to separate a principled correction from a fitted knob and no reference
        verdict is issued.
    - metric: max_rung_absolute_log_ratio_per_reference
      direction: lower
      minimum_effect: >-
        Reported per reference per cell as max_u |ln R(u)|. The source
        proposal's pre-registered target is max_u |ln R_sp(u)| <= 0.82 at both
        cells against archived asymptotic figures 2.4506 (bits 16) and 1.6171
        (bits 20), i.e. a reduction by a factor of at least 3. Retained verbatim
        as a pre-registered secondary criterion; a reduction smaller than a
        factor of 3 at either cell fails it. It is a SECONDARY criterion because
        the primary decision is arbitration against REF-EXACT, which the source
        proposal did not have available at the argument-error level.
    - metric: limb_b_decidable_rung_count
      direction: higher
      minimum_effect: >-
        Count of rungs whose uniform-arm R(u) lies inside the frozen [1/8, 8]
        constant-factor band, reported per reference. Archived incumbent is 9 of
        10. Reported as measured under each reference; no threshold on this
        metric decides anything by itself, because a band that a correct null
        cannot satisfy is precisely the defect under investigation and moving
        rungs into it is a consequence, not a criterion.
    - metric: post_correction_residual_monotonicity_in_u
      direction: different
      minimum_effect: >-
        THE ARTIFACT TELL. A reference error must grow with u at fixed x,
        because both the argument error and the Hildebrand error term grow with
        u. The archived R_rho values already grow strictly with u, so the
        statistic is demonstrably responsive before the experiment runs. If the
        residual AFTER a correction is NON-monotone in u, that residual is not a
        reference effect regardless of its magnitude, and branch (b) or (c) is
        indicated.
    - metric: product_arm_reference_sanity
      direction: higher
      minimum_effect: >-
        Under every declared reference, the archived OBJ-CTRL-PRODUCT arm's R
        must exceed the uniform arm's R at every rung and must exceed 1. Its
        excess smoothness is derivable, so a reference or pipeline that reports
        it as uniform is broken and voids the run.
  test_boundary:
    instances:
      - >-
        The ARCHIVED RUN-LPF-001-calib uniform arm (OBJ-NULL-UNIF), 200
        replicates of 130816 samples, at the bits-16 and bits-20 cells. Read
        only; never redrawn.
      - >-
        The ARCHIVED OBJ-CTRL-PRODUCT arm at the same cells, used only as a
        derivable-sign sanity control on the references.
      - >-
        The ARCHIVED OBJ-NULL-SYNTH arm, used only as an implementation-identity
        check that the driver itself declared can never count as corroboration.
    parameters:
      cells: [16, 20]
      p_bits16: 46663
      X_bits16: 2177435569
      D_bits16: 4294967296
      D_bits20: 1099511627776
      bsm_ladder_bits16: [65536, 1626, 256, 84, 40]
      bsm_ladder_bits20: [1048576, 10321, 1024, 256, 102]
      references: [REF-ASY-D, REF-ASY-X, REF-SP, REF-EXACT, REF-SHIFT]
      replicates_archived: 200
      samples_per_replicate: 130816
    implementation: >-
      Pure computation over archived arrays. Exact integer arithmetic and
      declared floating-point precision for rho and the saddle solve. No curve
      arithmetic, no discrete logarithm, no new sampling, no edit to any
      EXP-LPF-001 artifact.
    budget:
      wall_clock_seconds: 5400
      memory_gb: 4
      maximum_runs: 6
  falsification_conditions:
    - >-
      F0 - the archived R values do not re-derive from the archived arrays
      within 1 per cent at the archived u. The quoted departure figures are
      wrong and no reference verdict is issued; the contract reports the
      re-derived figures and stops. This condition did not exist in the source
      proposal and is added because this coordinator's hand arithmetic failed to
      reproduce two of the five bits-16 figures at integer u.
    - >-
      F1 - no declared reference brings R_exact-comparable agreement, i.e. the
      best reference still leaves max_u |ln R(u)| above 0.82 at either cell. The
      departure is not explained as a reference effect and the sampler or the
      specification is implicated. Branch (b). A POSITIVE finding about the
      apparatus, reported as such and never as a null result.
    - >-
      F2 - REF-EXACT at bits 16 puts the archived uniform arm outside four
      relative standard errors of 1 at any rung. The archived uniform arm is not
      behaving as a uniform sample of its stated range against a reference that
      is a theorem. Strongest instrument finding the design admits; it blocks
      every LPF reading until localised, and it refutes HEUR-SPREF-2.
    - >-
      F3 - REF-SP and REF-EXACT disagree by more than 5 per cent at any bits-16
      rung. HEUR-SPREF-1 is refuted at the tested parameters, REF-SP may not be
      used at bits 20 or anywhere else, and the bits-20 cell is reported as
      having NO usable reference rather than being given one.
    - >-
      F4 - the null reference REF-SHIFT agrees with REF-EXACT as well as the
      best principled reference. The arbitration cannot separate a correction
      from a fit; the exercise is void as a reference-selection instrument and
      only the exact densities themselves are reported.
    - >-
