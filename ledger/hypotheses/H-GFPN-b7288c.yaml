    and the written ceiling 60 is 1/2 below 121/2. The mean-ratio band
    1 plus or minus 1/20 runs from 19/20 to 21/20. The calibration
    ends 2 to the 36 and 2 to the 40 are 68719476736 and
    1099511627776, and their ratio is 16.
