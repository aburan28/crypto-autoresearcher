        unsound at this cell.
      random_model_justification: >-
        RIGOROUS: a77711 Lemmas A1/A2 (equivariance between conjugate
        instances; disjointness of solution sets). HEURISTIC content is
        NONE for the null itself — it is a theorem under test by
        exhaustive census. Sampling of R is uniform in the prime-order
        subgroup for coverage only.
      supporting_results:
        - ref: IDEA-20260906-a77711
          provenance: internal
          claim: >-
            Lemma A1 (squaring maps I_R solutions to I_{sigma(R)});
            Lemma A2 (disjoint solution sets for R vs sigma(R) when
            sigma(R) != +-R)
          verified_by: >-
