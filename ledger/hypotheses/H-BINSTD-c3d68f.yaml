            {13,17,19,23}: conflict ratio in [1.00,1.47], never below 1
          verified_by: >-
            HOLD-S review citation; coordinator did not re-open the
            finding body this session (pointer retained; provenance
            noted unverified in review)
        - ref: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-2a3771.yaml
          provenance: internal
          claim: >-
            HOLD-S concrete_experiment predicts closure_fraction=0,
            conjugate_overlap=0, equivariance_agreement=1
          verified_by: coordinator, this design session (Read, full review)
      validation_experiment_ids:
