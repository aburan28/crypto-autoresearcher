  title: >-
    HOLD-S: fixed-target tau-orbit CNF clauses are unsound (a77711 A1/A2);
    K-163 tau-stable V lattice empty; toy soundness census at n=17 m=2
    with null ratio~1 (KN-FIND-47da4e); H2 membership orbit-collapse is
    true-by-construction and preprocessing-only — no exponent claim

  statement: >-
    SETTING. Binary Koblitz curves y^2+xy=x^3+a x^2+b with a,b in F_2 over
    F_{2^n}. Notation FIXED (HOLD-S): n = extension degree (= |<tau>|);
    m = Semaev arity. Source IDEA mixed these; this restatement does not.

    HOLD-S CORRECTED PART (H1) — SOUNDNESS, NOT A PER-ATTEMPT EXPONENT
    GAIN. The source IDEA proposed adding explicit tau-orbit-equivalence
    clauses to ONE fixed-target PDP CNF so the solver ranges over |V|/n
    orbit classes. That is UNSOUND: IDEA-20260906-a77711 Lemma A1 says
    coordinate squaring maps a solution of I_R to a solution of
    I_{sigma(R)}, a DIFFERENT instance; Lemma A2 says for R in the
    prime-order subgroup with sigma(R) != +-R the solution sets V(I_R)
    and V(I_{sigma R}) are disjoint. Hence an orbit-equivalence /
    canonical-representative clause set on one instance drops solutions.
    The ONLY sound form is the orbit system over the n conjugate targets,
    whose leaf count is n*2^{m l}/(m!*n) = 2^{m l}/m!: no per-instance
    gain, only the n-relations-per-solve DIMENSION gain a77711 already
    prices. KN-FIND-47da4e measured the sound orbit-system parameterisation
    at m=2, n in {13,17,19,23} with conflict ratio in [1.00, 1.47], never
    below 1. Pre-registered null for this hypothesis: closure_fraction = 0
    and conjugate_overlap = 0 with equivariance_agreement = 1 on a
    tau-stable V (confirming A1/A2); conflict/leaf ratio ~1 under any
    sound orbit-system encoding (47da4e prior).

    HOLD-S CORRECTED PART (LATTICE) — K-163 HAS NO LANE. ord_163(2)=162
    (review-computed), so Phi_163 is irreducible over F_2 and tau-stable
    subspaces of F_{2^163} have dimensions {0,1,162,163} only
    (IDEA-20260915-8fe0ef: "n=163 (d=162) has no lane at all"). Every
    deployed-row statement that presupposes a mid-dimension tau-stable V
    on K-163 is structurally empty. Stable-subspace lattice (from 8fe0ef /
    HOLD-S): 163: none mid; 233: 29k; 283: 94k; 409: 204k; 571: 114k
    (plus 0/1). Toy degrees with mid lanes: {17 (8k), 23 (11k), 31 (5k
    or 10), 41 (20k)}; degrees 29 and 37 are EMPTY (ord_29(2)=28,
    ord_37(2)=36) and MUST NOT appear as measurement cells.

    HOLD-S CORRECTED PART (H2) — TRUE BY CONSTRUCTION, PREPROCESSING-ONLY.
    On a tau-stable V the E-membership indicator is constant on tau-orbits
    (rigorous: Tr(u^2)=Tr(u); review re-derivation holds). The saving is a
    factor-n on a ONE-TIME membership count costing O(|V|*n) bit ops —
    invisible against 2^{n - m l} decomposition attempts at any scale.
    Polynomial-to-normal basis conversion is O(n^2) bit ops once (or once
    for the matrix) — a rounding error, charged in one line and DROPPED
    from the title/priority argument. On ECC2K-130 the challenge is already
    in a type-II ONB (KN-LIT-661e97), so access cost is zero there.

    WHAT THIS HYPOTHESIS ASSERTS (AND DOES NOT). It asserts that the
    HOLD-S soundness census at the frozen n=17 m=2 cell will confirm
    a77711 A1/A2 (negative for the source IDEA's H1 as written) and that
    H2 count agreement holds exactly. It asserts NO exponent movement,
    NO K-163 security claim, and NO revival of fixed-target orbit clauses.

  statement_note: >-
    IDEA-20260922-2a3771 claim text is immutable and left at status
    proposed. Review verdict defective (HOLD-S return_for_revision).
    Defects absorbed into this restatement: (1) H1 restated as conjugate
    orbit-system soundness check with a77711 + KN-FIND-47da4e null;
    (2) stable-subspace lattice with K-163 marked empty; (3) toy cells
    restricted to n in {17,23,31,41} with admissible dims; (4) basis-
    conversion charged once and dropped from title/priority; (5) notation
    n=degree, m=arity throughout; (6) dominated_by rows for a77711 and
    47da4e. No exponent claim; no deployed break.

  mechanism: >-
    OBJECT FRAME. Representation R1 (x-coordinates / CNF encoding of PDP).
    Corrected H1 is NOT a new tracked object and NOT a solver-engineering
    speedup claim: it is a SOUNDNESS control on whether the solution set
    of one fixed target is closed under coordinate squaring (source claim)
    versus mapped into the conjugate instance (a77711). Operation set for
    the equivariance check: Sigma = <tau> acting across conjugate targets,
    not as a symmetry of one instance. H2 is a COORDINATE-DEPENDENT
    (Class III) preprocessing identity on tau-stable V — true by
    construction once V is tau-stable. DECLARED COMPONENT: F2 (factor-base
    decomposition / membership). WHAT IS ADDED: HOLD-S-corrected soundness
    census with pre-registered null ratio~1, explicit empty lattice on
    K-163, and charged-once conversion note. No new factor base
    (KN-OPEN-020 N/A). No merge into H-FROB-a5bf86 / EXP-FROB-30006a in
    this packet — that merge is named as a successor seam only.

  assumptions:
    - >-
      Notation: n = field degree; m = Semaev arity; l = factor-base
      dimension (window dimension). Never overload m as |<tau>|.
    - >-
      K-163 hosts no mid-dimension tau-stable V; no Stage may request a
      ker g(tau) factor base on n=163.
    - >-
      Toy measurement cells are restricted to n in {17,23,31,41};
      n in {29,37} are forbidden (empty lattice).
    - >-
      Fixed-target orbit-equivalence clauses are presumed UNSOUND pending
      Stage 1 falsification of A2 (a single closed S(R) would revive H1
      and require review-breakthrough).
    - >-
      H2 orbit-collapse saving is preprocessing-only and cannot move the
      product-law floor (relations x targets x oracle = m*2^n independent
      of dim V).
    - >-
      Basis-conversion cost is O(n^2) once; charged explicitly; never used
      as a priority or title argument.
    - >-
      No scientific run at deployed n >= 131; ECC2K-130 / K-163 appear only
      as structural lattice notes.

  proof_search_map:
    bottleneck: >-
      Whether the source IDEA's fixed-target orbit-clause H1 survives
      a77711 Lemmas A1/A2 at a tau-stable toy cell, or whether the
      pre-registered null (closure_fraction=0, conjugate_overlap=0,
      equivariance_agreement=1, sound-system ratio~1) holds.
    baseline_embedding:
      parameter_slice: >-
        Unaided exhaustive m=2 enumeration on tau-stable V at n=17
        (RC-1 field), matching IDEA-20260915-8fe0ef's n=17 cell; no
        orbit clauses added to any CNF in Stage 1 (soundness census is
        group-arithmetic, not WDSat).
      reproduction_check: >-
        Stage 0: re-derive ord_n(2) for n in {17,23,29,31,37,41,163}
        and write the stable-subspace lattice; confirm 29,37,163 empty
        mid-lanes. Stage 1: verify tau-stability of ker g(tau) by direct
        squaring of a basis before any census.
    observation_collision:
      observable: >-
        closure_fraction (fraction of R with S(R) closed under coordinate
        squaring); conjugate_overlap; equivariance_agreement; h2_count
        agreement on |x(E) ∩ V|.
      distinct_preimage_search: >-
        equivariance_agreement < 1 on a claimed tau-stable V admits (i)
        V not actually tau-stable / wrong g|Phi_n, (ii) enumeration bug —
        both are instrument defects, not H1 findings. closure_fraction
        near 1 admits (i) genuine A2 failure (headline) or (ii) targets
        with sigma(R)=+-R only — separable by filtering those targets.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Exhaustive solution-set census S(R) under coordinate squaring,
          compared to S(sigma(R)), on tau-stable V versus random V'.
        predicted_gain: >-
          Zero cryptanalytic gain. Discriminates soundness: null confirms
          HOLD-S / a77711; positive closure falsifies A2 and revives H1
          under review-breakthrough. Explicitly not an exponent move.
    quantifier_order: >-
      FORALL R in the prime-order subgroup with sigma(R) != +-R:
      S(R) is NOT closed under coordinate squaring, and
      S(R) ∩ S(sigma(R)) = empty (A2). FORALL squared tuples from S(R)
      on a tau-stable V: the image lies in S(sigma(R)) (A1). EXISTS a
      mid-dimension tau-stable V on K-163: FALSE (lattice). H2
      membership equality: FORALL tau-stable V, direct count equals
      per-orbit representative count (exact).
    method_ceiling:
      strongest_certifiable_claim: >-
        At the tested toy cell (n=17, m=2, l=8) and optional extension
        cells n in {23,31,41}, the soundness metrics match the
        pre-registered null (or the named A2-failure / artifact
        outcomes). Explicitly cannot certify K-163 security movement,
        any exponent-class claim, or a WDSat conflict reduction from
        fixed-target orbit clauses.
      nearby_object_control: >-
        Random non-tau-stable V' of matched dimension (leave-V' fraction
        under squaring); ordinary-curve control with b not in F_2
        (sigma not an endomorphism; equivariance must fail); no
        relabelled Z/NZ control needed.
    proof_obligations:
      - claim: Stage 0 lattice marks K-163 and {29,37} empty mid-lanes before any census
        responsibility: baseline
      - claim: Notation uses n=degree and m=arity throughout artifacts
        responsibility: scope
      - claim: Fixed-target orbit clauses are never claimed satisfiability-preserving
        responsibility: correctness
      - claim: a77711 and KN-FIND-47da4e appear in dominated_by / frontier rows
        responsibility: baseline
      - claim: H2 conversion cost charged O(n^2) once; not in title/priority
        responsibility: qualification
      - claim: No conclusion about any deployed curve's security; no exponent claim
        responsibility: scope
      - claim: Tau-stability of V verified by direct squaring before census
        responsibility: correctness
    not_applicable_reason: null

