      falsification_condition: >-
        A single target R with sigma(R) != +-R whose S(R) is closed under
        coordinate squaring, OR a non-empty S(R) ∩ S(sigma(R)) — falsifies
        A2 at this cell; halt and escalate to review-breakthrough before
