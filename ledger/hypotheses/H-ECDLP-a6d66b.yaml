hypothesis:
  id: H-ECDLP-a6d66b
  question_id: RQ-MQOM-001
  statement: >-
    FIELD CORRECTION, RECORDED FIRST BECAUSE IT CHANGES WHAT THIS RECORD IS.
    The dispatching handoff TASK-20260904-c063e5 describes all nine sources in
    its batch as "prime-field ECDLP proposals". For this source that label is
    WRONG. IDEA-20260808-51e40f studies MULTIVARIATE QUADRATIC cryptanalysis of
    NIST Additional-Signature candidates, MQOM, UOV, MAYO, SNOVA and QR-UOV.
    There is no elliptic curve and no discrete logarithm anywhere in it. The
    identifier prefix "ECDLP" in this record's id was pre-allocated by the
    handoff and is immutable; it is a naming artifact and carries no scope. The
    scope of this record is multivariate quadratic system solving over finite
    fields, and nothing here may be read as a statement about elliptic curves
    or the ECDLP.
    CLAIM. Every algebraic attack in this scheme family terminates in a
    DETERMINED quadratic solve. When q = 2^e, Weil descent carries N quadratics
    in N variables over F_{2^e} to e*N quadratics in e*N variables over GF(2)
    with no degree growth. If a polynomial-method solver for GF(2) quadratic
    systems at m = n has time exponent c, then descent-plus-polynomial-method
    beats a semi-regular Groebner model at m = n exactly when c*e < 2*omega, so
    the correction reaches even-characteristic parameter sets and is INAPPLICABLE
    at odd q. Under that inner solver the optimal number of guessed variables is
    zero, because the hybrid cost 2^{c*e*N + e*j*(1-c)} is strictly increasing
    in j whenever c < 1.
    THE CLAIM IS UNDISCHARGEABLE AS STATED. The constant c is RECALLED as
    0.6943 and has never been read by any agent in this program. KN-LIT-3290 is
    a bibliographic stub whose own body states "No abstract was extractable
    from the first two pages of the local PDF; contribution recorded from the
    title only", and IDEA-20260808-51e40f reports that the local copy it names
    was not present on any filesystem reachable from its session. Under
    RQ-MQOM-001 constraint 1 no experiment may be designed on this claim until
    the primary source is filed. This record is therefore a hypothesis whose
    central quantity is a READ, not a measurement.
  mechanism: >-
    The polynomial method's exponent is worst-case and unconditional, which is
    exactly what every published estimate in this family lacks, since those
    lean on semi-regularity. The reason it has not been applied here is a units
    mismatch, the family quotes costs in F_q operations at F_q parameters while
    the polynomial method's exponent is stated in GF(2) variables. Weil descent
    is the missing conversion and is free in characteristic 2, because the
    Frobenius is F_2-linear and each F_{2^e}-coefficient contributes
    F_2-bilinear components, so a quadratic stays quadratic. No property of any
    scheme is used; the substitution is at the level of the solver.
  assumptions:
    - >-
      Weil descent of a quadratic form over F_{2^e} yields quadratics over
      GF(2). RIGOROUS, not heuristic, because the Frobenius is F_2-linear. This
      is recorded as a derivation, not as an experimental arm.
    - >-
      MQOM has at least one GF(2) parameter set. RECALLED, not read.
    - >-
      The published hybrid optima are recoverable from the specifications.
      Requires the Round-3 specifications, which RQ-MQOM-001 records as NOT
      READ by this program.
    - >-
      omega is a modelling choice that decides the q = 256 verdict on its own,
      so both omega = 2 and omega = 2.81 are mandatory columns. A table with
      one omega is not a result.
    - >-
      The large-field convention d_reg = N+1, used to model semi-regular
      Groebner at m = n as binom(2N,N)^omega, is inappropriate for GF(2) rows
      where the field equations change d_reg substantially. The q = 2
      comparison must use a GF(2)-specific Groebner model or omit the Groebner
      column entirely.
  proof_search_map:
    bottleneck: >-
      The determined inner solve inside every hybrid attack in this family. Its
      exponent is the only place a new algorithm can change a claimed security
      level without touching the scheme.
    baseline_embedding:
      parameter_slice: >-
        q = 2, e = 1, where the descent is the identity map. The cost formula
        must then reduce exactly to the undescended one, and the table must
        reproduce the specification's own GF(2) row when the polynomial-method
        row is removed from the minimum.
      reproduction_check: >-
        Frozen fixture. Recompute one published security row from the
        specification's own formula and require exact integer agreement before
        any new row is admitted to the minimum. A cost model that cannot
        reproduce the published number is not entitled to beat it.
    observation_collision:
      observable: The binding row of a minimum-over-algorithms cost table.
      distinct_preimage_search: >-
        COLLISION EXISTS AND IS STATED. Two schemes with identical (q, N, M)
        have identical binding rows regardless of their real security, because
        the table sees only the shape. The observable therefore certifies
        COST-MODEL COMPLETENESS and never security, and no separating condition
        is proposed because none is needed for the claim actually made.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Weil descent, moving the hypothesis "this determined system is hard"
          from F_{2^e} to GF(2), where an unconditional worst-case exponent is
          available.
        predicted_gain: >-
          Replaces a genericity-conditional Groebner exponent with an
          unconditional one at the price of an e-fold size increase, netting a
          gain exactly when c*e < 2*omega.
    quantifier_order: >-
      FOR ALL parameter sets with q a power of 2, FOR ALL determined subsystems
      arising in the published attack, THERE EXISTS a cost-model column,
      omega = 2 or omega = 2.81, under which the descended polynomial-method
      cost is below the published row. The omega is allowed to depend on the
      parameter set, which is exactly why both columns are mandatory and why
      the q = 256 verdict is reported as omega-dependent rather than as a win.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The minimum in this specification was taken over a strictly smaller
        algorithm set than the literature offers, and the missing row costs X
        bits of time at these parameters, with memory unresolved." Nothing is
        claimed broken and no solver is run.
      nearby_object_control: >-
        QR-UOV at odd q, where the descent is impossible and the method must
        certify nothing. A pipeline that produces a gain there is not tracking
        the field and its other rows are void.
    proof_obligations:
      - claim: Weil descent preserves degree 2 and multiplies size by e.
        responsibility: correctness
      - claim: The e components of each descended equation are linearly independent.
        responsibility: feasibility
      - claim: The polynomial-method exponent applies at m = n.
        responsibility: feasibility
      - claim: The crossover is c*e < 2*omega.
        responsibility: baseline
      - claim: The optimal hybrid split is j = 0 under the new inner solver.
        responsibility: runtime
      - claim: Memory is charged for every row and reported UNRESOLVED where unread.
        responsibility: memory
      - claim: No scheme is claimed broken and no number is asserted from the unread paper.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: >-
      Solving a determined quadratic system of N equations in N variables over
      F_q, the inner solve of the published key-recovery and forgery attacks on
      MQOM, UOV, MAYO, SNOVA and QR-UOV.
    prior_best: >-
      The minimum over exhaustive search q^N, semi-regular Groebner modelled at
      m = n as binom(2N,N)^omega, and the corpus-recorded GF(2) figures for
      BooleanSolve, 2^{0.841 n} deterministic and 2^{0.792 n} Las Vegas, per
      KN-TECH-053, whose own entry flags those figures as quoted from a
      search-returned abstract and unconfirmed.
    time_exponent: >-
      2^{c * N * log2(q)} bit operations for q a power of 2, with c RECALLED as
      0.6943 and NOT READ. No exponent is asserted until c is read verbatim.
    memory_exponent: >-
      2^{c_mem * N * log2(q)} with c_mem UNREAD. The memory column is
      UNRESOLVED and this record refuses to claim a memory win.
    hidden_cofactor: >-
      Two disclosed overheads. First, the polynomial method's o(1) and its
      constants, believed large and unpublished, which may make the asymptotic
      irrelevant below N*log2(q) in the thousands; this is the single most
      likely reason a correct exponent does not translate into a real attack.
      Second, the Groebner side's d_reg = N+1 convention is a large-field
      convention and is inappropriate for GF(2) rows.
    claim_kind: exponent_improvement
  heuristic_assumptions:
    - id: HA-1
      formal_statement: >-
        For every parameter set with q = 2^e, the determined subsystems arising
        inside this family's published attacks are, after Weil descent, no
        harder for the polynomial method than a worst-case GF(2) quadratic
        system of the same size. Formally, descent preserves both the degree,
        exactly 2, and the shape m = n, so the worst-case bound applies
        unchanged.
      random_model_justification: >-
        None is required and none is invented. The polynomial method's bound is
        worst-case and unconditional over all systems of the stated shape, so
        structure cannot make it worse. The assumption is therefore only a
        shape-preservation claim, the rare case where the rigorous ingredient
        does essentially all the work.
      supporting_results:
        - >-
          The F_2-linearity of the Frobenius, which makes descent
          degree-preserving in characteristic 2. Elementary and internal to
          this record.
      validation_experiment_ids:
        - EXP-ECDLP-97a533
      falsification_condition: >-
        A measured systematic linear dependency among the e components of the
        descended equations, at a rate above the pre-registered zero band. That
        reduces the effective equation count below e*N, breaks the m = n shape,
        and voids the exponent for the affected scheme.
    - id: HA-2
      formal_statement: >-
        The polynomial-method family's memory exponent c_mem satisfies
        c_mem < 2/log2(q) at the parameter sets where the time row binds, so
        the substitution is memory-favourable as well as time-favourable at
        q in {2, 4, 8, 16}.
      random_model_justification: >-
        None. This is a bound-location assumption, not a distributional one,
        and it is flagged as the record's weakest point rather than dressed as
        a distribution. Memory is bounded below by the algorithm's own table
        size and above by its time, so 0 < c_mem <= c holds unconditionally;
        only the position of c_mem inside that interval is assumed.
      supporting_results:
        - >-
          None available. c_mem is a published constant that no agent in this
          program has read.
      validation_experiment_ids:
        - EXP-ECDLP-97a533
      falsification_condition: >-
        c_mem read verbatim at or above 2/log2(q) at every parameter set where
        the time row binds. If the source cannot be obtained, HA-2 FAILS BY
        DEFAULT and every row is reported as "time-only, memory UNRESOLVED";
        substituting a guessed c_mem is forbidden.
  structural_ingredients:
    - description: >-
        Source proposal. Weil descent plus polynomial method, the crossover
        c*e < 2*omega, the odd-q inapplicability, and the j = 0 hybrid
        degeneracy.
      citation: IDEA-20260808-51e40f
      provenance: internal
      verified_by: >-
        TASK-20260904-c063e5 coordinator. Full read of
        ledger/proposals/IDEA-20260808-51e40f.yaml, 306 lines, Read tool,
        2026-09-04.
      role: originating claim
    - description: >-
        Itai Dinur, "Cryptanalytic Applications of the Polynomial Method for
        Solving Multivariate Equation Systems over GF(2)". The corpus entry is
        a bibliographic stub. Its own body states "No abstract was extractable
        from the first two pages of the local PDF; contribution recorded from
        the title only" and its "Not verified here" section states the entry
        was bulk-seeded on 2026-07-24 and parsed heuristically. Its
        "citation_verified" flag reads "read", which contradicts its own body;
        that flag cannot be relied on, per the corpus-integrity observation
        already recorded in
        coordination/reviews/backlog-design-20260904/coordinator-rulings.md.
        The exponents 0.6943 and c_mem are RECALLED and are NOT asserted as the
        paper's contents.
      citation: KN-LIT-3290
      provenance: internal
      verified_by: >-
        TASK-20260904-c063e5 coordinator. Full read of
        knowledge/literature/KN-LIT-3290.md, 36 lines, Read tool, 2026-09-04.
        What was verified is that the entry is a stub, NOT that it contains any
        exponent.
      role: the unread source on which the whole claim rests
    - description: >-
        BooleanSolve at 2^{0.841 n} deterministic and 2^{0.792 n} Las Vegas at
        m = n over F_2, and the Crossbred hybrid. RELAYED from
        IDEA-20260808-51e40f, which reports that the entry itself flags these
        figures as quoted from a search-returned abstract and unconfirmed.
      citation: KN-TECH-053
      provenance: internal
      verified_by: null
      role: relayed; corpus-recorded GF(2) baseline
    - description: >-
        Bjorklund-Kaski-Williams parity-counting self-reduction.
      citation: null
      provenance: recalled
      verified_by: null
      role: named so a reviewer can chase it; no number in this record depends on it
  reduction_chain:
    core_problem: >-
      The determined quadratic solve inside published attacks on MQOM, UOV,
      MAYO, SNOVA and QR-UOV.
    corollaries: []
  predictions:
    - metric: >-
        c, the time exponent stated in KN-LIT-3290 for quadratic systems over
        GF(2) at m = n, read VERBATIM from the paper, dimensionless
      direction: lower
      minimum_effect: >-
        Strictly below 0.792. RECALLED as 0.6943 and NOT VERIFIED. If the paper
        gives c at or above 0.792, or states its bound only for a regime
        excluding m = n, this record dies immediately and that is the cheapest
        possible outcome.
    - metric: >-
        linear-dependency rate among the e components of each descended
        equation, dimensionless, measured over 100 random keys at
        (q, N) = (16, 6) and (16, 8)
      direction: lower
      minimum_effect: >-
        Exactly 0.000. The planted-dependency control fixes the dynamic range,
        a key constructed so that its descended system carries exactly one
        forced dependency must be reported with rank e*N - 1 and not e*N.
    - metric: >-
        crossover threshold e* = 2*omega/c and the per-scheme verdict label
      direction: different
      minimum_effect: >-
        REPORTED, NOT A DISCRIMINATOR. e* is an arithmetic function of c and
        omega alone, so once c is read its value is determined and no
        observation can move it. It is recorded as a derived number with its
        inputs, and the per-scheme labels, WIN, LOSE or INAPPLICABLE, follow
        from it deterministically.
    - metric: >-
        optimal number of guessed variables j*, integer, from the exact cost
        function on the grid j = 0..N
      direction: different
      minimum_effect: >-
        REPORTED, NOT A DISCRIMINATOR. j* = 0 follows algebraically from c < 1,
        because 2^{c*e*N + e*j*(1-c)} is strictly increasing in j. Its
        falsifier would require c at or above 1, which the first prediction
        already tests directly.
  test_boundary:
    instances:
      - >-
        Published parameter sets of MQOM, UOV, MAYO, SNOVA and QR-UOV, as read
        from their specifications. NOT YET OBTAINED, see the blocking
        constraint below.
      - >-
        Symbolic Weil-descent constructions at (q, N) = (16, 6) and (16, 8),
        100 random keys of each scheme shape, plus one planted-dependency key.
    parameters:
      claim_tier: toy
      field: multivariate quadratic over F_q, q a power of 2, and odd q as the negative control
      omega_columns: [2, 2.81]
      memory_caps: [unbounded, 2**80 bits]
    implementation: >-
      Not yet written. EXP-ECDLP-97a533 declares the required artifacts and its
      phase ordering.
    budget:
      wall_clock_seconds_per_run: 600
      maximum_memory_gb: 8
      maximum_runs: 4
  falsification_conditions:
    - >-
      KN-LIT-3290 gives c at or above 0.792, or states its bound only outside
      m = n. The record dies at zero further cost.
    - >-
      The read memory exponent c_mem is high enough that at a 2^80-bit cap no
      row in the slice binds.
    - >-
      The measured linear-dependency rate among descended components is above
      0.000 at either tested size while the planted-dependency control reports
      its planted rank correctly. The m = n shape is not preserved and the
      exponent is void for the affected scheme shape.
    - >-
      The units control fails, that is one published security row cannot be
      reproduced from the specification's own formula with exact integer
      agreement. The whole table is blocked.
    - >-
      The odd-q negative control produces any delta. The pipeline is not
      tracking the field size and every other row is void.
    - >-
      BLOCKED, NOT FALSIFIED. KN-LIT-3290 cannot be obtained, or the Round-3
      specifications cannot be obtained. Recorded as blocked. RQ-MQOM-001's
      own provenance block records that the primary NIST pages are unreachable
      from this harness under proxy CONNECT 403, so this is the expected
      outcome and must not be reported as a negative result about the method.
  interpretation_limits:
    - >-
      SCOPE. This is multivariate quadratic cryptanalysis. It is NOT
      prime-field ECDLP, NOT elliptic-curve work, and nothing in it may be
      transferred to the ECDLP by any reader following the "ECDLP" token in
      this record's pre-allocated identifier.
    - >-
      This is a cost-model claim and NO SOLVER IS RUN. A shortfall in the table
      is a statement about two cost models, not an executed attack. Nothing
      here breaks any scheme. The honest headline is that the minimum in these
      specifications is taken over an incomplete algorithm set and the missing
      row costs X bits, with memory unresolved.
    - >-
      Every number in the table inherits the status of c until the source is
      read. Until then the exponents are RECALLED and the record asserts none
      of them.
    - >-
      UNTESTABLE AT REACHABLE SCALE. The polynomial method's concrete constants
      at N*log2(q) in the low hundreds are unpublished, so whether the
      asymptotic has engaged at real parameters cannot be settled by any
      computation this program can run. That uncertainty sits in the table's
      header, not in a footnote.
    - >-
      BLOCKING CONSTRAINT. RQ-MQOM-001 constraint 1 reads that every
      per-scheme technical claim in that question is unverified and that "No
      experiment may be designed until the relevant primary sources are filed
      as KN-LIT entries". EXP-ECDLP-97a533 is therefore written with the
      literature phase HARD-BLOCKING the cost-table phase, and the contract may
      not be approved past that gate on a coordinator's say-so.
  status: proposed
  proposed_by: idea-generator
