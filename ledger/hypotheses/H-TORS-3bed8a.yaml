hypothesis:
  id: H-TORS-3bed8a
  question_id: RQ-TORS-8c7b79
  goal_id: GOAL-ENDO-001
  source_idea_ids:
    - IDEA-20261006-38a54f
  added: '2026-10-07'
  status: specified
  proposed_by: coordinator
  title: >-
    Factor-degree multiset of psi_5 on y^2 = x^3 + 2x + 3 over F_13
    does not change with k
  statement: >-
    Let E be y^2 = x^3 + 2x + 3 over F_13. Let psi_5 be its
    5-division polynomial in x. Let P be the point with the least
    x-coordinate in {0, 1, ..., 12} that lies on E and is not
    2-torsion. The multiset of degrees of the irreducible factors of
    psi_5 over F_13, computed from the curve coefficients alone, is
    the same when the second point is [1]P and when it is [2]P.
    The symmetric difference of those two multisets is exactly 0.
    A different multiset is the concrete negative, and only after
    the shifted polynomials psi_5(x - x([1]P)) and
    psi_5(x - x([2]P)) have different degree multisets. No discrete
    logarithm is computed, and the generic-group exponent 1/2 is
    unchanged.
  mechanism: >-
    PAIR (representation, Sigma), carried from IDEA-20261006-38a54f.
    The representation is the affine x-coordinate. Sigma is the
    Frobenius action on the roots of psi_5, not translation by P.
    Trichotomy class: coordinate-dependent, because the polynomial
    is written in x and discards y. The projection keeps the
    multiset of factor degrees and discards the roots themselves
    and the point Q. Many root sets share one degree multiset, so
    the projection is lossy. It is not a block system of the
    translation group. Explanation A: psi_5 does not read k, so the
    degree multiset at Q = [1]P equals the multiset at Q = [2]P.
    Explanation B: the two multisets differ, so the instrument has
    taken k from somewhere other than the curve equation. No factor
    base is built and no rho walk is run.
  assumptions:
    - >-
      psi_5 is the standard 5-division polynomial of the
      short-Weierstrass model. A polynomial that fails an order
      check on a known 5-torsion point in an extension is not used.
    - >-
      P exists. If every affine point is 2-torsion, the setup fails
      and no multiset comparison is scored.
    - >-
      The quadratic twist by the least non-residue is recorded as a
      null and is not substituted for E.
    - >-
      If x(P) equals x([2]P), the shift control is undefined and the
      unshifted comparison is refused.
  proof_search_map:
    bottleneck: >-
      Whether the factor-degree multiset of psi_5 changes when [1]P
      is replaced by [2]P.
    baseline_embedding:
      parameter_slice: >-
        One ordinary curve at p = 13 and one polynomial of degree 12.
      reproduction_check: >-
        The same polynomial is built twice from (A, B) alone. The two
        copies must have the same factor degrees before k is mentioned.
    observation_collision:
      observable: the multiset of irreducible-factor degrees of psi_5
      distinct_preimage_search: >-
        Two different values of k can share one multiset. Unequal
        multisets are the collision that kills explanation A.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fibre of the factor-degree map on short-Weierstrass
          models at p = 13.
        predicted_gain: >-
          Equality of two multisets. No discrete-log cost changes.
    quantifier_order: >-
      On this one curve, for the least eligible P, the multiset at
      [1]P equals the multiset at [2]P. This is not every curve.
    method_ceiling:
      strongest_certifiable_claim: >-
        The degree multiset does not read k on this curve, or the two
        multisets differ.
      nearby_object_control: >-
        The shifted polynomial psi_5(x - x([1]P)) against
        psi_5(x - x([2]P)). If x(P) is not x([2]P), those two shifted
        multisets must differ. If they agree, the shift control is
        blind and the unshifted comparison is refused.
    proof_obligations:
      - claim: psi_5 is built from (A, B) alone
        responsibility: correctness
      - claim: the two unshifted multisets agree
        responsibility: strictness
      - claim: the shifted control can tell x(P) from x([2]P)
        responsibility: baseline
    not_applicable_reason: >-
      No exponent is claimed. The map is still filled for this one curve.
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        The irreducible-factor degrees of psi_5 over F_p are a function
        of the curve coefficients alone. Replacing Q = [k]P by [k']P
        does not change them. This imitates the fact that a division
        polynomial is defined from A and B. It is not a claim that every
        torsion-derived statistic ignores k.
      random_model_justification: >-
        The polynomial is built from the curve equation, so two
        evaluations that do not read a point should return one
        multiset. Transfer of that shape onto this implementation at
        p = 13 is the heuristic. It is not a new theorem.
      supporting_results:
        - >-
          KR-RHO-13bf67, opened in this session, bounds generic
          algorithms and does not mention division-polynomial factor
          degrees. KR-RHO-755e35, opened in this session, says isogeny
          walks do not change the group-structure class of weakness
          and does not mention this multiset. KR-IC-5a43e5, opened in
          this session, is the summation-polynomial framework and does
          not factor psi_5.
      validation_experiment_ids: []
      falsification_condition: >-
        At this one curve, the unshifted multisets differ after the
        shifted control separates x(P) from x([2]P). If the shifted
        multisets agree while the x-coordinates differ, refuse the
        comparison. If no eligible P exists, refuse the comparison.
  structural_ingredients:
    - description: >-
        A generic algorithm needs a square-root number of group
        operations. This hypothesis does not beat that bound.
      citation: KR-RHO-13bf67
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
      role: exponent ceiling
    - description: >-
        Isogenous curves share the group-structure class of weakness.
        The factor degrees here are not used as a hidden endpoint.
      citation: KR-RHO-755e35
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
      role: scope ceiling on isogeny transfer
    - description: >-
        Semaev summation polynomials vanish when x-coordinates sum to
        the identity. This hypothesis factors a division polynomial
        and does not build a summation polynomial.
      citation: KR-IC-5a43e5
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
      role: nearby object this test does not run
  predictions:
    - metric: >-
        symmetric difference of the factor-degree multisets of psi_5
        at [1]P and at [2]P
      direction: lower
      minimum_effect: exactly 0
    - metric: >-
        symmetric difference of the factor-degree multisets of the
        shifted polynomials psi_5(x - x([1]P)) and
        psi_5(x - x([2]P))
      direction: higher
      minimum_effect: at least 1 when the two x-coordinates differ
  test_boundary:
    instances:
      - y^2 = x^3 + 2x + 3 over F_13
    parameters:
      prime: 13
      A: 2
      B: 3
      division_index: 5
    implementation: >-
      Build psi_5 from (A, B) alone, factor it over F_13, choose the
      least eligible P, compute [2]P, and compare unshifted and
      shifted degree multisets. No driver is bound in this record.
      No rho walk.
    budget:
      maximum_runs: 1
  falsification_conditions:
    - >-
      The curve is nonsingular and ordinary, an eligible P exists,
      x(P) differs from x([2]P), the shifted degree multisets differ,
      and the unshifted degree multisets differ.
    - >-
      x(P) differs from x([2]P) and the shifted multisets agree. No
      unshifted comparison from that run is admissible, and the
      failure is not the concrete negative above.
    - >-
      No eligible P exists, or the curve is singular or supersingular.
      No multiset from that run is admissible.
  interpretation_limits:
    - >-
      Equality of the two multisets says the meter did not read k. It
      is not a theorem that no torsion statistic can read k.
    - No discrete logarithm is computed. The exponent 1/2 is unchanged.
    - The scope is this one curve at p = 13.
  status_note: >-
    specified means the protocol is written. It does not mean
    approved. EXP-TORS-e08fcb is review_required.
