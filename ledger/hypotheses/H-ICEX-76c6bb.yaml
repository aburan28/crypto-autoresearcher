hypothesis:
  id: H-ICEX-76c6bb
  question_id: RQ-SNFS-005666
  added: '2026-09-04'
  derived_from_idea: IDEA-20260901-e849e4
  statement: >-
    THE SPECIAL-VERSUS-GENERAL NUMBER FIELD SIEVE CROSSOVER HAS NEVER BEEN MEASURED IN THIS PROGRAM,
    AND EVERY STATEMENT ABOUT IT RESTS ON A RECALLED FOLKLORE FIGURE. Four separable limbs.
    (A) THE DELIVERABLE. An end-to-end special-versus-general sieve comparison on ONE implementation
    at a pinned commit, on ONE named machine, over a declared grid of composite sizes and forced
    special-polynomial degrees, with MEMORY BESIDE TIME per stage. The general arm runs on the SAME
    composite as the special arm, so no cross-paper, cross-machine or cross-implementation number
    enters any ratio.
    (B) THE THIRD ARM, WITHOUT WHICH THE HEADLINE RATIO IS UNINTERPRETABLE. A special polynomial
    differs from a general one in TWO ways at once: its coefficients are tiny AND its degree is
    forced by the input rather than optimised for the size. A ratio between the special arm and the
    implementation's own chosen general polynomial confounds them. A third arm - a general-size
    coefficient polynomial of the SAME forced degree, run end to end on the SAME composite -
    separates the two, so that (special over same-degree-general) is the COEFFICIENT-SIZE effect,
    (same-degree-general over optimal-general) is the DEGREE-MISMATCH effect, and their product is
    the headline ratio.
    (C) THE SHAPE PREDICTED BEFORE THE RUN, AND ONLY THE SHAPE. Under the asymptotic slice this lane
    has derived, the general sieve and the finite-degree special sieve sit at different norm-size
    exponents, so the logarithm of the effort ratio grows with the standard size function. AT THE
    SIZES REACHABLE HERE THE LOWER-ORDER TERM IS LARGE, so the PREDICTION IS THE SHAPE AND THE SIGN:
    the coefficient-size log-ratio is monotone in the size function at fixed degree, the
    degree-mismatch log-ratio grows in magnitude as the forced degree departs from the
    implementation's own optimum at that size, and therefore a crossover exists for the highest
    forced degree. NO VALUE IS PREDICTED AND NO EXTRAPOLATION IS LICENSED.
    (D) THE DISCRETE-LOGARITHM ARM AND THE HARD LIMIT. The published result that makes this question
    consequential is a discrete-logarithm result, so the crossover that matters is the
    discrete-logarithm one; the hypothesis includes an arm on OPENLY constructed special primes
    against random primes of the same size at two grid sizes. NO TRAPDOOR CONSTRUCTION IS USED,
    REIMPLEMENTED OR APPROXIMATED, no detectability statistic is touched, and NOTHING here is a
    statement about any real, published or deployed parameter set.
  mechanism: >-
    The special polynomial's algebraic-side norm is bounded by the sieving region raised to the
    degree times a tiny coefficient bound, against the same region term times a coefficient bound of
    the general size at matched degree. At matched degree the special arm's norm product is therefore
    smaller and its smoothness probability correspondingly larger - the effect a norm-histogram proxy
    in this lane already computes without running any sieve. But the general sieve is NOT run at the
    special degree: it is run at the degree that minimises its own norm product at that size, and
    when the forced special degree is far above that optimum the region term grows faster than the
    coefficient term shrinks. So the special sieve loses at small sizes and wins at large ones, with
    the crossover moving up as the forced degree rises. The three-arm design measures the two effects
    separately END TO END, including the downstream consequences a norm proxy cannot see: a smaller
    factor base for the special arm, hence a smaller matrix and cheaper linear algebra, which is why
    memory is reported beside time in every cell.
    WHY THE COMPARABILITY DISCIPLINE IS THE SUBSTANCE OF THIS HYPOTHESIS AND NOT ITS HOUSEKEEPING.
    The quantity of interest is a RATIO, and a ratio is only a measurement if its numerator and
    denominator were produced under the same conditions. Published record-scale computations are
    single points from different implementations on different clusters with different parameter
    tuning; a folklore crossover figure is a recollection with no stated implementation, machine or
    charging convention at all. Neither can be a denominator here. Every ratio this hypothesis
    reports is between arms run on the SAME composite, at the SAME pinned commit, on the SAME named
    machine with pinned cores, under ONE frozen charging convention, with the arms interleaved so
    that machine drift affects them equally.
    WHY THE STANDING CURVE-FREE-NULL CONSTRAINT IS DISCHARGED BY CONSTRUCTION HERE, STATED RATHER
    THAN OMITTED. The constraint requires a curve-free null wherever a non-curve object could
    reproduce the signature and the result could therefore be misread as a statement about elliptic
    curves or the ECDLP. NO ARM OF THIS HYPOTHESIS INVOLVES AN ELLIPTIC CURVE AT ANY POINT: the
    objects are integers, number fields and prime-field multiplicative groups, and no ECDLP reading
    is available to be misread. The constraint's SPIRIT - that a non-special object of the same shape
    must reproduce the signature before the special structure is credited for it - is what the third
    arm and the random-prime discrete-logarithm arm discharge, and they are mandatory for exactly
    that reason.
  assumptions:
    - >-
      The implementation at a pinned commit accepts a user-supplied polynomial pair for both factoring
      and discrete logarithm and runs end to end at the declared sizes on the named machine. Cells
      that exceed the campaign budget are DROPPED and recorded as dropped, which is a budget outcome
      and never evidence.
    - >-
      Special composites are formed as cofactors of the declared special form after removing small
      factors by a declared trial-division bound and a declared elliptic-curve-method effort, with the
      special polynomial for the full special integer applied to the cofactor. Cells whose cofactor is
      prime or too small are redrawn under the recorded seed policy, and the redraw is logged.
    - >-
      The charging convention is fixed before any run: per stage, wall-clock seconds, CPU seconds and
      peak resident set, together with the machine-independent counters - relation count, matrix rows,
      matrix density - so that a reader can separate a hardware effect from an algorithmic one.
    - >-
      The implementation's parameter files are tuned for general inputs, so the special arm may run
      under sub-optimal factor-base bounds. That is a disclosed bias in a stated direction, bounded by
      a declared parameter sweep at one cell, and every ratio is labelled with the parameter regime it
      was measured under.
    - >-
      The special polynomial's root properties differ from a general one's, which affects smoothness
      independently of coefficient size. The relevant polynomial quality measure is recorded for every
      polynomial in every arm and reported beside every ratio.
  proof_search_map:
    not_applicable_reason: >-
      NOT A PROOF-ORIENTED HYPOTHESIS, and the reason is specific. No theorem, certificate family,
      reduction or new asymptotic bound is proposed: this is a grid measurement whose controls are the
      three arms, the discrete-logarithm arm, the self-consistency cell where the forced degree equals
      the implementation's own choice, and the independently re-verified factorisation and logarithm
      certificates. The asymptotic shape the measurement is read against is derived in a separate
      record in this lane and is NOT re-derived here; the hypothesis relies on it only for a sign and a
      monotonicity direction, both of which are falsifiable by the measurement itself.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-XOV-1
      formal_statement: >-
        FINITE-DEGREE SPECIAL-SIEVE PLACEMENT. For a composite dividing the declared special form,
        with the special polynomial pair at forced degree d, the norm-size exponent is one plus one
        over d, up to a correction of the order of the logarithm of the small coefficient over the
        logarithm of the composite; and the logarithm of the relation-collection effort ratio between
        the general sieve at its own optimal degree and the special sieve at forced degree d is the
        difference of the two exponent constants times the standard size function, plus a
        degree-mismatch term that is negative and shrinks relative to that function as the size grows.
      random_model_justification: >-
        THE RIGOROUS INGREDIENT is the norm-size arithmetic, which is exact: the coefficient bounds and
        the root magnitude are known by construction for the special pair. THE CLASSICAL STATEMENT
        IMITATED is the standard smoothness-probability balance underlying the sieve's complexity. THE
        GAP, stated plainly and load-bearing: at the sizes reachable in this grid the lower-order term
        of the sieve exponent is NOT small - the literature this lane has consulted places its
        convergence far beyond any reachable size - so only the SIGN and the MONOTONICITY are relied
        on, and no fitted slope may be converted into a predicted running time at any larger size.
      supporting_results:
        - >-
          The asymptotic slice derived in a companion record of this lane, which supplies the two
          norm-size exponents. INTERNAL and second-hand to this session; the contract re-reads it in its
          zero-compute stage and records what it actually states before the shape is used.
        - >-
          The published observation that the sieve exponent's lower-order term converges only at sizes
          far beyond any experiment. RECALLED at this session's remove - the parent proposal reports a
          fetched abstract, this session opened nothing - so it is a pointer for the reviewer and
          supports nothing; it is the REASON the hypothesis predicts a shape rather than a value.
      validation_experiment_ids:
        - EXP-ICEX-344f0b
      falsification_condition: >-
        A non-negative fitted slope of the coefficient-size log-ratio against the size function at any
        forced degree, or a coefficient-size ratio at or above one at any cell. The placement is
        contradicted at these sizes, the lower-order term dominates, and NO extrapolation of any kind
        is licensed from the run.
    - id: HEUR-XOV-2
      formal_statement: >-
        FACTORING-TO-DISCRETE-LOGARITHM TRANSFER OF THE CROSSOVER. The special-versus-general
        classification at a given size and forced degree is the same for the discrete-logarithm
        pipeline as for factoring, up to a bounded factor, because the two share the sieving ingredient
        and differ in the polynomial selection used for the RANDOM prime and in the ring of the linear
        algebra.
      random_model_justification: >-
        THE RIGOROUS INGREDIENT is the shared code path: the same sieve and the same filtering run in
        both pipelines at the pinned commit, which is checkable from the implementation and is checked
        in the zero-compute stage. THE CLASSICAL STATEMENT IMITATED is the reported experience that a
        discrete logarithm at a given size is not much harder than a factorisation at the same size.
        THE GAP: the discrete-logarithm balance shifts effort toward sieving because the linear algebra
        is dearer, which can MOVE the crossover; the declared tolerance band is the honest width of
        that ignorance and is fixed before the run.
      supporting_results:
        - >-
          The reported comparison of factoring and discrete-logarithm cost at a record size. RECALLED at
          this session's remove; the parent proposal reports a fetch-tool summary and this session opened
          nothing, so it is a pointer and supports nothing. The transfer is MEASURED at two grid sizes
          rather than assumed.
      validation_experiment_ids:
        - EXP-ICEX-344f0b
      falsification_condition: >-
        The discrete-logarithm and factoring classifications disagree beyond the declared band at the
        same size and forced degree. The transfer fails; a discrete-logarithm-specific ingredient is
        localised and the discrete-logarithm crossover is stated SEPARATELY rather than inferred from
        the factoring one.
  structural_ingredients:
    - description: >-
        The parent proposal's three-arm design, its grid of sizes and forced degrees, its
        discrete-logarithm arm on openly constructed special primes, its controls and its explicit
        refusal to reconstruct any trapdoor.
      citation: ledger/proposals/IDEA-20260901-e849e4.yaml
      provenance: internal
      verified_by: >-
        TASK-20260904-8f2f95, coordinator design session, full read of the record on 2026-09-04.
    - description: >-
        The asymptotic slice placing the general and special sieves at their respective norm-size
        exponents, from which the predicted SHAPE - and only the shape - is taken.
      citation: IDEA-20260901-d88b5c
      provenance: internal
      verified_by: >-
        IDEA-20260901-e849e4 states it was authored in the same session as that record.
        TASK-20260904-8f2f95 did NOT open IDEA-20260901-d88b5c; the two exponents are second-hand and
        the contract re-reads that record in its zero-compute stage before the shape is used.
    - description: >-
        The norm-bit-distribution proxy for the special-versus-general advantage, whose same-degree
        large-coefficient null this hypothesis reuses as its third arm and whose own record forbids
        reporting its statistic as a running time.
      citation: IDEA-20260816-9cfbac
      provenance: internal
      verified_by: >-
        IDEA-20260901-e849e4 records reading that proposal's claim block.
        TASK-20260904-8f2f95 did not open it; the null's construction is second-hand and the contract
        re-reads it before the third arm is built.
    - description: >-
        The corpus records for the record-scale special-sieve discrete-logarithm and factoring
        computations, which motivate the question and whose constructions are NOT used here.
      citation: KN-LIT-2089 and KN-LIT-2090
      provenance: internal
      verified_by: >-
        IDEA-20260901-e849e4 records reading both as CORPUS ABSTRACTS ONLY, with the retrieval index
        unavailable in that session. TASK-20260904-8f2f95 opened neither. They are cited for motivation
        only; NO number from them enters any ratio, and this contract forbids comparing any measured
        time against them.
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: >-
        coefficient_size_ratio - relation-collection time of the special arm divided by that of the
        same-degree large-coefficient arm, on the SAME composite, same machine, per cell
      direction: lower
      minimum_effect: >-
        Below the declared threshold at every cell and monotone decreasing in size at fixed forced
        degree. A ratio at or above one anywhere falsifies the coefficient-size effect END TO END at
        that cell and contradicts the norm-level proxy, which must then be reconciled by measuring that
        cell's norm distribution with the proxy's own instrument and reporting which is wrong.
    - metric: >-
        degree_mismatch_ratio - relation-collection time of the same-degree large-coefficient arm
        divided by that of the implementation's optimal-degree general arm, same composite, per cell
      direction: higher
      minimum_effect: >-
        Above one whenever the forced degree exceeds the implementation's chosen degree by two or more,
        increasing with the degree gap, and NEAR ONE where the two degrees coincide. That last cell is
        the third arm's self-consistency check and it can fail.
    - metric: >-
        crossover_size at the highest forced degree - the size at which the headline total-time ratio
        crosses one, interpolated on the grid
      direction: different
      minimum_effect: >-
        Exists within the grid or above its lower end. If the highest-degree special arm already wins at
        the smallest size, the degree-mismatch effect is smaller than the norm arithmetic suggests and
        the record says so rather than reinterpreting the grid.
    - metric: >-
        headline_ratio at the two largest sizes for the middle forced degrees - total time of the
        special arm over the optimal-general arm on the same composite
      direction: lower
      minimum_effect: >-
        Below the declared threshold. Larger means the special sieve's advantage at these sizes is
        smaller than the asymptotic picture suggests, and it is reported with the measured slope rather
        than explained away.
    - metric: >-
        slope of the logarithm of the coefficient-size ratio against the standard size function, fitted
        at fixed forced degree
      direction: lower
      minimum_effect: >-
        Negative, with magnitude inside a declared band around the asymptotic difference of the two
        exponent constants. Outside that band is a finding about the lower-order term at these sizes and
        FORBIDS any extrapolation.
    - metric: >-
        memory_ratio - peak resident memory of the special arm over the optimal-general arm in the
        linear-algebra stage, and the matrix-row ratio, same composite
      direction: lower
      minimum_effect: >-
        Below one at every cell where the special arm wins on time, since a smaller factor base gives a
        smaller matrix. A memory ratio above one with a time ratio below one is a TRADEOFF and the
        crossover must then be stated in both coordinates.
    - metric: >-
        dlp_headline_ratio - total time on an openly special prime over a random prime of the same size
        with the discrete-logarithm pipeline, at two grid sizes
      direction: lower
      minimum_effect: >-
        The SAME classification - special wins or loses - as the factoring cell at the same size and
        degree, within the declared band. A disagreement localises a discrete-logarithm-specific
        ingredient and is reported as such.
  test_boundary:
    instances:
      - >-
        A declared grid of composite sizes crossed with declared forced special-polynomial degrees, with
        the special composite at each cell drawn under the recorded seed policy from the declared special
        form.
      - >-
        Three arms per factoring cell, ALL ON THE SAME COMPOSITE: the special polynomial pair, a
        same-degree large-coefficient base-m pair, and the implementation's own optimal general pair.
      - >-
        Two discrete-logarithm cells: an openly constructed special prime and a random prime of the same
        size, both run through the implementation's discrete-logarithm pipeline.
      - >-
        One parameter-sweep cell on the special arm, to bound the effect of general-tuned parameter files.
    parameters:
      implementation: 'one implementation at a pinned commit, recorded with its build configuration'
      machine: 'one named machine with pinned cores and no other declared workload; every row carries it'
      charging_convention: 'per stage - wall-clock seconds, CPU seconds, peak resident set - plus relation count, matrix rows and matrix density as machine-independent counters; frozen before any run'
      repetitions: 'at least two runs per cell at the smaller sizes and at least one at the largest, with runs interleaved across arms so machine drift affects them equally'
      cofactor_policy: 'declared trial-division bound and elliptic-curve-method effort, with cofactor size required within a declared tolerance of the target size and the achieved size recorded per cell'
    implementation: >-
      The implementation is invoked unmodified at the pinned commit; the driver under
      experiments/EXP-ICEX-344f0b/driver/ only generates the composites and polynomial pairs, schedules
      the interleaved arms, collects the per-stage counters, and re-verifies the certificates.
    budget:
      wall_clock_seconds_total: 604800
      maximum_memory_gb: 32
      maximum_runs: 120
  falsification_conditions:
    - >-
      The coefficient-size ratio is at or above one at any cell. The end-to-end advantage of small
      coefficients fails there, contradicting the norm-level proxy; the record reconciles by measuring
      that cell's norm distribution with the proxy's instrument and reporting which of the two is wrong.
    - >-
      No crossover at the highest forced degree within the grid and none implied by the trend. The
      degree-mismatch effect is weaker at these sizes than the norm arithmetic suggests, reported with
      the measured degree-mismatch ratios.
    - >-
      The fitted slope against the size function is non-negative at any forced degree. The predicted
      shape is contradicted at these sizes, the lower-order term dominates, and the record states that
      NO extrapolation is licensed.
    - >-
      The self-consistency cell - forced degree equal to the implementation's own chosen degree - does
      not give a degree-mismatch ratio near one. The third arm is not measuring what it is supposed to
      measure and the two-factor decomposition is void.
    - >-
      The discrete-logarithm classification disagrees with the factoring classification beyond the
      declared band. The transfer heuristic fails; the discrete-logarithm crossover is stated separately
      and never inferred.
    - >-
      A certificate fails independent re-verification. That cell's timings are DISCARDED, not reported
      with a caveat: a timing for a computation whose output is unverified is not a measurement of
      anything.
    - >-
      NOT A FALSIFICATION. Runs that exceed the budget or crash. Budget outcome; the cell is marked
      missing and the reached size is recorded. Never evidence.
  interpretation_limits:
    - >-
      Scoped to ONE implementation at ONE pinned commit, ONE named machine, the grid actually run, and
      the stated charging convention. No kilobit computation and no extrapolation to any larger size is
      claimed; the slope is reported so that a conditional projection can be LABELLED as one.
    - >-
      NO MEASURED TIME MAY BE COMPARED AGAINST ANY PUBLISHED RECORD-SCALE FIGURE. Those are single
      points from different implementations on different clusters with different tuning, and a ratio
      formed across them is not a measurement. The corpus records are cited for motivation only.
    - >-
      NOTHING HERE CONCERNS DETECTABILITY. No statistic battery, no freeze order and no trapdoored class
      is touched; the hypothesis measures only where the special sieve pays, which is what makes the
      detectability question consequential or not at these sizes.
    - >-
      NO RECORD PRODUCED HERE MAY ALLEGE THAT ANY REAL, PUBLISHED OR DEPLOYED PARAMETER SET IS
      TRAPDOORED OR ATTRIBUTE INTENT TO ANY PARTY. The special primes and composites are openly
      constructed by this program and are not models of anyone's parameters. No trapdoor construction is
      used, reimplemented or approximated.
    - >-
      The asymptotic shape is a conditional slice derived elsewhere in this lane. A measured slope
      agreeing with it is CONSISTENCY, not confirmation, and the slope's band is declared before the run.
    - >-
      The standing curve-free-null constraint is discharged BY CONSTRUCTION: no arm involves an elliptic
      curve, so no ECDLP misreading is available. Its spirit is discharged by the same-degree
      large-coefficient arm and the random-prime discrete-logarithm arm, which are the non-special
      objects of the same shape.
  status: proposed
  proposed_by: idea-generator
  specified_by: coordinator
  prior_evidence_refs:
    - RQ-SNFS-005666
    - IDEA-20260901-e849e4
    - GOAL-SNFS-001
    - IDEA-20260901-d88b5c
    - IDEA-20260816-9cfbac
    - KN-LIT-2089
    - KN-LIT-2090
  distinguishable_outcomes:
    - outcome: >-
        The coefficient-size ratio is below threshold and monotone at every cell, the degree-mismatch
        ratio behaves as predicted with the self-consistency cell near one, a crossover appears at the
        highest forced degree, and the discrete-logarithm cells agree with factoring within the band.
      meaning: >-
        The goal's crossover criterion is instantiated with a measured curve decomposed into two named
        effects, on one implementation and one machine, with memory beside time. The program's crossover
        knowledge moves from a recalled folklore figure to a measurement with a stated scope. No attack
        axis moves.
    - outcome: >-
        The coefficient-size ratio is at or above one somewhere.
      meaning: >-
        The end-to-end advantage of small coefficients fails at that cell and contradicts the norm-level
        proxy. The reconciliation - which instrument is wrong - is the reported result and is more
        valuable than the grid.
    - outcome: >-
        No crossover at the highest forced degree.
      meaning: >-
        The degree-mismatch effect is weaker at these sizes than the norm arithmetic suggests. Reported
        with the measured ratios; the grid's boundary is stated rather than extrapolated past.
    - outcome: >-
        The fitted slope is non-negative at some degree.
      meaning: >-
        The predicted shape is contradicted at these sizes. The lower-order term dominates and the run
        explicitly licenses NO extrapolation, which is itself the useful statement.
    - outcome: >-
        The self-consistency cell's degree-mismatch ratio is far from one.
      meaning: >-
        The third arm is not isolating what it was built to isolate. The two-factor decomposition is void
        and only the headline ratio survives, reported without its decomposition.
    - outcome: >-
        The discrete-logarithm cells disagree with factoring beyond the band.
      meaning: >-
        A discrete-logarithm-specific ingredient is localised. The discrete-logarithm crossover is stated
        separately, which matters because the discrete-logarithm one is the crossover the goal actually
        needs.
