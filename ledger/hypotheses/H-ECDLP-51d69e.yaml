hypothesis:
  id: H-ECDLP-51d69e
  question_id: RQ-ECDLP-002
  statement: A source-bound finite batch fixture can produce deterministic duplicate-screen receipt flags and explicit dependency order without asserting duplicate adjudication or scheduling.
  mechanism: Literal fixture bytes, exact receipt values, and a closed acceptance predicate constrain every output.
  status: proposed
  title: Finite batch duplicate-screen receipt integrity
  source_idea: {id: IDEA-20260815-634cb9, provenance: internal}
  controls: [self, known_different, empty_union, acyclic_dependency]
  falsification: Any accepted receipt unequal to the declared fixture receipt or carrying an administrative or scientific claim.
  limits: [BATCH-local fixture only, no live corpus conclusion, no duplicate adjudication, no schedule, no ECDLP conclusion]
  approval: {approved_by: DEC-20260909-bdeb6b, implementation_authorized: false, scientific_execution_authorized: false}
