hypothesis:
  id: H-ICEX-9df78d
  question_id: RQ-RELN-001
  source_idea_id: IDEA-20260815-c3f707
  title: >-
    CHARGE THE FAILURES- an index calculus does not consume P(decomp), it
    consumes EXPECTED CHARGED COST PER ACCEPTED RELATION, which is (attempt
    cost + rerandomization cost) / P(decomp); measured in charged operations
    over a factor-base sweep with three separated counters it falls in B with
    log-log slope theta - m, where theta is the independently measured
    attempt-cost exponent, and the joint optimum with the linear-algebra term
    is the only base size at which an honest ICEX comparison can be run
  statement: >-
    (A) THE QUANTITY SUBSTITUTION, WHICH IS THE WHOLE CONTENT. A
    relation-collection stage does not consume the per-attempt success rate
    P(decomp). It consumes EXPECTED WORK PER ACCEPTED RELATION- the cost of
    one attempt, plus the cost of producing each fresh randomized instance,
    divided by P(decomp). Those are different quantities in different units-
    P(decomp) is a dimensionless probability and the charged cost is an
    operation count - and this lane has been reporting the reciprocal of the
    numerator's denominator as though it were a cost.
    (B) THE PRE-REGISTERED SCALING LAW, STATED SO A MEASUREMENT CAN
    CONTRADICT IT. Model the attempt cost as c_A * B^theta with theta
    MEASURED IN THE SAME RUN from the attempt-cost counter against B, and the
    mean per-target decomposition yield as KN-FIND-007 states it VERBATIM-
    'E_r[c_D(r)] = binomial(B + m - 1, m) / N for every base of size B,
    independently of how D is chosen' - which for B much larger than m reads
    as proportional to B^m / (m! N), and the harness uses the EXACT binomial,
    not the asymptotic form. Then the expected charged cost per
    accepted relation scales as B^{theta - m}. PREDICTION- the measured
    log-log slope of charged cost per accepted relation against B equals
    theta_measured - m within +/- 0.3. FALSIFIED if the measured slope
    differs from theta_measured - m by more than 0.3, and SEPARATELY
    falsified if the slope is at or above 0, which would contradict the
    supply model outright and is more interesting than the predicted outcome.
    (C) THE JOINT OPTIMUM. Adding the lane's inherited sparse linear-algebra
    charge c_LA * B^2, the total has an interior minimum in B. The optimum
    B* is reported AS AN INTERVAL, never as a point estimate, together with
    the SENSITIVITY of the resulting exponent to B* across a factor-of-four
    range. If the exponent varies by less than its own confidence interval
    across that range, THE OPTIMUM DOES NOT NEED REFINING AND THE LANE SHOULD
    STOP REFINING IT - a budget-saving negative that is a legitimate and
    wanted deliverable.
    (D) THE UNIT CORRECTION THIS RECORD MAKES TO ITS OWN SOURCE. The source
    proposal accepts WALL CLOCK as a cost proxy at toy scale, reporting only
    ratios. THIS HYPOTHESIS DOES NOT. Wall clock is machine-scoped,
    implementation-scoped and not addable to any other cost in this
    programme, and a ratio of wall clocks is not the same object as a ratio
    of operation counts once the two channels have different constant
    factors. The primary metric is CHARGED OPERATIONS with a declared
    conversion for field work; wall clock is a machine-tagged secondary
    column only. The deviation from the source proposal is deliberate and is
    recorded here rather than absorbed.
    (E) WHAT IS NOT CLAIMED. This produces one INPUT to an exponent
    comparison it does not perform. RQ-ICEX-001's decision remains
    RQ-ICEX-001's. The located optimum is a toy optimum and does not transfer.
  mechanism: >-
    WHY THE LOSSY PROJECTION IS THE LANE'S REPORTED STATISTIC. Reporting
    P(decomp) alone discards attempt cost, failure cost and rerandomization
    cost - all three of which the exponent consumes. The projection is lossy
    in the direction that FLATTERS index calculus, because the discarded
    terms grow exactly where P(decomp) falls.
    WHY THE THREE COUNTERS MUST BE SEPARATE AND NOT ONE TOTAL. The
    rerandomization cost is the term most likely to be omitted and is exactly
    the one that grows as the base shrinks; omitting it biases the located
    optimum toward SMALL bases, which is the direction that flatters index
    calculus. A single total cannot show that bias, and a bias that cannot be
    seen cannot be corrected. Three counters make it visible and make the
    zero-cost and expensive-rerandomization nulls meaningful.
    WHY 1/P IS THE RIGHT FACTOR AND WHERE IT BREAKS. Wald's identity gives
    the expected number of Bernoulli trials to first success as exactly 1/P,
    which is rigorous when attempts are independent and identically
    distributed at fixed base size. IT BREAKS IF P(decomp | target) IS
    HEAVY-TAILED ACROSS TARGETS- then attempts are not identically
    distributed, the formula understates the true expected cost, possibly
    badly, and the understatement concentrates on the low-P targets. That is
    HEUR-RELN-CHG-1's gap and the contract's tail check measures it directly
    by restricting the comparison to the lowest-P decile.
    WHY A CURVE-FREE NULL IS REQUIRED HERE AND NOT OPTIONAL. The predicted
    slope theta - m is a property of the SUPPLY MODEL- a target is decomposed
    over a size-B base with m summands, so the yield scales as B^m / N and
    the work per success as B^{theta - m}. Nothing in that reads the group
    law. A non-curve object of the same shape - subset-sum membership over a
    size-B subset of (Z/NZ, +) - should reproduce the slope exactly, and if
    it does, NO MEASURED SLOPE IN THIS LANE MAY BE READ AS A STATEMENT ABOUT
    ELLIPTIC CURVES. A departure of the curve arm from the curve-free arm IS
    the curve-specific content and is the interesting outcome.
  assumptions:
    - >-
      COST UNIT- one charged operation is one GROUP OPERATION on E(F_p).
      Solver and field work natively counted in F_p FIELD OPERATIONS is
      tagged and converted at a frozen declared rate kappa in {1, 10, 100},
      one row per kappa. WALL CLOCK IS A SECONDARY, MACHINE-TAGGED COLUMN
      ONLY and never enters a primary total or a primary ratio.
    - >-
      Attempt cost, failure cost and rerandomization cost are separately
      instrumentable. Stage 1 of the contract CHECKS this; if they cannot be
      separated, the record reports a combined counter and WITHDRAWS the
      decomposition claim rather than estimating a split.
    - >-
      The lane's existing sparse linear-algebra cost model c_LA * B^2 is
      admissible as the second term. IT IS INHERITED, NOT VALIDATED HERE. If
      it is wrong the located optimum moves silently, and the sensitivity
      analysis is the only defence - which is why it is reported alongside
      the optimum and never separately. The sibling contract EXP-ICEX-7ea77e
      measures that term directly and its result supersedes the inherited
      model when available.
    - >-
      The per-target yield is proportional to B^m / (m! N) as KN-FIND-007's
      conserved mean gives; this is used to state the predicted slope and is
      inherited, not re-measured here.
    - >-
      ONE SHARED COST MODEL with the yield-charged descent record
      (IDEA-20260727-002). If the two charge overlapping stages under
      different models their outputs cannot be added, and the ICEX aggregate
      would be wrong in a way nobody notices. That coordination obligation is
      recorded as an assumption, not left implicit.
  proof_search_map:
    bottleneck: >-
      The conversion from a per-attempt success rate into an expected charged
      cost per accepted relation. The exact step whose removal changes the
      lane's second input is 'divide the summed attempt and rerandomization
      cost by the acceptance rate, over a base-size sweep'.
    baseline_embedding:
      parameter_slice: >-
        ZERO-COST RERANDOMIZATION AND UNIT ATTEMPT COST- the charged cost per
        accepted relation must then collapse to exactly 1/P(decomp), i.e. to
        the lane's currently reported statistic's reciprocal, reproducing the
        existing measurement identically.
      reproduction_check: >-
        Frozen fixture- at the lane's existing RELN cells the collapsed
        estimator must reproduce the committed P(decomp) values to within
        their reported estimator noise. A mismatch means the counting
        convention differs from the lane's and nothing downstream may be
        read.
    observation_collision:
      observable: >-
        The charged cost per accepted relation alone.
      distinct_preimage_search: >-
        COLLISION EXHIBITED. The same charged cost per accepted relation
        arises from a cheap attempt with a low acceptance rate and from an
        expensive attempt with a high one, and from a cheap attempt with an
        expensive rerandomization. The scalar does not identify the
        configuration; the identifying triple is (attempt cost,
        rerandomization cost, acceptance rate), and every row must carry all
        three - which is exactly why the lane's single collapsed counter is
        being split.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The charged cost per accepted relation as an explicit three-counter
          function of base size, with the linear-algebra term added and the
          joint optimum located as an interval.
        predicted_gain: >-
          Converts a probability into the cost an exponent actually consumes,
          and prices whether the optimum needs refining at all. NO ATTACK
          EXPONENT IS MOVED IN EITHER DIRECTION.
    quantifier_order: >-
      CLAIMED. FOR ALL tested base sizes B in the swept range, at fixed p and
      m, the measured log-log slope of charged cost per accepted relation
      against B equals theta_measured - m within 0.3. NOT CLAIMED- anything
      outside the tested base-size range; anything at medium or
      cryptographic scale; that the located optimum transfers; and anything
      about elliptic curves specifically, pending the curve-free arm.
    method_ceiling:
      strongest_certifiable_claim: >-
        'At the tested toy sizes and base-size range, under the declared
        charging convention, the expected charged cost per accepted relation
        is X with interval Y, its slope in B is Z, and the joint optimum with
        the inherited linear-algebra term lies in interval B*.' It can NEVER
        certify the inherited linear-algebra model, any asymptotic behaviour,
        or that the located optimum is the optimum at any untested size.
      nearby_object_control: >-
        THE RANDOM-SET FACTOR BASE at matched size, which supplies the
        charged cost under BIRTHDAY-ONLY supply and is the reference any
        algebraic base must beat. A method that reports the same charged cost
        for an algebraic base and a random base of the same size has not
        identified the structure it claims to measure.
    proof_obligations:
      - claim: >-
          The zero-cost-rerandomization, unit-attempt-cost slice collapses to
          1/P(decomp) and reproduces the lane's committed values.
        responsibility: baseline
      - claim: >-
          The three counters respond to the costs they claim to measure
          (expensive rerandomization raises, zero-cost lowers).
        responsibility: correctness
      - claim: >-
          The measured slope equals theta_measured - m within 0.3.
        responsibility: runtime
      - claim: >-
          The optimum is reported as an interval with its exponent
          sensitivity, never as a point.
        responsibility: strictness
      - claim: >-
          No cell with zero accepted relations is assigned a cost.
        responsibility: feasibility
    not_applicable_reason: null
  rerandomization: >-
    The rerandomization here is the ATTEMPT-GENERATION device, not a
    worst-to-average-case reduction- each fresh randomized instance is a new
    scalar-multiplied target from which a decomposition is attempted. Its
    COST is the term this hypothesis exists to charge, and no mixing-time
    claim is made or relied on. A record that used this device to claim a
    worst-case-to-average-case reduction would need a mixing-time
    justification that this hypothesis does not supply and does not assert.
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-RELN-CHG-1
      formal_statement: >-
        The expected charged cost per accepted relation equals
        (mean attempt cost + mean rerandomization cost) / P(decomp), with
        attempts independent and identically distributed at fixed base size.
      random_model_justification: >-
        The rigorous ingredient is Wald's identity for the expected number of
        Bernoulli trials to first success, which gives the 1/P factor
        EXACTLY. The distributional ingredient is the i.i.d. assumption
        across attempts, imitating the model in which every target is an
        independent draw with the same decomposition probability. THE GAP,
        AND WHY THIS IS A HEURISTIC- if P(decomp | target) is heavy-tailed
        across targets, attempts are NOT identically distributed, the formula
        UNDERSTATES the true expected cost, and the understatement
        concentrates on exactly the low-P targets that dominate the total.
      supporting_results:
        - ref: KN-FIND-007
          provenance: internal
          claim: >-
            The EXACT mean per-target decomposition yield
            'E_r[c_D(r)] = binomial(B + m - 1, m) / N for every base of size
            B, independently of how D is chosen', and its own explicit
            statement that it 'says nothing about the cost of finding a
            decomposition (the summation-polynomial / point-decomposition
            solve) or about the linear-algebra stage - which is where the
            index-calculus cost actually sits'. That second sentence is this
            hypothesis's warrant- the quantity priced here is exactly the one
            KN-FIND-007 declares out of its own scope.
          verified_by: >-
            coordinator, TASK-20260904-e87737 (finding read in full this
            task, 96 lines; both quoted passages are verbatim)
        - ref: RQ-RELN-001
          provenance: internal
          claim: >-
            That the lane's decision target is a frozen measurement protocol
            for P(decomp) against base size with explicit controls, which is
            the statistic this hypothesis converts into a cost.
          verified_by: >-
            coordinator, TASK-20260904-e87737 (question record read in full)
      validation_experiment_ids:
        - EXP-ICEX-354d3a
      falsification_condition: >-
        Measured charged cost per accepted relation diverging from the
        formula's prediction (computed from the SEPARATELY measured
        components) by more than the estimator noise, particularly on the
        lowest-P decile of targets. The contract's tail check computes
        exactly that restricted divergence.
  structural_ingredients:
    - description: >-
        Wald's identity for the expected number of Bernoulli trials to first
        success, giving the 1/P factor exactly.
      citation: elementary probability; no external source relied on
      provenance: internal
      verified_by: coordinator, TASK-20260904-e87737
      role: the rigorous half of the charged-cost formula
    - description: >-
        The conserved per-target decomposition yield across base geometries,
        exactly binomial(B + m - 1, m) / N, which fixes the m in the
        predicted slope.
      citation: KN-FIND-007
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-e87737 (read in full this task, 96 lines)
      role: the m in the predicted slope theta - m
    - description: >-
        The lane's decision target and its control obligations.
      citation: RQ-RELN-001
      provenance: internal
      verified_by: coordinator, TASK-20260904-e87737
      role: the statistic being converted into a cost
  reduction_chain:
    core_problem: >-
      The expected charged cost per accepted relation as a function of factor
      base size, at toy scale, with attempt, failure and rerandomization
      costs separated.
    corollaries:
      - problem: >-
          One input to the charged ICEX exponent comparison.
        reduction_ref: >-
          Internal- the comparison itself is RQ-ICEX-001's and is not
          performed here. No published reduction is cited.
        asymptotics_preserved: >-
          Not applicable- no asymptotic statement is made or transferred.
  predictions:
    - metric: >-
        P1- response of charged cost per accepted relation to a deliberately
        expensive rerandomization, in CHARGED GROUP OPERATIONS
      direction: higher
      minimum_effect: >-
        FORCED TO RISE by c_extra / P(decomp) within +/- 15 percent, where
        c_extra is the declared injected cost. A measured rise below half the
        predicted value means the counter is not wired through and VOIDS
        every number in the run.
    - metric: >-
        P2- response to zero-cost rerandomization (instance reuse), in
        CHARGED GROUP OPERATIONS
      direction: lower
      minimum_effect: >-
        FORCED TO FALL by the rerandomization channel's separately measured
        share within +/- 15 percent. A charged cost insensitive to
        rerandomization cost means the instrumentation is not measuring what
        it claims.
    - metric: >-
        P3- log-log slope of charged cost per accepted relation against
        factor base size B, DIMENSIONLESS
      direction: lower
      minimum_effect: >-
        PRE-REGISTERED EQUAL TO theta_measured - m WITHIN +/- 0.3, where
        theta is measured in the SAME run from the attempt-cost counter. Two
        independent falsifiers- a deviation above 0.3, and a slope at or
        above 0, which would contradict the supply model outright and is more
        interesting than the predicted outcome.
    - metric: >-
        P4- location of the joint optimum B* with the inherited
        linear-algebra term included, in FACTOR-BASE ELEMENTS
      direction: different
      minimum_effect: >-
        REPORTED AS AN INTERVAL, never as a point estimate, with the
        interval's construction declared before the run.
    - metric: >-
        P5- sensitivity of the derived exponent to B* across a
        factor-of-four range in base size, DIMENSIONLESS
      direction: different
      minimum_effect: >-
        PRE-REGISTERED DECISION RULE- if the exponent varies by LESS than its
        own confidence interval across that range, the optimum does not need
        refining and the lane records that and stops refining it. That
        budget-saving negative is a legitimate deliverable and is declared in
        advance so it cannot be read as a failure.
    - metric: >-
        P6- curve-free null- the same log-log slope measured on subset-sum
        membership over a size-B subset of (Z/NZ, +) at matched supply
      direction: different
      minimum_effect: >-
        PREDICTED EQUAL to the curve arm's slope within +/- 0.3. If it is,
        the slope is a property of the SUPPLY MODEL and no measured slope in
        this lane may be read as a statement about elliptic curves. A
        departure above 0.3 IS the curve-specific content and is the
        interesting outcome.
  test_boundary:
    instances:
      - toy prime-field short-Weierstrass curves of prime order at the lane's existing RELN fixtures
      - >-
        CURVE-FREE ARM- subset-sum membership over a size-B random subset of
        (Z/NZ, +) at matched N and matched supply law, with no curve
        arithmetic anywhere in the arm
    parameters:
      p: 'the lane''s existing toy ladder'
      m: '2 and 3'
      B: 'swept over at least a factor-of-16 range at each p, with at least 100 targets per cell'
      kappa: '1, 10, 100 field multiplications per group operation'
      rerandomization_arm: 'normal, deliberately expensive (declared c_extra), zero-cost (instance reuse)'
    implementation: >-
      Instrumentation and post-processing of the lane's EXISTING RELN attempt
      logs where they retain per-attempt outcomes, plus a bounded instrumented
      re-run where they do not. Stage 1's first task is to determine which
      case applies and to report it; the cheapest version of this work
      consumes runs the lane has already paid for.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 3.0
      maximum_memory_gb: 8
      maximum_runs: 24
  falsification_conditions:
    - >-
      F1. Charged cost does not respond to rerandomization cost.
      INSTRUMENTATION NOT WIRED- all numbers void; an infrastructure outcome
      under AGENTS.md rule 5, never a mathematical finding.
    - >-
      F2. The three costs cannot be separated in the available logs or in a
      fresh instrumented run. Report the COMBINED counter and WITHDRAW the
      decomposition claim; do not estimate a split.
    - >-
      F3. The measured slope differs from theta_measured - m by more than
      0.3. The pre-registered scaling law is wrong at the tested sizes and
      the formula must be repaired before its output is fed to any
      comparison.
    - >-
      F4. Charged cost is FLAT or RISING in B. This contradicts the supply
      model and must be investigated before any optimum is reported; it is
      the most interesting available outcome.
    - >-
      F5. The lowest-P-decile tail check shows the measured cost exceeding
      the formula's prediction by more than the estimator noise.
      HEUR-RELN-CHG-1's i.i.d. assumption fails, the formula UNDERSTATES the
      cost, and every number derived from it is an underestimate that must be
      labelled as one.
    - >-
      F6. The curve-free arm's slope differs from the curve arm's by more
      than 0.3. That difference is the curve-specific content and requires
      explanation before either arm is cited.
    - >-
      F7. The exponent is insensitive across the whole tested base-size
      range. The optimum does not matter; report it and stop refining it.
  interpretation_limits:
    - >-
      PRODUCES A COST INPUT, NOT A COMPARISON. The ICEX exponent decision
      remains RQ-ICEX-001's and nothing here closes it.
    - >-
      TOY SCALE ONLY. The located optimum is a TOY optimum and does not
      transfer; no statement here is about medium or cryptographic
      parameters, and the transfer is explicitly NOT tested.
    - >-
      OPERATION-COUNT BASED AND THEREFORE PORTABLE- but the attempt-cost
      CONSTANT depends on implementation maturity, and an unoptimised attempt
      procedure inflates attempt cost uniformly and shifts the optimum toward
      LARGER bases, the direction that flatters index calculus. That
      asymmetry travels with the reported optimum.
    - >-
      INHERITS THE LANE'S LINEAR-ALGEBRA MODEL AND IS NO BETTER THAN IT. A
      wrong second term relocates the optimum silently; the sensitivity
      analysis is the only defence and must be reported alongside the
      optimum, never separately. EXP-ICEX-7ea77e measures that term and
      supersedes the inherited model when it lands.
    - >-
      DOUBLE-COUNTING RISK WITH THE YIELD-CHARGED DESCENT RECORD
      (IDEA-20260727-002) if the two charge overlapping stages under
      different models. One shared cost model is a recorded coordination
      obligation, not a footnote.
    - >-
      IF THE CURVE-FREE ARM REPRODUCES THE SLOPE, as predicted, the finding
      is about the supply model and not about elliptic curves. Recorded
      before the run so a confirmation cannot be upgraded afterwards.
  status: proposed
  proposed_by: coordinator
  proposed_at: '2026-09-04'
  specified_under_task: TASK-20260904-e87737
