hypothesis:
  id: H-SSI-7fe2bf
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  batch_id: BATCH-b3c87f
  source_proposal: IDEA-20260803-48e258
  experiment_ids: [EXP-SSI-697354]

  title: >-
    The Wesolowski/Delfs-Galbraith comparison is decidable as a locus p*(w) where
    it is undecidable as a scalar margin, and its SIGN is fixed by the
    memory-charging convention rather than by the corrected per-entry estimator

  statement: >-
    ASSUMING Wesolowski's Heuristic 1 (unvalidated in this corpus; NC-3/NC-6 is
    failed_infrastructure per EV-WESO-b6ceff and KN-FIND-d1c853) AND the numbered
    heuristics HEUR-XO-1..3 below, the following four claims hold about the
    COMMITTED numbers only, and about no executed attack:
    (H1) RECONSTRUCTIBILITY. The committed concrete-cost bracket of EV-SSI-59f7a2
    (2^{118.5} to 2^{123} at SQIsign NIST-I) is reconstructible by arithmetic on
    two committed tables alone - the 8-row toy per-entry table T1 and the 5-row
    paper Section 4.1 table T2 - to within 0.25 bits at both endpoints, with no
    new measurement and no unavailable dependency.
    (H2) CONVENTION-DOMINANCE. Over the tested window log2 p in [256, 768] and
    log2 w in [20, 272.2], the SIGN of (matched-baseline cost minus corrected
    attack cost) is determined by which side of the comparison is charged the
    van Oorschot-Wiener memory discount, and NOT by the corrected per-entry
    estimator. Two committed artifacts adopt opposite conventions
    (EXP-P13VOW-001 charges the attack; the paper's Section 1.1 statement as
    quoted in RT-20260805-92751c OBJ-5 charges the baseline), and the two
    conventions yield opposite signs at every tested cell.
    (H3) RECONDITIONING. The width of the p*(w) band in log2 p, propagated from
    the same committed inputs, is narrower AS A FRACTION OF ITS VALUE than the
    margin band is as a fraction of the margin at the matched (log2 p = 256,
    log2 w = 30) point. This is the proposal's central and falsifiable claim.
    (H4) INSTRUMENT LIVENESS. The corrected per-entry estimator displaces the
    margin surface by at least 11.9 bits relative to the superseded
    one-operation-per-entry convention it replaced, so the correction is
    load-bearing for this object rather than decorative.
    NOTHING in this hypothesis asserts that SQIsign is broken, weakened, or that
    any parameter set is unsafe. Every quantity is a cost-model extrapolation of
    a p <= 2^40 measurement, carried to log2 p in [256, 768] under HEUR-XO-1.

  mechanism: >-
    WHY A LOCUS IS BETTER CONDITIONED THAN A SCALAR. The two cost curves scale
    differently in p - the assessed method as p^{1/3+o(1)} with a large measured
    per-entry overhead, the matched baseline as p^{1/2} - so their difference is
    monotone in log2 p and its zero crossing is a well-defined function of the
    memory budget w. A margin evaluated at one (p, w) inherits the FULL width of
    the overhead uncertainty. A crossing point inherits only how fast the
    difference moves through zero, which is governed by the difference of the
    exponents (about 1/6 per bit of log2 p) and is therefore far better
    conditioned. That is the entire reconditioning mechanism, and H3 is the test
    of whether it actually delivers.
    WHY THE SIGN IS A CONVENTION AND NOT A MEASUREMENT. The committed record
    contains two incompatible chargings of the same van Oorschot-Wiener
    time-memory law.
    Convention MC-P13 (EXP-P13VOW-001, transcribed at
    coordination/tasks/TASK-20260724-P13-VAL/repro/experiments/EXP-P13VOW-001/cost_model.py
    line 236: "T_w_vOW = T_full / sqrt(min(w, M))") applies the memory discount to
    the ASSESSED METHOD and compares against a memoryless baseline 2^{log2p/2}.
    Under MC-P13 more memory helps the attack, so p*(w) is non-increasing in w,
    and EV-WESO-001 records the consequence: "with zero hidden overhead the vOW
    middle regime beats Delfs-Galbraith at every tested budget w = 2^30..2^80 for
    all five sizes".
    Convention MC-VOW (the paper's own Section 1.1 statement as quoted in
    RT-20260805-92751c OBJ-5: "time p^{1/2+o(1)}/(w^{1/2}*n) with memory w")
    applies the discount to the BASELINE and requires the assessed method to fit
    its own table in memory (log2 w >= L_mem(p)) before it may be costed at all.
    Under MC-VOW more memory helps the baseline, so p*(w) is non-decreasing in w,
    and RT-20260805-92751c CMC-4 records the consequence: "At any feasible memory
    w, VW gives time p^{1/2}/w^{1/2} ~ 2^{128}".
    These are not two estimates of one quantity; they are two different
    quantities, and the campaign has been quoting a single margin without saying
    which. H2 predicts the two produce OPPOSITE SIGNS at every tested cell, which
    means the INCONCLUSIVE NIST-I margin is not primarily an uncertainty about
    overhead magnitude - it is an unstated modelling choice. The experiment does
    not adjudicate which convention is correct; it makes the dependence explicit
    and carries both, which is the honest object.
    WHY THE ESTIMATOR CORRECTION MUST BE SHOWN TO MOVE SOMETHING. The corrected
    per-entry law is the whole BATCH-046 contribution. If the same procedure run
    with the superseded one-operation-per-entry convention returns the same
    curve, the correction is not doing the work claimed for it here. H4 forces
    that demonstration rather than assuming it.

  assumptions:
    - >-
      Every input is a committed number bound by repository path, JSON pointer or
      line number, and re-hashed at run time. No number is invented, recalled, or
      interpolated beyond a declared window. A quantity that is neither committed
      nor transcribable makes its cell UNDEFINED, never estimated.
    - >-
      The baseline constant k_DG is NOT independently transcribed. KN-TECH-050 is
      explicit that the corpus is "insufficient to state what the matched baseline
      costs", and EV-WESO-b6ceff records that the bibliographic subtask retrieved
      the three sources but that "Constant k not explicitly stated in abstracts".
      The contract therefore emits the RATIO form as primary and the absolute
      locus only at the paper's own stated convention (previous methods
      "~ 2^{log2p/2}", i.e. log2 k_DG = 0), flagged
      independently_transcribed: false, with a reported sensitivity of the locus
      to log2 k_DG so a reader may shift it for any k they hold.
    - >-
      The o(1) in p^{1/3+o(1)} is not a constant and this hypothesis treats the
      committed 5-row table as its only handle on it. That table's own o(1)
      signature (L_paper(P) - P/3) is measured as a data check rather than
      assumed away.
    - >-
      The eighteen measured-gamma readings and the c bracket [1.327077, 1.576444]
      of GOAL-P13-001's BATCH-002/003 are NOT used. They lie outside this task's
      declared read scope and IDEA-20260803-48e258 forbids citing c as a number.
      The overhead axis used instead is the committed SCENARIO form
      2^{c*sqrt(log2 p)} named in EV-WESO-001, at the c values that record names
      (c = 0 as "the most attack-favorable corner, not a neutral default", and
      c ~ 1.8 as "a defensible calibration"), extended by the committed
      EXP-P13VOW-001 grid values.
    - >-
      The red team's designation of EV-SSI-59f7a2 as SLIGHTLY UNDERSTATED stands
      and is carried: the AES-equivalence axis is evaluated at all four committed
      alpha values, and the attacker-favourable pure-RAM corner is reported AS a
      corner, never as the default.

  proof_search_map:
    bottleneck: >-
      The decision-changing step is not a proof step but a reporting step: a
      scalar margin whose uncertainty band (4.8 bits across measured-gamma
      readings, widening to 13.94-16.62 bits across alpha choices, per
      analysis/SSI-ECDLP-SYNTHESIS-20260803.md) exceeds the precision the
      decision needs, so concrete_threat_nist1 cannot leave INCONCLUSIVE. The
      bottleneck is the SHAPE of the emitted object, and the audit below asks
      whether changing that shape buys anything.
    baseline_embedding:
      parameter_slice: >-
        log2 p = 256 (SQIsign NIST-I, p = 5*2^248 - 1), unbounded memory,
        memoryless baseline 2^128, F_{p^2}-operation and AES-equivalent units.
        This is exactly the slice at which EV-SSI-59f7a2 evaluated its bracket.
      reproduction_check: >-
        Frozen regression fixture RG-1..RG-5 in EXP-SSI-697354. The contract must
        recover 2^{118.5} (F_{p^2}-ops, S = 0) and 2^{123} (AES-equivalent,
        hardware model, S = 3.0) from T1 and T2 to within 0.25 bits under EVERY
        one of the four declared per-entry laws, and must cover the committed
        6-11 bit gap-below-target interval of RT-20260805-92751c. Failure voids
        the run; nothing else may be emitted. This is the proposal's F1.
    observation_collision:
      observable: >-
        The locus p*(w) - the smallest log2 p inside the fitted window at which
        the corrected assessed-method cost falls at or below the matched-baseline
        cost at memory budget w - together with its categorical outcomes
        NO_CROSSOVER_IN_WINDOW and INFEASIBLE_AT_MEMORY.
      distinct_preimage_search: >-
        A collision IS expected and is the point of the null-object control: the
        superseded one-operation-per-entry estimator and the corrected estimator
        are two distinct preimages that could map to the same locus. The
        additional condition that separates them is pre-registered as a minimum
        displacement of 11.9 bits on the margin surface (H4). If they do not
        separate, the observable does not identify the estimator and the record
        must be re-described - that is the proposal's F4 and it is admitted as a
        publishable negative.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Replace the scalar margin at one (p, w) by the fiber of the sign map
          over the (log2 p, log2 w) rectangle, reported as a boundary locus plus
          categorical labels where no boundary exists in-window.
        predicted_gain: >-
          The band on the boundary location is predicted narrower as a fraction of
          its value than the band on the margin (H3), because the boundary
          inherits only the exponent difference (about 1/6 per bit) rather than
          the full overhead width.
      - transform: specialization_pack
        proposed_object: >-
          The memory-charging convention promoted from an implicit modelling
          choice to an explicit two-valued axis {MC-P13, MC-VOW}, each traceable
          to a committed artifact.
        predicted_gain: >-
          Converts an unstated assumption into a reported one and predicts (H2)
          that it, not the estimator, controls the sign.
    quantifier_order: >-
      FOR ALL declared scenario tuples theta = (per-entry law, structural
      surcharge S, unit conversion A, overhead scenario c, memory-charging
      convention MC) and FOR ALL declared memory budgets w in the 14-value grid,
      THERE EXISTS a well-defined outcome in
      {numeric p* in [256, 768], NO_CROSSOVER_IN_WINDOW with both endpoint signs,
      INFEASIBLE_AT_MEMORY, MULTIPLE_ROOTS with all roots listed}.
      The scenario grid is fixed BEFORE evaluation; no theta is chosen after
      seeing an outcome; and no p* is ever reported outside [256, 768], for any
      theta or w, under any circumstance.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Under the committed inputs T1 and T2, and conditional on Heuristic 1 and
        HEUR-XO-1..3, the corrected cost model places the assessed method's
        crossing against the matched baseline at <locus or categorical label>
        over the tested (log2 p, log2 w) rectangle, with the tested band, and the
        sign of the comparison is controlled by the memory-charging convention."
        That is the ceiling. It is a statement about a MODEL, never about the
        security of any deployed parameter set, and it cannot rise above it
        no matter how the run comes out.
      nearby_object_control: >-
        The superseded Velu-based per-entry estimator (2^{9.8} per entry,
        concrete_cost_analysis.md line 31, superseded by RT-20260805-92751c
        OBJ-3) is the nearby object: same shape, same procedure, a different
        committed number. Its displacement must be strictly SMALLER than the
        one-operation-per-entry null's at every evaluated p. If a procedure
        cannot order these two nulls correctly it is not resolving the estimator
        at all.
    proof_obligations:
      - claim: The committed EV-SSI-59f7a2 bracket is reconstructible from T1 and T2.
        responsibility: baseline
      - claim: The two memory-charging conventions yield opposite signs in-window.
        responsibility: correctness
      - claim: The locus band is proportionally narrower than the margin band.
        responsibility: size
      - claim: The corrected estimator displaces the margin surface by >= 11.9 bits.
        responsibility: strictness
      - claim: Every emitted number carries its extrapolation ratio and its conditionality.
        responsibility: scope
      - claim: The root solver never reports a root outside the fitted window.
        responsibility: interface
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null

  heuristic_assumptions:
    - id: HEUR-XO-1
      formal_statement: >-
        Let e(P) denote the mean count of F_{p^2}-multiplications per table entry
        in Wesolowski Algorithm 1 at a prime of size P = log2 p. The affine law
        e(P) = a*P + b, fitted to the 8 committed rows of T1 over P in [9, 40],
        extends to P in [256, 768] with the SAME coefficients, uniformly in P.
      random_model_justification: >-
        Structural, not distributional. The per-call root-finding cost of
        Phi_ell(j, X) over F_{p^2} is dominated by the x^{p^2} step, whose
        schoolbook cost is exactly linear in log2 p at fixed ell (the analytical
        counting rule recorded in cost_measurements.json metadata:
        "2*log2(p) * ((ell+1)^2 + (ell+1))"). The linear-in-log2 p form is
        therefore a property of the counting rule, not of the sample.
      supporting_results:
        - >-
          RIGOROUS PART, WEAK: the counting rule in
          coordination/goals/GOAL-SSI-001/batches/BATCH-046/tasks/TASK-20260804-55952a/implementation/cost_measurements.json
          metadata.counting_method is exactly linear in log2 p at fixed ell.
        - >-
          MEASURED PART: EV-WESO-b6ceff / KN-FIND-4e7a92 measure the p-scaling
          exponent alpha = 1.1321 at ell in {47,101,151,211}, i.e. a 13% EXCESS
          over the linear prediction, and KN-FIND-4e7a92 records that this excess
          "has not been propagated into any margin row in the c-table". This
          contract propagates it as the declared sensitivity law L5 and reports
          the displacement.
        - >-
          NOT SUPPORTED: the extension in ell. T1 exercises only ell in {2,3,5}
          (cost_measurements.json scaling_summary primes_used), while
          RT-20260805-92751c OBJ-1 states the operating ell at NIST-I is far
          larger and that per-entry cost rises with it. The linear extrapolation
          is recorded there as approximating the FFT figure only because two
          errors partially cancel. This is the largest single weakness of
          HEUR-XO-1 and it is carried on the face of every emitted number.
      validation_experiment_ids: []
      validation_route: >-
        Re-run the toy per-entry measurement with B covering primes up to at
        least 23 at the largest feasible p (RT-20260805-92751c CTRL-1), and
        re-derive the exact log p dependence of the root-finding step
        analytically. Until then every emitted number carries
        extrapolation_ratio = P/40 in [6.4, 19.2] and the label
        fit_window_extrapolation: true.
      falsification_condition: >-
        A per-entry measurement at any p > 2^40, at ell in the operating range,
        deviating from the fitted affine law by more than 1.0 bit; or a
        derivation showing the ell-dependence at NIST-I operating B exceeds the
        L5 sensitivity band (about 0.36-0.56 bits) by more than 2 bits.

    - id: HEUR-XO-2
      formal_statement: >-
        The matched Delfs-Galbraith / previous-methods baseline at prime size
        P = log2 p and memory budget w costs 2^{P/2} * k_DG F_{p^2}-operations at
        negligible memory (convention MC-P13), or 2^{P/2} * k_DG / sqrt(w)
        (convention MC-VOW), with log2 k_DG = 0.
      random_model_justification: >-
        None claimed. log2 k_DG = 0 is a TRANSCRIPTION of the paper's own
        previous-methods column, not a derivation: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
        lines 234-238 give exactly 2^128, 2^192, 2^256, 2^288, 2^384 at
        P = 256, 384, 512, 576, 768, which is 2^{P/2} to the stated precision.
      supporting_results:
        - >-
          The paper's own table, committed verbatim, is internally consistent
          with k_DG = 1 at all five rows.
        - >-
          KN-TECH-050 states the corpus is "sufficient to stop a matched-baseline
          recommendation from being made against the wrong algorithm, and
          INSUFFICIENT to state what the matched baseline costs". EV-WESO-b6ceff
          records the three bibliographic sources as retrieved with the constant
          k NOT stated in the abstracts.
      validation_experiment_ids: []
      validation_route: >-
        Transcribe k_DG with a quoted excerpt and a hash from Sutherland
        (ANTS X 2013), Santos-Costello-Shi, or Adj et al., or from the Wesolowski
        body as EV-WESO-b6ceff indicates is required. Until then the ratio form is
        primary, the absolute locus is emitted only at log2 k_DG = 0 with
        independently_transcribed: false, and the sensitivity d(p*)/d(log2 k_DG)
        is reported at every w.
      falsification_condition: >-
        A transcribed log2 k_DG whose magnitude exceeds the reported sensitivity
        band, i.e. one that moves p*(w) outside the emitted band at any tested w.

    - id: HEUR-XO-3
      formal_statement: >-
        Exactly one of the two committed memory-charging conventions describes the
        physically correct comparison at every (P, w): either the van
        Oorschot-Wiener discount attaches to the assessed method (MC-P13) or it
        attaches to the matched baseline (MC-VOW), and the assessed method is
        available only where its table fits, log2 w >= L_mem(P).
      random_model_justification: >-
        None. This is a modelling-coherence assumption introduced by THIS
        hypothesis, not inherited. It is stated because the corpus contains both
        chargings and no record reconciles them.
      supporting_results:
        - >-
          MC-P13 is committed: EXP-P13VOW-001 formula "T_w_vOW = T_full /
          sqrt(min(w, M))" with baseline "T_DG_baseline = p^{1/2}", and its
          consequence in EV-WESO-001 ("beats Delfs-Galbraith at every tested
          budget w = 2^30..2^80 for all five sizes").
        - >-
          MC-VOW is committed: the paper's Section 1.1 law as quoted in
          RT-20260805-92751c OBJ-5, and its consequence in CMC-4 ("At any feasible
          memory w, VW gives time p^{1/2}/w^{1/2} ~ 2^{128}").
        - >-
          MC-P13 has a declared coherence pathology: as written it makes the
          assessed method CHEAPER as memory shrinks below M, which no physical
          cost model should permit. The contract audits and reports this
          (SANITY-1) rather than propagating it silently.
      validation_experiment_ids: []
      validation_route: >-
        A derivation note deriving the vOW time-memory law for BOTH the
        table-based assessed method and the golden-collision baseline from one
        cost model, so that the discount's attachment is derived rather than
        chosen. This is the single highest-value cheap follow-up this hypothesis
        identifies.
      falsification_condition: >-
        A derivation showing one convention is internally incoherent at some
        (P, w) in the tested rectangle, or showing that the correct law attaches
        the discount to BOTH sides simultaneously (in which case both committed
        conventions are wrong and every margin row in the campaign is
        mis-charged).

    - id: HEUR-1-INHERITED
      formal_statement: >-
        Wesolowski Heuristic 1, verbatim as recorded in
        docs/claims-and-verification.md: for E/F_{p^2} uniformly random
        supersingular, the degree of the smallest isogeny E -> E^{(p)} is
        B-smooth with probability at least u^{-u(1+o(1))},
        u = log(p/2)/(3 log B), uniformly for (log p)^eps < u < (log p)^{1-eps}.
      random_model_justification: >-
        Inherited verbatim from the source result; not restated or weakened here.
      supporting_results:
        - >-
          NOT VALIDATED IN THIS CORPUS. EV-WESO-b6ceff: "NC-3/NC-6:
          failed_infrastructure (executor returned empty result). Per AGENTS.md
          rule 5: not evidence. Heuristic 1 tail validation remains OPEN."
          KN-FIND-d1c853 records the same as the dominant open uncertainty.
      validation_experiment_ids: []
      validation_route: >-
        EXP-P13-NC36 (the existing, unexecuted validation plan). THIS HYPOTHESIS
        DOES NOT VALIDATE, SUBSTITUTE FOR, OR REDUCE THE NEED FOR THAT PAIRING,
        and no citation of it may suggest otherwise. Correct sequencing is
        nonetheless to emit the locus first, because the locus tells the sampler
        which p range it must reach to matter.
      falsification_condition: >-
        As recorded in the source result. If it is refuted or repaired, every
        curve emitted under EXP-SSI-697354 is RECOMPUTED, never defended.

  structural_ingredients:
    - description: >-
        Wesolowski Section 4.1 concrete-cost table: 5 rows of (log2 p,
        log2 time lower bound, log2 memory lower bound, previous-methods log2
        time), obtained by optimizing B under a one-F_{p^2}-operation-per-entry
        convention that the paper itself labels a deliberate underestimate.
      citation: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md lines 226-240
      role: absolute anchor for both cost curves and for the memory column
    - description: >-
        van Oorschot-Wiener time-memory interpolation for collision search,
        time p^{1/2+o(1)}/(w^{1/2}*n) at memory w on n processors.
      citation: >-
        paper Section 1.1 as quoted in
        coordination/goals/GOAL-SSI-001/batches/BATCH-046/tasks/TASK-20260804-55952a/red_team_concrete_cost.yaml
        OBJ-5 (verified external reference recorded in EV-WESO-001: "van
        Oorschot-Wiener [43] verified")
      role: the memory axis of the deliverable
    - description: >-
        Regime map for supersingular isogeny path-finding baselines - field
        regime, memory model, degree constraint - which forbids naming "the"
        baseline without naming all three.
      citation: knowledge/techniques/KN-TECH-050.md
      role: >-
        constrains the comparison to be well-posed; simultaneously the source of
        the standing warning that the corpus cannot supply the baseline constant

  reduction_chain:
    core_problem: >-
      None. No problem is solved and no algorithm is proposed. The object is a
      report shape over committed numbers.
    corollaries: []

  predictions:
    - metric: reproduction_gate_residual_at_committed_point
      direction: different
      minimum_effect: >-
        At log2 p = 256, memoryless baseline, F_{p^2}-operation units, S = 0:
        all four declared per-entry laws give log2(cost) in [118.25, 118.75],
        reproducing EV-SSI-59f7a2's 2^{118.5} to within 0.25 bits. With
        S = 3.0 the result lies in [121.25, 121.75] (the committed F_{p^2}
        bracket 2^{118.5}-2^{121.5}); applying the committed hardware
        AES-equivalence factor alpha = 3 gives [119.9, 120.4] and [122.9, 123.4],
        reproducing the committed 2^{120}-2^{123}. KNOWN-ANSWER GATE: failure
        voids the entire run (proposal F1).
    - metric: convention_sign_dominance
      direction: different
      minimum_effect: >-
        At every evaluated cell of the (log2 p, log2 w) rectangle, the sign of
        (baseline cost minus assessed cost) under MC-P13 and under MC-VOW
        DIFFER, at c = 0 and S = 0. Replacing the corrected estimator by either
        null does NOT flip the sign under either convention at c = 0. If both
        conventions agree in sign everywhere, H2 is false and the convention is
        not the controlling variable.
    - metric: null_object_displacement_paper_convention
      direction: different
      minimum_effect: >-
        The margin surface computed with the corrected estimator differs from the
        surface computed with the SUPERSEDED one-operation-per-entry convention
        by at least 11.9 bits and at most 14.2 bits at every evaluated cell,
        rising monotonically with log2 p. A displacement below 1.0 bit anywhere
        means the correction is not driving the object (proposal F4) and the
        record must be re-described rather than defended.
    - metric: null_object_displacement_superseded_velu
      direction: different
      minimum_effect: >-
        The displacement against the superseded Velu-model estimator (2^{9.8}
        per entry) is in [1.5, 4.0] bits at log2 p = 256, and is strictly smaller
        than the one-operation-per-entry displacement at EVERY evaluated log2 p.
        An inversion of that ordering means the procedure does not resolve the
        estimator.
    - metric: crossover_band_width_vs_margin_band_width
      direction: lower
      minimum_effect: >-
        At the matched point (log2 p = 256, log2 w = 30), the p*(w) band width
        in log2 p, as a fraction of the band's midpoint, is strictly smaller than
        the margin band width in bits as a fraction of the margin's midpoint.
        THE PROPOSAL'S CENTRAL CLAIM (F2) AND IT CAN FAIL. If fewer than two
        numeric loci exist at that w, the comparison is reported
        NOT_EVALUABLE_FOR_LOCUS with the count, never as a pass.
    - metric: monotonicity_of_locus_in_memory
      direction: different
      minimum_effect: >-
        d(margin)/d(log2 w) = +0.5 exactly under MC-P13 while log2 w < L_mem(P)
        and 0 at or above it (the clamp, whose kink must sit at the committed
        L_mem value to within 1e-9); and -0.5 exactly under MC-VOW wherever the
        assessed method is feasible. Correspondingly p*(w) is non-increasing in w
        under MC-P13 and non-decreasing under MC-VOW. A reversed sign, a missing
        clamp kink, or a flat response is a wiring defect and INVALIDATES the run;
        it is not a mathematical result.
    - metric: preregistered_locus_lower_bound
      direction: different
      minimum_effect: >-
        For every log2 w <= 40 and every one of the declared scenario tuples, NO
        cell reports BOTH a numeric p* at or below 512 AND memory feasibility
        (log2 w >= L_mem(p*)). A cell satisfying both is the campaign's concrete
        threat candidate and triggers mandatory independent review before any
        claim. A cell satisfying the bound only because the assessed method is
        memory-infeasible at that w is reported as VACUOUSLY SATISFIED, in those
        words, and is never presented as a substantive confirmation.
    - metric: scope_axis_separation
      direction: different
      minimum_effect: >-
