  statement: >-
    C(140, 2) is 9730, C(140, 3) is 447580, and C(140, 4) is 15329615,
    which is 35 times 139 times 23 times 137. The proposal's written
    fourth binomial is 15331915, which exceeds that value by 2300.
    The multipliers of degree at most 2 number 9871. The column count
    through degree 4 is 15787066, and the written sum exceeds it by
    the same 2300. The row count is 131 times 9871, which is 1293101.
    The product of the row count and the column count is
    20414270831666, and that product leaves remainder 2 modulo 8.
    The floor byte count is 2551783853958 and the ceiling is one
    larger. The base-2 logarithm of the row count lies strictly above
    2030/100 and strictly below 2031/100. The column logarithm lies
    strictly above 2391/100 and strictly below 2392/100. Both the
    floor and the ceiling byte logarithms lie strictly above 4121/100
    and strictly below 4122/100. For the cap at m = 5 the uncollapsed
    matrix-bit logarithm lies strictly above 3471/100 and strictly
    below 3472/100, so the byte logarithm lies strictly above 3171/100
    and strictly below 3172/100. The collapsed bit logarithm lies
    strictly above 2767/100 and strictly below 2768/100, so its byte
    logarithm lies strictly above 2467/100 and strictly below 2468/100.
    Dividing those byte counts by 32 puts the walk logarithms strictly
    above 2671/100 and 1967/100, and strictly below 2672/100 and
    1968/100. The base-2 logarithm of 131 lies strictly above 703/100
    and strictly below 704/100. In hundredths, 6090 minus 3563 is
    2527, and 3563 plus 500 is 4063. The cap logarithms at m = 4, 6
    and 8 lie strictly below the proposal's written hundredths 3390,
    2342 and 1829.
  mechanism: >-
    The proposal defines sparse matrix bytes, a degree-4 column count,
    and a published storage exponent. This contract checks those
    quantities as integer identities and power comparisons. It does
    not open an archived row and it does not build a matrix.
