hypothesis:
  id: H-ICEX-c273c2
  question_id: RQ-RELN-001
  added: '2026-09-04'
  derived_from_idea: IDEA-20260830-21e7c4
  statement: >-
    THE DECOMPOSITION PROBABILITY IS NOT A PROBABILITY TO BE ESTIMATED. For a factor base V of
    size B, its signed point set W, arity m, and a DECLARED target support H, the probability
    that a uniformly drawn target in H decomposes is exactly the integer ratio
    |mW intersect H| / |H|. There is no randomness anywhere except the choice of V. Four limbs,
    each measurable and separately falsifiable.
    (L1) COST. Exact enumeration costs order min(B^m, N B) charged operations and order
    min(B^m, N) memory; the honest alternative - a sumset-free meet-in-the-middle sampled
    estimator over T targets - costs order T B^{ceil(m/2)} operations and order B^{ceil(m/2)}
    memory. Exact is cheaper exactly when B^{floor(m/2)} < T. THE MEASURED CROSSOVER IN B MUST
    AGREE WITH THAT CONDITION WITHIN A FACTOR OF TWO, on the SAME instances, on the SAME machine,
    under a SINGLE frozen operation-count definition.
    (L2) PRECISION. For comparing two constructions with n bases each, the variance of the
    estimated mean coverage is the base-to-base variance divided by n under exact enumeration,
    and that plus r(1-r)/T divided by n under sampling. If the base-to-base coverage variance is
    of order r(1-r)/N, the ratio of variances is exactly 1 + N/T, which GROWS with N. The
    measured ratio must match that prediction; a measured ratio near 1 falsifies the assumed
    base-to-base variance and is itself a first-class finding, because it would say construction
    comparisons are limited by the base draw rather than by the target draw.
    (L3) CONSISTENCY. The exact value and the archived sampled estimate of the same quantity must
    agree within the sampled estimator's own standard error. A systematic gap that correlates
    with the index of the declared target support in the full group localises the discrepancy to
    a named, already-proposed mechanism; a systematic gap that does not correlate with it is an
    unnamed bias and halts the battery.
    (L4) DECIDABILITY. The deliverable is a per-cell table over (N, B, m, H): the crossover
    verdict, the memory verdict, and the EQUIVALENCE BOUND - how small a coverage-ratio
    difference could be excluded at a stated budget - together with the DECIDABLE or UNDECIDABLE
    label the bound justifies. The bound falls only as one over the square root of the number of
    bases, so the same table read the other way is a scoped no-go: it states, per cell and with
    numbers, which construction comparisons this lane cannot settle.
    NO ATTACK, NO ALGORITHM AND NO EXPONENT IS CLAIMED. The exponents that appear are the
    INSTRUMENT'S own costs and may not be quoted as cryptanalytic.
  mechanism: >-
    TWO PROJECTIONS ARE IN PLAY AND DISTINGUISHING THEM IS THE WHOLE CONTENT. The projection from
    a base to the support size of its m-fold sumset intersected with the declared target support
    is genuinely lossy - it forgets which targets are hit, every multiplicity above one, and the
    group beyond its order - and it is lossy compatibly, because membership in the sumset is
    determined by the group law alone and the support size is exactly what a uniform target's
    success probability integrates. The SECOND projection, from that support size to a sampled
    hit count out of T draws, is also lossy, and that is the defect: it discards information the
    computation already holds, at a quantified price of 1 + N/T in variance.
    WHY THIS IS A DISCRIMINATION AND NOT AN ASSERTION. Two accounts of the sampling stage make
    opposite predictions. Under the first, sampling buys something real - robustness to an
    enumerator bug, feasibility where the sumset does not fit, or comparability with a
    solver-based pipeline that must sample - and there exist cells where the sumset does not fit
    or where sampling is measurably cheaper. Under the second, below the crossover it buys
    nothing and costs a factor 1 + N/T, and no such cell exists in the ladder. The design does
    not assume which; it measures the crossover on the same instances and reports where it falls.
    WHY THE DELIVERABLE IS AN EQUIVALENCE BOUND RATHER THAN A p-VALUE. The mean per-target yield
    is fixed identically for every base of the same size by a conservation identity this program
    already owns, so a construction comparison can never be a comparison of means; it is
    necessarily a comparison of COVERAGE AT FIXED MEAN, whose total admissible range is bounded
    above by a small constant. A test against a null of exact equality is therefore guaranteed to
    reject eventually for any nonzero difference and says nothing useful. The decidable question
    is how small a difference can be EXCLUDED at a given budget.
    WHY A CURVE-FREE NULL IS MANDATORY. Every quantity above - support size, coverage at fixed
    mean, base-to-base variance, the crossover in B - is defined for an arbitrary finite abelian
    group and a subset of it. A uniformly drawn subset of the integers modulo N, with no curve
    and no group law beyond addition, reproduces the entire signature. Without that arm the
    measured variance law and crossover would invite a reading about elliptic-curve factor bases
    that the measurement does not support.
  assumptions:
    - >-
      The declared target support H is recorded with every measurement. The exact identity is
      meaningful only once H is named, and the committed instrument's H is the cyclic subgroup
      generated by one sampled point, which is not always the whole group. A rate reported
      without H is not comparable across constructions.
    - >-
      The enumerated sumset is correct. This hypothesis measures a COST and a PRECISION, not a
      correctness; exact enumeration removes the visible noise without removing error, so a
      certificate suite for the enumerator is a PREREQUISITE and is named as one rather than
      recommended.
    - >-
      Memory, not time, is the binding constraint on exact enumeration at large group order, so
      the upper crossover is a memory crossover. It is located by bisection and measured, never
      assumed.
    - >-
      Toy scale binds. All arms are at group orders no larger than the declared ceiling; nothing
      transfers to cryptographic scale and nothing is offered that does.
    - >-
      Timings at these sizes are interpreter-bound, so the crossover is read off CHARGED
      OPERATION COUNTS under a single frozen definition, with wall time reported as a consistency
      check rather than as the measurement.
  proof_search_map:
    bottleneck: >-
      The sampled-target membership loop, which runs AFTER the full sumset has been constructed
      and estimates a quantity the constructed object already determines. Removing that single
      step changes both the cost and the precision of every decomposition rate in this lane.
    baseline_embedding:
      parameter_slice: >-
        The number of sampled targets tending to infinity with the sumset built. In that limit
        the sampled estimator converges to the exact ratio, so the exact estimator is the
        boundary of the committed instrument rather than a different measurement. The embedding
        is exact rather than a resemblance.
      reproduction_check: >-
        Frozen fixture, blocking: at each committed cell the exact value must lie inside the
        archived sampled estimator's own interval, and the sampled estimate must converge to the
        exact value as the target count is raised through a declared ladder, at the rate one over
        the square root of the target count. A systematic gap that does not close is a bias in
        one of the two and is reported before anything else.
    observation_collision:
      observable: >-
        The scalar reported decomposition rate at one cell.
      distinct_preimage_search: >-
        COLLISION EXHIBITED. Two distinct ground-truth states give the same reported scalar: a
        base whose sumset covers a fraction of the whole group uniformly across cosets, measured
        against the whole group; and a base whose sumset covers a different fraction with a coset
        bias such that its density within a proper subgroup equals the first fraction, measured
        against that subgroup. The scalar is identical and the two lie on opposite sides of the
        conclusion "this construction covers more targets". The separating condition is the
        declaration of H together with the coset-count vector of the sumset against H, which this
        hypothesis makes mandatory fields. Without them the observable is not identifying, which
        is the concrete reason archived rates from different constructions may not be comparable.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the estimation problem by an exact counting problem: report the integer PAIR
          (size of the sumset intersected with H, size of H) instead of a rate with an error bar.
          The pair determines the rate; the enumeration is exhaustive by construction; soundness
          is delegated to the prerequisite certificate suite.
        predicted_gain: >-
          Sampling variance to exactly zero, and a statistical efficiency gain of 1 + N/T for
          construction comparisons at fixed budget - available only below the measured memory
          crossover, and quoted nowhere else.
      - transform: specialization_pack
        proposed_object: >-
          Build the decidability measure per cell - equivalence bound against budget - adding
          charges only over cells whose enumerations are disjoint, so the table's totals are
          additive and no cell is double counted.
        predicted_gain: >-
          Converts "run the ladder and see" into a pre-run statement of which cells can settle
          which comparison, at what cost.
    quantifier_order: >-
      CLAIMED. FOR ALL bases of size B, FOR ALL arities m, FOR ALL declared target supports H,
      THERE EXISTS an exactly computable integer pair determining the decomposition probability,
      and its computation cost is below the sumset-free sampled estimator's WHENEVER
      B^{floor(m/2)} < T. The witness may depend on the base, the arity and the support; it may
      NOT depend on the target draw, on the seed, or on the group beyond its law - and that
      independence is the falsifiable content, because a measured dependence of the exact value
      on the target seed would mean the instrument is not computing what this record says it
      computes.
    method_ceiling:
      strongest_certifiable_claim: >-
        A per-cell EQUIVALENCE bound at toy scale: at this cell, with this budget, any
        coverage-ratio difference larger than X between the two named constructions would have
        been detected. It can never certify that two constructions are identical, never certify
        anything above the measured memory crossover, and never convert a coverage statement into
        a statement about solve cost or relation rank.
      nearby_object_control: >-
        The two derived reference geometries in this corpus - a concentrated small-multiples base
        whose coverage ratio is far below random, and a Sidon-type base whose ratio is slightly
        above it. The exact protocol must separate BOTH from a matched random base with
        overwhelming margin wherever the table says it can, and must NOT claim separation where
        the table says it cannot. Two controls firing in opposite directions bound the instrument
        on both sides where a single null does not.
    proof_obligations:
      - claim: The decomposition probability for a uniform target in H equals the stated integer ratio exactly.
        responsibility: correctness
      - claim: The two cost models and the crossover condition hold up to curve-independent constants.
        responsibility: runtime
      - claim: The variance ratio of the two estimators for a construction-mean comparison is 1 + N/T under the assumed base-to-base variance.
        responsibility: size
      - claim: The exact estimator is the infinite-target boundary of the committed one and reproduces it within its interval at every cell.
        responsibility: baseline
      - claim: The equivalence bound scales as one over the square root of the base count and the cost per base as min(B^m, N).
        responsibility: scope
      - claim: Every quantity is defined for an arbitrary finite abelian group and is reproduced by a curve-free null.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-EXA-1
      formal_statement: >-
        For bases of size B drawn uniformly at random in a group of order N, the coverage of the
        m-fold sumset has variance across bases of order r(1-r)/N with r the mean coverage;
        consequently the exact-versus-sampled variance ratio for a construction-mean comparison
        is 1 + N/T.
      random_model_justification: >-
        The RIGOROUS ingredient is the conservation identity this program owns, which fixes the
        first moment exactly for every base and therefore removes the mean entirely from the
        comparison, leaving only the coverage deficit; together with the exact bound that
        coverage is at most the mean, which caps the range. The CLASSICAL STATEMENT IMITATED is
        the Poisson occupancy limit for a balls-in-bins process, under which the number of
        occupied bins has a variance of the stated order. THE GAP is the independence of the
        placements, which is false in detail because the sums are algebraic and the signed base
        is symmetric under negation - a dependence another record in this lane derives exactly at
        arity two.
      supporting_results:
        - >-
          The program's committed conservation finding for mean per-target yield, cited for the
          first-moment exactness only. Second-hand to this session; the contract re-reads it in
          its zero-compute stage before any number is scored against it.
      validation_experiment_ids:
        - EXP-ICEX-d3a0b2
      falsification_condition: >-
        The measured variance ratio is near 1 rather than 1 + N/T. The assumed base-to-base
        variance is wrong, construction comparisons are base-limited rather than target-limited,
        and the entire budget allocation this hypothesis recommends is wrong in an informative
        direction.
    - id: HEUR-EXA-2
      formal_statement: >-
        The exact identity for the decomposition probability is unconditional, and the two cost
        models - min(B^m, N B) operations for exact enumeration and T B^{ceil(m/2)} for the
        sumset-free sampled estimator - hold up to constant factors independent of the group.
      random_model_justification: >-
        NOT HEURISTIC IN ITS FIRST HALF, and this entry exists to say which half is which. The
        identity is a definition unrolled: a uniform target lies in a fixed subset with
        probability equal to that subset's density, exactly. The COST MODEL half is an ordinary
        algorithmic count, and its only assumption is that the constant factors do not depend on
        the group, which is checkable by timing at fixed parameters across several groups and is
        checked.
      supporting_results:
        - >-
          Elementary counting; no external source is relied on.
      validation_experiment_ids:
        - EXP-ICEX-d3a0b2
      falsification_condition: >-
        The measured exponents from a log-log regression of charged operations against B differ
        from m and ceil(m/2) by more than the declared tolerance. The cost model is wrong; the
        crossover is republished from the MEASURED exponents and the headline is restated with
        them.
  structural_ingredients:
    - description: >-
        The parent proposal's derivation of the exact identity, the two cost models, the
        crossover condition, the variance ratio, the decidability table and the seven controls.
      citation: ledger/proposals/IDEA-20260830-21e7c4.yaml
      provenance: internal
      verified_by: >-
        TASK-20260904-8f2f95, coordinator design session, full read of the record on 2026-09-04.
    - description: >-
        The conservation identity fixing the mean per-target yield exactly for every base of a
        given size, which removes the mean from every construction comparison and is why the
        deliverable is an equivalence bound on coverage rather than a test of means.
      citation: KN-FIND-007
      provenance: internal
      verified_by: >-
        IDEA-20260830-21e7c4 records a full read of knowledge/findings/KN-FIND-007.md on
        2026-08-29. TASK-20260904-8f2f95 read that proposal and did NOT open the finding; every
        value taken from it is second-hand and the contract re-reads it in its zero-compute stage
        before any calibration is scored.
    - description: >-
        The committed harness functions that build the full sumset and then estimate its density
        from sampled targets, which is the incumbent instrument this hypothesis compares against.
      citation: harness/run_saturation.py and harness/exp_icinv.py
      provenance: internal
      verified_by: >-
        IDEA-20260830-21e7c4 records reading both files in this program's source tree in its
        authoring session. TASK-20260904-8f2f95 did not open them; the contract's zero-compute
        stage re-reads them and records what they actually compute before any comparison is run.
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: >-
        measured cost crossover in B between exact enumeration and the sumset-free sampled
        estimator, at fixed arity and fixed target count, in charged operations
      direction: different
      minimum_effect: >-
        Within a factor of two of the predicted condition. A measured crossover far below the
        prediction falsifies the cost model and the headline collapses to a precision argument
        only.
    - metric: >-
        statistical efficiency ratio - empirical variance of the estimated construction mean under
        sampling divided by the same under exact enumeration, over n bases per cell
      direction: higher
      minimum_effect: >-
        Predicted 1 + N/T at each cell, with a declared acceptance band. A measured ratio near 1
        falsifies the assumed base-to-base variance and is itself a first-class finding.
    - metric: >-
        standardized gap between the exact ratio and the archived sampled rate, per cell
      direction: different
      minimum_effect: >-
        Standard normal with mean zero under a correct instrument, with at most a declared small
        fraction of cells beyond two standard errors. A systematic gap correlating with the index
        of the target support confirms a named mechanism by an independent route; one that does
        not is an unnamed bias and halts the battery.
    - metric: >-
        certifiable equivalence bound on the relative coverage difference between two
        constructions at n bases per construction, dimensionless
      direction: lower
      minimum_effect: >-
        Must scale as one over the square root of n across the declared ladder of n, verified
        empirically rather than asserted. A bound that does not scale that way means the base
        draws are correlated and the table must be recomputed with the measured correlation.
    - metric: >-
        calibration on the two derived reference geometries against a matched random base
      direction: different
      minimum_effect: >-
        Both must be separated from random by the exact protocol wherever the table says they can
        be, reproducing the committed ratios to their printed precision. Failure to reproduce a
        committed number from a cheaper instrument means the instrument is wrong and NO
        decidability verdict from it is admissible.
    - metric: >-
        memory crossover - the largest group order at which the exact sumset fits within the
        declared memory budget, located by bisection
      direction: different
      minimum_effect: >-
        Measured, not predicted, and reported with the budget and the machine. Above it, cells are
        marked sampled-only. A table that marks NO cell sampled-only has not probed its own
        boundary and must extend the ladder until it does.
    - metric: >-
        the same crossover and variance ratio computed on a CURVE-FREE uniform subset of the
        integers modulo N of matched size
      direction: different
      minimum_effect: >-
        Within the declared tolerance of the curve arms. Agreement means every reported law is a
        statement about subsets of a finite abelian group and MUST be reported that way.
  test_boundary:
    instances:
      - >-
        Every committed cell of this lane's existing ladder, for the reproduction gate.
      - >-
        A cost ladder in B spanning at least a factor of 128, at arities two and three, at four
        group orders, on the SAME machine, with BOTH estimators run on the SAME bases and the
        SAME target draws.
      - >-
        A precision ladder of at least 200 independent random bases per cell at three base sizes
        and three group orders.
      - >-
        The two derived reference geometries and a matched random base, at every cell of the
        table.
      - >-
        A curve-free arm at every cell: a uniformly drawn subset of the integers modulo N of the
        same cardinality, with no curve and no coordinate map.
    parameters:
      operation_definition: 'one charged operation is one group addition or one hash-table probe, counted by an explicit counter, with the conversion between the two frozen before any timing is read'
      target_support: 'H declared explicitly at every cell, together with the coset-count vector of the sumset against H'
      target_count_ladder: 'a declared ladder of sampled-target counts spanning at least a factor of 64, for the convergence check'
      base_count_ladder: 'a declared ladder of base counts spanning at least a factor of 8, for the square-root scaling check'
      machine: 'named and pinned; every timing row carries it'
    implementation: >-
      Pure Python integer arithmetic under experiments/EXP-ICEX-d3a0b2/driver/, reusing the
      committed enumerators unmodified for the incumbent arm and adding the sumset-free
      meet-in-the-middle estimator, an operation counter, a memory sampler and the table
      generator. No solver, no Groebner basis and no Macaulay matrix, so the degree-of-regularity
      memory wall cannot be reached from here.
    budget:
      wall_clock_seconds_total: 28800
      maximum_memory_gb: 8
      maximum_runs: 16
  falsification_conditions:
    - >-
      The measured cost crossover falls far below the predicted condition. The cost model is
      wrong, sampling is not dominated at the committed cells, and the headline collapses to a
      precision argument only.
    - >-
      The measured efficiency ratio is near 1 rather than 1 + N/T. The base-to-base variance
      assumption is wrong; construction comparisons are base-limited, and the recommended budget
      allocation is wrong in an informative direction.
    - >-
      The exact value falls outside the archived sampled interval at a substantial fraction of
      cells with no correlation to the target-support index. An unnamed bias exists in one
      estimator; the battery halts and reports it rather than publishing a table.
    - >-
      The equivalence bound does not scale as one over the square root of the base count. Base
      draws are correlated and every bound in the table must be recomputed upward with the
      measured correlation.
    - >-
      Either calibration control fails to reproduce its committed value. The instrument cannot see
      a known effect and no decidability verdict from it is admissible.
    - >-
      The null-object arm declares two draws of the SAME construction different. The
      false-positive rate is mis-specified and the table is void.
    - >-
      No cell of the extended ladder is sampled-only. The memory crossover was not reached, the
      table's boundary is unprobed, and the no-go half of the deliverable is unsupported.
    - >-
      The curve-free arm does NOT reproduce the crossover and the variance law. Then the laws are
      not generic to finite abelian groups, which is a finding in its own right and changes what
      the table may be quoted for.
  interpretation_limits:
    - >-
      NO ATTACK, NO EXPONENT, NO ALGORITHM. This is a measurement-design and budgeting record at
      toy scale, and the exponents it reports are the instrument's own costs.
    - >-
      Nothing here says anything about the COST OF FINDING a decomposition. Exact enumeration is
      not an algorithm an attacker could run - it enumerates the whole sumset, which is why it is
      affordable only at toy scale.
    - >-
      An UNDECIDABLE verdict at a cell is a statement about that cell's budget, not about the
      constructions. It does not say the constructions are the same and may not be quoted as a
      negative result about factor-base design.
    - >-
      The efficiency gain is available only below the measured memory crossover. Quoting it above
      that crossover would be a fabrication of applicability, and the table must report the gain
      and the availability in the same row.
    - >-
      Exact is not correct. Removing sampling noise removes the only thing that was visibly noisy;
      an enumerator bug becomes a confidently wrong integer. A certificate suite for the
      enumerator is a PREREQUISITE, not a companion.
    - >-
      If the curve-free arm reproduces the laws, the supported statements are about subsets of a
      finite abelian group and may NOT be restated as statements about elliptic-curve factor bases
      or about the ECDLP.
  status: proposed
  proposed_by: idea-generator
  specified_by: coordinator
  prior_evidence_refs:
    - RQ-RELN-001
    - IDEA-20260830-21e7c4
    - KN-FIND-007
    - IDEA-20260830-1f2b8b
    - IDEA-20260830-d2ebb5
  distinguishable_outcomes:
    - outcome: >-
        The crossover matches the prediction, the efficiency ratio matches 1 + N/T, both
        calibrations fire, the null object returns indistinguishable, and the memory crossover is
        located.
      meaning: >-
        All four limbs hold at the tested cells. The lane gains a frozen exact protocol with a
        mandatory metadata block and a decidability table whose UNDECIDABLE half is as
        load-bearing as its DECIDABLE half. Nothing about attack cost changes.
    - outcome: >-
        The crossover is far from the prediction.
      meaning: >-
        The cost model is falsified. The precision argument survives independently and is reported
        alone; the crossover is republished from the measured exponents.
    - outcome: >-
        The efficiency ratio is near 1.
      meaning: >-
        The base-to-base variance assumption is falsified. Construction comparisons are
        base-limited, which redirects the lane's budget away from target counts and toward base
        counts - a more consequential finding than the one the record set out to make.
    - outcome: >-
        A systematic exact-versus-sampled gap uncorrelated with the target-support index.
      meaning: >-
        An unnamed bias in one estimator. The battery halts, publishes the gap and its cells, and
        no decidability table is emitted.
    - outcome: >-
        The curve-free arm reproduces every law.
      meaning: >-
        The laws are generic to finite abelian groups. The table remains valid and useful, and its
        scope statement is rewritten so no reader can hear it as a statement about curves.
