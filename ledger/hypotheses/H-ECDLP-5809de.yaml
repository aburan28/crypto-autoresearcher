  statement: >-
    A window of width 8 stores 128 entries. A window of width 7
    stores 64. Two to the power 7 is 128. Two to the power 6 is 64.
    One hundred twenty-eight exceeds sixty-four by 64. The product of
    the two table sizes is 8192. Their sum is 192. Two width-7 tables
    each store 64, so that gap is 0 and their product is 4096.
  mechanism: >-
    The proposal writes the widths 8 and 7 and the sizes 128 and 64.
    This contract checks those integers. It does not add a curve
    point.
