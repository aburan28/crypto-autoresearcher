hypothesis:
  id: H-ICEX-87ad66
  question_id: RQ-ECDLP-002
  source_idea_id: IDEA-20260731-012
  title: >-
    LP-1 large-prime harvesting for prime-field point decomposition trades table
    memory for harvest cost at a FORCED and EXACTLY COMPUTABLE rate
    S_m / S_{m-1} = (B + m - 1) / m, so its collection-side cost-per-hit is
    strictly WORSE than the direct arity-m harvest by that factor; the source
    idea's pre-registered win band R_LP below 0.7 at 16-, 20- and 24-bit sizes is
    computed here to fire from a toy-scale precompute/harvest imbalance rather
    than from the mechanism, and is replaced by a computed ladder that straddles
    the amortisation crossover
  statement: >-
    SCOPE FIELD. Prime-field ECDLP by Semaev point-decomposition index calculus
    over E/F_p with a prime-order subgroup G of order N. This is the field
    RQ-ECDLP-002 studies and the field the source idea studies; the handoff label
    is correct for this record.

    (A) THE DERIVED IDENTITY, WHICH IS ARITHMETIC AND IS THE RECORD'S SPINE.
    Write S_m for the number of size-m multisets from a factor base of B distinct
    points, S_m = binomial(B + m - 1, m), and S_{m-1} = binomial(B + m - 2, m-1).
    Then S_m / S_{m-1} = (B + m - 1) / m EXACTLY, by cancelling factorials. Under
    the sumset-equidistribution model of HEUR-LP-1 the direct arity-m harvest
    tests one target per lookup and hits with probability S_m / N, so it spends
    N / S_m lookups per hit. The LP-1 harvest spends B_pool lookups per attempt
    (one per pool element) and hits with probability B_pool * S_{m-1} / N, so it
    spends B_pool / (B_pool * S_{m-1} / N) = N / S_{m-1} lookups per hit,
    INDEPENDENT of B_pool. The ratio of LP-1 to direct cost per hit is therefore
    S_m / S_{m-1} = (B + m - 1) / m, which is about B/m and is STRICTLY GREATER
    THAN ONE for every B > 1. At B = 64, m = 4 it is 67/4 = 16.75 exactly, and
    the multiset counts confirm it: S_4 = binomial(67,4) = 766480,
    S_3 = binomial(66,3) = 45760, and 766480 / 45760 = 16.75.

    (B) WHAT THAT FORCES, STATED AS THE HYPOTHESIS. The LP-1 rewrite CANNOT
    reduce charged collection cost per harvested relation. Its only lever is the
    TABLE: the precomputed sumset shrinks from S_m to S_{m-1}, a memory saving of
    exactly the same factor (B + m - 1) / m. LP-1 is therefore a
    memory-for-harvest exchange at a fixed and computable rate, not a collection
    speedup, and any measured R_LP below 1 must be traceable to precompute
    amortisation rather than to harvest efficiency. THIS IS A DERIVATION AND IT
    IS THE PRIMARY FALSIFIABLE CONTENT- it is refuted if the measured cost per
    hit on the two sides does not stand in the ratio (B + m - 1) / m within the
    contract tolerance, which would mean either the identity is misapplied or the
    implementation is not measuring the declared object.

    (C) THE CORRECTED READING OF THE SOURCE IDEA'S BAND, COMPUTED BEFORE ANY RUN.
    IDEA-20260731-012 pre-registers R_LP below 0.7 at some cell with B at least
    64 on at least two toy bit sizes, with the tested sizes given as 16, 20 and
    24 bits. Charging both sides as the source specifies- C_precompute plus
    C_harvest plus C_combine plus C_LA- the direct side pays S_m for its table
    and B * N / S_m for its harvest. Those two are equal at N = S_m^2 / B, which
    at B = 64, m = 4 is 766480^2 / 64 = 9.1795e9, i.e. n* = 33.10 bits. EVERY
    DECLARED CELL SITS FAR BELOW THAT CROSSOVER. At n = 24 the direct side is
    766480 + 1401 = 767881 charged units while LP-1 is 45760 + 46929 + 128 =
    92817, giving R_LP = 0.121; at n = 44 the same formulas give R_LP = 33.5.
    The band therefore fires at every declared cell and fails at every large one,
    and the sign of the result is set by where N sits relative to S_m^2 / B, not
    by the mechanism. A hit at 16, 20 or 24 bits is an unamortised-table artifact
    and is not evidence for the idea's claim.

    (D) THE NULL RULE HAS A DEAD ZONE AND IT IS CLOSED HERE. The source predicts
    R_LP_null at least 0.9 whenever R_LP is below 0.7, and separately falsifies
    on R_LP_null below 0.5. Values of R_LP_null in the half-open interval from
    0.5 to 0.9 have no pre-registered disposition. IDEA-20260731-011, the null
    template the source cites and which was read in full for this record, uses
    0.95 rather than 0.9. This hypothesis adopts a total partition- see
    falsification_conditions- so that no measured null value is undecidable.

    (E) WHAT IS NOT CLAIMED. No assembled single-target ECDLP exponent moves.
    The free-oracle floor of IDEA-20260727-003, whose claim line reads
    F(beta, m) = max(B, c_LA * B^omega_LA), still binds the end-to-end cost and
    is not touched. Nothing here is a statement about any deployed curve.
  mechanism: >-
    ATTACK OBJECT- the harvested relation pool with large-prime slots and the
    shared-large-prime combining graph, exactly as the source names it. The LP-1
    split of arity m into (m-1, 1) makes the expensive half target-independent
    and precomputable once, and eliminates the unknown pool logarithm by pairwise
    combining on a shared pool element. The mechanism's charged content reduces,
    by the identity in statement (A), to a single exchange rate between table
    size and lookups per hit. The experiment therefore measures (i) whether the
    implementation reproduces that exchange rate, (ii) where the amortisation
    crossover actually sits against its computed location, and (iii) whether any
    residual advantage survives a null object in which the membership predicate
    carries no sumset structure.
  assumptions:
  - >-
    All points lie in the prime-order subgroup G- R = aP + bQ and every base and
    pool point is in G, so R minus an (m-1)-sum is in G.
  - >-
    The factor base F, the pool L and the arity m are public and frozen before
    harvest. B_pool and its exponent are tuned parameters of the contract and are
    frozen before any cell runs.
  - >-
    The linear-algebra stage is the standard sparse solve on the surviving
    factor-base-only matrix and is charged identically on both sides.
  - >-
    Costs are in group-operation equivalents with one point addition equal to one
    operation, and one hash-table probe charged at a declared constant number of
    equivalents that is identical on both sides. Memory is charged separately in
    bits and is NEVER divided into a time quantity.
  - >-
    Toy instances only for the executable part. Any crypto-scale statement is
    labelled extrapolation, never validation.
  proof_search_map:
    bottleneck: >-
      Lookups per harvested relation. Every other charged item is either a table
      build, a combinatorial pass, or the linear algebra, and the identity
      S_m / S_{m-1} = (B + m - 1) / m fixes the bottleneck's ratio between the
      two sides in closed form with no free parameter.
    baseline_embedding:
      parameter_slice: >-
        B_pool = 0 collapses LP-1 to the direct arity-m harvest and must
        reproduce it identically. Charging the direct side's table at S_m and its
        harvest at B * N / S_m must reproduce the source idea's own
        matched_baseline convention.
      reproduction_check: >-
        Frozen symbolic fixture, zero compute- assert
        binomial(B+m-1,m) / binomial(B+m-2,m-1) equals (B+m-1)/m exactly in
        rational arithmetic for every B in 8..256 and m in 3..6, and assert
        S_4 = 766480, S_3 = 45760 at B = 64 and their ratio 16.75. A failure
        voids the record before any curve is generated.
    observation_collision:
      observable: >-
        The scalar R_LP, the charged per-usable-relation cost ratio.
      distinct_preimage_search: >-
        COLLISION EXHIBITED BY COMPUTATION, NOT SEARCHED FOR. R_LP = 0.121 arises
        at (B = 64, m = 4, n = 24) from an unamortised direct-side table, and a
        value below 1 could equally arise from a genuine harvest saving that the
        identity in statement (A) forbids. R_LP alone therefore does not identify
        which regime produced it. The separator is the pair (measured lookups per
        hit on each side, measured precompute fraction of total on each side),
        and no conclusion in this lane may rest on R_LP alone.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        Replace the scalar R_LP by the triple (cost-per-hit ratio, precompute
        fraction on each side, table-memory ratio), each of which has a forced
        value under the identity.
      predicted_gain: >-
        Turns a scale-dependent scalar into three quantities whose predicted
        values are computable before the run and none of which flips sign with N.
    - transform: boundary_lift
      proposed_object: >-
        Report R_LP as a function of the number of targets T over which the
        target-independent table S_{m-1} is amortised, with the crossover T*
        emitted per cell.
      predicted_gain: >-
        Places the claim in the multi-target regime the source itself names as
        LP-1's home, where the exchange rate is charged honestly rather than
        hidden in a single-target table charge.
    quantifier_order: >-
      FOR ALL B greater than 1 and FOR ALL m at least 2, the LP-1 lookups per
      harvested relation equal N / S_{m-1} and the direct lookups per harvested
      relation equal N / S_m, so THERE EXISTS NO choice of pool size B_pool that
      makes the LP-1 cost per hit smaller. The uniformity in B_pool is
      load-bearing- B_pool cancels exactly, which is why enlarging the pool
      cannot buy the saving.
    method_ceiling:
      strongest_certifiable_claim: >-
        A charged toy-scale statement about the exchange rate between table
        memory and lookups per hit for one implementation, one cost convention
        and the tested (B, B_pool, m, n) cells. It can never certify that no
        large-prime variant of point decomposition helps, because it costs only
        the LP-1 split and only under the declared charging.
      nearby_object_control: >-
        The same harvest run over a curve-free abelian group, namely (Z/N, +)
        with a factor base of B random residues. The identity in statement (A) is
        a multiset count and does not mention elliptic curves, so the curve-free
        arm must reproduce the same exchange rate. If it does not, the
        instrumentation is measuring something other than the declared object.
    proof_obligations:
    - claim: 'S_m / S_{m-1} = (B + m - 1) / m exactly.'
      responsibility: baseline
    - claim: 'LP-1 lookups per hit equal N / S_{m-1}, independent of B_pool.'
      responsibility: runtime
    - claim: 'Direct-side precompute equals direct-side harvest at N = S_m^2 / B.'
      responsibility: feasibility
    - claim: >-
        Table memory is charged in bits on both sides and never converted into a
        time unit.
      responsibility: memory
    - claim: >-
        Usable equations after combining reach rank B-1 before any per-relation
        cost is credited.
      responsibility: correctness
    - claim: >-
        Every conclusion is scoped to the tested cells, cost convention, solver
        and budget.
      responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: >-
      Prime-field ECDLP relation collection by point decomposition; the
      collection stage only, not the assembled attack.
    prior_best: >-
      Direct arity-m harvest with a precomputed m-sumset- table S_m entries,
      N / S_m lookups per harvested relation, under the same charging.
    time_exponent: >-
      NONE CLAIMED, AND THE RECORD DERIVES THAT NONE IS AVAILABLE- LP-1 lookups
      per hit exceed the direct side's by the factor (B + m - 1) / m at every
      parameter choice.
    memory_exponent: >-
      Collection-table memory drops from S_m to S_{m-1}, i.e. from about
      B^m / m! to about B^{m-1} / (m-1)! entries. In the B = N^beta convention
      that is a drop of beta in the table exponent, purchased at a
      (B + m - 1) / m increase in lookups per hit.
    hidden_cofactor: >-
      The combining pass constants, hash engineering, the multiset-collision
      correction to S_{m-1}, and the B_pool tuning surface. None is proved
      negligible at any scale. The free-oracle linear-algebra floor of
      IDEA-20260727-003 is not modelled here and binds independently.
    claim_kind: cofactor_improvement
  heuristic_assumptions:
  - id: HEUR-LP-1
    formal_statement: >-
      FOR a uniform random target R = aP + bQ in G and a pool L of B_pool points
      frozen before harvest, the events that R lies in L_i + S_{m-1} for
      i = 1..B_pool are jointly Poisson with mean
      lambda = B_pool * |S_{m-1}| / N, uniformly over the tested (B, B_pool, m,
      n) cells; equivalently the shifted (m-1)-fold sumsets behave as independent
      uniform subsets of G of density |S_{m-1}| / N.
    random_model_justification: >-
      Uniform-target counting- the mean number of representations is exact by the
      same double count that KN-FIND-007 proves for the unshifted case, so only
      independence and the Poisson shape are heuristic. KN-FIND-007's statement
      was read in full for this record- the mean per-target yield is
      binomial(B+m-1,m)/N for EVERY base of size B, with maximum absolute
      deviation exactly 0 measured over 144 cells; that battery is at m = 3 and
      N at most 2^18, which KN-FIND-007 states and which this record carries
      forward as the scope of the exactness.
    supporting_results:
    - >-
      KN-FIND-007 (internal, read in full by this task)- the mean-yield
      conservation identity binomial(B+m-1,m)/N, exact and geometry-independent,
      with the one-relation-per-target correction bounded by 1.582.
    - >-
      No theorem is available transferring the Poisson SHAPE to shifted Semaev
      sumsets over prime fields; KN-FIND-007 explicitly declines to say anything
      about the cost of finding a decomposition. Recorded as a gap, not as
      support.
    validation_experiment_ids:
    - EXP-ICEX-e0c85b
    falsification_condition: >-
      The measured hit probability per attempt departs from
      lambda = B_pool * |S_{m-1}| / N by more than 15 percent systematically
      across three consecutive bit sizes, or the normalised residual
      |P_hit - lambda| / lambda fails to decay by at least a factor 2 across the
      declared ladder. A residual flat in n is the canonical artifact tell.
  - id: HEUR-LP-2
    formal_statement: >-
      FOR the tested cells, the number of usable factor-base-only equations
      produced by pairwise combining on a shared pool element equals
      N_hit - B_pool_used up to multiset collisions, where B_pool_used is the
      number of distinct pool elements appearing at least twice.
    random_model_justification: >-
      Combinatorial and predicate-independent; it is a statement about a bipartite
      relation-pool graph and holds for any hit process with the declared marginal
      density. It is heuristic only in the collision correction.
    supporting_results:
    - >-
      None external. The claim is combinatorial and is discharged by the contract
      requiring the combined matrix to reach rank B-1 before any credit.
    validation_experiment_ids:
    - EXP-ICEX-e0c85b
    falsification_condition: >-
      The combined matrix fails to reach rank B-1 at N_hit = B + B_pool at any
      cell where the counting predicts it should, and the shortfall is not
      explained by the measured multiset-collision rate.
  structural_ingredients:
  - description: >-
      Double large-prime variation for hyperelliptic and finite-field index
      calculus- the external prior art for near-miss harvesting and pairwise
      recombination, from which LP-1 is adapted to EC point decomposition.
    citation: 'KN-LIT-164 (Gaudry, Thome, Theriault, Diem, as recorded in this corpus)'
    provenance: recalled
    verified_by: null
    role: >-
      Prior art for the large-prime relaxation and the combining graph. NOT
      OPENED BY THIS TASK- the source idea records it as archived and
      literature_verified, and this record does not inherit that verification.
  - description: >-
      Mean-yield conservation for point decomposition- the exact per-target
      multiset count that fixes both sides' hit probabilities.
    citation: knowledge/findings/KN-FIND-007.md
    provenance: internal
    verified_by: >-
      TASK-20260904-f2b3db, coordinator- KN-FIND-007 opened and read in full on
      2026-09-04, including its scope note that the 144-cell battery is at m = 3
      and N at most 2^18.
    role: distribution law fixing the harvest hit probability on both sides
  - description: >-
      The structure-destruction null-object template whose thresholds this
      contract inherits and repairs.
    citation: ledger/proposals/IDEA-20260731-011.yaml
    provenance: internal
    verified_by: >-
      TASK-20260904-f2b3db, coordinator- IDEA-20260731-011 opened and read in
      full on 2026-09-04. It states R_null at least 0.95 whenever R_real is below
      0.7; the source idea IDEA-20260731-012 restates that as 0.9. Both are
      recorded and the contract uses the stricter 0.95.
  - description: >-
      The free-oracle admissibility floor that binds the assembled cost
      independently of anything measured here.
    citation: ledger/proposals/IDEA-20260727-003.yaml
    provenance: internal
    verified_by: >-
      TASK-20260904-f2b3db, coordinator- READ AS A GREP FRAGMENT ONLY, not opened
      in full. The quoted claim line 'F(beta, m) = max(B, c_LA * B^omega_LA)
      subject to the yield constraint B^m >= m! * N' was read verbatim; the rest
      of the record was not.
    role: independent lower bound on assembled cost, not used as support here
  reduction_chain:
    core_problem: >-
      Charged cost per harvested relation for LP-1 versus direct arity-m
      harvesting, at toy scale, under one frozen cost convention.
    corollaries: []
  predictions:
  - metric: cost_per_hit_ratio_lp_over_direct
    direction: higher
    minimum_effect: >-
      Measured (LP-1 lookups per harvested relation) divided by (direct lookups
      per harvested relation) equals (B + m - 1) / m within a factor 1.25 at
      every completed cell. FORCED VALUE at B = 64, m = 4 is 16.75. This is the
      record's primary prediction and it predicts LP-1 is WORSE on this axis.
  - metric: table_memory_ratio_direct_over_lp
    direction: higher
    minimum_effect: >-
      Measured (direct table entries) divided by (LP-1 table entries) equals
      (B + m - 1) / m within a factor 1.05. FORCED VALUE at B = 64, m = 4 is
      16.75, with 766480 and 45760 entries respectively. Memory is charged in
      bits and reported beside, never divided into, the time column.
  - metric: r_lp_sign_change_across_the_computed_crossover
    direction: different
    minimum_effect: >-
      R_LP is below 1 at bit sizes below n* = 2*log2(S_m) - log2(B) and above 1
      above it, with the measured crossover within 2 bits of the computed n*.
      FORCED VALUE at B = 64, m = 4 is n* = 33.10 bits. A measured crossover
      more than 2 bits from n* means the charging is not the declared one.
  - metric: hit_rate_residual_decay
    direction: lower
    minimum_effect: >-
      The normalised residual |P_hit - lambda| / lambda decays by at least a
      factor 2 across the four-rung ladder. A flat residual is the canonical
      artifact tell and voids HEUR-LP-1 on the tested scope.
  - metric: null_object_ratio_r_lp_null
    direction: higher
    minimum_effect: >-
      Whenever R_LP is below 0.7 on the real object, the same implementation on
      the random-oracle null must give R_LP_null at least 0.95, per
      IDEA-20260731-011. See falsification_conditions for the total partition of
      the null value.
  test_boundary:
    instances:
    - >-
      Generated ordinary prime-field short-Weierstrass curves with prime-order
      subgroups at n = 24, 28, 32 and 36 bits, at least 3 distinct curves per
      rung, anomalous and smooth-order curves excluded before entry.
    - >-
      A curve-free arm on (Z/N, +) at the identical n, with a factor base of B
      random residues and a pool of B_pool random residues.
    parameters:
      arity_m: [4]
      arity_m_secondary: [5]
      factor_base_B: [64]
      factor_base_B_secondary: [128]
      pool_B_pool: [32, 64, 128]
      bit_sizes_n: [24, 28, 32, 36]
      computed_crossover_n_star_at_B64_m4: 33.10
    implementation: >-
      Hash-table sumset membership on both sides, one shared probe-cost constant,
      one shared operation counter, one frozen instance-set hash. No Groebner
      backend is used at these cells because the m-sumset fits in memory.
    budget:
      wall_clock_seconds_per_run: 900
      maximum_memory_gb: 8
      maximum_runs: 240
  falsification_conditions:
  - >-
    D1 DERIVATION GATE, BLOCKING. The frozen symbolic fixture does not return
    S_m / S_{m-1} = (B + m - 1) / m in exact rational arithmetic, or does not
    return 766480, 45760 and 16.75 at B = 64, m = 4. The record's arithmetic is
    wrong; void and supersede rather than amend.
  - >-
    D2. The measured cost-per-hit ratio is not (B + m - 1) / m within a factor
    1.25 at any completed cell. Either the identity is misapplied or the
    implementation is not charging the declared object; no cost conclusion may be
    drawn from that cell.
  - >-
    D3 HEADLINE FALSIFIER OF THE SOURCE CLAIM. The measured cost-per-hit ratio IS
    (B + m - 1) / m and the measured crossover is within 2 bits of the computed
    n*. Then the LP-1 collection-side saving is refuted on the tested scope- what
    remains is a table-memory exchange at a computed rate, and R_LP below 0.7 at
    any cell below n* is recorded as an unamortised-table artifact and NEVER as
    support for the source claim.
  - >-
    D4 NULL PARTITION, TOTAL, NO DEAD ZONE. Whenever R_LP is below 0.7 on the
    real object- R_LP_null at least 0.95 means the gain is not reproduced by a
    structureless predicate and the cell is admissible; R_LP_null strictly below
    0.5 means the gain is a predicate-engine artifact and the cell is VOID;
    R_LP_null in the closed interval 0.5 to 0.95 means the null partially
    reproduces the gain and the cell is INCONCLUSIVE and may not be cited in
    either direction. This closes the 0.5-to-0.9 gap left open by the source
    idea.
  - >-
    D5 CURVE-FREE NULL, REQUIRED, WITH THE CONSEQUENCE PRE-STATED. The identity
    in statement (A) is a multiset count that mentions no curve, so a curve-free
    object can reproduce the whole signature. If the (Z/N, +) arm reproduces the
    cost-per-hit ratio, the table-memory ratio and the crossover location within
    the same tolerances, then EVERY quantity measured here is a statement about
    sumset counting in a finite abelian group and NOT about elliptic curves or
    the ECDLP, and no record may present it otherwise.
  - >-
    D6. Failure to reach combined-matrix rank B-1 on either side within the
    declared budget is an infrastructure outcome under AGENTS.md rule 5, never
    mathematical evidence.
  interpretation_limits:
  - >-
    Toy tier throughout. Every number is scoped to n at most 36 bits, the listed
    (B, B_pool, m) cells, the declared hash-lookup charging, the named
    implementation and the declared budget. No transfer to cryptographic N is
    licensed.
  - >-
    UNTESTABLE AT REACHABLE SCALE, STATED PLAINLY. The claim that LP-1's
    target-independent table amortises favourably in the multi-target regime at
    cryptographic parameters cannot be tested here. At B = N^beta with beta
    fixed, the crossover N = S_m^2 / B moves with N, and reaching a
    cryptographically relevant cell would require a table of about B^{m-1}
    entries at B of order 2^40, which is beyond any budget this program can
    command. What IS testable is the exchange rate, which is scale-free by the
    identity, and the crossover LOCATION at toy sizes against its computed value.
  - >-
    A confirmed exchange rate does not close the large-prime family. It closes
    the LP-1 (m-1, 1) split under the declared charging. An LP-2 split, a
    cycle-finding recombination, or a charging convention that amortises the
    table across many targets are different objects and are out of scope.
  - >-
    Nothing here bears on the security of any deployed curve, and no assembled
    ECDLP exponent moves in either direction.
  - >-
    The novelty screen of the source idea rests on KN-LIT-164, which this task
    did NOT open. novelty_status for the adaptation claim is therefore treated as
    unverified in this record regardless of what the source idea asserts.
  status: proposed
  proposed_by: idea-generator
