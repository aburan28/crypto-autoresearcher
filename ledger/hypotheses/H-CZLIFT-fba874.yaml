  title: >-
    No p-adic digit of the torsion section's coordinates, on the canonical
    curve lift or on an arbitrary lift, correlates with the discrete logarithm
  statement: >-
    Let E/F_p have a prime-order subgroup <P>, n != p, and let s_tor be the
    torsion section on a lift E^/Z_p (the CM canonical model or an arbitrary
    integer lift). For every digit function f(k) = a_i(x(s_tor([k]P))) or
    a_i(y(s_tor([k]P))), i = 1..4, and over the half-range k = 1..(n-1)/2,
    max over nontrivial additive psi of F_p and all characters chi of Z/n of
    |sum_k psi(f(k)) chi(k)|^2 / n_half is below ln((p-1) n) + 12, exactly as
    for the same digits re-indexed by a random permutation and for uniform
    random digits. Digit 0 (the F_p coordinate) is the control that must obey
    the same bound.
  mechanism: >-
    The torsion section is the unique homomorphic section (H-CZLIFT-6d4ed1),
    so its coordinates are canonical functions of the point; the only
    structure they carry beyond E(F_p) is the p-adic expansion of the
    torsion point's coordinates, which is determined by the curve's p-adic
    geometry and not by the group law. A character-level correlation of a
    digit with k would be a p-adic invariant that reads the discrete
    logarithm, contradicting the closure of KN-TECH-73630e at the level of
    nonlinear functions, which that entry does not cover.
  assumptions:
    - '#E(F_p) odd, prime subgroup order 11 <= n <= 600, precision 5.'
    - The null per (psi, chi) pair is |S|^2/n_half ~ Exp(1); the maximum over N = (p-1) n pairs is about ln N plus a Gumbel term, so ln N + 12 has tail probability about e^{-12} per digit.
  proof_search_map:
    not_applicable_reason: spectral measurement against a pre-registered null; no asymptotic claim.
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
