  falsification_conditions:
    - a digit i >= 1 with above-threshold pairs on both seeds while its shuffled control has none
    - any uniform-control spike (instrument defect; the run is invalid, not negative)
  interpretation_limits:
    - Additive characters of F_p against multiplicative characters of Z/n only.
    - A white spectrum excludes character-level correlation, not every efficient function of s_tor.
