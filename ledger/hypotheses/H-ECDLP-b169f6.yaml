  statement: >
    Fix the exact 2-bit complete-residue
    lift of affine y of one frozen toy
    before any Gamma orbit, Semaev S_m,
    nested LHW generator, or unary-
    closure census is built. Stage 0
    asserts only that on REAL p=19,
    A=1, B=-1, P=(2,3) one has
    [2]P=(16,11) and r=y_Z([2]P) mod 4
    equals 3, and that the nearby KF
    claim r=0 is false. NULL empty
    residue rejected. y=0 rejected.
    This is not a Semaev relation, not
    a rho beat. Stages 1+ stay
    unauthorized.
  mechanism: >
    IDEA-20260913-fa01b7 Stage 0 hard
    gate is the exact residue
    r = y_Z mod 4 of the unique lift
    in {0,...,p-1} of y([2]P). Form
    [2]P by affine doubling, lift y,
    reduce mod 4. Stage 0 freezes that
    identity as exact tables. No
    Gamma orbit. No Semaev S_m. No
    nested LHW. No unary-closure
    census. This is a new
    GOAL-ECDLP-001 object after
    P-S0-DBLJAC. It is not Stage 1 of
    EXP-ECDLP-fc8954 and not Stage 1
    of EXP-ECDLP-bf222c.
