  title: >-
    At degree 7 every irreducible modulus keeps all 49 bilinear monomials.
  statement: >-
    The five named reduction polynomials have Hamming weights 5, 3, 5, 3
    and 5, and those weights sum to 21. Over F_2 there are exactly 18
    monic irreducible polynomials of degree 7, which is (2^7 - 2) / 7.
    Four have weight 3, ten have weight 5, and four have weight 7. For
    each of them the reduced product of two independent degree-6 bit
    vectors uses all 49 bilinear monomials in at least one output
    coordinate. The four weight-3 incidence totals are 70, 73, 76 and
    105, and they sum to 324. The ten weight-5 incidence totals are 99,
    102, 104, 114, 118, 118, 120, 120, 123 and 129, and they sum to
    1147. The four weight-7 incidence totals are 109, 114, 118 and 131,
    and they sum to 472. The weight-3 modulus 193 has 105 incidences.
    The weight-5 modulus 241 has 99. So 105 exceeds 99 by 6, and the
    weight does not order the incidence totals. The modulus 131, which
    is t^7 + t + 1, has 70 incidences.
  mechanism: >-
    The proposal compares trinomial and pentanomial multiplication
    tensors. This contract counts the degree-7 irreducibles and the
    bilinear incidences of each reduced product. It does not run a
    solver and it does not build a summation system.
