# H-DREG-49869c
# Tiny planted-factor rank check for IDEA-20260922-1d595f.
# The observable is Macaulay rank, not d_lf_obs. Approval: DEC-20261001-dd55a6.
hypothesis:
  id: H-DREG-49869c
  question_id: RQ-DREG-c8ae8d
  source_idea: IDEA-20260922-1d595f
  experiment_id: EXP-DREG-ddea8c
  specified_at: '2026-10-01'
  status: approved
  proposed_by: idea-generator
  approved_by_decision: DEC-20261001-dd55a6
  title: >-
    Multiplying one generator by x drops the degree-3 Macaulay rank over F_2
    by at least 1, and an unplanted copy does not drop.
  statement: >-
    Let f1 = x^2 + y and f2 = y^2 + x in F_2[x, y]. Both vanish at (0, 0).
    The planted generators are x*f1 and f2, and they still vanish at (0, 0).
    The neighbor is a copy of (f1, f2). At monomials of degree at most 3,
    the rank of the planted Macaulay matrix is at least 1 below the
    unplanted rank, and the neighbor rank equals the unplanted rank. A
    gauge copy substitutes x |-> x + y and transports the factor to x + y.
    The planted generators are marked synthetic.
  mechanism: >-
    Inserting a linear factor that vanishes at a known zero changes the
    generating set and can change the row space of a degree-capped
    multiplication matrix. An untouched copy must not change. This is a
    stand-in for the proposal's plant. It is not the proposal's fall meter.
  assumptions: []
  proof_search_map:
    bottleneck: Building the degree-3 Macaulay matrices and computing their ranks over F_2.
    baseline_embedding:
      parameter_slice: >-
        The plant rule in IDEA-20260922-1d595f: multiply one generator by
        (x_1 - c) for a known zero. Applied here to f1 and c = 0.
      reproduction_check: >-
        Two matrix builders. One orders monomials grevlex with x > y. The
        other uses the opposite variable order and sorts the rank back.
        Ranks must agree.
    observation_collision:
      observable: planted rank drop and neighbor rank drop.
      distinct_preimage_search: >-
        The neighbor is an exact copy. A nonzero neighbor drop means the
        rank code moved with nothing planted.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: Two quadratics and one planted cubic.
        predicted_gain: A rank difference. No attack cost.
    quantifier_order: >-
      For these fixed generators and degree cap 3, after the matrices are
      finished, planted_drop >= 1 and neighbor_drop = 0.
    method_ceiling:
      strongest_certifiable_claim: >-
        The rank behavior of this one system. Not a Semaev first-fall
        degree and not a statement about elliptic curves.
      nearby_object_control: >-
        The neighbor copy. A drop of at least 1 on the neighbor falsifies
        the calibration.
    proof_obligations:
      - claim: (0, 0) remains a zero of the planted generators.
        responsibility: correctness
      - claim: Planted rank drop is at least 1 and neighbor drop is 0.
        responsibility: correctness
      - claim: The generators are labeled synthetic.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: >-
        The proposal asks whether a planted linear factor moves a fall
        meter. That meter's definition was not opened. This hypothesis
        uses Macaulay rank at degree 3 instead.
      citation: ledger/proposals/IDEA-20260922-1d595f.yaml
      provenance: internal
      verified_by: coordinator session 2026-10-01 (claim and minimal_test read)
      role: the plant rule, not the unread fall-meter definition
  reduction_chain:
    core_problem: See whether a synthetic linear factor moves a degree-capped rank.
    corollaries: []
  predictions:
    - metric: planted_rank_drop
      direction: lower
      minimum_effect: At least 1 below the unplanted rank.
    - metric: neighbor_rank_drop
      direction: different
      minimum_effect: Exactly 0.
  test_boundary:
    instances: [unplanted, planted, neighbor, one gauge]
    parameters:
      field: F_2
      degree_cap: 3
    implementation: Two Macaulay builders that do not import each other.
    budget:
      maximum_runs: 2
      maximum_memory_gb: 1
      maximum_workers: 1
  falsification_conditions:
    - Both builders agree and the planted drop is 0, or the neighbor drop is not 0.
  interpretation_limits:
    - This is not d_lf_obs and not a Semaev system.
    - A planted drop of 0 is a negative result for dynamic range on this system, not an instrument crash.
  dominated_by: No attack is claimed.
