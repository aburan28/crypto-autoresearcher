hypothesis:
  id: H-ECDLP-ff38dc
  question_id: RQ-ECDLP-165d4b
  title: >-
    No cell of this census is comparable to any other until the charged rho
    instrument's own finite-size bias is calibrated; the bias law is
    R(N) = 1 + c N^(-1/2), the fitted band cannot distinguish a constant
    overhead from a logarithmic one, and at the seed count the source proposes
    only the 12- and 14-bit rungs can resolve their own predicted bias at all
  statement: >-
    Source proposal IDEA-20260829-34f3ed (RQ-ECDLP-165d4b, class tooling).
    (A) THE GAP, VERIFIED VERBATIM. RQ-ECDLP-165d4b declares bit_sizes 16, 20,
    24, 28, 32 and 36; this coordinator session read that field directly.
    H-ECDLP-e42bda runs at field_bits 12, 13, 14 and 15 with an effect target of
    a Hodges-Lehmann paired median ratio at most 0.90 and a budget of 18720
    wall-clock seconds and 104 maximum runs; this session read those fields
    directly. EV-ENDO-10109d's executed prime-field measurements run at p at
    most 100057, i.e. 16.6 bits, and it records a variance ratio staying in
    [1.3, 3.6] with monotonic_decay False at both primes; this session read
    those observations directly. FIVE OF THE SIX DECLARED CENSUS ROWS ARE
    EMPTY, and the one that is not is populated by measurements taken below it.
    (B) THE TRACKED OBJECT. R(N) is the seed-averaged normalised charged work of
    the MATCHED CONTROL arm, the arm with no claimed structural advantage,
    divided by 0.886 times the square root of N. Two cells are comparable
    exactly when their R values are drawn from the same calibrated law.
    (C) THE CLAIM WITH A NUMBER. R(N) = 1 + c N^(-1/2) + o(N^(-1/2)), because
    the dominant finite-size terms are all O(1) STEP counts added to a collision
    time growing as the square root of N. A fixed overhead of about 10 charged
    steps gives c = 10/0.886 = 11.3, hence a bias of 11.3/64 = 0.176 at 12 bits
    and 11.3/16384 = 0.00069 at 28 bits. AT THE BIT SIZES WHERE THIS LANE
    ACTUALLY MEASURES, THE INSTRUMENT'S OWN BIAS IS OF THE SAME ORDER AS THE 10
    PERCENT EFFECT H-ECDLP-e42bda PRE-REGISTERS, AND IS LARGER THAN IT AT THE
    SMALLEST DECLARED SIZE.
    (D) TWO DEFECTS IN THE PROPOSED DESIGN, FOUND BY COMPUTATION AND CARRIED AS
    PART OF THE HYPOTHESIS. FIRST, THE BAND CANNOT DISCRIMINATE THE MODEL IT
    NAMES. If a finite-size term grows like log N rather than staying O(1), then
    R - 1 is proportional to N^(-1/2) log N and the local log-log slope runs
    from 0.380 at 12 bits to 0.445 at 26 bits, so a single power law fits with
    an exponent near 0.41, comfortably inside the proposed acceptance band of
    0.30 to 0.70. The band therefore accepts the alternative it is meant to
    exclude and must be supplemented by a nested-model comparison. SECOND, MOST
    RUNGS CANNOT SEE THEIR OWN BIAS AT THE PROPOSED SEED COUNT. With sd(log T)
    equal to 0.6413, a rung of 12 curves times 48 seeds gives a standard error
    of 0.6413/24 = 0.0267 on R, while the predicted bias is 11.3 N^(-1/2). The
    bias exceeds three standard errors only when the square root of N is at most
    141, i.e. below about 14.3 bits. At 576 runs per rung ONLY THE 12- AND
    14-BIT RUNGS RESOLVE THEIR OWN PREDICTED BIAS; the 16- to 26-bit rungs are
    underpowered by factors of 3 to 3400 in run count.
    (E) WHAT IS NOT CLAIMED. No exponent moves. This is instrument calibration
    and it claims nothing about whether any census cell contains a real effect;
    it claims only that the comparability of cells is currently an untested
    assumption with a computable magnitude.
  mechanism: >-
    Cycle-detection overhead, the fixed setup and certificate charge, the walk's
    deviation from a uniformly random function on a partition of fixed branch
    count, and fruitless-cycle escapes are all O(1) step counts. A fixed
    additive overhead against a square-root-growing collision time contributes a
    relative term of order N^(-1/2), which is the first-order finite-size
    correction structure of any additive-overhead-over-birthday-time ratio.
    Fitting c and the exponent turns the bias into a subtractable function and
    supplies the minimum admissible bit size at which it falls below a target
    effect, which is what converts a bit-size axis from a wish list into a
    schedule.
  assumptions:
    - >-
      The matched-random control arm has no structural advantage, so its
      residual is instrument bias by construction. Any curve family with a
      claimed effect is excluded from the calibration ladder; the calibration is
      measured on the null, not on the treatment.
    - >-
      One frozen cost model across the entire ladder, with its hash asserted
      identical at every rung. A cost-model change mid-ladder is
      indistinguishable from a decay law and is a blocking protocol failure.
    - >-
      N is known EXACTLY at every rung by exhaustive count or certified BSGS, so
      no estimation error in N enters R. This is why the ladder stops at 26 bits
      rather than continuing to the declared 32 and 36.
    - >-
      A fitted power law is a MODEL. Its adequacy is tested by residual
      curvature, by leave-one-rung-out prediction and by a nested comparison
      against the logarithmic alternative, and a failed adequacy test is a
      result, not an excuse to widen the interval.
  proof_search_map:
    bottleneck: >-
      The step of comparing a measurement taken at one bit size or family
      against one taken at another. Every census statement spanning cells passes
      through it and no committed record measures the bias it introduces.
    baseline_embedding:
      parameter_slice: >-
        The asymptotic limit, where R tends to 1. The three-parameter fit
        R = R_inf + c N^(-e) must return R_inf equal to 1.000 with an interval
        containing 1, recovering the 0.886 convention as the limiting boundary.
      reproduction_check: >-
        A frozen fixture at 20 bits with a fixed seed set whose committed R value
        is reproduced exactly on re-run, plus the asymptote test above. An R_inf
        significantly different from 1 is a finding about the normalisation
        convention rather than about finite size, and is blocking for every
        normalised number in this lane.
    observation_collision:
      observable: The baseline residual R minus 1.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED. Two runs with the same R exist
        whenever the bias at a small size equals a genuine effect at a larger
        one, which by the arithmetic above happens around 14 to 16 bits for a 5
        percent effect. Exhibiting such a pair is the cheapest proof that R is
        not interpretable without its scale, and it is why the deliverable is a
        per-bit-size table rather than a single number.
    constructive_transforms:
      - transform: telescoping_potential
        proposed_object: >-
          The fitted decay law as a global budget against which each cell's
          residual is charged, decomposing it into a predicted decaying part and
          a non-decaying remainder.
        predicted_gain: >-
          Makes the non-decaying remainder, which the inventor protocol calls
          the artifact tell, a measured number with an interval rather than a
          qualitative impression, so a report of monotonic_decay False becomes
          scorable.
      - transform: specialization_pack
        proposed_object: >-
          The minimum admissible bit size at which instrument bias falls below a
          target effect.
        predicted_gain: >-
          Converts the census bit-size axis into a schedule with an
          admissibility rule per target effect size.
    quantifier_order: >-
      FOR ALL bit sizes in the tested ladder and FOR ALL matched-random ordinary
      prime-order curves in the tested families, THERE EXISTS a single pair
      (c, e) fitting R minus 1 within the reported intervals. EXPLICITLY NOT
      CLAIMED: that one pair holds across different curve families or cost
      models, which is tested rather than assumed; and no extrapolation past 26
      bits, which is refused because N is no longer exactly certifiable there.
    method_ceiling:
      strongest_certifiable_claim: >-
        On the tested families and cost model, the matched-baseline residual
        follows the stated law with the stated interval over the RESOLVABLE
        rungs, and the minimum admissible bit size for a target effect is the
        stated value. It can NEVER certify that a cell contains no effect, that
        the fit extends to 32 or 36 bits, or that a different instrument obeys
        the same law.
      nearby_object_control: >-
        A DELIBERATELY BIASED INSTRUMENT: the same ladder with an injected fixed
        overhead of 50 extra charged steps per run. The fit must recover
        e = 1/2 with c inflated by 50/0.886 = 56.4, which at 12 bits moves the
        residual from 0.176 to 1.057, a 33 standard error change at 576 runs. A
        method returning the same c on the clean and the sabotaged ladder is
        measuring nothing and every number is void.
    proof_obligations:
      - claim: R_inf equals 1, recovering the 0.886 convention at infinite N.
        responsibility: baseline
      - claim: The four named finite-size terms are each O(1) steps.
        responsibility: correctness
      - claim: The power-law fit passes residual curvature, leave-one-out and a
          nested comparison against the logarithmic alternative.
        responsibility: correctness
      - claim: N is exactly known at every rung.
        responsibility: feasibility
      - claim: The sabotage control recovers the injected bias.
        responsibility: strictness
      - claim: Each rung either meets its required run count or is declared
          underpowered.
        responsibility: success_probability
      - claim: No extrapolation past 26 bits is asserted.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: null
    prior_best: null
    time_exponent: null
    memory_exponent: null
    hidden_cofactor: null
    claim_kind: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        For matched-random ordinary prime-order curves over F_p with exactly
        known N, the seed-averaged normalised charged work satisfies
        R(N) = 1 + c N^(-1/2) + o(N^(-1/2)) with c independent of N and of the
        curve family, uniformly over N between 2^12 and 2^26.
      random_model_justification: >-
        Pairs the rigorous asymptotic that the mean collision time grows exactly
        as the square root of N, with the 0.886 convention absorbing the
        negation factor, against the classical statement that a fixed additive
        O(1) overhead over a square-root-growing quantity contributes a relative
        term of order N^(-1/2). The heuristic step is that the four named
        overhead terms are jointly O(1) in N rather than growing.
      supporting_results:
        - ref: KN-TECH-018
          provenance: internal
          claim: >-
            The 0.886 times the square root of n convention is the
            negation-included rho baseline constant against which normalised
            work is measured.
          verified_by: >-
            relayed from IDEA-20260829-34f3ed, whose authoring session records
            reading the record in full on 2026-08-29; this coordinator session
            confirmed the record exists but did not re-open it
      validation_experiment_ids: [EXP-ECDLP-adb267]
      falsification_condition: >-
        The fitted exponent falls outside 0.30 to 0.70, OR the nested comparison
        prefers the logarithmic alternative, OR residual curvature is
        significant, OR leave-one-rung-out prediction fails. Note that the band
        alone does NOT discriminate the logarithmic alternative, which is why
        the nested comparison is part of the condition.
    - id: HEUR-002
      formal_statement: >-
        The seed-averaged estimator over s seeds has standard error
        sd(log T)/sqrt(s) with sd(log T) equal to 0.6413, so a rung of 12 curves
        times 48 seeds estimates R to about 0.0267 and a rung resolves its own
        predicted bias at three sigma only when 11.3 N^(-1/2) is at least
        3 times 0.6413/sqrt(n), i.e. when n is at least 0.0290 times N.
      random_model_justification: >-
        The central limit theorem applied to log T, with the standard deviation
        taken from the Rayleigh limit law for rho collision times. Rigorous
        given the limit law; heuristic in that the limit law is asymptotic and
        least accurate at the smallest rung, which is where the bias is largest.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-adb267]
      falsification_condition: >-
        The measured sd(log T) at any rung differs materially from 0.6413, in
        which case every required run count in this hypothesis must be
        recomputed from the measured value and the recomputation recorded as a
        protocol amendment.
  structural_ingredients:
    - description: >-
        The census's declared bit sizes 16, 20, 24, 28, 32 and 36 and the
        constraint that toy and medium runs cannot be promoted to
        cryptographic-scale claims.
      citation: RQ-ECDLP-165d4b
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-3baed3, read
        ledger/questions/RQ-ECDLP-165d4b.yaml in full
    - description: >-
        field_bits 12, 13, 14 and 15; an effect target of a Hodges-Lehmann
        paired median ratio at most 0.90; and a budget of 18720 wall-clock
        seconds with 104 maximum runs.
      citation: H-ECDLP-e42bda
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-3baed3, read the predictions, test_boundary
        and budget fields of ledger/hypotheses/H-ECDLP-e42bda.yaml directly
    - description: >-
        Executed prime-field measurements at p at most 100057, with the density
        sweep's variance ratio staying in [1.3, 3.6] and monotonic_decay False
        at both primes, reported honestly as the campaign's open question.
      citation: EV-ENDO-10109d
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-3baed3, read the observations and boundaries
        fields of ledger/evidence/EV-ENDO-10109d.yaml directly and confirmed the
        quoted interval, the decay flag and the p values
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: census_rows_with_any_executed_prime_field_measurement
      direction: different
      minimum_effect: >-
        Predicted 1 of 6, namely the 16-bit row via measurements at p at most
        100057, with the lane's own specified designs sitting BELOW even that
        row at 12 to 15 bits. A different count means the coverage audit is
        wrong and is itself the finding.
    - metric: fitted_decay_exponent
      direction: different
      minimum_effect: >-
        Between 0.30 and 0.70 with a half-width below 0.15 AND a nested
        comparison that does not prefer the logarithmic alternative. The band
        alone is insufficient: a term proportional to N^(-1/2) log N fits with
        an exponent near 0.41, inside the band, so the nested test is part of
        the criterion rather than an extra.
    - metric: matched_baseline_residual_at_12_bits
      direction: higher
      minimum_effect: >-
        At least 0.05, i.e. at least a 5 percent bias, which is at least half
        the 10 percent effect H-ECDLP-e42bda pre-registers. A measured residual
        below 0.01 at 12 bits refutes the claim and means the instrument is far
        cleaner at toy scale than argued, which is a good outcome and is
        reported as such rather than buried.
    - metric: minimum_admissible_bit_size_at_a_10_percent_target
      direction: different
      minimum_effect: >-
        Reported as an exact bit size with an interval. If it exceeds 15 bits,
        the lane's specified designs run entirely inside the regime where their
        own instrument bias is comparable to their target effect.
    - metric: family_dependence_of_c
      direction: different
      minimum_effect: >-
        Predicted agreement within overlapping intervals across matched-random,
        j = 0 adjacent and high-conductor families at a fixed bit size. A
        significant family effect means the calibration is not a single constant
        and cells must be compared within family as well as within size.
    - metric: sabotage_control_recovery
      direction: higher
      minimum_effect: >-
        The fitted c must increase by 56.4 within 25 percent when a 50-step
        overhead is injected, which at 12 bits moves the residual from 0.176 to
        1.057, a change of 33 standard errors at 576 runs. A flat c voids every
        number in the run.
  test_boundary:
    instances:
      - matched-random ordinary prime-order curves, non-anomalous, with declared
        embedding-degree and twist checks
      - 12 curves per rung, with a generation and rejection rule fixed before
        any run and the rejection reasons logged
      - a sabotaged ladder with a known injected overhead
      - j = 0 adjacent and high-conductor families at one fixed bit size
    parameters:
      rung_bit_sizes: [12, 14, 16, 18, 20, 22, 24, 26]
      required_runs_per_rung: [119, 476, 1903, 7610, 30440, 121760, 487000, 1948000]
      sd_log_T: 0.6413
      cost_model: one frozen model, hashed at every rung
    implementation: >-
      Charged rho with exact N per curve, seeds independent across rungs, and a
      BSGS row carried at every rung as the matched Pareto control.
    budget:
      wall_clock_seconds: 43200
      memory_gb: 8
      maximum_runs: 2600000
  falsification_conditions:
    - >-
      The fitted exponent falls outside 0.30 to 0.70, or the nested comparison
      prefers the logarithmic alternative, or residual curvature is significant,
      or leave-one-rung-out prediction fails. The power-law model is wrong and
      cross-cell comparison at toy scale is declared invalid until a better
      model exists.
    - >-
      R_inf differs significantly from 1. The normalisation constant, not the
      finite size, is wrong, which is a finding about the convention as
      implemented and is blocking for every normalised number in this lane.
    - >-
      The sabotage control does not recover the injected overhead within 25
      percent. The instrument cannot measure a bias it was told to expect and
      every number is void.
    - >-
      The 12-bit residual is below 0.01. The claim is refuted, the instrument is
      much cleaner at toy scale than argued, and every existing toy cell in this
      lane is strengthened.
    - >-
      c depends significantly on curve family. A single calibration constant
      does not exist and the census comparability rule must be per family, not
      per bit size.
    - >-
      Any rung is fitted without meeting its required run count and without
      being declared underpowered. That is a protocol violation rather than a
      result.
  interpretation_limits:
    - >-
      R IS CURVE-FREE BY CONSTRUCTION, AND THAT IS RECORDED AS A PROOF RATHER
      THAN RUN AS AN ARM. The normalised charged work of a pseudorandom walk
      divided by its own birthday-time prediction is a property of a walk on ANY
      group of order N; no elliptic curve is needed to produce the signature.
      This calibration therefore measures the INSTRUMENT and may never be cited
      as a statement about elliptic curves or the ECDLP. The only curve-bound
      part of the design is the family-dependence arm.
    - >-
      Toy to low-medium scale, 12 to 26 bits. Nothing extrapolates to the
      declared 32- and 36-bit rows, let alone to cryptographic scale, and the
      extrapolation is refused explicitly rather than caveated.
    - >-
      The calibration is for the CHARGED RHO instrument only. It does not
      transfer to decomposition-rate, index-calculus or isogeny-transport
      instruments, so it constrains EV-ENDO-10109d's non-decaying observation
      only by analogy, which is stated rather than implied.
    - >-
      A calibration constant makes cells comparable; it does not make any of
      them positive or negative. No mathematical claim about any curve family is
      made here.
    - >-
      THE PROPOSED SEED COUNT CANNOT SUPPORT MOST OF THE PROPOSED LADDER. At 12
      curves times 48 seeds only the 12- and 14-bit rungs resolve their own
      predicted bias at three sigma. The required counts are stated per rung and
      any rung not meeting them is declared underpowered rather than fitted.
    - >-
      This record measures BIAS in the null. It does not measure variance or
      Type II error, and neither substitutes for the other: a perfectly unbiased
      instrument can still be blind, and a well-powered one can still be
      systematically shifted.
  status: proposed
  proposed_by: idea-generator
