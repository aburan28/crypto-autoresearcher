hypothesis:
  id: H-RELN-940f14
  question_id: RQ-RELN-001
  parent_hypothesis_id: H-RELN-4d092c
  source_idea_ids: [IDEA-20260909-860d1e]
  goal_ids: [GOAL-RELN-001]
  batch_id: BATCH-9fba5a
  designed_by_task: TASK-20261001-5a45b1
  directed_by:
    - DEC-20261001-7fa9f9 (NA-1, NA-2)
    - DEC-20261001-f5e83a (R-1: new hypothesis and experiment, not an amendment)
  experiment_ids: [EXP-RELN-dc761f]

  statement: >-
    On the honest two-large-prime summation multigraph produced by the
    EXP-RELN-c5a377 v4 generator (exact two-point decomposition over points
    with x < B2; B = ceil(p^{1/5}), B2 = ceil(p^{2/5}); ordinary prime-order
    toy curves), at attempt budgets A_kappa = ceil(kappa (n_lp + 1) / y_edge)
    for kappa in {1, 2}, the number of cycles of length 3 and 4 on distinct
    vertices (multiplicity-weighted, statistic C34 of EXP-RELN-dc761f rule S-1)
        exceeds the same statistic on degree-preserving configuration-model rewires
    of the same graph (conditioned on no root-root edge, rule N-1) by a pooled factor of at least 1.25 (one-sided Monte
    Carlo p < 0.01). That is, the graph carries short-cycle (cycle-basis)
    enrichment that its degree sequence does not explain.

  direction_note: >-
    The hypothesis is stated in the direction the source idea claims
    (enrichment), because that is the mechanism under test. The Coordinator's
    prior favours the null match (see coordinator_prior). The statistic was
    chosen because it is NOT a function of (|E|, |V|, number of components),
    which is what made the v4 cycle-rank statistic unable to show enrichment
    (EV-RELN-3c9a24 obstruction).

  coordinator_prior:
    recorded_at: '2026-10-01'
    recorded_before_any_data: true
    enriched: 0.05
    null_matched: 0.80
    depleted_or_inconclusive: 0.15
    basis: >-
      Each attempt's R = a_j G + b_j Q is uniform on the group, and each
      unordered pair of large-prime x-classes is hit by the at most four points
      +-P1 +- P2, so LP edges are close to i.i.d. uniform pairs. Such a
      multigraph is, conditional on its degree sequence, close to the
      configuration model, whose short-cycle counts are its null. RUN-RELN-a695fe
      already showed cycle rank matching the rewire null (0.033 +- 0.028 delta
      units). The prior mass on enrichment is what remains for the
      first-decomposition precedence rule and the root hub to induce
      correlation.

  mechanism: >-
    Collect honest 2-LP relations with the v4 generator at four budgets that
    straddle the percolation threshold of the LP graph (kappa = 1/4, 1/2 below;
    1, 2 above; the configuration-model threshold is near mean degree 1, that
    is kappa = 1/2). Build the LP multigraph (root vertex for 1-LP relations).
    Count multiplicity-weighted 3- and 4-cycles. Compare with 999
    configuration-model rewires of each graph, pooling over fixtures at
    kappa in {1, 2}, where expected short-cycle counts are large enough to
    test. Any enrichment of short cycles is the observable form of cycle-basis
    structure: a minimum cycle basis contains exactly rank(cycles of length
    <= 4) cycles of length <= 4, so a short-cycle excess is an excess of
    short basis cycles.

  assumptions:
    - Ordinary prime-order short-Weierstrass toy curves (16, 20, 24, 28 bits); no CM, anomalous, supersingular or j in {0, 1728} curves.
    - No secret scalar labels, End(E) authority or uncharged membership oracles.
    - Toy scale only; no cryptographic-size or deployed-curve claim.
    - Timeouts, crashes and infrastructure failures are never negative mathematical evidence.
    - Index calculus here is Class I partial action (IDEA-20260806-c5d183); this experiment makes no cost claim.

  proof_search_map:
    bottleneck: >-
      Whether the honest LP multigraph's short-cycle count exceeds its
      degree-preserving null. The parent's delta > 1/4 gate needs a cycle-space
      excess of a factor L^{1/4} over what edge count gives; v4 showed cycle
      rank cannot carry that excess at fixed |E|.
    baseline_embedding:
      parameter_slice: >-
        The nine EXP-RELN-c5a377 v4 fixtures (16/20/24 bits x seeds 11/12/13)
        plus three 28-bit fixtures derived by rule F-2 of EXP-RELN-dc761f; v4
        generator unchanged; fresh seed namespace EXP-RELN-dc761f/v1.
      reproduction_check: >-
        Exact per-fixture LP-edge yields computed label-free at design time
        (exact_yield_budgets_out.json in TASK-20261001-5a45b1) agree with the
        realised v4 yields of RUN-RELN-a695fe (for example b24-s11 0.02255
        exact versus 352/15633 = 0.02252 observed). The executor must reproduce
        the frozen yields and budgets exactly before any attempt (rule P-5).
    observation_collision:
      observable: Pooled C34 ratio r = T_obs / mean T_null and its Monte Carlo p-value.
      distinct_preimage_search: >-
        Objects with the same degree sequence but different short-cycle
        structure: configuration-model pseudo-treatments (must not be called
        enriched above the nominal rate), spanning forests (C34 = 0, must not
        be called enriched), and degree-preserving planted triadic-closure
        objects (must be called enriched). All three run inside the
        experiment (controls K-FALSE-1, K-FALSE-2, K-POS) and were run on
        synthetic surrogates at design time (power_check_out_*.json).
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: Multiplicity-weighted 3- and 4-cycle count C34, not determined by (|E|, |V|, c)
        predicted_gain: Detected planted 1.25x enrichment in 100/100 synthetic experiments at the v4 noise level, with 0/100 false ENRICHED on the no-enrichment surrogate (design power check)
      - transform: observable_fiber
        proposed_object: Minimum-cycle-basis short-cycle count M<=4 = GF(2) rank of all cycles of length <= 4
        predicted_gain: Secondary reading of cycle-basis structure, comparable against the same rewires
    quantifier_order: >-
      For every frozen fixture (curve, B, B2, n_lp, exact y_edge, A_kappa) fixed
      before any attempt label is evaluated, and for the attempt stream drawn
      from the frozen SHA256 labels: the rewire replicates are drawn from their
      own labels conditional on the observed graph's stub list; the test
      statistic and decision rule are fixed in the contract before data.
    method_ceiling:
      strongest_certifiable_claim: >-
        Toy-tier measurement: on the tested fixtures, generator and budgets,
        the honest graph's short-cycle count is (or is not) enriched over its
        degree-preserving null by at least 1.25x. No asymptotic, cost or
        exponent claim.
      nearby_object_control: >-
        The same pipeline on configuration-model pseudo-treatments (same
        degree sequence, no structure) and on spanning forests must not return
        ENRICHED; on planted degree-preserving triadic-closure objects it must
        return ENRICHED.
    proof_obligations:
      - claim: Statistic C34 computed exactly (trace formula cross-checked against direct enumeration)
        responsibility: correctness
      - claim: Rewire null is degree-preserving and drawn from frozen labels
        responsibility: correctness
      - claim: Every relation carries a verified certificate a_j G + b_j Q = P1 + P2
        responsibility: correctness
      - claim: Conclusion scoped to tested fixtures, generator, budgets
        responsibility: scope
    not_applicable_reason: >-
      Empirical measurement, not a theorem; the map is filled as cheap
      pre-compute falsification checks, which is what section 8 asks of it.

  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    No complexity claim. A positive result would only motivate a parent-gate
    reading (delta_short > 1/4 at L = ceil(q^{1/5})), reported as a secondary
    quantity, and a separate costed hypothesis.

  heuristic_assumptions:
    - id: HEUR-RELN-940f14-1
      formal_statement: >-
        For each tested fixture and kappa in {1, 2}, conditional on the
        observed degree sequence (root included), the honest LP multigraph's
        C34 is distributed as C34 of the configuration model on the same stub
        list conditioned on no root-root edge (EXP-RELN-dc761f N-1), up to a
        factor in [0.8, 1.25] in mean.
      random_model_justification: >-
        R_j is uniform on the prime-order group. Each unordered pair of LP
        x-classes corresponds to at most four group elements (+-P1 +- P2) and
        is hit independently across attempts, so edges are nearly i.i.d. over
        pairs, with dependence only through the first-decomposition rule (an R
        with several decompositions keeps one) and the shared root vertex for
        1-LP relations. Short-cycle counts of the configuration model are
        asymptotically Poisson with mean nu^k / (2k), nu = E[d(d-1)] / E[d]
        (Bollobas; Janson; provenance recalled). For independent uniform
        edges the conditioned configuration model has exactly the surrogate's
        law given the degree sequence (both weight a root-loop-free multigraph
        by 1 / (prod multiplicity! x 2^{LP loops})). The design surrogate
        reproduced the v4 run's cycle-rank-versus-rewire noise
        (-0.004 +- 0.051 against 0.033 +- 0.028 delta units) and read pooled
        C34 ratio median 0.99 (5-95%: 0.92-1.08) against the conditioned null.
      supporting_results:
        - citation: Bollobas, A probabilistic proof of an asymptotic formula for the number of labelled regular graphs (1980); configuration-model short-cycle Poisson limit
          provenance: recalled
          verified_by: null
        - citation: EV-RELN-3c9a24 obstruction (cycle rank matches rewire null at A2)
          provenance: internal
          verified_by: DEC-20261001-7fa9f9
      validation_experiment_ids: [EXP-RELN-dc761f]
      falsification_condition: >-
        EXP-RELN-dc761f returns ENRICHED (pooled r >= 1.25, p_up < 0.01) or
        DEPLETED (p_lo < 0.01) with all validity controls passing.
    - id: HEUR-RELN-940f14-2
      formal_statement: >-
        The LP graph's percolation window lies between kappa = 1/4 and
        kappa = 1: on every fixture with n_lp >= 100 the giant-component
        fraction is below 0.25 at kappa = 1/4 and above 0.5 at kappa = 1.
      random_model_justification: >-
        With m = kappa (n_lp + 1) near-uniform edges on about n_lp + 1
        vertices, mean degree over the vertex universe is 2 kappa; the
        Erdos-Renyi giant appears at mean degree 1 (kappa = 1/2) (Erdos-Renyi
        1960, provenance recalled). The design surrogate gives median giant
        fraction 0.08 (24-bit-like) and 0.06 (28-bit-like) at kappa = 1/4,
        and 0.24-0.39 at kappa = 1/2.
      supporting_results:
        - citation: Erdos and Renyi, On the evolution of random graphs (1960)
          provenance: recalled
          verified_by: null
      validation_experiment_ids: [EXP-RELN-dc761f]
      falsification_condition: >-
        Any eligible fixture (n_lp >= 100) with giant fraction >= 0.25 at
        kappa = 1/4 or <= 0.5 at kappa = 1. Reported, not used by the primary
        verdict.

  structural_ingredients:
    - description: Imported lead (graphic-matroid cycle-basis large-prime enrichment)
      citation: IDEA-20260909-860d1e
      provenance: internal
      verified_by: TASK-20260910-672228
      role: proposal under test
    - description: Greedy (matroid) property of minimum cycle bases; Horton's candidate set
      citation: Horton, A polynomial-time algorithm to find the shortest cycle basis of a graph (SIAM J. Comput. 1987)
      provenance: recalled
      verified_by: null
      role: justifies M<=4 = rank of cycles of length <= 4 (secondary statistic only)
    - description: Configuration model short-cycle Poisson limit
      citation: Bollobas (1980); Janson, Luczak, Rucinski, Random Graphs (2000)
      provenance: recalled
      verified_by: null
      role: random model for HEUR-RELN-940f14-1

  reduction_chain:
    core_problem: ECDLP index calculus relation collection (prime field, toy)
    corollaries: []

  predictions:
    - metric: pooled C34 ratio r over fixtures x kappa in {1, 2}
      direction: higher
      minimum_effect: r >= 1.25 with one-sided Monte Carlo p_up < 0.01 (999 rewires)
    - metric: delta_short per bit size (secondary; L = ceil(q^{1/5}))
      direction: higher
      minimum_effect: parent-gate reading delta_short > 1/4, reported only

  test_boundary:
    instances:
      - ordinary_prime_field_bits_16
      - ordinary_prime_field_bits_20
      - ordinary_prime_field_bits_24
      - ordinary_prime_field_bits_28
    parameters:
      bits: [16, 20, 24, 28]
      seeds: [11, 12, 13]
      kappa: ['1/4', '1/2', '1', '2']
      primary_kappa: ['1', '2']
      B: ceil(p^{1/5})
      B2: ceil(p^{2/5})
      L_for_logs: ceil(q^{1/5})
      rewire_replicates: 999
    implementation: to be produced under experiments/EXP-RELN-dc761f/implementation/
    budget:
      maximum_runs: 1
      enforcement: advisory
      memory_gb: 4

  falsification_conditions:
    - >-
      NULL_MATCHED: pooled p_up >= 0.05 and r_up = (T_obs + 1.645 sigma_T) /
      mu_T < 1.25, with every validity control passing. Falsifies the
      enrichment claim on the tested scope.
    - DEPLETED: pooled lower-tail p_lo < 0.01 with every validity control passing.

  interpretation_limits:
    - Toy tier; 12 fixtures; v4 generator only; budgets kappa in {1/4, 1/2, 1, 2}.
    - NULL_MATCHED closes short-cycle enrichment over the configuration-model null only on this scope; other statistics, B2 exponents, Semaev or extension-field decompositions and larger q stay open.
    - ENRICHED does not by itself cross the parent's delta > 1/4 gate; that needs the secondary delta_short reading and a costed successor.
    - No cost or exponent claim under any outcome.
    - The approved protocol (when approved) does not assert the hypothesis is true.

  status: specified
  proposed_by: coordinator
