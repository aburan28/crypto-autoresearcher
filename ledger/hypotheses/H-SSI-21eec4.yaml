hypothesis:
  id: H-SSI-21eec4
  question_id: RQ-SSI-001
  source_idea: IDEA-20261006-300758
  title: >-
    The three order-2 kernels of y^2 = x^3 + x over F_67 produce
    fewer than three distinct codomain j-invariants.
  statement: >-
    Let E be y^2 = x^3 + x over F_67, and assume #E(F_67) = 68.
    Let the three kernels be the order-2 subgroups generated by the
    three points with y = 0. Let n be the number of distinct
    j-invariants of their Vélu codomains, computed in F_{67^2}.
    The claim is n ≠ 3.
  mechanism: >-
    The value n = 3 means the three kernels land on three distinct
    j-invariants, so this vertex has three distinct 2-isogeny
    neighbors. The value n < 3 means at least two kernels share a
    codomain j-invariant. Either outcome is a toy gate on one vertex
    of the supersingular 2-isogeny graph. Neither outcome is a walk,
    and neither changes the opened baselines Õ(p^{1/2}) and Õ(p^{1/4}).
  assumptions:
    - p = 67 is prime. The test checks that.
    - E is supersingular over F_67 exactly when #E(F_67) = 68. If that fails, n is not defined.
    - The three points with y = 0 are the full nontrivial 2-torsion. On this model they are the roots of x(x^2 + 1).
    - Codomains are identified by j-invariant, so F_67-twists with the same j contribute one value.
  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
    not_applicable_reason: >-
      This is a toy measurement of one integer at one vertex, not a
      proof, a reduction, or an asymptotic bound.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        The simple-graph reading of (ell+1)-regularity predicts n = 3
        at this vertex for ell = 2. That prediction is the null. It is
        not a theorem about distinct j-invariants at j = 1728. The
        sample is one curve at p = 67. No transfer is claimed.
      random_model_justification: >-
        No uniform-random model is asserted. The prime and the three
        kernels are fixed. Sample size one has no tail probability.
      supporting_results:
        - >-
          KN-TECH-024, opened this session, states that the
          supersingular ell-isogeny graph is (ell+1)-regular. For
          ell = 2 that is degree 3 before any identification of
          codomain j-invariants.
      validation_experiment_ids:
        - EXP-SSI-587b14
      falsification_condition: >-
        The census is defined and n equals 3. That refutes the
        inequality n ≠ 3. It does not refute (ell+1)-regularity as a
        count of kernels.
  structural_ingredients:
    - description: >-
        The supersingular ell-isogeny graph is (ell+1)-regular on
        about p/12 vertices. Generic path-finding is about O(p^{1/2})
        classically and O(p^{1/4}) on the F_p subgraph.
      citation: KN-TECH-024
      provenance: internal
      verified_by: coordinator, this design session, via knowledge/techniques/KN-TECH-024.md
      role: baseline regularity and path-finding cost that this measurement does not change
    - description: >-
        Full-graph meet-in-the-middle is expected Õ(p^{1/2}) time and
        space, and Õ(p^{1/4}) on the F_p-rational subgraph.
      citation: KN-LIT-078
      provenance: internal
      verified_by: coordinator, this design session, via knowledge/literature/KN-LIT-078.md
      role: opened cost baseline; those algorithms are not run
  predictions:
    - metric: absolute difference |n - 3|
      direction: different
      minimum_effect: 1
  test_boundary:
    instances:
      - E y^2 = x^3 + x over F_67
    parameters:
      p: 67
      curve: "y^2 = x^3 + x"
      field: "F_67[z]/(z^2 + 1)"
      expected_point_count: 68
    implementation: >-
      No committed degree-2 neighbor census exists. The missing driver
      factors x(x^2 + 1) over F_{67^2}, applies t = 3 x_T^2 + 1 and
      w = x_T t, and writes n. harness/isogeny_class.py velu_odd
      refuses even ell, including ell = 2, and does not implement that
      formula.
    budget:
      maximum_memory_gb: 1
      maximum_runs: 1
  falsification_conditions:
    - n equals 3, while the census is defined.
    - "#E(F_67) is not 68, so the census is not run and the inequality is not tested."
    - x(x^2 + 1) does not have three roots in F_{67^2}.
    - A dual 2-isogeny fails to restore j(E).
  interpretation_limits:
    - One curve at one prime. No statement about any other vertex or any larger p.
    - n = 3 means this distinct-neighbor defect is absent at this vertex. It does not close path-finding.
    - n < 3 is a collision of codomain j-invariants. It is not a shorter path-finding exponent.
    - Exponent delta against Õ(p^{1/4}) in the opened notes is 0.
  status: specified
  proposed_by: coordinator
  citations:
    - ref: KN-TECH-024
      provenance: internal
      claim: >-
        The opened note states that the supersingular ell-isogeny
        graph is (ell+1)-regular on about p/12 vertices, and that
        generic path-finding is about O(p^{1/2}) classically and
        O(p^{1/4}) on the F_p subgraph. It gives no distinct-neighbor
        count at p = 67.
      verified_by: coordinator, this design session, via knowledge/techniques/KN-TECH-024.md
    - ref: KN-LIT-078
      provenance: internal
      claim: >-
        The opened note reports full-graph meet-in-the-middle at
        expected Õ(p^{1/2}) time and space, and Õ(p^{1/4}) on the
        F_p-rational subgraph. No neighbor census at p = 67 is in the
        note.
      verified_by: coordinator, this design session, via knowledge/literature/KN-LIT-078.md
    - ref: IDEA-20261006-300758
      provenance: internal
      claim: >-
        The proposal states the prediction |n - 3| >= 1, with the
        negative outcome n = 3.
      verified_by: coordinator, this design session, via ledger/proposals/IDEA-20261006-300758.yaml
