hypothesis:
  id: H-FHE-d413e9
  question_id: RQ-FHE-001
  added: '2026-08-25'
  derived_from_idea: IDEA-20260807-a06996
  status: proposed
  proposed_by: coordinator

  statement: >-
    SCOPE. OpenFHE, Lattigo and TFHE-rs at PINNED COMMITS, source read from
    raw.githubusercontent.com, which RQ-FHE-001's own provenance block records as
    reachable and already used to verify those libraries' operation surface. The
    object is the tuple (ring degree N, log q, secret Hamming weight h, error
    sigma) shipped as a DEFAULT per library per security preset. Claim tier - this
    is a CENSUS and carries NO security claim of any kind. NO ATTACK, NO ESTIMATE,
    NO BIT COUNT.
    THREE CLAIMS, THE FIRST TWO DECIDABLE WITHOUT ANY PRIMARY SOURCE.
    A1, EXTRACTABILITY. The shipped default sparse or ternary secret parameter
    tuples are extractable verbatim from source at a pinned commit for all three
    libraries, with a file path and a line reference for every value, including h.
    A2, SPARSITY. At least one shipped default per library has secret Hamming
    weight h with h/N at most 0.05 - i.e. the libraries actually ship SPARSE
    secrets by default rather than full-weight ternary ones. THIS IS THE CLAIM
    WITH TEETH, because if every shipped default is full-weight ternary then the
    sparse-secret hybrid attack line, whatever its merits, is not aimed at any
    shipped default and RQ-FHE-001 does not deserve a goal on deployment grounds.
    B, OVERLAP - CONDITIONAL AND EXPECTED TO BE BLOCKED. A majority of the
    reported at-risk published parameter sets lie INSIDE the shipped default
    envelope in (N, log q, h). This claim is executable only if the identity of
    those sets can be obtained from a source filable as a KN-LIT entry with
    citation_verified other than web. RQ-FHE-001's provenance records
    eprint.iacr.org as unreachable, so the expected outcome is that arm B is
    recorded BLOCKED and no fraction is reported at all.

  mechanism: >-
    RQ-FHE-001 has been active since 2026-08-01 with ZERO hypotheses, ZERO
    proposals and ZERO evidence, the only question in the ledger with nothing
    attached. Its constraints block experiment DESIGN until primary sources are
    filed, and its provenance records eprint as unreachable - so the question
    cannot progress along the route it declared. But the same provenance block
    states that raw.githubusercontent.com IS reachable and was already used to
    verify the libraries' operation surface, and that their DEFAULT PARAMETERS
    have not been extracted. That extraction is the question's own fifth declared
    method (library-default parameter extraction directly from source, so the
    analyzed sets are what is shipped rather than what is published), needs no
    eprint, needs no attack, and has never been done.
    The extraction is mechanical. Each library exposes a small set of named
    security presets; each preset fixes N and a modulus chain and either fixes h
    as a compile-time constant or exposes it as a runtime parameter with a
    documented default. Reading those values at a pinned commit converts a
    secondhand claim about published parameter sets into a first-hand record of
    what is shipped. The tracked object is the tuple (N, log q, h, sigma) as a
    point in shipped-versus-published parameter space; each default configuration
    contributes one point and the shipped envelope is their convex description.
    The design is weak by construction and says so - it produces parameter tuples,
    never a mathematical statement about any hard problem. Its value is that it
    decides at very low cost whether the reported FHE security loss is a
    DEPLOYMENT problem or a PAPER-PARAMETER problem, which determines whether this
    question deserves a goal at all.

  assumptions:
  - >-
    raw.githubusercontent.com remains reachable from this harness, as RQ-FHE-001's
    provenance records it to be. If it is not, the run is failed_infrastructure and
    the question stays blocked for a stated reason - it is not evidence that
    defaults are unextractable.
  - >-
    Each library has an identifiable notion of DEFAULT that can be defined
    precisely and per library. Libraries ship several presets, so default must be
    fixed per library at Stage 0 and recorded, not assumed.
  - >-
    Where the Hamming weight is a runtime parameter rather than a constant, the
    location where it is set and its documented default value are recordable. If
    they are not, that library's h is recorded as NOT EXTRACTABLE, which is a
    result.

  proof_search_map:
    not_applicable_reason: >-
      A source-reading census. No theorem, asymptotic bound, algorithm, reduction
      or closure argument is proposed, and by explicit design NO security claim is
      made - the no-claim gate makes emitting any bit-security number an
      invalidation condition. There is no object for the KN-TECH-080 audits to
      bind. Any later proposal to run an estimator or an attack at these parameters
      is a different record and, if it claims a cost, is proof-oriented and needs
      its own map.
    bottleneck: null
    baseline_embedding:
      parameter_slice: null
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms: []
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations: []

  asymptotic_claim: null

  heuristic_assumptions:
  - id: HEUR-FHE-1
    formal_statement: >-
      Shipped defaults are representative of deployed configurations, in the sense
      that a parameter set outside every shipped default envelope is unlikely to be
      in production use.
    random_model_justification: >-
      None, and none is possible - users override defaults and no distribution over
      deployments is observable from source. This is recorded as a LIMIT OF THE
      CENSUS rather than tested, exactly as the parent proposal specifies.
    supporting_results: []
    validation_experiment_ids: []
    falsification_condition: >-
      NOT TESTABLE BY THIS DESIGN. It is stated so that no reader mistakes the
      census for a statement about deployments. Any conclusion of the form
      deployed systems are or are not affected exceeds this hypothesis's scope and
      is forbidden by the no-claim gate.

  structural_ingredients:
  - description: >-
      Hybrid attacks on LWE - guessing and meet-in-the-middle over sparse secrets,
      and ring-structure acceleration of the guessing and decoding steps.
    citation: KN-TECH-082
    provenance: internal
    verified_by: >-
      In-repo technique entry, read directly. It describes the machinery but frames
      no question, states no scope and has no experiment attached, and it is cited
      by zero ledger records. It is the reason the census is worth taking; NOTHING
      in this hypothesis tests it.
    role: motivation only, explicitly not under test
  - description: >-
      The reported claim that 12 of 16 recent published sparse Ring-LWE FHE
      parameter sets fall below their targeted 128-bit level under an enhanced
      hybrid decoding attack.
    citation: RQ-FHE-001 targets block
    provenance: recalled
    verified_by: >-
      NOT VERIFIED. RQ-FHE-001's provenance states that every technical claim in it
      originates from web-search result summaries gathered 2026-08-01, that
      eprint.iacr.org is unreachable, and that no primary source has been read. It
      is relayed here as that record's relayed claim and is NOT support for
      anything. Arm B exists only to test it and is expected to be blocked.
    role: the secondhand claim arm B would compare against, if it could

  reduction_chain:
    core_problem: null
    corollaries: []

  predictions:
  - metric: >-
      number of libraries for which every field of the default tuple
      (N, log q, h, sigma) is extractable at a pinned commit with a file path
    direction: higher
    minimum_effect: >-
      All three. The parent proposal's honest prior is 0.9 that defaults are
      extractable at pinned commits. Fewer than three, with the missing field
      named, means the question stays blocked for a stated reason.
  - metric: >-
      minimum over shipped defaults per library of the sparsity ratio h/N
    direction: lower
    minimum_effect: >-
      At most 0.05 for at least one shipped default in each library. A minimum
      ratio above 0.05 in every library means no shipped default is sparse in the
      sense the attack line targets.
  - metric: >-
      fraction of reported at-risk published parameter sets lying inside the
      shipped default envelope
    direction: different
    minimum_effect: >-
      Any value; zero and one have opposite implications and both are decisive.
      CONDITIONAL on obtaining the identity of those sets from a filable source;
      otherwise reported BLOCKED and not estimated.

  test_boundary:
    instances:
    - >-
      OpenFHE, Lattigo and TFHE-rs at three pinned commits, one per library, each
      commit sha recorded before extraction begins.
    parameters:
      libraries: 'OpenFHE, Lattigo, TFHE-rs'
      excluded: 'HEaaN, which RQ-FHE-001 names in scope but whose source availability is not established by this design; its absence is recorded rather than worked around'
      fields: 'ring degree N, log q (modulus chain), secret Hamming weight h, error sigma'
      arms: 'sparse or ternary secret defaults, and uniform-secret defaults as the baseline'
      sparsity_threshold: 'h/N at most 0.05, fixed before extraction'
    implementation: >-
      Source reading at pinned commits over raw.githubusercontent.com, every value
      recorded verbatim with a file path and a line reference. No build, no
      execution of library code, no estimator, no attack.
    budget:
      wall_clock_seconds_per_run: 1800
      total_cpu_hours: 0.5
      maximum_memory_gb: 4

  distinguishable_outcomes:
  - outcome: >-
      All three libraries yield complete default tuples at pinned commits, and at
      least one shipped default per library has h/N at most 0.05.
    means: >-
      The libraries ship genuinely sparse secrets by default and the tuples are on
      the record first-hand for the first time. This makes the sparse-secret
      question a potentially deployment-relevant one and justifies opening the
      source gate that RQ-FHE-001's constraints require. IT IS NOT A SECURITY
      CLAIM and states nothing about whether any parameter set is weak.
  - outcome: >-
      Every shipped default in every library has h/N above 0.05, i.e. the shipped
      secrets are full-weight ternary rather than sparse.
    means: >-
      A2 is FALSE. The sparse-secret hybrid attack line is not aimed at any shipped
      default, the reported security loss is a paper-parameter problem rather than a
      deployment problem on this axis, RQ-FHE-001 does not deserve a goal on
      deployment grounds, and that is a cheap and durable answer obtained without
      reading anything blocked.
  - outcome: >-
      One or more libraries' defaults are not extractable at a pinned commit -
      typically because h is set at runtime with no recorded default.
    means: >-
      A1 is FALSE for that library. It is recorded as such with the exact field
      that could not be extracted, and the question stays blocked FOR A STATED
      REASON rather than for an unexamined one. This is a real result and it names
      what would unblock it.
  - outcome: >-
      The sparse-secret and uniform-secret shipped envelopes differ materially in
      (N, log q).
    means: >-
      Sparseness is not the only variable separating the two shipped regimes, so
      any later comparison that attributes a difference to sparseness alone is
      confounded. The confound is stated rather than assumed away, and it changes
      how a future estimator recount must be designed.
  - outcome: >-
      The identity of the reported at-risk published parameter sets cannot be
      obtained from a source filable with citation_verified other than web.
    means: >-
      Arm B is BLOCKED. No overlap fraction is computed, none is estimated, and the
      blockage is reported as the state of the question. This is the expected
      outcome and it is not a negative result about anything mathematical.

  falsification_conditions:
  - >-
    Every shipped default in every library has h/N above 0.05 - A2 is false and no
    shipped default is sparse in the sense the attack line targets.
  - >-
    Any library's default tuple is incomplete at a pinned commit, with the missing
    field named - A1 is false for that library.
  - >-
    The reported at-risk published sets are obtainable AND none of them lies inside
    any shipped envelope - claim B is false, the reported loss is a paper-parameter
    problem, and RQ-FHE-001 does not deserve a goal.
  - >-
    Any extracted value lacks a commit sha and a file path - the pinning gate has
    failed and the census is void, since an unpinned parameter is not a shipped
    parameter.
  - >-
    The census emits any security level, bit count or estimator output - the
    no-claim gate has failed and the record has exceeded its declared scope.

  prior_evidence_refs:
  - RQ-FHE-001
  - KN-TECH-082
  - KN-OPEN-026

  interpretation_limits:
  - >-
    A census carries NO security claim and this hypothesis makes none. An estimator
    bit-count is not an attack and neither is a parameter tuple.
  - >-
    Nothing here tests KN-TECH-082's machinery. It identifies whether doing so
    would matter.
  - >-
    HEUR-FHE-1 (shipped defaults are representative of deployed configurations) is
    NOT tested and is stated as a limit. Users override defaults, and no statement
    about deployed systems is licensed.
  - >-
    HEaaN is in RQ-FHE-001's declared scope and is NOT covered here because its
    source availability is not established. That gap is recorded, not filled by
    substitution.
  - >-
    RQ-FHE-001's constraint 1 blocks experiment design until primary sources are
    filed as KN-LIT entries. Whether a no-claim source census falls inside that
    block is a SCOPE RULING that only the approver can make, and it is raised in
    the paired contract's approval gate rather than assumed either way.
