      STAGE 0, AUTHORIZED: any of the three known-false claims is ACCEPTED by the
      pipeline — that the product of unknown bounds falls with arity m; a monomial
      support with a missing bidegree; a claim of gamma_2 >= 1 asserted without
      lattice dimension and determinant recorded. That is a proves-too-much failure
