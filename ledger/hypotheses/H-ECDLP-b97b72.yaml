  interpretation_limits:
    - >-
      THE DENSITY-OBSERVABLE COLLISION IS BINDING AND IS THE SINGLE MOST IMPORTANT
      LIMIT ON THIS RECORD. The proposal's own observation-collision audit
      succeeded: the arity-2 density observable does not separate the height box
      from a matched negation-closed random base of the same size. No claim of this
      hypothesis may be founded on the density observable, and any successor that
      reports a coverage advantage has collided with the null and must say so
      explicitly in its own record.
    - >-
      Stage 0 can conclude only that five declared fixtures reproduce under
      independent recomputation and that three known-false claims are rejected. It
      cannot conclude anything about gamma_m, about whether the lane is open or
      closed, about the height box's additive structure, or about the ECDLP.
    - >-
      KN-OPEN-020 CLASS, DECLARED: implicit-membership description. The defining
      condition is not algebraic over F_p at all — membership is a statement about a
      lift to Z, decided by continued fractions — so the base is not merely outside
      the bounded-degree scoped class but outside the algebraic frame in which that
      class was posed. This record does NOT claim the universal theorem KN-OPEN-020
      asks for.
    - >-
      REPRESENTATION CLASS: R1 of RQ-ECDLP-623a32, the redundant-integer branch. It
      is NOT the affine-coordinate-function family that this campaign's Stage 0
      calibrators of 2026-09-13 (P-S0-XLOW2 and siblings) tested: the lens is a lift
      of one coordinate to Z^2, the operation set is a partial translation action
      rather than doubling, and the claim is about search cost rather than about a
      surrogate value.
    - >-
      Not F1 as lens — rho appears only as the mandatory baseline. F2 (Semaev
      decomposition) is a named COMPONENT, not the lens. Not F5: nothing is lifted
      p-adically; the lift here is of a residue class to Z, a different operation
      from lifting a point to Q_p. Not the Kummer line and not a degree-d function
      on E.
    - >-
      The conditional exponent of part (B) is a CONDITIONAL. Nothing in this record
      establishes an exponent improvement, established_exponent_gain is 0, and the
      record's own prediction is that the conditional's hypothesis is false.
    - >-
      Part (A)'s density half is IDEA-20260905-ab4a6e's result in a different
      coordinate system and is CREDITED, not claimed. The independent content of
      this record is the search side.
    - >-
      gamma IS A PROPERTY OF A DECLARED STRATEGY, NOT OF THE PROBLEM. A computed
      gamma bounds what the declared shift-polynomial set achieves. Reporting it as
      "the" small-root exponent would overclaim.
    - >-
      The frozen dispersion numbers were computed during ideation by exact
      enumeration over the whole group. They are a FIXTURE to be independently
      recomputed, not an evidence record: no hypothesis status follows from them.
    - >-
      TOY-SCALE BOX-TO-FIELD RATIO. At p = 10007, H = 10 the box holds 1.27 per cent
      of F_p, far larger than any cryptographic analogue, which biases every density
      measurement toward apparent structure. Disclosed; the p-ladder is the only
      available defence and it is a weak one, and it is unauthorized.
    - >-
      novelty_status of the source proposal is `unverified`. No external literature
      was opened, and a reviewer should treat the possibility that a height-box
      ECDLP factor base appears in the published literature as OPEN rather than
      excluded.

  confounders:
    - >-
      NEGATION CLOSURE. The height box is closed under y -> -y, which forces
      c(-R) = c(R) and c(O) >= B. A null that is not negation-closed differs for
      that reason alone. This is why the matched null is drawn as a random x-SET,
      and it is the single most likely source of a spurious positive in the density
      half. Negation closure is declared LOAD-BEARING.
    - >-
      HEIGHT NORMALISATION. Symmetric against asymmetric reduction of alpha, and
      whether beta may be negative, change c_H by a factor of order one and |F_H| by
      tens of per cent at small H. Every count uses the frozen normalisation.
    - >-
      MEAN CONSERVATION. By KN-FIND-007 the mean decomposition count cannot
      distinguish any base from any other of the same size. A pipeline reporting
      agreement of MEANS as evidence that the box behaves randomly has measured
      nothing; the dispersion index and the unreachable-target count are the only
      informative statistics here.
    - >-
      LATTICE HEURISTICS. Multivariate small-root methods are heuristic in the
      number of unknowns: a successful reduction can return algebraically dependent
      polynomials from which no root is recoverable. A reported LEAD must exhibit
      the recovered integers and verify the relation by direct point arithmetic.
    - >-
      Accidental smoothness of n and the anomalous case #E = p at toy scale,
      excluded per KN-TECH-034 before a curve enters the run set. The p = 10007 cell
      has n = 9851 prime and n != p.

  assumptions:
    - Odd prime p, ordinary short-Weierstrass curve, prime group order n.
    - >-
      The height is taken in the asymmetric normalisation
      ht(x) = min of max(|alpha|, beta) subject to alpha = x*beta mod p and
      1 <= beta, with alpha reduced to the symmetric interval. All frozen counts use
      exactly this normalisation.
    - >-
      F2 (Semaev decomposition) is a named COMPONENT, not the lens; the lens is the
      height representation and the small-root reduction. F1 appears only in the
      baseline controls.
    - >-
      Descent is NOT part of the design and is therefore not charged. A height
      function is exactly what makes descent conceivable, and a successor that adds
      it must re-charge the whole path.
    - No secret scalar is targeted; every cell is a public toy.
    - >-
      The conditional in part (B) assumes the base's own discrete logarithms are
      obtained from the linear algebra in the usual way, and that a relation once
      FOUND is verified by direct point arithmetic, so no false relation can enter
      the matrix.

