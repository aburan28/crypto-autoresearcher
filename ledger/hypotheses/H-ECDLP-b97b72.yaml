  related_hypotheses_note: >-
    H-ECDLP-4a00b8 (P-S0-XLOW2) is cited as the STRUCTURAL TEMPLATE for this
    record's field layout and Stage 0 conventions, not as scientific support.
    That record's object is an affine-coordinate-function residue; this one's
    object is a lift of x to Z^2 with a partial translation action, an
    explicitly different representation class (R1 of RQ-ECDLP-623a32).

  statement: >-
    The rational-reconstruction height ht(x) = min-over-lifts of
    max(|alpha|, beta) subject to alpha = x*beta mod p and beta >= 1 is a size
    function on F_p, and the induced height box
    F_H = {P in E(F_p) : ht(x(P)) <= H} is a factor base whose membership is
    polylog (continued fractions) and NOT cut out by any bounded-degree
    algebraic condition over F_p. Two consequences are asserted, and they are
    of different kinds. (A) EXACT, requirement side: with B = |F| = c_H*H^2 and
    the density condition B^m ~ n forced by the KN-FIND-007 mean-yield identity,
    the box side is H = p^{1/(2m)+o(1)} and the product of the 2m integer
    unknown bounds of an arity-m relation equation is H^{2m} = n/c_H^m =
    p^{1+o(1)}, INDEPENDENTLY OF m. The arity-m relation search is therefore
    pinned at the small-root uniqueness threshold for every arity and no choice
    of m moves it off. (B) CONDITIONAL, achievable side: define gamma_m as the
    supremum of exponents gamma such that a DECLARED small-root method returns a
    box solution of the homogenised arity-m relation equation whenever the
    product of the unknown bounds is at most p^gamma. IF gamma_m >= 1 for some
    m, THEN one relation costs polylog(p), B = p^{1/m} relations are needed,
    sparse linear algebra costs p^{2/m}, and the end-to-end charge is
    p^{2/m+o(1)} — worse than rho at m <= 3, a tie at m = 4, strictly better
    from m = 5. THIS RECORD PREDICTS THE HYPOTHESIS OF THAT CONDITIONAL IS
    FALSE: gamma_m < 1 strictly for every m >= 2, and gamma_m non-increasing in
    m because the homogenised f_{m+1} has per-variable degree 2^{m-2}. The
    two-sided squeeze — a requirement constant at exactly 1 and an achievable
    exponent decreasing in m — is the named, computable obstruction the record
    offers for the whole size-function lane.
    STAGE 0, AND ONLY STAGE 0, IS AUTHORIZED (DEC-20260913-0f8468). Stage 0
    asserts nothing about gamma_m. It asserts only that the five frozen fixture
    anchors (a)-(e) of EXP-ECDLP-1bef8f reproduce exactly under independent
    recomputation: the f_3 relation condition at p = 101, the box counts and
    B = 138 at p = 10007, the 9-monomial support, the pinning ratio
    H^4/p = 0.99930, and the dispersion cell with its seeded matched null. No
    ECDLP instance is solved, no scalar is recovered, no lattice is built, and
    no gamma is computed under this authorization.
    BINDING LIMIT CARRIED FROM THE PROPOSAL'S OWN AUDIT: the arity-2 density
    observable does NOT separate the height box from a matched negation-closed
    random base (dispersion 2.8875 against 2.9163 in range 2.7628-3.1316; 3704
    against 3712.3 unreachable targets). No claim of this hypothesis may be
    founded on the density observable, and any successor reporting a coverage
    advantage has collided with the null and must say so.

  mechanism: >-
    WHY A SIZE FUNCTION IS THE RIGHT THING TO WANT. Index calculus over F_p^*
    works because Z carries a size function compatible with multiplication:
    residue classes have small representatives, small integers factor into small
    primes, and the rational sieve reads relations off that hierarchy. The
    standing diagnosis of prime-field ECDLP (KN-OPEN-001) is that no such size
    function exists on the curve. This record's mechanism is that the diagnosis
    is half true and the other half is precise: F_p carries the
    rational-reconstruction height, by Minkowski on the rank-2 lattice
    {(alpha, beta) : alpha = x*beta mod p} of determinant p every x has
    ht(x) <= (4p/3)^{1/2}, the height is computed in polylog time from the
    continued-fraction expansion of x/p, and |F_H| = c_H*H^2 with c_H of order
    one. So the base has an O(log p)-bit description, membership costs polylog,
    and the defining condition is a statement about a LIFT TO Z rather than an
    algebraic condition over F_p — the escape route KN-OPEN-020 leaves open,
    taken concretely.
    THE OBJECT AND ITS OPERATION SET. The tracked object is
    pi(P) = (ht(x(P)), 1[ht(x(P)) <= H]). Under the FULL translation action pi
    does not propagate at all — adding an arbitrary point randomises the height,
    the rigidity of IDEA-20260806-c5d183 and KN-FIND-ffe1df Theorem C. pi
    propagates only along Sigma = translation by base points, and only on the
    sub-domain of box-decomposable targets, where the propagation rule is the
    relation-vector increment. The object is therefore CLASS I, PARTIAL ACTION.
    LOSSY-PROJECTION TEST. pi retains about (1/2)log_2 p of log_2 p bits (the
    image of ht has size at most (4p/3)^{1/2}) and discards y entirely; at the
    frozen cell p = 10007, H = 10 the box holds 127 of 10007 field elements, 69
    of which are on-curve x-values carrying 138 points, so pi collapses 9851
    group elements onto a 138-element base plus one bottom symbol. The discard is
    NOT claimed to be a block system of the full translation action — it cannot
    be, by Theorem C. It is compatible with Sigma in the partial-action sense.
    The branching is stated rather than assumed away: mean B^m/n = 1.9332 at the
    frozen cell with dispersion index 2.8875, and the search is charged over
    those branches. The height-minimal lift by itself IS a bijection and would be
    a change of coordinates, which is exactly why the tracked object is the
    HEIGHT and the box indicator, not the lift.
    THE ONE OPEN NUMBER. For a partial action the priced quantity is the cost of
    the partial step: here, finding a relation given that one exists. Homogenise
    — put x_1 = alpha_1/beta_1 and x_2 = alpha_2/beta_2 into
    f_3(x_1, x_2, x_3) = (e_2 - a)^2 - 4*e_1*(e_3 + b) with e_i the elementary
    symmetric functions, and clear denominators: F(alpha_1, beta_1, alpha_2,
    beta_2) = beta_1^2*beta_2^2*f_3 is an integer form of total degree 4 in 4
    unknowns with exactly 9 monomials and bidegree (2,2), and the relation
    condition is F = 0 mod p with all four unknowns bounded by H. gamma_2 for
    THAT support, against the requirement H^4 = p, is the deliverable the
    proposal asks for and is the quantity Stage 1 would compute. At the frozen
    cell H^4 = 10000 and p = 10007, i.e. H^4/p = 0.99930 — the instance sits on
    the threshold to four digits, which is the density condition and not a
    coincidence.
    WHAT STAGE 0 DOES. Stage 0 is the hard gate that makes every later stage
    readable: exact integer arithmetic reproducing the relation condition, the
    box counts, the monomial support, the pinning ratio and the dispersion cell,
    with the three known-false claims rejected. It builds no lattice, computes no
    gamma, and authorizes nothing further.

  asymptotic_claim:
    claim_status: conditional_only_nothing_established
    problem: >-
      Discrete logarithm in a prime-order subgroup of E(F_p) for a prime field
      F_p (prime-field ECDLP).
    prior_best: >-
      Pollard rho with distinguished points, about 0.886*sqrt(n) group
      operations at O(1) memory per processor; BSGS at about 2*sqrt(n) time and
      sqrt(n) memory. Prime-field index calculus has no known advantage
      (KN-OPEN-001).
    time_exponent: >-
      CONDITIONAL ONLY: p^{2/m + o(1)} at arity m IF gamma_m >= 1. PREDICTED
      BRANCH (what this record expects): p^{1+o(1)}, because gamma_m < 1 makes
      the search fall back to the B^{m-1} = p^{(m-1)/m} enumeration. Nothing is
      established: established_exponent_gain is 0.
    memory_exponent: >-
      CONDITIONAL ONLY: p^{1/m} — the base plus a sparse relation matrix with B
      rows of m nonzeros. This is the one axis on which the conditional design is
      not dominated by BSGS or the preprocessing frontier at m >= 3. Lattice
      memory per relation is polylog in p and polynomial in the lattice
      dimension, and is charged to gamma rather than hidden.
    hidden_cofactor: >-
      Disclosed, and the first item is the honest killer of the conditional even
      if gamma_m >= 1 held. (i) The c_H^m factor: the density condition is
      H^{2m} = n/c_H^m, so the arity that cheapens the linear algebra makes the
      constant exponential in m; at m = 5 with c_H = 1.3 the factor is 3.7,
      harmless, but an m growing with p turns c_H^m into a genuinely
      sub-exponential term and the o(1) is then NOT negligible. (ii) Semaev
      degree growth: the homogenised f_{m+1} has per-variable degree 2^{m-2}, so
      the lattice dimension for a fixed strategy grows at least like the monomial
      count of a degree-2^{m-2} form in 2m variables — polynomial in p^{o(1)} for
      fixed m, with a constant that is astronomically large by m = 5, charged to
      gamma rather than swept into o(1). (iii) Descent is NOT charged because it
      is not in the design; a successor that adds it must re-charge the whole
      path. (iv) The linear algebra is assumed sparse-solvable at B^2. (v)
      Recovery of the base's own logarithms assumes the matrix has full rank
      minus one, which at B = p^{1/m} and B relations is a near-square system and
      may need a constant factor more relations.
    claim_kind: exponent_improvement
    claim_kind_note: >-
      The KIND of improvement the conditional would be, recorded so a reader can
      see what is at stake. It is NOT an assertion that an improvement exists.
      No transition of this hypothesis toward `supported` is admissible: the four
      promotion gates of agents/coordinator.md are unmet, and Stage 1 — the step
      that would compute the conditional's hypothesis — is unauthorized.

  proof_search_map:
    carried_from: IDEA-20260913-c5f90d
    bottleneck: >-
      gamma_m, the small-root exponent achievable for the homogenised arity-m box
      relation equation, against the requirement gamma_req = 1 forced by the
      density condition. Every cost statement in this record is a function of
      that one quantity: the requirement side is exact algebra and the achievable
      side is one symbolic computation nobody in this program has performed.
    baseline_embedding:
      parameter_slice: >-
        H = (4p/3)^{1/2}: the box is ALL of F_p, membership is vacuous, the
        density condition is trivially met at m = 1, and the algorithm degenerates
        to exhaustive enumeration at cost p. H = 1: the box is {0, 1, -1}, B is
        O(1), no target decomposes, and the cost formula must return infinity
        rather than a small number. m = 1: the base must contain the target
        itself, so the relation search IS the ECDLP and the charge is p.
      reproduction_check: >-
        Symbolic plus a frozen fixture. The cost formula max(B*search, B^2) must
        return p at the H-maximal end and at m = 1 and must diverge at H = 1,
        with no end special-cased; a formula that fails any of the three is not a
        cost model. Additionally, Stage 0 anchor (a) IS the baseline reproduction
        for the relation condition: 6441 realisable ordered x-triples at
        (p, a, b) = (101, 3, 5) with zero false negatives and zero false
        positives. That fixture is authorized and is the only part of this audit
        Stage 0 executes.
    observation_collision:
      observable: >-
        The arity-2 decomposition-count vector over all targets and its summary
        statistics: mean, variance, dispersion index, unreachable-target count,
        maximum, c(O).
      distinct_preimage_search: >-
        REQUIRED, RUN, AND ALREADY SUCCESSFUL — the single most important audit
        in this record and the reason the design points at search rather than
        coverage. At the frozen cell the height box gives dispersion 2.8875 and
        3704 unreachable targets; a matched negation-closed RANDOM base of the
        same size gives 2.9163 (range 2.7628-3.1316 over 60 seeded draws) and
        3712.3 unreachable targets. Two structurally unrelated bases produce the
        same observation, so THE DENSITY OBSERVABLE DOES NOT IDENTIFY THE HEIGHT
        BOX: the mean cannot separate them by KN-FIND-007's conservation
        identity, and the frozen numbers show the second moment does not either.
        Consequence, binding on this hypothesis and every successor: no claim may
        be founded on the density observable, and any successor reporting a
        coverage advantage has collided with the null and must say so. The
        separating quantity must be the search cost.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "F_p has no size function" by "F_p has the
          rational-reconstruction height; what does that size function cost".
          Encoding: exact — ht is single-valued and polylog-computable, and the
          height-minimal lift is unique off a tie set broken by a declared rule.
          Completeness: exact — every x has ht(x) <= (4p/3)^{1/2}. Soundness:
          spent on nothing, the reduction is an identity. Cost loss: the whole
          question moves onto gamma_m, which is computable.
        predicted_gain: >-
          Turns a qualitative diagnosis into one symbolic computation and yields
          the requirement-side exponent 1 for free.
      - transform: constraint_transfer
        proposed_object: >-
          Transfer the relation condition from F_p to Z: a box relation is an
          integer solution of one modular equation in 2m unknowns, so the
          relation search becomes a small-root problem rather than a Groebner
          problem. Encoding: exact after homogenisation (the 9-monomial form).
          Soundness: a recovered root is verified by direct point arithmetic,
          which is cheap, so no false relation can enter the matrix.
        predicted_gain: >-
          Replaces the step prime-field index calculus is universally agreed to
          fail at with a step that has a published cost theory, making the
          failure measurable instead of asserted.
      - transform: observable_fiber
        proposed_object: >-
          Hold the density observable fixed and vary the forgotten structure
          (height box against matched negation-closed random base). The intrinsic
          invariant distinguishing them is the existence of a low-dimensional
          integer lattice containing the base's lifts; the random base has none.
        predicted_gain: >-
          Identifies search, not coverage, as load-bearing, and supplies the
          known-false control for any coverage-based claim.
    quantifier_order: >-
      FOR ALL odd primes p, FOR ALL H with 1 <= H <= (4p/3)^{1/2}, THERE EXISTS a
      base F of size c_H*H^2 whose membership is decided in polylog(p) time; and
      FOR ALL arities m, the density condition B^m ~ n IMPLIES that the product of
      the 2m unknown bounds is n/c_H^m. Both are universal statements with an
      exact existential in the middle and both are proved by computation, not
      assumed. The cost claim is strictly weaker and is stated separately: FOR the
      declared shift-polynomial strategies, THERE EXISTS a computable gamma_m, and
      gamma_m < 1 is a PREDICTION about those strategies. THE READING NOT CLAIMED:
      "FOR ALL small-root methods, gamma_m < 1", which no computation in this
      design can establish and which the LEAD branch is allowed to refute.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "for the declared supports, shift-polynomial strategies and
        lattice implementations, the achievable small-root exponent is [these
        numbers] against a requirement of 1, the univariate positive control
        passed, and no declared strategy reached the threshold". It can NEVER
        certify that no small-root method reaches gamma = 1, because that is a
        statement about all methods; and it certifies nothing about the ECDLP
        beyond the tested cells. Under the Stage-0-only authorization the ceiling
        is far lower still: the strongest certifiable Stage 0 claim is that five
        declared fixtures reproduce under independent recomputation.
      nearby_object_control: >-
        TWO controls in opposite directions, both specified and both unauthorized
        at Stage 0. (1) THE OBJECT WHERE THE HOPED-FOR CONCLUSION HOLDS: a
        univariate degree-4 modular equation with a root below p^{1/4}, where
        small-root solving provably works. A pipeline that fails there has no
        power and every negative read from it is inadmissible; the cell is
        reported UNTESTED rather than closed. (2) THE OBJECT WHERE IT FAILS: a
        RANDOM 9-monomial degree-4 form modulo p with the same support and the
        same bounds, which has a box root with probability of order one by
        counting but carries no elliptic structure. If the pipeline solves the
        random form at the threshold, gamma is a property of the support and not
        of the curve, and any curve-specific claim is refuted before it is made.
    proof_obligations:
      - claim: >-
          f_3 = (e_2 - a)^2 - 4*e_1*(e_3 + b) vanishes exactly on realisable
          x-triples: 6441 ordered triples at (p, a, b) = (101, 3, 5), zero false
          negatives, zero false positives.
        responsibility: baseline
        stage: 0
      - claim: >-
          |F_H| = 23, 39, 47, 111, 127 and c_H = 1.438, 1.560, 1.306, 1.370,
          1.270 at H = 4, 5, 6, 9, 10; 69 on-curve x-values carrying B = 138 base
          points and n = 9851 prime at (p, a, b) = (10007, 1, 28); H^4/p =
          0.99930.
        responsibility: baseline
        stage: 0
      - claim: >-
          The homogenised arity-2 form has exactly 9 monomials of total degree 4,
          all nine bidegrees in the 3-by-3 grid of exponents 0..2 present, with
          the frozen coefficient list.
        responsibility: size
        stage: 0
      - claim: >-
          The density condition forces the product of the 2m unknown bounds to
          equal n/c_H^m for every m.
        responsibility: size
        stage: 0
      - claim: >-
          pi = (ht, box indicator) is lossy, propagates only under Sigma on the
          decomposable sub-domain, and is therefore Class I and not a block system
          of the full translation action.
        responsibility: correctness
        stage: 0
      - claim: >-
          The conditional total is max(B*search, B^2) = p^{2/m} at gamma_m >= 1,
          with the crossover against 0.886*sqrt(n) at m = 4.
        responsibility: runtime
        stage: unauthorized_stage_1_or_later
      - claim: >-
          gamma_2 (and gamma_3) for the declared supports and shift-polynomial
          strategies, with lattice dimension and determinant recorded, and the
          univariate positive control passing.
        responsibility: feasibility
        stage: unauthorized_stage_1
      - claim: >-
          Membership, relation search, linear algebra, time and memory are all
          charged; descent is excluded by design rather than by omission; no false
          relation can enter the matrix because every recovered root is verified by
          point arithmetic.
        responsibility: interface
        stage: unauthorized_stage_1_or_later
      - claim: >-
          No transfer off the frozen cells and the declared ladder; the
          cryptographic-scale statement is an extrapolation over more than 200
          bits and is labelled as one.
        responsibility: scope
        stage: 0
    not_applicable_reason: null

  rerandomization: null

  heuristic_assumptions:
    - id: HEUR-1
      proposal_id: H1-IDEA-20260913-c5f90d
      carried_verbatim_from: IDEA-20260913-c5f90d
      formal_statement: >-
        For the height box F_H = {x in F_p : ht(x) <= H} with H = o(p^{1/2}), the
        induced curve base F = {P in E(F_p) : x(P) in F_H} behaves with respect to
        ADDITIVE statistics on E(F_p) like a uniformly random negation-closed base
        of the same size. Formally: the arity-m decomposition count c_m(R) over
        targets R has the same first two moments as for a uniformly random
        negation-closed base of size |F|, up to O(|F|^m * n^{-3/2}).
      rigorous_support: >-
        The first moment needs no heuristic at all: KN-FIND-007's conservation
        identity fixes the mean at C(B+m-1, m)/n exactly, whatever the base. The
        heuristic half is the SECOND moment — that the height box has no additive
        structure on the curve beyond the random model. It imitates the classical
        statement that a Farey-type set of rationals of bounded height is
        equidistributed modulo p with square-root-cancellation error, the additive
        analogue of the Weyl/Kloosterman bounds for such sets.
      random_model_justification: >-
        Comparison law: the balls-in-bins distribution of the decomposition count
        for a uniformly random negation-closed base of the same size, whose
        dispersion index at the frozen cell is 2.9163 (range 2.7628-3.1316, seed
        20260913, 60 draws). No smoothness law and no Dickman-de Bruijn statement
        is involved: the size function here is Archimedean height, not
        multiplicative smoothness, which is exactly the difference between this
        base and the F_p^* rational sieve.
      validation_plan: >-
        SAMPLE: the COMPLETE decomposition-count vector over all n targets, for
        the height box at every H on a declared ladder, at three field sizes
        (p = 10007 exactly enumerable; p near 2^20 and 2^26 by the same exact
        enumeration with the group indexed once). SHORTCUT MAKING SAMPLING
        FEASIBLE: the whole group is indexed once by repeated addition of a
        generator, after which every decomposition count is an exact convolution —
        no sampling error at all in the box measurement. COMPARISON DISTRIBUTION:
        the empirical dispersion index and unreachable-target count for 60 seeded
        negation-closed random bases per cell, compared by a two-sample test, with
        the frozen anchors 2.8875 against 2.9163 and 3704 against 3712.3. TAIL
        CHECK: the maximum decomposition count and the count of targets with
        c_m = 0, which respond to clustering far more sharply than the variance.
        SAMPLED PARAMETERS RECORDED: p, a, b, n, H, normalisation, seed, draw
        count. TRANSFER ASSUMPTION, STATED: HEUR-1 is validated only at p <= 2^26
        and H <= 32, and its use at cryptographic p with H = p^{1/(2m)} is an
        EXTRAPOLATION over more than 200 bits, labelled as one wherever it appears.
      supporting_results:
        - ref: KN-FIND-007
          role: >-
            Exact first-moment conservation identity, which is the rigorous half
            of this heuristic and simultaneously the reason the MEAN is
            uninformative about the base.
          provenance: internal
          verified_by: >-
            NOT READ by the originating ideation session (quoted at second hand
            from the verbatim restatement in IDEA-20260806-c5d183) and NOT read by
            this design task either. Recorded as an OUTSTANDING blocking read
            under blocking_first_stage_reads; it does not discharge this heuristic
            until an agent that read it says so in a new record.
          discharges_heuristic: false
        - ref: >-
            Weyl/Kloosterman-type square-root cancellation for Farey-type sets of
            bounded height modulo p
          role: >-
            The classical distribution statement the second-moment half imitates.
          provenance: recalled
          verified_by: null
          discharges_heuristic: false
      validation_experiment_ids:
        - EXP-ECDLP-1bef8f
      validation_status: >-
        SCHEDULED, NOT PERFORMED. The validation route lives in Stages 2 and 3 of
        EXP-ECDLP-1bef8f, which DEC-20260913-0f8468 does not authorize. Stage 0
        recomputes the single frozen dispersion cell as a FIXTURE; that is not a
        validation of HEUR-1 and no strength may be read from it.
      falsification_condition: >-
        A dispersion index or unreachable-target count outside the matched null's
        range at the 1 per cent level, with the separation GROWING along the
        p-ladder. That is additive structure in the height box, it matters for
        coverage, and it would be reported as a finding independent of gamma. A
        separation flat in p is an artifact under docs/inventor-protocol.md
        section 3, not a refutation of HEUR-1.
    - id: HEUR-2
      proposal_id: H2-IDEA-20260913-c5f90d
      carried_verbatim_from: IDEA-20260913-c5f90d
      formal_statement: >-
        There is no declared small-root method achieving gamma_m >= 1 for the
        homogenised arity-m box relation equation; formally, for the 9-monomial
        degree-4 support of the arity-2 form F(alpha_1, beta_1, alpha_2, beta_2)
        the achievable exponent satisfies gamma_2 < 1 strictly, and gamma_m is
        non-increasing in m because the per-variable degree of the homogenised
        f_{m+1} grows like 2^{m-2}.
      rigorous_support: >-
        The rigorous ingredient is the requirement side, which is exact algebra:
        the density condition forces the product of the 2m unknown bounds to equal
        n/c_H^m = p^{1+o(1)} for every m, and p is the uniqueness threshold for a
        single modular equation (below it a random equation has no box root, so a
        method that worked above it would be returning roots that need not exist).
        The heuristic half is that the achievable exponent for a given support is
        what the declared shift-polynomial strategy delivers — the univariate
        anchor 1/d = 1/4 is rigorous (recalled), the multivariate extension is
        heuristic, and the record asks for the number rather than assuming it. It
        imitates the classical pattern that lattice small-root bounds degrade with
        the number of unknowns, the analogue of the Minkowski/LLL gap growing with
        dimension.
      random_model_justification: >-
        Comparison law: a RANDOM 9-monomial degree-4 form modulo p with the same
        support and random coefficients. The Semaev form must not do better than
        its random-support twin; if it does, the advantage is a property of the
        elliptic structure and is a finding in its own right, and if it does not,
        gamma_2 is a support-level quantity and transfers to every curve.
      validation_plan: >-
        SAMPLE: the support itself — the computation is symbolic and exact, so the
        primary validation is a recomputation of the shift-polynomial set, the
        lattice dimension and its determinant, and the derived bound, for both the
        Semaev support and 100 seeded random-coefficient twins. SHORTCUT MAKING
        SAMPLING FEASIBLE: none needed for gamma_2; for the empirical half,
        PLANTED instances from the frozen cell (targets with a known box
        decomposition, available because the mean count is 1.93) let the lattice be
        tested at exactly the threshold without searching for instances.
        COMPARISON DISTRIBUTION: the achieved root bound against the predicted
        gamma, and against the rigorous univariate anchor p^{1/4} on the positive
        control. TAIL CHECK: the fraction of successful reductions that return
        algebraically DEPENDENT polynomials, which is the standard failure mode of
        multivariate small-root methods and must be reported rather than discarded.
        TRANSFER ASSUMPTION: gamma computed for arity 2 and 3 says nothing about
        arity 5 except through the stated monotonicity, which is itself part of the
        heuristic and is separately falsifiable.
      supporting_results:
        - ref: >-
            Coppersmith, "Finding a small root of a univariate modular equation";
            Jochemsz and May, "A strategy for finding roots of multivariate
            polynomials with new applications in attacking RSA variants"
          role: >-
            The external machinery whose achievable bound for the 9-monomial
            support Stage 1 would COMPUTE, and the source of the rigorous
            univariate anchor 1/d.
          provenance: recalled
          verified_by: null
          discharges_heuristic: false
          note: >-
            A remembered source is a pointer for a reviewer and never support
            (AGENTS.md rule 9). gamma_2 is unknown to this program until Stage 1
            is authorized, executed, and reviewed.
      validation_experiment_ids:
        - EXP-ECDLP-1bef8f
      validation_status: >-
        SCHEDULED, NOT PERFORMED, AND UNAUTHORIZED. Stage 1 of EXP-ECDLP-1bef8f is
        the validation route and DEC-20260913-0f8468 does not authorize it. Until a
        later Coordinator decision authorizes Stage 1, HEUR-2 is an undischarged
        heuristic and caps this hypothesis below `supported` on its own.
      falsification_condition: >-
        A declared, reproducible construction with gamma_2 >= 1 whose univariate
        positive control passes and whose recovered integers verify as a genuine
        curve relation. HEUR-2 is then false, and the conditional exponent of the
        statement's part (B) becomes the program's most important open lead —
        routed to mandatory independent review-breakthrough at max effort before
        any interpretation.
    - id: HEUR-3
      proposal_id: H3-IDEA-20260913-c5f90d
      carried_verbatim_from: IDEA-20260913-c5f90d
      formal_statement: >-
        The box constant c_H = |F_H|/H^2 converges to a limit of order 1 as H grows
        with H = o(p^{1/2}), so that B = c_H*H^2 with c_H bounded away from 0 and
        infinity, and the exponent bookkeeping of the statement's part (A) is
        unaffected by the constant.
      rigorous_support: >-
        Rigorous half: |F_H| <= (2H+1)*H trivially, and |F_H| >= (a positive
        constant)*H^2 for H = o(p^{1/2}) because distinct coprime pairs with
        |alpha| <= H, 1 <= beta <= H give distinct residues once H^2 < p/2. The
        heuristic half is only the existence of a limit and its value. It imitates
        the classical Farey-fraction count 6/pi^2 * (2H)*H for coprime pairs in a
        box, the standard density theorem for the same object over Z.
      random_model_justification: >-
        Comparison law: the Farey count with coprimality density 6/pi^2, giving
        c_H -> 12/pi^2 = 1.216 in the asymmetric normalisation used here. The
        frozen exact counts are c_H = 1.438, 1.560, 1.306, 1.370, 1.270 at
        H = 4, 5, 6, 9, 10, which bracket that value and are consistent with slow
        convergence from above.
      validation_plan: >-
        SAMPLE: exact counts of |F_H| for all H up to 200 at three field sizes, a
        linear-time computation per H. COMPARISON DISTRIBUTION: the Farey
        prediction 12/pi^2 * H^2. TAIL CHECK: the largest H at which |F_H| still
        grows quadratically before saturating toward p, which locates the boundary
        of the H = o(p^{1/2}) regime empirically. TRANSFER ASSUMPTION: c_H enters
        the exponent bookkeeping only through c_H^m, which is p^{o(1)} for fixed m
        and is NOT p^{o(1)} if m grows with p — a point the arity-5 crossover
        discussion must respect and which is recorded as disclosed overhead.
      supporting_results:
        - ref: >-
            Farey-fraction / visible-lattice-point count with coprimality density
            6/pi^2 for pairs in a box
          role: >-
            The classical density theorem the limit claim imitates and the source
            of the comparison value 12/pi^2 = 1.216.
          provenance: recalled
          verified_by: null
          discharges_heuristic: false
      validation_experiment_ids:
        - EXP-ECDLP-1bef8f
      validation_status: >-
        PARTIALLY EXERCISED AT STAGE 0 AS A FIXTURE ONLY. Stage 0 anchor (b)
        recomputes |F_H| at exactly five values of H at one field size. That is a
        fixture reproduction, not the H <= 200 three-field-size ladder the
        validation plan calls for, and no convergence claim may be read from it.
      falsification_condition: >-
        |F_H|/H^2 drifting outside [0.5, 3] for H up to 200 at any field size, or
        failing to stabilise, which would make the density bookkeeping of the
        statement's part (A) H-dependent in a way the exponent statement does not
        capture.

  structural_ingredients:
    - description: >-
        Lattice small-root machinery over Z: Coppersmith's method for a univariate
        modular equation (rigorous, root below p^{1/d} at degree d) and the
        Jochemsz-May strategy for deriving an achievable bound from a monomial
        support (heuristic beyond one unknown). This is the ingredient that would
        make the relation search cheap, and computing what it gives for the exact
        9-monomial support IS Stage 1's deliverable.
      citation: >-
        Coppersmith, "Finding a small root of a univariate modular equation";
        Jochemsz and May, "A strategy for finding roots of multivariate polynomials
        with new applications in attacking RSA variants"
      provenance: recalled
      verified_by: null
      role: achievable small-root bound from a monomial support
      is_support: false
      is_support_note: >-
        Explicitly NOT support for any number in this record. No agent in this
        program has opened either source; the reference is a pointer telling a
        reviewer where to look (AGENTS.md rule 9).
    - description: >-
        Semaev's third summation polynomial as the relation condition. The form
        used here, f_3 = (e_2 - a)^2 - 4*e_1*(e_3 + b) with e_i the elementary
        symmetric functions of the three x-coordinates, was DERIVED FROM SCRATCH
        during ideation rather than taken from the paper, and Stage 0 anchor (a) is
        precisely the independent verification of it at (p, a, b) = (101, 3, 5).
      citation: >-
        Semaev, "Summation polynomials and the discrete logarithm problem on
        elliptic curves"
      provenance: recalled
      verified_by: null
      role: relation condition for an arity-m decomposition
      is_support: false
      is_support_note: >-
        A pointer to the origin of the idea, not support for the formula. The
        formula's support is Stage 0 anchor (a), which is authorized and which an
        independent recomputation must reproduce with zero false negatives and zero
        false positives.
    - description: >-
        Minkowski's theorem applied to the rank-2 lattice
        {(alpha, beta) : alpha = x*beta mod p} of determinant p, which gives
        ht(x) <= (4p/3)^{1/2} for every x in F_p and makes the height total; and
        the continued-fraction expansion of x/p, which computes it in polylog time.
      citation: >-
        Minkowski's convex-body theorem; the continued-fraction / rational
        reconstruction algorithm
      provenance: recalled
      verified_by: null
      role: totality and polylog computability of the size function
      is_support: false
      is_support_note: >-
        Standard textbook mathematics, but no agent in this program opened a source
        for it in this task, so it is marked `recalled` rather than presented as
        checked. Stage 0 does not test it.
    - description: >-
        The classical Farey / visible-lattice-point density 6/pi^2 for coprime
        pairs in a box, the comparison law behind HEUR-3's c_H -> 12/pi^2 = 1.216.
      citation: Farey-fraction counting with coprimality density 6/pi^2
      provenance: recalled
      verified_by: null
      role: comparison distribution for the box constant
      is_support: false

