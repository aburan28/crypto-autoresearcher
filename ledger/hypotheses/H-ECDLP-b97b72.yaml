  title: >-
    Height-box factor base: the rational-reconstruction height IS a size
    function on F_p, the density condition pins the product of the 2m unknown
    bounds at p^{1+o(1)} for EVERY arity, and the whole lane therefore turns on
    one uncomputed number gamma_m against the requirement gamma_req = 1 —
    predicted gamma_m < 1 strictly and non-increasing in m
  status: specified
