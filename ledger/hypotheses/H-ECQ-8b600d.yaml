hypothesis:
  id: H-ECQ-8b600d
  question_id: RQ-ECQ-80f23c
  supersedes: H-ECQ-a609f8
  supersedes_reason: >-
    H-ECQ-a609f8 selected a base family by GENERIC RANK (Nagao, exactly 12 over Q(t)) and was
    rejected_scoped by DEC-20260823-839fc6: its measured envelope is 109.505, missing all three
    pre-declared cells by +24 to +40 and taking no cell on any of four metrics. The BATCH-da59ec
    red team then supplied the reason, and it is structural rather than particular to Nagao.
  statement: >-
    THE SELECTION VARIABLE WAS WRONG, NOT MERELY THE FAMILY. The minimal-model naive height of a
    specialisation obeys a piecewise law: a FLAT small-|t| arm set by the family's own coefficient
    content, and a steep large-|t| arm of slope 12d forced by the Shioda-Tate degree
    (d >= ceil((r+2)/10), so slope >= 1.2(r+2)). The envelope minimum is therefore governed by the
    INTERCEPT, not by the parameter, and generic rank does not predict the intercept at all. In
    Mestre's construction the intercept is controlled by the integer 6-TUPLE. So: searching TUPLE
    SPACE at fixed construction beats searching PARAMETER SPACE at fixed tuple, and a broad tuple
    search will produce a lower envelope at rank >= 12 than any family this program has selected by
    generic rank.
  mechanism: >-
    Mestre's construction takes q(x) = prod (x - a_i) over a 6-tuple, sets p = q(x-T) q(x+T), writes
    p = g^2 - r, and gives y^2 = r(x,T) with twelve sections free at x = +-T + a_i. Every coefficient
    of r is a polynomial in the a_i, so the tuple IS the coefficient content, which is the intercept,
    which is the envelope. The tuple is six small integers; the space is enumerable. Two measured
    points already bracket the claim: BATCH-f2341e's validator regenerated the construction on tuple
    (-17,-16,10,11,14,17) and measured h = 79.6-107.6 at certified rank >= 11, and the frozen board
    carries #1 "Found by Mestre (1982)" at rank 12 with h = 79.329 -- both near 79, against Nagao's
    109.505 selected by the higher generic rank.
  target_cell_predeclared:
    rank_threshold: 12
    metric: naive_height
    incumbent_value_source: >-
      READ FROM coordination/goals/GOAL-ECQ-002/baseline/frontier_20260823.json AT RUN TIME, NOT
      TRANSCRIBED. CORRECTION-predeclared-target-values.md records that hand-transcribing these
      values put two of three pre-declared incumbents wrong in H-ECQ-a609f8; the same class of error
      produced three too-narrow artifact sets. DERIVE, DO NOT TRANSCRIBE.
    frozen_snapshot_sha256: 118db069fcfc0cddc61bb00a235736202f01dc72d608b3c743bd342935cadc59
  intermediate_benchmark:
    value: 79.329
    what: >-
      Board #1, the best construction-class curve at rank 12 in the frozen snapshot. THIS, NOT THE
      CELL, IS THE HONEST NEAR-TERM TARGET. Beating it means this program's tuple search outperforms
      the published construction-class best; the cell at ~69.34 additionally requires beating an
      active program that improved twice in two months.
  assumptions:
  - >-
    Mestre's construction is reproducible here: BATCH-f2341e's validator re-derived it from scratch,
    confirmed p = g^2 - r identically, deg_x r = 4, and all twelve sections on the curve identically
    in T, and exactly certified rank >= 11 at two specialisations.
  - >-
    Certified rank is a LOWER bound from exhibited points in exact arithmetic. Silverman
    specialisation motivates and never certifies.
  - >-
    Each candidate family's Shioda-Tate ceiling is computed FROM ITS OWN FIBRE CONFIGURATION, never
    from the generic K3 bound. Validator F1 showed the generic bound overstated Nagao's ceiling by 3
    (15, not 18/17) because an I_4 fibre at infinity was never computed.
  falsification:
  - >-
    FALSIFIED if a broad tuple search produces no envelope below 109.505 at rank >= 12 -- i.e. if
    tuple choice does not move the envelope and the selection variable is no better than generic rank.
  - >-
    FALSIFIED AS A LEVER if the envelope-vs-tuple relationship is flat: if every tuple of comparable
    size gives the same envelope, then the intercept is a property of the construction and not of the
    tuple, and no tuple search helps.
  - >-
    NOT falsified by failing to reach 69.339. That is an active competitive record. Failing to beat
    79.329 is the informative negative; failing to beat 69.339 while beating 79.329 is a success of
    the method and a shortfall against the board, and must be reported as both.
  required_null:
  - >-
    THE MISSING NULL, owed since BATCH-f2341e and still not run: a LOW-generic-rank family of the
    same shape, measured through the identical pipeline. The whole rank-versus-size premise assumes
    a tradeoff that has never had its control. If low-rank families show the same envelopes, rank is
    not buying anything and the premise collapses.
  status: proposed
  created: '2026-08-23'
  owner: coordinator
