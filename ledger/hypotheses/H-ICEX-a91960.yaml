hypothesis:
  id: H-ICEX-a91960
  question_id: RQ-MTGT-2cabee
  source_idea_id: IDEA-20260815-38a1cc
  title: >-
    PREPROCESSING MOVES THE PER-TARGET EXPONENT ONLY BECAUSE THE OFFLINE
    PHASE IS FREE- once the offline build is charged at any floor C_off >= N
    group operations, the break-even target count against the CORRECT
    multi-target baseline sqrt(T*N) is unattainable for every storage budget
    S <= N and every T <= N, so the decision-relevant number is not the
    break-even but the offline-cost floor, and the whole published gain sits
    on the one term the model declares unbounded
  statement: >-
    (A) THE MODEL, AS THE CORPUS CARRIES IT. KN-LIT-013 (Corrigan-Gibbs and
    Kogan, filed) records that any GENERIC discrete-log algorithm with an
    S-bit advice string about a fixed group of prime order N, running in
    online time T with success probability epsilon, satisfies
    S*T^2 = Omega~(epsilon*N), and that the bound is essentially tight- a
    matching generic construction achieves S*T^2 ~ N. The corpus entry
    records that the OFFLINE PHASE IS UNBOUNDED in that model. That is the
    load-bearing fact of this hypothesis.
    (B) THE ACCOUNTING THIS RECORD ADDS. For T targets on ONE curve, charged
    preprocessing costs C_off + T * T_online with T_online = sqrt(N/S) from
    the tight tradeoff, at storage S stored group elements. The comparator is
    NOT T * 0.886*sqrt(N) - solving T logs in one group does not cost T times
    one log - but multi-target collision search at sqrt(T*N) charged group
    operations, the same comparator H-ICEX-b2c8cf fixes for the
    index-calculus lane.
    (C) THE CLAIM, NEGATIVE AND EXACT INSIDE THE MODEL. Suppose the offline
    build is charged at a floor C_off >= N group operations. Even at the most
    favourable storage budget S = N, where T_online = 1, break-even requires
    C_off + T < sqrt(T*N), hence N < sqrt(T*N), hence T > N - impossible,
    since T <= N. THEREFORE- with the offline phase charged at that floor,
    the break-even target count is UNATTAINABLE for every S <= N and every
    T <= N, exactly as the multi-target crossover is unattainable in
    H-ICEX-b2c8cf. The published per-target exponent gain survives charging
    only if C_off is genuinely sublinear in N.
    (D) THE FALSIFIABLE CORE, WHICH IS AN OFFLINE-COST QUESTION AND NOTHING
    ELSE. Everything above reduces to HEUR-PREP-1- that a construction
    achieving S*T^2 ~ N requires Omega(N) offline group operations. A filed
    construction achieving S*T^2 ~ N with offline cost o(N) FALSIFIES this
    hypothesis outright and is a far more valuable object than anything this
    record proposes. THE RECORD IS DESIGNED TO BE DECISIVE IN EXACTLY ONE
    DIRECTION AND SAYS SO.
    (E) THE SWEEP THAT MAKES IT USABLE RATHER THAN RHETORICAL. C_off is
    swept over {S, sqrt(N*S), N, N*log2(N)} and the break-even T*(S, C_off)
    is reported PER LEVEL, never at a single assumed value, since the answer
    scales directly with the term the model leaves unbounded.
    (F) UNCONDITIONALLY- nothing. This is a costing statement inside a
    declared model, against a comparator measured elsewhere, on a
    GENERIC group. It says nothing specific to elliptic curves, and the
    curve-free null exists to make that impossible to forget.
  mechanism: >-
    WHY THE OFFLINE TERM IS THE WHOLE ARGUMENT. A per-target exponent below
    1/2 is obtained by moving work into a phase whose cost is not counted.
    The generic preprocessing model does exactly that by construction- it
    bounds S and T and leaves the offline phase unbounded, which is the right
    modelling choice for a LOWER bound on the online phase and the wrong one
    for a deployment threat assessment. Amortising an uncounted cost over T
    targets is not amortisation; it is the omission repeated T times.
    WHY THE COMPARATOR CHOICE DECIDES THE ANSWER, AGAIN. Against
    T * 0.886*sqrt(N) an offline cost of N amortises away as soon as
    T > 1.13*sqrt(N), which at 256 bits is 2^128 targets and already
    implausible; against the correct sqrt(T*N) it never amortises at all. The
    two readings differ by whether the baseline is allowed the same
    multi-target sharing the attack is allowed. This record insists it is-
    the same discipline H-ICEX-b2c8cf applies to index calculus.
    WHY TABLE ACCESS IS NOT FREE EITHER, AND WHY THAT ONLY STRENGTHENS THE
    NEGATIVE. The simple amortisation treats the online term as independent
    of table size; memory-access cost per online query grows with S, so the
    true online term is at least as large as modelled. Every unmodelled
    effect here pushes in the direction of the negative conclusion, which is
    the safe direction for a screening result and the weak direction for any
    positive one.
  assumptions:
    - >-
      COST UNIT- one charged operation is one GROUP OPERATION in a cyclic
      group of prime order N. STORAGE UNIT- stored group elements. TIME IS
      NEVER ADDED TO STORAGE- where a joint figure is wanted it is the
      PRODUCT S*T^2, carried with both unit tags, or a rate-converted figure
      at a frozen declared exchange rate alpha group-operations per
      stored-element, reported at alpha in {0.1, 1, 10}.
    - >-
      The tight tradeoff T_online = sqrt(N/S) at success probability
      epsilon = 1 is taken from KN-LIT-013 as the corpus records it. The
      corpus entry itself states the full paper was NOT read and that the
      bound and its tightness are relayed from the abstract- so this input is
      inherited at 'reported' confidence and the contract's Stage 0 must file
      a primary read before any headline number is quoted.
    - >-
      Preprocessing amortises across targets ON THE SAME CURVE only. The
      relevant target count is PER CURVE, not per system, which is the
      easiest quantity in this analysis to overstate.
    - >-
      The comparator is multi-target collision search at sqrt(T*N) with its
      distinguished-point table charged, matching H-ICEX-b2c8cf. A comparison
      against T * single-target rho is NOT admissible under this hypothesis.
    - >-
      HEUR-PREP-1 below is the single point of failure and is stated as a
      heuristic, not a theorem- no offline-cost lower bound was read.
  proof_search_map:
    bottleneck: >-
      The OFFLINE BUILD COST C_off. The exact step whose removal changes the
      conclusion is 'produce the S-element advice string for this specific
      group'; every other term is fixed by the filed tradeoff.
    baseline_embedding:
      parameter_slice: >-
        C_off = 0 and storage free must reproduce the published per-target
        online exponent exactly- T_online = sqrt(N/S), i.e. S*T^2 = N. That
        slice is the published result and the harness must return it
        unchanged.
      reproduction_check: >-
        Symbolic- setting C_off = 0 and the storage charge to 0 collapses the
        amortised total to T * sqrt(N/S) and the frontier identity
        S*T_online^2 = N must hold to 1e-12 at every grid point. A residual
        above 1e-12 is an algebra error and halts.
    observation_collision:
      observable: >-
        The reported per-target online exponent alone.
      distinct_preimage_search: >-
        COLLISION EXHIBITED. The same per-target online exponent 1/2 - x is
        produced by (i) the published free-offline construction at storage
        S = N^{2x}; (ii) the same construction with C_off charged, whose
        AMORTISED per-target cost is entirely different; and (iii) a plain
        table lookup at S = N with zero online work. A single per-target
        exponent therefore does not identify the attack, and the identifying
        triple is (online time, storage, offline cost). Every preprocessing
        row in this lane must carry all three- the same identifiability
        requirement H-ICEX-6f3e4b imposes on the m = 2 index-calculus rows.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The break-even function T*(S, C_off) as an explicit two-parameter
          family, with C_off swept rather than assumed and the comparator
          fixed at sqrt(T*N).
        predicted_gain: >-
          Converts 'preprocessing beats rho per target' into a checkable
          inequality with the omitted term visible. NO ATTACK EXPONENT IS
          MOVED IN EITHER DIRECTION.
    quantifier_order: >-
      CLAIMED. FOR ALL S <= N, FOR ALL T <= N, IF C_off >= N THEN
      C_off + T*sqrt(N/S) > sqrt(T*N), i.e. no break-even exists. CLAIMED as
      a HEURISTIC, not proved- FOR ALL constructions achieving S*T^2 ~ N,
      C_off = Omega(N). NOT CLAIMED- any lower bound on offline cost, any
      statement about non-generic preprocessing, anything about
      multi-instance amortisation of one table across many curves, and
      anything specific to elliptic curves.
    method_ceiling:
      strongest_certifiable_claim: >-
        'Under the filed tradeoff, the declared comparator and an offline
        charge of C_off, the break-even target count on ONE curve is
        T*(S, C_off), and it is unattainable whenever C_off >= N.' It can
        NEVER certify that C_off >= N, that the filed tradeoff is correct
        (the corpus entry is 'reported' and the paper was not read), or
        anything about a deployment that amortises one table across many
        curves.
      nearby_object_control: >-
        THE FREE-OFFLINE OBJECT, which is the published model itself- there
        the break-even MUST exist and must reproduce the published exponent.
        A method returning 'no break-even' on that object too has not
        identified the load-bearing term and is measuring nothing. This
        control is blocking.
    proof_obligations:
      - claim: >-
          The free-offline, free-storage slice reproduces S*T_online^2 = N.
        responsibility: baseline
      - claim: >-
          At C_off >= N no (S, T) with S <= N, T <= N satisfies
          C_off + T*sqrt(N/S) < sqrt(T*N).
        responsibility: strictness
      - claim: >-
          The single-target slice T = 1 loses to plain rho once C_off > 0.
        responsibility: feasibility
      - claim: >-
          Break-even counts are reported per curve and never per system, and
          the identifying triple accompanies every row.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-PREP-1
      formal_statement: >-
        Any generic preprocessing construction achieving S*T^2 = O~(N) on a
        group of prime order N requires C_off = Omega(N) offline group
        operations to produce its advice string.
      random_model_justification: >-
        THE RIGOROUS FRAGMENT IS WEAK AND IS STATED AS SUCH- writing S
        distinct group elements requires at least S group operations, which
        gives only C_off >= S and is far below N for the interesting budgets.
        The Omega(N) form is an IMITATION of the intuition that advice which
        helps on a uniformly random target must depend on the whole group,
        and it is NOT a theorem, NOT read from any source, and NOT supported
        by any filed record. It is the single point of failure of this
        hypothesis and is placed here rather than buried in an assumption.
      supporting_results:
        - ref: KN-LIT-013
          provenance: internal
          claim: >-
            The generic preprocessing tradeoff S*T^2 = Omega~(epsilon*N),
            its tightness via a matching construction, and - decisively for
            this hypothesis - that the offline phase in that model is
            UNBOUNDED. The corpus entry records that the full paper was not
            read and that the bound is relayed from the abstract.
          verified_by: >-
            coordinator, TASK-20260904-e87737 (corpus entry read in full,
            49 lines; the PRIMARY SOURCE was not opened by this agent and the
            entry's own 'Not verified here' section is carried forward
            unchanged)
        - ref: KN-TECH-005
          provenance: internal
          claim: >-
            The program's own technique abstract recording the generic
            Omega(sqrt(p)) bound and the S*T^2 = Omega~(n) preprocessing
            frontier.
          verified_by: null
      validation_experiment_ids:
        - EXP-ICEX-bc9a4c
      falsification_condition: >-
        A filed construction achieving S*T^2 = O~(N) with offline cost o(N)
        group operations. That single object falsifies this hypothesis, and
        it is worth more than the hypothesis is. A weaker but still decisive
        falsifier- a filed offline-cost figure for the tight construction
        that is sublinear in N.
  structural_ingredients:
    - description: >-
        The generic preprocessing tradeoff and its tightness, and the fact
        that the offline phase is unbounded in the model.
      citation: KN-LIT-013
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-e87737 (corpus entry read in full; primary
        source not opened)
      role: the tradeoff being charged, and the source of the free-offline
        modelling choice this record targets
    - description: >-
        The generic-group baseline and the standing statement of the
        preprocessing frontier in this program's own technique corpus.
      citation: KN-TECH-005
      provenance: internal
      verified_by: null
      role: the baseline bar the charged comparison is drawn against
    - description: >-
        The correct multi-target comparator sqrt(T*N) with its
        distinguished-point table charged, fixed by the sibling hypothesis in
        this batch so that both lanes use one comparator.
      citation: H-ICEX-b2c8cf
      provenance: internal
      verified_by: coordinator, TASK-20260904-e87737
      role: comparator, shared across the batch to prevent a baseline
        mismatch between two records that will be read together
  reduction_chain:
    core_problem: >-
      Locating the break-even target count at which charged preprocessing
      beats multi-target collision search on one curve, inside a declared
      cost model with the offline phase charged.
    corollaries: []
  predictions:
    - metric: >-
        P1- single-target null, T = 1- amortised charged preprocessing total
        against plain rho, both in charged GROUP OPERATIONS
      direction: higher
      minimum_effect: >-
        FORCED- preprocessing loses at T = 1 for every C_off > 0, since the
        offline phase cannot amortise over one target. A win at T = 1 means
        the offline cost is not being charged and VOIDS the run.
    - metric: >-
        P2- free-resources null, C_off = 0 and storage free- the reproduced
        online tradeoff
      direction: different
      minimum_effect: >-
        FORCED EXACT- S * T_online^2 = N to within 1e-12 at every grid point,
        reproducing the published per-target exponent. Failure means the cost
        model is mis-instantiated and halts the record.
    - metric: >-
        P3- break-even target count T*(S, C_off), a dimensionless COUNT OF
        TARGETS, per storage budget S in stored group elements and per
        offline charge C_off in group operations
      direction: different
      minimum_effect: >-
        PRE-REGISTERED- for every C_off >= N and every S <= N, NO break-even
        exists at any T <= N. A single (S, C_off >= N, T <= N) cell in which
        the charged preprocessing total falls below sqrt(T*N) FALSIFIES
        statement (C) and is an arithmetic error in the derivation.
    - metric: >-
        P4- the smallest C_off at which a break-even exists at T = N^{1/2},
        in group operations
      direction: different
      minimum_effect: >-
        PRE-REGISTERED at C_off = Theta(N^{3/4}) up to the storage term-
        reported exactly by the sweep. This is the number the lane actually
        needs, because it says how sublinear an offline phase would have to
        be for preprocessing to matter, and it is computed rather than
        asserted.
    - metric: >-
        P5- curve-free null- the identical break-even computed on the generic
        cyclic group (Z/NZ, +) at matched N
      direction: different
      minimum_effect: >-
        FORCED IDENTICAL, to the last digit. The whole computation reads no
        curve. A DIFFERENCE would mean an undeclared curve-dependent term
        entered the model and is a defect, not a finding.
  test_boundary:
    instances:
      - >-
        No curve is used and no group element is computed- the object is a
        cost model evaluated over a parameter grid.
      - >-
        CURVE-FREE CONTROL- the identical model instantiated on (Z/NZ, +),
        which must return identical numbers.
    parameters:
      N: 'log2 N in {32, 64, 128, 256} - symbolic, no instance is constructed'
      S: 'stored group elements, log2 S swept from 0 to log2 N'
      C_off: 'swept over S, sqrt(N*S), N, N*log2(N), reported per level'
      T: 'swept from 1 to N, log-spaced'
      alpha: '0.1, 1, 10 group-operations per stored element, for the rate-converted rows only'
    implementation: >-
      A derivation-aid script performing exact arithmetic and an explicit
      symbolic check of the frontier identity; no curve arithmetic, no group
      elements, no sampling.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 0.25
      maximum_memory_gb: 8
      maximum_runs: 4
  falsification_conditions:
    - >-
      F1. P1 misbehaves (preprocessing wins at T = 1). The offline cost is
      not being charged; instrumentation defect; VOID, not a finding.
    - >-
      F2. P2 misbehaves (the free-resources null does not reproduce
      S*T_online^2 = N). The model is mis-instantiated; HALT.
    - >-
      F3. A break-even exists at some (S <= N, T <= N, C_off >= N). Statement
      (C) is arithmetically wrong and the hypothesis is superseded.
    - >-
      F4. HEUR-PREP-1 is falsified by a filed construction achieving
      S*T^2 = O~(N) at offline cost o(N). The entire negative collapses, the
      per-target exponent gain survives charging, and preprocessing becomes a
      deployment-relevant threat whose break-even must then be recomputed.
      THIS IS THE OUTCOME WITH THE HIGHEST VALUE AND THE HYPOTHESIS IS
      DESIGNED TO EXPOSE IT.
    - >-
      F5. The curve-free null returns different numbers from the curve-free
      model it is supposed to duplicate. An undeclared curve-dependent term
      exists; halt and reconcile.
    - >-
      F6. Everything holds. Then the lane records that the published
      per-target exponent gain rests entirely on an unbounded offline phase,
      that the break-even is unattainable once that phase is charged at
      Omega(N), and that the only measurement worth funding in this lane is
      the offline cost of the tight construction.
  interpretation_limits:
    - >-
      A COSTING STATEMENT INSIDE A DECLARED MODEL. No attack, no exponent
      moved, no lower bound, and no measurement of any kind.
    - >-
      THE TRADEOFF IS INHERITED AT 'REPORTED' CONFIDENCE. KN-LIT-013's corpus
      entry states the full paper was not read. Every number here is
      therefore conditional on an unopened primary source, and Stage 0 of the
      contract requires that read before any headline figure is quoted.
    - >-
      HEUR-PREP-1 IS NOT A THEOREM and no offline-cost lower bound was read.
      The negative conclusion is exactly as strong as that heuristic and no
      stronger; it is stated as a heuristic with a constructive falsification
      route rather than as a bound.
    - >-
      BREAK-EVEN COUNTS ARE PER CURVE, NEVER PER SYSTEM. A deployment
      amortising one table across many curves is a DIFFERENT row that this
      hypothesis does not compute and that must not be quoted as computed.
    - >-
      THE CURVE-FREE NULL IS EXPECTED TO BE IDENTICAL. The generic
      preprocessing model reads no curve, so nothing here is a statement
      about elliptic curves. Recorded before the run so a confirmation cannot
      be upgraded into one afterwards.
    - >-
      NOT TESTABLE AT REACHABLE SCALE, AND NOT TESTABLE AT ALL IN THE
      MEASUREMENT SENSE. No table of 2^85 elements can be built, so the
      cryptographic-scale statement is arithmetic in a model and never a
      measurement. Evidence from this contract is capped at claim_tier toy
      per RQ-MTGT-2cabee's constraint, notwithstanding that its parameters
      are symbolic.
