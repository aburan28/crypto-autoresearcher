hypothesis:
  id: H-MLKEM-fef5ae
  question_id: RQ-MLKEM-003

  statement: >-
    SCOPE: exhaustive lattice-point census inside the saturation ball
    B(0, sqrt(4/3)*gh(L)) for rank d in {12, 16, 20, 24, 28, 32}, on four arms
    at matched determinant q^(d/2) with q = 3329 -- (N) unstructured random
    integer lattices, (Q) plain q-ary lattices from a uniform random A,
    (M) ML-KEM-shaped negacyclic module q-ary lattices over Z[X]/(X^n+1) with
    n in {2, 4, 8}, and (P) a graded planted-anisotropy control -- exact integer
    arithmetic, one instrument lineage, pure Python plus numpy, no sieve.
    CLAIM TIER toy. NO ATTACK, NO TIME EXPONENT, NO FIPS 203 STATEMENT.

    THE CLAIM, IN THREE PARTS, ONLY THE SECOND OF WHICH IS UNCERTAIN.
    (1) FORCED AND EXACT: the expected population is
    E|S(L)| = (4/3)^(d/2) = 2^(0.20751874963942182 * d), which is not a
    heuristic but an instance of Siegel's mean value theorem for the Haar
    measure on unimodular lattices, and which equals 5.6187 / 9.9887 / 17.7577 /
    31.5693 / 56.1232 / 99.7746 at d = 12 / 16 / 20 / 24 / 28 / 32. Arm N
    realises it to within the Rogers-variance band; a miss convicts the
    instrument and blocks every other reading.
    (2) UNCERTAIN AND MEASURED: whether arm M's ratio rho_d = |S| / (4/3)^(d/2)
    differs from arm N's by 0.15 or more at two consecutive d with the same
    sign. NO VALUE IS PREDICTED FOR THIS AND NONE IS INVENTED; below threshold
    at every d is a CONTROLLED NULL and is the hypothesis's declared alternative
    deliverable, not a failure.
    (3) FORCED AND EXACT: |S| in arm M is divisible by 2n for every instance,
    because v -> X*v is an isometry of the coefficient embedding, so a sieve on
    the UNPROJECTED module lattice can store orbit representatives and save
    exactly log2(2n) bits of memory -- 9.000000 bits at ML-KEM's n = 256, which
    against this campaign's own log2 M = 88.4941 / 131.6573 / 180.9250 raises
    EV-MLKEM-020's c* from 0.03164649 / 0.04588645 / 0.00705473 to
    0.035229 / 0.049253 / 0.007424 (+11.3% / +7.3% / +5.2%), AND DOES NOT
    APPROACH c* = 1/3, which would require a memory exponent of
    0.019702 / 0.028567 / 0.004392.

    WHAT THE HYPOTHESIS IS FOR: GOAL-MLKEM-003 closed at budget with completion
    criterion 1 unmet, and the unmet half is named in the goal record itself --
    "calibrated by measured sieve behaviour at reduced dimensions", of which
    "no measurement of sieve behaviour exists anywhere in this campaign". This
    hypothesis supplies the cheapest measurement that discharges that half:
    it converts log2 M = 0.2075 * n from a literal borrowed out of a code path
    the attack never invokes into a measured quantity with a stated interval and
    a numbered extrapolation.

  mechanism: >-
    DERIVED IN THIS RECORD. Recalled items are labelled and each becomes a
    checked stage rather than an assumption.

    A. THE FORCED VALUE.
    For a rank-d lattice L, gh(L) is defined by vol(B_d(gh(L))) = det(L), so
      gh(L) = det(L)^(1/d) * Gamma(d/2 + 1)^(1/d) / sqrt(pi),
    giving gh/det^(1/d) = 1.09464 / 1.20064 / 1.29750 / 1.38725 / 1.47128 at
    d = 16 / 20 / 24 / 28 / 32 (computed here). With R = sqrt(4/3) * gh(L),
      vol(B_d(R)) / det(L) = (R/gh)^d = (4/3)^(d/2),
    and log2 sqrt(4/3) = 0.20751874963942182 -- the same constant EV-MLKEM-020
    records agreeing with the estimator's 0.2075 literal at
    |delta| = 1.874964e-05. So the predicted population is exactly the memory
    exponent the campaign has been charging, evaluated at d.

    B. WHY ARM N'S PREDICTION IS A THEOREM AND NOT A HEURISTIC -- WHICH IS WHAT
    MAKES THE NULL ABLE TO FAIL. Siegel's mean value theorem: for L Haar-random
    unimodular of rank d and f integrable, E[sum_{v in L\0} f(v)] = integral f.
    With f the indicator of B_d(R) this gives E|S| = vol(B_d(R)) EXACTLY, with
    no o(1) and no genericity clause. Rogers' second moment theorem gives
    Var|S| approximately E|S| for large d, so the per-instance relative spread is
    1/sqrt(E|S|) = 42.2% / 31.6% / 23.7% / 17.8% / 13.3% / 10.0% at
    d = 12 / 16 / 20 / 24 / 28 / 32, and over 20 instances the standard error of
    the mean is 9.4% / 7.1% / 5.3% / 4.0% / 3.0% / 2.2%.
    BOTH THEOREMS ARE RECALLED, UNVERIFIED. No source was retrieved. They are
    therefore not used as authorities: Stage 1 of EXP-MLKEM-559972 tests them
    empirically against arm N before either is used, and a miss refutes the
    forced-value structure of this hypothesis at zero extra cost. That is the
    cheapest and most informative failure available here.

    C. WHY A q-ARY LATTICE IS NOT HAAR-RANDOM, AND WHY IT DOES NOT MATTER AT
    THESE PARAMETERS. Arms Q and M contain q*Z^d, hence d vectors of norm
    exactly q. With det = q^(d/2),
      R/q = sqrt(4/3) * Gamma(d/2+1)^(1/d) / sqrt(pi*q),
    which at q = 3329 is 0.0221 / 0.0294 at d = 16 / 32: the trivial q-vectors
    lie a factor of 34 to 45 outside the ball and cannot contaminate the census.
    THIS IS A PROPERTY OF THE TOY PARAMETERS AND NOT OF THE ATTACK: at FIPS 203
    sieve dimensions the sieve runs on projected sublattices where the q-vectors
    have long since been reduced away, and this hypothesis makes no claim about
    that regime.

    D. THE MODULE ARM'S EXACT STRUCTURE. Let R_n = Z[X]/(X^n + 1) and
    L(A) = {(x,y) in R_n^k x R_n^k : y = A x mod q}, embedded coefficientwise in
    Z^d with d = 2nk and det = q^(nk) = q^(d/2). Multiplication by X on R_n acts
    on coefficient vectors by the negacyclic shift, whose matrix is a SIGNED
    PERMUTATION, hence orthogonal; it maps L(A) to L(A) because A is R_n-linear.
    Together with v -> -v this gives a group of at least 2n isometries of L(A),
    so S(L) is a disjoint union of orbits of size dividing 2n, and generically
    every orbit has size exactly 2n. Consequences:
      (i) |S| is divisible by 2n -- an exact integrity check costing nothing;
      (ii) a sieve on the unprojected L(A) can store |S|/(2n) representatives,
           saving exactly log2(2n) bits of memory;
      (iii) the orbit-size histogram is a component of the observable with
           GUARANTEED nonzero spread between arms M (all sizes 2n) and N
           (generically all sizes 2), which is what defuses the
           constant-projection failure mode before any run.
    LOAD-BEARING LIMITATION, repeated wherever (ii) is cited: BKZ sieves on
    PROJECTED sublattices, which do not inherit the ring action. The 9-bit
    saving is an upper bound for a sieve on the full lattice and is NOT
    established for the attack as costed.

    E. WHAT THE MEASUREMENT IS WORTH, DERIVED IN ADVANCE SO THE WRITE-UP CANNOT
    INFLATE IT. From EV-MLKEM-020's committed free-memory margins
    2.800527 / 6.041285 / 1.276377 bits and c* (Model A, Z_q)
    0.03164649 / 0.04588645 / 0.00705473, together with the identity
    c* = margin / log2 M that the same record establishes, the log2 M in use is
    88.4941 / 131.6573 / 180.9250 (division, performed here; independently
    consistent with BATCH-011's reconstructed primal peaks 2^88.49 / 2^131.66 /
    2^180.92). Dividing by 0.20751874963942182 gives peak sieve dimensions
    n_peak = 426.4 / 634.4 / 871.8. A measured exponent interval of +/- 0.002
    bits per dimension therefore propagates to +/- 0.85 / 1.27 / 1.74 bits of
    log2 M and about +/- 1.0% on c*. For c* to reach 1/3 the exponent would have
    to fall to 3*margin/n_peak = 0.019702 / 0.028567 / 0.004392, an order of
    magnitude below 0.2075, which no census in this ladder can produce.
    THE HYPOTHESIS THEREFORE DECLARES IN ADVANCE THAT IT CANNOT OVERTURN
    EV-MLKEM-020's c* < 1/3 INEQUALITY, and its value lies entirely in changing
    the epistemic status of the exponent and in supplying the 9-bit structural
    correction nobody in this campaign has charged.

    F. THE ONE PLACE NUMERICS CAN DESTROY THE RESULT, AND ITS FIX.
    |S| ~ (R/gh)^d, so d(log|S|)/d(log R) = d: a relative error eps in R gives a
    relative error d*eps in the count, i.e. 3.2% at d = 32 for eps = 1e-3 --
    comparable to the effect being hunted. The contract therefore requires gh
    computed in 50-digit decimal arithmetic, comparison of the EXACT INTEGER
    ||v||^2 against a high-precision threshold, and a separately reported
    boundary band of vectors within 1e-6 relative of R. This is not a
    refinement; it is the difference between a measurement and an artifact.

  assumptions:
    - >-
      FROZEN DEFINITIONS, fixed before any evaluation and not adjustable
      afterwards without a versioned amendment:
      (1) gh(L) = det(L)^(1/d) * Gamma(d/2+1)^(1/d) / sqrt(pi).
      (2) R = sqrt(4/3) * gh(L); S(L) = {v in L : 0 < ||v||^2 <= R^2}.
      (3) rho_d = |S(L)| / (4/3)^(d/2). Reported per instance and as an
          arm-level mean over exactly 20 instances.
      (4) The comparison is on ||v||^2 as an exact integer against R^2 evaluated
          to 50 decimal digits.
      (5) Arm N determinant is q^(d/2) with q = 3329, identical to arms Q and M.
      (6) The slope s is the ordinary least-squares slope of log2(rho_d) against
          d over the completed ladder, reported both for all d and for d >= 20.
      (7) The reported memory exponent is 0.20751874963942182 + s.
      No other degree of freedom exists.
    - >-
      Sage and fpylll are ABSENT from this container and numpy 2.4.6 is PRESENT.
      VERIFIED BY THIS SESSION on this machine (ModuleNotFoundError for both
      modules; numpy imported and version printed), which resolves the
      environment disagreement recorded in the session ANGLE-BRIEF section 5.3
      item 1 in favour of "numpy yes, solvers no". The design uses no solver.
    - >-
      Siegel's and Rogers' theorems as stated in mechanism B are RECALLED,
      UNVERIFIED. Their empirical test is Stage 1 and their literature
      verification is a declared deliverable, not a prerequisite.
    - >-
      G6K's saturation radius of 4/3 in squared norm, and the identification of
      the sieve list with S(L), are RECALLED, UNVERIFIED, NOT READ. HEUR-SB-1
      carries this and the experiment does not validate it.

  proof_search_map:
    bottleneck: >-
      The single step at which a memory figure enters this campaign's cost
      chain. EV-MLKEM-020 records that the estimator's `lwe_primal` path "never
      calls `short_vectors`, so the instrument supplies NO memory figure for
      this attack at all", and that the 0.2075 convention was borrowed from
      `lwe_dual.py:172`, a different attack's code path. Every memory-charged
      statement the campaign made -- c*, its invariance sweeps, the ordering
      flips -- passes through that one borrowed literal. Measuring it is
      upstream of all of them and consumes none of their assumptions.
    baseline_embedding:
      parameter_slice: >-
        The lattice Z^d with det = 1, where the population of any ball is the
        exact coefficient sum of the theta series theta_3(z)^d and is
        independently computable by convolution of one-dimensional counts. This
        is the parameter slice at which the enumerator's output is known in
        closed form.
      reproduction_check: >-
        EXACT INTEGER EQUALITY at every d in {4, ..., 32}, computed two
        independent ways (depth-first enumeration; convolution of the
        one-dimensional integer-point counts). Not a visual agreement and not a
        tolerance: integer to integer. This check runs FIRST and can terminate
        the whole line. A second, independent baseline: the arm-N mean against
        the Siegel value, which reproduces a theorem rather than an
        implementation.
    observation_collision:
      observable: >-
        The pair (|S(L)|, orbit-size histogram of S(L)).
      distinct_preimage_search: >-
        A COLLISION IS EXPECTED ON THE SCALAR COMPONENT AND IS DECLARED IN
        ADVANCE, which is why the observable is a pair rather than a scalar.
        Siegel's identity depends only on d and the covolume, so arms N, Q and M
        are all PREDICTED to share the value (4/3)^(d/2): three distinct
        ground-truth object classes with the same scalar observable. If the
        conclusion sought were "the module structure changes the sieve's memory
        floor", this collision would falsify identifiability outright. It is
        therefore NOT the conclusion sought. The ORBIT HISTOGRAM component is
        provably collision-free between M and N -- all orbits of size 2n versus
        generically 2 -- and it is the component carrying the structural claim
        (3). Stating which half of the observable is collision-prone, before the
        run, is the content of this audit.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable |S| fixed at its forced value and vary the
          forgotten structure (module vs plain q-ary vs unstructured). The
          intrinsic invariant proposed to distinguish the fibre members is the
          automorphism group order, read off the orbit histogram.
        predicted_gain: >-
          None to an attacker beyond log2(2n) bits of memory on the unprojected
          lattice. The gain is to the program: a derived, exactly-valued
          structural correction and a demonstration that the scalar component
          alone cannot carry a structural claim.
      - transform: representation_reduction
        proposed_object: >-
          Replace "sieve memory" -- an implementation-dependent quantity with no
          figure in the instrument -- by "population of a ball", an exact
          integer with an exactly forced expectation. The hypothesis then becomes
          an integer equality rather than a modelling comparison.
        predicted_gain: >-
          Converts an unmeasurable into a measurable. Encoding obligation: the
          identification of list size with |S| is HEUR-SB-1 and is NOT
          discharged, so the transfer is a lower bound, not an equality, and the
          record says so at every citation.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER. Part (1): FOR ALL d in the ladder, THERE EXISTS no
      arm-N instance distribution whose mean rho_d lies outside the stated band
      -- i.e. the forced value is uniform in d and the witness (the band) is
      fixed before the run and may NOT depend on the measured data.
      Part (3): FOR ALL A, FOR ALL module instances L(A), 2n divides |S(L(A))| --
      a uniform statement with no instance-dependent witness, because the
      isometry v -> X*v is the same map for every A.
      NOT CLAIMED, and the distinction is the point: the weaker order "FOR EACH
      instance THERE EXISTS a band containing its rho" is trivially satisfiable
      and is explicitly not admissible as a result.
      THE EXTRAPOLATION'S QUANTIFIER IS THE DANGEROUS ONE and is stated so it can
      be refused: HEUR-SB-3 asserts FOR ALL d up to 872 what is measured FOR d
      <= 32. The witness (the slope s) is fitted on the measured range and is
      then used outside it. That is exactly the quantifier move the section 8
      audit exists to expose, and this record exposes its own.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: a toy-tier, exact, four-arm census of saturation-ball
        populations for 12 <= d <= 32 at q = 3329, with a measured interval on
        the memory exponent over that range, an exactly derived 2n-divisibility
        law for the module arm, and an upper bound of log2(2n) bits on the
        memory a sieve on the UNPROJECTED module lattice could save. IT CANNOT
        certify a sieve's actual memory, cannot certify anything at d ~ 426-872,
        cannot move a time exponent, cannot overturn c* < 1/3 (mechanism E
        derives why not), and cannot close KN-OPEN-016 or KN-OPEN-017.
      nearby_object_control: >-
        TWO, both required arms.
        (i) THE PLANTED-ANISOTROPY ARM P, where the hoped-for conclusion
        "rho = 1" is KNOWN FALSE by construction: stretching one axis provably
        evacuates the ball and rho must fall monotonically in the stretch t. An
        instrument that returns rho = 1 there is not measuring the population.
        (ii) THE PLAIN q-ARY ARM Q, the closest object to arm M -- same
        determinant, same dimension, same q, same construction -- differing ONLY
        by the ring action. A method that cannot separate M from Q on the orbit
        histogram has not identified the load-bearing structure, and the orbit
        histogram is precisely where separation is forced.
    proof_obligations:
      - claim: >-
          vol(B_d(sqrt(4/3)*gh))/det = (4/3)^(d/2) exactly, and
          log2 sqrt(4/3) = 0.20751874963942182.
        responsibility: correctness
      - claim: >-
          Siegel's identity gives E|S| = (4/3)^(d/2) for the Haar measure, and
          Rogers gives Var approximately equal to the mean. RECALLED; to be
          verified against literature and empirically against arm N.
        responsibility: baseline
      - claim: >-
          The HNF sampler at fixed determinant equidistributes well enough for
          the Siegel value to apply (HEUR-SB-2).
        responsibility: feasibility
      - claim: >-
          The negacyclic shift is an isometry of the coefficient embedding and
          preserves L(A), hence 2n divides |S|.
        responsibility: correctness
      - claim: >-
          The enumerator is exact: no point in the ball is missed and none
          outside is counted, at the declared precision.
        responsibility: correctness
      - claim: >-
          |S| lower-bounds a saturated sieve's list; the reverse needs
          HEUR-SB-1, which is NOT discharged.
        responsibility: interface
      - claim: >-
          The orbit saving applies to the unprojected module lattice only, and
          not to a BKZ sieve on projected sublattices.
        responsibility: scope
      - claim: >-
          Nothing at d <= 32 is a statement about FIPS 203; the extrapolation is
          HEUR-SB-3 and is declared unvalidated.
        responsibility: scope
      - claim: >-
          A node-cap or wall-clock exhaustion is infrastructure signal and never
          a population result (AGENTS.md rule 5).
        responsibility: runtime
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. No complexity improvement is claimed on any axis. The
    quantity under audit is the COEFFICIENT of an existing memory exponent, and
    the honest expectation stated in advance is that it is CONFIRMED rather than
    moved (mechanism E). This makes no lattice problem easier, moves no time
    exponent, and adds no attack. sota_delta against the external state of the
    art is zero; against this campaign it is the difference between a borrowed
    literal and a measured interval.

  heuristic_assumptions:
    - id: HEUR-SB-1
      formal_statement: >-
        SATURATION IDENTIFICATION. There is a polynomial p such that for every
        admissible rank d, a sieve run to saturation on a rank-d lattice L has
        peak retained list size in [ |S(L)| / p(d), |S(L)| * p(d) ].
      random_model_justification: >-
        One direction is unconditional and needs no random model: a saturated
        list contains lattice points of the stated norms, so |S(L)| bounds it
        below up to the retention policy. The other direction is a sieve DESIGN
        assumption -- that the algorithm retains essentially all such points and
        little else -- and has no justification offered here.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        A measured sieve whose peak list departs from |S| by more than a poly(d)
        factor. NOT TESTABLE IN THIS ENVIRONMENT (fpylll absent, verified this
        session), so this heuristic is DECLARED UNVALIDATED and every downstream
        statement is a lower bound on memory rather than an estimate of it.
    - id: HEUR-SB-2
      formal_statement: >-
        SIEGEL EXACTNESS FOR THE SAMPLER ACTUALLY USED. For L drawn uniformly
        from rank-d integer lattices in Hermite normal form with determinant
        exactly q^(d/2), q = 3329, the expectation E|S(L)| equals (4/3)^(d/2)
        to within the Rogers-variance standard error over 20 instances.
      random_model_justification: >-
        Equidistribution of fixed-determinant integer lattices toward the Haar
        measure as the determinant grows. RECALLED, UNVERIFIED. q^(d/2) = 3329^16
        at d = 32 is large, which is a reason to expect the approximation to
        bite, not a proof.
      supporting_results: []
      validation_experiment_ids: [EXP-MLKEM-559972]
      falsification_condition: >-
        The arm-N mean lies outside the pre-registered 3-standard-error band at
        any d. HEUR-SB-2 (or the enumerator, or the recalled theorems) is then
        refuted, the forced-value structure of the hypothesis fails, and the
        deliverable is that refutation. Cost of being wrong: minutes.
    - id: HEUR-SB-3
      formal_statement: >-
        DIMENSIONAL TRANSFER. The measured exponent 0.20751874963942182 + s,
        with s fitted over 12 <= d <= 32, continues to hold at the campaign's
        peak sieve dimensions n_peak = 426.4 / 634.4 / 871.8, so that
        log2 M = (0.20751874963942182 + s) * n_peak.
      random_model_justification: >-
        NONE. It is a 13x to 27x extrapolation in dimension and it is the
        weakest link in this record. It is stated as a numbered heuristic so a
        reader may reject the extrapolation and keep the measurement, which
        stands on its own at d <= 32.
      supporting_results: []
      validation_experiment_ids: [EXP-MLKEM-559972]
      falsification_condition: >-
        s is nonzero and itself varies with d across the ladder -- i.e. the
        exponent is not constant over a range spanning a factor of 2.7 in
        dimension. The extrapolation is then refuted by its own data and the
        report states that the exponent is not constant over the measured range,
        rather than quoting a single number.

  structural_ingredients:
    - description: >-
        Siegel's mean value theorem for the Haar measure on unimodular lattices,
        and Rogers' second moment theorem.
      citation: >-
        NOT RETRIEVED AND NOT VERIFIED FROM THIS ENVIRONMENT. NO AUTHOR, YEAR,
        THEOREM NUMBER, PAGE OR VENUE IS ASSERTED. The statements used are given
        verbatim in mechanism B and are CANDIDATES TO TEST, never authorities.
        Their empirical test is Stage 1 of EXP-MLKEM-559972.
      role: supplies the exact forced value for the null arm
    - description: >-
        The negacyclic shift on Z[X]/(X^n+1) as a signed permutation matrix,
        hence an isometry of the coefficient embedding.
      citation: >-
        Elementary; derived in this record from the companion matrix of X^n + 1.
        No external citation asserted or needed.
      role: forces 2n-divisibility of the module arm's population and bounds the orbit memory saving
    - description: >-
        The identity c* = margin / log2 M and the committed margins and c*
        values from which log2 M = 88.4941 / 131.6573 / 180.9250 is derived.
      citation: >-
        ledger/evidence/EV-MLKEM-020.yaml (READ in this session), which states
        the identity and carries the margins 2.800527 / 6.041285 / 1.276377 and
        c* 0.03164649 / 0.04588645 / 0.00705473.
      role: converts a measured memory exponent into a c* interval

  reduction_chain:
    core_problem: >-
      Measure the population of the saturation ball for ML-KEM-shaped and matched
      control lattices at reduced rank, and report the memory exponent it implies
      with an interval.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. There is no reduction from a d <= 32 census to any
