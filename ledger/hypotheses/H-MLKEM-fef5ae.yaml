        series coefficient sum, d = 4..32
      direction: different
      minimum_effect: >-
        EXACT INTEGER EQUALITY at every d, by two independent computations. Not
        a tolerance. A single mismatch halts the package before any arm is read.
    - metric: >-
        G1 -- arm N (unstructured null) mean rho_d at each
        d in {12, 16, 20, 24, 28, 32}, 20 instances per cell
      direction: different
      minimum_effect: >-
        FORCED VALUE 1.000 from Siegel. Acceptance band 3 standard errors:
        +/- 0.283 / 0.212 / 0.159 / 0.119 / 0.089 / 0.067 at
        d = 12 / 16 / 20 / 24 / 28 / 32. Declared before the run. A miss at any d
        convicts the instrument or HEUR-SB-2 and blocks all other readings.
    - metric: >-
        G2 -- arm P (planted anisotropy) rho at t in {1.0, 1.25, 1.5, 2.0, 4.0},
        d = 24
      direction: lower
      minimum_effect: >-
