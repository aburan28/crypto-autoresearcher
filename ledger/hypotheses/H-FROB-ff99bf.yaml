# =============================================================================
# H-FROB-ff99bf -- The Couveignes-Lercier survival space at n=131 over F_2
# shrinks further: no abelian variety of dimension 5 or 6 has 131 dividing its
# point count. Design from KN-OPEN-095df5's "cheapest discriminating test"
# item 1, extending the exact Weil-census exclusion of dimensions 1-4.
# Approved with EXP-FROB-720a77 by DEC-20261005-0f460b. This record asserts
# nothing until EXP-FROB-720a77 completes and its evidence is reviewed.
# =============================================================================
