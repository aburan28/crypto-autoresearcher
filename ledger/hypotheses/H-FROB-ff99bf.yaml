  id: H-FROB-ff99bf
  question_id: RQ-FROB-7d8dd4
  added: '2026-10-05'
  proposed_by: coordinator
  source_idea: null
  source_note: >-
    Designed directly from knowledge/open-problems/KN-OPEN-095df5's
    "cheapest discriminating test" item 1 (read in full this session), not
    from a new IDEA record: the open problem IS the proposal, already
    carrying its why-it-matters, settle condition, and prior exact work.
  archived_by: null
  approved_by_decision: DEC-20261005-0f460b
  approved_at: '2026-10-05'
  status: approved
  status_note: >-
    approved on design completeness (frozen contract EXP-FROB-720a77);
    nothing asserted about the world until the run completes and is reviewed.
  title: >-
    No abelian variety over F_2 of dimension 5 or 6 has 131 dividing its
    point count (Couveignes-Lercier survival-space narrowing at the ECC2K-130
    degree)
  statement: |
    CLAIM (falsifiable either way; both outcomes are results). For every
    abelian variety A of dimension g in {5, 6} over F_2, the point count
    #A(F_2) is NOT divisible by 131. Equivalently, the exact Weil-census
    enumeration of KN-OPEN-095df5, which excluded all integer candidates at
    dimensions 3 (104 exact tests) and 4 (234,220 exact tests), finds ZERO
    admissible Weil 2-polynomials of degree 2g with norm divisible by 131
    at g = 5 and g = 6.
    WHAT A HIT MEANS (the falsification, and the more valuable outcome): a
    hit at dimension g is a concrete Weil polynomial, hence a Honda-Tate
    isogeny class of abelian varieties over F_2 with a rational point of
    order 131 -- the exact object the Couveignes-Lercier factor-base
    construction needs at the ECC2K-130 degree, reopening the
    Frobenius-invariant factor-base route (KN-OPEN-095df5 existence half).
    A hit does NOT by itself give a factor base: the degree half (an
    explicit group with one-coordinate-enough translation formulae, and a
    degree bound on the descended system against GGMP example 5.1's ~280x
    solve-cost penalty) remains open and is OUT OF SCOPE for this contract.
    WHAT A MISS MEANS: the exclusion extends from dimension 4 to dimension 6,
    narrowing the survival space of the conjectural Couveignes-Lercier route
    at n = 131 to dimension >= 7 and to non-abelian commutative algebraic
    groups (the norm-one torus of dimension 48 remains the one place 131 is
    known to appear). Scoped exactly: dimensions 5-6 over F_2 only; no
    claim about other q, other n, or non-abelian groups.
    SETTING (frozen from KN-OPEN-095df5 and its cited scripts; not
    invented). q = 2, n = 131 prime, ord_131(2) = 130 so the Galois group
    has no proper invariant subspaces (IDEA-20260918-9abf42). An abelian
    variety A/F_q of dimension g has a Weil q-number whose minimal polynomial
    (the Weil polynomial) is monic of degree 2g with integer coefficients,
    all roots on the circle |z| = sqrt(q), and #A(F_q) = P(1) for the
    Weil polynomial P. The enumeration: for each g in {5, 6}, for each
    multiple M of 131 with 0 < M <= (1+sqrt(q))^{2g} (the Weil range
    (1+sqrt(2))^{10} at g=5 and (1+sqrt(2))^{12} at g=6), enumerate the
    integer coefficient tuples of monic degree-2g polynomials with P(1) = M,
    symmetric coefficients (P(z) = z^{2g} P(q/z) / q^g form), all roots
    real-rootedness-tested by Sturm sequence over the rationals with the
    boundary |z| = sqrt(2) handled by splitting off the factor (z^2 - 2)^k
    and approaching from both sides, exactly as the dimension-1..4 census did
    (analysis/couveignes-lercier-131/weil_census.py and exact_targets.py,
    read this session). Every candidate that passes is recorded with its
    Weil polynomial; every candidate that fails is counted.
    CONTROLS (controls before belief):
    C1 DIMENSION-4 REPRODUCTION: the same instrument must reproduce the
    recorded dimension-4 result exactly -- 234,220 exact tests, zero hits,
    and the dimension-3 figure (104 exact tests, zero hits) -- before any
    dimension-5 cell is computed. Disagreement invalidates the run
    (instrument, not hypothesis).
    C2 RANGE BOUNDARY: a Sturm test whose root lands inside the +/-sqrt(2)
    boundary gap must be REPORTED, not silently classified (the open
    problem's own caution).
    C3 SPARSITY NULL: the census's candidate counts per multiple must be
    reported alongside, so a zero-hit reading that is really an empty
    enumeration (a bug producing no candidates at all) is visible.
  mechanism: >-
    OBJECT: Weil 2-polynomials of degree 2g, g in {5, 6} -- integer
    coefficient tuples constrained by P(1) = multiple of 131, Weil symmetry,
    and real-rootedness on |z| = sqrt(2). The tracked quantity is the exact
    count of admissible polynomials. OPERATION SET: pure enumeration and
    exact integer/rational arithmetic; no curve, group law or point is
    constructed; the object is the coefficient tuple. This is Class I
    partial-action in the program's sense (the enumeration propagates only
    under the Weil constraints), but it is not an ECDLP tracked-object claim:
    it is a finite exact census.
    WHY IT IS THE CHEAPEST INFORMATIVE CELL: KN-OPEN-095df5 names it. The
    targeted search scales with the number of integer candidates whose point
    count is a multiple of 131, which is far smaller than the isogeny-class
    count; dimension 4 cost 234,220 exact tests. The only prior work
    (EV-FROB-b6e1e9, KN-FIND-47da4e) stopped at dimension 4 by cost, not by
    obstruction. The other named test (reading Couveignes-Lercier directly)
    is a literature task, separable and not in this contract.
  assumptions:
    - >-
      Honda-Tate: an isogeny class of abelian varieties over F_2 with Weil
      polynomial P exists for every integer polynomial P satisfying the Weil
      conditions, and #A(F_2) = P(1) for every A in the class. Internal
      provenance: KN-OPEN-095df5's enumeration argument; RECALLED as
      classical (Honda-Tate theory) and used only as the standard bridge
      between polynomials and varieties, exactly as the dimension-1..4
      census used it.
    - >-
      The dimension-1..4 enumeration methodology (symmetric coefficient
      enumeration, Sturm real-rootedness, boundary splitting of z^2 - 2)
      extends to degrees 10 and 12 without modification; if the candidate
      count at g=5 or g=6 is infeasibly large, the FEASIBILITY GATE (not
      brute force) reports it and the run stops as an impediment, never as
      evidence.
    - >-
      A hit narrows nothing and falsifies the claim; a miss excludes only
      dimensions 5-6 over F_2 at n=131. The degree half of the open
      problem (explicit translation formulae, descended-system degree bound)
      is untouched and stays open in both outcomes.
  predictions:
    - metric: >-
        hits = number of admissible Weil polynomials with P(1)
        divisible by 131, per dimension in {5, 6}
      direction: different
      minimum_effect: >-
        Zero hits at both dimensions extends the exclusion (claim supported
        at the tested scope); one or more hits falsifies it and supplies the
        concrete Weil polynomial(s) with their Honda-Tate class data. No
        direction is promised; both are recorded.
    - metric: >-
        exact_tests and candidate counts per multiple M of 131
      direction: different
      minimum_effect: >-
        Reported per dimension for cost transparency and the C3 sparsity
        null; never evidence for or against the claim.
  falsification_conditions:
    - >-
      One or more admissible Weil polynomials with P(1) divisible by 131 at
      g in {5, 6}, with C1 instrument reproduction passing. The claim is
      refuted at that dimension; the hit's polynomial is the artifact.
    - >-
      C1 failure (dimension-4/3 reproduction disagrees with 234,220 / 104
      tests and zero hits): the RUN is invalid, not the hypothesis.
    - >-
      Infeasibility (the g=5 or g=6 candidate count exceeds the feasibility
      gate): an impediment, never evidence; the run stops and reports.
    - >-
      Timeout, crash, memory cap: infrastructure, never evidence.
  test_boundary:
    instances: >-
      q = 2 fixed. g in {5, 6}. Multiples M of 131 with 0 < M <=
      (1+sqrt(2))^{2g}. All other n, q, dimensions, non-abelian groups, and
      the degree half of KN-OPEN-095df5 are OUT OF SCOPE.
    parameters:
      weyl_range_g5: (1+sqrt(2))^10
      weyl_range_g6: (1+sqrt(2))^12
      prior_dim4_exact_tests: 234220
      prior_dim3_exact_tests: 104
  proof_search_map:
    bottleneck: >-
      Whether ANY admissible degree-10 or degree-12 Weil 2-polynomial has
      norm divisible by 131. The bottleneck of the survival space, not of a
      proof: a miss is an extension of a computational exclusion, not a
      theorem about all dimensions.
    baseline_embedding:
      parameter_slice: >-
        Dimensions 1-4 reproduce: dimension-3 figure 104 exact tests, zero
        hits; dimension-4 figure 234,220 exact tests, zero hits, as
        recorded in KN-OPEN-095df5 and EV-FROB-b6e1e9's scripts.
      reproduction_check: C1 above; disagreement invalidates the instrument.
    observation_collision:
      observable: the per-dimension hit count and the admissible-polynomial list.
      distinct_preimage_search: >-
        An empty enumeration (zero candidates at all) would look like zero
        hits; C3's candidate counts separate a real exhaustive miss from an
        empty sweep. A boundary-straddling root misclassified by the Sturm
        arm would produce a false miss or false hit; C2 reports every
        boundary case rather than classifying it.
    constructive_transforms:
      - transform: census_extension
        proposed_object: Weil 2-polynomials of degree 10 and 12.
        predicted_gain: extends a bounded exact exclusion by two dimensions; minutes-to-hours of CPU.
    quantifier_order: >-
      For each g in {5,6}, for each multiple M of 131 in range, for each
      integer tuple: test, count, record. The universal claim is read off
      the completed census, never asserted before it.
    method_ceiling:
      strongest_certifiable_claim: >-
        No abelian variety of dimension 5 or 6 over F_2 has 131 dividing
        its point count -- a finite, machine-reproducible exclusion with a
        completeness argument identical to the dimension-1..4 one. NOT a
        statement about dimension >= 7, other q, or non-abelian groups.
      nearby_object_control: >-
        C1's dimension-4 reproduction; plus the known-positive control that
        the SAME instrument at the norm-one-torus dimension 48 is out of
        range and NOT tested here (recorded so a reader does not mistake the
        miss for contradicting the torus fact).
    proof_obligations:
      - >-
        The enumeration's completeness argument (symmetric tuples + Weil
        range + Sturm admissibility covers every isogeny class) is inherited
        from the dimension-1..4 census and restated in the analysis, not
        re-proved.
