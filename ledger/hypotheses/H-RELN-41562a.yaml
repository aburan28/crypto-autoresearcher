hypothesis:
  id: H-RELN-41562a
  id_allocation_provenance: >-
    Pre-minted by the dispatching session with tools/allocate_id.py and
    confirmed free with --check before this record was authored; supplied
    in the task assignment. This agent did not mint or re-mint it and did
    not scan state for a free number.
  question_id: RQ-RELN-61638a
  goal_id: null
  goal_id_note: >-
    Not bound to a GOAL record. GOAL-RELN-001 (factor-base decomposition
    probability audit) is the natural host, as RQ-RELN-61638a and
    IDEA-20260906-d1494b both state; binding is a separate Coordinator
    ledger-archive act and is not performed by this record.
  source_proposal: IDEA-20260906-d1494b
  status: proposed
  proposed_by: coordinator
  task_id: null
  recorded_at: '2026-09-06'
  novelty_status: unverified

  statement: >-
    On prime-order short-Weierstrass curves E/F_p with N = #E(F_p) prime and
    near 2^14, 2^16, 2^18 and 2^20 (at least three curves per rung), at arity
    m = 3, under the two frozen base-size conventions B_1 = ceil((6N)^{1/3})
    rounded up to even and B_2 = the largest prime power q with
    3(q^3 - 1) < N, and under both the unreduced and the reduced sign
    conventions on negation-closed bases, the dispersion index
    Delta = E_3/M - mu of the decomposition-count vector of every x-interval
    and quadratic-residue-class base lies inside the mean plus or minus 3 SD
    band of 100 matched uniformly random x-class-set bases at every rung,
    with a fitted slope of log(max(Delta - Delta_null, SD_null)) against
    log N whose interval contains 0 (the pre-committed NULL outcome), as
    against a positive excess beyond 3 SD on every curve at the two largest
    rungs that increases across rungs with a slope interval excluding 0 (the
    ALIVE outcome), while in the same run the Z/N-interval control shows
    Delta >= 0.05 B^2, the Bose-Chowla B_3 control shows E_3 = M_2 exactly,
    the forced-negation gap Delta_unreduced - Delta_reduced equals B^3/(4M)
    within 0.1, and the accounting identities INV-1 (sum of counts = M or
    M_red) and INV-2 (sum of squared counts = E_3, independently recomputed)
    hold with deviation exactly 0 in every cell.

  mechanism: >-
    Restated from IDEA-20260906-d1494b, whose in-record derivations are
    unreviewed. For a base D of B distinct points in a group of prime order
    N, c_D(r) counts the size-m multisets from D summing to r. INV-1
    (KN-FIND-007, established) fixes the first moment, sum_r c_D(r) =
    M = C(B + m - 1, m). INV-2 (elementary double count over ordered pairs
    of multisets) gives the second moment, sum_r c_D(r)^2 = E_m(D), the
    m-fold multiset additive energy of D, so the dispersion index
    Delta = Var/mean = E_m/M - mu with mu = M/N is an exact accounting
    quantity. For a uniformly random base every pair of distinct multisets
    collides with probability 1/N (INV-2p), so E[Delta] = 1 - 1/N up to
    O(m^2 B/N); this is the Poisson value and the random-base band around
    it is the null. 'Clusters of easier decompositions' -- targets with
    anomalously many decompositions, visible from x(r) -- are exactly
    over-dispersion explained by a representation-decidable partition, and
    by Cauchy-Schwarz (INV-3pp) every predicate lift satisfies
    |rho_S - 1| <= sqrt(Delta (1 - sigma)/(sigma mu)), so a single measured
    number, Delta(D_N) - Delta_null(N), bounds every representation-
    decidable lift at once and an exponent-relevant lift rho ~ N^delta
    would require Delta >= sigma mu N^{2 delta}. Causal route for a
    cluster: an x-interval base is a structured box on the x-line whose
    3-fold sumset is the pushforward of that box through the algebraic
    correspondence S_4 = 0; a biased pushforward with respect to any cheap
    x-predicate is over-dispersion, a square-root-flat group spectrum of the
    base (conjecture INV-4c) is unbiased with respect to every subset at
    once. The recalled Kohel-Shparlinski mixed character-sum bound places
    the provable no-cluster regime at B above p^{1/2} log p (nontrivial)
    and p^{3/5} (Poisson-level) at m = 3, both far above the index-calculus
    B of order p^{1/3}; the index-calculus regime is therefore open and is
    what the paired battery measures directly. Two forced values calibrate
    the instrument, namely the Z/N interval base (identical count vector to
    the E small-multiples base) with Delta of order (11/120) B^2, and the
    negation-forced trivial cluster {P, -P, Q} on every negation-closed base
    with Delta_unreduced - Delta_reduced = B^3/(4M); a Bose-Chowla B_3 set at
    the second convention attains E_3 = M_2 exactly, the minimum-energy
    floor.

  assumptions:
    - >-
      N = #E(F_p) is an odd prime (cofactor 1); the abstract Z/N with the
      same prime N is the control group. Curves of composite order are
      outside every identity that uses 'n_j is a unit mod N' and are not
      admitted.
    - >-
      B always denotes the number of searched POINTS. Negation-closed
      bases W = V union -V have B even and B/2 x-classes; plain bases have B
      elements. Under the unreduced convention the conservation total is
      C(B + 2, 3) for every arm; under the reduced convention on
      negation-closed bases it is M_red = M - B^2/2 at m = 3.
    - >-
      The two sign conventions are both reported on every negation-closed
      arm and never mixed within a cell; each cell declares exactly one.
    - >-
      Exhaustive counts are computed by enumerating all multisets with
      group arithmetic native to the arm (point additions on E, integer
      arithmetic in Z/N); every decomposition is a checked group identity,
      and INV-1 is asserted with deviation 0 on every cell before any other
      number is read from it.
    - >-
      Discrete logarithms of base points are used only for the spectral
      (FFT) cross-check and the log-window anchor, both unrealizable
      instruments labelled as such; no predicate in the frozen family
      depends on a logarithm.
    - >-
      Toy scale binds. N near 2^14, 2^16, 2^18, 2^20 at m = 3; nothing is
      claimed at cryptographic scale, and no outcome is an ECDLP speedup or
      an attack.

  predictions:
    - metric: >-
        M1 -- accounting identities INV-1 and INV-2 per cell (sum of counts
        against M or M_red; sum of squared counts against the independently
        recomputed E_3)
      direction: different
      minimum_effect: >-
        FORCED EXACT, deviation 0 with integer counters in every cell of
        every arm; any nonzero deviation halts the cell as an implementation
        fault and is not evidence.
    - metric: >-
        M2 -- dispersion index Delta of NULL-A (random x-classes, reduced)
        and NULL-B (random points on E; random subset of Z/N) across 100
        draws per (N, B_1)
      direction: different
      minimum_effect: >-
        Mean Delta within 3 standard errors of 1 - 1/N. Design figure for the
        spread, SD(Delta) about sqrt(mu + 6 mu^2 + 4 mu^3)/(mu sqrt N) =
        0.026, 0.013, 0.0066, 0.0033 at the four rungs (heuristic HEUR-001,
        reported against the measured SD, not asserted). The E random-point
        and Z/N random arms agree in distribution (KS not rejected at 1
        percent).
    - metric: >-
        M3 -- Delta of the Z/N interval control [1, B_1] (identical to the E
        small-multiples base) at B_1
      direction: higher
      minimum_effect: >-
        At least 0.05 B^2, i.e. >= 115, 274, 696, 1730 at the nominal
        rungs, equal to the pre-registered exact integer enumeration
        (design value about (11/120) B^2 = 211, 502, 1277, 3172), and ratio
        to the random-band mean above 100 at every rung. The E
        small-multiples arm reproduces the Z/N arm's count vector
        bit-for-bit.
    - metric: >-
        M4 -- E_3 and Delta of the Bose-Chowla B_3 control at B_2 = 17, 27,
        43, 67 (nominal)
      direction: different
      minimum_effect: >-
        FORCED, E_3 = M_2 = C(B_2 + 2, 3) = 969, 3654, 14190, 52394 exactly
        (nominal) and Delta = 1 - mu_2 exactly; a single repeated 3-sum
        refutes the B_3 property of the constructed set.
    - metric: >-
        M5 -- Delta_unreduced - Delta_reduced on every negation-closed arm
        at B_1
      direction: higher
      minimum_effect: >-
        B^3/(4M) within 0.1, i.e. 1.411, 1.441, 1.463, 1.476 at nominal even
        B = 48, 74, 118, 186 with M = 19600, 70300, 280840, 1089836; forced
        up to the O(m/B) term.
    - metric: >-
        M6 -- Delta of E/x-interval and E/QR-class bases (reduced, at B_1 and
        at B_2) on at least 3 curves per rung, against the NULL-A band
      direction: different
      minimum_effect: >-
        EXPECTED NULL OUTCOME, pre-committed: inside the band (NULL-A mean
        plus or minus 3 SD) at every rung on every curve, and the fitted
        slope of log(max(Delta - Delta_null, SD_null)) against log N has an
        interval containing 0. COMPETING (ALIVE) OUTCOME, named in advance:
        Delta - Delta_null positive beyond 3 SD on every curve at the two
        largest rungs and increasing across rungs (slope interval excluding
        0). An interval containing both is underpowered and is reported with
        the rung count needed. The null outcome is a valid, reportable
        result.
    - metric: >-
        M7 -- k-rich target counts (number of targets r with c(r) >= k),
        k = 1..8, per arm
      direction: different
      minimum_effect: >-
        Random arms within the Poisson tail N P[Poisson(mu) >= k] up to
        sampling spread (k = 8 essentially empty at these mu); the Z/N
        interval arm with peak counts of order B^2/8 (about 4300 at
        B = 186); every arm obeys Chebyshev #{c >= k} <= N mu Delta/(k - mu)^2
        for k > mu (forced consistency check).
    - metric: >-
        M8 -- pushforward lifts rho_S and precision lifts lambda_S for the
        frozen predicate family (x < p/2; x mod 4 = 0; Legendre(x) = 1;
        Legendre(x - 1) = 1; Legendre(x + 1) = 1; low three bits of x zero;
        x < p/8) plus the unrealizable log-window anchor of density 1/8,
        with z-scores against the INV-3 analytic null (plain arms) or the
        Monte Carlo band (negation-closed arms), Holm-corrected within each
        (arm, rung) family
      direction: different
      minimum_effect: >-
        NULL-B arms: z-scores of all seven predicates and the anchor
        distributed as N(0, 1) (KS not rejected at 1 percent over cells).
        Object arms: max Holm-corrected |z| over the seven representation
        predicates below the 5 percent threshold at every rung (expected
        null). The log-window anchor on the Z/N interval arm must show rho
        near 8 (the RT-4 value relayed by IDEA-20260830-c5c614), the
        instrument's sensitivity check. Competing outcome: a predicate whose
        Holm-corrected |z| exceeds threshold at the two largest rungs on every
        curve, with rho - 1 tracking sqrt(Delta excess) as INV-3pp allows.
    - metric: >-
        M9 -- spectral cross-check (FFT over Z/N of the base's log-set, toy
        scale only): the multiset count vector recomputed by the spectral
        route, (1/N) sum_{chi != 1} |S_D(chi)|^6 / B^3 and
        max_{chi != 1} |S_D(chi)| / sqrt(B log N)
      direction: different
      minimum_effect: >-
        The spectral count vector equals the directly enumerated one exactly
        (identity); random arms near 6 and near 1 respectively; Z/N interval
        far above both (max about B/sqrt(B log N)); x-interval arms expected
        near the random values (INV-4c spectral form), competing outcome a
        sixth-moment ratio growing with N.

  test_boundary:
    instances:
      - >-
        At least three prime-order short-Weierstrass curves E/F_p per rung,
        generated by the frozen seeded recipe of EXP-RELN-f202be with p in
        [2^k, 2^k + 2^{k - 6}] for k in {14, 16, 18, 20} and #E(F_p) prime,
        each with a point-count certificate.
      - >-
        The abstract group Z/N with the same prime N as each curve, for the
        interval, random, Bose-Chowla and q-decay control arms.
    parameters:
      arity_m: 3
      rungs_nominal_N: [16384, 65536, 262144, 1048576]
      base_size_convention_1: >-
        B_1 = ceil((6N)^{1/3}) rounded up to even for negation-closed arms
        (nominal 48, 74, 118, 186); unrounded for plain arms; recomputed from
        the actual N of each curve at run time.
      base_size_convention_2: >-
        B_2 = largest prime power q with 3(q^3 - 1) < N (nominal 17, 27, 43,
        67); recomputed from the actual N at run time.
      sign_conventions: [unreduced, reduced]
      geometry_panel:
        - E/x-interval (low)
        - E/x-interval (mid)
        - E/QR-class (interval restricted to quadratic residues)
        - E/random-x-classes (NULL-A)
        - E/random-points (NULL-B)
        - Z/N random subset (NULL-B, mirrored on E)
        - Z/N interval [1, B] (positive control, equal to E small-multiples)
        - Z/N Bose-Chowla B_3 at B_2 (minimum-energy control)
        - Z/N interval with q-decay ladder q in {0, 0.25, 0.5, 0.75, 1}
      null_draws_per_cell: 100
      k_rich_range: [1, 8]
      predicate_family_size: 7
    implementation: >-
      No implementation exists under this design. The paired contract
      EXP-RELN-f202be requires a direct enumerator (group arithmetic native
      to each arm) and a separate spectral (FFT) implementation sharing no
      code, plus integer-arithmetic Z/N arms mirrored on E by scalar
      multiplication.
    budget:
      enforcement: advisory
      wall_clock_seconds_per_run: 14400
      total_cpu_hours: 12
      maximum_memory_gb: 4
      maximum_runs: 8
      maximum_workers: 4

  falsification_conditions:
    - >-
      F-NULL (valid reportable outcome, not a refutation of the record): the
      pre-committed null outcome of M6 and M8 at all four rungs with M2, M3,
      M4, M5 passing. This supports INV-4c at toy scale only and records the
      measured obstruction (Delta excess with interval) for the learned
      lanes of RQ-RELN-61638a.
    - >-
      F-ALIVE (the hypothesis's null branch is refuted at toy scale): M6's
      competing outcome replicated on every curve at the two largest rungs
      while M1-M5 pass. INV-4c is refuted at toy scale and the learned-
      predictor and symbolic-regression lanes acquire a measured target with
      between-cell budget mu (Delta - Delta_null).
    - >-
      F-INV2p (the derived null is wrong): NULL-B mean Delta outside 3 SE of
      1 - 1/N on two rungs, or Var T_S departing from sigma (1 - sigma) M
      beyond 3 SE on the log-window anchor while the sampler passes its
      uniformity check. INV-2p or INV-3 is wrong as derived; this record is
      superseded, not edited.
    - >-
      INSTRUMENT FAILURE (no scientific reading from the affected cell or
      run): any accounting identity violated (sum of counts != M or M_red;
      sum of squares != independently recomputed E_3; Chebyshev bound
      violated); a positive control missed (Z/N interval Delta below
      0.05 B^2, q-decay ladder not monotone, E small-multiples mirror not
      bit-identical to the Z/N arm, Bose-Chowla E_3 != M_2, forced-negation
      gap off by more than 0.1); or the FFT spectral count vector
      disagreeing with the direct count. These are implementation faults or
      a blind instrument; no negative may be reported from any arm of that
      run.
    - >-
      F-THRESHOLD (scope of claim (vii) only): a retrieved Kohel-Shparlinski
      statement of a different shape moves the provable thresholds; the
      record is superseded with the retrieved bound and no measured number
      changes.
    - >-
      Timeouts, out-of-memory events and crashes are failed_infrastructure
      and never evidence for or against any branch (AGENTS.md rule 3).

  interpretation_limits:
    - >-
      Toy tier at N <= 2^20 (2^22 and 2^24 optional extension); the
      identities are scale-free but no measured number transfers and no
      crypto-scale statement is made.
    - >-
      NO ATTACK, NO EXPONENT MOVED. A bounded Delta closes a channel with a
      number attached; an unbounded Delta would open a measurement, not an
      algorithm.
    - >-
      INV-4c is not proved by any outcome; a null at four rungs supports it
      at toy scale only, and the provable regime remains B above
      p^{1/2} log p (nontrivial) and p^{3/5} (Poisson-level).
    - >-
      A Delta excess says nothing about solve cost or relation rank; it
      bounds only what target selection can buy.
    - >-
      The Bose-Chowla, Z/N interval and q-decay controls are log-defined
      and unrealizable as factor bases; they calibrate the instrument and
      nothing else.
    - >-
      The frozen predicate family is not exhaustive; a family null is
      generalised only through the INV-3pp envelope on a bounded Delta,
      never by itself.
    - >-
      The three-curve replication per rung is the object arms' only spread;
      a fixed object base is one deterministic number per curve.

  proof_search_map:
    bottleneck: >-
      Whether E_3 of an x-interval (or QR-class) base exceeds the random
      value M + M(M - 1)/N by more than the random-base band in the
      index-calculus range B of order (6N)^{1/3}, and whether the excess, if
      any, grows with N. Every other statement in the record is an identity;
      this one number is the open content and sits outside the regime any
      recalled character-sum bound reaches (claim (vii) of the proposal).
    baseline_embedding:
      parameter_slice: >-
        INV-1 (KN-FIND-007) is the first moment and must reproduce exactly in
        every cell; the m = 2 law of IDEA-20260906-86cd30 is the arity-2
        slice of INV-2p; the forced counts of IDEA-20260805-a25f11 (B/2 at
        m = 2, B^2/2 at m = 3 in the points convention) are the exact slices
        of INV-2pp. The FB3 battery's frozen convention (EXP-FB3-001
        conservation.md: B distinct nonzero elements, all m = 3 multisets,
        whole group) is the plain-arm convention here and its symmetric
        D union -D arm is the unreduced convention here.
      reproduction_check: >-
        Per cell: sum of counts equals M (unreduced or plain) or M_red
        (reduced) with integer-exact deviation 0; the spectral route's
        multiset count vector equals the direct enumerator's exactly; the Z/N
        interval arm's E_3 equals the pre-registered integer enumeration; the
        E small-multiples mirror equals the Z/N interval arm bit-for-bit. Any
        nonzero deviation on an exact check halts the cell.
    observation_collision:
      observable: >-
        The count histogram (number of targets with 0, 1, 2, ...
        decompositions) and its summaries E_3, Delta and k-rich counts; the
        group power spectrum; and the pushforward cell-total vector for the
        frozen predicate family.
      distinct_preimage_search: >-
        Collisions are exhibited, not hunted. (a) By INV-3 every affine
        image uD + t of a base has the same histogram, so exponentially many
        distinct bases share it. (b) The Z/N interval [1, B] and the E
        small-multiples base have identical count vectors and run as one
        control plus an arithmetic consistency check. (c) Two bases with
        equal histogram can have different pushforward vectors, which is why
        the pushforward is a separate observable. (d) The separating pair is
        (E/x-interval, E/random-x-classes), predicted to collide on the
        histogram within the random band, versus (Z/N interval, Z/N random),
        predicted to separate by a factor above 100 in Delta; an instrument
        on which the second pair does not separate is void.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The second moment E_m and the group power spectrum as the tracked
          object, in place of the mean (fixed by INV-1) and of a learned
          predictor's accuracy.
        predicted_gain: >-
          An accounting identity with a closed-form null replaces a simulated
          selection null; one number (Delta excess) bounds every lift of
          every predicate via INV-3pp.
      - transform: representation_reduction
        proposed_object: >-
          The Riemann-Roch conic family Gamma_D and the incidence structure
          (E(F_p), Gamma_D); the forced cluster read as the degenerate
          sub-family gamma = 0.
        predicted_gain: >-
          Exact identification of the trivial cluster a learned model must
          not be credited for; the audit that the incidence route is void at
          M of order N for k below N^{1/2}, redirecting the k-rich bound to
          Chebyshev on INV-2.
      - transform: boundary_lift
        proposed_object: >-
          The character-sum ceiling at B above p^{1/2} log p (nontrivial) and
          p^{3/5} (Poisson-level), with INV-4c the conjectured extension down
          to p^{1/3}.
        predicted_gain: >-
          Names the provable boundary exactly, so the toy-scale measurement is
          placed honestly in the open regime rather than presented as a proof.
    quantifier_order: >-
      IDENTITIES: FOR ALL prime N, FOR ALL D subset G with |D| = B, FOR ALL
      m: sum_r c_D(r)^2 = E_m(D) and Delta >= {mu}(1 - {mu})/mu; FOR ALL
      fixed S subset G and uniformly random D: E[T_S] = sigma M and (i.i.d.)
      Var[T_S] = sigma (1 - sigma) M; FOR ALL D and S: |rho_S - 1| <=
      sqrt(Delta (1 - sigma)/(sigma mu)). CONJECTURE INV-4c: FOR ALL
      prime-order E/F_p and FOR ALL x-interval bases with B in [p^{1/3},
      p^{1/2}], E_3(D) = (1 + o(1))(M + M^2/N). EMPIRICAL CLAIM (this
      hypothesis's null branch): FOR ALL four rungs and FOR ALL tested
      curves, Delta(x-interval) lies inside the random-class-set band; the
      COMPETING claim is THERE EXISTS a rung from which the excess is
      positive on every curve and increasing. The curves, seeds and
      predicate family are fixed before any count is read; no selection over
      curves or predicates after observation.
    method_ceiling:
      strongest_certifiable_claim: >-
        At toy scale (N near 2^14 to 2^20, m = 3, at least 3 prime-order
        curves per rung, two B conventions, both sign conventions) the
        dispersion index of x-interval and QR-class bases sits within the
        random-class-set band (or exceeds it by a measured amount with a
        measured growth exponent), the Z/N interval control exceeds it by a
        factor above 100, and the Bose-Chowla control attains the exact
        Sidon floor; hence every representation-decidable predicate lift is
        bounded by sqrt(Delta (1 - sigma)/(sigma mu)) at those cells. It
        certifies nothing about crypto scale, nothing about solve cost or
        rank, and proves INV-4c at no scale.
      nearby_object_control: >-
        Z/N with the interval base [1, B] (equivalently the small-multiples
        base on E): the same identities hold, the same instrument runs, and
        the conclusion 'no cluster' FAILS by a factor of order B^2; it is
        the object on which the method must return the opposite verdict.
        Second nearby object: the unreduced negation-closed convention, on
        which the base itself is a forced cluster of size B^3/(4M) in Delta.
    proof_obligations:
      - claim: INV-2 double count and the dispersion-index algebra.
        responsibility: correctness
      - claim: >-
          INV-2p collision probability exactly 1/N in the i.i.d. model; the
          support-two exception and the O(m^2 B/N) correction without
          replacement; the reduced negation-closed extension.
        responsibility: correctness
      - claim: >-
          INV-3 affine covariance and Var T_S = sigma (1 - sigma) M; the
          negation-closed caveat (mean-only).
        responsibility: correctness
      - claim: >-
          INV-3pp Cauchy-Schwarz envelope and its consequence for the
          IDEA-20260830-c5c614 cost ledger.
        responsibility: interface
      - claim: >-
          INV-4 thresholds p^{1/2} log p and p^{3/5}, conditional on the
          recalled Kohel-Shparlinski bound; retrieval of the bound is a
          zero-compute stage of EXP-RELN-f202be.
        responsibility: scope
      - claim: >-
          INV-5 conic reading, degenerate sub-family, and the audit that
          incidence bounds are void for k < N^{1/2} at M of order N.
        responsibility: baseline
      - claim: INV-9 corrected floor and the existence of the B_2 convention at every rung.
        responsibility: feasibility
      - claim: >-
          Exhaustive enumeration at N near 2^20 (about 1.1e6 multisets per
          base, 100 null bases per cell) fits the stated budget with native
          point arithmetic on E.
        responsibility: runtime
      - claim: >-
          The count vector and its FFT at N near 2^20 fit the declared memory
          ceiling.
        responsibility: memory
      - claim: Every number is toy-tier and scoped to the declared curves, conventions and budget.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null
  rerandomization_note: >-
    No worst-to-average-case device is claimed or needed. The object bases
    are deterministic functions of the curve; the null bases are seeded
    uniform draws; nothing is pulled back to an input instance.

  asymptotic_claim: null
  asymptotic_claim_note: >-
    No complexity improvement is claimed. The record is a measurement of a
    reference law. IDEA-20260906-d1494b's target_complexity states what a
    sustained energy excess would do to the IDEA-20260830-c5c614 ledger; that
    consequence is conditional on the ALIVE outcome and is not asserted here.

  heuristic_assumptions:
    - id: HEUR-001
      proposal_label: H1
      formal_statement: >-
        POISSON DISPERSION OF RANDOM BASES. For D uniform of size B in a
        group of prime order N, the counts c(r) behave as approximately
        independent Poisson(mu) variables to second order: E[E_m] =
        M + M(M - 1)/N (exact in the i.i.d. model, INV-2p), Var[E_m] about
        N (mu + 6 mu^2 + 4 mu^3), and max_r c(r) of order log N / log log N.
      random_model_justification: >-
        The mean is exact (INV-2p); the without-replacement correction is
        bounded by m^2 B/N; the cell-total variance sigma (1 - sigma) M is
        exact in the i.i.d. model (INV-3). The heuristic content is only the
        fourth-moment figure and the maximum, imitating balls-in-bins
        occupancy.
      supporting_results: []
      validation_experiment_ids: [EXP-RELN-f202be]
      falsification_condition: >-
        Measured SD of Delta over 100 random bases per (N, B) differing from
        the design figure by more than a factor of 2 at two or more rungs, or
        the largest Delta over draws outside a 3 SD band at two or more
        rungs, with the sampler's uniformity check passing.
    - id: HEUR-002
      proposal_label: H2
      formal_statement: >-
        THE RECALLED MIXED CHARACTER-SUM BOUND. |sum_{P in E(F_p)} chi(P)
        psi(x(P))| << p^{1/2} for chi a nontrivial character of E(F_p) and
        psi a nontrivial additive character of F_p, hence |S_D(chi)| <<
        p^{1/2} log p for x-interval bases and the thresholds of claim (vii).
      random_model_justification: >-
        Recalled as Kohel-Shparlinski (ANTS 2000); the statement itself was
        not read in this program. Imitates the Weil bound for a character
        sum on a curve twisted by a torsor character. Used only to place the
        provable boundary; no measured quantity depends on it.
      supporting_results: []
      validation_experiment_ids: [EXP-RELN-f202be]
      falsification_condition: >-
        A retrieved statement of a different shape (which supersedes the
        thresholds, not the measurement); or, empirically at toy scale, the
        FFT max_{chi != 1} |S_D(chi)| for x-interval bases exceeding
        p^{1/2} log p at any rung.
    - id: HEUR-003
      proposal_label: H3
      formal_statement: >-
        BOSE-CHOWLA B_3 WITH REPETITION. The Bose-Chowla set of size q in
        Z/(q^3 - 1) has all 3-fold sums with repetition distinct, and its
        integer lift to [0, q^3 - 2) is a B_3 set in Z/N for N > 3(q^3 - 1).
      random_model_justification: >-
        Recalled construction; the lifting step is derived in the proposal.
        The claim is verified exhaustively by the control itself (E_3 = M_2
        is a forced integer value), so nothing rests on the recollection.
      supporting_results: []
      validation_experiment_ids: [EXP-RELN-f202be]
      falsification_condition: >-
        A repeated 3-multiset sum in the integer enumeration of all
        C(q + 2, 3) sums at any of q = 17, 27, 43, 67 (or the recomputed B_2).

