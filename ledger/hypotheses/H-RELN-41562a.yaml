  reduction_chain:
    core_problem: >-
      Not applicable; no reduction is claimed. The record measures the second
      moment of the decomposition-count vector at toy scale.
    corollaries: []

  dominated_by: >-
    AS AN ATTACK none is mounted; on the prime-field frontier parallel rho
    with negation (0.886 sqrt N, O(1) memory), BSGS, van Oorschot-Wiener, the
    sumset claw of IDEA-20260829-66a876 and preprocessing S T^2 = N all
    dominate the realised position trivially on time, memory and queries;
    Pohlig-Hellman, MOV, SSSA and Weil descent are not applicable on
    prime-order prime-field curves. AS A REFERENCE LAW the incumbents are
    IDEA-20260805-a25f11 (m = 2 energy identity and floor),
    IDEA-20260906-86cd30 (m = 2 exact law), IDEA-20260830-c5c614 (lift with
    simulated null), IDEA-20260905-5a1ea2 (x-line envelopes) and
    IDEA-20260906-cd7b7e (E_m estimator beyond the enumeration wall); none
    dominates this record on the axis 'analytic null and envelope for the
    cluster question at general m', and each dominates it on its own axis.
  sota_delta: >-
    Cryptanalytic delta: 0 on time, 0 on memory, 0 on data. Reference-law
    delta, all unreviewed and none yet measured: an exact two-moment
    accounting identity; a closed-form selection null with SD
    sqrt((1 - sigma)/(sigma M)) for plain random bases; an envelope
    |rho - 1| <= sqrt(Delta (1 - sigma)/(sigma mu)) on every predicate at
    once; the corrected provable boundary (p^{1/2} log p nontrivial, p^{3/5}
    Poisson-level at m = 3); the corrected Sidon floor with a second B
    convention that makes a true B_3 control exist; and two blocking controls
    with pre-computed forced values (0.05 B^2 and B^3/(4M)). Measured
    improvement: none; design only.

  candidate_invariants:
    - id: INV-1
      statement: >-
        sum_r c_D(r) = C(B + m - 1, m) for every base D of size B, every m,
        every finite abelian G.
      status: proved
      proof_route: >-
        Stars-and-bars double count; KN-FIND-007 (established, toy-confirmed
        on 144 cells with deviation 0). Symbolic-regression recovery control.
      proves_too_much_control: None needed; holds for every base, which is the point.
      settled_by: null
    - id: INV-2
      statement: >-
        sum_r c_D(r)^2 = E_m(D), the m-fold multiset additive energy;
        Delta = E_m/M - mu.
      status: provable_elementary
      proof_route: >-
        Double count over ordered pairs of multisets (proposal mechanism
        (1)); derived in-record, unreviewed. Exact check in every battery
        cell.
      proves_too_much_control: >-
        Applies to every base; the content is in which bases have E_m near
        M + M^2/N.
      settled_by: null
    - id: INV-2p
      statement: >-
        For D of B i.i.d. uniform elements, E[E_m] = M + M(M - 1)/N and
        E[Delta] = 1 - 1/N; without replacement the correction is
        O(m^2 B/N); for a negation-closed base of i.i.d. classes the same
        holds in the reduced convention with M_red = M - B^2/2 at m = 3.
      status: provable_elementary
      proof_route: >-
        Uniformity of sum n_i d_i when some n_j is a unit (proposal
        mechanism (2)); support-two exception counted; derived in-record,
        unreviewed. The seed sketch's O(m/B) was corrected to O(m^2 B/N).
      proves_too_much_control: >-
        The unreduced negation-closed base, where coefficient-vector-zero
        pairs collide with probability 1 (INV-2pp).
      settled_by: null
    - id: INV-2pp
      statement: >-
        For W = -W and m = 3, c_W(Q) >= B/2 for all Q in W, E_3(W) >= B^3/4,
        and Delta_unreduced - Delta_reduced = B^3/(4M) + O(m/B); the forced
        multisets are the degenerate (gamma = 0) members of the L(4O) conic
        family.
      status: provable_elementary
      proof_route: >-
        Enumeration of {P, -P, Q} (proposal mechanism (3)) and the
        vertical-line-pair identification (mechanism (6)); derived
        in-record, unreviewed; IDEA-20260805-a25f11 states the count 2B^2 in
        class notation.
      proves_too_much_control: >-
        A plain (non-symmetric) base, where no such multisets exist and the
        gap is 0.
      settled_by: null
    - id: INV-3
      statement: >-
        c_{uD + t}(u r + m t) = c_D(r); for a uniformly random B-subset of G
        the count vector is AGL(1, N)-invariant in law; for any fixed S of
        density sigma, E[T_S] = sigma M and (i.i.d.) Var[T_S] =
        sigma (1 - sigma) M; hence rho_S has mean 1 and SD
        sqrt((1 - sigma)/(sigma M)).
      status: provable_elementary
      proof_route: >-
        Affine equivariance plus sharp 2-transitivity and the sum constraint
        (proposal mechanism (4)); derived in-record, unreviewed. Checked by
        NULL-B on every predicate cell and the log-window anchor.
      proves_too_much_control: >-
        The negation-closed random base, invariant only under (Z/N)^* and
        negation, for which the variance formula is NOT claimed (INV-3p).
      settled_by: null
    - id: INV-3p
      statement: >-
        For a negation-closed uniformly random class-set base, E[c(s)] is
        constant on G minus O, and Cov(c(s), c(s')) is a function
        gamma(s'/s) of the ratio; a closed form for gamma is open.
      status: conjecture
      proof_route: >-
        Transitivity of (Z/N)^* gives the mean; the covariance requires
        counting signed-class coefficient-vector coincidences per ratio
        class; not attempted. Monte Carlo band used meanwhile.
      proves_too_much_control: The plain uniform base, where gamma is constant (INV-3).
      settled_by: null
    - id: INV-3pp
      statement: >-
        For every base and every S of density sigma, |rho_S - 1| <=
        sqrt(Delta (1 - sigma)/(sigma mu)); the between-cell variance of any
        partition is at most mu Delta; a lift rho ~ N^delta requires
        Delta >= sigma mu N^{2 delta} (1 + o(1)).
      status: provable_elementary
      proof_route: >-
        Cauchy-Schwarz over S and its complement; law of total variance
        (proposal mechanism (5)); derived in-record, unreviewed.
      proves_too_much_control: >-
        The Z/N interval with the log-window anchor, where the envelope is
        nearly attained (rho about 8 at sigma = 1/8 with Delta of order B^2).
      settled_by: null
    - id: INV-4
      statement: >-
        E_m^{ord}(D) = (1/N) sum_chi |S_D(chi)|^{2m}; if |S_D(chi)| <= K for
        chi != 1 then E_m^{ord} <= B^{2m}/N + K^{2m-2} B; with
        K << p^{1/2} log p (recalled Kohel-Shparlinski for x-interval bases)
        the ceiling is nontrivial for B >> p^{1/2} log p and Poisson-level
        only for B >> p^{m/(2m-1)} polylog (p^{3/5} at m = 3).
      status: provable_elementary
      proof_route: >-
        Orthogonality of characters and Parseval (proposal mechanism (8));
        derived in-record, unreviewed; the input bound is RECALLED and its
        retrieval is a stage of EXP-RELN-f202be. The seed sketch's single
        threshold was split into the two stated.
      proves_too_much_control: >-
        Z/N interval, whose spectrum is about B at low frequencies so no
        such K exists and E_3 is of order B^5, as it must be.
      settled_by: null
    - id: INV-4c
      statement: >-
        For x-interval and QR-class bases on prime-order E/F_p and B in
        [p^{1/3}, p^{1/2}], E_3(D) = (1 + o(1))(M + M^2/N); spectral form
        (1/N) sum_{chi != 1} |S_D(chi)|^6 = (6 + o(1)) B^3.
      status: conjecture
      proof_route: >-
        Unknown; would need a sixth-moment (not max) bound on the group
        spectrum of an x-defined set, below the reach of the mixed
        character-sum bound. Measured by M6 and M9 at toy scale.
      proves_too_much_control: >-
        Z/N interval (fails by a factor of order B^2); small-multiples on E
        (same object).
      settled_by: null
    - id: INV-5
      statement: >-
        On prime-order E, c_D(R) at m = 3 equals the number of curves
        alpha x^2 + beta x + gamma y + delta = 0 through -R whose other three
        intersections with E lie in D with multiplicity (L(4O) =
        span{1, x, y, x^2}); at m = 2 the number of lines through -R meeting
        D twice; two distinct members of Gamma_D share at most two points of
        E.
      status: provable_elementary
      proof_route: >-
        Riemann-Roch l(4O) = 4 and Abel (proposal mechanism (6)); standard;
        derived in-record, unreviewed.
      proves_too_much_control: >-
        Composite-order curves, where -R and the group law still work but
        the prime-order identities elsewhere do not; run only as a nearby
        object if at all.
      settled_by: null
    - id: INV-5k
      statement: >-
        The k-rich target mass obeys (number of r with c_D(r) >= k) <=
        N mu Delta/(k - mu)^2 for k > mu (Chebyshev on INV-2); the recalled
        finite-field incidence bounds applied to (E(F_p), Gamma_D) at M of
        order N give nothing beyond Markov (M/k) for k < N^{1/2}, so
        incidence geometry is NOT a proof route for cluster mass in the
        index-calculus regime.
      status: provable_elementary
      proof_route: >-
        Chebyshev; the incidence audit in proposal mechanism (6) with
        KN-TECH-010's form; derived in-record, unreviewed. The seed sketch's
        proof-route claim is withdrawn by this audit.
      proves_too_much_control: >-
        Z/N interval, with peak counts of order B^2/8 that Chebyshev must
        (and does) permit.
      settled_by: null
    - id: INV-6
      statement: >-
        Sigma_m(D) = Sigma_{m-1}(D) + D and m c^{(m)}(r) >= sum_{d in D}
        c^{(m-1)}(r - d), with equality iff no contributing multiset repeats
        an element; a message-passing model on translation-by-D edges
        computes this convolution.
      status: provable_elementary
      proof_route: >-
        Counting (d, A minus d) pairs (proposal mechanism (7)); derived
        in-record, unreviewed.
      proves_too_much_control: >-
        None; it is the trivial cluster a learned model must be scored
        against, not a discovery.
      settled_by: null
    - id: INV-7
      statement: >-
        At m = 2 on a prime-order curve, P_V[R decomposes] =
        1 - C(n - b, b)/C(n, b) with n = (N - 1)/2 and b = B/2 classes, and
        c(R) follows the runs distribution.
      status: provable_elementary
      proof_route: >-
        Proved in-record in IDEA-20260906-86cd30 (path graph, independent
        sets), unreviewed there; symbolic-regression recovery control here.
      proves_too_much_control: Even-order curves and m = 3, as IDEA-20260906-86cd30 states.
      settled_by: null
    - id: INV-8
      statement: >-
        Semi-regular reference degree d_reg = ceil((m(B - 1) + D_S)/2) for
        the Semaev system (ledger reference IDEA-20260808-093497, not opened
        by the proposal).
      status: conjecture
      proof_route: >-
        Conditional on semi-regularity (a heuristic, not a theorem); listed
        only as the degree-side symbolic-regression recovery control of
        RQ-RELN-61638a; not about c_D and not re-derived here.
      proves_too_much_control: >-
        Systems with measured degree fall (EV-DREG series as relayed by the
        RQ), where the formula is known to over-predict.
      settled_by: null
    - id: INV-9
      statement: >-
        Delta(D) >= {mu}(1 - {mu})/mu for every base, with equality iff the
        counts differ by at most one; for mu <= 1 this is Delta >= 1 - mu
        with equality iff D is a B_m set; at the frozen B_1 convention
        mu > 1 and no B_3 set of that size exists.
      status: provable_elementary
      proof_route: >-
        Convexity of the sum of squares at fixed total (proposal mechanism
        (9)); derived in-record, unreviewed; corrects the seed sketch's
        unconditional 'equality iff B_m'.
      proves_too_much_control: >-
        Any base at mu > 1, where the floor is strictly below 1 - mu (which
        is negative) and the Sidon reading is void.
      settled_by: null
    - id: INV-10
      statement: >-
        The Z/N interval base [1, B] at m = 3 has E_3 =
        (11/720) B^5 (1 + O(1/B)) and Delta = (11/120) B^2 - mu + O(B); its
        integer value is exactly computable and is the battery's positive
        control.
      status: provable_elementary
      proof_route: >-
        Irwin-Hall convolution (proposal mechanism (8)); the exact value by
        enumeration in the integers; derived in-record, unreviewed, with the
        constant 11/20 recalled.
      proves_too_much_control: A random base at the same B, with Delta about 1.
      settled_by: null

