hypothesis:
  id: H-ECDLP-c48f2a
  question_id: RQ-ECDLP-c1b7b1
  goal_id: GOAL-ECDLP-001
  added: '2026-09-21'
  derived_from_hypothesis: H-ECDLP-09125b
  derived_from_idea: IDEA-20260911-2dd68d
  instrument_idea: IDEA-20260905-dacf4f
  amendment_ref: experiments/EXP-ECDLP-e36df2/amendments/v1_to_v2_new_curve_extension.yaml
  statement: >-
    THIS IS A NEW, SEPARATELY SCOPED SIBLING OF H-ECDLP-09125b, NOT AN
    EXTENSION OF ITS ALREADY-DECIDED EVIDENCE BASE. H-ECDLP-09125b's own
    24+4-instance pooled statistic is closed (DEC-20260912-2a626b, support,
    strong) and is not reopened, reweighted, or pooled with anything here;
    see experiments/EXP-ECDLP-e36df2/amendments/v1_to_v2_new_curve_extension.yaml
    for why this is a separate record rather than an addition to that one.
    SCOPE: applies the IDENTICAL repaired test design H-ECDLP-09125b froze
    (m=1-tautology exclusion; explicit pre-registered cross-prime +-1
    degeneracy screen; N_i=ceil(20*p_i) with mu0_target=20; two
    independently realized non-homomorphic contrast sections s_x, s_y; a
    seeded null-object control s_rand) to exactly ONE new, genuinely
    randomly-selected (non-engineered) curve, chosen by the identical
    seeded procedure and criteria as the original six curves (integer A,
    small-integer point (x0,y0), B fixed so the point is exact by
    construction, nonsingular, infinite order up to the m-ladder; p in
    [2**10,2**14), good ordinary reduction, gcd(n,p)=1, #E(F_p) != p) but
    under a NEW seed (20260921) distinct from the two seeds already used
    (20260905, 20260911), assigned curve_idx=6 and its own 4 reduction
    primes. CLAIM: this new curve's own 4 (curve,prime) instances, pooled
    ONLY among themselves (never with H-ECDLP-09125b's closed 24+4-instance
    pool), will show pooled agreement-rate ratios rho_hat_x, rho_hat_y
    whose 95% exact-Poisson CIs are consistent with 1 and exclude any value
    >= 3, jointly with a one-sided Poisson test at alpha=0.01, exactly as
    H-ECDLP-09125b's own claim states for its instance set -- i.e. this
    hypothesis predicts the SAME "no systematic linearity" reading extends
    to this one additional, independently selected curve. s_rand must again
    read as chance (95% CI contains 1) as the validity control on the
    statistic and null model.
  mechanism: >-
    Identical mechanism to H-ECDLP-09125b (restated, not re-derived):
    KN-TECH-73630e's uniqueness-of-the-homomorphic-section theorem licenses
    treating s_x, s_y, s_rand as non-homomorphic on any curve/prime
    instance meeting the stated criteria, and Q's only roots of unity being
    +-1 fixes the Teichmuller-lift degeneracy set at exactly {+-1} for any
    coordinate of any curve, not merely the six already tested. This
    hypothesis therefore predicts NO curve-specific exception: the same
    null reading H-ECDLP-09125b found on six curves is predicted to hold on
    a seventh, independently selected one, precisely because the mechanism
    licensing it (KN-TECH-73630e plus the archimedean-absolute-value
    argument) makes no reference to which curve is tested. A different
    outcome on this one new curve would not indict the mechanism outright
    (a single unreplicated instance set cannot do that, per AGENTS.md's
    single-run reject_scoped prohibition) but would be a genuine, reportable
    open confound calling for replication before any broader claim.
  assumptions:
    - >-
      Good ordinary reduction, gcd(n,p)=1, #E(F_p) != p at every tested
      instance, exactly as H-ECDLP-09125b's and EXP-ECDLP-a26bde's scope;
      the new curve's 4 reduction primes are generated and filtered by the
      same seeded procedure (curves.py-equivalent) with the same criteria,
      under seed 20260921.
    - >-
      Reduction mod p^K commutes with the elliptic-curve group law (a
      standard ring-homomorphism fact, not a heuristic); unchanged from
      H-ECDLP-09125b.
    - >-
      Q's only roots of unity are +1 and -1 (elementary, not a heuristic);
      unchanged from H-ECDLP-09125b.
    - >-
      KN-TECH-73630e's uniqueness theorem is taken as proven (not
      re-derived); unchanged from H-ECDLP-09125b.
    - >-
      The new curve, once selected by the seeded search, is NOT engineered
      or hand-picked for any coincidence (unlike the m=2 positive control);
      it is an ordinary instance of the same random-search family that
      produced the original five global curves, so no positive-control-style
      screen-catch is predicted or required of it.
  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
    not_applicable_reason: >-
      Identical to H-ECDLP-09125b: an empirical measurement/control
      repeat-at-one-new-instance, not a proof-oriented claim; the proof
      architecture gate (docs/inventor-protocol.md section 8) does not
      apply. No theorem is proved or claimed here.
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    Explicitly null, mirroring H-ECDLP-09125b and H-ECDLP-6a9479: this is a
    single-additional-instance statistical repeat of one contrast-arm test,
    not a complexity claim of any kind.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For a non-homomorphic contrast section s (s != t at generic points,
        by KN-TECH-73630e), the digit d(s(mS)) behaves, over the tested
        m-ladder, as an approximately uniform, approximately independent
        draw from Z/pZ, so P(d(s(mS)) = m*d(s(S)) mod p) ~= 1/p per
        non-degenerate trial. Identical statement to H-ECDLP-09125b's H1,
        now tested on one additional, independently selected curve.
      random_model_justification: >-
        Same modeling choice as H-ECDLP-09125b's H1; not re-derived.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-e36df2]
      falsification_condition: >-
        s_rand's own measured rho_hat (on this new curve's 4 instances
        alone) departs from chance (its 95% CI excludes 1); additionally,
        per-instance chi-square goodness-of-fit of the empirical digit
        distribution against Uniform(Z/pZ) for s_x and s_y, reported
        alongside the main statistic.
    - id: H2
      statement: >-
        A multiple m for which x(mS) mod p_i (or y(mS) mod p_i) lies in
        {1, p_i-1} SIMULTANEOUSLY for every one of this curve's 4 tested
        primes has probability ~(2/p_avg)^3 of being an accidental
        multi-prime coincidence rather than a genuine global rational
        identity. Identical statement to H-ECDLP-09125b's H2, now tabulated
        on one additional curve's own 4 primes.
      random_model_justification: >-
        Same CRT-flavored equidistribution heuristic as H-ECDLP-09125b's H2.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-e36df2]
      falsification_condition: >-
        The empirical per-prime base rate of x(mS) mod p_i in {1,p_i-1} on
        this new curve's ladder is inconsistent with ~2/p_i, or a
        screen-flagged multiple small enough for exact verification turns
        out NOT to be exactly +-1.
  structural_ingredients:
    - description: >-
        Uniqueness of the homomorphic prime-to-p torsion section (any other
        section is automatically non-homomorphic).
      citation: KN-TECH-73630e
      provenance: internal
      verified_by: claude-code-session 2026-09-21 (read H-ECDLP-09125b in full, this dispatch; re-cites without re-deriving)
      role: licenses treating s_x, s_y, s_rand as non-homomorphic on the new curve without a separate per-instance proof
    - description: >-
        The repaired test design, its power justification, and its
        already-decided reading on the original six curves, which this
        record extends by exactly one further curve rather than restates.
      citation: H-ECDLP-09125b
      provenance: internal
      verified_by: claude-code-session 2026-09-21 (read in full, this dispatch)
      role: the record this hypothesis is derived from and explicitly does not reopen
    - description: >-
        The 28-run, strong-strength support decision and its rationale for
        why this new curve's data is scoped separately rather than pooled.
      citation: DEC-20260912-2a626b
      provenance: internal
      verified_by: claude-code-session 2026-09-21 (read in full, this dispatch)
      role: establishes the closed status this record must not disturb
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: teichmuller_x_new_curve_rate_ratio (s_x, post m=1 and post cross-prime-degeneracy exclusion, pooled over exactly this new curve's 4 instances)
      direction: different
      minimum_effect: >-
        95% CI for rho_hat_x contains 1.0 and its upper bound is strictly
        below 3.0 (indistinguishable from chance).
    - metric: teichmuller_y_new_curve_rate_ratio (s_y, independently-realized construction, identical statistic)
      direction: different
      minimum_effect: >-
        Same band as s_x (CI contains 1.0, upper bound < 3.0), AND required
        to agree in verdict with rho_hat_x; a split verdict is reported as
        an open confound on this one new curve, not resolved by either
        reading alone.
    - metric: random_control_new_curve_rate_ratio (s_rand, seeded pseudorandom-digit null object, same statistic)
      direction: different
      minimum_effect: >-
        95% CI for rho_hat_rand contains 1.0. A CI excluding 1.0 means the
        null model or the s_rand implementation itself is broken on this
        instance, invalidating any reading of rho_hat_x / rho_hat_y here
        until fixed -- identical control logic to H-ECDLP-09125b.
  test_boundary:
    instances:
      - >-
        Exactly one new curve, selected by the identical seeded procedure
        and criteria as the original six curves (curves.py-equivalent
        `_candidate_curves` / `_find_primes_for_curve`), under seed
        20260921 (distinct from 20260905, 20260911), assigned curve_idx=6,
        with 4 reduction primes in [2**10,2**14).
    parameters:
      m_ladder_per_instance: "m = 2..N_i+1 (skipping n | m), N_i = ceil(20 * p_i); m=1 computed once as the baseline, outside the loop"
      alpha: 0.01
      minimum_resolvable_effect: 3x chance rate
      mu_0_target: 20
      note_on_power: >-
        mu0_target=20 per instance already gives power >= 0.90 to resolve a
        3x effect at alpha=0.01 (H-ECDLP-09125b's own power justification,
        unchanged); pooling this curve's 4 primes (mu0 ~ 80 pooled) only
        increases power further, so this new curve's own statistic is
        adequately powered on its own terms despite the much smaller
        instance count than the closed 24+4-instance pool.
    implementation: >-
      The EXISTING v1 driver under experiments/EXP-ECDLP-e36df2/driver/,
      reused unmodified (per PA-ECDLP-e36df2-v1-to-v2:
      scientific_parameters_changed: false); only the curve/prime selection
      inputs are new.
    budget:
      wall_clock_seconds_per_run: null
      total_cpu_hours: 3
      maximum_memory_gb: 6
      maximum_runs: 4
  falsification_conditions:
    - >-
      rho_hat_x's or rho_hat_y's 95% CI has a lower bound >= 3, jointly
      with a one-sided Poisson p < 0.01, with s_rand passing: a real,
      resolvable excess on THIS ONE new curve. Per AGENTS.md, a single
      unreplicated empirical-only run set may not itself support
      `reject_scoped`; the correct decision on such a result is `weaken`
      plus a replication run on a second independently-selected new curve,
      not an outright falsification of claim (3) or of H-ECDLP-09125b.
    - >-
      s_rand's 95% CI excludes 1.0 on this new curve's instances: the
      chance-level null model or its implementation is broken FOR THIS
      INSTANCE SET; instrument invalidation, not a verdict either way.
    - "Crashes, timeouts, memory exhaustion at any stage: infrastructure, never negative mathematical evidence (AGENTS.md rule 5)."
    - >-
      The new curve's own seeded candidate-curve search or prime search is
      exhausted without finding a valid instance within a generous budget:
      a design/infrastructure defect, reported as such, not a finding.
  interpretation_limits:
    - >-
      Toy tier: one curve, 4 (curve,prime) instances, primes in
      [2**10,2**14). No transfer to cryptographic scale claimed or
      implied.
    - >-
      This record's evidence is NEVER pooled with, and can never retroactively
      revise, H-ECDLP-09125b's own closed 24+4-instance statistic,
      EV-ECDLP-5b61eb, or DEC-20260912-2a626b, all of which remain immutable
      records of what that separate, already-adjudicated evidence showed.
    - >-
      A single, unreplicated 4-instance run set is explicitly UNDERPOWERED
      to support a program-level conclusion either way beyond "consistent
      with, or an open confound against, chance at this one additional
      curve": any outcome here is scoped to that one curve alone until
      replicated, per AGENTS.md's single-run reject_scoped prohibition.
    - >-
      No attack and no exponent claim anywhere in this record: every
      multiple tested is generated from a global point whose scalar m is
      known to the generator.
    - >-
      This record exists because of an explicit, twice-confirmed user
      request for supplementary data collection beyond the already-decided
      scope of H-ECDLP-09125b, not because of any scientific concern raised
      by that record's own (closed) evidence; see
      experiments/EXP-ECDLP-e36df2/amendments/v1_to_v2_new_curve_extension.yaml
      `reason` for the undiluted statement of why this record exists.
  distinguishable_outcomes:
    - outcome: >-
        Both rho_hat_x and rho_hat_y's CIs contain 1 and exclude any value
        >= 3; s_rand's CI contains 1.
      meaning: >-
        Consistent with H-ECDLP-09125b's own reading extending to this one
        additional, independently selected curve; toy-scale, single-curve
        scope only; does not itself strengthen H-ECDLP-09125b's own already
        `strong` status (that status is closed and immutable), but is a
        legitimate additional data point a future replication-aware
        synthesis could cite.
    - outcome: >-
        rho_hat_x's or rho_hat_y's CI has a lower bound >= 3 with p < 0.01,
        with s_rand passing.
      meaning: >-
        An open confound on this one new curve; per AGENTS.md, decided at
        most as `weaken` pending replication, never `reject_scoped` on this
        single run set, and does not itself reopen or falsify
        H-ECDLP-09125b's closed evidence.
    - outcome: rho_hat_x and rho_hat_y disagree in verdict.
      meaning: Reported as an open, unresolved confound on this one curve; no verdict either way.
    - outcome: s_rand's CI excludes 1, or the seeded search is exhausted without a valid instance.
      meaning: Instrument or infrastructure defect; not a verdict on this hypothesis's claim.
    - outcome: Crashes, timeouts, memory exhaustion at any stage.
      meaning: Infrastructure failure; never negative mathematical evidence (AGENTS.md rule 5).
  prior_evidence_refs:
    - H-ECDLP-09125b
    - EV-ECDLP-5b61eb
    - DEC-20260912-2a626b
    - KN-FIND-e8cfdc
  status: proposed
  status_note: >-
    Newly authored 2026-09-21 by the Coordinator per explicit, twice-confirmed
    user request for supplementary curve/prime extension beyond
    H-ECDLP-09125b's closed scope. No evidence has been collected against
    this record yet; TASK-20260921-9b17e4 dispatches the executor to select
    the new curve, generate its primes, and run the 4 new instances
    (RUN-ECDLP-e36df2-029..032) under EXP-ECDLP-e36df2 v2 (see
    experiments/EXP-ECDLP-e36df2/amendments/v1_to_v2_new_curve_extension.yaml).
  proposed_by: coordinator
  specified_by: coordinator, 2026-09-21, per explicit user request (protocol_amendment PA-ECDLP-e36df2-v1-to-v2)
