hypothesis:
  id: H-ECDLP-3ffc94
  question_id: RQ-JINV-8fc13a
  title: >-
    The special-j support drop is a property of the depressed short-Weierstrass
    normalisation and not of the curve, so it vanishes under the one model
    change every curve over F_p with p greater than 3 admits, namely a
    translation of the x-line; and because a sparse polynomial densifies under
    translation whether or not it came from a curve, the finding requires a
    curve-free null before it may be called a statement about elliptic curves
  statement: >-
    Source proposal IDEA-20260811-d7856a (RQ-JINV-8fc13a, class representation).
    (A) THE ONE MODEL CHANGE THAT ALWAYS EXISTS. Montgomery form requires a
    rational point of order 2, Edwards a point of order 4, Hessian a point of
    order 3, Jacobi quartic a rational 2-torsion point. None of these is
    guaranteed for a curve on a degeneration locus, so a naive model comparison
    silently conditions on torsion and compares non-comparable subfamilies. The
    affine translation x -> x + c is available for every curve, every c and
    every p greater than 3; it carries y^2 = x^3 + ax + b to
    y^2 = x^3 + 3c x^2 + (a + 3c^2) x + (b + ac + c^3), and it changes the
    factor-base window by a translation and nothing else.
    (B) THE PREDICTION, WITH A DIRECTION AND A NUMBER. Define D(c) as the
    support of S_3 for a generic curve in the translated coordinate minus the
    support of S_3 for a curve on a degeneration locus in the same translated
    coordinate. RE-DERIVED IN THIS COORDINATOR SESSION RATHER THAN TAKEN ON
    TRUST: writing S_3 as (x1 - x2)^2 x3^2 - 2((x1 + x2)(x1 x2 + a) + 2b) x3 +
    (x1 x2 - a)^2 - 4b(x1 + x2) and expanding gives exactly 13 monomials;
    setting a = 0 removes the four monomials x1 x3, x2 x3, x1 x2 and the
    constant, leaving 9; setting b = 0 removes x3, x1 and x2, leaving 10. So
    D(0) = 4 at the a = 0 locus and 3 at the b = 0 locus, and the frequently
    quoted 30.8 percent is exactly 4/13. PREDICTION: D(c) = 0 for every
    non-zero c, because the vanishing coefficient blocks are blocks of the a-
    and b-graded coefficients of the DEPRESSED cubic, and a translation
    reintroduces an x^2 term and redistributes them.
    (C) THE CURVE-FREE OBLIGATION, WHICH THE SOURCE PROPOSAL DOES NOT CARRY.
    A sparse polynomial densifies under a translation of its variables whether
    or not it is a summation polynomial and whether or not any elliptic curve
    is involved. The predicted null difference is therefore reproducible by a
    non-curve object, and under the standing scope constraint a curve-free null
    is REQUIRED before D(c) = 0 may be read as a statement about elliptic
    curves rather than about sparse polynomials.
    (D) THE INTERPRETIVE CONSEQUENCE. If D(c) = 0 for c non-zero AND the
    curve-free null behaves differently, the special-j support phenomenon is a
    statement about the canonical normalisation and the object's correct name
    is "the degeneration divisor of the depressed short-Weierstrass
    x-coordinate", a strictly weaker object that every future citation must
    carry. If D(c) = 0 and the curve-free null ALSO densifies identically, the
    conclusion is weaker still and is about sparse polynomials, not curves.
  mechanism: >-
    Support is not an invariant of a polynomial; it is an invariant of a
    polynomial together with a choice of coordinates. The depressed short
    Weierstrass model is a canonical choice, which is why the divisor is well
    defined on the j-line at all. But a solver chooses its own coordinates, and
    translating the x-window is exactly the freedom an implementation has. The
    mechanism predicted is that the degeneration lives entirely in the a2 = 0
    normalisation and is destroyed by the smallest departure from it, making it
    a real fact about a canonical form and a non-fact about any algorithm.
    Under the shift the j = 0 condition itself is preserved exactly, since
    c4 = a2^2 - 3 a4 equals 9c^2 - 9c^2 = 0 for the shifted a = 0 curve, so
    the shifted special curve is still a j = 0 curve and the comparison is not
    trivially destroyed by moving off the locus. What changes is the
    normalisation, not the curve.
  assumptions:
    - p greater than 3, so the depressed form and the translation both exist.
    - >-
      The S_3 support values 13, 9 and 10 are correct. THEY WERE RE-DERIVED BY
      HAND IN THIS COORDINATOR SESSION FROM THE STANDARD S_3 EXPRESSION AND
      AGREE. They also appear in the committed record H-JINV-0e8819's statement
      field, which describes them as derivations made by hand in a parent
      proposal and not as measurements; that record's own interpretation_limits
      say so. The contract therefore treats them as a derivation to be
      reproduced symbolically, not as committed measured data.
    - >-
      THE m = 4 BASELINE IS UNANCHORED AND IS SCOPED OUT OF THE PRIMARY ARM.
      The source proposal's baseline gate requires reproducing a support of 439
      with an eight-block stratification 391 / 403 / 433 / 433 / 435 / 438 for
      S_4. A CONTENT SEARCH by this coordinator session, matching the literal
      token 439 across every YAML file in the repository rather than listing
      filenames, returned those values only inside sibling ideation proposals of
      the same 2026-08-11 batch and inside no hypothesis, evidence, experiment
      or decision record. A content search of that shape WOULD have found the
      value in a goal record sharded under a directory, or in a question stored
      at the ledger root rather than under ledger/questions, so this is a
      checked absence rather than an inference from a directory listing; it
      remains scoped to YAML files on this worktree's branch. They
      are therefore not committed measurements, and the S_4 arm is demoted to
      exploratory with its own self-contained baseline rather than gated on
      numbers that cannot be resolved to a committed source.
    - >-
      The translated polynomial is obtained by direct substitution
      x_i -> x_i + c into the depressed S_m, which is provably the same system
      re-expressed, and this route is used in preference to a published
      general-model construction so that the identity is a theorem rather than
      a citation.
  proof_search_map:
    bottleneck: >-
      The definition of the object. Until the divisor is shown to be
      coordinate-covariant in a stated way, every downstream statement about
      special j is ambiguous between a curve property and a normalisation
      property.
    baseline_embedding:
      parameter_slice: >-
        c = 0, which must return support 13 for the generic curve, 9 at a = 0
        and 10 at b = 0, as re-derived above.
      reproduction_check: >-
        Symbolic re-derivation at c = 0 through the same substitution machinery
        used for non-zero c, so the machinery itself is proved to be a no-op at
        c = 0.
    observation_collision:
      observable: The monomial support count in a chosen coordinate.
      distinct_preimage_search: >-
        PERFORMED, POSITIVE, AND IT IS THE FINDING. Under the predicted outcome
        the special curve and the generic curve share the observable at c
        non-zero while differing in the underlying object; that collision
        directly falsifies the identifiability of special j FROM SUPPORT ALONE,
        and the separating condition is precisely the a2 = 0 normalisation.
        A SECOND COLLISION IS ADDED HERE AND IS THE REASON FOR THE CURVE-FREE
        NULL: a sparse polynomial with no curve behind it produces the same
        observable under the same substitution.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the curve fixed and vary the forgotten structure, namely the
          coordinate c. The fibre of the support map over a given curve is a
          function of c and its non-constancy is the demotion.
        predicted_gain: >-
          Converts an ambiguity into a named scope qualifier every future
          citation must carry.
    quantifier_order: >-
      FOR ALL curves E on a degeneration locus and FOR ALL c not equal to 0,
      the support of S_3 in the coordinate x + c equals the generic value. The
      breaking existential is THERE EXISTS a locus whose drop survives all
      translations, which would make the divisor intrinsic. The quantifier is
      over c, a quantity the ALGORITHM chooses, which is why a c-dependent
      property cannot be an attack surface.
    method_ceiling:
      strongest_certifiable_claim: >-
        That the S_3 support drop is or is not invariant under the translation
        subgroup of coordinate changes, exactly, at the tested loci and primes.
        It CANNOT certify invariance under the full groupoid of admissible
        model changes, because most of those changes do not exist for most
        curves, which is limb (A) of this hypothesis.
      nearby_object_control: >-
        The singular-locus dimension of the same system, which IS invariant
        under any change of coordinates. Running both on the same curves and
        finding that support moves while the singular locus does not is the
        clean demonstration that the method has identified the coordinate as
        the load-bearing structure; finding that both move together refutes the
        mechanism.
    proof_obligations:
      - claim: c = 0 reproduces 13, 9 and 10 through the substitution machinery.
        responsibility: baseline
      - claim: D(c) = 0 for all non-zero c.
        responsibility: correctness
      - claim: The translated polynomial is the same system re-expressed.
        responsibility: interface
      - claim: The generic support strictly increases under a non-zero shift.
        responsibility: strictness
      - claim: A curve-free sparse polynomial reproduces or fails to reproduce
          the same densification.
        responsibility: scope
      - claim: The torsion condition for each alternative model is tested per
          curve and never assumed.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: null
    prior_best: null
    time_exponent: null
    memory_exponent: null
    hidden_cofactor: null
    claim_kind: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        No distributional heuristic is load-bearing. The primary computation can
        be performed with c as a symbolic indeterminate over Q[a,b,c], in which
        case the result is a theorem about all c at once and the sampled c are
        redundant.
      random_model_justification: >-
        Polynomial substitution and expansion are exact operations, and support
        computed in the c-indeterminate ring specialises correctly to any
        particular c outside the finitely many values where a coefficient in c
        vanishes.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-dd166b]
      falsification_condition: >-
        The symbolic-in-c computation and a sampled-c computation disagree at
        any sampled c, which would mean the substitution machinery is not
        implementing the same operation in the two routes.
    - id: HEUR-002
      formal_statement: >-
        The set of c at which a coefficient of the c-indeterminate expansion
        vanishes is finite with cardinality at most the total degree of that
        coefficient in c, so a sample of 20 uniform random c in F_p misses it
        with probability at least 1 minus 20 d / p for the degree bound d.
      random_model_justification: >-
        Schwartz-Zippel applied to the coefficient polynomials in c, with d
        bounded by the total degree of S_m in the x variables, which is 4 at
        m = 3.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-dd166b]
      falsification_condition: >-
        A sampled c at p = 4001 lands on a coefficient vanishing locus more
        often than the bound permits over the declared sample, which would mean
        the sampler is not uniform.
  structural_ingredients:
    - description: >-
        The committed statement that S_3 carries exactly 13 monomials, 9 at
        a = 0 and 10 at b = 0, with per-variable degree 2 and total degree 4 in
        every case, and that the specialised m = 2 system has identical support
        on j = 0, j = 1728 and generic curves.
      citation: H-JINV-0e8819
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-3baed3, read ledger/hypotheses/H-JINV-0e8819.yaml
        statement and interpretation_limits in full, and independently
        re-derived the counts 13, 9 and 10 by expanding S_3 by hand. The record
        itself labels these as derivations made in a parent proposal rather
        than measurements, and that label is carried forward here.
      role: baseline support values the instrument must reproduce at c = 0
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: support_drop_D_of_c_at_nonzero_shift_S3
      direction: lower
      minimum_effect: >-
        EXACTLY 0 for every non-zero c tested, at both the a = 0 and the b = 0
        locus. A residual drop of even one monomial at any c is a
        pre-registered positive and is the falsifying outcome.
    - metric: generic_support_growth_under_shift_S3
      direction: higher
      minimum_effect: >-
        The generic support must rise strictly above 13 and can never exceed
        23, which is the exact size of the ambient monomial set for S_3 under a
        translation: exponent triples with each exponent at most 2 and total
        degree at most 4 number 27 minus 4, the four excluded being (2,2,2) and
        the three permutations of (2,2,1). A measured generic support of
        exactly 13 means the substitution is a no-op and every zero difference
        in the run is meaningless; a measured value above 23 means the
        substitution is not preserving the degree bounds and the implementation
        is wrong.
    - metric: curve_free_null_densification
      direction: different
      minimum_effect: >-
        Reported with a PRE-STATED CONSEQUENCE. A random polynomial supported
        on the 13-monomial set with a random 4-monomial block deleted, put
        through the identical substitution. If it densifies to the same ambient
        size as the curve arms, then D(c) = 0 is a fact about sparse
        polynomials under translation and NOT about elliptic curves, and the
        conclusion must be written that way. If it does not densify, the
        densification is specific to the summation polynomial's coefficient
        structure and the curve-bound reading is available.
    - metric: fraction_of_special_j_curves_admitting_a_montgomery_model
      direction: different
      minimum_effect: >-
        Reported, not predicted, per curve per prime. This is the eligibility
        record for the exploratory alternative-model arm and it exists to
        prevent that arm being read as a matched comparison.
    - metric: c_threshold_structured_shifts
      direction: different
      minimum_effect: >-
        Reported: the number of distinct non-zero c at which D(c) = 0, out of
        at least 20 seeded random c per curve plus the structured choices
        c = 1, c = -1 and c a root of the curve cubic. The last is named in
        advance because it is the one shift with a geometric meaning, moving a
        2-torsion x-coordinate to the origin, and is the most likely place for
        the prediction to fail.
  test_boundary:
    instances:
      - one curve per degeneration locus at each of p in {4001, 65537, 1048583}
      - one generic control curve per prime, paired at the SAME c
      - symbolic computation over Q[a,b,c] attempted first at every locus
    parameters:
      m: 3 primary, 4 exploratory
      shifts: [0, 1, -1, root_of_cubic_if_rational, 20 seeded random c]
      expansion_convention: fixed and hashed before the first non-zero shift
    implementation: >-
      Exact symbolic algebra. No sampling of points for the support metric, no
      timing, no floating point.
    budget:
      wall_clock_seconds: 1800
      memory_gb: 8
      maximum_runs: 12
  falsification_conditions:
    - >-
      D(c) stays non-zero for all tested non-zero c at any locus. The divisor
      is translation-invariant, hence a genuinely intrinsic feature, this
      hypothesis's central prediction is falsified, and that is the most
      valuable available outcome.
    - >-
      The generic support does not grow under a non-zero shift. The
      substitution is a no-op and every zero difference is meaningless.
    - >-
      The semantic check fails, i.e. a known decomposition of a random point
      does not satisfy the translated relation. The translated polynomial is
      not the same relation and no support comparison is admissible.
    - >-
      c = 0 fails to reproduce 13, 9 and 10 through the substitution machinery.
      The instrument disagrees with a derivation this session verified by hand.
    - >-
      D(c) is non-zero for exactly the shift by a root of the curve cubic and
      zero otherwise. The phenomenon is tied to 2-torsion rather than to the
      j-line, which is a different object and must be reported as such. It is
      named in advance so it cannot be discovered and then rationalised.
    - >-
      The curve-free null densifies exactly as the curve arms do. The finding is
      then about sparse polynomials under translation and may not be reported
      as a statement about elliptic curves, special j, or the ECDLP.
  interpretation_limits:
    - >-
      A confirmed prediction demotes the divisor to a property of the depressed
      normalisation. It does NOT show the divisor is uninteresting, since it
      remains an exact, p-independent, checkable fact about a canonical form,
      and it does not retroactively invalidate any support derivation, all of
      which were correctly taken in that normalisation.
    - >-
      Translations are a subgroup, not the full model-change groupoid.
      Invariance under translation would NOT prove intrinsicness;
      non-invariance DOES prove non-intrinsicness. Only one direction is
      conclusive and the asymmetry is stated rather than glossed.
    - >-
      THE m = 4 BASELINE IS NOT ANCHORED IN THIS PROGRAM. The 439 support count
      and its eight-block stratification were not resolved by this session, via
      a content search for the literal token across every YAML file rather than
      a filename listing, to any committed hypothesis, evidence, experiment or
      decision record; they appear only in sibling proposals of one ideation
      batch. That search would have reached sharded goal records and questions
      stored at the ledger root, so the absence is checked rather than inferred,
      and it is scoped to YAML files on this branch. The S_4 arm is
      therefore exploratory, carries its own self-derived baseline, and may not
      be reported as reproducing a committed value.
    - >-
      The frequently quoted pairing of a 30.8 percent support drop with a
      -0.44 percent timing change is used nowhere in this hypothesis. The
      30.8 percent is verified here as exactly 4/13; the -0.44 percent timing
      figure was NOT located by this session in any ledger record and is not
      relied on by any prediction, control or falsification condition.
    - >-
      claim_tier toy. No attack, no exponent, no speedup, and no algorithmic
      comparison is made, so the confounder that a shift changes the
      factor-base window is not incurred here and must not be incurred by any
      careless extension of this design.
  status: proposed
  proposed_by: idea-generator
