    "title": "Frobenius orbit ideals versus the complete trace-zero index-calculus pipeline",
    "statement": "Audit source armA disjointness/equivariance/invariant-degree predictions without assuming x-only freeness, and test all source armB density, relation-yield, full-cost slope and rho predictions on the exact ladder with complete scalar recovery.",
    "mechanism": "ARM A rests on two facts. First, S_{m+1} for a curve over F_q has F_q-coefficients, so Frobenius on the coordinates commutes with the descended system up to relabelling the target; this is why the object's n descended equations are the n cyclic shifts of ONE polynomial in the normal basis while the null's are n genuinely different conjugates. Second, a free action of a group of order n on a finite solution set divides the count by n and nothing else; the orbit system has n times the solutions of I_R, so the quotient has the same number, and the price of describing the quotient is the invariant ring, whose generators reach degree n. No degree can be saved by a symmetry that permutes n copies of the same problem. ARM B rests on the splitting of the Weil restriction of a subfield curve up to isogeny as E x T_n over F_q, so the prime-order subgroup lives in a variety one dimension smaller than on the null; Gaudry's abelian-variety index calculus is a statement about the dimension of the variety the factor base lives in, so the exponent moves with the dimension. The Frobenius is exploited twice in arm B and only as constants in arm A. The trace condition Tr(P) = O on a point with x(P) in V_2 is a single F_q-codimension-one condition (T_n(F_q) has index about q in E(F_{q^n})), so the factor base {P in T_n with x(P) in V_2} for a 2-dimensional V_2 has about q points and one free dimension, which is what Gaudry's algorithm needs.",
    "assumptions": [
