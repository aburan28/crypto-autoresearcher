hypothesis:
  id: H-ECDLP-6c52c0
  question_id: RQ-ECDLP-002
  title: >-
    The comparator this program scores candidates against is the S = O(1) corner
    of a preprocessing tradeoff whose achievability is ALREADY PUBLISHED in this
    repository's own KN-LIT-013; the open question is not whether the frontier
    exists but whether the corpus's thresholds are stated against it, and the
    discriminating measurement is at sigma = 1/3, NOT at the sigma = 0
    calibration a rival law passes identically
  statement: >-
    Source proposal IDEA-20260806-3b91c7 (RQ-ECDLP-002, class cost-model). THE
    SOURCE PROPOSAL IS NOT EDITED BY THIS RECORD and remains `proposed`.

    (A) A PRIOR COORDINATOR DECISION ALREADY REFUTED HALF OF THE SOURCE
    PROPOSAL AND THAT REFUTATION IS BINDING INPUT HERE, NOT A REDESIGN.
    DEC-20260806-8f7e4f records the verdict
    `novelty_framing_refuted_comparator_question_retained` against
    IDEA-20260806-3b91c7, on the ground that knowledge/literature/KN-LIT-013.md -
    the source_ref of KN-TECH-005 - already states that a construction achieves
    S*T**2 ~ N and that with advice the online cost can beat the classic
    sqrt(N) generic bound, and that the dispatcher confirmed that text at
    source. This hypothesis therefore claims NO NOVELTY WHATSOEVER for the chain
    construction: it is recorded here as a KNOWN construction, cited to
    KN-LIT-013, and the proposal's "the corpus does not hold it" sentence is
    withdrawn. What that decision explicitly RETAINED is the comparator
    question, and that is what this hypothesis is about.
    The same decision also records that the proposal's sigma = 0 calibration,
    which the proposal called its strongest feature and its reason to be ranked
    first, IS NOT DISCRIMINATING - Shoup's rival law passes it identically - and
    that sigma = 1/3 is the discriminating point. That finding is adopted
    verbatim as the design's central constraint.

    (B) THE CLAIM THIS HYPOTHESIS ACTUALLY MAKES, WHICH IS AN AUDIT CLAIM ABOUT
    THIS REPOSITORY AND IS FALSIFIABLE BY READING IT. Every cost comparison in
    this corpus scores a candidate against Pollard rho at 0.886*sqrt(N) group
    operations with O(1) memory, while CHARGING the candidate its own memory.
    Prime-field index calculus is a large-memory algorithm: it stores a factor
    base of size B and a relation matrix with Theta(m*B) nonzeros. Comparing a
    memory-N**beta algorithm against a memory-O(1) baseline on the time axis
    alone is not a Pareto comparison. KN-TECH-005's "Program usage" section
    reduces the whole technique to the convention "B = rho 1/2" and states no
    memory-matched column, which is the shape of the defect. THE CLAIM IS THAT
    NO COMMITTED RECORD IN THIS REPOSITORY STATES A MEMORY-MATCHED COMPARATOR
    COLUMN. IT IS FALSIFIED BY EXHIBITING ONE, and the audit is designed to look
    for one rather than to confirm its absence.

    (C) THE ARITHMETIC CONSEQUENCE, WHICH IS ONE SUBSTITUTION AND IS THE CHEAPEST
    THING IN THE CONTRACT. On the preprocessing frontier S*T**2 = Theta(N) at
    memory S = N**sigma, the memory-matched generic online cost is
    sqrt(N/S) = N**((1-sigma)/2). For point-decomposition index calculus at the
    corpus's recorded two-term optimum B* = N**(1/(m+1)), memory is at least B*,
    so the memory-matched bar is N**(1/2 - 1/(2*(m+1))) rather than N**(1/2).
    The correction to the time exponent is exactly 1/(2*(m+1)), which at
    N = 2**256 is 32.0 bits at m = 3, 25.6 at m = 4, 21.3 at m = 5, 18.3 at
    m = 6 and 16.0 at m = 7. A forced cap follows: any index calculus spends at
    least B time to touch its base and holds at least B memory, so
    non-domination at matched memory requires B <= sqrt(N/B), i.e. B <= N**(1/3).
    THIS MAKES EVERY POSITIVE CLAIM IN THIS PROGRAM HARDER TO MAKE, AND THAT IS
    WHY IT IS WORTH A CONTRACT.

    (D) THE DEBIT, STATED IN THE SAME BREATH AND NEVER SEPARATED FROM (C). The
    offline stage costs Theta(sqrt(N*S)) = N**((1+sigma)/2) >= N**(1/2).
    TOTAL COST (OFFLINE PLUS ONLINE) IS NEVER BELOW N**(1/2) AT ANY SIGMA, SO NO
    ECDLP EXPONENT IS MOVED BY ANYTHING IN THIS RECORD AND NONE IS CLAIMED. The
    correction is legitimate only where the offline cost is genuinely amortized
    across many targets on ONE fixed standardized curve. That is a POLICY, not a
    fact, and the deliverable reports all three policies (per-instance,
    per-curve, per-parameter-set) as separate columns so that no reader is ever
    handed a single number whose validity depends on a policy they did not
    choose.
  mechanism: >-
    KNOWN CONSTRUCTION, CITED NOT CLAIMED. Fix E/F_p, a generator P of a
    prime-order subgroup of order N, and a public pseudorandom r-adding step
    function f with known scalar offsets. OFFLINE, target-independent and
    curve-specific: pick a chain length L, run S deterministic walks of length L
    from random KNOWN multiples of P, store only the S endpoints with their
    known logs. ONLINE, per target Q: walk from Q + [r_0]P under the SAME f;
    because f is deterministic, hitting any point of a stored chain means
    following that chain to its stored endpoint, from which log Q follows by
    subtraction. Coverage is S*L points; a length-L online walk meets it with
    probability about S*L**2/N; distinct chains stop colliding with each other at
    S*L**2 = N. At that boundary memory S = N/L**2, online time Theta(L) =
    Theta(sqrt(N/S)), offline time Theta(S*L) = Theta(sqrt(N*S)), hence
    S*T**2 = Theta(N).
    THE MECHANISM CLAIM OF THIS HYPOTHESIS IS NOT THAT THIS CONSTRUCTION IS NEW.
    KN-LIT-013 records that a construction achieving S*T**2 ~ N exists. The
    mechanism claim is (i) that this repository's committed comparator
    convention does not carry the corresponding memory-matched column, and
    (ii) that a toy implementation of the construction distinguishes the
    frontier law from the rival law at sigma = 1/3, so that the corrected
    comparator rests on a measurement in this program and not only on a
    literature entry whose own record says "Full paper not read".
    WHY THE CHAIN STRUCTURE AND NOT AN ISOLATED TABLE, since this is the step a
    reader most often gets wrong: storing S isolated known-log points gives an
    online hit probability about T*S/N, hence T = N/S and S*T = N, strictly worse
    than S*T**2 = N for every S > 1. The chain trick converts stored POINTS into
    stored COVERAGE, and its ceiling is chain-chain merging at S*L**2 = N.
    WHY THIS IS NOT VAN OORSCHOT-WIENER, which this corpus already holds: vOW
    distributes ONE search and total group operations are invariant, only wall
    time falls. Here the table is built from KNOWN logs BEFORE ANY TARGET EXISTS
    and the online TOTAL group-operation count for a single target falls. The two
    make numerically different predictions for the same measurable quantity,
    which is the discrimination.
  assumptions:
    - >-
      The r-adding walk behaves, for chain coverage and merging, like a random
      function on the subgroup. This is the standard rho heuristic and is KNOWN
      to be imperfect for small r. The sweep MEASURES the departure rather than
      assuming it away, and r is an explicit independent variable for that
      reason.
    - >-
      Memory is counted in GROUP ELEMENTS and the unit is declared before any
      row is filled. Counting in bits leaves the exponents unchanged and moves
      the constants; counting in "table entries of unstated width" licenses no
      comparison at all.
    - >-
      The offline stage is chargeable to a curve rather than to an instance.
      This is a POLICY, not a fact, and it decides whether the correction applies
      at all. It is stated formally as HEUR-PRE-3 so a reader can reject it
      explicitly rather than inherit it.
    - >-
      The corpus's two-term index-calculus optimum B* = N**(1/(m+1)) is QUOTED
      from committed records and is NOT re-derived here. It rests on a mean-yield
      convention whose instance-level error bars are the subject of a different
      contract (EXP-ECDLP-7edfd3). The threshold table is conditional on that
      convention and says so in every row.
  proof_search_map:
    bottleneck: >-
      The RIGHT-HAND SIDE of every threshold inequality in the ECDLP and ICEX
      lanes. Each is of the form (candidate time) < 0.886*sqrt(N), and the
      bottleneck step is the assumption that the baseline holds O(1) memory while
      the candidate is charged N**beta. Removing that assumption changes the
      comparison without touching a single candidate.
    baseline_embedding:
      parameter_slice: >-
        sigma = 0. The construction degenerates to a single chain with
        online time Theta(sqrt(N)) and offline Theta(sqrt(N)), reproducing
        Pollard rho with a correction of exactly zero.
      reproduction_check: >-
        SYMBOLIC: substitute S = 1 into T = sqrt(N/S) and offline = sqrt(N*S);
        both must return Theta(sqrt(N)). FIXTURE: measured median online steps at
        sigma = 0 within 25 per cent of sqrt(pi*N/2) at every realised N.
        DECLARED WEAKNESS, ADOPTED FROM DEC-20260806-8f7e4f AND NOT ARGUED WITH:
        THIS SLICE IS NOT DISCRIMINATING. The rival law "online time is
        Theta(sqrt(N)) at every S", which is what Shoup's bound is read as
        implying by the corpus's own convention, passes this slice identically.
        The slice is retained as an IMPLEMENTATION check and is explicitly
        demoted from the "known-answer edge" role the source proposal gave it and
        used to justify ranking the proposal first.
    observation_collision:
      observable: >-
        The exponent triple (sigma, tau_on, tau_off) = (log_N memory,
        log_N online time, log_N offline time).
      distinct_preimage_search: >-
        COLLISION GUARANTEED AND STATED RATHER THAN HIDDEN. The chain table at
        sigma = 1/3 and a hypothetical index calculus with B = N**(1/3) and an
        O(N**(1/3)) decomposition oracle share the triple (1/3, 1/3, 2/3). The
        triple therefore does NOT identify an algorithm and may NEVER be used to
        argue two algorithms are the same. The separating condition is the SOURCE
        OF THE MEMORY - known-log chain endpoints versus a factor base with
        unknown logs - and every table row must name it.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          Enlarge the comparator family from {rho, BSGS} to the one-parameter
          family {preprocessed chain table at memory N**sigma}, and report every
          threshold in a second, memory-matched column.
        predicted_gain: >-
          The comparator's online time exponent falls by sigma/2, so every
          threshold tightens by exactly that amount; at the two-term optimum,
          by 1/(2*(m+1)). NO CANDIDATE GETS FASTER; the bar rises.
    quantifier_order: >-
      FOR ALL curves E/F_p with prime-order subgroup of order N, FOR ALL sigma in
      [0, 1/3], THERE EXISTS a generic algorithm A_sigma whose offline stage may
      depend on (E, P) but NOT on the target, such that FOR ALL targets Q,
      A_sigma uses N**sigma memory and Theta(N**((1-sigma)/2)) online group
      operations in expectation, under HEUR-PRE-1 and HEUR-PRE-2. The existential
      sits INSIDE the curve quantifier and OUTSIDE the target quantifier, which
      is precisely what "preprocessing per curve, reused across targets" means;
      if it had to sit inside the target quantifier the construction would be
      vacuous, and writing the order down is what checks that it does not.
    method_ceiling:
      strongest_certifiable_claim: >-
        That this repository's committed comparator convention does or does not
        carry a memory-matched column, and that at three toy sizes and four
        memory settings the measured online cost of a known preprocessing
        construction follows N**((1-sigma)/2) rather than N**(1/2). IT CAN NEVER
        CERTIFY that any ECDLP is easier than N**(1/2) in total cost, that index
        calculus does or does not beat the corrected baseline, or that the
        preprocessing lower bound binds index calculus at all - index calculus is
        non-generic and catalogue A1-4 already flags that composition as
        non-binding.
      nearby_object_control: >-
        Apply the identical accounting to the EXTENSION-FIELD setting, where
        index calculus demonstrably works. The corrected baseline must NOT turn
        the known extension-field advantage into a non-advantage. If the
        correction closes that gap, the ACCOUNTING is wrong rather than the lane
        closed, and the audit reports the accounting defect.
    proof_obligations:
      - claim: coverage is (1-o(1))*S*L below the stopping rule
        responsibility: success_probability
      - claim: online hit probability is (1-o(1))*S*L**2/N
        responsibility: success_probability
      - claim: online time Theta(L) and offline time Theta(S*L)
        responsibility: runtime
      - claim: memory Theta(S) group elements, unit declared
        responsibility: memory
      - claim: the recovered log verifies as [k]P = Q under independent code
        responsibility: correctness
      - claim: sigma = 0 reproduces rho, and does NOT discriminate the rival law
        responsibility: baseline
      - claim: total cost is never below N**(1/2) at any sigma
        responsibility: scope
      - claim: no committed record states a memory-matched comparator column
        responsibility: baseline
      - claim: >-
          the achievability of S*T**2 ~ N is KNOWN and cited, not claimed
        responsibility: interface
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: >-
      NOT the ECDLP. The object whose cost is restated is the GENERIC BASELINE
      COMPARATOR for prime-field ECDLP at memory N**sigma on a fixed curve. No
      ECDLP exponent is improved by this record and none is claimed.
    prior_best: >-
      As an ECDLP attack, Pollard rho at 0.886*sqrt(N) group operations with O(1)
      memory, UNCHANGED by this record. As a comparator, the corpus's convention
      is exponent 1/2 at every memory setting.
    time_exponent: >-
      Comparator online (1-sigma)/2, comparator offline (1+sigma)/2, comparator
      TOTAL (1+sigma)/2 >= 1/2 at every sigma. The three are never reported
      apart.
    memory_exponent: >-
      sigma, freely chosen in [0, 1/3], counted in group elements. Above
      sigma = 1/3 the frontier point stops being the binding one and the claimed
      range is capped there.
    hidden_cofactor: >-
      THREE THINGS HIDE HERE AND ARE DISCLOSED. (1) The offline constant is at
      least one group operation per covered point; no cheaper way to build
      coverage than to walk it is known. (2) The online walk performs a table
      lookup or distinguished-point test per step, charged O(1) here but a real
      memory-bandwidth cost that an area-time accounting would charge
      differently. (3) The stopping-rule constant is heuristic (HEUR-PRE-1) and
      may be off by a constant factor either way, moving the crossover in bits
      but not the exponent.
    claim_kind: null
    claim_kind_note: >-
      None of exponent_improvement, cofactor_improvement or constant_factor
      applies: this is a COMPARATOR CORRECTION that improves no algorithm and
      raises a bar. The field is left null rather than mislabelled, and the
      four promotion gates in agents/coordinator.md are NOT in play because no
      asymptotic-complexity claim is being moved toward `supported` by this
      record.
  heuristic_assumptions:
    - id: HEUR-PRE-1
      formal_statement: >-
        MATRIX STOPPING RULE. For the r-adding walk on a prime-order subgroup of
        order N with a public step function, S deterministic chains of length L
        started at independent uniform points cover (1 - o(1))*S*L distinct group
        elements provided S*L**2 <= N, and coverage saturates strictly below
        S*L for S*L**2 >> N.
      random_model_justification: >-
        The random model is a uniformly random function on N points. Two
        independent length-L trajectories of a uniformly random function collide
        with probability Theta(L**2/N), so S chains are pairwise disjoint with
        constant probability exactly when S**2*L**2/N = O(S), i.e. S*L**2 = O(N).
        The RIGOROUS half is that exact occupancy computation; the HEURISTIC half
        is that an r-adding walk on a group behaves like one, which is known to
        be imperfect for small r.
      supporting_results:
        - >-
          The birthday/occupancy bound for a uniformly random function - the
          rigorous half - is elementary and is derived in the contract's stage 0
          rather than cited to an unread source.
        - >-
          knowledge/literature/KN-LIT-013.md, which records that the
          S*T**2 = Omega~(N) preprocessing bound is tight and that a construction
          achieves S*T**2 ~ N. THE UNDERLYING PAPER HAS NOT BEEN READ BY THIS
          PROGRAM: that record's own "Not verified here" section states the bound,
          its tightness and the CDG generalization are relayed from the ePrint
          abstract and secondary sources.
      validation_experiment_ids: [EXP-ECDLP-96b5d3]
      falsification_condition: >-
        Measured distinct coverage, counted EXACTLY by a bitset, falls materially
        below (1-o(1))*S*L at a cell below the stopping rule; or coverage fails
        to saturate at a cell deliberately set 16 times ABOVE the stopping rule.
        Either kills the coverage model at the tested parameters. TOY SCALE ONLY,
        and no correspondence exists that would let this quantity be sampled at
        cryptographic scale - that absence is stated rather than glossed.
    - id: HEUR-PRE-2
      formal_statement: >-
        The online walk from a uniformly random target enters the covered region
        with probability (1 - o(1))*S*L**2/N for S*L**2 <= N, independently of
        the target.
      random_model_justification: >-
        The same uniformly-random-function occupancy statement applied to one
        trajectory against a fixed set. Rigorous for a uniformly random function,
        heuristic for the r-adding walk. It is HEUR-PRE-1 applied in the other
        order and its failure mode differs - target-dependent hit rates rather
        than chain merging - which is why it is numbered separately.
      supporting_results:
        - >-
          The same elementary occupancy computation, derived in stage 0.
      validation_experiment_ids: [EXP-ECDLP-96b5d3]
      falsification_condition: >-
        The empirical hit rate over at least 200 independent targets per cell
        departs from S*L**2/N beyond its binomial interval, or a chi-square on
        the hit indicator binned by target x-coordinate residue class rejects
        uniformity across targets.
    - id: HEUR-PRE-3
      formal_statement: >-
        The offline stage is chargeable per curve rather than per instance in the
        deployed setting, so that a comparator may quote the online cost alone
        for a fixed standardized curve reused across many targets.
      random_model_justification: >-
        NONE, AND NONE IS POSSIBLE. This is a modelling policy, not a
        mathematical statement, and it is the assumption that decides whether the
        comparator correction applies at all. It is stated formally so a reader
        can reject it explicitly rather than inherit it silently.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        NOT EMPIRICALLY FALSIFIABLE, and that is recorded rather than dressed up.
        It is discharged instead by reporting all three amortization policies as
        separate columns in every table, so no reader is ever handed one number
        whose validity depends on a policy they did not choose. A table in this
        lane that carries fewer than three columns is invalid by construction.
  structural_ingredients:
    - description: >-
        The generic preprocessing lower bound S*T**2 = Omega~(epsilon*N) and its
        tightness, including the statement that a construction achieves
        S*T**2 ~ N and that with advice the online cost can beat sqrt(N). THIS IS
        THE ACHIEVABILITY SOURCE AND IT IS WHY THIS RECORD CLAIMS NO NOVELTY.
      citation: KN-LIT-013
      provenance: internal
      verified_by: >-
        coordinator, this design session, read knowledge/literature/KN-LIT-013.md
        in full and quotes its Key claims section. THE UNDERLYING PAPER
        (Corrigan-Gibbs and Kogan, EUROCRYPT 2018, iacr 2017/1113) HAS NOT BEEN
        READ BY THIS PROGRAM: KN-LIT-013's own "Not verified here" section says
        the bound, its tightness and the CDG generalization are relayed from the
        ePrint abstract and secondary sources. Any statement resting on the
        paper's contents beyond that record is `recalled` and may not back a
        decision.
      role: achievability of the preprocessing frontier
    - description: >-
        The program's committed statement of the generic bar, whose "Program
        usage" section reduces the technique to the convention "B = rho 1/2",
        "birthday bound", "charged exponent below 0.49/0.5" and states no
        memory-matched column.
      citation: KN-TECH-005
      provenance: internal
      verified_by: >-
        coordinator, this design session, read knowledge/techniques/KN-TECH-005.md
        in full and confirmed that its "The bound" section records
        S*T**2 = Omega~(n) with preprocessing, that its source_refs are
        KN-LIT-011 and KN-LIT-013, and that no achieving algorithm and no
        memory-matched comparator column appears anywhere in the entry
    - description: >-
        The binding prior verdict on the source proposal: novelty framing
        refuted, comparator question retained, sigma = 0 calibration not
        discriminating, sigma = 1/3 the discriminating point.
      citation: DEC-20260806-8f7e4f
      provenance: internal
      verified_by: >-
        coordinator, this design session, read the idea_verdicts entry for
        IDEA-20260806-3b91c7 in ledger/decisions/DEC-20260806-8f7e4f.yaml verbatim
    - description: >-
        Shoup's Omega(sqrt(p)) generic lower bound, cited only to name the RIVAL
        LAW the measurement must discriminate against.
      citation: KN-LIT-011
      provenance: recalled
      verified_by: null
      role: rival law under test, not support
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: derived_frontier_identity
      direction: different
      minimum_effect: >-
        EXACTLY sigma + 2*tau_on = 1 for 0 <= sigma <= 1/3, with
        tau_off = (1+sigma)/2. FORCED AND FALSIFIABLE ON PAPER: a derivation
        yielding sigma + 2*tau_on < 1 CONTRADICTS the lower bound recorded at
        KN-TECH-005 and is therefore wrong; one yielding > 1 puts the
        construction off the frontier and the comparator correction fails. Both
        branches are reachable in stage 0 at zero compute.
    - metric: memory_matched_column_exists_in_corpus
      direction: different
      minimum_effect: >-
        BINARY, AND THE AUDIT IS DESIGNED TO FIND A COUNTEREXAMPLE RATHER THAN TO
        CONFIRM AN ABSENCE. If any committed record in this repository states a
        comparator threshold at memory N**beta with the baseline evaluated at
        matched memory, the mismatch claim is FALSIFIED and the deliverable
        becomes a documentation note pointing at that record. The absence claim,
        if it survives, is a FLOOR-STYLE statement scoped to the searched paths
        and the branch state at the time of search, never a permanent count.
    - metric: online_steps_at_sigma_one_third
      direction: lower
      minimum_effect: >-
        THE DISCRIMINATING CELL, per DEC-20260806-8f7e4f. Two rival laws are
        pre-registered: LAW A (frontier) predicts median online steps
        proportional to sqrt(N/S) = N**((1-sigma)/2); LAW B (no-advantage)
        predicts median online steps proportional to sqrt(N), flat in sigma. At
        sigma = 1/3 they differ by a factor N**(1/6), which is 8.0 at N = 2**18,
        10.1 at 2**20 and 12.7 at 2**22. The measured median must sit within a
        factor of 2 of Law A's prediction AND at least a factor of 4 below Law
        B's at every size, or Law A is not selected.
    - metric: fitted_tau_on_versus_sigma
      direction: lower
      minimum_effect: >-
        Median online steps must FALL as sigma rises, and the fitted exponent at
        fixed sigma must land within 0.05 of (1-sigma)/2. DECISIVE ALTERNATIVE:
        if median steps are FLAT in sigma while the planted positive passes, the
        chain coverage is not being realised and Law A fails as an achievability
        claim at reachable sizes, leaving the comparator mismatch standing as an
        open question rather than a correction. THREE SIZES CANNOT SUPPORT AN
        EXPONENT FIT and the fit is REFUSED, reported as unfitted, whenever the
        interval is wide.
    - metric: two_column_threshold_difference
      direction: different
      minimum_effect: >-
        The memory-blind and memory-matched threshold columns must differ by
        EXACTLY 1/(2*(m+1)) in the time exponent at every m in 3..10, and in bits
        at N = 2**256 by 32.0 (m=3), 25.6 (m=4), 21.3 (m=5), 18.3 (m=6), 16.0
        (m=7). If the columns agree at any m, the composition step is wrong and
        the quantified correction is not the right number.
    - metric: bsgs_domination_verdict
      direction: different
      minimum_effect: >-
        BSGS at (time N**(1/2), memory N**(1/2)) must be reported DOMINATED on
        time by N**(1/4) at equal memory under the corrected comparator. This is
        a point prediction about a textbook algorithm and is the cheapest single
        check in the record; an instrument that reports BSGS as non-dominated is
        wrong. It is a CONSISTENCY check on the arithmetic and is NOT evidence
        that BSGS is a bad algorithm.
    - metric: zn_null_agreement
      direction: same
      minimum_effect: >-
        The measured tau_on(sigma) curve on Z/N with a random relabelling must be
        IDENTICAL to the elliptic-curve curve within the reported intervals at
        every cell, because the construction uses nothing elliptic. Disagreement
        is the defect, not the finding.
  test_boundary:
    instances:
      - >-
        Prime-order subgroups of toy short-Weierstrass curves over prime fields,
        with log2(N) near 18, 20 and 22. The REALISED N is recorded and every
        prediction is evaluated at the realised N, never at the nominal power of
        two.
      - >-
        Z/N with a random relabelling into the same coordinate range, as the
        structure-free null object, at the same realised N.
    parameters:
      sigma_sweep: [0, 0.1667, 0.25, 0.3333]
      r_adding_walk_arity: [16, 64, 256]
      targets_per_cell: 200
      degenerate_arm: S*L**2 = 16*N
      amortization_policies: [per_instance, per_curve, per_parameter_set]
      m_range_for_threshold_table: [3, 4, 5, 6, 7, 8, 9, 10]
      concrete_cost_N: 256
    implementation: >-
      Pure Python, no numpy dependence for the group arithmetic, no SageMath, no
      external solver. Exact integer arithmetic throughout. Coverage counted
      exactly with a bitset.
    budget:
      wall_clock_seconds: 3600
      memory_gb: 2
      maximum_runs: 8
  falsification_conditions:
    - >-
      Stage 0's derivation yields sigma + 2*tau_on != 1. Either it contradicts
      the lower bound recorded at KN-TECH-005 (the derivation is wrong) or it
      lands above the frontier (the construction does not achieve). Either kills
      the headline; the record is withdrawn rather than re-scoped.
    - >-
      The corpus audit exhibits a committed record already stating a
      memory-matched comparator column. The mismatch claim is falsified, and the
      deliverable is a documentation note naming that record. THIS IS A REAL
      OUTCOME, not a formality: DEC-20260806-8f7e4f already refuted this
      proposal's novelty framing on exactly this kind of finding.
    - >-
      Measured median online steps are flat in sigma across the whole sweep at
      all three sizes while the planted positive passes. Law B is selected, the
      achievability arm fails at reachable sizes, and only the comparator
      mismatch survives as an open question.
    - >-
      The Z/N null arm differs materially from the curve arm. The implementation
      is not generic; the framing is void and no cell is read.
    - >-
      The recomputed two-column threshold table shows the columns agreeing at
      some m. The composition is wrong and 1/(2*(m+1)) is not the correction.
    - >-
      Coverage fails to saturate at the degenerate cell 16 times above the
      stopping rule. HEUR-PRE-1's coverage model is wrong and every online-time
      prediction resting on it is void.
  interpretation_limits:
    - >-
      NO ATTACK, NO EXPONENT MOVED, NO NOVELTY CLAIMED. Total cost (offline plus
      online) remains Theta(N**(1/2)) at every sigma. Nothing here bears on the
      security of any deployed curve and nothing says prime-field ECDLP is
      weakened. The construction's achievability is ALREADY PUBLISHED and is
      cited to KN-LIT-013; DEC-20260806-8f7e4f refuted the source proposal's
      contrary framing and that refutation binds this record.
    - >-
      A CORRECTED COMPARATOR IS NOT AN ATTACK EITHER. The only thing that moves
      is the number a candidate must beat, and it moves in the direction that
      makes every positive claim in this program HARDER.
    - >-
      TOY TIER for every measurement, realised N below 2**23. The exponent
      statement is a derivation and is scale-independent; the CONFIRMATION is
      not, and three sizes cannot support an exponent fit.
    - >-
      IT SUPERSEDES NOTHING. No status change to IDEA-20260805-c06631,
      IDEA-20260731-013, IDEA-20260803-fa9839, catalogue A1-4 or A1-13 is
      proposed. Disagreement with c06631's rho rows is REPORTED under the
      retrieval policy's contradiction rule, and c06631 is correct about vOW.
    - >-
      THE AMORTIZATION POLICY IS A POLICY. Three variants and the arithmetic for
      each are supplied; choosing among them is a Coordinator decision, not a
      mathematical result, and HEUR-PRE-3 is not empirically falsifiable.
    - >-
      THE PREPROCESSING BOUND MAY NOT BIND INDEX CALCULUS AT ALL. It is a
      generic-group bound and index calculus is precisely non-generic; catalogue
      A1-4 already flags this and this record does not touch it. What the
      corrected comparator changes is the BASELINE a candidate is scored against,
      not any statement about whether the bound constrains the candidate.
    - >-
      B* = N**(1/(m+1)) IS QUOTED, NOT RE-DERIVED. It rests on a mean-yield
      convention whose instance-level error bars are the subject of
      EXP-ECDLP-7edfd3. Every threshold row is conditional on that convention.
    - >-
      FORWARD GUIDANCE, MANDATORY AND STATED REGARDLESS OF OUTCOME. What remains
      open: (a) whether index calculus's own memory can be traded down the same
      way, since the relation matrix is not obviously chainable; (b) whether the
      preprocessing lower bound binds a non-generic algorithm at all; (c) the
      composition of a preprocessed baseline with the multi-target regime beyond
      the single crossover derived here.
