  title: >-
    The orders of 2 modulo 163, 233, 283, 409, and 571 fix the
    Frobenius-stable dimensions, and only 29 and 30 sit in a factor-of-two
    window.
  statement: >-
    Each degree m is prime. The multiplicative order of 2 modulo m is 162,
    29, 94, 204, and 114. That order divides m - 1. The irreducible-factor
    count of T^m + 1 over F_2 is f = 1 + (m - 1) / ord, so f is 2, 9, 4, 3,
    and 6. The stable dimensions are k * ord and k * ord + 1 for k from 0
    through (m - 1) / ord. The useful band is m/t with t = 7, 9, 9, 11, 12.
    A dimension d is inside the band's factor-of-two window when
    2 * d * t >= m and d * t <= 2 * m. The inside sets are empty, {29, 30},
    empty, empty, and empty.
  mechanism: >-
    A subspace factor base closed under the 2-power Frobenius has dimension
    equal to a subset sum of the degrees of the irreducible factors of
    T^m + 1. At prime m those degrees are 1 and ord_m(2). This contract
    checks that arithmetic. It does not build a factor base.
