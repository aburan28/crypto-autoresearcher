hypothesis:
  id: H-ICEX-068cec
  question_id: RQ-JINV-8fc13a
  added: '2026-09-04'
  derived_from_idea: IDEA-20260828-2b2bb2
  statement: >-
    RQ-JINV-8fc13a's own title names four characterisations of "special j" - 0, 1728, small
    |D_0|, and SMALL HEIGHT - and only the first three have ever been operationalised. The
    natural reading of "small height" independent of CM is the naive height of a GLOBAL model:
    for E_{A,B}/Q with A, B in Z, H(A,B) = max(4|A|^3, 27 B^2). The tracked object is the
    integer pair (A,B) itself, propagated to every prime of good reduction by the ring
    homomorphism Z -> F_p.
    THE HYPOTHESIS (H-null): for a fixed non-CM small-height (A0,B0), the sequence of
    null-adjusted deviations Y(p_1), ..., Y(p_k) of this program's standard relation-collection
    functionals is UNCORRELATED ACROSS PRIMES - statistically indistinguishable, under a
    permutation null, from the correlation structure of k independently drawn single-prime
    curves matched at each prime on |D_0|, |Aut|, N and factor-base density. "Small height" is
    then p-local instance noise: reduction destroys precisely the global arithmetic (rank,
    torsion, conductor, L-function) that height measures, and the RQ's fourth title clause
    closes with a named obstruction.
    THE RIVAL (H-signal): Y(p_i) shows a reproducible cross-prime correlation exceeding the
    permutation band, present across a replication pack of independently chosen small-height
    global models and ABSENT for a large-height control - i.e. the same global curve behaves
    consistently unusual across many independent reductions, which is qualitatively unlike
    every other finding in this lane, all of which are properties of a single p.
    THE SCOPE LIMIT: even a confirmed H-signal is a curve-SELECTION caution about one class of
    global models. It is not an attack on the generic ECDLP, not an exponent, and not a
    statement about any deployed curve. The ECDLP time exponent is 1/2 in every branch.
  mechanism: >-
    THE LOSSY-PROJECTION TEST APPLIED EXPLICITLY. The object is (A,B) in Z x Z with reduction
    rho_p applied coordinatewise. The projection is genuinely lossy - it discards the rank, the
    Mordell-Weil group, the rational torsion, the conductor and the L-function, keeping two
    integers - and it is lossy COMPATIBLY with the operations the target performs, because
    rho_p is a ring homomorphism, so the group law of E(F_p) is determined entirely by
    (A mod p, B mod p) with no reference to the discarded data, and the SAME two integers
    determine the reduction at every prime simultaneously. The propagation is deterministic
    across the whole prime set rather than a coincidence at one prime, which is what makes
    "does the retained part carry a cross-prime signature" a genuine question rather than a
    restatement.
    WHY H-null IS THE HONEST DEFAULT. For a non-CM curve over Q, the normalised Frobenius
    traces equidistribute with respect to the Sato-Tate measure as p varies, so the sequence of
    traces - hence of D_0(p), hence of the functionals this lane computes from D_0(p) and N(p)
    - behaves like an independent draw at each p, with no group-theoretic reason to correlate
    across p. The lane's standing admissibility argument says nothing here, because the object
    is not an endomorphism at all but a global arithmetic fact, so the argument neither closes
    nor supports this question and is not invoked.
    WHY THE CURVE-FREE NULL IS THE LOAD-BEARING CONTROL. The signature under test -
    "one fixed object reduced at many primes yields correlated deviations" - is producible with
    no elliptic curve anywhere: a fixed integer seed reduced mod each p, expanded to a
    deterministic subset of Z/p of matched cardinality, and scored by the SAME sumset-coverage
    functional, has exactly the same shape. If that arm correlates, the effect is a property of
    "a fixed global integer reduced at many primes" and is not about curves, about height, or
    about the ECDLP. Running it is what makes the two readings separable inside one run, and
    the standing scope constraint of the pfdr-battery lane requires it here because a non-curve
    object can reproduce the signature.
  assumptions:
    - >-
      The fixed global models are verified NON-CM per prime by direct point counting: D_0(p)
      must not repeat one small fixed value across the prime set, which would indicate an
      accidental CM or a degenerate choice such as A = 0 or B = 0.
    - >-
      Every prime in the declared set is a prime of good reduction, i.e. p does not divide
      6 * Delta(A,B); reduction is verified per prime rather than assumed.
    - >-
      Toy scale, with the L1 functionals computed EXACTLY per prime by enumeration rather than
      estimated from sampled targets, so that the cross-prime correlation is not contaminated by
      the sampling noise of the within-prime statistic.
    - >-
      The null arm at each prime is a FRESHLY drawn pair with no relationship to any other
      prime's null draw. The null encodes "same local profile, no shared global identity",
      which is precisely the contrast the two hypotheses need.
    - >-
      Sato-Tate equidistribution is asymptotic. At k of order 20 primes the sequence is far from
      the asymptotic regime; this limits an H-null closure to "no signal at this scale" and is
      recorded, not smoothed over.
  proof_search_map:
    bottleneck: >-
      Whether Y(p_i) shows cross-prime correlation beyond the permutation band. That single
      quantity separates "small height is p-local noise" from "small height is a property that
      persists across independent reductions".
    baseline_embedding:
      parameter_slice: >-
        k independently drawn matched-random curves, one per prime, with no shared global
        identity. This is the null distribution against which the fixed-global sequence is
        compared, and it is also the slice where the answer is known by construction: zero.
      reproduction_check: >-
        Frozen fixture, blocking: on the null arm ALONE - k independent curves at k independent
        primes - the empirical cross-prime correlation of Y must be statistically zero, matching
        the permutation null, before any fixed-global result is reported. This checks the
        statistic and the seeding, not the height hypothesis.
    observation_collision:
      observable: >-
        The cross-prime correlation of the null-adjusted deviation Y for one fixed global model.
      distinct_preimage_search: >-
        THREE DISTINCT PREIMAGES ARE IDENTIFIED AND SEPARATED BY DESIGN. (i) A genuine
        height-driven arithmetic effect. (ii) A shared-instance-noise artifact of how the
        harness draws null curves, e.g. a seed reused across primes - separated by fresh
        independent seeds per null draw with a blocking seed audit. (iii) An artifact of
        non-independent prime selection, e.g. all primes clustered so that the correlation runs
        through the size of p rather than the identity of (A,B) - separated by spreading the
        primes across the declared range and reporting the correlation as a function of prime
        spacing. A fourth preimage - "any fixed object reduced at many primes correlates" - is
        separated by the curve-free arm.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A pack of m independently chosen small-height global pairs, each reduced at the SAME k
          primes, giving an m by k grid, plus one large-height global pair and one curve-free
          fixed-seed object on the same grid.
        predicted_gain: >-
          Converts "is there a signal for THIS curve" into "is there a signal for small-height
          curves in general", and supplies a free replication check that a single fixed curve
          cannot provide.
    quantifier_order: >-
      CLAIMED. FOR the declared height threshold and prime set, FOR EACH of the m small-height
      global curves, there does or does not exist a cross-prime correlation of Y exceeding the
      matched-null band. NOT CLAIMED, and explicitly refused as support: the weaker order
      "there exists one curve and one prime pair with a large deviation", which is satisfiable
      by chance in any grid of this size.
    method_ceiling:
      strongest_certifiable_claim: >-
        At toy scale, over the declared prime set and height threshold, the chosen small-height
        global curves' relation-collection functionals do or do not show a cross-prime
        correlation beyond the matched-random null and beyond the curve-free null. It can
        certify nothing about a specific deployed curve, nothing at cryptographic scale, and no
        exponent.
      nearby_object_control: >-
        A LARGE-height global model - large random A, B, no special structure - reduced at the
        same k primes. It shares nothing structurally with the small-height pack except "one
        fixed global object, many primes". If it also correlates, the effect is generic to fixed
        global objects rather than to height, and the height-specific claim is withdrawn.
    proof_obligations:
      - claim: Reduction is verified to be good at every declared prime for every global model used.
        responsibility: correctness
      - claim: The null arm alone reproduces zero cross-prime correlation before any fixed-global result is trusted.
        responsibility: baseline
      - claim: The chosen global models are verified non-CM by direct per-prime discriminant computation.
        responsibility: interface
      - claim: The curve-free fixed-seed arm reproduces zero cross-prime correlation.
        responsibility: baseline
      - claim: No exponent, no attack and no cryptographic-scale claim follows even under H-signal.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-HGT-1
      formal_statement: >-
        For a fixed non-CM global model, the sequence of fundamental discriminants D_0(p)
        induced by reduction at the declared prime set behaves, for the purposes of this lane's
        relation-collection functionals, like a sequence of independent draws from the
        D_0-distribution the lane already treats as the relevant covariate.
      random_model_justification: >-
        The classical statement imitated is Sato-Tate equidistribution for non-CM curves over
        Q: the normalised traces equidistribute with respect to the Sato-Tate measure as p
        varies, which is the standard licence for treating a deterministic arithmetic sequence
        with an equidistribution theorem behind it as asymptotically independent for a
        correlation test. THE GAP, stated plainly: equidistribution is asymptotic and k of
        order 20 is not asymptotic, so the heuristic is used to set an expectation and never as
        a bound.
      supporting_results:
        - >-
          Sato-Tate equidistribution for non-CM elliptic curves over Q. RECALLED ONLY; no agent
          in this program has opened the source, so this entry is a pointer for the reviewer and
          supports nothing. The empirical serial correlation of D_0(p) itself is measured
          directly in the contract rather than assumed from it.
      validation_experiment_ids:
        - EXP-ICEX-025c4d
      falsification_condition: >-
        The measured serial correlation of the D_0(p) sequence itself exceeds its permutation
        band for the small-height pack. The covariate, not the functional, is correlated, and
        every downstream reading changes; this is reported as a finding in its own right.
    - id: HEUR-HGT-2
      formal_statement: >-
        Naive height and the local CM-type of a reduction are a priori independent axes for a
        fixed non-CM global model: small height does not systematically bias the distribution of
        D_0(p) or of the automorphism group order relative to large height, for primes outside
        the bounded bad-reduction set.
      random_model_justification: >-
        NO THEOREM IS KNOWN TO THIS PROGRAM linking global naive height to the local CM-type of
        a reduction for a non-CM curve, and this entry says so rather than inventing support.
        The assumption is recorded as the DEFAULT null, imitating the convention that two a
        priori unrelated invariants are treated as independent until a mechanism is shown, and
        it is measured directly rather than relied upon.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ICEX-025c4d
      falsification_condition: >-
        The empirical distributions of D_0(p) or of |Aut(E_p)| differ between the small-height
        pack and the large-height control across the same prime set beyond the permutation band.
        The matching that the null arm performs is then incomplete and the cross-prime
        correlation is confounded by it.
  structural_ingredients:
    - description: >-
        The parent proposal's construction: the tracked global object, the per-prime matched
        null, the null-adjusted deviation, the replication pack, the large-height nearby object
        and the prime-gap control.
      citation: ledger/proposals/IDEA-20260828-2b2bb2.yaml
      provenance: internal
      verified_by: >-
        TASK-20260904-8f2f95, coordinator design session, full read of the record on 2026-09-04.
    - description: >-
        The calibrated naive height convention H(A,B) = max(4|A|^3, 27 B^2) for a short
        Weierstrass model over Q, used here as the definition of the height axis.
      citation: 'arXiv:2506.18874'
      provenance: recalled
      verified_by: null
    - description: >-
        The campaign's own standing prediction that relation yield depends on the group order
        and factor-base size only, which an H-null result would strengthen cross-prime as well
        as within-class.
      citation: analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md
      provenance: internal
      verified_by: >-
        IDEA-20260828-2b2bb2 records reading this document directly in its authoring session.
        TASK-20260904-8f2f95 read that proposal and did NOT open DECOMPOSITION.md; the
        prediction is second-hand and the contract re-reads it in its zero-compute stage before
        any comparison is scored.
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: >-
        cross_prime_correlation_null_arm - Spearman correlation of Y across the k primes
        computed on the NULL arm alone, i.e. k independently drawn single-prime curves,
        dimensionless in [-1, 1]
      direction: different
      minimum_effect: >-
        FORCED 0 within the permutation band. A nonzero value voids the instrument, not the
        hypothesis, and no fixed-global number is reported until it is repaired.
    - metric: >-
        cross_prime_correlation_curve_free - the same statistic on a fixed integer seed reduced
        at the same k primes and expanded to a matched-cardinality subset of Z/p, with NO curve
        constructed, dimensionless
      direction: different
      minimum_effect: >-
        FORCED 0 within the permutation band. A nonzero value means "one fixed global object,
        many primes" produces correlation with no arithmetic of curves involved, and the height
        reading is unavailable in either direction.
    - metric: >-
        cross_prime_correlation_small_height - Spearman correlation of Y across the k primes for
        each of the m fixed small-height global models, dimensionless, with an exact permutation
        p-value and Holm correction across the pack
      direction: different
      minimum_effect: >-
        PRE-REGISTERED NULL EXPECTATION 0 within the permutation band. A reproducible nonzero
        correlation across the pack, absent from the large-height control and from the
        curve-free arm, is H-signal and triggers a stop for independent review before any record
        states it.
    - metric: >-
        cross_prime_correlation_large_height - the same statistic for the large-height control,
        dimensionless
      direction: different
      minimum_effect: >-
        Predicted 0. If it matches the small-height pack, the effect is generic to fixed global
        objects and the height-specific claim is withdrawn.
    - metric: >-
        correlation_vs_log_height - the correlation magnitude regressed on log H(A,B) across the
        pack plus the large-height control
      direction: different
      minimum_effect: >-
        Flat under H-null. A monotone trend surviving the large-height control is the sharpest
        form of H-signal and is reported with its exact permutation distribution.
    - metric: >-
        serial_correlation_D0 - the serial correlation of the D_0(p) sequence itself across the
        prime set, per global model, dimensionless
      direction: different
      minimum_effect: >-
        Predicted 0. A nonzero value moves the finding from the functional to the covariate and
        changes every downstream reading; it is reported separately rather than folded in.
  test_boundary:
    instances:
      - >-
        m = 5 independently chosen small-height non-CM global models with |A|, |B| at most 5,
        each verified non-CM by per-prime point counting.
      - >-
        1 large-height global model with large random coefficients and no special structure.
      - >-
        1 curve-free fixed-seed object: a declared integer seed reduced at each prime and
        expanded deterministically to a subset of Z/p of the matched cardinality, with no curve,
        no group law and no coordinate map.
      - >-
        A null arm of at least 100 freshly drawn matched-random curves per prime, each matched on
        |D_0(p)|, |Aut|, group order and factor-base density.
    parameters:
      primes: 'k = 20 toy primes spread across [2^20, 2^24], frozen before any measurement, with the spacing recorded'
      functionals: 'the standard relation-collection battery at arity 2 and 3, computed EXACTLY by enumeration per prime'
      height_definition: 'H(A,B) = max(4|A|^3, 27 B^2), declared before selection'
      matching: 'per-prime matching of the null draws on |D_0|, |Aut|, group order and factor-base density'
    implementation: >-
      Pure Python integer arithmetic and an explicit group law under
      experiments/EXP-ICEX-025c4d/driver/. Exact enumeration of the sumsets; no sampled-target
      estimator anywhere, so that the within-prime statistic contributes no noise to the
      cross-prime correlation. Nothing under harness/ is modified.
    budget:
      wall_clock_seconds_total: 28800
      maximum_memory_gb: 8
      maximum_runs: 10
  falsification_conditions:
    - >-
      F1. The null arm alone shows nonzero cross-prime correlation. INSTRUMENT OR SEEDING
      FAILURE; no fixed-global result is reported until repaired.
    - >-
      F2. The curve-free fixed-seed arm shows nonzero cross-prime correlation. The signature is
      not about curves; the height reading is unavailable and the run reports an instrument
      finding instead.
    - >-
      F3 (MAIN NEGATIVE, THE INTENDED DELIVERABLE). No small-height global model in the pack
      shows correlation beyond the null band. The RQ's "small height" title clause closes at toy
      scale with the named obstruction that naive height is global arithmetic reduction
      destroys, and the campaign's standing yield prediction is strengthened cross-prime.
    - >-
      F4. A correlation appears for exactly one of the m models and not the others. Read as a
      curve-specific artifact - possibly an accidental near-CM or a small-conductor coincidence -
      reported as such, and NOT generalised to a height-class effect.
    - >-
      F5 (STOP CONDITION). A reproducible correlation across multiple small-height models, absent
      from the large-height control and from the curve-free arm. Work STOPS for independent
      review before any record states a height-driven signal.
  interpretation_limits:
    - >-
      Claim tier toy. k toy primes; nothing here is a cryptographic-scale statement.
    - >-
      Even a confirmed H-signal is a curve-SELECTION caution about one class of global models,
      never an attack on the generic ECDLP and never an exponent claim.
    - >-
      This object lies outside the lane's standing admissibility argument, which concerns
      endomorphisms acting on the group. That argument is neither used nor retested here, and
      the record says so rather than silently relying on it.
    - >-
      Different primes give non-isogenous curves in general, so no transport or preprocessing
      reading applies. This is flagged so the record is not mistaken for a multi-instance result.
    - >-
      An H-null closure is scoped to "no signal at this prime count and this height threshold",
      not to "no signal at any scale". At k of order 20 the Sato-Tate regime is not reached.
  status: proposed
  proposed_by: idea-generator
  specified_by: coordinator
  prior_evidence_refs:
    - RQ-JINV-8fc13a
    - IDEA-20260828-2b2bb2
    - GOAL-ENDO-001
    - KN-TECH-018
  distinguishable_outcomes:
    - outcome: >-
        Null arm zero, curve-free arm zero, and every small-height model's correlation inside the
        band at the stated resolution.
      meaning: >-
        H-null is supported at this prime count. The title clause closes with a measured
        obstruction and a stated resolution, and the closure explicitly does not extend beyond
        the tested prime count.
    - outcome: >-
        Correlation across the pack, absent from the large-height control and the curve-free arm.
      meaning: >-
        H-signal is the live reading. Work stops for independent review; the finding, if it
        survives, is a curve-selection caution and nothing more.
    - outcome: >-
        Correlation present in the curve-free arm as well.
      meaning: >-
        "One fixed object reduced at many primes" correlates for reasons having nothing to do
        with curves. The height reading is withdrawn and the instrument finding is reported.
    - outcome: >-
        Correlation for exactly one small-height model.
      meaning: >-
        A curve-specific artifact. Reported at that size, not generalised, with the candidate
        explanations - accidental near-CM, small conductor - named and checked.
    - outcome: >-
        The null arm correlates.
      meaning: >-
        Instrument or seeding failure. Nothing in the run is readable, and the failure is an
        infrastructure outcome rather than negative mathematical evidence.
