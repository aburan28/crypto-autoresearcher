  predictions:
    - metric: gcd_h_r_pass_five_rows
      direction: exact
      minimum_effect: true on all five (gcd=1)
    - metric: corrected_rho_bits_per_row
      direction: exact
      minimum_effect: >-
        [78.10, 93.98, 125.78, 141.71, 173.57] (±0.01) under
        log2(sqrt(pi*r/(4*k))) with audited r
    - metric: ord_pi_q_on_prime_toy_cells
      direction: exact
      minimum_effect: >-
        Exactly k' on (4,5) and (4,7) review cells (and any additional
        prime-k' cells run)
    - metric: pi_2_is_endomorphism_on_B_notin_F2
      direction: exact
      minimum_effect: false on every tested point with x notin F_2
    - metric: aut_E_discharged_via_source_read
      direction: exact
      minimum_effect: >-
        Stage 1 records retrieved provenance for the char-2 Aut
        classification OR unrecovered=true; A3 not silently assumed
    - metric: composite_search_proper_divisor_found
      direction: unknown
      minimum_effect: >-
        Search reports found=true with certificate OR found=false with
        budget exhausted (control incomplete, not forced failure)

  test_boundary:
    instances:
      - >-
        Stage 0 arithmetic cells: five deployed c2pnb rows (audit identities
        only; no group walks)
      - >-
        Stage 1 literature cell: char-2 Aut classification at source
        (Silverman Appendix A or equivalent peer-reviewed source)
      - >-
        Stage 2 toys: review cells (d,k')=(4,5),(4,7) on E/F_16 with
        A=0, B=t^3+1; null non-subfield over F_{2^20}; degenerate B in F_2;
        composite-k' SEARCH at (4,6) and nearby until proper divisor or
        budget exhausts; optional (2,13)/(8,5) if budget remains
    parameters:
      q: [65536]
      k_deployed: [11, 13, 17, 19, 23]
      d_toy: [4, 2, 8]
      k_prime_toy: [5, 7, 6]
      frozen_corrected_rho_bits: [78.10, 93.98, 125.78, 141.71, 173.57]
    implementation: >-
