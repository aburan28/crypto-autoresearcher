# H-BINSTD-128789 -- Rho symmetry ledger for five composite-degree ANSI curves:
# |<pi_q, [-1]>| = 2k exactly (not 32k); A3 Aut(E)=Z/2 closable; corrected
# rho rows under sqrt(pi*r/(4k)). Specified and approved under
# DEC-20261001-54f76a from IDEA-20260922-c07598 under RQ-BINSTD-b6f698 /
# GOAL-ECDLP2M-001, absorbing 2026-09-26 HOLD-B review defects
# (analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-c07598.yaml;
# verdict sound_with_corrections / HOLD-B).
#
# ZERO RUNS in this design packet. IDEA-20260922-c07598 claim text is not
# edited (proposals immutable); this hypothesis cites it and freezes the
# review-absorbed restatement for experimental purposes.
# =============================================================================
hypothesis:
  id: H-BINSTD-128789
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-c07598
  experiment_id: EXP-BINSTD-9d1b8e
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-01'
  approved_at: '2026-10-01'
  authorised_by: DEC-20261001-54f76a
  review_cited: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-c07598.yaml
  proposed_by: coordinator
  title: >-
    Rho symmetry ledger for five composite-degree ANSI curves: |<pi_q,[-1]>|
    = 2k exactly (not 32k from the Galois curve-orbit); Aut(E)=Z/2 closable
    via j=1/b; corrected matched-rho rows under sqrt(pi*r/(4k))

  statement: >-
    SETTING. E/F_q, q=2^16 (audit, analysis/binstd-curve-audit/), attacked
    over F_{q^k}, k in {11,13,17,19,23} prime, G the prime-order subgroup of
    order r (161,193,257,289,353 bits), h = #E(F_q) with gcd(h,r)=1
    (IDEA-20260922-6cf862 result A / review re-derivation).

    (A) GROUP ORDER. pi_q :(x,y)->(x^q,y^q) is an endomorphism of E (A,B in
    F_q). Restricted to E(F_{q^k}) it is a group automorphism of order
    dividing k. On G it acts as multiplication by a root mu of T^2-tT+q
    mod r. mu!=1 because G meets E(F_q) only in O (6cf862 A / audited
    gcd(h,r)=1). k prime forces ord(mu) in {1,k}, hence ord(mu)=k.
    Negation [-1] has order 2, distinct from <pi_q> (k odd). Therefore
    |<pi_q,[-1]>| = 2k EXACTLY. HOLD-B: a=0 on c2pnb208w1 is NOT a risk
    factor for Aut(E); j=1/b !=0 for ordinary binary curves, and Aut(E)=
    {+-1} whenever j!=0 (char-2 classification; Stage 1 reads at source).

    (B) NAMED WRONG ANSWER. Conflating Gal(F_{q^k}/F_2) of order 16k (the
    orbit of Galois-conjugate curves under pi_2) with Aut of ONE curve's
    rational points yields the false divisor 32k. pi_2 is an endomorphism
    of E only if A,B in F_2; audited B is not in F_2 on any of the five,
    so pi_2(E)=E^{(2)} != E. The 16k-orbit is structural for GHS/cover
    (IDEA-20260922-d11575), not a rho self-map of E.

    (C) ATTACK-SIDE CEILING (HOLD-B SENTENCE ADDED). A single-target
    construction on a FIXED instance may exploit at most the same order-k
    <pi_q> as a symmetry GROUP. Rho and index calculus extract DIFFERENT
    gains from that group: rho gains sqrt(k) in walk length; a
    Frobenius-aware index calculus may gain up to k in relation count and
    k^2 in linear algebra (GGMP, abstract). Capping the attack at sqrt(k)
    is the reverse mistake; charging more than order-k without a named
    separate source voids the comparison (RQ-BINSTD constraint 4).

    (D) CORRECTED MATCHED-RHO ROWS (HOLD-B / CORR-20260922-81aeab). Use
    sqrt(pi*r/(4k)) with the ACTUAL audited r (not 0.886*sqrt(2^{s-0.5})/
    sqrt(2k), which double-counts negation and overstates r):
      c2pnb176v1 (k=11): 2^78.10
      c2pnb208w1 (k=13): 2^93.98
      c2pnb272w1 (k=17): 2^125.78
      c2pnb304w1 (k=19): 2^141.71
      c2pnb368w1 (k=23): 2^173.57
    Stage 0 recomputes these; inherited d11575/c07598 figures are reported
    in a SEPARATE labeled column for audit, never mixed unlabeled.

  statement_note: >-
    IDEA-20260922-c07598 claim text is immutable and left at status proposed.
    Review verdict sound_with_corrections (HOLD-B). Defects absorbed:
    (1) corrected rho convention + actual r; (2) A3 closable via j=1/b,
    drop a=0 red herring; (3) composite-k' control is a CURVE SEARCH, not
    a forced prediction; (4) sqrt(k)-versus-k sentence in (C). ECC2K-130
    bearing: same derivation at q=2,k=131 gives |<tau,[-1]>|=262 and
    rho ~ 2^60.81; the 16-fold conflation cannot arise (E over F_2).

  mechanism: >-
    OBJECT FRAME. Representation: R1 (RQ-ECDLP-623a32), a point of G together
    with endomorphism-ring element pi_q. Operation set Sigma for the rho
    equivalence class: {[-1], pi_q} — Gamma = <pi_q,[-1]> of order 2k
    (quotient/canonicalisation object; IDEA-20260901-863e36 block-system
    family). Lossy projection point -> <pi_q,[-1]>-orbit discards log2(2k)
    bits and is Sigma-compatible. WHAT IS TESTED is a CONTROL CERTIFICATE:
    (i) arithmetic that mu!=1 and ord(mu)=k at five deployed rows;
    (ii) discharge of A3 via char-2 Aut classification at source;
    (iii) toy verification of ord(pi_q)=k' on prime-k' cells, pi_2 not an
    endomorphism when B notin F_2, null and composite-search controls.
    F1 (walk-collision) is the declared component; no new attack is proposed.

  assumptions:
    - k odd prime, q=2^16; r prime with gcd(r,h)=1 (audited, all five rows).
    - >-
      A3 Aut(E)=Z/2: HOLD-B states this closes on j=1/b !=0 plus odd audited
      traces (ordinary). Stage 1 must READ the char-2 classification at
      source and upgrade provenance recalled→retrieved before A3 is treated
      as discharged at claim strength. Until then A3 remains a named open
      item on the hypothesis, not silently assumed.
    - Arithmetic only at deployed parameters; executable arm is toy cells
      with dk' <= 41 (review cells (4,5),(4,7) plus composite search).
    - No scientific group walk at deployed k in {11..23}.

  proof_search_map:
    bottleneck: >-
      Whether Aut(E)=Z/2 (A3) for these five curves after reading the
      char-2 classification; given that, the order-2k derivation is
      unconditional group theory on audited inputs. Separately, whether
      the instrument correctly distinguishes pi_q endomorphisms from
      Galois conjugate maps (named 32k failure mode).
    baseline_embedding:
      parameter_slice: >-
        k=1 (E over F_q): symmetry group order 2 (negation only). Toy
        (d,k')=(4,5) and (4,7) with review-named curve A=0,B=t^3+1 over
        F_16: ord(pi_q) exactly 5 and 7 on a prime-order subgroup point.
      reproduction_check: >-
        (i) Stage 0: gcd(h,r)=1, t odd, Weil recursion, corrected rho
        bits match frozen expected within 0.01 bit. (ii) Stage 2:
        ord(pi_q)=k' on prime cells; pi_2 fails E's equation on non-F_2
        points; k=1 embedding returns order 2.
    observation_collision:
      observable: >-
        Stated symmetry-group order 2k versus 32k; ord(mu) in {1,k} at
        prime k versus proper divisors at composite k'.
      distinct_preimage_search: >-
        2k vs 32k separated by the endomorphism-versus-Galois-orbit
        distinction (B) plus the pi_2 mechanical check. ord(mu)=1 vs k
        separated by audited gcd(h,r)=1. Composite proper-divisor
        observation requires a CURVE SEARCH (HOLD-B): not forced on every
        composite cell.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The <pi_q,[-1]>-orbit of a point in G, canonicalised by
          minimum-over-orbit (Wiener-Zuccherato / GLV convention).
        predicted_gain: >-
          Rho step count divided by sqrt(2k) under the class convention,
          or equivalently sqrt(pi*r/(4k)) under CORR-20260922-81aeab —
          constant-factor bookkeeping; no exponent movement.
    quantifier_order: >-
      FOR EACH of the five curves, ord(mu)=k given audited gcd(h,r)=1 and
      k prime (equality). SEPARATELY, FOR ANY lane record stating a rho or
      attack symmetry-group order on these rows, that order divides 2k on
      the rho side (given A3) and a single-target attack may not exceed
      order-k without a named separate source — with the HOLD-B clarification
      that rho extracts sqrt(k) and IC may extract up to k / k^2.
    method_ceiling:
      strongest_certifiable_claim: >-
        On the five composite-degree ANSI curves, Pollard rho with
        negation and Frobenius classes exploits a group of order exactly
        2k (given Aut(E)=Z/2 after Stage 1 source read), the 32k figure
        is the named wrong answer, and corrected matched-rho bits under
        sqrt(pi*r/(4k)) are the lane baseline. Cannot certify a new
        attack, move an exponent, or treat A3 as discharged before the
        source read.
      nearby_object_control: >-
        (i) PROVES-TOO-MUCH: composite-k' cell found by SEARCH where
        ord(mu) is a proper divisor of k' — "exactly k'" must NOT be
        returned unconditionally. (ii) NULL: ordinary curve over F_{2^{dk}}
        not defined over any proper subfield — pi_q not an endomorphism;
        symmetry order 2. (iii) Degenerate B in F_2: pi_2 IS an
        endomorphism and the instrument must detect that. (iv) k=1
        embedding returns order 2.
    proof_obligations:
      - claim: pi_q restricted to E(F_{q^k}) is an automorphism of order dividing k
        responsibility: correctness
      - claim: mu != 1 on G (audited gcd(h,r)=1 / 6cf862 A)
        responsibility: baseline
      - claim: k prime implies ord(mu)=k given mu != 1
        responsibility: correctness
      - claim: pi_2 is not an endomorphism of any of the five (B notin F_2)
        responsibility: correctness
      - claim: Aut(E)=Z/2 via j=1/b !=0 and char-2 classification (A3; Stage 1 source read)
        responsibility: scope
      - claim: Corrected rho bits under sqrt(pi*r/(4k)) with actual r
        responsibility: correctness
      - claim: Attack-side ceiling distinguishes sqrt(k) (rho) vs up to k/k^2 (IC)
        responsibility: scope

  asymptotic_claim:
    problem: >-
      Symmetry group available to Pollard rho on the prime-order subgroup
      of the five composite-degree ANSI X9.62 binary curves (c2pnb* family)
    prior_best: Rho with negation only, order-2 symmetry
    time_exponent: 1/2 (unchanged); this record moves a constant divisor
    memory_exponent: unchanged
    hidden_cofactor: >-
      A3 Aut(E)=Z/2 until Stage 1 source-read discharge; if Aut larger,
      divisor becomes |Aut(E)|*k/2 with possible double-counting vs [-1]
    claim_kind: constant_factor

  heuristic_assumptions:
    - id: HEUR-BINSTD-128789-H0
      formal_statement: >-
        NONE FOR (A)/(B) GROUP-ORDER CORE. ord(mu)=k given k prime and
        mu!=1 is unconditional; pi_2-versus-pi_q distinction is
        unconditional on audited B-notin-F_2. Recorded so absence is
        explicit.
      random_model_justification: >-
        RIGOROUS: Lagrange on cyclic group of prime order k; definition
        of Frobenius as endomorphism requiring coefficients fixed.
      supporting_results:
        - ref: IDEA-20260922-c07598
          provenance: internal
          claim: Derivation of |<pi_q,[-1]>|=2k and named 32k error
          verified_by: coordinator, this design session (Read, full proposal)
        - ref: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-c07598.yaml
          provenance: internal
          claim: Core argument steps hold; gcd(h,r)=1 re-derived 5/5
          verified_by: coordinator, this design session (Read, full review)
        - ref: analysis/binstd-curve-audit/
          provenance: internal
          claim: A,B in F_{2^16}; B notin F_2; audited t,h,r
          verified_by: coordinator, this design session (path present; Stage 0 rechecks)
      validation_experiment_ids:
        - EXP-BINSTD-9d1b8e
      falsification_condition: >-
        Stage 0 finds gcd(h,r)!=1 on any row, or Stage 2 finds
        ord(pi_q)!=k' on a prime-k' cell with a verified prime-order point.
    - id: HEUR-BINSTD-128789-H1
      formal_statement: >-
        A3 AUT(E)=Z/2. For ordinary binary curves y^2+xy=x^3+a x^2+b with
        j=1/b !=0, Aut(E) over the algebraic closure is {+-1}. Audited
        odd traces place all five away from the supersingular j=0 locus.
        a=0 on c2pnb208w1 affects Tr(a) only, not j (HOLD-B).
      random_model_justification: >-
        Classical char-2 automorphism-group classification (Silverman
        Appendix A / equivalent; RECALLED until Stage 1 reads at source).
      supporting_results:
        - ref: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-c07598.yaml
          provenance: internal
          claim: >-
            HOLD-B A3 closure sketch via j=1/b and odd traces; a=0 red
            herring dropped
          verified_by: coordinator, this design session (Read)
        - ref: 'Silverman, The Arithmetic of Elliptic Curves, Appendix A (char 2 Aut classification)'
          provenance: recalled
          claim: Aut(E)={+-1} when j!=0 in char 2
          verified_by: null
      validation_experiment_ids:
        - EXP-BINSTD-9d1b8e
      falsification_condition: >-
        Stage 1 source read shows Aut(E) larger than Z/2 for a j!=0
        ordinary binary curve of this shape, OR any of the five has j=0
        (contradicting ordinary/odd-trace audit).
    - id: HEUR-BINSTD-128789-H2
      formal_statement: >-
        COMPOSITE-K' PROPER-DIVISOR OBSERVABILITY IS A SEARCH, NOT A FORCE.
        There EXISTS at least one ordinary subfield curve E/F_{2^d} and
        composite k' with dk'<=41 such that ord(mu) is a proper divisor
        of k' on a prime-order subgroup of E(F_{q^{k'}}). Failure to find
        one within the search budget weakens the nearby-object control
        (does not refute the prime-k derivation).
      random_model_justification: >-
        ord(mu) is a proper divisor iff r divides #E(F_{q^{k'/p}}) for
        some prime p|k' — curve-dependent (HOLD-B counterexample on the
        review's first (4,6) attempt).
      supporting_results:
        - ref: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-c07598.yaml
          provenance: internal
          claim: Prediction 2 defective as forced; reword as curve search
          verified_by: coordinator, this design session (Read)
      validation_experiment_ids:
        - EXP-BINSTD-9d1b8e
      falsification_condition: >-
        Search exhausts declared budget with zero proper-divisor hits AND
        no instrument defect — control marked incomplete (empirical_only),
        not a refutation of (A).

  structural_ingredients:
