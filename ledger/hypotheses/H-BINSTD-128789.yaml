      experiments/EXP-BINSTD-9d1b8e/implementation/. Stage 1: literature
      retrieval + extraction notes. Stage 2: reuse
      experiments/EXP-CERTBIN-e94b27/impl/{curve,gf2n}.py (numpy-free port
      authorized if needed); order-finding by iterating pi_q on h*P.
    budget:
      wall_clock_seconds: 43200
      memory_gb: 4
      maximum_runs: 30

  falsification_conditions:
    - >-
      Stage 0: gcd(h,r)!=1 on any row, or corrected rho bits disagree by
      >0.01 from frozen expected after recompute from audit r.
    - >-
      Stage 2: ord(pi_q) != k' on a prime-k' cell with a certificate-verified
      prime-order point — k-prime argument or instrument wrong.
    - >-
      Stage 2: pi_2 acts as an endomorphism on a B-notin-F_2 cell (or on a
      deployed row after audit contradiction) — (B) collapses for that curve.
    - >-
      Stage 1 source read shows Aut(E) > Z/2 for j!=0 ordinary binary curves
      of this shape, or any of the five has j=0 — revise the "2" in 2k.
    - >-
      Null control reports a finite order for a non-existent pi_q
      endomorphism — instrument invalid.

  interpretation_limits:
    - THIS HYPOTHESIS DOES NOT CLAIM A BREAK OR A NEW ATTACK.
    - Constant-factor bookkeeping only; time exponent remains 1/2.
    - A3 is NOT discharged until Stage 1 upgrades the Aut classification
      to provenance retrieved with verified_by.
    - Reused d11575/c07598 rho figures are audit columns only; lane baseline
      after this experiment is the corrected sqrt(pi*r/(4k)) column.
    - Composite-k' control incompleteness is not a refutation of (A).
    - >-
      ECC2K-130: methodological transfer of the same derivation; no 16-fold
      conflation possible (E over F_2).
    - Stages 0-2 only; no deployed-curve group walks.

  distinguishable_outcomes:
    - id: DO-1-ledger-certified
      description: >-
        Stage 0 arithmetic passes; Stage 2 prime cells return ord=k';
        pi_2 fails; Stage 1 discharges A3 (or records unrecovered with A3
        still open) — 2k ledger certified under stated scope.
      next_decision: support_scoped_symmetry_ledger_promote_or_note_A3
    - id: DO-2-a3-revises-factor
      description: >-
        Stage 1 or later Aut check finds Aut(E)>Z/2 on a deployed row —
        revise the "2" in 2k for that row and every dependent number.
      next_decision: weaken_revise_aut_factor
    - id: DO-3-prime-order-fail
      description: >-
        Stage 2 prime-k' cell shows ord(pi_q)!=k' with verified point —
        supersede hypothesis / repair instrument.
      next_decision: supersede_or_repair
    - id: DO-4-pi2-endomorphism-on-target
      description: >-
        pi_2 is an endomorphism on a B-notin-F_2 cell or audit contradicts
        B-notin-F_2 — (B) collapses; revise toward 16k*2 for that row.
      next_decision: revise_galois_conflation
    - id: DO-5-instrument-invalid
      description: Null/certificate/degenerate controls fail.
      next_decision: repair_executor_no_status_change

