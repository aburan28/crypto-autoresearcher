hypothesis:
  id: H-PFDR-9c5065
  question_id: RQ-JINV-8fc13a
  source_idea_id: IDEA-20260901-f375a9
  batch_id: BATCH-c64bee
  title: >-
    A nondegenerate self-pairing would recover the secret outright, which is
    exactly why it is forced trivial: Galois equivariance puts t_N(P, P) in the
    intersection of the N-th roots of unity with the base field, trivial above
    embedding degree 1, on EVERY ordinary curve -- so the special-j pairing
    question is not a pairing question but an EMBEDDING-DEGREE DISTRIBUTION
    question, which depends on the pair (p, N) alone and is therefore settled by
    a CURVE-FREE sweep. The derivation is ALREADY COMMITTED in this corpus as
    argument C of H-PAIR-713241 and is not claimed as new here.
  statement: >-
    Four statements. P1 and P2 are derivations, C is the collapse they force, and
    M is the measurement.
    (P1) THE AUTOMORPHISM SUPPLIES NO DISTORTION. Let E over F_p be ordinary with
    p > 3, G the subgroup of prime order N, and alpha an automorphism acting on G
    as the scalar lambda. The Weil pairing is alternating, so a point pairs
    trivially with itself, and therefore e_N(P, alpha P) = e_N(P, P)^lambda = 1
    identically. The extra automorphism at the special j-invariants, which is the
    entire content of the square-root-of-the-automorphism-count discount,
    contributes NOTHING to any Weil-pairing construction on G.
    (P2) THE SELF-PAIRING IS TRIVIAL WHENEVER THE EMBEDDING DEGREE EXCEEDS 1, ON
    EVERY ORDINARY CURVE. Let k be the embedding degree and t_N the reduced Tate
    pairing with values in the N-th roots of unity inside the degree-k extension.
    The reduced pairing is Galois equivariant, and P is fixed by the base-field
    Frobenius, so t_N(P, P) is Galois-fixed and therefore lies in the base field;
    it also lies in the N-th roots of unity, and that intersection is trivial
    unless N divides p - 1, i.e. unless k = 1. The argument uses only that P is
    rational and is completely insensitive to the j-invariant, to the
    discriminant, to the automorphism count and to the class group.
    (C) THE COLLAPSE. By bilinearity t_N(Q, Q) = t_N(P, P)^{s^2} for Q = [s]P. So
    if t_N(P, P) were a primitive N-th root of unity and computable, one pairing
    evaluation on each of P and Q plus one finite-field discrete logarithm
    recovers the square of the secret modulo N, hence the secret up to sign,
    settled by one scalar multiplication. THE SELF-PAIRING IS NOT A SOURCE OF
    PARTIAL INFORMATION -- IT IS EITHER THE WHOLE SECRET OR NOTHING. Combined with
    P2, the nothing branch is forced for every embedding degree above 1, and the
    whole-secret branch requires embedding degree 1, where the classical transfer
    already maps the problem into the base field, so the self-pairing adds
    nothing even there. CONSEQUENTLY the question "does special j confer extra
    pairing structure beyond the automorphism discount" is exactly and only the
    question "is the embedding-degree distribution of special-j classes different
    from that of matched generic classes at the same p" -- a curve-GENERATION
    statistic about a population, not a property of a j-invariant acting on an
    instance.
    (D) THE PRIORITY STATEMENT, WHICH THIS RECORD ADDS AND WHICH THE SOURCE IDEA
    FLAGGED AS AN UNREAD DUPLICATION RISK. The argument in P2 is ALREADY COMMITTED
    IN THIS CORPUS. H-PAIR-713241, read in full by this coordinator on 2026-09-04,
    carries it verbatim as ARGUMENT C: that the Tate-Lichtenbaum pairing is Galois
    equivariant, that points of G lie in the kernel of Frobenius minus one, that
    the value therefore lies in the intersection of the N-th roots of unity with
    the base field, and that if the embedding degree exceeds 1 the pairing
    restricted to G x G is identically 1, self-pairings included. That record also
    already carries the embedding-degree-1 planted positive control. NOTHING IN P2
    IS NEW TO THIS CORPUS, and this record may not claim it. What is new here is
    the SCOPE STATEMENT for the j-invariant question -- that the pairing route is
    not an open question for it and that the only live sub-question is
    distributional -- together with the matched-generic comparison at fixed p that
    the pairing lane does not perform.
    (E) THE MEASUREMENT AND ITS THREE RIVAL EXPLANATIONS, AT MATCHED p. The null:
    the triple (embedding degree, self-pairing, automorphism Weil pairing) is
    (large, 1, 1) on every enumerated special-j class exactly as on every
    enumerated generic class, and the empirical embedding-degree distributions are
    indistinguishable. The nondegenerate branch: a nontrivial self-pairing is
    measured at embedding degree above 1, which refutes P2, contradicts Galois
    equivariance, and would simultaneously be an ECDLP break on that curve -- it
    first indicts the implementation and requires independent review before any
    description. The embedding branch: the special-j embedding-degree distribution
    is shifted toward small values relative to matched generic classes, which is
    an advantage on the DATA axis -- a higher density of transfer-vulnerable
    instances in special-j curve generation -- and triggers the goal pause
    condition before any description.
    (F) THE CURVE-FREE ATTRIBUTION. The embedding degree is the multiplicative
    order of p modulo N and depends on the pair (p, N) ALONE, with no curve
    equation anywhere in it. The distribution arm is therefore reproducible on a
    curve-free (p, N) sweep, and if the curve-free sweep reproduces the result the
    finding is a statement about the joint distribution of (p, N) under the
    complex-multiplication constraint and NOT about j-invariants acting on
    instances. That attribution is pre-stated, not discovered afterwards.
  mechanism: >-
    Every pairing-based attack needs two things: a bilinear map nondegenerate on
    the pair of arguments it is given, and a way to compute it. Both arguments
    here are the SAME point, so the first requirement becomes self-pairing
    nondegeneracy, and that is settled by a symmetry argument rather than by any
    property of the curve: the value of a Galois-equivariant pairing on a pair of
    Galois-fixed points is itself Galois-fixed, and the only Galois-fixed N-th
    root of unity is 1 unless the roots of unity are already rational, which is
    the definition of embedding degree 1. The automorphism does not help because
    it is an endomorphism, so it acts on G as a scalar, and a scalar passes
    through a bilinear form as an exponent, leaving an alternating form
    alternating.
    WHAT IS LEFT IS ARITHMETIC AND NOT GEOMETRY. Whether N divides p^k - 1 for
    small k depends on p and N and not on the shape of the curve equation. The
    reason special j LOOKS pairing-relevant is a SELECTION EFFECT: the
    complex-multiplication equation at the smallest discriminant admits convenient
    polynomial parametrisations, so pairing-friendly families are BUILT there.
    That is a fact about how curve designers search, not about how randomly drawn
    curves behave, and it is the most likely source of a spurious expectation in
    this lane.
    THE SHARP EDGE OF THE PROJECTION, STATED RATHER THAN HIDDEN. The tracked
    triple propagates deterministically and exactly under scalar multiplication,
    by bilinearity: the self-pairing of a scalar multiple is the self-pairing
    raised to the square of the scalar. A projection that equivariant is
    suspicious in exactly the way the protocol warns about: if it retained a
    nontrivial value it would recover the secret, so it would not be lossy in any
    useful sense -- it would be the secret in disguise. The claim is that the
    projection is lossy precisely BECAUSE the retained value is forced trivial,
    and identifying the forcing mechanism is the deliverable.
  assumptions:
    - >-
      E over F_p ordinary, p > 3, N prime dividing the group order, N not equal
      to p, and the rational N-torsion cyclic, which holds when N squared does not
      divide the group order. Classes with full rational N-torsion are EXCLUDED,
      counted and reported rather than silently dropped.
    - >-
      The Weil pairing is alternating and the reduced Tate pairing is Galois
      equivariant. These are the two load-bearing external facts and both are
      reproduced in the statement so a reviewer can check the argument without a
      library; both are ALSO already carried, unverified, in H-PAIR-713241 own
      structural ingredients, whose provenance there is recalled with a null
      verifier.
    - >-
      Every endomorphism acts as a scalar on the prime-order subgroup. Used as an
      admissibility filter and not retested; it is what makes P1 a one-liner.
    - >-
      Toy scale, p up to about 2^24 for the census, so the embedding degree can be
      computed exactly and the pairing evaluated for the small-embedding-degree
      cells. For classes with large embedding degree the pairing is NOT evaluated
      and the record says so: the triviality claim is DERIVED there and not
      measured, and that boundary is stated rather than blurred.
    - >-
      Lawful defensive work on public constructions and toy benchmarks only. The
      special-j family includes deployed curves, so any embedding-branch finding
      is reported as a family-level scope statement and never as an attack on a
      named system.
  proof_search_map:
    bottleneck: >-
      Whether any bilinear construction available on a SINGLE rational point can
      be made nondegenerate. It is the only step that decides whether the pairing
      route is open for this question at all; everything else in the pairing
      literature is downstream of having two independent arguments, which an
      ordinary curve does not supply.
    baseline_embedding:
      parameter_slice: >-
        Embedding degree 1, where the N-th roots of unity lie in the base field,
        P2 conclusion does not apply, the self-pairing may be nondegenerate, and
        the known state of affairs is recovered exactly: the classical transfer
        maps the problem into the base field. The argument must NOT exclude this
        slice, and reproducing it is the proves-too-much check.
      reproduction_check: >-
        FROZEN FIXTURE, BLOCKING, AND IT IS THE POSITIVE CONTROL. Construct a toy
        ordinary curve with embedding degree 1, require a NONTRIVIAL t_N(P, P),
        and recover the secret from the square relation, verified by an
        independent on-curve check. If the instrument cannot exhibit a
        nontrivial self-pairing where one provably exists, its triviality reports
        everywhere else carry NO INFORMATION WHATEVER and the run is void. THIS
        IS THE SINGLE MOST IMPORTANT CONTROL IN THE RECORD, and it is also
        already specified in H-PAIR-713241, so the two contracts must share the
        fixture rather than build it twice.
    observation_collision:
      observable: >-
        The triple (embedding degree, reduced Tate self-pairing, automorphism
        Weil pairing).
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, WHICH IS THE RESULT AND NOT A
        FALSIFIER. A curve at each special j-invariant and a generic curve at the
        same p with the same embedding degree are three distinct ground-truth
        objects with the SAME observable (k, 1, 1). That collision establishes
        that the self-pairing observable cannot distinguish special j from
        generic j, and therefore that no pairing-based argument in this lane may
        lean on the automorphism giving an extra pairing. Reporting a
        pairing-based special-j claim without exhibiting this collision is
        prohibited.
        A SECOND, DANGEROUS COLLISION IS HUNTED: a curve whose pairing is
        genuinely trivial and a curve whose pairing the IMPLEMENTATION merely
        failed to compute both report 1. The separating data are the
        embedding-degree-1 positive control and an explicit computed-or-derived
        flag per class, which is a required metric.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold "the self-pairing is trivial" fixed and vary the forgotten
          structure -- the j-invariant, the discriminant, the automorphism count,
          the class group. The intrinsic invariant distinguishing the objects on
          which the conclusion changes is NONE OF THEM: it is the embedding
          degree, an invariant of the pair (p, N) alone.
        predicted_gain: >-
          Relocates the question from the curve to (p, N), which is a
          curve-generation statistic. A PROHIBITION rather than a speedup: it
          forbids every downstream argument in this lane that leans on special-j
          pairing structure.
      - transform: representation_reduction
        proposed_object: >-
          Move the problem into the N-th roots of unity via the self-pairing,
          where the hypothesis becomes an exact exponent relation in the square of
          the secret. Encoding exact; completeness holds only when the
          self-pairing is nondegenerate; soundness up to a sign resolved by one
          scalar multiplication.
        predicted_gain: >-
          ZERO for embedding degree above 1, because the completeness obligation
          fails by P2 -- and identifying exactly WHICH obligation fails is the
          deliverable. At embedding degree 1 the gain is real but is already held
          by the classical transfer, so the transform adds nothing there either.
    quantifier_order: >-
      CLAIMED FOR P2, IN THIS ORDER. FOR ALL primes p > 3, FOR ALL ordinary E
      over F_p, FOR ALL primes N dividing the group order with cyclic rational
      N-torsion and embedding degree above 1, FOR ALL P in E(F_p) of order N:
      t_N(P, P) = 1. The universal quantifier over P comes LAST and is the
      content.
      THE WEAKER READING EXPLICITLY NOT CLAIMED: that for every curve there
      EXISTS a P with trivial self-pairing, which is vacuous since the identity
      works. THE STRONGER READING EXPLICITLY NOT CLAIMED: anything about pairings
      whose arguments lie outside the base-field points, where the second
      eigenspace supplies a genuinely independent point and the classical
      reduction applies with all its known cost.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On every ordinary prime-field curve with embedding degree above 1, the
        reduced Tate self-pairing and the automorphism Weil pairing on the
        prime-order subgroup are identically trivial, so no pairing construction
        on a single rational point yields any information about the secret; and,
        over the enumerated classes at the tested primes, the embedding-degree
        distribution of special-j classes does or does not differ from matched
        generic classes." IT CAN NEVER CERTIFY anything about constructions using
        points outside the base-field group, anything about supersingular curves
        where distortion maps exist and the whole argument changes, anything about
        cryptographic-scale embedding-degree statistics beyond what is
        enumerated, and nothing about ECDLP hardness.
      nearby_object_control: >-
        THE OBJECT WHERE THE HOPED-FOR CONCLUSION FAILS: the SUPERSINGULAR curve,
        where the endomorphism ring is non-commutative, distortion maps exist and
        the modified self-pairing IS nondegenerate. A method that reports
        triviality there is not measuring pairings at all. Supersingular curves
        are OUTSIDE this question declared scope, so using this control requires
        an explicit Coordinator scope decision; if it is refused, the
        embedding-degree-1 ordinary positive control carries the
        instrument-validation load ALONE and the record must say so rather than
        reporting an unfalsifiable constant.
    proof_obligations:
      - claim: 'The Weil pairing is alternating, so a point pairs trivially with itself.'
        responsibility: correctness
      - claim: 'The automorphism acts as a scalar on G, so the automorphism Weil pairing is trivial.'
        responsibility: correctness
      - claim: >-
          Galois equivariance forces the self-pairing into the intersection of
          the N-th roots of unity with the base field, trivial unless the
          embedding degree is 1.
        responsibility: strictness
      - claim: >-
          Bilinearity gives the square relation, so a nondegenerate self-pairing
          solves the instance.
        responsibility: correctness
      - claim: >-
          The embedding-degree-1 positive control returns a nontrivial
          self-pairing and recovers the secret, certified independently.
        responsibility: feasibility
      - claim: >-
          The distribution comparison is made at matched p over COMPLETE class
          enumerations rather than samples, with the class as the unit of
          analysis.
        responsibility: baseline
      - claim: >-
          The CURVE-FREE (p, N) sweep reproduces the distribution arm, and the
          attribution is stated at that granularity.
        responsibility: scope
      - claim: >-
          P2 is recorded as ALREADY COMMITTED in this corpus as argument C of
          H-PAIR-713241 and is not claimed as new.
        responsibility: scope
      - claim: >-
          The record claims nothing about points outside the base-field group and
          nothing about supersingular curves.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        EMBEDDING-DEGREE INDEPENDENCE OF j. For ordinary isogeny classes
        enumerated at a fixed prime p, the embedding degree is distributed as the
        multiplicative order of a fixed element in a cyclic group, independently
        of the fundamental discriminant and hence of j; formally, for every bound
        B, the probability that the embedding degree is at most B conditioned on
        the special discriminant equals the unconditional probability up to o(1),
        the unconditional probability being at most B squared over 2N by the count
        of elements of small order.
      random_model_justification: >-
        RIGOROUS PART: the embedding degree depends only on (p, N) and not on the
        curve equation at all, so any j-dependence must come through the joint
        distribution of (p, N) across classes rather than through j directly; and
        the count of elements of order at most B in a cyclic group of order N - 1
        is at most B squared over 2, which is the unconditional bound.
        WHAT IS HEURISTIC is only that conditioning on the special discriminant
        does not bias the joint distribution of (p, N) -- AND IT PLAINLY BIASES IT
        SOMEWHAT, since N is then constrained by the complex-multiplication
        equation to a thin set. The distribution imitated is the standard
        heuristic that the multiplicative order behaves like the order of a random
        element. WHY IT COULD FAIL, STATED HONESTLY: a small embedding degree
        requires N to divide a specific small integer built from p, and the
        complex-multiplication constraint restricts N to a thin set; whether the
        two constraints interact is exactly what the distribution arm measures,
        and asserting they do not would be assuming the answer.
      supporting_results:
        - ref: H-PAIR-713241
          provenance: internal
          claim: >-
            Argument C in its mechanism -- Galois equivariance, the intersection
            of the N-th roots of unity with the base field, and triviality above
            embedding degree 1 -- together with its prediction that the
            association between a nontrivial self-pairing and any
            complex-multiplication datum at fixed (p, N) is exactly zero, and its
            embedding-degree-1 planted positive control.
          verified_by: coordinator, TASK-20260904-9c61a9 (record read in full)
      validation_experiment_ids:
        - EXP-PFDR-ccae87
      falsification_condition: >-
        A count of special-j classes with embedding degree at or below a declared
        bound exceeding the matched generic count by more than three Poisson
        standard deviations, at any of the three declared bounds, over the
        complete enumeration.
    - id: HEUR-002
      formal_statement: >-
        PAIRING-IMPLEMENTATION ADEQUACY. The implemented reduced Tate pairing
        returns, for every input, an element whose order divides N, and returns a
        primitive N-th root of unity on at least one input pair for which
        nondegeneracy is provable, namely the embedding-degree-1 control.
      random_model_justification: >-
        RIGOROUS PART: the reduced pairing image lies in the N-th roots of unity
        by construction, so the order check is a necessary condition that a
        correct implementation passes automatically and a mis-exponentiated one
        fails. No distribution is imitated; this is an implementation-adequacy
        assumption of the same kind as a regression fixture, stated separately so
        that an implementation objection cannot be confused with an objection to
        P2.
      supporting_results: []
      validation_experiment_ids:
        - EXP-PFDR-ccae87
      falsification_condition: >-
        Any evaluated value whose order does not divide N, or a trivial value on
        the embedding-degree-1 control. The triviality arm is void and the run
        returns to the executor as a defect, never as support for the null.
  structural_ingredients:
    - description: >-
        Galois equivariance of the reduced Tate pairing and the alternating
        property of the Weil pairing.
      citation: 'standard pairing theory; reproduced in the statement so it can be checked without a library'
      provenance: recalled
      verified_by: null
      role: >-
        the two load-bearing external facts. Also carried, with the same recalled
        provenance and a null verifier, in H-PAIR-713241 own structural
        ingredients -- so this corpus has never verified them and both records
        owe the same transcription.
    - description: >-
        The already-committed form of the same argument, and the
        embedding-degree-1 planted positive control it already specifies.
      citation: 'ledger/hypotheses/H-PAIR-713241.yaml, mechanism ARGUMENT C and its baseline_embedding'
      provenance: internal
      verified_by: coordinator, TASK-20260904-9c61a9 (record read in full)
      role: >-
        PRIORITY. P2 is not new to this corpus. The contract must share the
        control fixture with the pairing lane rather than rebuild it.
    - description: >-
        The classical transfer of the elliptic-curve discrete logarithm into a
        finite-field discrete logarithm at small embedding degree, and the
        nonexistence of distortion maps on ordinary curves.
      citation: >-
        Menezes, Okamoto and Vanstone; Frey and Rueck; Verheul on the
        nonexistence of distortion maps on ordinary curves
      provenance: recalled
      verified_by: null
      role: >-
        the known baseline at embedding degree 1 and the reason the automorphism
        supplies nothing. Not opened by any agent under this task.
  reduction_chain:
    core_problem: >-
      No attack problem is reduced. The core statement is a SCOPE STATEMENT: the
      pairing route is closed for this question and the residual live question is
      distributional.
    corollaries: []
  predictions:
    - metric: >-
        P1 -- t_N(P, P) over every enumerated ordinary class with embedding degree
        above 1, computed where the extension arithmetic is affordable. UNITS:
        element of the N-th roots of unity, reported by its multiplicative order
      direction: different
      minimum_effect: >-
        EXACTLY 1 on every curve, ZERO exceptions. A single nontrivial value
        falsifies P2, contradicts Galois equivariance, and simultaneously
        constitutes an ECDLP break on that curve; it FIRST indicts the
        implementation and requires independent review before any description.
    - metric: >-
        P2 -- e_N(P, alpha P) on every special-j class. UNITS: element of the
        N-th roots of unity, reported by its order
      direction: different
      minimum_effect: >-
        EXACTLY 1 on every curve. This is the pairing-side statement of the
        automorphism-discount null, and its confirmation is what licenses the lane
        to stop looking here.
    - metric: >-
        P3 -- the EMBEDDING-DEGREE-1 POSITIVE CONTROL: t_N(P, P) nontrivial and
        the secret recovered from the square relation. UNITS: order of the value;
        pass or fail on the certificate
      direction: different
      minimum_effect: >-
        NONTRIVIAL on at least one control curve, with the secret recovered and
        certified by an on-curve check performed by code sharing no state with the
        producer. BLOCKING AND IT IS THE DYNAMIC-RANGE DEMONSTRATION: if the
        instrument returns 1 here it cannot detect a nondegenerate self-pairing at
        all and every triviality report elsewhere is void.
    - metric: >-
        P4 -- DECAY PARAMETER: the pairing value swept over embedding degree 1, 2,
        3, 4 where classes exist. UNITS: order of the value
      direction: different
      minimum_effect: >-
        The predicted shape is a STEP: nontrivial at embedding degree 1 and
        identically trivial at every degree above. A quantity that instead decays
        smoothly with the embedding degree is measuring numerical precision or a
        wrong final exponentiation, not the pairing, and is the canonical artifact
        tell.
    - metric: >-
        P5 -- empirical embedding-degree distribution over special-j classes
        versus matched generic classes at the same p, over the COMPLETE class
        enumeration at each tested prime, by an exact permutation test over class
        labels. UNITS: distribution over positive integers
      direction: different
      minimum_effect: >-
        PRE-REGISTERED EXPECTATION OF NO DIFFERENCE. THE POWER OF THIS ARM IS
        COMPUTED AND REPORTED IN STAGE 0 BEFORE THE COMPARISON RUNS: special-j
        classes number ONE PER PRIME, so the effective sample size is the number
        of primes swept and not the number of curves, and the minimum detectable
        shift at the declared prime range is stated in advance. An arm whose
        computed power cannot detect the shift of interest is reported as
        UNDERPOWERED rather than as an absence of difference.
    - metric: >-
        P6 -- count of enumerated special-j classes with embedding degree below a
        declared bound, against the matched generic count, at THREE declared
        bounds fixed in Stage 0. UNITS: integer counts
      direction: different
      minimum_effect: >-
        Equal within the Poisson interval. The predicted SHAPE is equality, not a
        trend, and the bounds are declared in advance so that a difference cannot
        be manufactured by choosing the bound after the fact.
    - metric: >-
        P7 -- CURVE-FREE (p, N) SWEEP: the identical embedding-degree distribution
        comparison computed from (p, N) pairs alone, with no curve constructed and
        no pairing evaluated, over a wider prime range. UNITS: distribution
      direction: different
      minimum_effect: >-
        MEASURED AND REPORTED BESIDE THE CURVE ARM. The embedding degree is the
        multiplicative order of p modulo N and contains no curve, so the sweep is
        expected to reproduce the curve arm exactly up to the class weighting.
        BLOCKING FOR ATTRIBUTION: when it does, the finding is a statement about
        the joint distribution of (p, N) under the complex-multiplication
        constraint and NOT about j-invariants acting on instances, and no artifact
        may describe it otherwise. The transfer assumption of the wider sweep --
        that it is the same population up to the class weighting -- is DECLARED
        rather than assumed.
    - metric: >-
        P8 -- fraction of enumerated classes on which the pairing was actually
        COMPUTED rather than derived. UNITS: fraction, reported per prime
      direction: higher
      minimum_effect: >-
        REPORTED EXPLICITLY PER PRIME. A triviality claim on a class whose pairing
        was never evaluated is a DERIVATION and must be labelled one; conflating
        the two would let an implementation failure masquerade as a mathematical
        null, which is the single most likely way this record could be worthless
        while looking clean.
    - metric: >-
        P9 -- count of classes excluded for full rational N-torsion, with reasons.
        UNITS: integer
      direction: different
      minimum_effect: >-
        REPORTED, never silently dropped. Full rational N-torsion breaks the
        cyclicity assumption and can occur at toy scale where N is small relative
        to p.
  test_boundary:
    instances:
      - 'the complete ordinary isogeny-class enumeration at three toy primes'
      - 'matched generic-discriminant classes at the SAME p, through the identical code path'
      - 'a constructed ordinary curve with embedding degree 1 (BLOCKING positive control)'
      - 'CURVE-FREE: a (p, N) sweep with no curve constructed and no pairing evaluated'
    parameters:
      p_for_census: 'up to about 2^24, so the embedding degree is exact and full class enumeration is feasible'
      p_for_curve_free_sweep: 'a wider declared range, with the class-weighting transfer assumption declared'
      embedding_bounds: 'three values declared in Stage 0 and never adjusted afterwards'
      unit_of_analysis: >-
        THE CLASS, because the embedding degree is a class invariant. Pooling over
        the roughly 2 sqrt(p) curves of a class would inflate every sample size by
        the class size and manufacture significance from nothing.
    implementation: >-
      Exact embedding-degree computation per class; reduced Tate pairing WITH
      explicit final exponentiation, every reported value checked as an N-th root
      of unity before it is reported; an independent on-curve certificate verifier
      sharing no state with the producer. Mandatory matched baselines are Pollard
      rho with distinguished points and BSGS, with the automorphism-discounted
      variant on special-j instances, per this question own constraints. The
      distribution arm needs no curve construction and no pairing at all, which is
      why the two arms have different declared ranges.
    budget:
      wall_clock_seconds_per_run: 1800
      total_cpu_hours: 6
      maximum_memory_gb: 8
      maximum_runs: 150
  falsification_conditions:
    - >-
      F1 ZERO COMPUTE, PRIMARY. A counterexample to P2 on paper -- a
      Galois-equivariance or alternating-property misapplication. The derivations
      are one line each, so a counterexample means the argument is being
      misapplied and the record is withdrawn by a superseding proposal.
    - >-
      F2 THE CONSEQUENTIAL FALSIFIER. A measured nontrivial reduced self-pairing
