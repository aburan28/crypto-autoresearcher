hypothesis:
  id: H-PFDR-f73cc9
  question_id: RQ-PAIR-f2e31f
  goal_id: GOAL-PAIR-001
  added: '2026-09-04'
  derived_from_idea: IDEA-20260818-1fb37d
  batch_id: BATCH-2c45e2
  statement: >-
    A PUBLISHED SECURITY LEVEL FOR A PAIRING TARGET FIELD IS THE VALUE OF A COST
    FUNCTION AT ITS MINIMISER, AND THE MINIMISER WAS CHOSEN UNDER AN OBJECTIVE THAT
    PRICES DATA MOVEMENT AT ZERO. The tracked object is the ARGMIN - the parameter
    tuple - followed as a communication price is turned up from zero, not the value.
    Three claims, each separately falsifiable.
    (C1 THE ARGMIN MOVES) Under an objective that charges data movement, either as a
    bounded aggregate bandwidth or as an area-time product on a mesh, the minimiser of
    the extended tower sieve cost function for the target field at the deployed prime
    differs from the published tuple by at least 1.0 in the base-two logarithm of the
    smoothness bound.
    (C2 THE VALUE MOVES) The total cost at the re-optimised tuple differs from the cost
    of the published tuple evaluated under the SAME charged objective by at least 8
    bits. That gap is non-negative by construction, since re-optimisation cannot hurt
    the modelled attacker, so all the informative content is in its magnitude.
    (C3 THE LEVEL IS NOT A SCALAR) The set of tuples within 1 bit of optimal spans a
    memory range of at least a factor of 2 to the 10, so a bit level does not determine
    the attacker's resource profile even after the objective is fixed.
    NOTHING HERE ASSERTS THAT ANY DEPLOYED CURVE IS BROKEN OR SAFE, and no such
    statement is derivable from any outcome.
  mechanism: >-
    The sieve cost is the sum of a relation-collection term and a linear-algebra term,
    and the published constants come from balancing those two and solving for the
    smoothness bound. Relation collection is compute-bound and embarrassingly parallel
    with negligible inter-worker traffic. The linear algebra is a blocked Krylov
    iteration whose every pass streams the entire sparse matrix, with an arithmetic
    intensity of order one modular multiply-add per byte moved, so on any machine whose
    flop-to-byte ratio exceeds order one it is bandwidth-bound and its operation count
    is not its cost. The two terms therefore respond DIFFERENTLY to a communication
    price, the price enters them with different exponents in the smoothness bound, and
    the balance point moves. The structural ingredient is that the same substitution -
    replace the operation count by an area-time cost and then RE-OPTIMISE rather than
    re-evaluate - is reported to move a complexity constant rather than a constant
    factor in the non-tower setting; transplanting that move to the tower case, where
    the factor base is indexed by ideals of a tower ring and the vectors are over a
    large prime modulus rather than over two elements, is what this record proposes.
  band_non_degeneracy:
    checked_by: TASK-20260904-5423ad
    finding: >-
      THE THREE BANDS ARE NON-DEGENERATE AND THE CHECK IS RECORDED RATHER THAN
      ASSUMED. C1 asks for a displacement of at least 1.0 in the base-two logarithm of
      the smoothness bound; a displacement of exactly zero is attainable and is what
      occurs if the communication term enters with the same exponent in the smoothness
      bound as an existing term, so both sides of the band are reachable. C2 asks for a
      gap of at least 8 bits; the gap is non-negative by construction but its magnitude
      is free and small values are attainable, which the record states explicitly so
      the one-sidedness is not mistaken for a prediction. C3 asks for a memory span of
      at least a factor of 2 to the 10 across the one-bit level set; a narrow level set
      is attainable and would mean the bit level IS well defined once the objective is
      fixed.
      THE ONE STATEMENT IN THE SOURCE IDEA WITH NO BAND IS ITS OBSERVATION THAT A
      CHARGED COST IS NEVER BELOW THE FREE OPERATION COUNT. That is true by definition
      of adding a non-negative term and is recorded as a definitional remark rather than
      as a prediction.
      THE REAL FRAGILITY IS ELSEWHERE AND IS ADDRESSED. The random-functional control -
      replacing the physically derived communication term by an arbitrary smooth term
      of matched magnitude - is what separates the physics of data movement from the
      optimiser's bare sensitivity, and as the source idea states it, a single random
      draw would give no distribution to compare against.
    change_made: >-
      The random-functional control is specified as at least 20 draws with exponents
      sampled from a declared range, and the physically derived term's argmin
      displacement must exceed the 95th percentile of the random draws' displacements.
      A single comparison is replaced by a rank test against a distribution, which is
      what makes that control able to fail.
    alternative_hypothesis_range: >-
      Under H_physics the displacement produced by the derived communication term
      exceeds the 95th percentile of 20 random-functional draws and is at least 1.0 in
      the logarithm of the smoothness bound. Under H_sensitivity the derived
      displacement sits inside the bulk of the random draws, meaning the optimiser
      moves its argmin by that much under ANY perturbation of that magnitude and the
      displacement measures the surface's flatness rather than the physics. The two
      predict different ranks of the same statistic in the same declared distribution.
  assumptions:
  - >-
    An extended tower sieve cost function of the published shape can be written down
    explicitly and correctly from primary sources. THIS IS NOT YET TRUE IN THIS
    PROGRAM, and it is the reason this hypothesis is blocked rather than merely
    uncertain - see blocked_on.
  - >-
    The deployed prime and its subgroup order are taken as published constants and are
    transcription-checked against two independent published statements, not re-derived.
  - >-
    Relation collection's communication is negligible relative to the linear
    algebra's. Stated as an assumption because distributed relation collection has its
    own traffic, and CHECKED rather than assumed by reporting both terms' byte counts.
  blocked_on: >-
    RQ-PAIR-f2e31f CONSTRAINT 1, WHICH TASK-20260904-5423ad READ VERBATIM - no cost
    claim may be recorded before the extended tower sieve reference and at least one
    pairing-curve key-size estimation paper are filed as knowledge-corpus entries. The
    filing session could not reach either primary text and no primary source has been
    read by this program. THIS HYPOTHESIS AND ITS EXPERIMENT ARE DESIGNED BUT MUST NOT
    BE APPROVED OR EXECUTED UNTIL THAT FILING IS DONE BY AN AGENT WITH WORKING
    RETRIEVAL. The block is recorded here rather than deferred to the reviewer.
  proof_search_map:
    bottleneck: >-
      The parameter-balancing step - setting the relation-collection term equal to the
      linear-algebra term and solving for the smoothness bound. Every published bit
      level for a pairing target field passes through that single equation, and its
      right-hand side is where a communication price would enter.
    baseline_embedding:
      parameter_slice: >-
        Communication price zero must reproduce the published operation-count optimum
        for the target field; additionally the degenerate tower slices must reproduce
        their own published constants.
      reproduction_check: >-
        SYMBOLIC, NOT VISUAL. The zero-price stationarity condition must reduce
        algebraically to the published expression for the optimal smoothness bound, and
        the resulting exponent constant must equal the published constant to the
        precision the primary text states. A frozen regression fixture stores the
        symbolic reduction and the constants. A plot that resembles the baseline is not
        an embedding.
    observation_collision:
      observable: >-
        The scalar total cost at a tuple - precisely the observable a quoted bit level
        carries.
      distinct_preimage_search: >-
        DIRECTLY SEARCHED AND EXPECTED TO SUCCEED. Enumerate the level set of tuples
        within 1 bit of the optimum and report the range of memory and of bytes moved
        across it. A collision - two tuples with the same headline cost and memory
        differing by a factor of 2 to the 10 - directly falsifies the identifiability of
        the bit level as a scalar and IS claim C3. It costs no sieve time and is the
        audit most likely to return a positive.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        The cost model re-expressed with the machine model as an explicit parameter, so
        that a security level becomes a function of the bandwidth, the mesh dimension
        and the bytes per entry rather than a scalar.
      predicted_gain: >-
        Converts a disagreement about conventions into an exactly evaluable function.
        The deliverable is the function and its argmin locus, not a number.
    - transform: specialization_pack
      proposed_object: >-
        Separate resource measures for the two stages - compute-seconds for relation
        collection, bytes moved for linear algebra - added only across the two stages,
        which are disjoint in time.
      predicted_gain: >-
        Avoids adding operation counts across stages with incomparable arithmetic
        intensities, which is the standard error in this kind of accounting.
    quantifier_order: >-
      THE PUBLISHED LABEL IMPLICITLY ASSERTS that THERE EXISTS a tuple such that FOR ALL
      attackers the cost exceeds the level. The honest statement is that FOR ALL machine
      models THERE EXISTS a minimising tuple, and the level depends on the model. The
      witness is allowed to depend on the model, which the scalar label forbids. That
      inversion is the record's central methodological point and it is checkable with
      no compute at all.
    method_ceiling:
      strongest_certifiable_claim: >-
        That under a stated machine model and stated conventions, an attacker following
        the modelled pipeline expends at least or at most the reported triple of
        operations, memory and bytes moved. IT CANNOT certify a lower bound on the cost
        of any attack, cannot exclude an unmodelled algorithm, and cannot say whether
        any deployed curve is secure. Reading the output as a security verdict is
        outside the method's ceiling.
      nearby_object_control: >-
        A FIELD FOR WHICH AN EXECUTED RECORD COMPUTATION EXISTS at a scale where the true
        cost is known. If the charged optimiser cannot bracket that record's actual
        resource consumption, it has not identified the load-bearing structure and its
        deployed-parameter output is uninterpretable.
    proof_obligations:
    - claim: 'The zero-price optimiser reproduces the published exponent constant for the target field and for both degenerate slices.'
      responsibility: baseline
    - claim: 'The communication term is derived from the linear-algebra access pattern and is not fitted.'
      responsibility: correctness
    - claim: 'The argmin displacement under a nonzero price is at least 1.0 in the logarithm of the smoothness bound.'
      responsibility: strictness
    - claim: 'Memory and bytes moved at the re-optimised tuple, stated with the entry-size accounting.'
      responsibility: memory
    - claim: 'The one-bit level set spans a memory range of at least a factor of 2 to the 10.'
      responsibility: size
    - claim: 'No statement about deployed-curve security is derivable from the output.'
      responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: >-
      Discrete logarithm in the target field of a deployed pairing-friendly curve, via
      the extended tower number field sieve.
    prior_best: >-
      A subexponential expression with exponent one third and a constant that this
      program has NOT verified against any primary text. Any value quoted before that
      verification would be a fabrication.
    time_exponent: >-
      ONE THIRD, UNCHANGED. The object under study is the CONSTANT, not the exponent,
      and this record does not assert a value for the charged constant. It asserts that
      the constant is obtained by re-solving the same balance under a different
      objective and that the derivation is mechanical once the objective is written
      down. Guessing the value here would be exactly the fabrication the core rules
      forbid.
    memory_exponent: >-
      Memory is the relation matrix, so it is itself subexponential with a constant to
      be reported alongside the time constant. A SCALAR BIT LEVEL WITH NO MEMORY
      STATEMENT IS NOT ADMISSIBLE OUTPUT under RQ-PAIR-f2e31f constraint 2.
    hidden_cofactor: >-
      EVERYTHING. At the target field size the lower-order term in the subexponential
      expression is not a small correction, and this record compounds it with an
      unverified transcription of the cost function, an engineering choice of bytes per
      entry, and a filtering convention. The honest position is that the OUTPUT IS A
      DIFFERENCE between two evaluations of the same instrument, and only the difference
      is defensible; the absolute levels inherit every one of these.
    claim_kind: cofactor_improvement
    claim_kind_note: >-
      The object is a CONSTANT in a subexponential expression, so cofactor_improvement is
      the closest available kind. NO IMPROVEMENT IS CLAIMED IN EITHER DIRECTION - the
      record re-solves a balance under a different objective and reports what comes out.
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: >-
      FOR the relation-collection stage at the modelled parameters, the norm products of
      candidates drawn from the sieving region are smooth with respect to the bound with
      the probability the classical smoothness density gives, uniformly over the region.
    random_model_justification: >-
      The rigorous ingredient is the classical smoothness-count theorem for UNIFORMLY
      RANDOM integers of a given size. THE GAP, STATED RATHER THAN HIDDEN - norm products
      over a sieve region are not uniformly random integers of their size; they are values
      of a fixed form on a lattice and the region's geometry biases them. This heuristic
      asks only that the bias does not change the LAW'S FORM.
    supporting_results: []
    supporting_results_note: >-
      EMPTY. The classical smoothness-count theorem is recalled and unread by this
      program and may not discharge this field under AGENTS.md rule 9.
    validation_experiment_ids:
    - EXP-PFDR-a697f6
    falsification_condition: >-
      The empirical smooth fraction departs from the predicted density by more than a
      factor of 2 at any tested parameter point, WITH the departure growing as the field
      size grows across the tested range. A departure that shrinks with size is a
      small-size artifact and is reported as one.
  - id: HEUR-002
    formal_statement: >-
      FOR the relation matrix at the modelled parameters, the average row weight after
      filtering lies in a stated interval independent of the field size within the
      modelled range, and the post-filter dimension is a fixed fraction of the factor-base
      size.
    random_model_justification: >-
      The rigorous ingredient is that the number of factor-base primes dividing a relation
      is bounded by the logarithm of the norm, and that the matrix's information content
      is bounded below by the logarithm of the number of weight-w rows. THE GAP - the
      actual post-filter dimension and weight are the output of a merge heuristic rather
      than of a theorem, and this assumption imitates the practitioner convention that
      they land in a narrow band.
    supporting_results: []
    supporting_results_note: 'EMPTY for the same reason as HEUR-001.'
    validation_experiment_ids:
    - EXP-PFDR-a697f6
    falsification_condition: >-
      Measured average row weight outside the stated interval at any tested size, or a
      monotone trend in weight across the tested sizes exceeding 20 percent per doubling
      of the logarithm of the field size.
  - id: HEUR-003
    formal_statement: >-
      FOR the blocked Krylov iteration over a large prime modulus, at matrix dimensions
      in the modelled range, the achieved arithmetic intensity in modular multiply-adds
      per byte moved across the memory boundary is below the flop-to-byte ratio of the
      machine class considered, so the step's wall-clock is bandwidth-determined.
    random_model_justification: >-
      The rigorous ingredient is that each sparse matrix-vector product performs exactly
      the dimension times the weight modular multiply-adds and must read at least the
      matrix's information content plus the vector, an order-one flops-per-byte ratio by
      construction. THE GAP - caching, blocking width and vector reuse can raise the
      effective intensity by a factor equal to the blocking width, so this is really the
      claim that the blocking width stays small enough, and the blocking width is itself
      a parameter this record optimises over.
    supporting_results: []
    supporting_results_note: 'EMPTY. The identity is derived; the machine behaviour is measured.'
    validation_experiment_ids:
    - EXP-PFDR-a697f6
    falsification_condition: >-
      Measured arithmetic intensity at or above the host flop-to-byte ratio for any
      blocking width in the modelled range. The communication charge then has no physical
      basis at that width and the optimiser must be restricted to widths where it does.
  structural_ingredients:
  - description: >-
      The extended tower number field sieve and its complexity constants for the medium
      prime case.
    citation: >-
      The extended tower sieve reference. RECALLED, CORROBORATED ONLY AT SEARCH-SUMMARY
      LEVEL BY THE FILING SESSION, NOT OPENED BY THIS PROGRAM. The reviewer must resolve
      the constants against the primary text.
    provenance: recalled
    verified_by: null
    role: 'the cost function whose balancing step is re-solved'
  - description: >-
      That replacing an operation count by an area-time cost on a mesh and RE-OPTIMISING
      the parameters changes a complexity constant rather than only a constant factor.
    citation: >-
      The area-time factoring-circuit line and its follow-up analysis. RECALLED ONLY, NOT
      SEARCHED, NOT READ.
    provenance: recalled
    verified_by: null
    role: >-
      THE LOAD-BEARING EXTERNAL INGREDIENT, AND IT IS RECALLED. It is a pointer for the
      reviewer, not support. If the recalled content is wrong - in particular if the
      re-optimisation moves only a constant factor - then C2's 8-bit floor loses its
      justification and this record must be re-scoped to a constant-factor measurement
      before any experiment is approved.
  - description: >-
      This program's own corpus record for area-time batch sieving, relaying
      abstract-level exponents for a factoring circuit, together with that record's own
      disclosure that it was produced in a bulk seeding pass from the first two pages of a
      local file and was not independently verified.
    citation: 'the corpus record for area-time batch sieving'
    provenance: internal
    verified_by: >-
      Relayed from IDEA-20260818-1fb37d, whose own repair note records that the
      dispatching coordinator session read that corpus record in full and attested to it.
      TASK-20260904-5423ad did NOT open it and marks this entry relayed. It supports the
      EXISTENCE of the area-time move for factoring and NOT its transfer to the tower case.
    role: 'the closest internal pointer to the load-bearing external ingredient'
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
  - metric: 'zero-price reproduced exponent constant for the target field, dimensionless'
    direction: different
    minimum_effect: >-
      FORCED to equal the published constant to the precision the primary text states.
      Any mismatch HALTS the record and is reported as the result.
  - metric: 'displacement of the argmin in the base-two logarithm of the smoothness bound, in bits'
    direction: higher
    minimum_effect: >-
      At least 1.0, AND exceeding the 95th percentile of at least 20 random-functional
      draws of matched magnitude. Below either, C1 is falsified.
  - metric: >-
      total cost gap between the published tuple evaluated under the charged objective
      and the re-optimised tuple under the same objective, in bits
    direction: higher
    minimum_effect: >-
      At least 8 bits. The gap is non-negative by construction, so the informative content
      is entirely in the magnitude; below 8 bits C2 is falsified and the outcome means the
      published tuple is near-optimal even under a charged objective, which would
      MATERIALLY STRENGTHEN confidence in the deployed labels and is reported as such.
  - metric: 'memory span across the one-bit-optimal level set, as a ratio'
    direction: higher
    minimum_effect: >-
      At least a factor of 2 to the 10. Below that, C3 is falsified and the bit level IS a
      well-defined scalar once the objective is fixed, which reduces a standing worry to a
      single number.
  - metric: 'measured arithmetic intensity of the sparse matrix-vector product, in modular multiply-adds per byte moved'
    direction: lower
    minimum_effect: >-
      Below the measured host flop-to-byte ratio. If higher, HEUR-003 is falsified at the
      tested scale and the communication premise is wrong there.
  test_boundary:
    instances:
    - 'the deployed target field and prime, for the optimisation arm'
    - 'the two degenerate tower slices, for the baseline embedding'
    - 'an executed record computation in a small tower field of known resource consumption, for the nearby-object control'
    - 'a sparse matrix-vector micro-benchmark at dimensions from 10 to the 5 to 10 to the 6'
    parameters:
      optimised_tuple: 'the tower degrees, the smoothness bound, the sieve region and the blocking width'
      price_grid: 'communication prices spanning free to severely bandwidth-limited, on a declared grid, plus a mesh area-time arm'
      machine_models: 'at least 5'
      random_functional_draws: 20
    implementation: >-
      Symbolic reduction of the stationarity condition in a computer-algebra system, a
      numerical optimiser over the declared grid, and a micro-benchmark on the run host.
      NO SIEVE IS RUN and no discrete logarithm is attempted.
    budget:
      wall_clock_seconds_per_run: 1800
      total_cpu_hours: 4
      maximum_memory_gb: 16
      maximum_runs: 6
  falsification_conditions:
  - >-
    The zero-price optimiser does not reproduce the published constant - the cost function
    is wrong; the record reports that and stops. This is the most likely failure and it is
    a useful one.
  - >-
    Argmin displacement below 1.0 across the whole price grid - C1 is false, the published
    tuple is robust to the machine model, and the operation-count convention is defensible
    for this target. That is a genuine reassurance about deployed labels and MUST be
    reported as one rather than buried.
  - >-
    Re-optimisation gap below 8 bits - C2 is false at the stated threshold.
  - >-
    One-bit level set spanning less than a factor of 2 to the 10 in memory - C3 is false.
  - >-
    The random-functional control produces displacements matching the physically derived
    term - the displacement measures optimiser sensitivity rather than the physics of data
    movement. Controlled null; no finding.
  - >-
    The micro-benchmark shows the linear algebra is compute-bound at the tested scale -
    HEUR-003 is falsified there and the extrapolation to deployment scale must be
    re-argued or abandoned.
  interpretation_limits:
  - >-
    NO ATTACK IS MOUNTED, no discrete logarithm is attempted, and NO STATEMENT THAT ANY
    DEPLOYED CURVE IS BROKEN OR SAFE may be derived from this record. A re-derivation
    showing that a published figure corresponds to a particular machine model is a scoped
    methodological result about a cost model.
  - >-
    THIS RECORD IS BLOCKED. RQ-PAIR-f2e31f constraint 1 forbids recording a cost figure
    before the primary sources are filed as knowledge-corpus entries, and none has been
    read by this program.
  - >-
    NO CURVE-FREE NULL IS REQUIRED, AND THE REASON IS RECORDED - this record contains no
    elliptic curve anywhere. It is a statement about a cost function and a machine model,
    the pairing-friendly curve enters only as the source of a prime, and no elliptic-curve
    claim is made or derivable. The standing scope constraint about curve-free lookalikes
    is satisfied vacuously rather than ignored.
  - >-
    Every figure is scoped to the stated machine model, the stated conventions, the
    transcribed prime, and the asymptotic formula's own validity range.
  - >-
    UNTESTABLE AT REACHABLE SCALE, STATED RATHER THAN SHRUNK. The deployment-scale attack
    is never executed and cannot be - a discrete logarithm in the target field is precisely
    what the security level asserts is infeasible. The micro-benchmark bounds the
    bandwidth premise only at the tested dimensions on one host, and nothing about a
    hypothetical deployment-scale machine is measured. The output is a DIFFERENCE between
    two evaluations of the same unverified instrument and only the difference is
    defensible.
  - >-
    A flat cost surface makes the argmin numerically unstable, so an apparent displacement
    may be numerical. That is why the level set is reported alongside the argmin and why
    the random-functional control is a rank test rather than a single comparison.
  - >-
    The claim that re-optimisation cannot hurt the attacker is a statement about the
    MODEL'S minimiser, not about real attackers, who face engineering constraints the
    model omits.
