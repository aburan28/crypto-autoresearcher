hypothesis:
  id: H-SEMBIN-b1708c
  question_id: RQ-SEMBIN-9fa4ba
  statement: >-
    The two-stage cost balance Semaev optimizes in eqs. (15)-(17) was solved over m
    with the chain length pinned at t = m. Optimized JOINTLY over (m, t) with
    2 <= t <= m, its optimum is INTERIOR -- t* < m* strictly -- at every n in the
    range where the crossover against Pollard rho is decided, roughly
    250 <= n <= 600. The interior optimum lowers total cost by a factor that is
    polynomially bounded and therefore leaves the exponent 2^{1.6986 sqrt(n ln n)}
    exactly as Semaev states it, while moving the concrete crossover n downward by
    at least 5. Separately and in the opposite direction: charging the n^{4 omega}
    stage-1 cofactor honestly rather than absorbing it into the o(1) moves the
    crossover UPWARD, and at omega = 3 the cofactor n^{12} is about 2^{109} at
    n = 571, which is larger than the 2^{2n/m} stage-2 term the balance is struck
    against. The net of the two corrections is not predicted here; computing both and
    reporting them separately, with the exponent explicitly unmoved, is the claim.
  mechanism: >-
    Semaev's Section 3 step 3 states the trade and declines it: for t < m "the
    solving running time ... drops dramatically and the probability of solving is
    relatively lower ... the trade off may be positive, we won't pursue this approach
    in the present work as this does not affect the asymptotical running time
    estimates." That reason is correct about the exponent and silent about the
    crossover, and the crossover is what Section 4.5.2's four-curve conclusion turns
    on.
    The structure that makes an interior optimum plausible is the shape of the two
    factors as t falls below m at fixed m. Chain length t enters the Boolean system
    as n(t-1) equations in n(t-2) + kt variables, so the solving cost falls steeply
    with t -- the paper's own Table 2 quantifies both sides of this at small n. Yield
    enters through eq. (11) as 1 - exp(-2^{tk-n}/t!), which falls with t through the
    exponent tk - n. So the objective is a product of a rapidly decreasing factor and
    a rapidly increasing one, and the question is whether the product's minimum over t
    is attained in the interior of [2, m] or at the endpoint t = m. Nothing in the
    paper decides this, because the paper never varies t independently of m: it fixes
    t = m and then optimizes the single remaining parameter, obtaining
    m* ~ sqrt(2 ln2 n / ln n) and the exponent constant c = 2/(2 ln 2)^{1/2}.
    The reason the exponent cannot move is worth stating precisely, because it is the
    thing most likely to be overclaimed. The (m, t) feasible set at fixed n is
    finite and its size is O(m*^2) = O(n / log n), so the joint minimum differs from
    the t = m minimum by at most a factor polynomial in n. A polynomial factor is
    absorbed by 2^{c sqrt(n ln n)} identically. Therefore an interior optimum is a
    CROSSOVER result and never an exponent result, and this hypothesis states that as
    part of the claim rather than as a caveat.
    The cofactor correction runs the other way and is arithmetic rather than
    optimization. Stage 1 in eq. (15) carries n^{4 omega}; at omega = 3 that is
    n^{12}. The freezing session verified that all 36 numeric cells of Table 3
    reproduce from m! 2^{n/m} n^{12}, 2^{2n/m} and 2^{n/2} to within 0.7%, so the
    cofactor IS included in Table 3's arithmetic -- what is absorbed is its effect on
    the analytic optimization that produced m* and c, which was carried out on the
    dominant exponential terms. Recomputing the balance with the cofactor present
    shifts the optimal m and hence the crossover. The claim that n^{12} at n = 571 is
    about 2^{109} is a direct computation: 12 * log2(571) = 12 * 9.157 = 109.9.
    Both corrections are pure derivation from published formulas. Neither needs a
    Groebner computation, a curve, or any machine headroom beyond arbitrary-precision
    arithmetic, which is why this hypothesis is ranked first in GOAL-SEMBIN-cbf422
    despite being the least likely to produce a large effect.
  assumptions:
    - >-
      The cost model used is Semaev's own, taken from eqs. (15)-(17) unchanged.
      Substituting a different or improved cost model would answer a different
      question; the point here is what the paper's own formulas say when a parameter it
      held fixed is released.
      One reading ambiguity in the published text must be carried explicitly rather
      than resolved silently, because the freezing arithmetic found the two readings
      disagree. eq. (15) is derived with k = ceil(n/m), giving stage 1
      ~ m! * 2^k * n^{4 omega} * 2^{n - mk}; but Table 3's stage-1 column reproduces to
      within 0.7% only from m! * 2^{n/m} * n^{4 omega}, which is that expression with k
      taken as the REAL number n/m so that 2^{n - mk} collapses to 1. Where m divides n
      the two agree exactly; where it does not, the ceiled form is strictly cheaper and
      the published table is computed from the un-ceiled one. Both readings are
      therefore computed and reported. The discrepancy is a finding about the paper's
      arithmetic, not a defect of this optimization, and it is the same ambiguity
      H-SEMBIN-83999d charges on the memory side -- where the relation store is
      2^{ceil(n/m)} while the time column is computed from n/m.
    - >-
      The yield factor is eq. (11) as published. If H-SEMBIN-c5b2e0 finds eq. (11)
      biased, the joint optimization must be redone with the corrected law -- the two
      hypotheses interact, and this one inherits eq. (11) explicitly rather than
      silently. The interaction is why EXP-SEMBIN-81dc96 reports the optimum under
      both the published and the corrected law if a correction is available.
    - >-
      Extending eq. (11) and the cost formulas to t < m at fixed m is done exactly as
      the paper's own expressions read with t substituted for m where t appears as a
      chain length, and NOT by inventing an interpolation. Where the substitution is
      ambiguous in the published text, the ambiguity is recorded and both readings are
      computed.
    - >-
      This hypothesis inherits Semaev's Assumption 1 for the stage-1 exponent
      4 * omega, since that exponent is what Assumption 1 buys. The dependence is
      declared as HEUR-005 below rather than absorbed, so a boundary result under
      H-SEMBIN-2d7708 propagates here as a stated invalidation rather than a silent
      one.
  proof_search_map:
    bottleneck: >-
      A single fixed parameter, t = m, in the optimization that produces every
      concrete number in Table 3 and the n > 310 crossover. Releasing it costs one
      derivation and no compute.
    baseline_embedding:
      parameter_slice: >-
        The exact old-method boundary is t = m. At every n the joint optimization must
        reproduce Semaev's own m* and his Table 3 costs when constrained to t = m,
        including the crossover at n > 310 and the freezing session's slightly more
        conservative n = 302 from minimizing stage 1 over m directly.
      reproduction_check: >-
        Constrained to t = m, recompute all 36 Table 3 cells to within the 0.7%
        already established in inputs/SEMAEV-2015-310/tables.yaml derived_checks, and
        recover m* ~ sqrt(2 ln2 n / ln n) and c = 2/(2 ln 2)^{1/2} ~ 1.6986. Failure
        here is a procedure defect and stops the derivation.
    observation_collision:
      observable: >-
        Total cost as a function of (m, t) at fixed n.
      distinct_preimage_search: >-
        Search for distinct (m, t) pairs achieving equal total cost. A flat or nearly
        flat valley along a curve in (m, t) would mean "the optimum" is not a point,
        that the reported t* is an artifact of tie-breaking, and that the crossover
        shift is not robust. Report the full cost surface and the width of the
        near-optimal region, not only the argmin -- an argmin from a flat surface is
        the most likely way this derivation produces a spurious result.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          t released from t = m to the full range 2 <= t <= m.
        predicted_gain: >-
          An interior optimum lowering total cost by a polynomially bounded factor,
          hence a lower crossover n and no exponent change.
      - transform: telescoping_potential
        proposed_object: >-
          The n^{4 omega} cofactor carried through the analytic optimization instead
          of absorbed into o(1).
        predicted_gain: >-
          A corrected m*(n) and a corrected crossover; expected to move the crossover
          upward, opposing the (m, t) effect. No exponent change, since a polynomial
          factor cannot move 2^{c sqrt(n ln n)}.
    quantifier_order: >-
      For all n in [250, 600], the minimizer (m*, t*) of the joint objective has
      t* < m*. There EXISTS an n0 <= 310 such that the joint-optimum crossover
      against 2^{n/2} occurs at n0, with 310 - n0 >= 5. For all n, the exponent
      constant c is unchanged, because the feasible set has size polynomial in n.
      No claim is made outside [250, 600], and no claim is made that the optimum is
      interior for the corrected-cofactor objective, which is computed separately.
    method_ceiling:
      strongest_certifiable_claim: >-
        An exact cost surface over (m, t) at each integer n in the declared range,
        under the paper's own formulas, with the crossover read off it and the
        near-optimal region's width reported. This is a statement about SEMAEV'S COST
        MODEL, not about the true cost of the algorithm: it inherits every assumption
        the model makes, including Assumption 1 and eq. (11). It is not an
        implementation, not a measurement, and not evidence that any n is or is not
        attackable.
      nearby_object_control: >-
        Apply the identical joint-optimization machinery to a cost model whose optimum
        is KNOWN to lie on the t = m boundary by construction -- for instance one in
        which the solving-cost factor is made independent of t, so that only the yield
        term varies and the optimum must be t = m. If the machinery reports an
        interior optimum there, it has a bug and every reported t* is void. Second
        nearby object: a model with the yield term removed, whose optimum must be
        t = 2.
    proof_obligations:
      - claim: >-
          Constrained to t = m, the implementation reproduces Table 3's 36 cells to
          0.7% and recovers m* and c.
        responsibility: baseline
      - claim: >-
          The joint optimum has t* < m* for every n in [250, 600].
        responsibility: feasibility
      - claim: >-
          The improvement factor is bounded by a polynomial in n, hence the exponent
          constant c is unchanged.
        responsibility: runtime
      - claim: >-
          n^{12} at n = 571 is 2^{109.9}, exceeding 2^{2n/m} at the paper's m = 12
          (2^{95.2}).
        responsibility: size
      - claim: >-
          The known-boundary and no-yield control models return t* = m and t* = 2
          respectively.
        responsibility: correctness
      - claim: >-
          Every statement is about Semaev's cost model under Assumption 1 and
          eq. (11), and is not a claim about achievable cost.
        responsibility: scope
  rerandomization: null
  asymptotic_claim:
    problem: ECDLP on E(F_{2^n}), n prime, via chained-S_3 index calculus
    prior_best: >-
      2^{1.6986 sqrt(n ln n)} claimed by Semaev 2015 under Assumption 1; 2^{n/2} for
      Pollard rho and van Oorschot-Wiener parallel rho, which remains the
      unconditional best for the n where the two cross
    time_exponent: >-
      unchanged at c sqrt(n ln n) with c = 2/(2 ln 2)^{1/2}; this hypothesis claims NO
      exponent movement and predicts the joint optimum cannot produce any
    memory_exponent: >-
      unchanged; the memory axis is H-SEMBIN-83999d's subject (EXP-SEMBIN-f4a17b)
      and is not costed here
    hidden_cofactor: >-
      the n^{4 omega} stage-1 factor, n^{12} at omega = 3, which this hypothesis
      charges explicitly instead of absorbing -- about 2^{109.9} at n = 571
    claim_kind: constant_factor
  heuristic_assumptions:
    - id: HEUR-005
      formal_statement: >-
        Semaev's Assumption 1 (d_F4 <= 4) holds at every (m, t) pair evaluated in the
        joint optimization, so the stage-1 exponent 4 * omega applies uniformly across
        the (m, t) surface and not only along t = m.
      random_model_justification: >-
        Not a random model: this is an inherited assumption made explicit. Assumption
        1 is stated in the paper for every 2 <= t <= m on the diagonal
        k = ceil(n/m), so a joint optimization over t at fixed k = ceil(n/m) stays
        inside its stated range. What is NOT inherited is any claim about k above the
        diagonal, which is why the optimization holds k = ceil(n/m) throughout.
      supporting_results:
        - >-
          Assumption 1 as stated for all 2 <= t <= m (KN-LIT-fa346d Key claims;
          inputs/SEMAEV-2015-310/paper_fulltext.md Section 4.5; provenance kb).
      validation_experiment_ids:
        - EXP-SEMBIN-7e1371
        - EXP-SEMBIN-c2c312
      falsification_condition: >-
        H-SEMBIN-2d7708 locates a d_F4 >= 5 cell at k = ceil(n/m) for some
        2 <= t <= m in the optimization's range. The joint optimization's stage-1
        exponent is then wrong at those (m, t) and the surface must be recomputed with
        a t-dependent exponent, which could remove the interior optimum entirely.
    - id: HEUR-006
      formal_statement: >-
        The yield factor at chain length t < m is eq. (11) evaluated at that t with
        k = ceil(n/m) unchanged, i.e. shortening the chain changes how many points a
        relation uses without changing the factor base.
      random_model_justification: >-
        This is the reading of Section 3 step 3 in which the factor base is fixed by
        m and only the number of summands varies, which is what makes the trade a
        trade at all: a shorter chain solves faster over the same factor base and
        finds fewer relations. The alternative reading -- that k also re-optimizes
        with t -- is a different and larger optimization, and is computed as a second
        variant rather than assumed away.
      supporting_results:
        - >-
          Section 3 step 3 and Table 2, which reports solving cost and probability at
          t < m over a factor base indexed by m (inputs/SEMAEV-2015-310/
          paper_fulltext.md; tables.yaml; provenance kb).
      validation_experiment_ids:
        - EXP-SEMBIN-81dc96
      falsification_condition: >-
        The two readings give qualitatively different answers about whether the
        optimum is interior. The result is then reading-dependent, which must be
        reported as an unresolved ambiguity in the published text rather than resolved
        by choosing the more favourable one.
  structural_ingredients:
    - description: >-
        Section 3 step 3: the t < m trade explicitly identified, quantified in
        Table 2, and declined because it does not change the asymptotic estimate.
      citation: inputs/SEMAEV-2015-310/paper_fulltext.md Section 3 step 3; tables.yaml Table 2
      provenance: kb
      verified_by: TASK-20260913-8702c8
      role: the declined lever this hypothesis takes up
    - description: >-
        The two-stage balance eqs. (15)-(17) and its solution
        m* ~ sqrt(2 ln2 n / ln n), total 2^{c sqrt(n ln n)}, c = 2/(2 ln 2)^{1/2}.
      citation: inputs/SEMAEV-2015-310/paper_fulltext.md eqs. (15)-(17)
      provenance: kb
      verified_by: TASK-20260913-8702c8
      role: the optimization being re-solved with one fewer constraint
    - description: >-
        Table 3 and the Section 4.5.2 crossover at n > 310, with the freezing
        session's independent recomputation putting the stage-1 minimum crossover at
        n = 302 from the paper's own formulas.
      citation: inputs/SEMAEV-2015-310/tables.yaml derived_checks
      provenance: kb
      verified_by: TASK-20260913-8702c8
      role: the baseline the joint optimum is measured against
    - description: >-
        KN-OPEN-94f456, this program's record of the declined short-chain trade as an
        open problem.
      citation: knowledge/open-problems/KN-OPEN-94f456.md
      provenance: internal
      verified_by: TASK-20260913-8702c8
      role: the open problem this hypothesis is the first attempt on
  reduction_chain:
    core_problem: >-
      The joint (m, t) optimum of Semaev's own two-stage cost balance, and the
      crossover against 2^{n/2} that follows from it.
    corollaries:
      - problem: >-
          Whether KN-OPEN-94f456 is a live lane worth measurement budget.
        reduction_ref: >-
          Direct: a boundary optimum closes it as an optimization question at the cost
          of one derivation; an interior optimum opens it and prices the next step.
        asymptotics_preserved: not_applicable
      - problem: >-
          Whether Semaev's n > 310 crossover, and hence the Section 4.5.2 four-curve
          statement, is stated at the right n under his own model.
        reduction_ref: >-
          Direct arithmetic on the same formulas. Note this bears on the model's
          internal consistency and NOT on whether any curve is attackable.
        asymptotics_preserved: >-
          'yes: the exponent is unchanged by construction, which is the point'
  predictions:
    - metric: t_star_interior
      direction: different
      minimum_effect: >-
        t* < m* strictly at every integer n in [250, 600]. Any n in the range with
        t* = m* refutes the first clause at that n and must be reported per-n rather
        than aggregated.
    - metric: crossover_shift_from_joint_optimum
      direction: lower
      minimum_effect: >-
        Crossover against 2^{n/2} at n0 with 310 - n0 >= 5, taking the paper's own
        stated 310 as the reference and reporting the shift against the freezing
        session's 302 as well.
    - metric: exponent_unchanged
      direction: different
      minimum_effect: >-
        The fitted c from the joint optimum agrees with 1.6986 to within the fit's
        own resolution over n up to 10^5. A fitted c that differs materially is a
        procedure defect, not an exponent improvement, since the feasible set is
        polynomial in n.
    - metric: cofactor_charged_crossover_shift
      direction: higher
      minimum_effect: >-
        Charging n^{4 omega} in the analytic optimization moves the crossover upward
        by at least 5 in n, in the opposite direction to the joint-optimum effect.
        Both shifts reported separately and their net reported without rounding either
        away.
    - metric: cofactor_dominance_at_571
      direction: different
      minimum_effect: >-
        n^{12} at n = 571 equals 2^{109.9} against 2^{2n/m} = 2^{95.2} at m = 12, so
        the cofactor exceeds the stage-2 term by about 2^{14.7}. An exact recomputation
        must confirm these to 0.1 in the exponent.
    - metric: control_models
      direction: different
      minimum_effect: >-
        The t-independent-solving-cost control returns t* = m at every n and the
        no-yield control returns t* = 2 at every n. Either control failing voids the
        surface.
    - metric: near_optimal_width
      direction: different
      minimum_effect: >-
        The width of the region within 2x of the optimum reported at each n. A width
        spanning the whole feasible t range means t* is a tie-break artifact and the
        crossover shift is not robust, which must be said.
  test_boundary:
    instances:
      - >-
        Semaev's own cost formulas, unchanged, under BOTH readings of k: the Table 3
        form stage 1 = m! 2^{n/m} n^{4 omega} with stage 2 = 2^{2n/m} (k = n/m real),
        and the ceiled form stage 1 = m! 2^k n^{4 omega} 2^{n - mk} with
        stage 2 = 2^{k omega'} at k = ceil(n/m); omega = 3, omega' = 2
      - >-
        the same formulas with t released from t = m over 2 <= t <= m, under both
        HEUR-006 readings (k fixed by m; k re-optimized with t)
      - >-
        the same formulas with n^{4 omega} carried through the analytic optimization
      - >-
        two control cost models: solving cost made t-independent (optimum must be
        t = m); yield term removed (optimum must be t = 2)
    parameters:
      n_range_dense: 'every integer n in [250, 600]'
      n_range_asymptotic: [1000, 10000, 100000]
      m_range: 'every integer m in [2, 30]'
      t_range: 'every integer t in [2, m]'
      omega_variants: [2.376, 2.807, 3.0]
      omega_prime_variants: [2.0, 3.0]
      table3_reproduction_n: [100, 150, 200, 250, 300, 310, 350, 400, 409, 450, 500, 571]
      k_readings: [unceiled_n_over_m_as_in_table3, ceil_n_over_m]
    implementation: >-
      Arbitrary-precision arithmetic only -- Python integers and mpmath. No curve, no
      Groebner engine, no field arithmetic, no factor base. This is derivation from
      published formulas and is the cheapest deliverable in either SEMBIN goal.
    budget:
      wall_clock_seconds_per_run: 900
      maximum_memory_gb: 2
      maximum_runs: 20
      enforcement: advisory
  falsification_conditions:
    - >-
      The joint optimum lies on the t = m boundary at every n in [250, 600]. Semaev's
      choice is then optimal under his own model, KN-OPEN-94f456 closes as an
      optimization question, and the first clause is refuted. This is a perfectly good
      outcome and must not be presented as a failure.
    - >-
      The crossover shift from the joint optimum is under 5 in n. The interior optimum
      is then real but concretely irrelevant, refuting the effect-size clause while
      leaving t* < m* intact.
    - >-
      The constrained t = m reproduction fails to recover Table 3 to 0.7% or to
      recover m* and c. Procedure defect; the derivation stops and no claim is made.
    - >-
      Either control model returns the wrong optimum, voiding the machinery.
    - >-
      The near-optimal region spans the full t range, making t* a tie-break artifact.
    - >-
      The two HEUR-006 readings disagree qualitatively, making the result
      reading-dependent on an ambiguity in the published text.
    - >-
      A fitted exponent constant differing materially from 1.6986. Since a polynomial
      feasible set cannot move the exponent, this refutes the implementation rather
      than establishing an improvement, and must be diagnosed as such.
  interpretation_limits:
    - >-
      This is a statement about SEMAEV'S COST MODEL, not about the achievable cost of
      any algorithm. It inherits Assumption 1 through HEUR-005 and eq. (11) through
      HEUR-006, and either being wrong invalidates it. It is a derivation, not a
      measurement, and no relation is ever computed.
    - >-
      NO EXPONENT IMPROVEMENT IS CLAIMED and none is possible from this route: the
      (m, t) feasible set at fixed n is polynomial in n, so the joint optimum differs
      from the t = m optimum by a polynomial factor, which 2^{c sqrt(n ln n)} absorbs
      identically. Reporting a crossover shift as an exponent result would violate the
      cost-honesty clause of docs/target-result-profile.md.
    - >-
      A crossover shift in either direction says nothing about whether any curve is
      attackable. The crossover is where one heuristic cost model dips below another;
      both sides of it are estimates, and the memory axis -- which H-SEMBIN-83999d
      addresses -- is absent from both.
    - >-
      The two corrections have OPPOSITE signs and must be reported separately. Quoting
      the favourable one alone would be selective reporting of a two-sided
      calculation.
    - >-
      If H-SEMBIN-c5b2e0 finds eq. (11) biased, this optimization must be redone; the
      published-law result is then a comparison baseline rather than the answer.
    - >-
      No claim about the security of any deployed curve, in either direction. The FIPS
      binary curves appear only as values of n in a cost table.
