hypothesis:
  id: H-WESO-9cc835
  question_id: RQ-WESO-8aff57
  title: >-
    The published middle-memory line is a section through the algorithm's own
    frontier, not the frontier: the smoothness bound is optimised once, at the
    full-memory corner, and never re-optimised under a memory budget

  statement: >-
    SCOPE: the cost model stated in Section 4.1 of the frozen paper
    (inputs/P13-WESOLOWSKI-2026/paper_fulltext.md), evaluated at the five
    parameter sets that section publishes (log2 p in {256, 384, 512, 576, 768}),
    under a declared and frozen list of model variants. This hypothesis concerns
    a FORMULA, not the world: no curve is constructed, no isogeny is computed, no
    measurement of any physical quantity is made, and the claim tier is
    derivation / tool-verification -- NEITHER toy NOR crypto empirical evidence.
    NO EXPONENT IS MOVED, and this is stated in the statement rather than buried.
    THE HYPOTHESIS, in two parts, each separately falsifiable and each with a
    forced value.
    (P1) REPRODUCIBILITY. An independent implementation of Section 4.1's stated
    model -- M = Psi(X,B) X with X = B^{1/2}(p/2)^{1/6}, one F_{p^2}-operation
    per entry, memory ~ M, time ~ M/P0 with P0 estimated as in Lemma 3.5, and B
    optimised for best time -- reproduces the ten published numbers
    (256: 2^106.5 / 2^92.5; 384: 2^157.5 / 2^138.6; 512: 2^204.2 / 2^181.3;
    576: 2^230.9 / 2^206.0; 768: 2^302.4 / 2^272.2) to within 0.5 bits, under at
    least one variant in the frozen list. This programme has run four batches
    downstream of that table without ever checking that it follows from its own
    stated model, and the check costs seconds.
    (P2) THE FRONTIER IS BELOW THE SECTION. Writing log T_hi(B) = log M(B) -
    log P0(B) for the full-memory branch and log T_w(B) = (3/2) log M(B) -
    (1/2) log w - log P0(B) for the memory-w branch, the coefficient on log M
    rises from 1 to 3/2 while the coefficient on -log P0 stays at 1. Therefore
    the cost-minimising B under a memory budget w < M is STRICTLY SMALLER than
    the corner-optimal B, the algorithm should build a smaller table and accept
    more retries than the published parameterisation does, and the published
    interpolation p^{1/2+o(1)}/w^{1/2} is an UPPER BOUND on the algorithm's own
    frontier that is tight only at the right-hand corner. Adjoining the free
    parameter Y of H-WESO-9dc201 makes the true frontier a two-parameter
    envelope over (Y, B), of which the published curve is a one-dimensional
    section.
    THE FORCED ZERO THAT MAKES (P2) TESTABLE RATHER THAN RHETORICAL: at w = M the
    two objectives are algebraically identical, since (3/2) log M - (1/2) log M =
    log M. So the re-optimisation gain at the corner is EXACTLY 0.000 bits, at
    every one of the five parameter sets. An optimiser that returns anything else
    there is broken, and no frontier number from that run may be reported.
    IF NEITHER PART SURVIVES, THE DELIVERABLE IS A NAMED NO-GO WITH ITS BOUNDARY:
    the exact variant list swept, the reproduction error under each, and the
    statement that Section 4.1's model as published does not determine its own
    output -- which is a first-class negative and is the more valuable of the two
    outcomes, because every margin row this goal has produced is anchored to that
    table.

  mechanism: >-
    DERIVED IN-REPO. Natural logarithms unless written log2. L = log(p/2),
    beta = log B, t = L/beta.

    (1) THE MODEL, TRANSCRIBED FROM THE FROZEN TEXT SO IT CAN BE CHECKED LINE BY
    LINE. From Algorithm 2 line 1, Lemma 3.3, Lemma 3.5, Theorem 1.4 and
    Section 4.1:
      X        = B^{1/2} (p/2)^{1/6},        log X = beta/2 + L/6
      w'       = log X / log B               = 1/2 + t/6
      Psi(X,B) = X * w'^{-w'(1+o(1))}
      M        = Psi(X,B) * X                (Section 4.1: "the size of the tables
                                              ... is at least M = Psi(X,B) X")
      u        = log(p/2) / (3 log B)        = t/3
      P0       = u^{-u(1+o(1))}              (Lemma 3.5)
      TIME     = M / P0 F_{p^2}-operations,  MEMORY = M.
    Dropping the (1+o(1)) exactly as Section 4.1 must when it produces numbers:
      log M(beta)    = 2 log X - w' log w' = beta + L/3 - (1/2 + t/6) log(1/2 + t/6)
      -log P0(beta)  = (t/3) log(t/3)
      log TIME(beta) = log M(beta) + (t/3) log(t/3).
    SELF-CONSISTENCY BEFORE ANY NUMBER: at the paper's own asymptotic choice
    beta = (1/3) sqrt(L) one gets t = 3 sqrt(L), u = sqrt(L), w' ~ sqrt(L)/2, and
    log TIME = L/3 + O(sqrt(L) log L), i.e. p^{1/3+o(1)} -- the transcription
    reproduces the paper's own asymptotic conclusion, which is the minimum bar a
    transcription must clear.

    (2) THE DECLARED AMBIGUITIES. Section 4.1 does not state its optimiser, its
    grid, whether B is constrained to primes, whether "log" is natural or base 2,
    or whether Psi and P0 are evaluated with the u^{-u} form or with the
    Dickman-de Bruijn rho -- and the paper uses BOTH notations, u^{-u(1+o(1))} in
    Heuristic 1 and rho(u) in Section 4.2. Each ambiguity is a declared binary
    variant, FROZEN BEFORE THE RUN, and every variant's reproduction error is
    reported. Choosing the variant that matches is legitimate only if the full
    table is published beside it; concealing the sweep and reporting the winner
    would be fitting.

    (3) WHY THE OPTIMUM MOVES UNDER A MEMORY BUDGET. Substituting into
    log T_w(beta) = (3/2) log M(beta) - (1/2) log w + (t/3) log(t/3) and writing
    the p^{o(1)} part in t, using w' ~ t/6 for large t:
      memory-w branch:  log T_w = L/2 + (3/2)(L/t) + t[(1/12) log t + 0.0817...]
                                  - (1/2) log w
      full-memory branch: log T_hi = L/3 + (L/t) + t[(1/6) log t - 0.0676...],
    where the bracketed constants are
      (1/4) log 6 - (1/3) log 3 = +0.0817... and
      (1/6) log 6 - (1/3) log 3 = -0.0676...,
    obtained by combining -(3/2)(t/6) log(t/6) with (t/3) log(t/3) and
    -(t/6) log(t/6) with (t/3) log(t/3) respectively. Differentiating in t:
      memory-w:    t^2 [(1/12) log t + 0.1651...] = (3/2) L
      full-memory: t^2 [(1/6)  log t + 0.0991...] = L.
    Halving the coefficient on log t while multiplying the right side by 3/2
    moves the stationary t upward by a factor tending to sqrt(3) ~ 1.73, hence
    beta downward by a factor tending to ~0.58, hence B_w ~ B_corner^{0.58}.
    THE DIRECTION IS DERIVED BEFORE ANY RUN AND IS THE HYPOTHESIS'S ONLY
    QUANTITATIVE PRE-COMMITMENT ON THE B AXIS. The SIZE of the resulting saving
    in bits is deliberately NOT asserted: asserting it without running the
    arithmetic would be fabrication under AGENTS.md rule 9.

    (4) THE FORCED ZERO AT THE CORNER. At w = M, (3/2) log M - (1/2) log M =
    log M, so the two objectives coincide identically as functions of beta, the
    argmin coincides, and the gain is exactly zero. This is an algebraic identity
    and not an expectation, which is what makes it a null that CAN FAIL: any sign
    error, any grid coarseness, any bug in the objective shows up here as a
    nonzero corner gain, on the same code path and the same grid as the treatment.

    (5) A SUB-VARIANT CHECKED AND REJECTED, WITH ITS OBSTRUCTION NAMED RATHER
    THAN TALLIED. One might pool the K = 1/(rho P0) independent attempts into a
    single middle-memory search over the concatenated tables, since the
    concatenation contains a golden claw. Cost sqrt((KM)^3/w) = K^{3/2}
    sqrt(M^3/w) against K sqrt(M^3/w) for separate searches: pooling is WORSE by
    K^{1/2}. MECHANISM: the search cost is superlinear in the domain while the
    number of golden claws does not grow with pooling, because each attempt uses
    a fresh random curve and they share no claw. FORWARD GUIDANCE: pooling would
    pay only if the golden-claw count grew at least linearly with K, which would
    require correlated attempts -- so a re-randomisation scheme that deliberately
    correlates attempts is the object that would revive this route, and it is
    named as open rather than dismissed.

    (6) THE TWO-PARAMETER ENVELOPE. With Y free (H-WESO-9dc201): X_Y =
    B^{1/2} Y^{1/2}, M(Y,B) = Psi(X_Y,B) X_Y, retries = 1/(rho_p(Y) P0(Y,B)) with
    rho_p(Y) = 8 Y^{3/2} p^{-1/2+o(1)}. At memory budget w the cost is the lower
    of the full-table branch (available when w >= M) and the middle-memory
    branch. The frontier is the lower envelope over (Y, B) at each w. AN ENVELOPE
    OVER A LARGER PARAMETER SET CANNOT LIE ABOVE A SECTION THROUGH IT, so the
    SIGN of the result is not in doubt and only its magnitude is worth measuring
    -- which is exactly why the corner-zero and flat nulls carry the weight here:
    they are the only things that can detect a wrong answer.

    (7) WHAT THIS DOES NOT DO, STATED IN THE MECHANISM SO IT TRAVELS WITH IT. It
    does not move an exponent: both branches are p^{1/2+o(1)}/w^{1/2}. It does
    not touch, use or contradict any value from this goal's per-entry cost lane
    (EXP-PEC-6be870, EXP-PEC-49c773, EV-PEC-2e67ff, EV-PEC-857664); a per-entry
    constant is an additive constant in log space, independent of (Y, B, w), so
    it translates the frontier without moving its argmin -- which also means (P1)
    must use the paper's own convention of one operation per entry, because
    substituting a corrected constant would make reproducing the published table
    impossible by construction. And it does not bear on Heuristic 1, on
    completion criterion 1, or on any hypothesis status.

  assumptions:
  - >-
    FROZEN VARIANT LIST AND GRID, fixed before any evaluation, with no degree of
    freedom added afterwards.
    (a) Smoothness estimator: u^{-u} versus the Dickman-de Bruijn rho(u),
        computed by numerical solution of the delay equation.
    (b) Logarithm convention in "log(p/2)": natural versus base 2.
    (c) B: real-valued versus constrained to primes.
    Eight variants total. Memory grid: w = M * 2^{-k} for k in
    {0, 8, 16, 24, 32, 48, 64}. Parameter sets: log2 p in {256, 384, 512, 576,
    768}. Reproduction tolerance 0.5 bits; corner-zero tolerance 1e-6 bits;
    beta_ratio admissible band [0.40, 0.95]. ANY adjustment after any number is
    observed requires a versioned protocol_amendment and is never an edit.
  - >-
    THE PUBLISHED NUMBERS ARE READ AS-IS FROM THE FROZEN TEXT AND ARE NOT
    RE-DERIVED TO MAKE THEM AGREE. Section 4.1 writes ">=" throughout and calls
    its own estimate "a rough underestimation", while also assuming Lemma 3.5's
    bound is tight, which Remark 1 says overestimates 1/P0. Both directions of
    stated optimism are recorded BEFORE the run so that neither can be invoked
    afterwards to explain away a mismatch.
  - >-
    THE MIDDLE-MEMORY COST FORM sqrt(M^3/w) IS INHERITED FROM THE FROZEN PAPER'S
    SECTION 1.1 AND IS NOT DERIVED HERE; [43] is NOT READ. If the true exponent
    is not 3/2 the coefficient in (3) changes; the DIRECTION of (3)'s conclusion
    survives any exponent strictly greater than 1, and that robustness is stated
    rather than relied on silently.
  - >-
    MEMORY IS CHARGED IN TABLE ENTRIES, as Section 4.1 does. Bits per entry --
    whether an entry is a j-invariant at 2 log2 p bits or a full isogeny
    representation -- is NOT settled by the paper and is recorded as an
    unresolved factor of order log p that shifts every memory row uniformly and
    therefore cannot change the argmin.
  - >-
    THE ENVIRONMENT IS AS MEASURED THIS SESSION: Python 3.11.15 and numpy 2.4.6
    present, sympy and SageMath ABSENT. The whole computation is elementary
    floating-point evaluation plus a one-dimensional minimisation and needs
    nothing else; the Dickman rho variant is computed by direct numerical
    integration rather than by a library call, precisely because no library is
    available.

  proof_search_map:
    bottleneck: >-
      The choice of B, and the fact that it is made once. Every concrete cost
      statement this goal has produced descends from Section 4.1's optimisation,
      which is performed at the full-memory corner; every memory-constrained
      statement then inherits that B without re-deriving it. If the published
      table cannot be reproduced from the published model, EVERY such statement
      is anchored to a number nobody can regenerate; if it can, the
      re-optimisation is a one-line change to the objective that no one has made.
      Either way this single step is upstream of this goal's objective (b) and
      consumes no other lane's budget.
    baseline_embedding:
      parameter_slice: >-
        w = M at all five published parameter sets: the exact slice where the
        memory-constrained objective degenerates to the published one.
      reproduction_check: >-
        TWO CHECKS, BOTH EXACT RATHER THAN VISUAL. (i) SYMBOLIC: the identity
        (3/2) log M - (1/2) log M = log M, so the two objectives are the same
        function of beta at w = M -- verified by inspection and re-verified in
        code by evaluating both objectives on the same beta grid and requiring
        pointwise agreement to 1e-12. (ii) NUMERICAL, AGAINST A FROZEN FIXTURE:
        the ten published values. A reconstruction whose curve merely resembles
        the published trend is NOT an embedding; the requirement is ten numbers
        within 0.5 bits. This is the audit that most cheaply ends the line, and
        it runs first.
    observation_collision:
      observable: >-
        The pair (log2 TIME, log2 MEMORY) at a parameter set -- the only
        observable Section 4.1 publishes.
      distinct_preimage_search: >-
        A COLLISION IS EXPECTED AND IS THE MAIN THREAT TO (P1), and it is hunted
        explicitly rather than hoped away: with eight declared model variants,
        several may reproduce the ten numbers within tolerance, in which case the
        observable does NOT identify the model and the honest report is "the
        published table is consistent with k distinct models, which are ...".
        That is a genuine identifiability failure of the published cost model and
        is a legitimate, pre-registered outcome. The additional condition that
        would separate colliding variants is their behaviour AWAY from the
        published points -- at the intermediate memory budgets -- and the
        contract therefore reports the frontier under EVERY surviving variant
        rather than under a chosen one. A second collision, on the other side:
        the exponent-level curve TIME * MEMORY^{1/2} = p^{1/2+o(1)} is produced
        both by the van Oorschot-Wiener argument and, per H-WESO-9dc201, by the
        density-law argument, from different mechanisms. Two mechanisms sharing
        an observable is a warning that the observable does not identify the
        mechanism, and it is recorded as such rather than as mutual confirmation.
    constructive_transforms:
    - transform: specialize_measure_pack
      proposed_object: >-
        A problem-specific resource measure -- the exponent budget split
        (a, b) = (log_p M, log_p retries) -- under which every branch's cost is a
        fixed linear functional of (a, b) determined solely by the memory regime,
        and the design freedom is the curve of admissible (a, b) swept by (Y, B).
      predicted_gain: >-
        Turns "which algorithm variant is cheapest at memory w" into a
        two-dimensional convex-looking minimisation with an explicit objective,
        makes the corner-zero an identity rather than a coincidence, and makes
        the effect of a per-entry constant visibly a translation. Encoding,
        completeness, soundness, transfer and cost-loss obligations are listed
        under proof_obligations; the transfer obligation to a REAL
        implementation is DECLARED UNMET -- this is a property of a formula.
    - transform: baseline_as_boundary_lift
      proposed_object: >-
        Enlarge the admissible parameter family from {B} to {(Y, B)} and prove a
        STRICT inward improvement of the frontier for w < M, rather than merely
        exhibiting feasibility of the larger family.
      predicted_gain: >-
        The strictness is what distinguishes a result from a restatement. It is
        supplied by the strict inequality between the two stationarity conditions
        in mechanism step (3), and it is precisely what the beta_ratio prediction
        tests.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER: FOR ALL memory budgets w < M and FOR ALL five
      published parameter sets, THERE EXISTS a parameter pair (Y, B) whose cost
      is strictly below the published section's cost at that w. The witness
      (Y, B) IS ALLOWED to depend on w and on p -- it is a design choice made by
      the attacker who knows both -- and this record states that dependence
      explicitly rather than claiming a uniform witness it does not have. The
      STRONGER order, "there exists one (Y, B) that beats the section at every
      w", is NOT claimed and is in fact false, since the corner-optimal B is
      optimal at the corner. Getting this backwards is the standard way a
      re-optimisation result is overstated, and the record fixes the order before
      any number exists.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that a stated cost model does or does not reproduce its own
        published output, and that a two-parameter envelope over that same model
        lies below a one-parameter section through it by a computed number of
        bits at declared parameter sets. IT CANNOT certify anything about the
        real cost of the algorithm, because the model it re-optimises is the
        paper's own optimistic one -- Section 4.1 says so, and this goal's own
        EV-PEC-857664 measured one of its conventions to be wrong by orders of
        magnitude. It cannot move an exponent, cannot bear on Heuristic 1, and
        cannot decide completion criterion 1. A frontier computed under an
        optimistic model is a statement about that model.
      nearby_object_control: >-
        THE DEGENERATE NO-SMOOTHNESS INSTANCE, which is the closest object where
        the hoped-for conclusion MUST FAIL. Set Psi(X,B) := X (every integer
        smooth) and P0 := 1 (no retries). Then log TIME = 2 log X = beta + L/3 is
        monotone increasing in beta with no interior optimum, both branches
        select the same boundary B, and the re-optimisation gain is forced to be
        EXACTLY 0 at every w. A method that reports a gain THERE is responding to
        its own numerics rather than to the smoothness-versus-retry trade, and
        has not identified the load-bearing structure. This control is free, it
        is run on the identical code path, and its forced value is derived here
        before the run.
    proof_obligations:
    - claim: >-
        The transcription in mechanism (1) is a faithful transcription of Section
        4.1 and of Lemmas 3.3 and 3.5, with every symbol matched to the source.
      responsibility: baseline
    - claim: >-
        The corner identity (3/2) log M - (1/2) log M = log M holds and is
        implemented, so the corner gain is structurally zero.
      responsibility: correctness
    - claim: >-
        The stationarity comparison in mechanism (3) is correct, including both
        bracketed constants, which are stated to four decimals and are
        recomputable by hand.
      responsibility: correctness
    - claim: >-
        The variant list is closed before evaluation and every member is reported,
        with its reproduction error, whether or not it wins.
      responsibility: strictness
    - claim: >-
        The pooling sub-variant is rejected by the argument given, not by a tally.
      responsibility: scope
    - claim: >-
        Nothing here is an empirical measurement; the claim tier is derivation /
        tool verification and every citation carries it.
      responsibility: scope
    - claim: >-
        The Y axis depends on H-WESO-9dc201's unvalidated density law, and the
        B-only envelope is computed and reported separately so that a failure of
        that law cannot contaminate the B-axis result.
      responsibility: interface
    not_applicable_reason: null

  rerandomization: >-
    Not proposed and not modified. Algorithm 3's re-randomising walk is inherited
    unchanged; the retry count 1/(rho P0) presupposes that attempts are
    independent draws from the population, which is the paper's own assumption
    and is the same one whose failure would revive the pooling sub-variant
    rejected in mechanism (5). The dependence is recorded because the pooling
    argument turns on it.

  asymptotic_claim: >-
    NONE. Deliberately null. Both the published section and the re-optimised
    envelope are p^{1/2+o(1)}/w^{1/2} in the memory-constrained regime and
    p^{1/3+o(1)} at the corner. sota_delta is 0.000 in the time exponent and
    0.000 in the memory exponent at every memory budget, and dominated_by is
    Pareto-EQUALITY with the frozen paper's own stated interpolation rather than
    domination in either direction. The entire content lies inside the o(1). This
    is stated as the asymptotic claim precisely so that no downstream record can
    represent a bit-level frontier improvement as an exponent result.

  heuristic_assumptions:
  - id: HX-1
    formal_statement: >-
      NONE OF THE PRIMARY CONTENT IS HEURISTIC. (P1) is a deterministic
      recomputation of a published model; the corner zero is an algebraic
      identity; the direction in (P2) is a comparison of two stationarity
      conditions. This entry exists to record that fact and to isolate the two
      places an assumption does enter, HX-2 and HX-3.
    random_model_justification: n/a
    supporting_results: []
    validation_experiment_ids: [EXP-WESO-af139f]
    falsification_condition: >-
      If any reviewer identifies a distributional assumption inside (P1) or
      inside the corner identity, this entry is wrong and must be superseded.
  - id: HX-2
    formal_statement: >-
      The middle-memory cost of the claw step is C * M^{3/2} w^{-1/2} for an M-
      and w-independent C, and with k golden collisions it becomes
      C * M^{3/2} w^{-1/2} k^{-e} for a fixed e in [1/2, 1].
    random_model_justification: >-
      Quoted from the frozen paper's Section 1.1, attributed there to [43], which
      is NOT READ. Neither C nor e is asserted from memory anywhere in this
      record; e is carried as a RANGE through every downstream number so that no
      result depends on its resolution. The standard derivation assumes one
      golden collision among Theta(M) spurious ones; whether that holds here is
      a separate measurable question raised by IDEA-20260805-b4bc59.
    supporting_results: []
    validation_experiment_ids: [EXP-WESO-af139f]
    falsification_condition: >-
      Retrieve [43], and the practical treatments [3] and [16] the frozen paper
      names, and record the exponent and constant verbatim with page references.
      If the retrieved exponent is not 3/2, mechanism (3)'s coefficient changes
      and the beta_ratio prediction is recomputed before it is compared with any
      measurement. If none of the three can be obtained, both endpoints of e are
      reported permanently and neither is picked.
  - id: HX-3
    formal_statement: >-
      rho_p(Y) = 8 Y^{3/2} p^{-1/2+o(1)}, imported from H-WESO-9dc201 so that the
      second parameter Y is meaningful.
    random_model_justification: >-
      Derived there from a class-number count with two exact anchors, and NOT YET
      MEASURED. Load-bearing ONLY for the Y axis of the envelope. The B-axis
      result of mechanism (3) is entirely independent of it.
    supporting_results: []
    validation_experiment_ids: [EXP-WESO-f5166c, EXP-WESO-af139f]
    falsification_condition: >-
      The B-only envelope and the (Y,B) envelope are computed and reported as
      SEPARATE arms, so that a refutation of the density law by EXP-WESO-f5166c
      removes the Y arm without touching the B arm. If the two arms are ever
      merged into one reported number, that is itself a protocol violation.

  structural_ingredients:
  - description: >-
      The published cost model and its five-row output table.
    citation: >-
      Section 4.1 of inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, READ IN FULL
      and quoted verbatim, together with Lemma 3.3, Lemma 3.5, Theorem 1.4 and
      Algorithm 2 line 1.
    role: the object of (P1); a model plus its published output is a forced value
  - description: >-
      The middle-memory interpolation sqrt(N^3/w) = p^{1/2+o(1)}/w^{1/2}.
    citation: >-
      Section 1.1 of the same frozen text, attributed there to [43]
      (van Oorschot-Wiener). [43] NOT READ; the practical treatments [3] and [16]
      NOT READ. Retrieving all three is a declared stage and is the same
      bibliographic subtask this goal's next_action has carried unexecuted
      through three consecutive red-team reports.
    role: supplies the exponent 3/2 in the memory-constrained objective
  - description: >-
      The free parameter Y and the density law rho_p(Y).
    citation: ledger/hypotheses/H-WESO-9dc201.yaml (proposed, unvalidated)
    role: the second axis of the envelope; isolated in its own arm

  reduction_chain:
    core_problem: >-
      Determine whether the frozen paper's published concrete-cost table follows
      from its own published model, and whether the published middle-memory line
      is the algorithm's frontier or a section through it.
    corollaries:
    - >-
      If (P1) fails under every declared variant, every concrete margin statement
      in GOAL-P13-001 is anchored to numbers that cannot be regenerated from the
      published model, and the honest disposition of those statements changes --
      not their sign, but the provenance qualification every citation of them
      must carry.
    - >-
      If (P2) holds, the middle-memory numbers this goal compares against
      Delfs-Galbraith are too high by the computed gain, so the crossover memory
      budget moves in the attacker's favour by a stated number of bits.
    corollaries_note: >-
      DELIBERATELY SHORT. There is no reduction from this hypothesis to Heuristic
      1, to any per-entry cost value, or to completion criterion 1. It is a
      statement about a formula and its published output, and any citation
      reaching further than that is misusing it.

  predictions:
  - metric: >-
      X1 - reproduction error: max over the five published parameter sets and
      both columns of |reconstructed log2 value - published log2 value|, under
      the best-fitting declared variant
    direction: lower
    minimum_effect: >-
      'Target 0.05 bits, tolerance 0.5 bits across all TEN numbers
      simultaneously. <= 0.5 is REPRODUCTION. > 2.0 under every one of the eight
      declared variants is a REPRODUCTION FAILURE and is the headline result of
      the stage. Between 0.5 and 2.0 the verdict is "reproduced only under a
      variant the paper does not state", reported with the variant named.'
  - metric: >-
      X2 - corner gain: (published-section cost) minus (re-optimised cost) at
      w = M, in bits, at each of the five parameter sets
    direction: different
    minimum_effect: >-
      'EXACTLY 0, to within 1e-6 bits. An algebraic identity, not an expectation.
      A nonzero corner gain means the optimiser or the objective is wrong and NO
      frontier number from that run may be reported in either direction.'
  - metric: >-
      X3 - flat-null gain: the same quantity on the degenerate no-smoothness
      instance (Psi := X, P0 := 1), at every memory budget on the grid
    direction: different
    minimum_effect: >-
      'EXACTLY 0 at every w, to within 1e-6 bits. Derived: the objective is
      monotone in beta with no interior optimum, so both branches select the same
      boundary B. If the optimiser reports a gain here it is finding a spurious
      interior optimum and the treatment gains are numerical artefacts.'
  - metric: >-
      X4 - frontier gain and its monotonicity: reopt_gain_bits(w) at
      w = M * 2^{-k}, k in {0, 8, 16, 24, 32, 48, 64}, at log2 p = 256
    direction: higher
    minimum_effect: >-
      '>= 0 at every w by construction, > 0 at every w < M by the strict
      inequality of the two stationarity conditions, and NON-DECREASING as w
      falls, at all seven points. NO BIT COUNT IS PREDICTED -- that is what the
      run is for, and predicting one would be inventing a measurement. A
      non-monotone gain localises the defect to a memory decade rather than
      leaving "it did not work".'
  - metric: >-
      X5 - beta_ratio: (optimal log B at the smallest w on the grid) / (optimal
      log B at w = M), at log2 p = 256
    direction: lower
    minimum_effect: >-
      'Strictly below 1.0, with the asymptotic target ~0.58 derived in mechanism
      (3) and a pre-registered admissible band [0.40, 0.95] because 256 bits is
      not the asymptotic regime. A ratio >= 1.0 contradicts the derivation
      outright and refutes (P2) on its own axis.'
  - metric: >-
      X6 - variant multiplicity: the number of declared variants that reproduce
      the ten published numbers within 0.5 bits
    direction: lower
    minimum_effect: >-
      'Reported, with no forced value. If it exceeds 1, the published observable
      does not identify the model, and the frontier must then be reported under
      EVERY surviving variant rather than under one. This is the identifiability
      readout and it is reported whether or not it is convenient.'
  - metric: >-
      X7 - Delfs-Galbraith crossover: the memory budget at which the re-optimised
      frontier first beats the 2^128 F_{p^2}-operation figure the frozen paper
      quotes for previous methods at log2 p = 256, beside the same quantity for
      the published section
    direction: lower
    minimum_effect: >-
      'Reported in bits of memory. NO VALUE IS PREDICTED. What IS pre-registered:
      the re-optimised crossover must be at a memory budget less than or equal to
      the published-section crossover, since the re-optimised cost is pointwise no
      larger. A strictly larger crossover is impossible and indicates a defect.'

