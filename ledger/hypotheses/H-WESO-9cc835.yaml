  falsification_conditions:
  - >-
    F1 (SECONDS, THE PRIMARY AND CHEAPEST FALSIFIER) - no declared variant
    reproduces the published table within 2 bits. (P1) is refuted, and the
    frontier work is not meaningful against a model that does not reproduce its
    own published output. The deliverable becomes a reproducibility finding about
    Section 4.1 -- a first-class negative, and the more valuable outcome.
  - >-
    F2 - the corner null X2 is nonzero. The optimiser is wrong; nothing may be
    reported.
  - >-
    F3 - the flat null X3 is nonzero. The gains are numerical artefacts.
  - >-
    F4 - X5 returns beta_ratio >= 1.0. Mechanism (3) is wrong and (P2) is refuted
    on its own axis, independently of the density law.
  - >-
    F5 - X4 is non-monotone with no identifiable cause. The envelope is not being
    computed correctly.
  - >-
    F6 - retrieval of [43] establishes that the middle-memory cost exponent is
    not greater than 1. Mechanism (3)'s premise fails and (P2) is void.
  - >-
    F7 (THE PLANNED NEGATIVE, AND IT IS A DELIVERABLE) - neither part survives
    and the batch does NOT emit the variant table, the reproduction error under
    each, the exact tested boundary, and a concrete successor. A negative without
    that statement HAS NOT FINISHED, and a count of variants that failed is a
    fatigue report rather than a closure (inventor-protocol section 4).

  interpretation_limits:
  - >-
    NO EXPONENT MOVES. Both the published section and the re-optimised envelope
    are p^{1/2+o(1)}/w^{1/2}; sota_delta is 0.000 in both exponents at every
    memory budget. The entire content is inside the o(1). It is proposed anyway
    because DEC-20260802-48c72c records this goal's residual as 13.94 to 16.62
    bits wide and living entirely inside that o(1).
  - >-
    A REPRODUCTION FAILURE IS A FINDING ABOUT A PUBLISHED COST TABLE. It is not
    an objection to Theorem 1.1, to Corollary 1.2, to Heuristic 1, or to any
    mathematical claim in the frozen paper, and no record derived from it may say
    otherwise. Section 4.1 itself calls its numbers a rough underestimation that
    "should not be interpreted as accurate predictions".
  - >-
    CLAIM TIER: derivation for the algebra, TOOL-VERIFICATION for the arithmetic.
    NEITHER toy NOR crypto empirical evidence -- no curve is constructed and
    nothing about the world is measured. The parameter sets are cryptographic but
    the object is a formula, and the tier follows the object, not the parameters.
    This is stated explicitly because a table of 256-bit numbers is exactly the
    kind of artifact that gets cited as crypto-scale evidence.
  - >-
    THE FRONTIER IS COMPUTED UNDER THE PAPER'S OWN OPTIMISTIC MODEL, including
    its one-operation-per-entry convention which this goal's own EV-PEC-857664
    measured to be wrong at the tested scale in the attack's disfavour. A
    frontier computed under an optimistic model is a statement about that model.
    No number from that lane is used here, and no statement here may be combined
    with one from that lane without an explicit reconciliation record.
  - >-
    NO STATUS CHANGE to H-WESO-001 or GOAL-P13-001 is proposed or implied, and
    nothing here bears on completion criterion 1.

