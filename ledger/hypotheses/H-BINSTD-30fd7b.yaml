  title: >-
    The written block sum is 131.99, and 2^131/131 is below 2^123.97.
  statement: >-
    The product 32 times 131 is 4192. The group order 4 times the
    quoted cofactor partner is strictly above 2^131, and its
    logarithm rounds to 131.0000 at four decimals without equalling
    131. The power 2^131/131 is strictly below 2^123.97 and strictly
    above 2^123.96. The written m = 3 block tenths add to 131.99,
    not 132.00. The written m = 4 block tenths add to 133.00. The
    quotient 1133/1686 is strictly above 0.672 and strictly below
    0.673. Half of log2(3) is strictly above 0.792 and strictly
    below 0.7925, so the written gap 0.80 is above it. Dividing
    the order by 4 multiplies a square-root scale by 2 and a
    reciprocal scale by 4.
  mechanism: >-
    The proposal prices large-prime rows by hand. This contract
    checks the integer identities in that arithmetic. It does not
    run an oracle.
