hypothesis:
  id: H-NGCC-ad4a16
  question_id: RQ-NGCC-f52138
  idea_id: IDEA-20261002-91218b
  statement: >-
    On the official NGCC round-1 CEDRUS+C submission (sign-03), for every
    declared parameter set, the few-time signature address expression in
    the unmodified reference source takes exactly four distinct values on
    the domain the specification assigns to that address.
  mechanism: >-
    The quantity under test is the size of the image of the address map, as
    the source writes it. The specification's domain size is read from the
    specification before the count. The finding's claim is image size 4.
    This hypothesis does not restate the macro, and it does not include a
    forgery search. sign-04 is not part of the statement.
  assumptions:
    - The specification names the few-time address and the set of inputs it ranges over.
    - The reference source contains one expression that computes that address. If several disagree, the run records them and is inconclusive rather than a confirmation.
  proof_search_map:
    not_applicable_reason: >-
      This hypothesis is a finite count of an address map in submitted
      source. It asserts no theorem and no forgery.
    bottleneck: null
    baseline_embedding:
      parameter_slice: null
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms: []
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations: []
  predictions:
    - metric: distinct_address_outputs
      direction: different
      minimum_effect: >-
        Exactly 4 distinct outputs, on a specification domain whose size is
        greater than 4, for every declared parameter set.
  test_boundary:
    instances:
      - sign-03 CEDRUS+C, official round-1 zip named in inputs/ngcc-round1-20260920/candidates.yaml
    parameters:
      parameter_sets: every set the official package declares
    implementation: >-
      The address expression is read from the unmodified reference C
      sources and evaluated by a counter this program writes. Submission
      binaries, object files, and submission build scripts are not executed.
    budget:
      enforcement: advisory
      wall_clock_seconds_per_run: null
      maximum_memory_gb: 4
  falsification_conditions:
    - >-
      For every declared parameter set, the number of distinct outputs
      equals the specification domain size.
  interpretation_limits:
    - An image of size 4 is the published defect. It is not, by itself, a forgery transcript.
    - A domain the specification does not state is not invented. That parameter set is inconclusive.
    - sign-04 is a different submission and is not covered.
  status: specified
  proposed_by: coordinator
