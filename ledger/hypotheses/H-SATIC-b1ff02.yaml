  title: >-
    The degree-2 monomial bound selects the seven written free-bit counts.
  statement: >-
    The monomial count at u free bits is 1 + u + C(u, 2), which equals
    (u^2 + u + 2) / 2. At u = 5, 6, 7, 8, 9, 12, 13, 15 and 16 the counts
    are 16, 22, 29, 37, 46, 79, 92, 121 and 137. For n = 17, 19, 23, 29,
    37, 89 and 131 the largest u with that count at most n is 5, 5, 6, 7,
    8, 12 and 15. Those seven values sum to 58. At n = 29 the count at
    u = 7 is 29, and at n = 37 the count at u = 8 is 37, so equality is
    inside the bound. The next count exceeds n in each of the seven
    cases. The integer square root of 2n, rounded down, is 5, 6, 6, 7,
    8, 13 and 16. It exceeds the free-bit count by 1 at n = 19, 89 and
    131, because 36 <= 38 < 49, 169 <= 178 < 196,     and 256 <= 262 < 289.
    The power 2^5 is 32 and the power 2^8 is 256.
  mechanism: >-
    The proposal defines a free-bit cutoff by a degree-2 monomial count.
    This contract checks that cutoff on the seven written field degrees.
    It does not run a rank simulation and it does not run a solver.
