hypothesis:
  id: H-PFDR-c88f14
  question_id: RQ-PFDR-ae2fba
  source_idea_id: IDEA-20260903-d52480
  title: >-
    No bounded-last-fall-degree theorem transfers to the prime-field digit
    presentation (the Frobenius cyclic-shift lemma of arXiv:2103.07282 has no
    F_p analogue and the reducibility hypothesis is unavailable), so the last
    fall degree must be MEASURED on the s-ladder; the pair (d_ff, d_lf)
    separates semi-regular growth, isolated early falls that do not cascade,
    and the genuinely bounded case, and only the bounded case licenses
    IDEA-20260830-84cdb7's conditional exponent
  statement: >-
    (A) TRANSFER, DERIVED. arXiv:2103.07282 (retrieved at abstract and ar5iv
    level by the proposing session) proves, for F over k = F_{q^n} with
    subfield k' = F_q and F'_1 its Weil descent with field equations,
    max(d_{F_1}, q deg F) = max(d_{F'_1}, q deg F) (Theorem 1.1) and, IF F is
    reducible for k, d_{F'_1} <= max((q - 1) m + 1, q d) (Theorem 2.6), via
    Lemma 2.1: the q-th power of a descended linear form is, modulo the field
    equations, the same form with its coordinate index cyclically shifted,
    because x -> x^q is the Frobenius over k'. The digit presentation's
    formal dictionary is q <-> d, n <-> s, X_{ij} <-> a_{k,i}. Over F_p the
    only Frobenius is x -> x^p, the identity on F_p, fixing every digit value
    and permuting no digit position; the digit map is not additive (carries);
    so Lemma 2.1 has no analogue and the propagation it buys is absent
    (B1). The reducibility hypothesis needs k'-linear structure, and F_p has
    no subfield (B2). CONSEQUENCE: no version of the bounded-last-fall
    theorem transfers; the formal analogue constant max((d - 1) m + 1,
    d 2m) = 4m at d = 2 is a number with no theorem behind it.
    (B) THE MEASUREMENT. Tracked object: the pair (d_ff(s), d_lf(s)) on the
    ladder m = 2, d = 2, s in {1..5}, with d_ff the first-fall degree of
    84cdb7 / H-PFDR-4148b8 and d_lf the last fall degree computed by the
    V_{F,D} closure of Huang-Kosters-Yeo in exact linear algebra over F_p
    (order-independent by construction), reported with a censoring flag
    whenever no fall is observed in (d, D_max]. Three pre-registered
    outcomes. OUTCOME I (semi-regular): d_lf grows with slope
    indistinguishable from m/2 = 1 in s and d_lf minus the null formula
    ceil((ms(d-1) + 2m)/2) lies in {0, 1, 2}. OUTCOME II (isolated early
    fall): d_ff grows strictly slower than d_lf while d_lf keeps slope 1 --
    the case in which a first-fall-based cost model is wrong by an unbounded
    factor; H-PFDR-4148b8 already predicts d_ff slope 1/2, so Outcome II is
    the pre-registered EXPECTATION for the pair if d_lf is semi-regular.
    OUTCOME III (bounded): d_lf flat across at least four consecutive
    uncensored s; the only outcome that licenses 84cdb7's conditional
    exponent, with D_0 = the flat value handed to H-PFDR-06fd60's cost
    table, which shows D_0 <= 6 is needed at 256 bits.
    (C) The ladder cannot test 'd_lf <= 4m' (the null reaches 3..7 at s =
    1..5 against 8), so a flat d_lf at s <= 5 is a slope statement at
    resolution 0.25, never a bound in s.
    (D) A bounded last fall degree would bound ONE complexity measure -- the
    Macaulay degree of a solve, via Huang-Kosters-Yeo's relation (recalled)
    -- and would not bound the number of solves, touch yield (KN-FIND-007),
    or conclude any subexponential ECDLP algorithm.
  mechanism: >-
    THE LAST-FALL CLOSURE AS AN INSTRUMENT. Fix D. Start from W_0 = the
    degree-<= D Macaulay row space of the generators in the multilinear
    quotient; iterate: extract a basis of W_t cap R_{<= D-1} (elements whose
    leading form dropped), multiply each by all monomials keeping degree
    <= D, add, reduce, obtain W_{t+1}; stop at the fixed point V_{F,D}. A
    fall at D means V_{F,D} cap R_{<= D-1} strictly contains V_{F,D-1}.
    d_ff is the least D with a fall (coinciding with the graded-rank d_ff at
    the first iteration, reported through the same code path as a
    consistency check); d_lf is the largest D <= D_max with a fall, with the
    censoring flag. The iteration count per degree is a required metric: a
    claimed fall with iteration count 1 is the artifact tell of a
    non-iterating closure. WHY THE PAIR: d_ff alone (84cdb7) cannot separate
    Outcome II from III; d_lf alone cannot separate I from II; the pair is
    the lossy projection of the fall history to its two endpoints and is
    exactly what the three mechanisms differ on. WHY A SLOPE TEST: at m = 2,
    d = 2 the semi-regular null is s + 2 (3, 4, 5, 6, 7 at s = 1..5) and the
    formal analogue constant 8 is not reached until s = 6, whose D = 8 cell
    is excluded by 84cdb7's memory contract; so the ladder tests slope 0
    against slope 1 at resolution 0.25 with four to five points. THE COST
    ENVELOPE: at most binom(ms + D, D) rank computations per cell in the
    multilinear quotient (2^{ms} columns, 1024 at s = 5), a small multiple of
    84cdb7's per-cell cost.
  assumptions:
    - >-
      Same construction as 84cdb7: p > 3, d^s <= p, planted targets with
      certificates, the y^2 = f(x) soundness arm run on a subsample; no
      yield statement is read.
    - >-
      The V_{F,D} closure is computed to a fixed point at each D by exact
      arithmetic; termination is guaranteed by finite dimension.
    - >-
      d_lf is reported with a censoring flag whenever no fall is observed in
      (d, D_max]; a censored cell never enters a slope fit.
    - >-
      The closure convention ('multiply only fallen elements' versus
      'multiply everything') is frozen at Stage 1 and pinned by the
      known-answer fixtures.
    - >-
      The F_p Macaulay meter has passed its p = 2 known answer against
      KN-FIND-006 and the planted-syzygy positive control.
  proof_search_map:
    bottleneck: >-
      The step of arXiv:2103.07282's argument that lets a fall found in one
      descended coordinate block propagate to all blocks at no degree cost:
      Lemma 2.1, the Frobenius cyclic shift. Its absence over F_p is the
      exact reason no bound transfers.
    baseline_embedding:
      parameter_slice: >-
        Two slices. (i) s = 1, where the digit system IS the direct
        presentation with B = d = 2 and IDEA-20260808-afe4ce's floor
        d_lf >= B must be reproduced by the closure. (ii) A known-answer
        fixture pinning the closure to the theorem's invariant: a small
        F_2 Weil-descent system whose conformance to Theorem 2.6's
        hypotheses is established in the Stage 1 note; if no such fixture
        can be exhibited, a PLANTED-FALL fixture (an added generator
        g = u f_1 + v f_2 + h with deg h < deg g, whose first fall is at
        deg g with known content h) is the known answer and the
        substitution is recorded.
      reproduction_check: >-
        Symbolic at s = 1 (generator list identical to 84cdb7's s = 1
        slice; afe4ce's floor respected); numeric on the known-answer
        fixture with the fall history logged; exact agreement of the
        closure's d_ff with the graded-rank d_ff of EXP-PFDR-5726af on the
        shared (2, 2, s) cells at p = 4099.
    observation_collision:
      observable: >-
        The pair (d_ff(s), d_lf(s)) and the full fall history {D : fall at D}.
      distinct_preimage_search: >-
        REQUIRED AND BLOCKING: the support-matched random generator null
        (NULL-1), the random multilinear null of matched per-block degree
        (NULL-2) and the block-factored null of H-PFDR-4148b8 (NULL-3) are
        run through the identical closure. If NULL-1 or NULL-2 gives the
        same pair as the Semaev arm at every cell, the observable carries no
        summation-polynomial information and every conclusion is about
        degree-2 complete intersections. NULL-3 is predicted to reproduce
        d_ff exactly (H-PFDR-4148b8) with NO direction pre-committed for
        d_lf: d_lf is where the curve first enters, if it enters at all.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the single integer d_ff by the pair (d_ff, d_lf) and,
          where budget allows, the whole fall history.
        predicted_gain: >-
          Separates three mechanisms that d_ff alone merges; exposes Outcome
          II, the case that makes 84cdb7's H1 true and worthless.
      - transform: observable_fiber
        proposed_object: >-
          Hold (m, d, s) fixed and vary the forgotten structure: Semaev
          generator, random same-support generator, block-factored
          generator, non-curve cubic.
        predicted_gain: >-
          Attributes any bounded d_lf to the curve or to the digit complete
          intersection before it is believed.
    quantifier_order: >-
      NOT CLAIMED (the theorem does not transfer): THERE EXISTS D_0 FOR ALL
      s such that d_lf(m, d, s) <= D_0. MEASURED: FOR ALL cells of the
      declared ladder, the fitted slopes of d_ff and d_lf in s with 95
      percent intervals at resolution 0.25, the outcome label by the
      pre-registered rule, and the count of censored cells. The vacuous
      reading FOR ALL s THERE EXISTS D_0 is not what Outcome III means.
    method_ceiling:
      strongest_certifiable_claim: >-
        'On the tested (m, d, s, p, curve) ladder and the frozen closure
        convention, the last fall degree of the digit-presented prime-field
        decomposition system has fitted slope beta_lf with interval I_lf,
        and the first fall degree has slope beta_ff with interval I_ff.' It
        cannot certify a bound uniform in s, cannot reach the formal
        analogue constant 4m, and cannot certify any solver's actual cost.
      nearby_object_control: >-
        The known-answer fixture (an F_2 descent system satisfying Theorem
        2.6's hypotheses, or the planted-fall fixture) where the closure's
        answer is KNOWN; and the random-generator digit null, where a
        closure reporting boundedness is measuring the complete
        intersection.
    proof_obligations:
      - claim: >-
          Lemma 2.1 of arXiv:2103.07282 has no analogue over F_p because
          x -> x^p fixes every digit and permutes no digit position.
        responsibility: correctness
      - claim: >-
          The closure reproduces afe4ce's floor at s = 1 and the known
          answer on the fixture.
        responsibility: baseline
      - claim: >-
          d_ff computed by the closure agrees with the graded-rank d_ff on
          every cell.
        responsibility: interface
      - claim: >-
          Censored cells never enter a slope fit; Outcome III is not
          declared from a ladder with censored or aborted cells at its top.
        responsibility: scope
      - claim: >-
          Per-cell cost is at most a constant multiple of 84cdb7's under
          the same memory contract.
        responsibility: memory
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        LAST-FALL SEMI-REGULARITY OF THE NULL. For the random-generator
        digit system at fixed (m, d), the last fall degree satisfies
        d_lf = ceil((ms(d - 1) + 2m)/2) + c with c in {0, 1, 2}, uniformly
        in s on the tested ladder and in p >= 2^12.
      random_model_justification: >-
        Rigorous: the digit field equations form a regular sequence whose
        quotient has Hilbert series (1 + ... + z^{d-1})^{ms}; the first fall
        of a semi-regular sequence is at the first non-positive coefficient.
        Classical distribution imitated: Froberg / Bardet-Faugere-Salvy
        semi-regularity for the one extra generator, plus the expectation
        that for a zero-dimensional semi-regular system the falls cascade
        to completion within O(1) degrees of the first; the O(1) is the
        heuristic content and is why c is a band.
      supporting_results:
        - ref: IDEA-20260830-84cdb7
          provenance: internal
          claim: >-
            The digit presentation, its null ceil((ms(d-1) + 2m)/2), its
            d_ff definition, ladder and memory contract.
          verified_by: coordinator, TASK-20260903-b5d2ae (record read in full)
        - ref: IDEA-20260903-d52480
          provenance: internal
          claim: >-
            The transfer analysis (A)-(B), the closure instrument, the
            three-outcome rule, and H1 as stated here.
          verified_by: coordinator, TASK-20260903-b5d2ae (record read in full)
      validation_experiment_ids:
        - EXP-PFDR-cbdefb
      falsification_condition: >-
        NULL-1 or NULL-2 d_lf outside the band {0, 1, 2} above the null
        formula at any uncensored cell with p >= 2^12, or a band offset c
        that grows with s; the Semaev arm's deviation is then read relative
        to the measured null, not the formula, and the band is widened
        before any Semaev value is read.
    - id: HEUR-002
      formal_statement: >-
        BOUNDED LAST FALL, DIGIT FORM (the hypothesis Outcome III would
        support and Outcomes I and II refute). There exists D_0 depending on
        (m, d) but not on s, p or the curve such that d_lf(m, d, s) <= D_0.
      random_model_justification: >-
        NONE transfers, and that is claim (A): the descent theorem's lemma
        has no F_p analogue. The classical statement imitated is the
        retrieved Theorem 2.6 with the dictionary q <-> d, n <-> s. The
        honest prior is AGAINST HEUR-002 (KN-LIT-7607's doubt adopted, and
        the semi-regular null contradicts it).
      supporting_results:
        - ref: 'arXiv:2103.07282'
          provenance: retrieved
          claim: >-
            Ming-Deh Huang (abstract page): definition of last fall degree;
            Theorem 1.1; Theorem 2.6 with the reducibility hypothesis; Lemma
            2.1 (Frobenius cyclic shift); general q; no mention of summation
            polynomials, Semaev or ECDLP in the retrieved text. Retrieved at
            abstract and ar5iv-HTML level by the idea-generator; proof
            bodies not read.
          verified_by: 'idea-generator lane C, TASK-20260903-dc126c (2026-09-03), abstract page and ar5iv HTML via WebFetch; relayed by coordinator TASK-20260903-b5d2ae'
        - ref: KN-LIT-7607
          provenance: internal
          claim: >-
            Huang-Kosters-Yeo: the last fall degree is monomial-order
            independent; the first fall degree assumption is unlikely to
            hold for a Weil-descent summation system.
          verified_by: coordinator, TASK-20260903-b5d2ae (corpus note as cited in IDEA-20260903-d52480; not reopened)
      validation_experiment_ids:
        - EXP-PFDR-cbdefb
      falsification_condition: >-
        A fitted d_lf slope whose 95 percent interval excludes 0 at
        resolution 0.25 on a ladder with no censored or aborted cells at its
        top (Outcomes I and II both falsify it); the pre-registered
        expectation is that this condition fires.
  structural_ingredients:
    - description: >-
        The last fall degree V_{F,i} closure definition and its
        monomial-order independence.
      citation: 'Huang, Kosters, Yeo, Last fall degree, HFE, and Weil descent attacks on ECDLP, CRYPTO 2015 (KN-LIT-7607)'
      provenance: recalled
      verified_by: null
      role: definition of the tracked invariant; corpus note read, paper not opened
    - description: >-
        The Frobenius cyclic-shift lemma and the reducibility hypothesis of
        the bounded-last-fall theorem for Weil descents.
      citation: 'arXiv:2103.07282, Lemma 2.1 and Theorem 2.6'
      provenance: retrieved
      verified_by: 'idea-generator lane C, TASK-20260903-dc126c (abstract and ar5iv HTML), 2026-09-03'
      role: the non-transferring step (claim A)
    - description: >-
        The last-fall floor d_lf >= B for the direct presentation, vacuous
        (d_lf >= d) in the digit presentation, so the floor no longer
        pre-decides the measurement.
      citation: IDEA-20260808-afe4ce
      provenance: internal
      verified_by: coordinator, TASK-20260903-b5d2ae (as cited in IDEA-20260903-d52480 and IDEA-20260830-84cdb7; not reopened)
      role: baseline embedding at s = 1
  reduction_chain:
    core_problem: >-
      No attack problem is reduced. The core statement is that the
      invariant licensing 84cdb7's conditional exponent is the last fall
      degree, not the first, and that it must be measured because no bound
      transfers.
    corollaries: []
  predictions:
    - metric: >-
        P1 -- agreement of the closure's d_ff with the graded-rank d_ff
        (EXP-PFDR-5726af's engine) on every shared cell
      direction: different
      minimum_effect: >-
        FORCED EXACT. A mismatch is an instrument failure and no other
        number is admissible.
    - metric: >-
        P2 -- known-answer fixture (F_2 descent satisfying Theorem 2.6, or
        the planted-fall fixture)
      direction: different
      minimum_effect: >-
        FORCED: at or below the retrieved bound on the descent fixture; the
        planted fall degree and content exactly on the planted fixture. A
        violation means the closure implements a different invariant and
        the line halts.
    - metric: >-
        P3 -- d_ff at m = 2, d = 2, s in {2, 3, 4, 5}
      direction: different
      minimum_effect: >-
        FORCED EXACT 5, 5, 6, 6 by H-PFDR-4148b8's derivation
        (IDEA-20260903-e1e38b); slope 1/2. Inherited, not this hypothesis's
        own content; a deviation is routed to H-PFDR-4148b8.
    - metric: >-
        P4 -- fitted slope of d_lf against s at m = 2, d = 2, uncensored
        cells only
      direction: different
      minimum_effect: >-
        OUTCOME I when the 95 percent interval contains 1 and excludes 0.5;
        OUTCOME III when it contains 0 and excludes 0.25 with at least four
        consecutive uncensored flat cells; otherwise unresolved. The honest
        prior (IDEA-20260903-d52480) is 0.6 Outcome I, 0.25 Outcome II,
        0.05 Outcome III, 0.1 unresolved.
    - metric: >-
        P5 -- joint label from (slope of d_ff, slope of d_lf)
      direction: different
      minimum_effect: >-
        OUTCOME II is declared when the d_ff interval lies strictly below
        the d_lf point estimate and excludes 1, while the d_lf interval
        contains 1 and excludes 0.5. This is the Coordinator's
        pre-registered reconciliation of d52480's rule ('d_ff flat or
        sublinear') with e1e38b's derived d_ff slope 1/2, written before any
        run; under both derivations the EXPECTED label is Outcome II.
    - metric: >-
        P6 -- d_lf minus the null formula ceil((ms(d-1) + 2m)/2) on NULL-1
        and NULL-2
      direction: different
      minimum_effect: >-
        Within {0, 1, 2} at every uncensored cell (HEUR-001). Outside that
        band the null is not semi-regular in the last-fall sense and the
        Semaev arm's deviation is read relative to the measured null.
    - metric: >-
        P7 -- closure iteration count per cell and per degree
      direction: different
      minimum_effect: >-
        At least 2 at every degree where a fall is claimed; a claimed fall
        with iteration count 1 is the artifact tell.
  test_boundary:
    instances:
      - >-
        m = 2, d = 2, s in {1, 2, 3, 4, 5}; p in {4099, 16411, 65537}; 8
        generic-j curves per p; 5 planted targets per curve; D_max = 7
      - >-
        optional Stage 3 under the memory contract: m = 3, d = 2, s in
        {2, 3}, p = 65537, 3 curves, 2 targets, gated on the H-TOP check of
        EXP-PFDR-5726af
      - >-
        s = 1 baseline slice and the known-answer fixture (blocking)
    parameters:
      D_max: 7
      column_space: 'multilinear quotient a^2 = a, 2^{ms} columns (1024 at m = 2, s = 5)'
      arms: 'Semaev; NULL-1 support-matched; NULL-2 random multilinear matched per-block degree; NULL-3 block-factored (H-PFDR-4148b8); non-curve cubic'
      excluded_by_name: '(m, d, s, D) = (2, 2, 6, 8) per IDEA-20260830-84cdb7'
    implementation: >-
      The V_{F,D} closure implemented on top of the F_p port of
      experiments/EXP-SBRG-60c55e/driver/macaulay.py (validated on the
      p = 2 known answer against KN-FIND-006 and the planted-syzygy
      positive control), with the frozen closure convention, the iteration
      counter, the censoring flag, and 84cdb7's pre-flight memory gate.
    budget:
      wall_clock_seconds_per_run: 7200
      total_cpu_hours: 48
      maximum_memory_gb: 8
      maximum_runs: 48
  falsification_conditions:
    - >-
      F1. The closure fails the s = 1 slice, the known-answer fixture, or
      P1: instrument failure; nothing else is reported.
    - >-
      F2. OUTCOME I on the Semaev arm: no bounded last fall in the digit
      presentation at the tested scale; afe4ce's E1 closes with a slope for
      the last fall as well as the first.
    - >-
      F3. OUTCOME II (expected): the digit presentation has isolated early
      falls; 84cdb7's H1 is true at the first-fall level (slope 1/2, not
      bounded, per H-PFDR-4148b8) and does not license its exponent; every
      first-fall-based cost statement in this lane must be re-read against
      d_lf.
    - >-
      F4. OUTCOME III (long shot): d_lf flat; hand D_0 to H-PFDR-06fd60's
      cost table and record the conditional claim under the two-record rule;
      no bound in s is asserted, and independent review is required before
      any status change.
    - >-
      F5. NULL-1, NULL-2 or the non-curve cubic shows the same pair as the
      Semaev arm at every cell: controlled null; the measurement is about
      digit complete intersections.
    - >-
      F6. Censored or aborted cells at the top of the ladder: the slope is
      a bound, not an estimate, and Outcome III may not be declared.
  interpretation_limits:
    - >-
      Claim (A) is a derivation about a transfer and is not a theorem about
      the digit system; it says no bound is inherited, not that none exists.
    - >-
      All measured degrees are properties of a generating set and a frozen
      closure convention at toy scale, p <= 2^16, s <= 5.
    - >-
      No ECDLP claim in any outcome; Outcome III licenses only a
      conditional statement whose concrete cost is H-PFDR-06fd60's
      business.
    - >-
      No status change to any record; the KN-LIT-7605 discrepancy noted by
      IDEA-20260903-d52480 (author, field, absence of summation
      polynomials) is a pointer for the curator, not a correction filed
      here.
