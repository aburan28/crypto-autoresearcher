  reduction_chain:
    core_problem: >-
      The relation-matrix dimension, weight and linear-algebra memory implied by
      the exTNFS cost model at declared parameters, calibrated against a small
      tower-field computation run here, and reported as an (operations, memory)
      pair under two declared machine models.
    corollaries:
      - problem: >-
          The sensitivity of the quoted level to the memory charge, as one row of
          the sensitivity table RQ-PAIR-f2e31f asks for.
        reduction_ref: >-
          Internal- no published reduction is cited and, under the RQ constraint,
          none may be cited until the references are filed as KN-LIT entries.
        asymptotics_preserved: >-
          Not applicable. No attack, no exponent moved, and no statement that any
          deployed curve is broken or safe.
  predictions:
    - metric: >-
        P1- implied relation-matrix dimension and average row weight at the
        calibration sizes- two integers with their closed-form derivation
      direction: different
      minimum_effect: >-
        BOTH COMPUTABLE IN CLOSED FORM FROM THE MODEL SMOOTHNESS BOUND. IF THEY ARE
        NOT, THE MODEL IS UNDERSPECIFIED AND THAT IS THE FINDING, reported as such
        with the missing specification named, rather than patched with a
        convention chosen after the fact.
    - metric: >-
        P2- measured-versus-predicted ratio for dimension and for weight, at at
        least two calibration sizes (dimensionless, integers over integers)
      direction: different
      minimum_effect: >-
        REPORTED WITH ITS TREND ACROSS SIZES, not as a point value. An
        order-of-magnitude disagreement at small size is EXPECTED; a ratio that
        does not TREND, or trends in a direction the model cannot accommodate,
        UNANCHORS the extrapolation and it is withdrawn.
    - metric: >-
        P3- movement in effective level when memory is charged, in BITS, under each
        of TWO declared machine models
      direction: different
      minimum_effect: >-
        MATERIAL AT 5 BITS OR MORE under at least one model; PREMISE FALSIFIED at
        below 1 BIT under BOTH. THE SOURCE THRESHOLD -nonzero- IS REJECTED HERE AS
        A WIDTH-ZERO BAND that rounding alone crosses. Each figure carries the
        conversion from (operations, memory) to a single cost that produced it, and
        a row without its model tag and conversion is inadmissible.
    - metric: >-
        P4- machine-model sensitivity- the difference between the two models
        movements, in BITS
      direction: different
      minimum_effect: >-
        REPORTED. This is the quantity that makes the charge visibly a function of
        the model. A difference of zero between two genuinely different models
        would itself be surprising and must be investigated before either figure is
        quoted.
    - metric: >-
        P5- certificate check on every calibration logarithm
      direction: different
      minimum_effect: >-
        EVERY recovered exponent re-verified by exponentiation in an INDEPENDENT
        implementation. A failure means the pipeline is wrong and NO LATER FIGURE
        IS ADMISSIBLE, per the RQ constraint.
    - metric: >-
        P6- non-tower control- the identical accounting applied to an ordinary
        prime-field sieve matrix at matched size
      direction: different
      minimum_effect: >-
        REPORTED SIDE BY SIDE. PRE-STATED CONSEQUENCE- if the memory charge and its
        effective-bit movement are the same for the non-tower object at matched
        size, the result is a statement about SIEVE-TYPE LINEAR ALGEBRA and NOT
        about pairing-friendly elliptic curves or about any tower structure, and it
        may not be quoted as one. A difference is the tower-specific content and is
        the interesting outcome.
    - metric: >-
        P7- per-phase cost separation- relation collection, linear algebra and
        descent, each with its own operation count and peak memory
      direction: different
      minimum_effect: >-
        REPORTED SEPARATELY AT EVERY SIZE, because the model treats them separately
        and a merged number cannot calibrate it. A merged figure is inadmissible.
  test_boundary:
    instances:
      - >-
        Small tower fields of the SAME TOWER SHAPE as the deployed target, at at
        least two sizes small enough that a complete discrete logarithm finishes
        within the declared budget.
      - >-
        NON-TOWER CONTROL- an ordinary prime-field sieve instance at matched matrix
        size, through the identical accounting.
      - >-
        DECLARED DEPLOYMENT PARAMETERS, evaluated as a MODEL EVALUATION ONLY and
        labelled as such on every row.
    parameters:
      tower_shape: 'the same as the deployed target, declared in the contract'
      calibration_sizes: 'at least two, in increasing order, each run to a certified exponent'
      machine_models: 'exactly two, declared before the run, each named on every row'
      cost_unit: 'named field multiplications in a named field'
      memory_unit: 'bits'
    implementation: >-
      A tower construction, polynomial selection, relation collection, linear
      algebra over the appropriate ring, and an individual logarithm, with
      PER-PHASE operation counters and PER-PHASE allocator-level memory probes, and
      an independent verifier for the recovered exponent. The non-tower control
      runs through the identical accounting code.
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 24.0
      maximum_memory_gb: 16
      maximum_runs: 20
  falsification_conditions:
    - >-
      F1. The predicted matrix parameters disagree with the measured ones at the
      calibration sizes in a way that does not trend. The extrapolation is
      unanchored and is WITHDRAWN rather than reported with a wider interval.
    - >-
      F2. The memory charge moves the effective level by less than 1 BIT under BOTH
      declared machine models. THE PREMISE OF THE RECORD FAILS- memory is
      genuinely free at these sizes - and that is worth recording explicitly.
    - >-
      F3. The matrix dimension or weight is NOT computable in closed form from the
      model own smoothness bound. THE MODEL IS UNDERSPECIFIED and that is the
      finding.
    - >-
      F4. No certified exponent is obtained at any calibration size within budget.
      The calibration is UNAVAILABLE, every extrapolation must say so, and under
      the RQ constraint this is a budget outcome about a solver and NEVER evidence
      about the curve.
    - >-
      F5. Per-phase costs cannot be separated cleanly. The calibration is unusable
      for a model that is stated per phase, and is reported as unusable.
    - >-
      F6. The non-tower control shows the same charge and the same effective-bit
      movement at matched size. The result is about sieve-type linear algebra and
      NOT about pairing-friendly elliptic curves or the tower structure.
    - >-
      F7. The KN-LIT precondition is not discharged. EVERY COST CELL IS
      undetermined BY THE QUESTION OWN RULE, and the deliverable is a table of
      undetermined cells naming the missing sources. THAT IS A LEGITIMATE RESULT
      AND NOT A FAILURE.
  interpretation_limits:
    - >-
      THE DEPLOYMENT-PARAMETER PAIR IS AN EXTRAPOLATION AND A MODEL EVALUATION,
      NEVER A COMPUTATION AND NEVER A SECURITY VERDICT ABOUT A DEPLOYED CURVE. At
      those parameters the implied matrix has of order 2^30 or more rows and CANNOT
      BE BUILT, MEASURED OR SOLVED AT ANY SCALE THIS PROGRAM CAN REACH. This is
      stated rather than the claim being quietly shrunk to the calibration sizes.
    - >-
      NO COST CLAIM MAY BE RECORDED BEFORE THE exTNFS REFERENCE AND AT LEAST ONE
      PAIRING-CURVE KEY-SIZE ESTIMATION PAPER ARE FILED AS KN-LIT ENTRIES. That is
      RQ-PAIR-f2e31f verbatim constraint and it binds this hypothesis absolutely.
      The sources are currently RECALLED and UNREAD by any agent in this program.
    - >-
      A SCALAR BIT LEVEL WITH NO MEMORY STATEMENT IS NOT ADMISSIBLE OUTPUT of this
      question, and neither is a pair without its machine model.
    - >-
      OPERATIONS AND MEMORY ARE NEVER DIVIDED INTO EACH OTHER OR ADDED. An
      effective-bits figure is the logarithm of a cost computed from both under a
      declared model, and it carries that conversion on every row.
    - >-
      IF THE NON-TOWER CONTROL REPRODUCES THE CHARGE, NOTHING HERE IS A STATEMENT
      ABOUT PAIRING-FRIENDLY ELLIPTIC CURVES OR THE TOWER STRUCTURE. Pre-stated so
      it cannot be renegotiated after the data.
    - >-
      A FAILED OR INCOMPLETE CALIBRATION IS A BUDGET OUTCOME ABOUT A SOLVER AND
      NEVER EVIDENCE ABOUT THE CURVE, per the RQ constraint and AGENTS.md rule 5.
    - >-
      The source proposal calibration dependency on IDEA-20260809-15e1cd is not
      satisfiable- that record is an unconverted proposal with no contract and no
      runs. The calibration is internalised here instead, and that is a declared
      change from the source rather than an inherited assumption.
    - >-
      claim_tier is bounded by RQ-PAIR-f2e31f claim_tier_ceiling- cost-model and
      calibration claims only. No attack, no exponent moved, sota_delta zero.
