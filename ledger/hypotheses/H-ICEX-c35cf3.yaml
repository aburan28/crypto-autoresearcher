hypothesis:
  id: H-ICEX-c35cf3
  question_id: RQ-PAIR-f2e31f
  source_idea_id: IDEA-20260809-1a5cb2
  title: >-
    CHARGE THE PAIRING LINEAR-ALGEBRA MEMORY AND REPORT AN (OPERATIONS, MEMORY)
    PAIR - with three corrections that decide whether the record can be run at all-
    the measured-versus-predicted control the source relies on has NO DATA because
    the run set it names belongs to an unconverted proposal; the deployment-parameter
    figure is a MODEL EVALUATION and is not measurable at any reachable scale; and
    the source falsifier -movement nonzero- is a band of width zero that rounding
    alone crosses
  statement: >-
    (A) THE GAP. RQ-PAIR-f2e31f states VERBATIM that linear algebra on the exTNFS
    relation matrix is the step whose memory is routinely quoted as feasible
    without being costed, and requires VERBATIM that every cost figure be reported
    as an (operations, memory) pair with the machine model named, with a scalar bit
    level and no memory statement declared INADMISSIBLE OUTPUT of that question.
    (B) THE CLAIM. The relation-matrix dimension and average row weight implied by
    the cost model at declared parameters are computable in closed form from the
    model own smoothness bound; the block-Wiedemann memory profile follows under a
    DECLARED machine model; and reporting the pair rather than the scalar moves the
    effective level by an amount that is stateable and that DEPENDS ON THE MACHINE
    MODEL, which is the point.
    (C) THE BAND, FIXED BECAUSE THE SOURCE ONE CANNOT FIRE. The source predicts the
    movement in effective level is -nonzero and stateable-, and treats a movement of
    zero as the falsifier. ANY NONZERO ROUNDING SATISFIES -nonzero-, SO THE BAND
    HAS ZERO WIDTH ON THE WRONG SIDE AND THE ALTERNATIVE CANNOT CROSS IT.
    REPLACED BY A THRESHOLD- the movement is MATERIAL if it is at least 5 BITS
    under at least one of TWO declared machine models, and the premise is
    FALSIFIED if it is below 1 BIT under BOTH. Two machine models are mandatory
    precisely so that the charge is visibly a function of the model rather than a
    constant of nature.
    (D) THE CONTROL THAT HAS NO DATA, AND THE REPAIR. The source
    measured-versus-predicted control requires measuring the matrix actually
    produced by -the runs of IDEA-20260809-15e1cd-. IDEA-20260809-15e1cd IS AN
    UNCONVERTED PROPOSAL- status proposed, no hypothesis, no contract, no run
    record. THE CONTROL CANNOT FIRE AS WRITTEN. This hypothesis therefore brings
    the calibration INSIDE its own scope- a small tower-field discrete logarithm
    run here, at at least two sizes, whose matrix is measured and compared against
    the closed-form prediction. That is a dependency removal, not a scope
    expansion- without it the extrapolation has nothing to anchor to and the record
    would be a restatement of somebody else numbers.
    (E) WHAT IS NOT MEASURABLE, STATED RATHER THAN SHRUNK. At the deployed
    parameters the implied relation matrix has of order 2^30 or more rows. IT
    CANNOT BE BUILT, MEASURED OR SOLVED AT ANY SCALE THIS PROGRAM CAN REACH. The
    deployment-parameter pair is therefore A MODEL EVALUATION AND IS LABELLED AS
    ONE ON EVERY ROW, never a measurement, and under the RQ claim ceiling it is
    never a statement that any deployed curve is broken or safe.
    (F) THE BLOCKING LITERATURE PRECONDITION. RQ-PAIR-f2e31f states VERBATIM that
    no cost claim may be recorded before the exTNFS reference and at least one
    pairing-curve key-size estimation paper are filed as KN-LIT entries. The
    source proposal source_refs are marked RECALLED and REQUIRED READS and no such
    entry has been filed. UNTIL THEY ARE, EVERY COST CELL OF THIS HYPOTHESIS IS
    undetermined BY THE QUESTION OWN RULE, and a table of undetermined cells with
    the missing sources named is the honest deliverable.
  mechanism: >-
    THE OBJECT. The relation matrix of the extended tower number field sieve for
    the target field, tracked as the triple (dimension, average row weight, peak
    working memory of the linear-algebra phase under a declared machine model),
    together with the operation count that is already quoted. The projection
    discards the relations themselves and retains three numbers plus a model tag;
    it is lossy compatibly with the only operation performed on it, namely running
    a block-Wiedemann iteration, because that iteration cost is a function of
    exactly those three numbers under the declared model.
    WHY THE TRANSFER FROM FACTORING IS NOT AUTOMATIC. Memory-charged sieve costing
    exists in this program roadmap for factoring. The transfer to a tower field is
    not free- the matrix arises over a different ring, the relation structure
    differs, and the deployed target is an extension field rather than a prime
    field. The content of this record is the transferred computation AND ITS
    DIFFERENCES, not the discipline, and the differences are what the calibration
    arm exists to expose.
    WHY THE CALIBRATION MUST BE INSIDE THE CONTRACT. An extrapolation with no
    anchor is a restatement of the model that produced it. Measuring the matrix
    actually produced at a small tower size gives the prediction something to be
    wrong against, and the record commits IN ADVANCE to reporting the anchor
    disagreement with the model if there is one, per-phase, rather than only its
    agreement.
    WHY TWO MACHINE MODELS. A memory charge expressed in one machine model reads as
    a property of the algorithm. Expressed in two, it reads as what it is- a
    function of the model. The record reports both and a row without its model tag
    is inadmissible.
  assumptions:
    - >-
      The cost model smoothness bound determines the factor-base size and the
      expected relation count in closed form. IF IT DOES NOT, THE MODEL IS
      UNDERSPECIFIED AND THAT IS THE FINDING, reported as such rather than patched.
    - >-
      A complete discrete logarithm in a small tower field of the same shape is
      reachable within the declared budget at at least two sizes. If it is not, the
      calibration is UNAVAILABLE and every extrapolation must say so.
    - >-
      UNITS, AND THIS IS WHERE THIS QUESTION HAS THE MOST ROOM TO GO WRONG.
      OPERATIONS ARE COUNTED IN NAMED FIELD MULTIPLICATIONS IN A NAMED FIELD.
      MEMORY IS COUNTED IN BITS. THE TWO ARE NEVER DIVIDED INTO EACH OTHER AND
      NEVER ADDED. An -effective bits- figure is not a ratio of the two- it is the
      base-2 logarithm of a COST computed from both under a declared machine model,
      and every such figure carries the conversion that produced it. A row without
      its conversion is inadmissible.
    - >-
      Every claimed logarithm in the calibration arm carries a certificate - the
      recovered exponent re-verified by exponentiation in an INDEPENDENT
      implementation - before any figure derived from that run is recorded, per the
      RQ constraint.
  proof_search_map:
    not_applicable_reason: >-
      A cost-model computation and a calibration measurement. No theorem, bound,
      certificate family, reduction or closure argument is proposed- the sieve
      complexity model is taken from the literature (unread at source by this
      agent) and is evaluated rather than derived. The band computation in
      statement (C) sizes a threshold before compute. Recorded rather than omitted
      per docs/inventor-protocol.md section 8.
    bottleneck: null
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms:
      - transform: null
        proposed_object: null
        predicted_gain: null
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations:
      - claim: null
        responsibility: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-PAIRMEM-1
      formal_statement: >-
        The relation-matrix dimension and average row weight measured at small
        tower sizes agree with the closed-form prediction from the model own
        smoothness bound, to within a stated ratio, and that ratio TRENDS
        predictably with size so it can be carried through an extrapolation as an
        interval rather than as a point.
      random_model_justification: >-
        NONE THAT IS RIGOROUS, AND THIS IS THE WEAK POINT OF THE RECORD, STATED
        PLAINLY. Sieve cost models are asymptotic with unspecified constants, so at
        small sizes an order-of-magnitude disagreement is EXPECTED and it is the
        TREND across sizes that carries information. A flat ratio would be
        surprising and more valuable than agreement. No random model is imitated
        and none is claimed.
      supporting_results:
        - ref: RQ-PAIR-f2e31f
          provenance: internal
          claim: >-
            VERBATIM- the requirement to state the matrix dimension and weight the
            model implies at deployment parameters and charge memory explicitly;
            that every cost figure is reported as an (operations, memory) pair with
            the machine model named and that a scalar bit level with no memory
            statement is not admissible output; that no cost claim may be recorded
            before the exTNFS reference and at least one pairing-curve key-size
            estimation paper are filed as KN-LIT entries; that the calibration DL
            must be certified before any extrapolated figure is recorded; and that
            a failed or incomplete computation is a budget outcome about a solver
            and never evidence about the curve.
          verified_by: >-
            coordinator, TASK-20260904-65b023 - RQ-PAIR-f2e31f read in full this
            task, 85 lines; every quoted clause is verbatim.
        - ref: IDEA-20260809-15e1cd
          provenance: internal
          claim: >-
            The record the source proposal relies on for its calibration data. IT
            IS AN UNCONVERTED PROPOSAL- status proposed, proposed_by
            idea-generator, no hypothesis, no experiment contract and no run
            record; its own source_refs read -exTNFS primary reference, RECALLED,
            REQUIRED READ, NOT YET READ-. THIS IS A NEGATIVE FINDING and it is why
            the measured-versus-predicted control is brought inside this
            hypothesis instead of depending on that record.
          verified_by: >-
            coordinator, TASK-20260904-65b023 - IDEA-20260809-15e1cd read in full
            this task, 62 lines.
        - ref: >-
            exTNFS complexity and pairing-curve key-size estimation - the
            Kim-Barbulescu line and the standard post-exTNFS key-size updates
          provenance: recalled
          claim: >-
            The asymptotic cost model for discrete logarithms in the target field,
            and the published bit levels the deployment stack quotes. NO SOURCE WAS
            OPENED BY THIS AGENT and the RQ own provenance block already marks
            these as RECALLED AND UNVERIFIED. Under AGENTS.md rule 9 this
            discharges nothing and, under the RQ own constraint, no cost claim may
            be recorded until they are filed as KN-LIT entries by an agent that
            reads them.
          verified_by: null
      validation_experiment_ids:
        - EXP-ICEX-9045dc
      falsification_condition: >-
        The predicted matrix parameters disagree with the measured ones at the
        calibration sizes by a ratio that does not trend, or that trends in a
        direction the model cannot accommodate. The extrapolation is then
        unanchored and is withdrawn rather than reported with a wider interval.
  structural_ingredients:
